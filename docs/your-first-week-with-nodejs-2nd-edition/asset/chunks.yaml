    UTF-8\">\n  <title>page hits</title>\n</head>\n<body>\n\n<p>\n  此页面已被访问过\n   \
    \ <script src=\"http://localhost:3000/counter.js\"></script>\n  次。\n</p>\n\n</body>\n\
    </html>\n```\n\n在另一个终端中从此文件夹运行 `ss`：\n\n```\ncd testpages\nss\n```\n\n在 `http://localhost:8888`\
    \ 启动一个静态文件服务器：\n\n```\nserver address: http://localhost:8888\nroot folder   :\
    \ ./testpages/\n```\n\n在浏览器中打开 [`localhost:8888/page-jswrite.html`](http://localhost:8888/page-jswrite.html)，并在刷新页面时观察访问次数的增加。你可以在其他\
    \ HTML 文件中 get 类似的代码，以便每个文件都拥有自己唯一的访问计数器。\n\n完整的示例代码可以通过 [`github.com/sitepoint-editors/pagehit-ram`](https://github.com/sitepoint-editors/pagehit-ram)\
    \ 获取。\n\n在两个终端中按 `Ctrl`/`Cmd` + `C` 停止运行的 Node.js 应用。\n\n# 页面访问 v2.0：文件存储\n\n\
    将页面计数器存储在内存中意味着每次重启 Node.js 应用时它们都会重置。通过定期将计数器保存到文件中可以改进该系统。以下是实现此点的步骤：\n\n1.\
    \ 当应用程序启动时，如果有必要，会在项目中创建一个 `data` 目录。（如果你正在使用 Git，请向 `.gitignore` 文件中添加 `data/`。）\n\
    2. 当页面计数器加 1 时，服务器将在十秒后触发保存事件。（这确保了保存操作作为后台任务执行，并在高负载期间进行节流处理。）\n3. `pagehit.js`\
    \ 中的 `this.counter` 属性被转换为 JSON 字符串，并保存到具有唯一名称（基于当前日期/时间）的文件中。\n4. 一旦文件保存成功，将删除\
    \ `data` 目录中之前的所有文件。这些文件可能是用户手动添加的，或者是因为旧文件未被删除（由于权限更改、进程崩溃等原因）。\n5. 在随后的启动中，应用程序将查找\
    \ `data` 目录中最新的 JSON 文件并将其导入到 `this.counter`。\n\n页面访问服务器并不关心 `lib/pagehit.js`\
    \ 是如何实现的，只要它能执行 `count()` 方法即可。我们只需要更新该逻辑；无需更改 `index.js`。\n\n完整的示例代码可以通过 [`github.com/sitepoint-editors/pagehit-file`](https://github.com/sitepoint-editors/pagehit-file)\
    \ 获取。\n\n## Node.js 文件系统 API\n\nNode.js 提供了详尽的[文件系统 (`fs`) API](https://nodejs.org/dist/latest/docs/api/fs.html)，用它可以操作、读取和写入文件及目录。Node.js\
    \ 的早期版本提供了基于回调的函数，这些函数目前仍然可用。例如：\n\n```javascript\n// 将当前日期追加到文件中\nconst fs =\
    \ require('fs');\n\nfs.appendFile('myfile.txt', new Date(), (err) => {\n  if (err)\
    \ {\n    console.log('file update failed:', err);\n  }\n  else {\n    console.log('file\
    \ updated');\n  }\n});\n```\n\n同样提供了同步的 `'sync'`对应方法。然而，这些不是基于 Promise 的，并且会在完成之前阻塞整个\
    \ Node.js 进程。除非你正在为旧版本的 Node.js 编写应用程序初始化函数，否则最好避免使用：\n\n```javascript\n// 将当前日期追加到文件中\n\
    const fs = require('fs');\n\ntry {\n  fs.appendFileSync('myfile.txt', new Date());\n\
    \  console.log('file updated');\n}\ncatch (err) {\n  console.log('file update\
    \ failed:', err);\n}\n```\n\n可以使用 [`util.promisify`](https://nodejs.org/dist/latest/docs/api/util.html#util_util_promisify_original)\
    \ 对任何文件系统函数进行 `Promisify`：\n\n```javascript\nconst\n  util = require('util'),\n\
    \  fs = require('fs'),\n  appendFilePromise = util.promisify(fs.appendFile);\n\
    \nappendFilePromise('myfile.txt', new Date())\n  .then(() => console.log('file\
    \ updated'))\n  .catch(err => console.log('file update failed:', err));\n```\n\
    \n然而，在最近的 Node.js 版本中这不再是，因为 [`fs.promises`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fs_promises_api)提供了所有文件系统函数基于\
    \ Promise 的对应方法：\n\n```javascript\nconst\n  fs = require('fs'),\n  fsPromise =\
    \ fs.promises;\n\nfsPromise.appendFile('myfile.txt', new Date())\n  .then(() =>\
    \ console.log('file updated'))\n  .catch(err => console.log('file update failed:',\
    \ err));\n```\n\n## 第 1 ：文件实用程序\n\n```javascript\n'use strict';\n\nconst fs =\
    \ require('fs');\nconst fsPromise = fs.promises;\n\nfunction info(fn) {\n  const\
    \ file = {\n    path: fn,\n    exists: false,\n    read: false,\n    write: false,\n\
    \    isFile: false,\n    isDir: false,\n    time: 0\n  };\n\n  return Promise.all([\n\
    \    fsPromise.access(fn, fs.constants.F_OK),\n    fsPromise.access(fn, fs.constants.R_OK),\n\
    \    fsPromise.access(fn, fs.constants.W_OK)\n  ])\n  .then(fInfo => {\n    file.exists\
    \ = !fInfo[0];\n\n    if (!file.exists) return file;\n    else {\n      file.read\
    \ = !fInfo[1];\n      file.write = !fInfo[2];\n\n      return fsPromise.stat(fn)\n\
    \        .then(fStat => {\n          file.isFile = fStat.isFile();\n         \
    \ file.isDir = fStat.isDirectory();\n          file.time = fStat.mtimeMs;\n  \
    \        return file;\n        })\n        .catch(() => file);\n    }\n  })\n\
    \  .catch(() => file);\n}\n```\n\n```javascript\n// 如果可以使用则返回文件夹信息对象\nasync function\
    \ folderUsable(folder) {\n  try {\n    // 获取文件夹信息\n    let fInfo = await info(folder);\n\
    \n    // 如果时创建文件夹\n    if (!fInfo.isDir) {\n      await fsPromise.mkdir(folder);\n\
    \      fInfo = await info(folder);\n    }\n\n    // 文件夹可访问？\n    return (fInfo.isDir\
    \ && fInfo.read && fInfo.write ? fInfo : false);\n  }\n  catch (err) {\n    console.log('folderUsable\
    \ error:', err);\n    return false;\n  }\n}\n```\n\n`folderList()` 函数返回目录中每个文件的信息对象。它可以可选地按文件扩展名过滤并按创建日期等因素进行排序。`fs`\
    \ [`readdir`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_readdir_path_options)\
    \ 方法获取所有文件名到一个数组。这些文件名使用 [`Promise.all`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all)\
    \ 转换为信息对象，该方法并行执行异步代码：\n\n"
- fmt: "\n```javascript\n// return a sorted array of info objects for all files in\
    \ a folder\nasync function folderList(folder, ext = '', sortBy = 'time') {\n \
    \ try {\n    // names of all files in folder\n    let filelist = await fsPromise.readdir(folder);\n\
    \n    // fetch file info\n    filelist = await Promise.all(\n      filelist.map(async\
    \ f => await info(folder + f))\n    );\n\n    // remove unreadable files and sort\n\
    \    return filelist\n      .filter(fn => fn.isFile && fn.read && fn.path.endsWith(ext))\n\
    \      .sort((f1, f2) => f2[sortBy] - f1[sortBy]);\n\n  }\n  catch (err) {\n \
    \   console.log('folderList error', err);\n    return false;\n  }\n}\n```\n\n\
    A `write()` function uses the `fs` [`writeFile`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_writefile_file_data_options)\
    \ method to output content to a file:\n\n```javascript\n// create a file, returns\
    \ true or false\nasync function write(fn, content = '') {\n  try {\n    await\
    \ fsPromise.writeFile(fn, content);\n    return true;\n  }\n  catch (err) {\n\
    \    console.log('write error', err);\n    return false;\n  }\n}\n```\n\nAn `unlinkMany()`\
    \ function deletes all files passed in an array of path strings or information\
    \ objects. The `fs` [`unlink`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_unlink_path)\
    \ method is processed in parallel on all items:\n\n```javascript\n// delete an\
    \ array of files, return array of true/false\nasync function unlinkMany(fnlist)\
    \ {\n  return await Promise.all(\n    fnlist.map(async fn => {\n      try {\n\
    \        await fsPromise.unlink(fn.path ? fn.path : fn);\n        return true;\n\
    \      }\n      catch (err) {\n        console.log('unlink error', err);\n   \
    \     return false;\n      }\n    })\n  );\n}\n```\n\nFinally, the public functions\
    \ are exported for use in other modules:\n\n```javascript\n// public functions\n\
    module.exports = {\n  info,\n  folderUsable,\n  folderList,\n  write,\n  unlinkMany\n\
    };\n```\n\n### Step 2: Modify `lib/pagehit.js`\n\nThe original `lib/pagehit.js`\
    \ file is modified to save counter data to a file. Additional modules and configuration\
    \ variables are required:\n\n```javascript\nconst\n  // modules\nfileUtil = require('./fileutil'),\n\
    httpReferrer = require('./httpreferrer'),\n\n// default data folder\npath = require('path'),\n\
    dataFolder = path.resolve('./data') + path.sep,\n\n// file save throttling - no\
    \ more than every 10 seconds\nsaveFrequency = 10 * 1000;\n```\n\nThe [`path` module](https://nodejs.org/dist/latest/docs/api/path.html)\
    \ provides useful cross-platform file path-parsing functions. In this case, it’s\
    \ used to obtain the absolute name of a directory for saving data (`data` in the\
    \ project’s folder).\n\nThe `constructor()` imports previous data from a file.\
    \ Note that class constructors can’t be `async` themselves, but can run immediately\
    \ involved `async` functions:\n\n1.  Set the `folder` property to a file information\
    \ object when the `data` directory is available (`fileUtil.folderUsable` will\
    \ attempt to create it). The application resorts to memory-only counters if saving\
    \ is not possible.\n\n2.  Set the `saved` property to an array of information\
    \ objects about each `.json` file in that directory. The array is sorted by creation\
    \ time with the most recent first.\n\n3.  If at least one `.json` file exists,\
    \ it’s imported using `require`, which usefully converts it to a real JavaScript\
    \ object. The previously saved data is merged into the `counter` property.\n\n\
    ```javascript\n// initialize\nconstructor() {\n  // counter storage\n  this.counter\
    \ = {};\n\n  (async () => {\n    // store folder available?\n    this.folder =\
    \ await fileUtil.folderUsable(dataFolder);\n    if (!this.folder) return;\n\n\
    \    // fetch all JSON files sorted most recent first\n    this.saved = await\
    \ fileUtil.folderList(this.folder.path, '.json');\n\n    // import and merge latest\
    \ data\n    if (this.saved.length) {\n      Object.assign(this.counter, require(this.saved[0].path));\n\
    \    }\n  })();\n}\n```\n\nThe `count()` method is changed to start a 10-second\
    \ timer whenever a page counter is incremented. Further page hits don’t alter\
    \ this timer, so `this.save()` is called 10 seconds after the first update occurs.\
    \ Therefore, saving cannot occur more frequently than every 10 seconds and runs\
    \ as a background task so the updated counter can be returned immediately.\n\n\
    ```javascript\n// increase URL counter\ncount(req) {\n  let hash = httpReferrer(req);\n\
    \  if (!hash) return null;\n\n  // define count default\n  this.counter[ hash\
    \ ] = this.counter[ hash ] || 0;\n\n  // save event\n  this.saveTimer = this.saveTimer\
    \ || setTimeout(this.save.bind(this), saveFrequency);\n\n  // return incremented\
    \ count\n  return ++this.counter;\n}\n```\n\nThe `save()` method does the following:\n\
    \n1.  It converts the `counter` property to a string and saves it.\n2.  If saving\
    \ is successful, existing `.json` files are deleted.\n3.  The `saveTimer` property\
    \ is reset.\n\n```javascript\n// store latest data\nasync save() {\n  // can save\n\
    \  if (!this.folder) return;\n\n  // save new file\n  let fn = `${this.folder}hit${new\
    \ Date()}.json`;\n\n  if (await fileUtil.write(fn, JSON.stringify(this.counter)))\
    \ {\n    console.log(`page stored: ${fn}`);\n\n    // delete old files\n    fileUtil.unlinkMany(this.saved);\n\
    \n    // add current file to saved\n    this.saved = [{ path: fn }];\n  }\n\n\
    \  // reset timer\n  this.saveTimer = null;\n}\n```\n\n### Step 3: Test\n\nStart\
    \ the server again using `npm run debug`. If saving is possible, a `data` sub-directory\
    \ will appear. Use the [same test page](#node11-step-4-test-page) as before and\
    \ refresh a few times. Within 10 seconds, a file will appear in the `data` folder\
    \ with a name such as `hit1579705252776.json`. It will contain (minified) hit\
    \ data. For example:\n\n```json\n{\n  \"987c5e69bb367d3d5e4f4412be35a0ab\": 1,\n\
    \  \"3fe347a2c564240ecb823460ecd876\": 2\n}\n```\n\nNew data files are created\
    \ every 10 seconds when necessary. You can restart the project server and the\
    \ number of hits will be retained.\n\nThe full code is available from [https://github.com/sitepoint-editors/pagehit-file](https://github.com/sitepoint-editors/pagehit-file).\n\
    \n## Job Done?\n\nWhile these examples work, they’re not intended for production\
    \ use, and you may have spotted potential problems:\n\n- The service is simplistic.\
    \ It retains a total count, but couldn’t be used to determine how many people\
    \ accessed within a period, such as today or this week.\n- A counter for every\
    \ page is always retained in memory. All OS processes have a memory limit and\
    \ a busy service would eventually fail.\n- File handling is difficult, and a busy\
    \ service would need to save many megabytes of data every few seconds. It would\
    \ be possible to split data into multiple files or only append changed counters,\
    \ but file handling would become even more complicated.\n- File saving can fail—for\
    \ example, if disk space runs out or the process halts during a save operation.\
    \ It may be possible to return to a previous file, but data would be lost.\n-\
    \ Data is also lost if a counter is updated during a file save operation and the\
    \ service is stopped soon afterwards!\n\nAll these issues can be solved with a\
    \ database, which can take responsibility for storing page hit information.\n\n\
    These are the next steps for you to take:\n\n1. Discover how Docker can be used\
    \ for Node.js development, including database application management.\n2. Rewrite\
    \ the page hit service to use MySQL or MongoDB.\n3. Use various tools and techniques\
    \ to debug your Node.js code.\n\n# Chapter 3: Understanding module.exports and\
    \ exports in Node.js\n\n### by James Hibbard\n"
