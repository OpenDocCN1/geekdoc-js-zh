    还有其他的测试双胞（test doubles），它们可以执行如在代码运行时提供返回值的反馈等操作。某些测试框架自带定义多种类型测试双胞的功能，或者可以通过扩展来包含比默认更多的类型。一旦你深入软件测试的世界，你可能会发现其中包含的各种可能性而感到惊讶。


    你可以尝试自己编写所有工具来处理这些测试需求，也可以选择一个功能完备的开箱即用测试框架。那么让我们聊聊在 Node 世界中你拥有的的一些选择。


    ## 自动化测试框架


    一旦我们决定需要超越 Node 内置的 `assert` 功能并开始使用专门的测试框架，我们就会面临着大量的选择。由于这些不同的选项之间存在大量重叠，因为它们都以略有不同的方式执行相似的任务，以适应不同类型的开发。我们可以根据它们最显著的特征来考虑这些工具。


    ### Jasmine 是最古老的


    Jasmine 的历史可以追溯到 2010 年之前的时代，当时 JavaScript 主要被认为是一种基于浏览器的前端开发解决方案。[Jasmine](https://jasmine.github.io/)
    在为社区引入行为驱动开发（BDD）方面有着悠久的历史。它很好地跟上了 Node 生态系统的步伐，并且仍然是一个可行的选择。


    Jasmine 独立运行效果良好，但对于测试套件的深度自动化，你需要依赖像 [Karma](https://karma-runner.github.io/2.0/index.html)
    这样独立的测试运行器。它经过了实战检验且文档齐全，因此你通常可以在需要时找到帮助。


    ### Jest 是最流行的


    如今开始测试你的 Node 应用的最快方法之一是使用 [Jest](https://jestjs.io/)，它是 Node 测试领域中相对较新的秀。它的迅速走红可能归功于它源自
    Facebook 工程师社区（[React](https://reactjs.org/) 就诞生于那里），以及它在服务器端和客户端的 React 开发中都具有极的易用性。


    如果你是一个熟悉 Jasmine 等工具的老派 JavaScript 开发者，你可能会发现很多相似之处，因为 Facebook 在构建 Jest 时使用了
    Jasmine 作为基础。但 Jest 已经从内里到外经过了完全的重构，以提供更快速、更整洁且更容易管理的测试。


    ### Mocha/Chai 是最全面的


    虽然 [Mocha](https://mochajs.org/) 比其他某些解决方案需要更多配置，并且可以利用 Node 内置的 `assert` 方法，但当与
    [Chai](https://www.chaijs.com/) 断言库配合使用时，它可以访问更广泛的工具集。因为它的存在时间更长，并且有一套支持良好的潜在插件，它可能可能是最多功能的测试选项。


    Mocha 依赖于你告诉它你希望它做什么来支持你可能想要的功能和行为。作为交换，它让你能够访问广泛的插件和扩展，这些插件可以随着你测试需求的成熟而增长，而且在你需要帮助时有一个深厚的用户社区可以提供支持。


    ### Cypress 是最新的


    利用现代 Node 开发的端到端特性，[Cypress](https://www.cypress.io/) 提供了一种集成方式，可以从后端到浏览器测试你的应用程序。Cypress
    抛弃了 Selenium 等用于检查前端情况的旧工具，它构建在 Mocha 和 Chai 之上。


    Cypress [曾被批评](https://help.testim.io/docs/why-not-cypress) 试图控制 JavaScript 中的一切内容，这可能会以牺牲其通用性为代价，并且携带了一些旧遗留
    JavaScript API 的包袱。这对于大多数用例来说可能是一个问题，也可能不是，而且它正在被积极开发和支持，所以它绝对是一个值得尝试的选项。


    ## 现在开始


    如果你以前没做过测试，测试似乎是对你工作的一种不受欢迎的干扰。无论你是一个来自在服务器上使用 JavaScript 的想法听起来很奇怪的时代的 Web 开发先驱，还是出生在一个已经习惯
    Node 单语言端到端开发便利性的世界的新手探险家，都是如此。


    但任何程度的测试都比没有好。你不会随随便便走上一片结冰湖，而至少不会用脚趾探探前面的冰，看看它是否足够厚以至于让你掉进去。你的应用程序难道不值得至少同样的照顾吗？


    无论你的代码现在有多大、多臃肿，开始编写测试永远不是坏时机。为你添加的每一个新功能写几个测试。写一些测试来验证最关键的行为，这样你就可以确保它们在代码演进时不会崩溃。如果你现在手里只有
    `assert`，现在就从在平文件中使用它开始。当你需要时，你随时可以重构为更复杂的结构。尽管开始吧！


    # 第 10 章：如何在 Node.js 中使用 SSL/TLS


    #### 作者 Florian Rappl 和 Almir Bijedic


    在 2020 年，你的网站没有理由不使用 HTTPS。访问者期望它，Google 将其作为排名因素，浏览器制造商也会乐于点名并指责那些不使用它的网站。


    在教程中，我将带你通过一个实际示例，介绍如何为你的 Express.js 服务器添加由 [Let’s Encrypt](https://letsencrypt.org/)
    生成的证书。


    但用 HTTPS 保护我们的网站和应用是不够的。我们还应该要求通信的服务器提供加密连接。我们将看到，激活 SSL/TLS 的可能性是存在的。


    #### NGINX 的 SSL


    如果你正在寻找如何在将 NGINX 作为反向代理时设置 SSL 的说明，请查看我们的技巧“[配置 NGINX 与 Node.js](https://www.sitepoint.com/configuring-nginx-ssl-node-js/)”。


    ## 全处 HTTPS


    [HTTP/2 规范](https://en.wikipedia.org/wiki/HTTP/2) 于 2015 年 5 月作为 RFC 7540 发布，这意味着它是标准的一部分。这是一个巨大的里程碑。现在我们都可以升级服务器以使用
    HTTP/2。其最重要的方面之一是与 HTTP 1.1 的向后兼容，以及选择不同协议的协商机制。虽然标准没有规定加密，但目前没有浏览器支持未加密的 HTTP/2。这为
    HTTPS 提供了助力。


    我们的栈实际上是什么样的？从浏览器运行网站的角度来看，我们需要经过以下层到达 IP 层：


    1. 客户端浏览器

    2. HTTP

    3. SSL/TLS

    4. TCP

    5. IP


    HTTPS 只是 SSL/TLS 之上的 HTTP 协议。因此 HTTP 的所有规则仍然适用。这个额外的层为我们提供了什么？通过密钥和证书获得了认证；某种隐私和机密性得到了保证，因为连接是非对称加密的；数据完整性也得到了保护，因为传输的数据在过程中无法被更改。


    常见的迷言之一是使用 SSL/TLS 计算开销很大并减慢服务器。这现在完全不是事实。我们不再需要任何特殊的加密硬件。即使对于 Google 来说，[SSL/TLS
    层占用的 CPU 负载不到 1%，与 HTTP 相比，HTTPS 网络开销也低于 2%](https://www.imperialviolet.org/2010/06/25/overclocking-ssl.html)。总而言之，为了这一点点开销而放弃
    HTTPS 是没有意义的。


    正如 Ilya Grigorik 所说，性能问题恰只有一个：


    > TLS 恰好存在一个性能问题：它被使用得不够广泛。其他一切都可以优化。


