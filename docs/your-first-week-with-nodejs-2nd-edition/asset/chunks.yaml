  trans: "\n\n许多网站都会建议你前往 [Node 官方下载页面](https://nodejs.org/en/download/) 并获取适用于你系统的\
    \ Node 二进制文件。虽然这种方法可行，但我建议你使用版本管理器（version manager）。这是一个程序，允许你安装多个版本的 Node 并在它们之间随意切换。使用版本管理器有许多优点。例如，它可以消除在配合\
    \ `npm` 一起使用 Node 时可能遇到的权限问题，并允许你为每个项目设置 Node 版本。\n\n如果你想尝试版本管理器的路线，请参阅我们的快速贴士：[使用\
    \ nvm 安装多个版本的 Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。否则，请从上面的链接获取适用于你系统的正确二进制文件并安装它们。\n\
    \n### 用 Node.js 的方式编写“Hello, World!”\n\n你可以通过打开终端并输入 `node -v` 来检查系统是否已安装了 Node。如果一切顺利，你应该能看到类似\
    \ `v12.14.1` 的显示。这是本文编写时的当前 LTS（长期支持）版本。\n\n接下来，创建一个新文件 `hello.js` 并复制以下代码：\n\n\
    ```\nconsole.log(\"Hello, World!\");\n```\n\n这使用了 Node 的[内置控制台模块](https://nodejs.org/api/console.html#console_console)\
    \ 在终端窗口中显示消息。要运行此示例，请输入以下命令：\n\n```\nnode hello.js\n```\n\n如果 Node.js 配置正确，屏幕将显示“Hello,\
    \ World!”。\n\n### Node.js 对现代 JavaScript 有极佳的支持\n\n从这个[兼容性表格](https://node.green/)\
    \ 可以看出，Node 对 ECMAScript 2015 (ES6) 及更高版本具有极佳的支持。由于你只针对一个运行时（特定的 V8 引擎版本），这意味着你可以使用最新、最现代的语法来编写\
    \ JavaScript。这也意味着你通常不需要担心兼容性问题——这就像你不会编写要在不同浏览器中运行的 JavaScript 时那样担心。\n\n为了说明这一点，这里有第二个程序，它使用了多个现代\
    \ JavaScript 特性，例如标签化的[模板字符串](https://www.sitepoint.com/understanding-ecmascript-6-template-strings/)、对象解构](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/)\
    \ 以及 [`Array.prototype.flatMap()](https://thecodebarbarian.com/whats-new-in-es2019-flat-flatmap-catch.html#arrayflat-and-arrayflatmap):\n\
    \n```\nfunction upcase(strings, ...values) {\n  return values.map(name => name[0].toUpperCase()\
    \ + name.slice(1))\n    .join(' ') + strings[2];\n}\n\nconst person = {\n  first:\
    \ 'brendan',\n  last: 'eich',\n  age: 56,\n  position: 'CEO of Brave Software',\n\
    };\n\nconst { first, last } = person;\nconst emoticon = [ ['┌', '('], ['˘', '⌣'],\
    \ ['˘', ')', 'ʃ'] ];\n\nconsole.log(\n  upcase`${first} ${last} is the creator\
    \ of JavaScript! ` + emoticon.flat().join('')\n);\n```\n\n将此代码保存为名为 `index.js`\
    \ 的文件，并在终端中使用命令 `node index.js` 运行它。你应该会在终端看到输出 `Brendan Eich is the creator of\
    \ JavaScript! ┌(˘⌣˘)ʃ`。\n\n### 介绍 npm，JavaScript 包管理器\n\n正如我之前提到的，Node 附带了一个名为\
    \ `npm` 的包管理器。要检查你系统上安装了哪个版本，请输入 `npm -v`。\n\n除了作为 JavaScript 的包管理器，`npm` 还是全球最大的软件仓库。有超过\
    \ 100 万个 JavaScript 代码包可供，每周下载量达数十亿。让我们快速查看如何使用 `npm` 安装一个包。\n\n### 全局安装包\n\n\
    打开终端并输入以下内容：\n\n```\nnpm install -g jshint\n```\n\n这将在系统上全局安装 [jshint 包](https://www.npmjs.com/package/jshint)。我们可以使用它来对上一个示例中的\
    \ `index.js` 文件进行代码检查：\n\n```\njshint index.js\n```\n\n你现在应该看到许多 ES6 相关的错误。如果你想修复它们，可以在\
    \ `index.js` 文件的顶部添加 `/* jshint esversion: 6 */`，重新运行命令，代码检查应该就能通过。\n\n如果你想复习一下代码检查（linting），请查看\
    \ [JavaScript 代码检查工具对比](https://www.sitepoint.com/comparison-javascript-linting-tools/)。\n\
    \n### 本地安装包\n\n我们也可以将包本地安装到项目中，而不是在全局全局。创建一个 `test` 文件夹并在该目录下打开终端。接下来输入：\n\n```\n\
    npm init -y\n```\n\n这将在同一文件夹中创建并自动填充一个 `package.json` 文件。接下来，使用 `npm` 安装 [lodash\
    \ 包](https://www.npmjs.com/package/lodash) 并将其保存为项目依赖：\n\n```\nnpm install lodash\
    \ --save\n```\n\n创建一个名为 `test.js` 的文件并添加以下内容：\n\n```javascript\nconst _ = require('lodash');\n\
    \nconst arr = [0, 1, false, 2, '', 3];\nconsole.log(_.compact(arr));\n```\n\n\
    最后，使用 `node test.js` 运行脚本。你应该会在终端看到输出 `[1, 2, 3]`。\n\n### 使用 `package.json` 工作\n\
    \n如果你查看 `test` 文件夹的内容，你会发现有一个 `node_modules` 文件夹。这是 `npm` 保存 lodash 以及 lodash\
    \ 依赖的任何库的地方。`node_modules` 文件夹不应该提交到版本控制中，实际上，你也可以随时在项目中运行 `npm install` 来重新创建它。\n\
    \n如果你打开 `package.json` 文件，你会在 `dependencies` 字段下列出 lodash。如果你想了解更多关于 `npm` 的信息，请务必阅读我们的文章\
    \ [npm——包管理器入门指南](https://www.sitepoint.com/beginners-guide-node-package/)。\n\n\
    ## Node.js 有什么用途？\n\n现在我们已经知道了 Node 和 npm 是什么以及如何安装它们，我们可以将注意力转向它们的最常见用途之一：安装（通过\
    \ npm）和运行（通过 Node）各种构建工具。\n\n这些构建工具种类繁多，如果不遇到它们，你在现代 JavaScript 领域将走不远。它们可以用于从将\
    \ JavaScript 文件和依赖打包成静态资源到运行测试或自动代码检查的任何操作。\n\n我们在 SitePoint 有许多关于构建工具的文章。以下是我精选的几篇：\n\
    \n*   [Webpack 入门指南](https://www.sitepoint.com/webpack-beginner-guide/)\n*   [使用\
    \ ESLint——可扩展的 JavaScript 代码检查](https://www.sitepoint.com/up-and-running-with-eslint-the-pluggable-javascript-linter/)\n\
    *   [Gulp.js 简介](https://www.sitepoint.com/introduction-gulp-js/)\n*   [使用 Mocha\
    \ 和 Chai 进行 JavaScript 单元测试](https://www.sitepoint.com/unit-test-javascript-mocha-chai/)\n\
    \n如果你使用任何现代 JavaScript 框架开发应用（例如 React 或 Angular），会被会被具备 Node 和 npm（可能是 [Yarn](https://www.sitepoint.com/yarn-vs-npm/)）的操作知识。这并不是因为你需要\
    \ Node 后端来运行这些框架。你不需要。相反，是因为这些框架以及许多相关包都通过 npm 提供，并依赖 Node 创建一个可以运行的合理开发环境。\n\n\
    如果你对了解 Node 在现代 JavaScript 应用中扮演的角色感兴趣，请阅读 [现代 JavaScript 应用的剖析](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)。\n\
    \nNode.js 让我们能够在服务器上运行 JavaScript\n\n"
- fmt: "\nNext we come to one of the biggest use cases for Node.js—running JavaScript\
    \ on the server. This isn’t a new concept, and was first attempted by Netscape\
    \ way back in 1994. Node.js, however, is the first implementation to gain any\
    \ real traction, and it provides some unique benefits, compared to traditional\
    \ languages. Node now plays a critical role in the technology stack of [many high-profile\
    \ companies](https://www.netguru.co/blog/top-companies-used-nodejs-production).\
    \ Let’s have a look at what those benefits are.\n\n### The Node.js Execution Model\n\
    \nIn very simplistic terms, when you connect to a traditional server, such as\
    \ Apache, it will spawn a new thread to handle the request. In a language such\
    \ as PHP or Ruby, any subsequent I/O operations (for example, interacting with\
    \ a database) block the execution of your code until the operation has completed.\
    \ That is, the server has to wait for the database lookup to complete before it\
    \ can move on to processing the result. If new requests come in while this is\
    \ happening, the server will spawn new threads to deal with them. This is potentially\
    \ inefficient, as a large number of threads can cause a system to become sluggish—and,\
    \ in the worst case, for the site to go down. The most common way to support more\
    \ connections is to add more servers.\n\nNode.js, however, is single-threaded.\
    \ It’s also `event-driven`, which means that everything that happens in Node is\
    \ in reaction to an event. For example, when a new request comes in (one kind\
    \ of event) the server will start processing it. If it then encounters a blocking\
    \ I/O operation, instead of waiting for this to complete, it will register a callback\
    \ before continuing to process the next event. When the I/O operation has finished\
    \ (another kind of event), the server will execute the callback and continue working\
    \ on the original request. Under the hood, Node uses the [libuv](https://github.com/libuv/libuv)\
    \ library to implement this asynchronous (that is, non-blocking) behavior.\n\n\
    Node’s execution model causes the server very little overhead, and consequently\
    \ it’s capable of handling a large number of simultaneous connections. The traditional\
    \ approach to scaling a Node app is to clone it and have the cloned instances\
    \ share the workload. Node.js even has [a built-in module](https://nodejs.org/api/cluster.html)\
    \ to help you implement a cloning strategy on a single server.\n\nThe following\
    \ image depicts Node’s execution model:\n\n![Node’s execution model](Images/node_event_loop.png)\n\
    \n*Image source: Introduction to Node.js, by Prof. Christian Maderazo and James\
    \ Santos.*\n\nOr, if you prefer videos, check out this awesome talk: [What the\
    \ heck is the event loop anyway?](https://www.youtube.com/watch?v=8aGhZQkoFbQ)\
    \ It’s not Node-specific, but does a great job of explaining the concept.\n\n\
    ### Are There Any Downsides?\n\nThe fact that Node runs in a single thread does\
    \ impose some limitations. For example, blocking I/O calls should be avoided,\
    \ [CPU-intensive operations should be handed off to a worker thread](https://blog.logrocket.com/node-js-multithreading-what-are-worker-threads-and-why-do-they-matter-48ab102f8b10/),\
    \ and errors should always be handled correctly for fear of crashing the entire\
    \ process.\n\nSome developers also dislike the callback-based style of coding\
    \ that JavaScript imposes (so much so that there’s even [a site dedicated to the\
    \ horrors of writing asynchronous JavaScript](http://callbackhell.com/)). But\
    \ with the arrival of native Promises, followed closely by async await, [flow\
    \ control in modern JavaScript](https://www.sitepoint.com/flow-control-callbacks-promises-async-await/)\
    \ has become easier than it ever was.\n\n### “Hello, World!”—Server Version\n\n\
    Let’s have a quick look at a \"Hello, World!\" example HTTP server:\n\n```\nconst\
    \ http = require('http');\n\nhttp.createServer((request, response) => {\n  response.writeHead(200);\n\
    \  response.end('Hello, World!');\n}).listen(3000);\n\nconsole.log('Server running\
    \ on http://localhost:3000');\n```\n\nTo run this, copy the code into a file named\
    \ `hello-world-server.js` and run it using `node hello-world-server.js`. Open\
    \ up a browser and navigate to [http://localhost:3000](http://localhost:3000)\
    \ to see “Hello, World!” displayed in the browser.\n\nNow let’s have a look at\
    \ the code.\n\nWe start by requiring Node’s native [HTTP module](https://nodejs.org/api/http.html).\
    \ We then use its [createServer](https://nodejs.org/api/http.html#http_http_createserver_options_requestlistener)\
    \ method to create a new web server object, to which we pass an anonymous function.\
    \ This function will be invoked for every new connection that’s made to the server.\n\
    \nThe anonymous function is called with two arguments (`request` and `response`).\
    \ These contain the request from the user and the response, which we use to send\
    \ back a 200 HTTP status code, along with our “Hello World!” message.\n\nFinally,\
    \ we tell the server to listen for incoming requests on port 3000, and output\
    \ a message to the terminal to let us know it’s running.\n\nObviously, there’s\
    \ a lot more to creating even a simple server in Node (for example, it’s important\
    \ to handle errors correctly), so I’d advise you to [check the documentation](https://nodejs.org/en/docs/guides/anatomy-of-an-http-transaction/).\n\
    \n## What Kind of Apps Is Node.js Suited To?\n\nNode is particularly suited to\
    \ building applications that require some form of real-time interaction or collaboration—for\
    \ example, chat sites, or apps such as [Codeshare](https://codeshare.io/), where\
    \ you can watch a document being edited live by someone else. It’s also a good\
    \ fit for building APIs where you’re handling lots of requests that are I/O driven\
    \ (such as those needing to perform operations on a database), or for sites involving\
    \ data streaming, as Node makes it possible to process files while they’re still\
    \ being uploaded. If this real-time aspect of Node is something you’d like to\
    \ look into more, check out our tutorial on [Building a Real-time Chat App](https://www.sitepoint.com/building-real-time-chat-app-sails-js/).\n\
    \nYet saying this, not everyone is going to be building the next Trello or the\
    \ next Google Docs, and really, there’s no reason that you can’t use Node to build\
    \ a simple CRUD app. However, if you follow this route, you’ll soon find out that\
    \ Node is pretty bare-bones and that the way you build and structure the app is\
    \ left very much up to you. There are various frameworks you can use to reduce\
    \ the boilerplate, with [Express](http://expressjs.com) having established itself\
    \ as the front runner. Yet even a solution such as Express is minimal, meaning\
    \ that if you want to do anything slightly out of the ordinary, you’ll need to\
    \ pull in additional modules from npm. This is in stark contrast to frameworks\
    \ such as Rails or Laravel, which come with a lot of functionality out of the\
    \ box.\n\n## What Are the Advantages of Node.js?\n\nAside from speed and scalability,\
    \ an often-touted advantage of using JavaScript on a web server—as well as in\
    \ the browser—is that your brain no longer needs to switch modes. You can do everything\
    \ in the same language, which, as a developer, makes you more productive (and\
    \ hopefully, happier). For example, you can easily share code between the server\
    \ and the client.\n\nAnother of Node’s big pluses is that it speaks JSON. JSON\
    \ is probably the most important data exchange format on the Web, and the lingua\
    \ franca for interacting with object databases (such as MongoDB). JSON is ideally\
    \ suited for consumption by a JavaScript program, meaning that when you’re working\
    \ with Node, data can flow neatly between layers without the need for reformatting.\
    \ You can have one syntax from browser to server to database.\n"
