    Once we have a set of test cases defined, we may want to keep them organized by
    defining a **test suite**. This can be a section of code within a test file, a
    separate file with a set of related tests, or even a nested directory structure
    depending on how complex your needs are. Different testing frameworks recommend
    different ways of structuring and organizing test code, but the same concepts
    apply regardless.


    ### Test Harnesses


    A **test harness** is a system of organization and facilities that supports an
    automated approach for running a set of test cases consistently within any framework.
    The harness should include any resources and data necessary to populate and execute
    the tests the same way every time, so they can be checked for consistent results.


    ### Fixtures


    A **fixture** helps define all the setup required to initialize a system for software
    testing in a specific fixed context. Defining the context before each test is
    run is essential, so you always know you’re starting from the same place with
    all the same inputs and resources. Otherwise, your tests could produce different
    results every time you run them, even if the code you’re testing hasn’t changed.


    ### Test Doubles


    In the real world, our software may have complex, brittle, resource-intensive
    dependencies. We can’t always rely on having access to these in every environment
    where we want to run our tests. They may be too expensive to keep running just
    for testing purposes, they may rely on sensitive data that would be difficult
    to version and update if we made a mistake, or they may simply not be available
    in our testing environment due to regulations and other practical issues.


    But we still need to make sure our code will work as expected under any of these
    conditions. That’s where test doubles such as mocks and stubs come in handy. They
    simulate real-world contexts so we don’t need to have the real thing handy all
    the time.


    A **mock** sits inside of our test fixture and simulates the behavior of a real-world
    object our test may be expecting. Any call for that real-world object in our test
    gets intercepted and provided with the mock object we’ve created. This is very
    useful when the real-world object might vary depending on the time when it was
    called, the precise state of a complex system with many moving parts, a slow or
    expensive data source that would keep our tests from running efficiently as often
    as we need them to, or even a resource that hasn’t been created yet.


    A **stub** provides similar artificial results as a mock, but for functions and
    methods. All calls to a given method are intercepted, providing instead a call
    to the stubbed version of that method. We can program stubs to be as simple as
    we need them to be to support the needs of our testing environment.'
