- fmt: "\n| term | description |\n| :--- | :--- |\n| **log point** | an instruction\
    \ to a debugger to show the value of a variable at a point during execution |\n\
    | **logging** | output of runtime information to the console or a file |\n| **logic\
    \ error** | the program works but doesn’t act as intended |\n| **priority** |\
    \ where a bug is allocated on a list of planned updates |\n| **race condition**\
    \ | hard-to-trace bugs dependent the sequence or timing of uncontrollable events\
    \ |\n| **refactoring** | rewriting code to help readability and maintenance |\n\
    | **regression** | re-emergence of a previously fixed bug perhaps owing to other\
    \ updates |\n| **related** | a bug which is similar or related to another |\n\
    | **reproduce** | the steps required to cause the error |\n| **RTFM error** |\
    \ user incompetence disguised as a bug report, typically followed by a response\
    \ to “Read The *Flipping* Manual” |\n| **step into** | when running code line\
    \ by line in a debugger, step into the function being called |\n| **step out**\
    \ | when running line by line, complete execution of the current function and\
    \ return to the calling code |\n| **step over** | when running line by line, complete\
    \ execution of a command without stepping into a function it calls |\n| **severity**\
    \ | the impact of a bug on system. For example, data loss would normally be considered\
    \ more problematic than a UI issue unless the frequency of occurrence is very\
    \ low |\n| **stack trace** | the historical list of all functions called before\
    \ the error occurred |\n| **syntax error** | typographical errors, such as `console.lug()`\
    \ |\n| **user error** | an error caused by a user rather than the application,\
    \ but may still incur an update depending on that person’s seniority |\n| **watch**\
    \ | a variable to examine during debugger execution |\n| **watchpoint** | similar\
    \ to a breakpoint, except the program is stopped when a variable is set to a specific\
    \ value |\n\n## How to Avoid Bugs\n\nBugs can often be prevented before you test\
    \ your application …\n\n### Use a Good Code Editor\n\nA good code editor will\
    \ offer numerous features including line numbering, auto-completion, color-coding,\
    \ bracket matching, formatting, auto-indentation, variable renaming, snippet reuse,\
    \ object inspection, function navigation, parameter prompts, refactoring, unreachable\
    \ code detection, suggestions, type checking, and more.\n\nNode.js devs are spoiled\
    \ for choice with free editors such as [VS Code](https://code.visualstudio.com/),\
    \ [Atom](https://atom.io/), and [Brackets](http://brackets.io/), as well as plenty\
    \ of commercial alternatives.\n\n### Use a Code Linter\n\nA linter can report\
    \ code faults such as syntax errors, poor indentation, undeclared variables, and\
    \ mismatching brackets before you save and test your code. The popular options\
    \ for JavaScript and Node.js include [ESLint](https://eslint.org/), [JSLint](https://www.jslint.com/),\
    \ and [JSHint](https://jshint.com/).\n\nThese are often installed as global Node.js\
    \ modules so you can run checks from the command line:\n\n```\neslint myfile.js\n\
    ```\n\nHowever, most linters have code editor plugins, such as [ESLint for VS\
    \ Code](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint)\
    \ and [linter-eslint for Atom](https://atom.io/packages/linter-eslint) which check\
    \ your code as you type:\n\n![ESLint for VS Code](Images/eslint.png)\n\n### Use\
    \ Source Control\n\nA source control system such as [Git](https://git-scm.com/)\
    \ can help safe-guard your code and manage revisions. It becomes easier to discover\
    \ where and when a bug was introduced and who should receive the blame! Online\
    \ repositories such as [GitHub](https://github.com/) and [Bitbucket](https://bitbucket.org/)\
    \ offer free space and management tools.\n\n### Adopt an Issue-tracking System\n\
    \n*Does a bug exist if no one knows about it?* An issue-tracking system is used\
