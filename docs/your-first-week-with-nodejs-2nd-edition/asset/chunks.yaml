    \ that request, and output a response.\n\nPress `Ctrl`/`Cmd` + `C` to stop the\
    \ Node.js application running.\n\n### Step 3: Additional Modules\n\nIt’s practical\
    \ to split code into other files with reusable chunks of related functionality.\
    \ Create a new `lib` directory. You can use any name you prefer except for `node_modules`.\
    \ Then add the following files within it:\n\n- `lib/httpreferrer.js`: exports\
    \ a function which accepts an HTTP request object as a parameter. If this object\
    \ has a referer set, the function will concatenate its `protocol`, `host` and\
    \ `pathname` values, then return a 32-character MD5 hash of this string. The URL\
    \ and [Crypto](https://nodejs.org/dist/latest/docs/api/crypto.html) modules are\
    \ used:\n\n```javascript\n  'use strict';\n\n  const\n    url = require('url'),\n\
    \    crypto = require('crypto');\n\n  module.exports = (req) => {\n\n    let\n\
    \      r = url.parse(req.headers.referer || ''),\n      ref = r.href ? r.protocol\
    \ + r.host + r.pathname : null;\n\n    return ref ? crypto.createHash('md5').update(ref).digest('hex')\
    \ : null;\n\n  };\n```\n\n- `lib/httpresponse.js`: exports a function which, when\
    \ passed an object containing an HTTP response object, responds with the appropriate\
    \ HTTP headers and content:\n\n```javascript\n  'use strict';\n\n  module.exports\
    \ = ({\n    res     = null,\n    status  = 200,\n    mime    = 'text/plain',\n\
    \    content = ''\n  }) => {\n\n    res.writeHead(status, {\n      'Access-Control-Allow-Origin':\
    \ '*',\n      'Content-Type': mime\n    });\n    res.end(content);\n\n  };\n```\n\
