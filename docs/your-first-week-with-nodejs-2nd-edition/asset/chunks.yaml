  trans: "\n\n# 进一步固化\n\n## HTTP 严格传输安全\n\n你是否遇到过这样的情况：某个网站从 HTTP 切换到 HTTPS 后，仍然有一些残留的重定向指向\
    \ HTTP？[HTTP 严格传输安全](https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security)（HSTS）是一种网络安全策略机制，用于缓解协议降级攻击和\
    \ Cookie 劫持。\n\nHSTS 有效地强制客户端（访问你服务器的浏览器）通过 HTTPS 直接所有流量——这是一个“要安全要么不要”的理念！\n\n\
    Express JS 默认不允许我们添加此标头，因此我们将使用 [Helmet](https://www.npmjs.com/package/helmet)，这是一个允许我们实现此点的\
    \ Node 模块。运行以下命令安装 `Helmet`：\n\n```\nnpm install helmet\n```\n\n然后我们只需要将其作为中间件添加到\
    \ Express 服务器中即可：\n\n```javascript\nconst https = require(\"https\"),\n  fs =\
    \ require(\"fs\"),\n  helmet = require(\"helmet\");\n\nconst options = {\n  key:\
    \ fs.readFileSync(\"/srv/www/keys/my-site-key.pem\"),\n  cert: fs.readFileSync(\"\
    /srv/www/keys/chain.pem\")\n};\n\nconst app = express();\n\napp.use(helmet());\
    \ // 将 Helmet 作为中间件\n\napp.use((req, res) => {\n  res.writeHead(200);\n  res.end(\"\
    hello world\\n\");\n});\n\napp.listen(8000);\n\nhttps.createServer(options, app).listen(8080);\n\
    ```\n\n### Diffie–Hellman 强参数\n\n为了跳过一些复杂的数学计算，让我们直接进入正题。简单来说，加密使用了两种不同的密钥：我们从证书机构获取的证书，以及服务器为密钥交换生成的密钥。密钥交换的默认密钥（也称为\
    \ [Diffie–Hellman 密钥交换](https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange，或\
    \ DH）使用的密钥比证书密钥要“小得多”。为了弥补这个问题，我们将生成一个强 DH 密钥并将其提供给我们的安全服务器使用。\n\n为了生成更长（2048\
    \ 位）的密钥，你需要 `openssl`，你可能已经默认安装了它。如果你不确定，运行 `openssl -v`。如果未找到命令，运行 `sudo apt\
    \ install openssl` 安装 `openssl`（或访问此[下载页面](https://www.openssl.org/source/) ）：\n\
    \n```\nopenssl dhparam -out /var/www/example/sslcert/dh-strong.pem 2048\n```\n\
    \n然后将文件路径拷贝到配置中：\n\n```javascript\n// ...\n\nconst options = {\n  key: fs.readFileSync(\"\
    /var/www/example/sslcert/privkey.pem\"),\n  cert: fs.readFileSync(\"/var/www/example/sslcert/fullchain.pem\"\
    ), // 这些路径对你来说可能不同，请确保从 certbot 输出中复制\n  dhparam: fs.readFileSync(\"/var/www/example/sslcert/dh-strong.pem\"\
    )\n};\n\n// ...\n```\n\n## 结论\n\n在 2020 年及以后，没有任何理由拒绝 HTTPS。未来的方向显而易见：处处 HTTPS！在\
    \ Node.js 中，我们有很多选项来利用 SSL/TLS。我们可以通过 HTTPS 发布我们的网站，可以向加密网站创建请求，并且可以授权其他不可信的证书。\n\
    \n# 第 11 章：使用 Node.js 配置 NGINX 和 SSL\n\n### 作者：Nilson Jacques\n\n[NGINX](https://www.nginx.com/)\
    \ 既是一个高性能 HTTP 服务器，也是一个[反向代理](https://medium.com/intrinsic/why-should-i-use-a-reverse-proxy-if-node-js-is-production-ready-5a079408b2ca)。与传统服务器不同，NGINX\
    \ 采用事件驱动的异步架构。因此，它的内存占用低且性能高。如果你正在运行基于 Node.js 的 Web 应用，你应该认真考虑使用 NGINX 作为反向代理。\n\
    \nNGINX 在提供静态资源方面非常高效。对于所有其他请求，它将与你的 Node.js 后端通信并将响应发送给客户端。在本教程中，我们将讨论如何配置 NGINX\
    \ 与 Node.js 配合。我们还将看到如何在 NGINX 服务器中设置 SSL。\n\n### Node 内置的 HTTPS 模块\n\nNode 还内置了一个\
    \ HTTPS 模块，可以配置为读取必要的证书文件，而无需反向代理。你可以在我们的文章[如何在 Node.js 中使用 SSL/TLS](https://www.sitepoint.com/how-to-use-ssltls-with-node-js/)\
    \ 中了解更多信息。\n\n## 安装 NGINX\n\n假设你已经在机器上安装了 Node.js（如果没有，请检查[这里](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)），让我们来看看如何安装\
    \ NGINX 吧。\n\n### 在 Linux 上安装\n\n如果你运行的是 Ubuntu，可以使用以下命令安装 NGINX：\n\n```\nsudo\
    \ apt-get update\nsudo apt-get install nginx\n```\n\n如果你运行的是 Ubuntu 以外的 Linux\
    \ 发行版，请查看[NGINX 安装文档](https://docs.nginx.com/nginx/admin-guide/)。\n\n### 在 macOS\
    \ 上安装\n\n如果你运行的是 Ubuntu，可以使用以下命令安装 NGINX：\n\n```\nsudo apt-get update\nsudo apt-get\
    \ install nginx\n```\n\n### 在 Windows 上安装\n\n对于 Windows，前往[下载](https://nginx.org/en/download/)\
    \ 页面并获取压缩包。\n\n## 搭建 Node.js 服务器\n\n首先，让我们创建一个简单的 Node.js 服务器。\n\n```\nmkdir node-demo\
    \ && cd node-demo\nnpm init -y\nnpm i express\n```\n\n创建一个名为 `server.js` 的文件，内容如下：\n\
    \n```javascript\nconst express = require('express')\nconst app = express()\nconst\
    \ port = 3000\n\napp.get('/', (req, res) => res.send('Hello World!'))\n\napp.listen(port,\
    \ () => console.log(`Example app listening on ${port}`))\n```\n\n你可以通过运行 `node\
    \ server.js` 来启动服务器。\n\n## 配置 NGINX\n\n现在打开 NGINX 默认站点配置：\n\n```\nsudo nano /etc/nginx/sites-available/default\n\
    ```\n\n我们根据需要配置 `server`  own。使用 `proxy_pass` 指向 Node.js 应用。\n\n```nginx\nserver\
    \ {\n  listen       80;\n  server_name  localhost;\n\n  location / {\n    proxy_pass\
    \ http://localhost:3000;\n    proxy_http_version 1.1;\n    proxy_set_header Upgrade\
    \ $http_upgrade;\n    proxy_set_header Connection 'upgrade';\n    proxy_set_header\
    \ Host $host;\n    proxy_cache_bypass $http_upgrade;\n  }\n}\n```\n\n"
- fmt: "\nOnce this is done, you can go to [http://localhost](http://localhost) to\
    \ see our proxy in action. Although you’re accessing the NGINX web server, you’ll\
    \ get the actual response from the Node.js server.\n\n## Port 80\n\nYou’ll need\
    \ to make sure there isn’t anything else (such as Apache) running on port 80.\n\
    \n## Setting Up SSL\n\nIn order to create a secure connection with a user’s browser,\
    \ we’ll need to obtain a digital certificate. Normally, you get one of these from\
    \ a certificate authority such as [Let’s Encrypt](https://letsencrypt.org/). If\
    \ you go the Let’s Encrypt route, be sure to install the certificate using [Certbot](https://certbot.eff.org/instructions),\
    \ which will take care of reconfiguring NGINX for you.\n\nFor local development\
    \ (and for following along with this tutorial) you can also [create a self-signed\
    \ certificate](https://www.digitalocean.com/community/tutorials/how-to-create-a-ssl-certificate-on-nginx-for-ubuntu-12-04).\
    \ The only problem is that browsers will show a warning that the “Certificate\
    \ is not Trusted” when someone visits your website. But for testing on your local\
    \ machine that’s perfectly fine.\n\nOnce you have a certificate and a private\
    \ key, you can set up SSL in NGINX. You need to modify our previous server block\
    \ to the following:\n\n```\nserver {\n  listen       80;\n  listen       443 ssl;\n\
    \  server_name  localhost;\n\n  ssl_certificate  /etc/nginx/ssl/server.crt;\n\
    \  ssl_certificate_key /etc/nginx/ssl/server.key;\n\n  location / {\n    proxy_pass\
    \ http://localhost:3000;\n    proxy_http_version 1.1;\n    proxy_set_header Upgrade\
    \ $http_upgrade;\n    proxy_set_header Connection 'upgrade';\n    proxy_set_header\
    \ Host $host;\n    proxy_cache_bypass $http_upgrade;\n  }\n}\n```\n\nThat’s it!\n\
    \nNow, if you access [https://localhost](https://localhost), your connection will\
    \ be secure. The configuration above assumes that the certificate and private\
    \ key are located at `/etc/nginx/ssl/server.crt` and `/etc/nginx/ssl/server.key`\
    \ respectively, but you can change these locations if you wish.\n\n## Bonus: Serving\
    \ Static Assets\n\nAn additional benefit of having NGINX set up in front of our\
    \ Node.js server is that we can easily configure it to serve up any static assets\
    \ our app requires. This will save the overhead of passing through these requests\
    \ for Node to handle.\n\nTo do this, we need to add a new `location` block to\
    \ the server configuration:\n\n```\nserver {\n  listen       80;\n  server_name\
    \  localhost;\n\n  location / {\n    ...\n  }\n\n  location /public {\n    root\
    \ /usr/local/var/www;\n  }\n}\n```\n\nInside this `location` block we set the\
    \ root to `/usr/local/var/www`, but you can choose a different directory if you\
    \ like. As a result, whenever there’s a request to something like `http://localhost/public/somepath/file.html`,\
    \ NGINX will serve the file from `/usr/local/var/www/public/somepath/file.html`\
    \ directly.\n\n## Conclusion\n\nIn this brief tutorial, we’ve seen how to use\
    \ NGINX as a reverse proxy for our Node.js app and configure SSL. By using NGINX\
    \ to handle the static resources, you can also take some load off your Node application.\n\
    \n# Chapter 12: Using Docker for Node.js Development\n\n### by Craig Buckler\n\
    \nNode.js applications rarely exist in isolation. You could require a database,\
    \ caching, message queues, reverse proxies, search, email routing, process monitoring,\
    \ other language runtimes and more! Managing these dependencies on your development\
    \ PC becomes significantly easier with Docker.\n\nThis guide provides an introduction\
    \ to Docker. It concentrates on Node.js, but the concepts apply to any development\
    \ languages or frameworks.\n\n## “But it Works on My Machine!”\n\nImagine you’ve\
    \ created an amazing application with Node.js and a MongoDB database. It’s so\
    \ successful, you’ve had to employ another developer to add new features. They\
    \ clone the repository, run `npm install && npm start` and BANG—it fails with\
    \ an obscure error message.\n\nDespite best intentions, your environments are\
    \ different:\n\n- you use a Mac, they’re using Windows\n- you developed using\
    \ Node.js v12, but they have v10 installed\n- you’re using MongoDB v3.6, they’re\
    \ on v4.2\n\nYou may be able to solve these issues within a few hours, but must\
    \ keep every dependency in sync forever. Is that practical as your team grows?\
    \ Is it compatible with your live server?\n\n## Virtual Machines\n\nA virtual\
    \ machine (VM) is an emulated computer system. Rather than installing an operating\
    \ system (OS) on hardware, it’s run within a software emulation of server hardware.\
    \ Cross-platform VM options include [VMware](https://www.vmware.com/) and [VirtualBox](https://www.virtualbox.org/).\n\
    \nYou could create a Linux VM with all the application dependencies which can\
    \ be run on Windows, macOS, or Linux. Every developer and the live server would\
    \ have the same environment. Unfortunately, VMs quickly become impractical:\n\n\
    - their disk images are large and difficult to copy\n- an individual VM could\
    \ be updated automatically or by the developer so it’s out of sync with others\n\
    - a VM requires considerable resources: a full OS\n\n## Docker Overview\n\n[Docker](https://www.docker.com/)\
    \ is a platform which allows you to build, share, and run applications in containers.\
    \ Think of a container as a virtual machine with its own operating system.\n\n\
    Docker benefits include:\n\n- all developers can use the same Docker images on\
    \ macOS, Linux\n- identical containers can be used in development and production\n\
    - installation, configuration, and maintenance of applications is easier\n- developers\
    \ retain local development and can experiment without risk\n- containers can easily\
    \ be scaled—for example, more Node.js processes added to cope with traffic\n\n\
    containers are lightweight processes which share resources on the host.\n\n##\
    \ Docker Concepts and Terminology\n\nDocker can be daunting initially, but understanding\
    \ a few concepts will aid development.\n\nDocker is a client-server application.\
    \ The server is responsible for container management and is controlled via an\
    \ API. The command-line interface communicates with the API, so it’s possible\
    \ to run the server daemon anywhere and connect from another device.\n\n### Images\n\
    \nA Docker image is a snapshot of a file system and all application files. In\
    \ some cases, you’ll use an image as is from the [Docker Hub](https://hub.docker.com/).\
    \ It provides a wide range of popular applications including [MySQL](https://hub.docker.com/_mysql)\
    \ and [MongoDB](https://hub.docker.com/_mongo).\n\nNode.js applications will normally\
    \ use a [base Node.js image](https://hub.docker.com/_node), which is configured\
    \ using a Dockerfile that describes all the installation and execution steps.\
    \ The resulting image configuration can be pushed to the Docker Hub. That may\
    \ be practical during development or where others want to use your application.\n\
    \nSeparate images should be created for each application your project requires.\
    \ For example, your project could use three containers: a Node.js runtime, a MySQL\
    \ database, and an Elasticsearch engine. It’s technically possible to install\
    \ all three applications inside a single image, but there are no practical benefits\
    \ and management would become more difficult.\n\n### Containers\n\nA container\
    \ is a running instance of an image. One or more containers can be launched from\
    \ a single image, then used, and stopped as necessary.\n\nBy default, a stopped\
    \ container remains available and can be restarted. However, during development\
    \ it’s usually practical to delete a container once it has stopped.\n\nImportantly,\
    \ containers do not retain state. Data saved within a file or database is lost\
    \ whenever a container restarts. You therefore need volumes.\n\n### Volumes\n\n\
    Docker provides two types of storage to retain container state.\n"
