  trans: "\n\n在处理用户提交的值时，请始终使用转义后的输出 `<%= value %>`。只有在确定这样做安全时，才使用原始输出。\n\n## 文件上传\n\
    \n在 HTML 表单中上传文件是一个特殊情况，需要使用 `\"multipart/form-data\"` 编码类型。请参考 [MDN 关于发送表单数据的指南](https://developer.mozilla.org/en-US/docs/Learn/HTML/Forms/Sending_and_retrieving_form_data#A_special_case_sending_files)\
    \ 获取更多关于多部分表单提交的细节。\n\n你需要额外的中间件来处理多部分上传。这里有一个名为 [multer](https://www.npmjs.com/package/multer)\
    \ 的 Express 软件包，我们将在这里使用它：\n\n```javascript\n// routes.js\nconst multer = require('multer');\n\
    const upload = multer({ storage: multer.memoryStorage() });\n\nrouter.post('/contact',\
    \ upload.single('photo'), csrfProtection, [\n  // validation ...\n], (req, res)\
    \ => {\n  // error handling ...\n\n  if (req.file) {\n    console.log('Uploaded:\
    \ ', req.file);\n    // Homework: Upload file to S3\n  }\n\n  req.flash('success',\
    \ 'Thanks for the message! I’ll be in touch :)');\n  res.redirect('/');\n});\n\
    ```\n\n这段代码指示 `multer` 将“photo”字段中的文件上传到内存中，并在 `req.file` 中暴露 `File` 对象，我们可以对其进行检查或进一步处理。\n\
    \n```html\n<form method=\"post\" action=\"/contact?_csrf=<%= csrfToken %>\" novalidate\
    \ enctype=\"multipart/form-data\">\n  <input type=\"hidden\" name=\"_csrf\" value=\"\
    <%= csrfToken %>\">\n  <div class=\"form-field <%= errors.message ? 'form-field-invalid'\
    \ : '' %>\">\n    <label for=\"message\">Message</label>\n    <textarea class=\"\
    input\" id=\"message\" name=\"message\" rows=\"4\" autofocus><%= data.message\
    \ %></textarea>\n    <% if (errors.message) { %>\n      <div class=\"error\"><%=\
    \ errors.message.msg %></div>\n    <% } %>\n  </div>\n  <div class=\"form-field\
    \ <%= errors.email ? 'form-field-invalid' : '' %>\">\n    <label for=\"email\"\
    >Email</label>\n    <input class=\"input\" id=\"email\" name=\"email\" type=\"\
    email\" value=\"<%= data.email %>\" />\n    <% if (errors.email) { %>\n      <div\
    \ class=\"error\"><%= errors.email.msg %></div>\n    <% } %>\n  </div>\n  <div\
    \ class=\"form-field\">\n    <label for=\"photo\">Photo</label>\n    <input class=\"\
    input\" id=\"photo\" name=\"photo\" type=\"file\" />\n  </div>\n  <div class=\"\
    form-actions\">\n    <button class=\"btn\" type=\"submit\">Send</button>\n  </div>\n\
    </form>\n```\n\n尝试上传一个文件。你应该能在控制台中看到记录的 `File` 对象。\n\n### 填充文件输入\n\n在发生验证错误时，我们无法像处理文本输入那样重新填充文件输入（[这存在安全风险](https://stackoverflow.com/questions/1696877/how-to-set-a-value-to-a-file-input-in-html)）。解决此问题的常用方法包括以下步骤：\n\
    \n* 将文件上传到服务器上的临时位置\n* 显示附件文件的缩略图和文件名\n* 为表单添加 JavaScript，允许用户移除已选文件或上传新文件\n*\
    \ 当所有内容有效时，将文件移动到永久位置\n\n由于处理多部分和文件上传具有额外的复杂性，它们通常被保留在单独的表单中。\n\n### 使用 Node 上传文件\n\
    \n最后，你会发现实际的上传功能是留给读者去实现的。这听起来可能没那么困难，可以使用各种软件包来实现，例如 [Formidable](https://www.npmjs.com/package/formidable)\
    \ 或 [express-fileupload](https://www.npmjs.com/package/express-fileupload)。你可以在[这里找到关于如何设置它的基础说明](https://flaviocopes.com/how-to-handle-file-uploads-node/)，或者[在此处查看更深入的教程](https://stackabuse.com/handling-file-uploads-in-node-js-with-expres-and-multer/)。\n\
    \n## 感谢阅读\n\n希望你喜欢学习 HTML 表单以及如何在 Express 和 Node.js 中处理它们。以下是对我们涵盖内容的简要回顾：\n\n\
    * 在响应 GET 请求时显示空表单\n* 处理提交的 POST 数据\n* 显示错误列表、内联错误和提交的数据\n* 使用验证器检查提交的数据\n* 使用纯化器（sanitizers）清理提交的数据\n\
    * 通过 flash 消息在重定向时传递消息\n* 保护自己免受 CSRF 和 XSS 等攻击\n* 处理多部分表单提交中的文件上传\n\n# 第 5 章：在\
    \ Node 中使用数据库\n\n### 作者：Craig Buckler\n\n本章描述的性能优化技术更为激进，并且可能难以应用到现有项目中。幸运的是，在启动新网站或应用程序时没有这些限制，因此我们深入探讨\
    \ CMS 问题——即 JavaScript。\n\n## 评估模板和插件\n\n像 WordPress 这样的内容管理系统会生成臃肿的页面——直到你开始添加东西为止！使用通用或商业模板是有意义的。当现成的解决方案可以完成一切时，为什么还要雇佣开发者呢？你的网站可能只使用了其中一部分，但它们仍然可能存在。同样，要警惕插件，因为它们的质量和效果参不齐。最好的插件可以通过优化数据库表、缓存数据和删除冗余代码来提高性能。最糟糕的会重复资源、进行复杂的更改（例如\
    \ `.htaccess` 文件）、增加不必要的臃肿并影响响应速度。\n\n## 减少客户端代码\n\n一个显而易见的陈述：文件越小，页面加载越快。然而，并非所有资产都是同等的，500KB\
    \ 的图像数据对性能的影响很小，因为它只下载一次，缓存在浏览器中并放置在页面上。相同量的 HTML、CSS 或 JavaScript 产生的影响大得多，因为它们必须被下载、解析和处理。\n\
    \n理想情况下，HTML DOM 节点的数量应减少到最低。更浅的树深度意味着渲染和重流的执行得更有效。现代布局工具如 [Flexbox](https://www.sitepoint.com/flexbox-css-flexible-box-layout/)\
    \ 和 [Grid](https://www.sitepoint.com/introduction-css-grid-layout/) 允许你移除在浮动设计中可能必要的包装元素。保持文档短小，并留意\
    \ [DIVitis](https://en.wiktionary.org/wiki/divitis) 的迹象！\n\n同样，需要的 CSS 规则越少，文档渲染速度越快。寻找复杂的选择器，特别是在使用预处理器如\
    \ [Sass](https://sass-lang.com/) 时，它们会展开深度嵌套的规则集。检查编译后的样式表输出，以确保在实际范围内尽可能高效。\n\
    \n尝试接受 [CSS 级联](https://developer.mozilla.org/docs/Web/CSS/Cascade) 而不是对抗它！稍微理解就能减少代码并提高性能。例如，你可以设置默认字体、颜色、大小、表格、网格和表单字段，这些是通用的，但可以针对单个组件进行微调。\n\
    \n此外要警惕使用 CSS 重置（reset），这意味着必须对每个元素重新应用默认样式。CSS 归一化（normalization），如 [Normalize.css](https://necolas.github.io/normalize.css/)，可能是更好的替代方案，因为它让浏览器的渲染更加一致。尽管如此，浏览器之间的默认样式比以往任何时候都接近。\n\
    \n"
- fmt: "\n# Optimize JavaScript Code\n\nHTML is a robust technology; even the oldest\
    \ browsers without HTML5 support will show content. Similarly, CSS can fail to\
    \ download or have coding errors, but the page remains viewable. By contrast,\
    \ JavaScript is fragile and computationally expensive. A single error, unsupported\
    \ command, or long-running task can prevent further code from running.\n\nIt’s\
    \ difficult to recommend JavaScript optimizations, since all applications will\
    \ be different, but there are a few general tips that could improve performance.\
    \ That said, be wary of micro-optimizations, which may shave a few milliseconds\
    \ but aren’t called frequently enough to make a difference. Use your browser’s\
    \ developer tools to check whether any gains have been achieved.\n\n### Use JavaScript\
    \ Sparingly\n\nIf a browser can do something in HTML and/or CSS alone, that should\
    \ be your preferred option. You can still apply progressive enhancements where\
    \ necessary (discussed below).\n\nModern browsers have implemented many regularly\
    \ used features that previously required scripting, such as [form validation](https://developer.mozilla.org/docs/Learn/HTML/Forms/Form_validation),\
    \ [field auto-complete](https://developer.mozilla.org/docs/Web/HTML/Element/datalist),\
    \ [animations](https://developer.mozilla.org/docs/Web/CSS/animation), [video](https://developer.mozilla.org/docs/Web/HTML/Element/video),\
    \ [expanding text](https://developer.mozilla.org/docs/Web/HTML/Element/details),\
    \ [modal dialogs](https://developer.mozilla.org/docs/Web/HTML/Element/dialog),\
    \ and more. There will be challenges—ask anyone who’s ever tried styling a `<select>`\
    \ drop-down—but using a native feature will always be faster and use less code.\n\
    \nConsider the choice of using an HTML `<button>` verses a `<div>` as a form submit.\
    \ The HTML code starts in a similar way:\n\n```\n<button>submit</button>\n```\n\
    \nStyling a DIV in CSS may be easier:\n\n```\n<div class=\"button\">submit</div>\n\
    ```\n\nHowever, the HTML `<button>`:\n\n1. offers default styling to look like\
    \ an OS button\n2. works on all browsers even when CSS or JavaScript fails\n3.\
    \ works immediately, as the page loads and before JavaScript has started executing\n\
    4. will automatically submit its parent `<form>` (if validity checks pass)\n5.\
    \ can be operated with a mouse, touch screen, keyboard, or any other input device\n\
    6. can receive focus, and accepts keypress shortcuts\n7. requires no ARIA roles\
    \ or other accessibility assistance\n\nA button that’s simulated in CSS and JavaScript\
    \ requires significant effort, and it will never function as effectively as the\
    \ native HTML alternative.\n\n### Avoid Long-running Tasks\n\nLong-running tasks\
    \ often trigger unresponsive browser messages, which prompt the user to halt JavaScript\
    \ execution. Complex processing is best handled by a [Web Worker](https://developer.mozilla.org/docs/Web/API/Web_Workers_API/Using_web_workers),\
    \ which allows a script to run in a background thread.\n\nWeb Worker scripts are\
    \ limited. They can’t interact with the page DOM, and must communicate with the\
    \ main script using a message API, but they’re able to perform Ajax requests and\
    \ launch their own child workers.\n\n### Bind Events Sparingly\n\nApplications\
    \ can have dozens of event handlers. A handler function is registered to an event\
    \ when it’s triggered on a specific DOM element—such as running the `doSomething()`\
    \ function when a click is detected on the `myElement` node:\n\n```\nmyElement.addEventListener('click',\
    \ doSomething);\n```\n\nEach bound event has a performance hit. Ideally, you should\
    \ only add events you require, return from handler functions quickly, and unbind\
    \ using [removeEventListener](https://developer.mozilla.org/docs/Web/API/EventTarget/removeEventListener)\
    \ when an event is no longer necessary.\n\nAlso be wary of quick-firing events\
    \ such as `mousemove` and `scroll`, which can trigger rapid and wasteful rerunning\
    \ of handler functions. One way around this is to use throttling to ensure an\
    \ event is called no more than once every `N` milliseconds. For example:\n\n```javascript\n\
    // thottle event to delay ms\nfunction eventThrottle(element, event, callback,\
    \ delay = 300) {\n\n  let throttle;\n  element.addEventListener(event, (e) =>\
    \ {\n\n    throttle = throttle || setTimeout(() => {\n      throttle = null;\n\
    \      callback(e);\n    }, delay);\n\n  }, false);\n\n}\n\n// call windowScrollHandler\
    \ no more than once every 300ms\neventThrottle(window, 'scroll', windowScrollHandler);\n\
    ```\n\nAlternatively, debouncing can be used to ensure a handler is only called\
    \ after the event has stopped being triggered for `N` milliseconds:\n\n```javascript\n\
    // debounce event until it no longer occurs for delay ms\nfunction eventDebounce(element,\
    \ event, callback, delay = 300) {\n\n  let debounce;\n  element.addEventListener(event,\
    \ (e) => {\n    clearTimeout(debounce);\n    debounce = setTimeout(() => callback(e),\
    \ delay);\n  }, false);\n\n}\n\n// call windowScrollHandler when at least 300ms\
    \ has elapsed since the last event\neventThrottle(window, 'scroll', windowScrollHandler);\n\
    ```\n\nFinally, remember to make effective use of event delegation. For example,\
    \ presume you have an HTML `<table>` with thousands of cells and want to react\
    \ to a `<td>` being clicked. Attaching an event to each cell requires significant\
    \ processing and would need to be reapplied if the table changed. Instead, you\
    \ can attach a single event handler to the `<table>` element and examine the target.\
    \ For example:\n\n```javascript\n// handle a click on any <td>\ndocument.getElementById('mytable').addEventListener('click',\
    \ (e) => {\n\n  let t = e.target.closest('td');\n  if (!t) return;\n\n  console.log('clicked\
    \ cell', t);\n\n});\n```\n\n### Analyze Modified Code\n\nIt’s rare to encounter\
    \ code that hasn’t been modified before it reaches the browser\n\n* Minifiers\
    \ attempt optimizations such as rearranging lines or expanding loops.\n* Transpilers\
    \ such as Babel convert ES6 to ES5.\n* Compilers such as TypeScript, CoffeeScript,\
    \ and Flow convert alternative or superset syntaxes to JavaScript.\n* Projects\
    \ such as [Blazor](https://dotnet.microsoft.com/apps/aspnet/web-apps/blazor) convert\
    \ C# to [WebAssembly](https://webassembly.org/)—a low-level, assembly-like language\
    \ that offers near-native performance in JavaScript engines.\n\nAll offer stability\
    \ and performance benefits, but check that the conversion is optimal and that\
    \ it’s not unnecessarily importing several kilobytes of transpiler code. For example,\
    \ consider the following 32-byte ES6 for...of](https://developer.mozilla.org/docs/Web/JavaScript/Reference/Statements/for...of)\
    \ loop:\n\n```javascript\nfor (let p of n) console.log(p);\n```\n\nThis results\
    \ in 598 bytes of Babel-transpiled code. Each additional loop adds a similar quantity\
    \ of code, and none will execute in IE11—which partly defeats the point of transpiling!\
    \ Options to consider:\n\n* Use ES5 or more transpiler-efficient ES6 code to achieve\
    \ the same result.\n* Use differential loading to serve ES6 module-based code](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules)\
    \ to modern browsers and larger transpiled scripts to older applications.\n* Drop\
    \ support for browsers without ES6 support (primarily IE). Your site or application\
    \ can remain usable if you adopt server-side rendering and progressive enhancement\
    \ techniques.\n\n## Modify the DOM Effectively\n\nSome modern JavaScript frameworks\
    \ implement a virtual DOM. As you change page elements, the virtual DOM works\
    \ out what’s been altered and determines how and when to make modifications. Ultimately,\
    \ it must still change the real DOM, and you can make similar optimizations to\
    \ improve performance without the additional overhead of virtual DOM calculations.\n\
    \n### Cache Regularly Used Nodes\n\nRegularly used DOM nodes should be stored\
    \ as JavaScript variables so they don’t need to be re-fetched. The DOM references\
    \ are retained even when other tree nodes are modified.\n"
