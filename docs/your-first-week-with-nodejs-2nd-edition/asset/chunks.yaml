    )\n};\n\nconst app = express();\n\napp.use(helmet()); // Add Helmet as a middleware\n\
    \napp.use((req, res) => {\n  res.writeHead(200);\n  res.end(\"hello world\\n\"\
    );\n});\n\napp.listen(8000);\n\nhttps.createServer(options, app).listen(8080);\n\
    ```\n\n### Diffie–Hellman Strong(er) Parameters\n\nIn order to skip some complicated\
    \ math, let’s cut to the chase. In very simple terms, there are two different\
    \ keys used for encryption: the certificate we get from the certificate authority,\
    \ and one that’s generated by the server for key exchange. The default key for\
    \ key exchange (also called [Diffie–Hellman key exchange](https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange),\
    \ or DH) uses a “smaller” key than the one for the certificate. In order to remedy\
    \ this, we’ll generate a strong DH key and feed it to our secure server for use.\n\
    \nIn order to generate a longer (2048 bit) key, you’ll need `openssl`, which you\
    \ probably have installed by default. In case you’re unsure, run `openssl -v`.\
    \ If the command isn’t found, install `openssl` by running `sudo apt install openssl`\
    \ (or visit their download page [here](https://www.openssl.org/source/)):\n\n\
    ```\nopenssl dhparam -out /var/www/example/sslcert/dh-strong.pem 2048\n```\n\n\
    Then copy the path to the file to our configuration:\n\n```\n// ...\n\nconst options\
    \ = {\n  key: fs.readFileSync(\"/var/www/example/sslcert/privkey.pem\"),\n  cert:\
    \ fs.readFileSync(\"/var/www/example/sslcert/fullchain.pem\"), // these paths\
    \ might differ for you, make sure to copy from the certbot output\n  dhparam:\
    \ fs.readFileSync(\"/var/www/example/sslcert/dh-strong.pem\")\n};\n\n// ...\n\
    ```\n\n## Conclusion\n\nIn 2020 and beyond, there’s no excuse to dismiss HTTPS.\
    \ The future direction is clearly visible: HTTPS everywhere! In Node.js, we have\
    \ lots of options for utilizing SSL/TLS. We can publish our websites in HTTPS,\
    \ we can create requests to encrypted websites, and we can authorize otherwise\
    \ untrusted certificates.\n\n# Chapter 11: Configuring NGINX and SSL with Node.js\n\
    \n### by Nilson Jacques\n\n[NGINX](https://www.nginx.com/) is a high-performance\
    \ HTTP server as well as a [reverse proxy](https://medium.com/intrinsic/why-should-i-use-a-reverse-proxy-if-node-js-is-production-ready-5a079408b2ca).\
    \ Unlike traditional servers, NGINX follows an event-driven, asynchronous architecture.\
    \ As a result, the memory footprint is low and performance is high. If you’re\
    \ running a Node.js-based web app, you should seriously consider using NGINX as\
    \ a reverse proxy.\n\nNGINX can be very efficient in serving static assets. For\
    \ all other requests, it will talk to your Node.js back end and send the response\
    \ to the client. In this tutorial, we’ll discuss how to configure NGINX to work\
    \ with Node.js. We’ll also see how to setup SSL in the NGINX server.\n\n#### Node’s\
    \ Built-in HTTPS Module\n\nNode also has a built-in HTTPS module and can be configured\
    \ to read the necessary certificate files without the need for a reverse proxy.\
    \ You can find out more about this in our article [How to Use SSL/TLS with Node.js](https://www.sitepoint.com/how-to-use-ssltls-with-node-js/).\n\
    \n## Installing NGINX\n\nAssuming you already have Node.js installed on your machine\
    \ (if not, check [here](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)),\
    \ let’s see how to install NGINX.\n\n### Installation on Linux\n\nIf you’re running\
    \ Ubuntu, you can use the following command to install NGINX:\n\n```\nsudo apt-get\
    \ update\nsudo apt-get install nginx\n```\n\nIf you’re running a Linux distro\
    \ other than Ubuntu, check out [the NGINX installation docs](https://docs.nginx.com/nginx/admin-guide/installing-nginx/installing-nginx-open-source/#prebuilt)\
    \ for more information.\n\nNGINX will start automatically once it’s installed.\n\
    \n### Installation on macOS\n\nIf you’re on macOS, you can use [Homebrew](http://brew.sh/)\
    \ to install NGINX easily. The steps are as following:\n\n*   Homebrew needs the\
    \ directory `/usr/local` to be `chown`’d to your username. So, run the following\
    \ command in terminal first:\n\n    ```\n     sudo chown -R 'username here' /usr/local\n\
    \    ```\n\n*   Now the following two commands will install NGINX on your system:\n\
    \n    ```\n     brew link pcre\n      brew install nginx\n    ```\n\n*   Once\
    \ the installation is complete, you can type the following command to start NGINX:\n\
    \n    ```\n     sudo nginx\n    ```\n\n*   The NGINX config file can be found\
    \ here: `/usr/local/etc/nginx/nginx.conf`.\n\n### Installation on Windows\n\n\
    For Windows, head over to the NGINX [downloads](http://nginx.org/en/download.html)\
    \ page and get the zip. The next step is unzipping the archive and moving to the\
    \ directory in the command prompt as follows:\n\n```\nunzip nginx-1.3.13.zip\n\
    cd nginx-1.3.13\nstart nginx\n```\n\nAs you can see, the command `start nginx`\
    \ will start NGINX.\n\nNow that the installation is done, let’s see how you can\
    \ configure a simple server.\n\n## Setting Up a Node.js Server\n\nFirst, let’s\
    \ create a simple Node.js server. We’ll start by initiating a project and installing\
    \ the [Express package](https://www.npmjs.com/package/express):\n\n```\nmkdir\
    \ node-demo && cd node-demo\nnpm init -y\nnpm i express\n```\n\nCreate a file\
    \ called `server.js`, with the following contents:\n\n```\nconst express = require('express')\n\
    const app = express()\nconst port = 3000\n\napp.get('/', (req, res) => res.send('Hello\
    \ World!'))\n\napp.listen(port, () => console.log(`Example app listening on port\
    \ ${port}!`))\n```\n\nYou can start the server by running `node server.js`.\n\n\
    ## Configuring NGINX\n\nNow let’s open up the NGINX default site config file:\n\
    \n```\nsudo nano /etc/nginx/sites-available/default\n```\n\nIf you want, you can\
    \ go directly to the directory and open up the config file with your favorite\
    \ text editor.\n\nAs you scroll down, you’ll find a `server` block. It looks something\
    \ like this:\n\n```\nserver {\n  listen       80;\n  server_name  localhost;\n\
    \n  ....\n  more config goes here\n}\n```\n\nNext, we’ll configure the `server`\
    \ block to suit our needs. We want to configure NGINX to pass all requests through\
    \ to our Node.js server. Replace the above `server` block with a new block as\
    \ shown below:\n\n```\nserver {\n  listen       80;\n  server_name  localhost;\n\
    \n  location / {\n    proxy_pass http://localhost:3000;\n    proxy_http_version\
    \ 1.1;\n    proxy_set_header Upgrade $http_upgrade;\n    proxy_set_header Connection\
    \ 'upgrade';\n    proxy_set_header Host $host;\n    proxy_cache_bypass $http_upgrade;\n\
    \  }\n}\n```\n\nAs you can see, the web server will listen on `http://localhost`\
    \ port `80`. The `location /` block tells NGINX what to do with any incoming request.\
    \ We use `proxy_pass` to point to our Node.js application, which is running at\
    \ `http://localhost:3000` in our case.\n\nAt this point, you should save the file\
    \ and type the following to restart NGINX, depending on your operating system.\n\
    \n**Ubuntu:**\n\n```\nsudo service nginx restart\n```\n\nOr:\n\n```\nsudo /etc/init.d/nginx\
    \ restart\n```\n\n**macOS:**\n\n```\nsudo nginx -s stop && sudo nginx\n```\n\n\
    **Windows:**\n\n```\nnginx -s reload\n```"
