  trans: "\n\n在 Hapi v19 中，[`request.payload.multipart` 默认被改为 `false`](https://github.com/hapijs/hapi/issues/4017)。我们需要在\
    \ `POST` 和 `PUT` 路由中将其设回 `true`，因为我们将使用 `FormData` 对象向服务器传输数据，且传输的数据将采用 `multipart/form-data`\
    \ 格式。\n\n## 构建视图 (Building the Views)\n\n此时，我们的网站正在接收 HTTP 调用并使用 JSON 对象进行响应。为了让它对每个人都有用，我们必须创建以美观方式渲染信息的页面。\n\
    \n在这个示例中，我们将使用 [Pug](https://pugjs.org/api/getting-started.html)（以前称为 Jade）模板语言，尽管这不是强制性的，我们也可以配合\
    \ Hapi.js 使用其他语言。我们将使用 [Vision](https://github.com/hapijs/vision) 插件来在服务器中启用视图功能。\n\
    \n### Pug 初学者指南\n\n如果你不熟悉 Jade/Pug，请查看我们的 [Pug 初学者指南](https://www.sitepoint.com/a-beginners-guide-to-pug/)。\n\
    \n你可以通过以下命令安装这些包：\n\n```\nnpm install @hapi/vision@5.5.4 pug\n```\n\n在这里我们安装了\
    \ v5.5.4 的 `vision` 插件，它与 Hapi v18 兼容。如果你选择安装 Hapi v19，只需输入 `npm i @hapi/vision`\
    \ 即可获取最新版本。\n\n### 笔记组件 (The Note Component)\n\n首先，我们将构建一个可以在我们的视图中复用的笔记组件。此外，我们还将在某些控制器函数中使用该组件，在后端动态构建笔记，以简化客户端的逻辑。\n\
    \n在 `lib/views/components` 目录中创建一个名为 `note.pug` 的文件，内容如下：\n\n```\narticle.content\n\
    \  h2.title: a(href=`/note/${note.slug}`)= note.title\n  p.subtitle.is-6 Published\
    \ on #{note.date}\n  p=note.content\n```\n\n它由笔记标题、发布日期和笔记内容组成。\n\n### 基础布局 (The\
    \ Base Layout)\n\n基础布局包含了我们页面的公共元素——换句话说，对于我们的示例来说，就是除内容以外的所有部分。在 `lib/views/`\
    \ 目录中创建一个名为 `layout.pug` 的文件，内容如下：\n\n```\ndoctype html\nhead\n  meta(charset='utf-8')\n\
    \  meta(name='viewport' content='width=device-width, initial-scale=1')\n  title=page\n\
    \  meta(name='description' content=description)\n  link(rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css')\n\
    \  script(defer='' src='https://use.fontawesome.com/releases/v5.3.1/js/all.js')\n\
    body\n  block content\n  script(src='/scripts/main.js')\n```\n\n其他页面的内容将加载到 `block\
    \ content` 所在的位置。注意，我们将在 `title` 元素中显示页面变量，并在 `meta(name='description')` 元素中使用\
    \ `description` 变量。我们稍会在路由中创建这些变量。\n\n为了样式化，我们从 CDN 引入了 [Bulma CSS 框架](https://bulma.io/)\
    \ 和 [Font Awesome](https://fontawesome.com/)。我们还在页面底部包含了一个 `main.js` 文件，它将包含我们前端所有的自定义\
    \ JavaScript 代码。请现在在 `static/public/scripts/` 目录中创建该文件。\n\n### 首页视图 (The Home\
    \ View)\n\n在主页上，我们将显示数据库中所有笔记的列表，以及一个可以显示带表单模态窗口的按钮，允许我们通过 Ajax 创建新笔记。\n\n在 `lib/views`\
    \ 目录中创建一个名为 `home.pug` 的文件，内容如下：\n\n```\nextends layout\n\nblock content\n  section.section\n\
    \    .container\n\n      h1.title.has-text-centered\n        | Notes Board\n\n\
    \      .tabs.is-centered\n        ul\n          li\n            a.show-modal(href='#')\
    \ Publish\n\n      main(container).notes-list\n        each note in data.notes\n\
    \          include components/note\n          hr\n\n      .modal\n        .modal-background\n\
    \        .modal-card\n          header.modal-card-head\n            p.modal-card-title\
    \ Add note\n            button.delete(aria-label='close')\n          section.modal-card-body\n\
    \            form(action='/note' method='POST').note-form#note-form\n        \
    \      .field\n                .control\n                  input.input(name='noteTitle'\
    \ type='text' placeholder='Title')\n              .field\n                .control\n\
    \                  input.input(name='noteDescription' type='text' placeholder='Short\
    \ description')\n              .field\n                .control\n            \
    \      textarea.textarea(name='noteContent' placeholder='Contents')\n        \
    \      .field\n                .control\n                  button.button.is-link\
    \ Save\n```\n\n### 笔记视图 (The Note View)\n\n笔记页面与首页非常相似，但在这种情况下，我们显示一个包含当前笔记特定选项的菜单、笔记内容以及与主页相同的表单，但表单已预填了信息。\n\
    \n在 `lib/views` 中创建一个名为 `note.pug` 的文件，内容如下：\n\n```\nextends layout\n\nblock content\n\
    \  section.section\n    .container\n\n      h1.title.has-text-centered\n     \
    \   | Notes Board\n\n      .tabs.is-centered\n        ul\n          li\n     \
    \       a.show-modal(href='#') Publish\n\n      main(container).notes-list\n \
    \       each note in data.notes\n          include components/note\n         \
    \ hr\n\n      .modal\n        .modal-background\n        .modal-card\n       \
    \   header.modal-card-head\n            p.modal-card-title Add note\n        \
    \    button.delete(aria-label='close')\n          section.modal-card-body\n  \
    \          form(action='/note' method='POST').note-form#note-form\n          \
    \    .field\n                .control\n                  input.input(name='noteTitle'\
    \ type='text' placeholder='Title')\n              .field\n                .control\n\
    \                  input.input(name='noteDescription' type='text' placeholder='Short\
    \ description')\n              .field\n                .control\n            \
    \      textarea.textarea(name='noteContent' placeholder='Contents')\n        \
    \      .field\n                .control\n                  button.button.is-link\
    \ Save\n```\n\n### 客户端 JavaScript (The JavaScript on the Client)\n\n为了创建和更新笔记，我们将使用一些\
    \ JavaScript，用于显示/隐藏模态框以及通过 Ajax 提交请求。这并不是必须的，但我们认为它为用户提供了更好的体验。\n\n这是我们 `static/public/scripts/`\
    \ 目录下的 `main.js` 文件内容：\n\n```javascript\n// Modal\nconst modal = document.querySelector(\"\
    .modal\");\nconst html = document.querySelector(\"html\");\n\nconst showModal\
    \ = () => {\n  modal.classList.add(\"is-active\");\n  html.classList.add(\"is-clipped\"\
    );\n};\n\nconst hideModal = () => {\n  modal.classList.remove(\"is-active\");\n\
    \  html.classList.remove(\"is-clipped\");\n};\n\ndocument.querySelector(\"a.show-modal\"\
    ).addEventListener(\"click\", function(e) {\n  e.preventDefault();\n  showModal();\n\
    });\n\nmodal.querySelector(\".modal .delete\").addEventListener(\"click\", function(e)\
    \ {\n  e.preventDefault();\n  hideModal();\n});\n\n// Form submition\nconst form\
    \ = document.querySelector(\"#note-form\");\nconst url = form.getAttribute(\"\
    action\");\nconst method = form.getAttribute(\"method\");\n\nconst prependNote\
    \ = html => {\n  const notesList = document.querySelector(\".notes-list\");\n\
    \  const div = document.createElement(\"div\");\n  div.innerHTML = html;\n  notesList.insertBefore(div.firstChild,\
    \ notesList.firstChild);\n};\n\nconst updateNote = html => {\n  const article\
    \ = document.querySelector(\"article\");\n  const div = document.createElement(\"\
    div\");\n  div.innerHTML = html;\n  article.parentNode.replaceChild(div.firstChild,\
    \ article);\n};\n\nconst onSuccess = html => {\n  hideModal();\n  form.reset();\n\
    \n  if (method === \"POST\") {\n    prependNote(html);\n  } else if (method ===\
    \ \"PUT\") {\n    updateNote(html);\n  }\n};\n\nform.addEventListener(\"submit\"\
    , e => {\n  e.preventDefault();\n\n  fetch(url, {\n    method,\n    body: new\
    \ FormData(form)\n  })\n    .then(response => response.text())\n    .then(text\
    \ => onSuccess(text))\n    .catch(error => console.error(error));\n});\n```\n"
- fmt: "Every time the user submits the form in the modal window, we get the information\
    \ from the form elements and send it to our back end, depending on the action\
    \ URL and the method (`POST` or `PUT`). Then, we’ll get the result as a block\
    \ of HTML containing our new note data. When we add a note, we’ll just add it\
    \ on top of the list on the home page, and when we update a note we replace the\
    \ content for the new one in the note view.\n\n### Adding Support for Views on\
    \ the Server\n\nTo make use of our views, we have to include them in our controllers\
    \ and add the required settings.\n\nIn our `server.js` file, let’s import the\
    \ Node [Path](https://nodejs.org/api/path.html) utility at the top of the file,\
    \ since we’re using it in our code to indicate the path of our views:\n\n```\n\
    const Path = require(\"path\");\n```\n\nNow, replace the `server.route(Routes);`\
    \ line with the following code block:\n\n```\nawait server.register([require(\"\
    @hapi/vision\")]);\n\nserver.views({\n  engines: { pug: require(\"pug\") },\n\
    \  path: Path.join(__dirname, \"lib/views\"),\n  compileOptions: {\n    pretty:\
    \ false\n  },\n  isCached: Settings.env === \"production\"\n});\n\n// Add routes\n\
    server.route(Routes);\n```\n\nIn the code we’ve added, we first register the [Vision](https://github.com/hapijs/vision)\
    \ plugin with our Hapi.js server, which is going to provide the view functionality.\
    \ Then we add the settings for our views—like the engine we’re going to use and\
    \ the path where the views are located. At the end of the code block, we add our\
    \ routes back in.\n\nThis will make our views work on the server, but we still\
    \ have to declare the view that we’re going to use for each route.\n\n### Setting\
    \ the Home View\n\nOpen the `lib/controllers/home.js` file and replace the `return`\
    \ statement with the following:\n\n```\nreturn h.view('home', {\n  data: {\n \
    \   notes: result\n  },\n  page: 'Home—Notes Board',\n  description: 'Welcome\
    \ to my Notes Board'\n});\n```\n\nAfter registering the Vision plugin, we now\
    \ have a `view` method available on the reply object. We’re going to use it to\
    \ select the `home` view in our `views` directory and to send the data that’s\
    \ going to be used when rendering the views.\n\nIn the data that we provide to\
    \ the view, we also include the page title and a meta description for search engines.\n\
    \nIf you’d like to try things out at this point, head to [http://localhost:3000/](http://localhost:3000/).\
    \ You should see a nicely styled notes board, with a `Publish` button that doesn’t\
    \ do anything.\n\n### Setting the Note View: `create` Function\n\nRight now, every\
    \ time we create a note we send a JSON object from the server to the client. But\
    \ since we’re doing this process with Ajax, we can send the new note as HTML ready\
    \ to be added to the page. To do this, we render the *note* component with the\
    \ data we have.\n\nStart off by requiring Pug at the top of the `controllers/note.js`\
    \ file:\n\n```\nconst Pug = require(\"pug\");\n```\n\nThen, in the `create` method,\
    \ replace the line `return result;` with the following code block:\n\n```\n//\
    \ Generate a new note with the 'result' data\nreturn Pug.renderFile(\n  Path.join(__dirname,\
    \ \"../views/components/note.pug\"),\n  {\n    note: result\n  }\n);\n```\n\n\
    We use the `renderFile` method from Pug to render the note template with the data\
    \ we just received from our model.\n\n### Setting the Note View: `read` Function\n\
    \nWhen we enter a note page, we should get the note template with the content\
    \ of our note. To do this, we have to replace the `read` function’s `return note;`\
    \ line with this:\n\n```\nreturn h.view(\"note\", {\n  note,\n  page: `${note.title}—Notes\
    \ Board`,\n  description: note.description\n});\n```\n\nAs with the home page,\
    \ we select a view as the first parameter and the data that we’re going to use\
    \ as the second one.\n\n### Setting the Note View: `update` Function\n\nEvery\
    \ time we update a note, we’ll reply similarly to when we create new notes. Replace\
    \ the `return result;` line in the `update` function with the following code:\n\
    \n```\n// Generate a new note with the updated data\nreturn Pug.renderFile(\n\
    \  Path.join(__dirname, \"../views/components/note.pug\"),\n  {\n    note: result\n\
    \  }\n);\n```\n\n#### No View Required\n\nThe delete function doesn’t need a view,\
    \ since it will just redirect to the home page once the note is deleted.\n\n##\
    \ Serving Static Files\n\nThe JavaScript and CSS files we’re using on the client\
    \ side are provided by Hapi.js from the `static/public/` directory. But it won’t\
    \ happen automatically; we have to indicate to the server that we want to define\
    \ this folder as public. This is done using the [Inert](https://github.com/hapijs/inert)\
    \ package, which you can install with the following command:\n\n```\nnpm install\
    \ @hapi/inert\n```\n\nIn the `server.register` function inside the `server.js`\
    \ file, import the Inert plugin and register it with Hapi like this:\n\n```\n\
    await server.register([require(\"@hapi/vision\"), require(\"@hapi/inert\")]);\n\
    ```\n\nNow we have to define the route where we’re going to provide static files.\
    \ Add the following entry at the end of `routes.js`:\n\n```\n{\n  // Static files\n\
    \  method: \"GET\",\n  path: \"/static*\",\n  handler: {\n    directory: {\n \
    \     path: Path.join(__dirname, \"../static/public\")\n    }\n  },\n  config:\
    \ {\n    description: \"Provides static resources\"\n  }\n}\n```\n\nYou can find\
    \ more information about serving static content in the [Hapi.js documentation](https://hapi.dev/tutorials/servingfiles/).\n\
    \n## Conclusion\n\nAt this point, we have a very basic Hapi.js application using\
    \ the MVC architecture. Although there are still things we should take of before\
    \ putting our application in production (such as input validation, error handling,\
    \ error pages) this should work as a foundation to learn and build your own.\n\
    \nIf you’d like to take this example a bit further, after finishing all the small\
    \ details (not related the architecture) to make this a robust application, you\
    \ could implement an authentication system so only registered users are able to\
    \ publish and edit notes. But your imagination is the limit, so feel free to fork\
    \ the [application](https://github.com/sitepoint-editors/notes-board) and go to\
    \ town!\n\n# Chapter 7: Local Authentication Using Passport in Node.js\n\n###\
    \ by Paul Orac\n\nA common requirement when building a app is to implement a login\
    \ system, so that users can authenticate themselves before gaining access to protected\
    \ views or resources. Luckily for those building Node apps, there’s a middleware\
    \ called [Passport](http://www.passportjs.org/) that can be dropped into any [Express](https://expressjs.com/)-based\
    \ web application to provide authentication mechanisms in only a few commands.\n\
    \nIn this tutorial, I’ll demonstrate how to use Passport to implement local authentication\
    \ (that is, logging in with a username and password) with a MongoDB back end.\
    \ If you’re looking to implement authentication via the likes of Facebook or GitHub,\
    \ please refer to [this tutorial](https://www.sitepoint.com/passport-authentication-for-nodejs-applications/).\n\
    \nAs ever, all of the code for this article is available for download on [GitHub](https://github.com/sitepoint-editors/LocalPassportAuth).\n\
    \n## Prerequisites\n\nTo follow along with this tutorial, you’ll need to have\
    \ Node and MongoDB installed on your machine.\n\nYou can install Node by heading\
    \ to the [official Node download page](https://nodejs.org/en/download/) and grabbing\
    \ the correct binaries for your system. Alternatively, you can use a version manager—a\
    \ program that allows you to install multiple versions of Node and switch between\
    \ them at will. If you fancy going this route, please consult our quick tip, “[Install\
    \ Multiple Versions of Node.js Using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)”.\n"
  raw: "Every time the user submits the form in the modal window, we get the information\
    \ from the form elements and send it to our back end, depending on the action\
    \ URL and the method (`POST` or `PUT`). Then, we’ll get the result as a block\
    \ of HTML containing our new note data. When we add a note, we’ll just add it\
    \ on top of the list on the home page, and when we update a note we replace the\
    \ content for the new one in the note view.\n\n### Adding Support for Views on\
    \ the Server\n\nTo make use of our views, we have to include them in our controllers\
    \ and add the required settings.\n\nIn our `server.js` file, let’s import the\
    \ Node [Path](https://nodejs.org/api/path.html) utility at the top of the file,\
    \ since we’re using it in our code to indicate the path of our views:\n\n```\n\
    const Path = require(\"path\");\n```\n\nNow, replace the `server.route(Routes);`\
    \ line with the following code block:\n\n```\nawait server.register([require(\"\
    @hapi/vision\")]);\n\nserver.views({\n  engines: { pug: require(\"pug\") },\n\
    \  path: Path.join(__dirname, \"lib/views\"),\n  compileOptions: {\n    pretty:\
    \ false\n  },\n  isCached: Settings.env === \"production\"\n});\n\n// Add routes\n\
    server.route(Routes);\n```\n\nIn the code we’ve added, we first register the [Vision](https://github.com/hapijs/vision)\
    \ plugin with our Hapi.js server, which is going to provide the view functionality.\
    \ Then we add the settings for our views—like the engine we’re going to use and\
    \ the path where the views are located. At the end of the code block, we add our\
    \ routes back in.\n\nThis will make our views work on the server, but we still\
    \ have to declare the view that we’re going to use for each route.\n\n### Setting\
    \ the Home View\n\nOpen the `lib/controllers/home.js` file and replace the `return`\
    \ statement with the following:\n\n```\nreturn h.view('home', {\n  data: {\n \
    \   notes: result\n  },\n  page: 'Home—Notes Board',\n  description: 'Welcome\
    \ to my Notes Board'\n});\n```\n\nAfter registering the Vision plugin, we now\
    \ have a `view` method available on the reply object. We’re going to use it to\
    \ select the `home` view in our `views` directory and to send the data that’s\
    \ going to be used when rendering the views.\n\nIn the data that we provide to\
    \ the view, we also include the page title and a meta description for search engines.\n\
    \nIf you’d like to try things out at this point, head to [http://localhost:3000/](http://localhost:3000/).\
    \ You should see a nicely styled notes board, with a **Publish** button that doesn’t\
    \ do anything.\n\n### Setting the Note View: `create` Function\n\nRight now, every\
    \ time we create a note we send a JSON object from the server to the client. But\
    \ since we’re doing this process with Ajax, we can send the new note as HTML ready\
    \ to be added to the page. To do this, we render the *note* component with the\
    \ data we have.\n\nStart off by requiring Pug at the top of the `controllers/note.js`\
    \ file:\n\n```\nconst Pug = require(\"pug\");\n```\n\nThen, in the `create` method,\
    \ replace the line `return result;` with the following code block:\n\n```\n//\
    \ Generate a new note with the 'result' data\nreturn Pug.renderFile(\n  Path.join(__dirname,\
    \ \"../views/components/note.pug\"),\n  {\n    note: result\n  }\n);\n```\n\n\
    We use the `renderFile` method from Pug to render the note template with the data\
    \ we just received from our model.\n\n### Setting the Note View: `read` Function\n\
    \nWhen we enter a note page, we should get the note template with the content\
    \ of our note. To do this, we have to replace the `read` function’s `return note;`\
    \ line with this:\n\n```\nreturn h.view(\"note\", {\n  note,\n  page: `${note.title}—Notes\
    \ Board`,\n  description: note.description\n});\n```\n\nAs with the home page,\
    \ we select a view as the first parameter and the data that we’re going to use\
    \ as the second one.\n\n### Setting the Note View: `update` Function\n\nEvery\
    \ time we update a note, we’ll reply similarly to when we create new notes. Replace\
    \ the `return result;` line in the `update` function with the following code:\n\
    \n```\n// Generate a new note with the updated data\nreturn Pug.renderFile(\n\
    \  Path.join(__dirname, \"../views/components/note.pug\"),\n  {\n    note: result\n\
    \  }\n);\n```\n\n#### No View Required\n\nThe delete function doesn’t need a view,\
    \ since it will just redirect to the home page once the note is deleted.\n\n##\
    \ Serving Static Files\n\nThe JavaScript and CSS files that we’re using on the\
    \ client side are provided by Hapi.js from the `static/public/` directory. But\
    \ it won’t happen automatically; we have to indicate to the server that we want\
    \ to define this folder as public. This is done using the [Inert](https://github.com/hapijs/inert)\
    \ package, which you can install with the following command:\n\n```\nnpm install\
    \ @hapi/inert\n```\n\nIn the `server.register` function inside the `server.js`\
    \ file, import the Inert plugin and register it with Hapi like this:\n\n```\n\
    await server.register([require(\"@hapi/vision\"), require(\"@hapi/inert\")]);\n\
    ```\n\nNow we have to define the route where we’re going to provide the static\
    \ files, and their location on our server’s filesystem. Add the following entry\
    \ at the end of the exported object in `routes.js`:\n\n```\n{\n  // Static files\n\
    \  method: \"GET\",\n  path: \"/{param*}\",\n  handler: {\n    directory: {\n\
    \      path: Path.join(__dirname, \"../static/public\")\n    }\n  },\n  config:\
    \ {\n    description: \"Provides static resources\"\n  }\n}\n```\n\nThis route\
    \ will use the `GET` method, and we’ve replaced the handler function with an object\
    \ containing the directory that we want to make public.\n\nYou can find more information\
    \ about serving static content in the [Hapi.js documentation](https://hapi.dev/tutorials/servingfiles/?lang=en_US).\n\
    \n## Conclusion\n\nAt this point, we have a very basic Hapi.js application using\
    \ the MVC architecture. Although there are still things we should take care of\
    \ before putting our application in production (such as input validation, error\
    \ handling, error pages, and so on) this should work as a foundation to learn\
    \ and build your own applications.\n\nIf you’d like to take this example a bit\
    \ further, after finishing all the small details (not related the architecture)\
    \ to make this a robust application, you could implement an authentication system\
    \ so only registered users are able to publish and edit notes. But your imagination\
    \ is the limit, so feel free to fork the [application repository](https://github.com/sitepoint-editors/notes-board)\
    \ and go to town!\n\n# Chapter 7: Local Authentication Using Passport in Node.js\n\
    \n### by Paul Orac\n\nA common requirement when building a web app is to implement\
    \ a login system, so that users can authenticate themselves before gaining access\
    \ to protected views or resources. Luckily for those building Node apps, there’s\
    \ a middleware called [Passport](http://www.passportjs.org/) that can be dropped\
    \ into any [Express](https://expressjs.com/)-based web application to provide\
    \ authentication mechanisms in only a few commands.\n\nIn this tutorial, I’ll\
    \ demonstrate how to use Passport to implement local authentication (that is,\
    \ logging in with a username and password) with a MongoDB back end. If you’re\
    \ looking to implement authentication via the likes of Facebook or GitHub, please\
    \ refer to [this tutorial](https://www.sitepoint.com/passport-authentication-for-nodejs-applications/).\n\
    \nAs ever, all of the code for this article is available for download on [GitHub](https://github.com/sitepoint-editors/LocalPassportAuth).\n\
    \n## Prerequisites\n\nTo follow along with this tutorial, you’ll need to have\
    \ Node and MongoDB installed on your machine.\n\nYou can install Node by heading\
    \ to [the official Node download page](https://nodejs.org/en/download/) and grabbing\
    \ the correct binaries for your system. Alternatively, you can use a version manager—a\
    \ program that allows you to install multiple versions of Node and switch between\
    \ them at will. If you fancy going this route, please consult our quick tip, “[Install\
    \ Multiple Versions of Node.js Using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)”."
