  trans: "\n\n```javascript\n// routes.js\nconst { check, validationResult, matchedData\
    \ } = require('express-validator');\n\nrouter.post('/contact', [\n  check('message')\n\
    \    .isLength({ min: 1 })\n    .withMessage('Message is required'),\n  check('email')\n\
    \    .isEmail()\n    .withMessage('That email doesn‘t look right')\n], (req, res)\
    \ => {\n  const errors = validationResult(req);\n  res.render('contact', {\n \
    \   data: req.body,\n    errors: errors.mapped()\n  });\n});\n```\n\n### 数据清洗\
    \ (Sanitization)\n\n通过提供的[sanitizers](https://github.com/chriso/validator.js#sanitizers)，我们可以去除值首尾的空格，并将邮箱地址规范化为一致的模式。这有助于防止因输入细微差异而创建重复联系人。例如，`'\
    \ Mark@gmail.com'` 和 `'mark@gmail.com '` 都会被清洗为 `'mark@gmail.com'`。\n\n清洗器可以简单地链式在验证器的末尾：\n\
    \n```javascript\n// routes.js\nrouter.post('/contact', [\n  check('message')\n\
    \    .isLength({ min: 1 })\n    .withMessage('Message is required')\n    .trim(),\n\
    \  check('email')\n    .isEmail()\n    .withMessage('That email doesn‘t look right')\n\
    \    .bail()\n    .trim()\n    .normalizeEmail()\n], (req, res) => {\n  const\
    \ errors = validationResult(req);\n  res.render('contact', {\n    data: req.body,\n\
    \    errors: errors.mapped()\n  });\n\n  const data = matchedData(req);\n  console.log('Sanitized:',\
    \ data);\n});\n```\n\n`matchedData` 函数返回清洗器对输入进行处理后的结果。\n\n此外，注意我们使用了 [bail](https://express-validator.github.io/docs/validation-chain-api.html#bail)\
    \ 方法，如果之前的任何一个验证失败，它将停止执行后续的验证。我们需要这样做是因为如果用户在没有向邮箱字段输入值的情况下提交了表单，`normalizeEmail`\
    \ 将尝试规范化空字符串并将其转换为 `@`。这会在我们重新渲染表单时被插入到邮箱字段中。\n\n## 有效表单 (The Valid Form)\n\n\
    如果有错误，我们需要重新渲染视图。如果没有错误，我们需要对数据进行一些有用操作，然后显示提交成功。通常情况下，用户会被重定向到一个成功页面并看到一条消息。\n\
    \nHTTP 是无状态的，因此在不借助 [session cookie](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies)\
    \ 在多次 HTTP 请求之间持久化消息的情况下，你无法重定向到另一个页面*并*传递消息。“闪存消息”（flash message）是这种希望跨越重定向持久化随后消失的一次性消息的名称。\n\
    \n我们需要包含三个中间件来完成这一配置：\n\n```javascript\n// server.js\nconst cookieParser = require('cookie-parser');\n\
    const session = require('express-session');\nconst flash = require('express-flash');\n\
    \nconst middlewares = [\n  // ...\n  cookieParser(),\n  session({\n    secret:\
    \ 'super-secret-key',\n    key: 'super-secret-cookie',\n    resave: false,\n \
    \   saveUninitialized: false,\n    cookie: { maxAge: 60000 }\n  }),\n  flash(),\n\
    ];\n```\n\n`express-flash` 中间件增加了 `req.flash(type, message)`，我们可以在路由处理程序中使用它：\n\
    \n```javascript\n// routes\nrouter.post('/contact', [\n  // validation ...\n],\
    \ (req, res) => {\n  const errors = validationResult(req);\n  if (!errors.isEmpty())\
    \ {\n    return res.render('contact', {\n      data: req.body,\n      errors:\
    \ errors.mapped()\n    });\n  }\n\n  const data = matchedData(req);\n  console.log('Sanitized:\
    \ ', data);\n  // 作业：将清洗后的数据发送电子邮件或持久化到数据库\n\n  req.flash('success', 'Thanks for\
    \ the message! I‘ll be in touch :)');\n  res.redirect('/');\n});\n```\n\n`express-flash`\
    \ 中间件向 `req.locals` 添加了 `messages`，所有视图都可以访问它：\n\n```html\n<!-- views/index.ejs\
    \ -->\n<% if (messages.success) { %>\n  <div class=\"flash flash-success\"><%=\
    \ messages.success %></div>\n<% } %>\n\n<h1>Working With Forms in Node.js</h1\n\
    ```\n\n现在，当使用有效数据提交表单时，你应该被重定向到 `index` 视图并看到成功消息。太棒了！我们现在可以部署到生产环境，并收到尼日利亚王子的邮件。你可以在[CodeSandbox\
    \ 上找到此处的在线演示](https://codesandbox.io/embed/priceless-butterfly-u3557)。\n\n###\
    \ 使用 Node 发送 (Sending Email with Node)\n\n你可能已经注意到实际发送邮件的操作留给了读者作为作业。这听起来并没有那么困难，可以使用\
    \ [Nodemailer 包](https://www.npmjs.com/package/nodemailer) 来完成。你可以在[这里找到如何设置它的的基础说明](https://www.w3schools.com/nodejs/nodejs_email.asp)，或者[这里有更深入的教程]。\n\
    \n## 安全考量 (Security Considerations)\n\n在 HTML 视图中显示用户提交的数据时需要小心，因为这可能会让你面临[跨站脚本攻击(XSS)](https://developer.mozilla.org/en-US/docs/Glossary/Cross-site_scripting)。所有的模板语言都提供了不同的输出值的方法。EJS\
    \ 的 `<%= value %>` 输出经过*HTML 转义*的值以保护你免受 XSS 攻击，而 `<%- value %>` 输出原始字符串。\n\n\
    ### HTTPS 之上的 TLS\n\n始终在 `https` 上使用 TLS。有一个很棒的小型工具叫 [helmet](https://helmetjs.io/)，它可以在你中间件的最顶部添加一些安全响应头：\n\
    \n```javascript\n// server.js\nconst helmet = require('helmet');\n\nmiddlewares\
    \ = [\n  helmet(),\n  // ...\n];\n```\n\n### 跨站请求伪造 (CSRF)\n\n你可以通过在用户展示表单时生成唯一的令牌，并在处理\
    \ POST 数据之前验证该令牌来保护自己免受[跨站请求伪造](https://en.wikipedia.org/wiki/Cross-site_forgery)。相应的[中间件](https://expressjs.com/resources/middleware/)也可以帮助你：\n\
    \n```javascript\n// routes.js\nconst csrf = require('csurf');\nconst csrfProtection\
    \ = csrf({ cookie: true });\n```\n\n在 GET 请求中，我们生成令牌：\n\n```javascript\n// routes.js\n\
    router.get('/contact', csrfProtection, (req, res) => {\n  res.render('contact',\
    \ {\n    data: {},\n    errors: {},\n    csrfToken: req.csrfToken()\n  });\n});\n\
    ```\n\n以及在验证错误时也是：\n\n```javascript\n// routes.js\nrouter.post('/contact', csrfProtection,\
    \ [\n  // validations ...\n], (req, res) => {\n  const errors = validationResult(req);\n\
    \  if (!errors.isEmpty()) {\n    return res.render('contact', {\n      data: req.body,\n\
    \      errors: errors.mapped(),\n      csrfToken: req.csrfToken()\n    });\n \
    \ }\n\n  // ...\n});\n```\n\n然后我们只需要在隐藏输入框中包含令牌：\n\n```html\n<!-- view/contact.ejs\
    \ -->\n<form method=\"post\" action=\"/contact\" novalidate>\n  <input type=\"\
    hidden\" name=\"_csrf\" value=\"<%= csrfToken %>\">\n  <!-- ... -->\n</form>\n\
    ```\n\n这些就是所有需要的操作。\n\n我们不需要修改 POST 请求处理程序，因为所有的 POST 请求现在都由 `csurf` 中间件要求有效的令牌。如果未提供有效的\
    \ CSRF 令牌，将抛出 `ForbiddenError`，该错误由 `server.js` 结尾定义的错误处理器来处理。\n\n你可以通过浏览器开发工具编辑或删除表单中的令牌并提交来亲自测试。\n\
    \n"
- fmt: "\nAlways use the escaped output `<%= value %>` when dealing with user-submitted\
    \ values. Only use raw outputs when you’re sure that it’s safe to do so.\n\n##\
    \ File Uploads\n\nUploading files in HTML forms is a special case that requires\
    \ an encoding type of `\"multipart/form-data\"`. See [MDN’s guide to sending form\
    \ data](https://developer.mozilla.org/en-US/docs/Learn/HTML/Forms/Sending_and_retrieving_form_data#A_special_case_sending_files)\
    \ for more details about what happens with multipart form submissions.\n\nYou’ll\
    \ need additional middleware to handle multipart uploads. There’s an Express package\
    \ named [multer](https://www.npmjs.com/package/multer) that we’ll use here:\n\n\
    ```javascript\n// routes.js\nconst multer = require('multer');\nconst upload =\
    \ multer({ storage: multer.memoryStorage() });\n\nrouter.post('/contact', upload.single('photo'),\
    \ csrfProtection, [\n  // validation ...\n], (req, res) => {\n  // error handling\
    \ ...\n\n  if (req.file) {\n    console.log('Uploaded: ', req.file);\n    // Homework:\
    \ Upload file to S3\n  }\n\n  req.flash('success', 'Thanks for the message! I’ll\
    \ be in touch :)');\n  res.redirect('/');\n});\n```\n\nThis code instructs `multer`\
    \ to upload the file in the “photo” field into memory and exposes the `File` object\
    \ in `req.file`, which we can inspect or process further.\n\nThe last thing we\
    \ need is to add the `enctype` attribute and our file input:\n\n```html\n<form\
    \ method=\"post\" action=\"/contact?_csrf=<%= csrfToken %>\" novalidate enctype=\"\
    multipart/form-data\">\n  <input type=\"hidden\" name=\"_csrf\" value=\"<%= csrfToken\
    \ %>\">\n  <div class=\"form-field <%= errors.message ? 'form-field-invalid' :\
    \ '' %>\">\n    <label for=\"message\">Message</label>\n    <textarea class=\"\
    input\" id=\"message\" name=\"message\" rows=\"4\" autofocus><%= data.message\
    \ %></textarea>\n    <% if (errors.message) { %>\n      <div class=\"error\"><%=\
    \ errors.message.msg %></div>\n    <% } %>\n  </div>\n  <div class=\"form-field\
    \ <%= errors.email ? 'form-field-invalid' : '' %>\">\n    <label for=\"email\"\
    >Email</label>\n    <input class=\"input\" id=\"email\" name=\"email\" type=\"\
    email\" value=\"<%= data.email %>\" />\n    <% if (errors.email) { %>\n      <div\
    \ class=\"error\"><%= errors.email.msg %></div>\n    <% } %>\n  </div>\n  <div\
    \ class=\"form-field\">\n    <label for=\"photo\">Photo</label>\n    <input class=\"\
    input\" id=\"photo\" name=\"photo\" type=\"file\" />\n  </div>\n  <div class=\"\
    form-actions\">\n    <button class=\"btn\" type=\"submit\">Send</button>\n  </div>\n\
    </form>\n```\n\nTry uploading a file. You should see the `File` objects logged\
    \ in the console.\n\n### Populating File Inputs\n\nIn case of validation errors,\
    \ we can’t re-populate file inputs like we did for the text inputs ([it’s a security\
    \ risk](https://stackoverflow.com/questions/1696877/how-to-set-a-value-to-a-file-input-in-html)).\
    \ A common approach to solving this problem involves these steps:\n\n* uploading\
    \ the file to a temporary location on the server\n* showing a thumbnail and filename\
    \ of the attached file\n* adding JavaScript to the form to allow people to remove\
    \ the selected file or upload a new one\n* moving the file to a permanent location\
    \ when everything is valid\n\nBecause of the additional complexities of working\
    \ with multipart and file uploads, they’re often kept in separate forms.\n\n###\
    \ Uploading Files with Node\n\nFinally, you’ll notice that it’s been left to the\
    \ reader to implement the actual upload functionality. This is not as difficult\
    \ as it might sound and can be accomplished using various packages, such as [Formidable](https://www.npmjs.com/package/formidable),\
    \ or [express-fileupload](https://www.npmjs.com/package/express-fileupload). You\
    \ can find [bare-bones instructions on how to set this up here](https://flaviocopes.com/how-to-handle-file-uploads-node/),\
    \ or a [more in-depth tutorial here](https://stackabuse.com/handling-file-uploads-in-node-js-with-expres-and-multer/).\n\
    \n## Thanks for Reading\n\nI hope you enjoyed learning about HTML forms and how\
    \ to work with them in Express and Node.js. Here’s a quick recap of what we’ve\
    \ covered:\n\n* displaying an empty form in response to a GET request\n* processing\
    \ the submitted POST data\n* displaying a list of errors, inline errors and submitted\
    \ data\n* checking submitted data with validators\n* cleaning up submitted data\
    \ with sanitizers\n* passing messages across redirects with a flash message\n\
    * protecting yourself against attacks like CSRF and XSS\n* processing file uploads\
    \ in multipart form submissions\n\n# Chapter 5: Working with Databases in Node\n\
    \n### by Craig Buckler\n\nThe performance techniques described in this chapter\
    \ are more radical and could be difficult to apply to an existing project. Fortunately,\
    \ there are no such limitations when embarking on a new site or app, so we look\
    \ deeper into CMS issues, JavaScript.\n\n## Evaluate Templates and Plugins\n\n\
    Content management systems such as WordPress, generate bloated pages —until you\
    \ start adding stuff! Generic or commercial templates make sense. Why employ a\
    \ developer when off-the-shelf solution does everything? Your site may only use\
    \ a fraction of those, but they can still be present. Similarly, be wary about\
    \ plugins, since their quality and effectiveness vary. The best plugins can improve\
    \ performance by optimizing database tables, caching data, and removing redundant\
    \ code. The worst will duplicate assets, make convoluted changes (such as `.htaccess`\
    \ files), add unnecessary bloat, and affect responsiveness.\n\n## Reduce Client-side\
    \ Code\n\nBlindingly obvious statement: smaller files results in faster pages.\
    \ Not all assets are created equal, though 500KB of image data has a low performance\
    \ hit, since it’s downloaded once, cached in the browser, and positioned on the\
    \ page. The same quantity of HTML, CSS, or JavaScript has a far bigger impact,\
    \ because it must be downloaded, parsed, and processed.\n\nIdeally, the number\
    \ of HTML DOM nodes should be reduced to a minimum. A shallower tree depth means\
    \ rendering and reflows are performed more effectively. Modern layout tools such\
    \ as [Flexbox](https://www.sitepoint.com/flexbox-css-flexible-box-layout/) and\
    \ [Grid](https://www.sitepoint.com/introduction-css-grid-layout/) allow you to\
    \ remove wrapper elements that may have been necessary in float-based designs.\
    \ Keep the document small and look out for signs of [DIVitis](https://en.wiktionary.org/wiki/divitis)!\n\
    \nSimilarly, the fewer CSS rules you require, the quicker a document can be rendered.\
    \ Look for complex selectors, especially when using preprocessors such as [Sass](https://sass-lang.com/),\
    \ which expand deeply nested rule sets. Check your compiled style sheet output\
    \ to ensure it’s as efficient as is practical.\n\nTry to embrace the [CSS cascade](https://developer.mozilla.org/docs/Web/CSS/Cascade)\
    \ rather than working against it! A little understanding can reduce code and improve\
    \ performance. For example, you can set default fonts, colors, sizes, tables,\
    \ grids, and form fields that are universally applied but can be tweaked for individual\
    \ components.\n\nAlso be wary of using CSS resets, which means having to re-apply\
    \ default styling to every element. CSS normalization, such as [Normalize.css](https://necolas.github.io/normalize.css/),\
    \ could be a better alternative, since it makes browsers render more consistently.\
    \ That said, default styling between browsers is closer than ever.\n\n"
