  trans: "\nMongoDB 有多个版本。我们感兴趣的是 `MongoDB Community Edition`（社区版）。\n\n该项目的主页有非常出色的文档，我不再在这里重复这些内容了。相反，我将为你提供各个主要操作系统的指令链接：\n\
    \n* [在 Windows 上安装 MongoDB 社区版](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-windows/)\n\
    * [在 macOS 上安装 MongoDB 社区版](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-os-x/)\n\
    * [在 Ubuntu 上安装 MongoDB 社区版](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-ubuntu/)\n\
    \n如果你使用的是非 Ubuntu 的 Linux 版本，可以查看[此页面](https://docs.mongodb.com/manual/installation/#mongodb-community-edition-installation-tutorials)\
    \ 以获取其他发行版的安装说明。MongoDB 通常也可以通过官方的 Linux 软件通道获取，但有时会拉取到旧版本。\n\n### 名称和地址\n\n下载\
    \ MongoDB 不需要输入名称和地址。如果弹出提示，通常可以直接忽略该对话框。\n\n如果你想快速复习如何使用 MongoDB，可以查看我们的初学者指南“[MongoDB\
    \ 简介](https://www.sitepoint.com/an-introduction-to-mongodb/)”。\n\n## 身份验证策略：Session\
    \ vs. JWT\n\n在开始之前，让我们简要讨论一下身份验证的选择。\n\n现在的许多教程会选择基于 [JSON Web Tokens](https://www.sitepoint.com/using-json-web-tokens-node-js/)\
    \ (JWT) 的令牌身份验证。这种方法可能是目前最简单且最流行的方法。它将部分身份验证责任交给了客户端，让他们在每次请求时签名一个令牌以保持用户身份验证状态。\n\
    \n基于 Session 的身份验证已经存在较久。这种方法将身份验证的权重放在服务器端。它使用 Cookie，并通过 Node 应用程序和数据库协作来跟踪用户的身份验证状态。\n\
    \n在本教程中，我们将使用基于 Session 的身份验证，这是 [passport-local 策略](http://www.passportjs.org/packages/passport-local/)\
    \ 的核心。\n\n这两种方法都有它们的优缺点。如果你想深入了解两者之间的区别，[这个 Stack Overflow 线程](https://stackoverflow.com/q/43452896)\
    \ 可能是个很好的起点。\n\n## 创建项目\n\n一旦所有先决软件都准备就，我们就可以开始了。\n\n我们将首先为应用创建一个文件夹，然后在终端中进入该文件夹：\n\
    \n```\nmkdir AuthApp\ncd AuthApp\n```\n\n要创建 Node 应用，我们将使用以下命令：\n\n```bash\nnpm\
    \ init\n```\n\n系统会提示你为 Node 的 `package.json` 提供一些信息。只需一直按 `Return` 键接受默认配置（或使用\
    \ `-y` 标记）。\n\n## 设置 Express\n\n现在我们需要安装 [Express](http://expressjs.com/)。进入终端并输入此命令：\n\
    \n```bash\nnpm install express\n```\n\n我们还需要安装 [body-parser](https://www.npmjs.com/package/body-parser)\
    \ 中间件，它用于解析 Passport 用于验证用户的请求体。此外，我们需要安装 [express-session](https://www.npmjs.com/package/express-session)\
    \ 中间件。\n\n让我们来操作吧。运行以下命令：\n\n```bash\nnpm install body-parser express-session\n\
    ```\n\n完成后，在应用的根目录下创建一个 `index.js` 文件，并向其中添加以下内容：\n\n```javascript\n/*  EXPRESS\
    \ SETUP  */\n\nconst express = require('express');\nconst app = express();\n\n\
    app.use(express.static(__dirname));\n\nconst bodyParser = require('body-parser');\n\
    const expressSession = require('express-session')({\n  secret: 'secret',\n  resave:\
    \ false,\n  saveUninitialized: false\n});\n\napp.use(bodyParser.json());\napp.use(bodyParser.urlencoded({\
    \ extended: true }));\napp.use(expressSession);\n\nconst port = process.env.PORT\
    \ || 3000;\napp.listen(port, () => console.log('App listening on port ' + port));\n\
    ```\n\n首先，我们 `require` Express 并通过调用 [`express()`](http://expressjs.com/en/api.html#express)\
    \ 创建我们的 Express 应用。然后我们定义了提供静态文件的目录。\n\n下一行我们 `require` 了 body-parser 中间件，它将帮助我们解析请求体。我们还添加了\
    \ express-session 中间件来帮助我们保存 session cookie。\n\n如你所见，我们正在使用 `secret` 配置 express-session，以便对\
    \ session ID cookie 进行签名（你应该在这里选择一个唯一值），以及另外两个字段：[resave](https://github.com/expressjs/session#resave)\
    \ 和 [saveUninitialized](https://github.com/expressjs/session#saveUninitialized)。`resave`\
    \ 字段强制将 session 保存回 session 存储器，而 `saveUninitialized` 字段则强制将“未初始化”的 session 保存到存储器中。如需了解更多关于它们的信息，请查看它们的文档，但目前知道对于我们的情况，我们将它们设为\
    \ `false` 即可。\n\n然后，我们使用 `process.env.PORT` 在存在环境变量端口时将端口设置为该值。否则，我们将默认为 3000。最后调用\
    \ [`app.listen`](http://expressjs.com/en/api.html#express) 启动端口，并在控制台打印应用正在该端口上运行。\n"
- fmt: "\n```\n/* MONGOOSE SETUP */\n\nconst mongoose = require('mongoose');\nconst\
    \ passportLocalMongoose = require('passport-local-mongoose');\n\nmongoose.connect('mongodb://localhost/MyDatabase',\n\
    \  { useNewUrlParser: true, useUnifiedTopology: true });\n\nconst Schema = mongoose.Schema;\n\
    const UserDetail = new Schema({\n  username: String,\n  password: String\n});\n\
    \nUserDetail.plugin(passportLocalMongoose);\nconst UserDetails = mongoose.model('userInfo',\
    \ UserDetail, 'userInfo');\n```\n\nHere we require the previously installed packages.\
    \ Then we connect to our database using `mongoose.connect` and give it the path\
    \ to our database. Next, we’re making use of a [Schema](http://mongoosejs.com/docs/guide.html)\
    \ to define our data structure. In this case, we’re creating a `UserDetail` schema\
    \ with `username` and `password` fields.\n\nFinally, we add `passportLocalMongoose`\
    \ as a plugin to our `Schema`. This will work part of the magic we talked about\
    \ earlier. Then, we create a [model](http://mongoosejs.com/docs/models.html) from\
    \ that schema. The first parameter is the name of the collection in the database.\
    \ The second one is the reference to our `Schema`, and the third one is the name\
    \ we’re assigning to the collection inside Mongoose.\n\nThat’s all for the Mongoose\
    \ setup. We can now move on to implementing our Passport strategy.\n\n## Implementing\
    \ Local Authentication\n\nAnd finally, this is what we came here to do! Let’s\
    \ set up the local authentication. As you’ll see below, we’ll just write the code\
    \ that will set it up for us:\n\n```\n/* PASSPORT LOCAL AUTHENTICATION */\n\n\
    passport.use(UserDetails.createStrategy());\n\npassport.serializeUser(UserDetails.serializeUser());\n\
    passport.deserializeUser(UserDetails.deserializeUser());\n```\n\nThere’s quite\
    \ some magic going on here. First, we make `passport` use the local strategy by\
    \ calling `createStrategy()` on our `UserDetails` model—courtesy of `passport-local-mongoose`—which\
    \ takes care of everything so that we don’t have to set up the strategy. Pretty\
    \ handy.\n\nThen we’re using `serializeUser` and `deserializeUser` callbacks.\
    \ The first one will be invoked on authentication, and its job is to serialize\
    \ the user instance with the information we pass on to it and store it in the\
    \ session via a cookie. The second one will be invoked every subsequent request\
    \ to deserialize the instance, providing it the unique cookie identifier as a\
    \ “credential”. You can read more about that in the [Passport documentation](http://www.passportjs.org/docs/configure/#sessions).\n\
    \n## Routes\n\nNow let’s add some routes to tie everything together. First, we’ll\
    \ add a final package. Go to the terminal and run the following command:\n\n```\n\
    npm install connect-ensure-login\n```\n\nThe [connect-ensure-login](https://www.npmjs.com/package/connect-ensure-login)\
    \ package is middleware that ensures a user is logged in. If a request is received\
    \ that is unauthenticated, the request will be redirected to a login page. We’ll\
    \ use this to guard our routes.\n\nNow, add the following to the bottom of `index.js`:\n\
    \n```\n/* ROUTES */\n\nconst connectEnsureLogin = require('connect-ensure-login');\n\
    \napp.post('/login', (req, res, next) => {\n  passport.authenticate('local',\n\
    \  (err, user, info) => {\n    if (err) {\n      return next(err);\n    }\n\n\
    \    if (!user) {\n      return res.redirect('/login?info=' + info);\n    }\n\n\
    \    req.logIn(user, function(err) {\n      if (err) {\n        return next(err);\n\
    \      }\n\n      return res.redirect('/');\n    });\n\n  })(req, res, next);\n\
    });\n\napp.get('/login',\n  (req, res) => res.sendFile('html/login.html',\n  {\
    \ root: __dirname })\n);\n\napp.get('/',\n  connectEnsureLogin.ensureLoggedIn(),\n\
    \  (req, res) => res.sendFile('html/index.html', {root: __dirname})\n);\n\napp.get('/private',\n\
    \  connectEnsureLogin.ensureLoggedIn(),\n  (req, res) => res.sendFile('html/private.html',\
    \ {root: __dirname})\n);\n\napp.get('/user',\n  connectEnsureLogin.ensureLoggedIn(),\n\
    \  (req, res) => res.send({user: req.user})\n);\n```\n\nAt the top, we’re requiring\
    \ `connect-ensure-login`. We’ll come back to this later.\n\nNext, we set up a\
    \ route to handle a POST request to the `/login` path. Inside the handler, we\
    \ use the [passport.authenticate](http://www.passportjs.org/docs/authenticate/)\
    \ method, which attempts to authenticate with the strategy it receives as its\
    \ first parameter—in this case `local`. If authentication fails, it will redirect\
    \ us to `/login`, but it will add a query parameter—`info`—that will contain an\
    \ error message. Otherwise, if authentication is successful, it will redirect\
    \ us to the `'/'` route.\n\nThen we set up the `/login` route, which will send\
    \ the login page. For this, we’re using [res.sendFile()](http://expressjs.com/en/api.html#res.sendFile)\
    \ and passing in the file path and our root directory, which is the one we’re\
    \ working on—hence the `__dirname`.\n\nThe `/login` route will be accessible to\
    \ anyone, but our next ones won’t.\n\n## The Client\n\nThe client should be quite\
    \ simple. Let’s begin with the home page. In your project root, create a folder\
    \ called `html` and add a file called `index.html`. Add the following to it:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    \ />\n  <title> Home </title>\n  <link rel=\"stylesheet\" href=\"css/styles.css\"\
    >\n</head>\n\n<body>\n  <div class=\"message-box\">\n    <h1 id=\"welcome-message\"\
    ></h1>\n    <a href=\"/private\">Go to private area</a>\n  </div>\n\n  <script>\n\
    \    const req = new XMLHttpRequest();\n    req.onreadystatechange = function\
    \ () {\n      if (req.readyState == 4 && req.status == 200) {\n        const user\
    \ = JSON.parse(req.response).user;\n        document.getElementById(\"welcome-message\"\
    ).innerText = `Welcome ${user.username}!!`;\n      }\n    };\n    req.open(\"\
    GET\", \"http://localhost:3000/user\", true);\n    req.send();\n  </script>\n\
    </body>\n</html>\n```\n\nHere we have an empty `h1` tag where we’ll place our\
    \ welcome message and, below that, a link to `/private`. The crucial part here\
    \ is the `script` tag at the bottom where we’ll handle getting the username to\
    \ create the welcome message.\n\nThis is divided into four parts:\n\n1.  We instantiate\
    \ the request object using `new XMLHttpRequest()`.\n2.  We set the `onreadystatechange`\
    \ property with the function that will be called after we get our answer. In the\
    \ callback, we’re checking if we got a successful response and if so, we parse\
    \ the response, get the user object (the one we sent in the `/user` route, remember?),\
    \ and we find the `welcome-message` element to set its `innerText`.\n3.  We `open()`\
    \ the `GET` request to the user `URL` and we set the last parameter to `true`\
    \ to make it `asynchronous`.\n4.  Finally, we `send()` the request.\n\nNow we’ll\
    \ create the login page. As before, in the HTML folder create a file called `login.html`\
    \ and add the following content to it:\n"
