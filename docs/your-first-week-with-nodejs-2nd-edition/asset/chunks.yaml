    这告诉我们，弃用警告来自第 4 行的代码（`console.log` 语句），该语句是在 `bar` 函数运行时执行的。`bar` 函数是由第 8 行的 `foo`
    函数调用的，而 `foo` 函数在脚本的第 11 行被调用。


    请注意，相同的选项也可以传递给 [nodemon](https://nodemon.io/)。


    ## 控制台调试


    调试应用程序最简单的方法之一是在执行期间将值输出到控制台：


    ```javascript

    console.log( myVariable );

    ```


    很少有开发者深入研究这个简单的调试命令之外，但他们错过了[许多更多可能性](https://nodejs.org/api/console.html)，包括这些：


    | `console` 方法 | 描述 |

    | --- | --- |

    | [`.log(msg)`](https://nodejs.org/api/console.html#console_console_log_data_args)
    | 向控制台输出消息 |

    | [`.dir(obj,opt)`](https://nodejs.org/api/console.html#console_console_dir_obj_options)
    | 使用 [`util.inspect`](https://nodejs.org/api/util.html#util_util_inspect_object_options)
    格式化打印对象和属性 |

    | [`.table(obj)`](https://nodejs.org/api/console.html#console_console_table_tabulardata_properties)
    | 以表格格式输出对象数组 |

    | [`.error(msg)`](https://nodejs.org/api/console.html#console_console_error_data_args)
    | 输出错误消息 |

    | [`.count(label)`](https://nodejs.org/api/console.html#console_console_count_label)
    | 具名的计数器，报告该行执行的次数 |

    | [`.countReset[label]`](https://nodejs.org/api/console.html#console_console_countreset_label)
    | 重置命名计数器 |

    | [`.group(label)`](https://nodejs.org/api/console.html#console_console_group_label)
    | 对一组日志消息进行缩进 |

    | [`.groupEnd(label)`](https://nodejs.org/api/console.html#console_console_groupend)
    | 结束缩进组 |

    | [`.time(label)`](https://nodejs.org/api/console.html#console_console_time_label)
    | 启动计时器计算操作持续时间 |

    | [`.timeLog([label]`](https://nodejs.org/api/console.html#console_console_timelog_label_data)
    | 报告自计时器启动以来经过的时间 |

    | [`.timeEnd(label)`](https://nodejs.org/api/console.html#console_console_timeend_label)
    | 停止计时器并报告总持续时间 |

    | [`.trace()`](https://nodejs.org/api/console.html#console_console_trace_message_args)
    | 输出堆栈跟踪（所有调用函数的列表） |

    | [`.clear()`](https://nodejs.org/api/console.html#console_console_clear) | 清除控制台
    |


    `console.log()` 接受逗号分隔的值列表。例如：


    ```javascript

    let x = 123;

    console.log(''x:'', x);

    // x: 123

    ```


    然而，[ES6 解构](https://www.sitepoint.com/es6-destructuring-assignment/) 可以提供类似的输出，且输入量更少：


    ```javascript

    console.log({x});

    // { x: 123 }

    ```


    较大的对象可以使用此方法作为压缩字符串输出：


    ```javascript

    console.log( JSON.stringify(obj) );

    ```


    [`util.inspect`](https://nodejs.org/api/util.html#util_util_inspect_object_options)
    会格式化对象以便阅读，但 `console.dir()` 会为你完成这项工作。


    ## Node.js `util.debuglog`


    Node.js 的 `util` 模块提供了内置的 [`debuglog`](https://nodejs.org/api/util.html#util_util_debuglog_section)
    方法，可以根据条件将消息写入 `STDERR`：


    ```javascript

    const util = require(''util'');

    const debuglog = util.debuglog(''myapp'');


    debuglog(''myapp debug message [%d]'', 123);

    ```


    当环境变量 `NODE_DEBUG` 被设置为 `myapp`（或通配符如 `*` 或 `my*`）时，消息将显示在控制台中：


    ```bash

    NODE_DEBUG=myapp node index.js

    MYAPP 9876: myapp debug message [123]

    ```


    在这里，`9876` 是 Node.js 的进程 ID。


    默认情况下，`util.debuglog` 是静的。如果你在没有设置 `NODE_DEBUG` 变量的情况下运行上述脚本，控制台不会输出任何内容。这允许你在代码中留下有用的调试日志，而不会干扰日常使用的控制台。


    ## 使用日志模块进行调试


    如果你需要关于消息级别、详细程度、排序、文件输出、分析等等更复杂的选项，可以使用第三方日志模块。流行的选项包括：


    * [cabin](https://www.npmjs.com/package/cabin)

    * [loglevel](https://www.npmjs.com/package/loglevel)

    * [morgan](https://www.npmjs.com/package/morgan) (Express.js 中间件)


    ## Node.js V8 Inspector


    Node.js 器（不带调试器客户端）通过 `--inspect` 标志启动：


    ```bash

    node --inspect ./index.js

    ```


    #### `nodemon`


    如有必要，可以使用 `nodemon` 代替 `node`。


    这会启动监听 `127.0.0.1:9229` 的调试器，任何本地调试客户端都可以连接到它：


    ```

    Debugger listening on ws://127.0.0.1:9229/20ac75ae-90c5-4db6-af6b-d9d7459257f

    ```


    如果你在另一个设备或 Docker 容器上运行 Node.js ，请确保端口 `9229` 可用并使用以下命令授予远程访问：


    ```bash

    node --inspect=0.0.0.0:9229 ./index.js

    ```


    或者你可以使用 `--inspect-brk` 在第一语句处设置断点，使应用程序立即暂停。


    打开 Chromeget 地址栏中输入 `chrome://inspect`。


    #### 远程目标


    如果 Node.js 应用未显示为**远程目标 (Remote Target)**，请确保勾选了**发现网络目标 (Discover network targets)**，然后点击**配置
    (Configure)** 添加运行应用程序的设备的 IP 地址和端口。


    点击 Target 的 **inspect** 链接启动 DevTools。对于任何有浏览器调试经验的人来说，这会非常熟悉。


    **+ 添加文件夹到工作区 (Add folder to workspace)** 链接允许你选择 Node.js 文件在系统上的位置，这样加载其他模块和进行更改就会变得更容易。


