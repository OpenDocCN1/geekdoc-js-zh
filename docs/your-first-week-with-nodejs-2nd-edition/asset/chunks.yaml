- fmt: "\nThe most recent version is TLS 1.3. `TLS` is the successor of `SSL`, which\
    \ is available in its latest release `SSL 3.0`. The changes from `SSL` to `TLS`\
    \ preclude interoperability, but the basic procedure is, however, unchanged. We\
    \ have three different encrypted channels. The first is a public key infrastructure\
    \ for certificate chains. The second provides public key cryptography for key\
    \ exchanges. Finally, the third one is symmetric. Here we have cryptography for\
    \ data transfers.\n\n`TLS 1.3 uses hashing for some important operations. Theoretically,\
    \ it’s possible to use any hashing algorithm, but it’s highly recommended to use\
    \ `SHA2` or a stronger algorithm. `SHA1` has been a standard for a long time but\
    \ has recently become obsolete.\n\n`HTTPS` is also gaining more attention for\
    \ clients. Privacy and security concerns have always been around, but with the\
    \ growing amount of online accessible data and services, people are getting more\
    \ and more concerned. For those sites that don’t implement it, there is a useful\
    \ browser extension—[HTTPS Everywhere from the EFF](https://www.eff.org/https-everywhere)—which\
    \ encrypts our communications with most websites.\n\n![HTTPS-everywhere](Images/https-everywhere.png)\n\
    \nThe creators realized that many websites offer `HTTPS` only partially. The plugin\
    \ allows us to rewrite requests for those sites that offer only partial `HTTPS`\
    \ support. Alternatively, we can also block `HTTP` altogether (see the screenshot\
    \ above).\n\n## Basic Communication\n\nThe certificate’s validation process involves\
    \ validating the certificate signature and expiration. We also need to verify\
    \ that it chains to a trusted root. Finally, we need to check to see if it’s been\
    \ revoked. There are dedicated, trusted authorities in the world that grant certificates.\
    \ In case one of these were to become compromised, all other certificates from\
    \ the said authority would get revoked.\n\nThe sequence diagram for an `HTTPS`\
    \ handshake looks as follows. We start with the initialization from the client,\
    \ which is followed by a message with the certificate and key exchange. After\
    \ the server sends its completed package, the client can start the key exchange\
    \ and cipher specification transmission. At this point, the client is finished.\
    \ Finally the server confirms the cipher specification selection and closes the\
    \ handshake.\n\n![HTTPS-sequence](Images/sequence.png)\n\nThe whole sequence is\
    \ triggered independently of `HTTP`. If we decide to use `HTTPS`, only the socket\
    \ handling is changed. The client is still issuing `HTTP` requests, but the socket\
    \ will perform the previously described handshake and encrypt the content (header\
    \ and body).\n\nSo what do we need to make `SSL/TLS` work with an `Express.js`\
    \ server?\n\n## HTTPS\n\nBy default, `Node.js` serves content over `HTTP`. But\
    \ there’s also an [HTTPS module](https://nodejs.org/api/https.html) that we have\
    \ to use in order to communicate over a secure channel with the client. This is\
    \ a built-in module, and the usage is very similar to how we use the `HTTP` module:\n\
    \n```\nconst https = require(\"https\"),\n  fs = require(\"fs\");\n\nconst options\
    \ = {\n  key: fs.readFileSync(\"/srv/www/keys/my-site-key.pem\"),\n  cert: fs.readFileSync(\"\
    /srv/www/keys/chain.pem\")\n};\n\nconst app = express();\n\napp.use((req, res)\
    \ => {\n  res.writeHead(200);\n  res.end(\"hello world\\n\");\n});\n\napp.listen(8000);\n\
    \nhttps.createServer(options, app).listen(8080);\n```\n\nIgnore the `/srv/www/keys/my-site-key.pem`\
    \ and `/srv/www/keys/chain.pem` files for the moment. Those are the `SSL` certificates\
    \ we need to generate, which we’ll do a bit later. This is the part that changed\
    \ with Let’s Encrypt. Previously, we had to generate a private/public key pair,\
    \ send it to a trusted authority, pay them and probably wait for a bit in order\
    \ to get an `SSL` certificate. Nowadays, Let’s Encrypt instantly generates and\
    \ validates your certificates for free!\n\n## Generating Certificates\n\n### Certbot\n\
    \nThe `TLS` specification demands a certificate, which is signed by a trusted\
    \ certificate authority (`CA`). The `CA` ensures that the certificate holder is\
    \ really who they claim to be. So basically when you see the green lock icon (or\
    \ any other greenish sign to the left side of the URL in your browser) it means\
    \ that the server you’re communicating with is really who it claims to be. If\
    \ you’re on `facebook.com` and you see a green lock, it’s almost certain you really\
    \ are communicating with Facebook and no one else can see your communication—or\
    \ rather, no one else can read it.\n\nIt’s worth noting that this certificate\
    \ doesn’t necessarily have to be verified by an authority such as Let’s Encrypt.\
    \ There are other paid services as well. [You can technically sign it yourself](https://stackoverflow.com/q/10175812),\
    \ but then (as you’re not a trusted `CA`) the users visiting your site will likely\
    \ see a large scary warning offering to get them back to safety.\n\nIn the following\
    \ example, we’ll use the `Certbot`, which is used to generate and manage certificates\
    \ with Let’s Encrypt. [On the Certbot site](https://certbot.eff.org/) you can\
    \ find instructions on how to install `Certbot` for almost any OS/server combination.\
    \ You should choose the options that are applicable to you.\n\nA common combination\
    \ for deploying Node apps is `NGINX` on the latest LTS `Ubuntu` and that’s what\
    \ I’ll use here.\n\n```\nsudo apt-get update\nsudo apt-get install software-properties-common\n\
    sudo add-apt-repository universe\nsudo add-apt-repository ppa:certbot/certbot\n\
    sudo apt-get update\n```\n\n#### Webroot\n\n[Webroot is a](https://certbot.eff.org/docs/using.html#webroot)\
    \ that, in addition to Certbot default (which places some verification code into\
    \ a hidden directory named `.well-known`), also copies the certificates to your\
    \ webroot. In order to skip some of these steps manually, we’ll use this:\n\n\
    ```\ncertbot certonly --webroot -w /var/www/example/ -d www.example.com -d example.com\n\
    ```\n\nYou may have to run this command as sudo, as it will try to write to `/var/log`.\
    \ You’ll also be asked for your email address. It’s a good idea to put in a real\
    \ address you use often, as you’ll get a notification if your certificate is about\
    \ to expire. The trade-off for Let’s Encrypt issuing a free certificate is that\
    \ it expires three months. Luckily, renewal is as easy as running one simple command,\
    \ which we can [assign to a cron job](https://www.howogeek.com/101288/how-to-schedule-tasks-on-linux-an-introduction-crontab-files/)\
    \ and then not have to worry about expiration. Additionally, it’s a good security\
    \ practice to renew `SSL` certificates, as it gives attackers less time to break\
    \ the encryption. Sometimes developers even set up this cron to run daily, which\
    \ is completely fine and even recommended.\n\nKeep in mind that you have to run\
    \ this command on a server to which the domain specified under the `-d` (for domain)\
    \ flag resolves—that is, your production server. Even if you have the DNS resolution\
    \ in your local hosts file, this won’t work, as the domain will be verified from\
    \ outside. So if you’re doing this locally, it will most likely fail, unless you\
    \ opened up a port from your local machine to the outside world and have it running\
    \ behind a domain name which resolves to your machine. This is a highly unlikely\
    \ scenario.\n\nLast but not least, after running this command, the output will\
    \ contain paths to your private key and certificate files. Copy these values into\
    \ the previous code snippet—into the `cert` property for certificate, and the\
    \ `key` property for the key:\n\n```javascript\n// ...\n\nconst options = {\n\
    \  key: fs.readFileSync(\"/var/www/example/sslcert/privkey.pem\"),\n  cert: fs.readFileSync(\"\
    /var/www/example/sslcert/fullchain.pem\") // these paths might differ for you,\
    \ make sure to copy from the certbot output\n};\n\n// ...\n```\n"
