    \ server.start();\n  console.log(`Server running at: ${server.info.uri}`);\n};\n\
    \nprocess.on(\"unhandledRejection\", err => {\n  console.log(err);\n  process.exit(1);\n\
    });\n\ninit();\n```\n\nThis is going to be the foundation of our application.\n\
    \nFirst, we indicate that we’re going to use [strict mode](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode),\
    \ which is a [common practice](https://hapi.dev/policies/styleguide/#strict-mode)\
    \ when using the Hapi.js framework.\n\nNext, we include our dependencies and instantiate\
    \ a new server object where we set the connection port to `3000` (the port can\
    \ be any number [above 1023 and below 65535](http://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml)).\n\
    \nOur first route for our server will work as a test to see if everything is working,\
    \ so a “Hello, world!” message is enough for us. In each route, we have to define\
    \ the HTTP method and path (URL) that it will respond to, and a handler, which\
    \ is a function that will process the HTTP request. The handler function can take\
    \ two arguments: `request` and `h`. The first one contains information about the\
    \ HTTP call, and the second will provide us with methods to handle our response\
    \ to that call.\n\nFinally, we start our server with the `server.start()` method.\n\
    \n## Storing Our Settings\n\nIt’s good practice to store our configuration variables\
    \ in a dedicated file. This file exports a JSON object containing our data, where\
    \ each key is assigned from an environment variable—but without forgetting a fallback\
    \ value.\n\nIn this file, we can also have different settings depending on our\
    \ environment (such as development or production).\n\n### Using a .env File\n\n\
    If you decide to use `.env`, make sure you install dotenv and add it to `.gitignore`.\n\
    \nOur `settings.js` file will look like this:\n\n```\n// This will load our .env\
    \ and add to process.env\n// IMPORTANT: Omit this line if you don't want to use\
    \ this\nrequire(\"dotenv\").config({ silent: true });\n\nmodule.exports = {\n\
    \  port: process.env.PORT || 3000,\n  env: process.env.NODE_ENV || \"development\"\
    ,\n\n  // Environment-dependent settings\n  development: {\n    db: {\n      dialect:\
    \ \"sqlite\",\n      storage: \":memory:\"\n    }\n  },\n  production: {\n   \
    \ db: {\n      dialect: \"sqlite\",\n      storage: \"db/database.sqlite\"\n \
    \   }\n  }\n};\n```\n\nNow we can start our application by executing the following\
    \ command and navigating to [http://localhost:3000](http://localhost:3000) in\
    \ our web browser:\n\n```\nnode server.js\n```\n\n## Defining the Routes\n\nThe\
    \ definition of routes gives us an overview of the functionality supported by\
    \ our application. To create our additional routes, we just have to replicate\
    \ the structure of the route that we already have in our `server.js` file, changing\
    \ the content of each one.\n\nLet’s start by creating a new directory called `lib`\
    \ in our project. Here we’re going to include all the JS components.\n\nInside\
    \ `lib`, let’s create a `routes.js` file and add the following content:\n\n```javascript\n\
    \"use strict\";\nconst Path = require(\"path\");\n\nmodule.exports = [\n  // we’re\
    \ going to define our routes here\n];\n```\n\nIn this file, we’ll export an array\
    \ of objects that contain each route of our application. To define the first route,\
    \ add the following object to the array:\n\n```javascript\n{\n  method: \"GET\"\
    ,\n  path: \"/\",\n  handler: (request, h) => {\n    return \"All the notes will\
    \ appear here\";\n  },\n  config: {\n    description: \"Gets all the notes available\"\
    \n  }\n},\n```\n"
  raw: "Model-View-Controller (or MVC) is probably one of the most popular architectures\
    \ for applications. As with a lot of other [cool things in computer history](https://youtu.be/NdSD07U5uBs?t=29m2s),\
    \ the MVC model was conceived at [PARC](https://en.wikipedia.org/wiki/PARC_(company))\
    \ for the Smalltalk language as a solution to the problem of organizing applications\
    \ with graphical user interfaces. It was created for desktop applications, but\
    \ since then, the idea has been adapted to other mediums including the Web.\n\n\
    We can describe the MVC architecture in simple terms:\n\n*   **Model**: the part\
    \ of our application that will deal with the database or any data-related functionality.\n\
    \n*   **View**: everything the user will see—basically, the pages that we’re going\
    \ to send to the client.\n\n*   **Controller**: the logic of our site, and the\
    \ glue between models and views. Here we call our models to get the data, then\
    \ we put that data on our views to be sent to the users.\n\nOur application will\
    \ allow us to create, view, edit and delete plain-text notes. It won’t have other\
    \ functionality, but because we’ll have a solid architecture already defined we\
    \ won’t have a lot of trouble adding things later.\n\nThis tutorial assumes you\
    \ have a recent version of Node installed on your machine. If this isn’t the case,\
    \ please consult our [tutorial on getting up and running with Node](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\n\
    \nYou can check out the final application in the [accompanying GitHub repository](https://github.com/sitepoint-editors/notes-board),\
    \ so you get a general overview of the application structure.\n\n## Laying out\
    \ the Foundation\n\nThe first step when building any Node.js application is to\
    \ create a `package.json` file, which is going to contain all of our dependencies\
    \ and scripts. Instead of creating this file manually, npm can do the job for\
    \ us using the `init` command:\n\n```\nmkdir notes-board\ncd notes-board\nnpm\
    \ init -y\n```\n\nAfter the process is complete, we’ll have a `package.json` file\
    \ ready to use.\n\n#### npm Commands\n\nIf you’re not familiar with these commands,\
    \ check out our [Beginner’s Guide to npm](https://www.sitepoint.com/beginners-guide-node-package-manager/).\n\
    \nWe’re going to proceed to install Hapi.js—the framework of choice for this tutorial.\
    \ It provides a good balance between simplicity, stability and features that will\
    \ work well for our use case (although there are other options that would also\
    \ work just fine).\n\n```\nnpm install @hapi/hapi@18.4.0\n```\n\nThis command\
    \ will download Hapi.js and add it to our `package.json` file as a dependency.\n\
    \n#### Versions\n\nI’ve specified v18.4.0 of Hapi.js, as it’s compatible with\
    \ Node versions 8, 10, and 12\\. If you’re using Node 12, you can opt to install\
    \ the latest version (Hapi v19.1.0).\n\nNow we can create our entry file—the web\
    \ server that will start everything. Go ahead and create a `server.js` file in\
    \ your application directory and add the following code to it:\n\n```\n\"use strict\"\
    ;\n\nconst Hapi = require(\"@hapi/hapi\");\nconst Settings = require(\"./settings\"\
    );\n\nconst init = async () => {\n  const server = new Hapi.Server({ port: Settings.port\
    \ });\n\n  server.route({\n    method: \"GET\",\n    path: \"/\",\n    handler:\
    \ (request, h) => {\n      return \"Hello, world!\";\n    }\n  });\n\n  await\
    \ server.start();\n  console.log(`Server running at: ${server.info.uri}`);\n};\n\
    \nprocess.on(\"unhandledRejection\", err => {\n  console.log(err);\n  process.exit(1);\n\
    });\n\ninit();\n```\n\nThis is going to be the foundation of our application.\n\
    \nFirst, we indicate that we’re going to use [strict mode](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode),\
    \ which is a [common practice](https://hapi.dev/policies/styleguide/#strict-mode)\
    \ when using the Hapi.js framework.\n\nNext, we include our dependencies and instantiate\
    \ a new server object where we set the connection port to `3000` (the port can\
    \ be any number [above 1023 and below 65535](http://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml)).\n\
    \nOur first route for our server will work as a test to see if everything is working,\
    \ so a “Hello, world!” message is enough for us. In each route, we have to define\
    \ the HTTP method and path (URL) that it will respond to, and a handler, which\
    \ is a function that will process the HTTP request. The handler function can take\
    \ two arguments: `request` and `h`. The first one contains information about the\
    \ HTTP call, and the second will provide us with methods to handle our response\
    \ to that call.\n\nFinally, we start our server with the `server.start()` method.\n\
    \n## Storing Our Settings\n\nIt’s good practice to store our configuration variables\
    \ in a dedicated file. This file exports a JSON object containing our data, where\
    \ each key is assigned from an environment variable—but without forgetting a fallback\
    \ value.\n\nIn this file, we can also have different settings depending on our\
    \ environment (such as development or production). For example, we can have an\
    \ in-memory instance of SQLite for development purposes, but a real SQLite database\
    \ file on production.\n\nSelecting the settings depending on the current environment\
    \ is quite simple. Since we also have an `env` variable in our file which will\
    \ contain either `development` or `production`, we can do something like the following\
    \ to get the database settings:\n\n```\nconst dbSettings = Settings[Settings.env].db;\n\
    ```\n\nSo `dbSettings` will contain the setting of an in-memory database when\
    \ the `env` variable is `development`, or will contain the path of a database\
    \ file when the `env` variable is `production`.\n\nAlso, we can add support for\
    \ a `.env` file, where we can store our environment variables locally for development\
    \ purposes. This is accomplished using a package like [dotenv](https://www.npmjs.com/package/dotenv)\
    \ for Node.js, which will read a `.env` file from the root of our project and\
    \ automatically add the found values to the environment.\n\n#### Using a `.env`\
    \ File\n\nIf you decide to also use a `.env` file, make sure you install the package\
    \ with `npm install dotenv` and add it to `.gitignore` so you don’t publish any\
    \ sensitive information.\n\nOur `settings.js` file will look like this:\n\n```\n\
    // This will load our .env file and add the values to process.env,\n// IMPORTANT:\
    \ Omit this line if you don't want to use this functionality\nrequire(\"dotenv\"\
    ).config({ silent: true });\n\nmodule.exports = {\n  port: process.env.PORT ||\
    \ 3000,\n  env: process.env.NODE_ENV || \"development\",\n\n  // Environment-dependent\
    \ settings\n  development: {\n    db: {\n      dialect: \"sqlite\",\n      storage:\
    \ \":memory:\"\n    }\n  },\n  production: {\n    db: {\n      dialect: \"sqlite\"\
    ,\n      storage: \"db/database.sqlite\"\n    }\n  }\n};\n```\n\nNow we can start\
    \ our application by executing the following command and navigating to [http://localhost:3000](http://localhost:3000)\
    \ in our web browser:\n\n```\nnode server.js\n```\n\n#### Up-to-date Install\n\
    \nThis project was tested on Node v12.15.0\\. If you get any errors, ensure you\
    \ have an updated installation.\n\n## Defining the Routes\n\nThe definition of\
    \ routes gives us an overview of the functionality supported by our application.\
    \ To create our additional routes, we just have to replicate the structure of\
    \ the route that we already have in our `server.js` file, changing the content\
    \ of each one.\n\nLet’s start by creating a new directory called `lib` in our\
    \ project. Here we’re going to include all the JS components.\n\nInside `lib`,\
    \ let’s create a `routes.js` file and add the following content:\n\n```\n\"use\
    \ strict\";\nconst Path = require(\"path\");\n\nmodule.exports = [\n  // we’re\
    \ going to define our routes here\n];\n```\n\nIn this file, we’ll export an array\
    \ of objects that contain each route of our application. To define the first route,\
    \ add the following object to the array:\n\n```\n{\n  method: \"GET\",\n  path:\
    \ \"/\",\n  handler: (request, h) => {\n    return \"All the notes will appear\
    \ here\";\n  },\n  config: {\n    description: \"Gets all the notes available\"\
    \n  }\n},\n```"
