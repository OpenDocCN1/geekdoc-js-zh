    \ automatically restart. There’s no need to rebuild the image or restart the container\
    \ unless you install further modules (access the shell using `docker exec -it\
    \ nodeapp sh`).\n\n## Using Docker Compose During Development\n\nStarting Docker\
    \ containers individually is awkward, especially when the commands are so complex!\
    \ Fortunately, Docker Compose can manage any number of containers quickly and\
    \ effectively in a single command.\n\nPresume we want to launch three containers\
    \ in development mode within a Docker network named `localnet`:\n\n1.  A MySQL\
    \ database container named `mysql` saves data to a Docker volume named `mysqldata`\
    \ and exposes port 3306.\n\n2.  The PHP [Adminer database client](https://www.adminer.org/)\
    \ named `adminer` exposes the web application on port 8080.\n\n3.  The Node.js\
    \ Express application defined above runs nodemon and exposes the web application\
    \ on port 3000.\n\nCreate a file named `docker-compose.yml` in your project folder\
    \ with the following content (tabs are critical):\n\n```\nversion: '3'\n\nservices:\n\
