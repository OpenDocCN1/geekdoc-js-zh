- fmt: '

    Clicking any line number sets a breakpoint, denoted by a green marker, which stops
    execution when that code is reached:


    ![Chrome DevTools breakpoint](Images/chrome-breakpoint.png)


    Variables can be added to the `Watch` pane on the right by clicking the `+` icon
    and entering their name. Their value is shown whenever execution is paused.


    The `Call Stack` pane shows which functions were called to reach this point.


    The `Scope` pane shows the state of all available local and global variables.


    The `Breakpoints` pane shows a list of all breakpoints and allows them to be enabled
    or disabled.


    The icons above the `Debugger paused` message can be used to resume execution,
    step over, step into, step out, step through, deactivate all breakpoints, and
    pause on exceptions.


    ## Node.js Debugging with VS Code


    VS Code Node.js debugging can be launched without any configuration when you’re
    running a Node.js application on your local system. Open the starting file (typically
    `index.js`), activate the `Run and Debug` pane, and click the `Run and Debug Node.js
    (F5)` button.


    ![VS Code debugger](Images/vscode-debug.png)


    The debugging screen is similar to Chrome DevTools with a `Variables`, `Watch`,
    `Call stack`, `Loaded scripts`, and `Breakpoints` list.


    ![VS Code breakpoint](Images/vscode-breakpoint.png)


    A breakpoint can be set by clicking the gutter next to the line number. You can
    also right-click.


    ![VS Code breakpoint options](Images/vscode-points.png)


    With this right-click, you can set the following:


    1. A standard breakpoint.

    2. A conditional breakpoint which stops when criteria are met—for example, `count
    > 3`.

    3. A logpoint, which is effectively `console.log()` without code! Any string can
    be entered with expressions denoted in curly braces—for example, `{count}` to
    display the value of the `count` variable.


    ![VS Code logpoint](Images/vscode-logpoint.png)


    ### Return


    Don’t forget to hit `Return` for VS Code to create your conditional breakpoint
    or logpoint.


    The debugging icon bar at the top can be used to resume execution, step over,
    step into, step out, restart, or stop the application and debugging. Identical
    options are also available from the `Debug` item in the menu.


    For more information, refer to [Debugging in Visual Studio Code](https://code.visualstudio.com/docs/introvideos/debugging).


    ### Advanced Debugging Configuration


    Further configuration is required when you’re debugging a remote service or need
    to use different launch options. VS Code stores launch configurations in a `launch.json`
    file generated inside the `.vscode` folder within your project. To generate or
    edit the file, click the cog icon at the top right of the `Run and Debug` pane.


    ![VS Code launch configuration](Images/vscode-launch.png)


    Any number of configuration settings can be added to the `configurations` array.
    Click the `Add Configuration` button to choose an option. VS Code can either:


    1. **launch** a process using Node.js itself, or

    2. **attach** to a Node.js inspector process, perhaps running on a remote machine
    or Docker container


    In the example above, a single Nodemon launch configuration has been defined.
    Save `launch.json`, select `nodemon` from the drop-down list at the top of the
    `Run and Debug` pane, and click the green start icon.


    ![VS Code launch](Images/vscode-launchconfig.png)


    For further information, see [VS Code Launch configurations](https://code.visualstudio.com/docs/editor/debugging#_launch-configurations).


    ## Other Node.js Debugging Tools


    The [Node.js Debugging Guide](https://nodejs.org/en/docs/guides/debugging-getting-started/)
    provides advice for other IDEs and editors including Visual Studio, JetBrains,
    WebStorm, Gitpod, and Eclipse. Atom also has a [node-debug](https://atom.io/packages/node-debug)
    extension.


    [ndb](https://github.com/GoogleChromeLabs/ndb) offers an improved debugging experience
    with powerful features such as attaching to child processes and script blackboxing
    so only code in specific folders is shown.


    The [IBM report-toolkit for Node.js](https://github.com/ibm/report-toolkit) works
    by analyzing data output when `node` is run with the `--experimental-report` option.


    Finally, commercial services such as [LogRocket](https://logrocket.com/) and [Sentry.io](https://sentry.io/)
    integrate with your live web application in both the client and the server to
    record errors as they’re encountered by users.


    ## Get Debugging!


    Node.js has a range of great debugging tools and code analyzers which can improve
    the speed and reliability of your application. Whether or not they can tempt you
    away from `console.log()` is another matter!


    # Chapter 9: Node Testing for Beginners


    ### by M. David Green


    Does testing seem like an unwelcome intrusion on your development work day? Don’t
    worry, I get it.


    If you started out not writing tests as part of your development process, testing
    can seem weird and complex. That’s especially true when you want to believe you’ve
    already got everything working. Nobody enjoys being confronted with proof of how
    brittle all the complex and intricate code they’ve spent the last few days (or
    years) polishing and perfecting might be.


    Testing conjures up the need for a whole new parallel codebase, perhaps as large
    as the one you already have, in an unfamiliar syntax. And the notion of test-driven
    development might force you to think through your. Even better, working in Node
    gives you the advantage of a mature development community that embraced testing
    early on. In fact, depending on how you integrate it, testing can make it easier
    to clarify your intentions, increase your flexibility, and relieve much of your
    anxiety around the eventual need to maintain your code.


    ## What Testing Is


    At its simplest, testing is just a way to verify whether your code does a thing
    you think it does. You write a test that asks whether running your code with a
    particular input produces an expected output. Once you make that test pass, and
    you like the way your updated code looks, you write another test to make sure
    a different input produces a different expected output.


    And so on. Then eventually you have tests for every condition you need. Once they
    all pass, you can be pretty confident that you’re done!


    ## Basic Assertion Testing Built In


    If you’ve looked around at test frameworks to use in Node, you may have noticed
    that there are several to choose from. It’s not easy for someone new to testing
    to decide which one makes the sense for your purposes.


    We’ll introduce you to a few of the more popular testing frameworks later in this
    guide. But to get started right away, you don’t need to worry about any of that.
    Node comes with a built-in assertion testing capability you can use immediately,
    just by requiring `assert`.


    ### The Existential Assertion


    To see how `assert` works, we can start by creating a new directory for our application
    and its tests. In this case, we might know we’ll need functionality to test whether
    a number is even. That’s a pretty basic bit of functionality, but I want to keep
    this example simple so we can focus on how we test. What we’ll learn here will
    apply to more complex requirements as well.


    To keep ourselves somewhat organized as we start to write our new application,
    we would first create a file called `tests.js` to keep all our tests in one place.
    The first step in our testing plan is to capture our first requirement without
    even making sure that the function we’re going to call exists. (And we know it
    doesn’t because we haven’t written it yet.)


    ```

    const assert = require(''assert'');

    const isFourEven = isEven(4);


    assert(isFourEven, ''isEven(4) does not return falsy'');

    ```

