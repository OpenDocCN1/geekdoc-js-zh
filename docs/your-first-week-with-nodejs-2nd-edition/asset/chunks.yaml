  trans: "\n接下来我们来看 Node.js 最大的用例之一——在服务器上运行 JavaScript。这并不是一个新概念，Netscape 早在 19944\
    \ 年就尝试过它。然而，Node.js 是第一个获得真正关注的实现，而且与传统语言相比，它提供了一些独特的优势。现在，Node 在[许多知名公司](https://www.netguru.co/blog/top-companies-used-nodejs-production)\
    \ 的技术栈中都扮演着至关重要的角色。让我们来看看这些优势是什么。\n\n### Node.js 执行模型\n\n从非常简单来说，当你连接到像 Apache\
    \ 这样的传统服务器时，它会创建一个新线程来处理请求。在 PHP 或 Ruby 这样的语言中，任何后续的 I/O 操作（例如与数据库交互）都会阻塞你代码的执行，直到操作完成。也就是说，服务器必须等待数据库查询完成后才能继续处理结果。如果在此期间有新请求进入，服务器将创建新线程来处理它们。这可能是低效的，因为大量的线程会导致系统变得缓慢——在最坏的情况下，会导致网站崩溃。支持更多连接的最常用方法是添加更多服务器。\n\
    \n然而，Node.js 是单线程的。它还是`事件驱动`的，这意味着 Node 中发生的一切都是对某个事件的响应。例如，当一个新请求进来时（一种事件），服务器将开始处理它。如果它随后遇到一个阻塞的\
    \ I/O 操作，它不会等待该操作完成，而是在继续处理下一个事件之前注册一个回调函数。当 I/O 操作完成（另一种事件）时，服务器将执行该回调并继续处理原始请求。在底层，Node\
    \ 使用[libuv](https://github.com/libuv/libuv) 库来实现这种异步（即，非阻塞）行为。\n\nNode 的执行模型为服务器带来的额外开销非常小，因此它能够处理大量的并发连接。扩展\
    \ Node 应用的传统方法是克隆它，并让克隆的实例共享负载。Node.js 甚至有一个[内置模块](https://nodejs.org/api/cluster.html)\
    \ 来帮助你在单服务器上实现克隆策略。\n\n下面的图片描述了 Node 的执行模型：\n\n![Node’s execution model](img/node_event_loop.png)\n\
    \n*图片来源：Introduction to Node.js，由 Christian Maderazo 教授和 James Santos 编写。*\n\n\
    或者，如果你喜欢视频，可以查看这个精彩的演讲：[到底什么是事件循环？](https://www.youtube.com/watch?v=8aGhZQkoFbQ)\
    \ 它不是 Node 专有的，但它在解释这个概念方面做得非常出色。\n\n### 有什么缺点吗？\n\nNode 运行在单线程中这一事实确实带来了一些限制。例如，应该避免阻塞的\
    \ I/O 调用，[对于 CPU 密集型操作应该交给工作线程](https://blog.logrocket.com/node-js-multithreading-what-are-worker-threads-and-why-do-they-matter-48ab102f8b10/)，并且应该始终正确处理错误，以免整个进程崩溃。\n\
    \n一些开发者也不喜欢 JavaScript 强制要求的基于回调的编码风格（以至于甚至有一个[专门讨论编写异步 JavaScript 恐怖之地的网站](http://callbackhell.com/)）。但但随着原生\
    \ Promises 的出现，以及紧随其后的 async await，[现代 JavaScript 中的流控制](https://www.sitepoint.com/flow-control-callbacks-promises-async-await/)已经变得比以往任何时候都更容易了。\n\
    \n### “Hello, World!”——服务器版本\n\n让我们快速看一个简单的“Hello, World!”HTTP 服务器示例：\n\n```\n\
    const http = require('http');\n\nhttp.createServer((request, response) => {\n\
    \  response.writeHead(200);\n  response.end('Hello, World!');\n}).listen(3000);\n\
    \nconsole.log('Server running on http://localhost:3000');\n```\n\n要运行此代码，将代码复制到名为\
    \ `hello-world-server.js` 的文件中，并使用 `node hello-world-server.js` 运行它。打开浏览器并访问 [`localhost:3000`](http://localhost:3000)，即可在浏览器中看到“Hello,\
    \ World!”。\n\n现在让我们来看代码。\n\n我们首先引入 Node 的原 own [HTTP 模块](https://nodejs.org/api/http.html)。然后我们使用它的\
    \ [createServer](https://nodejs.org/api/http.html#http_http_createserver_options_requestlistener)\
    \ 方法创建一个新的 Web 服务器对象，并向其传递一个匿名函数。每当建立到服务器的每一个新连接时，该函数都会被调用。\n\n匿名函数带有两个参数（`request`\
    \ 和 `response`）。这些参数包含了来自用户的请求和响应，我们用响应来发送 200 HTTP 状态码以及我们的“Hello World!”消息。\n\
    \n最后，我们告诉服务器在 3000 端口上监听传入的请求，并在终端输出一条消息让我们知道它正在运行。\n\n显然，在 Node 中创建一个即使是简单的服务器还有很多工作要做了（例如，正确处理错误非常重要），因此建议你[查看文档](https://nodejs.org/en/docs/guides/anatomy-of-http-transaction/)。\n\
    \n## Node 适用于什么样的应用程序？\n\nNode 特别适用于构建需要实时交互或协作的应用——例如聊天网站，或者像 [Codeshare](https://codeshare.io/)\
    \ 这样的应用（你可以看到他人实时编辑文档）。它也适合构建大量 I/O 驱动的 API（例如需要对数据库执行操作），或涉及数据流的站点，因为 Node 可以在文件上传时对其进行处理。如果你对\
    \ Node 的实时特性感兴趣，可以查看我们关于[构建实时聊天应用程序](https://www.sitepoint.com/building-real-time-chat-app-sails/)的教程。\n\
    \n尽管如此，并不是所有人都要构建下一个 Trello 或 Google Docs，而且实际上，你没有理由不使用 Node 构建一个简单的 CRUD 应用。然而，如果你遵循这条路线，你很快会发现\
    \ Node 是非常精简的，构建和组织应用的方法很大程度上取决于你。可以使用各种框架来减少样板代码，其中 [Express](http://expressjs.com)\
    \ 已确立了它的领先地位。然而，即使是 Express 这样的解决方案也是最小的，这意味着如果你想做任何稍微特殊的事情，就需要从 npm 引入额外的模块。\n\
    \n## Node.js 的优势有哪些？\n\n除了速度和可扩展性之外，在 Web 服务器（以及浏览器）中中使用 JavaScript 的另一个经常被提及的优势是，你的大脑不再需要切换模式。你可以用同一种语言完成所有工作，对于开发者来说，这让你效率更高（可能也更快乐）。\n\
    \nNode 的另一个优点是它精通 JSON。JSON 可能是 Web 上最重要的数据交换格式，也是与对象数据库（如 MongoDB）交互的通用语言。JSON\
    \ 非常适合 JavaScript 程序消费，这意味着当你使用 Node 工作时，数据可以在层与层之间流畅流动，无需重新格式化。你可以拥有从浏览器到服务器到数据库的统一语法。\n"
- fmt: "\nFinally, JavaScript is ubiquitous: most of us are familiar with JavaScript,\
    \ or have used it at some point. This means that transitioning to Node development\
    \ is potentially easier than to other-side languages. To quote Craig Buckler in\
    \ his [Node vs PHP Smackdown](https://www.sitepoint.com/sitepoint-smackdown-php-vs-node-js/),\
    \ JavaScript might remain [the world’s most misunderstood language](http://www.crockford.com/javascript/javascript.html)—but,\
    \ once the concepts click, it makes other languages seem cumbersome.\n\n## Other\
    \ Uses of Node\n\nAnd it doesn’t stop at the server. There are many other exciting\
    \ and varied uses of Node.js!\n\nFor example [it can be used as a scripting language](https://www.sitepoint.com/shell-scripts-javascript/)\
    \ to automate repetitive or error prone tasks on your PC. It can also be used\
    \ to write your own command line tool, such as this [Yeoman-Style generator](https://www.sitepoint.com/scaffolding-tool-caporal-js/)\
    \ to scaffold out new projects.\n\nNode.js can also can be used to [build cross-platform\
    \ desktop apps](https://www.sitepoint.com/premium/books/build-a-native-desktop-gif-search-app-using-nodegui/read/)\
    \ and even to [create your own robots](https://www.sitepoint.com/an-introduction-to-nodebots/).\
    \ What’s not to love?\n\n## Conclusion\n\nJavaScript is everywhere, and Node is\
    \ a vast and expansive subject. Nonetheless, I hope that in this guide I’ve offered\
    \ you the beginner-friendly, high-level look at Node.js and its main paradigms\
    \ that I promised at the beginning. I also hope that when you re-read the definitions\
    \ we looked at previously, things will make a lot more sense.\n\n> Node.js is\
    \ an event-based, non-blocking, asynchronous I/O runtime that uses Google’s V8\
    \ JavaScript engine and libuv library.\n\n# Chapter 2: Build a Simple Page Counter\
    \ Service with Node.js \n\n### by Craig Buckler\n\nYou understand what Node.js\
    \ is. You’ve read what it can do. Starting work on a real project is the best\
    \ way to progress your Node.js knowhow!\n\nThis tutorial describes how to build\
    \ a simple page counter service. Any page can use it to display “this has been\
    \ viewed X times” just like HTML developers did twenty years ago.\n\nThe service\
    \ will be developed using the standard [Node.js APIs](https://nodejs.org/dist/latest/docs/api/)\
    \ to demonstrate concepts such as HTTP handling, URL parsing, storage, and file\
    \ manipulation. No pre-built, third-party modules or applications will harmed\
    \ in the production of this project: *we’re on our own!*\n\n## Prerequisites\n\
    \nDownload and [install Node.js](https://nodejs.org/en/download/) on a platform\
    \ of your choice. Windows, macOS, and Linux ([package manager](https://nodejs.org/en/download/package-manager/)\
    \ or [Snap package](https://snapcraft.io/node)) are all supported. You can also\
    \ [use a version manager such as nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ The latest LTS (even-numbered) Node release is a good choice.\n\nA decent text\
    \ editor will make coding more efficient and pleasurable. Popular options include\
    \ [VS Code](https://code.visualstudio.com/), [Atom](https://atom.io/), [Sublime\
    \ Text](https://www.sublimetext.com/), and [Brackets](http://brackets.io/).\n\n\
    You’ll be making extensive use of the command line, so ensure you know how to\
    \ launch your terminal application. To get started, install [nodemon](https://nodemon.io/)\
    \ and [small-static-server](https://www.npmjs.com/package/small-static-server)\
    \ as global `npm` packages:\n\n```bash\nnpm install -g nodemon small-static-server\n\
    ```\n\n*   `nodemon` can be used to launch and restart Node.js applications whenever\
    \ source code is changed\n*   `ss` can be used in any directory to launch a static,\
    \ file-based web server\n\nFinally, a little JavaScript knowledge will go a long\
    \ way!\n\n## Project Overview\n\nDuring development, our Node.js web server will\
    \ run at `http://localhost:3000/`. Any page can use it to display a counter by\
    \ adding a snippet of HTML. For example:\n\n```html\n<script src=\"http://localhost:3000/counter.js\"\
    ></script>\n```\n\nIn this scenario, the following things happen:\n\n1.  The server\
    \ finds the calling page’s URL by examining the `referer` in the HTTP request\
    \ header.\n2.  The server extracts the referrer’s protocol, host, and path (query\
    \ strings are ignored) and generates a 32-character MD5 hash. This is more efficient\
    \ than retaining a long URL.\n3.  A counter for the URL hash is incremented.\n\
    4.  The server responds with a JavaScript `document.write()` to display the counter\
    \ on the page.\n\n`document.write()` is simple but can affect performance, because\
    \ it blocks browser rendering until the full response is received. Three other\
    \ counter options are also provided:\n\n*   [An SVG counter](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)\
    \ which returns a generated image with the counter contained in a `<text>` block:\n\
    \n    ```html\n     <img src=\"http://localhost:3000/counter.svg\" />\n    ```\n\
    \n*   [A deferred script counter](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)\
    \ which returns a generated image with the counter contained in a `<text>` block:\n\
    \n    ```html\n     <img src=\"http://localhost:3000/counter.svg\" />\n    ```\n\
    \n*   [A deferred script counter](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)\
    \ which returns a generated image with the counter contained in a `<text>` block:\n\
    \n    ```html\n     <img src=\"http://localhost:3000/counter.svg\" />\n    ```\n\
    \n## In-memory Storage\n\nThe initial implementation stores counters using an\
    \ in-memory object. This may seem unusual to those coming from other technologies.\
    \ Node.js typically launches an application which implements a web server. Any\
    \ state within that code is lost once a response is returned.\n"
  raw: "Finally, JavaScript is ubiquitous: most of us are familiar with JavaScript,\
    \ or have used it at some point. This means that transitioning to Node development\
    \ is potentially easier than to other server-side languages. To quote Craig Buckler\
    \ in his [Node vs PHP Smackdown](https://www.sitepoint.com/sitepoint-smackdown-php-vs-node-js/),\
    \ JavaScript might remain [the world’s most misunderstood language](http://www.crockford.com/javascript/javascript.html)—but,\
    \ once the concepts click, it makes other languages seem cumbersome.\n\n## Other\
    \ Uses of Node\n\nAnd it doesn’t stop at the server. There are many other exciting\
    \ and varied uses of Node.js!\n\nFor example [it can be used as a scripting language](https://www.sitepoint.com/shell-scripts-javascript/)\
    \ to automate repetitive or error prone tasks on your PC. It can also be used\
    \ to write your own command line tool, such as this [Yeoman-Style generator](https://www.sitepoint.com/scaffolding-tool-caporal-js/)\
    \ to scaffold out new projects.\n\nNode.js can also can be used to [build cross-platform\
    \ desktop apps](https://www.sitepoint.com/premium/books/build-a-native-desktop-gif-search-app-using-nodegui/read/)\
    \ and even to [create your own robots](https://www.sitepoint.com/an-introduction-to-nodebots/).\
    \ What’s not to love?\n\n## Conclusion\n\nJavaScript is everywhere, and Node is\
    \ a vast and expansive subject. Nonetheless, I hope that in this guide I’ve offered\
    \ you the beginner-friendly, high-level look at Node.js and its main paradigms\
    \ that I promised at the beginning. I also hope that when you re-read the definitions\
    \ we looked at previously, things will make a lot more sense.\n\n> Node.js is\
    \ an event-based, non-blocking, asynchronous I/O runtime that uses Google’s V8\
    \ JavaScript engine and libuv library.\n\n# Chapter 2: Build a Simple Page Counter\
    \ Service with Node.js\n\n### by Craig Buckler\n\nYou understand what Node.js\
    \ is. You’ve read what it can do. Starting work on a real project is the best\
    \ way to progress your Node.js knowhow!\n\nThis tutorial describes how to build\
    \ a simple page counter service. Any page can use it to display “this has been\
    \ viewed X times” just like HTML developers did twenty years ago.\n\nThe service\
    \ will be developed using the standard [Node.js APIs](https://nodejs.org/dist/latest/docs/api/)\
    \ to demonstrate concepts such as HTTP handling, URL parsing, storage, and file\
    \ manipulation. No pre-built, third-party modules or applications will harmed\
    \ in the production of this project: *we’re on our own!*\n\n## Prerequisites\n\
    \nDownload and [install Node.js](https://nodejs.org/en/download/) on a platform\
    \ of your choice. Windows, macOS, and Linux ([package manager](https://nodejs.org/en/download/package-manager/)\
    \ or [Snap package](https://snapcraft.io/node)) are all supported. You can also\
    \ [use a version manager such as nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ The latest LTS (even-numbered) Node release is a good choice.\n\nA decent text\
    \ editor will make coding more efficient and pleasurable. Popular options include\
    \ [VS Code](https://code.visualstudio.com/), [Atom](https://atom.io/), [Sublime\
    \ Text](https://www.sublimetext.com/), and [Brackets](http://brackets.io/).\n\n\
    You’ll be making extensive use of the command line, so ensure you know how to\
    \ launch your terminal application. To get started, install [nodemon](https://nodemon.io/)\
    \ and [small-static-server](https://www.npmjs.com/package/small-static-server)\
    \ as global `npm` packages:\n\n```\nnpm install -g nodemon small-static-server\n\
    ```\n\n*   `nodemon` can be used to launch and restart Node.js applications whenever\
    \ source code is changed\n\n*   `ss` can be used in any directory to launch a\
    \ static, file-based web server\n\nFinally, a little JavaScript knowledge will\
    \ go a long way!\n\n## Project Overview\n\nDuring development, our Node.js web\
    \ server will run at `http://localhost:3000/`. Any page can use it to display\
    \ a counter by adding a snippet of HTML. For example:\n\n```\n<script src=\"http://localhost:3000/counter.js\"\
    ></script>\n```\n\nIn this scenario, the following things happen:\n\n1.  The server\
    \ finds the calling page’s URL by examining the `referer` in the HTTP request\
    \ header.\n\n2.  The server extracts the referrer’s protocol, host, and path (query\
    \ strings are ignored) and generates a 32-character MD5 hash. This is more efficient\
    \ than retaining a long URL.\n\n3.  A counter for the URL hash is incremented.\n\
    \n4.  The server responds with a JavaScript `document.write()` to display the\
    \ counter on the page.\n\n`document.write()` is simple but can affect performance,\
    \ because it blocks browser rendering until the full response is received. Three\
    \ other counter options are also provided:\n\n*   [An SVG counter](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-svg.html)\
    \ which returns a generated image with the counter contained in a `<text>` block:\n\
    \n    ```\n     <img src=\"http://localhost:3000/counter.svg\" />\n    ```\n\n\
    *   [A deferred script counter](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-jsdefer.html)\
    \ which downloads in the background and updates the DOM after it has fully loaded:\n\
    \n    ```\n     <script src=\"http://localhost:3000/counter-defer.js\" defer></script>\n\
    \    ```\n\n*   An Ajax request can be made to `http://localhost:3000/counter.json`.\
    \ This returns a `{\"counter\":X}` JSON response which can be parsed and used\
    \ accordingly. (Here’s some [example code](https://github.com/sitepoint-editors/pagehit-ram/blob/master/testpages/page-jsajax.html).)\n\
    \nAll these options are fundamentally the same but return a different HTTP response.\n\
    \n## Page Hit v1.0: In-memory Storage\n\nThe full example code is available from\
    \ [https://github.com/sitepoint-editors/pagehit-ram](https://github.com/sitepoint-editors/pagehit-ram).\n\
    \nThe initial implementation stores counters using an in-memory JavaScript object.\n\
    \nThis may seem unusual to those coming from other technologies. For example,\
    \ a PHP application is called by a web server such as Apache or NGINX which launches\
    \ the PHP runtime with the appropriate code file. Any (variable) state within\
    \ that code is immediately lost once a response is returned.\n\nNode.js typically\
    \ launches an application which implements a web server and associated functionality.\
    \ It’s therefore possible to create variables which can be accessed by all requests\
    \ and are retained while the application continues to run.\n\n### Step 0 (optional):\
    \ Source Control\n\nSource control applications such as [Git](https://git-scm.com/)\
    \ help to back up code and manage revisions. Services including [GitHub](https://github.com/)\
    \ and [BitBucket](https://bitbucket.org/) provide free space so you can create\
    \ and clone a repository prior to writing any code.\n\nGit is beyond the scope\
    \ of this tutorial. You don’t have to use it, but you’ll be pleased you did!\n\
    \n#### Modules and .gitignore\n\nAlthough this project doesn’t use third-party\
    \ modules, always add a `node_modules/` line to your `.gitignore` file. Modules\
    \ can be installed with `npm install`, so there’s no need to include them in your\
    \ repository.\n\n### Step 1: Initialization\n\nCreate a new folder (or clone a\
    \ new repository) somewhere on your system, and run `npm init` to create a `package.json`\
    \ project configuration file:\n\n```\nmkdir project1\ncd project1\nnpm init\n\
    ```\n\nPress `Return` to accept the defaults or provide your own values. The final\
    \ file contains JSON content such as:\n\n```\n{\n  \"name\": \"project1\",\n \
    \ \"version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\"\
    ,\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" &&\
    \ exit 1\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\nThe `\"\
    scripts\"` section provides command-line shortcuts. Change it in your editor:\n\
    \n```\n\"scripts\": {\n  \"debug\": \"nodemon --trace-warnings ./index.js\",\n\
    \  \"start\": \"node ./index.js\",\n  \"test\": \"echo \\\"Error: no test specified\\\
    \" && exit 1\"\n},\n```\n\nThese scripts are used once the application is ready:\n\
    \n*   `npm start` runs the `start` script."
