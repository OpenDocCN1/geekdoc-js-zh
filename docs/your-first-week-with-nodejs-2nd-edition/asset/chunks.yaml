    虽然框架对于原型开发非常有用，但始终要质疑它对于最终的网站或应用程序是否是必要的。它增加了多少重量？它会提高性能吗？容易更新吗？当它最终被放弃时会发生什么？


    花时间研究这些选择。如果不研究，对于熟悉特定锤子的开发者来说，每个应用程序看起来都像是一个钉子。你绝对应该避免使用多个框架——除非是服务器端选项，或者像 [Svelte](https://svelte.dev/)
    这样的编译器，它们会在生产环境代码中移除自身。


    即使你确定了一个框架框架，也可能存在模块化或轻量级的替代方案，例如用 [Preact](https://preactjs.com/) 代替 [React](https://reactjs.org/)，或者用
    [bling.js](https://gist.github.com/paulirish/12fb951a8b893a454b32) 代替 [jQuery](https://jquery.com/)。


    最终，最高效且适应性强的框架将是专门为你的应用程序编写的。


    ## 使用静态站点生成器


    大多数人通过创建（静态）HTML、CSS 以及可能的 JavaScript 文件来开始 Web 开发。生成的资源可以托管在任何地方，并且速度快，因为它们没有使用服务器端或客户端处理。


    主要的缺点是内容管理：添加新页面可能涉及更改网站上每个页面中硬编码的导航菜单。在此时，开发者通常会转向服务器端语言或数据库驱动的 CMS，这两者都有各自的挑战。


    如果你能创建一个快速的静态站点，并在添加或删除内容时通过程序方式进行跨站点更改呢？这正是**静态站点生成器** (SSG) 所做的。它获取内容（通常定义在
    markdown 文件中）并构建一组静态 Web 页面。构建过程可以构建菜单、导入图像、生成样式等，并在发生任何变化时重新运行。生成的站点与服务器解耦，通常被称为使用
    **JAMstack**：JavaScript、APIs 和标记（markup）。


    大多数 SSG 构建一组基于文件夹的 HTML 文件和关联资源，这些资源可以上传到任何能够提供静态内容的 Web 服务器。基于 Ruby 的 [Jekyll](https://jekyllrb.com/)
    是最早的 SSG 之一，但 [StaticGen.com](https://www.staticgen.com/) 列出了适用于多种语言的几十种替代方案。诸如
    [Gatsby](https://www.gatsbyjs.org/) 等选项也会创建基于 React 的 JavaScript 应用程序而不是 HTML
    文件。（*这是否是一个优势则是另一了！*）


    静态站点可以提供最好的性能，因为它是渲染一次，然后原样交付给所有用户。它没有服务器端依赖，可靠性得到了提高，版本控制很容易，而且安全问题可以被消除。


    它也有一些缺点：


    *   配置和设置需要时间，并且比 CMS 更困难

    *   SSG 很少适用于非技术人员编辑人员

    *   没有用户角色或权限的概念

    *   站点一致性可能更难以维护，因为编辑人员可以添加任何客户端代码

    *   重新构建过程可能缓慢，特别是在较大的站点上


    SSG 对于变化不频繁的站点是理想的，但许多问题可以通过从无头 CMS（headless CMS）导入数据或自动化构建过程来克服。


    ## 使用构建系统


    即使是最尽心的开发者也可能忘记压缩 CSS 文件、优化图像或删除调试用的 `console` 语句。无论你使用什么技术来创建网站或应用，**构建过程**都可以自动执行单调的任务，以确保没有遗漏。此外，它们还可以运行测试、验证代码并部署到测试服务器或生产服务器。


    创建一个构建过程可能需要一天或两天，但从长远来看，它可以节省时间。流行的通用构建工具包括 [Gulp.js](https://gulpjs.com/)、[Grunt.js](https://gruntjs.com/)、[Broccoli.js](https://broccoli.build/)
    和 [Brunch](https://brunch.io/)，它们允许你手动定义并在文件更改时运行任务。


    或者，你可以选择针对 Web 的模块打包器，例如 [webpack](https://webpack.js.org/) 或 [Parcel](https://parceljs.org/)，它们*理解*
    HTML、CSS 和 JavaScript，因此可以通过以下操作解析并构建优化后的代码：


    *   消除死代码

    *   代码分割和依赖处理

    *   ES6 译为 ES5

    *   混淆

    *   生成 source map

    *   缓存刷新（cache-busting）

    *   热重载

    *   强制执行性能预算（下文讨论）


    模块打包器通常承诺零配置……*尽管现实可能有些不同！*


    几条入门小贴：


    *   选择一个构建系统并坚持一段时间。

    *   首先自动化最令人沮丧的任务。

    *   尽量不要让你的构建过程过于复杂。花一两个小时创建一个初始设置，然后随着时间的推移不断演进。

    *   在构建过程中尽可能多做。例如，HTML 模板可以从已知数据和部分组件构建，而不是在渲染时解析所有内容。


    进一步阅读：


    *   [使用 npm 作为构建工具的指南](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/)

    *   [Gulp.js 简介](https://www.sitepoint.com/premium/books/an-introduction-to-gulp-js/read/1)

    *   [Webpack 初学者指南](https://www.sitepoint.com/premium/books/a-beginner-guide-to-webpack)

    *   [Parcel 初学者指南](https://www.sitepoint.com/premium/books/a-beginner-guide-to-parcel)


    ## 使用渐进式增强


    **渐进式增强**是一种开发方法而非技术。每个网站或应用程序功能都从基础最小实现开始——可能是一个纯 HTML 的解决方案。当设备支持时，会逐步添加增强。考虑一个简单的搜索框：


    1. 基础解决方案是一个 `<input type="search" />` 字段，当输入字符串时会加载新页面显示搜索结果。

    2. 应用 HTML5 [约束验证](https://developer.mozilla.org/docs/Guide/HTML5/Constraint_validation)
    以确保在输入至少三个字符后进行搜索。

    3. 应用 CSS 样式，显示字体、颜色、边框等基本格式。

    4. 当字段获得焦点时，CSS 动画可以放大字段、显示提交按钮等。

    5. JavaScript 在输入时显示建议。

    6. JavaScript 可以显示简单的搜索结果列表，而无需用户离开当前页面。

    7. PWA Service Worker 可以缓存建议和搜索结果供以后使用。


    如有需要，代码在尝试增强之前会测试功能是否可用。例如，当 JavaScript 运行、支持事件且 HTML5 [`datalist`](https://developer.mozilla.org/docs/Web/HTML/Element/datalist)
    元素可用时，可以实现建议功能。


    ### 使用 Polyfill 添加缺失的功能


    通常可以使用 *polyfill* 为没有原生支持的浏览器添加缺失的功能。这可以从额外的原型（例如 [String.padStart() 方法](https://github.com/Financial-Times/polyfill-library/tree/master/polyfills/String/prototype/padStart)）到完整的
    API（例如[使用 IP 查找提供地理位置支持](https://github.com/Financial-Times/polyfill-library/tree/master/polyfills/navigator/geolocation)）。


    [Polyfill.io](https://polyfill.io/) 提供一组自定义的 polyfill。但是，要注意尝试填充所有内容带来的性能成本。对于
    IE 用户来说，提供一个快速、原始的功能可能比提供一个缓慢、完全填充的体验要好。


    在上面的搜索框示例中，渐进式增强提供了以下益处：


