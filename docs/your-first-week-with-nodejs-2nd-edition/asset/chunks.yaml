  trans: "\n\n![](img/default_cover.jpeg)\n![](img/default_cover.jpeg)\n\n# 你的 Node.js\
    \ 第一周，第二版\n\n版权所有 © 2020 SitePoint Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-38-7\n\n\
    * **产品经理：** Simon Mackie\n* **项目编辑：** James Hibbard\n* **英语编辑：** Ralph Mason\n\
    * **封面设计：** Alex Walker\n\n## 权利声明\n\n保留所有。未经出版者事先书面许可，不得对本书的任何部分进行复制、存储在检索系统中或以任何形式或通过任何手段传输，批判性文章或评论中的简短引用除外。\n\
    \n## 免责声明\n\n作者和出版者已尽力确保书中信息的准确性。然而，书中包含的信息按现状销售，且不提供任何形式的明示或暗示的保证。无论是作者、SitePoint\
    \ Pty. Ltd. 还是其代理或分销商，对于因使用书中的说明或此处描述的软件或硬件产品而直接或间接造成的任何损害，均不承担责任。\n\n## 商标公告\n\
    \n本书并非对每个标记名称的出现处进行标注，仅以编辑方式使用这些名称，旨在维护商标所有者的利益，无侵犯商标之意。\n\n![SitePoint 标志](img/sitepoint-logo-2012.png)\n\
    \nSitePoint Pty. Ltd. 出版\nLevel 1, 110 Johnston St, Fitzroy\nVIC Australia 3065\n\
    网站：www.sitepoint.com\n邮箱：books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint 专门为\
    \ Web 行业专业人士编写有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 获取我们的博客、书籍、时事通讯、文章和社区论坛。你将可以在那里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 关于 Craig Buckler\n\
    \n[Craig](https://craigbuckler.com/) 是一位自由职业开发者、作家和演讲师，他对 Web 的话题滔无不止。\n\n他从 20\
    \ 世纪 80 年代开始编程，那时应用程序必须挤进几 KB 的内存中。他对 Web 的热情燃于 90 年代中期，当时 28K 调制解调器是常态，而 100KB\
    \ 的页面被认为是奢侈品。\n\n在过去的十十年里，随着 Web 标准的演进，Craig 为 SitePoint 写了 1200 篇教程。尽管生活在技术奇特的未来，但他从未忘记过用有限的资源可以成就什么。\n\
    \n# 前言\n\n尽管已有许多尝试让 JavaScript 作为服务端语言运行，但 Node.js（通常简称为 Node）是第一个获得关注的环境。它现在被\
    \ Netflix、Uber 和 Paypal 等公司用于，以驱动它们的 Web 应用。Node 允许极快的性能；得益于它的事件循环模型，网络连接和数据库\
    \ I/O 等常见任务执行得非常快。\n\n从初学者的角度来看，Node 的明显优势之一是它使用了 JavaScript，这是一种许多开发者都熟悉的通用语言。如果你能为客户端编写\
    \ JavaScript，那么用 Node 编写服务端应用对你来说应该也不太困难。\n\n在本书中，我们将对 Node 及其相关技术进行入门介绍，并引导你开始编写第一个\
    \ Node 应用。\n\n## 谁应该读这本书？\n\n本书适合想要开始使用 Node 的 Web 开发者。假设你对 JavaScript 有良好的理解。\n\
    \n## 使用的约定\n\n#### 代码示例\n\n书中的代码使用等宽字体显示，如下所示：\n\n```\n <h1>一个完美的夏日</h1>\n<p>这是一个在公园散步的美好日子。\n\
    鸟儿在歌唱，孩子们都回学校上学了。</p> \n```\n\n当需要现有代码来提供上下文而不是重复所有代码时，将显示 ⋮：\n\n```\n function\
    \ animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\n某些代码行应该在一行内输入，但由于页面限制，我们对它们进行了换行处理。➥\
    \ 表示仅出于格式目的而存在的换行符，应该被忽略：\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n\
    ➥design-real-user-testing/?responsive1\");\n```\n\n你会注意到，我们在全书中使用了特定的布局样式来表示不同类型的信息。请关注以下项目。\n\
    \n#### 提示、注释和警告\n\n#### 嘿，你！\n\n提示（Tips）提供有用的小贴士。\n\n#### 咳咳，打扰一下……\n\n注释（Notes）是与当前主题相关但并非至关重要的补充说明。将它们视作额外的信息即可。\n\
    \n#### 确保你始终……\n\n……注意这些重要点。\n\n#### 注意！\n\n警告（Warnings）突出了可能会让你遇到困难的问题。\n\n##\
    \ 补充材料\n\n* [`www.sitepoint.com/community/`](https://www.sitepoint.com/community/)\
    \ 是 SitePoint 的论坛，用于任何问题\n* **books@sitepoint.com** 是我们的邮箱地址，以任何问题或其他原因。\n\n#\
    \ 第 1 章：Node 是什么以及我什么时候用它？\n\n### 作者 James Hibbard\n\n所以你可能听说过 Node.js，但不确定它是什么以及它在你的工作流中处于什么位置。或者你听到人们在赞美\
    \ Node，现在怀疑它是否是你需要的。\n\n如果这听起来像是你需要的，请继续阅读。\n\n#### “Node”还是“Node.js”？\n\n请注意，在本书中我们将交替使用\
    \ `Node` 和 `Node.js`。\n\n## 什么是 Node.js？\n\n网上有很多定义。让我们来看看几个流行的定义。这是该项目主页的说法（https://nodejs.org/en/）：\n\
    \n> Node.js® 是基于 Chrome V8 引擎的运行时。\n\n而这是 Stack Overflow 提供的（https://stackoverflow.com/tags/node.js/info）：\n\
    \n> Node.js 是基于 Google V8 引擎的事件驱动、非阻塞、异步 I/O 运行时。\n\n嗯，“事件驱动”、“非阻塞”、“异步 I/O”——一次性消化这些很大。所以让我们从另一个角度入手，从两个描述中提到的另一个细节——V8\
    \ 引擎开始。\n\n### Node 构建在 Chrome V8 引擎之上\n\nV8 引擎（https://v8.dev/）是 Google Chrome\
    \ 以及其他基于 Chromium 的浏览器（包括 Brave、Opera 和 Vivaldi）中的 JavaScript 引擎。它为性能设计，负责将 JavaScript\
    \ 直接编译为计算机可以执行的原生机器码。\n\n然而当我们说 Node 构建在 V8 引擎之上，并不是说 Node 程序在浏览器中运行。它们并不是。相反，Node\
    \ 的创始人（Ryan Dahl）采用了 V8 引擎并对其进行了增强，增加了文件系统 API、HTTP 库以及许多与操作系统相关的实用方法。\n\n这意味着\
    \ Node.js 是一个我们可以在计算机上执行 JavaScript 的程序。换句话说，它是一个 JavaScript 运行时。\n\n## 如何安装 Node.js？\n\
    \n在接下来的部分中，我们将安装 Node 并编写几个简单的程序。我们还将查看 npm（https://www.npmjs.com/），它是随 Node 一起捆的包管理器。\n\
    \n### Node 二进制文件与版本管理器\n\n"
- fmt: "\nMany websites will recommend that you head to [the official Node download\
    \ page](https://nodejs.org/en/download/) and grab the Node binaries for your system.\
    \ While that works, I would suggest that you use a version manager instead. This\
    \ is a program that allows you to install multiple versions of Node and switch\
    \ between them at will. There are various advantages to using a version manager.\
    \ For example, it negates potential permission issues when using Node with `npm`\
    \ and lets you set a Node version on a per-project basis.\n\nIf you fancy going\
    \ the version manager route, please consult our quick tip: [Install Multiple Versions\
    \ of Node.js using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ Otherwise, grab the correct binaries for your system from the link above and\
    \ install those.\n\n### “Hello, World!” the Node.js Way\n\nYou can check that\
    \ Node is installed on your system by opening a terminal and typing `node -v`.\
    \ If all has gone well, you should see something like `v12.14.1` displayed. This\
    \ is the current LTS version at the time of writing.\n\nNext, create a new file\
    \ `hello.js` and copy in the following code:\n\n```\nconsole.log(\"Hello, World!\"\
    );\n```\n\nThis uses Node’s [built-in console module](https://nodejs.org/api/console.html#console_console)\
    \ to display a message in a terminal window. To run the example, enter the following\
    \ command:\n\n```\nnode hello.js\n```\n\nIf Node.js is configured properly, “Hello,\
    \ World!” will be displayed.\n\n### Node.js Has Excellent Support for Modern JavaScript\n\
    \nAs can be seen on this [compatibility table](https://node.green/), Node has\
    \ excellent support for ECMAScript 2015 (ES6) and beyond. As you’re only targeting\
    \ one runtime (a specific version of the V8 engine), this means that you can write\
    \ your JavaScript using the latest and most modern syntax. It also means that\
    \ you don’t generally have to worry about compatibility issues—as you would if\
    \ you were writing JavaScript that would run in different browsers.\n\nTo illustrate\
    \ the point, here’s a second program that makes use of several modern JavaScript\
    \ features, such as tagged [template literals](https://www.sitepoint.com/understanding-ecmascript-6-template-strings/),\
    \ [object destructuring](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/)\
    \ and [`Array.prototype.flatMap()](https://thecodebarbarian.com/whats-new-in-es2019-flat-flatmap-catch.html#arrayflat-and-arrayflatmap):\n\
    \n```\nfunction upcase(strings, ...values) {\n  return values.map(name => name[0].toUpperCase()\
    \ + name.slice(1))\n    .join(' ') + strings[2];\n}\n\nconst person = {\n  first:\
    \ 'brendan',\n  last: 'eich',\n  age: 56,\n  position: 'CEO of Brave Software',\n\
    };\n\nconst { first, last } = person;\nconst emoticon = [ ['┌', '('], ['˘', '⌣'],\
    \ ['˘', ')', 'ʃ'] ];\n\nconsole.log(\n  upcase`${first} ${last} is the creator\
    \ of JavaScript! ` + emoticon.flat().join('')\n);\n```\n\nSave this code to a\
    \ file called `index.js` and run it from your terminal using the command `node\
    \ index.js`. You should see `Brendan Eich is the creator of JavaScript! ┌(˘⌣˘)ʃ`\
    \ output to the terminal.\n\n### Introducing npm, the JavaScript Package Manager\n\
    \nAs I mentioned earlier, Node comes bundled with a package manager called `npm`.\
    \ To check which version you have installed on your system, type `npm -v`.\n\n\
    In addition to being the package manager for JavaScript, `npm` is also the world’s\
    \ largest software registry. There are over 1,000,000 packages of JavaScript code\
    \ available to download, with billions of downloads per week. Let’s take a quick\
    \ look at how we would use `npm` to install a package.\n\n### Installing a Package\
    \ Globally\n\nOpen your terminal and type the following:\n\n```\nnpm install -g\
    \ jshint\n```\n\nThis will install the [jshint package](https://www.npmjs.com/package/jshint)\
    \ globally on your system. We can use it to lint the `index.js` file from the\
    \ previous example:\n\n```\njshint index.js\n```\n\nYou should now see a number\
    \ of ES6-related errors. If you want to fix them up, add `/* jshint esversion:\
    \ 6 */` to the top of the `index.js` file, re-run the command and linting should\
    \ pass.\n\nIf you’d like a refresher on linting, see [A Comparison of JavaScript\
    \ Linting Tools](https://www.sitepoint.com/comparison-javascript-linting-tools/).\n\
    \n### Installing a Package Locally\n\nWe can also install packages locally to\
    \ a project, as opposed to globally, on our system. Create a `test` folder and\
    \ open a terminal in that directory. Next type this:\n\n```\nnpm init -y\n```\n\
    \nThis will create and auto-populate a `package.json` file in the same folder.\
    \ Next, use `npm` to install the [lodash package](https://www.npmjs.com/package/lodash)\
    \ and save it as a project dependency:\n\n```\nnpm install lodash --save\n```\n\
    \nCreate a file named `test.js` and add the following:\n\n```\nconst _ = require('lodash');\n\
    \nconst arr = [0, 1, false, 2, '', 3];\nconsole.log(_.compact(arr));\n```\n\n\
    Finally, run the script using `node test.js`. You should see `[1, 2, 3]` output\
    \ to the terminal.\n\n### Working with `package.json`\n\nIf you look at the contents\
    \ of `test`, you’ll notice a folder `node_modules`. This is where `npm` has saved\
    \ lodash and any libraries lodash depends on. The `node_modules` folder shouldn’t\
    \ be checked in version control, and can, in fact, be re-created at any time by\
    \ running `npm install` within the project.\n\nIf you open the `package.json`\
    \ file, you’ll see lodash listed under the `dependencies` field. If you’d like\
    \ to find out more about `npm`, be sure to read our article [A Beginner’s Guide\
    \ to npm—the Package Manager](https://www.sitepoint.com/beginners-guide-node-package/).\n\
    \n## What Is Node.js Used For?\n\nNow that we know what Node and npm are and how\
    \ to install them, we can turn our attention to the first of their common uses:\
    \ installing (via npm) and running (via Node) various build tools.\n\nThese build\
    \ tools come in all shapes and sizes, and you won’t get far in a modern JavaScript\
    \ without bumping into them. They can be used for anything from bundling your\
    \ JavaScript files and dependencies into static assets, to running tests, or automatic\
    \ code linting.\n\nWe have a wide range of articles covering build tooling on\
    \ SitePoint. Here’s a short selection of my favorites:\n\n*   [A Beginner’s Guide\
    \ to Webpack](https://www.sitepoint.com/webpack-beginner-guide/)\n*   [Up and\
    \ Running with ESLint—the Pluggable JavaScript Linter](https://www.sitepoint.com/up-and-running-with-eslint-the-pluggable-javascript-linter/)\n\
    *   [An Introduction to Gulp.js](https://www.sitepoint.com/introduction-gulp-js/)\n\
    *   [Unit Test Your JavaScript Using Mocha and Chai](https://www.sitepoint.com/unit-test-javascript-mocha-chai/)\n\
    \nAnd if you want to start developing apps with any modern JavaScript framework\
    \ (for example, React or Angular), you’ll be expected to have a working knowledge\
    \ of Node and npm (or maybe [Yarn](https://www.sitepoint.com/yarn-vs-npm/)). This\
    \ isn’t because you need a Node back end to run these frameworks. You don’t. Rather,\
    \ it’s because these frameworks (and many, many related packages) are all available\
    \ via npm and rely on Node to create a sensible development environment in which\
    \ they can run.\n\nIf you’re interested in finding out what role Node plays in\
    \ a modern JavaScript app, read [The Anatomy of a Modern JavaScript Application](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/).\n\
    \n## Node.js Lets Us Run JavaScript on the Server\n"
