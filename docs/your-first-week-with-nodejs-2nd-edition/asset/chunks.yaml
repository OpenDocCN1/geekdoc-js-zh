    \ will trigger a save event after ten seconds. (This ensures saving occurs as\
    \ a background task and is throttled during times of high load.)\n\n3.  The `this.counter`\
    \ property of `pagehit.js` is converted to a JSON string and saved to a file with\
    \ a unique name (based on the current date/time).\n\n4.  Once the file has successfully\
    \ saved, all previously saved files are deleted from the `data` directory. These\
    \ may be present if a user has manually added their own, or if older files haven’t\
    \ been deleted (due to altered permissions, the process having crashed, and so\
    \ on).\n\n5.  On subsequent launches, the application looks for the most recent\
    \ JSON file in the `data` directory and imports it into `this.counter`.\n\nThe\
