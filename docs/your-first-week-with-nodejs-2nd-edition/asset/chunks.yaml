  trans: "\n\n```javascript\n// return a sorted array of info objects for all files\
    \ in a folder\nasync function folderList(folder, ext = '', sortBy = 'time') {\n\
    \  try {\n    // names of all files in folder\n    let filelist = await fsPromise.readdir(folder);\n\
    \n    // fetch file info\n    filelist = await Promise.all(\n      filelist.map(async\
    \ f => await info(folder + f))\n    );\n\n    // remove unreadable files and sort\n\
    \    return filelist\n      .filter(fn => fn.isFile && fn.read && fn.path.endsWith(ext))\n\
    \      .sort((f1, f2) => f2[sortBy] - f1[sortBy]);\n\n  }\n  catch (err) {\n \
    \   console.log('folderList error', err);\n    return false;\n  }\n}\n```\n\n\
    一个 `write()` 函数使用了 `fs` [`writeFile`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_writefile_file_data_options)\
    \ 方法将内容输出到文件中：\n\n```javascript\n// create a file, returns true or false\nasync\
    \ function write(fn, content = '') {\n  try {\n    await fsPromise.writeFile(fn,\
    \ content);\n    return true;\n  }\n  catch (err) {\n    console.log('write error',\
    \ err);\n    return false;\n  }\n}\n```\n\n一个 `unlinkMany()` 函数删除所有通过路径字符串数组或信息对象传入的文件。`fs`\
    \ [`unlink`](https://nodejs.org/dist/latest/docs/api/fs.html#fs_fspromises_unlink_path)\
    \ 方法会对所有项进行并行处理：\n\n```javascript\n// delete an array of files, return array of\
    \ true/false\nasync function unlinkMany(fnlist) {\n  return await Promise.all(\n\
    \    fnlist.map(async fn => {\n      try {\n        await fsPromise.unlink(fn.path\
    \ ? fn.path : fn);\n        return true;\n      }\n      catch (err) {\n     \
    \   console.log('unlink error', err);\n        return false;\n      }\n    })\n\
    \  );\n}\n```\n\n最后，导出公共函数以供其他模块使用：\n\n```javascript\n// public functions\nmodule.exports\
    \ = {\n  info,\n  folderUsable,\n  folderList,\n  write,\n  unlinkMany\n};\n```\n\
    \n### 第 2 ：修改 `lib/pagehit.js`\n\n原始的 `lib/pagehit.js` 文件被修改为将计数数据保存到文件中。需要额外的模块和配置变量：\n\
    \n```javascript\nconst\n  // modules\nfileUtil = require('./fileutil'),\nhttpReferrer\
    \ = require('./httpreferrer'),\n\n// default data folder\npath = require('path'),\n\
    dataFolder = path.resolve('./data') + path.sep,\n\n// file save throttling - 每隔不超过\
    \ 10 秒保存一次\nsaveFrequency = 10 * 1000;\n```\n\n[`path` 模块](https://nodejs.org/dist/latest/docs/api/path.html)提供了跨跨平台文件路径解析函数。在这种情况下，它被用于获取目录的绝对名称以保存数据（项目文件夹中的\
    \ `data`）。\n\n`constructor()` 从文件中导入之前的数据。请注意，类构造函数本身不能是 `async` 的，但可以立即运行涉及的\
    \ `async` 函数：\n\n1. 当 `data` 目录可用时，将 `folder` 属性设置为文件信息对象（`fileUtil.folderUsable`\
    \ 将尝试创建它）。如果无法保存，应用程序将退回到仅限内存计数器。\n\n2. 将 `saved` 属性设置为该目录下每个 `.json` 文件的信息对象数组。该数组按创建时间排序，最新的在前。\n\
    \n3. 如果至少存在一个 `.json` 文件，则使用 `require` 将其导入，它可以方便地转换为真实的 JavaScript 对象。之前保存的数据将合并到\
    \ `counter` 属性中。\n\n```javascript\n// initialize\nconstructor() {\n  // counter\
    \ storage\n  this.counter = {};\n\n  (async () => {\n    //  folder 是否可用?\n  \
    \  this.folder = await fileUtil.folderUsable(dataFolder);\n    if (!this.folder)\
    \ return;\n\n    // 获取所有 JSON 文件并按最新排序\n    this.saved = await fileUtil.folderList(this.folder.path,\
    \ '.json');\n\n    // 导入并合并最新数据\n    if (this.saved.length) {\n      Object.assign(this.counter,\
    \ require(this.saved[0].path));\n    }\n  })();\n}\n```\n\n`count()` 方法被更改为每当页面计数器增加时启动一个\
    \ 10 秒的计时器。后续的页面访问不会更改此计时器，因此在第一次更新发生 10 秒后调用 `this.save()`。因此，保存发生的频率不会高于每 10\
    \ 秒一次，并且作为后台任务运行，以便可以立即返回更新后的计数器。\n\n```javascript\n// increase URL counter\n\
    count(req) {\n  let hash = httpReferrer(req);\n  if (!hash) return null;\n\n \
    \ // 定义计数的默认值\n  this.counter[ hash ] = this.counter[ hash ] || 0;\n\n  // 保存事件\n\
    \  this.saveTimer = this.saveTimer || setTimeout(this.save.bind(this), saveFrequency);\n\
    \n  // 返回增加后的计数\n  return ++this.counter;\n}\n```\n\n`save()` 方法执行以下操作：\n\n1.\
    \  将 `counter` 属性转换为字符串并保存。\n2.  如果保存成功，将删除旧文件。\n3.  重置 `saveTimer` 属性。\n\n```javascript\n\
    // store latest data\nasync save() {\n  // folder 是否可用\n  if (!this.folder) return;\n\
    \n  // 保存新文件\n  let fn = `${this.folder}hit${new Date()}.json`;\n\n  if (await\
    \ fileUtil.write(fn, JSON.stringify(this.counter))) {\n    console.log(`page stored:\
    \ ${fn}`);\n\n    // 删除文件\n    fileUtil.unlinkMany(this.saved);\n\n    // 将当前文件加入\
    \ saved\n    this.saved = [{ path: fn }];\n  }\n\n  // 重置计时器\n  this.saveTimer\
    \ = null;\n}\n```\n\n### Step 3：测试\n\n使用 `npm run debug` 重新启动服务器。如果可以保存，会出现 `data`\
    \ 子目录。像之前一样测试 并刷新几次。10 秒后，会出现一个类似于 `hit1579705252776.json` 的文件。它包含（压缩后的）访问数据，例如：\n\
    \n```json\n{\n  \"987c5e69bb367d3d5e4f4412be35aab\": 1,\n  \"3fe347a2c56424ecb23460ecd876\"\
    : 2\n}\n```\n\n需要时每 10 秒创建一个新的数据文件。你可以重启项目服务器，访问次数将被保留。\n\n完整代码从 [`github.com/sitepoint-editors/pagehit-file`](https://github.com/sitepoint-editors/pagehit-file)\
    \ 获取。\n\n## 完成了吗？\n\n虽然这些示例可以运行，但它们并非用于生产环境，你可能已经发现了某些问题：\n\n- 服务非常简单。它保留了总数，但无法用于确定特定范围内（如今天或本周）的访问人数。\n\
    - 每个页面的计数器始终保留在内存中。所有操作系统进程都有内存限制，繁忙的服务最终会失败。\n- 文件处理很难，繁忙的服务每几秒就需要保存数兆字节的数据。可以将数据拆分为多个文件或仅追加更改的计数器，但文件处理将变得更加复杂。\n\
    - 文件保存可能会失败——例如，磁盘空间耗尽或进程在保存期间停止。可能可以返回之前的文件，但数据将会丢失。\n- 如果在文件保存期间更新计数器并很快停止，数据也会丢失！\n\
    \n所有这些问题都可以通过数据库解决，可以负责存储页面访问信息。\n\n是你需要采取的下一步：\n\n1. 了解如何使用 Docker 进行 Node.js\
    \ 开发，包括数据库应用程序管理。\n2. 重写页面服务以使用 MySQL 或 MongoDB。\n3. 使用各种工具和技术调试你的 Node.js 代码。\n\
    \n# 第 3 章：理解 Node.js 中的 module.exports 和 exports\n\n### 作者 James Hibbard\n\n"
- fmt: "\nIn programming, modules are self-contained units of functionality, which\
    \ can be shared and reused across projects. They make our lives as developers\
    \ easier, as we can use them to augment our applications with functionality that\
    \ we haven’t had to write ourselves. They also allow us to organize and decouple\
    \ our code, leading to applications that are easier to understand, debug and maintain.\n\
    \nIn this guide, I’ll examine how to work with modules in `Node.js`, focusing\
    \ on on how to export and consume them.\n\n## Different Module Formats\n\nAs JavaScript\
    \ originally had no concept of modules, a variety of competing formats have emerged\
    \ over time. Here’s a list of the main ones to be aware of:\n\n- The [Asynchronous\
    \ Module Definition (AMD)](https://en.wikipedia.org/wiki/Asynchronous_module_definition)\
    \ format is used in browsers and uses a `define` function to define modules.\n\
    - The [CommonJS (CJS)](https://en.wikipedia.org/wiki/CommonJS) format is used\
    \ in `Node.js` and uses `require` and `module.exports` to define dependencies\
    \ and modules. The `npm` ecosystem is built upon this format.\n- The [ES Module\
    \ (ESM)](https://www.sitepoint.com/understanding-es6-modules/) format. As of ES6\
    \ (ES2015), JavaScript supports a native module format. It uses an `export` keyword\
    \ to export a module’s public API and an `import` keyword to import it.\n- The\
    \ [System.register](https://github.com/systemjs/systemjs/blob/master/docs/system-register.md)\
    \ format was designed to support ES6 modules within ES5.\n- The [Universal Module\
    \ Definition (UMD)](https://riptutorial.com/javascript/example/16339/universal-module-definition--umd-)\
    \ format can be used both in the browser and in `Node.js`. It’s useful when a\
    \ module needs to be imported by a number of different module loaders.\n\nPlease\
    \ be aware that this guide deals solely with the `CommonJS format`, the standard\
    \ in `Node.js`. If you’d like to read into any of the other formats, I recommend\
    \ [this article](https://www.jvandemo.com/a-10-minute-primer-to-javascript-modules-module-formats-module-loaders-and-module-bundlers/),\
    \ by SitePoint author Jurgen Van de Moere.\n\n## Requiring a Module\n\n`Node.js`\
    \ comes with [a set of built-in modules](https://www.w3schools.com/nodejs/ref_modules.asp)\
    \ that we can use in our code without having to install them. To do this, we need\
    \ to require the module using the `require` keyword and assign the result to a\
    \ variable. This can then be used to invoke any methods the module exposes.\n\n\
    For example, to list out the contents of a directory, you can use the [file system\
    \ module](https://nodejs.org/api/fs.html) and its `readdir` method:\n\n```javascript\n\
    const fs = require('fs');\nconst folderPath = '/home/jim/Desktop/';\n\nfs.readdir(folderPath,\
    \ (err, files) => {\n  files.forEach(file => {\n    console.log(file);\n  });\n\
    });\n```\n\nNote that in `CommonJS`, modules are loaded synchronously and processed\
    \ in the order they occur.\n\n## Creating and Exporting a Module\n\nNow let’s\
    \ look at how to create our own module and export it for use elsewhere in our\
    \ program. Start off by creating a `user.js` file and adding the following:\n\n\
    ```javascript\nconst getName = () => {\n  return 'Jim';\n};\n\nexports.getName\
    \ = getName;\n```\n\nNow create an `index.js` file in the same folder and add\
    \ this:\n\n```javascript\nconst user = require('./user');\nconsole.log(`User:\
    \ ${user.getName()}`);\n```\n\nRun the program using `node index.js` and you should\
    \ see the following output to the terminal:\n\n```\nUser: Jim\n```\n\nSo what\
    \ has gone on here? Well, if you look at the `user.js` file, you’ll notice that\
    \ we’re defining a `getName` function, then using the `exports` keyword to make\
    \ it available for import elsewhere. Then in the `index.js` file, we’re importing\
    \ this function and executing it. Also notice that in the `require` statement,\
    \ the module name is prefixed with `./`, as it’s a local file. Also note that\
    \ there’s no need to add the file extension.\n\n### Exporting Multiple Methods\
    \ and Values\n\nWe can export multiple methods and values in the same way:\n\n\
    ```javascript\nconst getName = () => {\n  return 'Jim';\n};\n\nconst getLocation\
    \ = () => {\n  return 'Munich';\n};\n\nconst dateOfBirth = '12.01.1982';\n\nexports.getName\
    \ = getName;\nexports.getLocation = getLocation;\nexports.dob = dateOfBirth;\n\
    ```\n\nAnd in `index.js`:\n\n```javascript\nconst user = require('./user');\n\
    console.log(\n  `${user.getName()} lives in ${user.getLocation()} and was born\
    \ on ${user.dob}.`\n);\n```\n\nThe code above produces this:\n\n```\nJim lives\
    \ in Munich and was born on 12.01.1982.\n```\n\nNotice how the name we give the\
    \ exported `dateOfBirth` variable can be anything we fancy (`dob` in this case).\
    \ It doesn’t have to be the same as the original variable name.\n\n### Variations\
    \ in Syntax\n\nI should also mention that it’s possible to export methods and\
    \ values as you go, not just at the end of the file.\n\nFor example:\n\n```javascript\n\
    const getName = () => {\n  return 'Jim';\n};\n\nconst getLocation = () => {\n\
    \  return 'Munich';\n};\n\nconst dateOfBirth = '12.01.1982';\n\nexports.getName\
    \ = getName;\nexports.getLocation = getLocation;\nexports.dob = dateOfBirth;\n\
    ```\n\nAnd thanks to [destructuring assignment](https://www.sitepoint.com/es6-destructuring-assignment/),\
    \ we can pick what we need:\n\n```javascript\nconst { getName, dob } = require('./user');\n\
    ```\n"
  raw: "In programming, modules are self-contained units of functionality, which can\
    \ be shared and reused across projects. They make our lives as developers easier,\
    \ as we can use them to augment our applications with functionality that we haven’t\
    \ had to write ourselves. They also allow us to organize and decouple our code,\
    \ leading to applications that are easier to understand, debug and maintain.\n\
    \nIn this guide, I’ll examine how to work with modules in Node.js, focusing on\
    \ on how to export and consume them.\n\n## Different Module Formats\n\nAs JavaScript\
    \ originally had no concept of modules, a variety of competing formats have emerged\
    \ over time. Here’s a list of the main ones to be aware of:\n\n*   The [Asynchronous\
    \ Module Definition (AMD)](https://en.wikipedia.org/wiki/Asynchronous_module_definition)\
    \ format is used in browsers and uses a `define` function to define modules.\n\
    \n*   The [CommonJS (CJS)](https://en.wikipedia.org/wiki/CommonJS) format is used\
    \ in Node.js and uses `require` and `module.exports` to define dependencies and\
    \ modules. The npm ecosystem is built upon this format.\n\n*   The [ES Module\
    \ (ESM)](https://www.sitepoint.com/understanding-es6-modules/) format. As of ES6\
    \ (ES2015), JavaScript supports a native module format. It uses an `export` keyword\
    \ to export a module’s public API and an `import` keyword to import it.\n\n* \
    \  The [System.register](https://github.com/systemjs/systemjs/blob/master/docs/system-register.md)\
    \ format was designed to support ES6 modules within ES5.\n\n*   The [Universal\
    \ Module Definition (UMD)](https://riptutorial.com/javascript/example/16339/universal-module-definition--umd-)\
    \ format can be used both in the browser and in Node.js. It’s useful when a module\
    \ needs to be imported by a number of different module loaders.\n\nPlease be aware\
    \ that this guide deals solely with the **CommonJS format**, the standard in Node.js.\
    \ If you’d like to read into any of the other formats, I recommend [this article](https://www.jvandemo.com/a-10-minute-primer-to-javascript-modules-module-formats-module-loaders-and-module-bundlers/),\
    \ by SitePoint author Jurgen Van de Moere.\n\n## Requiring a Module\n\nNode.js\
    \ comes with [a set of built-in modules](https://www.w3schools.com/nodejs/ref_modules.asp)\
    \ that we can use in our code without having to install them. To do this, we need\
    \ to require the module using the `require` keyword and assign the result to a\
    \ variable. This can then be used to invoke any methods the module exposes.\n\n\
    For example, to list out the contents of a directory, you can use the [file system\
    \ module](https://nodejs.org/api/fs.html) and its `readdir` method:\n\n```\nconst\
    \ fs = require('fs');\nconst folderPath = '/home/jim/Desktop/';\n\nfs.readdir(folderPath,\
    \ (err, files) => {\n  files.forEach(file => {\n    console.log(file);\n  });\n\
    });\n```\n\nNote that in CommonJS, modules are loaded synchronously and processed\
    \ in the order they occur.\n\n## Creating and Exporting a Module\n\nNow let’s\
    \ look at how to create our own module and export it for use elsewhere in our\
    \ program. Start off by creating a `user.js` file and adding the following:\n\n\
    ```\nconst getName = () => {\n  return 'Jim';\n};\n\nexports.getName = getName;\n\
    ```\n\nNow create an `index.js` file in the same folder and add this:\n\n```\n\
    const user = require('./user');\nconsole.log(`User: ${user.getName()}`);\n```\n\
    \nRun the program using `node index.js` and you should see the following output\
    \ to the terminal:\n\n```\nUser: Jim\n```\n\nSo what has gone on here? Well, if\
    \ you look at the `user.js` file, you’ll notice that we’re defining a `getName`\
    \ function, then using the `exports` keyword to make it available for import elsewhere.\
    \ Then in the `index.js` file, we’re importing this function and executing it.\
    \ Also notice that in the `require` statement, the module name is prefixed with\
    \ `./`, as it’s a local file. Also note that there’s no need to add the file extension.\n\
    \n### Exporting Multiple Methods and Values\n\nWe can export multiple methods\
    \ and values in the same way:\n\n```\nconst getName = () => {\n  return 'Jim';\n\
    };\n\nconst getLocation = () => {\n  return 'Munich';\n};\n\nconst dateOfBirth\
    \ = '12.01.1982';\n\nexports.getName = getName;\nexports.getLocation = getLocation;\n\
    exports.dob = dateOfBirth;\n```\n\nAnd in `index.js`:\n\n```\nconst user = require('./user');\n\
    console.log(\n  `${user.getName()} lives in ${user.getLocation()} and was born\
    \ on ${user.dob}.`\n);\n```\n\nThe code above produces this:\n\n```\nJim lives\
    \ in Munich and was born on 12.01.1982.\n```\n\nNotice how the name we give the\
    \ exported `dateOfBirth` variable can be anything we fancy (`dob` in this case).\
    \ It doesn’t have to be the same as the original variable name.\n\n### Variations\
    \ in Syntax\n\nI should also mention that it’s possible to export methods and\
    \ values as you go, not just at the end of the file.\n\nFor example:\n\n```\n\
    exports.getName = () => {\n  return 'Jim';\n};\n\nexports.getLocation = () =>\
    \ {\n  return 'Munich';\n};\n\nexports.dob = '12.01.1982';\n```\n\nAnd thanks\
    \ to [destructuring assignment](https://www.sitepoint.com/es6-destructuring-assignment/),\
    \ we can cherry-pick what we want to import:\n\n```\nconst { getName, dob } =\
    \ require('./user');\nconsole.log(\n  `${getName()} was born on ${dob}.`\n);\n\
    ```\n\nAs you might expect, this logs:\n\n```\nJim was born on 12.01.1982.\n```\n\
    \n## Exporting a Default Value\n\nIn the above example, we’re exporting functions\
    \ and values individually. This is handy for helper functions that could be needed\
    \ all over an app, but when you have a module that exports just the one thing,\
    \ it’s more common to use `module.exports`:\n\n```\nclass User {\n  constructor(name,\
    \ age, email) {\n    this.name = name;\n    this.age = age;\n    this.email =\
    \ email;\n  }\n\n  getUserStats() {\n    return `\n      Name: ${this.name}\n\
    \      Age: ${this.age}\n      Email: ${this.email}\n    `;\n  }\n}\n\nmodule.exports\
    \ = User;\n```\n\nAnd in `index.js`:\n\n```\nconst User = require('./user');\n\
    const jim = new User('Jim', 37, 'jim@example.com');\n\nconsole.log(jim.getUserStats());\n\
    ```\n\nThe code above logs this:\n\n```\nName: Jim\nAge: 37\nEmail: jim@example.com\n\
    ```\n\n## What’s the Difference Between `module.exports` and `exports`?\n\nIn\
    \ your travels across the Web, you might come across the following syntax:\n\n\
    ```\nmodule.exports = {\n  getName: () => {\n    return 'Jim';\n  },\n\n  getLocation:\
    \ () => {\n    return 'Munich';\n  },\n\n  dob: '12.01.1982',\n};\n```\n\nHere\
    \ we’re assigning the functions and values we want to export to an `exports` property\
    \ on `module` — and of course, this works just fine:\n\n```\nconst { getName,\
    \ dob } = require('./user');\nconsole.log(\n  `${getName()} was born on ${dob}.`\n\
    );\n```\n\nThis logs the following:\n\n```\nJim was born on 12.01.1982.\n```\n\
    \nSo what *is* the difference between `module.exports` and `exports`? Is one just\
    \ a handy alias for the other?\n\nWell, kinda, but not quite …\n\nTo illustrate\
    \ what I mean, let’s change the code in `index.js` to log the value of `module`:\n\
    \n```\nconsole.log(module);\n```\n\nThis produces:\n\n```\nModule {\n  id: '.',\n\
    \  exports: {},\n  parent: null,\n  filename: '/home/jim/Desktop/index.js',\n\
    \  loaded: false,\n  children: [],\n  paths:\n   [ '/home/jim/Desktop/node_modules',\n\
    \     '/home/jim/node_modules',\n     '/home/node_modules',\n     '/node_modules'\
    \ ] }\n```\n\nAs you can see, `module` has an `exports` property. Let’s add something\
    \ to it:\n\n```\n// index.js\nexports.foo = 'foo';\nconsole.log(module);\n```\n\
    \nThis outputs:\n\n```\nModule {\n  id: '.',\n  exports: { foo: 'foo' },\n  ...\n\
    ```\n\nAssigning properties to `exports` also adds them to `module.exports`. This\
    \ is because (initially, at least) `exports` is a reference to `module.exports`.\n\
    \n### So Which One Should I use?\n\nAs `module.exports` and `exports` both point\
    \ to the same object, it doesn’t normally matter which you use. For example:\n\
    \n```\nexports.foo = 'foo';\nmodule.exports.bar = 'bar';\n```\n\nThis code would\
    \ result in the module’s exported object being `{ foo: 'foo', bar: 'bar' }`.\n\
    \nHowever, there is a caveat. Whatever you assign `module.exports` to is what’s\
    \ exported from your module.\n\nSo, take the following:"
