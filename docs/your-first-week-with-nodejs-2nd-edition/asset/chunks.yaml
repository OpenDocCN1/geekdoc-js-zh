  trans: "\n\n在编程中，模块是自包含的功能单元，可以在不同项目之间共享和复用。它们让我们开发者的工作变得更轻松，因为我们可以使用它们来为应用程序增强功能，而无需自己编写。它们还允许我们对代码进行组织和解耦，使应用程序更容易被理解、调试和维护。\n\
    \n在本指南中，我将探讨如何在 `Node.js` 中处理模块，重点介绍如何导出和使用它们。\n\n## 不同的模块格式\n\n由于 JavaScript\
    \ 原生没有模块的概念，随着时间的推移，出现了多种竞争格式。以下是需要注意的主要格式列表：\n\n- [异步模块定义 (AMD)](https://en.wikipedia.org/wiki/Asynchronous_module_definition)\
    \ 格式用于浏览器，并使用 `define` 函数来定义模块。\n- [CommonJS (CJS)](https://en.wikipedia.org/wiki/CommonJS)\
    \ 格式用于 `Node.js`，使用 `require` 和 `module.exports` 来定义依赖和模块。`npm` 生态系统正是基于此格式构建。\n\
    - [ES Module (ESM)](https://www.sitepoint.com/understanding-es6-modules/) 格式。从\
    \ ES6 (ES2015) 开始，JavaScript 支持原生模块格式。它使用 `export` 关键字导出模块的公有 API，并使用 `import`\
    \ 关键字导入它。\n- [System.register](https://github.com/systemjs/systemjs/blob/master/docs/system-register.md)\
    \ 格式旨在在 ES5 中支持 ES6 模块。\n- [通用模块定义 (UMD)](https://riptutorial.com/javascript/example/16339/universal-module-definition--umd-)\
    \ 格式可以同时用于浏览器和 `Node.js`。当一个模块需要被不同的模块加载器导入时，它非常有用。\n\n请注意，本指南仅涉及 `Node.js` 的标准\
    \ `CommonJS 格式`。如果你想深入了解其他格式，我推荐阅读 SitePoint 作者 Jurgen Van de Moere 写的[这篇文章](https://www.jvandemo.com/a-10-minute-primer-to-javascript-modules-module-formats-module-loaders-and-module-bundlers/)。\n\
    \n## 引入模块\n\n`Node.js` 自带有[一套内置模块](https://www.w3schools.com/nodejs/ref_modules.asp)，我们直接在代码中使用它们而无需安装。要实现这一点，我们需要使用\
    \ `require` 关键字引入模块并将结果赋值给变量。然后可以使用它来调用模块暴露的任何方法。\n\n例如，要列出目录的内容，可以使用[文件系统模块](https://nodejs.org/api/fs.html)\
    \ 及其 `readdir` 方法：\n\n```javascript\nconst fs = require('fs');\nconst folderPath\
    \ = '/home/jim/Desktop/';\n\nfs.readdir(folderPath, (err, files) => {\n  files.forEach(file\
    \ => {\n    console.log(file);\n  });\n});\n```\n\n注意，在 `CommonJS` 中，模块是同步加载的并按照它们出现的顺序进行处理。\n\
    \n## 创建并导出模块\n\n现在让我们来看看如何创建自己的模块并将其导出到程序的其他地方使用。首先创建一个 `user.js` 文件并添加以下内容：\n\
    \n```javascript\nconst getName = () => {\n  return 'Jim';\n};\n\nexports.getName\
    \ = getName;\n```\n\n现在在同一文件夹中创建一个 `index.js` 文件并添加以下内容：\n\n```javascript\nconst\
    \ user = require('./user');\nconsole.log(`User: ${user.getName()}`);\n```\n\n\
    使用 `node index.js` 运行程序，你应该会在终端中看到以下输出：\n\n```\nUser: Jim\n```\n\n那么这里发生了什么？嗯，如果你查看\
    \ `user.js` 文件，你会发现我们正在定义一个 `getName` 函数，然后使用 `exports` 关键字让它可以在其他地方被导入。接着在 `index.js`\
    \ 文件中，我们导入了这个函数并执行了它。还要注意，在 `require` 语句中，模块名以 `./` 为前缀，因为它是一个本地文件。同样注意，没有必要添加文件扩展名。\n\
    \n### 导出多个方法和值\n\n我们可以以相同的方式导出多个方法和值：\n\n```javascript\nconst getName = () =>\
    \ {\n  return 'Jim';\n};\n\nconst getLocation = () => {\n  return 'Munich';\n\
    };\n\nconst dateOfBirth = '12.01.1982';\n\nexports.getName = getName;\nexports.getLocation\
    \ = getLocation;\nexports.dob = dateOfBirth;\n```\n\n在 `index.js` 中：\n\n```javascript\n\
    const user = require('./user');\nconsole.log(\n  `${user.getName()} lives in ${user.getLocation()}\
    \ and was born on ${user.dob}.`\n);\n```\n\n上述代码会产生：\n\n```\nJim lives in Munich\
    \ and was born on 12.01.1982.\n```\n\n注意我们给导出的 `dateOfBirth` 变量起的名字可以是任何我们喜欢的名称（在本例中为\
    \ `dob`）。它不需要与原始变量名相同。\n\n### 语法变体\n\n我还应该提到，你可以在过程中导出方法和值，而不仅仅是在文件末尾。\n\n例如：\n\
    \n```javascript\nconst getName = () => {\n  return 'Jim';\n};\n\nconst getLocation\
    \ = () => {\n  return 'Munich';\n};\n\nconst dateOfBirth = '12.01.1982';\n\nexports.getName\
    \ = getName;\nexports.getLocation = getLocation;\nexports.dob = dateOfBirth;\n\
    ```\n\n得于[解构赋值](https://www.sitepoint.com/es6-destructuring-assignment/)，我们可以挑选需要的项：\n\
    \n```javascript\nconst { getName, dob } = require('./user');\n```\n\n"
- fmt: "\n```\nexports.foo = 'foo';\nmodule.exports = () => { console.log('bar');\
    \ };\n```\n\nThis would only result in an anonymous function being exported. The\
    \ `foo` variable would be ignored.\n\nIf you’d like to read more into the difference,\
    \ I recommend [this article](https://www.hacksparrow.com/nodejs/exports-vs-module-exports.html).\n\
    \n## Conclusion\n\nModules have become an integral part of the JavaScript ecosystem,\
    \ allowing us to compose large programs out of smaller parts. I hope this guide\
    \ has given you a good introduction to working with them in Node.js, as well as\
    \ helping to demystify their syntax.\n\n# Chapter 4: Forms, File Uploads and Security\
    \ with Node.js and Express\n\n### by Mark Brown and James Hibbard\n\nIf you’re\
    \ building a web application, you’re likely to encounter the need to build HTML\
    \ forms on day one. They’re a big part of the web experience, and they can be\
    \ complicated.\n\nTypically the form-handling process involves:\n\n* displaying\
    \ an empty HTML form in response to an initial `GET` request\n* user submitting\
    \ the form with data in a `POST` request\n* validation on both the client and\
