  trans: "\n\n```javascript\nawait Models.sequelize.sync();\n\nawait server.start();\n\
    console.log(`Server running at: ${server.info.uri}`);\n```\n\n这段代码将把模型同步到我们的数据库中。一旦完成，服务器将启动。\n\
    \n## 构建控制器 (Controllers)\n\n控制器是接受 Hapi.js 的 [request](https://hapi.dev/api#request-properties)\
    \ 和 [response toolkit](https://hapi.dev/api/#response-toolkit) 对象的函数。`request`\
    \ 对象包含有关所请求资源的信息，我们使用 `reply` 向客户端返回信息。\n\n在我们的应用程序中，目前我们只返回一个 JSON 对象，但一旦我们构建了视图，就会添加它们。\n\
    \n我们可以将控制器视为连接我们的模型和视图的函数；它们将与模型通信以获取数据，然后将这些数据在视图内部返回。\n\n### 主页控制器 (Home Controller)\n\
    \n我们将构建的第一个控制器将处理我们网站的主页。在 `lib/controllers` 目录下创建一个 `home.js` 文件，内容如下：\n\n```javascript\n\
    \"use strict\";\n\nconst Models = require(\"../models/\");\n\nmodule.exports =\
    \ async (request, h) => {\n  const result = await Models.Note.findAll({\n    order:\
    \ [[\"date\", \"DESC\"]]\n  });\n\n  return {\n    data: {\n      notes: result\n\
    \    },\n    page: \"Home—Notes Board\",\n    description: \"Welcome to my Notes\
    \ Board\"\n  };\n};\n```\n\n首先，我们使用模型中的 [`findAll`](https://sequelize.org/master/manual/model-querying-basics.html)\
    \ 方法获取数据库中的所有笔记。该函数将返回一个 Promise，如果它解析（resolve），我们将得到一个包含数据库中所有笔记的数组。\n\n我们可以使用传递给\
    \ `findAll` 方法的选项对象中的 `order` 参数对结果进行降序排列，这样最后一个项目将首先显示。你可以在 [Sequelize.js 文档](https://sequelize.org/master/class/lib/model.js~Model.html#static-method-findAll)\
    \ 中检查所有可用选项。\n\n一旦有了主页控制器，我们就可以编辑 `routes.js` 文件。首先，我们在文件顶部导入该模块，紧邻 `Path` 模块的导入：\n\
    \n```javascript\nconst Home = require(\"./controllers/home\");\n```\n\n然后，我们将刚刚创建的控制器添加到数组中：\n\
    \n```javascript\n{\n  method: \"GET\",\n  path: \"/\",\n  handler: Home,\n  config:\
    \ {\n    description: \"Gets all the notes available\"\n  }\n},\n```\n\n此时你可以通过重启服务器（`node\
    \ server.js`）并访问 [`localhost:3000/`](http://localhost:3000/) 来检查功能是否正常。你应该能看到以下响应：\n\
    \n```json\n{\n  \"data\": { \"notes\": [] },\n  \"page\":\"Home—Notes Board\"\
    ,\n  \"description\":\"Welcome to my Notes Board\"\n}\n```\n\n### 笔记控制器的模板 (Boilerplate\
    \ of the Note Controller)\n\n由于我们将使用 slug 来标识笔记，可以使用笔记标题和 [slug](https://www.npmjs.com/package/slug)\
    \ 库来生成它，因此让我们通过以下命令安装并将其作为依赖项包含：\n\n```bash\nnpm install slug\n```\n\n我们在应用程序中需要定义的最后一个控制器将允许我们创建、读取、更新和删除笔记。\n\
    \n我们可以继续在 `lib/controllers` 目录下创建一个 `note.js` 文件并添加以下内容：\n\n```javascript\n\"\
    use strict\";\n\nconst { Note } = require(\"../models/\");\nconst Slugify = require(\"\
    slug\");\nconst Path = require(\"path\");\n\nmodule.exports = {\n  // 在这里我们将包含处理\
    \ routes.js 文件中剩余请求的函数。\n};\n```\n\n### `create` 函数\n\n为了向数据库中添加笔记，我们将编写一个 `create`\
    \ 函数，该函数将使用 payload 对象中包含的数据来封装模型上的 `create` 方法。\n\n在导出的对象中添加以下内容：\n\n```javascript\n\
    create: async (request, h) => {\n  const result = await Note.create({\n    date:\
    \ new Date(),\n    title: request.payload.noteTitle,\n    slug: Slugify(request.payload.noteTitle,\
    \ { lower: true }),\n    description: request.payload.noteDescription,\n    content:\
    \ request.payload.noteContent\n  });\n\n  // 使用 'result' 数据生成新笔记\n  return result;\n\
    },\n```\n\n一旦创建了笔记，我们将获得笔记数据并使用 `reply` 函数将其作为 JSON 发送给客户端。\n\n目前，我们只返回结果，但一旦我们在下一节中构建了视图，我们就能生成带有新笔记的\
    \ HTML 并将其动态地添加到客户端。虽然这并非完全必要，并将取决于你如何处理前端逻辑，但我们将返回一个 HTML 块以简化客户端的逻辑。\n\n此外，请注意日期是在执行函数时使用\
    \ `new Date()` 动态生成的。\n\n### `read` 函数\n\n为了只搜索一个元素，我们使用模型上的 `findOne` 方法。由于我们通过\
    \ slug 标识笔记，因此 `where` 过滤器必须包含客户端在 URL (`http://localhost:3000/`) 中提供的 slug。\n\
    \n```javascript\nread: async (request, h) => {\n  const note = await Note.findOne({\n\
    \    where: {\n      slug: request.params.slug\n    }\n  });\n\n  return note;\n\
    },\n```\n\n### `update` 函数\n\n若要更新笔记，我们使用模型上的 `update` 方法。它接受两个对象——我们正在更新的新值，以及包含\
    \ `where` 过滤器的选项对象。\n\n```javascript\nupdate: async (request, h) => {\n  const\
    \ values = {\n    title: request.payload.noteTitle,\n    description: request.payload.noteDescription,\n\
    \    content: request.payload.noteContent\n  };\n\n  const options = {\n    where:\
    \ {\n      slug: request.params.slug\n    }\n  };\n\n  await Note.update(values,\
    \ options);\n  const result = await Note.findOne(options);\n\n  return result;\n\
    },\n```\n\n### `delete` 函数\n\n删除控制器将通过向模型的 `destroy` 函数提供 slug 来移除笔记。然后，一旦笔记被删除，我们将重定向到主页。为了实现这一点，我们使用\
    \ Hapi 响应工具包的 [redirect](https://hapi.dev/api/?v=18.4.0#hredirect) 函数：\n\n```javascript\n\
    delete: async (request, h) => {\n  await Note.destroy({\n    where: {\n      slug:\
    \ request.params.slug\n    }\n  });\n\n  return h.redirect(\"/\");\n}\n```\n\n\
    ### 在路由中使用笔记控制器\n\n此时，我们的笔记控制器已经准备好了所有的 CRUD 操作。但为了使用它们，我们需要将其包含在路由文件中。\n\n首先，在\
    \ `routes.js` 顶部导入我们的控制器：\n\n```javascript\nconst Note = require(\"./controllers/note\"\
    );\n```\n\n我们需要将每个处理器替换为新函数，因此我们的路由文件如下：\n\n```javascript\n{\n  method: \"POST\"\
    ,\n  path: \"/note\",\n  handler: Note.create,\n  config: {\n    description:\
    \ \"Adds a new note\",\n    payload: {\n      multipart: true,\n    }\n  }\n},\n\
    {\n  method: \"GET\",\n  path: \"/note/{slug}\",\n  handler: Note.read,\n  config:\
    \ {\n    description: \"Gets the content of a note\"\n  }\n},\n{\n  method: \"\
    PUT\",\n  path: \"/note/{slug}\",\n  handler: Note.update,\n  config: {\n    description:\
    \ \"Updates the selected note\",\n    payload: {\n      multipart: true,\n   \
    \ }\n  }\n},\n{\n  method: \"GET\",\n  path: \"/note/{slug}/delete\",\n  handler:\
    \ Note.delete,\n  config: {\n    description: \"Deletes the selected note\"\n\
    \  }\n}\n```\n\n#### 引用而不调用\n\n我们在包含函数时在末尾没有加 `()`，因为我们是在引用函数而不是调用它们。\n\n"
- fmt: "\nIn Hapi v19, [`request.payload.multipart` was changed to `false` by default](https://github.com/hapijs/hapi/issues/4017).\
    \ We need to set it back to `true` for the `POST` and `PUT` routes, as we’ll be\
    \ using a `FormData` object to transmit data to the server, and the transmitted\
    \ data will be in the `multipart/form-data` format.\n\n## Building the Views\n\
    \nAt this point, our site is receiving HTTP calls and responding with JSON objects.\
    \ To make it useful to everybody, we have to create the pages that render our\
    \ information in a nice way.\n\nIn this example, we’re going to use the [Pug](https://pugjs.org/api/getting-started.html)\
    \ (formerly Jade) templating language, although this isn’t mandatory, and we can\
    \ use other languages with Hapi.js. We’re going to use the [Vision](https://github.com/hapijs/vision)\
    \ plugin to enable the view functionality in our server.\n\n### Beginner’s Guide\
    \ to Pug\n\nIf you’re not familiar with Jade/Pug, see our [Beginner’s Guide to\
    \ Pug](https://www.sitepoint.com/a-beginners-guide-to-pug/).\n\nYou can install\
    \ the packages with the following command:\n\n```\nnpm install @hapi/vision@5.5.4\
    \ pug\n```\n\nHere we’re installing v5.5.4 of the `vision` plugin, which is compatible\
    \ with Hapi v18. If you’ve opted to install Hapi v19, you can simply type `npm\
    \ i @hapi/vision` to pull in the latest version.\n\n### The Note Component\n\n\
    First, we’re going to build the note component that’s going to be reused across\
    \ our views. Also, we’re going to use this component in some of our controller\
    \ functions to build a note on the fly in the back end to simplify the logic on\
    \ the client.\n\nCreate a file in `lib/views/components` called `note.pug` with\
    \ the following content:\n\n```\narticle.content\n  h2.title: a(href=`/note/${note.slug}`)=\
    \ note.title\n  p.subtitle.is-6 Published on #{note.date}\n  p=note.content\n\
    ```\n\nIt’s composed of the title of the note, the publication date and the content\
    \ of the note.\n\n### The Base Layout\n\nThe base layout contains the common elements\
    \ of our pages—or in other words, for our example, everything that’s not content.\
    \ Create a file in `lib/views/` called `layout.pug` with the following content:\n\
    \n```\ndoctype html\nhead\n  meta(charset='utf-8')\n  meta(name='viewport' content='width=device-width,\
    \ initial-scale=1')\n  title=page\n  meta(name='description' content=description)\n\
    \  link(rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css')\n\
    \  script(defer='' src='https://use.fontawesome.com/releases/v5.3.1/js/all.js')\n\
    body\n  block content\n  script(src='/scripts/main.js')\n```\n\nThe content of\
    \ the other pages will be loaded in place of `block content`. Also, note that\
    \ we’ll display a page variable in the `title` element, and a `description` variable\
    \ in the `meta(name='description')` element. We’ll create those variables in our\
    \ routes later.\n\nFor styling purposes, we’re including the [Bulma CSS framework](https://bulma.io/)\
    \ and [Font Awesome](https://fontawesome.com/) from a CDN. We’re also including\
    \ a `main.js` file at the bottom of the page, which will contain all of our custom\
    \ JavaScript code for the front end. Please create that file now in a `static/public/scripts/`\
    \ directory.\n\n### The Home View\n\nOn our home page, we’ll show a list of all\
    \ the notes in our database and a button that will show a modal window with a\
    \ form that allows us to create a new note via Ajax.\n\nCreate a file in `lib/views`\
    \ called `home.pug` with the following content:\n\n```\nextends layout\n\nblock\
    \ content\n  section.section\n    .container\n\n      h1.title.has-text-centered\n\
    \        | Notes Board\n\n      .tabs.is-centered\n        ul\n          li\n\
    \            a.show-modal(href='#') Publish\n\n      main(container).notes-list\n\
    \        each note in data.notes\n          include components/note\n        \
    \  hr\n\n      .modal\n        .modal-background\n        .modal-card\n      \
    \    header.modal-card-head\n            p.modal-card-title Add note\n       \
    \     button.delete(aria-label='close')\n          section.modal-card-body\n \
    \           form(action='/note' method='POST').note-form#note-form\n         \
    \     .field\n                .control\n                  input.input(name='noteTitle'\
    \ type='text' placeholder='Title')\n              .field\n                .control\n\
    \                  input.input(name='noteDescription' type='text' placeholder='Short\
    \ description')\n              .field\n                .control\n            \
    \      textarea.textarea(name='noteContent' placeholder='Contents')\n        \
    \      .field\n                .control\n                  button.button.is-link\
    \ Save\n```\n\n### The Note View\n\nThe note page is pretty similar to the home\
    \ page, but in this case, we show a menu with options specific to the current\
    \ note, the content of the note and the same form as in the home page, but with\
    \ the current note information already filled, so it’s there when we update it.\n\
    \nCreate a file in `lib/views` called `note.pug` with the following content:\n\
    \n```\nextends layout\n\nblock content\n  section.section\n    .container\n  \
    \    h1.title.has-text-centered\n          | Notes Board\n\n      .tabs.is-centered\n\
    \        ul\n          li: a(href='/') Home\n          li: a.show-modal(href='#')\
    \ Update\n          li: a(href=`/note/${note.slug}/delete`) Delete\n\n      include\
    \ components/note\n\n      .modal\n        .modal-background\n        .modal-card\n\
    \          header.modal-card-head\n            p.modal-card-title Edit note\n\
    \            button.delete(aria-label='close')\n          section.modal-card-body\n\
    \            form(action=`/note/${note.slug}` method='PUT').note-form#note-form\n\
    \              .field\n                .control\n                  input.input(name='noteTitle'\
    \ type='text' placeholder='Title' value=note.title)\n```\n\n### The JavaScript\
    \ on the Client\n\nTo create and update notes, we’ll use some JavaScript, both\
    \ to show/hide a modal, and to submit the requests via Ajax. Although this is\
    \ not strictly necessary, we feel it provides a better experience for the user.\n\
    \nThis is the content of our `main.js` file in the `static/public/scripts/` directory:\n\
    \n```javascript\n// Modal\nconst modal = document.querySelector(\".modal\");\n\
    const html = document.querySelector(\"html\");\n\nconst showModal = () => {\n\
    \  modal.classList.add(\"is-active\");\n  html.classList.add(\"is-clipped\");\n\
    };\n\nconst hideModal = () => {\n  modal.classList.remove(\"is-active\");\n  html.classList.remove(\"\
    is-clipped\");\n};\n\ndocument.querySelector(\"a.show-modal\").addEventListener(\"\
    click\", function(e) {\n  e.preventDefault();\n  showModal();\n});\n\nmodal.querySelector(\"\
    .modal .delete\").addEventListener(\"click\", function(e) {\n  e.preventDefault();\n\
    \  hideModal();\n});\n\n// Form submition\nconst form = document.querySelector(\"\
    #note-form\");\nconst url = form.getAttribute(\"action\");\nconst method = form.getAttribute(\"\
    method\");\n\nconst prependNote = html => {\n  const notesList = document.querySelector(\"\
    .notes-list\");\n  const div = document.createElement(\"div\");\n  div.innerHTML\
    \ = html;\n  notesList.insertBefore(div.firstChild, notesList.firstChild);\n};\n\
    \nconst updateNote = html => {\n  const article = document.querySelector(\"article\"\
    );\n  const div = document.createElement(\"div\");\n  div.innerHTML = html;\n\
    \  article.parentNode.replaceChild(div.firstChild, article);\n};\n\nconst onSuccess\
    \ = html => {\n  hideModal();\n  form.reset();\n\n  if (method === \"POST\") {\n\
    \    prependNote(html);\n  } else if (method === \"PUT\") {\n    updateNote(html);\n\
    \  }\n};\n\nform.addEventListener(\"submit\", e => {\n  e.preventDefault();\n\n\
    \  fetch(url, {\n    method,\n    body: new FormData(form)\n  })\n    .then(response\
    \ => response.text())\n    .then(text => onSuccess(text))\n    .catch(error =>\
    \ console.error(error));\n});\n```\n"
  raw: "In Hapi v19, [`request.payload.multipart` was changed to `false` by default](https://github.com/hapijs/hapi/issues/4017).\
    \ We need to set it back to `true` for the `POST` and `PUT` routes, as we’ll be\
    \ using a `FormData` object to transmit data to the server, and the transmitted\
    \ data will be in the `multipart/form-data` format.\n\n## Building the Views\n\
    \nAt this point, our site is receiving HTTP calls and responding with JSON objects.\
    \ To make it useful to everybody, we have to create the pages that render our\
    \ information in a nice way.\n\nIn this example, we’re going to use the [Pug](https://pugjs.org/api/getting-started.html)\
    \ (formerly Jade) templating language, although this isn’t mandatory, and we can\
    \ use other languages with Hapi.js. We’re going to use the [Vision](https://github.com/hapijs/vision)\
    \ plugin to enable the view functionality in our server.\n\n#### Beginner’s Guide\
    \ to Pug\n\nIf you’re not familiar with Jade/Pug, see our [Beginner’s Guide to\
    \ Pug](https://www.sitepoint.com/a-beginners-guide-to-pug/).\n\nYou can install\
    \ the packages with the following command:\n\n```\nnpm install @hapi/vision@5.5.4\
    \ pug\n```\n\nHere we’re installing v5.5.4 of the vision plugin, which is compatible\
    \ with Hapi v18\\. If you’ve opted to install Hapi v19, you can simply type `npm\
    \ i @hapi/vision` to pull in the latest version.\n\n### The Note Component\n\n\
    First, we’re going to build the note component that’s going to be reused across\
    \ our views. Also, we’re going to use this component in some of our controller\
    \ functions to build a note on the fly in the back end to simplify the logic on\
    \ the client.\n\nCreate a file in `lib/views/components` called `note.pug` with\
    \ the following content:\n\n```\narticle.content\n  h2.title: a(href=`/note/${note.slug}`)=\
    \ note.title\n  p.subtitle.is-6 Published on #{note.date}\n  p=note.content\n\
    ```\n\nIt’s composed of the title of the note, the publication date and the content\
    \ of the note.\n\n### The Base Layout\n\nThe base layout contains the common elements\
    \ of our pages—or in other words, for our example, everything that’s not content.\
    \ Create a file in `lib/views/` called `layout.pug` with the following content:\n\
    \n```\ndoctype html\nhead\n  meta(charset='utf-8')\n  meta(name='viewport' content='width=device-width,\
    \ initial-scale=1')\n  title=page\n  meta(name='description' content=description)\n\
    \  link(rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css')\n\
    \  script(defer='' src='https://use.fontawesome.com/releases/v5.3.1/js/all.js')\n\
    body\n  block content\n  script(src='/scripts/main.js')\n```\n\nThe content of\
    \ the other pages will be loaded in place of `block content`. Also, note that\
    \ we’ll display a page variable in the `title` element, and a `description` variable\
    \ in the `meta(name='description')` element. We’ll create those variables in our\
    \ routes later.\n\nFor styling purposes, we’re including the [Bulma CSS framework](https://bulma.io/)\
    \ and [Font Awesome](https://fontawesome.com/) from a CDN. We’re also including\
    \ a `main.js` file at the bottom of the page, which will contain all of our custom\
    \ JavaScript code for the front end. Please create that file now in a `static/public/scripts/`\
    \ directory.\n\n### The Home View\n\nOn our home page, we’ll show a list of all\
    \ the notes in our database and a button that will show a modal window with a\
    \ form that allows us to create a new note via Ajax.\n\nCreate a file in `lib/views`\
    \ called `home.pug` with the following content:\n\n```\nextends layout\n\nblock\
    \ content\n  section.section\n    .container\n\n      h1.title.has-text-centered\n\
    \        | Notes Board\n\n      .tabs.is-centered\n        ul\n          li\n\
    \            a.show-modal(href='#') Publish\n\n      main(container).notes-list\n\
    \        each note in data.notes\n          include components/note\n        \
    \  hr\n\n      .modal\n        .modal-background\n        .modal-card\n      \
    \    header.modal-card-head\n            p.modal-card-title Add note\n       \
    \     button.delete(aria-label='close')\n          section.modal-card-body\n \
    \           form(action='/note' method='POST').note-form#note-form\n         \
    \     .field\n                .control\n                  input.input(name='noteTitle'\
    \ type='text' placeholder='Title')\n              .field\n                .control\n\
    \                  input.input(name='noteDescription' type='text' placeholder='Short\
    \ description')\n              .field\n                .control\n            \
    \      textarea.textarea(name='noteContent' placeholder='Contents')\n        \
    \      .field\n                .control\n                  button.button.is-link\
    \ Save\n```\n\n### The Note View\n\nThe note page is pretty similar to the home\
    \ page, but in this case, we show a menu with options specific to the current\
    \ note, the content of the note and the same form as in the home page, but with\
    \ the current note information already filled, so it’s there when we update it.\n\
    \nCreate a file in `lib/views` called `note.pug` with the following content:\n\
    \n```\nextends layout\n\nblock content\n  section.section\n    .container\n  \
    \    h1.title.has-text-centered\n          | Notes Board\n\n      .tabs.is-centered\n\
    \        ul\n          li: a(href='/') Home\n          li: a.show-modal(href='#')\
    \ Update\n          li: a(href=`/note/${note.slug}/delete`) Delete\n\n      include\
    \ components/note\n\n      .modal\n        .modal-background\n        .modal-card\n\
    \          header.modal-card-head\n            p.modal-card-title Edit note\n\
    \            button.delete(aria-label='close')\n          section.modal-card-body\n\
    \            form(action=`/note/${note.slug}` method='PUT').note-form#note-form\n\
    \              .field\n                .control\n                  input.input(name='noteTitle'\
    \ type='text' placeholder='Title' value=note.title)\n              .field\n  \
    \              .control\n                  input.input(name='noteDescription'\
    \ type='text' placeholder='Short description' value=note.description)\n      \
    \        .field\n                .control\n                  textarea.textarea(name='noteContent'\
    \ placeholder='Contents') #{note.content}\n              .field\n            \
    \    .control\n                  button.button.is-link Save\n```\n\n### The JavaScript\
    \ on the Client\n\nTo create and update notes, we’ll use some JavaScript, both\
    \ to show/hide a modal with a form, and to submit the requests via Ajax. Although\
    \ this is not strictly necessary, we feel it provides a better experience for\
    \ the user.\n\nThis is the content of our `main.js` file in the `static/public/scripts/`\
    \ directory:\n\n```\n// Modal\n\nconst modal = document.querySelector(\".modal\"\
    );\nconst html = document.querySelector(\"html\");\n\nconst showModal = () =>\
    \ {\n  modal.classList.add(\"is-active\");\n  html.classList.add(\"is-clipped\"\
    );\n};\n\nconst hideModal = () => {\n  modal.classList.remove(\"is-active\");\n\
    \  html.classList.remove(\"is-clipped\");\n};\n\ndocument.querySelector(\"a.show-modal\"\
    ).addEventListener(\"click\", function(e) {\n  e.preventDefault();\n  showModal();\n\
    });\n\nmodal.querySelector(\".modal .delete\").addEventListener(\"click\", function(e)\
    \ {\n  e.preventDefault();\n  hideModal();\n});\n\n// Form submition\n\nconst\
    \ form = document.querySelector(\"#note-form\");\nconst url = form.getAttribute(\"\
    action\");\nconst method = form.getAttribute(\"method\");\n\nconst prependNote\
    \ = html => {\n  const notesList = document.querySelector(\".notes-list\");\n\
    \  const div = document.createElement(\"div\");\n  div.innerHTML = html;\n  notesList.insertBefore(div.firstChild,\
    \ notesList.firstChild);\n};\n\nconst updateNote = html => {\n  const article\
    \ = document.querySelector(\"article\");\n  const div = document.createElement(\"\
    div\");\n  div.innerHTML = html;\n  article.parentNode.replaceChild(div.firstChild,\
    \ article);\n};\n\nconst onSuccess = html => {\n  hideModal();\n  form.reset();\n\
    \n  if (method === \"POST\") {\n    prependNote(html);\n  } else if (method ===\
    \ \"PUT\") {\n    updateNote(html);\n  }\n};\n\nform.addEventListener(\"submit\"\
    , e => {\n  e.preventDefault();\n\n  fetch(url, {\n    method,\n    body: new\
    \ FormData(form)\n  })\n    .then(response => response.text())\n    .then(text\
    \ => onSuccess(text))\n    .catch(error => console.error(error));\n});\n```"
