    \n# Chapter 12: Using Docker for Node.js Development\n\n### by Craig Buckler\n\
    \nNode.js applications rarely exist in isolation. You could require a database,\
    \ caching, message queues, reverse proxies, search, email routing, process monitoring,\
    \ other language runtimes and more! Managing these dependencies on your development\
    \ PC becomes significantly easier with Docker.\n\nThis guide provides an introduction\
    \ to Docker. It concentrates on Node.js, but the concepts apply to any development\
    \ languages or frameworks.\n\n## “But it Works on My Machine!”\n\nImagine you’ve\
    \ created an amazing application with Node.js and a MongoDB database. It’s so\
    \ successful, you’ve had to employ another developer to add new features. They\
    \ clone the repository, run `npm install && npm start` and **BANG**—it fails with\
    \ an obscure error message.\n\nDespite best intentions, your environments are\
    \ different:\n\n*   you use a Mac, they’re using Windows\n\n*   you developed\
    \ using Node.js v12, but they have v10 installed\n\n*   you’re using MongoDB v3.6,\
    \ they’re on v4.2\n\nYou may be able to solve these issues within a few hours,\
    \ but must keep every dependency in sync forever. Is that practical as your team\
    \ grows? Is it compatible with your live server?\n\n## Virtual Machines\n\nA virtual\
    \ machine (VM) is an emulated computer system. Rather than installing an operating\
    \ system (OS) on hardware, it’s run within a software emulation of server hardware.\
    \ Cross-platform VM options include [VMware](https://www.vmware.com/) and [VirtualBox](https://www.virtualbox.org/).\n\
    \nYou could create a Linux VM with all the application dependencies which can\
    \ be run on Windows, macOS, or Linux. Every developer and the live server would\
    \ have the same environment. Unfortunately, VMs quickly become impractical:\n\n\
    *   their disk images are large and difficult to copy\n\n*   an individual VM\
    \ could be updated automatically or by the developer so it’s out of sync with\
    \ others\n\n*   a VM requires considerable computing resources: it’s a full OS\
    \ running within an OS\n\n## Docker Overview\n\n[Docker](https://www.docker.com/)\
    \ is a platform which allows you to build, share, and run applications in *containers*.\
    \ Think of a container as an isolated virtual machine with its own operating system,\
    \ libraries, and the application files. *(In reality, containers are lightweight\
    \ processes which share resources on the host.)*\n\nDocker benefits include:\n\
    \n*   all developers can use the same Docker images on macOS, Linux, and Windows\n\
    \n*   identical containers can be used in development and production environments\n\
    \n*   installation, configuration, and maintenance of applications is easier\n\
    \n*   developers retain the benefits of local development and can experiment without\
    \ risk\n\n*   containers can easily be scaled—for example, more Node.js processes\
    \ added to cope with increased traffic\n\nA commercial enterprise edition of Docker\
    \ is available. This guide uses the open-source community edition, but the same\
    \ techniques apply.\n\n## Docker Concepts and Terminology\n\nDocker can be daunting\
    \ initially, but understanding a few key concepts will aid development.\n\nDocker\
    \ is a client-server application. The server is responsible for container management\
    \ and is controlled via a REST API. The command-line interface communicates with\
    \ the API, so it’s possible to run the server daemon anywhere and connect from\
    \ another device.\n\n### Images\n\nA Docker image is a snapshot of a file system\
    \ and all application files. In some cases, you’ll use an image as is from the\
