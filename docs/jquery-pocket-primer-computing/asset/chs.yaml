  \ <p>Goodbye World from jQuery (悬停在我身上)</p> </div>\n    <div>\n      <input type=\"\
  button\" id=\"button1\" value=\"Click to Slide Up and Hide Me\" />\n    </div>\n\
  \  </div>\n  <script>\n    $(document).ready(function(){\n      var para = $(\"\
  div > p\");\n      para.each(function(){\n        var p = $(this);\n        p.append('<span\
  \ style=\"color:red;font-size:18px\"'>这段文字在悬停时会滑动</span>');\n      });\n      para.hover(function()\
  \ {\n        // 你可以使用 'slow' 或 'fast'\n        //$(this).find(\"span\").slideDown(\"\
  slow\");\n        $(this).find(\"span\").slideDown(3000).slideUp(\"fast\").slideDown(\"\
  slow\");\n      }, function() {\n        //$(this).find(\"span\").hide();\n    \
  \    $(this).find(\"span\").slideUp(2000).slideDown(\"slow\").slideUp(\"fast\").slideDown(2000).slideUp(\"\
  slow\");\n      });\n      $(\"#button1\").click(function() {\n        $(this).slideUp(2000,\
  \ function() {\n          //$(this).remove();\n        });\n      });\n    });\n\
  \  </script>\n</body>\n</html>\n```\n\n`Listing 3.2` 与 `Listing 3.1` 类似，不同的是使用了滑动相关的\
  \ jQuery 方法代替渐入相关的 jQuery 方法，且该代码示例的描述类似于 `Listing 3.1` 的描述。\n\n需要记住的一点是，对于具有 CSS\
  \ 内边距（padding）、外边距（margin）属性或未设置固定宽度的元素，滑动效果并不总是按预期工作（可能会出现某些抖动）。请尝试这些场景，看看结果行为是否符合你的预期，或者对你的\
  \ Web 页面来说是可以接受的。\n\n## jQuery 中的缓动函数\n\n\n\n\njQuery 支持一组被称为“缓动”（easing）函数，这些函数提供了不同类型的动画效果。通俗来说，缓动函数使用某种方程作为动画效果的路径。例如，你可以使用线性方程来创建恒速运动的动画。你也可以使用二次方程（二阶多项式，其通用形式为\
  \ `a*x*x+b*x+c`）来创建具有加速度的动画效果，或用于二次贝塞尔曲线，并使用三次方程用于三次贝塞尔曲线。\n\njQuery 还为动画提供了缓动函数，其动画速度在缓动函数的不同位置更加复杂（慢、快、慢）。在\
  \ particular 开始搜索 jQuery 插件之前，探索现有的 jQuery 缓动函数是非常值得的，其中一些：`linear`、`easeInQuad`、`easeOutQuad`、`easeInCubic`、`easeOutCubic`、`easeInOutCubic`、`easeInSine`、`easeOutSine`、`easeInOutSine`、`easeInElastic`、`easeOutElastic`\
  \ 和 `easeInOutElastic`。\n\n你可以找到许多提供 jQuery 缓动函数大量演示的链接，包括这里显示的：\n\n- [`jqueryui.com/demos/effect/easing.html`](http://jqueryui.com/demos/effect/easing.html)\n\
  \n此外，还有许多 jQuery 插件可用于自定义动画相关的缓动函数，或者如果你找不到符合你需求的插件，也可以创建自己的 jQuery 插件。\n\n## 的\
  \ jQuery .animate() 方法\n\njQuery `animate()` 方法可以接受四个参数，它们看起来如下：\n\n```javascript\n\
  jQuery(elements).animate([properties],\n                      [milliseconds],\n\
  \                      [easing-function],\n                      [complete-function]);\n\
  ```\n\n`properties` 参数包含要动画的属性列表，`milliseconds` 参数指定动画效果的持续时间。`easing-function`\
  \ 参数指定上一节讨论的缓动函数之一，而 `complete-function` 参数指定在动画效果完成后执行的 JavaScript 回调函数。\n\n![image](img/cd.jpg)\
  \ CD 上的 HTML5 页面 `JQAnimate1.html` 阐释了如何使用 jQuery `animate()` 函数在两个 PNG 文件上创建动画效果。\n\
  \n此 HTML5 页面包含两个 PNG ，以及针对两个 HTML `<button>` 元素的 jQuery 点击处理程序。每当用户点击左侧按钮时，jQuery\
  \ 代码会在五秒间隔内将 PNG 的透明度从 1.0 降低到 0.25，将图像向右移动 50 个单位，并增加高度 100 个单位，所示：\n\n```javascript\n\
  $('#text1').animate({\n    opacity: 0.25,\n    left: '+=50',\n    height: '+=100'\n\
  }, 5000, function() {\n    // 动画完成（执行其他操作）\n});\n```\n\n每当用户点击第二个按钮时，jQuery 代码会对右侧图像文件执行类似的动画效果。运行\
  \ `Listing 3.2` 中的代码并点击按钮以查看动画效果。\n\n你可以在 HTML5 页面 `JQAnimate2.html` 中看到 `Listing\
  \ 3.2` 中动画效果的变体，以及 `JQAnimate2.html` 页面中的顺序动画和并行动画效果，这两者在 CD 上均可用。\n\n![image](img/cd.jpg)\
  \ 你可以通过更改 HTML 元素的不同 CSS 属性，使用 jQuery `animate()` 函数创建其他有趣的视觉效果。例如，以下代码块为作为 HTML\
  \ `<ul>` 元素部分的列表项创建一个“摇晃”效果：\n\n```javascript\n$('#mylist li').hover(function()\
  \ {\n  $(this).animate({paddingLeft: '+=15px'}, 200);\n}, function() {\n  $(this).animate({paddingLeft:\
  \ '-=15px'}, 200);\n});\n```\n\n你还可以创建线性和摇摆动画效果，所示：\n\n```javascript\n$('p:first').toggle(function()\
  \ {\n  $(this).animate({'height':'+=150px'}, 1000, 'linear');\n}, function() {\n\
  \  $(this).animate({'height':'-=150px'}, 1000, 'swing');\n});\n```\n\n## 使用 .animate()\
  \ 函数自定义 CSS 动画\n\n你可以使用 jQuery 动画许多 CSS 属性，包括 `border-width`、`bottom`、`font-size`、`height`、`margin`、`opacity`、`padding`、`right`、`top`、`width`\
  \ 和 `word-spacing`。此外，你可以使用 `slow`、`fast` 或代表毫秒的整数值指定持续时间。\n\n以下代码动画化 HTML `<div>`\
  \ 元素的 `width` 和 `height` 属性，使其最终值将将为 500 和 300：\n\n```javascript\n$(\"#myDiv\").click(function()\
  \ {\n  $(this).animate({width:'500px', height: '300px'});\n});\n```\n\n在前面的 jQuery\
  \ 代码中，如果初始值小于 `500px`，则宽度将增加到 `500px`；否则宽度将减到 `500px`（高度也是如此）。\n\n### 基于 CSS3 的动画效果\n\
  \n本节说明了你可以用 CSS3 创建的各种动画效果，代码示例使用了 CSS3 `@keyframes` 规则和 2D 变换。\n\n### 使用 CSS 关键帧和\
  \ 2D 变换的动画\n\nListing 3.3 显示了 `QButtonAnimation1.html` 的内容，并说明了如何创建由 `hover` 伪类触发的按钮相关动画。\n\
  \n\n\n\n列表 3.3 包含一个 HTML `<style>` 元素，其中包含一个 CSS3 keyframes 定义（你也可以将其移动到单独 CSS 样式表中），随后是两个类型为按钮的\
  \ HTML `<input>` 元素，这两个元素都在 列表 3.3 中的 `<script>` 元素中定义了点击事件处理程序。\n\n当用户点击任何一个按钮时，CSS3\
  \ keyframes 定义就会应用到该按钮上。这反过来通过 `translate()`、`rotate()` 和 `skew()` 函数的组合，为相关选择器指定的时段（无论是\
  \ 2 秒还是 4 秒）创建动画效果。此外，点击处理程序还创建了一个持续 500 毫秒的淡出效果。\n\n当你在浏览器中启动 HTML Web 页面 `JQButtonAnimation1.html`\
  \ 时，每当你悬停在任一个按钮上，都会看到动画效果。\n\n## 使用 CSS3 和 jQuery 进行 2D 变换](#toc.html_toc-h2-0026)\n\
  \n本节中的代码示例向你展示了如何使用 jQuery 的 `css()` 函数基于用户触发的事件，直接对元素应用 CSS 变换。\n\n列表 3.4 显示了 `JQTransforms2D1.css`\
  \ 的内容，该文件包含应用于 HTML5 Web 页面 `JQTransforms2D1.html` 的 CSS3 选择器，该页面见于 列表 3.4。\n\n\
  ### 列表 3.4 JQTransforms2D1.css\n\n```css\n#outer {\n  position: absolute;\n  left:\
  \ 50px;\n  top: 150px;\n}\n\n#inner1 {\n  float: left;\n  background-color:#F00;\n\
  \  width: 200px;\n  height:150px;\n}\n\n#inner2 {\n  float: left;\n  background-color:#FF0;\n\
  \  width: 200px;\n  height:150px;\n}\n\n#inner3 {\n  float: left;\n  background-color:#00F;\n\
  \  width: 200px;\n  height:150px;\n}\n```\n\n列表 3.4 非常直观：为 列表 3.5 中定义的三个 HTML `<div>`\
  \ 元素指定了宽度和高度等属性。\n\n### 列表 3.5 JQTransforms2D1.html\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>jQuery 变换效果</title>\n\
  \  <link href=\"Transforms1.css\" rel=\"stylesheet\" type=\"text/css\">\n  <script\
  \ src=\"http://code.jquery.com/jquery-2.0.0b1.js\">\n  </script>\n  <script src=\"\
  http://code.jquery.com/jquery-migrate-1.1.0.js\">\n  </script>\n</head>\n<body>\n\
  \  <h1>点击任何一个矩形内部：</h1>\n  <div id=\"outer\">\n    <div id=\"inner1\"></div>\n \
  \   <div id=\"inner2\"></div>\n    <div id=\"inner3\"></</div>>\n  </div>\n  <script>\n\
  \    $(document).ready(function() {\n      $(\"#inner1\").click(function() {\n \
  \       $(\"div\").css({height: '300px',\n          'webkit-transform': 'scale(0.5,\
  \ 0.5) skew(-10deg, 20deg)'\n        });\n      });\n      $(\"#inner2\").click(function()\
  \ {\n        $(\"div\").css({height: '200px',\n          width: '250px',\n     \
  \     'webkit-transform': 'scale(0.5, 0.8) rotate(-45deg)'\n        });\n      });\n\
  \      $(\"#inner3\").click(function() {\n        $(\"div\").css({height: '100px',\n\
  \          width: '250px',\n          'webkit-transform': 'skew(-10deg, 10deg) rotate(-45deg)'\n\
  \        });\n      });\n    });\n  </script>\n</body>\n</html>\n```\n\n列表 3.5 为三个\
  \ HTML `<div>` 元素定义了点击事件的处理程序，所有处理程序都调用了 `css()` 函数来更新接收点击的 `<div>` 元素的属性。例如，第一个\
  \ HTML `<div>` 元素的更新如下：\n\n`$(\"div\").css({height: '300px', 'webkit-transform':\
  \ 'scale(0.5, 0.5) skew(-10deg, 20deg)'});`\n\n如你所见，高度属性设置为 300px，并且当用户点击 `<div>`\
  \ 元素时，应用了变换。请记住，你可以将 列表 3.5 中点击处理程序所引用的 CSS 代码移动到单独的样式表中。这使得在单个文件中维护 CSS 代码变得更加容易，你还可以在多个\
  \ HTML 页面中引用同一个样式表。\n\n除了 CSS3 2D 动画效果外，你显然还可以创建 3D 动画效果。通过尝试 列表 3.5 中的代码，并添加来自以下来源的\
  \ 3D 效果：`http://code.google.com/p/`，你可以对 第 2 章 进行实验。图 3.1 在浏览器中显示 `JQTransforms2D1.html`。列表\
  \ 3.4 和 列表 3.5 涉及到鼠标相关功能以及如何通过编程方式处理事件。列表 3.6 在下一节展示了如何使用 jQuery 和 CSS3 在 HTML5\
  \ 页面中根据鼠标当前位置渲染 `<div>` 元素。\n\n## jQuery 跟随鼠标示例](#toc.html-h1-002)\n\n本节中的代码示例通过展示如何通过编程方式创建\
  \ `<div>` 元素并将其添加到 DOM 中，扩展了前节介绍的功能。列表 3.6 显示了 `JQFollowMouse.html` 在 MacBook 上的内容。\n\
  \n### 列表 3.6 JQFollowMouse.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n  <meta charset=\"utf-8\" />\n  <title>跟随鼠标</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <div></div>\n  <script>\n    // 关于前一个 <div> 的注释\n    $(document).ready(function()\
  \ {\n      var rectWidth = 20;\n      var rectHeight = 20;\n      var moveCount\
  \ = 0;\n      var insertNode = true;\n      var currColor = \"\";\n      var rectColors\
  \ = Array('#ff00', '#ffff0', '#00ff', '#00ff');\n      var newNode;\n\n      $(document).mousemove(function(e)\
  \ {\n        ++moveCount;\n        // 用户正在移动鼠标吗？\n        if (insertNode == true)\
  \ {\n          // 在当前位置创建一个矩形\n          newNode = $('<div id=newNode>').css({\n\
  \            'position':'absolute',\n            'background-color':'#ff0000',\n\
  \            'width':rectWidth+'px',\n            'height':rectHeight+'px',\n  \
  \          top: e.pageY,\n            left: e.pageX\n          });\n          //\
  \ 使用此代码将矩形添加到正文\n          $(\"div\").append(newNode);\n          // 使用此代码不将矩形添加到正文\n\
  \          //$(document.body).append(newNode);\n          insertNode = false;\n\
  \        } else {\n          currColor = rectColors[moveCount % rectColors.length];\n\
  \          $('div').each(function() {\n            $(this).css({\n             \
  \ top: e.pageY,\n              left: e.pageX,\n              'background-color':\
  \ currColor\n            });\n          });\n        }\n      });\n    });\n  </script>\n\
  </body>\n</html>\n```\n\n\n\n\n\nListing 3.6 初始化了一些 JavaScript 变量，然后使用 jQuery 的\
  \ `css()` 方法动态创建一个 HTML `<div>` 元素，该元素的左上角坐标与 `mousemove` 事件发生点的坐标相同，从而创建了一个跟随鼠标的效果。需要注意的关键点是，事件对象（在此代码示例中称为\
  \ `e`）允许我们访问当前移动位置的坐标。我们可以使用属性 `e.pageX` 和 `e.pageY` 分别设置 CSS 属性 `left` 和 `top`。\n\
  \n同样请注意在 Listing 3.6 中，HTML `<body>` 元素之后紧跟着一个空的 HTML `<div>` 元素。需要这个元素是因为众，在脚本之后添加的\
  \ UI 元素在某些旧版浏览器中会消失。解决方案是包含这个空 `<div>` 元素，然后向该元素添加内容。\n\n## 使用 jQuery 处理其他事件 (#toc.html_toc-h1-0023)\n\
  \n你已经见过了说明如何使用 jQuery 处理各种事件的代码示例。jQuery 为鼠标相关事件提供了广泛支持，并像接下来的两节描述的那样，支持键盘事件。\n\n\
  ### 处理鼠标事件 (#toc.html_toc-h2-0027)\n\njQuery 支持以下你可能熟悉的常用鼠标事件：`mousedown`、`mouseenter`、`mouseleave`、`mousemove`、`mouseout`、`mouseover`\
  \ 和 `mouseup`。你可以使用以下 jQuery 代码结构在 jQuery 中检测这些鼠标事件：\n\n```javascript\n$(\"#myInput\"\
  ).mousedown(function() {\n  // do something\n});\n\n$(\"#myInput\").mouseenter(function()\
  \ {\n  // do something\n});\n\n$(\"#myInput\").mouseleave(function() {\n  // do\
  \ something\n});\n\n$(\"#myInput\").mousemove(function() {\n  // do something\n\
  });\n\n$(\"#myInput\").mouseout(function() {\n  // do something\n});\n\n$(\"#myInput\"\
  ).mouseover(function() {\n  // do something\n});\n\n$(\"#myInput\").mouseup(function()\
  \ {\n  // do something\n});\n```\n\n你可以将所需的任何代码片段包含在 HTML 页面中，然后添加处理逻辑以提供预期的功能。\n\
  \n### 处理键盘事件 (#toc.html_toc-h2-0028)\n\n你也可以在 jQuery 中检测 `keypress`、`keyup` 和 `keydown`\
  \ 事件。例如，这段代码在用户点击大写“Z”键时显示一个警报：\n\n```javascript\n$(\"#myInput\").keypress(function(e)\
  \ {\n  if (e.which == 90) alert ('Z was typed.')\n});\n```\n\n你可以检查其他按键事件，记住大写 `A`\
  \ 的十进制是 65（十六进制 41），小写 `a` 是十进制 97（十六进制 61），小写 `z` 是十进制 122（十六进制 7A）。\n\n你还可以添加许多其他效果，包括本章之前代码示例中提供的动画效果。\n\
  \n![image](img/cd.jpg) ## CD 额外代码示例 (#toc.html_toc-h1-0024)\n\nHTML5 页面 `JQSlideShow1.html`\
  \ 阐述了如何使用 jQuery 创建包含 JPG 图像的幻灯片，它使用以下代码块来确定下一个 HTML `<img>` 元素（当到达最右侧的图像时，它会循环到列表的第一张图像），并添加\
  \ `show` 属性，如下：\n\n```javascript\nnext = curr.next().length ? curr.next() :\n  \
  \     curr.parent().children(':first');\n\nnext.addClass(\"show\");\n```\n\n![image](img/cd.jpg)\
