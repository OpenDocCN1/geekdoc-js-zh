  \ style=\"color:red;font-size:18px\"'+'>'>这段文字在悬停时会淡出</span>');\n      });\n   \
  \   para.hover(function() {\n        // 你可以使用 'slow' 或 'fast'\n        //$(this).find(\"\
  span\").fadeIn(\"slow\");\n        $(this).find(\"span\").fadeIn(3000).fadeOut(\"\
  fast\").fadeIn(\"slow\");\n      }, function() {\n        //$(this).find(\"span\"\
  ).hide();\n        $(this).find(\"span\").fadeOut(2000).fadeIn(\"slow\").fadeOut(\"\
  fast\").fadeIn(2000).fadeOut(\"slow\");\n      });\n      $(\"#button1\").click(function()\
  \ {\n        $(this).fadeOut(50, function() {\n          //$(this).remove();\n \
  \       });\n      });\n    });\n  </script>\n</body>\n</html>\n```\n\n`Listing\
  \ 3.1` 以两个 HTML `<div>` 元素和一个 HTML `<button>` 元素开始，随后是用于对 HTML `<p>` 元素应用渐入相关效果的\
  \ jQuery 代码。第一个需要注意的是 JavaScript 变量 `para`，它存储了指向 `<div>` 元素子元素的 HTML `<p>` 元素的引用，如下所示：\n\
  \n```javascript\n$(document).ready(function(){\n  var para = $(\"div > p\");\n \
  \ // 省省略代码\n}\n```\n\n下一个代码块为 `para` 变量中引用的 HTML `<p>` 元素动态添加一个 HTML `<span>` 元素：\n\
  \n```javascript\npara.each(function(){\n  var p = $(this);\n  p.append('<span style=\"\
  color:red;font-size:18px\"'>这段文字在悬停时会淡出</span>');\n});\n```\n\n当用户悬停在任何 HTML `<p>`\
  \ 元素上时，jQuery 代码使用 jQuery 方法链式调用为 HTML `<p>` 元素创建多个渐入相关效果。示例所示：\n\n```javascript\n\
  $(this).find(\"span\").fadeOut(2000).fadeIn(\"slow\").fadeOut(\"fast\").fadeIn(2000).fadeOut(\"\
  slow\");\n```\n\n你可以使用 jQuery 方法对当前获取焦点元素以外的元素应用效果。例如，如果你想在悬停事件期间隐藏一个兄弟元素，你可以这样做：\n\
  \n`$(this).next().fade();`\n\n下一节将向你展示如何使用 jQuery 滑动相关函数来创建滑动动画效果。\n\n# jQuery 滑动相关函数\n\
  \njQuery 的 `slideUp()`、`slideDown()` 和 `slideToggle()` 方法可以指定三个参数，它们的语法如下：\n\n`jQuery(elements).slideUp([speed],\
  \ [easing], [callback]);`\n\n`jQuery(elements).slideDown([speed], [easing], [callback]);`\n\
  \n`jQuery(elements).slideToggle([speed], [easing], [callback]);`\n\n`milliseconds`\
  \ 值指定动画效果的持续时间，`callback` 是在动画完成后执行的可选 JavaScript 函数。\n\n`Listing 3.2` 显示了 `SlideUpDown.html`\
  \ 的内容，并说明如何在 jQuery 中执行简单和链式的滑动效果。\n\n### 列表 3.2 QSlideUpDown.html\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>jQuery\
