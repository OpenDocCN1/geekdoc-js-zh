  ```\n\n`body` 元素包含三个 `div` 元素，每个元素都包含一张 PNG 图片，你可以在屏幕上拖动这些图片。\n\n![image](img/fig5.1.jpg)\n\
  \n**图 5.1** MacBook 上的 Chrome 浏览器中的三张图片。\n\n`图 5.1` 显示了在 MacBook 的 Chrome 浏览器中渲染\
  \ `Listing 5.4` 的结果。\n\n`图 5.2` 展示了在 MacBook 的 Chrome 浏览器中将 `Listing 5.4` 中的图片拖动到不同位置的示例。\n\
