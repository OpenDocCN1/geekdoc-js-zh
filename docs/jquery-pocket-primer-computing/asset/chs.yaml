  \ `LRGradQCBezier1.html` 中定义的二次和三次贝塞尔曲线。\n\nHTML5 Canvas 支持渲染 JPG 文件，你也可以对 HTML5\
  \ `<canvas>` 元素应用 CSS 选择器。光盘包含 HTML5 Web 页面 `Image1.html` 和 `Image1.css`，其选择器匹配\
  \ HTML5 `<canvas>` 元素。\n\n顺便提一下，HTML5 Canvas 还支持 `clip()` 方法，允许你以各种方式“裁剪” JPG 文件。此外，你还可以执行合成效果，甚至操作\
  \ JPG 文件的单个像素。可以在互联网上搜索描述这些效果技术细节的文章。\n\nHTML5 Canvas 提供了 `createPattern(image,\
  \ type)` 方法，允许你根据模式类型渲染一组图像，其取值可以是 `repeat`、`repeat-x`、`repeat-y` 和 `no-repeat`。语的示例（以及使用方法）如下：\n\
  \n```\nvar pattern = canvas.createPattern(img,\"repeat\");\ncanvas.fillStyle = pattern;\n\
  canvas.fillRect(0,0,500,300);\n```\n\n![image](img/cd.jpg) 光盘上的 HTML5 Web 页面 `RepeatingImage1.html`\
  \ 阐述了如何在 HTML5 `<canvas>` 元素上重复 JPG 图片。\n\n图 9.8 在 MacBook 的 Chrome 浏览器上横屏模式显示了\
  \ `RepeatingImage1.html`。\n\n![image](img/fig9.8.jpg)\n\n**图 9.8** MacBook Chrome\
  \ 浏览器上的重复 JPG。\n\n### 其他 HTML5 Canvas 工具包 (#toc.html_toc-h1-0093)\n\n有几个非常好的 JavaScript\
  \ 工具包可以在 HTML5 Canvas 之上提供抽象层，包括 `Easel.js`、`Fabric.js` 和 `Paper.js`。\n\n除了在这些工具包各自主页上提供的代码示例外，你可能喜欢以下开源项目的内容，它使用\
  \ `Easel.js` 创建图形代码示例：\n\nhttp://code.google.com/p/easeljs-graphics\n\n### 总结 (#toc.html_toc-h1-0094)\n\
  \n本章介绍了 HTML5 Canvas，并展示了使用 HTML5 `<canvas>` 元素创建 2D 形状的示例。你还学习了如何将 HTML5 Canvas\
  \ 与 jQuery 自定义代码结合，以便使用 Canvas 的 2D 形状操作 HTML5 Web 页面。特别是，你学习了如何在 HTML5 Canvas 中实现以下操作：\n\
  \n* 渲染线段、矩形和圆形\n* 创建线性和径向渐变\n* 创建贝塞尔曲线\n* 显示 JPG 文件\n* 使用 `jCanvas`（一个用于 jQuery\
  \ 插件）\n* 将 HTML5 Canvas 与 CSS3 结合\n* 将 HTML5 Canvas 与 jQuery Mobile 结合\n\n# 第 10\
  \ 章 (#toc.html_toc-10)\n\n### 使用 PHONEGAP 开发 HTML5 移动端应用 (#toc.html_toc-10)\n\n\
  本章向你展示了如何为 Android 和 iOS 创建基于 HTML5 的混合移动应用程序。章中的代码示例包含了 HTML5 以及 HTML5、CSS3 和 SVG\
  \ 的各种组合。\n\n正如你很快会发现的，基于 Android 的示例比基于 iOS 的示例要多。代码示例的移动平台选择纯粹出于风格考虑。然而，每个基于 Android\
  \ 的代码示例都有对应的 iOS 版本，反之亦然。\n\n本章的第一部分概述了如何使用“手动”方法而不是 PhoneGap 等工具包来开发移动应用程序。该节的代码示例使用了你在之前章节中见过的代码，并向你展示了如何创建基于\
  \ Android 的移动应用程序。如果你心心勃勃，可以为所有示例创建 iOS 版本！\n\n本章的第二部分包含了基于 Android 的示例，展示了如何将原生\
  \ Android 应用与 CSS3、SVG 和 HTML5 Canvas 结合。该节包含一个渲染支持鼠标的折线图示例，每当用户点击折线图下方的按钮时，其值就可以更新。请记住，代码示例后的讨论进展得很快，因为\
  \ HTML Web 页面包含简单的标记，CSS3 选择器包含你以前见过的代码，并且讨论了 SVG 形状。\n\n本章的第三部分快速概述了 Apache Cordova（以前称为\
  \ PhoneGap），这是一种流行的跨平台移动应用开发工具包。2011 年，Adobe 收了创建 PhoneGap 的公司 Nitobi，不久后 Adobe\
  \ 开源了 PhoneGap。该节解释了 PhoneGap 能做什么，以及你可以配合 PhoneGap 使用的一些工具包。你将学习如何创建一个基于 PhoneGap\
  \ 的渲染 CSS3 动画效果的 Android 应用。你可以将此应用部署到支持 Android ICS 或更高版本的 Android 移动设备。\n\n本章的最后部分讨论了如何使用\
  \ Xcode 的 PhoneGap 插件创建 iOS 混合移动应用。正如你在本章看到的，PhoneGap 允许你使用 HTML、CSS 和 JavaScript\
  \ 创建移动应用。你可以将这些应用部署到多个平台，包括 Android、iOS、BlackBerry 和 Windows Mobile。你还可以创建结合 PhoneGap\
  \ 和 Sencha Touch（另一个流行的框架）的移动应用。然而，由于空间限制，本章未讨论 Sencha Touch。\n\n如果你不熟悉本章提到的任何移动平台，你仍然可以完成本章中的示例，因为它们由基于\
  \ HTML5 的代码组成。在移动平台上创建基于 HTML5 的移动应用的步骤顺序本质上独立于实际代码。\n\n\n\n\n如果你对 Android 并不熟悉，可以阅读本书的附录，其中包含了本章代码示例中\
  \ Android 特有概念的简要概述。每当你遇到不清楚的 Android 概念时，都可以参考相应的章节。\n\n本节的代码示例向你展示如何在 Android\
  \ 应用程序中启动 HTML5 Web 页面（该页面还引用了 CSS3 样式表）。核心思想包含三个步骤：\n\n1. 修改 Android `Activity`\
  \ 类以实例化一个 Android `WebView` 类，以及一些与 JavaScript 相关的设置。\n2. 引用 Android 项目 `assets/www`\
  \ 子目录下的 HTML5 Web 页面。\n3. 将 HTML5 Web 页面、CSS 样式表和 JavaScript 文件复制到 Android 项目的 `assets/www`\
  \ 子目录中。\n\n在步骤 3 中，你可能会创建一个分级目录集，其中包含相同类型（HTML、CSS 或 JavaScript）的文件，这与你在 Web 应用程序中组织文件的方式非常相似。\n\
  \n现在启动 Eclipse 并创建一个名为 `AndroidCSS3` 的 Android 项目。确保你选择的是 Android 3.1 或更高版本，这对于渲染基于\
  \ CSS3 的效果是必要的。\n\n创建项目后，让我们来看包含此 Android 移动应用程序自定义代码的四个文件。Listing 10.1、10.2 和 10.3\
  \ 分别显示了项目文件 `main.xml`、`AndroidCSS3.html` 和 `AndroidCSS3Activity.java` 的内容。\n\n\
  ### 列表 10.1 main.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:orientation=\"\
  vertical\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
  fill_parent\">\n  <WebView android:id=\"@+id/webview\"\n          android:layout_width=\"\
  fill_parent\"\n          android:layout_height=\"fill_parent\">\n  </WebView>\n\
  </LinearLayout>\n```\n\n列表 10.1 指定了一个 `LinearLayout`，它包含一个 Android `WebView`，该 WebView\
  \ 将占据移动设备的整个屏幕。这是我们想要看到的效果，因为 Android 默认浏览器是在 Android `WebView` 中渲染的。\n\n### 列表\
  \ 10.2 AndroidCSS3.html\n\n```html\n<!doctype html>\n<head>\n  <title>CSS 渐变示例</title>\n\
  \  <link href=\"AndroidCSS3.css\" rel=\"stylesheet\">\n</head>\n<body>\n  <div id=\"\
  outer\">\n    <div id=\"radial1\">Text1</div>\n    <div id=\"radial2\">Text2</div>\n\
  \    <div id=\"radial3\">Text3</div>\n    <div id=\"radial4\">Text4</div>\n  </div>\n\
  </body>\n</html>\n``` （等待，已更正）\n列表 10.2 是一个简单的 HTML Web 页面，它引用了 CSS 样式表 `AndroidCSS3.css`（在光盘上可用），以及一个\
  \ HTML `div` 元素（其 `id` 属性值为 `outer`），作为另外四个 HTML `div` 元素的“容器”。\n\n![image](img/cd.jpg)\
  \ CSS 样式表 `AndroidCSS3.css` 包含一个用于为 `id` 值为 `outer` 的 HTML `div` 元素设置样式的 CSS 选择器，随后是四个选择器器\
  \ `11``22`````` `radial4` 列表 10.2 中对应的 HTML `div` 元素。这些选择器的内容应该非常熟悉（你可以回顾前面的章节中关于\
  \ CSS3 渐变的材料），因此我们在本节中不再涵盖它们的内容。\n\n### 列表 10.3: AndroidCSS3Activity.java\n\n```java\n\
  package com.iquarkt.css3;\n\nimport android.app.Activity;\nimport android.os.Bundle;\n\
  import android.webkit.WebChromeClient;\nimport android.webkit.WebSettings;\nimport\
  \ android.webkit.WebView;\nimport android.webkit.WebClient;\n\npublic class AndroidCSS3Activity\
  \ extends Activity\n{\n    /** 当 activity 首次创建时调用。 */\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState)\n    {   \n      super.onCreate(savedInstanceState);\n\
  \      setContentView(R.layout.main);\n      // 获取声明的 WebView 持有器的引用\n      WebView\
  \ webview = (WebView) this.findViewById(R.id.webview);\n      // 获取设置\n      WebSettings\
  \ webSettings = webview.getSettings();\n      // 启用 JavaScript 用于交互\n      webSettings.setJavaScriptEnabled(true);\n\
  \      // 使缩放控件可见\n      webSettings.setBuiltInZoomControls(true);\n      // 允许触摸选择/取消选择数据系列\n\
  \      webview.requestFocusFromTouch();\n      // 设置客户端\n      webview.setWebViewClient(new\
  \ WebViewClient());\n      webview.setWebChromeClient(new WebChromeClient());\n\
  \      // 加载 URL\n      webview.loadUrl(\"file:///android_asset/AndroidCSS3.html\"\
  );\n    }\n}\n```\n\n![image](img/fig10.1.jpg) **图 10.1** 带有 Android ICS 的 Asus\
  \ Prime 平板上基于 CSS3 的 3D 立体。\n\nListing 10.3 定义了一个扩展标准 Android `Activity` 类的 Java\
  \ 类 `AndroidCSS3Activity`。该类包含 `onCreate()` 方法，该方法“指向”XML 文档 `main.xml`（在 Listing\
  \ 10.2 中显示），以便我们可以通过 `R.id.webview` 获取其 `WebView` 子元素的引用（这是 Listing 10.2 中 `WebView`\
  \ 元素的引用），所示：\n\n```\nWebView webview = (WebView) this.findViewById(R.id.webview);\n\
  ```\n\n接下来，`WebSettings` 类的 `webSettings` 实例允许我们设置各种属性，如 Listing 10.4 代码中的注释行所示。\n\
  \n最后一行代码加载了 HTML Web 页面 `AndroidCSS3.html`（位于 `assets/www` 子目录）的内容，所示：\n\n```java\n\
  webview.loadUrl(\"file:///android_asset/AndroidCSS3.html\");\n```\n\nFigure 10.1\
  \ 显示了带有 Android ICS 的 Asus Prime 平板上基于 CSS3 的 Android 应用程序。\n\n## SVG 与 Android\
