  \nRichard Clark, M.A. (@rdclark) 是一位丰富的软件开发人员和 Kaazing Corporation 的讲师。他曾在苹果和惠尔特公司任教，编写过沉浸式模拟程序，为财富\
  \ 100 强企业开发了多个高性能 Web 应用，并发布了 Apple iOS 应用。作为国际会议上受欢的演讲者，他对利用移动、连接、实时应用程序来帮助人们更好地生活、工作和娱乐有浓厚兴趣。在空余时间，Richard\
  \ 为非营利组织进行 Web 开发，打理种满加州本土植物的花园，并为家庭和慈善活动烹饪。\n\n# 第 1 章：jQuery 概念\n\n本章将向你介绍 `jQuery`\
  \ 并提供使用 `jQuery` API 操作 HTML5 Web 页面中元素的示例。`jQuery` 是一个极其流行的基于 JavaScript 的开源工具包，它在\
  \ JavaScript 之上提供了一层抽象。此外，`jQuery` 支持多个浏览器，简化了你 HTML Web 页面中的代码。\n\n`jQuery` 首页提供了源代码下载链接，以及文档、开发者资源和其他有用链接：\n\
  \n*[`jquery.org`](http://jquery.org)*\n\n`jQuery` 是一个开源 JavaScript 工具包，让你能够编写跨浏览器和跨平台的\
  \ JavaScript 代码来管理 HTML Web 页面中的元素，这包括查找、创建、更新和删除元素，还包括元素属性，以及添加或移除元素样式属性的能力。\n\n\
  `jQuery` 的一些重要且实特性（不分特定顺序）包括其对跨浏览器代码的支持、第三方 `jQuery` 插件、主题化组件、事件处理、AJAX 支持以及简单的\
  \ DOM 遍历。\n\n## 使用 jQuery 在页面中查找元素\n\n一个关键点是，`$` 前缀是 `jQuery` 的简写形式。这意味着以下两行代码是等价的：\n\
  \n```javascript\nvar pElements1 = $(\"p\");\nvar pElements2 = jQuery(\"p\");\n```\n\
  \n第三种选择是使用 `window.jQuery`，但这种用法不如使用 `$` 常见。\n\n## 带有 jQuery 的“Hello World”网页\n\n\
  本节中的示例查找了单个 `<p>` 元素并更改其文本。稍后你还将看到操作多个 `<p>` 元素的修改后的代码。\n\n列表 1.1 显示了 `HelloWorld1.html`\
  \ 的内容，展示了如何为包含单个 `<p>` 元素的 HTML 页面添加 jQuery 功能。\n\n![image](img/note.jpg) *列表 1.1\
  \ 包含 console.log()，它在 WebKit 浏览器中可用，但在其他浏览器中可能需要某些类型的插件或扩展才能使用。*\n\n***列表 1.1 HelloWorld1.html***\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>Hello World</title>\n<script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  >\n</script>\n<script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\">\n\
  </script>\n</head>\n<body>\n  <p id=\"Steve\">Hello World From a Paragraph</p>\n\
  \  <script>\n```\n\n\n\n\n```javascript\n$(document).ready(function(){\n  // get\
  \ the 'id' value\n  var pId = $(\"p\").attr(\"id\");\n  // get the text in the <p>\
  \ element\n  var pText = $(\"p\").text();\n  console.log (pId+\" says \"+pText);\n\
  \  // update the text in the <p> element\n  $(\"p\").text(\"Goodbye World From a\
  \ Paragraph\");\n  pText = $(\"p\").text();\n  console.log(pId+\" says \"+pText);\n\
  });\n```\n\n</script>\n\n</</body>\n</html>\n\n列表 1.1 使用此代码片段引用两个 jQuery 文件：\n\n\
  ```html\n<script src=\"http://code.jquery.com/jquery-2.0.0b1.js\">\n</script>\n\n\
  <script  src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\">\n</script>\n```\n\
  \n重要：HTML `<body>` 元素中的第一个 HTML `<script>` 元素以此行开始：\n\n```javascript\n$(document).ready(function(){\n\
  \  // do something here\n});\n```\n\n前面的结构确保了 DOM 已加载到内存中，因此可以安全访问和操作 DOM 元素。\n\n\
  记住，你可以使用 `$` 符号表示 jQuery，并可以使用 jQuery 的 `attr()` 函数获取 HTML 元素（例如 `<p>` 元素）的属性值。例如，你可以按照以下方式获取\
  \ HTML `<p>` 元素的 `id` 属性值：\n\n`var pId   = $(\"p\").attr('id');`\n\n你可以使用 jQuery\
  \ 的 `text()` 函数获取 HTML `<p>` 元素中的文本字符串，如下：\n\n```javascript\n// get the text in\
  \ the <p> element\nvar pText = $(\"p\").text();\nconsole.log (pId+' says '+pText);\n\
  ```\n\n最后，你可以使用相同的 `text()` 函数来更新 HTML `<p>` 元素中的文本，如下：\n\n```javascript\n// update\
  \ the text in the <p> element\n$(\"p\").text(\"Goodbye World From a Paragraph\"\
  );\n```\n\n在列表 1.1 中启动文件，并打开基于 WebKit 的浏览器中可用的检查器（Inspector）。接下来，选择“检查元素”（Inspect\
  \ Element），并点击网页底部的“>>”符号以查看列表 1.1 中两个 `console.log()` 语句的输出。请记住，使用 Web 检查器的具体步骤在\
  \ Chrome 和 Safari 中不同，该顺序可能在这两个浏览器的未来版本中发生变化。\n\n如果你还不知道，你可以使用 Chrome Web 检查器查看变量的内容，这对于调试非常有帮助。你可以尝试\
  \ Chrome Web 检查器的功能，还可以阅读有关这一优秀工具的在线教程。\n\n## 使用 jQuery 查询和修改 DOM\n\n本节将向你展示如何使用各种\
  \ jQuery 修饰符，这些修饰符可以非常方便地查找和更新 HTML5 网页中的元素。代码示例之所以短，是因为它们只说明了一个或两个选择符，但你可以组合它们来执行非常复杂的\
  \ DOM 遍历和对 DOM 元素进行上下文相关的修改。\n\n本节代码示例中讨论的一些选择器包括 `:first`、`:last`、`:even` 和 `:odd`。选择器的部分列表包括\
  \ `:eq()`、`:lt()`、`:gt()`、`:has()`、`:contains()` 和 `:eq()`。\n\n### 使用 :first 和 :last\
  \ 选择符查找和修改元素\n\n本节中的示例向你展示了如何使用 jQuery 的 `:first` 和 `:last` 选择符来操作 HTML 元素中的文本。\n\
  \n列表 1.2 显示 `JQModifyElements1.html` 的内容，说明了如何切换两个 `<p>` 元素的内容。\n\n***列表 1.2 JQModifyElements1.html***\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>jQuery and Modifying Elements</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  >\n  </script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  >\n  </script>\n</head>\n<body>\n  <p style=\"color:red\" id=\"Steve\">Hello From\
  \ Paragraph One</p>\n  <p style=\"color:blue\" id=\"Dave\">Goodbye From Paragraph\
  \ Two</p>\n  <script>\n    $(document).ready(function(){\n      // get information\
  \ in first paragraph:\n      var pId1   = $(\"p:first\").attr('id');\n      var\
  \ pText1 = $(\"p:first\").text();\n      // get information in last paragraph:\n\
  \      var pId2   = $(\"p:last\").attr('id');\n      var pText2 = $(\"p:last\").text();\n\
  \      $(\"p:first\").html(pText2);\n      $(\"p:last\").html(pText1);\n      //$(\"\
  p:first\").text(pText2);\n      //$(\"p:last\").text(pText1);\n    });\n  </script>\n\
  </body>\n</html>\n```\n\n列表 1.2 使用此代码片段引用两个 jQuery 文件：（由于上所述，为了简洁省略）\n\n`var pId1\
  \   = $(\"p:first\").attr('id');`\n\n`var pText1 = $(\"p:first\").text();`\n\n`var\
  \ pId2   = $(\"p:last\").attr('id');`\n\n`var pText2 = $(\"p:last\").text();`\n\n\
  `$(\"p:first\").html(pText2);`\n\n`$(\"p:last\").html(pText1);`\n\n`$(\"p\").text(\"\
  Goodbye World From a Paragraph\");`\n\n`$(\"#myInput\").val()`\n\n`$(\"#myInput\"\
  ).text(\"new value\");`\n\n图 1.1 显示了 `JQModifyElements1.html` 的结果。\n\n![image](img/fig1.jpg)\n\
  \n***图 1.1***\n\n下一节将向你展示如何使用 jQuery 选择符 `:even()` 和 `:odd()`。\n\n### 使用 :eq, :lt\
  \ 和 :gt 选择符查找元素\n\n有许多 jQuery 函数可以执行复杂的操作。本节包含一些实用的代码片段，说明了部分：\n\n`$('p:eq(3)').text('index\
  \ equals three');`\n\n`$('p:gt(3)').text('index is greater than three');`\n\n`$('p:lt(3)').text('index\
  \ is less than three');`\n\n### jQuery 中的属性与属性\n\n\n\n\n\n关于属性和元素的额外信息请此处：\n\n-\
  \ [`developer.mozilla.org/en-US/docs/DOM/element`](https://developer.mozilla.org/en-US/docs/DOM/element)\n\
  - [`stackoverflow.com/questions/5874652/prop-vs-attr`](http://stackoverflow.com/questions/5874652/prop-vs-attr)\n\
  \njQuery 为属性提供了 `.prop()` 方法，为属性提供了 jQuery `.attr()` 方法。遗憾的是，jQuery 文档对 `.prop()`\
  \ 方法和 `.attr()` 方法的描述是完全相同的：\n\n“获取匹配元素集合中第一个元素的属性值，或为每个匹配元素设置一个或多个属性。”\n\n然而，好消息在以下述述中：\n\
  \n“为了保持向后兼容 [sic]，jQuery 1.6.1+ 中的 `.attr()` 方法将为您检索并更新该属性，因此不需要将布尔属性的代码更改为 `.prop()`。”\n\
  \n最安全的方法是对原始值（如布尔值或单值字符串）使用 jQuery 的 `.attr()` 方法，并对多值字符串（如“style”）使用 jQuery 的 `.prop()`\
  \ 方法。考虑到这一点，下一节将向你展示如何在 jQuery 中处理属性。\n\n### 查找和设置元素属性\n\n你已经看到过如何使用各种 jQuery 函数来操作元素，以及如何查找属性值。本节包含了更新元素属性的示例。\n\
  \n以下代码段获取元素 `src` 属性的值：\n\n```javascript\nvar $source = $(\"img\").attr(\"src\"\
  );\n```\n\n下一段代码显示了如何设置一个属性的值：\n\n```javascript\n$(\"img\").attr(\"src\", \"/images/MyHouse.jpg\"\
  );\n```\n\n以下代码段显示了如何在一个命令中设置多个属性（为了方便起分行显示）：\n\n```javascript\n$(\"img\").attr({\n\
  \    src: \"/images/MyHouse.jpg\",\n    title: \"House\",\n    alt: \"House\"\n\
  });\n```\n\n前一个代码段将属性 `src`、`title` 和 `alt` 的值设置为它们各自的值。\n\n注意，jQuery `attr()` 方法的语法与\
  \ jQuery `css()` 方法非常相似，因此当你理解其中一个函数时，也会理解另一个。\n\n### 使用自定义属性\n\nHTML5 支持自定义属性，前提是属性名称以字符串\
  \ `data-` 开头，后跟属性名称。虽然你现在可能不需要使用自定义属性，但 jQuery Mobile 高度依赖自定义属性，因此此功能非常有用。\n\n你可以使用\
  \ jQuery 的 `.data()` 方法获取自定义属性的值。例如，假设你的 HTML 页面包含以下代码段：\n\n```html\n<div data-role=\"\
  page\" data-value=\"99\" data-status=\"new\"></div>\n```\n\n你可以按照以下方式获取这些自定义属性的值：\n\
  \n`$(\"div\").data(\"role\")` 返回值 page\n`$(\"div\").data(\"value\")` 返回值 99\n`$(\"\
  div\").data(\"status\")` 返回值 true\n\n你将在 jQuery Mobile 代码示例中看到更多操作自定义数据属性的示例，如果你真的很有野心，可以在\
  \ jQuery Mobile 源码中找到更多示例。\n\n### 使用 jQuery 移除元素\n\n正如你可能猜到的，jQuery 除了允许你查找和修改 HTML\
  \ 页面中的元素外，还能移除元素。列表 1.3 包含了 HTML 页面 `JQRemovingElements1.html` 的，说明了如何通过 jQuery\
  \ 移除元素。\n\n**列表 1.3 JQRemovingElements1.html**\n\n```html\n<script>\n  $(document).ready(function(){\n\
  \    // 移除 <p> 元素 Dave\n    $(\"#Dave\").remove();\n    // 移除 <p> 元素 Michelle\n\
  \    $(\"div1\").remove(\"#Michelle\");\n    // 移除包含 \"Goodbye\" 的 <p> 元素\n    $(\"\
  p\").filter(\":contains('Goodbye')\").remove();\n  });\n</script>\n```\n\n列表 1.3\
  \ 包含三行移除元素的代码，第一行所示（第二行类似）：\n\n```javascript\n// 移除 <p> 元素 Dave\n$(\"#Dave\").remove();\n\
  ```\n\n虽然前一个代码段的操作正如你预期的那样，但下面的代码段展示了 jQuery 的真实威力，它使用 jQuery 的 `filter()` 方法查找并移除所有包含字符串\
  \ Goodbye 的 HTML `<p>` 元素：\n\n```javascript\n$(\"p\").filter(\":contains('Goodbye')\"\
  ).remove();\n```\n\n将上述单行 jQuery 代码的简单直观性，与实现相同功能所需的相应 JavaScript 代码进行对比。\n\n![image](img/fig1.2.jpg)\n\
  \n**图 1.2** 在 iPad3 上使用 jQuery 移除元素。\n\n图 1.2 显示了从运行在 iPad3 上的 iOS 应用拍摄的竖屏截图中渲染\
  \ `RemovingElements1.html` 的结果。\n\n### 创建 DOM 元素\n\njQuery 提供了 `clone()` 方法和 `append()`\
  \ 方法来创建新的 DOM 元素。`clone()` 方法创建一个元素的真实副本。相反，`append()` 方法在指定的元素上操作。列表 1.4 显示了 `JQCreatingElements1.html`\
  \ 的内容，说明了如何使用这两个 jQuery 方法在 HTML 页面中创建新元素。\n\n**列表 1.4 JQCreatingElements1.html**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n  <script>\n    $(document).ready(function(){\n\
  \      // 将 Dave 元素的副本添加到 #div2：\n      $(\"#Dave\").clone().css({color:\"#000\"\
  }).appendTo(\"#div2\");\n      // 将另一个 Dave 元素的副本添加到 #div2：\n      $(\"#Dave\").clone().css({color:\"\
  #000\"})\n      .appendTo(\"#div2\");\n      // 将 Dave 移动到 #div4 的末尾：\n      $(\"\
  #Dave\").appendTo(\"#div4\");\n      // 在所有 'div' 元素之前添加 Dave：\n      $(\"#Dave\"\
  ).clone().prependTo(\"div\");\n    });\n  </script>\n</body>\n</html>\n```\n\n列表\
  \ 1.3 引入了 `clone()` 方法，其示例所示：\n\n```javascript\n$(\"#Dave\").clone().css({color:\"\
  #000\"}).appendTo(\"#div2\");\n```\n\n上述代码段的目的显而易见，你甚至可以从左到右读取它：克隆 id 为 Dave 的元素，将其颜色设置为黑色，并将此副本添加到\
  \ id 为 div 的元素中。\n\n1.3 中的另一个新功能是 jQuery 的 `prependTo()` 函数，它将元素插入到指定元素之前（而不是之后），所示：\n\
  \n```javascript\n$(\"#Dave\").prependTo(\"div\");\n```\n\n记住的另一个点：`clone(true)`\
  \ 还会传播元素的事件处理器。还有其他插入 DOM 元素的 jQuery 方法，其中一些将在后面的章节描述。\n\n图 1.3 显示了从运行在 iPad3 上的\
  \ iOS 应用拍摄的横屏截图中渲染 `JQCreatingElements1.html` 的结果。\n\n![image](img/fig1.3.jpg)\n\
  \n**图 1.3** 在 iPad3 上使用 jQuery 创建元素。\n\n### jQuery append() 和 appendTo() 方法\n\n\
  jQuery 文档对这两个方法提供了简洁明了的解释：\n\n“`.append()` 和 `.appendTo()` 方法执行相同的任务。主要的区别在于语法——具体来说是内容和目标的位置。对于\
  \ `.append()`，方法之前的选择器表达式是插入内容的容器。另一方面，对于 `.appendTo()`，内容位于方法之前（无论是作为选择器表达式还是即时创建的标记），并被插入目标容器中。”\n\
  \n也许这个非正式的解释可以澄清这种差异：\n\n`{select-something-here}.append(and-append-stuff-from-here)`\n\
  \n`{specify-stuff-here}.appendTo(and-append-that-stuff-here)`\n\n\n\n\n\n本章包含了使用这些方法的代码示例，以便你能够记住这两个\
  \ jQuery 方法之间的区别。\n\n## 实用的 jQuery 代码块\n\n本节包含了一组代码片段，允许你执行条件逻辑，然后执行你的自定义代码。本节中的代码示例非常直观，并且注释解释了它们的用途。\n\
  \n检查 jQuery 是否已加载：\n\n```javascript\nif (typeof jQuery == 'undefined') {\n   //\
  \ jQuery 未加载\n}\n```\n\n检查元素是否存在：\n\n```javascript\nif ( $('#myElement').length\
  \ > 0 ) {\n   // 元素存在\n}\n```\n\n注意，前一个代码片段中的 `>` 符号在“真值（truthy）”风格的编程中通常会被省略，但在代码中保持显式写法是比较好的。\n\
  \n检查空元素：\n\n```javascript\n$('*').each(function() {\n    if ($(this).text() == \"\
  \") {\n        //在此处执行某些操作\n    }   \n});\n```\n\n根据 `<div>` 元素的内容返回 true 或 false：\n\
  \n```javascript\nvar emptyTest = $('#myDiv').is(':empty');\n```\n\n确定复选框是否勾选（返回\
  \ true/false）：\n\n```javascript\n$('#checkBox').attr('checked');\n```\n\n查找所有已选的复选框：\n\
  \n```javascript\n$('input[type=checkbox]:checked');\n```\n\n禁用/启用按钮元素的输入框：\n\n```javascript\n\
  $(\"#submit-button\").attr(\"disabled\", true);\n```\n\n从按钮元素中移除属性：\n\n```javascript\n\
  $(\"#submit-button\").removeAttr(\"disabled\");\n```\n\n上述代码片段让你了解了检查各种条件的紧凑方式。随着你对\
  \ jQuery 越来越熟练，你将开发出属于自己的有用代码片段。\n\n现在，让我们来看另一类重要的 jQuery 函数，它们允许你在 DOM 之间进行导航，其中一些内容将在下一节中讨论。\n\
  \n## 在 jQuery 中处理点击事件\n\njQuery 支持各种类型的事件和用户手势，你可以将它们“绑定”到（你编写的）自定义代码上，每当这些事件或手势发生时，代码就会执行。在\
  \ jQuery Mobile 中可以检测并绑定的事件将在 jQuery Mobile 章节中讨论。\n\n`click()` 函数允许你使用以下语法处理点击事件：\n\
  \n```javascript\n$(\"#button1\").click(function() {\n      // 执行某些操作\n}\n```\n\n\
  处理事件有多种技术，这里展示了推荐的技巧：\n\n```javascript\n$(\"#button1\").on(\"click\"), function()\
  \ {\n      // 执行某些操作\n}\n```\n\n`dblclick()` 函数允许你处理双击事件，其语法示例在此：\n\n```javascript\n\
  \    $(\"#button2\").dblclick(function() {\n      // 执行某些操作\n    }\n```\n\n顺便提到，`focus()`\
  \ 函数为选定的元素提供焦点。虽然这里没有涵盖，但你可以通过查阅在线文档获取更多信息。\n\n列表 1.5 显示了 `JQClickDivs1.html` 的大部分内容，它说明了如何检测点击事件，然后更新此\
  \ HTML5 Web 页面中两个 `<div>` 元素的内容。\n\n***列表 1.5 JQClickDivs1.html***\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n   <meta charset=\"utf-8\" />\n   <title>使用\
  \ jQuery 检测点击事件</title>\n   <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  >\n    </script>\n   <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  >\n    </script>\n</head>\n<body>\n   <div id=\"div1\">第一个 div 元素 </div>\n   <div\
  \ id=\"div2\">第二个 div 元素 </div>\n   <script>\n    var click1=0, click2=0, total=0;\n\
  \    $(document).ready(function() {\n        $(\"#div1\").click(function() {\n \
  \         ++click1;\n          ++total;\n          $(this).text(\"Clicked: \"+click1+\"\
  \ total: \"+total);\n          $(\"#div2\").text(\"Clicked: \"+click2+\" total:\
  \ \"+total);\n      });\n      $(\"#div2\").click(function() {\n          ++click2;\n\
  \          ++total;\n          $(this).text(\"Clicked: \"+click2+\" total: \"+total);\n\
  \          $(\"#div1\").text(\"Clicked: \"+click1+\" total: \"+total);\n      });\n\
  \    });\n  </script>\n</body>\n</html>\n```\n\n列表 1.5 引用了所需的 jQuery 文件，紧接着是一些 CSS\
  \ 样式定义以及两个 HTML `<div>` 元素。这里显示了为第一个 HTML `<div>` 元素添加点击事件监听器的代码（对于第二个 HTML `<div>`\
  \ 元素使用了类似的 jQuery 代码）：\n\n```javascript\n$(\"#div1\").click(function() {\n     \
  \ ++click1;\n      ++total;\n      $(this).text(\"Clicked: \"+click1+\" total: \"\
  +total);\n      $(\"#div2\").text(\"Clicked: \"+click2+\" total: \"+total);\n});\n\
  ```\n\n每当用户点击上述 HTML `<div>` 元素时，它的点击计数和总点击计数都会加 1，并且两个 HTML `<div>` 元素的文本都会更新为对应单个\
  \ `<div>` 元素的点击次数以及总和。\n\n列表 1.5 引用了所需的 jQuery 文件，紧接着是一些 CSS 样式定义以及两个 HTML `<div>`\
  \ 元素。这里显示了为第一个 HTML `<div>` 元素添加点击事件监听器的代码（对于第二个 HTML `<div>` 元素使用了类似的 jQuery 代码）：\n\
  \n```javascript\n$(\"#div1\").click(function() {\n      ++click1;\n      ++total;\n\
  \      $(this).text(\"Clicked: \"+click1+\" total: \"+total);\n      $(\"#div2\"\
  ).text(\"Clicked: \"+click2+\" total: \"+total);\n});\n```\n\n每当用户点击上述 HTML `<div>`\
  \ 元素时，它的点击计数和总点击计数都会加 1，并且两个 HTML `<div>` 元素的文本都会更新为对应单个 `<div>` 元素的点击次数以及总和。\n\n\
  列表 1.5 引用了所需的 jQuery 文件，紧接着是一些 CSS 样式定义以及两个 HTML `<div>` 元素。这里显示了为第一个 HTML `<div>`\
  \ 元素添加点击事件监听器的代码（对于第二个 HTML `<div>` 元素使用了类似的 jQuery 代码）：\n\n```javascript\n$(\"\
  #div1\").click(function() {\n      ++click1;\n      ++total;\n      $(this).text(\"\
  Clicked: \"+click1+\" total: \"+total);\n      $(\"#div2\").text(\"Clicked: \"+click2+\"\
  \ total: \"+total);\n});\n```\n\n*(注：由于提供的原文中存在大量重复段落，翻译已根据“不要重复输出原文”的原则进行了去重处理，确保逻辑连贯且不冗余。)*\n\
  \n\n\n\n\n关于 jQuery 最新版本的更多信息可以参阅本书的序言。\n\n## jQuery 函数链式调用 (#toc.html_toc-h1-0005)\n\
  \n你已经看到过 jQuery 命令链式调用的示例，可能在 Java 中也用过链式命令（特别是使用 JAXB 时），如下：\n\n```\nmyList().getFirstElem().getCustomer().setFirstName(\"\
  Dave\");\n```\n\njQuery 链式调用支持比上述代码段更复杂的操作。默认情况下，jQuery 会引用链中的第一个元素，但你可以更改默认行为。例如，你可以指示\
  \ jQuery 使用 `.parent()` 方法引用当前元素，执行某些操作，然后使用 jQuery 的 `.end()` 方法再次引用链中的第一个元素。\n\
  \n这里有一个很好的示例，说明了上一段落中讨论的信息：\n\n[`blog.pengoworks.com/index.cfm/2007/10/26/jQuery-Understanding-the-chain`](http://blog.pengoworks.com/index.cfm/2007/10/26/jQuery-Understanding-the-chain)\n\
  \n请记住以下几点事项：在更改方法链中的默认行为时要格外小心，因为实际行为可能并不是你代码中预期的行为。此外，确保对此类代码进行清晰说明，以免困扰那些比你对 jQuery\
  \ 了解少的人。\n\n## 使用 jQuery 获取加速度计值 (#toc.html_toc-h1-0006)\n\n本节的示例说明了你如何使用 jQuery\
  \ 获取移动设备的加速度计值。\n\n![image](img/cd.jpg)列表 1.6 显示了 `JQAccelerometer1.html` 的内容，它展示了当移动设备在任何方向发生加速时，如何显示加速度计的数值。CSS\
  \ 样式表 `JQAccelerometer1.css` 包含了此处未显示的简单选择器，但你可以在 CD 上找到完整的列表。\n\n***列表 1.6 JQAccelerometer1.html***\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n <meta charset=\"utf-8\"\
  >\n <title>jQuery and Accelerometer</title>\n   <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n   <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  \   <script>\n     var colorX = \"\", colorY = \"\", colorZ = \"\";\n     var intx\
  \ = 0, inty = 0, intz = 0;\n     var colors = ['#f00', '#ff0', '#00f'];\n     $('document').ready(function(){\n\
  \       $(window).bind(\"devicotion\", function(e){\n         var accelEvent = e.originalEvent,\n\
  \             acceler = accelEvent.accelerationIncludingGravity,\n             x\
  \ = acceler.x, y = acceler.y, z = acceler.z;\n       if(x < 0)      { intx = 0;\
  \ }\n       else if(x < 1) { intx = 1; }\n       else             { intx = 2; }\n\
  \       if(y < 0)      { inty = 0; }\n       else if(y < 1) { inty = 1; }\n    \
  \   else             { inty = 2; }\n       if(z < 0)      { intz = 0; }\n      \
  \ else if(z < 1) { intz = 1; }\n       else             { intz = 2; }\n       colorX\
  \ = colors[x];\n       colorY = colors[y];\n       colorZ = colors[z];\n       $(\"\
  #valueX\").css(\"backgroundColor\", colorX);\n       $(\"#valueY\").css(\"backgroundColor\"\
  , colorY);\n       $(\"#valueZ\").css(\"backgroundColor\", colorZ);\n       $(\"\
  #valueX\").html(\"<p>Acceleration x: <b>\" + x + \"</body></p>\");\n       $(\"\
  #valueY\").html(\"<p>Acceleration y: <b>\" + x + \"</body></p>\");\n       $(\"\
  #valueZ\").html(\"<p>Acceleration z: <b>\" + x + \"</body></p>\");\n       });\n\
  \     });\n   </script>\n</head>\n<body>\n  <h2>Accelerometer Values</h2>\n  <div\
  \ id=\"outer\">\n   <div id=\"valueX\"></div\n   <div id=\"valueY\"></div\n   <div\
  \ id=\"valueZ\"></div>\n  </div>\n</body>\n</html>\n```\n\n列表 1.6 中的代码获取移动设备三个方向（相互相互垂直）的加速度计值，然后执行一些算术计算，以计算出整数值作为颜色值数组的索引。在确定每个方向的颜色后，相关的\
  \ `div` 元素将更新为相应的颜色。\n\n在将 `window` 对象绑定到 `devicotion` 事件后，我们可以使用事件对象（在此情况下称为 `e`）来获取加速度对象的\
  \ JavaScript 引用（称为 `acceler`）。然后我们可以提取三个不同轴的当前值，如下：\n\n```javascript\n$('document').ready(function(){\n\
  \  $(window).bind(\"devicotion\", function(e){\n    var accelEvent = e.originalEvent,\n\
  \        acceler = accelEvent.accelerationIncludingGravity,\n        x = acceler.x,\
  \ y = acceler.y, z = acceler.z;\n```\n\n为了简单起见，颜色数组仅包含三种颜色，以下代码计算 0 到 2 之间的数字，以确定方向的颜色：\n\
  \n```javascript\nif(x < 0)      { intx = 0; }\nelse if(x < 1) { intx = 1; }\nelse\
  \             { intx = 2; }\n```\n\nx 方向的颜色计算如下：\n\n```javascript\ncolorX = colors[x];\n\
  ```\n\n与 x 方向相关的 `div` 元素将更新为相应的背景颜色：\n\n```javascript\n$(\"#valueX\").css(\"backgroundColor\"\
  , colorX);\n```\n\n最后，使用以下代码显示 x 方向的当前值：\n\n```javascript\n$(\"#valueX\").html(\"\
  <p>Acceleration x: <b>\" + x + \"</body></p>\");\n```\n\ny 方向和 z 方向的相应值以类似的方式计算。\n\
  \n图 1.5 显示了列表 1.5 中 HTML 页面的渲染结果，这是从运行 Asus 平板上的 Android 应用截取的横屏截图。\n\n![image](img/fig1.5.jpg)\n\
  \n***图 1.5***在 Asus 平板上的加速度计\n\n## 总结 (#toc.html_h1-0007)\n\n本章介绍了 jQuery，并提供了代码示例展示了如何使用\
  \ jQuery 函数操作 HTML 页面。你通过示例了解了如何：\n\n* 创建一个基于 jQuery 的 HTML5 页面\n* 使用 `:first` 和\
  \ `:last` 选择器查找元素\n* 使用 `:even` 和 `:odd` 选择器查找元素\n* 使用 `:eq`、`:lt` 和 `:gt` 选择器查找元素\n\
  * 通过类或 ID 查找元素\n* 获取/设置属性\n* 查找表单元素及其属性\n* 用于查找元素的 CSS3 表达式\n* 删除 DOM 元素\n* 创建 DOM\
  \ 元素\n* 处理事件\n* 使用 `click()` 函数\n* jQuery 函数链式调用\n* 使用 jQuery 获取加速度计\n\n\n\n\n本章的第一部分包含代码示例，展示了如何创建阴影效果、如何渲染圆角矩形，以及如何使用线性渐变和径向渐变。本章的第二部分涵盖\
  \ CSS3 变换（缩放、旋转、倾斜和平移），以及演示如何将变换应用于 HTML 元素和 JPG 文件的代码示例。\n\n本章的第三部分涵盖 CSS3 2D 图形，例如线性渐变、径向渐变和\
  \ CSS3 变换。\n\n你可以在桌面或笔记本电脑上基于 Webkit 的浏览器中运行本章的代码示例。你也可以在移动设备上查看它们，前提是你运行的浏览器支持代码示例中所使用的\
  \ CSS3 功能。为了方便起见，本章中的许多代码示例都附带了在 Sprint Nexus S 4G 和 Asus Prime Android ICS 10 英寸平板上的运行截图（两者均运行\
  \ Android ICS 系统），这让你能够将这些截图与桌面和笔记本电脑上基于 Webkit 的浏览器渲染的相应图像进行对比。在第 10 章中，你将学习创建可以启动\
  \ HTML5 Web 页面的 Android 应用程序的过程。\n\n## CSS3 支持与 CSS3 属性的浏览器前缀\n\n在我们深入研究 CSS3 细节之前，关于为\
  \ HTML 页面定义基于 CSS3 的选择器，有两个需要了解的重要细节。首先，你需要了解不同浏览器中可用的 CSS3 功能。确定 CSS3 功能浏览器支持的最佳网站之一是：\n\
  \n*[`caniuse.com/`](http://caniuse.com/)\n\n上述链接包含了关于 IE、Firefox、Safari、Chrome、Opera\
  \ 以及若干移动浏览器的 CSS3 支持情况的表格化信息。\n\n另一个检查 CSS3 功能支持的非常有用的工具是 Enhance.js。它通过测试浏览器来确定它们是否支持某一组核心的\
  \ CSS 和 JavaScript 属性，然后为那些满足测试的浏览器提供相应的功能。你可以在这里下载 Enhance.js：\n\n*[`github.com/filamentgroup/EnhanceJS`](https://github.com/filamentgroup/EnhanceJS)\n\
  \n第三个实用工具是 Modernizr，它用于检查各种浏览器中与 HTML5 功能的功能，其主页在此处：\n\n*[`www.modernizr.com/`](http://www.modernizr.com/)\n\
  \n在某个时刻，你会在 HTML5 Web 页中使用 JavaScript（事实上，你可能已经在使用了），而 Modernizr 提供了一种编程方式来检查不同浏览器中的许多\
  \ HTML5 和 CSS3 功能。\n\n为了使用 Modernizr，请在 Web 页面的 `<head>` 元素包含以下代码段：\n\n```\n<script\
  \ src=\"modernizr.min.js\" type=\"text/javascript\"></script>\n```\n\n导航到 Modernizr\
  \ 主页，你可以在那里阅读有关该功能检测集的文档、教程和详细信息。\n\n你需要了解的第二个细节是，许多 CSS3 属性目前需要浏览器特定的前缀才能正常工作。该前缀适用于各个浏览器的“进行中”特性，而最终规范将舍弃浏览器特定的前缀。`-ie-`、`-moz-`\
  \ 和 `-o-` 分别对应 Internet Explorer、Firefox 和 Opera。请注意，Opera 也支持 `-webkit-` 前缀，其他浏览器也可能这样做（请查看各自的网站以获取更新）。\n\
  \n作为示例，下面的代码块展示了这些前缀的示例：\n\n```\n-ie-webkit-border-radius: 8px;\n-moz-webkit-border-radius:\
  \ 8px;\n-o-webkit-border-radius: 8px;\nborder-radius: 8px;\n```\n\n在你的 CSS 选择器中，在“通用”属性之前指定带有浏览器特定前缀的属性，通用属性在浏览器特定属性未被选中时作为默认选择。书中的\
  \ CSS3 代码示例包含 WebKit 特有的前缀，这有助于我们保持 CSS 样式表的大小易于管理。如果你需要能够在多个浏览器（包括当前版本以及旧版本）运行的\
  \ CSS 样式表，基本上有两种方案。一种方案是手动添加带有所有所需浏览器特定前缀的 CSS3 代码，这可能非常麻烦且容易出错。另一种方案是使用 CSS 工具包或框架（将在下一章讨论），它们可以通过编程方式生成包含所有浏览器特定前缀的\
  \ CSS3 代码。\n\n最后，这里有一份带有浏览器前缀的 CSS 属性详细列表：\n\n*[`peter.sh/experiments/vendor-prefixed-css-property-overview/`](http://peter.sh/experiments/vendor-prefixed-css-property-overview/)\n\
  \n这里有一份无前缀 CSS 属性的详细列表：\n\n*[`www.blooberry.com/indexdot/css/propindex/all.htm`](http://www.blooberry.com/indexdot/css/propindex/all.htm)\n\
  \n## CSS3 功能快速概览\n\nCSS3 采用模块化方法，涉及多个子规范，以扩展现有的 CSS2 功能并支持新功能。因此，CSS3 在逻辑上可以分为以下几类：\n\
  \n*   背景/边框\n*   颜色\n*   媒体查询\n*   多列布局\n*   选择器\n\n通过 CSS3，你可以创建带有圆角和阴影效果的框；使用线性渐变和径向渐变创建丰富的图形效果；检测竖屏和横屏；使用媒体查询选择器检测移动设备类型；以及生成多列文本渲染和格式。\n\
  \n此外，CSS3 还允许你使用伪类（在下一节描述）定义复杂的选择规则、`:first-child`、`:last-type` 以及基于属性的模式匹配。\n\n\
  ## CSS3 伪类与属性选择\n\n本节简要包含了伪类的示例，随后展示了如何根据属性中的字符串来选择元素。\n\n记住，CSS 中的 `class` 属性提供了一种为一组元素标记的方法，例如下面的代码段：\n\
  \n```\n<p class=\"details\">\n```\n\n另一方面，伪类允许你通过元素拥有的某些特征引用任意组。例如，下面的代码段选取每个 `<section>`\
  \ 元素中的段落：\n\n```\nsection:p:first-of-type\n```\n\nCSS3 支持极其丰富的伪类集，包括 `nth-child()`\
  \ 以及它的一些语义“变体”，如 `nth-of-type()`、`nth-first-of-type()`、`nth-last-of-type()` 和 `nth-last-child()`。\n\
  \nCSS3 还支持布尔选择器（也是伪类），例如 `empty`、`enabled`、`disabled` 和 `checked`，这些表单元素非常有用。另一个伪类是\
  \ `not()`，它返回不符合选择标准的元素。\n\n尽管本节关注 `:nth-child()` 伪类，但你将熟悉各种其他的 CSS3 伪类。\n\n###\
  \ CSS3 伪类\n\nCSS3 `:nth-child()` 伪类既强大又实用，其格式如下：\n\n```\n:nth-child(在此处插入关键字或线性表达式)\n\
  ```\n\n下面的列表提供了使用 `nth-child()` 伪类的各种示例，用以匹配 HTML `<div>` 元素子元素的不同子（该元素也可以被其他 HTML\
  \ 元素替换）：\n\n*   `div:nth-child(1)`：匹配第一个子元素\n\n\n\n\n\n`div:nth-child(2)` 匹配第二个子元素。\n\
  \n`div:nth-child(:even)` 匹配偶数子元素。\n\n`div:nth-child(:odd)` 匹配奇数子元素。\n\n`nth-child()`\
  \ 伪类的有趣且强大之处在于它支持形如 `an+b` 的线性表达式，其中 `a` 是正整数，而 `b` 是非负整数，如下所示（使用一个 HTML5 的 `<div>`\
  \ 元素）：\n\n`div:nth-child(3n)` 匹配从位置 0 开始的每第三个子元素。\n\n`div:nth-child(3n+1)` 匹配从位置\
  \ 1 开始的每第三个子元素。\n\n`div:nth-child(3n+2)` 匹配从位置 2 开始的每第三个子元素。\n\n另一个非常有用的伪类涉及 `:hover`，它可以轻松创建美观的视觉效果。以下\
  \ CSS3 `:hover` 伪类的示例展示了当用户用鼠标悬停在关联元素上时，改变 `id` 属性值为 `text1` 的元素的字体大小：\n\n```css\n\
  #text1:hover {\n  font-size: 12pt;\n}\n```\n\n## CSS3 属性选择\n\n你可以指定 CSS3 选择器来选择\
  \ HTML 元素，还可以使用各种正则表达式根据 HTML 元素属性的值来选择 HTML 元素。例如，以下选择器选择 `src` 属性以文本字符串 `Laurie`\
  \ 开头的 `img` 元素，并将所选 `img` 元素的 `width` 属性和 `height` 属性设置为 `100px`：\n\n```css\nimg[src^=\"\
  Laurie\"] {\n  width: 100px; height: 100px;\n}\n```\n\n当你想要根据图片的名称（Laurie, Shelly,\
  \ Steve 等）为图片设置不同的尺寸时，上述 CSS3 选择器非常有用。以下 HTML `<img>` 元素不匹配前述的选择器：\n\n```html\n\
  <img src=\"3Laurie\" width=\"200\" height=\"200\" />\n<img src=\"3Laurrie\" width=\"\
  200\" height=\"200\" />\n```\n\nCSS3 使用元字符 `^`、`$` 和 `*`（后跟 `=` 符号）来匹配文本字符串的起始、终止或任意位置。如果你熟悉\
  \ Unix 实用程序 `grep` 和 `sed` 以及 `vi`编辑器，那么这些元字符对你来说非常熟悉。然而，CSS3 对元字符的使用施加了限制：它们只能在属性匹配的上下文中使用（使用方括号）。\n\
  \n以下选择器选择 `src` 属性以文本字符串 `jpeg` 结尾的 HTML `img` 元素，并将所选 `img` 元素的 `width` 属性和 `height`\
  \ 属性设置为 `150px`：\n\n```css\nimg[src$=\"jpeg\"] {\n  width: 150px; height: 150px;\n\
  }\n```\n\n当你想要根据图片的类型（jpg, png, jpeg 等）为图片设置不同的尺寸时，上述 CSS3 选择器非常有用。\n\n以下选择器选择 `src`\
  \ 属性包含文本字符串 `baby` 任意出现的 HTML `img` 元素，并将所选 HTML `img` 元素的 `width` 属性和 `height`\
  \ 属性设置为 `200px`：\n\n```css\nimg[src*=\"baby\"] {\n  width: 200px; height: 200px;\n\
  }\n```\n\n当你想要根据图片的“分类”（mybaby, yourbaby, babygirl, babyboy 等）为图片设置不同的尺寸时，上述 CSS3\
  \ 选择器非常有用。\n\n如果你想了解更多关于可以在 CSS3 选择器中使用的模式（及其描述），可以在此处查看详尽的列表：\n\n*http://www.w3.org/TR/css3-selectors*\n\
  \n本章的第一部分到此结束，下一节将深入探讨 CSS3 面向图形的效果，例如圆角和阴影效果。\n\n## CSS3 阴影效果和圆角\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3\
  \ 还能让你轻松渲染带有圆角的矩形，因此你不需要 `JPG` 文件即可创建这种效果。\n\n### 使用 RGB 和 HSL 指定颜色\n\n在我们深入研究 CSS3\
  \ 有趣的功能之前，你需要知道如何表示颜色。一种方法是使用 `(R, G, B)` 三元组，它们代表颜色的红、绿、蓝分量。例如，三元组 `(255, 0, 0)`、`(255,\
  \ 255, 0)` 和 `(0, 0, 255)` 分别代表红色、黄色和蓝色。指定颜色的其他方法包括：十六进制三元组 `(F, 0, 0)` 和 `(FF,\
  \ 0, 0)`；十进制三元组 `(100%, 0%, 0)` 或字符串 `#F00`。你也可以使用 `(R, G, B, A)`，其中第四个分量指定透明度，这是一个\
  \ 00（透明）到 1（不透明）之间的小数。\n\n然而，还有颜色的 HSL（色相、饱和度和亮度）表示法，其中第一个分量是 0 到 360 之间的角度（0 度是北），另外两个分量是\
  \ 0 到 100 之间的百分比。例如，`(0, 100%, 50%)`、`(120, 100%, 50%)` 和 `(240, 100%, 50%)` 分别代表红色、绿色和蓝色。第一个分量\
  \ `(R, G, B, A)` 中的第四个分量指定透明度，这是一个 0（透明）到 1（不透明）之间的小数。\n\n#### CSS3 阴影效果\n\nCSS3\
  \ 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3 还能让你轻松渲染带有圆角的矩形，因此你不需要 `JPG` 文件即可创建这种效果。\n\
  \n### 使用 RGB 和 HSL 指定颜色\n\n在我们深入研究 CSS3 有趣的功能之前，你需要知道如何表示颜色。一种方法是使用 `(R, G, B)`\
