  \ 上 Chrome 浏览器中的组合框。\n\n## 日期选择器 (Date Pickers)\n\njQuery 支持“日期选择器”，允许你设置过去、现在和未来的日期，并能够以相关上下文的方式修改这些日期。\n\
  \n列表 4.6 显示了 HTML5 页面 `JDatePicker.html` 的内容，展示了如何在 HTML 页面中渲染日期选择器组件。省略了 CSS 表表\
  \ `JDatePicker.css`，因为它的内容与列表 4.2 相同。\n\n### 列表 4.6 JDatePicker.html\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>日期选择器</title>\n\
  \  <script src=\"http://code.jquery.com/jquery-ui-1.8.4.min.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n\
  \  <style>\n    #input1, #input2, #input3 {\n      width: 150px;\n      height:\
  \ 50px;\n      float: left;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"outer\"\
  >\n    <div id=\"input1\">\n      上周：\n      <input type=\"text\" name=\"date\"\
  \ id=\"date1\" />\n    </div>\n    <div id=\"input2\">\n      今天的日期：\n      <input\
  \ type=\"text\" name=\"date\" id=\"date2\" />\n    </div>\n    <div id=\"input3\"\
  >\n      未来的日期：\n      <input type=\"text\" name=\"date\" id=\"date3\" />\n    </div>\n\
  \  </div>\n  <script>\n    $(document).ready(function() {\n      // 设置日期为上周\n  \
  \    var defaultDate1 = $(\"#date1\").datepicker(\"option\", \"defaultDate\");\n\
  \      $(\"#date1\").datepicker( \"option\", \"defaultDate\", -7 );\n      // 设置日期为今天\n\
  \      var defaultDate2 = $(\"#date1\").datepicker(\"option\", \"defaultDate\");\n\
  \      $(\"#date2\").datepicker(\"option\", \"defaultDate\", +0 );\n      // 设置日期为未来\n\
  \      var futureDate = \"07/07/2017\";\n      $(\"#date3\").datepicker(\"setDate\"\
  ,futureDate);\n    });\n  </script>\n</body>\n</html>\n```\n\n图 4.5 显示了在 Chrome\
  \ 浏览器中渲染列表 4.6 中 `JDatePicker.html` 的结果。\n\n![Figure 4.5](img/fig4.5.jpg) MacBook\
  \ 上 Chrome 浏览器中的日期选择器。\n\n## 进度条 (Progress Bars)\n\n你可以使用 jQuery 轻松创建和更新进度条。列表 4.7\
  \ 显示了 `JProgressBar.html` 的内容，并了如何在 HTML 页面中渲染进度条。\n\n### 列表 4.7 JProgressBar.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
