  \ checked=\"checked\">\n        <input type=\"radio\" name=\"radio\" value=\"radio2\"\
  >\n        <input type=\"radio\" name=\"radio\" value=\"radio3\">\n      </fieldset>\n\
  \    </div>\n  </div>\n  <script>\n    $(document).ready(function() {\n      var\
  \ divColors = new Array('#000', '#F0F', '#F00', '#0F0', '#00F', '#0FF');\n     \
