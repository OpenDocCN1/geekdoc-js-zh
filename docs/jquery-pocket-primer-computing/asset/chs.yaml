  \ 是一个用于获取用户地理位置信息的 jQuery 插件。你还将学习到 `jStorage` 和 `jStore` 这两个 jQuery 插件，它们在 `HTML5\
  \ Storage APIs` 之上提供了一层抽象。本章的最后部分提供了对 History APIs 的概览，这是一项 HTML5 技术，其 W3C 状态为 WD（工作草案）。\n\
  \n如果你有选择（也许是出于“奢侈”），那么在有更简单的替代方案时，你可能倾向于编码的便利性，而不是被冗长而乏味的代码示例所“困住”。例如，使用 `jQuery`\
  \ 实现 HTML5 拖放（DnD）的代码示例比直接调用现有 HTML5 DnD API 的代码示例要直观得多。\n\n简单代码示例的另一个优势是，它们能快速向你介绍许多\
  \ HTML5 技术，之后你将处于更好的位置来探索这些 HTML5 技术的细微差别。另一种场景是将 `jQuery Mobile` 与其他工具包结合，例如 `PhoneGap`（在第\
  \ 10 章 中讨论）或 `appMobi`（本书未讨论）。如 `PhoneGap` 等工具包提供了硬件功能支持；你也可以将 `PhoneGap` 与 `jQuery\
  \ Mobile` 结合。你的应用程序需求和限制将决定你为移动 Web 应用选择工具包（如果有）。\n\n通常，`jQuery` 和 `jQuery Mobile`\
  \ 可能与其他工具包配合，但你应该检查在线论坛以查看可能影响你 Web 应用的问题。最后，如果你不想使用 jQuery 插件，可以进行网络搜索，寻找在线教程，这些教程说明如何使用纯\
  \ HTML5 API 为书中涵盖的所有 HTML5 技术创建 HTML5 网页。\n\n## W3C 审核流程的阶段\n\n如果你不熟悉 W3C 流程的各个阶段，下面提供了以下简要描述（从早期阶段到最终阶段）。\n\
  \nWD（“Working Draft”，工作草案）文档是公开的标准的第一种形式。意见被广泛接受，但不保证会被采纳，且该文档可能与其最终形式有显著差异。\n\n\
  LC（“Last Call”，最后征求）状态涉及创建一个工作组对所有关于规范意见回复的公开记录。该阶段还处理有关规范的错误报告。顺便提一下，HTML5 于 2011\
  \ 年 5 月在 W3C 达到了 LC 状态。\n\nCR（“Candidate Recommendation”，候选建议）状态比 WD 文档更确定，主要功能已经定稿。其目标是寻求开发社区就该标准的实现程度提供协助。\n\
  \nPR（“Proposed Recommendation”，建议建议）状态意味着该标准已通过了之前的两个阶段，此时文档提交给 W3C 进行最终批准。\n\n\
  REC（“Recommendation”，建议）状态是批准过程的最终阶段，可以比比许多其他行业中发布的技术标准。规范成为 W3C 建议的标准是“有两个 100%\
  \ 完成且完全互操作的实现”。\n\n回想，第 1 章 描述了一些创建规范的组，并提供了有关本章所讨论技术 API 的详细信息。\n\n## 处于 W3C 建议状态\
  \ (REC) 的 HTML5 APIs\n\n你可能会惊讶地发现 SVG 和 MathML 拥有 REC 状态。这两项技术都很成熟，并包含在 HTML5 伞下。然而，本书均未涵盖这两个主题。\n\
  \n## HTML5 地理定位\n\n地理定位允许用户共享他们的当前位置，该位置可以通过以下方法确定：\n\n*   手机基站\n*   设备上的 GPS 硬件\n\
  *   IP 地址\n*   无线网络连接\n\n实际使用的方法取决于浏览器和设备的能力。浏览器随后确定位置并将其传回 Geolocation API。注意，W3C\
  \ 地理定位规范提到，不能保证 Geolocation API 会返回设备的实际位置。\n\n`geolocation` 对象是 `window.navigator`\
  \ 的子对象，你可以通过以下类型的代码块检查你的浏览器是否支持地理定位：\n\n```\nif(window.navigator.geolocation) {\n\
  \  // 支持地理定位\n} else {\n  // 不支持地理定位\n}\n```\n\nW3C 地理定位 API 允许你在运行在设备上的浏览器浏览器会话中获取地理位置信息。`geolocation`\
  \ 对象在全局 `window.navigator` 对象可用，通过 `window.navigator.geolocation` 访问。\n\n注意，地理定位\
  \ API 需要用户允许 Web 应用程序访问位置信息：\n\n*   `geolocation` 对象包含以下三个方法：\n*   `getCurrentPosition(successCallback,\
  \ errorCallback, options)`\n*   `watchPosition(successCallback, errorCallback, options)`\n\
  *   `clearWatch(watchId)`\n\n`getCurrentPosition()` 方法尝试获取地理位置信息。如果成功，它将使用 `successCallback`\
  \ 方法；否则，它调用参数列表中的 `errorCallback` 方法。\n\n`watchPosition()` 方法定期获取地理位置，它还会返回一个 `watchId`\
  \ 值。成功和失败通过参数列表中的两个 JavaScript 方法处理。\n\n最后，`clearWatch(watchId)` 方法根据 `watchId`\
  \ 的值停止监听过程。\n\n前两个方法的主要区别是，`watchPosition()` 方法在调用时立即返回一个值，且返回的值唯一标识该监听操作。\n\n这里是显示桌面和移动浏览器地理定位支持的表格：\n\
  \n*[`caniuse.com/geolocation`](http://caniuse.com/geolocation)*\n\n## 使用 getCurrentPosition()\
  \ 获取位置\n\n`PositionOptions` 对象是一个可选参数，可以传递给 `getCurrentPosition()` 方法和 `watchPosition()`\
  \ 方法。`PositionOptions` 对象的所有属性也是可选的。\n\n例如，你可以通过以下 JavaScript 代码块定义 `PositionOptions`\
  \ 对象的实例：\n\n```\nvar options = {\n  enableHighAccuracy: true,\n  maximumAge: 60000,\n\
  \  timeout: 45000\n};\n```\n\n接下来，我们可以通过指定 JavaScript 成功函数、JavaScript 错误函数以及之前定义的\
  \ `options` 变量来调用 `getCurrentPosition()` 方法，如下：\n\n```\nnavigator.geolocation.getCurrentPosition(successCallback,\
  \ errorCallback, options);\n```\n\n## 使用 watchPosition() 跟踪位置\n\n当应用程序需要在每次更改位置时更新位置时，此方法非常有用。监听操作是一个异步操作，调用如下：\n\
  \n```\nvar watchID = null;\nvar options = { enableHighAccuracy: true, timeout: 30000\
  \ };\n\nif (window.navigator.geolocation) {\n  watchID = navigator.geolocation.watchPosition(\n\
  \    successCallback, errorCallback, options);\n} else {\n  alert('您的浏览器不支持地理定位。');\n\
  }\n\nfunction successCallback(position) {\n  console.log(\"成功获取设备位置\");\n}\n\n//\
  \ 获取位置错误\nfunction errorCallback(error) {\n  console.log(\"获取位置错误\");\n}\n```\n\n\
  \n\n\n\n如果浏览器支持地理定位（Geolocation），JavaScript 变量 `watcher` 将通过调用 `geolocation` 对象的\
  \ `watchPosition()` 方法来初始化。请注意用于处理成功或失败的 JavaScript 函数 `successCallback()` 和 `errorCallback()`。（在案例中，这些函数仅简单地在浏览器的控制台中显示一条消息）。\n\
  \nW3C 地理定位 API 提供了一种方法，通过向 `clearWatch()` 方法传递 `watchId` 来清除监听操作，如下所示：\n\n```javascript\n\
  navigator.geolocation.clearWatch(watcher);\n```\n\n在创建一个新的监听操作后，您可以在成功获取设备位置后移除该监听，如下所示：\n\
  \n```javascript\nfunction successCallback(position) {\n  navigator.geolocation.clearWatch(watcher);\n\
  \  // 在此处对位置进行某些操作\n}\n```\n\n如您所见，JavaScript 函数 `successCallback()` 的作用仅仅是“清除”\
  \ JavaScript 变量 `watcher`。关键点在于，在您清除此变量之前，您将持续接收信息。\n\n您可以进行 Google 搜索以找到各种支持地理定位的\
  \ JavaScript 插件。如果您倾向于使用 jQuery 插件进行地理定位，有几个可选选择，包括这一个：\n\n[`mobile.tutsplus.com/tutorials/mobile-web-apps/html5-geolocation/`](http://mobile.tutsplus.com/tutorials/mobile-web-apps/html5-geolocation/)\n\
  \n## HTML5 跨源资源共享 (CORS)\n\n简而言，“同源策略”允许来自相同站点和协议的脚本执行，它们可以不受限制地访问彼此的方法和属性。该策略还限制了\
  \ AJAX 调用仅限于与页面相同的源（但存在一个“漏洞”，在动态加载 `<script>` 标签时可以绕过此限制）。\n\n作为一个简单的例子，以下这对 URL\
  \ 来自同一站点但协议不同，因此它们不符合“同源策略”的标准：\n\n- [`foo.com`](http://foo.com)\n- [`foo.com`](https://foo.com)\n\
  \n另一方面，跨源资源共享 (CORS) 规定了 Web 服务器允许不同域名的 Web 页面访问资源的方式。尽管 CORS 比“同源策略”更灵活，但它并不允许任何所有请求访问资源。\n\
  \n简单来说，CORS 规范通过客户端和服务器之间简单的标头交换，为跨域通信提供了支持。\n\nCORS 规范的一些新 HTTP 标头是 `Options`、`Origin`\
  \ 和 `Access-Control-Allow-Origin`。当提供了适当的 CORS 标头时，CORS 向其他域发送异步 HTTP 请求变得可能。\n\n\
  请记住：不存在单一的 CORS API，但任何使用跨源功能的 API 都可以被称为 CORS API。在实践中，CORS API 使用 `XMLHttpRequest`\
  \ 对象作为发送和接收 CORS 所需标头的“容器”，还使用了 `withCredentials` 属性，该属性可用于程序化地判断 `XMLHttpRequest`\
  \ 对象是否支持 CORS。\n\n要获取有关 CORS 的详细描述，请进行互联网搜索，您将找到许多此类信息的免费文章。\n\n## W3C 候选建议状态 (CR)\
  \ 中的 HTML5 API\n\n本章的这一部分包含一组处于候选建议（Candidate Recommendation）状态的 HTML5 API。尽管 HTML5\
  \ 技术 Navigation Timing、RDFa 和 Selectors 拥有 CR 状态，但本书并未讨论它们。\n\n## 电池 API (The Battery\
  \ API)\n\n电池 API 由 DAP（设备 API）工作组维护，该组提供有关主机设备电池状态的信息。来自 `Battery1.html` 的以下简单代码片段向您展示如何在每次电量变化时将电量写入控制台：\n\
  \n```javascript\nnavigator.battery.onlevelchange = function () {\n  console.log(navigator.battery.level);\n\
  };\n```\n\n下一节包含一个基于 AJAX 的代码示例，展示了如何使用下文描述的新 `FormData` 对象配合 XHR2。\n\n## XMLHttpRequest\
  \ Level 2 (XHR2)\n\n`XMLHttpRequest` Level 2 规范支持以下新功能：\n\n- 处理如 `File`、`Blob` 和\
  \ `FormData` 字节流的上传和下载\n- 在上传和下载期间显示进度事件\n- 创建跨源请求\n- 创建匿名请求（不带 HTTP Referrer）\n\
  - 为请求设置超时\n\n在查看 XHR2 代码示例之前，我们将从一个展示如何发送简单 AJAX 请求的代码示例开始，接着是一个使用 jQuery 的 AJAX\
  \ 请求。\n\n### 不使用 jQuery 发起 AJAX 调用\n\n本节中的代码示例展示了您如何发起“传统的” AJAX 调用。稍后，我们将查看如何使用\
  \ jQuery 完成相同的任务。此示例的目的是说明 jQuery（再次）让您能够编写更简单、易于维护、调试和通过附加功能进行增强的代码（这些您已经从整本书看到的代码示例中知道了）。\n\
  \n![image](img/note.jpg) *您必须从实际的 Web 服务器启动 BasicAjax1.html（而不是文件导航器），因为此网页读取了名为\
  \ sample.xml 的本地文件的内容。* \n\n***列表 5.1 BasicAjax1.html***\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <meta charset=\"utf-8 />\n  <title>Ajax</title>\n  <script>\n\
  \    var xmlHTTP, myFile;\n    var url = \"http://localhost:8080/sample.xml\";\n\
  \    function loadXML(url) {\n      if (window.XMLHttpRequest) {\n        // Chrome,\
  \ Firefox, Safari\n        xmlHTTP = new XMLHttpRequest();\n      } else {\n   \
  \     // IE5\n        xmlHTTP = newObject(\"XMLHTTP\");\n      }\n      xmlHTTP.onreadystatechange\
  \ = callback;\n      xmlHTTP.open(\"GET\", url);\n      xmlHTTP.send();\n    }\n\
  \    function init() {\n      loadXML(myFile, function() {\n        if(xmlHTTP.readyState==4\
  \ && xmlHTTP.status==200) {\n          document.getElementById(\"myDiv\").innerHTML\
  \ = xmlHTTP.responseText;\n        }\n      });\n    }\n  </script>\n</head>\n<body\
  \ onload=\"init()\">\n  <div id=\"myDiv\"></div>\n</body>\n</html>\n```\n\n列表 5.1\
  \ 包含一个在 页面加载时执行的 JavaScript 函数 `init()`。`init()` 函数调用 `loadXML()` 函数，并传入一个在 AJAX\
  \ 请求完成后执行的 JavaScript 函数。\n\n`loadXML()` 函数包含了初始化 JavaScript 变量 `xmlhttp` 的条件逻辑，随后是一个设置回调函数名称、指定\
  \ GET 方法和 `url` 变量中的 URL（代码示例中未显示）并发送实际 AJAX 请求的代码块，如下：\n\n```javascript\nxmlHTTP.onreadystatechange\
  \ = callback;\nxmlHTTP.open(\"GET\", url);\nxmlHTTP.send();\n```\n\n当 AJAX 请求完成后，列表\
  \ 5.1 中的 HTML `<div>` 元素将用 AJAX 请求返回的数据进行更新。在代码示例中， XML  `sample.xml` 是一个包含 3 个矩形的\
  \ SVG 文档，如下：\n\n```xml\n<?xml version='1.0' encoding='iso-8859-1'?>\n<svg xmlns=\"\
  http://www.w3.org/2000/svg\"\n      xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  \n      width=\"100%\" height=\"100%\">\n  <rect x=\"50\" y=\"10\" width=\"100\"\
  \ height=\"200\" stroke=\"blue\" fill=\"red\" />\n  <rect x=\"200\" y=\"10\" width=\"\
  100\" height=\"200\" stroke=\"blue\" fill=\"green\" />\n  <rect x=\"350\" y=\"10\"\
  \ width=\"100\" height=\"200\" stroke=\"blue\" fill=\"blue\" />\n</svg>\n```\n\n\
  \n\n\n\n如果你是 AJAX 的新手，那么 Listing 5.1 中的代码可能看起来复杂，甚至可能让人困惑。幸运的是，jQuery 通过屏蔽底层细节简化了创建\
  \ AJAX 请求的过程，正如你将在节中看到的那样。\n\n## 使用 jQuery 调用 AJAX (#toc.html_toc-h2-0033)\n\n此示例是\
  \ Listing 5.1 的修改版本，它在代码中添加了 jQuery 功能。有几个 jQuery 方法提供了基于 AJAX 的功能，包括 `jQuery.load()`、`jQuery.get()`、`jQuery.post()`\
  \ 和 `jQuery.ajax()`。\n\n![image](img/note.jpg) *你必须从实际 Web 服务器（而不是文件管理器）启动* `JQueryAjax1.html`\
  \ *因为此 Web 页面读取了名为 sample.xml 的本地文件内容。*\n\nListing 5.2 显示了 `JQueryAjax1.html` 的内容，它说明了如何在\
  \ HTML Web 页面中使用这些 jQuery AJAX 方法中的第一个，以产生与 Listing 5.1 相同的结果。\n\n***LISTING 5.2\
  \ JQueryAjax1.html***\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <meta charset=utf-8\
  \ />\n <title>JQuery Ajax</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <div id=\"myDiv\"></div>\n  <script>\n    var url = \"http://localhost:8080/sample.xml\"\
  ;\n    $(document).ready(function() {\n      $(\"#myDiv\").load(url, function()\
  \ {});\n    });\n  </script>\n</body>\n</html>\n```\n\nListing 5.2 仅包含一行通过 `jQuery.\
  \ load()` 方法执行 AJAX 请求的代码，如下所示：\n\n```javascript\n$(\"#myDiv\").load(url, function()\
  \ {});\n```\n\n执行 Listing 5.2 中代码的结果与执行 Listing 5.1 的结果相同。`id` 属性为 `myDiv` 的 HTML\
  \ `div` 元素的内容被 `sample.xml` 的内容替换，并渲染三个基于 SVG 的矩形。\n\n或者，你可以如下所示使用 `jQuery.ajax()`\
  \ 方法：\n\n```javascript\n$.ajax({\n  url: url,\n  type: \"get\",\n  success: GotData,\n\
  \  dataType: 'xml'\n});\n```\n\n在前面的代码块中，你还需要定义一个名为 `GotData()` 的 JavaScript 函数，并在其中处理\
  \ Ajax 调用结果。\n\n正如你所预期的，jQuery 提供了更多的 AJAX 功能。具体来说，jQuery 提供了对以下回调钩的支持：\n\n- `beforeSend()`\n\
  - `fail()`\n- `dataFilter()`\n- `done()`\n- `always()`\n\n`beforeSend()`、`error()`\
  \ 和 `done()` 函数的命名直观，且行为符合预期。`dataFilter()` 回调是第一个接收到数据的回调；在它完成处理后，将调用 `done()`\
  \ 回调。最后，无论 AJAX 用的结果是成功还是错误，都会调用 `always()` 回调。\n\n这是一个使用链式调用结合上述几个 API 发起 AJAX\
  \ 请求的简洁 jQuery 代码示例：\n\n```javascript\n// 在发送请求后立即分配处理器，\n// 并获取此请求的 jqxhr 对象的引用\n\
  var jqxhr = $.ajax( \"example.php\" )\n    .done(function() { alert(\"success\"\
  ); })\n    .fail(function() { alert(\"error\"); })\n    .always(function() { alert(\"\
  complete\"); });\n//在此处执行其他工作 …\n// 为上述请求设置另一个完成函数\njqxhr.always(function() { alert(\"\
  second complete\"); });\n```\n\n如果你想探索 jQuery 中更多相关 AJAX 功能，这里是 jQuery AJAX 方法的列表：\n\
  \n- [`api.jquery.com/category/ajax/`](http://api.jquery.com/category/ajax/)\n- [`api.jquery.com/ajaxComplete/`](http://api.jquery.com/ajaxComplete/)\n\
  \n下一节包含一个使用新 `FormData` 对象的代码示例。\n\n## 使用 XMLHttpRequest Level 2 (XHR2) 的 AJAX 请求\
  \ (#toc.html_toc-h2-0034)\n\nListing 5.3 显示了 `AjaxForm.html`，它说明了如何使用新的 `FormData`\
  \ 对象创建一个 HTML5 Web 页面。\n\n***LISTING 5.3 AjaxForm.html***\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Ajax Form</title>\n\
  <script>\nfunction sendForm(form) {\n  var formData = new FormData(form);\n  var\
  \ xhr = new XMLHttpRequest();\n  xhr.open(\"POST\", \"ajax.php\", true);\n  xhr.onload\
  \ = function(e) {\n    // do something\n  };\n  xhr.send(formData);\n}\n</script>\n\
  </head>\n<body>\n<form id=\"myform\" action=\"ajax.php\" onsubmit=\"sendForm(this);\
  \ return false;\">\n<input type=\"text\" name=\"username\">\n<input type=\"number\"\
  \ name=\"age\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n</body>\n</html>\n\
  ```\n\nListing 5.3 显示了 `AjaxForm.html`，它说明了如何使用新的 `FormData` 对象创建一个 HTML5 Web 页面。\n\
  \n\n\n\n\n# jQuery 和 HTML5 拖放操作\n\n在 jQuery 中，拖放操作异常简单：对于一个 HTML 元素只需要一行代码。\n\n\
  `Listing 5.4` 显示了 HTML5 Web 页面 `JQDragAndDrop1.html` 的内容，该页面演示了如何使用 jQuery 轻松地创建一个带有拖放功能的\
