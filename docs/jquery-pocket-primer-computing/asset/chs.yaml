  \   <optgroup label=\"Group1\">\n            <option value=\"4\">值 4</option>\n\
  \            <option value=\"5\">值 5</option>\n            <option value=\"6\">值\
  \ 6</option>\n          </optgroup>\n        </select>\n        <label for=\"selected1\"\
  ><strong>你选择了：</strong></label>\n        <input id=\"selected1\" type=\"text\" value=\"\
  \">\n      </fieldset>\n    </div>\n  </div>\n  <script>\n    $(document).ready(function()\
  \ {\n      $(\"#ComboBox\").change(function() {\n        // 显示选中的值\n        $(\"\
