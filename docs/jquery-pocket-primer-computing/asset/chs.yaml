  \ MacBook 上 Chrome 浏览器中的复选框/按钮。\n\n## 组合框 (Combo Boxes)\n\njQuery 支持 HTML 组合框，你可以为其绑定事件处理器以检测与这些\
  \ HTML 元素相关的事件。\n\n列表 4.5 显示了 `JQUIComboBox1.html` 的内容，展示了如何在 HTML 网页中渲染组合框，以及当用户在组合框中选择不同的值时执行一段代码块。\n\
  \n### 列表 4.5 JQUIComboBox1.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n  <meta charset=\"utf-8\" />\n  <title>jQuery ComboBox</title>\n  <link\
