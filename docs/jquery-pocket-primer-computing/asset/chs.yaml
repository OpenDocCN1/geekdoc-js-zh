  \ 显示了在带有 Android 的 Nexus 设备上渲染列表 7.5](#ch07.html_lst7.5) 中 HTML 页面的结果。\n\n![图 7.6](img/fig7.jpg)\
  \ Nexus 设备上的按钮。\n\n如你所示，jQuery mobile 中有很多与样式相关的选项，因此关于 jQuery Mobile 按钮的总结可能有所帮助：\n\
  * 带有 `data-role=\"button\"` 属性的锚点链接将被渲染为按钮。\n* 任何 `type` 为 `button`、`submit` 或 `image`\
  \ 的 `input` 元素都被分配类 `ui-btn` 并显示为按钮。\n* 添加 `data-icon` 属性可以创建带有图标的按钮。\n* 添加 `data-pos`\
  \ 属性可以图标的位置。\n* 指定 `data-inline=\"true\"` 可使渲染的按钮宽度仅与其文本等宽。\n* `data-role=\"group\"\
  ` 在 `<div>` 元素中垂直（或水平）分组。\n* `data-theme=\"e\"` 属性是五个主题（从“a”到“e”）中的第五个。\n\n### jQuery\
  \ Mobile 中的列表视图\n\njQuery Mobile 支持列表视图（在移动应用程序中非常常见）以及多种变体，包括列表按钮、嵌套列表视图和列表拆分按钮。jQuery\
  \ Mobile 可以通过对列表应用 `data-role=\"listview\"` 属性来增强有序列表和无序列表。嵌入 `<a>` 标签内部的列表元素响应用户手势，如列表\
  \ 7.7](#ch07.html_lst7.7)所示，该列表显示了 jQuery Mobile 页面 ListView.html 的内容。\n\n### 列表\
  \ 7.7 ListView.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
  \ charset=\"utf-8\" />\n  <title>List Views in jQuery Mobile</title>\n  <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\"\
  \ />\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"></script>\n</head>\n\
  <body>\n  <div data-role=\"page\">\n    <div data-role=\"header\"><h2>This is the\
  \ Header</h2></div>\n    <div data-role=\"content\">\n      <h3>Simple Unordered\
  \ List Example</h3>\n      <ul data-role=\"listview\">\n        <li><a href=\"#\"\
  >Unordered Item 1</a></li>\n        <li><a href=\"#\">Unordered Item 2</a></li>\n\
  \        <li><a href=\"#\">Unordered Item 3</a></li>\n      </ul>\n      <h3>Simple\
  \ Ordered List Example</h3>\n      <ol data-role=\"listview\">\n        <li><a href=\"\
  #\">Ordered Item 1</a></li>\n        <li><a href=\"#\">Ordered Item 2</a></li>\n\
  \        <li><a href=\"#\">Ordered Item 3</a></li>\n      </ol>\n    </div>\n  \
  \  <div data-role=\"footer\"></div>\n  </div>\n</body>\n</html>\n```\n\n每当你点击任何链接时，你都会看到一条错误消息。\n\
  \n图 7.6 显示了在带有 Android 的 Nexus 设备上渲染列表 7.5](#ch07.html_lst7.5) 中 HTML 页面的结果。\n\n\
  ![图 7.6](img/fig7.jpg) Nexus 设备上的按钮。\n\n列表 7.7 显示了 jQuery Mobile 页面 ListView.html\
  \ 的内容。\n\njQuery Mobile 支持列表视图（在移动应用程序中非常常见）以及多种变体，包括列表按钮、嵌套列表视图和列表拆分按钮。jQuery Mobile\
  \ 可以通过对列表应用 `data-role=\"listview\"` 属性来增强有序列表和无序列表。嵌入 `<a>` 标签内部的列表元素响应用户手势，如列表\
  \ 7.7](#ch07.html_lst7.7)所示，该列表显示了 jQuery Mobile 页面 ListView.html 的内容。\n\n导航栏通常包含一组按钮，允许用户在页面之间导航。jQuery\
  \ Mobile 允许你在页页头、页脚或内容区域包含导航栏。\n\n要指定导航栏，请对块级元素（如 `<nav>` 元素）应用 `data-role=\"navigation\"\
  `。导航元素内的锚点标签将被格式化为按钮组。jQuery Mobile 将自动处理按钮的激活和非激活状态，如 HTML5 页面 NavigationBar.html\
  \ 所示。\n\njQuery Mobile 允许你显示和隐藏菜单列表，你还可以使用过渡效果在菜单列表显示或隐藏时创建动画效果。HTML5 页面 Menu.html\
  \ 阐述了如何创建一个滑动菜单。\n\njQuery Mobile 使用 AJAX 进行表单提交，并将尝试将服务器响应集成到应用程序 DOM 中，提供预期的过渡效果。如果你希望防止\
  \ jQuery Mobile 使用 AJAX 处理表单，请对 `form` 标签应用 `data-ajax=\"false\"` 属性。\n\n\n\n\n\n\
  ```html\n<head>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"\
  ></script>\n</head>\n<<body>\n  <script>\n    var xmlData = \"\", count = 0;\n \
  \   $(\"#page1\").live('pageinit', (function(event){\n      $.ajax({\n        url:\
  \ 'http://localhost:9000/sample.xml',\n        dataType: 'xml',\n        success:\
  \ function(data) {\n          $(data)\n            .find('svg')\n            .children()\n\
  \            .each(function() {\n              var node = $(this);\n           \
  \   var x      = node.attr('x');\n              var y      = node.attr('y');\n \
  \             var width  = node.attr('width');\n              var height = node.attr('height');\n\
  \              var stroke = node.attr('stroke');\n              var fill   = node.attr('fill');\n\
  \              // 其他处理在此...\n              ++count;\n              console.log(\"\
  element: \"+node);\n            });\n          console.log(\"element count: \"+count);\n\
  \        },\n        error: function() {\n          alert('未找到数据');\n        }\n\
  \      })\n    })\n    );\n  </script>\n  <div id=\"page1\" data-role=\"page\">\n\
  \    <div data-role=\"header\">页眉</div>\n    <div data-role=\"content\">\n     \
  \ <p>来自 jQuery Mobile 的 Hello World</p>\n    </div>\n    <div data-role=\"footer\"\
  >页脚</div>\n  </div>\n</</body>\n</html>\n```\n\n示例 7.8 包含了 HTML 标记和一次 jQuery Mobile\
  \ AJAX 调用，该调用会在此网页加载到浏览器后执行。随后，代码将处理 XML 文档 `sample.xml`（显示在 示例 7.9 中）中 `<svg>`\
  \ 元素的所有子元素，如下：\n\n```javascript\nvar node = $(this);\nvar x      = node.attr('x');\n\
  var y      = node.attr('y');\nvar width  = node.attr('width');\nvar height = node.attr('height');\n\
  var stroke = node.attr('stroke');\nvar fill   = node.attr('fill');\n```\n\n为了说明起，这段代码假设\
  \ 示例 7.9 中的 XML 文档 `sample.xml` 包含上述代码指定的属性的 XML 元素。\n\n**示例 7.9 sample.xml**\n\
  ```xml\n<?xml version='1.0' encoding='iso-8859-1'\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"100%\" height=\"100%\">\n\
  \  <rect x=\"50\" y=\"10\" width=\"100\" height=\"200\" stroke=\"blue\" fill=\"\
  red\" />\n  <rect x=\"200\" y=\"10\" width=\"100\" height=\"200\" stroke=\"blue\"\
  \ fill=\"green\" />\n  <rect x=\"350\" y=\"10\" width=\"100\" height=\"200\" stroke=\"\
  blue\" fill=\"blue\" />\n</svg>\n```\n\n将 示例 7.8 和 7.9 中的文件放在同一目录下，并启动一个在端口 `9000`\
  \ 上提供服务的 Web 服务器。在笔记本电脑或桌机的 Chrome 浏览器中打开 示例 7.8 中的 HTML 页面，打开 Chrome 开发者工具，并检查\
  \ Chrome 控制台的内容。你将看到类似图 7.8](#ch07.html_fig7.8) 的内容，它显示了 MacBook 上 Chrome 浏览器中 Chrome\
  \ 开发者工具的内容。\n\n![图 7.8](img/fig7.jpg) # jQuery Mobile 与地理定位\n\n在第 5 章中，你学习了如何获取用户的地理定位信息。在本节中，你将看到如何使用\
  \ jQuery Mobile 来获取地理定位。示例 7.10 显示了 `JQMGeoLocation.html` 的内容，说明了如何在 HTML5 页面中获取地理定位。\n\
  \n**示例 7.10 JQMGeoLocation.html**\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n  <meta charset=\"utf-8\">\n  <title>JQuery Geolocation</title>\n  <link\
  \ rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\"\
  \ />\n  <script src=\"http://code.jquery.com/jquery-2.0.0.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"></script>\n  <!--\
  \ google maps API -->\n  <script src=\"http://maps.google.com/maps/js?sensor=false\"\
  ></script>\n  <style>\n    #theMap, #theCoords {\n      font-size: 16px;\n     \
  \ height: 200px;\n      width: 400px;\n    }\n  </style>\n  <script>\n    function\
  \ findUserLocation() {\n      // 指定 'success' 和 'fail' JavaScript 函数\n      navigator.geolocation.getCurrentPosition(successCallback,\
  \ errorCallback);\n    }\n    function successCallback(position) {\n      var latitude\
  \ = position.coords.latitude;\n      var longitude = position.coords.longitude;\n\
  \      var latlong = new google.maps.LatLng(latitude, longitude);\n      var myOptions\
  \ = {\n        zoom: 14,\n        center: latlong,\n        mapTypeId: google.maps.MapTypeId.ROADMAP\n\
  \      };\n      // 使用 Google Maps 显示当前位置\n      var map = new google.maps.Map(document.getElementById(\"\
  theMap\"), myOptions);\n      /*\n      var marker = new google.maps.Marker({\n\
  \        position: initialLocation,\n        map: map,\n        title: \"I Am Here!\"\
  \n      });\n      */\n      // 在控制台中显示位置详情\n      positionDetails(position);\n\
  \    }\n    function errorCallback(error) {\n      if(error.code == error.PERMISSION_DENIED)\
  \ {\n        console.log(\"错误：你必须允许地理定位访问\");\n      } else if(error.code == error.PERMISSION_UNAVAILABLE)\
  \ {\n        console.log(\"错误：地理定位不可用\");\n      } else if(error.code == error.TIMEOUT)\
  \ {\n        console.log(\"错误：超时\");\n      }\n    }\n    function positionDetails(pos)\
  \ {\n      var positionStr =\n        \"纬度:\"+ pos.coords.latitude +\"<br>\" +\n\
  \        \"经度:\"+ pos.coords.longitude +\"<br>\" +\n        \"精度:\"+ pos.coords.accuracy\
  \ +\"<br>\" +\n        \"高度:\"+ pos.coords.altitude +\"<br>\" +\n        \"高度精度:\"\
  + pos.coords.altitudeAccuracy +\"<br>\" +\n        \"方向:\"+ pos.coords.heading +\"\
  <br>\" +\n        \"速度:\"+ pos.coords.speed;\n      $(\"#theCoords\").html(positionStr);\n\
  \      console.log(positionStr);\n    }\n  </script>\n</head>\n<body>\n  <div data-role=\"\
  page\" id=\"page1\">\n    <div data-role=\"header\"><h3>JQuery Geolocation</h3></div>\n\
  \    <div data-role=\"content\" id=\"content\">\n      <div id=\"theMap\"></div>\n\
  \      <form id=\"geoLocationForm\">\n        <input type=\"button\" id=\"geobutton\"\
  \ value=\"点击查找我的位置\">\n      </form>\n      <div id=\"theCoords\"></div>\n    </div>\n\
  \    <div data-role=\"footer\"><h3>页脚</h3></div>\n  </div>\n  <script>\n    $(\"\
  #page1\").live('pageinit', (function(event){\n      $(\"#geobutton\").bind(\"vmousedown\"\
  ,function(event, ui){\n        findUserLocation();\n      });\n    })\n  );\n  </script>\n\
  </body>\n</html>\n```\n\n\n\n\n在本章中，你学习了 jQuery Mobile 的各种功能，并并通过代码示例了解了如何处理事件、创建具有多个视图的\
  \ Web 页面以及如何使用 HTML 组件创建表单。你还学习了如何使用 CSS3 阴影和渐变效果（你在第 3 章中学习过）为 jQuery Mobile Web\
  \ 页面中的按钮样式。你学习了如何在使用 jQuery Mobile 的 HTML 页面中实现以下操作：\n\n* 渲染按钮\n* 显示简单和嵌套列表\n* 渲染滑动菜单\n\
  * 使用 AJAX 使用 jQuery Mobile\n* 结合定位使用 jQuery Mobile\n\n# 第 8 章\n\n## jQuery Mobile\
  \ 中的用户手势与动画效果\n\n本章包含许多代码示例，演示了如何处理用户手势以及如何在 jQuery Mobile 中创建动画效果。幸运的是，jQuery Mobile\
  \ 为用户手势触发了事件，例如 `orientationchange`、`scrollstart`、`scrollstop`、`swipe`、`swipeleft`、`swiperight`、`tap`\
  \ 和 `taphold`。本章的第一部分向你展示了如何处理其中的一些用户手势。你还将看到代码示例，展示如何在 jQuery 中创建与滑动相关和淡入相关的动画效果。本节最后最后简要讨论了\
  \ jQuery Mobile 虚拟鼠标事件，当你需要在 HTML Web 页面中处理鼠标相关事件以及触摸相关事件时，它可以简化你的代码。\n\n本章的第二部分向你展示了如何使用\
  \ jQuery Mobile 创建 CSS3 2D/3D 动画效果。一个代码示例使用 jQuery Mobile 创建了 3D 立方效果。此外，光盘中还有渲染“跳动球”的示例，展示了如何获取移动设备的加速度值并在\
  \ jQuery Mobile Web 页面中显示实时值。\n\n![image](img/cd.jpg) 回想你在第 2 章中学习了如何创建 CSS3 2D\
  \ 和 3D 效果，在第 3 章中学习了如何在 HTML5 Web 页面中将这些效果结合 jQuery。在本章中，你将看到如何使用 jQuery Mobile\
  \ 创建一些相应的效果。\n\n### 在 jQuery Mobile 中处理用户手势和事件\n\njQuery Mobile 为用户手势触发了一系列事件，例如\
  \ `orientationchange`、`scrollstart`、`scrollstop`、`swipe`、`swipeleft`、`swiperight`、`tap`\
  \ 和 `taphold`。\n\n如果你需要处理许多用户手势，可以考虑使用 jQuery 插件而不是编写自己的代码。目前有各种插件可用，接下来的章节将简要讨论其中两个插件。\n\
  \n当你想在 HTML Web 页面上检测用户手势时，你可以使用 jQuery 的 `.on(\"click\")` 方法编写自定义 jQuery 代码来处理这些手势。请复阅第\
  \ 1 章中关于在 jQuery 1.7 及以后版本中弃用的 jQuery 事件相关方法的章节，以及推荐的处理事件的 jQuery 方法。\n\n你可能已经知道，当用户点击某个元素时，会发生\
  \ `tap` 事件，而当用户触摸某个元素并保持接触一秒钟时，会发生 `taphold` 事件。你可以通过以下代码段在 jQuery Mobile 中绑定 `tap`\
  \ 事件和 `taphold` 事件：\n\n```javascript\n$(\"body\").bind(\"tap\", function () {\n\
  \  console.log(\"Tap Event on the body Element\");\n  return false;\n});\n\n$(\"\
  body\").bind(\"taphold\", function () {\n  console.log(\"Tap Hold Event on the body\
  \ Element\");\n  return false;\n});\n```\n\njQuery 事件处理程序内部的 `return false` 语句等同于在\
  \ jQuery 事件对象上调用 `e.preventDefault()`（防止默认事件发生）以及 `e.stopPropagation()`（防止事件“冒泡”），该对象是作为参数传递给\
  \ JavaScript 函数的（本例中未提供）。请记住，非 jQuery 事件处理程序中的 `return false` 语句并阻止已发生事件的“冒泡”行为。\n\
  \n当在一秒的时间间隔内以 `30px`（或更大）的速度进行水平拖动时，会发生 `swipe` 事件。当 `swipe` 事件分别向左或向右移动时，会发生 `swipeleft`\
  \ 和 `swiperight` 事件。\n\n代码列表 8.1 显示了 `JQMSwipeEvents1.html` 的内容，说明了如何在 jQuery Mobile\
  \ 中处理点击事件以及左滑和右滑事件。\n\n***代码列表 8.1  JQMSwipe-TapEvents1.html***\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Swipe\
  \ and Tap Events in jQuery Mobile</title>\n    <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\" />\n    <script\
  \ src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n    <script src=\"\
  http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n    <script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"\
  ></script>\n  </head>\n  <body>\n    <div data-role=\"page\" id=\"page1\">\n   \
  \   <div data-role=\"header\"><h3>Header</h3></div>\n      <div data-role=\"content\"\
  >\n        <img id=\"sample1\" src=\"Sample1.png\" width=\"150\" height=\"150\"\
  \ />\n        <img id=\"sample2\" src=\"Sample2.png\" width=\"150\" height=\"150\"\
  \ />\n        <img id=\"sample3\" src=\"Sample3.png\" width=\"150\" height=\"150\"\
  \ />\n        <div id=\"sample1\">Left:</div>\n        <div id=\"sample2\">Middle:</div>\n\
  \        <div id=\"sample3\">Right:</div>\n      </div>\n      <div data-role=\"\
  footer\"><h3>Footer</h3></div>\n    </div>\n    <script>\n      <!-- jQuery 事件处理代码从这里开始\
  \ -->\n      $(page1).live('pageinit',function(event){\n        $(\"body\").bind(\"\
  tap\", function () {\n          console.log(\"Tap Event on the body Element\");\n\
  \          return false;\n        });\n\n        $(\"body\").bind(\"taphold\", function\
  \ () {\n          console.log(\"Tap Hold Event on the body Element\");\n       \
  \   return false;\n        });\n      });\n    </script>\n  </body>\n</html>\n```\n\
  \n\n\n\n处理用户手势的语法使用了 `jQuery.bind` 方法。例如，你可以使用以下代码段通过 `jGestures` 插件绑定滑动手势：\n\n\
  ```javascript\njQuery('#swipe').bind('swipeone',eventHandler);\n```\n\n另一个处理各种用户手势的\
  \ jQuery Mobile 插件在这里：\n\n[`github.com/eightmedia/hammer.js`](https://github.com/eightmedia/hammer.js)\n\
  \n这个 JavaScript 工具包包含了一系列良好的示例，这些示例说明了如何处理用户手势。由于市面上有许多用于处理用户手势的 jQuery Mobile 插件，建议在互联网上搜索以寻找这些插件，然后对它们进行评估，以确定哪些插件最符合你的需求。\n\
  \n## jQuery Mobile 中的滚动事件\n\njQuery Mobile 支持以下自定义事件：`orientationchange`（通过更改设备方向，无论是垂直还是水平触发）、`scrollstart`（在滚动开始时触发）和\
  \ `scrollstop`（在滚动结束时触发）。你可以像处理其他 jQuery 事件一样，使用 `live()` 或 `bind()` 来绑定这些事件，这些方法在\
  \ jQuery 1.7 版本之前的用法在第 6 章中有所讨论。此外，当你的 jQuery Mobile 代码绑定到 `orientationchange` 事件时，回调函数可以指定第二个参数，该参数包含一个等于\
  \ `portrait`（竖屏）或 `landscape`（横屏）的方向属性。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `JQMScrollEvents1.html`\
  \ 演示了如何在 jQuery Mobile 中处理滚动事件，其逻辑如下：\n\n```html\n<script>\n  $(\"#page1\").live('pageinit',\
  \ (function(event,ui){\n    var eventsElement = $('#events');\n    $(window).bind('scrollstart',\
  \ function () {\n      console.log('Scroll start');\n      $('.ui-body-c').css('background',\
  \ 'green');\n      eventsElement.append('<li><a href=\"\">Start Scroll</a></li>>');\n\
  \      //eventsElement.listview('refresh');\n      eventsElement.listview();\n \
  \   });\n    $(window).bind('scrollstop', function () {\n      console.log('Scroll\
  \ stop');\n      $('.ui-body-c').css('background', 'red');\n      eventsElement.append('<li><a\
  \ href=\"\">Stop Scroll</a></li>');\n      //eventsElement.listview('refresh');\n\
  \      eventsElement.listview();\n    });\n    $(window).bind('orientationchange',\
  \ function () {\n      console.log('Orientationchange change');\n      $('.ui-body-c').css('background',\
  \ 'red');\n      eventsElement.append('<li><a href=\"\">Orientation</a></li>');\n\
  \      //eventsElement.listview('refresh');\n      eventsElement.listview();\n \
  \   });\n  });\n</script>\n```\n\n## 竖屏模式与横屏模式\n\n除了检测移动设备的方向外，你可能还需要在方向改变时更改用于样式\
  \ Web 页面元素的 CSS 类。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `JQMOrientation1.html`\
  \ 演示了如何根据移动设备方向轻松地更改与 HTML 元素相关的 CSS 类。关键逻辑包含在此代码块中：\n\n```javascript\n$(\"#page1\"\
  ).live('pageinit', (function(event,ui){\n  $(window).bind ('orientationchange',\
  \ function (e) {\n    console.log(\"new orientation: \"+e.orientation);\n    $(\"\
  #content\").removeClass('portrait landscape')\n    .addClass (e.orientation ? 'landscape'\
  \ : 'portrait');\n  });\n});\n```\n\n注意，`orientationchange` 事件绑定到 `window` 对象。在当前示例中，竖屏模式下背景颜色设置为红色，宽度设置为\
  \ 320px；而横屏模式下背景颜色设置为蓝色，宽度设置为 480px。\n\n另一个需要注意的是，`window.orientation` 在竖屏模式下的值为\
  \ 0，在横屏模式下值为 -90 或 90。\n\n另一种方法是在你的 HTML 页面中使用以下类型的代码：\n\n```css\n@media all and\
  \ (orientation: portrait) { body {background-color: red} }\n```\n\n```html\n<link\
  \ rel=\"stylesheet\" media=\"all and (orientation: landscape)\" href=\"landscape.css\"\
  \ />\n```\n\n图 8.2 显示了在运行 Android ICS 的 Asus Prime 平板电脑上拍摄的横屏图中渲染 `JQMOrientation1.html`\
  \ 的结果。\n\n![image](img/fig8.2.jpg)\n\n***图 8.2*** 在运行 Android ICS 的 Asus Prime 平板电脑上检测方向。\n\
  \n## 使用 jQuery Mobile 使用动画效果\n\n你可以使用 jQuery Mobile 创建各种基于 jQuery 的动画效果，包括淡入效果、滑动效果和自定义动画。创建动画效果的方法（jQuery\
  \ 和 jQuery Mobile 共有）包括：`animation()`、`clearQueue()`、`delay()`、`dequeue()`、`fadeIn()`、`fadeOut()`、`fadeTo()`、`fadeToggle()`、`hide()`、`queue()`、`show()`、`slideDown()`、`slideToggle()`、`slideUp()`、`stop()`\
  \ 和 `toggle()`。\n\n本节包含代码示例，说明了如何在 jQuery Mobile 中创建其中一些动画效果。\n\n### 与淡入相关的方法\n\n\
  jQuery 的 `.fadeIn()` 和 `.fadeOut()` 方法为创建简单动画提供了方便的方法。\n\n![image](img/cd.jpg) CD\
  \ 上的 HTML5 页面 `JQMFadeInOut1.html` 演示了如何在 jQuery Mobile 页面中使用 jQuery 的 `.fadeIn()`\
  \ 和 `.fadeOut()` 方法，其主逻辑如下：\n\n```html\n<body\n  <div data-role=\"page\" id=\"page1\"\
  >\n    <div id=\"header\" data-role=\"header\">\n      <h3>头部文本</h3>\n    </div>\n\
  \    <div id=\"content\" data-role=\"content\">\n      <p>来自 jQuery 的 Hello World</p>\n\
  \      <p>来自 jQuery 的 Goodbye World</p>\n      <p>点击此文本可切换此段落。</p>\n    </div>\n\
  \    <div data-role=\"footer\">\n      <h3>页脚</h3>\n    </div>\n  </div>\n  <script>\n\
  \    $(\"#page1\").live('pageinit', (function(event,ui){\n      // ... 淡入/淡出的逻辑\
  \ ...\n    });\n  </script>\n</body>\n```\n\n\n\n每当用户点击右侧的图片时，第一张图片会缓慢显示：\n\n```javascript\n\
  // display first <img> when users click on the last <img>\n$(\"img:last\").click(function\
  \ () {\n    $(\"img:first\").fadeIn(\"slow\");\n});\n```\n\n你可以使用类似的代码块来捕捉其他 HTML\
  \ 元素的事件。在这个示例中，我们也可以使用此片段获取所有的 `<p>` 元素：\n\n```javascript\nvar para = $(\"p\");\n\
  ```\n\n然而，在 `JQMFadeInOut1.html` 中，我们使用 `$(\"p:first\")` 和 `$(\"p:last\")` 引用第一个最后一个\
  \ HTML `<p>` 元素，然后执行类似的淡入效果。\n\n图 8.3 显示了在 MacBook 的 Chrome 浏览器上横屏渲染 `JQMFadeInOut1.html`\
  \ 的结果。\n\n![image](img/fig8.3.jpg)\n\n**图 8.3** MacBook 上 Chrome 浏览器上的淡入效果。\n\n\
  ## 幻灯片相关的 jQuery 方法\n\n正如你所推的，jQuery 的 `.slideUp()` 和 `.slideDown()` 方法为 jQuery\
  \ Mobile 提供了滑动功能。\n\n![image](img/cd.jpg) CD 中的 HTML5 页面 `JQMSlideUpDown1.html`\
  \ 展示了如何在 jQuery Mobile Web 页面中使用 jQuery `.slideUp()` 和 `.slideDown()` 方法，这里显示了部分代码：\n\
  \n```html\n<body\n    <div data-role=\"page\" id=\"page1\">\n        <div data-role=\"\
  header\"><h3>Header</h3></div>\n        <div data-role=\"content\">\n          \
  \  <p>Click me or one of the Rectangles:</p>\n            <div name=\"first\" id=\"\
  first\">First</div>\n            <div id=\"second\">Second</div>\n            <div\
  \ id=\"third\">Third</div>\n            <div id=\"fourth\">Fourth</div>\n      \
  \  </div>\n        <div data-role=\"footer\"><h3>Footer</h3></div>\n    </div>\n\
  \    <script>\n        $(\"#page1\").live('pageinit', (function(event,ui) {\n  \
  \          $(\"#page1\").click(function() {\n                if ($(\"div:first\"\
  ).is(\":hidden\")) {\n                    $(\"div\").show(\"slow\");\n         \
  \       } else {\n                    $(\"div[name='first']\").slideUp(2000);\n\
  \                }\n                $(\"div[name='first']\").css({background:'#00f'})\n\
  \                    .show(2000).hide(2000).slideDown(2000);\n            })\n \
  \       }))\n    </script>\n</body>\n```\n\nHTML5 页面 `JQMSlideUpDown1.html` 包含一个\
  \ `<style>` 元素，它使用 CSS 对四个矩形应用了某些样式，随后是一个处理页面视图中任何位置点击事件的代码块：\n\n```javascript\n\
  $(\"#page1\").click(function() {\n    // handle a click event on the page\n}\n```\n\
  \njQuery Mobile 代码的核心由一行代码组成，它使用方法链创建一个多部分动画效果，每当用户点击矩形时，该效果会：1) 将背景颜色变为红色，2) 执行为期\
  \ 2 秒的“显示”和“隐藏”动画效果，随后是 3) 持续 2 秒的“滑动”效果，如下所示：\n\n```javascript\n$(\"div[name='first']\"\
  ).css({background:'#00f'})\n    .show(2000).hide(2000).slideDown(2000);\n```\n\n\
  图 8.4 显示了在带有 Android ICS 的 Asus Prime 平板上横屏渲染 `JQMSlideUpDown1.html` 的结果。\n\n![image](img/fig8.4.jpg)\n\
  \n**图 8.4** 带有 Android ICS 的 Asus Prime 平板上的淡入效果。\n\n## jQuery Mobile 与过渡效果\n\n\
  jQuery Mobile 使用基于 WebKit 的 CSS3 变换来实现页面过渡，基于 WebKit 的浏览器目前对 CSS3 变换提供了最好的支持（其他浏览器正在提高支持水平）。由于基于\
  \ WebKit 的浏览器使用硬件加速，CSS 动画效果在移动设备以及笔记本电脑和桌面上看起来非常平滑。\n\n你通过应用 `data-transition`\
  \ 属性来指定过渡效果，其七种支持的值为：\n\n*   fade：简单地在之前的内容之上淡入页面或对话框\n*   flip：动画页面翻页效果，将当前视图旋转出，并让反面的另一侧视图进来\n\
  *   pop：页面从屏幕中心弹入视图\n*   slide：从左侧或右侧滑入，将之前的内容推开\n*   slidedown：从顶部向下滑动，覆盖当前内容上方\n\
  *   slideup：向上滑动到顶部，显示下方的后续内容\n\njQuery Mobile 还提供了 `animationComplete` 事件，这在你添加或移除应用\
  \ CSS 过渡的类后非常有用。\n\n代码列表 8.2 显示了 `JQMTransition1.html` 的内容，说明了如何在 jQuery Mobile\
  \ 页面中使用 `slidedown` 和 `flip` 过渡。\n\n**代码列表 8.2 JQMTransition1.html**\n```html\n\
  <body\n    <div data-role=\"page\" id=\"first\">\n        <div data-role=\"header\"\
  ><h2>This the first page</h2></div>\n        <div data-role=\"content\">\n     \
  \       <p><a href=\"#second\" data-transition=\"slidedown\">Go to Page Two</a></p>\n\
  \        </div>\n        <div data-role=\"footer\"><h2>This the first footer</h2></div>\n\
  \    </div\n    <div data-role=\"page\" id=\"second\">\n        <div data-role=\"\
  header\"><h2>This the second page</h2></div>\n        <div data-role=\"content\"\
  >\n            <p><a href=\"#first\" data-transition=\"flip\" data-direction=\"\
  reverse\">Go to Page #1 via 'flip' and reverse</a></p>\n        </div>\n       \
  \ <div data-role=\"footer\"><h2>This the second footer</h2></div>\n    </div>\n\
  </body>\n```\n\n代码列表 8.2 包含了 jQuery Mobile 页面的代码。当你点击第一个页面视图中的链接时，你将看到由第一页内容 `<div>`（其\
  \ `id` 属性为 first）中的以下片段创建的滑动效果：\n\n```html\n<a href=\"#second\" data-transition=\"\
  slidedown\">Go to Page Two\n```\n\n第二个页面视图显示以下文本：You saw a slidedown effect Go to\
  \ Page #1 via ‘flip’.当你点击之前的链接时，你将看到由第二个页面内容 `<div>`（其 `id` 属性为 second）中的以下片段创建的翻页效果：\n\
  \n```html\n<a href=\"#first\" data-transition=\"flip\" data-direction=\"reverse\"\
  >\n```\n\n注意，jQuery Mobile 将尝试在使用自动返回按钮或隐藏对话框时使用反向过渡。这个简单的示例说明了在不同页面视图之间导航时可以创建的一些页面效果。你可以尝试许多过渡效果，以找到适合你要求的效果。\n\
  \n图 8.5 显示了在 MacBook 的 Chrome 浏览器上横屏渲染 代码列表 8.2 中 `JQMTransition1.html` 的结果。\n\n\
  ![image](img/fig8.5.jpg)\n\n**图 8.5** MacBook 上 Chrome 浏览器上的过渡效果。\n\n## jQuery Mobile\
  \ 与 CSS3 动画效果\n\n回 jQuery Mobile 使用基于 WebKit 的 CSS3 变换来实现页面过渡。WebKit 浏览器使用硬件加速，使得\
  \ CSS 动画效果在移动设备、笔记本电脑和桌面上看起来都很平滑。\n\n代码列表 8.3 显示了 `JQMJender1.html` 的内容，说明了如何在 jQuery\
  \ Mobile 页面中结合 JPG 文件使用 `slideDown()` 和 `slideUp()`。\n\n**代码列表 8.3 JQMRender1.html**\n\
  ```html\n<body\n    <div data-role=\"page\" id=\"page1\">\n        <div data-role=\"\
  content\">\n            <img id=\"sample1\" src=\"Sample1.png\" width=\"200\" height=\"\
  200\">\n            <img id=\"sample2\" src=\"Sample2.png\" width=\"200\" height=\"\
  200\">\n            <p>\n                <a id=\"button1\" href=\"#\" data-role=\"\
  button\">Click Me To Display The Right Image</a>\n                <a id=\"button2\"\
  \ href=\"#\" data-role=\"button\">Click Me To Shrink The Right Image</a>\n     \
  \       </p>\n        </div>\n    </div\n    <script>\n        $(\"#page1\").live('pageinit',\
  \ (function(event,ui) {\n            $(\"#sample2\").hover(function() {\n      \
  \          $(this).slideUp(800);\n            })\n            $(\"#sample2\").hover(function()\
  \ {\n                $(this).css({'position':'relative',\n```\n\n\n\n\n```javascript\n\
  \                'width':'200px',\n                'height':'200px'\n          \
  \   });\n});\n\n$(\"#button1\").click(function() {\n    $(\"#sample2\").slideDown(800);\n\
  });\n\n$(\"#button2\").click(function() {\n    $(\"#sample2\").css({'position':'relative',\n\
  \                       'width':'100px',\n                       'height':'100px'\n\
  \                      });\n});\n)\n)\n</script>\n</body\n```\n\nListing 8.3 渲染了两个图像并包含两个绑定到点击事件的按钮。视觉效果取决于点击按钮的顺序。当用户点击第二个按钮（“点击缩小右侧图像”）时，使用以下代码块将最右侧的图像从初始的\
  \ 200x200 尺寸缩小到 100x100：\n\n```javascript\n$(\"#button2\").click(function() {\n\
  \  $(\"#sample2\").css({'position':'relative',\n      'width':'100px',\n      'height':'100px'\n\
  \  });\n});\n```\n\n如你所见，前面的代码块使用 jQuery 的 `css()` 函数来修改右侧图像的宽度和高度，这意味着没有过渡效果。\n\
  \n接下来，如果用户悬停在右侧的图像（现在已缩小）上，由于以下代码块，图像将带有过渡效果缩小并消失：\n\n```javascript\n$(\"#sample2\"\
  ).hover(function() {\n    $(this).slideUp(800);\n});\n```\n\n现在，如果用户点击第一个按钮（“点击显示右侧图像”），由于以下代码，第二个图像将（再次使用过渡效果）以原始尺寸重新出现：\n\
  \n```javascript\n$(\"#button1\").click(function() {\n    $(\"#sample2\").slideDown(800);\n\
  });\n```\n\n这些代码说明了编写 jQuery 代码来创建良好的图像动画效果是多么简单。此外，你可以将 jQuery 动画效果与 jQuery 的 `css()`\
  \ 函数结合。例如，你可以使用 `css()` 函数在用户点击图像时渲染具有背景径向渐变效果的图像，或者更新图像（或元素）的任何其他 CSS 属性。\n\n因此，你可以对\
  \ jQuery 动画、CSS 以及 CSS3 图形和动画的知识，通过简单紧凑的 jQuery 代码来创建有趣的效果。\n\n![image](img/fig8.6.jpg)\
  \ ***图 8.6*** 在 MacBook 的 Chrome 浏览器上带有动画效果的调整 JPG。\n\nFigure 8.6 显示了在 MacBook 的\
  \ Chrome 浏览器上横屏模式渲染 Listing 8.3 中 `JQMRenderJPG1.html` 的结果。\n\n# jQuery Mobile 虚拟鼠标事件\
  \ #toc.html_toc-h1-0081\n\njQuery Mobile 提供了一组“虚拟”鼠标事件来处理鼠标和触摸事件。这些事件非常有用，因为每个事件都处理鼠标事件及其相应的触摸事件，这可以减少\
  \ Web 页面中需要编写的代码。此外，虚拟鼠标事件支持同一个 Web 页面上的桌面和移动样式交互。\n\njQuery Mobile 中的虚拟鼠标事件名称以字母“v”（代表\
  \ virtual）开头，随后是鼠标事件的通用或标准名称。例如，`vmousedown` 虚拟事件“传递”了 `mousedown` 事件以及 `touchstart`\
  \ 事件。虚拟鼠标事件列表（及其对应的触摸相关和鼠标相关事件）所示：\n\n- `vclick` (touchend 或鼠标点击事件)\n- `vmousecancel`\
  \ (触摸或鼠标 mousecancel 事件)\n- `vmousedown` (touchstart 或 mousedown 事件)\n- `vmousemove`\
  \ (touchmove 或 mousemove 事件)\n- `vmouseover` (触摸或 mouseover 事件)\n- `vmouseup` (touchend\
  \ 或 mouseup 事件)\n\n请记住：在支持触摸的设备上，`vclick` 事件在 `vmouseup` 事件之后触发；然而，`vmouseup` 在\
  \ `vmousedown` 之前触发，而 `vmousedown` 在 `vclick` 之前触发，正如你预期的那样。此外，事件对象包含坐标信息的 `pageX`,`pageY`,`screenX`,`screenY`,`clientX`\
  \ 和 `clientY`，你将在后续示例中看到。\n\n![image](img/cd.jpg) CD 中的 HTML5 Web 页面 `QM2DAnimationGrad4Reflect1.html`\
  \ 和 CSS 样式表 `QM2DAnimationGrad4Reflect1.css` 展示了如何在 jQuery Mobile 中创建 CSS3 2D 动画。\n\
  \n```html\nLISTING 8.4 QM2DAnimationGrad4Reflect1.html\n<body>\n  <div data-role=\"\
  page\">\n    <div data-role=\"content\">\n      <div id=\"outer\">\n        <div\
  \ id=\"radial3\">Text3</div>\n        <div id=\"radial2\">Text2</div>\n        <div\
  \ id=\"radial4\">Text4</div>\n        <div id=\"radial1\">Text1</div>\n      </div>\n\
  \    </div>\n  </div>\n</body>\n```\n\nListing 8.4 非常直截易懂：jQuery 代码包含了四个 `div` 元素，这些元素在关联的样式表中有相应的\
  \ CSS 选择器。这四个 CSS 选择器定义了径向渐变（在 CD 的附带样式表中定义），它们与 第 2 章 中的 CSS3 示例非常。（如果你需要复习，请阅读相关章节）。需要注意的关键点是，尽管代码示例中的视觉效果并不是新的，但这段代码演示了你如何轻松地将\
  \ jQuery 代码与 CSS3 2D/3D 图形和动画效果相结合。\n\n![image](img/fig8.7.jpg) ***图 8.7*** iPad\
