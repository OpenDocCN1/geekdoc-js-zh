  \ CD 上的 HTML5 Web 页面 `JQMAccelerometer1.html` 展示了设备在任何方向发生加速时如何显示加速度值。\n\n## 总结\n\
  \n本章介绍了 jQuery Mobile 中的动画效果，并查看了演示各种效果的代码示例。你学习了如何在 jQuery Mobile 中实现以下功能：\n\n\
  *   点击和滑动事件\n*   滚动事件\n*   识别竖屏还是横屏\n*   淡入淡出动画效果\n*   滑动动画效果\n*   过渡效果\n*   使用\
  \ CSS3 进行动画\n*   虚拟鼠标事件\n\n# 第 9 章 (#toc.html_toc-9)\n\n## HTML5 CANVAS 简介](#toc.html_toc-9)\n\
  \n本章概述了 HTML5 Canvas，这是一种允许你编写直接在 Web 页面部分绘制图形的程序的技术。HTML5 Canvas 支持多种 API 来渲染 2D\
  \ 形状以及各种图形效果。虽然网上有很多关于 Canvas 和 CSS3 的教程（你可以通过快速搜索确认），但很少有教程同时提供 HTML5 Canvas 和\
  \ CSS3 效果的代码示例。\n\n\n\n\n\n还有一点需要记住：`HTML5 Canvas` 对 `jQuery` 或 `jQuery Mobile`\
  \ 没有任何形式的“依赖”。如果有必要，你可以创建包含 `HTML5 Canvas` 的混合 HTML5 移动应用，可以结合工具包（如 `PhoneGap`），也可以不需要工具包。\n\
  \n## 什么是 HTML5 Canvas？\n\n几年前，Canvas 在 OS X 中作为一种组件工具包出现。在 Canvas 在 `Safari` 浏览器中可用后，它成为了\
  \ Web 的一种规范。现在，它通常被称为 `HTML5 Canvas`。\n\n`HTML5 Canvas` 和 `SVG` 都允许你通过 `JavaScript`\
  \ 在浏览器中编程渲染图形。然而，`HTML5 Canvas` 使用的是“立即模式”（immediate mode），这是一种写完即忘的渲染方法。因此，如果你想在\
  \ `HTML5 Canvas` 中编写一个绘画程序，并且想提供“撤销”功能，那么你必须通过程序跟踪用户在屏幕上绘制的所有内容。另一方面，`SVG` 使用的是“保留模式”（retained\
  \ mode），它涉及一个 `DOM`（文档对象模型）结构，用于跟踪渲染对象以及它们之间的关系。\n\n如果你打算编写大量使用图形效果的 HTML Web 页面，你可能需要理解\
  \ `HTML5 Canvas` 和 `SVG` 在性能方面的差异。你可以自由地仅使用其中一种技术，也可以创建包含 `HTML5 Canvas`、`SVG` 和\
  \ `CSS3` 混合的 HTML Web 页面。性能相关的信息可以帮助你决定如何编写你的 HTML Web 页面。\n\n虽然本章没有深入探讨上述观点，但你可以在这里找到关于\
  \ `HTML5 Canvas` 某些特性/优势的良好概述：\n\n[`thinkvitamin.com/code/how-to-draw-with-html-5-canvas/`](http://thinkvitamin.com/code/how-to-draw-with-html-5-canvas/)\n\
  \n顺便一下，如果你在 `Internet Explorer 8` 中需要 `HTML5 Canvas` 支持，可以使用 `ExplorerCanvas`，这是一个开源项目，可以在这里：\n\
  \n[`code.google.com/p/explorercanvas/`](http://code.google.com/p/explorercanvas/)\n\
  \n你只需要在 HTML Web 页面中包含以下代码段，即可使用上述代码项目：\n\n```\n<!-- [if IE lt 8]><script src=\"\
  excanvas.js\"></script><![endif]-->\n```\n\n## HTML5 Canvas 与 SVG\n\n一个需要考虑的点是何时使用\
  \ `HTML5 Canvas` 而不是 `SVG` 等技术更具优势。以下简短列表包含了你在进行此类分析时需要考虑的一些特性：\n\n*   原生支持与插件浏览器支持\n\
  *   不同浏览器对 `SVG` 的支持程度\n*   动画支持\n*   对过滤器的支持（仅限 SVG）\n*   对类 HTML 组件的内置支持\n*  \
  \ 第三方支持\n\n大多数现代浏览器都对 `SVG` 提供不同程度的内置支持，Adobe 的 `SVG` 查看器可以与微软的 `Internet Explorer`\
  \ 配合使用。如果你需要基于过滤器的视觉效果，那么 `SVG` 提供了非常丰富（可能是最好的）的功能。如果你需要对 HTML 控件的内置支持，像 `Wijmo`\
  \ 等框架可能是你需求的良好解决方案。另一个需要考虑的点是 Adobe 不再支持它的 `SVG` 查看器了。这是一个重大的决定，因为 Adobe 的 `SVG`\
  \ 查看器多年来一直一直是 SVG 查看器的事实上的标准。尽管 `Firefox` 和 `Opera` 在支持 `SVG` 方面取得了显著进展，并且两者都在增强对\
  \ `SVG` 的支持，但它们仍然缺乏 Adobe `SVG` 查看器的功能支持。因此，你需要权衡最重要的因素，以做出符合你项目需求的决策。\n\n有一篇包含示例和图表、比较\
  \ `HTML5 Canvas` 和 `SVG` 使用的优秀文章，可以在这里：\n\n[`blogs.msdn.com/b/ie/archive/2011/04/22/thoughts-on-when-to-use-canvas-and-svg.aspx`](http://blogs.msdn.com/b/ie/archive/2011/04/22/thoughts-on-when-to-use-canvas-and-svg.aspx)\n\
  \n## HTML5 Canvas 坐标系\n\n回想你高中的时光，那时你学过笛卡尔坐标系通过一对数字（通常写为 (x,y)）识别欧几里得平面上的任意点。第一个数字代表水平值，第二个数字代表垂直值。水平轴标记为\
  \ `x-axis`，`x-axis` 上的正值位于垂直轴的右侧（即向右）。垂直轴标记为 `y-axis`，`y-axis` 上的正值位于水平轴上方。原点是 `x-axis`\
  \ 和 `y-axis` 的交点。\n\n`HTML5 Canvas` 坐标系中的情况几乎相同。`x-axis` 是水平的，正方向向右。`y-axis` 是垂直的，但正方向向下，这与典型数学教科书中大多数图的方向相反。在\
  \ `HTML5 Canvas` 坐标系中，原点是屏幕的左上角（而不是左下角），测量单位是像素。当本书出版时，最大的可见显示器为 2880×1800，无疑未来会有更大的显示器。\n\
  \n![image](img/fig9.1.jpg)\n\n***图 9.1***在 HTML5 Canvas 中渲染的四个点。\n\n作为一个简单的说明，[图\
  \ 9.1] 显示了 HTML `<canvas>` 元素中的四个点。\n\n如果你从原点（屏幕的左上角）开始向右移动 50 像素，然后向下移动 50 像素，你将到达\
  \ [图 9.1] 中的左上点。接下来，如果你从原点开始向右移动 200 像素并向下移动 50 像素，你将到达 [Listing 9.1] 中的右上点。同样，第二“行”中的两个点坐标为\
  \ (50,100) 和 (200,100)。注意，第一行的两个点的 y 坐标值相同，这是合理的，因为它们距离 Web 页面顶部的距离相同；第二行的两个点也是如此。同样，左侧“列”的两个点具有相同的\
  \ x 坐标，因为它们距离 Web 页面左侧的距离相同。\n\n现在你已经理解了 HTML5 Canvas 坐标系，让我们来看看 [Listing 9.1] 内容，它显示了一个最小的\
  \ HTML5 Web 页面，准备好渲染基于 HTML5 Canvas 的图形。书书中每个基于 Canvas 的代码示例都使用 [Listing 9.1] 中显示的代码（或某些变体）。注意，如果你在浏览器会话中启动此代码，你将只看到一个空白屏幕。\n\
  \n***Listing 9.1 Canvas1.html***\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
  >\n<head>\n  <meta charset=\"utf-8\">\n  <title>Canvas Drawing Rectangles</title>\n\
  \  <script><!--\n    window.addEventListener('load', function () {\n      // Get\
  \ the canvas element\n      var elem = document.getElementById('myCanvas');\n  \
  \    if (!elem || !elem.getContext) {\n        return;\n      }\n      // Get the\
  \ canvas 2d context\n      var context = elem.getContext('2d');\n      if (!context)\
  \ {\n        return;\n      }\n      // Insert your custom Canvas code here\n  \
  \  });\n  // --></script>\n</head>\n<body>\n  <canvas id=\"myCanvas\" width=\"300\"\
  \ height=\"300\">\n    No support for Canvas.\n  </canvas>\n</body>\n</html>\n```\n\
  \n[Listing 9.1] 包含一个 HTML `<head>` 元素，用于检查 Web 页面 HTML `<body>` 元素内部是否存在 HTML `<canvas>`\
  \ 元素，然后从 HTML `<canvas>` 元素获取 2D 上下文。如果你跳过 [Listing 9.1] 中的各种条件语句，有两行代码使我们获取变量 `context`\
  \ 的引用，该变量代表一个可绘制表面：\n\n```javascript\nvar elem = document.getElementById('myCanvas');\n\
  var context = elem.getContext('2d');\n```\n\n\n\n\n\n```javascript\nvar context\
  \ = elem.getContext('2d');\n```\n\n如果你将示例 9.1 运行在不支持 HTML5 Canvas 的浏览器中，屏幕将显示文本消息“No\
  \ support for Canvas.（不支持 Canvas）”。\n\n由于在加载事件期间执行了一个匿名 JavaScript 函数，每当你启动该网页时，都会执行以下代码段：\n\
  \n```html\n<script><!--\nwindow.addEventListener('load', function () {\n  // 在此处执行某些操作\n\
  });\n// --></script>\n```\n\n现在你已经了解了渲染基于 Canvas 的 2D 形状的底层代码，可以专注于实际绘制某些 2D 形状的代码了，从下一节的示例开始。\n\
  \n# 线段、矩形、圆形和阴影效果 (#toc.html_toc-h1-0086)\n\n本节包含各种代码示例，用于阐述如何在 HTML5 Canvas 中渲染\
  \ 2D 形状。本节引入了许多概念，因此在深入研究代码示例之前，让我们先看看本节中用到的一些 HTML5 Canvas API。第 2 章 包含一个描述指定颜色多种方式的章节，该章节的内容与本章中的代码示例相关（如果你需要，现在可以快速回顾其内容）。\n\
  \nHTML5 Canvas 提供了用于渲染矩形的 `fillRect()` 方法，它需要四个参数：矩形的左上角顶点（由其 `x` 坐标和 `y` 坐标定义）、矩形的宽度以及目标矩形的高度。`Canvas\
  \ fill()` API 如下：\n\n```javascript\ncontext.fillRect(x, y, width, height);\n```\n\
  \nHTML5 Canvas 允许你通过指定线段两个端点的 `(x,y)` 坐标来渲染线段。本节代码示例中用到的两个新 API 是 `moveTo()` 和 `lineTo()`，它们的形式如下：\n\
  \n```javascript\ncontext.moveTo(x1, y1);\ncontext.lineTo(x2, y2);\n```\n\n前面的代码段代表两个端点由点\
  \ `(x1, y1)` 和 `(x2, y2)` 指定的段。请注意，你也可以使用以下代码段渲染相同的线段：\n\n```javascript\ncontext.moveTo(x2,\
  \ y2);\ncontext.lineTo(x1, y1);\n```\n\n阴影效果提供了比非阴影效果更丰富的视觉体验，是对者的改进。你通过为三个与阴影相关的属性赋值来创建阴影效果，这些属性控制底层阴影的大小以及阴影的“模糊”程度，如下所示：\n\
  \n```javascript\ncontext.shadowOffsetX = shadowX;\ncontext.shadowOffsetY = shadowY;\n\
  context.shadowBlur = 4;\n```\n\n你还可以为 `shadowColor`（它是绘图上下文的属性）分配 `(R,G,B)` 或 `(R,G,B,A)`\
  \ 值，如下所示：\n\n```javascript\ncontext.shadowColor = \"rgba(0,0,64,1.0)\";\n```\n\n\
  示例 9.2 中的 HTML5 网页 `RandRectanglesShadow.html`（为了起见省略了代码部分）使用了这种技术来渲染一组带有阴影效果的随机生成矩形。\n\
  \n**示例 9.2 RandRectanglesShadow.html**\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Canvas Random Rectangles With\
  \ Shadow Effects</title>\n  <link href=\"CSS3Background2.css\" rel=\"stylesheet\"\
  \ type=\"text/css\">\n  <script><!--\n    window.addEventListener('load', function()\
  \ {\n      redrawCanvas = function() {\n        // 在绘制新一组矩形之前清除画布\n        context.clearRect(0,\
  \ 0, elem.width, elem.height);\n        for(var r=0; r<rectCount; r++) {\n     \
  \     basePointX = canWidth*Math.random();\n          basePointY = canHeight*Math.random();\n\
  \          // 根据奇偶数点击计数使用不同的 (R,G,B,A)\n          // 值交替阴影效果\n          if(clickCount\
  \ % 2 == 0) {\n            context.shadowColor = \"rgba(0,0,64,1.0)\";\n       \
  \   } else {\n            context.shadowColor = \"rgba(64,0,0,1.0)\";\n        \
  \  }\n          // 指定底层阴影效果的大小以及\n          // \"模糊\"程度的代码\n          context.shadowOffsetX\
  \ = shadowX;\n          context.shadowOffsetY = shadowY;\n          context.shadowBlur\
  \ = 4;\n          context.lineWidth = 1;\n          // 渲染一个彩色矩形\n          colorIndex\
  \ = Math.floor(basePointX)%fillStyles.length;\n          context.fillStyle = fillStyles[colorIndex];\n\
  \          context.fillRect(basePointX, basePointY, rectWidth, rectHeight);\n  \
  \        ++clickCount;\n        }\n      }\n      // 渲染一组随机矩形\n      redrawCanvas();\n\
  \    });\n  // --></script>\n</head>\n<body>\n  <canvas id=\"myCanvas\" width=\"\
  800\" height=\"350\">No support for Canvas</canvas>\n</body>\n</html>\n```\n\n\n\
  \n\n\n## HTML5 Canvas 线性渐变\n\nHTML5 Canvas 提供了两种主要的颜色渐变（类似于 SVG 和 CSS3）：*线性渐变*和*径向渐变*。\n\
  \n线性颜色渐变可以进一步细分为三种：水平线性渐变、垂直线性渐变和对角线线性渐变。因此，HTML5 Canvas 提供的颜色渐变使你能够创建愉悦的视觉效果。\n\
  \n线性渐变通过 `ColorStop` 元素定义，每个元素包含一个小数（在 0 到 1 之间）和一个表示颜色的十六进制值。例如，如果你定义一个初始颜色为 `#FF0000`（红色的十六进制值）且结束颜色为\
  \ `#000000`（黑色的十六进制值）的线性渐变，那么生成的颜色渐变将（线性地）从红色过渡到黑色。线性渐变让你能够创建生动且有趣的颜色组合，它们有三种形式：水平、垂直和对角线。注意，书中“线性渐变”和“线性颜色渐变”是互换使用的。\n\
  \n### 水平、垂直和对角线线性渐变\n\n正如你在本章引言中所学到的，HTML5 Canvas 支持 `createLinearGradient()` 方法，你可以用它通过编程方式创建线性渐变。其语法如下：\n\
  \n```\ncontext.createLinearGradient(startX, startY, endX, endY);\n```\n\n![image](img/cd.jpg)\
  \ [Listing 9.4] 中的 HTML5 页面 `LGradRectangles1.html` 展示了如何渲染一组具有水平、垂直和对角线线性渐变的矩形。[Listing\
  \ 9.3] 引用了 CSS3 样式 `HoverAnimation1.css`，该样式每当用户用鼠标悬停在该 HTML5 `<canvas>` 元素上时，会将基于\
  \ CSS3 关键帧的 2D 动画应用到该元素。[Listing 9.4] 也引用了 CSS3 样式 `HoverAnimation2.css`，其工作方式类似。然而，该样式表对\
  \ [Listing 9.3] 中的第二个 HTML5 `<canvas>` 元素应用了 CSS3 3D 动画效果。由于这些 CSS 样式表中的动画技术已在第\
  \ 2 章讨论过，我们将在本章中省略它们，但完整的源代码可以在 CD 上找到。\n\n### LISTING 9.3 LGradRectangles1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>Canvas Linear Gradient Rectangles</title>\n  <link href=\"HoverAnimation1.css\"\
  \ rel=\"stylesheet\" type=\"text/css\">\n  <link href=\"HoverAnimation2.css\" rel=\"\
  stylesheet\" type=\"text/css\">\n  <script>\n    window.addEventListener('load',\
  \ function () {\n      redrawCanvas = function() {\n        // 在绘制新一组矩形之前清空画布\n\
  \        //context.clearRect(0, 0, elem.width, elem.height);\n        //context2.clearRect(0,\
  \ 0, elem.width, elem.height);\n        // 左上角矩形：水平线性渐变\n        currentX = basePointX;\n\
  \        currentY = basePointY;\n        gradient1 = context.createLinearGradient(\n\
  \                                            currentX,\n                       \
  \                     currentY,\n                                            currentX+rectWidth,\n\
  \                                            currentY+0*rectHeight);\n        gradient1.addColorStop(0,\
  \ '#f00');\n        gradient1.addColorStop(1, '#00f');\n        context.fillStyle\
  \ = gradient1;\n        context.fillRect(currentX, currentY,\n                 \
  \        rectWidth, rectHeight);\n        // 右上矩形：垂直线性渐变\n        // 为了简洁省略了相似代码\n\
  \        // 在第二个 <canvas> 元素中\n        // 渲染左下方的矩形\n        // 左下角矩形：对角线线性渐变\n \
  \       // 为了简洁省略了相似代码\n        // 右下角矩形：对角线线性渐变\n        // 为了简洁省略了相似代码\n     \
  \   ++clickCount;\n        basePointX += 4;\n        basePointY += 2;\n      } //\
  \ 线性渐变\n      redrawCanvas();\n    }, false);\n  </script>\n</head>\n<body>\n  <div>\n\
  \    <canvas id=\"myCanvas\" width=\"600\" height=\"250\"></canvas>\n  </div>\n\
  \  <div>\n    <canvas id=\"myCanvas2\" width=\"600\" height=\"250\"></canvas>\n\
  \  </div>\n  <div>\n    <input type=\"button\" onclick=\"redrawCanvas();\" value=\"\
  Redraw Rectangles\" />\n  </div>\n</body>\n</html>\n```\n\n[Listing 9.3] 渲染线性渐变。通过\
  \ `addColorStop()` 方法的三次或四次调用，线性渐变可以实现不同的颜色组合。尝试不同的颜色停止值，看看它们如何影响渲染的矩形。\n\n![image](img/fig9.3)\n\
  \n***图 9.3*** Nexus 7 线性渐变\n\n### 径向渐变\n\n径向颜色渐变是第二种 HTML5 颜色渐变。你可以通过 `createRadialGradient()`\
  \ 方法定义径向渐变，使用 `addColorStop()` 方法添加颜色值。其语法（不包含 `addColorStop()` 方法）如下：\n\n```\n\
  context.createRadialGradient(startCenterX, startCenterY, startRadius, endCenterX,\
  \ endRadius);\n```\n\n*径向*颜色渐变可以与向池塘中丢石头产生的波纹效应相比，每个“波纹”都有按渐变变化的颜色。每个波纹对应一个颜色停止元素。例如，如果你定义一个起始颜色为\
  \ `#FF0000`（红色）且结束颜色为 `#000000`（黑色）的径向渐变，那么生成的颜色渐变将（径向地）从红色过渡到黑色。径向渐变也可以包含多个起始/停止组合。需要注意的是，径向渐变按*线性*方式改变颜色，但渲染的颜色是以组扩展圆形绘制的。注意，“径向渐变”和“径向颜色渐变”在书中是互换使用的。\n\
  \n![image](img/cd.jpg) HTML5 页面 `RGradRectangles1.html` 使用线性和径向渐变在 HTML5 `<canvas>`\
  \ 元素中渲染线段、矩形和圆形，可以在 CD 上找到。\n\n```javascript\ngradient1 = context.createRadialGradient(\n\
  \                                            currentX,\n                       \
  \                     currentY,\n                                            0,\n\
  \                                            currentX+rectWidth,\n             \
  \                               currentY+rectHeight);\n\ngradient1.addColorStop(0,\
  \ '#f00');\ngradient1.addColorStop(1, '#00f');\ncontext.fillStyle = gradient1;\n\
  context.fillRect(currentX, currentY,\n                 rectWidth, rectHeight);\n\
  ```\n\n`RGradRectangles1.html` 与 Listing 9.3 类似，但使用的是径向渐变（而不是线性渐变），通过调用 `addColorStop()`\
  \ 方法向径向渐变添加四个“颜色停止值”。\n\n![image](img/fig9.4.jpg)\n\n***图 9.4*** iPad3 上的径向渐变矩形\n\
  \n\n\n\n\n图 9.4 显示了在 iPad3 上横屏模式下，基于 `RGradRectangles1.html` 的一组带有径向渐变的矩形。\n\n##\
  \ HTML5 Canvas 变换与状态保存\n\nHTML5 Canvas 允许你通过以下方法对 2D 形状和文本字符串进行旋转、缩放、倾斜或平移（水平和/或垂直位移）：\n\
  \n- `rotate(x,y)`\n- `scale(x,y)`\n- `transform(x1,y1,x2,y2,x3,y3)`\n- `translate(x,y)`\n\
  \n需要注意的是，你必须在 HTML5 Web 页面中实际渲染图形形状*之前*，指定你想要应用的变换（以及设置属性值）。\n\n以下代码段说明了你可以在上述 Canvas\
  \ 方法中使用的示例值，其中 `context` 是引用 HTML5 `<canvas>` 元素上下文的 JavaScript 变量：\n\n```javascript\n\
  context.rotate(30*Math.PI/180);\ncontext.scale(0.8, 0.4);\ncontext.translate(100,\
  \ 200);\ncontext.transform(1, 0, 0.5, 1, 0, 0);\n```\n\n上述代码块中的 `rotate()` 方法引用了\
  \ JavaScript 常量 `Math.PI`，其值代表 PI 弧度。如果你忘记了，PI 弧度等于 180 度，因此 `2*PI` 弧度是 360 度，`PI/2`\
  \ 弧度是 90 度。因此，`Math.PI/6` 弧度（或 `30*Math.PI/180`）等于 30 度。你不需要了解更多弧度的知识，但如果你想阅读提供额外示例教程，可以自行搜索。\n\
  \nHTML5 Canvas 中的两个额外 API 是 `save()` 和 `restore()`，它们允许你保存画布当前的状态，进行更改，然后恢复画布的原始状态。`save()`\
  \ 方法将当前状态“推入”栈中，而 `restore()` 方法从栈中“弹出”最近一次的状态。\n\n你可以在应用本节列出的任何变换之后，也可以在指定阴影相关属性（等）的值之后，保存（并稍后恢复）画布状态。你可以在画布状态上多次调用\
  \ `save()` 和 `restore()` 方法，这使得这两个方法对于游戏相关的 Web 页面非常有用。我们不会在本章的任何代码示例中使用这两个方法，但你可以通过网络搜索阅读教程并找到代码示例。\n\
  \n![image](img/cd.jpg) CD 中的 HTML5 Web 页面 `JQMCanvasTransforms1.html` 展示了如何将四个 HTML5\
  \ Canvas 变换应用于文本字符串。\n\n## jCanvas：一个用于 HTML5 Canvas 的 jQuery 插件\n\njCanvas jQuery\
  \ 插件允许你使用 jQuery 语法来指定在 HTML5 `<canvas>` 元素中渲染的 2D 形状。它的主页在这里：\n\n*[http://calebevans.me/projects/jcanvas/]*\n\
  \nCD 中的 HTML5 Web 页面 `JCanvasSamples1.html` 展示了如何使用 `jCanvas` 渲染几个 2D 形状。\n\n![image](img/fig9.5.jpg)\n\
  \n***图 9.5***iPad3 上的 jQuery jCanvas 插件。\n\n图 9.5 显示了在 iPad3 上横屏模式渲染 `JCanvasSamples1.html`\
  \ 的结果。\n\n你也可以将 jQuery Mobile 与 HTML5 Canvas 使用，如下一节的代码示例所示。\n\n## 结合 CSS3 和 jQuery\
  \ Mobile 的 HTML5 Canvas\n\n到现在，我们希望你已经理解如何在 HTML5 Canvas 中渲染 2D 形状。本节包含一个代码示例，向你展示如何结合\
  \ jQuery Mobile、HTML5 Canvas 以及当用户点击此网页中 HTML5 `<canvas>` 元素内部时动态创建 HTML `<div>`\
  \ 元素。\n\n记住，尽管图形效果并不一定是你需要的，但此代码示例确实说明了如何在 jQuery Mobile 中处理元素的动态创建以及点击事件（其处理方式与\
  \ jQuery 中的点击事件不同）。\n\n列表 9.4 显示了 HTML5 Web 页面 `JQMCanvas1.html` 的内容，列表 9.5 显示了\
  \ CSS 样式表 `JQMCanvas1.css`，其 CSS3 选择器匹配 HTML5 Web 页面 `JQMCanvas1.html` 中的元素。\n\n\
  ***列表 9.4 JQMCanvas1.html***\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n \
  \ <head>\n    <meta charset=\"utf-8\">\n    <title>JQueryMobile and Canvas Graphics</title>\n\
  \    <link rel=\"stylesheet\" href=\"JQMCanvas1.css\" />\n    <link rel=\"stylesheet\"\
  \n      href=\"http://code.jquery.com/mobile/1.1.0/\n                          \
  \    jquery.mobile-1.1.0.min.css\" />\n    <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  >\n    </script>\n    <script\n      src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  >\n    </script>\n    <script\nsrc=\"http://code.jquery.com/mobile/1.1.0/\n    \
  \                          jquery.mobile-1.1.0.min.js\">\n    </script>\n    <script>\n\
  \      var tapCount = 0;\n      var xCoord = 0, yCoord = 0;\n      var rectWidth\
  \ = 20, rectHeight = 20;\n      var rectColors = Array('#ff0', '#0f', '#0f');\n\
  \      var elem, context;\n      var gradient1 = '-webkit-gradient(radial, 25%,\
  \ 50%, 20%, from(red), color-stop(0.05, orange), color-stop(0.4, yellow), color-stop(0.6,\
  \ red), color-stop(0.9, blue), to(#fff))\n      var gradient2 = '-webkit-gradient(radial,\
  \ 25%, 50%, 20%, from(blue), color-stop(0.05, orange), color-stop(0.4, red), color-stop(0.6,\
  \ black), color-stop(0.9, blue), to(#f0))\n      var gradient3 = '-webkit-gradient(radial,\
  \ 25%, 50%, 20%, from(blue), color-stop(0.05, yellow), color-stop(0.4, green), color-stop(0.6,\
  \ red), color-stop(0.9, blue), to(#fff))\n      var gradient4 = '-webkit-gradient(radial,\
  \ 25%, 50%, 20%, from(blue), color-stop(0.05, yellow), color-stop(0.2, green), color-stop(0.6,\
  \ blue), color-stop(0.8, red), to(#fff))\n      var currentBG;\n      $(\"#page1\"\
