  \n<script src=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.1/jquery-ui.min.js\"\
  >\n</script>\n```\n\n你必须使用第二个 `<script>` 元素，因为第一个 `<script>` 元素无法正常工作。列表 1 显示了当你启动\
  \ HTML 页面并尝试拖放任何图像时，Web 检查器中的输出。\n\n![image](img/fig1.jpg)\n\n***图 1*** Web 检查器中来自\
  \ jQuery 迁移插件的错误消息。\n\n如果你启动 HTML 页面并发现“晦涩”的错误消息，请检查 `jQuery` 网站获取基于 CDN 的 JavaScript\
