  \ 的下一部分使用五个颜色停止点的线性渐变渲染了二次贝塞尔曲线。\n\n请注意，每当用户点击“重绘（redraw）”按钮时，都会根据用户每次点击“重绘”按钮时增加的变量\
  \ `clickCount` 的值绘制另一条三次和二次贝塞尔曲线。新曲线叠加在之前的曲线上，从而营造出良好的视觉效果。然而，如果你想在渲染另一对贝塞尔曲线之前刷新\
