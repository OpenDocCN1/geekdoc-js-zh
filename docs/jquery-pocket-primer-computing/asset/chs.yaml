  \ 插件：`http://plugins.com/projects/type=45`。你也可以在 HTML5 DnD 中配合使用 jQuery Mobile，尽管我们不会讨论相关示例（由于空间限制），但你可以进行互联网搜索查找教程和代码示例，或者从此链接中的详情开始：`http://www.plugins.com/Scripts/View/Jquery-Drag-Drop/`。\n\
  \n# jQuery 和 HTML5 本地存储\n\nHTML5 提供了本地存储（local storage）和会话存储（session storage），使\
  \ Web 页面能够本地存储。虽然书中没有讨论这些内容，但你可以通过互联网搜索来了解它们的功能。本节介绍了 jQuery 插件，它们为本地存储和会话存储提供了一层抽象。\n\
  \njQuery 插件 `jStorage` 是一个跨浏览器插件，允许你使用 jQuery 语法管理本地存储中的数据，其主页在此：`http://www.jstorage.info/`。`jStorage`\
  \ API 允许你获取、设置和删除存储中的数据。你还可以检查存储是否可用，以及存储数据的大小（以字节为单位）。为了方便起见，这里列出了命名直观的 `jStorage`\
  \ API：`$.jStorage.set(key, value)`、`$.jStorage.get(key)`、`$.jStorage.deleteKey(key)`、`$.jStorage.flush()`、`$.jStorage.index()`、`$.storageStorage()`storage()`()`$.StorageStorage()`()`()``Storage.re()`()`Init()`jStorage.storageAvailable()`。\n\
  \n如果本地存储或会话存储不可用（例如在 IE6 或 IE7 中），`jStorage` 会添加填充程序（polyfills）来支持此功能。`Listing 5.5`\
  \ 显示了 `JQJStorage1.html` 的内容，并演示了如何使用 `jStorage` 保存数据。\n\n**列表 5.5 JQJStorage1.html**\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=utf-8 />\n\
  \  <title>JStorage Example</title>\n  <link rel=\"stylesheet\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.1/jquery-ui.min.js\"\
  >\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/jquery-ui-1.8.14.custom.min.js\"></script>\n  <script src=\"\
  jstorage.js\"></script>\n</head>\n<body>\n  $(document).ready(function() {\n   \
  \ // 检查存储中是否存在 \"key\"\n    var value = jStorage.get(\"key\");\n    if(!value){\n\
  \      // 从服务器加载数据\n      value = load_data_from_server()\n      // 保存值\n      jStorage.set(\"\
  key\",value)\n    }\n  });\n  <div id=\"content\"></div>\n</body>\n</html>\n```\n\
  \n`Listing 5.5` 中的核心功能位于一个 JavaScript 代码块中，通过条件逻辑检查存储中是否存在数据项 `key`。如果该值不存在，则调用\
  \ `load_data_from_server()` 函数（该函数未实现），并将结果存储在本地存储中。你也可以使用用于 HTML5 存储的 jQuery 插件\
  \ `jStore`。\n\n# HTML5 本地存储库\n\n有很多本地存储的 JavaScript 工具包，其中一些使用了 jQuery（另一些则没有）。本节简要介绍一些可用工具包。\n\
  \n*lscache* 使用 HTML5 localStorage 模拟 memcache 功能，在客户端浏览器缓存数据，并为每个数据项设置过期时间。`lscache`\
  \ 的首页在此：`https://github.com/pamelafox/lscache`。如果超过 localStorage 限制（约 5MB），将移除接近过期的项目。如果\
  \ localStorage 不可用，`lscache` 不缓存任何内容（所有缓存请求都返回 `null`）。`lscache` 方法包括 `set()`、`get()`、`remove()`\
  \ 和 `flush()`，且此处提供一个 jQuery `lscache` 插件：`https://github.com/mckamey`。\n\n*YQL\
  \ LocalCache* 是一个用于 YQL 的封装器以支持本地存储，其首页在此：`https://github.com/phunkei/autoStorage`。一个使用\
  \ YQL LocalCache 使用自解释参数的调用示例在此：\n\n```javascript\nyqlcache.get({\n  yql: 'select\
  \ * from flickr.photos.search where text=\"warsaw\"',\n  id: 'myphotos',\n})\n```\n\
  \n\n\n\n\n```javascript\ncacheage: ( 60*60*1000 ),\n  callback: function(data) {\n\
  \    console.log(data);\n  }\n});\n```\n\n`callback` 中返回的数据是一个包含两个属性的对象：`data`（YQL\
  \ 数据）和 `type`（缓存数据为 `cached`，新缓存数据为 `freshcache`）。你可以在这里获取额外的代码示例：\n\n[`github.com/codepo8/yql-localcache`](https://github.com/codepo8/yql-localcache)\n\
  \n`Savify` 是一个 jQuery 插件，用于在用户填写表单时自动记录其进度。它的主页在此处：\n\n[`github.com/blackcoat/Savify`](https://github.com/blackcoat/Savify)\n\
  \n## jQuery 和 HTML5 文件 API\n\nHTML5 File APIs 允许你在文件系统上创建、读取和写入文件。第一步是获取 HTML5 `FileSystem`\
  \ 的访问权限，之后你就可以执行文件相关操作。你可以在这里阅读这些 API 并查看一些代码示例（并确保检查你的目标浏览器是否支持）：\n\n[`blueimp.github.com/jQuery-File-Upload/`](http://blueimp.github.com/jQuery-File-Upload/)\n\
  \n[`www.htmlgoodies.com/html5/other/responding-to-html5-filereader-events.html`](http://www.htmlgoodies.com/html5/other/responding-to-html5-filereader-events.html)\n\
  \n![image](img/cd.jpg) CD 包含 HTML Web 页面 `JQFileInfo1.html`，它说明了如何使用 `jQuery` 来显示用户选择的文件属性。一个更有趣（且有用）的示例是列表\
  \ 5.6 中的 `JQFileUpload2.html`，它说明了如何使用 `jQuery` 和 `XHR2` 上传文件。\n\n### 列表 5.6 JQFileUpload2.html\n\
  \n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n  <meta charset=utf-8 />\n\
  \  <title>File Upload with XHR2</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <script>\n    $(document).ready(function () {\n      var url\
  \ = \"http://localhost:8080/\";\n      $(\"body\").on(\"change\", '#fileUploader',\
  \ function() {\n        // 准备 post 数据\n        var data = new FormData();\n    \
  \    data.append('uploadfile', this.files[0]);\n        // 调用 jQuery .ajax 方法：\n\
  \        $.ajax({\n          url: url,\n          type: 'POST',\n          contentType:\
  \ false,\n          processData: false,\n          data: data,\n          success:\
  \  function(data) {\n            //在此处做些什么\n          },  \n          dataType:\
  \ 'text'\n        });\n      });\n    });\n  </script>\n  <div>\n    <input id=\"\
  fileUploader\" type=\"file\" multiple />\n  </div>\n</body>\n</html>\n```\n\n列表\
  \ 5.6 包含一个 HTML `<input>` 字段，允许用户从文件系统选择文件。选择文件后，会触发 jQuery 的 `change` 事件，并创建且填充一个\
  \ `XHR2` 对象（前文已讨论过），所示：\n\n```javascript\nvar data = new FormData();\ndata.append('uploadfile',\
  \ this.files[0]);\n```\n\n选中的文件通过 jQuery 的 `.ajax()` 方法上传，该方法包含一个 `success` 函数，该函数在\
  \ AJAX 请求完成后会被调用。请注意，你必须将 `contentType` 和 `processData` 的值设置为 `false`，否则你将在 Web\
  \ 检查器中收到以下错误：`Uncaught TypeError: Illegal invocation`。\n\n以下链接提供了关于这两个参数的解释：\n\n\
  [`stackoverflow.com/questions/1243170/html5-formdata-upload-with-rubyonrails`](http://stackoverflow.com/questions/1243170/html5-formdata-upload-with-rubyonrails)\n\
  \n### jQuery-filedrop\n\n如果你想在 HTML5 页面中使用 jQuery 插件上传文件，有几种可选的插件，例如跨浏览器插件 `jquery-filedrop`。它的主页在此处：\n\
  \n[`github.com/weixiyen/jquery-filedrop`](https://github.com/weixiyen/jquery-filedrop)\n\
  \n## HTML5 History APIs\n\n在 HTML5 之前，浏览器对历史相关的 API 提供的功能有限。你可以找到浏览器历史中的项目数量、前进和后退以及几个链接，所示：\n\
  \n```javascript\nconsole.log(history.length);\nconsole.log(history.forward());\n\
  console.log(history.back());\nconsole.log(history.go(-2));\n```\n\n有几个新的 API 可用，所示：\n\
  \n```javascript\nhistory.pushState(data, title, url);\nhistory.replaceState(data,\
  \ title, url);\n```\n\n`history.pushState()` 方法中的参数如下：\n* `data` 是某种类型的结构化数据，被分配给历史记录。\n\
  * `title` 是历史下拉菜单中项目的名称，由浏览器的后和前进按钮显示。\n* `url` 是显示在地址栏中的（可选）URL。\n\n`history.replaceState()`\
  \ 方法中的参数与 `history.pushState()` 方法相同，不同在于前者更新浏览器历史记录中已存在的信息。此外，还有一个新的 `popstate`\
  \ 事件，它在用户查看其历史记录时发生，你可以按照以下方式使用它：\n\n```javascript\nwindow.addEventListener(\"popstate\"\
  , function(event) {\n  //在此处做些什么\n});\n```\n\n请记住，不同的浏览器以不同的方式实现 HTML5 浏览器历史，因此以下\
  \ JavaScript 工具包非常有用：\n\n[`github.com/balupton/History.js/`](https://github.com/balupton/History.js/)\n\
  \n`History.js` 工具包支持 `jQuery`、`MooTools` 和 `Prototype`。在 HTML5 浏览器中，你可以直接修改 URL\
  \ 而无需求助于哈希值（例如 `example.com/#foo/`）。此外，更改片段不会触发页面刷新。\n\n## HTML5 离线 Web 应用程序\n\n\
  离线 Web 应用程序的目的很简单：用户即使在没有连接互联网也可以操作应用程序。当用户访问互联网时，他们的数据更改将同步，以确保所有内容处于一致状态。\n\n\
  包含演示、额外链接和类教程信息的网站在此处：\n\n[`appcachefacts.info/`](http://appcachefacts.info/)\n\n\
  HTML5 规范要求一个所谓的“清单文件”（建议后缀为 `.appcache`），它包含以下三个部分：\n* `CACHE`：将要缓存的文件列表\n* `NETWORK`：缓存之外的、只能在线访问的文件\n\
  * `FALLBACK`：指定当用户尝试访问未缓存资源时显示的资源\n\n作为一个简单的示例，列表 5.7 了一个了一个名为 `MyApp.appcache`\
  \ 的示例清单文件的内容。\n\n### 列表 5.7 MyApp.appcache\n\n```text\nCACHE MANIFEST\n# Version\
  \ 1.0.0\nCACHE:\nIndex.html\nCachedstuff.html\nMystyle.css\nMyimage.jpg\nNETWORK:\n\
  *\nFALLBACK:\n/noncached.html\n```\n\n你必须确保清单文件以以下 MIME 类型提供：`text/cache-manifest`。\n\
  \n其次，使用离线功能的 Web 应用程序必须在其一个页面顶部引用清单文件：\n\n```html\n<html lang=\"en\" manifest=\"\
  mymanifest.manifest\">\n```\n\n如果你有一个由提供商托管的 Web 页面，可以通过执行以下命令验证该 Web 页面包含正确的 MIME\
  \ 类型：\n\n```bash\ncurl –I http://www.myprovider.com/mymanifest.manifest\n```\n\n\
  ## 检测在线和离线状态\n\n在 HTML5 Web 页面中确定应用程序是否离线的简单方法是使用以下代码片段：\n\n```javascript\nif(navigator.online)\
  \ {\n  // 程序在线\n} else {\n  // 程序离线\n}\n```\n\n对于使用 `jQuery Mobile` 的移动应用程序，你可以使用以下代码块：\n\
  \n```javascript\n$(document).bind(\"offline\", function() {\n  // 程序离线\n});\n```\n\
  \n如上述代码块所示，绑定 `offline` 事件对于处理用户正在查看应用程序时应用程序变为离线的情况非常有用。\n\n\n\n\n\n此外，你只有在在线时才会向服务器发送数据，并在离线时通过\
  \ `HTML5 LocalStorage` 在本地存储数据。\n\njQuery 插件 `jquery-offline` 是一个跨浏览器插件，让你可以使用 jQuery\
  \ 语法编写离线应用程序。它的主页在这里：\n\n[`github.com/wycats/jquery-offline`](https://github.com/wycats/jquery-offline)\n\
  \n## 总结\n\n本章概述了各种 HTML5 技术，并根据它们目前的 W3C 状态对其进行了分类。为了方便起见，下面按字母顺序列出了这些 HTML5 技术：\n\
  \n*   CORS\n*   AJAX (XHR2)\n*   拖放\n*   File APIs\n*   表单\n*   地理位置信息\n\n# 第 6\
  \ 章\n\n## 单页应用简介\n\n本章介绍了单页应用，通常称为 `SPAs`。本章的第一部分简要讨论了在 JavaScript 中创建单页应用的理由。`XHR2`\
  \ 部分包含与 AJAX 相关的示例，从一个通用的 AJAX 代码示例开始，随后是一个基于 jQuery 的 AJAX 代码示例。本章的第二部分概述了 `BackboneJS`\
  \ 和 `Twitter Bootstrap`。本章第三部分包含了 `Jade`、`MongoDB`、`Mongoose` 和 `NodeJS` 的简要介绍。本章最后部分提供了一个极简\
  \ `SPA` 的代码，你可以用自己的自定义代码对其进行增强。\n\n## 什么是 SPA？\n\n让我们对 Web 应用程序架构进行一次旋风式的“回顾”。首先是服务器向网站交付静态页面，后来演变为可以向网站交付动态生成的\
  \ Web 页面（使用 `PHP` 等语言）的服务器。接着是 `AJAX` 的出现，它提供了部分页面刷新功能，这种方式效率更高而且提供了更好的用户体验。然后，出现了一系列基于\
  \ Comet 的解决方案，以使浏览器和服务器之间的通信更高效。最近，`HTML5 WebSockets` 通过使用 `WebSocket` 协议的持久 `TCP`\
  \ 连接，在浏览器和服务器之间提供了双向全双工异步通信。这是对所有早期 Web 应用基础的 `HTTP` 协议的改进。\n\n在此期间，人们设计了多种在浏览器和服务器之间划分代码的策略。其中一种方法涉及“厚服务器”，其中大多数操作（如生成动态\
  \ Web 页面和用户身份验证/校验）都在服务器上执行，并配合“薄客户端”（或浏览器），后者从服务器渲染 Web 页面，但额外的功能有限。\n\n### 现代\
  \ Web 架构\n\n最近，JavaScript 工具包大量出现，使人们能够使用“厚客户端”和“薄服务器”开发 Web 应用。尽管架构具有多样性（即使在最近的网站之间），但许多现代\
  \ Web 应用具有以下架构：\n\n*   `DOM`（包含只读数据）\n*   Models（包含应用程序的状态和数据）\n*   Modules（小型独立子系统）\n\
  *   Views（它们通过通知观察模型的变化）\n\n`SPAs` 基于上述现代 Web 应用的特征：它们有一个处理数据的模型层和一个从模型中读取数据的视图层，因此它们可以在不涉及服务器往返的情况下重绘\
  \ UI，这可以给 `SPAs` 带来更具“原生感”的感觉。更少的往返减少了服务器的负载，这显然是另一个优势。\n\n然而，请记住以下几点。首先，`SPA` 没有“规范”，而且\
  \ `SPA` 正随着社区人士的贡献随时间的推移而不断演变和改进。其次，某些使用 `SPA` 的工具包也会使用 `AJAX`，这可能破坏了 `SPA` 的“理想”设计。因此，不同的工具包（以及基于这些工具包的应用程序）对\
  \ `SPA` 有不同的实现，这反过来增加了你找到适合你特定需求的工具包的可能性。\n\n### MVC 和 MV 模式\n\n`MVC`（模型-视图-控制器）模式有完善的文档（有大量的在线信息），并且已经流行多年；然而，控制器的概念在\
  \ `SPAs` 和某些 JavaScript 工具包中可能不存在。“传统的” Web 应用使用页面刷新在独立视图之间进行导航，而基于 `SPA` 的 JavaScript\
  \ Web 应用可以（通过 `AJAX`）从服务器检索数据，并在同一个 Web 页面的不同视图中动态渲染数据。`Routers`（路由器）用于导航目的，因为在\
  \ `SPA` Web 应用中导航到不同视图时，URL 不会更新。\n\n尽管控制器通常在模型变化时更新视图（反之亦然），但大多数 JavaScript `MVC`\
  \ 框架在控制器的使用上倾向于与 `MVC` 模式有所不同。随着设计在社区中演变，根据个人偏好和经验出现了各种变体。由于没有哪个个人或组织推广 `MVC` 理念，这些变体可以自由共存。\n\
  \n与你在在线文章中读到的相反，`BackboneJS` 并没有 `MVC` 模式：当前版本中缺失控制器。（另外注意，早期版本中的 `Controller` 对象在后期版本中重命名为\
  \ `Router` 对象。）某些类似控制器的逻辑位于 `BackboneJS` 视图中以及 `BackboneJS` 路由器中（后者用于管理应用程序状态）。`BackboneJS`\
  \ 视图在模型发生变化时接收通知，并据此更新视图。`BackboneJS` 最好被归类为具有 `MV` 架构。\n\n此外，还有其他模型，例如 `MVP`（模型-视图-演示者）模式和\
  \ `MVVM`（模型-视图-视图模型，用于 `.NET` 框架和 `KnockoutJS`）。`MVP` 似乎更适合有大量大型视图的 Web 应用，其中演示者（Presenter）的角色与控制器重叠。\n\
  \n你可以在这里了解更多关于 `MVC` 和 `MVP` 的信息：\n\n[`martinfowler.com/eaaDev/uiArchs.html`](http://martinfowler.com/eaaDev/uiArchs.html)\n\
  \n### 在 SPA 中生成 Web 页面\n\n正如你所知，许多 Web 页面是在服务器上动态生成的，并将这些页面发送到浏览器。在现代 Web 应用中，一种解决方案是使用客户端模板生成\
  \ Web 页面。另一种解决方案是使用代码；这是更传统的方法。服务器渲染和客户端渲染 Web 页面的区别有助于强化这样一个事实：*服务器*渲染特定的 Web 页面，但*客户端*渲染随后的更新。\n\
  \n### 在 SPA 中处理模型相关事件\n\n处理模型数据变化的两种主要方案是观察者（observers）和事件发射器（event emitters），这两种方法之间没有太大区别。当发生变化时，“绑定”到该变化事件的代码会被触发。例如，事件是在对象上注册的：\n\
  \n```\nMyApp.on('change', function() { ... });\n```\n\n而观察者是通过全局名称注册的：\n\n```\n\
  Framework.registerObserver(window.MyApp,'change',function(){...});\n```\n\n观察者通常具有某种名称解析系统，你使用字符串来引用对象。通常为观察者添加一个全局名称解析系统（使用字符串而不是直接访问对象），以便使用观察者，观察者只有在它们所引用的对象实例化后才能注册。\n\
  \n### 用于 SPA 的客户端技术\n\n\n\n\n\n简而言之，SPA（单页应用）的客户端技术包括如 `jQuery`、`BackboneJS` 和 `Jade`\
  \ 等工具包。然而，你完全可以使用其他工具包，例如 `BackBoneJS` 的变体（如 `Spine`、`Vertebrae` 等），或完全不同的工具包（如\
  \ `EmberJS`）。除了 `Jade` 之外，还有其他模板引擎，包括 `Mustache` 和 `Handlebars`。请在互联网上搜索这些工具包的信息以及功能对比。\n\
  \n# BackboneJS\n\nBackbone.js 是一个用于开发结构化 Web 的开源 JavaScript 工具包，其主页在此：\n\n*http://Backbone.js.org/*\n\
  \n尽管 `Backbone.js` 没有基于 MVC（模型-视图-控制器）模式，但它们之间有一些相似之处。`Backbone.js` 提供了具有键值绑定和自定义事件的\
  \ `models`（模型）、具有枚举函数 API 的 `collections`（集合）以及具有声明式事件处理的 `views`（视图），这一切都通过 RESTful\
  \ JSON 接口与你现有的 API 连接。`Backbone.js` 是 `DocumentCloud` 的开源组件，并在 GitHub 上以 MIT 软件许可发布，你可以在那里找到源代码、在线测试套件、示例应用程序、教程列表以及使用\
  \ `Backbone.js` 的真实项目。\n\n从其 GitHub 仓库下载 `Backbone.js`：\n\n*https://github.com/documentcloud/backbone/*\n\
  \n## BackboneJS 简介绍\n\n以下子节将为你提供关于 `BackboneJS` 中模型（models）、视图（views）、集合（collections）和路由器（routers）的简单概述。在读完本节后，你可以搜索在线教程来查看\
  \ `BackboneJS` 应用的示例。\n\n### 什么是模型（Model）？\n\n根据 Backbone 作者的说法：\n\n“模型是任何 JavaScript\
  \ 应用的核心，包含了交互数据以及围绕它的大部分逻辑：转换、验证、计算属性和访问控制。”\n\n每当你创建一个模型的新实例时，就会调用 `initialize()`\
  \ 方法（这在 `BackboneJS` 中实例化新视图时也是如此）。下面的代码块显示了一个简单的示例：\n\n```javascript\nVehicle =\
  \ Backbone.Model.extend({\n    initialize: function(){\n        alert(\"I am a vehicle\"\
  );\n    }\n});\n\nvar vehicle = new Vehicle;\n```\n\n你可以通过两种方式之一在模型中设置参数。一种方法是使用构造函数，如下：\n\
  \n```javascript\nvar vehicle = new Vehicle({model: \"Ford\", make: \"Mustang\"});\n\
  ```\n\n另一种方法是使用 `set` 方法，如下：\n\n```javascript\nvehicle.set({make: \"Ford\", model:\
  \ \"Mustang\"});\n```\n\n在设置属性/值对后，你可以如下所示检索它们的值：\n\n```javascript\nvar make  =\
  \ vehicle.get(\"make\");  // \"Mustang\"\nvar model = vehicle.get(\"model\"); //\
  \ \"Ford\"\n```\n\n你还可以通过以下方式设置默认值：\n\n```javascript\nVehicle = Backbone.Model.extend({\n\
  \    defaults: {\n        make:   \"Ford\",\n        model:  \"Mustang\"\n    },\
  \  \n    initialize: function(){\n        alert(\"I am a vehicle\");\n    }  \n\
  });\n```\n\n### 模型更改（Model Changes）\n\n你可以监听模型的变化，并在检测到变化时执行代码。\n\n例如，这里是 `initialize`\
  \ 方法的新内容：\n\n```javascript\ninitialize: function(){\n    alert(\"I am a vehicle\"\
  );\n    this.bind(\"change:model\", function(){\n        var model = this.get(\"\
  model\");\n        alert(\"Changed my model to \" + model);\n    });\n}\n```\n\n\
  还有许多其他用于操作模型的功能，你可以在在线文档中查阅。\n\n### 什么是视图（View）？\n\n简单来说，`Backbone` 视图提供了应用程序中数据模型的视觉表示。此外，`Backbone`\
  \ 视图监听事件并对模型的变化做出响应，以确保给定视图中的数据与其关联的模型保持同步。\n\n```javascript\nSearchView = Backbone.View.extend({\n\
  \    initialize: function(){\n        alert(\"A view of a vehicle.\");\n    }\n\
  });\n\n// initialize 函数类似于构造函数，\n// 它在实例化 Backbone View 时总是被调用\nvar search_view\
  \ = new SearchView();\n```\n\n### 什么是集合（Collection）？\n\n`BackboneJS` 中的 `Collection`（集合）是模型的有序集合。`Collections`\
  \ 之所以有用是因为你可以在它们内部包含方法，用于从服务器获取数据，在返回集合之前对数据进行准备，并为调试/测试设置示例集合。\n\n此外，你还可以为集合添加事件监听器并将视图挂载到集合上，而在简单的\
  \ JavaScript 数组中无法做到这一点。\n\n作为一个简单的示例，我们可以使用上一节中创建的 `Vehicle` 模型在 `Backbone` 中创建如下所示的\
  \ `Collection`：\n\n```javascript\nvar Cars = Backbone.Collection.extend({\n  model:\
  \ Vehicle\n});\n\nvar vehicle1 = new Vehicle({ make: \"Ford\",  model: \"Mustang\"\
  \  });\nvar vehicle2 = new Vehicle({ make: \"GM\",     model: \"Camaro\"    });\n\
  var vehicle3 = new Vehicle({ make: \"GM\",   model: \"Corvette\" });\nvar myCars\
  \ = new Cars([ vehicle1, vehicle2, vehicle3]);\nconsole.log( myCars.models ); //\
  \ [vehicle1, vehicle2, vehicle3]\n```\n\n### 什么是路由器（Router）？\n\n`BackboneJS` 路由器用于映射需要可书签的\
  \ URL 碎片。请记住，路由应该至少包含一条路由。\n\n作为一个简单的示例，以下代码定义了一个 `Router`：\n\n```javascript\nvar\
  \ MyAppRouter = Backbone.Router.extend({\n  routes: {\n    \"*\": \"defaultRoute\"\
  \n  },\n  defaultRoute: function( actions ){\n    // 传递的变量与路由匹配\n    alert( actions\
  \ );\n  }\n});\n\n// 初始化路由器\nvar appRouter = new MyAppRouter();\n\n// 启动 Backbone\
  \ 历史（可书签 URL 需要）\nBackbone.history.start();\n```\n\n到此，对 `BackboneJS` 的简要介绍结束。下一节提供了一些实用的链接。\n\
  \n## 有用链接\n\n`BackboneJS` 教程合集在此：\n\n*http://backbonutorials.com/*\n\n使用 `Backbone`\
  \ 配合 `jQuery Mobile` 的示例：\n\n*http://coenraets.org/blog/2012/03/using-backbone-js-with-jquery-mobile/*\n\
  \n*http://weblog.bocoup.com/organizing-your-backbone-js-application-with-modules/**\n\
  \n# Backbone Boilerplate（骨架模板）\n\n`Backbone-boilerplate` 是一个开源 JavaScript 工具包，提供了类似于\
  \ `HTML5 Boilerplate` 等工具包的“样板”功能。其主页在此：\n\n*https://github.com/tbranyen/backbone-boilerplate*\n\
  \n`Backbone-boilerplate` 的安装说明包含在此发行版的 `readme.md` 文件中：\n\n*https://github.com/backbone-boilerplate/grunt-bbb*\n\
  \n安装过程相当冗长（超出了本章的限制），但如果你计划在代码中大量使用 `BackboneJS`，那么探索这个工具包是值得的。\n\n## Backbone 的变体\n\
  \n有很多 `BackboneJS` 的变体（它们也是 `Backbone` 的扩展），这里列出了其中一些：\n\n`pine.js`\n\n`joint.js`\n\
  \n`ligament.js`\n\n`vertebrae.js`\n\n`bones.js`（提供服务端功能）\n\n`hambone.js`\n\n`shinbone.js`\n\
  \n\n\n\n\n由于本章篇幅限制，无法对这些工具包进行讨论，但你可以通过互联网查找有关这些工具包的信息。\n\nBackboneJS 的另一个变体是 SpineJS，它使用了控制器（尽管它是基于\
  \ BackboneJS 的）。SpineJS 中的控制器在 Web 应用中充当“胶水”，并提供了传统控制器的功能。\n\n下面的 SpineJS 代码块定义了一个具有三个函数的控制器。该控制器同步模型的更改以更新\
  \ `views`（反之亦然）。将此代码与你在本章之前看到的 BackboneJS 代码块进行比较：\n\n```javascript\n// Controllers\
  \ inherit from Spine.Controller:\n\nvar RecipesController = Spine.Controller.sub({\n\
  \n  init: function(){\n    this.item.bind('update',  this.proxy(this.render));\n\
  \    this.item.bind('destroy', this.proxy(this.remove));\n  },\n  render: function(){\n\
  \    // Handle templating\n    this.replace($('#recipeTemplate').tmpl(this.item));\n\
  \    return this;\n  },\n  remove: function(){\n    this.$el.remove();\n    this.release();\n\
  \  }\n});\n```\n\n## EmberJS (#toc.html_toc-h1-0057)\n\n除了 BackboneJS 之外，还有各种工具包可用，其中最流行的是\
  \ EmberJS，其首页在此：\n\n*[`emberjs.com/`](http://emberjs.com/)\n\nEmberJS 应用在初始页面加载期间会下载所需的所有内容，这与\
  \ SPA（单页应用）是一致的。需要注意的是，EmberJS 采用了 MVC 模式，并非常强调路由器以及模板引擎。EmberJS 专注于处理“重型工作”，以应对一些更繁重的\
  \ JavaScript 任务。相比之下，BackboneJS 的方法要极简得多（但可以通过 Backbone Boilerplate 进行增强）。\n\n作为一个简单的示例，下面的代码块向你了如何在\
  \ EmberJS 中定义 JavaScript 对象。\n\n```javascript\nPerson = Ember.Object.extend({\n\
  \  greeting: function(msg) {\n    alert(msg);\n  }\n});\n\nvar person = Person.create();\n\
  \n// alert message: My Name is Dave\nperson.greeting(\"My name is Dave\");\n\nvar\
  \ person = Person.create({\n  name: \"Jeanine Smith\",\n  greeting: function() {\n\
  \    this.greeting(\"My name is \" + this.get('name'));\n  }\n});\n\n// alert message:\
  \ My Name is Jeanine\nperson.greeting();\n```\n\n你可以在 EmberJS 中扩展对象，如下所示：\n\n```javascript\n\
  var HappyPerson = Person.extend({\n  greeting: function(msg) {\n    this._super(greeting.toUpperCase());\n\
  \  }\n});\n```\n\n你可以在 EmberJS 中添加事件监听器，如下所示：\n\n```javascript\nperson.addObserver('name',\
  \ function() {\n  // do something after a name change\n});\n\nperson.set('name',\
  \ 'Oswald');\n```\n\n关于 BackboneJS 和 EmberJS 的详细对比在此：\n\n*[`www.i-programmer.info/programming/htmlcss/4966-creating-web-apps-the-camera-api.html`](http://www.i-programmer.info/programming/htmlcss/4966-creating-web-apps-the-camera-api.html)*\n\
  \n如果 BackboneJS 和 EmberJS 不符合你的需求，你可以搜索其他工具包。你还可以找到许多讨论各种工具包优点的在线文章，有时你还能找到提供直接对比各种工具包的文章。需要注意的是，可用的工具包非常多。如果时间有限，你可能需要将分析限制在少数工具包上，以便对其进行适当评估。\n\
  \n## Twitter Bootstrap (#toc.html_toc-h1-0058)\n\nTwitter Bootstrap 是一个用于创建网站和 Web\
  \ 应用的开源项目。该工具包包含了基于 HTML 和 CSS 的 UI 控制设计模板（例如表单、按钮、图表、导航等）以及用户交互。\n\n目前，Twitter\
  \ Bootstrap 是 GitHub 上关注度最高、分叉（fork）最多的仓库，你可以在此处下载它：\n\n*[`twitter.github.com/Bootstrap/`](http://twitter.github.com/Bootstrap/)*\n\
  \n*[`blog.getBootstrap.com/`](http://blog.getBootstrap.com/)*\n\nTwitter Bootstrap\
  \ 的初设计目的是作为记录最佳实践的指南，并帮助不同技能水平的人。Bootstrap 支持新的 HTML5 元素和语法，你可以将 Bootstrap 作为完整的工具包或用于启动更复杂的项目。\n\
  \nTwitter Bootstrap 最初是为现代浏览器设计的，但它已将其支持扩展到所有主流浏览器（包括 IE7）。此外，Twitter Bootstrap\
  \ 2.0 支持平板电脑和智能手机，其响应式设计意味着组件会根据一系列分辨率和设备进行缩放，从而提供一致的体验。此外，Twitter Bootstrap 提供了自定义的\
  \ `jQuery` 插件，并构建在 LESS 工具包之上。Twitter Bootstrap 2.0 的一些功能包括工具提示、样式化的状态按钮、更多的表格和表单样式以及改进后的结构。\n\
  \n## 极简主义 SPA (#toc.html_toc-h1-0059)\n\n\n\n\n\n本章剩余部分将向你展示如何设置几个服务器端工具包来创建一个非常简单的\
  \ SPA。你将看到“裸露”代码，这些代码为 SPA 提供了一个起点，使用户能够查看他们的朋友读过的书籍以及其他信息，例如评论、有趣的书籍引言等。此应用程序使用了以下技术：\n\
  \n- Jade\n- MongoDB\n- Mongoose\n- NodeJS\n\n本章的下一节将对前列表中尚未讨论过的技术进行高级描述。本章的最后一部分包含代码块，它们将帮助你理解\
  \ SPA 应用程序的逻辑。建议在此 SPA 中包含额外的工具包（如 BackboneJS 和 jQuery），这样你就可以扩展你的技能了。\n\n## Jade\n\
  \nJade 是一种流行的 NodeJS 模板语言，其主页在此：\n\n[`jade-lang.com/`](http://jade-lang.com/)\n\n\
  在此处下载 Jade：\n\n[`github.com/visionmedia/jade#readme`](https://github.com/visionmedia/jade#readme)\n\
  \n在解压 Jade 分包后，你可以使用以下命令创建一个的 Jade JavaScript 文件：\n\n```\nmake jade.js\n```\n\n\
  请注意，你也可以通过 npm（NodeJS 的包管理器）如下如下安装 Jade：\n\n```bash\nnpm install jade\n```\n\n###\
  \ Jade 代码示例\n\nJade 使用 HTML 标签来生成 HTML 元素，使用 `#` 语法生成 id 属性，使用 `.` 语法生成 class 属性。缩进指定了元素的嵌套。例如，下面的\
  \ Jade 代码块：\n\n```html\nhtml\n  head\n  body\n    div\n    div#myid\n    div.myclass\n\
  \      p my paragraph\n```\n\n会生成以下 HTML：\n\n```html\n<html>\n  <head></head>\n\
  \  <body>\n    <div></div>\n    <div id=\"myid\"></div>\n    <div class=\"myclass\"\
  ></div>\n    <p>my paragraph</p>\n  </body>\n</html>\n```\n\nJade 支持插值，因此你可以将数据传递给\
  \ Jade 文档。例如，假设你有以下数据：\n\n`{fname: john, lname: smith}`\n\n并且你有这个 Jade 元素：\n\n```jade\n\
  div #user #{fname} #{lname}\n```\n\n那么结果就是这个 HTML 元素：\n\n```html\n<div id=\"user\"\
  >john smith</div>\n```\n\nJade 还支持注释（单行和多行）、条件逻辑、“case”语句、过滤器和迭代。\n\n作为一个更具体的示例，列表\
  \ 6.1 显示了 `layout.jade` 的内容，它生成了一个非常基础的 HTML5 页面。\n\n**列表 6.1 layout.jade**\n\n\
  ```jade\ndoctype 5\nhtml\n  head\n    title= title\n    link(rel='stylesheet', href='/css/style.css')\n\
  \    script(src='/js/jquery-1.8.2.min.js')\n    script(src='/js/client.js')\n  \
  \  script(src='/js/templates.js')\n  body  \n    block content\n```\n\n如你在列表 6.1\
  \ 中所示，Jade 使用简单的语法来定义 CSS 样式表链接以及定义 HTML `<script>` 元素。\n\n此外，Jade 允许你扩展模板的内容并使用条件逻辑。列表\
  \ 6.2 根据 `user.id`（在其他地方定义）是否存在来扩展 `layout.jade` 的内容。\n\n**列表 6.2 index.jade**\n\
  \n```jade\nextends layout\nblock content\n  h1= title\n  - if (user.id)\n    p Hello\
  \ #{user.name}, and welcome to #{title}\n    p\n      a(href='/managebooks') My\
  \ Book List\n    p\n      a(href='/logout') Logout\n    #bookhistory\n  - else\n\
  \    div\n      a(href='/login') Login with password\n    div\n      a(href='/register')\
  \ Register\n```\n\n如你所见，列表 6.2 的第一部分（以“if”开头）显示了欢迎消息和一个链接，当前登录的用户可以通过那里查看书籍列表。列表\
  \ 6.2 的第二部分（以“else”开头）显示了一个带有登录页链接的 `<div>` 元素以及另一个用于注册页的 `<div>` 元素。\n\n### 使用\
  \ Jade 的最小 NodeJS 代码示例\n\n本节展示了如何创建一个微型的 NodeJS 应用程序，它使用了三个文件（放在 views 子目录下）和一个\
  \ JavaScript 文件：\n\n- `views/index.jade`\n- `views/layout.jade`\n- `views/navigation.jade`\n\
  - `server.js`\n\n以下是 `index.jade` 的内容：\n\n```jade\nh1\na(href='http://www.google.com/')\
  \ Google Page\n```\n\n以下是 `layout.jade` 的内容：\n\n```jade\ndoctype5\nhtml(lang='en')\n\
  \  head\n    title= title\n  body!= body\n```\n\n以下是 `navigation.jade` 的内容：\n\n\
  ```jade\ndiv#navigation\n  a(href='/') home\n```\n\n列表 6.3 显示了 `server.js` 的内容，它引用了本节中的三个\
  \ Jade 文件。\n\n**列表 6.3 server.js**\n\n```javascript\nvar express = require('express');\n\
  var app = express.createServer();\napp.configure(function () {\n  app.set('views',\
  \ __dirname + '/views');\n  app.set('view engine', 'jade');\n});\napp.get('/', function(req,\
  \ res) {\n  res.render('index.jade', { pageTitle: 'Jade Example', layout: false\
  \ });\n});\napp.listen(9000);\n```\n\n虽然我们还没有涵盖 Node 代码，但你可以看到代码创建了一个应用程序，设置了一些配置，然后渲染由\
  \ view 子目录下基于 Jade 的模板定义的 HTML 页面。更详细一点，列表 6.3 从创建一个名为 `app` 的基于 express 的应用程序开始。接下来，代码指定了当前目录的\
  \ views 子目录（由内置变量 `__dirname` 指定），并将 Jade 配置为“视图引擎”。下一部分代码指定了对 GET 请求要做什么，如下：\n\n\
  ```javascript\napp.get('/', function(req, res) {\n  res.render('index.jade', { pageTitle:\
  \ 'Jade Example', layout: false });\n});\n```\n\n此前的代码通过返回 `index.jade`（在 views\
  \ 子目录下）的内容来渲染响应，该内容是一个带有指向 Google 首页链接的 HTML 页面。最后一行代码监听 localhost 的 9000 端口。你必须通过\
  \ `cd` 进入该目录来启动此 Node 应用程序。\n\n### 其他模板解决方案\n\n有许多可用的其他模板解决方案，一些更流行的列在这里：\n\n- Mustache.js\n\
  - Handlebars.js\n- Dust.js\n- jQuery.tmpl 插件\n- Underscore Micro-templating\n- PURE\n\
  \n你可以在网上找到如何使用上述模板引擎的链接和教程。\n\n## MongoDB\n\nMongoDB 是一种流行的 NoSQL 数据库，其主页在此：\n\n\
  [`www.mongodb.org/`](http://www.mongodb.org/)\n\n开始使用 MongoDB 的地方是：\n\n[`mongolab.com/home`](https://mongolab.com/home)\n\
  \n在此网站下载并安装 MongoDB：\n\n[`www.mongodb.org/downloads`](http://www.mongodb.org/downloads)\n\
  \n安装 MongoDB 后，你可以通过在另一个 shell 中输入 `mongo` 来启动交互会话，允许允许从命令行管理 schema 并执行类 CRUD 操作（CRUD\
  \ 代表创建、读取、更新和删除，四个关键数据库操作）。\n\n例如，下面的命令序列向你展示如何在 users schema 中插入新用户（该 schema 在本章后面的\
  \ Mongoose 部分定义）。\n\n```bash\nmongo\n> use db\nswitched to db db\n> users = db.users\n\
  db.users\n> users.find();\n> users.insert({firstName:'a', lastName:'b'});\n> users.find()\n\
  {\n  \"_id\" : ObjectId(\"509425f82685d84f9c41c858\"),\n  \"firstName\": \"a\",\n\
  \  \"lastName\": \"b\"\n}\n```\n\n查阅文档可以获取有关在 MongoDB shell 中执行的命令的更多细节。\n\n## NodeJS\n\
  \nNodeJS 是一种执行 JavaScript 的流行的服务器技术。你可以从其主页下载并安装 NodeJS：\n\n\n\n\n\n[`nodejs.org/`](http://nodejs.org/)\n\
  \n![image](img/cd.jpg) 本节将仅描述基本信息以及你为了配合 CD 上示例应用程序中使用的 NodeJS 服务器而所需的模块。\n\n在你的机器上安装\
  \ NodeJS 之后，请使用以下命令安装 `express` 和 `mongoose`：\n\n```bash\nnpm install express\n\
  npm install mongoose\n```\n\n为了向你展示可以在不使用模板引擎（如 `Jade`）的情况下使用 NodeJS，列表 6.4 显示了\
  \ `HelloWorld.js` 的内容，当用户在浏览器中导航到 `localhost:5000` 时，该文件会显示文本字符串“Hello World”。\n\
  \n***列表 6.4 HelloWorld.js***\n\n```javascript\n//创建一个应用服务器\n\nvar express = require(\"\
  express\");\n\nvar app = express();\n\n//向客户端发送 'Hello World' \n\napp.get('/', function(req,\
  \ res) {\n    res.send('Hello World');\n});\n\napp.listen(5000);\n```\n\n按照如下方式从命令行启动应用程序：\n\
  \n```bash\nnode HelloWorld.js\n```\n\n启动浏览器并导航到 URL [`localhost:5000`](http://localhost:5000)。你将看到文本字符串“Hello\
  \ World.”\n\n现在你已经看到了如何启动简单的 NodeJS 应用程序（带有和不带模板的），你已经准备好创建一个使用 Mongoose 和 MongoDB\
  \ 的 NodeJS 应用程序，这是本章下一节的主题。\n\n# Mongoose (#toc.html_toc-h1-0063)\n\nMongoose 是一个用于\
  \ MongoDB 的 ORM（用 NodeJS 编写），它允许你在 MongoDB 数据库中定义模式（schemas），它的主页在这里：\n\n[`mongoosejs.com/index.html`](http://mongoosejs.com/index.html)\n\
  \n使用 npm 包管理器安装 Mongoose，如下：\n\n```bash\nnpm install mongoose\n```\n\n接下来的章节将向你展示如何通过\
  \ Mongoose 连接到 MongoDB 实例，随后是一个创建模式、创建模式实例、然后修改并将这些实例保存到 MongoDB 数据库的示例。\n\n## 通过\
  \ Mongoose 连接到 MongoDB (#toc.html_toc-h2-0046)\n\n你可以使用 `mongoose.connect()` 方法连接到\
  \ MongoDB。以下命令是连接到在默认端口（27017）运行的本地 `myapp` 数据库所需的最小值：\n\n```javascript\nmongoose.connect('mongodb://localhost/myapp');\n\
  ```\n\n你可以根据你的环境在 `uri` 中指定额外的参数：\n\n```javascript\nmongoose.connect('mongodb://username:password@host:port/database');\n\
  ```\n\n请参考文档获取连接 MongoDB 数据库的更多选项。\n\n## 在 Mongoose 中创建模式 (#toc.html_toc-h2-0047)\n\
  \nMongoose 中允许的 `SchemaTypes` 有：`String`、`Number`、`Date`、`Buffer`、`Boolean`、`Mixed`、`ObjectId`\
  \ 和 `Array`。\n\n首先，我们需要定义两个引用 mongoose 和 MongoDB 数据库的变量：\n\n```javascript\nvar mongoose\
  \ = require('mongoose'),\n    db = mongoose.createConnection('localhost', 'test');\n\
  ```\n\n现在让我们在 Mongoose 中创建一个简单的 `Person` 模式：\n\n```javascript\nvar personSchema\
  \ = new mongoose.Schema({\n    id:         Schema.Types.ObjectId,\n    firstName:\
  \ String,\n    lastName:  String\n})\n```\n\n我们可以为我们的 `Person` 模式添加方法，如下所示：\n\n\
  ```javascript\npersonSchema.methods.pname = function () {\n  var fullname = this.firstname+\"\
  \ \"+this.lastname;\n  console.log(fullname);\n}\n```\n\n接下来，我们按照如下方式将 `Person`\
  \ 模式编译为 `Model`：\n\n```javascript\nvar Person = db.model('Person', personSchema);\n\
  ```\n\n注意，模型（model）只是一个允许我们构建文档的类。在这个示例中，文档是一个 `Person` 对象。\n\n让我们创建两个 `Person`\
  \ 对象：\n\n```javascript\nvar p1 = new Person({ firstName: 'John', lastname: 'Smith'\
  \ })\nvar p2 = new Person({ firstName: 'Jane', lastname: 'Jones' })\n```\n\n最后，我们可以按照如下方式将对象保存到\
  \ MongoDB：\n\n```javascript\np1.save(function (error) {\n    if (error) {\n    \
  \    console.log(\"error saving p1\");\n    }\n});\n\np2.save(function (error) {\n\
  \    if (error) {\n        console.log(\"error saving p2\");\n    }\n});\n```\n\n\
  你可以在 Mongoose 模式中指定其他属性，例如索引、setter 和 getter。例如，下面的代码块向你展示如何通过几个额外的属性扩展 `User` 模式的定义：\n\
  \n```javascript\nmongoose.model('User', {\n  properties: ['first, 'last'],\n  cast:\
  \      {age: Number},\n  indexes:   ['first', 'last'],\n  setters:   {first: function(){}\
  \ },\n  getters:    {full_name: function(){} },\n  methods:   {save: function()\
  \ }\n});\n```\n\n## SPA 代码示例 (#toc.html_toc-h2-0048)\n\nSPA 代码示例创建了三个 Mongoose 模式来表示用户、书籍以及用户对书籍的评论。\n\
  \n`userSchema` 包含了用户的信息以及每个用户读过的书籍列表。这里存在一对多的关系（每个用户可以读多本书），如下所示：\n\n```javascript\n\
  var userSchema = new mongoose.Schema({\n  firstName: String,\n  lastName: String,\n\
  \  books: [Object]\n});\n```\n\n`bookSchema` 包含了书籍的信息以及对该书籍的评论列表。这里存在一对多的关系（每本书可以有多条评论），如下所示：\n\
  \n```javascript\nvar bookSchema = new mongoose.Schema({\n  title: String,\n  author:\
  \ String,\n  comments: [Object]\n});\n```\n\n`commentSchema` 包含了用户对书籍的评论。它引用了一个用户和一条书籍，如下所示：\n\
  \n```javascript\nvar commentSchema = new mongoose.Schema({\n  user: Schema.Types.ObjectId,\n\
  \  book: Schema.Types.ObjectId,\n  text: String\n});\n```\n\n\n\n\n\n```javascript\n\
  \  , app = express.createServer()\n\n  , mongoose = require('mongoose')\n\n  , db\
  \ = mongoose.createConnection('localhost', 'test');\n/* models */\n\nmongoose.connect('mongodb://127.0.0.1/sampledb');\n\
  \nvar Schema = mongoose.Schema\n\n  , ObjectId = Schema.ObjectID;\n\n// 在 Mongoose\
  \ 章节之前声明的 schemas\n\nvar userSchema = ...\n\nvar bookSchema = ...\n\nvar commentSchema\
  \ = ...\nvar Book    = db.model('Book', bookSchema);\nvar User     = db.model('User',\
  \ userSchema);\nvar Comment = db.model('Comment', commentSchema);\n\n// 一本新书，一个新用户，以及关于\n\
  // 新用户对新书的评论：\nvar b1 = new Book({bookAuthor:  'Oswald Campesato',\n           \
  \        bookTitle:   'HTML5 Canvas and CSS3 Graphics',\n                   bookPubDate:\
  \ '07/30/2012'\n                   });\nvar u1 = new User({firstName:  'John', lastname:\
  \ 'Smith'});\nvar c1 = new Comment(\n         {userid: u1, bookid: b1, comment:\
  \ \"Great book!\"});\n\n// 将用户 u1 添加到读过这本书的用户列表（在 b1 中）:\nb1.users.push(u1);\n\n\
  // 将书籍 b1 添加到用户 u1 读过的书籍列表（在 u1 中）:\nu1.books.push(b1);\n\n//显示书籍\napp.get('/showbooks',\
  \ function(req,res){\n  console.log(\"finding books\");\n    Book.find({}, function(error,\
  \ data){\n      res.json(data);\n    });\n});\n\n//显示用户\napp.get('/showusers', function(req,res){\n\
  \  console.log(\"finding users\");\n    User.find({}, function(error, data){\n \
  \     res.json(data);\n    });\n});\n\n// 添加用户的示例 URL：\n//http://localhost:3003/adduser/tom/smith\n\
  app.get('/adduser/:first/:last/:username', function(req, res){\n  console.log(\"\
  adding user\");\n  var user_data = {\n        first_name: req.params.first\n   \
  \ , last_name: req.params.last\n    , username: req.params.username\n  };\n  var\
  \ user = new User(user_data);\n  user.save( function(error, data){\n    if(error){\n\
  \        res.json(error);\n    }\n    else{\n        res.json(data);\n    }\n  });\n\
  });\napp.listen(3003);\nconsole.log(\"listening on port %d\", app.address().port);\n\
  ```\n\nListing 6.5 整合了你在本章早些看到的许多代码片段。还存在代码块，允许你通过从 URL 中提取相关信息来添加新用户，然后构建以下保存到数据库的结构：\n\
  \n```javascript\n// 添加用户的示例 URL：\n//http://localhost:3003/adduser/tom/smith\n\n\
  app.get('/adduser/:first/:last/:username', function(req, res){\n  var user_data\
  \ = {\n        first_name: req.params.first\n    , last_name: req.params.last\n\
  \    , username: req.params.username\n  };\n  var user = new User(user_data);\n\
  \  user.save( function(error, data){\n    if(error){\n        res.json(error);\n\
  \    }\n    else{\n        res.json(data);\n    }\n  });\n});\n```\n\n\n\n\njQuery\
  \ Mobile 本质上是 jQuery 插件和组件的集合，允许你编写可以在多个平台上运行的移动 Web 应用。你已经知道 jQuery 专注于桌面 Web 应用程序；相比之下，jQuery\
  \ Mobile（包含 CSS 样式表和 JavaScript 库）是为移动设备设计的。然而，jQuery Mobile 依赖“基础”jQuery 库，在 Web\
  \ 页面引用 jQuery Mobile 库之前，必须先引用 jQuery。此外，jQuery Mobile 使用了 HTML5 和 CSS3 功能（如过渡和动画）以及用于导航的小型图标。\n\
  \njQuery Mobile 依赖于带有 `data-` 前缀的自定义属性。如果你不知道，自定义属性是 HTML5 中引入的新特性，并且始终具有此类前缀。这种对自定义数据属性的支持为\
  \ HTML5 标记提供了某些 XML 中可用的功能。这使得代码能够处理自定义标签及其值，同时通过验证。\n\n一个简单的 jQuery Mobile 页面具有以下结构：\n\
  \n*   一个带有 `data-role=\"header\"` 属性的可选 `<div>` 元素\n*   一个带有 `data-role=\"content\"\
  ` 属性的强制 `<div>` 元素\n*   一个带有 `data-role=\"footer\"` 属性的可选 `<div>` 元素\n\n在初始化期间，jQuery\
  \ Mobile 会预处理 Web 页面并插入额外的标记、CSS 类和处理器。你将在本章稍后的“Hello World”代码示例中 jQuery Mobile\
  \ 如何修改 Web 页面的示例。\n\n在编写 jQuery Mobile Web 页面时，有几个需要注意的重要细节。首先，jQuery Mobile 提供了以下页面相关的事件，你可以在\
  \ jQuery Mobile 页面的生命周期内程序化地调用：`pageInit()`、`pageCreate()`、`pageShow()` 和 `pageHide()`。其次，jQuery\
  \ Mobile 支持处理用户手势的自定义事件，如滑动、点击、长按和设备方向变化。第三，jQuery Mobile 使用主题来定制移动应用程序的外观，并结合渐进式增强（在第\
  \ 1 章）中简要讨论），使你的移动应用程序运行在各种支持 Web 的设备上。\n\n另一个需要记住的关键点是 jQuery 使用了这种结构：\n\n```javascript\n\
  $(document).ready() {\n  // do something here\n}\n```\n\n另一方面，jQuery Mobile 使用这种结构：\n\
  \n```javascript\n$(selector).live('pageinit', (function(event){\n  // do something\
  \ here\n}));\n```\n\n注意它们的重点不同：jQuery 在 Web 页面加载后发送事件，而 jQuery Mobile 在页面（或页面视图）初始化时发送事件。\n\
  \n## jQuery Mobile 中的核心功能和组件 (#toc.html_toc-h2-0049)\n\n如果你已经阅读了之前涵盖 jQuery 的章节，你已经获取了大量关于\
  \ jQuery 特性的知识。这些知识出于另一个原因有用：jQuery Mobile 使用 jQuery 作为基础，在你的 HTML5 Web 页面中，jQuery\
  \ 库必须始终于 jQuery Mobile 库。\n\njQuery Mobile 提供了许多实用的功能，将简化创建移动应用程序的过程。这里列出 jQuery\
  \ Mobile 的功能：\n\n*   兼容主要的移动平台（Android、iOS 等）\n*   使用 HTML5 标记\n*   采用渐进式增强方法\n\
  *   提供紧凑的工具包（压缩后约 12K）\n*   支持插件和主题\n*   支持基于触摸和鼠标的用户手势\n*   支持 WAI-ARIA\n\n此外，jQuery\
  \ Mobile 支持以下组件（以及此处未列出的其他）：\n\n*   按钮\n*   表单元素\n*   列表视图\n*   页面和对话框\n*   工具栏\n\
  \n书中的 jQuery 代码示例使用简单的命名约定：包含 jQuery 代码的 HTML5 Web 页面名称以“JQ”开头，包含 jQuery Mobile\
  \ 的 HTML5 页面名称以字母“JQM”开头。记住，此命名约定仅适用于本书。\n\n## 最小 jQuery Mobile Web 页面 (#toc.html_toc-h1-0067)\n\
  \n列表 7.1 显示了 `JQMHelloWorld1.html` 的内容，它说明了在桌面浏览器、平板电脑或智能手机上渲染时，如何在 HTML5 Web 页面中显示“Hello\
  \ World”消息。\n\n***列表 7.1 JQMHelloWorld1.html***\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Hello World\
  \ from jQuery Mobile</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\"\
  \ />\n    <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n \
  \   <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n \
  \   <script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"\
  ></script>\n  </head>\n  <body>\n    <div data-role=\"page\">\n      <div data-role=\"\
  header\">\n        <h2>This is the Header</h2>\n      </div>\n      <div data-role=\"\
  content\">\n        <p>Hello World from a Simple jQuery Mobile Page</p>\n      </div>\n\
  \      <div data-role=\"footer\">\n        <h2>This is the Footer</h2>\n      </div>\n\
  \    </div>\n  </body>\n</html>\n```\n\n列表 7.1 结构直观易懂：它由一个单一页面视图（一个带有 `data-role=\"\
  page\"` 属性的 HTML `<div>` 元素）组成，其中包含三个 `<div>` 元素：分别页眉部分、内容部分和页脚部分。\n\n图 7.1 显示了在运行\
  \ Android ICS 的 Asus Prime 平板电脑上通过横屏模式截屏渲染列表 7.1 中 HTML Web 页面的结果。\n\n对比图 7.1 与图\
  \ 7.2，后者显示了在运行 Android ICS 的 Sprint Nexus 4G 智能手机上横屏运行的示例 jQuery Mobile 应用程序，使用的是与图\
  \ 7.1 相同的二进制文件。注意页眉和页脚是如何延伸到屏幕宽度的。\n\n图 7.1 显示了在运行 Android ICS 的 Asus Prime 平板电脑上通过横屏模式截屏渲染列表\
  \ 7.1 中 HTML Web 页面的结果。\n\n图 7.2 显示了在运行 Android ICS 的 Sprint Nexus 4G 智能手机上横屏运行的示例\
  \ jQuery Mobile 应用程序，使用的是与图 7.1 相同的二进制文件。注意页眉和页脚是如何延伸到屏幕宽度的。\n\n现在在基于 Webkit 的浏览器中启动列表\
  \ 7.1，并对比你在图 7.1 和图 7.2 中看到的内容。\n\n你之前已经学过 jQuery Mobile 如何使用额外的标签和 CSS 类增强移动 Web\
  \ 页面。jQuery Mobile 在列表 7.1 的 HTML5 Web 页面中“注入”了各种 CSS 类（属于 jQuery Mobile 的）。通常情况下，你不需要担心这些细节；但如果你需要更深入地理解这些细节，可以深入研究\
  \ jQuery Mobile 的源码。光盘上的 HTML5 页面 `JQMHelloWorld1Enhanced.html` 展示了 jQuery 如何“增强”HTML5\
  \ Web 页面 `HelloWorld1.html` 的内容。\n\n\n\n\n\n正如你在之前的代码示例所示，jQuery Mobile 中的每个页面视图都由一个带有\
  \ `data-role=\"page\"` 属性的 HTML `<div>` 元素定义，并包含一个可选的头部（header）、一个必需的内容元素（content）和一个可选的页脚（footer）。\n\
  \n页面之间的导航非常简单：只需在 jQuery Mobile 应用中为带有 `data-role=\"content\"` 属性的 `<div>` 元素添加链接即可，如下：\n\
  \n```html\n<div data-role=\"content\">\n  <p>A second page view<a href=\"#home\"\
  >Home</a>a></p>\n</div>\n```\n\n当用户点击链接时会发生页面视图之间的切换，jQuery Mobile 会自动处理切换所需的细节。本章节后面将提供一个包含多个页面视图的\
  \ jQuery Mobile Web 页面的完整示例（以及如何在页面视图之间导航）。\n\n## jQuery Mobile 自定义属性\n\njQuery\
  \ Mobile 使用 `data-role` 属性来识别“页面视图”（本质上是一个屏幕）的不同部分，其支持的一些值包括 `page`、`header`、`content`\
  \ 和 `footer`。`data-role` 属性也用于增强 HTML 元素。例如，如果你在无序列表的 HTML `<ul>` 标签中指定属性 `data-role=\"\
  listview\"`，那么 jQuery Mobile 将进行必要的增强（如插入标记、添加 CSS 类和暴露监听器），使你能够像处理小部件一样处理无序列表。\n\
  \n另一个示例是，你可以通过向块级 HTML5 `<nav>` 元素添加属性 `data-role=\"navbar\"` 来创建一个导航栏，关联列表项（封装在\
  \ HTML5 `<nav>` 元素中）中的文本字符串将作为导航栏中的标签元素显示。\n\n`data-transition` 属性指定切换页面视图或显示对话框时的切换效果。由于这些切换基于\
  \ CSS3，因此它们仅在支持 CSS3 的浏览器（如基于 WebKit 的浏览器）中有效。`data-transition` 属性的允许值为 `fade`、`flip`、`pop`、`slide`、`slidedown`\
  \ 和 `slideup`。\n\n其他一些自定义 jQuery Mobile 属性包括 `data-backbtn`、`data-divider`、`data-direction`、`data-icon`、`data-inline`、`data-position`、`data-rel`\
  \ 和 `data-url`。\n\n## jQuery Mobile 页面切换\n\njQuery Mobile 提供了页面切换（以及事件和 `ui` 对象），你可以在绑定到任何页面切换的自定义代码块中引用它们。请记住，“页面”可以是一个独立的\
  \ HTML Web 页，也可以是当前加载的 HTML Web 页内部的 HTML `<div>` 元素。\n\n以下是页面初始化期间发生的页面事件序列：\n\n\
  - `pagebeforecreate`: 首先触发\n- `pagecreate`: 在 DOM 填充后触发\n- `pageinit`: 在初始化完成后触发\n\
  - `pagebeforeshow`: 在切换到“目标”页面前触发\n- `pageshow`: 在切换到“目标”页面后触发\n\n每当用户点击一个导航到首次首次加载的页面的链接时，会发生以下事件序列：\n\
  \n- `pagebeforehide`: 在切换前在“离开”页面上触发\n- `pagebeforeshow`: 在切换前在“目标”页面上触发\n- `pagehide`:\
  \ 在切换后在“离开”页面上触发\n- `pageshow`: 在切换后在“目标”页面上触发\n\n每当使用 AJAX 加载新页面时，会发生以下事件序列：\n\n\
  - `pagebeforeload`: 在进行 AJAX 调用之前\n- `pageload`: 在 AJAX 调用完成后触发\n- `pageloadfailed`:\
  \ 如果 AJAX 调用失败则触发\n\n在页面切换期间，`ui.nextPage` 被赋值为切换的目标页面，如果没有下一个页面则赋值为空的 jQuery 对象。同样，`ui.prevPage`\
  \ 被赋值为切换前的当前页面，如果没有上一个页面则赋值为空 jQuery 对象。\n\njQuery Mobile 内部功能使用基于 AJAX 的异步方法调用，因此它区分了页面加载事件与页面显示和隐藏事件。当文件以同步方式加载到浏览器时会发生页面加载事件，可以使用\
  \ `jQuery(document).ready()` 方法以及其他初始化事件。注意，在某些情况下，你可以显式指定同步而非异步方法调用，但本章未讨论此功能（如果需要更多细节，请查看在线\
  \ jQuery Mobile 文档）。\n\n正如你将在本章后面看到的，单个 HTML Web 页可能包含多个 jQuery Mobile 页面视图，用户可以多次在这些页面视图之间导航。这些切换不会触发页面加载事件；jQuery\
  \ Mobile 提供了一组在每次页面切换发生时发生的事件。\n\n由于页面隐藏和显示事件在每次页面切换时都会触发，请确保你不要多次绑定事件处理程序，可以先检查事件处理程序是否已绑定（如果是则什么都不做），或者在重新绑定到给定事件之前清除之前的绑定。\n\
  \n列表 7.2 显示了 `JQMPageEvents1.html` 的内容，说明了页面事件执行的序列。\n\n***列表 7.2 JQMPageEvents1.html***\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>JQuery Mobile Page Events</title>\n  <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.min.css\">\n  <script src=\"http://code.jquery.com/jquery-1.6.4/jquery.min.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile.min.js\"\
  ></script>\n</head>\n<body>\n  <div data-role=\"page\" id=\"page1\">\n    <div data-role=\"\
  header\">\n      <h3>jQuery Mobile Page Events</h3>\n    </div>\n    <div data-role=\"\
  content\">\n      <p>A second page view<a href=\"#home\">Home</a>a></p>\n    </div>\n\
  \    <div data-role=\"footer\">\n      <h3>Footer</h3>\n    </div>\n  </div>\n \
  \ <script>\n    $(page1).live(\"pagebeforecreate\", function() {\n      console.log(\"\
  pagebeforecreate\");\n    });\n    $(page1).live(\"pagecreate\", function() {\n\
  \      console.log(\"pagecreate\");\n    });\n    $(page1).live(\"pageinit\", function()\
  \ {\n      console.log(\"pageinit\");\n    });\n    $(page1).live(\"pagebeforehide\"\
  , function() {\n      console.log(\"pagebeforehide\");\n    });\n    $(page1).live(\"\
  pagebeforeshow\", function() {\n      console.log(\"pagebeforeshow\");\n    });\n\
  \    $(page1).live(\"pagehide\", function() {\n      console.log(\"pagehide\");\n\
  \    });\n    $(page1).live(\"pageshow\", function() {\n      console.log(\"pageshow\"\
  );\n    });\n  </script>\n</body>\n</html>\n```\n\n\n\n\n接下来，jQuery Mobile 会搜索带有\
  \ `data-` 属性的子元素，并为它们添加主题类、适当的 ARIA 角色，并在必要时为第一页之外的所有页面页头添加返回按钮。\n\n最后，jQuery Mobile\
  \ 会增强按钮、控制组和表单控件，并对工具栏进行任何必要的调整。\n\n因此，jQuery Mobile 代表你执行了大量工作，这意味着你无需受这些繁琐且低级细节的困扰，可以专注于你的移动应用程序的功能。\n\
  \n还有更多好消息：当用户在移动应用程序的不同页面之间导航时，jQuery Mobile 会自动处理页面过渡和返回按钮。jQuery Mobile 还通过执行异步获取（使用\
  \ `AJAX`）处理外部页面，并将该外部页面集成到当前文档中（如果未找到外部页面，将显示错误消息）。外部页面整合到当前文档中带有 `data-role=\"\
  page\"` 属性的第一个元素中（同时忽略该页的所有内容）。\n\n注意，如果 jQuery Mobile 无法找到 Web 页面或该页面不包含 `data-role=\"\
  page\"` 属性的元素，它将显示错误消息。确保外部 Web 页面中的 `id` 值与当前 Web 页面中的 `id` 值不同。\n\n顺便说，你可以通过两种方式覆盖默认的页面加载：在链接上指定目标属性（如\
  \ `_blank`），或者在链接上指定 `rel=\"external\"` 属性。\n\n# mobileinit 事件\n\njQuery Mobile\
  \ 在执行后立即在 `document` 对象上触发 `mobileinit` 事件，因此你可以绑定到它并覆盖任何默认配置。\n\n例如，假设你需要防止 jQuery\
  \ Mobile 在整个移动应用程序中特定类型的 HTML 元素应用样式规则。以下代码块阻止了 jQuery Mobile 将其样式规则（全局范围内）应用于 HTML\
  \ `<input>` 和 `<textarea>` 元素：\n\n```javascript\n$(document).bind('mobileinit',function\
  \ () {\n    $.mobile.page.prototype.options.keepNative = \"input,textarea\";\n});\n\
  ```\n\n注意，`data-role=\"none\"` 属性的作用与上述代码块相同，区别在于它仅应用于包含该属性的特定元素。\n\n## jQuery Mobile\
  \ 选项与自定义\n\njQuery Mobile 为各种对象提供了选项和方法，包括 `.mobile`、`.mobile.path` 和 `.mobile.history`。你有许多可以为移动应用程序配置的选项，我们将在本节中介绍其中几个。一个明显有用的方法是\
  \ jQuery Mobile 的 `pageLoading()` 方法，它可以显示和隐藏 jQuery Mobile 的加载对话框。你使用布尔值 `true`\
  \ 调用此方法来隐藏对话框，并在不带参数调用此方法来显示对话框，所示：\n\n```javascript\n// 显示页面加载对话框\n$.mobile.pageLoading();\n\
  \n// 隐藏加载对话框\n$.mobile.pageLoading(true);\n```\n\n你还可以自定义“加载消息”以及过渡效果的类型，所示：\n\n\
  ```javascript\n$.mobile.loadingMessage = \"wait a few moments \";\n$.mobile.defaultPageTransition\
  \ = \"pop\";\n```\n\n实现与前两行相同功能的另一种方法所示：\n\n```javascript\n$.extent($.mobile, {\n\
  \    \"loadingMessage\" = \"wait a few moments\",\n    \"defaultPageTransition\"\
  \ = \"pop\"\n});\n```\n\n事实上，你可以按照以下方式使用自己的初始化配置 jQuery Mobile：1) 创建一个在 jQuery Mobile\
  \ 加载之前加载的脚本，2) 为 `mobileinit` 事件绑定事件处理程序。\n\n如果你想了解更多关于 jQuery Mobile 自定义初始化、选项和方法的信息，请阅读\
  \ jQuery 文档以深入了解如何使用它们。\n\n# 页面导航与切换页面\n\n当用户在你的移动 Web 应用程序导航时，jQuery Mobile 也会更新\
  \ `location.hash` 对象，包含每个页面视图的唯一 URL（由带有 `data-role=\"page\"` 属性的元素定义）。jQuery Mobile\
  \ 将每个页面的 URL 存储在分配给页面“容器”元素的 `data-url` 属性中。\n\njQuery Mobile �还提供了一系列方法，允许你通过程序处理页面更改和滚动。这些方法之一是\
  \ `changePage()`，其语法如下：\n\n```javascript\nchangePage(to, transition, back, changeHash);\n\
  ```\n\n`to` 参数是一个指定元素 `id` 或文件名（以及许多其他选项）的字符串，它是目标页面的引用。`transition` 参数是应用程序进入目标页面时创建的过渡效果名称。`back`\
  \ 参数是一个布尔值，指定过渡是否为反向。最后，`changeHash` 参数是一个布尔值，指定是否更新 `location.hash` 对象。\n\n`changePage()`\
  \ 方法允许你创建更复杂的页面过渡效果。例如，以下代码段在用户点击 `.back-btn` 时跳转到页面 `#first`，并使用反向的“flip”效果且不更新位置\
  \ hash：\n\n```javascript\n$(\".back-btn\").bind(\"click\", function () {\n    changePage(\"\
  #first\", \"flip\", true, false);\n});\n```\n\njQuery Mobile 还提供了 `silentScroll()`\
  \ 方法，带有一个单整数值来指定目标。当调用此方法时，滚动监听器不会被触发。例如，以下代码将滚动到 200：\n\n```javascript\n$.mobile.silentScroll(200);\n\
  ```\n\n## jqdata() 选择器\n\n在第 1 章中，你学习了 `data()` 方法。jQuery Mobile 提供了一个名为 `jqdata()`\
  \ 的相应方法，它是选择自定义属性的自定义选择器。例如，在 jQuery 中，你可以使用此代码选择 Web 页面中包含 `data-` 属性的所有元素：\n\n\
  ```javascript\n$(\"[data']\")\n```\n\n你可以使用 `jqdata()` 选择相同的元素集合，所示：\n\n```javascript\n\
  (\":jqdata()\")\n```\n\n注意，`jqdata()` 选择器通过为字符串指定一个值（默认为空）来为你自动处理命名空间，避免标签冲突。\n\n\
  这种方法比创建一个具有多个 HTML5 页面的移动应用程序更高效。尽管 HTML5 Web 页面的初始下载时间可能更长，当用户导航到页的不同部分时，没有额外的\
  \ Internet 。\n\n列表 7.3 显示了 `JQMMultiPageViews1.html` 的内容，说明了如何在单个 HTML5 Web 页面中的内部页面视图之间导航。\n\
  \n```html\nLISTING 7.3: JMMultiPageViews1.html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <meta charset=\"utf-8\" />\n  <title>jQuery Mobile: Page Views</title>\n  <link\
  \ rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\"\
  \ />\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"></script>\n</head>\n\
  <body>\n<div data-role=\"page\" id=\"first\">\n  <h1>First Page</h1>\n  <a href=\"\
  #second\" class=\"btn\">Go to Second Page</a>\n</div>\n<div data-role=\"page\" id=\"\
  second\">\n  <h1>Second Page</h1>\n  <a href=\"#first\" class=\"btn back-btn\">Go\
  \ to First Page</a>\n</div>\n</body>\n</html>\n```\n\n\n\n\n\n```html\n<div data-role=\"\
  page\" id=\"home\">\n  <div data-role=\"header\"><h1>首页页头</h1></div>\n  <div data-role=\"\
  content\">\n    <p>这是主页的内容</p>\n    <p><a href=\"#about\">点击此处获取更多信息</a></p>\n \
  \ </div>\n  <div data-role=\"footer\"><h1>首页页脚</h1></div>\n</div>\n<div data-role=\"\
  page\" id=\"about\">\n  <div data-role=\"header\"><h1>关于此页的页头</h1></div>\n  <div\
  \ data-role=\"content\">\n    <p>第二个视图（目前就是全部）</p>\n    <a href=\"#home\">点击此处或点击“返回”按钮回到首页</a>\n\
  \  </div>\n  <div data-role=\"footer\"><h1>关于此页的页脚</h1></div>\n</div>\n</body>\n\
  </html>\n```\n\n[列表 7.3 包含了两个页面视图，正如 HTML `<div>` 元素所指定的，其 `id` 属性值为 `home` 和 `about`（在列表\
  \ 7.3 中以**粗体**显示）。当用户导航到第二个页面视图时，此代码段将返回第一个页面视图：\n\n```html\n<a href=\"#home\">点击此处或点击“返回”按钮回到首页</a>\n\
  ```\n\njQuery Mobile 应用中的页面视图（或屏幕）是顶层同级元素，每个元素都包含 `data-role=\"page\"` 属性（因此页面不能嵌套）。\n\
  \njQuery Mobile 框架会在每个页面视图上自动生成返回按钮和主页按钮，但你可以通过指定 `data-backbtn=\"false\"` 属性来抑制返回按钮，如下：\n\
  \n```html\n<div data-role=\"header\" data-backbtn=\"false\">\n  <h1>页头</h1>\n</div>\n\
  ```\n\n图 7.4 显示了在列表 7.3 中的 HTML Web 页面在运行 Android ICS 的 Sprint Nexus S 4G 上的横屏截图中的渲染结果。\n\
  \n![image](img/fig7.4.jpg)\n\n**图 7.4** 在运行 Android ICS 的 Sprint Nexus S 4G 多页应用。\n\
  \n当你点击 Web 页面上的链接时，应用程序将导航到第二个屏幕，其代码定义也包含在列表 7.3 中。\n\n## 在页面视图中定位页头和页脚 (#toc.html_toc-h1-0072)\n\
  \njQuery Mobile 可以通过三种方式动态定位页头和页脚工具栏：\n\n- **标准 (Standard)**：工具栏根据文档流呈现，随着用户滚动数据，会进入和离开视口。这是默认设置。\n\
  - **固定 (Fixed)**：页头和页脚将出现在视口的顶部和底部，并在用户滚动时时保持在那里。点击屏幕将导致它们返回到文档流中的常规位置。\n- **全屏\
  \ (Fullscreen)**：页头和页脚将出现在视口内，并在用户滚动时保持显示，无论用户处于内容的哪个位置。点击屏幕将隐藏它们。本质上，页头和页脚从文档流中移除，并始终动态定位在视口的顶部和底部。\n\
  \n在 `<header>` 或 `<footer>` 标签中包含 `data-position=\"fixed\"` 属性可以创建固定页头和页脚，如列表 7.4\
  \ 所示，该列表显示了 `JQMFixed1.html` 的内容。\n\n**列表 7.4 JQMFixed1.html**\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>jQueryMobile\
  \ 中的固定页头和页脚</title>\n  <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.1.1.0.min.css\"\
  \ />\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"></script>\n</head>\n\
  <body>\n  <div id=\"page1\" data-role=\"page\">\n    <header data-role=\"header\"\
  \ data-position=\"fixed\">\n      <h1>jQuery Mobile</h1>\n    </header>\n    <div\
  \ class=\"content\" data-role=\"content\">\n      <h3>内容区域。</h3>\n    </div>\n \
  \   <footer data-role=\"footer\" data-position=\"fixed\">\n      <h3>固定页脚</h3>\n\
  \    </footer>\n  </div>\n</body>\n</html>\n```\n\n列表 7.4 包含了 HTML 标记和单个页面视图，该视图还为页头和页脚指定了\
  \ `data-position=\"fixed\"` 属性。\n\n你也可以通过在 `data-role=\"page\"` 元素中包含 `data-position=\"\
  fixed\"` 属性以及 `fullscreen=\"true\"` 属性来创建全屏页头或页脚，如下：\n\n```html\n<section id=\"\
  page1\" data-role=\"page\">\n  <header data-role=\"header\" data-position=\"fixed\"\
  >\n    <h1>jQuery Mobile</h1>\n  </header>\n  <div class=\"content\" data-role=\"\
  content\">\n    <h3>内容区域。</h3>\n  </div>\n  <footer data-role=\"footer\" data-position=\"\
  fixed\">\n    <h3>固定页脚</h3>\n  </footer>\n</section>\n```\n\n<p><a href=\"#about\"\
  >关于此页</a></p>\n\n图 7.5 显示了列表 7.5 中的 HTML 页面在 MacBook 上的渲染结果。\n\n![image](img/fig7.5.jpg)\n\
  \n**图 7.5** MacBook 上的固定页头/页脚。\n\n\n\n\n\njQuery Mobile 按钮元素或类型为 `submit`、`reset`、`button`\
  \ 或 `image` 的输入元素不需要 `data-role=\"button\"` 属性，因为 jQuery Mobile 会自动将这些元素视为基于链接的按钮。\n\
  \n虽然原始的基于表单按钮没有显示，但它仍然包含在 HTML 标记中。当链接按钮上发生点击事件时，对应的原始表单按钮也会发生相应的点击事件。\n\n## 按钮组与列网格\n\
  \njQuery Mobile 允许你通过定义一个指定了 `data-role=\"controlgroup\"` 属性的容器 HTML `<div>`元素并包含一个或多个按钮元素，将一组按钮（或复选框或单选按钮）渲染为一个区块。包含的按钮的默认渲染方式是水平的（一行），你可以通过指定\
  \ `data-type=\"vertical\"` 属性将按钮渲染为垂直组。\n\njQuery Mobile 会渲染按钮，移除按钮之间的间距（以及外阴投影），并对第一个和最后一个按钮进行“圆角”处理，以创建类似组的效果。下面的代码块展示了如何指定一个水平按钮组：\n\
  \n```html\n<div data-role=\"controlgroup\">\n  <a href=\"index1.html\" data-role=\"\
  button\">One</a>\n  <a href=\"index2.html\" data-role=\"button\">Two</a>\n  <a href=\"\
  index3.html\" data-role=\"button\">Three</a>\n</div>\n```\n\n需要记住的一点：如果按钮数量超过屏幕宽度，按钮将“换行”到额外的行。[Listing\
  \ 7.5] 展示了你如何渲染水平按钮组和垂直按钮组。\n\njQuery Mobile 框架允许你通过一种名为 `ui-grid` 的区块样式类约定来渲染 CSS\
  \ 列。你可以通过使用类值 `ui-grid-a`、`ui-grid-b`、`ui-grid-c` 和 `ui-grid-d` 分别渲染两列、三列、四列和五列布局。下面的代码块说明了如何渲染两列布局：\n\
  \n```html\n<div class=\"ui-grid-a\">\n  <div class=\"ui-block-a\">Block 1 and text\
  \ inside will wrap</div></div>\n  <div class=\"ui-block-b\">Block 2 and text inside\
  \ will wrap</div></div>\n</div>\n```\n\n注意下方代码块中显示三列布局时的区别：\n\n```html\n<div class=\"\
  ui-grid-b\">\n  <div class=\"ui-block-a\">Block 1 and text inside will wrap</div></div>\n\
  \  <div class=\"ui-block-b\">Block 2 and text inside will wrap</div></div>\n  <div\
  \ class=\"ui-block-c\">Block 3 and text inside will wrap</div></div>\n</div>\n```\n\
  \n你可以在这里找到更多细节和代码示例：\n\n[`jquerymobile.com/demos/1.0b1/#/demos/1.0/docs/content/content-grids.html`](http://jquerymobile.com/demos/1.0b1/#/demos/1.0/docs/content/content-grids.html)\n\
  \n## 使用主题渲染按钮\n\njQuery Mobile 拥有完善的主题系统，涉及标记为“a”到“e”的主题，用于控制按钮的样式化方式。当链接添加到容器中时，jQuery\
  \ Mobile 会为其分配一个与其父元素主题匹配的主题“色块”字母。例如，放置在主题为“a”（默认主题下为黑色）的内容容器中的按钮，会自动被分配按钮主题“a”（默认主题下为炭灰色）。\n\
  \n这里显示了一个按钮主题示例：\n\n```html\n<div data-role=\"footer\" class=\"ui-bar\">\n  <a href=\"\
  left.html\" data-icon=\"arrow-l\" data-role=\"button\" data-theme=\"a\">Left</a>\n\
  </div>\n```\n\n[Listing 7.5] 显示了 `JQMButtons1.html` 的内容，它阐述了如何水平和垂直渲染按钮、如何应用不同的主题以及如何指定自定义\
  \ CSS 选择器。\n\n### 列表 7.5 JQMButtons1.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
