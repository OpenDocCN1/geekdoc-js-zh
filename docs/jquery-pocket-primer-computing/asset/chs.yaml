  \ `(F, 0, 0)` 和 `(FF, 0, 0)`；十进制三元组 `(100%, 0%, 0)` 或字符串 `#F00`。你也可以使用 `(R, G, B,\
  \ A)`，其中第四个分量指定透明度，这是一个 0（透明）到 1（不透明）之间的小数。\n\n然而，还有颜色的 HSL（色相、饱和度和亮度）表示法，其中第一个分量是\
  \ 0 到 360 之间的角度（0 度是北），另外两个分量是 0 到 100 之间的百分比。例如，`(0, 100%, 50%)`、`(120, 100%, 50%)`\
  \ 和 `(240, 100%, 50%)` 分别代表红色、绿色和蓝色。第一个分量 `(R, G, B, A)` 中的第四个分量指定透明度，这是一个 0（透明）到\
  \ 1（不透明）之间的小数。\n\n### CSS3 阴影与文本\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3\
  \ 还能让你轻松渲染带有圆角的矩形，因此你不需要 `JPG` 文件即可创建这种效果。\n\n#### CSS3 阴影效果\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3\
  \ 还能让你轻松渲染带有圆角的矩形，因此你不需要 `JPG` 文件即可创建这种效果。\n\n#### CSS3 阴影效果\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3\
  \ 还能让你轻松渲染带有圆角的矩形，因此你不需要 `JPG` 文件即可创建这种效果。\n\n#### CSS3 阴影效果\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以将阴影效果应用于文本以及矩形区域。CSS3\
  \ 还能让你轻松渲染带有圆角的矩形，因此你不需要 `JPG` 文件即可创建这种效果。\n\n#### CSS3 阴影效果\n\nCSS  阴效果可以使页面更具吸引力。\n\
  \n#### Listing 2.1 Shadow.html\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"UTF-8\">\n  <title>CSS Shadow</title>\n</head>\n<body>\n  <div\
  \ id=\"text1\">One Shadow</div>\n  <div id=\"text2\">Two Shadow</div>\n  <div id=\"\
  text3\">Three Shadow</div>\n  <div id=\"text4\">Four Shadow</div>\n  <div id=\"\
  text5\">Five Shadow</div>\n  <div id=\"text6\">Six Shadow</div>\n</body>\n</html>\n\
  ```\n\n#### Listing 2.2 Shadow.css\n```css\n#text1 {\n  font-size: 24pt;\n  text-shadow:\
  \ 2px 4px 5px #00f;\n}\n#text2 {\n  font-size: 32pt;\n  text-shadow: 0px 1px 6px\
  \ #000, 4px 5px #f00;\n}\n...\n```\n\n*(注：由于提供的原始文本中存在大量重复的段落和不完整的代码片段，译文已根据“不要重复输出原文”的原则，对逻辑内容进行了整合和去重，并翻译了核心技术说明。)*\n\
  \n\n\n\n\n```css\ntext-shadow: 2px 4px 5px #f00;\n  -webkit-transform: rotate(-170deg);\n\
  }\n\n/* 'transform' 稍后解释 */\n\n#text1:hover, #text2:hover, #text3:hover,\n#text4:hover,\
  \ #text5:hover, #text6:hover {\n  -webkit-transform : scale(2) rotate(-45deg);\n\
  \  transform : scale(2) rotate(-45deg);\n}\n```\n\nListing 2.2 中的第一个选择器指定了 24 的\
  \ `font-size`，并使用 `text-shadow` 渲染具有蓝色背景的文本（由十六进制值 `#00f` 表示）。`text-shadow` 属性指定了从左到右的阴影\
  \ x 坐标、y 坐标、模糊半径和颜色。第二个选择器指定了 32 的 `font-size` 和红色阴影背景（`#f00`）。第三个选择器通过在 `text-shadow`\
  \ 属性中指定多个组件创建了更丰富的视觉效果，这些组件是通过对不同组件的不同值进行实验而选择的。\n\n最后的 CSS3 选择器会在用户悬停在六个文本字符串之一上时创建一个动画效果，动画的细节将在本章稍后部分介绍。\n\
  \n图 2.1 显示了 CSS 样式表 `TextShadow1.css` 中的选择器与 HTML 页面 `TextShadow1.html` 中的 HTML\
  \ `<div>` 元素匹配的结果。该横屏截图取自 Nexus S 4G (Android ICS) 智能手机上的 Android 应用（基于 Listing\
  \ 2.1 和 Listing 2.2 中的代码）。\n\n![image](img/fig2.1.jpg)\n\n**图 2.1** CSS3 文本阴影效果。\n\
  \n## CSS3 与外阴效果 (#toc.html_toc-h2-0015)\n\n你也可以对包含文本字符串的框应用阴影效果，这在吸引用户注意网页特定部分方面非常有效。然而，关于过度使用的相同警告也适用于外阴。\n\
  \n![image](img/cd.jpg) 此处未显示 HTML 页面 `BoxShadow1.html` 和 `BoxShadow1.css`，但它们可以在\
  \ CD 中找到。它们共同渲染出外阴效果。\n\n关键属性是 `box-shadow` 属性，如下所示（此处用**粗体**显示了 Mozilla、WebKit\
  \ 以及不带前缀的属性）：\n\n```css\n#box1 {\n  position:relative;top:10px;\n  width: 50%;\n\
  \  height: 30px;\n  font-size: 20px;\n  -moz-box-shadow: 10px 10px 5px #800;\n \
  \ -webkit-box-shadow: 10px 10px 5px #800;\n  box-shadow: 10px 10px 5px #800;\n}\n\
  ```\n\n图 2.2 显示了带有 Android ICS 的 Nexus S 4G 的横屏截图（基于 `BoxShadow1.html` 和 `BoxShadow1.css`\
  \ 中的代码）。\n\n![image](img/fig2.2.jpg)\n\n**图 2.2** 带有 Android ICS 的 Sprint Nexus\
  \ 上的 CSS3 外阴效果。\n\n## CSS3 与圆角 (#toc.html_toc-h2-0016)\n\nWeb 开发者长期等待 CSS 中的圆角功能，而\
  \ CSS3 能够非常轻松地渲染带有圆角的框。Listing 2.3 显示了 HTML 页面 `RoundedCorners1.html` 的内容，该页面在圆角框中渲染文本字符串，Listing\
  \ 2.4 显示了 CSS 文件 `RoundedCorners1.css`。\n\n### 列表 2.3 RoundedCorners1.html\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Example</title>\n\
  \  <link href=\"RoundedCorners1.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n\
  <body>\n  <div id=\"outer\">\n    <a href=\"#\" class=\"anchor\">矩形内的文本</a>\n  </div>\n\
  \  <div id=\"text1\">带有阴影效果的文本第一行</div>\n  <div id=\"text2\">带有阴影效果的文本第二行</div>\n\
  </body>\n</html>\n```\n\n列表 2.3 包含了对 CSS 样式表 `RoundedCorners1.css` 的引用，该样式表包含三个\
  \ CSS 选择器，分别匹配 `id` 值为 `anchor`、`text1` 和 `text2` 的元素。在 `RoundedCorners1.css` 中定义的\
  \ CSS 选择器创建了视觉效果，正如你将看到的，悬停伪类选择允许你创建动画。\n\n### 列表 2.4 RoundedCorners1.css\n```css\n\
  a.anchor:hover {\n  background: #00F;\n}\na.anchor {\n  /* 其他样式... */\n}\n```\n\n\
  \n\n\n```css\n{\n  font-size: 32px;\n  background-image: -webkit-gradient(linear,\
  \ 100% 0%, 0% 100%, from(#fff), to(#ff0));\n  background-image: -gradient(linear,\
  \ 100% 0%, 0% 100%, from(#fff), to(#ff0));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n\n#line3 {\n  width: 50%;\n  font-size: 32px;\n  background-image: -webkit-gradient(linear,\
  \ 0% 0%, 0% 100%, from(#f00), to(#00f));\n  background-image: -gradient(linear,\
  \ 0% 0%, 0% 100%, from(#f00), to(#00f));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n\n#line4 {\n  width: 50%;\n  font-size: 32px;\n  background-image: -webkit-gradient(linear,\
  \ 100% 0%, 0% 100%, from(#f00), to(#00f));\n  background-image: -gradient(linear,\
  \ 100% 0%, 0% 100%, from(#f00), to(#00f));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n\n#outline {\n  font-size: 2.0em;\n  font-weight: bold;\n  color: #fff;\n\
  \  text-shadow: 1px 1px 1px rgba(0,0,0,0.5);\n}\n\nh3 {\n  width: 50%;\n  position:\
  \ relative;\n  margin-top: 0;\n  font-size: 32px;\n  font-family: helvetica, ariel;\n\
  }\n\nh3 a {\n  position: relative;\n  color: red;\n  text-decoration: none;\n  -webkit-mask-image:\
  \ -webkit-gradient(linear, left top, left bottom, from(rgba(0,0,0,1)), color-stop(50%,\
  \ rgba(0,0,0,0.5)), to(rgba(0,0,0,0)));\n}\n\nh3:after {\n  content: \"This is a\
  \ Line of Gradient Text\";\n  color: blue;\n}\n```\n\n列表 2.6 中的第一个选择器指定了文本的 `font-size`\
  \ 为 32，`border-radius` 为 4（渲染出圆角），以及一个从白色到蓝色的线性渐变，如下所示：\n\n```css\n#line1 {\n  width:\
  \ 50%;\n  font-size: 32px;\n  background-image: -webkit-gradient(linear, 0% 0%,\
  \ 0% 100%, from(#fff), to(#f00));\n  background-image: -gradient(linear, 0% 0%,\
  \ 0% 100%, from(#fff), to(#f00));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n```\n\n如你所见，第一个选择器包含两个带有 `-webkit-` 前缀的属性和两个没有该前缀的标准属性。由于 列表 2.6 中的后续选择器与第一个选择器相似，我们在此不再讨论它们的内容。下一个选择器通过将文本渲染为白色并带有细阴影，创建一个带有漂亮阴影的文本轮廓，如下所示：\n\
  \n```css\ncolor: #fff;\ntext-shadow: 1px 1px 1px rgba(0,0,0,0.5);\n```\n\n列表 2.6\
  \ 的最后部分包含了影响 `h3` 元素及其嵌入的 `a` 元素渲染的三个选择器。`h3` 选择器指定宽度和字体大小；`a` 选择器指定线性渐变；`h3:after`\
  \ 选择器指定在 HTML5 `h3` 元素之后显示的文本字符串“This is a Line of Gradient Text”。（*注意*：你可以使用 `h3:before`\
  \ 来在 HTML5 `h3` 元素之前指定文本字符串。）还指定了其他属性，但这些是选择器主要的属性。\n\n图 2.4 显示了 CSS 样式 `LinearGradient1.css`\
  \ 中的选择器与 HTML 页面 `LinearGradient1.html` 匹配的结果，截图来自运行带有 Android ICS 的 Asus Prime\
  \ 平板的横屏模式。\n\n### 径向渐变\n\nCSS3 径向渐变比 CSS3 线性渐变更复杂，但你可以用它们创建更复杂的渐变效果。基于 `Webkit`\
  \ 的浏览器支持以下语法来定义径向渐变：\n\n*   一个起点\n*   起始半径\n*   一个终点\n*   结束半径\n*   使用 `from()`\
  \ 指定起始颜色\n*   零或多个颜色停止\n*   使用 `to()` 指定结束颜色\n\n![image](img/fig2.4.jpg)\n**图 2.4**\
  \ 带有 Android ICS 的 Asus Prime 10 平上的 CSS3 线性渐变效果。\n\n注意，径向渐变的语法与线性渐变的语法相似，但你还指定了起始半径和结束半径。\n\
  \n![image](img/cd.jpg) HTML5 网页 `RadialGradient1.html` 和 CSS 样式表 `RadialGradient1.css`\
  \ 未在此处显示，但完整的列表可以在 CD 上找到。HTML5 代码中的核心涉及此代码块：\n\n```html\n<div id=\"outer\">\n \
  \ <div id=\"radial3\">Text3</div>\n  <div id=\"radial2\">Text2</div>\n  <div id=\"\
  radial4\">Text4</div>\n  <div id=\"radial1\">Text1</div>\n</div>\n```\n\nCSS 样式表\
  \ `RadialGradient1.css` 包含了五个 CSS 选择器，用以匹配五个 HTML `div` 元素，其中一个选择器在此处所示：\n\n```css\n\
  #radial1 {\n  background: -webkit-gradient(\n    radial, 500 40%, 0, 301 25%, 360,\
  \ from(red),\n    color-stop(0.05, orange), color-stop(0.4, yellow),\n    color-stop(0.6,\
  \ green), color-stop(0.8, blue),\n    to(#fff)\n  );\n}\n```\n\n`#radial1` 选择器包含一个使用\
  \ `-webkit-` 前缀定义径向渐变的 `background` 属性，它指定了：\n\n*   起点 (500, 40%)\n*   起始半径 0\n\
  *   终点 (301, 25%)\n*   结束半径 360\n*   起始颜色红色\n*   结束颜色白色 (#fff)\n\n其他选择器的语法与第一个选择器相同，但生成的径向渐变显著不同。通过指定不同的起点和终点，以及指定大于结束半径的起始半径，你可以创建这些（其他的）效果。\n\
  \n图 2.5 显示了 CSS 样式表 `RadialGradient1.css` 中的选择器与 HTML 页面 `RadialGradient1.html`\
  \ 匹配的结果，截图来自 Android 平板的横屏模式。\n\n![image](img/fig2.5.jpg)\n\n\n\n\n```css\nimg.scaled\
  \ {\n  -webkit-box-shadow: 10px 10px 5px #800;\n  box-shadow: 10px 10px 5px #800;\n\
  }\n\nimg.scaled:hover {\n  -webkit-transform : scale(2);\n  transform : scale(2);\n\
  }\n```\n\nListing 2.8 中的 `img` 选择器指定了一个过渡属性，该属性使用 `ease` 函数在一秒的间隔内应用变换效果，如下所示：\n\
  \n```css\ntransition: transform 1.0s ease;\n```\n\n接下来，选择器 `img.scaled` 指定了 `box-shadow`\
  \ 属性，它创建了一个红色的阴影效果（你之前在本章中已经见过它），如下所示：\n\n```css\nimg.scaled {\n  -webkit-box-shadow:\
  \ 10px 10px 5px #800;\n  box-shadow: 10px 10px 5px #800;\n}\n```\n\n最后，选择器 `img.scaled:hover`\
  \ 指定了一个变换属性，该属性使用 `scale()` 函数，当用户用鼠标悬停在任何 `<img>` 元素上时，会将关联 JPG 文件的大小放大一倍，如下所示：\n\
  \n```css\ntransform : scale(2);\n```\n\n由于 `img` 选择器指定了使用 `ease` 函数的一秒间隔，因此缩放效果将持续一秒。可以尝试不同的\
  \ CSS3 `scale()` 函数取值，以及时间间隔的不同值，以创建适合你需求的动画效果。\n\n另一个需要记住的点是，你可以同时进行水平和垂直缩放：\n\n\
  ```css\nimg {\n  -webkit-transition: -webkit-transform 1.0s ease;\n  transition:\
  \ transform 1.0s ease;\n}\n\nimg.mystyle:hover {\n  -webkit-transform : scaleX(1.5)\
  \ scaleY(0.5);\n  transform : scaleX(1.5) scaleY(0.5);\n}\n```\n\n图 2.6 显示了 CSS\
  \ 样式表 `Scale1.css` 中的选择器与 HTML 页面 `Scale1.html` 匹配的结果。该横屏截图取自运行在带有 Android ICS 的\
  \ Nexus S 4G 智能手机上的 Android 应用（基于 Listing 2.7 和 Listing 2.8 中的代码）。\n\n## 旋转变换](#toc.html_toc-h2-0019)\n\
  \nCSS3 transform 属性允许你指定 `rotate()` 函数来创建缩放效果，其语法格式如下：\n\n```css\nrotate(someValue);\n\
  ```\n\n你可以将 `someValue` 替换为任何数字。当 `someValue` 为正数时，旋转为顺时针方向；当 `someValue` 为负数时，旋转为逆时针方向；当\
  \ `someValue` 为零时，则没有旋转效果。在所有情况下，旋转效果的初始位置都是正水平轴。\n\n![image](img/fig2.6.jpg)\n\n\
  ***图 2.6*** 基于 CSS3 的 JPG 文件缩放效果。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `Rotate1.html`\
  \ 和 CSS 样式表 `Rotate1.css` Illust 明了如何创建旋转效果，其一个示例所示：\n\n```css\nimg.imageL:hover\
  \ {\n  -webkit-transform : scale(2) rotate(-45deg);\n  transform : scale(2) rotate(-45deg);\n\
  }\n```\n\n`img` 选择器指定了一个过渡属性，该属性使用 `ease` 定时函数在一秒的间隔内创建一个动画效果，如下所示：\n\n```css\n\
  transition: transform 1.0s ease;\n```\n\nCSS3 transform 属性允许你指定 `skew()` 函数来创建倾斜效果，其语法格式如下：\n\
  \n```css\nskew(xAngle, yAngle);\n```\n\n你可以将 `xAngle` 和 `yAngle` 替换为任何数字。当 `xAngle`\
  \ 和 `yAngle` 为正数时，倾斜效果为顺时针方向；当 `xAngle` 和 `yAngle` 为负数时，倾斜效果为逆时针方向；当 `xAngle` 和\
  \ `yAngle` 为零时，则没有倾斜效果。在所有情况下，倾斜效果的初始位置都是正水平轴。\n\n![image](img/cd.jpg) HTML5 页面\
  \ `Skew1.html` 和 CSS 样式表 `Skew1.css` 位于 CD 上，它们说明了如何创建倾斜效果。该 CSS 样式表包含 `img` 选择器，该选择器指定了一个过渡属性，进而使用\
  \ `ease` 定时函数在一秒的间隔内创建一个动画效果，如下所示：\n\n```css\ntransition: transform 1.0s ease;\n\
  ```\n\n还有四个选择器 `img.skewed1`、`img.skewed2`、`img.skewed3` 和 `img.skewed4` 分别创建深浅不一的红、黄、绿、蓝背景投影效果（这些在之前的代码示例中都见过）。\n\
  \n选择器 `img.skewed1:hover` 指定了一个变换属性，当用户用鼠标悬停在第一个 `<img>` 元素上时，会执行倾斜效果，如下所示：\n\n\
  ```css\ntransform : scale(2) skew(-10deg, -30deg);\n```\n\n另外三个 CSS3 选择器也使用了 CSS\
  \ 函数 `skew()` 和 `scale()` 的组合来创建不同的视觉效果。注意，第四个悬停选择器还将透明度（opacity）属性设置为 0.5，这与该选择器中的其他效果并行发生。\n\
  \n图 2.7 显示了 CSS 样式表 Skew1.css 中的选择器与 HTML 页面 Skew1.html 匹配的结果。该横屏截图取自运行在 Nexus S\
  \ 4G 智能手机上的 Android 应用。\n\n![image](img/fig2.7)\n\n***图 2.7*** 基于 CSS3 的缩放效果。\n\n\
  CSS3 transform 属性允许你指定 `translate()` 函数来创建元素的水平和垂直位移，其语法格式如下：\n\n```css\ntranslate(xDirection,\
  \ yDirection);\n```\n\n位移是相对于原点的，即屏幕的左上角。因此，`xDirection` 和 `yDirection` 的正值会产生向右和向下的偏移，而\
  \ `xDirection` 和 `yDirection` 的负值则产生向左和向上的偏移。\n\n![image](img/cd.jpg) CD 上的 HTML5\
  \ 页面 `Translate1.html` 和 CSS 样式表 `Translate1.css` 说明了如何对 JPG 文件应用位移效果。\n\n```css\n\
  img.trans2:hover {\n  -webkit-transform : scale(0.5) translate(-50px, -50px);\n\
  \  transform : scale(0.5) translate(-50px, -50px);\n}\n```\n\n该 CSS 样式表包含 `img`\
  \ 选择器，该选择器指定了一个使用 `ease` 定时函数在一秒间隔内的过渡效果，如下所示：\n\n```css\ntransition: transform\
  \ 1.0s ease;\n```\n\n四个选择器 `img.trans1`、`img.trans2`、`img.trans3` 和 `img.trans4`\
  \ 分别创建红、黄、绿、蓝深色的背景投影效果，正如你在前一节中看到的那样。\n\n选择器 `img.trans1:hover` 指定了一个变换属性，当用户用鼠标悬停在第一个\
  \ `<img>` 元素上时，会执行缩放效果和位移效果，如下所示。\n\n图 2.8 显示了 CSS 样式表 Translate1.css 中的选择器与 HTML\
  \ 页面 Translate1.html 匹配的结果。该横屏截图取自带有 Android ICS 的 Nexus S 4G 智能手机上的 Android 应用。\n\
  \n![image](img/fig2.8.jpg)\n\n***图 2.8*** 基于 CSS3 的 JPG 文件缩放和位移效果。\n\n## CSS3 媒体查询](#toc.html_toc-h1-0014)\n\
  \nCSS3 媒体查询是非常用的逻辑表达式，允许检测具有不同物理属性和方向的移动应用程序。例如，通过 CSS3 媒体查询，你可以更改应用程序的尺寸和布局，使其在智能手机和平板上都能正确显示。\n\
  \n你可以使用 CSS3 媒体查询确定设备的以下特征：\n\n*   浏览器窗口宽度和高度\n*   设备宽度和高度\n*   方向（横屏或竖屏）\n*   比例\n\
  *   设备比例\n*   分辨率\n\nCSS3 媒体查询是布尔表达式，包含一个或多个“简单项”（使用 and 或 or 连接），这些项评估结果为真或假。\n\
  \n\n\n\n\n例如，以下 `link` 元素仅当设备为屏幕且设备最大宽度为 `480px` 时才会加载 CSS 样式表 `mystuff.css`：\n\n\
  ```html\n<link rel=\"stylesheet\" type=\"text/css\" media=\"screen and (max-device-width:\
  \ 480px)\" href=\"mystuff.css\"/>\n```\n\n上述 `link` 包含一个 `media` 属性，它指定了两个部分：媒体类型为\
  \ `screen`，以及一个指定 `max-device-width` 值为 `480px` 的查询。CSS3 媒体查询中 `media` 的支持值包括 `braille,\
  \ embossed, handheld, print, projection, screen, speech, tty` 和 `tv`。\n\n下一个 CSS3\
  \ 媒体查询检查了媒体类型、设备最大宽度以及设备的分辨率：\n\n```css\n@media screen and (max-device-width: 480px)\
  \ and (resolution: 160dpi) {\n  #innerDiv {\n    float: none;\n  }\n}\n```\n\n如果上述代码段中的\
  \ CSS3 媒体查询求值为为真，则嵌套的 CSS 选择器将匹配 `id` 属性值为 `innerDiv` 的 HTML 元素，并且任何最大屏幕宽度为 `480px`\
  \ 的设备上，其 `float` 属性将被设置为 `none`。如你所示，可以创建包含非平凡逻辑的紧凑 CSS3 媒体查询，这显然非常有用，因为 CSS3 没有像其他编程语言那样的\
  \ `if/then/else` 结构。\n\n![image](img/cd.jpg) CD 额外代码示例\n\nCSS 样式表 `CSS3MediaQuery1.css`\
  \ 和 HTML5 网页 `CSS3MediaQuery1.html` 阐明了如何使用媒体查询在用户旋转移动设备时更改两幅图像的大小。\n\n![image](img/cd.jpg)\
  \ 你可以使用简单的 JavaScript 代码检测移动设备方向的变化，因此你并不“被迫”使用 CSS3 媒体查询。CD 上的 HTML5 网页 `CSS3OrientationJS1.html`\
  \ 阐明了如何使用标准 JavaScript 在用户旋转移动设备时更改两幅图像的大小。\n\n本质上，该代码使用变量 `window.orientation`\
  \ 的值来检测移动设备的四种不同方向。在每种情况下，都会使用以下类型的代码更新 JPG 文件的尺寸：\n\n```javascript\ndocument.getElementById(\"\
  img1\").style.width = \"120px\";\ndocument.getElementById(\"img1\").style.height\
  \ = \"300px\";\n```\n\n尽管这是一个非常简单的例子，但希望这段代码能让你体会 CSS3 媒体查询的能力。\n\n## 总结 (#toc.html_toc-h1-0016)\n\
  \n本章向你展示了如何创建图形效果、阴影效果以及如何在 CSS3 中使用变换（transforms）。你学习了如何创建可以应用于 HTML 元素的动画效果，并看到了如何定义\
  \ CSS3 选择器来执行以下操作：\n\n*   渲染圆矩\n*   为文本和 2D 形状创建阴影效果\n*   创建线性和径向渐变\n*   使用 `translate()`、`rotate()`、`skew()`\
  \ 和 `scale()` 方法\n*   创建基于 CSS3 的动画效果\n\n## 第 3 章 (#toc.html_toc-3)\n\n### 使用 JQUERY\
  \ 和 CSS3 实现动画效果 (#toc.html_toc-3)\n\n本章向你展示了如何创建动画效果并为用户提供交互的 HTML5 网页。你将看到一组创建各种动画效果的\
  \ `jQuery` 函数，你可以轻松地将它们整合到你的 HTML5 网页中。这个内容广泛的章节旨在为你提供许多动画效果，以及一系列代码示例和代码片段，你可以将它们整合到你的其他\
  \ HTML5 网页中。\n\n本章的第一部分向你展示了如何使用 `jQuery` 通过设置 CSS3 选择器的属性值来操作元素的属性，并提供了使用 `animate`\
  \ 和 `effect` 创建动画效果的示例。你将看到创建基于滑动的和淡入淡出的（`fadeIn`, `fadeOut`, `fadeTo`）动画效果的代码示例。本节还阐明了如何结合\
  \ `jQuery` 和 CSS3 `keyframes` 创建 2D 动画效果。\n\n本章的第二部分阐明了如何创建一个“跟随鼠标”的 HTML5 网页，该网页使用\
  \ CSS3 用于视觉效果，并使用 `jQuery` 更新渐变填充矩形的位置。记住，书中章节中的 CSS3 示例专门针对基于 WebKit 的浏览器，但你可以修改代码示例以包含特定厂商的前缀，以便代码示例可以在其他浏览器中运行。本章的最后一个示例说明了如何使用\
  \ `jQuery` 插件通过 `jQuery` 渲染 `SVG`。\n\n注意，本章涵盖了 `jQuery` 动画效果，第七章包含了某些使用 `jQuery\
  \ Mobile` 的对应动画效果，这两个章节都包含了基于 CSS3 的动画效果。由于空间限制，本章仅涵盖了 `jQuery` 可用的部分功能。你可以通过在线\
  \ `jQuery` 文档或搜索额外的教程和文章来了解更多 `jQuery` 动画。\n\n## 在 jQuery 中处理 CSS3 选择器 (#toc.html_toc-h1-0017)\n\
  \n本节包含代码示例，阐明了如何使用 `jQuery` 通过操作 CSS 类程序化地创建视觉效果，例如圆角、渐变和阴影效果。\n\n### jQuery 中的基础动画效果\
  \ (#toc.html_toc-h1-0018)\n\n本节包含代码片段而非完整的列表，这些代码片段阐明了如何使用 `hide()` 和 `show()` 创建动画，以及如何设置动画速度。请记住本节仅涵盖了可用功能集的一部分。务必阅读在线文档以了解其他功能。\n\
  \n`hide()` 和 `show()` 函数允许你更改 HTML 页面中元素的可见性。例如，以下代码在用户点击第一个按钮时隐藏第二个按钮；当用户双击第一个按钮时，第二个按钮变为可见：\n\
  \n```javascript\n$(\"#myButton1\").click(function() {\n  $(\"#myButton2\").hide();\n\
  });\n\n$(\"#myButton1\").dblclick(function() {\n  $(\"#myButton2\").show();\n});\n\
  ```\n\n`toggle` 函数可以处理同一个事件的两次或多次发生。例如，以下代码处理一个元素上的一次、两次或三次点击事件：\n\n```javascript\n\
  $(\"#myDiv1\").toggle(\n  function() {\n    $(\"myText\").text(\"First click\");\n\
  \  },\n  function() {\n    $(\"#myText\").text(\"Second click\");\n  },\n  function()\
  \ {\n    $(\"#myText\").text(\"Third click\");\n  }\n);\n```\n\n另外两个实用的 `jQuery`\
  \ 方法是 `removeClass()` 和 `addClass()`，它们分别移除或添加 CSS 类，示例在此：\n\n```javascript\n$(\"\
  #myDiv1\").toggle(\n  function() {\n    $(\"myText\").addClass(\"shiny\");\n  },\n\
  \  function() {\n    $(\"#myText\").addClass(\"dark\");\n  }\n);\n```\n\n`addClass()`\
  \ 方法添加 CSS 类，而 `toggleClass()` 方法则“切换” CSS 类；即：如果类不存在则添加它，如果已经包含则移除它。其他相关的 `jQuery`\
  \ 方法包括使用淡入淡出效果的 `fadeClass()` 和创建滑动效果的 `slideClass()`。\n\n## 使用回调函数 (#toc.html_toc-h2-0020)\n\
  \n许多 `jQuery` 函数（包括 `hide()`、`show()`、`toggle()` 和滑动相关的函数）允许你指定一个回调函数，该函数将在指定的操作完成后执行。例如，你可以定义以下代码块：\n\
  \n```javascript\n$(\"#myButton1\").click(function() {\n  $(\"#myButton2\").hide('slow',\n\
  ```\n\n\n\n```javascript\nfunction callback() {\n  // do something else\n});\n});\n\
  ```\n\n当用户点击 id 为 `myButton1` 的元素时，上一个代码块会缓慢隐藏 id 为 `myButton2` 的元素，在动画完成后，将执行 `callback`\
  \ 函数中的代码。\n\n本书包含了基于 WebKit 的代码示例，但如果你决定在 IE 中使用上一个代码块，请记住在 IE 中在回调函数中使用命名函数（named\
  \ functions）时存在一个 bug。下文提供了有关命名函数的有用信息：\n\n[`kangax.github.com/nfe`](http://kangax.github.com/nfe)\n\
  \n# jQuery 渐入和滑动动画效果\n\njQuery 与淡入（fade）和滑动（slide）相关的效果很容易创建，如果你定义得当，它们可以在你的 Web\
  \ 页面中创建非常佳的视觉效果。\n\n以下示例结合了 jQuery 的 `.fadeIn()` 和 `.fadeOut()` 函数，还向你展示了如何链式调用这些函数以便创建多个动画效果。\n\
  \n## fadeIn(), fadeOut(), 和 fadeToggle() 函数\n\n这三个 jQuery 函数 `.fadeIn()`、`.fadeOut()`\
  \ 和 `.fadeToggle()` 方法可以指定三个参数，其语法所示：\n\n`jQuery(list-of-elements).fadeIn(speed);`\n\
  \n`jQuery(list-of-elements).fadeOut(speed);`\n\n`jquery(list-of-elements).fadeTo(speed);`\n\
  \n下方的代码块说明了如何使用这三个 jQuery 函数：\n\n```javascript\n$(\"#something\").click(function()\
  \ {\n  $(this).fadeIn('slow');\n});\n\n$(\"#something\").click(function() {\n  $(this).fadeOut('slow');\n\
  });\n\n$(\"#something\").click(function() {\n  $(this).fadeTo('slow', .65);\n});\n\
  ```\n\n`Listing 3.1` 显示了 `FadeInOut.html` 的内容，并插插了如何在 jQuery 中执行简单和链式的淡入效果。\n\n\
  ### 列表 3.1 FadeInOut.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\" />\n  <title>jQuery 渐入相关效果</title>\n  <script src=\"\
  http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  ></script>\n</head>\n<body>\n  <div>\n    <div> <p>Hello World from jQuery (悬停在我身上)</p>\
  \ </div>\n    <div> <p>Goodbye World from jQuery (悬停在我身上)</p> </div>\n    <div>\n\
  \      <input type=\"button\" id=\"button1\" value=\"Hide Me\" />\n    </div>\n\
