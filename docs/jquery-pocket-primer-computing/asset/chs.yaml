  `newNode = $('<div>').css({'position':'absolute', 'background': currentBG, 'width':'35px',\
  \ 'height':'35px', top: event.pageY});`\n\n`$(\"#CanvasParent\").append(newNode);`\n\
  \n注意，在前面的代码中 `position` 被设置为 `absolute`，这意味着这个 `<div>` 元素将会被保留。最后，当用户点击任何一个 `<div>`\
