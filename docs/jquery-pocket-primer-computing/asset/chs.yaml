  \nFigure 3.2 在 MacBook 的 Chrome 浏览器中显示 `JQSketchSolid1.html`。\n\n![image](img/fig3.2.jpg)\n\
  \n*图 3.2 在 MacBook 的 Chrome 浏览器中使用 jQuery 绘图。*\n\n用于 3D 动画的 jQuery 插件 `rotate3di`\
  \ 允许对 HTML 内容以及其他视觉效果进行动画处理，其主页在这里：\n\n*[`www.zachstronaut.com/projects/rotate3di/`](http://www.zachstronaut.com/projects/rotate3di/)*\n\
  \n![image](img/cd.jpg) 你还可以将 jQuery 与 SVG 结合，而不是动态创建使用 CSS3 选择器样式的 `<div>` 元素。随附的\
  \ CD 包含 HTML5 页面 `JQArchDoubleEllipse1Rotate1.html`，它介绍了如何将 jQuery 与 SVG 结合。然而，这段代码与之前的代码示例相似，因此其内容在本书中省略。\n\
  \n![image](img/cd.jpg) CD 上的 HTML5 页面 `JQBouncingBalls1.html` 阐述了如何在 jQuery HTML5\
  \ 页面中渲染一组垂直跳跃的球。Figure 3.3 显示了在带有 Android ICS 的 Asus Prime 平板上渲染此 HTML5 页面的结果。\n\
  \n![image](img/fig3.3.jpg)\n\n*图 3.3 带有 Android ICS 的 Asus Prime 平板上的跳球。*\n\njQuery\
  \ 插件 `PFold` 提供了一种良好的折叠效果，可以在此处下载：\n\n*[`tympanus.net/Development/PFold/`](http://tympanus.net/Development/PFold/)*\n\
  \n## 动画：比较 CSS3 与 jQuery (#toc.html_h1-0025)\n\nHTML5 页面 `JQSlideShow1.html` 阐述了如何使用\
  \ jQuery 创建包含 JPG 图像的幻灯片，它使用以下代码块来确定下一个 HTML `<img>` 元素（当到达最右侧的图像时，它会循环到列表的第一张图像），并添加\
  \ `show` 属性，如下：\n\n```javascript\nnext = curr.next().length ? curr.next() :\n  \
  \     curr.parent().children(':first');\n\nnext.addClass(\"show\");\n```\n\n用于 3D\
  \ 动画的 jQuery 插件 `rotate3di` 允许对 HTML 内容以及其他视觉效果进行动画处理，其主页在这里：\n\n*[`www.zachstronaut.com/projects/rotate3di/`](http://www.zachstronaut.com/projects/rotate3di/)*\n\
  \n第一个链接是 Christian Heilmann 写的的一篇文章，包含了五个性能相关的建议：\n\n*[`christianmann.com/2013/01/25/five-things-you-can-do-to-make-html5-perform-better/`](http://christianmann.com/2013/01/25/five-things-you-can-do-to-make-html5-perform-better/)*\n\
  \n第二个链接提供了性能基准（它与 Christian 的其中一个略有不同）：\n\n*[`blog.tumult.com/2013/02/28/transform-translate-top-left/`](http://blog.tumult.com/2013/02/28/transform-translate-top-left/)*\n\
  \n第三个链接是 Opera 网站上一篇文章，比较了 CSS3 和 jQuery 的性能：\n\n“CSS3 遥遥胜出。性能上的巨大差异是因为浏览器的 CSS\
  \ 处理器是用 C++ 编写的，原生代码执行非常快，而 jQuery (JavaScript) 是一种解释型语言，在就将发生什么事件方面，浏览器无法提前预判。”\n\
  \n上述引言来自以下网站：\n\nhttp://dev.opera.com/articles/view/css3-vs-jquery-animations/#comments\n\
  \n上述网站还说明了以下内容：\n\n“尽管上面的结果表明你应该使用 CSS3 进行动画，但请记住我们在文章早些时候讨论的优缺点。你需要考虑到很大比例的人仍然在使用\
  \ Internet Explorer 7 和 8，因此如果你的动画绝对需要在这些旧浏览器中正常工作，就应该使用 jQuery。”\n\n## 总结 (#toc.html_toc-h1-0026)\n\
  \n本章介绍了 jQuery 图形和动画效果，并提供了说明如何使用 jQuery 函数创建简单动画效果的代码示例。特别是，你学习了如何执行以下操作：\n\n-\
  \   jQuery 中的基础动画\n-   jQuery 中的 Effect 操作\n-   jQuery 中的滚动效果\n-   使用 CSS3 选择器\n\
  -   使用 `css()` 函数设置属性\n-   切换 CSS 属性\n-   创建圆角\n-   创建阴影效果\n-   设置线性径向渐变\n-   处理图像\n\
  -   `hide()` 和 `show()` 函数\n-   使用回调函数\n-   `fadeIn()`、`fadeOut()` 和 `fadeTo()`\
  \ 方法\n-   设置速度\n-   切换 `hide()` 和 `show()`\n-   jQuery 淡入淡出和滑动效果\n\n\n\n\n\n*  \
  \ `fadeIn()` 和 `fadeOut()` 函数\n*   `jQuery` 的 `slideUp()` 和 `slideDown()` 函数\n*\
  \   `jQuery` 中的缓动函数\n*   使用 `animate()` 自定义 CSS 动画\n*   创建图片幻灯片\n*   基于 CSS3 的动画效果\n\
  *   使用 CSS3 的简单滑动效果\n*   使用 CSS3 更新多个属性\n*   使用 CSS 的滑动效果\n*   使用 CSS3 keyFrames\
  \ 和 2D 变换的动画效果\n*   使用 CSS3 和 `jQuery` 进行 2D 变换\n*   使用 CSS3 和 `jQuery` 进行 3D 变换\n\
  *   使用 `jQuery` 的鼠标跟随示例\n*   你的第一个绘画程序\n\n下一章将为你介绍各种 `jQuery UI` 控件，以及展示如何在 HTML5\
  \ 页面中渲染某些 `jQuery UI` 控件的代码示例。\n\n# jQuery UI 控件\n\n本章将为你介绍各种 `jQuery UI` 控件，以及展示如何在\
  \ HTML5 页面中渲染某些 `jQuery UI` 控件的代码示例。使用这些 UI 控件的理由很简单：它们不需要像编写 way 自定义 UI 控件那样花费大量精力，你也不需要维护这些控件的代码。此外，这些\
  \ UI 控件在多种浏览器上运行良好。\n\n你将看到使用 `jQuery` 渲染折叠面板、按钮、组合框、日期选择器、进度条、滑动条和标签页的示例。此外，你将学习如何通过处理涉及\
  \ `jQuery UI` 控件的用户触发事件。通过查阅 `jQuery` 首页，你可以了解更多可用 UI 控件。\n\n本章中的 `jQuery UI` 控件按字母顺序排列，因此你可以随时跳转阅读，以阅读你感兴趣的\
  \ UI 控件。虽然 `jQuery` 文档中提供了这些 UI 控件的信息，但这是一本入门级书籍，因此，在一个方便的地方列出 UI 控件列表，比直接告诉你“去读文档”要恰当得多。在读完本章后，你将能够更好地理解章节末尾冗长的代码示例。该示例展示了一个包含各种\
  \ `jQuery UI` 控件的 HTML5 页面，其方式反映了某种真实的场景。\n\n本章还包含了处理用户点击事件的代码示例，这些事件会触发定义在同一 HTML5\
  \ 页面其他地方（有时是图形化的）元素的更新。这种方法可以让你轻松理解如何实现事件相关的功能，希望你能够将本章中的代码示例调整到你的特定需求。\n\n需要记住的一点是，本章中的\
  \ HTML5 页面同时包含 HTML 标记和 `jQuery` 代码。对于较长的网页，将 `jQuery` 代码放在单独的文件中正如我们处理 CSS 样式表那样）更有意义。然而，本章中的几乎每个网页都很短（在\
  \ 1 页到 1.5 页之间），因此为了方便，将代码保持在单个文件中。\n\n第二点涉及如何编写自己的 `jQuery` 插件，这超出了本书的范围。如果你找不到任何满足需求的现有\
  \ `jQuery` 插件，可以在网上找到教你如何编写 `jQuery` 插件的教程。\n\n## 在章中使用 jQuery 2.0\n\n以下代码示例在 `jQuery`\
  \ 1.5 中运行正常，但在 `jQuery` 2.0.0 中无法正常工作：\n\n*   `JQUIProgressBar1.html`（未显示进度条）\n\
  *   `JQUISlider1.html`（未显示滑动条）\n*   `JQUISliderColors1.html`（未显示滑动条）\n*   `JQUIThemes1.html`（使用\
  \ GitHub 上提供的插件）\n\n请记住，未来的 `jQuery` 版本无疑将解决这些问题以及你在使用 `jQuery` 的 HTML 网页中可能遇到的其他不一致问题。\n\
  \n## 折叠面板效果\n\n`jQuery UI` 支持折叠面板（accordion）控件，它包含一个或多个“文件夹”，只有在点击特定文件夹时才会显示内容。\n\
  \n示例 4.1 展示了 HTML5 页面 `JQUIAccordion1.html`，展示了如何渲染折叠面板控件。\n\n### 4.1 JQUIAccordion1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>jQuery Accordion</title>\n  <link href=\"JQUIAccordion1.css\" rel=\"\
  stylesheet\" type=\"text/css\">\n  <link type=\"text/css\" href=\"css/themename/jquery-ui-1.8.14.custom.css\"\
  \ />\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n  <link href=\"JQUIAccordion1.css\"\
  \ rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n  <div id=\"accordion\"\
  >\n    <h3><a href=\"#\">Section 1</a></h3>\n    <div>\n      <p> This is the first\
  \ section of the accordion. </p>\n    </div>\n    <h3><a href=\"#\">Section 2</a></h3>\n\
  \    <div>\n      <p> This is the second section of the accordion. </p>\n      <ul>\n\
  \        <li>List item one</li>\n        <li>List item two</li>\n        <li>List\
  \ item three</li>\n      </ul>\n    </div>\n    <h3><a href=\"#\">Section 3</a></h3>\n\
  \    <div>\n      <p> This is the section of the third accordion. </p>\n    </div>\n\
  \    <h3><a href=\"#\">Section 4</a></h3>\n    <div>\n      <p> This is the section\
  \ of the fourth accordion. </p>\n      <div id=\"outer\">\n        <div id=\"inner1\"\
  ></div>\n        <div id=\"inner2\"></div>\n        <div id=\"inner3\"></div>\n\
  \      </div>\n    </div>\n  </div>\n  <script>\n    $(function() {\n      $(\"\
  #accordion\").accordion();\n    });\n  </script>\n</body>\n</html>\n```\n\n\n\n\n\
  启动列表 4.1 中的 HTML5 页面，并点击渲染后的手风琴控件中的每个“文件夹”，这将显示当前选中文件夹的内容，并隐藏该手风琴中其他文件夹的内容。\n\n\
  图 4.1 显示了在列表 4.1 中`JQUIAccordion1.html`的渲染结果，该截图是从一个运行在 Android ICS 的 Nexus S 4G\
  \  Android 应用程序拍摄的横屏模式。\n\n## 按钮\n\n按钮\n\n按钮在 页面中显然非常重要，特别是对于提交表单数据而言，而 jQuery 为按钮相关功能提供了大量的支持。你可以定义\
  \ CSS 选择器为 HTML 按钮应用任何你需要的样式效果，包括渐变和阴影效果。\n\n列表 4.3 显示了 HTML5 页面 `JQUIButtons1.html`\
  \ 的内容，它说明了如何在 HTML 页面中渲染按钮。CSS 样式表 `JQUIButtons1.css` 被省略，因为它的内容与列表 4.2 相同。\n\n\
  ### 列表 4.3 JQUIButtons1.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\" />\n  <title>jQuery Buttons</title>\n  <link href=\"\
  JQUIButtons1.css\" rel=\"stylesheet\" type=\"text/css\">\n  <link type=\"text/css\"\
  \ rel=\"Stylesheet\" href=\"css/themename/jquery-ui-1.8.14.custom.css\" />\n  <script\
  \ src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n\
  </head>\n<body>\n  <div id=\"outer\">\n    <div class=\"buttons\">\n      <button>A\
  \ regular button</button>\n      <input type=\"submit\" value=\"A submit button\"\
  >\n      <a href=\"#\">An anchor button</a>\n    </div>\n    <div id=\"inner1\"\
  ></div>\n    <div id=\"inner2\"></div>\n    <div id=\"inner3\"></div>\n  </div>\n\
  \  <script>\n    $(function() {\n      $( \"input:submit, a, button\", \".buttons\"\
  \ ).button();\n    });\n  </script>\n  <script>\n    $(document).ready(function()\
  \ {\n      var divColors = new Array('#000', '#F0F', '#F00', '#0F0', '#00F', '#0FF');\n\
  \      var clickCount = 0;\n      var color1 = \"\";\n      $(\"button\").click(function()\
  \ {\n        ++clickCount;\n        color1 = divColors[(clickCount) % divColors.length];\n\
  \        $(\"#inner1\").css({background: color1});\n      });\n      $(\"input\"\
  ).click(function() {\n        ++clickCount;\n        color1 = divColors[(clickCount)\
  \ % divColors.length];\n        $(\"#inner2\").css({background: color1});\n    \
  \  });\n      $(\"a\").click(function() {\n        ++clickCount;\n        color1\
  \ = divColors[(clickCount) % divColors.length];\n        $(\"#inner3\").css({background:\
  \ color1});\n      });\n    });\n  </script>\n</body>\n</html>\n```\n\n列表 4.3 包含一个\
  \ `<script>` 元素，它通过一行代码将 `button()` 方法应用于三个 HTML 元素，并将它们转换为 jQuery 按钮，如此片段所示：\n\n\
  ```javascript\n$(\"input:submit, a, button\", \".buttons\").button();\n```\n\n注意，`.buttons`\
  \ 类（用于样式化包含 HTML 按钮和锚点的 `<div>` 元素）在前面的代码片段中也被指定了。这个额外的类在代码中是多余的，但它向你展示了指定一组想要转换为\
  \ jQuery 按钮的 HTML 元素的灵活性。\n\n接下来的代码块渲染了三个 `<div>` 元素，其颜色是在关联样式表中定义的对应选择器中指定的。启动列表\
  \ 4.3 中的 HTML 页面，当你点击顶行的按钮（包括锚点链接）时，矩形会改变。例如，由于以下代码的作用，每当用户点击按钮时颜色就会改变：\n\n```javascript\n\
  $(\"button\").click(function() {\n  ++clickCount;\n  color1 = divColors[(clickCount)\
  \ % divColors.length];\n  $(\"#inner1\").css({background: color1});\n});\n```\n\n\
  在前面的事件处理器中，颜色是从 JavaScript 数组 `divColors` 中选择的。图 4.2 显示了列表 4.3 中`JButtons.html`的渲染结果，该截图是从\
  \ iPad 拍摄的横屏模式。\n\n![image](img/fig4.2.jpg)\n图 4.2 iPad 上的按钮\n\n## 复选框和单选按钮\n\n\
  复选框和单选按钮\n\njQuery 允许为复选框和单选按钮添加事件处理器，以便你可以确定哪些被选中了。列表 4.4 显示了 `JCheckboxRadio1.html`\
