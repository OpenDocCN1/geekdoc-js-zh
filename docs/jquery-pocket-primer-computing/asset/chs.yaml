  ></script>\n  <script src=\"http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n\
  \  <style>\n    #progressBar1 {\n      width: 30%;\n    }\n  </style>\n</head>\n\
  <body>\n  <div id=\"outer\">\n    <div id=\"progressBar1\">\n      进度条：\n      <div\
  \ id=\"progressBar1\"> </div>\n    </div>\n    <div id=\"value1\">\n      进度条值：\n\
  \      <input id=\"text1\" type=\"text\" value=\"0\" />\n    </div>\n    <div id=\"\
  newValue\">\n      设置新值：\n      <input id=\"newVal\" type=\"text\" value=\"0\" />\n\
  \    </div>\n  </div>\n  <script>\n    $(document).ready(function() {\n      $(\"\
  #progressBar1\").progressbar({ value: 40 });\n      $(\"#text1\").val($(\"#progressBar1\"\
  ).progressbar(\"value\"));\n      $(\"#newValue\").bind(\"change\", function() {\n\
  \        var newVal = $(\"#newVal\").val();\n        $(\"#progressBar1\").progressbar(\"\
  option\", \"value\", parseInt(newVal));\n      });\n    });\n  </script>\n</body>\n\
  </html>\n```\n\n你可以指定一个未来的日期，并且当你想要更改该日期时，jQuery 将显示相对于该日期的上一个月和下个月，如下所示：\n\n```javascript\n\
  // 设置日期为未来\nvar futureDate = \"07/07/2017\";\n$(\"#date3\").datepicker(\"setDate\"\
  ,futureDate);\n```\n\n\n\n\n```javascript\n$(document).ready(function() {\n    $(\"\
