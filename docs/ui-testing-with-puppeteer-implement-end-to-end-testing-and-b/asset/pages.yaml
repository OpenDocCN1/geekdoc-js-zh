  md: "Creating a Puppeteer browser 55\n\nLet's run the site in one terminal using\
    \ the same commands we used before:\n\n**\\> cd vuejs-firebase-shopping-cart **\n\
    \n**\\> npm run build**\n\n**\\> npm run serve**\n\nYou should get something like\
    \ this:\n\n**DONE Compiled successfully in 5523ms **\n\n**1:42:33 PM**\n\n** App\
    \ running at:**\n\n** - Local: http://localhost:8080/ **\n\n** - Network: http://192.168.86.64:8080/**\n\
    \n** Note that the development build is not optimized.**\n\n** To create a production\
    \ build, run npm run build.**\n\nNow let's run the tests in another terminal:\n\
    \n**npm test**\n\nAnd here, you should be getting something like this:\n\n**\\\
    > mocha --timeout 30000 --reporter=list**\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_70_0.png)\n\
    \n** Login Page Should have the right title: 3ms**\n\n** 1 passing (875ms)**\n\
    \nIn the previous chapter, we didn't pay much attention to how we were using Puppeteer.\
    \ \n\nWe just knew that if we did browser = await puppeteer.launch(); we would\
    \ \n\nget a new browser. How? No idea. Well, it's time to understand a little\
    \ bit more about how \n\nPuppeteer works.\n\n**Creating a Puppeteer browser**\n\
    \nThe signature of the launch function is not launch(), but launch(options). \n\
    \nThanks to the freedom we have in JavaScript, we can just avoid passing that\
    \ argument, \n\nand the launch function will get options as undefined."
