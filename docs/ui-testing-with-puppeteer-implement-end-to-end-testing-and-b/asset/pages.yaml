    \ {\n\n constructor(page, config) {\n\n this.page = page;\n\n this.config = config;\n\
    \n }\n\n async go() {\n\n await this.page.goto(this.config.baseURL);\n\n }\n\n\
    \ async title() {\n\n return await this.page.title();\n\n }\n\n}"
