  md: "48 Automated Testing and Test runners\n\nWe can create a config.js file with\
    \ all the environment settings and return only the one \n\nwe get on an environment\
    \ variable. If not set, we return the local version:\n\nmodule.exports = ({\n\n\
    \ local: {\n\n baseURL: 'https://www.packtpub.com/',\n\n brandName: 'Packt',\n\
    \n mainProductName: 'Books'\n\n },\n\n test: {},\n\n prod: {},\n\n})\\[process.env.TESTENV\
    \ || 'local'\\]\n\nIf this looks a little bit scary, don't worry, it's not that\
    \ complex:\n\n• It returns an object with three properties: local, test, and prod.\n\
    \n• In JavaScript, you can access a property by using object.property or by \n\
    \ntreating the object as a dictionary: object\\['local'\\].\n\n•  process.env\
    \ allows us to read environment variables. We won't be using \n\nenvironment variables\
    \ in this book, but I wanted to show you the final solution.\n\n• Finally, we\
    \ are going to return only the local, test, or prod property based \n\non the\
    \ TESTENV variable or 'local' if the environment variable was not set.\n\nI bet\
    \ that by now, you will know that we will be able to access this object using\
    \ \n\na require call:\n\nconst config = require('./config');\n\nAnd from there,\
    \ start using the config variable instead of hardcoded values. We would \n\nalso\
    \ need to pass this config to the page model because we have a hardcoded URL there.\n\
    \nAfter making all these changes, this is what our tests should look like:\n\n\
    const puppeteer = require('puppeteer');\n\nconst expect = require('chai').expect;\n\
    \nconst should = require('chai').should();\n\nconst HomePageModel = require('./pom/HomePageModel.js');\n\
    \nconst config = require('./config');\n\ndescribe('Home page header', () => {"
