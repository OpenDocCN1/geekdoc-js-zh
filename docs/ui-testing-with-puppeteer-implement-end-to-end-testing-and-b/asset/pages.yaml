  md: "46 Automated Testing and Test runners\n\nWell done! We just created our first\
    \ Page Model. This is how it will look:\n\nmodule.exports = class HomePageModel\
    \ {\n\n go() {}\n\n title() {}\n\n search(searchValue) {}\n\n signIn() {}\n\n\
    \ viewCart(){}\n\n gotoCheckout(){}\n\n subscribe(){}\n\n}\n\nLet's focus on the\
    \ two first functions: the go function, which will navigate to the home \n\npage,\
    \ and the title function, which will return the page title.\n\nWe will reuse a\
    \ lot of code here. If we want to start using this model, we would need to do\
    \ \n\ntwo things: implement the title fetching here and pass a Puppeteer page\
    \ to this model:\n\nexport default class HomePageModel {\n\n constructor(page)\
    \ {\n\n this.page = page;\n\n }\n\n // Unused functions…\n\n async go() {\n\n\
    \ await this.page.goto('https://www.packtpub.com/');\n\n }\n\n async title() {\n\
    \n return await this.page.title();\n\n }\n\n}\n\nNow it's a matter of importing\
    \ this class into our tests using require. I will put this class \n\ninto a **POM**\
    \ (**Page Object Model**) folder inside the test folder. Once we create the file,\
    \ we \n\nimport it:\n\nconst HomePageModel = require('./pom/HomePageModel.js');"
