- img_proc: true
  md: "118 Interacting with a page \n\n**Summary**\n\nThis chapter was massive. We\
    \ began the chapter with a brief but complete introduction \n\nto HTML, the DOM,\
    \ and CSS. These concepts are crucial to create top-notch tests. Then, \n\nwe\
    \ learned a lot about XPath, which is not a very popular tool, yet it is extremely\
    \ powerful \n\nand will help you face scenarios where CSS selectors are not enough.\n\
    \nIn the second part of this chapter, we went through the most common ways to\
    \ interact \n\nwith a page. Not only did we learn how to interact with elements\
    \ but we also covered \n\nkeyboard and mouse emulation.\n\nI hope you enjoyed\
    \ the tools section. Debugging with Visual Studio Code is a great tool \n\nto\
    \ add to your toolbox.\n\nIn the next chapter, we are going to wait for stuff.\
    \ Things take time on the web. Pages take \n\ntime to load. Some actions on the\
    \ page might trigger network calls. The next chapter is \n\nimportant because\
    \ you will learn how to make your tests even more stable."
  merge: -1
  pgno: 133
- img_proc: true
  md: "**5**\n\n**Waiting for elements **\n\n**and network calls**\n\nI won't say\
    \ I'm old, but I started browsing the internet in the late 90s. So yes, I'm old.\
    \ Back \n\nthen, you would sometimes have to wait over a minute to get a page\
    \ loaded. You might \n\nbe thinking, \"So if you had 10 tabs open, that would\
    \ be impossible to use.\" Well, browsers \n\ndidn't have tabs! Downloading one\
    \ single MP3 file could take you an hour.\n\nIn the early 2000s, the web got into\
    \ the corporate world, and we started developing \n\nbusiness apps using websites.\
    \ But that was a decision from an IT department. Old \n\nterminal apps were hard\
    \ to update and introduce new features, and desktop apps were \n\nhard to distribute.\
    \ Web apps were the IT department's solution, leaving users with slow \n\nand\
    \ non-user-friendly web apps. \n\nDevelopers were trying to do their best with\
    \ the tools they had back then. Pages were \n\nmostly generated on the server\
    \ side using tools such as ASP 3.0 or PHP. AJAX was used \n\nfor small tasks,\
    \ such as loading the state's list based on a country selection without \n\nreloading\
    \ the entire page."
  merge: -1
  pgno: 134
- img_proc: true
  md: "120 Waiting for elements and network calls\n\nIn the late 2000s, Google launched\
    \ *Gmail*, showing the world how the web should look. \n\nBut the bar was too\
    \ high for developers. Developing those kinds of apps was unthinkable \n\nfor\
    \ developers just trying to build CRUD pages.\n\nNowadays, our web looks different.\
    \ Developers are now able to create rich experiences, \n\neven for more straightforward\
    \ scenarios. \n\nBut there is a thing that didn't change in all these years: **You\
    \ have to wait**.\n\nYou have to wait for the site to load, for the data to be\
    \ refreshed, for the new page to be \n\nopened, for the form to be submitted.\
    \ You have to wait.\n\nWaiting for the right moment to act is key to avoid having\
    \ flaky tests. A flaky test is a test \n\nthat sometimes passes and sometimes\
    \ fails. You have to consider flaky tests as a bug, not \n\nin the app but in\
    \ your tests. Flaky tests bring many problems:\n\n• They are a waste of time.\
    \ Nobody wants to merge a pull request with the tests in red. \n\nSo, they will\
    \ repeatedly run the tests until they get all the tests green.\n\n• Flaky tests\
    \ are a false alarm. Suppose the developer doesn't know that the test is \n\n\
    flaky. They might try to find a non-existent bug.\n\n• Flaky tests hurt your tests'\
    \ reputation. The loss of reputation begins by skipping one \n\nflaky test. If\
    \ you have more flaky tests, the team might move your tests to a nightly \n\n\
    process. If your tests keep being flaky, they might be removed from the CI process.\
    \ \n\nYou lose, and your team losses.\n\nWaiting for the right moment to act is\
    \ the key to making stable UI tests.\n\nIn this chapter, we will learn about the\
    \ tools that Puppeteer provides to act at the right \n\nmoment. We will also learn\
    \ different techniques and approaches, so you can know how \n\nyou can wait for\
    \ the page to be ready, for an input to be visible, or for a request to be \n\n\
    made, among many other things.\n\nThis chapter is about **waiting**, a key topic\
    \ in web automation. I also want to show you \n\na Puppeteer recorder so that\
    \ you can add one more tool to your toolbox. We will cover \n\nthe following topics\
    \ in this chapter:\n\n• Waiting for the page to load\n\n• Waiting for elements\n\
    \n• Waiting for network calls\n\n• Waiting for page events\n\n• Bonus: Headless\
    \ Recorder"
  merge: -1
  pgno: 135
- img_proc: true
  md: "Technical requirements 121\n\nLet's start at the beginning. How do you know\
    \ that the page is already loaded?\n\n**Technical requirements**\n\nYou will find\
    \ all the code of this chapter on the GitHub repository (https://github.\n\ncom/PacktPublishing/UI-Testing-with-Puppeteer)\
    \ under the Chapter5 \n\ndirectory. Remember to run npm install on that directory\
    \ and then go to the \n\nChapter5/vuejs-firebase-shopping-cart directory and run\
    \ npm install \n\nagain.\n\nIf you want to implement the code while following\
    \ this chapter, you can start from the \n\ncode you left in the Chapter4 directory.\n\
    \n**Waiting for the page to load**\n\nIn *Chapter 3*, *Navigating through a website*,\
    \ we talked about navigation through a site. \n\nWe covered functions such as\
    \ goto, goBack, goForward, and reload. One of \n\nthe options these functions\
    \ have is the waitUntil option. This option will help us \n\ndetermine when the\
    \ function we are calling will be resolved. Let's do a quick recap. \n\nWe have\
    \ four options there:\n\n•  domcontentloaded, which relies on the DOMContentLoaded\
    \ event.\n\n•  load: If you pass this option, the promise will be resolved when\
    \ the load event \n\nis fired. \n\n•  networkidle0 will resolve the promise *when\
    \ there are no more network *\n\n*connections for the past 500 ms*. \n\n•  networkidle2\
    \ will resolve the promise *when there are no more than 2 network *\n\n*connections\
    \ for the past 500 ms*."
  merge: -1
  pgno: 136
- img_proc: true
