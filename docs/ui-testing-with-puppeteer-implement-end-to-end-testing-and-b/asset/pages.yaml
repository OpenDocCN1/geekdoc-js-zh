  md: "50 Automated Testing and Test runners\n\nAs you can see, we didn't need to\
    \ implement complex design patterns to make our tests \n\nreusable and easy to\
    \ maintain. I think it's time to get started with our tests, which we will \n\n\
    do in *Chapter 3*, *Navigating through a website*.\n\n**Summary**\n\nIn this chapter,\
    \ we started with the foundations of automated testing. Mike Cohn's \n\npyramid\
    \ helped us to understand the different types of tests. We also gave this pyramid\
    \ \n\na new look, showing how it should be used from a Frontend developer perspective.\
    \ We \n\nalso made it clear that both developers and QA analysts are part of this\
    \ pyramid, but with \n\ndifferent perspectives.\n\nIn the second part of the chapter,\
    \ we got more practical, and we looked into test runners. \n\nA learning point\
    \ here is that we used Mocha as a test runner, but everything you learned \n\n\
    in this chapter should be possible with any test runner; that is, we used Mocha,\
    \ but we \n\ncould have used any other test runner.\n\nWe use many Puppeteer APIs\
    \ in our tests. In the next chapter, we are going to dive deep \n\ninto these\
    \ APIs and see how we can use Puppeteer in different scenarios."
