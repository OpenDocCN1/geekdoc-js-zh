  md: "Test runner features 33\n\nIf we want to test it, we could run some code like\
    \ this:\n\nconst Cart = require('./cart.js');\n\nconst c = new Cart();\n\nc.addToCart({\
    \ productId: 10, price: 5.5});\n\nc.addToCart({ productId: 15, price: 6.5});\n\
    \nif(c.total() !== 12)\n\n console.error('Nooo!!!');\n\nelse\n\n console.log('Yes!!!!!');\n\
    \n \n\nA test is basically a piece of code testing our code. Will this work? Yes.\
    \ Is this a unit test? \n\nYes. Will this scale? Definitely not. This file will\
    \ become massive and hard to maintain. \n\nKeeping track of what has failed would\
    \ be an impossible task. We need a tool to help us \n\nscale and to help us keep\
    \ our tests maintainable. We need a test runner.\n\nBefore exploring possible\
    \ test runners, I would like to review what we would expect from \n\na test runner.\
    \ What are the features we would need in a test runner?\n\n**Easy to learn and\
    \ run**\n\nWe have a lot of things to learn. We need to learn Node and React;\
    \ we even have to buy \n\na book about Puppeteer. We want a test runner that is\
    \ simple and easy to use.\n\n**Group tests by functionality**\n\nWe want to have\
    \ our tests separated by functionality, component, or workflow. Most test \n\n\
    runners have a describe function that helps us to group tests.\n\n**Ignore tests\
    \ if needed**\n\nWe want to skip a test if it becomes noisy, but we don't want\
    \ to remove it.\n\n**Run only one test**\n\nBeing able to run only one test is\
    \ extremely important while debugging. Imagine you \n\nhave over 1,000 tests (yes,\
    \ you are going to have over 1,000 tests). If you want to fix only \n\none test,\
    \ you wouldn't want to run all of them. You would like to run only the one you\
    \ are \n\nworking on."
  merge: -1
  pgno: 48
- img_proc: true
  md: "34 Automated Testing and Test runners\n\n**Assertions**\n\nAssertions are essential.\
    \ An assertion is an expression to check whether the program we \n\nare testing\
    \ worked as expected. Do you remember my console.log and console.\n\nerror to\
    \ check whether the cart worked as expected? Well, Assertions are way better \n\
    \nthan that. What do we want to check with Assertions? This is a possible list:\n\
    \n• Whether a value is equal to a test value.\n\n• Whether a value is null or\
    \ not null.\n\n• Whether a string or a list contains a value. We might have a\
    \ huge block of text, and \n\nwe only want to check whether it has some string\
    \ in it, or an item in an array.\n\n• Whether we expected something to fail, because\
    \ sometimes, we would expect some \n\npiece of code to fail.\n\n**Tools to set\
    \ up and clean up the environment **\n\nBefore starting the tests, we need our\
    \ application to be in a certain state. For instance, in \n\nthe cart test, we\
    \ would like to make sure that the customer has not already purchased the \n\n\
    product before starting the test.\n\nThere are also technical setups that might\
    \ need to be performed. In our case, we would \n\nneed to have Puppeteer and a\
    \ browser ready to be used before each test.\n\nAnother important concept is that\
    \ tests should be independent and detached from each \n\nother. This means that\
    \ the result of one test must not affect other tests. This is why, very \n\noften,\
    \ it is required to clean up after each or all tests.\n\n**Reports**\n\nWe want\
    \ to see which tests passed and which tests failed. We would expect a test runner\
    \ \n\nto at least show a good report in the terminal. It could be even better\
    \ if we can get results \n\nin other formats, such as JSON, XML, or HTML.\n\n\
    There are many other features we could mention, but these are the most important\
    \ \n\nfeatures we need to know about before getting started. \n\nLet's now see\
    \ what the test runners available on the market that can cover the features we\
    \ \n\nare requesting."
  merge: -1
  pgno: 49
- img_proc: true
  md: "Available test runners 35\n\n**Available test runners**\n\nThere are many types\
    \ of tennis racquets. Some racquets give you more control. Others \n\ngive you\
    \ more power. If you have just started learning how to play tennis, you won't\
    \ \n\nfeel any difference. You would if you compared a cheap racquet with a professional\
    \ one. \n\nBut you wouldn't be able to say why one is better than the other. You\
    \ would say that it just \n\n*feels better*.\n\nIt's the same with test runners.\
    \ There are test runners that offer some features. Other \n\nrunners offer other\
    \ features. But what's important for us now is to get a test runner that \n\n\
    provides us with all the required features to write our automated tests.\n\nAnother\
    \ important thing to mention is that this book is not about \"using Puppeteer\
    \ with \n\nX.\" We are going to pick a test runner after this chapter, but it\
    \ doesn't need to be the test \n\nrunner for you. The idea is that you can choose\
    \ what's best for you, or what your team is \n\nusing right now. It is also probable\
    \ that by the time you read this book, a better test runner \n\nwill have become\
    \ popular. You should be able to apply the concepts you learned from this \n\n\
    book to that test runner.\n\nThese are the most common test runners in the market\
    \ today.\n\n**Jest**\n\nAccording to the Jest site (https://jestjs.io/), \"*Jest\
    \ is a delightful JavaScript Testing *\n\n*Framework with a focus on simplicity*.\"\
    \ Pretty nice introduction. Facebook maintains this \n\nproject, and it currently\
    \ has over 32,000 stars on GitHub. I'm not saying this is what makes \n\na project\
    \ a good project, but knowing who is behind a project and its level of community\
    \ \n\nsupport are some of the things to take into consideration.\n\nJest has all\
    \ the features we mentioned before, such as group tests with describe, and \n\n\
    each test is an it or test function. You can skip tests with describe.skip, it.skip,\
    \ \n\nor test.skip. You can run only one test with describe.only, it.only, or\
    \ test.\n\nonly. You also have beforeEach, afterEach, beforeAll, and afterAll,\
    \ to run \n\nsetup and cleanup code.\n\nIt also has some features that differentiate\
    \ it from other runners. It has a **Snapshot** tool. \n\nThe snapshot tool would\
    \ process a React component and return some kind of DOM \n\nrepresentation as\
    \ JSON, which will allow us to test whether the DOM created by the \n\ncomponent\
    \ has changed. Is this a kind of UI test? Sure it is!\n\nAnother thing to consider\
    \ when evaluating a test runner is available plugins. For instance, \n\nthere\
    \ is a package called **jest-puppeteer**, which helps us integrate our tests with\
    \ Puppeteer. \n\nYou don't need to use **jest-puppeteer**. It's just a helper."
  merge: -1
  pgno: 50
- img_proc: true
  md: "36 Automated Testing and Test runners\n\nThere is also a package called **jest-image-snapshot**,\
    \ maintained by American Express, \n\nwhich provides a set of tools to perform\
    \ visual regression tests. In this case, if you want to \n\ncode visual regression\
    \ tests, I recommend you to use one of these packages. Managing all \n\nthe screenshot\
    \ baselines can be quite tedious.\n\n**Mocha**\n\nMocha is another popular framework.\
    \ It is a community project with over 19,000 stars. \n\nSomething worth mentioning\
    \ is that the Puppeteer team uses Mocha.\n\nMocha also has functions like Jest.\
    \ It has a describe function to group tests. Tests \n\nare it functions. You can\
    \ skip functions using describe.skip or it.skip, and \n\nuse describe.only or\
    \ it.only to run only one test. You also have beforeEach, \n\nafterEach, beforeAll,\
    \ and afterAll, to run setup and cleanup code.\n\nYou will also find many plugins\
    \ for Mocha. You will find **mocha-puppeteer** and **mocha-**\n\n**snapshots**.\n\
    \nA recipe you are going to see a lot on the web is Mocha + Chai. **Chai** is\
    \ an assertion library \n\nthat extends the assertions a test runner provides.\
    \ It lets you express assertions in a pretty \n\nspecific way:\n\nfoo.should.be.a('string');\n\
    \nfoo.should.equal('bar');\n\nfoo.should.have.lengthOf(3);\n\ntea.should.have.property('flavors').with.lengthOf(3);\n\
    \nThere are many other test runners, such as Jasmine by Pivotal Labs with over\
    \ 15,000 stars, \n\nKarma by the AngularJS team with over 11,000 stars, AVA, a\
    \ community project with over \n\n18,000 stars, and the list goes on.\n\nAs I\
    \ mentioned at the beginning of this section, we just need a good tennis racquet,\
    \ that \n\nis, a good test runner. When you become an expert, you will be able\
    \ to move from one test \n\nrunner to another that fits your needs. For the purpose\
    \ of this book, we are going to use \n\n**Mocha + Chai**."
  merge: -1
  pgno: 51
