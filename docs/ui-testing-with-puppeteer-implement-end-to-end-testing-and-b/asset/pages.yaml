  md: "**Preface**\n\nPuppeteer is a multi-purpose browser automation tool created\
    \ by Google. You will see \n\nPuppeteer being used in many different ways. It's\
    \ used for web scraping, task automation, \n\ncontent generation, web monitoring,\
    \ and UI testing.\n\nThis book focuses on UI testing, but we won't stop there.\
    \ For instance, we have a chapter \n\nfocused on content generation and another\
    \ chapter that focuses on web scraping. If you \n\nread this book from cover to\
    \ cover, you will be able to use Puppeteer in all fields.\n\nWhen I found that\
    \ there was no book about Puppeteer available on the market, that really \n\n\
    motivated me: I wanted this book to cover the entire Puppeteer API. By the end\
    \ of this \n\nbook, you'll have learned about the whole Puppeteer API.\n\n**Who\
    \ this book is for**\n\nIf you are a quality assurance professional looking for\
    \ a better and more modern tool \n\nto do your job, this is the book for you.\n\
    \nThese days, UI testing is not only for the QA team. There is a new wave of frontend\
    \ \n\ndevelopers looking for tools to test their UI components. If you are a web\
    \ developer using \n\nJavaScript and Node.js in your daily job and you want to\
    \ test your UI components, this \n\nbook is also for you.\n\nWeb developers will\
    \ also learn from this book how to use browser automation tools to \n\nautomate\
    \ tasks such as taking screenshots, generating PDF files, or doing web scraping.\n\
    \n**What this book covers**\n\n*Chapter 1*, *Getting started with Puppeteer*,\
    \ lays the foundation for the book. It will help you \n\nget started with Puppeteer\
    \ by introducing you to the tool and getting you acquainted with \n\nthe essentials.\
    \ You will also learn how to write async code in JavaScript.\n\n*Chapter 2*, *Automated\
    \ Testing and Test runners*, covers end-to-end testing fundamentals \n\nand the\
    \ difference between different types of tests. In the latter part of the chapter,\
    \ we will \n\ncover creating and organizing a test project and getting started\
    \ with test runners."
  merge: -1
  pgno: 10
- img_proc: true
  md: "vi Preface\n\n*Chapter 3*, *Navigating through a website*, sees you start coding\
    \ your tests. You will learn \n\nhow to launch a browser, navigate to a page,\
    \ and make some assertions. Then, you will \n\nsee how to publish your tests to\
    \ the cloud to be tested.\n\n*Chapter 4*, *Interacting with a page,* is all about\
    \ interaction. Once you get to a page, how \n\ndo you test it? How do you simulate\
    \ user interaction? This chapter takes you through the \n\nmost common ways of\
    \ interacting with a page. This chapter also covers some basic HTML \n\nconcepts,\
    \ so you can take advantage of all the tools Puppeteer provides.\n\n*Chapter 5*,\
    \ *Waiting for elements and network calls,* teaches you how to wait for the different\
    \ \n\nscenarios on the page you are testing—waiting for the page to load and be\
    \ ready, waiting \n\nfor a button to be enabled, waiting for an Ajax call to be\
    \ completed, and so on. This \n\nchapter covers all the tools that Puppeteer offers\
    \ to handle these scenarios.\n\n*Chapter 6*, *Executing and Injecting JavaScript,*\
    \ shows you one of the best features of \n\nPuppeteer: injecting JavaScript code\
    \ easily. In this chapter, we will leave the end-to-end \n\ntesting world for\
    \ a moment and dive into web automation using a general-purpose tool.\n\n*Chapter\
    \ 7*, *Generating Content with Puppeteer,* expands on the usage of Puppeteer and\
    \ \n\nshows you how we can create content using Puppeteer. We'll start by learning\
    \ how \n\nscreenshots are created and how they can be used for regression tests.\
    \ Then, we will \n\ncover PDF generation, and finally, we will learn how to create\
    \ pages on the fly.\n\n*Chapter 8*, *Environments emulation,* explains all the\
    \ tools Puppeteer provides to emulate \n\ndifferent scenarios. It will show you\
    \ how to emulate mobile devices, different screen \n\nresolutions, various network\
    \ speeds, geolocation, and even things such as vision deficiency.\n\n*Chapter\
    \ 9*, *Scraping tools,* demystifies web scraping, showing you how it can be used\
    \ to \n\nyour advantage. You will learn how to create scrapers and run tasks in\
    \ parallel using \n\nPuppeteer Cluster.\n\n*Chapter 10*,* Evaluating and Improving\
    \ the Performance of a Website,* shows you how \n\nPuppeteer can help developers\
    \ to evaluate and improve the performance of their sites. \n\nWe will learn how\
    \ to extract and analyze all the performance metrics you can see on the \n\nDeveloper\
    \ Tools. This chapter also has a great introduction to Google Lighthouse and \n\
    \nhow to automate its reports and integrate them into your tests.\n\nI also want\
    \ this book to fill your toolbox with more tools besides Puppeteer. During the\
    \ \n\ncourse of this book, you will learn about other tools, such as GitHub Actions,\
    \ Visual \n\nStudio Code, Checkly and its Puppeteer recorder, and many others."
  merge: -1
  pgno: 11
- img_proc: true
  md: "Preface vii\n\n**To get the most out of this book**\n\nThis book assumes that\
    \ you have some knowledge of JavaScript, but you don't need \n\nto be an expert.\
    \ All the examples will run on Node.js. If you have experience with this \n\n\
    framework, you will find it easier to get started. If you don't, don't worry;\
    \ we won't go \n\ndeep into Node.js*.*\n\nAll the tools we will use are cross-platform.\
    \ You will be able to follow the code of this book \n\nusing any popular operating\
    \ system, such as Windows, macOS, or Linux. In *Chapter 1*, \n\n*Getting started\
    \ with Puppeteer*, we will see how to install Node.js and Visual Studio Code.\
    \ \n\nIf you already have these tools installed, notice that Puppeteer relies\
    \ on Node 10.18.1+.\n\n**If you are using the digital version of this book, we\
    \ advise you to type the code yourself **\n\n**or access the code via the GitHub\
    \ repository (link available in the next section). Doing **\n\n**so will help\
    \ you avoid any potential errors related to the copying and pasting of code.**\n\
    \n**Download the example code files**\n\nYou can download the example code files\
    \ for this book from GitHub at https://\n\ngithub.com/PacktPublishing/UI-Testing-with-Puppeteer.\
    \ In case \n\nthere's an update to the code, it will be updated on the existing\
    \ GitHub repository.\n\nWe also have other code bundles from our rich catalog\
    \ of books and videos available \n\nat https://github.com/PacktPublishing/. Check\
    \ them out!\n\n**Disclaimer**\n\nMany of the examples of this book will be based\
    \ on real websites that most of us use every \n\nday. We are going to test websites\
    \ like GitHub.com, StackOverlow.com, The Weather \n\nChannel, and PacktPub. That\
    \ means that you will learn how to automate real websites \n\nusing the latest\
    \ technologies. However, this also means that some of the code examples \n\nmight\
    \ eventually fail. This could be due to network conditions, problems with the\
    \ server, \n\nor a website redesign. However, our main aim is that you can learn\
    \ the concepts and apply \n\nthem to your own solutions besides these changes."
  merge: -1
  pgno: 12
