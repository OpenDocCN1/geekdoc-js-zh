  md: "Creating our first test project 41\n\n page = await browser.newPage();\n\n\
    \ await page.goto('https://www.packtpub.com/');\n\n});\n\nafterEach(async () =>\
    \ {\n\n await page.close();\n\n});\n\nafter(async () => {\n\n await browser.close();\n\
    \n});\n\nOne thing to mention here is that we could do what's called **Fire and\
    \ Forget** when closing \n\nthe page or the browser. Fire and forget means that\
    \ we don't want to await the result of \n\npage.close() or browser.close(). So,\
    \ we could do this:\n\nafterEach(() => page.close());\n\nafter(() => browser.close());\n\
    \nThat's not something I love doing because if something fails, you would like\
    \ to know \n\nwhere and why. But as this is just cleanup code for a test, it's\
    \ not production code, we can \n\nafford that risk.\n\nNow our test has a browser\
    \ opened, a page with the URL we want to test read. We just \n\nneed to test the\
    \ title:\n\nit('Title should have Packt name', async() => {\n\n const title =\
    \ await page.title();\n\n title.should.contain('Packt');\n\n});\n\nit('Title should\
    \ should mention Books', async() => {\n\n expect((await page.title())).to.contain('Books');\n\
    \n});\n\nI used two different styles here."
