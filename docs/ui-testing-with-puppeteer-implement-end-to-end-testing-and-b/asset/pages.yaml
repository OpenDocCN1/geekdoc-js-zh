  md: "Organizing our code 49\n\n let browser;\n\n let page;\n\n let homePageModel;\n\
    \n before(async () => browser = await puppeteer.launch());\n\n beforeEach(async\
    \ () => {\n\n page = await browser.newPage();\n\n homePageModel = new HomePageModel(page,\
    \ config);\n\n await homePageModel.go();\n\n });\n\n afterEach(() => page.close());\n\
