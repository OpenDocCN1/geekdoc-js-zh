  md: "Creating our first test project 39\n\n });\n\n});\n\nLet's unpack this code:\n\
    \n1\\. We are importing Puppeteer in line 1.\n\n2\\. Lines 2 are 3 are about importing\
    \ the different types of assertion styles **Chai** \n\nprovides. As you can see,\
    \ expect is not being called with parentheses whereas \n\nshould is. We don't\
    \ need to know why now. But, just to be clear, that's not \n\na mistake.\n\n3\\\
    . How about Mocha? Are we missing Mocha? Well, Mocha is the test runner. It will\
    \ \n\nbe the executable we will call later in package.json. We don't need it in\
    \ our \n\ncode.\n\n4\\. It's interesting to see that both describe and it are\
    \ just simple functions that take \n\ntwo arguments: a string and a function.\
    \ Can you pass a function as an argument? \n\nYes, you can!\n\n5\\. The functions\
    \ we are passing to the it functions are async. We can't use the \n\nawait keyword\
    \ in functions that are not marked as async. Remember that \n\nPuppeteer relies\
    \ a lot on async programming.\n\nNow we need to launch a browser and set up everything\
    \ these tests need to work. We \n\ncould do something like this:\n\nit('Title\
    \ should have Packt name', async() => {\n\n const browser = await puppeteer.launch();\n\
    \n const page = await browser.newPage();\n\n await page.goto('https://www.packtpub.com/');\n\
    \n // Our test code\n\n await browser.close();\n\n});\n\n**Tip**\n\nDon't try\
    \ to learn the Puppeteer API now. We are going to explain how all of \n\nthese\
    \ commands work in *Chapter 3*, *Navigating through a website*."
