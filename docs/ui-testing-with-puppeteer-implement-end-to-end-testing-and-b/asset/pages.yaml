  md: "42 Automated Testing and Test runners\n\nIn the first case, I'm assigning the\
    \ result of the title async function to a variable, and \n\nthen using should.contain\
    \ to check whether the title contains the word *\"Packt\"*. \n\nIn the second\
    \ case, I just evaluated ((await page.title()). I added some extra \n\nparentheses\
    \ there for clarification. You won't see them in the final example.\n\nThe second\
    \ difference is that in the first case, I'm using the **should** style, whereas\
    \ in the \n\nsecond case, I'm using the **expect** style. The result will be the\
    \ same. It's just about which \n\nstyle you feel more comfortable with or feels\
    \ more natural to you. There is even a third \n\nstyle: **assert**.\n\nWe have\
    \ everything we need to run our tests. Remember how npm init created a \n\npackage.json\
    \ file for us? It's time to use it. Let's set the test command. You should \n\n\
    have something like this:\n\n\"scripts\": {\n\n \"test\": \"echo \\\\\"Error:\
    \ no test specified\\\\\" && exit 1\"\n\n},\n\nWe need to tell npm to run **Mocha**\
    \ when we execute npm test:\n\n\"scripts\": {\n\n \"test\": \"mocha\"\n\n},\n\n\
    Time to run our tests! Let's run npm test in the terminal:\n\n**npm test**\n\n\
    And we should have our first error:\n\n** 1) Home page header**\n\n** \"before\
    \ each\" hook for \"Title should have Packt name\":**\n\n** Error: Timeout of\
    \ 2000ms exceeded. For async tests and **\n\n**hooks, ensure \"done()\" is called;\
    \ if returning a Promise, **\n\n**ensure it resolves.**"
