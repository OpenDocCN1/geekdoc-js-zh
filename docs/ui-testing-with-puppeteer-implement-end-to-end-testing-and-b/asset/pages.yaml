  md: "60 Navigating through a website\n\n**Default Viewport**\n\nIf you tried the\
    \ headful mode, you might have seen something like this:\n\nHeadful mode with\
    \ no default viewport\n\nNo, the site is not broken. If we don't pass a defaultViewport,\
    \ Puppeteer will \n\ndefault to a viewport of 800x600. If you were wondering what\
    \ a viewport is, according \n\nto Wikipedia, *a viewport is the visible portion\
    \ of the entire document*. \n\nThe viewport is an important piece of UI testing.\
    \ UX experts and designers make a \n\nsignificant effort trying to give the user\
    \ the best experience for the device they are using. \n\nFrontend developers use\
    \ CSS breakpoints to determine which layout to show based on the \n\nviewport\
    \ size. Rico Sta. Cruz, on his blog post *What media query breakpoints should\
    \ I use?* \n\n(https://ricostacruz.com/til/css-media-query-breakpoints), posted\
    \ \n\nthis excellent list of breakpoints:\n\n• Mobile devices in portrait: From\
    \ 320px to 414px.\n\n• Mobile devices in landscape: From 568px to 812px.\n\n•\
    \ Table in portrait: From 768px to 834px.\n\n• Table in landscape: From 1024px\
    \ to 1112px.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_75_0.png)"
  merge: -1
  pgno: 75
- img_proc: true
  md: "Creating a Puppeteer browser 61\n\n• Laptops: From 1366px to 1440px.\n\n• Desktop\
    \ displays: 1680px to 1920px.\n\nYou don't need to have many devices to test this.\
    \ Just open a browser and change the size \n\nof the window.\n\nDifferent breakpoints\
    \ Packtpub.com uses\n\nIf you look at that screenshot, you will see that the site\
    \ shows or hides different elements \n\nbased on the viewport. It would show a\
    \ big search bar in a big viewport, assuming \n\na desktop experience. When it\
    \ detects a small viewport, assuming a mobile device, it will \n\nhide the search\
    \ bar and show a hamburger button.\n\nWe need to consider all these changes when\
    \ writing our tests.\n\n**Tip**\n\nInstead of trying to guess viewports, ask your\
    \ frontend team what breakpoints \n\nthey are using. But keep in mind that many\
    \ bugs emerge on those precise \n\nbreakpoints, test the breakpoints, and check\
    \ whether they are appropriate.\n\nWe will go deeper into this topic in *Chapter\
    \ 8*, *Environments emulation*, when we talk \n\nabout mobile emulation. One last\
    \ trick here. If we pass null, the viewport will adapt to \n\nthe window size,\
    \ as you would expect in a normal browser.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_76_0.png)"
