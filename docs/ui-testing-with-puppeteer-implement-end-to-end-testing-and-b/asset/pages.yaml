  md: "Navigating through a site 65\n\nIt's impressive, all the functionality that\
    \ can be hidden inside a single line. Now let's see \n\nhow we can improve our\
    \ navigation skills.\n\n**Navigating through a site**\n\nIf you look at how you\
    \ navigate through different pages on a browser, there are basically \n\nfour\
    \ ways:\n\n• You type a URL in the address bar or using a bookmark.\n\n• You use\
    \ the browser functions to go back, forward, or reload a page.\n\n• You click\
    \ on elements on a page.\n\n• The site you are browsing redirects to another page.\n\
    \nThe goto function emulates the first option, navigating to a site. We use that\
    \ to navigate \n\nto the page we want to test:\n\nawait this.page.goto(this.config.baseURL\
    \ + 'login');\n\nNow, guess what? The goto signature isn't goto(url) but goto(url,\
    \ options). \n\nYou will see this pattern being repeated over and over – a function\
    \ with one or more \n\nrequired arguments (or none), and then a set of extra options.\n\
    \nLuckily for us, the options goto expects is not as big as the one we saw in\
    \ the launch \n\noptions. It only has three options:\n\n•  timeout: Maximum navigation\
    \ time in milliseconds.\n\n•  waitUntil: When to consider navigation succeeded.\n\
    \n•  referrer: Referrer header value.\n\nLet's unpack these options.\n\n**Timeouts**\n\
    \nYou will see the timeout argument in many functions. Puppeteer groups timeouts\
    \ \n\nin two groups: **navigation timeouts** and **generic timeouts** (this is\
    \ not the official name; \n\nI named them in this way just to make these concepts\
    \ easier to understand)."
  merge: -1
  pgno: 80
- img_proc: true
  md: "66 Navigating through a website\n\nIf we wanted to set a default timeout in\
    \ all our navigation calls, we could create a property \n\nin our config file\
    \ and use it in every place. That sounds like a great idea, but there is an \n\
    \neven better solution. We can use a property in our config file, but instead\
    \ of passing that to \n\nevery function we use, we can call page.setDefaultTimeout(timeout)\
    \ or page.\n\nsetDefaultNavigationTimeout(timeout). \n\nThe page object will store\
    \ the timeout you pass to these functions and use them as \n\na default value.\n\
    \n**Important note**\n\nIf you don't pass a timeout to a function, nor set a default\
    \ timeout, Puppeteer \n\nwill set the timeout to 30 seconds (30,000 milliseconds).\n\
    \nIf we are testing a site locally, waiting 30 seconds for a page to load sounds\
    \ like a lot. Let's \n\nreduce that time to 5 seconds. We can add a new property\
    \ in our config file:\n\nlocal: {\n\n baseURL: 'http://localhost:8080/',\n\n timeout:\
    \ 5000,\n\n},\n\nAnd then, we can set that value using the default timeout:\n\n\
    page.setDefaultTimeout(config.timeout);\n\n**Tip**\n\nYou don't need to await\
    \ setDefaultTimeout or \n\nsetDefaultNavigationTimeout because they are not async.\n\
    \nThe next option is the most interesting option in goto.\n\n**waitUntil**\n\n\
    You might be thinking, \"Wait until what?\". Imagine if, when you do something\
    \ like \n\nawait page.goto('https://www.packtpub.com/'), Puppeteer resolves the\
    \ \n\npromise as soon as the command is sent to the browser. The next command\
    \ you run \n\nwill get an empty page because it takes some time to be ready to\
    \ be used. I bet you \n\nexperience watching a white screen while waiting for\
    \ a page to load. You have to **wait **\n\n**until** the page is ready."
  merge: -1
  pgno: 81
- img_proc: true
  md: "Navigating through a site 67\n\nEmpty page\n\nWaiting for the page to be ready\
    \ is key in browser automation. Many of the questions \n\nI see on Stack Overflow\
    \ are related to this question: How do you know the page is ready? \n\nI hope\
    \ when you finish this book, you can master this topic. In *Chapter 5*, *Waiting\
    \ for *\n\n*elements and network calls*, we will walk through many techniques\
    \ to answer this question, \n\nbut page.goto gives us this first tool: the waitUntil\
    \ option.\n\nwaitUntil supports four options: \n\nThe first option, and the default\
    \ option, is load. If you pass load (or no option), the \n\npromise will be resolved\
    \ then the load event is fired. According to Mozilla, the load \n\nevent is fired\
    \ *when the whole page has loaded, including all dependent resources such as *\n\
    \n*stylesheets and images*.\n\nThe second option is domcontentloaded, which relies\
    \ on the DOMContentLoaded \n\nevent. According to Mozilla, the DOMContentLoaded\
    \ is fired *when the initial HTML *\n\n*document has been completely loaded and\
    \ parsed, without waiting for stylesheets, images, *\n\n*and subframes to finish\
    \ loading.*\n\nThe last two options are network-related. networkidle0 will resolve\
    \ the promise \n\n*when there are no more network connections for the past 500ms*.\
    \ On the other hand, \n\nnetworkidle2 will resolve the promise *when there are\
    \ no more than 2 network *\n\n*connections for the past 500ms*.\n\nWhich one is\
    \ better? Generally speaking, the default is good enough and pretty safe. You\
    \ \n\nmight need to switch to the network ones if you have many **AJAX** calls\
    \ after the **DOM** is \n\nloaded, and you want to wait for the page to stop loading\
    \ data from the server. We will see \n\nmore about this in *Chapter 5*, *Waiting\
    \ for elements and network calls*.\n\n**What is an AJAX call?**\n\nAJAX calls\
    \ became so popular that many developers stopped calling them AJAX calls. You\
    \ \n\nmight also hear this referred to as \"calling an endpoint\" or \"calling\
    \ a (REST) API.\"\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_82_0.png)"
  merge: -1
  pgno: 82
- img_proc: true
  md: "68 Navigating through a website\n\nBut, basically, it is an asynchronous call\
    \ made to a server by the page to fetch more data \n\nor send data to the server.\
    \ Don't worry, we'll go way deeper in *Chapter 5*, *Waiting for *\n\n*elements\
    \ and network calls*.\n\n**What is the DOM?**\n\nThe **Document Object Model**\
    \ (**DOM**) is the object representation that the browser built \n\nbased on the\
    \ HTML sent by the server or created in JavaScript. \n\nRemember that an HTML\
    \ page is no more than a text file sent through the network. The \n\nbrowser loads\
    \ that text, builds the model (DOM) representation, and then the browser \n\n\
    engine renders that DOM. At that moment, the browser can say that **the DOM content\
    \ **\n\n**was loaded**. Once the engine starts processing that DOM, it might find\
    \ that it needs to \n\nfetch more resources, such as JavaScript, CSS, or image\
    \ files. So, after all these resources \n\nare loaded, it fires the load event.\n\
    \nThis takes us to the last option: the referrer.\n\n**Referrer**\n\nThe referrer\
    \ is an HTTP header that the browser sends to the server to inform it what \n\n\
    page is requesting that resource.\n\nYou can see that if you go to https://www.packtpub.com/,\
    \ open the developer \n\ntools, and check any CSS file under the network tab.\n\
    \nReferrer\n\nFun fact, the HTTP header is called referer due to a typo in the\
    \ HTTP specification.\n\nWhen would you use this? Well, this option is not so\
    \ common, but some pages could \n\nchange the behavior based on the referrer.\
    \ Some sites might use them as a validation: *\"This *\n\n*page only can be navigated\
    \ when coming from this site.\"* You force that scenario using the \n\nreferer\
    \ option. \n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_83_0.png)"
  merge: -1
  pgno: 83
- img_proc: true
  md: "Using the response object 69\n\nEarly in this section, we mentioned that other\
    \ types of navigation were the browser \n\nfunctions to go back, forward, and\
    \ reload. Puppeteer provides an API for all those actions:\n\n•  page.goBack(options)\n\
    \n•  page.goForward(options)\n\n•  page.reload(options)\n\nThese functions have\
    \ the same behavior as page.goto. You don't need to pass a URL \n\nbecause it\
    \ can be inferred from the action itself. goBack and goForward are based on \n\
    \nthe browsing history, and reload will use the same URL.\n\nAnother difference\
    \ is that they don't support the referer option because it will use the \n\nsame\
    \ referrer used in the first navigation because these actions are repeating navigation\
    \ \n\nperformed in the past.\n\nBut that's not all; goto hides a nice surprise.\
    \ Well, it's not hidden; it is documented. \n\nThe next thing we need to know\
    \ about goto is that it has a return value. It returns a \n\nresponse object.\n\
    \n**Using the response object**\n\nThe response is an important concept on the\
    \ web. There is a corresponding **response** for \n\nevery **request** the browser\
    \ sends to the server.\n\nIt makes sense that the goto returns a response. It\
    \ makes a request, and the result is \n\nthe corresponding response.\n\nThere\
    \ are many things we can do with the response. We won't cover all the functionality\
    \ \n\nin this chapter. But these are the most relevant functions we can use as\
    \ a response to \n\na goto action.\n\n**Getting the response URL**\n\nWhy would\
    \ I want to know the URL if I know the URL I want to go to?\n\nThe server could\
    \ redirect you to another page. For instance, if you open the browser in \n\n\
    incognito/private mode and navigate to https://mail.google.com/, you will see\
    \ \n\nthat the server redirects you to https://accounts.google.com/signin."
  merge: -1
  pgno: 84
- img_proc: true
  md: "70 Navigating through a website\n\nI'm not saying that you should always check\
    \ the response URL just in case, but you have \n\nto know that the site you are\
    \ testing might behave like that. One common scenario is \n\nthe login check.\
    \ You navigate to a page, and if the response URL is the login page, you \n\n\
    perform the login action, and then you can go back to the previous page and resume\
    \ \n\nyour test.\n\n**Getting the response status code**\n\nEvery response has\
    \ an HTTP status code. It tells you how the server reacted to your \n\nrequest.\
    \ Status codes are grouped into five categories. These are the definitions according\
    \ \n\nto Wikipedia (https://en.wikipedia.org/wiki/List\\_of\\_HTTP\\_status\\\
    _\n\ncodes):\n\n**1xx informational response**: * the request was received, continuing\
    \ process*. You won't need \n\nto deal with these.\n\n**2xx successful**: *the\
    \ request was successfully received, understood, and accepted.* There are \n\n\
    some differences between all the 2xx codes, but what you have to know is that\
    \ a 2xx code \n\nmeans that everything went well. The status code **200** is the\
    \ most common. \n\n**3xx redirection**: *further action needs to be taken in order\
    \ to complete the request.*\n\nWhen the server wants to redirect the user, that's\
    \ not a server action but something that \n\nthe browser needs to do. The server\
    \ tells the browser: \"You asked for https://mail.\n\ngoogle.com/, but you have\
    \ to go to https://accounts.google.com/signin.\" \n\nThe browser needs to take\
    \ the new URL and perform another request.\n\nThe most common status codes are\
    \ **301 – Permanent Redirect** and **302 –Temporary **\n\n**Redirect**. **301**\
    \ tells the browser that the old URL shouldn't be used anymore, and the \n\nbrowser\
    \ should always use the new URL. **302** is the most commonly used. It tells the\
    \ \n\nbrowser that it should temporarily go to the new URL. That's the case of\
    \ the login \n\nscenario.\n\n**4xx client error**: *the request contains bad syntax\
    \ or cannot be fulfilled.*\n\n4xx codes are known as *\"it was your fault\"* errors.\
    \ There was something wrong with the \n\nrequest. The list of 4xx codes is huge.\
    \ For these scenarios, the most common code that I \n\nthink everybody knows is\
    \ the world-famous **404**, which tells you that the resource was** not **\n\n\
    **found**. The other errors you might face are **401 – Unauthorized** and **403\
    \ – Forbidden**, \n\nwhich are related to security issues."
  merge: -1
  pgno: 85
- img_proc: true
  md: "Using the response object 71\n\n**5xx server error**: *the server failed to\
    \ fulfill an apparently valid request.*\n\n5xx codes are known as *\"it was the\
    \ server's fault\"* errors. The most common is the **500**, \n\nwhich means that\
    \ the server has failed. I hope you never see this, but if you try to scrape \n\
    \na site and you get a **503**, that means that the **server is unavailable**,\
    \ which means that the \n\nserver started to reject your requests or that you\
    \ took the server down.\n\nThe function response.status() will return the status\
    \ code associated with the \n\nresponse.\n\nIf you just want to know whether the\
    \ response was successful, there is a shortcut for \n\nthat: response.ok(). This\
    \ function will return true if the status code is between 200 \n\nand 299.\n\n\
    Let's test some of these features by implementing the following test: *\"The admin\
    \ page *\n\n*should redirect you to the login page\"*. In the test directory you\
    \ will find that we have an \n\nadmin.tests.js file, where we can put our admin\
    \ page tests. To test the redirection, \n\nwe can do something like this:\n\n\
    it('Should redirect to the login page', async() => {\n\n const response = await\
    \ pageModel.go();\n\n response.status().should.oneOf(\\[200, 304\\]);\n\n response.url().should.contain('login');\n\
    \n});\n\nThe final status could be **200 (OK)** or **304 (Not Modified)** if the\
    \ browser cached the \n\nredirection. Notice that we also used response.url()\
    \ to get the URL of that response.\n\nWhat if I wanted to check that I was effectively\
    \ redirected from the admin page?"
  merge: -1
  pgno: 86
- img_proc: true
  md: "72 Navigating through a website\n\nWell, that's trickier. We mentioned that\
    \ every response is tied to a request. Puppeteer \n\nexposes that using the response.request()\
    \ function. We won't get into the \n\nrequest object yet, but one thing you need\
    \ to know now is that the request contains \n\nthe list of all the redirections\
    \ a request went through. Puppeteer represents them with the \n\nredirectChain()\
    \ function. With this, we have the entire redirect map.\n\nRedirect chain\n\n\
    It might sound complex, but you will get the idea once you start playing with\
    \ it. The final \n\ncode will look like this:\n\nit('Should redirect to the login\
    \ page', async() => {\n\n const response = await pageModel.go();\n\n response.status().should.equal(200);\n\
    \n response.url().should.contain('login');\n\n response.request().redirectChain()\\\
    [0\\].response().status().\n\nshould.equal(302);\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_87_0.png)"
  merge: -1
  pgno: 87
- img_proc: true
  md: "Introduction to continuous integration 73\n\n response.request().redirectChain()\\\
    [0\\].response().url().\n\nshould.contain('admin');\n\n});\n\nWe learned a lot\
    \ about the launch function and navigation with Puppeteer. As I \n\nmentioned\
    \ at the beginning of this chapter, I also want to share some tools to add to\
    \ your \n\ntoolbox. Let's talk about continuous integration.\n\n**Introduction\
    \ to continuous integration**\n\nWouldn't it be great if a tool would guarantee\
    \ that not a single line of code would break \n\nthe functionality you are testing?\n\
    \nThat's what **continuous integration** (**CI**) is about. CI is the practice\
    \ of running test code \n\nbefore introducing a change into the code base. Atlassian\
    \ wrote a great definition of \n\nCI (https://www.atlassian.com/continuous-delivery/continuous-\n\
    \nintegration): **Continuous integration** (**CI**)* is the practice of automating\
    \ the *\n\n*integration of code changes from multiple contributors into a single\
    \ software project. It's *\n\n*a primary DevOps best practice, allowing developers\
    \ to frequently merge code changes into *\n\n*a central repository where builds\
    \ and tests then run. Automated tools are used to assert the *\n\n*new code's\
    \ correctness before integration.*\n\nLet's review an ideal workflow:\n\n1\\.\
    \ We have our code base in a source control repository. It could be GitHub, Gitlab,\
    \ \n\nBitbucket, or a local server hosting a Git server.\n\n2\\. A developer creates\
    \ a new branch from that main code base.\n\n3\\. We make some changes in that\
    \ branch.\n\n4\\. And then, it creates a Pull Request or Merge Request. The developer\
    \ requests that \n\ntheir changes are reviewed and incorporated into the main\
    \ code base.\n\n5\\. Other developers will review the change, but the CI process\
    \ will also run the tests \n\non that branch.\n\n6\\. If the developers approve\
    \ the change and the CI runs successfully, the code will be \n\nready to be merged\
    \ into the main code base."
  merge: -1
  pgno: 88
- img_proc: true
  md: "74 Navigating through a website\n\nIt sounds like an ideal world, right? Although\
    \ life won't be that perfect all the time, we can \n\nachieve that. If you can\
    \ implement this workflow when you start a new project, it will be \n\neasy to\
    \ follow. Implementing all this in an ongoing project will be more challenging.\
    \ My \n\nadvice would be to make these changes little by little, not to affect\
    \ productivity too much.\n\nThere are many CIs available on the market. Most of\
    \ them have an entry-level free tier and \n\nthen some paid tiers. The main differences\
    \ you will see between them are the following:\n\n• Support for private repositories:\
    \ Some CIs offer free tiers only for public \n\nrepositories.\n\n• The number\
    \ of parallel runs: This will be quite important if you have quite a big \n\n\
    team with many Pull Requests opened simultaneously.\n\n• Compute power: They could\
    \ give you better virtual machines on higher tiers.\n\n• Reporting: You will find\
    \ different types of reports.\n\nThese are the most popular CIs in 2021; there\
    \ are many others, but these are the ones you \n\nwill see around:\n\n• Travis\
    \ CI\n\n• Circle CI\n\n• AppVeyor\n\n• Jenkins\n\n• GitHub Actions\n\nWe will\
    \ test our code using GitHub Actions, just because we would only need a GitHub\
    \ \n\naccount, and we can do everything from our repository.\n\nFirst, let's create\
    \ a new repository on GitHub. If you don't have a GitHub account, you can \n\n\
    create one at https://github.com/join. Once you have an account, you can create\
    \ \n\na repository at https://github.com/new."
  merge: -1
  pgno: 89
- img_proc: true
  md: "Introduction to continuous integration 75\n\nCreating a new repository\n\n\
    One important thing here is to pick **Node** as the .gitignore template, so we\
    \ don't \n\ncommit the node\\_modules folder.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_90_0.png)"
  merge: -1
  pgno: 90
- img_proc: true
  md: "76 Navigating through a website\n\nOnce you create the repository, you can\
    \ get the Git URL using the **Code** button:\n\nGit remote URL\n\nWe will now\
    \ clone this Git repository into a new folder, copy our working code there, and\
    \ \n\n**push** it to GitHub:\n\n**\\> git clone https://github.com/kblok/ch3-demo.git**\n\
    \n**\\> cd ch3-demo**\n\nNotice that you need to use **your** Git URL, not mine.\n\
    \nNext, we need to copy our current code to that folder. Make sure you delete\
    \ any extra git \n\nfolders when you copy these projects. After that, we need\
    \ to run these three commands to \n\ncommit our code and push it to GitHub:\n\n\
    **\\> git add .**\n\n**\\> git commit -m \"First commit\"**\n\n**\\> git push\
    \ origin**\n\nNow it's time to set up the CI. CI tasks in GitHub actions are YAML\
    \ files inside the . \n\ngithub/workflows directory. This is what we need to do:\n\
    \n• Checkout the branch.\n\n• Build the site.\n\n• Build the tests package.\n\n\
    ![](img/a12c4f728acd6f69fe58d97e7f64e4f5_91_0.png)"
  merge: -1
  pgno: 91
- img_proc: true
  md: "Introduction to continuous integration 77\n\n• Launch the site.\n\n• Run tests.\n\
    \nThe following example doesn't pretend to be the canonical way to run Puppeteer\
    \ tests in \n\nGitHub actions. There many different ways to implement this. Let's\
    \ create a YAML file \n\ninside the .github/workflows directory called test.yml\
    \ (you can pick any name). \n\nThe file will look like this:\n\nname: CI\n\non:\n\
    \n push:\n\n branches:\n\n - master\n\n pull\\_request:\n\n branches:\n\n - master\n\
    \njobs:\n\n test:\n\n name: Test\n\n runs-on: ubuntu-latest\n\n steps:\n\n - uses:\
    \ actions/checkout@master\n\n - name: Install Web Dependencies\n\n working-directory:\
    \ ./vuejs-firebase-shopping-cart\n\n run: npm install\n\n - name: Install Test\
    \ Dependencies\n\n env:\n\n PUPPETEER\\_SKIP\\_CHROMIUM\\_DOWNLOAD: 'true'\n\n\
    \ run: npm install\n\n - name: Run Site Test Code\n\n uses: mujo-code/puppeteer-headful@master\n\
    \n env:\n\n TESTENV: 'CI'\n\n CI: 'true'\n\n with:\n\n args: sh ./.github/workflows/test.sh"
  merge: -1
  pgno: 92
- img_proc: true
  md: "78 Navigating through a website\n\n• First, we are saying when we want to run\
    \ this action. Then, we are setting up this \n\naction to run on every **Pull\
    \ Request** created to be merged into the master branch. \n\nBut also, it will\
    \ run on every **push** to the master branch. This means that it will \n\nalso\
    \ run after the Pull Request is merged.\n\n•  - uses: actions/checkout@master\
    \ will check out our code.\n\n• Under \\- name: Install Web Dependencies, we build\
    \ the site.\n\n• Under \\- name: Install Test Dependencies, we build the test\
    \ project.\n\n• Under \\- name: Run Site Test Code, we run the site and the tests\
    \ using the \n\nshell file test.sh, which is as simple as this:\n\ncd ./vuejs-firebase-shopping-cart\n\
    \nnpm run serve & npx wait-on http://localhost:8080\n\ncd ..\n\nnpm test\n\nAs\
    \ you can see, I'm waiting for npm run serve to print an http://\n\nlocalhost:8080\
    \ before running the tests.\n\nYou will find that we are using uses: mujo-code/puppeteer-headful@master.\
    \ \n\nRunning a browser in a VM can be challenging. These VMs have many restrictions.\
    \ You \n\nwill need to find recipes that can help you launch a browser in a VM.\n\
    \nIn this case, mujo-code/puppeteer-headful leaves us a browser ready to be \n\
    \nused. That's why we use the environment variable PUPPETEER\\_SKIP\\_CHROMIUM\\\
    _\n\nDOWNLOAD: 'true', so when we run npm install, Puppeteer won't download \n\
    \na browser because we are going to use an existing one.\n\nAs we're going to\
    \ use an existing browser, and we are going to run this in a restricted \n\nenvironment,\
    \ we will need a new set of launch options. That's why a set the environment \n\
    \nvariable TESTENV: 'CI', and I added a new setting in the config file:\n\nCI:\
    \ {\n\n baseURL : 'http://localhost:8080/',\n\n username: 'admin@gmail.com',\n\
    \n password: 'admin',\n\n launchOptions: { \n\n executablePath: process.env.PUPPETEER\\\
    _EXEC\\_PATH,\n\n headless: true,\n\n args: \\['--no-sandbox'\\],\n\n },"
  merge: -1
