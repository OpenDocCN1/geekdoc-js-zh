    \ = config.productToTestId;\n\nconst productDiv = await this.page.$(\\`\\[data-test-product-\n\
    \nid=\"${productId}\"\\]\\`);\n\nconst stockElement = await productDiv.$('\\[data-test-stock\\\
    ]');\n\nconst priceElement = await productDiv.$('\\[data-test-price\\]');\n\n\
    Any command-line input or output is written as follows:\n\n**~ % /Applications/Google\\\
    \\ Chrome.app/Contents/MacOS/Google\\\\ **\n\n**Chrome --headless --remote-debugging-port=9222\
    \ --crash-dumps-**\n\n**dir=/tmp**\n\n**Bold**: Indicates a new term, an important\
    \ word, or words that you see onscreen. For \n\nexample, words in menus or dialog\
