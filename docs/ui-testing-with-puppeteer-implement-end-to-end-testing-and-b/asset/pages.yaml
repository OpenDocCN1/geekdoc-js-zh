  md: "62 Navigating through a website\n\n**Product**\n\nAre you saying that we can\
    \ automate Firefox with Puppeteer? Yes, we can. Although it is \n\nstill experimental.\
    \ This is the official definition of \"experimental\": *Official Firefox support\
    \ *\n\n*is currently experimental. The ongoing collaboration with Mozilla aims\
    \ to support common *\n\n*end-to-end testing use cases, for which developers expect\
    \ cross-browser coverage. The *\n\n*Puppeteer team needs input from users to stabilize\
    \ Firefox support and to bring missing APIs *\n\n*to our attention.* My unofficial\
    \ definition would be: *It uses a nightly build of Firefox, and the *\n\n*long-term\
    \ support doesn't seem guaranteed.*\n\nDisclaimers aside, if you want to launch\
    \ a Firefox browser, you need first to install \n\nPuppeteer setting the PUPPETEER\\\
    _PRODUCT variable:\n\n**PUPPETEER\\_PRODUCT=firefox npm install puppeteer@7.0.0**\n\
    \nAnd then you can set Firefox as a product:\n\nbrowser = await puppeteer.launch({\
    \ product: 'firefox' });\n\n**Browser Arguments**\n\nThe args option is an array\
    \ of arguments or **flags** you can pass to the browser. There \n\nare over 1,400\
    \ flags (https://www.hardkoded.com/ui-testing-with-\n\npuppeteer/chrome-flags).\
    \ It would be impossible to cover all 1,400 flags. \n\n\\--no-sandbox is the most\
    \ common flag. From the official documentation: *In order to *\n\n*protect the\
    \ host environment from untrusted web content, Chrome uses multiple layers of\
    \ *\n\n*sandboxing. For this to work properly, the host should be configured first.*\n\
    \nThe key phrase here is *\"the host should be configured first.\"* You might\
    \ need to create a user \n\nwith the right permissions to use Puppeteer in a more\
    \ restricted context, such as **Docker** \n\nimages. A (risky) shortcut would\
    \ be the –no-sandbox flag, which would bypass the \n\nsandboxing system.\n\nOther\
    \ common flags are the following:\n\n•  --window-size to set the window size.\n\
    \n•  --proxy-server and \\--proxy-bypass-list to set up proxy settings.\n\nThere\
    \ is another option called extraPrefsFirefox. You can use this property to set\
    \ \n\nFirefox flags. Hopefully, you won't need to deal with these flags much."
  merge: -1
