  md: "Creating our first test project 43\n\nThat's bad, but not that bad. Mocha validates\
    \ by default that our tests should take less than \n\n2,000 ms. That sounds OK\
    \ for an isolated unit test. But UI tests might take longer than 2 \n\nseconds.\
    \ That doesn't mean that UI tests shouldn't have a timeout. **Speed is a feature**,\
    \ so \n\nwe should be able to enforce some expected timeout. We can change that\
    \ by adding the \n\n\\--timeout command-line argument to the launch setting we\
    \ set up in the package.\n\nconfig file. I think 30 seconds could be a reasonable\
    \ timeout. As it expects the value in \n\nmilliseconds, it should be 30000. Let's\
    \ make that change in our package.config file:\n\n\"scripts\": {\n\n \"test\"\
    : \"mocha --timeout 30000\"\n\n},\n\n**Tip**\n\nThe command-line argument is not\
    \ the only way to set up the timeout. You \n\ncan call this.Timeout (30000) inside\
    \ the describe function \n\nor configure the timeout using a config file (https://mochajs.\n\
    \norg/#configuring-mocha-nodejs).\n\nOnce we set up the timeout, we can try our\
    \ tests again by running npm test:\n\nTest Result\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_58_0.png)"
  merge: -1
  pgno: 58
- img_proc: true
  md: "44 Automated Testing and Test runners\n\nMocha not only ran our tests but also\
    \ printed a pretty decent report. We have there \n\nall the tests Mocha ran, the\
    \ final result, and the elapsed time. Here is where many test \n\nrunners offer\
    \ different options. For instance, Mocha has a \\--reporter flag. If you \n\n\
    go to https://mochajs.org/, you will see all the available reporters. We could\
    \ \n\nuse the list reporter, which shows the elapsed time of each test. We can\
    \ add it to our \n\npackage.config file:\n\n\"scripts\": {\n\n \"test\": \"mocha\
    \ --timeout 30000 --reporter=list\"\n\n},\n\nWith this change, we can get a better\
    \ report:\n\nTest Result using the list reporter\n\nThis project looks fine. If\
    \ you had only a few tests, this would be enough. But if we are \n\ngoing to have\
    \ lots of tests using many pages, this code won't scale. We need to organize \n\
    \nour code so that we can be more productive and reuse more code.\n\n**Organizing\
    \ our code**\n\nOur first test was quite simple: we were just checking the page\
    \ title. But let's take a look at \n\nthe home page:\n\nPacktpub home page\n\n\
    ![](img/a12c4f728acd6f69fe58d97e7f64e4f5_59_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_59_1.png)"
  merge: -1
  pgno: 59
- img_proc: true
  md: "Organizing our code 45\n\nThere are many actions we would like to test there:\
    \ \n\n• Search for an existing book.\n\n• Search for a non-existing book.\n\n\
    • Check the cart when it is empty.\n\n• Check the cart when we add a product.\n\
    \nLet's take, for example, *Search tests*. We would be doing the same steps every\
    \ time:\n\n1\\. Click on the search box.\n\n2\\. Enter the text.\n\n3\\. Click\
    \ on the search button.\n\nWe would be doing the same thing over and over in all\
    \ our search tests. Sometimes there \n\nis a misconception that, as the test code\
    \ is not production code, the code can be a mess. \n\nSo, people go and copy/paste\
    \ their tests over and over, duplicating code and hardcoding \n\nvalues. That\
    \ ends up with hard-to-maintain tests. When tests are hard to maintain, they \n\
    \ntend to be pushed down the priority list. Developers lose, QA analysts lose,\
    \ and in the end, \n\nclients lose.\n\nWe are going to see two techniques to improve\
    \ our test code: the **Page Object Model** \n\n(**POM**) and the test data config.\
    \ \n\n**Introducing the Page Object Model**\n\nThe POM is a design pattern that\
    \ will help us separate our test code from the \n\nimplementation of the interaction\
    \ our tests will perform.\n\nLet's build our HomePageModel together. What are\
    \ the possible interactions on \n\nthat page?\n\n• ** Go** (to the page)\n\n•\
    \ ** Get page title**\n\n• ** Search**\n\n• ** Sign In**\n\n• ** View Cart**\n\
    \n• ** Go to Checkout**\n\n• ** Subscribe**"
