- img_proc: true
  md: "146 Executing and Injecting JavaScript\n\n• Waiting for functions\n\n• Exposing\
    \ local functions\n\n• Running our checks with Checkly\n\nBy the end of this chapter,\
    \ you will be able to get more out of the page you are automating \n\nby executing\
    \ JavaScript code.\n\n**Technical requirements**\n\nYou will find all the code\
    \ of this chapter in the GitHub repository (https://github.\n\ncom/PacktPublishing/UI-Testing-with-Puppeteer)\
    \ under the Chapter6 \n\ndirectory. Remember to run npm install on that directory\
    \ and then go to the \n\nChapter6/vuejs-firebase-shopping-cart directory and run\
    \ npm install \n\nagain.\n\nIf you want to implement the code while following\
    \ this chapter, you can start from the \n\ncode you left in the Chapter5 directory.\n\
    \nLet's get started.\n\n**Executing JavaScript code**\n\nThe first question you\
    \ might ask is: \"Why would I need to run JavaScript code? Shouldn't \n\nPuppeteer\
    \ give me all the APIs I need?\" Well, yes and no.\n\nBefore getting into the\
    \ different possible use cases, let's see how this feature works.\n\n**Variable\
    \ scopes in JavaScript**\n\nOne thing that makes JavaScript so flexible is that\
    \ functions are first-class citizens. You can \n\ndeclare functions, assign them\
    \ to variables, and pass them as an argument. You could even \n\nreturn functions\
    \ from other functions, like in this example:\n\nfunction getFunc() {\n\n let\
    \ word = 'world'; \n\n return function() {\n\n console.log('Hello ' + word);\n\
    \n }\n\n}\n\ngetFunc()();"
  merge: -1
  pgno: 161
- img_proc: true
  md: "Executing JavaScript code 147\n\nThat code is pretty fun. getFunc returns another\
    \ function. When we do getFunc()(), \n\nwe are calling the function returned by\
    \ getFunc.\n\nThis piece of code will print 'Hello world' in the console. The\
    \ interesting part is that \n\nthe function returned by getFunc is able to keep\
    \ the variable word in its scope. \n\nYou could even do more complex things, for\
    \ instance, passing an argument to getFunc, \n\nand then using that argument inside\
    \ the function that getFunc will return:\n\nfunction getFunc(name) {\n\n return\
    \ function() {\n\n console.log('Hello ' + name);\n\n }\n\n}\n\ngetFunc('world')();\n\
    \ngetFunc('mars')();\n\nThat piece of code will print 'Hello world' and 'Hello\
    \ mars'. This is called a **closure**. \n\nAccording to MDN (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/closures), *A closure is the combination of a function bundled together\
    \ *\n\n*(enclosed) with references to its surrounding state (the lexical environment).\
    \ In other words, *\n\n*a closure gives you access to an outer function's scope\
    \ from an inner function*. When we call \n\ngetFunc, the returned function will\
    \ be bundled together with the string 'world' in the \n\nfirst case, or 'mars'\
    \ in the second case.\n\nWe won't get into the internals of this feature. But\
    \ you need to know that **this is not how **\n\n**functions work in Puppeteer**.\n\
    \nLet's try to use closures in Puppeteer:\n\nconst browser = await puppeteer.launch({headless:\
    \ false, \n\ndefaultViewport: null});\n\nconst page = await browser.newPage();\n\
    \nconst name = 'world';\n\nawait page.evaluate(() => alert('Hello ' + name));\n\
    \nbrowser.close();"
  merge: -1
  pgno: 162
- img_proc: true
  md: "148 Executing and Injecting JavaScript\n\nIn this case, we have a function\
    \ that we are passing to the evaluate function, and that \n\nfunction is using\
    \ the variable name, which is in the scope of the function we just created. \n\
    \nBut this is what we get:\n\nVariable scopes in Puppeteer\n\nAs you can see,\
    \ the name didn't get to the alert. For us as developers, the big issue is that\
    \ \n\nthe code looks good. If you look at the code, the code is perfect. It's\
    \ not very different from \n\nour previous examples. But something works differently\
    \ there. Once you understand this, \n\nyou will be able to answer lots of questions\
    \ on Stack Overflow.\n\nFirst, the signature of page.evaluate is page.evaluate(pageFunction\\\
    [, \n\n...args\\]), where pageFunction can be a string or a function. The second\
    \ argument \n\nis an optional list of values to pass to pageFunction.\n\nYou can\
    \ pass **expressions** as strings to the evaluate function. An expression is a\
    \ \n\nstatement like the ones you can write inside the DevTools console. For instance,\
    \ a simple \n\nstring returning the URL property of the document object:\n\nconsole.log(await\
    \ page.evaluate('document.URL'));\n\npage.evaluate will send the expression document.URL\
    \ to the browser and the \n\nbrowser will evaluate it. Once the browser evaluates\
    \ the expression, it will send that back \n\nto Puppeteer, and page.evaluate will\
    \ return the result. In this case, about:blank.\n\nExpressions are perfect when\
    \ you want to evaluate simple expressions. But you could \n\naccomplish the same\
    \ result using a JavaScript function:\n\nconsole.log(await page.evaluate(() =>\
    \ document.URL));\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_163_0.png)"
  merge: -1
  pgno: 163
- img_proc: true
  md: "Executing JavaScript code 149\n\nAs you can see, passing an expression is more\
    \ straightforward, but you will be able \n\nto write more complex code using functions,\
    \ and, no less important, you will get the \n\nautocomplete features of your code\
    \ editor.\n\nThe key concept here is that page.evaluate **will send the expression\
    \ to the browser**. \n\nHow can Puppeteer send a function to the browser? It will\
    \ serialize it. As I mentioned \n\nbefore, functions are first-class citizens\
    \ in JavaScript, which means that you can call \n\ntoString() to function inside\
    \ a variable. Let's try that out:\n\nconsole.log((() => alert('Hello ' + name)).toString());\n\
    \nThis will print the function as a string value in the console:\n\n**() => alert('Hello\
    \ ' + name)**\n\nIf Puppeteer takes that function, converts it to a string using\
    \ toString, and sends it to \n\nthe browser, the value of the name variable will\
    \ be lost in the process.\n\nWhen you send a function to be evaluated inside the\
    \ browser context, you need to make \n\nsure that all the values the function\
    \ uses are already in the browser or are being passed as \n\nan argument. This\
    \ is how we can fix our code:\n\nconst browser = await puppeteer.launch({headless:\
    \ false, \n\ndefaultViewport: null});\n\nconst page = await browser.newPage();\n\
    \nconst name = 'world';\n\nawait page.evaluate((n) => alert('Hello ' + n), name);\n\
    \nbrowser.close();\n\nAs we can see, we are passing the name variable as part\
    \ of the args argument of \n\nevaluate. Now Puppeteer knows that it has to serialize\
    \ that function and also send \n\nargs. The browser will now be able to execute\
    \ that function, passing those arguments.\n\n**Tip**\n\nNotice that I renamed\
    \ the variable name to n. It's not required, but this practice \n\nwill help you\
    \ avoid these kinds of scope mistakes. Now you, and your IDE, \n\nknow that the\
    \ n variable being used in the alert function is an argument \n\nbeing passed\
    \ to that function."
  merge: -1
  pgno: 164
- img_proc: true
  md: "150 Executing and Injecting JavaScript\n\nThis evaluate function is available\
    \ not only in the page and frame classes but also \n\nin the JSHandle and ElementHandle\
    \ classes. Let's explore how we can execute \n\nJavaScript code once we've got\
    \ an ElementHandle or a JSHandle in Puppeteer.\n\n**Manipulating handles with\
    \ JavaScript code**\n\nWe talked about ElementHandle in *Chapter 4*, *Interacting\
    \ with a Page*. Let's recap this \n\nconcept. ElementHandle is a variable in our\
    \ code pointing to a DOM element inside \n\nthe page we are automating. Now it's\
    \ time to know that an ElementHandle is, in fact, \n\na **JSHandle**.\n\nIn the\
    \ same way that ElementHandle is a variable pointing to an element in the \n\n\
    browser, **a JSHandle is a variable pointing to a variable on the page we are\
    \ automating**. \n\nIf we think about that, the only difference between a JavaScript\
    \ variable like, for \n\ninstance, document.URL, and a DOM element, like document.activeElement,\
    \ \n\nis that a DOM element has a visual representation, that's all. So, we can\
    \ say that an \n\nElementHandle (a DOM element) is also a JSHandle (a JavaScript\
    \ variable). \n\nInheritance 101.\n\nWe were using functions like $ or $x to get\
    \ ElementHandles. Now we can also use \n\nevaluateHandle, which works like evaluate,\
    \ but as Puppeteer knows that we want \n\na pointer to a variable in the browser,\
    \ a handle, it will return an object that will represent \n\nthat variable in\
    \ the browser.\n\nLet's go back to our login test. The way we were getting the\
    \ password input was \n\nstraightforward:\n\nconst passwordInput = await this.page.$('#password');\n\
    \nBut, let's imagine that the developers want to create a super-secure login creating\
    \ elements \n\ndynamically. But, they tell us that they are storing the password\
    \ input in the window.\n\npasswordInput variable. We could get that input using\
    \ an evaluateHandle:\n\nconst passwordInput = (await page.evaluateHandle(() =>\
    \ window.\n\npasswordInput)).asElement();\n\nThere, evaluateHandle will return\
    \ a JSHandle, which we can convert to an \n\nElementHandle using the asElement\
    \ function. If you have to find an element that \n\nyou cannot find using a CSS\
    \ selector or an XPath selector, you now have a third tool: you \n\ncan use a\
    \ JavaScript function."
  merge: -1
  pgno: 165
- img_proc: true
  md: "Manipulating handles with JavaScript code 151\n\nThe evaluateHandle function\
    \ is not limited to DOM elements or simple variables. \n\nYou can also return,\
    \ and even create, objects for later access. You will find this code in the \n\
    \nChapter6/demos.js file:\n\nconst counter = await page.evaluateHandle(() => {\n\
    \n window.counter = { count: 2}; \n\n return window.counter;\n\n});\n\nawait counter.evaluate((c,\
    \ inc) => c.count += inc, 3);\n\nawait page.evaluate(() => alert(window.counter.count));\n\
    \nIf you run this, you will see this result:\n\nEvaluate result\n\nIn the first\
    \ evaluateHandle, we create an object with a property count, assign it to \n\n\
    a property counter in the window object, and then return that object.\n\nBy using\
    \ the window object, we make it clear that we are using a global variable. If\
    \ \n\nwe declare a variable inside that function, we will lose it after executing\
    \ the function. \n\nAlthough it is not considered a good practice, we could declare\
    \ counter as a global \n\nvariable by changing window.counter with just counter:\n\
    \nconst counter = await page.evaluateHandle(() => {\n\n counter = { count: 2};\
    \ \n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_166_0.png)"
  merge: -1
  pgno: 166
- img_proc: true
  md: "152 Executing and Injecting JavaScript\n\n return counter;\n\n});\n\nIn the\
    \ second step, we are learning how to use the evaluate function, but in the context\
    \ \n\nof a JSHandle. The function works in the same way as the evaluate function\
    \ in the \n\npage class. But here, it will pass the JSHandle as the first argument:\n\
    \nawait counter.evaluate((c, inc) => c.count += inc, 3);\n\nAs you can see there,\
    \ the function expects two arguments: c and inc. But we are only \n\npassing 3,\
    \ which is the second argument, inc, because the first argument, c, is our \n\n\
    JSHandle.\n\nWe could also have a function with no extra arguments. For instance,\
    \ we could hardcode \n\nthat 3 inside the function:\n\nawait counter.evaluate(c\
    \ => c.count += 3);\n\nYou can also pass JSHandle objects as arguments to the\
    \ evaluate function of the \n\npage class. So, this would be the equivalent of\
    \ the previous example:\n\nawait page.evaluate(c => c.count += 3, counter);\n\n\
    This opens the door to many new things we can do with Puppeteer. Let's see some\
    \ \n\nexamples.\n\n**Getting information from the elements**\n\nChecking how the\
    \ page reacts to an action is quite essential. For instance, if you add \n\nan\
    \ item to the cart, you would like to check whether the number of items count\
    \ was \n\nincreased.\n\nIf we take a look at our HomePageModel class, this is\
    \ how we solved the getStock \n\nfunction, which helped us check the stock prices:\n\
    \nasync getStock(productName) {\n\n const productDiv = (await this.page.$x(\\\
    `//a\\[text()=\"${produ\n\nctName}\"\\]/../..\\`))\\[0\\];\n\n const stockElement\
    \ = (await productDiv.$x('./h6'))\\[0\\];\n\n return await stockElement.evaluate(e\
    \ => e.innerText);\n\n}"
  merge: -1
  pgno: 167
- img_proc: true
  md: "Manipulating handles with JavaScript code 153\n\nWe used that code to learn\
    \ the XPath expression. In the first two lines, we were getting \n\nthe product\
    \ div, and from there, the stock element. After that, we used the evaluate \n\n\
    function to get the text of that element.\n\nI believe these kinds of functionalities\
    \ should be part of the Puppeteer API. But in the \n\nmeantime, you can start\
    \ building your utility functions. We can start with a generic \n\nfunction to\
    \ return the innerText value:\n\nasync getInnerText(el) { \n\n return await el.evaluate(el\
    \ => el.innerText);\n\n}\n\nThis function will expect an element as an argument\
    \ and return the innerText property. \n\nThe innerText property returns the text\
    \ content of a DOM element, including all its \n\ndescendants. But you could also\
    \ create new utility functions for other common properties:\n\n•  innerHtml returns\
    \ the HTML content inside an element. \n\n•  outerHTML returns the HTML content,\
    \ including the HTML of the element itself.\n\n• If you want to get the value\
    \ of an input element, you will need to use value\n\ninstead of innerText.\n\n\
    You can check the MDN site for a complete list of element properties (https://www.\n\
    \nhardkoded.com/ui-testing-with-puppeteer/element). You will also find \n\nthat\
    \ some elements have specific properties. For instance, an input box has properties\
    \ \n\nsuch as disabled or checked when the type is a checkbox.\n\nIf you don't\
    \ want to mess with ElementHandles, you can also use page.$eval. \n\nThe signature\
    \ of this function is page.$eval(selector, pageFunction\\[, \n\n...args\\]). The\
    \ page will get the ElementHandle using the selector, and then execute \n\nevaluate,\
    \ passing the pageFunction and the args.\n\nWith this in mind, we can replace\
    \ this line we can find in the logState function inside \n\nthe LoginPageModel.js\
    \ file:\n\nreturn await this.page.evaluate(() => document.\n\nquerySelector('#navbarTop\
    \ .nav-link').innerText);\n\nWith this simpler line of code:\n\nreturn await this.page.$eval('#navbarTop\
    \ .nav-link', el => \n\nel.innerText);"
  merge: -1
  pgno: 168
- img_proc: true
  md: "154 Executing and Injecting JavaScript\n\nThis line of code is easier to read\
    \ because you have the selector on one side and the \n\nfunction to execute on\
    \ the other side. Notice that the pageFunction must always have \n\nthe element\
    \ as the first argument.\n\nBut using the evaluate function is not only about\
    \ getting information. We can change \n\nthe page behavior, acting on elements.\n\
    \n**Acting on elements**\n\nYou can use the evaluate function to get values from\
    \ elements and act on those \n\nelements so that you can **force** specific scenarios.\n\
    \nThis might sound hacky, but sometimes all the steps required to get to a particular\
    \ \n\nscenario aren't worth the effort. It's like those cooking TV shows, where\
    \ they are baking \n\na cake, and suddenly, they come up with an already baked\
    \ cake, and they show you how \n\nto add the cream.\n\nThese kinds of shortcuts\
    \ not only save you time, but reduce potential flakiness that could \n\ncome up\
    \ during a long process, where you need to wait for many things to happen before\
    \ \n\nyou can act.\n\nThe first action we will learn about is forcing a click\
    \ action. Wait, don't we have \n\na click function in Puppeteer? We do have a\
    \ click function. The good thing about \n\nthe click function is that it emulates\
    \ a user click. But to be a real emulation, the element \n\nbeing clicked needs\
    \ to be visible and actionable (clickable). Sometimes we don't want to \n\nrun\
    \ the risk of getting a fail because the element was hidden. We can take a shortcut\
    \ and \n\nforce a click using the click function:\n\nawait el.evaluate(el => el.click());\n\
    \nHere, instead of calling el.click(), we call the click function inside the browser.\n\
    \nIn the same way as with properties, this method is not only for the click \n\
    \nfunction. You can use it to force the blur event or select a text in an input\
    \ with the \n\nsetSelectionRange function.\n\nYou can act on elements not only\
    \ through functions. You can also set properties. For \n\ninstance, you could\
    \ disable the email input on the login page programmatically. Let's see \n\nthat\
    \ in action: \n\nconst emailInput = await page.$('#email');\n\nawait emailInput.evaluate(e\
    \ => e.disabled = true);"
  merge: -1
  pgno: 169
- img_proc: true
  md: "Manipulating handles with JavaScript code 155\n\nHere, we get the element,\
    \ and then we set the disabled property. With this recipe, you \n\ncould also\
    \ set the innerText of an element. For instance, you could change a product \n\
    \ndescription with a very long text to see how the page reacts to long product\
    \ titles.\n\nSometimes, being \"hacky\" is what we want to test. Is our site ready\
    \ for clever users?\n\n**Enforcing server rules**\n\nWith the rise of rich web\
    \ applications, a new type of bad practice emerged: **writing **\n\n**business\
    \ rules only on the client side**.\n\nWe need important business rules on the\
    \ server first, and then on the client. Let's say \n\nthat in our cart application,\
    \ we need to validate that the user has been authorized to \n\nmake purchases.\
    \ We wrote that business rule, but the only thing we did was add an \n\n\"is-disabled\"\
    \ CSS class in the checkout button. If I'm a clever user, I could open the \n\n\
    developer tools, remove that class, and then click on the button. If we don't\
    \ have the same \n\nrule on the server, the user might have easily bypassed our\
    \ business rule.\n\nWe can write our own \"should validate on the server\" test.\
    \ Let's grab the checkbox, remove \n\nthe CSS class, and try to click on it:\n\
    \nconst checkoutBtn = (await page.$x('//\n\nbutton\\[contains(text(),\"Checkout\"\
    )\\]'))\\[0\\];\n\ncheckoutBtn.evaluate(el => el.classList.remove('is-disabled'));\n\
    \nawait checkoutBtn.click();\n\nHere, we are getting the checkout button, and\
    \ then we remove the is-disabled \n\nCSS class programmatically. That would enable\
    \ the button, so then we can click it. After \n\nthat, we should do some validation\
    \ to check that the business rule was enforced on the \n\nserver side.\n\nThe\
    \ evaluate function can also help us when we can't find elements using CSS selectors\
    \ \n\nor XPath expressions."
  merge: -1
  pgno: 170
- img_proc: true
  md: "156 Executing and Injecting JavaScript\n\n**Finding elements using JavaScript**\n\
    \nWe can find DOM elements using CSS selectors in over 90% of cases, even more\
    \ if we use \n\nattribute selectors. XPath expressions help us cover another 9%\
    \ of the cases. But there is \n\nthat 1% where we need something more elaborated.\
    \ For instance, there are properties that \n\nare not exposed in a way for a CSS\
    \ selector to work. Let's take the case of input text.\n\nAn input box in Amazon\n\
    \nIf the input box is rendered with the word puppeteer (by rendered, I mean that\
    \ it has the \n\nvalue in the HTML content), the attribute selector \\[value=puppeteer\\\
    ] will work. But \n\nif the value changes to, for example, *node*, the \\[value=node\\\
    ] selector won't work, and \n\nthe first selector, \\[value=puppeteer\\], would\
    \ still return a DOM element. \n\nSome properties are not exposed as HTML attributes,\
    \ so we won't be able to use them \n\non CSS selectors or XPath expressions. For\
    \ instance, the IMG element has a property \n\ncalled naturalWidth. This property\
    \ will return the original size of the image. With this \n\nproperty, we could\
    \ write a test to check that all the images on our home page are being \n\nloaded.\
    \ If the naturalWidth of an image is 0, it means that the image was not loaded.\
    \ \n\nYou can find this code in the test called 'Should load all images' inside\
    \ the \n\nChapter6/test/homepage.tests.js file:\n\nconst images = await page.evaluateHandle(()\
    \ => \n\n Array.from(document.querySelectorAll('IMG')).filter(e => \n\n!e.naturalWidth));\n\
    \n(await images.evaluate(e => e.length)).should.equal(0);\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_171_0.png)"
  merge: -1
  pgno: 171
- img_proc: true
  md: "Waiting for functions 157\n\nIn this test, we are getting all the IMG elements\
    \ with document.\n\nquerySelectorAll('IMG'). Then we need to wrap it inside an\
    \ Array.from, so \n\nwe can filter those elements. And then, we call the filter\
    \ function, asking for elements \n\nwith a naturalWidth value: !e.naturalWidth.\n\
    \nHere is something important for you to notice. The function we are executing\
    \ using \n\nevaluateHandle returns a list of elements. But evaluateHandle will\
    \ return one \n\nelement handle. It will return a pointer to that array in the\
    \ browser. So, if we need to get \n\nthe length of that array, we need to call\
    \ evaluate and request the length property.\n\nSituations like these are when\
    \ you need to find a balance. Sometimes it's simpler to have \n\na big evaluate\
    \ function but evaluate everything in one trip. In this case, this could have\
    \ \n\nbeen solved in only one async call:\n\n(await page.evaluateHandle(() =>\
    \ \n\n Array.from(document.querySelectorAll('IMG')).filter(\n\n e => !e.naturalWidth).length)).should.equal(0);\n\
    \nNow we are doing everything in one hit. We query the images, we filter them,\
    \ and check \n\nfor the length.\n\nWe've learned how to execute JavaScript code\
    \ and how to manipulate elements, but there \n\nis more. We can also use JavaScript\
    \ code as wait functions.\n\n**Waiting for functions**\n\nWe learned about many\
    \ wait functions in *Chapter 5*, *Waiting for elements and network *\n\n*calls*.\
    \ We learned to wait for network events, for DOM elements to be visible or hidden.\
    \ We \n\nalso covered many page events we can wait for. But in the same way that\
    \ a CSS selector \n\nwon't cover 100% of cases, and an XPath expression cannot\
    \ cover all other scenarios, the \n\nsame happens with wait functions.\n\nThere\
    \ are some scenarios where we need something more. Now we have the \n\nwaitForFunction.\n\
    \nThis is the signature of the waitForFunction function: page.\n\nwaitForFunction(pageFunction,\
    \ options, ...args).\n\nThe first argument is the pageFunction. It works in the\
    \ same way as in the evaluate \n\nfunction. It can be a JavaScript function; it\
    \ could also be a string; it can expect arguments, \n\nand so on.\n\nThe third\
    \ argument, args, is the arguments that can be sent to the function. This is an\
    \ \n\noptional list of values."
  merge: -1
  pgno: 172
- img_proc: true
  md: "158 Executing and Injecting JavaScript\n\nI didn't forget about the second\
    \ argument. The second argument is the options \n\nargument. The options object\
    \ has two settings:\n\n• The first property is, you guessed it, timeout. It has\
    \ the same defaults as we saw \n\nin the different wait functions in *Chapter\
    \ 5*, *Waiting for elements and network calls*: \n\ndefaults to 30 seconds, and\
    \ then you change or overwrite the value with page.\n\nsetDefaultTimeout(timeout).\n\
    \n• The second property is the interesting one: the polling option. This option\
    \ \n\ndetermines the frequency at which Puppeteer will execute our function. We\
    \ have \n\nthree possible options:\n\na) The default option is raf. **Raf** is\
    \ short for requestAnimationFrame. \n\nAccording to Mozilla, the *requestAnimationFrame\
    \ method tells the browser that you *\n\n*wish to perform an animation and requests\
    \ that the browser calls a specified function *\n\n*to update an animation before\
    \ the next repaint. The method takes a callback as an *\n\n*argument to be invoked\
    \ before the repaint* (https://www.hardkoded.com/\n\nui-testing-with-puppeteer/raf).\
    \ It is the most frequent polling you \n\ncan use.\n\nb) The second option available\
    \ is mutation. This option will use a \n\nMutationObserver. According to Mozilla,\
    \ *The MutationObserver *\n\n*interface provides the ability to watch for changes\
    \ being made to the DOM tree* \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nMutationObserver).\n\nc) The last option is a number. This number will be an\
    \ interval in milliseconds at \n\nwhich the function will be executed.\n\nWhen\
    \ we talked about finding elements using JavaScript, we mentioned that there are\
    \ \n\nmany scenarios where CSS selectors or XPath expressions won't be enough.\
    \ But I also \n\nthink that sometimes an evaluateHandle or a waitForFunction call\
    \ will be easier \n\nto read than a complex XPath expression.\n\nLet's take, for\
    \ instance, the Packt cart:"
  merge: -1
  pgno: 173
- img_proc: true
  md: "Waiting for functions 159\n\nPackt cart\n\nWhen we add a new book to the cart,\
    \ the cart number is not updated immediately. If we \n\nlook at the **Network**\
    \ tab, there is a network call to an \"**add**\" endpoint, and after that, the\
    \ \n\ncart is updated.\n\nWe can wait for that item number to be updated in many\
    \ ways. We could wait for the \n\nitems list to be updated using a CSS selector.\
    \ We could also wait for a network response \n\nwith the URL \"**add**\". But\
    \ we could also do something as simple as wait for the number to \n\nchange.\n\
    \nThere is one more challenge there. When we add an item to the cart, we need\
    \ to dismiss \n\nit. But the popup is moving. The good news is that **we can use\
    \ a **waitForFunction **to **\n\n**wait for animations to finish**.\n\n**Important\
    \ note**\n\nI thought this would be a simple example, and it turned out to be\
    \ quite \n\ncomplicated. But I think it's great. You will find these kinds of\
    \ issues in real life, \n\nand you need to resolve them.\n\nI'm going to explain\
    \ the test piece by piece. You will be able to see the entire test in the \n\n\
    packpub.tests.js file.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_174_0.png)"
  merge: -1
  pgno: 174
- img_proc: true
  md: "160 Executing and Injecting JavaScript\n\nThe first thing we need to solve,\
    \ and it's something that we, unfortunately, see a lot these \n\ndays, is the\
    \ cookies notification. Let's see how we can wait for a notification banner using\
    \ \n\nPuppeteer:\n\nawait page.goto('https://www.packtpub.com/tech/javascript/');\n\
    \nconst cookieLink = await page.waitForSelector('.accept\\_all', { \n\ntimeout\
    \ : 1000}).catch(e => e);\n\nif (cookieLink) {\n\n await cookieLink.click();\n\
    \n}\n\nThe first thing we do is go to the page we want to test. Then we might,\
    \ or might not, get \n\nthe cookies banner. The problem is that the cookies banner\
    \ might take a little while to \n\nbe shown. So, we wait for the '.accept\\_all'\
    \ selector, which is the **Accept cookies** \n\nbutton. We give it a second, 1000\
    \ ms. If we don't get that button, that's why we swallow the \n\nexception using\
    \ .catch(e => e). If we finally get that cookie button, we click on it.\n\nOnce\
    \ the cookies banner is dismissed, we need to wait for the page to be ready to\
    \ act. We \n\ndon't care which client library the page is using, but it seems\
    \ that it takes a little bit to be \n\nready to act. One of the things I found\
    \ is that it will set the class empty to the cart button \n\nwhen the cart is\
    \ ready. Another thing we know is that the **Add to cart** buttons have the \n\
    \nadd-to-cart class. We can add a Promise.all and wait for those two conditions:\n\
    \nawait Promise.all(\\[\n\n page.waitForSelector('.counter.qty.empty'),\n\n page.waitForSelector('.add-to-cart')\n\
    \n\\]);\n\nThis step was easy. We need to wait for the selectors, .counter.qty.empty,\
    \ which is \n\nthe empty cart button, and .add-to-cart, which is the **Add to\
    \ cart** button.\n\nNext up, we need to set up our wait promises:\n\nconst cartIsOnePromise\
    \ = page.waitForFunction(() => document.\n\nquerySelector('.counter.qty .counter-number').innerText.trim()\
    \ \n\n\\=== '1');\n\nconst cartIsTwoPromise = page.waitForFunction(() => document.\n\
    \nquerySelector('.counter.qty .counter-number').innerText.trim() \n\n\\=== '2');"
  merge: -1
  pgno: 175
- img_proc: true
  md: "Waiting for functions 161\n\nThis looks complex, but it's not that complex.\
    \ We are setting up two promises. The first \n\npromise will resolve when the\
    \ text (using the innerText property) of the cart counter, \n\nwhich has the selector\
    \ .counter.qty .counter-number, is equal to 1. We hope it \n\nwill be resolved\
    \ at one point in time after we click on the first product. There, I added \n\n\
    a trim function, so we remove any extra spaces.\n\nThe second promise is the same\
    \ as the first one. But it will resolve when the cart number \n\nis equal to 2.\n\
    \nNow that we have our wait promises, it's time to click on the first product:\n\
    \nconst addToCartButtons = await page.$$('.add-to-cart');\n\nawait addToCartButtons\\\
    [0\\].click();\n\nHere, we are grabbing all the **Add to cart** buttons and clicking\
    \ on the first one. \n\nNow we get to the fun part. We need to wait for the checkout\
    \ popup to show up and finish \n\nits fancy animation: \n\nawait page.waitForFunction(async\
    \ () => {\n\n const element = document.querySelector('.block-minicart');\n\n let\
    \ currentHeight = element.getBoundingClientRect().height;\n\n let stopMovingCounter\
    \ = 0;\n\n await new Promise((resolve) => {\n\n const stoppedMoving = function()\
    \ {\n\n if (element.getAttribute('style') !== 'display: \n\nblock;') {\n\n setTimeout(stoppedMoving,\
    \ 20);\n\n }\n\n if(element.getBoundingClientRect().height > 0 && \n\ncurrentHeight\
    \ === element.getBoundingClientRect().height) {\n\n stopMovingCounter++;\n\n }\
    \ else {\n\n stopMovingCounter = 0;\n\n currentHeight = element.\n\ngetBoundingClientRect().height;\n\
    \n } \n\n if(stopMovingCounter === 10) {\n\n resolve();\n\n }\n\n setTimeout(stoppedMoving,\
    \ 20);"
  merge: -1
  pgno: 176
- img_proc: true
  md: "162 Executing and Injecting JavaScript\n\n };\n\n stoppedMoving();\n\n });\n\
    \n return true;\n\n});\n\nPretty scary, right? Let's analyze this function because\
    \ it's a handy method.\n\nOur wait for function needs to be resolved when the\
    \ checkout popup is visible and \n\nhas stopped moving. How do we know that it\
    \ stopped moving? Well, we could check the \n\nelement height every 20 milliseconds,\
    \ and if the height is the same after 10 checks, we can \n\nassume it stopped\
    \ moving.\n\nThe first thing we do is get the element, grabbing the initial height\
    \ using \n\ngetBoundingClientRect, and set a counter to 0.\n\nOnce we have that,\
    \ we will await a promise, but it will be resolved inside the browser. \n\nInside\
    \ that promise, we will create a function called stoppedMoving, and we will call\
    \ \n\nit. \n\nThe first thing we will check inside that function is whether the\
    \ element is visible. If it's \n\nnot, we will call the function again after 20\
    \ milliseconds.\n\nThen we check the current height. If the height has changed,\
    \ we reset the counter, and \n\nwe start over. If it didn't change for the past\
    \ 10 times, we resolve the promise by calling \n\nresolve().\n\nThe last thing\
    \ we do there is to call the same function after 20 milliseconds. Eventually,\
    \ \n\nthat function will be resolved, or it will fail due to the waitForFunction\
    \ timeout.\n\n**The numbers here are relative. You don't need to wait 20 milliseconds\
    \ or wait 10 times. **\n\n**You can pick the numbers that will suit you in your\
    \ example.**\n\nOnce we know that the popup is opened and is not moving, we can\
    \ close it using the \n\nfollowing code:\n\nawait page.click('#btn-minicart-close');\n\
    \nAs simple as calling click, we are passing the close button selector."
  merge: -1
  pgno: 177
- img_proc: true
  md: "Exposing local functions 163\n\nNow we can wait for the cart number to be updated\
    \ to 1:\n\nawait cartIsOnePromise;\n\nHere, we are awaiting the promise we built\
    \ before. The promise might have already been \n\nresolved by the time we get\
    \ here; we don't care. If the promise is resolved, the await will \n\nresolve\
    \ immediately. If not, we will wait.\n\nLastly, we click on a second product and\
    \ await the second promise:\n\nawait addToCartButtons\\[1\\].click();\n\nawait\
    \ cartIsTwoPromise;\n\nHere, we grabbed the second product on the list, clicked\
    \ on it, and waited for the cart \n\nnumber to change to 2. Again, we don't care\
    \ if that promise was already resolved or not.\n\nIf all promises were resolved,\
    \ there is nothing to assert. We know that everything worked \n\nas expected.\n\
    \nI bet you will need a break after this section. Once you are ready, we will\
    \ see one more \n\nthing we can do with functions. We are going to make the browser\
    \ call functions on the \n\nNode side.\n\n**Exposing local functions**\n\nWith\
    \ Puppeteer, you can not only execute code inside the browser but also make calls\
    \ \n\nfrom the browser back to your Node app. The exposeFunction function allows\
    \ us to \n\nregister Node functions inside the browser.\n\nThis is the exposeFunction\
    \ signature: page.exposeFunction(name, \n\npuppeteerFunction):\n\n• The first\
    \ argument is name. This will be the function name inside the browser.\n\n•  puppeteerFunction\
    \ is a function that follows the same style and functionality \n\nas all the functions\
    \ we have learned about in this chapter.\n\nThis feature is perfect when it is\
    \ called from a MutationObserver."
  merge: -1
  pgno: 178
- img_proc: true
  md: "164 Executing and Injecting JavaScript\n\nFor instance, instead of executing\
    \ a function over and over, waiting for the checkout \n\ncounter to change, we\
    \ could create a MutationObserver to let us know when the value \n\nhas changed\
    \ in the HTML Node. Let's see how the code would look:\n\nlet observer = new MutationObserver(list\
    \ => console.\n\nlog(list\\[0\\].target.nodeValue));\n\nobserver.observe(\n\n\
    \ document.querySelector('.counter.qty .counter-number'), \n\n {\n\n characterData:\
    \ true, \n\n attributes: false, \n\n childList: false, \n\n subtree: true\n\n\
    \ });\n\nIn this piece of code, we are declaring an observer, which expects a\
    \ callback function. \n\nThe first argument of that callback function will be\
    \ a list of mutations. That mutation \n\nhas the target object, and we can get\
    \ the nodeValue from there. You can go to the \n\nMozilla documentation (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/MutationRecord) if you want to know the full list of properties of\
    \ the \n\nmutation records.\n\nThat observer won't do much. We need to tell it\
    \ to observe changes in a particular \n\nelement, in our case, an element with\
    \ the selector .counter.qty .counter-\n\nnumber. So, we call observe, passing\
    \ the counter element, and, as a second argument, \n\nwe will tell the observe\
    \ function what changes we want to listen to. In this case, we \n\nonly care about\
    \ characterData changes, and we also want to listen to changes in the \n\nsubtree\
    \ (child elements). That means text changes.\n\nSo now, we could make a copy of\
    \ our previous test and replace cartIsOnePromise \n\nand cartIsTwoPromise with\
    \ something like this:\n\nconst reachedToTwo = new Promise((resolve) => {\n\n\
    \ page.exposeFunction('notifyCartChange', i => {\n\n if(i ==='2') \n\n resolve();\n\
    \n })\n\n});\n\nawait page.evaluate(() => {\n\n let observer = new MutationObserver(list\
    \ => \n\nnotifiyCartChange(list\\[0\\].target.nodeValue));"
  merge: -1
  pgno: 179
- img_proc: true
  md: "Exposing local functions 165\n\n observer.observe(\n\n document.querySelector('.counter.qty\
    \ .counter-number'), \n\n {\n\n characterData: true, \n\n attributes: false, \n\
    \n childList: false, \n\n subtree: true\n\n });\n\n});\n\nWe create a promise,\
    \ reachedToTwo. Inside the promise constructor, we will expose \n\na function\
    \ named 'notifyCartChange'. The function we will expose there will expect \n\n\
    one argument, and we will resolve the promise if the argument is equal to '2'.\n\
    \nThat exposeFunction function will allow us to call a notifiyCartChange inside\
    \ \n\nthe MutationObserver we declared using an evaluate call.\n\nFor the last\
    \ step, we replace our old awaits with the new promise:\n\nawait reachedToTwo;\n\
    \nIf everything goes as expected, notifyCartChange will be called twice, once\
    \ \n\nwith the value '1' and then with the value '2', and the second call will\
    \ resolve the \n\nreachedToTwo promise we added at the end of the test.\n\nThis\
    \ might sound like silly, overcomplicated code, but picture all you could do with\
    \ \n\nexposeFunction and MutationObserver. You could test chat apps by listening\
    \ \n\nto incoming changes and many other complex scenarios.\n\nBefore wrapping\
    \ up this chapter, it is time to add another tool to our toolbox."
  merge: -1
  pgno: 180
- img_proc: true
  md: "166 Executing and Injecting JavaScript\n\n**Running our checks with Checkly**\n\
    \nThis is an extra tool that I want to show you, and you shouldn't miss the chance\
