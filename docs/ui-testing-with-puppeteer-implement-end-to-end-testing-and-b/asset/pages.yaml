  md: "**1**\n\n**Getting started with **\n\n**Puppeteer**\n\nI remember the first\
    \ time I heard about browser automation. A friend told me that their \n\nQA team\
    \ was testing using \"automation.\" That sounded magical to me. People testing\
    \ \n\nwebsites using \"automation.\" After a few years, I learned that automation\
    \ wasn't a magic \n\npotion, but instead a powerful tool not only for QA but also\
    \ for developers, because we \n\ndevelopers love to automate stuff, right?\n\n\
    That's why in the first part of this chapter, I want to show you how browser automation\
    \ \n\nworks and what makes Puppeteer unique. In the latter part of this chapter,\
    \ we are going \n\nto review some asynchronous techniques that are going to be\
    \ useful throughout the rest \n\nof the book, and throughout your automation journey.\n\
    \nThis chapter will cover the following topics:\n\n• What is browser automation?\n\
    \n• Introducing headless browsers\n\n• Puppeteer use cases\n\n• Setting up the\
    \ environment\n\n• Our first Puppeteer code\n\n• Asynchronous programming in JavaScript"
  merge: -1
  pgno: 16
- img_proc: true
  md: "2 Getting started with Puppeteer\n\n**What is browser automation?**\n\nIf you\
    \ go and look for the word \"automation\" in Wikipedia, it will tell you that\
    \ it is\n\n*\"a process or procedure performed with minimal human assistance.\"\
    * If you are a developer, \n\nor just a geek, I bet you love to create scripts\
    \ to automate tasks. You might also create \n\nenvironment variables, so you don't\
    \ have to type long paths, or even create cool Git \n\ncommands, so you don't\
    \ need to remember all the steps required to create a new branch \n\nupstream.\n\
    \nWhen I got my first Mac, I discovered an app called Automator. I fell in love\
    \ with it. You \n\ncan automate tasks and connect applications just using drag\
    \ and drop. If you use macOS \n\nand you've never played with Automator, please\
    \ give it a try! But Automator isn't the only \n\napp. There are many workflow\
    \ apps in the market, such as Hazel or Alfred.\n\nAutomation is even in the cloud\
    \ and is available to the general public. Apps such as IFTTT \n\nand Zapier allow\
    \ users to automate everyday tasks. You can create automations such \n\nas \"\
    When I post on Instagram, share the same image on Twitter,\" all from your phone.\
    \ \n\nRegular people doing automation, that's great!\n\nWe also have mail rules.\
    \ Most mail clients, even web clients, let you create rules, so you \n\ncan mark\
    \ emails as read, label them, or even remove them based on conditions. That's\
    \ also \n\nautomation.\n\nMaybe you've taken it to the next level and coded an\
    \ application for some of your daily \n\ntasks. You have that report that you\
    \ need to send to your boss every month. That report \n\nis the result of many\
    \ CSV files. You just wrote a tiny app, using your favorite language to \n\nmake\
    \ that report for you.\n\nIn a few words, automation means using an app to do\
    \ a repetitive task for us. And as we \n\nhave seen, it doesn't necessarily involve\
    \ coding that app. So now, we can say that **browser **\n\n**automation is telling\
    \ an app to do a repetitive task in the browser for us**.\n\nOk, that's a simple\
    \ statement. But how's that possible? When you automate an app, you \n\naccomplish\
    \ this using some kind of **application program interface** (**API**). For example,\
    \ \n\nwhen you write a bat/bash file, you use the command-line arguments as an\
    \ interface. \n\nIf you use IFTTT, it employs Twitter's and Instagram's HTTP APIs\
    \ to fetch images and \n\ncreate tweets. You need some kind of API, some way to\
    \ interact with the app you are \n\ntrying to automate. How are we supposed to\
    \ interact with the browser? Good question.\n\nTo make things a little bit more\
    \ complicated, we also need to consider that we have two \n\napps to automate:\
    \ the browser itself and the website. We don't want just to open a browser, \n\
    \ncreate a new tab, and navigate to a page. We also want to go to that page and\
    \ perform \n\nsome actions. We want to click on a button, or enter some text in\
    \ an input element."
  merge: -1
  pgno: 17
- img_proc: true
  md: "What is browser automation? 3\n\nAutomating a browser sounds challenging. But,\
    \ luckily for us, we have some brilliant \n\npeople who did an excellent job for\
    \ us and created tools such as Selenium and Puppeteer.\n\n**Selenium and Puppeteer**\n\
    \nA quick search on Google will show that Selenium is one of the top, if not *the*\
    \ top, \n\nUI testing tool on the market. I think a question many people would\
    \ ask is: **Why should **\n\n**I choose Puppeteer over Selenium? Which one is\
    \ better?**\n\nThe first thing you need to know is that Puppeteer was not created\
    \ to compete with \n\nSelenium. Selenium is a cross-language, cross-browser testing\
    \ tool, whereas Puppeteer \n\nwas created as a multi-purpose automation tool to\
    \ exploit all the power of Chromium. \n\nI think both are great automation tools,\
    \ but they tackle browser automation in two \n\ndifferent ways. They are different\
    \ in two important aspects that define the target audience \n\nof a browser automation\
    \ library:\n\n• The interface between the tool and the browser\n\n• The interface\
    \ between the tool and the user\n\nLet's first unpack how Selenium works.\n\n\
    **Selenium's approach**\n\nIn order to automate most browsers in the market, Selenium\
    \ wrote a spec (an API) called \n\n**WebDriver**, which the W3C then accepted\
    \ as a standard (https://www.hardkoded.\n\ncom/ui-testing-with-puppeteer/webdriver),\
    \ and asked the browsers to \n\nimplement that interface. Selenium will use this\
    \ WebDriver API to interact with the \n\nbrowser. If you take a look at the paper\
    \ at the preceding URL, you will find two words \n\nshowing up over and over:\
    \ **testing** and **simplicity**. In other words, they defined an API \n\nwith\
    \ a clear focus on testing and simplicity and asked the browsers to implement\
    \ that \n\ninterface. Cross-browser testing is, in my opinion, the main feature\
    \ of Selenium.\n\n**What is an API?**\n\nAn API is the set of classes, functions,\
    \ properties, and events that a library \n\nallows us to use. An API is critical\
    \ for a library's success because it will \n\ndetermine how much you can do with\
    \ it and how easy (or not) the interaction \n\nwill be with the library."
  merge: -1
  pgno: 18
- img_proc: true
  md: "4 Getting started with Puppeteer\n\nThe API that Selenium exposes to users\
    \ is also considered a part of the WebDriver \n\nspec, and it follows the same\
    \ philosophy: it's focused on testing and simplicity. This \n\nAPI provides a\
    \ layer of abstraction between the user and all the different browsers and \n\n\
    provides an interface that will easily help the developer write tests.\n\n**Puppeteer's\
    \ approach**\n\nPuppeteer doesn't need to think in terms of cross-browser support.\
    \ Although there are \n\nsome efforts to run Puppeteer on Firefox, the focus is\
    \ on grabbing all the developer \n\ntools that Chromium has and making them available\
    \ to the user. With this goal in mind, \n\nPuppeteer can access way more tools\
    \ than those exposed by the WebDriver API that \n\nSelenium uses.\n\nThe difference\
    \ in how they communicate with the browser is also reflected in the APIs. \n\n\
    Puppeteer provides an API that will help us take advantage of all the power of\
    \ Chromium. \n\nI think it's important to highlight that Puppeteer was created\
    \ in JavaScript, so the API will \n\nfeel more natural than Selenium's, which\
    \ comes from a cross-language philosophy.\n\nPuppeteer doesn't need to ask anybody\
    \ to implement the API because it takes advantage \n\nof the headless capability\
    \ of Chromium. Let's now see what headless browsers are.\n\n**Introducing Headless\
    \ browsers**\n\nWhat is a headless browser? No, it's not something from a horror\
    \ movie. **A headless **\n\n**browser is a browser that you can launch and interact\
    \ with using a particular protocol **\n\n**over a particular communication transport,\
    \ with no UI involved**. This means that \n\nyou will have one active process\
    \ (or many processes, as we know how browsers are these \n\ndays), but there will\
    \ be no \"window\" for you to interact with the browser. I think that \n\n\"windowless\
    \ browser\" would have been a more accurate name."
  merge: -1
  pgno: 19
- img_proc: true
  md: "Introducing Headless browsers 5\n\n**Available headless browsers**\n\nBoth\
    \ Chromium and Firefox support headless browser mode. It's important to mention\
    \ \n\nthat, at the time of writing this book, Firefox's headless mode was still\
    \ experimental. \n\nThat might sound bad, compared with the six browsers Selenium\
    \ offers (https://www.\n\nhardkoded.com/ui-testing-with-puppeteer/selenium-browsers),\
    \ \n\nbut, as you might have noticed, I didn't say Chrome, I said Chromium. Chromium\
    \ is \n\nthe engine Chrome uses under the hood. But Chrome is not the only browser\
    \ using \n\nChromium; in the past few years, many browsers have started to use\
    \ the chromium \n\nengine. These are a few examples of chromium-based browsers:\n\
    \n• Google Chrome\n\n• Microsoft Edge, a.k.a. Edgium, to avoid confusion with\
    \ the previous version of \n\nMicrosoft Edge based on Trident\n\n• Opera\n\n•\
    \ Brave\n\nThat's much better. We can automate at least five browsers. But there\
    \ are two major \n\nbrowsers with no headless support: Microsoft Internet Explorer\
    \ and Safari. The case \n\nof Safari is interesting. In the same way that Chromium\
    \ is the engine behind Chrome, \n\nWebkit is the engine of Safari and, although\
    \ Safari doesn't support headless mode, there \n\nare a few Webkit builds created\
    \ for testing purposes with headless support. Microsoft \n\nPlaywright has its\
    \ own Webkit build to support cross-browser automation.\n\nDo you want to see\
    \ a headless browser for the very first time?\n\nLet's try this out:\n\nIf you\
    \ have Chrome installed, grab the full path of the executable and pass these command\
    \ \n\narguments: \\--headless --remote-debugging-port=9222 --crash-dumps-\n\n\
    dir=/tmp:\n\n**~ % /Applications/Google\\\\ Chrome.app/Contents/MacOS/Google\\\
    \\ **\n\n**Chrome --headless --remote-debugging-port=9222 --crash-dumps-**\n\n\
    **dir=/tmp**"
  merge: -1
  pgno: 20
- img_proc: true
  md: "6 Getting started with Puppeteer\n\n**Tip**\n\nIf you are a macOS user, the\
    \ Chrome executable will be inside the \"Google \n\nChrome.app\" pseudo-file.\
    \ As you can see, it's: \"Google Chrome.app/\n\nContents/MacOS/Google Chrome\"\
    .\n\nAfter executing that command, you should get something like this in the console:\n\
    \n**DevTools listening on ws://127.0.0.1:9222/devtools/browser/**\n\n**e7e52f93-8f1e-491c-b718-94ae7a8e81b7**\n\
    \nNow we have a headless chrome browser waiting for commands through a WebSocket\
    \ on \n\nws://127.0.0.1:9222.\n\nFirefox also provides a headless mode:\n\n**~\
    \ % /Applications/Firefox.app/Contents/MacOS/firefox --headless**\n\n**\\*\\*\\\
    * You are running in headless mode.**\n\nIt doesn't say much, but trust me, now\
    \ we have a Firefox browser running in \n\nheadless mode.\n\nAs I mentioned before,\
    \ a headless browser doesn't have a UI. The only way to interact with \n\nthe\
    \ browser is to use the transport the browser created, in this case, a WebSocket,\
    \ and to \n\nsend messages using some kind of protocol. In the case of Chromium\
    \ and Firefox, it's the \n\nChromium DevTools Protocol.\n\n**The Chromium DevTools\
    \ Protocol**\n\nIf you are a web developer, I'm 100% sure you have used Chrome\
    \ DevTools. If you don't \n\nknow what I'm talking about, you can open DevTools\
    \ by clicking on the three dots button \n\nin the top-right corner, and then go\
    \ to More Tools > Developer Tools. You will \n\nget something like this:"
  merge: -1
  pgno: 21
- img_proc: true
  md: "Introducing Headless browsers 7\n\nChrome DevTools\n\nIt's impressive all the\
    \ things you can accomplish using this fantastic tool:\n\n• Inspect the DOM.\n\
    \n• Evaluate CSS styles.\n\n• Run JavaScript code.\n\n• Debug JavaScript code.\n\
    \n• See network calls.\n\n• Measure performance.\n\nAnd the good news is that\
    \ it's the **Chromium Developer Protocol** (which we'll call \n\n**CDP** from\
    \ now on) that drives most of the DevTools' features. And that same CDP is the\
    \ \n\nprotocol that headless browsers use to interact with the outside world.\n\
    \nCDP sounds perfect. We can interact with the browser and do all the things I\
    \ have \n\nmentioned. You can create a Node.JS app to launch a browser and start\
    \ sending CDP \n\nmessages through a WebSocket, but that would be quite complex\
    \ and hard to maintain. \n\nThat's where Puppeteer comes to the rescue and offers\
    \ a human-friendly interface to \n\ninteract with the browser.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_22_0.png)"
  merge: -1
  pgno: 22
- img_proc: true
  md: "8 Getting started with Puppeteer\n\n**Introducing Puppeteer**\n\nPuppeteer\
    \ is nothing more, and nothing less, than a Node.js package that knows how to\
    \ \n\nopen a browser, send commands, and react to messages coming from that browser.\
    \ At the \n\ntime of writing this book, Puppeteer supports Chromium and Firefox,\
    \ but Firefox support \n\nis still considered experimental. I think it's a good\
    \ time for you to go to the Puppeteer \n\nrepository (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \npuppeteer-repo) and check whether things have changed since then.\n\nThere are\
    \ also some community projects that implement Puppeteer in other languages. \n\
    \nYou will find Puppeteer-Sharp (https://www.hardkoded.com/ui-testing-\n\nwith-puppeteer/puppeteer-sharp)\
    \ for .NET or Pyppeteer (https://www.\n\nhardkoded.com/ui-testing-with-puppeteer/pypeteer)\
    \ for Python.\n\nWhen you use Puppeteer, you are, in fact, using more than just\
    \ a JavaScript library. Many \n\npeople call this the \"Puppeteer pyramid\":\n\
    \n The Puppeteer pyramid\n\nThe Puppeteer pyramid consists of three components:\n\
    \n• The headless browser is the engine that will run the pages we want to automate.\n\
    \n• The Chromium DevTools Protocol allows any external user to interact with the\
    \ \n\nbrowser.\n\n• Puppeteer provides a JavaScript API to interact with the browser\
    \ using the CDP.\n\nWhat I find valuable about Puppeteer is that its model clearly\
    \ represents the browser \n\nstructure:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_23_0.png)"
  merge: -1
  pgno: 23
- img_proc: true
  md: "Introducing Headless browsers 9\n\n**The Puppeteer object model**\n\nPuppeteer\
    \ Model\n\nLet's see what these objects represent inside the browser.\n\n**Browser**\n\
    \nThe browser is the main class. It's the object created when Puppeteer connects\
    \ to \n\na browser. The keyword here is **connect**. The browser that Puppeteer\
    \ will use can be \n\nlaunched by Puppeteer itself. But it could also be a browser\
    \ that is already running on \n\nyour local machine, or it could even be a browser\
    \ running in the cloud, like Browserless.\n\nio (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nbrowserless).\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_24_0.png)"
  merge: -1
  pgno: 24
- img_proc: true
  md: "10 Getting started with Puppeteer\n\n**Browser context**\n\nA browser can contain\
    \ more than one context. A context is a browser session (not to be \n\nconfused\
    \ with a browser window). The best example is the Incognito Mode or private \n\
    \nmode, depending on the browser, which creates an isolated session inside the\
    \ same \n\nbrowser process.\n\n**Page**\n\nA page is a tab in a browser or even\
    \ a pop-up page.\n\n**Frame**\n\nThe frame object is more important than it looks.\
    \ Every page has at least one frame, which \n\nis called the main frame. Most\
    \ of the page actions we will learn across this book are, in \n\nfact, a call\
    \ to the main frame; for example, page.click calls mainframe.click.\n\nThe frame\
    \ is a tree. One page has only one main frame, but a frame can contain many \n\
    \nchild frames.\n\n**Worker**\n\nA worker is a model that interacts with Web Workers.\
    \ This is not a feature we will talk \n\nabout in this book.\n\n**Execution context**\n\
    \nThe execution context is a mechanism Chromium uses to isolate the page from\
    \ the \n\nbrowser extensions. Each frame will have its own execution context.\
    \ Internally, all the \n\nframe functions that involve executing JavaScript code\
    \ will use an execution context to \n\nrun the code inside the browser.\n\nThere\
    \ are other objects involved, such as ElementHandles and JSHandles, but we are\
    \ \n\ngoing to talk about them later in the book. \n\nNow that we know some of\
    \ the differences between Selenium and Puppeteer, it's a perfect \n\nmoment to\
    \ review many possible use cases for Puppeteer.\n\n**Puppeteer use cases**\n\n\
    Remember, the main difference between Puppeteer and Selenium is that Selenium\
    \ \n\nis designed for end-to-end testing. In contrast, Puppeteer is designed as\
    \ an API to exploit \n\nall the power of the DevTools, which means that besides\
    \ end-to-end tests, there are also \n\nother use cases where you can use Puppeteer,\
    \ as we will see now."
  merge: -1
  pgno: 25
- img_proc: true
  md: "Puppeteer use cases 11\n\n**Task Automation**\n\nThere are many things we do\
    \ on the web that you can automate. For example, you can \n\ndownload a report,\
    \ fill in a form, or check flight prices. You might also want to check \n\nyour\
    \ website's health, monitor its performance, or check whether your website is\
    \ working \n\ncorrectly. In *Chapter 6, Executing and Injecting JavaScript*, we\
    \ will see how to use Checkly \n\nto monitor your website in production.\n\n**Web\
    \ Scraping**\n\nMost library authors won't like to say that you can use their\
    \ library to do web scraping. \n\nWeb Scraping has a reputation for being illegal.\
    \ But in *Chapter 9, Scraping tools*, we will \n\nsee how to do web scraping in\
    \ the right way, without getting banned or sued.\n\n**Content generation**\n\n\
    Generating content is not a use case that would come to your mind if you had to\
    \ think \n\nabout possible use cases. But Puppeteer is a great tool for generating\
    \ two kinds of content:\n\n• ** Screenshots**: Why would you need to take screenshots\
    \ using an app? Think about \n\nthumbnails or previews. Imagine you want to create\
    \ a paywall, showing part of \n\nyour website content but as a blurred image.\
    \ You could use Puppeteer to take \n\na screenshot of your site, blur it, and\
    \ use that image. \n\n• ** PDF files**: Invoices are a great example of PDF generation.\
    \ Imagine you have \n\nan e-commerce site. When the user makes a purchase, you\
    \ show them a nice, \n\nwell-designed invoice, but you need to send them that\
    \ exact invoice by email. You \n\ncould use Puppeteer to navigate to that invoice\
    \ page and print it to PDF. You could \n\nalso use your landing page to generate\
    \ a PDF and use it as a brochure.\n\nIn *Chapter 7*, *Generating Content with\
    \ Puppeteer*, we will talk about this use case and how \n\nto use screenshots\
    \ to write UI regression tests.\n\n**End-to-end testing**\n\nI think Puppeteer\
    \ is great for testing modern web apps because it's close to the browser. \n\n\
    The API feels great, modern, and is designed for the JavaScript developer. It\
    \ lets you \n\nexecute JavaScript code easily and gives you access to all the\
    \ power of Chromium. But \n\nI also have to say that Selenium's tolling for end-to-end\
    \ testing is impressive. Puppeteer \n\nis not even close to what Selenium offers\
    \ with its Selenium Grid. It's up to you to decide \n\nwhich is the right tool\
    \ for you.\n\nEnough with the theory. It's time to get started and set up our\
    \ environment."
  merge: -1
  pgno: 26
- img_proc: true
  md: "12 Getting started with Puppeteer\n\n**Setting up the environment**\n\nWhat's\
    \ good about Node.js and Puppeteer is that they are cross-platform. My local \n\
    \nenvironment is macOS Catalina 10.15.6. But you won't see much difference if\
    \ you use \n\na Windows or a Linux environment.\n\nTime is a tech book's worst\
    \ enemy. At the time of writing this book, I was using Node.\n\nJS 12.18.3 and\
    \ Puppeteer 7. I'm pretty sure that by the time you read this book, new \n\nversions\
    \ will have come to light. But don't feel discouraged about that; we expect that\
    \ to \n\nhappen. That's why I encourage you to go now and take a look at the GitHub\
    \ repository \n\nof this book (https://github.com/PacktPublishing/ui-testing-with-\n\
    \nPuppeteer). If you see that something is not working or has changed, please\
    \ create an \n\nissue on that repository. We will try to keep it updated.\n\n\
    We only need two things to run our first Puppeteer code: Node.JS and Puppeteer.\
    \ Let's \n\nbegin with Node.JS.\n\n**Node.js**\n\nFor the purposes of this book,\
    \ the only thing you need to know about Node.js is that it's \n\na runtime that\
    \ allows us to run JavaScript code outside the browser.\n\nIt's important to highlight\
    \ that the website we want to automate doesn't necessarily need \n\nto run on\
    \ Node.js. You wouldn't need to know the language used to write the website, nor\
    \ \n\nthe platform that the website is running, but if you get to know those details,\
    \ that could \n\ngive you some ideas to write better automation code. For instance,\
    \ if you know that the \n\nsite is an ASP.NET Webforms project, you will know\
    \ that it uses some hidden inputs to \n\nperform postbacks. That becomes more\
    \ evident if you know the client-side frameworks, \n\nsuch as Vue or React. \n\
    \nAs I mentioned before, we will install Node.JS v12.18.3 (or higher). The process\
    \ is quite \n\nsimple:\n\n1\\. Go to the official site: https://nodejs.org/.\n\
    \n2\\. Download the LTS version. **LTS** stands for **Long-Term Support**."
  merge: -1
  pgno: 27
- img_proc: true
  md: "Setting up the environment 13\n\n3\\. Run the installer as you would typically\
    \ do on your platform:\n\nNode.js setup\n\nIf you want to see whether the installation\
    \ was successful, you can open a terminal and \n\nexecute node --version:\n\n\
    **~ % node --version**\n\n**v12.18.3**\n\n**Visual Studio Code**\n\nYou don't\
    \ need any special code editor to write a Node.js app. But Visual Studio Code\
    \ is \n\na great editor. It's free, cross-platform, and you can use it not only\
    \ to code JavaScript, but \n\nalso to code in many other languages as well.\n\n\
    ![](img/a12c4f728acd6f69fe58d97e7f64e4f5_28_0.png)"
  merge: -1
  pgno: 28
- img_proc: true
  md: "14 Getting started with Puppeteer\n\nYou can download it at https://code.visualstudio.com/.\
    \ It doesn't even require \n\nrunning a setup on macOS. It's just an app you copy\
    \ to your Applications folder:\n\nVisual Studio Code\n\nNow that we have Node.js\
    \ installed along with a code editor, we can create our first app. \n\n**Our first\
    \ Puppeteer code**\n\nWe first need to create a folder where our hello-puppeteer\
    \ project will be located. \n\nI'm going to use a terminal, but you can use whatever\
    \ you feel more comfortable with. \n\nOur project will be called hello-puppeteer:\n\
    \n**\\> mkdir hello-puppeteer**\n\n**\\> cd hello-puppeteer**\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_29_0.png)"
  merge: -1
  pgno: 29
- img_proc: true
  md: "Our first Puppeteer code 15\n\nWe now need to initialize this brand-new node.js\
    \ application. We create new applications \n\nin node.js using the npm init command.\
    \ In this case, we will pass the \\-y argument, so \n\nit creates our app using\
    \ default values:\n\n**\\> npm init -y**\n\n**Wrote to /Users/neo/Documents/Coding/hello-puppeteer/package.**\n\
    \n**json:**\n\n**{**\n\n** \"name\": \"hello-puppeteer\",**\n\n** \"version\"\
    : \"1.0.0\",**\n\n** \"description\": \"\",**\n\n** \"main\": \"index.js\",**\n\
    \n** \"scripts\": {**\n\n** \"test\": \"echo \\\\\"Error: no test specified\\\\\
    \" && exit 1\"**\n\n** },**\n\n** \"keywords\": \\[\\],**\n\n** \"author\": \"\
    \",**\n\n** \"license\": \"ISC\"**\n\n**}**\n\nThis output doesn't say much. It\
    \ shows us that it has created a package.json file with \n\nsome default values.\
    \ Now, I will create an index.js file using the touch command. \n\nAgain, you\
    \ can perform this action in the way you feel most comfortable:\n\n**\\> touch\
    \ index.js**\n\nTouch should have created the entry point of our app. But before\
    \ coding our app, we need \n\nto install Puppeteer.\n\n**Installing Puppeteer**\n\
    \nMost frameworks, if not all of them, have a way to publish and reuse components\
    \ from \n\ndifferent authors. The most popular package manager in Node.js is **NPM**\
    \ (https://\n\nwww.npmjs.com/). Does that sound familiar? We used npm init to\
    \ create our app. \n\nAs Puppeteer is a package published in NPM, we can download\
    \ and install it using the \n\nnpm install command."
  merge: -1
  pgno: 30
- img_proc: true
  md: "16 Getting started with Puppeteer\n\nIf you don't want to jump between apps,\
    \ you can open a terminal inside Visual Studio \n\nCode. If you are still in the\
    \ terminal, you can open Visual Studio Code using the following \n\ncommand:\n\
    \n**\\> code .**\n\nThat will open Visual Studio Code. Once there, you will be\
