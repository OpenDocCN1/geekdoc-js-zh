  md: "Waiting for the page to load 125\n\nGoing back to the Mango page. Waiting for\
    \ the load event gives us all the content from \n\nthe page:\n\nPage after load\n\
    \nThe background video is not there yet. And the subscribe popup didn't show up.\
    \ But if we \n\nwant to interact with the menu bar, use the login action, or test\
    \ the cookies banner, the \n\npage is ready.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_140_0.png)"
  merge: -1
  pgno: 140
- img_proc: true
  md: "126 Waiting for elements and network calls\n\nIt would be hard to find a page\
    \ where networkidle0 and networkidle2 behave \n\ndifferently that you have to\
    \ pick between one or the other. In this case, we'll get an almost \n\ncomplete\
    \ page:\n\nPage using networkidle0 and networkidle2\n\nThe video is not being\
    \ played yet, so if you want to take screenshots or generate PDF files, \n\nas\
    \ we will see in *Chapter 7*, *Generating Content with Puppeteer*, this won't\
    \ be enough. But \n\nwe could say it's ready to be tested.\n\nSo, which one is\
    \ better? Should we play safe and use networkidle0 all the time? \n\nShouldn't\
    \ that be the default then?\n\nHere's where we need to find a balance. We could\
    \ just wait 10 seconds between actions, \n\nand we wouldn't have any flaky tests.\
    \ But, if you have 1,000 tests (remember, you will have \n\nover 1,000 tests)\
    \ with 10 actions each, that would mean that the entire test suite would \n\n\
    take almost 14 hours to run. \n\n*To reduce flakiness, we need to find a balance\
    \ between waiting for too long and going *\n\n*too fast.*\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_141_0.png)"
  merge: -1
  pgno: 141
- img_proc: true
  md: "Waiting for elements 127\n\nSometimes getting the DOM from the server will\
    \ be enough. If we were testing Wikipedia, \n\nour links would be ready for us\
    \ on the DOMContentLoaded event. If we want to test our \n\nhome page and we wait\
    \ for DOMContentLoaded, images won't be ready yet, but we will \n\nget the stock\
    \ and price values from the server. We don't need more than that.\n\nSetting the\
    \ right waitUntil will make your code less flaky, but unless you test a simple\
    \ \n\nsite such as Wikipedia, that won't be enough.\n\nThe most effective way\
    \ to make your code stable is by waiting for the element we want to \n\ninteract\
    \ with.\n\n**Waiting for elements**\n\nBefore acting on an element, you need to\
    \ make sure of two things: first, that the element \n\nis there, it exists in\
    \ the DOM; and second, you can act on that element. In other words, it's \n\n\
    visible to the user. Let's see how we can wait for our element to be ready.\n\n\
    You should wait for a selector after some kind of network call. You goto a page,\
    \ wait for \n\na selector, and then you act. You click on a button, wait for a\
    \ selector, and then you act.\n\nIn some cases, the selector you need to wait\
    \ for is easy to find. On our login page, we need \n\nto wait for the user name\
    \ input. In other cases, such as our home page, we would need to \n\nwait for\
    \ the div element containing all the products. It's just a little bit more complicated\
    \ \n\nbut still straightforward.\n\nBut what if we want to test Mango's newsletter\
    \ popup? Maybe the pop-up HTML is on \n\nthe page, but it's not visible. Here's\
    \ where I start to consider waiting as a kind of art. It's \n\nnot just about\
    \ automating a page. It's not only about the tool. You need to find the right\
    \ \n\nselectors to make your automation code stable.\n\nWe have two functions\
    \ that will help us wait for elements: waitForSelector \n\nand waitForXPath. Both\
    \ functions have a similar signature. \n\nwaitForSelector(selector, \\[options\\\
    ]) expects a CSS selector and an \n\noptions object. waitForXPath(XPath, \\[options\\\
    ]) expects an XPath expression \n\nand an options object.\n\nThese are the available\
    \ properties you will be able to set in the options argument:\n\n•  timeout: We\
    \ will find this option in all wait functions. We don't want our tests to \n\n\
    get stuck. This is another cause of flaky tests. If the timeout is reached, the\
    \ promise \n\nwill be rejected. If we don't pass a timeout, the function will\
    \ use the timeout set \n\nusing page.setDefaultTimeout(timeout). If setDefaultTimeout\
    \ \n\nwasn't used, it will default to **30 seconds**."
  merge: -1
  pgno: 142
- img_proc: true
  md: "128 Waiting for elements and network calls\n\n•  visible: If visible is set\
    \ to true, Puppeteer will not only check that the \n\nelement exists in the DOM\
    \ but that it is also visible. We would need to use that in \n\nour newsletter\
    \ popup. This check won't be performed by default. And, again, it's \n\nsomething\
    \ you might want to check or not, depending on your scenario.\n\n•  hidden: If\
    \ hidden is set to true, Puppeteer will check if the element is not visible \n\
    \nor if the element is not in the DOM. This option is useful when you need to\
    \ deal \n\nwith loading animations. You know that the page is reading when the\
    \ loading \n\nanimation is hidden. Twitter.com is a great example:\n\nLoading\
    \ animation on Twitter.com\n\nBoth waitForSelector and waitForXPath will return\
    \ a promise that can resolve \n\nto the following:\n\n• An ElementHandle: This\
    \ element handle will be the element that eventually \n\nmatches the CSS selector\
    \ or the XPath.\n\n• Null: When hidden is set to true, and the element was not\
    \ found in the DOM.\n\nThere are four approaches to waiting for elements. It's\
    \ not about which one is the best. \n\nThese approaches will help you in different\
    \ scenarios.\n\n**Await a wait function**\n\nYou will find the code used in this\
    \ section in the stackoverflow.tests.js file.\n\nIf we go to Stack Overflow (https://stackoverflow.com/questions),\
    \ we will \n\nfind that there are job postings on the right of the page. But as\
    \ we can see, that's loaded \n\nafter the page.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_143_0.png)"
  merge: -1
  pgno: 143
- img_proc: true
  md: "Waiting for elements 129\n\nListing while loading and list once loaded\n\n\
    Let's say that we want to test that the page has a list of jobs by default.\n\n\
    We could just grab the LI elements using $$ and then check whether the list is\
    \ empty \n\nor not:\n\nconst jobs = await page.$$('.jobs li');\n\nexpect(jobs).not.be.empty;\n\
    \nHonestly, this will work most of the time using a decent network, but it could\
    \ also get \n\nflaky. What we need to do is wait for the elements to be loaded\
    \ before checking that list. \n\nWhat we could do is call the waitForSelector\
    \ function before calling $$:\n\nawait page.waitForSelector('.jobs li');\n\nconst\
    \ jobs = await page.$$('.jobs li');\n\nexpect(jobs).not.be.empty;\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_144_0.png)"
  merge: -1
  pgno: 144
- img_proc: true
  md: "130 Waiting for elements and network calls\n\nAs I mentioned before, waitForSelector\
    \ returns an ElementHandle. \n\nIt usesdocument.querySelector. That's why we can't\
    \ use the result of \n\nwaitForSelector.\n\nBut if we wanted to check whether\
    \ the title is **\"jobs near you\"**, we could use the result \n\nof the waitForSelector\
    \ function:\n\nconst title = await page.waitForSelector('#hireme .header \n\n\
    .grid--cell.fl1');\n\nexpect(await title.evaluate(e => e.innerText)) \n\n.to.contain('job');\n\
    \nI think that's the second time I have used the evaluate function. Patience –\
    \ that will \n\ncome in the next chapter.\n\nIn case you are wondering why we\
    \ didn't use the result of waitForSelector in \n\nthe job listing example, it\
    \ turns out that waitForSelector uses document.\n\nquerySelector to evaluate the\
    \ CSS expression. That will make waitForSelector \n\nreturn only one item.\n\n\
    The same happens with waitForXpath. Unlike $x, that returns an array of elements.\
    \ \n\nwaitForXpath will return only one element.\n\nwaitForSelector and waitForXPath\
    \ will save your day most of the time, but there \n\nare other scenarios we might\
    \ want to consider. For instance, we might need to check \n\nnetwork calls. We\
    \ might want to wait for a request to be made or for a response to be \n\nreceived.\
    \ Let's see how to accomplish that.\n\n**Waiting for network calls**\n\nIn *Chapter\
    \ 3*, *Navigating through a website*, we talked about **requests** and **responses**.\
    \ Every \n\npage navigation begins with a request to a page. The server then processes\
    \ that request and \n\nsends a response. That response generally is an HTML page,\
    \ which has resources declared \n\nthat need to be requested. The server will\
    \ process each of those requests again and send \n\nmany responses.\n\nBut that's\
    \ not all. Modern apps will send requests to the server based on user actions.\
    \ Take \n\n*Google Maps*: the user moves the mouse, and the page will need to\
    \ request a new picture \n\nof the map without reloading the entire page."
  merge: -1
  pgno: 145
- img_proc: true
  md: "Waiting for network calls 131\n\nWe don't work on the *Google Maps* teams,\
    \ but many users have reported that the home \n\npage sometimes doesn't load the\
    \ product image after login. So, we could write a test to \n\ncheck that *it should\
    \ load an image*. Oh… you thought we were going to test *Google Maps*? \n\nNot\
    \ this time, sorry.\n\nIn this case, we can use waitForResponse(urlOrPredicate,\
    \ \\[options\\]). Let's \n\nunpack these arguments:\n\n•  urlOrPredicate can be\
    \ a string with the URL we want to wait for. But it can \n\nalso be a function.\
    \ This should be a function expecting a response, which will be the \n\nresponse\
    \ you will want to check and return a truthy value.\n\n• The only option we have\
    \ in this function is timeout. This property has the same \n\nconditions as the\
    \ one in waitForSelector: If not passed, Puppeteer will use \n\npage.setDefaultTimeout(timeout),\
    \ and if that function wasn't used, the \n\ndefault will be 30 seconds.\n\nLet's\
    \ write our test. We need to log in and wait for the product image. To accomplish\
    \ this, \n\nwe are going to use the **Arrange, Act, Await** approach.\n\n**Arrange,\
    \ Act, Await**\n\nThis name comes from the arrange, act, assert pattern we talked\
    \ about in *Chapter 4*, \n\n*Interacting with a page*.\n\nWith this pattern, we\
    \ try to prevent **race conditions**, a common issue in async \n\nprogramming,\
    \ and a cause of flakiness. A race condition in async programming is \n\nwhen\
    \ you are trying to do two or more tasks simultaneously, and the speed of one\
    \ task \n\n(too fast or too slow) causes another task to never complete.\n\nLet's\
    \ take, for instance, this test:\n\nawait loginModel.go();\n\nawait loginModel.login(config.username,\
    \ config.password);\n\nawait page.waitForResponse(config.productImage);\n\nFirst,\
    \ notice something. We are not using asserts. The fact that the waitForResponse\
    \ \n\npromise resolves is enough for us to know that the test was successful."
  merge: -1
  pgno: 146
- img_proc: true
  md: "132 Waiting for elements and network calls\n\nAnother important concept here\
    \ is that waitForReponse doesn't behave in the \n\nsame way as waitForSelector.\
    \ When we use waitForSelector, the function \n\nwill resolve when the element\
    \ we are waiting for is already in the DOM. But with \n\nwaitForResponse, if the\
    \ response we are waiting for has already happened, our \n\nwaitForResponse will\
    \ time out.\n\nOur code there has a risk of flakiness. If our server is too fast\
    \ serving the page after login, \n\nthe image might have already been served before\
    \ we wait for it. To solve that, we need to \n\nget the promise first, and then\
    \ await it. This is how we could change our code:\n\nawait loginModel.go();\n\n\
    const promise = page.waitForResponse(config.productImage);\n\nawait loginModel.login(config.username,\
    \ config.password);\n\nawait promise;\n\nNotice that instead of awaiting the promised\
    \ returned by waitForResponse, we are \n\nassigning that promise to a variable.\
    \ We call waitForResponse, we keep that promise, \n\nthen we act (log in). After\
    \ that, we await that promise, hoping that it will be resolved at \n\none point\
    \ after the login action is complete. You can find this test in the login.tests.\n\
    \njs file. There, the test is called Should load image after login.\n\nIn the\
    \ same way that we use waitForResponse, we can use waitForRequest.\n\nWe would\
    \ use waitForRequest instead of waitForResponse if we wanted to \n\ncheck whether\
    \ the browser is sending a request to the server. As this function also expects\
    \ \n\na predicate, a function, as an argument, we can check not only for the URL\
    \ but also \n\nthe content of the request.\n\nLet's say that we work at The Weather\
    \ Channel (https://weather.com/). We want \n\nto check that the browser is sending\
    \ our location. We found that the page is calling \n\nredux-dal. We want to wait\
    \ for that request, parse the **payload** (the data sent to the \n\nserver), and\
    \ validate that it has a geocode object inside the params object."
  merge: -1
  pgno: 147
- img_proc: true
  md: "Waiting for network calls 133\n\nThe weather channel\n\nWe are going to solve\
    \ this using the **fire and forget** approach.\n\n**Fire and forget**\n\nYou will\
    \ find the code used in this section in the weather.tests.js file.\n\nWe call\
    \ it a \"fire and forget\" when we call a function that returns a promise but\
    \ we don't \n\nawait that promise, and we don't even care about the result of\
    \ that promise. \"Fire and \n\nforget\" is a military term that refers to a type\
    \ of missile that does not require further \n\nguidance after launch. In our case,\
    \ our missiles are Promises that we launch, but we don't \n\ncare about the outcome\
    \ of them. \n\nLet's see how a fire and forget approach would look:\n\nconst promise\
    \ = page.waitForRequest(r => r.url().\n\nincludes('redux-dal'));\n\npage.goto('https://weather.com/');\n\
    \nconst request = await promise;\n\nconst json = JSON.parse(request.postData());\n\
    \nexpect(json\\[0\\].params.geocode).not.be.empty;\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_148_0.png)"
  merge: -1
  pgno: 148
- img_proc: true
  md: "134 Waiting for elements and network calls\n\nThere are many new things to\
    \ learn here.\n\nWe fire and forget the goto action. We call goto, but we don't\
    \ wait for it to finish. Doing \n\na fire and forget means that we won't care\
    \ if the promise resolves or fails. In this case, we \n\ncare about the request\
    \ promise. If goto fails, the waitForRequest will fail, and the \n\ntest will\
    \ fail. \n\nThe second new feature we can see here is that we are waiting for\
    \ a request using a \n\npredicate, a function that expects a request and returns\
    \ a truthy value: r => r.url().\n\nincludes('redux-dal').\n\nThe last thing we\
    \ can learn here is that we are working with the request resolved by the \n\n\
    waitForRequest promise. Once we get the request, we extract the payload using\
    \ \n\npostData, parse it, and evaluate the content.\n\nThe last feature we have\
    \ to handle network calls is waitForNavigation. Imagine \n\nwaitForNavigation\
    \ as the goto function without the URL argument. It's \n\nwaitForNavigation(\\\
    [options\\]). The options are the same options goto has. We \n\ncan use this function\
    \ to wait for navigation triggered by one action we perform.\n\nLet's take, for\
    \ example, the Packtpub site (https://www.packtpub.com/). We want \n\nto search\
    \ for a book, press *Enter*, and wait for the page to be redirected to the results\
    \ page.\n\nFor this test, we are going to use our fourth approach: Promise.all.\n\
    \n**Promise.all**\n\nYou will find the code used in this section in the packpub.tests.js\
    \ file.\n\nDepending on the scenario, Promise.all could be a shortcut for Act,\
    \ Arrange, Await. \n\nIn fact, I would keep the latter for more complex scenarios\
    \ and use Promise.all if I \n\nneed to wait for two tasks at the same time.\n\n\
    Our test code would look like this with a Promise.all:\n\nawait page.goto('https://www.packtpub.com/');\n\
    \nconst search = await page.$('#search');\n\nawait search.type('Puppeteer');\n\
    \nawait Promise.all(\\[\n\n page.waitForNavigation(),\n\n search.press('Enter')\n\
    \n\\]);\n\nconst textResult = await page.$eval('\\[data-ui-id=\"page-title-"
  merge: -1
  pgno: 149
- img_proc: true
  md: "Waiting for page events 135\n\nwrapper\"\\]', e => e.innerText);\n\nexpect(textResult).to.be.equal(\\\
    `Search results for: \n\n'Puppeteer'\\`);\n\nThe first part is pretty straightforward.\
    \ We go to the site, get the search input, and type \n\n\"Puppeteer.\" But then,\
    \ we wait for two Promises in the same await statement. We wait \n\nfor navigation\
    \ to be completed and the press function.\n\nAlthough it would be quite weird\
    \ getting a race condition inside a Promise.all, I feel \n\nsafer adding the wait\
    \ function as the first argument of the all function.\n\nAs I mentioned in *Chapter\
    \ 1*, *Getting started with Puppeteer*, Promise.all will wait for \n\nall promises\
    \ to finish. It will also resolve as soon as one promise fails.\n\nNow we know\
    \ how to wait for elements and network calls. But let me tell you a little \n\n\
    secret: waitForRequest and waitForResponse are just wrappers around the \n\nrequest\
    \ and response events the page offers. Puppeteer would create a Promise, start\
    \ \n\nlistening to an event, and then resolve the Promise when a condition is\
    \ met. The good \n\nnews is that we can use this same approach to wait for many\
    \ other events. \n\n**Waiting for page events**\n\nEvents are messages that a\
    \ class sends when something happens. As a consumer, you can \n\n**attach** a\
    \ function to those events, so you can listen to those events and react accordingly.\
    \ \n\nYou can find the code examples of these demos in the page-event-demos.js\
    \ file \n\ninside the Chapter5 directory. To run that demo, you just need to run\
    \ node \n\npage-event-demos.js.\n\nThis is how you could listen to responses without\
    \ the waitForResponse:\n\npage.on('response', response => \n\n console.log('Response\
    \ URL: ' + response.url()));\n\nawait page.goto('https://www.packtpub.com/');\n\
    \nIn the first line, we say that we want to listen to the response event, and\
    \ when a new \n\nresponse arrives, we want to print the URL in the console. Then,\
    \ we call the goto \n\nfunction, and all the responses will start being written\
    \ in the console."
  merge: -1
  pgno: 150
- img_proc: true
  md: "136 Waiting for elements and network calls\n\nUsing the arrow (\\=>) is a simple\
    \ way to write single-line functions. But, if you open \n\na bracket, you can\
    \ write more complex functions, like the following:\n\npage.on('response', response\
    \ => {\n\n if(response.request().resourceType() === 'image') {\n\n console.log('Image\
    \ URL: ' + response.url());\n\n }\n\n});\n\nawait page.goto('https://www.packtpub.com/');\n\
    \nIf you want to reuse a function, you can pass a function there:\n\nconst listenToImages\
    \ = response => {\n\n if(response.request().resourceType() === 'image') {\n\n\
    \ console.log('Image URL from function: ' + response.url());\n\n }\n\n};\n\npage.on('response',\
    \ listenToImages);\n\nAs you can see, we can create a function, assign it to a\
    \ variable – in this case, \n\nlistenToImages – and then pass it to the page.on\
    \ function. If you pass a function, \n\nyou will be able to remove that listener:\n\
    \npage.removeListener('response', listenToImages);\n\nThe removeListener function\
    \ will detach the listenToImages function from the \n\nresponse event.\n\nThere\
    \ is one more feature to add to your toolbox. You can listen to an event only\
    \ once, \n\nusing – you guessed it – once:\n\npage.once('response', r => console.log(r.url()));\n\
    \nonce will attach your function to an event and remove it as soon as the first\
    \ event arrives. \n\nNotice that once won't evaluate the result of your function.\
    \ You won't be able to prevent \n\nonce from removing your listener as soon as\
    \ the first event arrives."
  merge: -1
  pgno: 151
- img_proc: true
  md: "Waiting for page events 137\n\nWe can now try to make our own waitForResponse\
    \ function. We will use the \n\napproach we mentioned in *Chapter 1*, *Getting\
    \ started with Puppeteer*: *Fulfill our own *\n\n*promises*. We can create a promise,\
    \ and then we will resolve it when the condition we are \n\nwaiting for is met:\n\
    \nawait loginModel.go();\n\nconst promise = new Promise(resolve => \n\n page.on('response',\
    \ r => {\n\n if (r.url() === config.productImage) {\n\n resolve(r);\n\n }\n\n\
    \ }));\n\nawait loginModel.login(config.username, config.password);\n\nawait promise;\n\
    \nIn this code, we created a promise that will be resolved when the resolve function\
    \ \n\nis called. Inside that function, we attached to the response event and,\
    \ when the URL \n\nmatched, we called resolve passing that response.\n\nIn this\
    \ case, using the waitForResponse function will be easier. But there are events\
    \ \n\nthat don't have a waitFor function, and you will need to use this approach\
    \ to wait for \n\nthem. Let's see what page events we have available."
  merge: -1
  pgno: 152
- img_proc: true
  md: "138 Waiting for elements and network calls\n\n**The close event**\n\nThe close\
    \ event is triggered when the page is closed. These days, it's not so common \n\
    \nto have popups, mainly because they are not mobile-friendly. But we can still\
    \ find some \n\ncases. For instance, when you want to add an account to your existing\
    \ *Gmail* account. \n\nPopup in Gmail\n\nYou will need to listen to that page's\
    \ close event to know that the wizard process has \n\nfinished.\n\nBut that leaves\
    \ us with another question. How do you get to that page? If we are testing the\
    \ \n\n*Gmail* page and click on the **Create account** link, how do we get the\
    \ popup?\n\n**The popup event**\n\nThe page will trigger a popup event when it\
    \ opens a new tab or window. We could do \n\nsomething like this:\n\nconst \\\
    [newPage\\] = Promise.all(\\[\n\n new Promise(resolve => page.once('popup', resolve)),\n\
    \n page.click('someselector')\n\n\\]);\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_153_0.png)"
  merge: -1
  pgno: 153
- img_proc: true
  md: "Waiting for page events 139\n\nOne new thing we can learn here is that promise.all\
    \ returns an array of all the \n\nresponses. As we only care about the response\
    \ of the first promise, we create an array \n\nwith only one element \\[newPage\\\
    ]. \n\nIf you want to listen to new pages regardless of what triggered that new\
    \ page, you can also \n\nlisten to browser events.\n\n**Target created event**\n\
    \nThe targetcreated event is triggered when a new target (page) is created inside\
    \ the \n\nbrowser. We could do something like this:\n\nconst \\[newPage\\] = Promise.all(\\\
    [\n\n new Promise(resolve => browser.once('targetcreated', resolve \n\n)),\n\n\
    \ page.click('someselector')\n\n\\]);\n\nIn most scenarios, this will work in\
    \ the same way as the popup event. But it's good for \n\nyou to know that you\
    \ also have this tool available.\n\nLet's go back to page events.\n\n**The console\
    \ event**\n\nThe console event will be triggered every time a new line is printed\
    \ on the browser \n\nconsole. In the same way the response event gives us a response\
    \ object with all the \n\ninformation, the console event will give us a message\
    \ class with the following functions:\n\n•  text() with the text message.\n\n\
    •  type(), which will help us identify the type of the message. The most common\
    \ \n\ntypes are: 'log', 'debug', 'info', 'error,' and 'warning'.\n\n•  location(),\
    \ giving us the source of the message.\n\n• As console.log can expect objects\
    \ as arguments, we can access those element \n\nhandles with args(). \n\nYou can\
    \ use this event to check that there are no JavaScript errors during the test."
  merge: -1
  pgno: 154
- img_proc: true
  md: "140 Waiting for elements and network calls\n\n**The dialog event**\n\nThe dialog\
    \ event is important because dialogs stop the execution of a page. There are \n\
    \nmany types of dialogs, and each of them will require us to react differently.\
    \ We can know \n\nthe dialog type using the type() function. Let's take a look\
    \ at the different dialog types \n\nand how we can react to them.\n\n**The alert\
    \ type**\n\nAlert is a dialog with only an **OK** option. You can resume the execution\
    \ by calling \n\ndialog.accept():\n\nAlert\n\n**Confirm type**\n\nConfirm is a\
    \ dialog with an **OK** and a **Cancel** option. You accept the dialog with \n\
    \ndialog.accept() or dialog.dismiss() to cancel it:\n\nConfirm\n\n**The prompt\
    \ type**\n\nThe prompt dialog is not common these days. It's like the confirm\
    \ dialog but it prompts \n\nan input that you can pass by passing a string to\
    \ the accept function:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_155_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_155_1.png)"
  merge: -1
  pgno: 155
- img_proc: true
  md: "The headless recorder 141\n\nPrompt\n\n**The beforeunload type**\n\nYou will\
    \ see beforeunload these days, asking you if you want to leave the site without\
    \ \n\nsaving your changes. It works as a confirm dialog. You can interact with\
    \ this dialog in \n\nthe same way you would interact with the prompt dialog:\n\
    \nBefore unload dialog\n\nLet's wrap up this chapter with a new tool for our toolbox:\
    \ **the headless recorder**.\n\n**The headless recorder**\n\nThe headless recorder\
    \ is a Chrome extension developed by *Checkly* (https://www.\n\nchecklyhq.com/).\
    \ This extension will record the actions you perform on a page and \n\ngenerate\
    \ Puppeteer code based on those actions. I think it's a great tool to get a first\
    \ draft \n\nof a Puppeteer test, and from there, start working on the final code.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_156_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_156_1.png)"
  merge: -1
  pgno: 156
- img_proc: true
  md: "142 Waiting for elements and network calls\n\nYou can download this extension\
    \ by going to the Chrome Web Store (https://\n\nchrome.google.com/webstore) and\
    \ searching for Headless Recorder:\n\nHeadless Recorder\n\nOnce installed, you\
    \ will find a **recorder icon** at the top right of your browser. From there,\
    \ \n\nyou will have the **record button**, which will start to capture all the\
    \ actions you perform on \n\na page:\n\nRecord option\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_157_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_157_1.png)"
  merge: -1
  pgno: 157
- img_proc: true
  md: "The headless recorder 143\n\nOnce you finish performing your test actions,\
    \ you click **stop**, and you'll get the code \n\nalmost ready to be used:\n\n\
    Headless Recorder result\n\nI say almost ready because the recorder can't guess\
    \ your real intentions. It's just a guide. \n\nAs you can see there are selectors\
    \ such as .mb-3:nth-child(1) > .thumbnail > \n\n.card-body > .row > .col-6 > .btn.\
    \ The recorder doesn't know what your \n\nintentions are behind clicking on a\
    \ certain link. But it's a good start, and it can help you \n\nwhen your test\
    \ requires many steps.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_158_0.png)"
  merge: -1
  pgno: 158
- img_proc: true
  md: "144 Waiting for elements and network calls\n\n**Summary**\n\nIn this chapter,\
    \ we learned the concept of flaky tests, and we saw many techniques and \n\ntools\
    \ to prevent having flaky tests in our test suites.\n\nWhile we were learning\
    \ about these wait tools, we saw many page events without even \n\nnoticing them.\
    \ Now you can not only wait for selectors and network calls but you can also \n\
    \ndeal with dialogs and popups.\n\nThe last section was short, but as promised,\
    \ we now have another tool in our toolbox, \n\na headless recorder.\n\nIn the\
    \ next chapter, we will get into more advanced tools and learn how to execute\
    \ \n\nJavaScript in the browser."
  merge: -1
  pgno: 159
- img_proc: true
  md: "**6**\n\n**Executing and **\n\n**Injecting JavaScript**\n\nIn the past few\
    \ chapters, we learned about most of the basic Puppeteer features, from \n\ncreating\
    \ a browser and a page correctly, to finding elements and interacting with them.\n\
    \nNow it's time to get into more powerful tools. In this chapter, we will see\
    \ how Puppeteer \n\ngives us the ability to execute JavaScript code in the browser.\n\
    \nIt might sound like a hack or a last resort tool. Sometimes it is. But it is\
    \ also a tool that will \n\nhelp us perform actions that are not provided by the\
    \ Puppeteer API.\n\nThe communication between the code being executed on the Node\
    \ side and the \n\ncode being executed in the browser can sometimes be tricky.\
    \ We will learn how to \n\ncommunicate with both sides efficiently.\n\nAs we did\
    \ in the previous chapter, we will add another tool to our toolbox. We are going\
    \ \n\nto run our code on *Checkly*. \n\nWe will cover the following topics in\
    \ this chapter:\n\n• Executing JavaScript code\n\n• Manipulating handles with\
    \ JavaScript code"
