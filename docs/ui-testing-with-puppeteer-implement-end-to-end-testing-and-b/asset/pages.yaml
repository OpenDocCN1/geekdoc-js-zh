  md: "**3 **\n\n**Navigating through **\n\n**a website**\n\nWe have already laid\
    \ the foundations for the rest of the book. In *Chapter 1*, *Getting started *\n\
    \n*with Puppeteer*, we learned about browser automation and headless browsers.\
    \ *Chapter 2*, \n\n*Automated Testing and Test runners*, was about automated testing\
    \ and test runners. Now \n\nit's time to get more practical. In this chapter,\
    \ we will learn about UI testing, but in the \n\nreal world.\n\nIn the following\
    \ chapters, we will pick an open-source website made with Vue.js to test, \n\n\
    but we are also going to navigate through many other public websites. I want you\
    \ to learn \n\ntechniques that help you test websites no matter the framework\
    \ they use.\n\nI also want to share some tools with you, so you can finish this\
    \ book with a complete \n\ntoolbox. In this chapter, we will learn how to ship\
    \ our code to GitHub and run our tests \n\nusing GitHub Actions.\n\nIn the previous\
    \ chapter, we created a test project, and we ran a few tests without paying \n\
    \ntoo much attention to the Puppeteer APIs we were using. In this chapter, we\
    \ will create \n\na test project again, but this time we will go deeper and see\
    \ what Puppeteer has to offer \n\non each API."
