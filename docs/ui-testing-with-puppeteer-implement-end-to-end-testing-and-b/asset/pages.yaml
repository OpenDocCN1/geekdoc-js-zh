- img_proc: true
  md: "**10**\n\n**Evaluating and **\n\n**Improving the **\n\n**Performance of a **\n\
    \n**Website**\n\nMany things can make a website a success or a complete failure.\
    \ In *Chapter 9*, *Scraping *\n\n*tools*, we talked about a real estate website\
    \ that can't be launched without content. On \n\nmany websites, content is the\
    \ number-one feature. Amazon.com could be the best \n\nwebsite in the world, but\
    \ if it doesn't have the book you are looking for, you will go \n\nsomewhere else.\
    \ \n\nFor other websites, functionality is the number-one feature. A website such\
    \ as Trello.\n\ncom is a success because you can move cards from one list to another\
    \ easily and intuitively. \n\nBut functionality is not only about rich web pages.\
    \ If we go back to the Amazon website, \n\nthe website is pretty straightforward.\
    \ It doesn't use any cool UI framework, but it has \n\na great search and well-planned\
    \ navigation."
  merge: -1
  pgno: 276
- img_proc: true
  md: "262 Evaluating and Improving the Performance of a Website\n\nThe website design\
    \ can also be considered a feature. While some websites such as www.\n\ngoogle.com\
    \ might look simple and focused on delivering content, you can see that \n\nother\
    \ websites, such as www.apple.com, invest a lot in design. You can see that design\
    \ is \n\nthe number-one feature on www.apple.com.\n\nBut most websites will share\
    \ the same feature: **speed**. **Speed is a feature**. When planning \n\na website,\
    \ the stakeholders might argue whether they want to invest in a rich client or\
    \ \n\nnot. They can discuss whether they should hire a designer or not. But if\
    \ you ask about the \n\nspeed, there is only one answer: \"We need the website\
    \ to be fast.\"\n\nIn this chapter, we will learn how to use performance metrics\
    \ to solve several issues that \n\ncan arise with websites. We will look at functionality,\
    \ speed, and how we can measure \n\nthese key performance points with Google Lighthouse.\n\
    \nWe will cover the following topics in this chapter:\n\n• The issue of performance\n\
    \n• Getting started with Google Lighthouse\n\n• Tracing pages\n\n• Analyzing code\
    \ coverage\n\nBy the end of this chapter, you will be able to implement performance\
    \ metrics on your \n\nwebsite and help the development team improve the website's\
    \ performance.\n\nLet's get started.\n\n**Technical requirements**\n\nYou will\
    \ find all the code of this chapter on the GitHub repository (https://github.\n\
    \ncom/PacktPublishing/UI-Testing-with-Puppeteer) under the Chapter10 \n\ndirectory.\
    \ Remember to run npm install on that directory, and then go to the \n\nChapter10/vuejs-firebase-shopping-cart\
    \ directory and run npm install \n\nagain.\n\n**The Issue of Performance**\n\n\
    As I mentioned in the introduction, speed is a feature. You might be asked to\
    \ make \n\na simple website, but no one, ever, will tell you to make a slow website.\
    \ Websites need to \n\nbe fast. **Performance is the key to success**. Performance\
    \ increases user satisfaction; it \n\nresults in high conversion rates and higher\
    \ revenue. Let me share some facts with you:"
  merge: -1
  pgno: 277
- img_proc: true
  md: "The Issue of Performance 263\n\n• Rebuilding Pinterest pages for performance\
    \ increased conversion rates by 15% \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \npinterest-case).\n\n• By reducing the response size of the JSON needed for displaying\
    \ comments, \n\nInstagram saw increased impressions (https://www.hardkoded.com/\n\
    \nui-testing-with-puppeteer/instagram-case).\n\n• Walmart saw a 1% increase in\
    \ revenue for every 100 ms improvement in page \n\nload (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nwalmart-case).\n\nAs you can see, performance puts money in your pocket.\n\n\
    There is one more thing on which I'm sure you will agree with me: No matter the\
    \ website, \n\nno matter what they sell or offer, performance is the number-one\
    \ feature in the mobile \n\nexperience. When you are on the street, you don't\
    \ care about the style; you don't care \n\nabout functionality. The first thing\
    \ you need is the website to load, and load fast. You need \n\nto measure the\
    \ performance on mobile.\n\nThe problem with this feature is that, in general,\
    \ people don't know how to measure speed. \n\nIf we go back to the other features,\
    \ they are easy to measure. It's easy to discuss content. \n\nContent is easy\
    \ to measure:\n\n• I want to ship the website with content.\n\n• How many items?\n\
    \n• Over 1,000.\n\nFunctionality is, in general, something you can write down\
    \ on a spec:\n\n• I want an e-commerce site with an outstanding search experience.\n\
    \n• What does that mean?\n\n• It should support typos, and I should be able to\
    \ search for part of a word.\n\nDesign is about whether you want to put effort\
    \ into the look and feel or not:\n\n• We need a website with a great design.\n\
    \n• OK, we need three designers.\n\n• Perfect."
  merge: -1
  pgno: 278
- img_proc: true
  md: "264 Evaluating and Improving the Performance of a Website\n\nBut speed is hard\
    \ to discuss:\n\n• The website needs to be fast.\n\n• How fast?\n\n• I don't know…\
    \ fast?\n\n• But how fast do you think it should be? \n\n• I don't know… faster?\n\
    \nThe second problem is that we tend to react to performance issues. We don't\
    \ realize \n\nsomething needs to be fast until we realize it's slow.\n\nThird,\
    \ speed is a matter of expectation and comparison. The user would say that the\
    \ \n\nwebsite is slow. They would also say that they use Google Drive and that\
    \ it's way faster. \n\nThe developer would reply that the website seems fast in\
    \ their opinion, and, of course, \n\nthat they don't have Google's budget.\n\n\
    And the last problem is that we don't know how to test the website's performance.\
    \ We \n\nwould get a bug report from a user, saying that the website is slow,\
    \ and the QA analyst \n\nwould grab that bug report to validate it, but what's\
    \ the tool that the analyst has to validate \n\nthat issue? Going to the website\
    \ and checking whether it \"feels\" slow to them.\n\nThat is the perfect cocktail\
    \ for a disaster: No way to measure, no plan—it's all about \n\nfeelings and different\
    \ expectations.\n\nWe won't be able to solve all these problems in just one chapter\
    \ in a web automation \n\nbook. But, we will see some strategies and tools to\
    \ help you and your team to measure \n\nand improve your website's performance.\
    \ Let me share some tips with you to get started.\n\nFirst, **choose what you\
    \ need to measure**. If it's the entire website, that's OK. But I would \n\nstart\
    \ with the most popular pages first. Begin with the home page. Then, continue\
    \ with the \n\nmain workflow of the website. For instance, for an e-commerce website,\
    \ you would want \n\nto test the product details and the checkout page. Ask the\
    \ people in charge of analytics \n\nwhat pages bring more conversions, and focus\
    \ on those pages.\n\nSecond, **define the maximum amount of time a page can take\
    \ to load**. You could \n\nsay that the home page should never take more than\
    \ 30 seconds to load, under any \n\ncircumstances. This is an excellent use for\
    \ *Checkly*, the platform we saw in *Chapter 6*, \n\n*Executing and Injecting\
    \ JavaScript*. You could code a test to check that the page doesn't \n\ntake more\
    \ than 30 seconds to load in production and keep that check running on *Checkly*.\
    \ \n\nWe will see how to implement this later in this chapter. Once you have set\
    \ up that check, \n\nyou and your team can set more strict goals. For instance,\
    \ the search page should never \n\ntake more than a second to load."
  merge: -1
  pgno: 279
- img_proc: true
  md: "Getting started with Google Lighthouse 265\n\nThird, **measure performance\
    \ degradation**. Many times, setting a limit is hard, and it \n\ncan become a\
    \ guessing game. You can start by measuring how the performance evolves \n\nover\
    \ time. Is the website becoming faster or slower? Are we getting better or worse?\
    \ This \n\nis a great approach, but it requires a little bit more work. You need\
    \ to start storing data \n\nover time and build something to visualize that information.\n\
    \nAnd lastly, use the tools you learned in this book. We talked about Checkly,\
    \ but remember \n\nall the emulation techniques we learned back in *Chapter 8*,\
    \ *Environments emulation*? You \n\ncan set different goals for different network\
    \ speeds.\n\nThis is all you can do to measure a website's performance. In this\
    \ chapter, I want to show \n\nyou which tools you have to implement these ideas.\
    \ Let's start with Google Lighthouse, \n\na tool we can use to measure several\
    \ important metrics.\n\n**Getting started with Google Lighthouse**\n\nAs we saw\
    \ in the previous section, it's not easy to determine how fast \"fast\" is. Google\
    \ \n\ncame up with an idea. They built Lighthouse, \"*an open-source, automated\
    \ tool for *\n\n*improving the quality of web pages. You can run it against any\
    \ web page, public or requiring *\n\n*authentication. It has audits for performance,\
    \ accessibility, progressive web apps, SEO *\n\n*and more*\" (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nlighthouse).\n\nLighthouse will grab the website you choose, apply a list of\
    \ metrics and recommendations \n\nit finds important, and give you a score from\
    \ 0 to 100. It will analyze the website under \n\nfive categories:\n\n• ** Performance**:\
    \ The most popular category. Lighthouse will measure how optimized \n\nthe website\
    \ is, that is, how fast it gets ready for user interaction.\n\n• ** Accessibility**:\
    \ I would love to see developers paying more attention to this category. \n\n\
    Here, Lighthouse will evaluate how accessible the website is.\n\n• ** Best practices**:\
    \ This is another popular category. Lighthouse will evaluate a few \n\ngood practices\
    \ to incorporate into the website.\n\n• ** SEO**: This category is used a lot\
    \ by people in charge of marketing. Some companies \n\neven have SEO experts looking\
    \ at this. This category is about how optimized the \n\nwebsite is for search\
    \ engines. You might agree or not on how the other categories \n\nare measured,\
    \ but here Google is telling you: \"This is how we measure your website.\" \n\n\
    You will want a score of 100 if you want to secure your spot on the first page\
    \ of \n\nGoogle."
  merge: -1
  pgno: 280
- img_proc: true
  md: "266 Evaluating and Improving the Performance of a Website\n\n• ** Progressive\
    \ Web App**: If the website is a progressive web app, this category will \n\n\
    evaluate aspects of that progressive web app.\n\n**Important Note**\n\n**Progressive\
    \ web apps** (**PWAs**) are websites prepared to be installed as native \n\napplications.\
    \ Many PWAs have offline capabilities and try to get close to \n\na native app\
    \ experience.\n\nIn this chapter, we will focus only on the Performance category.\
    \ But before getting into the \n\ndetails of the performance category, let's see\
    \ how we can run this tool. Lighthouse comes \n\nin four flavors, which we will\
    \ cover in the following sections.\n\n**As part of Chrome DevTools**\n\nIf you\
    \ open DevTools, you will find a **Lighthouse** tab. If you can't find it, you\
    \ can add it \n\nby clicking on the three dots in the tool's right corner, then\
    \ going to **More tools**, and then \n\nfinding the **Lighthouse** options. You\
    \ should see something like this:\n\n \n\nLighthouse inside DevTools\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_281_0.png)"
  merge: -1
  pgno: 281
- img_proc: true
  md: "Getting started with Google Lighthouse 267\n\nYou should now have the tab there\
    \ with all the options to generate the report. The process \n\nwill run Lighthouse\
    \ locally, which is good, but that would mean that the Lighthouse \n\nresults\
    \ will be based on your hardware, CPU, available RAM, network speed, and so on.\n\
    \n**Using PageSpeed Insights**\n\nGoogle saw that results might fluctuate based\
    \ on your hardware, so they made a \n\nPageSpeed Insights (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/pagespeed) where you can run Lighthouse using Google's hardware. \n\
    \nThat would make it more stable, but you could get different results even using\
    \ Google's \n\nhardware.\n\n**Using the command line**\n\nYou can also use Lighthouse\
    \ from the command line. I wasn't that excited about having \n\nLighthouse in\
    \ the command line first. But then I realized that it's way more productive to\
    \ \n\nuse it from the command line than opening a browser, going to DevTools,\
    \ and so on.\n\nYou can install the Lighthouse **CLI** (**command-line interface**)\
    \ by installing the \n\nLighthouse module globally. This is the first time we\
    \ do this in this book, but it's no \n\ndifferent from how we installed the Puppeteer\
    \ module. We just need to add the \\-g flag \n\nlike this:\n\n**npm install -g\
    \ lighthouse**\n\n**NPM global modules**\n\nWhen you run npm install with the\
    \ \\-g flag, the module will be installed \n\nin a shared directory rather than\
    \ in the node\\_modules folder, and it will \n\nbe accessible by any app. Additionally,\
    \ if the module provides an executable \n\ncommand, it will be accessible from\
    \ the command line like this Lighthouse \n\nmodule.\n\nOnce installed, you will\
    \ be able to launch lighthouse from the command line, passing \n\nthe URL and,\
    \ additionally, extra command-line arguments such as \\--view, which will \n\n\
    launch the report after evaluating the website. \n\nWith this line of code, you\
    \ will be able to see the Lighthouse result for www.packtpub.\n\ncom:\n\n**lighthouse\
    \ https://www.packtpub.com/ --view**"
  merge: -1
  pgno: 282
- img_proc: true
  md: "268 Evaluating and Improving the Performance of a Website\n\nWondering what\
    \ the result is? We'll get there.\n\nThe last option available is one that we\
    \ will use a lot, and it's using the node module as \n\npart of our code.\n\n\
    **Using the node module**\n\nWe will be able to use Lighthouse in our unit tests\
    \ using the node module. Let's take \n\na look at the example from the Lighthouse\
    \ repository (https://www.hardkoded.\n\ncom/ui-testing-with-puppeteer/lighthouse-programmatically):\n\
    \nconst fs = require('fs');\n\nconst lighthouse = require('lighthouse');\n\nconst\
    \ chromeLauncher = require('chrome-launcher');\n\n(async () => {\n\n const chrome\
    \ = await chromeLauncher.launch({chromeFlags: \n\n\\['--headless'\\]});\n\n const\
    \ options = {logLevel: 'info', output: 'html', \n\nonlyCategories: \\['performance'\\\
    ], port: chrome.port};\n\n const runnerResult = await lighthouse('https://example.com',\
    \ \n\noptions);\n\n const reportHtml = runnerResult.report;\n\n fs.writeFileSync('lhreport.html',\
    \ reportHtml);\n\n console.log('Report is done for', runnerResult.lhr.finalUrl);\n\
    \n console.log('Performance score was', runnerResult.lhr.\n\ncategories.performance.score\
    \ \\* 100);\n\n await chrome.kill();\n\n})();\n\nThe code is not very complicated.\
    \ We launch a Chrome browser using the chrome-\n\nlauncher module. Then we launch\
    \ lighthouse, passing a URL and a set of options. \n\nThe lighthouse function\
    \ will return an object, I called it runnerResult, which \n\ncontains a report\
    \ property with the report as HTML and also a property called lhr \n\n(Lighthouse\
    \ result) with all the results as an object. We will use that property to assert\
    \ the \n\nminimum values we want to get."
  merge: -1
  pgno: 283
- img_proc: true
  md: "Getting started with Google Lighthouse 269\n\nNow that we know how to launch\
    \ Lighthouse, let's see how the report looks. In order to \n\navoid hurting feelings,\
    \ we will run Lighthouse against the very same Lighthouse website: \n\nhttps://www.hardkoded.com/ui-testing-with-puppeteer/lighthouse.\
    \ \n\nLet's see whether it is as fast as they say. As I mentioned before, I felt\
    \ really comfortable \n\nwith the command-line tool, so I will run this command:\n\
    \n**lighthouse https://developers.google.com/web/tools/lighthouse **\n\n**\\--view**\n\
    \nAfter running that, I got a new tab in my browser with the following result:\n\
    \nLighthouse result\n\nTo be honest, I picked a Google website on purpose. As\
    \ you can see in the screenshot, the \n\nresults can be rough. A score of 55 doesn't\
    \ mean that your site is terrible. It just means that \n\nthe website can be improved\
    \ a lot.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_284_0.png)"
  merge: -1
  pgno: 284
- img_proc: true
  md: "270 Evaluating and Improving the Performance of a Website\n\nYou also have\
    \ to keep in mind that a single company made this scoring system and, \n\nalthough\
    \ many companies use it as a marketing number to show off how good the score \n\
    \nis, this is not the final word. It's just one way to measure the performance\
    \ of your website.\n\nAnother thing to keep in mind is that although it measures\
    \ many things, its focus is on the \n\ntime taken to load the page, and you should\
    \ know that performance is more than that.\n\nLet's dive into the performance\
    \ category details.\n\n**The performance category**\n\nEach category in Lighthouse\
    \ consists of three sections: metrics, opportunities, \n\nand diagnostics. Although\
    \ only the metrics are used for the category score, it is by \n\nimplementing\
    \ the opportunities and looking at the diagnostics that you will improve the \n\
    \nmetrics.\n\nEach category has its own set of metrics, opportunities, and diagnostics.\
    \ In particular, the \n\nperformance category has 6 metrics, 17 opportunities,\
    \ and 13 diagnostics.\n\nLet's take a look at the performance metrics.\n\n**Performance\
    \ metrics**\n\nThe first metric is **First Contentful Paint**. It has a weight\
    \ of 15% on the overall \n\nperformance score. According to Google, this metric\
    \ \"*measures how long it takes the *\n\n*browser to render the first piece of\
    \ DOM content after a user navigates to your page. Images, *\n\n*non-white <canvas>\
    \ elements, and SVGs on your page are considered DOM content; *\n\n*anything inside\
    \ an iframe isn't included*.\" You will get a green score if this metric is under\
    \ 2 \n\nseconds. You can read more about this metric and how to improve the score\
    \ at https://\n\nweb.dev/first-contentful-paint/.\n\nThe second metric is **Speed\
    \ Index**. It has a weight of 15% on the overall performance \n\nscore. According\
    \ to Google, this metric \"*measures how quickly content is visually displayed\
    \ *\n\n*during page load. Lighthouse first captures a video of the page loading\
    \ in the browser and *\n\n*computes the visual progression between frames. Lighthouse\
    \ then uses the *Speedline \n\nNode.js module* to generate the Speed Index score*.\"\
    \ You will get a green score if this \n\nmetric is under 4.3 seconds. You can\
    \ read more about this metric and how to improve the \n\nscore at https://web.dev/speed-index/.\n\
    \nWith a weight of 25%, the third metric is **Largest Contentful Paint** and is\
    \ one of the \n\nmost important metrics. According to Google, this metric \"*measures\
    \ the render time of *\n\n*the largest image or text block visible within the\
    \ viewport*.\" You will get a green score if this \n\nmetric is under 2.5 seconds.\
    \ If you are interested in how they get to know what the \"largest \n\ncontentful\
    \ element\" is, check out their article at https://web.dev/lcp/."
  merge: -1
  pgno: 285
- img_proc: true
  md: "Getting started with Google Lighthouse 271\n\nThe fourth metric is **Time to\
    \ Interactive**. It has a weight of 15% on the overall \n\nperformance score.\
    \ According to Google, this metric \"*measures how long it takes a page to *\n\
    \n*become fully interactive*.\" You will get a green score if this metric is under\
    \ 3.8 seconds. You \n\ncan read more about this metric and how to improve the\
    \ score at https://web.dev/\n\ninteractive/.\n\nThe fifth metric is **Total Blocking\
    \ Time**, which is the second metric with a weight of \n\n25% on the overall performance\
    \ score. According to Google, this metric \"*measures the *\n\n*total amount of\
    \ time that a page is blocked from responding to user input, such as mouse *\n\
    \n*clicks, screen taps, or keyboard presses*.\" You will get a green score if\
    \ this metric is under \n\n300 milliseconds. You can read more about this metric\
    \ and how to improve the score at \n\nhttps://web.dev/lighthouse-total-blocking-time/.\n\
    \nWith a weight of just 5%, the last metric is **Cumulative Layout Shift**. According\
    \ to \n\nGoogle, this metric \"*measures the sum total of all individual layout\
    \ shift scores for every *\n\n*unexpected layout shift that occurs during the\
    \ entire lifespan of the page*.\" You will get a \n\ngreen mark if the score is\
    \ under 0.1. You can read more about this metric and how to \n\nimprove the score\
    \ at https://web.dev/cls.\n\nI came to a few conclusions after digging into all\
    \ these metrics. First, it's clear that they \n\nwere made by web performance\
    \ professionals. It would have been impossible for me to \n\nbuild all these metrics\
    \ in my daily job. The research behind these metrics is impressive.\n\nOn the\
    \ other side, when you look at the weights and thresholds, while they look well\
    \ \n\nthought out, they might sound quite arbitrary. Why is total blocking time\
    \ more important \n\nthan time to interactive? Or why do I get a green mark on\
    \ a speed index under 4.3 \n\nseconds? Why not 4.2? Why not 4.4? But this is better\
    \ than nothing.\n\nYou might also have had the feeling of this being too complicated\
    \ or hard to understand. \n\nSome concepts, such as **Largest Contentful Paint**,\
    \ sound like rocket science, at least to \n\nme. That's why you might find it\
    \ easier to understand and follow the opportunities section \n\nof the report.\n\
    \n**Performance opportunities**\n\nOpportunities are calls to action. These are\
    \ not just simple recommendations. Here, \n\nLighthouse will get to the point:\
    \ \"If you do this, you might get this bump in performance.\"\n\nAs I mentioned\
    \ before, there are 17 opportunities under the performance category. We \n\nwon't\
    \ cover all of them. But I would like to go through a few of them so you get an\
    \ idea of \n\nwhat this section is about."
  merge: -1
  pgno: 286
- img_proc: true
  md: "272 Evaluating and Improving the Performance of a Website\n\nLet's cover only\
    \ the opportunities shown when we process the Lighthouse website. These \n\nare\
    \ the opportunities I got in my report:\n\nPerformance opportunities for the Lighthouse\
    \ website\n\nHere, we have five opportunities. Let's unpack them:\n\n• ** Properly\
    \ size images**: Lighthouse found images that are bigger than the size shown \n\
    \non the page.\n\n• ** Serve images in next-gen formats**: Here, Lighthouse checks\
    \ whether you are using \n\nJPEG or PNG files instead of \"next-gen\" formats\
    \ such as WebP. I'm not particularly \n\na fan of this opportunity. Although WebP\
    \ is supported in most popular browsers \n\nthese days, it is not a popular format\
    \ in general yet.\n\n• ** Eliminate render-blocking resources**: I think this\
    \ is a critical opportunity. Here, \n\nLighthouse found that many resources are\
    \ blocking the first paint of the page. \n\nPaying attention to this opportunity\
    \ would improve your metrics considerably.\n\n• ** Remove unused JavaScript**:\
    \ Lighthouse found JavaScript code that is not being \n\nused. Although this would\
    \ be easy to detect by Lighthouse, this issue is not that \n\neasy to solve by\
    \ developers. Developers these days use bundlers to pack all their \n\nJavaScript\
    \ code, and shrinking the final code to only the code that the page needs \n\n\
    can be challenging.\n\n• ** Remove unused CSS**: This opportunity is similar to\
    \ the previous one, but it's related \n\nto CSS styles.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_287_0.png)"
  merge: -1
  pgno: 287
- img_proc: true
  md: "Getting started with Google Lighthouse 273\n\nI love this section because Lighthouse\
    \ doesn't just tell you what the opportunities \n\nare; it also gives details\
    \ showing you where the opportunity is and what would be the \n\nperformance bump.\
    \ Let's see, for instance, what we get when we click on the **Properly size **\n\
    \n**images** row:\n\nProperly size images section\n\nAs you can see there, Lighthouse\
    \ is showing us which images we can improve and what \n\nthe potential savings\
    \ we could get are. You will get the same kind of details on every \n\nopportunity.\n\
    \nThe last section within a Lighthouse category is the diagnostics.\n\n**Performance\
    \ Diagnostics**\n\nI see the diagnostics section as a list of things you should\
    \ consider to improve your \n\nwebsite. As I mentioned before, the performance\
    \ category has 13 diagnostics, but you \n\nwill see this number change over time.\
    \ \n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_288_0.png)"
  merge: -1
  pgno: 288
- img_proc: true
  md: "274 Evaluating and Improving the Performance of a Website\n\nThis is how the\
    \ diagnostics section looks:\n\nPerformance diagnostics for the Lighthouse website\n\
    \nAs you can see, you will have the same level of detail as in the opportunities\
    \ section, \n\nbut these diagnostics sound more like recommendations to improve\
    \ over time on your \n\nwebsite. For instance, let's take a look at the **Minimize\
    \ main-thread work** section:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_289_0.png)"
  merge: -1
  pgno: 289
- img_proc: true
  md: "Getting started with Google Lighthouse 275\n\nMinimize main-thread work section\n\
    \nAs you can see, it seems to make sense what the diagnostics section reports.\
    \ There is some \n\nscript evaluation that is taking 1,490 ms. But that doesn't\
    \ sound like a call to action. It's \n\nmore something to consider if you need\
    \ to improve the website's performance.\n\nNow that we have learned about what\
    \ Lighthouse is, let's see how we can test our website's \n\nperformance by adding\
    \ Lighthouse to our tests.\n\n**Using Lighthouse for testing**\n\nLet's be clear,\
    \ Lighthouse is not a testing tool. It's a tool used more for developers to check\
    \ \n\ntheir websites' performance. But, as we mentioned many times in this book,\
    \ the role of QA \n\nis to honor the customer. It's to ensure that the customer\
    \ gets the best product the team \n\ncan deliver. We will use Lighthouse to ensure\
    \ that the customer will get the fastest website \n\nwe can deliver.\n\nI can\
    \ think of three ways we can test a Lighthouse report:\n\n• Ensure that a page\
    \ has a minimum performance score.\n\n• Ensure that a metric is below a threshold.\n\
    \n• Ensure that an opportunity is not found.\n\nLet's begin by checking the performance\
    \ score. \n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_290_0.png)"
  merge: -1
  pgno: 290
- img_proc: true
  md: "276 Evaluating and Improving the Performance of a Website\n\n**Ensure that\
    \ a page has a minimum performance score**\n\nThe first test we can make using\
    \ Lighthouse is making sure that our page performance \n\nwon't degrade over time.\
    \ We will check that our page never falls below a specific score. \n\nHow can\
    \ we pick the minimum score? As we want to be sure that our website won't \n\n\
    degrade over time, let's see the current performance score and enforce that. Let's\
    \ go to the \n\nvuejs-firebase-shopping-cart directory, under Chapter10 of the\
    \ repository, \n\nand we will run npm run serve and launch the web application:\n\
    \n**npm run serve**\n\nThat command should start the website. Once started, let's\
    \ open another terminal and run \n\nLighthouse on the home page:\n\n**lighthouse\
    \ http://localhost:8080/--view**\n\nThe result of that process was a score of\
    \ 30 for performance. We can set our target score \n\nat 25. Time to write our\
    \ test.\n\n**Important Note**\n\nAs Lighthouse runs locally, you might get different\
    \ results on different \n\nmachines. You should consider that when picking your\
    \ score goal.\n\nWe are going to add our test in the homepage.tests.js file. But\
    \ before creating the \n\ntest, we need to install the lighthouse module by running\
    \ the following command:\n\n**npm install lighthouse**\n\nThat will get us Lighthouse\
    \ in our tests. The next step is importing the lighthouse module \n\nusing the\
    \ require function. Let's add this line at the top of the file:\n\nconst lighthouse\
    \ = require('lighthouse');\n\nThis will make Lighthouse available in our tests.\
    \ Now, let's see how our test would look:\n\nit('Should have a good performance\
    \ score', async() => {\n\n const result = await lighthouse(config.baseURL, {\n\
    \n port: (new URL(browser.wsEndpoint())).port,\n\n onlyCategories: \\['performance'\\\
    ]\n\n });\n\n \n\n expect(result.lhr.categories.performance.score >= 0.25)."
  merge: -1
  pgno: 291
- img_proc: true
  md: "Getting started with Google Lighthouse 277\n\nto.be.true;\n\n});\n\nWe solved\
    \ the test using only two statements. We first call lighthouse, passing \n\nthe\
    \ URL we want to process, in this case, config.baseURL, and then we pass an \n\
    \noptions object. There we are passing the port it has to use to connect to the\
    \ browser \n\nthat Puppeteer is using. We get it by doing new URL(browser.wsEndpoint())).\n\
    \nport, and then we tell Lighthouse we only want to process the performance category.\
    \ \n\nWe won't cover all the available options here. You can take a look at the\
    \ full list of \n\noptions at https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nlighthouse-configuration.\n\nIn the next line, we just assert that the score\
    \ of the performance category is greater or \n\nequal to 0.25. When you see the\
    \ report, scores are in the range of 0 to 100. But in the \n\nJSON object, the\
    \ range is from 0 to 1. That's why we need to use 0.25 instead of 25.\n\nThe next\
    \ test is checking for specific metrics.\n\n**Ensure that a metric is below a\
    \ threshold**\n\nWe can also be more specific. We could say that, for instance,\
    \ regardless of the \n\nperformance score we want to check, **First Contentful\
    \ Paint** should never take longer \n\nthan 30 seconds. Our code will be similar\
    \ to our previous test:\n\nit('Should have a good first contentful paint metric',\
    \ async() \n\n\\=> {\n\n const result = await lighthouse(config.baseURL, {\n\n\
    \ port: (new URL(browser.wsEndpoint())).port,\n\n onlyCategories: \\['performance'\\\
    ]\n\n });\n\n \n\n expect(result.lhr.audits\\['first-contentful-paint'\\].\n\n\
    numericValue).lessThan(30000);\n\n});\n\nHere, we can see that the lhr object\
    \ also contains an audits dictionary with all \n\nthe metrics. We can grab the\
    \ first-contentful-paint entry call and check \n\nthat numericValue (in milliseconds)\
    \ is under 30,000 (30 seconds expressed in \n\nmilliseconds)."
  merge: -1
  pgno: 292
- img_proc: true
  md: "278 Evaluating and Improving the Performance of a Website\n\nHow can we know\
    \ what the available metrics are? The easiest way is to add a breakpoint \n\n\
    in your test and add a watch to see the value of result.lhr. You will see something\
    \ \n\nlike this:\n\nResult.lhr content\n\nThere you will be able to see not only\
    \ the available entries but also numericUnit, among \n\nmany other properties.\n\
    \nBased on this example, making sure that an opportunity is not found will be\
    \ easy.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_293_0.png)"
  merge: -1
  pgno: 293
- img_proc: true
  md: "Tracing Pages 279\n\n**Ensure that an opportunity is not found**\n\nI think\
    \ this is the most solid way to use Lighthouse. We introduced some arbitrary \n\
    \nnumbers in our previous examples, 30 for the score and 30 seconds for the metric.\
    \ \n\nNow, let's say we don't want to get a certain opportunity; for instance,\
    \ we don't want \n\nany images of the wrong size. We can look at the audits and\
    \ try to find an entry with the \n\nname user-responsive-images. With that entry,\
    \ we can write the following test:\n\nit('Should have properly sized images',\
    \ async() => {\n\n const result = await lighthouse(config.baseURL, {\n\n port:\
    \ (new URL(browser.wsEndpoint())).port,\n\n onlyCategories: \\['performance'\\\
    ]\n\n });\n\n \n\n result.lhr.audits\\['uses-responsive-images'\\].numericValue.\n\
    \nshould.equal(0); \n\n});\n\nThe code is the same as the previous example, but\
    \ here, we assert that the metric value \n\nshould be 0. That will mean that all\
    \ the images are properly sized.\n\nIt's impressive all we can do with Lighthouse,\
    \ but to be honest, you won't see many teams \n\napplying these ideas to their\
    \ project. If you get to test your website's performance using \n\nLighthouse,\
    \ you will add a lot of value to your team.\n\nLighthouse is kind of a black box\
    \ that you call, get values, and act in response. But what \n\nif you want to\
    \ build your own metric? What if you want to analyze the performance of \n\na\
    \ page in a more granular way? Let's now explore all the **tracing** features\
    \ Puppeteer offers.\n\n**Tracing Pages**\n\nIn this section, we will cover how\
    \ to get performance information using the tracing \n\nobject you can find on\
    \ the **page.tracing** property. I saw this question more than once on \n\nStack\
    \ Overflow: How can I get the Performance tab's information using Puppeteer? The\
    \ \n\nanswer is: You can get all that information from the tracing result. There\
    \ is a high chance \n\nthat you will get a reply like: \"Yes, I say that, but\
    \ the result is too complex.\" And yes, the \n\ntracing result is quite complicated.\
    \ But we will try to see what we can get from that object \n\nin this section."
  merge: -1
  pgno: 294
- img_proc: true
  md: "280 Evaluating and Improving the Performance of a Website\n\nIf you open DevTools,\
    \ you should see a **Performance** tab like this one:\n\nPerformance tab\n\nAs\
    \ you can see, the **Performance** tab is not processing information all the time\
    \ because it's \n\na costly process. You need to start \"recording\" the tracing,\
    \ Chrome will begin collecting \n\nlots of data from the browser, and then you\
    \ have to stop the tracing process.\n\nIf you click on the second button, which\
    \ looks like a reload, it will automatically reload the \n\npage and start the\
    \ tracing. If you click on that button and then stop the tracing when the \n\n\
    page loads, you will get something like this:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_295_0.png)"
  merge: -1
  pgno: 295
- img_proc: true
  md: "Tracing Pages 281\n\nPerformance result\n\nThe level of detail of that panel\
    \ is impressive. You get to see every paint action, every \n\nHTML parsing, every\
    \ JavaScript execution, everything the browser did to render the \n\npage there.\n\
    \nWe can get the same using the tracing object. Let's create a test called Should\
    \ \n\nhave a good first contentful paint metric using tracing in our \n\nhomepage.tests.js\
    \ file, but we will add only the tracing calls for now:\n\nit('Should have a good\
    \ first contentful paint metric using \n\ntracing', async() => {\n\n await page.tracing.start({\
    \ screenshots: true, path: './\n\nhomepagetracing.json' });\n\n await page.goto(config.baseURL);\n\
    \n await page.tracing.stop();\n\n});\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_296_0.png)"
  merge: -1
  pgno: 296
- img_proc: true
  md: "282 Evaluating and Improving the Performance of a Website\n\nThe code is straightforward.\
    \ We start the tracing, we go to the page, and we stop the \n\ntracing.\n\nThe\
    \ start function expects an options object, which has three properties:\n\n• The\
    \ screenshots property will determine whether we want Chromium to take \n\nscreenshots\
    \ during the tracing.\n\n• If you set the path property, the tracing result will\
    \ be written in that JSON file.\n\n• Finally, you'll find a categories property,\
    \ where you will be able to pass an array \n\nof properties you want to trace.\n\
    \nThere is no fixed list of categories, but these are the categories I find more\
    \ relevant to us:\n\n• Under the **rail** category, we will find many useful traces\
    \ such as **domInteractive**, \n\n**firstPaint**, and **firstContentfulPaint**.\n\
    \n• If you set screenshots to true, you will find all the screenshots under the\
    \ \n\n**disabled-by-default-devtools.screenshot** category.\n\n• You will find\
    \ that lots of entries will come under the **devtools.timeline** category. \n\n\
    This category represents one of those items you see in the performance timeline.\n\
    \nWhen you call the stop function, you will get the result in the file you passed\
    \ to the \n\nstart function, and, whether you passed a path or not, the stop function\
    \ will return the \n\nresult as a Buffer.\n\nThe resulting JSON will be an object\
    \ with two properties: A metadata object with \n\ninformation about the trace\
    \ and the browser, and a traceEvents array, with all the \n\ntrace information.\n\
    \nIn my simple test example, traceEvents gave me 16,693. That was just for navigating\
    \ \n\nto the page. I think now you get why this can be scary for some users.\n\
    \nThe shape of each trace event might vary based on the category. But you will\
    \ find these \n\nproperties:\n\n•  cat will tell you the categories for the event,\
    \ separated by commas.\n\n•  name will give you the name of the event, as you\
    \ would see it in the **Performance** \n\ntab.\n\n•  ts will give you the tracking\
    \ clock, expressed in microseconds (1 microsecond is \n\n0.000001 seconds). Most\
    \ events are relative to the beginning of the trace.\n\n•  pid is the process\
    \ ID. I don't think you will care about that."
  merge: -1
  pgno: 297
- img_proc: true
  md: "Tracing Pages 283\n\n•  tid is the thread ID. You won't care about that either.\n\
    \n•  args will give you an object with specific information for that event type.\
    \ For \n\ninstance, you will get the URL and the HTTP method of a request. For\
    \ a screenshot, \n\nyou will get the image in Base64 format.\n\nWith all this\
    \ information, let's code our first contentful paint test using tracing values.\
    \ \n\nWe are going to write a test that will start the tracing, navigate to a\
    \ page, and then evaluate \n\nthe results. It would be something like this:\n\n\
    it('Should have a good first contentful paint metric using \n\ntracing', async()\
    \ => {\n\n await page.tracing.start({ screenshots: true, path: './\n\nhomepagetracing.json'\
    \ });\n\n await page.goto(config.baseURL);\n\n const trace = await page.tracing.stop();\n\
    \n const result = JSON.parse(trace);\n\n const baseEvent = result.traceEvents.filter(i=>\
    \ i.name == \n\n'TracingStartedInBrowser')\\[0\\].ts;\n\n const firstContentfulPaint\
    \ =result.traceEvents.filter(i=> \n\ni.name == 'firstContentfulPaint')\\[0\\].ts;\n\
    \n expect((firstContentfulPaint - baseEvent) / 1000).\n\nlessThan(500);\n\n});\n\
    \nWe have some tricks to explain here. After stopping the trace, we get the result\
    \ and \n\nparse it. That will give us the result with a traceEvents property.\
    \ As ts is based \n\non the beginning of the trace, we need to find the baseEvent,\
    \ looking for an event \n\nwith the name TracingStartedInBrowser. Then we look\
    \ for the event with the \n\nname firstContentfulPaint, and finally, we calculate\
    \ the difference. As it's in \n\nmicroseconds, we need to divide it by 1,000,\
    \ so we can compare it with our target goal \n\nof 500 ms.\n\nNotice that in this\
    \ example, our goal is 500 ms versus the 30 seconds we used in the \n\nLighthouse\
    \ example. This is because, by default, Lighthouse performs several runs \n\n\
    emulating different conditions."
  merge: -1
  pgno: 298
- img_proc: true
  md: "284 Evaluating and Improving the Performance of a Website\n\nAnother thing\
    \ we could do here is export the screenshots generated by the tracing tool for\
    \ \n\nlater analysis. We can add something like this at the end of the test:\n\
    \nconst traceScreenshots = result.traceEvents.filter(x => (\n\n x.cat === 'disabled-by-default-devtools.screenshot'\
    \ &&\n\n x.name === 'Screenshot' &&\n\n x.args &&\n\n x.args.snapshot\n\n));\n\
    \ntraceScreenshots.forEach(function(snap) {\n\n fs.writeFile(\\`./hometrace-${snap.ts\
    \ - baseEvent}.png\\`, snap.\n\nargs.snapshot, 'base64', function(err) {});\n\n\
    });\n\nThere, we are filtering screenshots events with a valid screenshot, and\
    \ then we just write all \n\nthose Base64 snapshots to the filesystem. With that,\
    \ you will see how the page was being \n\nrendered during the loading process.\
    \ You would even code your own first contentful paint \n\nalgorithm with those\
    \ images.\n\nNow you might be wondering whether you should use Lighthouse or Puppeteer's\
    \ tracing. \n\nI think there are some pros and cons to every approach. Lighthouse\
    \ is easy to use, and \n\nas we saw, it gives us metrics that would take us lots\
    \ of effort to build by ourselves. With \n\nLighthouse, you just call the lighthouse\
    \ function and evaluate the results. But it can be \n\nslow, even if you select\
    \ only one category.\n\nOn the other hand, Puppeteer's tracing can be hard to\
    \ read and process, but if you \n\nknow how to take the metric you need from the\
    \ tracing result, it will be way faster than \n\nLighthouse. Another important\
    \ difference is that Lighthouse only evaluates the page load, \n\nwhereas with\
    \ Puppeteer's tracing, you could start the tracing at any moment. For instance,\
    \ \n\nyou could go to a page, start the tracing, click on a button, and then evaluate\
    \ what the \n\nbrowser did to process that click. At the end of the day, it's\
    \ about picking the right tool for \n\nyour job.\n\nLighthouse also gives us two\
    \ interesting metrics: **Remove unused JavaScript** and **Remove **\n\n**unused\
    \ CSS**. Let's see how we can solve those metrics using Puppeteer."
  merge: -1
  pgno: 299
- img_proc: true
  md: "Analyzing code coverage 285\n\n**Analyzing code coverage**\n\nIn this last\
    \ section, we will see how we can get code coverage using the Coverage class \n\
    \nfrom Puppeteer. Code coverage is a metric that can be applied to any piece of\
    \ code. To \n\nget the code coverage of a piece of code, you need some kind of\
    \ tool to trace which lines \n\nof code are being executed, execute that code,\
    \ and get the tracing result. It's like the \n\nperformance tracing, but instead\
    \ of measuring time, it measures executed lines of code.\n\nYou can see the code\
    \ coverage on a page on Chrome using the **Coverage** tab. I didn't have \n\n\
    that tab by default, so I needed to add it using the **More tools** option, as\
    \ in the following \n\nscreenshot:\n\nCoverage tab\n\nThe **Coverage** tab works\
    \ like the **Performance** tab. You need to start the tracing, run the \n\npage,\
    \ or perform an action, then stop the tracing to get the results.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_300_0.png)"
  merge: -1
  pgno: 300
- img_proc: true
  md: "286 Evaluating and Improving the Performance of a Website\n\nThe result will\
    \ be something like what we see in the preceding screenshot: A list of \n\nresources\
    \ with the total bytes of that resources and the unused bytes. At the bottom \n\
    \nof the window, we can see that over 90% of the code was used (executed) during\
    \ the \n\ntracing. That's pretty good. We could write a test to ensure that we\
    \ will always have a code \n\ncoverage of over 90%.\n\nThe JavaScript and the\
    \ CSS code coverage have two sets of functions in Puppeteer. If \n\nyou want to\
    \ get the JavaScript code coverage, you need to run startJSCoverage to \n\nstart\
    \ the coverage and stopJSCoverage to stop it. startJSCoverage supports an \n\n\
    options argument with two properties:\n\n•  resetOnNavigation is a Boolean property\
    \ we can use to tell Puppeteer to start \n\nover with the tracing if navigation\
    \ was detected.\n\n•  reportAnonymousScripts is a Boolean property we can use\
    \ to tell Puppeteer \n\nto ignore, or not, dynamically generated JavaScript code.\n\
    \nIf we want to get CSS coverage, we need to use the startCSSCoverage and \n\n\
    stopCSSCoverage functions. startCSSCoverage also expects an options \n\nargument,\
    \ but, in this case, it only has the resetOnNavigation property.\n\nOnce we run\
    \ the coverage, both stopCSSCoverage and stopJSCoverage will return \n\nthe same\
    \ type of value. Both will return an array of objects with these properties:\n\
    \n•  url will give us the resource URL.\n\n•  content will be the CSS or the script\
    \ content.\n\n•  ranges, which will contain an array of objects telling us which\
    \ were the portion \n\nof code that has been executed. Each entry will contain\
    \ two properties, start and \n\nend, telling us where that text range starts and\
    \ ends.\n\nNow we have all this information, we can write our code coverage test.\
    \ Let's take a look \n\nat it:\n\nit('It should have good coverage', async() =>\
    \ {\n\n await Promise.all(\\[page.coverage.startJSCoverage(), page.\n\ncoverage.startCSSCoverage()\\\
    ]);\n\n await page.goto(config.baseURL);\n\n const \\[jsCoverage, cssCoverage\\\
    ] = await Promise.all(\\[\n\n page.coverage.stopJSCoverage(),\n\n page.coverage.stopCSSCoverage()\n\
    \n \\]);\n\n let totalBytes = 0;"
  merge: -1
  pgno: 301
- img_proc: true
  md: "Summary 287\n\n let usedBytes = 0;\n\n const coverageTotals = \\[...jsCoverage,\
    \ ...cssCoverage\\];\n\n for (const entry of coverageTotals) {\n\n totalBytes\
    \ += entry.text.length;\n\n for (const range of entry.ranges) usedBytes += range.end\
    \ \n\n\\- range.start - 1;\n\n }\n\n const percentUnused = parseInt((usedBytes\
    \ / totalBytes) \\* \n\n100, 10);\n\n expect(percentUnused).greaterThan(90);\n\
    \n});\n\nWe start our test by starting both code coverages. We put startJSCoverage\
    \ and \n\nstartCSSCoverage inside Promise.all, so we wait for both coverages to\
    \ be \n\nconfirmed. Then we go to the page, and after that, we stop both coverages.\
    \ That will \n\ngive us two arrays that we can join (because they share the same\
    \ shape) using \\[...\n\njsCoverage, ...cssCoverage\\].\n\nOnce we have both coverages,\
    \ we get the total size of the resource by using entry.\n\ntext.length, and then\
    \ we get the size of the coverage by adding the length of all the \n\nranges.\n\
    \nThe result will give us the total code coverage of our tracing, which we will\
    \ check whether \n\nit's over 90%.\n\nThe pros and cons of this solution compared\
    \ with Lighthouse are the same as we saw in \n\nthe previous section. On one side\
    \ we have Lighthouse, which gives us all the numbers \n\nalready cooked. But here,\
    \ we have more control over what we want to measure. This test \n\nwas quite simple,\
    \ but you could improve it by filtering out all the resources you don't want \n\
    \nto measure. You can also download that result to a file and share it with your\
    \ team if the \n\ntest fails.\n\nNow it's time to wrap up this chapter and this\
    \ book.\n\n**Summary**\n\nIf you get to apply performance tests in your team,\
    \ you will be on a whole new level.\n\nWe started the chapter by talking about\
    \ Lighthouse. We only covered the Performance \n\ncategory. But now that you know\
    \ how it works, I encourage you to keep digging into the \n\nother categories\
    \ and think about how to create tests for that. I would love to see more tests\
    \ \n\nabout accessibility."
  merge: -1
  pgno: 302
- img_proc: true
  md: "288 Evaluating and Improving the Performance of a Website\n\nWe also learned\
    \ how to use Lighthouse in our tests. That's not something you will see \n\nquite\
    \ often. You will be able to test very complex metrics using two lines of code.\n\
    \nMost developers would run away from Puppeteer's tracing results. Although what\
    \ you \n\ncan get from there is way more than what we covered, we learned the\
    \ foundations of such \n\na powerful tool in this chapter.\n\nThe size of a page\
    \ is critical for performance; that's why we learned about code coverage \n\n\
    and how to measure it.\n\nAnd this is also a wrap on this book. When I planned\
    \ this book, my goal was to write \n\na book that would cover the entire Puppeteer\
    \ API, without being a reference book. And \n\nI think we accomplished that goal.\
    \ We learned how to write high-quality end-to-end tests \n\nusing Puppeteer and,\
    \ at the same time, we covered most of the Puppeteer API.\n\nWith this goal in\
    \ mind, we covered topics that were not strictly related to unit testing. We \n\
    \ntalked about PDF generation and Web Scraping. We also covered topics that many\
    \ people \n\nwould run away from, such as the tracing model.\n\nIf you read this\
    \ book from cover to cover, I can assure you that you will know way more \n\n\
    about Puppeteer than the average user of this library.\n\nBut I also hope you\
    \ learned more than just a Node package. In this book, we also learned \n\nabout\
    \ the foundations of the web, and how to write good tests. We talked about the\
    \ \n\ninternet ecosystem, scraping ethics, and web performance. You have also\
    \ empowered \n\nyour role. QA is more than just about testing web pages. It's\
    \ about honoring your users \n\nby delivering high-quality software they can enjoy\
    \ using."
  merge: -1
  pgno: 303
