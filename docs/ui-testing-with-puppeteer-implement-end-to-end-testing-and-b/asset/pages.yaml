  md: "Organizing our code 47\n\nWe declare a variable inside the describe:\n\nlet\
    \ homePageModel;\n\nWe create an instance of this class in the beforeEach hook:\n\
    \nbeforeEach(async () => {\n\n page = await browser.newPage();\n\n homePageModel\
    \ = new HomePageModel(page);\n\n await homePageModel.go();\n\n});\n\nAnd now,\
    \ we simply replace the page.title we are using with homePageModel.\n\ntitle:\n\
    \n(await homePageModel.title()).should.contain('Packt');\n\nAs I mentioned earlier\
    \ in the chapter, UI tests help us see whether our refactoring broke \n\nour code.\
    \ Let's run npm test again to confirm that we didn't break anything:\n\nTest result\
    \ after the first refactor\n\nThere's only one thing left to do so that we can\
    \ be proud of our first project. We need to \n\nget rid of our hardcoded values.\
    \ We only wrote two tests, and we have three hardcoded \n\nvalues: the site URL\
    \ and the Packt and the Books words.\n\nFor these tests, we can leave these hardcoded\
    \ values. But what if you have different \n\nenvironments? You would need to make\
    \ the URL dynamic. What if your site were \n\na generic e-commerce site? The brand\
    \ name would depend on the test you are navigating.\n\nThere are many other use\
    \ cases:\n\n• Test users and passwords\n\n• Product to test\n\n• Keywords to use\n\
