  md: "192 Generating Content with Puppeteer\n\n});\n\nawait page.pdf({…});\n\nWith\
    \ this piece of code, we are hiding the search input before generating the PDF.\
    \ This \n\nis a relatively simple change, but imagine all the things you would\
    \ be able to set up in \n\nreal-life scenarios.\n\n**Summary**\n\nIn this chapter,\
    \ we covered many of my favorite features. Creating content is an \n\nunexpected\
    \ use for a browser automation tool.\n\nWe learned how to generate screenshots,\
    \ use them for UI regression testing, and generate \n\ncontent for our websites.\
    \ We also learned how to generate PDF files and all the options \n\navailable.\
    \ By the end of the chapter, we learned how to generate pages on the fly.\n\n\
    During this chapter, we also saw many features available in Chrome. I hope you\
    \ learned \n\nsome new tricks there.\n\nIn the next chapter, we will take our\
    \ tests to the next level. We will learn how to test our \n\nwebsites by emulating\
    \ different mobile devices and network conditions."
  merge: -1
  pgno: 207
- img_proc: true
  md: "**8**\n\n**Environments **\n\n**emulation**\n\nI had the good luck of using\
    \ the internet before it became popular. I was a teenager \n\nwhen *Windows 95\
    \ Plus* was launched to the market. Most people might remember \n\n*Windows 95\
    \ Plus* because it came with some cool themes and even the *Space Cadet *\n\n\
    *Pinball* game. But this version of Windows brought a new software application\
    \ whose \n\nname is still around these days, with haters and lovers. *Windows\
    \ 95 Plus* came with \n\n*Internet Explorer 1.0 (IE 1.0)*.\n\nMy first internet\
    \ connection was a free phone number that a local newspaper shared with \n\nits\
    \ readers. I was able to convince my dad to get me a modem. The speed was 36.6\
    \ kbps. \n\nToday my speed test goes to 150 Mbps download and 30 Mbps upload,\
    \ over 4,000 times \n\nfaster than the speed I got as a teen.\n\nI don't remember\
    \ very well the specs of my computer. But I do remember using a 15'' \n\n800x600\
    \ monitor, and then upgrading to a 17'' 1,024x768. LED? No way! What's that? \n\
    \nThere were some bulky, eye-burning CRT monitors.\n\nSEO? Google? Nobody knew\
    \ those words back then. I remember that my favorite search \n\nengine was *AltaVista*."
  merge: -1
  pgno: 208
- img_proc: true
  md: "194 Environments emulation\n\nWhy am I telling you all this? Because back then,\
    \ the internet experience was consistent. \n\nIt was slow, very slow, ugly, very\
    \ ugly, and limited, very limited. But it was the same \n\nfor everybody. If you\
    \ were a developer back then, you knew that you had to develop \n\na website for\
    \ IE 1.0 to be displayed on an 800x600 screen and that your page would take \n\
    \nover a minute to download. But you wouldn't have thought about all that. You\
    \ would \n\nbe happy creating your page with *Microsoft FrontPage*, pushing that\
    \ to some server, and \n\nletting the world know about your site.\n\nBut now things\
    \ are different. The ecosystem is more diverse than ever, and we need to be \n\
    \nprepared to test all the different scenarios that we could come across. At the\
    \ end of the \n\nday, it is our job to honor all our customers and try to understand\
    \ their environments.\n\nWe will cover the following topics in this chapter:\n\
    \n• Understanding the browser's market share\n\n• Emulating mobile devices\n\n\
    • Emulating network conditions\n\n• Emulating localization\n\n• Other emulations\n\
    \nBy the end of this chapter, you will be able to get into your users' shoes and\
    \ emulate how \n\nthey experience your sites.\n\nLet's get started.\n\n**Technical\
    \ requirements**\n\nYou will find all the code of this chapter on the GitHub repository\
    \ (https://github.\n\ncom/PacktPublishing/UI-Testing-with-Puppeteer) under the\
    \ Chapter8 \n\ndirectory. Remember to run npm install on that directory, and then\
    \ go to the \n\nChapter8/vuejs-firebase-shopping-cart directory and run npm install\
    \ \n\nagain.\n\n**Understanding the browser's market share**\n\nBefore getting\
    \ into all the emulation features Puppeteer provides, I would like to discuss\
    \ \n\nhow the browser's market share looks these days. I believe that will give\
    \ you a clear picture \n\nof the importance of testing and emulating different\
    \ scenarios."
  merge: -1
  pgno: 209
- img_proc: true
  md: "Understanding the browser's market share 195\n\n**The browser's popularity\
    \ over the years**\n\nWe have lived through lots of changes over the past 25 years.\
    \ Browsers have been \n\ndramatically adopted and discarded. Let's take a look\
    \ at this table made by Nick \n\nRoutley in his post *Internet Browser Market\
    \ Share (1996–2019)* (https://www.\n\nvisualcapitalist.com/internet-browser-market-share/):\
    \ \n\nAlthough I used *Netscape Navigator*, I wasn't there at its peak back in\
    \ 1995. But I \n\nremember the days when the only browser that mattered was *Internet\
    \ Explorer*.\n\nThe community was living through browser fatigue back in 2008,\
    \ when *Google Chrome* \n\nwas launched, causing a massive number of users to\
    \ move to *Google Chrome* and *Firefox*, \n\nwhich had a peak in 2010.\n\nIf you\
    \ didn't play the video on Nick's post, don't miss that. I took a screenshot from\
    \ the \n\nmoment that the video gets to 2013 Q1:\n\nMarket share in 2013\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_210_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_210_1.png)"
  merge: -1
  pgno: 210
- img_proc: true
  md: "196 Environments emulation\n\nThat was a challenging year for developers. You\
    \ had four different browser engines \n\nbehaving differently, processing CSS\
    \ styles differently, having different JavaScript features. \n\nIt was a mess.\
    \ But I think that was a healthy web, with no clear market owner.\n\n**Browsers'\
    \ popularity in 2020**\n\nAccording to *StatCounter* (https://gs.statcounter.com/),\
    \ the picture is very \n\ndifferent these days:\n\nBrowser market share in December\
    \ 2020 according to StatCounter\n\nMany people call *Google Chrome* the **new**\
    \ Internet Explorer. The Chrome predominance \n\ngets even more important when\
    \ you consider that *Edge* and *Opera* use the Chromium \n\nengine. When a browser\
    \ gets to these levels of market share, it is good for developers, but \n\nit's\
    \ not good for the web. \n\nWhat if we take a look at operative systems?\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_211_0.png)"
  merge: -1
  pgno: 211
- img_proc: true
  md: "Understanding the browser's market share 197\n\n**Operative Systems market\
    \ share**\n\nOperative systems play an essential part in how browsers work. They\
    \ are responsible for \n\nproviding the fonts and interacting with the hardware,\
    \ among other things. Most browsers \n\nare cross-platform, but although they\
    \ try to give the same experience across operative \n\nsystems, they don't always\
    \ work in the same way. That's why it's so important to know how \n\nthe operative\
    \ system market share looks:\n\nOperative system market share in December 2020\
    \ according to StatCounter\n\nI honestly found this surprising. Almost 55% of\
    \ internet consumption is on mobile, and \n\nover 39% is on Android. These values\
    \ should make us re-think how we develop and test \n\nour sites.\n\nThe last thing\
    \ we can take a look at is screen resolutions.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_212_0.png)"
  merge: -1
  pgno: 212
- img_proc: true
  md: "198 Environments emulation\n\n**Screen resolution distribution**\n\nScreen\
    \ resolution is another important piece when we try to understand the whole web\
    \ \n\necosystem. In *Chapter 3*, *Navigating through a website*, we talked about\
    \ how developers \n\ncan change a page layout based on the screen resolution.\
    \ Let's see how the screen \n\nresolution is distributed according to **StatCounter**:\n\
    \nScreen resolution market share in December 2020 according to StatCounter\n\n\
    The distribution of screen resolutions is crazy. There is not only a wide variety\
    \ of \n\nresolutions, but we also have \"**Other**\" with 41%. We are far from\
    \ that 800x600 standard.\n\nThe message I want to leave you with is that the internet\
    \ ecosystem is more diverse than \n\never. The world where everything was just\
    \ IE, 800x600, over a dial-up connection is long \n\ngone. Although there is one\
    \ predominant browser, we have many possible scenarios, \n\nmobile devices, and\
    \ screen resolutions, and we haven't talked about network speeds. We \n\nhave\
    \ Wi-Fi, 4G, 3G, or GPRS.\n\nWe sometimes make the error of thinking that all\
    \ users have a crazy-fast internet and \n\n27'' 4K displays, and we are unable\
    \ to understand why they feel frustrated with our site.\n\nDo you know your users?\
    \ Do you know whether they use your site on the street on \n\ntheir phones? Do\
    \ you want your site to be used worldwide? Do you know that there are \n\ncountries\
    \ where they write right to left or where they don't have 4G coverage?\n\nIt's\
    \ time to get into mobile users' shoes. Let's see how we can emulate mobile devices.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_213_0.png)"
  merge: -1
  pgno: 213
- img_proc: true
  md: "Emulating mobile devices 199\n\n**Emulating mobile devices**\n\nThe first type\
    \ of emulation I want to cover is mobile emulation. In this section, we will \n\
    \ncover the three elements that Puppeteer can emulate: The viewport, the touchscreen,\
    \ and \n\nthe user agent. We have to keep in mind that it is a browser trying\
    \ to **emulate** a mobile \n\ndevice. Puppeteer and Chromium won't be able to\
    \ emulate any hardware limitations or \n\nany other specific features that certain\
    \ mobile phones offer. There is no real device behind \n\nthe curtains; it's just\
    \ a browser trying to show you how a website would look on that \n\ndevice's screen.\n\
    \nAs I mentioned previously, **55% of the internet traffic comes from mobile devices**.\
    \ Most \n\nof the diversity we saw in the previous section is in the mobile world.\n\
    \nLet's take a look at some of the browser distribution in the mobile world:\n\
    \nBrowser market share in mobile devices according to StatCounter\n\nThe mobile\
    \ market is mostly divided between *Chrome* and *Safari*. One thing you should\
    \ \n\nknow is that in *iOS*, the only available browser engine is *WebKit*/*Safari*.\
    \ You have browsers \n\nsuch as *Chrome*, *Edge*, or *Firefox* available in *iOS*,\
    \ but they cannot ship their own browser \n\nengine. They have to use *WebKit*.\
    \ The only thing they can provide are features over that \n\nengine. The main\
    \ feature you will see in those browsers is the synchronization between \n\nthe\
    \ desktop and the mobile browser.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_214_0.png)"
  merge: -1
  pgno: 214
- img_proc: true
  md: "200 Environments emulation\n\nLet's take a look at screen resolutions on mobile\
    \ devices:\n\nScreen resolutions on mobile devices according to StatCounter\n\n\
    You need 10 screen resolutions to reach 50% of the market share, compared with\
    \ \n\nonly three resolutions on desktop, 1,920x1,080, 1,366x768, and 1,536x864.\
    \ The screen \n\nresolutions in the mobile world are highly diverse. Another thing\
    \ that should call your \n\nattention in that chart is the resolutions that are\
    \ pretty low. Who buys a phone with \n\na 360x640 resolution? No one. We will\
    \ find out in the next section who those 360x480 \n\nusers really are.\n\nSo,\
    \ it's time to talk about the elements that Puppeteer considers to emulate a mobile\
    \ \n\ndevice.\n\n**The Viewport**\n\nWe've talked a lot about the viewport in\
    \ this book. It's time to give a clear definition of the \n\nviewport.\n\nI like\
    \ to explain the viewport by explaining what it's not. The viewport is not the\
    \ screen \n\nresolution. It's not the size of the browser's window. And lastly,\
    \ it's not the size of the page. \n\nThe viewport is the rectangular portion of\
    \ the screen the browser uses to render a page. \n\nFrom the user's point of view,\
    \ the viewport is the part of the page you can see:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_215_0.png)"
  merge: -1
  pgno: 215
- img_proc: true
  md: "Emulating mobile devices 201\n\n \n\nThe viewport\n\nI love the preceding visualization,\
    \ not because I made it, but because it clearly shows \n\nthe difference between\
    \ the viewport and the screen size. The page can be huge. It can be \n\nway longer\
    \ than what you can see. Even more, if you are a social media user, you would\
    \ \n\nalso know that pages can have an \"infinite\" height because sites such\
    \ as *Facebook* and \n\n*Twitter* load new content when you are close to reaching\
    \ the end of the page. Although \n\nit's not as common, a page could also be wider\
    \ than the viewport. There was a wave of \n\nhorizontal-scrolling pages when *Windows\
    \ 8* was launched. The Microsoft *Azure* portal \n\nstill shows its content using\
    \ a horizontal layout.\n\nThe second element to take into consideration when you\
    \ try to emulate a device screen is \n\nthe pixel ratio.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_216_0.png)"
  merge: -1
  pgno: 216
- img_proc: true
  md: "202 Environments emulation\n\n**Pixel ratio**\n\nWhat if I told you that the\
    \ Samsung Galaxy S20, with a screen resolution of 1,440x3,200, \n\nhas a viewport\
    \ of 360x800? \n\nNo, that's not a typo, nor an error. That's the browser's viewport\
    \ on that beautiful mobile \n\nphone. How's that possible? Let's see how a web\
    \ page would be displayed on a Samsung \n\nS20 without a pixel ratio set:\n\n\
    \ \n\nGalaxy S20 without a pixel ratio\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_217_0.png)"
  merge: -1
  pgno: 217
- img_proc: true
  md: "Emulating mobile devices 203\n\nImagine if the browser honored the real resolution\
    \ of the screen. That would be impossible \n\nto read, so you need to scale the\
    \ resolution. You need to tell the browser to use a ratio to \n\nzoom the page\
    \ and make it more usable. In the case of the Samsung Galaxy S20, the pixel \n\
    \nratio is 4, taking the viewport to 360x800, which is simple math (1,440/4) x\
    \ (3,200/4). If \n\nwe navigate the page using a pixel ratio of 4, we will see\
    \ something like this:\n\nGalaxy S20 with the right pixel ratio\n\nNow we have\
    \ an S20 with a huge resolution, but pages are rendered in a way that we can \n\
    \nread them. \n\nIf you're wondering how I've been emulating different devices,\
    \ it's tool time! \n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_218_0.png)"
  merge: -1
  pgno: 218
- img_proc: true
  md: "204 Environments emulation\n\nIf you open the developer tools (I hope that\
    \ by now I don't have to tell you how to do \n\nthat), you will find that there\
    \ is a button called **Toggle device emulation**:\n\nToggle device emulation option\n\
    \nIf you click on that button, you will activate the device emulation mode. From\
    \ there, you \n\nwill be able to pick any device to emulate, or create new ones.\
    \ You will also be able to \n\nchange the zoom. Notice that this zoom won't affect\
    \ the viewport; it's just to zoom the \n\nemulator. Finally, you will have the\
    \ option to emulate different network speeds. We will \n\ntalk about that in the\
    \ *Emulating network conditions* section.\n\nThe next element that Puppeteer takes\
    \ into consideration is the touchscreen.\n\n**The touchscreen**\n\nIf the device\
    \ has a touchscreen, the browser will give developers an extra set of tools, \n\
    \n**touch events** (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\ntouchevents).\
    \ Single taps will be processed as click events. But the browser offers \n\nthe\
    \ chance of processing multi-touch interactions. Let's see how Chromium shows\
    \ the \n\ntouchscreen emulation:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_219_0.png)"
  merge: -1
  pgno: 219
- img_proc: true
  md: "Emulating mobile devices 205\n\nTouch emulation\n\nIf you use the device emulation,\
    \ you will see that Chromium will emulate taps with \n\na black circle.\n\nThat\
    \ takes us to the last thing that Puppeteer uses to emulate devices: the user\
    \ agent.\n\n**The user agent**\n\nThe user agent is one of those terrible decisions\
    \ made on the web that are hard to \n\neradicate. The user agent is a string (text)\
    \ sent to the server on every request that identifies \n\nthe browser/application,\
    \ the operative system, the vendor, and its version.\n\nAccording to MDN (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/userAgent), the format should be something like this:\n\nUser-Agent:\
    \ <product> / <product-version> <comment>\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_220_0.png)"
  merge: -1
  pgno: 220
- img_proc: true
  md: "206 Environments emulation\n\nIf you open DevTools in Chrome and type navigator.userAgent,\
    \ you will get \n\nsomething like this:\n\n\"Mozilla/5.0 (Macintosh; Intel Mac\
    \ OS X 11\\_0\\_1) \n\nAppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.88\
    \ \n\nSafari/537.36\"\n\nThe only clear thing here is that I'm on a Mac, using\
    \ an Intel processor, and the operating \n\nsystem version is 11\\_0\\_1. It's\
    \ also true that I'm on Chrome/87.0.4280.88. The \n\nrest are patches after patches,\
    \ so the user doesn't get a \"Your browser is not compatible\" \n\nmessage. So,\
    \ if the server checks for Mozilla, the user agent will match, but it's not Mozilla.\
    \ \n\nCould you tell me what *KHTML, like Gecko* is? As you can see, the user\
    \ agent system is \n\nbroken.\n\nMany developers would use the user agent to determine\
    \ which device is on the other side. \n\nLet's take, for instance, the user agent\
    \ on an iPad:\n\nMozilla/5.0 (iPad; CPU OS 11\\_0 like Mac OS X) \n\nAppleWebKit/604.1.34\
    \ (KHTML, like Gecko) Version/11.0 \n\nMobile/15A5341f Safari/604.1\n\nIf a developer\
    \ wants to check whether the user is on an iPad, they can check whether \n\nthe\
    \ user agent contains the word **iPad**. But what if they want to check whether\
    \ the user \n\nis using Safari? If they look for the word **Safari**, it will\
    \ work on iPad, but, if you look at \n\nChrome's user agent, it also has the word\
    \ Safari, so we would think that Chromium is \n\nSafari. User agents are a mess.\n\
    \nIf Puppeteer wants to emulate devices correctly, it needs to change the User-Agent\
    \ in \n\ntwo places. First, it needs to change the User-Agent request header (https://www.\n\
    \nhardkoded.com/ui-testing-with-puppeteer/userAgent) sent to the server. \n\n\
    And second, as developers can also access the User-Agent from their JavaScript\
    \ code using \n\nthe navigator.userAgent property, the browser needs to change\
    \ the value of that \n\nproperty as well. With these changes, both the server\
    \ and the client will get a User-Agent \n\nthat a real device would send.\n\n\
    Now it's time to see how we apply all this in our Puppeteer code."
  merge: -1
  pgno: 221
- img_proc: true
  md: "Emulating mobile devices 207\n\n**Emulating mobile devices with Puppeteer**\n\
    \nYou toggle the emulation mode by calling page.emulate(options). I honestly think\
    \ \n\nthat the name options is wrong there. Compared with the other options we\
    \ have seen in \n\nthis book, this options argument is mandatory. The object will\
    \ contain all the required \n\ndata Puppeteer needs to emulate a device:\n\n•\
    \  viewport is the first property, and it includes the definition of the viewport\
    \ and \n\na little bit more:\n\na) width, representing the viewport width.\n\n\
    b) height, representing the viewport height.\n\nc) deviceScaleFactor, which is\
    \ the pixel ratio we talked about before.\n\nd) isMobile is a Boolean property\
    \ that will make the browser consider the meta \n\nviewport tag. You can read\
    \ more about this on the MDN site (https://www.\n\nhardkoded.com/ui-testing-with-puppeteer/viewportMetaTag).\n\
    \ne) hasTouch is a Boolean that will enable touch support.\n\nf) isLandscape is\
    \ a Boolean that will emulate a device in landscape mode.\n\n• The userAgent property\
    \ will allow us to change the user agent on the request \n\nheader and JavaScript,\
    \ as we saw in the previous section.\n\nI have some good news and some bad news\
    \ for you. Good news first. The puppeteer \n\nclass has a property called devices.\
    \ It's a dictionary containing over 70 devices. We \n\ncould do something like\
    \ this in our code:\n\nconst iPhone = puppeteer.devices\\['iPhone 6'\\];\n\nawait\
    \ page.emulate(iPhone);\n\nThat's the good news. The bad news is that you have\
    \ to go to the source code for you to \n\nknow the available list of devices:\
    \ https://www.hardkoded.com/ui-testing-\n\nwith-puppeteer/DeviceDescriptors. That's\
    \ not ideal. The other option would be \n\ngrabbing any Puppeteer code you have\
    \ and printing the keys of the devices object:\n\nconsole.log(Object.keys(puppeteer.devices));"
  merge: -1
  pgno: 222
- img_proc: true
  md: "208 Environments emulation\n\nIf you do that, you will get all the devices\
    \ included in Puppeteer. The other bad news is \n\nthat the list of devices is\
    \ not as up to date as you might expect. But I think it makes sense. \n\nFirst,\
    \ because we get new devices every month, and keeping that list updated would\
    \ be \n\na tough job. And second, the website you want to automate shouldn't need\
    \ to be tested \n\non every single device. I think you should be able to have\
    \ good test coverage using the \n\nprovided devices. \n\nIf you do need to test\
    \ a specific device, you could browse the spec on the web and \n\nmanually pass\
    \ a device setting. *yesviz.com* (https://yesviz.com/devices.php) \n\nhas a nice\
    \ list of devices' viewports. You can find a list of user agents at *DeviceAtlas*\
    \ \n\n(https://deviceatlas.com/blog/list-of-user-agent-strings).\n\nIf we want\
    \ to emulate an iPhone 12 device, which is not on the devices list, we can do\
    \ \n\nsomething like this:\n\nawait page.emulate({\n\n userAgent:\n\n 'Mozilla/5.0\
    \ (iPhone; CPU iPhone OS 12\\_0 like Mac \n\nOS X) AppleWebKit/605.1.15 (KHTML,\
    \ like Gecko) Version/12.0 \n\nMobile/15E148 Safari/604.1',\n\n viewport: {\n\n\
    \ width: 360,\n\n height: 780,\n\n deviceScaleFactor: 3,\n\n isMobile: true,\n\
    \n hasTouch: true,\n\n isLandscape: false,\n\n },\n\n});\n\nAt the time of writing\
    \ this book, I wasn't able to find the user agent sent by an iPhone 12, \n\nso\
    \ I'm using the one from the iPhone XR. But if you are using this as a test tool,\
    \ it would \n\nbe a matter of asking your development team which values they are\
    \ checking so you can \n\nthen test the different user agents used by the team.\n\
    \nThat takes us on to the next questions. How do we apply all these new concepts?\
    \ How \n\nshould we test mobile emulation?"
  merge: -1
  pgno: 223
- img_proc: true
  md: "Emulating mobile devices 209\n\n**Testing mobile UX**\n\nFirst, you need to\
    \ check for **behavior changes**. Good developers make a great effort to \n\n\
    give the best experience based on the device they infer you are using. Let's see\
    \ how the \n\nwww.packtpub.com website looks on mobile:\n\nThe packtpub site on\
    \ an iPhone X\n\nAs we can see, the experience changes completely. The top menu\
    \ is changed to \n\na hamburger menu, and now you need to click on the magnifying\
    \ glass to search \n\nfor a book.\n\nIf you care about UI regressions, you will\
    \ need to identify the different **layout changes**. \n\nGrids could become lists,\
    \ and sections might be removed entirely to simplify the UI, fit \n\nthe content\
    \ on the screen, and make the user experience much nicer. \n\nYou might be thinking,\
    \ \"OK, but how do I test all that? Which devices should I test, all \n\nof them?\"\
    . In order to know which devices to test, we need to know a little bit about \n\
    \n**breakpoints**. No, not debugging breakings, **media query breakpoints**. Media\
    \ query \n\nbreakpoints are points that a developer can use to apply a different\
    \ set of CSS styles based \n\non the viewport width or height.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_224_0.png)"
  merge: -1
  pgno: 224
- img_proc: true
  md: "210 Environments emulation\n\nDo you remember how when we talked about generating\
    \ PDF files, we mentioned that \n\ndevelopers could use @media print to determine\
    \ the style used to print a page? Well, \n\n@media print is not the only option\
    \ we have there. We can also do stuff such as this:\n\n/\\* Extra small devices\
    \ (phones, 600px and down) \\*/\n\n@media only screen and (max-width: 600px) {...}\n\
    \n/\\* Small devices (portrait tablets and large phones, 600px and \n\nup) \\\
    */\n\n@media only screen and (min-width: 600px) {...}\n\n/\\* Medium devices (landscape\
    \ tablets, 768px and up) \\*/\n\n@media only screen and (min-width: 768px) {...}\n\
    \n/\\* Large devices (laptops/desktops, 992px and up) \\*/\n\n@media only screen\
    \ and (min-width: 992px) {...}\n\n/\\* Extra large devices (large laptops and\
    \ desktops, 1200px and \n\nup) \\*/\n\n@media only screen and (min-width: 1200px)\
    \ {...}\n\nThis example is taken from the *w3schools* site (https://www.hardkoded.com/\n\
    \nui-testing-with-puppeteer/breakpoints). We can see that developers can set \n\
    \nspecific styles depending on the width of the viewport. Functionally speaking,\
    \ these days, \n\nwe talk about five types of device categories:\n\n• Mobile phones\
    \ in portrait (up to 600 px)\n\n• Tablets in portrait (up to 900 px)\n\n• Tablets\
    \ in landscape (up to 1,200 px)\n\n• Desktops (up to 1,800 px)\n\n• Big desktops\
    \ (bigger than 1,800 px)\n\nThese numbers are relative, and you should team up\
    \ with the development team and see \n\nwhich breakpoints they are using, and\
    \ you should try to test edge scenarios using those \n\nbreakpoints."
  merge: -1
  pgno: 225
- img_proc: true
  md: "Emulating mobile devices 211\n\nSo maybe once you have met with the development\
    \ team, you find that, based on the \n\nbreakpoints they use, you should test\
    \ the following devices:\n\n• iPhone 6\n\n• iPad\n\n• iPad Landscape\n\n• A desktop\
    \ with a viewport of 1,280x1,080\n\nWe could improve our UI regression tests and\
    \ test those devices:\n\nit('Should visually match', async() => {\n\n for(const\
    \ device of \\['iPhone 6', 'iPad', 'iPad landscape', \n\n''\\])\n\n {\n\n const\
    \ target = differencify.init({ chain: false, testName: \n\n'Home ' + device });\n\
    \n await target.launch();\n\n const page = await target.newPage();\n\n if(device)\
    \ {\n\n await page.emulate(puppeteer.devices\\[device\\]);\n\n } else {\n\n await\
    \ page.setViewport({ width: 1600, height: 1200 });\n\n }\n\n await page.goto(config.baseURL);\n\
    \n const image = await page.screenshot();\n\n const result = await target.toMatchSnapshot(image)\n\
    \n await page.close();\n\n await target.close();\n\n expect(result).to.be.true;\n\
    \n }\n\n});\n\nHere, I grabbed the same code from the previous chapter, but I\
    \ wrapped it in a for loop \n\nthat will iterate through the four devices we picked.\
    \ We will assume that an empty string \n\nwill be the default. If we get a device\
    \ in the loop, we call the emulate function. If not, we \n\nset the **viewport**\
    \ we had before."
  merge: -1
  pgno: 226
- img_proc: true
  md: "212 Environments emulation\n\nLastly, if you want to emulate user taps, you\
    \ can replace calls to the click function with \n\na call to the tap function.\
    \ The tap function works just like the click function, but \n\ninstead of using\
    \ mouse emulation, it will use touchscreen emulation.\n\nNow we have UI regression\
    \ tests for mobile devices.\n\n**Tip**\n\nDevice emulation is not only for UI\
    \ testing. Web developers can benefit from \n\nthis feature to check how a page\
    \ looks on different devices. In the same way \n\nthat we coded this test, you\
    \ can create a small script that can loop through \n\nmany devices, navigate a\
    \ page, and take screenshots. Then you can check \n\nwhether something is broken\
    \ or not.\n\nIf you want to test a page's behavior on mobile devices, it won't\
    \ be much different from \n\nthe different Puppeteer tests we've been writing.\
    \ You could create a new test file for mobile \n\nand add your tests there. You\
    \ could create a homepage.iPhone.tests.js, and do \n\nsomething like this in the\
    \ beforeEach function:\n\nbeforeEach(async () => {\n\n page = await browser.newPage();\n\
    \n await page.emulate(puppeteer.devices\\['iPhone 6'\\]);\n\n page.setDefaultTimeout(config.timeout);\n\
    \n pageModel = new LoginPageModel(page, config);\n\n await pageModel.go();\n\n\
    })\n\nThe only thing new there is the call to the emulate function. From there,\
    \ it is up to \n\nyou to evaluate which tests you want to write for iPhone and\
    \ which tests you don't. For \n\ninstance, you might want to test layout changes,\
    \ but tests such as prices or stock checks \n\nshould be the same no matter the\
    \ device.\n\nIn this section, we learned how to emulate different viewports, user\
    \ agents, and touch \n\ndevices. But there is more. Let's move on to bandwidth\
    \ emulation.\n\n**Emulating network conditions**\n\nNetworking is a challenging\
    \ topic in computer science. If you tell a network engineer that \n\nChromium\
    \ emulates a 4G network, they will ask you to show them how it can emulate \n\n\
    radio tower and weather conditions. Chromium does not pretend to emulate a network\
    \ \n\nbut a network condition. Chromium limits the scope to three variables that\
    \ affect web \n\ndevelopment: Download speed, Upload speed, and Latency. That's\
    \ it."
  merge: -1
  pgno: 227
- img_proc: true
  md: "Emulating network conditions 213\n\nEmulating network conditions is something\
    \ that you can now do on Chromium. You can \n\nopen the developer tools and go\
    \ to the **Network** tab, and you will find a drop-down list \n\ncalled throttling\
    \ with the **Online** option selected by default, as in the following screenshot:\n\
    \nEmulating network conditions on Chromium\n\nIf you click on that drop-down list,\
    \ you will find three other options: **Fast 3G**, **Slow 3G**, \n\nand **Offline**.\
    \ Another cool feature is that you will be able to add custom profiles. There\
    \ you \n\nwill be asked about three variables we mentioned before, download, upload,\
    \ and latency, \n\nand additionally, to provide a name so you can identify your\
    \ new profile.\n\nEmulating different network conditions is not something you\
    \ want to add to every UI test. \n\nWe want our tests to be as fast as possible.\
    \ But it's a great tool to perform tests on demand. \n\nFor instance, say one\
    \ user of your e-commerce site reports that they're unable to finish the \n\n\
    checkout process when they're using 4G. The company doesn't want to leave mobile\
    \ users \n\nout, so they improve the site to work better on 4G. Now we have to\
    \ write a test to ensure \n\nthat the page will work on 4G.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_228_0.png)"
  merge: -1
  pgno: 228
- img_proc: true
  md: "214 Environments emulation\n\nYou can emulate different network conditions\
    \ by calling page.\n\nnetworkConditions(networkConditions), where networkConditions\
    \ is an \n\nobject with the following properties: \n\n•  download: Download speed\
    \ (bytes/sec). -1 disables download throttling.\n\n•  upload: Upload speed (bytes/sec).\
    \ -1 disables upload throttling.\n\n•  latency: Minimum latency from the request\
    \ sent to response headers received \n\n(ms).\n\nThe puppeteer object has a property\
    \ called networkConditions that provides two \n\nnetwork settings: 'Slow 3G' and\
    \ 'Fast 3G'. This is how you can use them according \n\nto the official documentation:\
    \ \n\nconst puppeteer = require('puppeteer');\n\nconst slow3G = puppeteer.networkConditions\\\
    ['Slow 3G'\\];\n\n(async () => {\n\n const browser = await puppeteer.launch();\n\
    \n const page = await browser.newPage();\n\n await page.emulateNetworkConditions(slow3G);\n\
    \n // other actions...\n\n await browser.close();\n\n})();\n\nBut we are not limited\
    \ to the two options Puppeteer provides. We can create our \n\nown settings, or\
    \ find examples on GitHub. For instance, The *porchmark* project \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/porchmark)\
    \ \n\nhas a great list. The project is under the MIT license so we can use it\
    \ freely.\n\nThese are some values we can get from that project, and then use\
    \ them in our own code to \n\nemulate different network conditions:\n\nconst NETWORK\\\
    _PRESETS = {\n\n GPRS: {\n\n download: 50 \\* 1024 / 8,\n\n upload: 20 \\* 1024\
    \ / 8,\n\n latency: 500,\n\n },\n\n Good3G: {\n\n download: 1.5 \\* 1024 \\* 1024\
    \ / 8,"
  merge: -1
  pgno: 229
- img_proc: true
  md: "Emulating network conditions 215\n\n upload: 750 \\* 1024 / 8,\n\n latency:\
    \ 40,\n\n },\n\n Regular4G: {\n\n download: 4 \\* 1024 \\* 1024 / 8,\n\n upload:\
    \ 3 \\* 1024 \\* 1024 / 8,\n\n latency: 20,\n\n }\n\n};\n\nexport default NETWORK\\\
    _PRESETS;\n\nThere are more in that repository. You can see the full list here:\
    \ https://www.\n\nhardkoded.com/ui-testing-with-puppeteer/porchmark-presets. If\
    \ \n\nyou want to incorporate that file, you will need to rename the downloadThroughput\
    \ \n\nproperty to download and uploadThroughput to upload, and remove the offline\
    \ \n\nproperty. You will also find the networkPresets.js file in the project of\
    \ this chapter \n\nwith all the replacements already made.\n\nWe could test our\
    \ login on a \"Good 3G\" network with all this information. We can go to \n\n\
    our login.tests.js file and add this test:\n\nit('Should login on 3G', async()\
    \ => {\n\n await page.emulateNetworkConditions(NetworkPresets.Good3G);\n\n await\
    \ pageModel.login(config.username, config.password);\n\n await page.waitForSelector('.thumbnail.card');\n\
    \n});\n\nThis is the same test as **Should login**, but adding a call to the \n\
    \nemulateNetworkConditions function. If we don't want to use a NetworkPresets\
    \ \n\nfile, we could hardcode our network condition. Let's see how we can call\
    \ page.\n\nemulateNetworkConditions using our own settings:\n\nit('Should login\
    \ on 3G with custom settings', async() => {\n\n await page.emulateNetworkConditions(\n\
    \n {\n\n download: 750 \\* 1024 / 8,\n\n upload: 250 \\* 1024 / 8,\n\n latency:\
    \ 100,\n\n });"
  merge: -1
  pgno: 230
- img_proc: true
  md: "216 Environments emulation\n\n await pageModel.login(config.username, config.password);\n\
    \n await page.waitForSelector('.thumbnail.card');\n\n});\n\nThe end result will\
    \ be the same. You can also have a fixed preset and add it to our existing \n\n\
    config.js file.\n\nWe already covered a lot of ground in this chapter. In this\
    \ section, we learned how to \n\nemulate different network conditions. We also\
    \ learned how to execute methods from the \n\nDevTools protocol that are not exposed\
    \ in the Puppeteer API. Now it's time to learn about \n\nlocalization.\n\n**Emulating\
    \ localization**\n\nI love this topic. Maybe because English is not my mother\
    \ tongue, so I have seen and felt \n\nthe pain when a site fails to honor other\
    \ cultures.\n\nThere are many debates about what localization is, what internationalization\
    \ is, and the \n\ndifference between them. While I bet there will be debate over\
    \ whether I should treat both \n\nas a whole or not, we will treat both as a whole.\n\
    \nWhen we talk about localization, we're saying that a website should honor its\
    \ audience:\n\n• It should honor their language.\n\n• It should honor their culture,\
    \ such as how they read numbers, sort information, and \n\nread the content.\n\
    \n• It should honor their beliefs. For example, Green/Good Red/Bad might not apply\
    \ \n\nin every culture.\n\nLocalization is a feature.\n\nIdeally, every site on\
    \ the web should consider localization. But localization can be quite \n\na costly\
    \ feature to implement. There is a high chance that your company is not Google\
    \ \n\nor Amazon and you cannot afford to localize your site for every culture,\
    \ so you need to \n\nknow your audience.\n\nYou might be thinking: \"I'm just\
    \ a QA analyst. Should I care about that?\". Let me tell you \n\nthis: You should\
    \ be the number-one person in the company defending and honoring your \n\ncustomers'\
    \ culture.\n\nLet me share a few real-life examples of having a clear scope of\
    \ your audience."
  merge: -1
  pgno: 231
- img_proc: true
  md: "Emulating localization 217\n\nI have found many times that buying local train\
    \ tickets in Europe can be hard. They are \n\nonly in the local language, or the\
    \ English version of the site is extremely poor. The scope is \n\nevident. This\
    \ site is for local people. If you are a tourist, go to *Rail Europe*.\n\nOne\
    \ colleague from the United States wanted to buy a flight ticket on a Chilean\
    \ website. \n\nHe went to that site and found a flight at $186.992. He thought\
    \ the flight price was 186 \n\ndollars and 992 cents. In fact, it was one hundred\
    \ and eighty-six thousand, nine hundred \n\nand ninety-two Chilean pesos. The\
    \ site didn't consider the way that my friend reads \n\nnumbers. He wasn't part\
    \ of the site's audience.\n\nOn the bright side, if you go to www.google.com,\
    \ you will always get the site in your \n\npreferred language. The world is their\
    \ audience.\n\nIf I go to www.kayak.com, I will get prices in my local currency,\
    \ because I'm part of \n\ntheir audience. This is the full list of countries you\
    \ will find on Kayak's website:\n\nKayak's audience\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_232_0.png)"
  merge: -1
  pgno: 232
- img_proc: true
  md: "218 Environments emulation\n\nThis might look like just a list of countries\
    \ in Kayak. But that's, in fact, the definition of \n\ntheir audience.\n\nIf you\
    \ don't know your site's audience, ask for it, and defend it in your tests.\n\n\
    Before getting into the code, there is one more thing you need to know regarding\
    \ \n\nlocalization. There is no one way to implement it, and Puppeteer won't cover\
    \ every \n\nscenario. But, let's take a look at the things we will be able to\
    \ do with Puppeteer.\n\n**Emulating geolocation**\n\nWith Puppeteer, we will be\
    \ able to change the geolocation used by pages using the \n\nGeolocation API (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/geolocalization). I chose those words carefully. You won't be able\
    \ \n\nto emulate geolocation completely. Most sites use IP-based geolocation.\
    \ That means \n\nthat when a site gets a request from your device, it will grab\
    \ the IP, and it will infer your \n\ncountry based on an IP-to-country table they\
    \ have on their server. In other words, you \n\nwon't be able to change the country\
    \ on *Netflix.com*.\n\nSo, what can we emulate? You will be able to emulate client-side\
    \ geolocation, such as \n\nmaps.google.com or even the google.com search itself.\
    \ \n\nLet's say we want to make Google tell us where to eat, but in Paris. We\
    \ can do something \n\nlike this:\n\nconst browser = await puppeteer.launch({\
    \ headless: false, \n\ndefaultViewport: null});\n\nconst page = await browser.newPage();\n\
    \nconst context = browser.defaultBrowserContext();\n\nawait context.overridePermissions('https://www.google.com/',\
    \ \n\n\\['geolocation'\\]);\n\nawait page.setGeolocation({latitude: 48.8578349,\
    \ longitude: \n\n2.3249841});\n\nawait page.goto('https://www.google.com/');\n\
    \nawait page.type('\\[name=\"q\"\\]', 'where to eat');\n\nawait page.keyboard.press('Enter');\n\
    \nawait browser.close();"
  merge: -1
  pgno: 233
- img_proc: true
  md: "Emulating localization 219\n\nLet's go through this code. You can find this\
    \ script in the wheretoeat.js file. We \n\nalready know what puppeteer.launch\
    \ and browser.newPage do. The third line \n\nhas something new: browser.defaultBrowserContext.\
    \ OK, that's new for us, but \n\nthat's not a big deal. It will give us the context\
    \ of the new page we got in the previous line.\n\nThe next line does have something\
    \ interesting: context.overridePermissions. \n\nThis function allows us to bypass\
    \ many permission checks that Chromium performs. \n\nIf you open Google for the\
    \ first time and you search for \"where to eat,\" you will get \n\nsomething like\
    \ this:\n\nGeolocation permission request\n\nThat window is not something you\
    \ can click on with Puppeteer. As we can't click on \n\nthat, Puppeteer provides\
    \ context.overridePermissions to tell the browser \n\nwhich permissions we want\
    \ to grant automatically. The signature is quite simple: \n\nbrowserContext.overridePermissions(origin,\
    \ permissions), where \n\norigin is the page (the URL) we want to grant permission,\
    \ and permissions is an \n\narray of strings accepting one of the following values:\n\
    \n• geolocation\n\n• midi\n\n• midi-sysex\n\n• notifications\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_234_0.png)"
  merge: -1
  pgno: 234
- img_proc: true
  md: "220 Environments emulation\n\n• push\n\n• camera\n\n• microphone\n\n• background-sync\n\
    \n• ambient-light-sensor\n\n• accelerometer\n\n• gyroscope\n\n• magnetometer\n\
    \n• accessibility-events\n\n• clipboard-read\n\n• clipboard-write\n\n• payment-handler\n\
    \nYou don't need to remember all these values; just come to this list when you\
    \ get \n\na permission request, and you need to know which value to use.\n\nThe\
    \ next line is a fun one: await page.setGeolocation({latitude: \n\n48.8578349,\
    \ longitude: 2.3249841}). This function is also fairly \n\nstraightforward. It\
    \ only expects an object with three properties: latitude, which is \n\na number\
    \ between -90 and 90; longitude, which is a number between -180 and 180; \n\n\
    and accuracy.\n\n**Pro tip**\n\nIf you want to know the coordinates of a place,\
    \ you can go to Google \n\nMaps (https://www.google.com/maps) and search for a\
    \ place. \n\nThe resulting URL will give you the coordinates. For instance, if\
    \ you \n\nsearch for Paris, the URL should be https://www.google.com/\n\nmaps/search/Paris/@48.8590448,2.3257917,14.49z;\
    \ \n\n48.8590448 will be the latitude, and 2.3257917 the longitude.\n\nAfter setting\
    \ the geolocation, we can navigate to Google, type **where to eat**, and the result\
    \ \n\nwill be where to eat in Paris:"
  merge: -1
  pgno: 235
- img_proc: true
  md: "Emulating localization 221\n\nWhere to eat in Paris\n\nPuppeteer allows us\
    \ to emulate not only a location but also a time zone. Let's see how we \n\ncan\
    \ travel around the globe with Puppeteer.\n\n**Emulating time zones**\n\nFinding\
    \ a use case for time zone emulation is not easy, but there are a few. You can\
    \ \n\nemulate time zones to test an application in some specific time zone, even\
    \ if you are not \n\nthere. This will be helpful when we talk about scraping in\
    \ the next chapter.\n\nOne check that can be interesting is testing that your\
    \ application saves data correctly, no \n\nmatter the time zone.\n\nThe function\
    \ to emulate time zones is pretty straightforward: page.\n\nemulateTimezone(timezoneId),\
    \ where timezoneId is an ICU's time zone. \n\nChromium also has a list of ICU\
    \ time zones in its source code. You can find it using the \n\nfollowing link:\
    \ https://www.hardkoded.com/ui-testing-with-puppeteer/\n\nmetazones.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_236_0.png)"
  merge: -1
  pgno: 236
- img_proc: true
  md: "222 Environments emulation\n\nIf you want to test this feature, you can try\
    \ changing your time zone and going to a site \n\nthat shows your current date.\
    \ You can follow this script in the timezones.js file:\n\nconst browser = await\
    \ puppeteer.launch({ headless: false, \n\ndefaultViewport: null});\n\nconst page\
    \ = await browser.newPage();\n\nawait page.emulateTimezone('Europe/London')\n\n\
    await page.goto('https://www.unixtimestamp.com/');\n\nawait browser.close();\n\
    \nThere we set the time zone to \"Europe/London,\" and go to https://www.\n\n\
    unixtimestamp.com/, which shows dates and times in different formats. Not a fancy\
    \ \n\nfeature, but it might be useful someday.\n\nThe last thing we want to cover\
    \ on this localization topic is language.\n\n**Emulating languages**\n\nDelivering\
    \ the website in the user's language is the first thing developers cover when\
    \ \n\nimplementing localization. But there's one problem in our ecosystem. Let's\
    \ cover the four \n\ncommon ways developers implement localization.\n\nYou will\
    \ see sites that will show you the content **based on your IP**. If it detects\
    \ your IP is \n\nfrom Spain, it'll show you content in Spanish. If it detects\
    \ you're in France, it'll show you \n\nthe site in French. What if you live in\
    \ a country with five official languages? It just picks \n\none. As we mentioned\
    \ when we talked about geolocation, we won't be able to emulate \n\nIP-based language\
    \ change.\n\nDevelopers could also deliver **domain-based** solutions. If you\
    \ go to www.amazon.es, \n\nyou will see the content in Spanish. If you go to www.amazon.fr,\
    \ you will see content \n\nin French. This will be easy to test. You just need\
    \ to create a language domain map and \n\nuse it in your tests.\n\nThird, developers\
    \ might offer a **preference-based** solution. If you go to www.amazon.\n\ncom,\
    \ you'll get the content in English, but it will show you a drop-down list somewhere\
    \ \n\nto change your language. This one will also be easy to test. You could have\
    \ one user \n\nper language in your test database, and then use them to test the\
    \ website in different \n\nlanguages."
  merge: -1
  pgno: 237
- img_proc: true
  md: "Emulating localization 223\n\nThe last option I will cover here, although maybe\
    \ there are more, is the one I believe is \n\nthe proper way of inferring the\
    \ user language: by reading the **Accept-Language header** \n\nvalue. According\
    \ to MDN (https://www.hardkoded.com/ui-testing-with-\n\npuppeteer/Accept-Language),\
    \ \"*the Accept-Language request HTTP header *\n\n*advertises which languages\
    \ the client is able to understand, and which locale variant is *\n\n*preferred.\
    \ (By languages, we mean natural languages, such as English, and not programming\
    \ *\n\n*languages.) Using content negotiation, the server then selects one of\
    \ the proposals, uses it and *\n\n*informs the client of its choice with the Content-Language\
    \ response header*.\"\n\nThe browser tells the server which languages you prefer.\
    \ When you navigate to a page, and \n\non every subsequent request after that,\
    \ the browser adds the **Accept-Language** header so \n\nthat the server can act\
    \ accordingly.\n\nWhen you install a Browser, it will have a default list of languages,\
    \ based on the download \n\noption you chose or the language of your Operative\
    \ System. But you can then go to \n\nthe preferences page and change that list\
    \ of languages. If you go to your browser's \n\npreferences, you should be able\
    \ to find a **Languages** section. You should be able to see \n\nsomething like\
    \ this:\n\nLanguage settings in Microsoft Edge\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_238_0.png)"
  merge: -1
  pgno: 238
- img_proc: true
  md: "224 Environments emulation\n\nThere, I have three languages: English (United\
    \ States), English, and Spanish. All those \n\nthree are set in the Accept-Language\
    \ header. Sadly for us, according to Paul Reinheimer \n\n(https://twitter.com/preinheimer),\
    \ only 7.2% of the top 10,000 sites \n\nsupported Accept-Language in 2017 (https://wonderproxy.com/blog/accept-\n\
    \nlanguage/). That means that despite having the tools to infer the language based\
    \ on the \n\nuser's preference, most sites won't use it. I hope that changes over\
    \ time. How can we test \n\nlanguages using the Accept-Language header? It's not\
    \ that hard:\n\nconst browser = await puppeteer.launch({headless: false, \n\n\
    defaultViewport: null});\n\nconst page = await browser.newPage();\n\nawait page.setExtraHTTPHeaders({\n\
    \n 'Accept-Language': 'fr'\n\n});\n\nawait page.goto('https://www.google.com/');\n\
    \nawait browser.close();\n\nThis is a way you can get Google's website in French.\
    \ We will talk more about page.\n\nsetExtraHTTPHeaders in the next chapter. But\
    \ what you need to know is that you will \n\nbe able to change the Accept-Language\
    \ header the server gets.\n\nI think we have now seen the most relevant emulation\
    \ features that Puppeteer offers. But \n\nI don't want you to miss anything. Let\
    \ me briefly show you a few more emulation tools.\n\n**Other emulations**\n\n\
    To wrap up this chapter, I want to share three extra emulation functions with\
    \ you.\n\nThe first one is related to **accessibility**. Localization and accessibility\
    \ are two human \n\ntopics. They talk about integration, about not leaving anyone\
    \ out, not even from the web. \n\nI believe that your website could leave certain\
    \ cultures out (read these words in context, \n\nplease). You could say, \"I don't\
    \ plan to sell my products to this country, so I don't need \n\nto translate my\
    \ site to X.\" As we said, localization could be expensive. But we do have to\
    \ \n\ndesign sites to be inclusive. I think that in the same way we enforce shopping\
    \ malls to \n\nhave ramps for wheelchairs, we should enforce websites to be accessible.\
    \ I could write lots \n\nof pages about this, but that's not the purpose of this\
    \ book. But I encourage you to read \n\nabout inclusive design on Microsoft's\
    \ site: https://www.microsoft.com/design/\n\ninclusive/. I will leave you with\
    \ this quote from that site:\n\n*Exclusion happens when we solve problems using\
    \ our own biases.*"
  merge: -1
  pgno: 239
- img_proc: true
  md: "Other emulations 225\n\nI'm taking the time to write these paragraphs in a\
    \ UI testing book because I believe \n\nthat Quality Assurance is the last line\
    \ of defense for defending and including all users \n\nof the web.\n\nPuppeteer\
    \ won't cover every accessibility check you should do, but it will \n\nhelp you\
    \ emulate different vision deficiencies. You can call the page.\n\nemulateVisionDeficiency(type)\
    \ function to emulate the following vision \n\ndeficiencies: **achromatopsia**\
    \ (total color blindness), **deuteranopia** (green color blindness), \n\n**protanopia**\
    \ (red color blindness), **tritanopia** (blue-yellow color blindness), and \n\n\
    **blurredVision**, to check blurred vision. Let's see how we can use this new\
    \ function:\n\nconst browser = await puppeteer.launch();\n\nconst page = await\
    \ browser.newPage();\n\nawait page.goto('https://www.packtpub.com/');\n\nawait\
    \ page.emulateVisionDeficiency('achromatopsia');\n\nawait page.screenshot({ path:\
    \ 'achromatopsia.png' });\n\nawait page.emulateVisionDeficiency('blurredVision');\n\
    \nawait page.screenshot({ path: 'blurred-vision.png' });\n\nawait browser.close();\n\
    \nIf you run this check, you will get this result:\n\nPacktpub under blurred vision\
    \ emulation\n\nYou could write checks such as this and share them in a dashboard,\
    \ so both the design \n\nand the development team can see how accessible the site\
    \ is for people with visual \n\nimpairments.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_240_0.png)"
  merge: -1
  pgno: 240
- img_proc: true
  md: "226 Environments emulation\n\nThe next emulation I want to share with you is\
    \ about emulating media features. The \n\nfunction is page.emulateMediaFeatures(features).\
    \ It accepts an array of \n\n**name/value** features you want to change. These\
    \ are the two features that Puppeteer \n\nsupports:\n\n•  prefers-colors-scheme,\
    \ which will help you toggle between dark and \n\nlight mode\n\n•  prefers-reduced-motion,\
    \ which will reduce CSS animations with the \n\nreduce option or no-preference\n\
    \nThis might not have been a popular feature a few years ago. But now, many sites\
    \ are \n\njumping onto the dark mode hype. This is how you can test dark mode:\n\
    \nconst browser = await puppeteer.launch();\n\nconst page = await browser.newPage();\n\
    \nawait page.goto('https://duckduckgo.com/');\n\nawait page.emulateMediaFeatures(\\\
    [{ name: 'prefers-color-\n\nscheme', value: 'dark' }\\]);\n\nawait page.screenshot({\
    \ path: 'dark.png' });\n\nawait browser.close();\n\nAs you can see, we can simply\
    \ navigate to a page and emulate prefers-color-scheme \n\nwith the value dark.\n\
    \nThe last emulation I want to share in this chapter is media type emulation.\
    \ We talked \n\nabout media types when we talked about PDF generation. We have\
    \ two media types: \n\n**screen** and **print**. This is an excellent feature\
    \ if you need to test how a page would be \n\nprinted. You could use it to test\
    \ the receipt page, which might be printed by the user.\n\nThe function is page.emulateMediaType(type),\
    \ and the type is a string that can \n\nbe screen or print:\n\nconst browser =\
    \ await puppeteer.launch();\n\nconst page = await browser.newPage();\n\nawait\
    \ page.goto('https://github.com/puppeteer/puppeteer');\n\nawait page.emulateMediaType('print');\n\
    \nawait page.screenshot({ path: 'print.png' });\n\nawait browser.close();\n\n\
    Here we go to the Puppeteer repo and check how it would look if we were about\
    \ to print \n\nthe page."
  merge: -1
  pgno: 241
- img_proc: true
  md: "Summary 227\n\n**Summary**\n\nThis was another chapter full of content. I hope\
    \ you enjoyed it as much as I enjoyed \n\nwriting it. \n\nWe started the chapter\
    \ by talking about the internet ecosystem. We talked about how the \n\nworld is\
    \ moving toward mobile experiences. This is an excellent time to reach out to\
    \ the \n\nperson in charge of analytics in your company and see whether the charts\
    \ we saw in this \n\nchapter represent your website's users.\n\nThen we moved\
    \ on to mobile emulation. There, we learn about the viewport, the pixel \n\nratio,\
    \ a fundamental concept in mobile resolution, touchscreen emulation, and the user\
    \ \n\nagent.\n\nWe also learned how to emulate different network conditions. We\
    \ will see in *Chapter 10*, \n\n*Evaluating and Improving the Performance of a\
    \ Website*, how critical speed is in the mobile \n\nexperience.\n\nAt the end\
    \ of this chapter, we covered localization emulation. We learned how to emulate\
    \ \n\ngeolocation, time zones, and languages.\n\nI didn't want to leave any emulation\
    \ out of this chapter. That's why we also learned \n\nabout other available emulations.\
    \ We covered accessibility, dark mode, and media type \n\nemulation. Testing dark\
    \ mode will become more important with all the dark mode hype \n\nwe live in these\
    \ days.\n\nThe next chapter will be about Scraping. We will demystify the concept\
    \ of scraping and \n\nlearn some new techniques so that you can use Puppeteer\
    \ not only for testing but also for \n\nother fun stuff."
  merge: -1
  pgno: 242
