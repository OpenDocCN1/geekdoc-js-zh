  md: "Creating a Puppeteer browser 63\n\n**Mobile options**\n\ndeviceScaleFactor,\
    \ isMobile, hasTouch, and isLandscape will help us set up \n\nmobile emulation.\
    \ We will cover these options more deeply in *Chapter 8*, *Environments *\n\n\
    *emulation*.\n\nAs you can see, puppeteer.launch() is way more than that, and\
    \ there are many \n\nothers for you to keep digging.\n\n**Options in practice**\n\
    \nNow let's see how we can apply these new features in the real world. The first\
    \ thing we can \n\ndo now, and you should do from now on, is to load the options\
    \ object from the config file. \n\nRemember that the config class we have is JavaScript\
    \ code. We can add a property there \n\ncalled launchOptions and pass that to\
    \ the launch function. You don't even need to \n\npopulate it if you don't want\
    \ to, but it will be there, ready to be used.\n\nYour config file will look like\
    \ this:\n\nmodule.exports = ({\n\n local: {\n\n baseURL: 'http://localhost:8080/',\n\
    \n launchOptions: { headless: false }\n\n },\n\n})\\[process.env.TESTENV || 'local'\\\
    ];\n\nNow, when we run these tests using the local config, it will launch the\
    \ browser in \n\nheadful mode. The next step is passing this option to the launch\
    \ function:\n\nbefore(async() => {\n\n browser = await puppeteer.launch(config.launchOptions);\n\
    \n});\n\nNow let's try to code a real-life test. We want to test that the login\
    \ action is being persisted \n\nafter closing a browser.\n\nThese are the steps:\n\
    \n1\\. Open a browser using a user data directory.\n\n2\\. Check that we are logged\
    \ out (checking that the login button says **Login**).\n\n3\\. Log in.\n\n4\\\
    . Check that we are logged in (checking that the logout button says **Logout**)."
  merge: -1
