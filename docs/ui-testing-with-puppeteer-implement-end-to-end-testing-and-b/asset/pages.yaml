  md: "64 Navigating through a website\n\n5\\. Close the browser.\n\n6\\. Open the\
    \ browser.\n\n7\\. We should be logged in.\n\nWe won't be able to reuse the browser\
    \ we are using in other tests because we will need to \n\ncreate our own user\
    \ data directory:\n\nit('It should persist the user', async() => {\n\n const userDataDir\
    \ = fs.mkdtempSync('profile');\n\n const options = config.launchOptions;\n\n options.userDataDir\
    \ = userDataDir;\n\n let persistentBrowser = await puppeteer.launch(options);\n\
    \n let persistentPage = await persistentBrowser.newPage();\n\n let loginModel\
    \ = new LoginPageModel(persistentPage, \n\nconfig);\n\n await loginModel.go();\n\
    \n (await loginModel.logState()).should.equal('Login');\n\n await loginModel.login(config.username,\
    \ config.password);\n\n (await loginModel.logState()).should.equal('Logout');\n\
    \n await persistentBrowser.close();\n\n persistentBrowser = await puppeteer.launch(options);\n\
    \n persistentPage = await persistentBrowser.newPage();\n\n loginModel = new LoginPageModel(persistentPage,\
    \ config);\n\n await loginModel.go();\n\n (await loginModel.logState()).should.equal('Logout');\n\
    \n \n\n await persistentBrowser.close();\n\n deleteFolderRecursive(userDataDir);\n\
    \n});\n\nThis test is longer than the others because we need to create a browser,\
    \ a page, and \n\na model twice. Ignore how the loginState and login functions\
    \ work. We will cover \n\nthose functions in the following chapters."
