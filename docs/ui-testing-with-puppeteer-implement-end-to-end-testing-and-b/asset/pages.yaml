  md: "52 Navigating through a website\n\nWe will cover the following topics in this\
    \ chapter:\n\n• Introducing the test site for this chapter\n\n• Creating a Puppeteer\
    \ browser\n\n• Navigating through a site\n\n• Using the Response object\n\n• Introduction\
    \ to Continuous Integration\n\nBy the end of this chapter, we will have tested\
    \ a real website, pushed it to GitHub, and \n\nrun our tests automatically, learning\
    \ many new APIs. Let's see what test sites we can use \n\nin this chapter.\n\n\
    **Technical requirements**\n\nYou will find all the code of this chapter in the\
    \ GitHub repository (https://github.\n\ncom/PacktPublishing/ui-testing-with-puppeteer)\
    \ under the Chapter3 \n\ndirectory. We will consider Chapter3 as the base path\
    \ for all the demos. Inside the \n\nChapter3 directory, you will find three directories:\n\
    \n•  vuejs-firebase-shopping-cart contains the test site.\n\n•  init is the directory\
    \ you can use to follow this chapter.\n\n•  demo contains the final code from\
    \ this chapter.\n\n**Introducing the tests sites for this chapter**\n\nIn this\
    \ chapter, we will test a site made with Vue.js. Thang Minh Vu (https://\n\nme.coddeine.com/)\
    \ wrote a great Vue.js example: **vuejs-firebase-shopping-cart** \n\n(https://github.com/ittus/vuejs-firebase-shopping-cart).\n\
    \n**Tip**\n\nWhen you look for projects on GitHub or any other site like GitHub,\
    \ you need \n\nto pay attention to the license the project uses. The fact that\
