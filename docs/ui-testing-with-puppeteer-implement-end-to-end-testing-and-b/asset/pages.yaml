  md: "Introduction to web scraping 235\n\n**Are you a human?**\n\nI bet no one in\
    \ real life has asked you whether you are a human, but many websites ask us \n\
    \nthat question all the time:\n\nBot check by reCAPTCHA\n\nWhat started as a simple\
    \ \"type the word you see\" turned into more and more complicated \n\nchallenges:\n\
    \nComplex CAPTCHAs\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_250_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_250_1.png)"
  merge: -1
  pgno: 250
- img_proc: true
  md: "236 Scraping tools\n\nShould we check the third square of the first row? Who\
    \ knows… But their goal is clear. \n\nIn a friendly way, using the UI, they want\
    \ to kick scrapers out.\n\nWhen a site puts a CAPTCHA, like the one in the previous\
    \ screenshot, it's not always \n\nbecause they don't want to be scraped. Maybe\
    \ they want to protect their users. They don't \n\nwant malicious bots to test\
    \ users and passwords or stolen credit card numbers. But the \n\nintention is\
    \ clear: that page is for humans.\n\nI call these validations a \"friendly\" way\
    \ to kick bots out. But you can also get some \n\nunfriendly responses from the\
    \ server:\n\nPage returning a 403 HTTP error\n\nIf a page you would typically\
    \ be able to access now returns a 403 when you scrape it, \n\nit means that the\
    \ server considered your actions as an attack on the server and banned \n\nyour\
    \ IP.\n\nThat's terrible news. It means that you won't be able to access that\
    \ site using your current \n\nIP. The ban could be for a few hours or forever.\
    \ That would also mean that if you share \n\nyour public IP with other computers,\
    \ for instance, inside an organization, no one will be \n\nable to access that\
    \ site. There are two ways to fix this issue. One is by reaching out to the \n\
    \nsite owner, apologizing, and asking them to remove your IP from the forbidden\
    \ list. Or \n\nyou could keep playing badly, trying to change your public IP or\
    \ using proxies. But if you \n\ngot caught once, you will get caught twice.\n\n\
    The last way a site can tell you not to scrape is by giving you an API.\n\n**Using\
    \ the Website API**\n\nIn this context, an API is a set of URLs that the website\
    \ exposes that instead of returning \n\na page, return some data, generally in\
    \ JSON format:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_251_0.png)"
  merge: -1
  pgno: 251
- img_proc: true
  md: "Introduction to web scraping 237\n\nWikipedia API\n\nThe question here is,\
    \ why would you waste time parsing HTML elements, wait for \n\nnetwork calls,\
    \ and so on, if you can hit a URL to get all the information you need? \n\nI think\
    \ this is an excellent way for a site to tell you: **hey, don't scrape me, here\
    \ is the data **\n\n**you might need. You are welcome to come here and fetch the\
    \ information you need**.\n\nAPIs also give the website's owner the chance to\
    \ set the rules, such as the rate limit \n\n(how many requests you can make per\
    \ second or minute), the data the API exposes, \n\nand what will remain hidden\
    \ for consumers.\n\nThese are some ways the site can communicate what we can and\
    \ can't do. But our attitude \n\ntoward the site being scraped is also important.\n\
    \n**Our attitude**\n\nThis part is quite simple, and it can be reduced to two\
    \ words: be nice. You have to think \n\nthat on the other side of the page you\
    \ are trying to scrape, there are people like you \n\nwhose goal is to keep the\
    \ site up and running. They have to pay for a server and network \n\nbandwidth.\
    \ Remember, they are not your enemy. They are your friends. They have the \n\n\
    data you need, so be nice.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_252_0.png)"
  merge: -1
  pgno: 252
- img_proc: true
  md: "238 Scraping tools\n\nYou should look at available APIs first. If a website\
    \ exposes an API with the data you want, \n\nthere is no need to scrape the site.\n\
    \nNext, you should consider your scraping rate/speed. Although you might want\
    \ to scrape \n\na site as fast as possible, I would try to make the scrape process\
    \ close to real user \n\ninteraction. Later in this chapter, we will see tools\
    \ to scrape pages in parallel, but I would \n\nuse those tools very carefully.\n\
    \nThere is one thing that many scrapers using Puppeteer forget. You should always\
    \ identify \n\nyourself as a bot. In the next section, we will see that the idea\
    \ is telling the server that you \n\nare a bot and not a real user.\n\nThe last\
    \ thing we need to consider is to evaluate what data we are extracting.\n\n**What's\
    \ the data we are scraping?**\n\nI think this is common sense. Are we extracting\
    \ copyrighted data? Are we extracting the \n\nassets of the site? For instance,\
    \ if we go to a lyrics website and extract the lyrics, we are \n\ntaking the very\
    \ purpose of the website. But if we go to an airline's website and check for \n\
    \nflight prices, the price is not the company's asset. They sell flights, not\
    \ prices.\n\nThe other thing to consider is what the data we extracted will be\
    \ used for. We should \n\nconsider whether our actions will empower the scraped\
    \ site, for instance, in the case of the \n\nhotel booking website, they might\
    \ get more customers, or threaten it, for instance, if we \n\nscrape lyrics to\
    \ create our own lyrics site.\n\nTruth be told, lots of the sites we know today\
    \ used scraping techniques to seed their \n\nwebsites. You might see that on real-estate\
    \ websites. Who would want to go to an empty \n\nreal-estate website? No one.\
    \ So, these websites would be seeded with postings from other \n\nwebsites to\
    \ make them more appealing to new customers.\n\nEnough theory. Let's create some\
    \ scrapers.\n\n**Creating scrapers**\n\nLet's try to scrape book prices from the\
    \ Packt site. The terms and conditions said \n\nnothing about scrapers (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/packtpub-terms). But the robots.txt file has some clear rules:\n\n\
    User-agent: \\*\n\nDisallow: /index.php/\n\nDisallow: /\\*?\n\nDisallow: /checkout/"
  merge: -1
  pgno: 253
- img_proc: true
  md: "Creating scrapers 239\n\nDisallow: /app/\n\nDisallow: /lib/\n\nDisallow: /\\\
    *.php$\n\nDisallow: /pkginfo/\n\nDisallow: /report/\n\nDisallow: /var/\n\nDisallow:\
    \ /catalog/\n\nDisallow: /customer/\n\nDisallow: /sendfriend/\n\nDisallow: /review/\n\
    \nDisallow: /\\*SID=\n\nThey don't want us to go to those pages. But the site\
    \ has a pretty massive sitemap.xml, \n\nwith over 9,000 lines. If robots.txt is\
    \ the \"don't go here\" sign for scrapers, \n\nsitemap.xml is the \"please, check\
    \ this out\" sign. These are the first items on the \n\nsitemap.xml file:\n\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"\
    \n\n xmlns:image=\"http://www.google.com/schemas/sitemap-\n\nimage/1.1\">\n\n\
    \ <url>\n\n <loc>https://www.packtpub.com/web-development</loc>\n\n <lastmod>2020-12-15T12:22:50+00:00</lastmod>\n\
    \n <changefreq>daily</changefreq>\n\n <priority>0.5</priority>\n\n </url>\n\n\
    \ <url>\n\n <loc>https://www.packtpub.com/web-development/\n\necommerce</loc>\n\
    \n <lastmod>2019-09-13T07:29:53+00:00</lastmod>\n\n <changefreq>daily</changefreq>\n\
    \n <priority>0.5</priority>\n\n </url>\n\n ...\n\n</urlset>"
  merge: -1
  pgno: 254
