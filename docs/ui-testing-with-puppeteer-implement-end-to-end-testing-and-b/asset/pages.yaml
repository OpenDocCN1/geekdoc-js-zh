  md: "190 Generating Content with Puppeteer\n\n**Creating HTML content**\n\nIn this\
    \ section, we will see a few simple features but pretty useful ones. You will\
    \ be able \n\nto follow the code from this section in the demohtml.js file. Most\
    \ of the time, you \n\nnavigate pages using the HTTP protocol as we did with Wikipedia.\
    \ If you open the \n\nmediaprint.html file, you navigated to that page using the\
    \ pseudo protocol \"file.\" \n\nAlthough it's not a real protocol, you should\
    \ know that with Puppeteer, you can also \n\nnavigate local files using a URL\
    \ such as file:///some/folder/of/my/computer/\n\nmediaprint.html.\n\nSo, if you\
    \ want to generate a social image, like the HolyJS conference one we saw in \n\
    \nthe first section, you could create a page on your website, navigate to that\
    \ page using \n\nPuppeteer, take a screenshot, and use that image in your social\
    \ post.\n\nYou could also have that file stored locally and navigate that file\
    \ using the file:// \n\nprotocol.\n\nWhat I want to show you in this section is\
    \ that you don't necessarily need to have a file \n\nin your file system to generate\
    \ that social image. You could have the HTML that you need \n\nin some external\
    \ source, for instance, a content database, load that HTML in an empty \n\npage,\
    \ and then take a screenshot.\n\nWe can do that using the setContent function.\
    \ The signature is quite simple: page.\n\nsetContent(html\\[, options\\]), where\
    \ html is the HTML to load, and the \n\noptions object, which supports two options\
    \ you might already know: timeout and \n\nwaitUntil. We need a timeout and a waitUntil\
    \ property because the HTML we \n\nare loading might involve network requests,\
    \ and we would need to wait for them.\n\nLet's say we are assigned the task of\
    \ creating that social media post. The content team \n\ntells us that we need\
    \ to use the content socialPostTemplate from the contentdb \n\ncomponent. We could\
    \ do something like this:\n\nconst puppeteer = require('puppeteer');\n\nconst\
    \ content = require('./contentdb');\n\n(async () => {\n\n const browser = await\
    \ puppeteer.launch({\n\n headless: true,\n\n defaultViewport: null});\n\n const\
    \ page = await browser.newPage();\n\n await page.setContent(content.socialPostTemplate);"
  merge: -1
  pgno: 205
- img_proc: true
  md: "Creating HTML content 191\n\n await page.screenshot({path:'fromhtml.png'});\n\
    \n await browser.close();\n\n})();\n\nWe load contentdb using the require function.\
    \ Then we call newPage, which will \n\ngive us an empty canvas, the about:blank\
    \ page. Once we have the empty canvas, we \n\nload the HTML using setContent,\
    \ take the screenshot, and close the page.\n\nOnce you call setContent, the page\
    \ will be fully functional. That means that you could \n\neven call the evaluate\
    \ function to customize and populate that template's values.\n\nOne thing to consider\
    \ is that the setContent function will override all the page content. \n\nYou\
    \ won't be able to append content using setContent.\n\nTwo more functions will\
    \ come in handy while creating new content. The first one is \n\npage.addScriptTag(options),\
    \ which will allow you to inject script tags into any \n\npage. These are the\
    \ options available:\n\n• You can pass url, to inject a JavaScript file from a\
    \ URL.\n\n• You can also use path to inject a JavaScript file from a local file.\n\
    \n• If you have the script in a memory variable, you can use content and set the\
    \ entire \n\nscript there.\n\n• Finally, you can pass type, which is the script\
    \ type you can set to a script element \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nscriptelement).\n\nYou can use these two functions when you want to inject new\
    \ functionality that wouldn't \n\nbe solved with just an evaluate function call.\n\
    \nWe also have page.addStyleTag(options). It's just like addScriptTag, but \n\n\
    instead of injecting a script, you can inject a CSS file or content. The addStyleTag\
    \ \n\nfunction has the same options as addScriptTag, except for the type option,\
    \ which \n\nis not a valid option of the link element used to add CSS files. If\
    \ we go back to PDF \n\ngeneration, you can use the following code to inject CSS\
    \ content before generating \n\na PDF file:\n\nawait page.addStyleTag({\n\n content\
    \ : \\`\n\n .search-input {\n\n display: none !important;\n\n }\\`"
  merge: -1
  pgno: 206
