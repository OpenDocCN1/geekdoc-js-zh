  md: "Our first Puppeteer code 17\n\nI would like to highlight two things here. As\
    \ this book is based on **Puppeteer 7**, we are \n\nspecifying the version as\
    \ @\">=7.0.0 <8.0.0\", which means that we want the latest \n\nPuppeteer version\
    \ greater than or equal to 7.0.0 and less than version 8.0.0. By \n\nforcing this\
    \ version to be used, you will be able to follow the examples in this chapter\
    \ \n\nusing the same version I used. \n\n**Puppeteer versioning**\n\nPuppeteer\
    \ follows the **Semantic Versioning Specification** (**SemVer**) to version \n\
    \ntheir releases, which means that those three numbers in the version follow \n\
    \na rule. A change in the major number (the first number) means that there was\
    \ \n\na breaking change in the API. When a package changes the major number, it\
    \ \n\ntells you that the new version might break your code. A change in the minor\
    \ \n\nnumber (the second number) means that they added new functionality, \n\n\
    maintaining backward compatibility. Lastly, a change in the patch number \n\n\
    means that they fixed a bug, maintaining backward compatibility.\n\nIf you see\
    \ that Puppeteer is in version 8, 9, or 10, it doesn't mean that this book \n\n\
    is now obsolete. It means that they changed something that broke someone \n\n\
    else's code. For instance, the change from version 6 to version 7 was just some\
    \ \n\nchange they made in the way they take screenshots.\n\nIn real life, you\
    \ can use the latest version available. And second, you might have noticed \n\n\
    that the package downloaded a specific version of Chromium, in this case, r848005.\
    \ \n\nThat doesn't mean that your code won't work with any version of Chromium\
    \ you \n\ndownload from the internet. But, remember, Puppeteer interacts with\
    \ the browser using \n\nthe Chrome DevTools Protocol, so it needs a version of\
    \ Chromium that reacts in the way \n\nPuppeteer expects. In the case of Puppeteer\
    \ v7.0.1, it needs Chromium 90.0.4403.0, and \n\nthere is no guarantee that any\
    \ other version of Chromium (newer or older) would work \n\nwith your current\
    \ Puppeteer version. It doesn't mean that it won't work. It means that \n\nit's\
    \ not guaranteed. You need to experiment and see. You can check which chromium\
    \ \n\nversion you should use for every version of Puppeteer on the API page (https://www.\n\
    \nhardkoded.com/ui-testing-with-puppeteer/puppeteer-api)."
  merge: -1
  pgno: 32
- img_proc: true
  md: "18 Getting started with Puppeteer\n\n**Hello world in Puppeteer**\n\nEvery\
    \ language has its own hello world program. Puppeteer's hello world program would\
    \ \n\nbe navigating to https://en.wikipedia.org/wiki/%22Hello,\\_World!%22\\_\n\
    \nprogram and taking a screenshot of the page. Let's see what it would look like:\n\
    \nconst puppeteer = require('puppeteer');\n\n(async function() {\n\n const browser\
    \ = await puppeteer.launch();\n\n const page = await browser.newPage();\n\n await\
    \ page.goto('https://en.wikipedia.org/wiki/%22Hello,\\_\n\nWorld!%22\\_program');\n\
    \n await page.screenshot({ path: './screenshot.png'});\n\n browser.close();\n\n\
    })();\n\nThis is what we are doing in this small script:\n\n1\\. We import the\
    \ Puppeteer library using require.\n\n2\\. Launch a new browser.\n\n3\\. Open\
    \ a new page (tab) inside that browser.\n\n4\\. Navigate to the Wikipedia page.\n\
    \n5\\. Take a screenshot.\n\n6\\. Close the browser.\n\nI love how simple and\
    \ easy it is to get started with Puppeteer. It's now time to run it. Using \n\n\
    the same terminal you used to run npm install, now run node index.js:\n\n**\\\
    > node index.js**\n\nA Chromium browser opened, navigated to Wikipedia, and closed\
    \ by itself. You didn't \n\nsee it because it was a headless browser, but it happened.\
    \ Now, if you check your working \n\ndirectory, you should have a new file called\
    \ screenshot.png:"
  merge: -1
  pgno: 33
- img_proc: true
  md: "Asynchronous programming in JavaScript 19\n\nScreenshot\n\nOur code worked\
    \ as expected. We got our screenshot from Wikipedia. \n\nI bet you noticed that\
    \ we used four **awaits** in our small hello puppeteer example. \n\nAsynchronous\
    \ programming plays a big role in Puppeteer. Let's now talk about \n\nasynchronous\
    \ programming in JavaScript.\n\n**Asynchronous programming in JavaScript**\n\n\
    Normally, a program runs synchronously, which means that each line of code is\
    \ executed \n\none after the other. Let's take, for instance, these two lines\
    \ of code:\n\n**const x = 3 + 4;**\n\n**console.log(x);**\n\nThose two lines will\
    \ run in order. The result of 3 + 4 will be assigned to the x constant, \n\nand\
    \ then the variable x will be printed on the screen using console.log. The \n\n\
    console.log function can't start until x is assigned.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_34_0.png)"
  merge: -1
  pgno: 34
- img_proc: true
  md: "20 Getting started with Puppeteer\n\nBut there are tasks, such as network requests,\
    \ disk access, or any other I/O operation, that \n\nare time-consuming, and we\
    \ don't necessarily want to wait for those tasks to finish to \n\nkeep executing\
    \ our code. For instance, we could start downloading a file, perform other \n\n\
    tasks while that file is loading, and then check that file when the download is\
    \ completed. \n\nAsynchronous programming will allow us to execute those long-running\
    \ tasks without \n\nblocking our code.\n\nAn asynchronous function returns a **Promise**\
    \ immediately to avoid blocking your code \n\nwhile waiting for a task. This Promise\
    \ is an object that can be in one of the following three \n\nstates: \n\n• **\
    \ Pending**: This means that the asynchronous task is still in progress.\n\n•\
    \ ** Fulfilled**: This means that the asynchronous task was completed successfully.\n\
    \n• ** Rejected**: This means that the asynchronous task has failed.\n\nLet's\
    \ say that we have a function called downloadAFileFromTheInternet. The most \n\
    \ncommon way to wait for a task to finish is to use the await keyword:\n\nawait\
    \ downloadAFileFromTheInternet();\n\nIt's important to highlight that the await\
    \ keyword here is not waiting for the function \n\nitself; it is waiting for the\
    \ Promise returned by that function. That means that you can \n\nalso assign that\
    \ Promise to a variable and await it later in the code:\n\nconst promise = downloadAFileFromTheInternet();\n\
    \n// some code\n\nawait promise;\n\nOr you can just not wait for the promise at\
    \ all:\n\ndownloadAFileFromTheInternet();\n\nIf you want to learn more about asynchronous\
    \ JavaScript, check out the *Asynchronous *\n\n*JavaScript Deep Dive* videos by\
    \ Steven Hancock (https://www.packtpub.com/\n\nproduct/asynchronous-javascript-deep-dive-video/9781800202665).\n\
    \nPuppeteer relies on asynchronous programming techniques because the communication\
    \ \n\nbetween Puppeteer and Chrome DevTools is asynchronous. After all, the communication\
    \ \n\nbetween Chrome DevTools and the browser is asynchronous. Think about what\
    \ would \n\nhappen under the hood when you click a link:"
  merge: -1
  pgno: 35
- img_proc: true
  md: "Asynchronous programming in JavaScript 21\n\nClick timeline\n\nWhen you call\
    \ page.click, the result of that action is not immediate. As we saw, there \n\n\
    are many things going on under the hood. When you call page.click, you will need\
    \ \n\nto do one of the things mentioned previously: await it; keep the promise\
    \ in a variable and \n\nawait it later; or don't await it at all.\n\nNow that\
    \ we know more about asynchronous programming, I would like to review five \n\n\
    utilities that we will use across the book.\n\n**Promise.all**\n\nPromise.all\
    \ is a function that expects an array of promises and returns a promise that \n\
    \nwill be **resolved** when **all** the promises are **fulfilled or rejected**.\
    \ Yes, a promise could be \n\nfulfilled, completed successfully, or rejected,\
    \ which means it failed.\n\nA common scenario is clicking on a link, and waiting\
    \ for the page to navigate to the \n\nnext page:\n\nawait Promise.all(\\[\n\n\
    \ page.click('a'), \n\n page.waitForNavigation()\n\n\\]);\n\nThis promise will\
    \ wait for the link to click and the waitForNavigation promises to \n\nbe either\
    \ fulfilled or rejected.\n\n**Promise.race**\n\nLike Promise.all, Promise.race\
    \ expects an array of promises, but in this case, it \n\nwill resolve when **any**\
    \ of the promises are resolved.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_36_0.png)"
  merge: -1
  pgno: 36
- img_proc: true
  md: "22 Getting started with Puppeteer\n\nA typical usage is for timeouts. We want\
    \ to take a screenshot, but only if it takes less than 2 \n\nseconds:\n\nawait\
    \ Promise.race(\\[\n\n page.screenshot(),\n\n new Promise((resolve,reject)=>{\
    \ \n\n setTimeout(()=>{ \n\n reject(new Error('Too long!!!'));},2000);\n\n })\\\
    ]);\n\nIn this case, if the screenshot promise takes more than 2,000 milliseconds,\
    \ the promise \n\ncreated as the second element in the array will be **rejected**,\
    \ rejecting the Promise.\n\n**Fulfilling our own promises**\n\nYou saw in our\
    \ previous example how you can create a promise, return that Promise or \n\nassign\
    \ it to a variable, and then fulfill it.\n\nThis is great when you want to wait\
    \ for an event to happen. We can create a promise that \n\nwill be resolved when\
    \ the page closes:\n\nconst promise = new Promise((x) => page.on('close', x));\n\
    \n// …\n\nawait promise;\n\nThis kind of await is quite risky. If the Promise\
    \ is never fulfilled, your code will hang. \n\nI recommend using these promises\
    \ with Promise.race and timeouts.\n\nWe will see lots of promises throughout this\
    \ book. Maybe some recipes such as \"fulfill our \n\nown promises\" look odd now,\
    \ but we will use them a lot.\n\n**Summary**\n\nWe covered a lot in this first\
    \ chapter. We learned about browser automation and the \n\ndifference between\
    \ Selenium and Puppeteer. Then we saw that Puppeteer isn't limited only \n\nto\
    \ end-to-end testing and reviewed some use case scenarios. Then we got our hands\
    \ dirty \n\nand coded our first Puppeteer script. In the last section of the chapter,\
    \ we covered many \n\nasynchronous techniques that we will use in this book.\n\
    \nIn the next chapter, we are going to focus on end-to-end testing. We will review\
    \ some \n\ntools available on the market and will consider how to organize our\
    \ code to create reliable \n\nend-to-end tests."
  merge: -1
  pgno: 37
- img_proc: true
  md: "**2**\n\n**Automated Testing **\n\n**and Test runners**\n\nIn *Chapter 1*,\
    \ *Getting started with Puppeteer*, we covered the first fundamental pillar of\
    \ this \n\nbook: browser automation and headless browsers. In this chapter, we\
    \ are going to cover \n\nthe second pillar: UI testing. We learned that Puppeteer\
    \ is not just about testing, but that \n\ndoesn't mean that it's not an excellent\
    \ tool for the job. \n\nIn this chapter, we are going to learn the fundamentals\
    \ of Testing Automation. We are \n\ngoing to see the differences between UI Testing\
    \ and End-to-End testing. If you have tried \n\nto write tests in Node.js before,\
    \ you might have come across some weird names: Mocha, \n\nJest, Jasmine, AVA,\
    \ or Chai. That feels quite overwhelming if you are not used to these \n\ntools.\
    \ We are going to see which are the right tools for us.\n\nWe will cover the following\
    \ topics in this chapter:\n\n• Introduction to Automated Testing\n\n• Test runner\
    \ main features\n\n• Available Test runners\n\n• Creating our first test project\n\
    \n• Organizing our code"
  merge: -1
  pgno: 38
- img_proc: true
  md: "24 Automated Testing and Test runners\n\nOnce we understand these foundational\
    \ concepts and we learn how test runners work, we \n\nwill be able to dive deep\
    \ into the Puppeteer API.\n\n**Technical requirements**\n\nYou will find all the\
    \ code of this chapter on the GitHub repository (https://github.\n\ncom/PacktPublishing/UI-Testing-with-Puppeteer)\
    \ under the Chapter2 \n\ndirectory.\n\n**Introduction to Automated Testing**\n\
    \nTesting is a fundamental task in software development. Even if you consider\
    \ yourself a bad \n\ntester, or even a bad developer, you do some testing when\
    \ you code your app. At the very \n\nleast, you open the app to see whether it\
    \ works as expected.\n\nMaybe you are a little bit more methodical and you have\
    \ a test plan, at least in your mind. \n\nYou know that when you code a form,\
    \ you have to validate some common scenarios:\n\n• Try to save a form with empty\
    \ fields.\n\n• Try to save with good data.\n\n• Try to enter bad data. You might\
    \ enter text in numeric fields, invalid dates, \n\nand so on.\n\nMore experienced\
    \ developers will cover all the possible scenarios. They will write code \n\n\
    based on those scenarios and then test accordingly.\n\nThen we get to the word\
    \ that's driving this book: we **automate** stuff. We want to automate \n\nour\
    \ tests. We don't want to forget any scenarios or have to test the same thing\
    \ over and \n\nover.\n\nAs you will notice, I haven't mentioned **Quality Assurance**\
    \ (**QA**) analysts yet, because \n\nI want to highlight that testing is not something\
    \ relegated to the QA team. Those who \n\nare involved in the testing process\
    \ include the following:\n\n• Backend developers\n\n• Frontend developers\n\n\
    • QA analysts\n\n• Managers (product or project managers)"
  merge: -1
  pgno: 39
- img_proc: true
  md: "Introduction to Automated Testing 25\n\nWe need to know that there are different\
    \ types of tests. Some types of tests will be \n\nperformed by developers and\
    \ QA analysts. Other tests will be specific to either developers \n\nor QA analysts.\n\
    \nMike Cohn, in his book *Succeeding with Agile* (Addison-Wesley Professional),\
    \ introduced \n\nhis very popular Testing Pyramid:\n\nMike Cohn's Testing Pyramid\n\
    \nAlthough Mike's book is more than 10 years old, this pyramid is still valid.\n\
    \nThis pyramid is based on three characteristics:\n\n• Number of tests\n\n• Isolation\n\
    \n• Speed\n\nI have only one thing against this pyramid: the word **UI**. Modern\
    \ apps rely more and more \n\non client code, \"UI\" code. Frameworks such as\
    \ React, Angular, and Vue.js allow developers \n\nto write reusable components.\
    \ Many apps now have most of their business rules running \n\non the client.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_40_0.png)"
  merge: -1
  pgno: 40
- img_proc: true
  md: "26 Automated Testing and Test runners\n\nFrontend developers should not be\
    \ limited to the top of this pyramid. They should be able \n\nto write unit tests\
    \ and service tests for their UI code. This might look like a small change, \n\
    \nbut I think it's important. With this change in the paradigm, we get a pyramid\
    \ that looks \n\nlike this:\n\nNew Pyramid\n\nNow that we have a better understanding,\
    \ let's talk about the different levels of this \n\npyramid.\n\n**Unit tests**\n\
    \nUnit tests are the base of the pyramid. The more business logic you cover in\
    \ unit tests, \n\nthe less ground you will need to cover in service or UI tests.\n\
    \nAs we can see in the pyramid, unit tests need to be **fast and isolated**. That\
    \ means that \n\na good unit test shouldn't depend on the environment or any other\
    \ function. Sometimes \n\nthis is easier said than done. For instance, if you\
    \ want to test that the total amount of an \n\ninvoice is equal to the sum of\
    \ its items, you should be able to test that specific functionality \n\nin the\
    \ code, without launching a web server or getting data from a database.\n\n**What\
    \ roles use Unit tests?**\n\n**Backend developers**: For sure, Unit tests are\
    \ for them. They follow the **Test-Driven **\n\n**Development** (**TDD**) process\
    \ if possible. TDD is a technique in software development \n\nwhere tests are\
    \ written even before any source code has been written. Once the tests have \n\
    \nbeen written, the developer will program the source code to make them pass.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_41_0.png)"
  merge: -1
  pgno: 41
- img_proc: true
  md: "Introduction to Automated Testing 27\n\n**Frontend developers**: Writing unit\
    \ tests was almost impossible in the past. If you \n\ndidn't have the right tools,\
    \ you couldn't do your job correctly. But now, many modern \n\nlibraries support\
    \ unit testing. If you use React and Redux, you will find that Redux has \n\n\
    a way to write unit tests for your components (https://www.hardkoded.com/\n\n\
    ui-testing-with-puppeteer/redux-unit-tests).\n\nThat's not all. In the same way\
    \ that backend developers need to think about how to make \n\ntheir code testable,\
    \ if frontend developers, using modern frameworks, start creating small \n\nand\
    \ testable components, **they should be able to use Puppeteer to write UI unit\
    \ tests**. \n\nAnd here is where the \"UI\" at the top of the testing pyramid\
    \ stops making any sense. Now \n\nwe can write **UI unit tests**.\n\nWe can run\
    \ a small test, rendering a component and testing, for instance, that it \"*renders\
    \ *\n\n*a textbox and when I enter a value, the label below changes*,\" or \"\
    *if I pass a list of 10 items, *\n\n*10 elements are rendered*.\"\n\n*We moved\
    \ UI testing to the bottom of the testing pyramid.*\n\n**QA Analysts** are not\
    \ involved yet. Unit tests are about testing the internal code.\n\nHow about **Managers**?\
    \ If you are a developer, I believe you are going to show this \n\nparagraph to\
    \ your boss. Managers won't write unit tests, but they need to know the \n\nimportance\
    \ of writing unit tests and investing time in them. \n\nThese are the four benefits\
    \ you (or your boss) need to know about.\n\n**Unit tests show how the code works**\n\
    \nUnit tests explain how the code works. When I review code, I start by reviewing\
    \ unit tests. \n\nIf I find unit tests saying, for instance, \"*Create order should\
    \ send email*\". I could read that \n\ntest first, and then, check how that rule\
    \ was implemented.\n\nBusiness Analysts or project managers could read these tests\
    \ and see whether there are \n\nany scenarios that haven't been covered or some\
    \ missing validation.\n\n**Unit tests make refactoring possible**\n\nI took a\
    \ risk using the word possible. But I believe that's true. You can't refactor\
    \ your code \n\nif you don't have unit tests backing your changes. Remember, refactoring\
    \ is changing the \n\nimplementation of your code without changing the result\
    \ given specific inputs. Unit tests \n\nguarantee that premise."
  merge: -1
  pgno: 42
- img_proc: true
  md: "28 Automated Testing and Test runners\n\n**Unit tests prevent regressions**\n\
    \n**Regression is an involuntary change in the expected behavior of an app**.\
    \ If we have \n\na good set of tests, they will prevent us from breaking any behavior\
    \ of the app while we \n\nimplement new features or while fixing bugs.\n\nHow\
    \ can I make sure that some other developers won't come and break the precious\
    \ \n\nfunction I just wrote? By writing unit tests. A unit test is a version of\
    \ you in the future \n\nenforcing how a piece of code should work. \"*Create an\
    \ order should send an email*\" – no \n\none will be able to break that rule.\n\
    \nWhen I review code, changes in unit tests are a red flag to me. I'm not saying\
    \ that unit \n\ntests shouldn't change. But if a test changes, there must be an\
    \ explanation. Now, the \n\n\"*Create and order should send an email*\" shows\
    \ that the sent email count is 2. Is that right? \n\nAre we sending another email?\
    \ Or do we have a regression? Pay attention to changes in \n\nunit tests.\n\n\
    Time to go up in the test pyramid.\n\n**Service tests**\n\nService tests are also\
    \ known as **Integration Tests**. These tests will check how your code \n\ninteracts\
    \ with other components. When we talk about components, we are talking about \n\
    \nthe following:\n\n• Databases\n\n• Other components in the app\n\n• External\
    \ services\n\nFrontend developers would also need to integrate their code with\
    \ the following:\n\n• Other UI components\n\n• CSS files\n\n• REST APIs\n\nAs\
    \ we mentioned before, when we go up in the testing pyramid, tests become **slower\
    \ and **\n\n**less stable**. And it's supposed to be like that. You will be connecting\
    \ to a real database or \n\ninteracting with a real REST API that would use real\
    \ network calls. That would also mean \n\nthat your tests would expect the environment\
    \ to respond in a certain way. For instance, \n\nyou would expect the database\
    \ to have some set of data ready to be used, or a REST API \n\nto be available."
  merge: -1
  pgno: 43
- img_proc: true
  md: "Introduction to Automated Testing 29\n\nThat's why the more tests you have\
    \ in the unit test layer, the fewer integration tests you \n\nwill need to code.\n\
    \nLet's take, for instance, the class that sends an email, could you code an integration\
    \ test for \n\nthat? Sure. You set up a local email server that would write emails\
    \ in a temp folder, so after \n\ncreating an order, you could check that folder\
    \ and see whether the email server processed \n\nthe email your app should have\
    \ sent. But, as you can see, these kinds of orchestrations are \n\nharder to code\
    \ than small unit tests.\n\nWhy do we need integration tests? Why don't we code\
    \ unit tests only?\n\nWell, you need to tests your integrations. Your code won't\
    \ run in isolation. If you are \n\ntesting the backend, you need to see how the\
    \ database reacts to the data you are inserting, \n\nor whether a SQL query returns\
    \ the data you expect.\n\nIf you are a frontend developer, this is where you would\
    \ invest most of your time, \n\nchecking how your component interacts on a page\
    \ or how the HTML being generated \n\naffects other elements in the DOM. You would\
    \ need to test how your component is being \n\nrendered with a real REST endpoint,\
    \ instead of using a dummy JSON file.\n\n**What roles use Integration tests?**\n\
    \n**Backend developers**: I've heard people say that these are the only tests\
    \ that matter. \n\nAlthough I disagree with that strong opinion, I do believe\
    \ these tests are essential. Say \n\nI created a unit test where, for instance,\
    \ when I call CreateOrder, I get a new Order \n\nobject. But now, I need to test\
    \ that when I make a POST request to /orders, an order is \n\ncreated in the database.\n\
    \n**Frontend developers** will create tests to check how all the different components\
    \ interact \n\nwith each other on a page. Again, it's UI testing down in the testing\
    \ pyramid.\n\n**QA Analysts** will create tests similar to the tests backend and\
    \ frontend developers create \n\nbut with a different perspective.\n\n*Developers\
    \ and QA Analysts create the same kinds of tests but with a different perspective.*\n\
    \nDevelopers will create tests to back their job, so they can check whether they\
    \ broke \n\nanything. And, as we mentioned before, they need tests to be able\
    \ to refactor their code in \n\nthe future.\n\n*QA Analysts will create tests\
    \ to guarantee the application quality to the stakeholders.*"
  merge: -1
  pgno: 44
- img_proc: true
  md: "30 Automated Testing and Test runners\n\nThere is one interesting type of test\
    \ that QA Analysts can implement in this layer: the \n\n**Visual Regression Test**.\
    \ These tests are used when we want to check whether there was \n\nany visual\
    \ change regarding the style of the app. We don't want to check whether there\
    \ \n\nis a button, or whether that button works. We want to check whether the\
    \ button looks \n\nlike how it was before. How can we achieve that? By comparing\
    \ images. This technique is \n\nbased on four steps:\n\n1\\. We take a screenshot\
    \ as a baseline:\n\nBaseline image\n\n2\\. We make a change in the code.\n\n3\\\
    . We take another screenshot:\n\nImage after making a change\n\n4\\. We compare\
    \ both images:\n\nDifferences\n\nThis type of test can be quite unstable. I bet\
    \ you have seen that pages sometimes \n\n\"move\" when they are loading, so you\
    \ have to be very sure when the page is ready for a \n\nscreenshot. But it is\
    \ doable. Another downside is that for every error you get, you have to \n\nanalyze\
    \ whether the change was a regression (a change made by mistake) or we are in\
    \ the \n\npresence of a **new baseline**.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_45_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_45_1.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_45_2.png)"
  merge: -1
  pgno: 45
- img_proc: true
  md: "Introduction to Automated Testing 31\n\nThe role of **managers** is still important.\
    \ They need to provide the tools and the time for \n\ndevelopers to implement\
    \ the required integration tests. They will also help QA Analysts \n\nto determine\
    \ what the integrations to test are.\n\nAnd so we come to the top of the pyramid,\
    \ the **end-to-end** tests.\n\n**End-to-end tests**\n\nYou might also find these\
    \ tests referred to as **E2E** tests. The goal of E2E tests is to \n\nguarantee\
    \ that an application works as expected through the entire workflow. Most \n\n\
    applications will have more than one workflow. That would mean that it will require\
    \ \n\na number of E2E tests to cover all the possible workflows or scenarios.\n\
    \nLet's take a cart app as an example. These could be our tests:\n\n• Unit tests:\n\
    \na) Passing a cart object, the AddToCart component renders an **Add to cart**\
    \ link \n\nif the product is not in the array.\n\nb) Passing a cart object, the\
    \ AddToCart component renders a \"View cart\" link if \n\nthe product is in the\
    \ array.\n\n• Integration tests:\n\na) Go to a product page and click \"Add to\
    \ cart.\" The link changes to \"View cart.\"\n\nb) Go to the checkout page. After\
    \ clicking on the **Checkout** button, it gets disabled.\n\n• One E2E test testing\
    \ the cart flow:\n\na) Go to a product page, click **Add to cart**, then click\
    \ on **View cart**.\n\nb) You should have got to the checkout page. Click **Checkout**.\n\
    \nc) You should have been redirected to the receipt page.\n\nd) The receipt should\
    \ show the product added to the cart.\n\ne) The price should be the product price.\n\
    \nWe are at the top of the pyramid. That means that these will be the **slowest\
    \ and least **\n\n**stable** tests."
  merge: -1
  pgno: 46
- img_proc: true
  md: "32 Automated Testing and Test runners\n\nWhy least stable? Check the workflow.\
    \ Many bad things can happen there. The add to \n\ncart endpoint might take a\
    \ little bit more than expected. The scroll to the **Checkout** \n\nbutton could\
    \ have failed for just a few pixels. Your database might be in an unexpected \n\
    \nstate. Maybe your user already purchased that product, so the **Add to cart**\
    \ button is not \n\nenabled.\n\nHow about roles?\n\nThis is the **QA Analyst's**\
    \ land. This is where they need to take advantage of all the features \n\nPuppeteer\
    \ provides to make reliable tests. But **Developers** play an important role,\
    \ helping \n\nthe QA team to do their job efficiently. As we are going to see\
    \ in the next chapters, \n\na developer can leave hints so that the QA team can\
    \ find the components they need.\n\nI hope the picture of the pyramid makes more\
    \ sense now. We need lots of small and \n\nisolated unit tests, many integration\
    \ tests testing our pages, and finally, a good set of E2E \n\ntests, checking\
    \ the workflow's health.\n\nThis is the famous testing pyramid, but how do we\
    \ write a test? Where do we write them? \n\nHow do we run a test? \n\nFirst, we\
    \ need to know what we need from a test runner.\n\n**Test runner features**\n\n\
    What would the world be like without a test runner? Let's say you don't know what\
    \ a test \n\nrunner is, and you want to code a unit test. Would that be possible?\
    \ I think it would. For \n\ninstance, say we have this small Cart class:\n\nclass\
    \ Cart {\n\n constructor() {\n\n this.\\_cart = \\[\\];\n\n }\n\n total() {\n\n\
    \ return this.\\_cart.reduce((acc, v) => acc + v.price, 0);\n\n };\n\n addToCart(item)\
    \ {\n\n this.\\_cart.push(item);\n\n };\n\n}\n\nmodule.exports = Cart;"
  merge: -1
