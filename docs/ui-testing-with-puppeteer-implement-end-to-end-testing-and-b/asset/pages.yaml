  md: "**9**\n\n**Scraping tools**\n\nBack in *Chapter 1*, *Getting started with Puppeteer*,\
    \ we talked about the different uses for \n\nweb automation. Of all those use\
    \ cases, web scraping is the one that excites developers \n\nthe most. When I\
    \ give talks about automation, I know that I will get the crowd's full \n\nattention\
    \ when I start talking about task automation, but even more when I get into the\
    \ \n\ntopic of **web scraping**.\n\nDon't get me wrong, I think that UI testing\
    \ is important. As we saw in the previous \n\nchapters, it's not just about running\
    \ automation tests but also about taking care of your \n\ncustomers. But web scraping\
    \ has that fun spark, a hacker feeling, and I didn't want to leave \n\nthis topic\
    \ out of the book.\n\nA few months ago, I read a book about web scraping that\
    \ included a chapter about UI \n\ntesting at the end of the book. We are going\
    \ to do the same, but the other way around. \n\nThis is a UI testing book with\
    \ a scraping chapter at the end.\n\nWe will begin this chapter by defining and\
    \ demystifying web scraping. Is it just for \n\nhackers? Is it even legal? We\
    \ will also talk about scraping ethics, such as when it is OK \n\nto scrape and\
    \ when it is not.\n\nThe second part of the chapter will discuss the different\
    \ tools available to scrape with \n\nPuppeteer."
  merge: -1
  pgno: 244
- img_proc: true
  md: "230 Scraping tools\n\nWe will cover the following topics in this chapter:\n\
    \n• Introduction to web scraping\n\n• Creating scrapers\n\n• Running scrapers\
    \ in parallel\n\n• How to avoid being detected as a bot\n\n• Dealing with authentication\
    \ and authorization\n\nBy the end of this chapter, you will be able to apply all\
    \ the concepts you have learned \n\nduring the course of this book in a brand-new\
    \ field of web automation.\n\nLet's get started.\n\n**Technical requirements**\n\
    \nYou will find all the code of this chapter on the GitHub repository (https://github.\n\
    \ncom/PacktPublishing/UI-Testing-with-Puppeteer) under the Chapter9 \n\ndirectory.\
    \ Remember to run npm install on that directory.\n\n**Introduction to web scraping**\n\
    \nThe best way to introduce a new concept is by giving a few concrete and straightforward\
    \ \n\ndefinitions. Let's begin by defining **data scraping**. According to Wikipedia\
    \ (https://\n\nwww.hardkoded.com/ui-testing-with-puppeteer/data-scraping), \"\
    *Data *\n\n*scraping is a technique in which a computer program extracts data\
    \ from human-readable *\n\n*output coming from another program*.\" Any information\
    \ coming out from a computer \n\ncan be extracted and processed. The first scrapers\
    \ were called \"screen scrapers.\" A screen \n\nscraper is something as simple\
    \ as an application that can capture the screen. Then, by \n\nrunning **Optical\
    \ Character Recognition** (**OCR**), it extracts the text from that image for\
    \ \n\nfurther processing.\n\nWeb scraping takes this idea to the next level. *Web\
    \ scraping is a technique used to extract *\n\n*data from one or multiple websites\
    \ using a piece of software.*\n\nYou might be wondering: Is that even legal? Amazon\
    \ is a public site. I can freely navigate \n\nthrough the site; why wouldn't I\
    \ be able to run a script to extract data that is already \n\npublic? Well, it\
    \ depends. Let me share with you some scenarios from the real world that \n\n\
    have similar ethical dilemmas to web scraping."
  merge: -1
  pgno: 245
- img_proc: true
  md: "Introduction to web scraping 231\n\n**First scenario**\n\nA small grocery store\
    \ owner goes to a big mall to compare their products and prices. She \n\ncan't\
    \ go and get a box of milk and leave without paying, but she can walk around and\
    \ \n\ntake notes of the product prices, take that list to her shop, and compare\
    \ their prices. The \n\nprice is not a product. She's not stealing anything. Also,\
    \ the mall is too big, and they can't \n\ncontrol every person walking around\
    \ taking notes. But what if the same person goes to \n\na small grocery store\
    \ on the next block and starts taking notes? I bet the owner already \n\nknows\
    \ her, and it's too evident that she's taking notes, and that will probably threaten\
    \ their \n\nbusiness. Is it illegal? No. But she might get into a fight.\n\n**Second\
    \ scenario**\n\nSome exclusive furniture stores won't let you take photos inside\
    \ the store.\n\n**Last scenario**\n\nYou can't count cards in the casino! They\
    \ will kick you out and ban you for life.\n\nThese are real-life \"scrapers.\"\
    \ People are trying to extract information in the real world. \n\nScraping the\
    \ web is quite similar. You will be able to scrape a site as long as a) the site\
    \ \n\nwelcomes (implicitly or explicitly) scrapers, b) your attitude is considerate\
    \ while scraping, \n\nand c) what you are scraping is allowed. Let's unpack these\
    \ concepts.\n\n**Does the site allow scrapers?**\n\nThe first reaction to this\
    \ question would be: \"No! why would the owner of a website \n\nallow scrapers?\"\
    \ But that's not necessarily true. What if you own a hotel? If an aggregator \n\
    \nwebsite scrapes your booking page, then it shows those results on their website\
    \ with a link \n\nback to your site, they will make some profit from that, and\
    \ you will get more customers: \n\nwin-win. Or, if you own a non-profit site such\
    \ as Wikipedia or a government website, \n\nscraping might not be an issue. As\
    \ it's a non-profit website, you shouldn't care much about \n\nbots coming to\
    \ your site to extract data unless they affect your website's performance. But\
    \ \n\nif your site is about song lyrics, you won't want anybody to come to your\
    \ site and extract \n\nthe lyrics. Lyrics are your product, your assets.\n\nIn\
    \ this chapter, we will see many techniques to bypass some validations, but my\
    \ personal \n\nrule is: If the site doesn't want to be scraped, I won't scrape\
    \ it. No means no.\n\nSo, how do we know whether we can scrape a website? The\
    \ owner of a website can express \n\nthat in at least four different ways."
  merge: -1
  pgno: 246
- img_proc: true
  md: "232 Scraping tools\n\n**Terms and conditions**\n\nThe first thing you should\
    \ check before scraping a website is the terms and conditions. \n\nThe website\
    \ owners can make it very clear that they don't want it to be scraped.\n\nThe\
    \ terms and conditions is that huge block of text we often ignore when installing\
    \ an \n\napp. I bet you've also had emails telling you that a website has changed\
    \ its terms and \n\nconditions, and you said \"yeah, whatever\" and archived the\
    \ email.\n\nBut we shouldn't do that. According to iubenda (https://www.hardkoded.com/\n\
    \nui-testing-with-puppeteer/iubenda-terms), \"'*Terms and Conditions' is the *\n\
    \n*document governing the contractual relationship between the provider of a service\
    \ and *\n\n*its user. The Terms and Conditions are nothing other than a contract\
    \ in which the owner *\n\n*clarifies the conditions of use of its service*.\"\
    \ Sometimes we might think that when we buy \n\ndigital content (software, music,\
    \ e-books) on a website, we then own that product, when, \n\nin fact, if you read\
    \ the terms and conditions, you have bought the right to use the product, \n\n\
    but you don't own it.\n\nThe terms and conditions also states what they allow\
    \ you to do on a website. Many sites \n\nmake that very clear. Let's take the\
    \ example of the terms and conditions of www.ebay.\n\ncom:\n\n*3\\. Using eBay*\n\
    \n*In connection with using or accessing the Services you will not:*\n\n*use any\
    \ robot, spider, scraper or other automated means to access our Services for any\
    \ *\n\n*purpose;*\n\n*bypass our robot exclusion headers, interfere with the working\
    \ of our Services, or impose an *\n\n*unreasonable or disproportionately large\
    \ load on our infrastructure.*\n\nAs we can see, eBay makes it very clear. You\
    \ can't scrape their site. eBay v. Bidder's Edge's \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/ebay-\n\
    \nvs-edge) was a well-known case back in the 2000s. eBay alleged that Bidder's\
    \ Edge \n\nactivities constituted a trespass of eBay's chattels (https://www.hardkoded.com/\n\
    \nui-testing-with-puppeteer/Trespass-to-chattels). In other words, \n\nBidder's\
    \ Edge's scraping affected the servers that are eBay's property. I bet you don't\
    \ want \n\nto go to court against eBay."
  merge: -1
  pgno: 247
- img_proc: true
  md: "Introduction to web scraping 233\n\nNow, let's take a look at Ryanair's terms\
    \ and conditions (https://www.hardkoded.\n\ncom/ui-testing-with-puppeteer/ryanair-terms):\n\
    \n*Use of any automated system or software, whether operated by a third party\
    \ or otherwise, *\n\n*to extract any data from this website for commercial purposes\
    \ (\"screen scraping\") is strictly *\n\n*prohibited.*\n\nRyanair doesn't like\
    \ scrapers either, but it says \"for commercial purposes,\" which would \n\nmean\
    \ that you could code your scraper to look for the best price for your next vacation.\n\
    \nIf the terms and conditions is not clear regarding scrapers, the second way\
    \ a site owner \n\ncan express their relationship with scrapers is through the\
    \ robots.txt file.\n\n**robots.txt file**\n\nWikipedia, again, has a great definition\
    \ of the robots file. According to Wikipedia \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/Robots-\n\
    \nexclusion-standard), the robots exclusion protocol \"*is a standard used by\
    \ websites *\n\n*to communicate with web crawlers and other web robots. The standard\
    \ specifies how to *\n\n*inform the web robot about which areas of the website\
    \ should not be processed or scanned. *\n\n*Robots are often used by search engines\
    \ to categorize websites*.\"\n\nThe keyword in that definition is \"inform.\"\
    \ The website owner can express in the robots \n\nfile which parts of the site\
    \ can be scraped. Most websites only use the robots.txt file \n\nto tell search\
    \ engines where they can find the sitemap to scrape:\n\nUser-agent: \\*\n\nSitemap:\
    \ https://www.yoursite.com/sitemap.xml\n\nWith these two simple lines of code,\
    \ they tell search engines, such as Google, to get that \n\nSitemap file and scrape\
    \ those pages. But you can find more complex definitions in that file. \n\nFor\
    \ instance, the robots.txt file on Wikipedia has over 700 lines! That tells us\
    \ that the \n\nsite is being scraped quite a lot. Let's see some examples of what\
    \ we can find in that file:\n\n\\# Please note: There are a lot of pages on this\
    \ site, and there \n\nare\n\n\\# some misbehaved spiders out there that go \\\
    _way\\_ too fast. If \n\nyou're\n\n\\# irresponsible, your access to the site\
    \ may be blocked."
  merge: -1
  pgno: 248
- img_proc: true
  md: "234 Scraping tools\n\nI love that the file begins with a message to us! They\
    \ expect us to come to this page to read \n\nit. The next section is interesting:\n\
    \n\\# Crawlers that are kind enough to obey, but which we'd rather \n\nnot have\n\
    \n\\# unless they're feeding search engines.\n\nUser-agent: UbiCrawler\n\nDisallow:\
    \ /\n\nUser-agent: DOC\n\nDisallow: /\n\nUser-agent: Zao\n\nDisallow: /\n\n\\\
    # Some bots are known to be trouble, particularly those \n\ndesigned to copy\n\
    \n\\# entire sites. Please obey robots.txt.\n\nUser-agent: sitecheck.internetseer.com\n\
    \nDisallow: /\n\nHere, Wikipedia informs that they don't want scrapers identified\
    \ with the user-agent \n\n**UbiCrawler**, **DOC**, **Zao**, and **sitecheck.internetseer.com**\
    \ to scrape the site. And the file \n\ncloses with general rules for all user-agents:\n\
    \nUser-agent: \\*\n\nAllow: /w/api.php?action=mobileview&\n\nAllow: /w/load.php?\n\
    \nAllow: /api/rest\\_v1/?doc\n\nDisallow: /w/\n\nDisallow: /api/\n\nDisallow:\
    \ /trap/\n\nDisallow: /wiki/Special:\n\n…\n\nThey basically say that all the rest\
    \ (User-agent: \\*) can scrape the whole site except \n\nsome URLs such as /w/,\
    \ /api/, and so on.\n\nIf we don't find anything useful in the terms and conditions\
    \ or in the robots.txt file, \n\nwe might find some hints in the page response."
  merge: -1
