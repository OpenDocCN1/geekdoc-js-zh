    [2\\].innerText,\n\n }\n\n }\n\n }));\n\n}\n\nWe did pretty much the same. We\
    \ changed the signature, added the call to \n\nsetUserAgent, removed try/catch,\
    \ and instead of returning the price, we are \n\npushing to the prices array inside\
    \ the function. \n\nFinally, we need to wait for the cluster to finish its work:\n\
    \nawait cluster.idle();\n\nawait cluster.close();\n\nThe call to idle will wait\
    \ for all the tasks to complete, and then the close function will \n\nclose the\
    \ browser and the cluster. Let's see if all this works!\n\n**\\> node crawler-with-cluster.js**\n\
    \n**\\== Start: 2020-12-29 08:50:14.475**\n\n**\\== Now: 2020-12-29 08:51:28.078\
    \ (running for 1.2 minutes)**\n\n**\\== Progress: 6 / 70 (8.57%), errors: 0 (0.00%)**\n\
    \n**\\== Remaining: 13.1 minutes (@ 0.08 pages/second)**\n\n**\\== Sys. load:\
    \ 6.1% CPU / 95.3% memory**\n\n**\\== Workers: 2**\n\n** #0 WORK https://www.packtpub.com/security**\n\
    \n** #1 WORK **https://www.packtpub.com/all-products\n\nThe output of puppeteer-cluster\
    \ is amazing. We can see the elapsed time, the \n\nprogress, and what the workers\
    \ are processing.\n\nUntil now, we played by the rules. But what if we want to\
    \ avoid being detected as scrapers? \n\nLet's find that out.\n\n**How to avoid\
    \ being detected as a bot**\n\nI hesitated about adding this section after everything\
    \ I mentioned about scraping ethics. \n\nI think I made my point clear when I\
    \ said that when the owner says no, it means no. But \n\nif I'm writing a chapter\
    \ about scraping, I think I need to show you these tools. It's then up \n\nto\
    \ you what to do with the information you have learned so far."
