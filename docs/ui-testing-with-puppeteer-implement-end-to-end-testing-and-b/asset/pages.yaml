  md: "40 Automated Testing and Test runners\n\nThis code will run perfectly. However,\
    \ there are two things that could do with \n\noptimization:\n\n• We would be repeating\
    \ the same code over and over.\n\n• If something fails in the middle of the test,\
    \ the browser won't get closed, leaving lots \n\nof open browsers.\n\nTo avoid\
    \ these problems, we can use before, after, beforeEach, and afterEach. \n\nIf\
    \ we add these functions to our tests, this would be the execution order:\n\n\
    •  before\n\n•  beforeEach\n\n•  it('Title should have Packt name')\n\n•  afterEach\n\
    \n•  beforeEach\n\n•  it('Title should mention Books')\n\n•  afterEach\n\n•  after\n\
    \nIt's not a rule of thumb, but we can do something like this in our case:\n\n\
    1\\.  before: Launch the browser.\n\n2\\.  beforeEach: Open a page and navigate\
    \ to the URL.\n\n3\\. Run the test.\n\n4\\.  afterEach: Close the page.\n\n5\\\
    .  after: Close the browser.\n\nThese **hooks**, which is what Mocha calls these\
    \ functions, would look like this:\n\nlet browser;\n\nlet page;\n\nbefore(async\
    \ () => {\n\n browser = await puppeteer.launch();\n\n});\n\nbeforeEach(async ()\
    \ => {"
