  md: "Running scrapers in parallel 249\n\n for(const book of newBooks) {\n\n cluster.queue(book,\
    \ getPrice);\n\n }\n\n}\n\nFirst, we changed the signature a little bit. Instead\
    \ of expecting (page, \n\ncategoryURL), it will expect an object with a page property\
    \ and a data property, \n\nwhere page will be the page created and managed by\
    \ the cluster, and the data property \n\nwill be the categoryURL instance we passed\
    \ in when we queued the task.\n\n**Tip**\n\nThe first argument to pass to the\
    \ queue function doesn't need to be a URL. It \n\ndoesn't even need to be a string.\
    \ You can pass in any object, and the function \n\nwill get that object in the\
    \ data property.\n\nThe second thing we had to do was to add the call to setUserAgent\
    \ as the page is \n\ncreated by the cluster itself.\n\nThen, instead of returning\
    \ the list of books, we added more tasks to the queue, but in this \n\ncase, we\
    \ enqueued the getPrice function, passing the book URL.\n\nThe last thing we had\
    \ to do is remove the try/catch block because the cluster will \n\nhandle that\
    \ for us.\n\nNow it's time to update the getPrice function:\n\nasync function\
    \ getPrice({ page, data}) {\n\n const userAgent = await page.browser().userAgent();\n\
    \n await page.setUserAgent(userAgent + ' \n\nUITestingWithPuppeteerDemoBot');\n\
    \n await page.goto(data);\n\n await page.waitForSelector('.price-list\\_\\_item\
    \ .price-list\\_\\_\n\nprice');\n\n prices.push(await page.evaluate(() => {\n\n\
    \ const prices = document.querySelectorAll('.price-list\\_\\_\n\nitem .price-list\\\
    _\\_price');\n\n if(document.querySelectorAll('.price-list\\_\\_name')\\[1\\].\n\
    \ninnerText.trim() == 'Print + eBook') {\n\n return {\n\n book: document.querySelector('.product-info\\\
    _\\_\n\ntitle').innerText,"
