  md: "124 Waiting for elements and network calls\n\nThat page is not ready at all.\
    \ Does that mean that DOMContentLoaded is useless? Well, \n\nit is useless in\
    \ this case. If you do the same with Wikipedia, the page is so straightforward\
    \ \n\nthat it will be ready to automate:\n\nDOM content loaded in Wikipedia\n\n\
    ![](img/a12c4f728acd6f69fe58d97e7f64e4f5_139_0.png)"
