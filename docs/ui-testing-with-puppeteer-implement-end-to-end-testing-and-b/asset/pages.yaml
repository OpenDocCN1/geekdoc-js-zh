    \ look like this:\n\nconst puppeteer = require('puppeteer');\n\nconst expect =\
    \ require('chai').expect;\n\nconst should = require('chai').should();\n\ndescribe('Home\
    \ page header', () => {\n\n it('Title should have Packt name', async() => {\n\n\
    \ });\n\n it('Title should mention Books', async() => {"
