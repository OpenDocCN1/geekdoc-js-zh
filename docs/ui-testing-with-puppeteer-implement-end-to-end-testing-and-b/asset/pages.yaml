  md: "170 Executing and Injecting JavaScript\n\n**Summary**\n\nWe covered one of\
    \ the most powerful features of Puppeteer in this chapter. Most web \n\nautomation\
    \ tools let you run JavaScript code somehow, but Puppeteer makes it super easy\
    \ \n\nto implement.\n\nWe started this chapter by talking about some basic JavaScript\
    \ concepts. We learned about \n\nvariable scopes and closures. That helped us\
    \ understand how variables and closures work \n\n(or don't work) in Puppeteer.\
    \ If you learned those differences, you will be able to answer \n\n20% of the\
    \ Puppeteer questions on Stack Overflow.\n\nThen, we learned about JSHandles and\
    \ ElementHandles. You don't see these classes \n\nbeing used a lot by the community,\
    \ but they are very helpful if you know how to use them, \n\nand now you know.\n\
    \nThe waitForFunction completed our \"wait\" toolbox. You will use that wait function\
    \ \n\na lot. We also learned how to expose functions and listen to HTML changes\
    \ using \n\nMutationObserver. Exposing functions and listening to HTML changes\
    \ is not used \n\nmuch in UI testing, but it is an excellent tool for web scraping,\
    \ a great topic we will cover \n\nin *Chapter 9*, *Scraping tools*.\n\nWith this\
    \ chapter, we have completed the basics of Puppeteer. You now have most of the\
    \ \n\ntools you need to start doing end-to-end testing.\n\nI hope you are as excited\
    \ with *Checkly* as I was when I saw this platform for the very first \n\ntime.\
    \ *Checkly* is a dashboard that will help not only the QA team but also the development\
    \ \n\nteam. It will help your team find issues and even find new opportunities\
    \ to improve your \n\nsite's performance.\n\nIn the next chapter, we will see\
    \ some features you wouldn't expect from an automation \n\ntool. We are going\
    \ to see how to generate content using Puppeteer."
  merge: -1
  pgno: 185
- img_proc: true
  md: "**7**\n\n**Generating Content **\n\n**with Puppeteer**\n\nWhen I launched Puppeteer-Sharp\
    \ (https://github.com/hardkoded/\n\npuppeteer-sharp) back in 2019, I was surprised\
    \ to see that the two main use-case \n\nscenarios were content generation and\
    \ web scraping. \n\nThings are not too different in the Node.js world. Lots of\
    \ developers use Puppeteer in \n\nNode.js for content generation and web scraping\
    \ as well.\n\nIf you are a QA analyst, you will learn how to use screenshots to\
    \ create regression \n\ntests. But, please, don't stop there; the other sections\
    \ will give you a complete picture \n\nof everything you can do with Puppeteer\
    \ on this topic. If you are not much into web \n\ndevelopment, share this chapter\
    \ with your development team. No, don't share it – ask \n\nthem to buy the book.\
    \ That will be better.\n\nWeb developers will love this chapter. We will see how\
    \ to use Puppeteer as a content \n\ngenerator tool for your website.\n\nWe will\
    \ cover the following topics in this chapter:\n\n• Taking screenshots\n\n• Using\
    \ screenshots for regression tests"
  merge: -1
  pgno: 186
- img_proc: true
  md: "172 Generating Content with Puppeteer\n\n• Generating PDF files\n\n• Creating\
    \ HTML content\n\nBy the end of this chapter, you will have gotten to a new level.\
    \ You will have learned how \n\nto use Puppeteer as a testing tool and as a content\
    \ generator.\n\nLet's get started.\n\n**Technical requirements**\n\nYou will find\
    \ all the code of this chapter in the GitHub repository (https://github.\n\ncom/PacktPublishing/UI-Testing-with-Puppeteer)\
    \ under the Chapter7 \n\ndirectory. Remember to run npm install on that directory\
    \ and then go to the \n\nChapter7/vuejs-firebase-shopping-cart directory and run\
    \ npm install \n\nagain.\n\n**Taking screenshots**\n\nTaking screenshots is the\
    \ first feature I mention when I give talks about Puppeteer or \n\nPuppeteer-Sharp.\
    \ Don't ask me why, maybe because I find it fun to use, or perhaps \n\nbecause\
    \ it's hard to explain why we would need to take screenshots.\n\nAs a web developer,\
    \ there are many things you can accomplish using screenshots. The first \n\npopular\
    \ use-case you'll find is to improve your **Open Graph** information.\n\nAccording\
    \ to their website (https://ogp.me/), \"*The Open Graph protocol enables any *\n\
    \n*web page to become a rich object in a social graph. For instance, this is used\
    \ on Facebook to *\n\n*allow any web page to have the same functionality as any\
    \ other object on Facebook.\"*\n\nOpen Graph is what will make social media posts\
    \ (on Twitter or Facebook) look \n\npretty when people share the URL of your site.\
    \ We are not going to talk about product \n\npositioning on social media in this\
    \ book. But what you need to know is that if you are \n\nworking on a public site\
    \ with users wanting to share your content on social media, \n\nsomeone will ask\
    \ you to improve the open graph information:\n\nA post with no Open Graph information\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_187_0.png)"
  merge: -1
  pgno: 187
- img_proc: true
  md: "Taking screenshots 173\n\nYou don't want your site to look like the preceding\
    \ screenshot when you share your \n\nproducts on social media. You want your links\
    \ to be like Amazon, with a nice description \n\nand a big image, as shown in\
    \ the following screenshot:\n\nAmazon posts on social media\n\nAdding an image\
    \ to your posts is as easy as adding a meta property called og:image in \n\nthe\
    \ html head of your product page:\n\n<head>\n\n<title>The Rock (1996)</title>\n\
    \n<meta property=\"og:title\" content=\"The Rock\" />\n\n<meta property=\"og:type\"\
    \ content=\"video.movie\" />\n\n<meta property=\"og:url\" content=\"https://www.imdb.com/title/\n\
    \ntt0117500/\" />\n\n<meta property=\"og:image\" content=\"https://ia.media-imdb.com/\n\
    \nimages/rock.jpg\" />\n\n</head>\n\nThose few lines will make your post look\
    \ prettier on social media. \n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_188_0.png)"
  merge: -1
  pgno: 188
- img_proc: true
  md: "174 Generating Content with Puppeteer\n\nWhat does this have to do with taking\
    \ screenshots? Well, sometimes getting the image for \n\na post is simple. In\
    \ a shopping cart, the image would be the product image – a piece of \n\ncake.\
    \ But sometimes, getting the image for a URL is not that easy. Let's take, for\
    \ instance, \n\nthis post from the great HolyJS conference:\n\nHolyJS post\n\n\
    If you go to that post (https://www.hardkoded.com/ui-testing-with-\n\npuppeteer/holyjs-post),\
    \ you won't find the image used in that tweet. You will see \n\nRoman's photo,\
    \ but you won't find the image with the photo, the conference logo, or the \n\n\
    talk title. They might have created that image manually. You don't need great\
    \ Photoshop \n\nskills to do that. But if you created hundreds of tweets for all\
    \ the talks at the HolyJS \n\nconference, I bet it would be more productive to\
    \ code a Puppeteer script in a few minutes.\n\nWe could have an internal page\
    \ that we would navigate by passing a talk ID. Once loaded, \n\nwe take a screenshot,\
    \ and we save that image in some kind of storage.\n\nBut before getting into Puppeteer's\
    \ code, let me show you a new tool. Do you know that \n\nyou can take full-page\
    \ screenshots using Chromium? \n\nIf you open up the Developer Tools in *Chrome*\
    \ and then press *Cmd* + *Shift* + *P* in macOS \n\nor *Ctrl* + *Shift* + *P*,\
    \ a **command menu list** will pop up, just like in VS Code:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_189_0.png)"
  merge: -1
  pgno: 189
- img_proc: true
  md: "Taking screenshots 175\n\nTaking screenshots using Chromium\n\nYou will find\
    \ tons of commands there. Do you want to have some fun? Open the 3D \n\nViewer.\
    \ I'll give you 3 minutes.\n\nOK, back to work. If you type screenshot in the\
    \ **command menu list**, you will get four \n\noptions.\n\nThe first option is\
    \ **Capture area screenshot**. This option works like the take screenshot \n\n\
    area you have in macOS by pressing *Cmd* + *Shift* + *4* or the **Rectangular\
    \ snip** in \n\nWindows's snipping tool. When you select that option, the cursor\
    \ turns into a cross. You \n\nselect the area you want to take a screenshot of,\
    \ then you release the mouse and get an \n\nimage download.\n\nThe second option\
    \ is **Capture a full size screenshot**. This feature is so cool that I would\
    \ \n\nput this option in a huge font size, in bold, red, and italics, but I don't\
    \ think my editor \n\nwould let me. **Capture a full size screenshot** will take\
    \ a screenshot of the entire page, \n\neven the parts off the screen. I remember\
    \ other tools trying to accomplish this by taking \n\nseveral screenshots while\
    \ scrolling the page, and the results were terrible. To be honest, \n\nI have\
    \ heard of people having issues with this option, but generally speaking, the\
    \ results \n\nare pretty good. You can use this tool for marketing purposes or\
    \ for reporting bugs so that \n\nyou can show the entire page.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_190_0.png)"
  merge: -1
  pgno: 190
- img_proc: true
  md: "176 Generating Content with Puppeteer\n\nThe third option is also fantastic.\
    \ Now I don't know which one is my favorite. **Capture **\n\n**node screenshot**\
    \ works with the **Elements** tab. You go to the **Elements** tab, select an \n\
    \nelement by clicking on it, then select the **Capture node screenshot** option,\
    \ and you will \n\nget a screenshot of that element. This is way better than trying\
    \ to select a section of the \n\npage with the capture area option.\n\nThe last\
    \ option is just **Capture screenshot**. It will capture the visible part of the\
    \ page. \n\nYes, I know, it sounds boring compared with the others, but it's still\
    \ useful.\n\nI don't think I need to tell you the good news because you already\
    \ know. We can do all \n\nthese things with Puppeteer using the screenshot function.\n\
    \nBoth the Page class and the ElementHandle class have this function. If you call\
    \ \n\nthe screenshot function on an ElementHandle, you will use the **Capture\
    \ node **\n\n**screenshot** option in Chrome.\n\nThe function's signature is quite\
    \ simple, just screenshot(\\[options\\]), which means \n\nthat just calling screenshot()\
    \ would be enough. But the options object has many \n\ninteresting properties.\
    \ Let's take a look at them:\n\n•  path is one of the most common properties you\
    \ will use. If you pass a path, your \n\nscreenshot will be saved there. Whether\
    \ you pass the path or not, the resulting \n\nimage will be returned by the screenshot\
    \ function.\n\n• With the type option, you can determine whether you want a **jpeg**\
    \ or a **png** image. \n\nIf you don't pass a type, Puppeteer will infer the type\
    \ from the path. If you pass \n\nneither the type nor the path, it will default\
    \ to **png**.\n\n• If you set the type (whether using the type option or the path\
    \ options) to **jpeg**, \n\nyou can also pass a quality option. It has to be a\
    \ value from 0 to 100. It will \n\ndetermine the quality of the **jpeg** image.\n\
    \n• Then we have fullPage. This option is a boolean option that will help us perform\
    \ \n\nthe **Capture a full size screenshot** action.\n\n• The clip property is\
    \ an object that will help us perform the **Capture area **\n\n**screenshot**\
    \ action. It represents a square, an area, using four properties: x for the \n\
    \nx-coordinate, y for the y-coordinate, and then width and height to determine\
    \ \n\nthe area's size.\n\n• With the omitBackground property, you will be able\
    \ to change the page's default \n\n(white) background to transparent."
  merge: -1
  pgno: 191
- img_proc: true
  md: "Taking screenshots 177\n\n**Important Note**\n\nomitBackground changes the\
    \ default background of the page. If the page \n\nhas a custom background, even\
    \ a white background using background-\n\ncolor: white, or an image, this option\
    \ won't work.\n\n• The last property available is encoding, which will determine\
    \ the return type of \n\nthe screenshot function. If you pass base64, it will\
    \ return a base64 string. If \n\nyou pass binary or don't set any value, it will\
    \ return a Node.js Buffer object.\n\nTime to see some code. Let's create a script\
    \ and try to replicate the four options that \n\nChrome offers. You will also\
    \ be able to see this code in the screenshots.js file: \n\nconst browser = await\
    \ puppeteer.launch({headless: false, \n\ndefaultViewport: null});\n\nconst page\
    \ = await browser.newPage();\n\nawait page.goto('https://www.packtpub.com/');\n\
    \nawait page.screenshot({ path: 'normal-only-viewport.png'});\n\nawait page.screenshot({\
    \ path: 'full-page.png', fullPage: \n\ntrue});\n\nawait page.screenshot({ \n\n\
    \ path: 'clip.png', \n\n clip: { \n\n x: 300, \n\n y: 150, \n\n width: 286, \n\
    \n height: 64\n\n }\n\n});\n\nconst firstBook = await page.$('.tombstone');\n\n\
    await firstBook.screenshot({ path: 'first-book.png'});\n\nWe can see the four\
    \ actions expressed in the code. If we pass only the path, we **Capture **\n\n\
    **screenshot**. Then, if we set fullPage to true, we will get **Capture full size\
    \ screenshot**. \n\nIf, instead of passing fullPage, we pass a clip, we'll get\
    \ **Capture area screenshot**. \n\nFinally, based on the ElementHandle we get\
    \ from page.$('.tombstone'), we get \n\n**Capture node screenshot**."
  merge: -1
  pgno: 192
- img_proc: true
  md: "178 Generating Content with Puppeteer\n\n**Tip**\n\nFinding the right clip\
    \ will be quite tricky. Pages change their layout based \n\non the window size,\
    \ which might break the fixed position you are trying to use. \n\nI would recommend\
    \ trying to capture node screenshots instead of using \n\na clip. If there is\
    \ no element you can use, I would try to build the clip \n\nbased on other elements'\
    \ positions.\n\nI bet web developers will find more use cases for the screenshot\
    \ feature. But if you are \n\na QA analyst, we will now learn how to use screenshots\
    \ to perform UI regression tests.\n\n**Using screenshots for regression tests**\n\
    \nWe briefly talked about UI regression tests in *Chapter 2*, *Automated Testing\
    \ and Test *\n\n*runners*. Now it's time to get practical. First, let's recap\
    \ the concept of **regression**. \n\nRegression is something you hear a lot when\
    \ you see bug reports. If a user says something \n\nlike \"I found a regression\
    \ in X feature,\" they mean that something that was working before \n\nin a certain\
    \ way has now changed. It might be a bug, an error in the app, or an unreported\
    \ \n\nchange of behavior.\n\nWe can say that a UI regression is when we detect\
    \ that a page or component has changed \n\nvisually. I want to be emphatic again.\
    \ It might have changed due to a bug or an unreported \n\nchange of style.\n\n\
    To prove a regression, you need evidence. Until now, we were testing behavior,\
    \ and our \n\nevidence was the code: \"If I input the user, the password, and\
    \ then I click on the login \n\nbutton, I should get logged in.\"\n\nTo prove\
    \ a UI regression, our evidence will be **screenshots**. A UI regression test\
    \ would \n\nconsist of the following steps:\n\n1\\. The first thing we need to\
    \ do is take a screenshot of the current state.\n\n2\\. The first time we run\
    \ a test, we have nothing to compare our screenshot to. We have \n\nno history,\
    \ no evidence. We have nothing to test. But now, we have the evidence for \n\n\
    the next run.\n\n3\\. If we have evidence, we will compare our current screenshot\
    \ with the baseline, and \n\nwe will fail if the images are different.\n\nThat's\
    \ it. Simple. But what happens when we have a difference? When we get a test fail\
    \ in \n\nend-to-end tests, we would first see if it's an error in our test. If\
    \ our tests are working as \n\nexpected, that failure will end up in a bug report."
  merge: -1
  pgno: 193
- img_proc: true
  md: "Using screenshots for regression tests 179\n\nBut with UI regression tests,\
    \ that's a little bit different. We would need to evaluate the \n\nresults to\
    \ check if we found an error or if **the baseline has changed**. We get UI changes\
    \ \n\nin pages all the time, so we need to see if they are desired changes or\
    \ not. If a change was \n\ndesired, we would need to delete our baseline and create\
    \ a new baseline image.\n\nThat's our cake. Now, what tools do we need to bake\
    \ that cake? And also, what are our \n\nrequirements for those tools? We need\
    \ four elements:\n\n• A **test runner**. We already talked about what we need\
    \ from a test runner, and we \n\nsaw that Mocha and Jest meet our expectations.\n\
    \n• A **screenshot taker**. The screenshot taker needs to be stable. By stable,\
    \ I mean that \n\nit needs to return the same screenshot under the same circumstances\
    \ all the time. \n\nIt sounds obvious, but UI regression tests are the king of\
    \ flaky tests. We need a tool \n\nthat provides the same screenshots consistently.\
    \ Puppeteer is great for this.\n\n• A **place to store baselines**. We are not\
    \ talking about a tool here. But we need files \n\nto be organized so that it's\
    \ easy to find and remove baselines and find the resulting \n\ncomparisons.\n\n\
    • A **tool to compare images**. This tool is as important as the screenshot taker.\
    \ We \n\ndon't want false alarms. We don't need a tool that tells us that everything\
    \ is wrong \n\njust because one pixel is not the exact same white as the baseline.\
    \ This tool should \n\nallow us to pass some kind of threshold to determine how\
    \ sensitive we want it \n\nto be to changes. It should also need to support anti-aliased\
    \ pixels to reduce the \n\ndifference in the image rendering. *Pixelmatch* (https://www.hardkoded.com/\n\
    \nui-testing-with-puppeteer/pixelmatch) is the most popular image \n\ncomparison\
    \ package for Node.js.\n\nAs you can see, it shouldn't be that hard implementing\
    \ that. But many tools on the \n\nmarket solve all that boilerplate for us. Again,\
    \ it's not about me telling you what's the \n\nbest tool. You have to look for\
    \ the right tool for you. I found that *Project Awesome* \n\n(http://www.hardkoded.com/ui-testing-with-puppeteer/awesome-\n\
    \nregression-testing) has a huge list of regression testing tools. On that site,\
    \ I found \n\n*differencify* (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \ndifferencify). I like it because it's simple and covers all the requirements\
    \ mentioned \n\nin the preceding list. I don't like much that it's a layer between\
    \ Puppeteer and us, but it \n\ndoes the job; I can live with that."
  merge: -1
  pgno: 194
- img_proc: true
  md: "180 Generating Content with Puppeteer\n\nWe can create a test called \"Should\
    \ visually match\", and use differencify there. \n\nYou can find this test in\
    \ the homepage.tests.js file. Let's see how to implement it: \n\nit ('Should visually\
    \ match', async() => {\n\n const target = differencify.init({ \n\n chain: false,\
    \ \n\n testName: 'Home' });\n\n await target.launch();\n\n const page = await\
    \ target.newPage();\n\n await page.setViewport({ width: 1600, height: 1200 });\n\
    \n await page.goto(config.baseURL);\n\n const image = await page.screenshot();\n\
    \n const result = await target.toMatchSnapshot(image);\n\n await page.close();\n\
    \n await target.close();\n\n expect(result).to.be.true;\n\n});\n\nIt looks pretty\
    \ much like a normal Puppeteer test. But there are some differences. Let's \n\n\
    take a look at them:\n\nIt begins by declaring a variable named target and assigning\
    \ to it the result of \n\ndifferencify.init. We won't get into the internals of\
    \ *differencify*, because we don't \n\ncare about the internals. The only thing\
    \ important in that init call is that we are setting \n\nthe test name there,\
    \ which, as we will see later, will be used to name the images.\n\nAfter that,\
    \ it looks like pure Puppeteer code, except that we call target.launch(); \n\n\
    instead of puppeteer.launch();.\n\nOne important thing we need to do when taking\
    \ screenshots is setting the **viewport**. The \n\nviewport will determine the\
    \ size of the screenshot we will use. Even if you take a full-page \n\nscreenshot,\
    \ the viewport will determine that image's width.\n\nUnless you want to check\
    \ a page's style after specific actions, UI regression tests will just \n\ngo\
    \ to a page, wait for the page to be loaded and stable, and take a screenshot.\
    \ By stable, \n\nI mean that you don't want to take a screenshot with half of\
    \ the resources, for example, \n\nimages still loading.\n\nOnce the page is loaded,\
    \ we take a screenshot using page.screenshot() and then call \n\nawait target.toMatchSnapshot(image).\
    \ This function will be responsible for \n\ncreating a baseline image if it doesn't\
    \ exist, and if it exists, make the image comparison."
  merge: -1
  pgno: 195
- img_proc: true
  md: "Using screenshots for regression tests 181\n\nWhen we run the test for the\
    \ very first time, the test will pass because, again, there is no \n\nbaseline.\
    \ One important thing we will notice is that *differencify* created the baseline\
    \ inside \n\na differencify\\_reports directory. You can see the complete directory\
    \ structure \n\ninside the Chapter7/differencify\\_reports directory.\n\nNow we\
    \ have our baseline. Hopefully, this test will be green unless something changes\
    \ on \n\nthat page. Let's try to break it. We will open the vuejs-firebase-shopping-cart/\n\
    \nsrc/components/Header.vue file and change the color .navbar-btn elements \n\n\
    to blue:\n\n.navbar-btn {\n\n color: blue;\n\n}\n\nThis is a typical scenario\
    \ of a UI regression test. Maybe you wanted to change the color \n\nof a button\
    \ on the login page, and you didn't realize that the navbar-btn class was also\
    \ \n\nbeing used on the home page.\n\nIf we run the test, we will get the following\
    \ output, telling us that the test has failed:\n\n** 1) Home Page**\n\n** Should\
    \ visually match:**\n\n** AssertionError: expected false to be true**\n\n** +\
    \ expected - actual**\n\n** -false**\n\n** +true**\n\nThat doesn't say much. It\
    \ just simply says that the image is not the same. But if we \n\ngo to the differencify\\\
    _reports directory, we will see that *differencify* created \n\ntwo new files:\
    \ Home 1.current.png under differencify\\_reports/\\_\\_\n\nimage\\_snapshots\\\
    _\\_/\\_\\_current\\_output\\_\\_, which shows the latest screenshot. \n\nThe\
    \ second image is Home 1.differencified.png under differencify\\_\n\nreports/\\\
    _\\_image\\_snapshots\\_\\_/\\_\\_differencified\\_output\\_\\_. You \n\ncan see\
    \ the differencified image inside the directory mentioned above or following \n\
    \nthe link https://www.hardkoded.com/ui-testing-with-puppeteer/\n\ndifferencified\
    \ will show us where the changes were detected. In this case, you will \n\nsee\
    \ that it highlighted the word \"**Checkout**\". We can now compare the baseline\
    \ image with \n\nthe one created in the \\_\\_current\\_output\\_\\_ directory\
    \ and evaluate what went wrong."
  merge: -1
  pgno: 196
- img_proc: true
  md: "182 Generating Content with Puppeteer\n\nTo wrap up this section, UI regression\
    \ tests are not for every project. If you use CSS \n\nframeworks like **bootstrap**\
    \ or **tailwindcss** the chances of UI regressions are low. There are \n\nalso\
    \ projects where the page style is not considered a bug. Stakeholders won't care\
    \ if a box \n\nis a few pixels below.\n\nI do think it's an excellent tool for\
    \ frontend developers working on custom CSS. With UI \n\nregression tests, a frontend\
    \ developer can measure the impact of their changes. It's like \n\nunit tests\
    \ for CSS.\n\nIn the next chapter, we are going to talk about device emulation.\
    \ With device emulation \n\nplus UI regression tests, you will be able to check\
    \ how your site looks on mobile devices.\n\nNow it's time to learn another way\
    \ to generate content with Puppeteer. Time to generate \n\nPDF files.\n\n**Generate\
    \ PDF files**\n\nWe are out of QA land, and we'll go into the development world\
    \ again.\n\nWhen I talk about PDF generation, I get the same question I mentioned\
    \ in the screenshot \n\nsection: \"Why would I need to generate PDFs using Puppeteer?\"\
    \n\nThe first scenario to mention is using PDFs as an output format for your website.\
    \ I don't \n\nknow if you've lived what I lived once. I had to build an e-commerce\
    \ app. I built the \n\nproduct list, the checkout process, and even the receipt\
    \ page. Then the requirement came \n\nout: \"We need to send an email with that\
    \ receipt as a PDF.\" That's an estimation breaker. \n\nThere is no easy way to\
    \ create PDF files just from scratch.\n\nThen you find a library that generates\
    \ PDFs, and you are happy with it. But the \n\nstakeholders tell you that it needs\
    \ to look exactly like the receipt page. Your estimation \n\ngoes to the trash\
    \ again. There should be an easy way to generate PDF files.\n\nMaybe it's not\
    \ a receipt. Haven't you ever got a request to send a daily report by email \n\
    \nas a PDF? You would end up using some huge, complex, and expensive reporting\
    \ tool, \n\njust for that daily email.\n\nThe second scenario is PDF files as\
    \ a product by themselves. Do you sell documents? \n\nFinance reports? You can\
    \ autogenerate that content using PDF generation tools.\n\nI bet you already know\
    \ that you can save any page as a PDF file using Chrome's print tool:"
  merge: -1
  pgno: 197
- img_proc: true
  md: "Generate PDF files 183\n\nSave as PDF in Chrome\n\nYou can go to any page,\
    \ hit *Cmd* + *P* or *Ctrl* + *P*, and instead of selecting a real printer, \n\
    \nyou choose **Save as PDF**. Then you click **Save**, and you get your PDF.\n\
    \nI think I don't need to tell you this, but as you might have guessed, Puppeteer\
    \ uses this \n\nsame utility to generate PDF files.\n\nThere is something essential\
    \ you need to know. If you know this, you will be able to \n\nanswer lots of questions\
    \ in Stack Overflow. Here goes: **PDF generation doesn't work **\n\n**as a screenshot\
    \ but as a print action**.\n\nIt might sound obvious, now that we've seen that\
    \ **Print** dialog. But it's important for \n\nyou to know that the viewport (the\
    \ window size) won't determine how the PDF will be \n\ngenerated. The page size\
    \ will determine that.\n\nDesigners and frontend developers can determine how\
    \ a page should be printed using \n\nthe media query print (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/mediaqueries).\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_198_0.png)"
  merge: -1
  pgno: 198
- img_proc: true
  md: "184 Generating Content with Puppeteer\n\nLet's see how you can change a page\
    \ style using @media print:\n\n<html>\n\n <head>\n\n <style>\n\n body {\n\n color:\
    \ blue;\n\n font-size: 16px;\n\n }\n\n @media print {\n\n body{\n\n color: black;\n\
    \n font-size: 32px;\n\n }\n\n }\n\n </style>\n\n </head>\n\n <body>\n\n Hello\
    \ world;\n\n </body>\n\n</html>\n\nAs we can see, if you browse this HTML content\
    \ (you will find this code as \n\nmediaprint.html in the repository), you will\
    \ find that \"Hello world\" is rendered in \n\nblue with a size of 16px. But if\
    \ you hit print, the browser will add all the CSS style from \n\nthe @media print\
    \ section, changing the font size to 32px and the color to black. In the \n\n\
    next section, we will learn how to add print styles if the page has none. For\
    \ now, what you \n\nneed to know is that we are printing content.\n\nIf the @media\
    \ print style used in the page doesn't work for you, there is a way to \n\nbypass\
    \ this functionality. You can force the media type screen using the following\
    \ code:\n\npage.emulateMediaType('screen')\n\nIf you call emulateMediaType before\
    \ generating the PDF, @media print will be \n\nignored by the browser."
  merge: -1
  pgno: 199
- img_proc: true
  md: "Generate PDF files 185\n\nI don't think I need to tell you that the function\
    \ we will use to generate PDF files is called \n\npage.pdf. Unlike screenshot,\
    \ there is no elementHandle.pdf because you can't \n\nprint just an element.\n\
    \nThe signature is simple, just page.pdf(\\[options\\]), but we have many available\
    \ \n\noptions. Let's begin with the options that map the settings you would find\
    \ in the print \n\ndialog.\n\nThe first option you will see in the print dialog\
    \ after selecting **Save as PDF**, is the **Layout**. \n\nThe option to set the\
    \ layout is landscape. It's a boolean that will tell the browser if you \n\nwant\
    \ to generate the PDF with a landscape orientation or not.\n\nThe next option\
    \ is **Pages**. In Puppeteer, the property is pageRanges. It's a string where\
    \ \n\nyou can pass things like '1-5, 8, 11-13'. If you don't set this property,\
    \ it will work \n\nas if you had set **Pages** to **All** in the print dialog.\n\
    \nIf you click **More settings** in the print dialog, the next option available\
    \ will be **Paper size**. \n\nIn Puppeteer, it will be format, which is a string\
    \ that accepts the following options:\n\n•  Letter: 8.5 in x 11 in\n\n•  Legal:\
    \ 8.5 in x 14 in\n\n•  Tabloid: 11 in x 17 in\n\n•  Ledger: 17 in x 11 in\n\n\
    •  A0: 33.1 in x 46.8 in\n\n•  A1: 23.4 in x 33.1 in\n\n•  A2: 16.54 in x 23.4\
    \ in\n\n•  A3: 11.7 in x 16.54 in\n\n•  A4: 8.27 in x 11.7 in\n\n•  A5: 5.83 in\
    \ x 8.27 in\n\n•  A6: 4.13 in x 5.83 in\n\nPuppeteer also offers two extra options:\
    \ width and height. If none of those formats \n\nsuit you, you can set custom\
    \ dimensions with these two properties. These properties \n\naccept a number or\
    \ a string. If you use strings, you can pass values in units, such as \n\n**px**\
    \ for pixels, **in** for inches, **cm** for centimeters, or **mm** for millimeters."
  merge: -1
  pgno: 200
- img_proc: true
  md: "186 Generating Content with Puppeteer\n\nNext up is **Scale**. The property\
    \ is scale, and it's the zoom that will be used to print the \n\npage. You will\
    \ see it in the print dialog as a percentage from 10% to 200%. Here, it will be\
    \ \n\na decimal value from 0.1 to 2.\n\nAfter **Scale**, you will find **Pages\
    \ per sheet**. We don't have that setting in Puppeteer.\n\nThe next option in\
    \ the **Print** dialog is **Margins**. The **Print** dialog offers a few fixed\
    \ options. \n\nIn Puppeteer, the margin option is an object with four properties:\n\
    \n•  top\n\n•  right\n\n•  bottom\n\n•  left\n\nAll these properties accept a\
    \ number or a string, supporting units as width and \n\nheight do.\n\nAfter the\
    \ margins, the print dialog offers an extra set of options. The first one is Headers\
    \ \n\nand footers. This is a really fun feature in Puppeteer. Puppeteer not only\
    \ provides \n\na displayHeaderFooter boolean property, but it also provides a\
    \ headerTemplate \n\nproperty and a footerTemplate property. That means that you\
    \ can set what you want \n\nthe header and the footer to look like. Puppeteer\
    \ will even populate elements with the \n\nfollowing classes:\n\n•  date: Formatted\
    \ print date\n\n•  title: Document title\n\n•  url: Document location\n\n•  pageNumber:\
    \ Current page number\n\n•  totalPages: Total pages in the document\n\nThe next\
    \ option is **Background graphics**. You can turn this option on with the \n\n\
    printBackground property. It will tell the browser that you want to print background\
    \ \n\ngraphics. This is false by default because this option is intended for printers,\
    \ and you \n\ndon't want to waste your toner on a background. But you should consider\
    \ whether this is \n\nsomething you need to turn on. Let's consider Wikipedia:"
  merge: -1
  pgno: 201
- img_proc: true
  md: "Generate PDF files 187\n\nWikipedia without the background graphics checked\n\
    \nAs you can see, the Wikipedia title is missing if you don't check the **Background\
    \ graphics** \n\ncheckbox because it's the background image of a SPAN element.\
    \ If you don't know about \n\nthis flag, you might be scratching your head for\
    \ several minutes, trying to see what's \n\nwrong with your code. Now you know\
    \ that you have to consider printBackground.\n\nThere is one option that you won't\
    \ see in the print dialog, and it's preferCSSPageSize. \n\nThis property, whose\
    \ default is false, will tell the browser to honor the @page size \n\ndeclared\
    \ on the page over width/height or page format. Developers can use \n\n@page size\
    \ (https://www.hardkoded.com/ui-testing-with-\n\npuppeteer/pagesize) to set the\
    \ preferred page size when the page is printed.\n\nThe last option is the most\
    \ important. The function's output works in the same way as in \n\nthe screenshot\
    \ function. If you set the path property, a file will be generated in that \n\n\
    path. Either way, the function's return value will be a Buffer (https://nodejs.org/\n\
    \napi/buffer.html) with the binary representation of the PDF file.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_202_0.png)"
  merge: -1
  pgno: 202
- img_proc: true
  md: "188 Generating Content with Puppeteer\n\nTime to take a look at some code.\
    \ In the following code, which you can see in the \n\npdfdemo.js file, we are\
    \ going to print www.wikipedia.org using the options \n\nwe have learned:\n\n\
    const browser = await puppeteer.launch({\n\n headless: true,\n\n defaultViewport:\
    \ null});\n\nconst page = await browser.newPage();\n\nawait page.goto('https://www.wikipedia.org/');\n\
    \nawait page.pdf({\n\n path: './headers.pdf',\n\n printBackground : true,\n\n\
    \ displayHeaderFooter : true,\n\n headerTemplate: \\`\n\n <span style=\"font-size:\
    \ 12px;\">\n\n This is a custom PDF for \n\n <span class=\"title\"></span> (<span\
    \ class=\"url\"></\n\nspan>)\n\n </span>\\`,\n\n footerTemplate: \\`\n\n <span\
    \ style=\"font-size: 12px;\">\n\n Generated on: <span class=\"date\"></span><br/>\n\
    \n Pages <span class=\"pageNumber\"></span> of <span \n\nclass=\"totalPages\"\
    ></span>\n\n </span>\\`,\n\n margin:{ \n\n top:'100px', \n\n bottom: '100px'\n\
    \n }\n\n});\n\nawait browser.close();\n\nThe first thing to notice in this piece\
    \ of code is that the pdf function only works in \n\nheadless mode. If you call\
    \ pdf while in headful, you will get an **Error: Protocol error **\n\n**(Page.printToPDF):\
    \ PrintToPDF is not implemented**."
  merge: -1
  pgno: 203
- img_proc: true
  md: "Generate PDF files 189\n\nThe second thing to notice is that you need to set\
    \ up a margin if you want to use footer \n\nand header templates. In my personal\
    \ experience, I wouldn't use very complex templates \n\nhere. Things can get nasty\
    \ and hard to debug.\n\nThe last thing to mention in the code is the CSS classes\
    \ used in the template. As you can \n\nsee, I'm leaving empty SPANs like <span\
    \ class=\"title\"></span> so the browser \n\ncan replace them with real data.\n\
    \nThis code will generate the following headers.pdf file:\n\nPDF output\n\nAs\
    \ you can see, we now have a custom header with a title and URL, a custom footer\
    \ \n\nwith the date and the pages, and, as we set printBackground, we are getting\
    \ the \n\nWikipedia logo. \n\nYou might think that's it, but it's not. We have\
    \ one more way to generate content. We will \n\nbuild our own pages on the fly.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_204_0.png)"
