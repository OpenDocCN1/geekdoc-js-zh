  md: "Summary 81\n\nThere, you are not going to see the full details, but it will\
    \ give you a quick view so you can \n\nknow whether the Pull Request is ready\
    \ to be merged or not.\n\nI know that this might feel overwhelming. Take this\
    \ as an idea about how that looks, what \n\nis possible, and the challenges you\
    \ might find while setting up all this. It's not easy, but it is \n\nworth the\
    \ effort.\n\n**Summary**\n\nAs you can see, we started to go deeper into the Puppeteer\
    \ API. We learned about all \n\nthe different options we can use when launching\
    \ a browser. We also learned how to \n\nnavigate through a site and the different\
    \ options we have to go from one page to another. \n\nWe also saw new objects\
    \ that weren't mentioned before, such as the Response and the \n\nRequest class.\n\
    \nI hope you found the continuous integration section valuable. There are many\
    \ tools and \n\nmany different ways to run tests automatically in the cloud. This\
    \ is an essential tool to add \n\nto your toolbox.\n\nIn the next chapter, we\
    \ will get even more practical. We will see how to interact with the \n\npage,\
    \ from CSS selectors to mouse and keyboard emulation."
