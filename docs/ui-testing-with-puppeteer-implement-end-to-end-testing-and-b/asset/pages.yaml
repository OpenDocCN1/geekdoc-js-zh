  md: "Creating our first test project 37\n\n**Creating our first test project**\n\
    \nWe will create a Node application in the same way we created our first app in\
    \ \n\n*Chapter 1*, *Getting started with Puppeteer*. We are going to create a\
    \ folder called \n\nOurFirstTestProject (you will find this directory inside the\
    \ Chapter2 directory \n\nmentioned in the *Technical requirements* section) and\
    \ then execute npm init -y inside \n\nthat folder:\n\n**\\> npm init -y**\n\n\
    The response should be something like this:\n\n**{**\n\n** \"name\": \"OurFirstTestProject\"\
    ,**\n\n** \"version\": \"1.0.0\",**\n\n** \"description\": \"\",**\n\n** \"main\"\
    : \"index.js\",**\n\n** \"scripts\": {**\n\n** \"test\": \"echo \\\\\"Error: no\
    \ test specified\\\\\" && exit 1\"**\n\n** },**\n\n** \"keywords\": \\[\\],**\n\
    \n** \"author\": \"\",**\n\n** \"license\": \"ISC\"**\n\n**}**\n\nNow it's time\
    \ to install the packages we are going to use:\n\n• Puppeteer 7\n\n• Mocha (any\
    \ version)\n\n• Chai (any version)\n\nLet's run the following commands:\n\n**\\\
    > npm install puppeteer@\">=7.0.0 <8.0.0\"**\n\n**\\> npm install mocha**\n\n\
    **\\> npm install chai**"
