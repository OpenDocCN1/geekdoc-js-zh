  md: "240 Scraping tools\n\nBased on this XML, we are going to build a **crawler**.\
    \ A crawler is a program that will \n\nnavigate through the website scraping all\
    \ the pages. This will be our plan:\n\n• We are going to build an array of book\
    \ category URLs. To make the run shorter, \n\nwe will scrape only category pages,\
    \ such as https://www.packtpub.com/\n\nweb-development. We will also limit the\
    \ list to 10 categories, so we are nice with \n\nthe server.\n\n• Once we get\
    \ that list, we will navigate each page, getting book links. We don't want \n\n\
    to get duplicates in there, so we need to be careful.\n\n• Once we get the list\
    \ of books, we navigate each book page and get the price for the \n\nprint book\
    \ plus the e-book and the print book alone: \n\nBook details\n\n• Those prices\
    \ will be collected in a JSON array and sent to disk at the end of the \n\nprocess.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_255_0.png)"
  merge: -1
  pgno: 255
- img_proc: true
  md: "Creating scrapers 241\n\nLet's get started! You can get the code of this section\
    \ in the crawler.js file. We will get \n\nthe sitemap.xml file and get the first\
    \ 10 categories:\n\nconst https = require('https');\n\n(async function() {\n\n\
    \ const sitemapxml = await getSitemap();\n\n})();\n\nfunction getSitemap() {\n\
    \n let resolve;\n\n const promise = new Promise(r => resolve = r);\n\n https.get('https://www.packtpub.com/sitemap.xml',\
    \ \n\nfunction(res) {\n\n let body = '';\n\n res.on('data', (chunk) => body +=\
    \ chunk);\n\n res.on('end', () => resolve(body));\n\n });\n\n return promise;\n\
    \n};\n\nThere we are using the native https package to download the sitemap.xml\
    \ file. We \n\ncreate a Promise that will be resolved when we call the resolve\
    \ function. Then we call \n\nthe get function to fetch the file. We collect the\
    \ information being downloaded in the \n\ndata event, and when we receive an end\
    \ event, we resolve the Promise by returning the \n\nbody string we were collecting.\
    \ It might take a while to get the code's flow, but it's very \n\nstraightforward\
    \ once you get used to it.\n\nThat sitemapxml variable is a string. We need first\
    \ to parse the XML and then get \n\na JavaScript model from there. xml2js will\
    \ do most of the job for us. Let's install that \n\nmodule using npm install in\
    \ our terminal: \n\n**npm install xml2js **\n\nOnce we have that module, we can\
    \ start using it in our code:\n\nconst xmlParser = require('xml2js').parseString;\n\
    \nWe will be able to parse the sitemap by calling the xmlParser function:\n\n\
    (async function() {\n\n const sitemapxml = await getSitemap();\n\n const categories\
    \ = await getCategories(sitemapxml);"
  merge: -1
  pgno: 256
- img_proc: true
  md: "242 Scraping tools\n\n})();\n\nfunction getCategories(sitemapxml) {\n\n let\
    \ resolve;\n\n const promise = new Promise(r => resolve = r);\n\n xmlParser(sitemapxml,\
    \ function (err, result) {\n\n const output = result.urlset.url\n\n .filter(url\
    \ => url.loc\\[0\\].match(/\\\\//g).length === 3)\n\n .slice(0, 10)\n\n .map(url\
    \ => url.loc\\[0\\]);\n\n resolve(output);\n\n });\n\n return promise;\n\n};\n\
    \nAs you can see, we are using the same Promise pattern we used before. When we\
    \ call \n\nxmlParser, we will get the parsed result in the result argument of\
    \ the callback we just \n\npassed in. Once we get the result, we prepare the output.\
    \ It might be helpful to read the \n\ncode while looking at the sitemap.xml file\
    \ to get more context. We get URL elements \n\nfrom the result.urlset.url array.\
    \ Then we filter URL elements with a loc with \n\nthree slashes (such as https://www.packtpub.com/web-development).\
    \ Then, we \n\ngrab only the first 10 elements using the slice function. Lastly,\
    \ we use the map function \n\nto return only the resulting URL, returning an array\
    \ of strings containing category URLs.\n\nNow it's time to use Puppeteer. We will\
    \ navigate each of the categories we grabbed from \n\nthe sitemap.xml and return\
    \ book URLs. We are not going to scrape only the first page \n\nof the category\
    \ page. I'll leave that feature to you as homework.\n\nLet's begin by creating\
    \ a browser that we are going to use across the program:\n\n(async function()\
    \ {\n\n /\\*Previous code\\*/\n\n const books = \\[\\];\n\n const page = await\
    \ getPuppeteerPage();\n\n})();\n\nasync function getPuppeteerPage() {\n\n const\
    \ browser = await puppeteer.launch({\n\n headless: false, \n\n slowMo: 500\n\n\
    \ });"
  merge: -1
  pgno: 257
- img_proc: true
  md: "Creating scrapers 243\n\n const userAgent = await browser.userAgent();\n\n\
    \ const page = await browser.newPage();\n\n await page.setUserAgent(userAgent\
    \ + ' \n\nUITestingWithPuppeteerDemoBot');\n\n return page;\n\n}\n\nI bet you\
    \ are pretty familiar with this piece of code. The first new thing we can see\
    \ \n\nhere is that we are passing the slowMo option. That means that we are going\
    \ to wait \n\n500 milliseconds after each action that Puppeteer will perform.\
    \ We will also use the \n\nuserAgent function to get the user-agent from the browser.\
    \ Then, we grab that string, \n\nand we append ' UITestingWithPuppeteerDemoBot',\
    \ so the server admins in the \n\npublisher will know that's us.\n\nLet the scraping\
    \ begin!\n\n(async function() {\n\n /\\*Previous code\\*/\n\n for(const categoryURL\
    \ of categories) {\n\n const newBooks = await getBooks(categoryURL, page);\n\n\
    \ if(newBooks) {\n\n books.push(...newBooks);\n\n }\n\n }\n\n page.browser().close();\n\
    \n})();\n\nasync function getBooks(categoryURL, page) {\n\n try {\n\n await page.goto(categoryURL);\n\
    \n await page.waitForSelector('a.card-body');\n\n return await page.evaluate(()\
    \ => {\n\n const links = document.querySelectorAll('a.card-\n\nbody');\n\n return\
    \ Array.from(links).map(l => \n\nl.getAttribute('href')).slice(0, 10);\n\n });\n\
    \n }\n\n catch {\n\n console.log(\\`Unable to get books from ${categoryURL}\\\
    `);"
  merge: -1
  pgno: 258
- img_proc: true
  md: "244 Scraping tools\n\n }\n\n}\n\nWe will iterate through the categories list\
    \ in the main function, and we will call \n\ngetBooks, passing categoryURL and\
    \ a Puppeteer page. That function will return \n\na list of book URLs that we\
    \ will append to our books array using the push function. \n\nWe are using slice(0,\
    \ 10), so we return only the first 10 items. \n\nWe wrapped all the code into\
    \ a try/catch block because we don't want the code to fail \n\nif one category\
    \ has failed.\n\nLet's now take a look at the getBooks function. It looks pretty\
    \ straightforward. We go \n\nto categoryURL and wait for an element using the\
    \ a.card-body CSS selector. That \n\nselector will give us book URLs. Once the\
    \ books are loaded, we will call evaluate so we \n\ncan get all the links with\
    \ a.card-body, and then, using the map function, we will return \n\nthe href attribute\
    \ of the link, which will give us the URL.\n\nScraping books won't be that different:\n\
    \n(async function() {\n\n /\\*Previous code\\*/\n\n const prices = \\[\\];\n\n\
    \ for(const bookURL of books) {\n\n const price = await getPrice(bookURL, page);\n\
    \n if(price) {\n\n prices.push(price);\n\n }\n\n }\n\n fs.writeFile('./prices.json',\
    \ prices);\n\n page.browser().close();\n\n})();\n\nasync function getPrice(bookURL,\
    \ page) {\n\n try\n\n {\n\n await page.goto(bookURL);\n\n await page.waitForSelector('.price-list\\\
    _\\_item .price-\n\nlist\\_\\_price');\n\n return await page.evaluate(() => {\n\
    \n const prices = document.querySelectorAll('.price-\n\nlist\\_\\_item .price-list\\\
    _\\_price');"
  merge: -1
  pgno: 259
- img_proc: true
  md: "Creating scrapers 245\n\n if(document.querySelectorAll('.price-list\\_\\_name')\n\
    \n\\[1\\].innerText.trim() == 'Print + eBook') {\n\n return {\n\n book: document.querySelector('.product-\n\
    \ninfo\\_\\_title').innerText,\n\n print: prices\\[1\\].innerText,\n\n ebook:\
    \ prices\\[2\\].innerText,\n\n }\n\n }\n\n });\n\n }\n\n catch {\n\n console.log(\\\
    `Unable to get price from ${bookURL}\\`);\n\n }\n\n}\n\nHere we are applying everything\
    \ we have already learned in this book. We go to a page, \n\nwait for a selector,\
    \ and then we will call the evaluate function, which will return an \n\nobject.\
    \ We haven't used the evaluate function in this way yet. \n\nInside evaluate we\
    \ get the prices using the.price-list\\_\\_item .price-list\\_\\_\n\nprice CSS\
    \ selector, and we get the book title using the.product-info\\_\\_title CSS \n\
    \nselector. Then, if the product name is \"Print + eBook\", because the site also\
    \ offers \n\nvideos, we return an object with three properties: book, print, and\
    \ ebook.\n\nThe last thing to highlight is that we are wrapping the code in a\
    \ try/catch block. If we \n\nfail in fetching one book, we don't want the entire\
    \ program to fail.\n\nThe main function will collect those results and then save\
    \ them to the file using \n\nfs.writeFile. In order to use that function, you\
    \ will need to import fs by adding \n\nconst fs = require('fs'); in the first\
    \ line of the program.\n\nIf everything goes as expected, we will get a prices.json\
    \ file with something like this:\n\n\\[\n\n {\n\n \"book\": \"Kubernetes and Docker\
    \ - An Enterprise Guide\",\n\n \"print\": \"$39.99\",\n\n \"ebook\": \"$5.00 Was\
    \ $27.99\"\n\n },\n\n {"
  merge: -1
  pgno: 260
- img_proc: true
  md: "246 Scraping tools\n\n \"book\": \"The Docker Workshop\",\n\n \"print\": \"\
    $39.99\",\n\n \"ebook\": \"$5.00 Was $27.99\"\n\n },\n\n\\]\n\nAnd we have our\
    \ first scraper. From there, you have the data in the filesystem ready to be \n\
    \nanalyzed by other tools.\n\nCan this be made better? Yes, it can. We could try\
    \ to see whether we can do some parallel \n\nscraping.\n\n**Running scrapers in\
    \ parallel**\n\nI'm not saying this just because I coded it, but our scraper has\
    \ a pretty good structure. \n\nEvery piece is separated into different functions,\
    \ making it easy to identify which parts \n\ncan run in parallel.\n\nI don't want\
    \ to sound repetitive, but remember, the site being scraped, in this case, Packt,\
    \ \n\nis our friend and even my publisher. We don't affect the site; we want to\
    \ look like normal \n\nusers. We don't want to run 1,000 calls in parallel. We\
    \ don't need to do that. So, we will try \n\nto run our scraper in parallel but\
    \ with caution.\n\nThe good news is that we don't have to code a parallel architecture\
    \ to solve this. We will \n\nuse a package called **puppeteer-cluster** (https://www.npmjs.com/package/\n\
    \npuppeteer-cluster). This is what this library does according to the description\
    \ \n\nat npmjs:\n\n• Handles crawling errors\n\n• Auto restarts the browser in\
    \ case of a crash\n\n• Can automatically retry if a job fails\n\n• Offers different\
    \ concurrency models to choose from (pages, contexts, browsers)\n\n• Is simple\
    \ to use, small boilerplate\n\n• Offers progress view and monitoring statistics\
    \ (see the following code snippet)\n\nSounds pretty promising. Let's see how we\
    \ can implement it. First, we need to install the \n\npackage:\n\n**npm install\
    \ puppeteer-cluster**"
  merge: -1
  pgno: 261
- img_proc: true
  md: "Running scrapers in parallel 247\n\nThat will get us the package ready to be\
    \ used. You can get the code of this section in the \n\ncrawler-with-cluster.js\
    \ file. Let's import the cluster in our scraper by calling \n\nrequire in the\
    \ first line of our code:\n\nconst { Cluster } = require(\"puppeteer-cluster\"\
    );\n\nNow that we have imported the Cluster class, we can create a new **cluster**\
    \ in the main \n\nfunction:\n\nconst cluster = await Cluster.launch({\n\n concurrency:\
    \ Cluster.CONCURRENCY\\_PAGE,\n\n maxConcurrency: 2,\n\n retryLimit: 1,\n\n monitor:\
    \ true,\n\n puppeteerOptions: {\n\n headless : false, \n\n slowMo: 500\n\n }\n\
    \n});\n\nThe Cluster.launch function has many options, but I think that, for now,\
    \ we only \n\nneed to know about these options:\n\n•  concurrency will tell the\
    \ cluster the level of isolation we want to use. The default \n\nis Cluster.CONCURRENCY\\\
    _CONTEXT. These are all the options available:\n\na) Using Cluster.CONCURRENCY\\\
    _CONTEXT, each job will have its own context.\n\nb) Using Cluster.CONCURRENCY\\\
    _PAGE, each job will have its own page, but the \n\nsame context will be shared\
    \ across all jobs. \n\nc) Using Cluster.CONCURRENCY\\_BROWSER, each job will have\
    \ its own browser.\n\n•  maxConcurrency will help us set how many tasks we want\
    \ to run simultaneously.\n\n• With retryLimit, we can set how many times the cluster\
    \ will run a task if it fails. \n\nThe default is 0, but we will give it one more\
    \ chance to do the task, setting this to 1.\n\n• If we set the monitor option\
    \ to true, we will get a nice console output, showing \n\nthe current process.\n\
    \n• The last option we will cover here is puppeteerOptions. The cluster will pass\
    \ \n\nthis object to the puppeteer.launch function."
  merge: -1
  pgno: 262
- img_proc: true
  md: "248 Scraping tools\n\nOne thing that the package description mentions is that\
    \ it supports error handling. Let's \n\nadd the error handling they have in the\
    \ example:\n\ncluster.on('taskerror', (err, data, willRetry) => {\n\n if (willRetry)\
    \ {\n\n console.warn(\\`Encountered an error while crawling \n\n${data}. ${err.message}\\\
    \\nThis job will be retried\\`);\n\n } else {\n\n console.error(\\`Failed to crawl\
    \ ${data}: ${err.message}\\`);\n\n }\n\n});\n\nThat looks pretty solid. When a\
    \ task fails, the cluster will fire a taskerror event. There \n\nwe can see the\
    \ error, the data, and whether the action will be retried.\n\nWe don't need to\
    \ change how we download and process sitemap.xml. There is nothing \n\nto change\
    \ there. But once we have the category, instead of calling the getBooks function,\
    \ \n\nwe will use queue for that task:\n\nfor(const categoryURL of categories)\
    \ {\n\n cluster.queue(categoryURL, getBooks);\n\n}\n\nWe are telling the cluster\
    \ that we need to run getBooks by passing that categoryURL.\n\nI have more good\
    \ news. Our scraping functions are almost ready to be used in \n\na cluster –\
    \ **almost ready**. We need to change four things:\n\nasync function getBooks({page,\
    \ data}) {\n\n const userAgent = await page.browser().userAgent();\n\n await page.setUserAgent(userAgent\
    \ + ' \n\nUITestingWithPuppeteerDemoBot');\n\n await page.goto(data);\n\n await\
    \ page.waitForSelector('a.card-body');\n\n \n\n const newBooks = await page.evaluate(()\
    \ => {\n\n const links = document.querySelectorAll('a.card-body');\n\n return\
    \ Array.from(links).map(l => \n\nl.getAttribute('href')).slice(0, 10);\n\n });"
