  md: "Running our checks with Checkly 167\n\nOnce you create an account in *Checkly*,\
    \ you will be able to upload your tests (or checks), \n\nand *Checkly* will run\
    \ those checks every certain number of minutes, reporting back. \n\nFirstly, it\
    \ will report whether the check is passing, and secondly, it will report the time\
    \ it \n\ntook to run.\n\nYou will also be able to test your website's API without\
    \ running a browser. This is huge. \n\nIt's like having your own, personal quality\
    \ guard.\n\nLet's go to https://www.checklyhq.com/ and start our trial. Follow\
