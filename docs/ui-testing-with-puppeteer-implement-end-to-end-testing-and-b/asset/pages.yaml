  md: "56 Navigating through a website\n\n**Using the Puppeteer.launch function**\n\
    \nThese are all the options Puppeteer.launch supports in Puppeteer 7 according\
    \ to the \n\nofficial docs (https://github.com/puppeteer/puppeteer/blob/v7.0.0/\n\
    \ndocs/api.md#puppeteerlaunchoptions):\n\n•  product: Which browser to launch.\
    \ At this time, this is \n\neither chrome or firefox.\n\n•  ignoreHTTPSErrors:\
    \ Whether to ignore HTTPS errors during navigation. \n\nThis option will become\
    \ handy when you want to automate websites with invalid \n\nor missing SSL certificates.\
    \ This will prevent Chromium from returning an invalid \n\ncertificate page in\
    \ those cases.\n\n•  headless: Whether to run the browser in headless mode. Defaults\
    \ to true unless \n\nthe devtools option is true.\n\n•  executablePath: Path to\
    \ a browser executable to run instead of the bundled \n\nChromium.\n\n•  slowMo:\
    \ Slows down Puppeteer operations by the specified number of \n\nmilliseconds.\
    \ Useful so that you can see what is going on.\n\n•  defaultViewport: Sets a consistent\
    \ viewport for each page. Defaults to an \n\n800x600 viewport. null disables the\
    \ default viewport. A viewport is an object with \n\nthe following properties:\n\
    \na) width: page width in pixels.\n\nb) height: page height in pixels.\n\nc) deviceScaleFactor:\
    \ Specify device scale factor.\n\nd) isMobile: Whether the meta viewport tag is\
    \ taken into account.\n\ne) hasTouch: Specifies whether the viewport supports\
    \ touch events.\n\nf) isLandscape: Specifies whether the viewport is in landscape\
    \ mode.\n\n•  args: Additional arguments to pass to the browser instance.\n\n\
    •  ignoreDefaultArgs: If true, then do not use puppeteer.defaultArgs(). \n\nIf\
    \ an array is given, then filter out the given default arguments."
  merge: -1
  pgno: 71
- img_proc: true
  md: "Creating a Puppeteer browser 57\n\n•  handleSIGINT: Close the browser process\
    \ on *Ctrl +C*.\n\n•  handleSIGTERM: Close the browser process on SIGTERM.\n\n\
    •  handleSIGHUP: Close the browser process on SIGHUP.\n\n•  timeout: Maximum time\
    \ in milliseconds to wait for the browser instance to \n\nstart. Defaults to 30000 (30\
    \ seconds). Passing 0 disables the timeout.\n\n•  dumpio: Whether to pipe the\
    \ browser process stdout and stderr \n\ninto process.stdout and process.stderr.\n\
    \n•  userDataDir: Path to a user data directory.\n\n•  env: Specify environment\
    \ variables that will be visible to the browser.\n\n•  devtools: Whether to auto-open\
    \ a DevTools panel for each tab. If this option \n\nis true, the headless option\
    \ will be set to false.\n\n•  pipe: Connects to the browser over a pipe instead\
    \ of a WebSocket. Defaults \n\nto false.\n\n•  extraPrefsFirefox: Additional preferences that\
    \ can be passed to Firefox.\n\nThat's a long list, I know. But I didn't want to\
    \ just write about the features I think are \n\ninteresting. I want you to have\
    \ the full picture of the launch option. Now, let's talk about \n\nabout the options\
    \ you do need to know.\n\n**Headless**\n\nI think the headless option is the most\
    \ used. Remember I told you we were going to use \n\nheadless browsers? I won't\
    \ say that I lied, but I lied. Headless mode is the default mode, \n\nbut in fact,\
    \ you could launch a browser with headless in false, also known as *\"headful\
    \ *\n\n*mode.\"* Headful mode is useful while debugging automation code because\
    \ you will see \n\nwhat is going on in the browser. I bet that will be the default\
    \ local setting. This is how you \n\ncan launch the browser in headful mode:\n\
    \nconst browser = await puppeteer.launch({ headless: false });"
  merge: -1
  pgno: 72
- img_proc: true
  md: "58 Navigating through a website\n\nThis line of code will launch a browser\
    \ that will almost look like a normal browser.\n\nA browser in headful mode\n\n\
    As you can see, that's a full working browser. The only difference is that you\
    \ will get that \n\nbanner saying that *\"Chrome is being controlled by automated\
    \ test software.\"* If someone asks \n\nyou, no, you can't remove that banner.\
    \ I believe that with so much phishing and hacking \n\naround the internet, it's\
    \ important to tell a potential user of the browser that there is an \n\napp behind\
    \ it controlling and monitoring the browser activity.\n\n**The user data directory**\n\
    \nThe **user data directory** is where the browser stores user data, such as history,\
    \ bookmarks, \n\nand cookies. If we don't pass a userDataDir, Puppeteer will create\
    \ a new directory \n\nbefore launching the browser. Then it will delete it when\
    \ the browser is closed. That would \n\nmean that sessions or anything we store\
    \ in cookies won't be preserved across test runs.\n\nIn UI testing, we might want\
    \ to use this option to check whether the site uses the local \n\nstorage (for\
    \ example, cookies) as expected. Does the site remember the logged-in user? \n\
    \nIs the cart being preserved?\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_73_0.png)"
  merge: -1
  pgno: 73
- img_proc: true
  md: "Creating a Puppeteer browser 59\n\n**Executable Path**\n\nThe executablePath\
    \ option is not common on UI testing. Most tests will run using \n\nthe browser\
    \ downloaded by Puppeteer. Still, this option is used a lot in task automation\
    \ \n\nor scraping, when you want to use the browser you would normally use, or\
    \ in some \n\ncontinuous integration environments, where you want to run an already\
    \ downloaded \n\nbrowser.\n\nAs we saw in *Chapter 1*, *Getting started with Puppeteer*,\
    \ Puppeteer is guaranteed to work \n\nwith a specific version of Chromium. In\
    \ the case of Puppeteer 7.0.0, the Chromium \n\nversion is 90.0.4403.0. That doesn't\
    \ mean that it will not work with any other version, \n\nbut it's not guaranteed.\n\
    \n**Tip**\n\nIf you are a macOS user, the Chrome executable will be inside the\
    \ application \n\nbundle Google Chrome.app. For example, /Applications/\n\nGoogle\
    \ Chrome.app/Contents/MacOS/Google Chrome.\n\nUsing the executablePath option\
    \ won't be enough if we want to use the exact same \n\nbrowser we would normally\
    \ use. Remember that Puppeteer will create a new user data \n\ndirectory if we\
    \ don't pass one. We need to pass the user data directory our browser uses. \n\
    \nIt should be %LOCALAPPDATA%\\\\Google\\\\Chrome�ser Data in Windows, ~/\n\n\
    Library/Application Support/Google/Chrome in Mac, or ~/.config/\n\ngoogle-chrome\
    \ in Linux. If you want to double-check that value, you can navigate to \n\nchrome://version/\
    \ using your browser. There you will see the current **Profile Path**. \n\nYou\
    \ need to remove the Default directory in macOS.\n\n**Tip**\n\nIf you are going\
    \ to use your own browser, you can install puppeteer-core \n\ninstead of Puppeteer.\
    \ puppeteer-core won't download a browser, speeding up \n\nyour install time and\
    \ saving disk space."
  merge: -1
