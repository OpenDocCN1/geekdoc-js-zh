- img_proc: true
  md: "How to avoid being detected as a bot 251\n\nWebsites that don't want to be\
    \ scraped, and are being actively scraped, will invest \n\na good amount of time\
    \ and money in trying not to be scraped. The effort would become \n\neven more\
    \ important if the scrapers damage not only the site's performance but also the\
    \ \n\nbusiness.\n\nDevelopers in charge of dealing with bots won't rely only on\
    \ the user agent because, as we \n\nsaw, that could be easily manipulated. They\
    \ should rely only on evaluating the number \n\nof requests from an IP because,\
    \ as we also saw, scrapers can slow down their scripts, \n\nsimulating an interested\
    \ user.\n\nIf the site can't stop scrapers by checking the user agent and monitoring\
    \ traffic spikes, they \n\nwould try to catch scrapers using different techniques.\n\
    \nThey would begin by introducing CAPTCHAs. But, as we will see in this section,\
    \ scrapers \n\ncan solve some of them.\n\nThen, they would try to evaluate the\
    \ time between requests. Did you click a link after 500 \n\nmilliseconds? Did\
    \ you fill a form in less than 1 second? You might be a bot.\n\nThey could also\
    \ add JavaScript code to check your browser capabilities. Don't you have \n\n\
    plugins? Not even the ones that come with Chrome by default? Don't you have a\
    \ language \n\nset? You might be a bot.\n\nFinally, they will try to set traps\
    \ to catch you. For instance, Packt knows that you might \n\nbe scraping links\
    \ using the a.card-body CSS selector. They could add a hidden link \n\nwith that\
    \ selector, but in that case, the link's URL could be https://www.packtpub.\n\n\
    com/bot-detected. If you got to the bot-detected URL, you would get caught. In\
    \ the \n\ncase of forms, they could add hidden inputs that a typical user wouldn't\
    \ complete because \n\nit is hidden. If the server gets a value in that hidden\
    \ input, sorry—you were caught again.\n\nThis is a cat-and-mouse game. The mouse\
    \ will always try to find new ways to sneak in, \n\nand the cat will work hard\
    \ to cover the holes in the wall.\n\nThat being said, let's see what tools we\
    \ have if we are the mouse in this game.\n\nAntoine Vastel has a great bot detection\
    \ demo page (https://arh.antoinevastel.\n\ncom/bots/areyouheadless). You can get\
    \ the code of this section in the bot.js file. \n\nLet's try to take a screenshot\
    \ of that page using Puppeteer:\n\nconst puppeteer = require('puppeteer');\n\n\
    (async function() {\n\n const browser = await puppeteer.launch({});\n\n const\
    \ page = await browser.newPage();"
  merge: -1
  pgno: 266
- img_proc: true
  md: "252 Scraping tools\n\n await page.goto('https://arh.antoinevastel.com/bots/\n\
    \nareyouheadless');\n\n await page.screenshot({ path : './bot.png'});\n\n browser.close()\n\
    \n})();\n\nSimple Puppeteer code. We open the browser in headless mode, navigate\
    \ to the page, \n\nand take a screenshot. Let's see what the screenshot looks\
    \ like:\n\nAntoine Vastel's bot detection\n\nAntoine got us. We were detected\
    \ as a bot, but that's not the end of the game. There are \n\na few things we\
    \ can do. Let's start by incorporating puppeteer-extra (https://\n\ngithub.com/berstend/puppeteer-extra).\
    \ The puppeteer-extra package \n\nallows us to add plugins to Puppeteer. This\
    \ package will allow us to use the puppeteer-\n\nextra-plugin-stealth plugin (https://www.npmjs.com/package/\n\
    \npuppeteer-extra-plugin-stealth). This package is like a mouse master in this\
    \ \n\ngame. It will add all the tricks (or many tricks), so our code is not detected\
    \ as a bot.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_267_0.png)"
  merge: -1
  pgno: 267
- img_proc: true
  md: "How to avoid being detected as a bot 253\n\nThe first thing we need to do is\
    \ install those two packages from the terminal:\n\n**npm install puppeteer-extra**\n\
    \n**npm install puppeteer-extra-plugin-stealth**\n\nNow we can replace this line:\n\
    \nconst puppeteer = require('puppeteer');\n\nWe replace it with these three lines:\n\
    \nconst puppeteer = require('puppeteer-extra');\n\nconst StealthPlugin = require('puppeteer-extra-plugin-\n\
    \nstealth');\n\npuppeteer.use(StealthPlugin());\n\nThere, we import puppeteer,\
    \ but from puppeteer-extra. Then, we import the \n\nstealth plugin and install\
    \ it using the use function. And that's it!\n\nAntoine Vastel's bot detection\
    \ bypassed\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_268_0.png)"
  merge: -1
  pgno: 268
- img_proc: true
  md: "254 Scraping tools\n\nThe puppeteer-extra-plugin-stealth package is not bulletproof.\
    \ As I \n\nmentioned before, it's a cat-and-mouse game. There are many other extras\
    \ you can use. \n\nYou can see the full list in the package's repository (https://www.hardkoded.com/\n\
    \nui-testing-with-puppeteer/puppeteer-extra-packages). There, you can \n\nfind\
    \ puppeteer-extra-plugin-anonymize-ua, which will change the user agent \n\nin\
    \ all the pages, or puppeteer-extra-plugin-recaptcha, which will try to solve\
    \ \n\nreCAPTCHA (https://www.google.com/recaptcha/about/) challenges.\n\nA scraping\
    \ chapter wouldn't be complete if we didn't talk, at least a little, about how\
    \ to \n\ndeal with authorization.\n\n**Dealing with authorization**\n\nAuthentication\
    \ and authorization is a vast topic in web development. Authentication \n\nis\
    \ how a website can identify you. To make it simple, it's the login. On the other\
    \ hand, \n\nauthorization is what you can do on the site once you are authenticated,\
    \ for instance, \n\nchecking whether you have access to a specific page.\n\nThere\
    \ are many types of authentication modes. We covered the simplest one in this\
    \ book: \n\na user and password login page. But things can get more complicated.\
    \ Testing integration \n\nwith Facebook or single sign\\-on logins could be quite\
    \ challenging, but they would be \n\nabout automating user interaction.\n\nThere\
    \ is one authentication method that you won't be able to perform by automating\
    \ the \n\nDOM—**HTTP basic authentication**:\n\nHTTP basic authentication\n\n\
    ![](img/a12c4f728acd6f69fe58d97e7f64e4f5_269_0.png)"
  merge: -1
  pgno: 269
- img_proc: true
  md: "Dealing with authorization 255\n\nThat login popup is not popular these days.\
    \ In fact, I don't think they ever were popular. \n\nBut you might have seen them\
    \ if you have set up a router. That modal is like the dialogs \n\nwe saw in *Chapter\
    \ 5*, *Waiting for elements and network calls*. Puppeteer won't help us out \n\
    \nwith this authentication because there is no HTML to automate there. Luckily\
    \ for us, \n\nautomating this is easy. You can get the code of this section in\
    \ the authentication.js \n\nfile:\n\n(async function() {\n\n const browser = await\
    \ puppeteer.launch();\n\n const page = await browser.newPage();\n\n await page.authenticate({username:\
    \ 'user', password: \n\n'password'});\n\n await page.goto('https://ptsv2.com/t/ui-testing-puppeteer/\n\
    \npost');\n\n await page.screenshot({ path : './authentication.png'});\n\n browser.close()\n\
    \n})();\n\nThe only thing we need to do to authenticate into https://ptsv2.com/t/\n\
    \nui-testing-puppeteer/post is to call the authenticate function before calling\
    \ \n\ngoto. The authenticate function expects an object with two properties: username\
    \ \n\nand password.\n\nOnce we are authenticated, we need to tell the server who\
    \ we are on every request, so they \n\ncan authorize us (or not) to perform certain\
    \ tasks. The web server is, in theory, stateless. \n\nIt doesn't have a way to\
    \ know who we are unless 1) they inject some information in \n\ntheir responses,\
    \ using cookies, or 2) we tell them. The most common way is with HTTP \n\nHeaders.\
    \ But that can be solved by passing a key as a Query String argument or as part\
    \ of \n\nthe HTTP post data. \n\nWhen you want to alter the authentication data,\
    \ you need to get that information \n\nelsewhere. You might need to open your\
    \ browser, log in to the site you want to scrape, and \n\nextract the authentication\
    \ data from there, so you can then use that data in your scraper."
  merge: -1
  pgno: 270
- img_proc: true
  md: "256 Scraping tools\n\nLet's say that you want to scrape the Packt website,\
    \ but this time you want to scrape it \n\nbeing logged in. So, you open your browser,\
    \ log in and then you can use a tool such as \n\nthe *Export cookie JSON file\
    \ for Puppeteer* extension (you can find it with that name in the \n\nChrome web\
    \ store) to export all the cookies generated by the site. Once we have the JSON\
    \ \n\nfile named account.packtpub.com.cookies.json with all the cookies, you can\
    \ \n\ncopy that file into your workspace and do something like this:\n\nconst\
    \ puppeteer = require('puppeteer');\n\nconst cookies = require('./account.packtpub.com.cookies.json');\n\
    \n(async function() {\n\n const browser = await puppeteer.launch({defaultViewport\
    \ : { \n\nwidth: 1024, height: 1024}});\n\n const page = await browser.newPage();\n\
    \n await page.setCookie(...cookies);\n\n await page.goto('https://account.packtpub.com/account/\n\
    \ndetails');\n\n await page.waitForSelector('\\[autocomplete=\"given-name\"\\\
    ]');\n\n await page.screenshot({ path : './cookies.png'});\n\n browser.close()\n\
    \n})();\n\nThe new element in this code is a call to the setCookie function. That\
    \ function expects \n\na list of cookies. As we have all the cookies in a JSON\
    \ file, we load that JSON file and pass \n\nthe content to the setCookie function.\
    \ Let's take a look at what a cookie looks like \n\ninside that file:\n\n{\n\n\
    \ \"name\": \"packt\\_privacy\",\n\n \"value\": \"true\",\n\n \"domain\": \".packtpub.com\"\
    ,\n\n \"path\": \"/\",\n\n \"expires\": 1611427077,\n\n \"httpOnly\": false,\n\
    \n \"secure\": false\n\n}"
  merge: -1
  pgno: 271
- img_proc: true
  md: "Dealing with authorization 257\n\nThe structure is quite simple and straightforward.\
    \ You don't need to use an extension and \n\nload a cookie from a JSON file. You\
    \ can call the setCookie function passing an object \n\nwith the name, value,\
    \ domain, path, and expires properties (the latter is a Unix \n\ntime in seconds),\
    \ whether it's httpOnly, and whether it should be marked as secure.\n\nNow it's\
    \ time to see how we can handle authorizations implemented using HTTP headers.\
    \ \n\nYou might find sites using the authorization HTTP header to pass some kind\
    \ of user \n\nidentifier. The authorization header would look something like this:\
    \ \n\nAuthorization: <type> <credentials>\n\nAccording to MDN (https://www.hardkoded.com/ui-testing-with-\n\
    \npuppeteer/authentication-schemes), you can find the following types: Basic,\
    \ \n\nBearer, Digest, HOBA, Mutual, and AWS4-HMAC-SHA256. If those names sound\
    \ \n\nscary, don't worry about that. There is a high chance that you will only\
    \ see the Bearer \n\ntype. What would be the credentials? Well, that's what you\
    \ will need to find out while \n\ncoding your scraper. You would need to see what\
    \ information is being sent when you use \n\na website for real and try to mimic\
    \ that.\n\nFor our example, we will use Basic because that's the same HTTP basic\
    \ authentication \n\nwe saw before. When you log in using the authentication popup,\
    \ the browser will send \n\nthe authorization header passing basic and username:password\
    \ in Base64. In our \n\nexample, the username was user, and the password was password.\
    \ So, we can use any \n\nBase64 encoder available, for instance, https://www.base64encode.net/,\
    \ and get \n\nuser:password in base64: dXNlcjpwYXNzd29yZA==.\n\nWe can inject\
    \ this header in two ways. The first one is using the \n\nsetExtraHTTPHeaders\
    \ function. You can see this code in the header-inject.js \n\nfile:\n\n(async\
    \ function() {\n\n const browser = await puppeteer.launch();\n\n const page =\
    \ await browser.newPage();\n\n await page.setExtraHTTPHeaders({\n\n authorization:\
    \ 'basic dXNlcjpwYXNzd29yZA=='\n\n });\n\n await page.goto('https://ptsv2.com/t/ui-testing-puppeteer/\n\
    \npost');\n\n await page.screenshot({ path : './authentication-header.\n\npng'});\n\
    \n browser.close()\n\n})();"
  merge: -1
  pgno: 272
- img_proc: true
  md: "258 Scraping tools\n\nsetExtraHTTPHeaders expects an object where the property\
    \ name is the header \n\nname, and the value is the header value. Here we are\
    \ adding the authorization header \n\nwith the value 'basic dXNlcjpwYXNzd29yZA=='.\
    \ And that's it. Puppeteer will add \n\nthat header to every request that the\
    \ page will make.\n\nBut what if the site we are trying to scrape needs an authorization\
    \ header not in every \n\nrequest, but only in some of them? Well, it will be\
    \ quite tricky, but not that hard. You can \n\nfollow this code in the header-inject2.js\
    \ file:\n\nconst puppeteer = require('puppeteer');\n\n(**async function**() {\n\
    \n **const** browser = await puppeteer.launch();\n\n **const** page = await browser.newPage();\n\
    \n await page.setRequestInterception(true);\n\n page.on('request', r => {\n\n\
    \ **const** overrides = {\n\n headers: r.headers()\n\n };\n\n if(r.url() == 'https://ptsv2.com/t/ui-testing-\n\
    \npuppeteer/post')\n\n overrides.headers.authorization = 'basic \n\ndXNlcjpwYXNzd29yZA==';\n\
    \n \n\n r.continue(overrides);\n\n });\n\n await page.goto('https://ptsv2.com/t/ui-testing-puppeteer/\n\
    \npost');\n\n await page.screenshot({ path : './authentication-header.\n\npng'});\n\
    \n browser.close()\n\n})();"
  merge: -1
  pgno: 273
- img_proc: true
  md: "Summary 259\n\nWe are first telling Puppeteer we want to intercept every request\
    \ the page will make. \n\nWe do that by calling the setRequestInterception function\
    \ with the first argument \n\nas true. Then we start listening to the request\
    \ event. If the request meets the condition \n\nwe need, in this case, if it matches\
    \ our URL, we create an overrides object with \n\na headers property and then\
    \ call the continue function of the request object. \n\nWe cannot override the\
    \ headers. The overrides object can also have the url, method \n\n(the HTTP method),\
    \ and postData properties.\n\nThe request object also has a function called abort.\
    \ With this function, you can cancel \n\nthat request. For instance, you could\
    \ check whether the request is an image and abort it. \n\nThe result will be a\
    \ website with no images.\n\n**Important Note**\n\nIf you call setRequestInterception,\
    \ you need to implement \n\na request event listener. And you need to continue\
    \ or abort every \n\nrequest you listen to.\n\nAs I mentioned when I opened this\
    \ section, this doesn't cover all the different \n\nauthentication and authorization\
    \ schemes, but it will have you covered in more than \n\n90% of cases. Now it's\
    \ time for a wrap-up.\n\n**Summary**\n\nAlthough this is not a scraping book,\
    \ we covered a lot of ground here. I hope the first \n\nsection gave you a good\
    \ idea of what scraping is, as well as covering what you can \n\ndo and what you\
    \ shouldn't do. We also learned how to create our own scrapers. We \n\ncreated\
    \ a crawler in less than 100 lines. We added two new tools to our toolbox: \n\n\
    puppeteer-cluster and puppeteer-extra. We closed this chapter learning \n\na little\
    \ bit about authentication and authorization, giving you almost everything you\
    \ \n\nneed to get started in the scraping world.\n\nIf you weren't that excited\
    \ about scraping before this chapter, I hope it is the spark that \n\nwill make\
    \ you start creating your own scrapers. If you knew about scraping, I hope this\
    \ \n\nchapter gave you more tools to scrape as a professional.\n\nOur next and\
    \ final chapter will be about performance and how we can measure it using \n\n\
    Puppeteer."
  merge: -1
