- img_proc: true
  md: "**4**\n\n**Interacting **\n\n**with a page**\n\nThanks to *Chapter 3*, *Navigating\
    \ through a website*, we now know how to open a browser \n\nand all the different\
    \ options we have to launch browsers and create new pages. We also \n\nknow how\
    \ to navigate through other pages. We learned about HTTP responses and how \n\n\
    they are related to a request.\n\nThis chapter is about interaction. Emulating\
    \ user interaction is essential in UI testing. \n\nThere is one pattern in unit\
    \ testing called **Arrange-Act-Assert** (**AAA**). This pattern \n\nenforces a\
    \ particular order in the test code:\n\n• Arrange – Prepare the context.\n\n•\
    \ Act – Interact with the page. \n\n• Assert – Check the page reaction.\n\nIn\
    \ this chapter, we will learn how to find elements on a page. We will understand\
    \ how \n\nthe development team can improve their HTML so that you can easily find\
    \ elements. \n\nBut if you cannot change the page HTML, we will also look at another\
    \ set of tools to find \n\nthe elements we need."
  merge: -1
  pgno: 98
- img_proc: true
  md: "84 Interacting with a page \n\nOnce we find an element, we will want to interact\
    \ with it. Puppeteer provides two sets \n\nof APIs: One is action functions, such\
    \ as click, select, or type. Then we have a set of \n\nemulation functions, such\
    \ as mouse events or keyboard emulation. We will cover all those \n\nfunctions.\n\
    \nThis chapter will introduce a new object we haven't mentioned yet: **The element\
    \ handle**.\n\nBy the end of this chapter, we will have added another tool to\
    \ our toolbox: The Visual \n\nStudio Code debugging tools.\n\nWe will cover the\
    \ following topics in this chapter:\n\n• Introduction to HTML, the DOM, and CSS\n\
    \n• Finding elements\n\n• Finding elements using XPath\n\n• Interacting with elements\n\
    \n• Keyboard and mouse emulation\n\n• Interacting with multiple frames\n\n• Debugging\
    \ tests with Visual Studio Code\n\nBy the end of this chapter, you will be able\
    \ to emulate most types of user interaction. \n\nBut first, we need to lay the\
    \ groundwork. Let's talk about HTML, the **Document Object **\n\n**Model** (**DOM**),\
    \ and CSS.\n\n**Technical requirements**\n\nYou will find all the code of this\
    \ chapter on the GitHub repository (https://github.\n\ncom/PacktPublishing/UI-Testing-with-Puppeteer)\
    \ under the Chapter4 \n\ndirectory. Remember to run npm install on that directory\
    \ and then go to the \n\nChapter4/vuejs-firebase-shopping-cart directory directory\
    \ and run \n\nnpm install again.\n\nIf you want to implement the code while following\
    \ this chapter, you can start from the \n\ncode you left in the Chapter3 directory.\n\
    \n**Introduction to HTML, the DOM, and CSS**\n\nYou won't be able to find elements\
    \ if you don't know CSS, and you won't understand CSS \n\nif you don't understand\
    \ the **DOM** and **HTML**. So, we need to start with the basics."
  merge: -1
  pgno: 99
- img_proc: true
  md: "Introduction to HTML, the DOM, and CSS 85\n\nI bet you've heard that you can\
    \ build a site with HTML, CSS, and JavaScript. You might be \n\nusing different\
    \ server-side technologies. Your frontend might be implemented using cool \n\n\
    technologies such as React or Angular. But in the end, the result will be a page\
    \ based on \n\nHTML, CSS, and JavaScript.\n\n**HTML** is the page's content. If\
    \ you go to any website, open the **DevTools**, and click on \n\nthe **Elements**\
    \ tab, you will see the content of the page. You will see the page's title. If\
    \ it's \n\na news site, you will see all the articles there. If you visit a blog\
    \ post, you will see the text \n\nof that post.\n\nWithout **CSS**, an HTML page\
    \ would look like text written in Notepad. CSS not only \n\nbrings color and fonts,\
    \ but it's also the scaffolding that gives structure to a page.\n\n**Fun fact**\n\
    \nFirefox has a built-in tool to disable all the styles on a page. If you go to\
    \ **View** \n\n| **Page Style** and click on **No Style**, you will see how our\
    \ life would be without \n\nCSS.\n\nThe last piece is JavaScript. JavaScript brings\
    \ behavior to a page. Once the browser parses \n\nthe HTML and builds the DOM,\
    \ it allows us to manipulate and give life to a page.\n\nBut, as I mentioned before,\
    \ we need to go to the basics, to the foundations of the web. Let's \n\nbegin\
    \ with HTML.\n\n**HTML**\n\n**HTML** stands for **HyperText Markup Language**:\
    \ HyperText because the HTML is not \n\ncontent per se; HTML contains the content.\
    \ Markup because it uses tags to give meaning \n\nto that content. And language\
    \ because, although many developers disagree and they get \n\nmad about the idea,\
    \ HTML is a language.\n\nIf we read an HTML file as a data structure, we can say\
    \ that HTML is a **relaxed** version of \n\nXML. So, to better understand HTML,\
    \ we need to look at the basics of XML."
  merge: -1
  pgno: 100
- img_proc: true
  md: "86 Interacting with a page \n\nThese are the basic elements of XML content:\n\
    \nXML Content\n\nIf you look at this figure, you already know almost everything\
    \ you need to know about \n\nXML. Well, maybe I'm exaggerating. But this is the\
    \ idea:\n\n• You have elements, which are represented as <ElementName>. In our\
    \ example, \n\nwe have **<**element> and <child-element>.\n\n• The element might\
    \ have attributes, which are represented as AttributeName=\" \n\nAttributeValue\"\
    . We have value=\"3**\"** and value=\"4\" in our example.\n\n• The element might\
    \ contain other elements. You can see we have two **child-element** \n\nelements\
    \ inside the main **element**.\n\n• An element finishes (is closed) with </ElementName>,\
    \ or with /> at the end \n\ninstead of \\>.\n\nXML parsers are very strict with\
    \ these rules. If the XML content you are trying to parse \n\nbreaks just a single\
    \ rule, the parser will consider the entire XML invalid. Whether it's a \n\nmissing\
    \ closing element or an attribute without quotes, the parser will fail to evaluate\
    \ the \n\nXML content.\n\nBut we will find that browsers are not that strict when\
    \ parsing HTML content. Let's take \n\na look at the following HTML:\n\nA broken\
    \ HTML\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_101_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_101_1.png)"
  merge: -1
  pgno: 101
- img_proc: true
  md: "Introduction to HTML, the DOM, and CSS 87\n\nThis simple HTML will print *Hello\
    \ World* in red in the browser.\n\nIs this valid XML? No. As you can see, the\
    \ <div> element is not closed. But is this valid \n\nHTML? Yes.\n\n**Important\
    \ Note**\n\nThe fact that a browser would try to render *broken* HTML doesn't\
    \ mean that \n\nyou should take that lightly. It's possible you have heard a developer\
    \ say that \n\na particular bug was due to a *missing closing div*. If the HTML\
    \ is broken, for \n\ninstance, it has a missing closing div, the browser will\
    \ try to guess the best \n\nway to render that HTML. The decision the browser\
    \ makes when trying to fix \n\nbroken HTML could end up with the page working\
    \ as expected or with the full \n\npage layout broken.\n\nAnother interesting\
    \ concept is that the XML specification doesn't give meaning to the \n\nelements.\
    \ The names of the elements, the attributes, and the resulting information coming\
    \ \n\nfrom that content depend on who wrote the XML and who is reading it.\n\n\
    HTML is XML with meaning. In *1993*, *Tim Berners-Lee*, who is known as the inventor\
    \ \n\nof the World Wide Web, decided that the main element would be called HTML\
    \ and that \n\nit would contain a BODY. He decided that images would be represented\
    \ as IMG elements, \n\nparagraphs would be P elements, and so on. Over the years,\
    \ browser and web developers \n\nfollowed and improved this convention, getting\
    \ to what we today call HTML5. We, as \n\na community, agreed on the meaning of\
    \ HTML elements.\n\nWe agreed that if we add the text attribute with the value\
    \ red, we will get the text in red, \n\nand so on. How many types of elements\
    \ do we have in HTML? A lot! The good news is \n\nthat you don't need to know\
    \ all of them. \n\nThe more you know, the more productive you will be. However,\
    \ these are the most \n\ncommon elements you will find on a page.\n\n**Document\
    \ structure elements**\n\nEvery HTML document will be contained inside an <html>\
    \ element. That HTML \n\nelement will have two child elements. The first element\
    \ you will find is <head>. Inside \n\nthat <head> element, you will find metadata\
    \ elements, such as <title> with the page \n\ntitle, and many <meta> elements\
    \ with metadata not supported by the standard HTML. \n\nMany sites use <meta>\
    \ to enforce how the page should be shown on social media. The \n\nsecond set\
    \ of elements you will find are **include elements**: <link> elements, including\
    \ \n\nCSS files, and <script> files, including JavaScript code. Although the script\
    \ elements \n\nare accepted in the header, most sites would add their script elements\
    \ at the bottom of the \n\npage for faster rendering."
  merge: -1
  pgno: 102
- img_proc: true
  md: "88 Interacting with a page \n\nThe second element you will find is the <body>\
    \ element. The page itself will be inside this \n\nelement.\n\n**Text elements**\n\
    \nThen we have the basic text elements. \n\n<h1>, <h2>, <h3>, <h4>, <h5>, and\
    \ <h6> are headings. If you have a text editor, you \n\nmight have seen that there\
    \ are many levels of headings and subheadings.\n\n<p> will denote paragraphs.\
    \ Then you might find <span> elements, which help style part \n\nof the text in\
    \ a paragraph.\n\nAnother type of text element is <label>. These labels are linked\
    \ to an input control, such \n\nas a radio button, giving context to that control.\
    \ For example, a radio button or a checkbox \n\ndoesn't have text; it's just a\
    \ check or a radio. You need a label to give them context:\n\nRadio buttons with\
    \ labels\n\nThis HTML has three labels. *Huey* gives context to the first radio\
    \ option, *Dewey* to the \n\nsecond, and *Louie* to the last one.\n\nThe last\
    \ type of text element we will look at is list elements. Lists are expressed as\
    \ a parent \n\nelement, <ul> for unordered lists or <ol> for ordered lists, and\
    \ <li> elements. You will \n\nsee lots of these in menu bars.\n\n**Action elements**\n\
    \nThere are two main action elements in HTML. The <a> anchor, also known as a\
    \ link, was \n\ndesigned to take you to another page, but these days it's not\
    \ limited to that, and it could \n\ntrigger actions inside the page.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_103_0.png)"
  merge: -1
  pgno: 103
- img_proc: true
  md: "Introduction to HTML, the DOM, and CSS 89\n\nThe second element is <button>,\
    \ which again, although it was designed to send data \n\nto the server using an\
    \ HTTP POST request, is now being used for many other kinds \n\nof actions:\n\n\
    **Important note**\n\nThe days when you would only use buttons and links to perform\
    \ actions are in \n\nthe past. As most HTML elements support click events, you\
    \ will find pages that \n\nshow elements as buttons, but in fact, those buttons\
    \ are HTML elements such \n\nas **DIVs**.\n\nLinks and buttons at packtpub.com\n\
    \nMany times, you won't notice the difference between a link and a button. For\
    \ instance, in \n\nthe packtpub.com site, the search button is a button element,\
    \ whereas the cart button \n\nis, in fact, an anchor.\n\nMost of your automation\
    \ code will involve clicking on these action elements.\n\n**Container Elements**\n\
    \nThe role of container elements is grouping elements, mostly for layout and style\
    \ purposes. \n\nThe most popular element is DIV. What is DIV? It can be anything:\
    \ A list of items, \n\na popup, a header, anything. It is used to create groups\
    \ of elements.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_104_0.png)"
  merge: -1
  pgno: 104
- img_proc: true
  md: "90 Interacting with a page \n\nOne element that was the king of the container\
    \ elements was TABLE. As you can infer \n\nfrom the name, a table represents a\
    \ grid. Inside a TABLE element, you can have TR \n\nelements representing rows,\
    \ TH elements representing header cells, and TD elements \n\nrepresenting a column\
    \ inside a row. I mentioned that this *was* the king of containers \n\nbecause\
    \ the community has now moved on from tables to DIVs due to performance \n\nissues,\
    \ the need for more complex layouts, and responsiveness issues. But you might\
    \ still \n\nsee some tables on sites showing information using a grid style.\n\
    \n**HTML5** brought a new kind of container element: The **Semantic Elements**.\
    \ The goal \n\nof these semantic HTML elements is to communicate the type of content\
    \ the element \n\ncontains. So, instead of using DIVs for everything, developers\
    \ should start using \n\nelements such as <header> for the site header, <footer>\
    \ for the footer, <nav> for \n\nthe navigation options, <articles> for blog posts,\
    \ and so on. The purpose of these \n\nelements is to help external tools (such\
    \ as screen readers, search engines, and even the \n\nsame browser) to understand\
    \ the HTML content.\n\n**Input elements**\n\nThe last group of elements we need\
    \ to know about are the input elements. The most \n\ncommon input element is the\
    \ multifaceted input element. Depending on the type \n\nattribute, it can be \"\
    text\", \"password\", \"checkbox\", \"file\" (upload), and so on; \n\nthe list\
    \ goes on to a total of 22 types.\n\nThen we have select elements for drop-down\
    \ lists and the option element to represent \n\nthe items of a drop-down list.\
    \ \n\nOf course, we shouldn't forget the <IMG> element. It's impossible to picture\
    \ a site \n\nwithout images. \n\n**Important note**\n\nNot every input you will\
    \ see these days will be one of these elements. To make \n\ninputs more user-friendly\
    \ or just nicer, you will find that developers might \n\nbuild inputs based on\
    \ many other elements. For instance, you could find a \n\ndrop-down list, which\
    \ instead of being a select element would be an input \n\nelement, plus an arrow\
    \ button, which would show a floating list on clicking it. \n\nThis kind of control\
    \ makes sites prettier but automation more challenging."
  merge: -1
  pgno: 105
- img_proc: true
  md: "Introduction to HTML, the DOM, and CSS 91\n\nHTML has not only a known list\
    \ of elements but also a known list of attributes. These are \n\nthe most common\
    \ attributes you will find:\n\n•  id: Identifies a unique element. It's the element\
    \ ID in the DOM (we will talk about \n\nthe DOM in the next section).\n\n•  class:\
    \ Contains the CSS classes applied to the element. It accepts more than one \n\
    \nCSS class separated by a space.\n\n•  style: CSS style assigned to the element.\n\
    \nHTML won't limit the attributes you can add to an element. You can add any attribute\
    \ you \n\nwant, for instance, defaultColor=\"blue\". One convention is using **data-\
    \ attributes** \n\n(pronounced data dash attributes). The browser will parse these\
    \ attributes and make \n\nthem available in the DOM. So, although defaultColor\
    \ is a valid attribute, the general \n\nconvention uses data-default-color=\"\
    blue\" instead.\n\nThe other set of attributes of interest to us is the **Accessible\
    \ Rich Internet Applications** \n\n(**ARIA**) attributes. These attributes are\
    \ being added to help accessibility tools, such as \n\nscreen readers. Why would\
    \ we be interested in those attributes? Because developers \n\nexpress things\
    \ such as the *role* or the *state* of an element. If you find a site using \n\
    \nARIA, finding the selected menu item would be a matter of finding the element\
    \ with \n\nrole=\"treeitem\" and aria-expanded=\"true\".\n\nIn the past few paragraphs,\
    \ the DOM has been mentioned a few times. Let's talk about \n\nthe DOM.\n\n**The\
    \ DOM**\n\nThe DOM is the interface you can use in JavaScript to interact with\
    \ the HTML. According \n\nto the MDN (https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \ndom), it is *the data representation of the objects that comprise the structure\
    \ and content of *\n\n*a document on the web*. Why should we care about that?\
    \ Because we are going to use the \n\nsame tools to automate our pages.\n\nIn\
    \ the previous section, we mentioned that an element might have an ID. You'll\
    \ \n\nfind that the search input at https://www.packtpub.com/ has the ID \n\n\
    search, so you will be able to get that element in JavaScript using document.\n\
    \ngetElementById('search').\n\nYou might be wondering: How do I know the ID of\
    \ a button? Or how do I check that the \n\nID is valid? Remember we talked about\
    \ the dev tools?"
  merge: -1
  pgno: 106
- img_proc: true
  md: "92 Interacting with a page \n\nThe developer tools can be opened by clicking\
    \ on the three dots in the top-right \n\ncorner of Chrome and then going to **More\
    \ Tools** | **Developer Tools**. You can also \n\nuse the *Ctrl* + *Shift* + *J*\
    \ shortcut in Windows or *Cmd* + *Option* + *I* in macOS:\n\nDeveloper Tools\n\
    \nIf you right-click on any element on the page, for instance, the search button,\
    \ you will find \n\nthe **Inspect** option, which will select that element in\
    \ the **Elements** tab. There you will be \n\nable to see all the attributes of\
    \ that element:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_107_0.png)"
  merge: -1
  pgno: 107
- img_proc: true
  md: "Introduction to HTML, the DOM, and CSS 93\n\nInspect option\n\nAnother tab\
    \ you will use a lot is the **Console** tab, where you will be able to run JavaScript\
    \ \n\ncode. If you are in the **Elements** tab and press the *Esc* key, you will\
    \ get the **Console** tab \n\nbelow the **Elements** one. From there, you will\
    \ be able to test your code:\n\nConsole tab\n\nAnother set of functions that you\
    \ will use a lot are document.querySelector and \n\ndocument.querySelectorAll.\
    \ The first function returns the first element matching \n\na CSS selector, whereas\
    \ the second function returns a list of elements matching a CSS \n\nselector.\
    \ So, we need to learn about some CSS selectors next.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_108_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_108_1.png)"
  merge: -1
  pgno: 108
- img_proc: true
  md: "94 Interacting with a page \n\n**CSS Selectors**\n\nYou don't need to learn\
    \ CSS to understand how to style a page, but you should master \n\nhow to find\
    \ elements on a page. There are around 60 different selectors (https://www.\n\n\
    w3schools.com/cssref/css\\_selectors.asp) we can use for finding elements. \n\n\
    We won't cover all 60 here, but let's go through the most common selectors:\n\n\
    • Select by element name:\n\nSelector: ElementName.\n\nExample: input will select\
    \ <input> elements.\n\n• Select by class name:\n\nSelector: .ClassName.\n\nExample:\
    \ .input-text will select any element that contains the input-text \n\nclass.\
    \ \n\nIf you look at the search input in https://www.packtpub.com/, the class\
    \ \n\nattribute is class=\"input-text algolia-search-input aa-input\". \n\nThis\
    \ selector won't check whether the class attribute is equal to input-text. It\
    \ has \n\nto contain it.\n\n• Select by ID:\n\nSelector: #SomeID.\n\nExample:\
    \ #search will select the element with the search ID. In this case, it does \n\
    \ncheck equality.\n\n• Select by attribute:\n\nSelector: \\[attribute=value\\\
    ].\n\nExample: \\[aria-labelledby= \"search\"\\] will select the element with\
    \ the \n\naria-labelledby attribute with the value search. This is an excellent\
    \ example \n\nof the use of ARIA attributes for automation.\n\nThis selector is\
    \ not limited by only the equality check (\\=). You could use only \n\n\\[attribute\\\
    ] to check whether the element contains the attribute, no matter the value. \n\
    \nYou can also use many other operators. For example, you can use \\*= to check\
    \ whether the \n\nattribute contains a value or |= to check whether it begins\
    \ with a value."
  merge: -1
  pgno: 109
- img_proc: true
  md: "Finding elements 95\n\n**Combining selectors**\n\nWhat's great about CSS is\
    \ that you can combine all these selectors. You could use input.\n\ninput-search\\\
    [aria-labelledby=\" search\"\\] to select an input with the \n\ninput-search class\
    \ and the aria-labelledby attribute with the value search.\n\nYou can also look\
    \ for child elements. CSS allows us to \"cascade\" (that's what the *C* in *CSS*\
    \ \n\nstands for) selectors. You can search for child elements by adding new selectors\
    \ separated \n\nby a space. Let's take, for instance, the following selector:\n\
    \nform .algolia-autocomplete input\n\nIf you read it backwards, it will select\
    \ an input inside an element with the algolia-\n\nautocomplete class, which is\
    \ inside a form element. Notice that I said an input *inside* \n\nan element with\
    \ the algolia-autocomplete class. That doesn't need to be the direct \n\nparent\
    \ of the input element. \n\nIf you want to check strictly a parent-child relationship,\
    \ you can separate selectors with \n\na \\> instead of a space:\n\n.algolia-autocomplete\
    \ > input\n\nThis selector will look for an input whose direct parent element\
    \ is an element with the \n\nalgolia-autocomplete class.\n\nMaybe you are thinking,\
    \ why do I need to know all this information? I just want to get \n\nup and running\
    \ with Puppeteer! Let me tell you something: You will spend half of your \n\n\
    time inside the developer tools, and the most frequent element in your code will\
    \ be a CSS \n\nselector. The more you know about HTML, the DOM, and CSS, the more\
    \ proficient you \n\nwill be at browser automation.\n\nBut now it's time to go\
    \ back to the Puppeteer world.\n\n**Finding elements**\n\nIt's time to apply everything\
    \ we have learned so far. We need to master selectors because \n\nour Puppeteer\
    \ code will be mostly about finding elements and interacting with them."
  merge: -1
  pgno: 110
- img_proc: true
  md: "96 Interacting with a page \n\nLet's bring back the login page from our e-commerce\
    \ app:\n\nLogin page\n\nIf we want to test the login page, we need to find these\
    \ three elements: The **email input**, \n\nthe **password input**, and the **login\
    \ button**.\n\nIf we right-click on each input and click on the **Inspect element**\
    \ menu item, we will find \n\nthe following:\n\n• The email has the ID email.\n\
    \n• The password has the ID password.\n\n• The login is a button element, with\
    \ the btn and btn-success CSS classes, \n\nand the style=\" width: 100%;\" style.\n\
    \nPuppeteer provides two functions to get elements from the page. The $(selector)\
    \ \n\nfunction will run the document.querySelector function and return the first\
    \ element \n\nmatching that selector or null if no elements were found. The $$(selector)\
    \ function \n\nwill run the document.querySelectorAll function, returning an array\
    \ of elements \n\nmatching the selector or an empty array if no elements were\
    \ found.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_111_0.png)"
  merge: -1
  pgno: 111
- img_proc: true
  md: "Finding elements 97\n\nIf we want to implement the login function in our LoginPageModel\
    \ class using these \n\nnew functions, finding the login inputs would be easy:\n\
    \nconst emailInput = await this.page.$('#email');\n\nconst passwordInput = await\
    \ this.page.$('#password');\n\n**Tip**\n\nTo find the login button, you might\
    \ think that you could use the btn-\n\nsuccess selector, and you could, but you\
    \ shouldn't use classes used to style \n\na button because they might change in\
    \ the future if the development team \n\nchanges the style. You should try to\
    \ pick a CSS selector to overcome a design \n\nchange.\n\nLet's re-evaluate our\
    \ login button. If you look for button elements, you will find that you \n\nhave\
    \ five buttons on that page, so the button selector won't work. But, we can see\
    \ that \n\nthe login button is the only button with a type=\"submit\" attribute,\
    \ so we could use the \n\n\\[type=submit\\] CSS selector to find this element.\n\
    \nBut the \\[type=submit\\] selector is too generic. The developers might, for\
    \ instance, add \n\na new button with the submit type in the toolbar, breaking\
    \ our code. But we can see that \n\nthe login button is inside a form with the\
    \ ID login-form. So now, we can create a more \n\nstable selector. So, we could\
    \ look for the login button in our login function in this way:\n\nconst loginBtn\
    \ = await this.page.$('#login-form \n\n\\[type=submit\\]');"
  merge: -1
  pgno: 112
- img_proc: true
  md: "98 Interacting with a page \n\nNow we have everything we need to test our login\
    \ page. But we are not going to interact \n\nwith the login page yet. Let's go\
    \ to the home page and find some more complex scenarios:\n\nHome Page\n\nLet's\
    \ say we want to test that the **Macbook Pro 13.3' Retina MF841LL/A** product\
    \ has 15 \n\nitems left in stock, and the price is $1,199.\n\nFirst, a piece of\
    \ advice: It's better to code these kinds of tests down the testing pyramid. \n\
    \nYou could test the API that sends those values or the function that makes that\
    \ query to \n\nthe database.\n\nBut let's try to solve this as a UI test:\n\n\
    Product HTML\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_113_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_113_1.png)"
  merge: -1
  pgno: 113
- img_proc: true
  md: "Finding elements 99\n\nIf we take a look at the HTML, there is nothing that\
    \ helps us find the product on the \n\nlist, and if we were able to find the product,\
    \ it's hard to find the elements inside that \n\ndiv element.\n\nHere is where\
    \ the collaboration between the development team and the QA team becomes \n\n\
    valuable. How can developers help the QA team? Using data- attributes. Your team\
    \ can \n\nuse a data-test- attribute to help you find the elements you need:\n\
    \nHTML with data-test attributes\n\nAs you can see in this HTML, it will be way\
    \ easier to find elements with those new \n\nattributes. This is how we can get\
    \ the values to test product ID 2:\n\nconst productId = config.productToTestId;\n\
    \nconst productDiv = await this.page.$(\\`\\[data-test-product-\n\nid=\"${productId}\"\
    \\]\\`);\n\nconst stockElement = await productDiv.$('\\[data-test-stock\\]');\n\
    \nconst priceElement = await productDiv.$('\\[data-test-price\\]');\n\nWith these\
    \ four lines, we were able to find the three elements for our new test: The \n\
    \nproduct container and the elements containing the stock and the price.\n\nThe\
    \ are a few things to notice in this piece of code:\n\n• First, remember not to\
    \ hardcode values in your code. That's why we are going \n\nto grab the product\
    \ ID from our config file.\n\n• Second, notice that we are getting stockElement\
    \ and priceElement using \n\nproductDiv.$ instead of page.$. That means that *the\
    \ CSS selector you pass *\n\n*to that function will be processed in the element's\
    \ context*.\n\nIf we'd used page.$$('\\[data-test-stock\\]'), we would get many\
    \ \n\nelements because each product has a data-test-stock element, but as we \n\
    \nuse productDiv.$('\\[data-test-stock\\]'), we'll get the element inside \n\n\
    productDiv. This is an important resource.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_114_0.png)"
  merge: -1
  pgno: 114
- img_proc: true
  md: "100 Interacting with a page \n\n• The last thing to highlight here is that\
    \ our development team gave us the number \n\nof items in stock inside the data-test-stock\
    \ element. This will come in handy \n\nwhen we need to test the stock but notice\
    \ that we don't need to use the value of the \n\nattribute, in this case, 15,\
    \ to get the element. Passing the attribute as a selector will \n\nbe enough.\
    \ \n\nWhat if we don't have the chance to add these attributes? There is one more\
    \ \n\nresource – trying to find those elements using XPath.\n\n**Finding elements\
    \ using XPath**\n\nXPath is a language to query XML-like documents. Remember how\
    \ we said that HTML \n\nwas a relaxed kind of XML? This means that we could navigate\
    \ through the DOM using \n\nsome kind of XML query language such as XPath.\n\n\
    Before digging into XPath's selectors, if you want to try XPath queries, Chrome\
    \ DevTools \n\nincludes a set of functions you can use inside the developer tools\
    \ **Console** tab (https://\n\nhardkoded.com/ui-testing-with-puppeteer/console).\
    \ One of these \n\nfunctions is $x, which expects an XPath expression and returns\
    \ an array of elements:\n\nTesting XPath inside the Chrome Developer Tools\n\n\
    If you open the **Console** tab on any page, you can run $x('//\\*') to test the\
    \ //\\* \n\nselector.\n\nTo better understand an XPath expression, you need to\
    \ see your HTML as XML content. \n\nWe are going to navigate this XML document\
    \ from the very same root, the HTML \n\nattribute.\n\n**Select from the current\
    \ node**\n\nSelector: //. This means \"From the current node, bring me everything\
    \ inside, no matter \n\nthe position.\"\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_115_0.png)"
  merge: -1
  pgno: 115
- img_proc: true
  md: "Finding elements using XPath 101\n\nExample: $x('//div//a') will return, from\
    \ the root, all the *divs* inside the document, \n\nno matter the position, and\
    \ from those *divs* all a elements inside that div, no matter the \n\nposition.\n\
    \nAre you confused about the \"no matter the position\" part? Well, let's now\
    \ see the root \n\nselector.\n\n**Select from the root**\n\nSelector: /. This\
    \ means \"From the current node, bring me all the direct child elements.\"\n\n\
    Example: If we use $x('/div//a'), we'll get no results because there is no div\
    \ as a \n\nchild of the root object. The only valid root option would be $x('/HTML')\
    \ because the \n\nHTML element is the only one under the main root object. But\
    \ we could do something \n\nsuch as $x('//div/a'), which would mean \"Bring me\
    \ all the div elements, and from \n\nthere all the a elements that are a direct\
    \ child of those *divs*.\"\n\n**Select all the elements**\n\nSelector: \\*. This\
    \ means \"Bring me all the elements.\"\n\nExample: When we say \"all the elements,\"\
    \ it will be based on the previous selector. \n\n$x('/\\*') will bring only the\
    \ HTML element because that would mean \"all the direct \n\nelements.\" But $x('//\\\
    *') will bring you all the elements from the page.\n\n**Filter by attribute**\n\
    \nSelector: \\[@attributeName=value\\].\n\nExample: $x('//div\\[@class=\"card-body\"\
    \\]') will bring all the div elements \n\nwhere the class attribute is equal to\
    \ card-body. This might look similar to the \n\nclass selector in CSS, but it's\
    \ not because this selector won't work if div has more than \n\none class.\n\n\
    Up to this point, it seems just like CSS with another syntax. What's so powerful\
    \ about \n\nXPath? Well, let's get to some power tools.\n\nIt turns out that the\
    \ syntax we used to filter attributes is, in fact, expressions, also called \n\
    \npredicates. This gives us the chance to not only use the @attributeName option\
    \ but to \n\nalso check for many other things."
  merge: -1
  pgno: 116
- img_proc: true
  md: "102 Interacting with a page \n\n**Filter by text**\n\nSelector: \\[text()=value\\\
    ].\n\nExample: $x('//div\\[text()=\"Admin Panel (Testing purpose)\"\\]') \n\n\
    will bring all the div elements where its content is a the text *Admin Panel (Testing\
    \ *\n\n*purpose)*. You could even make it more generic and use something like\
    \ this, \n\n$x('//\\*\\[text()=\"Admin Panel (Testing purpose)\"\\]'), so you\
    \ wouldn't \n\ncare whether it's a div or another type of element.\n\nThis function\
    \ is by far one of the main reasons you would see people using XPath.\n\n**Contains\
    \ a text**\n\nSelector: \\[contains(text(), value)\\].\n\nExample: *Filter by\
    \ text* can be tricky. The text could have some space before or after \n\nthe\
    \ content. If you try to select the grid button on the page using this command,\
    \ \n\n$x('//\\*\\[text()= \"Grid\"\\]'), you won't get any results because the\
    \ element has \n\nsome spaces after and before the word. This contains function\
    \ can help us when we \n\nhave spaces before or after the word, or when the word\
    \ is part of a larger piece of text. This \n\nis how we can use this function:\
    \ $x('//\\*\\[contains(text(),\"Grid\")\\]').\n\nThere are many more functions.\
    \ Mozilla has a good list of all the available functions \n\n(https://www.hardkoded.com/ui-testing-with-puppeteer/xpath).\n\
    \nWe get to do really complex queries with XPath. Let's take a look our last example.\
    \ We \n\nwant all the elements with a price over $2,000:\n\n$x('//div\\[@class=\"\
    row\"\\]/p\\[1\\]\\[number(substring-after(text(), \n\n\"$\")) > 2000\\]')\n\n\
    Wow, let's see what we are doing there:\n\n• With //div\\[@class=\"row\"\\], we\
    \ grab DIVs with the row class.\n\n• With p\\[1\\], we take the first p element.\
    \ We can use positional filters here.\n\n• We get the text using text().\n\n•\
    \ As the price begins with a dollar sign, we remove it using substring-after.\n\
    \n• We convert that text into a number using number.\n\n• So then, we can check\
    \ whether that number is greater than 2,000.\n\nThere is one more feature that\
    \ makes XPath a powerful tool. Unlike CSS selectors, you can \n\nselect the parent\
    \ element with XPath using ..."
  merge: -1
  pgno: 117
- img_proc: true
  md: "Finding elements using XPath 103\n\nIf we want to return the entire main div\
    \ of the product with a price over $2,000, we can \n\nuse the following:\n\n$x('//div\\\
    [@class=\"row\"\\]/p\\[1\\]\\[number(substring-after(text(), \n\n\"$\")) > 2000\\\
    ]/../..')\n\nHow do we use XPath expressions in Puppeteer? You already know how\
    \ to do it: We have \n\na $x function.\n\nLet's go back to our test: *We want\
    \ to test that the Macbook Pro 13.3' Retina MF841LL/A has *\n\n*15 items left\
    \ in stock, and the price is $1,199.*\n\nWhat if the only way to find that product\
    \ would be with the product name? We could do \n\nsomething like this:\n\nconst\
    \ productName = config.productToTestName;\n\nconst productDiv = (await this.page.$x(\\\
    `//a\\[text()=\"${productNa\n\nme}\"\\]/../..\\`))\\[0\\];\n\nconst stockElement\
    \ = (await productDiv.$('//h6'))\\[0\\];\n\nconst priceElement = (await productDiv.$('\
    \ //div\\[@\n\nclass=\"row\"\\]/p\\[1\\]'))\\[0\\];\n\nRemember that $x returns\
    \ an array of elements. In this case, as we know that they will \n\nalways return\
    \ one element, we take the first one.\n\nIn the same way, we shouldn't rely on\
    \ design classes for CSS selectors. We should try not \n\nto rely too much on\
    \ the HTML structure in XPath selectors. We are assuming a couple of \n\nthings\
    \ in this code:\n\n• We assume that the stock is an h6 element.\n\n• We assume\
    \ that the price will be the first p element.\n\nIf the design team decides that\
    \ the stock will look better using div instead of h6, \n\nif they wrapped the\
    \ price inside a div element to improve mobile navigation, your test \n\nwill\
    \ break.\n\nWe learned how to get elements from the page, but it's important to\
    \ know that the $, $$, \n\nand $x functions don't return an element from the DOM.\
    \ They return something called \n\n**element handles**.\n\nElement handles are\
    \ a reference to a DOM element on the page. They are a pointer that \n\nhelps\
    \ Puppeteer send commands to the browser, referencing an existing DOM element.\
    \ \n\nThey are also one of the ways we have to interact with those elements."
  merge: -1
  pgno: 118
- img_proc: true
  md: "104 Interacting with a page \n\n**Interacting with Elements**\n\nLet's go back\
    \ to our login test. We already have the three elements we need: The user \n\n\
    input, the password input, and the login button. Now we need to enter the email\
    \ and the \n\npassword and click on the button.\n\n**Typing on input elements**\n\
    \nThe ElementHandle class has a function called type. The signature is type(text,\
    \ \n\n\\[options\\]). The options class is not big this time. It only has a delay\
    \ property. The \n\ndelay is the number of milliseconds Puppeteer will wait between\
    \ letters. This is great to \n\nemulate real user interaction.\n\nThe first part\
    \ of our test would look like this:\n\nconst emailInput = await this.page.$('#email');\n\
    \nawait emailInput.type(user, {delay: 100});\n\nconst passwordInput = await this.page.$('#password');\n\
    \nawait passwordInput.type(password, {delay: 100});\n\nHere, we are looking for\
    \ the email and password elements, and then emulating a user \n\ntyping on those\
    \ inputs. \n\nNow, we need to click on the button.\n\n**Clicking on elements**\n\
    \nThe ElementHandle class also has a function called click. I bet you are already\
    \ \n\ngetting the pattern. The signature is click(\\[options\\]). You can simply\
    \ call \n\nclick(), and that would do the job. But we can also use the three available\
    \ options:\n\n•  button: This is a string with three valid options: \"left,\"\
    \ \"right,\" or \"middle.\"\n\n•  clickCount: The default is 1, but you could\
    \ also have an impatient user clicking \n\nthe same button many times, so you\
    \ can emulate the user clicking on the element \n\nfour times by passing 4.\n\n\
    •  delay: This delay is not the time between clicks but the time (in milliseconds)\
    \ \n\nbetween the mouse down action and mouse up."
  merge: -1
  pgno: 119
- img_proc: true
  md: "Interacting with Elements 105\n\nIn our case, we don't need to use these options:\n\
    \nconst loginBtn = await this.page.$('#login-form \n\n\\[type=submit\\]');\n\n\
    await loginBtn.click();\n\nWith these two lines, we can finally finish our login\
    \ function. We find the login button \n\nand then we click on it.\n\n**Selecting\
    \ options in drop-down lists**\n\nThe site now has a drop-down list, a SELECT\
    \ element in HTML, to switch between the \n\ngrid and the list view:\n\nThe site\
    \ with a new switch option\n\nAs you might have guessed, the function to select\
    \ an option is called select, and the \n\nsignature is select(…values). It's a\
    \ list of values if the select element has the \n\nmultiple attribute.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_120_0.png)"
  merge: -1
  pgno: 120
- img_proc: true
  md: "106 Interacting with a page \n\nThe next thing we need to know about this function\
    \ is that the value select expects \n\nis not the text you see in the option,\
    \ but the option of the value. We can see that by \n\ninspecting the element:\n\
    \nDrop-down list options\n\nIn this case, we are lucky as the value is almost\
    \ the same as the visible text, but it's not the \n\nsame. If we want to select\
    \ the Grid item, we need to use grid, instead of Grid.\n\nIf we switch the option\
    \ to list mode, we can see that a list-group-item class is \n\nadded to the elements:\n\
    \nHTML in list mode\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_121_0.png)![](img/a12c4f728acd6f69fe58d97e7f64e4f5_121_1.png)"
  merge: -1
  pgno: 121
- img_proc: true
  md: "Interacting with Elements 107\n\nThis is how we can test this functionality:\n\
    \nvar switchSelect = await page.$('#viewMode');\n\nawait switchSelect.select('list');\n\
    \nexpect(await page.$$('.list-group-item')).not.to.be.empty;\n\nawait switchSelect.select('grid');\n\
    \nexpect(await page.$$('.list-group-item')).to.be.empty;\n\nUsing await and page.$\
    \ every time we need to interact with an element requires a lot \n\nof boilerplate.\
    \ Imagine if we had eight inputs to fill; that would be a lot. That's why both\
    \ \n\nPage and Frame (if you are dealing with child frames) have most of the functions\
    \ an \n\nelement handle has, but they expect a selector as a first argument.\n\
    \nSo, say we have this piece of code:\n\nvar switchSelect = await page.$('#viewMode');\n\
    \nawait switchSelect.select('list');\n\nIt could be as simple as this:\n\nawait\
    \ page.select('#viewMode', 'list');\n\nYou will find functions such as page.click(selector,\
    \ \\[options\\]), page.\n\ntype(selector, text, \\[options\\]), and many other\
    \ interaction functions.\n\nWe have covered the most common user interactions.\
    \ But we can go a little deeper and try \n\nto emulate how the user would interact\
    \ with the page using their keyboard and mouse."
  merge: -1
  pgno: 122
- img_proc: true
  md: "108 Interacting with a page \n\n**Keyboard and Mouse emulation**\n\nAlthough\
    \ you will be able to test the most common scenarios by typing or clicking on\
    \ \n\nelements, there are other scenarios where you would need to emulate how\
    \ the users \n\ninteract with a site using the keyboard and the mouse. Let's take,\
    \ for instance, a Google \n\nspreadsheet:\n\nGoogle Spreadsheet\n\nThe Google\
    \ spreadsheet page has a lot of keyboard and mouse interactions. You can move\
    \ \n\nthrough the cells using your keyboard arrows or copy values by doing drag\
    \ and drop with \n\nthe mouse.\n\nBut it doesn't need to be that complicated.\
    \ Let's say that you work in the QA team at \n\nGitHub.com, and you need to test\
    \ the search box from the home page.\n\nAs GitHub.com is for developers, and developers\
    \ for some weird reason hate using the \n\nmouse, the development team added many\
    \ shortcuts on the site. We want to create a test \n\nto check that those shortcuts\
    \ are working as expected:\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_123_0.png)"
  merge: -1
  pgno: 123
- img_proc: true
  md: "Keyboard and Mouse emulation 109\n\nGitHub.com home page\n\nAs we can see there,\
    \ the shortcut to the search input is a **/**. So, we need to do the following:\n\
    \n• Press slash.\n\n• Type the repo name.\n\n• And then press *Enter*.\n\nWe are\
    \ going to use the Keyboard class that the Page class exposes as a property.\n\
    \nThe first step is to press slash. To do that, we are going to use, you guessed\
    \ it, the press \n\nfunction. The signature is press(key, options). The first\
    \ thing we need to know \n\nabout press is that it's a shortcut to two other functions\
    \ – down(key, options) and \n\nup(key). As you can see, you can get an almost\
    \ complete keyboard emulation.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_124_0.png)"
  merge: -1
  pgno: 124
- img_proc: true
  md: "110 Interacting with a page \n\nNotice that the first argument is not text\
    \ but key. You will find the full list of supported \n\nkeys here: https://www.hardkoded.com/ui-testing-with-puppeteer/\n\
    \nUSKeyboardLayout. There, you will find keys such as *Enter*, *Backspace*, or\
    \ *Shift*. \n\nThe press function has two options available: First, if you assign\
    \ the text property, \n\nPuppeteer will create an input event with that value.\
    \ It would work like a macro. For \n\ninstance, if the key is p and the text is\
    \ puppeteer, when you would press p, you would \n\nget puppeteer in the input\
    \ element. I've never found a usage for that argument, but it's \n\nthere. The\
    \ down function also has this option. The second option is delay, which is the\
    \ \n\ntime between the key down and the key up actions. \n\nThe official Puppeteer\
    \ documentation (https://www.hardkoded.com/\n\nui-testing-with-puppeteer/keyboard)\
    \ has a perfect example for this:\n\nawait page.keyboard.type('Hello World!');\n\
    \nawait page.keyboard.press('ArrowLeft');\n\nawait page.keyboard.down('Shift');\n\
    \nfor (let i = 0; i < ' World'.length; i++) {\n\n await page.keyboard.press('ArrowLeft');\n\
    \n}\n\nawait page.keyboard.up('Shift');\n\nawait page.keyboard.press('Backspace');\n\
    \nLet's unpack this code:\n\n• It types **Hello World!**. The cursor is after\
    \ the exclamation mark.\n\n• It presses the left arrow key. Remember, press is\
    \ key down and key up. So now \n\nthe cursor is before the exclamation mark.\n\
    \n• Then, using down, it presses the *Shift* key, but it doesn't release the key.\n\
    \n• Then, it presses the left key as many times for the cursor to get to after\
    \ the \"Hello\" \n\nword. But as the *Shift* key is still pressed, the \"World\"\
    \ text got selected.\n\n• Then, it releases the *Shift* key, using up.\n\n• And\
    \ what happens when you press *backspace* and we have text selected? You remove\
    \ \n\nthe entire selection, leaving the text **Hello!**."
  merge: -1
  pgno: 125
- img_proc: true
  md: "Keyboard and Mouse emulation 111\n\nNow we can go and test the GitHub.com home\
    \ page:\n\nconst browser = await puppeteer.launch({headless: false, \n\ndefaultViewport:\
    \ null});\n\nconst page = await browser.newPage();\n\nawait page.goto('https://www.github.com/');\n\
    \nawait page.keyboard.press('Slash');\n\nawait page.keyboard.type('puppeteer')\n\
    \nawait page.keyboard.press('Enter');\n\nIf we go back to our login example, we\
    \ could test that you should be able to log in by \n\npressing *Enter* instead\
    \ of clicking on the login button. Or if the navigation between \n\ncontrols is\
    \ important, you can jump from the user input to the password and then to the\
    \ \n\nlogin button by pressing *Tab*.\n\nDo you want to play tic-tac-toe? Let's\
    \ play it using the mouse. \n\nIn the Chapter4 folder, you will find a tictactoe.html\
    \ file with a small tic-tac-toe \n\ngame made in **React**:\n\nTic-tac-toe game\n\
    \nIf we consider the page as a canvas, where the top-left corner of the window\
    \ is the \n\ncoordinate **(0;0)** and the bottom right is the coordinate **(window\
    \ width, window height)**, \n\nmouse interaction is about moving the mouse to\
    \ an **(X;Y)** coordinate and clicking using \n\none of the mouse buttons. Puppeteer\
    \ offers the following functionalities.\n\nMove the mouse using mouse.move(x,\
    \ y, \\[options\\]). The only option available \n\nin this move function is steps.\
    \ With steps, you can tell Puppeteer how many times \n\nyou want to send mousemove\
    \ events to the page. By default, it will send only one event \n\nat the end of\
    \ the mouse move action.\n\nIn the same way as with the keyboard you have the\
    \ up/down and press functions, with \n\nthe mouse, you have up/down and click.\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_126_0.png)"
  merge: -1
  pgno: 126
- img_proc: true
  md: "112 Interacting with a page \n\nThe mouse has one extra action that the keyboard\
    \ doesn't have, which is wheel. You \n\ncan emulate mouse scrolling using mouse.wheel(\\\
    [options\\]). This option has \n\ntwo properties: deltaX and deltaY, which can\
    \ be positive or negative scroll values \n\nexpressed in CSS pixels.\n\nLet's\
    \ go back to our tic-tac-toe game. We will do a simple test: Player 1 will use\
    \ the first \n\nrow and player 2 will use the second row, so player 1 will win\
    \ after three moves. As this is \n\na canvas, we need to know which coordinates\
    \ we need to click.\n\nWe can use the style section of the developer tools to\
    \ get those coordinates. If we look at \n\nthe body, we will see a 20-pixel margin\
    \ that will make (20;20) the starting point: \n\nBody margin\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_127_0.png)"
  merge: -1
  pgno: 127
- img_proc: true
  md: "Keyboard and Mouse emulation 113\n\nWe also know that each square is 32 px by\
    \ 32 px, so the middle of the square should be \n\n*delta + (32 / 2)*. Let's test\
    \ it:\n\nconst startingX = 20;\n\nconst startingY = 20;\n\nconst boxMiddle = 16;\n\
    \n// X turn 1;\n\nawait page.mouse.click(startingX + boxMiddle, startingY + \n\
    \nboxMiddle);\n\n// Y turn 1;\n\nawait page.mouse.click(startingX + boxMiddle,\
    \ startingY + \n\nboxMiddle \\* 3);\n\n// X turn 2;\n\nawait page.mouse.click(startingX\
    \ + boxMiddle \\* 3, startingY + \n\nboxMiddle);\n\n// Y turn 2;\n\nawait page.mouse.click(startingX\
    \ + boxMiddle \\* 3, startingY + \n\nboxMiddle \\* 3);\n\n// X turn 3;\n\nawait\
    \ page.mouse.click(startingX + boxMiddle \\* 5, startingY + \n\nboxMiddle);\n\n\
    expect(await page.$eval('#status', status => status.\n\ninnerHTML)).to.be('Winner:\
    \ X');\n\nSo, here we know that the *tic-tac-toe* grid starts at the coordinate\
    \ (20,20), and from there \n\nis simple math to find the right coordinates in\
    \ our canvas. The first box will be clicked \n\nat the coordinate (startingX +\
    \ boxMiddle; startingY + boxMiddle). If \n\nwe want to click on the second row,\
    \ it would be three middle squares, startingX + \n\nboxMiddle \\* 3, and so on\
    \ until we know that we have a winner.\n\nDon't worry about the last $eval. We'll\
    \ get there."
  merge: -1
  pgno: 128
- img_proc: true
  md: "114 Interacting with a page \n\nBut this is not just for games. Many modern\
    \ UIs might require some mouse interactions, \n\nfor instance, hoverable dropdowns\
    \ or menus. We can see one example on the *W3Schools* \n\nsite (https://www.w3schools.com/howto/howto\\\
    _css\\_dropdown.asp):\n\nHoverable dropdown\n\nTo be able to click on any item\
    \ in that dropdown, we need to hover first on the button and \n\nthen link on\
    \ the option:\n\nawait page.goto(\"https://www.w3schools.com/howto/howto\\_css\\\
    _\n\ndropdown.asp\");\n\nconst btn = await page.$(\".dropbtn\");\n\nconst box\
    \ = await btn.boundingBox();\n\nawait page.mouse.move(box.x + (box.width / 2),\
    \ box.y + (box.\n\nheight / 2));\n\nconst option = (await page.$x('//\\*\\[text()=\"\
    Link 2\"\\]'))\\[0\\];\n\nawait option.click();\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_129_0.png)"
  merge: -1
  pgno: 129
- img_proc: true
  md: "Debugging tests with Visual Studio Code 115\n\nAs you can see, we don't need\
    \ to guess the **Hover me** button's location. The element \n\nhandle provides\
    \ a function called boundingBox, which returns the position (*x* and *y*) \n\n\
    and the element's size (width and height).\n\nIs there an easier way? Yes, we\
    \ can simply use await btn.hover(), which would \n\nhover on the element. I wanted\
    \ to give you a complete example because sometimes UI \n\ncomponents are quite\
    \ sensitive to the mouse position, so you need to put the mouse in \n\na precise\
    \ location to get the desired result.\n\nTime for a bonus track. Let's talk about\
    \ debugging.\n\n**Debugging tests with Visual Studio Code**\n\nMany developers\
    \ consider debugging a last resort. Others would flood their code with \n\nconsole.log\
    \ messages. I consider debugging a productivity tool.\n\n*Debugging is trying\
    \ to find bugs by running an application step by step.*\n\nWe have two ways of\
    \ launching our tests in debug mode. The first option is creating \n\na **JavaScript\
    \ debug terminal** from the **Terminal** tab. That will create a new terminal\
    \ \n\nas we did before, but in this case, Visual Studio will enable the debugger\
    \ when you run \n\na command from that terminal:\n\nDebugging from the terminal\n\
    \n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_130_0.png)"
  merge: -1
  pgno: 130
- img_proc: true
  md: "116 Interacting with a page \n\nThe second option is going to the **Run** tab\
    \ and creating a launch.json file. You could \n\nalso create that file manually\
    \ inside the .vscode folder:\n\nCreate a launch.json from the run tab\n\nOnce\
    \ we have the file, we can create a new configuration so that we can run npm run\
    \ \n\ntest in the terminal:\n\n{\n\n \"version\": \"0.2.0\",\n\n \"configurations\"\
    : \\[\n\n {\n\n \"name\": \"Test\",\n\n \"request\": \"launch\",\n\n \"runtimeArgs\"\
    : \\[\n\n \"run\",\n\n \"test\"\n\n \\],\n\n \"runtimeExecutable\": \"npm\",\n\
    \n \"skipFiles\": \\[\n\n \"<node\\_internals>/\\*\\*\"\n\n \\],\n\n \"type\"\
    : \"pwa-node\"\n\n },\n\n \\]\n\n}\n\nWhich one is the best? Well, if you will\
    \ work on this project for many days, creating the \n\nlaunch.json file is more\
    \ productive; once created, you just need to hit *F5*, and you \n\nwould be in\
    \ debug mode. The terminal option is easier just to get running.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_131_0.png)"
  merge: -1
  pgno: 131
- img_proc: true
  md: "Debugging tests with Visual Studio Code 117\n\nOnce you have everything set\
    \ up, it is about creating **breakpoints** in the line you want the \n\ndebugger\
    \ to stop, and from there it is about taking advantage of all the tools Visual\
    \ Studio \n\nCode offers:\n\nVisual Studio Code in debugging mode\n\nThere you\
    \ will find the following:\n\n• At the left of the line numbers, you will find\
    \ the breakpoints. You can create or \n\nremove breakpoints by clicking at the\
    \ left of the line number.\n\n• You will find the full list of breakpoints at\
    \ the bottom left of the window. From \n\nthere, you will be able to disable breakpoints\
    \ temporarily.\n\n• At the top right of the window, you will find debug actions:\
    \ Pause, play, step in/out, \n\nand stop buttons.\n\n• In the left panel, you\
    \ will find two useful sections: Variables, where you can \n\nautomatically get\
    \ the values of all the variables in the current scope. The next panel \n\nis\
    \ Watch, and you can add there the variables or expressions you want to look at\
    \ \n\nwhile running your code.\n\n![](img/a12c4f728acd6f69fe58d97e7f64e4f5_132_0.png)"
  merge: -1
