    \ | string;\n};\n```\n\n然而，使用 `readonly [K in keyof ICar]: ICar[K];` 语法时，我们只能向现有类型添加新元素。我们可以添加\
    \ `readonly` 标记或 `?` 符号。如果原始类型有一个可选属性，例如：\n\n```typescript\ninterface ICar {\n\
    \  name: string;\n  age: number;\n  color?: string;\n}\n```\n\n我们不仅可以使用 `?` 符号来移除标记。从\
    \ TS 2.8 开始，可以在我们想要移除的字符之前添加一个负号 `-`。\n\n## 57 TS 核心概念\n\n```typescript\ntype\
