    \ directly using the `arguments` variable, which is available inside any function.\n\
    \nIn TS, you can assemble arguments into a single variable:\n\n```typescript\n\
    function buildName(firstName: string, ...restOfName: string[]) {\n  return firstName\
    \ + \" \" + restOfName.join(\" \");\n}\n```\n\nlet employeeName = buildName(\"\
    Jonas\", \"Pitt\", \"Lucas\", \"Samuel\");\n\nRest parameters can be understood\
    \ as an unlimited number of optional parameters. When passing arguments for residual\
    \ parameters, you can pass as many of them as you want; or you can pass nothing\
    \ at all. The compiler will build an array from the passed arguments, assign it\
    \ a name that is specified after the ellipsis (…), and make it available inside\
    \ the function.\n\nThe ellipsis is also used when describing the type of function\
    \ with residual parameters:\n\n```typescript\nfunction buildName(firstName: string,\
    \ ...restOfName: string[]) {\n  return firstName + \" \" + restOfName.join(\"\
    \ \");\n}\n```\n\nlet buildNameFun: (fname: string, ...rest: string[]) => string\
    \ = buildName;\n\n### this Keyword\n\nLearning how to use `this` keyword correctly\
    \ in JavaScript is something of a rite of passage for developers. Since TS is\
    \ a superset of JavaScript, programmers also need to understand how to use `this`\
    \ and how to notice when this is used incorrectly. Fortunately, TS allows you\
    \ to detect incorrect use of `this` with a few tricks.\n\nAs a rule, an object\
    \ method needs access to the information stored in the object in order to perform\
    \ any actions with it (in accordance with the purpose of the method). For example,\
    \ the code inside `user.SayHi()` may need the name that is stored in the `user`\
    \ object. To access information inside an object, a method can use the `this`\
    \ keyword. The value of `this` is the object before the dot that was used to call\
    \ the method.\n\n```javascript\nlet user = {\n  name: \"John\",\n  age: 30,\n\
    \  SayHi() {\n    // this is the current object\n    alert(this.name);\n  }\n\
    };\nuser.SayHi(); // Here, during the execution of user.SayHi(), the value of\
    \ this will be user (a reference to the user object).\n```\n\nTechnically, it\
    \ is also possible to access an object without the `this` keyword by referring\
    \ to it through an external variable (which stores reference to this object):\n\
    \n```javascript\nlet user = {\n  name: \"John\",\n  age: 30,\n  SayHi() {\n  \
    \  // use the \"user\" variable instead of the \"this\" keyword\n    alert(user.name);\n\
    \  }\n};\n```\n\nBut such code will be unreliable. If we decide to copy the reference\
    \ to the user object to another variable, for example `admin = user`, and overwrite\
    \ the user variable with something else, then the wrong object will be accessed\
    \ when calling the method. This is shown below:\n\n```javascript\nlet user = {\n\
    \  name: \"John\",\n  age: 30,\n  SayHi() {\n    alert(user.name);\n  }\n};\n\
    let admin = user;\nuser = null; // reset the variable for clarity, now it does\
    \ not store a reference to the object.\nadmin.SayHi(); // Error! Inside SayHi(),\
    \ the user is used, which no longer references the object!\n```\n\nIf we use `this.name`\
    \ instead of `user.name` inside the alert, then this code will work.\n\n### Keyword\
    \ “this” and Arrow Functions\n\nThe keyword `this` is a variable that is set when\
    \ the function is called. This is a very powerful and flexible feature of the\
    \ language, but in return for its advantages, you always have to remember the\
    \ context in which the function is executed. It’s easy to get confused here, especially\
    \ when a function is returned as a result or passed as an argument.\n\nLet’s look\
    \ at an example:\n\n```javascript\nlet deck = {\n  suits: [\"hearts\", \"spades\"\
    , \"clubs\", \"diamonds\"],\n  cards: Array(52),\n  createCardPicker: function()\
    \ {\n    return function() {\n      let pickedCard = Math.floor(Math.random()\
    \ * 52);\n      let pickedSuit = Math.floor(pickedCard / 13);\n      return {\n\
    \        suit: this.suits[pickedSuit],\n        card: pickedCard % 13\n      };\n\
    \    }\n  }\n};\n\nlet cardPicker = deck.createCardPicker();\nlet pickedCard =\
    \ cardPicker();\nalert(\"card: \" + pickedCard.card + \" of \" + pickedCard.suit);\n\
    ```\n\nNote that `createCardPicker` is a function that returns a function. If\
    \ we try to run this example, we will get an error instead of the expected message.\
    \ This is because `this`, which is used in the function created by `createCardPicker`,\
    \ points to the window and not to the deck object. All this is due to the fact\
    \ that `cardPicker()` is called by itself. When using a similar syntax, when a\
    \ function is called as a non-method, and at the very top level of the program,\
    \ `this` will point to window. (Note: in strict mode, in such cases, `this` will\
    \ have the value `undefined`, not window.)\n\nYou can fix this by making sure\
    \ that the function is bound to the correct value of `this` before returning it.\
    \ In this case, regardless of how it will be used in the future, it will still\
    \ have access to the original deck object. To do this, you need to change the\
    \ function, and use the syntax of the arrow function from the ECMAScript 6 standard.\
    \ Arrow functions capture the value of `this` as it was at the time of its creation\
    \ (and not at the time of the call):\n\n```typescript\nlet deck = {\n  suits:\
    \ [\"hearts\", \"spades\", \"clubs\", \"diamonds\"],\n  cards: Array(52),\n  createCardPicker:\
    \ function() {\n    // ATTENTION: the line below is an arrow function that captures\
    \ the value of ‘this’ from place\n    return () => {\n      let pickedCard = Math.floor(Math.random()\
    \ * 52);\n      let pickedSuit = Math.floor(pickedCard / 13);\n      return {\n\
    \        suit: this.suits[pickedSuit],\n        card: pickedCard % 13\n      };\n\
    \    }\n  }\n};\n\nlet cardPicker = deck.createCardPicker();\nlet pickedCard =\
    \ cardPicker();\nalert(\"card: \" + pickedCard.card + \" of \" + pickedCard.suit);\n\
    ```\n\nEven better, if you pass the `--noImplicitThis` flag to the compiler, TS\
    \ will issue a warning if you make a similar error. It will indicate that `this`\
    \ in the expression `this.suits[pickedSuit]` is of type any.\n\n### this Parameters\n\
    \nUnfortunately, the type of the expression `this.suits[pickedSuit]` is still\
    \ any, since this is taken from a function expression inside an object literal.\
    \ To fix this, you can explicitly specify `this` as a parameter. The `this` parameter\
    \ is a “fake” parameter that comes first in the list of function parameters:\n\
    \n```typescript\nfunction f(this: void) {\n  // Ensure that 'this' cannot be used\
    \ in this function\n}\n```\n\nWe will add several interfaces to the previous example:\
    \ Card and Deck, to make the types more understandable and easy to reuse:\n\n\
    ```typescript\ninterface Card {\n  suit: string;\n  card: number;\n}\n\ninterface\
    \ Deck {\n  suits: string[];\n  cards: number[];\n  createCardPicker(this: Deck):\
    \ () => Card;\n}\n\nlet deck: Deck = {\n  suits: [\"hearts\", \"spades\", \"clubs\"\
    , \"diamonds\"],\n  cards: Array(52),\n  createCardPicker: function() {\n    //\
    \ ATTENTION: Now the function explicitly\n    // indicates that it should be called\
    \ on an object of the\n    // Deck type\n    return () => {\n      let pickedCard\
    \ = Math.floor(Math.random() * 52);\n      let pickedSuit = Math.floor(pickedCard\
    \ / 13);\n      return {\n        suit: this.suits[pickedSuit],\n        card:\
    \ pickedCard % 13\n      };\n    }\n  }\n};\n\nlet cardPicker = deck.createCardPicker();\n\
    let pickedCard = cardPicker();\nalert(\"card: \" + pickedCard.card + \" of \"\
    \ + pickedCard.suit);\n```\n"
