    \ 100};\n  if (config.color) {\n    newSquare.color = config.color;\n  }\n  if\
    \ (config.width) {\n    newSquare.area = config.width * config.width;\n  }\n \
    \ return newSquare;\n}\n\nlet mySquare = createSquare({color: \"black\"});\n```\n\
    \nInterfaces with optional properties are written like normal ones, but each optional\
    \ property is marked with the symbol ? at the end of the name. The advantage of\
    \ optional properties is that you can describe the properties that may be present,\
