    \ might look like, let’s look at the following code:\n\n```typescript\nclass Controller\
    \ {\n  model: Model;\n  view : View;\n\n  constructor() {\n    this.model = new\
    \ Model({Id: 1, DisplayName: 'firstModel'});\n    this.view = new View($('#viewTemplate').html());\n\
    \  }\n\n  render() {\n    $('#domElement').html(this.view.render(this.model));\n\
    \  }\n}\n```\n\nHere we have defined the Controller class, which has the model\
    \ and view properties. Then our constructor function creates an instance of the\
    \ Model class with certain properties and an instance of the View class. An instance\
