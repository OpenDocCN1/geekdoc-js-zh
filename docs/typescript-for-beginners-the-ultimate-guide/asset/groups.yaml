    \ +\n      (point.y - Grid.origin.y) ** 2\n    );\n  }\n}\n\nconsole.log(Grid.calculateDistance({\
    \ x: 10, y: 20 }));\n```\n\n## 61 Key Concepts of TS\n\n### Abstract Classes\n\
    \nAbstract classes are base classes from which others inherit. Their instances\n\
