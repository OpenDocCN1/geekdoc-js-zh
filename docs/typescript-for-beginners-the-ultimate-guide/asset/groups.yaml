    if (config.width) {\n  newSquare.area = config.width * config.width;\n}\n\nreturn\
    \ newSquare;\n}\n\nlet mySquare = createSquare({color: \"black\"});\n```\n\nRead-Only\
    \ Properties\n\nSome properties should only be modifiable when the object is created.\
    \ You can specify this by adding readonly before its name:\n\n```typescript\n\
    interface Point {\n  readonly x: number;\n  readonly y: number;\n}\n```\n\nYou\
    \ can create a Point object by assigning an object literal, but after the assignment,\
    \ you can no longer change x and y.\n\n```typescript\nlet p1: Point = { x: 10,\
    \ y: 20 };\np1.x = 5; // error!\n```\n\nTS has a ReadonlyArray<T> type, which\
    \ is essentially an Array<T> type, from which all methods that modify it are removed,\
    \ so you can be sure that such arrays will not change after creation:\n\n```typescript\n\
    let a: number[] = [1, 2, 3, 4];\nlet ro: ReadonlyArray<number> = a;\nro[0] = 12;\
    \ // error!\nro.push(5); // error!\nro.length = 100; // error!\na = ro; // error!\n\
    ```\n\nIn the last line of the example, you can see that even assigning ReadonlyArray\
    \ to a regular array is not allowed. However, this restriction can still be circumvented\
    \ by using typecasting:\n\n```typescript\na = ro as number[];\n```\n\nThe easiest\
    \ way to remember when to use readonly and when to use const is to ask whether\
    \ this feature is needed for a variable or for an object property. With variables,\
    \ const is used, and with properties, readonly is used.\n\n### Checks for Extra\
    \ Properties\n\nIn our first example of using interfaces, TS allowed us to pass\
    \ `{size: number; label: string;}` where only `{label: string;}` was expected.\
    \ We also learned about optional properties, and how they can be useful when passing\
    \ arguments to functions.\n\nHowever, a mindless combination of these two features\
    \ would allow you to shoot yourself in the foot just like in JS. For example,\
    \ if you take the last example with createSquare:\n\n```typescript\ninterface\
    \ SquareConfig {\n  color?: string;\n  width?: number;\n}\n\nfunction createSquare(config:\
    \ SquareConfig): { color: string; area: number } {\n  // ...\n}\n\nlet mySquare\
    \ = createSquare({ colour: \"red\", width: 100 });\n```\n\nNote that the argument\
    \ passed to createSquare is written as colour instead of color. In pure JS, such\
    \ things do not give errors, but they also do not work as the developer would\
    \ like.\n\nWe can say that this program is correct from the point of view of types,\
    \ since the types of the width properties are compatible, there is no color, and\
    \ the presence of an additional color property does not matter.\n\nHowever, TS\
    \ makes the assumption that there is an error in this piece of code. Object literals\
    \ are processed by it in a special way and are checked for the presence of unnecessary\
    \ properties. This check is done when literals are either assigned to other variables\
    \ or passed as arguments. If there are any properties in the literal that are\
    \ not present in the target type, this will be considered an error.\n\n```typescript\n\
    // error: 'colour' not expected in type 'SquareConfig'\nlet mySquare = createSquare({\
    \ colour: \"red\", width: 100 });\n```\n\nIt is very easy to bypass such a check.\
    \ The easiest way is to use typecasting:\n\n```typescript\nlet mySquare = createSquare({\
    \ width: 100, opacity: 0.5 }) as SquareConfig;\n```\n\nIf you are sure that the\
    \ object can have additional properties that will be used in some special way,\
    \ then there is an even better way – to add a string index. If SquareConfig objects\
    \ can have color and width properties, as well as any number of other properties,\
    \ then the interface can be described as follows:\n\n```typescript\ninterface\
    \ SquareConfig {\n  color?: string;\n  width?: number;\n  [propName: string]:\
    \ any;\n}\n```\n\nWe’ll discuss indexes later, but for now just note that in this\
    \ example, SquareConfig can have any number of properties, and if it’s not color\
    \ or width, then their type doesn’t matter.\n\nThe last way to bypass the check\
    \ for redundant properties – which may seem a little unexpected – is to assign\
    \ an object to another variable. Since squareOptions will not pass the check for\
    \ redundant properties, the compiler will not throw an error.\n\n```typescript\n\
    let squareOptions = {colour: \"red\", width: 100};\nlet mySquare = createSquare(squareOptions);\n\
    ```\n\nDon’t forget that in simple code like the above, you probably shouldn’t\
    \ try to bypass this check. For complex object literals that have methods, or\
    \ have state, you may need to use this technique but most compiler messages related\
    \ to checking for redundant properties indicate real errors. This means that when\
    \ you encounter problems that such a check generates (for example, passing an\
    \ object with arguments to a function), you may need to change the type declarations.\
    \ In this case, if passing an object that can have both color and properties is\
    \ acceptable, you need to reflect this SquareConfig definition.\n\n### Functional\
    \ Types\n\nInterfaces can describe a wide range of “forms” that objects take.\
    \ In addition to describing objects with properties, interfaces can also describe\
    \ function types. In order to describe a function using an interface, a call signature\
    \ is added to it. Such a signature looks like a function description that specifies\
    \ the argument list and the return type. Each parameter in the list must have\
    \ both a name and a type.\n\n```typescript\ninterface SearchFunc {\n  (source:\
    \ string, subString: string): boolean;\n}\n```\n\nOnce defined, such an interface\
    \ can be used in the same way as other interfaces. Now, we will show you how to\
    \ create a variable of functional type and assign it a function.\n\n```typescript\n\
    let mySearch: SearchFunc;\nmySearch = function(source: string, subString: string)\
    \ {\n  let result = source.search(subString);\n  if (result == -1) {\n    return\
    \ false;\n  } else {\n    return true;\n  }\n};\n```\n\nThe parameter names do\
    \ not have to match in order for the function to pass type-matching. We, for example,\
    \ could write the previous example like this:\n\n```typescript\nlet mySearch:\
    \ SearchFunc;\nmySearch = function(src: string, sub: string): boolean {\n  let\
    \ result = source.search(subString);\n  if (result == -1) {\n    return false;\n\
    \  } else {\n    return true;\n  }\n};\n```\n\nThe function parameters are checked\
    \ one after the other, and parameter types in the corresponding positions are\
    \ compared in pairs. If you don’t want to specify types for arguments, then TS\
    \ can infer types from the context based on the fact that the function is assigned\
    \ to a variable whose type is SearchFunc. In the following example, the type of\
    \ the function’s return value is also output: this is done based on the values\
    \ it returns (false and true). If the function returned numbers or strings, compiler\
    \ would warn during type checking that the type of the returned value does not\
    \ match the type specified in SearchFunc interface.\n\n```typescript\nlet mySearch:\
    \ SearchFunc;\nmySearch = function(src, sub) {\n  let result = src.search(sub);\n\
    \  if (result == -1) {\n    return false;\n  } else {\n    return true;\n  }\n\
    };\n```\n\n### Indexed Types\n\nIn the same way that interfaces are used to describe\
    \ functions, you can describe types so that you can use the index operator with\
    \ them – for example, like this a[10] or ageMap[\"daniel\"]. Indexed types have\
    \ an index signature that describes the types that can be used to index an object,\
    \ as well as the types of values that this operation returns. Here is an example:\n\
    \n```typescript\ninterface StringArray {\n  [index: number]: string;\n}\n\nlet\
    \ myArray: StringArray;\nmyArray = [\"Bob\", \"Josh\"];\n\nlet myStr: string =\
    \ myArray[0];\n```\n\nHere we have a stringArray interface that has an index signature.\
    \ This signature says that when stringArray is indexed by a number, a string is\
    \ returned. There are only two types of supported index signatures: with strings\
    \ and with numbers as an argument. An object can support both types, but the type\
    \ of value returned by a numeric index must be a subtype of the one returned by\
    \ a string index. This is because when an index operation is applied to an object,\
    \ JS first converts the number passed as an index to a string. That is, using\
    \ the index 100 (number) is the same as using “100” (string), so the types of\
    \ both indexes must be consistent.\n\n```typescript\nclass Animal {\n  name: string;\n\
    }\n\nclass Dog extends Animal {\n  breed: string;\n}\n\n// Error: indexing with\
    \ a string can return a Dog object!\ninterface NotOkay {\n  [x: number]: Animal;\n\
    \  [x: string]: Dog;\n}\n```\n\nIn addition to being a powerful way to describe\
    \ dictionaries, string indexes require that the types of all properties match\
    \ the type that the index operation returns. This is because obj.property is also\
    \ available as obj[property].\n"
  mdcn: "\n\n```typescript\nif (config.color) {\n  // **Error**: 属性 'collor' 不在类型\
    \ 'SquareConfig' 上\n  newSquare.color = config.collor;\n}\n\nif (config.width)\
    \ {\n  newSquare.area = config.width * config.width;\n}\n\nreturn newSquare;\n\
    }\n\nlet mySquare = createSquare({color: \"black\"});\n```\n\n只读属性 (Read-Only\
    \ Properties)\n\n某些属性应该只在对象创建时被修改。你可以通过在其名称之前添加 `readonly` 来指定：\n\n```typescript\n\
    interface Point {\n  readonly x: number;\n  readonly y: number;\n}\n```\n\n你可以通过赋值对象字面量创建一个\
    \ `Point` 对象，但在赋值之后，你再无法更改 x 和 y。\n\n```typescript\nlet p1: Point = { x: 10, y:\
    \ 20 };\np1.x = 5; // error!\n```\n\nTS 有一个 `ReadonlyArray<T>` 类型，它本质上是 `Array<T>`\
    \ 类型，但移除了所有修改它的方法，因此你可以确定此类数组在创建后不会 way：\n\n```typescript\nlet a: number[] = [1,\
    \ 2, 3, 4];\nlet ro: ReadonlyArray<number> = a;\nro[0] = 12; // error!\nro.push(5);\
    \ // error!\nro.length = 100; // error!\na = ro; // error!\n```\n\n在示例的最后一行，你可以看到即使将\
    \ `ReadonlyArray` 赋值给普通数组是不允许的。然而，仍然可以通过类型转换来绕过此限制：\n\n```typescript\na = ro as\
    \ number[];\n```\n\n记住何时使用 `readonly` 何时使用 `const` 的最简单方法是问自己：该功能是变量需要的还是对象属性需要的。对于变量，使用\
    \ `const`；对于属性，使用 `readonly`。\n\n### 额外属性的检查 (Checks for Extra Properties)\n\n\
    在我们使用接口的第一个示例中，TS 允许我们传递 `{size: number; label: string;}`，而它只期望 `{label: string;}`。我们还学习了可选属性，以及它们在向函数传递参数时是很有用的。\n\
    \n然而，盲目地结合这两个功能会让你像在 JS 中那样自掉自己的脚。例如，如果你看 `createSquare` 的最后一个例子：\n\n```typescript\n\
    interface SquareConfig {\n  color?: string;\n  width?: number;\n}\n\nfunction\
    \ createSquare(config: SquareConfig): { color: string; area: number } {\n  //\
    \ ...\n}\n\nlet mySquare = createSquare({ colour: \"red\", width: 100 });\n```\n\
    \n注意传递给 `createSquare` 的参数写的是 `colour` 而不是 `color`。在纯 JS 中，这些操作不会报错，但它们无法按照开发者想要的方式工作。\n\
    \n我们可以从类型的角度认为这个程序是正确的，因为 `width` 属性的类型是兼容的，没有 `color`，且存在额外的 `color` 属性并不紧要。\n\
    \n然而，TS 假设这段代码中存在错误。它以特殊方式处理对象字面量，并检查是否存在不必要的属性。这种检查是在字面量赋值给其他变量或作为参数传递时进行的。如果字面量中的任何属性在目标类型中不存在，将将被视为错误。\n\
    \n```typescript\n// error: 类型 'SquareConfig' 中不应出现 'colour'\nlet mySquare = createSquare({\
    \ colour: \"red\", width: 100 });\n```\n\n绕过这种检查非常容易。简单的方法是使用类型转换：\n\n```typescript\n\
    let mySquare = createSquare({ width: 100, opacity: 0.5 }) as SquareConfig;\n```\n\
    \n如果你确定对象可以具有以某些特殊方式使用的额外属性，那么有一个更好的方法——添加字符串索引。如果 `SquareConfig` 对象可以拥有 `color`\
    \ 和 `width` 属性，以及任意数量的其他属性，那么接口可以描述如下：\n\n```typescript\ninterface SquareConfig\
    \ {\n  color?: string;\n  width?: number;\n  [propName: string]: any;\n}\n```\n\
    \n我们稍后讨论索引，现在只需注意在此示例中，`SquareConfig` 可以拥有任意数量的属性，如果它们不是 `color` 或 `width`，那么它们的类型无关。\n\
    \n绕过冗余属性检查的最后一种方法（可能看起来有点意外）是将对象赋值另一个变量。由于 `squareOptions` 不通过冗余属性检查，编译器将不会抛出错误。\n\
    \n```typescript\nlet squareOptions = {colour: \"red\", width: 100};\nlet mySquare\
    \ = createSquare(squareOptions);\n```\n\n不要忘记，在上面的简单代码中，你可能不应该尝试绕过这种检查。对于具有方法或状态的复杂对象字面量，你可能需要使用这种技术，但大多数与检查冗余属性相关的编译器消息都指示了真实的错误。这意味着当你遇到此类检查产生的问题时（例如，向函数传递带参数的对象）时，你可能需要更改类型声明。在这种情况下，如果传递一个同时具有\
    \ `color` 和其他属性的对象是可以接受的，你需要反映这一 `SquareConfig` 定义。\n\n### 函数类型 (Functional Types)\n\
    \n接口可以描述对象所体态的各种“形式”。除了描述带有属性的对象外，接口还可以描述函数类型。为了使用接口描述函数，需要对其添加一个调用签名（call signature）。这种签名看起来像一个函数描述，指定了参数。\n\
    \n```typescript\ninterface SearchFunc {\n  (source: string): boolean;\n}\n```\n\
    \n一旦定义好，这种接口就可以像其他接口一样使用。现在，我们将向你展示如何创建一个函数，它指定了参数和返回类型：\n\n```typescript\nlet\
    \ mySearch: SearchFunc = function(source: string) {\n  return source.length >\
    \ 0;\n};\n```\n\n函数的参数名称不需要匹配。为了让参数类型匹配，我们可以这样写：\n\n```typescript\ninterface SearchFunc\
    \ {\n  (source: string, sub: string): boolean;\n}\n\nlet mySearch: SearchFunc\
    \ = function(source, sub) {\n  return source === sub;\n};\n```\n\n如果你不想指定参数的类型，TS\
    \ 可以根据上下文推断。在下面的示例中，函数的返回类型是指定的：\n\n```typescript\ninterface SearchFunc {\n  (source:\
    \ any): boolean;\n}\n\nlet mySearch: SearchFunc = function(source: string) {\n\
    \  return source.length > 0;\n};\n```\n\n### 索引类型 (Indexed Types)\n\n与接口用于描述函数一样，你也可以描述类型以便对它们使用索引操作符——例如\
    \ `a[10]` 或 `ageMap[\"daniel\"]`。索引类型具有索引签名，描述了可以用于索引对象的类型，以及此操作返回值的类型。这里有一个示例：\n\
    \n```typescript\ninterface StringArray {\n  [index: number]: string;\n}\n\nlet\
    \ myArray: StringArray;\nmyArray = [\"Bob\", \"Josh\"];\n\nlet myStr: string =\
    \ myArray[0];\n```\n\n这里我们有一个具有索引签名的 `stringArray` 接口。该签名表示当 `stringArray` 被数字索引时，返回一个字符串。只有两种类型的索引签名：以字符串或数字作为参数。对象可以支持这两种类型，但数字索引返回的值类型必须是字符串索引返回值的子类型。这是因为当对象应用索引操作时，JS\
    \ 首先将作为索引的数字转换为字符串。也就是说，使用索引 100（数字）与使用 \"100\"（字符串）是相同的，因此两个索引的类型必须一致。\n\n```typescript\n\
    class Animal {\n  name: string;\n}\n\nclass Dog extends Animal {\n  breed: string;\n\
    }\n\n// Error: 使用字符串索引可能返回一个 Dog 对象！\ninterface NotOkay {\n  [x: number]: Animal;\n\
    \  [x: string]: Dog;\n}\n```\n\n除了作为描述字典的强大方式外，字符串索引要求所有属性的类型与索引操作返回的类型匹配。这是因为\
    \ `obj.property` 也可以作为 `obj[property]` 可用。\n\n"
