    Microsoft designed TS with specific architectural parameters in mind, \n\nwhich\
    \ allow TS to integrate fully and easily with existing JS code, while \n\nproviding\
    \ robust features external to JS.\n\n1\\. **Providing a Type Check:** JS, being\
    \ a freely typed language, is \n\nextremely lenient about the value assigned to\
    \ its variables, and it \n\ndoes not create any structural contracts between these\
    \ variables and \n\nthe constructs that use them. Passing a number argument to\
