    \ their functions, but TypeScript will remain a statically alternative.\n\nIf\
    \ you’re new to JavaScript, you shouldn’t grin at the first mention of TypeScript.\
    \ TypeScript was developed not just to encourage backend developers to work with\
    \ the frontend, but to build on lessons learned from other languages to provide\
    \ everyone with a tool that allows you to create reliable code. JavaScript was\
    \ created to be portable and simple – but over time, we have seen that the language\
    \ goes beyond its original intent. Although a few hundred, if not thousands of\
    \ lines of code, could still be supported in regular JavaScript – we all know\
    \ this is no longer the case. JavaScript code works everywhere and on almost every\
    \ device. The number of rows is growing exponentially, and we need a way to mentally\
    \ digest and maintain it.\n\nIt is not difficult to learn TypeScript itself. It\
    \ is written and runs like JavaScript – with only a few tools and techniques to\
    \ help you improve the code. In fact, you can just write TypeScript code like\
    \ JavaScript, and it will still compile. While TypeScript may seem like syntactic\
    \ sugar, it makes our experience of maintaining and writing code much more optimal.\
    \ I hope that by the end of this book, you will be able to create a comprehensive,\
    \ end-to-end web application that shows you how to combine TypeScript features,\
    \ design patterns, and best practices in a real-world scenario.\n"
  mdcn: "\nTypeScript 架构 **171**\n\n元组类型现在允许在任何位置使用剩余参数，而不仅仅是最后一个。例如：\n\n`type T1\
    \ = [...string[], number]; // 零或多个字符串，后跟一个数字；`\n\n`type T2 = [number, ...boolean[],\
    \ string, string]; // 一个数字，后跟零或多个布尔值，最后是两个字符串。` \n\n现在对剩余元素只有一个限制——它们不能放在其他剩余元素之后且可选元素之前。\n\
    \n## 保留类型别名 (SAVING-TYPE ALIASES)\n\n类型别名现在会被保存，以便在 IDE 提示显示和 *.d.ts* 定义文件中的类型输出中更加准确。它还会跟踪其他别名实例的类型别名。这使得复合类型的表示更具可读性（包括在定义文件\
    \ d.ts 中）。\n\n## 构造函数签名中的抽象修饰符\n\nTypeScript 允许你将类标记为抽象（abstract）——在这种情况下，它仅用于通过子类进行扩展，并且只为特定的实现类创建对象。但在之前的\
    \ TypeScript 版本中，创建使用抽象类的混入（mix-ins）时会存在问题。\n\nTypeScript 4.2 允许为构造函数签名指定抽象修饰符。在构造函数签名中添加抽象修饰符表示一个抽象类可以传递给它。这不会阻止你传递其他对它而言“特定”的类和构造函数。\n\
    \n混入工厂现在将支持抽象类。\n\n```typescript\nabstract class Shape {\n  abstract getArea():\
    \ number;\n}\n\n// 错误！你不能创建抽象类的实例。\nnew Shape();\n\ninterface HasArea {\n  getArea():\
    \ number;\n}\n\n// 错误！你不能将抽象构造类型赋值给非抽象构造类型。\nlet Ctor: new () => HasArea = Shape;\n\
    \n// 正常工作！\nlet Ctor: abstract new () => HasArea = Shape;\n```\n\n### In 语句的严格检查\n\
    \n在 JavaScript 中，在 `in` 语句的右侧使用非对象类型会导致运行时错误。TypeScript 4.2 中的语法检查确保了在开发期间就能检测到此错误。\n\
    \n```javascript\n\"foo\" in 42\n// // 错误！in 表达式的右侧不能是原始类型。\n```\n\n## 数组解构中的未使用的变量\n\
    \n现在，在解构数组时，你可以通过为变量添加下划线来显式标记为未使用。\n\n```typescript\nlet [_first, second] = getValues();\n\
    ```\n\n以前，当启用 *noUnusedLocals* 选项时，这种语法会报错：“变量已声明但未读取”。现在，对于带有下划线前缀的数组变量，不再返回错误。\n\
    \n## 类型参数\n\nJavaScript 不允许类型参数，但在 TypeScript 4.2 中，解析器将以符合规范的方式解析它们。当 JavaScript\
    \ 文件写入以下代码时：\n\n```javascript\nf < T > (100)\n```\n\nTypeScript 将其解析为：\n\n`(f\
    \ < T) > (100)`\n\n如果你使用 TypeScript API 来分析 JavaScript 文件中的类型构造，这将非常重要。\n\n此外，引入了新的\
    \ *noPropertyAccessFromIndexSignature* 选项。该功能禁用了使用点符号访问通过字符串索引签名定义的对象属性的能力。\n\n\
    如果在布尔表达式 `&&` 和 `||` 中有一个未调用的函数，在 – *strict-NullChecks* 标志下这将导致编译错误。\n\n在 TypeScript\
    \ 的最新版本中，还增加了对 *explainFiles* 标志的支持。你可以使用它来理解文件为何被包含在编译过程中。\n\n## 未来计划\n\nTypeScript\
    \ 4.3 下一个季度版本已于5 月 25 日发布。迭代计划列出了即将推出的语言特性、编辑器性能改进、性能优化、基础设施改进等。\n\n此外，根据 TypeScript\
    \ 路线图，Microsoft 计划：\n\n- 允许任何键类型作为索引签名参数\n- 添加关键字 --noImplicitOverride 和 override\n\
    - 添加静态索引签名\n- 使用 unknown 作为 catch 子句变量的类型\n- 允许在子类中调用 super() 之前有更多代码\n- 允许 typeof\
    \ 紧跟类表达式\n\n记住在 2020 年，Microsoft 发布了用于在云端编辑文档的 TypeScript 库源码。\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_190_0.png)\n\
    \nDOI: 10.1201/9781003203728-6\n\n# 第 6 章：评估 (Appraisal)\n\nTypeScript 既是一种语言，也是一组生成\
    \ JavaScript 代码的工具。它由微软股份公司的 Anders Heilsberg 开发，旨在帮助开发者编写企业级的 JavaScript 代码。本书从介绍\
    \ TypeScript 语言开始，逐渐从基础概念过渡到语言的高级和强大特性，包括异步编程方法、装饰器和泛化。同时，还并行考虑了许多现代 JavaScript\
    \ 和 TypeScript 框架。书中描述了一些著名的面向对象方法和设计模式，并展示了它们的真实世界实现。通过使用本书，你可以创建一个全面的、端到端的 Web\
    \ 应用程序，向你展示如何在真实场景中结合 TypeScript 特性、设计模式和最佳开发实践。\n\nTypeScript 是一个非常强大的工具，允许你显著提高代码的可读性和安全性。在本书中，我们从内部和外部研究了\
    \ TypeScript。在本书的第一章中，我们比较了 JavaScript 和 TypeScript，并指出了 TypeScript 的优势。TypeScript\
    \ 是静态类型的（statistically typed），这使得它更易用。除此之外，静态类型还具有代码编辑器中的自动补全等功能，这使得编写代码的过程变得更容易，因为你不需要频繁查找文档。之后，我们分析了\
    \ ECMAScript 如何与 TypeScript 工作。TypeScript 是 JavaScript 的超集，带来了静态类型和一些 ECMAScript\
    \ 标准特性。TypeScript 编译器可以通过参数切换不同版本的 ECMAScript 标准，目前支持 ES3、ES5 和 ES6。\n\n此外，并行考虑了许多现代\
    \ JavaScript 和 TypeScript 框架——对于每个框架，都详细描述了模块和集成测试。书中描述了一些著名的面向对象方法和设计模式，并展示了它们的真实世界实现。\n\
    \nTypeScript 为开发力和体验带来了许多收益。TypeScript 并非 Angular 特有，React 等其他强大的框架也开始使用 TypeScript\
    \ 以允许开发团队构建健壮、弹性的应用程序。JavaScript 和 TypeScript 在不断进化，但它们之间并不竞争。TypeScript 的创建是为了补充和改进\
    \ JavaScript，而不是取代它。未来，它们在功能上可能会变得相似，但 TypeScript 将保持其静态替代方案。\n\n如果你是 JavaScript\
    \ 新手，不应该对第一次提到 TypeScript 感到惊讶。TypeScript 的开发不仅是为了鼓励后端开发者处理前端，更是为了从其他语言中汲取教训，为所有人提供一个创建可靠代码的工具。JavaScript\
    \ 的创建是为了易移植和简单——但随着时间的推移，我们看到该语言已经超出了其初衷。虽然几百甚至几千行代码仍可以在普通的 JavaScript 中运行——但我们都知道这已不再是事实。JavaScript\
    \ 代码无处不在，运行在几乎所有设备上。代码量正在指数级增长，我们需要一种方式来精神消化和维护它。\n\n学习 TypeScript 本身并不困难。它的编写和运行方式就像\
    \ JavaScript——只有一些工具和技术可以帮助改进代码。事实上，你可以像写 JavaScript 一样写 TypeScript 代码，它仍然编译。虽然\
    \ TypeScript 看起来像语法糖，但它让我们维护和编写代码的体验更加优化。我希望在本书结束时，你能够创建一个全面的、端到端的 Web 应用程序，向你展示如何在真实场景中结合\
    \ TypeScript 特性、设计模式和最佳实践。\n"
