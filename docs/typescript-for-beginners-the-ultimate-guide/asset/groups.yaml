- md: "\n## TypeScript Architecture \n\n**163**\n\nframework is built on typescript\
    \ from Microsoft with an eye to making \n\nJavaScript code more flexible and attractive\
    \ for large enterprises.\n\nAngular 2 is a completely rewritten Angular 1 framework\
    \ that used \n\nTypeScript as the preferred language. The naming convention adopted\
    \ \n\nby the Angular team states that Angular 1 is now called AngularJS, and \n\
    \nAngular versions 2 and higher are called Angular. Since the release of \n\n\
    Angular 2, the Angular team has released a number of major updates, \n\nand the\
    \ current version of Angular at the time of writing this chapter \n\nis Angular\
    \ 7. The examples in this book are written using Angular 7, so \n\nwherever you\
    \ see the word Angular, remember that it refers to Angular \n\nversion 7. In this\
    \ section, we will look at how the Model-View-Controller \n\ndesign pattern is\
    \ used in Angular.\n\nSimilar to configuring the development environment in Aurelia,\
    \ \n\nAngular also has a tool for configuring the project using the command \n\
    \nline called “Angular Command Line Interface.” It can be installed using \n\n\
    npm by the following way:\n\n*npm install -g @angular/cli*\n\nOnce the command-line\
    \ interface is installed globally, we can configure \n\nthe Angular development\
    \ environment using the command-line interface:\n\n*ng new my-app*\n\nThe Angular\
    \ command line interface is designated as ng, and here we have \n\nspecified that\
    \ it should create a new project in a new directory named my-\n\napp. In the new\
    \ directory, the command-line interface will download and \n\ninstall all the\
    \ necessary components of the Angular application, as well \n\nas create a minimal\
    \ project instance in the src/app directory to get you \n\nstarted. To start the\
    \ development web server and see how this application \n\nworks, type the following\
    \ command:\n\n*npm start*\n\nThe start command will compile all the source code\
    \ of the application and \n\nlaunch the web server on port 4200.\n\nAlong with\
    \ compiling the application and automatically starting the \n\nweb server, the\
    \ npm start command will also look at the source files in \n\nthe project directory\
    \ and automatically recompile the application after\n\nchanging the files. It\
    \ will also give the web browser a signal to restart the \n\napp. The built-in\
    \ monitoring, recompilation, and reloading capabilities are \n\nvery helpful in\
    \ web application development, providing quick feedback \n\nwhen the source code\
    \ changes. Keep an eye on the console where you are \n\nrunning npm start. It\
    \ shows all TypeScript compilation errors that occur \n\nwhen saving your files.\n\
    \n## REACT\n\nDespite the fact that React is more of a library than a framework,\
    \ it stands \n\nbehind the user interface of Facebook and Instagram, showing its\
    \ effectiveness inside dynamic applications with high traffic (bandwidth).\n\n\
    It is rightfully considered the fastest growing JS framework: today there \n\n\
    are about 1000 GitHub authors. In the MVC (Model-View-Controller) React \n\nmodel.js\
    \ acts as a “V” and can be easily integrated into any architecture. \n\nThanks\
    \ to the use of a virtual DOM tree, it provides a greater performance \n\nboost\
    \ compared to Angular 1.x. In addition, React components can be cre-\nated and\
    \ reused in other applications, or even transferred for public use.\n\nAlthough\
    \ React is more difficult to learn, it makes application develop-\nment simple\
    \ and easy to understand. In addition, it can be ideally suited \n\nfor complex,\
    \ impressive software solutions with a high degree of load.\n\nIt uses a specific\
    \ built-in syntax to combine HTML templates and \n\nJavaScript code into a single\
    \ file called JSX. It doesn’t have downloadable \n\nstring templates, like in\
    \ Backbone, or HTML code snippets that are in a \n\nseparate file, like in Angular\
    \ or Aurelia. In React, all templates are mixed \n\nwith regular JavaScript code,\
    \ using an HTML-like syntax. As a simple \n\nexample of this syntax, let’s look\
    \ at the following code:\n\n*render() {*\n\n*return <div>Hello <span>React</span></div>;*\
    \ \n\n*}\n\nHere, we have the standard TypeScript render function. As part of\
    \ this \n\nfunction, we return what looks like native HTML code with <div> tags\
    \ and \n\nchild <span> tags. Note that there are no quotation marks around these\
    \ \n\nHTML elements. They are written inside our function without a clear sep-\n\
    aration from the regular TypeScript code.\n\nTypeScript included support for the\
    \ unique React/JSX syntax in \n\nrelease 1.6. However, to use the new JSX syntax,\
    \ we will need to create\n\nTypeScript files with the extension .tsx instead of\
    \ the usual extension. .ts. \n\nWhen TypeScript finds files with the extension\
    \ .tsx, it parses the file as a \n\nJSX file, which allows you to use the JSX\
    \ syntax.\n\nThe process that React uses to generate JavaScript from JSX files\
    \ is an \n\nadditional step in the normal development workflow. Our TypeScript\
    \ files \n\n*.tsx*, after compilation, will generate JavaScript files that convert\
    \ the JSX \n\nsyntax into a series of calls to React libraries.\n\nFor example,\
    \ using the <div> element in *.tsx file will create a call to \n\n*React.createElement*\
    \ (“div”,…) in the compiled JavaScript file. These com-\niled files must then\
    \ be combined with the React libraries themselves to \n\ncreate executable code.\
    \ For this reason, it is recommended to use a tool \n\nsuch as Webpack to combine\
    \ TypeScript output with React libraries and create a single unified file that\
    \ can be used\n\nin the browser. To do this, however, use the compilation options\
    \ for \n\nTypeScript in the tsconfig.json and webpack configuration in the web-\n\
    pack.config file.the js must be consistent. The easiest way to do this cor-\n\
    rectly is to use one of the convenient configuration tools available online. \n\
    \nOne of these tools can be found on the page https://webpack.jakoblind.\nno.\
    \ It provides a simple HTML page for configuring a number of options \n\navailable\
    \ for webpack.\n\nTo start a new project, we will follow a few steps. First, create\
    \ a \n\ndirectory for your project and initialize npm:\n\n*mkdir react-sample*\n\
    \n*cd react-sample*\n\n*npm init*\n\nHere, we create a directory for our project,\
    \ go to it, and initialize npm \n\nin the project directory. After that, the package\
    \ file will be created.json, \n\nwhich can use npm. After initialization, we can\
    \ install webpack:\n\n*npm install -g webpack*\n\n*npm install -g webpack-cli*\n\
    \nThe webpack will be installed as a global module and the webpack command-line\
