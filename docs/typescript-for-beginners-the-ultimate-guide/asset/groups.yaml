    \ HTML App</h1>\n <div id=\"content\"></div>\n <script src=\"app.js\"></script>\n\
    </body>\n</html>\n```\n\nThis is a normal html file where the file is attached\
    \ app.js. Now, in the same directory, create the app.ts file. And it is app.ts,\
    \ not app.js, that is, the TS code file. It is also a plain text file. And in\
    \ it we define the following content:\n\n```typescript\nvar el = document.getElementById(\"\
    content\");\nclass user {\n  name: string;\n  age: number;\n  constructor (_name:\
    \ string, _age: number) {\n    this.name = _name;\n    this.age = _age;\n  }\n\
    }\nvar tom: User = new user (\"Jack\", 29);\nel.innerHTML = \"Name:\" + jack.name\
    \ + \" age:\" + jack.age;\n```\n\n¹ The codes in this chapter are derived from\
    \ https://www.npmjs.com/package/typescript.\n\n**141** TS Runtime\n\nHere, we\
    \ get the element with id=content, and create the User class. Next, we’ll look\
    \ at creating and using classes. Creating an object of this class with the name\
    \ Jack and the age of 29 years. And output the object data to the element. When\
    \ saving a file, it is better to choose utf-8 encoding.\n\nNow let’s compile this\
    \ file. To do this, in the command line/terminal, use the cd command to go to\
    \ the directory where the app.ts file is located (in my case, this is `C:\\typescript`).\
