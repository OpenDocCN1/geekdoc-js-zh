    \ 标记。\n\n类型迭代修饰符在以下情况下非常有用：\n- 有一个无法直接更改的接口（例如，来自库）；\n- 有一个我们希望为了某些目的继续使用的接口，并（使用修饰符）创建它的微小变体用于其他目的；\n\
    - 在两种情况下，类型迭代修饰符都“遵循”原始接口的形式；即使原始接口在未来发生变化/被更改，它们也会根据指定的规则对其进行扩展。\n\n## 58 TypeScript初学者\
    \ TypeScript\n\n### 参数属性 (Parameter Properties)\n\n在在上一个示例中，我们在 Octopus 类中声明了只读成员\
