    ```\n\n允许直接设置 fullName 是很方便的，但如果有人随意更改名称，这可能会导致问题。\n\n## 59 TS 核心概念\n\n在这个版本中，我们通过使用\
    \ getter 和 setter 来检查密码。\n\n```typescript\nclass Employee {\n  private _fullName:\
