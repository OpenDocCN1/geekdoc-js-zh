  mdcn: "\n\n## 88 TypeScript 入学者\n\n### 泛型类 (Generalized Classes)\n\n泛型类的形式与泛型接口相同。它们在类名后的尖括号\
    \ (`< >`) 中带有一个典型参数列表。\n\n```typescript\nclass GenericNumber<T> {\n  zeroValue:\
    \ T;\n  add: (x: T, y: T) => T;\n}\n```\n\n```typescript\nlet myGenericNumber\
    \ = new GenericNumber<number>();\nmyGenericNumber.zeroValue = 0;\nmyGenericNumber.add\
    \ = function(x, y) { return x + y; };\n```\n\n这是对 `GenericNumber` 类型相当字面的使用（即泛型数字），但你可以看到，除了数字之外，没有任何阻止你对其使用其他类型。例如，你可以使用字符串类型或更复杂的对象。\n\
    \n```typescript\nlet stringNumeric = new GenericNumber<string>();\nstringNumeric.zeroValue\
    \ = \"\";\nstringNumeric.add = function(x, y) { return x + y; };\nalert(stringNumeric.add(stringNumeric.zeroValue,\
    \ \"test\"));\n```\n\n与接口一样，将类型参数传递给类本身，意味着该类的所有属性都将与相同类型工作。\n\n正如第 2 章提到的，类有两种类型：静态部分类型和实例类型。泛型类型仅相对于实例类型是有效，而对静态部分类型无效。因此，静态类成员不能使用泛型类参数。\n\
    \n### 泛化的局限性 (Limitations of Generalizations)\n\n正如你从之前的示例中所记忆的，在某些情况下，你需要创建一个适用于特定类型集的泛型函数，并且你知道这些类型具备的能力。在\
    \ `loggingIdentity` 的示例中，你需要访问 `arg` 对象的 `.length` 属性，但编译器无法确定任何类型是否具有此类属性，因此它发出了警告。\n\
    \n```typescript\nfunction loggingIdentity<T>(arg: T): T {\n  console.log(arg.length);\
    \ // Error: T 没有 .length 属性\n  return arg;\n}\n```\n\n与其与任何可能的类型工作，我们希望创建一个约束，使得该函数适用于所有具有\
    \ `.length` 属性的类型。如果一个类型具有此属性，就可以使用它，但它必须至少拥有该属性。\n\n为了实现这一点，我们将创建一个描述此类限制的接口。创建一个具有单个属性\
    \ `length` 的接口，并使用 `extend` 关键字来表示约束：\n\n```typescript\ninterface Lengthwise {\n\
    \  length: number;\n}\n\nfunction loggingIdentity<T extends Lengthwise>(arg: T):\
    \ T {\n  console.log(arg.length); // 现在我们知道对象具有 .length 属性\n  return arg;\n}\n\
    ```\n\n由于泛型函数现在有了约束，它将无法与任何类型工作：\n\n```typescript\nloggingIdentity(3); // Error,\
    \ 数字没有 .length 属性\n```\n\n相反，它需要传递具有所有必要属性类型的值：\n\n```typescript\nloggingIdentity({length:\
    \ 10, value: 3});\n```\n\n### 在约束中使用泛型参数\n\n你可以定义一个类型参数，将其限制为另一个参数的类型。例如，我们想通过名称获取对象的某个属性。我们真的不希望获取一个不存在的属性。要做到这一点，在类型的第二个参数上输入一个限制。例如：\n\
    \n```typescript\nfunction getProperty<T, K extends keyof T>(obj: T, key: K) {\n\
    \  return obj[key];\n}\n\nlet x = {a: 1, b: 2, c: 3, d: 4};\nconsole.log(getProperty(x,\
    \ \"a\")); // ok\nconsole.log(getProperty(x, \"m\")); // error: 类型 'm' 不能赋值给 'a'\
    \ | 'b' | 'c' | 'd'。\n```\n\n### 在泛化中使用类类型\n\n在使用泛化创建对象工厂时，你必须在构造函数中引用类类型。例如：\n\
    \n```typescript\nfunction create<T>(C: { new(): T}): T {\n  return new C();\n\
    }\n\nclass SomeClass {}\nvar obj = create(SomeClass);\nconsole.log(obj.constructor.name);\
    \ // 显示 SomeClass\n```\n\n接下来的示例显示了如何对类工厂创建的类类型实施限制：\n\n```typescript\nclass BeeKeeper\
    \ {\n  hasMask: boolean = false;\n}\n\nclass ZooKeeper {\n  nametag: string =\
    \ \"tag\";\n}\n\nclass Animal {\n  numlegs: number;\n}\n\nclass Bee extends Animal\
    \ {\n  keeper: BeeKeeper = new BeeKeeper();\n}\n\nclass Lion extends Animal {\n\
    \  keeper: ZooKeeper = new ZooKeeper();\n}\n\nfunction createInstance<T extends\
    \ Animal>(c: new () => T): T {\n  return new c();\n}\n\nconsole.log(createInstance(Lion).keeper.nametag);\
    \ // 显示 \"tag\"\nconsole.log(createInstance(Bee).keeper.hasMask); // 显示 \"false\"\
    \n```\n\n### new 关键字\n\n在泛化代码中创建新对象，我们需要指定泛型类型 `T` 具有构造函数。这意味着我们不需要类型参数 `T`，而是需要指定类型\
    \ `{new(): T;}`。例如，下面的泛型接口将无法工作：\n\n```typescript\nfunction UserFactory<T>():\
    \ T {\n  return new T(); // 编译错误\n}\n```\n\n为了使接口工作，请使用关键字 `new`：\n\n```typescript\n\
    function UserFactory<T>(type: { new (): T; }): T {\n  return new type();\n}\n\n\
    class user {\n  constructor() {\n    console.log (\"User object created\");\n\
    \  }\n}\n```\n\n## 92 TypeScript 入学者\n\n### 枚举 ENUMS\n\n枚举允许我们定义一组命名的数字常量，并使用\
    \ `enum` 关键字进行定义。枚举是原始数字类型的子类型。\n\n```typescript\nenum Direction {\n  Up = 1,\n\
    \  Down,\n  Left,\n  Right\n}\n```\n\n枚举体由零或多个元素组成。枚举元素具有与名称关联的数值，并且可以是常量，也可以是可求值的。如果满足以下条件，枚举元素被视为常量：\n\
    \n- 如果值没有显式定义，且上一个成员的值是常量。在这种情况下，该值将等于上一个项的数值加 1。唯一的异常是第一个元素。如果未指定值，它将变为 0；\n\
    - 如果枚举元素是用常量表达式定义的。此类表达式是 TS 表达式的一种，可以在编译时进行求值。\n\n如果数字字面量满足以下条件，则枚举表达式是常量：\n\n\
    - 对枚举中之前定义的常量元素的引用（可以在不同的枚举中定义）。如果元素定义在同一个枚举中，则可以使用未限定名称引用；\n- 枚举的常量表达式，用括号括起；\n\
    - 二进制运算符 `+`, `-`, `*`, `%`, `≪`, `≫`, `⋙`, `&`, `^` 以枚举表达式为操作数。常量枚举表达式求值为 `NaN`\
    \ 或 `Infinity` 将导致编译时错误。\n\n在所有其他情况下，枚举成员被认为是可求值的，其值在执行时求值。\n\n```typescript\n\
    enum FileAccess {\n  // 常量元素\n  None,\n  Read = 1 << 1,\n  Write = 1 << 2,\n \
    \ ReadWrite = Read | Write,\n  // 求值元素\n  G = \"123\".length\n}\n```\n\n枚举是运行时有效的对象。其原因之一是支持从枚举值到名称的反向映射。\n\
    \n```typescript\nenum Enum {\n  A\n}\n```\n\n```typescript\nlet a = Enum.A;\n\
    let nameOfA = Enum[Enum.A]; // \"A\"\n```\n\n编译为：\n\n```javascript\nvar Enum;\n\
    (function (Enum) {\n  Enum[Enum[\"A\"] = 0] = \"A\";\n})(Enum || (Enum =}));\n\
    \nvar a = Enum.A;\nvar nameOfA = Enum[Enum.A]; // \"A\"\n```\n\n### 常量枚举 (Constant\
    \ Enums)\n\n为了在访问枚举值时避免产生额外代码和间接访问的代价，可以使用常量枚举。常量枚举通过在 `enum` 关键字前使用 `const` 修饰符来定义。\n\
    \n"
