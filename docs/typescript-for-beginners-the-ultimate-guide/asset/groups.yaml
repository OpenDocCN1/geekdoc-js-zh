  mdcn: "\nTypeScript 31\n\n你做错了一些。例如，我们忘记指定 `public_address` 属性了。\n\n```typescript\n\
    const server: IServer = {\n  hostname: 'Pikachu',\n  location: 'RM1',\n  active:\
    \ true\n}\n// Error → Type '{ hostname: string; location: string; active: true;\
    \ }' is not assignable to type 'IServer'.\n// Property 'public_address' is missing\
    \ in type '{ hostname: string; location: string; active: true; }'.\n```\n\n编译器评估了我们的初始化，但在我们的对象中没有看到\
    \ `public_address` 属性，这就是它显示错误的原因。\n\n但某些结构无法仅通过一个接口区分。当然，在 TS 中，你可以使用一个接口作为另一个接口属性的类型。\n\
    \n```typescript\ninterface IPublicAddress {\n  netmask: string;\n  gateway: string;\n\
    \  address: string;\n}\n\ninterface IServer {\n  hostname: string;\n  location:\
    \ string;\n  active: boolean;\n  public_address: IPublicAddress;\n}\n```\n\n注意，除了基本类型和其他接口外，你还可以在接口中描述函数。这是通过箭头函数实现的，例如如下：\n\
    \n```typescript\ninterface IServer {\n  getPublicAddress: () => IPublicAddress;\n\
    }\n```\n\nTypeScript 入门教程 32\n\n同时，没有人禁止你指定函数的参数：\n\n```typescript\ninterface\
    \ ICalculator {\n  sum: (a: number, b: number) => number;\n}\n```\n\n### 扩展接口\
    \ (Extending Interfaces)\n\n在 TS 中，你只能扩展接口而不能继承它们。当你需要新接口不仅拥有接口的所有属性，还拥有该接口的额外或唯一属性时，可以使用扩展。\n\
    \n```typescript\ninterface IResponse {\n  status: number;\n}\n\ninterface ISlackResponse\
    \ extends IResponse {\n  ok: boolean;\n}\n```\n\n### 索引类型 (Indexed Types)\n\n\
    有时你可能需要允许在对象中不仅存储预先已知数量的属性，还可以存储变量，例如当你实现缓存接口时。在这种情况下，你不知道属性名称，但你知道它的类型。\n\n```typescript\n\
    interface ICache {\n  size: number;\n  first: ICacheItem;\n  last: ICacheItem;\n\
    \  items: {\n    [item: string]: ICacheItem;\n  };\n}\n```\n\n现在，你可以向 `items`\
    \ 对象中写入任何具有字符串类型键和 `ICacheItem` 类型值的对值。\n\n### 接口实现 (Interface Implementation)\n\
    \n对于对象，你只需将一个用冒号分隔的变量赋值给所需的接口作为类型并实现它。对于类来说，情况则有些不同——类必须实现接口。如果你忘记编写至少一个方法的实现，编译器将抛出错误。例如，我们将编写一个由类实现的缓存接口。\n\
    \n```typescript\ninterface ICacheItem {\n  mtime: number;\n  content: string;\n\
    }\n\ninterface IFileCache {\n  set: (key: string, value: ICacheItem) => void;\n\
    \  get: (key: string) => ICacheItem;\n}\n\nclass FileCache implements IFileCache\
    \ {\n  store = new Map();\n  set(key: string, value: ICacheItem): void {\n   \
    \ this.store.set(key, value);\n  }\n  get(key: string): ICacheItem {\n    return\
    \ this.store.get(key);\n  }\n}\n```\n\n上面是实现类的最简单示例，从这里还完全不清楚为什么在这里需要接口，因为我们可以直接创建一个类。让我们明确这一点：在写完接口后，我们可以根据需要无限次地实现它，例如用于图像存储缓存或任何其他地方。\n\
    \n### 辨析联合类型 (Discriminated Union Types)\n\n我们将这种类型放在接口部分，因为它只适用于接口。辨析联合类型返回一个新类型，该类型仅包含所有接口都存在的属性。\n\
    \n下面是三个具有共同属性的接口，该属性的类型表示为字符串字面量。这个属性将在新类型中被表示。\n\n```typescript\ninterface Square\
    \ {\n  kind: 'square';\n  size: number;\n}\n```\n\nTypeScript 入门教程 34\n\n```typescript\n\
    interface Rectangle {\n  kind: 'rectangle';\n  width: number;\n  height: number;\n\
    }\n\ninterface Circle {\n  kind: 'circle';\n  radius: number;\n}\n```\n\n现在让我们看看如何在实践中使用辨析联合类型。正如你可能已经猜到的那样，我们将计算使用接口描述的形状的面积。\n\
    \n```typescript\nfunction area(s: Square | Rectangle | Circle): number {\n  switch\
    \ (s.kind) {\n    case 'square': return s.size * s.size;\n    case 'rectangle':\
