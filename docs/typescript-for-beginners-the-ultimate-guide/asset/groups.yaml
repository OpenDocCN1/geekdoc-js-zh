    \ types, we will either have to specify number | undefined as the type returned\
    \ by the function, or add default in the case of using case, or else in the case\
    \ of using if.\n\nTypeScript for Beginners 35\n\n### Working with Interfaces\n\
    \nThe easiest way to see how interfaces work is to start with a simple example:\n\
    \n```typescript\nfunction printLabel(labelledObj: { label: string }) {\n  console.log(labelledObj.label);\n\
    }\n\nlet myObj = {size: 10, label: \"Size 10 Object\"};\nprintLabel(myObj);\n\
    ```\n\nThe compiler checks the printLabel call. This function takes a single parameter,\
    \ which requires that the passed object has a property named label, which would\
    \ have a string type. Note that our object has other properties, but the compiler\
    \ only checks that it has at least the necessary properties, and their types.\n\
    \nIn some cases, TS does not behave soly. We can rewrite this example, this time\
    \ using the interface to reflect the need for a string property:\n\n```typescript\n\
    interface LabelledValue {\n  label: string;\n}\n\nfunction printLabel(labelledObj:\
    \ LabelledValue) {\n  console.log(labelledObj.label);\n}\n\nlet myObj = {size:\
    \ 10, label: \"Size 10 Object\"};\nprintLabel(myObj);\n```\n\nThe compiler checks\
    \ the printLabel call. This function takes a single parameter, which requires\
