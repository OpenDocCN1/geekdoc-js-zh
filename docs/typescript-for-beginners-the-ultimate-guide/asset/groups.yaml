    ## TS Runtime 129


    Deno is a secure JS/TS runtime built on V8, Rust, and Tokio, providing default
    security and developer-friendly. The Deno runtime environment by Ryan Dahl (creator
    of Node.js) started developing to replace Node.js, released back in 2009, due
    to the lack of important, in his opinion, shortcomings. Ryan’s reason for thinking
    about Deno was due to several prob­lems in Node.js:


    - modular system and its distribution,

    - support for legacy APIs,

    - security issues.


    ## Main Features of Deno


    ### *Safety*


    By default, Deno prohibits sensitive actions such as reading environment variables
    or writing to the file system.


    The Deno process runs in unprivileged mode, and to access data like environment
    variables, you need to pass special flags.


    Write permission to the file system, as well as permissions related to the environment
    and network, are disabled. To allow these actions, call Deno with the --allow-write
    and --allow-net arguments.


    All interaction between the privileged Deno process and v8 is reduced to messaging
    (previously written in Go, now ported to Rust). This allows you to create a single
    point for checking all messages.


    ### *Module System*


    Forget about package.json and node_modules. When importing source files, you can
    specify either a relative or absolute path, or their full URL:


    `import { test } from "https://unpkg.com/deno_testing@0.0.5/testing.ts";`


    `import { log } from "./util.ts"`


    By default, all source files are cached. You can use the --reload argument to
    update dependencies. It works like the F5 key in the browser.


    ### TS support out of the box


    TS is supported in Deno by default. That’s it. Without any “but.” Without configurations.


    ## TypeScript for Beginners (130)


    ### Installation of Deno


    Let’s get down to business, and start with the installation, we will analyze what,
    where, how, and why it is installed.


    Using Shell (Mac, Linux):

    `curl -fsSL https://deno.land/x/install/install.sh | sh`


    PowerShell (Windows):

    `iwr https://deno.land/x/install/install.ps1 -useb | iex`


    Homebrew (Mac):

    `brew install deno`


    Chocolatey (Windows):

    `choco install deno`


    Scoop (Windows):

    `scoop install deno`


    Here I should warn you that installing with the help of package managers carries
    a danger in the form of an incomplete removal and update mechanism. It is best
    to control the versions and paths where it will be installed.


    Also, to upgrade to the current version, the Deno upgrade command is provided.


    Well, now let’s analyze the installer itself using the example of installation
    in Windows.


    ### *Installation in Windows*


    Almost everything in Deno is based on GitHub, and the installation will be made
    from it, and the latest release will be taken from it.


    In the future, to ensure the operation of Deno as a whole, the following files
    and directories will be created along the path `{username}\AppData\Local\deno`:


    - **deps:** This directory will contain all the dependencies that were ever downloaded,
    grouped by the download path, and also next to each file will be a separate metadata
    file, which specifies the response headers, from the server that was accessed
    during the build, and, of course, the URL itself. This is actually the repository
    of your dependencies, where Deno will first turn during the launch of your project.
    They can also be reloaded if necessary by adding the -r flag to the Deno run command.
    For those who are worried about lock files and cross-dependencies, this will be
    described in detail in the section “Deno functionality.”

    - **gen:** Your js-compiled TS files will be located here. This, as you probably
    already understand, provides a quick start of the application after the first
    build. Compiled projects will be located here too. For example, at the path gen/file/C/dev/my_first_project

    - **deno_history.txt:** This file contains a short-term history of entering commands
    in Deno in console mode.

    - **lib.deno.d.ts, lib.deno_runtime.d.ts:** This file contains the typings of
    Deno core itself. You will need to know about them when you try to play with different
    versions of Deno.


    ### *Internal Part*


    - **The TS layer:** Is treated as unprivileged, which has no access to the file
    system or network (since they run in V8, which is a “sandbox”). This is only possible
    by passing messages to the Rust backend, which is “privileged.” Therefore, many
    Deno APIs (especially filesystem calls) are implemented on the TS side as purely
    creating buffers for data, sending it to the Rust backend via the Rusty backend.

    - **Rusty V8:** Is a thin layer between the TS and snapshot.

    - **Tokio:** Is an asynchronous runtime for Rust.


    ## TypeScript for Beginners (132)


    ### *Safety*


    Deno is safe by default. For comparison, Node.js has full access to the system.
    To run the program without permissions, just run the command:

    `deno run main.ts`


    If your code requires permission, you will get the following error:

    `error: PermissionDenied: ...`


    Deno uses command-line options to explicitly allow various parts of the system.
    The most commonly used are:


    - environment

    - network

    - file system

    - running child processes


    ## TS Runtime (133)


    It is recommended to allow only what is necessary. For example, to allow reading
    only a certain directory, you can use the --allow-read flag, and to enable the
    network to go to certain URLs, the --allow-net flag:

    `deno run --allow-read=/path --allow-net=localhost:4545 file.ts`


    If you get tired of typing all the flags time, you can write it in the bash script
    or use the -A (--allow-all) flag, which I highly recommend. Or you will like Deno.


    ### *Strict: True by Default*


    At some point, the developers decided that this approach would ensure the reliability
    of the code. But, nevertheless, it is possible to remove it with a custom config.


    **tsconfig.json**


    Deno has a preset config by default, but you can set your own custom config, as
    in normal applications, with the exception of some options. I prefer to use decorators
    in TS, so there is no way without a custom config. Here is an example of running
    with a custom config:

    `deno run -c tsconfig.json main.ts`


    ### *Deno Modules*


    One of the main major differences between Deno and Node.js is that Deno uses the
    official ECMAScript standard, not the deprecated CommonJS. In Node.js ES modules
    only appeared at the end of 2019, with version 13.2.0, but even then, support
    remained immature, and it is still enabled by the controversial extension. mjs.
    Deno breaks out of the past, using modern web standards for its modular system.


    `import * as framework from "https://deno.land/x/alosaur/src/mod.ts"; import {assert
    } from "https://deno.land/std/testing/mod.ts";`

    '
