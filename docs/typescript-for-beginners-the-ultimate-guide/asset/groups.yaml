  - "[PAGE 174]\n\n**158**    ◾    TypeScript for Beginners\n\n• Asks the view to\
    \ visualize itself (generate the actual HTML code \n\nbased on the values in the\
    \ model)\n\n• Attaches the resulting HTML code to the DOM tree\n\nThe controller\
    \ in MVC is also responsible for the application logic. This \n\nmeans that it\
    \ can control which views are presented, when and what to do \n\nwhen certain\
    \ events occur.\n\nAs an example of what a controller might look like, let’s look\
    \ at the fol­\n\nlowing code:\n\n*class Controller {*\n\n *model: Model;* \n\n\
    \ *view : View;*\n\n *constructor() {*\n\n *this.model = new Model({Id : 1, DisplayName\
    \ : *\n\n*'firstModel'});*\n\n *this.view = new View($('#viewTemplate') *\n\n\
    *.html());* \n\n *}* \n\n *render() {* \n\n *$('#domElement').html(this.view.render\
    \ *\n\n*(this.model));*\n\n *}*\n\n *}*\n\nHere we have defined the Controller\
    \ class, which has the model and view \n\nproperties. Then our constructor function\
    \ creates an instance of the \n\nModel class with certain properties and an instance\
    \ of the View class. An \n\ninstance of the View class is created using a template\
    \ that is read from \n\nthe viewTemplate DOM element. The Controller class also\
    \ defines the \n\nrender function, which sets the actual HTML code of the DOM\
    \ element \n\nDOMElement. This HTML code is the result of calling the render func­\n\
    \ntion for the View class and passing the model for rendering.¹\n\nLet’s see how\
    \ the process itself goes:\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_174_0.png)\n\
    \nThe first flowchart shows the following steps. Step 1 leads to the controller\
    \ class. Step 2 leads to the view class from the controller class. Step 3 leads\
    \ out from the view class. The second flowchart shows the following steps. Step\
    \ 4 leads to the controller class. Step 5 leads to the model class from the controller\
    \ class. Step 6 leads to the view class from the controller class. Step 7 leads\
    \ to the model class from the view class and Step 8 leads to the view class from\
    \ the model class. Step 9 leads out from the view class. Two flowcharts show the\
    \ process from controller class to the view class. \n\n1  The image is taken from\
    \ https://habr.com/en/post/151219/."
  - "[PAGE 175]\n\nTypeScript Architecture    ◾   ** 159**\n\n1\\. When a user visits\
    \ a web resource, the initialization script creates an \n\ninstance of the application\
    \ and runs it for execution.\n\n2\\. The index action of the front controller\
    \ is executed, which generates \n\na view of the main page.\n\n3\\. The view is\
    \ displayed to the user.\n\nThe first three steps are a simple chain, without\
    \ using a model. \n\nNext is the sequence where the model is involved:\n\n4\\\
    . After the application receives a request from the user, an instance of \n\n\
    the requested controller is created and the specified action is called.\n\n5\\\
    . This action calls the methods of the model that modify it.\n\n6\\. The view\
    \ is generated (or the view is notified when the model is \n\nupdated).\n\n7\\\
    . The view requests data to be displayed.\n\n8\\. The model returns the requested\
    \ data.\n\n9\\. The view displays the results to the user.\n\nMVC FRAMEWORKS\n\
    \nOne of the most important moments in the history of TypeScript develop­\n\n\
    ment was when it was announced that the Microsoft and Google teams \n\nwere working\
    \ together on Angular 2. Angular 2 was a long-awaited \n\nupdate to the popular\
    \ Angular framework. But unfortunately, this update \n\nrequired a new set of\
    \ language features to make the Angular 2 syntax \n\ncleaner and clearer. Google\
    \ originally proposed a new language called \n\nAtScript to simplify these new\
    \ language features, which were also closely \n\nrelated to the ECMAScript 6 and\
    \ 7 offerings.\n\nAfter some time of collaboration, it was announced that all\
    \ the neces­\n\nsary features of the AtScript language would be included in TypeScript\
    \ \n\nand that Angular 2 would be written in TypeScript. This meant that the \n\
    \nvendors of the new language features (TypeScript and Microsoft) and the \n\n\
    consumers of the new language features (Angular 2 and Google) were able \n\nto\
    \ agree on the requirements and the near future of the language. From \n\nthis\
    \ cooperation, it can be understood that the TypeScript language has \n\nbeen\
    \ thoroughly studied by a well-known JavaScript development team"
