- md: "\n## 118 TypeScript for Beginners\n\nRelative imports start with `./`, `./`,\
    \ or `../`. For example:\n\n*import Entry from \"./components/Entry\";*\n\n*import\
    \ { DefaultHeaders } from \"../constants/http\";*\n\n*import \"/mod\";*\n\nAny\
    \ other import is considered nonrelative. For example:\n\n*import * as $ from\
    \ \"jQuery\";*\n\n*import { Component } from \"angular2/core\";*\n\nRelative imports\
    \ are allowed relative to the imported file and cannot be resolved by declaring\
    \ an external module. Relative imports are best used for your modules, which are\
    \ guaranteed to be in the specified location during program execution.\n\nNonrelative\
    \ imports can be resolved relative to `baseUrl` or by using path mapping, which\
    \ will be described below. It can also be resolved by external module declarations.\
    \ Use nonrelative paths when importing any external dependencies.\n\n### Module\
    \ Resolution Strategies\n\nWhen the TypeScript compiler sees a nonrelative import\
    \ path in the statement, it must find the file to import in the program, since\
    \ the import path does not provide the necessary information about where the file\
    \ is located on disk.\n\nThe TypeScript compiler uses one of the two strategies\
    \ available to it to find this file. These strategies are Classic and Node. Node\
    \ is the default strategy used by the TypeScript compiler, and most people prefer\
    \ it because most third-party modules are Node modules.\n\nThe *classic strategy*\
    \ is present in TypeScript only for backward compatibility with older versions.\
    \ This strategy only works if the TypeScript compiler detects nonrelative imports.\n\
    \nThis Node strategy comes from the standard module resolution strategy in Node.js.\
    \ This applies to both relative and nonrelative imports.\n\n#### Classic\n\nThis\
    \ strategy was previously adopted in TypeScript by default. But now it is saved\
    \ only for backward compatibility.\n\n## Modules and Namespaces\n\nRelative import\
    \ will be allowed relative to the imported file. So `import { as b } from \"./ModuleB\"\
    ` in the source file `/root/src/folder/A.ts` will search for the following files:\n\
    \n- `*/root/src/folder/moduleB.ts*`\n- `*/root/src/folder/moduleB.d.ts*`\n\nFor\
    \ nonrelative module imports, the compiler will search the directory tree for\
    \ a suitable definition file, starting with the directory containing the importing\
    \ file.\n\nFor example: Nonrelative import from *ModuleB*, such as `import { as\
    \ b } from \"ModuleB\"`, located in the source code file `/root/src/folder/A.ts`,\
    \ will search for *\"ModuleB\"* in the following locations:\n\n- `*/root/src/folder/moduleB.ts*`\n\
    - `*/root/src/folder/moduleB.d.ts*`\n- `*/root/src/moduleB.ts*`\n- `*/root/src/moduleB.d.ts*`\n\
    - `*/root/moduleB.ts*`\n- `*/root/moduleB.d.ts*`\n- `*/moduleB.ts*`\n- `*/moduleB.d.ts*`\n\
    \n#### Node\n\nThis strategy copies the behavior of a dynamic module resolution\
    \ engine Node.js. See the full description of the Node resolution algorithm in\
    \ the module documentation Node.js.\n\n### How Does Node.js Resolve Modules?\n\
    \nTo understand which way the TS compiler will go, it is important to understand\
    \ a little about the modules Node.js. Import to Node.js is executed by calling\
    \ the `require` function. Node.js will act differently depending on whether a\
    \ relative or nonrelative path is specified in `require`.\n\nUsing relative paths\
    \ is usually not difficult. For an example, let’s look at the `/root/src/ModuleA.js`,\
    \ which has the following import statement `var x = require(\"./ModuleB\");`.\
    \ Node.js allows this import in this order:\n\n1. As a file named `/root/src/ModuleB.js`,\
    \ if it exists.\n2. As the `/root/src/ModuleB` directory, if it has a package\
    \ `package.json`, which defines the \"main\" module. In our example, if Node.js\
    \ found the `/root/src/ModuleB/package.json` containing `{\"main\": \"lib/MainModule.js\"\
    }`, then it will refer to `/root/src/moduleB/lib/mainModule.js`.\n3. If the `/root/src/ModuleB`\
    \ directory contains a file named `index.js`, by default, it is assumed that it\
    \ is the main module of this directory.\n\nHowever, the resolution of nonrelative\
    \ module names is performed in a different way. Node will search for your modules\
    \ in a special directory called `node_modules`. It can be at the same level of\
    \ the directory hierarchy as the current file, or higher. Node will go up the\
    \ directory chain, looking through each `node_modules` until it finds the module\
    \ you tried to load.\n\nContinuing with our example, let’s assume that in `/root/src/ModuleA.js`\
    \ used a nonrelative path, and the import command looked like this: `var x = require(\"\
    ModuleB\");`. Node will try to resolve ModuleB to one of the following paths and\
    \ will stop at the first suitable one.\n\n- `*/root/src/node_modules/moduleB.js*`\n\
    - `*/root/src/node_modules/moduleB/package.json (if it defines the \"main\" property)*`\n\
    - `*/root/src/node_modules/moduleB/index.js*`\n- `*/root/node_modules/moduleB.js*`\n\
    - `*/root/node_modules/moduleB/package.json (if it defines the \"main\" property)*`\n\
    - `*/root/node_modules/moduleB/index.js*`\n- `*/node_modules/moduleB.js*`\n- `*/node_modules/moduleB/package.json\
    \ (if it defines the \"main\" property)*`\n- `*/node_modules/moduleB/index.js*`\n\
    \n### Additional Flags of the Module Resolution System\n\nThe initial structure\
