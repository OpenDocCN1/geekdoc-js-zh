    }\n```\n\nSince haveMuscles is not exported, it is only visible in the animalsMuscles\
    \ function from the same unconnected namespace. The doAnimalsHaveMuscles function,\
    \ although included in the combined Animal namespace, does not see the non-exported\
    \ member.\n\n## Merging Namespaces with Classes, Functions, and Enumerations\n\
    \nNamespaces are flexible enough to be combined with other types of declarations.\
    \ To do this, the namespace declaration must be placed after the declaration to\
    \ be merged with. The resulting ad will have the properties of both sources. This\
    \ feature is used in TS to model a number of techniques from JS and other programming\
    \ languages.\n\n### Merging Namespaces with Classes\n\nThis allows you to describe\
    \ nested classes.\n\n```typescript\nclass Album {\n  label: Album.AlbumLabel;\n\
    }\n\nnamespace Album {\n  export class AlbumLabel { }\n}\n```\n\nThe visibility\
    \ rules for the merged members are the same as those described in the “Merging\
    \ Namespaces” section, so AlbumClass must be exported to be visible in the merged\
    \ class. The final result is a class used from inside another class. You can also\
    \ use namespaces to add static members to existing classes.\n\nIn addition to\
    \ the nested class technique, you are probably familiar with the practice from\
    \ JS of creating a function that is then extended by adding properties to it.\
    \ In order to create such structures type-safe, TS uses ad merge:\n\n```typescript\n\
    function buildLabel(name: string): string {\n  return buildLabel.prefix + name\
    \ + buildLabel.suffix;\n}\n\nnamespace buildLabel {\n  export let suffix = \"\"\
    ;\n  export let prefix = \"Hello, \";\n}\n\nalert(buildLabel(\"Sam Smith\"));\n\
    ```\n\n### Prohibited Merges\n\nNot all merges are allowed. Currently, classes\
    \ cannot be combined with other classes or with variables.\n\nIn addition to the\
    \ traditional OO hierarchy, there is a way to create classes from reusable components\
    \ by combining simpler incomplete classes. The idea of mix-ins or traits is also\
    \ used in languages such as Scala. This approach has also gained some traction\
    \ in the JS user community.\n\nThe following code demonstrates the use of impurity\
    \ in TS. The example will be followed by a detailed explanation.\n\n```typescript\n\
    // Disposable mixin\nclass Disposable {\n  isDisposed: boolean;\n  dispose() {\n\
    \    this.isDisposed = true;\n  }\n}\n\n// Activatable mixin\nclass Activatable\
    \ {\n  isActive: boolean;\n  activate() {\n    this.isActive = true;\n  }\n  deactivate()\
    \ {\n    this.isActive = false;\n  }\n}\n\nclass SmartObject implements Disposable,\
    \ Activatable {\n  constructor() {\n    setInterval(() => console.log(this.isActive\
    \ + \" : \" + this.isDisposed), 500);\n  }\n  interact() {\n    this.activate();\n\
    \  }\n  // Disposable\n  isDisposed: boolean = false;\n  dispose: () => void;\n\
    \  // Activatable\n  isActive: boolean = false;\n  activate: () => void;\n  deactivate:\
    \ () => void;\n}\n\napplyMixins(SmartObject, [Disposable, Activatable]);\nlet\
    \ smartObj = new SmartObject();\nsetTimeout(() => smartObj.interact(), 1000);\n\
    \n////////////////////////////////////////\n// Somewhere in your dynamic library\n\
    ////////////////////////////////////////\nfunction applyMixins(derivedCtor: any,\
    \ baseCtors: any[]) {\n  baseCtors.forEach(baseCtor => {\n    Object.getOwnPropertyNames(baseCtor.prototype).forEach(name\
    \ => {\n      derivedCtor.prototype[name] = baseCtor.prototype[name];\n    });\n\
    \  });\n}\n```\n\nThe code² begins with the definition of two classes that will\
    \ be used as impurities. Each of them is aimed at demonstrating a certain activity\
    \ or opportunity. Later, we will mix them to form a new class that combines their\
    \ properties.\n\n² The codes in this chapter are derived from https://www.typescriptlang.org/docs/handbook/mixins.html.\n\
    \n```typescript\n// Disposable mixin\nclass Disposable {\n  isDisposed: boolean;\n\
    \  dispose() {\n    this.isDisposed = true;\n  }\n}\n\n// Activatable mixin\n\
    class Activatable {\n  isActive: boolean;\n  activate() {\n    this.isActive =\
    \ true;\n  }\n  deactivate() {\n    this.isActive = false;\n  }\n}\n```\n\nNext,\
    \ we will create a new class that will combine both admixtures. Let’s look at\
    \ how to achieve this:\n\n```typescript\nclass SmartObject implements Disposable,\
    \ Activatable {\n```\n\nThe first thing you might have noticed is that implements\
    \ is used instead of extends. This approach allows you to treat classes as interfaces\
    \ and use only the types Disposable and Activatable, and not their implementations.\
    \ It turns out that we will have to create the implementation in a new class.\
    \ But the problem is that this is exactly what we like to avoid using impurities.\
    \ To avoid doing implementation again, we create standin properties whose types\
    \ will be derived from the corresponding impurities. It is sufficient for the\
    \ compiler to have these elements available dynamically. This approach allows\
    \ us to take advantage of impurities but with additional burden of taking into\
    \ account:\n\n```typescript\n// Disposable\nisDisposed: boolean = false;\ndispose:\
    \ () => void;\n\n// Activatable\nisActive: boolean = false;\nactivate: () => void;\n\
    deactivate: () => void;\n```\n\nAs a result, we combine our admixtures in a class,\
    \ creating a complete implementation. Let’s write an auxiliary function designed\
    \ to create impurities. It will run through the properties of the impurities and\
    \ copy them to the target element:\n\n```typescript\napplyMixins(SmartObject,\
    \ [Disposable, Activatable]);\n\nfunction applyMixins(derivedCtor: any, baseCtors:\
    \ any[]) {\n  baseCtors.forEach(baseCtor => {\n    Object.getOwnPropertyNames(baseCtor.prototype).forEach(name\
    \ => {\n      derivedCtor.prototype[name] = baseCtor.prototype[name];\n    });\n\
    \  });\n}\n```\n\n![](img/8faa36406ac8cb2583c6e7280af6df_166_0.png)\n\n# TypeScript\
    \ Architecture\n\nAs we know, TypeScript was created by Microsoft to facilitate\
    \ the creation of large-scale JavaScript applications. Some TypeScript features,\
    \ such as modules or classes, can make it easier to build large applications,\
    \ but this is not enough. We need a strong application architecture if we want\
    \ to be successful in the long run. In this chapter, we will look at all the aspects\
    \ you need to create an application.\n\n## WHAT IS AN APPLICATION ARCHITECTURE?\n\
    \nAn application architecture is a set of methods and patterns that help developers\
    \ create structured applications. Architecture is, first of all a global thing.\
    \ Its understanding is necessary not in the context of a specific programming\
    \ language. You need to understand the key ideas in general to understand how\
    \ the benefits of using a particular architecture are achieved.\n\n## WHY DO WE\
    \ NEED ARCHITECTURE?\n\nThe architecture is needed to save time during the development\
    \ process, maintain the testability and extensibility of the system over a long\
    \ period of development. Initially, on building a good and clear architecture,\
    \ as a result we get the following advantages:\n\n- It is cheaper to maintain\
    \ the code (hence, less time and financial costs).\n- Simplify the testability\
    \ of the code (hence, you will need fewer testers and lower losses due to missed\
    \ “bugs on the prod”).\n- Accelerate the introduction of new developers into the\
    \ project.\n\nTo ensure the stable operation of complex web applications, it is\
    \ desirable to use technologies that will give the best performance and speed.\
    \ There are two ways to develop web applications: single-page applications (SPA)\
    \ and multi-page applications (MPA).\n\n## SINGLE-PAGE APPLICATION\n\nSingle-page\
    \ applications allow you to simulate the work of desktop applications. The architecture\
    \ is designed in such a way that when you go to a new page, only part of the content\
    \ is updated. This way, there is no need to re-load the same items. This is very\
    \ convenient for developers and users. For SPA development, one of the most popular\
    \ programming languages is used – JavaScript. Regardless of which structure of\
    \ the future web application you choose, pay attention to the graphics and user\
    \ interface.\n\nMain advantages of SPA:\n\n- **Performance:** Since SPA does not\
    \ update the entire page but only the necessary part, this significantly increases\
    \ the speed of work.\n- **High speed of development:** Readymade libraries and\
    \ frameworks provide powerful tools for developing web applications. Backend and\
    \ frontend developers can work on the project in parallel. Thanks to a clear separation,\
    \ they will not interfere with each other.\n- **Mobile apps:** SPA makes it easy\
    \ to develop a mobile application based on readymade code.\n\n## MULTI-PAGE ARCHITECTURE\n\
    \nMulti-page applications have a more classic architecture. Each page sends a\
    \ request to the server and completely updates all the data, even if the data\
    \ is small. Thus, performance is wasted on displaying the same elements.\n"
