    \ to its flexibility and performance. A \n\nlot of projects that were written\
    \ in JS were transferred to TS. The popular­\n\nity and relevance of the ideas\
    \ of the new language has led to the fact that a \n\nnumber of these ideas will\
    \ later become part of the new JS standard. And \n\nthe new version of one of\
    \ the most popular frameworks for web – Angular \n\n2/4/5/6 is completely written\
    \ in TS jointly by Microsoft and Google.\n\nWHY SHOULD YOU CHOOSE TS?\n\nHowever,\
    \ it would seem that there is no need for another programming \n\nlanguage for\
    \ the client side in the web environment, if traditional JS, \n\nwhich is used\
    \ on almost every site, which is owned by many developers \n\nand whose support\
    \ in the programming community is quite high, also \n\ncopes with all the same\
    \ work. But TS is not just a new JS.\n\nFirst, it should be noted that TS is a\
    \ strongly typed and compiled lan­\n\nguage, which may be closer to programmers\
    \ of Java, C#, and other strongly \n\ntyped languages, although the output of\
    \ the compiler creates the same JS, \n\nwhich is then executed by the browser.\
    \ However, strong typing reduces the \n\nnumber of potential errors that could\
    \ occur when developing in JS.\n\nSecond, TS implements many of the concepts that\
    \ are common to \n\nobject-oriented languages, such as inheritance, polymorphism,\
    \ encapsu­\n\nlation, access modifiers, and so on.\n\nThird, the potential of\
    \ TS makes it faster and easier to write large com­\n\nplex programs, and therefore\
    \ easier to maintain, develop, scale, and test \n\nthem than in standard JS.\n\
    \nFourth, TS develops as an opensource project and, like many projects, \n\nis\
    \ hosted on GitHub. Repository address – https://github.com/Microsoft/\n\nTypeScript.\
    \ In addition, it is cross-platform, which means that we can use \n\nboth Windows\
    \ and macOS or Linux for development.\n\nAt the same time, TS is a superset of\
    \ JS, which means that any JS pro­\n\ngram is a TS program. In TS, you can use\
    \ all the constructs that are used \n\nin JS – the same operators, conditional,\
    \ cyclic constructs. Moreover, the \n\nTS code is compiled in JS. Ultimately,\
    \ TS is just a tool that is designed to \n\nmake application development easier.\n\
    \nAlthough this language does not provide additional functionality in \n\nthe\
    \ runtime, it offers a number of features that help developers write more \n\n\
    reliable and easier-to-maintain code than in the case of pure JS."
  - "[PAGE 19]\n\nTypeScript    ◾   ** 3**\n\nHow Does TS Help Developers Code Easier?\n\
    \nAs its name suggests, it adds a type system to JS. If in JS the type of a \n\
    \nvariable is assigned dynamically, then in TS we have to predefine its type \n\
    \nimmediately at the time of declaration.\n\nIf we are talking about JS, then\
    \ you can first assign an integer value to a \n\nvariable, and then reassign it\
    \ to a string value.\n\n*let jsVar = 0;*\n\n*jsVar = \"js\";*\n\nIn the case of\
    \ TS, you can restrict this behavior by declaring the type for \n\nthe variable\
    \ explicitly. As a result, if you try, for example, to assign a string \n\nto\
    \ a variable of type number, an error will occur.\n\n*let tsVar: number = 0;*\n\
    \n*tsVar = \"ts\"; //error*\n\nIn fact, this is what distinguishes TS from JS.\
    \ It uses types, which allows us \n\nto avoid stupid errors in the code.\n\nHow\
    \ Exactly Does TS Improve JS?\n\nThe lack of typing cannot be called a disadvantage\
    \ of JS, but it gives pro­\n\ngrammers too much freedom, which inevitably leads\
    \ to writing code with \n\nerrors.\n\n*let aNumber = 123;aNumber = {*\n\n*name:\
    \ \"Sufyan\",*\n\n*age: 29*\n\n*}*\n\nIn the JS example above, nothing prevents\
    \ the developer from presenting \n\nthe object via the aNumber variable. This\
    \ approach, although it will not \n\ncause the program to crash, will completely\
    \ eliminate the possibility of \n\nself-documenting the code at the expense of\
    \ variable names.\n\nTS easily solves this problem by defining the type of a variable\
    \ when it is \n\ndeclared, without further assigning it to a value of another\
    \ type.\n\n*let aNumber: number = 123;*"
- md: "\n## 4 ◾ TypeScript for Beginners\n\nIf this variable is later accessed by\
    \ another developer, they can be sure \nthat its value is a number, as the name\
    \ suggests.\n\n```typescript\nfunction isEligible(personObj) {\n  return personObj.age\
    \ > 34;\n}\n\nlet john = {\n  name: \"Josh\",\n  age: 23\n};\n\nisEligible(john);\n\
    ```\n\nIn this case, the `isEligible` function expects an object with the age\
    \ \nfield. But in JS, there is no way to guarantee that the passed argument will\
    \ \nbe exactly an object, or that it will contain the age field.\n\nAgain, TS\
    \ has a solution for this.\n\n```typescript\ninterface Person {\n  name: string;\n\
    \  age: number;\n}\n\nfunction isEligible(personObj: Person) {\n  return personObj.age;\n\
    }\n\nlet john = {\n  name: \"Josh\",\n  age: 23\n};\n\nisEligible(john);\n```\n\
    \nSo far, this code may not be clear to you. But note that it guarantees that\
    \ \nthe passed variable has the type Person, which is defined at the beginning.\n\
    \nUsing TS will save you from hundreds of careless errors in the code, \nwhich\
    \ sometimes turn out to be so stupid that you want to tear your hair \nout. In\
    \ addition, your code will become better self-documented and easier \nto maintain.\n\
    \nIf you didn’t have enough auto-substitution options for JS code in the \nintegrated\
    \ development environment (IDE), then you should get \nacquainted with TS all\
    \ the more. The presence of types gives this language \nthe ability to offer more\
    \ precise substitutions in the IDE.\n\n## 5 ◾ TypeScript \n\n### TS AS COMPARED\
    \ TO JS\n\n### What Is JS?\n\nJS was introduced in 1995 as a loosely typed scripting\
    \ language developed by Netscape to add more dynamics to HTML pages. But the web\
    \ \nhas changed a lot since then. What were simple pages with a single form \n\
    in 1995 are now large and complex web applications. JS was not originally \ndesigned\
    \ for developing complex enterprise applications. Currently, \nmost browsers support\
    \ the ECMAScript 5 standard. That is, usually when \nsomeone says “JavaScript,”\
    \ he means the language of the ES5 standard, \nalthough ES5 is not the latest\
    \ version of the standard. In 2015, the 6th \nstandard ES6 was introduced, in\
    \ 2016 — ES7 or ES 2016. But not all browsers \nfully support the new features.\n\
    \nThe incompatibility problem can be solved by using transpilers such as \nBabel\
    \ or using the TS language.\n\n### TS Strengths\n\nThe main argument in favor\
    \ of TS is strict static typing. So, what is the \ndifference between static and\
    \ dynamic typing? When using static typing, \nless documentation is required,\
    \ in fact your code has better documentation. \nFor most of the code, it is very\
    \ useful that the types of arguments and \nresults of the function execution are\
    \ documented, always knowing exactly \nwhat to expect at the input and output.\n\
    \nMoreover, when you look at your old JS code, many nuances are not \nclear, you\
    \ need to study the call chain in detail to understand what type \nof result will\
    \ be returned in a certain function. Of course, you can use \nJSDoc, which allows\
    \ you to write inline documentation, but it needs to be \nconstantly updated.\
    \ When using TS, you only have one source of truth.\n\nAlso, the advantage of\
    \ static typing is the possibility of autocompletion \nin code editors. Writing\
    \ code becomes easier, because you don’t have to \nconstantly go through the documentation\
    \ and look for the name of the \nmethod you need.\n\nAlso, refactoring becomes\
    \ less painful, as the compiler will tell you if \nsomething is broken, which\
    \ will avoid runtime errors. But still there are a \ncouple of drawbacks you need\
    \ more time to learn and write code at the \ninitial stages, an additional layer\
    \ of complexity appears, freedom of thought \nis limited, you cannot just add\
    \ a property or assign a value of another type. \nStrict typing does not guarantee\
    \ that there are no errors in the program.\n\n## 6 ◾ TypeScript for Beginners\n\
    \nIf you are not familiar with TS/ES6/ES7 and you need to write a small \nweb\
    \ application from a couple of pages, the fastest way to do this is to use \n\
    regular JS (ES5). But it is also worth noting that ES5 is considered an out-dated\
    \ (deprecated) version of JS, so it is better for your project and career \nin\
    \ general to go deeper into learning the new ES6, ES7, and TS standards. \nAt\
    \ first, you will be intimidated by all these assemblers and transpilers, but\
    \ \nyour training costs will be justified if you want to stay in the trend of\
    \ web \ndevelopment. If you work in a team and you need to create a scalable product-\n\
    that will need to be supported for a long time, write it in TS. Since ES6/\nES7\
    \ now needs to be translated to ES5, you can use TS instead of Babel, so \nyou\
    \ will maintain type security and your code will work in all browsers.\n\nTS brings\
    \ many benefits to performance and developer experience. TS is not \nunique to\
    \ Angular; other environments, such as React and Vue, are starting \nto use TS\
    \ to build applications that are robust and scalable. TS was created \nto complement\
    \ JS, not replace it. In the future, they may become similar.\n\n### Syntactic\
    \ Sugar\n\nTS provides a very simple syntax for checking the type of an object.\
    \ This \nsyntax is known as syntactic sugar, or more formally, type annotation.\
    \ Consider \nthe following version of JS:\n\n```typescript\nvar test: string =\
    \ \"this is a string\";\ntest = 1; // Error: Type 'number' is not assignable to\
    \ type 'string'.\n\ntest = function(a, b) {\n  return a + b;\n}; // Error: Type\
    \ '(a: any, b: any) => any' is not assignable to type 'string'.\n```\n\n## 7 ◾\
    \ TypeScript \n\nThe first mistake is obvious. We have specified that the variable\
    \ is a string, \nand therefore trying to assign a number to it will cause an error.\
    \ The \nsecond error is similar to the first one.\n\n### TS STRUCTURE\n\nMicrosoft\
    \ designed TS with specific architectural parameters in mind, which\nallow TS\
    \ to integrate fully and easily with existing JS.\n\n- **Providing a Type Check:**\
    \ JS, being a freely typed language, is extremely\nlenient about the value assigned\
    \ to its variables, and it does not \ncreate any structural contracts between\
    \ these variables and the constructs that\nuse them. Passing a number argument\
    \ to a function that expects a string \nparameter does not generate errors in\
    \ JS at design time, but will create \nchaos at runtime when the function body\
    \ fails to use this argument correctly.\nTo avoid such problems at runtime, TS\
    \ was designed as a strongly typed\nlanguage that performs static type checking\
    \ at compile time in JS. For flexibility, the TS type-checking capability is optional;\
    \ however, most of the key\nbenefits of TS are related to type-checking – this\
    \ is the main reason for\nusing TS! For example, type-checking allows you to use\
    \ the language service\nlayer of the language to create better tools that maximize\
    \ performance and reduce errors.\n\n- **More Powerful Object-Oriented Programming:**\
    \ The syntactic sugar\nprovided by TS will significantly reduce the amount of\
    \ code while increasing\nits expressiveness. TS makes writing an object-oriented\
    \ class fast. It\nprovides us with classes, interfaces, and modules that allow\
    \ us to properly\nstructure code into encapsulated reusable structures, making\
    \ it easier to\nmaintain and scale. Inside classes, you can also specify the visibility\
    \ level\nof class properties and methods using the provided TS modifiers: public,\
    \ private, and\nprotected. There are many other abstractions that will make you,\
    \ as a\ndeveloper, more productive.\n"
  mdcn: "\n\n## 4 ◾ 入初者的 TypeScript\n\n如果该变量之后被另一个开发者访问，他们可以确定\n它的值是一个数字，正如其名称所示。\n\
    \n```typescript\nfunction isEligible(personObj) {\n  return personObj.age > 34;\n\
    }\n\nlet john = {\n  name: \"Josh\",\n  age: 23\n};\n\nisEligible(john);\n```\n\
    \n在这种情况下，`isEligible` 函数期望一个带有 `age` 字段的对象。但在 JS 中，没有办法能保证传递的参数一定是一个对象，或者该对象一定包含\
    \ `age` 字段。\n\n再次，TS 为此提供了解决方案。\n\n```typescript\ninterface Person {\n  name:\
    \ string;\n  age: number;\n}\n\nfunction isEligible(personObj: Person) {\n  return\
    \ personObj.age;\n}\n\nlet john = {\n  name: \"Josh\",\n  age: 23\n};\n\nisEligible(john);\n\
    ```\n\n到目前为止，这段代码可能对你来说并不。。但注意，它保证了传递的变量具有 `Person` 类型，该类型是在开头定义的。\n\n使用 TS 可以让你避免代码中成百上千粗心的错误，这些错误有时会愚蠢到让你想掉头发。此外，你的代码将变得更具自文档性，且更易维护。\n\
    \n如果你在集成开发环境（IDE）中为 JS 代码没有足够的自动补全选项，那么你越应该去熟悉 TS 了。类型的出现使得这种语言具有在 IDE 中提供更精确替换的能力。\n\
    \n## 5 ◾ TypeScript\n\n### TS 与 JS 的对比\n\n### 什么是 JS？\n\nJS 于 1995 年引入，由 Netscape\
    \ 开发的弱类型脚本语言，旨在为 HTML 页面增加更多动态效果。但从那时起，Web 发生了巨大的变化。1995 年只有一个表单的简单页面，现在已变成了大型复杂的\
    \ Web 应用程序。JS 设计之初并不是为了开发复杂的企业级应用。目前，大多数浏览器都支持 ECMAScript 5 标准。也就是说，通常当有人说“JavaScript”时，他指的是\
    \ ES5 标准的语言，尽管 ES5 不是该标准的最新版本。2015 年，引入了第 6 个标准 ES6；2016 年引入了 ES7 或 ES 2016。但并不是所有的浏览器都完全支持这些新特性。\n\
    \n不兼容问题可以使用像 Babel 这样的编译器或使用 TS 语言来解决。\n\n### TS 的优势\n\n支持 TS 的主要理由是严格的静态类型。那么，静态类型和动态类型之间有什么区别？使用静态类型时，需要的文档更少，事实上，你的代码拥有更好的文档。对于大多数代码，记录函数执行的参数和结果的类型非常有用的，可以始终确切地知道输入和输出预期得到什么。\n\
    \n此外，当你查看旧的 JS 代码时，许多细微之处并不清楚，你需要详细研究调用链来理解某个函数会返回什么类型的结果。当然，你可以使用 JSDoc，它允许你编写内联文档，但它需要不断更新。使用\
    \ TS 时，你只有一个“真理来源”。\n\n此外，静态类型的优势还可以在代码编辑器中实现自动补全的可能性。编写代码变得更容易了，因为你不需要不断查阅文档来寻找所需的方法名。\n\
    \n同时，重构也变得不那么痛苦了，因为编译器会告诉你哪里出问题了，从而避免运行时错误。但仍然有一些缺点需要你花更多时间来学习以及在初始阶段编写代码，出现了一层额外的复杂性，思维受到了限制，你不能简单地添加一个属性或分配另一个类型的值。严格类型并保证程序中没有错误。\n\
    \n## 6 ◾ 入初者的 TypeScript\n\n如果你不熟悉 TS/ES6/ES7 并且需要从几个页面编写一个小型 Web 应用程序，最快的方法是使用原生\
    \ JS (ES5)。但值得注意的是，ES5 被认为是过时的（已弃用的）JS 版本，因此总体对你的项目和职业生涯而言，深入学习新的 ES6、ES7 和 TS\
    \ 标准是更好的。起初，你会被所有的汇编器和编译器吓到，但如果你想跟上 Web 开发的潮流，那么你的学习成本是合理的。如果你在团队中工作，并且需要创建一个需要长期支持的可扩展产品，请用\
    \ TS 编写。由于 ES6/ES7 现在需要被翻译为 ES5，你可以使用 TS 代替 Babel，这样你就可以保持类型安全，且你的代码可以在所有浏览器中运行。\n\
    \nTS 为性能和开发者体验带来了许多益处。TS 并不是 Angular 特有的；其他环境（如 React 和 Vue）也开始使用 TS 来构建健壮且可扩展的应用。TS\
    \ 的创建是为了补充 JS 而不是取代它。未来，它们可能会变得相似。\n\n### 语法糖\n\nTS 提供了一种非常简单的语法来检查对象的类型。这种语法被称为语法糖，或者更正式地称为类型注解。考虑以下\
    \ JS 版本：\n\n```typescript\nvar test: string = \"this is a string\";\ntest = 1;\
    \ // 错误：类型 'number' 无法赋值给类型 'string'\n\ntest = function(a, b) {\n  return a +\
    \ b;\n}; // 错误：类型 '(a: any, b: any) => any' 无法赋值给类型 'string'\n```\n\n## 7 ◾ TypeScript\n\
    \n第一个错误显而易见。我们指定变量为字符串，因此尝试给它赋值数字会导致错误。第二个错误与第一个相似。\n\n### TS 结构\n\nMicrosoft\
    \ 设计 TS 时考虑了特定的架构参数，这些参数允许 TS 完全且容易地与现有 JS 集成。\n\n- **提供类型检查：** JS 作为一种自由类型语言，对赋值变量的值非常宽松，它没有在这些变量与使用它们的构造之间创建任何结构契约。向期望字符串参数的函数传递数字参数在\
    \ JS 的设计阶段不会产生错误，但在运行时，当函数体无法正确使用该参数时就会产生混乱。为了在运行时避免此类问题，TS 被设计为一种强类型语言，在编译 时进行静态类型检查。为了灵活，TS\
    \ 类型检查功能是可选的；然而，TS 的大多数关键优势与类型检查有关——这是使用 TS 的主要原因！例如，类型检查允许你利用语言的服务层创建更好的工具，从而最大化性能并减少错误。\n\
    \n- **更强大的面向对象编程：** TS 提供的语法糖将显著减少代码量同时增加其表现力。TS 让编写面向对象的类变得很快。它为我们提供了类、接口和模块，允许我们将代码正确封装到可重用的结构中，使其更容易维护和扩展。在类内部，你还可以使用提供的\
    \ TS 修饰符指定类属性和方法的可见性级别：public、private 和 protected。还有许多其他抽象可以让你作为开发者的效率更高。\n\n"
