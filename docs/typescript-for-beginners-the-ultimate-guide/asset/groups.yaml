- md: "\n## Modules and Namespaces 101\n\n**// index.ts file**\n\n```typescript\n\
    import {T2} from './declaration';\nimport * as declarations from './declaration';\n\
    ```\n\nIn addition, you can even declare a namespace using the export keyword.\
    \ This will limit its global scope and its use in other files will only be possible\
    \ after explicit import.\n\n**// declaration.ts file**\n```typescript\nexport\
    \ namespace Bird {\n  export class Raven {}\n  export class Owl {}\n}\n```\n\n\
    **// index.ts file**\n```typescript\nimport { Bird } from './declaration';\nconst\
    \ birdAll = [Bird.Raven, Bird.Owl];\n```\n\nIt should be noted that you should\
    \ export a namespace only when it is declared in the body of another namespace,\
    \ but you need to get to it from the program.\n\n```typescript\nnamespace NS1\
    \ {\n  export namespace NS2 {\n    export class T1 {}\n  }\n}\n```\n\n## Export\n\
    \nAny declaration (by a variable, function, class, type alias, or interface) can\
    \ be exported by adding the export keyword.\n\n**Validation.ts**\n```typescript\n\
    export interface StringValidator {\n  isAcceptable(s: string): boolean;\n}\n```\n\
    \n**ZipCodeValidator.ts**\n```typescript\nexport const numberRegexp = /^[0-9]+$/;\n\
    \nexport class ZipCodeValidator implements StringValidator {\n  isAcceptable(s:\
    \ string) {\n    return s.length === 5 && numberRegexp.test(s);\n  }\n}\n```\n\
    \n102 TypeScript for Beginners\n\n### Export Validation\n\nExport definitions\
    \ are useful when you need to rename the exported elements. Then, the above example\
    \ can be rewritten as follows:\n\n```typescript\nclass ZipCodeValidator implements\
    \ StringValidator {\n  isAcceptable(s: string) {\n    return s.length === 5 &&\
    \ numberRegexp.test(s);\n  }\n}\nexport { ZipCodeValidator };\nexport { ZipCodeValidator\
    \ as mainValidator };\n```\n\n### Reexport\n\nModules often extend other modules.\
    \ At the same time, they themselves provide access to some of the functions of\
    \ the source modules. Reexport does not perform a local import and does not create\
    \ a local variable.\n\n**ParseIntBasedZipCodeValidator.ts**\n```typescript\nexport\
    \ class ParseIntBasedZipCodeValidator {\n  isAcceptable(s: string) {\n    return\
    \ s.length === 5 && parseInt(s).toString() === s;\n  }\n}\n\n// Exports the original\
    \ validator by renaming it\nexport {ZipCodeValidator as RegExpBasedZipCodeValidator}\
    \ from \"./ZipCodeValidator\";\n```\n\nWhen using a module as a wrapper over one\
    \ or more other modules, it is possible to reexport all their export statements\
    \ at once using the export from “module” construct.\n\n**AllValidators.ts**\n\
    ```typescript\nexport * from \"./StringValidator\"; // exports the 'StringValidator'\
    \ interface\nexport * from \"./LettersOnlyValidator\"; // exports the 'LettersOnlyValidator'\
    \ class\n```\n\n103 Modules and Namespaces\n\n```typescript\nexport * from \"\
    ./ZipCodeValidator\"; // exports the 'ZipCodeValidator' class\n```\n\n## Import\n\
    \nImporting is almost as easy as exporting. To import an exported deat, use one\
    \ of the import forms below:\n\n**Importing a Single Exported Item**\n```typescript\n\
