    \ \");\n}\n```\n\nlet buildNameFun: (fname: string, ...rest: string[]) => string\
    \ = buildName;\n\n### this 关键字\n\n学习如何在 JavaScript 中正确使用 `this` 关键字是开发者的一的一种必经之路。由于\
