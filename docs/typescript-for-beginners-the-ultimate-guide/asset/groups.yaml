- md: "\nModules and Namespaces 107\n\n```javascript\nexecute: function() {\n  exports_1(\"\
    t\", t = mod_1.something + 1);\n}\n});\n```\n\n### Native ECMAScript 2015 SimpleModule.js\
    \ Modules\n\n```typescript\nimport { something } from \"./mod\";\nexport var t\
    \ = something + 1;\n```\n\nBelow, we simplified the implementation of the validator\
    \ from the previous example by reducing it to exporting a single named export\
    \ from each module.\n\nTo compile successfully, you must specify the module target\
    \ on the command line. For Node.js, used –module commonjs; for require.js —–module\
    \ amd. For example:\n\n```bash\ntsc --module commonjs Test.ts\n```\n\nAs a result\
    \ of compilation, each module becomes a separate js file. As with reference tags,\
    \ the compiler will use the import statements to find and compile the dependent\
    \ files.\n\n**Validation.ts**\n```typescript\nexport interface StringValidator\
    \ {\n  isAcceptable(s: string): boolean;\n}\n```\n\n**LettersOnlyValidator.ts**\n\
    ```typescript\nimport { StringValidator } from \"./Validation\";\nconst lettersRegexp\
    \ = /^[A-Za-z]+$/;\nexport class LettersOnlyValidator implements StringValidator\
    \ {\n  isAcceptable(s: string) {\n    return lettersRegexp.test(s);\n  }\n}\n\
    ```\n\n**ZipCodeValidator.ts**\n```typescript\nimport { StringValidator } from\
    \ \"./Validation\";\nconst numberRegexp = /^[0-9]+$/;\nexport class ZipCodeValidator\
    \ implements StringValidator {\n  isAcceptable(s: string) {\n    return s.length\
    \ === 5 && numberRegexp.test(s);\n  }\n}\n```\n\n**Test.ts**\n```typescript\n\
    import { StringValidator } from \"./Validation\";\nimport { ZipCodeValidator }\
    \ from \"./ZipCodeValidator\";\nimport { LettersOnlyValidator } from \"./LettersOnlyValidator\"\
    ;\n\n// A few test cases\nlet strings = [\"Hello\", \"98052\", \"101\"];\n\n//\
    \ Validators\nlet validators: { [s: string]: StringValidator; } = {};\n\nvalidators[\"\
    ZIP code\"] = new ZipCodeValidator();\nvalidators[\"Letters only\"] = new LettersOnlyValidator();\n\
    \n// For each row, shows whether it passed each validator\nstrings.forEach(s =>\
    \ {\n  for (let name in validators) {\n    console.log(`\"${ s }\" - ${validators[name].isAcceptable(s)\
    \ ? \"matches\" : \"does not match\"} ${name}`);\n  }\n});\n```\n\nOptional Module\
    \ Loading and Its Other Advanced Scenarios\n\nIn some cases, you may need to load\
    \ the module only under certain conditions. In TypeScript, you can use the example\
    \ below to apply this or another advanced module loading technique. This technique\
    \ can be used to directly call module loaders without losing type safety.\n\n\
    The compiler determines for each module whether it is used in the generated JavaScript.\
    \ If the module ID is only in the type descriptions and never in the expressions,\
    \ then a call to require will not be generated for this module. This omission\
    \ of unused links improves performance, and also allows you to organize the optional\
    \ loading of modules.\n\nThe main idea of the example is that the `import id =\
    \ require(\"...\")` command gives access to the types that are disclosed by this\
    \ module. As shown in the if block below, the module loader is called dynamically\
    \ (using require). Thus, the optimization of skipping unused links is applied,\
    \ which leads to loading the module only when it is needed. For this technique\
    \ to work, it is necessary that the identifier defined using import is used only\
    \ in the type description (i.e., never in a place in the code that will fall into\
    \ the final JavaScript).\n\nThe typeof keyword is used to support type security.\
    \ The typeof keyword, when used in a type description, creates a value type (the\
    \ module type in this case).\n\n**Dynamic Loading of Modules in Node.js**\n\n\
    ```typescript\ndeclare function require(moduleName: string): any;\nimport { ZipCodeValidator\
    \ as Zip } from \"./ZipCodeValidator\";\n\nif (needZipValidation) {\n  let ZipCodeValidator:\
    \ typeof Zip = require(\"./ZipCodeValidator\");\n  let validator = new ZipCodeValidator();\n\
    \  if (validator.isAcceptable(\"...\")) { /* ... */ }\n}\n```\n\nExample: dynamic\
    \ loading of modules in require.js\n\n```typescript\ndeclare function require(moduleNames:\
    \ string[], onLoad: (...args: any[]) => void): void;\nimport { ZipCodeValidator\
    \ as Zip } from \"./ZipCodeValidator\";\n\nif (needZipValidation) {\n  require([\"\
    ZipCodeValidator\"], (ZipCodeValidator: typeof Zip) => {\n    let validator =\
    \ new ZipCodeValidator();\n    if (validator.isAcceptable(\"...\")) { /* ... */\
    \ }\n  });\n}\n```\n\nExample: Dynamic loading of modules in System.js\n\n```typescript\n\
    declare const System: any;\nimport { ZipCodeValidator as Zip } from \"./ZipCodeValidator\"\
    ;\n\nif (needZipValidation) {\n  System.import(\"./ZipCodeValidator\").then((ZipCodeValidator:\
    \ typeof Zip) => {\n    let x = new ZipCodeValidator();\n    if (x.isAcceptable(\"\
    ...\")) { /* ... */ }\n  });\n}\n```\n\nWorking with Other JavaScript Libraries\
    \ To describe a library that is not written in TypeScript, you must declare the\
    \ API provided by that library. We call declarations that do not define implementations\
    \ “ambient.” They are usually set in .d.ts files. If you are familiar with C/C++,\
    \ you can think of them as header files .h. In Node.js, most tasks are performed\
    \ by loading one or more modules. We could define each module in its own .d.ts\
    \ in top-level declarations, but it is much more convenient to put definitions\
    \ of all modules in one .d.ts file. To do this, use a construct similar to external\
    \ namespaces:\n\n**node.d.ts (simplified excerpt)**\n```typescript\ndeclare module\
    \ \"url\" {\n  export interface Url {\n    protocol?: string;\n    hostname?:\
    \ string;\n    pathname?: string;\n  }\n  export function parse(urlStr: string,\
    \ queryString?): Url;\n}\n\ndeclare module \"path\" {\n  export function normalize(p:\
    \ string): string;\n  export function join(...paths: any[]): string;\n  export\
    \ var sep: string;\n}\n```\n\nNow we can specify `<reference node.d.ts>` and load\
    \ modules using `import url = require(\"url\");`.\n\n```typescript\n/// <reference\
    \ path=\"node.d.ts\">\nimport as URL from \"url\";\nlet myUrl = URL.parse(\"http://www.typescript.org\"\
    );\n```\n\nAbbreviated External Module Declaration If you don’t want to spend\
    \ time writing declarations before you start using the module, you can use a shortened\
    \ declaration.\n\n**declarations.d.ts**\n```typescript\ndeclare module \"hot-new-module\"\
    ;\n```\nAll imported elements of such a module will have the type any.\n\n```typescript\n\
    import x, {y} from \"hot-new-module\";\nx(y);\n```\n\nModule Declarations Using\
    \ Wildcard Characters Some module loaders, such as SystemJS and AMD, allow you\
    \ to import content other than JavaScript. In such cases, a prefix or suffix is\
    \ usually used to denote the special loading semantics. Module declarations using\
    \ wildcard characters can be used to organize these types of downloads.\n\n```typescript\n\
    declare module \"!text\" {\n  const content: string;\n  export default content;\n\
    }\n\n// Some这样做 иначе\ndeclare module \"json!\" {\n  const value: any;\n  export\
    \ default value;\n}\n```\n\nYou can now import elements that match \"!text\" or\
    \ \"json!\".\n\n```typescript\nimport fileContent from \"./xyz.txt!text\";\nimport\
    \ data from \"json!http://example.com/data.json\";\nconsole.log(data, fileContent);\n\
    ```\n\n**UMD MODULES** Some libraries are designed to be used with many module\
    \ loaders or no loaders at all (global variables). They are called UMD or Isomorphic\
    \ modules. You can connect such libraries either by importing them or as a global\
    \ variable. For example:\n\n**math-lib.d.ts**\n```typescript\nexport const isPrime(x:\
    \ number): boolean;\nexport as namespace mathLib;\n```\n\nYou can connect this\
    \ library inside the module by importing it:\n\n```typescript\nimport {isPrime}\
    \ from \"math-lib\";\nisPrime(2);\nmathLib.isPrime(2); // Error: unable to use\
    \ the global definition inside the module\n```\n\nYou can also connect this library\
    \ as a global variable, but this can only be done inside the script (A script\
    \ is a file without import and export commands).\n\n```typescript\nmathLib.isPrime(2);\n\
    ```\n\n**STRUCTURING MODULES**\n\n### Export as Close to the Top Level as Possible\
    \ The less problems the module users have with using the exported elements, the\
    \ better. Adding nesting levels makes the module more cumbersome, so you need\
    \ to think carefully about its structure.\n\nExporting from a namespace module\
    \ is just an example of adding an extra level of nesting. Although namespaces\
    \ can be useful, they add another layer of abstraction to modules, which can lead\
    \ to problems for users very soon and is usually not necessary.\n\nStatic methods\
    \ of exported classes cause similar problems, since the class itself adds a level\
    \ of nesting. It is acceptable to do this if you know exactly what you are doing,\
    \ and the introduction of an additional level of nesting will add expressiveness\
    \ and clearly reflect the purpose of the module. Otherwise, we recommend using\
    \ the helper function.\n\n### If You Export Only One *Class* or One *Function*,\
    \ Use Export *Default* Similar to “export as close to the top level as possible,”\
    \ using the default export makes life easier for the users of your module.\n"
