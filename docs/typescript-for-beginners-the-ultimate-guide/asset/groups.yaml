- md: "\n## TypeScript for Beginners\n\nlet result2 = buildName(\"Sam\", undefined);\
    \ // also works and returns \"Sam Smith\"\n\nlet result3 = buildName(\"Sam\",\
    \ \"Adams\", \"Sr.\"); // error, too many parameters\n\nlet result4 = buildName(\"\
    Sam\", \"Adams\"); // correct\n\nThe default parameters that follow all the required\
    \ parameters are considered optional. Just like the optional ones, you can skip\
    \ them when calling the function. This means that the types of optional parameters\
    \ and default parameters that are at the end will be compatible, so this function\
    \ …\n\n```typescript\nfunction buildName(firstName: string, lastName?: string)\
    \ {\n  // ...\n}\n```\n\nAnd this\n\n```typescript\nfunction buildName(firstName:\
    \ string, lastName = \"Smith\") {\n  // ...\n}\n```\n\nwill have the same type\
    \ (firstName: string, lastName?: string) -> string. The default value for the\
    \ *lastName* parameter in the function type description disappears, leaving only\
    \ the fact that the last parameter is optional.\n\nUnlike simple optional parameters,\
    \ the default parameters do not have to be placed after the required parameters.\
    \ If the default parameter is followed by a mandatory parameter, you will have\
    \ to explicitly pass `undefined` to set the default value. For example, the last\
    \ example can be rewritten using only the default parameter for *firstName*:\n\
    \n```typescript\nfunction buildName(firstName = \"Will\", lastName: string) {\n\
    \  return firstName + \" \" + lastName;\n}\n```\n\nlet result1 = buildName(\"\
    Sam\"); // error, too few parameters\n\nlet result2 = buildName(\"Sam\", \"Adams\"\
    , \"Sr.\"); // error, too many parameters\n\nlet result3 = buildName(\"Sam\",\
    \ \"Adams\"); // works and returns \"Bob Adams\"\n\nlet result4 = buildName(undefined,\
    \ \"Adams\"); // works and returns \"Will Adams\"\n\n### Rest Parameters\n\nMandatory,\
    \ optional, and default parameters have one thing in common – they describe one\
    \ parameter at a time. In some cases, you need to work with several parameters,\
    \ treating them as a group; and sometimes it is not known in advance how many\
