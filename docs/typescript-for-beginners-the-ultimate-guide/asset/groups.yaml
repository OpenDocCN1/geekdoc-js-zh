    \ the flag not only with? sign. Starting with TS 2.8, it \n\nbecame possible to\
    \ add a minus sign (-) before the character that we want \n\nto remove."
  - "[PAGE 73]\n\nKey Concepts of TS    ◾   ** 57**\n\ntype ReadonlyCar = {\n\n readonly\
    \ \\[K in keyof ICar\\]-?: ICar\\[K\\];\n\n};\n\nAs soon as we added the minus\
    \ sign, TS immediately started throwing an \n\nerror in const *ReadonlyCar*. This\
    \ is because we suddenly missed a required \n\nproperty in this new object. As\
    \ soon as we add a new *color* field, the error \n\ndisappears.\n\n*const readOnlyCar:\
    \ ReadonlyCar = {*\n\n *name: \"BMW\",*\n\n *age: 5,*\n\n *color: \"black\"*\n\
    \n*};*\n\nSince we have the flexibility with the - sign to remove flags from our\
    \ types, \n\nthe + sign has also been added to this feature. We can say more clearly\
    \ \n\nwhat we are adding and what we are removing.\n\n*type ReadonlyCar = {*\n\
    \n *+readonly \\[K in keyof ICar\\]-?: ICar\\[K\\];*\n\n*};*\n\nNow everyone is\
    \ reading this type, and it became clearer that we take \n\nthe original ICar\
    \ interface, remove all optional modifiers -? and add the \n\n+readonly flag for\
    \ all properties.\n\nType iterator modifiers are useful if:\n\n• there is an interface\
    \ that cannot be changed directly (for example, \n\nfrom the library);\n\n• there\
    \ is an interface that we want to continue using for some pur­\n\nposes, and create\
    \ a small variation of it (using modifiers) for use for \n\nother purposes;\n\n\
    • in both cases, the type iterator modifiers “follow” the form of the \n\noriginal\
    \ interface; even if the original interface changes/is changed \n\nin the future,\
    \ they will simply extend it according to the specified \n\nrules."
