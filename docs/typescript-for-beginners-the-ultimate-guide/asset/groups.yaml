    。Loader 使用路径配置来匹配模块。\n\nTypeScript 支持在 `tsconfig.json` 的 `paths` 属性中声明此类映射。这里有一个如何为\
    \ jquery 指定 `paths` 的示例：\n\n```json\n{\n  \"compilerOptions\": {\n    \"paths\"\
    : {\n      \"jquery\": [\"node_modules/dist/jquery.ts\"]\n    }\n  }\n}\n```\n\
    \n`paths` 属性允许使用更复杂的映射，包括多个路径。让我们来看一个某些模块可用而另一些位于另一个地方的配置。当你构建时，所有模块将被放置在一起。项目图可能如下：\n\
