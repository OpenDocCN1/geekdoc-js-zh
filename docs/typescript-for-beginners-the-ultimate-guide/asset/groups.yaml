    \n### 块级作用域\n\n对于使用编程语言的人来说，`var` 声明有一些奇怪的作用域规则。请看下面的示例：\n\n```javascript\nfunction\
    \ f(shouldInitialize: boolean) {\n  if (shouldInitialize) {\n    var x = 10;\n\
    \  }\n  return x;\n}\n\nf(true); // 返回 '10'\nf(false); // 返回 'undefined'\n```\n\
    \n有些人可能需要重新看这个示例。变量 x 被声明在 if 块内部，但我们可以在块外部访问它。这是因为 `var` 声明在包含它们的函数、模块、命名空间或全局作用域内的任何地方都可用，无论它们位于哪个块中。有些人将其称为\
    \ var 可见性或函数可见性。参数在函数内部也是可见的。\n\n这些作用域规则可能会导致几种类型的错误。一个令人恼的问题的问题是多次声明变量并不是错误：\n\
    \n```javascript\nfunction sumMatrix(matrix: number[]) {\n  var sum = 0;\n  for\
    \ (var i = 0; i < matrix.length; i++) {\n    var currentRow = matrix[i];\n   \
    \ for (var i = 0; i < currentRow.length; i++) {\n      sum += currentRow[i];\n\
    \    }\n  }\n  return sum;\n}\n```\n\n可能很容易看出内部的 for 循环会意外覆盖变量 i，因为 i 的作用域在 sumMatrix\
    \ 函数内部。经验丰富的开发者知道，类似的错误会溜过代码审查，并可能成为无尽烦恼的根源。\n\n### 块级作用域\n\n当使用 `let` 声明变量时，它具有块级作用域。与\
