    \ AccountingDepartment(); // OK，创建了一个非抽象类并赋值\ndepartment.\ndepartment.printName();\n\
    department.printMeeting();\ndepartment.generateReports(); // 错误：方法在声明的抽象类型上不存在\n\
    ```\n\n### 构造函数 (Constructors)\n\n在 TS 中声明一个类时，你实际上同时创建了多个声明。第一个声明是类实例类型。\n\n"
