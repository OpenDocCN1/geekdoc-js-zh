    \ _age;\n  }\n  return User;\n}());\nvar jack = new User(\"Jack\", 29);\nel.innerHTML\
    \ = \"Name: \" + jack.name + \" age: \" + jack.age;\n```\n\n**142** TypeScript\
    \ for Beginners\n\n## MERGING DECLARATIONS\n\nTS uses several unique principles\
    \ to describe JS objects at the type level. One example of such principle for\
    \ TS is \"merging.\" Understanding this mechanism works gives you an advantage\
    \ when working with existing code. Basic Concepts\n\nIn TS, a declaration creates\
    \ at least three groups:\n- Types\n- Namespaces\n- Values\n- Class\n- Enumeration\n\
    - Interface\n- Alias\n- Function\n\n### Merging Interfaces\n\nThe simplest and\
    \ perhaps commonly used type of merge is interface. At the simplest level, it\
    \ merges two declarations into a single interface. If both interfaces define the\
    \ same name, the compiler will throw an error. So, when merging interface A with\
