    \ { super(name); }*\n\n *move(distanceInMeters = 45) {*\n\n *console.log(\"Galloping...\"\
    );*\n\n *super.move(distanceInMeters);*\n\n *}*\n\n*}*\n\n \n\n*let jack = new\
    \ Frog(\"Froggy the Traveller\");*\n\n*let mrhorse: Animal = new Horse(\"MrHorse\"\
    );*\n\n \n\n*jack.move();*\n\n*mrhorse.move(34);*\n\nThis example shows the many\
    \ inheritance features of TS, the same as in \n\nother languages. Here we see\
    \ the *extends* keyword used to create a sub­\n\nclass. The Horse and Frog classes\
    \ are based on the Animal class and they \n\nget access to its features.\n\nThe\
    \ example shows how to override the methods of the base class \n\nusing the methods\
    \ that are specified in the subclass. The Frog and Horse \n\nclasses create a\
