    \nThe easiest way to set up a development environment is to use the Aurelia command-line\
    \ interface aurelia-cli, which can be installed as follows:\n\n```bash\nnpm install\
    \ aurelia-cli -g\n```\n\nAfter installation, you can call it to create a new project:\n\
