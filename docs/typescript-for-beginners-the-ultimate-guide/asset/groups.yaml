- md: "\n## 134 ◾  TypeScript for Beginners\n\nAs you probably noticed, unlike your\
    \ usual TS code, you need to specify the file extension in the paths. This has\
    \ a positive effect on the build speed of your applications. As Ryan Dahl has\
