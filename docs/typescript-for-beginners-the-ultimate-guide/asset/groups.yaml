    \ 中运行的所有内容默认与浏览器中的方式相同，Deno 从一开始就尝试确保 Deno 用户不会遇到奇怪的错误。我的意思是：\n\n*>reverse=a=>a.sort(n=>1)*\
    \ *\n\n*>reverse([1,2,3])* *\n\n*- node (10.13.0): [3,2,1]* *\n\n*- deno (0.4.0)\
