- md: "\n## Modules and Namespaces 113\n\nmodule is to place and export one specific\
    \ element, then you should seriously consider using the default export. This approach\
    \ makes both the import procedure itself and the use of imported elements a little\
    \ easier. For example:\n\n***MyClass.ts***\n```typescript\nexport default class\
    \ SomeType {\n    constructor() { ... }\n}\n```\n\n***MyFunc.ts***\n```typescript\n\
    export default function getThing() { return \"thing\"; }\n```\n\n***Consumer.ts***\n\
    ```typescript\nimport t from \"./MyClass\";\nimport f from \"./MyFunc\";\nlet\
    \ x = new t();\nconsole.log(f());\n```\n\nThis approach is optimal for users of\
    \ the module. They can give your type the most convenient name for them (t in\
    \ this case) and will be spared the unnecessary use of “through the dot” to search\
    \ for your objects.\n\n### If You Are Exporting Multiple Objects, Put Them on\
    \ the Top Level\n\n***MyThings.ts***\n```typescript\nexport class SomeType { /*\
    \ ... */ }\nexport function someFunc() { /* ... */ }\n```\n\nAccordingly, when\
    \ importing:\n\n### Explicitly Define the Imported Names\n\n***Consumer.ts***\n\
    ```typescript\nimport {SomeType, someFunc} from \"./MyThings\";\nlet x = new SomeType();\n\
    let y = someFunc();\n```\n\n### Use the Namespace Import Template When Importing\
    \ a Large Number of Items\n\n***MyLargeModule.ts***\n```typescript\nexport class\
    \ Dog { ... }\nexport class Cat { ... }\nexport class Tree { ... }\nexport class\
    \ Flower { ... }\n```\n\n114 TypeScript for Beginners\n\n***Consumer.ts***\n```typescript\n\
    import * as myLargeModule from \"./MyLargeModule.ts\";\nlet x = new myLargeModule.Dog();\n\
    ```\n\n### Namespaces\n\nWhen programmers first start using module-based code\
    \ organization, they often place exported elements in namespaces, thus creating\
    \ additional nesting levels. But the modules have their own scope, and only the\
    \ exported elements are visible from the outside. Therefore, namespaces are not\
    \ able to bring tangible benefits when working with modules.\n\nNamespaces are\
    \ convenient for grouping logically related objects and global scope types, which\
    \ is convenient for organizing code. For example, in C#, all collection types\
    \ can be found in System.Collections. By organizing types in a hierarchy of namespaces,\
    \ we make it easier for users to find them. Modules, on the contrary, in any case\
    \ already exist as files. We find them by the path and file name, respectively,\
    \ their logical organization is already present. You can create a directory /collections/generic/\
    \ that contains a list module.\n\nNamespaces are an important tool for preventing\
    \ name conflicts. For example, you can have Application.Customer.AddForm and Application.Order.AddForm\
    \ – two types with the same name but different namespaces. And with modules, there\
    \ will be no problem. There is no good reason to create two objects with the same\
    \ name inside a module. From the user’s view, he can choose any name for imported\
    \ module, so random conflicts are not possible.\n\n### Risk Indicators\n\nThe\
    \ following is a list of warning signs regarding module structuring. Once again\
    \ make sure that you are not trying to create namespaces for external modules\
    \ if any of the following statements apply to your situation:\n\n- The file contains\
    \ a single top-level declaration, export {…} (remove and move everything up a\
    \ level).\n- The file contains a single instance of export class or export function\
    \ (consider using export default).\n- Multiple files contain an identical export\
    \ Foo {at the top level (don’t count all of them joining into a single namespace!).\n\
    \n131 Modules and Namespaces 115\n\n### Loading Modules\n\nPast topics covered\
    \ how to define and import modules in TypeScript. However, native browsers do\
    \ not yet support working with modules. Maybe this feature will be implemented\
    \ in future, but at the moment you need to use special tools to load modules which\
    \ are called loaders. In this topic, we will look at loading modules using SystemJS.\n\
    \nFirst of all, it is worth noting that loading from the server is done via AJAX,\
    \ so such TypeScript application must be hosted on a web server. That is, we will\
    \ not be able to simply throw the page into web browser as for example it was\
    \ in the first topics. Therefore, first of all you need to decide on the web server.\
    \ The web server can be anything. In this case, we will use the most democratic\
    \ option - Node.js. To do this, we will only need to install it on your computer.\
    \ First of all we will determine the folder on the hard disk where project will\
    \ be located. Let’s say it will be folder C:\\typescript. And first of all we\
    \ will define the server file in it. Let it be called server.js and will have\
    \ the following code:\n\n```javascript\nvar http = require(\"http\");\nvar fs\
    \ = require(\"fs\");\nhttp.createServer(function (request, response){\n    //\
    \ getting path after the slash\n    var filePath = request.url.substr(1);\n  \
    \  // setting the default path\n    if (filePath == \"\") filePath =\"index.html\"\
    ;\n    fs.readFile(filePath, function (error, data){\n        if(error) { // if\
    \ the file is not found\n            response.StatusCode = 404;\n            response.end\
    \ (\"Not found\");\n        } else {\n            response.end(data);\n      \
    \  }\n        return;\n    })\n}).listen (3000, function(){\n```\n\n116 TypeScript\
    \ for Beginners\n\nconsole.log (\"The server is running at http://localhost:3000/\"\
    );This is the most primitive server that gives the user static files. The http.createServer\
    \ function is used to create a server, and the fs.readFile () function is used\
    \ to read and send files. The server will start at http://localhost:3000/. For\
    \ testing purposes, nothing else is needed in the snippet. But again instead of\
    \ node.js this can be any other server technology-php, asp.net, etc.\n\nLet’s\
    \ define the app directory in the project, where the TypeScript files will actually\
    \ be located. Add the file devices.ts to this directory, which will represent\
    \ the simplest module:\n\n```typescript\nexport interface Device {\n    name:\
    \ string;\n}\n\nexport class Phone implements Device {\n    name: string;\n  \
    \  constructor(n:string){\n        this.name = n;\n    }\n}\n\nexport function\
    \ Call(phone: Phone) : void {\n    console.log(\"Make a call by\", phone.name);\n\
    }\n```\n\nAnd also in the app folder, add the main application file - app.ts with\
    \ the following code:\n\n```typescript\nimport {Phone, Call as makeCall} from\
    \ \"./devices\";\nlet iphone: Phone = new Phone(\"iPhone X\");\nmakeCall(iphone);\n\
    ```\n\nThis file loads the devices module and uses the types defined in this module.\n\
    \nNow, in the root folder of the project, we will define the web page of our application-the\
    \ file index.html:\n\n```html\n<html>\n<head>\n    <meta charset=\"utf-8\" />\n\
    \    <title>TypeScript Modules</title>\n</head>\n```\n\n117 Modules and Namespaces\n\
    \n```html\n<body>\n    <h1>TypeScript Modules</h1>\n    <div id=\"content\"></div>\n\
    \    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.21.0/system.js\"\
    ></script>\n    <script>\n        SystemJS.config({\n            baseURL: \"app\"\
    ,\n            packages: {\n                \"/\": { defaultExtension: \"js\"\
    \ }\n            }\n        });\n        System.import(\"app.js\");\n    </script>\n\
    </body>\n</html>\n```\n\n### Module Resolution\n\nModule resolution is the process\
    \ used by the compiler to find out what the import command refers to. Consider\
    \ the following statement: import {a} from “ModuleA.” To check the correctness\
    \ of the use of a, the compiler must know exactly what this element is, for which\
    \ it is necessary to check the corresponding definition-ModuleA.\n\n*Relative\
    \ and Nonrelative Module Imports*\n\nModule import is allowed in different ways,\
    \ depending on whether the reference is relative or nonrelative.\n"
  mdcn: "\n\n## 模块与命名空间 113\n\n如果模块只是为了放置并导出一个特定的元素，那么你应该认真考虑使用默认导出（default export）。这种方法会让导入过程本身以及导入元素的使用都变得简单一些。例如：\n\
    \n***MyClass.ts***\n```typescript\nexport default class SomeType {\n    constructor()\
    \ { ... }\n}\n```\n\n***MyFunc.ts***\n```typescript\nexport default function getThing()\
    \ { return \"thing\"; }\n```\n\n***Consumer.ts***\n```typescript\nimport t from\
    \ \"./MyClass\";\nimport f from \"./MyFunc\";\nlet x = new t();\nconsole.log(f());\n\
    ```\n\n这种方法对于模块使用者来说是最优的。他们可以为你的类型指定一个最方便的名称（在这种情况下为 t），并且避免了不必要的“通过点号”来搜索你的对象。\n\
    \n### 如果你导出多个对象，请将它们放在顶层\n\n***MyThings.ts***\n```typescript\nexport class SomeType\
    \ { /* ... */ }\nexport function someFunc() { /* ... */ }\n```\n\n相应地，在导入时：\n\n\
    ### 显式定义导入的名称\n\n***Consumer.ts***\n```typescript\nimport {SomeType, someFunc}\
    \ from \"./MyThings\";\nlet x = new SomeType();\nlet y = someFunc();\n```\n\n\
    ### 导入大量项目时使用命名空间导入模板\n\n***MyLargeModule.ts***\n```typescript\nexport class Dog\
    \ { ... }\nexport class Cat { ... }\nexport class Tree { ... }\nexport class Flower\
    \ { ... }\n```\n\n114 初学者 TypeScript TypeScript\n\n***Consumer.ts***\n```typescript\n\
    import * as myLargeModule from \"./MyLargeModule.ts\";\nlet x = new myLargeModule.Dog();\n\
    ```\n\n### 命名空间\n\n当程序员初次使用基于模块的代码组织方式时，他们通常会将导出的元素放在命名空间中，从而创建了额外的嵌套级。但模块有自己的作用域，只有导出的元素从外部可见的。因此，在处理模块时，命名空间无法带来实质性的收益。\n\
    \n命名空间对于分组逻辑相关的对象和全局作用域类型非常方便，便于组织代码。例如，在 C# 中，所有集合类型都可以在 System.Collections 中找到。通过在命名空间的层次结构中组织类型，我们让用户更容易找到它们。相反，模块在任何情况下都已作为文件存在。我们通过路径和文件名分别找到它们，它们的逻辑组织已经存在了。你可以创建一个\
    \ `/collections/generic/` 目录，其中包含一个列表模块。\n\n命名空间是防止命名冲突的重要工具。例如，你可以拥有 Application.Customer.AddForm\
    \ 和 Application.Order.AddForm 两个名称相同但命名空间不同的类型。而在使用模块时，这没有问题。没有理由在模块内部创建两个同名的对象。从用户的角度来看，他可以为导入的模块选择任何名称，因此随机冲突是不可能发生的。\n\
    \n### 风险指标\n\n以下是关于模块结构的告警信号列表。再次确保，如果你的情况符合以下任何一点，则你不要在尝试为外部模块创建命名空间：\n\n- 文件包含单个顶层声明，`export\
    \ {…}`（移除它并将所有内容向上移动一层）。\n- 文件包含单个实例的 `export class` 或 `export function`（考虑使用\
    \ `export default`）。\n- 多个文件在顶层包含相同的 `export Foo`（但不要把所有它们都合并成单个命名空间！）。\n\n131\
    \ 模块与命名空间 115\n\n### 加载模块\n\n之前的话题涵盖了如何在 TypeScript 中定义和导入模块。然而，原生浏览器尚未支持处理模块。也许这个功能在未来会实现，但目前你需要使用特殊的加载器（loaders）工具来加载模块。在本主题中，我们将学习使用\
    \ SystemJS 加载模块。\n\n首先，值得注意的是，从服务器加载是通过 AJAX 完成的，因此此类 TypeScript 应用程序必须托管在 Web\
    \ 服务器上。这意味着，我们无法像在前面的主题中那样直接将页面丢进网络浏览器。因此，首先你需要决定 Web 服务器。Web 服务器可以是任何东西。在这种情况下，我们将使用最民主的选择\
    \ - Node.js。要做到这一点，我们只需要在计算机上安装它。首先，我们将确定硬盘上项目所在的文件夹。假设它是文件夹 `C:\\typescript`。首先，我们会在其中定义服务器文件。让它叫\
    \ `server.js` 并包含以下代码：\n\n```javascript\nvar http = require(\"http\");\nvar fs\
    \ = require(\"fs\");\nhttp.createServer(function (request, response){\n    //\
    \ 获取斜杠后的路径\n    var filePath = request.url.substr(1);\n    // 设置默认路径\n    if (filePath\
    \ == \"\") filePath =\"index.html\";\n    fs.readFile(filePath, function (error,\
    \ data){\n        if(error) { // 如果未找到文件\n            response.StatusCode = 404;\n\
    \            response.end (\"Not found\");\n        } else {\n            response.end(data);\n\
    \        }\n        return;\n    })\n}).listen (3000, function(){\n```\n\n116\
    \ 初学者 TypeScript\n\nconsole.log (\"The server is running at http://localhost:3000/\"\
    );这是一个向用户提供静态文件的最原始服务器。`http.createServer` 函数用于创建服务器，`fs.readFile()` 函数用于读取和发送文件。服务器将在\
    \ `http://localhost:3000/` 启动。为了测试，代码段中不需要其他内容。但再次，除了 node.js 之外，可以使用任何其他服务器技术\
    \ - php、asp.net 等。\n\n我们在项目中定义 `app` 目录，TypeScript 文件将实际位于。向此目录添加 `devices.ts`\
    \ 文件，它将代表最简单的模块：\n\n```typescript\nexport interface Device {\n    name: string;\n\
    }\n\nexport class Phone implements Device {\n    name: string;\n    constructor(n:string){\n\
    \        this.name = n;\n    }\n}\n\nexport function Call(phone: Phone) : void\
    \ {\n    console.log(\"Make a call by\", phone.name);\n}\n```\n\n同样在 `app` 文件夹中添加主应用程序文件\
    \ `app.ts`，代码如下：\n\n```typescript\nimport {Phone, Call as makeCall} from \"./devices\"\
    ;\nlet iphone: Phone = new Phone(\"iPhone X\");\nmakeCall(iphone);\n```\n\n此文件加载了\
    \ devices 模块并使用了该模块定义的类型。\n\n现在，在项目的根目录中，我们将定义应用程序的网页 - 文件 `index.html`：\n\n```html\n\
    <html>\n<head>\n    <meta charset=\"utf-8\" />\n    <title>TypeScript Modules</title>\n\
    </head>\n```\n\n117 模块与命名空间\n\n```html\n<body>\n    <h1>TypeScript Modules</h1>\n\
    \    <div id=\"content\"></div>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.21.0/system.js\"\
    ></script>\n    <script>\n        SystemJS.config({\n            baseURL: \"app\"\
    ,\n            packages: {\n                \"/\": { defaultExtension: \"js\"\
    \ }\n            }\n        });\n        System.import(\"app.js\");\n    </script>\n\
