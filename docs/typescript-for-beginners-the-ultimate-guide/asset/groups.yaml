    \ DOM element. The Controller class also defines the render function, which sets\
    \ the actual HTML code of the DOM element DOMElement. This HTML code is the result\
    \ of calling the render function for the View class and passing the model for\
    \ rendering.¹\n\nLet’s see how the process itself goes:\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_174_0.png)\n\
    \nThe first flowchart shows the followinging steps. Step 1 leads to the controller\
    \ class. Step 2 leads to the view class from the controller class. Step 3 leads\
    \ out from the view class. The second flowchart shows the following steps. Step\
    \ 4 leads to the controller class. Step 5 leads to the model class from the controller\
    \ class. Step 6 leads to the view class from the controller class. Step 7 leads\
    \ to the model class from the view class and Step 8 leads to the view class from\
    \ the model class. Step 9 leads out from the view class. Two flowcharts show the\
    \ process from controller class to the view class.\n\n1 The image is taken from\
    \ https://habr.com/en/post/151219/.\n\n## TypeScript Architecture\n\n1. When a\
    \ user visits a web resource, the initialization script creates an instance of\
    \ the application and runs it for execution.\n2. The index action of the front\
    \ controller is executed, which generates a view of the main page.\n3. The view\
    \ is displayed to the user.\n\nThe first three steps are a simple chain, without\
    \ using a model. Next is the sequence where the model is involved:\n\n4. After\
    \ the application receives a request from the user, an instance of the requested\
    \ controller is created and the specified action is called.\n5. This action calls\
    \ the methods of the model that modify it.\n6. The view is generated (or the view\
    \ is notified when the model is updated).\n7. The view requests data to be displayed.\n\
    8. The model returns the requested data.\n9. The view displays the results to\
    \ the user.\n\n## MVC FRAMEWORKS\n\nOne of the most important moments in the history\
    \ of TypeScript development was when it was announced that the Microsoft and Google\
    \ teams were working together on Angular 2. Angular 2 was a long-awaited update\
    \ to the popular Angular framework. But unfortunately, this update required a\
    \ new set of language features to make the Angular 2 syntax cleaner and clearer.\
    \ Google originally proposed a new language called AtScript to simplify these\
    \ new language features, which were also closely related to the ECMAScript 6 and\
    \ 7 offerings.\n\nAfter some time of collaboration, it was announced that all\
    \ the necessary features of the AtScript language would be included in TypeScript\
    \ and that Angular 2 would be written in TypeScript. This meant that the vendors\
    \ of the new language features (TypeScript and Microsoft) and the consumers of\
    \ the new language features (Angular 2 and Google) were able to agree on the requirements\
    \ and the near future of the language. From this cooperation, it can be understood\
    \ that the TypeScript language has been thoroughly studied by a well-known JavaScript\
    \ development team and has come a long way. However, Angular 2 was not the first\
    \ framework to adopt the TypeScript language. Many third-party JavaScript libraries\
    \ also offer full TypeScript support.\n\nUsing the MVC framework provides a number\
    \ of advantages like:\n\n- Separation of the various elements used to display\
    \ information to the user\n- Increased flexibility and reuse\n- A single model\
    \ can have several different views that can be used at different times\n- User\
    \ interface development activities can be undertaken by a team of specialists\n\
    - Changes to the model data can trigger events in a completely different controller,\
    \ and each component does not know about the other\n- Views can contain other\
    \ views in a nested way, thereby improving reuse\n- Changes in the behavior of\
    \ a component can be made without changing its visual representation (by changing\
    \ the controller, not the representation)\n- Fast and parallel development\n-\
    \ Testability of individual components\n\n## BACKBONE\n\nWe will start our research\
    \ on TypeScript frameworks by creating an application in Backbone. While it can\
    \ be argued that Backbone is not a TypeScript framework, we have already seen\
    \ how it can be used with TypeScript syntax. Backbone is also one of the oldest\
    \ frameworks. It’s small, light, and extremely fast. Backbone, however, requires\
    \ writing a little more code, compared to most frameworks, since it is actually\
    \ the groundwork of the MVC framework.\n\nWhen working with Backbone, it is necessary\
    \ to use a template that is read from the viewTemplate DOM element. The Controller\
    \ class also defines the render function, which sets the actual HTML code of the\
    \ DOM element DOMElement. This HTML code is the result of calling the render function\
    \ for the View class and passing the model for rendering.\n\nSetting up the environment\
    \ for Backbone is quite simple and can be done via tsc:\n\n```bash\nnpm init\n\
    npm install backbone\nnpm install bootstrap\nnpm install jbone\nnpm install @types/backbone\n\
    ```\n\n## AUREL\n\nAurelia was one of the first frameworks to offer TypeScript\
    \ integration. It is a framework that uses ECMAScript 6 to improve development.\
    \ One of the most striking features of Aurelia is the small amount of code you\
    \ need to get done. Of all the frameworks we will discuss, Aurelia is the easiest\
