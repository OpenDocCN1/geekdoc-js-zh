    uiElement.addClickListener(h.onClickBad); // 错误！\n```\n\n当指定这一点后，它显式地反映了 *onClickBad*\
    \ 必须在 `Handler` 类的实例上调用。现在 TS 将检测到 `addClickListener` 需要一个带有 *this: void* 的函数。要修复此错误，请更改\
    \ *this* 类型：\n\n```typescript\nclass Handler {\n  info: string;\n  onClickGood(this:\
    \ void, e: Event) {\n    // 你不能在这里使用这个变量\n    // 因为它是 void！\n    console.log('clicked!');\n\
    \  }\n}\nlet h = new Handler();\nuiElement.addClickListener(h.onClickGood);\n\
    ```\n\n由于 *onClickGood* 函数指定了 `this` 的类型为 `void`，因此它可以被传递给 *addClickListener*。但如果你两个者都需要，则你必须使用箭头函数：\n\
    \n```typescript\nclass Handler {\n  info: string;\n  onClickGood = (e: Event)\
    \ => {this.info = e.message}\n}\n```\n\n这将起作用，因为箭头函数不会捕获其执行时的 `this`，并且它们可以自由地传递到期望带有\
    \ *this: void* 函数的地方。这种方法的缺点是，对于每个对象都会创建一个它自己的箭头函数。另一方面，方法只创建一次，与 `Handler` 原型关联，并且该类的所有对象共用。\n\
    \n**80** 初学者学者 TypeScript 重载\n\nTS 支持函数重载，这意味着我们可以定义多个同名、但类型不同或参数数量不同的函数版本。对于重载，我们首先定义所有不包含逻辑的函数版本。然后定义一个具有通用签的函数版本，以所有之前定义的选项。在这个通用版本中，我们定义了函数的具体逻辑。\n\
    \n例如，我们需要合并两个值，但如果它们代表字符串，则拼接它们；如果是数字，则相加它们。我们可以使用以下函数：\n\n```typescript\nfunction\
    \ add(x: string, y: string): string;\nfunction add(x: number, y: number): number;\n\
    function add(x: any, y: any): any {\n  return x + y;\n}\nlet result1 = add(5,\
    \ 7);\nconsole.log(result1); // 12\nlet result2 = add(\"5\", \"7\");\nconsole.log(result2);\
    \ // 57\n```\n\n`add` 函数的版本接收两个字符串并返回一个字符串，第二个版本接收两个数字并返回一个数字。它们的共同点是一个接收类型为 `any`\
    \ 的参数并返回类型为 `any` 的结果的函数。但我们将相同的函数应用于布尔值：\n\n```typescript\nlet result3 = add(true,\
    \ false);\nconsole.log(result3);\n```\n\n我们将得到一个错误，因为两个版本的函数允许你获取两个字符串或两个数字。在这种情况下，我们需要为布尔值添加另一个版本的函数：\n\
    \n```typescript\nfunction add(x: boolean, y: boolean): boolean;\n```\n\nJavaScript\
    \ 从其本质上说是一种非常动态的语言。找到根据传递的参数返回不同类型对象的函数并不常见见。\n\n**81** TS 的核心概念\n\n```typescript\n\
    let suits = [\"hearts\", \"spades\", \"clubs\", \"diamonds\"];\n\nfunction pickCard(x):\
    \ any {\n  // 处理对象/数组？\n  // 所以，我们被给了一个牌组，我们选择了一张牌\n  if (typeof x == \"object\"\
    ) {\n    let pickedCard = Math.floor(Math.random() * x.length);\n    return pickedCard;\n\
    \  }\n  // 否则，我们给你一个选择牌的机会\n  else if (typeof x == \"number\") {\n    let pickedSuit\
    \ = Math.floor(x / 13);\n    return { suit: suits[pickedSuit], card: x % 13 };\n\
    \  }\n}\n\nlet myDeck = [{ suit: \"diamonds\", card: 2 }, { suit: \"spades\",\
    \ card: 10 }, { suit: \"hearts\", card: 4 }];\nlet pickedCard1 = myDeck[pickCard(myDeck)];\n\
    alert(\"card: \" + pickedCard1.card + \" of \" + pickedCard1.suit);\n\nlet pickedCard2\
    \ = pickCard(15);\nalert(\"card: \" + pickedCard2.card + \" of \" + pickedCard2.suit);\n\
    ```\n\n在这个示例中，`pickCard` 函数返回两个不同的内容，取决于传递它的内容。如果用户传递了一个代表牌组的对象，函数将选择其中一张牌。如果用户传递了牌牌，函数将确定他选择了哪张牌。但你如何使用类型系统来描述这种行为呢？\n\
    \n你需要为一个函数指定多个类型，创建一个重载列表。编译器在调用函数时将使用此列表进行检查。让我们创建一个重载列表，来描述 `pickCard` 函数接收和返回的内容。\n\
    \n"
