    ## 初学者级 TypeScript


    3. **基础 TS 编译器：** TS 编译器的主要任务是管理代码类型检查的底层机制，并将其转换为有效的 JS 代码。编译器使用静态代码分析来减少运行时错误的概率。代码中的拼写错误或向函数传递错误类型的参数都会导致编译器抛出错误，在我们执行代码之前警告我们某些地方出现了问题。这极具价值，因为即使有最完整的测试套集，逻辑错误和极端情况也可能导致应用程序在运行时崩溃。TS
    确保了我们在代码中创建的类型定义始终被使用。


    4. **TypeScript 独立编译器，TSC：** 独立的 TS 编译器（通常称为 tsc）是一个高级编译器，它接收一个 TS 文件（.ts）并输出一个
    JS 文件（.js）。


    5. **语言服务（Language Service）：** 该组件层位于主 TS 编译器之上，提供在 IDE 和文本编辑器工作所需的功能：语句补全、代码格式化和高亮、语法高亮等。语言服务还提供代码重构：变量重命名、调试和增量编译。


    6. **工具集成：** TS 提供了类型注解，允许 IDE 和文本编辑器执行全面的静态代码分析。这些注解允许这些工具做出智能建议，使代码更具预测性。反之，IDE
    和文本编辑器可以为 TS 代码提供更好的自动补全和重构。


    ### 基础 TS 类型


    TS 是一种静态类型语言。类型在程序执行期间不能更改。这允许你减少大量的错误，并在编译阶段识别出其中的许多错误。


    TS 有几种简单的数据类型：数字（numbers）、字符串（strings）、结构（structures）、布尔（Boolean）。它支持 JS 中可用的所有类型，并补充了方便的
    enum 类型。


    ### *Boolean*


    最基本的类型是布尔真/假，在 JS 和 TS 中被称为 Boolean。


    ```typescript

    let isEnabled = true;

    let isAlive: boolean = false;


    console.log(isEnabled);

    console.log(isAlive);

    ```


    ### *Number*


    与 Java、C# 和 C++ 等各种面向对象的语言不同，它们提供不同的数据类型（如 int、float 和 decimal）来存储数值，TS 只有一种数值数据类型，称为
    number。具有 number 数据类型的变量可以包含任何带有浮点、十六进制、二进制或八进制值的数字字面量。


    ```typescript

    let decimal: number = 6;

    let hex: number = 0xf00d;

    let binary: number = 0b1010;

    let octal: number = 0o744;

    ```


    ### *String*


    网页和服务器程序的另一个重要部分是文本数据。与其它语言一样，TS 对此类数据使用相同的“string”表示。像 JS 一样，TS 使用双引号（”）或单引号（''）来界定文本数据。


    ```typescript

    let name: string = "bob";

    name = ''smith'';

    ```


    你也可以使用模板字符串，它可以多行并包含内置表达式。这些字符串被反引号（` `）包围，内联表达式表示为 ${expr}。


    ```typescript

    let name: string = ''Gene'';

    let age: number = 37;

    let sentence: string = `Hello, my name is ${ name }. I''ll be ${age + 1} years
    old next month.`;

    ```


    此句子声明的等效写法为：


    ```typescript

    let sentence: string = "Hello, my name is " + name + "\n\n" + "I’ll be " + (age
    + 1) + " years old next month.";

    ```


    ### *Array*


    TS 像 JS 一样拥有拥有值的数组。数组类型可以通过两种方式之一定义。第一种是在 [] 之前指定数组元素的类型：


    ```typescript

    let list: number[] = [1, 2, 3];

    ```


    第二种方法是使用泛型 Array<elemType>：


    ```typescript

    let list: Array<number> = [1, 2, 3];

    ```


    ### *Tuple（元组）*


    Tuple 类型允许你声明一个具有已知固定数量元素的数组，这些元素不需要是相同类型。例如，你想拥有一个“string”和“number”的对作为元组值：


    ```typescript

    // 声明一个元组类型

    let x: [string, number];


    // 初始化

    x = ["hello", 10]; // OK


    // 错误初始化

    x = [10, "hello"]; // Error

    ```


    当通过已知索引获取一个元素时，将返回该元素的类型：


    ```typescript

    console.log(x[0].substr(1)); // OK

    console.log(x[1].substr(1)); // Error, ''number'' *没有* ''substr''

    ```


    当接收到索引超出已知范围的元素时，将返回联合类型（Union type）：


    ```typescript

    x[3] = ''world''; // OK 可以分配 string 类型 (string | number)

    console.log(x[5].toString()); // OK, ''string'' 和 ''number'' 都有 toString 方法

    x[6] = true; // Error, boolean 不是 (string | number)

    ```


    ### *Tuples Deconstruction（元组解构）*


    由于元组使用数组语法，可以通过两种方式进行解构或拆分。第一种使用简单的数组语法，如下所示：


    ```typescript

    let [t1, t2] = tupleType;

    console.log(`t1: ${t1}`);

    console.log(`t2: ${t2}`);

    ```


    在这里我们只需编写元组的每个属性。


    *(注：原文后续部分似乎存在大量逻辑重复和乱码，此处已根据语意进行整合)*


    这里我们只需编写元组的每个属性。


    （此处原文中 "deconstructed de- or disassembled" 之后的描述在原始文本中出现了大量重复且无意义的句子，译文已根据技术逻辑保持核心含义连贯。）


