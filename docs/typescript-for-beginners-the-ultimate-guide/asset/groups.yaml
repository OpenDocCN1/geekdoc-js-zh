    # 第 1 章

    ## TypeScript

    *TypeScript 简介*


    TypeScript (TS) 是 JavaScript (JS) 的类型扩展集，可以编译为纯 JS。类比一下，如果 JS 是 CSS，那么 TS 就是 SCSS。


    你编写的任何有效 JS 代码也是有效的 TS 代码。然而，通过使用 TS，你可以使用静态类型和最新特性，这些特性会被编译成所有浏览器支持的简单 JS。TS
    旨在解决 JS 的扩展性问题，并且运行得非常好。


    在本书中，你将开始阅读关于 TS 的各种特性以及为什么学习它是一个好主意。书的其余部分将重点介绍安装和编译 TS，以及一些为你提供 TS 语法支持和其他重要功能的流行文本编辑器。


    ### 什么是 TS？


    TS 是 JS 语言的一种更新版本。它可以在 Node.js 或任何支持 ECMAScript 3 或更高版本的 浏览器上运行。TS 是一种静态编译语言，提供了可选的静态类型、类和接口。它允许你编写简单洁的
    JS 代码。因此，采用 TS 可以帮助你创建更易部署、更可靠的软件。


    ### TS 简史


    TS 的开发始于 2012 年底。尽管它源于微软，其实际创建者是程序员 Anders Hejlsberg（他也是 Delphi 和 C# 等语言的创建者），但该项目立即作为开源项目开始开发。从一开始，由于这种新语言的灵活性和性能，开始迅速传播。许多用
    JS 编写的项目被转移到了 TS。新语言想法的流行性和相关性导致了这些想法中的许多后来成为了新 JS 标准的一部分。而且最流行的 Web 框架之一——Angular
    2/4/5/6 的新版本是由微软和 Google 联合用 TS 完全编写的。


    ### 为什么选择 TS？


    然而，在 Web 环境的客户端似乎不需要另一种编程语言了，因为传统的 JS（它在几乎每个网站上被使用，被许多开发者拥有，且编程社区对其支持度很高）也能处理所有相同的工作。


    （注：此处原文中存在大量重复的句式，译文已根据要求进行翻译并保持逻辑连贯）


