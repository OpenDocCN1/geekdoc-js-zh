    \  },\n});\n```\n\n*集成测试*\n\n在 Deno 上启动你的前端代码。要执行此操作，使用：\n\ndeno test\n\n*编译器\
    \ API*\n\nDeno 支持在运行时访问内置编译器。Deno 命名空间中有三个方法提供这种访问：\n\n- compile(): 这相当于于你通过 Node.js\
