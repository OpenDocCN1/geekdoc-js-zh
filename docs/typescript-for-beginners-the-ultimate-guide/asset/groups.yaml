    ## TS 运行时 129


    Deno 是一个基于 V8、Rust 和 Tokio 的安全 JS/TS 运行时，提供默认安全性且对开发者友好。由 Ryan Dahl（Node.js 的创始人）开发的
    Deno 运行时环境于 2019 年开始开发，旨在取代 Node.js，因为他认为 Node.js 缺少一些重要的改进。Ryan 考虑 Deno 的原因是
    Node.js 的几个问题：


    - 模块系统及其分发，

    - 对遗留 API 的支持，

    - 安全问题。


    ## Deno 的主要特性


    ### *安全性*


    默认情况下，Deno 禁止敏感操作，例如读取环境变量或写入文件系统。


    Deno 进程在低特权模式下运行，要访问环境变量等数据，你需要传递特殊的标志（flags）。


    对文件系统的写入权限以及与环境和网络相关的权限都是禁用的。要允许这些操作，请带上 --allow-write 和 --allow-net 参数运行 Deno。


    特权 Deno 进程与 v8 之间的所有交互都减少为消息传递（以前用 Go 编写，现在已迁移到 Rust）。这允许你创建一个单点来检查所有消息。


    ### *模块系统*


    忘记 package.json 和 node_modules 吧。在导入源文件时，你可以指定相对路径、绝对路径或它们的完整 URL：


    `import { test } from "https://unpkg.com/deno_testing@0.0.5/testing.ts";`


    `import { log } from "./util.ts"`


    默认情况下，所有源文件都会被缓存。你可以使用 --reload 参数来更新依赖。它的作用就像浏览器中的 F5 键。


    ### 开箱即用的 TS


    Deno 默认支持 TS。仅此而已。没有任何“但是”。不需要任何配置。


    ## 初学者教程 TypeScript (130)


    ### 安装 Deno


    让我们直接进入正题，从安装开始，我们将分析安装什么、在哪里、如何安装以及为什么要安装。


    使用 Shell (Mac, Linux):

    `curl -fsSL https://deno.land/x/install/install.sh | sh`


    PowerShell (Windows):

    `iwr https://deno.land/x/install/install.ps1 -useb | iex`


    Homebrew (Mac):

    `brew install deno`


    Chocolatey (Windows):

    `choco install deno`


    Scoop (Windows):

    `scoop install deno`


    在这里我应该提醒你，通过包管理器安装存在卸载不完全和更新机制不全风险。最好控制版本和安装路径。


    此外，为了升级到当前版本，提供了 Deno upgrade 命令。


    好了，现在让我们通过在 Windows 上安装的示例来分析安装程序本身。


    ### *在 Windows 上安装*


    Deno 的几乎所有内容都基于 GitHub，安装将从那里进行，最新版本也将从那里获取。


    将来，为了确保 Deno 整体运行，将在路径 `{username}\AppData\Local\deno` 下创建以下文件和目录：


    - **deps:** 此目录将包含所有下载过的依赖，并按下载路径分组，同时每个文件旁边有一个独立的元数据文件，它指定了构建期间访问的服务器的响应头，当然还有
    URL 本身。这实际上是你的依赖项仓库，Deno 在启动项目时会首先转向这里。如果有必要，可以通过在 Deno run 命令中添加 -r 标志来重新加载。对于那些担心锁文件和交叉依赖的人，将在“Deno
    功能”章节中详细描述。

    - **gen:** 你的编译后的 TS 文件将位于这里。正如你可能已经理解的，这为首次构建后的应用程序提供了快速启动。编译后的项目也会在这里。例如，在路径
    gen/file/C/dev/my_first_project

    - **deno_history.txt:** 该文件包含在控制台模式下输入 Deno 命令的短期历史。

    - **lib.deno.d.ts, lib.deno_runtime.d.ts:** 这些文件包含 Deno 自身的类型定义。当你尝试玩不同版本的 Deno
    时，需要了解它们。


    ### *内部结构*


    - **TS 层:** 被视为低特权，没有文件系统或网络访问权限（因为它们运行在 V8 中，V8 是“沙箱”）。只有通过向“特权”的 Rust 后端传递消息才能实现。因此，许多
    Deno API（尤其是文件系统调用）在 TS 端实现为仅为数据创建缓冲区，并通过 Rusty 后端发送到 Rust 后端。

    - **Rusty V8:** 是 TS 和快照之间的薄层。

    - **Tokio:** 是 Rust 的异步运行时。


    ## 初学者教程 TypeScript (132)


    ### *安全性*


    Deno 默认是安全的。相比之下，Node.js 拥有系统的完全权限。要无权限运行程序，只需运行命令：

    `deno run main.ts`


    如果你的代码需要权限，你将收到以下错误：

    `error: PermissionDenied: ...`


    Deno 使用命令行选项显式允许系统的不同部分。最常用的是：


    - environment（环境变量）

    - network（网络）

    - file system（文件系统）

    - 子进程


    ## TS 运行时 (133)


    建议只允许必要的权限。例如，要允许读取特定目录，可以使用 --allow-read 标志；要允许访问某些 URL，可以使用 --allow-net 标志：

    `deno run --allow-read=/path --allow-net=localhost:4545 file.ts`


    如果你厌倦了输入所有标志，可以写进 bash 脚本或使用 -A（允许所有）标志，我强烈推荐这样做。你会喜欢 Deno 的。


    ### *默认开启严格模式*


    在某个时刻，开发者认为这种方法可以确保代码的可靠性。但是，仍然可以通过自定义配置将其移除。


    **tsconfig.json**


    Deno 默认有一个预览配置，但你可以像普通应用程序一样设置自己的自定义配置，某些选项除外。我喜欢在 TS 中使用装饰器，所以没有自定义配置是不行的。这是一个使用自定义配置运行的示例：

    `deno run -c tsconfig.json main.ts`


    ### *Deno 模块*


    Deno 和 Node.js 之间主要区别之一是 Deno 使用官方的 ECMAScript 标准，而不是过时的 CommonJS。Node.js 的 ES
    模块直到 2019 年底 13.2.0 版本才出现，但即使如此，支持仍然不稳定，并且仍然通过具有争议的扩展名 .mjs 启用。Deno 跳别了过去，使用现代
    Web 标准构建其模块系统。


    `import * as framework from "https://deno.land/x/alosaur/src/mod.ts"; import {assert
    } from "https://deno.land/std/testing/mod.ts";`


    '
