    \ can be combined.\n\nBasic Concepts\n\nIn TS, a declaration creates entities\
    \ in at least one of three groups: \n\nnamespaces, types, or values. Namespace-creating\
    \ declarations create \n\nnamespaces that contain names that are accessible through\
    \ the dot syn­\n\ntax. The type-creating declarations create a type with the described\
    \ form \n\nthat is bound to the specified name. Finally, value-generating declarations\
    \ \n\ncreate values that are available in the generated JS code.\n\n**Declaration\
    \ Type**\n\n**Namespace**\n\n**Type**\n\n**Value**\n\nNamespace\n\nX\n\nX\n\n\
