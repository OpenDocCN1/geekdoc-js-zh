    \n参数属性声明在具有可用性修饰符（readonly 或两者都有）的构造函数参数之前。使用 private 参数属性会声明并初始化私有成员；public、protected\
    \ 和 readonly 也是如此。\n\n### 访问器 (Accessors - Getters/Setters)\n\nTS 支持 getters 和\
    \ setters 来拦截对对象属性的访问。这让你在与对象属性交互的时刻有更多的控制权。\n\n让我们使用 get 和 set 重写一个简单的类。首先，我们写一个不使用\
