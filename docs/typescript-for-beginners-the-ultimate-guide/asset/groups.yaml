    \ (imports './view2')\n```\n\nsrc/views 包含带有 UI 元素自定义代码的文件。generated/templates\
    \ 中的文件包含由模板生成器在构建过程中自动生成的 UI 模板绑定。在一次构建步骤中，来自 src/views 和 generated/views 的文件将被复制到项目输出结构中的相同目录中。运行时，视图期望其模板位于附近，并且可以使用相对路径\
    \ \"./template\" 进行导入。\n\n若要向编译器指示这种关系，请使用“rootDirs”。“rootDirs”定义了一个根目录（roots）列表，其内容需要被合并。继续我们的示例，tsconfig.json\
    \ 应该如下所示：\n\n```json\n{\n  \"compilerOptions\": {\n    \"rootDirs\": [\n     \
    \ \"src/views\",\n      \"generated/views\"\n    ]\n  }\n}\n```\n\n每当编译器在某个 rootDirs\
    \ 的子目录下遇到相对模块导入时，它都会尝试在 rootDirs 条目中查找该导入。\n\n### 跟踪模块解析\n\n如前所述，编译器在解析模块时具有超出当前目录的能力。这种行为可能使得诊断为什么模块未解析或解析错误变得困难。要了解模块解析的进展，你可以使用\
    \ –traceResolution 编译器键值。\n\n假设我们有一个使用 typescript 模块的简单应用程序。App.ts 包含指令 `import\
    \ * as ts from \"typescript\".`\n\n```text\ntsconfig.json\nnode_modules\n└── typescript\n\
    \    └── lib\n└──app.ts\n```\n\n使用 –traceResolution 调用编译器的结果：\n\n```text\n==========================\
    \ Resolving module 'typescript' from 'src/app.ts'.\n==========================\n\
    Module resolution kind is not specified, using 'NodeJs'.\nLoading module 'typescript'\
    \ from 'node_modules' folder.\nFile 'src/node_modules/typescript.ts' does not\
