    \ = config.width * config.width;\n  }\n  return newSquare;\n}\n\nlet mySquare\
    \ = createSquare({color: \"black\"});\n```\n\n带有可选属性的接口写法与普通接口一样，但每个可选属性的结尾都标记有\
    \ `?`。可选属性的优势在于你可以描述可能存在的属性，同时禁止使用那些不在接口中的属性。例如，如果我们在 `createSquare` 中输入颜色名称时出错，我们将收到一个告知错误的消息。\n"
