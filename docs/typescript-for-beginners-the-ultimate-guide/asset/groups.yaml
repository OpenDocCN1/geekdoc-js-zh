    \ value that is used to create a default string value that describes the object.\
    \ Called by the built-in *Object.prototype.toString* method.\n- **Symbol.unobservable:**\
    \ An object whose property names are not included in the environment.\n\n## 98\
    \ TypeScript for Beginners\n\n## 99 Modules and Namespaces\n\nModules are executed\
    \ not in the global scope but in their own scope. This means that variables, functions,\
    \ etc. declared in the module are not visible outside the module, except when\
    \ they are explicitly exported using one of export forms. Also, to use a variable,\
    \ function, class, etc. exported from another module, you need to import them\
    \ using one of import forms.\n\n### WHAT IS NAMESPACE?\n\nA namespace is a construct\
    \ that is declared using the namespace keyword and is represented in the code\
    \ by a regular object.\n\n*namespace Identifier {}*\n\nThe namespace mechanism\
    \ is a solution to collisions in the global namespace, which has come down to\
    \ our days from the time when the ECMAScript specification did not define such\
    \ a thing as modules. In simple terms, namespaces are a combination of a regular\
