    \ Directions.Right];*\n\n让我们来看另一个例子：\n\n*Const enum Directions {\n *Up\n *Down\n\
    \ *Right\n *Left\n*}\n\n## 95 TS 核心概念\n\n*function someFunc(op: Directions) {\n\
    \ *switch (op) {\n *case Directions.Up:\n * // some操作…\n *break;*\n *case Directions.Down:\n\
