    \ that it has at least the necessary properties, and their types.\n\nIt is worth\
    \ noting that type checking does not require that the properties go in a certain\
    \ order: it is only important that the necessary properties are present and have\
    \ the appropriate type.\n\nTypeScript for Beginners 36\n\n### Optional Properties\n\
    \nNot all interface properties may be required. Some exist only under certain\
    \ conditions, or none at all. Such optional properties are often found, for example,\
    \ when passing arguments to a function in the form of an object that specifies\
