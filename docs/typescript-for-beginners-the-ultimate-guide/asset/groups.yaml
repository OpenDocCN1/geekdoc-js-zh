    \ 'firstModel'});\n    this.view = new View($('#viewTemplate').html());\n  }\n\
    \n  render() {\n    $('#domElement').html(this.view.render(this.model));\n  }\n\
    }\n```\n\n在这里我们定义了 Controller 类，它具有 model 和 view 属性。然后，我们的构造函数创建了一个带有特定属性的 Model\
    \ 类实例和一个 View 类实例。View 类实例是使用从 viewTemplate DOM 元素读取的模板创建的。Controller 类还定义了 render\
    \ 函数，该函数设置了 DOM 元素 DOMElement 的实际 HTML 代码。这段 HTML 代码是调用 View 类的 render 函数并传递模型进行渲染的结果¹\n\
    \n让我们看看这个过程是如何运行的：\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_174_0.png)\n\n\
    第一个流程图显示了以下步骤。步骤 1 指向控制器类。步骤 2 从控制器类进入视图类。步骤 3 从视图类退出。第二个流程图显示了以下步骤。步骤 4 指向控制器类。步骤\
    \ 5 从控制器类进入模型类。步骤 6 从控制器类进入视图类。步骤 7 从视图类进入模型类，步骤 8 从模型类进入视图类。步骤 9 从视图类退出。两个流程图展示了从控制器类到视图类的过程。\n\
    \n1 图像取自 https://habr.com/en/post/151219/.\n\n## TypeScript 架构\n\n1. 当用户访问网络资源时，初始化脚本会创建应用程序实例并运行它。\n\
    2. 执行前端控制器的 index 动作，生成生成主页的视图。\n3. 将视图显示给用户。\n\n前三个步骤是一个简单的链，没有使用模型。接下来是涉及模型的序列：\n\
    \n4. 应用程序接收到用户请求后，将创建请求的控制器的实例并调用指定的动作。\n5. 该动作调用模型的方法来修改它。\n6. 生成视图（或在模型更新时通知视图）。\n\
    7. 视图请求要显示的数据。\n8. 模型返回请求的数据。\n9. 视图将结果显示给用户。\n\n## MVC 框架\n\nTypeScript 开发历史上的重要时刻之一是宣布微软和\
    \ Google 团队正在合作开发 Angular 2。Angular 2 是对流行的 Angular 框架期待已久的更新。但遗憾的是，这次更新需要一组新的语言特性来使\
    \ Angular 2 的语法更加简洁清晰。Google 最初提议了一种名为 AtScript 的新语言来简化这些新的语言特性，这些特性也与 ECMAScript\
    \ 6 和 7 的特性密切相关。\n\n在合作一段时间后，官方宣布 AtScript 语言的所有必要特性都将包含在 TypeScript 中，并且 Angular\
    \ 2 将使用 TypeScript 编写。这意味着新语言特性的供应商（TypeScript 和微软）与新语言特性的消费者（Angular 2 和 Google）能够对语言的需求和未来达成共识。从这种合作中可以理解，TypeScript\
    \ 语言已经过一个著名的 JavaScript 开发团队的深入研究，并走了很远。然而，Angular 2 并不是第一个采用 TypeScript 语言的框架。许多第三方\
    \ JavaScript 库也提供了 TypeScript 支持。\n\n使用 MVC 框架提供了许多优势，例如：\n\n- 将用于向用户显示信息的各种元素分离\n\
    - 增加灵活性和重用性\n- 单个模型可以有多个不同的视图，可以在不同的时间使用\n- 用户界面开发活动可以由专家团队承担\n- 模型数据的更改可以触发完全不同的控制器的事件，且每个组件互不感知\n\
    - 视图可以嵌套方式包含其他视图，从而提高重用性\n- 可以在不改变视觉表示的情况下更改组件的行为（通过更改控制器，而不是表示形式）\n- 快速且并行开发\n\
    - 单个组件的可测试性\n\n## BACKBONE\n\n我们将通过在 Backbone 中创建一个应用程序开始对 TypeScript 框架的研究。虽然有人认为\
    \ Backbone 不是一个 TypeScript 框架，但我们已经看到它可以如何与 TypeScript 语法配合。Backbone 也是最老的框架之一。它小巧、轻量且极快。然而，与大多数框架相比，Backbone\
    \ 需要编写更多的代码，因为它实际上是 MVC 框架的基础。\n\n与 Backbone 工作时，有必要使用从 viewTemplate DOM 元素读取的模板。Controller\
    \ 类还定义了 render 函数，该函数设置了 DOM 元素 DOMElement 的实际 HTML 代码。这段 HTML 代码是调用 View 类的 render\
    \ 函数并传递模型进行渲染的结果。\n\n为 Backbone 设置环境非常简单，可以通过 tsc 完成：\n\n```bash\nnpm init\nnpm\
    \ install backbone\nnpm install bootstrap\nnpm install jquery\nnpm install @types/backbone\n\
    ```\n\n## AL\n\nAurelia 是最早提供 TypeScript 集成的框架之一。它是一个使用 ECMAScript 6 来改进开发的框架。Aurelia\
    \ 最引目的特点之一是所需代码很少。在我们讨论的所有框架中，Aurelia 最容易使用且直观。没有隐藏 Bug 或特殊的解决方法。\n\n设置开发环境的最佳方法是使用\
    \ Aurelia 命令行界面 aurelia-cli，可以通过以下方式安装：\n\n```bash\nnpm install aurelia-cli -g\n\
    ```\n\n安装后，你可以调用它创建一个项目：\n\n```bash\nau new\n```\n\n你将遇到一组简单的问题，从你想使用的目录开始。下一个问题是使用\
    \ ESNext 还是 TypeScript 作为开发语言，最后一个问题是是否加载所有项目依赖。选择 TypeScript 然后选择 Yes 加载依赖。设置默认项目需要几分钟时间。之后，将根据你开始时选择的项目名称创建一个目录。\n\
    \naurelia-cli 程序有多个选项。编译你的项目，输入：\n\n```bash\nau build\n```\n\n启动 Aurelia 应用，输入：\n\
    \n```bash\nau run\n```\n\n## ANGULAR\n\nAngular 是用于创建前端 Web 应用程序的开源框架。旨在解决开发者在构建单页应用时面临的多个问题。该框架简化了应用程序的开发和测试。它实现了模型视图控制器（MVC）和模型视图视图模型（MVVM）方法。\n\
    \n自发布以来，它的生态系统超想象。现在它被誉为开发单页应用（SPA）最流行的 JS 框架，并拥有最大的开发者社区。\n\nAngular 2 带有大量功能，允许你开发从\
    \ Web 到桌面以及移动应用的所有应用程序。\n\n"
