    \ tracks type aliases for instances of other aliases. This makes the representation\
    \ of composite types readable (including in the definition file.d.ts).\n\n## THE\
    \ ABSTRACT MODIFIER IN CONSTRUCTOR SIGNATURES\n\nTypeScript allows you to mark\
