    \n### Let 关键字\n\n`let` 关键字是 JS 中的新特性。用 `let` 声明的变量只在当前（局部）作用域内可见。这避免了 JS 中的许多问题。因此，建议尽可能地使用\
    \ `let` 而不是 `var`。\n\n## TS 编译器\n\nTypeScript 编译器（也称为“tsc”）是许多与 TS 协作的包、插件和工具的基础，尽管我们并不经常直接调用\
    \ tsc，因为我们在所使用的打包器内部配置了 tsc 的行为。\n\n当我们全局安装 TS 时 `npm i -g TS`，我们会得到一个名为 `tsc`\
    \ 的工具。如果我们配合 `tsc --help` 标志运行此命令，我们将看到许多与其相关的选项。你应该关注的是示例顶部的几个例子：\n\n- *tsc hello.ts*\n\
    - *tsc --outFile file.js file.ts*\n- *tsc @args.txt*\n- *tsc --build tsconfig.json*\n\
    \n如果我们创建一个 *hello.ts* 文件，在里面写入 *const four:number = 2 + 2*，然后运行 *tsc hello.ts*，我们得到一个值为\
