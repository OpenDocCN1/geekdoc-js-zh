    \nDeno 内置了调试功能，但目前 VS Code 不支持它。要进行手动调试，你需要：\n\ndeno run --inspect\n\n*测试*\n\n\
    该库以 Go 语言的标准库为基础。因此，它是自给自足的，因为甚至测试功能也包含在标准库中。\n\n代码应该是这样的：\n\n```typescript\n\
    import {assert, assertEquals} from \"https://deno.land/std@v0.42.0/testing/asserts.ts\"\
