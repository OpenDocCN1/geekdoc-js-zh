- md: "\nTypeScript 19\n\nThe second is as-syntax:\n\n*let someValue: any = \"this\
    \ is a string\";*\n\n*let strLength: number = (someValue as string).length;*\n\
    \nThe two examples given are completely similar. To use one or the other is by-and-large\
    \ a choice of preference; however, when TS is used in conjunction with JSX, only\
    \ typecasting via syntax is allowed.\n\n### The Let Keyword\n\nThe let keyword\
    \ is new in JS. A variable declared with let will only be visible in the current\
    \ (local) scope. This avoids a lot of problems in JS. Therefore, it is recommended\
    \ to use let instead of var wherever possible.\n\n## TS Compiler\n\nThe TypeScript\
    \ compiler (also known as “tsc”) is the basis of many packages, plugins, and tools\
    \ that work with TS, although we don’t often call the tsc directly, since we configure\
    \ the behavior of the tsc inside the packers we use.\n\nWhen we install TS globally\
    \ `npm i -g TS`, we get a tool called tsc. If we run this command with the help\
    \ of `tsc --help` flag, we will see a large number of options that go with it.\
    \ The main ones that you should pay attention to are the first examples at the\
    \ top of examples:\n\n- *tsc hello.ts*\n- *tsc --outFile file.js file.ts*\n- *tsc\
    \ @args.txt*\n- *tsc --build tsconfig.json*\n\nIf we create a *hello.ts* file,\
    \ write *const four:number = 2 + 2* inside, and then run *tsc hello.ts*, we get\
    \ a compiled file *hello.js* with the value *var four = 2 + 2;*. \n\nWe will rarely\
    \ use *tsc* in this way, because *tsc* is included in plugins such as Webpack,\
    \ Parcel, and Angular CLI.\n\nInstead, we use *tsc --init*. It creates a file\
    \ in the root directory named *tsconfig.json*. It contains all the default values.\
    \ This is very convenient, because instead of defining all these parameters on\
    \ the command line when it is called, we define them in this TS configuration\
    \ file. When we run the tsc command, the compiler will take the settings from\
    \ *tsconfig.json*.\n\nAlso, we can change the configuration settings, for example,\
    \ change the value of *outDir* to `./dist`. Now all compiled files should be saved\
    \ to `./dist`. Everything defined in this file will specify which parameters the\
    \ compiler will use when compiling. When TS starts “complaining” about not using\
    \ types, you can start disabling some of these warnings.\n\n## Variable Declarations\n\
    \nLet and const are relatively new types of variable declarations in JS. mentioned\
    \ earlier, let is similar to var in some ways, but allows users to avoid some\
    \ of common errors encountered in JS. const is an extension of let that prevents\
    \ variables from being overridden. Since TS is an addon to JS, the language also\
    \ supports let and const. Next, we’ll go into more detail about these variable\
    \ declarations and explain why they are preferred over var.\n\n### var Declarations\n\
    \nThe variable declaration in JS always occurs using var. As you probably understood,\
    \ we just declared a variable with the name a and the value 10. We can also declare\
    \ a variable inside a function and we also have access to these variables inside\
    \ other functions:\n\n```javascript\nfunction f() {\n  var a = 10;\n  var message\
    \ = \"Hello, world!\";\n  return message;\n}\n\nfunction g() {\n  var a = 1;\n\
    \  var b = a + 1;\n  return b;\n}\n\nf(); // returns \"Hello, world!\"\ng(); //\
    \ returns 2\n```\n\nIn the example above, g captures (encloses) the variable a\
    \ declared in f. At any point where g is called, the value of a will be associated\
    \ with the value of a in the function. Even if g is called once and f has finished\
    \ executing, it is possible to access and modify a.\n\n```javascript\nfunction\
    \ f() {\n  var a = 10;\n  a = 2;\n  var b = g();\n  a = 3;\n  return b;\n}\n\n\
    function g() {\n  return a;\n}\n```\n\n### Scoping\n\nThe var declaration has\
    \ some strange scope rules for those using programming languages. See the following\
    \ example:\n\n```javascript\nfunction f(shouldInitialize: boolean) {\n  if (shouldInitialize)\
    \ {\n    var x = 10;\n  }\n  return x;\n}\n\nf(true); // returns '10'\nf(false);\
    \ // returns 'undefined'\n```\n\nSome may need to re-look at that example. The\
    \ variable x was declared inside the if block, and we can access it outside of\
    \ that block. This is because var declarations are available anywhere inside the\
    \ function, module, namespace, or global scope that contains them, regardless\
    \ of the block in which they are contained. Some call it var-visibility or function-visibility.\
    \ The parameters are also visible inside the function.\n\nThese scope rules can\
    \ cause several types of errors. One annoying problem is that it is not an error\
    \ to declare a variable multiple times:\n\n```javascript\nfunction sumMatrix(matrix:\
    \ number[]) {\n  var sum = 0;\n  for (var i = 0; i < matrix.length; i++) {\n \
    \   var currentRow = matrix[i];\n    for (var i = 0; i < currentRow.length; i++)\
    \ {\n      sum += currentRow[i];\n    }\n  }\n  return sum;\n}\n```\n\nIt’s probably\
    \ easy to see that the internal for loop will accidentally overwrite the variable\
    \ i, because i scope inside the sumMatrix function. Experienced developers know\
    \ that similar errors slip through code review and can be the cause of endless\
    \ frustration.\n\n### Block Scope\n\nWhen a variable is declared using let, it\
    \ is used in block scope mode. Unlike variables declared with var, whose scopes\
    \ extend to the entire function they are in, block-scoped variables are not visible\
    \ outside their nearest block or for loop.\n\n```javascript\nfunction f(input:\
    \ boolean) {\n  let a = 100;\n  if (input) {\n    // Here we see the variable\
    \ 'a'\n    let b = a + 1;\n    return b;\n  }\n  // Error: 'b' does not exist\
    \ in this block\n  return b;\n}\n```\n\nHere we have two local variables a and\
    \ b. The scope of a is bounded by the body of the function f, while the scope\
    \ of b is bounded by the if condition block. Variables declared in the catch block\
    \ have the same visibility rules.\n\n```javascript\ntry {\n  throw \"oh no!\"\
    ;\n} catch (e) {\n  console.log(\"Oh well.\");\n}\n// Error: 'e' doesn't exist\
    \ here\nconsole.log(e);\n```\n\nAnother property of block scope is that they cannot\
    \ be accessed before they are declared. While block scope variables there is a\
    \ dead zone at each point before they are declared. It’s just a way of saying\
    \ that you can’t access them before declaring it, and luckily TS will remind you\
    \ of that.\n\n```javascript\nfunction f() {\n  a++; // Error: cannot access before\
    \ initialization\n  let a;\n}\n```\n\n### Re-declaring and Escaping\n\nIn the\
    \ case of var, it doesn’t matter how many times you declare the same variable.\
    \ You’ll always get one.\n\n```javascript\nfunction f(x) {\n  var x;\n  if (true)\
    \ {\n    var x;\n  }\n}\n```\n\nIn the example above, all the declarations of\
    \ x point to the same x, and this is perfectly acceptable. This is often a source\
    \ of bugs. So, it’s a good thing that the let declarations don’t allow this.\n\
    \n```javascript\nlet x = 10;\nlet x = 20; // Error: cannot redefine 'x' in the\
    \ same scope\n```\n\nVariables don’t have to both be block-scoped in TS for the\
    \ compiler to indicate an error.\n\n```javascript\nfunction f(x) {\n  let x =\
    \ 100; // error: intersects with function parameter\n}\n\nfunction g() {\n  let\
    \ x = 100;\n  var x = 100; // error: cannot declare 'x' twice\n}\n```\n\nThis\
    \ does not mean that a variable with block scope cannot be declared with a variable\
    \ with scope in the same function. A variable with a block scope just needs to\
    \ be declared in its block.\n\n```javascript\nfunction f(condition, x) {\n  if\
    \ (condition) {\n    let x = 100;\n    return x;\n  }\n  return x;\n}\n\nf(false,\
    \ 0); // returns 0\nf(true, 0); // returns 100\n```\n\nThe method of introducing\
    \ a new name in a nested area is called hiding. This is a kind of two-bladed sword,\
    \ because it can introduce some bugs, as well as get rid of others. For example,\
    \ imagine how we could rewrite the sumMatrix function using the let variables.\n"
  mdcn: "\nTypeScript 19\n\n第二种是 as 语法：\n\n*let someValue: any = \"this is a string\"\
    ;*\n\n*let strLength: number = (someValue as string).length;*\n\n给出的这两个示例完全相似。使用其中一种还是另一种在很大程度上取决于喜好；然而，当\
    \ TS 与 JSX 配合使用时，只允许通过语法进行类型转换。\n\n### Let 关键字\n\n`let` 关键字是 JS 中的新特性。用 `let`\
    \ 声明的变量只在当前（局部）作用域内可见。这避免了 JS 中的许多问题。因此，建议尽可能地使用 `let` 而不是 `var`。\n\n## TS 编译器\n\
    \nTypeScript 编译器（也称为“tsc”）是许多与 TS 协作的包、插件和工具的基础，尽管我们并不经常直接调用 tsc，因为我们在所使用的打包器内部配置了\
    \ tsc 的行为。\n\n当我们全局安装 TS 时 `npm i -g TS`，我们会得到一个名为 `tsc` 的工具。如果我们配合 `tsc --help`\
    \ 标志运行此命令，我们将看到许多与其相关的选项。你应该关注的是示例顶部的几个例子：\n\n- *tsc hello.ts*\n- *tsc --outFile\
    \ file.js file.ts*\n- *tsc @args.txt*\n- *tsc --build tsconfig.json*\n\n如果我们创建一个\
    \ *hello.ts* 文件，在里面写入 *const four:number = 2 + 2*，然后运行 *tsc hello.ts*，我们得到一个值为\
    \ *var four = 2 + 2;* 的编译文件 *hello.js*。\n\n我们很少这样使用 *tsc*，因为 *tsc* 包含在 Webpack、Parcel\
    \ 和 Angular CLI 等插件中。\n\n相反，我们使用 *tsc --init*。它会在根目录下创建一个名为 *tsconfig.json* 的文件。它包含了所有的默认值。这非常方便，因为我们不需要在调用时在命令行上定义这些参数，而是在\
    \ TS 配置文件中定义。当我们运行 tsc 命令时，编译器将从 *tsconfig.json* 读取设置。\n\n此外，我们还可以更改配置设置，例如将 *outDir*\
    \ 的值改为 `./dist`。现在所有编译后的文件都应该保存到 `./dist`。文件中定义的所有内容都将指定编译器在编译时使用哪些参数。当 TS 开始“抱怨”没有使用类型时，你可以开始禁用其中的一些警告。\n\
    \n## 变量声明\n\n`let` 和 `const` 是 JS 中较新的变量声明类型。如前所述，`let` 在某些方面与 `var` 相似，但它允许用户避免在\
    \ JS 中遇到的一些常见错误。`const` 是 `let` 的扩展，防止变量被重写。由于 TS 是 JS 的插件，该语言也支持 `let` 和 `const`。接下来，我们将详细详细介绍这些变量声明，并解释为什么它们比\
    \ `var` 更好。\n\n### var 声明\n\nJS 中的变量声明总是使用 `var`。正如你可能已经理解到的，我们只是声明了一个名为 a 且值为\
    \ 10 的变量。我们还可以在函数内部声明变量，并且在其他函数内部也可以访问这些变量：\n\n```javascript\nfunction f() {\n\
    \  var a = 10;\n  var message = \"Hello, world!\";\n  return message;\n}\n\nfunction\
    \ g() {\n  var a = 1;\n  var b = a + 1;\n  return b;\n}\n\nf(); // 返回 \"Hello,\
    \ world!\"\ng(); // 返回 2\n```\n\n在上面的示例中，g 捕获（封闭）了在 f 中声明的变量 a。在调用 g 的任何时候，a 的值将与函数中\
    \ a 的值关联。即使 g 只被调用一次且 f 已经执行完毕，也可以访问并修改 a。\n\n```javascript\nfunction f() {\n\
    \  var a = 10;\n  a = 2;\n  var b = g();\n  a = 3;\n  return b;\n}\n\nfunction\
    \ g() {\n  return a;\n}\n```\n\n### 作用域\n\n对于使用编程语言的人来说，`var` 声明有一些奇怪的作用域规则。请看下面的示例：\n\
    \n```javascript\nfunction f(shouldInitialize: boolean) {\n  if (shouldInitialize)\
    \ {\n    var x = 10;\n  }\n  return x;\n}\n\nf(true); // 返回 '10'\nf(false); //\
    \ 返回 'undefined'\n```\n\n有些人可能需要重新这个示例。变量 x 被声明在 if 块内部，但我们可以在块外部访问它。这是因为 `var`\
    \ 声明在包含它们的函数、模块、命名空间或全局作用域内的任何地方都可用，无论它们位于哪个块中。有些人将其称为 var 可见性或函数可见性。参数在函数内部也是可见的。\n\
    \n这些作用域规则可能会导致几种类型的错误。一个令人恼的问题的问题是多次声明变量并不是错误：\n\n```javascript\nfunction sumMatrix(matrix:\
    \ number[]) {\n  var sum = 0;\n  for (var i = 0; i < matrix.length; i++) {\n \
    \   var currentRow = matrix[i];\n    for (var i = 0; i < currentRow.length; i++)\
    \ {\n      sum += currentRow[i];\n    }\n  }\n  return sum;\n}\n```\n\n可能很容易看出内部的\
