- md: "\n## 177\nAppendix\n\nTYPESCRIPT CHEAT SHEET\n\n## Types\n\n### String\n`let\
    \ customerName: string = \"John Doe\";`\n\n### Number\n`let price: number = 19.95;`\n\
    \n### Boolean\n`let shipped: boolean = false;`\n\n### Date\n`let orderDate: Date\
    \ = new Date(2017, 2, 9);`\n\n### Any\n`let something: any = \"Can be anything\"\
    ;`\n\n### Enum\n`enum Color {Red, Green, Blue};`\n\n### Array\n`let cards: string[]\
    \ = ['Visa', 'MasterCard'];`\n\n### Null\n`let orderId: number = null;`\n\n###\
    \ Tuple\n`let stateTaxRates: [string, number];`\n\n### Void\n```typescript\nfunction\
    \ log(msg: string): void {\n  console.log(msg);\n}\n```\n\n### Const\n`const lives:\
    \ number = 99;`\n\n## Usage\n\n### Installing TypeScript npm\n`npm install -g\
    \ typescript`\n\n### Compiling TypeScript\n`tsc somefile.ts`\n\n### TypeScript\
    \ Docs\n- TypeScriptLang.org\n- Type Definition Files: DefinatelyTyped.org\n\n\
    ## Scope/Modifiers\n\n### Public (default)\n`public firstName: string;`\n\n###\
    \ Protected\n`protected inventory: number;`\n\n### Private\n`private outOfStock:\
    \ boolean;`\n\n### Read Only\n`readonly pi: number = 3.14159;`\n\n### Static\n\
    `static log(msg: string) { console.log(msg) };`\n\n## 178\nAppendix\n\n### Classes\n\
    ```typescript\nclass OrderLogic {\n  constructor(public order: IOrder) { }\n \
    \ getOrderTotal(): number {\n    let sum: number = 0;\n    for (let orderDetail\
    \ of this.order.orderDetails) {\n      sum += orderDetail.price;\n    }\n    return\
    \ sum;\n  }\n}\n```\n\n### Abstract Classes\n```typescript\nabstract class Person\
    \ {\n  name: string;\n  monthlySalary: number;\n  monthlyBenefits: number;\n \
    \ abstract calcSalary(): number;\n}\n```\n\n### Interfaces\n```typescript\ninterface\
    \ IOrderDetail {\n  productName: string;\n  quantity: number;\n  price: number;\n\
    \  orderDate: Date;\n  shipped: boolean;\n  //Optional\n  outOfStock?: boolean;\n\
    \  //Method\n  calcTax: (taxRate: number) => number;\n}\n```\n\n### Inheritance\
    \ and Implementing Interfaces\n```typescript\ninterface IGPS {\n  getLocation():\
    \ number;\n}\n```\n\n## 179\nAppendix\n\n```typescript\ninterface ISelfDrive extends\
    \ IGPS {\n  drive(latitude: number, longitude: number, elevation: number): void;\n\
    }\n\nclass Vehicle {\n  make: string;\n  model: string;\n  year: number;\n}\n\n\
    class FlyingCar extends Vehicle implements ISelfDrive {\n  hasGps: boolean;\n\
    \  drive(latitude: number, longitude: number, elevation: number) {\n  }\n  getLocation():\
    \ number {\n  }\n}\n```\n\n### Optional Parameters\n```typescript\nclass Util\
    \ {\n  log(msg: string, logDate?: Date) {\n    if (logDate)\n      console.log(logDate\
    \ + ' ' + msg);\n    else\n      console.log(new Date() + ' ' + msg);\n  }\n}\n\
    ```\n\n### Rest Parameters\n```typescript\nclass Order {\n  addOrderDetails(...orderDetails:\
    \ IOrderDetail[]) {\n  }\n}\n```\n\n### Namespaces\n```typescript\nnamespace AcmeCorp.Logging\
    \ {\n  export class Logger {\n    static log(msg: string): void {\n      console.log(msg);\n\
    \    }\n  }\n}\n\n/// <reference path=\"AcmeCorp.Logging.ts\" />\n//Alias\nimport\
    \ logger = AcmeCorp.Logging.Logger;\n\nnamespace AcmeCorp.OnlineStore {\n  class\
    \ OrderLogic {\n    calcOrder(): number {\n      logger.log(\"calculating order\"\
    );\n      return 0;\n    }\n  }\n}\n```\n\n## 180\nAppendix\n\n### Triple Slash\
    \ Directives\nReference built-in types\n`/// <reference lib=\"es2016.array.include\"\
    \ />`\n`/// <reference path=\"../my_types\" />`\n\nReference other types\n`///\
