- md: "\nTypeScript 43\n\nIn the following example, the name type does not match the\
    \ string index \n\ntype, and the compiler throws an error:\n\n```typescript\n\
    interface NumberDictionary {\n  [index: string]: number;\n  length: number; //\
    \ все хорошо, length — число\n  name: string; // ошибка, the type of ’name’ \n\
    \  is not a subtype of the indexer\n}\n```\n\nIn addition, the index signature\
    \ can be made read-only to prevent assign­ment to indexes:\n\n```typescript\n\
    interface ReadonlyStringArray {\n  readonly [index: number]: string;\n}\n\nlet\
    \ myArray: ReadonlyStringArray = [\"Alice\", \"Bob\"];\nmyArray[2] = \"Mallory\"\
    ; // error!\n```\n\nYou can’t set `myArray[2]` because the index signature is\
    \ read-only.\n\n## INTEGRATED DEVELOPMENT ENVIRONMENTS\n\nAn integrated development\
    \ environment, or simply an IDE – is a tool used \n\nto develop applications in\
    \ a simple, fast, and reliable way.\n\nIn this section, we’ll take a look at working\
    \ with the TS environment so \n\nthat you can edit, compile, run, and debug your\
    \ code written in TS. TS was \n\nreleased as an open source project and includes\
    \ both a Windows variant \n\nand a Node variant. This means that the compiler\
    \ will run on Windows, \n\nLinux, macOS, and any other operating system that supports\
    \ Node. In \n\nWindows environments, you can install Visual Studio, which will\
    \ register \n\n*tsc.exe* (TS compiler) in our catalog c:\\Program Files, or you\
    \ can use Node. \n\nIn Linux and macOS environments, we will need to use Node.\n\
    \n### Node-Based Compilation\n\nThe simplest TS development environment consists\
    \ of a simple text editor \n\nand a Node-based TS compiler. Go to the Node website\
    \ and follow the \n\ninstructions for installing Node on the operating system\
    \ of your choice. \n\nOnce Node is installed, you can install TS by simply typing:\n\
    \n`npm install -g typescript`\n\n44 TypeScript for Beginners\n\nThis command calls\
    \ the Node Package Manager (npm) to install TS as a \n\nglobal module (option-g),\
    \ which will make it available regardless of which \n\ndirectory we are currently\
    \ in. After installing TS, we can display the cur­rent version of the compiler\
    \ by typing the following:\n\n`tsc –v`\n\nNow let’s create a TS file named *hello.ts*\
    \ with the following content:\n\n```typescript\nconsole.log('hello TypeScript');\n\
    ```\n\nFrom the command line, we can use TS to compile this file into a JS file\
    \ by \n\nrunning the following command:\n\n`tsc hello.ts`\n\nAs soon as the TS\
    \ compiler finishes its work, it will generate a *hello file.js* in \n\nthe current\
    \ directory. We can run this file using Node by typing:\n\n`node hello.js`\n\n\
    After that, the console will output:\n\n*hello TypeScript*\n\n### Creating a tsconfig.json\
    \ File\n\nThe TS compiler uses the tsconfig.json in the root of the project direc­t\
    \ to specify any global TS project parameters and compiler parameters. \n\nThis\
    \ means that instead of compiling our TS files one by one (specifying \n\neach\
    \ file on the command line), we can simply take the tsc from the root \n\ndirectory\
    \ of the project and TS will recursively find and compile all TS files \n\nin\
    \ the root directory and in all subdirectories. The tsconfig.json file that \n\
    \nTS needs for this can be created from the command line by simply typing:\n\n\
    `tsc –init`\n\nThe result of this command is the main tsconfig.json file:\n\n\
    ```json\n{\n  \"compilerOptions\": {\n    \"target\": \"es5\",\n    \"module\"\
    : \"commonjs\",\n    \"strict\": true,\n    \"esModuleInterop\": true\n  }\n}\n\
    ```\n\n45 TypeScript\n\nThis is a simple JSON file with a single CompilerOptions\
    \ property that \n\ndefines the compilation parameters for the project. The target\
    \ property \n\nspecifies the preferred JS output to generate, and it can be either\
    \ ES3, ES5, \n\nES6, ES2016, ES2017, or ESNext. The strict parameter is a flag\
    \ that includes \n\nall parameters of strict type checking.\n\nIt is worth mentioning\
    \ that TS allows you to use multiple tsconfig files.json in the catalog structure.\
    \ This allows different subdirectories to use \n\ndifferent compiler parameters.\n\
    \nUsing our *tsconfig.json* file, we can compile our application by simply \n\n\
    typing:\n\n`tsc`\n\nThis command will call the TS compiler using the *tsconfig.json*\
    \ file we cre­­ated and generate the file *hello.js*. Virtually any TS source\
    \ file with the \n\nextension *.ts* will generate a JS file with the *.js* extension.\n\
    \nNow, we have successfully created a simple TS development environ­ment based\
    \ on Node, with a simple text editor and command line access.\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_62_0.png)\n\
    \n47 DOI: 10.1201/9781003203728-2\n## CHAPTER 2 Key Concepts of TS\n\nTraditional\
    \ JavaScript focuses on functions and prototype-based inher­itance to create reusable\
    \ components, but this approach is quite incon­ient compared to object-oriented,\
    \ where classes exist. Starting with ECMAScript 2015, TypeScript (TS), you will\
    \ be able to create classes using this approach.\n\n### Inheritance\n\nInheritance\
    \ is another paradigm of object-oriented. Inheritance means that an object uses\
    \ its base class to get access to its features. The interface or class that inherits\
    \ from it is known as the base class, and the interface or class that inherits\
    \ from it is known as the derived class. TS uses the *extends* keyword to create\
    \ a sub­class.\n\nThe example shows how to override the methods of the base class\
    \ using the methods that are specified in the subclass. The Frog and Horse classes\
    \ create a move method that overrides the move method from the Animal class, giving\
    \ it functionality specific to each of the classes. Let’s look at the following\
    \ example:\n\n```typescript\nclass Animal {\n  name: string;\n  constructor(name:\
    \ string) {\n    this.name = name;\n  }\n  move(distanceMeters: number = 0) {\n\
    \    console.log(`${this.name} moved ${distanceMeters}m.`);\n  }\n}\n\nclass Frog\
    \ extends Animal {\n  constructor(name: string) {\n    super(name);\n  }\n  move(distanceMeters:\
    \ number = 5) {\n    console.log(\"Jumping...\");\n    super.move(distanceMeters);\n\
    \  }\n}\n\nclass Horse extends Animal {\n  constructor(name: string) {\n    super(name);\n\
    \  }\n  move(distanceMeters: number = 45) {\n    console.log(\"Galloping...\"\
    );\n    super.move(distanceMeters);\n  }\n}\n\nlet jack = new Frog(\"Froggy the\
    \ Traveller\");\nlet mrhorse: Animal = new Horse(\"MrHorse\");\n\njack.move();\n\
    mrhorse.move(34);\n```\n\nThis example shows the many inheritance features of\
    \ TS, the same as other languages. Here we see the *extends* keyword used to create\
    \ a subclass. The Horse and Frog classes are based on the Animal class and they\
    \ get access to its features. \n\nDerived classes containing constructor functions\
    \ must call super(), which will execute the constructor function of the base class.\
    \ Note that although nick is declared as Animal, its value is Horse, so when nick.move(34)\
    \ is called, the overridden method of the Horse class will be called. \n\n*Interface\
    \ Inheritance*\n\nThe following code can be an example of interface inheritance:\n\
    \n```typescript\ninterface IBase {\n  id: number | undefined;\n}\n\ninterface\
    \ IDerivedFromBase extends IBase {\n```\n"
