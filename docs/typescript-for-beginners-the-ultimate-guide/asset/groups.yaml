    \ user，它不再引用该对象了！\n```\n\n如果我们在 alert 中使用 `this.name` 而不是 `user.name`，那么这段代码就可以工作。\n\
    \n### 关键字 “this” 和箭头函数\n\n`this` 关键字是一个在函数调用时设置的变量。这是该语言一个非常强大且灵活的特性。但对于箭头函数，`this`\
