    ./ZipCodeValidator\");\n  let validator = new ZipCodeValidator();\n  if (validator.isAcceptable(\"\
    ...\")) { /* ... */ }\n}\n```\n\n示例：require.js 中的模块动态加载\n\n```typescript\ndeclare\
    \ function require(moduleNames: string[], onLoad: (...args: any[]) => void): void;\n\
    import { ZipCodeValidator as Zip } from \"./ZipCodeValidator\";\n\nif (needZipValidation)\
    \ {\n  require([\"ZipCodeValidator\"], (ZipCodeValidator: typeof Zip) => {\n \
    \   let validator = new ZipCodeValidator();\n    if (validator.isAcceptable(\"\
    ...\")) { /* ... */ }\n  });\n}\n```\n\n示例：System.js 中的模块动态加载\n\n```typescript\n\
    declare const System: any;\nimport { ZipCodeValidator as Zip } from \"./ZipCodeValidator\"\
    ;\n\nif (needZipValidation) {\n  System.import(\"./ZipCodeValidator\").then((ZipCodeValidator:\
    \ typeof Zip) => {\n    let x = new ZipCodeValidator();\n    if (x.isAcceptable(\"\
    ...\")) { /* ... */ }\n  });\n}\n```\n\n与其他 JavaScript 库工作要描述一个不是用 TypeScript\
    \ 编写的库，必须声明该库提供的 API。我们认为没有定义实现的声明是“环境（ambient）的”。它们通常设置在 `.d.ts` 文件中。如果你熟悉 C/C++，可以将它们想象成头文件\
    \ `.h`。在 Node.js 中，大多数任务是通过加载一个或多个模块完成的。我们可以在顶层声明中每个模块自己的 `.d.ts` 中定义每个模块，但将所有模块的定义放在一个\
    \ `.d.ts` 文件中要方便得多。要实现这一点，请使用类似于外部命名空间的结构：\n\n**node.d.ts (简化摘录)**\n```typescript\n\
    declare module \"url\" {\n  export interface Url {\n    protocol?: string;\n \
    \   hostname?: string;\n    pathname?: string;\n  }\n  export function parse(urlStr:\
    \ string, queryString?): Url;\n}\n\ndeclare module \"path\" {\n  export function\
    \ normalize(p: string): string;\n  export function join(...paths: any[]): string;\n\
    \  export var sep: string;\n}\n```\n\n现在我们可以指定 `<reference node.d.ts>` 并使用 `import\
    \ url = require(\"url\");` 加载模块。\n\n```typescript\n/// <reference path=\"node.d.ts\"\
    >\nimport as URL from \"url\";\nlet myUrl = URL.parse(\"http://www.typescript.org\"\
    );\n```\n\n省略外部模块声明如果你不想在开始使用模块之前花费时间编写声明，可以使用简短的声明。\n\n**declarations.d.ts**\n\
    ```typescript\ndeclare module \"hot-new-module\";\n```\n所有导入的模块元素将具有类型 `any`。\n\
    \n```typescript\nimport x, {y} from \"hot-new-module\";\nx(y);\n```\n\n使用通配符的模块声明某些模块加载器（如\
    \ SystemJS 和 AMD）允许你导入其他内容。在这种情况下，通常使用前缀或后缀来表示特殊语义。使用通配符的模块声明可以组织这些类型。\n\n```typescript\n\
    declare module \"!text\" {\n  const content: string;\n  export default content;\n\
    }\n\ndeclare module \"json!\" {\n  const value: any;\n  export default value;\n\
    }\n```\n\n现在你可以导入匹配 `!text` 或 `json!` 的元素。\n\n```typescript\nimport fileContent\
    \ from \"./xyz.txt!text\";\nimport data from \"json!http://example.com/data.json\"\
    ;\nconsole.log(data, fileContent);\n```\n\nUMD 模块某些库设计为用于许多模块加载器或没有任何加载器（全局变量）。它们被称为\
    \ UMD。你可以通过导入或作为全局变量连接这些库。例如：\n\n**math-lib.d.ts**\n```typescript\nexport const\
    \ isPrime(x: number): boolean;\nexport as namespace mathLib;\n```\n\n你可以通过导入来在模块内部连接此库：\n\
    \n```typescript\nimport {isPrime} from \"math-lib\";\nisPrime(2);\nmathLib.isPrime(2);\
    \ // 错误：无法在模块内部使用全局定义\n```\n\n你也可以作为全局连接此库，但这只能在脚本内部进行（脚本是一个没有 import 和 export\
    \ 命令的文件）。\n\n```typescript\nmathLib.isPrime(2);\n```\n\n**模块结构**\n\n### 尽可能靠近顶层导出模块用户使用导出元素时的问题越少越好。增加嵌套层会使模块变得笨拙，因此你需要仔细考虑它的结构。\n\
    \n从命名空间模块导出只是添加额外嵌套层的一个例子。虽然命名空间可能有用，但它们为模块增加了另一层抽象，这很快就会给用户带来问题，而且通常没有必要。\n\n\
    导出类的静态方法会导致类似的问题，因为类本身添加了嵌套层。如果你确切知道自己在做什么，这样做是可以的，而且额外嵌套的引入将增加表达力并清晰地反映模块的目的。否则，我们建议使用辅助函数。\n\
    \n"
