    - the result of the replacement is a relative name, we connect it with *baseUrl\
    \ ->* projectRoot/generated/folder2/file3.ts.*\n- The file is done.\n\n### Virtual\
    \ Directories with rootDirs\n\nProject source files located in different directories\
    \ are sometimes combined at compile time to generate a single output directory.\
    \ This can be thought of as creating a single “virtual” directory from a set of\
    \ source directories.\n\nUsing “rootDirs,” you can tell the compiler about the\
    \ roots that make up this “virtual” directory, allowing the compiler to allow\
    \ relative module import commands within these “virtual” directories, as if they\
    \ were combined into a single directory.\n\nFor an example, let’s look at the\
    \ following project structure:\n\n```text\nsrc\n└── views\n    ├── view1.ts (imports\
    \ './template1')\n    └── view2.ts\ngenerated\n└── templates\n    └── views\n\
    \        └── template1.ts (imports './view2')\n```\n\nsrc/views contain files\
    \ with custom code for UI elements. The files in generated/templates contain the\
    \ UI template binding that is automatically generated by the template generator\
    \ as part of build. In one build step, the files from src/views and generated/views\
    \ will be copied to the same directories in the output structure of the project.\
    \ The view at runtime expects its template to be nearby and it can be imported\
    \ using the relative path \"./template\".\n\nTo indicate this relationship to\
    \ the compiler, use “rootDirs.” “rootDirs” defines a list of root directories\
    \ (roots) whose contents need to be merged. Continuing our example, the tsconfig.json\
    \ should look like this:\n\n```json\n{\n  \"compilerOptions\": {\n    \"rootDirs\"\
    : [\n      \"src/views\",\n      \"generated/views\"\n    ]\n  }\n}\n```\n\nEach\
    \ time the compiler encounters a relative module import in a subdirectory of one\
    \ rootDirs, it tries to find that import in rootDirs entries.\n\n### Tracking\
    \ Module Resolution\n\nAs mentioned earlier, the compiler has the ability to go\
    \ beyond the current directory when resolving modules. This behavior can make\
    \ it difficult to diagnose why the module was not resolved or was resolved incorrectly.\
    \ To get an idea of how the module resolution goes, you can use –traceResolution\
    \ compiler key.\n\nSuppose we have a simple application that uses typescript module.\
    \ App.ts contains the instruction `import * as ts from \"typescript\".`\n\n```text\n\
    tsconfig.json\nnode_modules\n└── typescript\n    └── lib\n└──app.ts\n```\n\nCalling\
    \ the compiler with the –traceResolution option Results:\n\n```text\n==========================\
    \ Resolving module 'typescript' from 'src/app.ts'.\n==========================\n\
    Module resolution kind is not specified, using 'NodeJs'.\nLoading module 'typescript'\
    \ from 'node_modules' folder.\nFile 'src/node_modules/typescript.ts' does not\
