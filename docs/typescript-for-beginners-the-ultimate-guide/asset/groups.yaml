    \n// Works!\nlet Ctor: abstract new () => HasArea = Shape;\n```\n\n### Strict\
    \ Checks for the In Statement\n\nIn JavaScript, using a non-object type on the\
    \ right side of the in statement is a runtime error. The syntax check in TypeScript\
    \ 4.2 ensures that this error can be detected during development.\n\n```javascript\n\
