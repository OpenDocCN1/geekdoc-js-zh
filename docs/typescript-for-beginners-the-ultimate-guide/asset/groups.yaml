    Key Concepts of TS 67


    If the compiler cannot find the best common type, the output will be the type
    of an empty object, that is, {}. Since this type has no members, attempting to
    use any of its properties will result in an error. As a result of this inference,
    you can still use the object as if its type is unknown, and guarantee type safety
    in cases where the object type cannot be found implicitly.


    *Context Type*


    In some cases, type inference works in the “other direction” as well. This is
    called “context typing.” Contextual typing occurs when you can make a guess about
    the type of an expression based on its position. For example:


    *window.onmousedown = function(mouseEvent) {*

    *console.log(mouseEvent.button); //<- Error*

    *};*


    To find the type error in this example, the compiler first used the Window.onmousedown
    function type to infer the type of the function expression from the right side
    of the assignment. After that, it was able to output the type of the MouseEvent
    parameter. If this function expression was located where its type could not be
    inferred from the context, the type of the MouseEvent parameter would be any,
    and the compiler would not throw an error.


    If an expression whose type was inferred from the context contains an explicit
    type indication, the inferred context type is ignored. That is, if the previous
    example were written as:


    *window.onmousedown = function(MouseEvent: any) {*

    *console.log(MouseEvent.button); // <- No error is shown now*

    *};*


    The explicitly specified parameter type in the function expression will take precedence
    over the context type. For this reason, the compiler will not throw an error,
    since the context type is not applied.


    Contextual typing is used in many cases. Typically, these are arguments when calling
    functions, the right-hand side of an assignment, type checks, object members and
    array literals, and return statements.


    TypeScript for Beginners 68


    Also, the context type is used as a candidate for the best general type. For example:


    *function createZoo(): Animal[] {*

    *return [new Rhino(), new Elephant(), new Snake()];*

    *}*


    There are four candidates for the best overall type: Animal, Rhino, Elephant,
    and Snake. The algorithm for finding the best general type is able to choose Animal
    from them.


    *Anonymous Functions*


    JavaScript also has the concept of anonymous functions. These are functions that
    are defined during the operation and do not specify a function name. Consider
    the JavaScript code below:


    *var addVar = function(a,b) {*

    *return a + b;*

    *}*


    *var addVarResult = addVar(2,3);*

    *console.log("addVarResult: " + addVarResult);*


    Here, we define a function that has no name and adds two values. Since the function
    has no name, it is known as an anonymous function. This anonymous function is
    then assigned to a variable named addVar. The addVar variable can be called as
    a function with two parameters, and the return value will be the result of executing
    an anonymous function. The output of this code will be as follows:


    *addVarResult:5*


    Let’s now rewrite the previous anonymous JavaScript function in TS:


    *var addFunction = function(a:number, b:number) : number {*

    *return a + b;*

    *}*


    *var addFunctionResult = addFunction(2,3);*

    *console.log(`addFunctionResult: ${addFunctionResult}`);*


    Key Concepts of TS 69


    Here, you can see that TS allows anonymous functions in the same way as JavaScript,
    but still allows standard type annotations. The result of this code is as follows:


    *addFunctionResult: 5*


    Type Compatibility


    Type compatibility in TS is based on structural typing. Structural typing is a
    way to identify type relationships based solely on the composition of their members.
    This approach differs from nominative typing. Let’s look at the following code:


    *interface Named {

    *name: string;*

    *}*


    *class Person {

    *name: string;*

    *}*


    *let p: Named;*

    // Everything fits, since the structural type system

    p = new Person();*


    In languages like C# and Java, where the nominative type system is used, similar
    code would lead to an error, since the Person class is not explicitly described
    as implementing the Named interface.


    The TS structural type system was designed with the way JavaScript code is usually
    written in mind. Since JavaScript makes extensive use of anonymous objects, such
    as function expressions and object literals, it is much more natural to describe
    their relationships using a structural system rather than a nominative one.


    The TS type system allows for certain operations that cannot be said to be safe
    at compile time. When a type system has this property, it is said that it is not
    “reliable.” The places where TS allows unreliable behavior have been carefully
    considered, and in this chapter, we will explain where this happens and for what
    reason it was allowed.


    The basic rule of the TS type system is that x is compatible with y if y has at
    least the same members as x. For example:


    *interface with the name {

    *name: string;*

    *}*


    TypeScript for Beginners 70


    *let x: Named;*

    // the output type for y is {name: string; location: string;}

    *let y = {name: "Jannet", location: "Boston"};*

    x = y;*


    To understand whether y can be assigned to x, the compiler searches for the corresponding
    compatible property in y for each of the properties of x. In this case, the y
    variable must have a property named name of the string type. It is there, and
    assignment is allowed.


    The same rule is used in the case of checking arguments when calling a function:


    *function greeting (n: Named) {

    *alert("Hello, " + n.name);*

    *}*


    *greet(y); // OK Note that y has an additional property, but this does not result
    in an error. When checking for compatibility, only members of the target type
    (in this case, Named) are considered.*


    *Optional Parameters and Default Parameters*


    In TS, it is assumed that each function parameter is required. This does not mean
    that it cannot be passed; it means that when the function is called, the compiler
    will check whether the user has set a value for each of its parameters. Simply
    put, the number of parameters passed must match the number of parameters that
    the function expects.


    *function buildName(firstName: string, lastName: string) {*

    *return firstName + " " + lastName;*

    *}*


    *let result1 = buildName("Sam"); // error, too few parameters


    Key Concepts of TS 71


    *let result2 = buildName("Sam", "Adams", "Sr."); // error, too many parameters*

    *let result3 = buildName("Sam", "Adams"); // correct*


    In JavaScript, all parameters are optional, and users can skip them if necessary.
    In such cases, the value of the missing parameters is assumed to be undefined.
    In TS, you can also achieve this: to do this, at the end of the parameter that
    you want to make optional, ? is added. For example, we want to make lastName optional
    from the previous example:


    *function buildName(firstName: string, lastName?: string) {*

    *if (lastName)*

    *return firstName + " " + lastName;*

    *else*

    *return firstName;*

    *}*


    *let result1 = buildName("Sam"); // all is correct now*

    *let result2 = buildName("Sam", "Adams", "Sr."); // error, too many parameters*

    *let result3 = buildName("Sam", "Adams"); // correct*


    All optional parameters must come after the required ones. If the first parameter
    (firstName) had to be made optional instead of lastName, then the order of the
    parameters in the function would have to be changed so that firstName would be
    the last.


    TS also allows you to specify a value for a parameter that it will accept if the
    user skips it or passes undefined. These parameters are called default parameters,
    or simply default parameters. Let’s take the previous example and set the default
    value for lastName to “Smith.”


    *function buildName(firstName: string, lastName = "Smith") {*

    *return firstName + " " + lastName;*

    *}*


    *let result1 = buildName("Sam"); // now all is correct, returns "Sam Smith"*

    '
