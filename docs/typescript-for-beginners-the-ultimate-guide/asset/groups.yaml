    File 'node_modules/typescript/lib/typescript.d.ts' exist - use it as a module\
    \ resolution result.\n========================== Module name 'typescript' was\
    \ successfully resolved to 'node_modules/typescript/lib/typescript.d.ts'.\n==========================\n\
    ```\n\n### 在跟踪信息中查看什么？\n\n导入语句名称和位置\n\n```text\n========================== Resolving\
    \ module 'typescript' from 'src/app.ts'.\n==========================\nModule resolution\
    \ kind is not specified, using 'NodeJs'.\nLoading type declarations (typings)\
    \ from npm packages\n'package.json' has 'typings' field './lib/typescript.d.ts'\
    \ that references 'node_modules/typescript/lib/typescript.d.ts'.\nFinal result\n\
    ========================== Module name 'typescript' was successfully resolved\
    \ to 'node_modules/typescript/lib/typescript.d.ts'.\n==========================\n\
    ```\n\n## 第 4 章 TS Runtime\n\n### 什么是运行时？\n\n运行时（Runtime）是执行计算机程序所必需的计算环境，并在程序执行期间可用。在运行时环境中，通常无法更改程序的源代码，但可能会访问操作系统环境变量、对象表和共享库模块。\n\
    \n对于解释型编程语言，与运行时环境的交互直接在解释器中实现，解释器提供了语言结构与其运行环境之间的交互。对于编译型语言，与计算环境的交互可以通过一组插件共享运行时库来实现，也可以完全在一个虚拟机中执行程序被编译成的中间代码。\n\
    \n### NODE.JS\n\nNode 是一个允许你编写服务端 JavaScript (JS) 代码的运行时环境。它在 2011 年发布后变得非常流行。随着代码库的增长，由于语言本身的特性：动态和弱类型，编写服务端代码可能会变得困难。Node.js\
    \ 并不是一种独立的语言，而是一个在服务器上使用 JS 的平台。\n\n基于浏览器的 JS 使用访问页面和 Web 应用 DOM 及用户界面的 API。服务端\
    \ JS 使用访问应用程序文件系统、http 请求和流的 API。\n\n"
