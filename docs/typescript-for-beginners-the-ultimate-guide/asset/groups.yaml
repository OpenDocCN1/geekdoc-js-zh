    \ on the path `C:\\Program Files (x86)\\Microsoft SDKs\\TypeScript\\[version\\\
    _number\\]` we can see all the installed files, including the compiler file itself\
    \ tsc.exe.\n\n### Compiling an App\n\nFirst, create the application directory.\
    \ In my case, it will be a folder along the path `C:/typescript`. Add the file\
