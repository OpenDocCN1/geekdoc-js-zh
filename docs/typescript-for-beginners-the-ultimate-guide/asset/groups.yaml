    \n  get fullName(): string {\n    return this._fullName;\n  }\n\n  set fullName(value:\
    \ string) {\n    if (value === \"secret password\") {\n      this._fullName =\
    \ value;\n    } else {\n      console.log(\"Unauthorized update!\");\n    }\n\
    \  }\n}\n\nlet employee = new Employee();\nemployee.fullName = \"Bob Nylon\";\
    \ // Unauthorized update!\nemployee.fullName = \"secret password\"; // Success\n\
    console.log(employee.fullName); // secret password\n```\n\n## 60 Static Properties\n\
    \nSo far, we’ve only talked about instance members, those that appear in objects.\
