  - "[PAGE 108]\n\n**92**    ◾    TypeScript for Beginners\n\nENUMS\n\nEnums allow\
    \ us to define a set of named numeric constants and are \n\ndefined using the\
    \ enum keyword. Enumerations are subtypes of the prim­\n\nitive number type.\n\
    \n*enum Direction {*\n\n *Up = 1,*\n\n *Down,*\n\n *Left,*\n\n *Right*\n\n*}*\n\
    \nThe enumeration body consists of zero or more elements. The enumera­\n\ntion\
    \ elements have a numeric value associated with the name, and can be \n\neither\
    \ a constant or can be evaluated. An enumeration element is consid­\n\nered a\
    \ constant if:\n\n• if the value is not explicitly defined and the value of the\
    \ previous \n\nmember is constant. In this case, the value will be equal to the\
    \ \n\nnumeric value of the previous term plus 1. The exception is only the \n\n\
    first element. If the value is not specified, it becomes 0;\n\n• if the enumeration\
    \ element is defined using a constant expression. \n\nSuch expressions are a type\
    \ of TS expression that can be evaluated at \n\ncompile time.\n\nAn enumeration\
    \ expression is constant if a numeric literal is:\n\n• a reference to a previously\
    \ defined constant element of an enu­\n\nmeration (it can be defined in various\
    \ enumerations). If an element \n\nis defined in the same enumeration, it can\
    \ be referenced using an \n\nunqualified name;\n\n• the constant expression of\
    \ the enumeration, taken in parentheses by;\n\n• the unary operator +, -,~, applied\
    \ to the constant expression of the \n\nenumeration;\n\n• by a binary operator\
    \ +, -, \\*, /, %, ≪, ≫, ⋙, &, |, ^ with an enumeration \n\nconstant expression\
    \ as an operand. A constant enumeration expres­\n\nsion evaluated in NaN or Infinity\
    \ results in a compile-time error."
