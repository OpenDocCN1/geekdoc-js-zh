    \ 文件，我们可以通过简单输入来编译应用程序：\n\n`tsc`\n\n此命令将使用我们创建的 *tsconfig.json* 文件调用 TS 编译器并生成文件\
    \ *hello.js*。任何扩展名为 *.ts 的 TS 源文件都会生成扩展名为 *.js 的 JS 文件。\n\n现在，我们已经成功创建了一个基于 Node\
    \ 的简单 TS 开发环境，具有简单的文本编辑器和命令行访问。\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_62_0.png)\n\
    \n47 DOI: 10.1201/9781003203728-2\n## 第2 章 TS 核心概念\n\n传统的 JavaScript 关注函数和基于原型的继承以创建复用组件，但与存在类的面向对象方法相比，这种方法非常不方便。从\
    \ ECMAScript 2015 开始，TypeScript (TS) 你将能够使用这种方法创建类。\n\n### 继承\n\n继承是面向对象的另一个范式。继承意味着一个对象使用其基类来获取其特性。继承它的接口或类被称为基类，而继承它的接口或类被称为派生类。TS\
    \ 使用 *extends* 关键字创建子类。\n\n示例展示了如何使用子类中指定的方法来重写基类的方法。Frog 和 Horse 类创建了 move 方法，重写了\
    \ Animal 类的 move 方法，为每个类提供了特定的功能。让我们来看下面的示例：\n\n```typescript\nclass Animal {\n\
    \  name: string;\n  constructor(name: string) {\n    this.name = name;\n  }\n\
    \  move(distanceMeters: number = 0) {\n    console.log(`${this.name} 移动了 ${distanceMeters}\
    \ 米.`);\n  }\n}\n\nclass Frog extends Animal {\n  constructor(name: string) {\n\
    \    super(name);\n  }\n  move(distanceMeters: number = 5) {\n    console.log(\"\
    跳跃中...\");\n    super.move(distanceMeters);\n  }\n}\n\nclass Horse extends Animal\
    \ {\n  constructor(name: string) {\n    super(name);\n  }\n  move(distanceMeters:\
    \ number = 45) {\n    console.log(\"奔跑中...\");\n    super.move(distanceMeters);\n\
    \  }\n}\n\nlet jack = new Frog(\"旅行者 Froggy\");\nlet mrhorse: Animal = new Horse(\"\
    MrHorse\");\n\njack.move();\nmrhorse.move(34);\n```\n\n这个示例展示了 TS 的许多继承特性，与其他语言相同。在这里我们看到使用\
    \ *extends* 关键字创建子类。Horse 和 Frog 类基于 Animal 类，并可以访问它的特性。\n\n包含构造函数的派生类必须调用 super()，这将执行基类的构造函数。注意，尽管\
    \ nick 被声明为 Animal，但它的值是 Horse，所以当调用 nick.move(34) 时，将调用 Horse 类的重写方法。\n\n*接口继承*\n\
