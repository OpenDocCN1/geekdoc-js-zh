- md: "\n## 62 TypeScript for Beginners\n\nclass Greeter {\n  greeting: string;\n\n\
    \  constructor(message: string) {\n    this.greeting = message;\n  }\n\n  greet()\
    \ {\n    return \"Hello, \" + this.greeting;\n  }\n}\n\nlet greeter: Greeter;\n\
    greeter = new Greeter(\"world\");\nconsole.log(greeter.greet());\n\nIn this case,\
    \ when we say let greeter: Greeter, we use Greeter as the type of instances of\
    \ the Greeter class. This is almost a habit of programmers from other object-oriented\
    \ programming languages.\n\nWe also create another value, which is called a constructor\
    \ function. This function is called when we create instances of the class using\
    \ new. To see how this looks in practice, let’s look at the JavaScript code generated\
    \ by the compiler from the example above:\n\n```javascript\nlet Greeter = (function\
    \ () {\n  function Greeter(message) {\n    this.greeting = message;\n  }\n  Greeter.prototype.greet\
    \ = function () {\n    return \"Hello, \" + this.greeting;\n  };\n  return Greeter;\n\
    })();\n\nlet greeter;\ngreeter = new Greeter(\"world\");\nconsole.log(greeter.greet());\n\
    ```\n\nHere let Greeter is assigned a constructor function. When we specify new\
    \ and run this function, we get an instance of the class. The constructor function\
    \ also contains all the static members of the class. Another way to think about\
    \ each class is: there is an instance part and a static part.\n\nLet’s change\
    \ the code a bit to show this difference:\n\n```typescript\nclass Greeter {\n\
    \  static standardGreeting = \"Hello, there\";\n  greeting: string;\n  greet()\
    \ {\n    if (this.greeting) {\n      return \"Hello, \" + this.greeting;\n   \
    \ } else {\n      return Greeter.standardGreeting;\n    }\n  }\n}\n\nlet greeter1:\
    \ Greeter;\ngreeter1 = new Greeter();\nconsole.log(greeter1.greet());\n\nlet greeterMaker:\
    \ typeof Greeter = Greeter;\ngreeterMaker.standardGreeting = \"Hey there!\";\n\
    let greeter2: Greeter = new greeterMaker();\nconsole.log(greeter2.greet());\n\
    ```\n\nIn this example, greeter1 works similarly to the one above. We created\
    \ an instance of the Greeter class and use the object. We have already seen this.\n\
    \nThen we use the class directly. Creating a new variable named greMaker. This\
    \ variable will contain the class itself, or, in other words, the constructor\
    \ function. Here we use typeof Greeter, it looks like “give me the type of the\
    \ Greeter class itself,” not the instance. Or, more precisely, “give me an ID\
    \ type called Greeter,” which is the type of the constructor function. This type\
    \ will contain all the static members of Greeter, along with a constructor that\
    \ creates instances of the Greeter class. We demonstrated this by using new with\
    \ greeterMaker, creating new instances of Greeter and calling them as before.\n\
    \n### Using a Class as an Interface\n\nAs we discussed in the previous section,\
    \ a class declaration creates two things: a type that describes instances of the\
    \ class, and a constructor function. Since classes create types, we can use them\
    \ in the same way as interfaces.\n\n```typescript\nclass Point {\n  x: number;\n\
    \  y: number;\n}\n\ninterface Point3d extends Point {\n  z: number;\n}\n\nlet\
    \ point3d: Point3d = {x: 1, y: 2, z: 3};\n```\n\n## FUNCTIONS\n\nFunctions are\
    \ one of the fundamental foundations of any JavaScript application. They are used\
    \ to build abstraction levels, classes, information hiding, and modules. TS has\
    \ classes, namespaces, and modules, but functions play a key role. The TS language\
    \ slightly expands the capabilities of functions compared to JavaScript, making\
    \ working with them even more convenient.\n\nAs in JavaScript, functions in TS\
    \ can be either named or anonymous. This allows you to choose the most convenient\
    \ approach for developing your application, whether it is building a list of functions\
    \ in the API, or embedding one function in another.\n\nLet’s recall how these\
    \ two options look in JavaScript:\n\n```javascript\n// Named function\nfunction\
    \ add (x, y) {\n  return x + y;\n}\n\n// Anonymous function\nlet myAdd = function(x,\
    \ y) {return x+y; };\n```\n\nJust like in JavaScript, functions can access variables\
    \ outside of their body. When this happens, the function is said to “capture”\
    \ the variables. Although it is not the task of this article to explain how it\
    \ works and what the pitfalls of this technique are, it is important to have a\
    \ clear understanding of this mechanism in order to work with JavaScript and TS.\n\
    \n```javascript\nlet z = 50;\nfunction addToZ(x, y) {\n  return x + y + z;\n}\n\
    ```\n\n### Types of Functions\n\n### Adding Types to a Function\n\nLet’s add the\
    \ types to the function from the previous simple examples:\n\n```typescript\n\
    function add(x: number, y: number): number {\n  return x + y;\n}\n\nlet myAdd\
    \ = function(x: number, y: number): number {\n  return x+y; \n};\n```\n\nYou can\
    \ add types to each parameter, as well as to the function itself, to specify the\
    \ type of the return value. TS can infer the type of the return value itself by\
    \ analyzing the return statements, so it is often possible not to specify it explicitly.\n\
    \nNow let’s describe the full type of this function:\n\n```typescript\nlet myAdd:\
    \ (x: number, y: number)=>number =\n  function(x: number, y: number): number {\n\
    \    return x+y;\n  };\n```\n\nA functional type consists of two parts: the argument\
    \ types and the return value.\n\n### Inferring Types\n\nExperimenting with the\
    \ following example, you can see that the compiler is able to deal with types\
    \ if they are not specified:\n\n```typescript\n// has full type\nlet myAdd = function(x:\
    \ number, y: number): number {\n  return x+y;\n};\n\n// myAdd: (baseValue:number,\
    \ increment:number) => number = function(x, y) {\n  return x + y;\n};\n```\n\n\
    This is called contextual typing – a type inference. This feature allows you to\
    \ spend less effort on adding types to the program. There are several places in\
    \ TS where type inference is used to get information about types without explicitly\
    \ specifying it. This occurs when initializing variables and members, assigning\
    \ default values to parameters, and defining the type of the function’s return\
    \ value. For example, in this code:\n\n```typescript\nlet x = 3;\n```\n\nThe type\
    \ of the variable x is output in number. In most cases, type inference is straightforward.\
    \ In the following sections, we will describe several subtleties of this process.\n\
    \n### Best General Type\n\nWhen inference is made from multiple expressions, their\
    \ types are used to find the “best general type.” For example:\n\n```typescript\n\
    let x = [0, 1, null];\n```\n\nTo output the type x in this case, you need to check\
    \ the type of each element in the array. In this case, there are two options for\
    \ the array type: number and null. The algorithm for finding the best common type\
    \ checks each candidate type, and selects the one that is compatible with all\
    \ the others.\n\nSince the best common type must be chosen from the types provided,\
    \ there are cases where the types have a common structure for all, but none of\
    \ them is the base for all the others. For example:\n\n```typescript\nlet zoo\
    \ = [new Rhino(), new Elephant(), new Snake()];\n```\n\nIdeally, we would like\
    \ the zoo type to be output as Animal[] (that is, an array of objects of the Animal\
    \ animal class). But, since there is not a single object in the array that has\
    \ the Animal class, the compiler is not able to get such a result. To fix this,\
    \ you will have to explicitly specify the type if no object has the base type\
    \ for all the others:\n\n```typescript\nlet zoo: Animal[] = [new Rhino(), new\
    \ Elephant(), new Snake()];\n```\n"
  mdcn: "\n\n## 62 面初学者的 TypeScript\n\nclass Greeter {\n  greeting: string;\n\n  constructor(message:\
    \ string) {\n    this.greeting = message;\n  }\n\n  greet() {\n    return \"Hello,\
    \ \" + this.greeting;\n  }\n}\n\nlet greeter: Greeter;\ngreeter = new Greeter(\"\
    world\");\nconsole.log(greeter.greet());\n\n在这种情况下，当我们说 `let greeter: Greeter`\
    \ 时，我们使用 `Greeter` 作为 `Greeter` 类实例的类型。这几乎是来自其他面向对象编程语言的开发者的习惯。\n\n我们还创建了另一个值，称为构造函数。当我们使用\
    \ `new` 创建类的实例时，就会调用这个函数。为了看到在实践中它是怎样的，让我们看看编译器从上面的示例生成的 JavaScript 代码：\n\n```javascript\n\
    let Greeter = (function () {\n  function Greeter(message) {\n    this.greeting\
    \ = message;\n  }\n  Greeter.prototype.greet = function () {\n    return \"Hello,\
    \ \" + this.greeting;\n  };\n  return Greeter;\n})();\n\nlet greeter;\ngreeter\
    \ = new Greeter(\"world\");\nconsole.log(greeter.greet());\n```\n\n在这里，`Greeter`\
    \ 被赋值了一个构造函数。当我们指定 `new` 并运行该函数时，我们就得到了该类的实例。构造函数还包含了类的所有静态成员。思考每个类的另一种方式是：它分为了一个实例部分和一个静态部分。\n\
    \n让我们稍微修改代码来显示这种差异：\n\n```typescript\nclass Greeter {\n  static standardGreeting\
    \ = \"Hello, there\";\n  greeting: string;\n  greet() {\n    if (this.greeting)\
    \ {\n      return \"Hello, \" + this.greeting;\n    } else {\n      return Greeter.standardGreeting;\n\
    \    }\n  }\n}\n\nlet greeter1: Greeter;\ngreeter1 = new Greeter();\nconsole.log(greeter1.greet());\n\
    \nlet greeterMaker: typeof Greeter = Greeter;\ngreeterMaker.standardGreeting =\
    \ \"Hey there!\";\nlet greeter2: Greeter = new greeterMaker();\nconsole.log(greeter2.greet());\n\
    ```\n\n在这个示例中，`greeter1` 的工作方式与上面类似。我们创建了一个 `Greeter` 类的实例并使用了该对象。我们已经见过这种情况。\n\
    \n然后我们直接使用该类。创建一个名为 `greMaker` 的新变量。这个变量将包含类本身，或者换说，包含构造函数。在这里我们使用 `typeof Greeter`，它看起来像是“给我\
    \ `Greeter` 类本身的类型”，而不是实例。或者更准确地说，“给我一个名为 `Greeter` 的标识符类型（ID type）”，它是构造函数的类型。该类型将包含\
    \ `Greeter` 的所有静态成员，以及一个创建 `Greeter` 类实例的构造函数。我们通过在 `greeterMaker` 上使用 `new` 展示了这一点，创建了新的\
    \ `Greeter` 实例并像以前一样调用了它们。\n\n### 将类作为接口\n\n正如我们在上一节中讨论的，类声明会创建两个东西：一个描述类实例的类型，和一个构造函数。由于类会创建类型，因此我们可以像使用接口一样使用它们。\n\
    \n```typescript\nclass Point {\n  x: number;\n  y: number;\n}\n\ninterface Point3d\
    \ extends Point {\n  z: number;\n}\n\nlet point3d: Point3d = {x: 1, y: 2, z: 3};\n\
    ```\n\n## 函数\n\n函数是任何 JavaScript 应用程序的基础基础之一。它们被用于构建抽象层、类、信息隐藏和模块。TS 拥有类、命名空间和模块，但函数起着关键作用。与\
    \ JavaScript 相比，TS 语言稍微扩展了函数的功能，使得处理它们变得更加方便。\n\n与 JavaScript 中一样，TS 中的函数可以是命名的或匿名的。这允许你为开发应用程序选择最方便的方法，无论是在\
    \ API 中构建函数列表，还是将一个函数嵌入另一个函数中。\n\n让我们回一下这两个选项在 JavaScript 中是如何写的：\n\n```javascript\n\
    // 命名函数\nfunction add (x, y) {\n  return x + y;\n}\n\n// 匿名函数\nlet myAdd = function(x,\
    \ y) {return x+y; };\n```\n\n就像在 JavaScript 中一样，函数可以访问体外部的变量。当这种情况发生时，该函数被称为“捕获”了变量。虽然本文的任务不是解释它的工作原理以及这种技术的陷阱是什么，但为了处理\
    \ JavaScript 和 TS，清晰地理解这一机制非常重要。\n\n```javascript\nlet z = 50;\nfunction addToZ(x,\
    \ y) {\n  return x + y + z;\n}\n```\n\n### 函数类型\n\n### 给函数添加类型\n\n让我们为之前简单示例中的函数添加类型：\n\
    \n```typescript\nfunction add(x: number, y: number): number {\n  return x + y;\n\
    }\n\nlet myAdd = function(x: number, y: number): number {\n  return x+y; \n};\n\
    ```\n\n你可以为每个参数添加类型，也可以为函数本身添加类型以指定返回值的类型。TS 可以通过分析 `return` 语句推断返回值的类型，因此通常不需要显式地指定它。\n\
    \n现在让我们描述这个函数的完整类型：\n\n```typescript\nlet myAdd: (x: number, y: number)=>number\
    \ =\n  function(x: number, y: number): number {\n    return x+y;\n  }\n```\n\n\
    函数类型由两部分组成：参数类型和返回值。\n\n### 类型推断\n\n通过下面的示例，你可以看到即使不指定类型，编译器也能处理类型：\n\n```typescript\n\
    // 具有完整类型\nlet myAdd = function(x: number, y: number): number {\n  return x+y;\n\
    };\n\n// myAdd:(baseValue:number, increment:number) => number = function(x, y)\
    \ {\n  return x + y;\n};\n\n这被称为上下文类型（contextual typing）——类型推断。此功能允许你减少在程序中添加类型的精力。TS\
    \ 中的许多地方都使用类型推断来获取显式类型信息。这发生在初始化变量和成员、为参数分配默认值以及定义函数的返回值类型时。例如，在以下代码中：\n\n```typescript\n\
    let x = 3;\n```\n\n变量 x 的类型输出为 `number`。在大多数情况下，类型推断是直观的。\n\n### 通用类型\n\n当从多个表达式进行推断时，会使用它们的类型来寻找“最佳通用类型”。例如：\n\
    \n```typescript\nlet x = [0, 1, null];\n```\n\n在这种情况下输出 x 的类型，你需要检查数组中每个元素的类型。在这种情况下，数组类型有两种选择：`number`\
