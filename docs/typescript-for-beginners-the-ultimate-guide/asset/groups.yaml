    \ in TypeScript of previous versions, there were problems when creating mix-ins\
    \ that use abstract classes.\n\nTypeScript 4.2 allows you to specify an abstract\
    \ modifier for constructor signatures. Adding an abstract modifier to the constructor\
    \ signature signals that an abstract class can be passed to it. This does not\
    \ prevent you from passing other classes and constructor functions that are “specific”\
    \ to it.\n\nMix-in factories will now support abstract classes.\n\n```typescript\n\
    abstract class Shape {\n  abstract getArea(): number;\n}\n\n// Error! You cannot\
    \ create an instance of an abstract class.\nnew Shape();\n\ninterface HasArea\
    \ {\n  getArea(): number;\n}\n\n// Error! You cannot assign an abstract constructor\
