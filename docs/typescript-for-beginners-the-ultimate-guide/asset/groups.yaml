    # Chapter 1

    ## TypeScript

    *Introduction to TypeScript*


    TypeScript (TS) is a typed extended set of JavaScript (JS) that compiles to plain
    JS. As an analogy, if JS was CSS, then TS would be SCSS.


    All valid JS code you write is also valid TS code. However, by using TS, you get
    to use static typing and the latest features that compile into simple JS that
    is supported by all browsers. TS aims to solve the JS scaling problem, and it
    works pretty well.


    In this book, you’ll start by reading about the various features of TS and why
    learning it is a good idea. The rest of this book will focus on installing and
    compiling TS, along with some popular text editors that offer you support for
    TS syntax and other important features.


    ### WHAT IS TS?


    TS is a kind of updated version of the JS language. It can run on Node.js or any
    web browser that supports ECMAScript 3 or higher. TS is a statically compiled
    language that provides optional static typing, classes, and an interface. It allows
    you to write simple and clean JS code. So, adopting TS can help you create more
    easily deployable and more reliable software.


    ### A BRIEF HISTORY OF TS


    TS development began in late 2012. Although it originated in Microsoft, and its
    actual creator is the programmer Anders Hejlsberg, also known as the creator of
    such languages as Delphi and C#, this project immediately began to develop as
    an OpenSource. And from the very beginning, the new language began to spread rapidly
    due to its flexibility and performance. A lot of projects that were written in
    JS were transferred to TS. The popularity and relevance of the ideas of the new
    language has led to the fact that a number of these ideas will later become part
    of the new JS standard. And the new version of one of the most popular frameworks
    for web – Angular 2/4/5/6 is completely written in TS jointly by Microsoft and
    Google.


    ### WHY SHOULD YOU CHOOSE TS?


    However, it would seem that there is no need for another programming language
    for the client side in the web environment, if traditional JS, which is used on
    almost every site, which is owned by many developers and whose support in the
    programming community is quite high, also copes with all the same work. But TS
    is not just a new JS.


    First, it should be noted that TS is a strongly typed and compiled language, which
    may be closer to programmers of Java, C#, and other strongly typed languages.
