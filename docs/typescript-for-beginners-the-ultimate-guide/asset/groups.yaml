    \ will be justified if you want to stay in the trend of web \n\ndevelopment. If\
    \ you work in a team and you need to create a scalable prod­\n\nuct that will\
    \ need to be supported for a long time, write it in TS. Since ES6/\n\nES7 now\
    \ needs to be translated to ES5, you can use TS instead of Babel, so \n\nyou will\
    \ maintain type security and your code will work in all browsers.\n\nTS brings\
    \ many benefits to performance and to the developer experience. \n\nTS is not\
    \ unique to Angular; other powerful integrated environments, such \n\nas React\
    \ and Vue, are starting to use TS to allow development teams to build \n\napplications\
    \ that are robust, resilient, and scalable. JS and TS are constantly \n\nevolving\
    \ but do not compete with each other. TS was created to complement \n\nand improve\
    \ JS, not replace it. In the future, they may become very similar \n\nin function,\
    \ but for now, TS remains a statically typed alternative.\n\nSyntactic Sugar\n\
    \nTS provides a very simple syntax for checking the type of an object at \n\n\
    compile time. This syntax is known as syntactic sugar, or, more formally, \n\n\
    type annotation. Consider the following version of our JS source code, \n\nwritten\
    \ in TS:\n\n*var test: string = \"this is a string\";*\n\n *test = 1;*\n\n *test\
    \ = function(a, b) {return a + b; }*\n\nNotice that in the first line of this\
    \ snippet, we entered a colon: and the string \n\nkeyword between our variable\
    \ and its assignment. This type annotation syn­\n\ntax means that we set the type\
    \ of our variable as a string type and that any \n\ncode that does not adhere\
    \ to these rules will result in a compilation error. \n\nRunning the previous\
    \ code through the TS compiler will cause two errors:\n\n*hello.ts(3,1): error\
    \ TS2322: Type ‘number’ is not *\n\n*assignable to type ‘string’. hello.ts(4,1):\
    \ error *\n\n*TS2322: Type ‘(a: any, b: any) => any’ is not *\n\n*assignable to\
    \ type ‘string’.*"
