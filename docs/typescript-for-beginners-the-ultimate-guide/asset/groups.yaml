  - "[PAGE 99]\n\nKey Concepts of TS    ◾   ** 83**\n\nGENERICS\n\nOne of the most\
    \ important aspects of software development is the creation \n\nof components\
    \ with a well-designed structure and API. But an equally \n\nimportant part is\
    \ the ability to reuse these components. Components that \n\ncan work with different\
    \ data sets provide developers with additional capa­\n\nbilities when designing\
    \ large and complex systems.\n\nIn languages such as Java or C#, one of the main\
    \ ways to create reusable \n\ncomponents is to use generics. Generalizations allow\
    \ the component to \n\nwork with different types of data, depending on the needs\
    \ of developers.\n\nExploring the World of Generics\n\nTo begin with, we will\
    \ create the first function that is traditional for \n\nacquaintance with generalizations:\
    \ the identity function. Such a function \n\nreturns exactly what was passed to\
    \ it. You can think of it the same way as \n\nthe echo command.\n\n*function identity(arg:\
    \ number): number {*\n\n *return arg;*\n\n*}*\n\nOf course, in TS, we can specify\
    \ any so that the function can be used for \n\nany data type:\n\n*function identity(arg:\
    \ any): any {*\n\n *return arg;*\n\n*}*\n\nWe can say that this function is a\
    \ generalization, since it can work with \n\nany type of data. But in this case,\
    \ we have absolutely no information about \n\nthe type of the returned value.\
    \ For example, we pass a number as an arg, \n\nbut we don’t know anything about\
    \ the specific type that the function will \n\nreturn, since it is any.\n\nWhen\
    \ using generalizations, we can explicitly specify the type of the \n\nargument\
    \ and thus, within the framework of our example, determine the \n\ntype of the\
    \ return value. To do this, we need to use a special type variable \n\nthat only\
    \ works with data types, not their values:\n\n*function identity<t>(arg: T): T\
    \ {*\n\n *return arg;*\n\n*}*\n\n*</t>*"
  - "[PAGE 100]\n\n**84**    ◾    TypeScript for Beginners\n\nWe added a variable\
    \ of type T to our function. This variable allows us to \n\nspecify a specific\
    \ type when using the function. In addition, we also speci­\n\nfied the type of\
    \ the return value. And now we know that the function will \n\nreturn the result\
    \ with the same data type as the passed argument.\n\nNow let’s see how you can\
    \ use our function. There are two ways to do \n\nthis. Consider the first one:\n\
    \n*let numberOutput = identity<Number>(1);*\n\n*let wrongOutput = identity<Number>(\"\
    sdf\"); / / *\n\n*Compilation error. Invalid data type for the argument*\n\n*let\
    \ stringOutput = identity<String>(\"String\");*\n\n*console. log(numberOutput);\
    \ / / outputs \"1\"*\n\n*console. log (stringOutput); / / outputs \" String\"\
    *\n\nWhen calling the function in angle brackets < >, we explicitly specified\
    \ the \n\ndata type that the function will work with.\n\nThe second method is\
    \ not to specify the data type in angle brackets, but \n\nsimply pass the variable\
    \ as an argument to the function. In this case, TS \n\nuses a mechanism called\
    \ automatic type inference, according to the value \n\npassed as an argument.\n\
    \n*let numberOutput = identity(1);*\n\n*let stringOutput = identity (\"String\"\
    );*\n\n*console. log(numberOutput); / / outputs \" 1 \"*\n\n*console. log (stringOutput);/\
    \ / outputs \" String\"*\n\nThe second method, on the one hand, makes the code\
    \ shorter and easier \n\nto read, but on the other hand, it can lead to errors.\
    \ After all, in this case, \n\nyou can pass a value to the function that is not\
    \ expected there, and this can \n\nlead to an error at runtime.\n\nWorking with\
    \ Generalized Type Variables\n\nWhen using generalizations, the compiler assumes\
    \ that the generalized \n\nparameters passed to the function are used correctly.\
    \ In fact, the compiler \n\ntreats them as “any data type” or any.\n\nLet’s look\
    \ at the function from the previous section again:\n\n*function identity<t>(arg:\
    \ T): T {*\n\n *return arg;*\n\n*}*\n\n*</t>*"
  - "[PAGE 101]\n\nKey Concepts of TS    ◾   ** 85**\n\nWhat if you need to output\
    \ the length of the arg argument to the console \n\nevery time the function is\
    \ called? You may be tempted to write like this:\n\n*function loggingIdentity<t>(arg:\
    \ T): T {*\n\n *console.log(arg.length); // Error: T has no *\n\n*.length property*\n\
    \n *return arg;*\n\n*}*\n\n*</t>*\n\nIf you do this, the compiler will throw an\
    \ error telling you what is being \n\nused the *.length* of the arg object, although\
    \ it was never specified that the \n\nobject has such a property. Earlier it was\
    \ said that a type variable means \n\nabsolutely any type, so a number that does\
    \ not have a property could also \n\nbe passed to the function *.length*.\n\n\
    Let’s assume that the function should actually work with arrays of T \n\nobjects,\
    \ and not with the T objects themselves directly. Since it will deal \n\nwith\
    \ arrays, they must have a property .length. You can describe it as if we \n\n\
    are creating an array:\n\n*function loggingIdentity<t>(arg: T\\[\\]): T\\[\\]\
    \ {*\n\n *console.log(arg.length); // Array has .length, so *\n\n*there is no\
    \ error*\n\n *return arg;*\n\n*}*\n\n*</t>*\n\nThe *loggingIdentity* type is read\
    \ as “a generalized loggingIdentity function \n\nthat takes a type parameter T\
    \ and an argument arg, which is an array of \n\nobjects T, and returns an array\
    \ of objects T.” If an array of numbers is \n\npassed to the function, the result\
    \ will also be an array of numbers, since T \n\nwill become number. This allows\
    \ us to use the generalized type variable T \n\nas part of the type we are working\
    \ with, rather than just as an entire type, \n\nwhich gives us more flexibility.\n\
    \nAlternatively, you can write this example in the following way:\n\n*function\
    \ loggingIdentity<t>(arg: Array<t>): Array<t> {*\n\n *console.log(arg.length); \
    \ // Array has .length, so *\n\n*there is no error*\n\n *return arg;*\n\n*}*\n\
    \n*</t></t></t>*"
  - "[PAGE 102]\n\n**86**    ◾    TypeScript for Beginners\n\nYou may have already\
    \ encountered this kind of type writing in other lan­\n\nguages. In the next section,\
    \ we’ll discuss how to create your own custom \n\ntypes like Array<T>.\n\nGeneralized\
    \ Types\n\nIn the previous sections, we created a generalized identity function\
    \ that \n\nworked with different types. In this section, we will discuss how to\
    \ describe \n\nthe type of such a function and how to create generalized interfaces.\n\
    \nDefining a generic function type is very similar to defining a type for \n\n\
    a regular function. The only difference is that you first need to specify the\
    \ \n\ntype of parameters to be passed and the return value, just like when creat­\n\
    \ning a generalized function:\n\n*function*\n\n *identity<t>(arg: T): T {*\n\n\
    \ *return arg;*\n\n*}*\n\n*let myIdentity: <t>(arg: T) => T = identity;*\n\n*</t></t>*\n\
    \nA different name could be used for the standard parameter, but it is only \n\
    \nimportant that the number of standard parameters and how they are used \n\n\
    are consistent.\n\n*function identity<t>(arg: T): T {*\n\n *return arg;*\n\n*}*\n\
    \n*let myIdentity: <U>(arg: U) => U = identity;*\n\n*</t>*\n\nYou can also write\
    \ a generic type as a call signature on the type of an \n\nobject literal:\n\n\
    *function identity<t>(arg: T): T {*\n\n *return arg;*\n\n*}*\n\n*let myIdentity:\
    \ {<t>(arg: T): T} = identity;*\n\n*</t></t>*"
  - "[PAGE 103]\n\nKey Concepts of TS    ◾   ** 87**\n\nThis brings us to the description\
    \ of the first generalized interface. Let’s \n\ntake the object literal from the\
    \ previous example and turn it into an \n\ninterface:\n\n*interface GenericIdentityFn\
    \ {*\n\n *<t>(arg: T): T;*\n\n*}*\n\n*function identity<t>(arg: T): T {*\n\n *return\
    \ arg;*\n\n*}*\n\n*let myIdentity: GenericIdentityFn = identity;*\n\n*</t></t>*\n\
    \nMoreover, we can specify a generic type for the entire interface, which will\
    \ \n\nmake this parameter available to all its methods. After that, we can use\
    \ \n\na generalized version of the interface, specifying a specific data type\
    \ (for \n\nexample, Dictionary<string> instead of Dictionary):\n\n*interface GenericIdentityFn<t>\
    \ {*\n\n *(arg: T): T;*\n\n*}*\n\n*function identity<t>(arg: T): T {*\n\n *return\
    \ arg;*\n\n*}*\n\n*let myIdentity: GenericIdentityFn<number> = identity;*\n\n\
    *</number></t></t>*\n\nNote that the example was transformed into something completely\
    \ dif­\n\nferent. Instead of describing a generalized function, it is now an ordinary,\
    \ \n\nnon-generalized function that is part of a generalized type. When using\
    \ \n\nGenericIdentityFn, you will now have to specify the appropriate type argu­\n\
    \nment (in this case, number), thus fixing the types that the corresponding \n\
    \nfunction will use. Understanding when a type parameter should be added \n\n\
    to the call signature and when to the interface itself is useful when describ­\n\
    \ning which aspects of the type are generalized.\n\nIn addition to generic interfaces,\
    \ you can also create generic classes. \n\nNote that you cannot create generic\
    \ enumerations and namespaces."
- md: "\n## 88 TypeScript for Beginners\n\n### Generalized Classes\n\nGeneralized\
    \ classes have the same form as generalized interfaces. They have a list of typical\
    \ parameters in angle brackets (< >) after the class name.\n\n```typescript\n\
    class GenericNumber<T> {\n  zeroValue: T;\n  add: (x: T, y: T) => T;\n}\n```\n\
    \n```typescript\nlet myGenericNumber = new GenericNumber<number>();\nmyGenericNumber.zeroValue\
    \ = 0;\nmyGenericNumber.add = function(x, y) { return x + y; };\n```\n\nThis is\
    \ a fairly literal use of the GenericNumber type (lit. a generalized number),\
    \ but you can see that nothing prevents you from using other types with it, except\
    \ number. For example, you can use the string type or more complex objects.\n\n\
    ```typescript\nlet stringNumeric = new GenericNumber<string>();\nstringNumeric.zeroValue\
    \ = \"\";\nstringNumeric.add = function(x, y) { return x + y; };\nalert(stringNumeric.add(stringNumeric.zeroValue,\
    \ \"test\"));\n```\n\nJust as with interfaces, passing a type parameter to the\
    \ class itself establishes that all its properties will work with the same type.\n\
    \nAs mentioned in Chapter 2, a class has two types: the static part type and the\
    \ instance type. Generic types are such only in relation to the instance type,\
    \ but not to the static part type. Therefore, static class members cannot use\
    \ typical class parameters.\n\n### Limitations of Generalizations\n\nAs you remember\
    \ from the previous examples, in some cases you need to create a generalized function\
    \ that works with a certain set of types, for which you know what capabilities\
    \ they have. In the example with loggingIdentity, you needed to access the property\
    \ .length of the arg object, but the compiler couldn’t be sure that any type would\
    \ have such property, so it warned about it.\n\n```typescript\nfunction loggingIdentity<T>(arg:\
    \ T): T {\n  console.log(arg.length); // Error: T has no .length property\n  return\
    \ arg;\n}\n```\n\nInstead of working with any possible type, we would like to\
    \ create a constraint so that the function works with all types that have a property\
    \ .length. If a type has this property, it can be used, but it must have at least\
    \ this property.\n\nTo implement this, we will create an interface that describes\
    \ such a restriction. Creating an interface with a single property length, and\
    \ use it with the extend keyword to denote a constraint:\n\n```typescript\ninterface\
    \ Lengthwise {\n  length: number;\n}\n\nfunction loggingIdentity<T extends Lengthwise>(arg:\
    \ T): T {\n  console.log(arg.length); // Now we know that object has property\
    \ .length\n  return arg;\n}\n```\n\nSince the generalized function now has a constraint,\
    \ it will not be able to work with any type:\n\n```typescript\nloggingIdentity(3);\
    \ // Error, the number has no .length property\n```\n\nInstead, it needs to pass\
    \ values of those types that have all the necessary properties:\n\n```typescript\n\
    loggingIdentity({length: 10, value: 3});\n```\n\n### Using Generic Parameters\
    \ in Constraints\n\nYou can define a type parameter that will be limited to the\
    \ type of another parameter. For example, we want to get a property of an object\
    \ by its name. And we really don’t want to get a property that doesn’t exist.\
    \ To do this, enter a restriction on the second parameter of the type. For example:\n\
    \n```typescript\nfunction getProperty<T, K extends key T>(obj: T, key: K) {\n\
    \  return obj[key];\n}\n\nlet x = {a: 1, b: 2, c: 3, d: 4};\nconsole.log(getProperty(x,\
    \ \"a\")); // okay\nconsole.log(getProperty(x, \"m\")); // error: type 'm' isn't\
    \ assignable to 'a' | 'b' | 'c' | 'd'.\n```\n\n### Using Class Types in Generalizations\n\
    \nWhen creating object factories using generalizations, you must refer to class\
    \ types in constructor functions. For example:\n\n```typescript\nfunction create<T>(C:\
    \ { new(): T;): T {\n  return new C();\n}\n\nclass SomeClass {}\nvar obj = create(SomeClass);\n\
    console.log(obj.constructor.name); // shows SomeClass\n```\n\nThe following example\
    \ shows how to impose restrictions on the types of classes created using the class\
    \ factory:\n\n```typescript\nclass BeeKeeper {\n  hasMask: boolean = false;\n\
    }\n\nclass ZooKeeper {\n  nametag: string = \"tag\";\n}\n\nclass Animal {\n  numlegs:\
    \ number;\n}\n\nclass Bee extends Animal {\n  keeper: BeeKeeper = new BeeKeeper();\n\
    }\n\nclass Lion extends Animal {\n  keeper: ZooKeeper = new ZooKeeper();\n}\n\n\
    function createInstance<T extends Animal>(c: new () => T): T {\n  return new c();\n\
    }\n\nconsole.log(createInstance(Lion).keeper.nametag); // shows \"tag\"\nconsole.log(createInstance(Bee).keeper.hasMask);\
    \ // shows \"false\"\n```\n\n### new Keyword\n\nTo create a new object in the\
    \ generalization code, we need to specify that the generalized type T has a constructor.\
    \ This means that instead of the type: T parameter, we need to specify type: {new():\
    \ T;}. For example, the following generalized interface will not work:\n\n```typescript\n\
    function UserFactory<T>(): T {\n  return new T(); // compilation error\n}\n```\n\
    \nTo make the interface work, use the word new:\n\n```typescript\nfunction UserFactory<T>(type:\
    \ { new (): T; }): T {\n  return new type();\n}\n\nclass user {\n  constructor()\
    \ {\n    console.log (\"User object created\");\n  }\n}\n```\n\n## 92 TypeScript\
    \ for Beginners\n\n### ENUMS\n\nEnums allow us to define a set of named numeric\
    \ constants and are defined using the enum keyword. Enumerations are subtypes\
    \ of the primitive number type.\n\n```typescript\nenum Direction {\n  Up = 1,\n\
    \  Down,\n  Left,\n  Right\n}\n```\n\nThe enumeration body consists of zero or\
    \ more elements. The enumeration elements have a numeric value associated with\
    \ the name, and can be either a constant or can be evaluated. An enumeration element\
    \ is considered a constant if:\n\n- if the value is not explicitly defined and\
    \ the value of the previous member is constant. In this case, the value will be\
    \ equal to the numeric value of the previous term plus 1. The exception is only\
    \ the first element. If the value is not specified, it becomes 0;\n- if the enumeration\
    \ element is defined using a constant expression. Such expressions are a type\
    \ of TS expression that can be evaluated at compile time.\n\nAn enumeration expression\
    \ is constant if a numeric literal is:\n\n- a reference to a previously defined\
    \ constant element of an enumeration (it can be defined in various enumerations).\
    \ If an element is defined in the same enumeration, it can be referenced using\
    \ unqualified name;\n- the constant expression of the enumeration, taken in parentheses\
