    \ assign an abstract constructor *\n\n*type to a non-abstract constructor type.*\n\
    \n *let Ctor: new () => HasArea = Shape;*\n\n *// Works!*\n\n *let Ctor: abstract\
    \ new () => HasArea = Shape; *\n\nStrict Checks for the In Statement\n\nIn JavaScript,\
    \ using a non-object type on the right side of the in statement \n\nis a runtime\
    \ error. The syntax check in TypeScript 4.2 ensures that this \n\nerror can be\
    \ detected during development.\n\n*\"foo\" in 42*\n\n*/ / Error! The right side\
    \ of the in expression must *\n\n*not be a primitive.*\n\nUNUSED VARIABLES DURING\
    \ ARRAY DESTRUCTURIZATION\n\nNow, when destructuring an array, you can explicitly\
    \ mark variables as \n\nunused by adding an underscore to them.\n\n*let \\[\\\
    _first, second\\] = getValues();*\n\nPreviously, when the *noUnusedLocals* option\
    \ was enabled, this syntax gave \n\nan error: “Variable declared, but not read.”\
    \ Now, for array variables that \n\nhave an underscore prefix, the error will\
    \ not be returned.\n\nTYPE ARGUMENTS\n\nType arguments are not allowed in JavaScript,\
    \ but in TypeScript 4.2, the \n\nparser will parse them in a specification-compliant\
    \ way. When writing the \n\nfollowing code in a JavaScript file:\n\n*f < T > (100)*\
    \ \n\nTypeScript will parse it as:\n\n *(f < T) > (100)*\n\nThis is important\
    \ if you have used the TypeScript API to analyze type \n\nconstructs in JavaScript\
    \ files.\n\nIn addition, there is a new *noPropertyAccessFromIndexSignature* option.\
    \ \n\nThis function disables the ability to use a point to access those object\
    \ prop­\n\nerties that are defined using the string index signature."
