    \ was taken as a basis. Therefore, it is quite self-sufficient, due to the fact\
    \ that even the testing functionality is included in the standard lib.\n\n*Deno\
    \ X*\n\nThis category includes everything. What was not developed by the main\
    \ Deno team, as well as any import of third-party code into your application.\n\
    \nhttps://deno.land/x – is only a link shortener. And you can add your lib to\
    \ this registry by sending a pull request.\n\nJSPM, Pika.dev – sites designed\
    \ primarily for converting any npm package to an ES module. For example so:\n\n\
    *import HandlebarsJS from 'https://dev.jspm.io/handlebars@4.7.6';*\n\n*Package\
    \ Manager*\n\nThere has been a radical rethink regarding how package management\
    \ works in Deno. Instead of relying on a central repository, it is de-centralized.\
    \ Anyone can place a package anywhere. There are advantages and disadvantages\
    \ to using a centralized repository like npm, and this aspect of Deno is sure\
    \ to be the most controversial.\n\nNo more package.json, now it is accepted to\
    \ use deps.ts, in which you can describe the necessary imports as follows:\n\n\
    *export {assert} from \"https://deno.land/std@v0.42.0/testing/asserts.ts\";*\n\
    \n## 135 ◾ TS Runtime\n\nYou can also use the --importmap (--unstable) flag, which\
    \ will allow you to describe all imports in a single json file:\n\n```json\n{\n\
    \  \"imports\": {\n    \"moment\": \"./moment/moment.ts\",\n    \"moment/\": \"\
    ./moment/\",\n    \"lodash\": \"./lodash/lodash.ts\",\n    \"lodash/\": \"./lodash/\"\
    ,\n    \"https://www.unpkg.com/vue/dist/vue.runtime.esm.js\": \"./vue.ts\"\n \
    \ },\n  \"scopes\": {\n    \"scope/\": {\n      \"moment\": \"./scoped_moment.ts\"\
    \n    }\n  }\n}\n```\n\nIt does not support std modules, but, nevertheless, it\
    \ can work with the following schemes: file:, http:, https:.\n\n*Lock File*\n\n\
    Deno can store and verify the integrity of subresources of modules using a small\
    \ JSON file. Using the --lock=lock.json to enable and specify file validation.\
    \ To update or create a file, use --lock=lock.json --lock-write.\n\n*Web Standards*\n\
    \nEverything that works in Deno works the same way as in the browser by default,\
    \ and Deno from the very beginning tries to ensure that there are no strange errors\
    \ for Deno users. What I mean by that:\n\n*>reverse=a=>a.sort(n=>1)* *\n\n*>reverse([1,2,3])*\
    \ *\n\n*- node (10.13.0): [3,2,1]* *\n\n*- deno (0.4.0) [1,2,3]* *\n\n*- chrome\
    \ (74.0) [1,2,3]* *\n\n*- other browsers: [1,2,3]*\n\n## 136 ◾ TypeScript for\
    \ Beginners\n\n*WASM, RUST, Plugins*\n\nIt is worth mentioning that Deno is able\
    \ to work with WASM files by default. For example, some database drivers have\
    \ now been integrated in this way.\n\nSeparately, I want to say about native plugins.\
    \ Since the Deno plugins are not the primary task, it cannot be downloaded directly,\
    \ for example, using the usual import, and this would be strange, because in the\
    \ browser you do not have this option, but nevertheless there is Deno.openPlugin.\
    \ This is an asynchronous function that automatically loads the appropriate binary\
