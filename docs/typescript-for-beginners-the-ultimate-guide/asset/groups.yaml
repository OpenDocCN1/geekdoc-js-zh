    \ *}\n}*\n\n如如你所见，相应的常量取代了枚举元素。\n\n### 声明枚举\n\n*declare enum Enum {\n *A = 1,*\n\
    \ *B,*\n *C = 2*\n*}\n\n此类枚举使用 `declare` 关键字定义。它们用于描述现有枚举的形状。\n\n此类枚举的区别在于，如果此类枚举中的某个元素没有初始化器，则它被视为已求值。在普通枚举中，情况恰相反。\n\
    \n## 96 入初学者 TypeScript\n\n编译器不会为此类枚举生成代码。这在使用第三方库时非常有用（例如 jQuery，当需要关于某个对象的信息时，库中定义了某个对象（例如\
    \ `$`），但你并不需要生成对应的代码）。\n\n### 符号 (SYMBOLS)\n\nECMAScript 2015 引入了 `symbol` 类型——一种类似于数字和字符串的原始数据类型。\n\
    \n*symbol* 类型的值通过调用 `Symbol` 构造函数创建。\n\n*let sym1 = Symbol();*\n*let sym2 = Symbol(\"\
    key\"); // 可选的字符串键*\n\n符号是不可改变且唯一的。\n\n*let sym2 = Symbol(\"key\");*\n*let sym3\
    \ = Symbol (\"key\");*\n*sym2 === sym3; // false，符号是唯一的*\n\n像字符串一样，符号可以作为对象属性的键。\n\
    \n*let sym = Symbol();*\n*let obj = {\n *[sym]: \"value\"\n};*\n*console.log(obj[sym]);\
    \ // \"value\"*\n\n符号可以与求值属性结合使用，声明对象属性和类成员：\n\n*const getClassNameSymbol = Symbol();*\n\
    *class C {\n *getClassNameSymbol](){\n *return \"C\";\n *}\n}*\n\n*let c = new\
    \ C();*\n*let className = c[getClassNameSymbol](); // \"C\"*\n\n## 97 TS 核心概念\n\
    \n除了用户定义的字符外，还有预定义的内置字符。嵌入式字符用于反映语言的内部行为。\n\n预定义字符列表：\n\n- **Symbol.hasInstance:**\
    \ 一个方法，用于判断构造对象是否将传递的对象识别为该构造函数的实例。由 *instanceof* 运算符调用。\n- **Symbol.isConcatSpreadable:**\
    \ 一个布尔值，表示当与 `Array.prototype.concat` 使用时，该对象是否应该被分解为数组元素。\n- **Symbol.iterator:**\
    \ 一个方法，返回该对象的默认迭代器。由 `for-of` 结构调用。\n- **Symbol.match:** 一个用于正则表达式的方法，用于将正则表达式与字符串进行匹配。由\
    \ *String.prototype.match* 方法调用。\n- **Symbol.replace:** 一个用于正则表达式的方法，用于替换字符串中匹配到的子字符串。由\
    \ *String.prototype.replace* 方法调用。\n- **Symbol.search:** 一个用于正则表达式的方法，返回字符串中与正则表达式匹配的位置。由\
    \ *String.prototype.search* 方法调用。\n- **Symbol.species:** 一个包含函数的属性，该函数用作继承对象的构造函数。\n\
    - **Symbol.split:** 一个用于正则表达式的方法，根据与正则表达式匹配的位置分割字符串。由 *String.prototype.split*\
    \ 方法调用。\n- **Symbol.toPrimitive:** 一个方法，将对象转换为对应的原始值。由抽象的 *ToPrimitive* 操作调用。\n\
    - **Symbol.toStringTag:** 一个字符串值，用于创建一个描述对象的默认字符串值。由内置的 *Object.prototype.toString*\
    \ 方法调用。\n- **Symbol.unobservable:** 一个对象，其属性名不包含在环境中。\n\n## 98 入初学者 TypeScript\n\
    \n## 99 模块与命名空间\n\n模块不在全局作用域中执行，而是在它们自己的作用域中执行。这意味着在模块中定义的变量、函数等在模块外部是不可见的，除非使用一种导出形式进行显式导出。同样，为了使用从另一个模块导出的变量、函数、类等，你需要使用一种导入形式进行导入。\n\
    \n### 什么是命名空间？\n\n命名空间是一个使用 `namespace` 关键字声明的结构，在代码中由普通对象表示。\n\n*namespace Identifier\
    \ {}*\n\n命名空间机制是全局命名空间冲突的解决方案，它源于 ECMAScript 规范尚未定义模块这种概念的时代。简单来说，命名空间是普通全局变量和匿名函数表达式的组合。命名空间内部定义的构造被分解在匿名函数表达式中。从外部可见的构造被写入传入参数的对象中。\n\
    \n模块使用 `export/import` 关键字定义，并表示模块之间的关系。这种机制完全是 TypeScript 内部的，与 ES2015 模块无关。在其他方面，它们与\
    \ ES2015 模块相同，默认模块定义（export default）除外。\n\n## 100 入初学者 TypeScript\n\n使用 `export`\
    \ 关键字告知编译器，这很快就会讨论。\n\n*// @info: 编译前*\n*namespace NamespaceIdentifier {\n *class\
    \ PrivateClassIdentifier {}\n *export class PublicClassIdentifier {}\n*}*\n\n\
    *// @info: 编译后*\n*var NamespaceIdentifier;*\n*(function (NamespaceIdentifier)\
    \ {\n *class PrivateClassIdentifier {}\n *class PublicClassIdentifier {}*\n *NamespaceIdentifier.PublicClassIdentifier\
    \ = *\n*PublicClassIdentifier;*\n})(NamespaceIdentifier || (NamespaceIdentifier\
    \ = {}));*\n\n"
