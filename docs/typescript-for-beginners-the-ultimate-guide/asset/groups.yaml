  - "[PAGE 29]\n\nTypeScript    ◾   ** 13**\n\n*Enum*\n\nEnum is a special type borrowed\
    \ from other languages like C#, C ++, and \n\nJava that provides a solution to\
    \ the special numbers problem. Enum binds \n\na human-readable name for a specific\
    \ number. As in languages like C#, \n\nthe enum type is a more convenient way\
    \ to give clear names to a set of \n\nnumeric values.\n\n*enum Color {Red, Green,\
    \ Blue};*\n\n*let c: Color = Color.Green;*\n\nBy default, enums start with 0.\
    \ You can change this by directly specifying \n\na value for one of the enum members.\
    \ For example, we can start the previ­\n\nous example with 1 instead of 0:\n\n\
    *enum Color {Red = 1, Green, Blue};*\n\n*let c: Color = Color.Green;*\n\nOr even\
    \ set values for all members:\n\n*enum Color {Red = 1, Green = 2, Blue = 4};*\n\
    \n*let c: Color = Color.Green;*\n\nA convenient feature of enumerations is that\
