    Final result\n========================== Module name 'typescript' was successfully\
    \ resolved to 'node_modules/typescript/lib/typescript.d.ts'.\n==========================\n\
    ```\n\n## Chapter 4 TS Runtime\n\n### WHAT IS RUNTIME?\n\nRuntime is a computing\
    \ environment that is necessary for the execution of a computer program and is\
    \ available during the execution of a computer program. In the runtime environment,\
    \ it is usually impossible to change the source code of the program, but there\
    \ may be access to the operating system environment variables, object tables,\
    \ and shared library modules.\n\nInteraction with the runtime environment for\
    \ interpreted programming languages is implemented directly in the interpreter,\
    \ which provides interaction of language constructs with the environment in which\
    \ it is run. For compiled languages, interaction with the computing environment\
    \ can be implemented by a set of plug-in shared runtime libraries, or entirely\
    \ in a virtual machine that executes the intermediate code into which the program\
    \ is compiled.\n\n### NODE.JS\n\nNode is a runtime environment that allows you\
    \ to write server-side JavaScript (JS) code. It became very widely distributed\
    \ after its release in 2011. With the growth of the code base, writing server-side\
    \ code can be difficult due to the nature of the language: dynamic and weakly\
    \ typed. Node.js is not a separate language but a platform for using JS on the\
    \ server.\n\nBrowser-based JS uses APIs that provide access to the DOM and user\
    \ interface of pages and web applications. Server-side JS uses APIs that provide\
    \ access to the application file system, http requests, and streams.\n"
