- md: "\n## 50 TypeScript for Beginners\n\n*name: string | undefined;*\n\n*}\n\n*class\
    \ InterfaceInheritanceClass implements IDerivedFromBase {*\n\n*id: number | undefined;*\n\
    \n*name: string | undefined;*\n\n*}\n\nFirst, we have an interface called IBase,\
    \ which defines the property of the number or undefined type. Our second interface\
    \ definition, IDerivedFromBase, inherits (extends) from IBase, and therefore automatically\
    \ includes the id property. The IDerivedFromBase interface then defines a name\
    \ property of the string or undefined type.\n\nSince the IDerivedFromBase interface\
    \ inherits from IBase, it actually has two properties – id and name. Next, we\
    \ have the definition of the InterfaceInheritanceClass class, which implements\
    \ the IDerivedFromBase interface. Therefore, this class must define both the id\
    \ and the name property in order to successfully implement all the properties\
    \ of the IDerivedFromBase interface. Although we only have the properties shown\
    \ in this example, the same rules apply for functions.\n\n### Class Inheritance\n\
    \nClasses can also use inheritance, just like interfaces. Using our IBase and\
    \ IDerivedFromBase interface definitions, the code below shows an example of class\
    \ inheritance:\n\n```typescript\nclass BaseClass implements IBase {\n  id: number\
    \ | undefined;\n}\n\nclass DerivedFromBaseClass extends BaseClass implements IDerivedFromBase\
    \ {\n  name: string | undefined;\n}\n```\n\nThe first class, BaseClass, implements\
    \ the IBase interface and as such is only required to define an id property, such\
    \ as number or undefined. The second class, DerivedFromBaseClass, not only inherits\
    \ from the BaseClass class (using the *extends* keyword) but also implements the\
    \ IDerivedFromBase interface. Since BaseClass already defines the id property\
    \ required in the IDerivedFromBase interface, the only other property that the\
    \ DerivedFromBaseClass class must implement is the name property. Therefore, we\
    \ need to include the definition of only this property in the DerivedFromBaseClass\
    \ class.\n\nTS does not support the concept of multiple inheritance. Multiple\
    \ inheritance means that a single class can be derived from multiple base classes.\
    \ TS supports only single inheritance, and therefore any class can have only one\
    \ base class.\n\nHowever, a class can implement many interfaces:\n\n```typescript\n\
    interface IFirstInterface {\n  id : number | undefined;\n}\n\ninterface ISecondInterface\
    \ {\n  name: string | undefined;\n}\n\nclass MultipleInterfaces implements IFirstInterface,\
    \ ISecondInterface {\n  id: number | undefined;\n  name: string | undefined;\n\
    }\n```\n\nHere we have defined two interfaces named *IFirstInterface* and *ISecondInterface*.\
    \ This is followed by a class named *MultipleInterfaces*, which implements both\
    \ interfaces. This means that the *MultipleInterfaces* class must implement the\
    \ id property to satisfy the *IFirstInterface* interface, and the name property\
    \ to satisfy the *ISecondInterface* interface.\n\n### Access Modifiers\n\nAccess\
    \ modifiers allow you to hide the state of an object from external access and\
    \ control access to this state. TS has three modifiers: public, protected, and\
    \ private.\n\n#### Public by Default\n\nIn our examples, we were able to freely\
    \ access class members declared in all classes of the program. If you are familiar\
    \ with classes in other languages, you may have noticed that in the examples above,\
    \ we did not use the word public to change the visibility of a class member. For\
    \ example, C# requires each member to be explicitly marked public for visibility.\
    \ In TS, however, each class member will be public by default.\n\nBut we can mark\
    \ the members of the class public explicitly. The Animal class from the previous\
    \ section will look like this:\n\n```typescript\nclass Animal {\n  public name:\
    \ string;\n  public constructor(theName: string) {\n    this.name = theName;\n\
    \  }\n  public move(distanceInMeters: number) {\n    console.log(`${this.name}\
    \ moved ${distanceInMeters}m.`);\n  }\n}\n```\n\n#### Private Modifier\n\nWhen\
    \ a class member is marked with the private modifier, it cannot be accessed outside\
    \ of that class. For example:\n\n```typescript\nclass Animal {\n  private name:\
    \ string;\n  constructor(theName: string) {\n    this.name = theName;\n  }\n}\n\
    \nnew Animal(\"Cat\").name; // error: 'name' is private;\n```\n\nTS is a structured\
    \ type system. When we compare two different types, regardless of where and how\
    \ they are described and implemented, if the types of all their members are compatible,\
    \ it can be argued that the types themselves are compatible. However, when comparing\
    \ types with the private access modifier, this happens differently. Two types\
    \ will be considered compatible if both members have the private modifier from\
    \ the same declaration. This also applies to protected members.\n\nLet’s look\
    \ at an example to understand how it works in practice:\n\n```typescript\nclass\
    \ Animal {\n  private name: string;\n  constructor(theName: string) {\n    this.name\
    \ = theName;\n  }\n}\n\nclass Cat extends Animal {\n  constructor() {\n    super(\"\
    Cat\");\n  }\n}\n\nclass Employee {\n  private name: string;\n  constructor(theName:\
    \ string) {\n    this.name = theName;\n  }\n}\n\nlet animal = new Animal(\"Goat\"\
    );\nlet cat = new Cat();\nlet employee = new Employee(\"Jack\");\n\nanimal = cat;\n\
    animal = employee; // error: 'Animal' and 'Employee' are not compatible\n```\n\
    \nIn this example, we have the classes Animal and Cat, where Cat is a subclass\
    \ of Animal. We also have a new Employee. We create instances of these classes\
    \ and try to assign them. \n\n#### Protected Modifier\n\nThe protected modifier\
    \ acts similarly to private, except that members members can be accessed in subclasses.\
    \ For example:\n\n```typescript\nclass Animal {\n  protected name: string;\n \
    \ constructor(theName: string) {\n    this.name = theName;\n  }\n}\n\nclass Cat\
    \ extends Animal {\n  constructor() {\n    super(\"Cat\");\n  }\n}\n\nclass Employee\
    \ {\n  protected name: string;\n  constructor(theName: string) {\n    this.name\
    \ = theName;\n  }\n}\n\nlet animal = new Animal(\"Goat\");\nlet cat = new Cat();\n\
    let employee = new Employee(\"Jack\");\n\nanimal = cat;\nanimal = employee; //\
    \ error: 'Animal' and 'Employee' are not compatible\n```\n\n#### Readonly Modifier\n\
    \nYou can make properties read-only by using the readonly keyword. Readonly properties\
    \ must be initialized when they are declared or in the constructor.\n\n```typescript\n\
    class Octopus {\n  readonly name: string;\n  readonly numberOfLegs = 8;\n\n\n\
    constructorconstructortheName: string) {\n    this.name = theName;\n  }\n}\n\n\
    let dad = new Octopus(\"Man with the 8 legs\");\ndad.name = \"Man with the 3-piece\
    \ suit\"; // error! name is readonly.\n```\n\n#### Type Iterator Modifier\n\n\
    By using the optional + sign along with the *type modifiers*, we can create more\
    \ explicit and readable type declarations. We can also use the - (minus) sign\
    \ to remove optional declarations from the properties. For example: we have an\
    \ interface; we can use type iterator modifiers to make all its properties available\
    \ to readonly.\n\n```typescript\ninterface ICar {\n  name: string;\n  age: number;\n\
    }\n\ntype ReadonlyCar = {\n  readonly [K in keyof ICar]: ICar[K];\n};\n```\n\n\
    This type can be useful, for example, for the state of the Redux application because\
    \ the state must be immutable. We should not be able to change any of its properties\
    \ once the object has been created. Type iterator modifiers have become a great\
    \ addition to the language, as they make it easy to extend existing types and\
    \ apply massive changes to all their properties.\n\nNow, if we declare two models\
    \ of the car machine: the first object is mutable, the other is readonly; then\
    \ try to change their data, we will notice that in the second case we will have\
    \ an error.\n\n```typescript\nconst car: ICar = {\n  name: \"Mercedes\",\n```\n"
  mdcn: "\n\n## 给初学者的50个 TypeScript\n\n*name: string | undefined;*\n\n*}\n\n*class\
    \ InterfaceInheritanceClass implements IDerivedFromBase {*\n\n*id: number | undefined;*\n\
    \n*name: string | undefined;*\n\n*}\n\n首先，我们有一个名为 IBase 的接口，它定义了数字或 undefined\
    \ 类型的属性。我们的第二个接口定义 IDerivedFromBase 继承（extends）了 IBase，因此它自动包含了 `id` 属性。接者，IDerivedFromBase\
    \ 接口定义了一个 `string` 或 `undefined` 类型的 `name` 属性。\n\n由于 IDerivedFromBase 接口继承自 IBase，它实际上拥有两个属性——`id`\
    \ 和 `name`。接下来，我们有 `InterfaceInheritanceClass` 类的定义，它实现了 IDerivedFromBase 接口。因此，该类必须同时定义\
    \ `id` 和 `name` 属性，以便成功实现 IDerivedFromBase 接口的所有属性。虽然我们在示例中只了这些属性，但相同的规则也适用于函数。\n\
    \n### 类继承\n\n类也可以像接口一样使用继承。使用我们的 IBase 和 IDerivedFromBase 接口定义，下面的代码展示了类继承的示例：\n\
    \n```typescript\nclass BaseClass implements IBase {\n  id: number | undefined;\n\
    }\n\nclass DerivedFromBaseClass extends BaseClass implements IDerivedFromBase\
    \ {\n  name: string | undefined;\n}\n```\n\n第一个类 `BaseClass` 实现了 IBase 接口，因此只需要定义一个\
    \ `id` 属性，例如 `number` 或 `undefined`。第二个类 `DerivedFromBaseClass` 不仅继承了 `BaseClass`\
    \ 类（使用 *extends* 关键字），还实现了 IDerivedFromBase 接口。由于 `BaseClass` 已经定义了 IDerivedFromBase\
    \ 接口所需的 `id` 属性，DerivedFromBaseClass 类必须实现的唯一另一个属性就是 `name` 属性。因此，我们只需要在 `DerivedFromBaseClass`\
    \ 类中包含这一个属性的定义。\n\nTS 不支持多继承。多继承意味着一个类可以派生自多个基类。TS 只支持单继承，因此任何类只能有一个基类。\n\n然而，一个类可以实现多个接口：\n\
    \n```typescript\ninterface IFirstInterface {\n  id : number | undefined;\n}\n\n\
    interface ISecondInterface {\n  name: string | undefined;\n}\n\nclass MultipleInterfaces\
    \ implements IFirstInterface, ISecondInterface {\n  id: number | undefined;\n\
    \  name: string | undefined;\n}\n```\n\n在这里我们定义了两个名为 *IFirstInterface* 和 *ISecondInterface*\
    \ 的接口。紧接着是一个名为 *MultipleInterfaces* 的类，它实现了这两个接口。这意味着 *MultipleInterfaces* 类必须实现\
    \ `id` 属性以满足 *IFirstInterface* 接口，并实现 `name` 属性以满足 *ISecondInterface* 接口。\n\n\
    ### 访问修饰符\n\n访问修饰符允许你隐藏对象的状态不受外部访问并控制对该状态的访问。TS 有三个修饰符：`public`、`protected` 和\
    \ `private`。\n\n#### 默认认为 public\n\n在我们的示例中，我们可以自由访问程序中所有类声明的类成员。如果你熟悉其他语言中的类，可能会注意到在上面的示例中，我们没有使用\
    \ `public` 单词来改变类成员的可见性。例如，C# 要求显式地将每个成员标记为 public 以具有可见性。但在 TS 中，每个类成员默认都是 `public`。\n\
    \n但我们可以显式地将类成员标记为 `public`。上一节中的 `Animal` 类看起来像这样：\n\n```typescript\nclass Animal\
    \ {\n  public name: string;\n  public constructor(theName: string) {\n    this.name\
    \ = theName;\n  }\n  public move(distanceInMeters: number) {\n    console.log(`${this.name}\
    \ moved ${distanceInMeters}m.`);\n  }\n}\n```\n\n#### private 修饰符\n\n当类成员被标记为\
    \ `private` 修饰符时，无法在类外部进行访问。例如：\n\n```typescript\nclass Animal {\n  private name:\
    \ string;\n  constructor(theName: string) {\n    this.name = theName;\n  }\n}\n\
    \nnew Animal(\"Cat\").name; // error: 'name' is private;\n```\n\nTS 是结构化类型系统。当我们比较两个不同的类型时，无论它们在哪里以及如何被描述和实现，如果所有成员的类型都是兼容的，就可以认为类型本身是兼容的。然而，在比较带有\
    \ `private` 访问修饰符的类型时，情况有所不同。如果两个类型的成员都具有同一个声明的 `private` 修饰符，则这两个类型被认为是兼容的。这同样适用于\
    \ `protected` 成员。\n\n让我们来看一个示例来理解它在实践中是如何工作的：\n\n```typescript\nclass Animal {\n\
    \  private name: string;\n  constructor(theName: string) {\n    this.name = theName;\n\
    \  }\n}\n\nclass Cat extends Animal {\n  constructor() {\n    super(\"Cat\");\n\
    \  }\n}\n\nclass Employee {\n  private name: string;\n  constructor(theName: string)\
    \ {\n    this.name = theName;\n  }\n}\n\nlet animal = new Animal(\"Goat\");\n\
    let cat = new Cat();\nlet employee = new Employee(\"Jack\");\n\nanimal = cat;\n\
    animal = employee; // error: 'Animal' and 'Employee' are not compatible\n```\n\
    \n在这个示例中，我们有 `Animal` 和 `Cat` 类，其中 `Cat` 是 `Animal` 的子类。我们还有一个新的 `Employee`。我们创建了这些类的实例并对它们进行赋值。\n\
    \n#### protected 修饰符\n\n`protected` 修饰符的作用与 `private` 类似，不同的是成员可以在子类中被访问。例如：\n\
    \n```typescript\nclass Animal {\n  protected name: string;\n  constructor(theName:\
    \ string) {\n    this.name = theName;\n  }\n}\n\nclass Cat extends Animal {\n\
    \  constructor() {\n    super(\"Cat\");\n  }\n}\n\nclass Employee {\n  protected\
    \ name: string;\n  constructor(theName: string) {\n    this.name = theName;\n\
    \  }\n}\n\nlet animal = new Animal(\"Goat\");\nlet cat = new Cat();\nlet employee\
    \ = new Employee(\"Jack\");\n\nanimal = cat;\nanimal = employee; // error: 'Animal'\
    \ and 'Employee' are not compatible\n```\n\n#### readonly 修饰符\n\n你可以通过 `readonly`\
    \ 关键字将属性变为只读。`readonly` 属性必须在声明时或在构造函数中初始化。\n\n```typescript\nclass Octopus {\n\
    \  readonly name: string;\n  readonly numberOfLegs = 8;\n\n\nconstructor(theName:\
    \ string) {\n    this.name = theName;\n  }\n}\n\nlet dad = new Octopus(\"Man with\
    \ the 8 legs\");\ndad.name = \"Man with the 3-piece suit\"; // error! name is\
    \ readonly.\n```\n\n#### 类型迭代修饰符\n\n通过使用可选 `+` 配合*类型修饰符*，我们可以创建更显式、易读的类型声明。我们还可以使用\
    \ `-`（减号）来移除属性的可选声明。例如：我们有一个接口；我们可以使用类型迭代修饰符使其所有属性都变为只读。\n\n```typescript\ninterface\
    \ ICar {\n  name: string;\n  age: number;\n}\n\ntype ReadonlyCar = {\n  readonly\
    \ [K in keyof ICar]: ICar[K];\n};\n```\n\n这种类型可能非常有用，例如对于 Redux 应用的状态，因为状态必须是不可变的。一旦对象被创建，我们不应该更改它的任何属性。类型迭代修饰符一直是语言的一项伟大补充，因为它们能够轻松扩展现有类型并对所有属性应用大规模更改。\n\
    \n现在，如果我们声明了两个汽车机器模型：第一个对象是可变的，另一个是只读的；然后尝试更改它们的数据，我们会发现在第二种情况下会出现错误。\n\n```typescript\n\
    const car: ICar = {\n  name: \"Mercedes\",\n```\n\n"
