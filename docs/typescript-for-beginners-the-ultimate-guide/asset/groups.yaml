    First, it should be noted that TS is a strongly typed and compiled language, which
    may be closer to programmers of Java, C#, and other strongly typed languages.
    Second, TS implements many concepts common to object-oriented languages, such
    as inheritance, polymorphism, access modifiers, and so on. Third, the potential
    of TS makes it faster and easier to maintain. Fourth, TS develops as an开源 project
    and, like many projects, is hosted on GitHub. In addition, it is cross-platform,
    which means we can use both Windows and Linux. At the same time, TS is a superset
    of JS, which means any JS program is a TS program. In TS, you can use all the
    constructs that are used in JS – the operators, conditional. Moreover, TS code
    is compiled in JS. Ultimately, TS is just a tool designed to make application
    development easier. Although this language does not provide additional functionality
    in the runtime, it offers a number of features that help developers write more
    reliable and easier-to-maintain code.


    ---


    ### How Does TS Help Developers Code Easier?


    As its name suggests, it adds a type system to JS. If in JS the type of a variable
    is assigned dynamically, then in TS we have to predefine its type immediately
    at the time of declaration. If we are talking about JS, then you can first assign
    an integer value to a variable, and then reassassign it to a string value.


    *let jsVar = 0;*

    *jsVar = "js";*


    In the case of TS, you can restrict this behavior by declaring the type for the
    variable explicitly. As a result, if you try, for example, to assign a string
    to a variable of number, an error will occur.


    *let tsVar: number = 0;*

    *tsVar = "ts"; // error


    ### How Exactly Does TS Improve JS?


    The lack of typing cannot be called a disadvantage of JS, but it gives programmers
    too much freedom, which inevitably leads to writing code with errors.


    *let aNumber = 123; aNumber = {*

    *name: "Sufyan",*

    *age: 29*

    *}*


    In the JS example above, nothing prevents the developer from presenting the object
    via the aNumber variable. This approach, although it will not cause the program
    to crash, will completely eliminate the possibility of self-documenting the code
    at the expense of variable names.


    TS easily solves this problem by defining the type of a variable when it is declared,
    without further assigning it to a value of another type.


    *let aNumber: number = 123;*

