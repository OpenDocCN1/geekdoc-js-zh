    *\": [\n        \"*\",\n        \"generated/*\"\n      ]\n    }\n  }\n}\n```\n\
    \n因此我们告诉编译器，对于每个导入语句匹配 \"*\" 模式的模块（即任何值），它必须在两个地方进行搜索：\n\n- \"*\"：意味着没有变化的相同名称，匹配\
