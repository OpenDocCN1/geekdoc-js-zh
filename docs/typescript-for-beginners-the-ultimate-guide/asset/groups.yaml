    TypeScript Architecture **167**


    write some unit tests using these frameworks, and then discuss the libraries for
    unit testing and methods for continuous integration.


    Test-driven development is a way to reflect on our code, which should be part
    of the standard development process. It is a development paradigm that starts
    with tests and drives the driving force of production code through these tests.
    Test-driven development is like asking a question: How do I know I’ve solved a
    problem? This is an important idea to understand. We are writing code to solve
    the problem, but we must be able to prove that we have solved the problem with
    the help of automated tests.


    The main stages of this approach are:


    - Writing a test that doesn’t pass

    - Running a test to make sure it doesn’t pass

    - Writing code to pass the test

    - Running a test to make sure it passes

    - Running all the tests to see that the new code doesn’t break the other one

    - Repetition


    Using test-driven development is really a way of thinking. Some developers follow
    this approach and write tests first, while others write their own code first,
    and then tests. Then, there are those who do not write tests at all. If you fall
    into the latter category, then I hope that the methods you will learn in this
    chapter will help you start working in the right direction.


    There are so many excuses not to write unit tests. For example, there was no question
    of a testing framework, or because of this, the development time will increase
    by 20%, or the tests are outdated, so we don’t run them anymore. The truth is
    that these days we can’t afford not to write tests. Applications grow in size
    and become more complex, and the requirements change over time. An application
    with a good set of tests can be changed much faster, and it will be much more
    resistant to future changes in requirements than an application that does not
    have tests. That is, when the real savings in unit testing costs become apparent.
    By writing unit tests for your application, you check its future and ensure that
    any change in the code base does not break the existing functionality. We also
    want to write our own applications, so that they stand the test of time. The code
    we are currently writing can be in a production environment for years, which means
    that sometimes you will have to make improvements or fix bugs in code that was
    written many years ago. If the application has a complete set of tests surrounding
    it, then changes can be made with confidence that these changes will not violate
    the existing functionality.


    Test-driven development in the JavaScript space also adds another layer to our
    code coverage. Quite often, development teams write tests designed only for the
    application logic on the server side.


    For example, in the Visual Studio space, these tests are often written only with
    a focus on the MVC framework, which consists of controllers, views, and basic
    business logic. It has always been quite difficult to test the application logic
    on the client side, in other words, the actual rendered HTML code and user interactions.


    Frameworks for testing JavaScript code provide us with tools to address this gap.
    Now we can start modularizing our visualized HTML code, as well as modeling user
    interactions, such as filling out forms and clicking a button. This additional
    layer of testing, combined with server-side testing, means that we have a way
    to unit test every layer of our application—from server-side business logic to
    server-side page rendering, all the way down to user interaction. This ability
    to perform unit testing of user interactions with the client side of the interface
    is one of the most powerful aspects of any MV*JavaScript framework. In fact, it
    may even affect the architectural decisions you make when choosing a technology
    stack.


    ## MODULE, INTEGRATION, AND ACCEPTANCE TESTINGS


    Automated testing can be divided into three main areas, or types of testing: module
    testing, integration testing, and acceptance testing. You can also describe these
    testing as testing from the “black box” or from the “white box.” White-box testings
    are those in which the internal logic or structure of the code under testing is
    known to the tester. Black-box testings, on the other hand, are those in which
    the internal design and/or logic is unknown to the tester.


    ### Module Testings


    A module testing is usually a white-box testing in which all the external interfaces
    of a code block are mocked or muted. If we are testing some code that, for example,
    performs an asynchronous call to load a JSON block, module testing of this code
    will require locking the returned JSON. This method ensures that the object under
    testing is always given a known set of data. When new requirements arise, this
    well-known data set can grow and expand, of course. The objects under testing
    should be designed to interact with interfaces, so that these interfaces can be
    easily mocked or silenced in a module testing scenario.


    ### Integration Testings


    Integration testings are another form of white-box testings that allow the object
    under testing to run in an environment close to real-world code. In our previous
    example, when some code executes an asynchronous call to load a JSON block, the
    integration testing actually needs to call the REST services that generate the
    JSON. If this REST service relies on data from the database, then the integration
    testing will require data in the database that matches the integration testing
    scenario. If we were to describe a module testing as having a boundary around
    the object under testing, then an integration testing is simply an extension of
    that boundary to include dependent objects or services.


    Creating automated integration testings for your applications will significantly
    improve the quality of your product. Consider the case of the scenario we used
    when a block of code calls the REST service for data in JSON format. Someone can
    easily change the structure of this data returned by the REST service. Our unit
    testings will still pass, as they don’t actually call the REST code on the server
    side, but our application will be messed up because the returned JSON doesn’t
    meet our expectations.


    Without integration testings, these types of errors will only be detected at later
    stages of manual testing. By thinking about integration testings, by implementing
    specific data sets for them, you can quickly eliminate such errors.


    ### Acceptance Testings


    Acceptance testings are black-box testings and are generally scenario-based. They
    can include logging in to the application, searching for specific data, updating
    data, and so on. Using the many tools available, we can also automate these acceptance
    tests so that they run as part of an automated test suite. The more acceptance
    tests a project has, the more reliable it will be. Note that in the test-driven
    development methodology, each error detected by the manual team should lead to
    the creation of new unit, integration, or acceptance tests.


    ## REFACTORING


    Refactoring is a systematic procedure for improving code without creating new
    functionality. Refactoring turns mess into clean code and simple design.


    As trivial as it may sound, refactoring in a large project is a complicated thing,
    especially if the tests in the project are not written for every function or are
    written in such a way that they do not cover the entire code base or use cases.
    Even by slightly changing the behavior of a function, you always run the risk
    of returning something from it or passing (forgetting to pass) something wrong
    to it. This case is more in the piggy bank of tests, but still with TypeScript
    you can be sure that the function returns the type that you specified and accepts
    exactly what you specified.


    ## TYPESCRIPT 4.2 RELEASE


    Microsoft has released TypeScript 4.2. This is the most recent update at the time
    of writing this book. In the quarterly update of the language, it is now possible
    to set the abstract modifier to the constructor signature and mark the variable
    as unused when the array is destructured. Tuple types now allow rest arguments
    at any position, and type aliases are no longer expanded when a hint is displayed.


    ## SUPPORT FOR REST ELEMENTS IN THE FIRST AND INTERMEDIATE PARAMETERS OF TUPLES
    OF TYPES


    The tuple syntax in TypeScript supports rest elements that are prefixed with [...]
    and can contain any number of parameters of the same type. Previously, rest parameters
    were put in the last position, so it was impossible to express tuple types that
    end with a fixed set of elements. Such tuple types are useful for strongly typed
    functions with lists of variable parameters that end with a fixed set of parameters.

