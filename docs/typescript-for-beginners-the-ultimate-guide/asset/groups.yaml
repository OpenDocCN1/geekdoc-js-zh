    \n通常应该避免这种隐藏，这样代码会更整洁。\n但在某些场景下，这种方法可能是解决问题的理想方案。你应该根据实际情况选择最佳解决方案。\n\n### 块级可见性的变量闭包\n\
    \n当我们第一次接触 `var` 声明的变量闭包时，我们简要查看了变量在闭包时的行为。为了更好地理解\n这一点，请想象每当出现一个新的作用域时，它都会为变量创建一个属于自己的“环境”。这个环境及其外部捕获的变量即使在作用域内的所有表达式执行完毕后仍然存在。\n\
    \n*function myFavoriteCity() {\n  let getCity;\n  if (true) {\n    let city =\
