    \ to what is obtained in the output. TypeScript has a set of additional flags\
    \ that can be used to inform the compiler about the transformations that occur\
    \ in the output.\n\n### BaseUrl\n\nThe `baseUrl` is often used in applications\
    \ that use AMD loaders. Setting `baseUrl` tells the compiler where to look for\
    \ modules. The value is defined as one of:\n\n- the value of the command-line\
    \ argument (if a path is passed);\n- the value of the `baseUrl` property in `tsconfig.json`\
    \ (if a path is passed).\n\nNote that setting `baseUrl` does not affect relative\
    \ import commands, as they are always resolved relative to the files.\n\n### Path\
    \ Mapping\n\nSometimes the modules are not directly under the `baseUrl`. For example,\
    \ the \"jquery\" module import command will be converted to \"node_modules/dist/jquery.js\"\
    . Loaders use the path configuration to match module names.\n\nTypeScript supports\
    \ declaring such mappings in the `paths` property of `tsconfig.json`. Here is\
    \ an example of how you can specify `paths` for jquery:\n\n```json\n{\n  \"compilerOptions\"\
    : {\n    \"paths\": {\n      \"jquery\": [\"node_modules/dist/jquery.ts\"]\n \
    \   }\n  }\n}\n```\n\nThe `paths` property allows you to use more complex mappings,\
    \ including multiple paths. Let’s look at a configuration in which only some modules\
    \ are available in one location, while the rest are located in another. When you\
    \ build, all these modules will be placed in one place. The project diagram may\
    \ look like this:\n\nprojectRoot\n├── folder1\n│   ├── file1.ts (imports 'folder1/file2'\
    \ and 'folder2/file3')\n│   └── file2.ts\n├── generated\n│   ├── folder1\n│  \
    \    └── folder2\n│       └── file3.ts\n└── tsconfig.json\n\nThe corresponding\
    \ `tsconfig.json` will look like this:\n\n```json\n{\n  \"compilerOptions\": {\n\
    \    \"baseUrl\": \".\",\n    \"paths\": {\n      \"*\": [\n        \"*\",\n \
    \       \"generated/*\"\n      ]\n    }\n  }\n}\n```\n\nSo we tell the compiler\
    \ that for each module whose import statement matches the \"*\" pattern (i.e.\
    \ any values), it must search in two places:\n\n- \"*\": meaning the same name\
    \ without changes, so match `moduleName` => `baseUrl/moduleName`\n- \"generated/*\"\
    : meaning the module name with the added prefix \"generated,\" so match `moduleName`\
    \ => `baseUrl/generated/moduleName`\n\nFollowing this logic, the compiler will\
    \ try to resolve the specified import instructions as follows:\n\n*import *‘ folder1/file2’*\n"
  mdcn: "\n\n## 118 TypeScript 入门\n\n相对导入以 `./`、`./` 或 `../` 开头。例如：\n\n*import Entry\
    \ from \"./components/Entry\";*\n\n*import { DefaultHeaders } from \"../constants/http\"\
    ;*\n\n*import \"/mod\";*\n\n任何其他导入都被视为非相对导入。例如：\n\n*import * as $ from \"jQuery\"\
    ;*\n\n*import { Component } from \"angular2/core\";*\n\n相对导入允许相对于被导入的文件进行解析，且不能通过声明外部模块来解析。相对导入最适合用于你的模块，这些模块在程序执行期间保证位于指定位置。\n\
    \n非相对导入可以相对于 `baseUrl` 或通过路径映射（path mapping）来解析，这将在下文中描述。也可以通过外部模块声明进行解析。在导入任何外部依赖时，使用非相对路径。\n\
    \n### 模块解析策略\n\n当 TypeScript 编译器在语句中看到非相对导入路径时，它必须在程序中找到要导入的文件，因为导入路径没有提供关于文件在磁盘上位置的必要信息。\n\
    \nTypeScript 编译器可以使用它的两种策略之一来查找此文件。这些策略是 Classic（经典）和 Node。Node 是 TypeScript 编译器使用的默认策略，大多数人倾向于使用它，因为大多数第三方模块都是\
    \ Node 模块。\n\n*经典策略（classic strategy）* 在 TypeScript 中仅为了与旧版本兼容。该策略仅在 TypeScript\
    \ 编译器检测到非相对导入时才起。\n\n这种 Node 策略来自 Node.js 的标准模块解析策略。它同时适用于相对和非相对导入。\n\n#### Classic\n\
    \n该策略曾被 TypeScript 默认采用。但现在仅为了向后兼容而保留。\n\n## 模块与命名空间\n\n相对导入将允许相对于被导入的文件进行。因此，源文件\
    \ `/root/src/folder/A.ts` 中的 `import { as b } from \"./ModuleB\"` 将搜索以下文件：\n\n\
    - `*/root/src/folder/moduleB.ts*`\n- `*/root/src/folder/moduleB.d.ts*`\n\n对于非相对模块导入，编译器将在目录树中搜索适当的定义文件，从包含导入文件的目录开始。\n\
    \n例如：来自 *ModuleB* 的非相对导入，如 `import { as b } from \"ModuleB\"`，位于源代码文件 `/root/src/folder/A.ts`\
    \ 中，将在以下位置搜索 *\"ModuleB\"*：\n\n- `*/root/src/folder/moduleB.ts*`\n- `*/root/src/folder/moduleB.d.ts*`\n\
    - `*/root/src/moduleB.ts*`\n- `*/root/src/moduleB.d.ts*`\n- `*/root/moduleB.ts*`\n\
    - `*/root/moduleB.d.ts*`\n- `*/moduleB.ts*`\n- `*/moduleB.d.ts*`\n\n#### Node\n\
    \n该策略复制了动态模块解析引擎 Node.js 的行为。请参阅模块文档 Node.js 中关于 Node 解析算法的完整描述。\n\n### Node.js\
    \ 如何解析模块？\n\n为了理解 TS 编译器将采取何种方式，了解一点 Node.js 模块至关重要。Node.js 的导入是通过调用 `require`\
    \ 函数执行的。Node.js 的行为取决于在 `require` 中指定的是相对路径还是非相对路径。\n\n使用相对路径通常并不困难。为了举说明，让我们来看\
    \ `/root/src/ModuleA.js`，它有如下导入语句 `var x = require(\"./ModuleB\");`。Node.js 按照以下顺序允许此导入：\n\
    \n1. 作为名为 `/root/src/ModuleB.js` 的文件，如果它存在。\n2. 作为 `/root/src/ModuleB` 目录，如果它包含定义了\
    \ \"main\" 模块的 `package.json`。在我们的示例中，如果 Node.js 找到了包含 `{\"main\": \"lib/MainModule.js\"\
    }` 的 `/root/src/ModuleB/package.json`，那么它将引用 `/root/src/moduleB/lib/mainModule.js`。\n\
    3. 如果 `/root/src/ModuleB` 目录包含一个名为 `index.js` 的文件，默认认为它是该目录的主模块。\n\n然而，非相对模块名的解析是以不同的方式执行的。Node\
