    import {assert, assertEquals} from \"https://deno.land/std@v0.42.0/testing/asserts.ts\"\
    ;\n\nDeno.test({\n  name: \"Test\",\n  fn: () => {\n    assertEquals(true, true);\n\
    \  },\n});\n```\n\n*Integration Testing*\n\nStarting your frontend code on Deno.\
    \ To do this, use:\n\ndeno test\n\n*Compiler API*\n\nDeno supports runtime access\
    \ to the built-in compiler. There are three methods in the Deno namespace that\
    \ provide this access:\n\n- compile(): this is if you called tsc via Node.js.\n\
    - bundle(): is the same as compile, except that instead of returning files, it\
    \ returns a single string, which is an ES module that includes all the code that\
    \ was included at the time of compilation.\n- transpileOnly(): is the same as\
    \ transpileModule in TS. All it does is “erase” any types from the modules and\
    \ generate JS.\n"
