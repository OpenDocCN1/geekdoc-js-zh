    \ ** 2 +\n      (point.y - Grid.origin.y) ** 2\n    );\n  }\n}\n\nconsole.log(Grid.calculateDistance({\
    \ x: 10, y: 20 }));\n```\n\n## 61 TS 核心概念\n\n### 抽象类 (Abstract Classes)\n\n抽象类是被其他类继承的基类。它们的实例不能直接创建。与接口不同，抽象类可以包含成员的实现细节。abstract\
