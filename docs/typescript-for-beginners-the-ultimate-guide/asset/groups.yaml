    \ 立即在 const *ReadOnlyCar* 中开始抛出错误。这是因为我们突然在这个新对象中缺少了一个必填属性。一旦我们添加了新的 *color* 字段，错误就会消失。\n\
    \n```typescript\nconst readOnlyCar: ReadonlyCar = {\n  name: \"BMW\",\n  age:\
