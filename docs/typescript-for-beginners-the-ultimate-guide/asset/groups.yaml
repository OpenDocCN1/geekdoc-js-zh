- md: "\n## 158 TypeScript for Beginners\n\n- Asks the view to visualize itself (generate\
    \ the actual HTML code based on the values in the model)\n- Attaches the resulting\
    \ HTML code to the DOM tree\n\nThe controller in MVC is also responsible for the\
