    TypeScript Architecture 153


    importantly, faster. The main advantages of Multi-Page Application (MPA) are:


    - **Easy SEO optimization:** The MPA architecture makes it quite easy to optimize
    each page for search engines.

    - **Easy development:** Typically, developing a multi-page application requires
    a smaller stack of technologies.

    - **Lots of solutions**.


    Each architecture has its own advantages and disadvantages and is well suited
    for a particular type of project. SPA is distinguished by its speed and the ability
    to develop a mobile application based on readymade code. But at the same time,
    SPA has poor SEO optimization. Thus, this architecture is an excellent approach
    for SaaS platforms, social networks, closed communities, where search engine optimization
    does not matter.


    MPA is more suitable for creating large online stores, business sites, catalogs,
    marketplaces, etc. A well-optimized MPA has high speed and performance, but still
    does not allow you to easily develop a mobile application. MPA and SPA with the
    right architecture are well suited for developing scalable web applications.


    ## CREATING AN APPLICATION IN TYPESCRIPT


    As an example, we will write a simple function that will output messages to the
    console.


    What a function should be able to do:


    - Output a message

    - Attach to the message any data that needs to be logged in

    - [Optional] Add a prefix to the message to understand which module outputs the
    log

    - [Optional] Color the message depending on the type: log (normal message), info
    (notification), warn (warning), error (error)


    *_log(message, arg, prefix, type);*


    154 TypeScript for Beginners


    Something like this:

    *_log(''Here is our id:'', 123);*

    *_log(''Here is our id:'', 123, ''info'');*


    ## MAKING AN APP


    Let’s create a new project, and in it a file logger.ts. As we have already found
    out, _log will have four parameters. Since TypeScript is a statically typed language,
    you need to describe the type of each argument:


    - message – string

    - arg – any

    - prefix – string

    - type – any


    You can create logs in any way, but for simplicity we will use readymade methods:
    log, info, warn, error. To protect yourself from passing any other types, do this,
    create a custom type:


    *type ConsoleMethod = ''log'' | ''info'' | ''warn'' | ''error'';*


    *function _log(message: string, args: any, prefix: string, type: ConsoleMethod
    = ''log''): void {*

    *prefix = prefix + '': '';*

    *message = prefix + message;*

    *console[log](message, args);*

    *}*


    // Example of call

    *_log(''Test logging message'', 123, ''Logger'', ''info'');*


    To do this, run the command in the project directory:

    *tsc logger.ts*


    If no errors occurred during compilation, the file should appear logger.js. At
    the same time, if somewhere in our application there is incorrect type, we will
    see a compilation error. Let’s replace the example call with an erroneous one:

    *_log(''Test logging message'', 123, ''Logger'', ''debug'');*


    That is, by strongly typing the arguments we protected ourselves from errors when
    calling our method. If you type all the methods of the application in this way,
    its stability will increase. In addition, the compiler will not allow you to build
    a script with syntax errors.


    ## COMPILATION: WATCH MODE


    To avoid running compilation manually each time, you can enable automatic recompilation
    when files are changed:

    *tsc *.ts --watch*


    ## ARCHITECTURE


    Many tasks that would normally be performed on the server side are performed on
    the client side in SPAs. This has led to an increase in the size of JavaScript
    applications and the need for more effective code organization. As a result, developers
    have started using some of the design patterns that have been successfully used
    in the back end over the past decade. These include the Model-View-Controller
    (MVC) design pattern and some of its derived versions, such as Model-View-ViewModel
    (MVVM) and Model-View-Presenter (MVP). Developers around the world have started
    some SPA frameworks that somehow try to implement the MVC pattern but don’t necessarily
    follow the MVC pattern. Most of these frameworks implement Models and Views, but
    since not all of them implement controllers, we call this family of frameworks
    MV*.


    ## MVC (MODEL VIEW CONTROL)


    The MVC pattern (Model-View-Controller or Model-State-Behavior) describes a simple
    way to build an application structure that aims to separate business logic from
    the user interface. As a result, the application is easier to scale, test, maintain,
    and of course implement.


    156 TypeScript for Beginners


    MVC is an architecture with three layers:


    - **Models:** Manage the data of an application. The models will be anemic (they
    will lack functionalities) since they will be referred to the services.

    - **Views:** A visual representation of the models.

    - **Controllers:** Links between services and views.


    ### Model


    The model in MVC provides the data. As a rule, this is a very simple POJO (Plain
    Old JavaScript Object – old Java object), which has certain properties. As an
    example of a model, consider the following TypeScript class:


    *interface IModel {*

    *DisplayName: string;*

    *Id: number;*

    *}*


    *class Model implements IModel {*

    *DisplayName: string;*

    *Id: number;*

    *constructor(model : IModel) {*

    *this.DisplayName = model.DisplayName;*

    *this.Id = model.Id;*

    *}*

    *}*


    *let firstModel = new Model({Id: 1, DisplayName: ''firstModel''});*


    Here, we have defined an interface called IModel, which has the properties Id
    and DisplayName, and a class that implements this interface. We have provided
    a simple constructor to set these properties. The last line of this fragment creates
    an instance of this class with the desired properties. As you can see from this
    snippet, the Model class is a very simple POJO that contains some data.


    ### View


    The view in MVC provides a visual representation of the model. In web frameworks,
    this will usually be a snippet of HTML code:


    *<div id="viewTemplate">*

    *<span> {Id} </span>*

    *<h1> {DisplayName}</h1>*

    *</div>*


    173 TypeScript Architecture 157


    There is a div tag here that contains two span tags. The contents of the first
    span tag are highlighted in bold and will display the Id property from the model.
    The content of the second span tag is the h1 header and displays the DisplayName
    property from the model. By separating the elements of the user interface view
    from the model, we can see that we can change the view as we like, even without
    using the model code. We can apply styles to each element using CSS, or even completely
    hide certain properties in the view. This separation gives us the ability to design
    or modify a part of the display regardless of the model. This design work can
    even be transferred to a completely separate and independent team with specialized
    skills in the field of user interface design. As long as the underlying model
    doesn’t change, both parts of the model and view will work together seamlessly.


    Let’s look at the following example:


    *class View {*

    *template: string;*

    *constructor(\_template: string) {*

    *this.template = \_template;*

    *}*

    *render(model: Model) {*

    *// Combining the template and the view;*

    *}

    *}*


    ### Controller


    The controller in the MVC framework does the job of coordinating the interaction
    between the model and the view. The controller usually performs the following
    steps:


    - Creates an instance of the model

    - Creates an instance of the view

    - Passes an instance of the model to the view

