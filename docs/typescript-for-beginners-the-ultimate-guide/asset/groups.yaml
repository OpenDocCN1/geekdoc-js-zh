- md: "\nTypeScript 31\n\nyou do something wrong. For example, let’s forget to specify\
    \ the public_address property.\n\n```typescript\nconst server: IServer = {\n \
    \ hostname: 'Pikachu',\n  location: 'RM1',\n  active: true\n}\n// Error → Type\
    \ '{ hostname: string; location: string; active: true; }' is not assignable to\
    \ type 'IServer'.\n// Property 'public_address' is missing in type '{ hostname:\
    \ string; location: string; active: true; }'.\n```\n\nThe compiler evaluated our\
    \ initiatives, but did not see the public_address property in our object, that\
    \ is why it shows an error.\n\nBut some structure cannot always be distinguished\
    \ using only one interface. Of course, in TS, you can use one interface as a type\
    \ for a property of another interface.\n\n```typescript\ninterface IPublicAddress\
    \ {\n  netmask: string;\n  gateway: string;\n  address: string;\n}\n\ninterface\
    \ IServer {\n  hostname: string;\n  location: string;\n  active: boolean;\n  public_address:\
    \ IPublicAddress;\n}\n```\n\nNote that in addition to primitive types and other\
    \ interfaces, you can describe functions in interfaces. This is done using arrow\
    \ functions, for example, like this:\n\n```typescript\ninterface IServer {\n \
    \ getPublicAddress: () => IPublicAddress;\n}\n```\n\nTypeScript for Beginners\
    \ 32\n\nAt the same time, no one forbids you to specify the parameters of the\
    \ function:\n\n```typescript\ninterface ICalculator {\n  sum: (a: number, b: number)\
    \ => number;\n}\n```\n\n### Extending Interfaces\n\nIn TS, you can only extend\
    \ interfaces, not inherit them. The extension is used if you need a new interface\
    \ to have not only all the properties of an interface, but also have additional\
    \ or unique properties for that interface.\n\n```typescript\ninterface IResponse\
    \ {\n  status: number;\n}\n\ninterface ISlackResponse extends IResponse {\n  ok:\
    \ boolean;\n}\n```\n\n### Indexed Types\n\nSometimes you may need to allow storing\
    \ in an object not only a preknown number of properties but also a variable, for\
    \ example, when you implement the interface of a cache. In this case, you don’t\
    \ know the name of the property, but you do know its type.\n\n```typescript\n\
    interface ICache {\n  size: number;\n  first: ICacheItem;\n  last: ICacheItem;\n\
    \  items: {\n    [item: string]: ICacheItem;\n  };\n}\n```\n\nNow you can write\
    \ any value to the items object that has a string type key and an ICacheItem type\
    \ value.\n\n### Interface Implementation\n\nIn the case of an object, you simply\
    \ assign a colon-separated variable to the interface you need as a type and implement\
    \ it. With classes, it is somewhat different – classes must implement interfaces.\
    \ If you forget to write an implementation of at least one method, the compiler\
    \ will throw an error. For example, we will write a cache interface that will\
    \ be implemented by the class.\n\n```typescript\ninterface ICacheItem {\n  mtime:\
    \ number;\n  content: string;\n}\n\ninterface IFileCache {\n  set: (key: string,\
    \ value: ICacheItem) => void;\n  get: (key: string) => ICacheItem;\n}\n\nclass\
    \ FileCache implements IFileCache {\n  store = new Map();\n  set(key: string,\
    \ value: ICacheItem): void {\n    this.store.set(key, value);\n  }\n  get(key:\
    \ string): ICacheItem {\n    return this.store.get(key);\n  }\n}\n```\n\nThe above\
    \ is the simplest example of implementing a class, from which it is not entirely\
    \ clear why an interface is needed here at all, when we could just create a class.\
    \ Let’s get this straight. After writing the interface, we can implement it as\
    \ many times as we like, for example, for the image storage cache or anything\
    \ else.\n\n### Discriminated Union Types\n\nWe put this type in the section of\
    \ interfaces, because it only applies to interfaces. Discriminated union type\
    \ returns a new type that contains only the properties that are present in all\
    \ interfaces.\n\nBelow are three interfaces that have one common property, the\
    \ type of which is represented as a string literal. This is the property that\
    \ will be represented in the new type.\n\n```typescript\ninterface Square {\n\
    \  kind: 'square';\n  size: number;\n}\n```\n\nTypeScript for Beginners 34\n\n\
    ```typescript\ninterface Rectangle {\n  kind: 'rectangle';\n  width: number;\n\
    \  height: number;\n}\n\ninterface Circle {\n  kind: 'circle';\n  radius: number;\n\
    }\n```\n\nNow let’s look at how we can use the discriminated union in practice.\
    \ As you probably already guessed, we will calculate the area of the shapes that\
    \ are described using the interfaces.\n\n```typescript\nfunction area(s: Square\
    \ | Rectangle | Circle): number {\n  switch (s.kind) {\n    case 'square': return\
    \ s.size * s.size;\n    case 'rectangle': return s.height * s.width;\n    case\
    \ 'circle': return Math.PI * s.radius ** 2;\n  }\n}\n```\n\nWe could also use\
    \ if to make the compiler understand which interface we are currently working\
    \ with.\n\n```typescript\nfunction area(s: Shape): number {\n  if (s.kind ===\
    \ 'square') {\n    return s.size * s.size;\n  }\n  // ...\n}\n```\n\nNow let’s\
    \ talk about the case when the function can take not only a square, rectangle,\
