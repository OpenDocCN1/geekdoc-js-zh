    \ typescript`\n\nIt is possible that TS was already installed earlier. In this\
    \ case, you can update it to the latest version using the command:\n\n`npm update\
    \ -g typescript`\n\n**140** TypeScript for Beginners\n\nTo check the version,\
    \ enter the command:\n\n`tsc -v`\n\n### Installing as a Visual Studio Plugin\n\
    \nIf we use Visual Studio, then when it is installed, all the necessary tools\
