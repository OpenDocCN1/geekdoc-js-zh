    \ \n    win: '${releaseUrl}/libtest_plugin.dll',\n    linux: '${releaseUrl}/libtest_plugin.so',\n\
    \  }\n};\n\nconst response = await Deno.openPlugin(pluginOptions);\nconsole.log(response);\n\
    ```\n\n*Debugging*\n\nDeno has built-in debugging, but at the time, VS Code does\
    \ not support it. To debug manually, you need to:\n\ndeno run --inspect\n\n##\
