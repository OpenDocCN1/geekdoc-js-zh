    \ method.\n- **Symbol.species:** A property that contains a function that serves\
    \ as a constructor for inherited objects.\n- **Symbol.split:** A method for regular\
    \ expressions that splits a string by the positions of matches with a regular\
    \ expression. Called by the *String.prototype.split* method.\n- **Symbol.toPrimitive:**\
    \ A method that turns an object into the corresponding primitive value. Called\
