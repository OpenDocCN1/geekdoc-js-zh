    ## TypeScript for Beginners


    3. **Basic TS Compiler:** The main task of the TS compiler is to manage the low-level
    mechanics of checking the type of code and converting it into valid JS code. The
    compiler uses static code analysis to reduce the chance of runtime errors. Typos
    in the code or passing the wrong type of argument to a function will cause the
    compiler to throw errors to warn us that something is wrong before we execute
    the code. This is extremely valuable, as even with the most complete set of tests,
    logical errors and extreme cases can cause the application to crash at runtime.
    TS ensures that the type definitions we create in the code are always used.


    4. **TypeScript Standalone Compiler, TSC:** The stand-alone TS compiler, often
    called tsc, is a high-level compiler that takes a TS file, .ts, and outputs a
    JS file, .js.


    5. **Language Service:** This component layer sits on top of the main TS compiler
    and provides the features needed to work in IDE and text editors: statement completion,
    code formatting and highlighting, syntax highlighting, and more. The language
    service also provides code refactoring: variable renaming, debugging, and incremental
    compilation.


    6. **Tool Integration:** TS offers type annotations that allow IDEs and text editors
    to perform comprehensive static code analysis. These annotations allow these tools
    to make smart suggestions, making the code much more predictable. In turn, IDEs
    and text editors can offer better auto-completion and refactoring of TS code.


    ### Basic TS Types


    TS is a statically typed language. The type cannot be changed during program execution.
    This allows you to reduce a large number of errors and identify many of them even
    at the compilation stage.


    TS has several simple data types: numbers, strings, structures, Boolean. It supports
    all types that are available in JS, complementing the convenient enum type.


    ### *Boolean*


    The most basic type is the Boolean true/false, which is called Boolean in JS and
    TS.


    ```typescript

    let isEnabled = true;

    let isAlive: boolean = false;


    console.log(isEnabled);

    console.log(isAlive);

    ```


    ### *Number*


    Unlike various object-oriented languages such as Java, C#, and C++, which provide
    different data types, such as int, float, and decimal, for storing a numeric value,
    TS has only one numeric data type, called number. A variable with the number data
    type can contain any numeric literal with floating, hexadecimal, and binary or
    octal values.


    ```typescript

    let decimal: number = 6;

    let hex: number = 0xf00d;

    let binary: number = 0b1010;

    let octal: number = 0o744;

    ```


    ### *String*


    Another important part of programs in web pages and servers is text data. As in
    other languages, TS uses the same “string” notation for such data. Like JS, TS
    uses double (") or single ('') quotes to frame text data.


    ```typescript

    let name: string = "bob";

    name = ''smith'';

    ```


    You can also use strings with templates, which can be multi-line and have built-in
    expressions. These strings are surrounded by back apostrophes or quotation marks
    (`) and inline expressions are denoted as ${expr}.


    ```typescript

    let name: string = ''Gene'';

    let age: number = 37;

    let sentence: string = `Hello, my name is ${ name }. I''ll be ${age + 1} years
    old next month.`;

    ```


    The equivalent of this sentence declaration:


    ```typescript

    let sentence: string = "Hello, my name is " + name + "\n\n" + "I’ll be " + (age
    + 1) + " years old next month.";

    ```


    ### *Array*


    TS, like JS, has arrays of values. The array type can be defined in one of two
    ways. The first is to denote the type of array elements before []::


    ```typescript

    let list: number[] = [1, 2, 3];

    ```


    The second way is to use the generalization Array<elemType>:


    ```typescript

    let list: Array<number> = [1, 2, 3];

    ```


    ### *Tuple*


    The Tuple type gives you the ability to declare an array with a known fixed number
    of elements that do not have to be of the same type. For example, you want to
    have the Tuple value as a pair of “string” and “number”:


    ```typescript

    // Declare a tuple type

    let x: [string, number];


    // Initialize it

    x = ["hello", 10]; // OK


    // Initialize it incorrectly

    x = [10, "hello"]; // Error

    ```


    When you get an element with a known index, the type of that element will be returned:


    ```typescript

    console.log(x[0].substr(1)); // OK

    console.log(x[1].substr(1)); // Error, ''number'' does *not* have ''substr''

    ```


    When an element with an index outside the known range is received, the Union type
    is returned:


    ```typescript

    x[3] = ''world''; // OK string type can be assigned (string | number)

    console.log(x[5].toString()); // OK, ''string'' and ''number'' both have the toString
    method

    x[6] = true; // Error, boolean is not (string | number)

    ```


    ### *Tuples Deconstruction*


    Since tuples use array syntax, they can be deconstructed de- or disassembled in
    two ways. The first one, using a simple array syntax, looks like this:


    ```typescript

    let [t1, t2] = tupleType;

    console.log(`t1: ${t1}`);

    console.log(`t2: ${t2}`);

    ```


    Here we simply write each property of the tuple variable to the console, referring
    to the index in the array, i.e., tupleType[0] and tupleType[1]. The output of
    this code will be as follows:


    ```

    tupleType[0]: test

    tupleType[1]: false

    ```


    So, we created a tuple with a string and a Boolean value and deconstructed it
    using array syntax. Note that since we use the array syntax, we can request the
    third property of this tuple: Since our tuple does not have a third property,
    tupleType[2] will be undefined, as can be seen from the output of this line of
    code:


    ```typescript

    console.log(tupleType[2]); // undefined

    ```


    This is clearly far from perfection. The best way to deconstruct a tuple is to
    use the array syntax to create the corresponding tuple on the left side of the
    assignment:


    ```typescript

    let [t1, t2, t3] = tupleType; // t3 will be undefined

    ```


    This method of deconstructing a tuple is preferred for a simple reason. we can’t
    define an array of elements that exceeds the number of properties in the tuple.
    Therefore, the code below will not work:


    ```typescript

    let [t1, t2, t3] = tupleType; // Error: Tuple type ''string, boolean'' with length
    ''2'' cannot be assigned to tuple with length ''3''

    ```


    ### *Optional Tuple Elements*


    Like function signatures, we can also have optional tuple elements. This is achieved
    with the help of ? in the tuple definition:


    ```typescript

    let optionalTuple: [string, boolean?];

    optionalTuple = ["test2", true];

    console.log(`optionalTuple: ${optionalTuple}`);

    optionalTuple = ["test"];

    console.log(`optionalTuple: ${optionalTuple}`);

    ```


    Here we have a specific variable named optionalTuple with a required string property
    and an optional Boolean property. Then we assign it the value ["test2", true]
    and write it to the console. After that, we assign the value ["test"] to the same
    tuple and write the value to the console. Since the second optionalTuple property
    is essentially optional, this code will be compiled cleanly and will produce,
    as expected, the following results:


    ```

    optionalTuple: test2,true

    optionalTuple: test

    ```


    ### *Enum*


    Enum is a special type borrowed from other languages like C#, C++, and Java that
    provides a solution to the special numbers problem. Enum binds a human-readable
    name for a specific number. As in languages like C#, the enum type is a more convenient
    way to give clear names to a set of numeric values.


    ```typescript

    enum Color {Red, Green, Blue};

    let c: Color = Color.Green;

    ```


    By default, enums start with 0. You can change this by directly specifying a value
    for one of the enum members. For example, we can start the previous example with
    1 instead of 0:


    ```typescript

    enum Color {Red = 1, Green, Blue};

    let c: Color = Color.Green;

    ```


    Or even set values for all members:


    ```typescript

    enum Color {Red = 1, Green = 2, Blue = 4};

    let c: Color = Color.Green;

    ```


    A convenient feature of enumerations is that you can also get the name of an enumeration
    member by passing its numeric value. For example, if we have a value of 2 and
    we want to see what it corresponds to in the Color enumeration described above,
    we can do it like this:


    ```typescript

    enum Color {Red = 1, Green, Blue};

    let colorName: string = Color[2];

    alert(colorName);

    ```

