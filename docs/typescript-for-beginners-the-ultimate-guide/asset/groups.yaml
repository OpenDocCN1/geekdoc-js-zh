    );\n  }\n}\n```\n\n抽象类中标记为 abstract的方法不包含实现，必须在派生类中实现。抽象方法的语法与接口方法相同。\n\n```typescript\n\
    abstract class Department {\n  constructor(public name: string) {}\n\n  printName():\
    \ void {\n    console.log(\"Department name: \" + this.name);\n  }\n\n  abstract\
