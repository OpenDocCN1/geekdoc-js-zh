    ] = new ZipCodeValidator();\nvalidators[\"Letters only\"] = new LettersOnlyValidator();\n\
    \n// 每一行，显示是否通过了每个验证器\nstrings.forEach(s => {\n  for (let name in validators)\
    \ {\n    console.log(`\"${ s }\" - ${validators[name].isAcceptable(s) ? \"matches\"\
    \ : \"does not match\"} ${name}`);\n  }\n});\n```\n\n可选模块加载及其其他高级场景\n\n在某些情况下，你可能只需要在特定条件下加载模块。在\
    \ TypeScript 中，你可以使用下面的示例来应用此技术或其他高级模块加载技术。这种技术可以直接调用模块加载器而不会丢失类型安全。\n\n编译器会确定每个模块是否在生成的\
    \ JavaScript 中在使用。如果模块 ID 仅存在于类型描述中，而从未未出现在表达式中，则不会为该模块生成对 `require` 调用。这种对未使用链接的忽略可以提高性能，并允许你组织模块的可选加载。\n\
    \n该示例的核心思想是 `import id = require(\"...\")` 命令可以访问该模块公开的类型。如下方的 `if` 块所示，动态调用了模块加载器（使用\
    \ `require`）。因此，应用了跳过未使用链接的优化，导致仅在需要时才加载模块。要使此技术生效，必须确保使用 `import` 定义的标识符仅用于类型描述（即：从不出现在将进入最终\
    \ JavaScript 的代码位置）。\n\n`typeof` 关键字用于支持类型安全。当 `typeof` 关键字在类型描述中使用时，会创建一个值类型（在此情况下为模块类型）。\n\
    \n**Node.js 中的模块动态加载**\n\n```typescript\ndeclare function require(moduleName:\
