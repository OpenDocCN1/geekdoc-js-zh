    \ To compile your project, enter:\n\n```bash\nau build\n```\n\nTo launch the Aurelia\
    \ app, enter:\n\n```bash\nau run\n```\n\n## ANGULAR\n\nAngular is an open-source\
    \ framework for creating frontend web applications. It is aimed at solving several\
