- md: "\n## 94 TypeScript for Beginners\n\nThey are defined using the const keyword,\
    \ which is placed before enum.\n\nUsing constant enumerations increases the performance\
    \ of the code, because instead of the enumeration element, the constant associated\
    \ with it is used.\n\n*const enum*\n\n*Directions*\n\n*{\n *Up,*\n *Down,*\n *Left,*\n\
    \ *Right*\n*}\n\n*let directions = [Directions.Up, Directions.Down, Directions.Left,\
    \ Directions.Right];*\n\nSuch enumerations should only have constant expressions,\
    \ and during compilation, references to the properties of the enumeration object\
    \ are replaced with values:\n\n*var Directions;*\n\n*(function (Directions) {\n\
    \ *Directions[Directions[\"Up\"]] = 0] = \"Up\";*\n *Directions[Directions[\"\
    Down\"]] = 1] = \"Down\";*\n *Directions[Directions[\"Left\"]] = 2] = \"Left\"\
    ;*\n *Directions[Directions[\"Right\"]] = 3] = \"Right\";*\n})(Directions || (Directions\
    \ = {}));*\n\n*let directions = [0, 1, 2, 3]; //Only values here!!!*\n\nIf we\
    \ make this enumeration normal, that is, remove const, we get:\n\n*let directions\
    \ = [Directions.Up, Directions.Down, Directions.Left, Directions.Right];*\n\n\
    Let’s take look at another example:\n\n*Const enum Directions {\n *Up\n *Down\n\
    \ *Right\n *Left\n*}\n\n## Key Concepts of TS 95\n\n*function someFunc(op: Directions)\
    \ {\n *switch (op) {\n *case Directions.Up:\n * // some action…\n *break;*\n *case\
    \ Directions.Down:\n * // some action…\n *break;\n *}\n}*\n\nNow, let’s see what\
    \ the someFunc function will look like after compilation:\n\n*function someFunc(op)\
    \ {\n *switch (op) {\n *case 0:\n *break;*\n *case 1:\n *break;*\n *}\n}*\n\n\
    As you can see, the corresponding constants were substituted instead of the enumeration\
    \ elements.\n\n### Declare Enums\n\n*declare enum Enum {\n *A = 1,*\n *B,*\n *C\
    \ = 2*\n*}\n\nSuch enumerations are defined using the declare keyword. They are\
    \ used to describe the form of existing enumerations.\n\nThe difference between\
    \ such enumerations is that if an element in such an enumeration does not have\
    \ an initializer, then it is considered evaluated. In normal enumerations, the\
    \ opposite is true.\n\n## 96 TypeScript for Beginners\n\nThe compiler will not\
    \ generate code for such enumerations. This can be useful when using third-party\
    \ libraries (for example, jQuery, in which a certain object is defined (for example,\
    \ $) when you need information about an object, but you don’t need to generate\
    \ code.\n\n### SYMBOLS\n\nECMAScript 2015 introduced the symbol type – a primitive\
    \ data type similar to number and string.\n\nValues of the *symbol* type are created\
    \ by calling the Symbol constructor.\n\n*let sym1 = Symbol();*\n*let sym2 = Symbol(\"\
    key\"); // Optional string key*\n\nThe symbols are unchangeable and unique.\n\n\
    *let sym2 = Symbol(\"key\");*\n*let sym3 = Symbol (\"key\");*\n*sym2 === sym3;\
    \ // false, symbols are unique*\n\nLike strings, symbols can be used as keys for\
    \ object properties.\n\n*let sym = Symbol();*\n*let obj = {\n *symsym]: \"value\"\
    \n};*\n*console.log(obj[sym]); // \"value\"*\n\nSymbols can be used together with\
    \ evaluated properties to declare object properties and class members:\n\n*const\
    \ getClassNameSymbol = Symbol();*\n*class C {\n *getClassNameSymbol](){\n *return\
    \ \"C\";\n *}\n}*\n\n*let c = new C();*\n*let className = c[getClassNameSymbol]();\
    \ // \"C\"*\n\n## Key Concepts of TS 97\n\nIn addition to user-defined characters,\
