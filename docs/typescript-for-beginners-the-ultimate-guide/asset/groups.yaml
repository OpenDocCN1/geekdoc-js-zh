    \ `this` 的错误使用。\n\n原则上 true，对象方法需要访问存储在对象中的信息，以便对其执行任何操作（根据方法的目的）。例如，`user.SayHi()`\
    \ 内部的代码可能需要存储在 `user` 对象中的名称。要访问对象内部的信息，方法可以使用 `this` 关键字。`this` 的值是用于调用方法的点之前的那个对象。\n\
    \n```javascript\nlet user = {\n  name: \"John\",\n  age: 30,\n  SayHi() {\n  \
