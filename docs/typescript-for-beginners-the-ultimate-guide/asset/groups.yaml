- md: "\n## Key Concepts of TS 83\n\n### GENERICS\n\nOne of the most important aspects\
    \ of software development is the creation \nof components with a well-designed\
    \ structure and API. But an equally \nimportant part is the ability to reuse these\
    \ components. Components that \ncan work with different data sets provide developers\
    \ with additional capabilities\nwhen designing large and complex systems.\n\n\
    In languages such as Java or C#, one of the main ways to create reusable \ncomponents\
    \ is to use generics. Generalizations allow the component to \nwork with different\
    \ types of data, depending on the needs of developers.\n\n### Exploring the World\
    \ of Generics\n\nTo begin with, we will create the first function that is traditional\
    \ for \nacquaintance with generalizations: the identity function. Such a function\
    \ \nreturns exactly what was passed to it. You can think of it the same way as\
    \ \nthe echo command.\n\n```typescript\nfunction identity(arg: number): number\
    \ {\n  return arg;\n}\n```\n\nOf course, in TS, we can specify any so that the\
    \ function can be used for \nany data type:\n\n```typescript\nfunction identity(arg:\
    \ any): any {\n  return arg;\n}\n```\n\nWe can say that this function is a generalization,\
    \ since it can work with \nany type of data. But in this case, we have absolutely\
    \ no information about \nthe type of the returned value. For example, we pass\
    \ a number as an arg, \nbut we don’t know anything about the specific type that\
    \ the function will \nreturn, since it is any.\n\nWhen using generalizations,\
    \ we can explicitly specify the type of the \nargument and thus, within the framework\
    \ of our example, determine the \ntype of the return value. To do this, we need\
    \ to use a special type variable \nthat only works with data types, not their\
    \ values:\n\n```typescript\nfunction identity<T>(arg: T): T {\n  return arg;\n\
    }\n```\n\n## 84 TypeScript for Beginners\n\nWe added a variable of type T to our\
    \ function. This variable allows us to \nspecify a specific type when using the\
    \ function. In addition, we also speci\nspecified the type of the return value.\
    \ And now we know that the function will \nreturn the result with the same data\
    \ type as the passed argument.\n\nNow let’s see how you can use our function.\
    \ There are two ways to do \nthis. Consider the first one:\n\n```typescript\n\
    let numberOutput = identity<Number>(1);\nlet wrongOutput = identity<Number>(\"\
    sdf\"); // Compilation error. Invalid data type for the argument\nlet stringOutput\
    \ = identity<String>(\"String\");\nconsole.log(numberOutput); // outputs \"1\"\
    \nconsole.log(stringOutput); // outputs \" String\"\n```\n\nWhen calling the function\
    \ in angle brackets < >, we explicitly specified the \ndata type that the function\
    \ will work with.\n\nThe second method is not to specify the data type in angle\
    \ brackets, but \nsimply pass the variable as an argument to the function. In\
    \ this case, TS \nuses a mechanism called automatic type inference, according\
    \ to the value \npassed as an argument.\n\n```typescript\nlet numberOutput = identity(1);\n\
    let stringOutput = identity (\"String\");\nconsole.log(numberOutput); // outputs\
    \ \" 1 \"\nconsole.log(stringOutput); // outputs \" String\"\n```\n\nThe second\
    \ method, on the one hand, makes the code shorter and easier \nto read, but on\
    \ the other hand, it can lead to errors. After all, in this case, \nyou can pass\
    \ a value to the function that is not expected there, and this can \nlead to an\
    \ error at runtime.\n\n### Working with Generalized Type Variables\n\nWhen using\
    \ generalizations, the compiler assumes that the generalized \nparameters passed\
    \ to the function are used correctly. In fact, the compiler \ntreats them as “any\
    \ data type” or any.\n\nLet’s look at the function from the previous section again:\n\
    \n```typescript\nfunction identity<T>(arg: T): T {\n  return arg;\n}\n```\n\n\
    ## 85 Key Concepts of TS \n\nWhat if you need to output the length of the arg\
    \ argument to the console \nevery time the function is called? You may be tempted\
    \ to write like this:\n\n```typescript\nfunction loggingIdentity<T>(arg: T): T\
    \ {\n  console.log(arg.length); // Error: T has no .length property\n  return\
    \ arg;\n}\n```\n\nIf you do this, the compiler will throw an error telling you\
    \ what is being \nused the *.length of the arg object, although it was never specified\
    \ that the \nobject has such a property. Earlier it was said that a type variable\
    \ means \nabsolutely any type, so a number that does not have a property could\
    \ also be \npassed to the function *.length*.\n\nLet’s assume that the function\
    \ should actually work with arrays of T \nobjects, and not with the T objects\
    \ themselves directly. Since it will deal \nwith arrays, they must have a property\
    \ .length. You can describe it as if we \nare creating an array:\n\n```typescript\n\
    function loggingIdentity<T>(arg: T[]): T[] {\n  console.log(arg.length); // Array\
    \ has .length, so there is no error\n  return arg;\n}\n```\n\nThe *loggingIdentity\
    \ type is read as “a generalized function that takes \ntype parameter T and an\
    \ argument, which is an array, and returns an array of \nobjects. If an array\
    \ is passed to the function, the result will also be \nnumbers, since T become\
    \ number. This allows us to use the type variable \nrather than just as part of.\
    \ Alternatively, you can write this in the following:\n\n```typescript\nfunction\
    \ loggingIdentity<T>(arg: T[]): T[] {\n  console.log(arg.length); // Array has\
    \ .length, so there is no error\n  return arg;\n}\n```\n\n## 86 TypeScript for\
    \ Beginners\n\n### Generalized Types\n\nIn using generalizations, the compiler\
    \ assumes that the generalized \nparameters passed to the function are used correctly.\
    \ In fact, the compiler \ntreats them as “any data type” or any.\n\nYou may have\
    \ already encountered this kind of type in other languages. In the \nnext section,\
    \ we will discuss how to create your own types.\n\nDefining a generic function\
    \ is very similar to defining a regular function. \nThe only difference is that\
    \ you need to specify the type just like when \ncreating a function:\n\n```typescript\n\
    function identity<T>(arg: T): T {\n  return arg;\n}\nlet myIdentity: (arg: T)\
    \ => T;\n```\n\nA different name could be used for standard parameter, but it\
    \ is only \nimportant that the number of parameters and how they are used are\
    \ consistent.\n\n```typescript\nfunction identity<T>(arg: T): T {\n  return arg;\n\
    }\nlet myIdentity: <U>(arg: U) => U;\n```\n\nYou can also write a generic type\
    \ as a call signature on the type of an \nobject:\n\n```typescript\nfunction identity<T>(arg:\
    \ T): T {\n  return arg;\n}\nlet myIdentity: {<T>(arg: T): T};\n```\n\n## 87 Key\
    \ Concepts of TS\n\nThis brings us to the description of the first generalized\
    \ interface. Let’s \ntake the object literal from the previous example and turn\
    \ it into interface:\n\n```typescript\ninterface GenericIdentityFn {\n  <T>(arg:\
    \ T): T;\n}\nfunction identity<T>(arg: T): T {\n  return arg;\n}\nlet myIdentity:\
    \ GenericIdentityFn = identity;\n```\n\nMoreover, we can specify a generic type\
    \ for the entire interface, which will \nmake this parameter available to all\
    \ its methods. After that, we can use \na generalized version of the interface,\
    \ specifying a specific data type (for \nexample, Dictionary<string> instead of\
    \ Dictionary):\n\n```typescript\ninterface GenericIdentityFn<T> {\n  (arg: T):\
    \ T;\n}\nfunction identity<T>(arg: T): T {\n  return arg;\n}\nlet myIdentity:\
    \ GenericIdentityFn<number> = identity;\n```\n\nNote that the example was transformed\
    \ into something completely different. \nInstead of describing a generalized function,\
    \ it is now an ordinary, \nnon-generalized function that is part of a generalized\
    \ type. When using \nGenericIdentityFn, you will now have to specify the appropriate\
    \ type argument\n(in this case, number), thus fixing the types that the corresponding\n\
    function will use. Understanding when a type parameter should be added to the\
    \ \ncall signature and when to the interface itself is useful when describing\
    \ \nwhich aspects of the type are generalized.\n\nIn addition to generic interfaces,\
    \ you can also create generic classes. \nNote that you cannot create generic enumerations\
    \ and namespaces.\n"
  mdcn: "\n\n## TS 83 核心概念\n\n### 泛型 (GENERICS)\n\n软件开发最重要的方面之一是创建具有良好结构和 API 的组件。但同样重要的部分是复用这些组件的能力。能够与不同数据集共同工作的组件，在设计大型复杂系统时为开发者提供了额外的能力。\n\
    \n在 Java 或 C# 等语言中，创建可复用组件的主要方法之一是使用泛型。泛化允许组件根据开发者的需求与不同类型的数据进行工作。\n\n### 探索泛型的世界\n\
    \n首先，我们将创建一个传统上用于熟悉泛化的第一个函数：恒等函数（identity function）。该函数准确地返回传递给它的内容。你可以将其类比为 `echo`\
    \ 命令。\n\n```typescript\nfunction identity(arg: number): number {\n  return arg;\n\
    }\n```\n\n当然，在 TS 中，我们可以指定 `any`，以便该函数可以用于任何数据类型：\n\n```typescript\nfunction identity(arg:\
    \ any): any {\n  return arg;\n}\n```\n\n我们可以说这个函数是一个泛化，因为它可以处理任何类型的数据。但在这种情况下，我们对返回值的类型一无所知。例如，我们传递了一个数字作为\
    \ `arg`，但我们不知道函数将返回的具体类型，因为它是 `any`。\n\n在使用泛化时，我们可以显式地指定参数的类型，从而在我们的示例框架内确定返回值的类型。为了做到这一点，我们需要使用特殊的类型变量，它只对数据类型有效，而对值无效：\n\
    \n```typescript\nfunction identity<T>(arg: T): T {\n  return arg;\n}\n```\n\n\
    ## 84 初学者级 TypeScript\n\n我们在函数中添加了一个类型为 `T` 的变量。这个变量允许我们在使用函数时指定特定的类型。此外，我们还指定了返回值的类型。现在我们知道函数将返回与传递的参数相同数据类型的结果。\n\
    \n现在让我们看看如何使用我们的函数。这里有两种方法。考虑第一种：\n\n```typescript\nlet numberOutput = identity<Number>(1);\n\
    let wrongOutput = identity<Number>(\"sdf\"); // 编译错误。参数的数据类型无效\nlet stringOutput\
    \ = identity<String>(\"String\");\nconsole.log(numberOutput); // 输出 \"1\"\nconsole.log(stringOutput);\
    \ // 输出 \" String\"\n```\n\n在角括号 `< >` 中调用函数时，我们显式指定了函数将处理的数据类型。\n\n第二种方法不在角括号中指定数据类型，而是简单地将变量作为参数传递给函数。在这种情况下，TS\
    \ 使用了一种名为“自动类型推断”的机制，根据传递的参数的值来判断。\n\n```typescript\nlet numberOutput = identity(1);\n\
    let stringOutput = identity (\"String\");\nconsole.log(numberOutput); // 输出 \"\
    \ 1 \"\nconsole.log(stringOutput); // 输出 \" String\"\n```\n\n第二方法一方面让代码更短且更易读，另一方面可能会导致错误。毕竟，在这种情况下，你可以向函数传递一个并非预期的值，这可能导致运行时错误。\n\
    \n### 使用泛型类型变量\n\n在使用泛化时，编译器假设传递给函数的泛化参数被正确地使用了。事实上，编译器将它们视为“任何数据类型”或 `any`。\n\
    \n让我们再次看看上一个节中的函数：\n\n```typescript\nfunction identity<T>(arg: T): T {\n  return\
    \ arg;\n}\n```\n\n## 85 TS 核心概念\n\n如果你需要每次调用函数时都向控制台输出 `arg` 参数的长度会怎样？你可能会忍不住这样写：\n\
    \n```typescript\nfunction loggingIdentity<T>(arg: T): T {\n  console.log(arg.length);\
    \ // 错误：T 没有 .length 属性\n  return arg;\n}\n```\n\n如果你这样做，编译器将抛出错误，告诉你正在使用 `arg`\
    \ 对象的 *.length*，尽管从未指定过该对象具有此类属性。之前提到类型变量意味着绝对的任何类型，因此一个没有属性的数字也可以被传递给函数 *.length*。\n\
    \n假设该函数实际上应该与 `T` 对象的数组工作，而不是直接与 `T` 对象本身工作。由于它处理的是数组，它们必须拥有 `.length` 属性。你可以将其描述为我们正在创建一个数组：\n\
    \n```typescript\nfunction loggingIdentity<T>(arg: T[]): T[] {\n  console.log(arg.length);\
    \ // 数组有 .length，所以没有错误\n  return arg;\n}\n```\n\n*loggingIdentity 类型被读为“一个泛化函数，接受一个类型参数\
    \ T 和一个参数（数组），并返回一个对象数组。如果向函数传递一个数组，结果也将是数字，因为 T 变成了数字。这允许我们使用类型变量，而不仅仅是作为一部分。*\
    \ 或者，你可以按照以下方式编写：\n\n```typescript\nfunction loggingIdentity<T>(arg: T[]): T[]\
    \ {\n  console.log(arg.length); // 数组有 .length，所以没有错误\n  return arg;\n}\n```\n\
    \n## 86 初学者级\n\n### 泛化类型\n\n在使用泛化时，编译器假设传递给函数的泛化参数被正确使用。事实上，编译器将它们视为“任何数据类型”或\
    \ `any`。\n\n你可能已经在其他语言中遇到过这种类型。在接下来的章节中，我们将讨论如何创建自己的类型。\n\n定义泛型函数与定义普通函数非常相似。区别在于你需要像创建函数一样指定类型：\n\
    \n```typescript\nfunction identity<T>(arg: T): T {\n  return arg;\n}\nlet myIdentity:\
    \ (arg: T) => T;\n```\n\n可以使用不同的名称，但重要的是参数的数量及其使用方式是一致的。\n\n```typescript\nfunction\
    \ identity<T>(arg: T): T {\n  return arg;\n}\nlet myIdentity: <U>(arg: U) => U;\n\
    ```\n\n你也可以在对象的类型上将泛型写为调用签名：\n\n```typescript\nfunction identity<T>(arg: T): T\
    \ {\n  return arg;\n}\nlet myIdentity: {<T>(arg: T): T};\n```\n\n## 87 TS 核心概念\n\
    \n这引出了泛化接口的描述。让我们把上一个示例中的对象字面量转换为接口：\n\n```typescript\ninterface GenericIdentityFn\
    \ {\n  <T>(arg: T): T;\n}\nfunction identity<T>(arg: T): T {\n  return arg;\n\
    }\nlet myIdentity: GenericIdentityFn = identity;\n```\n\n此外，我们可以为整个接口指定泛型类型，这将使所有方法可用。之后，我们可以使用接口的泛化版本，指定特定的数据类型（例如使用\
    \ `Dictionary<string>` 而不是 `Dictionary`）：\n\n```typescript\ninterface GenericIdentityFn<T>\
    \ {\n  (arg: T): T;\n}\nfunction identity<T>(arg: T): T {\n  return arg;\n}\n\
    let myIdentity: GenericIdentityFn<number> = identity;\n```\n\n注意，示例已转变为完全不同的东西。它不再描述一个泛化函数，而是一个属于泛化泛的普通、非泛化函数。在使用\
    \ `GenericIdentityFn` 时，你现在必须指定相应的类型参数（在本例中为 `number`），从而固定相应函数将使用的类型。理解何时将类型参数添加到调用签名以及何时添加到接口本身，对于描述类型的哪些方面是泛化的是非常用的。\n\
    \n除了泛型接口外，你还可以创建泛型类。注意你不能创建泛型枚举和命名空间。\n\n"
