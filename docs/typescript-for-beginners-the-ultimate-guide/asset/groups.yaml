    ## 14 入学者 TypeScript


    ### 枚举 (Enumerations)


    在底层（生成的 JS）中，TS 会为这些每个人类可读的枚举值分配一个数值。在这个示例中，枚举 `DoorState.Open` 的值将等于数值 0。同样，`DoorState.Closed`
    的值将等于数值 1，而枚举 `DoorState.Ajar` 的值将等于 2。让我们快速查看将如何使用这些枚举值：


    *var openDoor = DoorState.Open;*


    *console.log(''openDoor is: ${openDoor}'');*


    在这里，代码段的第一行创建了一个名为 `openDoor` 的变量，并将其值设置为 `DoorState.Open`。第二行简单地将 `openDoor`
    变量的值写入控制台。输出如下：


    *openDoor is: 0*


    这清楚地表明 TS 编译器已经将 `DoorState.Open` 枚举的值替换为了数值 0。


    现在，让我们用稍微不同的方式来使用这个枚举：


    *var closedDoor = DoorState["Closed"];;*


    *console.log(''closedDoor is: ${closedDoor}'');*


    这段代码使用字符串值“Closed”来搜索枚举类型，并将结果枚举值赋值给 `closedDoor` 变量。这段代码的输出如下：


    *closedDoor is: 1*


    这个示例清楚地显示，`DoorState.Closed` 的枚举值与 `DoorState ["Closed"]` 的枚举值是组合，因为在两种情况下返回的都是数值
    1。枚举是为特殊数字定义易于记忆、易于阅读名称的方便方法。在代码中使用人类可读的枚举，而不是到处抛洒各种特殊数字，使得代码的意图更加清晰。在整个应用程序中使用名为
    `DoorState.Open` 或 `DoorState.Closed` 的值，比记住为 Open 设置为 0、为 Closed 设置为 1、为 Ajar
    设置为 3 要得多。除了让我们的 TypeScript 代码更可读、更易理解之外，使用数字在每次这些特殊数值发生变化时也能保护我们的代码库，因为它们都定义在一个地方。关于枚举，我最后想提到的一点是，如果有必要，我们可以手动设置数值，如下：


    *enum DoorState {*

    *Open = 3,*

    *Closed = 7,*

    *Ajar = 10*

    *}*


    在这里，我们重新定义了默认枚举值，将 `DoorState.Open` 等于 3，`DoorState.Closed` 等于 7，`DoorState.Ajar`
    等于 10。


    ### 字符串枚举 (String Enums)


    枚举类型的另一种变体是字符串枚举，其中数值被替换为字符串：


    *enum DoorStateString {*

    *Open = "open",*

    *Closed = "closed",*

    *Ajar = "ajar"*

    *}*


    *var openDoorString = DoorStateString.Open;*


    *console.log(''openDoorString = ${openDoorString}'');*


    在这里我们有一个名为 `DoorStateString` 的枚举，其中每个枚举值现在都是 string 类型。这段代码的输出如下：


    *openDoorString = open*


    正如预期的那样，TS 编译器返回了字符串“open”。


    ### Any


    在编写应用程序时，我们可能需要描述我们未知的变量类型。这些值可以从动态内容获取，例如来自用户或第三方库。在这种情况下，我们希望禁用类型检查，并允许值在编译时通过验证。要做到这一点，你需要使用
    `any` 类型：


    *let not be sure: any = 4;*


    *notSure = " maybe a string instead";*


    *notSure = false; // ok, 这绝对是布尔*


    `any` 类型是与现有 JS 工作的一种强大方式，它允许你在编译时逐渐包含越来越多的类型检查。你可以预期 `Object` 扮演与它在其他语言中相同的角色。但
    `Object` 类型的变量只允许你为它们分配任何值。你不能从它们调用未声明的方法，即使是那些可能在程序执行阶段存在的方法：


    *let looselyTyped: any = 4;*


    *// OK, 如果 ifItExists 可能会在运行时存在*

    *looselyTyped.ifItExists();*


    *// OK, toFixed 存在（但编译器不检查）*

    *looselyTyped.toFixed();*


    *let strictlyTyped: unknown = 4;*

    *strictlyTyped.toFixed();*


    如果你知道变量类型的部分而不是全部，`any` 类型也很有用。例如，你可以拥有一个包含不同类型元素的数组：


    *let list: any[] = [1, true, "string"];*


    ### Void


    `Void` 是 `Any` 的反面。它通常用作不返回值的函数的返回类型。


    *function warnUser(): void {*

    *alert("This is warning");*

    *}


    声明 `void` 类型的变量是没有用的，因为它们只能被赋值为空。


    ### Null 和 Undefined (空与未定义)


    `Null` 和 `Undefined` 类型对应于 JS 中的相同类型。默认情况下，它们是所有类型的子类型。注意的是，如果你使用 `strictNullChecks`
    编译器指令，`null` 和 `undefined` 只能被赋予相同的类型。另一方面，不存在一种可以被赋值任何内容的类型。


    ### Never


    `never` 类型表示永远不会出现的类型。例如，`never` 是一个总是抛出异常或永远不会退出的函数（例如无限循环）的类型。`never` 是 `any`
    类型的子类型。`never` 变量可以赋值给任何类型。然而，该类型不能被除 `never` 之外的任何类型赋值。


    *function error(message: string): never {*

    *throw new Error(message);*

    *}


    // fail() 的输出类型是 never

    *function fail() {*

    *return error("Something failed");*

    *}


    // 从此函数不会退出

    *function infiniteLoop(): never {*

    *while (true) {*

    *}

    *}


    ### Symbol


    `Symbol` 类型是原始类型，对应于 JS 中的相同类型。该类型提供了唯一的标识符，可以作为对象属性的键。`Symbol` 类型的值实现了一个全局 `Symbol`
    对象，该对象包含一组可以作为函数调用的方法和属性。


    *var secretKey = Symbol();*


    *var obj = {};*


    *obj[secretKey] = "secret message"; // 属性使用*

    *obj[Symbol.toStringTag] = "test";*


    ### 类型断言 (Type Assertions)


    有时你会发现自己比 TS 更了解变量值的情况。这通常发生在你知道某个实体的类型可能比当前类型更具体时。类型断言（Type assertion）就像其他语言中的类型转换（Typecasting），但它没有进行任何特殊的检查或数据重构。类型转换在程序的执行阶段没有影响，仅供编译器使用。TS
    假设程序员会进行所有必要的检查。


    类型转换可以通过两种方式完成。第一种是使用尖括号语法：


    *let someValue: any = "this is a string";*


    *let strLength: number = (<string>someValue).length;*


    '
