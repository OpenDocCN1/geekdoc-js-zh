    \ undefined. With some effort, you can use the *this* parameter to\nprevent such\
    \ errors. First, the library developer must accompany the type\nof the callback\
    \ function with the *this* parameter:\n\n```typescript\ninterface UIElement {\n\
    \  addClickListener(onclick: (this: void, e: Event) => void): void;\n}\n```\n\n\
    *this: void* means that *addClickListener* assumes that the onclick function\n\
    does not require this. Secondly, the code that is called must also be accom­accompanied\
    \ by the *this* parameter:\n\n```typescript\nclass Handler {\n  info: string;\n\
    \  onClickBad(this: Handler, e: Event) {\n    // this is used here! The function\
    \ will crash\n    // at runtime!\n    this.info = e.message;\n  };\n}\nlet h =\
    \ new Handler();\nuiElement.addClickListener(h.onClickBad); // error!\n```\n\n\
    When this is specified, it explicitly reflects the fact that *onClickBad* must\n\
    be called on an instance of the Handler class. Now TS will detect that\naddClickListener\
    \ requires a function with *this: void*. To fix this error,\nchange the *this*\
    \ type:\n\n```typescript\nclass Handler {\n  info: string;\n  onClickGood(this:\
    \ void, e: Event) {\n    // you can’t use this variable here\n    // because it\
    \ has void!\n    console.log('clicked!');\n  }\n}\nlet h = new Handler();\nuiElement.addClickListener(h.onClickGood);\n\
    ```\n\nSince the *onClickGood* function specifies that the type of this is void,\n\
    can be passed to *addClickListener*. But if you need both, you will have to use\
    \ the arrow function:\n\n```typescript\nclass Handler {\n  info: string;\n  onClickGood\
    \ = (e: Event) => {this.info = e.message}\n}\n```\n\nThis will work because arrow\
    \ functions do not capture this from which they are executed, and they can be\
    \ freely passed where a function with *this: void* is expected. The disadvantage\
    \ of this is that for each object, its own arrow function will be created. Methods,\
    \ on the other hand, are created only once, are associated with Handler prototype,\
    \ and are common to all objects of this class.\n\n**80** TypeScript for Beginners\
    \ Overloads\n\nTS supports function overloading, meaning we can define multiple\
    \ versions of a function that will have the same name, but different types or\
    \ different number of parameters. For overloading, we first define all versions\
    \ of the function that will not have logic. And then we define a version of the\
    \ function with a common signature that fits all previously defined options. In\
    \ this general version, we already define the specific logic of the function.\n\
    \nFor example, we need to combine two values, but if they represent strings, then\
    \ concatenate them, and if numbers, then add them. Then we could use the following\
    \ function:\n\n```typescript\nfunction add(x: string, y: string): string;\nfunction\
    \ add(x: number, y: number): number;\nfunction add(x: any, y: any): any {\n  return\
    \ x + y;\n}\nlet result1 = add(5, 7);\nconsole.log(result1); // 12\nlet result2\
    \ = add(\"5\", \"7\");\nconsole.log(result2); // 57\n```\n\nThe first version\
    \ of the add function takes two strings and returns a string, the second version\
    \ takes two numbers and returns a number. Common to them is a function that takes\
    \ parameters of type any and returns a result of type any as well. But if we applied\
    \ the same function to boolean values:\n\n```typescript\nlet result3 = add(true,\
    \ false);\nconsole.log(result3);\n```\n\nThen we would get an error, since two\
    \ versions of the function allow you to take two strings or two numbers. And in\
    \ this case, we would need to add another version of the function for boolean\
    \ values:\n\n```typescript\nfunction add(x: boolean, y: boolean): boolean;\n```\n\
    \nJavaScript is by its very nature a very dynamic language. It is uncommon to\
    \ find functions that return objects of different types depending on the arguments\
    \ passed.\n\n**81** Key Concepts of TS\n\n```typescript\nlet suits = [\"hearts\"\
