  md: "Key Concepts of TS    ◾   ** 73**\n\n*let result2 = buildName(\"Sam\", \"Adams\"\
    , \"Sr.\"); // *\n\n*error, too many parameters*\n\n*let result3 = buildName(\"\
    Sam\", \"Adams\"); // *\n\n*works and returns \"Bob Adams\"*\n\n*let result4 =\
    \ buildName(undefined, \"Adams\"); // *\n\n*works and returns \"Will Adams\"*\n\
    \n*Rest Parameters*\n\nMandatory, optional, and default parameters have one thing\
    \ in common – \n\nthey describe one parameter at a time. In some cases, you need\
    \ to work \n\nwith several parameters, treating them as a group; and sometimes\
    \ it is \n\nnot known in advance how many parameters the function will take. In\
    \ \n\nJavaScript, you can work with arguments directly using the arguments \n\n\
    variable, which is available inside any function.\n\nIn TS, you can assemble arguments\
    \ into a single variable:\n\n*function buildName(firstName: string, ...restOfName:\
    \ *\n\n*string\\[\\]) {*\n\n *return firstName + \" \" + restOfName.join(\" \"\
    );*\n\n*}*\n\n*let employeeName = buildName(\"Jonas\", \"Pitt\", \"Lucas\", *\n\
    \n*\"Samuel\");*\n\nRest parameters can be understood as an unlimited number of\
    \ optional \n\nparameters. When passing arguments for residual parameters, you\
    \ can \n\npass as many of them as you want; or you can pass nothing at all. The\
    \ \n\ncompiler will build an array from the passed arguments, assign it a name\
    \ \n\nthat is specified after the ellipsis (…), and make it available inside the\
    \ \n\nfunction.\n\nThe ellipsis is also used when describing the type of function\
    \ with \n\nresidual parameters:\n\n*function buildName(firstName: string, ...restOfName:\
    \ *\n\n*string\\[\\]) {*\n\n *return firstName + \" \" + restOfName.join(\" \"\
    );*\n\n*}*\n\n \n\n*let buildNameFun: (fname: string, ...rest: string\\[\\]) *\n\
    \n*\\=> string = buildName;*"
