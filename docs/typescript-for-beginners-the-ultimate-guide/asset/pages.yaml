  md: "**138**    ◾    TypeScript for Beginners\n\ncompile () – this is if you called\
    \ tsc via Node.js,\n\nbundle () is the same as compile, except that instead of\
    \ returning files, \n\nit returns a single string, which is an ES module that\
    \ includes all the code \n\nthat was included at the time of compilation. This\
    \ command is also avail­\n\nable from the Deno bundle CLI.\n\nFor example, if\
    \ the main module looked something like this:\n\n*export {foo} from \"./foo.js\"\
    ;*\n\n*export const bar = \"bar\";*\n\nIt can be imported:\n\n*import {foo, bar}\
    \ from \"./lib.bundle.js\";*\n\nThe Bundle can also be downloaded in a web browser.\
    \ Bundle is a stand­\n\nalone ES module, so the type attribute must be set as\
    \ “module.” For \n\nexample:\n\n*<script type=\"module\">*\n\n *import \\* as\
    \ website from \"website.bundle.js\";* \n\n*</script>*\n\ntranspileOnly () is\
    \ the same as transpileModule in TS. All it does is “erase” \n\nany types from\
    \ the modules and generate JS. No type checking and depen­\n\ndency resolution.\n\
    \n*dev\\_server*\n\nIt was with the help of transpileOnly that dev\\_server was\
    \ implemented – a \n\nutility for running your frontend code on Deno.\n\nHow Does\
    \ It Work?\n\nWhen accessing the index.html, requested by main.ts.\n\nIt is also\
    \ transpiled (in accordance with the specified tsconfig), and out­\n\nputs the\
    \ ready-made js code at this URL.\n\nWhat about Dependencies?\n\nAnd here, of\
    \ course, comes to the aid of jspm, cdn. pika, unpkg. Therefore, \n\nyou will\
    \ have to specify the appropriate importmap.\n\nAs a result, you have a JIT output,\
    \ as it was in the days of systemjs."
