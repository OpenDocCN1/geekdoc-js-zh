  md: "Key Concepts of TS    ◾   ** 97**\n\n*let c = new C();*\n\n*let className =\
    \ c\\[getClassNameSymbol\\](); // \"C\"*\n\n*Predefined Characters*\n\nIn addition\
    \ to user-defined characters, there are predefined built-in char­\n\nacters. Embedded\
    \ characters are needed to reflect the internal behavior of \n\nthe language.\n\
    \nList of predefined characters:\n\n• ** Symbol.hasInstance:**A method that determines\
    \ whether the con­\n\nstructor object recognizes the passed object as an instance\
    \ of this \n\nconstructor. Called by the *instanceof* operator.\n\n• ** Symbol.isConcatSpreadable:**A\
    \ boolean value that indicates \n\nwhether the object should be decomposed into\
    \ array elements when \n\nused with Array. prototype. concat.\n\n• ** Symbol.iterator:**A\
    \ method that returns the default iterator for an \n\nobject. Called by the for-of\
    \ construct.\n\n• ** Symbol.match:**A method for regular expressions that matches\
    \ a \n\nregular expression to a string. Called by the *String.prototype.match*\
    \ \n\nmethod.\n\n• ** Symbol.replace:**A method for regular expressions that replaces\
    \ \n\nmatched substrings in a string. Called by the *String.prototype.replace*\
    \ \n\nmethod.\n\n• ** Symbol.search:**A method for regular expressions that returns\
    \ the \n\nposition in the string where the match with the regular expression is\
    \ \n\nlocated. Called by the *String.prototype.search* method.\n\n• ** Symbol.species:**A\
    \ property that contains a function that serves as a \n\nconstructor for inherited\
    \ objects.\n\n• ** Symbol.split:**A method for regular expressions that splits\
    \ a string \n\nby the positions of matches with a regular expression. Called by\
    \ the \n\n*String.prototype.split* method.\n\n• ** Symbol.toPrimitive:**A method\
    \ that turns an object into the cor­\n\nresponding primitive value. Called by\
    \ the abstract *ToPrimitive* \n\noperation."
