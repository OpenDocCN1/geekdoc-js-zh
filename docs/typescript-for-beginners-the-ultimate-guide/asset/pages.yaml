    \ = deck.createCardPicker();*\n\n*let pickedCard = cardPicker();*\n\n \n\n*alert(\"\
    card: \" + pickedCard.card + \" of \" + *\n\n*pickedCar8d.suit);*\n\nEven better,\
    \ if you pass the –*noImplicitThis* flag to the compiler, TS will \n\nissue a\
    \ warning if you make a similar error. It will indicate that this in the \n\n\
    expression *this. suits\\[pickedSuit\\]* is of type any.\n\n*this Parameters*\n\
    \nUnfortunately, the type of the expression *this. suits\\[pickedSuit\\]* is still\
    \ any, \n\nsince this is taken from a function expression inside an object literal.\
    \ To \n\nfix this, you can explicitly specify this as a parameter. The *this*\
    \ parameter \n\nis a “fake” parameter that comes first in the list of function\
    \ parameters:\n\n*function f(this: void) {*\n\n*// Ensure that 'this' cannot be\
    \ used in this separate *\n\n*function*\n\n*}*\n\nWe will add several interfaces\
    \ to the previous example: Card and Deck, to \n\nmake the types more understandable\
    \ and easy to reuse:\n\n*interface Card {*\n\n *suit: string;*\n\n *card: number;*\n\
    \n*}*\n\n*interface Deck {*\n\n *suits: string\\[\\];*\n\n *cards: number\\[\\\
    ];*\n\n *createCardPicker(this: Deck): () => Card;*\n\n*}*\n\n*let deck: Deck\
    \ = {*\n\n *suits: \\[\"hearts\", \"spades\", \"clubs\", \"diamonds\"\\],*\n\n\
    \ *cards: Array(52),*\n\n *// ATTENTION: Now the function explicitly *\n\n*indicates\
    \ that it should be called on an object of the *\n\n*Deck type*"
