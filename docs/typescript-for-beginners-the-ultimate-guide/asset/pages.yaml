  md: "**8**    ◾    TypeScript for Beginners\n\n3\\. **Basic TS Compiler:** The main\
    \ task of the TS compiler is to manage \n\nthe low-level mechanics of checking\
    \ the type of code and convert­\n\ning it into valid JS code. The compiler uses\
    \ static code analysis to \n\nreduce the chance of runtime errors. Typos in the\
    \ code or passing \n\nthe wrong type of argument to a function will cause the\
    \ compiler to \n\nthrow errors to warn us that something is wrong before we execute\
    \ \n\nthe code. This is extremely valuable, as even with the most complete \n\n\
    set of tests, logical errors and extreme cases can cause the applica­\n\ntion\
    \ to crash at runtime. TS ensures that the type definitions we cre­\n\nate in\
    \ the code are always used.\n\n4\\. **TypeScript Standalone Compiler, TSC:** The\
    \ stand-alone TS com­\n\npiler, often called tsc, is a high-level compiler that\
    \ takes a TS file, .ts, \n\nand outputs a JS file, .js.\n\n5\\. **Language Service:**\
    \ This component layer sits on top of the main TS \n\ncompiler and provides the\
    \ features needed to work in IDE and text \n\neditors: statement completion, code\
    \ formatting and highlighting, \n\nsyntax highlighting, and more. The language\
    \ service also provides \n\ncode refactoring: variable renaming, debugging, and\
    \ incremental \n\ncompilation.\n\n6\\. **Tool Integration:** TS offers type annotations\
    \ that allow IDEs and \n\ntext editors to perform comprehensive static code analysis.\
    \ These \n\nannotations allow these tools to make smart suggestions, making the\
    \ \n\ncode much more predictable. In turn, IDEs and text editors can offer \n\n\
    better auto-completion and refactoring of TS code.\n\nBasic TS Types\n\nTS is\
    \ a statically typed language. The type cannot be changed during pro­\n\ngram\
    \ execution. This allows you to reduce a large number of errors and \n\nidentify\
    \ many of them even at the compilation stage.\n\nTS has several simple data types:\
    \ numbers, strings, structures, Boolean. \n\nIt supports all types that are available\
    \ in JS, complementing the conve­\n\nnient enum type."
