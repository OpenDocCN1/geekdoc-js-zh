    \nFUNCTIONS\n\nFunctions are one of the fundamental foundations of any JavaScript\
    \ appli­\n\ncation. They are used to build abstraction levels, classes, information\
    \ hiding, \n\nand modules. TS has classes, namespaces, and modules, but functions\
    \ play \n\na key role. The TS language slightly expands the capabilities of functions\
    \ \n\ncompared to JavaScript, making working with them even more convenient.\n\
    \nAs in JavaScript, functions in TS can be either named or anonymous. \n\nThis\
    \ allows you to choose the most convenient approach for developing \n\nyour application,\
    \ whether it is building a list of functions in the API, or \n\nembedding one\
    \ function in another.\n\nLet’s recall how these two options look in JavaScript:\n\
    \n*// Named function*\n\n*function add (x, y) {*\n\n*return x + y;*\n\n*}*\n\n\
    */ / Anonymous function*\n\n*let myAdd = function(x, y) {return x+y; };*\n\nJust\
    \ like in JavaScript, functions can access variables outside of their \n\nbody.\
    \ When this happens, the function is said to “capture” the variables. \n\nAlthough\
    \ it is not the task of this article to explain how it works and what \n\nthe\
    \ pitfalls of this technique are, it is important to have a clear under­\n\nstanding\
    \ of this mechanism in order to work with JavaScript and TS.\n\n*let z = 50;*\n\
    \n*function addToZ(x, y) {*\n\n *return x + y + z;*\n\n*}*\n\nTypes of Functions\n\
    \n*Adding Types to a Function*\n\nLet’s add the types to the function from the\
    \ previous simple examples:\n\n*function add(x: number, y: number): number {*\n\
    \n *return x + y;*"
