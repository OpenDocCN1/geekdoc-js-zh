  md: "Key Concepts of TS    ◾   ** 51**\n\nIDerivedFromBase interface. Since BaseClass\
    \ already defines the id prop­\n\nerty required in the IDerivedFromBase interface,\
    \ the only other property \n\nthat the DerivedFromBaseClass class must implement\
    \ is the name prop­\n\nerty. Therefore, we need to include the definition of only\
    \ this property in \n\nthe DerivedFromBaseClass class.\n\nTS does not support\
    \ the concept of multiple inheritance. Multiple \n\ninheritance means that a single\
    \ class can be derived from multiple base \n\nclasses. TS supports only single\
    \ inheritance, and therefore any class can \n\nhave only one base class.\n\nHowever,\
    \ a class can implement many interfaces:\n\n*interface IFirstInterface {*\n\n\
    \ *id : number | undefined;*\n\n *}*\n\n*interface ISecondInterface {*\n\n *name:\
    \ string | undefined;*\n\n *}*\n\n*class MultipleInterfaces*\n\n *implements IFirstInterface,\
    \ ISecondInterface {*\n\n *id: number | undefined;*\n\n *name: string | undefined;*\n\
    \n *}*\n\nHere we have defined two interfaces named *ifirstinterface* and \n\n\
    *ISecondInterface*. This is followed by a class named *MultipleInterfaces*, \n\
    \nwhich implements both interfaces. This means that the *MultipleInterfaces* \n\
    \nclass must implement the id property to satisfy the *IFirstInterface* inter­\n\
    \nface, and the name property to satisfy the *IFirstInterface* interface.\n\n\
    Access Modifiers\n\nAccess modifiers allow you to hide the state of an object\
    \ from external \n\naccess and control access to this state. TS has three modifiers:\
    \ public, pro­\n\ntected, and private.\n\n*Public by Default*\n\nIn our examples,\
    \ we were able to freely access class members declared in \n\nall classes of the\
    \ program. If you are familiar with classes in other lan­\n\nguages, you may have\
    \ noticed that in the examples above, we did not use \n\nthe word public to change\
    \ the visibility of a class member. For example,"
