  md: "TypeScript    ◾   ** 41**\n\nThe parameter names do not have to match in order\
    \ for the function to \n\npass type-matching. We, for example, could write the\
    \ previous example \n\nlike this:\n\n*let mySearch: SearchFunc;*\n\n*mySearch\
    \ = function(src: string, sub: string): boolean *\n\n*{*\n\n *let result = src.search(sub);*\n\
    \n *if (result == -1) {*\n\n *return false;*\n\n *}*\n\n *else {*\n\n *return\
    \ true;*\n\n *}*\n\n*}*\n\nThe function parameters are checked one after the other,\
    \ and the param­\n\neter types that are in the corresponding positions are compared\
    \ in pairs. \n\nIf you don’t want to specify types for arguments, then TS can\
    \ infer types \n\nfrom the context based on the fact that the function is assigned\
    \ to a vari­\n\nable whose type is SearchFunc. In the following example, the type\
    \ of the \n\nfunction’s return value is also output: this is done based on the\
    \ values it \n\nreturns (false and true). If the function returned numbers or\
    \ strings, the \n\ncompiler would warn during type checking that the type of the\
    \ returned \n\nvalue does not match the type specified in the SearchFunc interface.\n\
    \n*let mySearch: SearchFunc;*\n\n*mySearch = function(src, sub) {*\n\n *let result\
    \ = src.search(sub);*\n\n *if (result == -1) {*\n\n *return false;*\n\n *}*\n\n\
    \ *else {*\n\n *return true;*\n\n *}*\n\n*}*\n\n*Indexed Types*\n\nIn the same\
    \ way that interfaces are used to describe functions, you can \n\ndescribe types\
    \ so that you can use the index operator with them – for"
