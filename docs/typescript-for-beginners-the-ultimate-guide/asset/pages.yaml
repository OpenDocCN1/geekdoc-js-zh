  md: "**47**\n\nDOI: 10.1201/9781003203728-2\n\nC h a p t e r 2\n\nKey Concepts of\
    \ TS\n\nTraditional JavaScript focuses on functions and prototype-based inheri­\n\
    \ntance to develop reusable components, but this approach is quite inconve­\n\n\
    nient compared to the usual object-oriented programming, where classes \n\ninherit\
    \ functionality and objects are built from these classes. Starting with \n\nECMAScript\
    \ 2015, also known as ECMAScript 6, JavaScript programmers \n\nwill be able to\
    \ create applications using this class-based object-oriented \n\napproach. In\
    \ TypeScript (TS), you can use this approach now, and compile \n\ncode in JavaScript\
    \ that will work on the bulk of browsers and platforms, \n\nwithout waiting for\
    \ the next version of JavaScript.\n\nCLASSES\n\nLet’s look at a simple example\
    \ of working with classes:\n\n*class Sampler {*\n\n *greeting: string;*\n\n *constructor(message:\
    \ string) {*\n\n *this.greeting = message;*\n\n *}*\n\n *greet() {*\n\n *return\
    \ \"Hello, \" + this.greeting;*\n\n *}*\n\n*}*\n\n \n\n*let sampler = new Sampler(\"\
    world\");*"
