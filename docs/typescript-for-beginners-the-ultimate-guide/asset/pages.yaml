  md: "Modules and Namespaces    ◾   ** 113**\n\nmodule is to place and export one\
    \ specific element, then you should seriously \n\nconsider using the default export.\
    \ This approach makes both the import pro­\n\ncedure itself and the use of imported\
    \ elements a little easier. For example:\n\n***MyClass.ts***\n\n*export default\
    \ class SomeType {*\n\n *constructor() { ... }*\n\n*}*\n\n***MyFunc.ts***\n\n\
    *export default function getThing() { return \"thing\"; }*\n\n***Consumer.ts***\n\
    \n*import t from \"./MyClass\";*\n\n*import f from \"./MyFunc\";*\n\n*let x =\
    \ new t();*\n\n*console.log(f());*\n\nThis approach is optimal for users of the\
    \ module. They can give your type \n\nthe most convenient name for them (t in\
    \ this case) and will be spared the \n\nunnecessary use of “through the dot” to\
    \ search for your objects.\n\nIf You Are Exporting Multiple Objects, Put Them\
    \ on the Top Level\n\n***MyThings.ts***\n\n*export class SomeType { /\\* … \\\
    */ }*\n\n*export function someFunc() { /\\* … \\*/* \n\nAccordingly, when importing:\n\
    \nExplicitly Define the Imported Names\n\n***Consumer.ts***\n\n*import {SomeType,\
    \ someFunc} from \"./MyThings\";*\n\n*let x = new SomeType();*\n\n*let y = someFunc();*\n\
    \nUse the Namespace Import Template When Importing \n\na Large Number of Items\n\
    \n***MyLargeModule.ts***\n\n*export class Dog { ... }*\n\n*export class Cat {\
    \ ... }*\n\n*export class Tree { ... }*\n\n*export class Flower { ... }*"
