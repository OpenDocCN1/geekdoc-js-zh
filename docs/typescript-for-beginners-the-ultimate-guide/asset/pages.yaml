  md: "**124**    ◾    TypeScript for Beginners \n\n*generated*\n\n*└── templates*\n\
    \n *└── views*\n\n*└── template1.ts (imports ’./view2’)*\n\nsrc / views contain\
    \ files with custom code for UI elements. The files in \n\ngenerated / templates\
    \ contain the UI template binding code that is auto­\n\nmatically generated by\
    \ the template generator as part of the build. In one \n\nof the build steps,\
    \ the files from /src/views and /generated/templates/views \n\nwill be copied\
    \ to the same directories in the output structure of the proj­\n\nect. The view\
    \ at runtime expects its template to be nearby, and it can be \n\nimported using\
    \ the relative path *\". /template\".*\n\nTo indicate this relationship to the\
    \ compiler, use “rootDirs.” “rootDirs” \n\ndefines a list of root directories\
    \ (roots) whose contents need to be merged \n\ndynamically. Continuing our example,\
    \ the *tsconfig file.the json* should \n\nlook like this:\n\n*{*\n\n *\"compilerOptions\"\
    : {*\n\n *\"rootDirs\": \\[*\n\n *\"src/views\",*\n\n *\"generated/templates/views\"\
    *\n\n \\]\n\n *}*\n\n*}*\n\nEach time the compiler encounters a relative module\
    \ import in a subdi­\n\nrectory of one of the *rootDirs*, it tries to find that\
    \ import in the *rootDirs* \n\nentries.\n\n*Tracking Module Resolution*\n\nAs\
    \ mentioned earlier, the compiler has the ability to go beyond the current \n\n\
    directory when resolving modules. This behavior can make it difficult to \n\n\
    diagnose the reasons why the module was not resolved or was resolved \n\nincorrectly.\
    \ To get an idea of how the module resolution process goes, you \n\ncan use the\
    \ –traceResolution compiler key.\n\nSuppose we have a simple application that\
    \ uses a typescript module. \n\nApp. ts contains the import instruction import\
    \ \\* as ts from “typescript.”"
