  md: "**40**    ◾    TypeScript for Beginners\n\nDon’t forget that in simple code\
    \ like the one above, you probably \n\nshouldn’t try to bypass this check. For\
    \ more complex object literals that \n\nhave methods, or that have state, you\
    \ may need to use this technique, \n\nbut most compiler messages related to checking\
    \ for redundant proper­\n\nties indicate real errors. This means that when you\
    \ encounter problems \n\nthat such a check generates (for example, when passing\
    \ an object with \n\narguments to a function), you may need to change the type\
    \ declarations. \n\nIn this case, if passing an object that can have both the\
    \ color and color \n\nproperties is acceptable, you need to correct the SquareConfig\
    \ definition \n\nto reflect this.\n\n*Functional Types*\n\nInterfaces can describe\
    \ a wide range of “forms” that JS objects take. In \n\naddition to describing\
    \ objects with properties, interfaces can also describe \n\nfunction types.\n\n\
    In order to describe a function using an interface, a call signature is \n\nadded\
    \ to it. Such a signature looks like a function description that speci­\n\nfies\
    \ only the argument list and the return type. Each parameter in the list \n\n\
    must have both a name and a type.\n\n*interface SearchFunc {*\n\n *(source: string,\
    \ subString: string): boolean;*\n\n*}*\n\nOnce defined, such an interface can\
    \ be used in the same way as other \n\ninterfaces. Now, we will show you how to\
    \ create a variable of a functional \n\ntype and assign it a function.\n\n*let\
    \ mySearch: SearchFunc;*\n\n*mySearch = function(source: string, subString: string)\
    \ *\n\n*{*\n\n *let result = source.search(subString);*\n\n *if (result == -1)\
    \ {*\n\n *return false;*\n\n *}*\n\n *else {*\n\n *return true;*\n\n *}*\n\n*}*"
