  md: "**10**    ◾    TypeScript for Beginners\n\nThe equivalent of this sentence\
    \ declaration:\n\nlet sentence: string = \"Hello, my name is \" + name + \n\n\"\
    .\\\\n\\\\n\" +\n\n \"I’ll be \" + (age + 1) + \" years old next month.\"\n\n\
    *Array*\n\nTS, like JS, has arrays of values. The array type can be defined in\
    \ one of \n\ntwo ways. The first is to denote the type of array elements before\
    \ \\[\\]:\n\nlet list: number\\[\\] = \\[1, 2, 3\\];\n\nThe second way is to use\
    \ the generalization Array<elemType>:\n\nlet list: Array<number> = \\[1, 2, 3\\\
    ];\n\n</number>\n\n*Tuple*\n\nThe Tuple type gives you the ability to declare\
    \ an array with a known fixed \n\nnumber of elements that do not have to be of\
    \ the same type. For example, \n\nyou want to have the Tuple value as a pair of\
    \ “string” and “number”:\n\n*// Declare a tuple type*\n\n*let x: \\[string, number\\\
    ];*\n\n*// Initialize it*\n\n*x = \\[\"hello\", 10\\]; // OK*\n\n*// Initialize\
    \ it incorrectly*\n\n*x = \\[10, \"hello\"\\]; // Error*\n\nWhen you get an element\
    \ with a known idex, the type of that element will \n\nbe returned:\n\n*console.log(x\\\
    [0\\].substr(1)); // OK*\n\n*console.log(x\\[1\\].substr(1)); // Error, 'number'\
    \ does *\n\n*not have 'substr'*\n\nWhen an element with an idex outside the known\
    \ range is received, the \n\nUnion type is returned:\n\n*x\\[3\\] = 'world'; //\
    \ OK string type can be assigned *\n\n*(string | number)*"
