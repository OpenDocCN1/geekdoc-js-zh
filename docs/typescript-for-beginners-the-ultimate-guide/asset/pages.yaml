  md: "Key Concepts of TS    ◾   ** 71**\n\n*let result2 = buildName(\"Sam\", \"Adams\"\
    , \"Sr.\"); // *\n\n*error, too many parameters*\n\n*let result3 = buildName(\"\
    Sam\", \"Adams\"); // correct*\n\nIn JavaScript, all parameters are optional,\
    \ and users can skip them if nec­\n\nessary. In such cases, the value of the missing\
    \ parameters is assumed to \n\nbe *undefined*. In TS, you can also achieve this:\
    \ to do this, at the end of the \n\nparameter that you want to make optional,?\
    \ is added. For example, we \n\nwant to make *lastName* optional from the previous\
    \ example:\n\n*function buildName(firstName: string, lastName?: *\n\n*string)\
    \ {*\n\n *if (lastName)*\n\n *return firstName + \" \" + lastName;*\n\n *else*\n\
    \n *return firstName;*\n\n*}*\n\n*let result1 = buildName(\"Sam\"); // all is\
    \ *\n\n*correct now*\n\n*let result2 = buildName(\"Sam\", \"Adams\", \"Sr.\");\
    \ // *\n\n*error, too many parameters*\n\n*let result3 = buildName(\"Sam\", \"\
    Adams\"); // *\n\n*correct*\n\nAll optional parameters must come after the required\
    \ ones. If the first \n\nparameter (firstName) had to be made optional instead\
    \ of *lastName*, then \n\nthe order of the parameters in the function would have\
    \ to be changed so \n\nthat *firstName* would be the last.\n\nTS also allows you\
    \ to specify a value for a parameter that it will accept \n\nif the user skips\
    \ it or passes *undefined*. These parameters are called default \n\nparameters,\
    \ or simply default parameters. Let’s take the previous example \n\nand set the\
    \ default value for *lastName* to “Smith.”\n\n*function buildName(firstName: string,\
    \ lastName = *\n\n*\"Smith\") {*\n\n *return firstName + \" \" + lastName;*\n\n\
    *}*\n\n \n\n*let result1 = buildName(\"Sam\"); // now *\n\n*all is correct, returns\
    \ \"Sam Smith\"*"
