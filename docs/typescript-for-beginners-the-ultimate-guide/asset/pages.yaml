    Optional Module Loading and Its Other Advanced Scenarios\n\nIn some cases, you\
    \ may need to load the module only under certain con­\n\nditions. In TypeScript,\
    \ you can use the example below to apply this or \n\nanother advanced module loading\
    \ technique. This technique can be used \n\nto directly call module loaders without\
    \ losing type safety.\n\nThe compiler determines for each module whether it is\
    \ used in the gen­\n\nerated JavaScript. If the module ID is only in the type\
    \ descriptions and \n\nnever in the expressions, then a call to require will not\
    \ be generated for \n\nthis module. This omission of unused links improves performance,\
    \ and \n\nalso allows you to organize the optional loading of modules."
