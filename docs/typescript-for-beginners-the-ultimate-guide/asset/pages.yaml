  md: "TypeScript    ◾   ** 43**\n\nIn the following example, the name type does not\
    \ match the string index \n\ntype, and the compiler throws an error:\n\n*interface\
    \ NumberDictionary {*\n\n *\\[index: string\\]: number;*\n\n *length: number;\
    \ // **все**хорошо**, length — **число*\n\n *name: string; // **ошибка**, the\
    \ type of ’name’ *\n\n*is not a subtype of the indexer*\n\n*}*\n\nIn addition,\
    \ the index signature can be made read-only to prevent assign­\n\nment to indexes:\n\
    \n*interface ReadonlyStringArray {*\n\n *readonly \\[index: number\\]: string;*\n\
    \n*}*\n\n*let myArray: ReadonlyStringArray = \\[\"Alice\", \"Bob\"\\];*\n\n*myArray\\\
    [2\\] = \"Mallory\"; // error!*\n\nYou can’t set myArray\\[2\\] because the index\
    \ signature is read-only.\n\nINTEGRATED DEVELOPMENT ENVIRONMENTS\n\nAn integrated\
    \ development environment, or simply an IDE – is a tool used \n\nto develop applications\
    \ in a simple, fast, and reliable way.\n\nIn this section, we’ll take a look at\
    \ working with the TS environment so \n\nthat you can edit, compile, run, and\
    \ debug your code written in TS. TS was \n\nreleased as an open source project\
    \ and includes both a Windows variant \n\nand a Node variant. This means that\
    \ the compiler will run on Windows, \n\nLinux, macOS, and any other operating\
    \ system that supports Node. In \n\nWindows environments, you can install Visual\
    \ Studio, which will register \n\n*tsc.exe* (TS compiler) in our catalog c:\\\\\
    Program Files, or you can use Node. \n\nIn Linux and macOS environments, we will\
    \ need to use Node.\n\nNode-Based Compilation\n\nThe simplest TS development environment\
    \ consists of a simple text editor \n\nand a Node-based TS compiler. Go to the\
    \ Node website and follow the \n\ninstructions for installing Node on the operating\
    \ system of your choice. \n\nOnce Node is installed, you can install TS by simply\
    \ typing:\n\n*npm install -g typescript*"
