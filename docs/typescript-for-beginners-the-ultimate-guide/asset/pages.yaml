  md: "TS Runtime    ◾   ** 139**\n\nOn the plus side: you don’t have to wait for\
    \ the dev build to happen in \n\nthe console.\n\nBut here, of course, various\
    \ preprocessors are not taken into account, \n\nwhich now most of us do not even\
    \ think about using the Angular CLI.\n\nHow ty Try It?\n\ndeno run -- allow-net\
    \ -- allow-read -- allow-write \n\n– unstable\n\nCI and CD\n\nOf course, for effective\
    \ development, it would be impossible to do without \n\nwell-built application\
    \ delivery. For example, Deno itself was transferred to \n\nGitHub actions. \n\
    \nINSTALLING AND COMPILING THE TS\n\nTo start working with TS, install the necessary\
    \ tools. There are two ways to \n\ninstall TS: via the npm package manager or\
    \ as a plugin for Visual Studio.\n\nInstallation via NPM\n\nTo install via npm,\
    \ you must first install Node.js (if it was not previously \n\ninstalled). After\
    \ installing Node.js you need to run the following com­\n\nmand in a command prompt\
    \ (Windows) or terminal (Linux):\n\n*npm install -g typescript*\n\nWhen installing\
    \ on macOS, you also need to enter the sudo command. \n\nWhen you enter this command,\
    \ the terminal will ask for the user’s user­\n\nname and password to install the\
    \ package:\n\n*sudo npm install -g typescript*\n\nIt is possible that TS was already\
    \ installed earlier. In this case, you can \n\nupdate it to the latest version\
    \ using the command:\n\n*npm update -g typescript*"
