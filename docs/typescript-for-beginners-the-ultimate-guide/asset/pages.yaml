  md: "**132**    ◾    TypeScript for Beginners\n\n• ** Rust backend:** Currently,\
    \ the server side, or “privileged side,” which \n\nhas access to the file system,\
    \ network, and environment, is imple­\n\nmented in Rust. For those unfamiliar\
    \ with the language, Rust is a \n\nsystem programming language developed by Mozilla,\
    \ with a focus \n\non memory security and concurrency. It is used in projects\
    \ such as \n\nServo. The Rust backend is ported from Go, which served to create\
    \ the \n\noriginal Deno prototype, introduced in June 2018. The reasons for the\
    \ \n\ntransition are related to concerns about double GC.\n\n• ** V8 is Google’s\
    \ JS/WebAssembly engine:** Written in C++, it is also \n\nused in particular in\
    \ Google Chrome and Node.js. V8 does not sup­\n\nport TS. Instead, all the TS\
    \ code you run in Deno is compiled into JS \n\nusing the TS snapshot compiler,\
    \ and the generated files are stored in \n\nthe. deno folder. If the user does\
    \ not update the code, only cached JS \n\nfiles will run after the initial compilation.\n\
    \n• ** Tokio** is an asynchronous runtime environment for Rust. It is used \n\n\
    to create and process events. This allows Deno to spawn tasks in the \n\ninternal\
    \ thread pool and receive notifications to process output after \n\nthe task completes.\
    \ Tokio relies on Rust Future, a construct similar \n\nto Promise in JS.\n\n*Safety*\n\
    \nDeno is safe by default. For comparison, Node.js has full access to your file\
    \ \n\nsystem and network.\n\nTo run the program without permissions, just run\
    \ the command:\n\n*deno run main.ts*\n\nIf your code requires permission, you\
    \ will get the following error:\n\n*error: Uncaught PermissionDenied: …*\n\nDeno\
    \ uses command-line options to explicitly allow access to various \n\nparts of\
    \ the system. The most commonly used ones are\n\n• environment\n\n• network\n\n\
    • file system\n\n• running child processes"
