  md: "TypeScript Architecture    ◾   ** 167**\n\nwrite some unit tests using these\
    \ frameworks, and then discuss the librar­\n\nies for unit testing and methods\
    \ for continuous integration.\n\nTest-driven development is a way to reflect on\
    \ our code, which should \n\nbe part of the standard development process. It is\
    \ a development para­\n\ndigm that starts with tests and drives the driving force\
    \ of production code \n\nthrough these tests. Test-driven development is like\
    \ asking a question: \n\nHow do I know I’ve solved a problem? This is an important\
    \ idea to under­\n\nstand. We are writing code to solve the problem, but we must\
    \ be able to \n\nprove that we have solved the problem with the help of automated\
    \ tests.\n\nThe main stages of this approach are\n\n• Writing a test that doesn’t\
    \ pass\n\n• Running a test to make sure it doesn’t pass\n\n• Writing code to pass\
    \ the test\n\n• Running a test to make sure it passes\n\n• Running all the tests\
    \ to see that the new code doesn’t break the other \n\none\n\n• Repetition\n\n\
    Using test-driven development is really a way of thinking. Some develop­\n\ners\
    \ follow this approach and write tests first, while others write their own \n\n\
    code first, and then tests. Then, there are those who do not write tests at \n\
    \nall. If you fall into the latter category, then I hope that the methods you\
    \ \n\nwill learn in this chapter will help you start working in the right direction.\n\
    \nThere are so many excuses not to write unit tests. For example, there was \n\
    \nno question of a testing framework, or because of this, the development \n\n\
    time will increase by 20%, or the tests are outdated, so we don’t run them \n\n\
    anymore. The truth is that these days we can’t afford not to write tests. \n\n\
    Applications grow in size and become more complex, and the require­\n\nments change\
    \ over time. An application with a good set of tests can be \n\nchanged much faster,\
    \ and it will be much more resistant to future changes \n\nin requirements than\
    \ an application that does not have tests. That is, when \n\nthe real savings\
    \ in unit testing costs become apparent. By writing unit \n\ntests for your application,\
    \ you check its future and ensure that any change \n\nin the code base does not\
    \ break the existing functionality. We also want to"
