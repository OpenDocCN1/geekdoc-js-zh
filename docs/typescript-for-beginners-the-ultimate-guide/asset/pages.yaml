  md: "Key Concepts of TS    ◾   ** 67**\n\nIf the compiler cannot find the best common\
    \ type, the output will be \n\nthe type of an empty object, that is, {}. Since\
    \ this type has no members, \n\nattempting to use any of its properties will result\
    \ in an error. As a result \n\nof this inference, you can still use the object\
    \ as if its type is unknown, \n\nand guarantee type safety in cases where the\
    \ object type cannot be found \n\nimplicitly.\n\n*Context Type*\n\nIn some cases,\
    \ type inference works in the “other direction” as well. \n\nThis is called “context\
    \ typing.” Contextual typing occurs when you can \n\nmake a guess about the type\
    \ of an expression based on its position. For \n\nexample:\n\n*window.onmousedown\
    \ = function(mouseEvent) {*\n\n *console.log(mouseEvent.buton); //<- Error*\n\n\
    *};*\n\nTo find the type error in this example, the compiler first used the Window.\n\
    \nonmousedown function type to infer the type of the function expression \n\n\
    from the right side of the assignment. After that, it was able to output \n\n\
    the type of the MouseEvent parameter. If this function expression was \n\nlocated\
    \ where its type could not be inferred from the context, the type \n\nof the MouseEvent\
    \ parameter would be any, and the compiler would not \n\nthrow an error.\n\nIf\
    \ an expression whose type was inferred from the context contains an \n\nexplicit\
    \ type indication, the inferred context type is ignored. That is, if the \n\n\
    previous example were written as:\n\n*window.onmousedown = function(MouseEvent:\
    \ any) {*\n\n*console. log(MouseEvent.buton); / / < - No error is *\n\n*shown\
    \ now*\n\n*};*\n\nThe explicitly specified parameter type in the function expression\
    \ will \n\ntake precedence over the context type. For this reason, the compiler\
    \ will \n\nnot throw an error, since the context type is not applied.\n\nContextual\
    \ typing is used in many cases. Typically, these are argu­\n\nments when calling\
    \ functions, the right-hand side of an assignment, \n\ntype checks, object members\
    \ and array literals, and return statements."
