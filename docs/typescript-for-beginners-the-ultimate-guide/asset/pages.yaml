    \ \\* config.width;*\n\n *}*\n\n *return newSquare;*\n\n*}*\n\n*let mySquare =\
    \ createSquare({color: \"black\"});*\n\n*Read-Only Properties*\n\nSome properties\
    \ should only be modifiable when the object is created. You \n\ncan specify this\
    \ by adding readonly before its name:\n\n*interface Point {*\n\n *readonly x:\
    \ number;*\n\n *readonly y: number;*\n\n*}*\n\nYou can create a Point object by\
    \ assigning an object literal, but after the \n\nassignment, you can no longer\
    \ change x and y.\n\n*let p1: Point = { x: 10, y: 20 };*\n\n*p1.x = 5; // error!*\n\
    \nTS has a ReadonlyArray<T> type, which is essentially an Array<T> type, \n\n\
    from which all methods that modify it are removed, so you can be sure \n\nthat\
    \ such arrays will not change after creation:\n\n*let a: number\\[\\] = \\[1,\
    \ 2, 3, 4\\];*\n\n*let ro: ReadonlyArray<number> = a;*\n\n*ro\\[0\\] = 12; //\
    \ error!*\n\n*ro.push(5); // error!*\n\n*ro.length = 100; // error!*\n\n*a = ro;\
    \ // error!*\n\n*</number>*"
