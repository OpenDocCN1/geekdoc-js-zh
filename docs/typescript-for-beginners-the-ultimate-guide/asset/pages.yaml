  md: "**66**    ◾    TypeScript for Beginners\n\nThis is called contextual typing\
    \ – a type inference. This feature allows \n\nyou to spend less effort on adding\
    \ types to the program.\n\nThere are several places in TS where type inference\
    \ is used to get infor­\n\nmation about types without explicitly specifying it.\
    \ For example, in this \n\ncode\n\n*let x = 3;*\n\nThe type of the variable x\
    \ is output in number. This kind of inference \n\noccurs when initializing variables\
    \ and members, assigning default values \n\nto parameters, and defining the type\
    \ of the function’s return value.\n\nIn most cases, type inference is fairly straightforward.\
    \ In the following \n\nsections, we will describe several subtleties of this process.\n\
    \n*Best General Type*\n\nWhen inference is made from multiple expressions, their\
    \ types are used to \n\nfind the “best general type.” For example,\n\n*let x =\
    \ \\[0, 1, null\\];*\n\nTo output the type x in this case, you need to check the\
    \ type of each ele­\n\nment in the array. In this case, there are two options\
    \ for the array type: \n\nnumber and null. The algorithm for finding the best\
    \ common type checks \n\neach candidate type, and selects the one that is compatible\
    \ with all the \n\nothers.\n\nSince the best common type must be chosen from the\
    \ types provided, \n\nthere are cases where the types have a common structure\
    \ for all, but none \n\nof them is the base for all the others. For example:\n\
    \n*let zoo = \\[new Rhino(), new Elephant(), new Snake()\\];*\n\nIdeally, we would\
    \ like the zoo type to be output as Animal\\[\\] (that is, an \n\narray of objects\
    \ of the Animal – animal class). But, since there is not a \n\nsingle object in\
    \ the array that has the Animal class, the compiler is not able \n\nto get such\
    \ a result. To fix this, you will have to explicitly specify the type \n\nif no\
    \ object has the base type for all the others:\n\n*let zoo: Animal\\[\\] = \\\
    [new Rhino(), new Elephant(), new *\n\n*Snake()\\];*"
