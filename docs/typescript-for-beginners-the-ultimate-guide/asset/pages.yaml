  md: "**122**    ◾    TypeScript for Beginners \n\nThe “paths” property allows you\
    \ to use more complex mapping meth­\n\nods, including multiple backup paths. Let’s\
    \ look at a configuration in \n\nwhich only some modules are available in one\
    \ location, while the rest are \n\nlocated in another. When you build, all these\
    \ modules will be placed in \n\none place. The project diagram may look like this:\n\
    \n*projectRoot*\n\n*├── folder1*\n\n*│ ├── file1.ts (**импортирует** ’folder1/file2’\
    \ u *\n\n*’folder2/file3’)*\n\n*│ └── file2.ts*\n\n*├── generated*\n\n*│ ├── folder1*\n\
    \n*│ └── folder2*\n\n*│ └── file3.ts*\n\n*└── tsconfig.json*\n\nThe corresponding\
    \ *tsconfig.the json* will look like this:\n\n*{*\n\n *\"compilerOptions\": {*\n\
    \n *\"baseUrl\": \".\",*\n\n *\"paths\": {*\n\n *\"\\*\": \\[*\n\n *\"\\*\",*\n\
    \n *\"generated/\\*\"*\n\n *\\]*\n\n *}*\n\n *}*\n\n*}*\n\nSo we tell the compiler\
    \ that for each module whose import statement \n\nmatches the “ \\*” pattern (i.e.\
    \ any values), it must search in two places:\n\n“\\*”: meaning the same name without\
    \ changes, so match <*module­*\n\n*Name*\\> => <*baseUrl*\\>*\\\\*<*moduleName*\\\
    >\n\n“generated\\\\\\*” meaning the module name with the added prefix “gener­\n\
    \nated,” so match <*moduleName*\\> => <*baseUrl*\\>*\\\\generated\\\\*<*moduleName*\\\
    >\n\nFollowing this logic, the compiler will try to resolve the specified import\
    \ \n\ninstructions as follows:\n\nimport *‘ folder1/file2’*"
