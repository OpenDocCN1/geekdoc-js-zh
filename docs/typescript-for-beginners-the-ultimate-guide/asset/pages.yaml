    to Employee. When we try to assign Employee to Animal, we get an error: \n\nthese\
    \ types are not compatible. Even though Employee has a private mem­\n\nber named\
    \ name, this is not the member we declared in Animal.\n\n*Protected Modifier*\n\
    \nThe protected modifier acts similarly to private, except that members \n\ndeclared\
    \ by protected can be accessed in subclasses. For example:\n\n*class Person {*\n\
    \n *protected name: string;*\n\n *constructor(name: string) { this.name = name;\
    \ }*\n\n*}*\n\n*class Employee extends Person {*\n\n *private department: string;*\n\
    \n *constructor(name: string, department: string) {*\n\n *super(name);*"
