  md: "**44**    ◾    TypeScript for Beginners\n\nThis command calls the Node Package\
    \ Manager (npm) to install TS as a \n\nglobal module (option-g), which will make\
    \ it available regardless of which \n\ndirectory we are currently in. After installing\
    \ TS, we can display the cur­\n\nrent version of the compiler by typing the following:\n\
    \n*tsc –v*\n\nNow let’s create a TS file named *hello.ts* with the following content:\n\
    \n*console.log('hello TypeScript');*\n\nFrom the command line, we can use TS to\
    \ compile this file into a JS file by \n\nrunning the following command:\n\n*tsc\
    \ hello.ts*\n\nAs soon as the TS compiler finishes its work, it will generate\
    \ a *hello file.js* in \n\nthe current directory. We can run this file using Node\
    \ by typing:\n\n*node hello.js*\n\nAfter that, the console will output:\n\n*hello\
    \ TypeScript*\n\nCreating a *tsconfig.json* File\n\nThe TS compiler uses the tsconfig\
    \ file.json in the root of the project direc­\n\ntory to specify any global TS\
    \ project parameters and compiler parameters. \n\nThis means that instead of compiling\
    \ our TS files one by one (specifying \n\neach file on the command line), we can\
    \ simply take the tsc from the root \n\ndirectory of the project and TS will recursively\
    \ find and compile all TS files \n\nin the root directory and in all subdirectories.\
    \ The tsconfig.json file that \n\nTS needs for this can be created from the command\
    \ line by simply typing:\n\n*tsc –init*\n\nThe result of this command is the main\
    \ tsconfig.json file:\n\n*{*\n\n *\"compilerOptions\": {*\n\n *\"target\": \"\
    es5\",*\n\n *\"module\": \"commonjs\",*"
  merge: -1
