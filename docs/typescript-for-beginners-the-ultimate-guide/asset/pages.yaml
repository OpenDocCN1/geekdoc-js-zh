    \ This type will contain all the static members of Greeter, along \n\nwith a constructor\
    \ that creates instances of the Greeter class. We demon­\n\nstrated this by using\
    \ new with greeterMaker, creating new instances of \n\nGreeter and calling them\
    \ as before.\n\n*Using a Class as an Interface*\n\nAs we discussed in the previous\
    \ section, a class declaration creates two things: \n\na type that describes instances\
    \ of the class, and a constructor function. Since \n\nclasses create types, we\
    \ can use them in the same way as interfaces.\n\n*class Point {*\n\n *x: number;*\n\
    \n *y: number;*\n\n*}*"
