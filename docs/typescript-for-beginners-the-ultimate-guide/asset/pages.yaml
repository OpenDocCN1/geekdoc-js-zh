  md: "**76**    ◾    TypeScript for Beginners\n\n *return {suit: this.suits\\[pickedSuit\\\
    ], *\n\n*card: pickedCard % 13};*\n\n *}*\n\n *}*\n\n*}*\n\n \n\n*let cardPicker\
    \ = deck.createCardPicker();*\n\n*let pickedCard = cardPicker();*\n\n \n\n*alert(\"\
    card: \" + pickedCard.card + \" of \" + *\n\n*pickedCard.suit);*\n\nNote that\
    \ createCardPicker is a function that returns a function. If we try \n\nto run\
    \ this example, we will get an error instead of the expected message. \n\nThis\
    \ is because this, which is used in the function created by createCard­\n\nPicker,\
    \ points to the window and not to the deck object. All this is due to \n\nthe\
    \ fact that cardPicker() is called by itself. When using a similar syntax, \n\n\
    when a function is called as a non-method, and at the very top level of the \n\
    \nprogram, this will point to window. (Note: in strict mode, in such cases, \n\
    \nthis will have the value undefined, not window.)\n\nYou can fix this by making\
    \ sure that the function is bound to the correct \n\nvalue of this before returning\
    \ it. In this case, regardless of how it will be \n\nused in the future, it will\
    \ still have access to the original deck object. To do \n\nthis, you need to change\
    \ the function, and use the syntax of the arrow func­\n\ntion from the ECMAScript\
    \ 6 standard. Arrow functions capture the value \n\nof this as it was at the time\
    \ of its creation (and not at the time of the call):\n\n*let deck = {*\n\n *suits:\
    \ \\[\"hearts\", \"spades\", \"clubs\", \"diamonds\"\\],*\n\n *cards: Array(52),*\n\
    \n *createCardPicker: function() {*\n\n *//ATTENTION: the line below is an arrow\
    \ *\n\n*function that captures the value of ’this’ from this *\n\n*place*\n\n\
    \ *return () => {*\n\n *let pickedCard = Math.floor(Math.random() *\n\n*\\* 52);*\n\
    \n *let pickedSuit = Math.floor(pickedCard / *\n\n*13);*\n\n *return {suit: this.suits\\\
    [pickedSuit\\], *\n\n*card: pickedCard % 13};*"
