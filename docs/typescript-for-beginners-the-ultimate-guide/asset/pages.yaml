  md: "**48**    ◾    TypeScript for Beginners\n\nThe syntax should be familiar if\
    \ you’ve already programmed in C# or \n\nJava. We have declared a new Greeter\
    \ class. This class has three members: \n\nthe greeting property, the constructor,\
    \ and the greet method.\n\nYou’ve noticed that when we access one of the class\
    \ fields, we add this \n\nbefore the field name. It means that we are accessing\
    \ a member of the \n\nclass.\n\nIn the last line, we create an instance of the\
    \ Greeter class using new. It \n\ncalls the constructor that we defined earlier,\
    \ creates a new object, and runs \n\nthe constructor to initialize it.\n\nInheritance\n\
    \nTS uses the usual approaches of object-oriented programming. Of course, \n\n\
    one of the most fundamental approaches in class-based programming is \n\nto create\
    \ new classes using inheritance.\n\nInheritance is another paradigm that is one\
    \ of the cornerstones of \n\nobject-oriented programming. Inheritance means that\
    \ an object uses \n\nanother object as its base type, thereby inheriting all the\
    \ characteristics of \n\nthe base object, including all the properties and functions.\
    \ Both interfaces \n\nand classes can use inheritance. The interface or class\
    \ that inherits from \n\nit is known as the base interface or base class, and\
    \ the interface or class \n\nthat inherits from it is known as the derived interface\
    \ or derived class. TS \n\nimplements inheritance using the extends keyword.\n\
    \nLet’s look at the following example:\n\n*class Animal {*\n\n *name: string;*\n\
    \n *constructor(theName: string) { this.name = theName; *\n\n*}*\n\n *move(distanceInMeters:\
    \ number = 0) {*\n\n *console.log('${this.name} moved *\n\n*${distanceInMeters}m.');*\n\
    \n *}*\n\n*}*\n\n \n\n*class Frog extends Animal {*\n\n *constructor(name: string)\
    \ { super(name); }*\n\n *move(distanceInMeters = 5) {*\n\n *console.log(\"Jumping...\"\
    );*"
