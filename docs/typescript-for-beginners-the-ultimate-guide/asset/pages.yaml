  md: "Modules and Namespaces    ◾   ** 119**\n\nRelative import will be allowed relative\
    \ to the imported file. So *import *\n\n*{b} from “. /ModuleB”* in the source\
    \ file */root/src/folder/A. ts* will search for \n\nthe following files:\n\n*/root/src/folder/moduleB.ts*\n\
    \n*/root/src/folder/moduleB.d.ts*\n\nFor nonrelative module imports, the compiler\
    \ will search the directory \n\ntree for a suitable definition file, starting\
    \ with the directory containing the \n\nimporting file.\n\nFor example:\n\nNonrelative\
    \ import from *ModuleB*, such as import *{b} from \"ModuleB\"*, \n\nlocated in\
    \ the source code file */root/src/folder/A.ts*, will search for \"*ModuleB\"*\
    \ \n\nin the following locations:\n\n*/root/src/folder/moduleB.ts*\n\n*/root/src/folder/moduleB.d.ts*\n\
    \n*/root/src/moduleB.ts*\n\n*/root/src/moduleB.d.ts*\n\n*/root/moduleB.ts*\n\n\
    */root/moduleB.d.ts*\n\n*/moduleB.ts*\n\n*/moduleB.d.ts*\n\nNode \n\nThis strategy\
    \ copies the behavior of a dynamic module resolution \n\nengine Node.js. See the\
    \ full description of the Node resolution algorithm.\n\njs in the module documentation\
    \ Node.js.\n\n*How Does Node.js Resolve Modules?*\n\nTo understand which way the\
    \ TS compiler will go, it is important to under­\n\nstand a little about the modules\
    \ Node.js. Import to Node.js is executed \n\nby calling the require function.\
    \ Node.js will act differently depending on \n\nwhether a relative or nonrelative\
    \ path is specified in require.\n\nUsing relative paths is usually not difficult.\
    \ For an example, let’s look \n\nat the/root/src/ModuleA file.js, which has the\
    \ following import statement \n\nvar x = require (“. /ModuleB”); Node.js allows\
    \ this import in this order:\n\n1\\. As a file named /root/src/ModuleB.js, if\
    \ it exists.\n\n2\\. As the /root/src/ModuleB directory, if it has a package file.json,\
    \ which \n\ndefines the “main” module. In our example, if Node.js found the /root/"
