  md: "**130**    ◾    TypeScript for Beginners\n\nInstallation of Deno\n\nLet’s get\
    \ down to business, and start with the installation, we will analyze \n\nwhat,\
    \ where, how, and why it is installed.\n\nUsing Shell (Mac, Linux):\n\n*curl -fsSL\
    \ **https://deno.land/x/install/install. *\n\n*sh | sh*\n\nPowerShell (Windows):\n\
    \n*iwr **https://deno.land/x/install/install.ps1*\n\n*\\-useb | iex*\n\nHomebrew\
    \ (Mac):\n\n*brew install deno*\n\nChocolatey (Windows):\n\n*choco install deno*\n\
    \nScoop (Windows):\n\n*scoop install deno*\n\nHere I should warn you that installing\
    \ with the help of package managers \n\ncarries a danger in the form of an incomplete\
    \ complete removal and update \n\nmechanism. It is best to control the versions\
    \ and paths where it will be installed.\n\nAlso, to upgrade to the current version,\
    \ the Deno upgrade command is \n\nprovided.\n\nWell, now let’s analyze the installer\
    \ itself using the example of installa­\n\ntion in Windows.\n\n*Installation in\
    \ Windows*\n\nAlmost everything in Deno is based on GitHub, and the installation\
    \ will \n\nbe made from it, and the latest release will be taken from it.\n\n\
    In the future, to ensure the operation of Deno as a whole, the following \n\n\
    files and directories will be created along the path {username}\\\\AppData\\\\\
    \n\nLocal\\\\deno:\n\n• ** deps:** This directory will contain all the dependencies\
    \ that were ever \n\ndownloaded, grouped by the download path, and also next to\
    \ each \n\nfile will be a separate metadata file, which specifies the response"
