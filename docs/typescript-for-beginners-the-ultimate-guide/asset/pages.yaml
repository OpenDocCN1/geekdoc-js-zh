  md: "Key Concepts of TS    ◾   ** 65**\n\n*}*\n\n*let myAdd = function(x: number,\
    \ y: number): number *\n\n*{return x+y; };*\n\nYou can add types to each parameter,\
    \ as well as to the function itself, to \n\nspecify the type of the return value.\
    \ TS can infer the type of the return \n\nvalue itself by analyzing the return\
    \ statements, so it is often possible not to \n\nspecify it explicitly.\n\nNow\
    \ let’s describe the full type of this function:\n\n*let myAdd: (x: number, y:\
    \ number)=>number =*\n\n *function(x: number, y: number): number {return *\n\n\
    *x+y; };*\n\nA functional type consists of two parts: the argument types and the\
    \ return \n\ntype. The type of the return value is determined after =>. In the\
    \ event that \n\nthe function does not return any value, void must be specified.\n\
    \nAlso in the example above, we changed the names of the parameters \n\npassed\
    \ to the function. This is done for better code readability. You should \n\nalways\
    \ try to give “talking” or understandable names to the parameters. \n\nThis will\
    \ make it easier for others to read your code, as well as for you \n\nwhen you\
    \ return to it after some time.\n\nIt is worth noting that only the parameters\
    \ passed to the function \n\nand the return value determine its type. The captured\
    \ variables are not \n\nincluded in the type description. Therefore, they are\
    \ part of a certain “hid­\n\nden state” of the function and are not included in\
    \ the API.\n\n*Inferring Types*\n\nExperimenting with the following example, you\
    \ can see that the TS com­\n\npiler is able to deal with types if they are specified\
    \ in only one-half of the \n\nexpression:\n\n*// myAdd has the full function type*\n\
    \n*let myAdd = function(x: number, y: number): number { *\n\n*return  x + y; };*\n\
    \n *// Parameters ’x’ and ’y’ — has \"number\" type*\n\n*let myAdd: (baseValue:number,\
    \ increment:number) => *\n\n*number =*\n\n *function(x, y) { return x + y; };*"
