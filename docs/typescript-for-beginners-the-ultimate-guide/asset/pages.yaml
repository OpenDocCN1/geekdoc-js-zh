  md: "Modules and Namespaces    ◾   ** 109**\n\nThe main idea of the example is that\
    \ the import id = require(“…”) com­\n\nmand gives access to the types that are\
    \ disclosed by this module. As shown \n\nin the if block below, the module loader\
    \ is called dynamically (using \n\nrequire). Thus, the optimization of skipping\
    \ unused links is applied, which \n\nleads to loading the module only when it\
    \ is needed. For this technique to \n\nwork, it is necessary that the identifier\
    \ defined using import is used only \n\nin the type description (i.e., never in\
    \ a place in the code that will fall into \n\nthe final JavaScript).\n\nThe typeof\
    \ keyword is used to support type security. The typeof key­\n\nword, when used\
    \ in a type description, creates a value type (the module \n\ntype in this case).\n\
    \n**Dynamic Loading of Modules in Node.js**\n\n*declare function require(moduleName:\
    \ string): any;*\n\n*import { ZipCodeValidator as Zip } from \"./*\n\n*ZipCodeValidator\"\
    ;*\n\n*if (needZipValidation) {*\n\n*    let ZipCodeValidator: typeof Zip = require(\"\
    ./*\n\n*ZipCodeValidator\");*\n\n*    let validator = new ZipCodeValidator();*\n\
    \n*    if (validator.isAcceptable(\"...\")) { /\\* ... \\*/ }*\n\n*}*\n\nExample:\
    \ dynamic loading of modules in require.js\n\n*declare function require(moduleNames:\
    \ string\\[\\], *\n\n*onLoad: (...args: any\\[\\]) => void): void;*\n\n*import\
    \ { ZipCodeValidator as Zip } from \"./*\n\n*ZipCodeValidator\";*\n\n*if (needZipValidation)\
    \ {*\n\n *require(\\[\"./ZipCodeValidator\"\\], (ZipCodeValidator: *\n\n*typeof\
    \ Zip) => {*\n\n *let validator = new ZipCodeValidator();*\n\n *if (validator.isAcceptable(\"\
    ...\")) { /\\* ... \\*/ *\n\n*}*\n\n *});*\n\n*}*\n\nExample: Dynamic loading\
    \ of modules in System.js\n\n*declare const System: any;*"
