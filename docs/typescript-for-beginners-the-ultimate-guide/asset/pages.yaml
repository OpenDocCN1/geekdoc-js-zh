  md: "TypeScript Architecture    ◾   ** 169**\n\ncode that, for example, performs\
    \ an asynchronous call to load a JSON \n\nblock, module testing of this code will\
    \ require locking the returned JSON. \n\nThis method ensures that the object under\
    \ testing is always given a known \n\nset of data. When new requirements arise,\
    \ this well-known data set can \n\ngrow and expand, of course. The objects under\
    \ testing should be designed \n\nto interact with interfaces, so that these interfaces\
    \ can be easily mocked or \n\nsilenced in a module testing scenario.\n\nIntegration\
    \ Testings\n\nIntegration testings are another form of white-box testings that\
    \ allow the \n\nobject under testing to run in an environment close to real-world\
    \ code. In \n\nour previous example, when some code executes an asynchronous call\
    \ to \n\nload a JSON block, the integration testing actually needs to call the\
    \ REST \n\nservices that generate the JSON. If this REST service relies on data\
    \ from \n\nthe database, then the integration testing will require data in the\
    \ data­\n\nbase that matches the integration testing scenario. If we were to describe\
    \ \n\na module testing as having a boundary around the object under testing, \n\
    \nthen an integration testing is simply an extension of that boundary to \n\n\
    include dependent objects or services.\n\nCreating automated integration testings\
    \ for your applications will \n\nsignificantly improve the quality of your product.\
    \ Consider the case of \n\nthe scenario we used when a block of code calls the\
    \ REST service for \n\ndata in JSON format. Someone can easily change the structure\
    \ of this \n\ndata returned by the REST service. Our unit testings will still\
    \ pass, as \n\nthey don’t actually call the REST code on the server side, but\
    \ our appli­\n\ncation will be messed up because the returned JSON doesn’t meet\
    \ our \n\nexpectations.\n\nWithout integration testings, these types of errors\
    \ will only be detected \n\nat later stages of manual testing. By thinking about\
    \ integration testings, \n\nby implementing specific data sets for integration\
    \ testings and embedding \n\nthem in your own set, you can quickly eliminate such\
    \ errors.\n\nAcceptance Testings\n\nAcceptance testings are black-box testings\
    \ and are generally scenario-\n\nbased. They can include multiple custom screens\
    \ or custom interactions \n\nto pass through. These tests are also commonly performed\
    \ by the test \n\nteam, as they may require logging in to the application, searching\
    \ for a \n\nspecific dataset, updating data, and so on. Using planning and the\
    \ many"
