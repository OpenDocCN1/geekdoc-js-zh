  md: "TS Runtime    ◾   ** 129**\n\nDeno is a secure JS/TS runtime built on V8, Rust,\
    \ and Tokio, providing \n\ndefault security and developer-friendly. The Deno runtime\
    \ environment \n\nby Ryan Dahl (creator of Node.js) started developing to replace\
    \ Node.js, \n\nreleased back in 2009, due to the lack of important, in his opinion,\
    \ short­\n\ncomings. Ryan’s reason for thinking about Deno was due to several\
    \ prob­\n\nlems in Node.js:\n\n• modular system and its distribution,\n\n• support\
    \ for legacy APIs,\n\n• security issues.\n\nMain Features of Deno\n\n*Safety*\n\
    \nBy default, Deno prohibits sensitive actions such as reading environment \n\n\
    variables or writing to the file system.\n\nThe Deno process runs in unprivileged\
    \ mode, and to access data like \n\nenvironment variables, you need to pass special\
    \ flags.\n\nWrite permission to the file system, as well as permissions related\
    \ to the \n\nenvironment and network, are disabled. To allow these actions, call\
    \ Deno \n\nwith the –allow-write and –allow-net arguments.\n\nAll interaction\
    \ between the privileged Deno process and v8 is reduced \n\nto messaging (previously\
    \ written in Go, now ported to Rust). This allows \n\nyou to create a single point\
    \ for checking all messages.\n\n*Module System*\n\nForget about package.json and\
    \ node\\_modules. When importing source \n\nfiles, you can specify either a relative\
    \ or absolute path, or their full URL:\n\n*import { test } from \"**https://unpkg.com/deno\\\
    _*\n\n*testing@0.0.5/testing.ts**\"*\n\n*import { log } from \"./util.ts\"*\n\n\
    By default, all source files are cached. You can use the –reload argument to \n\
    \nupdate dependencies. It works like the F5 key in the browser.\n\nTS support\
    \ out of the box\n\nTS is supported in Deno by default. That’s it. Without any\
    \ “but.” \n\nWithout configurations."
