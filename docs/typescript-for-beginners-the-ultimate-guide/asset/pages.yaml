  md: "**144**    ◾    TypeScript for Beginners\n\na union of string literals, for\
    \ example), then it will rise to the top of the \n\ncombined list of overloads.\n\
    \nMerging Namespaces\n\nLike interfaces, members of namespaces with the same names\
    \ are also \n\ncombined. Since declaring a namespace creates both a namespace\
    \ and a \n\nvalue, you need to understand how they are all combined.\n\nTo merge\
    \ namespaces, the type declarations from the exported inter­\n\nfaces in each\
    \ of the namespaces are combined to form a single namespace \n\nwith the combined\
    \ interface definitions inside.\n\nWhen merging namespace values, each definition\
    \ is taken, and if \n\na namespace with that name already exists, it is expanded\
    \ by adding \n\nexported members from the second namespace.\n\nIn this example,\
    \ the combined declaration is Animals:\n\n*namespace Animals {*\n\n *export class\
    \ Zebra { }*\n\n*}*\n\n*namespace Animals {*\n\n *export interface Legged { numberOfLegs:\
    \ number; }*\n\n *export class Dog { }*\n\n*}*\n\nequivalent to:\n\n*namespace\
    \ Animals {*\n\n *export interface Legged { numberOfLegs: number; }*\n\n *export\
    \ class Zebra { }*\n\n *export class Dog { }*\n\n*}*\n\nThis namespace merge model\
    \ is not bad to start with, but you need to \n\nunderstand what happens to members\
    \ that are not exported. Non-exported \n\nmembers are only visible in the original\
    \ (non-merged) namespace. This \n\nmeans that after the merge, they will not be\
    \ visible to members from other \n\nads. This can be seen more clearly in the\
    \ following example:\n\n*namespace Animal {*\n\n *let haveMuscles = true;*"
