  md: "**127**\n\nDOI: 10.1201/9781003203728-4\n\nC h a p t e r 4\n\nTS Runtime\n\n\
    WHAT IS RUNTIME?\n\nRuntime is a computing environment that is necessary for the\
    \ execution of \n\na computer program and is available during the execution of\
    \ a computer \n\nprogram. In the runtime environment, it is usually impossible\
    \ to change \n\nthe source code of the program, but there may be access to the\
    \ operating \n\nsystem environment variables, object tables, and shared library\
    \ modules.\n\nInteraction with the runtime environment for interpreted program­\n\
    \nming languages is implemented directly in the interpreter, which provides \n\
    \ninteraction of language constructs with the environment in which it is \n\n\
    run. For compiled languages, interaction with the computing environ­\n\nment can\
    \ be implemented by a set of plug-in shared runtime libraries, \n\nor entirely\
    \ in a virtual machine that executes the intermediate code into \n\nwhich the\
    \ program is compiled.\n\nNODE.JS\n\nNode is a runtime environment that allows\
    \ you to write server-side \n\nJavaScript (JS) code. It became very widely distributed\
    \ after its release in \n\n2011\\. With the growth of the code base, writing server-side\
    \ JS code can be \n\ndifficult due to the nature of the JS language: dynamic and\
    \ weakly typed.\n\nNode.js is not a separate programming language but a platform\
    \ for \n\nusing JS on the server side. If we talk about the language, then both\
    \ the \n\nfrontend and the backend use the same JS. The only difference is in\
    \ the set \n\nof APIs that frontenders and backenders use."
