    \ the roots that make \n\nup this “virtual” directory, allowing the compiler to\
    \ allow relative module \n\nimport commands within these “virtual” directories,\
    \ as if they were com­\n\nbined into a single directory.\n\nFor an example, let’s\
    \ look at the following project structure:\n\n*src*\n\n*└── views*\n\n *└── view1.ts\
    \ (imports ’./template1’)*\n\n *└── view2.ts*"
