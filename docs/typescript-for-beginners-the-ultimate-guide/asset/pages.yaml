  md: "**72**    ◾    TypeScript for Beginners\n\n*let result2 = buildName(\"Sam\"\
    , undefined); // also *\n\n*works and returns \"Sam Smith\"*\n\n*let result3 =\
    \ buildName(\"Sam\", \"Adams\", \"Sr.\"); // *\n\n*error, too many parameters*\n\
    \n*let result4 = buildName(\"Sam\", \"Adams\"); // *\n\n*correct*\n\nThe default\
    \ parameters that follow all the required parameters are consid­\n\nered optional.\
    \ Just like the optional ones, you can skip them when calling \n\nthe function.\
    \ This means that the types of optional parameters and default \n\nparameters\
    \ that are at the end will be compatible, so this function …\n\n*function buildName(firstName:\
    \ string, lastName?: *\n\n*string) {*\n\n *//* …\n\n*}*\n\nAnd this\n\n*function\
    \ buildName(firstName: string, lastName = *\n\n*\"Smith\") {*\n\n *//* …\n\n*}*\n\
    \nwill have the same type (firstName: string, lastName?: string) = > string. \n\
    \nThe default value for the *lastName* parameter in the function type descrip­\n\
    \ntion disappears, leaving only the fact that the last parameter is optional.\n\
    \nUnlike simple optional parameters, the default parameters do not \n\nhave to\
    \ be placed after the required parameters. If the default parame­\n\nter is followed\
    \ by a mandatory parameter, you will have to explicitly pass \n\nundefined to\
    \ set the default value. For example, the last example can be \n\nrewritten using\
    \ only the default parameter for *firstName*:\n\n*function buildName(firstName\
    \ = \"Will\", lastName: *\n\n*string) {*\n\n *return firstName + \" \" + lastName;*\n\
    \n*}*\n\n \n\n*let result1 = buildName(\"Sam\"); // *\n\n*error, too few parameters*"
