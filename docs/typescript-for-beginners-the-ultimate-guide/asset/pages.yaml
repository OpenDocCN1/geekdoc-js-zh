  md: "**82**    ◾    TypeScript for Beginners\n\n*function pickCard(x: number): {suit:\
    \ string; card: *\n\n*number; };*\n\n*function pickCard(x): any {*\n\n *// Working\
    \ with object/array?*\n\n *// So, we were given a deck and we choose a card*\n\
    \n *if (typeof x == \"object\") {*\n\n *let pickedCard = Math.floor(Math.random()\
    \ \\* *\n\n*x.length);*\n\n *return pickedCard;*\n\n *}*\n\n *// Otherwise, we\
    \ give you the opportunity to *\n\n*choose a card*\n\n *else if (typeof x == \"\
    number\") {*\n\n *let pickedSuit = Math.floor(x / 13);*\n\n *return { suit: suits\\\
    [pickedSuit\\], card: x % *\n\n*13 };*\n\n *}*\n\n*}*\n\n*let myDeck = \\[{ suit:\
    \ \"diamonds\", card: 2 }, { suit: *\n\n*\"spades\", card: 10 }, { suit: \"hearts\"\
    , card: 4 }\\];*\n\n*let pickedCard1 = myDeck\\[pickCard(myDeck)\\];*\n\n*alert(\"\
    card: \" + pickedCard1.card + \" of \" + *\n\n*pickedCard1.suit);*\n\n*let pickedCard2\
    \ = pickCard(15);*\n\n*alert(\"card: \" + pickedCard2.card + \" of \" + *\n\n\
    *pickedCard2.suit);*\n\nBy changing the code in this way, we get the ability to\
    \ call the pickCard \n\nfunction, performing a type check.\n\nIn order to select\
    \ the correct type check, the compiler performs actions \n\nsimilar to those in\
    \ JavaScript. It looks through the list of overloads, start­\n\ning with the first\
    \ element, and matches the function parameters. If the \n\nparameters are appropriate,\
    \ the compiler selects this overload as the cor­\n\nrect one. Therefore, as a\
    \ rule, function overloads are ordered from the \n\nmost specific to the least\
    \ specific.\n\nNote that the code section function *pickCard(x):* any is not included\
    \ in \n\nthe list of overloads; there are only two elements in this list, one\
    \ of which \n\ntakes an object and the other a number. Calling *pickCard* with\
    \ any other \n\ntypes of parameters will result in an error."
