  md: "**80**    ◾    TypeScript for Beginners\n\nOverloads\n\nTS supports function\
    \ overloading, meaning we can define multiple ver­\n\nsions of a function that\
    \ will have the same name, but different parameter \n\ntypes or different number\
    \ of parameters. For overloading, we first define \n\nall versions of the function\
    \ that will not have any logic. And then we define \n\na version of the function\
    \ with a common signature that fits all the previ­\n\nously defined options. And\
    \ in this general version, we already define the \n\nspecific logic of the function.\n\
    \nFor example, we need to combine two values, but if they represent \n\nstrings,\
    \ then just concatenate them, and if numbers, then add them. Then \n\nwe could\
    \ use the following function:\n\n*function add(x: string, y: string): string;*\n\
    \n*function add(x: number, y: number): number;*\n\n*function add(x: any, y: any):\
    \ any {*\n\n *return x + y;*\n\n*}*\n\n \n\n*let result1 = add(5, 7);*\n\n*console.log(result1);\
    \ // 12*\n\n*let result2 = add(\"5\", \"7\");*\n\n*console.log(result2); // 57*\n\
    \nThe first version of the add function takes two strings and returns a string,\
    \ \n\nthe second version takes two numbers and returns a number. Common to \n\n\
    them is a function that takes parameters of type any and returns a result \n\n\
    of type any as well.\n\nBut if we applied the same function to *boolean* values:\n\
    \n*let result3 = add(true, false);*\n\n*console.log(result3);*\n\nThen we would\
    \ get an error, since two versions of the function allow you \n\nto take either\
    \ two strings or two numbers as parameters. And in this case, \n\nwe would need\
    \ to add another version of the function for *boolean* values:\n\n*function add(x:\
    \ boolean, y: boolean): boolean;*\n\nJavaScript is by its very nature a very dynamic\
    \ language. It is not uncom­\n\nmon to find functions that return objects of different\
    \ types depending on \n\nthe arguments passed."
  merge: -1
