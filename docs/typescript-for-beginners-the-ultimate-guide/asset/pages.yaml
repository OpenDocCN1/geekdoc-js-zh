  md: "**112**    ◾    TypeScript for Beginners \n\nUMD MODULES\n\nSome libraries\
    \ are designed to be used with many module loaders or \n\nno loaders at all (global\
    \ variables). They are called UMD or Isomorphic \n\nmodules. You can connect such\
    \ libraries either by importing them or as a \n\nglobal variable. For example:\n\
    \n***math-lib.d.ts***\n\n*export const isPrime(x: number): boolean;*\n\n*export\
    \ as namespace mathLib;*\n\nYou can connect this library inside the module by\
    \ importing it:\n\n*import {isPrime} from \"math-lib\";*\n\n*isPrime(2);*\n\n\
    *mathLib.isPrime(2); // Error: unable to use the global *\n\n*definition inside\
    \ the module*\n\nYou can also connect this library as a global variable, but this\
    \ can only \n\nbe done inside the script. (A script is a file without import and\
    \ export \n\ncommands).\n\n*mathLib.isPrime(2);*\n\nSTRUCTURING MODULES\n\nExport\
    \ as Close to the Top Level as Possible\n\nThe less problems the module users\
    \ have with using the exported elements, \n\nthe better. Adding nesting levels\
    \ makes the module more cumbersome, so \n\nyou need to think carefully about its\
    \ structure.\n\nExporting from a namespace module is just an example of adding\
    \ \n\nan extra level of nesting. Although namespaces can be useful, they add \n\
    \nanother layer of abstraction to modules, which can lead to problems for \n\n\
    users very soon and is usually not necessary.\n\nStatic methods of exported classes\
    \ cause similar problems, since the \n\nclass itself adds a level of nesting.\
    \ It is acceptable to do this if you know \n\nexactly what you are doing, and\
    \ the introduction of an additional level of \n\nnesting will add expressiveness\
    \ and clearly reflect the purpose of the mod­\n\nule. Otherwise, we recommend\
    \ using the helper function.\n\nIf You Export Only One *Class* or One *Function*,\
    \ Use Export *Default*\n\nSimilar to “export as close to the top level as possible,”\
    \ using the default \n\nexport makes life easier for the users of your module.\
    \ If the main task of the"
