  md: "Modules and Namespaces    ◾   ** 103**\n\n*export \\* from \"./ZipCodeValidator\"\
    ; / / exports the *\n\n*’ZipCodeValidator’class*\n\nImport\n\nImporting is almost\
    \ as easy as exporting. To import an exported ad, use \n\none of the import forms\
    \ below:\n\n*Importing a Single Exported Item*\n\n*import { ZipCodeValidator }\
    \ from \"./ZipCodeValidator\";*\n\n*let myValidator = new ZipCodeValidator();*\n\
    \nthe imported element can also be renamed\n\n*import { ZipCodeValidator as ZCV\
    \ } from \"./*\n\n*ZipCodeValidator\";*\n\n*let myValidator = new ZCV();*\n\n\
    *Importing the Entire Module into a Single Variable, and *\n\n*Using It to Access\
    \ the Exported Module Elements*\n\n*import \\* as validator from \"./ZipCodeValidator\"\
    ;*\n\n*let myValidator = new validator.ZipCodeValidator();*\n\n*Importing a Module\
    \ for the Sake of “Side Effects”*\n\nDespite the fact that it is not recommended\
    \ to do this, some modules set a \n\ncertain global state that can be used by\
    \ other modules. These modules may \n\nnot have exported elements, or the user\
    \ does not need these elements. To \n\nimport such modules, use the command:\n\
    \n*import \"./my-module.js\";*\n\n*Default Export*\n\nEach module can contain\
    \ a default export. The default export is high­\n\nlighted with the default keyword,\
    \ and there can only be one such state­\n\nment in a module. To import an export,\
    \ a separate form of the import \n\nstatement is used by default.\n\nThe default\
    \ export can be very useful. For example, a library like Jquery \n\ncan export\
    \ jQuery or $ by default, which we probably also import under \n\nthe name $ or\
    \ jQuery.\n\n***JQuery.d.ts***\n\n*declare let $: JQuery;*\n\n*export default\
    \ $;*"
