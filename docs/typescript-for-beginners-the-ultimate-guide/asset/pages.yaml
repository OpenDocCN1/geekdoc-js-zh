  md: "**56**    ◾    TypeScript for Beginners\n\n *age: 2*\n\n*};*\n\n*const readOnlyCar:\
    \ ReadonlyCar = {*\n\n *name: \"BMW\",*\n\n *age: 5*\n\n*};*\n\n*car.age = 8;*\n\
    \n*readOnlyCar.age = 10; // Cannot assign to ’age’ *\n\n*because it is a read-only\
    \ property*\n\nIn the case of *ReadonlyCar.age*, TS tells us that age is *readonly*\
    \ – *Cannot *\n\n*assign to ‘age’ because it is a read-only property*.\n\nAnd\
    \ this is normal, because we have specified that all its properties are \n\nreadonly.\
    \ The readonly status is not the only thing we can change in the \n\ntype iterator\
    \ modifiers.\n\nWe can specify that all properties are optional via?.\n\n*type\
    \ ReadonlyCar = {*\n\n *readonly \\[K in keyof ICar\\]?: ICar\\[K\\];*\n\n*};*\n\
    \nAlso, we can specify that all properties are strings, or make each property\
    \ \n\nas a union of their original type and string through a vertical bar |. There\
    \ \n\nare many options.\n\n*type ReadonlyCar = {*\n\n *readonly \\[K in keyof\
    \ ICar\\]?: ICar\\[K\\] | string;*\n\n*};*\n\nHowever, with the syntax readonly\
    \ \\[K in keyof ICar\\]: ICar\\[K\\]; we can only \n\nadd new elements to existing\
    \ types. We can add the flag readonly or? sign.\n\nIf the original type has a\
    \ property that is optional, for example:\n\n*interface ICar {*\n\n *name: string;*\n\
    \n *age: number;*\n\n *color?: string;*\n\n*}*\n\nWe can remove the flag not only\
    \ with? sign. Starting with TS 2.8, it \n\nbecame possible to add a minus sign\
    \ (-) before the character that we want \n\nto remove."
