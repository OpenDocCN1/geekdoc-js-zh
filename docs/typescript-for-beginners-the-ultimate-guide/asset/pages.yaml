  md: "**52**    ◾    TypeScript for Beginners\n\nC# requires each member to be explicitly\
    \ marked public for visibility. In \n\nTS, however, each class member will be\
    \ public by default.\n\nBut we can mark the members of the class public explicitly.\
    \ The Animal \n\nclass from the previous section will look like this:\n\n*class\
    \ Animal {*\n\n *public name: string;*\n\n *public constructor(theName: string)\
    \ { this.name = *\n\n*theName; }*\n\n *public move(distanceInMeters: number) {*\n\
    \n *console.log(\\`${this.name} moved *\n\n*${distanceInMeters}m.\\`);*\n\n *}*\n\
    \n*}*\n\n*Private Modifier*\n\nWhen a class member is marked with the private\
    \ modifier, it cannot be \n\naccessed outside of that class. For example:\n\n\
    *class Animal {*\n\n *private name: string;*\n\n *constructor(theName: string)\
    \ { this.name = theName; *\n\n*}*\n\n*}*\n\n \n\n*new Animal(\"Cat\").name; //\
    \ erroe\\\\: ’name’ is private;*\n\nTS is a structured type system. When we compare\
    \ two different types, \n\nregardless of where and how they are described and\
    \ implemented, if the \n\ntypes of all their members are compatible, it can be\
    \ argued that the types \n\nthemselves are compatible. However, when comparing\
    \ types with the pri­\n\nvate access modifier, this happens differently. Two types\
    \ will be consid­\n\nered compatible if both members have the private modifier\
    \ from the same \n\ndeclaration. This also applies to protected members.\n\nLet’s\
    \ look at an example to understand how it works in practice:\n\n*class Animal\
    \ {*\n\n *private name: string;*\n\n *constructor(theName: string) { this.name\
    \ = theName; *\n\n*}*"
