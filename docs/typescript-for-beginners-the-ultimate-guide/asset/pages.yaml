  md: "**78**    ◾    TypeScript for Beginners\n\n *createCardPicker: function(this:\
    \ Deck) {*\n\n *return () => {*\n\n *let pickedCard = Math.floor(Math.random()\
    \ *\n\n*\\* 52);*\n\n *let pickedSuit = Math.floor(pickedCard / *\n\n*13);*\n\n\
    \ *return {suit: this.suits\\[pickedSuit\\], *\n\n*card: pickedCard % 13};*\n\n\
    \ *}*\n\n *}*\n\n*}*\n\n*let cardPicker = deck.createCardPicker();*\n\n*let pickedCard\
    \ = cardPicker();*\n\n*alert(\"card: \" + pickedCard.card + \" of \" + *\n\n*pickedCard.suit);*\n\
    \nThe compiler now knows that the *createCardPicker* function expects to be \n\
    \ncalled on an object with the Deck type. This means that the type of this value\
    \ \n\nis now Deck, not any, and the –*noImplicitThis* flag will not throw errors.\n\
    \n*this Parameters for Callback Functions*\n\nYou may also encounter this-related\
    \ errors in callback functions when the \n\nfunctions are passed to a library\
    \ that will later call them. Since the passed \n\nfunction will be called by the\
    \ library as a normal function, this will have \n\nthe value undefined. With some\
    \ effort, you can use the *this* parameter to \n\nprevent such errors. First,\
    \ the library developer must accompany the type \n\nof the callback function with\
    \ the *this* parameter:\n\n*interface UIElement {*\n\n *addClickListener(onclick:\
    \ (this: void, e: Event) => *\n\n*void): void;*\n\n*}*\n\n*this: void* means that\
    \ *addClickListener* assumes that the onclick function \n\ndoes not require this.\
    \ Secondly, the code that is called must also be accom­\n\npanied by the *this*\
    \ parameter:\n\n*class Handler {*\n\n *info: string;*\n\n *onClickBad(this: Handler,\
    \ e: Event) {*"
