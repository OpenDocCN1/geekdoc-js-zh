  md: "**1**\n\nDOI: 10.1201/9781003203728-1\n\nC h a p t e r 1\n\nTypeScript\n\n\
    *Introduction to TypeScript*\n\nTypeScript (TS) is a typed extended set of JavaScript\
    \ (JS) that compiles to \n\nplain JS. As an analogy, if JS was CSS, then TS would\
    \ be SCSS.\n\nAll valid JS code you write is also valid TS code. However, by using\
    \ TS, \n\nyou get to use static typing and the latest features that compile into\
    \ simple \n\nJS that is supported by all browsers. TS aims to solve the JS scaling\
    \ prob­\n\nlem, and it works pretty well.\n\nIn this book, you’ll start by reading\
    \ about the various features of TS and \n\nwhy learning it is a good idea. The\
    \ rest of this book will focus on install­\n\ning and compiling TS, along with\
    \ some popular text editors that offer you \n\nsupport for TS syntax and other\
    \ important features.\n\nWHAT IS TS?\n\nTS is a kind of updated version of the\
    \ JS language. It can run on Node.js \n\nor any web browser that supports ECMAScript\
    \ 3 or higher. TS is a stati­\n\ncally compiled language that provides optional\
    \ static typing, classes, and \n\nan interface. It allows you to write simple\
    \ and clean JS code. So, adopting \n\nTS can help you create more easily deployable\
    \ and more reliable software.\n\nA BRIEF HISTORY OF TS\n\nTS development began\
    \ in late 2012. Although it originated in Microsoft, \n\nand its actual creator\
    \ is the programmer Anders Hejlsberg, also known as"
  merge: -1
  pgno: 17
- img_proc: true
  md: "**2**    ◾    TypeScript for Beginners\n\nthe creator of such languages as\
    \ Delphi and C#, this project immediately \n\nbegan to develop as an OpenSource.\
    \ And from the very beginning, the new \n\nlanguage began to spread rapidly due\
    \ to its flexibility and performance. A \n\nlot of projects that were written\
    \ in JS were transferred to TS. The popular­\n\nity and relevance of the ideas\
    \ of the new language has led to the fact that a \n\nnumber of these ideas will\
    \ later become part of the new JS standard. And \n\nthe new version of one of\
    \ the most popular frameworks for web – Angular \n\n2/4/5/6 is completely written\
    \ in TS jointly by Microsoft and Google.\n\nWHY SHOULD YOU CHOOSE TS?\n\nHowever,\
    \ it would seem that there is no need for another programming \n\nlanguage for\
    \ the client side in the web environment, if traditional JS, \n\nwhich is used\
    \ on almost every site, which is owned by many developers \n\nand whose support\
    \ in the programming community is quite high, also \n\ncopes with all the same\
    \ work. But TS is not just a new JS.\n\nFirst, it should be noted that TS is a\
    \ strongly typed and compiled lan­\n\nguage, which may be closer to programmers\
    \ of Java, C#, and other strongly \n\ntyped languages, although the output of\
    \ the compiler creates the same JS, \n\nwhich is then executed by the browser.\
    \ However, strong typing reduces the \n\nnumber of potential errors that could\
    \ occur when developing in JS.\n\nSecond, TS implements many of the concepts that\
    \ are common to \n\nobject-oriented languages, such as inheritance, polymorphism,\
    \ encapsu­\n\nlation, access modifiers, and so on.\n\nThird, the potential of\
    \ TS makes it faster and easier to write large com­\n\nplex programs, and therefore\
    \ easier to maintain, develop, scale, and test \n\nthem than in standard JS.\n\
    \nFourth, TS develops as an opensource project and, like many projects, \n\nis\
    \ hosted on GitHub. Repository address – https://github.com/Microsoft/\n\nTypeScript.\
    \ In addition, it is cross-platform, which means that we can use \n\nboth Windows\
    \ and macOS or Linux for development.\n\nAt the same time, TS is a superset of\
    \ JS, which means that any JS pro­\n\ngram is a TS program. In TS, you can use\
    \ all the constructs that are used \n\nin JS – the same operators, conditional,\
    \ cyclic constructs. Moreover, the \n\nTS code is compiled in JS. Ultimately,\
    \ TS is just a tool that is designed to \n\nmake application development easier.\n\
    \nAlthough this language does not provide additional functionality in \n\nthe\
    \ runtime, it offers a number of features that help developers write more \n\n\
    reliable and easier-to-maintain code than in the case of pure JS."
  merge: -1
  pgno: 18
- img_proc: true
  md: "TypeScript    ◾   ** 3**\n\nHow Does TS Help Developers Code Easier?\n\nAs\
    \ its name suggests, it adds a type system to JS. If in JS the type of a \n\n\
    variable is assigned dynamically, then in TS we have to predefine its type \n\n\
    immediately at the time of declaration.\n\nIf we are talking about JS, then you\
    \ can first assign an integer value to a \n\nvariable, and then reassign it to\
    \ a string value.\n\n*let jsVar = 0;*\n\n*jsVar = \"js\";*\n\nIn the case of TS,\
    \ you can restrict this behavior by declaring the type for \n\nthe variable explicitly.\
    \ As a result, if you try, for example, to assign a string \n\nto a variable of\
    \ type number, an error will occur.\n\n*let tsVar: number = 0;*\n\n*tsVar = \"\
    ts\"; //error*\n\nIn fact, this is what distinguishes TS from JS. It uses types,\
    \ which allows us \n\nto avoid stupid errors in the code.\n\nHow Exactly Does\
    \ TS Improve JS?\n\nThe lack of typing cannot be called a disadvantage of JS,\
    \ but it gives pro­\n\ngrammers too much freedom, which inevitably leads to writing\
    \ code with \n\nerrors.\n\n*let aNumber = 123;aNumber = {*\n\n*name: \"Sufyan\"\
    ,*\n\n*age: 29*\n\n*}*\n\nIn the JS example above, nothing prevents the developer\
    \ from presenting \n\nthe object via the aNumber variable. This approach, although\
    \ it will not \n\ncause the program to crash, will completely eliminate the possibility\
    \ of \n\nself-documenting the code at the expense of variable names.\n\nTS easily\
    \ solves this problem by defining the type of a variable when it is \n\ndeclared,\
    \ without further assigning it to a value of another type.\n\n*let aNumber: number\
    \ = 123;*"
  merge: -1
  pgno: 19
- img_proc: true
  md: "**4**    ◾    TypeScript for Beginners\n\nIf this variable is later accessed\
    \ by another developer, they can be sure \n\nthat its value is a number, as the\
    \ name suggests.\n\n*function isEligible(personObj) {*\n\n*return personObj.age\
    \ > 34;*\n\n*}*\n\n*let john = {*\n\n*name: \"Josh\",*\n\n*age: 23*\n\n*};*\n\n\
    *isEligible(john);*\n\nIn this case, the isEligible function expects an object\
    \ with the age \n\nfield. But in JS, there is no way to guarantee that the passed\
    \ argument will \n\nbe exactly an object, or that it will contain the age field.\n\
    \nAgain, TS has a solution for this.\n\n*interface Person {*\n\n*name: string;*\n\
    \n*age: number;*\n\n*}*\n\n*function isEligible(personObj: Person) {*\n\n*return\
    \ personObj.age;*\n\n*}*\n\n*let john = {*\n\n*name: \"Josh\",*\n\n*age: 23*\n\
    \n*};*\n\n*isEligible(john);*\n\nSo far, this code may not be clear to you. But\
    \ note that it guarantees that \n\nthe passed variable has the type Person, which\
    \ is defined at the beginning.\n\nUsing TS will save you from hundreds of careless\
    \ errors in the code, \n\nwhich sometimes turn out to be so stupid that you want\
    \ to tear your hair \n\nout. In addition, your code will become better self-documented\
    \ and easier \n\nto maintain.\n\nIf you didn’t have enough auto-substitution options\
    \ for JS code in \n\nthe integrated development environment (IDE), then you should\
    \ get \n\nacquainted with TS all the more. The presence of types gives this language\
    \ \n\nthe ability to offer more precise substitutions in the IDE."
