  md: "TypeScript    ◾   ** 39**\n\nHowever, TS makes the assumption that there is\
    \ an error in this piece \n\nof code. Object literals are processed by it in a\
    \ special way and are checked \n\nfor the presence of unnecessary properties.\
    \ This check is done when liter­\n\nals are either assigned to other variables\
    \ or passed as arguments. If there \n\nare any properties in the literal that\
    \ are not present in the target type, this \n\nwill be considered an error.\n\n\
    *// error: ’colour’ not expected in type ’SquareConfig’*\n\n*let mySquare = createSquare({\
    \ colour: \"red\", width: *\n\n*100 });*\n\nIt is very easy to bypass such a check.\
    \ The easiest way is to use typecasting:\n\n*let mySquare = createSquare({ width:\
    \ 100, opacity: 0.5 *\n\n*} as SquareConfig);*\n\nIf you are sure that the object\
    \ can have additional properties that will be \n\nused in some special way, then\
    \ there is an even better way – to add a string \n\nindex. If SquareConfig objects\
    \ can have color and width properties, as well \n\nas any number of other properties,\
    \ then the interface can be described as \n\nfollows:\n\n*interface SquareConfig\
    \ {*\n\n *color?: string;*\n\n *width?: number;*\n\n *\\[propName: string\\]:\
    \ any;*\n\n*}*\n\nWe’ll discuss indexes later, but for now just note that in this\
    \ example, \n\nSquareConfig can have any number of properties, and if it’s not\
    \ color or \n\nwidth, then their type doesn’t matter.\n\nThe last way to bypass\
    \ the check for redundant properties – which may \n\nseem a little unexpected\
    \ – is to assign an object to another variable. Since \n\nsquareOptions will not\
    \ pass the check for redundant properties, the com­\n\npiler will not throw an\
    \ error.\n\n*let squareOptions = {colour: \"red\", width: 100};*\n\n*let mySquare\
    \ = createSquare(squareOptions);*"
