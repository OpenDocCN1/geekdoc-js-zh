  md: "**18**    ◾    TypeScript for Beginners\n\n*function error(message: string):\
    \ never {*\n\n*throw new Error (message);*\n\n*}*\n\n*/ / The output type of fail()\
    \ is never*\n\n*function fail() {*\n\n*return error (\"Something failed\");*\n\
    \n*}*\n\n*/ / no exit from this function*\n\n*function infiniteLoop () function:\
    \ never {*\n\n*while (true) {*\n\n*}*\n\n*}*\n\n*Symbol*\n\nThe Symbol type is\
    \ primitive and corresponds to the same type in JS. \n\nThis type provides unique\
    \ identifiers that can be used as keys for object \n\nproperties.\n\nValues of\
    \ the Symbol type implement a global ‘Symbol’ object, which \n\nhas a set of methods\
    \ and properties that can be called as functions.\n\n*var secretKey = Symbol();*\n\
    \n*var obj = {};*\n\n*obj\\[secretKey\\] = \"secret message\"; / / Symbol as *\n\
    \n*property*\n\n*obj\\[Symbol.toStringTag\\] = \"test\";*\n\nType Assertions\n\
    \nSometimes you find yourself in a situation where you know more about \n\nthe\
    \ value of a variable than TS does. This usually happens when you know \n\nthat\
    \ the type of an entity may be more specific than its current type.\n\nType assertion\
    \ is like typecasting in other languages, but it doesn’t do any \n\nspecial checks\
    \ or data restructurings. The type conversion has no effect at the \n\nexecution\
    \ stage of the program and is used only by the compiler. TS assumes \n\nthat the\
    \ programmer will do all the necessary checks that are required.\n\nThe type conversion\
    \ can be done in two ways. The first is the use of \n\nangle brackets syntax:\n\
    \n***let*** *someValue: any = \"this is a string\";*\n\n***let*** *strLength:\
    \ number = (<****string****\\>someValue).length;*"
  merge: -1
  pgno: 34
- img_proc: true
  md: "TypeScript    ◾   ** 19**\n\nThe second is as-syntax:\n\n*let someValue: any\
    \ = \"this is a string\";*\n\n*let strLength: number = (someValue as string).length;*\n\
    \nThe two examples given are completely similar. To use one or the other is \n\
    \nby-and-large a choice of preference; however, when TS is used in conjunc­\n\n\
    tion with JSX, only typecasting via syntax is allowed.\n\n*The Let Keyword*\n\n\
    The let keyword is new in JS. A variable declared with let will only be \n\nvisible\
    \ in the current (local) scope. This avoids a lot of problems in JS. \n\nTherefore,\
    \ it is recommended to use let instead of var wherever possible.\n\nTS Compiler\n\
    \nThe TypeScript compiler (also known as “tsc”) is the basis of many packages,\
    \ \n\nplugins, and tools that work with TS, although we don’t often call the tsc\
    \ \n\ndirectly, since we configure the behavior of the tsc inside the packers\
    \ we use.\n\nWhen we install TS globally npm i-g TS, we get a tool called tsc.\
    \ If we \n\nrun this command with the help tsc –help flag, we will see a large\
    \ number \n\nof options that go with it. The main ones that you should pay attention\
    \ to \n\nare the first examples at the top of examples:\n\n*tsc hello.ts*\n\n\
    \ *tsc --outFile file.js file.ts*\n\n *tsc @args.txt*\n\n *tsc --build tsconfig.json*\n\
    \nIf we create a *hello.ts* file, write *const four:number *\\=* 2 *+* 2* inside,\
    \ and then \n\nrun *tsc hello.ts*, we get a compiled file *hello.js* with the\
    \ value *var four *\\=* 2 *+* 2;.*\n\nWe will rarely use *tsc* in this way, because\
    \ *tsc* is included in plugins such \n\nas Webpack, Parcel, and Angular CLI.\n\
    \nInstead, we use *tsc –init*. It creates a file in the root directory named \n\
    \n*tsconfig. json*. It contains all the default values. This is very convenient,\
    \ \n\nbecause instead of defining all these parameters on the command line \n\n\
    when it is called, we define them in this TS configuration file. When we run \n\
    \nthe tsc command, the compiler will take the settings from *tsconfig. json*.\n\
    \nAlso, we can change the configuration settings, for example, change \n\nthe\
    \ value of *ourDir* to *./dist*. Now all compiled files should be saved to an\
    \ \n\nexternal directory *./dist*."
  merge: -1
