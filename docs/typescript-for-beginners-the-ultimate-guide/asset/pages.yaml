  md: "Key Concepts of TS    ◾   ** 79**\n\n *// this is used here! The function will\
    \ crash *\n\n*at runtime!*\n\n *this.info = e.message;*\n\n *};*\n\n*}*\n\n*let\
    \ h = new Handler();*\n\n*uiElement.addClickListener(h.onClickBad); // error!*\n\
    \nWhen this is specified, it explicitly reflects the fact that *onClickBad* must\
    \ \n\nbe called on an instance of the Handler class. Now TS will detect that \n\
    \naddClickListener requires a function with *this: void*. To fix this error, \n\
    \nchange the *this* type:\n\n*class Handler {*\n\n *info: string;*\n\n *onClickGood(this:\
    \ void, e: Event) {*\n\n *// you can’t use the this variable here, *\n\n*because\
    \ it has the void type!*\n\n *console.log('clicked!');*\n\n *}*\n\n*}*\n\n*let\
    \ h = new Handler();*\n\n*uiElement.addClickListener(h.onClickGood);*\n\nSince\
    \ the *onClickGood* function specifies that the type of this is void, it \n\n\
    can be passed to *addClickListener*. Of course, this also means that it can \n\
    \nno longer be used in it *this.info*. But if you need both, you will have to\
    \ use \n\nthe arrow function:\n\n*class Handler {*\n\n *info: string;*\n\n *onClickGood\
    \ = (e: Event) => {this.info = e.message}*\n\n*}*\n\nThis will work because arrow\
    \ functions do not capture this from the con­\n\ntext in which they are executed,\
    \ and they can be freely passed where a \n\nfunction with *this: void* is expected.\
    \ The disadvantage of this solution \n\nis that for each Handler object, its own\
    \ arrow function will be created. \n\nMethods, on the other hand, are created\
    \ only once, are associated with the \n\nHandler prototype, and are common to\
    \ all objects of this class."
