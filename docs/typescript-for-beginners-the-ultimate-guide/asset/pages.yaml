  md: "**96**    ◾    TypeScript for Beginners\n\nThe compiler will not generate code\
    \ for such enumerations. This can \n\nbe useful when using third-party libraries\
    \ (for example, jQuery, in which \n\na certain object is defined (for example,\
    \ $) when you need information \n\nabout an object, but you don’t need to generate\
    \ code.\n\nSYMBOLS\n\nECMAScript 2015 introduced the symbol type – a primitive\
    \ data type \n\nsimilar to number and string.\n\nValues of the *symbol* type are\
    \ created by calling the Symbol constructor.\n\n*let sym1 = Symbol();*\n\n*let\
    \ sym2 = Symbol(\"key\"); // Optional string key*\n\nThe symbols are unchangeable\
    \ and unique.\n\n*let sym2 = Symbol(\"key\");*\n\n*let sym3 = Symbol (\"key\"\
    );*\n\n*sym2 = = = sym3; / / false, symbols are unique*\n\nLike strings, symbols\
    \ can be used as keys for object properties.\n\n*let sym = Symbol();*\n\n*let\
    \ obj = {*\n\n *\\[sym\\]: \"value\"*\n\n*};*\n\n*console.log(obj\\[sym\\]); //\
    \ \"value\"*\n\nSymbols can be used together with evaluated properties to declare\
    \ object \n\nproperties and class members:\n\n*const getClassNameSymbol = Symbol();*\n\
    \n*class C {*\n\n *\\[getClassNameSymbol\\](){*\n\n *return \"C\";*\n\n *}*\n\n\
    *}*"
