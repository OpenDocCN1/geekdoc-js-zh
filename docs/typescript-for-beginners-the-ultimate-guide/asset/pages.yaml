  md: "**70**    ◾    TypeScript for Beginners\n\n*let x: Named;*\n\n*// the output\
    \ type for y is {name: string; location: *\n\n*string;}*\n\n*let y = {name: \"\
    Jannet\", location: \"Boston\"};*\n\n*x = y;*\n\nTo understand whether y can be\
    \ assigned to x, the compiler searches for \n\nthe corresponding compatible property\
    \ in y for each of the properties of x. \n\nIn this case, the y variable must\
    \ have a property named name of the string \n\ntype. It is there, and assignment\
    \ is allowed.\n\nThe same rule is used in the case of checking arguments when\
    \ calling \n\na function:\n\n*function greeting (n: By name) {*\n\n*alert (\"\
    Hello,\" + n.name);*\n\n*}*\n\n*greet(y); / / OK*\n\nNote that y has an additional\
    \ location property, but this does not result \n\nin an error. When checking for\
    \ compatibility, only members of the target \n\ntype (in this case, Named) are\
    \ considered.\n\nThe comparison process is performed recursively, affecting the\
    \ types of \n\nall members and sub-members.\n\n*Optional Parameters and Default\
    \ Parameters*\n\nIn TS, it is assumed that each function parameter is required.\
    \ This does \n\nnot mean that it cannot be passed *null* or *undefined*: it means\
    \ that when \n\nthe function is called, the compiler will check whether the user\
    \ has set a \n\nvalue for each of its parameters. In addition, the compiler assumes\
    \ that \n\nno parameters other than those specified will be passed. Simply put,\
    \ the \n\nnumber of parameters passed must match the number of parameters that\
    \ \n\nthe function expects.\n\n*function buildName(firstName: string, lastName:\
    \ *\n\n*string) {*\n\n*return firstName + \"\" + lastName;*\n\n*}*\n\n*let result1\
    \ = buildName(\"Sam\"); // error, too few *\n\n*parameters*"
