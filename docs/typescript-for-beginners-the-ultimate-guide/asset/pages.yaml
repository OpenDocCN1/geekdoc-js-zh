  md: "Key Concepts of TS    ◾   ** 69**\n\nHere, you can see that TS allows anonymous\
    \ functions in the same way \n\nas JavaScript, but still allows standard type\
    \ annotations. The result of this \n\ncode is as follows:\n\n*addFunctionResult:\
    \ 5*\n\nType Compatibility\n\nType compatibility in TS is based on structural\
    \ typing. Structural typing \n\nis a way to identify type relationships based\
    \ solely on the composition of \n\ntheir members. This approach differs from nominative\
    \ typing. Let’s look \n\nat the following code:\n\n*interface Named {*\n\n*name:\
    \ string;*\n\n*}*\n\n*class Person {*\n\n*name: string;*\n\n*}*\n\n*let p: Named;*\n\
    \n*// Everything fits, since the structural type system*\n\n*p = new Person is\
    \ used();*\n\nIn languages like C# and Java, where the nominative type system\
    \ is used, \n\nsimilar code would lead to an error, since the Person class is\
    \ not explicitly \n\ndescribed as implementing the Named interface.\n\nThe TS\
    \ structural type system was designed with the way JavaScript \n\ncode is usually\
    \ written in mind. Since JavaScript makes extensive use of \n\nanonymous objects,\
    \ such as function expressions and object literals, it is \n\nmuch more natural\
    \ to describe their relationships using a structural sys­\n\ntem rather than a\
    \ nominative one.\n\nThe TS type system allows for certain operations that cannot\
    \ be said to \n\nbe safe at compile time. When a type system has this property,\
    \ it is said \n\nthat it is not “reliable.” The places where TS allows unreliable\
    \ behavior \n\nhave been carefully considered, and in this chapter, we will explain\
    \ where \n\nthis happens and for what reason it was allowed.\n\nThe basic rule\
    \ of the TS type system is that x is compatible with y if y \n\nhas at least the\
    \ same members as x. For example:\n\n*interface with the name {*\n\n*name: string;*\n\
    \n*}*"
