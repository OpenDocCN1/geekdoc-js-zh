    \ Zip } from \"./*\n\n*ZipCodeValidator\";*\n\n*if (needZipValidation) {*\n\n\
    \ *System.import(\"./ZipCodeValidator\").*\n\n*then((ZipCodeValidator: typeof\
    \ Zip) => {*\n\n *var x = new ZipCodeValidator();*\n\n *if (x.isAcceptable(\"\
    ...\")) { /\\* ... \\*/ }*\n\n *});*\n\n*}*\n\nWorking with Other JavaScript Libraries\n\
    \nTo describe a library that is not written in TypeScript, you must declare \n\
    \nthe API provided by that library.\n\nWe call declarations that do not define\
    \ implementations “ambient.” \n\nThey are usually set in .d.ts files. If you are\
    \ familiar with C/C++, you can \n\nthink of them as header files .h. Let’s look\
    \ at some examples.\n\nEXTERNAL MODULES\n\nIn Node.js, most tasks are performed\
    \ by loading one or more modules. We \n\ncould define each module in its own file\
    \ .d.ts in top-level export declara­\n\ntions, but it is much more convenient\
    \ to put the definitions of all modules \n\nin one common .d.ts file. To do this,\
    \ use a construct similar to external \n\nnamespaces. It uses the module keyword\
    \ and the quoted module name, \n\nwhich will be available for further import.\
    \ For example:\n\n**node.d. ts (simplified excerpt)**\n\n*declare module \"url\"\
    \ {*\n\n *export interface Url {*\n\n *protocol?: string;*\n\n *hostname?: string;*\n\
    \n *pathname?: string;*\n\n *}*\n\n *export function parse(urlStr: string, *\n\
    \n*parseQueryString?, slashesDenoteHost?): Url;*\n\n*}*\n\n*declare module \"\
    path\" {*\n\n *export function normalize(p: string): string;*\n\n *export function\
    \ join(...paths: any\\[\\]): string;*\n\n *export var sep: string;*\n\n*}*"
