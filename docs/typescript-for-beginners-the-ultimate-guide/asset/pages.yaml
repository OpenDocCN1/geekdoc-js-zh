  md: "**36**    ◾    TypeScript for Beginners\n\n*Optional Properties*\n\nNot all\
    \ interface properties may be required. Some exist only under cer­\n\ntain conditions,\
    \ or none at all. Such optional properties are often found, \n\nfor example, when\
    \ passing arguments to a function in the form of an \n\nobject that specifies\
    \ only a few properties.\n\n*interface SquareConfig {*\n\n *color?: string;*\n\
    \n *width?: number;*\n\n*}*\n\n \n\n*function createSquare(config: SquareConfig):\
    \ {color: *\n\n*string; area: number} {*\n\n *let newSquare = {color: \"white\"\
    , area: 100};*\n\n *if (config.color) {*\n\n *newSquare.color = config.color;*\n\
    \n *}*\n\n *if (config.width) {*\n\n *newSquare.area = config.width \\* config.width;*\n\
    \n *}*\n\n *return newSquare;*\n\n*}*\n\n \n\n*let mySquare = createSquare({color:\
    \ \"black\"});*\n\nInterfaces with optional properties are written like normal\
    \ ones, but each \n\noptional property is marked with the symbol ? at the end\
    \ of the name.\n\nThe advantage of optional properties is that you can describe\
    \ the prop­\n\nerties that may be present, and at the same time prohibit the use\
    \ of those \n\nproperties that are not part of the interface. For example, if\
    \ we made a \n\nmistake when entering the color name in createSquare, we would\
    \ get an \n\nerror message informing us about it:\n\n*interface SquareConfig {*\n\
    \n *color?: string;*\n\n *width?: number;*\n\n*}*\n\n*function createSquare(config:\
    \ SquareConfig): { color: *\n\n*string; area: number } {*\n\n *let newSquare =\
    \ {color: \"white\", area: 100};*"
