  md: "**84**    ◾    TypeScript for Beginners\n\nWe added a variable of type T to\
    \ our function. This variable allows us to \n\nspecify a specific type when using\
    \ the function. In addition, we also speci­\n\nfied the type of the return value.\
    \ And now we know that the function will \n\nreturn the result with the same data\
    \ type as the passed argument.\n\nNow let’s see how you can use our function.\
    \ There are two ways to do \n\nthis. Consider the first one:\n\n*let numberOutput\
    \ = identity<Number>(1);*\n\n*let wrongOutput = identity<Number>(\"sdf\"); / /\
    \ *\n\n*Compilation error. Invalid data type for the argument*\n\n*let stringOutput\
    \ = identity<String>(\"String\");*\n\n*console. log(numberOutput); / / outputs\
    \ \"1\"*\n\n*console. log (stringOutput); / / outputs \" String\"*\n\nWhen calling\
    \ the function in angle brackets < >, we explicitly specified the \n\ndata type\
    \ that the function will work with.\n\nThe second method is not to specify the\
    \ data type in angle brackets, but \n\nsimply pass the variable as an argument\
    \ to the function. In this case, TS \n\nuses a mechanism called automatic type\
    \ inference, according to the value \n\npassed as an argument.\n\n*let numberOutput\
    \ = identity(1);*\n\n*let stringOutput = identity (\"String\");*\n\n*console.\
    \ log(numberOutput); / / outputs \" 1 \"*\n\n*console. log (stringOutput);/ /\
    \ outputs \" String\"*\n\nThe second method, on the one hand, makes the code shorter\
    \ and easier \n\nto read, but on the other hand, it can lead to errors. After\
    \ all, in this case, \n\nyou can pass a value to the function that is not expected\
    \ there, and this can \n\nlead to an error at runtime.\n\nWorking with Generalized\
    \ Type Variables\n\nWhen using generalizations, the compiler assumes that the\
    \ generalized \n\nparameters passed to the function are used correctly. In fact,\
    \ the compiler \n\ntreats them as “any data type” or any.\n\nLet’s look at the\
    \ function from the previous section again:\n\n*function identity<t>(arg: T):\
    \ T {*\n\n *return arg;*\n\n*}*\n\n*</t>*"
