  md: "**20**    ◾    TypeScript for Beginners\n\nEverything defined in this file\
    \ will specify which parameters the TS \n\ncompiler will use when compiling. When\
    \ TS starts “complaining” about \n\nnot using enough types, you can start disabling\
    \ some of these warnings \n\nor errors.\n\nVariable Declarations\n\nLet and const\
    \ are relatively new types of variable declarations in JS. As we \n\nmentioned\
    \ earlier, let is similar to var in some ways, but allows users to \n\navoid some\
    \ of the common errors encountered in JS. const is an extension \n\nof let that\
    \ prevents variables from being overridden.\n\nSince TS is an add-on to JS, the\
    \ language also supports let and const. \n\nNext, we’ll go into more detail about\
    \ these new variable declarations and \n\nexplain why they are preferred over\
    \ var.\n\n*var Declarations*\n\nThe variable declaration in JS always occurs using\
    \ the var keyword.\n\n*var a = 10;*\n\nAs you probably understood, we just declared\
    \ a variable with the name a \n\nand the value 10.\n\nWe can also declare a variable\
    \ inside a function:\n\n*function f() {*\n\n *var message = \"Hello, world!\"\
    ;*\n\n *return message;*\n\n*}*\n\nand we also have access to these variables\
    \ inside other functions:\n\n*function f() {*\n\n *var a = 10;*\n\n *return function\
    \ g() {*\n\n *var b = a + 1;*\n\n *return b;*\n\n *}*\n\n*}*\n\n \n\n*var g =\
    \ f();*\n\n*g(); // returns 11;*"
  merge: -1
  pgno: 36
- img_proc: true
  md: "TypeScript    ◾   ** 21**\n\nIn the example above, g captures (encloses) the\
    \ variable a declared in f. At \n\nany point where g is called, the value of a\
    \ will be associated with the value \n\nof a in the function f. Even if g is called\
    \ once and f has finished executing, \n\nit is possible to access and modify a.\n\
    \n*function f() {*\n\n*var a = 1;*\n\n*a = 2;*\n\n*var b = g();*\n\n*a = 3;*\n\
    \n*return b;*\n\n*function g() {*\n\n*return a;*\n\n*}*\n\n*}*\n\n*f (); / / returns\
    \ 2*\n\n*Scoping*\n\nThe var declaration has some strange scope rules for those\
    \ using other \n\nprogramming languages. See the following example:\n\n*function\
    \ f(shouldInitialize: boolean) {*\n\n *if (shouldInitialize) {*\n\n *var x = 10;*\n\
    \n *}*\n\n \n\n *return x;*\n\n*}*\n\n \n\n*f(true); // returns ’10’*\n\n*f(false);\
    \ // returns ’undefined’*\n\nSome may need to re-look at that example. The variable\
    \ x was declared \n\ninside the if block, and we can access it outside of that\
    \ block. This is \n\nbecause var declarations are available anywhere inside the\
    \ function, \n\nmodule, namespace, or global scope that contains them, regardless\
    \ of the \n\nblock in which they are contained. Some call it var-visibility or\
    \ function-\n\nvisibility. The parameters are also visible inside the function."
  merge: -1
  pgno: 37
- img_proc: true
  md: "**22**    ◾    TypeScript for Beginners\n\nThese scope rules can cause several\
    \ types of errors. One annoying prob­\n\nlem is that it is not an error to declare\
    \ a variable multiple times:\n\n*function sumMatrix(matrix: number\\[\\]\\[\\\
    ]) {*\n\n *var sum = 0;*\n\n *for (var i = 0; i < matrix.length; i++) {*\n\n *var\
    \ currentRow = matrix\\[i\\];*\n\n *for (var i = 0; i < currentRow.length; i++)\
    \ {*\n\n *sum += currentRow\\[i\\];*\n\n *}*\n\n *}*\n\n *return sum;*\n\nIt’s\
    \ probably easy to see that the internal for loop will accidentally over­\n\n\
    write the variable i, because i has scopes inside the sumMatrix function. \n\n\
    Experienced developers know that similar errors slip through code review \n\n\
    and can be the cause of endless frustration.\n\n*Block Viewport*\n\nWhen a variable\
    \ is declared using let, it is used in block scope mode. \n\nUnlike variables\
    \ declared with var, whose scopes extend to the entire \n\nfunction they are in,\
    \ block-scoped variables are not visible outside their \n\nnearest block or for\
    \ loop.\n\n*function f(input: boolean) {*\n\n*let a = 100;*\n\n*if (input) {*\n\
    \n*// Here we see the variable 'a'*\n\n*let b = a + 1;*\n\n*return b;*\n\n*}*\n\
    \n*/ / Error: 'b' does not exist in this block*\n\n*return b;*\n\n*}*\n\nHere\
    \ we have two local variables a and b. The scope of a is bounded by the \n\nbody\
    \ of the function f, while the scope of b is bounded by the if condition \n\n\
    block.\n\nVariables declared in the catch block have the same visibility rules.\n\
    \n*try {*\n\n *throw \"oh no!\";*\n\n*}*"
  merge: -1
  pgno: 38
- img_proc: true
  md: "TypeScript    ◾   ** 23**\n\n*catch (e) {*\n\n *console.log(\"Oh well.\");*\n\
    \n*}*\n\n*// Error: 'e' doesn't exist here*\n\n*console.log(e);*\n\nAnother property\
    \ of block scope variables is that they cannot be accessed \n\nbefore they are\
    \ declared. While block scope variables are represented \n\neverywhere in their\
    \ block, there is a dead zone at each point before they \n\nare declared. It’s\
    \ just a way of saying that you can’t access them before the \n\nlet statement,\
    \ and luckily TS will remind you of that.\n\n*a++; / / it is incorrect to use\
    \ 'a' before declaring *\n\n*it;*\n\n*let a;*\n\nHowever, you can still close\
    \ a variable with a block scope before declar­\n\ning it. However, an attempt\
    \ to call such a function before declaring it will \n\nresult in an error. If\
    \ you compile to the ES2015 standard, this will cause \n\nan error; however, right\
    \ now TS allows this and will not indicate an error.\n\n*function foo() {*\n\n\
    \ *//okay to capture 'a'*\n\n *return a;*\n\n*}*\n\n*// illegal call 'foo' before\
    \ 'a' is declared*\n\n*// runtimes should throw an error here*\n\n*foo();*\n\n\
    *let a;*\n\n*Re-declaring and Escaping*\n\nIn the case of var declarations, it\
    \ doesn’t matter how many times you \n\ndeclare the same variable. You’ll always\
    \ get one.\n\n*function f(x) {*\n\n *var x;*\n\n *var x;*\n\n \n\n *if (true)\
    \ {*\n\n *var x;*\n\n *}*\n\n*}*"
  merge: -1
  pgno: 39
- img_proc: true
  md: "**24**    ◾    TypeScript for Beginners\n\nIn the example above, all the declarations\
    \ of x actually point to the \n\nsame x, and this is perfectly acceptable. This\
    \ is often a source of bugs. So, \n\nit’s a good thing that the let declarations\
    \ don’t allow this.\n\n*let x = 10;*\n\n*let x = 20; / / Error: cannot redefine\
    \ 'x' in the same *\n\n*scope*\n\nVariables don’t have to both be block-scoped\
    \ in TS for the compiler to \n\nindicate an error.\n\n*function f(x) {*\n\n*let\
    \ x = 100; / / error: intersects with function *\n\n*parameter*\n\n*}*\n\n*function\
    \ g() {*\n\n*let x = 100;*\n\n*var x = 100; / / error: cannot declare 'x' twice*\n\
    \n*}*\n\nThis does not mean that a variable with block scope cannot be declared\
    \ \n\nwith a variable with scope in the same function. A variable with a block\
    \ \n\nscope just needs to be declared in its block.\n\n*function f(condition,\
    \ x) {*\n\n *if (condition) {*\n\n *let x = 100;*\n\n *return x;*\n\n *}*\n\n\
    \ \n\n *return x;*\n\n*}*\n\n \n\n*f(false, 0); // returns 0*\n\n*f(true, 0);\
    \ // returns 100*\n\nThe method of introducing a new name in a nested area is\
    \ called hiding. \n\nThis is a kind of two-bladed sword, because it can introduce\
    \ some bugs, as \n\nwell as get rid of others. For example, imagine how we could\
    \ rewrite the \n\nsumMatrix function using the let variables."
  merge: -1
