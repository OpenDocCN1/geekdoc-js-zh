  md: "TypeScript Architecture    ◾   ** 165**\n\nTypeScript files with the extension\
    \ .tsx instead of the usual extension. ts. \n\nWhen TypeScript finds files with\
    \ the extension. tsx, it parses the file as a \n\nJSX file, which allows you to\
    \ use the JSX syntax.\n\nThe process that React uses to generate JavaScript from\
    \ JSX files is an \n\nadditional step in the normal development workflow. Our\
    \ TypeScript files \n\n*.tsx*, after compilation, will generate JavaScript files\
    \ that convert the JSX \n\nsyntax into a series of calls to React libraries.\n\
    \nFor example, using the <*div*\\> element in *.tsx* file will create a call to\
    \ \n\n*React.createElement* (“div”,…) in the compiled JavaScript file. These com­\n\
    \npiled files must then be combined with the React libraries themselves to \n\n\
    create executable code. For this reason, it is recommended to use a tool \n\n\
    such as Webpack to combine the output of the compilation step with the \n\nReact\
    \ libraries. Webpack will also create a single output file to load into \n\nthe\
    \ browser in a process called bundling.\n\nTo start a new React project, we will\
    \ follow a few steps. First, create a \n\ndirectory for your project and initialize\
    \ npm:\n\n*mkdir react-sample*\n\n*cd react-sample*\n\n*npm init*\n\nHere, we\
    \ create a directory for our project, go to it, and initialize npm \n\nin the\
    \ project directory. After that, the package file will be created.json, \n\nwhich\
    \ can use npm. After initialization, we can install webpack:\n\n*npm install -g\
    \ webpack*\n\n*npm install -g webpack-cli*\n\nThe webpack will be installed as\
    \ a global Node module and the web­\n\npack command-line interface, webpack-cli,\
    \ will be installed. Note that, \n\nalthough we have webpack installed globally,\
    \ the webpack command-line \n\ntool should still find webpack modules in the node\\\
    _modules directory. \n\nThis means that we also need to install webpack as a local\
    \ module.\n\n*npm install webpack –save-dev*\n\n*npm install webpack-cli -save-dev*\n\
    \nNow we can install React:\n\n*npm install react react-dom*"
