  md: "**99**\n\nDOI: 10.1201/9781003203728-3\n\nC h a p t e r 3\n\nModules and \n\
    \nNamespaces\n\nModules are executed not in the global scope but in their own\
    \ scope. This \n\nmeans that variables, functions, classes, etc. declared in the\
    \ module are \n\nnot visible outside the module, except when they are explicitly\
    \ exported \n\nusing one of the export forms. Also, to use a variable, function,\
    \ class, \n\ninterface, etc. exported from another module, you need to import\
    \ them \n\nusing one of the import forms.\n\nWHAT IS NAMESPACE?\n\nA namespace\
    \ is a construct that is declared using the namespace keyword \n\nand is represented\
    \ in the code by a regular JavaScript object.\n\n*namespace Identifier {}*\n\n\
    The namespace mechanism is a solution to the problem of collisions in the \n\n\
    global namespace, which has come down to our days from the time when \n\nthe ECMAScript\
    \ specification did not define such a thing as modules. In \n\nsimple terms, namespaces\
    \ are a combination of a regular global variable \n\nand an unnamed functional\
    \ expression.\n\nConstructs declared inside a namespace are broken down in an\
    \ \n\nunnamed function expression. Constructs that are visible from the out­\n\
    \nside are written to the object that was referenced in the global variable \n\
    \npassed as an argument. What to write to the global object, and what not,"
  merge: -1
