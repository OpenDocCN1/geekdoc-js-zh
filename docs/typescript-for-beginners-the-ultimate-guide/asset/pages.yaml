    \n *location: string;*\n\n *active: boolean;*\n\n *public\\_address: IPublicAddress;*\n\
    \n*}*\n\nNote that in addition to primitive types and other interfaces, you can\
    \ \n\ndescribe functions in interfaces. This is done using arrow functions, for\
    \ \n\nexample, like this:\n\n*interface IServer {*\n\n *getPublicAddres: () =>\
    \ IPublicAddress;*\n\n*}*"
