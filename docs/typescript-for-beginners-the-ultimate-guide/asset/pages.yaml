  md: "TS Runtime    ◾   ** 133**\n\nIt is recommended to allow only what is really\
    \ necessary. For example, to \n\nallow reading only from a certain directory,\
    \ you can use the-allow-read \n\nflag, and to enable the network to go to certain\
    \ URLs, the-allow-net flag:\n\n*deno run –allow-read=/path –allow-net=localhost:4545\
    \ *\n\n*file.ts*\n\nIf you get tired of typing all the flags each time, you can\
    \ write it in the bash \n\nscript or use the-A (– allow-all) flag, which I highly\
    \ recommend. Or you \n\nwill like Drake-an analog of make only for Deno.\n\nAlso,\
    \ you can install the Deno program by using Deno install with the \n\nnecessary\
    \ permissions. After installation, your program will be available \n\nglobally,\
    \ as it will be in $PATH.\n\n*Strict: True by Default*\n\nAt some point, the developers\
    \ decided that this approach would ensure the \n\nreliability of the code. But,\
    \ nevertheless, it is possible to remove it with a \n\ncustom config.\n\n**tsconfig.json**\n\
    \nDeno has a preset config by default, but you can set your own custom con­\n\n\
    fig, as in normal applications, with the exception of some options. I prefer \n\
    \nto use decorators in TS, so there is no way without a custom config. Here \n\
    \nis an example of running with a custom config:\n\n*deno run -c tsconfig.json\
    \ main.ts*\n\n*Deno Modules*\n\nOne of the main major differences between Deno\
    \ and Node.js is that \n\nDeno uses the official ECMAScript module standard, not\
    \ the deprecated \n\nCommonJS. In Node.js ES modules only appeared at the end\
    \ of 2019, with \n\nversion 13.2.0, but even then, support remained immature,\
    \ and it is still \n\nenabled by the controversial extension. mjs. Deno breaks\
    \ out of the past, \n\nusing modern web standards for its modular system.\n\n\
    *import \\* as framework from \"**https://deno.land/x/*\n\n*alosaur/src/mod.ts**\"\
    ; import {assert} from \"**https://*\n\n*deno.land/std/testing/mod.ts**\";*"
