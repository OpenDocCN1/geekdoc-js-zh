  md: "**136**    ◾    TypeScript for Beginners\n\n*WASM, RUST, Plugins*\n\nIt is\
    \ worth mentioning that Deno is able to work with WASM files by default. \n\n\
    For example, some database drivers have now been integrated in this way.\n\nSeparately,\
    \ I want to say about native plugins. Since the Deno plugins \n\nare not the primary\
    \ task, it cannot be downloaded directly, for example, \n\nusing the usual import,\
    \ and this would be strange, because in the browser \n\nyou do not have this option,\
    \ but nevertheless there is Deno.openPlugin. \n\nThis is an asynchronous function\
    \ that automatically loads the appropri­\n\nate binary file, according to the\
    \ platform, and caches it in the directory. \n\ndeno\\_plugins of the current\
    \ working directory.\n\nFor example:\n\n*const pluginOptions: PerpareOptions =\
    \ {*\n\n *name: \"test\\_plugin\",*\n\n *// Whether to output log. Optional, default\
    \ is true*\n\n *// printLog: true,*\n\n *// Whether to use locally cached files.\
    \ Optional, *\n\n*default is true*\n\n *// checkCache: true,*\n\n *// Support\
    \ \"http://\", \"https://\", \"file://\"* \n\n*urls: {*\n\n *mac: '${releaseUrl}/libtest\\\
    _plugin.dylib',* \n\n *win: '${releaseUrl}/test\\_plugin.dll',*\n\n *linux: '${releaseUrl}/libtest\\\
    _plugin.so',*\n\n *},*\n\n *};*\n\n *const rid = await prepare(pluginOptions);*\n\
    \n *//@ts-ignore*\n\n *const { testSync } = Deno.core.ops();* \n\n*const response\
    \ = Deno.core.dispatch(*\n\n *testSync,* \n\n *new Uint8Array(\\[116, 101, 115,\
    \ 116\\])*\n\n *)!;*\n\n *console.log(response);*\n\nDebugging\n\nDeno has built-in\
    \ debugging, but at the time of this writing, the Visual \n\nStudio Code extension\
    \ does not support it. To debug manually, you need \n\nto do the following:\n\n\
    *deno run -A -- inspect-brk fileToDebug.ts*"
