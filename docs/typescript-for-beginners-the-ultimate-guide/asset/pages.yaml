  md: "**92**    ◾    TypeScript for Beginners\n\nENUMS\n\nEnums allow us to define\
    \ a set of named numeric constants and are \n\ndefined using the enum keyword.\
    \ Enumerations are subtypes of the prim­\n\nitive number type.\n\n*enum Direction\
    \ {*\n\n *Up = 1,*\n\n *Down,*\n\n *Left,*\n\n *Right*\n\n*}*\n\nThe enumeration\
    \ body consists of zero or more elements. The enumera­\n\ntion elements have a\
    \ numeric value associated with the name, and can be \n\neither a constant or\
    \ can be evaluated. An enumeration element is consid­\n\nered a constant if:\n\
    \n• if the value is not explicitly defined and the value of the previous \n\n\
    member is constant. In this case, the value will be equal to the \n\nnumeric value\
    \ of the previous term plus 1. The exception is only the \n\nfirst element. If\
    \ the value is not specified, it becomes 0;\n\n• if the enumeration element is\
    \ defined using a constant expression. \n\nSuch expressions are a type of TS expression\
    \ that can be evaluated at \n\ncompile time.\n\nAn enumeration expression is constant\
    \ if a numeric literal is:\n\n• a reference to a previously defined constant element\
    \ of an enu­\n\nmeration (it can be defined in various enumerations). If an element\
    \ \n\nis defined in the same enumeration, it can be referenced using an \n\nunqualified\
    \ name;\n\n• the constant expression of the enumeration, taken in parentheses\
    \ by;\n\n• the unary operator +, -,~, applied to the constant expression of the\
    \ \n\nenumeration;\n\n• by a binary operator +, -, \\*, /, %, ≪, ≫, ⋙, &, |, ^\
    \ with an enumeration \n\nconstant expression as an operand. A constant enumeration\
    \ expres­\n\nsion evaluated in NaN or Infinity results in a compile-time error."
  merge: -1
  pgno: 108
- img_proc: true
  md: "Key Concepts of TS    ◾   ** 93**\n\nIn all other cases, the enumeration member\
    \ is considered evaluated and its \n\nvalue is evaluated at the time of program\
    \ execution.\n\n*enum FileAccess {*\n\n*// constant elements*\n\n*None,*\n\n*Read\
    \ = 1 << 1,*\n\n*Write = 1 << 2,*\n\n*ReadWrite = Read | Write,*\n\n*// evaluated\
    \ elements*\n\n*G = \"123\".length*\n\n*}*\n\nEnums are valid objects that exist\
    \ at runtime. One reason for this is the \n\nability to support reverse mapping\
    \ from enum values to enum names.\n\n*enum Enum {*\n\n *A*\n\n*}*\n\n*let a =\
    \ Enum.A;*\n\n*let nameOfA = Enum\\[Enum.A\\]; // \"A\"*\n\ncompiled in:\n\n*var\
    \ Enum;*\n\n*(function (Enum) {*\n\n *Enum\\[Enum\\[\"A\"\\] = 0\\] = \"A\";*\n\
    \n*})(Enum || (Enum = {}));*\n\n*var a = Enum.A;*\n\n*var nameOfA = Enum\\[Enum.A\\\
    ]; // \"A\"*\n\nIn the generated code, the enumeration is compiled into an object\
    \ that \n\nstores the forward (name -> value) and reverse (value -> name) mappings.\
    \ \n\nReferences to enum elements are always executed as property accesses and\
    \ \n\nare never embedded. In many cases, this is the right solution. However,\
    \ \n\nsometimes the requirements are tougher. To avoid paying the cost of addi­\n\
    \ntional generated code and indirect access when accessing enumeration \n\nvalues,\
    \ you can use constant enumerations. Constant enumerations are \n\ndefined using\
    \ the const modifier preceding the enum keyword.\n\n*Constant Enums*\n\nIn order\
    \ not to generate additional code and unnecessary references to \n\naccess the\
    \ values of the enumerations, you can use constant enumerations."
  merge: -1
  pgno: 109
- img_proc: true
  md: "**94**    ◾    TypeScript for Beginners\n\nThey are defined using the const\
    \ keyword, which is placed before enum. \n\nUsing constant enumerations increases\
    \ the performance of the code, \n\nbecause instead of the enumeration element,\
    \ the constant associated with \n\nit is used.\n\n*const enum*\n\n*Directions*\n\
    \n*{*\n\n *Up,*\n\n *Down,*\n\n *Left,*\n\n *Right*\n\n *}*\n\n *let directions\
    \ = \\[Directions.Up, *\n\n*Directions.Down, Directions.Left, Directions.Right\\\
    ]* \n\nSuch enumerations should only have constant expressions, and during \n\n\
    compilation, references to the properties of the enumeration object are \n\nreplaced\
    \ with values:\n\n*var Directions;*\n\n*(function (Directions) {*\n\n *Directions\\\
    [Directions\\[\"Up\"\\] = 0\\] = \"Up\";*\n\n *Directions\\[Directions\\[\"Down\"\
    \\] = 1\\] = \"Down\";*\n\n *Directions\\[Directions\\[\"Left\"\\] = 2\\] = \"\
    Left\";*\n\n *Directions\\[Directions\\[\"Right\"\\] = 3\\] = \"Right\";*\n\n\
    *})(Directions || (Directions = {}));*\n\n*let directions = \\[0, 1, 2, 3\\];\
    \ //Only values here!!!*\n\nIf we make this enumeration normal, that is, remove\
    \ const, we get:\n\n*let directions = \\[Directions.Up, Directions.Down, *\n\n\
    *Directions.Left, Directions.Right\\]*\n\nLet’s take look at another example:\n\
    \n*Const enum Directions {*\n\n *Up*\n\n *Down*\n\n *Right*\n\n *Left*\n\n*}*"
  merge: -1
  pgno: 110
- img_proc: true
  md: "Key Concepts of TS    ◾   ** 95**\n\n*function someFunc(op: Directions) {*\n\
    \n *switch (op) ;*\n\n *case Directions.Up:* \n\n *// some action…*\n\n *break;*\n\
    \n *case Directions.Down:* \n\n *// some action…*\n\n *break;*\n\n *//*\n\n *}*\n\
    \n*}*\n\nNow, let’s see what the someFunc function will look like after compilation:\n\
    \n*function*\n\n*someFunc(op)*\n\n*{*\n\n *switch (op) {*\n\n *case 0:*\n\n *break;*\n\
    \n *case 1:*\n\n *break;*\n\n *}*\n\n *}*\n\nAs you can see, the corresponding\
    \ constants were substituted instead of \n\nthe enumeration elements.\n\nDeclare\
    \ Enums\n\n*declare enum Enum {*\n\n *A = 1,*\n\n *B,*\n\n *C = 2*\n\n*}*\n\n\
    Such enumerations are defined using the declare keyword. They are used \n\nto\
    \ describe the form of existing enumerations.\n\nThe difference between such enumerations\
    \ is that if an element in such \n\nan enumeration does not have an initializer,\
    \ then it is considered evalu­\n\nated. In normal enumerations, the opposite is\
    \ true."
