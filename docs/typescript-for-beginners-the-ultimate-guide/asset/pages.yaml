  md: "**134**    ◾    TypeScript for Beginners\n\nAs you probably noticed, unlike\
    \ your usual TS code, you need to spec­\n\nify the file extension in the paths.\
    \ This has a positive effect on the build \n\nspeed of your applications. As Ryan\
    \ Dahl has already noticed, not using \n\nextensions when required was an N1 design\
    \ error. Node.js.\n\nThe modules can also be divided into three categories: Core,\
    \ Std, X.\n\n*Deno.core*\n\nHere is the code that is necessary to ensure the work\
    \ with the Rust backend.\n\n*Deno Standard Modules*\n\nhttps://deno.land/std/is\
    \ a set of standard modules supplied by Deno devel­\n\nopers, which guarantees\
    \ their implementation together with Deno. It \n\nfocuses only on the general\
    \ functionality, which is enough to write any \n\nprogram. The standard library\
    \ of the Go language was taken as a basis. \n\nTherefore, it is quite self-sufficient,\
    \ due to the fact that even the testing \n\nfunctionality is included in the standard\
    \ lib.\n\n*Deno X*\n\nThis category includes everything. What was not developed\
    \ by the main \n\nDeno team, as well as any import of third-party code into your\
    \ application.\n\nhttps://deno.land/x – is only a link shortener. And you can\
    \ add your lib \n\nto this registry by sending a pull request.\n\nJSPM, Pika.dev\
    \ – sites designed primarily for converting any npm \n\npackage to an ES module.\
    \ For example so:\n\n*import HandlebarsJS from ‘**https://dev.jspm.io/*\n\n*handlebars@4.7.6**’;*\n\
    \n*Package Manager*\n\nThere has been a radical rethink regarding how package\
    \ management \n\nworks in Deno. Instead of relying on a central repository, it\
    \ is decentral­\n\nized. Anyone can place a package anywhere. There are advantages\
    \ and \n\ndisadvantages to using a centralized repository like npm, and this aspect\
    \ \n\nof Deno is sure to be the most controversial.\n\nNo more package.json, now\
    \ it is accepted to use deps.ts, in which you \n\ncan describe the necessary imports\
    \ as follows:\n\n*export {assert} from \"**https://deno.land/std@v0.42.0/*\n\n\
    *testing/asserts.ts**\";*"
