  md: "**118**    ◾    TypeScript for Beginners \n\nRelative imports start with /,.\
    \ /, or../. For example:\n\n*import Entry from \"./components/Entry\";*\n\n*import\
    \ { DefaultHeaders } from \"../constants/http\";*\n\n*import \"/mod\";*\n\nAny\
    \ other import is considered nonrelative. For example:\n\n*import \\* as $ from\
    \ \"jQuery\";*\n\n*import { Component } from \"angular2/core\";*\n\nRelative imports\
    \ are allowed relative to the imported file and cannot be \n\nresolved by declaring\
    \ an external module. Relative imports are best used \n\nfor your modules, which\
    \ are guaranteed to be in the specified location \n\nduring program execution.\n\
    \nNonrelative imports can be resolved relative to baseUrl or by using \n\npath\
    \ mapping, which will be described below. It can also be resolved by \n\nexternal\
    \ module declarations. Use nonrelative paths when importing any \n\nexternal dependencies.\n\
    \n*Module Resolution Strategies*\n\nWhen the TypeScript compiler sees a nonrelative\
    \ import path in the state­\n\nment, it must find the file to import in the program,\
    \ since the import path \n\ndoes not provide the necessary information about where\
    \ the file is located \n\non disk.\n\nThe TypeScript compiler uses one of the\
    \ two strategies available to it \n\nto find this file. These strategies are Classic\
    \ and Node. Node is the default \n\nstrategy used by the TypeScript compiler,\
    \ and most people prefer it because \n\nmost third-party modules are Node modules.\n\
    \nThe *classicstrategy* is present in typescript only for backward compat­\n\n\
    ibility with older versions. This strategy only works if the TypeScript com­\n\
    \npiler detects nonrelative imports.\n\nThis Node strategy comes from the standard\
    \ module resolution strat­\n\negy in Node.js. This applies to both relative and\
    \ nonrelative imports.\n\nClassic \n\nThis strategy was previously adopted in\
    \ TypeScripts by default. \n\nBut now it is saved only for backward compatibility."
