  md: "Key Concepts of TS    ◾   ** 89**\n\n*function loggingIdentity<t>(arg: T):\
    \ T {*\n\n *console.log(arg.length); // Error: T has no *\n\n*.length property*\n\
    \n *return arg;*\n\n*}*\n\n*</t>*\n\nInstead of working with any possible type,\
    \ we would like to create a con­\n\nstraint so that the function works with all\
    \ types that have a property \n\n.length. If a type has this property, it can\
    \ be used, but it must have at least \n\nthis property.\n\nTo implement this,\
    \ we will create an interface that describes such a \n\nrestriction. Creating\
    \ an interface with a single property. length, and use it \n\nwith the extend\
    \ keyword to denote a constraint:\n\n*interface Lengthwise {*\n\n *length: number;*\n\
    \n*}*\n\n*function loggingIdentity<t extends=\"\" *\n\n*lengthwise=\"\">(arg:\
    \ T): T {*\n\n *console.log(arg.length);  // Now we know that the *\n\n*object\
    \ has a property .length, so there is no error   *\n\n *return arg;*\n\n*}*\n\n\
    *</t>*\n\nSince the generalized function now has a constraint, it will not be\
    \ able to \n\nwork with any type:\n\n*loggingIdentity(3); / / Error, the number\
    \ has no *\n\n*.length property*\n\nInstead, it needs to pass values of those\
    \ types that have all the necessary \n\nproperties:\n\n*loggingIdentity({length:\
    \ 10, value: 3});*\n\n*Using Generic Parameters in Generalization Constraints*\n\
    \nYou can define a type parameter that will be limited to the type of another\
    \ \n\ntype parameter. For example, we want to get a property of an object by"
