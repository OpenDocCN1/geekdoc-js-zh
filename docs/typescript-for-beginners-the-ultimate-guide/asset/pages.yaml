  md: "**128**    ◾    TypeScript for Beginners\n\nBrowser-based JS uses Web APIs\
    \ that provide access to the DOM and \n\nuser interface of pages and web applications.\
    \ Server-side JS uses APIs that \n\nprovide access to the application file system,\
    \ http requests, and streams.\n\nThat is, Node.js is a technology for using JS\
    \ on the backend. The features \n\nand prospects of the development of the JS\
    \ language can be found in the \n\ncorresponding article, and here we are talking\
    \ about one of the technolo­\n\ngies of this language.\n\nBoth are browser-based\
    \ JS and Node.js runs in the V8 runtime. This \n\nengine uses your JS code, and\
    \ converts it to faster machine code. Machine \n\ncode is low – level code that\
    \ a computer can run without having to inter­\n\npret it first.\n\nUsing Node.js\
    \ implements the “JavaScript for everything” paradigm. \n\nIt involves using a\
    \ single programming language to develop web applica­\n\ntions instead of using\
    \ different languages to work on the frontend and \n\nbackend.\n\nMost often,\
    \ this platform is used to create web services that require \n\nintensive information\
    \ exchange with users, including the implementation \n\nof chats, collaboration\
    \ systems, social networks, etc. Many programs cre­\n\nated on Node.js, consists\
    \ of server and client parts.\n\nWHY TYPESCRIPT IS HERE TOO?\n\nDevelopers switching\
    \ to JS from other languages often complain about the \n\nlack of powerful static\
    \ typing, but TypeScript (TS) allows you to eliminate \n\nthis drawback.\n\nTechnically\
    \ speaking, TS is a superset of JS, and that means that all JS \n\ncode is correct\
    \ TS code.\n\nWhy Node.js?\n\nThe most significant advantage is the non-blocking\
    \ I/O model. This sys­\n\ntem is event-driven and works asynchronously, lining\
    \ up the queue by pri­\n\nority. When thousands of people connect to the server\
    \ at the same time, \n\nit is easier for it to cope with the load, since there\
    \ is no need to create a \n\nseparate thread for each connection. Proper allocation\
    \ of resources helps \n\nto withstand a larger number of connections.\n\nWHAT\
    \ IS DENO?\n\nIf you are familiar with Node.js, a popular server-side JS ecosystem,\
    \ Deno \n\nis pretty much the same. Almost, but not quite."
