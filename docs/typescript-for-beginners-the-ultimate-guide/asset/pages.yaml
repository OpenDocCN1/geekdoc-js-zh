    \n *id: number | undefined;*\n\n *name: string | undefined;*\n\n *}*\n\nFirst,\
    \ we have an interface called IBase, which defines the id prop­\n\nerty of the\
    \ number or undefined type. Our second interface definition, \n\nIDerivedFromBase,\
    \ inherits (extends) from IBase, and therefore auto­\n\nmatically includes the\
