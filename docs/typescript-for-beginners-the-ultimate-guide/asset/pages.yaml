  md: "Key Concepts of TS    ◾   ** 75**\n\nBut such code will be unreliable. If we\
    \ decide to copy the reference to \n\nthe user object to another variable, for\
    \ example, admin = user, and over­\n\nwrite the user variable with something else,\
    \ then the wrong object will be \n\naccessed when calling the method from admin.\n\
    \nThis is shown below:\n\n*let user = {*\n\n*name: \"John\",*\n\n*age: 30,*\n\n\
    *SayHi() {*\n\n*alert( user.name ); / / will result in an error*\n\n*}*\n\n*};*\n\
    \n*let admin = user;*\n\n*user = null; // reset the variable for clarity, now\
    \ it *\n\n*does not store a reference to the object.*\n\n*admin.SayHi (); / /\
    \ Error! Inside SayHi (), the user *\n\n*is used, which no longer references the\
    \ object!*\n\nIf we use this.name instead of user.name inside the alert, then\
    \ this code \n\nwill work.\n\n*Keyword “this” and Arrow Functions*\n\n*The keyword\
    \ this* is a variable that is set when the function is called. This \n\nis a very\
    \ powerful and flexible feature of the language, but in return for its \n\nadvantages,\
    \ you always have to remember the context in which the func­\n\ntion is executed.\
    \ It’s easy to get confused here, especially when a function \n\nis returned as\
    \ a result or passed as an argument.\n\nLet’s look at an example:\n\n*let deck\
    \ = {*\n\n *suits: \\[\"hearts\", \"spades\", \"clubs\", \"diamonds\"\\],*\n\n\
    \ *cards: Array(52),*\n\n *createCardPicker: function() {*\n\n *return function()\
    \ {*\n\n *let pickedCard = Math.floor(Math.random() *\n\n*\\* 52);*\n\n *let pickedSuit\
    \ = Math.floor(pickedCard / *\n\n*13);*"
  merge: -1
