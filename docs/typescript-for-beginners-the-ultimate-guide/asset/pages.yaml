  md: "TypeScript    ◾   ** 11**\n\n*console.log(x\\[5\\].toString()); // OK, 'string'\
    \ and *\n\n*'number' both have the toString method*\n\n*x\\[6\\] = true; // Error,\
    \ boolean is not (string | *\n\n*number)*\n\nThe Union type will be described\
    \ later in the Advanced types section.\n\n*Tuples Deconstruction*\n\nSince tuples\
    \ use array syntax, they can be deconstructed or disassembled \n\nin two ways.\
    \ The first one, using a simple array syntax, looks like this:\n\n*console.log('tupleType\\\
    [0\\]: ${tupleType\\[0\\]}');*\n\n*console.log('tupleType\\[1\\]: ${tupleType\\\
    [1\\]}')*\n\nHere we simply write each property of the tupleType variable to the\
    \ con­\n\nsole, referring to the index in the array, i.e., tupleType\\[0\\] and\
    \ typleType\\[1\\]. \n\nThe output of this code will be as follows:\n\n*tupleType\\\
    [0\\]: test tupleType\\[1\\]: false*\n\nSo, we created a tuple with a string and\
    \ a Boolean value and deconstructed \n\nit using array syntax. Note that since\
    \ we use the array syntax, we can \n\nrequest the third property of this tuple:\n\
    \n*console.log('tupleType\\[2\\]: ${tupleType\\[2\\]}');*\n\nSince our tuple does\
    \ not have a third property, *typleType\\[2\\]* will be unde­\n\nfined, as can\
    \ be seen from the output of this line of code:\n\n*tupleType\\[2\\]: undefined*\n\
    \nThis is clearly far from perfection. The best way to deconstruct a tuple is\
    \ \n\nto use the array syntax to create the corresponding tuple on the left side\
    \ of \n\nthe assignment:\n\n*et \\[t1, t2\\] = tupleType;*\n\n*console.log('t1:\
    \ ${t1}');*\n\n*console.log('t2: ${t2}');*"
