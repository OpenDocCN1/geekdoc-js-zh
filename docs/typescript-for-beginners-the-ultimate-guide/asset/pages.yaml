  md: "**170**    ◾    TypeScript for Beginners\n\ntools available, we can also automate\
    \ these acceptance tests so that they \n\nrun as part of an automated test suite.\
    \ The more acceptance tests a project \n\nhas, the more reliable it will be. Note\
    \ that in the test-driven development \n\nmethodology, each error detected by\
    \ the manual testing team should lead \n\nto the creation of new unit, integration,\
    \ or acceptance tests. This meth­\n\nodology will help ensure that once an error\
    \ is found and fixed, it will not \n\nappear again.\n\nREFACTORING\n\nRefactoring\
    \ is a systematic procedure for improving code without creat­\n\ning new functionality.\
    \ Refactoring turns mess into clean code and simple \n\ndesign.\n\nAs trivial\
    \ as it may sound, refactoring in a large project is a compli­\n\ncated thing,\
    \ especially if the tests in the project are not written for every \n\nfunction\
    \ or are written in such a way that they do not cover the entire \n\ncode base\
    \ or not all use cases. Even by slightly changing the behavior of \n\na function,\
    \ you always run the risk of returning something from it or \n\npassing (forgetting\
    \ to pass) something wrong to it. This case is more in \n\nthe piggy bank of tests,\
    \ but still with TypeScript you can be sure that the \n\nfunction returns the\
    \ type that you specified and accepts exactly what you \n\nspecified.\n\nTYPESCRIPT\
    \ 4.2 RELEASE\n\nMicrosoft has released TypeScript 4.2. This is the most recent\
    \ update at \n\nthe time of writing this book. In the quarterly update of the\
    \ language, it is \n\nnow possible to set the abstract modifier to the constructor\
    \ signature and \n\nmark the variable as unused when the array is destructured.\
    \ Tuple types \n\nnow allow rest arguments at any position, and type aliases are\
    \ no longer \n\nexpanded when a hint is displayed.\n\nSUPPORT FOR REST ELEMENTS\
    \ IN THE FIRST AND \n\nINTERMEDIATE PARAMETERS OF TUPLES OF TYPES\n\nThe tuple\
    \ syntax in TypeScript supports rest elements that are prefixed \n\nwith \\[…\\\
    ] and can contain any number of parameters of the same type. \n\nPreviously, rest\
    \ parameters were put in the last position, so it was impos­\n\nsible to express\
    \ tuple types that end with a fixed set of elements. Such tuple \n\ntypes are\
    \ useful for strongly typed functions with lists of variable param­\n\neters that\
    \ end with a fixed set of parameters."
