  md: "**120**    ◾    TypeScript for Beginners \n\nsrc/ModuleB/package file.json\
    \ containing {“main”: “lib/MainModule.\n\njs”}, then it will refer to /root/src/moduleB/lib/mainModule.js.\n\
    \n3\\. If the /root/src/ModuleB directory contains a file named index.js, by \n\
    \ndefault, it is assumed that it is the main module of this directory.\n\nHowever,\
    \ the resolution of nonrelative module names is performed in a \n\ndifferent way.\
    \ Node will search for your modules in a special directory \n\ncalled node\\_modules.\
    \ It can be at the same level of the directory hierarchy \n\nas the current file,\
    \ or higher. Node will go up the directory chain, looking \n\nthrough each node\\\
    _modules until it finds the module you tried to load.\n\nContinuing with our example,\
    \ let’s assume that in /root/src/ModuleA.\n\njs used a nonrelative path, and the\
    \ import command looked like this: var \n\nx = require (“ModuleB”);. Node will\
    \ try to resolve ModuleB to one of the \n\nfollowing paths and will stop at the\
    \ first suitable one.\n\n*/root/src/node\\_modules/moduleB.js*\n\n*/root/src/node\\\
    _modules/moduleB/package.json (if it *\n\n*defines the \"main\" property)*\n\n\
    */root/src/node\\_modules/moduleB/index.js*\n\n*/root/node\\_modules/moduleB.js*\n\
    \n*/root/node\\_modules/moduleB/package.json (if it defines *\n\n*the \"main\"\
    \ property)*\n\n*/root/node\\_modules/moduleB/index.js*\n\n*/node\\_modules/moduleB.js*\n\
    \n*/node\\_modules/moduleB/package.json (if it defines the *\n\n*\"main\" property)*\n\
    \n*/node\\_modules/moduleB/index.js*\n\n*Additional Flags of the Module Resolution\
    \ System*\n\nThe initial structure of the project does not always correspond to\
    \ what is \n\nobtained in the output. Usually, several steps are needed to achieve\
    \ the \n\nresult. This is the compilation of files .ts in .js, and copying dependencies\
    \ \n\nfrom different sources to a single output file. As a result, the modules\
    \ in the \n\nexecution process can have names different from the names of the\
    \ source \n\nfiles with their definitions. The module paths in the final output\
    \ may also \n\ndiffer from the corresponding initial paths at the compilation\
    \ stage.\n\nTypeScript has a set of additional flags that can be used to inform\
    \ the \n\ncompiler about the transformations that must occur with the source code\
    \ \n\nin order to generate the final output."
