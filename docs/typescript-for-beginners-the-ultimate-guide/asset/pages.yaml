  md: "**58**    ◾    TypeScript for Beginners\n\n*Parameter Properties*\n\nIn our\
    \ last example, we declared the readonly member name and the con­\n\nstructor\
    \ parameter theName in the Octopus class, and assigned theName \n\nto name. This\
    \ is a very common practice. The *parameter properties* allow \n\nyou to create\
    \ and initialize members in one place. Here is a further refine­\n\nment of the\
    \ previous Octopus class, using the parameter property:\n\n*class Octopus {*\n\
    \n *readonly numberOfLegs: number = 8;*\n\n *constructor(readonly name: string)\
    \ {*\n\n *}*\n\n*}*\n\nNote how we removed theName and shortened the readonly\
    \ name: string \n\nconstructor parameter to create and initialize the name member.\
    \ We com­\n\nbined the declaration and assignment in one place.\n\nParameter properties\
    \ are declared before a constructor parameter that \n\nhas an availability modifier,\
    \ readonly, or both. Using the private param­\n\neter property declares and initializes\
    \ the private member; so do public, \n\nprotected, and readonly.\n\n*Accessors\
    \ (Getters/Setters)*\n\nTS supports getters and setters as a way to intercept\
    \ accesses to object \n\nproperties. This gives you more control over the moment\
    \ you interact with \n\nthe properties of objects.\n\nLet’s rewrite a simple class\
    \ using get and set. First, let’s write down an \n\nexample without using getters\
    \ and setters.\n\n*class Employee {*\n\n *fullName: string;*\n\n*}*\n\n \n\n*let\
    \ employee = new Employee();*\n\n*employee.fullName = \"Bob Nylon\";*\n\n*if (employee.fullName)\
    \ {*\n\n *console.log(employee.fullName);*\n\n*}*\n\nAllowing fullName to be set\
    \ directly is quite convenient, but it can lead to \n\nproblems if someone wants\
    \ to change the name at will."
