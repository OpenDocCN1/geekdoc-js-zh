  md: "**30**    ◾    TypeScript for Beginners\n\nInterfaces\n\nYou can see that TS\
    \ has obtained a lot from C#. Interfaces will be another \n\nexample of such close\
    \ collaboration.\n\nAn interface is a declaration that is similar to a class but\
    \ does not have \n\na method implementation. You can use it to describe the properties\
    \ and \n\nmethods of objects. At the same time, the interface does not have the\
    \ \n\nimplementation of functions and does not have the code itself – it is only\
    \ \n\nnecessary for the compiler to evaluate your implementations of the object\
    \ \n\n(let me remind you that the class is also an object). Roughly speaking,\
    \ an \n\ninterface is a descriptive structure. Unlike classes, interfaces are\
    \ uncompi­\n\nlable and live only in TS runtime.\n\nThe interface declaration\
    \ starts with the interface keyword. Then, the \n\nname of the interface comes,\
    \ which is usually started with a capital letter \n\nI. This is not a prerequisite\
    \ for using interfaces, but I recommend that you \n\nstick to this convention,\
    \ if only because it is very convenient.\n\nYou can write interfaces anywhere:\
    \ next to the code, at the beginning \n\nof a file, or even in a separate file.\
    \ I recommend keeping the interface \n\ndeclaration where it is needed. For example,\
    \ if the interface is used only \n\nwithin a single module (file), then you can\
    \ safely keep it there. If the \n\ninterface is used in many modules of the project,\
    \ it is more appropriate \n\nto create a directory type and decompose the interfaces\
    \ according to the \n\nlogic there.\n\nLet’s consider the simplest example of\
    \ an interface for an object describ­\n\ning a VPS server:\n\n*interface IServer\
    \ {*\n\n *hostname: string;*\n\n *location: string;*\n\n *active: boolean;*\n\n\
    \ *public\\_address: string;*\n\n*}*\n\nNow that we have defined the interface,\
    \ we can use it in a variable. \n\nIt is usually customary to say “implement the\
    \ interface” rather than \n\n“use the interface,” since the compiler verifies\
    \ that the interface is \n\nimplemented correctly. And, in case of an incorrect\
    \ implementation \n\n(there is not at least one property), it will output errors\
    \ every time"
