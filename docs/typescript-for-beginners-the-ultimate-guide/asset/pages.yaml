  md: "Modules and Namespaces    ◾   ** 105**\n\n*console.log(num); // \"123\"*\n\n\
    **export = import = require()**\n\nCommonJS and AMD have the concept of an exports\
    \ object that contains \n\nall the module exports.\n\nThey also support replacing\
    \ the exports object with a single user object. \n\nThe default export is intended\
    \ to replace this functionality. Both approaches, \n\nhowever, are incompatible.\
    \ TypeScript supports the export = construct, \n\nwhich can be used to model the\
    \ familiar way CommonJS and AMD work.\n\nThe export = construct defines a single\
    \ object to export from the mod­\n\nule. This can be a class, interface, namespace,\
    \ function, or enumeration.\n\nTo import a module exported with export =, the\
    \ TypeScript-specific \n\nconstruct import let = require(\"module\") must be used.\n\
    \n***ZipCodeValidator.ts***\n\n*let numberRegexp = /^\\[0-9\\]+$/;*\n\n*class\
    \ ZipCodeValidator {*\n\n*    isAcceptable(s: string) {*\n\n*        return s.length\
    \ === 5 && numberRegexp.test(s);*\n\n*    }*\n\n*}*\n\n*export = ZipCodeValidator;*\n\
    \n***Test.ts***\n\n*import zip = require(\"./ZipCodeValidator\");*\n\n*// A few\
    \ test cases*\n\n*let strings = \\[\"Hello\", \"4546\", \" 101\"\\];*\n\n*// Validators*\n\
    \n*let validator = new postcode();*\n\n*// For each line shows did it every validator*\n\
    \n*strings.forEach(s => {*\n\n*console.log(\\`\"${ s }\" - ${ validator.isAcceptable(s)?\
    \ *\n\n*\"matches\" : \"does not match\" }\\`);*\n\n*});*\n\nGenerating Code for\
    \ Modules\n\nDepending on the module target specified at compile time, the compiler\
    \ \n\nwill generate the appropriate code for Node.js (CommonJS), require.js \n\
    \n(AMD), (UMD), SystemJS, or native ECMAScript 2015 (ES6) modules."
