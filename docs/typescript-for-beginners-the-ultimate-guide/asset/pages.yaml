    \ Bee extends Animal {*\n\n *keeper: BeeKeeper = *\n\n*new BeeKeeper();*\n\n *}*\n\
    \n *class Lion extends Animal {*\n\n *keeper: ZooKeeper = *\n\n*new ZooKeeper();*\n\
    \n *}*\n\n *function createInstance<TAnimal *\n\n*extends Animal>(c: new () =>\
    \ TAnimal): Tanimal*\n\n *return new c();*\n\n *}*\n\n *console.*\n\n*log(createInstance(Lion).keeper.nametag);\
    \ shows \"tag\"*\n\n *console.log(createInstance *\n\n*(Bee).keeper.hasMask);\
    \ // shows \"false\"*\n\n*new Keyword*\n\nTo create a new object in the generalization\
