  md: "**114**    ◾    TypeScript for Beginners \n\n***Consumer.ts***\n\n*import \\\
    * as myLargeModule from \"./MyLargeModule.ts\";*\n\n*let x = new myLargeModule.Dog();*\n\
    \nDo Not Use Namespaces in Modules\n\nWhen programmers first start using module-based\
    \ code organization, \n\nthey often place exported elements in namespaces, thus\
    \ creating addi­\n\ntional nesting levels. But the modules have their own scope,\
    \ and only the \n\nexported elements are visible from the outside. Therefore,\
    \ namespaces are \n\nnot able to bring tangible benefits when working with modules.\n\
    \nNamespaces are convenient for grouping logically related objects and \n\nglobal\
    \ scope types, which is convenient for organizing code. For example, \n\nin C#,\
    \ all collection types can be found in System.Collections. By organiz­\n\ning\
    \ types in a hierarchy of namespaces, we make it easier for users to find \n\n\
    them. Modules, on the contrary, in any case already exist as files. We find \n\
    \nthem by the path and file name, respectively, their logical organization is\
    \ \n\nalready present. You can create a directory /collections/generic/ that con­\n\
    \ntains a list module.\n\nNamespaces are an important tool for preventing name\
    \ conflicts. \n\nFor example, you can have My. Application.Customer.AddForm and\
    \ \n\nMy.Application.Order. AddForm – two types with the same name but \n\ndifferent\
    \ namespaces. And with modules, there will be no such problem. \n\nThere is no\
    \ good reason to create two objects with the same name inside \n\na module. From\
    \ the user’s point of view, he can choose any name for the \n\nimported module,\
    \ so random name conflicts are not possible.\n\nRisk Indicators\n\nThe following\
    \ is a list of warning signs regarding module structuring. Once \n\nagain, make\
    \ sure that you are not trying to create namespaces for your \n\nexternal modules,\
    \ if any of the following statements apply to your situation:\n\n• The file contains\
    \ a single top-level declaration, export namespace \n\nFoo {…} (remove Foo and\
    \ move everything up a level).\n\n• The file contains a single instance of export\
    \ class or export function \n\n(consider using export default).\n\n• Multiple\
    \ files contain an identical export namespace Foo {at the top \n\nlevel (don’t\
    \ count on all of them joining into a single namespace Foo!)."
