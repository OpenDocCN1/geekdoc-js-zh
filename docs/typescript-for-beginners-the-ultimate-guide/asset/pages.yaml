  md: "**14**    ◾    TypeScript for Beginners\n\nUnder the hood (in generated JS),\
    \ TS will assign a numeric value to each \n\nof these human-readable enumeration\
    \ values. In this example, the value \n\nof the DoorState enumeration.Open will\
    \ be equal to the numeric value 0. \n\nThe same is true for the DoorState enumeration.Closed\
    \ will be equal to the \n\nnumeric value 1, and the value of the enum is DoorState.Ajar\
    \ will be equal \n\nto 2. Let’s take a quick look at how we’ll use these enum\
    \ values:\n\n*var openDoor = DoorState.Open;*\n\n*console.log('openDoor is: ${openDoor}');*\n\
    \nHere, the first line of this code snippet creates a variable named openDoor\
    \ \n\nand sets its value to DoorState.Open. The second line simply writes the\
    \ \n\nvalue of the openDoor variable to the console. The output will look like\
    \ \n\nthis:\n\n*openDoor is: 0*\n\nThis clearly shows that the TS compiler has\
    \ replaced the value of the \n\nDoorState enumeration.Open to the numeric value\
    \ 0.\n\nNow let’s use this enumeration in a little different way:\n\n*var closedDoor\
    \ = DoorState\\[\"Closed\"\\];*\n\n*console.log('closedDoor is: ${closedDoor}');*\n\
    \nThis code snippet uses the string value “Closed” to search for the enum \n\n\
    type and assigns the resulting enum value to the closedDoor variable. The \n\n\
    output of this code will be as follows:\n\n*closedDoor is: 1*\n\nThis example\
    \ clearly shows that the enum value for DoorState is.Closed \n\nis combined with\
    \ the enum value for DoorState \\[“Closed”\\], since in both \n\ncases the numeric\
    \ value 1 is returned. Enumerations are a convenient way \n\nto define an easy-to-remember,\
    \ easy-to-read name for a special number. \n\nUsing human-readable enumerations\
    \ instead of just throwing around \n\nvarious special numbers in our code makes\
    \ the purpose of the code more \n\nclear. Use a value for the entire application\
    \ named DoorState.Open or \n\nDoorState.Closed is much easier than remembering\
    \ to set the value to 0 \n\nfor Open, 1 for Closed, and 3 for Ajar. In addition\
    \ to making our code"
