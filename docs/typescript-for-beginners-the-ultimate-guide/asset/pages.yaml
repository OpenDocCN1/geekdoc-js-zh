  md: "TypeScript    ◾   ** 9**\n\n*Boolean*\n\nThe most basic type is the Boolean\
    \ true/false, which is called Boolean in \n\nJS and TS.\n\nlet isEnabled = true;\n\
    \nlet isAlive: boolean = false;\n\n \n\nconsole.log(isEnabled);\n\nconsole.log(isAlive);\n\
    \n*Number*\n\nUnlike various object-oriented languages such as Java, C#, and C++,\
    \ which \n\nprovide different data types, such as int, float, and decimal, for\
    \ storing a \n\nnumeric value, TS has only one numeric data type, called number.\
    \ A vari­\n\nable with the number data type can contain any numeric literal with\
    \ float­\n\ning, hexadecimal, and binary or octal values.\n\nlet decimal: number\
    \ = 6;\n\nlet hex: number = 0xf00d;\n\nlet binary: number = 0b1010;\n\nlet octal:\
    \ number = 0o744;\n\n*String*\n\nAnother important part of programs in web pages\
    \ and servers is text data. \n\nAs in other languages, TS uses the same “string”\
    \ notation for such data. \n\nLike JS, TS uses double (“) or single (‘) quotes\
    \ to frame text data.\n\nlet name: string = \"bob\";\n\nname = 'smith';\n\nYou\
    \ can also use strings with templates, which can be multi-line and have \n\nbuilt-in\
    \ expressions. These strings are surrounded by back apostrophes or \n\nquotation\
    \ marks (’) and inline expressions are denoted as ${expr}.\n\nlet name: string\
    \ = 'Gene';\n\nlet age: number = 37;\n\nlet sentence: string = 'Hello, my name\
    \ is ${ name }. \n\n \n\nI'll be ${age + 1} years old next month.'"
