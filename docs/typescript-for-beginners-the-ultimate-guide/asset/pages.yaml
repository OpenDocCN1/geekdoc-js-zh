  md: "**12**    ◾    TypeScript for Beginners\n\nHere we define an array of two elements\
    \ named t1 and t2 and assign this \n\narray a tuple value. Then we write t1 and\
    \ t2 to the console. The output of \n\nthis code looks like this:\n\n*t1: test*\n\
    \n*t2: false*\n\nThis method of deconstructing a tuple is preferred for a simple\
    \ reason. We \n\ncan’t define an array of elements that exceeds the number of\
    \ properties in \n\nthe tuple. Therefore, the code below will not work.\n\n*let\
    \ \\[et1, et2, et3\\] = tupleType;*\n\nHere we are trying to deconstruct our tuple\
    \ of two properties into a tuple \n\nof three properties. The compiler will throw\
    \ an error in this case:\n\n*error TS2493: Tuple type '\\[string, boolean\\]'\
    \ with *\n\n*length '2' cannot be assigned to tuple with length '3'*\n\n*Optional\
    \ Tuple Elements*\n\nLike function signatures, we can also have optional tuple\
    \ elements. This is \n\nachieved with the help of the symbol? in the tuple definition:\n\
    \n*let optionalTuple: \\[string, boolean?\\];*\n\n*optionalTuple = \\[\"test2\"\
    , true\\];*\n\n*console.log('optionalTuple: ${optionalTuple}');*\n\n*optionalTuple\
    \ = \\[\"test\"\\];*\n\n*console.log('optionalTuple: ${optionalTuple}');*\n\n\
    Here we have a specific variable named optionTuple with a required string \n\n\
    property and an optional Boolean property. Then we assign it the value \n\n\\\
    [“test2”, true\\] and write it to the console. After that, we assign the value\
    \ \n\n\\[“test”\\] to the same tuple and write the value to the console. Since\
    \ the \n\nsecond optionTuple property is essentially optional, this code will\
    \ be com­\n\npiled cleanly and will produce, as expected, the following results:\n\
    \n*optionalTuple: test2,true*\n\n*optionalTuple: test*"
