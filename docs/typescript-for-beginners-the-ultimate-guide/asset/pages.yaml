  md: "**42**    ◾    TypeScript for Beginners\n\nexample, like this a\\[10\\] or\
    \ ageMap \\[“daniel”\\]. Indexed types have an index \n\nsignature that describes\
    \ the types that can be used to index an object, as \n\nwell as the types of values\
    \ that this operation returns. Here is an example:\n\n*interface StringArray {*\n\
    \n *\\[index: number\\]: string;*\n\n*}*\n\n \n\n*let myArray: StringArray;*\n\
    \n*myArray = \\[\"Bob\", \"Josh\"\\];*\n\n \n\n*let myStr: string = myArray\\\
    [0\\];*\n\nHere we have a stringArray interface that has an index signature. This\
    \ \n\nsignature says that when stringArray is indexed by a number, a string is\
    \ \n\nreturned.\n\nThere are only two types of supported index signatures: with\
    \ strings \n\nand with numbers as an argument. An object can support both types,\
    \ but \n\nthe type of value returned by a numeric index must be a subtype of the\
    \ \n\none returned by a string index. This is because when an index operation\
    \ \n\nis applied to an object, JS first converts the number passed as an index\
    \ to \n\na string. That is, using the index 100 (number) is the same as using\
    \ “100” \n\n(string), so the types of both indexes must be consistent.\n\n*class\
    \ Animal {*\n\n*name: string;*\n\n*}*\n\n*class Dog extends Animal {*\n\n*breed:\
    \ string;*\n\n*}*\n\n*/ / Error: indexing with a string can return a Dog *\n\n\
    *object!*\n\n*interface NotOkay {*\n\n*\\[x: number\\]: Animal;*\n\n*\\[x: string\\\
    ]: Dog;*\n\n*}*\n\nIn addition to being a powerful way to describe dictionaries,\
    \ string indexes \n\nrequire that the types of all properties match the type that\
    \ the index opera­\n\ntion returns. This is because obj.property is also available\
    \ as obj\\[property\\]."
