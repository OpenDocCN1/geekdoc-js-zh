  md: "TypeScript Architecture    ◾   ** 171**\n\nTuple types now allow rest parameters\
    \ at any position, not just the last \n\none. For example:\n\n*type T1 = \\[...string\
    \ \\[\\], number\\]; / / Zero or more *\n\n*strings followed by a number;*\n\n\
    *type T2 = \\[number, ...boolean \\[\\], string, string\\]; / / *\n\n*A number\
    \ followed by zero or more boolean values *\n\n*followed by two strings.*\n\n\
    Now there is only one restriction for rest elements – they cannot go after \n\n\
    other rest elements and before optional elements.\n\nSAVING-TYPE ALIASES\n\nType\
    \ aliases are now saved for more correct display of the hint in the IDE \n\nand\
    \ type output in the *.d.ts* definition files. It also tracks type aliases for\
    \ \n\ninstances of other aliases. This makes the representation of composite \n\
    \ntypes readable (including in the definition *file. d.ts*).\n\nTHE ABSTRACT MODIFIER\
    \ IN CONSTRUCTOR SIGNATURES\n\nTypeScript allows you to mark a class as abstract\
    \ – in this case, it is only \n\nused to extend it with a subclass, and object\
    \ instances are created only for \n\na specific implementation class. But in TypeScript\
    \ of previous versions, \n\nthere were problems when creating mix-ins that use\
    \ abstract classes.\n\nTypeScript 4.2 allows you to specify an abstract modifier\
    \ for construc­\n\ntor signatures. Adding an abstract modifier to the constructor\
    \ signature \n\nsignals that an abstract class can be passed to it. This does\
    \ not prevent you \n\nfrom passing other classes and constructor functions that\
    \ are “specific” \n\nto it.\n\nMix-in factories will now support abstract classes.\n\
    \n*abstract class Shape {*\n\n *abstract getArea(): number;*\n\n *}* \n\n*// Error!\
    \ You cannot create an instance of an abstract *\n\n*class.*\n\n *new Shape();*\n\
    \n *interface HasArea {*\n\n *getArea(): number;*\n\n *}*"
