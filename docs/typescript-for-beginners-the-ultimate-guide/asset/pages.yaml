  md: "TypeScript    ◾   ** 17**\n\n*Null and Undefined*\n\nThe Null and Undefined\
    \ types correspond to the same types in JS. These \n\ntypes are subtypes for all\
    \ other types by default.\n\n*let n: number = null; / / Primitive types can be\
    \ null*\n\n*let m: number = undefined; / / Primitive types can be *\n\n*undefined*\n\
    \n*let x = null; / / same as x: any = null*\n\n*let y = undefined; / / same as\
    \ y: any = undefined*\n\n*let e: Null; / / Error*\n\n*let r: Undefined; / / Error*\n\
    \nIf you declare a variable of type null or undefined, then such a variable \n\
    \ncan only be assigned the value null or undefined, respectively, which has \n\
    \nno practical application.\n\n*let n: null = null; / / Only this value can be\
    \ *\n\n*assigned to*\n\n*n = 1; / / Error!*\n\n*let m: undefined = undefined;*\n\
    \n*m = \"some string\"; / / Error!*\n\nIt is worth noting that if you use the\
    \ –strictNullChecks compiler directive, \n\nnull and undefined can only be assigned\
    \ to a variable of type void and to \n\nvariables of type null or undefined, respectively.\
    \ This helps to avoid a lot of \n\nmistakes. In this case, if the variable needs\
    \ to be assigned a value with the \n\nstring or null or undefined type, you can\
    \ use the string | null | undefined \n\nunion type.\n\n*Never*\n\nThe never type\
    \ represents a type whose value never occurs. For example, \n\nnever is a type\
    \ that returns a function that always throws exceptions or \n\nthat never exits\
    \ (for example, an infinite loop). Variables can also have this \n\ntype, for\
    \ example, in order to never take the value true.\n\nThe never type is a subtype\
    \ of any type. A variable of type never can \n\nbe assigned to a variable of any\
    \ other type. On the other hand, there \n\nis no such type that will be a subtype\
    \ of this type, just as a variable of \n\nthis type cannot be assigned anything\
    \ other than a variable of the same \n\ntype (never)."
  merge: -1
  pgno: 33
