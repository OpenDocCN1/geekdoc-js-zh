    \ that are not functions must be unique. The compiler \n\nwill throw an error\
    \ if both interfaces define a member with the same name \n\nthat is not a function.\n\
    \nEach member function with the same name is treated as an overload \n\ndescription\
    \ for the same function. It is also worth noting that when merg­\n\ning interface\
    \ A with a subsequent interface A, the second one will have a \n\nhigher priority\
    \ than the first one.\n\nSo, in this example:\n\n*interface Cloner {*\n\n *clone(animal:\
    \ Animal): Animal;*\n\n*}*\n\n*interface Cloner {*\n\n *clone(animal: Sheep):\
    \ Sheep;*\n\n*}*\n\n*interface Cloner {*\n\n *clone(animal: Dog): Dog;*\n\n *clone(animal:\
    \ Cat): Cat;*\n\n*}*\n\nThree interfaces will be merged together and you will\
    \ get the following ad:\n\n*interface Cloner {*\n\n *clone(animal: Dog): Dog;*\n\
    \n *clone(animal: Cat): Cat;*\n\n *clone(animal: Sheep): Sheep;*\n\n *clone(animal:\
    \ Animal): Animal;*\n\n*}*\n\nNote that the elements within the groups retain\
    \ their order, but the groups \n\nthemselves are ordered so that the later overloads\
    \ are at the beginning.\n\nThe only exception around this rule is specialized\
    \ signatures. If the sig­\n\nnature has a parameter with the type of a single\
    \ string literal (i.e., not"
