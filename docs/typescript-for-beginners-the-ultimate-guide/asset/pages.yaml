  md: "TypeScript    ◾   ** 13**\n\n*Enum*\n\nEnum is a special type borrowed from\
    \ other languages like C#, C ++, and \n\nJava that provides a solution to the\
    \ special numbers problem. Enum binds \n\na human-readable name for a specific\
    \ number. As in languages like C#, \n\nthe enum type is a more convenient way\
    \ to give clear names to a set of \n\nnumeric values.\n\n*enum Color {Red, Green,\
    \ Blue};*\n\n*let c: Color = Color.Green;*\n\nBy default, enums start with 0.\
    \ You can change this by directly specifying \n\na value for one of the enum members.\
    \ For example, we can start the previ­\n\nous example with 1 instead of 0:\n\n\
    *enum Color {Red = 1, Green, Blue};*\n\n*let c: Color = Color.Green;*\n\nOr even\
    \ set values for all members:\n\n*enum Color {Red = 1, Green = 2, Blue = 4};*\n\
    \n*let c: Color = Color.Green;*\n\nA convenient feature of enumerations is that\
    \ you can also get the name of \n\nan enumeration member by passing its numeric\
    \ value. For example, if we \n\nhave a value of 2 and we want to see what it corresponds\
    \ to in the Color \n\nenumeration described above, we can do it like this:\n\n\
    *enum Color {Red = 1, Green, Blue};*\n\n*let colorName: string = Color\\[2\\];*\n\
    \n \n\n*alert(colorName);*\n\nLet’s consider the following code:\n\n*enum DoorState\
    \ {*\n\n *Open,* \n\n *Closed,*\n\n *Ajar*\n\n *}*\n\nHere we have defined an\
    \ enum named DoorState to represent the state \n\nof the door. Valid values for\
    \ this door state are Open, Closed, or Ajar."
