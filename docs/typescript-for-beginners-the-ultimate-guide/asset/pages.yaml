  md: "**148**    ◾    TypeScript for Beginners\n\nopportunity. Later, we will mix\
    \ them to form a new class that combines \n\ntheir properties.\n\n*// Disposable\
    \ mixin*\n\n*class Disposable {*\n\n *isDisposed: boolean;*\n\n *dispose() {*\n\
    \n *this.isDisposed = true;*\n\n *}*\n\n*}*\n\n*// Activatable mixin*\n\n*class\
    \ Activatable {*\n\n *isActive: boolean;*\n\n *activate() {*\n\n *this.isActive\
    \ = true;*\n\n *}*\n\n *deactivate() {*\n\n *this.isActive = false;*\n\n *}*\n\
    \n*}*\n\nNext, we will create a new class that will combine both admixtures. Let’s\
    \ \n\nlook at how to achieve this:\n\n*class SmartObject implements Disposable,\
    \ Activatable {*\n\nThe first thing you might have noticed is that implements\
    \ is used instead \n\nof extends. This approach allows you to treat classes as\
    \ interfaces and use \n\nonly the types Disposable and Activatable, and not their\
    \ implementations. \n\nIt turns out that we will have to create the implementation\
    \ in a new class. \n\nBut the problem is that this is exactly what we would like\
    \ to avoid when \n\nusing impurities.\n\nTo avoid doing the implementation again,\
    \ we create stand-in proper­\n\nties, whose types will be derived from the corresponding\
    \ impurities. It is \n\nsufficient for the compiler to have these elements available\
    \ dynamically. \n\nThis approach allows us to take advantage of the impurities,\
    \ but with the \n\nadditional burden of taking into account such nuances."
