  md: "Key Concepts of TS    ◾   ** 81**\n\n*let suits = \\[\"hearts\", \"spades\"\
    , \"clubs\", \"diamonds\"\\];*\n\n \n\n*function pickCard(x): any {*\n\n *// Working\
    \ with object/array?*\n\n *// So, we were given a deck and we choose a card*\n\
    \n *if (typeof x == \"object\") {*\n\n *let pickedCard = Math.floor(Math.random()\
    \ \\* *\n\n*x.length);*\n\n *return pickedCard;*\n\n *}*\n\n *// Otherwise, we\
    \ give you the opportunity to *\n\n*choose a card*\n\n *else if (typeof x == \"\
    number\") {*\n\n *let pickedSuit = Math.floor(x / 13);*\n\n *return { suit: suits\\\
    [pickedSuit\\], card: x % 13 *\n\n*};*\n\n *}*\n\n*}*\n\n \n\n*let myDeck = \\\
    [{ suit: \"diamonds\", card: 2 }, { suit: *\n\n*\"spades\", card: 10 }, { suit:\
    \ \"hearts\", card: 4 }\\];*\n\n*let pickedCard1 = myDeck\\[pickCard(myDeck)\\\
    ];*\n\n*alert(\"card: \" + pickedCard1.card + \" of \" + *\n\n*pickedCard1.suit);*\n\
    \n \n\n*let pickedCard2 = pickCard(15);*\n\n*alert(\"card: \" + pickedCard2.card\
    \ + \" of \" + *\n\n*pickedCard2.suit);*\n\nIn this example, the pickCard function\
    \ returns two different things, \n\ndepending on what was passed to it. If the\
    \ user has passed an object that \n\nrepresents a deck of cards, the function\
    \ will select one of the cards. If the \n\nuser passes the card, the function\
    \ will determine which card he chose. But \n\nhow do you describe this behavior\
    \ using a type system?\n\nYou need to specify several types for one function,\
    \ creating a list of \n\noverloads. The compiler will use this list for checks\
    \ when calling the func­\n\ntion. Let’s create a list of overloads that describes\
    \ what the *pickCard* func­\n\ntion accepts and what it returns.\n\n*let suits\
    \ = \\[\"hearts\", \"spades\", \"clubs\", \"diamonds\"\\];*\n\n*function pickCard(x:\
    \ {suit: string; card: number; }*\n\n*\\[\\]): number;*"
