  md: "Key Concepts of TS    ◾   ** 63**\n\n *greeting: string;*\n\n *greet() {*\n\
    \n *if (this.greeting) {*\n\n *return \"Hello, \" + this.greeting;*\n\n *}*\n\n\
    \ *else {*\n\n *return Greeter.standardGreeting;*\n\n *}*\n\n *}*\n\n*}*\n\n*let\
    \ greeter1: Greeter;*\n\n*greeter1 = new Greeter();*\n\n*console.log(greeter1.greet());*\n\
    \n*let greeterMaker: typeof Greeter = Greeter;*\n\n*greeterMaker.standardGreeting\
    \ = \"Hey there!\";*\n\n*let greeter2: Greeter = new greeterMaker();*\n\n*console.log(greeter2.greet());*\n\
    \nIn this example, greeter1 works similarly to the one above. We created an \n\
    \ninstance of the Greeter class and use the object. We have already seen this.\n\
    \nThen we use the class directly. Creating a new variable named greet­\n\nerMaker.\
    \ This variable will contain the class itself, or, in other words, the \n\nconstructor\
    \ function. Here we use typeof Greeter, it looks like “give me \n\nthe type of\
    \ the Greeter class itself,” not the instance. Or, more precisely, \n\n“give me\
