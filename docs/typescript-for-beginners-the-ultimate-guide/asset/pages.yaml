  md: "**34**    ◾    TypeScript for Beginners\n\n*interface Rectangle {*\n\n *kind:\
    \ ’rectangle’;*\n\n *width: number;*\n\n *height: number;*\n\n*}*\n\n*interface\
    \ Circle {*\n\n *kind: ’circle’;*\n\n *radius: number;*\n\n*}*\n\nNow let’s look\
    \ at how we can use the discriminated union in practice. As \n\nyou probably already\
    \ guessed, we will calculate the area of the shapes that \n\nare described using\
    \ the interfaces.\n\n*function area(s: Square | Rectangle | Circle): number *\n\
    \n*{*\n\n *switch (s.kind) {*\n\n *case ’square’: return s.size \\* s.size;*\n\
    \n *case ’rectangle’: return s.height \\* *\n\n*s.width;*\n\n *case ’circle’:\
    \ return Math.PI \\* s.radius *\n\n*\\*\\* 2;*\n\n *}*\n\n*}*\n\nWe could also\
    \ use if to make the compiler understand which interface we \n\nare currently\
    \ working with.\n\n*function area(s: Shape): number {*\n\n *if (s.kind === ’square’)\
    \ {*\n\n *return s.size \\* s.size;*\n\n *}*\n\n *// ...*\n\n*}*\n\nNow let’s\
    \ talk about the case when the function can take not only a square, \n\nrectangle,\
    \ and circle, but also a triangle. At the same time, there is no cor­\n\nresponding\
    \ implementation for the triangle. In this case, the compiler will \n\nnot throw\
    \ an error if null and undefined are subtypes. However, if they are \n\nfull-fledged\
    \ types, we will either have to specify number | undefined as the \n\ntype returned\
    \ by the function, or add default in the case of using case, or \n\nelse in the\
    \ case of using if."
