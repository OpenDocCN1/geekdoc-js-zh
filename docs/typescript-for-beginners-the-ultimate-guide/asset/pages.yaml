  md: "TypeScript    ◾   ** 15**\n\nmore readable and more understandable, using numbers\
    \ also protects our \n\ncode base every time these special numeric values change,\
    \ since they are \n\nall defined in one place. The last thing I would like to\
    \ mention about enu­\n\nmerations is that we can set the numeric value manually,\
    \ if necessary, as \n\nfollows:\n\n*enum DoorState {*\n\n *Open = 3,*\n\n *Closed\
    \ = 7,*\n\n *Ajar = 10*\n\n *}*\n\nHere we have redefined the default enum values\
    \ to set the value *DoorState.*\n\n*Open* equal to 3, *DoorState.Closed* equal\
    \ to 7 and *DoorState.Ajar* equal to 10.\n\n*String Enums*\n\nAnother variant\
    \ of the enum type is a string enumeration, in which \n\nnumeric values are replaced\
    \ with strings:\n\n*enum DoorStateString {*\n\n *Open = \"open\",*\n\n *Closed\
    \ = \"closed\",*\n\n *Ajar = \"ajar\"*\n\n *}*\n\n*var openDoorString = DoorStateString.Open;*\n\
    \n *console.log('openDoorString = ${openDoorString}');*\n\nHere we have an enum\
    \ named DoorStateString, where each of the enum \n\nvalues is now of type string.\
    \ The output of this code snippet will be as \n\nfollows:\n\n*openDoorString =\
    \ open*\n\nAs expected, the TS compiler returns the string “open”.\n\n*Any*\n\n\
    We may need to describe the type of variables that we don’t know when \n\nwe write\
    \ our application. These values can be obtained from dynamic con­\n\ntent, such\
    \ as from a user or from a third-party library. In these cases, we"
