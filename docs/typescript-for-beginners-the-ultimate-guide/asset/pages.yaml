  md: "**168**    ◾    TypeScript for Beginners\n\nwrite our own applications, so\
    \ that they stand the test of time. The code we \n\nare currently writing can\
    \ be in a production environment for years, which \n\nmeans that sometimes you\
    \ will have to make improvements or fix bugs in \n\ncode that was written many\
    \ years ago. If the application has a complete \n\nset of tests surrounding it,\
    \ then changes can be made with confidence that \n\nthese changes will not violate\
    \ the existing functionality.\n\nTest-driven development in the JavaScript space\
    \ also adds another layer \n\nto our code coverage. Quite often, development teams\
    \ write tests designed \n\nonly for the application logic on the server side.\n\
    \nFor example, in the Visual Studio space, these tests are often written \n\n\
    only with a focus on the MVC framework, which consists of controllers, \n\nviews,\
    \ and basic business logic. It has always been quite difficult to test the \n\n\
    application logic on the client side, in other words, the actual rendered \n\n\
    HTML code and user interactions.\n\nFrameworks for testing JavaScript code provide\
    \ us with tools to \n\naddress this gap. Now we can start modularizing our visualized\
    \ HTML \n\ncode, as well as modeling user interactions, such as filling out forms\
    \ \n\nand clicking a button. This additional layer of testing, combined with \n\
    \nserver – side testing, means that we have a way to unit test every layer of\
    \ \n\nour application-from server-side business logic to server-side page ren­\n\
    \ndering, all the way down to user interaction. This ability to perform unit \n\
    \ntesting of user interactions with the client side of the interface is one of\
    \ \n\nthe most powerful aspects of any MV\\*JavaScript framework. In fact, it\
    \ \n\nmay even affect the architectural decisions you make when choosing a \n\n\
    technology stack.\n\nMODULE, INTEGRATION, AND ACCEPTANCE TESTINGS\n\nAutomated\
    \ testing can be divided into three main areas, or types of test­\n\ning: module\
    \ testing, integration testing, and acceptance testing. You can \n\nalso describe\
    \ these testing as testing from the “black box” or from the \n\n“white box.” White-box\
    \ testings are those in which the internal logic or \n\nstructure of the code\
    \ under testing is known to the tester. Black-box test­\n\nings, on the other\
    \ hand, are those in which the internal design and/or logic \n\nis unknown to\
    \ the tester.\n\nModule Testings\n\nA module testing is usually a white-box testing\
    \ in which all the external \n\ninterfaces of a code block are mocked or muted.\
    \ If we are testing some"
