  md: "Modules and Namespaces    ◾   ** 111**\n\nNow we can specify / / / <reference>\
    \ node.d.ts and load modules using \n\nimport url = require (“url”);.\n\n*///\
    \ <reference path=\"node.d.ts\">*\n\n*import \\* as URL from \"url\";*\n\n*let\
    \ myUrl = URL.parse(\"**http://www.typescriptlang.*\n\n*org**\");*\n\n*</reference>*\n\
    \nAbbreviated External Module Declaration Entry\n\nIf you don’t want to spend\
