  md: "**74**    ◾    TypeScript for Beginners\n\n*this* Keyword\n\nLearning how to\
    \ use *this* keyword correctly in JavaScript is something of a \n\nrite of passage\
    \ for developers. Since TS is a superset of JavaScript, TS pro­\n\ngrammers also\
    \ need to understand how to use *this* and how to notice when \n\nthis is used\
    \ incorrectly. Fortunately, TS allows you to detect the incorrect \n\nuse of *this*\
    \ with a few tricks.\n\nAs a rule, an object method needs access to the information\
    \ stored in \n\nthe object in order to perform any actions with it (in accordance\
    \ with the \n\npurpose of the method).\n\nFor example, the code inside *user.\
    \ SayHi()* may need the user name \n\nthat is stored in the *user* object. To\
    \ access information inside an object, a \n\nmethod can use the *this* keyword.\
    \ The value of this is the “before the dot” \n\nobject that was used to call the\
    \ method.\n\n*let user = {*\n\n*name: \"John\",*\n\n*age: 30,*\n\n*SayHi() {*\n\
    \n*// this is the \" current object\"*\n\n*alert(this.name);*\n\n*}*\n\n*};*\n\
    \n*user.SayHi (); / / John*\n\nHere, during the execution of the *user.SayHi ()*\
    \ code, the value of this will \n\nbe user (a reference to the user object).\n\
    \nTechnically, it is also possible to access an object without the *this* key­\n\
    \nword by referring to it through an external variable (which stores a refer­\n\
    \nence to this object):\n\n*let user = {*\n\n*name: \"John\",*\n\n*age: 30,*\n\
    \n*SayHi() {*\n\n*alert(user.name); / / use the \"user\" variable instead *\n\n\
    *of the \"this\" keyword\"*\n\n*}*\n\n*};*"
  merge: -1
