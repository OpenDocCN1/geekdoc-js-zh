  md: "Modules and Namespaces    ◾   ** 117**\n\n*<body>*\n\n *<h1>TypeScript Modules</h1>*\n\
    \n *<div id=\"content\"></div>*\n\n *<script src=\"**https://cdnjs.cloudflare.com/ajax/*\n\
    \n*libs/systemjs/0.21.0/system.js\"></script**\\>*\n\n *<script>*\n\n *SystemJS.config({*\n\
    \n *baseURL: \"app\",*\n\n *packages: {*\n\n *\"/\": { defaultExtension: \"js\"\
    \ }*\n\n *}*\n\n *});*\n\n *System.import(\"app.js\");*\n\n *</script>*\n\n*</body>*\n\
    \n*</html>*\n\nFirst of all, SystemJS is loaded from the CDN at the bottom of\
    \ the page. \n\nNext, the bootloader is configured using the SystemJS.config ()\
    \ function, so \n\nthat it uses our files. First of all, using the baseUrl: “app”\
    \ parameter, that files \n\nwill be located in the app folder (where we currently\
    \ have typescript files).\n\nSince in the end we will compile TypeScript files\
    \ in JavaScript (since \n\nonly JavaScript is supported by the browser), then\
    \ in this case we will only \n\nwork with js files. To do this, we define the\
    \ packages: {“/”: {defaultExten­\n\nsion: “js”}} parameter. “defaultExtension”\
    \ indicates the extension that will \n\nbe added to the modules.\n\nAfter that,\
    \ the main application file is imported - in our case app.js (to \n\nwhich app.ts\
    \ is compiled): System. import(“app.js”).\n\nModule Resolution\n\nModule resolution\
    \ is the process used by the compiler to find out what the \n\nimport command\
    \ refers to. Consider the following statement: import {a} \n\nfrom “ModuleA.”\
    \ To check the correctness of the use of a, the compiler \n\nmust know exactly\
    \ what this element is, for which it is necessary to check \n\nthe corresponding\
    \ definition-ModuleA.\n\n*Relative and Nonrelative Module Imports*\n\nModule import\
    \ is allowed in different ways, depending on whether the \n\nreference is relative\
    \ or nonrelative."
