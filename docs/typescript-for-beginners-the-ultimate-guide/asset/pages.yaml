  md: "**38**    ◾    TypeScript for Beginners\n\nIn the last line of the example,\
    \ you can see that even assigning \n\nReadonlyArray to a regular array is not\
    \ allowed. However, this restriction \n\ncan still be circumvented by using typecasting:\n\
    \n*a = ro as number\\[\\];*\n\nThe easiest way to remember when to use readonly\
    \ and when to use const \n\nis to ask whether this feature is needed for a variable\
    \ or for an object \n\nproperty. With variables, const is used, and with properties,\
    \ readonly is \n\nused.\n\n*Checks for Extra Properties*\n\nIn our first example\
    \ of using interfaces, TS allowed us to pass {size: num­\n\nber; label: string;}\
    \ where only {label: string;} was expected. We also learned \n\nabout optional\
    \ properties, and how they can be useful when passing argu­\n\nments to functions.\n\
    \nHowever, a mindless combination of these two features would allow \n\nyou to\
    \ shoot yourself in the foot just like in JS. For example, if you take the \n\n\
    last example with createSquare:\n\n*interface SquareConfig {*\n\n *color?: string;*\n\
    \n *width?: number;*\n\n*}*\n\n \n\n*function createSquare(config: SquareConfig):\
    \ { color: *\n\n*string; area: number } {*\n\n *// ...*\n\n*}*\n\n \n\n*let mySquare\
    \ = createSquare({ colour: \"red\", width: *\n\n*100 });*\n\nNote that the argument\
    \ passed to createSquare is written as colour instead \n\nof color. In pure JS,\
    \ such things do not give errors, but they also do not \n\nwork as the developer\
    \ would like.\n\nWe can say that this program is correct from the point of view\
    \ of types, \n\nsince the types of the width properties are compatible, there\
    \ is no color, \n\nand the presence of an additional color property does not matter."
