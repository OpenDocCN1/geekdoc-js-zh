  md: "**62**    ◾    TypeScript for Beginners\n\n*class Greeter {*\n\n *greeting:\
    \ string;*\n\n *constructor(message: string) {*\n\n *this.greeting = message;*\n\
    \n *}*\n\n *greet() {*\n\n *return \"Hello, \" + this.greeting;*\n\n *}*\n\n*}*\n\
    \n*let greeter: Greeter;*\n\n*greeter = new Greeter(\"world\");*\n\n*console.log(greeter.greet());*\n\
    \nIn this case, when we say let greeter: Greeter, we use Greeter as the type of\
    \ \n\ninstances of the Greeter class. This is almost a habit of programmers from\
    \ \n\nother object-oriented programming languages.\n\nWe also create another value,\
    \ which is called a constructor function. \n\nThis function is called when we\
    \ create instances of the class using new. To \n\nsee how this looks in practice,\
    \ let’s look at the JavaScript code generated by \n\nthe compiler from the example\
    \ above:\n\n*let Greeter = (function () {*\n\n *function Greeter(message) {*\n\
    \n *this.greeting = message;*\n\n *}*\n\n *Greeter.prototype.greet = function\
    \ () {*\n\n *return \"Hello, \" + this.greeting;*\n\n *};*\n\n *return Greeter;*\n\
    \n*})();*\n\n*let greeter;*\n\n*greeter = new Greeter(\"world\");*\n\n*console.log(greeter.greet());*\n\
    \nHere let Greeter is assigned a constructor function. When we specify new \n\n\
    and run this function, we get an instance of the class. The constructor \n\nfunction\
    \ also contains all the static members of the class. Another way to \n\nthink\
    \ about each class is: there is an instance part and a static part.\n\nLet’s change\
    \ the code a bit to show this difference:\n\n*class Greeter {*\n\n *static standardGreeting\
    \ = \"Hello, there\";*"
