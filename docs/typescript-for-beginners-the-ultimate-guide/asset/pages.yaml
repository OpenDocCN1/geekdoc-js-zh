    \ \n\ndoes not perform a local import and does not create a local variable.\n\n\
    ***ParseIntBasedZipCodeValidator.ts***\n\n*export class ParseIntBasedZipCodeValidator\
    \ {*\n\n *isAcceptable(s: string) {*\n\n *return s.length === 5 && parseInt(s).*\n\
    \n*toString() === s;*\n\n *}*\n\n*}*\n\n*// Exports the original validator by\
    \ renaming it*\n\n*export {ZipCodeValidator as *\n\n*RegExpBasedZipCodeValidator}\
    \ from \"./*\n\n*ZipCodeValidator\";*\n\nWhen using a module as a wrapper over\
    \ one or more other modules, it is \n\npossible to reexport all their export statements\
    \ at once using the export \\* \n\nfrom “module” construct.\n\n***AllValidators.ts***\n\
    \n*export \\* from \". / StringValidator\"; / / exports the *\n\n*’StringValidator’\
    \ interface*\n\n*export \\* from \"./LettersOnlyValidator\"; / / exports *\n\n\
    *the ’LettersOnlyValidator’ class*"
