  md: "**16**    ◾    TypeScript for Beginners\n\nwant to disable type checking and\
    \ allow the values to pass validation at \n\ncompile time. To do this, you need\
    \ to use the any type:\n\n*let’s not be sure: any = 4;*\n\n*notSure = \" maybe\
    \ a string instead\";*\n\n*notSure = false; / / ok, this is definitely boolean*\n\
    \nThe any type is a powerful way to work with existing JS, which allows \n\nyou\
    \ to gradually include more and more type checks at compile time. You \n\ncan\
    \ expect Object to play the same role as it does in other languages. But \n\n\
    variables of the Object type only allow you to assign them any value. You \n\n\
    can’t call undeclared methods from them, even those that may exist at the \n\n\
    execution stage of the program:\n\n*let looselyTyped: any = 4;*\n\n*// OK, ifItExists\
    \ might exist at runtime*\n\n*looselyTyped.ifItExists();*\n\n*// OK, toFixed exists\
    \ (but the compiler doesn’t check)*\n\n*looselyTyped.toFixed();*\n\n*let strictlyTyped:\
    \ unknown = 4;*\n\n*strictlyTyped.toFixed();*\n\nThe any type can also be useful\
    \ if you know some part of the variable type, \n\nbut not all of it. For example,\
    \ you can have an array with elements of dif­\n\nferent types:\n\n*let list: any\\\
    [\\] = \\[1, true, \"free\"\\];*\n\n \n\n*list\\[1\\] = 100;*\n\n*Void*\n\nVoid\
    \ is the opposite of Any: the absence of any types. It is most often used \n\n\
    as the return type of functions that do not return any value.\n\n*function warnUser():\
    \ void {*\n\n *alert(\"This is my warning message\");*\n\n*}*\n\nDeclaring variables\
    \ with the void type is useless, because you can only \n\nassign them undefined\
    \ or null values:\n\n*let unusable: void = undefined;*"
