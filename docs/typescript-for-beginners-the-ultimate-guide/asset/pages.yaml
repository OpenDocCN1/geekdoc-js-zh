  md: "**151**\n\nDOI: 10.1201/9781003203728-5\n\nC h a p t e r 5\n\nTypeScript Architecture\n\
    \nAs we know, TypeScript was created by Microsoft to facilitate the creation \n\
    \nof large-scale JavaScript applications. Some TypeScript features, such as \n\
    \nmodules or classes, can make it easier to build large applications, but this\
    \ \n\nis not enough. We need a strong application architecture if we want to be\
    \ \n\nsuccessful in the long run. In this chapter, we will look at all the aspects\
    \ \n\nyou need to create an application.\n\nWHAT IS AN APPLICATION ARCHITECTURE?\n\
    \nAn application architecture is a set of methods and patterns that help \n\n\
    developers create structured applications. Architecture is, first of all, a \n\
    \nglobal thing. Its understanding is necessary not in the context of a spe­\n\n\
    cific programming language. You need to understand the key ideas in gen­\n\neral\
    \ to understand how the benefits of using a particular architecture are \n\nachieved.\n\
    \nWHY DO WE NEED ARCHITECTURE?\n\nThe architecture is needed to save time during\
    \ the development process, \n\nmaintain the testability and extensibility of the\
    \ system over a long period \n\nof development.\n\nInitially, on building a good\
    \ and clear architecture, as a result, we get \n\nthe following advantages:\n\n\
    • It is cheaper to maintain the code (hence, less time and financial \n\ncosts)."
  merge: -1
  pgno: 167
- img_proc: true
  md: "**152**    ◾    TypeScript for Beginners\n\n• Simplify the testability of the\
    \ code (hence, you will need fewer testers \n\nand lower losses due to missed\
    \ “bugs on the prod”).\n\n• Accelerate the introduction of new developers into\
    \ the project.\n\nTo ensure the stable operation of complex web applications,\
    \ it is desirable \n\nto use technologies that will give the best performance\
    \ and speed. There \n\nare two ways to develop web applications: single-page applications\
    \ (SPA) \n\nand multi-page applications (MPA).\n\nSINGLE-PAGE APPLICATION\n\n\
    Single-page applications allow you to simulate the work of desktop appli­\n\n\
    cations. The architecture is designed in such a way that when you go to a \n\n\
    new page, only part of the content is updated. This way, there is no need to \n\
    \nre-load the same items. This is very convenient for developers and users. \n\
    \nFor SPA development, one of the most popular programming languages is \n\nused\
    \ – JavaScript. Regardless of which structure of the future web applica­\n\ntion\
    \ you choose, pay attention to the graphics and user interface.\n\nMain advantages\
    \ of SPA:\n\n• ** Performance:** Since SPA does not update the entire page but\
    \ only the \n\nnecessary part, this significantly increases the speed of work.\n\
    \n• ** High speed of development:** Readymade libraries and frameworks \n\nprovide\
    \ powerful tools for developing web applications. Backend \n\nand frontend developers\
    \ can work on the project in parallel. Thanks \n\nto a clear separation, they\
    \ will not interfere with each other.\n\n• ** Mobile apps:** SPA makes it easy\
    \ to develop a mobile application \n\nbased on readymade code.\n\nMULTI-PAGE ARCHITECTURE\n\
    \nMulti-page applications have a more classic architecture. Each page sends \n\
    \na request to the server and completely updates all the data, even if the data\
    \ \n\nis small. Thus, performance is wasted on displaying the same elements. \n\
    \nAccordingly, this affects the speed and performance.\n\nMany developers use\
    \ JavaScript to increase speed and reduce load. A \n\ngood example is updating\
    \ products without reloading the page, when \n\nusing filters in an online store.\
    \ This is much more convenient and, most"
  merge: -1
  pgno: 168
- img_proc: true
  md: "TypeScript Architecture    ◾   ** 153**\n\nimportantly, faster. The main advantages\
    \ of Multi-Page Application \n\n(MPA) are\n\n• ** Easy SEO optimization:** The\
    \ MPA architecture makes it quite easy \n\nto optimize each page for search engines.\n\
    \n• ** Easy development:** Typically, developing a multi-page application \n\n\
    requires a smaller stack of technologies.\n\n• ** Lots of solutions**.\n\nEach\
    \ architecture has its own advantages and disadvantages and is well \n\nsuited\
    \ for a particular type of project. SPA is distinguished by its speed \n\nand\
    \ the ability to develop a mobile application based on readymade code. \n\nBut\
    \ at the same time, SPA has poor SEO optimization. Thus, this architec­\n\nture\
    \ is an excellent approach for SaaS platforms, social networks, closed \n\ncommunities,\
    \ where search engine optimization does not matter.\n\nMPA is more suitable for\
    \ creating large online stores, business sites, \n\ncatalogs, marketplaces, etc.\
    \ A well-optimized MPA has high speed and \n\nperformance, but still does not\
    \ allow you to easily develop a mobile appli­\n\ncation. MPA and SPA with the\
    \ right architecture are well suited for devel­\n\noping scalable web applications.\n\
    \nCREATING AN APPLICATION IN TYPESCRIPT\n\nAs an example, we will write a simple\
    \ function that will output messages \n\nto the console. \n\nWhat a function should\
    \ be able to do:\n\n• Output a message\n\n• Attach to the message any data that\
    \ needs to be logged in\n\n• \\[Optional\\] Add a prefix to the message to understand\
    \ which module \n\noutputs the log\n\n• \\[Optional\\] Color the message depending\
    \ on the type: log (normal \n\nmessage), info (notification), warn (warning),\
    \ error (error)\n\n*\\_log(&lt;message&gt;, &lt;arg&gt;, &lt;prefix&gt;, *\n\n\
    *&lt;type&gt;);*"
  merge: -1
  pgno: 169
- img_proc: true
  md: "**154**    ◾    TypeScript for Beginners\n\nSomething like this:\n\n*\\_log('Here\
    \ is our user id:', 123);*\n\n*\\_log('Here is our user id:', 123, 'User Profile',\
    \ *\n\n*'info');*\n\nMAKING AN APP\n\nLet’s create a new project, and in it a\
    \ file, logger.ts.\n\nAs we have already found out, \\_log will have four parameters.\
    \ Since \n\nTypeScript is a statically typed language, you need to describe the\
    \ type of \n\neach argument.\n\nmessage – type String\n\narg – data for logging,\
    \ of any type. For such cases, TypeScript has the \n\nany type.\n\nprefix – the\
    \ String type.\n\ntype – the message style. You can create logs in any way, but\
    \ for sim­\n\nplicity we will use readymade Console API methods: log, info, \n\
    \nwarn, error. To protect yourself from passing any other types, you \n\nmust\
    \ Strongly list the allowed values. To do this, create a custom \n\nConsoleMethod\
    \ data type.\n\n*type ConsoleMethod = 'log' | 'info' | 'warn' | *\n\n*'error';*\n\
    \n*function \\_log(message: string, args: any, prefix: *\n\n*string, type: ConsoleMethod\
    \ = 'log'): void {*\n\n *prefix = prefix? prefix + ': ' : '';*\n\n *message =\
    \ prefix + message;*\n\n *console\\[type\\](message, args);*\n\n*}*\n\n*// Example\
    \ of a call*\n\n*\\_log('Test logging message', 123, 'Logger', 'info');*\n\nCompile\
    \ .ts in .js. To do this, run the command in the project directory:\n\n*tsc logger.ts*\n\
    \nIf no errors occurred during compilation, the file should appear logger.js.\
    \ \n\nAt the same time, if somewhere in our application there is a log with an"
  merge: -1
  pgno: 170
- img_proc: true
  md: "TypeScript Architecture    ◾   ** 155**\n\nincorrect type, we will see a compilation\
    \ error. Let’s replace the example \n\ncall with an erroneous one:\n\n\\_*log('Test\
    \ logging message', 123, 'Logger', *\n\n*'debug');*\n\nThat is, by strongly typing\
    \ the arguments, we protected ourselves from \n\nerrors when calling our method.\
    \ If you type all the methods of the appli­\n\ncation in this way, its stability\
    \ will increase. In addition, the compiler will \n\nnot allow you to build a script\
    \ with syntax errors.\n\nCOMPILATION: WATCH MODE\n\nTo avoid running the compilation\
    \ manually each time, you can enable \n\nautomatic recompilation when files are\
    \ changed:\n\n*tsc \\*.ts –watch*\n\nMV\\* ARCHITECTURE\n\nMany tasks that would\
    \ normally be performed on the server side are per­\n\nformed on the client side\
    \ in SPAs. This has led to an increase in the size of \n\nJavaScript applications\
    \ and the need for more effective code organization.\n\nAs a result, developers\
    \ have started using some of the design patterns \n\nthat have been successfully\
    \ used in the back end over the past decade in \n\nthe interface. These include\
    \ the Model-View-Controller (MVC) design \n\npattern and some of its derived versions,\
    \ such as Model-View-ViewModel \n\n(MVVM) and Model-View-Presenter (MVP).\n\n\
    Developers around the world have started sharing some SPA frame­\n\nworks that\
    \ somehow try to implement the MVC design pattern, but don’t \n\nnecessarily Strongly\
    \ follow the MVC pattern. Most of these frameworks \n\nimplement Models and Views,\
    \ but since not all of them implement con­\n\ntrollers, we call this family of\
    \ frameworks MV\\*.\n\nMVC (MODEL VIEW CONTROLLER)\n\nThe MVC pattern (Model-View-Controller\
    \ or Model-State-Behavior) \n\ndescribes a simple way to build an application\
    \ structure that aims to sepa­\n\nrate business logic from the user interface.\
    \ As a result, the application is \n\neasier to scale, test, maintain, and of\
    \ course implement."
  merge: -1
  pgno: 171
- img_proc: true
  md: "**156**    ◾    TypeScript for Beginners\n\nMVC is an architecture with three\
    \ layers:\n\n• ** Models:** Manage the data of an application. The models will\
    \ be anemic \n\n(they will lack functionalities) since they will be referred to\
    \ the services.\n\n• ** Views:** A visual representation of the models.\n\n• **\
    \ Controllers:** Links between services and views.\n\nModel\n\nThe model in MVC\
    \ provides the data. As a rule, this is a very simple POJO \n\n(Plain Old JavaScript\
    \ Object – good old Java object), which has certain prop­\n\nerties. As an example\
    \ of a model, consider the following TypeScript class:\n\n*interface IModel {*\n\
    \n *DisplayName: string;*\n\n *Id: number;* \n\n*}*\n\n*class Model implements\
    \ IModel {*\n\n *DisplayName: string;*\n\n *Id: number;* \n\n *constructor(model\
    \ : IModel) {*\n\n *this.DisplayName = model.DisplayName;*\n\n *this.Id = model.Id;*\n\
    \n*}* \n\n *}*\n\n*let firstModel = new Model({Id: 1, DisplayName: *\n\n*’firstModel’});*\n\
    \nHere, we have defined an interface called IModel, which has the properties \n\
    \nId and DisplayName, and a class that implements this interface. We have \n\n\
    provided a simple constructor to set these properties. The last line of this \n\
    \nfragment creates an instance of this class with the desired properties. As \n\
    \nyou can see from this snippet, the Model class is a very simple POJO that \n\
    \ncontains some data.\n\nView\n\nThe view in MVC provides a visual representation\
    \ of the model. In web \n\nframeworks, this will usually be a snippet of HTML\
    \ code:\n\n*<div id=\"viewTemplate\">*\n\n *<span> {Id} </span>*\n\n *<span><h1>\
    \ {DisplayName} </h1></span>*\n\n *</div>*"
  merge: -1
  pgno: 172
- img_proc: true
  md: "TypeScript Architecture    ◾   ** 157**\n\nThere is a div tag here that contains\
    \ two span tags. The contents of the first \n\nspan tag are highlighted in bold\
    \ and will display the Id property from the \n\nmodel. The content of the second\
    \ span tag is the h1 header and displays \n\nthe DisplayName property from the\
    \ model. By separating the elements of \n\nthe user interface view from the model,\
    \ we can see that we can change the \n\nview as we like, even without using the\
    \ model code. We can apply styles to \n\neach element using CSS, or even completely\
    \ hide certain properties in the \n\nview. This separation gives us the ability\
    \ to design or modify a part of the \n\ndisplay regardless of the model.\n\nThis\
    \ design work can even be transferred to a completely separate and \n\nindependent\
    \ team with specialized skills in the field of user interface \n\ndesign. As long\
    \ as the underlying model doesn’t change, both parts of the \n\nmodel and view\
    \ will work together seamlessly.\n\nLet’s look at the following example:\n\n*class\
    \ View {*\n\n *template: string;* \n\n *constructor(\\_template: string) {*\n\n\
    \ *this.template = \\_template;*\n\n *}*\n\n *render(model: Model) {*\n\n *//\
    \ Combining the template and the view;*\n\n *}*\n\n*}*\n\nHere, we have defined\
    \ a View class that has a single template property. \n\nWhen we create this view,\
    \ we give it an HTML template that it should use. \n\nThis View class also has\
    \ a render method with a single model argument. \n\nThe render method will combine\
    \ the template and the model and return \n\nthe final HTML code.\n\nController\n\
    \nThe controller in the MVC framework does the job of coordinating the \n\ninteraction\
    \ between the model and the view. The controller usually per­\n\nforms the following\
    \ steps:\n\n• Creates an instance of the model\n\n• Creates an instance of the\
    \ view\n\n• Passes an instance of the model to the view"
  merge: -1
  pgno: 173
- img_proc: true
  md: "**158**    ◾    TypeScript for Beginners\n\n• Asks the view to visualize itself\
    \ (generate the actual HTML code \n\nbased on the values in the model)\n\n• Attaches\
    \ the resulting HTML code to the DOM tree\n\nThe controller in MVC is also responsible\
    \ for the application logic. This \n\nmeans that it can control which views are\
    \ presented, when and what to do \n\nwhen certain events occur.\n\nAs an example\
    \ of what a controller might look like, let’s look at the fol­\n\nlowing code:\n\
    \n*class Controller {*\n\n *model: Model;* \n\n *view : View;*\n\n *constructor()\
    \ {*\n\n *this.model = new Model({Id : 1, DisplayName : *\n\n*'firstModel'});*\n\
    \n *this.view = new View($('#viewTemplate') *\n\n*.html());* \n\n *}* \n\n *render()\
    \ {* \n\n *$('#domElement').html(this.view.render *\n\n*(this.model));*\n\n *}*\n\
    \n *}*\n\nHere we have defined the Controller class, which has the model and view\
    \ \n\nproperties. Then our constructor function creates an instance of the \n\n\
    Model class with certain properties and an instance of the View class. An \n\n\
    instance of the View class is created using a template that is read from \n\n\
    the viewTemplate DOM element. The Controller class also defines the \n\nrender\
    \ function, which sets the actual HTML code of the DOM element \n\nDOMElement.\
    \ This HTML code is the result of calling the render func­\n\ntion for the View\
    \ class and passing the model for rendering.¹\n\nLet’s see how the process itself\
    \ goes:\n\n![](img/8faa36406ac8cb25838c6e72a80af6df_174_0.png)\n\nThe first flowchart\
    \ shows the following steps. Step 1 leads to the controller class. Step 2 leads\
    \ to the view class from the controller class. Step 3 leads out from the view\
    \ class. The second flowchart shows the following steps. Step 4 leads to the controller\
    \ class. Step 5 leads to the model class from the controller class. Step 6 leads\
    \ to the view class from the controller class. Step 7 leads to the model class\
    \ from the view class and Step 8 leads to the view class from the model class.\
    \ Step 9 leads out from the view class. Two flowcharts show the process from controller\
    \ class to the view class. \n\n1  The image is taken from https://habr.com/en/post/151219/."
  merge: -1
  pgno: 174
- img_proc: true
  md: "TypeScript Architecture    ◾   ** 159**\n\n1\\. When a user visits a web resource,\
    \ the initialization script creates an \n\ninstance of the application and runs\
    \ it for execution.\n\n2\\. The index action of the front controller is executed,\
    \ which generates \n\na view of the main page.\n\n3\\. The view is displayed to\
    \ the user.\n\nThe first three steps are a simple chain, without using a model.\
    \ \n\nNext is the sequence where the model is involved:\n\n4\\. After the application\
    \ receives a request from the user, an instance of \n\nthe requested controller\
    \ is created and the specified action is called.\n\n5\\. This action calls the\
    \ methods of the model that modify it.\n\n6\\. The view is generated (or the view\
    \ is notified when the model is \n\nupdated).\n\n7\\. The view requests data to\
    \ be displayed.\n\n8\\. The model returns the requested data.\n\n9\\. The view\
    \ displays the results to the user.\n\nMVC FRAMEWORKS\n\nOne of the most important\
    \ moments in the history of TypeScript develop­\n\nment was when it was announced\
    \ that the Microsoft and Google teams \n\nwere working together on Angular 2.\
    \ Angular 2 was a long-awaited \n\nupdate to the popular Angular framework. But\
    \ unfortunately, this update \n\nrequired a new set of language features to make\
    \ the Angular 2 syntax \n\ncleaner and clearer. Google originally proposed a new\
    \ language called \n\nAtScript to simplify these new language features, which\
    \ were also closely \n\nrelated to the ECMAScript 6 and 7 offerings.\n\nAfter\
    \ some time of collaboration, it was announced that all the neces­\n\nsary features\
    \ of the AtScript language would be included in TypeScript \n\nand that Angular\
    \ 2 would be written in TypeScript. This meant that the \n\nvendors of the new\
    \ language features (TypeScript and Microsoft) and the \n\nconsumers of the new\
    \ language features (Angular 2 and Google) were able \n\nto agree on the requirements\
    \ and the near future of the language. From \n\nthis cooperation, it can be understood\
    \ that the TypeScript language has \n\nbeen thoroughly studied by a well-known\
    \ JavaScript development team"
  merge: -1
  pgno: 175
- img_proc: true
  md: "**160**    ◾    TypeScript for Beginners\n\nand has come a long way. However,\
    \ Angular 2 was not the first framework \n\nto adopt the TypeScript language.\
    \ Many third-party JavaScript libraries \n\nalso offer full TypeScript support.\n\
    \nUsing the MVC framework provides a number of advantages like:\n\n• Separation\
    \ of the various elements used to display information to \n\nthe user\n\n• Increased\
    \ flexibility and reuse\n\n• A single model can have several different views that\
    \ can be used at \n\ndifferent times\n\n• User interface development activities\
    \ can be undertaken by a team \n\nof specialists\n\n• Changes to the model data\
    \ can trigger events in a completely differ­\n\nent controller, and each component\
    \ does not know about the other\n\n• Views can contain other views in a nested\
    \ way, thereby improving \n\nreuse\n\n• Changes in the behavior of a component\
    \ can be made without \n\nchanging its visual representation (by changing the\
    \ controller, not \n\nthe representation)\n\n• Fast and parallel development\n\
    \n• Testability of individual components\n\nBACKBONE\n\nWe will start our research\
    \ on TypeScript frameworks by creating an \n\napplication in Backbone. While it\
    \ can be argued that Backbone is not \n\na TypeScript framework, we have already\
    \ seen how it can be used with \n\nTypeScript syntax. Backbone is also one of\
    \ the oldest frameworks. It’s \n\nsmall, light, and extremely fast. Backbone,\
    \ however, requires writing a \n\nlittle more code, compared to most frameworks,\
    \ since it is actually the \n\ngroundwork of the MVC framework.\n\nWhen working\
    \ with Backbone, you will need to call the visualization \n\nfunctions yourself,\
    \ as well as manually attach the rendered HTML code \n\nto the DOM tree. To make\
    \ development on Backbone a little easier, the \n\nMarionette framework was developed\
    \ on top of Backbone, to simplify and"
  merge: -1
  pgno: 176
- img_proc: true
  md: "TypeScript Architecture    ◾   ** 161**\n\nremove most of the code that is\
    \ being used. In fact, there are a number of \n\nframeworks that use Backbone\
    \ as the main framework and add additional \n\nconcepts that are useful when creating\
    \ web applications. Marionette is \n\nalso extremely fast, as it adds only a thin\
    \ layer of functionality on top of \n\nBackbone, while still using the basic Backbone\
    \ library.\n\nBackbone.js is a JavaScript library. It uses a RESTful JSON interface.\
    \ \n\nIt is based on the Model-View-Presenter (MVP) application design pat­\n\n\
    tern. This library is designed for developing single-page web applications. \n\
    \nIt helps to keep various parts of web applications in sync.\n\nSetting up the\
    \ environment for Backbone is quite simple and can be \n\ndone via tsc and npm\
    \ as follows. Initialize the TypeScript environment \n\nwith tsc:\n\n*tsc-init*\n\
    \nInitialize npm and install Backbone, Bootstrap, JBone, and the declara­\n\n\
    tion files for Backbone using the @types:\n\n*npm syntax init*\n\n*npm install\
    \ backbone*\n\n*npm install bootstrap*\n\n*npm install jbone*\n\n*npm install\
    \ @types/backbone*\n\nJBone is a jQuery implementation built specifically for\
    \ Backbone. It \n\nincludes all the jQuery functionality that Backbone requires,\
    \ and is sig­\n\nnificantly lighter and faster than the full jQuery library.\n\
    \nAURELIA\n\nAurelia was one of the first SPA frameworks to offer full TypeScript\
    \ inte­\n\ngration. It is a framework that uses the capabilities of ECMAScript\
    \ 6 to \n\nimprove the development experience. One of the most striking features\
    \ of \n\nAurelia is the small amount of code you need to write to get things done.\n\
    \nAurelia understands that if you are writing a standard class, you will \n\n\
    probably want to use the class properties to render the HTML code. Of \n\nall\
    \ the frameworks that we will discuss, Aurelia is the easiest to use and \n\n\
    the most intuitive. There are no hidden bugs or special workarounds. This \n\n\
    framework has gone to great lengths to simplify the TypeScript develop­\n\nment\
    \ process."
