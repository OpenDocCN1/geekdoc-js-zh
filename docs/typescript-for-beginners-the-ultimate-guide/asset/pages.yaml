  md: "Modules and Namespaces    ◾   ** 101**\n\n**// index.ts file**\n\n*import {T2}\
    \ from ’./declaration’;*\n\n*import \\* as declarations from ’./declaration’;*\n\
    \nIn addition, you can even declare a namespace using the export keyword. \n\n\
    This will limit its global scope and its use in other files will only be possible\
    \ \n\nafter explicit import.\n\n*// declaration.ts file*\n\n*export namespace\
    \ Bird {*\n\n *export class Raven {}*\n\n *export class Owl {}*\n\n*}*\n\n*//\
    \ index.ts file*\n\n*import { Bird } from ’./declaration’;*\n\n*const birdAll\
    \ = \\[Bird.Raven, Bird.Owl\\];*\n\nIt should be noted that you should export\
    \ a namespace only when it is \n\ndeclared in the body of another namespace, but\
    \ you need to get to it from \n\nthe program.\n\n*namespace NS1 {*\n\n *export\
    \ namespace NS2 {*\n\n *export class T1 {}*\n\n *}*\n\n*}*\n\nExport\n\nAny declaration\
    \ (by a variable, function, class, type alias, or interface) can \n\nbe exported\
