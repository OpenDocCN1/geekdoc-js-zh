  md: "**176**    ◾    TypeScript for Beginners\n\ncompiler has a parameter that can\
    \ switch between different versions of \n\nthe ECMAScript standard and currently\
    \ TypeScript supports ES3, ES5, \n\nand ES6.\n\nAlso, in parallel, a lot of modern\
    \ JavaScript and TypeScript frame­\n\nworks are considered – for each of them,\
    \ module and integration testing \n\nis described in detail. Some of the well-known\
    \ object-oriented methods \n\nand design patterns are described, and their real-world\
    \ implementations \n\nare presented.\n\nTypeScript brings many benefits to developer\
    \ productivity and devel­\n\noper experience. TypeScript is not unique to Angular,\
    \ other powerful fron­\n\ntend frameworks such as React are beginning to be used\
    \ with TypeScript \n\nto allow development teams to build robust, resilient, and\
    \ scalable applica­\n\ntions. JavaScript and TypeScript are constantly evolving\
    \ but do not com­\n\npete with each other. TypeScript was created to complement\
    \ and improve \n\nJavaScript, not to replace it. In the future, they may become\
    \ very similar in \n\ntheir functions, but TypeScript will remain a statically\
    \ typed alternative.\n\nIf you’re new to JavaScript, you shouldn’t grin at the\
    \ first mention of \n\nTypeScript. TypeScript was developed not just to encourage\
    \ backend \n\ndevelopers to work with the frontend, but to build on lessons learned\
    \ from \n\nother languages to provide everyone with a tool that allows you to\
    \ create \n\nreliable code.\n\nJavaScript was created to be portable and simple\
    \ – but over time, we \n\nhave seen that the language goes beyond its original\
    \ intent. Although a \n\nfew hundred, if not thousands of lines of code, could\
    \ still be supported in \n\nregular JavaScript – we all know that this is no longer\
    \ the case. JavaScript \n\ncode works everywhere and on almost every device. The\
    \ number of rows \n\nis growing exponentially, and we need a way to mentally digest\
    \ and main­\n\ntain it.\n\nIt is not difficult to learn TypeScript itself. It\
    \ is written and runs like \n\nJavaScript – with only a few tools and techniques\
    \ to help you improve the \n\ncode. In fact, you can just write TypeScript code\
    \ like JavaScript, and it will \n\nstill compile. While TypeScript may seem like\
    \ syntactic sugar, it makes \n\nour experience of maintaining and writing code\
    \ much more optimal.\n\nI hope that by the end of this book, you will be able\
    \ to create a com­\n\nprehensive, end-to-end web application that shows you how\
    \ to combine \n\nTypeScript features, design patterns, and best practices in a\
    \ real-world \n\nscenario."
