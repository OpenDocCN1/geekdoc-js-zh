  md: "Modules and Namespaces    ◾   ** 121**\n\nIt is important to note that the\
    \ compiler will not perform these trans­\n\nformations. It only uses the information\
    \ it receives to perform the process \n\nof allowing the module to be imported\
    \ into its definition file.\n\n*Base URL*\n\nThe *baseUrl* is often used in applications\
    \ that use the AMD module loader, \n\nwhere modules are dynamically “deployed”\
    \ in a single directory. The \n\nsource files of these modules can be located\
    \ in different places, but the \n\nbuild script will put them all in the same\
    \ directory.\n\nSetting *baseUrl* tells the compiler where to look for modules.\
    \ All module \n\nimport commands with nonrelative names are considered relative\
    \ *baseUrl*.\n\nThe *baseUrl* value is defined as one of:\n\n• the value of the\
    \ baseUrl command-line argument (if a relative path is \n\npassed, it is evaluated\
    \ relative to the current directory);\n\n• the value of the baseUrl property in\
    \ ‘tsconfig. json’ (if a relative path \n\nis passed, it is evaluated based on\
    \ the location of ‘tsconfig.json’).\n\nNote that setting baseUrl does not affect\
    \ the relative module import com­\n\nmands, as they are always resolved relative\
    \ to the importing files.\n\nPath Mapping\n\nSometimes the modules are not directly\
    \ under the baseUrl. For example, \n\nthe “jquery” module import command at runtime\
    \ will be converted to \n\n“node\\_modules\\\\jquery\\\\dist\\\\jquery.slim.min.js”.\
    \ Loaders use the path \n\nmapping configuration to dynamically match module names\
    \ and corre­\n\nsponding files, see the RequireJS and SystemJS documentation.\n\
    \nThe TypeScript compiler supports declaring such mappings in the \n\n“paths”\
    \ property of the tsconfig.json file. Here is an example of how you \n\ncan specify\
    \ the “paths” property for jquery.\n\n*{*\n\n *\"compilerOptions\": {*\n\n *\"\
    paths\": {*\n\n *\"jquery\": \\[\"node\\_modules/jquery/dist/*\n\n*jquery.d.ts\"\
    \\]*\n\n *}*\n\n*}*"
