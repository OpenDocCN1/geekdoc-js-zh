  md: "Key Concepts of TS    ◾   ** 83**\n\nGENERICS\n\nOne of the most important\
    \ aspects of software development is the creation \n\nof components with a well-designed\
    \ structure and API. But an equally \n\nimportant part is the ability to reuse\
    \ these components. Components that \n\ncan work with different data sets provide\
    \ developers with additional capa­\n\nbilities when designing large and complex\
    \ systems.\n\nIn languages such as Java or C#, one of the main ways to create\
    \ reusable \n\ncomponents is to use generics. Generalizations allow the component\
    \ to \n\nwork with different types of data, depending on the needs of developers.\n\
    \nExploring the World of Generics\n\nTo begin with, we will create the first function\
    \ that is traditional for \n\nacquaintance with generalizations: the identity\
    \ function. Such a function \n\nreturns exactly what was passed to it. You can\
    \ think of it the same way as \n\nthe echo command.\n\n*function identity(arg:\
    \ number): number {*\n\n *return arg;*\n\n*}*\n\nOf course, in TS, we can specify\
    \ any so that the function can be used for \n\nany data type:\n\n*function identity(arg:\
    \ any): any {*\n\n *return arg;*\n\n*}*\n\nWe can say that this function is a\
    \ generalization, since it can work with \n\nany type of data. But in this case,\
    \ we have absolutely no information about \n\nthe type of the returned value.\
    \ For example, we pass a number as an arg, \n\nbut we don’t know anything about\
    \ the specific type that the function will \n\nreturn, since it is any.\n\nWhen\
    \ using generalizations, we can explicitly specify the type of the \n\nargument\
    \ and thus, within the framework of our example, determine the \n\ntype of the\
    \ return value. To do this, we need to use a special type variable \n\nthat only\
    \ works with data types, not their values:\n\n*function identity<t>(arg: T): T\
    \ {*\n\n *return arg;*\n\n*}*\n\n*</t>*"
