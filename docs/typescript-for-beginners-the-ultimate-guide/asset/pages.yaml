  md: "TypeScript    ◾   ** 7**\n\nThe first mistake is pretty obvious. We have specified\
    \ that the test vari­\n\nable is a string, and therefore trying to assign a number\
    \ to it will cause a \n\ncompilation error. The second error is similar to the\
    \ first one and, in fact, \n\nsays that we can’t assign the function to a string.\n\
    \nThus, the TS compiler introduces strong or static typing in our JS code, \n\n\
    giving us all the advantages of a strongly typed language. Therefore, TS is \n\
    \ndescribed as an extended JS variant.\n\nTS STRUCTURE\n\nMicrosoft designed TS\
    \ with specific architectural parameters in mind, \n\nwhich allow TS to integrate\
    \ fully and easily with existing JS code, while \n\nproviding robust features\
    \ external to JS.\n\n1\\. **Providing a Type Check:** JS, being a freely typed\
    \ language, is \n\nextremely lenient about the value assigned to its variables,\
    \ and it \n\ndoes not create any structural contracts between these variables\
    \ and \n\nthe constructs that use them. Passing a number argument to a func­\n\
    \ntion that expects a string parameter does not generate errors in JS at \n\n\
    design time, but will create chaos at runtime when the function body \n\nfails\
    \ to use this argument correctly.\n\nTo avoid such problems at runtime, TS was\
    \ designed as a strongly \n\ntyped language that performs static type checking\
    \ at compile time in \n\nJS. For flexibility, the TS type-checking capability\
    \ is optional; how­\n\never, most of the key benefits of TS are related to type-checking\
    \ – this \n\nis the main reason for using TS! For example, type-checking allows\
    \ \n\nyou to use the language service layer of the language to create better \n\
    \ntools that maximize performance and reduce errors.\n\n2\\. **More Powerful Object-Oriented\
    \ Programming:** The syntactic \n\nsugar provided by TS will significantly reduce\
    \ the amount of code \n\nwhile increasing its expressiveness. TS makes writing\
    \ an object-\n\noriented code class fast. It provides us with classes, interfaces,\
    \ and \n\nmodules that allow us to properly structure code into encapsulated \n\
    \nreusable structures, making it easier to maintain and scale. Inside \n\nclasses,\
    \ you can also specify the visibility level of class properties and \n\nmethods\
    \ using the provided TS modifiers-public, private, and pro­\n\ntected. There are\
    \ many other abstractions that will make you, as a \n\ndeveloper, more productive."
  merge: -1
