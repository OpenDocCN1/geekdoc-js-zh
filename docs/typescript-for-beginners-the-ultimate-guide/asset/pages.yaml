  md: "**142**    ◾    TypeScript for Beginners\n\nMERGING DECLARATIONS\n\nTS uses\
    \ several unique principles to describe JS objects at the type level. \n\nOne\
    \ example of such a completely exclusive principle for TS is “ad merge.” \n\n\
    Understanding how this mechanism works gives you an advantage when \n\nworking\
    \ with existing JS code, and also opens the door to more complex \n\nabstraction\
    \ principles.\n\nIn this chapter, “merging declarations” means that the compiler\
    \ com­\n\nbines two separate declarations with the same name into a single defi­\n\
    \nnition. The resulting definition has properties that are common to both \n\n\
    source declarations. Not only two ads can be combined, but any number \n\nof ads\
    \ can be combined.\n\nBasic Concepts\n\nIn TS, a declaration creates entities\
    \ in at least one of three groups: \n\nnamespaces, types, or values. Namespace-creating\
    \ declarations create \n\nnamespaces that contain names that are accessible through\
    \ the dot syn­\n\ntax. The type-creating declarations create a type with the described\
    \ form \n\nthat is bound to the specified name. Finally, value-generating declarations\
    \ \n\ncreate values that are available in the generated JS code.\n\n**Declaration\
    \ Type**\n\n**Namespace**\n\n**Type**\n\n**Value**\n\nNamespace\n\nX\n\nX\n\n\
    Class\n\nX\n\nX\n\nEnumeration\n\nX\n\nX\n\nInterface\n\nX\n\nType Alias\n\nX\n\
    \nFunction\n\nX\n\nVariable\n\nX\n\nUnderstanding what is created by a particular\
    \ ad helps you understand \n\nhow the merge occurs.\n\nMerging Interfaces\n\n\
    The simplest and perhaps most commonly used type of merge is interface \n\nmerge.\
    \ At the simplest level, such a merge mechanically merges the mem­\n\nbers of\
    \ both declarations into a single interface with the same name.\n\n*interface\
    \ Box {*\n\n *height: number;*\n\n *width: number;*"
  merge: -1
