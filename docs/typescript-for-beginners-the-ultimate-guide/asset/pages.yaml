  md: "TypeScript    ◾   ** 33**\n\nimplementation of at least one method, the compiler\
    \ will throw an error. For \n\nexample, we will write a cache interface that will\
    \ be implemented by the class.\n\n*interface ICacheItem {*\n\n *mtime: number;*\n\
    \n *content: string;*\n\n*}*\n\n*interface IFileCache {*\n\n *set: (key: string,\
    \ value: ICacheItem) => void;*\n\n *get: (key: string) => ICacheItem;*\n\n*}*\n\
    \n*class FileCache implements IFileCache {*\n\n *store = new Map();*\n\n *set(key:\
    \ string, value: ICacheItem): void {*\n\n *this.store.set(key, value);*\n\n *}*\n\
    \n *get(key: string): ICacheItem {*\n\n *return this.store.get(key);*\n\n *}*\n\
    \n*}*\n\nThe above is the simplest example of implementing a class, from which\
