    \ *\n\n*isn’t seen here*\n\n *}*\n\n*}*\n\nSince haveMuscles is not exported,\
    \ it is only visible in the animalsHave­\n\nMuscles function from the same unconnected\
    \ namespace. The doAni­\n\nmalsHaveMuscles function, although included in the\
    \ combined Animal \n\nnamespace, does not see the non-exported member.\n\nMerging\
    \ Namespaces with Classes, Functions, and Enumerations\n\nNamespaces are flexible\
    \ enough to be combined with other types of dec­\n\nlarations. To do this, the\
    \ namespace declaration must be placed after the \n\ndeclaration to be merged\
    \ with. The resulting ad will have the properties \n\nof both source ads. This\
    \ feature is used in TS to model a number of tech­\n\nniques from JS and other\
    \ programming languages.\n\n*Merging Namespaces with Classes*\n\nThis allows you\
    \ to describe nested classes.\n\n*class Album {*\n\n *label: Album.AlbumLabel;*\n\
    \n*}*\n\n*namespace Album {*\n\n *export class AlbumLabel { }*\n\n*}*\n\nThe visibility\
    \ rules for the merged members are the same as those described \n\nin the “Merging\
    \ Namespaces” section, so AlbumClass must be exported \n\nto be visible in the\
    \ merged class. The final result is a class used from inside \n\nanother class.\
    \ You can also use namespaces to add static members to exist­\n\ning classes.\n\
    \nIn addition to the nested class technique, you are probably familiar \n\nwith\
    \ the practice from JS of creating a function that is then extended by"
