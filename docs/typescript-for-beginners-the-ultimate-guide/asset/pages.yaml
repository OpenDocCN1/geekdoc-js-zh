  md: "TS Runtime    ◾   ** 131**\n\nheaders, from the server that was accessed during\
    \ the build, and, of \n\ncourse, the URL itself. This is actually the repository\
    \ of your depen­\n\ndencies, where Deno will first turn during the launch of your\
    \ project. \n\nThey can also be reloaded if necessary by adding the-r flag to\
    \ the \n\nDeno run command. For those who are worried about lock files and \n\n\
    cross-dependencies, this will be described in detail in the section \n\n“Deno\
    \ functionality.”\n\n• ** gen:** Your js-compiled TS files will be located here.\
    \ This, as you prob­\n\nably already understand, provides a quick start of the\
    \ application \n\nafter the first build.\n\nCompiled projects will be located\
    \ here too. For example, at the \n\npath gen/file/C/dev/my\\_first\\_project\n\
    \n• ** deno\\_history.txt:** This file contains a short-term history of entering\
    \ \n\ncommands in Deno in console mode.\n\n• ** lib.deno.d.ts, lib.deno\\_runtime.d.ts:**\
    \ This file contains the typings \n\nof Deno core itself. You will need to know\
    \ about them when you try \n\nto play with different versions of Deno.\n\n*Internal\
    \ Part*\n\n• ** The TS layer:** Is treated as unprivileged, which has no access\
    \ to the \n\nfile system or network (since they run in V8, which is a “sandbox”).\
    \ \n\nThis is only possible by passing messages to the Rust backend, which \n\n\
    is “privileged.” Therefore, many Deno APIs (especially filesystem \n\ncalls) are\
    \ implemented on the TS side as purely creating buffers for \n\ndata, sending\
    \ it to the Rust backend via the Rusty V8 middleware, \n\nand waiting (synchronously\
    \ and asynchronously) for the result to be \n\nsent back. The functions Deno.\
    \ core. send (), Deno. core. recv() do \n\njust that.\n\n• ** Rusty V8:** Is a\
    \ thin layer between the TS interface and the Rust \n\nbackend, serving to interact\
    \ with V8 and provide only the necessary \n\nbindings. It is also used to launch\
    \ V8 platforms and create/load a V8 \n\nsnapshot. More information about V8 snapshots\
    \ can be found on \n\nthe V8 blog https://v8.dev/blog/custom-startup-snapshots.\
    \ It’s worth \n\nnoting that the snapshot for Deno also contains a TS compiler.\
    \ This \n\nallows you to significantly reduce the startup time of the compiler."
