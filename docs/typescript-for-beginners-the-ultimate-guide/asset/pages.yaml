  md: "**162**    ◾    TypeScript for Beginners\n\nThe easiest way to set up a development\
    \ environment is to use the \n\nAurelia command-line interface aurelia-cli, which\
    \ can be installed as \n\nfollows:\n\n*npm install aurelia-cli -g*\n\nAfter installation,\
    \ you can call it to create a new project:\n\n*au new*\n\nYou will be asked a\
    \ simple set of questions, starting with the name of the \n\nbase catalog you\
    \ would like to use. The next question is whether to use \n\nESNext or TypeScript\
    \ as the development language, and the last question \n\nis whether or not to\
    \ load all the project dependencies. Select TypeScript \n\nand then Yes to load\
    \ the dependencies. It will take a few minutes to set up \n\nthe default project\
    \ structure. After that, a new directory will be created \n\nbased on the project\
    \ name you selected at the beginning of the process.\n\nThe aurelia-cli program\
    \ has several options. To compile your project, \n\nenter:\n\n*au build*\n\nTo\
    \ launch the Aurelia app, enter:\n\n*au run*\n\nThis is followed by the compilation\
    \ and binding steps, and then configur­\n\ning the http server to serve the default\
    \ application on port 9000.\n\nANGULAR\n\nAngular is an open-source framework\
    \ for creating frontend web applica­\n\ntions. It is aimed at solving several\
    \ problems that a developer faces when \n\nbuilding single-page applications.\
    \ This framework simplifies applica­\n\ntion development and testing. It implements\
    \ the Model-View-Controller \n\n(MVC) and Model-View-View-Model (MVVM) approaches.\n\
    \nSince its release, its ecosystem has gone beyond imagination. Now it is \n\n\
    deservedly called the most used JS framework for developing SPA (Single-\n\nPage-Applications),\
    \ and it boasts the largest developer community.\n\nAngular 2 comes with a large\
    \ list of features that will allow you to \n\ndevelop everything from web to desktop\
    \ and mobile applications. The"
  merge: -1
  pgno: 178
- img_proc: true
  md: "TypeScript Architecture    ◾   ** 163**\n\nframework is built on typescript\
    \ from Microsoft with an eye to making \n\nJavaScript code more flexible and attractive\
    \ for large enterprises.\n\nAngular 2 is a completely rewritten Angular 1 framework\
    \ that used \n\nTypeScript as the preferred language. The naming convention adopted\
    \ \n\nby the Angular team states that Angular 1 is now called AngularJS, and \n\
    \nAngular versions 2 and higher are called Angular. Since the release of \n\n\
    Angular 2, the Angular team has released a number of major updates, \n\nand the\
    \ current version of Angular at the time of writing this chapter \n\nis Angular\
    \ 7. The examples in this book are written using Angular 7, so \n\nwherever you\
    \ see the word Angular, remember that it refers to Angular \n\nversion 7. In this\
