  md: "Key Concepts of TS    ◾   ** 55**\n\n*Readonly Modifier*\n\nYou can make properties\
    \ read-only by using the readonly keyword. Readonly \n\nproperties must be initialized\
    \ when they are declared or in the constructor.\n\n*Class Octopus {*\n\n *readonly\
    \ name: string;*\n\n *readonly numberOfLegs: number = 8;*\n\n *constructor (theName:\
    \ string) {*\n\n *this.name = theName;*\n\n *}*\n\n*}*\n\n*let dad = new Octopus(\"\
    Man with the 8 strong legs\");*\n\n*dad.name = \"Man with the 3-piece suit\";\
    \ // error! name *\n\n*is readonly.*\n\n*Type Iterator Modifier*\n\nBy using the\
    \ optional + sign along with the *type modifiers*, we can cre­\n\nate more explicit\
    \ and readable type declarations. We can also use the - \n\n(minus) sign to remove\
    \ optional declarations from the? properties.\n\nFor example: we have an interface;\
    \ we can use type iterator modifiers to \n\nmake all its properties available\
    \ to readonly.\n\n*interface ICar {*\n\n *name: string;*\n\n *age: number;*\n\n\
    *}*\n\n*type ReadonlyCar = {*\n\n *readonly \\[K in keyof ICar\\]: ICar\\[K\\\
    ];*\n\n*};*\n\nThis type can be useful, for example, for the state of the Redux\
    \ application \n\nbecause the state must be immutable.\n\nWe should not be able\
    \ to change any of its properties once the object has \n\nbeen created. Type iterator\
    \ modifiers have become a great addition to the \n\nlanguage, as they make it\
    \ easy to extend existing types and apply massive \n\nchanges to all their properties.\n\
    \nNow, if we declare two models of the car machine: the first object is \n\nmutable,\
    \ the other is readonly; then try to change their data, we will notice \n\nthat\
    \ in the second case we will have an error.\n\n*const car: ICar = {*\n\n *name:\
    \ \"Mercedes\",*"
  merge: -1
