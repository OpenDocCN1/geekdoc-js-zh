  md: "TypeScript    ◾   ** 5**\n\nTS AS COMPARED TO JS\n\nWhat Is JS?\n\nJS was introduced\
    \ in 1995 as a loosely typed scripting language devel­\n\noped by Netscape to\
    \ add more dynamics to HTML pages. But the web \n\nhas changed a lot since then.\
    \ What were simple pages with a single form \n\nin 1995 are now large and complex\
    \ web applications. JS was not origi­\n\nnally designed for developing complex\
    \ enterprise applications. Currently, \n\nmost browsers support the ECMAScript\
    \ 5 standard. That is, usually when \n\nsomeone says “JavaScript,” he means the\
    \ language of the ES5 standard, \n\nalthough ES5 is not the latest version of\
    \ the standard. In 2015, the 6 stan­\n\ndard ES6 was introduced, in 2016 — ES7\
    \ or ES 2016. But not all browsers \n\nfully support the new features.\n\nThe\
    \ incompatibility problem can be solved by using transpilers such as \n\nBabel\
    \ or using the TS language.\n\nTS Strengths\n\nThe main argument in favor of TS\
    \ is strict static typing. So, what is the \n\ndifference between static and dynamic\
    \ typing? When using static typing, \n\nless documentation is required, in fact\
    \ your code has better documenta­\n\ntion. For most of the code, it is very useful\
    \ that the types of arguments and \n\nresults of the function execution are documented,\
    \ always knowing exactly \n\nwhat to expect at the input and output.\n\nMoreover,\
    \ when you look at your old JS code, many nuances are not \n\nclear, you need\
    \ to study the call chain in detail to understand what type \n\nof result will\
    \ be returned in a certain function. Of course, you can use \n\nJSDoc, which allows\
    \ you to write inline documentation, but it needs to be \n\nconstantly updated.\
    \ When using TS, you only have one source of truth.\n\nAlso, the advantage of\
    \ static typing is the possibility of autocompletion \n\nin code editors. Writing\
    \ code becomes easier, because you don’t have to \n\nconstantly go through the\
    \ documentation and look for the name of the \n\nmethod you need.\n\nAlso, refactoring\
    \ becomes less painful, as the compiler will tell you if \n\nsomething is broken,\
    \ which will avoid runtime errors. But still there are a \n\ncouple of drawbacks\
    \ you need more time to learn and write code at the ini­\n\ntial stages, an additional\
    \ layer of complexity appears, freedom of thought \n\nis limited, you cannot just\
    \ add a property or assign a value of another type. \n\nStrict typing does not\
    \ guarantee that there are no errors in the program."
