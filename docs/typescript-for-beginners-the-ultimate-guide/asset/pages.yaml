    \ path, function (error, data){*\n\n*if(error) { // if the file is not found*\n\
    \n*response.StatusCode = 404;*\n\n*response.end (\"Not found\");*\n\n*} more*\n\
    \n*{*\n\n*response.end(data);*\n\n*} return*\n\n;\n\n*})*\n\n*}).listen (3000,\
    \ function(){*"
