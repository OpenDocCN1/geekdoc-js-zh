    \ *\n\n*any\\[\\]) {*\n\n *baseCtors.forEach(baseCtor => {*\n\n *Object.getOwnPropertyNames(baseCtor.*\n\
    \n*prototype).forEach(name => {*\n\n *derivedCtor.prototype\\[name\\] = baseCtor.*\n\
    \n*prototype\\[name\\];*\n\n *});*\n\n *});*\n\n*}*"
