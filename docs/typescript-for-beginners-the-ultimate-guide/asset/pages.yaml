  md: "TypeScript    ◾   ** 35**\n\n*Working with Interfaces*\n\nThe easiest way to\
    \ see how interfaces work is to start with a simple example:\n\n*function printLabel(labelledObj:\
    \ { label: string }) {*\n\n *console.log(labelledObj.label);*\n\n*}*\n\n \n\n\
    *let myObj = {size: 10, label: \"Size 10 Object\"};*\n\n*printLabel(myObj);*\n\
    \nThe compiler checks the printLabel call. This function takes a single \n\nparameter,\
    \ which requires that the passed object has a property named \n\nlabel, which\
    \ would have a string type. Note that our object has other prop­\n\nerties, but\
    \ the compiler only checks that it has at least the necessary prop­\n\nerties,\
    \ and their types match the required ones. In some cases, which we \n\nwill discuss\
    \ later, TS does not behave so leniently.\n\nWe can rewrite this example, this\
    \ time using the interface to reflect the \n\nneed for a string-type label property:\n\
    \n*interface LabelledValue {*\n\n *label: string;*\n\n*}*\n\n \n\n*function printLabel(labelledObj:\
    \ LabelledValue) {*\n\n *console.log(labelledObj.label);*\n\n*}*\n\n \n\n*let\
    \ myObj = {size: 10, label: \"Size 10 Object\"};*\n\n*printLabel(myObj);*\n\n\
    The LabelledValue interface is the name that can now be used to set the \n\nrequirement\
    \ from the previous example. It still reflects the need for the \n\nobject to\
    \ have a string-type property named label. Note that it is not nec­\n\nessary\
    \ to explicitly state that the object that we pass to printLabel imple­\n\nments\
    \ this interface, as it would have to be done in other languages. In \n\nTS, only\
    \ the shape of the object matters. If the object that is passed to the \n\nfunction\
    \ meets the listed requirements, then it is considered suitable.\n\nIt is worth\
    \ noting that type checking does not require that the proper­\n\nties go in a\
    \ certain order: it is only important that the necessary properties \n\nare present\
    \ and have the appropriate type."
