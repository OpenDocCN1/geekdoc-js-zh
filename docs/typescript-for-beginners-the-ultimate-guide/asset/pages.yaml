  md: "Modules and Namespaces    ◾   ** 115**\n\nLoading Modules\n\nPast topics have\
    \ covered how to define and import modules in TypeScript. \n\nHowever, native\
    \ browsers do not yet support working with modules. \n\nMaybe this feature will\
    \ be implemented in a beautiful browser of the \n\nfuture, but at the moment you\
    \ need to use special tools to load modules, \n\nwhich are called loaders. In\
    \ this topic, we will look at loading modules \n\nusing the SystemJS loader.\n\
    \nFirst of all, it is worth noting that loading from the server is done via \n\
    \nAJAX, so such a TypeScript application must be hosted on a web server. \n\n\
    That is, we will not be able to simply throw the page into a web browser, \n\n\
    as, for example, it was in the first topics. Therefore, first of all, you need\
