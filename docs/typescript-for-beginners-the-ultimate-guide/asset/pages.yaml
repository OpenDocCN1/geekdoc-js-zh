  md: "**68**    ◾    TypeScript for Beginners\n\nAlso, the context type is used as\
    \ a candidate for the best general type. For \n\nexample:\n\n*function createZoo():\
    \ Animal\\[\\] {*\n\n *return \\[new Rhino(), new Elephant(), new Snake()\\];*\n\
    \n*}*\n\nThere are four candidates for the best overall type: Animal, Rhino, \n\
    \nElephant, and Snake. The algorithm for finding the best general type is \n\n\
    able to choose Animal from them.\n\n*Anonymous Functions*\n\nJavaScript also has\
    \ the concept of anonymous functions. These are func­\n\ntions that are defined\
    \ during the operation and do not specify a function \n\nname. Consider the JavaScript\
    \ code below:\n\n*var addVar = function(a,b) {*\n\n *return a + b;*\n\n *}*\n\n\
    *var addVarResult = addVar(2,3);* \n\n*console.log(\"addVarResult:\"\" + addVarResult);*\n\
    \nHere, we define a function that has no name and adds two values. Since \n\n\
    the function has no name, it is known as an anonymous function. This \n\nanonymous\
    \ function is then assigned to a variable named addVar. \n\nThe addVar variable\
    \ can be called as a function with two parameters, \n\nand the return value will\
    \ be the result of executing an anonymous func­\n\ntion. The output of this code\
    \ will be as follows:\n\n*addVarResult:5*\n\nLet’s now rewrite the previous anonymous\
    \ JavaScript function in TS:\n\n*var addFunction = function(a:number, b:number)\
    \ : *\n\n*number {*\n\n *return a + b;*\n\n *}*\n\n*var addFunctionResult = addFunction(2,3);*\
    \ \n\n*console.log('addFunctionResult : *\n\n*${addFunctionResult}');*"
