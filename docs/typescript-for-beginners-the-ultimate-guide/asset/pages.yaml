    \ OO hierarchy, there is a way to create \n\nclasses from reusable components\
    \ by combining simpler incomplete \n\nclasses. The idea of mix-ins or traits is\
    \ also used in languages such as Scala. \n\nThis approach has also gained some\
    \ traction in the JS user community.\n\nThe following code demonstrates the use\
