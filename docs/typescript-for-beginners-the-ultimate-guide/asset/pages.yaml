  md: "**100**    ◾    TypeScript for Beginners \n\nis indicated to the compiler using\
    \ the export keyword, which will be dis­\n\ncussed very soon.\n\n*// @info: Before\
    \ compilation*\n\n*namespace NamespaceIdentifier {*\n\n *class PrivateClassIdentifier\
    \ {}*\n\n *export class PublicClassIdentifier {}*\n\n*}*\n\n*// @info: After compilation*\n\
    \n*var NamespaceIdentifier;*\n\n*(function (NamespaceIdentifier) {*\n\n *class\
    \ PrivateClassIdentifier {}*\n\n *class PublicClassIdentifier {}*\n\n *NamespaceIdentifier.PublicClassIdentifier\
    \ = *\n\n*PublicClassIdentifier;*\n\n*})(NamespaceIdentifier || (NamespaceIdentifier\
    \ = {}));*\n\nIt’s also worth adding that namespace is a global declaration. This\
    \ literally \n\nmeans that a namespace declared as global does not need to be\
    \ exported \n\nor imported and a reference to it is available anywhere in the\
    \ program.\n\nWHAT IS MODULE?\n\nModules in TypeScript are defined using the export/import\
    \ keywords and \n\nrepresent a mechanism for defining relationships between modules.\
    \ This \n\nmechanism is internal exclusively for TypeScript and has nothing to\
    \ do \n\nwith ES2015 modules. They are otherwise identical to the ES2015 mod­\n\
    \nules, except for the default module definition (export default).\n\n**// declaration.ts\
    \ file**\n\n*export type T1 = {};*\n\n*export class T2 {}*\n\n*export class T3\
    \ {}*\n\n*export interface IT4 {}*\n\n*export function f1() {}*\n\n*export const\
    \ v1 = ’v1’;*\n\n*export let v2 = ’v2’;*\n\n*export var v3 = ’v3’;*"
