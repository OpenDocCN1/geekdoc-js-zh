  md: '# Chapter 8


    # The Experience of Carers


    # Introduction


    The demands placed on the carers of older people with dementia and the burden
    of coping with the effects of the condition is indeed high often affects all areas
    of the carer’s life. In addition, the effects of the emotional stress of coping
    with the changes in the person as the disease progresses have been well documented
    (Gilleard, 1984; Moriarty and Webb, 2000; Zarit and Zarit, 2006; Zarit and Edwards,
    2008). The differential effects of gender on caring have also been widely reported
    with research suggesting that female carers generally experience higher levels
    of stress than their male counterparts (Parker, 1990). Husbands caring for their
    wives reported lower emotional distress (Zarit and Whitlach, 1992), and lower
    subjective caregiver burden than wives caring for their husbands, even when controlling
    for coping resources and level of social support (Thompson et al.,2004). Citing
    evidence to indicate that female carers suffer greater psychiatric morbidity as
    a result of caring has led some researchers to advocate them early in the care-giving
    process as an ‘at risk’ group (Yee and Schulz, 2000). In England, it would appear
    that caring is more likely to be undertaken by females (Wanless, 2006) and as
    discussed in Chapter 4, the majority of family carers in this study were female
    caring for partners or parents. Thus, reducing the emotional distress associated
    with caring for an older person with dementia was of fundamental concern in the
    study reported here.


    This chapter reviews the efficacy of carer intervention programmes, the use of
    service interventions for older people with dementia and their carers and the
    utilisation of respite services for carers. Subsequently, the outcomes of the
    Lewisham Case Management Scheme are described with regard to: the overall needs
    of clients and carers changed; the extent to which carers were relieved of the
    tasks of caring and the time spent in this role; and how this related to the burden
    of care. It also examines the influence of the scheme on the carer’s quality of
    life, and their own perception of level strain experienced due to their caring
    role. In contrast to Chapter 7 which focused on the experiences of older people,
    this chapter examines the effect of the scheme on different members of the care
    network main carers, other carers and paid carers. Furthermore, outcomes for carers
    who lived with the older person, and carers who did not, are also examined. Thus,
    as a consequence, the findings presented in this chapter are more complex and,
    particularly in terms of carers’ quality of life, illustrate more subtle changes.'
