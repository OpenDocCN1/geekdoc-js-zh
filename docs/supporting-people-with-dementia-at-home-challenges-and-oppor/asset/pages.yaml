    Assessment was identified as one of the cornerstones in the implementation of
    community care policy in England (Cm 849, 1989). However, as summarised in Box
    2.4, and demonstrated elsewhere, of assessment procedures carried out shortly
    after implementation of the community care legislation (Caldock, 1993; 1994; Department
    of Health, 1993; Lewis and Glennerner, 1996) found that procedures and pro were
    overly complex, and generic documentation was ill-suited to identifying the needs
    of specific user groups. Indeed, research reported a good deal of variability
    in assessment tools and the capacity to generate standardised information was
    found to be low (Stewart et al., 1999). The NSFOP (Department of Health, 2001b)
    sought to address these issues with the introduction of the SAP for vulnerable
    older people (Department of Health, 2002b) by offering guidance in two areas particularly
    relevant to older people with mental health problems: greater specificity about
    the areas to be addressed in an assessment; multidisciplinary contributions to
    a complex assessment.


