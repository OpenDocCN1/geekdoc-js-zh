  md: 'of the United States in the 1980s. ‘Channeling’ was described as the process
    required to link those who need long-term community care to the appropriate services
    (Department of Health Education and Welfare, 1980). Thus, these projects sought
    to link older people with long-term care needs to appropriate community-based
    services and promote a cost-effective use of scarce resources (Davies and Challis,
    1986). The development of care management for older people is therefore inextricably
    linked to these factors and the development of community care. In the UK this
    initiative was resurrected in the 28 Care in the Community projects designed to
    help long-stay hospital residents move to community settings, initiated by central
