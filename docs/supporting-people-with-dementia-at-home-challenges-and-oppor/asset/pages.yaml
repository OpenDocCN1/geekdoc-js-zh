  md: '# Admission to Care Homes


    Dementia Severity and Placement


    Dementia may be regarded as a clinical syndrome whose core features can include
    impairment in areas of cognitive function, social or occupational functioning,
    and in the ability to perform activities of daily living (ADLs) (Eastley and Wilcock,
    2000), and which follows a typical clinical course. It has been described in terms
    different discrete stages such as pre-denementia or minimal; mild or early stage;
    moderate or middle stage; or late stage (Roth et al., 1998; Audit Commission,
    2000; Förstl, 2000; National Audit Office, 2007). However, it has also been argued
    that such a clinical model of dementia described in distinct stages may detract
    from a person-centered approach to caring (Marshall and Tibbs, 2006). Nevertheless,
    late stage or severe dementia, generalised by impairment of all cognitive and
    expressive functions, disrupted daytime patterns and inability to wash, dress,
    or care for oneself, often necessitates long-term nursing or residential care
    or high levels of community support.


    All clients in this study were assessed using the Organic Brain Score (OBS, Gurland
    et al., 1977) measures cognitive impairment, with a higher score indicating greater
    impairment. Seventy-two cent of older people in the experimental group and 76
    cent of those in the control group scored 6 or more on this measure, corresponding
    to ‘severe dementia’. The differences OBS scores of people in the experimental
    and control groups and their subsequent placement in care homes are illustrated
    in Table 7.1. Although the numbers of cases observed in each group were small,
    it appeared that clients scoring less than six on the OBS scale were admitted
    to care homes in roughly the same proportion in both groups, approximately half.
    However, those in the control group scoring 6 or more on the OBS were twice as
    likely to be admitted as those in the experimental group and 53 cent of the control
    group for those scoring 6 or 7 on the OBS were placed in care homes, and 30 cent
    of the experimental group compared with 56 cent of the control group scoring 8
    or more, were placed. For those scoring 6 or more on the OBS, there was a statistically
    significant difference between the experimental and control group with regard
    to destinational outcome (χ²=4.27, p<05). This suggests that the case management
    scheme was successful in providing care at home to older people with more severe
    cognitive impairment. Indeed, the capacity of intensive care management to provide
    care at home for older people with severe cognitive impairment has also been noted
    elsewhere (Challis et al., 2002a). Similarly, Lindesay and Murphy (1989) demonstrated
    that older people with fairly severe dementia, living alone and with no carer,
    stayed at home for longer when supported by a specialist domiciliary scheme, than
    those receiving the normal range of services.'
