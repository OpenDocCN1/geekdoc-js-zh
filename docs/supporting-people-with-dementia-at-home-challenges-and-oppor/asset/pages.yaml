  md: 'Interviews were completed with a significant proportion of older people with
    dementia, despite their level of cognitive impairment, although more detailed
    attempts to gain insights into, or observational assessment of quality of care
    were not feasible given the resources available and the setting. However, when
    an interview was attempted, on average more than eight out of ten residents were
    able to give a clear and coherent picture to the researcher, with 89 percent of
    clients in the experimental group and 84 percent in the control group completing
    a full or partial interview. This supports the findings of Mozley and colleagues
    (1999), which showed that many people with quite severe cognitive impairment were
    able to reliably comment on aspects of their satisfaction with life. A significant
    proportion of clients enjoyed the interview and many were able to express their
    feelings about the importance of their home and social network. Where the older
    person and carer were interacting together, this often gave a powerful insight
    into the nature of their relationship. The refusal by a number of older people
    with dementia to be interviewed was indicative of the difficulties in providing
    help for this group, despite their clear wish to remain at home and requirement
    for services. Overall, interviews with the older people with dementia were a rewarding
    and memorable part of the research experience. These interviews contributed significantly
    to understanding their situation and their care networks as identifying the need
    for services. The researchers often developed positive relationships with respondents,
    particularly carers, which contributed to the collection of high quality data.


    # Case Selection


    A multidimensional approach was used in the selection of older people for inclusion
    in the study. As noted previously, the service provided by the scheme focused
    primarily on people with dementia and related mental health problems. At the outset
    of the research study, it was envisaged that individuals assessed by the team
    would meet widely used criteria but there might be exceptional clients selected
    by the team for support. First, cases for the experimental group were selected
    using information from their case notes and the assessments of key workers in
    the team (Colligan et al., 1993). Second, they were assessed using the OBS (Organic
    Brain Score) of the Comprehensive Assessment and Referral Evaluation (CARE) interview
    schedule, (Gurland et al., 1977) using the accepted diagnostic cut-off of three
    or more used in research to identify the likely presence of dementia (Lindsay
    et al., 1989; Lindsay and Murphy 1989; Macdonald et al., 1982). The latter was
