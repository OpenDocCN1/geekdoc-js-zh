    # Transition from Research to Mainstream Service


    Once the pilot practice of the scheme ended, local commissioners of health and
    social care jointly agreed to maintain the LCMS. It has continued as an example
    of intensive care management with the case manager co-ordinating the delivery
    of a wide range of services. However, there have been a number of major developments
    and changes made to the service since the completion of the pilot project. A return
    visit to the service in 2004 provided the opportunity to capture some of these.
    The team in which the LCMS was located one of three multidisciplinary teams within
    the Lewisham Mental Health of Older Adults (MHOA) service, which provided assessment,
    treatment, rehabilitation and case management to people over 65 with a range of
    mental health problems and people under 65 with progressive cognitive impairment.
    The service met the recommendations of the National Service Framework for Older
    People (NSFOP) (Department of Health, 2001b) and the Audit Commission (Audit Commission,
    2000; 2002) in terms of its composition and was recognised as providing good practice
    in terms of its integration and co-location of staff (Rendell and Haw, 2001).
    Over the years, care management arrangements within the service and commitment
    to the team to integrated service provision, including multidisciplinary working,
    have provided a framework conducive to the development of integrated care to the
    individual users referred to the MHOA service. These are discussed in more detail
    below.


    # Care Management Arrangements


    In 2004 the MHOA service operated an open referral system, with general practitioners
    and local authority personnel being the principal referrers. There was a single
    integrated assessment document, used by all team members. This long established
    practice of specialist assessment within the multidisciplinary process constituted
    a specialist assessment within the SAP, with the social worker co-ordinating these
    to compile, in effect, a comprehensive assessment (Department of Health, 2002b).
    A separate carer''s assessment was undertaken if applicable (Department of Health,
    1999a) and older people and carers were involved in reviews. Following the pilot
    phase of the scheme, eligibility criteria for the case management service were
    subsequently widened from a primary diagnosis of dementia and at high risk of
    admission to a care home, to include people over 65 years of age with functional
    mental health problems such as'
