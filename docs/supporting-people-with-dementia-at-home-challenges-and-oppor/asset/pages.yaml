  md: '# Chapter 6


    # Service Development


    # Introduction


    Within the Lewisham Case Management Scheme, the variable and generally progressive
    nature of dementia led to the requirement for an additional home care service
    to provide assistance over and above that which was available from the local authority
    domiciliary care service at that time. In particular, the home care service could
    not consistently provide the intensity of support: support at lunchtime, in the
    afternoon or evening to evening with medication or putting to bed. Thus a new
    service was developed to fill the gap in service provision and provide greater
    flexibility and consistency by limiting the number of helpers assisting an individual.
    Moreover, it had the capacity to offer longer or more frequent visits throughout
    the day for company and leisure activities for the older person with dementia,
    taking them out of their homes as part of the care plan. As described in Chapter
    3, the paid helper service was available solely to the experimental group and
    in receipt of case management, and was designed to complement the home care service,
    as outlined in Chapter 5. Retrospectively, it could be construed as providing
    elements to inform a service specification for specialist home care for older
    people with mental health problems, and an infrastructure to support older people
    in their homes under the auspices of care management arrangements (Committee of
    Public Accounts, 2008). As illustrated in the previous chapter, and as subsequent
    chapters will demonstrate, the paid helper service played an important role in
    the positive outcomes for older people and their carers within the experimental
    group. Furthermore, it may be regarded as a prelude to the development of a specialist
    home care service for older people with dementia and other mental health problems.


    Service development may be judged as the activity of case management most omitted
    and frequently referred to only by implication in the literature. It can be conceived
    of at three levels. The first is at the individual level, the purpose of which
    is to ensure that services are individually tailored to meet the assessed needs
    of the individual, arguably a prerequisite for the provision of flexible services
    as outlined in current policy guidance (Cm 6499, 2005; Cm 6737, 2006). The second
    is the intermediate/team level, which is to ensure the development of local services
    to meet the identified needs of client groups. The third is the authority level
    which is designed to achieve an infrastructure of services within a community
    that allows people to live at home as an alternative to long-term care. The importance
    of service development at both the intermediate and individual level was clearly
    demonstrated in the early case management pilot projects (Challis'
