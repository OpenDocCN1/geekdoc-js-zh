    In summary, initial assessments revealed a high level of need, typically spanning
    a number of domains, thereby reflecting the nature of dementia, its impact on
    the older people themselves and those concerned for their care. Needs of the former
    arising from their mental state were understandably paramount although these decreased
    in subsequent assessments. Conversely the needs of carers remained uniformly high
    at both the time of initial assessment and subsequent ones. However, assessments
    of severity of need suggest a reduction in those relating to both the client''s
    mental health and carer''s distress. Indeed the assessments of case managers suggested
    that overall the severity of need was reduced at second and subsequent assessments.


    # Implementing the Care Plan


    Care planning has been described as, ‘...a resource allocation process where a
    service prescription is written for a client’ (Applebaum and Austin, 1990, 22)
    and is recognised as an important function of case management. Case managers were
    responsible for negotiating a care plan, with a range of services, particularly
    home care and other services, as well as providing support from outside the agency
    if this was appropriate. This enabled the scheme to offer intensive care packages
    including both public and private sector providers and paid helpers. Thus, case
    managers took account of the current care plan for the older person, and the weekly
    diary kept in their home, which recorded the assessments collected by colleagues
    in the community mental health team for older people, and other significant events.
    These described the person''s level of company and stimulation, as well as the
    structure and organisation of their week. This was relevant some were unable to
    comment on the help they received. In addition, an understanding of the carer''s
    day and week gave a clear picture of their pattern of activity, and times of difficulty
    or risk. The data for this section were drawn from information contained in80
    review documents completed in respect of 42 clients with complete data within
    the experimental group. These contained a total of 254 care plans which detailed
    goals, interventions employed by case managers and the use of resources. Within
    the 254 care plans, there were 245 goals, 333 intervention strategies and 414
    resources specified. In this context, care plans were defined as strategies which
    case managers employed to address a particular need or goal.


