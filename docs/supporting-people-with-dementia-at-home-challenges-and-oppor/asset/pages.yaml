    # Introduction


    One of the key purposes of analysis of costs data is to determine for whom, in
    terms of individual characteristics, and in which circumstances is one type of
    intervention more cost effective than another (Challis et al., 1988). It has the
    potential to be of use in a number of ways as the development of the concept of
    personal budgets evolves (Department of Health, 2008a; 2009a). First, such an
    evaluation is relevant in the context of an increased emphasis within policy guidance
    the value of local data to inform service commissioning across the public, private
    and voluntary sectors. Indeed, recent guidance suggests local information can
    be used to establish population needs and develop the social care market (Cm 6737,
    2006). In conjunction with demographic details for a defined population, the data
    can be used to identify and estimate the costs of the components of care and support
    in respect of particular characteristics of older people and their carers. Agency
    costs provide information relating to factors which influence the cost of care,
    and allow comparisons to be between the two types of services: such as including
    accommodation, personal and specific carers costs would fulfill a similar purpose.
    In addition, the inclusion within costs of data relating to carers provide evidence
    of help offered to this group of people and permit their incorporation into the
    evaluative and strategic planning process. Second, cost data is pertinent to the
    development of an infrastructure to support personal budgets, an approach which
    seeks to combine individual characteristics and costly services, to inform the
    resource allocation process and thereby promote the equitable and transparent
    use of resources (Cm 6499, 2005; Cm 6737, 2006). Third, the data described in
    this chapter could, for example, be used in financial planning, particularly if
    used in conjunction with the concept of indicative care packages (Challis et al.,
    1997b), providing a benchmark for monitoring expenditure on care management. Finally,
    the data may be used to expand the development of local performance measures (Challis
    et al., 2006b) by, for example, identifying indicators specific for carers in
    addition to those already routinely required (HM Government, 2008).


    To examine the factors associated with variations in costs, this chapter again
    distinguishes between those individuals receiving the case management scheme and
    those receiving standard services. Information is presented relating to costs
    in two different ways. First, estimates are derived from regression equations
    predicting variations in cost. In these tables, the material is organised into
    four broad domains'
