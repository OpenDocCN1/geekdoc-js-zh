  md: '# Quality of Life Measures


    This section evaluates the effect of the LCMS in terms of its impact on the quality
    of life of carers. Carers completed a scale which measured levels of malaise,
    or lack of well-being, as part of the research study. Their quality of life was
    also measured subjectively in terms of their own description of the level of strain
    experienced, and by looking at how care burden, that the demands of caring, affected
    their lives. Over time were were measured and comparisons were made between those
    in the experimental group receiving the case management service and those in the
    control group receiving the standard service from the community mental health
    team for older people. Carers were asked to complete the Malaise Inventory (Rutter
    et al., 1970), which is a 24-item questionnaire covering areas of psychological
    and somatic health. The physical and psychological symptoms subscales of the Malaise
    Inventory were also examined. The former relates to the stress experienced by
    carers by the physical demands of caring where the latter relates to the nature
    of the carers'' responses to their role, for example feeling out of control or
    unable to relax (Nolan et al., 1990).


    In Table 8.4a, data are presented for all carers who lived apart the client; Table
    8.4b shows the data for the group of carers who lived with Table 8.4c presents
    for the group of co-resident carers. In each case, the table shows the outcomes
    for the carers of those who were still living at home at 12 months, that is, excluding
    carers of those who had died or been placed in nursing or residential homes by
    12 months. From Table 8.4a, it would appear that after 6 months, there were no
    statistically significant differences in change scores between carers in the experimental
    group and carers in the control group with regard to their level of distress experienced,
    as expressed in their Malaise Inventory scores and sub-scores. However, there
    were statistically significant differences found between Malaise Inventory total
    scores of all carers in the experimental and the control group, for changes measured
    over 12 months with the experimental group having lower scores. However there
    were no statistically significant differences between the groups in respect of
    subscale scores at either six or 12 months.


    For the group of carers who lived apart the clients, there were no statistically
    significant differences in change scores between carers in the experimental group
    and in the control group as expressed in their Malaise Inventory total scores
    or sub-scores at either six months or 12 months. These are illustrated in Table
    8.4b. Table 8.4c shows that for the group of co-resident carers who lived with
    clients, there were no apparent differences between the experimental and control
    group in their change scores at 6 months. However, there were statistically significant
