    # Early Influences


    Care management has its origins in North America (Davies and Challis, 1986; Beardshaw
    and Towell, 1990; Fisher, 1990–91). It developed as part of the move in the balance
    of care away from institutional to community-based provision (Huxley et al., 1990;
    Challis, 1992a, 1994a,b). Of particular significance in this context was the family
    of ‘Channeling Projects’ commissioned by the federal government'
