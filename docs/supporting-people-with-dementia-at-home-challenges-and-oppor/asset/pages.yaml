    that two aspects of client functioning were strongly associated with increased
    probability of placement. These were, physical health problems and shortfall in
    the meeting of needs associated with ADLs as rated by the researcher, and both
    were statistically significant (p<0.05). Two other predictors less strongly associated
    with placement in a care home were: a higher client activity score; and a higher
    score on the signs of distress and disturbing actions measured, based on Platt
    et al.’s (1980) Behaviour–Mood Disturbance Scale. These effects reflect the difficulty
    of managing the care of restless people at home. Two carer characteristics, namely,
    the age of the carer and input of carers other than the main carer, were also
    significantly associated with increased probability of placement.


    Overall, these four client characteristics combined with two carer characteristics
    could successfully predict location at two years of 84 per cent of the control
    group. The influence of carers is particularly interesting in this model in two
    respects. First, with regard to the age of the main carer, it appeared that the
    older the carer, the greater the probability of placement in a care home for the
    client. This may reflect the greater frailty of older carers who were generally
    their partner. This finding is consistent with other research (Bergmann et al.,
    1978) which found that people with dementia being cared for by an elderly spouse
    were less likely to remain in the community. However, another study (Lieberman
    and Kramer, 1991)'
