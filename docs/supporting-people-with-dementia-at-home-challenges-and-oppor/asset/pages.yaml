  md: 'Wistow, 1996; Wistow and Hardy, 1999; Wistow, 2000). In comparison with services
    available during the research study, a shortage of specialist day care in the
    locality was apparent. However, it is noteworthy that a specialist day care facility
    was developed for Afro-Caribbean elders with mental health problems, reflecting
