  md: '# Carer Interventions


    A number of studies have been undertaken that examine the provision of support
    to carers of older people with dementia, and report varying varying levels of
    success. Most of these were designed to improve the psychological well-being of
    carers by reducing anxiety (Akkerman and Ostwald, 2004); depression (Mittelman
    et al., 2004; Teri et al., 2005); or burden (Marriott et al., 2000; Ulstein et
    al., 2007). However one criticism is noted that interventions such as depression
    or burden which are not present in all carers recruited to the study, means the
    research may fail to produce significant results (Zarit and Femia, 2008). Such
    studies have also varied considerably in the content and the duration of intervention.
    In the majority, carers received information about dementia, but additional interventions
    ranged from education and training programmes (Brodaty and Gresham, 1989; Onor
    et al., 2007); therapy or self-help groups (Mohide et al., 1990; Mittelman et
    al., 2004); problem-solving (Teri et al., 2005; Ulstein et al., 2007); and counselling
    (Marriott et al., 2000; Akkerman and Ostwald, 2004; 2004; 2006; 2007). Although
    most were conducted on-site, in clinics or psychiatric units, a number were carried
    out in the carers'' own homes (Mohide et al., 1990; Teri et al., 2005; Moniz-Cook
    et al., 2008). Such variations arguably make comparisons between studies in terms
    of their efficacy a complex issue. However, it has been suggested that interventions
    which combine three techniques: information; problem-solving; and support can
    be useful resources for carers (Zarit and Zarit, 2006).


    Clearly the needs of older people and carers are intertwined and the well-being
    of the latter depends to a large extent on the practical needs of the former being
    (Levi et al., 1989; 1994; Venables et al., 2006). Nevertheless, although many
    carer intervention studies have not any direct impact upon the older person with
    dementia, some have reported significant reduction in the frequency and severity
    of behavioural problems (Marriott et al., 2000; Teri et al., 2005; Moniz-Cook
    et al., 2008) and improvements in mood and socialisation of the person with dementia
    (Onor et al., 2007). The effect of carer interventions in some has been to delay
    placement in a care home (Brodaty and Gresham, 1989; Mittelman et al., 2006).
    A selection of carer intervention studies that were of a longer duration and recruited
    larger samples of carers are summarised in Box 8.1. Variations in the interventions
    provided and the samples made comparison of these research studies difficult.
    Most importantly, carers and caregiving are tied by a good degree of heterogeneity
    (Zarit and Femia, 2008; Zarit and Edwards, 2008). However, it would appear that
    there are four pertinent observations which pertain to many carer intervention
    studies. First, the importance of using reliable and accurate measures of carers
    well-being and the types of intervention that willfully help carers. Second, the
    differential effect of an intervention upon carers and the older person with dementia
    should be considered. Third, programmes designed to reduce psychological distress
    in carers or which delay placement in long-term care may have only a limited effect
    (Zarit et al., 1999; Zarit and Leitsch,",'
