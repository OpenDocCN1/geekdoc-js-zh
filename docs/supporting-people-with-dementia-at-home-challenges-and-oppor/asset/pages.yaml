    per visit using relevant team activity records generated within the project (von
    Bendorfff et al., 1994), and including salaries, overheads (managerial and clerical),
    capital costs where appropriate. It was assumed that case managers’ time was exclusively
    dedicated to their caseload whether related to direct contact or indirect activities.
    In contrast, it was recognised a small proportion of the work of other members
    of the community mental health team was attributed to work outside of the team’s
    remit. As a consequence, for the purpose of this costing exercise, a nominal figure
    of eight per cent of members’ time was attributed to outside work and the appropriate
    adjustment was made in the calculation of costs. For residential and nursing home
    care included central overheads which incorporated an appropriate element for
    social work provision. Finally, it is relevant to note that helpers’ costs included
    central overheads and administration on top of their basic pay, which was added
    their travel costs.


    # Carers


    Two separate dimensions of costs to carers were calculated. First, the direct
    financial burden borne and reported by carers, and second, the hours they spent
    caring and the associated opportunity cost of this were assessed. These were aggregated
    to draw the total cost. Direct financial burden was based on the accounts given
    by the main carer. The main component to this was lost earnings, and opportunity
    cost of this took no account of what would have been paid in tax. It did, however,
    include a number of other components, for example, laundry, transport, telephone
    use and purchase of services where they related specifically to the needs of the
    older person. Where carers could relate but did not estimate costs, standard rates
    were derived, where appropriate, from state benefit rates.


    In addition, the costs to all carers in the care network were examined, including
    costs to the main carers, and where appropriate, other carers including partners
    of the carer, relatives and neighbours. Since the study was looking at opportunity
    cost rather than gross costing, an attempt was made to evaluate how time could
    have alternatively been used, instead of simply focusing on time spent caring.
    Therefore the costing of contribution of carers excluded the ‘normal’ time that
    for example partners would have spent together as part of a relationship. In this
    contextional costings were developed on the basis of estimates of the cost given
    to a person with dementia by their partner as a consequence of the former’s illness.
    Three levels were categorised – ‘low’ up to 28 hours per week, ‘medium’ between
    29 and 56 hours, and ‘high’ between 57 and 84 hours – for the purpose of this
    costing exercise. To define financial cost to carers an average was used, based
    on the local market rate for basic care or help'
