    i.e. the provision of services to individual users, two aspects of practice were
    integral to execute effective financial management within the pilot projects.
    These were: devolved budgeting to care managers; and expenditure limits with explicit
    unit costs for purchased services. The importance of the first of these was discussed
    in the previous section. It has long been widely accepted that explicit unit costs
    permit care managers with service users and carers to make informed choices of
    the likely costs and benefits of alternative courses of action; for example, between
    five hours home care or attendance at a day centre (Challis and Davies, 1986).
