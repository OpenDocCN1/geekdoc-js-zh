    were unaware of having been reviewed and unhappy with the process being undertaken
    by different individuals to those doing assessments. The authors suggested that
    review should be seen as a continuous process rather than as isolated events (Ware
    et al., 2003). The importance of regular systems of review has also been recognised
    in policy development (Cm 4169, 1998; Department of Health, 2002c; NICE-SCIE,
    2006), particularly in respect of older people with dementia due to their vulnerability
    and impaired ability to report any sudden changes in their circumstances (Department
    of Health, 1997a). Interestingly, the proposal for prompt and regular reviews
    has also been recommended in the equivalent guidance for local authorities and
