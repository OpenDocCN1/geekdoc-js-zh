  md: 'with care management arrangements for older people provided within the local
    authority were clarified, so that the specialist service provided for older people
    with mental health problems was part of a continuum of care management arrangements
    within the locality. This has required the development of protocols which facilitated
    decision-making as to whether care management was provided by the specialist MHOA
    service or the local authority social services department. The ‘trick'' in this
    context has been to produce guidance and working arrangements which promote integrated
    service provision rather than lines of demarcation. Such issues are, of course,
    not but policy initiatives provide an added incentive (Cm 4169, 1998; Cm 4818-I,
    2000; Department of Health, 2001b; 2002b; Cm 6737, 2006). Johri and colleagues
    (2003) identified a single point of entry as a core feature of integrated care
    for older people. The establishment of this in respect of referrals for all community
    and most inpatient assessments within the MHOA service has been a significant
    further development of integrated service provision for older people with mental
    health problems within the locality.


    Perhaps most of all, in 2004 there was evidence that assessment and care management
    arrangements within this multidisciplinary setting were continuing to evolve in
    a way that reflected the components identified as important by Johri and colleagues
    (2003): specialist assessment and case management. Within the MHOA there were
    plans to develop the procedure for greater standardisation of the process, ensuring
    consistency irrespective of the professional orientation of the team member undertaking
    it. Such an approach was consistent with the guidance of the SAP (Department of
    Health, 2002b). It offered the opportunity for NHS staff to undertake care management
    (as defined within the service) and for social workers to extend their skills
    and competence in the specialist assessments required by older people with mental
    health problems. Furthermore, the retention of a discrete case management service
    as defined in policy guidance (SSI, 1997a; Department of Health, 2002b) and a
    differentiated approach to care management which enabled assistance to certain
    older people with mental health problems and as a consequence, complex health
    and social care needs. A further development would be for the MHOA service to
    have the associated budgetary responsibility for support. In 2004 this was vested
    in the local authority but the MHOA service were able to authorise community care
    packages. The legislative framework exists to formalise this, remains a matter
    of local negotiation to find the most appropriate way to effect it. If this was
    to be achieved and a means to be found to allow social workers undertaking case
    management to have full budgetary responsibility with appropriate accountability,
    then another hallmark of integrated service provision, as identified by Johri
    and colleagues, would have been achieved by the MHOA service in Lewisham. It would
    also have met the requirements for the transparent and equitable allocation of
    finance enshrined in the personalisation agenda (Department of Health, 2008a;
    2009a).'
