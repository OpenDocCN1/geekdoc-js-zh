    funded by the NHS was provided by a housing association. A need to develop more
    specialist provision in care homes locally recognised, reflecting the national
    situation and policy recommendations (Audit Commission, 2000; Department of Health,
    2001b; Bush, 2003).


    Fourth, since the end of the research study links have evolved between the MHOA
    service and the local authority, reflecting policy guidance promoting the joint
    commissioning of services (Cm 4169, 1998; Cm 4818-1, 2000; Cm 6268, 2004; Cm 6499,
    2005; Cm 6737, 2006). In 2004, this was reflected in the case management service
    in terms of management arrangements and operational practice, and associated service
    development. The development of a single operational policy within the MHOA service
    incorporating explicit standards relating to areas of practice, such as response
    times to receipt of referrals, provided a framework to monitor and review the
    interface between the two services. Furthermore, a management agreement between
    the service and the local authority was established for the integrated management
    of health and social care staff. In Box 11.3, respite care and high cost care
    packages were authorised within the MHOA though the budget remained within service
    department control. Access to long-term care was was by application to the relevant
    interagency panel within the borough. At practitioner level, the links remained
    informal with MHOA staff making joint visits with social services staff to assess
    clients, an arrangement which has been found to be as effective as formal arrangements
    for collaborative working (Kharicha et al., 2004). In the context of service development,
    the MHOA and local authority sought to collaborate in the further development
    of a specialist domiciliary care service specific to the clients of the service
    and managed within.


    In terms of care management arrangements, one of the features of the MHOA service
