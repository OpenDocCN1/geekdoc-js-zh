    # Monitoring, Review and Case Closure


    In this section we move from consideration of needs and problems, plans and strategies
    to reviewing the effectiveness of these plans. It highlights one of the hallmarks
    of what is known as intensive care management, namely the coordination of a variety
    of related functions over time (Challis et al., 1995; Mueser et al., 1998). The
    present research incorporated an analysis of practice related to implementing
    the care plan and monitoring and review, particularly important in the context
    of a service whose key component is long-term support of people at'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'home. Indeed, Goering and colleagues (1988) noted that two year outcomes of
    quality of life were more significant than month outcomes. Moxley (1989) specified
    the various tasks of case management and described four functions of monitoring:
    ascertaining the degree to which the care plan has been implemented; whether the
    objectives of the care plan have been achieved; determining the outcome of support;
    and identifying any new client needs requiring change to the care plan. Interestingly,
    as the scheme evolved, case managers in their monitoring of the care plan focused
    on components of the process as identified by Moxley (1929).


    Case managers undertook frequent home visits as well as monitoring through the
    paid helpers. Reviews were undertaken when appropriate, and where community-based
    support was no longer viable, case managers were responsible for organising placement
    in long-term care for the older person with dementia and facilitating this process.
    Principal activities for case managers undertaking the monitoring, evaluation
    and review functions of case management were: visits to clients and carers; contact
    with paid helpers and home care staff; meetings with members of a care network,
    for example to facilitate hospital discharge; record keeping; and their own formal
    supervision which spanned the clinical and administrative aspects of case management.
    In essence, these activities focused upon the individual components of the care
    package, its effectiveness and level of needs. They are summarised in Box 5.3,
    which indicates that the major challenge for case managers was to create and sustain
    an individual care network over time. The continued involvement of case managers
    allowed for enhanced knowledge of the older person with dementia and main care;
    the smooth running of the care network; and the ability to respond to any changes
    in circumstances and needs. Close monitoring allowed them to react quickly to
    alter services as required (Applebaum and Austin, 1990). Paid helpers, who were


