  md: '# Chapter 7


    # The Experience of Older People


    # Introduction


    The research findings of the Lewisham Case Management Scheme from predominantly
    the perspective of the older person are detailed in this chapter, and in the now,
    those relating to the carer are highlighted, along with an assessment of the scheme''s
    effect on both client and carer outcomes. Together they illustrate the capacity
    of intensive case management to maintain and support older people with dementia
    as an alternative to care home admission, an objective of national policies in
    a number of countries (Carpenter et al., 2004; Wanless, 2006; Committee of Public
    Accounts, 2008). This chapter first discusses the most salient issues in admission
    to residential or nursing home care for older people and their carers. It then
    explores current developments in helping to maintain the independence of older
    people in their own homes. Subsequently, the outcomes for the clients in both
    the experimental and control groups in terms of placement in care homes over the
    two years of the study, and the predictors of placement for each of the two groups
    are reviewed. It also describes the success of the scheme in meeting needs for
    the older person with dementia and the effect of the scheme on their well-being
    and their quality of life. It will be recalled from Chapter 4, all those in the
    research study met the same inclusion criteria, however, those recruited to the
    experimental group received the specialist case management input, whilst the control
    group received standard care from statutory services.


    # Care in Residential Settings


    For a number of years concerns have been expressed about the quality of care provided
    to older people in residential and nursing homes. For example, in the USA throughout
    the 1990s programmes were implemented which focused on staff training and the
    use of problem-solving techniques to address challenging behaviours of residents
    with dementia. A number of homes introduced separate units which were tailored
    to meet their needs, sometimes involving segregation from the remainder of the
    establishment by means of locked units (Lacey, 1999). Subsequently there has been
    growth in the use of residential care/assisted living (RC/AL) facilities for older
    people who do not require medical care (Zimmermann et al., 2005). Interestingly,
    research has found that outcomes over 12 months for older people with dementia
    in terms of health, cognition, behavioural problems,'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'depression and social functioning were the same in both RC/AL facilities and
    nursing homes (Sloane et al., 2005). It has been suggested that people with dementia
    with stable medical conditions can just as well in residential or assisted living
    facilities (Sloane et al., 2005; Zarit and Zarit, 2006).


    Similar developments in quality of care for older people in care homes have been
    noted in the UK. An initial drive to improve standards and quality of care within
    the residential sector (Centre for Ageing, 1984; Department of Health/SSI, 1989)
    was extended with the publication of the Consultation Document Fit for the Future
    (Department of Health, 1999b) on National Standards for Residential and Nursing
    Homes. Further standards were developed to follow the commitment to greater consistency
    and regulation in care across England (Cm 4169, 1998) with National Minimum Care
    Standards as enshrined in the Care Standards Act of 2000. This was designed to
    shift standards to ‘focus on the key areas that most affect the quality of life
    experienced by service users, as well as physical standards’ (Cm 4169, 1998, par
    4.48). These not only address structural measures such as equipment and staffing,
    but also process measures such as health and personal care, as well as daily life
    and social activities (Department of Health, 2002g; 2003c). A study of service
    provision in care homes in England found to perform only slightly better than
    non-specialist homes (Reilly et al., 2006). Both types met standards in relation
    to person-centred care and privacy, but neither did so in relation to rehabilitation
    as activities and interaction, or support for carers. In the future, the development
    of small-scale and homely accommodation for older people with dementia is regarded
    as an important area for service development in the UK (see Woods, 2008).


    Following admission to a care home it has been suggested that residents remain
    socially isolated from their wider community and the term ‘islands of the old’
    has been coined as a metaphor for care homes (Reed, 1998). Davies (2001) described
    this in terms of residents’ lack of contact with their local community, and their
    view that they no longer have anything useful to contribute to society. Ball and
    colleagues (2000) found that a major consideration in residents’ quality of life
    was the the ‘goodness of fit’ between a resident and a care facility’s social
    and physical environment. This increased when residents and their families had
    sufficient knowledge about what the facility offered in relation to residents’
    own needs, thus emphasising the necessity for prospective residents to plan ahead,
    and facilities to provide clear information about their services, amenities and
    philosophy of care. With regard to older people with dementia, the importance
    of designing ‘homely’ surroundings which also help such residents to function
    at the highest level possible has also been stressed (Marshall, 1999).


    Most importantly, the views of older people, and older people with dementia, reflect
    a desire to remain in their own homes (Moriarty and Webb, 2000), which is particularly
    pertinent given the increased mortality and morbidity associated with admission
    to care homes in people with dementia (Cohen-Mansfield et al., 1999; Anhehenshel
    et al., 2000; Mozley et al., 2004). More generally, loss of'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# The Experience of Older People


    independence has been cited as an important reason by community-dwelling older
    people for rejecting residential care (Qureshi and Walker, 1989). Indeed, quality
    of life interviews conducted with residents of care facilities have indicated
    that residents often experience loss of valued independence and autonomy (Ball
    et al., 2000). However, some community-dwelling older people can experience social
    isolation and loneliness (Tunstall, 1996; Ellison et al., 2001; Victor et al.,
    2005) which may be alleviated following admission to a care home (Allen et al.,
    1992; Mozley et al., 2004). On the other hand, carers may experience a reduction
    in levels of burden (Wells and Jones, 1987) following their relative''s admission
    to long-term residential care although an increase in care burden following admission
    has also been reported (Tornatore and Grant, 2002). Taking account of both the
    burden experienced by carers and the wishes of older people with dementia require
    care in order to live safely, it has suggested that residential care and community
    care should be regarded as part of a continuum of care rather than polar opposites
    (McKee, 1999).


    # Supporting Older People at Home


    The value of supporting older people with dementia or cognitive impairment at
    home in preference to their admission to a care home has been demonstrated over
    a substantial period of time (Gilleard, 1984; 1992; Levin et al., 1989; Allen
    and Perkins, 1995; Andrew et al., 2000). Within a continuum of care (McKee, 1999)
    the provision of community care in the form of ''substitution services'' such
    as home care, meals-on-wheels, respite care or other services, it has been argued,
    can reduce decline in the older person and/or reduce carer burden. This can delay
    government expenditure (Gilholtz, 1990). However, there has been little or inconclusive
    evidence in both the UK and North America that provision of services at home or
    respite care necessarily prevents admission (Lieberman and Kramer, 1991; Gilhooy
    et al., 1994; Zarit et al., 1999; Gaulger et al., 2003; Arkeys et al., 2004).
    The importance of providing interventions that are both appropriate and sufficient
    in intensity in order to assist the carer in maintaining the person with dementia
    at home has also been noted (Zarit et al., 1999; Zarit and Leitsch 2001; Zarit
    and Femia, 2008).


    In England, government policy promoting the values of independence and choice
    (Cm849, 1989; Cm4169, 1998) was followed by guidance which provided that older
    people with complex mental health needs should be supported in the community using
    outreach facilities telecare and environmental technologies (Department of Health,
    2001b, 104–5). More recent policy (Cm 6737, 2006) has acknowledged that assistive
    technology (AT) offers possibilities in supporting people in their own homes.
    It has been defined as ‘any item, piece of equipment, product or system that is
    used to increase, maintain or improve the functional capabilities and independence
    of people with cognitive, physical or communication difficulties’'
  merge: -1
  pgno: 116
- img_proc: true
  md: '(Marshall, 2000). For older people with dementia, it has a variety of applications
    including smart home, telecare, and low-level technology (Cash, 2006). Telecare,
    which is a combination of equipment, monitoring and response, can be used to help
    individuals remain independent at home (Cm 6737, 2006). It includes assistance
    that is supportive – as keyless entry systems or medication reminder systems;
    preventive – such as falls predictors or occupancy monitors; and responsive –
    such as smoke detectors or gas monitors. It is important to distinguish between
    interventions that are purely rehabilitative and those whose goal is to improve
    independent living (Andersen et al., 2000), that AT is inexpensive compared with
    care staff costs, but needs to be introduced as soon as possible after diagnosis
    to encourage familiarity before cognitive skills decline too greatly (Audit Commission,
    2004).


    So what is the relationship between AT and care management? They are not mutually
    exclusive, but rather, complementary (Marshall and Tibbs, 2006). However, it does
    not have the capacity to replace the components of a care plan provided by carers;
    rather it has the potential to assist in the management of risk, often associated
    with older people with dementia in the community (Woolham, 2006). In this light,
    AT could conceivably enhance the potential of care management to enable older
    people with dementia to remain in their own homes, which more importantly, is
    their stated preference (Commission for Social Care Inspection, 2006). It is also
    relevant in terms of the cost of care for some, the cost is higher in a care home,
    which is of particular concern of the projected increase in the number of older
    people with dementia (Knapp al., 2007). Moreover, AT at alleviating care tasks
    or reducing burden in order for carers to spend more time with the person with
    dementia in their own homes may be regarded as beneficial (Baldwin, 2006). Nevertheless,
    concerns have been expressed about the use of AT in the care of older people with
    dementia in their own homes. Marshall and Tibbs (2006) suggested that a combination
    of the increasing numbers of older people with dementia living at home, a diminishing
    workforce and government policies will mean that AT may become a more routine
    part of many care plans and with the possibility that technology will replace
    individual contact. They added a cautionary note that it should not replace existing
    services, but rather supplement or support them as part of a comprehensive care
    plan. It has also been argued that more generally, less attention may be given
    to person-centered approaches, to the ethical or legal issues particularly regarding
    consent (Woolham, 2006).


    The remainder of this chapter examines the study’s outcomes, in which an intensive
    care management scheme for older people with dementia was compared to a similar
    group of people receiving statutory services alone. While the study predated the
    advent of the increasing use of AT described above, nevertheless older people
    in both the experimental and control groups benefited from devices which increased
    their safety and lessened the risk to themselves and others by the use of items
    such as smoke detectors, and medication reminder systems. Implicitly, this is
    an evaluation of the capacity of the LCMS to provide a viable alternative to care
    home admission for older people with dementia.'
