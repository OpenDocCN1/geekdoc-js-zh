    # Monitoring and Review


    Monitoring and review within case management have been described as the means
    by which changes in health status and circumstances are recorded and the components
    of the care plan adjusted as required (Hughes et al., 2005). They constitute one
    of the hallmarks of intensive care management, namely the co-ordination of a variety
    of related functions over time (Challis al., 1995). Immediately after the introduction
    of the community care reforms, in the UK focused on the initial stages of time
    spent on screening and assessment (SSI, 1993; Department of Health, 1993; Challis,
    1994c). However, it was recognised that the time and resources focused on the
    monitoring and review components of the care management process in England were
    insufficient (Department of Health, 1993; 1994a). For example, a study of care
    management arrangements in local authorities found that all of them who struggled
    with methods of monitoring and review and with issues of volume. Those who struggled
    most were those without a differentiated approach to care management (Department
    of Health, 1998). Furthermore, research has revealed that the monitoring and review
    activities were underdeveloped and highly variable both between and within authorities
    (Hardy et al., 1999; Weiner al., 2002; Department of Health, 2002d).


