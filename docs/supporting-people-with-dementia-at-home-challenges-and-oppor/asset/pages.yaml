    In the remainder of this section, organisational factors central to the development
    of care management in the UK are reviewed under three broad headings: arrangements
    for the commissioning of services designed to support vulnerable older people
    in their own homes; financial arrangements; and the development of single discipline
    and multidisciplinary specialist both within local government and spanning health
    and social care. These issues are described in general terms although, wherever
    possible, illustrations are specific to care management in the context of services
    for older people with dementia.


    # Commissioning Services


    The separation of the purchaser and provider functions within social services
    departments was a requirement placed on local authorities by central government
    part of the implementation programme for the introduction of the community care
    legislation. It was introduced as one of the means of promoting the development
    of the enabling role of the local authority in the context of social care provision
    (Cm 849, 1989). Over half of English local authorities had introduced this division
    of function prior to or during 1993 (Challis et al., 1999) and an early study
    noted a rigid interpretation of the split (Challis, 1994). On the other hand,
    consequent research suggested that the development of a purchaser/provider split
    was a slow, evolutionary process (Wistow et al., 1994; Gostick et al., 1997; Lewis
    et al., 1997). Since the care of vulnerable older people, including those with
    dementia, continues to constitute the largest component of arguably de facto work
    undertaken by local authorities, the introduction of this separation has had a
    significant impact on the delivery of services for this user group. The policy
    guidance accompanying the White Paper Caring for People (Cm 849, 1989) stressed
    that the development of the role of the authority should be at two levels in the
    organisation: at the ‘micro level’, and at the ‘macro level’, involving plans
    to meet strategic objectives (Department of Health, 1990b). In retrospect it can
    be argued that this separation of the commissioning and providing service within
    local authorities has delayed the development of specialist care management arrangements
    for older people with dementia at both levels.


    At the ‘micro level’, in advance of the introduction of the community reforms,
    it was noted that a needs-led approach ‘pre-supposes a progressive separation
    of assessment from provision’ (Department of Health, 1990b, 25), although guidance
    did not include a requirement for budgetary development to frontline workers,
    with appropriate systems for financial management and monitoring. The absence
    of this was significant in the development of care management'
