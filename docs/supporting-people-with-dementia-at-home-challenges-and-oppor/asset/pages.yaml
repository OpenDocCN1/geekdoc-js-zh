    The effects of the LCMS on admissions to long-term residential and nursing care
    were investigated by identifying which factors were most influential in enabling
    older people with dementia to remain in their own homes. Logistic regression was
    undertaken with the dependent variable being location after two years, that is,
    whether residence was in their own home or in a care home. For those who died,
    their permanent location was taken to be at the time of death. This type of analysis
    allows the prediction of a discrete outcome from a set of appropriate variables.
    The selection of these variables was based upon their relevance to the home-based
    care of older people with dementia and their carers. For example, a number of
    individual measures of functioning were used in preference to a global measure
    of cognitive impairment which, it was felt, did not use discriminate between cases.
    The variables chosen were taken from a list describing the characteristics of
    clients and carers as detailed in Box 7.1.'
