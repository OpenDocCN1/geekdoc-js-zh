  md: '# Integrated Service Provision


    The MHOA service in Lewisham in 2004 represents an example of an experimental
    case management project which has made a successful transition to mainstream service
    whilst maintaining many of its core features of care practice. Box 11.5 summarises
    the evidence for this and each of the hallmarks of integrated service provision
    is discussed in the context of the service. Community care of older people with
    dementia is a challenge to health and social care services due to the complex
    medical needs of them, their functional disabilities, and their precarious social
    support networks, which altogether contribute to inappropriate use of services
    (Bergman et al., 1997; Johri et al., 2003). Johri and colleagues reviewed major
    demonstration programmes for frail older people and noted that cost-effective
    integrated systems of care were possible, although the ability of such programmes
    to make an impact upon national expenditure and care depended upon successful
    extension from demonstration phase to implementation. They concluded that, as
    here, successful initiatives were those which largcale programmes with a single
    entry point, employing both specialist assessment and case management. They also
    highlighted the importance of integrating case managers into a multidisciplinary
    team thereby pairing specialist assessment with long-term case management.


    The longevity of case management within the service provides evidence of the incorporation
    of the research into the multidisciplinary team. However, for it to be construed
    as part of mainstream provision within the locality required that its links


    # Box 11.5 Features of integrated care for older people


    | Evidence from demonstration programmes | MHOA service 2004 |

    | --- | --- |

    | Extension of research to mainstream provision | LCMS integrated into the MHOA
    service with links defined in a protocol for care management arrangements provided
    by the local authority social services |

    | A single point of entry system | For those in the community requiring assessment
    or possible hospital admission, a single point of entry |

    | Incorporating both specialist assessment and case management | Retaining specialist
    assessment procedures and extending the number of social workers in the multidisciplinary
    team undertaking this task; confirmation of continued importance of case management
    in multidisciplinary teams |

    | Integrating case managers into the multidisciplinary team | Management of case
    managers within the team but budgetary responsibility outside of it |


    Adapted from Johri et al. (2003)'
