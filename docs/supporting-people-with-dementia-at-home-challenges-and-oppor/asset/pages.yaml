  md: 'quality of data was not ideal, due to difficulties in collecting information.
    These methodological dilemmas highlight the particular difficulties associated
    with the evaluation of research into long-term care arrangements for people with
    dementia. For example, there are methodological implications for the evaluation
    of intervention programmes for older people with dementia where high rates of
    attrition occur due to death or placement in long-term care (Zarit and Leitsch,
    2001). Observers have also noted various methodological problems (Gilhool, 1990;
    Knight et al., 1993; Levin and Moriarty, 1996) where intervention programmes are
    likely to impact differentially on older people with dementia on the one hand
    and on their carers on the other.


    The following chapter seeks to examine the case management practice of the Lewisham
    Case Management Scheme, and how it evolved during the course of the research study.
    Subsequent chapters describe: the development of the paid helper service and its
    characteristics; the outcomes of the scheme for the older people with dementia
    in both experimental and control groups and for their carers; and details of the
    costs and effectiveness of the case management scheme, illustrating some of the
    methodological dilemmas referred to above.'
