  md: '# Care and Support at Home for Older People and Their Carers 79


    to mainstream services after receiving support through the scheme. Residential
    care has often been seen as ''second best'' studies involving former carers have
    found that they were generally happy with the decision to admit their relatives
    when re-interviewed at a later date (Pushkar Gold et al., 1995; Moriarty and Webb
    1997b; 2000). In this study, on the occasions when admission to long-term care
    occurred, it was viewed as a positive choice for older people and carers alike,
    and, following placement and occasionally when a client had died, case managers
    continued giving support to the carer for a short while.


    # Summary


    A number of issues emerge from this chapter which are worthy of further comment.
    The location of the case management service within a multidisciplinary team in
    a secondary health setting critically influenced how case finding and assessment
    of needs were defined. Members of the community mental health team for older people
    routinely undertook an initial assessment of mental state and home circumstances
    within a short period of time. This allowed case managers to undertake a second,
    more detailed assessment over a longer period of time, focusing on the wider network
    of care. Arguably this was of crucial importance in facilitating their long-term
    care in the community.


    A second set of issues emerges from the process of implementing the care plan
    and its subsequent monitoring and review. With regard to the former, it is important
    to note that goals of intervention were geared to meeting the needs of the older
    person with dementia and where applicable, their carer. In this sense, the case
    management service was identifying and assessing the needs of carers in advance
    of legislative requirement. Moreover, analysis of the case management review documentation
    suggests that the service was indeed, able to provide effective help to carers.
    The analysis of the practice of the case managers in this scheme also demonstrates
    the importance of maintaining regular contact with all those involved in the care
    of older people with dementia in their own homes. It also shows that case managers
    required communication skills not only relating to individuals but in managing
    complicated communication networks. Finally and most importantly, this chapter
    illustrates that frail older people with dementia can be successfully maintained
    at home under the auspices of case management.'
