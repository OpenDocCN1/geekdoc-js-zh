    There were no clear policies for the use of the paid helper service in the LCMS
    (Challis et al., 1995). In the latter, the court workers were an integral part
    of the whole organisation, and they worked in teams to support older people. In
    the LCMS the particular needs of the individual and the availability of helpers
    governed the contribution of paid helpers. Whenever possible, case managers matched
    helpers with clients and one or two key people committed to a particular person,
    and the number of clients helped. This approach enabled them to deal more readily
    with sudden crises that occurred. However, although this deemed the ideal mode
    of working, it was recognised that it could not always occur due to the small
    numbers of paid helpers available and the multiple needs of some older people.


    There were a number of challenges confronted by case managers in the development
    and management of the paid helper service. These arose because they were required
    to offer a service to clients and discharge obligations to paid helpers for whom
    they were the representatives of their employers on a daily basis. Case managers,
    for example, had to liaise with the finance section and secretariat to clarify
    issues around income, insurance and methods of payment to the paid helpers. In
    addition, they spent time drawing up contracts and codes of practice, and a particular
    challenge was to mesh the principles and practice of the paid helper service with
    the home care service provided by the local authority social services department.
    In the longer term, case managers had to develop skills and awareness in budgeting,
    and in organising and managing a care workforce. The principal tasks for case
    managers in the management of the paid helper service were: monitoring the delivery
    and quality of the service; ensuring payment of the helpers, recruitment as and
    when necessary. Thus they were commissioners and regulators of the service at
    the strategic level, managers of it on a day to day basis and ‘purchasers’ of
    the service in respect of individual needs. As part of the latter role, they made
    joint visits to clients with paid helpers and used their detailed knowledge of
    the older person with dementia in each stage of the case management'
