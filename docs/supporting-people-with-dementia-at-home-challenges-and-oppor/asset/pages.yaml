    # Summary


    This chapter has outlined key issues in the development of care management arrangements
    in respect of older people with mental health problems, particularly older people
    with dementia. The origins of the terms have been described, together with the
    early care (case) management projects which influenced the White Paper, Caring
    for People (Cm 849, 1989) and the guidance which accompanied the enactment of
    the care reforms. Additionally, issues which arose during the initial phase of
    the implementation of these reforms, particularly the arrangements for the commissioning
    and delivery of services, financial arrangements underpinning the introduction
    of care management, and the emergence of specialist older people’s teams have
    been explored. Together, these themes are covered by a disparate literature, illustrating
    both the scale of the reforms enshrined in the community care legislation and
    the dearth of information relating to the impact of these reforms throughout.
    The development of case management practice following the implementation of the
    community care reforms has also been described, particularly in four themes: differentiation
    within care management arrangements; targeting; assessment; and monitoring and
    review. Areas of concern within each of these themes have been highlighted using
    research studies and reviews of policy documentation.


    The pilot projects cited in the White Paper, Caring for People (Cm 849, 1989),
    provide the components of a particular model of care management for older people.
    They demonstrated, in the context of intensive care management, the importance
    of continuity of care through the process; the significance of the combination
    of health and social care; and the necessity of a differentiated approach in order
    to target the service appropriately. In developing models of care management for
    older people, it is necessary to determine the relative importance of these features
    in order to meet identified needs appropriately and to develop strategies to manage
    the volume of work. Only in the second decade after the introduction of the community
    care reforms was guidance developed on how to address these important issues.
    To date, there is little documented evidence of progress towards these goals crucial
    to the development of a model of care management for vulnerable older people within
    a specialist multidisciplinary framework spanning health and social care.'
