    On balance, it is more likely that older people with dementia will receive support
    via the care management process from an old age mental health team. Nevertheless,
    at the turn of the century audit of mental health services for older people in
    England and Wales showed that specialist multidisciplinary teams for older people
    with mental health problems were only fully available in less than half the areas
    sampled (Audit Commission, 2002). Furthermore, a review of services for older
    people with dementia found that the size and availability of specialist Community
    Mental Health Teams (CMHTs) continued to be variable and only half were fully
    integrated into health and social care (National Audit Office, 2007). Whilst social
    workers, traditionally the main but not sole professional group undertaking care
    management, are recognised as core members of multidisciplinary teams (Department
    of Health, 2001b) this is not always the case (Challis et al., 2002b; Tucker et
    al., 2007; National Audit Office, 2007). Moreover, the debate about the professional
