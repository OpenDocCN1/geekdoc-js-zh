    # Service Setting


    # Introduction


    The Lewisham Case Management Scheme was designed as one of a family of case management
    studies which, within the framework of an overall model, offered variation in
    the settings in which the service was provided (Challis and Davies, 1986; Challis
    et al., 1995, 2002a). In each of these studies, case managers handled small targeted
    caseloads and controlled resources within an overall cost framework, so to permit
    the arrangement of more flexible and individualized packages of care. The aim
    of the LCMS was to develop a similar model to the earlier schemes, in a multidisciplinary
    team whose target population was older people with a diagnosis of dementia, identified
    as having unmet needs and likely to be at risk of entry to institutional care,
    despite input from statutory services. For people living at home, either on their
    own or with carers, thus supporting two different but important groups, as discussed
    earlier, remain at the centre of national policy initiatives (Committee of Public
    Accounts, 2008; Department of Health, 2008b).


    This chapter first describes the function and role of the community mental health
    team for older people within the scheme was based, and second, case management
    and domiciliary care arrangements for the scheme. Included in this for illustrative
    purposes are views on the services from the perspectives of members of the community
    mental health team for older people and social workers on their capacity to cater
    for older people with a diagnosis of dementia. These provide an insight into the
    setting in which the scheme was located at that time.


    # The Community Mental Health Team for Older People


