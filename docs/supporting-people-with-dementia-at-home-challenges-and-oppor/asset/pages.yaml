    As demonstrated in Chapter 5 (see Table 5.4), the maintenance of the care network
    was an important activity for case managers, sometimes requiring them to deal
    with conflicts between various parts of the network. This was apparent in a number
    of guises. Occasionally, there were instances when carers who wanted relief caring
    viewed helper as an intrusion, or paid helpers assisted case managers in investigating
    allegations of abuse of older people by carers. In other instances, the older
    person''s vulnerability made it difficult for them to trust new helpers and hence
    made them resistant to their introduction, or the competing needs of client and
    carer made it difficult for the paid helper to make an effective contribution
    to the care plan. Overall, the importance of the case manager''s role in maintaining
    the care network and the pivotal role of the paid helper within it was vital,
    the latter being an essential cog in the implementation of the care plan.


    # Role of Paid Helpers


    The paid helper service was both a cornerstone of service provision for older
    people and carers, and also contributed to the process of assessment, especially
    in the early stages of the scheme as noted in the previous chapter. Chapter 5
    (Table 5.5) demonstrated that paid helpers featured in 55 per of care plans developed
    by case managers in a wide variety of roles. Examination of the 80 reviews completed
    by the case managers revealed a considerable range of tasks to improve personal
    and household care and meet social needs, undertaken by paid helpers as shown
    in Table 6.2. These included a substantial amount of time in providing companionship
    for clients and carers and assisting in their personal care. Paid helpers were
    also involved with household activities, undertaking tasks on a daily basis such
    as cooking, as well as on a weekly basis, for example shopping and housework.
    Whilst most helper input was carried out in the older person''s home, it also
    escorting them, in order to encourage their attendance at a day center or hospital,
    to supervise their therapy, for example when visiting relatives. Paid helpers
    worked on average with two clients and for fourteen hours a week. Each older person
    had an average of two helpers, although this concealed quite a large variation,
    a reflection of their different needs and in the work patterns of individuals
    helpers.


    The care provided by paid helpers was characterised by its responsive and proactive
    nature. Moreover, it was available in the evening as well as during the day, and
    at short notice. As noted previously, they contributed to the assessment and monitoring
    of the client''s well-being, typically becoming involved within one week of their
    entry into the service. Sometimes they were involved in the follow-up of clients
    upon discharge from hospital. On these occasions they were given training by hospital
    staff in how to help the older person following their discharge home,'
