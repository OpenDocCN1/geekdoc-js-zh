    in relation to the Single Assessment Process (SAP), which was introduced to ensure
    that older people received ‘appropriate, effective and timely responses to their
    health and social care needs’ (Department of Health, 2001b; 2002b). It specified
    four types of assessment described in Chapter 2. One of these, the comprehensive
    assessment, was recommended as the most appropriate for older people with dementia
    since it was identified as a prerequisite for residential and nursing home placements
    and intensive community support, or where substantial packages of care at home
    are required. Completion of the CAPRE, a structured'
