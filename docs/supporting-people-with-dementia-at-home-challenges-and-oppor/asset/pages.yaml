  md: '# The Experience of Carers


    The greatest reduction in carers’ burden and psychological stress as shown by
    other studies (Levin et al., 1989, 1994; Levin and Moriarty, 1996) occurs when
    the older person is placed in long-term care. However, this study provides little
    evidence to support this, as demonstrated in Chapter 7, comparatively few clients
    moved into long-term care during the course of the study. Moreover, the researchers
    were limited in their capacity to follow these older people. Therefore, comparisons
    between the outcomes for these older people, and in particular their carers, those
    remaining in the community can only be inductive since there are insufficient
    data to support these observations. Nevertheless, it appeared that admission to
    long-term care reduced the burden and strain of carers who were relieved of the
    responsibility and concern about the meeting of basic care needs of clients. Carers
    receiving assistance from a case manager appeared less dissatisfied with the process
    of placement and case managers were seen as offering useful support to carers,
    as the person they cared for made the transition to long-term care. The evidence
    also suggested that carers of the experimental group were better able to resume
    a ‘normal’ social life when the latter were admitted to long-term care. Nevertheless,
    carer distress as measured by the Malaise Inventory, showed no significant difference
    between the carers of those in the experimental group admitted to residential
    or nursing home or remaining at home, each improving somewhat compared to carers
    in the control group.


    # Summary


    This chapter began by examining the vital role played by carers of older people
    with dementia and has reviewed the efficacy of some of the wide-ranging interventions
    undertaken to support carers, and in some cases the older people with dementia,
    and has discussed the outcomes of respite services for carers. In this study,
    the LCMS achieved a reduction in the physical burden of care experienced and an
    improvement in quality of life by reducing levels of distress. The scheme supported
    older people with dementia in their own homes, and lessened the physical burden
    of care experienced by carers and relieved them of some of the tasks of caring.
    More specifically, there was a significant reduction in the rating of older people’s
    unmet as perceived by the carers, for those supported by the case management scheme.
    In terms of support offered by carers and other members of the care network, one
    positive effect of the scheme was that after 12 months main carers and other carers
    in the experimental group were able to reduce their care contribution. These findings
    complement those the previous chapter which demonstrated that the LCMS was able
    to support older people with dementia who had correspondingly high levels of need
    with some degree of success.


    The difficulties in quality of life measures with carers have been widely reported.
    The importance of using reliable measures which have been standardised with non-carers
    has been described (George and Gwyther, 1986) and it has been recognised that
    improving carer well-being or reducing levels of carer'
  merge: -1
  pgno: 146
- img_proc: true
  md: stress may not always be a realistic outcome of intervention (Zarit et al.,
    1998; Zarit and Leitsch, 2001). It has also been acknowledged that the concepts
    of carer 'stress' or 'strain' are sometimes interchangeable or confusing (Gilleard,
    1984). Indeed, in this study, carers often did not perceive any significant change
    in their levels of strain or burden over time. The reduction in carer stress is
    a relative rather than an absolute gain. The aim was to make a larger impact than
    did existing services. Nevertheless, the impact of case management on carers'
    well-being was apparent, since it appeared that over 12 months, the case management
    scheme had most impact on co-resident carers. This can be seen both in benefiting
    carers in their difficult task and in reducing carers' potential negative reactions
    when inappropriate responses to behaviour can contribute to further deterioration
    in the person with dementia (Kitwood, 1997).
