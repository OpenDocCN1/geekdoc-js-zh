  md: '# Service Setting


    commented that services offering domiciliary care, respite day care, and residential
    care for people at home were insufficient in quality and quantity. Furthermore,
    attempts to employ local voluntary services to provide social support had been
    time-consuming and often unsuccessful. More fundamental changes in the nature
    of the domiciliary care service attempted to address these problems before the
    introduction of the LCMS and subsequently.


    Nevertheless, as the LCMS developed, both staff in the social services department
    and members of the community mental health team for older people continued to
    report difficulties in supporting people with dementia in their own homes. They
    identified a number of gaps in services which could not adequately meet the particular
    needs of these clients. For example, the domiciliary care service could not provide
    multiple visits throughout the day or through the night, nor was there flexibility
    in the time of visits. Concurrently, delays in the placements of older people
    in residential and nursing care resulted them in remaining at home with a high
    level of dependency, and very frail older people being discharged from hospital
    to their own homes were features of the LCMS referrals. The domiciliary care service
    began to focus to a greater extent on personal care rather than domestic tasks.
    The service was a source of referrals to the scheme, particularly in its pilot
    stage, and a significant part of the care network used. In respect of the evaluation
    of the scheme, domiciliary care workers were important informants as the functioning
    of older people with dementia and, in some cases, provided the only information
    of their needs.


    Studies of staff activities provide an interesting insight into the logic of care
    for case managers. Members of the team in which the LCMS was located took part
    in a diary keeping exercise carried out to investigate and discriminate between
    patterns of activities and time use within the multidisciplinary team (von Abendorff
    et al., 1994). Their working was coded into categories; client-related work; service-related
    work, for case meetings and research; About three-quarters of staff time was found
    to be spent in ''client-related'' activities, a proportion similar to that of
    other studies which have found between 64 per cent and 78 per cent of case managers
    time spent in direct or indirect client-related work (Wright et al., 1987; Fein
    and Stoff, 1991; Tibbitt and Martin, 1991; Weinberg et al., 2003). In contrast,
    such research found that case managers spent significantly less time in direct
    with clients and carers in authorities using a targeted approach to the care of
    frail people in comparison to authorities with specialist older teams (Challis
    et al., 2007). Two other studies of case managers'' use of time provide findings
    to the LCMS. First, clients who were totally dependent required less intensive
    management than those with dementia or mental illness, and paradoxically had fewer
    impairments in activities of daily living (Diwan, 1999). Second, a case management
    study which explored the relationship between the content of case managers'' work
    and client outcomes revealed that more time spent on indirect services related
    to the client was associated with positive outcomes with regard to mental health
    and social'
