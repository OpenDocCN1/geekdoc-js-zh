    the paid helper service. In each service-level agreement was drawn up based on
    lessons learnt from the pilot scheme. As the matching of the home care workers
    from the specialist team to an individual was still given special consideration
    as their role in both assisting the older person and supporting family carers.
    For both the specialist home care service and the standard service, longer hours
    of availability from 7.30 a.m. to 10.00 p.m. became the norm. Initially, it did
    not appear that the clients of the LCMS experienced any reduction in the duration
    of home care provision as a result of the changes. In fact it was noted that after
    integration of the paid helper service with the local authority domiciliary care
    service, a significant number continued to receive more than 20 hours from the
    home care each week. Paid helpers who subsequently joined the local authority
    home care service received training and access to the NVQ system. They also benefited
    from the support of a home care organiser on a day-to-day basis. Moreover, case
    managers still maintained liaison with care assistants and their organisers for
    good quality monitoring and service information in respect of older people with
    dementia and contributed to the training of the home care workers in the specialist
    team. The subsequent evolution of the paid helper service is discussed in the
    final chapter.


    # Summary


    The paid helper service was developed during the course of the research study
    as an additional service available for the experimental group. A number of points'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'of particular interest are demonstrated in the development and management of
    the paid helper service. It is an example of service development arising as a
    consequence of needs identified through the case management process, specific
    to older people with dementia which the structure and style of the traditional
    home care service could not meet. The contribution of this service was central
    to the success of case managers in maintaining people in the experimental group
    at home, providing an early example of the value of a change to the traditional
    pattern of service which achieved benefits for using it (Cm 6499, 2005; Cm 6737,
    2006). Indeed, this example of service development at the intermediate or team
    level facilitated its development at the individual level permitting the creation
    of individualized packages of care in response to client need. Over time, this
    became an authority-wide service, part of the infrastructure of support for vulnerable
    older people with mental health problems.


    It also highlighted the challenges and opportunities for case managers in undertaking
    a service development role in addition to other tasks within the case management
    process more directly concerned with the provision of care to a specific individual
    in their own home. Whilst the care managers’ responsibilities management offered
    a unique opportunity to, as far as possible, match needs with the skills and strengths
    of paid helpers. In effect, case managers were responsible for both commissioning
    and providing services within the case management process. In terms of the study,
    it was an important factor, making a significant contribution to the continuity
    of care for older people with dementia in their own homes. The outcomes of this
    study for both the older people with dementia and, where appropriate, their carers,
    are described in the next two chapters.'
