    # Summary


    The LCMS was introduced at a time when there was considerable change within the
    service network in which it was located, particularly with regard to the provision
    of domiciliary care. Furthermore, the approach of the community mental health
    team for older people, while valued by recipients, resulted in short interventions
    which left many of the particular needs of older people with dementia unmet. Team
    members acknowledged that gaps in services and a lack of long-term support made
    it particularly difficult to provide individualised support to older people with
    dementia and their carers. On the other hand, the age psychiatry services locally
    were well-developed and the commitment to research of senior members within the
    service meant that practice was both progressive and open to scrutiny. Indeed,
    the mental health services for older people available at that time were in advance
    of those in other parts of the UK benefiting as they were from comprehensive and
    multidisciplinary team working and continuity of care.


    Case managers were, therefore, located within a community mental health team for
    older people, a specialist secondary health care setting which provided primarily
    a treatment-orientated model of care, with a focus on improvement, stabilisation
    and discharge. They were employed by the social services department, and were
    thus able to access all relevant health and social services resources for older
    people with dementia and their carers. It is in this context that evaluation of
    the case management service and its contribution and different style of work needs
    to be viewed.'
