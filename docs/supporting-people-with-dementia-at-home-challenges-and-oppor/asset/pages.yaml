    # Summary


    Overall, the LCMS provided care that was more expensive than standard services.
    Nevertheless, some components of costs were higher for those in the control group
    receiving standard services, as shown in Box 9.1. There were higher costs to the
    NHS in respect of acute hospital care for those in the experimental group, possibly
    attributable to the needs of older people who may otherwise have been admitted
    to a long-term care setting where their acute medical needs may have been met
    without recourse to hospital admission had had not received intensive care management.
    Overall, costs to the control group were higher in respect of long-term care admissions,
    primarily to residential and nursing home care, reflecting the paucity of domiciliary
    care compared to that available in the experimental group primarily in the form
    of the paid helper service. Since professional visits'
