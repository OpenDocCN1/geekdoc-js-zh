  md: '# Supporting People with Dementia

    at Home


    Challenges and Opportunities for the 21st Century


    David Challis, PSSRU, University of Manchester, UK

    Caroline Sutcliffe, PSSRU, University of Manchester, UK

    Jane Hughes, PSSRU, University of Manchester, UK

    Richard von Abendorff, formerly PSSRU, University of Kent, UK

    Pamela Brown, formerly PSSRU, University of Kent, UK

    John Chesterman, formerly PSSRU, University of Kent, UK


    This groundbreaking study of an intensive care management scheme designed for
    older people with dementia at risk of entry to residential care uses a quasi-experimental
    approach, where individuals in one community mental health team for older people
    received case management and were matched to those in a similar community mental
    health setting without such a service. The evidence was analysed in relation to
    the eventual placement of the older person, their quality of care, quality of
    life and overall needs, and also the needs of their carers. Detailed analyses
    were carried out of the ways in which case managers undertake their work and how
    they addressed the problems and needs of the older people and carers in the study.
    This book offers valuable evidence about the factors which can maximise the independence
    and well being of older people with dementia, from the perspective of older people
    and their carers. For those who commission services, it is highly relevant to
    service models for the National Dementia Strategy in England.


