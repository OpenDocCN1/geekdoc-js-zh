  md: '# # Chapter 4


    # # Research Methodology


    # ## Context and Design


    The Lewisham Case Management Scheme was, in many ways, ahead of the policy agenda
    of the time in that it examined the benefits and costs of intensive care management,
    focused upon a specific high-risk target group and linked with a specialist secondary
    health care service. The focus of the research study was broad, examining the
    development of the case management scheme within the local service context as
    well as its impact and practice. Sought to address the costs and benefits experienced
    by older people with dementia and their carers, the operation of the new service
    and the identification of any care practices which improve service provision to
    a vulnerable client group.


    The methodology was a quasi-experimental design in which the case management service
    received by older people with dementia and their carers, the experimental group,
    was compared to that offered in a similar community team setting without this
    innovative service, the control group. It is of note that both service settings
    were located within a network of services for older people with mental health
    problems resources probably more extensive and more than were available in other
    parts of the country (Challis et al., 2002b). Consequently, such a context was
    one that, if anything, likely to reduce the kind of gain associated with the intervention
    could potentially be a conservative bias to the findings. As part of the quasi-experimental
    design, equivalent cases were identified in both the experimental group and control
    group by applying similar referral criteria, namely, those with a diagnosis of
    dementia, significant unmet needs and thus at risk of admission to long-term care.
    Subsequently, individuals were paired on a number of variables likely to be associated
    with outcome to create matched groups.


    One potential problem with this particular research design can occur where the
    existence of a new service option creates referral behaviour (Challis and Darton,
    1990). An example is when cases allocated to the control group are placed in longterm
    care before they can be included into the study since the incentive to a new service
    present in the experimental area. This can introduce a bias against identifying
    a discernible reduction in the placement rate in the experimental group, as not
    in other quasi-experimental studies (Challis and Davies, 1986; Challis et al.,
    2002a). It has also been noted that the progressive nature of Alzheimer’s disease
    and other types of dementia creates a trajectory of care during which time there
    is a limited optimal period for undertaking intervention programmes (Zarit and
    Leitsch, 2001). Thus the very'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'nature of the disease, and the stage of this at which individuals are included
    into the experimental or comparison group, can influence the outcome of the research
    (Challis and Darton, 1990).


    Four research questions informed this study. First, were two questions regarding
    the outcomes for older people with dementia and their carers, and the cost of
    care. The second set of questions were concerned with the care processes that
    evolved, namely how care managers supported people with dementia and their carers
    in the context of a specialist mental health team for older people. These are
    detailed in Box 4.1. A close connection between research and service development
    is one that has been encouraged by researchers evaluating services (Zarit et al.,
    1999; Droes et al., 2000; Davey et al., 2005). The working relationship between
    the researchers and the case managers and, indeed, members of the multidisciplinary
    team gave a unique chance to investigate some of the key processes in the development
    and evolution of the case management scheme. From the outset, service development
    was expected to be an integral part of the work of care managers and tangible
    recognition of this was seen in the establishment of the specialist paid helper
    service as described in Chapter 6, to provide care to people with dementia in
    their own homes.


