    # The Structure of the Book


    The remainder of this book explores care management arrangements in the context
    of care of the older person with dementia, the model of case management, the research
    design, and how the scheme evolved during the life of the research study. It describes
    the development of a paid helper service, outcomes for the older people with dementia
    and their carers, variations in costs and the subsequent evolution of the scheme
    into mainstream service provision. The study addresses the objectives of the Dementia
    Strategy (Department of Health, 2009b), particularly those of improved community
    support services and the carers'' strategy for dementia.


    Chapter 2 explores issues in the development of care management arrangements for
    older people with dementia. Following this, Chapter 3 describes the model of case
    management for older people with dementia as undertaken in Lewisham, and outlines
    the features of its service setting at the inception of this research. In Chapter
    4, the research methodology is outlined including the choice and types of measures
    used, selection and components of case matching. The procedures for interviewing
    clients and carers, and for evaluation of costs and outcomes, service provision
    and practice, are also explained. Chapter 5 examines case management practice
    within the scheme as it evolved during the research study. It describes the processes
    of case finding and screening, assessment of need, care planning, monitoring and
    case review, case closure and discusses the role of advocacy in respect of older
    people with dementia. Chapter 6 describes the development, management and evolution
    of the paid helper service, a specialist domiciliary service for older people
    with dementia and outlines the main characteristics of the paid helpers, their
    recruitment, and the management and organisation of the scheme. Chapters 7 and
    8 describe the outcomes for the older people and carers in the experimental and
    control groups. The former examine the success of the scheme in terms of the older
    people''s needs and its effect on their quality of life. The latter describes
    the extent to which carers were relieved of the tasks of caring, and examines
    the influence of the scheme on carers'' quality of life and level of strain. In
    Chapter 9 the effectiveness of the scheme in terms of costs to agencies, and aggregated
    costs to society for the experimental and control groups is explored. Chapter
    10 describes the factors associated with variations in cost for both groups and
    differences in cost for a variety of older person and carer characteristics. Lastly,
    Chapter 11 examines the subsequent evolution of the scheme within the local network
    of health and social care for older people with mental health problems and reviews
    the relevance of the research findings in the context of the current policy framework.'
