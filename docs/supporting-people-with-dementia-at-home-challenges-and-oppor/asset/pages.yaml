  md: '# Acknowledgements


    The publication of a National Dementia Strategy in 2009 makes the contents of
    this book particularly timely. It has been in the gestation period for some time
    and many people have assisted both in the conduct of the research and in the preparation
    of the manuscript. Unfortunately not all can be mentioned personally here.


    We are particularly grateful to the older people and their carers who allowed
    themselves to be interviewed at a number of occasions. After much thought, we
    decided to use the term ''client'' in this book, to describe the older people
    with dementia who were the subjects of the study, and the term ''carer'' to describe
    relatives, friends and neighbours who provided informal and unpaid care to the
    clients. To some extent, the choice of terminology was arbitrary and in no way
    diminishes the important contribution made by these individuals.


    Our collaboration with colleagues in what is now known as the Mental Health for
    Older Adults service within the South London and Maudsley NHS Foundation Trust,
    covering the borough of Lewisham, is longstanding. Professors Elaine Murphy and
    Alastair Macdonald facilitated the development of the research study together
    with Amanda Edwards on behalf of the local authority. More recently, Carolyn Richardson
    arranged for us to meet members of the current service. Lis Hunter, formerly case
    manager in the initial study, provided an interesting historical perspective when
    the book was being drafted.


    Colleagues in the Personal Social Services Research Unit have provided assistance
    in the drafting of this manuscript. Glenys Harrison and Sue Martin have provided
    secretarial support. Paul Clarkson provided us with valuable comments as former
    colleagues Reba Bhaduri and Karen Stewart.


    Finally we should like to thank the Department of Health which funds the Personal
    Social Services Research Unit and the Gatsby Charitable Foundation who provided
    initial funding for this research.


    David Challis, Caroline Sutcliffe, Jane Hughes, Richard von Abendorff, Pamela
    Brown and John Chesterman'
