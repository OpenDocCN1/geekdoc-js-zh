  md: '# Foreword


    There are issues of which it might be written ‘plus ça change, plus c’est la même
    chose’. Too few are evaluated in depth – indeed, in the USA, the number of full
    and rigorous evaluations of systemic changes seems actually to have diminished.
    This book illustrates the benefits of the kind of research programme which emerges
    when such a plus change issue is first formulated in contemporary terms, whose
    longevity matters the duration of the issue, whose foci and content adapt to changing
    contexts and ideas, and which make broad evaluations of models whose logics are
    highly explicit. Its depth, perspective and chiaroscuro illustrate how earlier
    programme has been deepened and broadened, how ideas and hypotheses from earlier
    generations have been developed and tested, and also how continuities in argument,
    collection designs, measurement devices and other features of the PSSRU framework,
    the Production of Welfare approach, have contributed to one another to allow more
    precise and illuminating analysis.


    Readers will be interested in different themes to which the book contributes.
    Two particularly caught my eye. One is matching management inputs of all kinds
    to user and system circumstances and values, what during the early nineties the
    Department of Health christened ‘differentiation’. This is perhaps the key theme
    of the study as it is a key theme in the history of care management discussion
    in this country and abroad. Early experiments showed that for some users, improving
    the performance of care management tasks could allow benefit to be produced from
    the resources. From then on, one of the most important intellectual challenges
    became to construct a body of knowledge and logic to help achieve requisite matching,
    and by doing so, to secure systems with the variety in care management policy.
    The authors and collaborators of this publication have long been among those collecting
    and collating evidence from leading countries both in the UK and further afield.
    This text illustrates how greatly the Lewisham Care Management Scheme and related
    projects contributed to the theoretical development.


    In this study, like other PSSRU experiments, matching the content of the main
    service inputs was tackled by internalising their management within the team,
    not by creating a complete purchaser-provider split at this level. The analysis
    reported here strongly suggests that for this key subgroup, as subjects of previous
    PSSRU research, the early purely brokerage model of case management was unlikely
    to be the best approach, although its logic clearly appeared tempting to policy-makers
    and managers.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Related is the intensity of care management inputs in time, expertise and other
    resources. The book further develops an important argument that post-community
    care reform outcomes are worse for many highly prioritised users because those
    who would benefit from them too rarely had access to care management of the intensity
    and user-bespoke arrangements designed in almost all of the PSTRU experiments,
    including the Lewisham study. Thus, a local care system is imbalanced and is inefficient
    unless first, it provides a variety of care management with respect to intensity
    (and other characteristics); and second, provides the processes that create a
    good match between user circumstances and care management model.


    The text does demonstrate the benefits created by the service''s intensity and
    other characteristics, and so suggests potential benefits of similar development
    elsewhere for local policy-makers. It shows how essentials of the original project
    were absorbed into a wider service system for older people with dementia to provide
    the highest of the three ''levels'' of care management which policy makers recommended
    and considered to be developing more generally by the late nineties, but with
    the importance difference at that level, what the service provides is likely to
    be atypically, specialised and effective. So many elements of the original scheme
    have survived to the present is itself evidence of the strength of the model.
    In this respect it complements earlier PSSRU work, particularly undertaken in
    Gateshead.


    A second contention to catch my eye is the issue of integrating resources hitherto
    provided in different policy silos. The Lewisham experience is particularly informative
    about the integration of health and social care resources. It confirms that the
    task is to balance differing objectives of various health and social care paradigms.
    However, it confirms that it is naive to imagine that simply merging social care
    into the national health service will suffice, or indeed, greatly improve the
    balance for most users, despite the interdependence of inputs and outcomes across
    health and social care.


    The results illustrate how service users in different circumstances and with different
    values and wishes are best managed with arrangements built around different degrees
    and nature of partnership or integration, job-re-engineering, and the like. Had
    well-conceived and fully evaluated experimental programmes (inter alia measuring
    the costs and outcomes for users and others) preceded policy action, there might
    have been much more grounded logic to guide the design of attempts to improve
    outcomes during the late 1990s by inter-silo integration of some kind. We must
    be grateful that the 2005 Green Paper, Independence, Wellbeing and Choice, and
    recently the National Dementia Strategy illustrate how central government continues
    to accept responsibility for key features of the success of the system. Furthermore,
    we look forward to the evolution of a policy which achieves a balance that truly
    reflects the wishes, needs and interests of users and carers, particularly if
    over the next few decades, the balance between demands and resources worsens.'
  merge: -1
  pgno: 17
- img_proc: true
