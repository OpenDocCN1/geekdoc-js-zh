    # Society


    In essence, costs to society were an aggregation of four components: costs to
    agencies; costs to carers; personal expenditure of the older person; and housing
    costs. However, three but significant amendments were made. First, to avoid double-counting
    the costs of older people''s and carers'' contributions towards services, both
    were combined and attributed to the former since they were calculated as part
    of the service costs. This might slightly underestimate carer costs as it excludes
    costs to carers of services being used specifically for their benefit. Second,
    personal expenditure generated from the Family Expenditure Survey (Central Statistical
    Office, 1994) was included for older people living at home and during the first
    six weeks after placement in long-term care. Thereafter, for those placed permanently
    in care homes, as the personal allowance from the appropriate schedule of benefits.
    Third, housing costs were taken into account for the first six weeks of a placement
    in long-term care. Again, applying the concept of opportunity cost, if the older
    person lived alone with a carer, 50 per cent of costs were taken into account.
    If the older person was placed permanently in long-term care, after six weeks
    they were adjusted to have no housing costs as it was assumed that either their
    home and assets were sold or disposed of or all housing costs were attributed
