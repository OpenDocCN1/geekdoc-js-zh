  md: 'Agency costs were incurred by each of the purchasers of services, social care
    and the NHS, and were derived from two sources: the amount of services received
    by the client and the prices of services. Costs to carers were assessed by taking
    account of both the financial burden of care and the hours spent caring, and the
    opportunity cost of this was calculated. Total costs to carers constituted the
    aggregation of these. Costs to carers other than the main carer were also included.
    The total costs to society were estimated by combining costs to services, carers,
    clients'' personal expenditures and housing costs. Factors associated with cost
    variations for older people in both the experimental and control groups were examined
    using cost function analysis, in order to identify client and carer characteristics
    or care processes that influenced costs to agencies, costs to society and community
    package costs. The latter were those costs of services associated with maintaining
    older people with dementia at home and supporting their carers.


    Information was collected on the paid helpers, through the analysis of their recruitment
    questionnaires and interviews with case managers; by interviews of a sample of
    ten helpers; finally using paid payment records to construct a picture of the
    use of paid helpers throughout the scheme. In addition, the case members of the
    community mental health team for older people, case managers and records within
    the local social services department were scrutinised in order to gain more information
    on their contacts with individual cases in both experimental and control groups.
    These data were used to define service receipt and cost to services, and also
    to gather further information which could qualitatively describe the practice
    of members of the community mental health teams for older people and case managers
    in particular. Furthermore, budget statements by case managers and reviews of
    care packages set up through the scheme were used to look at the balance between
    paid helpers and the local authority home care service during the life of the
    study.


    # Summary


    This chapter has provided a brief overview of the case management study and the
    context within which it was set, and a description of the research design, methodology
    and the interview schedules and the measures used therein. It has also described
    case selection and the detailed methods used to create the two matched groups.
    Of particular interest is the fact that based upon information relating to characteristics
    of clients and carers in the experimental and control groups, it was established
    that there were no significant differences between the two groups following the
    matching process. The process of gathering costs and service information has also
    been outlined.


    A considerable number of informants were consulted in the process of data collection
    in order to get the most accurate information and to obtain the best possible
    picture of the older person''s situation. However, in a number of cases,'
