  md: '# Principal Research Findings


    In Chapter 4, four research questions were formulated concerning the potential
    impact of the LCMS on the older people with dementia and their carers, the wider
    care network, and of the purchasers and providers of health and social care. The
    first two related to outcome and costs, and the last two related to the care process.


    +   - what are the outcomes for older people and their carers of a new intensive
    care management service?

    - what are the costs of care in an intensive care management service compared
    with the usual modes of care?

    - what kinds of practice interventions and strategies do care managers develop
    for older people with dementia?

    - and what forms of service development do care managers initiate to meet need?


    These are reviewed in the light of the experience of the scheme, thereby summarising
    the principal findings of the study.


    # Outcomes for Older People and their Carers


    Box 11.1 details the main findings of the LCMS with regard to outcomes and costs
    of the intervention from the perspective of the older people with dementia, their
    carers, the researchers, and others involved in the care network. In respect of
    the outcomes of the scheme, it was apparent that by the second year its effects
    began to show in a lower rate of admission to care homes for older people with
    dementia in the experimental group, than for those in the control group. This
    reflects the finding of another study evaluating the impact of integrated care
    and case management with a group of older people in receipt of community services
    which also found reduced admission rates to lower rates of functional decline.
    In this, the intervention group received no additional community services, indicating
    that the role of the case manager working within an integrated care system was
    paramount (Bernabei et al., 1998). As discussed more fully in Chapter 8, it appeared
    that the older people with dementia in receipt of case management had benefited
    in terms of a reduction in their levels of unmet needs and had gained more daytime
    company. It is also noteworthy that the quality of life measures showed little
    overall change over time except for reported greater satisfaction with lifestyle
    within the home for the older person. However, the measurement of change in quality
    of life over time is difficult with this group (Bauld et al., 2000b; Watt, 2001),
    especially when the desired outcomes of older people with dementia may differ
    from those typically identified in quality of life measures (Bamford and Bruce,
    2000).'
