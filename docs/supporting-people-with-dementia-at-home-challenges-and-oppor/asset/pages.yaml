  md: '# In Retrospect


    The Lewisham study offers important insights regarding three current concerns
    about the development of services and the implementation of policy. These relate
    to the sustainability of innovatory service models, personalisation and the deployment
    of personal budgets, and the roll out of the National Dementia Strategy.


    A striking feature of the Old Age Mental Health Services in Lewisham is the coherence
    and logic of the organisational model within which the service operates and the
    staff undertake their roles (Macdonald, 1991; Murphy and Banerjee, 1993; Macdonald
    et al., 1994). Not only was this coherence evident but there appeared to be a
    strong shared vision about the logic of the services, about how and why things
    were done in a particular way, shared by staff from different disciplinary perspectives.
    The service model in short is more than the balance of commitments negotiated
    between current stakeholders. Some considerable time after the initial project
    was undertaken, it was evident how the case management had had incorporated within
    the overall operational model of the service. The importance of such a coherent
    service model is that it provides the basis for innovatory approaches to be transported
    and employed in other settings and locations.


    As part of the personalisation agenda, the strategy of providing personal budgets
    has been identified as a strategy to increase choice and maximise the responsiveness
    and flexibility of support (Department of Health, 2008a). Obviously the mechanisms
    employed for the management and use of a personal budget will vary according to
    the capacity and willingness of different groups of people to employ that budget.
    The IBSEN evaluation of individual budgets in social care noted the less positive
    response of older people to what was predominantly a direct payments mode of deployment
    of budgets (Glendinin et al., 2008). What was needed was a variety of ways flexibly
    deploying and managing the personal budget for older people who did not want to
    take on these themselves. The Lewisham scheme and its related studies (Challis
    and Davies, 1986; Challis et al., 1995; 2002a) provide a model where case managers
    can deploy resources equivalent to a personal budget flexibly and responsively,
    maximising choice for individuals for whom a personally managed payment is not
    suitable or acceptable. The outcomes of these services for older people and their
    carers were generally positive.


    The Lewisham study also has particular relevance for the implementation of the
    Government''s National Dementia Strategy in a number of features of a comprehensive
    community personal support service are described (Department of Health, 2009b,
    47–8). These include specialist dementia home care; flexibility to respond to
    changing needs; access to personalised social activity, short breaks and day services;
    responsiveness to crisis; flexible and responsive respite care in a variety of
    settings. These were all features delivered as part of the Lewisham Case Management
    Scheme. Thus, the lessons from the scheme offer more than immediate positive findings
    from a new approach to supporting older people with'
  merge: -1
  pgno: 192
- img_proc: true
  md: dementia at home. It provides a sound evidence base for key aspects of both
    the roll-out of personalisation for people with dementia and their carers and
    for the implementation of the National Dementia Strategy.
