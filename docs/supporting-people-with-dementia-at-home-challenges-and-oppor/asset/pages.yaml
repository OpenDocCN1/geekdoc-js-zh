  md: 'of factors influencing costs: outcomes or change indicators; client characteristics;
    carer characteristics, and the care process. Second, using the equations, illustrative
    examples of care package costs are provided for different combinations of client
    and carer characteristics. Factors associated with variations in costs for the
    experimental and control groups are described separately and these predictors
    of costs used to illustrate the costs of care for a variety of individual characteristics.
    The value of analysing costs in this way is that the separate equations provide
    some evidence of which factors in the care process are of significance in determining
    the cost and use of services of those receiving a care management service in the
    experimental group and those receiving the standard services in the control group.
    Thus, the intention is to identify the determinants of variation in costs associated
    with the characteristics of the older people, their carers and the effects of
    services upon well-being, or outcomes. The underlying premise of this approach
    is the ways in which costs vary are determined by the need characteristics and
    the outcomes of services such as changes in well-being over time.


    # Approach


    Function analysis was used to identify factors which caused the costs of care
    to vary, an approach used in previous evaluations of case/care management (Challis
    and Davies, 1986; Challis et al., 1995; 2002a). This approach incorporated regression
    analysis, a multivariate technique ''designed to simultaneously tease out the
    many influences on cost'' (Netten and Beecham, 1993, 64). Analyses were carried
    out using forward stepwise multiple regression. A range of independent variables
    were taken from the list of client and carer variables shown in Box 7.1, Chapter
    7. They were selected from the following domains: dependency and mental health;
    descriptive factors; the caring role; and the care process. Six variables were
    chosen as outcome measures from the list, and more importantly, were also selected
    on the basis that they were not only relevant to the cost of care, but also outcomes
    of value to both older people and carers. Each outcome measure was expressed as
    a change score, the value of the change over time between the baseline interview
    and follow-up interview conducted at 12 months. These are shown in Box 10.1. For
    the analysis, where information was missing, the mean value for cases in that
    group was used. This approach supports the central tenet of the study which has
    been to explore the multiple issues involved in the care of an older person with
    dementia and where appropriate for their carer.


    Independent predictor variables were explored in conjunction with three sets of
    cost variables applied to the experimental group and control group separately.
    First, at the micro level, care package costs were estimated based on the total
    agency costs excluding the cost of acute hospital and long-term placement, thus
    estimating the average cost of care packages for those remaining at home. The
    community care package describes the costs of services primarily oriented to maintaining
    the'
