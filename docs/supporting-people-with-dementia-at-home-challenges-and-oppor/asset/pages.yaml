    # The Contribution of the Carers


    The policy of maintaining vulnerable older people in the community has placed
    increasing reliance on their informal carers for support and care. Family carers
    of older people, who comprise around three-quarters of all carers (Pickard, 2004),
    have been the main source of this support (Twigg, 1998; Pickard, 1999). The importance
    of their support has become greater due to the projected rise in the number of
    people aged 85 and over (Wanless, 2006) who will need more care (Wittenberg et
    al., 2001). Historically, community care services were provided for older people
    living at home with little support (Pickard, 1999), although carers have benefited
    from specific carer services such as support groups and breaks from'
