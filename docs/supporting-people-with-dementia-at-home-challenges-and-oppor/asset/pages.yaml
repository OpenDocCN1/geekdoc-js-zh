  md: 'found an association between younger caregivers and subsequent placement, particularly
    if the caregiver was a son or daughter caring alone or with relatives. Second,
    the contribution of carers other than the main carer was associated with maintaining
    older people with dementia at home for longer. This perhaps indicates that they
    provided support for the main carers. Nevertheless, it should be born in mind
    that the most crucial component in reducing the likelihood of admission to a care
    home was simply the presence of any carer, which concurs with the findings of
    a study of older people with dementia and their carers where the presence of a
    co-resident carer had a highly protective effect (Banerjee et al., 2003).


    In comparing the regression equations of the experimental and control groups,
    it is apparent that both had predictive validity, although none of the characteristics
    were common to the two groups as might have been expected. They were dominated
    by carer-related factors: the extent to which the carer wanted the client to be
    placed in a care home in the experimental group, and presence of a carer in the
    control group, a factor with such a large association that it was removed from
    the analysis because it swapped others. Only one factor in the experimental group
    regression equation was significant at the one per cent level, namely desire for
    placement, suggesting that the case management scheme achieved successfully for
    problems arising from the absence of carers, and to provide care for clients with
    a high degree of health and behavioural problems. Indeed, one of the hallmarks
    of the LCMS was its success in maintaining older people at home who did not have
    carers, where the contribution of carers is discussed more fully. More generally,
    the research highlights the critical contribution carers make to decisions about
    the admission of older people with dementia to care homes. As reported elsewhere
    the attitude of the carer was one of the key variables in predicting placement
    (Levin et al., 1989; Pot, 2004).


    # Outcomes of Care


    Outcomes for older people described in this section have used material derived
    from interviews with clients, carers and the assessments of researchers. The analyses
    have sought to explain differences in the extent to which the LCMS met the needs
    of the experimental group, compared with the control group. As it represents an
    attempt to measure many of the unique features of the case management scheme using
    items specifically selected for this purpose. Inevitably, by attrition, through
    factors such as death, decline in health and placement in long-term care out of
    the area, it was not possible to re-assess all clients or carers during the follow-up
    period of two years. Therefore all remaining cases used for the comparison of
    change measures. Measures of change over time are illustrated in a number of tables,
    from baseline to 6 months and baseline to 12 months and were tested using analysis
    of variance. Descriptions of the measures or variables used are referenced in
    Appendix 1.'
