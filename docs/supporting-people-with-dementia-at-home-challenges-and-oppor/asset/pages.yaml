    caring, or services directed at the cared for person, for example day care or
    respite care (Twigg, 1992; Pickard, 2004).

    Twigg and Atkin (1994) have provided a widely quoted conceptual framework comprising
    four models to describe the response of service to carers. In the first model,
    carers are regarded as ''taken for granted'' resources, and in the second, agencies
    work alongside carers as co-workers, integrating their work with the support provided
    by carers. This takes account of carers'' interests and wellbeing, yet the person
    requiring support the priority. In the third model, carers are viewed as co-clients
    in need of assistance in their own right, with services designed to relieve their
    situation and improve their well-being, in some cases at the expense of the older
    person. For example, the older person may receive care away from their home, primarily
    to provide relief for the carer. The fourth model assumes that the role of the
    carer is superseded and that input is no longer required, maximising independence
    for both client and carer and its focus is more on the relationship between younger
    disabled adults and carers. Subsequently, this describes the concept of carers
    as experts who demonstrate skills and expertise in caring which have developed
    over time (Nolan et al., 1996). The use of the two elements of Twigg and Atkin''s
    conceptual framework, carers as a resource and carers as co-clients in their own
    right, are particularly relevant to this scheme both in the emerging policy context
    and the research study at the heart of this book.


    A number of policy initiatives following the community reforms in relation to
    the carers of older people are illustrated in Box 1.3. In advance of this, the
    Griffiths Report (1988) acknowledged that the majority of informal care was provided
    by family, friends and neighbours, and the role of public services was by definition,
    ''fill the gap'' or provide care where informal care had broken down. It placed
    carers firmly in the role of a resource in its recommendation that informal care
    packages to individuals should build on the ''available contribution of informal
    carers and neighbourhood support''. One of the goals of community care was to
    give support and relieve carers with the stress of caring for a dependent person.
    Although the White Paper Caring for People (Cm 849, 1989) took further many of
    the principal themes of the Griffiths Report, ensuring that service providers
    made practical support for carers a high priority, and ''taking account'' of carer
    needs, neither recognised carers as service users in their own right.


    It can be argued that the concept of carers as co-clients was demonstrated in
    the 1995 Carers (Recognition and Services) Act and were strengthened by the 2000
    Carers and Disabled Children Act. These were designed to provide a framework for
    greater rights for carers and to ensure that their needs were recognised and assessed.
    However the extent to which this has been achieved is unclear, particularly in
    respect of the carers of older people with dementia, evidence up to date is scarce.
    It has been suggested that carers were unaware that they had received an assessment
