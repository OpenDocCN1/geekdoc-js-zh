  md: '# Chapter 5


    # Care and Support at Home for Older People

    and Their Carers


    # Introduction


    Models of community care in respect of adults with mental health problems have
    been well developed as compared with those for older people. For example, a meta-review
    of research literature from 75 studies on case management for people with severe
    mental illness identified six different models of case management (Mueser et al.,
    1998). These were: brokerage; clinical case management; assertive treatment (ACT),
    intensive case management (ICM), the strengths model; and the rehabilitation model.
    The focus of brokered case management is on: assessment; referral; co-ordination;
    monitoring and advocacy. Kanter (1989) described clinical case managers as providing
    services in four areas: initial phase including assessment and planning; environmental
    interventions; patient interventions; and patient-environment interventions. ACT
    is given by a multidisciplinary team for people with severe mental illness and
    offers low patient/staff ratios, 24 hour community care, shared caseloads, and
    direct services (Stein and Test, 1980; Test, 1992). ICM provides practical assistance
    in daily living, and is similar to ACT employs individuals rather than shared
    caseloads. The strengths model focuses on the personal strengths of the individual.
    The rehabilitation model emphasises the personal goals of the individual and encourages
    scales to promote community tenure (Anthony et al., 1998).


    Arguably the Lewisham Case Management Scheme contains a number of these models.
    However, if any are to be selected, they are a combination of both the clinical
    and ICM approaches, replicating the style of case management of the PSRRU pilot
    projects (Challis and Davies 1986; Challis et al., 1990; 1995), cited in Caring
    for People (Cm 849, 1989) as examples of good practice. The responsibilities for
    assessment, case planning, linking with both carers and the mental health team
    for and managing crises are consistent with the clinical approach. Furthermore,
    in terms of target group, the centrality of practical assistance and small caseloads,
    it remains intensive case management as described by Mueser and colleagues. There
    is almost certainly a necessary relationship between intensive case management
    and the clinical model, whereby the small caseloads of the intensive model are
    necessary to make feasible the clinical approach. Indeed, this approach to the
    care of older people has been replicated elsewhere (Eggert et al., 1990), and
    there is evidence to suggest that smaller caseloads are necessary if case managers
    are to support older people at home as an alternative to admission to long-term'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'care (Degenholtz et al., 1999). An informed approach to commissioning services
    for older people is an important component of case management, and more generally
    effectively, community-based care (Moxley, 1989); Applebaum and Austin, 1990;
    SSI/SWSG, 1991a,b; Cm 4169, 1998; Cm 6499, 2005; Cm 6737, 2006; Department of
    Health, 2006), epitomized in this study by the paid helper service, which will
    be outlined in Chapter 6.


    Social workers who possessed a range of skills and experience in working with
    older people were recruited as case managers to the LCMS. Although no specific
    training programme was provided at the clinical level, case managers had access
    to the normal range of training resources available generally in social work issues
    and also in some specialist areas which had particular relevance to their client
    group, including, for example, reminiscence and elder abuse. They also visited
    one of the earlier case management schemes to learn from staff who had implemented
    that service (Challis et al., 1990; 2002a). In the development of the scheme,
    attempts were made to achieve a balance between providing a clear model for the
    case management scheme based on previous studies, with the opportunity for good
    practice development. Overall, the aim was to allow sufficient flexibility for
    the scheme to develop and evolve in its unique setting.


    Successful outcomes for the LCMS were defined as: enhancing the effectiveness
    of care; improving quality of life; reducing stress and ill-being in older people
    and carers; and allowing people to live where they wished in a manner which was
    cost-effective as possible. This chapter examines case management practice which
    underpinned these goals, as it evolved during the course of the research study,
    highlighting the principles of case management as compared with more traditional
    social work practice with older people and their carers (Marshall, 1990; Hughes
    et al., 2005). The findings discussed in this chapter are based upon those clients
    who were recruited to the experimental group of the LCMS and receiving case management
    input. Information was derived from two sources: interviews with practitioners
    and data derived from the CAPRE documents, completed by case managers when assessing
    clients and reviewing case plans, as noted in Chapter 4. This work undertaken
    by case managers is examined in terms of the core tasks of case management: finding
    and screening; needs assessment; implementing the care plan and monitoring, review
    and case closure.


    # The Process of Case Finding and Screening


    One notable difference between the role of social workers in the community mental
    health team for older people and those social workers employed as case managers
    was the latter''s focus on long-term continuity of care. Figure 5.1 describes
    the process whereby referrals were made for case management within the community
    mental health team in Lewisham. Both the community mental health team for older
    people in which the case managers were based and the home care service provided
    by the social services department were significant sources of referrals.'
