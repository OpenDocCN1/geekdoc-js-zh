  md: '# Chapter 11


    # Evaluation and Evolution


    # Introduction


    This chapter draws together the main findings of the evaluation of the Lewisham
    Case Management Scheme and considers some of the implications for the development
    of care management for older people with dementia and their carers in the context
    of policy initiatives to promote integrated health and social care provision and
    the personalisation of care. As described previously, the scheme was designed
    as one of family of case management upon a ‘non-equivalent control group’ was
    used (Campbell and Stanley, 1966). In this research, a quasi-experimental design
    also the same approach was adopted in the Kent, Darlington and Gateshead projects,
    with the experimental and control group subjects recruited from adjacent but similar
    demographic areas within the same catchment area for the provision of health and
    social care, reducing the risk of service-related differences (Challis and Davies,
    1986; Challis et al., 1995; 2002a). All four studies were designed to provide
    an effective and realistic alternative to long-term placement in care homes for
    vulnerable older people, increasing the range of choices available.


    The Production of Welfare (POW) approach (Davies and Knapp, 1981) provides the
    conceptual framework for the research methodology for all the studies. It offers
    a means of examining the causal processes and outcomes consequent on the development
    of case management. Within there are five interrelated components: resource inputs,
    non-resource inputs, intermediate outputs, final outputs and costs as is illustrated
    in Figure 11.1. On the one side of the production relationships are supply side
    factors, non-resource inputs. In this study, the former, in the main, comprises
    the contributions of staff and carers. Non-resource inputs, on the other, are
    the determinants of intermediate and final outputs which in this study comprise
    the process of case management and the background attitudes and experiences of
    the key actors in the provision of care on a daily basis. In this example, costs
    embrace services provided by both staff and carers and less tangible costs such
    as burden.


    On the other side of the production relationship are the final and intermediate
    outputs of care. Both are significant in the context of measuring the effectiveness
    of policy initiatives. Intermediate outputs attempt to capture what social care
    services are striving to achieve for carers and older people, such as provision
    of assistance and development of services. On the other hand, final outputs measure
    the effects of the supply side factors, both resource inputs and non-resource
    inputs,'
