    # The Costs of Care


    As detailed in Chapters 4 and 9, the LCMS used an opportunity cost approach. This
    describes the cost of using a resource in a particular way, not necessarily the
    monetary cost, but, ''the benefit forego (the opportunity cost) by losing its
    best alternative use'' (Knapp, 1993, 11). In terms of comparing types of care
    and resources that may be scarce, this method provides information that allows
    a choice to be made between alternative services (Knapp, 1993). In this study,
    all costs to society were accounted for informal care, the weekly cost of supporting
    older people with dementia and their carers were not significantly higher for
    those receiving intensive case management, although the cost to statutory agencies
    was much greater. The findings appear to indicate that a case management scheme
    could be cost-effective for older people with dementia and their carers, particularly
    in situations where the carer has a desire to support the older person remaining
    in the community. As summarised in Box 11.1, the lower rate of admission to residential
    and nursing care for older people with dementia receiving the case management
    input resulted in lower associated costs compared with the older people receiving
    standard services. In Ireland, it has been estimated that families bore around
    50 per cent of the economic and social cost of caring for older people with dementia,
    whilst community provision accounted for 10 per cent of the overall cost of dementia
    (O''Shea and O''Reilly, 2000). The Dementia UK report (Knapp et al., 2007) estimated
    informal care cost overall at 36 per cent of the cost for people with dementia,
    but markedly higher for those living in the community. It is therefore interesting
    to note that in this study there was a positive effect on the carers of those
    in receipt of case management with regard to costs, since financial and other
    costs were lower for this group compared to carers of receiving standard services.
    However, it was not possible to differentiate the costs of informal care of those
    who lived with the older person with dementia and who did not due to the relatively
    low numbers involved. Nevertheless, it has been established elsewhere that costs
    borne by co-resident carers of older people with dementia are'
