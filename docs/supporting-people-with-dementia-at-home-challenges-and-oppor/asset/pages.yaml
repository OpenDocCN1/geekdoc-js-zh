    between people with complex health and social care needs and those who required
    a prompt response to an immediate practical need. Care management was defined
    as embracing the functions of assessing, care planning, and managing, co-ordinating
    and reviewing services. Within this overarching concept, ‘case management’ was
    used to identify the activity of acting as an advocate and coordinator of services
    restricted to the individual client with complex needs who required this. In this,
    the role of case manager as a broker for the client between relevant agencies,
    monitoring the progress of the client, planning care programmes and maintaining
    a supportive relationship was recognised (Department of Health and Social Services,
    1991). More recently this approach has been replaced with a single definition
    of care management. This focuses on people with complex or rapidly changing needs;
    has at its centre assessing and tailoring services; (Department of Health, Social
    Services and Public Safety, 2006).


