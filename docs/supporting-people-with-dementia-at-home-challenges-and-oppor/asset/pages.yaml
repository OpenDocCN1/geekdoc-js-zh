    # Service and Cost Information


    A number of approaches and sources of data were employed to describe the process
    of intensive care management within the scheme and relate it to the service system
    in which it was placed. First, systematic service records were developed to capture
    the activities of case managers. Second, analysis was undertaken of the contents
    of case notes and patterns of services provided to meet particular needs. Third,
    interviews were undertaken with staff involved in providing and managing the service
    or immediately affected by it. Finally, the service receipt measures also contributed
    to the analysis of the practice of case managers and the care packages they established,
    supplementing other data.


    A Case Planning and Review form system (CAPRE), completed by case managers was
    used to describe client and carer needs assessed by case managers, the patterns
    of case planning and the response to needs, resources used and outcomes. It was
    derived from documentation used in the Kent, Gatehead and Darlington case management
    projects (Challis and Chesterman, 1985; Challis and Davies, 1986; Challis, et
    al., 1995; 2002a) which themselves built on that devised by Goldberg and Warburton
    (1979). The CAPRE encouraged goal planning and was adapted to make it appropriate
    for older people with mental health problems. It was divided into two sections,
    case planning and case review were completed at two different points in time.
    The case planning was in four parts; first, a tick box format was used to identify
    the main problems, concerns and unmet needs experienced by the older person and
    carers within the service system. The second part allowed for the identification
    of the main problem as assessed by the case manager, older person and carers indicating
    the overall severity of'
