    innovations within the scheme. As described in Chapter 6, this was available at
    short notice and outside the normal hours available from existing services. One
    of its most important features was an ability to respond effectively to the idiosyncratic
    needs of older people with dementia whom statutory services found difficult to
    support, and this was crucial in maintaining them at home.'
