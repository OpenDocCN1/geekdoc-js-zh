    degree of variation in both the composition of teams providing care for older
    people with dementia and the lack of specificity in terms of responsibility for
    co-ordinating this group of people provides an uncertain framework for the development
    of care management arrangements, emphasising the influence of organisational features
    on practice.


    These findings are particularly significant in the context of the development
    of community-based services as an alternative to residential and nursing home
    care for older people with mental health problems and particularly those with
