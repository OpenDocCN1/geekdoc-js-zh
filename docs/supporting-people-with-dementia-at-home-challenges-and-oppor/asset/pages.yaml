    In the context of their long-term relationship with clients, case managers were
    on occasion, drawn into the role of advocate. Sometimes, members of the care network
    – both helpers and carers – acted as advocates, although it was often only the
    case manager who had the requisite knowledge relating to service entitlement.
    This was apparent at two levels–first, in response to individual circumstances
    and second, in response to unmet needs of several clients, identified through
    the case management process. The latter found tangible expression in the development
    of the paid helper and is discussed in detail in the next chapter. With regard
    to the former, case managers exercised their advocacy role on behalf of the older
    people in the context of a long-term relationship. In this respect the two roles
    were inextricably linked. The principal components of the advocacy role within
