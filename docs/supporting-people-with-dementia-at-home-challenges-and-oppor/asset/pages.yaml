  md: '# Summary


    In this chapter, outcomes for older people have been explored in the context of
    the two options available to them: care in residential settings and care in their
    own homes. For those within LCMS, it achieved: success in maintaining care at
    home for older people with more severe dementia; a low placement rate in care
    homes; a reduction in the perceived level of risk of placement; a reduction in
    unmet needs perceived by carers; higher levels of company and social activities;
    and better quality of life in terms of greater satisfaction of lifestyle within
    the home. It appears that the location of older people with dementia, whether
    receiving care in their own homes or in care homes is of great importance. The
    scheme was generalised by high survival rates in terms of community tenure, and
    low placement rates in respect of care admissions for the older people with dementia
    in both the experimental group and the control group over the first year. In the
    second year of the scheme its effects began to show in lower rates of admission
    to residential or nursing home care for the experimental group, than under standard
    arrangements for the control group. There was also an observed reduction in the
    level of risk of placement in a care home for the older receiving the case management
    input. Objective measures of client circumstances at the outset revealed a high
    level of unmet need across a broad spectrum that was reduced much more for the
    experimental group in respect of case management than the control group. The scheme
    was particularly effective in meeting the personal needs of clients and providing
    daytime company, although the lack of impact on their behaviour is not surprising
    given the progressive nature of the illness.


    These findings should, however, be placed in context. Problems addressed with
    measuring quality of life generally, and in particular with older people with
    more severe dementia have been recognised (Downs and Zarit, 1999; Bauld et al.,
    2000a). It was not possible to re-interview all clients who had been interviewed
    initially due to the deteriorating nature of their disease and increased physical
    frailty, and assessing changes in quality of life over time was also difficult
    with this particular client group. Only one measure showed significant change
    in the client''s subjective perception of their quality of life for those in the
    experimental group, namely greater satisfaction with their lifestyle by six months.
    However, objective measures revealed a reduction across a broad spectrum of need,
    which was greater for the experimental group than the control group, since the
    carers'' perception was of an improvement in the amount of activities and company
    that the clients enjoyed. It is noteworthy that within the research study, attention
    was given to addressing the social needs of both clients and carers, and in particular,
    it appeared that older people living alone received more company and social activity
    as a result of case management input. Thus, this chapter provides only a partial
    account of the outcomes of this research study since a key element of intervention
    in dementia care is to support the carers as much as the older person. The impact
    on carers is the subject of the next chapter.'
