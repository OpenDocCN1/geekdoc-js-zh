    # Differentiation within Care Management Arrangements


    A differentiated approach to the mode of assessment and care management is one
    in which a distinction is made between service users with complex needs often
    requiring a multi-service response and those with less complex needs which are
    met by a single service response provided by one agency. Older people with dementia
    and their carers typically have complex health and social care needs and it is
    important that all agencies have place in procedures and protocols within care
    management arrangements that facilitate an appropriate response – a feature more
    likely to be associated with a differentiated approach to care management with
    procedures specific to those with complex needs. Historically, different parts
    of the UK have adopted different approaches to this, although as Box 2.1 indicates,
    this is one of the defining features of care management arrangements.


    In Northern Ireland, in contrast to other parts of the UK, proposals for improving
    the management and delivery of community care attempted to adopt a more differentiated
    approach to care management at the outset (Department of'
