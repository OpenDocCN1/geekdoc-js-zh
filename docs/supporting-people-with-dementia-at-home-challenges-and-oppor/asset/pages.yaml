    higher than costs for non-resident carers and these consistently exceed the costs
    of formal services (Schneider et al., 2003).


    A number of factors may account for the relatively high costs identified in both
    the experimental and control groups. The scheme operated in an area where services
    may be judged more expensive than other parts of England (Derbyshire, 1987; Allen
    and Beecham, 1993) including higher community care package costs for older people
    with dementia (Moriarty and Webb, 2000). It has also been suggested that the costs
    of setting up and developing a new service will be proportionally high for the
    number of people recruited to a scheme in the early stages when development work
    is high and numbers are relatively low (Kane et al., 1991; Challis et al., 1993).
    For example, the ‘Channel Demonstration’ projects (see Chapters 2, 9 and 10) are
    series of case management programmes set up in the US to determine whether provision
    of specific home care services would lower nursing home admissions and thus long-term
    care for frail older people. Evaluation of these costs found insufficient evidence
    of nursing home savings to offset the cost of the services (Carcagno and Kemper,
    1998). However it has been subsequently argued that such findings merely suggest
    that *on average the cost of care provision is higher than nursing home expenditure,
    but this average loss may disguise a variety of individual gains*. Many people
    receiving demonstration services offset the costs of home care services by a reduction
    in actual or expected nursing home use (*their italics*) (Greene et al., 1998).
    In this research study, a variety of individual characteristics were shown to
    be significantly related to cost, thereby identifying those who were more financially
    costly to care for at home compared to residential or nursing home care. Thus
    the costs of care were, to some extent, related to particular characteristics
    of the older person and in certain circumstances of their carers, reflected in
    individually tailored care packages, as illustrated in the present study in Chapter
    10.


