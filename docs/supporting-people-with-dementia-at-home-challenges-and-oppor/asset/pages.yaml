  md: '# Predictors of Costs – Individual Characteristics


    with a reduction in costs to society were unsurprisingly the same as those which
    had emerged in the agency costs, namely single diagnosis of Alzheimer’s disease
    and client depression. By way of comparison, the only characteristic in the control
    group associated with a reduction in costs to society was the carer characteristic
    of reluctance to accept help (Table 10.6a). It is, however, also of note that
    carer outcome indicators were only related to costs to society in the experimental
    group equation, as was the case in respect of costs to agencies (Table 10.4a).
    Interestingly, variables related to the care process such as length of time remaining
    at home, emerged as predictors of costs to society, though this was only in relation
    to the experimental group. It was possible to obtain fairly accurate predictions
    of costs to society for both the experimental group and the control group, with
    67 per cent of the variation explained by each equation.


    Table 10.5b shows that in the experimental group, the effect of gender is apparent,
    with females being more expensive to support. Arguably, this masks the influence
    of other variables selected from Table 10.5a, particularly the effect of a single
    diagnosis of dementia. In Table 10.6b, appears that the characteristics of ADL
    functioning, night disturbance, ADL need shortfall, as well as social class, have
    an upward effect on costs to society for those in the control group.


    # Cost Predictors – Comparison and Utility


    As described earlier in this chapter, cost predictors have the potential to be
    used by social care agencies to promote the equitable and transparent use of resources
    to target them in response to identified need. In this study, a number of factors
    influenced the costs of care packages, for agencies and costs to society for both
    the experimental group receiving the case management scheme and the control group
    receiving statutory services. Overall, three important points appear to emerge
    from the predictors of variation in cost illustrated in Tables 10.3a to 10.6a,
    for both groups in relation to: client dependency and mental health; support of
    female clients; and carer characteristics, both their contribution and well-being.
    First, in respect of client dependency and mental health, the costs of community
    care packages were higher in both groups where there deterioration in behaviour.
    With lower agency costs and costs to society for the experimental group. A single
    diagnosis of an Alzheimer’s-type dementia was associated with these cases demanded
    a lower level of intervention than there was greater complexity of the psychiatric
    needs arising from multiple diagnosis of, say, dementia and depression. The influence
    of depression on these analyses of costs is multi-faceted and should be viewed
    in the context of the findings regarding depression in Chapter 7. In respect of
    client outcome, a reduction in depression seemed to raise agency costs and costs
    to society in the control group. Conversely, presence of depression appeared to
    reduce care package costs in the control group, and reduce agency and social costs
    in the experimental group. Thus, the presence of depression had a cost lowering
    effect, but to achieve an improvement increased'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'costs, a finding complementary to other research relating to the treatment
    of depression in vulnerable older people (Banerjee and Macdonald, 1996).


    Second, there were higher costs to agencies and society involved in the support
    of female clients for both groups. This may be more easily understood in terms
    of being reduced costs for male clients due to the greater proportion of them
    who lived with a carer. Males were more likely to have female carers, who may
    have refused services or had fewer services provided. Other research which investigated
    gender differences in the amount of support offered to carers found a difference
    in some managers'' responses to female and male carers, with greater expectations
    made of female carers, despite male carers having lower dependency themselves
    (Bywaters and Harris, 1998).


    Third, in the caring role, the presence of a carer, surprisingly, had the effect
    of lowering community care package costs in both the experimental and control
    groups, which carers'' desire for placement increased costs in both groups. It
    is also of note that the effect of being a female carer on care package costs
    was so strong that this variable was subsequently removed from the experimental
    group equation. Another detail of interest was the association between a carer''s
    reluctance to accept costs. In the control group, this was related to lower costs
    to agencies and society, whereas in the experimental group this was related to
    lower care package costs. Furthermore, carer relating to perceived reduction in
    overall strain and reduced malaise were only apparent in the experimental group.
    However, they were found in each of the three analyses – care package, agency,
    and costs to society – were associated with a small increase in expense. This
    may indicate that the extent of carer out in the experimental group was associated
    with the degree of resource provided and therefore the level of help given, an
    observation supported by the findings described in Chapter 5, which highlight
    the tangible aspects of the help carers received from the LCMS.


    Overall, this approach incorporating predictors of cost also has the capacity
    to assist in the targeting of assistance to permit optimal outcomes, promoting
    the cost-effective use of resources. This has been demonstrated in another way
    in respect of the North American ‘Channeling Demonstration’ projects, referred
