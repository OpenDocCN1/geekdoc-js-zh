    services spanning health and social care. However, a national study of care management
    arrangements noted that less than half of the local authorities provided a specialist
    dementia service in conjunction with health care providers (Hughes et al., 2001).
    Nevertheless, whereas they were more likely than other teams for older people
    with dementia exist by NHS staff, usually community psychiatrist and district
