    teams, suggesting that there is still room for improved collaboration between
    old age psychiatry services and social care services (Challis et al., 2002b; Abendstern
    et al., 2006).


    Historically, a number of research studies have been undertaken in the community
    mental health teams for older people in Lewisham both with regard to access to
