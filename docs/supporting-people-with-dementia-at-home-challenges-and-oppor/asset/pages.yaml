    # Placement Rate


    As noted previously, the LCMS was designed with the aim of supporting older people
    with dementia in the community. Nevertheless, case managers occasionally facilitated
    admission to a care home as more appropriate form of long-term care than continued
    residence in the community. One example involved a couple both suffering from
    dementia, where the paid helper''s report of abuse necessitated the placement
    of the husband in a long-term care establishment, to allow his wife to continue
    living in safety at home. However, such an intervention was not customary, as
    demonstrated below.


    The study recruited 45 cases to the experimental group and 50 to the control group,
    as previously described in Chapter 4. From these groups, 43 pairs were identified
    and matched. It is upon these matched pairs that the comparisons of destinational
    outcome are made. Table 7.2 indicates this at 6 monthly intervals over the two-year
    period for the 43 matched pairs. This is in effect a measure of ‘prevalence’ of
    placement, a record of where the clients were living at particular points in time
    during the period of Research. At the end of a year around three-quarters of each
    group of older people remained in their homes, 19 per cent had been placed in
    care homes and seven per cent had died. Comparable rates of placement in residential
    and nursing care homes in both the experimental and the control groups appear
    to have occurred during the first year of the research study. In the second year
    appreciable differences between the two groups in rate of placement became evident.
    This is an effect which is somewhat masked in Table 7.2 but clearly demonstrated
    in Figure 7.1, which is a graphic representation of the first two columns of this
    table. Table 7.2 illustrated that by eighteen months 56 per cent of those in the
    experimental group and 51 per cent of those in the control group remained in their
    homes. At the end of two years 51 per cent of the experimental group remained
    at home with just 33 per cent of the control group.


