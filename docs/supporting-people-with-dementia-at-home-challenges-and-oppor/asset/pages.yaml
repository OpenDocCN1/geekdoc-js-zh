    # Support for Carers


    In Europe, support for older people with dementia and their carers has been described
    as patchy and inadequately resourced and cultural differences have been identified
    in respect of their care (Marks and Sykes, 2000; Manthorpe and Moriarty, 2007).
    In Sweden, for example, the expectation is that the health and social care system
    will assume the principal role in care provision. In contrast, other countries
    such as Italy and Portugal where the role of the family is paramount, the additional
    absence of resources in some areas means that carers provide the bulk of support
    (Marks and Sykes, 2000). A European Union-funded study (AdHOC) of community care
    recipients had variations across 11 European countries (Carpenter et al., 2004;
    Carpenter, 2005). In Italy low levels of formal care for older people supported
    at home contrasted with high dependency levels and significant levels of carer
    burden. Although Germany had lower dependency levels, carer burden was the highest
    across the countries. A possible explanation was the inflexible regulations in
    place for formal care provision. Despite these differences, it has been suggested
    that across Europe, in respect of case management, delay in diagnosing dementia
    often results in referrals to services when informal carers are already under
    stress. This has been argued to need Europe-wide interventions to help carers
    (Manthorpe and Moriarty, 2007). Furthermore, the influence of gender may also
    be apparent in respect of service provision since research in England conducted
    with the carers of older people appeared to be disproportionately expected of
    women, with male carers being allocated higher priority for services (Bywaters
    and Harris, 1998).


    With regard to giving support to carers, research has underlined the importance
    of care programmes or service provision that not only target all carers but educate
    them and their relatives about accessing services as early as possible (Zarit
    and Zarit, 2006). Taking into account the care-giving trajectory, individuals
    who have provided more years of caring could be exhausted and thus, receipt of
    services at a late stage may have little impact on reducing carer stress. Conversely,
    acceptance of services at this stage may speed up the process of placement in
    a care home for their relative (Lyons and Zarit, 1999). Interestingly, recent
    research has countered the ‘wear and tear’ hypothesis (Townsend et al., 1989)
    which suggested that longer duration of care increases likelihood of psychological
    and emotional distress in the carer. Gaugler and colleagues (2003b) found that
    carers of older people with dementia who gradually progressed into their caregiving
    roles were less likely to place their relatives in long-term care, possibly because
    their coping and managing styles had been defined long before the most difficult
    aspects of dementia symptoms in their relatives, had emerged. Nevertheless,'
