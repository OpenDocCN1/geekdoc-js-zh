  md: '# Care Management for Older People with Dementia


    As described earlier in this chapter, the UK pilot projects demonstrated that
    the specialism by client group is an important factor in the development of effective
    care management practice. Furthermore, it has been suggested, for example, that
    the provision of care management through specialist teams for older people is
    one of the necessary conditions for the development of intensive care management
    (Challis et al., 2001a), a prerequisite for organising complex packages of care
    to enable older people with dementia to continue to live in their own homes. The
    evidence described above suggests that this requirement may have at least been
    fulfilled. However it has also relevant to note that whilst there some multidisciplinary
    teams providing care management for older people with dementia, the provision
    is not comprehensive either in terms of availability or, if in situ, staff mix.


    # Practice Development


    In many countries, government policies concerned with meeting the needs of frail
    older people at home are provided within an increasinglytight financial budget.
    As a consequence, policy and service development has taken increasingly similar
    forms (Kraan et al., 1991; Challis, 1994a,b; Delaney et al., 2001). In England
    it has been acknowledged that the community care agenda is a long-term and the
    development of home-based care for older people is a long-term programme (SSI,
    1998b; Department of Health, 2000b), and more recently this has found expression
    in the transformation agenda (Department of Health, 2008a). As part of this process
    a number of official documents have been developed and continue to be published
    in relation to developments in care management arrangements, including those for
    older people with dementia. These provide information and guidance and key findings
    selected from an expansive volume of publications and are summarised in Box 2.4.
    Much of this information has been drawn from the work of the Social Services Inspectorate,
    in particular its inspections of services, special studies and annual reviews
    relating to various aspects of care management as well as reports published by
    the Audit Commission, with a wider focus including the financial aspects of care
    management. Whilst these do not provide an overarching of all official sources
    of documentation relating to care management for older people following the introduction
    of the community care reforms, they reflect particular areas of interest in the
    development and process of care management for older people including those with
    dementia. Many are derived from the period immediately after the introduction
    of the community reforms. Overall, the principal themes emerging from this diverse
    literature relating to the development of care management arrangements are: the
    importance of a differentiated approach to care management; targeting of assessment
    on those with complex needs; the need to improve approaches to assessment; and
    the comparative neglect of the monitoring and review aspect of care management
    arrangements. Each of these'
