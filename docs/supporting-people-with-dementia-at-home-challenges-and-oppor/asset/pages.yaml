    # Specialist Teams


    The aim of this section is to explore the composition of teams with responsibility
    for providing care management for older people with dementia. This encapsulates
    both the emergence of speciality by client/user group within local authorities
    and the development of teams comprising both health and social care staff. First,
    the development of speciality by user group within local authority social services
    departments is summarised. The debate regarding ‘generic’ and ‘specialist’ approaches
    to social care began with the introduction of the Seebohm Report (Cmd 3703, 1968).
    Following the creation of social services departments in 1971, there was concern
    about the need for developing specialist skills to meet the needs of particular
    client groups (Central Council for Education and Training in Social Work, 1975)
    and the development of speciality by client group within social services departments
    was noted. In the mid-eighties, Challis and Ferlie (1987) noted a trend away from
    patterns of generic working common in the days after the Seebohm reorganisation
    (Cmnd 3703, 1968) towards client group specialisation at both team level and in
    the caseloads of individual workers. The enactment of the 1989 Children Act and
    the 1990 National Health Service and Community Care'
