    # Targeting


    Targeting within care management arrangements may be defined as the process by
    which vulnerable adults with complex needs, such as those with dementia, receive
    the care package they require. The process and resultant package should therefore
    differ both in content and intensity to that received by others with less complex
    needs. The process of targeting resources occurs at two points in the care management
    process: on entry into the service and within initial assessment. In practice
    there was a wide variation in approaches to the screening of individuals prior
    to assessment (Department of Health, 1998), which is likely to mean considerable
    variation in targeting. This was demonstrated in a study undertaken with social
    services departments across England examined the eligibility criteria of their
    services for older people (Challis and Hughes, 2002). It showed that there was
    variability between departments in terms of methods of eligibility determination
    in relation to community and residential settings and in the amount of detail
    gathered in order to decide eligibility for assessment and service provision,
    particularly with regard to the identification of mental health problems in older
    people. Subsequent guidance for social services departments has attempted to improve
    this situation by providing the basis for a national framework for setting eligibility
    criteria (Department of Health, 2002c).


    At the outset, the White Paper Caring for People (Cm 849, 1989) implied that care
    management should be applied to everybody requiring community care'
