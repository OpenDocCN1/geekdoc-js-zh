    Older people with dementia referred to case managers within the scheme were initially
    assessed by members of the community mental health team for older people. As a
    consequence, they received a composite clinical mental health assessment prior
    to entering the LCMS. This enabled case managers in their assessment to focus
    on establishing a relationship with the client and their carers and to undertake
    a full appraisal of their needs and behaviours and the contribution of their existing
    network, involving family, friends, and carers. Thus, the two assessments were
    different in both form and content. The assessment undertaken by the community
    mental health team for older people was normally completed by one or two members
    within a relatively short period of time using standard documentation, the contents
    of which were subsequently reviewed by other members of the clinical team. In
    contrast, assessments undertaken by case managers were broader, encompassing information
    relating to carers and the clients'' life histories and completed over a longer
    period of time, often a number of weeks. In essence, case managers were providing
    a secondary assessment as part of support planning and long-term care. Assessment
    and management were a continuous process, with case managers facilitating participation
    and negotiation in the care process (Smale et al., 1993). A unique feature of
    the LCMS was the development a provoca known as the Case Planning and Review form
    (CAPRE), devised to meet both operational and research requirements, which was
    undertaken by case managers at both the initial and subsequent reviews.


    To understand the challenges inherent in the implementation of case management
    for older people with dementia, it is important to set it in the context of local
    service developments in relation to domiciliary care which was the most extensively
    used community service for older people with dementia. Nationally, it had been
    reported that there was much variability in domiciliary care and complex challenging
    policies across the authorities studied, noting a tendency to maximise ‘cover’
    rather than increase ‘intensity’ of the service being spread rather than targeting
    those with greatest need (SSI, 1987). The domiciliary care service in Lewisham
    during the course of the study reflected this picture. Prior to the introduction
    of the LCMS, community mental health team members had also'
