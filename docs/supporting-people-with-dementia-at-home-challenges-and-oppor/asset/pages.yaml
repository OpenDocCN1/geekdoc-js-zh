    permit other professional groups to act as a care manager (SSI/SSWG, 1991 a,b;
    Department of Health, 2002b).


    Second, in the development of the role of case management within this service
    over time, it is important to note changes to the arrangements for the management
    and supervision of case managers reflecting, in part, the evolution of its multidisciplinary
    approach. As noted in Chapter 5, at its inception the line manager and supervisor
    of the case managers, whilst closely associated with the service, was not part
    of the multidisciplinary team, but based within a specialist older team within
    the social services department. Subsequently, line management became located within
    the team, and was similar for all social workers within it. Within this arrangement
    a distinction has been made between management monitoring and clinical supervision
    (Ovreetit, 1997) with the former vested in the team manager and the latter in
    the social worker within the service. This approach is widely adopted within multidisciplinary
    teams (Ovreetit, 1997), but different to that typically adopted within local authority
    social services departments (Cypher, 2081).


    Third, the services which are essential for case management to support vulnerable
    older people with mental health problems in their homes have changed considerably
    since the end of the research study. They formerly available are illustrated in
    Table 9.2 in Chapter 9. During the study, the helpers provided the majority of
    the domiciliary care. Subsequently, the paid helper became integrated into the
    local authority home care service, as a discrete specialist service and many of
    the helpers were recruited as home carers. The local authority established a specialist
    home care team for older people with mental health problems available throughout
    the day and in the evening and weekends. As fast as possible, people supported
    by this specialist domiciliary care service was reported. Nevertheless, with the
    consequence that case managers had to purchase often from independent providers,
