    # Carers


    There has been an increasing recognition of the implications of the policy of
    community care for carers (Cm 4169, 1998; Department of Health, 2001b; HM Government,
    2008). In this study, a broad definition of carers was adopted. As described in
    Chapter 4, it encompassed all those actively involved in the care of the older
    person with dementia and receiving no payment, even if this involved visiting
    only once a month. Carer input has been costed and described in the same way as
    other inputs using opportunity cost principles in order to provide a description
    of the relative magnitude of the support provided.


    As an important component of the costs to society, the contribution of carers
    is identified in Table 9.4, which shows measured cost to carers per for both the
    experimental and control group. This composite figure has two elements: direct
    financial costs borne by carers and indirect costs primarily due to the time involved
    in caring tasks. However, it is likely that for both the experimental and control
    group may be underestimates since evidence was based on retrospective analysis
    of questionnaires and views expressed by carers rather than, a prospective diary-based
    study, as recognized in other cost data (Mcrone et al., 2008). Although the difference
    between the two groups in respect of costs to carers was not statistically significant,
    it is apparent that carers in the control group incurred higher costs per worker.
    This finding supports an observation noted in the previous chapter relating to
    outcomes for carers. In this, it was noted that there was a reduction over twelve
    months in the number of hours spent caring, for carers supported by the LCMS,
    suggesting that there were cost savings for carers compared with the control group.


    Further analysis revealed that the main component for financial cost borne by
    carers was the time involved in caring. The main carer usually provided this and
    most of this was in a face to face role. The majority of older people with carers
    had another carer providing some input. One sixth of the financial costs borne
    by carers in both the experimental and control group was to direct financial costs.
    Although a small percentage of total costs, it was significant since this measured
    real costs borne by carers. There were a number of components of this: earnings
    loss; services purchased; transport; food; laundry; clothing; fuel; and telephone
    calls. However, by far the greatest component of cost was earnings loss, recorded
    by nearly a quarter of carers. This outcome occurs with that of a subsequent study
    which showed that the biggest component of the cost of caring for an older person
    with dementia was care-giving time and carers'' earnings (Moore et al., 2001).
    Other research has found that informal care accounts for one-third of the annual
    cost of dementia care (Mcrone et al., 2008), suggesting, as hypothesised above,
    that the estimates of the costs incurred by carers within the LCMS are conservative.'
