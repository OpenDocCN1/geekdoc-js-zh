  md: '# # Chapter 9

    # The Cost of Care – Multiple Perspectives


    # Introduction


    It has become widely acknowledged in government policy and other literature that
    the long-term care of older people with dementia has attained a higher priority
    as it represents a major challenge to health and social care with an ageing population
    and rising costs (National Audit Office, 2007; Knapp et al., 2007; Committee of
    Public Accounts, 2008; Department of Health, 2008b). An expected increase in the
    numbers of older people with dementia, and in particular those aged 75 and over,
    means that service costs associated with dementia are far higher than those associated
    with other mental health problems in England, accounting for 66 per cent of all
    mental service costs (Mcrone et al., 2008). With regard to the cost of dementia
    care the biggest component of cost relates to care home accommodation (Knapp et
    al., 2007; Committee of Public Accounts, 2008).


    In this and the following chapter, the costs associated with the implementation
    of the Lewisham Care Management Scheme are explored. This chapter analyses the
    costs of care of older people with dementia receiving an intensive care service
    compared to those incurred the usual modes of care. The next chapter examines
    the personal and care characteristics of individuals receiving the care management
    scheme and those receiving the standard services in order to identify which ones
    were most associated with variations in costs. Despite the obvious importance
    of costing any new programme of care, there are a number of difficulties associated
    with such an analysis. Calculating the actual costs of services can be problematic
    (Comas-Herrera et al., 2006; Bowes, 2007) and the costing of services may be inexact
    and such data should be used with caution (Curtis, 2007). In addition, calculating
    the costs incurred by informal carers can be difficult (Lowin et al., 2001) and
    these are not always fully accounted for in cost analyses, apart from estimates
    of loss of wages which are not appropriate for retired carers (Zarit and Leitsch,
    2001). However, the importance of studying the various components of cost separately
    has also been noted, for example, in an innovative service, both professional
    time and relevant service costs should be determined in order that different flows
    of resources be identified and effectiveness broadly judged (Challis et al., 2008).


    Notwithstanding these difficulties, it was, nevertheless, possible in this study
    to carry out a comprehensive costing of all service inputs received by those in
    the experimental group and by those in the control group receiving the standard
    service, during the first year of contact with services. Similarly, a full costing
    of the contribution of carers was also undertaken'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'taking information from a range of sources. The comparison in this research
    study is between the relative costs of the experimental and control groups (Challis
    et al., 2002a) and hence the price base itself is less important. This chapter
    describes the derivation of costs, in terms of costs to agencies, costs to carers
    and aggregated costs to society. It then presents the different types of care
    provided in terms of the proportion of people in each of the groups who received
    them and the costs per year of these services. A breakdown of costs to each of
    the agencies, to family carers and to society is illustrated.


    # Derivation of Costs


    # Agencies


    This material was derived from two components: services received, and the unit
    cost of services. Both types of data were usually obtained from two sources, allowing
    cross-validation, with greatest validation effort being given to the highest cost
    services as residential and nursing home care, so as to minimise the effect of
    any error. Full details of the services and their source of record and derivation
    of price are shown in Appendix 2. Most service receipt data were collected in
    ''package'' form from interviews with either or both carers paid carers supplemented
    by special collection from service settings. Costs were allocated to all items
    of service. In respect of both residential and day care provision, estimates include
    revenue costs (salary, supplies, and central overheads) and capital costs (building,
    land, equipment and durables). Additionally, costings for day care included a
    travel component and those for residential care, a component for personal expenditure.
    For unit costing, local figures were used wherever possible, supplemented by data
    from other sources and for all items, London regional multipliers were used if
    local costs were not used directly.


    Figures in relation to both day care and residential care encompassed the concept
    of opportunity cost, which is based on the judgement that this is the cost forgone
    by using a resource in one way rather than in an alternative way. Not surprisingly,
    in practice such an approach may have to build upon available cost information,
    and in making judgements about capital elements to include, consideration of opportunity
    costs can be helpful to ensure that different accounts are treated similarly (Knapp,
    1984; 1993). For example, in respect of local authority residential settings,
    estimates of capital expenditure incorporated projected rebuilding costs. In line
    with the principle of opportunity costs, assumptions were made that the building
    had a life span of sixty years and replacement costs would increase at a rate
    of six cent per annum. This formed the basis for the not building costs included
    in the estimation of the cost of residential care. The local service context was
    also incorporated into the calculation of the cost of residential and nursing
    care by the inclusion of the occupancy levels of homes during the course of the
    study. Furthermore, it should'
