  md: '# Research Methodology


    their perspective, that of the carer, paid carer, as well as the researcher. After
    each interview, researchers recorded care summaries to capture key features of
    the care received by older people with dementia.


    The research was approved by the then Ethical Committee of Lewisham and NorthSouth
    Health Authority and supported by senior management within the local authority
    social services department, and clear ethical guidelines were drawn up. A central
    tenet of these was that the older people with dementia and their carers had equal
    and independent rights to confidentiality, including consent to participation.
    Ethical guidelines specified that interviews were strictly confidential and information
    obtained from a carer, client or provider would not be exchanged in exceptional
    circumstances. For example, researchers would contact services in response to
    a carer’s distressed state only at their request. Following an initial contact
    by letter, whenever possible the carer was asked to be present when the researcher
    was introduced to the older person in their own home. The interview with the client
    was facilitated by information previously provided by the carer, allowing the
    researcher to prompt responses from the older person about their life. Although
    carers were present at home, older people and carers were interviewed separately
    where possible and initial and follow-up interviews were completed at similar
    times of day and location. As noted earlier, in circumstances where a carer was
    involved for less than seven hours a week, or unable to spare the time for an
    in-depth interview, this was completed by a paid carer. Where two clients lived
    together and had the same main carer, carer data were included only once in the
    care analytics.


    All older people with dementia and any involved carers were interviewed immediately
    on the case management scheme by the researchers and again at six and twelve months.
    A similar practice was adopted for those in the control group when identified
    as potentially suitable. In total 215 interviews with clients and 262 interviews
    with family carers were undertaken. The latter acted both as a source of detailed
    information on the functioning of the older person with dementia as well as providing
    important ‘consumer’views about service quality and effectiveness. Occasionally,
    a paid carer was interviewed to provide details about the client’s functioning
    and their perception of the client’s needs. Altogether 132 interviews were carried
    out with paid carers, mainly home carers and related staff, and exceptionally
    wardens of sheltered accommodation and carers who were recruited as part of the
    intervention. With regard to family carers, the majority were female, caring for
    parents or parents. Over two-thirds were in contact for more than three days a
    week providing care for seven hours or more per week. This is akin to groups identified
    in other similar specialist interventions (Ashkam and Thompson, 1990; Moriarty
    and Webb, 2000). There were no differences between the carers in the experimental
    and control groups with regard to age, working status, and days per week in contact.
    Around half of carers lived either the same household or next door (47 per cent
    in the experimental group, 53 per cent in the control group).'
