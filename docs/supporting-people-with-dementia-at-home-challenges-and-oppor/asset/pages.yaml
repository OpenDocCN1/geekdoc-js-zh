    # Case Management Arrangements


    The introduction of professionally qualified social workers acting as case managers
    brought to the team a focus on the individual needs of clients and their carers
    in relation to long-term care at home, establishing a different approach to the
    prevailing ethos and orientation of the team at the inception of the study. Characteristics
    of the case management model, established during the period of the research, are
    summarised in the chapter, Box 3.2.


    As noted earlier in the chapter, the team operated an open access service which
    provided a diagnosis and assessment of the needs of older people with mental health
    problems. Furthermore, the location of the case management service within a community
    mental health team for older people meant that greater emphasis was placed on
    case screening rather than casing. Typically, people with a high level of need
    who could benefit from this aspect of the old age mental health service were referred
    to the scheme, as summarised in Box 3.3. It has been demonstrated elsewhere that
    the effectiveness of an intervention involving people with dementia can be critically
    affected by the stage of the disease (Zarit and Leitsch, 2001). Hence, the selection
    of cases for the LCMS at the appropriate point in the disease and care pathways
    was important. Although carers were informed that they could refer a client directly
    to the community mental health team for older people without referral from their
    general practitioner, team members were aware that often referrals came to the
    service too late for community care to be a feasible long-term option. This was
    observed in another study where it was noted that carers were unwilling to ask
    for help until they were in crisis (Levin et al., 1989). Team members also noted
    the difficulty of encouraging carers of older people with dementia to utilise
    the support services available. This reluctance was due in part difficulties some
    carers had in accepting the diagnosis of dementia. Similar findings have been
    reported and discussed elsewhere (Gilliard, 1992; Zarit et al., 1999; Zarit and
    Zarit, 2006). In this setting the task for case managers was to identify those
