    As earlier in the chapter, cost information was an important part of the evaluation,
    integral to the assessment of the costs and effectiveness of the new intensive
    care management scheme. The approach to cost data collection was that it met the
    criteria of comprehensiveness, and focused upon opportunity cost as a more general
    cost concept (Challis and Davies, 1986; Netten, 1994: Challis et al., 1995; Challis
    et al., 2002a; Byford et al., 2003). Opportunity cost has been described as ‘the
    value of the alternative of the assets used in the production of the service’
    (Netten, 1994). Cost analysis requires two elements, careful monitoring of the
    use of services or resources over a given time, and adequate estimates of the
    unit of each service or resource.


    As indicated in Figure 4.1, comprehensive costing was undertaken during the first
    year of all service inputs for the experimental group in receipt of intensive
    care management, and the control group receiving standard services. The price
    of services was obtained locally when possible and cross-validated with national
    price estimates. All services were costed and where variation occurred due to
    local circumstances, such as different prices for day care, contributions from
    a variety of sources were amalgamated into a single figure. The gross costs for
    services are detailed in Appendix 2. Derived from service receipts and interviews
    with family members and carers at the second and third interviews. All information
    was mapped out on a cost form for each client over their first year, recording
    which services were received in what amounts each week. To further diminish or
    error in the service receipt data collected, a simple ‘diminishing value’ principle
    of accuracy was adopted. The greatest effort to establish validity was given to
    the highest cost services, where the consequences of even a small error could
    be substantial. The costing covered all the services provided and all the costs
    connected with their delivery. Hence cost information covered a range of interest
    groups potentially affected by the intervention and encompassed costs to agencies,
    costs to carers and costs to society as a whole.'
