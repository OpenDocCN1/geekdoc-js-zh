    of questionnaires. Both standardised scales and those developed specifically for
    the study were used. The use of well-validated and reliable standardised instruments
    allowed for comparison with other studies, whilst measures devised specifically
    for the study were sometimes more suitable and briefer than standard self-completion
    measures. Indeed, it has been argued that'
