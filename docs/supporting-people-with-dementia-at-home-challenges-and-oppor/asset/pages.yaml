  md: 'In particular, average costs for different case characteristics indicates how
    achieving outcomes for people with different combinations of circumstances and
    characteristics leads to different costs. For example, using local prices from
    data collected for the study, nursing home care in the independent sector cost
    £281 per week and residential care in a specialist local authority cost £390 per
    week (1993/94 figures). The enduring relevance of these is illustrated by the
    fact that Schneider and colleagues (2003) found residential or nursing care to
    be more cost-effective for older people with more or severe dementia than community
    care. Similarly, research conducted in Taiwan (Chiu et al., 2000) noted that care
    was less effective for people with higher levels of disability when compared to
    nursing care. The approach described in this chapter, irrespective of when the
    data were collected, would permit similar judgements to be made about the relative
    cost effectiveness of care at home compared with that of residential care for
    older people in different circumstances.


    This is of particular importance in the UK as there has been a move away, for
    financial reasons, from the predominance of institutional types of care with a
    reduction in the availability of care home places following rapid growth in the
    1980s and early 1990s (Warburton and McCracken, 1999; Bauld et al., 2000a; Netten
    et al., 2003; 2005; Dalton, 2004). Consequent changes focused on a policy of care
    enabling people to remain in their own homes and, by implication, this was to
    be achieved in a more cost-effective framework than had been the case previously
    (Cm 849, 1989). Like the UK, many countries have financial incentives to delay
    for as as long as possible the admission of an older person to a care home. Thus,
    with respect to older people with dementia, studies carried out in a number of
    European countries, Canada and the USA found many country-specific processes by
    which this group of older people entered care homes (Coleman, 1995; Payne et al.,
    1999).


    # Care Packages


    In the initial analyses of the costs of care packages, female carers in the experimental
    group were associated with reduced costs for community care. However, this appeared
    to be artifactual after further examination, it was found that male carers in
    the experimental group cared for much frailer people compared carers in the control
    group. This finding may be chance or the result of targeting. Nevertheless, this
    variable was then excluded to allow possible entry of other variables.


