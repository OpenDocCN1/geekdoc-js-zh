  md: '# # Chapter 1

    # Older People with Dementia:

    The Development of Community Care


    # Introduction


    Providing integrated and co-ordinated community-based care for older people with
    dementia has gained prominence against a background of an ageing population and
    greater financial restraints in many countries. In the UK the number of people
    with dementia is growing rapidly, and is forecast to rise by 38 per cent between
    2006 and 2021, with the greatest increase among those over 80 years of age (Knapp
    al., 2007). Indeed, this age group, is more likely to need nursing, residential
    or home care, is expected to increase from 2.6 million in 2004 to 5 million by
    2031 (Government Actuary’s Department, 2006). Moreover, the numbers of older people
    with cognitive impairment are projected to increase at a faster rate than those
    with functional disability alone (Melzer et al., 1997; Comas-Herrera et al., 2007).


    Increasingly, government policies are focusing upon meeting the needs of frail
    older people in their own homes. However, a significant proportion of those requiring
    care services are likely to be the very old and those with cognitive impairment
    (Melzer et al., 1999). Additionally, in view of a continual downward trend in
    care home provision (Department of Health, 2001a; 2002a; Social Services Inspectorate
    (SSI), 2003; National Statistics, 2007), a larger number of older people with
    dementia will require further support in the community. Care management remains
    the mechanism for assessment and providing for needs, with an emphasis on transparent
    process for the allocation of resources and increased flexibility in their provision
    (Committee of Public Accounts, 2008; Department of Health, 2008a; 2009a). For
    older people with complex needs including those with dementia it is likely that
    this will continue to be co-ordinated by a care manager (Cm 6949, 2005; Cm 6737,
    2006).


    In the last two decades of the twentieth century there was increasing recognition
    of the importance of the contribution of carers to the care of vulnerable adults
    on a day-to-day basis (Cm 849, 1989; Cm 4169, 1998) and also in respect of older
    people with dementia (Levin et al., 1989; Myers and MacDonald, 1996). The White
    Papers Caring for People (Cm 849, 1989) and Modernising Social Services (Cm 4169,
    1998) have made explicit the crucial contribution of carers to the support of
    vulnerable adults. The latter allowed more potential for carers to exert influence
    over service provision, particularly with the extension of direct payments to
    this group of people (Department of Health, 2003a). However, despite this'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'focus upon greater flexibility and choice for carers, it is apparent that,
    partly to the rising age of the caring population, the availability of informal
    care may be outstripped by increases in the care needs of older people (Wanless,
    2006; Pickett et al., 2007), leading to greater demand for formal care services.


    The Lewisham Case Management Scheme (LCMS) described in detail in this book was
    designed to provide an appropriate community-based approach to the long-term care
    of older people with a diagnosis of dementia, identified as having unmet needs
    and likely to be at risk of entry to a care home, despite input from statutory
    services. The scheme was located in an existing service setting, a specialist
    multidisciplinary community mental health team for older people. Its importance
    lies not only in being one of a family of care management projects designed to
    provide effective community-based long-term care for older people who spanned
    the health and social divide (Davis and Davies, 1986; Challis et al., 1995; 2002a),
    but also was distinctive in its target population. Its subsequent evolution into
    mainstream service provision reflects its relevance to current developments in
    the care of older people with mental health problems. The research component of
    the scheme played an integral role in the management, planning, and ongoing development
    of the scheme, and therefore programme fidelity (Bond and McGowan, 1998; Teague
    et al., 1998) until it became a mainstream service within the multidisciplinary
    team. The research study compared individuals in one community mental health team
    for older people receiving case management, to those in a similar community mental
    health setting without a case management service. Older people were recruited
    to each arm of the study by applying similar referral criteria and were interviewed
    at uptake and again at six and twelve months, as were their carers. Service utilisation
    and cost information, which was collected on a comprehensive basis, was tracked
    through time over a twelve-month period.


    The scheme at the heart of this book encompasses many of the principles and practices
    central to the programme of reforms embodied in the National Service Framework
    for Older People (NSFOP) (Department of Health, 2001b). It also demonstrates the
    importance of the link between specialist health and social care in the care of
    older people with dementia (Philip and Able, 2005) and the personalisation of
    care with its emphasis on the flexible use of resources to meet assessed need
    (Department of Health, 2008a; 2009a). As prelude to this description, the first
    two chapters of the book provide a historical review of the policy context in
    which care management arrangements have evolved with the processes intrinsic to
    it and the organisational context in which it is undertaken. Thus, this chapter
    reviews a range of policy initiatives central to the evolution of community care,
    particularly in the context of the development of services for older people with
    dementia, and for their carers provides an introduction to the book as a whole.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# The Development of Community-based Services for Older People


    Arrangements for the care of vulnerable older people, including those with mental
    health problems, have changed in many ways since the advent of the Welfare State
    in the late 1940s. However, there have been few developments specific to the needs
    of older people with mental health problems and particularly for those with dementia.
