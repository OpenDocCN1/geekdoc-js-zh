    on those who were identified as the principal beneficiaries of service in this
    study. Unsurprisingly, in this research and others within this family of case
    management projects, much of the focus of the evaluation of the intervention related
    to the costs, both of service provision and the more intangible carer burden,
    and intermediate outputs such as the provision of care at home for older people
    thereby promoting their continued community tenure. Measures of final output included
    in this study related to the rate of placement in residential or nursing home
    care, the death rate and well-being of the older person and carer.


    The value of applying this framework is that it facilitated the exploration of
    the extent to case management was a viable alternative to placement in long-term
    care for older people with a diagnosis of dementia. It provided a means of examining
    the relationship between the components of service provision, their cost, and
    the impact on both individuals and services. This chapter first reviews key outcomes
    in respect of the four research questions previously described in Chapter 4. Subsequently
    the evolution of the case management scheme into a mainstream service is described.
    Finally, the relevance and value of the scheme is drawn together in the light
    of current plans for the development of dementia services and for the implementation
    of the policy of personalisation for people with dementia.'
