    # Risk of Care Home Admission


    Factors which might have prompted admission to a care home for older people living
    in the community were exploring utilisation derived from client and carer circumstances.
    Four of these were related to the client, and one to the carer''s circumstances.
    These were: associated with the level of carer distress; the client''s activities
    of daily living, including their risk of falling using evidence over the past
    6 months; behavioural difficulties such as wandering; their health; and environmental
    factors.


    As shown in Table 7.4, older people in the experimental group were rated to be
    at greater risk than those in the control group at referral in all but one of
    the domains. After six months it was estimated that there had been a decrease
    in the incidence of risks overall among the experimental group while there was
    little overall change among the control group. The reduction in risks over 12
    months for the experimental group was greatest in the clients'' activities of
    daily living and behavioural problems. It is also of the proportion of cases where
    the carer''s level of distress constituted a serious risk was halved in the experimental
    group over 12 months. In contrast, there was very little change in the control
    group in this domain over the same period. This is despite the fact that carer
    distress was rated as present in almost the same proportion of cases in both


