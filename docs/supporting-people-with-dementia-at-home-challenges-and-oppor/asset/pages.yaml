    also been observed. In a study of old age psychiatry in the UK, Dening (1992)
    reported that some community teams catered for the needs of both hospital inpatients
    as well as clients living in the community. Teams varied in the way referrals
    were made to them, with some operating an ‘open referral’ system and others only
    accepting referrals from general practitioners. They also differed with respect
    to to who carried out the initial assessment, the types of assessment schedules
    used and therapies on offer. Other factors which affected how a community team
    operated, included managerial style, and methods of prioritisation of the'
