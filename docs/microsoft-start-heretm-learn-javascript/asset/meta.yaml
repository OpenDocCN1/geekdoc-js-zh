  - 第 5 章 使用 JavaScript 处理事件
- - '##'
  - 事件是你做出反应的（或有时是故意忽略的）。考虑一下当你房子或住所的温度下降到某个值时会发生什么——例如，在我家里是 69 华氏度。当温度低于 69 度时，事件发生；该事件的处理由恒温器完成。恒温器通过启动炉炉对事件做出反应或处理。当温度从
    71 度下降到 70 度时，恒温器并不在乎；它忽略了此类事件。
