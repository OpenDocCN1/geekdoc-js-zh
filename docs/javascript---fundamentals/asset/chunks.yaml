    # Foreward


    What makes me qualified to write a book on JavaScript?


    I am a full-stack web developer who has been working in the industry for many
    years. The term full-stack simply means that I am experienced in bringing a product
    from concept all the way to completion. I have worked as a lonely contractor and
    worked my way up into the corporate world.


    As a web developer I have worked with front end and back end languages. JavaScript,
    which is a front end scripting language, has become one of my strongest assets.


    My experience with JavaScript and understanding how it fits in the bigger picture
    of web development makes me uniquely qualified to write this book.


    Who should you read this book?


    This book is meant for those who have a basic understanding of HTML, but know
    nothing about JavaScript. This book will focus on JavaScript fundamentals. This
    book is a completely separate course for those looking to learn JavaScript.


    Why should you read this book instead of the countless JavaScript books out on
    the market?


    This fundamentals course has cut out a lot of the extra stuff that tends to distract
    beginners from learning JavaScript. If you want a course that presents the material
    with a focus on eliminating convoluted concepts better suited for a more advanced
    course then this book is for you. By the end of this course you will be able to
    code JavaScript, but more importantly you will understand the underlying foundation
    of JavaScript. Ultimately, understanding JavaScript fundamentals will make you
    a better programmer and open you up to even more opportunities in the work place.


    # Chapter 1


    ## JavaScript Introduction


    What is JavaScript? JavaScript is a scripting language that can be used to make
    web pages interactive. JavaScript is not a programming language. Programming languages
    are compiled from a higher level human readable language into machine code. Instead,
    JavaScript is interpreted by web browsers, like Google Chrome, Firefox, Safari,
    and Internet Explorer. So instead of directly compiling into code that the computer
    can understand, JavaScript is interpreted. This means that different browsers
    may interpret the script differently than others. This is a common obstacle web
    developers have to deal with when attempting to create cross browser solutions.


    JavaScript is not the only thing the browsers interpret. In fact HTML, and CSS
    are also interpreted by the browser. These 3 languages are considered client side
    languages. This is because these languages are interpreted on the client side
    machine opposed to the web server. Other languages are processed by the web server;
    these are known as "Server Side" languages. In fact, server side languages are
    processed before the server "serves" the web page to the browser, while client
    side scripts are processed after the browser receives the served web page. This
    means that the server is not slowed down by executing JavaScript commands. JavaScript
    is a great way to add logic to your website without eating up server resources.


    JavaScript uses syntax similar to other languages you may have heard of: like
    C#, C++, and Java. Even though the syntax is similar, I would like to note that
    JavaScript is exactly like those other languages. While this is more of an advanced
    concept, JavaScript is known as a prototypal language. For the purpose of this
    fundamentals course it is enough to know that it is unique. Ultimately, instructions
    are written in either procedural form (in sequential order, step by step), functional
    form (encapsulating reusable sections of code inside a function), or a mix of
    the two. We will talk more about this later on in the fundamentals.


    ## JavaScript code editors


    You do not need special software to work with JavaScript. In fact you can write
    JavaScript in any standard notepad or word processing software, many of which
    come preinstalled on your computer. While these programs are sufficient for writing
    JavaScript, there are some more robust web development software programs that
    can be better used to code in JavaScript. Many of these are offered completely
    free. One of these is notepad ++, a free web development program that offers tools
    like syntax highlighting, macros that allow you to record actions and then replay
    them at the push of a button, and even third party plugins for added extensibility.


    Notepad ++ is the program that I have chosen to use when taking screenshots of
    code examples. This does not mean that this is the best web development software
    available. I chose it because it is FREE, very simplistic with a low learning
    curve, fast because it is not bloated with extra bells and whistles, customizable
    with plugins and extensive preferences. Another very important reason I chose
    this software is because it is open source, meaning that it has a community of
    developers constantly working on improving it. I personally prefer using open
    source software as a philosophical position. With all of that being said, Notepad
    ++ does not have the greatest UI design, and looks very much like it was build
    2 decades ago. Many good developers have chosen to use different software simply
    because of how ugly Notepad ++ looks. No one wants to looks like they are behind
    the times.


    Notepad ++ is only for windows operating systems, which means a large portion
    of the web development community will not be able to use this software. For this
    reason I would like to mention a few other web development programs that are commonly
    used in the industry. Atom, which is another free open source code editor with
    a modern UI. It is supported on all major operating systems. Atom is a great code
    editor. You may be asking why I didn’t use Atom instead of notepad ++. The main
    reason is that is a fundamentals course, focused on teaching JavaScript basics
    without encumbering my readers with a large number of extra features. This means
    that I consider all of cool modern features that come preloaded in Atom a distraction
    during this fundamentals course.


    Another very common software that is used across the industry is Adobe Dreamweaver.
    This is not a free program neither is it open source. It does offers a great deal
    of tools to assist web development. Among which is a more visual coding environment,
    with drag and drop features. While I understand why many people prefer to use
    this software, I have found this program to be very slow and bloated. Code generated
    by Dreamweaver tends to be bloated as well, and the code format is not always
    industry standard. I would not recommend Dreamweaver.


    It is also important to note that enterprise level organizations that incorporate
    more robust team development methods, like agile development, will use advanced
    development software. The most common software in this case is Visual Studio,
    which is also not free nor open source. Of all of the paid coding environments
    commonly used across the industry, this is the most powerful.


    No matter which code editor you use, JavaScript is the same. I encourage you to
    investigate the many options that are available to you, and pick the code editor
    that best fits your needs as a developer. There are no right or wrong choices.
    JavaScript can coded in all of them. Once you have made your decision, you will
    need to download and install your editor.


    ## Client side web development workflow

