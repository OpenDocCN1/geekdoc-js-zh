    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\001.png](Image00051.jpg)


    `While` 循环并不强调迭代。这并不意味着 `While` 循环不能用于迭代。在上面的示例中，我们从 0 计数到 9。同样的方式，我们可以在启动 `while`
    循环之前声明并初始化一个作为迭代器的变量。我们可以将迭代器的限制设置为 `While` 循环的条件，并可以在 `While` 循环内部增加或减少迭代器。然后，该迭代器就可以像
    `For` 循环一样用于遍历集合。


