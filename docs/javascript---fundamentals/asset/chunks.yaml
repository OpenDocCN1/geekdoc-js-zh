  raw: 'The “While” loop is can be used for state based logistics. A state is a predefined
    condition that is used to determine the functionality of a given aspect of code.
    State based logistics are used in graphical user interface (GUI), for example.
    When a button is pressed that button is in the down state. When it is not pressed
    it is in the up state. When a mouse is over a button it is in the hover state.
    The button has three distinct states, and they control the look and feel of that
    button in the GUI. Video games typically use state based logistics to control
    many aspects of gameplay mechanics. For example, video game A.I. tends to use
    state based logistics to determine the behavior of a non-player character (NPC).
    If the NPC has flagged a player character as hostile, the NPC will execute predefined
    tactics for hunt down the player character. If the NPC has not flagged any player
    characters as hostile, it will execute some other predefined behavior, like patrolling
    the perimeter of a building. Let’s take a look at a very simple state based “While”
    loop.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\002A.png](Image00052.jpg)


    If you were to save this page and load it in your browser you would get the following
    alert.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\002B.png](Image00053.jpg)


    ## Do While Loop


    All the other loops that we covered had conditions that were evaluated at the
    top of the code block. The condition is evaluated before the associated code block
    is executed. This means that the initial value of the iterator or state variables
    could cause the condition to evaluate to false before the code block is ever executed.
    The “Do … While” loop evaluates its condition at the bottom of the code block,
    meaning it is evaluated after the code block executes. This loop is used if you
    when you want the associated code block to run at least 1 time.


    The “Do … While” loop starts with the “do” keyword, followed by the code block.
    After the code block is the “while” keyword followed by the conditional expression
    wrapped in parenthesis. Lastly we capped it off with a semicolon. Let’s take a
    look at a “Do … While” Loop.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\003.png](Image00054.jpg)


    If you were to save this page and load it in your browser you would get the following
    alert.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\002B.png](Image00053.jpg)


    To illustrate the usefulness of a “Do … While” loop, let’s compare two loops with
    two unique iterators. Both iterators will be initialized to the value of the Loop’s
    limit.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\004.png](Image00055.jpg)


    If you were to save this page and load it in your browser you would get the following
    alert.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\004B.png](Image00056.jpg)


    Notice that the “While” loop skipped its code block because the iterator was initialized
    to the loop’s limit, but the “Do … While” loop did not skip the code block even
    though its iterator was also initialized to the loop’s limit. This is because
    the “Do … While” loop evaluated its condition at the bottom of the code block,
    causing the code block to run at least 1 time.


    Chapter 9


    ## Arrays


    JavaScript has many built in objects that are ready for use. One of the built
    objects is the Array. As mentioned earlier, an array is a collection. The Array
    is actually a collection of key value pairs. A key value pair is an identifier
    and a value that are associated to one another. Object properties are key value
    pairs. However, an Array does not explicitly define the key value pair’s key.
    It is implied by the values numerical position in the collection, which is called
    the index. Arrays are useful for storing related data while maintaining a sibling
    relationship with other key value pairs in the collection.


    Arrays can be instantiated (an instance of that object created) three different
    ways: the associative shorthand, the implicit shorthand, and using the object
    constructor. As already mentioned, the Array is an object. This means that we
    can instantiate an array just as we would an object. This is the associative shorthand.
    The implicit shorthand can be used to implicitly define the key based on the index
    of the value in the collection. The Array constructor can also be used to instantiate
    an array. A constructor is a special method that constructs the object, hence
    the name constructor. The Array constructor takes 1 parameter which determines
    the specific length of the array. Let’s take a look at these three different ways
    of instantiating an Array.


