    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\012\001B.png](Image00060.jpg)


    数组也可以有多个维度，也就是多维数组。使用多维数组可以实现越来越复杂的层次数据结构。多维数组不仅引入同级关系，还引入父子关系。例如，二维数组创建了类似于电子表格的层次结构。你可以将电子表格的行视为该电子表格列的子级。这是父子层次关系的一个例子。以同样的方式，可以使用多维数组将数据构建成更复杂的结构。让我们来看一个多维数组。


