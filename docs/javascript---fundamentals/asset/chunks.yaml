    # 前言


    什么让我资格写一本关于 JavaScript 的书？


    我是一个在行业工作多年的全栈 Web 开发者。“全栈”这个词简单意味着我具有将产品从概念带到完成的经验。我曾担任过独立承包商，也一路进入了企业世界。


    作为一名 Web 开发者，我接触过前端和后端语言。JavaScript 作为一种前端脚本语言，已成为我最强大的武器之一。


    我对 JavaScript 的经验以及对它在 Web 开发大局中地位的理解，使我具备编写这本书的独特资格。


    谁应该读这本书？


    这本书适用于那些对 HTML 有基础了解，但对 JavaScript 一无所知的人。本书将重点关注 JavaScript 的基础知识。对于想要学习 JavaScript
    的人来说，这是一门完全独立的课程。


    为什么要读这本书，而不是市面上无数的 JavaScript 书籍？


    这门基础课程去掉了许多往往分散初学者学习 JavaScript 注意力的额外内容。如果你想要一门专注于消除那些更适合高级课程的复杂概念的课程，那么这本书正适合你。在本门课程结束时，你将能够编写
    JavaScript 代码，但更重要的是，你将理解 JavaScript 的底层基础。最终，理解 JavaScript 基础知识将让你成为一名更好的程序员，并为你在职场开启更多机会。


    # 第 1 章


    ## JavaScript 简介


    什么是 JavaScript？JavaScript 是一种可以用于制作网页交互的脚本语言。JavaScript 不是一种编程语言。编程语言是从高层人类可读语言编译成机器码的。相反，JavaScript
    是由网页浏览器（如 Google Chrome、Firefox、Safari 和 Internet Explorer）解释的。因此，JavaScript 不是直接编译成计算机可以理解的代码，而是被解释的。这意味着不同的浏览器对脚本的解释方式可能与他人不同。这是
    Web 开发者在尝试创建跨浏览器解决方案时面临的一个常见障碍。


    JavaScript 不是浏览器解释的唯一内容。事实上，HTML 和 CSS 也会被浏览器解释。这 3 种语言被称为客户端语言。这是因为这些语言是在客户端机器上解释的，而不是在
    Web 服务器上。其他语言由 Web 服务器处理；这些被称为“服务端”语言。事实上，服务端语言在服务器向浏览器“提供”网页之前就已经被处理了，而客户端脚本在浏览器接收到所提供的网页之后才开始被处理。这意味着服务器不会因为执行
    JavaScript 命令而变慢。JavaScript 是为网站添加逻辑的极佳方法，且不会占用服务器资源。


    JavaScript 使用的语法与你听过的其他语言相似，如 C#、C++ 和 Java。尽管语法相似，但我想指出 JavaScript 与那些其他语言完全不同。虽然这更多是一个高级概念，但
    JavaScript 被称为**原型语言**。对于这门基础课程来说，知道它是独特性就足够了。最终，指令以过程化形式（按顺序、一步步就进）、函数形式（在函数内部封装可重用的代码段）或两者的混合形式编写。我们将在稍后的基础知识部分中详细讨论这一点。


    ## JavaScript 代码编辑器


    你不需要特殊的软件来处理 JavaScript。事实上，你可以在任何标准的记事本或文字处理软件中编写 JavaScript，其中许多软件已预装在你的电脑上。虽然这些程序对于编写
    JavaScript 足够了，但也有更健壮的 Web 开发软件可以更好地用于编写 JavaScript 代码。其中许多是完全免费提供的。其中之一是 Notepad++，它是一个免费的
    Web 开发程序，提供了诸如语法高亮、允许你录制动作并在按键时重放动作的宏，甚至还有用于增加可扩展性的第三方插件。


    Notepad++ 是我在获取代码示例截图时选择使用的程序。这并不意味着它是可用最好的 Web 开发软件。我选择它是因为它是**免费**的、非常简单且学习曲线低、因为没有冗余的胡哨功能而运行速度快、并且可以通过插件和广泛的偏好进行自定义。我选择该软件的另一个非常重要的原因是它是**开源**的，这意味着它有一个开发者社区不断致力于改进它。我个人从哲学立场上更倾向于使用开源软件。尽管如此，Notepad++
    的 UI 设计并不尽完美，看起来非常像是 20 年前构建的。许多优秀的开发者选择使用不同的软件，仅仅是因为 Notepad++ 看起来太丑了。没有人希望自己自己落后于时代。


    Notepad++ 仅适用于 Windows 操作系统，这意味着 Web 开发社区的大一部分将无法使用该软件。由于这个原因，我想提到行业内常用的其他 Web
    开发程序。Atom 是另一个具有现代 UI 的免费开源代码编辑器。它支持所有主要的操作系统。Atom 是一个非常棒的代码编辑器。你可能会问我为什么不使用 Atom
    而用 Notepad++。主要原因是这门门基础课程，专注于教授 JavaScript 基础，而不会让我的读者被大量的额外功能所困扰。这意味着我认为 Atom
    中预加载的所有酷炫的现代功能在这门基础课程期间都是一种干扰。


    另外一种在行业内通用的非常常见的软件是 Adobe Dreamweaver。这既不是一个免费程序，也不是开源的。它确实提供了许多工具来辅助 Web 开发，其中包含一个更视觉化的编码环境，具有拖放功能。虽然我理解为什么许多人倾向于使用该软件，但我发现这个程序运行非常慢且很臃肿。Dreamweaver
    生成的代码往往也很臃肿，而且代码格式并不总是符合行业标准。我不推荐 Dreamweaver。


    重要的是，整合了更健壮的团队开发方法（如敏捷开发）的企业级组织会使用高级开发软件。在这种情况下，最常用的软件是 Visual Studio，它既不是免费的也不是开源的。在行业常用的所有付费编码环境中，它是最强大的。


    无论你使用哪种代码编辑器，JavaScript 都是一样的。我鼓励你研究为你提供的许多选择，并选择最符合你开发者需求的代码编辑器。没有正确或错误之分。JavaScript
    可以在这些编辑器中编写。一旦你做出了决定，你就需要下载并安装你的编辑器。


    ## 客户端 Web 开发工作流


