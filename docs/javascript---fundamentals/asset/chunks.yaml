    我已经向你介绍了语句的所有组件。虽然这节课比之前的几节要长一点，但我相信你的大脑并没有熔化。你可以随意穿上彰显你编程实力的 T 恤。


    # 第 4 章


    ## 计算机内存


    在上一节课中，我们说值以不同的数据类型存储在内存中，而这决定了执行这些操作所需的内存量。让我们花点时间理解计算机如何在内存中存储值。


    ## 十进制


    在现代，我们使用十进制来表示数值。这些数字是你日常生活中常用的数字，数字字符为：`0`, `1`, `2`, `3`, `4`, `5`, `6`, `7`,
    `8` 和 `9`。十进制使用的基 `10`，这意味着单个数字可以表示 10 个不同的值。


    为了表示比第 10 个字符（即数字 `9`）更大的值，你需要使用 2 位数字。例如 `9 + 1 = 10`。注意数字 `10` 是由 2 个数字表示的。现在我们通常不这样看待数字。我们大多数人已经学得非常好了，以至于完全是自动的，但让我们看看十进制是如何表示这些值的。


    每个数字的值是通过一个基础公式计算的，然后最后将这些值相加。首先，我们将每个数字看作是一个从右向左书写的列表。我们需要的是该数字在列表中的位置。要计算数字的位置，我们从最右边的数字开始数到该数字，然后减去
    `1`。我们这样做是因为我们被教从数字 `1` 开始计数，但第一个数字字符实际上是 `0`。这给了我们数字的实际位置。然后我们将基数（即 `10`）升到数字位置的幂。这得到了数字的基数。接下来，我们将数字基数乘以数字的值。这得到了该特定数字表示的值。我们对所有数字执行此操作，并将它们的值相加。


    以十进制值 `10` 为例，最左边的数字是列表中的第 2 位。`2` 减去 `1` 得到数字的实际位置，即 `1`。十进制基 `10` 的 `1` 次方等于
    `10`。`10` 乘以 `1` 等于 `10`。列表中的下一个数字在第 1 位。数字的实际位置是 `0`。基 `10` 的 `0` 次方等于 `1`。`1`
    乘以 `0` 等于 `0`。最后，我们将所有数字的值相加。`10` 加上 `0` 等于 `10`。让我们写出来，以便更容易观察。


    `10 = 1 * (10¹) + 0 * (10⁰) 简化为 10 + 0 = 10`


    ## 二进制


    计算机以类似的系统表示值，但有一个主要区别。它不是使用基 `10`，而是使用基 `2`。这个系统被称为二进制系统，它的数字字符是 `0` 和 `1`。二进制中的单个字符被称为“位”（bit）。为了表示值
    `10`，你需要 4 个位。


    `10 = 1 * (2³) + 0 * (2²) + 1 * (2¹) + 0 * (2⁰) 简化为 8 + 0 + 2 + 0 = 10`


    这告诉我们 `10` 在二进制系统中表示为 `1010`。计算机将 8 位组合在一起，就像我们把字母组合成单词一样。8 位的组被称为“字节”（byte），它是计算机内存中下一个标准计量单位。


    通过单个字节，你可以表示 256 个唯一的值。你认为我们如何表示大于 256 的值？当然，我们是将字节组合在一起。数据类型是字节的标准化分组，可用于存储各种值。在讨论不同的数据类型之前，数据类型还有一个关键特征需要理解，那就是非数值值。


    ## 非数值值


    非数值值使用二进制系统存储在内存中。然而，非数值值从数值值转换为另一种类型的值。例如，文本值或枚举值。在翻译过程中，计算机使用预定义的键来确定数值应该由什么来表示。该键将特定的数值与特定的非数值相关联。这在非数值值
    `char`（字符的缩写）中最为常见。`char` 值存储单个文本字母。大多数编程语言使用 `char` 值并使用 `ASCII` 键对其进行翻译。[ASCII
    键](http://www.ascii-code.com/) 是一种标准键，它将常见的文本字符与数值相关联。例如，`ASCII` 键将十进制值 `65` 与符号
    `"A"` 相关联，将十进制值 `97` 与符号 `"a"` 相关联。


    # 第 5 章


    ## 数据类型


    JavaScript 有 6 种数据类型：`Boolean`、`Number`、`String`、`Null`、`Undefined` 和 `Object`。前
    5 个被称为原始类型，最后一个是复合类型。在今天的课程中我们将涵盖前三种类型，让我们快速回顾一下我们知道的内容。


    非数值值使用二进制系统存储在内存中。然而，非数值值从数值值转换为另一种类型的值。例如，文本值或枚举值。在翻译过程中，计算机使用预定义的键来确定数值应该由什么来表示。该键将特定的数值与特定的非数值相关联。这在非数值值
    `char`（字符的缩写）中最为常见。`char` 值存储单个文本字母。大多数编程语言使用 `char` 值并使用 `ASCII` 键对其进行翻译。[ASCII
    键](http://www.ascii-code.com/) 是一种标准键，它将常见的文本字符与数值相关联。例如，`ASCII` 键将十进制值 `65` 与符号
    `"A"` 相关联，将十进制值 `97` 与符号 `"a"` 相关联。


    ## Boolean


    JavaScript `Boolean` 数据类型是一种非数值值，它将单个位 `1` 或 `0` 分别转换为 `true` 或 `false`。


    ## Number


    JavaScript `Number` 数据类型是使用 64 位存储的数值值。注意 JavaScript 数字是双精度符号浮点。这意味着并不是所有 64 个二进制字符都严格用于表示值。事实上，第
    0 到 51 位描述多达 17 位数字的值。第 52 到 62 位用于表示十进制值的幂。第 63 位用于描述值的符号，也就是说，即该值是正的还是负的。根据这些信息，我们被告知
    JavaScript 的 `Number` 数据类型可以存储高达 `9,007,199,254,740,992` 或低至 `-9,007,199,254,740,992`
    的值。它还可以处理精确到 17 位小数的小数，例如 `0.00000000000000001` 是 JavaScript 数字数据类型可以表示的最精确数值值。如果你尝试分配一个比
    JavaScript `Number` 数据类型可以表示的更大或更精确的值，网页浏览器可能会抛出错误。


