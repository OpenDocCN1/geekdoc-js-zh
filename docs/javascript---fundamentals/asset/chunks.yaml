    这是基本的 HTML 5 结构。接下来，在页面第 7 行的 body 部分添加一个 script 标签。这将是我们编写 JavaScript 的容器。


    ![Image00001.jpg](https://https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAfaAAAAJDk5YTI5ZGVkLTk2ZmEtNDFjZi1iNmI3LWNmODY1YjgyMThmNA.png)


    在第 7 行的起始和结束 script 标签之间，我们将开始编写脚本。按照传统，初学者被指示编写的第一个程序是 hello world 程序（你好世界）。这个程序简单地在屏幕上打印“Hello
    World”短语。在 JavaScript 中，可以通过多种方式实现，但简单的方法是使用 JavaScript 中一个名为 `alert` 的内置函数。该函数有
    1 个参数，它会创建一个弹出警告窗口并在弹窗中显示传递参数的内容。让我们来看 hello world 脚本（图 3）。


