    ## While loop


    The `While` loop is the simplest form of the Loop in JavaScript. It is designed
    to loop when a condition evaluates to `true`. When the condition does not evaluate
    to `true`, the Loop is exited. While loop starts with the keyword `while`, followed
    by a condition expression wrapped in parenthesis. After that is the code block
    associated with the loop. Let’s Take a look at a `while` loop.


