    JavaScript `String` 数据类型是一个字符列表。如果你还记得我们在上一节课中讨论过的内容，我们讨论了字符。字符是非数值值，使用 ASCII
    键值将数值值转换为文本字符。一个字符是 8 位（1 字节）的内存，可以表示 256 个唯一值。字符串就是这些字符的列表。我们将在稍后的基础基础课程中讨论列表和数组，但目前你需要记住的是，从理论上讲，列表中包含的字符数量没有限制。它可以是一个只包含
    1 个字符的列表，也可以是一个包含数百个字符的列表。


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAd4AAAAJDIyY2JlOTUyLTMzMTYtNGM4My05ODQ2LTRlNTNiZTA2NjcxMg.png`](img/Image00017.jpg)


    今天我们涵盖了 3 种常见的 JavaScript 原始变量。这些是 JavaScript 世界的基础。。通过这 3 种数据类型，你几乎可以编写任何内容。还有很多内容需要介绍，但请花一点时间承认你已经完成了
    5 节基础 JavaScript 课程。如果我能用奖杯或色带来纪念这一时刻，我愿意这样做。也许你可以通过用一杯新鲜咖啡或茶开始这一天来庆祝你的脑力成就。去吧；我允许你感到成就感！


    ## 特殊数据类型


    `Null` 和 `Undefined` 数据类型有时被称为特殊数据类型。这是因为它们代表的值总是相同的值。例如，如果你声明了一个变量并将其初始化为字符串值，该变量将符合
    `String` 数据类型。你稍后可以给该变量分配不同的字符串值。这是因为 `String`、以及 `Number` 和 `Boolean` 数据类型能够表示各种值。


    ## Null


    `Null` 数据类型用于表示“无”的值。与其他数据类型不同，它只有一个 `null` 值。


    你可能什么时候会处理 `null` 值呢？比比你想创建一个函数，该函数会遍历对象集合并返回所有不等于特定对象的对象，例如。通常情况下，该函数将返回一个原始列表子集的集合，但如果原始集合只包含该特定对象会发生什么呢？当代码遍历集合时，它将跳过所有项目，因为它们都匹配。将无无返回。在这种情况下，将返回
    `null`。


    需要注意的是，JavaScript 在 `Null` 数据类型方面有一个众知的 bug。`typeof` 运算符用于确定变量是什么数据类型，然而，它返回的
    `null` 的类型是 `"object"`。这很遗憾，因为 `null` 被认为是它自己的数据类型。


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAh3AAAAJGU5ODk5NmYzLTU3NWQtNDBkYi05MGRmLTc5YmIzNGVlYWI4OQ.png`](img/Image00018.jpg)


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAgeAAAAJGFhMWI4OTY1LTcyOTctNDAxNy04N2YzLWRlZDE2YTQwNWY5Yw.png`](img/Image00019.jpg)


    ## Undefined


    与 `Null` 类似，`Undefined` 数据类型只能表示一个值。`null` 的空无与 `undefined` 的值之间存在区别。`undefined`
    值代表某些没有值的东西。它更像是一个占位值，代表本应该存在但由于某种原因或另一个原因而并不存在的值。


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAluAAAAJDVhNDNmNWRmLTJjZTgtNDE4Zi1iMGI3LTVhYjNkMmE4YWI1OQ.png`](img/Image00020.jpg)


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAleAAAAJDRhYTQ5MzY2LWUyMzgtNDBjYy04OGZlLWQxYzcxNGRjMGNmNw.png`](img/Image00021.jpg)


    在变量声明之后但在初始化之前，该变量的数据类型为 `Undefined`，且值为 `undefined`。这是 `undefined` 值最常见的情况。一旦给变量分配了不同数据类型的值，它将符合该数据类型并存储该值。`undefined`
    值在检查函数参数是否被省略时有用。JavaScript 不会抛出错误，而是将变量赋值为 `undefined`。此外，如果函数没有显式返回一个值，它将返回值
    `undefined`。另一种常见体验 `undefined` 值的方式是，当你尝试访问不存在的对象属性时。大多数其他语言都会抛出错误，但 JavaScript
    则返回值 `undefined`。


    ## Object


    对象是面向对象编程 (OOP) 的，而 JavaScript 是一种 OOP 形式。在现实世界中，我们被对象包围，而 OOP 是一种获取概念并将其应用于代码的方法。在现实世界中我们被对象包围，OOP
    是一种将现实世界的概念应用于代码的方法。例如，一个苹果是一个对象。


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAiXAAAAJGE5MTc4MWU2LTFhYjAtNGE1NS1hODk2LTZjYTY3IwNjYzZA.png`](img/Image00022.jpg)


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAflAAAAJDdlNjZGJlLTRmNDQtNDNmZS1hZjk3LTI2MmmOWVkODliMg.png`](img/Image00023.jpg)


    在上面的示例中注意第 8 到 14 行我们声明了一个变量并对其初始化了一个值。该值被包裹在大括号 `{` 和 `}` 中。这指示 JavaScript 该值是
    `Object` 类型。在大括号内部，我们有一组逗号分隔的变量和值。每个变量都有一个标识符、作为赋值运算符的冒号以及变量的初始值。注意对象的每个属性省略了
    `var` 关键字，这是声明对象属性的语法，与声明变量不同。你可以通过在对象标识符后加上点并跟属性标识符来访问对象属性。此外，注意第 22 行我们访问了一个未声明的属性，返回的值是
    `undefined`。


    通过 JavaScript 对象，你可以开始将现实世界对象转换为数字对象。通过一点动力，你甚至可以创建一个现实世界的矩阵模拟。只要记住蓝色药丸，尼奥！明天回来，因为我们将涵盖函数。


