  raw: 'Notice in line 1 we have our hello world script. I have duplicated this line
    2 times and added in some whitespace. In line 2 there are spaces and tabs between
    the word "alert" and the string literal warped in parenthesis, as well as the
    semicolon. On lines 3 and 4 a carriage return was entered between the word "alert"
    and the remainder of the statement. All three of these statements are identical
    to JavaScript. 


    ## Case Sensitive


    JavaScript is a case sensitive language. This means that JavaScript detects if a
    letter in part of a statement is upper case or lower case. A lower case letter
    is not the same as an uppercase letter, and by simply changing the case of the
    letter you are ultimately telling JavaScript a completely different instruction.
    This primarily affects how you name things in JavaScript, and is the bane of many
    a programmer. Often time bugs in code are simply a letter in the wrong case, and
    can be hard to detect as our minds tend to skip over the case of a letter. 


    ## Code Blocks


    Sometimes statements need to be grouped together, as in a function or when dealing
    with conditions. When grouping statements together they are wrapped in curly braces
    "{" and "}". 


    ![https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAlbAAAAJDRhMmE1MzJhLWQwYTAtNGY5Mi05ZTkxLTQ5OTI3NzhhYTlhYQ.png](Image00008.jpg)


    If we look at lines 8 to 11 we can see our first custom function, which contains
    2 statements. We are not ready for functions just yet, but notice how lines 9
    and 10 are wrapped with the curly braces (end of line 8 and beginning of line
    11). This means that the statements are grouped together. Any time that this function
    is called, it will perform all the statements in the group in sequential order.
    Code blocks are essentially what they sound line, block of code that are grouped
    together.


    Often times it is the case the fixing errors is a way of life for programmers.
    Like with any craft, the better you know your tools the better you will be at
    using them. These 4 concepts of JavaScript syntax will be useful in writing code
    without errors. 


    Chapter 3


    ## Components of a statement


    There are 5 components of a JavaScript statement: Values, Expressions, Operators,
    Keywords, and Comments.


    ## Values


    There are two types of values in JavaScript. We mentioned a string literal in
    our last lesson. A string literal is the value of a string represented literally.
    Similarly, a literal value is the value of a specific data type represented literally.
    All value types can be represented in literal form. Values can also be stored
    in the computer’smemory, in a placeholder called a variable. 


    In most programming languages, including JavaScript, you have to declare your
    intent to store data in memory by associating it with an identifier. This is known
    as declaring a variable, and ultimately it allows the computer to set aside a
    predetermined amount of space to be used as a storage container for data. It is
    also important to point out at this point that values are represented in memory as
    different data types. Primarily a data type defines how much memory a value takes
    up. We will cover this in greater detail later on.


    Literal values cannot change. The number 7 is a literal number value. It will
    always be of the numerical value 7\. It will never be equal to 8, neither will
    it be equal to the string value of "seven." Literal values are often used when
    setting the starting value of a variable, a practice called initializing a variable.


    Unlike literal values, variables can change. If I were to declare a variable called
    myVariable and initialize it at a value of 7, I could later assign that same variable
    a different value. Let’s take a look at what literal values and variables look
    like in JavaScript.


    ![https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAcvAAAAJGE4OGYyNGZhLWI0YTMtNGNhNy04ZWMyLTcwMTFlMzM2YTE1Mw.png](Image00009.jpg)


    Notice on line 9 we are setting the value of myVariable to be equal to the numerical
    value 7\. Immediately after that, in line 10, we are setting myVariable equal
    to 8\. The value that is stored in memory starts off as 7 but will be 8 when the
    script is done. 


    ## Expressions


    An expression is part of a statement that returns a value or evaluates to a value.
    A statement can contain 1 or more expressions in it.  Expressions contain operands
    and operators. An expression is a shorthand function that performs an operation
    on operands. The shorthand has a left hand operand, an operator, and then a right
    hand operand. In the Expression A + B:  A is the left hand operand, B is the right
    hand operand, while + is the operator.


    The following are example expressions:


    1 + 1 is an expression that returns the numerical value 2.


    1 > 2 is an expression that evaluates to a Boolean value false.


    "Hello " + "World" is an expression that returns the string value "Hello World". 


    ## Operators


    An Operator is used to indicate which operation should be performed in an expression.
    There is another factor that determine what operation is performed, and that is
    the data type of the operands. If A and B were both numerical values then the
    + operator would indicate an operation of addition. If either the A or B operands
    were of type string this would indicate anoperation of concatenation (combining
    multiple strings together). For an exhaustive list of operators I suggest using [w3schools.com ](http://www.w3schools.com/jsref/jsref_operators.asp)as
    a reference. 


    ## Keywords


    Keywords are reserved words that have specific meaning to the JavaScript language.
    The keywords cannot be used as identifiers, as they already are associated with elements
    at the core of the language itself. In our previous example (fig. 1) we were already
    using a keyword to declare our intention of storing a value in memory. Notice
    on line 8 the keyword var, which is short for variable. We use var to declare
    a variable in JavaScript. We will go over specific keywords as they naturally
    are of use to us during this fundamental.


    ## Comments


    Comments are lines of text that in JavaScript that are not executed by the computer.
    They are used to explain complex code. There are two ways of inserting comments
    in JavaScript. The double forward slash // at the beginning of a comment will
    make all text that appears after it on the same line a comment. You can also wrap
    text with the /* and */ characters to mark all text between them as a comment.
    This method of commenting, unlike the first, persists beyond the end of a line
    and can span multiple lines.


    ## Tying it all together


    You may be asking yourself why you would want to store a value in memory. Let’stake
    a look at a more practical script to illustrate the usefulness of variables (fig.
    2)


    ![](Image00010.jpg)


    In the above script we are declaring a variable called myName. Next we are calling
    the function prompt. Prompt is a built in JavaScript function that will show a
    popup window with a text box and a question or prompt to the user. Once the user
    enters in their response in the text box and clicks the "Ok" button the value
    that the user typed is returned. We are then assigning our variable myName to
    be equal to the value that the prompt function returned. The script continues
    to the next statement, which calls the alert function. We are familiar with what
    the alert function does, but notice how I am concatenating (combining) the two
    string values together. What do you think will appear in the alert box?


    ![https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAjpAAAAJDY5MmYwOTJhLWZmNjMtNDIwZC05YzdjLWVkZGYzZGRiMWZjZA.png](Image00011.jpg)


    When I opened this page and filled out the prompt with my name it remembered what
    I typed in. It then used that value in a later instruction to alert the welcome
    message "Hello, Brennien Coker” to the popup'
