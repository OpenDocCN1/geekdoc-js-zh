    注意第 1 行，我们有一个 hello world 脚本。我将这一行复制了 2 次并添加了一些空格。在第 2 行中，`alert` 单词与括号包裹的字符串字面量之间有空格和制表符，还有分号。在第
    3 行和第 4 行，`alert` 单词与语句的其余部分之间了回车。这三个语句在 JavaScript 中是完全相同的。


    ## 大写敏感


    JavaScript 是一种大小写敏感的语言。这意味着 JavaScript 会检测语句某部分的字母是大写还是小写。小写字母不等于大写字母，通过简单改变字母的大小写，你最终是在告诉
    JavaScript 执行一个完全不同的指令。这主要影响你在 JavaScript 中命名事物的方式，也是许多程序员的噩梦。很多时候代码中的 bug 仅仅是字母的大小写错误，而且很难检测，因为我们的大脑倾向于忽略字母的大小写。


    ## 代码块


    有时候语句需要组合在一起，例如在函数中或处理条件时。当将语句组合在一起时，它们被包裹在花括号 `{` 和 `}` 中。


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAlbAAAAJDRhMmE1MzJhLWQwYTAtNGY5Mi05ZTkxLTQ5OTI3NzhhYTlhYQ.png`](img/Image00008.jpg)


    如果我们看第 8 到 11 行，可以看到我们的第一个自定义函数，它包含 2 条语句。我们还没有准备好学习函数，但注意第 9 行和第 10 行是被花括号包裹的（第
    8 行结束和第 11 行开始）。这意味着语句被组合在起。每当调用此函数时，它都会按顺序执行组中的所有语句。代码块本质上如其名，即组合在一起的代码块。


    通常情况下，修复错误是程序员的生活。就像任何工艺一样，你对工具越了解，使用它们时表现就越好。这 4 个 JavaScript 语法概念对于编写无错误的代码非常有用。


    # 第三章


    ## 语句的组成部分


    JavaScript 语句有 5 个组成部分：值 (Values)、表达式 (Expressions)、运算符 (Operators)、关键字 (Keywords)
    和注释 (Comments)。


    ### 值


    JavaScript 中有两种类型的值。我们在上一节中提到了字符串字面量。字符串字面量是字面表示的字符串的值。同样，字面量值是特定数据类型的字面表示的值。所有值类型都可以用字面形式表示。值也可以存储在计算机内存中，称为变量的占位符。


    在大多数编程语言（包括 JavaScript）中，你必须通过将数据与标识符关联来声明你在内存中存储数据的意图。这被称为声明变量，最终允许计算机留出预留空间作为数据的存储容器。现在需要指出的一是，值在内存中以不同的数据类型表示。数据类型主要定义了一个值占用多少内存。我们稍后会详细介绍。


    字面量值不能改变。数字 `7` 是一个字面数字值。它将始终是数值 `7`。它永远不会等于 `8`，也不会等于字符串值 `"seven"`。字面量通常用于设置变量的初始值，这种做法被称为初始化变量。


    与字面量值不同，变量可以改变。如果我声明一个名为 `myVariable` 的变量并初始化为 `7`，我之后可以给该变量分配不同的值。让我们看看 JavaScript
    中的字面量和变量看起来什么样。


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAcvAAAAJGE4OGYyNGZhLWI0YTMtNGNhNy04ZWMyLTcwMTFlMzM2YTE1Mw.png`](img/Image00009.jpg)


    注意第 9 行，我们将 `myVariable` 的值设置为数值 `7`。紧随之后，在第 10 行中，我们将 `myVariable` 设置为 `8`。内存中存储的值初始为
    `7`，但在脚本执行时将变为 `8`。


    ### 表达式


    表达式是语句的一部分，返回一个值或评估为一个值。语句可以包含 1 个或多个表达式。表达式包含操作数和运算符。表达式是一个对操作数执行操作的简写函数。该简写包含一个左操作数、一个运算符和一个右操作数。在表达式
    `A + B` 中：`A` 是左操作数，`B` 是右操作数，而 `+` 是运算符。


    以下是表达式示例：


    - `1 + 1` 是一个返回数值 `2` 的表达式。

    - `1 > 2` 是一个评估为布尔值 `false` 的表达式。

    - `"Hello " + "World"` 是一个返回字符串值 `"Hello World"` 的表达式。


    ### 运算符


    运算符用于指示在表达式中应该执行什么操作。另一个决定执行何种操作的因素是操作数的数据类型。如果 `A` 和 `B` 都是数值，那么 `+` 运算符将表示加法操作。如果操作数
    `A` 或 `B` 任意一个是字符串类型，则表示拼接操作（将多个字符串组合在一起）。关于运算符的完整列表，我建议参考 [w3schools.com](http://www.w3schools.com/js/js_operators.asp)。


    ### 关键字


    关键字是 JavaScript 语言中具有特定含义的保留字。关键字不能用作标识符，因为它们与语言的核心元素相关。在我们之前的示例（图 1）中，我们已经使用关键字来声明在内存中存储值的意图。注意第
    8 行的关键字 `var`，它是 variable 的缩写。我们使用 `var` 在 JavaScript 中声明变量。稍后我们将介绍特定的关键字，因为它们在基础阶段很有用。


    ### 注释


    注释是 JavaScript 中不被计算机执行的文本。它们用于解释复杂的代码。在 JavaScript 中插入注释有两种方法。注释开头的双斜杠 `//` 将同一行之后的所有文本变为注释。你也可以使用
    `/*` 和 `*/` 字符包裹文本，将它们之间的所有文本标记为注释。这种注释方法与第一种不同，它可以跨越行。


    ## 整合一切


    你可能在问自己为什么要在内存中存储值。让我们来看一个更实用的脚本来说说明变量的用处（图 2）


    ![](img/Image0010.jpg)


    在上面的脚本中，我们声明了一个名为 `myName` 的变量。接下来我们调用函数 `prompt()`。`prompt()` 是一个内置 JavaScript
    函数，会显示一个带有文本框和向用户提问弹出窗口。一旦用户在文本框中输入响应并点击“确定”按钮，用户输入的值就会返回。然后我们将变量 `myName` 分配为
    `prompt()` 函数返回的值。脚本继续执行下一个语句，调用 `alert()` 函数。我们熟悉 `alert()` 函数的作用，但注意我是如何将这两个字符串值拼接（组合）在一起的。你认为
    alert 框中会出现什么？


    ![`media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAjpAAAAJDY5MmYwOTJhLWZmNjMtNDIwZC05YzdjLWVkZGYzZGRiMWZjZA.png`](img/Image00011.jpg)


    当我打开此页面并在 prompt 中填写我的名字时，它记住了输入的内容。随后，它在随后的指令中使用该值，在弹出窗口中显示欢迎消息 `"Hello, Brennien
    Coker”。


