    it with a value. The value is wrapped in the curly braces { and }. This indicates
    to JavaScript that the value is of the type Object. Inside the curly braces we have
    a list of variables and values separated by a comma. Each variable has a name
    identifying it, a colon which acts as an assignment operator, the variables initial
    value. Notice that each of the objects properties omit the var keyword, this is
