    # JavaScript 条件语句


    ## 逻辑语句与比较运算符


    条件由一个或多个逻辑语句定义。多个逻辑语句可以使用逻辑运算符组合。逻辑语句的求值结果真（true）或假（false），但并非所有语句都是逻辑语句。注意，语句
    `5 + 5` 返回的不是逻辑真或假，而是数值值 10。然而，如果我们在末尾使用“等于”运算符，它就变成了一个逻辑语句。`5+5==10` 是一个逻辑语句，其求结果为真，因为
    5 加上 5 等于 10。`==` 运算符被归类为比较运算符。比较运算符比较两个值并返回一个布尔值（Boolean）。关于每个比较运算符和逻辑运算符的详细解释超出了本课程的范围。不过，我建议查看以下网站以进一步了解：


    ## The If 条件语句


    让我们创建一个接受一个名为 `test` 的字符串参数的函数。在这个 `test` 函数中，我们将使用 JavaScript 的字符串内置功能，它会将字符串值转换为全小写字母。然后，我们将字符串参数的小写值与字面量字符串值进行比较。如果它等于该字符串字面量，我们将
    `alert` 一个响应。我们将调用这个 `test` 函数 2 次，第一次我们将传入一个会匹配的值；第二次我们将传入一个不匹配的值。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\001A.png](Image00029.jpg)


    如果你保存此页面并在浏览器中加载它，将得到以下警报。


    第一次调用 `test` 函数的警报：


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\001B.png](Image00030.jpg)


    第二次调用 `test` 函数的警报：


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\001C.png](Image00031.gif)


    注意，第二次调用 `test` 函数弹出了 `undefined` 值。这是因为我们作为参数传递给函数的值在第 10 行的条件语句中没有求值为真，因此被跳过了。变量
    `RTN` 由于未初始化，其数据类型为 `undefined`。


    你认为如果在条件语句之后为 `RTN` 变量赋值一个值会发生什么？让我们来看看。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\002A.png](Image00032.jpg)


    如果你保存此页面并在浏览器中加载它，将得到以下警报。


    第一次调用 `test` 函数的警报：


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\002B.png](Image00033.jpg)


    第二次调用 `test` 函数的警报：


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\002C.png](Image00034.jpg)


    注意，两个警报都显示了我们在条件语句之后赋值给 `RTN` 变量的值。即使第一次调用 `test` 使用的值在函数的条件语句中求值为真。这是因为在编程中，代码是按顺序执行的。在第一次调用
    `test` 函数时，条件求值为真，并将值“hello”赋值给 `RTN` 变量。然而，函数尚未结束，它会继续执行到最后。这意味着第 13 行将会在执行。第
    13 行为 `RTN` 变量赋值了一个不同的值，覆盖了原始值，然后我们返回 `RTN` 变量。在两次调用中，第 13 行都会执行，这就是为什么两个警报都显示了该值。


    ## The Else 条件语句


    大多数编程语言都有一个“Else”语句，可以补充“if”语句。当条件求值为假时，执行 `else` 语句。让我们来看 `if/else` 语句。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\003A.png](Image00035.jpg)


    如果你保存此页面并在浏览器中加载它，将得到以下警报。


    第一次调用 `test` 函数的警报：


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\003B.png](Image00036.jpg)


    第二次调用 `test` 函数的警报：


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\003C.png](Image00037.jpg)


    注意，`if/else` 条件语句通过评估条件语句为真或假来控制执行哪个代码块。`if/else` 语句（也称为 `if then else` 语句）是条件语句最基本的形式。通过它们，你可以控制特定代码块何时执行。


    有时，你需要连续地评估多个条件。在这些情况下，你可以在 `if` 语句内部另一个 `if` 语句，这被称为嵌套 `if` 语句。就像俄罗斯娃娃一样，这些 `if`
    语句嵌套在彼此内部。让我们来看看嵌套的 `if` 语句。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001A.png](Image00038.jpg)


    如果你保存此页面并在浏览器中加载它，将得到以下警报。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001B.png](Image00039.jpg)


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001C.png](Image00040.jpg)


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001D.png](Image00041.jpg)


    ## Else If


    嵌套 `if` 语句的问题在于很难追踪你的代码关联哪个 `if` 语句。此外，语法变得有些复杂，容易错错大括号并引起语法错误。`else if` 语句是评估多个条件的另一种解决方案。`else/if`
    比嵌套的 `if` 语句清晰得多，因此不太可能导致大括号错误。有人说 `else/if` 是 JavaScript 中评估多个条件的最佳方法。


    `else/if` 语句非常直观，正如你所怀疑的那样，它使用 `else` 关键字后跟 `if` 关键字。接下来是在括号内的条件表达式。之后是关联的代码块。让我们来看
    `else/if` 语句。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\002.png](Image00042.jpg)


    如果你保存此页面并在浏览器中加载它，将得到与我们之前的示例完全相同的警报。


    ## Switch


    虽然 `else/if` 语句比嵌套的 `if` 语句清晰，但有些人认为它难以阅读。`switch` 语句是评估多个条件的完全不同的方法，提供了更易读的代码。需要注意的是，在
    JavaScript 中 `switch` 语句略比 `else/if` 语句慢。如果你的代码正在评估一组条件并影响了页面加载时间，请考虑使用 `else/if`
    语句而不是 `switch` 语句。


