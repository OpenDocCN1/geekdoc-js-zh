    # 第章


    ## 循环


    JavaScript 允许你使用循环多次执行代码块，而无需多次编写。JavaScript 中有不同的循环：`For` 循环、`For … In` 循环、`While`
    循环和 `Do … While` 循环。我喜欢将这些进一步分为两类：有限循环和无限循环。`For` 循环和 `For … In` 循环都是有限循环。这是因为它们对执行的循环次数都有限制。这个限制在循环语句中显式定义。`While`
    循环和 `Do … While` 循环是无限循环。这是因为没有对执行的循环次数设置显式限制。相反，它们会无限循环直到满足某个条件。


    循环对于迭代（Iteration）非常有用。迭代是对某种集合中的成员执行代码块的过程。之前我们已经涵盖了对象，对象被视为一种集合。对象是属性的集合。请注意，JavaScript
    中内置了其他集合。最著名的是 `Array`，我们将在课程稍后部分介绍它。现在，知道存在不同类型的集合，并且可以使用循环来遍历它们即可。


    所有对象都有一个内置方法，称为 `For Each` 方法。最终，`For Each` 方法是一个 `For … In` 循环，它执行回调函数而不是代码块。出于这个原因，它不被视为一种独特的循环。知道其他语言将
    `For … In` 循环称为 `For Each` 循环可能会有用。


    ## For


    `For` 循环以 `for` 关键字开头，后面跟着 3 条包裹在括号内的语句。第一条语句在循环开始之前执行。它用于声明和初始化迭代器变量。迭代器变量最常见的标识符是字母
    `i`，它代表 `iterator`（迭代器）。第二个语句在每个循环的顶部评估，它通常定义了迭代器的限制。一旦迭代器达到限制，循环即完成，不再执行更多循环。最终，这是一个条件语句。当该语句评估为
    `true` 时，循环继续下一个循环。当它评估为 `false` 时，退出循环。第三条语句在每个循环的底部执行，它通常会修改迭代器。迭代器通常在这条语句中使用递增运算符
    (`++`) 将值增加 1。然而，情况并非总是如此。迭代器可以增加或减少大于 1 的值，并且可以使用其他运算符。这意味着你可以以不同的间隔按升序或降序顺序遍历列表。递增运算符返回一个等于值
    `+ 1` 的值。它是编写 `myValue = myValue + 1;` 的简写，看起来像这样：`myValue++;`。让我们来看一个 `For` 循环。


