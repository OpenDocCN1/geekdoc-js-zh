    # JavaScript Conditionals


    ## Logical Statements and Comparison Operators


    The condition is defined by one or more logical statements. Multiple logical statements
    can be combined using the logic operators. Logical statements will either evaluate
    to true or false, but not all statements are logical statements. Notice that the
    statement `5 + 5` does not return a logical true or false, but a numerical value
    of 10. However, if we use the "is equal to" operator at the end it then becomes
    a logical statement. `5+5==10` is a logical statement that evaluates to true because
    5 plus 5 is equal to 10. The `==` operator is classified as a comparison operator.
    Comparison operators compare two values and return a Boolean value. A detailed
    explanation of each of the comparison operators and the Logical operators is outside
    the scope of the course. However, I would suggest looking at the following sites
    for


    ## The If Conditional Statement


    Let’s create a function that takes 1 string parameter called `test`. In this `test`
    function we will use a built in JavaScript feature for strings that will return
    the string value converted to all lowercase letters. We will then compare the
    lower case value of the string parameter with a literal string value. If it is
    equal to the string literal then we will `alert` a response. We will call this
    `test` function 2 times, the first time we will pass a value that is going to
    match. The second time we will pass a value that will not match.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\001A.png](Image00029.jpg)


    If you were to save this page and load it in your browser you would get the following
    alerts.


    Alert from the first call to the test function:


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\001B.png](Image00030.jpg)


    Alert from the second call to the test function:


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\001C.png](Image00031.gif)


    Notice that the second call to the `test` function alerts a value of undefined.
    This is because the value we passed into the function as a parameter did not evaluate
    to true in the conditional statement on line 10, and therefore was skipped. The
    variable `RTN` having not been initialized was of data type undefined.


    What do you suppose would happen if we assigned a value to the `RTN` variable
    after the conditional statement? Let’s take a look.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\002A.png](Image00032.jpg)


    If you were to save this page and load it in your browser you would get the following
    alerts.


    Alert from the first call to the test function:


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\002B.png](Image00033.jpg)


    Alert from the second call to the test function:


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\002C.png](Image00034.jpg)


    Notice that both alerts show the value we assigned the `RTN` variable after the
    condition statement. Even though the first call to `test` used a value that evaluated
    to true in the function’s conditional statement. This is because in programming
    code is executed in sequential order. In the first call to the `test` function
    the condition evaluates to true and assigns the value “hello” to the `RTN` variable.
    However, the function is not done, so it continues to execute all the way to the
    end. This means that line 13 will be executed next. Line 13 assigns a different
    value to the `RTN` variable, overwriting the original value, and then we return
    the `RTN` variable. In both calls line 13 is executed, and this is why both alerts
    showed that value.


    ## The Else Conditional Statement


    Most programming languages have an “Else” statement that can complement the “if”
    statement. The else statement is executed when the condition evaluates to false.
    Let’s take a look at an if/else statement.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\003A.png](Image00035.jpg)


    If you were to save this page and load it in your browser you would get the following
    alerts.


    Alert from the first call to the test function:


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\003B.png](Image00036.jpg)


    Alert from the second call to the test function:


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\008\003C.png](Image00037.jpg)


    Notice that the if/else conditional statement controls which block of code is
    executed by evaluating a conditional statement to true or false. If/Else statements
    also called if then else statements are the most basic form of the conditional
    statement. With them you can control when specific code blocks are executed.


    Sometimes you need to evaluate multiple conditions consecutively, one after the
    other. In these cases you could have an If statement inside another if statement,
    which is called nested If statements. Like the Russian nesting dolls these If
    statements fit inside each other. Let’s take a look at a nested If statement.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001A.png](Image00038.jpg)


    If you were to save this page and load it in your browser you would get the following
    alerts.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001B.png](Image00039.jpg)


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001C.png](Image00040.jpg)


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\001D.png](Image00041.jpg)


    ## Else If


    The problem with nested If statements is that it is very easy to lose track of
    which if statement your code is associated with. Also the syntax becomes somewhat
    convoluted which makes it easy to misplace a curly brace and cause a syntax error.
    Else/ if statements are another a solution for evaluating multiple conditions.
    The Else/If is a much cleaner conditional statement than the nested If statements,
    and therefore less likely to be the cause of a misplaced curly brace. Some have
    said that the Else/If is the best performing way in JavaScript to evaluate multiple
    conditions.


    The Else/If statement is straight forward, and as you may suspect it uses the
    Else keyword followed by the If keyword. Next in line is the conditional expression
    wrapped in in parenthesis. After that is the associated code block. Let’s take
    a look at an Else/If statement.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\002.png](Image00042.jpg)


    If you were to save this page and load it in your browser you would get the same
    exact alerts as our previous example.


    ## Switch


    While the Else/if Statement is cleaner than nested If statements some consider
    it hard to read. Switch statements are a completely different approach to evaluating
    multiple conditions, that offers reader friendly code. It is of note that in JavaScript
    the switch statement is slightly slower than the Else/If statement. If your code
    is evaluating a large group of conditions and page load times are being affected,
    consider using the Else/If statement instead of the Switch statement.


    The switch statement defines the switch value and then compares it to multiple
    case values. The switch value is defined in the switch expression, and the case
    values are defined by each individual case / break expressions. The case / break
    expressions indicate a value and a code block. The case value is compared to the
    switch condition, with the "is equal to" (`==`) comparison operator by default.
    This comparison is implied, and the operator is not explicitly in the code of
    a switch statement. When the switch statement and the case value are compared
    and evaluated to true, the code associated with the case value is executed. Otherwise
    the associated code is skipped.

