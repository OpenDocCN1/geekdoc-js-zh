    # Functions


    Functions allow you to encapsulate a code block, essentially wrapping it up in
    a capsule that separates the code inside from the code outside. This capsule of
    code can be called multiples times and in different locations, each time the encapsulated
    code will execute. Calling a function is just 1 line of code, even though the
    function’s code block may be calling hundreds of lines of code.


    Imagine you had a process that was 5 steps long, and you wanted to be able to
    perform that process multiple times in various locations in your code. You could
    write the 5 step process in each location, but this is tedious to write. It also
    makes this code hard to manage. If you needed to update the 5 step process and
    insert a step between steps 1 and 2, you would have to touch each location to
    make the update. If you encapsulate this process into a function you only have
    to update it once. To update the encapsulated code you simply change the code
    inside the function, which will in turn be the code that is executed each time
    the function is called.


    ## Scope and Parameters


    Encapsulation requires that the variables declared inside the encapsulated code
    block be completely separated from the variables declared outside of the function.
    This necessary feature of encapsulation is called Scope. Scope is a concept that
    determines which variables and functions are visible in a given code block. Code
    that is written outside of all other functions is said to be globally scoped,
    and therefore visible to all other scopes. However, a code block that has been
    encapsulated in a function is in essence in a different scope. If you were to
    call a function from within another function, the variables defined in each function
    would be in different scopes, and therefore not visible to one another.


    Sometimes you may want to allow some variables outside of the function to pass
    into the function code block so that that variable value can be acted upon. Functions
    allow you explicitly list variables that should be allowed to enter into the functions
    code block. This list is called the parameter list. A parameter is a variable
    placeholder that can be filled when the function is called.


    We will cover the 4 ways functions are commonly used in JavaScript: declared function,
    function expression, immediately-invoked function expression, and a method.


    ## Function Types


    ### Declared Function


    The most common form of the function is the declared function. A declared function
    starts with the keyword `function` followed by the function identifier. Next is
    a comma separated parameter list wrapped in parenthesis. Finally the function’s
    code block wrapped in curly bracers. Let’s take a look at a declared function
    that has 2 parameters. We will multiply `parameter1` by `parameter2` and return
    the result.


    ![](Image00024.jpg)


    Notice that line 15 is making a call to the function we declared and is passing
    `9` and `9` as values for the two parameters. If you were to save this page and
    load it in your browser you would get the following alert.


    ![](Image00025.jpg)


    ### Function Expression


    The function expression is a less common form of a function then the declared
    function. However, function expressions can be very powerful. Function expressions
    allow you to overwrite previous implementations of a function. This technique
    is outside the scope of this fundamental course. It is sufficient to know how
    to write a function expression.


    ![](Image00026.jpg)


    Notice the difference on line 9. First you declare a variable, giving it the identifier
    that you will use to call the function. You then use the assignment operator to
    assign a function to the variable with the `function` keyword. Notice that after
    the `function` keyword we have omitted the function identifier. This is because
    the identifier is already stated, it is the identifier associated with the variable.
    Next is the parameter list and function block, the same as with a declared function.
    If you were to save this page and load it in your browser you would get the following
    alert.


    ![](Image00025.jpg)


    ### Immediately-Invoked Function Expression (IIFE)


    In our last two examples we have been calling the function later on in the code.
    What if you wanted to call the function as it were being declared? In these rare
    cases you would use an immediately-invoked function expression or `IIFE` (pronounced
    “if-fee”). `IIFE`’s are most commonly used to do something on page load, as soon
    the code is reached in the sequential order, it will perform it’s code block.
    Now of course this can also be done using declared functions, and function expressions
    as well, but the `IIFE` uses less lines of code. Let’s take a look at an `IIFE`.


    ![](Image00027.jpg)


    First of all notice how fewer lines of code are required when compared to our
    first two examples. It is 1 line shorter, and does exactly the same thing. An
    `IIFE` is essentially a function expression wrapped in parenthesis and immediately
    followed by a comma separated value list wrapped in parenthesis. This value list
    contains the values that will be passed as the function’s parameters. Because
    this function returns a value we need to capture that returned value. Notice in
    Line 9 we are first declaring a variable and then assigning it the value that
    the function returns using the assignment operator. Next we see a function expression
    wrapped in parenthesis, directly followed by a value list. If you were to save
    this page and load it in your browser you would get the following alert.


    ![](Image00025.jpg)


    ### Method


    If you remember I mentioned that objects can store variables and functions called
    properties and methods respectively. This means that methods are functions that
    are declared inside of objects. Methods are a useful way to assign action to an
    object, which will tie the function to the object’s scope instead of the global
    scope. A method has similar form as the function expression, but instead of using
    the normal assignment operator (`=`) the colon (`:`) serves as assignment operator
    instead.


    ![](Image00028.jpg)


    Notice in line 9 of this example we are declaring an object, and inside of that
    object we are declaring a method using the colon assignment operator followed
    by a function expression. In order to call a method you must first start with
    the object. This is because the method is tied to the scope of the object and
    not the global scope. In essence, to access the object’s scope you use the object’s
    identifier followed by a period (`.`) and then the property or method within that
    objects scope. Notice in line 17 we are declaring a variable and initializing
    it the value returned from the method inside the objects scope. If you were to
    save this page and load it in your browser you would get the following alert.


    ![](Image00025.jpg)


    # Chapter 7: Conditional Statements


    A conditional statement executes a code block only when a specific condition is
    met. First a conditional statement defines the condition that needs to be met.
    Next it defines the code block that is to be executed. When the conditional statement
    is evaluated and the condition is met the associated code block is executed. When
    a conditional statement is evaluated and the condition is not met, the code block
    is skipped.

