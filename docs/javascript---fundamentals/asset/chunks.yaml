    # JavaScript 基础与工作流


    现在你已经有了代码编辑器，我想讨论一下在学习书中书中示例时你将经历的基础工作流。JavaScript 可以直接从你的本地机器运行。嗯，我的意思是，大多数 JavaScript
    可以在本地运行。你可能会问自己，我说“从本地机器运行”是什么意思？你要知道，Web 开发要求你最终将代码部署到 Web 服务器上。这个“服务器”是一台供互联网上的其他计算机访问的计算机。Web
    服务器接收来自外部计算机的请求。然后，服务器通过提供这些网页来响应这些请求。这就是为什么它们被称为服务器。


    你可以把它们想象成餐厅里的服务员。客人坐下，看菜单。当他们准备好时，他们会从菜单上点某些东西。服务员接收请求，然后去厨房收集客人请求的物品。一旦服务员收集了所有请求的项目，他们就会将其提供给客人。同样，Web
    服务器接收来自客人的请求，然后收集请求的项目并提供给客人。这是对 Web 用户如何请求网页以及 Web 服务器如何通过提供请求页面做出响应的简化解释。


    正如我之前提到的，JavaScript 可以在本地运行。这意味着你不需要将代码放在 Web 服务器上就能看到它。虽然你可以在本地查看它，但互联网上的其他人都看不到它。出于这个原因，在本地工作是复习的最佳方式之一，因为它让你在代码部署到
    Web 服务器之前有机会检查你的代码。


    最终，为了让其他人享受你出色的 JavaScript，你的代码需要部署到 Web 服务器上。然而，在不涉及如何将代码部署到 Web 服务器的细节的情况下，就可以说明
    JavaScript 的基本概念。由于 Web 部署是一个更高级的话题，它超出了本基础课程的范围。为了本基础课程的目的，本课程中的示例已经优化为可以在本地运行。


    书中的 JavaScript 代码是内联编写的，也就是说，它们与 HTML 标记在同一个文件中。这绝对不是最佳实践，但它是说明 JavaScript 基础最简单的方法。我不建议内联编码。一旦你掌握了
    JavaScript 的基本概念，我建议你研究 JavaScript 的最佳实践。这包括将你的 JavaScript 代码写在外部的 `.js` 文件。这允许你保持静态
    HTML 标记不受动态代码的干扰。将它们分离是非常有利的。虽然事实如此，但它只是可能让刚刚开始 JavaScript 旅程的人分心的另一件事。出于这个原因，我决定违背传统和常识，以便更好地教授
    JavaScript 基础。


    ## 你的第一个 JavaScript 网页


    现在你已经对 JavaScript 是什么有了非常基本的了解，让我们制作我们的第一个网页。从创建一个空白文本文件开始，使用 `.html` 扩展而不是 `.txt`
