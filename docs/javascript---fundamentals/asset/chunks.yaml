    # Chapter 8


    ## Loops


    JavaScript allows you to execute a code block multiple times without writing it
    multiple times, using loops. There are several different loops in JavaScript:
    the `For` loop, the `For … In` loop, the `While` loop, and the `Do … While` loop.
    I like to categorize these further into two groups: the limited loops and the
    unlimited loops. The `For` loop and the `For … In` loop are both limited loops.
    This is because they both have a limit to the number of loop cycles that will
    be executed. This limit is explicitly defined in the loop statement. The `While`
    loop and the `Do … While` loop are unlimited loops. This is because there is no
    explicit limit set to the number of loop cycles will be executed. Instead, they
    loop endlessly until a condition is met.


    Loops can be useful for Iteration. Iteration is the process of executing a code
    block upon a member in some sort of collection. Previously we have covered objects,
    which are a considered a collection. Objects are a collection of properties. Do
    note that there are other collections built into JavaScript. Most notably is the
    `Array`, which we will cover later on in this course. For now, it is enough to
    know that there are different types of collections, and loops can be used to iterate
    through them.


    There is built in method for all objects that is called the `For Each` method.
    Ultimately the `For Each` method is a `For … In` loop that executes a callback
    function instead of a code block. For this reason, it is not considered a unique
    loop. It might be useful to know that other languages call the `For … In` loop
    a `For Each` loop.


    ## For


    The `For` loop starts with the `for` keyword followed by 3 statements wrapped
    in parenthesis. The 1st statement is executed before the loop starts. It is used
    to declare and initialize the iterator variable. The most common identifier for
    an iterator variable is the letter `i`, and it stands for `iterator`. The 2nd
    statement is evaluated at the top of every cycle, and it typically defines the
    iterator’s limit. Once the iterator has reached its limit the loop is completed
    and no more cycles are executed. Ultimately, this is a conditional statement.
    When this statement evaluates to `true` the loop continues another cycle. When
    it evaluates to `false` the loop is exited. The 3rd statement is executed at the
    bottom of each cycle, and it typically modifies the iterator. Iterators are typically
    increased by 1 in value in this statement using the increment (`++`) operator.
    However, this is not always the case. The iterator can be increased or decreased
    by a value greater than 1, and other operators can be used. This means you can
    iterate in ascending or descending order through a list at different intervals.
    The increment operator returns a value that is equal to the value `+ 1`. It is
    a short hand for writing `myValue = myValue + 1;` and it looks like this: `myValue++;`.
    Let’s take a look at a `For` loop.


