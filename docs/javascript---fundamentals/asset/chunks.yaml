    bits are called a byte, which is the next standard unit of measure in computer
    memory.


    With a single byte, you can represent 256 unique values. How do you think we represent
    values that are greater than 256? We group bytes together, of course. Data types
    are standardized groupings of bytes that can be used to store a variety of values.
    Before we discuss the different data types there is one more key feature of data
    types that needs to be understood, and that is non numerical values.


    ## Non Numerical Values


    Non numerical values are stored in memory using the binary system. However non
    numerical values are translated from a numerical value into some other type of
    value. Textual values, or enumerated values for example.  During translation the
    computer uses a predefined key to determine what the numerical value should be
    represented by. The key associates specific numerical values to specific non numerical
    values. This is most common in the non-numerical value char (short for character).
    Char values store a single letter of text. Most programming languages use char
    values and translate them using the ASCII key. [The ASCII key](http://www.ascii-code.com/) is
    a standardized key that associates common text characters to numerical values.
    For example, the ASCII key associates the decimal value of 65 with the "A" symbol,
    and the decimal value of 97 with the "a" symbol.


    Chapter 5


    ## Data types


    There are 6 data types in JavaScript: Boolean, Number, String, Null, Undefined,
    and Object. The first 5 are said to be primitive data types, while the last is
    a composite data type. In today''s lesson we will be going over the first 3 primitive
    types. Burt first let’s do a quick review of what we know about data types already.


    If you remember in lesson 3 I mentioned that you need to declare your intent to
    store a value by associating it with an Identifier. This process is knownas declaring
    a variable. This is done using the var keyword in JavaScript. The keyword var
    is short for "variable", and is followed by the variable''s identifier. It is
    like telling JavaScript "Hey JavaScript! Create a variable with the following
    name."


    ![https://media.licdn.com/mpr/mpr/shrinknp_400_400/AAEAAQAAAAAAAAeiAAAAJDIxYjVjMTVmLWVkOTItNDZmNy1hZDMxLWQ1MmM3ZmQ3NDZjZQ.png](Image00012.jpg)


    Once a variable is declared a value can then be assigned to it. The process of setting
    the initial value of a variable is called initializing the variable. We use the assignment
    operator = in JavaScript to assign a value to a variable. This is like telling
    JavaScript "Hey JavaScript! Create a variable with the following name and then assign it the
    following value."


    ![https://media.licdn.com/mpr/mpr/shrinknp_400_400/AAEAAQAAAAAAAAhYAAAAJGIxODYxZWZhLTM5OGQtNDU2YS04YzNkLWEwYjk1MGYwZGNjMg.png](Image00013.jpg)


    In JavaScript you can combine the declaration and initialization processes into
    one statement.


    ![https://media.licdn.com/mpr/mpr/shrinknp_400_400/AAEAAQAAAAAAAAktAAAAJGRjNTgxOWU0LTYzNGQtNDFlNS04YTdhLWY2ZDk0M2U3NjJhNg.png](Image00014.jpg)


    Note that the variable will conform to the data type of the value assigned to
    it. 


    ## Boolean


    The JavaScript Boolean data type is a non-numerical value, thattranslates a single
    bit from a 1 or a 0 to true or false respectively.


    ![https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAfTAAAAJDM2NjljOGZiLWE2NTctNGJlMS05MjlkLTkxNTNhNjkwNzkxNg.png](Image00015.jpg)


    ## Number


    The JavaScript Number data type is a numerical value that is stored using 64 bits.
    Notice that the JavaScript number is a double precision signed floating point.
    This means that not all 64 of the binary characters are used strictly to represent
    the value. In fact bits 0 to 51 describe up to a 17 digit decimal value. Bits
    52 to 62 are used to represent an exponent that the decimal value is raised to.
    The 63 bit is used to describe the sign of the value, which is to say whether
    the value is positive or negative. Given this information, we are told that JavaScript''s
    Number data type can be used to store values as large as 9,007,199,254,740,992
    or as small as -9,007,199,254,740,992\. It can also handle decimals precise up
    to 17 decimal spaces, for example 0.00000000000000001 is the most precise numerical
    value JavaScript''s number data type can represent. If you try to assign a value
    that is larger or greater, or even more precise than what the JavaScript Number
    data type can represent the web browser may throw an error.


    ![https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAhtAAAAJGQ3Nzk3MWJhLTU4NzUtNGY2OS1iNTllLTM5ZDNiMmRiM2FjNw.png](Image00016.jpg)


    ## String'
