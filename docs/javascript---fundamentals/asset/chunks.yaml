- fmt: '

    # JavaScript Basics and Workflow


    Now that you have a code editor, I would like to discuss the basic workflow you
    will experience when following the examples found in this book. JavaScript can
    be run directly from your local machine. Well, most of JavaScript can be run locally
    that is. What do I mean when I say "run from your local machine" you may be asking
    yourself? You see, web development requires you to eventually put your code on
    a web server. This "server" is a computer that makes itself available to other
    computers across the internet. A web server receives requests from outside computers.
    The server then responds to those requests by serving them a web page. This is
    why they are called servers.


    Think of them as waiters at a restaurant. A guest sits down, and looks at the
    menu. When they are ready they request something from the menu. The waiter receives
    the request and then goes to the kitchen to gather the items the guest has requested.
    Once the waiter gathers all of the requested items they serve them to the guest.
    In the same way a web server receives requests from guests, and then gathers the
    requested items serving them up to the guest. This is a simplified explanation
    of how a web user makes a request for a web page and how the web server responds
    by serving up the requested page.


    Like I mentioned earlier, JavaScript can run locally. This means that you do not
    have to have your code on a web server for you to see it. While you can view it
    locally, no one else across the inter webs can see it. For this reason, working
    locally is one of the best ways to review as it gives you a chance to review your
    code before it is deployed to a web server.


    Ultimately, for others to enjoy your awesome JavaScript your code needs to be
    deployed to a web server. However, the basic concepts of JavaScript can be illustrated
    without delving into the nuances of how to get your code on to a web server. As
    web deployment is a more advanced topic, it reaches beyond the scope of this fundamentals
    course. For the purpose of this fundamentals course the examples in this course
    have been optimized to run locally.


    The JavaScript code in this book is written inline, which is to say that it is
    in the same file as the HTML markup. This is definitely not the best practice,
    but it is the easiest way to illustrate JavaScript basics. I do not recommend
    coding inline. Once you have mastered the basic concepts of JavaScript I recommend
    looking into JavaScript best practice. This will include writing your JavaScript
    code in external `.js` files. This allows you to keep your static HTML markup
    clear of dynamic code. Keeping these separate is very advantageous. While this
    is the true, it is one more thing that can distract someone who is just starting
    on their JavaScript journey. For this reason I have decided to go against convention
    and common sense in order to better teach the basics of JavaScript.


    ## Your First JavaScript Web Page


    Now that you have a very basic grasp of what JavaScript is let''s make our very
    first web page. Start by creating a blank text file, with the `.html` file extension
    instead of the `.txt` file extension. Type the following into the html page.


    ![Image00000.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAl3AAAAJDU0NmZiYTUxLTU2NTYtNGZiZS05MmI3LWFkOWM3NzY2ZTAyYQ.png)


    This is the basic HTML 5 structure. Next add a script tag into the body of the
    page at line 7. This will be the container in which we will write our JavaScript.


    ![Image00001.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAfaAAAAJDk5YTI5ZGVkLTk2ZmEtNDFjZi1iNmI3LWNmODY1YjgyMThmNA.png)


    Between the open and closing script tag on line 7 we will begin to write our script.
    Traditionally the first program beginners are instructed to write is a hello world
    program. This is a program that simply writes the phrase "Hello World" to the
    screen. In JavaScript this can be done multiple ways, but the easiest is using
    a built in function in JavaScript called `alert`. This is a function that has
    1 parameter, and it creates a pop up alert window and displays the content of
    the passed parameter inside that pop up. Let''s take a look at the hello world
    script (fig. 3).


    ![Image00002.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAhrAAAAJGQ0MjJjNmYwLTZjNTItNGJlYi1hNjVhLTZhODc3M2M2ZmI0Ng.png)


    This is all it takes to write your first JavaScript web page. If you were to save
    this file with the html extension and run it in your browser you would notice
    a pop up that said "Hello World" (fig. 4). To run this you can either double click
    on the html file or drag and drop this file into an open web browser.


    ![Image00003.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAfjAAAAJGNjMDBiZjhiLTVlYTAtNDBjZi1hNGZkLTdmYzk5OWFhZTVkMg.png)


    ## Syntax


    If you search the word "syntax" in google you will get the following quick definition.


    ![Image00004.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAjhAAAAJDRmNjg3ZmFiLTkwN2UtNDIzMC04MDVhLWQ3MmQ2ZjZmYWZmNw.png)


    Ultimately, syntax describes how a computer language forms an instruction. Let''s
    take a look at our hello world script as our example. For now we will be focusing
    only on the portion written between the script tag, line 8.


    ![Image00005.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAkdAAAAJDdkZmIwYTY1LWMxODgtNGQyZC1hMTg4LWE1ZmE4YTBhY2E5Mw.jpg)


    Remember that our hello world web page had only 1 instruction. It told the browser
    to create a pop up alert window with the text "Hello World" in it. A single instruction
    is known as a statement. In JavaScript statements end in a semicolon. Statements
    can instruct the browser to do a wide variety of things, like define a variable,
    assign a value to a variable, call a function, check to see if a condition is
    met, and much more. For now focus on the order of the words in the statement.


    ### Well-formed Statements


    What do you think would happen if we moved the location of the semicolon to be
    between the function name and the parameter list? This is a great example to try
    for yourself.


    ![Image00006.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAhjAAAAJDlhYWFkNTc3LTYzZmMtNDc1OC05YjIxLTg1NDE4OWZkY2E0Yg.png)


    If you created the above webpage and opened it with your browser your browser
    would not have created the pop up alert as it did before. This is because the
    statement is not well formed, as the semicolon was in the wrong place. If you
    were to take the words in this sentence and move them around at random the sentence
    would no longer have the same meaning. In fact the sentence would likely be gibberish,
    and hold no meaning at all. An important fact to remember is that computers don''t
    do very well with gibberish. When a human reads a nonsensical sentence, like the
    following, they can skip over it:


    > "gibberish very well do don''t computer''s with."


    However, when computers read gibberish they are unable to skip past the nonsensical
    instructions. When this happens, the program usually experiences an error which
    causes it to stop reading all together. This concept of having well-formed instructions,
    is important if you want to have code that will run from beginning to end without
    any errors. We will cover debugging JavaScript later in this course, but for now
    try to understand that the order in which an instruction is constructed (syntax)
    is vital.


    ### Whitespace


    JavaScript ignores whitespace, the empty space between parts of a statement. Whitespace
    is comprised of spaces, tabs, and line break characters. However, please note
    that whitespace inside a quotation, also known as a string literal, is not ignored.
    To illustrate how JavaScript ignores whitespace, let us compare some JavaScript
    statements.


    ![Image00007.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAgHAAAAJDg2OTE2MDc4LTgyYWMtNDE4ZS05YjUxLTNmMTcwMjllY2VmMQ.png)

