    编写你的第一个 JavaScript 网页只需要这些。如果你用 html 扩展名保存此文件并在浏览器中运行它，你会注意到弹出一个写有“Hello World”的窗口（图
    4）。要运行它，你可以双击 html 文件，或者将此文件拖放到已打开的网页浏览器中。


    ![Image00003.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAfjAAAAJGNjMDBiZjhiLTVlYTAtNDBjZi1hNGZkLTdmYzk5OWFhZTVkMg.png)


    ## 语法


    如果你在谷歌上搜索“syntax”（语法）一词，你会得到以下快速定义。


    ![Image00004.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAhrAAAAJGQ0MjJjNmYwLTZjNTItNGJlYi...
    (此处，此处链接图片完整)


    最终，语法描述了计算机如何形成一个指令。让我们看看第 8 行 script 标签之间的。


    ![Image00005.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAhrAAAAJGQ0MjJjNmYwLTZjNTItNGJlYi1hNjVhLTZhODc3M2M2ZmI0Ng.png)


    ### 良好的语句


    如果我们把分号的位置移动到函数名和参数列表之间，你认为会发生什么？这是一个很好的尝试。


    ![Image00006.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAjhAAAAJDlhYWFkNTc3LTYzmMtNDc1OC05YjUxLTNmNDE4OWZkMjE)


    如果你创建了上面的网页并在浏览器中打开它，你的浏览器将像之前那样创建弹出警告。这是因为语句不良好，因为分号位于错误的位置。如果你随机移动这个句子中的词汇，这个句子将不再具有相同的含义。事实上，这个句子可能是乱码，而且完全没有意义。一个需要记住的重要事实是，计算机并不擅长处理乱码。当人类阅读无意义的句子时，例如下面这个，他们可以跳过去：


    > 乱码非常擅长不计算机的。


    然而，当计算机读取乱码时，它们无法跳过这些无意义的指令。发生这种情况时，程序通常会发生错误，导致它完全停止。我们将在本课程的以后部分调试 JavaScript，但现在请尝试理解指令构建的顺序（语法）至关重要。


    ### 空格


    JavaScript 忽略语句部分之间的空白空间。空白由空格、制表符和换行字符组成。然而，请注意引号内的空白（也称为字符串字面量）是不被忽略的。为了说明 JavaScript
    如何忽略空白，让我们比较一些 JavaScript 语句。


    ![Image00007.jpg](https://media.licdn.com/mpr/mpr/shrinknp_800_800/AAEAAQAAAAAAAAgHAAAAJDg2OTE2MDc4LTgyYWMtNDE4ZS05YjUxLTNmMTcwMjllY2VmMQ.png)


