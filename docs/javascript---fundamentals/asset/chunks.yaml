    “While”循环可用于基于状态的逻辑。状态是用于确定代码给定方面功能的预定义条件。例如，基于状态的逻辑用于图形用户界面（GUI）。当按钮被按下时，该按钮处于按下状态。当它未被按下时，它处于弹起状态。当鼠标悬停在按钮上时，它处于悬停状态。该按钮有三个不同的状态，它们控制着该按钮在
    GUI 中的外观和交互体验。电子游戏通常使用基于状态的逻辑来控制游戏机制的许多方面。例如，电子游戏人工智能倾向于使用基于状态的逻辑来确定非玩家角色（NPC）的行为。如果
    NPC 将玩家角色标记为敌对，NPC 将执行预定义的战术来追捕该玩家角色。如果 NPC 没有将任何玩家角色标记为敌对，它将执行其他预定义的行为，例如巡逻建筑物的周边。让我们来看一个非常简单的基于状态的“While”循环。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\002A.png](Image00052.jpg)


    如果你保存此页面并在浏览器中加载它，你将得到以下提示框。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\002B.png](Image00053.jpg)


    ## Do While 循环


    我们之前介绍的所有其他循环都在代码块的顶部评估条件。条件在关联的代码块执行之前被评估。这意味着迭代器或状态变量的初始值可能导致条件在代码块执行之前就被评估为
    false。“Do … While”循环在代码块的底部评估其条件，这意味着它在代码块执行之后被评估。如果你希望关联的代码块至少运行一次，则使用此循环。


    “Do … While”循环以“do”关键字开头，后跟代码块。代码块之后是“while”关键字，后跟用括号括起来的条件表达式。最后我们以分号结束。让我们来看一个“Do
    … While”循环。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\003.png](Image00054.jpg)


    如果你保存此页面并在浏览器中加载它，你将得到以下提示框。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\002B.png](Image00053.jpg)


    为了说明“Do … While”循环的实用性，让我们比较两个具有两个不同迭代器的循环。两个迭代器都将被初始化为循环限制的值。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\004.png](Image00055.jpg)


    如果你保存此页面并在浏览器中加载它，你将得到以下提示框。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\004B.png](Image00056.jpg)


    注意，“While”循环跳过了其代码块，因为迭代器被初始化为循环的限制，但“Do … While”循环没有跳过代码块，尽管其迭代器也被初始化为循环的限制。这是因为“Do
    … While”循环在代码块的底部评估其条件，导致代码块至少运行一次。


    # 第 9 章


    ## 数组


    JavaScript 有许多内置对象可供使用。内置对象之一是 Array（数组）。如前所述，数组是一个集合。Array 实际上是键值对的集合。键值对是相互关联的标识符和值。对象属性是键值对。但是，Array
    并不显式定义键值对的键。它由值在集合中的数值位置隐式决定，这称为索引。数组用于存储相关数据，同时与集合中的其他键值对保持同级关系。


    数组可以通过三种不同的方式实例化（创建该对象的实例）：关联简写、隐式简写和使用对象构造函数。如前所述，Array 是一个对象。这意味着我们可以像实例化对象一样实例化数组。这就是关联简写。隐式简写可用于根据值在集合中的索引隐式定义键。Array
    构造函数也可用于实例化数组。构造函数是一个构造对象的特殊方法，因此得名构造函数。Array 构造函数接受一个参数，该参数决定数组的特定长度。让我们来看看实例化
    Array 的这三种不同方式。


