    When using the `switch` conditional statement we first use the `switch` keyword
    followed by a condition expression wrapped in parenthesis. This condition expression
    represents the value that is being evaluated. Next is our code block, wrapped
    in curly braces. Inside our code block we have a series of `case/break` expressions.
    The `case/ break` expression starts with the `case` keyword followed by the case
    value and then a colon. Directly after the colon is the associated code, followed
    by the keyword `break` and a semicolon. In the following example we are going
    to create a function that tests a string value against multiple conditions. When
    comparing string values it is common convert the parameter to lowercase, to make
    the value passed into the function case insensitive. To do this in JavaScript,
    we use the built in string method `toLowerCase()`. Let’s take a look at a standard
    `switch` statement.


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\009\003.png](Image00043.jpg)


    If you were to save this page and load it in your browser you would get the same
    exact alerts as our previous example.


    It is also possible to have different conditional statements in each case. To
    do this we define the `switch` value as `true`, and the case values as the individual
    conditional statements wrapped in parenthesis. Ultimately this is comparing the
