    # 函数


    函数允许你封装代码块，本质上将其包装在一个胶囊中，将内部代码与外部代码分离。这个代码胶囊可以被多次调用和在不同的位置调用，每次调用时封装的代码都会执行。调用一个函数只需要
    1 行代码，即使函数的代码块可能包含数百行代码。


    想象你有一个 5 步长的流程，你想在代码的不同位置多次执行这个流程。你可以在每个位置都写这个 5 步流程，但这样写很繁琐。这也使得代码难以管理。如果你需要更新这个
    5 步流程并在步骤 1 和 2 之间插入一个步骤，你就必须修改每个位置。如果你把这个流程封装成一个函数，你就只需要更新一次。要更新封装的代码，你只需更改函数内部的代码，这样每次调用函数时执行的就是更新后的代码。


    ## 作用域和参数


    封装要求在封装的代码块内部声明的变量与函数外部声明的变量完全分离。封装的这一必要特性称为作用域。作用域是一个概念，它决定在给定的代码块中哪些变量和函数是可见的。写在所有其他函数外部的代码被称为全局作用域，因此对所有其他作用域可见。然而，封装在函数中的代码块实际上处于不同的作用域中。如果你在一个函数内部调用另一个函数，每个函数中定义的变量将处于不同的作用域，因此彼此不可见。


    有时你可能希望允许函数外部的一些变量传入函数代码块，以便对该变量值进行操作。函数允许你明确列出允许进入函数代码块的变量列表。这个列表称为参数列表。参数是一个变量占位符，在调用函数时可以填充具体值。


    我们将介绍 JavaScript 中函数最常用的 4 种方式：函数声明、函数表达式、立即调用函数表达式和方法。


    ## 函数类型


    ### 函数声明


    函数最常见的形式是函数声明。函数声明以`function`关键字开头，后跟函数标识符。接下来是用括号括起来的逗号分隔的参数列表。最后是用大括号括起来的函数代码块。让我们看一个有
    2 个参数的函数声明示例。我们将把`parameter1`乘以`parameter2`并返回结果。


    ![](img/Image00024.jpg)


    注意第 15 行调用了我们声明的函数，并传递`9`和`9`作为两个参数的值。如果你保存这个页面并在浏览器中加载，你会看到以下提示框。


    ![](img/Image00025.jpg)


    ### 函数表达式


    函数表达式是比函数声明更不常见的函数形式。然而，函数表达式可以非常强大。函数表达式允许你覆盖函数之前的实现。这个技术超出了本基础课程的范围。只需了解如何编写函数表达式就足够了。


    ![](img/Image00026.jpg)


    注意第 9 行的区别。首先你声明一个变量，给它一个用于调用函数的标识符。然后使用赋值运算符和`function`关键字将函数赋值给变量。注意在`function`关键字之后我们省略了函数标识符。这是因为标识符已经声明了，它就是与变量关联的标识符。接下来是参数列表和函数体，与函数声明相同。如果你保存这个页面并在浏览器中加载，你会看到以下提示框。


    ![](img/Image00025.jpg)


    ### 立即调用函数表达式（IIFE）


    在我们最后两个示例中，我们都是在代码后面调用函数。如果你想在声明函数的同时就调用它怎么办？在这些罕见的情况下，你可以使用立即调用函数表达式或`IIFE`（发音为"if-fee"）。`IIFE`最常用于在页面加载时执行某些操作，一旦代码按顺序执行到那里，它就会执行其代码块。当然，这也可以使用函数声明和函数表达式来完成，但`IIFE`使用的代码行数更少。让我们看一个`IIFE`的例子。


    ![](img/Image00027.jpg)


    首先注意，与前两个示例相比，它需要的代码行数更少。它少了 1 行，但执行完全相同的功能。`IIFE`本质上是一个用括号括起来的函数表达式，后面紧跟着一个用括号括起来的逗号分隔的值列表。这个值列表包含将作为函数参数传递的值。因为这个函数返回一个值，我们需要捕获该返回值。注意在第
    9 行，我们首先声明一个变量，然后使用赋值运算符将函数返回的值赋值给它。接下来我们看到一个用括号括起来的函数表达式，后面直接跟着一个值列表。如果你保存这个页面并在浏览器中加载，你会看到以下提示框。


    ![](img/Image00025.jpg)


    ### 方法


    如果你记得我提到过对象可以存储变量和函数，分别称为属性和方法。这意味着方法是声明在对象内部的函数。方法是给对象分配动作的有用方式，这将把函数绑定到对象的作用域而不是全局作用域。方法的形式与函数表达式类似，但使用冒号（`:`）而不是普通的赋值运算符（`=`）作为赋值运算符。


    ![](img/Image00028.jpg)


    注意在这个示例的第 9 行，我们正在声明一个对象，在这个对象内部，我们使用冒号赋值运算符后跟函数表达式来声明一个方法。要调用方法，你必须首先从对象开始。这是因为方法绑定到对象的作用域而不是全局作用域。本质上，要访问对象的作用域，你需要使用对象的标识符后跟一个句点（`.`），然后是该对象作用域内的属性或方法。注意在第
    17 行，我们正在声明一个变量并将其初始化为从对象作用域内方法返回的值。如果你保存这个页面并在浏览器中加载，你会看到以下提示框。


    ![](img/Image00025.jpg)


    # 第 7 章：条件语句


    条件语句仅在满足特定条件时执行代码块。首先，条件语句定义需要满足的条件。接下来它定义要执行的代码块。当条件语句被求值且条件满足时，关联的代码块被执行。当条件语句被求值但条件不满足时，代码块被跳过。

