    ## While loop


    `While` 循环是 JavaScript 中形式简单的循环。它被设计在条件评估为 `true` 时循环。当条件不再为 `true` 时，退出循环。While
    以 `while` 关键字开头，后面跟着一个包裹在括号内的条件表达式。之后是与循环关联的代码块。让我们来看 `while` 循环。


    ![H:\Projects\[Locker] Desktops\[Locker] Personal\JS 101\JS 101\011\001.png](Image00050.jpg)


