    \n### 3.3) 元组 (Tuples)\n元组是值的集合，通过某种整数进行索引。它们是不可变的。\n\n### 4 集合 (Sets)\n集合是一个无序的值数组，没有重复条目。集合是无时的。\n\
    \n#### 示例\n```python\n>>>s = set ([1,2,3,4])\n>>>print(s)\n{1, 2, 3, 4 }\n```\n\
    \n# 判断 Python 变量类型\n\n### 1) type() 方法\n如果向 `type()` 传递单个参数，它返回给定对象的类型。\n\n####\
    \ 示例\n```python\n>>> test_string = \"yes\"\n>>> test_number = 1\n>>> print(type(test_string))\n\
