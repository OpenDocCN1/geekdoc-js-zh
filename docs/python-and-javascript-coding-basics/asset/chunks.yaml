    \ and `Inline Comments`,\n\n### 1) Block Comments\n\nFor the piece of code that\
    \ follows, Block comments apply. It may refer to a part of the code or the code\
    \ as a whole.\n\nThey have the same degree of indentation as that code.\n\nEach\
    \ comment line begins with a `#`.\n\n#### EXAMPLE\n\n```python\n# Python program\
    \ to print\n# Hello World\nprint(\"Hello World\")\n```\nOutput:\n`Hello World`\n\
    \nIt is also possible to make block comments using `''' '''` Something written\
