    \ 方法\n`isinstance()` 函数测试对象（第一个参数）是否为 `classinfo` 类的实例或子类（第二个参数）。\n\n#### 示例\n\
    ```python\n>>> class Example:\n...     name = 'include_help'\n...\n>>> ExampleInstance\
    \ = Example()\n>>> print(isinstance(ExampleInstance, Example))\nTrue\n>>> print(isinstance(ExampleInstance,\
    \ (list, set)))\nFalse\n>>> print(isinstance(ExampleInstance, (list, set, Example)))\n\
    True\n```\n\n### type() 和 isinstance() 比较\n![](img/image00168.jpeg)\n\n# Python\
    \ 算术运算符\n算术运算符用于执行不同的算术/数学操作，它们是二运算符，意味着计算需要两个操作数。\n\n![](img/image00169.jpeg)\n\
    \n语法：\n- `exp1 + exp2`\n- `exp1 - exp2`\n- `exp1 * exp2`\n- `exp1 ** exp2`\n-\
    \ `exp1 / exp2`\n- `exp1 // exp2`\n- `exp1 % exp2`\n\n### 程序\n```python\n# 演示算术运算符\n\
    # 示例的 Python 程序\na = 10\nb = 3\n# 打印值\nprint(\"a:\", a)\nprint(\"b:\", b)\n# 操作\n\
