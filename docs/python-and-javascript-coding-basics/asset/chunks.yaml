    , x == y)\nprint(\"y == z: \", y == z)\n# 比较对象\nprint(\"x is y: \", x is y)\n\
    print(\"y is z: \", y is z)\n```\n输出：\n```text\nx == y:  True\ny == z:  True\n\
    x is y:  False\ny is z:  False\n```\n\n# 成员运算符\n成员运算符用于检查值（如字符串、列表、元组或字典）是否存在于序列中。\n\
    \n### \"in\" 和 \"not in\"\n![](img/image00171.jpeg)\n\n#### 示例\n```python\n# Python\
    \ \"in\" 和 \"not in\" 运算符示例\n# 声明一个列表和一个字符串\nstr1 = \"Hello world\"\nlist1 = [10,\
    \ 20, 30, 40, 50]\n\n# 检查 'w' 是否存在 str1 中\nif 'w' in str1:\n    print(\"Yes! w\
    \ found in \", str1)\nelse:\n    print(\"No! w not in \", str1)\n\n# 检查 'X'（大写）是否存在于\
    \ str1 中\nif 'X' in str1:\n    print(\"Yes! X found in \", str1)\nelse:\n    print(\"\
    No! X not in \", str1)\n\n# 检查 30 是否存在 list1 中\nif 30 in list1:\n    print(\"\
    Yes! 30 found in \", list1)\nelse:\n    print(\"No! 30 not in \", list1)\n\n#\
    \ 检查 90 是否存在 list1 中\nif 90 in list1:\n    print(\"Yes! 90 found in \", list1)\n\
    else:\n    print(\"No! 90 not in \", list1)\n```\n输出：\n```text\nYes! w found in\
    \  Hello world\nNo! X not in  Hello world\nYes! 30 found in  [10, 20, 30, 40,\
    \ 50]\nNo! 90 not in  [10, 20, 30, 40, 50]\n```\n\n# Python 中自增运算符的行为\n## Python\
    \ 中自减运算符的行为\nPython 以一致且易读的语言著称。与 Java 不同，自增 (+ +) 和自减 (—)运算符不支持 Python，无论是优先级还是返回值。\n\
    \n例如，`x++` 和 `+ + x`，或者 `x—` 和 —x 在 Python 中都是无效的。\n\n```python\nx=1\nx++\n```\n\
    输出：\n```text\nFile \"main.py\", line 2\n    x++\n^\nSyntaxError: invalid syntax\n\
    ```\n\n#### 示例\n```python\nx=1\nprint(--x)\n# 1\nprint(++x)\n# 1\nprint(x--)\n\
    '''\n```\n输出：\n```text\nFile \"main.py\", line 8\n    print(x--)\n           \
    \  ^\nSyntaxError: invalid syntax\n```\n\n"
- fmt: "\nThe reasoning for this is that python integers are immutable and can therefore\
    \ not be modified. So, in order to raise, we would have to do the following.\n\
    \n```python\nx = 1\nx=x+1\nprint(x)\nx=x-1\nprint(x)\nx +=2\nprint(x)\nx -= 1\n\
    print(x)\n```\nOutput\n2\n1\n3\n2\n\n# Logical and Bitwise NOT Operators\n\n##\
    \ on Boolean in Python\n\nNot is used for Logical NOT operator in python, and\
    \ `~` is used for Bitwise NOT. Here, in Python, we'll see their uses and execution.\n\
    \nTo reverse the result, the Logical NOT (`not`) operator returns \"False\" if\
    \ the result is \"True\";; otherwise, \"True.\"\n\nThe operator Bitwise NOT (`~`)\
    \ is used to invert all the bits, i.e it returns the number's complement.\n\n\
    ### Logical NOT (not) operator\n\n#### PROGRAM\n```python\n# Logical NOT (not)\
    \ operator\nx = True\ny = False\n# printing the values\nprint(\"x: \", x)\nprint(\"\
    y: \", y)\n# 'not' operations\nprint(\"not x: \", not x)\nprint(\"not y: \", not\
    \ y)\n```\nOutput:\nx:  True\ny:  False\nnot x:  False\nnot y:  True\n\n### Bitwise\
    \ NOT (~) operator\n\n#### PROGRAM\n```python\n# Bitwise NOT (~) operator\nx =\
    \ True\ny = False\n# printing the values\nprint(\"x: \", x)\nprint(\"y: \", y)\n\
    # '~' operations\nprint(\"~ x: \", ~ x)\nprint(\"~ y: \", ~ y)\n# assigning numbers\n\
    x = 123\ny = 128\n# printing the values\nprint(\"x: \", x)\nprint(\"y: \", y)\n\
    # '~' operations\nprint(\"~ x: \", ~ x)\nprint(\"~ y: \", ~ y)\n```\nOutput:\n\
    x:  True\ny:  False\n~ x:  -2\n~ y:  -1\nx:  123\ny:  128\n~ x:  -124\n~ y:  -129\n\
    \n# Logical Operators on String\n\n## Logical Operators\n\n* Logical AND (`and`)\n\
    * Logical OR (`or`)\n* Logical NOT (`not`)\n\n### With Strings\n\nAn empty string\
    \ means False as a Boolean value, while True as a Boolean value is a non-empty\
    \ string.\n\nFor \"and\" operator: If the first operand is true, the second operand\
    \ is checked and the second operand is returned.\n\nFor 'or' operator: If False\
    \ is the first operand, the second operand is checked and the second operand is\
    \ returned.\n\nFor 'and' operator: If the operand is an empty string, True; False\
    \ will be returned, otherwise.\n\n#### EAMPLE 1\n```python\n# Logical Operators\
    \ on String in Python\nstring1 = \"Hello\"\nstring2 = \"World\"\n# and operator\
    \ on string\nprint(\"string1 and string2: \", string1 and string2)\nprint(\"string2\
    \ and string1: \", string2 and string1)\nprint()\n# or operator on string\nprint(\"\
    string1 or string2: \", string1 or string2)\nprint(\"string2 or string1: \", string2\
    \ or string1)\nprint()\n# not operator on string\nprint(\"not string1: \", not\
    \ string1)\nprint(\"not string2: \", not string2)\nprint()\n```\nOutput:\nstring1\
    \ and string2:  World\nstring2 and string1:  Hello\nstring1 or string2:  Hello\n\
    string2 or string1:  World\nnot string1:  False\nnot string2:  False\n\n#### EXAMPLE\
    \ 2\n```python\n# Logical Operators on String in Python\nstring1 = \"\" # empty\
    \ string\nstring2 = \"World\" # non-empty string\n# Note: 'repr()' function prints\
    \ the string with\n# single quotes\n# and operator on string\nprint(\"string1\
    \ and string2: \", repr(string1 and string2))\nprint(\"string2 and string1: \"\
    , repr(string2 and string1))\nprint()\n# or operator on string\nprint(\"string1\
    \ or string2: \", repr(string1 or string2))\nprint(\"string2 or string1: \", repr(string2\
    \ or string1))\nprint()\n# not operator on string\nprint(\"not string1: \", not\
    \ string1)\nprint(\"not string2: \", not string2)\nprint()\n```\nOutput:\nstring1\
    \ and string2:  ''\nstring2 and string1:  ''\nstring1 or string2:  'World'\nstring2\
    \ or string1:  'World'\nnot string1:  True\nnot string2:  False\n\n# if else Conditional\
    \ Operator\n\nPython also includes the functionality to test conditional statements\
    \ using the conditional operator, much like other programming languages.\n\nIf\
    \ the other conditional operator is used, depending on the outcome of the given\
    \ Boolean expression, to evaluate / get either value / statement (from the two\
    \ values / statements given).\n\nSyntax:\n`value1 if expression else value2`\n\
    \n* `Value1`: represents the conditional expression value if it is valid.\n* `Expression`:\
    \ represents the condition that a Boolean (i.e. we may assume it is a condition)\
    \ to evaluate.\n* `Value2`: represents the conditional expression value if it\
    \ is false.\n\n#### EXAMPLE 1\n```python\n# find the largest Value\nx = 20\ny\
    \ = 10\n# if else conditional operator\nlargest = x if x>y else y\n# printing\
    \ the values\nprint(\"x: \", x)\nprint(\"y: \", y)\nprint(\"largest: \", largest)\n\
    print()\n\nx = 10\ny = 20\n# if else conditional operator\nlargest = x if x>y\
    \ else y\n# printing the values\nprint(\"x: \", x)\nprint(\"y: \", y)\nprint(\"\
    largest: \", largest)\nprint()\n\nx = 10\ny = 10\n# if else conditional operator\n\
    largest = x if x>y else y\n# printing the values\nprint(\"x: \", x)\nprint(\"\
    y: \", y)\nprint(\"largest: \", largest)\nprint()\n```\nOutput:\nx:  20\ny:  10\n\
    largest: 20\nx:  10\ny:  20\nlargest: 20\nx:  10\ny:  10\nlargest: 10\n\n####\
    \ EXAMPLE 2\n```python\n# find the largest Value\nx = 10\ny = 20\nz = 30\n# if\
    \ else conditional operator\nlargest = x if (x>y and x>z) else (y if(y>x and x>z)\
    \ else z)\n# printing the values\nprint(\"x: \", x)\nprint(\"y: \", y)\nprint(\"\
    z: \", z)\nprint(\"largest: \", largest)\nprint()\n\nx = 10\ny = 30\nz = 20\n\
    # if else conditional operator\nlargest = x if (x>y and x>z) else (y if(y>x and\
    \ y>z) else z)\n# printing the values\nprint(\"x: \", x)\nprint(\"y: \", y)\n\
    print(\"z: \", z)\nprint(\"largest: \", largest)\nprint()\n```\n\n# JAVCRIPT-CODING\
    \ BASICS FOR ABSOLUTE BEGINNERS BY TAM SEL\n\n## JAVCRIPT\n\nThis JavaScript tutorial\
    \ makes it easy for both beginners and experts to learn JavaScript.\nTo learn\
    \ JavaScript, you only need a basic understanding of computers.\n\n## JAVCRIPT\
    \ EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h2>Welcome to JavaScript</h2>\n\
    \  <script>\n    document.write(\"Hello Friends\");\n  </script>\n</body>\n</html>\n\
    ```\nJavaScript can be implemented by adding JavaScript statements in the code.\n\
    \n`<script>...</script>`\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script\
    \ type=\"text/javascript\">\n    alert(\"Hello world\");\n  </script>\n</body>\n\
    </html>\n```\n\n### JavaScript code can be written in 3 places in JavaScript\n\
    \n1.  Between the `<body>`……`</body>` tag of HTML.\n2.  Between the `<head>`……`</head>`\
    \ tag of HTML.\n3.  In `.jsfile`(external JavaScript).\n\n### Example (code between\
    \ the body tags)\n\nIn the example below, the body tag contains JavaScript code.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\"\
    >\n    alert(\"Hello world\");\n  </script>\n</body>\n</html>\n```\n"
