    \ of `I` so the imaginary part of `1 + 0j` denotes zero.\n\n```python\n>>> x =\
    \ 1+0j\n>>> print (x.real,x.imag)\n1.0 0.0\n```\n\n### 2\\. None\n\nThis is a\
    \ particular category of data with a single value. It is used in a scenario to\
