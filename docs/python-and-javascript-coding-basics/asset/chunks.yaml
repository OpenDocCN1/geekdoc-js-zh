  trans: "\n\n哈希符号（`#`）用于渲染单行注释。当注释换到下一行时，它们必须在下一行的开头与前行的哈希标记（`#`）对齐。\n\n让我们来看一个实例，并尝试理解如何在软件中应用单行注释。\n\
    \n#### 示例\n\n##### 单行注释示例\n\n```python\n# 一个打印给定字符串和加法的程序。\nprint('Welcome @ Learnpython')\n\
    a=2\nb=5\nprint(a+b)\n# 使用加号(+) 对两个两个数字进行相加。\n```\n\n### 2) 多行字符串注释\n\n正如我们在上面的示例所示，对于多行注释，我们必须在每一行放置一个哈希符号（`#`）。\n\
    \n在 Python 中，多行字符串注释使用分隔符提供。当内容无法用单行表示时，这很有帮助。\n\n对于多行字符串注释，我们必须在两端使用分隔符包裹字符串。\n\
    \n#### 示例\n\n```python\n'''\n    在这里我们将使用 Python 的多行注释\n    检查给定的数字 n 是偶数还是奇数。\n\
    '''\nn=6768\nif n%2==0:\n    print(\"Even number.\")\nelse:\n    print(\"Odd number.\"\
    )\n```\n\n# Python 中的块注释\n\n### 注释\n\n注释是计算机程序中的一段文本，旨在解释或标注。\n\n它对源代码作者是可读的，并且会被编译器/解释器忽略。\n\
    \n### Python 注释的类型\n\n`块注释（Block Comments）`和`内联注释（Inline Comments）`，\n\n### 1)\
    \ 块注释\n\n对于后续的代码段适用于块注释。它可以指代代码的一部分或整个代码。\n\n它们与该代码具有相同的缩进程度。\n\n每行注释都以 `#` 开头。\n\
    \n#### 示例\n\n```python\n# Python 程序，打印\n# Hello World\nprint(\"Hello World\")\n\
    ```\n输出：\n`Hello World`\n\n也可以使用 `''' '''` 制作块注释。写在这些引号中的内容被称为注释。\n\n#### 示例\n\
    \n```python\n'''\nPython 程序，打印\nHello World\n'''\nprint(\"Hello World\")\n```\n\
    \n#### 示例 2\n\n```python\ndef hello():\n    '''\n    在这里，这是文档字符串（docstring）\n\
    \    因为它是写在\n    函数定义之后的。\n    下面的 print 语句将打印\n    Hello World\n    '''\n   \
    \ print(\"Hello World\")\nif __name__ == \"__main__\":\n  # 调用 hello 函数\n  hello()\n\
    ```\n\n### 2) 内联注释\n\n与声明在同一行上的注释是内联注释。\n\n内联备注与参数之间应至少有两个空格。\n\n它们应该以 `#` 和一个空格开始。\n\
    \n#### 示例\n\n```python\nprint(\"Hello World\")  # 这是一个内联注释\n```\n输出：\n`Hello World`\n\
    \n# 创建多行注释\n\n当我们需要对几行/语句进行注释时，有两种方法可以实现这一点，要么对每行进行注释，要么构建多行注释（或块注释）。\n\n第一方法是对每个部分进行注释，\n\
    \n这在 Python 中可以被视为单行注释——在每一行被注释的行开头，我们使用哈希字符（`#`）。\n\n```python\n# 这是第 1 行\n#\
    \ 这是第 2 行\n# 这是第 3 行\n```\n\n而第二种方法是对段落进行注释，\n\n这在 Python 中可以被视为多行注释——我们在被注释段落的开头使用三单引号（`'''`），并在结尾使用三单引号（`'''`）。\n\
    \n```python\n'''\n这是第 1 行\n这是第 2 行\n这是第 3 行\n'''\n```\n\n#### 示例\n\n```python\n\
    '''\n函数名: print_text\n参数: 无\n返回类型: 无\n描述: 此函数将在屏幕上打印\n一些文本\n'''\ndef print_text():\n\
    \  print(\"Hello, world! How are you?\")\nif __name__ == \"__main__\":\n  # 在这里，我们将调用\
    \ print_text 函数\n  # 它将在屏幕上打印一些文本\n  print_text()\n```\n\n# Python 数字类型\n\n数据类型是编程中的一个重要概念。\n\
    \n根据我们希望变量执行的角色，可以将不同类型的数据存储在变量中。\n\n在 Python 中，内置类型有：\n\n* `文本类型（Text Type）`\n\
    * `数值类型（Numeric Type）`\n* `映射类型（Mapping Type）`\n* `序列类型（Sequence Type）`\n* `集合类型（Set\
    \ Type）`\n* `布尔类型（Boolean Type）`\n* `二进制类型（Binary Type）`\n\nPython 中的 3 种数值类型：\n\
    \n1. `int`\n2. `float`\n3. `comple`\n\n### 1) int\n\n整数数值形式不带小数点，用于存储带符号的整数，例如\
    \ -5, 2, 78 等。\n\n#### 示例\n\n```python\n# 给变量赋值整数值\nx = 8\ny = -9\n# 操作 x 的值\n\
    x = x + y\n# 打印更新后的 x 值\nprint(\"x= \", x)\n# 打印 x 的类型\nprint(\"Data type of x:\
    \ \", type(x))\n```\n输出：\n`x= -1`\n`Data type of x: <class 'int'>`\n\n### 2) float\n\
    \nfloat 的数值形式用于存储浮点值，例如 6.66, 58.9, 3.14 等。\n\n浮点数也可以用科学计数法表示，用 `E` 或 `e` 表示 10\
    \ 的幂次方（`3.6e3 = 3.6x 103 = 3600`）。\n\n#### 示例\n\n```python\n# 给变量赋值浮点值\nx = 8.9\n\
    y = -9.1\n# 操作 x 的值\nx = x - y\n# 打印更新后的 x 值\nprint(\"x= \", x)\n# 打印 x 的类型\n\
    print(\"Data type of x: \", type(x))\n```\n输出：\n`x= 18.0`\n`Data type of x: <class\
    \ 'float'>`\n\n### 3) complex\n\n复数的数值形式用于存储浮点值，如 6.66, 58.9, 3.14 等。\n\n浮点数也可以用科学计数法表示，用\
    \ `E` 或 `e` 表示 10 的幂次方（`3.6e3 = 3.6x 103 = 3600`）。\n\n复数类型用于存储浮点数，如 3.14j。\n\n\
    格式：实部 + 虚部\n\n注意：在 Python 中，必须使用 `j` 来表示虚部。\n\n#### 示例\n\n```python\n# 给变量赋值复数值\n\
    x = 8.5j\ny = 9j\n# 操作 x 的值\nx = x + y\n# 打印更新后的 x 值\nprint(\"x= \", x)\n# 打印\
    \ x 的类型\nprint(\"Data type of x: \", type(x))\n```\n输出：\n`x= (8.5+17.5j)`\n`Data\
    \ type of x: <class 'complex'>`\n\n# 变量数据类型\n\n### 1\\. 数字\n\n数字类型存储数值值。这种数据类型是永久的。\n\
    \n它们有三种不同的类型：\n\n* `整数与长整数（Integer & Long）`\n* `浮点数（Float）`\n* `复数（Complex）`\n\
    \ni) 整数：\n\n整数是不带小数点的整数字，如 100000, -99。当想要长整数时附加 `L`。Python 将这些值视为长整数。\n\n```python\n\
    >>> a = 10\n>>> b = 5192L # 为变量提供值的示例\n>>> c=429814\n>>> type(c) # 使用 ( ) 检查值的类型\n\
    ```\n\nii) 浮点数：\n\n浮点数是带有小数点的数字。\n\n浮点数由符号（+,-）、数字序列和一个点组成，如 0.0, -21.9, 0.98333328,\
    \ 15.2963。\n\n（注：原文中缺少浮点数的示例代码，但保留了结构。）\n\niii) 复数：\n\nPython 复数由两个浮点值组成，每个一个实部和虚部。我们将使用\
    \ `x.real` 和 `x.image` 来访问向量（对象）`x` 的各个部分。\n\n数字的虚部用 `j` 代替 `I`，因此 `1 + 0j` 表示零。\n\
    \n```python\n>>> x = 1+0j\n>>> print (x.real,x.imag)\n1.0 0.0\n```\n\n"
