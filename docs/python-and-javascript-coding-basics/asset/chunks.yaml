  trans: "\n其原因是 Python 整数是不可变的，因此不能被修改。所以，为了增加数值，我们需要执行以下操作。\n\n```python\nx = 1\n\
    x=x+1\nprint(x)\nx=x-1\nprint(x)\nx +=2\nprint(x)\nx -= 1\nprint(x)\n```\nOutput\n\
    2\n1\n3\n2\n\n# 逻辑与位取反运算符\n\n## Python 中的布尔值操作\n\n`not` 用于 Python 中的逻辑非运算符，而 `~`\
    \ 用于位取反运算符。在这里，我们将在 Python 中查看它们的用法和执行情况。\n\n要反转结果，逻辑非 (`not`) 运算符如果结果为 \"True\"\
    ，则返回 \"False\"；否则返回 \"True\"。\n\n位取反运算符 (`~`) 用于反转所有比特（位），即它返回数字的补码。\n\n### 逻辑非\
    \ (not) 运算符\n\n#### 程序\n```python\n# 逻辑非 (not) 运算符\nx = True\ny = False\n# 打印值\n\
    print(\"x: \", x)\nprint(\"y: \", y)\n# 'not' 操作\nprint(\"not x: \", not x)\n\
    print(\"not y: \", not y)\n```\nOutput:\nx:  True\ny:  False\nnot x:  False\n\
    not y:  True\n\n### 位取反 (~) 运算符\n\n#### 程序\n```python\n# 位取反 (~) 运算符\nx = True\n\
    y = False\n# 打印值\nprint(\"x: \", x)\nprint(\"y: \", y)\n# '~' 操作\nprint(\"~ x:\
    \ \", ~ x)\nprint(\"~ y: \", ~ y)\n# 赋值数字\nx = 123\ny = 128\n# 打印值\nprint(\"x:\
    \ \", x)\nprint(\"y: \", y)\n# '~' 操作\nprint(\"~ x: \", ~ x)\nprint(\"~ y: \"\
    , ~ y)\n```\nOutput:\nx:  True\ny:  False\n~ x:  -2\n~ y:  -1\nx:  123\ny:  128\n\
    ~ x:  -124\n~ y:  -129\n\n# 字符串逻辑运算符\n\n## 逻辑运算符\n\n* 逻辑与 (`and`)\n* 逻辑或 (`or`)\n\
    * 逻辑非 (`not`)\n\n#### 结合字符串\n\n空字符串作为布尔值表示 False，而非空字符串作为布尔值表示 True。\n\n对于 \"\
    and\" 运算符：如果第一个操作数为真，则检查第二个操作数并返回第二个操作数。\n\n对于 \"or\" 运算符：如果第一个操作数为假，则检查第二个操作数并返回第二个操作数。\n\
    \n对于 \"and\" 运算符：如果操作数为空字符串，则返回 True；否则返回 False。\n\n#### 示例 1\n```python\n# Python\
    \ 中的字符串逻辑运算符\nstring1 = \"Hello\"\nstring2 = \"World\"\n# 字符串上的 and 运算符\nprint(\"\
    string1 and string2: \", string1 and string2)\nprint(\"string2 and string1: \"\
    , string2 and string1)\nprint()\n# 字符串上的 or 运算符\nprint(\"string1 or string2: \"\
    , string1 or string2)\nprint(\"string2 or string1: \", string2 or string1)\nprint()\n\
    # 字符串上的 not 运算符\nprint(\"not string1: \", not string1)\nprint(\"not string2: \"\
    , not string2)\nprint()\n```\nOutput:\nstring1 and string2:  World\nstring2 and\
    \ string1:  Hello\nstring1 or string2:  Hello\nstring2 or string1:  World\nnot\
    \ string1:  False\nnot string2:  False\n\n#### 示例 2\n```python\n# Python 中的字符串逻辑运算符\n\
    string1 = \"\" # 空字符串\nstring2 = \"World\" # 非空字符串\n# 注意：'repr()' 函数会打印带单引号的字符串\n\
    # 字符串上的 and 运算符\nprint(\"string1 and string2: \", repr(string1 and string2))\n\
    print(\"string2 and string1: \", repr(string2 and string1))\nprint()\n# 字符串上的\
    \ or 运算符\nprint(\"string1 or string2: \", repr(string1 or string2))\nprint(\"\
    string2 or string1: \", repr(string2 or string1))\nprint()\n# 字符串上的 not 运算符\n\
    print(\"not string1: \", not string1)\nprint(\"not string2: \", not string2)\n\
    print()\n```\nOutput:\nstring1 and string2:  ''\nstring2 and string1:  ''\nstring1\
    \ or string2:  'World'\nstring2 or string1:  'World'\nnot string1:  True\nnot\
    \ string2:  False\n\n# if else 条件运算符\n\nPython 同样包含了使用条件运算符测试条件语句的功能，就像与其他编程语言一样。\n\
    \n如果使用了其他条件运算符，将根据给定的布尔表达式的结果来评估/获取某个值/语句（从给定的两个值/语句中）。\n\n语法：\n`value1 if expression\
    \ else value2`\n\n* `Value1`：代表如果表达式有效时的条件表达式值。\n* `Expression`：代表要评估的布尔条件（即我们可以假设这是一个条件）。\n\
    * `Value2`：代表如果表达式为假时的条件表达式值。\n\n#### 示例 1\n```python\n# 寻找最大值\nx = 20\ny = 10\n\
    # if else 条件运算符\nlargest = x if x>y else y\n# 打印值\nprint(\"x: \", x)\nprint(\"\
    y: \", y)\nprint(\"largest: \", largest)\nprint()\n\nx = 10\ny = 20\n# if else\
    \ 条件运算符\nlargest = x if x>y else y\n# 打印值\nprint(\"x: \", x)\nprint(\"y: \", y)\n\
    print(\"largest: \", largest)\nprint()\n\nx = 10\ny = 10\n# if else 条件运算符\nlargest\
    \ = x if x>y else y\n# 打印值\nprint(\"x: \", x)\nprint(\"y: \", y)\nprint(\"largest:\
    \ \", largest)\nprint()\n```\nOutput:\nx:  20\ny:  10\nlargest: 20\nx:  10\ny:\
    \  20\nlargest: 20\nx:  10\ny:  10\nlargest: 10\n\n#### 示例 2\n```python\n# 寻找最大值\n\
    x = 10\ny = 20\nz = 30\n# if else 条件运算符\nlargest = x if (x>y and x>z) else (y\
    \ if(y>x and x>z) else z)\n# 打印值\nprint(\"x: \", x)\nprint(\"y: \", y)\nprint(\"\
    z: \", z)\nprint(\"largest: \", largest)\nprint()\n\nx = 10\ny = 30\nz = 20\n\
    # if else 条件运算符\nlargest = x if (x>y and x>z) else (y if(y>x and y>z) else z)\n\
    # 打印值\nprint(\"x: \", x)\nprint(\"y: \", y)\nprint(\"z: \", z)\nprint(\"largest:\
    \ \", largest)\nprint()\n```\n\n# TAM SEL 编写的零学者 JavaScript 基础\n\n## JAVCRIPT\n\
    \n本 JavaScript 教程让初学者和专家都能轻松学习 JavaScript。\n学习 JavaScript 只需要对计算机有基础的了解。\n\n##\
    \ JAVCRIPT 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h2>欢迎来到 JavaScript</h2>\n\
    \  <script>\n    document.write(\"Hello Friends\");\n  </script>\n</body>\n</html>\n\
    ```\nJavaScript 可以通过在代码中添加 JavaScript 语句来实现。\n\n`<script>...</script>`\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n    alert(\"\
    Hello world\");\n  </script>\n</body>\n</html>\n```\n\n### JavaScript 代码可以在 HTML\
    \ 中的三个位置编写\n\n1.  HTML 的 `<body>`……`</body>` 标签之间。\n2.  HTML 的 `<head>`……`</head>`\
    \ 标签之间。\n3.  在 `.jsfile`(外部 JavaScript)。\n\n### 示例（body 标签之间的代码）\n\n在下面的示例中，body\
    \ 标签包含了 JavaScript 代码。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script\
    \ type=\"text/javascript\">\n    alert(\"Hello world\");\n  </script>\n</body>\n\
    </html>\n```\n"
- fmt: "\n# Example2 (code between the head tag)\n\nWe'll create the function `msg()`\
    \ in the example below . In JavaScript, you must write function in function name\
    \ to construct a function. To call a method, we must first create a case. We're\
    \ using the one-click event to call the `msg()` function in this case.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction msg(){\n\
    \  alert(\"Hello world\");\n}\n</script>\n</head>\n<body>\n<p>Welcome to Javascript</p>\n\
    <form>\n  <input type=\"button\" value=\"click\" onclick=\"msg()\"/>\n</form>\n\
    </body>\n</html>\n```\n\n## External JavaScript file\n\nWe can build a JavaScript\
    \ file that we can use in HTML files.\n\nSince a single JavaScript file can be\
    \ used in several HTML pages, it allows for code reuse. It improves the web page's\
    \ efficiency.\n\nThe file must have a `.js` extension.\n\n### Example\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script type=\"text/javascript\" src=\"message.js\"\
    ></script>\n</head>\n<body>\n<p>Hello world</p>\n<form>\n  <input type=\"button\"\
    \ value=\"click\" onclick=\"msg()\"/>\n</form>\n</body>\n</html>\n```\n\n# Javascript\
    \ comment\n\nComments in JavaScript are used to describe the code. It's used to\
    \ add code-related content, such as warnings or recommendations, so that end users\
    \ can understand it.\n\n## Types of JavaScript comments\n\nThere are two kinds\
    \ of JavaScript comments:\n\n1. Single-line Comment\n2. Multi-line Comment\n\n\
    ### Single-line Comment\n\nDouble forward slashes (`//`) are used to represent\
    \ single-line comments. While the program is running, any text between the double\
    \ forward slashes (`//`) and the end of the line will be ignored.\n\neg. Comment\
    \ added before the statement.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    // single-line comment //\n  document.write(\"hello world\");\n</script>\n</body>\n\
    </html>\n```\n\neg. Comment added after the statement.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\n  var a=10;\n  var b=20;\n  var c=a+b; //It add values\
    \ of a and b variable\n  document.write(c); //print sum of 10 and 20\n</script>\n\
    </body>\n</html>\n```\n\n### Output\n30\n\n## Multi-line comment\n\nSingle and\
    \ multi-line comments can also be made for multi-line comments. Comments that\
    \ span multi lines begin with `/*` and end with `*/`. JavaScript will ignore the\
    \ text in between them.\n\n### /* Write comment here */\n\n#### Example\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\n/* It is multi-line comment.\nIt will\
    \ not be displayed */\ndocument.write (\"Example of JavaScript multi line comment\"\
    );\n</script>\n</body>\n</html>\n```\n\n# Javascript Variable\n\nValues (`name=\"\
    Ram\"`) and expressions (`Sum=x+y`) are stored in variables. We must first declare\
    \ a variable before using it. To declare a variable, we use the keyword `var`\
    \ as follows:\n\n```javascript\nvar name;\n```\n\nThere are two types of variables:\n\
    \n1. Local Variable\n2. Global Variable\n\nLocal Variable– It's declared within\
    \ a function or a block.\n\n#### Example\n\n```javascript\n<script>\nfunctionabc(){\n\
    \  var x=10; //local variable\n</script>\n```\n\nGlobal Variable- It has a global\
    \ scope, meaning that it can be specified anywhere in JavaScript code. Outside\
    \ of the function, a variable is declared.\n\n#### Example\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\n  var data =200; //global variable\n  function\
    \ a(){\n    document.writeln(data);\n  }\n  function b(){\n    document.writeln(data);\n\
    \  }\n  a();//calling javascript function\n  b();\n</script>\n</body>\n</html>\n\
    ```\n\n### Declaring JavaScript global variable within function\n\nWe need to\
    \ use the `window` object to declare a JavaScript global variable within a function.\n\
    \n#### Example\n```javascript\nwindow.value=90;\n```\n\n#### It can now be declared\
    \ within any function and accessed from within any function.\n\n#### Example\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  function a(){\n    window.value=50;\
    \ //declare global variable by use of window object\n  }\n  function b(){\n  \
    \  alert(window.value);//access global variable from other function\n  }\n  a();\n\
    \  b();\n</script>\n</body>\n</html>\n```\n\n# Javascript Data Types\n\nIt has\
    \ a variety of data types to store various types of values. In Javascript, there\
    \ are two kinds of data types:\n\n1. Primitive data types.\n2. Non-primitive data\
    \ types.\n\n### Since JavaScript is a dynamic style language, we don't need to\
    \ define the type of variable because the JavaScript engine uses it dynamically.\
    \ The data type is defined using `var` in this case. It can store any sort of\
    \ value, including numbers, strings, and objects.\n\n### Example\n```javascript\n\
    var a=Ram; //String\nvar b=20; //Number\nvar x={FirstName:'Ram',lastName:'Doe'};\
    \ //Object\n```\n\n### primitive data types\nThere are 5.\n\n### non-primitive\
    \ data types\nThere are 3.\n\nOperators are used to perform operations on operands.\
    \ Following are:\n\n1. Arithmetic\n2. Comparison (relational)\n3. Bitwise\n4.\
    \ Logical\n5. Assignment\n6. Special\n\n## Arithmetic Operators\nWe use arithmetic\
    \ operations on operands.\n\n## Comparison Operators\nIn Comparison, operands\
    \ A and B are compared.\n\n## Assignment operator\nFollowing are supported by\
    \ JavaScript.\n\n### Bitwise Operators\nThe following bitwise operators are provided\
    \ by JavaScript:\n\n## Logical Operators\nBoolean values are commonly used for\
    \ logical operators. Following:\n\n# Javascript If Else\n\nA conditional statement\
    \ in JavaScript is used to perform tasks depending on the conditions. In JavaScript,\
    \ there are three types of statements:\n\n1. if Statement.\n2. if else Statement.\n\
    3. if else if Statement.\n\n## if statement\n\nIf the condition is true or false,\
    \ the if statement is used in JavaScript to execute the code.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\n  var x=50;\n  if(x>30){\n    document.write(\"\
    value of x is greater than 30\");\n  }\n</script>\n</body>\n</html>\n```\n\n####\
    \ OUTPUT\nValue of x is greater than 30\n\n## if else statement\n\nIf either condition\
    \ is true or false, the if else statement is used.\n\n### Syntax\n```javascript\n\
    if(condition)\n{\n  // set of statements\n}\nelse\n{\n  // set of statements\n\
    }\n```\n\n### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    \  var x=20;\n  if(x%2==0){\n    document.write(\"x is even number\");\n  }\n\
    \  else{\n    document.write(\"a is odd number\")\n  }\n</script>\n</body>\n</html>\n\
    ```\n\n#### OUTPUT\nX is even number\n\n## if else if\n"
