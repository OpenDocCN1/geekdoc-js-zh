    \ Type of x\nprint(\"Data type of x: \", type(x))\n```\nOutput:\n`x= 18.0`\n`Data\
    \ type of x: <class 'float'>`\n\n### 3) complex\n\nTo store complex numbers such\
    \ as 3.14j, 8.0 + 5.3j, 2 + 6j, etc., the complex numeric form is used.\n\nFormat:\
    \ `Real component + Imaginary component j`\n\nNote: `J` must denote the imaginary\
    \ part of a complex number. It is known to be an invalid syntax in Python if we\
    \ denote it with `i`.\n\n#### EXAMPLE\n\n```python\n# Assigning complex values\
    \ to Variables\nx = 1+8.5j\ny = 4+9j\n# Manipulating the value of x\nx = x + y\n\
    # Prints the updated value of x\nprint(\"x= \", x)\n# Prints the Data Type of\
    \ x\nprint(\"Data type of x: \", type(x))\n```\nOutput:\n`x= (5+17.5j)`\n`Data\
    \ type of x: <class 'complex'>`\n\n# Variables and DataTypes\n\n### 1\\. Number\n\
    \nData type numbers store numerical values. This type of data is eternal, i.e.\
