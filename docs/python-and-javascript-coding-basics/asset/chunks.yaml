    # Python 中的注释

    Python 中的注释用于提高代码的可读性。


    对于读者来说，为了更好地理解他们解决给定问题所使用的代码和逻辑，这是程序员在源代码中提供的非常有价值的信息。


    在编译期间，注释不会被执行，也不会显示在输出中。


    ## Python 注释类型

    1.  单行注释 (#)

    2.  多行字符串作为注释 ('''')


    ### 1) 单行注释

    单行注释用于 Python 中的单行语句，例如对各种变量、函数、表达式等的解释。


