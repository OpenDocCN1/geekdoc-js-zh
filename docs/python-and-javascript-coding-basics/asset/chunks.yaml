    \ string.\n"
  raw: 'A hash (#) symbol is used to render single-line comments without whitespace
    when the comments go to the next line, then at the beginning of the next line
    they must position each other''s hashtag (#).


    Let''s see an instance and try to understand how in the software we apply the
    single-line comments.


    #### EXAMPLE


    ##### # Single line comments example


    ##### # a program to print a given string and addition.


    ##### print(''Welcome @ Learnpython'')


    ##### a=2


    ##### b=5


    ##### print(a+b)


    ##### # addition of both numbers by using plus(+) sign.


    ### 2) Multi-line string comments


    As we''ve seen in the above example, we have to put a hash (#) symbol in each
    line for multi-line comments.


    In Python, multi-line string comments are given using the delimiter When it does
    not fit into one line, it is helpful.


    We have to enclose the string with a delimiter at both ends for multiline string
    comments.


    #### EXAMPLE


    ##### ''''''


    #####     Here we will check a given number n is even or odd


    #####     with multi-line comments in Python.


    ##### ''''''


    ##### n=6768


    ##### if n%2==0:


    #####        print("Even number.")


    ##### else:


    #####       print("Odd number.")


    # Block Comments in Python


    ### Comments


    A comment is a piece of text in a computer program that is intended to be an interpretation
    or annotation.


    It readable by the author in the source code and that is ignored by the compiler
    / interpreter.


    ### Type of Python Comments


    Block Comments and Inline Comments,


    ### 1) Block Comments


    For the piece of code that follows, Block comments apply. It may refer to a part
    of the code or the code as a whole.


    They have the same degree of indentation as that code.


    Each comment line begins with a #.


    #### EXAMPLE


    ##### # Python program to print


    ##### # Hello World


    ##### print("Hello World")


    Output:


    ##### Hello World


    It is also possible to make block comments using  '''''' '''''' Something written
    in these quotes is known as Comment.


    #### EXAMPLE


    ##### ''''''


    ##### Python program to print


    ##### Hello World


    ##### ''''''


    ##### print("Hello World")


    #### EXAMPLE 2


    ##### def hello():


    #####     ''''''


    #####     Here, this is docstring


    #####     since it is written right after


    #####     the function definition.


    #####     below given print statement will print


    #####     Hello World


    #####     ''''''


    #####     print("Hello World")


    ##### if __name__ == "__main__":


    #####   # calling hello function


    #####   hello()


    ### 2) Inline Comments


    A comment on the same line as a declaration is an inline comment.


    Inline remarks should be separated from the argument by at least two spaces.


    They''re supposed to begin with a # and a single room.


    #### EXAMPLE


    ##### print("Hello World")  # This is an inline comment


    #### OUTPUT


    Hello World


    # Create multiline comments


    There are two ways to do this when we need to comment on several lines / statements,
    either comment on each line or build multiline comments (or block comment).


    The first approach is to comment on every section,


    This can be regarded as a single line comment in Python-at the beginning of each
    line to be commented, we use the hash character (#).


    #### # This is line 1


    #### # This is line 2


    #### # This is line 3


    And, the second way to comment on the segment,


    This can be considered in Python as a multiline comment-we use triple single quotes
    ("'') at the beginning of the segment to be commented and triple single quotes
    ("'') at the end.


    #### ''''''


    #### This is line 1


    #### This is line 2


    #### This is line 3


    #### ''''''


    #### EXAMPLE


    ##### ''''''


    ##### Function name: print_text


    ##### Parameters: None


    ##### Return type: None


    ##### Description: This function will print


    ##### some text on the screen


    ##### ''''''


    ##### def print_text():


    #####   print("Hello, world! How are you?")


    ##### if __name__ == "__main__":


    #####   # Here, we will call the print_text function


    #####   # that will print some text on the screen


    #####   print_text()


    # Python Numeric Types


    Data types are an important concept in programming.


    Data of different kinds can be stored in variables according to the role that
    we want the variables to perform.


    In Python, the built-in data types are


    *   Text Type


    *   Numeric Type


    *   Mapping Type


    *   Sequence Type


    *   Set Type


    *   Boolean Type


    *   Binary Type


    3 numeric data types in Python:


    1.  int


    2.  float


    3.  comple


    ### 1) int


    The Integer numeric form is used without decimal points to store signed integers,
    such as -5, 2, 78, etc.


    #### EXAMPLE


    ##### # Assigning integer values to Variables


    ##### x = 8


    ##### y = -9


    ##### # Manipulating the value of x


    ##### x = x + y


    ##### # Prints the updated value of x


    ##### print("x= ", x)


    ##### # Prints the Data Type of x


    ##### print("Data type of x: ", type(x))


    Output


    x=  -1


    Data type of x:  <class ''int''>


    ### 2) float


    The numerical form of float is used to store floating-point values such as 6.66,
    58.9, 3.14, etc.


    Floats can be in scientific notation as well, with a power of 10 (3.6e3 = 3.6x
    103 = 3600) indicated by E or e.


    #### EXAMPLE


    ##### # Assigning float values to Variables


    ##### x = 8.9


    ##### y = -9.1


    ##### # Manipulating the value of x


    ##### x = x - y


    ##### # Prints the updated value of x


    ##### print("x= ", x)


    ##### # Prints the Data Type of x


    ##### print("Data type of x: ", type(x))


    Output


    x=  18.0


    Data type of x:  <class ''float''>


    ### 3) complex


    To store complex numbers such as 3.14j, 8.0 + 5.3j, 2 + 6j, etc., the complex
    numeric form is used.


    Format: Real component + Imaginary component j


    Note: J must denote the imaginary part of a complex number. It is known to be
    an invalid syntax in Python if we denote it with i.


    #### EXAMPLE


    ##### # Assigning complex values to Variables


    ##### x = 1+8.5j


    ##### y = 4+9j


    ##### # Manipulating the value of x


    ##### x = x + y


    ##### # Prints the updated value of x


    ##### print("x= ", x)


    ##### # Prints the Data Type of x


    ##### print("Data type of x: ", type(x))


    Output


    x=  (5+17.5j)


    Data type of x:  <class ''complex''>


    # Variables and DataTypes


    ### 1\. Number


    Data type numbers store numerical values. This type of data is eternal, i.e. the
    meaning of its object can not be modified (this aspect will be addressed later).


    They come in three different kinds:


    #### • Integer & Long


    #### • Float/floating point


    #### • Complex


    i) Integers:


    Integers are whole numbers with decimal digits such as 100000, -99, 0, 17 consisting
    of + or-sign.


    L is appended to the value when we want a value to be viewed as a very long integer
    value. Python considers those values as long integers.


    ##### >>> a = 10


    ##### >>> b = 5192L #example of supplying a very long value to a variable


    ##### >>> c= 4298114


    ##### >>> type(c) # type ( ) is used to check data type of value


    ii) Floating Point:


    Floating-point numbers are called numbers of fractions or decimal points.


    A floating point number consists of a decimal digit series of signs (+,-) and
    a dot such as 0.0, -21.9, 0.98333328, 15.2963.


    iii) Complex:


    The python complex number consists of two floating point values, each one for
    real and imaginary sections.


    We''ll use x.real and x.image to access various parts of the vector (object) x.


    The imaginary part of the number is defined by j instead of I so the imaginary
    part of 1 + 0j denotes zero.


    #### EXAMPLE


    ##### >>> x = 1+0j


    ##### >>> print (x.real,x.imag)


    ##### 1.0 0.0


    ### 2\. None


    This is a particular category of data with a single value. It is used in a scenario
    to indicate the absence of value / false. It is pictured by None.


    ### 3\. Sequence


    An ordered set of objects, indexed by positive integers, is a sequence.


    It is a mixture of data types that are mutable and non-mutable.


    Lines, Lists & Tuples are three sequence data form types available in Python.


    3.1) String:


    It is an ordered sequence of characters / letters.


    They are found in single quotes (") or double quotes (").


    The quotes do not form part of the string.'
