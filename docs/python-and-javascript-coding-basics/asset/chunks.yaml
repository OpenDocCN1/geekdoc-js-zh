    if __name__ == \"__main__\":\n  # calling hello function\n  hello()\n```\n\n###\
    \ 2) Inline Comments\n\nA comment on the same line as a declaration is an inline\
    \ comment.\n\nInline remarks should be separated from the argument by at least\
    \ two spaces.\n\nThey're supposed to begin with a `#` and a single room.\n\n####\
    \ EXAMPLE\n\n```python\nprint(\"Hello World\")  # This is an inline comment\n\
    ```\nOUTPUT\n`Hello World`\n\n# Create multiline comments\n\nThere are two ways\
    \ to do this when we need to comment on several lines / statements, either comment\
    \ on each line or build multiline comments (or block comment).\n\nThe first approach\
    \ is to comment on every section,\n\nThis can be regarded as a single line comment\
    \ in Python-at the beginning of each line to be commented, we use the hash character\
    \ (`#`).\n\n```python\n# This is line 1\n# This is line 2\n# This is line 3\n\
    ```\n\nAnd, the second way to comment on the segment,\n\nThis can be considered\
    \ in Python as a multiline comment-we use triple single quotes (`'''`) at the\
