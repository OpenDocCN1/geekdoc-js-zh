    \ in Python.\n'''\nn=6768\nif n%2==0:\n    print(\"Even number.\")\nelse:\n  \
    \  print(\"Odd number.\")\n```\n\n# Block Comments in Python\n\n### Comments\n\
    \nA comment is a piece of text in a computer program that is intended or an interpretation\
