    \ 20, 30, 40]\ny = [40, 30, 20, 10]\nprint(\"x + y:\", x + y)\nprint(\"x + y +\
    \ x:\", x + y + x)\nprint(\"x * 2:\", x * 2)\nprint(\"x * 3:\", x * 3)\nprint()\n\
    ```\n输出：\n```text\nx + y: HelloWorld\nx + y + x: HelloWorldHello\nx * 2: HelloHello\n\
    x * 10: HelloHelloHelloHelloHelloHelloHelloHelloHelloHelloHello\nx + y: [10, 20,\
    \ 30, 40, 40, 30, 20, 10]\nx + y + x: [10, 20, 30, 40, 40, 30, 20, 10, 10, 20,\
    \ 30, 40]\nx * 2: [10, 20, 30, 40, 10, 20, 30, 40]\nx * 3: [10, 20, 30, 40, 10,\
    \ 20, 30, 40, 10, 20, 30, 40]\n```\n\n# Python 标识运算符\n标识运算符用于执行对象比较操作，即这些运算符检查两个操作数是否应用于同一个对象（具有相同的内存位置）。\n\
    \n标识运算符如下：\n\n![](img/image00170.jpeg)\n\n语法：\n- `operand1 is operand2`\n- `operand1\
