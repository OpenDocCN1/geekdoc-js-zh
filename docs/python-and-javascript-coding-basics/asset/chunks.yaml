    ```\n### 输出\nHello Raj! How are you?\n\n## Function() 构造函数\n\n`function` 语句不仅用于定义函数，还可以使用\
    \ `Function()` 构造函数动态定义函数。\n\n### 语法\n\n```\nvar varName = Function(Arg1, Arg2...,\
    \ \"Body\");\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\n\
    var func = Function(\"a\", \"b\", \"return a+b;\");\nfunction secondFunction(){\n\
    var result;\nresult = func(5,0);\ndocument.write(result);\n}\n</script>\n</head>\n\
    <body>\n<p>点击按钮调用函数</p>\n<form>\n<input type=\"button\" onclick=\"secondFunction()\"\
    \ value=\"Function\">\n</form>\n<p>使用不同的参数并尝试...</p>\n</body>\n</html>\n```\n\n\
    ## 函数字面量 (Function Literals)\n\nJavaScript 引入了函数字面量的定义，这是描述函数的另一种方式。它是一个没有名字的表达式。函数字面量的语法与语句相似，但它是作为表达式而不是语句，并且不需要函数名。\n\
    \n### 语法\n\n```\nvar varName = function(参数){\n  正体\n};\n```\n\n### 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func = function(a,b){\n  return\
    \ a+b;\n};\nfunction secondFunction(){\nvar result;\nresult = func(10,20);\ndocument.write(result);\n\
    }\n</script>\n</head>\n<body>\n<p>点击按钮调用函数</p>\n<form>\n<input type=\"button\"\
    \ onclick=\"secondFunction()\" value=\"Function\">\n</form>\n<p>使用不同的参数并尝试...</p>\n\
    </body>\n</html>\n```\n\n# JavaScript 对象\n\n对象是一个状态和行为的实体。JavaScript 是一种关注对象的脚本语言。虽然\
    \ JavaScript 是基于模板而非基于类的，但它允许我们构建对象。\n\n### 语法\n\n```\n对象名.对象属性 = 属性值;\n```\n\n\
    为了写入一些内容，我们使用 `document` 上的 `write()` 方法。\n`document.write(\"Hello\")`\n\n####\
    \ 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n<script\
    \ type=\"text/javascript\">\nvar book = new Object(); // 创建对象\nbook.subject =\
    \ \"5 points someone\"; // 属性赋值给对象\nbook.author = \"Chetagat\";\n</script>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\ndocument.write(\"Book Name is : \"\
    \ + book.subject + \"<br>\");\ndocument.write(\"Book Author is : \" + book.author\
    \ + \"<br>\");\n</script>\n</</body>\n</html>\n```\n\n#### 输出\nBook Name is: 5\
    \ points someone\nBook Author is: Chetanagat\n\n### 对象的方法\n\n#### 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n<script type=\"text/javascript\"\
    >\n// 定义一个将作为方法的函数\nfunction addPrice(amount){\n  this.price = amount;\n}\nfunction\
    \ book(title,author){\n  this.itle = title;\n  this.author = author;\n  this.addPrice\
    \ = addPrice; // 将该方法赋值为属性。\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n\
