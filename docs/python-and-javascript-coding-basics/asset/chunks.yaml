  trans: "\n\n# 示例 2（head 标签之间的代码）\n\n我们将在下面的示例中创建 `msg()` 函数。在 JavaScript 中，你必须在函数名后编写函数体来构造函数。要调用方法，我们必须先创建一个实例。在此例中，我们正在使用点击事件来调用\
    \ `msg()` 函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\nfunction msg(){\n  alert(\"Hello world\");\n}\n</script>\n</head>\n<body>\n\
    <p>Welcome to Javascript</p>\n<form>\n  <input type=\"button\" value=\"click\"\
    \ onclick=\"msg()\"/>\n</form>\n</body>\n</html>\n```\n\n## 外部 JavaScript 文件\n\
    \n我们可以构建一个可以在 HTML 文件中使用的 JavaScript 文件。\n\n由于单个 JavaScript 文件可以用于多个 HTML 页面，因此它允许代码复用。这提高了了网页页的执行效率。\n\
    \n该文件必须具有 `.js` 扩展名。\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script\
    \ type=\"text/javascript\" src=\"message.js\"></script>\n</head>\n<body>\n<p>Hello\
    \ world</p>\n<form>\n  <input type=\"button\" value=\"click\" onclick=\"msg()\"\
    />\n</form>\n</body>\n</html>\n```\n\n# JavaScript 注释\n\nJavaScript 中的注释用于描述代码。它被用于添加代码相关的内容，例如警告或建议，以便终端用户能够理解。\n\
    \n## JavaScript 注释的类型\n\nJavaScript 注释共有两种类型：\n\n1. 单行注释\n2. 多行注释\n\n### 单行注释\n\
    \n双正斜杠（`//`）用于单行注释。在程序运行时，双正斜杠（`//`）与行尾之间的任何文本都会被忽略。\n\n例如。在语句之前添加注释。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\n// single-line comment //\n  document.write(\"\
    hello world\");\n</script>\n</body>\n</html>\n```\n\n例如。在语句之后添加注释。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\n  var a=10;\n  var b=20;\n  var c=a+b;\
    \ //It add values of a and b variable\n  document.write(c); //print sum of 10\
    \ and 20\n</script>\n</body>\n</html>\n```\n\n### 输出\n30\n\n## 多行注释\n\n单行和多行注释也可以用于多行注释。跨越多行的注释以\
    \ `/*` 开始并以 `*/` 结束。JavaScript 将忽略它们之间的文本。\n\n### /* 在此处编写注释 */\n\n#### 示例\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n/* It is multi-line comment.\n\
    It will not be displayed */\ndocument.write (\"Example of JavaScript multi line\
    \ comment\");\n</script>\n</body>\n</html>\n```\n\n# JavaScript 变量\n\n值（`name=\"\
    Ram\"`）和表达式（`Sum=x+y`）存储在变量中。我们必须在使用变量之前先对其进行声明。要声明变量，我们按照如下方式使用关键字 `var`：\n\n\
    ```javascript\nvar name;\n```\n\n变量有两种类型：\n\n1. 局部变量\n2. 全局变量\n\n局部变量——它在函数或块内部声明。\n\
    \n#### 示例\n\n```javascript\n<script>\nfunctionabc(){\n  var x=10; //local variable\n\
    </script>\n```\n\n全局变量——它具有全局作用域，这意味着它可以在 JavaScript 代码的任何地方指定。在函数外部声明了一个变量。\n\
    \n#### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var data =200;\
    \ //global variable\n  function a(){\n    document.writeln(data);\n  }\n  function\
    \ b(){\n    document.writeln(data);\n  }\n  a();//calling javascript function\n\
    \  b();\n</script>\n</body>\n</html>\n```\n\n### 在函数内部声明 JavaScript 全局变量\n\n我们需要使用\
    \ `window` 对象在函数内部声明 JavaScript 全局变量。\n\n#### 示例\n```javascript\nwindow.value=90;\n\
    ```\n\n#### 现在可以在任何函数内部声明并从任何函数内部访问它。\n\n#### 示例\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\n  function a(){\n    window.value=50; //declare global\
    \ variable by use of window object\n  }\n  function b(){\n    alert(window.value);//access\
