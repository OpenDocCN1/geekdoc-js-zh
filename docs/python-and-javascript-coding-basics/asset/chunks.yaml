    # 演示算术运算符\n# 示例的 Python 程序\n# 列表、字符串等上的操作\nx = \"Hello\"\ny = \"World\"\n# 字符串的\
    \ '+', '*'\nprint(\"x + y:\", x + y)\nprint(\"x + y + x:\", x + y + x)\nprint(\"\
