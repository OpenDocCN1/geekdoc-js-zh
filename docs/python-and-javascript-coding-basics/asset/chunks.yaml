    \n![](img/image00182.jpeg)\n\n# Javascript 字符串\n\n`String` 对象用于与字符字符串进行交互。它是存储和处理文本的工具。\n\
    \n在 JavaScript 中，有两种方法创建字符串：\n\n1. 字符串字面量。\n2. 使用 `new` 关键字。\n\n字符串字面量通过双引号形成。\n\
    \n## 语法\n\n```javascript\nvar stringname=\"string value\";\n```\n\n## 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\n  var str=\"Hello String Literal\"\
    ;\n  document.write(str);\n</script>\n</body>\n</html>\n```\n\n**OUTPUT**\nHello\
    \ String Literal\n\n## 使用 new 关键字\n\n### 语法\n\n```javascript\nvar stringname=new\
    \ String(\"new keyword\")\n```\n\n**OUTPUT**\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<script>\n  var stringname=new String(\"Hello String\");\n  document.write(stringname);\n\
    </script>\n</body>\n</html>\n```\n\n**OUTPUT**\nHello String\n\n## 字符串属性\n\n有一个字符串对象属性列表及其描述。\n\
    \n1. `constructor`。\n2. `length`。\n3. `prototype`。\n\n**Constructor (构造函数)** –\
    \ 此方法返回对象字符串函数的引用。\n\n### 语法\n\n```javascript\nstring.constructor\n```\n\n**Length\
    \ (长度)** - 返回字符串中的字符数。\n\n### 语法\n\n```javascript\nstring.length\n```\n\n**Prototype\
    \ (原型)** - 它允许任何对象拥有属性和方法（数字、布尔、字符串和数据等）。\n\n### 语法\n\n```javascript\nobject.prototype.name\
    \ = value\n```\n\n## 方法\n\n![](img/image00183.jpeg)\n\n## charAt()\n\n这是一个从索引获取字符的方法。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var str = new String(\"\
    Hello\");\n  document.writeln(\"str.charAt(0) is: \" + str.charAt(0));\n  document.writeln(\"\
    <br />str.charAt(1) is: \" + str.charAt(1));\n  document.writeln(\"<br />str.charAt(2)\
    \ is: \" + str.charAt(2));\n  document.writeln(\"<br />str.charAt(3) is: \" +\
    \ str.charAt(3));\n  document.writeln(\"<br />str.charAt(4) is: \" + str.charAt(4));\n\
    </script>\n</body>\n</html>\n```\n\n## concat(str)\n\n此方法在添加两个更多字符串后返回新字符串。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var x=\"Hello\";\n  var\
    \ y=\"World\";\n  var z=x+y;\n  document.write(z);\n</script>\n</body>\n</html>\n\
    ```\n\n## indexOf(str)\n\n`indexOf` 方法返回给定字符串的索引。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\n  var x=\"Tutorial provideby\";\n  var y=x.indexOf(\"\
    by\");\n  document.write(y);\n</script>\n</body>\n</html>\n```\n\n## lastIndexOf(str)\n\
    \n`lastIndexOf` 方法返回字符串的最后一个索引。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script>\n  var x=\"Tutorial provideby\";\n  var y=x.lastIndexOf(\"by\");\n  document.write(y);\n\
    </script>\n</body>\n</html>\n```\n\n## match(re)\n\n`match` 方法返回匹配项数组。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\n  var str=\"To detail Chapter5.4\"\
    ;\n  var re=/\\d+/g;\n  var find=str.match(re);\n  document.write(find);\n</script>\n\
    </body>\n</html>\n```\n\n## toLowerCase()\n\n它返回给定字符串的小写版本。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\n  var x=\"HELLO\";\n  var y=x.toLowerCase();\n\
    \  document.write(y);\n</script>\n</body>\n</html>\n```\n\n## toUpperCase()\n\n\
    它返回提供的字符串的大写形式。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n  var x=\"\
    hello\";\n  var y=x.toUpperCase();\n  document.write(y);\n</script>\n</body>\n\
    </html>\n```\n\n## valueOf()\n\n它返回字符串对象的原始值。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<script>\n  var str=new String(\"Hello\");\n  document.write(str.valueOf());\n\
    </script>\n</body>\n</html>\n```\n\n# Javascript Date\n\nDate 对象是语言中内置的一种数据类型。`new\
    \ Date()` 对象用于构建数据对象。时间中的单个时刻由 JavaScript 情况表示。创建 JavaScript 日期的唯一方法是使用构造函数。\n\
    \n## 语法\n\n`Date()` 构造函数可以使用以下语法生成 Date 对象：\n\n```javascript\nnew Date();\nnew\
    \ Date(value);\nnew Date(dateString);\nnew Date(year, month, day, hours, minutes,\
    \ milliseconds);\n```\n\n#### 注意：括号内的参数始终是可选的。\n\n### \n\n### year (年份)\n年份由整数表示。对于\
    \ 2000 年到 2099 年，值的范围映射为 0 到 99。\n\n### Month (月份)\n从 0 表示一月开始，到 11 表示十二月结束，此整数值代表月份。\n\
    \n### Date (日期)\n这是一个选项。月份的天数由整数值表示。\n\n### Hours (小时)\n这是一个选项。一天的小时由整数值表示。\n\n\
    ### Minutes (分钟)\n这是一个选项。时间的分钟部分由整数值表示。\n\n### Seconds (秒)\n这是一个选项。秒时间段由整数值表示。\n\
    \n### Milliseconds (毫秒)\n这是一个选项。毫秒时间段由整数值表示。\n\n### Date 示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\n  var date=new Date();\n  var day=date.getDate();\n\
    \  var month=date.getMonth()+1;\n</script>\n</body>\n</html>\n```\n\n"
