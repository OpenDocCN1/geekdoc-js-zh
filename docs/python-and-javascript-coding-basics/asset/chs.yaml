  ```bash\nsudo apt-get update\n```\n\n### $ sudo apt-get install python-pip\n```bash\n\
  sudo apt-get install python-pip\n```\n\n### $ sudo pip install --upgrade pip\n```bash\n\
  sudo pip install --upgrade pip\n```\n\nCentos 中的 pip\n\n### $ sudo yum update\n\
