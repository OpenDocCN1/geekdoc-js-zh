- "# Python 和 JavaScript 编码基础\n\n\n\n![](img/cover00185.jpeg)\n\n\n## Python 简介\n\n\
  ### Python 的显著特性\n它是一种通用编程语言，既可用于科学编程也可用于非科学编程。\n\n对于初来说，它是非常优秀的语言，因为它是解释型的，可以产生立即结果。\n\
  \n它比同时期的其他语言更好地融合了异常处理和动态绑定原则。\n\n用 `Python` 编写的程序易读且易懂。\n\n它是一种独立平台的编程语言。\n\n对于自定义应用程序，它适用于扩展语言。\n\
  \n学习和使用它非常简单。\n\n### 主要应用\nGoogle 搜索引擎、Twitter 等。\n\n使用 `Python` 了 BitTorrent 点对点文件共享程序。\n\
  \nIntel、Cisco、HP、IBM 等公司使用 `Python` 进行硬件测试。\n\nMaya 提供了 `Python` 脚本 API。\n\n工业机器人的制造使用了\
  \ `Python`。\n\nNASA 等机构使用 `Python` 进行科学编程活动。\n\n### 安装 Python 解释器\n为了编写和运行 `Python`\
  \ 程序，我们需要在计算机上安装一个 `Python` 解释器。\n\n标准且最常用的 `Python` 开发环境是 `IDLE`（集成 GUI）。\n\n`IDLE`\
  \ 指的是集成开发环境（Integrated Development）。\n\n这允许通过单一 GUI 修改、运行、搜索和调试 `Python` 程序。这种环境使得编写程序变得简单。\n\
  \n注意：在这些教程中，我们将使用 3.6 版本的 `Python` `IDLE` 来开发和运行 `Python` 代码。你可以在 www.python.org\
  \ 免费获取。\n\n启动 `IDLE`\n\n![](img/image00157.jpeg)\n\n## Python 的特性\n* 面向对象\n* 强异常处理\n\
  * 自动内存管理\n* 动态性\n* 强数据类型\n* 语法简单\n* 基于缩进\n* 本质具有容错性\n\n在 Python 中打印 \"Hello World\"\
  \n\n![](img/image00158.jpeg)\n\n## 安装 pip\n`Pip` 是一个能够安装和管理 Python 包的平台。\n\n###\
