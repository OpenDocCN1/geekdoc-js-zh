- md: "\n**20 Chapter 2\n\nIn this code, there is a function declaration for sayHi.\
    \ A variable named sayHi2 is then created and assigned the value of sayHi. Both\
    \ sayHi and sayHi2 are now pointing to the same function, and that means either\
    \ can be executed, with the same result. To understand why this happens, take\
    \ a look at the same code rewritten to use the Function constructor:\n\n```javascript\n\
    var sayHi = new Function(\"console.log(\\\"Hi!\\\");\");\n\nsayHi(); // outputs\
    \ \"Hi!\"\n\nvar sayHi2 = sayHi;\n\nsayHi2(); // outputs \"Hi!\"\n```\n\nThe Function\
    \ constructor makes it more explicit that sayHi can be passed around just like\
    \ any other object. When you keep in mind that functions are objects, a lot of\
    \ the behavior starts to make sense.\n\nFor instance, you can pass a function\
    \ into another function as an argument. The sort() method on JavaScript arrays\
    \ accepts a comparison function as an optional parameter. The comparison function\
    \ is called whenever two values in the array must be compared. If the first value\
    \ is smaller than the second, the comparison function must return a negative number.\
    \ If the first value is larger than the second, the function must return a positive\
    \ number. If the two values are equal, the function should return zero.\n\nBy\
    \ default, sort() converts every item in an array to a string and then performs\
    \ a comparison. That means you can’t accurately sort an array of numbers without\
    \ specifying a comparison function. For example, you need to include a comparison\
    \ function to accurately sort an array of numbers, such as:\n\n```javascript\n\
    var numbers = [1, 5, 8, 4, 7, 10, 2, 6];\n\nnumbers.sort(function(first, second)\
    \ {\n return first - second;\n});\n\nconsole.log(numbers); // \"[1, 2, 4, 5, 6,\
    \ 7, 8, 10]\"\n\nnumbers.sort();\n\nconsole.log(numbers); // \"[1, 10, 2, 4, 5,\
    \ 6, 7, 8]\"\n```\n\nIn this example, the comparison function that is passed into\
    \ sort() is actually a function expression. Note that there is no name for the\
    \ function; it exists only as a reference that is passed into another function\
    \ (making it an *anonymous function*). Subtracting the two values returns the\
    \ correct result from the comparison function.\n\nFunctions **21**\n\nCompare\
    \ that to the second call to sort(), which does not use a comparison function.\
    \ The order of the array is different than expected, as 1 is followed by 10. This\
    \ is because the default comparison converts all values to strings before comparing\
    \ them.\n\n## Parameters\n\nAnother unique aspect of JavaScript functions is that\
    \ you can pass any number of parameters to any function without causing an error.\
    \ That’s because function parameters are actually stored as an array-like structure\
    \ called arguments. Just like a regular JavaScript array, arguments can grow to\
    \ contain any number of values. The values are referenced via numeric indices,\
    \ and there is a length property to determine how many values are present.\n\n\
    The arguments object is automatically available inside any function. This means\
    \ named parameters in a function exist mostly for convenience and don’t actually\
    \ limit the number of arguments that a function can accept.\n\n**NOTE*** The **arguments**\
    \ object is not an instance of **Array** and therefore doesn’t have the *same\
    \ methods as an array; **Array.isArray(arguments)** always returns **false**.*\n\
    \nOn the other hand, JavaScript doesn’t ignore the named parameters of a function\
    \ either. The number of arguments a function expects is stored on the function’s\
    \ length property. Remember, a function is actually just an object, so it can\
    \ have properties. The length property indicates the function’s *arity*, or the\
    \ number of parameters it expects. Knowing the function’s arity is important in\
    \ JavaScript because functions won’t throw an error if you pass in too many or\
    \ too few parameters.\n\nHere’s a simple example using arguments and function\
    \ arity; note that the number of arguments passed to the function has no effect\
    \ on the reported arity:\n\n```javascript\nfunction reflect(value) {\n return\
    \ value;\n}\n\nconsole.log(reflect(\"Hi!\")); // \"Hi!\"\nconsole.log(reflect(\"\
    Hi!\", 25)); // \"Hi!\"\nconsole.log(reflect.length); // 1\n\nreflect = function()\
    \ {\n return arguments[0];\n};\n\nconsole.log(reflect(\"Hi!\")); // \"Hi!\"\n\
    console.log(reflect(\"Hi!\", 25)); // \"Hi!\"\nconsole.log(reflect.length); //\
    \ 0\n```\n\n**22 Chapter 2**\n\nThis example first defines the reflect() function\
    \ using a single named parameter, but there is no error when a second parameter\
    \ is passed into the function. Also, the length property is 1 because there is\
    \ a single named parameter. The reflect() function is then redefined with no named\
    \ parameters; it returns arguments[0], which is the first argument that is passed\
    \ in. This new version of the function works exactly the same as the previous\
    \ version, but its length is 0.\n\nThe first implementation of reflect() is much\
    \ easier to understand because it uses a named argument (as you would in other\
    \ languages). The version that uses the arguments object can be confusing because\
    \ there are no named arguments, and you must read the body of the function to\
    \ determine if arguments are used. That is why many developers prefer to avoid\
    \ using arguments unless necessary.\n\nSometimes, however, using arguments is\
    \ actually more effective than naming parameters. For instance, suppose you want\
    \ to create a function that accepts any number of parameters and returns their\
    \ sum. You can’t use named parameters because you don’t know how many you will\
    \ need, so in this case, using arguments is the best option.\n\n```javascript\n\
    function sum() {\n var result = 0,\n i = 0,\n len = arguments.length;\n while\
    \ (i < len) {\n result += arguments[i];\n i++;\n }\n return result;\n}\n\nconsole.log(sum(1,\
    \ 2)); // 3\nconsole.log(sum(3, 4, 5, 6)); // 18\nconsole.log(sum(50)); // 50\n\
    console.log(sum()); // 0\n```\n\nThe sum() function accepts any number of parameters\
    \ and adds them together by iterating over the values in arguments with a while\
    \ loop. This is exactly the same as if you had to add together an array of numbers.\
    \ The function even works when no parameters are passed in, because result is\
    \ initialized with a value of 0.\n\nFunctions **23**\n\n## Overloading\n\nMost\
    \ object-oriented languages support *function overloading*, which is the ability\
    \ of a single function to have multiple *signatures*. A function signature is\
    \ made up of the function name plus the number and type of parameters the function\
    \ expects. Thus, a single function can have one signature that accepts a single\
    \ string argument and another that accepts two numeric arguments. The language\
    \ determines which version of a function to call based on the arguments that are\
    \ passed in.\n\nAs mentioned previously, JavaScript functions can accept any number\
    \ of parameters, and the types of parameters a function takes aren’t specified\
    \ at all. That means JavaScript functions don’t actually have signatures. A lack\
    \ of function signatures also means a lack of function overloading. Look at what\
    \ happens when you try to declare two functions with the same name:\n\n```javascript\n\
    function sayMessage(message) {\n console.log(message);\n}\n\nfunction sayMessage()\
    \ {\n console.log(\"Default message\");\n}\n\nsayMessage(\"Hello!\"); // outputs\
    \ \"Default message\"\n```\n\nIf this were another language, the output of sayMessage(\"\
    Hello!\") would likely be \"Hello!\". In JavaScript, however, when you define\
    \ multiple functions with the same name, the one that appears last in your code\
    \ wins. The earlier function declarations are completely removed, and the last\
    \ is the one that is used. Once again, it helps to think about this situation\
    \ using objects:\n\n```javascript\nvar sayMessage = new Function(\"message\",\
    \ \"console.log(message);\");\n\nsayMessage = new Function(\"console.log(\\\"\
    Default message\\\\\");\");\n\nsayMessage(\"Hello!\"); // outputs \"Default message\"\
    \n```\n\nLooking at the code this way makes it clear why the previous code didn’t\
    \ work. A function object is being assigned to sayMessage twice in a row, so it\
    \ makes sense that the first function object would be lost.\n"
  mdcn: "\n\n**20 第 2 章**\n\n在这段代码中，有一个 `sayHi` 的函数声明。随后创建了一个名为 `sayHi2` 的变量并将其赋值为\
    \ `sayHi` 的值。现在 `sayHi` 和 `sayHi2` 都指向同一个函数，这意味着其中任何一个都可以执行，且结果相同。为了理解为什么会发生这种情况，请使用\
    \ `Function` 构造函数重写的相同代码：\n\n```javascript\nvar sayHi = new Function(\"console.log(\\\
    \"Hi!\\\");\");\n\nsayHi(); // 输出 \"Hi!\"\n\nvar sayHi2 = sayHi;\n\nsayHi2();\
    \ // 输出 \"Hi!\"\n```\n\n`Function` 构造函数更显式地表明 `sayHi` 可以像任何其他对象一样传递。当你记住函数也是对象时，很多行为就会变得容易理解。\n\
    \n例如，你可以将一个函数作为参数传递给另一个函数。JavaScript 数组上的 `sort()` 方法接受一个比较函数作为可选参数。当数组中的两个值需要进行比较时，就会调用该比较函数。如果第一个值小于第二个值，比较函数必须返回一个负数。如果第一个值大于第二个值，函数必须返回一个正数。如果两个值相等，函数应该返回零。\n\
    \n默认情况下，`sort()` 会将数组中的每一项转换为字符串然后进行比较。这意味着如果不指定比较函数，你就无法准确地对数字数组排序。例如，你需要包含一个比较函数来准确地排序数字数组，如下：\n\
    \n```javascript\nvar numbers = [1, 5, 8, 4, 7, 10, 2, 6];\n\nnumbers.sort(function(first,\
    \ second) {\n return first - second;\n});\n\nconsole.log(numbers); // \"[1, 2,\
    \ 4, 5, 6, 7, 8, 10]\"\n\nnumbers.sort();\n\nconsole.log(numbers); // \"[1, 10,\
    \ 2, 4, 5, 6, 7, 8]\"\n```\n\n在这个示例中，传递给 `sort()` 的比较函数实际上是一个函数表达式。注意，该函数没有名称；它仅作为传递给另一个函数的引用存在（使其成为一个*匿名函数*）。两个值相减可以从比较函数返回正确的结果。\n\
    \n函数 **21**\n\n与第二次调用 `sort()` 相比，后者没有使用比较函数。数组的顺序与预期不同，因为 1 后面跟着的是 10。这是因为默认比较在比较之前会将所有值转换为字符串。\n\
    \n## 参数\n\nJavaScript 函数的另一个独特之处点是，你可以向任何函数传递任意数量的参数而不会引起错误。这是因为函数参数实际上存储在一个名为\
    \ `arguments` 的类数组结构中。就像普通的 JavaScript 数组一样，`arguments` 可以增长并包含任意数量的值。这些值通过数字索引进行引用，并有一个\
    \ `length` 属性来确定存在多少个值。\n\n`arguments` 对象在任何函数内部都是可用的。这意味着函数中的命名参数的存在主要是为了方便，实际上并不会限制函数可以接受的参数数量。\n\
    \n***注意*** **arguments** 对象不是 **Array** 的实例，因此不具有与数组*相同的方法*；**Array.isArray(arguments)**\
    \ 总是返回 **false**。\n\n另一方面，JavaScript 并没有忽略函数的命名参数。函数期望的参数数量存储在函数的 `length` 属性上。请记住，函数实际上\
    \ true只是一个对象，因此它可以拥有属性。`length` 属性表示函数的*元数*（arity），即它期望的参数数量。在 JavaScript 中，知道函数的元数是非常重要的，因为如果你传递了过多或过少的参数，函数不会抛错误。\n\
    \n这里有一个使用 `arguments` 和函数元数的简单示例；注意传递给函数的参数数量对报告的元数没有影响：\n\n```javascript\nfunction\
    \ reflect(value) {\n return value;\n}\n\nconsole.log(reflect(\"Hi!\")); // \"\
    Hi!\"\nconsole.log(reflect(\"Hi!\", 25)); // \"Hi!\"\nconsole.log(reflect.length);\
    \ // 1\n\nreflect = function() {\n return arguments[0];\n};\n\nconsole.log(reflect(\"\
    Hi!\")); // \"Hi!\"\nconsole.log(reflect(\"Hi!\", 25)); // \"Hi!\"\nconsole.log(reflect.length);\
    \ // 0\n```\n\n**22 第 2 章**\n\n这个示例首先使用单个命名参数定义了 `reflect()` 函数，但当向函数传递第二个参数时，并没有报错。同样，`length`\
    \ 属性为 1，是因为存在一个命名参数。随后在没有命名参数的情况下重新定义了 `reflect()` 函数；它返回 `arguments[0]`，即传入的第一个参数。这个新版本的函数工作方式与之前的版本完全相同，但它的\
    \ `length` 为 0。\n\n`reflect()` 的第一个实现要容易理解得多，因为它使用了命名参数（就像在其他语言中那样）。使用 `arguments`\
    \ 对象的版本可能会令人困惑，因为没有命名参数，你必须阅读函数体来确定是否使用了 `arguments`。这就是为什么许多开发者倾向于在非必要的情况下避免使用\
    \ `arguments`。\n\n然而，有时使用 `arguments` 实际上比命名参数更有效。例如，假设你想创建一个接受任意数量参数并返回它们总和的函数。你无法使用命名参数，因为你不知道需要多少个，在这种情况下，使用\
    \ `arguments` 是最佳选择。\n\n```javascript\nfunction sum() {\n var result = 0,\n i\
    \ = 0,\n len = arguments.length;\n while (i < len) {\n result += arguments[i];\n\
    \ i++;\n }\n return result;\n}\n\nconsole.log(sum(1, 2)); // 3\nconsole.log(sum(3,\
    \ 4, 5, 6)); // 18\nconsole.log(sum(50)); // 50\nconsole.log(sum()); // 0\n```\n\
    \n`sum()` 函数接受任意数量的参数，并通过 `while` 循环遍历 `arguments` 中的值来将它们相加。这与你相加一个数字数组完全相同。即使在没有传递参数时，该函数也能工作，因为\
    \ `result` 初始化为 0。\n\n函数 **23**\n\n## 载重\n\n大多数大多数面向对象的语言都支持*函数重载*（function overloading），即单个函数拥有多个*签名*的能力。函数签名由函数名加上函数期望的参数数量和类型组成。因此，单个函数可以有一个接受单个字符串参数的签名，以及另一个接受两个数字参数的签名。语言会根据传入的参数来决定调用哪个版本的函数。\n\
    \n如前所述，JavaScript 函数可以接受任意数量的参数，而且函数接受的参数类型完全没有指定。这意味着 JavaScript 函数实际上没有签名。缺乏函数签名意味着没有函数重载。看看尝试声明两个同名函数时会发生什么：\n\
    \n```javascript\nfunction sayMessage(message) {\n console.log(message);\n}\n\n\
    function sayMessage() {\n console.log(\"Default message\");\n}\n\nsayMessage(\"\
    Hello!\"); // 输出 \"Default message\"\n```\n\n如果这是另一种语言，`sayMessage(\"Hello!\"\
    )` 的输出可能是 \"Hello!\"。但在 JavaScript 中，当你定义了多个同名的函数时，代码中最后出现的那个胜出。早期的函数声明会被完全移除，最后的是被使用的。再次强调，使用对象来思考这种情况会有帮助：\n\
    \n```javascript\nvar sayMessage = new Function(\"message\", \"console.log(message);\"\
    );\n\nsayMessage = new Function(\"console.log(\\\"Default message\\\\\");\");\n\
    \nsayMessage(\"Hello!\"); // 输出 \"Default message\"\n```\n\n通过这种方式观察代码可以清楚地解释为什么之前的代码不起作用。函数对象连续两次赋值给\
    \ `sayMessage`，所以第一个函数对象丢失是合合理的。\n\n"
