    = supplier\\[property\\]\n\n }\n\n }\n\n }\n\n return receiver;\n\n}\n\nHere,\
    \ mixin() checks whether Object.getOwnPropertyDescriptor() u exists \n\nto determine\
    \ whether the JavaScript engine supports ECMA­Script 5. If so, \n\nit goes on\
    \ to use the ECMAScript 5 version. Otherwise, the ECMA­Script 3 \n\nversion is\
    \ used v. This function is safe to use in both modern and legacy \n\nJavaScript\
