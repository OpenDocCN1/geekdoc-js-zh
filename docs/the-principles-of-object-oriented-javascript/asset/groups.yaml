  - "[PAGE 49]\n\nFunctions   **29**\n\n**Summary**\n\nJavaScript functions are unique\
    \ in that they are also objects, meaning \n\nthey can be accessed, copied, overwritten,\
    \ and generally treated just \n\nlike any other object value. The biggest difference\
    \ between a JavaScript \n\nfunction and other objects is a special internal property,\
    \ \\[\\[Call\\]\\], which \n\ncontains the execution instructions for the function.\
    \ The typeof opera-\n\ntor looks for this internal property on an object, and\
    \ if it finds it, returns \n\n\"function\".\n\nThere are two function literal\
    \ forms: declarations and expres-\n\nsions. Function declarations contain the\
    \ function name to the right of \n\nthe ­function keyword and are hoisted to the\
    \ top of the context in which \n\nthey are defined. Function expressions are used\
    \ where other values can \n\nalso be used, such as assignment expressions, function\
    \ parameters, or \n\nthe return value of another function.\n\nBecause functions\
    \ are objects, there is a Function constructor. You \n\ncan create new functions\
    \ with the Function constructor, but this isn’t gen-\n\nerally recommended because\
    \ it can make your code harder to understand \n\nand debugging much more difficult.\
    \ That said, you will likely run into its \n\nusage from time to time in situations\
    \ where the true form of the function \n\nisn’t known until runtime. \n\nYou need\
    \ a good grasp of functions to understand how object-­\n\noriented programming\
    \ works in JavaScript. Because Java­Script has no \n\n­concept of a class, functions\
    \ and other objects are all you have to work \n\nwith to achieve aggregation and\
    \ inheritance."
