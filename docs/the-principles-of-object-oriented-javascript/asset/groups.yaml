    \ to get the event behavior. Then, Person.prototype is mixed in with sayName()\
    \ to complete the composition. Instances of Person are not instances of EventTarget\
    \ because there is no inheritance.\n\n88 Chapter 6\n\nOf course, you might decide\
    \ that while you want to use object properties, you don’t want pseudoclassical\
    \ inheritance at all. In that case, you can use mixin directly when you create\
    \ your new object:\n\n```javascript\nvar person = mixin(new EventTarget(), {\n\
    \  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \    this.fire({ type: \"namesaid\", name: name });\n  }\n});\n```\n\nIn this\
    \ example, a new instance of EventTarget is mixed in with some properties without\
    \ affecting person’s prototype chain. One thing to keep in mind about using mixins\
    \ this way is that accessor properties on supplier become data properties on receiver,\
    \ which means you can overwrite them if you’re not careful. That’s because the\
    \ receiver properties are being created by assignment rather than Object.defineProperty(),\
    \ meaning the current value of supplier property is read and then assigned to\
    \ a property of the same name on receiver. For example:\n\n```javascript\nvar\
    \ person = mixin(new EventTarget(), {\n  get name() {\n    return \"Nicholas\"\
    \n  },\n  sayName: function() {\n    console.log(this.name);\n    this.fire({\
    \ type: \"namesaid\", name: name });\n  }\n});\n\nconsole.log(person.name); //\
    \ \"Nicholas\"\nperson.name = \"Greg\";\nconsole.log(person.name); // \"Greg\"\
    \n```\n\nObject Patterns 89\n\nIn this code, name is defined as an accessor property\
    \ with only a getter. That means assigning a value to the property should have\
    \ no effect. However, because the accessor property becomes a data property on\
    \ person object, it’s possible to overwrite name with a new value. During the\
