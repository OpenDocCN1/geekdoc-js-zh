  - "[PAGE 92]\n\n**72**   Chapter 5\n\nYou can also create objects with a null \\\
    [\\[Prototype\\]\\] via Object.create(), \n\nsuch as:\n\nvar nakedObject \\= Object.create(null);\n\
    \nconsole.log(\"toString\" in nakedObject); // false\n\nconsole.log(\"valueOf\"\
    \ in nakedObject); // false\n\nThe nakedObject in this example is an object with\
    \ no prototype chain. \n\nThat means built-in methods such as toString() and valueOf()\
    \ aren’t pres-\n\nent on the object. In effect, this object is a completely blank\
    \ slate with no \n\npredefined properties, which makes it perfect for creating\
    \ a lookup hash \n\nwithout potential naming collisions with inherited property\
    \ names. There \n\naren’t many other uses for an object like this, and you can’t\
    \ use it as if it \n\nwere inheriting from Object.prototype. For example, any\
    \ time you use an \n\noperator on nakedObject, you’ll just get an error along\
    \ the lines of “Cannot \n\nconvert object to primitive value.” Still, it’s an\
    \ interesting quirk of the \n\nJavaScript language that you can create a prototype-less\
    \ object.\n\n**Constructor Inheritance**\n\nObject inheritance in JavaScript is\
    \ also the basis of constructor inheri-\n\ntance. Recall from Chapter 4 that almost\
    \ every function has a prototype \n\nproperty that can be modified or replaced.\
    \ That prototype property is \n\nautomatically assigned to be a new generic object\
    \ that inherits from \n\nObject.prototype and has a single own property called\
