  - "[PAGE 82]\n\n**62**   Chapter 4\n\n**N O T E*** In practice, you probably won’t\
    \ use prototypes this way very often when developing *\n\n*in JavaScript. However,\
    \ it’s important to understand the relationships that exist *\n\n*between objects\
    \ and their prototype, and strange examples like this help to illumi-*\n\n*nate\
    \ the concepts.*\n\n***Built-in Object Prototypes***\n\nAt this point, you might\
    \ wonder if prototypes also allow you to modify \n\nthe built-in objects that\
    \ come standard in the JavaScript engine. The \n\nanswer is yes. All built-in\
    \ objects have constructors, and therefore, they \n\nhave proto­types that you\
    \ can change. For instance, adding a new method \n\nfor use on all arrays is as\
    \ simple as modifying Array.prototype.\n\nArray.prototype.sum \\= function() {\n\
    \n return this.reduce(function(previous, current) {\n\n return previous + current;\n\
    \n });\n\n};\n\nvar numbers \\= \\[ 1, 2, 3, 4, 5, 6 \\];\n\nvar result \\= numbers.sum();\n\
    \nconsole.log(result); // 21\n\nThis example creates a method called sum() on\
    \ Array.prototype that \n\nsimply adds up all of the items in the array and returns\
    \ the result. The \n\nnumbers array automatically has access to that method through\
    \ the proto-\n\ntype. Inside of sum(), this refers to numbers, which is an instance\
    \ of Array, so \n\nthe method is free to use other array methods such as reduce().\n\
    \nYou may recall that strings, numbers, and Booleans all have built-in \n\nprimitive\
    \ wrapper types that are used to access primitive values as if they \n\nwere objects.\
    \ If you modify the primitive wrapper type prototype as in \n\nthis example, you\
    \ can actually add more functionality to those primitive \n\nvalues:\n\nString.prototype.capitalize\
    \ \\= function() {\n\n return this.charAt(0).toUpperCase() + this.substring(1);\n\
    \n};\n\nvar message \\= \"hello world!\";\n\nconsole.log(message.capitalize());\
    \ // \"Hello world!\"\n\nThis code creates a new method called capitalize() for\
    \ strings. The \n\nString type is the primitive wrapper for strings, and modifying\
    \ its proto-\n\ntype means that all strings automatically get those changes."
- md: "\nConstructors and Prototypes **63**\n\n**NOTE** While it may be fun and interesting\
    \ to modify built-in objects to experiment with functionality, it’s not a good\
    \ idea to do so in a production environment. Developers expect built-in objects\
    \ to behave a certain way and have certain methods. Deliberately altering built-in\
    \ objects violates those expectations and makes other developers unsure how the\
    \ objects should work.\n\n**Summary**\n\nConstructors are just normal functions\
    \ that are called with the new operator. You can define your own constructors\
    \ anytime you want to create multiple objects with the same properties. You can\
    \ identify objects created from constructors using instanceof or by accessing\
    \ their constructor property directly.\n\nEvery function has a prototype property\
    \ that defines any properties shared by objects created with a particular constructor.\
    \ Shared methods and primitive value properties are typically defined on prototypes,\
    \ while all other properties are defined within the constructor. The constructor\
    \ property is actually defined on the prototype because it is shared among object\
    \ instances.\n\nThe prototype of an object is stored internally in the [[Prototype]]\
    \ property. This property is a reference, not a copy. If you change the protype\
    \ at any point in time, those changes will occur on all instances because of the\
    \ way JavaScript looks up properties. When you try to access a property on an\
    \ object, that object is searched for any own property with the name you specify.\
    \ If an own property is not found, the prototype is searched. This searching mechanism\
    \ means the prototype can continue to change, and object instances referencing\
    \ that prototype will reflect those changes immediately.\n\nBuilt-in objects also\
    \ have prototypes that can be modified. While it’s not recommended to do this\
    \ in production, it can be helpful for experimentation and proofs of concept for\
    \ new functionality.\n\n**5**\n\n## Inheritance\n\nLearning how to create objects\
    \ is the first step to understanding object-oriented programming. The second step\
    \ is to understand inheritance. In traditional object-oriented languages, classes\
    \ inherit properties from other classes.\n\nIn JavaScript, however, inheritance\
    \ can occur between objects with no classlike structure defining the relationship.\
    \ The mechanism for this inheritance is one with which you are already familiar:\
    \ prototypes.\n\n### Prototype Chaining and Object.prototype\n\nJavaScript’s built-in\
    \ approach for inheritance is called *prototype chaining*, or *prototypal inheritance*.\
    \ As you learned in Chapter 4, prototype properties are automatically available\
    \ on object instances, which is a form of inheritance. The object instances inherit\
    \ properties from the prototype.\n\nBecause the prototype is also an object, it\
    \ has its own prototype and inherits properties from that. This is the *prototype\
    \ chain*: An object inherits from its prototype, while that prototype in turn\
    \ inherits from its prototype, and so on.\n\nAll objects, including those you\
    \ define yourself, automatically inherit from Object unless you specify otherwise\
    \ (discussed later in this chapter). More specifically, all objects inherit from\
    \ Object.prototype. Any object defined via an object literal has its [[Prototype]]\
    \ set to Object.prototype, meaning that it inherits properties from Object.prototype,\
    \ like book in this example:\n\n```javascript\nvar book = {\n  title: \"The Principles\
    \ of Object-Oriented JavaScript\"\n};\nvar prototype = Object.getPrototypeOf(book);\n\
    console.log(prototype === Object.prototype); // true\n```\n\nHere, book has prototype\
    \ equal to Object.prototype. No additional code was necessary to make this happen,\
    \ as this is default behavior when new objects are created. This relationship\
    \ means that book automatically receives methods from Object.prototype.\n\n###\
    \ Methods Inherited from Object.prototype\n\nSeveral of the methods used in the\
    \ past couple of chapters are actually defined on Object.prototype and are therefore\
    \ inherited by objects. Those methods are:\n\n- **hasOwnProperty()** Determines\
    \ whether an own property with a given name exists\n- **propertyEnumerable()**\
    \ Determines whether an own property is enumerable\n- **isPrototypeOf()** Determines\
    \ whether the object is the prototype of another\n- **valueOf()** Returns the\
    \ value representation of the object\n- **toString()** Returns a string representation\
    \ of the object\n\nThese five methods appear on all objects through inheritance.\
    \ The last two are important when you need to make objects work consistently in\
    \ JavaScript, and sometimes you might want to define them yourself.\n\n**valueOf()**\n\
    \nThe valueOf() method gets called whenever an operator is used on an object.\
    \ By default, valueOf() simply returns the object instance. Primitive wrapper\
    \ types override valueOf() so that it returns a string for String, a Boolean for\
    \ Boolean, and a number for Number. Likewise, Date’s valueOf() method returns\
    \ the time in milliseconds (just as Date.prototype.getTime() does). This is what\
    \ allows you to write code that compares dates such as:\n\n```javascript\nvar\
    \ now = new Date();\nvar earlier = new Date(2010, 1, 1);\nconsole.log(now > earlier);\
    \ // true\n```\n\nIn this example, now is a Date representing the current time,\
    \ and earlier is a fixed date in the past. When the greater-than operator (>)\
    \ is used, the valueOf() method is called on both objects before comparison is\
    \ performed. You can even subtract one date from another and get the difference\
    \ in time because of valueOf(). You can always define your own valueOf() method\
    \ if your objects are intended to be used with operators. If you do define a valueOf()\
    \ method, keep in mind that you’re not changing how the operator works, only what\
    \ value is used with the operator’s default behavior.\n\n**toString()**\n\nThe\
    \ toString() method is called as a fallback whenever valueOf() returns a reference\
    \ value instead of a primitive value. It is also implicitly called on primitive\
    \ values whenever JavaScript is expecting a string. For example, when a string\
    \ is used as one operand for the plus operator, the other operand is automatically\
    \ converted to a string. If the other operand is a primitive value, it is converted\
    \ into a string representation (for example, true becomes \"true\"), but if it\
    \ is a reference value, then valueOf() is called. If valueOf() returns a reference\
    \ value, toString() is called and the returned value is used. For example:\n\n\
    ```javascript\nvar book = {\n  title: \"The Principles of Object-Oriented JavaScript\"\
    \n};\nvar message = \"Book = \" + book;\nconsole.log(message); // \"Book = [object\
    \ Object]\"\n```\n\nThis code constructs the string by combining \"Book = \" with\
    \ book. Since book is an object, its toString() method is called. That method\
    \ is inherited from Object.prototype and returns the default value of \"[object\
    \ Object]\" in most JavaScript engines. If you are happy with that value, there’s\
    \ no need to change your object’s toString() method. Sometimes, however, it’s\
    \ useful to define your own toString() method so that string conversions return\
    \ a value that gives more information. Suppose, for example, that you want the\
    \ script to log the book’s title:\n\n```javascript\nvar book = {\n  title: \"\
    The Principles of Object-Oriented JavaScript\",\n  toString: function() {\n  \
    \  return \"[Book \" + this.title + \"]\";\n  }\n};\nvar message = \"Book = \"\
    \ + book;\n// \"Book = [Book The Principles of Object-Oriented JavaScript]\"\n\
    console.log(message);\n```\n\nThis code defines a custom toString() method for\
    \ book that returns a more useful value than the inherited version. You don’t\
    \ usually need to worry about defining a custom toString() method, but it’s good\
    \ to know that it’s possible to do so if necessary.\n\n**Modifying Object.prototype**\n\
    \nAll objects inherit from Object.prototype by default, so changes to Object.prototype\
    \ affect all objects. That’s a very dangerous situation. You were advised in Chapter\
    \ 4 not to modify built-in object prototypes, and that advice goes double for\
    \ Object.prototype. Take a look at what can happen:\n\n```javascript\nObject.prototype.add\
    \ = function(value) {\n  return this + value;\n};\n\nvar book = {\n  title: \"\
    The Principles of Object-Oriented JavaScript\"\n};\n\nconsole.log(book.add(5));\
    \ // \"[object Object]5\"\n\nconsole.log(\"title\".add(\"end\")); // \"titleend\"\
    \n\n// in a web browser\nconsole.log(document.add(true)); // \"[object HTMLDocument]true\"\
    \nconsole.log(window.add(5)); // \"[object Window]true\"\n```\n"
  mdcn: "\n构造函数与原型 **63**\n\n**注意** 虽然通过修改内置对象来实验功能可能很有趣且有趣，但在生产环境中这样做并不是一个好主意。开发者期望内置对象以特定的方式运行并具有某些方法。故意更改内置对象会违反这些预期，并让其他开发者不确定这些对象应该是如何工作的。\n\
    \n**总结**\n\n构造函数只是通过 `new` 算符调用的普通函数。每当你想要创建多个具有相同属性的对象时，你都可以随时定义自己的构造函数。你可以使用\
    \ `instanceof` 或直接访问它们的 `constructor` 属性来识别由构造函数创建的对象。\n\n每个函数都有一个 `prototype`\
    \ 属性，它定义了由特定构造函数创建的对象共享的所有属性。共享方法和原始值属性通常定义在原型上，而所有其他属性都定义在构造函数内部。`constructor`\
    \ 属性实际上定义在原型上，因为它在对象实例之间是共享的。\n\n对象的原型存储在内部的 [[Prototype]] 属性中。该属性是一个引用，而不是拷贝。如果你在任何时间点更改了原型，这些更改将作用于所有实例，这是因为\
    \ JavaScript 查找属性的方式。当你尝试访问对象上的属性时，系统会在该对象中搜索具有你指定的名称的自有属性。如果未找到自有属性，则搜索原型。这种搜索机制意味着原型可以持续变化，而引用该原型的对象实例将立即反映这些更改。\n\
    \n内置对象也有可以修改的原型。虽然不建议在生产环境中这样做，但它对于新功能的实验和概念证明很有帮助。\n\n**5**\n\n## 继承\n\n学习如何创建对象是理解面向对象编程的第一步。第二步是理解继承。在传统的面向对象语言中，类从其他类继承属性。\n\
    \n但在 JavaScript 中，继承可以发生在对象之间，而无需类类结构来定义这种关系。这种继承的机制是你已经熟悉的：原型。\n\n### 原型链与 Object.prototype\n\
    \nJavaScript 内置的继承方法称为*原型链*或*原型型继承*。正如你在第 4 章中学到的，`prototype` 属性在对象实例上自动可用，这是继承的一种形式。对象实例从原型继承属性。\n\
    \n由于原型本身也是一个对象，它有自己的原型并从该原型继承属性。这就是*原型链*：一个对象从它的原型继承，而该原型反过来又从它的原型继承，依此类推。\n\n\
    所有对象（包括你自己定义的对象）除非另有指定，否则都会从 `Object` 继承（在本章后面会讨论）。具体来说，所有对象都从 `Object.prototype`\
    \ 继承。通过对象字面量定义的任何对象的 [[Prototype]] 都被设置为 `Object.prototype`，这意味着它们从 `Object.prototype`\
    \ 继承属性，就像示例中的 `book` 对象：\n\n```javascript\nvar book = {\n  title: \"The Principles\
    \ of Object-Oriented JavaScript\"\n};\nvar prototype = Object.getPrototypeOf(book);\n\
    console.log(prototype === Object.prototype); // true\n```\n\n在这里，`book` 的原型等于\
    \ `Object.prototype`。不需要额外的代码来实现这一点，因为这是创建新对象时的默认行为。这种关系意味着 `book` 自动接收来自 `Object.prototype`\
    \ 的方法。\n\n### 从 Object.prototype 继承的方法\n\n在过去几个章节中使用的几个方法实际上定义在 `Object.prototype`\
    \ 上，因此被对象继承。这些方法是：\n\n- **hasOwnProperty()** 确定是否存在具有给定名称的自有属性\n- **propertyEnumerable()**\
    \ 确定自有属性是否可枚举\n- **isPrototypeOf()** 确定该对象是否是另一个对象的原型\n- **valueOf()** 返回对象的数值表示\n\
    - **toString()** 返回对象的字符串表示\n\n这五个方法通过继承出现在所有对象上。当你需要让对象在 JavaScript 中一致工作时，最后两个方法非常重要，有时你可能想自己定义它们。\n\
    \n**valueOf()**\n\n当在对象上使用算符时，就会调用 `valueOf()` 方法。默认情况下，`valueOf()` 仅返回对象实例。原始包装类型覆盖了\
    \ `valueOf()`，以便为 `String` 返回字符串，为 `Boolean` 返回布尔，为 `Number` 返回数字。同样，`Date` 的\
    \ `valueOf()` 方法返回毫秒数（就像 `Date.prototype.getTime()` 一样）。这使得你能够编写比较日期的代码，例如：\n\n\
    ```javascript\nvar now = new Date();\nvar earlier = new Date(2010, 1, 1);\nconsole.log(now\
    \ > earlier); // true\n```\n\n在示例中，`now` 是代表当前时间的 `Date` 对象，而 `earlier` 是过去的一个固定日期。当使用大于算符\
    \ (>) 时，在执行比较之前，会在两个对象上调用 `valueOf()` 方法。由于 `valueOf()`，你甚至可以从一个日期减去另一个日期并得到时间差。如果你的对象打算用于算符，你始终可以定义自己的\
    \ `valueOf()` 方法。如果你定义了 `valueOf()` 方法，请记住你并没有改变算符的工作方式，只是改变了与算符默认行为一起使用的值。\n\n\
    **toString()**\n\n每当 `valueOf()` 返回引用值而不是原始值时，就会作为备备调用 `toString()` 方法。每当 JavaScript\
    \ 期望字符串时，它也会在原始值上被隐式调用。例如，当字符串用作 `+` 算符的一个操作数时，另一个操作数会被自动转换为字符串。如果另一个操作数是原始值，它会被转换为字符串表示（例如，`true`\
    \ 变成 `\"true\"`），但如果它是引用值，则会调用 `valueOf()`。如果 `valueOf()` 返回引用值，则会调用 `toString()`\
    \ 并使用返回的值。例如：\n\n```javascript\nvar book = {\n  title: \"The Principles of Object-Oriented\
    \ JavaScript\"\n};\nvar message = \"Book = \" + book;\nconsole.log(message); //\
    \ \"Book = [object Object]\"\n```\n\n这段代码通过组合 `\"Book = \"` 和 `book` 来构造字符串。由于\
    \ `book` 是一个对象，会调用它的 `toString()` 方法。该方法继承自 `Object.prototype`，在大多数 JavaScript\
    \ 引擎中返回默认值\"[object Object]。如果你对该值满意，就不需要更改对象的 `toString()` 方法。然而，定义自己的 `toString()`\
    \ 方法是有用的，以便字符串转换返回更多信息。例如，假设你想让脚本记录书籍标题：\n\n```javascript\nvar book = {\n  title:\
    \ \"The Principles of Object-Oriented JavaScript\",\n  toString: function() {\n\
    \    return \"[Book \" + this.title + \"]\";\n  }\n};\nvar message = \"Book =\
    \ \" + book;\n// \"Book = [Book The Principles of Object-Oriented JavaScript]\"\
    \nconsole.log(message);\n```\n\n这段代码为 `book` 定义了自定义的 `toString()` 方法，返回比继承版本更有价值。你通常不需要担心自定义\
    \ `toString()` 方法，但在需要时知道可以这样做是好的。\n\n**修改 Object.prototype**\n\n所有对象默认都从 `Object.prototype`\
    \ 继承，因此对 `Object.prototype` 的更改会影响所有对象。这是一个非常危险的情况。你在第 4 章中被建议不要修改内置对象的原型，而这个建议对于\
    \ `Object.prototype` 来说要加倍。看看会发生什么：\n\n```javascript\nObject.prototype.add = function(value)\
    \ {\n  return this + value;\n};\n\nvar book = {\n  title: \"The Principles of\
    \ Object-Oriented JavaScript\"\n};\n\nconsole.log(book.add(5)); // \"[object Object]5\"\
