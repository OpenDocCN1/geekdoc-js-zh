    \ instanceof Array); // true\n\nconsole.log(object instanceof Object); // true\n\
    \nconsole.log(reflect instanceof Function); // true"
  - "[PAGE 33]\n\nPrimitive and Reference Types   **13**\n\nIn this example, several\
    \ values are tested using instanceof and a con-\n\nstructor. Each reference type\
    \ is correctly identified by using instanceof \n\nand the constructor that represents\
    \ its true type (even though the con-\n\nstructor wasn’t used in creating the\
    \ variable).\n\nThe instanceof operator can identify inherited types. That means\
