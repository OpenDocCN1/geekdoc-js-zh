- md: "\n## Chapter 3\n\n```javascript\n// accessor property\nname: {\n  get: function()\
    \ {\n    console.log(\"Reading name\");\n    return this._name;\n  },\n  set:\
    \ function(value) {\n    console.log(\"Setting name to %s\", value);\n    this._name\
    \ = value;\n  },\n  enumerable: true,\n  configurable: true\n}\n```\n\nThis example\
    \ defines `_name` as a data property to contain information and name as an accessor\
    \ property. You can define any number of properties using Object.defineProperties();\
    \ you can even change existing properties and create new ones at the same time.\
    \ The effect is the same as calling Object.defineProperty() multiple times.\n\n\
    ### Retrieving Property Attributes\n\nIf you need to fetch property attributes,\
    \ you can do so in JavaScript by using Object.getOwnPropertyDescriptor(). As the\
    \ name suggests, this method works only on own properties. This method accepts\
    \ two arguments: the object to work on and the property name to retrieve. If the\
    \ property exists, you should receive a descriptor object with four properties:\
    \ configurable, enumerable, and the two others appropriate for the type of property.\
    \ Even if you didn’t specifically set an attribute, you will still receive an\
    \ object containing the appropriate value for that attribute. For example, this\
    \ code creates a property and checks its attributes:\n\n```javascript\nvar person1\
    \ = {\n  name: \"Nicholas\"\n};\nvar descriptor = Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\nconsole.log(descriptor.enumerable); // true\nconsole.log(descriptor.configurable);\
    \ // true\nconsole.log(descriptor.writable); // true\nconsole.log(descriptor.value);\
    \ // \"Nicholas\"\n```\n\nHere, a property called name is defined as part of an\
    \ object literal. The call to Object.getOwnPropertyDescriptor() returns an object\
    \ with enumerable, configurable, writable, and value, even though these weren’t\
    \ explicitly defined via Object.defineProperty().\n\n### Preventing Object Modification\n\
    \nObjects, just like properties, have internal attributes that govern their behavior.\
    \ One of these attributes is [[Extensible]], which is a Boolean value indicating\
    \ if the object itself can be modified. All objects you create are *extensible*\
    \ by default, meaning new properties can be added to the object at any time. You’ve\
    \ seen this several times in this chapter. By setting [[Extensible]] to false,\
    \ you can prevent new properties from being added to an object. There are three\
    \ different ways to accomplish this.\n\n### Preventing Extensions\n\nOne way to\
    \ create a nonextensible object is with Object.preventExtensions(). This method\
    \ accepts a single argument, which is the object you want to make nonextensible.\
    \ Once you use this method on an object, you’ll never be able to add any new properties\
    \ to it again. You can check the value of [[Extensible]] by using Object.isExtensible().\
    \ The following code shows examples of both methods at work.\n\n```javascript\n\
    var person1 = {\n  name: \"Nicholas\"\n};\nconsole.log(Object.isExtensible(person1));\
    \ // true\nObject.preventExtensions(person1);\nconsole.log(Object.isExtensible(person1));\
    \ // false\nperson1.sayName = function() {\n  console.log(this.name);\n};\nconsole.log(\"\
    sayName\" in person1); // false\n```\n\nAfter creating person1, this example checks\
    \ the object’s [[Extensible]] attribute before making it unchangeable. Now that\
    \ person1 is nonextensible, the sayName() method is never added to it.\n\n**NOTE**\
    \ Attempting to add a property to a nonextensible object will throw an error in\
    \ strict mode. In nonstrict mode, the operation fails silently. You should always\
    \ use strict mode with nonextensible objects so that you are aware when a nonextensible\
    \ object is being used incorrectly.\n\n### Sealing Objects\n\nThe second way to\
    \ create a nonextensible object is to *seal* the object. A sealed object is nonextensible,\
    \ and all of its properties are nonconfigurable. That means not only can you not\
    \ add new properties to the object, but you also can’t remove properties or change\
    \ their type (from data to accessor or vice versa). If an object is sealed, you\
    \ can only read from and write to its properties.\n\nYou can use the Object.seal()\
    \ method on an object to seal it. When that happens, the [[Extensible]] attribute\
    \ is set to false, and all properties have their [[Configurable]] attribute set\
    \ to false. You can check to see whether an object is sealed using Object.isSealed()\
    \ as follows:\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\nconsole.log(Object.isExtensible(person1));\
    \ // true\nconsole.log(Object.isSealed(person1)); // false\nObject.seal(person1);\n\
    console.log(Object.isExtensible(person1)); // false\nconsole.log(Object.isSealed(person1));\
    \ // true\nperson1.sayName = function() {\n  console.log(this.name);\n};\nconsole.log(\"\
    sayName\" in person1); // false\nperson1.name = \"Greg\";\nconsole.log(person1.name);\
    \ // \"Greg\"\ndelete person1.name;\nconsole.log(\"name\" in person1); // true\n\
    console.log(person1.name); // \"Greg\"\nvar descriptor = Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\nconsole.log(descriptor.configurable); // false\n```\n\nThis code\
    \ seals person1 so you can’t add or remove properties. Since all sealed objects\
    \ are nonextensible, Object.isExtensible() returns false when used on person1,\
    \ and the attempt to add a method called sayName() fails silently. Also, though\
    \ person1.name is successfully changed to a new value, the attempt to delete it\
    \ fails.\n\nIf you’re familiar with Java or C++, sealed objects should also be\
    \ familiar. When you create a new object instance based on a class in one of those\
    \ languages, you can’t add any new properties to that object. However, if a property\
    \ contains an object, you can modify that object. In effect, sealed objects are\
    \ JavaScript’s way of giving you the same measure of control without using classes.\n\
    \n**NOTE** Be sure to use strict mode with sealed objects so you’ll get an error\
    \ when someone tries to use the object.\n\n### Freezing Objects\n\nThe last way\
    \ to create a nonextensible object is to *freeze* it. If an object is frozen,\
    \ you can’t add or remove properties, you can’t change properties types, and you\
    \ can’t write to any data properties. In essence, a frozen object is a sealed\
    \ object where data properties are also read-only. Frozen objects can’t become\
    \ unfrozen, so they remain in the state they were when they became frozen. You\
    \ can freeze an object using Object.freeze() and determine if an object is frozen\
    \ using Object.isFrozen(). For example:\n\n```javascript\nvar person1 = {\n  name:\
    \ \"Nicholas\"\n};\nconsole.log(Object.isExtensible(person1)); // true\nconsole.log(Object.isSealed(person1));\
    \ // false\nconsole.log(Object.isFrozen(person1)); // false\nObject.freeze(person1);\n\
    console.log(Object.isExtensible(person1)); // false\nconsole.log(Object.isSealed(person1));\
    \ // true\nconsole.log(Object.isFrozen(person1)); // true\nperson1.sayName = function()\
    \ {\n  console.log(this.name);\n};\nconsole.log(\"sayName\" in person1); // false\n\
    person1.name = \"Greg\";\nconsole.log(person1.name); // \"Nicholas\"\ndelete person1.name;\n\
    console.log(\"name\" in person1); // true\nconsole.log(person1.name); // \"Nicholas\"\
    \nvar descriptor = Object.getOwnPropertyDescriptor(person1, \"name\");\nconsole.log(descriptor.configurable);\
    \ // false\nconsole.log(descriptor.writable); // false\n```\n\nIn this example,\
    \ person1 is frozen. Frozen objects are also considered nonextensible and sealed,\
    \ so Object.isExtensible() returns false and Object.isSealed() returns true. The\
    \ name property can’t be changed, so even though it is assigned to \"Greg\", the\
    \ operation fails.\n\n**NOTE** Frozen objects are simply snapshots of an object\
    \ at a particular point in time. They are of limited use and should be used rarely.\
    \ As with all nonextensible objects, you should use strict mode with frozen objects.\n"
  mdcn: "\n\n## 第3 章\n\n```javascript\n// accessor property\nname: {\n  get: function()\
    \ {\n    console.log(\"Reading name\");\n    return this._name;\n  },\n  set:\
    \ function(value) {\n    console.log(\"Setting name to %s\", value);\n    this._name\
    \ = value;\n  },\n  enumerable: true,\n  configurable: true\n}\n```\n\n此示例将 `_name`\
    \ 定义为包含信息的数据属性，并将 `name` 定义为访问属性（accessor property）。你可以使用 `Object.defineProperties()`\
    \ 定义任意数量的属性；甚至可以同时修改现有属性并创建新属性。其效果与多次调用 `Object.defineProperty()` 相同。\n\n### 获取属性描述\n\
    \n如果你需要获取属性描述，可以在 JavaScript 中使用 `Object.getOwnPropertyDescriptor()` 来实现。如名所示，该方法仅作用于自有属性（own\
    \ properties）。该方法接受两个参数：要操作的对象和要获取的属性名。如果属性存在，你将收到一个包含四个属性的描述符对象：`configurable`、`enumerable`\
    \ 以及另外两个适用于该属性类型的属性。即使你没有特意设置某个属性，你仍会收到一个包含该属性相应值的对象。例如，这段代码创建了一个属性并检查了它的属性：\n\
    \n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\nvar descriptor = Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\nconsole.log(descriptor.enumerable); // true\nconsole.log(descriptor.configurable);\
    \ // true\nconsole.log(descriptor.writable); // true\nconsole.log(descriptor.value);\
    \ // \"Nicholas\"\n```\n\n在这里，名为 `name` 的属性作为对象字面量的一部分定义的。调用 `Object.getOwnPropertyDescriptor()`\
    \ 返回了一个包含 `enumerable`、`configurable`、`writable` 和 `value` 的对象，尽管这些属性并没有通过 `Object.defineProperty()`\
    \ 显式定义。\n\n### 防止对象修改\n\n对象和属性一样，具有控制行为的内部属性。这些属性之一是 [[Extensible]]（可扩展），它是一个指示对象本身可以被修改的布尔值。你创建的所有对象默认都是*可扩展的*，这意味着可以随时向对象添加新属性。你在本章中已经见过几次了。通过将\
    \ [[Extensible]] 设置为 `false`，你可以防止向对象添加新属性。实现这一点的有三种不同的方法。\n\n### 防止扩展\n\n创建不可扩展对象的一种方法是使用\
    \ `Object.preventExtensions()`。该方法接受一个参数，即你想要变为不可扩展的对象。一旦你对某个对象使用了此方法，你就再也无法向其添加任何新属性。你可以使用\
    \ `Object.isExtensible()` 来检查 [[Extensible]] 的值。以下代码展示了两种方法的用法示例。\n\n```javascript\n\
    var person1 = {\n  name: \"Nicholas\"\n};\nconsole.log(Object.isExtensible(person1));\
    \ // true\nObject.preventExtensions(person1);\nconsole.log(Object.isExtensible(person1));\
    \ // false\nperson1.sayName = function() {\n  console.log(this.name);\n};\nconsole.log(\"\
    sayName\" in person1); // false\n```\n\n在创建 `person1` 后，此示例在将其变为不可更改之前检查了对象的 [[Extensible]]\
    \ 属性。现在 `person1` 是不可扩展的，`sayName()` 方法从未被添加到它上。\n\n**注意** 在严格模式下，尝试向不可扩展对象添加属性将抛出错误。在非严格模式下，操作将静默失败。你应该始终对不可扩展对象使用严格模式，以便在不可扩展对象被错误使用时能够察觉。\n\
    \n### 封存对象\n\n创建不可扩展对象的第二种方法是*密封*（seal）对象。被密封的对象是不可扩展的，且其所有属性都是不可配置的（nonconfigurable）。这意味着你不仅不能向对象添加新属性，不能删除属性或更改其类型（从数据属性变为访问属性或反之亦然）。如果一个对象被密封了，你只能对其属性进行读取和写入。\n\
    \n你可以使用 `Object.seal()` 方法对对象进行密封。当这种情况发生时，[[Extensible]] 属性被设置为 `false`，并且所有属性的\
    \ [[Configurable]] 属性都被设置为 `false`。你可以如下所示使用 `Object.isSealed()` 来检查对象是否被封存：\n\
    \n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\nconsole.log(Object.isExtensible(person1));\
    \ // true\nconsole.log(Object.isSealed(person1)); // false\nObject.seal(person1);\n\
    console.log(Object.isExtensible(person1)); // false\nconsole.log(Object.isSealed(person1));\
    \ // true\nperson1.sayName = function() {\n  console.log(this.name);\n};\nconsole.log(\"\
    sayName\" in person1); // false\nperson1.name = \"Greg\";\nconsole.log(person1.name);\
    \ // \"Greg\"\ndelete person1.name;\nconsole.log(\"name\" in person1); // true\n\
    console.log(person1.name); // \"Greg\"\nvar descriptor = Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\nconsole.log(descriptor.configurable); // false\n```\n\n这段代码密封了 `person1`，因此你无法添加或删除属性。由于所有密封的对象都是不可扩展的，当在\
    \ `person1` 上使用 `Object.isExtensible()` 时返回 `false`，且添加 `sayName()` 方法的尝试静默失败了。此外，尽管\
    \ `person1.name` 成功更改了新值，但删除它的尝试失败了。\n\n如果你熟悉 Java 或 C++，那么也应该熟悉密封对象。当你基于这些语言中的某个类创建新对象实例时，你不能向该对象添加任何新属性。然而，如果一个属性包含一个对象，你可以修改该对象。实际上，密封对象是\
    \ JavaScript 在不使用类的情况下为你提供同等控制力的方式。\n\n**注意** 务必对密封对象使用严格模式，这样当有人尝试使用该对象时，你会得到一个错误。\n\
    \n### 冻结对象\n\n创建不可扩展对象的最后方法是将其*冻结*（freeze）。如果一个对象被冻结了，你就不能添加或删除属性，不能更改属性类型，并且不能向任何数据属性写入。本质上，冻结的对象是一个密封对象，其数据属性也是只读的。冻结的对象无法被解冻，因此它们保持在变为冻结时的状态。你可以使用\
    \ `Object.freeze()` 冻结对象，并使用 `Object.isFrozen()` 判断一个对象是否被冻结。例如：\n\n```javascript\n\
    var person1 = {\n  name: \"Nicholas\"\n};\nconsole.log(Object.isExtensible(person1));\
    \ // true\nconsole.log(Object.isSealed(person1)); // false\nconsole.log(Object.isFrozen(person1));\
    \ // false\nObject.freeze(person1);\nconsole.log(Object.isExtensible(person1));\
    \ // false\nconsole.log(Object.isSealed(person1)); // true\nconsole.log(Object.isFrozen(person1));\
    \ // true\nperson1.sayName = function() {\n  console.log(this.name);\n};\nconsole.log(\"\
    sayName\" in person1); // false\nperson1.name = \"Greg\";\nconsole.log(person1.name);\
    \ // \"Nicholas\"\ndelete person1.name;\nconsole.log(\"name\" in person1); //\
    \ true\nconsole.log(person1.name); // \"Nicholas\"\nvar descriptor = Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\nconsole.log(descriptor.configurable); // false\nconsole.log(descriptor.writable);\
    \ // false\n```\n\n在此示例中，`person1` 被冻结了。冻结的对象也被认为是不可扩展和密封的，因此 `Object.isExtensible()`\
    \ 返回 `false`，`Object.isSealed()` 返回 `true`。属性属性无法更改，因此即使赋值为 \"Greg\"，操作也失败了。\n\
    \n**注意** 冻结对象仅仅是对象在特定时间点的快照。它们的用途有限，应该极少使用。与所有不可扩展对象一样，你应该对冻结对象使用严格模式。\n\n"
