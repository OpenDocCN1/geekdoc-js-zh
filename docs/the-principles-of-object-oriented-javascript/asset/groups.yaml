    \ function() {\n    console.log(this.name);\n    this.fire({ type: \"namesaid\"\
    , name: name });\n  }\n});\n\nvar person = new Person(\"Nicholas\");\nconsole.log(person\
    \ instanceof Person); // true\nconsole.log(person instanceof EventTarget); //\
