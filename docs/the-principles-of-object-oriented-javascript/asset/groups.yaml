    \ the in operator checks to see \n\nif the given key exists in the hash table.\
    \ For example, here’s what happens \n\nwhen in is used to check for some properties\
    \ in the person1 object:\n\nconsole.log(\"name\" in person1); // true\n\nconsole.log(\"\
    age\" in person1); // true\n\nconsole.log(\"title\" in person1); // false\n\n\
    Keep in mind that methods are just properties that reference func-\n\ntions, so\
    \ you can check for the existence of a method in the same way. \n\nThe following\
    \ adds a new function, sayName(), to person1 and uses in to \n\nconfirm the function’s\
    \ presence.\n\nvar person1 \\= {\n\n name: \"Nicholas\",\n\n sayName: function()\
    \ {\n\n console.log(this.name);\n\n }\n\n};\n\nconsole.log(\"sayName\" in person1);\
    \ // true\n\nIn most cases, the in operator is the best way to determine whether\
    \ \n\nthe property exists in an object. It has the added benefit of not evaluat-\n\
    \ning the value of the property, which can be important if such an evalua-\n\n\
