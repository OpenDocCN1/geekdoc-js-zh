- md: "\nConstructors and Prototypes **53**\n\nvariable called name, which is where\
    \ the name passed to Person is stored.\n\nChapter 6 describes a solution to both\
    \ this problem and more complex object composition patterns.\n\n**NOTE** An error\
    \ occurs if you call the **Person** constructor in strict mode without using **new**.\
    \ *This is because strict mode doesn’t assign **this** to the global object. Instead,\
    \ **this** remains **undefined**, and an error occurs whenever you attempt to\
    \ create a property on **undefined**.*\n\nConstructors allow you to configure\
    \ object instances with the same properties, but constructors alone don’t eliminate\
    \ code redundancy. In the example code thus far, each instance has had its own\
    \ sayName() method even though sayName() doesn’t change. That means if you have\
    \ 100 instances of an object, then there are 100 copies of a function that do\
    \ the exact same thing, just with different data.\n\nIt would be much more efficient\
    \ if all of the instances shared one method, and then that method could use this.name\
    \ to retrieve the appropriate data. This is where prototypes come in.\n\n### Prototypes\n\
    \nYou can think of a *prototype* as a recipe for an object. Almost every function\
    \ (with the exception of some built-in functions) has a prototype property that\
    \ is used during the creation of new instances. That prototype is shared among\
    \ all of the object instances, and those instances can access properties of the\
    \ prototype. For example, the hasOwnProperty() method is defined on the generic\
    \ Object prototype, but it can be accessed from any object as if it were an own\
    \ property, as shown in this example:\n\n```javascript\nvar book = {\n  title:\
    \ \"The Principles of Object-Oriented JavaScript\"\n};\n\nconsole.log(\"title\"\
    \ in book); // true\nconsole.log(book.hasOwnProperty(\"title\")); // true\nconsole.log(\"\
    hasOwnProperty\" in book); // true\nconsole.log(book.hasOwnProperty(\"hasOwnProperty\"\
    )); // false\nconsole.log(Object.prototype.hasOwnProperty(\"hasOwnProperty\"));\
    \ // true\n```\n\nEven though there is no definition for hasOwnProperty() on book,\
    \ that method can still be accessed as book.hasOwnProperty() because the definition\
    \ does exist on Object.prototype. Remember that the in operator returns true for\
    \ both prototype properties *and* own properties.\n\n**54** Chapter 4\n\n### The\
    \ [[Prototype]] Property\n\nAn instance keeps track of its prototype through an\
    \ internal property called [[Prototype]]. This property is a pointer back to the\
    \ prototype object that the instance is using. When you create a new object using\
    \ new, the constructor’s prototype property is assigned to the [[Prototype]] property\
    \ of that new object. Figure 4-1 shows how the [[Prototype]] property lets multiple\
    \ instances of an object type refer to the same prototype, which can reduce code\
    \ duplication.\n\n| Person.prototype | sayName (function) |\n| :--- | :--- |\n\
    | person1 [[Prototype]] | name: \"Nicholas\" |\n| person2 [[Prototype]] | name:\
    \ \"Greg\" |\n\n*Figure 4-1: The **[[Prototype]]** properties for **person1**\
    \ and **person2** point to the same prototype.*\n\n### Identifying a prototype\
    \ property\n\nYou can determine whether a property is on the prototype by using\
    \ a function such as:\n\n```javascript\nfunction hasPrototypeProperty(object,\
    \ name) {\n  return name in object && !object.hasOwnProperty(name);\n}\n\nconsole.log(hasPrototypeProperty(book,\
    \ \"title\")); // false\nconsole.log(hasPrototypeProperty(book, \"hasOwnProperty\"\
    )); // true\n```\n\nIf the property is in an object but hasOwnProperty() returns\
    \ false, then the property is on the prototype.\n\n**55** Constructors and Prototypes\n\
    \nYou can read the value of the [[Prototype]] property by using the Object.getPrototypeOf()\
    \ method on an object. For example, the following code checks the [[Prototype]]\
    \ of a generic, empty object:\n\n```javascript\nvar object = {};\nvar prototype\
    \ = Object.getPrototypeOf(object);\nconsole.log(prototype === Object.prototype);\
    \ // true\n```\n\nFor any generic object like this, [[Prototype]] is always a\
    \ reference to Object.prototype.\n\n**NOTE** Some JavaScript engines also support\
    \ a property called __proto__ on all objects. *This property allows you to both\
    \ read from and write to the [[Prototype]] property. Firefox, Chrome, and Node.js\
    \ all support this, and __proto__ is the path for standardization in ECMAScript\
    \ 6.*\n\nYou can also test to see if one object is a prototype for another using\
    \ the isPrototypeOf() method, which is included on all objects:\n\n```javascript\n\
    var object = {};\nconsole.log(Object.prototype.isPrototypeOf(object)); // true\n\
    ```\n\nBecause object is just a generic object, its prototype should be Object.prototype,\
    \ meaning isPrototypeOf() should return true. When a property is read on an object,\
    \ the JavaScript engine first looks for an own property with that name. If the\
    \ engine finds a correctly named property, it returns that value. If no own property\
    \ exists on the target object, JavaScript searches the prototype instead. If a\
    \ prototype property with that name exists, the value is returned. If the search\
    \ concludes without finding a property with the correct name, undefined is returned.\n\
    \nConsider the following, in which an object is first created without any own\
    \ properties:\n\n```javascript\nvar object = {};\nconsole.log(object.toString());\
    \ // \"[object Object]\"\nobject.toString = function() {\n  return \"[object Custom]\"\
    ;\n};\nconsole.log(object.toString()); // \"[object Custom]\"\n```\n\n**56** Chapter\
    \ 4\n\n```javascript\n// delete property\ndelete object.toString;\nconsole.log(object.toString());\
    \ // \"[object Object]\"\n// no effect - delete only works on own properties\n\
    ```\n\nIn this example, the toString() method comes from the prototype and returns\
    \ \"[object Object]\" by default. If you then define an own property called toString(),\
    \ that own property is used whenever toString() is called on the object again.\
    \ The own property *shadows* the prototype property, so the prototype property\
    \ of the same name is no longer used. The prototype property is used again if\
    \ the own property is deleted from the object. (Keep in mind that you can’t delete\
    \ a prototype property from an instance because the delete operator acts only\
    \ on properties.)\n\nFigure 4-2 shows what is happening in this example. This\
    \ example also highlights an important concept: You cannot assign a value to a\
    \ prototype property from an instance. As you see in the middle section of Figure\
    \ 4-2, assigning a value to toString creates a new own property on the instance,\
    \ leaving the property on the prototype untouched.\n\n| Object.prototype.toString\
    \ (function) | object [[Prototype]] |\n| Object.prototype.toString (function)\
    \ | object [[Prototype]] |\n| Object.prototype.toString (function) | object [[Prototype]]\
    \ |\n\n```javascript\nvar object = {};\nobject.toString = function() {\n  return\
    \ \"[object Custom]\";\n};\ndelete object.toString;\n```\n\n*Figure 4-2: An object\
    \ with no own properties (top) has only the methods of its prototype. Adding a\
    \ **toString()** property to the object (middle) replaces the prototype property\
    \ until you delete it (bottom).*\n\n**57** Constructors and Prototypes\n\n###\
    \ Using Prototypes with Constructors\n\nThe shared nature of prototypes makes\
    \ them ideal for defining methods once for all objects of a given type. Because\
    \ methods tend to do the same thing for all instances, there’s no reason each\
    \ instance needs its own set of methods.\n\nIt’s much more efficient to put the\
    \ methods on the prototype and then use this to access the current instance. For\
    \ example, consider the following Person constructor:\n\n```javascript\nfunction\
    \ Person(name) {\n  this.name = name;\n}\nPerson.prototype.sayName = function()\
    \ {\n  console.log(this.name);\n};\n\nvar person1 = new Person(\"Nicholas\");\n\
    var person2 = new Person(\"Greg\");\nconsole.log(person1.name); // \"Nicholas\"\
    \nconsole.log(person2.name); // \"Greg\"\nperson1.sayName(); // outputs \"Nicholas\"\
    \nperson2.sayName(); // outputs \"Greg\"\n```\n\nIn this version of the Person\
    \ constructor, sayName() is defined on the prototype instead of in the constructor.\
    \ The object instances work exactly the same as the example from earlier in this\
    \ chapter, even though sayName() is now a prototype property instead of an own\
    \ property. Because person1 and person2 are each base references for their calls\
    \ to sayName(), the this value is assigned to person1 and person2, respectively.\n\
    \nYou can also store other types of data on the prototype, but be careful when\
    \ using reference values. Because these values are shared across instances, you\
    \ might not expect one instance to be able to change values that another instance\
    \ will access. This example shows what can happen when you don’t watch where your\
    \ reference values are pointing:\n\n```javascript\nfunction Person(name) {\n \
    \ this.name = name;\n}\nPerson.prototype.sayName = function() {\n  console.log(this.name);\n\
    };\n```\n"
  mdcn: "\n构造函数与原型 **53**\n\n一个名为 name 的变量，用于存储传递给 Person 的名称。\n\n第 6 章描述了解决此问题以及更复杂的对象组合模式的解决方案。\n\
    \n**注意**：在严格模式下，如果不使用 **new** 就调用 **Person** 构造函数，将会发生错误。*这是因为严格模式不会将 **this**\
    \ 赋值给全局对象。相反，**this** 将保持为 **undefined**，当你尝试在 **undefined** 上创建属性时，就会发生错误。*\n\
    \n构造函数允许你配置具有相同属性的对象实例，但仅靠构造函数并消除代码冗余。在目前为止的代码中，每个实例都有自己的 `sayName()` 方法，尽管 `sayName()`\
    \ 并没有改变。这意味着如果你有 100 个对象实例，就有 100 份执行完全相同函数的拷贝，只是数据不同。\n\n如果所有实例都共享一个方法，然后该方法可以使用\
    \ `this.name` 来获取适当的数据，将会高效得多。这正是原型大显身场。\n\n### 原型\n\n你可以将*原型*想象成对象的配方。几乎每个函数（某些内置函数除外）都有一个原型属性，该属性在创建新实例时被使用。该原型被所有对象实例共享，这些实例可以访问原型的属性。例如，`hasOwnProperty()`\
    \ 方法定义在通用的 Object 原型上，但可以从任何对象中访问它，就像它是自身的属性一样，如下例所示：\n\n```javascript\nvar book\
    \ = {\n  title: \"The Principles of Object-Oriented JavaScript\"\n};\n\nconsole.log(\"\
    title\" in book); // true\nconsole.log(book.hasOwnProperty(\"title\")); // true\n\
    console.log(\"hasOwnProperty\" in book); // true\nconsole.log(book.hasOwnProperty(\"\
    hasOwnProperty\")); // false\nconsole.log(Object.prototype.hasOwnProperty(\"hasOwnProperty\"\
    )); // true\n```\n\n尽管 `book` 上没有定义 `hasOwnProperty()`，但仍然可以通过 `book.hasOwnProperty()`\
    \ 访问该方法，因为该定义存在于 `Object.prototype` 上。记住，`in` 运算符对于原型属性*和*自身属性都会返回 true。\n\n**54**\
    \ 第 4 章\n\n### [[Prototype]] 属性\n\n实例通过一个名为 [[Prototype]] 的内部属性来跟踪其原型。该属性指向该实例正在使用的原型对象。当你使用\
    \ `new` 创建新对象时，构造函数的原型属性会被赋值给该新对象的 [[Prototype]] 属性。图 4-1 显示了 [[Prototype]] 属性如何让同一对象类型的多个实例引用同一个原型，从而减少代码重复。\n\
    \n| Person.prototype | sayName (function) |\n| :--- | :--- |\n| person1 [[Prototype]]\
    \ | name: \"Nicholas\" |\n| person2 [[Prototype]] | name: \"Greg\" |\n\n*图 4-1：**person1**\
    \ 和 **person2** 的 **[[Prototype]]** 属性指向同一个原型。*\n\n### 识别原型属性\n\n你可以使用如下函数来确定属性是否在原型上：\n\
    \n```javascript\nfunction hasPrototypeProperty(object, name) {\n  return name\
    \ in object && !object.hasOwnProperty(name);\n}\n\nconsole.log(hasPrototypeProperty(book,\
    \ \"title\")); // false\nconsole.log(hasPrototypeProperty(book, \"hasOwnProperty\"\
    )); // true\n```\n\n如果属性存在对象中但 `hasOwnProperty()` 返回 false，那么该属性就在原型上。\n\n**55**\
    \ 构造函数与原型\n\n你可以通过对对象使用 `Object.getPrototypeOf()` 方法来读取 [[Prototype]] 属性的值。例如，以下代码检查了一个通用空对象的原型：\n\
    \n```javascript\nvar object = {};\nvar prototype = Object.getPrototypeOf(object);\n\
    console.log(prototype === Object.prototype); // true\n```\n\n对于任何此类通用对象，[[Prototype]]\
    \ 始终是指向 `Object.prototype` 的引用。\n\n**注意**：某些 JavaScript 引擎还支持在所有对象上一个名为 `__proto__`\
    \ 的属性。*该属性允许你同时读取和写入 [[Prototype]] 属性。Firefox、Chrome 和 Node.js 都支持此，且 `__proto__`\
    \ 是 ECMAScript 6 标准化的路径。*\n\n你还可以使用所有对象都包含的 `isPrototypeOf()` 方法测试一个对象是否是另一个对象的原型：\n\
    \n```javascript\nvar object = {};\nconsole.log(Object.prototype.isPrototypeOf(object));\
    \ // true\n```\n\n由于 `object` 只是一个通用对象，它的原型应该是 `Object.prototype`，这意味着 `isPrototypeOf()`\
    \ 应该返回 true。当在对象上读取属性时，JavaScript 引擎首先查找具有该名称的自身属性。如果引擎找到了命名正确的属性，它将返回该值。如果目标对象上不存在自身属性，JavaScript\
    \ 将改为搜索原型。如果原型上存在该名称的原型属性，则返回该值。如果搜索结束未找到具有正确名称的属性，则返回 undefined。\n\n考虑以下情况，其中对象在没有任何自身属性的情况下被创建：\n\
    \n```javascript\nvar object = {};\nconsole.log(object.toString()); // \"[object\
    \ Object]\"\nobject.toString = function() {\n  return \"[object Custom]\";\n};\n\
    console.log(object.toString()); // \"[object Custom]\"\n```\n\n**56** 第 4 章\n\n\
    ```javascript\n// 删除属性\ndelete object.toString;\nconsole.log(object.toString());\
    \ // \"[object Object]\"\n// 无影响 - delete 仅作用于自身属性\n```\n\n在这个示例中，`toString()`\
    \ 方法来自原型并默认返回 `\"[object Object]\"`。如果你接着定义了一个名为 `toString()` 的自身属性，那么每当再次在对象上调用\
    \ `toString()` 时，都会使用该自身属性。该自身属性*遮蔽*了原型属性，因此同名的原型属性将不再被使用。如果从对象上删除了自身属性，原型属性将再次被使用。（请记住，你不能从实例中删除原型属性，因为\
    \ `delete` 运算符只作用于属性。）\n\n图 4-2 显示了此示例中发生的情况。该示例还强调了一个重要的概念：你不能从实例向原型属性赋值。正如你在图\
    \ 4-2 的中间部分看到的，为 `toString` 赋值会在实例上创建一个新的自身属性，而让原型上的属性保持不变。\n\n| Object.prototype.toString\
    \ (function) | object [[Prototype]] |\n| Object.prototype.toString (function)\
    \ | object [[Prototype]] |\n| Object.prototype.toString (function) | object [[Prototype]]\
    \ |\n\n```javascript\nvar object = {};\nobject.toString = function() {\n  return\
    \ \"[object Custom]\";\n};\ndelete object.toString;\n```\n\n*图 4-2：一个没有自身属性的对象（顶部）仅拥有其原型的所有方法。在对象上添加\
    \ **toString()** 属性（中间）会替换原型属性，直到你删除它（底部）。*\n\n**57** 构造函数与原型\n\n### 在构造函数构造原型\n\
    \n原型的共享特性使其非常适合为给定类型的所有对象定义一次方法。因为方法往往对所有实例执行相同的操作，所以没有理由每个实例都需要自己的一组方法。\n\n将方法放在原型上并然后使用\
    \ `this` 来访问当前实例要高效高效得多。例如，考虑以下 Person 构造函数：\n\n```javascript\nfunction Person(name)\
    \ {\n  this.name = name;\n}\nPerson.prototype.sayName = function() {\n  console.log(this.name);\n\
    };\n\nvar person1 = new Person(\"Nicholas\");\nvar person2 = new Person(\"Greg\"\
    );\nconsole.log(person1.name); // \"Nicholas\"\nconsole.log(person2.name); //\
    \ \"Greg\"\nperson1.sayName(); // 输出 \"Nicholas\"\nperson2.sayName(); // 输出 \"\
    Greg\"\n```\n\n在这个版本的 Person 构造函数中，`sayName()` 定义在原型上而不是构造函数中。对象实例的工作方式与本章早期的示例完全相同，尽管\
    \ `sayName()` 现在是原型属性而不是自身属性。由于 `person1` 和 `person2` 分别是调用 `sayName()` 的基础引用，`this`\
    \ 值分别被赋值给 `person1` 和 `person2`。\n\n你还可以在原型上存储其他类型的数据，但在使用引用值时要小心。因为这些值在实例间共享，你可能意料不到一个实例能够更改另一个实例将访问的值。这个示例展示了当你不关注引用值指向何时会发生什么：\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\nPerson.prototype.sayName\
    \ = function() {\n  console.log(this.name);\n};\n```\n\n"
