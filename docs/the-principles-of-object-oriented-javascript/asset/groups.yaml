  - "[PAGE 32]\n\n**12**   Chapter 1\n\nThis syntax is very useful when you want to\
    \ dynamically decide which \n\nproperty to access. For example, here bracket notation\
    \ allows you to use a \n\nvariable instead of the string literal to specify the\
    \ property to access.\n\nvar array \\= \\[\\];\n\nvar method \\= \"push\";\n\n\
    array\\[method\\](12345);\n\nIn this listing, the variable method has a value\
