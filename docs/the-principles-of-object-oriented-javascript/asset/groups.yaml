- md: "\nInheritance **69**\n\nAdding Object.prototype.add() causes all objects to\
    \ have an add() method, whether or not it actually makes sense. This problem has\
    \ been an issue not just for developers but also for the committee that works\
    \ on the JavaScript language: It has had to put new methods in different locations\
    \ because adding methods to Object.prototype can have unforeseen consequences.\n\
    \nAnother aspect of this problem involves adding enumerable properties to Object.prototype.\
    \ In the previous example, Object.prototype.add() is an enumerable property, which\
    \ means it will show up when you use a for-in loop, such as:\n\n```javascript\n\
    var empty = {};\n\nfor (var property in empty) {\n  console.log(property);\n}\n\
    ```\n\nHere, an empty object will still output \"add\" as a property because it\
    \ exists on the prototype and is enumerable. Given how often the for-in construct\
    \ is used in JavaScript, modifying Object.prototype with enumerable properties\
    \ has the potential to affect a lot of code. For this reason, Douglas Crockford\
    \ recommends using hasOwnProperty() in for-in loops all the time, (*) such as:\n\
    \n```javascript\nvar empty = {};\n\nfor (var property in empty) {\n  if (empty.hasOwnProperty(property))\
    \ {\n    console.log(property);\n  }\n}\n```\n\nWhile this approach is effective\
    \ against possible unwanted prototype properties, it also limits the use of for-in\
    \ to only own properties, which may or may not be what you want. Your best bet\
    \ for the most flexibility is to not modify Object.prototype.\n\n## Object Inheritance\n\
    \nThe simplest type of inheritance is between objects. All you have to do is specify\
    \ what object should be the new object’s [[Prototype]]. Object literals have Object.prototype\
    \ set as their [[Prototype]] implicitly, but you can also explicitly specify [[Prototype]]\
    \ with the Object.create() method.\n\n* See Douglas Crockford’s “Code Conventions\
    \ for the JavaScript Programming Language” (*http://javascript.crockford.com/code.html*).\n\
    \nChapter 5\n\n70\n\nThe Object.create() method accepts two arguments. The first\
    \ argument is the object to use for [[Prototype]] in the new object. The optional\
    \ second argument is an object of property descriptors in the same format used\
    \ by Object.defineProperties() (see Chapter 3). Consider the following:\n\n```javascript\n\
    var book = {\n  title: \"The Principles of Object-Oriented JavaScript\"\n};\n\n\
    // is the same as\nvar book = Object.create(Object.prototype, {\n  title: {\n\
    \    configurable: true,\n    enumerable: true,\n    value: \"The Principles of\
    \ Object-Oriented JavaScript\",\n    writable: true\n  }\n});\n```\n\nThe two\
    \ declarations in this code are effectively the same. The first declaration uses\
    \ an object literal to define an object with a single property called title. That\
    \ object automatically inherits from Object.prototype, and the property is set\
    \ to be configurable, enumerable, and writable by default. The second declaration\
    \ takes the same steps but does so explicitly using Object.create(). The resulting\
    \ book object from each declaration behaves the exact same way. But you’ll probably\
    \ never write code that inherits from Object.prototype directly, because you get\
    \ that by default. Inheriting from other objects is much more interesting:\n\n\
    ```javascript\nvar person1 = {\n  name: \"Nicholas\",\n  sayName: function() {\n\
    \    console.log(this.name);\n  }\n};\n\nvar person2 = Object.create(person1,\
    \ {\n  name: {\n    configurable: true,\n    enumerable: true,\n    value: \"\
    Greg\",\n    writable: true\n  }\n});\n\nperson1.sayName(); // outputs \"Nicholas\"\
    \nperson2.sayName(); // outputs \"Greg\"\n```\n\nInheritance **71**\n\nconsole.log(person1.hasOwnProperty(\"\
    sayName\")); // true\nconsole.log(person1.isPrototypeOf(person2)); // true\nconsole.log(person2.hasOwnProperty(\"\
    sayName\")); // false\n\nThis code creates an object, person1, with a name property\
    \ and a sayName() method. The person2 object inherits from person1, so it inherits\
    \ both name and sayName(). However, person2 is defined via Object.create(), which\
    \ also defines an own name property for person2. This own property shadows the\
    \ prototype property of the same name and is used in its place. So, person1.sayName()\
    \ outputs \"Nicholas\", while person2.sayName() outputs \"Greg\". Keep in mind\
    \ that sayName() still exists only on person1 and is being inherited by person2.\n\
    \nThe inheritance chain in this example is longer for person2 than it is for person1.\
    \ The person2 object inherits from the person1 object, and the person1 object\
    \ inherits from Object.prototype. See Figure 5-1.\n\n| Object.prototype | [[Prototype]]\
    \ | person2 |\n| :--- | :--- | :--- |\n| | [[Prototype]] | \"Greg\" |\n| person1\
    \ | [[Prototype]] | |\n| name \"Nicholas\" | | |\n| sayName (function) | | |\n\
    | propertyisEnumerable (function) | | |\n| hasOwnProperty (function) | | |\n|\
    \ isPrototypeOf (function) | | |\n| toString (function) | | |\n| valueOf (function)\
    \ | | |\n\n*Figure 5-1: The prototype chain for **person2** includes **person1**\
    \ and **Object.prototype**.*\n\nWhen a property is accessed on an object, the\
    \ JavaScript engine goes through a search process. If the property is found on\
    \ the instance (that is, if it’s an own property), that property value is used.\
    \ If the property is not found on the instance, the search continues on [[Prototype]].\
    \ If the property is still not found, the search continues to that object’s [[Prototype]],\
    \ and so on until the end of the chain is reached. That chain usually ends with\
    \ Object.prototype, whose [[Prototype]] is set to null.\n\nChapter 5\n\n72\n\n\
    You can also create objects with a null [[Prototype]] via Object.create(), such\
    \ as:\n\n```javascript\nvar nakedObject = Object.create(null);\nconsole.log(\"\
    toString\" in nakedObject); // false\nconsole.log(\"valueOf\" in nakedObject);\
    \ // false\n```\n\nThe nakedObject in this example is an object with no prototype\
    \ chain. That means built-in methods such as toString() and valueOf() aren’t present\
    \ on the object. In effect, this object is a completely blank slate with no predefined\
    \ properties, which makes it perfect for creating lookup hash without potential\
    \ collisions with inherited names. There aren’t many other uses for an object\
    \ like this, and you can’t use it as if it were inheriting from Object.prototype.\n\
    \n## Constructor Inheritance\n\nObject inheritance in JavaScript is also the basis\
    \ of inheritance. Recall from Chapter 4 that almost every function has a prototype\
    \ property that can be modified or replaced. That prototype property is automatically\
    \ assigned to be a generic object that inherits from Object.prototype and has\
    \ a single constructor property. In effect, the JavaScript engine does the following\
    \ for you when you write this:\n\n```javascript\nfunction YourConstructor() {\n\
    }\n\nYourConstructor.prototype = Object.create(Object.prototype, {\n  constructor:\
    \ {\n    configurable: true,\n    enumerable: true,\n    value: YourConstructor,\n\
    \    writable: true\n  }\n});\n```\n\nSo without doing anything extra, this code\
    \ sets YourConstructor’s prototype property to an object that inherits from Object,\
    \ which means any instances of YourConstructor also inherit from Object. YourConstructor\
    \ is a *subtype* of Object, and Object is a *supertype* of YourConstructor.\n\n\
    Inheritance **73**\n\nBecause the prototype property is writable, you can change\
    \ the chain by overwriting it. Consider the following example:\n\n```javascript\n\
    function Rectangle(length, width) {\n  this.length = length;\n  this.width = width;\n\
    }\n\nRectangle.prototype.getArea = function() {\n  return this.length * this.width;\n\
    };\n\nRectangle.prototype.toString = function() {\n  return \"Rectangle \" + this.length\
    \ + \"x\" + this.width;\n};\n\nfunction Square(size) {\n  this.size = size;\n\
    }\n\nSquare.prototype = Rectangle();\n\nvar rect = new Rectangle(5, 10);\nvar\
    \ square = new Square(6);\n\nconsole.log(rect.getArea()); // 50\nconsole.log(square.getArea());\
    \ // 36\nconsole.log(rect.toString()); // \"Rectangle 5x10\"\nconsole.log(square.toString());\
    \ // \"Square 6x6\"\n\nconsole.log(rect instanceof Rectangle); // true\nconsole.log(rect\
    \ instanceof Object); // true\nconsole.log(square instanceof Square); // true\n\
    console.log(square instanceof Rectangle); // true\nconsole.log(square instanceof\
    \ Object); // true\n"
  mdcn: "\n继承 **69**\n\n添加 `Object.prototype.add()` 会导致所有对象都拥有 `add()` 方法，无论这在逻辑上是否有意义。这个问题不仅是开发者面临的难题，也是\
    \ JavaScript 语言委员会需要解决的问题：他们不得不将新方法放在不同的位置，因为在 `Object.prototype` 上添加方法可能会产生不可预见的后果。\n\
    \n该问题的另一个方面涉及在向 `Object.prototype` 上添加可枚举属性。在之前的的例子中，`Object.prototype.add()`\
    \ 是一个可枚举属性，这意味着当你使用 `for-in` 循环时它会显示出来，例如：\n\n```javascript\nvar empty = {};\n\
    \nfor (var property in empty) {\n  console.log(property);\n}\n```\n\n在这里，一个空对象仍然会输出\
    \ \"add\" 作为属性，因为它存在于原型上并且是可枚举的。鉴于 JavaScript 中 `for-in` 结构的使用频率很高，使用可枚举属性修改 `Object.prototype`\
    \ 可能会影响大量代码。出于这个原因，Douglas Crockford 建议在 `for-in` 循环中始终使用 `hasOwnProperty()`，(*)，例如：\n\
    \n```javascript\nvar empty = {};\n\nfor (var property in empty) {\n  if (empty.hasOwnProperty(property))\
    \ {\n    console.log(property);\n  }\n}\n```\n\n虽然这种方法可以防止可能不需要的原型属性，但它也限制了 `for-in`\
    \ 仅用于自身的属性，这可能是你想要的，也可能不是。为了获得最大的灵活性，最好的办法是不修改 `Object.prototype`。\n\n## 对象继承\n\
    \n最简单的继承类型是对象之间的继承。你所做的只需指定哪个对象应该是新对象的 [[Prototype]]。对象字面量隐式地将 `Object.prototype`\
    \ 设置为它们的 [[Prototype]]，但你也可以通过 `Object.create()` 方法显式地指定 [[Prototype]]。\n\n* 查看\
    \ Douglas Crockford 的《JavaScript 编程语言代码规范》（*http://javascript.crockford.com/code.html*）。\n\
    \n第5 章\n\n70\n\n`Object.create()` 方法接受两个参数。第一个参数是用于新对象 [[Prototype]] 的对象。可选的第二个参数是一个属性描述符对象，其格式与\
    \ `Object.defineProperties()` 使用的格式相同（见第 3 章）。考虑以下内容：\n\n```javascript\nvar book\
    \ = {\n  title: \"The Principles of Object-Oriented JavaScript\"\n};\n\n// 等同于\n\
    var book = Object.create(Object.prototype, {\n  title: {\n    configurable: true,\n\
    \    enumerable: true,\n    value: \"The Principles of Object-Oriented JavaScript\"\
    ,\n    writable: true\n  }\n});\n```\n\n这段代码中的两个声明实际上是等价。第一个声明使用对象字面量定义了一个具有名为\
    \ `title` 单个属性的对象。该对象自动继承自 `Object.prototype`，并且该属性被设置为可配置、可枚举和可写。第二个声明采取了相同的步骤，但它是使用\
    \ `Object.create()` 显式完成的。每个声明生成的 `book` 对象行为完全相同。但你可能永远不会编写直接继承自 `Object.prototype`\
    \ 的代码，因为这是默认拥有的。继承自其他对象要有趣得多：\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\"\
    ,\n  sayName: function() {\n    console.log(this.name);\n  }\n};\n\nvar person2\
    \ = Object.create(person1, {\n  name: {\n    configurable: true,\n    enumerable:\
    \ true,\n    value: \"Greg\",\n    writable: true\n  }\n});\n\nperson1.sayName();\
    \ // 输出 \"Nicholas\"\nperson2.sayName(); // 输出 \"Greg\"\n```\n\n继承 **71**\n\n\
    ```javascript\nconsole.log(person1.hasOwnProperty(\"sayName\")); // true\nconsole.log(person1.isPrototypeOf(person2));\
    \ // true\nconsole.log(person2.hasOwnProperty(\"sayName\")); // false\n```\n\n\
    这段代码创建了一个对象 `person1`，包含一个 `name` 属性和一个 `sayName()` 方法。`person2` 对象继承自 `person1`，因此它继承了\
    \ `name` 和 `sayName()`。然而，`person2` 是通过 `Object.create()` 定义的，这也为 `person2` 定义了自身的\
    \ `name` 属性。这个属性遮蔽了同名的原型属性并被其取代。因此，`person1.sayName()` 输出 \"Nicholas\"，而 `person2.sayName()`\
    \ 输出 \"Greg\"。请记住 `sayName()` 仍然存在于 `person1` 上，并被 `person2` 继承。\n\n在这个例子中，`person2`\
    \ 的继承链比 `person1` 更长。`person2` 对象继承自 `person1` 对象，而 `person1` 对象继承自 `Object.prototype`。见图\
    \ 5-1。\n\n| Object.prototype | [[Prototype]] | person2 |\n| :--- | :--- | :---\
    \ |\n| | [[Prototype]] | \"Greg\" |\n| person1 | [[Prototype]] | |\n| name \"\
    Nicholas\" | | |\n| sayName (function) | | |\n| propertyisEnumerable (function)\
    \ | | |\n| hasOwnProperty (function) | | |\n| isPrototypeOf (function) | | |\n\
    | toString (function) | | |\n| valueOf (function) | | |\n\n*图 5-1：**person2**\
    \ 的原型链包含了 **person1** 和 **Object.prototype**。*\n\n当访问对象上的某个属性时，JavaScript 引擎会经历一个搜索过程。如果在实例上找到了该属性（即它是一个自身的属性），则使用该属性值。如果未在实例上找到属性，搜索将在\
    \ [[Prototype]] 上继续。如果仍然未找到属性，搜索将继续到该对象的 [[Prototype]]，依此类推，直到到达链的末端。该链通常以 `Object.prototype`\
    \ 结束，其 [[Prototype]] 设置设置为 null。\n\n第5 章\n\n72\n\n你也可以通过 `Object.create()` 创建原型为\
    \ `null` 的对象，例如：\n\n```javascript\nvar nakedObject = Object.create(null);\nconsole.log(\"\
    toString\" in nakedObject); // false\nconsole.log(\"valueOf\" in nakedObject);\
    \ // false\n```\n\n此示例中的 `nakedObject` 是一个没有原型链的对象。这意味着像 `toString()` 和 `valueOf()`\
    \ 等内置方法在该对象上不存在。实际上，这个对象是一个完全空白的面板，没有任何预定义的属性，使其非常适合创建不会与继承名称产生潜在冲突的查找哈希。这种对象没有许多其他用途，你不能像继承自\
    \ `Object.prototype` 那样使用它。\n\n## 构造函数继承\n\nJavaScript 中的对象继承也是继承的基础。回想第 4 章，几乎每个函数都有一个可以修改或替换的\
    \ `prototype` 属性。该 `prototype` 属性被自动赋值为一个继承自 `Object.prototype` 的通用对象，并具有单个 `constructor`\
    \ 属性。实际上，当你编写以下代码时，JavaScript 引擎为你执行以下操作：\n\n```javascript\nfunction YourConstructor()\
    \ {\n}\n\nYourConstructor.prototype = Object.create(Object.prototype, {\n  constructor:\
    \ {\n    configurable: true,\n    enumerable: true,\n    value: YourConstructor,\n\
    \    writable: true\n  }\n});\n```\n\n因此，在不进行额外操作的情况下，这段代码将 `YourConstructor`\
    \ 的 `prototype` 属性设置为继承自 `Object` 的对象，这意味着 `YourConstructor` 的任何实例也继承自 `Object`。`YourConstructor`\
    \ 是 `Object` 的*子类型*，而 `Object` 是 `YourConstructor` 的*超类型*。\n\n继承 **73**\n\n由于\
    \ `prototype` 属性是可写的，你可以通过覆盖它来改变链。考虑以下示例：\n\n```javascript\nfunction Rectangle(length,\
    \ width) {\n  this.length = length;\n  this.width = width;\n}\n\nRectangle.prototype.getArea\
    \ = function() {\n  return this.length * this.width;\n};\n\nRectangle.prototype.toString\
    \ = function() {\n  return \"Rectangle \" + this.length + \"x\" + this.width;\n\
    };\n\nfunction Square(size) {\n  this.size = size;\n}\n\nSquare.prototype = Rectangle();\n\
    \nvar rect = new Rectangle(5, 10);\nvar square = new Square(6);\n\nconsole.log(rect.getArea());\
    \ // 50\nconsole.log(square.getArea()); // 36\nconsole.log(rect.toString()); //\
