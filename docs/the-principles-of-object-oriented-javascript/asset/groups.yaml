  - "[PAGE 56]\n\n**36**   Chapter 3\n\n**Enumeration**\n\nBy default, all properties\
    \ that you add to an object are *enumerable*, which \n\nmeans that you can iterate\
    \ over them using a for-in loop. Enumerable \n\nproperties have their internal\
    \ \\[\\[Enumerable\\]\\] attributes set to true. The \n\nfor-in loop enumerates\
    \ all enumerable properties on an object, assigning \n\nthe property name to a\
    \ variable. For example, the following loop out-\n\nputs the property names and\
    \ values of an object:\n\nvar property;\n\nfor (property in object) {\n\n console.log(\"\
    Name: \" + property);\n\n console.log(\"Value: \" + object\\[property\\]);\n\n\
    }\n\nEach time through the for-in loop, the property variable is filled with \n\
    \nthe next enumerable property on the object until all such properties have \n\
    \nbeen used. At that point, the loop is finished and code execution contin-\n\n\
    ues. This example uses bracket notation to retrieve the value of the object \n\
    \nproperty and output it to the console, which is one of the primary use \n\n\
    cases for bracket notation in JavaScript.\n\nIf you just need a list of an object’s\
    \ properties to use later in your pro-\n\ngram, ECMAScript 5 introduced the Object.keys()\
    \ method to retrieve an \n\narray of enumerable property names, as shown here:\n\
    \nu var properties \\= Object.keys(object);\n\n// if you want to mimic for-in\
    \ behavior\n\nvar i, len;\n\nfor (i\\=0, len=properties.length; i < len; i++){\n\
    \n console.log(\"Name: \" + properties\\[i\\]);\n\n console.log(\"Value: \" +\
    \ object\\[properties\\[i\\]\\]);\n\n}\n\nThis example uses Object.keys() to retrieve\
    \ the enumerable properties \n\nfrom an object u. A for loop is then used to iterate\
    \ over the properties \n\nand output the name and value. Typically, you would\
    \ use Object.keys() in \n\nsituations where you want to operate on an array of\
    \ property names and \n\nfor-in when you don’t need an array.\n\n**N O T E***\
    \ There is a difference between the enumerable properties returned in a ­**for-in**\
    \ loop *\n\n*and the ones returned by **Object.keys()**. The **for-in** loop also\
    \ enumerates prototype *\n\n*properties, while **Object.keys()** returns only\
