  - "[PAGE 44]\n\n**24**   Chapter 2\n\nThe fact that functions don’t have signatures\
    \ in JavaScript doesn’t \n\nmean you can’t mimic function overloading. You can\
    \ retrieve the number \n\nof parameters that were passed in by using the arguments\
    \ object, and you \n\ncan use that information to determine what to do. For example:\n\
    \nfunction sayMessage(message) {\n\n if (arguments.length \\=== 0) {\n\n message\
    \ \\= \"Default message\";\n\n }\n\n console.log(message);\n\n}\n\nsayMessage(\"\
    Hello!\"); // outputs \"Hello!\"\n\nIn this example, the sayMessage() function\
    \ behaves differently based \n\non the number of parameters that were passed in.\
    \ If no parameters \n\nare passed in (arguments.length === 0), then a default\
    \ message is used. \n\nOtherwise, the first parameter is used as the message.\
    \ This is a little more \n\ninvolved than function overloading in other languages,\
    \ but the end result \n\nis the same. If you really want to check for different\
    \ data types, you can \n\nuse typeof and instanceof.\n\n**N O T E*** In practice,\
    \ checking the named parameter against **undefined** is more ­common than *\n\n\
    *relying on **arguments.length**.*\n\n**Object Methods**\n\nAs mentioned in Chapter\
    \ 1, you can add and remove ­properties from \n\nobjects at any time. When a property\
    \ value is actually a function, the \n\nproperty is considered a method. You can\
    \ add a method to an object in \n\nthe same way that you would add a property.\
    \ For example, in the follow-\n\ning code, the person variable is assigned an\
    \ object literal with a name prop-\n\nerty and a method called sayName.\n\nvar\
    \ person \\= {\n\n name: \"Nicholas\",\n\n sayName: function() {\n\n console.log(person.name);\n\
    \n }\n\n};\n\nperson.sayName(); // outputs \"Nicholas\"\n\nNote that the syntax\
    \ for a data property and a method is exactly \n\nthe same—an identifier followed\
    \ by a colon and the value. In the case \n\nof sayName, the value just happens\
    \ to be a function. You can then call \n\nthe method directly from the object\
    \ as in person.sayName(\"Nicholas\")."
  - "[PAGE 45]\n\nFunctions   **25**\n\n***The this Object***\n\nYou may have noticed\
    \ something strange in the previous ­example. The \n\n­sayName() method references\
    \ person.name directly, which creates tight cou-\n\npling between the method and\
    \ the object. This is problematic for a num-\n\nber of reasons. First, if you\
    \ change the variable name, you also need to \n\nremember to change the reference\
    \ to that name in the method. Second, \n\nthis sort of tight coupling makes it\
    \ difficult to use the same function for \n\ndifferent objects. Fortunately, JavaScript\
    \ has a way around this issue.\n\nEvery scope in JavaScript has a this object\
    \ that represents the call-\n\ning object for the function. In the global scope,\
    \ this represents the \n\nglobal object (window in web browsers). When a function\
    \ is called while \n\nattached to an object, the value of this is equal to that\
    \ object by default. \n\nSo, instead of directly referencing an object inside\
    \ a method, you can ref-\n\nerence this instead. For example, you can rewrite\
    \ the code from the pre-\n\nvious example to use this:\n\nvar person \\= {\n\n\
    \ name: \"Nicholas\",\n\n sayName: function() {\n\n console.log(this.name);\n\n\
    \ }\n\n};\n\nperson.sayName(); // outputs \"Nicholas\"\n\nThis code works the\
    \ same as the earlier version, but this time, sayName() \n\nreferences this instead\
    \ of person. That means you can easily change the \n\nname of the variable or\
    \ even reuse the function on different objects.\n\nfunction sayNameForAll() {\n\
    \n console.log(this.name);\n\n}\n\nvar person1 \\= {\n\n name: \"Nicholas\",\n\
    \n sayName: sayNameForAll\n\n};\n\nvar person2 \\= {\n\n name: \"Greg\",\n\n sayName:\
    \ sayNameForAll\n\n};\n\nvar name \\= \"Michael\";\n\nperson1.sayName(); // outputs\
    \ \"Nicholas\"\n\nperson2.sayName(); // outputs \"Greg\"\n\nsayNameForAll(); //\
    \ outputs \"Michael\""
  - "[PAGE 46]\n\n**26**   Chapter 2\n\nIn this example, a function called sayName\
    \ is defined first. Then, \n\ntwo object literals are created that assign sayName\
    \ to be equal to the \n\n­sayNameForAll function. Functions are just reference\
    \ values, so you can \n\nassign them as property values on any number of objects.\
    \ When sayName() \n\nis called on person1, it outputs \"Nicholas\"; when called\
    \ on person2, it out-\n\nputs \"Greg\". That’s because this is set when the function\
    \ is called, so \n\nthis.name is accurate. \n\nThe last part of this example defines\
    \ a global variable called name. \n\nWhen sayNameForAll() is called directly,\
    \ it outputs \"Michael\" because the \n\nglobal variable is considered a property\
    \ of the global object.\n\n***Changing this***\n\nThe ability to use and manipulate\
    \ the this value of functions is key to \n\ngood object-oriented programming in\
    \ JavaScript. Func­tions can be used \n\nin many different contexts, and they\
    \ need to be able to work in each situa-\n\ntion. Even though this is typically\
    \ assigned automatically, you can change \n\nits value to achieve different goals.\
    \ There are three function methods that \n\nallow you to change the value of this.\
    \ (Remember that functions are \n\nobjects, and objects can have methods, so functions\
    \ can, too.)\n\n**The call() Method**\n\nThe first function method for manipulating\
    \ this is call(), which executes \n\nthe function with a particular this value\
    \ and with specific parameters. \n\nThe first parameter of call() is the value\
    \ to which this should be equal \n\nwhen the function is executed. All subsequent\
    \ parameters are the param-\n\neters that should be passed into the function.\
    \ For example, suppose you \n\nupdate sayNameForAll() to take a parameter:\n\n\
    function sayNameForAll(label) {\n\n console.log(label + \":\" + this.name);\n\n\
    }\n\nvar person1 \\= {\n\n name: \"Nicholas\"\n\n};\n\nvar person2 \\= {\n\n name:\
    \ \"Greg\"\n\n};\n\nvar name \\= \"Michael\";\n\nsayNameForAll.call(this, \"global\"\
    ); // outputs \"global:Michael\"\n\nsayNameForAll.call(person1, \"person1\");\
    \ // outputs \"person1:Nicholas\"\n\nsayNameForAll.call(person2, \"person2\");\
    \ // outputs \"person2:Greg\""
  - "[PAGE 47]\n\nFunctions   **27**\n\nIn this example, sayNameForAll() accepts one\
    \ parameter that is used \n\nas a label to the output value. The function is then\
    \ called three times. \n\nNotice that there are no parentheses after the function\
    \ name because it \n\nis accessed as an object rather than as code to execute.\
    \ The first function \n\ncall uses the global this and passes in the parameter\
    \ \"global\" to output \n\n\"global:Michael\". The same function is called two\
    \ more times, once each \n\nfor person1 and ­person2. Because the call() method\
    \ is being used, you \n\ndon’t need to add the function directly onto each object—you\
    \ explicitly \n\nspecify the value of this instead of letting the JavaScript engine\
    \ do it \n\nautomatically.\n\n**The apply() Method**\n\nThe second function method\
    \ you can use to manipulate this is apply(). The \n\napply() method works exactly\
    \ the same as call() except that it accepts only \n\ntwo parameters: the value\
    \ for this and an array or array-like object of \n\nparameters to pass to the\
    \ function (that means you can use an arguments \n\nobject as the second parameter).\
    \ So, instead of individually naming each \n\nparameter using call(), you can\
    \ easily pass arrays to apply() as the second \n\nargument. Otherwise, call()\
    \ and apply() behave identically. This example \n\nshows the apply() method in\
    \ action:\n\nfunction sayNameForAll(label) {\n\n console.log(label + \":\" + this.name);\n\
    \n}\n\nvar person1 \\= {\n\n name: \"Nicholas\"\n\n};\n\nvar person2 \\= {\n\n\
    \ name: \"Greg\"\n\n};\n\nvar name \\= \"Michael\";\n\nsayNameForAll.apply(this,\
    \ \\[\"global\"\\]); // outputs \"global:Michael\"\n\nsayNameForAll.apply(person1,\
    \ \\[\"person1\"\\]); // outputs \"person1:Nicholas\"\n\nsayNameForAll.apply(person2,\
    \ \\[\"person2\"\\]); // outputs \"person2:Greg\"\n\nThis code takes the previous\
    \ example and replaces call() with \n\napply(); the result is exactly the same.\
    \ The method you use typically \n\ndepends on the type of data you have. If you\
    \ already have an array of \n\ndata, use apply(); if you just have individual\
    \ variables, use call()."
  - "[PAGE 48]\n\n**28**   Chapter 2\n\n**The bind() Method**\n\nThe third function\
    \ method for changing this is bind(). This method was \n\nadded in ECMAScript\
    \ 5, and it behaves quite differently than the other \n\ntwo. The first argument\
    \ to bind() is the this value for the new function. \n\nAll other arguments represent\
    \ named parameters that should be perma-\n\nnently set in the new function. You\
    \ can still pass in any parameters that \n\naren’t permanently set later. \n\n\
    The following code shows two examples that use bind(). You create \n\nthe sayNameForPerson1()\
    \ function by binding the this value to person1, while \n\nsayNameForPerson2()\
    \ binds this to person2 and binds the first parameter as \n\n\"person2\".\n\n\
    function sayNameForAll(label) {\n\n console.log(label + \":\" + this.name);\n\n\
    }\n\nvar person1 \\= {\n\n name: \"Nicholas\"\n\n};\n\nvar person2 \\= {\n\n name:\
    \ \"Greg\"\n\n};\n\n// create a function just for person1\n\nu var sayNameForPerson1\
    \ \\= sayNameForAll.bind(person1);\n\nsayNameForPerson1(\"person1\"); // outputs\
    \ \"person1:Nicholas\"\n\n// create a function just for person2\n\nv var sayNameForPerson2\
    \ \\= sayNameForAll.bind(person2, \"person2\");\n\nsayNameForPerson2(); // outputs\
    \ \"person2:Greg\"\n\n// attaching a method to an object doesn't change 'this'\n\
    \nw person2.sayName \\= sayNameForPerson1;\n\nperson2.sayName(\"person2\"); //\
    \ outputs \"person2:Nicholas\"\n\nNo parameters are bound for sayNameForPerson1()\
    \ u, so you still need \n\nto pass in the label for the output. The function sayNameForPerson2()\
    \ not \n\nonly binds this to person2 but also binds the first parameter as \"\
    person2\" v. \n\nThat means you can call ­sayNameForPerson2() without passing\
    \ in any addi-\n\ntional arguments. The last part of this example adds sayNameForPerson1()\
    \ \n\nonto person2 with the name sayName w. The function is bound, so the value\
    \ \n\nof this doesn’t change even though sayNameForPerson1 is now a function on\
    \ \n\nperson2. The method still outputs the value of person1.name."
- md: "\n## Functions 29\n\n**Summary**\n\nJavaScript functions are unique in that\
    \ they are also objects, meaning they can be accessed, copied, overwritten, and\
    \ generally treated just like any other object value. The biggest difference between\
    \ a JavaScript function and other objects is a special internal property, [[Call]],\
    \ which contains the execution instructions for the function. The typeof operator\
    \ looks for this internal property on an object, and if it finds it, returns \"\
    function\".\n\nThere are two function literal forms: declarations and expressions.\
    \ Function declarations contain the function name to the right of the function\
    \ keyword and are hoisted to the top of the context in which they are defined.\
    \ Function expressions are used where other values can also be used, such as assignment\
    \ expressions, function parameters, or the return value of another function.\n\
    \nBecause functions are objects, there is a Function constructor. You can create\
    \ new functions with the Function constructor, but this isn’t generally recommended\
    \ because it can make your code harder to understand and debugging much more difficult.\
    \ That said, you will likely run into its usage from time to time in situations\
    \ where the true form of the function isn’t known until runtime. \n\nYou need\
    \ a good grasp of functions to understand how object-oriented programming works\
    \ in JavaScript. Because JavaScript has no concept of a class, functions and other\
    \ objects are all you have to work with to achieve aggregation and inheritance.\n\
    \n## 3 Understanding Objects\n\nEven though there are a number of built-in reference\
    \ types in JavaScript, you will most likely create your own objects fairly frequently.\
    \ As you do so, keep in mind that objects in JavaScript are dynamic, meaning that\
    \ they can change at any point during code execution. Whereas class-based languages\
    \ lock down objects based on a class definition, JavaScript objects have no such\
    \ restrictions.\n\nA large part of JavaScript programming is managing those objects,\
    \ which is why understanding how objects work is key to understanding JavaScript\
    \ as a whole. This is discussed in more detail later in this chapter.\n\n### Defining\
    \ Properties\n\nRecall from Chapter 1 that there are two basic ways to create\
    \ your own objects: using the Object constructor and using an object literal.\
    \ For example:\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\n\n\
    var person2 = new Object();\nperson2.name = \"Nicholas\";\nperson1.age = \"Redacted\"\
    ;\nperson2.age = \"Redacted\";\nperson1.name = \"Greg\";\nperson2.name = \"Michael\"\
    ;\n```\n\nBoth person1 and person2 are objects with a name property. Later in\
    \ the example, both objects are assigned an age property. You could do this immediately\
    \ after the definition of the object or much later. Objects you create are always\
    \ wide open for modification unless you specify otherwise (more on that in “Preventing\
    \ Object Modification” on page 45). The last part of this example changes the\
    \ value of name on each object; property values can be changed at any time as\
    \ well.\n\nWhen a property is first added to an object, JavaScript uses an internal\
    \ method called [[Put]] on the object. The [[Put]] method creates a spot in the\
    \ object to store the property. You can compare this to adding a key to a hash\
    \ table for the first time. This operation specifies not just the initial value,\
    \ but also some attributes of the property. So, in the previous example, when\
    \ the name and age properties are first defined on each object, the [[Put]] method\
    \ is invoked for each.\n\nThe result of calling [[Put]] is the creation of an\
    \ *own property* on the object. An own property simply indicates that the specific\
    \ instance of the object owns that property. The property is stored directly on\
    \ the instance, and all operations on the property must be performed through that\
    \ object. \n\n**NOTE*** Own properties are distinct from *prototype properties*,\
    \ which are discussed in *Chapter 4.*\n\nWhen a new value is assigned to an existing\
    \ property, a separate operation called [[Set]] takes place. This operation replaces\
    \ the current value of the property with the new one. In the previous example,\
    \ setting name to a second value results in a call to [[Set]]. See Figure 3-1\
    \ for a step-by-step view of what happened to person1 behind the scenes as its\
    \ name and age properties were changed.\n\n| Object | Property | Value | Operation\
    \ |\n| :--- | :--- | :--- | :--- |\n| person1 | name | \"Nicholas\" | [[Put]]\
    \ |\n| person1 | age | \"Redacted\" | [[Put]] |\n| person1 | name | \"Greg\" |\
    \ [[Set]] |\n| person1 | age | \"Redacted\" | [[Put]] |\n\n*Figure 3-1: Adding\
    \ and changing properties of an object*\n\nIn the first part of the diagram, an\
    \ object literal is used to create the person1 object. This performs an implicit\
    \ [[Put]] for the name property. Assigning a value to person1.age performs a [[Put]]\
    \ for the age property. However, setting person1.name to a new value (\"Greg\"\
    ) performs a [[Set]] operation on the name property, overwriting the existing\
    \ property value.\n\n### Detecting Properties\n\nBecause properties can be added\
    \ at any time, it’s sometimes necessary to check whether a property exists in\
    \ the object. New JavaScript developers often incorrectly use patterns like the\
    \ following to detect whether a property exists:\n\n```javascript\n// unreliable\n\
    if (person1.age) {\n  // do something with age\n}\n```\n\nThe problem with this\
    \ pattern is how JavaScript’s type coercion affects the outcome. The if condition\
    \ evaluates to true if the value is *truthy* (an object, a nonempty string, a\
    \ nonzero number, or true) and evaluates to false if the value is *falsy* (null,\
    \ undefined, 0, false, NaN, or an empty string). Because an object property can\
    \ contain one of these falsy values, the example code can yield false negatives.\
    \ For instance, if person1.age is 0, then the if condition will not be met even\
    \ though the property exists. A more reliable way to test for the existence of\
    \ a property is with the in operator.\n\nThe in operator looks for a property\
    \ with a given name in a specific object and returns true if it finds it. In effect,\
    \ the in operator checks to see if the given key exists in the hash table. For\
    \ example, here’s what happens when in is used to check for some properties in\
    \ the person1 object:\n\n```javascript\nconsole.log(\"name\" in person1); // true\n\
    console.log(\"age\" in person1); // true\nconsole.log(\"title\" in person1); //\
    \ false\n```\n\nKeep in mind that methods are just properties that reference functions,\
    \ so you can check for the existence of a method in the same way. The following\
    \ adds a new function, sayName(), to person1 and uses in to confirm the function’s\
    \ presence.\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\",\n  sayName:\
    \ function() {\n    console.log(this.name);\n  }\n};\n\nconsole.log(\"sayName\"\
    \ in person1); // true\n```\n\nIn most cases, the in operator is the best way\
    \ to determine whether the property exists in an object. It has the added benefit\
    \ of not evaluating the value of the property, which can be important if such\
    \ an evaluation is likely to cause a performance issue or an error.\n\nIn some\
    \ cases, however, you might want to check for the existence of a property only\
    \ if it is an own property. The in operator checks for both own properties and\
    \ prototype properties, so you’ll need to take a different approach. Enter the\
    \ hasOwnProperty() method, which is present on all objects and returns true only\
    \ if the given property exists and is an own property. For example, the following\
    \ code compares the results of using in versus hasOwnProperty() on different properties\
    \ in person1:\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\",\n  sayName:\
    \ function() {\n    console.log(this.name);\n  }\n};\n\nconsole.log(\"name\" in\
    \ person1); // true\nconsole.log(person1.hasOwnProperty(\"name\")); // true\n\
    console.log(\"toString\" in person1); // true\nconsole.log(person1.hasOwnProperty(\"\
    toString\")); // false\n```\n"
  mdcn: "\n\n## 函数 29\n\n**总结**\n\nJavaScript 函数的独特之处在于它们同时也是对象，这意味着它们可以被访问、复制、覆盖，并且像任何其他对象值一样被处理。JavaScript\
    \ 函数与其他对象之间最大的区别在于一个特殊的内部属性 `[[Call]]`，它包含了函数的执行指令。`typeof` 运算符会在对象上查找此内部属性，如果找到，则返回\
    \ \"function\"。\n\n函数有两种字面量形式：声明和和表达式。函数声明在 `function` 关键字的右侧包含函数名，并会被提升到其定义所在上下文的顶部。函数表达式则用于可以使用其他值的地方，例如赋值表达式、函数参数或另一个函数的返回值。\n\
    \n由于由于函数是对象，因此存在一个 `Function` 构造函数。你可以使用 `Function` 构造函数创建新函数，但通常不建议这样做，因为这可能会让代码变得难以理解，并使调试变得困难得多。尽管如此，在某些运行时未知函数真实形式的情况下，你可能会经常遇到它的用法。\n\
    \n你需要熟练掌握函数，才能理解 JavaScript 中面向对象编程是如何运作的。由于 JavaScript 没有类（class）的概念，函数和其他对象就是你实现聚合和继承所拥有的全部。\n\
    \n## 3 理解对象\n\n尽管 JavaScript 中有很多内置引用类型，但你很可能会频繁地创建自己的对象。在创建时，请记住 JavaScript 中的对象是动态的，这意味着它们可以在代码执行的任何点发生变化。基于类的语言根据类定义锁定对象，而\
    \ JavaScript 对象没有这种限制。\n\nJavaScript 编程很大一部分是为了管理这些对象，这就是为什么理解对象的工作原理是理解整个 JavaScript\
    \ 的关键。这将在章后面的部分进行详细讨论。\n\n### 定义属性\n\n回顾第 1 章，创建自定义对象有两种基本方法：使用 `Object` 构造函数和使用对象字面量。例如：\n\
    \n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar person2 = new\
    \ Object();\nperson2.name = \"Nicholas\";\nperson1.age = \"Redacted\";\nperson2.age\
    \ = \"Redacted\";\nperson1.name = \"Greg\";\nperson2.name = \"Michael\";\n```\n\
    \n`person1` 和 `person2` 都是带有 `name` 属性的对象。在示例之后，两个对象都被分配了 `age` 属性。你可以在定义对象后立即这样做，也可以在很久之后这样做。除非另有指定，否则你创建的对象始终是开放修改的（更多信息请见第\
    \ 45 页的“防止对象修改”）。此示例的最后部分更改了每个对象 `name` 的值；属性值也可以随时更改。\n\n当属性首次添加到对象中时，JavaScript\
    \ 在该对象上使用一个名为 `[[Put]]` 的内部方法。`[[Put]]` 方法在对象中创建一个位置来存储该属性。你可以将其此比为第一次向哈希表中添加一个键。此操作不仅指定了初始值，还指定了属性的一些特性。因此，在先前的示例中，当每个对象上首次定义\
    \ `name` 和 `age` 属性时，每个属性都会调用 `[[Put]]` 方法。\n\n调用 `[[Put]]` 的结果是在对象上创建了一个*自有属性*（own\
    \ property）。自有属性仅表示该对象的特定实例拥有该属性。属性直接存储在实例上，对该属性的所有操作必须通过该对象执行。\n\n**注意*** 自有属性区别于*原型属性*（prototype\
    \ properties），后者将在*第 4 章*中讨论。\n\n当一个新值赋值给现有属性时，会发生称为 `[[Set]]` 的独立操作。该操作将属性的当前值替换为新值。在先前的示例中，将\
    \ `name` 设置为第二个值会导致调用 `[[Set]]`。参见图 3-1，查看 `person1` 的 `name` 和 `age` 属性更改时在后台发生的逐步过程。\n\
    \n| 对象 | 属性 | 值 | 操作 |\n| :--- | :--- | :--- | :--- |\n| person1 | name | \"Nicholas\"\
    \ | [[Put]] |\n| person1 | age | \"Redacted\" | [[Put]] |\n| person1 | name |\
    \ \"Greg\" | [[Set]] |\n| person1 | age | \"Redacted\" | [[Put]] |\n\n*图 3-1：添加和更改对象的属性*\n\
    \n在图的第一部分，使用对象字面量创建了 `person1` 对象。这为 `name` 属性执行了隐式的 `[[Put]]`。为 `person1.age`\
    \ 赋值对 `age` 属性执行了 `[[Put]]`。然而，将 `person1.name` 设置为新值（\"Greg\"）对 `name` 属性执行了\
    \ `[[Set]]` 操作，覆盖了现有的属性值。\n\n### 检测属性\n\n由于属性可以随时添加，因此有时需要检查对象中是否存在某个属性。新的 JavaScript\
    \ 开发者经常错误地使用如下的模式来检测属性是否存在：\n\n```javascript\n// 不不可靠\nif (person1.age) {\n  //\
    \ 对 age 进行某些操作\n}\n```\n\n这种模式的问题在于 JavaScript 的类型转换如何影响结果。如果值是*真值*（对象、非空字符串、非零数字或\
    \ true），则 `if` 条件为真；如果值是*假值*（null、undefined、0、NaN 或空字符串），则结果为假。由于对象属性可能包含这些假值，该示例代码可能会产生假阴性结果。例如，如果\
    \ `person1.age` 为 0，即使该属性存在，`if` 条件也不会满足。测试属性存在的更可靠方法是使用 `in` 运算符。\n\n`in` 运算符在特定对象中查找指定的属性，如果找到，则返回\
    \ true。实际上，`in` 运算符检查给定的键是否存在于哈希表中。例如，这里是使用 `in` 检查 `person1` 中某些属性的情况：\n\n```javascript\n\
    console.log(\"name\" in person1); // true\nconsole.log(\"age\" in person1); //\
    \ true\nconsole.log(\"title\" in person1); // false\n```\n\n记住方法只是引用函数的属性，因此你可以以相同的方式检查方法是否存在。以下代码向\
    \ `person1` 添加了一个新函数 `sayName()`，并使用 `in` 确认其存在。\n\n```javascript\nvar person1\
    \ = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \  }\n};\n\nconsole.log(\"sayName\" in person1); // true\n```\n\n在大多数情况下，`in`\
    \ 运算符是判断属性是否存在于对象的最佳方法。它的优点是不评估属性的值，如果这种评估可能导致性能问题或错误，这一点非常重要。\n\n然而，在某些情况下，你可能只想在属性是自有属性时才检查其是否存在。`in`\
    \ 运算符会检查自有属性和原型属性，因此你需要不同的方法。引入 `hasOwnProperty()` 方法，它存在于所有对象上，并且仅当给定属性存在且为自有属性时才返回\
    \ true。例如，以下代码对比了在 `person1` 不同属性上使用 `in` 与 `hasOwnProperty()` 的结果：\n\n```javascript\n\
    var person1 = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \  }\n};\n\nconsole.log(\"name\" in person1); // true\nconsole.log(person1.hasOwnProperty(\"\
    name\")); // true\nconsole.log(\"toString\" in person1); // true\nconsole.log(person1.hasOwnProperty(\"\
    toString\")); // false\n```\n\n"
