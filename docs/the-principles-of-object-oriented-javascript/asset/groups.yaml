    \ `delete` 运算符从对象中完全删除属性。\n\n`delete` 运算符作用于单个对象属性并调用一个名为 [[Delete]] 的内部操作。你可以将这种操作想象为从哈希表中删除一个键值对。当\
    \ `delete` 运算符执行成功时，它返回 `true`。（某些属性无法删除，这将在章节稍后部分详细讨论。）例如，下面的列表显示了 `delete` 运算符的工作：\n\
    \n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nconsole.log(\"name\"\
    \ in person1); // true\ndelete person1.name; // true - 无输出\nconsole.log(\"name\"\
    \ in person1); // false\nconsole.log(person1.name); // undefined\n```\n\n在此示例中，name\
    \ 属性已从 person1 中删除。操作完成后，`in` 运算符返回 `false`。此外，请注意，访问不存在的属性将只会返回 `undefined`。图\
    \ 3-2 显示了 `delete` 如何影响对象。\n\n| person1 | |\n| :--- | :--- |\n| name | \"Nicholas\"\
    \ |\n| delete person1.name; | |\n\n图 3-2：当****删除** **name** 属性时，它会从 **person1**\
    \ 中完全消失。*\n\n## 枚举\n\n默认情况下，你添加到对象的所有属性都是*可枚举的*，这意味着你可以使用 `for-in` 循环对它们进行迭代。可枚举属性的其内部\
    \ [[Enumerable]] 属性被设置为 `true`。`for-in` 循环枚举对象上的所有可枚举属性，并将属性名赋值给变量。例如，下面的循环输出了对象的属性名和属性值：\n\
    \n```javascript\nvar property;\nfor (property in object) {\n  console.log(\"Name:\
    \ \" + property);\n  console.log(\"Value: \" + object[property]);\n}\n```\n\n\
    每通过一次 `for-in` 循环，属性变量就会被对象上的下一个可枚举属性填充，直到所有此类属性都被使用完毕。在此时，循环结束，代码继续执行。此示例使用方括号表示法来获取对象属性的值并将其输出到控制台，这是\
    \ JavaScript 中方括号表示法的主要用例之一。\n\n如果你只需要一个对象的属性列表以供稍后在程序中使用，ECMAScript 5 引入了 `Object.keys()`\
    \ 方法来获取一个可枚举属性名的数组，如下所示：\n\n```javascript\nvar properties = Object.keys(object);\n\
    // 如果你想模拟 for-in 的行为\nvar i, len;\nfor (i=0, len=properties.length; i < len; i++){\n\
    \  console.log(\"Name: \" + properties[i]);\n  console.log(\"Value: \" + object[properties[i]]);\n\
    }\n```\n\n此示例使用 `Object.keys()` 从对象中获取可枚举属性。然后使用 `for` 循环遍历属性并输出名称和值。通常，当你想要对属性名数组进行操作时会使用\
    \ `Object.keys()`，而在不需要数组时使用 `for-in`。\n\n**注意*** **for-in** 循环返回的可枚举属性与 **Object.keys()**\
    \ 返回的属性之间存在差异。**for-in** 循环还会枚举原型属性，而 **Object.keys()** 只返回自有（实例）属性。原型属性和自有属性之间的区别在于。\n\
    \n## 理解对象 **37**\n\n记住，并不是所有属性都是可枚举的。事实上，大多数原生属性默认都是可枚举的。你可以使用 `propertyEnumerable()`\
    \ 方法检查属性是否是可枚举的，其方法如下：\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\"\
    \n};\n\nconsole.log(\"name\" in person1); // true\nvar properties = Object.keys(person1);\n\
    console.log(\"length\" in properties); // true\nconsole.log(person1.propertyEnumerable(\"\
    length\")); // false\n```\n\n## 属性类型\n\n属性有两种类型：数据属性和访问器属性。*数据属性*包含一个值，如前面的示例所示。*访问器属性*不包含值，而是定义了一个在读取属性时调用的函数（称为\
    \ *getter*，获取器）和一个在写入属性时调用的函数（称为 *setter*，设定器）。访问器属性需要 getter 或 setter，尽管它们可以两者兼备。\n\
    \n使用对象定义访问器属性有一种特殊的句语法：\n\n```javascript\nvar person1 = {\n  _name: \"Nicholas\"\
    ,\n  get name() {\n    console.log(\"Reading name\");\n    return this._name;\n\
    \  },\n  set name(value) {\n    console.log(\"Setting name to\", value);\n   \
    \ this._name = value;\n  }\n};\n\nconsole.log(person1.name); // 输出 \"Reading name\"\
    \ 然后 \"Nicholas\"\nperson1.name = \"Greg\";\nconsole.log(person1.name); // 输出\
    \ \"Setting name to Greg\" 然后 \"Reading name\" 然后 \"Greg\"\n```\n\n此示例定义了一个访问器属性。有一个名为\
    \ _name 的数据属性，包含了该属性的实际值（前下划线是一种常用约定，表示该属性被认为是私有的，尽管实际上它仍然是公开的）。尽管此示例使用 _name\
    \ 来存储数据，你也可以将数据存储在变量或其他对象中。此示例只是为属性的行为增加了日志；如果你只是将数据存储另一个属性中，通常没有理由使用访问器属性——直接使用属性即可。访问器属性在赋值需要触发某种行为或读取值需要计算所需的返回值时最有用。ECMAScript\
    \ 5 改变了这一点，引入了多种直接与属性交互的方法，并引入了新的属性以支持额外功能。现在可以创建与内置 JavaScript 属性行为相同的属性。本节将详细介绍数据属性和访问器属性的属性，从它们共同拥有的属性开始。\n\
    \n"
