    \nvar prototype \\= Object.getPrototypeOf(book);\n\nconsole.log(prototype \\===\
    \ Object.prototype); // true\n\nHere, book has a prototype equal to Object.prototype.\
    \ No additional \n\ncode was necessary to make this happen, as this is the default\
    \ behavior \n\nwhen new objects are created. This rela­tionship means that book\
