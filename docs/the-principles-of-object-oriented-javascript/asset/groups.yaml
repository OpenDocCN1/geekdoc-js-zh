    \nfunction Person(name) {\n\n this.name \\= name;\n\n}"
- md: "\n## Object Patterns **91**\n\nPerson.prototype.sayName = function() {\n  console.log(this.name);\n\
    };\n\nvar person1 = Person(\"Nicholas\"); // note: missing \"new\"\n\nconsole.log(person1\
    \ instanceof Person); // false\n\nconsole.log(typeof person1); // \"undefined\"\
    \n\nconsole.log(name); // \"Nicholas\"\n\nIn this case, name is created as a global\
    \ variable because the Person constructor is called without new. Keep in mind\
    \ that this code is running in nonstrict mode, as leaving out new would throw\
    \ an error in strict mode.\n\nThe fact that the constructor begins with a capital\
    \ letter usually indicates that it should be preceded by new, but what if you\
    \ want to allow this use case and have the function work without new? Many built-in\
    \ constructors, such as Array and RegExp, also work without new because they are\
    \ written to be *scope safe*. A scope-safe constructor can be called with or without\
    \ new and returns the same type of object in either case.\n\nWhen new is called\
    \ with a function, the newly created object represented by this is already an\
    \ instance of the custom type represented by the constructor. So you can use instanceof\
    \ to determine whether new was used in the function call:\n\n```javascript\nfunction\
    \ Person(name) {\n  if (this instanceof Person) {\n    // called with \"new\"\n\
    \  } else {\n    // called without \"new\"\n  }\n}\n```\n\nUsing a pattern like\
    \ this lets you control what a function does based on whether it’s called with\
    \ new or without. You may want to treat each circumstance differently, but you’ll\
    \ often want the function to behave the same way (frequently, to protect against\
    \ accidental omission of new). A scope-safe version of Person looks like this:\n\
    \n```javascript\nfunction Person(name) {\n  if (this instanceof Person) {\n  \
    \  this.name = name;\n  } else {\n    return new Person(name);\n  }\n}\n```\n\n\
    **92** Chapter 6\n\nFor this constructor, the name property is assigned as always\
    \ when new is used. If new isn’t used, the constructor is called recursively via\
    \ new to create a proper instance of the object. In this way, the following are\
    \ equivalent:\n\n```javascript\nvar person1 = new Person(\"Nicholas\");\nvar person2\
    \ = Person(\"Nicholas\");\n\nconsole.log(person1 instanceof Person); // true\n\
    console.log(person2 instanceof Person); // true\n```\n\nCreating new objects without\
    \ using the new operator is becoming more common as an effort to curb errors caused\
    \ by omitting new. JavaScript itself has several reference types with scope-safe\
    \ constructors, such as Object, Array, RegExp, and Error.\n\n### Summary\n\nThere\
    \ are many different ways to create and compose objects in JavaScript. While JavaScript\
    \ does not include the formal concept of private properties, you can create data\
    \ or functions that are accessible only from within an object. For singleton objects,\
    \ you can use the module pattern to hide data from the outside world. You can\
    \ use an immediately invoked function expression (IIFE) to define local variables\
    \ and functions that are accessible only by the newly created object. Privileged\
    \ methods are methods on the object that have access to private data. You can\
    \ also create constructors that have private data by either defining variables\
    \ in the constructor function or by using an IIFE to create private data that\
    \ is shared among all instances.\n\nMixins are a powerful way to add functionality\
    \ to objects while avoiding inheritance. A mixin copies properties from one object\
    \ to another so that the receiving object gains functionality without inheriting\
    \ from the supplying object. Unlike inheritance, mixins do not allow you to identify\
    \ where the capabilities came from after the object is created. For this reason,\
    \ mixins are best used with data properties or small pieces of functionality.\
    \ Inheritance is still preferable when you want to obtain more functionality and\
    \ know where that functionality came from.\n\nScope-safe constructors are constructors\
    \ that you can call with or without new to create a new object instance. This\
    \ pattern takes advantage of the fact that this is an instance of the custom type\
    \ as soon as the constructor begins to execute, which lets you alter the constructor’s\
    \ behavior depending on whether or not you used the new operator.\n\n**In index**\n\
