    \ instanceof Array); // false\n\nconsole.log(reflect instanceof Function); //\
    \ true\n\nconsole.log(reflect instanceof Object); // true\n\nEach reference type\
    \ is correctly identified as an instance of Object, \n\nfrom which all reference\
    \ types inherit.\n\n**Identifying Arrays**\n\nAlthough instanceof can identify\
