    \ other special \n\ncharacters:\n\nvar book \\= {\n\n \"name\": \"The Principles\
    \ of Object-Oriented JavaScript\",\n\n \"year\": 2014\n\n};"
- md: "\n## Chapter 1\n\nThis example is equivalent to the previous one despite the\
    \ syntactic differences. Both examples are also logically equivalent to the following:\n\
    \n```javascript\nvar book = new Object();\n\nbook.name = \"The Principles of Object-Oriented\
    \ JavaScript\";\n\nbook.year = 2014;\n```\n\nThe outcome of each of the previous\
    \ three examples is the same: an object with two properties. The choice of pattern\
    \ is up to you because the functionality is ultimately the same.\n\n***NOTE***\
    \ Using an object literal doesn’t actually call **new Object()**. Instead, the\
    \ JavaScript engine follows the same steps it does when using **new Object()**\
    \ without actually calling the constructor. This is true for all reference literals.*\n\
    \nYou can define an *array literal* in a similar way by enclosing any number of\
    \ comma-separated values inside square brackets. For example:\n\n```javascript\n\
    var colors = [\"red\", \"blue\", \"green\"];\n\nconsole.log(colors[0]); // \"\
    red\"\n```\n\nThis code is equivalent to the following:\n\n```javascript\nvar\
    \ colors = new Array(\"red\", \"blue\", \"green\")\nconsole.log(colors[0]); //\
    \ \"red\"\n```\n\n### Function Literals\n\nYou almost always define functions\
    \ using their literal form. In fact, using the Function constructor is typically\
    \ discouraged given the challenges of maintaining, reading, and debugging a string\
    \ of code rather than actual code, so you’ll rarely see it in code.\n\nCreating\
    \ functions is much easier and less error prone when you use the literal form.\
    \ For example:\n\n```javascript\nfunction reflect(value) {\n return value;\n}\n\
    ```\n\n// is the same as\n\n```javascript\nvar reflect = new Function(\"value\"\
    , \"return value;\");\n```\n\nThis code defines the reflect() function, which\
    \ returns any value passed to it. Even in the case of this simple function, the\
    \ literal form is easier to write and understand than the constructor form. Further,\
    \ there is no good way to debug functions that are created in the constructor\
    \ form: These functions aren’t recognized by JavaScript debuggers and therefore\
    \ act as a black box in your application.\n\n### Regular Expression Literals\n\
    \nJavaScript also has *regular expression literals* that allow you to define regular\
    \ expressions without using the RegExp constructor. Regular expression literals\
    \ look very similar to regular expressions in Perl: The pattern is contained between\
    \ two slashes, and any additional options are single characters following the\
    \ second slash. For example:\n\n```javascript\nvar numbers = /\\d+/g;\n```\n\n\
    // is the same as\n\n```javascript\nvar numbers = new RegExp(\"\\\\d+\", \"g\"\
    );\n```\n\nThe literal form of regular expressions in JavaScript is a bit easier\
    \ to deal with than the constructor form because you don’t need to worry about\
    \ escaping characters within strings. When using the RegExp constructor, you pass\
    \ the pattern in as a string, so you have to escape any backslashes. (That’s why\
    \ \\d is used in the literal and \\\\d is used in the constructor.) Regular expression\
    \ literals are preferred over the constructor form in JavaScript except when the\
    \ regular expression is being constructed dynamically from one or more strings.\n\
    \nThat said, with the exception of Function, there really isn’t any right or wrong\
    \ way to instantiate built-in types. Many developers prefer literals, while some\
    \ prefer constructors. Choose whichever method you find more comfortable to use.\n\
    \n### Property Access\n\nProperties are name/value pairs that are stored on an\
    \ object. Dot notation is the most common way to access properties in JavaScript\
    \ (as in many object-oriented languages), but you can also access properties on\
    \ JavaScript objects by using bracket notation with a string.\n\nFor example,\
    \ you could write this code, which uses dot notation:\n\n```javascript\nvar array\
    \ = [];\n\narray.push(12345);\n```\n\nWith bracket notation, the name of the method\
    \ is now included in a string enclosed by square brackets, as in this example:\n\
    \n```javascript\nvar array = [];\n\narray[\"push\"](12345);\n```\n\nThis syntax\
    \ is very useful when you want to dynamically decide which property to access.\
    \ For example, here bracket notation allows you to use a variable instead of the\
    \ string literal to specify the property to access.\n\n```javascript\nvar array\
    \ = [];\nvar method = \"push\";\n\narray[method](12345);\n```\n\nIn this listing,\
    \ the variable method has a value of \"push\", so push() is called on the array.\
    \ This capability is quite useful, as you’ll see throughout this book. The point\
    \ to remember is that, other than syntax, the only difference—performance or otherwise—between\
    \ dot notation and bracket notation is that bracket notation allows you to use\
    \ special characters in property names. Developers tend to find dot notation easier\
    \ to read, so you’ll see it used more frequently than bracket notation.\n\n###\
    \ Identifying Reference Types\n\nA function is the easiest reference type to identify\
    \ because when you use the typeof operator on a function, the operator should\
    \ return \"function\":\n\n```javascript\nfunction reflect(value) {\n return value;\n\
    }\n\nconsole.log(typeof reflect); // \"function\"\n```\n\nOther reference types\
    \ are trickier to identify because, for all reference types other than functions,\
    \ typeof returns \"object\". That’s not very helpful when you’re dealing with\
    \ a lot of different types. To identify reference types more easily, you can use\
    \ JavaScript’s instanceof operator.\n\nThe instanceof operator takes an object\
    \ and a constructor as parameters. When the value is an instance of the type that\
    \ the constructor specifies, instanceof returns true; otherwise, it returns false,\
    \ as you can see here:\n\n```javascript\nvar items = [];\nvar object = {};\n\n\
    function reflect(value) {\n return value;\n}\n\nconsole.log(items instanceof Array);\
    \ // true\nconsole.log(object instanceof Object); // true\nconsole.log(reflect\
    \ instanceof Function); // true\n```\n\nIn this example, several values are tested\
    \ using instanceof and a constructor. Each reference type is correctly identified\
    \ by using instanceof and the constructor that represents its true type (even\
    \ though the constructor wasn’t used in creating the variable).\n\nThe instanceof\
    \ operator can identify inherited types. That means every object is actually an\
    \ instance of Object because every reference type inherits from Object.\n\nTo\
    \ demonstrate, the following listing examines the three references previously\
    \ created with instanceof:\n\n```javascript\nvar items = [];\nvar object = {};\n\
    \nfunction reflect(value) {\n return value;\n}\n\nconsole.log(items instanceof\
    \ Array); // true\nconsole.log(items instanceof Object); // true\nconsole.log(object\
    \ instanceof Object); // true\nconsole.log(object instanceof Array); // false\n\
    console.log(reflect instanceof Function); // true\nconsole.log(reflect instanceof\
    \ Object); // true\n```\n\nEach reference type is correctly identified as an instance\
    \ of Object, from which all reference types inherit.\n\n### Identifying Arrays\n\
    \nAlthough instanceof can identify arrays, there is one exception that affects\
    \ web developers: JavaScript values can be passed back and forth between frames\
    \ in the same web page. This becomes a problem only when you try to identify the\
    \ type of a reference value, because each web page has its own global context—its\
    \ own version of Object, Array, and all other built-in types. As a result, when\
    \ you pass an array from one frame to another, instanceof doesn’t work because\
    \ the array is actually an instance of Array from a different frame.\n\nTo solve\
    \ this problem, ECMAScript 5 introduced Array.isArray(), which definitively identifies\
    \ the value as an instance of Array.\n\n```javascript\nvar items = [];\nconsole.log(Array.isArray(items));\
    \ // true\n```\n\n### Primitive Wrapper Types\n\nPerhaps one of the most confusing\
    \ parts of JavaScript is the concept of *primitive wrapper types*. There are three\
    \ wrapper types (String, Number, and Boolean). These special reference types exist\
    \ to make working with primitive values as easy as working with objects. (It would\
    \ be very confusing if you had to use a different syntax or switch to a procedural\
    \ style just to get a substring of text.)\n\nPrimitive wrapper types are reference\
    \ types that are automatically created behind the scenes whenever strings, numbers,\
    \ or Booleans are read. For example, in the first line of this listing, a primitive\
    \ string value is assigned to name. The second line treats name like an object\
    \ and calls charAt(0) using dot notation.\n\n```javascript\nvar name = \"Nicholas\"\
    ;\nvar firstChar = name.charAt(0);\n\nconsole.log(firstChar); // \"N\"\n```\n\n\
    This is what happens behind the scenes:\n\n```javascript\n// what the JavaScript\
    \ engine does\nvar name = \"Nicholas\";\nvar temp = new String(name);\nvar firstChar\
    \ = temp.charAt(0);\n\ntemp = null;\n\nconsole.log(firstChar); // \"N\"\n```\n\
    \nBecause the second line uses a string (a primitive) like an object, the JavaScript\
    \ engine creates an instance of String so that charAt(0) will work. The String\
    \ object exists only for one statement before it’s destroyed (a process called\
    \ *autoboxing*). To test this out, try adding a property to a string as if it\
    \ were a regular object:\n\n```javascript\nvar name = \"Nicholas\";\nname.last\
    \ = \"Zakas\";\n\nconsole.log(name.last); // undefined\n```\n\nThis code attempts\
    \ to add the property last to the string name. The code itself is just fine except\
    \ that the property disappears. What happened? When working with regular objects,\
    \ you can add properties at any time and they stay until you manually remove them.\
    \ With primitive wrapper types, properties seem to disappear because the object\
    \ on which the property was assigned is destroyed immediately afterward.\n"
  mdcn: "\n\n## 第1章\n\n尽管语法有所不同，这个示例与上一个是等价的。这两个示例在逻辑上也与以下代码等价：\n\n```javascript\n\
    var book = new Object();\n\nbook.name = \"The Principles of Object-Oriented JavaScript\"\
    ;\n\nbook.year = 2014;\n```\n\n前三个示例的结果是相同的：一个具有两个属性的对象。模式的选择取决于你，因为其功能最终是相同的。\n\
    \n***注意*** 使用对象字面量实际上并没有调用 **new Object()**。相反，JavaScript 引擎会遵循与使用 **new Object()**\
    \ 相同的步骤，但并不会实际调用构造函数。这对于所有引用字面量都是如此。*\n\n你可以以类似的方式定义*数组字面量*，即在方括号内包含任意数量用逗号分隔的值。例如：\n\
    \n```javascript\nvar colors = [\"red\", \"blue\", \"green\"];\n\nconsole.log(colors[0]);\
    \ // \"red\"\n```\n\n这段代码与以下代码等价：\n\n```javascript\nvar colors = new Array(\"\
    red\", \"blue\", \"green\")\nconsole.log(colors[0]); // \"red\"\n```\n\n### 函数字面量\n\
    \n你几乎总是使用字面量形式定义函数。事实上，鉴于维护、读取和调试字符串代码而非实际代码的挑战，通常不建议使用 Function 构造函数，因此你很少会在代码中看到它。\n\
    \n使用字面量形式创建函数要简单得多，且不容易出错。例如：\n\n```javascript\nfunction reflect(value) {\n return\
    \ value;\n}\n```\n\n// 等同于\n\n```javascript\nvar reflect = new Function(\"value\"\
    , \"return value;\");\n```\n\n这段代码定义了 reflect() 函数，它返回传递给它的任何值。即使对于这个简单的函数，字面量形式也比构造函数形式更容易编写和理解。此外，没有好的方法可以调试以构造函数形式创建的函数：这些函数不会被\
    \ JavaScript 调试器识别，因此在你的应用程序中像黑盒一样运行。\n\n### 正则表达式字面量\n\nJavaScript 还有*正则表达式字面量*，它允许你在不使用\
    \ RegExp 构造函数的情况下定义正则表达式。正则表达式字面量看起来与 Perl 中的正则表达式非常相似：模式包含在两个斜杠之间，任何额外的选项都是跟随第二个斜杠的单字符。例如：\n\
    \n```javascript\nvar numbers = /\\d+/g;\n```\n\n// 等同于\n\n```javascript\nvar numbers\
    \ = new RegExp(\"\\\\d+\", \"g\");\n```\n\nJavaScript 中的正则表达式字面量形式比构造函数形式稍微更容易处理，因为你不需要担心字符串内部的转义。在使用\
    \ RegExp 构造函数时，你将模式作为字符串传递，因此你必须对任何反斜杠进行转义。（这就是为什么在字面量中使用 \\d，而在构造函数中使用 \\\\d。））在\
    \ JavaScript 中，除非正则表达式是从一个或多个字符串动态构建的，否则优于使用字面量形式而非构造函数形式。\n\n尽管如此，除了 Function\
    \ 之外，实例化内置类型并没有真正的对错方法。许多开发者倾向于使用字面量，而一些人则倾向于构造函数。选择你认为更方便使用的方法。\n\n### 属性访问\n\
    \n属性是存储在对象上的键值对。点符号（Dot notation）是 JavaScript 中访问属性的最常用方式（就像许多面向对象的语言一样），但你也可以通过使用字符串的括号表示访问\
    \ JavaScript 对象的属性。\n\n例如，你可以编写以下使用点表示法的代码：\n\n```javascript\nvar array = [];\n\
    \narray.push(12345);\n```\n\n使用括号表示法，方法的名称现在被包含在方括号内的字符串中，如例所示：\n\n```javascript\n\
    var array = [];\n\narray[\"push\"](12345);\n```\n\n这种语法在你想要动态决定访问哪个属性时非常有用。例如，在这里，括号表示法允许你使用变量而不是字符串字面量来指定要访问的属性。\n\
    \n```javascript\nvar array = [];\nvar method = \"push\";\n\narray[method](12345);\n\
    ```\n\n在此列表中，变量 method 的值为 \"push\"，因此在数组上调用了 push()。这种能力非常有用，正如你在整本书中看到的那样。需要记住的点是，除了语法之外，点表示法和括号表示法之间的唯一区别（无论性能或其他方面）是，括号表示法允许你在属性名中使用特殊字符。开发者倾向于认为点表示法更容易读，因此你会看到它的使用频率高于括号表示法。\n\
    \n### 识别引用类型\n\n函数是最容易识别的引用类型，因为当你对函数使用 `typeof` 运算符时，该运算符应该返回 \"function\"：\n\
    \n```javascript\nfunction reflect(value) {\n return value;\n}\n\nconsole.log(typeof\
    \ reflect); // \"function\"\n```\n\n其他引用类型更难识别，因为对于除函数以外的所有引用类型，`typeof` 都返回 \"\
    object\"。当你处理许多不同类型时，这并没有什么帮助。为了更容易地识别引用类型，你可以使用 JavaScript 的 `instanceof` 运算符。\n\
    \n`instanceof` 运算符接受一个对象和一个构造函数作为参数。当该值是构造函数指定的类型的实例时，`instanceof` 返回 true；否则返回\
    \ false，如下所示：\n\n```javascript\nvar items = [];\nvar object = {};\n\nfunction\
    \ reflect(value) {\n return value;\n}\n\nconsole.log(items instanceof Array);\
    \ // true\nconsole.log(object instanceof Object); // true\nconsole.log(reflect\
    \ instanceof Function); // true\n```\n\n在这个示例中，使用 `instanceof` 和构造函数对多个值进行了测试。每个引用类型通过使用\
    \ `instanceof` 和代表其真实类型的构造函数被正确识别（尽管在创建变量时没有使用该构造函数）。\n\n`instanceof` 运算符可以识别继承类型。这意味着每个对象实际上都是\
    \ Object 的实例，因为每个引用类型都继承自 Object。\n\n为了演示，下面的列表使用 `instanceof` 检查了之前创建的三个引用：\n\
    \n```javascript\nvar items = [];\nvar object = {};\n\nfunction reflect(value)\
    \ {\n return value;\n}\n\nconsole.log(items instanceof Array); // true\nconsole.log(items\
    \ instanceof Object); // true\nconsole.log(object instanceof Object); // true\n\
    console.log(object instanceof Array); // false\nconsole.log(reflect instanceof\
    \ Function); // true\nconsole.log(reflect instanceof Object); // true\n```\n\n\
    每个引用类型都被正确识别为 Object 的实例，所有引用类型都继承自它。\n\n### 识别数组\n\n尽管 `instanceof` 可以识别数组，但有一个影响\
    \ Web 开发者的例外：JavaScript 值可以在同一个网页的各个帧（frames）之间来传递。只有当你尝试识别引用值的类型时才会出现问题，因为每个网页都有自己的全局上下文——它们自己的\
    \ Object、Array 以及所有其他内置类型的版本。因此，当你从一个帧传递数组到另一个帧时，`instanceof` 将无法工作，因为该数组实际上是另一个帧的\
    \ Array 实例。\n\n为了解决这个问题，ECMAScript 5 引入了 `Array.isArray()`，它可以明确地将该值识别为 Array\
    \ 的实例。\n\n```javascript\nvar items = [];\nconsole.log(Array.isArray(items)); //\
    \ true\n```\n\n### 原始包装类型\n\nJavaScript 最令人困惑的部分之一是*原始包装类型*（primitive wrapper\
    \ types）的概念。有三种包装类型（String、Number 和 Boolean）。这些特殊的引用类型存在是为了让处理原始值变得像处理对象一样简单。（如果你为了获取文本的子字符串而必须使用不同的语法或切换到过程化风格，那将非常困惑。）\n\
    \n原始包装类型是引用类型，当读取字符串、数字或布尔值时，它们会在后台自动创建。例如，在此列表的第一行，一个原始字符串值被赋值给 `name`。第二行将 `name`\
    \ 视为对象，并使用点符号调用 `charAt(0)`。\n\n```javascript\nvar name = \"Nicholas\";\nvar firstChar\
    \ = name.charAt(0);\n\nconsole.log(firstChar); // \"N\"\n```\n\n这是在后台发生的情况：\n\n\
    ```javascript\n// JavaScript 引擎执行的操作\nvar name = \"Nicholas\";\nvar temp = new\
    \ String(name);\nvar firstChar = temp.charAt(0);\n\ntemp = null;\n\nconsole.log(firstChar);\
    \ // \"N\"\n```\n\n因为第二行像使用对象一样使用字符串（原始值），JavaScript 引擎创建一个 String 实例以便 `charAt(0)`\
    \ 能够工作。String 对象只存在一个语句就会被销毁（这一过程被称为*自动装箱*autoboxing）。为了测试这一点，尝试像普通对象一样向字符串添加属性：\n\
    \n```javascript\nvar name = \"Nicholas\";\nname.last = \"Zakas\";\n\nconsole.log(name.last);\
    \ // undefined\n```\n\n这段代码尝试向字符串 `name` 添加属性 `last`。代码本身没有问题，只是属性消失了。发生了什么？在处理普通对象时，你可以随时添加属性，它们会一直直到你手动删除。对于原始包装类型，属性似乎消失了，是因为赋值属性的对象在随后立即被销毁了。\n\
    \n"
