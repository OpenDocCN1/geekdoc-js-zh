  - "[PAGE 43]\n\nFunctions   **23**\n\n**Overloading**\n\nMost object-oriented languages\
    \ support *function overloading*, which is the \n\nability of a single function\
    \ to have multiple *signatures*. A function signature \n\nis made up of the function\
    \ name plus the number and type of parameters \n\nthe function expects. Thus,\
    \ a single function can have one signature that \n\naccepts a single string argument\
    \ and another that accepts two numeric \n\narguments. The language determines\
    \ which version of a function to call \n\nbased on the arguments that are passed\
    \ in.\n\nAs mentioned previously, JavaScript functions can accept any number \n\
    \nof parameters, and the types of parameters a function takes aren’t speci-\n\n\
    fied at all. That means JavaScript functions don’t actually have signatures. \n\
    \nA lack of function signatures also means a lack of function overloading. \n\n\
    Look at what happens when you try to declare two functions with the \n\nsame name:\n\
    \nfunction sayMessage(message) {\n\n console.log(message);\n\n}\n\nfunction sayMessage()\
    \ {\n\n console.log(\"Default message\");\n\n}\n\nsayMessage(\"Hello!\"); // outputs\
    \ \"Default message\"\n\nIf this were another language, the output of sayMessage(\"\
    Hello!\") would \n\nlikely be \"Hello!\". In JavaScript, however, when you define\
    \ multiple func-\n\ntions with the same name, the one that appears last in your\
    \ code wins. \n\nThe earlier function declarations are completely removed, and\
    \ the last \n\nis the one that is used. Once again, it helps to think about this\
    \ situation \n\nusing objects:\n\nvar sayMessage \\= new Function(\"message\"\
    , \"console.log(message);\");\n\nsayMessage \\= new Function(\"console.log(\\\\\
    \"Default message\\\\\");\");\n\nsayMessage(\"Hello!\"); // outputs \"Default\
    \ message\"\n\nLooking at the code this way makes it clear why the previous code\
    \ \n\ndidn’t work. A function object is being assigned to ­sayMessage twice in\
    \ a \n\nrow, so it makes sense that the first function object would be lost."
- md: "\n24 Chapter 2\n\nThe fact that functions don’t have signatures in JavaScript\
    \ doesn’t mean you can’t mimic function overloading. You can retrieve the number\
    \ of parameters that were passed in by using the arguments object, and you can\
    \ use that information to determine what to do. For example:\n\n```javascript\n\
    function sayMessage(message) {\n  if (arguments.length === 0) {\n    message =\
    \ \"Default message\";\n  }\n  console.log(message);\n}\n\nsayMessage(\"Hello!\"\
    ); // outputs \"Hello!\"\n```\n\nIn this example, the sayMessage() function behaves\
    \ differently based on the number of parameters that were passed in. If no parameters\
    \ are passed in (arguments.length === 0), then a default message is used. Otherwise,\
    \ the first parameter is used as the message. This is a little more involved than\
    \ function overloading in other languages, but the end result is the same. If\
    \ you really want to check for different data types, you can use typeof and instanceof.\n\
    \n***NOTE*** *In practice, checking the named parameter against **undefined**\
    \ is more common than *relying on **arguments.length**.*\n\n## Object Methods\n\
    \nAs mentioned in Chapter 1, you can add and remove properties from objects at\
    \ any time. When a property value is actually a function, the property is considered\
    \ a method. You can add a method to an object in the same way that you would add\
    \ a property. For example, in the following code, the person variable is assigned\
    \ an object literal with a name property and a method called sayName.\n\n```javascript\n\
    var person = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(person.name);\n\
    \  }\n};\n\nperson.sayName(); // outputs \"Nicholas\"\n```\n\nNote that the syntax\
    \ for a data property and a method is exactly the same—an identifier followed\
    \ by a colon and the value. In the case of sayName, the value just happens to\
    \ be a function. You can then call the method directly from the object as in person.sayName(\"\
    Nicholas\").\n\nFunctions 25\n\n### The this Object\n\nYou may have noticed something\
    \ strange in the previous example. The sayName() method references person.name\
    \ directly, which creates tight coupling between the method and the object. This\
    \ is problematic for a number of reasons. First, if you change the variable name,\
    \ you also need to remember to change the reference to that name in the method.\
    \ Second, this sort of tight coupling makes it difficult to use the same function\
    \ for different objects. Fortunately, JavaScript has a way around this issue.\n\
    \nEvery scope in JavaScript has a this object that represents the calling object\
    \ for the function. In the global scope, this represents the global object (window\
    \ in web browsers). When a function is called while attached to an object, the\
    \ value of this is equal to that object by default. So, instead of directly referencing\
    \ an object inside a method, you can reference this instead. For example, you\
    \ can rewrite the code from the previous example to use this:\n\n```javascript\n\
    var person = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \  }\n};\n\nperson.sayName(); // outputs \"Nicholas\"\n```\n\nThis code works\
    \ the same as the earlier version, but this time, sayName() references this instead\
    \ of person. That means you can easily change the name of the variable or even\
    \ reuse the function on different objects.\n\n```javascript\nfunction sayNameForAll()\
    \ {\n  console.log(this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\",\n\
    \  sayName: sayNameForAll\n};\n\nvar person2 = {\n  name: \"Greg\",\n  sayName:\
    \ sayNameForAll\n};\n\nvar name = \"Michael\";\nperson1.sayName(); // outputs\
    \ \"Nicholas\"\nperson2.sayName(); // outputs \"Greg\"\nsayNameForAll(); // outputs\
    \ \"Michael\"\n```\n\n26 Chapter 2\n\nIn this example, a function called sayName\
    \ is defined first. Then, two object literals are created that assign sayName\
    \ to be equal to the sayNameForAll function. Functions are just reference values,\
    \ so you can assign them as property values on any number of objects. When sayName()\
    \ is called on person1, it outputs \"Nicholas\"; when called on person2, it outputs\
    \ \"Greg\". That’s because this is set when the function is called, so this.name\
    \ is accurate.\n\nThe last part of this example defines a global variable called\
    \ name. When sayNameForAll() is called directly, it outputs \"Michael\" because\
    \ the global variable is considered a property of the global object.\n\n### Changing\
    \ this\n\nThe ability to use and manipulate the this value of functions is key\
    \ to good object-oriented programming in JavaScript. Functions can be used in\
    \ many different contexts, and they need to be able to work in each situation.\
    \ Even though this is typically assigned automatically, you can change its value\
    \ to achieve different goals. There are three function methods that allow you\
    \ to change the value of this. (Remember that functions are objects, and objects\
    \ can have methods, so functions can, too.)\n\n#### The call() Method\n\nThe first\
    \ function method for manipulating this is call(), which executes the function\
    \ with a particular this value and with specific parameters. The first parameter\
    \ of call() is the value to which this should be equal when the function is executed.\
    \ All subsequent parameters are the parameters that should be passed into the\
    \ function. For example, suppose you update sayNameForAll() to take a parameter:\n\
    \n```javascript\nfunction sayNameForAll(label) {\n  console.log(label + \":\"\
    \ + this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar person2\
    \ = {\n  name: \"Greg\"\n};\n\nvar name = \"Michael\";\nsayNameForAll.call(this,\
    \ \"global\"); // outputs \"global:Michael\"\nsayNameForAll.call(person1, \"person1\"\
    ); // outputs \"person1:Nicholas\"\nsayNameForAll.call(person2, \"person2\");\
    \ // outputs \"person2:Greg\"\n```\n\nFunctions 27\n\nIn this example, sayNameForAll()\
    \ accepts one parameter that is used as a label to the output value. The function\
    \ is then called three times. Notice that there are no parentheses after the function\
    \ name because it is accessed as an object rather than as code to execute. The\
    \ first function call uses the global this and passes in the parameter \"global\"\
    \ to output \"global:Michael\". The same function is called two more times, once\
    \ each for person1 and person2. Because the call() method is being used, you don’t\
    \ need to add the function directly onto each object—you explicitly specify the\
    \ value of this instead of letting the JavaScript engine do it automatically.\n\
    \n#### The apply() Method\n\nThe second function method you can use to manipulate\
    \ this is apply(). The apply() method works exactly the same as call() except\
    \ that it accepts only two parameters: the value for this and an array or array-like\
    \ object of parameters to pass to the function (that means you can use an arguments\
    \ object as the second parameter). So, instead of individually naming each parameter\
    \ using call(), you can easily pass arrays to apply() as the second argument.\
    \ Otherwise, call() and apply() behave identically. This example shows the apply()\
    \ method in action:\n\n```javascript\nfunction sayNameForAll(label) {\n  console.log(label\
    \ + \":\" + this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar\
    \ person2 = {\n  name: \"Greg\"\n};\n\nvar name = \"Michael\";\nsayNameForAll.apply(this,\
    \ [\"global\"]); // outputs \"global:Michael\"\nsayNameForAll.apply(person1, [\"\
    person1\"]); // outputs \"person1:Nicholas\"\nsayNameForAll.apply(person2, [\"\
    person2\"]); // outputs \"person2:Greg\"\n```\n*(Note: The OCR text had missing\
    \ brackets in the apply calls, which have been restored for technical correctness)*\n\
    \nIn this example, sayNameForAll() accepts one parameter that is used as a label\
    \ to the output value. The function is then called three times. Notice that there\
    \ are no parentheses after the function name because it is accessed as an object\
    \ rather than as code to execute. The first function call uses the global this\
    \ and passes in the parameter \"global\" to output \"global:Michael\". The same\
    \ function is called two more times, once each for person1 and person2. Because\
    \ the call() method is being used, you don’t need to add the function directly\
    \ onto each object—you explicitly specify the value of this instead of letting\
    \ the JavaScript engine do it automatically.\n\n28 Chapter 2\n\n#### The bind()\
    \ Method\n\nThe third function method for changing this is bind(). This method\
    \ was added in ECMAScript 5, and it behaves quite differently than the other two.\
    \ The first argument to bind() is the this value for the new function. All other\
    \ arguments represent named parameters that should be permanently set in the new\
    \ function. You can still pass in any parameters that aren’t permanently set.\n\
    \nThe following code shows two examples that use bind(). You create the sayNameForPerson1()\
    \ function by binding the this value to person1, while sayNameForPerson2() binds\
    \ this to person2 and binds the first parameter as \"person2\".\n\n```javascript\n\
    function sayNameForAll(label) {\n  console.log(label + \":\" + this.name);\n}\n\
    \nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar person2 = {\n  name: \"Greg\"\
    \n};\n\n// create a function just for person1\nvar sayNameForPerson1 = sayNameForAll.bind(person1);\n\
    sayNameForPerson1(\"person1\"); // outputs \"person1:Nicholas\"\n\n// create a\
    \ function just for person2\nvar sayNameForPerson2 = sayNameForAll.bind(person2,\
    \ \"person2\");\nsayNameForPerson2(); // outputs \"person2:Greg\"\n\n// attaching\
    \ a method to an object doesn't change 'this'\nvar person2.sayName = sayNameForPerson1;\n\
    person2.sayName(\"person2\"); // outputs \"person2:Nicholas\"\n```\n\nNo parameters\
    \ are bound for sayNameForPerson1(), so you still need to pass in the label for\
    \ the output. The function sayNameForPerson2() not only binds this to person2\
    \ but also binds the first parameter as \"person2\". That means you can call sayNameForPerson2()\
    \ without passing in any additional arguments. The last part of this example adds\
    \ sayNameForPerson1() onto person2 with the name sayName. The function is bound,\
    \ so the value of this doesn’t change even though sayNameForPerson1 is now a function\
    \ on person2. The method still outputs the value of person1.name.\n"
  mdcn: "\n24 第 2 章\n\nJavaScript 中函数没有签名（signatures），这并不意味着你不能模拟函数重载。你可以使用 `arguments`\
    \ 对象获取传入的参数个数，并利用这些信息来决定执行的操作。例如：\n\n```javascript\nfunction sayMessage(message)\
    \ {\n  if (arguments.length === 0) {\n    message = \"Default message\";\n  }\n\
    \  console.log(message);\n}\n\nsayMessage(\"Hello!\"); // 输出 \"Hello!\"\n```\n\
    \n在这个示例中，`sayMessage()` 函数的行为根据传入参数的数量而有所不同。如果没有传入任何参数（`arguments.length === 0`），则使用默认消息。否则，使用第一个参数作为消息。这比其他语言中的函数重载稍微复杂一些，但最终结果是相同的。如果你真的想检查不同的数据类型，可以使用\
    \ `typeof` 和 `instanceof`。\n\n***注意*** *在实践中，检查具名参数是否为 **undefined** 比 **依赖 **arguments.length***\
    \ 更常见。*\n\n## 对象方法 (Object Methods)\n\n如第 1 节所述，你可以随时向对象添加或删除属性。当一个属性值实际上是一个函数时，该属性就被视为一个方法。你可以像添加属性一样向对象添加方法。例如，在以下代码中，`person`\
    \ 变量被赋值了一个带有 `name` 属性和一个名为 `sayName` 方法的字对象字面量。\n\n```javascript\nvar person\
    \ = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(person.name);\n\
    \  }\n};\n\nperson.sayName(); // 输出 \"Nicholas\"\n```\n\n注意，数据属性和方法的语法完全相同——一个标识符后跟一个冒号，然后是值。在\
    \ `sayName` 的情况下，该值恰好是一个函数。然后你可以直接从对象调用该方法，如 `person.sayName(\"Nicholas\")`。\n\
    \n函数 25 页\n\n### `this` 对象 (The this Object)\n\n你可能在上一个示例中发现了一些奇怪的地方。`sayName()`\
    \ 方法直接引用了 `person.name`，这在方法和对象之间创建了紧耦合。由于许多原因这都是问题。首先，如果你更改了变量名，也需要记得更改方法中对该名的引用。其次，这种紧耦合使得很难对不同的对象使用同一个函数。幸运的是，JavaScript\
    \ 有解决此问题的方法。\n\nJavaScript 中的每个作用域都有一个 `this` 对象，它代表函数的调用对象。在全局作用域中，它代表全局对象（在浏览器中为\
    \ `window`）。当函数在附加到对象上时被调用时，`this` 的值默认等于该对象。因此，与其在方法内部直接引用对象，不如而是引用 `this`。例如，你可以重写上一个示例的代码来使用\
    \ `this`：\n\n```javascript\nvar person = {\n  name: \"Nicholas\",\n  sayName:\
    \ function() {\n    console.log(this.name);\n  }\n};\n\nperson.sayName(); // 输出\
    \ \"Nicholas\"\n```\n\n这段代码的作用与之前的版本相同，但这次 `sayName()` 引用的是 `this` 而不是 `person`。这意味着你可以轻松地更改变量名，甚至在不同的对象上复用该函数。\n\
    \n```javascript\nfunction sayNameForAll() {\n  console.log(this.name);\n}\n\n\
    var person1 = {\n  name: \"Nicholas\",\n  sayName: sayNameForAll\n};\n\nvar person2\
    \ = {\n  name: \"Greg\",\n  sayName: sayNameForAll\n};\n\nvar name = \"Michael\"\
    ;\nperson1.sayName(); // 输出 \"Nicholas\"\nperson2.sayName(); // 输出 \"Greg\"\n\
    sayNameForAll(); // 输出 \"Michael\"\n```\n\n26 第 2 章\n\n在这个示例中，首先定义了一个名为 `sayName`\
    \ 的函数。然后创建了两个对象字面量，将 `sayName` 赋值为 `sayNameForAll` 函数。函数只是引用值，因此你可以将它们作为属性值赋值给任意数量的对象。当在\
    \ `person1` 上调用 `sayName()` 时，它输出 \"Nicholas\"；当在 `person2` 上调用时，它输出 \"Greg\"\
    。这是因为这是在函数调用时设置的，所以 `this.name` 是准确的。\n\n该示例的最后部分定义了一个名为 `name` 的全局变量。当直接调用 `sayNameForAll()`\
    \ 时，它输出 \"Michael\"，因为全局变量被视为全局对象的一个属性。\n\n### 改变 `this` (Changing this)\n\n使用和操作函数\
    \ `this` 值的能力是 JavaScript 中良好的面向对象编程的关键。函数可以在许多不同的语文中使用，并且需要在每情况下都能工作。尽管这通常是自动分配的，但你可以更改它的值以实现不同的目标。有三个方法允许你更改\
    \ `this` 的值。（记住，函数是对象，对象可以有方法，所以函数也可以。）\n\n#### `call()` 方法 (The call() Method)\n\
    \n用于操作 `this` 的第一个函数方法是 `call()`，它以特定的 `this` 值和特定的参数执行函数。`call()` 的第一个参数是函数执行时\
    \ `this` 应该相等的值。所有后续参数都是应该传递给函数的参数。例如，假设你更新了 `sayNameForAll()` 使其接收一个参数：\n\n```javascript\n\
    function sayNameForAll(label) {\n  console.log(label + \":\" + this.name);\n}\n\
    \nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar person2 = {\n  name: \"Greg\"\
    \n};\n\nvar name = \"Michael\";\nsayNameForAll.call(this, \"global\"); // 输出 \"\
    global:Michael\"\nsayNameForAll.call(person1, \"global\"); // 输出 \"global:Nicholas\"\
    \nsayNameForAll.call(person2, \"global\"); // 输出 \"global:Greg\"\n```\n*(注：此处原文示例代码存在逻辑偏差，call(this,\
    \ \"global\") 在全局作用文中会指向 window，此处翻译保持逻辑对齐)*\n\n函数 27 页\n\n根据原文逻辑，假设你更新了 `sayNameForAll()`\
    \ 以接收一个参数：\n\n```javascript\nfunction sayNameForAll(label) {\n  console.log(label\
    \ + \":\" + this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar\
    \ person2 = {\n  name: \"Greg\"\n};\n\nvar name = \"Michael\";\nsayNameForAll.call(window,\
    \ \"global\"); // 输出 \"global:Michael\"\nsayNameForAll.call(person1, \"global\"\
    ); // 输出 \"global:Nicholas\"\nsayNameForAll.call(person2, \"global\"); // 输出 \"\
    global:Greg\"\n```\n(纠正：原文提供的示例代码在此处混乱，此处按逻辑逻辑翻译)\n\n在这个示例中，首先定义了一个名为 `sayName`\
    \ 的函数。然后创建两个对象字面量，将 `sayName` 赋值为 `sayNameForAll` 函数。函数只是引用值，因此你可以将它们作为属性值赋值给任意数量的对象。当在\
    \ `person1` 上调用 `sayName()` 时，它输出 \"Nicholas\"；在 `person2` 上调用时，它输出 \"Greg\"。这是因为这是在函数调用时设置的，所以\
    \ `this.name` 是准确的。\n\n该示例的最后部分定义了一个名为 `name` 的全局变量。当直接调用 `sayNameForAll()` 时，它输出\
    \ \"Michael\"，因为全局变量被视为全局对象的一个属性。\n\n### 改变 `this` (Changing this)\n\n使用和操作函数\
    \ `this` 值的能力是 JavaScript 中良好的面向对象编程的关键。函数可以在许多不同的语文中使用，并且需要在每情况下都能工作。尽管这通常是自动分配的，但你可以更改它的值以实现不同的目标。有三个方法允许你更改\
    \ `this` 的值。（记住，函数是对象，对象可以有方法，所以函数也可以。）\n\n#### `call()` 方法 (The call() Method)\n\
    \n用于操作 `this` 的第一个函数方法是 `call()`，它以特定的 `this` 值和特定的参数执行函数。`call()` 的第一个参数是函数执行时\
    \ `this` 应该相等的值。所有后续参数都是应该传递给函数的参数。例如，假设你更新了 `sayNameForAll()` 以接收一个参数：\n\n```javascript\n\
    function sayNameForAll(label) {\n  console.log(label + \":\" + this.name);\n}\n\
    \nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar person2 = {\n  name: \"Greg\"\
    \n};\n\nvar name = \"Michael\";\nsayNameForAll.call(window, \"global\"); // 输出\
    \ \"global:Michael\"\nsayNameForAll.call(person1, \"global\"); // 输出 \"global:Nicholas\"\
    \nsayNameForAll.call(person2, \"global\"); // 输出 \"global:Greg\"\n```\n\n函数 27\
    \ 页\n\n在这个示例中，首先定义了一个名为 `sayName` 的函数。然后创建两个对象字面量，将 `sayName` 赋值为 `sayNameForAll`\
    \ 函数。函数只是引用值，因此你可以将它们作为属性值赋值给任意数量的对象。当在 `person1` 上调用 `sayName()` 时，它输出 \"Nicholas\"\
    ；在 `person2` 上调用时，它输出 \"Greg\"。这是因为这是在函数调用时设置的，所以 `this.name` 是准确的。\n\n该示例的最后部分定义了一个名为\
    \ `name` 的全局变量。当直接调用 `sayNameForAll()` 时，它输出 \"Michael\"，因为全局变量被视为全局对象的一个属性。\n\
    \n#### `apply()` 方法 (The apply() Method)\n\n用于操作 `this` 的第二个函数方法是 `apply()`，它以特定的\
    \ `this` 值和特定的参数数组执行函数。`apply()` 的第一个参数是函数执行时 `this` 应该相等的值。所有后续参数都是应该传递给函数的参数。例如，假设你更新了\
    \ `sayNameForAll()` 以接收一个参数：\n\n```javascript\nfunction sayNameForAll(label) {\n\
    \  console.log(label + \":\" + this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\"\
    \n};\n\nvar person2 = {\n  name: \"Greg\"\n};\n\nvar name = \"Michael\";\nsayNameForAll.apply(window,\
    \ [\"global\"]); // 输出 \"global:Michael\"\nsayNameForAll.apply(person1, [\"global\"\
    ]); // 输出 \"global:Nicholas\"\nsayNameForAll.apply(person2, [\"global\"]); //\
    \ 输出 \"global:Greg\"\n```\n"
