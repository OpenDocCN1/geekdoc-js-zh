    \n- bind() 方法，28\n- Boolean 对象，3, 15–16\n- Boolean 原始包装类型，14–15\n- 大括号 ({ }) 用于函数内容（第\
    \ 18 页）和对象属性（第 9 页）\n- 括号符号，用于属性访问，11–12\n- 内置对象原型，62–63\n- 内置类型，实例化，8–11\n\n\
