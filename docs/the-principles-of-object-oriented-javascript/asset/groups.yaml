  mdcn: "\n\n## 对象模式 **91**\n\nPerson.prototype.sayName = function() {\n  console.log(this.name);\n\
    };\n\nvar person1 = Person(\"Nicholas\"); // 注意：缺少 \"new\"\n\nconsole.log(person1\
    \ instanceof Person); // false\n\nconsole.log(typeof person1); // \"undefined\"\
    \n\nconsole.log(name); // \"Nicholas\"\n\n在这种情况下，由于在调用 Person 构造函数时没有使用 new，name\
    \ 被创建为了一个全局变量。请记住，这段代码是在非严格模式下运行的，因为在严格模式下省略 `new` 会抛出错误。\n\n构造函数以大字母开头通常表示它前面应该加上\
    \ `new`，但如果你想允许这种用法并让函数在没有 `new` 的情况下也能工作呢？许多内置构造函数（如 `Array` 和 `RegExp`）在没有 `new`\
    \ 的情况下工作，因为它们被设计为*作用安全的*（scope safe）。作用安全的构造函数可以使用或不使用 `new` 调用，并且在这种情况下都返回相同类型的对象。\n\
    \n当使用 `new` 调用函数时，该函数新创建的对象已经是该构造函数所代表的自定义类型的实例。因此，你可以使用 `instanceof` 来判断函数调用中是否使用了\
    \ `new`：\n\n```javascript\nfunction Person(name) {\n  if (this instanceof Person)\
    \ {\n    // 使用 \"new\" 调用\n  } else {\n    // 未使用 \"new\" 调用\n  }\n}\n```\n\n\
    使用这种模式可以让你根据函数是被带 `new` 还是不带调用的来控制它的行为。你可能想对每种情况采取不同的处理，但你通常希望函数的行为保持一致（通常是为了防止意外遗漏\
    \ `new`）。一个作用安全的 Person 版本看起来如下：\n\n```javascript\nfunction Person(name) {\n \
    \ if (this instanceof Person) {\n    this.name = name;\n  } else {\n    return\
    \ new Person(name);\n  }\n}\n```\n\n**92** 第 6 章\n\n对于这个构造函数，当使用 `new` 时，name\
    \ 属性像往常一样被赋值。如果没有使用 `new`，构造函数将通过 `new` 递归调用，以创建一个对象的正确实例。通过这种方式，以下代码是等价的：\n\n\
    ```javascript\nvar person1 = new Person(\"Nicholas\");\nvar person2 = Person(\"\
    Nicholas\");\n\nconsole.log(person1 instanceof Person); // true\nconsole.log(person2\
    \ instanceof Person); // true\n```\n\n在不使用 `new` 操作符的情况下创建新对象变得越来越常见，这是为了减少遗漏\
    \ `new` 导致的错误。JavaScript 本身有几种具有作用安全构造函数的引用类型，如 `Object`、`Array`、`RegExp` 和 `Error`。\n\
    \n### 总结\n\n在 JavaScript 中创建和组合对象有很多方法。虽然 JavaScript 不包含私有属性的形式概念，但你可以创建只能从对象内部访问的数据或函数。对于单例对象，你可以使用模块模式向外部世界隐藏数据。你可以使用立即执行函数表达式（IIFE）来定义只有新创建的对象可以访问的局部变量和函数。特权方法（Privileged\
    \ methods）是对象上有访问私有数据的方法。你也可以通过在构造函数中定义变量或使用 IIFE 创建所有实例共享的私有数据来创建具有私有数据的构造函数。\n\
    \n混入（Mixins）是向对象添加功能同时避免继承的一种强大方法。混入将属性从一个对象复制到另一个对象，使得接收对象在不从提供对象继承的情况下获得功能。与继承不同，混入不允许你在对象创建后识别这些功能是从哪里来的。因此，混入最适合用于数据属性或小段功能。当你想要获取更多功能并知道这些功能来源何时，继承仍然是优选。\n\
    \n作用安全的构造函数是可以带 `new` 或不带 `new` 调用来创建新对象实例的构造函数。这种模式利用了这样一个事实：一旦构造函数开始执行，它就是该自定义类型的实例，这让你能够根据是否使用了\
    \ `new` 操作符来改变构造函数的行为。\n\n**索引中**\n\n### 符号\n\n| 符号 | 页码 |\n| :--- | :--- |\n\
    | { } (大括号) | 用于函数内容（第 18 页）和对象属性（第 9 页） |\n| == (双等运算符) | 5 |\n| === (三等运算符)\
    \ | 5 |\n| [ ] (方括号) | 用于数组字面量，第 10 页；用于属性访问，第 11–12 页 |\n| [[ ]] (双方括号表示法) |\
