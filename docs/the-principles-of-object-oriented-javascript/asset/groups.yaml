  - "[PAGE 59]\n\nUnderstanding Objects   **39**\n\n***Common Attributes***\n\nThere\
    \ are two property attributes shared between data and accessor \n\nproperties.\
    \ One is \\[\\[Enumerable\\]\\], which determines whether you can \n\n­iterate\
    \ over the property. The other is \\[\\[Configurable\\]\\], which determines \n\
    \nwhether the property can be changed. You can remove a configurable \n\nproperty\
    \ using delete and can change its attributes at any time. (This also \n\nmeans\
    \ configurable properties can be changed from data to accessor \n\nproperties\
    \ and vice versa.) By default, all properties you declare on an \n\nobject are\
    \ both enumerable and configurable.\n\nIf you want to change property attributes,\
    \ you can use the Object \n\n.defineProperty() method. This method accepts three\
    \ arguments: the \n\nobject that owns the property, the property name, and a *property\
    \ descrip-*\n\n*tor* object containing the attributes to set. The descriptor has\
    \ properties \n\nwith the same name as the internal attributes but without the\
    \ square \n\nbrackets. So you use ­enumerable to set \\[\\[Enumerable\\]\\], and\
    \ configurable \n\nto set \\[\\[Configurable\\]\\]. For example, suppose you want\
    \ to make an object \n\nproperty nonenumerable and nonconfigurable:\n\nvar person1\
    \ \\= {\n\nu name: \"Nicholas\"\n\n};\n\nObject.defineProperty(person1, \"name\"\
    , {\n\nv enumerable: false\n\n});\n\nconsole.log(\"name\" in person1); // true\n\
    \nw console.log(person1.propertyIsEnumerable(\"name\")); // false\n\nvar properties\
    \ \\= Object.keys(person1);\n\nconsole.log(properties.length); // 0\n\nObject.defineProperty(person1,\
    \ \"name\", {\n\nx configurable: false\n\n});\n\n// try to delete the Property\n\
    \ndelete person1.name;\n\ny console.log(\"name\" in person1); // true\n\nconsole.log(person1.name);\
    \ // \"Nicholas\"\n\nz Object.defineProperty(person1, \"name\", { // error!!!\n\
    \n configurable: true\n\n});\n\nThe name property is defined as usual u, but it’s\
    \ then modified to set \n\nits \\[\\[Enumerable\\]\\] attribute to false v. The\
    \ ­propertyIsEnumerable() method \n\nnow returns false w because it references\
    \ the new value of \\[\\[Enumerable\\]\\]."
  - "[PAGE 60]\n\n**40**   Chapter 3\n\nAfter that, name is changed to be nonconfigurable\
    \ x. From now on, \n\nattempts to delete name fail because the property can’t\
    \ be changed, so \n\nname is still present on person1 y. Calling Object.defineProperty()\
    \ on name \n\nagain would also result in no further changes to the property. Effectively,\
    \ \n\nname is locked down as a property on person1.\n\nThe last piece of the code\
    \ tries to redefine name to be configurable \n\nonce again z. However, this throws\
    \ an error because you can’t make a \n\nnonconfigurable property configurable\
    \ again. Attempting to change a \n\ndata property into an accessor property or\
    \ vice versa should also throw \n\nan error in this case.\n\n**N O T E*** When\
    \ JavaScript is running in strict mode, attempting to delete a nonconfigurable\
    \ *\n\n*property results in an error. In nonstrict mode, the operation silently\
    \ fails.*\n\n***Data Property Attributes***\n\nData properties possess two additional\
    \ attributes that accessors do not. \n\nThe first is \\[\\[Value\\]\\], which\
    \ holds the property value. This attribute is \n\nfilled in automatically when\
    \ you create a property on an object. All prop-\n\nerty values are stored in \\\
    [\\[Value\\]\\], even if the value is a function. \n\nThe second attribute is\
    \ \\[\\[Writable\\]\\], which is a Boolean value indicat-\n\ning whether the property\
    \ can be written to. By default, all properties are \n\nwritable unless you specify\
    \ otherwise.\n\nWith these two additional attributes, you can fully define a data\
    \ prop-\n\nerty using Object.defineProperty() even if the property doesn’t already\
    \ exist. \n\nConsider this code:\n\nvar person1 \\= {\n\n name: \"Nicholas\"\n\
    \n};\n\nYou’ve seen this snippet throughout this chapter; it adds the name \n\n\
