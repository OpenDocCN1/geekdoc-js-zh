    \ property, descriptor);\n  });\n  return receiver;\n}\n\nvar person = mixin(new\
    \ EventTarget(), {\n  get name() {\n    return \"Nicholas\"\n  },\n  sayName:\
    \ function() {\n    console.log(this.name);\n    this.fire({ type: \"namesaid\"\
    , name: name });\n  }\n});\n\nconsole.log(person.name); // \"Nicholas\"\nperson.name\
    \ = \"Greg\";\nconsole.log(person.name); // \"Nicholas\"\n```\n\nThis version\
    \ of mixin() uses Object.keys() to get an array of all enumerable own properties\
    \ on supplier. The forEach() method is used to iterate over those properties.\
    \ The property descriptor for each property on supplier is retrieved and then\
    \ added to receiver via Object.defineProperty(). This ensures that all of the\
    \ relevant property information is transferred to receiver, not just the value.\
    \ That means the person object has an accessor property called name, so it cannot\
    \ be overwritten.\n\n90 Chapter 6\n\nOf course, this version of mixin() works\
    \ only in ECMAScript 5 JavaScript engines. If your code needs to work for older\
    \ engines, you should combine the two mixin() approaches into a single function:\n\
    \n```javascript\nfunction mixin(receiver, supplier) {\n  if (Object.getOwnPropertyDescriptor)\
    \ {\n    Object.keys(supplier).forEach(function(property) {\n      var descriptor\
    \ = Object.getOwnPropertyDescriptor(supplier, property);\n      Object.defineProperty(receiver,\
    \ property, descriptor);\n    });\n  } else {\n    for (var property in supplier)\
    \ {\n      if (supplier.hasOwnProperty(property)) {\n        receiver[property]\
    \ = supplier[property];\n      }\n    }\n  }\n  return receiver;\n}\n```\n\nHere,\
    \ mixin() checks whether Object.getOwnPropertyDescriptor() exists to determine\
    \ whether the JavaScript engine supports ECMAScript 5. If so, it goes on to use\
    \ the ECMAScript 5 version. Otherwise, the ECMAScript 3 version is used. This\
    \ function is safe to use in both modern and legacy JavaScript engines, as they\
    \ will apply the most appropriate mixin strategy.\n\n**NOTE*** Keep in mind that\
    \ **Object.keys()** returns only enumerable properties. If you want to also copy\
    \ over nonenumerable properties, use **Object.getOwnPropertyNames*** instead.\n\
    \n**Scope-Safe Constructors**\n\nBecause all constructors are just functions,\
    \ you can call them without using the new operator and therefore affect the value\
    \ of this. Doing so can yield unexpected results, as this ends up coerced to the\
    \ global object in nonstrict mode, or the constructor throws an error in strict\
    \ mode. In Chapter 4, you encountered this example:\n\n```javascript\nfunction\
    \ Person(name) {\n  this.name = name;\n}\n```\n"
  mdcn: "\n对象模式 85\n\n将该属性拷贝到接收者上同名的属性。请记住这是一个浅拷贝，因此如果一个属性包含一个对象，那么提供者和接收者将指向同一个对象。这种模式经常用于为已经存在的其他\
    \ JavaScript 对象添加新行为。\n\n例如，你可以通过混入（mixin）而不是继承为对象添加事件支持。首先，假设你已经定义了一个用于事件的自定义类型：\n\
