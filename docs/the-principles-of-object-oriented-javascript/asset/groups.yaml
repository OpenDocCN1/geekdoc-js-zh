    \ return true when it receives \n\na value that is a native array from any context.\
    \ If your environment is \n\nECMAScript 5 compliant, Array.isArray() is the best\
    \ way to identify arrays:\n\nvar items \\= \\[\\];\n\nconsole.log(Array.isArray(items));\
