  - "[PAGE 34]\n\n**14**   Chapter 1\n\nThe Array.isArray() method is supported in\
    \ most environments, \n\nboth in browsers and in Node.js. This method isn’t supported\
    \ in Internet \n\nExplorer 8 and earlier. \n\n**Primitive Wrapper Types**\n\n\
    Perhaps one of the most confusing parts of JavaScript is the concept of \n\n*primitive\
    \ wrapper types*. There are three primitive wrapper types (String, \n\nNumber,\
    \ and Boolean). These special reference types exist to make working \n\nwith primitive\
    \ values as easy as working with objects. (It would be very \n\nconfusing if you\
    \ had to use a different syntax or switch to a procedural \n\nstyle just to get\
    \ a substring of text.)\n\nThe primitive wrapper types are reference types that\
    \ are automati-\n\ncally created behind the scenes whenever strings, num­bers,\
    \ or Booleans \n\nare read. For example, in the first line of this listing, a\
    \ primitive string \n\nvalue is assigned to name. The second line treats name\
    \ like an object and \n\ncalls charAt(0) using dot notation.\n\nvar name \\= \"\
    Nicholas\";\n\nvar firstChar \\= name.charAt(0);\n\nconsole.log(firstChar); //\
    \ \"N\"\n\nThis is what happens behind the scenes:\n\n// what the JavaScript engine\
    \ does\n\nvar name \\= \"Nicholas\";\n\nvar temp \\= new String(name);\n\nvar\
    \ firstChar \\= temp.charAt(0);\n\ntemp \\= null;\n\nconsole.log(firstChar); //\
    \ \"N\"\n\nBecause the second line uses a string (a primitive) like an object,\
    \ \n\nthe JavaScript engine creates an instance of String so that charAt(0) will\
    \ \n\nwork. The String object exists only for one statement before it’s destroyed\
    \ \n\n(a process called *autoboxing*). To test this out, try adding a property\
    \ to a \n\nstring as if it were a regular object:\n\nvar name \\= \"Nicholas\"\
    ;\n\nname.last \\= \"Zakas\";\n\nconsole.log(name.last); // undefined\n\nThis\
    \ code attempts to add the property last to the string name. The \n\ncode itself\
    \ is just fine except that the property disappears. What happened? \n\nWhen working\
    \ with regular objects, you can add properties at any time \n\nand they stay until\
    \ you manually remove them. With primitive wrapper \n\ntypes, properties seem\
    \ to disappear because the object on which the \n\nproperty was assigned is destroyed\
    \ immediately afterward."
- md: "\nPrimitive and Reference Types **15**\n\nHere’s what’s actually happening\
    \ in the JavaScript engine:\n\n```javascript\n// what the JavaScript engine does\n\
    \nvar name = \"Nicholas\";\n\nvar temp = new String(name);\n\ntemp.last = \"Zakas\"\
    ;\n\ntemp = null; // temporary object destroyed\n\nvar temp = new String(name);\n\
    \nconsole.log(temp.last); // undefined\n\ntemp = null;\n```\n\nInstead of assigning\
    \ a new property to a string, the code actually creates a new property on a temporary\
    \ object that is then destroyed. When you try to access that property later, a\
    \ different object is temporarily created and the new property doesn’t exist there.\
    \ Although reference values are created automatically for primitive values, when\
    \ instanceof checks for these types of values the result is false:\n\n```javascript\n\
    var name = \"Nicholas\";\n\nvar count = 10;\n\nvar found = false;\n\nconsole.log(name\
    \ instanceof String); // false\nconsole.log(count instanceof Number); // false\n\
    console.log(found instanceof Boolean); // false\n```\n\nThe instanceof operator\
    \ returns false because a temporary object is created only when a value is read.\
    \ Because instanceof doesn’t actually read anything, no temporary objects are\
    \ created, and it tells us the values aren’t instances of primitive wrapper types.\
    \ You can create primitive wrapper types manually, but there are certain side\
    \ effects:\n\n```javascript\nvar name = new String(\"Nicholas\");\n\nvar count\
    \ = new Number(10);\n\nvar found = new Boolean(false);\n\nconsole.log(typeof name);\
    \ // \"object\"\nconsole.log(typeof count); // \"object\"\nconsole.log(typeof\
    \ found); // \"object\"\n```\n\nAs you can see, creating an instance of the primitive\
    \ wrapper type just creates another object, which means that typeof can’t identify\
    \ the type of data you intend to store.\n\nIn addition, you can’t use String,\
    \ Number, and Boolean objects as you would primitive values. For example, the\
    \ following code uses a Boolean object. The Boolean object is false, yet console.log(\"\
    Found\") still executes because an object is always considered true inside a conditional\
    \ statement. It doesn’t matter that the object represents false; it’s an object,\
    \ so it evaluates to true.\n\n```javascript\nvar found = new Boolean(false);\n\
    \nif (found) {\n console.log(\"Found\"); // this executes\n}\n```\n\nManually\
    \ instantiating primitive wrappers can also be confusing in other ways, so unless\
    \ you find a special case where it makes sense to do so, you should avoid it.\
    \ Most of the time, using primitive wrapper objects instead of primitives only\
    \ leads to errors.\n\n## Summary\n\nWhile JavaScript doesn’t have classes, it\
    \ does have types. Each variable or piece of data is associated with a specific\
    \ primitive or reference type. The five primitive types (strings, numbers, Booleans,\
    \ null, and undefined) represent simple values stored directly in the variable\
    \ object for a given context. You can use typeof to identify primitive types with\
    \ the exception of null, which must be compared directly against the special value\
    \ null.\n\nReference types are the closest thing to classes in JavaScript, and\
    \ objects are instances of reference types. You can create new objects using the\
    \ new operator or a reference literal. You access properties and methods primarily\
    \ using dot notation, but you can also use bracket notation. Functions are objects\
    \ in JavaScript, and you can identify them with the typeof operator. You should\
    \ use instanceof with a constructor to identify objects of any other reference\
    \ type.\n\nTo make primitives seem more like references, JavaScript has three\
    \ primitive wrapper types: String, Number, and Boolean. JavaScript creates these\
    \ objects behind the scenes so that you can treat primitives like regular objects,\
    \ but the temporary objects are destroyed as soon as the statement using them\
    \ is complete. Although you can create your own instances of primitive wrappers,\
    \ it’s best not to do that because it can be confusing.\n\n## Functions\n\nAs\
    \ discussed in Chapter 1, functions are actually objects in JavaScript. The defining\
    \ characteristic of a function—what distinguishes it from any other object—is\
    \ the presence of an *internal property* named [[Call]]. Internal properties are\
    \ not accessible via code but rather define the behavior of code as it executes.\
    \ ECMAScript defines multiple internal properties for objects in JavaScript, and\
    \ these internal properties are indicated by double-square-bracket notation.\n\
    \nThe [[Call]] property is unique to functions and indicates that the object can\
    \ be executed. Because only functions have this property, the typeof operator\
    \ is defined by ECMAScript to return \"function\" for any object with a [[Call]]\
    \ property. That led to some confusion in the past, because some browsers also\
    \ included a [[Call]] property for regular expressions, which were thus incorrectly\
    \ identified as functions. All browsers now behave the same, so typeof no longer\
    \ identifies regular expressions as functions.\n\nThis chapter discusses the various\
    \ ways that functions are defined and executed in JavaScript. Because functions\
    \ are objects, they behave differently than functions in other languages, and\
    \ this behavior is central to a good understanding of JavaScript.\n\n## Declarations\
    \ vs. Expressions\n\nThere are actually two literal forms of functions. The first\
    \ is a *function declaration*, which begins with the function keyword and includes\
    \ the name of the function immediately following it. The contents of the function\
    \ are enclosed in braces, as shown in this declaration:\n\n```javascript\nfunction\
    \ add(num1, num2) {\n  return num1 + num2;\n}\n```\n\nThe second form is a *function\
    \ expression*, which doesn’t require a name after function. These functions are\
    \ considered anonymous because the function object itself has no name. Instead,\
    \ function expressions are typically referenced via a variable or property, as\
    \ in this expression:\n\n```javascript\nvar add = function(num1, num2) {\n  return\
    \ num1 + num2;\n};\n```\n\nThis code actually assigns a function value to the\
    \ variable add. The function expression is almost identical to the function declaration\
    \ except for the missing name and the semicolon at the end. Assignment expressions\
    \ typically end with a semicolon, just as if you were assigning any other value.\n\
    \nAlthough these two forms are quite similar, they differ in a very important\
    \ way. Function declarations are *hoisted* to the top of the context (either the\
    \ function in which the declaration occurs or the global scope) when the code\
    \ is executed. That means you can actually define a function after it is used\
    \ in code without generating an error. For example:\n\n```javascript\nvar result\
    \ = add(5, 5);\n\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n```\n\n\
    This code might look like it will cause an error, but it works just fine. That’s\
    \ because the JavaScript engine hoists the function declaration to the top and\
    \ actually executes the code as if it were written like this:\n\n```javascript\n\
    // how the JavaScript engine interprets the code\n\nfunction add(num1, num2) {\n\
    \  return num1 + num2;\n}\n\nvar result = add(5, 5);\n```\n\nFunction hoisting\
    \ happens only for function declarations because the function name is known ahead\
    \ of time. Function expressions, on the other hand, cannot be hoisted because\
    \ the functions can be referenced only through a variable. So this code causes\
    \ an error:\n\n```javascript\n// error!\nvar result = add(5, 5);\n\nvar add =\
    \ function(num1, num2) {\n  return num1 + num2;\n};\n```\n\nAs long as you always\
    \ define functions before using them, you can use either function declarations\
    \ or function expressions.\n\n## Functions as Values\n\nBecause JavaScript has\
    \ first-class functions, you can use them just as you do any other objects. You\
    \ can assign them to variables, add them to objects, pass them to other functions\
    \ as arguments, and return them from functions. Basically, you can use a function\
    \ anywhere you would use any other reference value. This makes JavaScript functions\
    \ incredibly powerful. Consider the following example:\n\n```javascript\nfunction\
    \ sayHi() {\n  console.log(\"Hi!\");\n}\n\nsayHi(); // outputs \"Hi!\"\n\nvar\
    \ sayHi2 = sayHi;\n\nsayHi2(); // outputs \"Hi!\"\n```\n"
  mdcn: "\n原始类型与引用类型 **15**\n\n以下是 JavaScript 引擎中实际发生的情况：\n\n```javascript\n// JavaScript\
    \ 引擎的操作\n\nvar name = \"Nicholas\";\n\nvar temp = new String(name);\n\ntemp.last\
    \ = \"Zakas\";\n\ntemp = null; // 临时对象被销毁\n\nvar temp = new String(name);\n\n\
    console.log(temp.last); // undefined\n\ntemp = null;\n```\n\n代码并没有为字符串赋值一个新属性，而是在临时对象上创建一个新属性，然后将其将其销毁。当你之后尝试访问该属性时，会临时创建一个不同的对象，而新属性在其中并不存在。虽然原始值会自动创建引用值，但当\
    \ `instanceof` 检查这些类型的值时，结果为 `false`：\n\n```javascript\nvar name = \"Nicholas\"\
    ;\n\nvar count = 10;\n\nvar found = false;\n\nconsole.log(name instanceof String);\
    \ // false\nconsole.log(count instanceof Number); // false\nconsole.log(found\
    \ instanceof Boolean); // false\n```\n\n`instanceof` 运算符返回 `false` 是因为只有在读取值时才会创建临时对象。由于\
    \ `instanceof` 并没有实际读取任何内容，因此没有创建临时对象，它告诉我们这些值不是原始包装类型的实例。你可以手动创建原始包装类型，但会有某些副作用：\n\
    \n```javascript\nvar name = new String(\"Nicholas\");\n\nvar count = new Number(10);\n\
    \nvar found = new Boolean(false);\n\nconsole.log(typeof name); // \"object\"\n\
    console.log(typeof count); // \"object\"\nconsole.log(typeof found); // \"object\"\
    \n```\n\n如你所见，创建原始包装类型的实例只是创建了另一个对象，这意味着 `typeof` 无法识别你想要存储的数据类型。\n\n此外，你不能像使用原始值那样使用\
    \ `String`、`Number` 和 `Boolean` 对象。例如，以下代码使用了布尔对象。该布尔值为 `false`，但 `console.log(\"\
    Found\")` 仍然会执行，因为在条件语句内部，对象始终被视为 `true`。对象代表 `false` 并不重要；因为它是一个对象，所以它的求值为为 `true`。\n\
    \n```javascript\nvar found = new Boolean(false);\n\nif (found) {\n console.log(\"\
    Found\"); // 这会执行\n}\n```\n\n手动实例化原始包装器在其他方面也可能引起困惑，除非你发现某个这样做有意义的特殊情况，否则你应该避免这样做。在大多数情况下，使用原始包装对象代替原始值只会导致错误。\n\
    \n## 总结\n\n虽然 JavaScript 没有类，但它确实有类型。每个变量或数据都与特定的原始类型或引用类型相关。五种原始类型（字符串、数字、布尔值、`null`\
    \ 和 `undefined`）代表直接存储在给定上下文变量对象中的简单值。你可以使用 `typeof` 来识别原始类型，但 `null` 除外，`null`\
    \ 必须与特殊值 `null` 直接比较。\n\n引用类型是 JavaScript 中接近类的东西，对象是引用类型的实例。你可以使用 `new` 运算符或引用字面量来创建新对象。你主要通过点符号（dot\
    \ notation）访问属性和方法，但也可以使用括号符号。函数在 JavaScript 中是对象，你可以通过 `typeof` 运算符来识别它们。你应该使用\
    \ `instanceof` 配合构造函数来识别任何其他引用类型的对象。\n\n为了让原始值看起来更像引用，JavaScript 有三种原始包装类型：`String`、`Number`\
    \ 和 `Boolean`。JavaScript 在后台创建这些对象，以便你可以像普通对象一样处理原始值，但一旦使用它们的语句完成，临时对象就会被销。尽管你可以创建自己的原始包装器实例，但最好不要这样做，因为这可能会引起困惑。\n\
    \n## 函数\n\n如第 1 章所述，函数在 JavaScript 中实际上是对象。函数的定义特征——即它区别于任何其他对象的特征——是存在一个名为 [[Call]]\
    \ 的*内部属性*。内部属性无法通过代码访问，而是定义了代码执行时的行为。ECMAScript 为 JavaScript 中的对象定义了多个内部属性，这些内部属性通过双方括号表示法指示。\n\
    \n[[Call]] 属性是函数特有的，它表示该对象可以被执行。因为只有函数拥有此属性，所以 ECMAScript 定义 `typeof` 运算符对任何具有\
    \ [[Call]] 属性的对象返回 \"function\"。这在过去导致过一些困惑，因为某些浏览器也为正则表达式包含了 [[Call]] 属性，从而导致它们被错误地识别为函数。现在所有浏览器的行为都都是相同的，因此\
    \ `typeof` 不再将正则表达式识别为函数。\n\n本章讨论了在 JavaScript 中定义和执行函数的各种方式。由于函数是对象，它们的行为与其他语言中的函数不同，而这种行为对于深入理解\
    \ JavaScript 至关重要。\n\n## 声明 vs 表达式\n\n函数实际上有两种字面量形式。第一种是*函数声明*（function declaration），它以\
    \ `function` 关键字开头，并紧随其函数名。函数的内容包含在大括号中，如下声明所示：\n\n```javascript\nfunction add(num1,\
    \ num2) {\n  return num1 + num2;\n}\n```\n\n第二种形式是*函数表达式*（function expression），它在\
    \ `function` 后面不需要名称。这些函数被认为是匿名的，因为函数对象本身没有名称。相反，函数表达式通常通过变量或属性引用，如下表达式所示：\n\n\
    ```javascript\nvar add = function(num1, num2) {\n  return num1 + num2;\n};\n```\n\
    \n这段代码实际上将一个值赋值给变量 `add`。函数表达式与函数声明相同，除了缺少名称和结尾的分号。赋值表达式通常以分号结束，就像赋值任何其他值一样。\n\
    \n尽管这两种形式非常相似，但它们在一个非常重要的点上不同。函数声明会在代码执行时*提升*到上下文（即声明所在的函数或全局作用域）的顶部。这意味着你可以在代码中使用函数后再定义它而不会产生错误。例如：\n\
    \n```javascript\nvar result = add(5, 5);\n\nfunction add(num1, num2) {\n  return\
    \ num1 + num2;\n}\n```\n\n这段代码看起来会导致错误，但它运行正常。这是因为 JavaScript 引擎会将函数声明提升到顶部，并实际上按照如下方式执行代码：\n\
    \n```javascript\n// JavaScript 引擎解释代码\n\nfunction add(num1, num2) {\n  return\
    \ num1 + num2;\n}\n\nvar result = add(5, 5);\n```\n\n函数提升只发生在函数声明中，因为函数名是预先知的。函数表达式无法提升，因为函数只能通过变量引用。所以这段代码会导致错误：\n\
    \n```javascript\n// 错误！\nvar result = add(5, 5);\n\nvar add = function(num1, num2)\
    \ {\n  return num1 + num2;\n};\n```\n\n只要你在使用函数之前定义它们，就可以使用函数声明或函数表达式。\n\n## 作为值的函数\n\
    \n由于 JavaScript 支持一等函数（first-class functions），你可以像处理其他对象一样使用它们。你可以将它们赋值给变量、添加到对象中、作为参数传递给其他函数，并从函数返回。基本上，你可以在任何可以使用其他引用值的地方使用函数。这使得\
    \ JavaScript 函数变得异常强大。考虑以下示例：\n\n```javascript\nfunction sayHi() {\n  console.log(\"\
    Hi!\");\n}\n\nsayHi(); // 输出 \"Hi!\"\n\nvar sayHi2 = sayHi;\n\nsayHi2(); // 输出\
    \ \"Hi!\"\n```\n"
