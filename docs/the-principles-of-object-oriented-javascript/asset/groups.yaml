    现在，你可能会想：“没什么大不了。好几本书都包含了关于 ES5 中 JavaScript 新增内容的章节或注释。”没错，确实如此。但我认为这是迄今为止唯一一本专注于对象本质的书籍，它通过赋予
    ES5 对象在整个叙述中一等公民的地位。这本书不仅对 ES5 对象提供了一个连贯的介绍，还介绍了你在学习 ES5 中许多新特性时需要理解的 ES3 部分。


