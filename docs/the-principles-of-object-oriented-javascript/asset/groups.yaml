    \ operation specifies not just \n\nthe initial value, but also some attributes\
    \ of the property. So, in the pre­\n\nvious example, when the name and age properties\
    \ are first defined on each \n\nobject, the \\[\\[Put\\]\\] method is invoked\
    \ for each.\n\nThe result of calling \\[\\[Put\\]\\] is the creation of an *own\
    \ property* on \n\nthe object. An own property simply indicates that the specific\
