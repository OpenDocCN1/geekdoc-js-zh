    \ 并不需要用 Rectangle 对象覆盖；因为 Rectangle 构造函数没有执行任何 Square 所需的操作。事实上，唯一相关的部分是 Square.prototype\
    \ 需要某种方式链接到 Rectangle.prototype 以实现继承。这意味着你可以再次使用 Object.create() 来简化这个示例。\n\n\
    *图 5-2：**square** 和 **rect** 的原型链显示它们都继承自 **Rectangle.prototype** 和 **Object.prototype**，但只有\
    \ **square** 继承自 **Square.prototype**。*\n\n## 继承 75节\n\n```javascript\n// 继承自\
    \ Rectangle\nfunction Square(size) {\n  this.length = size;\n  this.width = size;\n\
    }\n\nSquare.prototype = Object.create(Rectangle.prototype, {\n  constructor: {\n\
    \    configurable: true,\n    enumerable: true,\n    value: Square,\n    writable:\
    \ true\n  }\n});\n\nSquare.prototype.toString = function() {\n  return \"[Square\
    \ \" + this.length + \"x\" + this.width + \"]\";\n};\n```\n\n在这个版本的代码中，Square.prototype\
    \ 被一个继承自 Rectangle.prototype 的新对象覆盖，并且 Rectangle 构造函数从未被调用。这意味着你不再需要担心在不传递参数的情况下调用构造函数会导致错误。否则，这段代码的行为与之前的代码完全相同。原型链保持完整，因此\
    \ Square 的所有实例都继承自 Rectangle.prototype，并且构造函数在同一个步骤中恢复。\n\n**注意** *始终确保在向原型添加属性**之前**覆盖它，*否则在发生覆盖时你将丢失已添加的方法。*\n\
    \n### 构造函数窃取 (Constructor Stealing)\n\n由于 JavaScript 中的继承是通过原型链完成的，因此你不需要调用对象的父类型构造函数。如果你确实想从子类型构造函数调用父类型构造函数，你需要利用\
    \ JavaScript 函数的工作方式。在第 2 章中，你学习了 `call()` 和 `apply()` 方法，它们允许使用不同的 `this` 值调用函数。这正是*构造函数窃取*的工作原理。你只需要在子类型构造函数中使用\
    \ `call()` 或 `apply()` 调用父类型构造函数，并传入新创建的对象。从效果上，你是在为自己的对象“窃取”了父类型构造函数，就像这个示例所示：\n\
    \n```javascript\nfunction Rectangle(length, width) {\n  this.length = length;\n\
    \  this.width = width;\n}\n```\n\n## 第5章 76节\n\n```javascript\nRectangle.prototype.getArea\
    \ = function() {\n  return this.length * this.width;\n};\n\nRectangle.prototype.toString\
    \ = function() {\n  return \"[Rectangle \" + this.length + \"x\" + this.width\
    \ + \"]\";\n};\n\n// 继承自 Rectangle\nfunction Square(size) {\n  Rectangle.call(this,\
    \ size, size);\n  // 可选：在此处添加新属性或覆盖现有属性\n}\n\nSquare.prototype = Object.create(Rectangle.prototype,\
    \ {\n  constructor: {\n    configurable: true,\n    enumerable: true,\n    value:\
    \ Square,\n    writable: true\n  }\n});\n\nSquare.prototype.toString = function()\
    \ {\n  return \"[Square \" + this.length + \"x\" + this.width + \"]\";\n};\n\n\
    var square = new Square(6);\nconsole.log(square.length); // 6\nconsole.log(square.width);\
    \ // 6\nconsole.log(square.getArea()); // 36\n```\n\nSquare 构造函数调用了 Rectangle\
    \ 构造函数，并传入了 `this` 以及两次 `size`（一次用于长度，一次用于宽度）。这样做在新对象上创建了 `length` 和 `width` 属性，并使它们等于\
    \ `size`。这是避免从想要继承的构造函数中重新定义属性的方法。在应用父类型构造函数之后，你可以添加新属性或覆盖现有属性。\n\n当你需要在自定义类型之间完成继承非常有用。你总是需要修改构造函数的原型，并且可能需要在子类型构造函数内部调用父类型构造函数。通常，你会修改原型来实现方法的继承，并使用构造函数窃取来处理属性。这种方法通常被称为*伪类继承\
    \ (pseudoclassical inheritance)*，因为它模拟了基于类的语言的经典继承。\n\n## 继承 77节\n\n### 访问父类型方法\n\
    \n在上在上示例中，Square 类型有它自己的 `toString()` 方法，覆盖了原型上的 `toString()`。在子类型中用新功能覆盖父类型方法是相当常见的，但如果你仍然想访问父类型方法怎么办？在其他语言中，你可能可以说\
    \ `super.toString()`，但 JavaScript 没有类似的机制。相反，你可以直接访问父类型原型上的方法，并使用 `call()` 或 `apply()`\
    \ 在子类型对象上执行该方法。例如：\n\n```javascript\nfunction Rectangle(length, width) {\n  this.length\
    \ = length;\n  this.width = width;\n}\n\nRectangle.prototype.getArea = function()\
    \ {\n  return this.length * this.width;\n};\n\nRectangle.prototype.toString =\
    \ function() {\n  return \"[Rectangle \" + this.length + \"x\" + this.width +\
    \ \"]\";\n};\n\n// 继承自 Rectangle\nfunction Square(size) {\n  Rectangle.call(this,\
    \ size, size);\n}\n\nSquare.prototype = Object.create(Rectangle.prototype, {\n\
    \  constructor: {\n    configurable: true,\n    enumerable: true,\n    value:\
    \ Square,\n    writable: true\n  }\n});\n\nSquare.prototype.toString = function()\
    \ {\n  var text = Rectangle.prototype.toString.call(this);\n  return text.replace(\"\
    Rectangle\", \"Square\");\n};\n```\n\n在这个版本的代码中，`Square.prototype.toString()`\
    \ 使用 `call()` 调用了 `Rectangle.prototype.toString()`。它只需要将 \"Rectangle\" 替换为 \"\
    Square\"。这种方法对于此类操作似乎有些繁琐，但它是访问父类型方法的唯一方法。\n\n## 第5章 78节\n\n### 总结\n\nJavaScript\
    \ 通过原型链支持继承。当一个对象的 [[Prototype]] 设置等于另一个对象时，对象之间就会创建原型链。所有通用对象都继承自 Object.prototype。如果你想创建一个继承自其他对象，可以使用\
    \ Object.create() 为新对象指定 [[Prototype]] 的值。\n\n通过在构造函数上创建原型链来实现自定义类型之间的继承。通过将构造函数的原型设置为另一个值，可以在自定义类型的实例与其他值的原型之间创建继承。该构造的所有实例共享同一个原型，因此它们都从同一个对象。这种技术对于从其他对象继承方法非常有效，但无法通过原型继承自有属性。\n\
    \n为了正确继承自有属性，你可以使用构造函数窃取，这只是使用 `call()` 或 `apply()` 调用构造函数，以便任何初始化操作都在子类型对象上完成。结合构造函数窃取和原型链是\
    \ JavaScript 中实现自定义类型之间继承的最常用方法。\n\n"
