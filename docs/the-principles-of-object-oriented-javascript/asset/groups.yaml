    \ Booleans, null, and ­undefined) \n\nrepresent simple values stored directly\
    \ in the variable object for a given \n\ncontext. You can use typeof to identify\
    \ primitive types with the exception \n\nof null, which must be compared directly\
    \ against the special value null.\n\nReference types are the closest thing to\
    \ classes in JavaScript, and \n\nobjects are instances of reference types. You\
    \ can create new objects \n\nusing the new operator or a reference literal. You\
    \ access properties and \n\nmethods primarily using dot notation, but you can\
    \ also use bracket nota-\n\ntion. Functions are objects in JavaScript, and you\
    \ can identify them with \n\nthe typeof operator. You should use instanceof with\
    \ a constructor to iden-\n\ntify objects of any other reference type.\n\nTo make\
    \ primitives seem more like references, JavaScript has three \n\nprimitive wrapper\
    \ types: String, Number, and Boolean. JavaScript creates \n\nthese objects behind\
