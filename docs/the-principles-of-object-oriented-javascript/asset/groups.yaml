  - "[PAGE 51]\n\n**3**\n\n**U n de r s ta n ding Objec t s**\n\nEven though there\
    \ are a number of built-\n\nin reference types in JavaScript, you will \n\nmost\
    \ likely create your own objects fairly \n\nfrequently. As you do so, keep in\
    \ mind that \n\nobjects in JavaScript are dynamic, meaning that \n\nthey can change\
    \ at any point during code execution. \n\nWhereas class-based languages lock down\
    \ objects \n\nbased on a class definition, JavaScript objects have \n\nno such\
    \ restrictions.\n\nA large part of JavaScript programming is managing those objects,\
    \ \n\nwhich is why understanding how objects work is key to understanding \n\n\
    JavaScript as a whole. This is discussed in more detail later in this chapter."
