    \ and all other built-\n\nin types. As a result, when you pass an array from one\
    \ frame to another, \n\ninstanceof doesn’t work because the array is actually\
    \ an instance of Array \n\nfrom a different frame.\n\nTo solve this problem, ECMAScript\
