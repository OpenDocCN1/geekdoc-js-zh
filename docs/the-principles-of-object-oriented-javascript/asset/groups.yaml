    \ instanceof Rectangle); // true\nconsole.log(rect instanceof Object); // true\n\
    console.log(square instanceof Square); // true\nconsole.log(square instanceof\
    \ Rectangle); // true\nconsole.log(square instanceof Object); // true\n\n```\n"
