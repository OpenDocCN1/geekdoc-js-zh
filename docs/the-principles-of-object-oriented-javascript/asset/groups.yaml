    \ true,\n\n writable: true\n\n});"
  - "[PAGE 61]\n\nUnderstanding Objects   **41**\n\nWhen Object.defineProperty() is\
    \ called, it first checks to see if the \n\nproperty exists. If the property doesn’t\
    \ exist, a new one is added with \n\nthe attributes specified in the descriptor.\
    \ In this case, name isn’t already \n\na property of person1, so it is created.\n\
    \nWhen you are defining a new property with Object.defineProperty(), \n\nit’s\
