    \ Determines whether an own property is \n\nenumerable\n\n**isPrototypeOf()** \
    \ Determines whether the object is the prototype of \n\nanother\n\n**valueOf()** \
    \ Returns the value representation of the object\n\n**toString()**  Returns a\
    \ string representation of the object\n\nThese five methods appear on all objects\
    \ through inheritance. The \n\nlast two are important when you need to make objects\
    \ work consistently \n\nin JavaScript, and sometimes you might want to define\
    \ them yourself."
  - "[PAGE 87]\n\nInheritance   **67**\n\n**valueOf()**\n\nThe valueOf() method gets\
    \ called whenever an operator is used on an \n\nobject. By default, valueOf()\
    \ simply returns the object instance. The \n\nprimitive wrapper types override\
    \ valueOf() so that it returns a string for \n\nString, a Boolean for Boolean,\
    \ and a number for Number. Likewise, the Date \n\nobject’s valueOf() method returns\
    \ the epoch time in milliseconds (just as \n\nDate.prototype.getTime() does).\
    \ This is what allows you to write code that \n\ncompares dates such as:\n\nvar\
    \ now \\= new Date();\n\nvar earlier \\= new Date(2010, 1, 1);\n\nu console.log(now\
    \ \\> earlier); // true\n\nIn this example, now is a Date representing the current\
    \ time, and \n\n­earlier is a fixed date in the past. When the greater-than operator\
    \ (\\>) \n\nis used u, the valueOf() method is called on both objects before the\
    \ com-\n\nparison is performed. You can even subtract one date from another and\
    \ \n\nget the difference in epoch time because of valueOf().\n\nYou can always\
    \ define your own valueOf() method if your objects are \n\nintended to be used\
    \ with operators. If you do define a valueOf() method, \n\nkeep in mind that you’re\
    \ not changing how the operator works, only what \n\nvalue is used with the operator’s\
    \ default behavior.\n\n**toString()**\n\nThe toString() method is called as a\
    \ fallback whenever valueOf() returns a \n\nreference value instead of a primitive\
    \ value. It is also implicitly called on \n\nprimitive values whenever JavaScript\
    \ is expecting a string. For example, \n\nwhen a string is used as one operand\
    \ for the plus operator, the other \n\noperand is automatically converted to a\
    \ string. If the other operand is a \n\nprimitive value, it is converted into\
    \ a string representation (for example, \n\ntrue becomes \"true\"), but if it\
    \ is a reference value, then valueOf() is called. \n\nIf valueOf() returns a reference\
    \ value, toString() is called and the returned \n\nvalue is used. For example:\n\
    \nvar book \\= {\n\n title: \"The Principles of Object-Oriented JavaScript\"\n\
    \n};\n\nvar message \\= \"Book = \" + book;\n\nconsole.log(message); // \"Book\
    \ = \\[object Object\\]\""
  - "[PAGE 88]\n\n**68**   Chapter 5\n\nThis code constructs the string by combining\
