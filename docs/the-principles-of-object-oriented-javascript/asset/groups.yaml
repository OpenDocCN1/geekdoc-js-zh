    ## Introduction **xix**


    other languages is a strong indicator that this book is for you. In particular,
    this book is aimed at three groups of readers:


    - Developers who are familiar with object-oriented programming concepts and want
    to apply them to JavaScript

    - Web application and Node.js developers trying to structure their code more effectively

    - Novice JavaScript developers trying to gain a deeper understanding of the language


    This book is not for beginners who have never written JavaScript. You will need
    a good understanding of how to write and execute JavaScript code to follow along.


    ## **Overview**


    **Chapter 1: Primitive and Reference Types** introduces the two different value
    types in JavaScript: primitive and reference. You’ll learn what distinguishes
    them from each other and how understanding their differences is important to an
    overall understanding of JavaScript.


    **Chapter 2: Functions** explains the ins and outs of functions in JavaScript.
    First-class functions are what makes JavaScript such an interesting language.


    **Chapter 3: Understanding Objects** details the makeup of objects in JavaScript.
    JavaScript objects behave differently than objects in other languages, so a deep
    understanding of how objects work is vital to mastering the language.


    **Chapter 4: Constructors and Prototypes** expands on the previous discussion
    of functions by looking more specifically at constructors. All constructors are
    functions, but they are used a little bit differently. This chapter explores the
    differences while also talking about creating your own custom types.


    **Chapter 5: Inheritance** explains how inheritance is accomplished in JavaScript.
    Though there are no classes in JavaScript, that doesn’t mean inheritance isn’t
    possible. In this chapter, you’ll learn about prototypical inheritance and how
    it differs from class-based inheritance.


    **Chapter 6: Object Patterns** walks through common object patterns. There are
    many different ways to build and compose objects in JavaScript, and this chapter
    introduces you to the most popular patterns for doing so.


    ## **Help and Support**


    If you have questions, comments, or other feedback about this book, please visit
    the mailing list at http://groups.google.com/group/zakasbooks.


    # **1 Primitive and Reference Types**


    Most developers learn object-oriented programming by working with class-based
    languages such as Java or C#. When these developers start learning JavaScript,
    they get disoriented because JavaScript has no formal support for classes. Instead
    of defining classes from the beginning, with JavaScript you can just write code
    and create data structures as you need them. Because it lacks classes, JavaScript
    also lacks class groupings such as packages. Whereas in languages like Java, package
    and class names define both the types of objects you use and the layout of files
    and folders in your project, programming in JavaScript is like starting with a
    blank slate: You can organize things any way you want. Some developers choose
    to mimic structures from other languages, while others take advantage of JavaScript’s
    flexibility to come up with something completely new. To the uninitiated, this
    freedom of choice can be overwhelming, but once you get used to it, you’ll find
    JavaScript to be an incredibly flexible language that can adapt to your preferences
    quite easily.


    To ease the transition from traditional object-oriented languages, JavaScript
    makes objects the central part of the language. Almost all data in JavaScript
    is either an object or accessed through objects. In fact, even functions (which
    languages traditionally make you jump through hoops to get references to) are
    represented as objects in JavaScript, which makes them *first-class functions*.


    Working with and understanding objects is key to understanding JavaScript as a
    whole. You can create objects at any time and add or remove properties from them
    whenever you want. In addition, JavaScript objects are extremely flexible and
    have capabilities that create unique and interesting patterns that are simply
    not possible in other languages.


    This chapter focuses on how to identify and work with the two primary JavaScript
    data types: primitive types and reference types. Though both are accessed through
    objects, they behave in different ways that are important to understand.


    ### **What Are Types?**


    Although JavaScript has no concept of classes, it still uses two kinds of *types*:
    primitive and reference. *Primitive types* are stored as simple data types. *Reference
    types* are stored as objects, which are really just references to locations in
    memory.


    The tricky thing is that JavaScript lets you treat primitive types like reference
    types in order to make the language more consistent for the developer.


    While other programming languages distinguish between primitive and reference
    types by storing primitives on the stack and references in the heap, JavaScript
    does away with this concept completely: It tracks variables for a particular scope
    with a *variable object*. Primitive values are stored directly on the variable
    object, while reference values are placed as a pointer in the variable object,
    which serves as a reference to a location in memory where the object is stored.
    However, as you’ll see later in this chapter, primitive values and reference values
    behave quite differently although they may initially seem the same.


    Of course, there are other differences between primitive and reference types.


    ### **Primitive Types**


    Primitive types represent simple pieces of data that are stored as is, such as
    true and 25. There are five primitive types in JavaScript:


    - **Boolean**: true or false

    - **Number**: Any integer or floating-point numeric value

    - **String**: A character or sequence of characters delimited by either single
    or double quotes (JavaScript has no separate character type)

    - **Null**: A primitive type that has only one value, null

    - **Undefined**: a primitive type that has only one value, undefined (undefined
    is the value assigned to a variable that is not initialized)


    The first three types (Boolean, number, and string) behave in similar ways, while
    the last two (null and undefined) work a bit differently, as will be discussed
    throughout this chapter. All primitive types have literal representations of their
    values. *Literals* represent values that aren’t stored in a variable, such as
    a hardcoded name or price. Here are some examples of each type using its literal
    form:


    ```javascript

    // strings

    var name = "Nicholas";

    var selection = "a";


    // numbers

    var count = 25;

    var cost = 1.51;


    // boolean

    var found = true;


    // null

    var object = null;


    // undefined

    var flag = undefined;

    var ref; // assigned undefined automatically

    ```


    In JavaScript, as in many other languages, a variable holding a primitive directly
    contains the primitive value (rather than a pointer to an object). When you assign
    a primitive value to a variable, the value is copied into that variable. This
    means that if you set one variable equal to another, each variable gets its own
    copy of the data. For example:


    ```javascript

    var color1 = "red";

    var color2 = color1;

    ```


    Here, color1 is assigned the value of "red". The variable color2 is then assigned
    the value color1, which stores "red" in color2. Even though color1 and color2
    contain the same value, they are separate from each other, and you can change
    the value in color1 without affecting color2. That’s because there are two different
    storage locations, one for each variable. Figure 1-1 illustrates the variable
    object for this snippet of code.


    Because each variable containing a primitive value uses its own storage space,
    changes to one variable are not reflected on the other. For example:


    ```javascript

    var color1 = "red";

    var color2 = color1;

    console.log(color1); // "red"

    console.log(color2); // "red"


    color1 = "blue";

    console.log(color1); // "blue"

    console.log(color2); // "red"

    ```


    In this code, color1 is changed to "blue" and color2 retains its original value
    of "red".


    ### ***Identifying Primitive Types***


    The best way to identify primitive types is with the typeof operator, which works
    on any variable and returns a string indicating the type of data. The typeof operator
    works well with strings, numbers, Booleans, and undefined. The following shows
    the output when using typeof on different primitive values:


    ```javascript

    console.log(typeof "Nicholas"); // "string"

    console.log(typeof 10); // "number"

    console.log(typeof 5.1); // "number"

    console.log(typeof true); // "boolean"

    console.log(typeof undefined); // "undefined"

    ```


    *Figure 1-1: Variable object*


    | Variable Object |

    | :--- |

    | color1 | "red" |

    | color2 | "red" |

