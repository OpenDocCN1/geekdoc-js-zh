    \ dot notation and \n\nbracket notation is that bracket notation allows you to\
    \ use special char-\n\nacters in property names. Developers tend to find dot notation\
    \ easier \n\nto read, so you’ll see it used more frequently than bracket notation.\n\
    \n**Identifying Reference Types**\n\nA function is the easiest reference type\
