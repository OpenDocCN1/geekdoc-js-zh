    \ // true\nconsole.log(person1.constructor === Person); // true\nconsole.log(person1.constructor\
    \ === Object); // false\nconsole.log(person2 instanceof Person); // true\nconsole.log(person2.constructor\
    \ === Person); // true\nconsole.log(person2.constructor === Object); // false\n\
    ```\n\n在这个示例中，`constructor` 属性被专门地分配在原型上。将此作为原型上的第一个属性是一个好习惯，这样你就不会忘记包含它。\n\n\
    构造函数、原型和实例之间关系中最有趣的一个方面是，实例与构造函数之间没有直接的链接。然而，实例与原型之间、原型与构造函数之间存在直接链接。图 4-3 阐了这种关系。\n\
    \n图 4-3：实例和它的构造函数通过原型链接。\n\n| Person prototype | Person.prototype constructor\
    \ |\n| :--- | :--- |\n| sayName (function) | |\n| toString (function) | |\n| person1\
    \ [[Prototype]] | \"Nicholas\" |\n| person2 [[Prototype]] | \"Greg\" |\n| name\
    \ | |\n\n### 改变原型\n\n由于特定类型的所有实例都引用一个共享的原型，你可以随时同时增强所有这些对象。记住，`[[Prototype]]`\
    \ 属性仅包含指向原型的指针，对原型的任何更改都会立即在引用它的任何实例上生效。这意味着你可以在任何时候向原型添加新成员，并让这些更改反映在现有实例上，如示例所示：\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\n\nPerson.prototype\
    \ = {\n  constructor: Person,\n  sayName: function() {\n    console.log(this.name);\n\
    \  },\n  toString: function() {\n    return \"[Person \" + this.name + \"]\";\n\
    \  }\n};\n```\n\n```javascript\nvar person1 = new Person(\"Nicholas\");\nvar person2\
    \ = new Person(\"Greg\");\n\nconsole.log(\"sayHi\" in person1); // false\nconsole.log(\"\
    sayHi\" in person2); // false\n\n// 添加一个新方法\nPerson.prototype.sayHi = function()\
    \ {\n  console.log(\"Hi\");\n};\n\nperson1.sayHi(); // 输出 \"Hi\"\nperson2.sayHi();\
    \ // 输出 \"Hi\"\n```\n\n在这段代码中，`Person` 类型最初只有两个方法：`sayName()` 和 `toString()`。创建了两个\
    \ `Person` 实例，然后向原型添加了 `sayHi()` 方法。从那时起，两个实例都可以访问 `sayHi()`。每次访问该属性时都会发生命名属性的搜索，因此这种体验是无缝的。\n\
    \n随时修改原型的能力对于密封（sealed）和冻结（frozen）对象有一些有趣的影响。当你对对象使用 `Object.seal()` 或 `Object.freeze()`\
    \ 时，你是在对象实例上操作，对原型的任何更改都会在引用它的任何实例上立即可用。这意味着你可以字面上在任何一点向原型添加新成员，并让这些更改反映在现有实例上，如下所示：\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\n\nPerson.prototype\
    \ = {\n  constructor: Person,\n  sayName: function() {\n    console.log(this.name);\n\
    \  },\n  toString: function() {\n    return \"[Person \" + this.name + \"]\";\n\
    \  }\n};\n\n```javascript\nvar person1 = new Person(\"Nicholas\");\nvar person2\
    \ = new Person(\"Greg\");\n\nObject.freeze(person1);\n\nPerson.prototype.sayHi\
    \ = function() {\n  console.log(\"Hi\");\n};\n\nperson1.sayHi(); // 输出 \"Hi\"\n\
    person2.sayHi(); // 输出 \"Hi\"\n```\n\n在这个示例中，有两个 `Person` 实例。第一个 (`person1`) 是被冻结的，而第二个\
    \ (`person2`) 是普通对象。当你向原型添加 `sayHi()` 时，两者都获得了新方法，这似乎矛盾了 `person1` 的冻结状态。`[[Prototype]]`\
    \ 属性被认为是实例自身的属性，而该值本身并没有冻结。\n\n**注意：** 在 JavaScript 开发中，你可能不会经常这样使用原型。然而，理解对象与其原型之间存在的关系是非常重要的，像这样奇怪的例子有助于理解这些概念。\n\
    \n### 内置对象原型\n\n到此时，你可能会想原型是否允许你修改 JavaScript 引擎中自带的内置对象。答案是肯定的。所有内置对象都有构造函数，因此它们拥有你可以修改的原型。例如，为所有数组添加一个新方法只需修改\
    \ `Array.prototype` 即可：\n\n```javascript\nArray.prototype.sum = function() {\n\
    \  return this.reduce(function(previous, current) {\n    return previous + current;\n\
    \  });\n};\n\nvar numbers = [1, 2, 3, 4, 5, 6];\nvar result = numbers.sum();\n\
    console.log(result); // 21\n```\n\n这个示例在 `Array.prototype` 上创建了一个 `sum()` 方法，它可以简单的累加数组中的所有项并返回结果。`numbers`\
    \ 数组通过原型自动访问该方法。在 `sum()` 内部，`this` 指向 `numbers`，它是 `Array` 的实例，因此该方法可以自由使用其他数组方法，如\
    \ `reduce()`。\n\n你可能记得字符串、数字和布尔值都有内置的原始包装类型，用于像访问对象一样访问原始值。如果你像示例中那样修改原始包装类型的原型，你实际上可以为这些原始值添加更多功能：\n\
    \n```javascript\nString.prototype.capitalize = function() {\n  return this.charAt(0).toUpperCase()\
    \ + this.substring(1);\n};\n\nvar message = \"hello world!\";\nconsole.log(message.capitalize());\
    \ // \"Hello world!\"\n```\n\n这段代码为字符串创建了一个名为 `capitalize()` 的新方法。`String` 类型是字符串的原始包装器，修改其原型意味着所有字符串都会获得这些更改。\n\
    \n"
