  - "[PAGE 36]\n\n**16**   Chapter 1\n\nvar found \\= new Boolean(false);\n\nif (found)\
    \ {\n\n console.log(\"Found\"); // this executes\n\n}\n\nManually instantiating\
    \ primitive wrappers can also be confusing in \n\nother ways, so unless you find\
