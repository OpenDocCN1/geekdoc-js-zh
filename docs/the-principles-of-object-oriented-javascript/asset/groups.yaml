    我与 Nicholas 的关系源于我作为一个 JavaScript 学生，多年来学习他的书籍、阅读他的博客文章、观看他的演讲，并关注他的 Twitter 更新。我们第一次线下见面是几年前，当时我（此处见原文）邀请他在一次
    jQuery 会议上做演讲。他为 jQuery 社区带来了一场高质量的演讲，从那时起，我们一直在互联网上进行公开和私下的交流。在这些段时间里，我愈发钦佩他，他不仅仅是
    JavaScript 社区的一位领袖和开发者。他的言语总是优雅且深思，他的举止总是友善。


    作为开发者、演讲者和作者，他的意图始终是帮助、教育和改进。当他演讲时，你应该倾听，不仅是因为他是一个 JavaScript 专家，更因为他的品质超越了他的职业地位。


    本书的标题和引言明确表达了 Nicholas 的意图：他编写此书是为了帮助具有类思维（即 C++ 或 Java）的程序员过渡到一种没有类的语言。在书中，他解释了在编写
    JavaScript 时如何实现封装、聚合、继承和多态。这是将有知识的程序员引入面向对象的 JavaScript 开发阵营的理想文本。如果你是作为另一种语言的开发者在阅读这本书，那么你将体验一本简洁且用词精妙的
