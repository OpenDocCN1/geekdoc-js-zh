- md: "\n## 74 Chapter 5\n\narguments aren’t supplied (many constructors contain initialization\
    \ logic that may require the arguments) and that the constructor isn’t altering\
    \ any sort of global state, such as keeping track of how many instances have been\
    \ created. The constructor property is restored on Square.prototype after the\
    \ original value is overwritten.\n\nAfter that, rect is created as an instance\
    \ of Rectangle, and square is created as an instance of Square. Both objects have\
    \ the getArea() method because it is inherited from Rectangle.prototype. The square\
    \ variable is considered an instance of Square as well as Rectangle and Object\
    \ because instanceof uses the prototype chain to determine the object type. See\
    \ Figure 5-2.\n\n| | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | Rectangle.prototype | [[Prototype]] | (function) | | | |\n| getArea | toString\
    \ | (function) | | | |\n| Object.prototype | [[Prototype]] | | | | |\n| square\
    \ | [[Prototype]] | | | | | |\n| Square.prototype | [[Prototype]] | 6 | | | |\n\
    | length | propertyisEnumerable | (function) | | | |\n| hasOwnProperty | (function)\
    \ | null | | | |\n| isPrototypeOf | (function) | | | | |\n| toString | (function)\
    \ | | | | |\n| valueOf | (function) | | | | |\n| width | 6 | | | | |\n| rect |\
    \ [[Prototype]] | 5 | | | |\n\nSquare.prototype doesn’t actually need to be overwritten\
    \ with a Rectangle object, though; the Rectangle constructor isn’t doing anything\
    \ that is necessary for Square. In fact, the only relevant part is that Square.prototype\
    \ needs to somehow link to Rectangle.prototype in order for inheritance to happen.\
    \ That means you can simplify this example by using Object.create() once again.\n\
    \n*Figure 5-2: The prototype chains for **square** and **rect** show that both\
    \ inherit from **Rectangle.prototype** and **Object.prototype**, but only **square**\
    \ inherits from **Square.prototype**.*\n\n## Inheritance 75\n\n```javascript\n\
    // inherits from Rectangle\nfunction Square(size) {\n  this.length = size;\n \
    \ this.width = size;\n}\n\nSquare.prototype = Object.create(Rectangle.prototype,\
    \ {\n  constructor: {\n    configurable: true,\n    enumerable: true,\n    value:\
    \ Square,\n    writable: true\n  }\n});\n\nSquare.prototype.toString = function()\
    \ {\n  return \"[Square \" + this.length + \"x\" + this.width + \"]\";\n};\n```\n\
    \nIn this version of the code, Square.prototype is overwritten with a new object\
    \ that inherits from Rectangle.prototype, and the Rectangle constructor is never\
    \ called. That means you don’t need to worry about causing an error by calling\
    \ the constructor without arguments anymore. Otherwise, this code behaves exactly\
    \ the same as the previous code. The prototype chain remains intact, so all instances\
    \ of Square inherit from Rectangle.prototype and the constructor is restored in\
    \ the same step.\n\n**NOTE** *Always make sure that you overwrite the prototype\
    \ *before* adding properties to it, *or you will lose the added methods when the\
    \ overwrite happens.*\n\n### Constructor Stealing\n\nBecause inheritance is accomplished\
    \ through prototype chains in JavaScript, you don’t need to call an object’s supertype\
    \ constructor. If you do want to call the supertype constructor from the subtype\
    \ constructor, then you need to take advantage of how JavaScript functions work.\
    \ In Chapter 2, you learned about the call() and apply() methods, which allow\
    \ functions to be called with a different this value. That’s exactly how *constructor\
    \ stealing* works. You simply call the supertype constructor from the subtype\
    \ constructor using either call() or apply() to pass in the newly created object.\
    \ In effect, you’re stealing the supertype constructor for your own object, as\
    \ in this example:\n\n```javascript\nfunction Rectangle(length, width) {\n  this.length\
    \ = length;\n  this.width = width;\n}\n```\n\n## 76 Chapter 5\n\n```javascript\n\
    Rectangle.prototype.getArea = function() {\n  return this.length * this.width;\n\
    };\n\nRectangle.prototype.toString = function() {\n  return \"[Rectangle \" +\
    \ this.length + \"x\" + this.width + \"]\";\n};\n\n// inherits from Rectangle\n\
    function Square(size) {\n  Rectangle.call(this, size, size);\n  // optional: add\
    \ new properties or override existing ones here\n}\n\nSquare.prototype = Object.create(Rectangle.prototype,\
    \ {\n  constructor: {\n    configurable: true,\n    enumerable: true,\n    value:\
    \ Square,\n    writable: true\n  }\n});\n\nSquare.prototype.toString = function()\
    \ {\n  return \"[Square \" + this.length + \"x\" + this.width + \"]\";\n};\n\n\
    var square = new Square(6);\nconsole.log(square.length); // 6\nconsole.log(square.width);\
    \ // 6\nconsole.log(square.getArea()); // 36\n```\n\nThe Square constructor calls\
    \ the Rectangle constructor and passes in this as well as size two times (once\
    \ for length and once for width). Doing so creates the length and width properties\
    \ on the new object and makes each equal to size. This is the way to avoid redefining\
    \ properties from a constructor from which you want to inherit. You can add new\
    \ properties or override existing ones after applying the supertype constructor.\n\
    \nThis two-step process is useful when you need to accomplish inheritance between\
    \ custom types. You’ll always need to modify a constructor’s prototype, and you\
    \ may also need to call the supertype constructor from within the subtype constructor.\
    \ Generally, you’ll modify the prototype for method inheritance and use constructor\
    \ stealing for properties. This approach is typically referred to as *pseudoclassical\
    \ inheritance* because it mimics classical inheritance from class-based languages.\n\
    \n## Inheritance 77\n\n### Accessing Supertype Methods\n\nIn the previous example,\
    \ the Square type has its own toString() method that shadows toString() on the\
    \ prototype. It is fairly common to override supertype methods with new functionality\
    \ in the subtype, but what if you still want to access the supertype method? In\
    \ other languages, you might be able to say super.toString(), but JavaScript doesn’t\
    \ have anything similar. Instead, you can directly access the method on the supertype’s\
    \ prototype and use either call() or apply() to execute the method on the subtype\
    \ object. For example:\n\n```javascript\nfunction Rectangle(length, width) {\n\
    \  this.length = length;\n  this.width = width;\n}\n\nRectangle.prototype.getArea\
    \ = function() {\n  return this.length * this.width;\n};\n\nRectangle.prototype.toString\
    \ = function() {\n  return \"[Rectangle \" + this.length + \"x\" + this.width\
    \ + \"]\";\n};\n\n// inherits from Rectangle\nfunction Square(size) {\n  Rectangle.call(this,\
    \ size, size);\n}\n\nSquare.prototype = Object.create(Rectangle.prototype, {\n\
    \  constructor: {\n    configurable: true,\n    enumerable: true,\n    value:\
    \ Square,\n    writable: true\n  }\n});\n\nSquare.prototype.toString = function()\
    \ {\n  var text = Rectangle.prototype.toString.call(this);\n  return text.replace(\"\
    Rectangle\", \"Square\");\n};\n```\n\nIn this version of the code, Square.prototype.toString()\
    \ calls Rectangle.prototype.toString() using call(). The method just needs to\
    \ replace \"Rectangle\" with \"Square\". This approach may seem a bit verbose\
    \ for such an operation, but it is the only way to access a supertype method.\n\
    \n## 78 Chapter 5\n\n### Summary\n\nJavaScript supports inheritance through prototype\
    \ chaining. A prototype chain is created between objects when the [[Prototype]]\
    \ of one object is set equal to another. All generic objects inherit from Object.prototype.\
    \ If you want to create an object that inherits from something else, you can use\
    \ Object.create() to specify the value of [[Prototype]] for a new object.\n\n\
    You accomplish inheritance between custom types by creating a prototype chain\
    \ on the constructor. By setting the constructor’s prototype property to another\
    \ value, you create inheritance between instances of the custom type and the prototype\
    \ of that other value. All instances of that constructor share the same prototype,\
    \ so they all inherit from the same object. This technique works very well for\
    \ inheriting methods from other objects, but you cannot inherit own properties\
    \ using prototypes.\n\nTo inherit own properties correctly, you can use constructor\
    \ stealing, which is simply calling a constructor function using call() or apply()\
    \ so that any initialization is done on the subtype object. Combining constructor\
    \ stealing and prototype chaining is the most common way to achieve inheritance\
    \ between custom types in JavaScript.\n\nYou can access methods on a supertype\
    \ by directly accessing the supertype’s prototype. In doing so, you must use call()\
    \ or apply() to execute the supertype method on the subtype object.\n"
