- md: "\n## Understanding Objects **35**\n\nIn this example, name is an own property\
    \ of person1, so both the in operator and hasOwnProperty() return true. The toString()\
    \ method, however, is a prototype property that is present on all objects. The\
    \ in operator returns true for toString(), but hasOwnProperty() returns false.\
    \ This is an important distinction that is discussed further in Chapter 4.\n\n\
    ## Removing Properties\n\nJust as properties can be added to objects at any time,\
    \ they can also be removed. Simply setting a property to null doesn’t actually\
    \ remove the property completely from the object, though. Such an operation calls\
    \ [[Set]] with a value of null, which, as you saw earlier in the chapter, only\
    \ replaces the value of the property. You need to use the delete operator to completely\
    \ remove a property from an object.\n\nThe delete operator works on a single object\
    \ property and calls an internal operation named [[Delete]]. You can think of\
    \ this operation as removing a key/value pair from a hash table. When the delete\
    \ operator is successful, it returns true. (Some properties can’t be removed,\
    \ and this is discussed in more detail later in the chapter.) For example, the\
    \ following listing shows the delete operator at work:\n\n```javascript\nvar person1\
    \ = {\n  name: \"Nicholas\"\n};\n\nconsole.log(\"name\" in person1); // true\n\
    delete person1.name; // true - not output\nconsole.log(\"name\" in person1); //\
    \ false\nconsole.log(person1.name); // undefined\n```\n\nIn this example, the\
    \ name property is deleted from person1. The in operator returns false after the\
    \ operation is complete. Also, note that attempting to access a property that\
    \ doesn’t exist will just return undefined. Figure 3-2 shows how delete affects\
    \ an object.\n\n| person1 | |\n| :--- | :--- |\n| name | \"Nicholas\" |\n| delete\
    \ person1.name; | |\n\nFigure 3-2: When you **delete** the **name** property,\
    \ it completely disappears from **person1**.*\n\n## Enumeration\n\nBy default,\
    \ all properties that you add to an object are *enumerable*, which means that\
    \ you can iterate over them using a for-in loop. Enumerable properties have their\
    \ internal [[Enumerable]] attributes set to true. The for-in loop enumerates all\
    \ enumerable properties on an object, assigning the property name to a variable.\
    \ For example, the following loop outputs the property names and values of an\
    \ object:\n\n```javascript\nvar property;\nfor (property in object) {\n  console.log(\"\
    Name: \" + property);\n  console.log(\"Value: \" + object[property]);\n}\n```\n\
    \nEach time through the for-in loop, the property variable is filled with the\
    \ next enumerable property on the object until all such properties have been used.\
    \ At that point, the loop is finished and code execution continues. This example\
    \ uses bracket notation to retrieve the value of the object property and output\
    \ it to the console, which is one of the primary use cases for bracket notation\
    \ in JavaScript.\n\nIf you just need a list of an object’s properties to use later\
    \ in your program, ECMAScript 5 introduced the Object.keys() method to retrieve\
    \ an array of enumerable property names, as shown here:\n\n```javascript\nvar\
    \ properties = Object.keys(object);\n// if you want to mimic for-in behavior\n\
    var i, len;\nfor (i=0, len=properties.length; i < len; i++){\n  console.log(\"\
    Name: \" + properties[i]);\n  console.log(\"Value: \" + object[properties[i]]);\n\
    }\n```\n\nThis example uses Object.keys() to retrieve the enumerable properties\
    \ from an object. A for loop is then used to iterate over the properties and output\
    \ the name and value. Typically, you would use Object.keys() in situations where\
    \ you want to operate on an array of property names and for-in when you don’t\
    \ need an array.\n\n**N O T E*** There is a difference between the enumerable\
    \ properties returned in a **for-in** loop and the ones returned by **Object.keys()**.\
    \ The **for-in** loop also enumerates prototype properties, while **Object.keys()**\
    \ returns only own (instance) properties. The differences between prototype and\
    \ own properties are.*\n\n## Understanding Objects **37**\n\nKeep in mind that\
    \ not all properties are enumerable. In fact, most native properties are by default.\
    \ You can check whether a property is enumerable using the propertyEnumerable()\
    \ method, which is:\n\n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n\
    };\n\nconsole.log(\"name\" in person1); // true\nvar properties = Object.keys(person1);\n\
    console.log(\"length\" in properties); // true\nconsole.log(person1.propertyEnumerable(\"\
    length\")); // false\n```\n\n## Types of Properties\n\nThere are two types of\
    \ properties: data properties and accessor properties. *Data properties* contain\
    \ a value, like the examples up to point. *Accessor properties* don’t contain\
    \ a value but instead define a function to call when the property is read (called\
    \ a *getter*), and a function to call when the property is written (called a *setter*).\
    \ Accessor properties require either a getter or a setter, though they can have\
    \ both.\n\nThere is a special syntax to define an accessor property using an object:\n\
    \n```javascript\nvar person1 = {\n  _name: \"Nicholas\",\n  get name() {\n   \
    \ console.log(\"Reading name\");\n    return this._name;\n  },\n  set name(value)\
    \ {\n    console.log(\"Setting name to\", value);\n    this._name = value;\n \
    \ }\n};\n\nconsole.log(person1.name); // \"Reading name\" then \"Nicholas\"\n\
    person1.name = \"Greg\";\nconsole.log(person1.name); // \"Setting name to Greg\"\
    \ then \"Reading name\" then \"Greg\"\n```\n\nThis example defines an accessor\
    \ property. There is a data property called _name that contains the actual value\
    \ for the property (The leading underscore is a common convention to indicate\
    \ that the property is considered private, though in reality it is still public).\
    \ Even though this example uses _name to store the data, you could just as easily\
    \ store the data in a variable or another object. This example simply adds logging\
    \ to the behavior of the property; there’s usually no reason to use accessor properties\
    \ if you are only storing the data in another property—just use the property itself.\
    \ Accessor properties are most useful when you want the assignment of a value\
    \ to trigger some sort of behavior, or when reading a value requires the calculation\
    \ of the desired return value.\n\n**ECMAScript 5 changed this by introducing several\
    \ ways of interacting with property attributes directly, as well as introducing\
    \ new attributes to support additional functionality. It’s now possible to create\
    \ properties that behave the same way as built-in JavaScript properties. This\
    \ section covers in detail the attributes of both data and accessor properties,\
    \ starting with the ones they have in common.\n"
