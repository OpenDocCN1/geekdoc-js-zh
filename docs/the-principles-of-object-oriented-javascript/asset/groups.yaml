  - "[PAGE 98]\n\n**78**   Chapter 5\n\n**Summary**\n\nJavaScript supports inheritance\
    \ through prototype chaining. A prototype \n\nchain is created between objects\
    \ when the \\[\\[Prototype\\]\\] of one object is \n\nset equal to another. All\
    \ generic objects automatically inherit from Object \n\n.prototype. If you want\
    \ to create an object that inherits from something \n\nelse, you can use Object.create()\
    \ to specify the value of \\[\\[Prototype\\]\\] for a \n\nnew object.\n\nYou accomplish\
    \ inheritance between custom types by creating a \n\nproto­type chain on the constructor.\
    \ By setting the constructor’s prototype \n\nproperty to another value, you create\
    \ inheritance between instances of \n\nthe custom type and the prototype of that\
    \ other value. All instances of \n\nthat constructor share the same proto­type,\
    \ so they all inherit from the \n\nsame object. This technique works very well\
    \ for inheriting methods from \n\nother objects, but you cannot inherit own properties\
    \ using prototypes.\n\nTo inherit own properties correctly, you can use constructor\
    \ stealing, \n\nwhich is simply calling a constructor function using call() or\
    \ apply() so \n\nthat any initialization is done on the subtype object. Combining\
    \ construc-\n\ntor stealing and prototype chaining is the most common way to achieve\
    \ \n\ninheritance between custom types in JavaScript. This combination is \n\n\
    frequently called pseudo­classical inheritance because of its similarity \n\n\
    to inheritance in class-based languages.\n\nYou can access methods on a supertype\
    \ by directly accessing the \n\nsupertype’s prototype. In doing so, you must use\
    \ call() or apply() to exe-\n\ncute the supertype method on the subtype object."
- md: "\n## 6 Object Patterns\n\nJavaScript has many patterns for creating objects,\
    \ and there’s usually more than one way to accomplish the same thing. You can\
    \ define your own custom types or your own generic objects whenever you want.\
    \ You can use inheritance to share behavior between objects, or you can employ\
    \ other techniques, such as mixins. You can also take advantage of advanced JavaScript\
    \ features to prevent an object’s structure from being modified. The patterns\
    \ discussed in this chapter give you powerful ways of managing and creating objects,\
    \ all based on your use cases.\n\n### Chapter 6: Private and Privileged Members\n\
    \nAll object properties in JavaScript are public, and there’s no explicit way\
    \ to indicate that a property shouldn’t be accessed from outside a particular\
    \ object. At some point, however, you might not want data to be public. For example,\
    \ when an object uses a value to determine some sort of state, modifying that\
    \ data without the object’s knowledge throws the state management process into\
    \ chaos. One way to avoid this is by using naming conventions. For example, it’s\
    \ quite common to prefix properties with an underscore (such as this._name) when\
    \ they are not intended to be public. However, there are ways of hiding data that\
    \ don’t rely on convention and are therefore more “bulletproof” in preventing\
    \ the modification of private information.\n\n#### The Module Pattern\n\nThe *module\
    \ pattern* is an object-creation pattern designed to create singleton objects\
    \ with private data. The basic approach is to use an *immediately invoked function\
    \ expression (IIFE)* that returns an object. An IIFE is a function expression\
    \ that is defined and then called immediately to produce a result. That function\
    \ expression can contain any number of local variables that aren’t accessible\
    \ from outside that function. Because the returned object is defined within that\
    \ function, the object’s methods have access to the data. (All objects defined\
    \ within the IIFE have access to the same local variables.) Methods that access\
    \ private data in this way are called *privileged* methods. Here’s the basic format\
    \ for the module pattern:\n\n```javascript\nvar yourObject = (function() {\n \
    \ // private data variables\n  return {\n    // public methods and properties\n\
    \  };\n}());\n```\n\nIn this pattern, an anonymous function is created and executed\
    \ immediately. (Note the extra parentheses at the end of the function. You can\
    \ execute anonymous functions immediately using this syntax.) That means the function\
    \ exists for just a moment, is executed, and then is destroyed. IIFEs are a very\
    \ popular pattern in JavaScript, partially for their use in the module pattern.\n\
    \nThe module pattern allows you to use regular variables as de facto object properties\
    \ that aren’t exposed publicly. You accomplish this by creating *closure* functions\
    \ as object methods. Closures are simply functions that access data outside their\
    \ own scope. For example, whenever you access a global object in a function, such\
    \ as window in a web browser, that function is accessing a variable outside its\
    \ own scope. The difference with the module function is that the variables are\
    \ declared within the IIFE, and a function that is also declared inside the IIFE\
    \ accesses those variables. For example:\n\n```javascript\nvar person = (function()\
    \ {\n  var age = 25;\n  return {\n    name: \"Nicholas\",\n    getAge: function()\
    \ {\n      return age;\n    },\n    growOlder: function() {\n      age++;\n  \
    \  }\n  };\n}());\n\nconsole.log(person.name); // \"Nicholas\"\nconsole.log(person.getAge());\
    \ // 25\nperson.age = 100;\nconsole.log(person.getAge()); // 25\nperson.growOlder();\n\
    console.log(person.getAge()); // 26\n```\n\nThis code creates the person object\
    \ using the module pattern. The age variable acts like a private property for\
    \ the object. It can’t be accessed directly from outside the object, but it can\
    \ be used by the object methods. There are two privileged methods on the object:\
    \ getAge(), which reads the value of the age variable, and growOlder(), which\
    \ increments age. Both of these methods can access the variable age directly because\
    \ it is defined in the outer function in which they are defined.\n\nThere is a\
    \ variation of the module pattern called the *revealing module pattern*, which\
    \ arranges all variables and methods at the top of the IIFE and simply assigns\
    \ them to the returned object. You can write the previous example using the revealing\
    \ module pattern as follows:\n\n```javascript\nvar person = (function() {\n  var\
    \ age = 25;\n  function getAge() {\n    return age;\n  }\n  function growOlder()\
    \ {\n    age++;\n  }\n  return {\n    name: \"Nicholas\",\n    getAge: getAge,\n\
    \    growOlder: growOlder\n  };\n}());\n```\n\nIn the revealing module pattern,\
    \ age, getAge(), and growOlder() are all defined as local to the IIFE. The getAge()\
    \ and growOlder() functions are then assigned to the returned object, effectively\
    \ “revealing” them outside the IIFE. This code is essentially the same as the\
    \ earlier example using the traditional module pattern; however, some prefer this\
    \ pattern because it keeps all variable and function declarations together.\n\n\
    #### Private Members for Constructors\n\nThe module pattern is great for defining\
    \ individual objects that have private properties, but what about custom types\
    \ that also require their own private properties? You can use a pattern that’s\
    \ similar to the module pattern inside the constructor to create instance-specific\
    \ private data. For example:\n\n```javascript\nfunction Person(name) {\n  // define\
    \ a variable only accessible inside of the Person constructor\n  var age = 25;\n\
    \  this.name = name;\n  this.getAge = function() {\n    return age;\n  };\n  this.growOlder\
    \ = function() {\n    age++;\n  };\n}\n\nvar person = new Person(\"Nicholas\"\
    );\nconsole.log(person.name); // \"Nicholas\"\nconsole.log(person.getAge()); //\
    \ 25\nperson.age = 100;\nconsole.log(person.getAge()); // 25\nperson.growOlder();\n\
    console.log(person.getAge()); // 26\n```\n\nIn this code, the age variable acts\
    \ like a private property for the object. It can’t be accessed directly from outside\
    \ the object, but it can be used by the object methods. There are two privileged\
    \ methods on the object: getAge(), which reads the value of the age variable,\
    \ and growOlder(), which increments age. Both of these methods can access the\
    \ variable age directly because it is defined in the outer function in which they\
    \ are defined.\n\n```javascript\nvar Person = (function() {\n  // everyone shares\
    \ the age\n  var age = 25;\n  function InnerPerson(name) {\n    this.name = name;\n\
    \  }\n  InnerPerson.prototype.getAge = function() {\n    return age;\n  };\n \
    \ InnerPerson.prototype.growOlder = function() {\n    age++;\n  };\n  return InnerPerson;\n\
    }());\n\nvar person1 = new Person(\"Nicholas\");\nvar person2 = new Person(\"\
    Greg\");\nconsole.log(person1.name); // \"Nicholas\"\nconsole.log(person1.getAge());\
    \ // 25\nconsole.log(person2.name); // \"Greg\"\nconsole.log(person2.getAge());\
    \ // 25\nperson1.growOlder();\nconsole.log(person1.getAge()); // 26\nconsole.log(person2.getAge());\
    \ // 26\n```\n\nIn this code, the InnerPerson constructor is defined inside an\
    \ IIFE. The variable age is defined outside the constructor but is used for two\
    \ prototype methods. All instances of Person end up sharing the age variable,\
    \ so changing the value with one instance automatically affects the other.\n\n\
    #### Mixins\n\nAlthough pseudoclassical inheritance and prototypal inheritance\
    \ are used frequently in JavaScript, there is also a type of pseudo-inheritance\
    \ accomplished through mixins. *Mixins* occur when one object acquires the properties\
    \ of another without modifying the prototype chain. The first object (a *receiver*)\
    \ actually receives the properties of the second object (the *supplier*) by copying\
    \ those properties directly. Traditionally, you create mixins using a function\
    \ such as this:\n\n```javascript\nfunction mixin(receiver, supplier) {\n  for\
    \ (var property in supplier) {\n    if (supplier.hasOwnProperty(property)) {\n\
    \      receiver[property] = supplier[property];\n    }\n  }\n  return receiver;\n\
    }\n```\n\nThe mixin() function accepts two arguments: the receiver and the supplier.\
    \ The goal of the function is to copy all enumerable properties from the supplier\
    \ onto the receiver. You accomplish this using a for-in loop that iterates over\
    \ the properties in supplier and then assigns the value.\n"
  mdcn: "\n\n## 6 对象模式\n\nJavaScript 有许多创建对象的模式，通常完成同一项任务有不止一种方法。你可以根据需要随时定义自己的自定义类型或泛型对象。你可以使用继承在对象之间共享行为，也可以使用其他技术，如混入（mixins）。你还可以利用高级\
    \ JavaScript 特性来防止对象的结构被修改。本章讨论的模式为你提供了管理和创建对象的强大方法，而这些方法都基于你的具体用例。\n\n### 第 6\
    \ 章：私有成员和特权成员\n\nJavaScript 中的所有对象属性都是公开的，没有显式的方法来指示某个属性不应从特定对象的外部访问。然而，在某些情况下，你可能希望数据不是公开的。例如，当一个对象使用某个值来确定某种状态时，在对象不知情的情况下修改该数据将导致状态管理过程陷入混乱。避免这种情况的一种方法是使用命名规范。例如，当属性不打算公开时，在属性名前面加上下划线前缀（例如\
    \ `this._name`）是非常常见的。但是，也有不依赖于规范的隐藏数据方法，因此在防止修改私有信息方面更加“无防弹”。\n\n#### 模块模式\n\n\
    *模块模式*（module pattern）是一种对象创建模式，旨在创建具有私有数据的单例对象。基本方法是使用一个返回对象的*立即调用函数表达式（IIFE）*。IIFE\
    \ 是一个被定义后立即调用以产生结果的函数表达式。该函数表达式可以包含任意数量的局部变量，这些变量无法从函数外部访问。由于返回的对象定义在那个函数内部，因此对象的方法可以访问这些数据。（所有在\
    \ IIFE 内定义的对象都可以访问相同的局部变量。）通过这种方式访问私有数据的方法被称为*特权*（privileged）方法。这里是模块模式的基本格式：\n\
    \n```javascript\nvar yourObject = (function() {\n  // 私有数据变量\n  return {\n   \
    \ // 公共方法和属性\n  };\n}());\n```\n\n在模式模式中，匿名函数被创建并立即执行。（注意函数末尾额外的的括号。你可以使用这种语法立即执行匿名函数。）这意味着该函数只存在片刻，执行后就会被销毁。IIFE\
    \ 是 JavaScript 中一种非常流行的模式，部分原因是由于它们在模块模式中的应用。\n\n模块模式允许你将普通变量作为实际上不公开的对象属性。你通过创建作为对象方法的*闭包*（closure）函数来实现这一点。闭包简单来说就是访问自身作用域之外数据的函数。例如，每你在函数中访问全局对象（如浏览器中的\
    \ `window`）时，该函数都会访问其作用域之外的变量。与模块函数的区别在于，变量是在 IIFE 内部声明的，同样在 IIFE 内部声明的函数访问了这些变量。例如：\n\
    \n```javascript\nvar person = (function() {\n  var age = 25;\n  return {\n   \
    \ name: \"Nicholas\",\n    getAge: function() {\n      return age;\n    },\n \
    \   growOlder: function() {\n      age++;\n    }\n  };\n}());\n\nconsole.log(person.name);\
    \ // \"Nicholas\"\nconsole.log(person.getAge()); // 25\nperson.age = 100;\nconsole.log(person.getAge());\
    \ // 25\nperson.growOlder();\nconsole.log(person.getAge()); // 26\n```\n\n这段代码使用模块模式创建了\
    \ `person` 对象。`age` 变量充当了对象的私有属性。它无法从对象外部直接访问，但可以被对象方法使用。对象上有两个特权方法：`getAge()`，用于读取\
    \ `age` 变量的值；以及 `growOlder()`，用于增加 `age`。这两个方法都可以直接访问变量 `age`，因为该变量定义在它们所在的外部函数中。\n\
    \n模块模式有一种变体，称为*揭示模块模式*（revealing module pattern），它将所有变量和方法安排在 IIFE 顶部，并简单地将它们赋值给返回的对象。你可以如下使用揭示模块模式编写之前的示例：\n\
    \n```javascript\nvar person = (function() {\n  var age = 25;\n  function getAge()\
    \ {\n    return age;\n  }\n  function growOlder() {\n    age++;\n  }\n  return\
    \ {\n    name: \"Nicholas\",\n    getAge: getAge,\n    growOlder: growOlder\n\
    \  };\n}());\n```\n\n在揭示模块模式中，`age`、`getAge()` 和 `growOlder()` 都被定义为 IIFE 的局部变量。然后将\
    \ `getAge()` 和 `growOlder()` 函数赋值给返回的对象，实际上在 IIFE 之外将它们“揭示”出来。这段代码本质上与早期使用传统模块模式的示例相同；然而，有些人更偏于这种模式，因为它将所有变量和函数声明放在一起。\n\
    \n#### 构造函数的私有成员\n\n模块模式对于定义具有私有属性的单个对象非常棒，但对于那些也需要自己的私有属性的自定义类型呢？你可以在构造函数内部使用类似于模块模式的模式来创建特定实例私有数据。例如：\n\
    \n```javascript\nfunction Person(name) {\n  // 定义一个仅在 Person 构造函数内部访问的变量\n  var\
    \ age = 25;\n  this.name = name;\n  this.getAge = function() {\n    return age;\n\
    \  };\n  this.growOlder = function() {\n    age++;\n  };\n}\n\nvar person = new\
    \ Person(\"Nicholas\");\nconsole.log(person.name); // \"Nicholas\"\nconsole.log(person.getAge());\
    \ // 25\nperson.age = 100;\nconsole.log(person.getAge()); // 25\nperson.growOlder();\n\
    console.log(person.getAge()); // 26\n```\n\n在这段代码中，`age` 变量充当了对象的私有属性。它无法从对象外部直接访问，但可以被对象方法使用。对象上有两个特权方法：`getAge()`，用于读取\
    \ `age` 变量的值；以及 `growOlder()`，用于增加 `age`。这两个方法都可以直接访问变量 `age`，因为它定义在它们所在的外部函数中。\n\
    \n```javascript\nvar Person = (function() {\n  //所有人共享 age\n  var age = 25;\n\
    \  function InnerPerson(name) {\n    this.name = name;\n  }\n  InnerPerson.prototype.getAge\
    \ = function() {\n    return age;\n  };\n  InnerPerson.prototype.growOlder = function()\
    \ {\n    age++;\n  };\n  return InnerPerson;\n}());\n\nvar person1 = new Person(\"\
    Nicholas\");\nvar person2 = new Person(\"Greg\");\nconsole.log(person1.name);\
    \ // \"Nicholas\"\nconsole.log(person1.getAge()); // 25\nconsole.log(person2.name);\
    \ // \"Greg\"\nconsole.log(person2.getAge()); // 25\nperson1.growOlder();\nconsole.log(person1.getAge());\
    \ // 26\nconsole.log(person2.getAge()); // 26\n```\n\n在这段代码中，`InnerPerson` 构造函数定义在\
    \ IIFE 内部。变量 `age` 定义在构造函数之外，但被两个原型方法使用。所有 `Person` 实例最终共享 `age` 变量，因此修改一个实例的值会自动影响另一个。\n\
    \n#### 混入（Mixins）\n\n尽管 JavaScript 中经常使用伪类继承和原型继承，但还有一种类型通过混入实现的伪继承。*混入*发生在一个对象在不修改原型链的情况下获取另一个对象的属性时。第一个对象（*接收者*）通过直接复制这些属性实际上接收第二个对象（*提供者*）的属性。传统上，你使用如下函数创建混入：\n\
    \n```javascript\nfunction mixin(receiver, supplier) {\n  for (var property in\
    \ supplier) {\n    if (supplier.hasOwnProperty(property)) {\n      receiver[property]\
    \ = supplier[property];\n    }\n  }\n  return receiver;\n}\n```\n\n`mixin()` 函数接受两个参数：接收者和提供者。该函数的目标是将提供者的所有可枚举属性复制到接收者中。你通过一个遍历提供者属性的\
    \ `for-in` 循环并进行赋值来实现这一点。\n\n"
