    \ name to %s\", value);\n\n this.\\_name \\= value;\n\n }\n\n};\n\nconsole.log(person1.name);\
    \ // \"Reading name\" then \"Nicholas\"\n\nperson1.name = \"Greg\";\n\nconsole.log(person1.name);\
    \ // \"Setting name to Greg\" then \"Greg\"\n\nThis example defines an accessor\
    \ property called name. There is a data \n\nproperty called \\_name that contains\
    \ the actual value for the property u. \n\n(The leading underscore is a common\
    \ convention to indicate that the \n\nproperty is considered to be private, though\
    \ in reality it is still public.) \n\nThe syntax used to define the getter v and\
    \ setter w for name looks a lot \n\nlike a function but without the function keyword.\
    \ The special keywords get \n\nand set are used before the accessor property name,\
    \ followed by paren-\n\ntheses and a function body. Getters are expected to return\
    \ a value, while \n\nsetters receive the value being assigned to the property\
    \ as an argument. \n\nEven though this example uses \\_name to store the property\
    \ data, you \n\ncould just as easily store the data in a variable or even in another\
    \ object. \n\nThis example simply adds logging to the behavior of the property;\
    \ there’s \n\nusually no reason to use accessor properties if you are only storing\
    \ the \n\ndata in another property—just use the property itself. Accessor properties\
    \ \n\nare most useful when you want the assignment of a value to trigger some\
    \ \n\nsort of behavior, or when reading a value requires the calculation of the\
    \ \n\ndesired return value.\n\n**N O T E*** You don’t need to define both a getter\
    \ and a setter; you can choose one or both. *\n\n*If you define only a getter,\
    \ then the property becomes read-only, and attempts to *\n\n*write to it will\
    \ fail silently in nonstrict mode and throw an error in strict mode. *\n\n*If you\
    \ define only a setter, then the property becomes write-only, and attempts to\
    \ *\n\n*read the value will fail silently in both strict and nonstrict modes.*\n\
    \n**Property Attributes**\n\nPrior to ECMAScript 5, there was no way to specify\
    \ whether a property \n\nshould be enumerable. In fact, there was no way to access\
    \ the internal \n\nattributes of a property at all. ECMAScript 5 changed this\
    \ by introduc-\n\ning several ways of interacting with property attributes directly,\
    \ as well \n\nas introducing new attributes to support additional functionality.\
    \ It’s \n\nnow possible to ­create properties that behave the same way as built-\n\
    \nin JavaScript prop­erties. This section covers in detail the attributes of \n\
    \nboth data and accessor properties, starting with the ones they have in \n\n\
    common."
- md: "\nUnderstanding Objects **39**\n\n***Common Attributes***\n\nThere are two\
    \ property attributes shared between data and accessor properties. One is [[Enumerable]],\
    \ which determines whether you can iterate over the property. The other is [[Configurable]],\
    \ which determines whether the property can be changed. You can remove a configurable\
    \ property using delete and can change its attributes at any time. (This also\
    \ means configurable properties can be changed from data to accessor properties\
    \ and vice versa.) By default, all properties you declare on an object are both\
    \ enumerable and configurable.\n\nIf you want to change property attributes, you\
    \ can use the Object.defineProperty() method. This method accepts three arguments:\
    \ the object that owns the property, the property name, and a *property descriptor*\
    \ object containing the attributes to set. The descriptor has properties with\
    \ the same name as the internal attributes but without the square brackets. So\
    \ you use `enumerable` to set [[Enumerable]], and `configurable` to set [[Configurable]].\
    \ For example, suppose you want to make an object property nonenumerable and nonconfigurable:\n\
    \n```javascript\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nObject.defineProperty(person1,\
    \ \"name\", {\n  enumerable: false\n});\n\nconsole.log(\"name\" in person1); //\
    \ true\nconsole.log(person1.propertyIsEnumerable(\"name\")); // false\n\nvar properties\
    \ = Object.keys(person1);\nconsole.log(properties.length); // 0\n\nObject.defineProperty(person1,\
    \ \"name\", {\n  configurable: false\n});\n\n// try to delete the Property\ndelete\
    \ person1.name;\nconsole.log(\"name\" in person1); // true\nconsole.log(person1.name);\
    \ // \"Nicholas\"\n\nObject.defineProperty(person1, \"name\", { // error!!!\n\
    \  configurable: true\n});\n```\n\nThe name property is defined as usual, but\
    \ it’s then modified to set its [[Enumerable]] attribute to false. The .propertyIsEnumerable()\
    \ method now returns false because it references the new value of [[Enumerable]].\n\
    \nAfter that, name is changed to be nonconfigurable. From now on, attempts to\
    \ delete name fail because the property can’t be changed, so name is still present\
    \ on person1. Calling Object.defineProperty() on name again would also result\
    \ in no further changes to the property. Effectively, name is locked down as a\
    \ property on person1.\n\nThe last piece of the code tries to redefine name to\
    \ be configurable once again. However, this throws an error because you can’t\
    \ make a nonconfigurable property configurable again. Attempting to change a data\
    \ property into an accessor property or vice versa should also throw an error\
    \ in this case.\n\n**NOTE*** When JavaScript is running in strict mode, attempting\
    \ to delete a nonconfigurable property results in an error. In nonstrict mode,\
    \ the operation silently fails.*\n\n***Data Property Attributes***\n\nData properties\
    \ possess two additional attributes that accessors do not. The first is [[Value]],\
    \ which holds the property value. This attribute is filled in automatically when\
    \ you create a property on an object. All property values are stored in [[Value]],\
    \ even if the value is a function. The second attribute is [[Writable]], which\
    \ is a Boolean value indicating whether the property can be written to. By default,\
    \ all properties are writable unless you specify otherwise.\n\nWith these two\
    \ additional attributes, you can fully define a data property using Object.defineProperty()\
    \ even if the property doesn’t already exist. Consider this code:\n\n```javascript\n\
    var person1 = {\n  name: \"Nicholas\"\n};\n```\n\nYou’ve seen this snippet throughout\
    \ this chapter; it adds the name property to person1 and sets its value. You can\
    \ achieve the same result using the following (more verbose) code:\n\n```javascript\n\
    var person1 = {};\nObject.defineProperty(person1, \"name\", {\n  value: \"Nicholas\"\
    ,\n  enumerable: true,\n  configurable: true,\n  writable: true\n});\n```\n\n\
    When Object.defineProperty() is called, it first checks to see if the property\
    \ exists. If the property doesn’t exist, a new one is added with the attributes\
    \ specified in the descriptor. In this case, name isn’t already a property of\
    \ person1, so it is created.\n\nWhen you are defining a new property with Object.defineProperty(),\
    \ it’s important to specify all of the attributes because Boolean attributes automatically\
    \ default to false otherwise. For example, the following code creates a name property\
    \ that is nonenumerable, nonconfigurable, and nonwritable because it doesn’t explicitly\
    \ make any of those attributes true in the call to Object.defineProperty().\n\n\
    ```javascript\nvar person1 = {};\nObject.defineProperty(person1, \"name\", {\n\
    \  value: \"Nicholas\"\n});\n\nconsole.log(\"name\" in person1); // true\nconsole.log(person1.propertyIsEnumerable(\"\
    name\")); // false\ndelete person1.name;\nconsole.log(\"name\" in person1); //\
    \ true\nperson1.name = \"Greg\";\nconsole.log(person1.name); // \"Nicholas\"\n\
    ```\n\nIn this code, you can’t do anything with the name property except read\
    \ the value; every other operation is locked down. If you’re changing an existing\
    \ property, keep in mind that only the attributes you specify will change.\n\n\
    **NOTE*** Nonwritable properties throw an error in strict mode when you try to\
    \ change the value. In nonstrict mode, the operation silently fails.*\n\n***Accessor\
    \ Property Attributes***\n\nAccessor properties also have two additional attributes.\
    \ Because there is no value stored for accessor properties, there is no need for\
    \ [[Value]] or [[Writable]]. Instead, accessors have [[Get]] and [[Set]], which\
    \ contain the getter and setter functions, respectively. As with the object literal\
    \ form of getters and setters, you need only define one of these attributes to\
    \ create the property.\n\n**NOTE*** If you try to create a property with both\
    \ data and accessor attributes, you will get an error.*\n\nThe advantage of using\
    \ accessor property attributes instead of object literal notation to define accessor\
    \ properties is that you can also define those properties on existing objects.\
    \ If you want to use object literal notation, you have to define accessor properties\
    \ when you create the object. As with data properties, you can also specify whether\
    \ accessor properties are configurable or enumerable. Consider this example from\
    \ earlier:\n\n```javascript\nvar person1 = {\n  _name: \"Nicholas\",\n  get name()\
    \ {\n    console.log(\"Reading name\");\n    return this._name;\n  },\n  set name(value)\
    \ {\n    console.log(\"Setting name to %s\", value);\n    this._name = value;\n\
    \  }\n};\n```\n\nThis code can also be written as follows:\n\n```javascript\n\
    var person1 = {\n  _name: \"Nicholas\"\n};\n\nObject.defineProperty(person1, \"\
    name\", {\n  get: function() {\n    console.log(\"Reading name\");\n    return\
    \ this._name;\n  },\n  set: function(value) {\n    console.log(\"Setting name\
    \ to %s\", value);\n    this._name = value;\n  },\n  enumerable: true,\n  configurable:\
    \ true\n});\n```\n\nNotice that the get and set keys on the object passed in to\
    \ Object.defineProperty() are data properties that contain a function. You can’t\
    \ use object literal accessor format here.\n\nSetting the other attributes ([[Enumerable]]\
    \ and [[Configurable]]) allows you to change how the accessor property works.\
    \ For example, you can create a nonconfigurable, nonenumerable, nonwritable property\
    \ like this:\n\n```javascript\nvar person1 = {\n  _name: \"Nicholas\"\n};\n\n\
    Object.defineProperty(person1, \"name\", {\n  get: function() {\n    console.log(\"\
    Reading name\");\n    return this._name;\n  }\n});\n\nconsole.log(\"name\" in\
    \ person1); // true\nconsole.log(person1.propertyIsEnumerable(\"name\")); // false\n\
    delete person1.name;\nconsole.log(\"name\" in person1); // true\nperson1.name\
    \ = \"Greg\";\nconsole.log(person1.name); // \"Nicholas\"\n```\n\nIn this code,\
    \ the name property is an accessor property with only a getter. There is no setter\
    \ or any other attributes to explicitly set to true, so the value can be read\
    \ but not changed.\n\n**NOTE*** As with accessor properties defined via object\
    \ literal notation, an accessor property without a setter throws an error in strict\
    \ mode when you try to change the value. In nonstrict mode, the operation silently\
    \ fails. Attempting to read an accessor property that has only a setter defined\
    \ always returns **undefined**.*\n\n***Defining Multiple Properties***\n\nIt’s\
    \ also possible to define multiple properties on an object simultaneously if you\
    \ use Object.defineProperties() instead of Object.defineProperty(). This method\
    \ accepts two arguments: the object to work on and an object containing all of\
    \ the property information. The keys of that second argument are property names,\
    \ and the values are descriptor objects defining the attributes for those properties.\
    \ For example, the following code defines two properties:\n\n```javascript\nvar\
    \ person1 = {};\nObject.defineProperties(person1, {\n  // data property to store\
    \ data\n  _name: {\n    value: \"Nicholas\",\n    enumerable: true,\n    configurable:\
    \ true,\n    writable: true\n  }\n});\n```"
  mdcn: "\n理解对象 **39**\n\n***通用属性***\n\n数据属性和访问器属性之间共享两个属性标记。一个是[[可枚举性]]（Enumerable），它决定了你是否可以遍历该属性。另一个是[[可配置性]]（Configurable），它决定了该属性是否可以被更改。你可以使用\
    \ delete 删除一个可配置的属性，并随时更改其属性。（这意味着可配置的属性可以从数据属性变为访问器属性，反之亦然）。默认情况下，你在对象上声明的所有属性都是可枚举且可配置的。\n\
    \n如果你想更改属性标记，可以使用 `Object.defineProperty()` 方法。该方法接受三个参数：拥有该属性的对象、属性名，以及一个包含要设置属性的*属性描述符*（property\
    \ descriptor）对象。描述符的属性名称与内部属性同名，但没有方括号。因此，你使用 `enumerable` 来设置[[可枚举性]]，使用 `configurable`\
    \ 来设置[[可配置性]]。例如，假设你想让对象的属性变为不可枚举且不可配置的：\n\n```javascript\nvar person1 = {\n \
    \ name: \"Nicholas\"\n};\n\nObject.defineProperty(person1, \"name\", {\n  enumerable:\
    \ false\n});\n\nconsole.log(\"name\" in person1); // true\nconsole.log(person1.propertyIsEnumerable(\"\
    name\")); // false\n\nvar properties = Object.keys(person1);\nconsole.log(properties.length);\
    \ // 0\n\nObject.defineProperty(person1, \"name\", {\n  configurable: false\n\
    });\n\n// 尝试删除属性\ndelete person1.name;\nconsole.log(\"name\" in person1); // true\n\
    console.log(person1.name); // \"Nicholas\"\n\nObject.defineProperty(person1, \"\
    name\", { // 错误！！！\n  configurable: true\n});\n```\n\nname 属性像往常一样被定义，但随后被修改以将其[[可枚举性]]属性设置为\
    \ false。现在 `.propertyIsEnumerable()` 方法返回 false，因为它引用了[[可枚举性]]的新值。\n\n此后，name\
    \ 被更改为不可配置配置的。从现在起，任何删除 name 的尝试将失败，因为该属性无法更改，所以 name 仍然存在于 person1 上。再次对 name\
    \ 调用 `Object.defineProperty()` 也会导致属性不再发生任何进一步变化。实际上，name 已作为 person1 上的属性被锁定。\n\
    \n最后一段代码尝试再次将 name 定义为可配置。然而，这将抛出一个错误，因为你不能再次让一个不可配置的属性变为可配置。在这种情况下，尝试将数据属性更改为访问器属性或反之也应该抛出错误。\n\
    \n**注意*** 当 JavaScript 在严格模式下运行时，尝试删除不可配置的属性会导致错误。在非严格模式下，该操作将静默失败。\n\n***数据属性标记***\n\
    \n数据属性拥有访问器属性不具备两个额外属性。第一个是[[值]]（Value），它存储属性值。当你在对象上创建属性时，该属性会自动填充。所有属性值都存储在[[值]]中，即使该值是一个函数。第二个属性是[[可写性]]（Writable），它是一个布尔值，指示属性是否可以写入。默认情况下，除非另有指定，所有属性都是可写的。\n\
    \n通过这两个额外属性，即使属性尚不存在，你也可以使用 `Object.defineProperty()` 完全定义一个数据属性。考虑以下代码：\n\n```javascript\n\
    var person1 = {\n  name: \"Nicholas\"\n};\n```\n\n你在整个章节中都见过这段代码片段；它为 person1\
    \ 添加了 name 属性并设置了它的值。你可以使用以下（更冗长的）代码实现相同的结果：\n\n```javascript\nvar person1 = {};\n\
    Object.defineProperty(person1, \"name\", {\n  value: \"Nicholas\",\n  enumerable:\
    \ true,\n  configurable: true,\n  writable: true\n});\n```\n\n当调用 `Object.defineProperty()`\
    \ 时，它首先检查属性是否存在。如果属性不存在，则会根据描述符中指定的属性添加一个新属性。在这种情况下，name 并不是 person1 的现有属性，因此它被创建了。\n\
    \n当你使用 `Object.defineProperty()` 定义新属性时，指定所有属性是非常重要的，因为否则布尔属性会自动默认为 false。例如，以下代码创建了一个不可枚举、不可配置且不可写的\
    \ name 属性，因为在调用 `Object.defineProperty()` 时，没有显式地将其中任何一个属性设置为 true。\n\n```javascript\n\
    var person1 = {};\nObject.defineProperty(person1, \"name\", {\n  value: \"Nicholas\"\
    \n});\n\nconsole.log(\"name\" in person1); // true\nconsole.log(person1.propertyIsEnumerable(\"\
    name\")); // false\ndelete person1.name;\nconsole.log(\"name\" in person1); //\
    \ true\nperson1.name = \"Greg\";\nconsole.log(person1.name); // \"Nicholas\"\n\
    ```\n\n在这段代码中，除了读取值外，你无法对 name 属性进行任何操作；其他所有操作都被锁定。如果你正在更改现有属性，请记住只有你指定的属性会发生。\n\
    \n**注意*** 在严格模式下，尝试更改不可写属性的值时会抛出错误。在非严格模式下，该操作将静默失败。\n\n***访问器属性标记***\n\n访问器属性也有两个额外属性。由于访问器属性不存储值，因此不需要[[值]]或[[可写性]]。相反，访问器具有[[get]]（Get）和[[set]]（Set），它们分别包含\
    \ getter 和 setter 函数。与 getter 和 setter 的对象字面量形式一样，你只需要定义这些属性之一即可创建属性。\n\n**注意***\
    \ 如果你尝试创建一个同时具有数据和访问器属性的属性，将得到一个错误。\n\n使用访问器属性而不是对象字面量符号来定义访问器属性的优势在于，你可以在现有对象上定义这些属性。如果你想使用对象字面量符号，需要在创建对象时定义访问器属性。与数据属性一样，你也可以指定访问器属性是否可配置或可枚举。考虑之前的示例：\n\
    \n```javascript\nvar person1 = {\n  _name: \"Nicholas\",\n  get name() {\n   \
    \ console.log(\"Reading name\");\n    return this._name;\n  },\n  set name(value)\
    \ {\n    console.log(\"Setting name to %s\", value);\n    this._name = value;\n\
    \  }\n};\n```\n\n这段代码也可以写成：\n\n```javascript\nvar person1 = {\n  _name: \"Nicholas\"\
    \n};\n\nObject.defineProperty(person1, \"name\", {\n  get: function() {\n    console.log(\"\
    Reading name\");\n    return this._name;\n  },\n  set: function(value) {\n   \
    \ console.log(\"Setting name to %s\", value);\n    this._name = value;\n  },\n\
    \  enumerable: true,\n  configurable: true\n});\n```\n\n注意传递给 `Object.defineProperty()`\
    \ 的对象上的 `get` 和 `set` 键是包含函数的属性属性。在这里你可以使用对象字面量格式。\n\n设置其他属性（[[可枚举性]]和[[可配置性]]）允许你更改访问器属性的工作方式。例如，你可以这样创建一个不可配置、不可枚举且不可写的属性：\n\
    \n```javascript\nvar person1 = {\n  _name: \"Nicholas\"\n};\n\nObject.defineProperty(person1,\
    \ \"name\", {\n  get: function() {\n    console.log(\"Reading name\");\n    return\
    \ this._name;\n  }\n});\n\nconsole.log(\"name\" in person1); // true\nconsole.log(person1.propertyIsEnumerable(\"\
    name\")); // false\ndelete person1.name;\nconsole.log(\"name\" in person1); //\
    \ true\nperson1.name = \"Greg\";\nconsole.log(person1.name); // \"Nicholas\"\n\
    ```\n\n在这段代码中，name 属性是一个只有一个 getter 的访问器属性。没有 setter 或任何显式设置为 true 的其他属性，因此值可以读取但不能更改。\n\
    \n**注意*** 与通过对象字面量定义的访问器属性一样，没有 setter 的访问器属性在尝试更改值时会在严格模式下抛出错误。在非严格模式下，该操作将静默失败。尝试读取仅定义了\
    \ setter 的访问器属性始终返回 **undefined**。\n\n***定义多个属性***\n\n如果你使用 `Object.defineProperties()`\
    \ 代替 `Object.defineProperty()`，则也可以同时在对象上定义多个属性。该方法接受两个参数：要处理的对象和一个包含所有属性信息的对象。第二个参数的键是属性名，值是定义这些属性标记的描述符对象。例如，以下代码定义了两个属性：\n\
    \n```javascript\nvar person1 = {};\nObject.defineProperties(person1, {\n  // 存储数据的属性\n\
    \  _name: {\n    value: \"Nicholas\",\n    enumerable: true,\n    configurable:\
    \ true,\n    writable: true\n  }\n});\n```\n"
