  - "[PAGE 83]\n\nConstructors and Prototypes   **63**\n\n**N O T E*** While it may\
    \ be fun and interesting to modify built-in objects to experiment with *\n\n*functionality,\
    \ it’s not a good idea to do so in a production environment. Developers *\n\n\
    *expect built-in objects to behave a certain way and have certain ­methods. Deliberately\
    \ *\n\n*altering built-in objects violates those expectations and makes other\
    \ developers *\n\n*unsure how the objects should work. *\n\n**Summary**\n\nConstructors\
    \ are just normal functions that are called with the new oper­\n\nator. You can\
    \ define your own constructors anytime you want to create \n\nmultiple objects\
    \ with the same properties. You can identify objects created \n\nfrom constructors\
    \ using instanceof or by accessing their constructor prop-\n\nerty directly.\n\
    \nEvery function has a prototype property that defines any properties \n\nshared\
    \ by objects created with a particular constructor. Shared methods \n\nand primitive\
    \ value properties are typically defined on prototypes, while \n\nall other properties\
    \ are defined within the constructor. The constructor \n\nproperty is actually\
    \ defined on the prototype because it is shared among \n\nobject instances.\n\n\
    The prototype of an object is stored internally in the \\[\\[Prototype\\]\\] \n\
    \nproperty. This property is a reference, not a copy. If you change the \n\nproto­type\
    \ at any point in time, those changes will occur on all instances \n\nbecause\
    \ of the way JavaScript looks up properties. When you try to access \n\na property\
    \ on an object, that object is searched for any own property with \n\nthe name\
    \ you specify. If an own property is not found, the prototype is \n\nsearched.\
    \ This searching mechanism means the prototype can continue \n\nto change, and\
    \ object instances referencing that prototype will reflect \n\nthose changes immediately.\n\
    \nBuilt-in objects also have prototypes that can be modified. While it’s \n\n\
    not recommended to do this in production, it can be helpful for experi-\n\nmentation\
    \ and proofs of concept for new functionality."
