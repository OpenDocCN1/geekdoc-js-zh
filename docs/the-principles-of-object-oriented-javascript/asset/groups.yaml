    \ // \"pizza,quinoa\"\n\nconsole.log(person2.favorites); // \"pizza,quinoa\"\n\
    ```\n\n`favorites` 属性定义在原型上，这意味着 `person1.favorites` 和 `person2.favorites` 指向*同一个数组*。你添加到任何一个人的\
    \ favorites 中的任何值都将成为该原型上该数组的元素。这可能不是你实际想要的行为，因此在原型上定义内容时，需要非常小心。\n\n尽管你可以逐个向原型上添加属性，但许多开发人员使用一种更简洁的模式，即用对象字面量替换原型：\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\n\nPerson.prototype\
    \ = {\n  sayName: function() {\n    console.log(this.name);\n  },\n  toString:\
    \ function() {\n    return \"[Person \" + this.name + \"]\";\n  }\n};\n```\n\n\
    这段代码在原型上定义了两个方法：`sayName()` 和 `toString()`。这种模式变得非常流行，因为它消除了多次输入 `Person.prototype`\
    \ 的需要。然而有一个需要注意的副作用：\n\n```javascript\nvar person1 = new Person(\"Nicholas\");\n\
    \nconsole.log(person1 instanceof Person); // true\nconsole.log(person1.constructor\
    \ === Person); // false\nconsole.log(person1.constructor === Object); // true\n\
    ```\n\n### 构造函数与原型\n\n使用对象字面量符号覆盖原型改变了 `constructor` 属性，使其现在指向 `Object` 而不是 `Person`。这种发生是因为\
    \ `constructor` 属性存在于原型上，而不是对象实例上。当创建一个函数时，它的 `prototype` 属性会被创建，并且其 `constructor`\
    \ 属性等于该函数。这种模式完全覆盖了原型对象，这意味着 `constructor` 将来自赋值给 `Person.prototype` 的新创建（通用）对象。为了避免这种情况，在覆盖原型时将\
    \ `constructor` 恢复为正确的值：\n\n```javascript\nfunction Person(name) {\n  this.name\
    \ = name;\n}\n\nPerson.prototype = {\n  constructor: Person,\n  sayName: function()\
    \ {\n    console.log(this.name);\n  },\n  toString: function() {\n    return \"\
