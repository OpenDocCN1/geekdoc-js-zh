  - "[PAGE 68]\n\n**48**   Chapter 3\n\n**Summary**\n\nIt helps to think of JavaScript\
    \ objects as hash maps where properties are \n\njust key/value pairs. You access\
    \ object properties using either dot notation \n\nor bracket notation with a string\
    \ identifier. You can add a property at any \n\ntime by assigning a value to it,\
    \ and you can remove a property at any time \n\nwith the delete operator. You\
    \ can always check whether a property exists \n\nby using the in operator on a\
    \ property name and object. If the property \n\nin question is an own property,\
    \ you could also use ­hasOwnProperty(), which \n\nexists on every object. All\
    \ object properties are enumerable by default, \n\nwhich means that they will\
    \ appear in a for-in loop or be retrieved by \n\nObject.keys().\n\nThere are two\
    \ types of properties: data properties and accessor \n\n­properties. Data properties\
    \ are placeholders for values, and you can \n\nread from and write to them. When\
    \ a data property holds a function \n\nvalue, the property is considered a method\
    \ of the object. Unlike data \n\nproperties, accessor properties don’t store values\
    \ on their own; they use \n\na combination of getters and setters to perform specific\
    \ actions. You can \n\ncreate both data properties and accessor properties directly\
    \ using object \n\nliteral notation.\n\nAll properties have several associated\
    \ attributes. These attributes \n\ndefine how the properties work. Both data and\
    \ accessor properties \n\nhave \\[\\[Enumerable\\]\\] and \\[\\[Configurable\\\
    ]\\] attributes. Data properties \n\nalso have \\[\\[Writable\\]\\] and \\[\\\
    [Value\\]\\] attributes, while accessor proper-\n\nties have \\[\\[Get\\]\\] and\
    \ \\[\\[Set\\]\\] attributes. By default, \\[\\[Enumerable\\]\\] and \n\n\\[\\\
    [Configurable\\]\\] are set to true for all properties, and \\[\\[Writable\\]\\\
    ] is set \n\nto true for data properties. You can change these attributes by using\
    \ \n\nObject.­defineProperty() or Object.defineProperties(). It’s also possible\
    \ to \n\nretrieve these attributes by using Object.getOwnPropertyDescriptor().\n\
    \nWhen you want to lock down an object’s properties in some way, \n\nthere are\
    \ three different ways to do so. If you use Object.preventExtensions(), \n\nobjects\
    \ will no longer allow properties to be added. You could also create a \n\nsealed\
    \ object with the Object.seal() method, which makes that object non-\n\nextensible\
    \ and makes its properties nonconfigurable. The Object.freeze() \n\nmethod creates\
    \ a frozen object, which is a sealed object with nonwritable \n\ndata properties.\
    \ Be careful with nonextensible objects, and always use strict \n\nmode so that\
    \ attempts to access the objects ­incorrectly will throw an error."
