    \ `hasOwnProperty()` 返回 `false`。这是一个重要的区别，将在第 4 章中进一步讨论。\n\n## 移除属性\n\n正如属性可以随时添加到对象一样，它们也可以被移除。尽管如此，简单地将属性设置为\
