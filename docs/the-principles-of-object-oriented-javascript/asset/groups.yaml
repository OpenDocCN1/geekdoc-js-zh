  - "[PAGE 85]\n\n**5**\n\n**In h e r i ta nce**\n\nLearning how to create objects\
    \ is the first \n\nstep to understanding object-oriented pro-\n\ngramming. The second\
    \ step is to understand \n\n­inheritance. In traditional object-oriented lan-\n\
    \nguages, classes inherit properties from other classes.\n\nIn JavaScript, however,\
    \ inheritance can occur between objects with no \n\nclasslike structure defining\
    \ the rela­tionship. The mechanism for this \n\ninheritance is one with which you\
    \ are already familiar: prototypes.\n\n**Prototype Chaining and Object.prototype**\n\
    \nJavaScript’s built-in approach for inheritance is called *prototype chaining*,\
    \ \n\nor *prototypal inheritance*. As you learned in Chapter 4, prototype properties\
    \ \n\nare automatically available on object instances, which is a form of inheri-\n\
    \ntance. The object instances inherit properties from the prototype. Because"
  - "[PAGE 86]\n\n**66**   Chapter 5\n\nthe prototype is also an object, it has its\
    \ own prototype and inherits proper-\n\nties from that. This is the *prototype\
    \ chain*: An object inherits from its proto-\n\ntype, while that prototype in\
    \ turn inherits from its prototype, and so on.\n\nAll objects, including those\
    \ you define yourself, automatically inherit \n\nfrom Object unless you specify\
    \ otherwise (discussed later in this chapter). \n\nMore specifically, all objects\
