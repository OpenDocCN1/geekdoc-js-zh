    \ necessary to \n\ncheck whether a property exists in the object. New JavaScript\
    \ developers \n\noften incorrectly use patterns like the following to detect whether\
    \ a prop-\n\nerty exists:\n\n// unreliable\n\nif (person1.age) {\n\n // do something\
    \ with age\n\n}\n\nThe problem with this pattern is how JavaScript’s type coercion\
    \ affects \n\nthe outcome. The if condition evaluates to true if the value is\
    \ *truthy* (an \n\nobject, a nonempty string, a nonzero number, or true) and evaluates\
    \ to \n\nfalse if the value is *falsy* (null, undefined, 0, false, NaN, or an\
    \ empty string). \n\nBecause an object property can contain one of these falsy\
