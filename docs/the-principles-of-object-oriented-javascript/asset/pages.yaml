  md: "**66**   Chapter 5\n\nthe prototype is also an object, it has its own prototype\
    \ and inherits proper-\n\nties from that. This is the *prototype chain*: An object\
    \ inherits from its proto-\n\ntype, while that prototype in turn inherits from\
    \ its prototype, and so on.\n\nAll objects, including those you define yourself,\
    \ automatically inherit \n\nfrom Object unless you specify otherwise (discussed\
    \ later in this chapter). \n\nMore specifically, all objects inherit from Object.prototype.\
    \ Any object \n\ndefined via an object literal has its \\[\\[Prototype\\]\\] set\
    \ to Object.prototype, \n\nmeaning that it inherits properties from Object.prototype,\
    \ just like book in \n\nthis example:\n\nvar book \\= {\n\n title: \"The Principles\
    \ of Object-Oriented JavaScript\"\n\n};\n\nvar prototype \\= Object.getPrototypeOf(book);\n\
    \nconsole.log(prototype \\=== Object.prototype); // true\n\nHere, book has a prototype\
    \ equal to Object.prototype. No additional \n\ncode was necessary to make this\
    \ happen, as this is the default behavior \n\nwhen new objects are created. This\
    \ rela­tionship means that book auto­\n\nmatically receives methods from Object.prototype.\n\
    \n***Methods Inherited from Object.prototype***\n\nSeveral of the methods used\
    \ in the past couple of chapters are actu-\n\nally defined on Object.prototype\
    \ and are therefore inherited by all other \n\nobjects. Those methods are:\n\n\
    **hasOwnProperty()**  Determines whether an own property with the \n\ngiven name\
    \ exists\n\n**propertyIsEnumerable()**  Determines whether an own property is\
    \ \n\nenumerable\n\n**isPrototypeOf()**  Determines whether the object is the\
    \ prototype of \n\nanother\n\n**valueOf()**  Returns the value representation\
    \ of the object\n\n**toString()**  Returns a string representation of the object\n\
    \nThese five methods appear on all objects through inheritance. The \n\nlast two\
    \ are important when you need to make objects work consistently \n\nin JavaScript,\
    \ and sometimes you might want to define them yourself."
