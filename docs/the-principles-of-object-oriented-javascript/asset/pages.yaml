    \ for Object.prototype. Take a look at what can happen:\n\nObject.prototype.add\
    \ \\= function(value) {\n\n return this + value;\n\n};\n\nvar book \\= {\n\n title:\
    \ \"The Principles of Object-Oriented JavaScript\"\n\n};\n\nconsole.log(book.add(5));\
    \ // \"\\[object Object\\]5\"\n\nconsole.log(\"title\".add(\"end\")); // \"titleend\"\
    \n\n// in a web browser\n\nconsole.log(document.add(true)); // \"\\[object HTMLDocument\\\
    ]true\"\n\nconsole.log(window.add(5)); // \"\\[object Window\\]true\""
