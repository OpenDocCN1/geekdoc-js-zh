  md: "Functions   **23**\n\n**Overloading**\n\nMost object-oriented languages support\
    \ *function overloading*, which is the \n\nability of a single function to have\
    \ multiple *signatures*. A function signature \n\nis made up of the function name\
    \ plus the number and type of parameters \n\nthe function expects. Thus, a single\
    \ function can have one signature that \n\naccepts a single string argument and\
    \ another that accepts two numeric \n\narguments. The language determines which\
    \ version of a function to call \n\nbased on the arguments that are passed in.\n\
    \nAs mentioned previously, JavaScript functions can accept any number \n\nof parameters,\
    \ and the types of parameters a function takes aren’t speci-\n\nfied at all. That\
    \ means JavaScript functions don’t actually have signatures. \n\nA lack of function\
    \ signatures also means a lack of function overloading. \n\nLook at what happens\
    \ when you try to declare two functions with the \n\nsame name:\n\nfunction sayMessage(message)\
    \ {\n\n console.log(message);\n\n}\n\nfunction sayMessage() {\n\n console.log(\"\
    Default message\");\n\n}\n\nsayMessage(\"Hello!\"); // outputs \"Default message\"\
    \n\nIf this were another language, the output of sayMessage(\"Hello!\") would\
    \ \n\nlikely be \"Hello!\". In JavaScript, however, when you define multiple func-\n\
    \ntions with the same name, the one that appears last in your code wins. \n\n\
    The earlier function declarations are completely removed, and the last \n\nis\
    \ the one that is used. Once again, it helps to think about this situation \n\n\
    using objects:\n\nvar sayMessage \\= new Function(\"message\", \"console.log(message);\"\
    );\n\nsayMessage \\= new Function(\"console.log(\\\\\"Default message\\\\\");\"\
    );\n\nsayMessage(\"Hello!\"); // outputs \"Default message\"\n\nLooking at the\
    \ code this way makes it clear why the previous code \n\ndidn’t work. A function\
    \ object is being assigned to ­sayMessage twice in a \n\nrow, so it makes sense\
    \ that the first function object would be lost."
