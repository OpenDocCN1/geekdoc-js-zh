  md: "**90**   Chapter 6\n\nOf course, this version of mixin() works only in ECMAScript\
    \ 5 \n\nJavaScript engines. If your code needs to work for older engines, you\
    \ \n\nshould combine the two mixin() approaches into a single function:\n\nfunction\
    \ mixin(receiver, supplier) {\n\nu if (Object.getOwnPropertyDescriptor) {\n\n\
    \ Object.keys(supplier).forEach(function(property) {\n\n var descriptor \\= Object.getOwnPropertyDescriptor(supplier,\
    \ property);\n\n Object.defineProperty(receiver, property, descriptor);\n\n });\n\
    \n } else {\n\nv for (var property in supplier) {\n\n if (supplier.hasOwnProperty(property))\
    \ {\n\n receiver\\[property\\] \\= supplier\\[property\\]\n\n }\n\n }\n\n }\n\n\
    \ return receiver;\n\n}\n\nHere, mixin() checks whether Object.getOwnPropertyDescriptor() u\
    \ exists \n\nto determine whether the JavaScript engine supports ECMA­Script 5.\
    \ If so, \n\nit goes on to use the ECMAScript 5 version. Otherwise, the ECMA­Script\
    \ 3 \n\nversion is used v. This function is safe to use in both modern and legacy\
    \ \n\nJavaScript engines, as they will apply the most appropriate mixin strategy.\n\
    \n**N O T E*** Keep in mind that **Object.keys()** returns only enumerable properties.\
    \ If you want *\n\n*to also copy over nonenumerable properties, use **Object.getOwnPropertyNames()*\n\
    \n*instead.*\n\n**Scope-Safe Constructors**\n\nBecause all constructors are just\
    \ functions, you can call them without \n\nusing the new operator and therefore\
    \ affect the value of this. Doing so \n\ncan yield unexpected results, as this\
    \ ends up coerced to the global object \n\nin nonstrict mode, or the constructor\
    \ throws an error in strict mode. In \n\nChap­ter 4, you encountered this example:\n\
    \nfunction Person(name) {\n\n this.name \\= name;\n\n}"
