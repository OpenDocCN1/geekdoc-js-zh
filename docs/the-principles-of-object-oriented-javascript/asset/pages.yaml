    _name \\= value;\n\n },\n\n enumerable: true,\n\n configurable: true\n\n }\n\n\
    });\n\nThis example defines \\_name as a data property to contain informa-\n\n\
    tion u and name as an accessor property v. You can define any number \n\nof properties\
    \ using Object.­defineProperties(); you can even change existing \n\nproperties\
    \ and create new ones at the same time. The effect is the same \n\nas calling\
    \ Object.­defineProperty() multiple times.\n\n***Retrieving Property Attributes***\n\
    \nIf you need to fetch property attributes, you can do so in Java­Script by \n\
    \nusing Object.getOwnPropertyDescriptor(). As the name suggests, this method \n\
    \nworks only on own properties. This method accepts two arguments: the \n\nobject\
