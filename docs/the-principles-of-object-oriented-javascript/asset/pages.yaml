  md: "Primitive and Reference Types   **11**\n\nis no good way to debug functions\
    \ that are created in the constructor \n\nform: These functions aren’t recognized\
    \ by JavaScript debuggers and \n\ntherefore act as a black box in your application.\
    \ \n\n***Regular Expression Literals***\n\nJavaScript also has *regular expression\
    \ literals* that allow you to define regu-\n\nlar expressions without using the\
    \ RegExp constructor. Regular expression \n\nliterals look very similar to regular\
    \ expressions in Perl: The pattern is con-\n\ntained between two slashes, and\
    \ any additional options are single charac-\n\nters following the second slash.\
    \ For example:\n\nvar numbers \\= /\\\\d+/g;\n\n// is the same as\n\nvar numbers\
    \ \\= new RegExp(\"\\\\\\\\d+\", \"g\");\n\nThe literal form of regular expressions\
    \ in JavaScript is a bit easier \n\nto deal with than the constructor form because\
    \ you don’t need to worry \n\nabout escaping characters within strings. When using\
    \ the RegExp con-\n\nstructor, you pass the pattern in as a string, so you have\
    \ to escape any \n\nbackslashes. (That’s why \\\\d is used in the literal and\
    \ \\\\\\\\d is used in the \n\nconstructor.) Regular expression literals are preferred\
    \ over the construc-\n\ntor form in Java­Script except when the regular expression\
    \ is being con-\n\nstructed dynamically from one or more strings.\n\nThat said,\
    \ with the exception of Function, there really isn’t any right \n\nor wrong way\
    \ to instantiate built-in types. Many developers prefer literals, \n\nwhile some\
    \ prefer constructors. Choose whichever method you find more \n\ncomfortable to\
    \ use. \n\n**Property Access**\n\nProperties are name/value pairs that are stored\
    \ on an object. Dot nota-\n\ntion is the most common way to access properties\
    \ in JavaScript (as in \n\nmany object-oriented languages), but you can also access\
    \ properties on \n\nJavaScript objects by using bracket ­notation with a string.\
    \ \n\nFor example, you could write this code, which uses dot notation:\n\nvar\
    \ array \\= \\[\\];\n\narray.push(12345);\n\nWith bracket notation, the name of\
    \ the method is now included in a \n\nstring enclosed by square brackets, as in\
    \ this example: \n\nvar array \\= \\[\\];\n\narray\\[\"push\"\\](12345);"
