  md: "**32**   Chapter 3\n\n**Defining Properties**\n\nRecall from Chapter 1 that\
    \ there are two basic ways to create your own \n\nobjects: using the Object constructor\
    \ and using an object literal. For \n\nexample:\n\nvar person1 \\= {\n\n name:\
    \ \"Nicholas\"\n\n};\n\nvar person2 \\= new Object();\n\nperson2.name \\= \"Nicholas\"\
    ;\n\nu person1.age \\= \"Redacted\";\n\nperson2.age \\= \"Redacted\";\n\nv person1.name\
    \ \\= \"Greg\";\n\nperson2.name = \"Michael\";\n\nBoth person1 and person2 are\
    \ objects with a name property. Later in the \n\nexample, both objects are assigned\
    \ an age property u. You could do this \n\nimmediately after the definition of\
    \ the object or much later. Objects you \n\ncreate are always wide open for modification\
    \ unless you specify otherwise \n\n(more on that in “Preventing Object Modification”\
    \ on page 45). The \n\nlast part of this example changes the value of name on\
    \ each object v; \n\nproperty values can be changed at any time as well.\n\nWhen\
    \ a property is first added to an object, JavaScript uses an inter-\n\nnal method\
    \ called \\[\\[Put\\]\\] on the object. The \\[\\[Put\\]\\] method creates a \n\
    \nspot in the object to store the property. You can compare this to adding \n\n\
    a key to a hash table for the first time. This operation specifies not just \n\
    \nthe initial value, but also some attributes of the property. So, in the pre­\n\
    \nvious example, when the name and age properties are first defined on each \n\
    \nobject, the \\[\\[Put\\]\\] method is invoked for each.\n\nThe result of calling\
    \ \\[\\[Put\\]\\] is the creation of an *own property* on \n\nthe object. An own\
    \ property simply indicates that the specific instance \n\nof the object owns\
    \ that property. The property is stored directly on the \n\ninstance, and all\
    \ operations on the property must be performed through \n\nthat object. \n\n**N\
    \ O T E*** Own properties are distinct from *prototype properties*, which are\
    \ discussed in *\n\n*Chapter 4.*\n\nWhen a new value is assigned to an existing\
    \ property, a ­separate oper-\n\nation called \\[\\[Set\\]\\] takes place. This\
    \ operation replaces the current value \n\nof the property with the new one. In\
    \ the previous example, setting name"
