  md: "Understanding Objects   **47**\n\n***Freezing Objects***\n\nThe last way to\
    \ create a nonextensible object is to *freeze* it. If an object is \n\nfrozen,\
    \ you can’t add or remove properties, you can’t change properties’ \n\ntypes,\
    \ and you can’t write to any data properties. In essence, a frozen object \n\n\
    is a sealed object where data properties are also read-only. Frozen objects \n\
    \ncan’t become ­unfrozen, so they remain in the state they were in when \n\nthey\
    \ became frozen. You can freeze an object by using Object.freeze() and \n\ndetermine\
    \ if an object is frozen by using Object.isFrozen(). For example:\n\nvar person1\
    \ \\= {\n\n name: \"Nicholas\"\n\n};\n\nconsole.log(Object.isExtensible(person1));\
    \ // true\n\nconsole.log(Object.isSealed(person1)); // false\n\nconsole.log(Object.isFrozen(person1));\
    \ // false\n\nu Object.freeze(person1);\n\nv console.log(Object.isExtensible(person1));\
    \ // false\n\nw console.log(Object.isSealed(person1)); // true\n\nconsole.log(Object.isFrozen(person1));\
    \ // true\n\nperson1.sayName \\= function() {\n\n console.log(this.name);\n\n\
    };\n\nconsole.log(\"sayName\" in person1); // false\n\nx person1.name \\= \"Greg\"\
    ;\n\nconsole.log(person1.name); // \"Nicholas\"\n\ndelete person1.name;\n\nconsole.log(\"\
    name\" in person1); // true\n\nconsole.log(person1.name); // \"Nicholas\"\n\n\
    var descriptor = Object.getOwnPropertyDescriptor(person1, \"name\");\n\nconsole.log(descriptor.configurable);\
    \ // false\n\nconsole.log(descriptor.writable); // false\n\nIn this example, person1\
    \ is frozen u. Frozen objects are also consid-\n\nered nonextensible and sealed,\
    \ so Object.isExtensible() returns false v \n\nand Object.isSealed() returns true\
    \ w. The name property can’t be changed, \n\nso even though it is assigned to\
    \ \"Greg\", the operation fails x, and sub­\n\nsequent checks of name will still\
    \ return \"Nicholas\".\n\n**N O T E*** Frozen objects are simply snapshots of\
    \ an object at a particular point in time. They *\n\n*are of limited use and should\
    \ be used rarely. As with all non­extensible objects, you *\n\n*should use strict\
    \ mode with frozen objects.*"
