  md: "Inheritance   **77**\n\n**Accessing Supertype Methods**\n\nIn the previous\
    \ example, the Square type has its own toString() method \n\nthat shadows toString()\
    \ on the prototype. It is fairly common to override \n\nsupertype methods with\
    \ new functionality in the subtype, but what if \n\nyou still want to access the\
    \ supertype method? In other languages, you \n\nmight be able to say super.toString(),\
    \ but JavaScript doesn’t have anything \n\nsimilar. Instead, you can directly\
    \ access the method on the supertype’s \n\nprototype and use either call() or\
    \ apply() to execute the method on the \n\nsubtype object. For example:\n\nfunction\
    \ Rectangle(length, width) {\n\n this.length \\= length;\n\n this.width \\= width;\n\
    \n}\n\nRectangle.prototype.getArea \\= function() {\n\n return this.length \\\
    * this.width;\n\n};\n\nRectangle.prototype.toString \\= function() {\n\n return\
    \ \"\\[Rectangle \" + this.length + \"x\" + this.height + \"\\]\";\n\n};\n\n//\
    \ inherits from Rectangle\n\nfunction Square(size) {\n\n Rectangle.call(this,\
    \ size, size);\n\n}\n\nSquare.prototype \\= Object.create(Rectangle.prototype,\
    \ {\n\n constructor: {\n\n configurable: true,\n\n enumerable: true,\n\n value:\
    \ Square,\n\n writable: true\n\n }\n\n });\n\n// call the supertype method\n\n\
    u Square.prototype.toString \\= function() { \n\n var text \\= Rectangle.prototype.toString.call(this);\n\
    \n return text.replace(\"Rectangle\", \"Square\");\n\n};\n\nIn this version of\
    \ the code, u Square.prototype.toString() calls \n\nRectangle.prototype.toString()\
    \ by using call(). The method just needs \n\nto replace \"Rectangle\" with \"\
    Square\" before returning the resulting text. \n\nThis approach may seem a bit\
    \ verbose for such a simple operation, but \n\nit is the only way to access a\
    \ supertype’s method."
