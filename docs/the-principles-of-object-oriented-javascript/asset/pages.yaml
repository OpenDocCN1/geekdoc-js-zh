  md: "**About the Author**\n\nNicholas C. Zakas is a software engineer at Box and\
    \ is known for ­writing \n\non and speaking about the latest in JavaScript best\
    \ practices. He honed \n\nhis experience during his five years at Yahoo!, where\
    \ he was principal \n\nfront­end engineer for the Yahoo! home page. He is the\
    \ author of sev-\n\neral books, including *Maintainable JavaScript* (O’Reilly\
    \ Media, 2012) \n\nand *Professional JavaScript for Web Developers *(Wrox, 2012).\n\
    \n**About the Technical Reviewer**\n\nOriginally from the UK, Angus Croll is now\
    \ part of Twitter’s web frame-\n\nwork team in San Francisco and is the co-author\
    \ and principal main-\n\ntainer of Twitter’s open source Flight framework. He’s\
    \ obsessed with \n\nJavaScript and literature in equal measure and is a passionate\
    \ advocate \n\nfor the greater involvement of artists and creative thinkers in\
    \ software \n\ndevelopment. Angus is a frequent speaker at conferences worldwide\
    \ and \n\nis currently working on two books for No Starch Press. He can be reached\
    \ \n\non Twitter at @angustweets."
