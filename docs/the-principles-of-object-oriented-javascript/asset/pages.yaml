  md: "Primitive and Reference Types   **5**\n\nAs you might expect, typeof returns\
    \ \"string\" when the value is a string; \n\n\"number\" when the value is a number\
    \ (regardless of integer or floating-\n\npoint values); \"boolean\" when the value\
    \ is a Boolean; and ­\"undefined\" when \n\nthe value is undefined. \n\nThe tricky\
    \ part involves null. \n\nYou wouldn’t be the first developer to be confused by\
    \ the result \n\nof this line of code:\n\nconsole.log(typeof null); // \"object\"\
    \n\nWhen you run typeof null, the result is \"object\". But why an object \n\n\
    when the type is null? (In fact, this has been acknowledged as an error by \n\n\
    TC39, the committee that designs and maintains JavaScript. You could \n\nreason\
    \ that null is an empty object pointer, making \"object\" a logical \n\nreturn\
    \ value, but that’s still confusing.)\n\nThe best way to determine if a value\
    \ is null is to compare it against \n\nnull directly, like this:\n\nconsole.log(value\
    \ \\=== null); // true or false\n\n**Comparing Without Coercion**\n\nNotice that\
    \ this code uses the triple equals operator (\\===) instead of the double \n\n\
    equals operator. The reason is that triple equals does the comparison without\
    \ \n\ncoercing the variable to another type. To understand why this is important,\
    \ \n\nconsider the following:\n\nconsole.log(\"5\" \\== 5); // true\n\nconsole.log(\"\
    5\" \\=== 5); // false\n\nconsole.log(undefined \\== null); // true\n\nconsole.log(undefined\
    \ \\=== null); // false\n\nWhen you use the double equals, the string \"5\" and\
    \ the number 5 \n\nare considered equal because the double equals converts the\
    \ string into a \n\nnumber before it makes the comparison. The triple equals operator\
    \ doesn’t \n\nconsider these values equal because they are two different types.\
    \ Likewise, \n\nwhen you compare undefined and null, the double equals says that\
    \ they are \n\nequivalent, while the triple equals says they are not. When you’re\
    \ trying to \n\nidentify null, use triple equals so that you can correctly identify\
    \ the type."
