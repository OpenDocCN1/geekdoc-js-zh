  md: "Functions   **19**\n\nThis code might look like it will cause an error, but\
    \ it works just fine. \n\nThat’s because the JavaScript engine hoists the function\
    \ declaration to \n\nthe top and actually executes the code as if it were written\
    \ like this:\n\n// how the JavaScript engine interprets the code\n\nfunction add(num1,\
    \ num2) {\n\n return num1 + num2;\n\n}\n\nvar result \\= add(5, 5);\n\nFunction\
    \ hoisting happens only for function declarations because \n\nthe function name\
    \ is known ahead of time. Function expressions, on the \n\nother hand, cannot\
    \ be hoisted because the functions can be referenced \n\nonly through a variable.\
    \ So this code causes an error:\n\n// error!\n\nvar result \\= add(5, 5);\n\n\
    var add \\= function(num1, num2) {\n\n return num1 + num2;\n\n};\n\nAs long as\
    \ you always define functions before using them, you can use \n\neither function\
    \ declarations or function expressions.\n\n**Functions as Values**\n\nBecause\
    \ JavaScript has first-class functions, you can use them just as \n\nyou do any\
    \ other objects. You can assign them to variables, add them \n\nto objects, pass\
    \ them to other functions as arguments, and return them \n\nfrom functions. Basically,\
    \ you can use a function anywhere you would \n\nuse any other reference value.\
    \ This makes JavaScript functions incredibly \n\npowerful. Consider the following\
    \ example:\n\nu function sayHi() {\n\n console.log(\"Hi!\");\n\n}\n\nsayHi();\
    \ // outputs \"Hi!\"\n\nv var sayHi2 \\= sayHi;\n\nsayHi2(); // outputs \"Hi!\""
