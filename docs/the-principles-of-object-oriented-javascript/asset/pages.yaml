  md: "**62**   Chapter 4\n\n**N O T E*** In practice, you probably won’t use prototypes\
    \ this way very often when developing *\n\n*in JavaScript. However, it’s important\
    \ to understand the relationships that exist *\n\n*between objects and their prototype,\
    \ and strange examples like this help to illumi-*\n\n*nate the concepts.*\n\n\
    ***Built-in Object Prototypes***\n\nAt this point, you might wonder if prototypes\
    \ also allow you to modify \n\nthe built-in objects that come standard in the\
    \ JavaScript engine. The \n\nanswer is yes. All built-in objects have constructors,\
    \ and therefore, they \n\nhave proto­types that you can change. For instance,\
    \ adding a new method \n\nfor use on all arrays is as simple as modifying Array.prototype.\n\
    \nArray.prototype.sum \\= function() {\n\n return this.reduce(function(previous,\
    \ current) {\n\n return previous + current;\n\n });\n\n};\n\nvar numbers \\= \\\
    [ 1, 2, 3, 4, 5, 6 \\];\n\nvar result \\= numbers.sum();\n\nconsole.log(result);\
    \ // 21\n\nThis example creates a method called sum() on Array.prototype that\
    \ \n\nsimply adds up all of the items in the array and returns the result. The\
    \ \n\nnumbers array automatically has access to that method through the proto-\n\
    \ntype. Inside of sum(), this refers to numbers, which is an instance of Array,\
    \ so \n\nthe method is free to use other array methods such as reduce().\n\nYou\
    \ may recall that strings, numbers, and Booleans all have built-in \n\nprimitive\
    \ wrapper types that are used to access primitive values as if they \n\nwere objects.\
    \ If you modify the primitive wrapper type prototype as in \n\nthis example, you\
    \ can actually add more functionality to those primitive \n\nvalues:\n\nString.prototype.capitalize\
    \ \\= function() {\n\n return this.charAt(0).toUpperCase() + this.substring(1);\n\
    \n};\n\nvar message \\= \"hello world!\";\n\nconsole.log(message.capitalize());\
    \ // \"Hello world!\"\n\nThis code creates a new method called capitalize() for\
    \ strings. The \n\nString type is the primitive wrapper for strings, and modifying\
    \ its proto-\n\ntype means that all strings automatically get those changes."
