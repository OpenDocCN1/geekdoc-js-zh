  md: "**8**   Chapter 1\n\nvar object1 \\= new Object();\n\n// do something\n\nobject1\
    \ \\= null; // dereference\n\nHere, object1 is created and used before finally\
    \ being set to null. \n\nWhen there are no more references to an object in memory,\
    \ the gar-\n\nbage collector can use that memory for something else. (Dereferencing\
    \ \n\nobjects is especially important in very large applications that use millions\
    \ \n\nof objects.)\n\n***Adding or Removing Properties***\n\nAnother interesting\
    \ aspect of objects in JavaScript is that you can add and \n\nremove properties\
    \ at any time. For example:\n\nvar object1 \\= new Object();\n\nvar object2 \\\
    = object1;\n\nobject1.myCustomProperty \\= \"Awesome!\";\n\nconsole.log(object2.myCustomProperty);\
    \ // \"Awesome!\"\n\nHere, myCustomProperty is added to object1 with a value of\
    \ \"Awesome!\". \n\nThat property is also accessible on object2 because both object1\
    \ and \n\nobject2 point to the same object. \n\n**N O T E*** This example demonstrates\
    \ one particularly unique aspect of JavaScript: You can *\n\n*modify objects whenever\
    \ you want, even if you didn’t define them in the first place. *\n\n*And there\
    \ are ways to prevent such modifications, as you’ll learn later in this book.*\n\
    \nIn addition to generic object reference types, JavaScript has several \n\nother\
    \ built-in types that are at your disposal.\n\n**Instantiating Built-in Types\
    \ **\n\nYou’ve seen how to create and interact with generic objects created with\
    \ \n\nnew Object(). The Object type is just one of a handful of built-in reference\
    \ \n\ntypes that JavaScript provides. The other built-in types are more special-\n\
    \nized in their intended usage and can be instantiated at any time. \n\nThe built-in\
    \ types are:\n\n**Array**\n\nAn ordered list of numerically indexed values\n\n\
    **Date**\n\nA date and time"
