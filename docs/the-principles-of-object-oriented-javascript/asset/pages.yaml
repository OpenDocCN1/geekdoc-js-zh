  md: "Understanding Objects   **45**\n\n**Preventing Object Modification**\n\nObjects,\
    \ just like properties, have internal attributes that govern their \n\nbehavior.\
    \ One of these attributes is \\[\\[Extensible\\]\\], which is a Boolean \n\nvalue\
    \ indicating if the object itself can be modified. All objects you \n\ncreate\
    \ are *extensible* by default, meaning new properties can be added to \n\nthe\
    \ object at any time. You’ve seen this several times in this chapter. By \n\n\
    setting \\[\\[Extensible\\]\\] to false, you can prevent new properties from being\
    \ \n\nadded to an object. There are three different ways to accomplish this.\n\
    \n***Preventing Extensions***\n\nOne way to create a nonextensible object is with\
    \ Object.preventExtensions(). \n\nThis method accepts a single argument, which\
    \ is the object you want to \n\nmake nonextensible. Once you use this method on\
    \ an object, you’ll never \n\nbe able to add any new properties to it again. You\
    \ can check the value of \n\n\\[\\[Extensible\\]\\] by using Object.isExtensible().\
    \ The following code shows \n\nexamples of both methods at work.\n\nvar person1\
    \ \\= {\n\n name: \"Nicholas\"\n\n};\n\nu console.log(Object.isExtensible(person1));\
    \ // true\n\nv Object.preventExtensions(person1);\n\nconsole.log(Object.isExtensible(person1));\
    \ // false\n\nw person1.sayName \\= function() {\n\n console.log(this.name);\n\
    \n};\n\nconsole.log(\"sayName\" in person1); // false\n\nAfter creating person1,\
    \ this example checks the object’s \\[\\[Extensible\\]\\] \n\nattribute u before\
    \ making it unchangeable v. Now that person1 is non­\n\nextensible, the sayName()\
    \ method w is never added to it.\n\n**N O T E*** Attempting to add a property\
    \ to a nonextensible object will throw an error in strict *\n\n*mode. In nonstrict\
    \ mode, the operation fails silently. You should always use strict *\n\n*mode\
    \ with nonextensible objects so that you are aware when a nonextensible object\
    \ *\n\n*is being used incorrectly.*\n\n***Sealing Objects***\n\nThe second way\
    \ to create a nonextensible object is to *seal* the object. A \n\nsealed object\
    \ is nonextensible, and all of its properties are nonconfigu-\n\nrable. That means\
    \ not only can you not add new properties to the object,"
