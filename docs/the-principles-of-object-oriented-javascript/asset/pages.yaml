  md: "**6**\n\n**O bjec t Pat t e r n s**\n\nJavaScript has many patterns for creating\
    \ \n\nobjects, and there’s usually more than one \n\nway to accomplish the same\
    \ thing. You can \n\ndefine your own custom types or your own \n\ngeneric objects\
    \ whenever you want. You can use \n\ninheritance to share behavior between objects,\
    \ or \n\nyou can employ other techniques, such as mixins. You can also take \n\
    \nadvantage of advanced JavaScript features to prevent an object’s struc-\n\n\
    ture from being modified. The patterns discussed in this chapter give \n\nyou powerful\
    \ ways of managing and creating objects, all based on your \n\nuse cases."
