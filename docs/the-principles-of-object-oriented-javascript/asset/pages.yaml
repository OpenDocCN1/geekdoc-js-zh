  md: "**50**   Chapter 4\n\nthat objects created with the same constructor contain\
    \ the same proper-\n\nties and methods. If you want to create multiple similar\
    \ objects, you can \n\ncreate your own constructors and therefore your own reference\
    \ types.\n\nBecause a constructor is just a function, you define it in the same\
    \ way. \n\nThe only difference is that constructor names should begin with a capital\
    \ \n\nletter, to distinguish them from other functions. For example, look at the\
    \ \n\nfollowing empty Person function:\n\nfunction Person() {\n\n // intentionally\
    \ empty\n\n}\n\nThis function is a constructor, but there is absolutely no syntactic\
    \ dif-\n\nference between this and any other function. The clue that Person is\
    \ a con-\n\nstructor is in the name—the first letter is capitalized. \n\nAfter\
    \ the constructor is defined, you can start creating instances, like \n\nthe following\
    \ two Person objects:\n\nvar person1 \\= new Person();\n\nvar person2 \\= new\
    \ Person();\n\nWhen you have no parameters to pass into your constructor, you\
    \ can \n\neven omit the parentheses:\n\nvar person1 \\= new Person;\n\nvar person2\
    \ \\= new Person;\n\nEven though the Person constructor doesn’t explicitly return\
    \ anything, \n\nboth person1 and person2 are considered instances of the new Person\
    \ type. \n\nThe new operator automatically creates an object of the given type\
    \ and \n\nreturns it. That also means you can use the instanceof operator to deduce\
    \ \n\nan object’s type. The following code shows instanceof in action with the\
    \ \n\nnewly created objects:\n\nconsole.log(person1 instanceof Person); // true\n\
    \nconsole.log(person2 instanceof Person); // true\n\nBecause person1 and person2\
    \ were created with the Person constructor, \n\ninstanceof returns true when it\
    \ checks whether these objects are instances \n\nof the Person type. \n\nYou can\
    \ also check the type of an instance using the ­constructor prop-\n\nerty. Every\
    \ object instance is automatically ­created with a ­constructor prop-\n\nerty\
    \ that contains a reference to the constructor function that ­created it. \n\n\
    For *generic* objects (those created via an object literal or the Object con-\n\
    \nstructor), ­constructor is set to Object; for objects created with a custom"
