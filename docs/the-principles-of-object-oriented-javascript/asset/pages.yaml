  md: "Inheritance   **71**\n\nconsole.log(person1.hasOwnProperty(\"sayName\")); //\
    \ true\n\nconsole.log(person1.isPrototypeOf(person2)); // true\n\nconsole.log(person2.hasOwnProperty(\"\
    sayName\")); // false\n\nThis code creates an object, person1, with a name property\
    \ and a sayName() \n\nmethod. The person2 object inherits from person1, so it\
    \ inherits both name and \n\nsayName(). However, person2 is defined via Object.create(),\
    \ which also defines \n\nan own name property for ­person2. This own property\
    \ shadows the prototype \n\nproperty of the same name and is used in its place.\
    \ So, person1.sayName() out-\n\nputs \"Nicholas\", while person2.sayName() outputs\
    \ \"Greg\". Keep in mind that \n\nsayName() still exists only on person1 and is\
    \ being inherited by person2.\n\nThe inheritance chain in this example is longer\
    \ for person2 than it is for \n\nperson1. The person2 object inherits from the\
    \ person1 object, and the person1 \n\nobject inherits from Object.prototype. See\
    \ Figure 5-1.\n\nObject.prototype\n\n\\[\\[Prototype\\]\\]\n\nperson2\n\n\\[\\\
    [Prototype\\]\\]\n\n\"Greg\"\n\nperson1\n\n\\[\\[Prototype\\]\\]\n\nname\n\n\"\
    Nicholas\"\n\nsayName\n\n(function)\n\nname\n\npropertyisEnumerable\n\n(function)\n\
    \nhasOwnProperty\n\n(function)\n\nnull\n\nisPrototypeOf\n\n(function)\n\ntoString\n\
    \n(function)\n\nvalueOf\n\n(function)\n\n*Figure 5-1: The prototype chain for\
    \ **person2** includes **person1** and **Object.prototype**.*\n\nWhen a property\
    \ is accessed on an object, the JavaScript engine goes \n\nthrough a search process.\
    \ If the property is found on the instance (that is, \n\nif it’s an own property),\
    \ that property value is used. If the property is not \n\nfound on the instance,\
    \ the search continues on \\[\\[Prototype\\]\\]. If the property \n\nis still\
    \ not found, the search continues to that object’s \\[\\[Prototype\\]\\], and\
    \ \n\nso on until the end of the chain is reached. That chain usually ends with\
    \ \n\nObject.prototype, whose \\[\\[Prototype\\]\\] is set to null."
