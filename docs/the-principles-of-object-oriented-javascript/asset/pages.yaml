  md: "Constructors and Prototypes   **55**\n\nYou can read the value of the \\[\\\
    [Prototype\\]\\] property by using the \n\nObject.­getPrototypeOf() method on\
    \ an object. For example, the following \n\ncode checks the \\[\\[Prototype\\\
    ]\\] of a generic, empty object.\n\nu var object \\= {};\n\nvar prototype \\=\
    \ Object.getPrototypeOf(object);\n\nconsole.log(prototype \\=== Object.prototype);\
    \ // true\n\nFor any generic object like this one u, \\[\\[Prototype\\]\\] is\
    \ always a refer-\n\nence to Object.prototype.\n\n**N O T E*** Some JavaScript\
    \ engines also support a property called **\\_\\_proto\\_\\_** on all objects.\
    \ *\n\n*This property allows you to both read from and write to the **\\[\\[Prototype\\\
    ]\\]** property. *\n\n*Firefox, Safari, Chrome, and Node.js all support this property,\
    \ and **\\_\\_proto\\_\\_** is on *\n\n*the path for standardization in ECMAScript\
    \ 6.*\n\nYou can also test to see if one object is a prototype for another by\
    \ \n\nusing the isPrototypeOf() method, which is included on all objects:\n\n\
    var object \\= {};\n\nconsole.log(Object.prototype.isPrototypeOf(object)); //\
    \ true\n\nBecause object is just a generic object, its prototype should be Object\
    \ \n\n.prototype, meaning isPrototypeOf() should return true.\n\nWhen a property\
    \ is read on an object, the JavaScript engine first \n\nlooks for an own property\
    \ with that name. If the engine finds a correctly \n\nnamed own property, it returns\
    \ that value. If no own property with that \n\nname exists on the target object,\
    \ JavaScript searches the \\[\\[Prototype\\]\\] \n\nobject instead. If a prototype\
    \ property with that name exists, the value \n\nof that property is returned.\
    \ If the search concludes without finding a \n\nproperty with the correct name,\
    \ undefined is returned.\n\nConsider the following, in which an object is first\
    \ created without any \n\nown properties:\n\nvar object \\= {};\n\nu console.log(object.toString());\
    \ // \"\\[object Object\\]\"\n\nobject.toString \\= function() {\n\n return \"\
    \\[object Custom\\]\";\n\n};\n\nv console.log(object.toString()); // \"\\[object\
    \ Custom\\]\"\n\n// delete own property\n\ndelete object.toString;"
