  md: "**42**   Chapter 3\n\nThe advantage of using accessor property attributes instead\
    \ of object \n\nliteral notation to define accessor properties is that you can\
    \ also define \n\nthose properties on existing objects. If you want to use object\
    \ literal nota-\n\ntion, you have to define accessor properties when you create\
    \ the object. \n\nAs with data properties, you can also specify whether accessor\
    \ proper-\n\nties are configurable or enumerable. Consider this example from earlier:\n\
    \nvar person1 \\= {\n\n \\_name: \"Nicholas\",\n\n get name() {\n\n console.log(\"\
    Reading name\");\n\n return this.\\_name;\n\n },\n\n set name(value) {\n\n console.log(\"\
    Setting name to %s\", value);\n\n this.\\_name \\= value;\n\n }\n\n};\n\nThis\
    \ code can also be written as follows:\n\nvar person1 = {\n\n \\_name: \"Nicholas\"\
    \n\n};\n\nObject.defineProperty(person1, \"name\", {\n\n get: function() {\n\n\
    \ console.log(\"Reading name\");\n\n return this.\\_name;\n\n },\n\n set: function(value)\
    \ {\n\n console.log(\"Setting name to %s\", value);\n\n this.\\_name \\= value;\n\
    \n },\n\n enumerable: true,\n\n configurable: true\n\n});\n\nNotice that the get\
    \ and set keys on the object passed in to Object \n\n.defineProperty() are data\
    \ properties that contain a function. You can’t \n\nuse object literal accessor\
    \ format here.\n\nSetting the other attributes (\\[\\[Enumerable\\]\\] and \\\
    [\\[Configurable\\]\\]) allows \n\nyou to change how the accessor property works.\
    \ For example, you can \n\n­create a nonconfigurable, nonenumerable, nonwritable\
    \ property like this:\n\nvar person1 \\= {\n\n \\_name: \"Nicholas\"\n\n};"
