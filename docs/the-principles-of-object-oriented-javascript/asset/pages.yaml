  md: "Constructors and Prototypes   **61**\n\nw var person1 \\= new Person(\"Nicholas\"\
    );\n\nvar person2 \\= new Person(\"Greg\");\n\nconsole.log(\"sayHi\" in person1);\
    \ // false\n\nconsole.log(\"sayHi\" in person2); // false\n\n// add a new method\n\
    \nx Person.prototype.sayHi \\= function() {\n\n console.log(\"Hi\");\n\n};\n\n\
    y person1.sayHi(); // outputs \"Hi\"\n\nperson2.sayHi(); // outputs \"Hi\"\n\n\
    In this code, the Person type starts out with only two methods, \n\n­sayName()\
    \ u and toString() v. Two instances of Person are created w, \n\nand then the\
    \ sayHi() x method is added to the prototype. After that \n\npoint, both instances\
    \ can now access sayHi() y. The search for a named \n\nproperty happens each time\
    \ that property is accessed, so the experience \n\nis seamless.\n\nThe ability\
    \ to modify the prototype at any time has some interesting \n\nrepercussions for\
    \ sealed and frozen objects. When you use Object.seal() \n\nor Object.freeze()\
    \ on an object, you are acting *solely* on the object instance \n\nand the own\
    \ properties. You can’t add new own properties or change \n\nexisting own properties\
    \ on frozen objects, but you can certainly still add \n\nproperties on the prototype\
    \ and continue extending those objects, as \n\ndemonstrated in the following listing.\n\
    \nvar person1 \\= new Person(\"Nicholas\");\n\nvar person2 \\= new Person(\"Greg\"\
    );\n\nu Object.freeze(person1);\n\nv Person.prototype.sayHi \\= function() {\n\
    \n console.log(\"Hi\");\n\n};\n\nperson1.sayHi(); // outputs \"Hi\"\n\nperson2.sayHi();\
    \ // outputs \"Hi\"\n\nIn this example, there are two instances of Person. The\
    \ first (person1) \n\nis frozen u, while the second is a normal object. When you\
    \ add sayHi() to \n\nthe prototype v, both person1 and person2 attain a new method,\
    \ seemingly \n\ncontradicting person1’s frozen status. The \\[\\[Prototype\\]\\\
    ] property is con-\n\nsidered an own property of the instance, and while the property\
    \ itself is \n\nfrozen, the value (an object) is not."
