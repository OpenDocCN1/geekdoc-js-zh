    \ + this.length + \"x\" + this.width + \"\\]\";\n\n};\n\nIn this version of the\
    \ code, Square.prototype is overwritten with a \n\nnew object that inherits from\
    \ Rectangle.prototype, and the Rectangle \n\nconstructor is never called. That\
    \ means you don’t need to worry about \n\ncausing an error by calling the constructor\
    \ without arguments anymore. \n\nOtherwise, this code behaves exactly the same\
    \ as the previous code. The \n\nprototype chain remains intact, so all instances\
    \ of Square inherit from \n\nRectangle.prototype and the constructor is restored\
    \ in the same step.\n\n**N O T E*** Always make sure that you overwrite the prototype\
    \ *before* adding properties to it, *\n\n*or you will lose the added methods when\
    \ the overwrite happens.*\n\n**Constructor Stealing**\n\nBecause inheritance is\
    \ accomplished through prototype chains in \n\nJavaScript, you don’t need to call\
    \ an object’s supertype constructor. If \n\nyou do want to call the supertype\
    \ constructor from the subtype construc-\n\ntor, then you need to take advantage\
    \ of how JavaScript functions work. \n\nIn Chapter 2, you learned about the call()\
    \ and apply() ­methods, \n\nwhich allow functions to be called with a different\
    \ this value. That’s \n\nexactly how *constructor stealing* works. You simply\
    \ call the supertype con-\n\nstructor from the subtype constructor using either\
    \ call() or apply() to \n\npass in the newly created object. In effect, you’re\
    \ stealing the supertype \n\nconstructor for your own object, as in this example:\n\
    \nfunction Rectangle(length, width) {\n\n this.length \\= length;\n\n this.width\
    \ \\= width;\n\n}"
