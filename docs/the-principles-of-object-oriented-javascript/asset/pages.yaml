    \ through mixins. *Mixins* occur when one object acquires the \n\nproperties of\
    \ another without modify­ing the prototype chain. The first \n\nobject (a *receiver*)\
    \ actually receives the properties of the second object (the \n\n*supplier*) by copying\
    \ those properties directly. Traditionally, you create \n\nmixins using a function\
    \ such as this:\n\nfunction mixin(receiver, supplier) {\n\n for (var property\
    \ in supplier) {\n\n if (supplier.hasOwnProperty(property)) {\n\n receiver\\[property\\\
    ] \\= supplier\\[property\\]\n\n }\n\n }\n\n return receiver;\n\n}\n\nThe mixin()\
    \ function accepts two arguments: the receiver and the sup-\n\nplier. The goal\
    \ of the function is to copy all enumerable properties from \n\nthe supplier onto\
    \ the receiver. You accomplish this using a for-in loop \n\nthat iterates over\
    \ the properties in supplier and then assigns the value"
