    console.log(colors\\[0\\]); // \"red\"\n\n***Function Literals***\n\nYou almost\
    \ always define functions using their literal form. In fact, using \n\nthe Function\
    \ constructor is typically discouraged given the challenges of \n\nmaintaining,\
    \ reading, and debugging a string of code rather than actual \n\ncode, so you’ll\
    \ rarely see it in code. \n\nCreating functions is much easier and less error\
    \ prone when you use \n\nthe literal form. For example:\n\nfunction reflect(value)\
    \ {\n\n return value;\n\n}\n\n// is the same as\n\nvar reflect \\= new Function(\"\
    value\", \"return value;\");\n\nThis code defines the reflect() function, which\
    \ returns any value \n\npassed to it. Even in the case of this simple function,\
    \ the literal form is \n\neasier to write and understand than the constructor\
    \ form. Further, there"
