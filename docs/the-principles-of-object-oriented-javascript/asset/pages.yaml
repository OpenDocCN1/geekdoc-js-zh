  md: "Inheritance   **69**\n\nAdding Object.prototype.add() causes all objects to\
    \ have an add() \n\nmethod, whether or not it actually makes sense. This problem\
    \ has been \n\nan issue not just for developers but also for the committee that\
    \ works on \n\nthe JavaScript language: It has had to put new methods in different\
    \ loca-\n\ntions because adding methods to Object.prototype can have unforeseen\
    \ \n\nconsequences.\n\nAnother aspect of this problem involves adding enumerable\
    \ proper-\n\nties to Object.prototype. In the previous example, Object.prototype.add()\
    \ \n\nis an enumerable property, which means it will show up when you use a \n\
    \nfor-in loop, such as:\n\nvar empty \\= {};\n\nfor (var property in empty) {\n\
    \n console.log(property);\n\n}\n\nHere, an empty object will still output \"add\"\
    \ as a property because it \n\nexists on the prototype and is enumerable. Given\
    \ how often the for-in \n\nconstruct is used in JavaScript, modifying Object.prototype\
    \ with enumer-\n\nable properties has the potential to affect a lot of code. For\
    \ this reason, \n\nDouglas Crockford recommends using hasOwnProperty() in for-in\
    \ loops all \n\nthe time,^(\\*) such as:\n\nvar empty \\= {};\n\nfor (var property\
    \ in empty) {\n\n if (empty.hasOwnProperty(property)) {\n\n console.log(property);\n\
    \n }\n\n}\n\nWhile this approach is effective against possible unwanted prototype\
    \ \n\nproperties, it also limits the use of for-in to only own properties, which\
    \ \n\nmay or may not be want you want. Your best bet for the most flexibility\
    \ is \n\nto not modify Object.prototype.\n\n**Object Inheritance**\n\nThe simplest\
    \ type of inheritance is between objects. All you have to do is \n\nspecify what\
    \ object should be the new object’s \\[\\[Prototype\\]\\]. Object liter-\n\nals\
    \ have Object.prototype set as their \\[\\[Prototype\\]\\] implicitly, but you\
    \ can \n\nalso explicitly specify \\[\\[Prototype\\]\\] with the Object.create()\
    \ method.\n\n\\* See Douglas Crockford’s “Code Conventions for the JavaScript\
    \ Programming Language” \n\n(*http://javascript.crockford.com/code.html*)."
