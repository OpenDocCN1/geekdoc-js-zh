  md: "**88**   Chapter 6\n\nOf course, you might decide that while you do want to\
    \ use an object’s \n\nproperties, you don’t want a constructor of pseudo­classical\
    \ inheritance at \n\nall. In that case, you can use a mixin directly when you\
    \ create your new \n\nobject:\n\nvar person \\= mixin(new EventTarget(), {\n\n\
    \ name: \"Nicholas\",\n\n sayName: function() {\n\n console.log(this.name);\n\n\
    \ this.fire({ type: \"namesaid\", name: name });\n\n }\n\n});\n\nIn this example,\
    \ a new instance of EventTarget is mixed in with some \n\nnew properties to create\
    \ the person object without affecting person’s proto-\n\ntype chain.\n\nOne thing\
    \ to keep in mind about using mixins in this way is that \n\naccessor properties\
    \ on the supplier become data properties on the receiver, \n\nwhich means you\
    \ can overwrite them if you’re not careful. That’s because \n\nthe receiver properties\
    \ are being created by assignment rather than by \n\nObject.defineProperty(),\
    \ meaning the current value of the supplier prop-\n\nerty is read and then assigned\
    \ to a property of the same name on the \n\nreceiver. For example:\n\nvar person\
    \ \\= mixin(new EventTarget(), {\n\nu get name() {\n\n return \"Nicholas\"\n\n\
    \ },\n\n sayName: function() {\n\n console.log(this.name);\n\n this.fire({ type:\
    \ \"namesaid\", name: name });\n\n }\n\n});\n\nconsole.log(person.name); // \"\
    Nicholas\"\n\nv person.name \\= \"Greg\";\n\nconsole.log(person.name); // \"Greg\""
