  md: "Primitive and Reference Types   **9**\n\n**Error**\n\nA runtime error (there\
    \ are also several more specific \n\nerror subtypes)\n\n**Function**\n\nA function\n\
    \n**Object**\n\nA generic object\n\n**RegExp**\n\nA regular expression\n\nYou\
    \ can instantiate each built-in reference type using new, as \n\nshown here:\n\
    \nvar items \\= new Array();\n\nvar now \\= new Date();\n\nvar error \\= new Error(\"\
    Something bad happened.\");\n\nvar func \\= new Function(\"console.log('Hi');\"\
    );\n\nvar object \\= new Object();\n\nvar re \\= new RegExp(\"\\\\\\\\d+\");\n\
    \n***Literal Forms***\n\nSeveral built-in reference types have literal forms.\
    \ A *literal* is syntax that \n\nallows you to define a reference value without\
    \ explicitly creating an object, \n\nusing the new operator and the object’s constructor.\
    \ (Earlier in this chap-\n\nter, you saw examples of primitive literals including\
    \ string lit­erals, numeric \n\nliterals, Boolean literals, the null literal,\
    \ and the undefined literal.) \n\n***Object and Array Literals***\n\nTo create\
    \ an object with *object literal* syntax, you can define the properties \n\nof\
    \ a new object inside braces. Properties are made up of an identifier or \n\n\
    string, a colon, and a value, with multiple properties separated by ­commas. \n\
    \nFor example:\n\nvar book \\= {\n\n name: \"The Principles of Object-Oriented\
    \ JavaScript\",\n\n year: 2014\n\n};\n\nYou can also use string literals as property\
    \ names, which is use-\n\nful when you want a property name to have spaces or\
    \ other special \n\ncharacters:\n\nvar book \\= {\n\n \"name\": \"The Principles\
    \ of Object-Oriented JavaScript\",\n\n \"year\": 2014\n\n};"
