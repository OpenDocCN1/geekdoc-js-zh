  md: "**2**\n\n**F u nc t ion s**\n\nAs discussed in Chapter 1, functions are \n\n\
    actually objects in JavaScript. The defining \n\ncharacteristic of a function—what\
    \ distin-\n\nguishes it from any other object—is the pres-\n\nence of an *internal\
