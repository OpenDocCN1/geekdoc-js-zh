    \ of Object-Oriented JavaScript\";\n\nbook.year \\= 2014;\n\nThe outcome of each\
    \ of the previous three examples is the same: \n\nan object with two properties.\
    \ The choice of pattern is up to you because \n\nthe functionality is ultimately\
