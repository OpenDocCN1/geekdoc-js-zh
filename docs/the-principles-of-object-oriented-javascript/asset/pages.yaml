  md: "Understanding Objects   **41**\n\nWhen Object.defineProperty() is called, it\
    \ first checks to see if the \n\nproperty exists. If the property doesn’t exist,\
    \ a new one is added with \n\nthe attributes specified in the descriptor. In this\
    \ case, name isn’t already \n\na property of person1, so it is created.\n\nWhen\
    \ you are defining a new property with Object.defineProperty(), \n\nit’s important\
    \ to specify all of the attributes because Boolean attributes \n\nautomatically\
    \ default to false other­wise. For example, the following code \n\ncreates a name\
    \ property that is nonenumerable, nonconfigurable, and \n\nnonwritable because\
    \ it doesn’t explicitly make any of those attributes \n\ntrue in the call to Object.defineProperty().\n\
    \nvar person1 \\= {};\n\nObject.defineProperty(person1, \"name\", {\n\n value:\
    \ \"Nicholas\"\n\n});\n\nconsole.log(\"name\" in person1); // true\n\nconsole.log(person1.propertyIsEnumerable(\"\
    name\")); // false\n\ndelete person1.name;\n\nconsole.log(\"name\" in person1);\
    \ // true\n\nperson1.name \\= \"Greg\";\n\nconsole.log(person1.name); // \"Nicholas\"\
    \n\nIn this code, you can’t do anything with the name property except \n\nread the\
    \ value; every other operation is locked down. If you’re changing \n\nan existing\
    \ property, keep in mind that only the attributes you specify will \n\nchange.\n\
    \n**N O T E*** Nonwritable properties throw an error in strict mode when you try\
    \ to change the *\n\n*value. In nonstrict mode, the operation silently fails.*\n\
    \n***Accessor Property Attributes***\n\nAccessor properties also have two additional\
    \ attributes. Because there \n\nis no value stored for accessor properties, there\
    \ is no need for \\[\\[Value\\]\\] \n\nor \\[\\[Writable\\]\\]. Instead, accessors\
    \ have \\[\\[Get\\]\\] and \\[\\[Set\\]\\], which contain \n\nthe getter and setter\
    \ functions, respectively. As with the object literal form \n\nof getters and\
    \ setters, you need only define one of these attributes to \n\n­create the property.\n\
    \n**N O T E*** If you try to create a property with both data and accessor attributes,\
    \ you will get *\n\n*an error.*"
