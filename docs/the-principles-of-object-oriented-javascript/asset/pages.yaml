  md: "Constructors and Prototypes   **51**\n\nconstructor, constructor points back\
    \ to that constructor function instead. \n\nFor example, Person is the constructor\
    \ property for person1 and person2:\n\nconsole.log(person1.constructor \\=== Person);\
    \ // true\n\nconsole.log(person2.constructor \\=== Person); // true\n\nThe console.log\
    \ function outputs true in both cases, because both \n\nobjects were created with\
    \ the Person constructor. \n\nEven though this relationship exists between an\
    \ instance and its \n\nconstructor, you are still advised to use instanceof to\
    \ check the type of an \n\ninstance. This is because the constructor property\
    \ can be overwritten and \n\ntherefore may not be completely accurate.\n\nOf course,\
    \ an empty constructor function isn’t very useful. The whole \n\npoint of a constructor\
    \ is to make it easy to create more objects with the \n\nsame properties and methods.\
    \ To do that, simply add any properties you \n\nwant to this inside of the constructor,\
    \ as in the following example:\n\nfunction Person(name) {\n\nu this.name \\= name;\n\
    \nv this.sayName \\= function() {\n\n console.log(this.name);\n\n };\n\n}\n\n\
    This version of the Person constructor accepts a single named param-\n\neter,\
    \ name, and assigns it to the name property of the this object u. The con-\n\n\
    structor also adds a sayName() method to the object v. The this object is \n\n\
    automatically created by new when you call the constructor, and it is an \n\n\
    instance of the constructor’s type. (In this case, this is an instance of \n\n\
    Person.) There’s no need to return a value from the function because the \n\n\
    new operator produces the return value. \n\nNow you can use the Person constructor\
    \ to create objects with an ini-\n\ntialized name property:\n\nvar person1 \\\
    = new Person(\"Nicholas\");\n\nvar person2 \\= new Person(\"Greg\");\n\nconsole.log(person1.name);\
    \ // \"Nicholas\"\n\nconsole.log(person2.name); // \"Greg\"\n\nperson1.sayName();\
    \ // outputs \"Nicholas\"\n\nperson2.sayName(); // outputs \"Greg\"\n\nEach object\
    \ has its own name property, so sayName() should return dif-\n\nferent values\
    \ depending on the object on which you use it."
