  md: "**46**   Chapter 3\n\nbut you also can’t remove properties or change their\
    \ type (from data to \n\naccessor or vice versa). If an object is sealed, you\
    \ can only read from and \n\nwrite to its properties.\n\nYou can use the Object.seal()\
    \ method on an object to seal it. When \n\nthat happens, the \\[\\[Extensible\\\
    ]\\] attribute is set to false, and all proper-\n\nties have their \\[\\[Configurable\\\
    ]\\] attribute set to false. You can check to see \n\nwhether an object is sealed\
    \ using Object.isSealed() as follows:\n\nvar person1 \\= {\n\n name: \"Nicholas\"\
    \n\n};\n\nconsole.log(Object.isExtensible(person1)); // true\n\nconsole.log(Object.isSealed(person1));\
    \ // false\n\nu Object.seal(person1);\n\nv console.log(Object.isExtensible(person1));\
    \ // false\n\nconsole.log(Object.isSealed(person1)); // true\n\nw person1.sayName\
    \ \\= function() {\n\n console.log(this.name);\n\n};\n\nconsole.log(\"sayName\"\
    \ in person1); // false\n\nx person1.name \\= \"Greg\";\n\nconsole.log(person1.name);\
    \ // \"Greg\"\n\ny delete person1.name;\n\nconsole.log(\"name\" in person1); //\
    \ true\n\nconsole.log(person1.name); // \"Greg\"\n\nvar descriptor \\= Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\n\nconsole.log(descriptor.configurable); // false\n\nThis code seals\
    \ person1 u so you can’t add or remove ­properties. \n\nSince all sealed objects\
    \ are nonextensible, Object.isExtensible() returns \n\nfalse v when used on person1,\
    \ and the attempt to add a method called \n\nsayName() w fails silently. Also,\
    \ though person1.name is successfully changed \n\nto a new value x, the attempt\
    \ to delete it y fails.\n\nIf you’re familiar with Java or C++, sealed objects\
    \ should also be \n\nfamiliar. When you create a new object instance based on\
    \ a class in \n\none of those languages, you can’t add any new properties to that\
    \ object. \n\nHowever, if a property contains an object, you can modify that object.\
    \ \n\nIn effect, sealed objects are JavaScript’s way of giving you the same mea-\n\
    \nsure of control without using classes. \n\n**N O T E*** Be sure to use strict\
    \ mode with sealed objects so you’ll get an error when someone *\n\n*tries to\
    \ use the object incorrectly.*"
