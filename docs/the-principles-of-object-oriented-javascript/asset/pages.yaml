  md: "Primitive and Reference Types   **15**\n\nHere’s what’s actually happening\
    \ in the JavaScript engine:\n\n// what the JavaScript engine does\n\nvar name\
    \ \\= \"Nicholas\";\n\nvar temp \\= new String(name);\n\ntemp.last \\= \"Zakas\"\
    ;\n\ntemp \\= null; // temporary object destroyed\n\nvar temp \\= new String(name);\n\
    \nconsole.log(temp.last); // undefined\n\ntemp \\= null;\n\nInstead of assigning\
    \ a new property to a string, the code actually \n\n­creates a new property on\
    \ a temporary object that is then destroyed. \n\nWhen you try to access that property\
    \ later, a different object is temporar-\n\nily created and the new property doesn’t\
    \ exist there. Although reference \n\nvalues are created automatically for primitive\
    \ values, when instanceof \n\nchecks for these types of values the result is false:\n\
    \nvar name \\= \"Nicholas\";\n\nvar count \\= 10;\n\nvar found \\= false;\n\n\
    console.log(name instanceof String); // false\n\nconsole.log(count instanceof\
    \ Number); // false\n\nconsole.log(found instanceof Boolean); // false\n\nThe\
    \ instanceof operator returns false because a temporary object is \n\ncreated\
    \ only when a value is read. Because instanceof doesn’t actually read \n\nanything,\
    \ no temporary objects are created, and it tells us the ­values aren’t \n\ninstances\
    \ of primitive wrapper types. You can create primitive wrapper \n\ntypes manually,\
    \ but there are certain side effects:\n\nvar name \\= new String(\"Nicholas\"\
    );\n\nvar count \\= new Number(10);\n\nvar found \\= new Boolean(false);\n\nconsole.log(typeof\
    \ name); // \"object\"\n\nconsole.log(typeof count); // \"object\"\n\nconsole.log(typeof\
    \ found); // \"object\"\n\nAs you can see, creating an instance of the primitive\
    \ wrapper type \n\njust creates another object, which means that typeof can’t\
    \ identify the type \n\nof data you intend to store. \n\nIn addition, you can’t\
    \ use String, Number, and Boolean objects as you \n\nwould primitive values. For\
    \ example, the following code uses a Boolean \n\nobject. The Boolean object is\
    \ false, yet console.log(\"Found\") still executes \n\nbecause an object is always\
    \ considered true inside a conditional statement. \n\nIt doesn’t matter that the\
    \ object represents false; it’s an object, so it evalu-\n\nates to true."
