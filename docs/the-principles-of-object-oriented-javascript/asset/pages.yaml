  md: "Object Patterns   **91**\n\nPerson.prototype.sayName \\= function() {\n\n console.log(this.name);\n\
    \n};\n\nu var person1 \\= Person(\"Nicholas\"); // note: missing \"new\"\n\nconsole.log(person1\
    \ instanceof Person); // false\n\nconsole.log(typeof person1); // \"undefined\"\
    \n\nconsole.log(name); // \"Nicholas\"\n\nIn this case, name is created as a global\
    \ variable because the Person con-\n\nstructor is called without new u. Keep in\
    \ mind that this code is running \n\nin nonstrict mode, as leaving out new would\
    \ throw an error in strict mode. \n\nThe fact that the constructor begins with\
    \ a capital letter usually indicates \n\nthat it should be preceded by new, but\
    \ what if you want to allow this use \n\ncase and have the function work without\
    \ new? Many built-in constructors, \n\nsuch as Array and RegExp, also work without\
    \ new because they are written \n\nto be *scope safe*. A scope-safe constructor\
    \ can be called with or without new \n\nand returns the same type of object in\
    \ either case. \n\nWhen new is called with a function, the newly created object\
    \ repre-\n\nsented by this is already an instance of the custom type represented\
    \ by \n\nthe constructor. So you can use instanceof to determine whether new was\
    \ \n\nused in the function call:\n\nfunction Person(name) {\n\n if (this instanceof\
    \ Person) {\n\n // called with \"new\"\n\n } else {\n\n // called without \"new\"\
    \n\n }\n\n}\n\nUsing a pattern like this lets you control what a function does\
    \ based \n\non whether it’s called with new or without. You may want to treat\
    \ each cir-\n\ncumstance differently, but you’ll often want the function to behave\
    \ the \n\nsame way (frequently, to protect against accidental omission of new).\
    \ A \n\nscope-safe version of Person looks like this:\n\nfunction Person(name)\
    \ {\n\n if (this instanceof Person) {\n\n this.name \\= name;\n\n } else {\n\n\
    \ return new Person(name);\n\n }\n\n}"
