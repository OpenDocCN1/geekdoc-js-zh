  md: "**Fo r e wor d**\n\nThe name Nicholas Zakas is synonymous with \n\nJavaScript\
    \ development itself. I could ramble on \n\nfor pages with his professional accolades,\
    \ but I am \n\nnot going to do that. Nicholas is well-known as a \n\nhighly skilled\
    \ JavaScript developer and author, and \n\nhe needs no introduction. However,\
    \ I would like to \n\noffer some personal thoughts before praising the \n\ncontents\
    \ of this book. \n\nMy relationship with Nicholas comes from years of studying\
    \ his books, \n\nreading his blog posts, watching him speak, and monitoring his\
    \ Twitter \n\nupdates as a JavaScript pupil. We first met in person when I asked\
    \ him \n\nto speak at a jQuery conference several years ago. He treated the jQuery\
    \ \n\ncommunity to a high-quality talk, and since then, we have spoken publicly\
    \ \n\nand privately over the Internet. In that time, I have come to admire him\
    \ \n\nas more than just a leader and developer in the JavaScript community. \n\
    \nHis words are always gracious and thoughtful, his demeanor always kind."
  merge: -1
  pgno: 13
- img_proc: true
  md: "**xiv**   Foreword\n\nHis intent as a developer, speaker, and author is always\
    \ to help, to edu-\n\ncate, and to improve. When he speaks, you should listen,\
    \ not just because \n\nhe is a JavaScript expert, but because his character rises\
    \ above his profes-\n\nsional status. \n\nThis book’s title and introduction make\
    \ Nicholas’s intentions clear: \n\nhe has written it to help class-minded (that\
    \ is, C++ or Java) programmers \n\ntransition to a language without classes. In\
    \ the book, he explains how \n\nencapsulation, aggregation, inheritance, and polymorphism\
    \ can be \n\naccomplished when writing JavaScript. This is the ideal text to bring\
    \ a \n\nknowledgeable programmer into the fold of object-oriented JavaScript \n\
    \ndevelopment. If you are reading this book as a developer from another \n\nlanguage,\
    \ you are about to be treated to a concise and skillfully worded \n\nJavaScript\
    \ book.\n\nHowever, this book also stands to serve programmers coming \n\nfrom within\
    \ the JavaScript fold. Many JavaScript developers have only \n\nan ECMAScript\
    \ 3 (ES3) understanding of objects, and they are in need \n\nof a proper introduction\
    \ to ECMAScript 5 (ES5) object features. This \n\nbook can serve as that introduction,\
    \ bridging a knowledge gap between \n\nES3 objects and ES5 objects. \n\nNow, you\
    \ might be thinking, “Big deal. Several books have included \n\nchapters or notes\
    \ on the additions to JavaScript found in ES5.” Well, that \n\nis true. However,\
    \ I believe this to be the only book written to date that \n\nfocuses on the nature\
    \ of objects by giving ES5 objects first-class citizen-\n\nship in the entire\
    \ narrative. This book brings a cohesive introduction to \n\nnot only ES5 objects,\
    \ but also the bits of ES3 that you need to grok while \n\nlearning many of the\
    \ new additions found in ES5.\n\nAs an author myself, I strongly believe this\
    \ is the one book, given its \n\nfocus on object-oriented principles and ES5 object\
    \ updates, that needed \n\nto be written as we await ES6 updates to scripting\
    \ environments.\n\nCody Lindley (*www.codylindley.com*)\n\nAuthor of *JavaScript\
    \ Enlightenment*, *DOM Enlightenment*, \n\nand *jQuery Enlightenment *\n\nBoise,\
    \ Idaho\n\nDecember 16, 2013"
  merge: -1
  pgno: 14
- img_proc: true
  md: "**Ack now l e dg m e n t s**\n\nI’d like to thank Kate Matsudaira for convincing\
    \ me that self-publishing \n\nan ebook was the best way to get this information\
    \ out. Without her advice, \n\nI’d probably still be trying to figure out what\
    \ I should do with the infor-\n\nmation contained in this book.\n\nThanks to Rob\
    \ Friesel for once again providing excellent feedback on \n\nan early copy of\
    \ this book, and Cody Lindley for his suggestions. Additional \n\nthanks to Angus\
    \ Croll for his technical review of the finished version—\n\nhis nitpicking made\
    \ this book much better.\n\nThanks as well to Bill Pollock, whom I met at a conference\
    \ and who \n\nstarted the ball rolling on publishing this book."
