    \nvar book \\= {\n\n title: \"The Principles of Object-Oriented JavaScript\",\n\
    \n toString: function() {\n\n return \"\\[Book \" + this.title + \"\\]\"\n\n }\n\
    \n};\n\nvar message \\= \"Book = \" + book;\n\n// \"Book = \\[Book The Principles\
    \ of Object-Oriented JavaScript\\]\"\n\nu console.log(message);\n\nThis code defines\
    \ a custom toString() method for book that returns a \n\nmore useful value u than\
    \ the inherited version. You don’t usually need \n\nto worry about defining a\
    \ custom toString() method, but it’s good to know \n\nthat it’s possible to do\
    \ so if necessary.\n\n***Modifying Object.prototype***\n\nAll objects inherit\
    \ from Object.prototype by default, so changes to Object \n\n.prototype affect\
    \ all objects. That’s a very dangerous situation. You were \n\nadvised in Chapter\
