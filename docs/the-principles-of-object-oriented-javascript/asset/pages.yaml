  md: "**34**   Chapter 3\n\nThe in operator looks for a property with a given name\
    \ in a specific \n\nobject and returns true if it finds it. In effect, the in\
    \ operator checks to see \n\nif the given key exists in the hash table. For example,\
    \ here’s what happens \n\nwhen in is used to check for some properties in the\
    \ person1 object:\n\nconsole.log(\"name\" in person1); // true\n\nconsole.log(\"\
    age\" in person1); // true\n\nconsole.log(\"title\" in person1); // false\n\n\
    Keep in mind that methods are just properties that reference func-\n\ntions, so\
    \ you can check for the existence of a method in the same way. \n\nThe following\
    \ adds a new function, sayName(), to person1 and uses in to \n\nconfirm the function’s\
    \ presence.\n\nvar person1 \\= {\n\n name: \"Nicholas\",\n\n sayName: function()\
    \ {\n\n console.log(this.name);\n\n }\n\n};\n\nconsole.log(\"sayName\" in person1);\
    \ // true\n\nIn most cases, the in operator is the best way to determine whether\
    \ \n\nthe property exists in an object. It has the added benefit of not evaluat-\n\
    \ning the value of the property, which can be important if such an evalua-\n\n\
    tion is likely to cause a performance issue or an error.\n\nIn some cases, however,\
    \ you might want to check for the existence of \n\na property only if it is an\
    \ own property. The in operator checks for both \n\nown properties and prototype\
    \ properties, so you’ll need to take a different \n\napproach. Enter the hasOwnProperty()\
    \ method, which is present on all objects \n\nand returns true only if the given\
    \ property exists and is an own property. \n\nFor example, the following code\
    \ compares the results of using in versus \n\n­hasOwnProperty() on different properties\
    \ in person1:\n\nvar person1 \\= {\n\n name: \"Nicholas\",\n\n sayName: function()\
    \ {\n\n console.log(this.name);\n\n }\n\n};\n\nconsole.log(\"name\" in person1);\
    \ // true\n\nconsole.log(person1.hasOwnProperty(\"name\")); // true\n\nconsole.log(\"\
    toString\" in person1); // true\n\nu console.log(person1.hasOwnProperty(\"toString\"\
    )); // false"
