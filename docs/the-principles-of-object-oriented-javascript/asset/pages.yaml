  md: "**26**   Chapter 2\n\nIn this example, a function called sayName is defined\
    \ first. Then, \n\ntwo object literals are created that assign sayName to be equal\
    \ to the \n\n­sayNameForAll function. Functions are just reference values, so\
    \ you can \n\nassign them as property values on any number of objects. When sayName()\
    \ \n\nis called on person1, it outputs \"Nicholas\"; when called on person2, it\
    \ out-\n\nputs \"Greg\". That’s because this is set when the function is called,\
    \ so \n\nthis.name is accurate. \n\nThe last part of this example defines a global\
    \ variable called name. \n\nWhen sayNameForAll() is called directly, it outputs\
    \ \"Michael\" because the \n\nglobal variable is considered a property of the\
    \ global object.\n\n***Changing this***\n\nThe ability to use and manipulate the\
    \ this value of functions is key to \n\ngood object-oriented programming in JavaScript.\
    \ Func­tions can be used \n\nin many different contexts, and they need to be able\
    \ to work in each situa-\n\ntion. Even though this is typically assigned automatically,\
    \ you can change \n\nits value to achieve different goals. There are three function\
    \ methods that \n\nallow you to change the value of this. (Remember that functions\
    \ are \n\nobjects, and objects can have methods, so functions can, too.)\n\n**The\
    \ call() Method**\n\nThe first function method for manipulating this is call(),\
    \ which executes \n\nthe function with a particular this value and with specific\
    \ parameters. \n\nThe first parameter of call() is the value to which this should\
    \ be equal \n\nwhen the function is executed. All subsequent parameters are the\
    \ param-\n\neters that should be passed into the function. For example, suppose\
    \ you \n\nupdate sayNameForAll() to take a parameter:\n\nfunction sayNameForAll(label)\
    \ {\n\n console.log(label + \":\" + this.name);\n\n}\n\nvar person1 \\= {\n\n\
    \ name: \"Nicholas\"\n\n};\n\nvar person2 \\= {\n\n name: \"Greg\"\n\n};\n\nvar\
    \ name \\= \"Michael\";\n\nsayNameForAll.call(this, \"global\"); // outputs \"\
    global:Michael\"\n\nsayNameForAll.call(person1, \"person1\"); // outputs \"person1:Nicholas\"\
    \n\nsayNameForAll.call(person2, \"person2\"); // outputs \"person2:Greg\""
