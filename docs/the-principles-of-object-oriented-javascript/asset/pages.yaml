    \ without new, the value of this \n\ninside of the constructor is equal to the\
    \ global this object. The variable \n\nperson1 doesn’t contain a value because\
    \ the Person constructor relies on \n\nnew to supply a return value. Without new,\
    \ Person is just a function without \n\na return statement. The assignment to\
    \ this.name actually creates a global"
