  md: "Understanding Objects   **37**\n\nKeep in mind that not all properties are\
    \ enumerable. In fact, most \n\nof the native methods on objects have their \\\
    [\\[Enumerable\\]\\] attribute set \n\nto false. You can check whether a property\
    \ is enumerable by using the \n\n­propertyIsEnumerable() method, which is present\
    \ on every object:\n\nvar person1 \\= {\n\n name: \"Nicholas\"\n\n};\n\nconsole.log(\"\
    name\" in person1); // true\n\nu console.log(person1.propertyIsEnumerable(\"name\"\
    )); // true\n\nvar properties \\= Object.keys(person1);\n\nconsole.log(\"length\"\
    \ in properties); // true\n\nv console.log(properties.propertyIsEnumerable(\"\
    length\")); // false\n\nHere, the property name is enumerable, as it is a custom\
    \ property \n\ndefined on person1 u. The length property for the ­properties array,\
    \ on \n\nthe other hand, is not enumerable v because it’s a built-in property\
    \ on \n\nArray.prototype. You’ll find that many native properties are not enumer-\n\
    \nable by default.\n\n**Types of Properties**\n\nThere are two different types\
    \ of properties: data properties and accessor \n\nproperties. *Data properties*\
    \ contain a value, like the name property from ear-\n\nlier examples in this chapter.\
    \ The default behavior of the \\[\\[Put\\]\\] method \n\nis to create a data property,\
    \ and every example up to this point in the \n\nchapter has used data properties.\
    \ *Accessor properties* don’t contain a value \n\nbut instead define a function\
    \ to call when the property is read (called \n\na *getter*), and a function to\
    \ call when the property is written to (called a \n\n*setter*). Accessor properties\
    \ only require either a getter or a setter, though \n\nthey can have both.\n\n\
    There is a special syntax to define an accessor property using an \n\nobject literal:\n\
    \nvar person1 \\= {\n\nu \\_name: \"Nicholas\",\n\nv get name() {\n\n console.log(\"\
    Reading name\");\n\n return this.\\_name;\n\n },"
