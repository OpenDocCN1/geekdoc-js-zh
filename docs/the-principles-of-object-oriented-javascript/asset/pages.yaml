    \ returned instead of the newly created object instance. If the *\n\n*returned\
    \ value is a primitive, the newly created object is used and the returned *\n\n\
    *value is ignored.*\n\nConstructors allow you to initialize an instance of a type\
    \ in a \n\n­consistent way, performing all of the property setup that is necessary\
    \ \n\nbefore the object can be used. For example, you could also use Object \n\
    \n.­defineProperty() inside of a constructor to help initialize the instance:\n\
    \nfunction Person(name) {\n\n Object.defineProperty(this, \"name\", {\n\n get:\
