  md: "Constructors and Prototypes   **53**\n\nvariable called name, which is where\
    \ the name passed to Person is stored. \n\nChapter 6 describes a solution to both\
    \ this problem and more complex \n\nobject composition patterns.\n\n**N O T E***\
    \ An error occurs if you call the **Person** constructor in strict mode without\
    \ using **new**. *\n\n*This is because strict mode doesn’t assign **this** to\
    \ the global object. Instead, **this*\n\n*remains **undefined**, and an error\
    \ occurs whenever you attempt to create a property *\n\n*on **undefined**.*\n\n\
    Constructors allow you to configure object instances with the same \n\nproperties,\
    \ but constructors alone don’t eliminate code redundancy. \n\nIn the example code\
    \ thus far, each instance has had its own sayName() \n\nmethod even though sayName()\
    \ doesn’t change. That means if you have \n\n100 instances of an object, then\
    \ there are 100 copies of a function that \n\ndo the exact same thing, just with\
    \ different data. \n\nIt would be much more efficient if all of the instances\
    \ shared one \n\nmethod, and then that method could use this.name to retrieve\
    \ the appro-\n\npriate data. This is where prototypes come in.\n\n**Prototypes**\n\
    \nYou can think of a *prototype* as a recipe for an object. Almost every func-\n\
    \ntion (with the exception of some built-in functions) has a prototype prop-\n\
    \nerty that is used during the creation of new instances. That prototype is \n\
    \nshared among all of the object instances, and those instances can access \n\n\
    properties of the prototype. For example, the hasOwnProperty() method is \n\n\
    defined on the generic Object prototype, but it can be accessed from any \n\n\
    object as if it were an own property, as shown in this example:\n\nvar book =\
    \ {\n\n title: \"The Principles of Object-Oriented JavaScript\"\n\n};\n\nconsole.log(\"\
    title\" in book); // true\n\nconsole.log(book.hasOwnProperty(\"title\")); // true\n\
    \nconsole.log(\"hasOwnProperty\" in book); // true\n\nconsole.log(book.hasOwnProperty(\"\
    hasOwnProperty\")); // false\n\nconsole.log(Object.prototype.hasOwnProperty(\"\
    hasOwnProperty\")); // true\n\nEven though there is no definition for hasOwnProperty()\
    \ on book, that \n\nmethod can still be accessed as book.hasOwnProperty() because\
    \ the defi-\n\nnition does exist on Object.prototype. Remember that the in operator\
    \ \n\nreturns true for both prototype properties *and* own properties."
