  md: "**6**   Chapter 1\n\n***Primitive Methods***\n\nDespite the fact that they’re\
    \ primitive types, strings, numbers, and \n\nBooleans actually have methods. (The\
    \ null and undefined types have \n\nno methods.) Strings, in particular, have\
    \ numerous methods to help \n\nyou work with them. For example:\n\nvar name \\\
    = \"Nicholas\";\n\nvar lowercaseName \\= name.toLowerCase(); // convert to lowercase\n\
    \nvar firstLetter \\= name.charAt(0); // get first character\n\nvar middleOfName\
    \ \\= name.substring(2, 5); // get characters 2-4\n\nvar count \\= 10;\n\nvar\
    \ fixedCount \\= count.toFixed(2); // convert to \"10.00\"\n\nvar hexCount \\\
    = count.toString(16); // convert to \"a\"\n\nvar flag \\= true;\n\nvar stringFlag\
    \ \\= flag.toString(); // convert to \"true\"\n\n**N O T E*** Despite the fact\
    \ that they have methods, primitive values themselves are not objects. *\n\n*JavaScript\
    \ makes them look like objects to provide a consistent experience in the *\n\n\
    *language, as you’ll see later in this chapter.*\n\n**Reference Types**\n\nReference\
    \ types represent objects in JavaScript and are the closest things \n\nto classes\
    \ that you will find in the language. Reference values are *instances* \n\nof\
    \ reference types and are synonymous with objects (the rest of this chap-\n\n\
    ter refers to reference values simply as *objects*). An object is an unordered\
    \ \n\nlist of *properties* consisting of a name (always a string) and a value.\
    \ When \n\nthe value of a property is a function, it is called a *method*. Functions\
    \ them-\n\nselves are actually reference values in JavaScript, so there’s little\
    \ differ-\n\nence between a property that contains an array and one that contains\
    \ a \n\nfunction except that a function can be executed.\n\nOf course, you must\
    \ create objects before you can begin work­ing \n\nwith them. \n\n***Creating\
    \ Objects***\n\nIt sometimes helps to think of JavaScript \n\nobjects as nothing\
    \ more than hash tables, \n\nas shown in Figure 1-2.\n\nThere are a couple of\
    \ ways to ­create, \n\nor *instantiate*, objects. The first is to use \n\nthe\
    \ new operator with a *constructor*. (A con-\n\nstructor is simply a function\
    \ that uses new \n\nto create an object—any function can be \n\nObject\n\nname\n\
    \nvalue\n\nname\n\nvalue\n\n*Figure 1-2: Structure of an object*"
