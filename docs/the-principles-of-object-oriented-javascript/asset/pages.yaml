  md: "**In t rodu c t ion**\n\nMost developers associate object-oriented \n\npro­gramming\
    \ with languages that are typi-\n\ncally taught in school, like C++ and Java,\
    \ \n\nwhich base object-oriented programming \n\naround classes. Before you can\
    \ do anything in \n\nthese languages, you need to ­create a class, even if \n\n\
    you’re just writing a simple command-line program.\n\nCommon design patterns in\
    \ the industry ­reinforce class-based concepts \n\nas well. But JavaScript doesn’t\
    \ use classes, and this is part of the reason \n\npeople get confused when they\
    \ try learning it after C++ or Java.\n\nObject-oriented languages have several\
    \ characteristics:\n\n**Encapsulation**  Data can be grouped together with functionality\
    \ \n\nthat operates on that data. This, quite simply, is the definition of \n\n\
    an object."
  merge: -1
  pgno: 17
- img_proc: true
  md: "**xviii**   Introduction\n\n**Aggregation**  One object can reference another\
    \ object.\n\n**Inheritance**  A newly created object has the same characteristics\
    \ \n\nas another object without explicitly duplicating its functionality.\n\n\
    **Polymorphism**  One interface may be implemented by multiple \n\nobjects.\n\n\
    JavaScript has all these characteristics, though because the language \n\nhas\
    \ no concept of classes, some aren’t implemented in quite the way you \n\nmight\
    \ expect. At first glance, a JavaScript program might even look like \n\na procedural\
    \ program you would write in C. If you can write a function \n\nand pass it some\
    \ variables, you have a working script that seemingly has \n\nno objects. A closer\
    \ look at the language, however, reveals the existence \n\nof objects through\
    \ the use of dot notation.\n\nMany object-oriented languages use dot notation\
    \ to access properties \n\nand methods on objects, and JavaScript is syntactically\
    \ the same. But in \n\nJavaScript, you never need to write a class definition,\
    \ import a package, \n\nor include a header file. You just start coding with the\
    \ data types that you \n\nwant, and you can group those together in any number\
    \ of ways. You could \n\ncertainly write JavaScript in a procedural way, but its\
