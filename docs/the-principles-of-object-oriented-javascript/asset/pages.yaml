  md: "**28**   Chapter 2\n\n**The bind() Method**\n\nThe third function method for\
    \ changing this is bind(). This method was \n\nadded in ECMAScript 5, and it behaves\
    \ quite differently than the other \n\ntwo. The first argument to bind() is the\
    \ this value for the new function. \n\nAll other arguments represent named parameters\
    \ that should be perma-\n\nnently set in the new function. You can still pass\
    \ in any parameters that \n\naren’t permanently set later. \n\nThe following code\
    \ shows two examples that use bind(). You create \n\nthe sayNameForPerson1() function\
    \ by binding the this value to person1, while \n\nsayNameForPerson2() binds this\
    \ to person2 and binds the first parameter as \n\n\"person2\".\n\nfunction sayNameForAll(label)\
    \ {\n\n console.log(label + \":\" + this.name);\n\n}\n\nvar person1 \\= {\n\n\
    \ name: \"Nicholas\"\n\n};\n\nvar person2 \\= {\n\n name: \"Greg\"\n\n};\n\n//\
    \ create a function just for person1\n\nu var sayNameForPerson1 \\= sayNameForAll.bind(person1);\n\
    \nsayNameForPerson1(\"person1\"); // outputs \"person1:Nicholas\"\n\n// create\
    \ a function just for person2\n\nv var sayNameForPerson2 \\= sayNameForAll.bind(person2,\
    \ \"person2\");\n\nsayNameForPerson2(); // outputs \"person2:Greg\"\n\n// attaching\
    \ a method to an object doesn't change 'this'\n\nw person2.sayName \\= sayNameForPerson1;\n\
    \nperson2.sayName(\"person2\"); // outputs \"person2:Nicholas\"\n\nNo parameters\
    \ are bound for sayNameForPerson1() u, so you still need \n\nto pass in the label\
    \ for the output. The function sayNameForPerson2() not \n\nonly binds this to\
    \ person2 but also binds the first parameter as \"person2\" v. \n\nThat means\
    \ you can call ­sayNameForPerson2() without passing in any addi-\n\ntional arguments.\
    \ The last part of this example adds sayNameForPerson1() \n\nonto person2 with\
    \ the name sayName w. The function is bound, so the value \n\nof this doesn’t\
    \ change even though sayNameForPerson1 is now a function on \n\nperson2. The method\
    \ still outputs the value of person1.name."
