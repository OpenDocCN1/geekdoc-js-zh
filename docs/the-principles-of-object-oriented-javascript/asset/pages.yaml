  md: "Constructors and Prototypes   **57**\n\n***Using Prototypes with Constructors***\n\
    \nThe shared nature of prototypes makes them ideal for defining methods \n\nonce\
    \ for all objects of a given type. Because methods tend to do the same \n\nthing\
    \ for all instances, there’s no reason each instance needs its own set \n\nof\
    \ methods. \n\nIt’s much more efficient to put the methods on the prototype and\
    \ \n\nthen use this to access the current instance. For example, consider the\
    \ \n\nfollowing new Person constructor:\n\nfunction Person(name) {\n\n this.name\
    \ \\= name;\n\n}\n\nu Person.prototype.sayName \\= function() {\n\n console.log(this.name);\n\
    \n};\n\nvar person1 \\= new Person(\"Nicholas\");\n\nvar person2 \\= new Person(\"\
    Greg\");\n\nconsole.log(person1.name); // \"Nicholas\"\n\nconsole.log(person2.name);\
    \ // \"Greg\"\n\nperson1.sayName(); // outputs \"Nicholas\"\n\nperson2.sayName();\
    \ // outputs \"Greg\"\n\nIn this version of the Person constructor, sayName()\
    \ is defined on the \n\nprototype u instead of in the constructor. The object\
    \ instances work \n\nexactly the same as the example from earlier in this chapter,\
    \ even though \n\nsayName() is now a prototype property instead of an own property.\
    \ Because \n\nperson1 and person2 are each base references for their calls to\
    \ sayName(), the \n\nthis value is assigned to person1 and person2, respectively.\n\
    \nYou can also store other types of data on the prototype, but be care-\n\nful\
    \ when using reference values. Because these values are shared across \n\ninstances,\
    \ you might not expect one instance to be able to change values \n\nthat another\
    \ instance will access. This example shows what can happen \n\nwhen you don’t\
    \ watch where your reference values are pointing:\n\nfunction Person(name) {\n\
    \n this.name \\= name;\n\n}\n\nPerson.prototype.sayName \\= function() {\n\n console.log(this.name);\n\
    \n};"
