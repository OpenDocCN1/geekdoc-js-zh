  md: "Functions   **25**\n\n***The this Object***\n\nYou may have noticed something\
    \ strange in the previous ­example. The \n\n­sayName() method references person.name\
    \ directly, which creates tight cou-\n\npling between the method and the object.\
    \ This is problematic for a num-\n\nber of reasons. First, if you change the variable\
    \ name, you also need to \n\nremember to change the reference to that name in\
    \ the method. Second, \n\nthis sort of tight coupling makes it difficult to use\
    \ the same function for \n\ndifferent objects. Fortunately, JavaScript has a way\
    \ around this issue.\n\nEvery scope in JavaScript has a this object that represents the\
    \ call-\n\ning object for the function. In the global scope, this represents the\
    \ \n\nglobal object (window in web browsers). When a function is called while\
    \ \n\nattached to an object, the value of this is equal to that object by default.\
    \ \n\nSo, instead of directly referencing an object inside a method, you can ref-\n\
    \nerence this instead. For example, you can rewrite the code from the pre-\n\n\
    vious example to use this:\n\nvar person \\= {\n\n name: \"Nicholas\",\n\n sayName:\
    \ function() {\n\n console.log(this.name);\n\n }\n\n};\n\nperson.sayName(); //\
    \ outputs \"Nicholas\"\n\nThis code works the same as the earlier version, but\
    \ this time, sayName() \n\nreferences this instead of person. That means you can\
    \ easily change the \n\nname of the variable or even reuse the function on different\
    \ objects.\n\nfunction sayNameForAll() {\n\n console.log(this.name);\n\n}\n\n\
    var person1 \\= {\n\n name: \"Nicholas\",\n\n sayName: sayNameForAll\n\n};\n\n\
    var person2 \\= {\n\n name: \"Greg\",\n\n sayName: sayNameForAll\n\n};\n\nvar\
    \ name \\= \"Michael\";\n\nperson1.sayName(); // outputs \"Nicholas\"\n\nperson2.sayName();\
    \ // outputs \"Greg\"\n\nsayNameForAll(); // outputs \"Michael\""
