  md: "**12**   Chapter 1\n\nThis syntax is very useful when you want to dynamically\
    \ decide which \n\nproperty to access. For example, here bracket notation allows\
    \ you to use a \n\nvariable instead of the string literal to specify the property\
    \ to access.\n\nvar array \\= \\[\\];\n\nvar method \\= \"push\";\n\narray\\[method\\\
    ](12345);\n\nIn this listing, the variable method has a value of \"push\", so\
    \ push() is \n\ncalled on the array. This capability is quite useful, as you’ll\
    \ see through-\n\nout this book. The point to remember is that, other than syntax,\
    \ the \n\nonly difference—performance or otherwise—between dot notation and \n\
    \nbracket notation is that bracket notation allows you to use special char-\n\n\
    acters in property names. Developers tend to find dot notation easier \n\nto read,\
    \ so you’ll see it used more frequently than bracket notation.\n\n**Identifying\
    \ Reference Types**\n\nA function is the easiest reference type to identify because\
    \ when you use \n\nthe typeof operator on a function, the operator should return\
    \ \"function\":\n\nfunction reflect(value) {\n\n return value;\n\n}\n\nconsole.log(typeof\
    \ reflect); // \"function\"\n\nOther reference types are trickier to identify\
    \ because, for all reference \n\ntypes other than functions, typeof returns \"\
    object\". That’s not very help-\n\nful when you’re dealing with a lot of different\
    \ types. To identify reference \n\ntypes more easily, you can use JavaScript’s\
    \ instanceof operator. \n\nThe instanceof operator takes an object and a constructor\
    \ as param-\n\neters. When the value is an instance of the type that the constructor\
    \ speci-\n\nfies, instanceof returns true; otherwise, it returns false, as you\
    \ can see here:\n\nvar items \\= \\[\\];\n\nvar object \\= {};\n\nfunction reflect(value)\
    \ {\n\n return value;\n\n}\n\nconsole.log(items instanceof Array); // true\n\n\
    console.log(object instanceof Object); // true\n\nconsole.log(reflect instanceof\
    \ Function); // true"
