  md: "Primitive and Reference Types   **7**\n\na constructor.) By convention, constructors\
    \ in JavaScript begin with a \n\ncapital letter to distinguish them from nonconstructor\
    \ functions. For \n\nexample, this code instantiates a generic object and stores\
    \ a reference \n\nto it in object:\n\nvar object \\= new Object();\n\nReference\
    \ types do not store the object directly into the variable to \n\nwhich it is\
    \ assigned, so the object variable in this example doesn’t actually \n\ncontain\
    \ the object instance. Instead, it holds a pointer (or reference) to \n\nthe location\
    \ in memory where the object exists. This is the primary dif-\n\nference between\
    \ objects and primitive values, as the primitive is stored \n\ndirectly in the\
    \ variable.\n\nWhen you assign an object to a variable, you’re actually assigning\
    \ a \n\npointer. That means if you assign one variable to another, each variable\
    \ \n\ngets a copy of the pointer, and both still reference the same object in\
    \ \n\nmemory. For example:\n\nvar object1 \\= new Object();\n\nvar object2 \\\
    = object1;\n\nThis code first creates an object (with new) and stores a reference\
    \ in \n\nobject1. Next, object2 is assigned the value of object1. There is still\
    \ only \n\nthe one instance of the object that was created on the first line,\
    \ but both \n\nvariables now point to that object, as illustrated in Figure 1-3.\n\
    \nVariable Object\n\nobject1\n\nobject1\n\nObject\n\nMemory\n\n*Figure 1-3: Two\
    \ variables pointing to one object*\n\n***Dereferencing Objects***\n\nJavaScript\
    \ is a garbage-collected language, so you don’t really need to \n\nworry about\
    \ memory allocations when you use reference types. However, \n\nit’s best to *dereference*\
    \ objects that you no longer need so that the garbage \n\ncollector can free up\
    \ that memory. The best way to do this is to set the \n\nobject variable to null."
