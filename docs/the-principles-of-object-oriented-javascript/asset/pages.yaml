  md: "Understanding Objects   **39**\n\n***Common Attributes***\n\nThere are two\
    \ property attributes shared between data and accessor \n\nproperties. One is\
    \ \\[\\[Enumerable\\]\\], which determines whether you can \n\n­iterate over the\
    \ property. The other is \\[\\[Configurable\\]\\], which determines \n\nwhether\
    \ the property can be changed. You can remove a configurable \n\nproperty using\
    \ delete and can change its attributes at any time. (This also \n\nmeans configurable\
    \ properties can be changed from data to accessor \n\nproperties and vice versa.)\
    \ By default, all properties you declare on an \n\nobject are both enumerable\
    \ and configurable.\n\nIf you want to change property attributes, you can use\
    \ the Object \n\n.defineProperty() method. This method accepts three arguments:\
    \ the \n\nobject that owns the property, the property name, and a *property descrip-*\n\
    \n*tor* object containing the attributes to set. The descriptor has properties\
    \ \n\nwith the same name as the internal attributes but without the square \n\n\
    brackets. So you use ­enumerable to set \\[\\[Enumerable\\]\\], and configurable\
    \ \n\nto set \\[\\[Configurable\\]\\]. For example, suppose you want to make an\
    \ object \n\nproperty nonenumerable and nonconfigurable:\n\nvar person1 \\= {\n\
    \nu name: \"Nicholas\"\n\n};\n\nObject.defineProperty(person1, \"name\", {\n\n\
    v enumerable: false\n\n});\n\nconsole.log(\"name\" in person1); // true\n\nw console.log(person1.propertyIsEnumerable(\"\
    name\")); // false\n\nvar properties \\= Object.keys(person1);\n\nconsole.log(properties.length);\
    \ // 0\n\nObject.defineProperty(person1, \"name\", {\n\nx configurable: false\n\
    \n});\n\n// try to delete the Property\n\ndelete person1.name;\n\ny console.log(\"\
    name\" in person1); // true\n\nconsole.log(person1.name); // \"Nicholas\"\n\n\
    z Object.defineProperty(person1, \"name\", { // error!!!\n\n configurable: true\n\
    \n});\n\nThe name property is defined as usual u, but it’s then modified to set\
    \ \n\nits \\[\\[Enumerable\\]\\] attribute to false v. The ­propertyIsEnumerable()\
    \ method \n\nnow returns false w because it references the new value of \\[\\\
    [Enumerable\\]\\]."
