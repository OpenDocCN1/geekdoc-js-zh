  md: "**80**   Chapter 6\n\n**Private and Privileged Members**\n\nAll object properties\
    \ in JavaScript are public, and there’s no explicit way \n\nto indicate that a\
    \ property shouldn’t be accessed from outside a particu-\n\nlar object. At some\
    \ point, however, you might not want data to be public. \n\nFor example, when\
    \ an object uses a value to determine some sort of state, \n\nmodifying that data\
    \ without the object’s knowledge throws the state man-\n\nagement process into\
    \ chaos. One way to avoid this is by using naming \n\nconventions. For example,\
    \ it’s quite common to prefix properties with an \n\nunderscore (such as this.\\\
    _name) when they are not intended to be public. \n\nHowever, there are ways of\
    \ hiding data that don’t rely on convention and \n\nare therefore more “bulletproof”\
    \ in preventing the modification of pri-\n\nvate information.\n\n***The Module\
    \ Pattern***\n\nThe *module pattern* is an object-creation pattern designed to\
    \ create single-\n\nton objects with private data. The basic approach is to use\
    \ an *immediately *\n\n*invoked function expression (IIFE)* that returns an object.\
    \ An IIFE is a func-\n\ntion expression that is defined and then called immediately\
    \ to produce a \n\nresult. That function expression can contain any number of\
    \ local variables \n\nthat aren’t accessible from outside that function. Because\
    \ the returned \n\nobject is defined within that function, the object’s methods\
    \ have access \n\nto the data. (All objects defined within the IIFE have access\
    \ to the same \n\nlocal variables.) Methods that access private data in this way\
    \ are called \n\n*privileged* methods. Here’s the basic format for the module\
    \ pattern:\n\nvar yourObject \\= (function() {\n\n // private data variables\n\
    \n return {\n\n // public methods and properties\n\n };\n\nu }());\n\nIn this\
    \ pattern, an anonymous function is created and exe­cuted \n\nimmediately. (Note\
    \ the extra parentheses at the end of the function u. \n\nYou can execute anonymous\
    \ functions immediately using this syntax.) \n\nThat means the function exists\
    \ for just a moment, is executed, and then \n\nis destroyed. IIFEs are a very\
    \ popular pattern in JavaScript, partially for \n\ntheir use in the module pattern."
