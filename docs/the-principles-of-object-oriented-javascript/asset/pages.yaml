  md: "**4**   Chapter 1\n\nHere, color1 is assigned the value \n\nof \"red\". The\
    \ variable color2 is then \n\nassigned the value color1, which stores \n\n\"red\"\
    \ in color2. Even though color1 and \n\ncolor2 contain the same value, they are\
    \ \n\ncompletely separate from each other, \n\nand you can change the value in\
    \ color1 \n\nwithout affecting color2 and vice versa. \n\nThat’s because there\
    \ are two different \n\nstorage locations, one for each variable. \n\nFigure 1-1\
    \ illustrates the variable object \n\nfor this snippet of code.\n\nBecause each\
    \ variable containing a primitive value uses its own \n\n­storage space, changes\
    \ to one variable are not reflected on the other. \n\nFor example:\n\nvar color1\
    \ \\= \"red\";\n\nvar color2 \\= color1;\n\nconsole.log(color1); // \"red\"\n\n\
    console.log(color2); // \"red\"\n\ncolor1 \\= \"blue\";\n\nconsole.log(color1);\
    \ // \"blue\"\n\nconsole.log(color2); // \"red\"\n\nIn this code, color1 is changed\
    \ to \"blue\" and color2 retains its original \n\nvalue of \"red\". \n\n***Identifying\
    \ Primitive Types***\n\nThe best way to identify primitive types is with the typeof\
    \ operator, \n\nwhich works on any variable and returns a string indicating the\
    \ type of \n\ndata. The typeof operator works well with strings, numbers, Booleans,\
    \ and \n\nundefined. The following shows the output when using typeof on different\
    \ \n\nprimitive values:\n\nconsole.log(typeof \"Nicholas\"); // \"string\"\n\n\
    console.log(typeof 10); // \"number\"\n\nconsole.log(typeof 5.1); // \"number\"\
    \n\nconsole.log(typeof true); // \"boolean\"\n\nconsole.log(typeof undefined);\
    \ // \"undefined\"\n\n*Figure 1-1: Variable object*\n\nVariable Object\n\ncolor1\n\
    \n\"red\"\n\ncolor2\n\n\"red\""
