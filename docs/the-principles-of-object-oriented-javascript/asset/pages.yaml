  md: "**82**   Chapter 6\n\nThere is a variation of the module pattern called the\
    \ *revealing module *\n\n*pattern*, which arranges all variables and methods at\
    \ the top of the IIFE \n\nand simply assigns them to the returned object. You\
    \ can write the previ-\n\nous example using the revealing module pattern as follows:\n\
    \nvar person \\= (function() {\n\n var age \\= 25;\n\n function getAge() {\n\n\
    \ return age;\n\n }\n\n function growOlder() {\n\n age++;\n\n }\n\n return {\n\
    \n name: \"Nicholas\",\n\nu getAge: getAge,\n\n growOlder: growOlder\n\n };\n\n\
    }());\n\nIn the revealing module pattern, age, getAge(), and growOlder() are \n\
    \nall defined as local to the IIFE. The getAge() and growOlder() functions \n\n\
    are then assigned to the returned object u, effectively “revealing” them \n\n\
    outside the IIFE. This code is essentially the same as the earlier example \n\n\
    using the traditional module pattern; however, some prefer this pattern \n\nbecause\
    \ it keeps all variable and function declarations together.\n\n***Private Members\
    \ for Constructors***\n\nThe module pattern is great for defining individual objects\
    \ that have pri-\n\nvate properties, but what about custom types that also require\
    \ their own \n\nprivate properties? You can use a pattern that’s similar to the\
    \ module \n\npattern inside the constructor to create instance-specific private\
    \ data. \n\nFor example:\n\nfunction Person(name) {\n\n // define a variable only\
    \ accessible inside of the Person constructor\n\n var age \\= 25;\n\n this.name\
    \ \\= name;\n\nu this.getAge \\= function() {\n\n return age;\n\n };"
