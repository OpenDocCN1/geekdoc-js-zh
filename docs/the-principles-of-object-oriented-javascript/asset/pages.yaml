  md: "Understanding Objects   **33**\n\nto a second value results in a call to \\\
    [\\[Set\\]\\]. See Figure 3-1 for a step-by-\n\nstep view of what happened to\
    \ person1 behind the scenes as its name and age \n\nproperties were changed.\n\
    \nperson1\n\nname\n\n\"Nicholas\"\n\n\\[\\[Put\\]\\]name\n\nperson1\n\nname\n\n\
    \"Nicholas\"\n\nage\n\n\"Redacted\"\n\nperson1\n\nname\n\n\"Greg\"\n\nage\n\n\"\
    Redacted\"\n\n\\[\\[Put\\]\\]age\n\n\\[\\[Set\\]\\]name\n\n*Figure 3-1: Adding\
    \ and changing properties of an object*\n\nIn the first part of the diagram, an\
    \ object literal is used to create the \n\nperson1 object. This performs an implicit\
    \ \\[\\[Put\\]\\] for the name property. \n\nAssigning a value to person1.age\
    \ performs a \\[\\[Put\\]\\] for the age property. \n\nHowever, setting person1.name\
    \ to a new value (\"Greg\") performs a \\[\\[Set\\]\\] \n\noperation on the name\
    \ property, overwriting the existing property value.\n\n**Detecting Properties**\n\
    \nBecause properties can be added at any time, it’s sometimes necessary to \n\n\
    check whether a property exists in the object. New JavaScript developers \n\n\
    often incorrectly use patterns like the following to detect whether a prop-\n\n\
    erty exists:\n\n// unreliable\n\nif (person1.age) {\n\n // do something with age\n\
    \n}\n\nThe problem with this pattern is how JavaScript’s type coercion affects\
    \ \n\nthe outcome. The if condition evaluates to true if the value is *truthy*\
    \ (an \n\nobject, a nonempty string, a nonzero number, or true) and evaluates\
    \ to \n\nfalse if the value is *falsy* (null, undefined, 0, false, NaN, or an\
    \ empty string). \n\nBecause an object property can contain one of these falsy\
    \ values, the \n\nexample code can yield false negatives. For instance, if person1.age\
    \ is 0, \n\nthen the if condition will not be met even though the property exists.\
    \ \n\nA more reliable way to test for the existence of a property is with the\
    \ in \n\noperator."
