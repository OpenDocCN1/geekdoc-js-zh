    = newName;\n\n },\n\n enumerable: true,\n\n configurable: true\n\n });\n\n this.sayName\
    \ \\= function() {\n\n console.log(this.name);\n\n };\n\n}\n\nIn this version\
    \ of the Person constructor, the name property is an \n\n­accessor property that\
