  md: "Primitive and Reference Types   **3**\n\n**Primitive Types**\n\nPrimitive types\
    \ represent simple pieces of data that are stored as is, such \n\nas true and\
    \ 25. There are five primitive types in JavaScript: \n\n**Boolean**\n\ntrue or\
    \ false\n\n**Number**\n\nAny integer or floating-point numeric value\n\n**String**\n\
    \nA character or sequence of characters delimited \n\nby either single or double\
    \ quotes (JavaScript has no \n\nseparate character type)\n\n**Null**\n\nA primitive\
    \ type that has only one value, null\n\n**Undefined**\n\nA primitive type that\
    \ has only one value, ­undefined \n\n(undefined is the value assigned to a variable\
    \ that is not \n\ninitialized)\n\nThe first three types (Boolean, number, and\
    \ string) behave in similar \n\nways, while the last two (null and undefined)\
    \ work a bit differently, as will \n\nbe discussed throughout this chapter. All\
    \ primitive types have literal rep-\n\nresentations of their values. *Literals*\
    \ represent values that aren’t stored in a \n\nvariable, such as a hardcoded name\
    \ or price. Here are some examples of \n\neach type using its literal form:\n\n\
    // strings\n\nvar name \\= \"Nicholas\";\n\nvar selection \\= \"a\";\n\n// numbers\n\
    \nvar count \\= 25;\n\nvar cost \\= 1.51;\n\n// boolean\n\nvar found \\= true;\n\
    \n// null\n\nvar object \\= null;\n\n// undefined\n\nvar flag \\= undefined;\n\
    \nvar ref; // assigned undefined automatically\n\nIn JavaScript, as in many other\
    \ languages, a variable holding a \n\nprimitive directly contains the primitive\
    \ value (rather than a pointer to \n\nan object). When you assign a primitive\
    \ value to a variable, the value is \n\ncopied into that variable. This means\
    \ that if you set one variable equal \n\nto another, each variable gets its own\
    \ copy of the data. For example:\n\nvar color1 \\= \"red\";\n\nvar color2 \\=\
    \ color1;"
