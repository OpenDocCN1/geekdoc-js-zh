  md: "**20**   Chapter 2\n\nIn this code, there is a function declaration for sayHi\
    \ u. A variable \n\nnamed sayHi2 is then created and assigned the value of sayHi\
    \ v. Both sayHi \n\nand sayHi2 are now pointing to the same function, and that\
    \ means either \n\ncan be executed, with the same result. To understand why this\
    \ happens, \n\ntake a look at the same code rewritten to use the Function constructor:\n\
    \nvar sayHi \\= new Function(\"console.log(\\\\\"Hi!\\\\\");\");\n\nsayHi(); //\
    \ outputs \"Hi!\"\n\nvar sayHi2 \\= sayHi;\n\nsayHi2(); // outputs \"Hi!\"\n\n\
    The Function constructor makes it more explicit that sayHi can be \n\npassed around\
    \ just like any other object. When you keep in mind that \n\nfunctions are objects,\
    \ a lot of the behavior starts to make sense.\n\nFor instance, you can pass a\
    \ function into another function as an \n\nargument. The sort() method on JavaScript\
    \ arrays accepts a comparison \n\nfunction as an optional parameter. The comparison\
    \ function is called \n\nwhenever two values in the array must be compared. If\
    \ the first value is \n\nsmaller than the second, the comparison function must\
    \ return a nega-\n\ntive number. If the first value is larger than the second,\
    \ the function \n\nmust return a positive number. If the two values are equal,\
    \ the function \n\nshould return zero. \n\nBy default, sort() converts every item\
    \ in an array to a string and then \n\nperforms a comparison. That means you can’t\
    \ accurately sort an array \n\nof numbers without specifying a comparison function.\
    \ For example, you \n\nneed to include a comparison function to accurately sort\
    \ an array of num-\n\nbers, such as:\n\nvar numbers \\= \\[ 1, 5, 8, 4, 7, 10,\
    \ 2, 6 \\];\n\nu numbers.sort(function(first, second) {\n\n return first - second;\n\
    \n});\n\nconsole.log(numbers); // \"\\[1, 2, 4, 5, 6, 7, 8, 10\\]\"\n\nv numbers.sort();\n\
    \nconsole.log(numbers); // \"\\[1, 10, 2, 4, 5, 6, 7, 8\\]\"\n\nIn this example,\
    \ the comparison function u that is passed into sort() \n\nis actually a function\
    \ expression. Note that there is no name for the func-\n\ntion; it exists only\
    \ as a reference that is passed into another function \n\n(making it an *anonymous\
    \ function*). Subtracting the two values returns \n\nthe correct result from the\
    \ comparison function."
