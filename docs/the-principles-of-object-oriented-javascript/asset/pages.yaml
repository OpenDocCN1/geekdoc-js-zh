  md: "**18**   Chapter 2\n\nexpressions, which were thus incorrectly identified as\
    \ functions. All \n\nbrowsers now behave the same, so typeof no longer identifies\
    \ regular \n\nexpressions as functions.\n\nThis chapter discusses the various\
    \ ways that functions are defined \n\nand executed in JavaScript. Because functions\
    \ are objects, they behave \n\ndifferently than functions in other languages,\
    \ and this behavior is central \n\nto a good understanding of JavaScript.\n\n\
    **Declarations vs. Expressions**\n\nThere are actually two literal forms of functions.\
    \ The first is a *function *\n\n*declaration*, which begins with the function\
    \ keyword and includes the name \n\nof the function immediately following it.\
    \ The contents of the function are \n\nenclosed in braces, as shown in this declaration:\n\
    \nfunction add(num1, num2) {\n\n return num1 + num2;\n\n}\n\nThe second form is\
    \ a *function expression*, which doesn’t require a name \n\nafter function. These\
    \ functions are considered anonymous because the \n\nfunction object itself has\
    \ no name. Instead, function expressions are typi-\n\ncally referenced via a variable\
    \ or property, as in this expression:\n\nvar add \\= function(num1, num2) {\n\n\
    \ return num1 + num2;\n\n};\n\nThis code actually assigns a function value to\
    \ the variable add. The \n\nfunction expression is almost identical to the function\
    \ declaration except \n\nfor the missing name and the semicolon at the end. Assignment\
    \ expres-\n\nsions typically end with a semicolon, just as if you were assigning\
    \ any \n\nother value.\n\nAlthough these two forms are quite similar, they differ\
    \ in a very impor-\n\ntant way. Function declarations are *hoisted* to the top\
    \ of the context (either \n\nthe function in which the declaration occurs or the\
    \ global scope) when the \n\ncode is executed. That means you can actually define\
    \ a function after it is \n\nused in code without generating an error. For example:\n\
    \nvar result \\= add(5, 5);\n\nfunction add(num1, num2) {\n\n return num1 + num2;\n\
    \n}"
