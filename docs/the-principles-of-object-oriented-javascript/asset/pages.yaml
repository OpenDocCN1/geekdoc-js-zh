  md: "Functions   **21**\n\nCompare that to the second call to sort() v, which does\
    \ not use a \n\ncomparison function. The order of the array is different than\
    \ expected, \n\nas 1 is followed by 10. This is because the default comparison\
    \ converts all \n\nvalues to strings before comparing them. \n\n**Parameters**\n\
    \nAnother unique aspect of JavaScript functions is that you can pass any \n\n\
    number of parameters to any function without causing an error. That’s \n\nbecause\
    \ function parameters are actually stored as an array-like structure \n\ncalled\
    \ arguments. Just like a regular Java­Script array, arguments can grow \n\nto\
    \ contain any number of values. The values are referenced via numeric \n\nindices,\
    \ and there is a length property to determine how many values are \n\npresent.\
    \ \n\nThe arguments object is automatically available inside any function. This\
    \ \n\nmeans named parameters in a function exist mostly for convenience and \n\
    \ndon’t actually limit the number of arguments that a function can accept.\n\n\
    **N O T E*** The **arguments** object is not an instance of **Array** and therefore\
    \ doesn’t have the *\n\n*same methods as an array; **Array.isArray(arguments)**\
    \ always returns **false**.*\n\nOn the other hand, JavaScript doesn’t ignore the\
    \ named parameters \n\nof a function either. The number of arguments a function\
    \ expects is stored \n\non the function’s length property. Remember, a function\
    \ is actually just an \n\nobject, so it can have properties. The length property\
    \ indicates the func-\n\ntion’s *arity*, or the number of parameters it expects.\
    \ Knowing the function’s \n\narity is important in JavaScript because functions\
    \ won’t throw an error if \n\nyou pass in too many or too few parameters.\n\n\
    Here’s a simple example using arguments and function arity; note that \n\nthe\
    \ number of arguments passed to the function has no effect on the \n\nreported\
    \ arity:\n\nfunction reflect(value) {\n\n return value;\n\n}\n\nconsole.log(reflect(\"\
    Hi!\")); // \"Hi!\"\n\nconsole.log(reflect(\"Hi!\", 25)); // \"Hi!\"\n\nconsole.log(reflect.length);\
    \ // 1\n\nreflect \\= function() {\n\n return arguments\\[0\\];\n\n};\n\nconsole.log(reflect(\"\
    Hi!\")); // \"Hi!\"\n\nconsole.log(reflect(\"Hi!\", 25)); // \"Hi!\"\n\nconsole.log(reflect.length);\
    \ // 0"
