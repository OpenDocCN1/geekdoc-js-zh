  md: "Understanding Objects   **35**\n\nIn this example, name is an own property\
    \ of person1, so both the in \n\noperator and hasOwnProperty() return true. The\
    \ toString() method, how-\n\never, is a prototype property that is present on\
    \ all objects. The in opera-\n\ntor returns true for toString(), but ­hasOwnProperty()\
    \ returns false u. This \n\nis an important distinction that is discussed further\
    \ in Chapter 4.\n\n**Removing Properties**\n\nJust as properties can be added\
    \ to objects at any time, they can also be \n\nremoved. Simply setting a property\
    \ to null doesn’t actually remove the \n\nproperty completely from the object,\
    \ though. Such an operation calls \n\n\\[\\[Set\\]\\] with a value of null, which,\
    \ as you saw earlier in the chapter, only \n\nreplaces the value of the property.\
    \ You need to use the delete operator to \n\ncompletely remove a property from\
    \ an object.\n\nThe delete operator works on a single object property and calls\
    \ an \n\ninternal operation named \\[\\[Delete\\]\\]. You can think of this operation\
    \ as \n\nremoving a key/value pair from a hash table. When the delete operator\
    \ is \n\nsuccessful, it returns true. (Some properties can’t be removed, and this\
    \ is \n\ndiscussed in more detail later in the chapter.) For example, the following\
    \ \n\nlisting shows the delete operator at work:\n\nvar person1 \\= {\n\n name:\
    \ \"Nicholas\"\n\n};\n\nconsole.log(\"name\" in person1); // true\n\ndelete person1.name;\
    \ // true - not output\n\nconsole.log(\"name\" in person1); // false\n\nu console.log(person1.name);\
    \ // undefined\n\nIn this example, the name property is deleted from person1.\
    \ The \n\nin operator returns false after the operation is complete. Also, note\
    \ \n\nthat attempting to access a property that doesn’t exist will just return\
    \ \n\n­undefined u. Figure 3-2 shows how delete affects an object.\n\nperson1\n\
    \nname\n\n\"Nicholas\"\n\ndelete person1.name;\n\nperson1\n\n*Figure 3-2: When\
    \ you **delete** the **name** property, it completely *\n\n*disappears from **person1**.*"
