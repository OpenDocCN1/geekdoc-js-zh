  md: "**54**   Chapter 4\n\n***The \\[\\[Prototype\\]\\] Property***\n\nAn instance\
    \ keeps track of its prototype through an internal property \n\ncalled \\[\\[Prototype\\\
    ]\\]. This property is a pointer back to the prototype \n\nobject that the instance\
    \ is using. When you create a new object using \n\nnew, the constructor’s prototype\
    \ property is assigned to the \\[\\[Prototype\\]\\] \n\nproperty of that new object.\
    \ Figure 4-1 shows how the \\[\\[Prototype\\]\\] prop-\n\nerty lets multiple instances\
    \ of an object type refer to the same prototype, \n\nwhich can reduce code duplication.\n\
    \nPerson.prototype\n\nsayName\n\n(function)\n\nperson1\n\n\\[\\[Prototype\\]\\\
    ]\n\nname\n\n\"Nicholas\"\n\nperson2\n\n\\[\\[Prototype\\]\\]\n\nname\n\n\"Greg\"\
    \n\n*Figure 4-1: The **\\[\\[Prototype\\]\\]** properties for **person1** and\
    \ **person2** point to the *\n\n*same prototype.*\n\n**Identif ying a protot ype\
    \ propert y**\n\nYou can determine whether a property is on the prototype by using\
    \ a func-\n\ntion such as:\n\nfunction hasPrototypeProperty(object, name) {\n\n\
    \ return name in object && !object.hasOwnProperty(name);\n\n}\n\nconsole.log(hasPrototypeProperty(book,\
    \ \"title\")); // false\n\nconsole.log(hasPrototypeProperty(book, \"hasOwnProperty\"\
    )); // true\n\nIf the property is in an object but hasOwnProperty() returns false,\
    \ then \n\nthe property is on the prototype."
