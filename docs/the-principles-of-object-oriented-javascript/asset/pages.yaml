  md: "**16**   Chapter 1\n\nvar found \\= new Boolean(false);\n\nif (found) {\n\n\
    \ console.log(\"Found\"); // this executes\n\n}\n\nManually instantiating primitive\
    \ wrappers can also be confusing in \n\nother ways, so unless you find a special\
    \ case where it makes sense to do \n\nso, you should avoid it. Most of the time,\
    \ using primitive wrapper objects \n\ninstead of primitives only leads to errors.\n\
    \n**Summary**\n\nWhile JavaScript doesn’t have classes, it does have types. Each\
    \ variable \n\nor piece of data is associated with a specific primitive or reference\
    \ type. \n\nThe five primitive types (strings, numbers, Booleans, null, and ­undefined)\
    \ \n\nrepresent simple values stored directly in the variable object for a given\
    \ \n\ncontext. You can use typeof to identify primitive types with the exception\
    \ \n\nof null, which must be compared directly against the special value null.\n\
    \nReference types are the closest thing to classes in JavaScript, and \n\nobjects\
    \ are instances of reference types. You can create new objects \n\nusing the new\
    \ operator or a reference literal. You access properties and \n\nmethods primarily\
    \ using dot notation, but you can also use bracket nota-\n\ntion. Functions are\
    \ objects in JavaScript, and you can identify them with \n\nthe typeof operator.\
    \ You should use instanceof with a constructor to iden-\n\ntify objects of any\
    \ other reference type.\n\nTo make primitives seem more like references, JavaScript\
    \ has three \n\nprimitive wrapper types: String, Number, and Boolean. JavaScript\
    \ creates \n\nthese objects behind the scenes so that you can treat primitives\
    \ like \n\nregular objects, but the temporary objects are destroyed as soon as\
    \ the \n\nstatement using them is complete. Although you can create your own \n\
    \ninstances of primitive wrappers, it’s best not to do that because it can \n\n\
    be confusing."
