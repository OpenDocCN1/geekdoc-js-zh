  md: "**22**   Chapter 2\n\nThis example first defines the reflect() function using\
    \ a single named \n\nparameter, but there is no error when a second parameter\
    \ is passed into \n\nthe function. Also, the length property is 1 because there\
    \ is a single named \n\nparameter. The reflect() function is then redefined with\
    \ no named param-\n\neters; it returns arguments\\[0\\], which is the first argument\
    \ that is passed in. \n\nThis new version of the function works exactly the same\
    \ as the previous \n\nversion, but its length is 0. \n\nThe first implementation\
    \ of reflect() is much easier to understand \n\nbecause it uses a named argument\
    \ (as you would in other languages). \n\nThe version that uses the arguments object\
    \ can be confusing because there \n\nare no named arguments, and you must read\
    \ the body of the function to \n\ndetermine if arguments are used. That is why\
    \ many developers prefer to \n\navoid using arguments unless necessary.\n\nSometimes,\
    \ however, using arguments is actually more effective than \n\nnaming parameters.\
    \ For instance, suppose you want to create a function \n\nthat accepts any number\
    \ of parameters and returns their sum. You can’t \n\nuse named parameters because\
    \ you don’t know how many you will need, \n\nso in this case, using ­arguments\
    \ is the best option.\n\nfunction sum() {\n\n var result \\= 0,\n\n i \\= 0,\n\
    \n len \\= arguments.length;\n\n while (i < len) {\n\n result += arguments\\[i\\\
    ];\n\n i++;\n\n }\n\n return result;\n\n}\n\nconsole.log(sum(1, 2)); // 3\n\n\
    console.log(sum(3, 4, 5, 6)); // 18\n\nconsole.log(sum(50)); // 50\n\nconsole.log(sum());\
    \ // 0\n\nThe sum() function accepts any number of parameters and adds them \n\
    \ntogether by iterating over the values in arguments with a while loop. This is\
    \ \n\nexactly the same as if you had to add together an array of numbers. The\
    \ \n\nfunction even works when no parameters are passed in, because result is\
    \ \n\ninitialized with a value of 0."
