  md: "Introduction   **xix**\n\nother languages is a strong indicator that this book\
    \ is for you. In particu-\n\nlar, this book is aimed at three groups of readers:\n\
    \n• \n\nDevelopers who are familiar with object-oriented programming con-\n\n\
    cepts and want to apply them to JavaScript\n\n• \n\nWeb application and Node.js\
    \ developers trying to structure their code \n\nmore effectively\n\n• \n\nNovice\
    \ JavaScript developers trying to gain a deeper understanding \n\nof the language\n\
    \nThis book is not for beginners who have never written JavaScript. You \n\nwill\
    \ need a good understanding of how to write and execute JavaScript \n\ncode to\
    \ follow along.\n\n**Overview**\n\n**Chapter 1: Primitive and Reference Types**\
    \ introduces the two different \n\nvalue types in JavaScript: primitive and reference.\
    \ You’ll learn what distin-\n\nguishes them from each other and how understanding\
    \ their differences \n\nis important to an overall understanding of JavaScript.\n\
    \n**Chapter 2: Functions** explains the ins and outs of functions in \n\nJavaScript.\
    \ First-class functions are what makes JavaScript such an inter-\n\nesting language.\n\
    \n**Chapter 3: Understanding Objects** details the makeup of objects in \n\nJavaScript.\
    \ JavaScript objects behave differently than objects in other lan-\n\nguages,\
    \ so a deep understanding of how objects work is vital to mastering \n\nthe language.\n\
    \n**Chapter 4: Constructors and Prototypes** expands on the previous \n\ndiscussion\
    \ of functions by looking more specifically at constructors. All \n\nconstructors\
    \ are functions, but they are used a little bit differently. This \n\nchapter\
    \ explores the differences while also talking about creating your \n\nown custom\
    \ types.\n\n**Chapter 5: Inheritance** explains how inheritance is accomplished\
    \ \n\nin JavaScript. Though there are no classes in JavaScript, that doesn’t \n\
    \nmean inheritance isn’t possible. In this chapter, you’ll learn about proto-\n\
    \ntypal inheritance and how it differs from class-based inheritance.\n\n**Chapter\
    \ 6: Object Patterns** walks through common object pat-\n\nterns. There are many\
    \ different ways to build and compose objects in \n\nJavaScript, and this chapter\
    \ introduces you to the most popular patterns \n\nfor doing so.\n\n**Help and\
    \ Support**\n\nIf you have questions, comments, or other feedback about this book,\
    \ \n\nplease visit the mailing list at *http://groups.google.com/group/zakasbooks*."
