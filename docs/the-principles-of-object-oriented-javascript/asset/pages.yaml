  md: "Object Patterns   **81**\n\nThe module pattern allows you to use regular variables\
    \ as de facto \n\nobject properties that aren’t exposed publicly. You accomplish\
    \ this by \n\ncreating *closure* functions as object methods. Closures are simply\
    \ func-\n\ntions that access data outside their own scope. For example, whenever\
    \ you \n\naccess a global object in a function, such as window in a web browser,\
    \ that \n\nfunction is accessing a variable outside its own scope. The difference\
    \ with \n\nthe module function is that the variables are declared within the IIFE,\
    \ \n\nand a function that is also declared inside the IIFE accesses those vari-\n\
    \nables. For example:\n\nvar person \\= (function() {\n\nu var age \\= 25;\n\n\
    \ return {\n\n name: \"Nicholas\",\n\nv getAge: function() {\n\n return age;\n\
    \n },\n\nw growOlder: function() {\n\n age++;\n\n }\n\n };\n\n}());\n\nconsole.log(person.name);\
    \ // \"Nicholas\"\n\nconsole.log(person.getAge()); // 25\n\nperson.age \\= 100;\n\
    \nconsole.log(person.getAge()); // 25\n\nperson.growOlder();\n\nconsole.log(person.getAge());\
    \ // 26\n\nThis code creates the person object using the module pattern. The age\
    \ \n\nvariable u acts like a private property for the object. It can’t be accessed\
    \ \n\ndirectly from outside the object, but it can be used by the object methods.\
    \ \n\nThere are two privileged methods on the object: getAge() v, which reads\
    \ \n\nthe value of the age variable, and growOlder() w, which increments age.\
    \ \n\nBoth of these methods can access the variable age directly because it is\
    \ \n\ndefined in the outer function in which they are defined."
