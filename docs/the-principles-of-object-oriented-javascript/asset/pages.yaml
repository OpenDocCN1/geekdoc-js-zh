  md: "**4**\n\n**Co n s t ru c t or s a n d **\n\n**Pro t o t y pe s**\n\nYou might\
    \ be able to get pretty far in \n\nJavaScript without understanding con­\n\nstructors\
    \ and prototypes, but you won’t truly \n\nappreciate the language without a good\
    \ grasp \n\nof them. Because JavaScript lacks classes, it turns to \n\nconstructors\
    \ and proto­types to bring a similar order \n\nto objects. But just because some\
    \ of the patterns resemble classes doesn’t \n\nmean they behave the same way.\
    \ In this chapter, you’ll explore constructors \n\nand prototypes in detail to\
    \ see how JavaScript uses them to create objects.\n\n**Constructors**\n\nA *constructor*\
    \ is simply a function that is used with new to create an object. \n\nUp to this\
    \ point, you’ve seen several of the built-in JavaScript construc-\n\ntors, such\
    \ as Object, Array, and Function. The advantage of constructors is"
