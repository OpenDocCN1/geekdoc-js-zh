  md: "**78**   Chapter 5\n\n**Summary**\n\nJavaScript supports inheritance through\
    \ prototype chaining. A prototype \n\nchain is created between objects when the\
    \ \\[\\[Prototype\\]\\] of one object is \n\nset equal to another. All generic\
    \ objects automatically inherit from Object \n\n.prototype. If you want to create\
    \ an object that inherits from something \n\nelse, you can use Object.create()\
    \ to specify the value of \\[\\[Prototype\\]\\] for a \n\nnew object.\n\nYou accomplish\
    \ inheritance between custom types by creating a \n\nproto­type chain on the constructor.\
    \ By setting the constructor’s prototype \n\nproperty to another value, you create\
    \ inheritance between instances of \n\nthe custom type and the prototype of that\
    \ other value. All instances of \n\nthat constructor share the same proto­type,\
    \ so they all inherit from the \n\nsame object. This technique works very well\
    \ for inheriting methods from \n\nother objects, but you cannot inherit own properties\
    \ using prototypes.\n\nTo inherit own properties correctly, you can use constructor\
    \ stealing, \n\nwhich is simply calling a constructor function using call() or\
    \ apply() so \n\nthat any initialization is done on the subtype object. Combining\
    \ construc-\n\ntor stealing and prototype chaining is the most common way to achieve\
    \ \n\ninheritance between custom types in JavaScript. This combination is \n\n\
    frequently called pseudo­classical inheritance because of its similarity \n\n\
    to inheritance in class-based languages.\n\nYou can access methods on a supertype\
    \ by directly accessing the \n\nsupertype’s prototype. In doing so, you must use\
    \ call() or apply() to exe-\n\ncute the supertype method on the subtype object."
