  md: "Object Patterns   **87**\n\nA second way to solve this problem is to use pseudoclassical\
    \ \n\ninheritance:\n\nfunction Person(name) {\n\n this.name \\= name;\n\n}\n\n\
    u Person.prototype \\= Object.create(EventTarget.prototype);\n\nPerson.prototype.constructor\
    \ \\= Person;\n\nPerson.prototype.sayName = function() {\n\n console.log(this.name);\n\
    \n this.fire({ type: \"namesaid\", name: name });\n\n};\n\nvar person \\= new\
    \ Person(\"Nicholas\");\n\nconsole.log(person instanceof Person); // true\n\n\
    console.log(person instanceof EventTarget); // true\n\nIn this case, there is\
    \ a new Person type that inherits from EventTarget u. \n\nYou can add any further\
    \ methods you need to Person’s prototype after-\n\nward. However, this isn’t as\
    \ succinct as it could be, and you could argue \n\nthat the relationship doesn’t\
    \ make sense: A person is a type of event tar-\n\nget? By using a mixin instead,\
    \ you can reduce the amount of code neces-\n\nsary to assign those new properties\
    \ to the prototype:\n\nfunction Person(name) {\n\n this.name \\= name;\n\n}\n\n\
    u mixin(Person.prototype, new EventTarget());\n\nmixin(Person.prototype, {\n\n\
    \ constructor: Person,\n\n sayName: function() {\n\n console.log(this.name);\n\
    \n this.fire({ type: \"namesaid\", name: name });\n\n }\n\n});\n\nvar person \\\
    = new Person(\"Nicholas\");\n\nconsole.log(person instanceof Person); // true\n\
    \nconsole.log(person instanceof EventTarget); // false\n\nHere, Person.prototype\
    \ is mixed in with a new instance of EventTarget u \n\nto get the event behavior.\
    \ Then, Person.­prototype is mixed in with ­constructor \n\nand sayName() to complete\
    \ the composition of the prototype. Instances of \n\nPerson are not instances\
    \ of EventTarget in this example because there is no \n\ninheritance."
