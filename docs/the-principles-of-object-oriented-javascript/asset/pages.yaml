  md: "**70**   Chapter 5\n\nThe Object.create() method accepts two arguments. The\
    \ first argu-\n\nment is the object to use for \\[\\[Prototype\\]\\] in the new\
    \ object. The optional \n\nsecond argument is an object of property descriptors\
    \ in the same format \n\nused by Object.defineProperties() (see Chapter 3). Consider\
    \ the following:\n\nvar book \\= {\n\n title: \"The Principles of Object-Oriented\
    \ JavaScript\"\n\n};\n\n// is the same as\n\nvar book \\= Object.create(Object.prototype,\
    \ {\n\n title: {\n\n configurable: true,\n\n enumerable: true,\n\n value: \"The\
    \ Principles of Object-Oriented JavaScript\",\n\n writable: true\n\n }\n\n });\n\
    \nThe two declarations in this code are effectively the same. The first \n\ndeclaration\
    \ uses an object literal to define an object with a single prop-\n\nerty called\
    \ title. That object automatically inherits from Object.prototype, \n\nand the\
    \ property is set to be configurable, enumerable, and writable by \n\ndefault.\
    \ The second declaration takes the same steps but does so explic-\n\nitly using\
    \ Object.create(). The resulting book object from each declaration \n\nbehaves\
    \ the exact same way. But you’ll probably never write code that \n\ninherits from\
    \ Object.prototype directly, because you get that by default. \n\nInheriting from\
    \ other objects is much more interesting:\n\nvar person1 \\= {\n\n name: \"Nicholas\"\
    ,\n\n sayName: function() {\n\n console.log(this.name);\n\n }\n\n};\n\nvar person2\
    \ \\= Object.create(person1, {\n\n name: {\n\n configurable: true,\n\n enumerable:\
    \ true,\n\n value: \"Greg\",\n\n writable: true\n\n }\n\n});\n\nperson1.sayName();\
    \ // outputs \"Nicholas\"\n\nperson2.sayName(); // outputs \"Greg\""
