  md: "**2**   Chapter 1\n\norganize things any way you want. Some developers choose\
    \ to mimic \n\nstructures from other languages, while others take advantage of\
    \ Java­\n\nScript’s flexibility to come up with something completely new. To the\
    \ \n\nuninitiated, this freedom of choice can be overwhelming, but once you \n\
    \nget used to it, you’ll find JavaScript to be an incredibly flexible language\
    \ \n\nthat can adapt to your preferences quite easily.\n\nTo ease the transition\
    \ from traditional object-oriented ­languages, \n\nJava­Script makes objects the\
    \ central part of the ­language. Almost all data \n\nin JavaScript is either an\
    \ object or accessed through objects. In fact, even \n\nfunctions (which languages\
    \ traditionally make you jump through hoops \n\nto get references to) are represented\
    \ as objects in Java­Script, which makes \n\nthem *first-class functions*. \n\n\
    Working with and understanding objects is key to understanding Java­\n\nScript\
    \ as a whole. You can create objects at any time and add or remove \n\nproperties\
    \ from them whenever you want. In addition, Java­Script objects \n\nare extremely\
    \ flexible and have capabilities that create unique and inter-\n\nesting patterns\
    \ that are simply not possible in other languages.\n\nThis chapter focuses on\
    \ how to identify and work with the two pri-\n\nmary JavaScript data types: primitive\
    \ types and reference types. Though \n\nboth are accessed through objects, they\
    \ behave in different ways that are \n\nimportant to understand.\n\n**What Are\
    \ Types?**\n\nAlthough JavaScript has no concept of classes, it still uses two\
    \ kinds of \n\n*types*: primitive and reference. *Primitive types* are stored\
    \ as simple data \n\ntypes. *Reference types* are stored as objects, which are\
    \ really just references \n\nto locations in memory. \n\nThe tricky thing is that\
    \ JavaScript lets you treat primitive types like \n\nreference types in order\
    \ to make the language more consistent for the \n\ndeveloper. \n\nWhile other\
    \ programming languages distinguish between primitive \n\nand reference types\
    \ by storing primitives on the stack and references in \n\nthe heap, JavaScript\
    \ does away with this concept completely: It tracks \n\nvariables for a particular\
    \ scope with a *variable object*. Primitive values are \n\nstored directly on\
    \ the variable object, while reference values are placed as \n\na pointer in the\
    \ variable object, which serves as a reference to a location \n\nin memory where\
    \ the object is stored. However, as you’ll see later in this \n\nchapter, primitive\
    \ values and reference values behave quite differently \n\nalthough they may initially\
    \ seem the same.\n\nOf course, there are other differences between primitive and\
    \ refer-\n\nence types."
