  md: "**92**   Chapter 6\n\nFor this constructor, the name property is assigned as\
    \ always when \n\nnew is used. If new isn’t used, the constructor is called recursively\
    \ via new \n\nto create a proper instance of the object. In this way, the following\
    \ are \n\nequivalent:\n\nvar person1 \\= new Person(\"Nicholas\");\n\nvar person2\
    \ \\= Person(\"Nicholas\");\n\nconsole.log(person1 instanceof Person); // true\n\
    \nconsole.log(person2 instanceof Person); // true\n\nCreating new objects without\
    \ using the new operator is becoming more \n\ncommon as an effort to curb errors\
    \ caused by omitting new. JavaScript itself \n\nhas several reference types with\
    \ scope-safe constructors, such as Object, \n\nArray, RegExp, and Error.\n\n**Summary**\n\
    \nThere are many different ways to create and compose objects in Java­\n\nScript.\
    \ While JavaScript does not include the formal concept of private \n\nproperties,\
    \ you can create data or functions that are accessible only from \n\nwithin an\
    \ object. For singleton objects, you can use the module pattern \n\nto hide data\
    \ from the outside world. You can use an immediately invoked \n\nfunction expression\
    \ (IIFE) to define local variables and functions that \n\nare accessible only\
    \ by the newly created object. Privileged methods are \n\nmethods on the object\
    \ that have access to private data. You can also \n\n­create constructors that\
    \ have private data by either defining variables in \n\nthe constructor function\
    \ or by using an IIFE to create private data that \n\nis shared among all instances.\n\
    \nMixins are a powerful way to add functionality to objects while avoid-\n\ning\
    \ inheritance. A mixin copies properties from one object to another \n\nso that\
    \ the receiving object gains functionality without inheriting from \n\nthe supplying\
    \ object. Unlike inheritance, mixins do not allow you to iden-\n\ntify where the\
    \ capabilities came from after the object is created. For this \n\nreason, mixins\
    \ are best used with data properties or small pieces of func-\n\ntionality. Inheritance\
    \ is still preferable when you want to obtain more \n\nfunctionality and know\
    \ where that functionality came from.\n\nScope-safe constructors are constructors\
    \ that you can call with or \n\nwithout new to create a new object instance. This\
    \ pattern takes advantage \n\nof the fact that this is an instance of the custom\
    \ type as soon as the con-\n\nstructor begins to execute, which lets you alter\
    \ the constructor’s behavior \n\ndepending on whether or not you used the new\
    \ operator."
