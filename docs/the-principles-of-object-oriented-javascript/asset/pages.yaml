  md: "Constructors and Prototypes   **59**\n\nUsing the object literal notation to\
    \ overwrite the prototype changed \n\nthe constructor property so that it now\
    \ points to Object u instead of Person. \n\nThis happened because the constructor\
    \ property exists on the prototype, \n\nnot on the object instance. When a function\
    \ is created, its prototype prop-\n\nerty is created with a ­constructor property\
    \ equal to the function. This \n\npattern completely overwrites the prototype\
    \ object, which means that \n\nconstructor will come from the newly created (generic)\
    \ object that was \n\nassigned to Person.prototype. To avoid this, restore the\
    \ constructor prop-\n\nerty to a proper value when overwriting the prototype:\n\
    \nfunction Person(name) {\n\n this.name \\= name;\n\n}\n\nPerson.prototype \\\
    = {\n\nu constructor: Person,\n\n sayName: function() {\n\n console.log(this.name);\n\
    \n },\n\n toString: function() {\n\n return \"\\[Person \" + this.name + \"\\\
    ]\";\n\n }\n\n};\n\nvar person1 \\= new Person(\"Nicholas\");\n\nvar person2 \\\
    = new Person(\"Greg\");\n\nconsole.log(person1 instanceof Person); // true\n\n\
    console.log(person1.constructor \\=== Person); // true\n\nconsole.log(person1.constructor\
    \ \\=== Object); // false\n\nconsole.log(person2 instanceof Person); // true\n\
    \nconsole.log(person2.constructor \\=== Person); // true\n\nconsole.log(person2.constructor\
    \ \\=== Object); // false\n\nIn this example, the constructor property is specifically\
    \ assigned \n\non the prototype u. It’s good practice to make this the first property\
    \ on \n\nthe prototype so you don’t forget to include it.\n\nPerhaps the most\
    \ interesting aspect of the relationships among \n\n­constructors, prototypes,\
    \ and instances is that there is no direct link \n\nbetween the instance and the\
    \ constructor. There is, however, a direct \n\nlink between the instance and the\
    \ prototype and between the prototype \n\nand the constructor. Figure 4-3 illustrates\
    \ this relationship."
