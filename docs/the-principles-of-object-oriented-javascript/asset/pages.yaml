    \ < len; i++){\n\n if (listeners\\[i\\] \\=== listener){\n\n listeners.splice(i,\
    \ 1);\n\n break;\n\n }\n\n }\n\n }\n\n }\n\n};\n\nThe EventTarget type provides\
    \ basic event handling for any object. \n\nYou can add u and remove w listeners\
    \ as well as fire events v directly \n\non the object. The event listeners are\
    \ stored on a \\_listeners property that \n\nis created only when addListener()\
    \ is called for the first time (this makes it \n\neasier to mix in). You can use\
    \ instances of EventTarget like this:\n\nvar target \\= new EventTarget();\n\n\
    target.addListener(\"message\", function(event) {\n\n console.log(\"Message is\
    \ \" + event.data);\n\n})\n\ntarget.fire({\n\n type: \"message\",\n\n data: \"\
    Hello world!\"\n\n});\n\nSupport for events is useful for objects in JavaScript.\
    \ If you want to \n\nhave a different type of object that also supports events,\
    \ you have a few \n\noptions. First, you can create a new instance of EventTarget\
    \ and then add \n\non the properties that you want:\n\nvar person \\= new EventTarget();\n\
    \nperson.name \\= \"Nicholas\";\n\nperson.sayName \\= function() {\n\n console.log(this.name);\n\
    \n this.fire({ type: \"namesaid\", name: name });\n\n};\n\nIn this code, a new\
    \ variable called person is created as an instance of \n\nEventTarget, and then\
    \ the person\\-related properties are added. Unfor­tu­\n\nnately, this means that\
    \ person is actually an instance of EventTarget instead \n\nof Object or a custom\
    \ type. You also incur the overhead of needing to add \n\na bunch of new properties\
    \ by hand. It would be better to have a more \n\norganized way of doing this."
