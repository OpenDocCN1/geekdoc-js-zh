    “Maybe you’re right,” he agreed again. “But I am a terrible host! You must be
    thirsty after all that walking. Would you like some water?” Fresnel offered her
    a pitcher and glassware on a tray.


    “Oh yes, please.” Laurie took a cup and tried to fill it. The water splashed onto
    her shoes.


    “`Hey!`! This cup has no bottom!”


    “That’s not a cup, dear child. It’s a glass,” he said.


    “This `glass` has no bottom. How am I supposed to drink out of it?”


    “On second thought, that’s not properly a glass,” said Fresnel. “It’s a mug. See
    the handle?”


    “Okay, this `mug` has—”


    “On third thought,” he said, stroking his beard, “it’s made of glass, but also
    has a handle. So perhaps we should call it a glass-mug, or a mug-glass . . .”


    “I don’t care what you `call` it!” Laurie yelled. “It’s `got no bottom` and the
    water . . . I mean, um, you called it a glass, but it doesn’t have . . . oh.”
    She turned bright red.


    Fresnel handed Laurie another mug-glass-cup. “You’re right again. Things are what
    they are, no matter what names people give them.”


    “But aren’t names important?” Laurie asked, checking her new glass-cup-mug carefully
    for holes. Luckily, this one had a bottom.


    “Names go only so far. And many names are actually the same thing in disguise.”


    “Really?”


    “Surely. Are you Laurie or Lauren?”


    “Well, both. But I like Laurie. When Mom is really mad, she calls me Lauren.”
    She put her hands on her hips and threw her head back. “`Lauren Ipsum, come downstairs
    NOW!`”


    Fresnel laughed like a horse would laugh, if the horse had heard the joke. “A
    full name is a powerful thing. But you’re the same person either way. And sometimes
    different things have the same name. You call your mom ‘Mom,’ but I call my mom
    ‘Mom,’ too.”


    “But I wouldn’t call `your` mom ‘Mom’!” said Laurie. *How weird would that be?*


    “There you go. It’s only logical. You have to look `past` the name to see things
    as they really are. That’s Fresnel’s First Law.”


    “You sound just like Eponymous Bach,” Laurie said.


    “Really? Well, I’m a Composer too,” said Fresnel. “I start with big ideas and
    make them smaller.”


    “Make them smaller? Why?”


    “Why not? Only people with small minds think Big Problems need Big Ideas.”


    Laurie wasn’t sure what he was talking about. “How do you make an idea smaller?”


    “By `De`composing. How would you talk about a lighthouse without using the word
    `lighthouse`?”


    “Well, it’s a tall white tower near the sea, with a room full of windows at the
    top, and a big light on top of that, and a long twisty staircase inside.”


    “That’s very good,” Fresnel said. “Now look at each part and see if it’s essential.
    If your tall-tower-by-the-sea-with-windows-and-big-light-and-staircase were `pink`,
    would it work just the same?”


    “I guess so. I’ve never seen a pink lighthouse,” she said.


    “Neither have I! But if everything already existed, life would be pretty boring.
    Why is your lighthouse tall?”


    “So boats can see you,” said Laurie. “A short lighthouse wouldn’t work so well.
    And you need the twisty staircase to get to the top.”


    “Why the light?”


    “The light is so the boats can see you at night.”


    “And the lighthouse keeper’s room?”


    “So you can see `them`.”


    “Ah, so,” said Fresnel. “My balloon has a light very high up so people far away
    can see it. I can look over the side and see them. I get to the top by elevator.
    The color doesn’t matter. It does everything a lighthouse does. Is it a lighthouse?”


    “It’s `like` a lighthouse,” Laurie admitted.


    “You drive a hard bargain! I’ll settle for ‘like a lighthouse,’” he said.


    “So that’s how you Decompose?”


    “That’s it, more or less. You take a big idea apart and see the `why` behind each
    part. Then you look for smaller ideas that do the same thing. For instance, what
    did you think of my little bell?”


    “Your `little` bell! That thing frightened the b—”


    “It needs some adjustments, I agree. But the idea is sound,” he said. “The essential
    part of a bell is the sound. Because the bell is way down on the ground, it needs
    a big sound so I can hear it.”


    “So why don’t you use a big bell, then?” she asked.


    “If I used a big bell, I’d need a big frame to hang it from, and a big ringer,
    and a big sign to go along with it. All the inessentials get bigger,” Fresnel
    said. “There’s no need to use a big, complex idea when a small, simple one will
    do.”


    “I wish I could tell Bruto that,” Laurie said, remembering the giant pyramid.
    “But he’s so far away.”


    ***


    “Winsome, why am I delivering so many telescopes?” Laurie asked.


    Winsome’s expression turned stony. “It’s not nice to open other people’s mail.”


    “I’m sorry. Those packages are really heavy and I wondered what could be so fragile
    and expensive and important . . .”


    Winsome didn’t say anything. She pretended to be busy with ropes and anchors.


    Laurie pressed on. “Why telescopes?” “So the lighthouse keepers can see farther
    out.”


    “Why do they need to see farther out?”


    “Because the other lighthouses are too far away.”


    “That doesn’t make any sense,” Laurie said. “Why do people in lighthouses want
    to see other lighthouses?”


    “Because it’s how we’re going to send messages. It’s the Lighthouse Network.”


    “Why do you want to send messages that way?”


    “Right now,” said Winsome, “if someone on Abstract Island wants to talk with someone
    on Data Island, they have to pay the Colonel and his Network of mail daemons.”


    “Is that a bad thing? Why build your own Network?”


    “Because I can. And because Colonel Trapp doesn’t want me to.”


    “Why doesn’t he want you to build a Network?” Laurie asked.


    “That’s Five Whys already, kiddo. Are you ready to go? The next stop is an easy
    one. You’ll like Ping. She lives in a treehouse!”


    # Chapter 18. Many Hands Make Light Work


    ![image with no caption](figs/web/131fig01.png.jpg)


    Once the `Doppelganger` reached the next island, Winsome sent Laurie off on another
    delivery immediately. This telescope would be the last, but Laurie still wondered
    how on Earth they fit into Winsome’s plan.


    “Some things in life you just have to see for yourself!” Winsome said with a smile.


    Laurie found it hard to argue with the excitement in Winsome’s voice, so she just
    trusted the usual set of odd directions to lead her to an answer. Before long,
    she and Xor reached an enormous tree. A long, twisty staircase wrapped around
    the trunk and up into the leaves, and a young woman stood at the base.


    “Hello, Laurie! Glad you made it. My name is Ping Baudot. I’ve been waiting for
    you.”


    “Hello. Wait, how did you know my name?”


    “Oh, Fresnel told me all about you.”


    “Fresnel? He lives way over on Island!”


    “Yes, isn’t it wonderful? You and Winsome have been making lots of deliveries
    lately. The Network is getting quite big now! I can hardly keep up with all the
    chatter.”


    “But I don’t—”


    “You should be very proud. Here, let me help you with that.” Ping took the package
    and raced up the stairs, round and round the trunk of the tree. Laurie followed
    as best she could.


    When they arrived at the treehouse near the top, Laurie gasped in surprise. It
    was a tree `lighthouse`! Not only that, but the lighthouse keeper’s room was filled
    with telescopes pointing in all directions. A neat label was attached to each
    one.


    “Well? What do you think?” Ping said.


    “Why do you need so many telescopes?” Laurie asked.


    “See for yourself.”


    Laurie put an eye to the ‘scope labeled ELEGANT. A red, round splotch was hanging
    in the air. And was that a rope?


    “Hey, that’s Fresnel’s balloon! I can see him! He’s waving!” Laurie exclaimed.


    Laurie looked into other telescopes. Each one was pointed at a different lighthouse.
    The one for ABSTRACT showed the lighthouse keeper who didn’t say very much, up
    in his tall white tower by the sea, looking back through a telescope of his own.
    He didn’t wave. The BYZANTIUM telescope showed half a pyramid covered in giant
    mechanical turtles. Bruto was busy counting bricks.

