    “现在，嗯，让我们慢慢读一遍并寻找线索。Con-sec-te-tour a-dee-peace-ick-ing el . . .” 当 Xor 在字母间移动移动时，他的皮肤泛起了波纹。.
    . . dew-is ow-tay . . . ”


    “嘿，Xor，等一下。” Laurie 发现有些不对劲。“再后退一点点。”


    “这样吗？”


    “对。现在，仔细想想怎么融入其中。”


    “好的。你看到了什么？”他说。


    “你的皮肤。我觉得我可以读懂它。”


    当 Xor 对齐得恰好时，白底黑字的 `LOREM IPSUM ESXIHU` 变成了黑底白字的 `LAUREN IPSUM GREETINGS`。


    “你正在显示隐藏的信息！”


    “真的吗？我的意思是，看吧？我告诉过你我可以做到。”


    “你太棒了，Xor！你能离纸近一点吗？”


    “如果我再近一点，我就在纸的后面面了！”


    他们一个字一个字地破解了信息。但即便如此，它仍然没什么什么意义：


    > LAUREN IPSUM，问候！毫无疑问，你是长期以来 Userland 最有趣访客。但如果你继续现在所做的事，前方将面临许多艰辛和挫折。记住，地图并非领域！


    > 你谦卑的仆人，


    > 特拉普上校（COLONEL TRAPP）


    “艰辛和挫折？地图并非领域？那到底是什么意思？”Laurie 问。


    “我曾听说一个国王想为他的领土制作一张完美的地图，”Xor 说道。


    “他为什么要那样做？”


    “国王总是想要一些蠢东西，比如一本关于万物的书，或者一辆没有弱点的马车，”他说。“这个国王决定他想要一张和王国一样大的完美地图。这样，皇家制图师就能把一切都画进去，直到每一块石头和每一朵花。它花了整整七年才完成。但那是一场灾难！”


    “为什么？发生了什么？”Laurie 问。


    “作为一张地图，它的效果并不好。”蜥蜴解释道，“为了测量两个地方之间的距离，你必须恰好走完那个距离。等那时你已经到达那里了。”


    “他们甚至把这么大一张地图放在哪儿？”


    “那是另一件事。博尔赫斯国王（King Borges）只有一个王国，除了原处，没地方可以放这张地图。那真是个大麻烦，地图盖在人们的房顶上，作物无法生长。人们最终推翻了国王并撕掉了地图。他们说你仍然能在沙漠里看到巨大的纸片在飘动。”


    # 第 8 章 做事的方法不止一种


    ![image with no caption](img/061fig01.png.jpg)


    Permute 是一个离 Symbol 不远的小村庄。Hugh Rustic（休斯蒂）的店很容易找到。它的招牌比 Tinker 的更大、更花哨。


    ![image with no caption](img/061fig02.png.jpg)


    “你好，Rustic 先生？”Laurie 走进店里喊道。“Symbol 的 Tinker 先生欠我一个算法，他说我应该来谈谈这件事。”


    Rustic 是一个高大、大嗓、看起来乱糟糟的男人，留着大红胡子。他看起来完全不像优雅的 Eponymous，也不像整洁得体的 Tinker。


    ![image with no caption](img/062fig01.png.jpg)


    他看起来完全不像 Laurie 想象中作曲家（Composer）应该的样子！但 Tinker 推荐过他，所以 Laurie 把借条交给了他。


    “我，嗯，正在尝试找到通过所有城镇的最短路径。你能帮我吗？”


    “太棒了！有趣！”Rustic 说道。“Tinker 把你送对地方了，小姐。立刻做到是不可能的。最晚周二前完成是不可能的。”


    “但如果不可能——”Laurie 开始说。


    “只是不太可能，”Rustic 纠正道。


    “如果不太可能，你怎么做呢？”


    “通过转变你的观点，”Rustic 说，“与其寻找一个符合你问题的答案，不如想象一个答案，然后寻找一个符合它的问题。”


    “但你不能直接改变问题，对吧？”


    “为什么不能，当然可以！担心问题是在浪费时间！你真正想要的是答案，对吧？”


    “也许吧，我不明白怎么做，”Laurie 说。


    “你如何买到最好的西红柿？”他说。


    “呃，我 . . . 什么？”


    “假设你在市场上。你想买最好、最完美的西红柿。但为了找到最好的西红柿，你必须比较每一个一个，对吧？你会观察每一个，转转它，也许再挤一下。对整个市场里的每一个西红柿都这样。”


    “没人会那样做！”Laurie 说。“好吧，老 Harris 夫人确实会那样做。但我妈妈说她有点疯。我只挑一个好的就行了。”


    “看吧？你已经知道如何用 Hugh Rustic 的方式做事了。当有许多‘足够好’的西红柿时，你不需要浪费时间寻找最好的西红柿。”


    “所以，与其尝试找到通过 Userland 所有城镇的最短路径，”Laurie 说，“我们找一条足够短的路径？”


    “为什么不呢？”Rustic 问。“在所有数以百万计的路径中，我打赌有很多路径是很短的。你只需要找到其中一条，那要容易得多。”


    Rustic 拿出一张大地图放在柜台上。


    “这是我们所在地，”他指着 Permute 说，“这是你开始的地方，对吧？让我们在这里放几支铅笔代表上限山（Mount Upper Bound），在那儿放一个小勺代表下界谷（Lower
    Bound Valley）。”地图上还标记了 Bach（巴赫）和 Recursion Junction（递归交汇点），以及许多 Laurie 还没有去过的地方。


    “现在是有趣的部分，”Rustic 说，“我们问问蚂蚁吧。”


    “问蚂蚁？你在说什么？蚂蚁读不了地图的！”Laurie 说。一提到昆虫，Xor 突然警觉了。


    “谁说它们不会？下次你又要告诉我龟画不了圆了，”Rustic 说。


    “所以你教蚂蚁读地图？”


    “不完全。蚂蚁已经很擅长找路了。主意是让它们为我们工作。”他打开一罐蜂蜜，在每个城镇上滴了一小块甜味。


    过过去了。什么都没发生。然后一只小蚂蚁爬上桌子。它闻到了蜂蜜的味道，在地图上之字形移动。它咬了一块蜂蜜，然后到处逛，直到走到另一块。


    ![image with no caption](img/065fig01.png.jpg)


    “当蚂蚁找到食物时，她会为后面的同伴留下一小气味信息，”Rustic 说。“蚂蚁追着食物的味道以及其他蚂蚁的味道。许多蚂蚁可以同时尝试许多不同的路径。最终，它们会确定一条通往所有食物并返回巢穴的快速路线。”


    第一只蚂蚁继续走向 Bach。另一只出现了，但直接走向了 Recursion Junction。还有一些蚂蚁一直穿过到达 Probability Bay、Permute、Notation
    以及其他城镇。很快，地图上就有几十只蚂蚁向四面八方走去，收集蜂蜜碎片并为它们的姐妹们留下气味。


    几分钟后，很明显某些路径比其他路径更受欢迎。蚂蚁的队伍变得越来越宽，直到只剩下一条蚂蚁超级高速，在整个地图上行进并回到巢穴。Hugh Rustic 在蜂蜜消失之前把它抄在了一张纸上。


    “啊，这就对了！”他说把草图交给了 Laurie。


    “谢谢你，Rustic 先生！这真的是最短的路吗？”


    “这是一条短路。这是我能做出的保证。”


    # 第 9 章 不要重复


    ![image with no caption](img/067fig01.png.jpg)


    Laurie 和 Xor 带着新地图从 Permute 出发了。他们终于知道自己在哪里，要去去哪里，以及如何到达那里。这一切都在纸上。


