    又有五只生物扑棱棱地跳了进来，加入了它们那群残暴同类的聚会。它们分担了石头的重量，并更大声地嘲笑起洛里。


    “你没法那样赢我们的！”

    “我们要吃饭了！”

    “每只吃到的会少一点——

    “——但约定就是约定！”


    ![image with no caption](img/024fig01.png.jpg)


    这些鸟现在玩耍着 15、20、25 块石头。它们能接住洛里扔过去的任何东西，还有十多只生物在等待加入。她该怎么把 `Xor` 从它们手里救出来呢？


    “聪明的轮转鸟，”

    “太多了打不过！”

    “你们停不住轮转鸟的——

    “——当有晚餐吃的时候！”


    鸟类的鸣叫声和 `Xor` 的尖叫声让她很难集中注意力，但洛里再次等待着，试图观察出一个规律。轮转鸟可以接住任何东西……


    “它在转圈圈！”

    “它会在哪里停？”

    “石头都在跳动，”

    “但蜥蜴不会——唔！！”


    就在其中一只鸟正要接住 `Xor` 时，洛里用一大块泥土砸中了它的喙。轮转鸟可以接住任何东西。但它不能同时接住两件东西！


    她在 `Xor` 掉落时抓住了他，并尽快地逃了。随着鸟群失去了节奏，石头和愤怒的轮转鸟飞得到处都是。有些试图追上她，但它们太胖了，追不上，也太愤怒了，没法继续押韵。


    “不公平！”

    “不公平！”

    “你偷了我们的零食！”

    “回来！”

    “不公平！”

    “你偷了……”


    “你还好吗？”洛里问。


    “不……好……也许吧。” `Xor` 喘着粗气。他们两个都是这样。小蜥蜴看起来并没有受伤，但他被吓得魂飞魄散。“鸟！”


    “这就是为什么你必须伪装自己，不是吗？”她问。“鸟儿想吃你。”

    “我讨厌鸟。”


    # 第 4 章 乌龟对洛里说


    ![image with no caption](img/027fig01.png.jpg)


    洛里在标有“递归交叉路口”的牌子处左转。爬过一个小山丘后，她来到了……递归交叉路口！


    “这是同一个地方吗，`Xor`？”洛里问。“看起来一样。”

    “试着向右转，”他说。


    她照做了，但过了一会儿，他们又回到了起点。当她尝试第二次、第三次，直到第二十十七次时，他们总是回到递归交叉路口。


    “似乎我正在去某个地方，但我们总是回到同一个地方。这是怎么了？”洛里想道。


    他们绕了…… . . . . . 又绕了…… . . . . . 又绕了…… . . . . . . 很多次，洛里已经数不清。


    就在她打算放弃时，传来一声巨大的撞击声，像是一叠盘子掉在地板上。


    他们吓得跳了起来，一瞬间 `Xor` 不小心变成了和洛里衬衫一样的颜色。他们环顾寻找声音来源，但没有找到。让他们惊讶的是，下一次转弯让他们进入了另一条路。


    这条路整洁而笔直，似乎无无止。。前方，一个戴着希腊头盔的男人坐在一只带壳的巨大轮绿色动物上（Eponym 可能会把这种生物称为乌龟，尽管她的说法并不完全准确）。它们正缓慢而稳定地离开。


    “嘿！等一下！”洛里大喊着向他们跑去。

    “终于有人追上我们了！”动物说道。

    “我以为这不可能，”男人说。

    “你好！”动物对洛里说。“我是乌龟，一只谦逊的乌龟。”他体大得完全不像普通的乌龟。“这是我尊敬的伙伴，逻辑学家阿基琉斯。”

    “为您效劳，小姐！”阿基琉斯从坐在乌龟背上向她鞠躬。

    “嗯，你好。我的名字是洛伦·伊普。”她尝试了礼貌。

    “你是怎么来到这里的，伊普小姐？”乌龟问。

    “我真的不知道，”洛里说。“我们本来沿着通往符号的路，但我在递归交叉路口迷路了。”

    “这经常发生。我猜你花了很多时间在追尾巴。”

    “但我没有尾巴，”她说。

    “所以它逃了你了，对吧？”

    “什么？”洛里问。“不，我没有……”


    ![image with no caption](img/029fig01.png.jpg)


    “也许它被优化掉了，”乌龟说。“没关系。你们大多数人都过来了，这才是重要的。你可以帮我们解决一个问题。”

    “好吧，我可以尝试，”洛里说，不确定她和乌龟是否在讨论同一个话题。

    “太棒了！”乌龟说。“我亲爱的朋友阿基琉斯和我考虑的问题是：一条无限长的绳有多长？”

    “无限长的绳？无限意味着它是真的、真的、真的、真的、真的、真的非常长。真的，”洛里说。真的。

    “啊！所以你同意我的观点，”阿基琉斯说。“这意味着举证责任必须由对方来承担。”

    “我背上阿基琉斯的负担已经足够了！”乌龟嘟哝着。

    “乌龟朋友在很多方面都是睿智的，”阿基琉斯说。“但他这次显然错了。他说无限长的绳可以恰好只有两英寸长！”

    “但无限长的绳怎么可能只有两英寸长？”洛里问。

    “他的主张是荒谬且不严密的，”阿基琉斯说。“我们对此持续存在分歧。”

    “我从不产生意见，”乌龟说。“我只是讨论，尤其是和像你这样的智者交流时，阿基琉斯。你的理解没有极限。”

    “你太客气了，亲爱的乌龟。”

    “我是真意的，”乌龟说。“允许我提议一种通过实验来解决问题的方法。”

    “请尽管提议吧，”阿基琉斯说。

    “让我们建立——当然，是假设的！——一段无限长的绳，然后测量它。伊普小姐可以做我们的公正裁判。”

    “我接受。实验总是比单纯的理论好，”阿基琉斯说。“而且公正裁判听起来很棒，尤其是当她已经同意我的时候！”

    “非常好，”乌龟说。“伊普小姐，想象你拥有无数段绳子。如果你把它们首尾相接，它们会是无限长的吗？假设的情况下？”

    “是的，一定是，”洛里说。

    “无限就是无限，”阿基琉斯说。“这符合逻辑。”

    “我想想。假设我们从一根一英寸长的绳开始，”乌龟说。“然后增加第二根一二分之一长的绳。它们合在一起有多长？”

    “一一又半英寸，”洛里说。

    “那比两英寸短？”乌龟问。

    “短了二分之一英寸。毫无疑问，”阿基琉斯说。

    “我们到为止达成了一致，”乌龟说。“也许我们会得出相同的结论。”

    “我怀疑！”阿基琉斯说。洛里不确定乌龟想表达什么，她也怀疑。

    “阿基琉斯，请数一下我们假设的绳吗？我想再增加第三根四分之一英寸长的，”乌龟说。“我们的绳现在是一三四分之一英寸长吗？”

    阿基琉斯从头盔下取出一本经常使用的笔记本，涂写了一些数字。“看起来是这样，”他说。

    “还有四分之一英寸的空间？”乌龟问。

    “是的，”阿基琉斯回答。“只有四分之一英寸了！你离失败只有一指之宽！”

    “增加一段八分之一英寸的，”乌龟说。“我还有空间吗？”

    “有的，但我很快就会赢过你！”希腊逻辑学家叫道道。“你的绳距离极限只有八分之一英寸了，而你才加了四段！”

    “你的算术一如既往准确，阿基琉斯。但为了科学，让我们持续到最后，”，”乌龟说。

    “不会很久的，”阿基琉斯说。“你的下一步是什么？”

    “我想再加一段绳，这次是十六分之一英寸长的。”

    “搞定！”阿基琉斯飞快地写写着。“只剩十六分之一英寸了，老朋友！”

    “只有这么多？”乌龟说。“那么对于下一段，我想增加一段一三十二分之一长的绳。”

    “如你所愿，可怜的乌龟。增加了一三十二分之一。还剩下一三十二分之一，还有无限段绳子要加！会有足够的绳子让你自己绊倒的！”阿基琉斯说道。


