    “Mrfl.” Laurie just rolled over. It felt way too early to wake up!


    “Come on. Wake up.”


    “Mom?” Laurie heard water splashing. The bath?


    “We’re here, girl. Help me tidy up the boat.”


    “The . . . boat? What b—” she opened her eyes. The walls were made of wood, and
    it was Winsome, not Laurie’s mother, who wanted her to wake up. Of course—Laurie
    was still on the `Doppelganger`.”

