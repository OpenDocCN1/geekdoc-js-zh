    \n“不客气，乌龟先生，”罗里说，“我不知道这么大的东西可以这么小。”\n\n“这就是 2 的力量，”乌龟说，“如果你把一个数字分成两半，再切成两半，以此类推，很快就会小到看不见。但总会有东西留下来。”\n\
    \n“乌龟先生，你知道这条路有多长吗？感觉它没完没了。我试着去符号城。”\n\n“这条路非常长，”他回答道，“事实上，它是无限的。”\n\n“噢，不！我该怎么到达终点？”\n\
    \n“你只需要两个简单的步骤。”\n\n“怎么做？”\n\n“你怎么想？右脚迈一步，然后左脚迈一步，”乌龟说，“你的观点才是重要的。它是积分的。”\n\n\
    当然了！如果一根无限长的线可以小于两英寸，那么只要你观察的角度正确，一条无限的路完全可以小于两步。罗里闭上眼睛，深吸了一气。她试图想象一条无限的路。那有点太难以处理了，于是她想象了一条非常、非常、非常、非常长的路。然后她想象把它对折。然后她再次对折，一次，一次，一次，一次，一次……\n\
    \n当罗里睁开眼睛时，阿基琉斯和乌龟已经消失了。无限的路现在变成了一个微小的短东西，几乎就像一块踏脚石。她用右脚向前迈了一步。然后又用左脚迈了一步。在她面前有一块路牌，上面写着…………\n\
    \n# 第 5 章 欢迎来到符号城\n\n![image with no caption](img/035fig01.png.jpg)\n\n符号城被高大且完美光滑的墙包围着。一条宽大的河流分成两股，流过城市的两侧。\n\
    \n“你对这个地方有什么了解吗？”罗里问。\n\n“那里的人有点奇怪，”索尔说。\n\n“那是什么意思？”\n\n“你会看到的。”\n\n小路通向一个带有闸机的门口。它看起来像这样：╞\n\
    \n两个和罗里相仿的男孩守着大门。一个穿一套亮白色西装，内穿衬衫。另一个穿一套亮黑色西装，内白色衬衫。\n\n*也许他们会考我一个谜题*，罗里想。*或者我需要弄清楚哪一个是撒谎者，哪一个是说真话的！*，罗里读过很多童话。她认为自己正在发现这个地方是如何运作的。\n\
    \n“名字？”其中一个问道。\n\n“罗里·伊普姆。”\n\n“密码？”另一个问道。\n\n“噢，我不知道密码，”罗里说。\n\n“那么你不能进去！”两个男孩齐声说道。\n\
    \n“这可算不上什么谜题。”\n\n“谜题？哈哈，不，抱歉，小姐。不是那样运行的。这里没有谜题，没有赌注，没有撒谎者，也没有说真话的人。我们也读过那些书，不是吗，托伦斯？”\n\
    \n“是的，我们读过，波恩。在我们的系统里没有那些神话童话之类的，小姐。文字游戏和聪明的谜题，哈！那只是糟糕的安全措施！”\n\n“但这不公平！”罗里喊道，“我怎么进去？”\n\
    \n“这很简单，”波恩说，“如果你有密码，意味着你可以通过语义闸机。”\n\n“如果你不能通过闸机，意味着你没有密码。这很逻辑，”托伦斯说，“你有密码吗？”\n\
    \n“不，我不知道是什么，”罗里说。\n\n“那么你不能进去！”他们再次在一起说。“可以给我一个提示吗？”罗里确信如果有某种线索，她是能猜到密码的。\n\n\
    “是的，提示是系统的一部分，”波恩说。\n\n“噢，好的。”\n\n“你为你的账户设置提示了吗？”托伦斯问。\n\n“嗯，没有，”她说，“这是我第一次来这里。”\n\
    \n“那你太倒霉了，小姐，”波恩说，“一旦你进来了，一定要为下次设置一个提示。”\n\n“并记得把你的密码改成一个好记但难猜的，”托伦斯说，“这只是良好的安全措施。”\n\
    \n“但我正试着`get`进去啊！我不知道该怎么办！”\n\n![image with no caption](img/037fig01.png.jpg)\n\
    \n“这很简单，”波恩说，“如果你有密码，意味着你可以通过语义闸机。”\n\n“如果你不能通过闸机，意味着你没有密码。这很逻辑，”托伦斯说。\n\n“这不完全对，不是吧？”罗里说，“如果闸机坏了呢？即使我有密码，也进不去。”\n\
    \n“嗯……”托伦斯看起来有些有些没底。\n\n“或者如果我骗了你们让你们`believing`我有密码，即使我并没有？那样我就可以没有密码也能进去。”\n\
    \n“嗯。”波恩考虑了罗里的论点，试图寻找漏洞。\n\n罗里继续说道：“或者如果我有密码，但我不想给你们呢？”\n\n“不，你还是不能侵入我们的领地，”波恩更有底心地说，“你提供一个与你提供的名字匹配的密码。”\n\
    \n“是‘Laurie’吗？”她猜道。\n\n“不！”他们一起喊道。\n\n“是‘11 月 1 日’吗？”那是罗里的生日。\n\n“不！”他们再次喊道。\n\
    \n“只剩一次机会了，小姐，”托伦斯说。\n\n“噢，不！真的吗？”\n\n“你只能尝试几次。这只是良好的安全措施。”\n\n“我有账户吗？”她想。\n\n\
    “我们无法确认或否定这一点，”波恩回答道，“那是糟糕的安全。”\n\n“我……`not`有账户吗？”\n\n“我们也无法否定或确认！”托伦斯回答道。\n\n\
    “这很简单——波恩开始说。\n\n“——是的，是的，”罗里打断道，“如果有，我知道；但如果没有，你们不能告诉我。而且只有在我之前设置过，你们才能给我提示！”这确实是良好的安全措施。*思考，罗里，思考！*\n\
    \n“好了，让我们重新开始，”她说。\n\n“很好，小姐，”托伦斯说，“名字？”\n\n“我告诉过你了，是 Lau——”她停住了。“其实……我的名字是同名·巴赫。”\n\
    \n“密码？”波恩问。\n\n*不可能是那么简单吧？*\n\n“巴赫的密码。”\n\n“欢迎！”波恩和托伦斯挥手让她通过闸机。\n\n巴赫会用自己的名字命名密码！\n"
- fmt: "\n![image with no caption](figs/web/041fig02.png.jpg)\n\n“`Al-go-rith-ms`.\
    \ That sounds like a kind of fruit.”\n\n“Are you always hungry, Xor?”\n\n“Time\
    \ flies like an arrow, and fruit flies like a banana. Let’s see if there’s a fruit\
    \ fly problem I can help them solve.”\n\nA bell jingled as Laurie opened the door.\
    \ “Hello, hello!” the shopkeeper said. “And welcome to my shop. I’m Tinker, and\
    \ you are looking for a finely crafted algorithm, am I right?”\n\nLaurie looked\
    \ at the items listed on the chalkboard, but they didn’t make any sense.\n\n![![image\
    \ with no caption](figs/web/042fig01.png.jpg)\n\n“I’m not sure. What is an algorithm?\
    \ Can you eat it?” asked Laurie.\n\n“What? No, it’s just a fancy way of saying\
    \ ‘how to do something.’ But `Algorithm` looks more impressive on the sign,” said\
    \ Tinker.\n\nXor turned orange with disappointment.\n\n“How to do something,”\
    \ repeated Laurie. “In that case, I want to find a sensible way to visit every\
    \ town.”\n\n“That sounds like an interesting problem. What have you been doing\
    \ so far?”\n\nLaurie told Tinker about her adventure in the Red-Black Forest and\
    \ her visit with Eponymous Bach.\n\n“A Hamiltonian path, eh?” said Tinker. “That’s\
    \ a tough one. I hate to say it, because he sounds like a nice person, but the\
    \ Wandering Salesman might take a long, long time to finish his tour of all the\
    \ towns.”\n\n“Oh, no! But why?”\n\n“If you always go to the nearest town you haven’t\
    \ visited yet, you might miss a town that’s just a little farther away. Then you\
    \ go to another town that’s closer to you but still farther from the one you missed,\
    \ and so on. You can end up crisscrossing the whole country to get to the last\
    \ few towns.”\n\n“That sounds exhausting,” said Laurie. The Wandering Salesman\
    \ wasn’t so sensible after all! “So how do I find the shortest path?”\n\n“I’ll\
    \ see what I have in stock. But it might be expensive.”\n\n“I don’t have much\
    \ money with me,” Laurie said. She took a few quarters from her pocket and showed\
    \ them to Tinker.\n\nHe looked at them with surprise. “Quarter Dollar? I don’t\
    \ know what a Dollar is, never mind a quarter of one. Is this money where you\
    \ come from?”\n\n“Of course it’s money! That’s seventy-five cents,” she said.\n\
    \n“Cents? We use Fair Coins here.”\n\n“What’s a Fair Coin?”\n\n“Well, they are\
    \ a bit bigger than these Quarter Dollars of yours, but not nearly as pretty!\
    \ You can tell genuine Fair Coins because they always flip heads or tails, fifty-fifty.”\n\
    \n“But you can flip quarters fifty-fifty, too!”\n\n“That may be true, but I can’t\
    \ just take your word for it, can I I? Here, all Fair Coins must be certified\
    \ Fair.”\n\nLaurie was crestfallen.\n\n“Don’t look so sad! I do want to help you,”\
    \ said Tinker. “Maybe we can do a trade. It so happens I’m in the market for a\
    \ particular algorithm.”\n\n“But I don’t have any algorithms, either,” said Laurie.\n\
    \n“That’s not a problem,” said Tinker. “You can compose new ones any time you\
    \ want, with a little bit of thinking.”\n\n“I can? How?”\n\n“Well, everyone develops\
    \ their own style. You can put little ideas together to make big ideas. Or you\
    \ put two ideas side by side and compare them. Or you start with big ideas and\
    \ take them apart.”\n\n“You mean like Eponymous does?”\n\n“Yes, just like her.\
    \ She’s a great Composer.”\n\nLaurie had never thought that she could do things\
    \ like that herself. But Tinker seemed to think it was normal.\n\n“So what do\
    \ I do?”\n\n“The algorithm I’m looking for is how to draw a circle,” Tinker said.\
    \ “It’s a tough one, so you’ll have to use your imagination. I’ve asked all the\
    \ adults and even Ponens and Tollens already, but all they do is mutter about\
    \ `x` squared plus `y` squared and never get anywhere.”\n\n“Take a look at this.”\
    \ He handed Laurie a wind-up toy animal. It had a `Shell`, and was Round and Green.\
    \ “This turtle can do three things: it can move forward or backward, it can turn,\
    \ and it can draw a little dot on the paper.”\n\n“Hey, that’s pretty neat!”\n\n\
    “Yes, but the thing is, it doesn’t know how to do anything else. That’s where\
    \ the algorithm comes in.” Tinker took out a piece of paper and wrote what looked\
    \ like a little poem:\n\n```\nGo forward one inch,\nmake a mark,\nrepeat five\
    \ times.\n```\n\nThen he wound up the turtle and placed it on the poem. It went\
    \ `zzzrbt bzzaap whuzzzsh`, and so on. Then it drew a line of dots, just like\
    \ the poem said:\n\n![![image with no caption](figs/web/045fig01.png.jpg)\n\n\
    “You see? If you put little ideas together, you can make bigger ones,” Tinker\
    \ said. “And you can compose those ideas into even bigger and bigger ones.”\n\n\
    “How do you do that?” asked Laurie.\n\n“By giving them a name. You can use the\
    \ name like a handle: you’d carry a pot of soup by the handle, and you can move\
    \ around an entire idea just by writing its name. Here, let’s call the first idea\
    \ `LINE`. Then you can put four lines together to make a square.”\n\n> **LINE**:\n\
    >\n> **Go forward one inch,**\n>\n> **make a mark,**\n>\n> **repeat five times.**\n\
    >\n> **SQUARE**:\n>\n> **Make a LINE,**\n>\n> **Make a right turn,**\n>\n> **repeat\
    \ four times.**\n>\n> **Make a SQUARE.**\n\nThe little turtle `zzzrbt`ed and `whuzzzsh`ed\
    \ and `bzzaap`ed, then drew this:\n\n![![image with no caption](figs/web/046fig01.png.jpg)\n\
    \nLaurie was amazed. It was like magic, but every step made sense.\n\n“So, knowing\
    \ what the turtle can do, can you teach it how to draw a circle?” Tinker asked.\
    \ \n\n“I don’t know,” Laurie said, “but I want to try!”\n\n“That’s good enough\
    \ for me. Here, you can work at my desk. There’s plenty of paper and compasses\
    \ and things like that.”\n\nLaurie sat down at Tinker’s desk. She doodled with\
    \ the compass and played with the turtle for a while, trying to remember what\
    \ she knew about circles.\n\n`A circle is round. No, not just round—perfectly\
    \ round. You put the pin in the center, and the pencil spins around. To make a\
    \ bigger one, you open the compass; to make a smaller one, you close the compass.\
    \ If you change the width of the compass when it’s spinning, it doesn’t make a\
    \ circle . . .*`\n\nSuddenly an idea, or maybe a memory, popped into her head:\
    \ `a circle is all of the points that are exactly the same distance from the center.\
    \ Hmm, what if you . . .*`\n\n```\nGo forward one inch,\nmake a mark,\ngo back\
    \ one inch,\nturn right a tiny bit,\nthen repeat!\n```\n\nAfter Laurie wrote out\
    \ her poem, she wound up the little turtle again and placed it on the paper. It\
    \ buzzed and burbled for a moment, then drew this:\n\n![![image with no caption](figs/web/047fig02.png.jpg)\n\
    \n“It’s working!” she called to Tinker. “Hey, it’s not stopping.” The turtle was\
    \ drawing dots it had already drawn.\n\n“I think it’s because you told it to repeat,\
    \ but not how times,” said Tinker.\n\n“Well, it should stop when the circle is\
    \ done,” Laurie said.\n\n“It doesn’t really understand circles,” Tinker said.\
    \ “It’s just a toy turtle, remember? You have to teach it.”\n\nLaurie thought\
    \ a little more, then rewrote her poem:\n\n> **CIRCLE**:\n>\n> **Go forward one\
    \ inch,**\n>\n> **make a mark,**\n>\n> **go back one inch,**\n>\n> **turn right\
    \ one degree,**\n>\n> **repeat three hundred sixty times.**\n\nThen she realized\
    \ that she could make circles of any size she wanted. It was just opening the\
    \ compass wider.\n\n> **TWO-CIRCLE**:\n>\n> **Go forward two inches,**\n>\n> **make\
    \ a mark,**\n>\n> **go back two inches,**\n>\n> **turn right one degree,**\n>\n\
    > **repeat three hundred sixty times.**\n\n“This is interesting. You’re working\
    \ really hard!” Tinker scratched his head. “But as it is, it’s no good.”\n\n“Why?”\n\
    \n“People want to make lots of different circles,” he said. “I’ll have to keep\
    \ a lot of algorithms of different sizes, just in case someone wants three-and-nine-thirteenth\
    \ inches or four-and-three-quarters inches.”\n\n“Well, what if you tell the turtle\
    \ how big to make the circle?” she said. “Maybe like this.”\n\n> **ANY-CIRCLE\
    \ (how-big?):**\n>\n> **Go forward how-big? inches,**\n>\n> **make a mark,**\n\
    >\n> **go back how-big? inches,**\n>\n> **turn right one degree,**\n>\n> **repeat\
    \ three hundred sixty times.**\n"
