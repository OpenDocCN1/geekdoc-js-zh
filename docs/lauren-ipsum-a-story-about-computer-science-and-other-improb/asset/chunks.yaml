- fmt: "\n“STANI!” he shouted at them.\n\nAll of the Jargon froze, their ears aquiver.\n\
    \n“CEPAT! AFVIGE! `SCHNELL! SCHNELL!`”\n\nAnd just like that, they were gone,\
    \ running away into the gloom of the forest.\n\nLaurie collapsed against a tree.\
    \ “Th-thank you,” she said.\n\n“Sure thing, miss. Just rest here a while,” the\
    \ man said. He dropped his pack with a loud jangle, then sat on top of it.\n\n\
    “What’s a Jargon?” she asked once she’d caught her breath.\n\n“Jargon live in\
    \ the swamps. They feed on attention. If they can’t get that, they’ll settle for\
    \ fear and confusion.”\n\n“But the first one was so friendly! I just talked to\
    \ it a little and it started following me.”\n\n“That’s how it starts,” he said.\
    \ “A little Jargon doesn’t look like much. Some people even keep them as pets.\
    \ But they form packs, and they are very dangerous.”\n\n“That’s terrible!”\n\n\
    He shrugged. “What can you do? Stand your ground and act confident. If you show\
    \ any fear, a pack of wild Jargon will run you right over.”\n\n“What did you say\
    \ to make them leave?”\n\n“I have no idea. It sounded good, though, didn’t it?”\
    \ he said. “So what’s your name, miss?”\n\n“My name is Laurie. I think I’m lost.”\n\
    \n“That’s wonderful!” the man said. “I’m lost too.”\n\n“Oh no! You mean you don’t\
    \ know where you are?”\n\n“No, I know exactly where I am.”\n\n“So you don’t know\
    \ where you’re going?”\n\n“I know exactly where I’m going. I’m on the way home.”\n\
    \nLaurie was almost too confused to feel confused. “But if you know where you\
    \ *are*,” she said, “and you know where you’re *going*, how can you be lost?”\n\
    \n“Because I don’t know how I’ll get there,” the man grinned. “I’m a Wandering\
    \ Salesman.”\n\n“A Wandering Salesman? What’s that?”\n\n“We wander from town to\
    \ town, selling and buying. There are two rules: you have to visit every town\
    \ before going home, and you can’t visit any town twice. Every road is the road\
    \ home except the road behind me.”\n\n“So you always go to the next place you’ve\
    \ never been to?” she asked.\n\n“That’s right! You’re guaranteed to get home eventually,”\
    \ he said. “It’s only logical. Along the way I’ve seen the sunrise over the Towers\
    \ of Hanoi and climbed the Upper Bounds. I’ve sat down at the `Lookup Table` and\
    \ floated on the `Overflow River`. It’s a good life. Being lost can be fun!”\n\
    \n“It’s not fun for me anymore,” said Laurie. “I don’t really know where I am,\
    \ or where I’m going, *or* how to get there.”\n\n“Hmm. Mostly lost is fun, but\
    \ completely lost is serious. You’re going home too, right?”\n\n“Yes, I want to\
    \ go home!” she said.\n\n“And where do you live?”\n\n“I live in Hamilton with\
    \ my mom. Do you know where it is?”\n\n“Not a clue. Never heard of it!” he said\
    \ cheerfully. “But that’s one out of three, anyway. You have a definite goal.”\n\
    \n“Um, I guess so.”\n\n“And I know where *I* am, and since we’re in the same place,\
    \ that means I know where *you* are. You are in the Red-Black Forest, near `Mile\
    \ Zero`.”\n\n*The what near who?* she thought to herself, but the man was still\
