    \ thing,” Laurie said.\n\n“Hmm?”\n\n“I don’t think anyone is stealing your fenceposts.\
    \ It’s just that you need *eleven* posts. Like this.”\n\n![image with no caption](figs/web/111fig01.png)\n\
    \n“Hmm!”\n\n* * *\n\n“Welcome back, miss,” said Anton. Laurie handed over the\
    \ paperwork she’d collected from the Byzantine Generals.\n\n“It looks like everything\
    \ is in order,” said Basil, examining the list of signatures. “These approvals\
    \ go all the way to the top!”\n\n“Have you anything to declare, miss?” asked Anton.\n\
    \n“Declare?”\n\n“What Lieutenant Anton means is,” said Basil, “is there anything\
    \ we should know about?”\n\n“Oh. Well, I think Anton is right. Zero is even.”\n\
    \n“No!” said Basil.\n\n“Yes. Zero can’t be odd because one is odd, and you can’t\
    \ have two odd numbers in a row, right?”\n\n“Right!” said Anton.\n\n“I suppose\
    \ not,” Basil grumped. “But that doesn’t prove it’s even.”\n\n“Well, if you add\
    \ an odd number and an even number together, you always get an odd number,” said\
    \ Laurie.\n\n“Um,” Basil ummed, thinking about it. “One plus two is three, two\
    \ plus three is five . . . yes.”\n\n“So I can prove whether zero is even or odd.\
    \ Add it to an odd number and see what you get. Zero plus one is one, and one\
    \ is odd. So zero must be even,” said Laurie.\n\n“I’m still not convinced,” said\
    \ Basil.\n\n“Okay,” Laurie said. “If you add two *even* numbers together, you\
    \ always get an even number, right? Zero plus two is two, which is even. Zero\
    \ is even again!”\n\n“Exactly!” Anton said.\n\n“Hrmph,” Basil hrmphed. “So zero\
    \ is even. How do I keep Anton from being Senior two days in a row?”\n\n“That’s\
    \ the easy part,” Laurie said. “The problem is that yesterday, the Thirtieth,\
    \ and today, the Zeroth, are both even. Anton was the Senior yesterday. So Basil,\
    \ you can be the Senior Officer of the Watch today.”\n\n“Now hang on a minute—”\
    \ said Anton.\n\n“—but only until lunchtime,” said Laurie. “After lunch today,\
    \ Anton is Senior. That way it’s fair.”\n\n“Brilliant!” said Senior Officer Basil.\
    \ “Junior Officer Anton, sign this young lady’s Pass!”\n\nApproved, approved,\
    \ approved, signed, and countersigned. Laurie was finally through the turnstile.\n\
    \n“I’m glad that’s over,” said Xor. “Now, where the heck is that Byzantine Process?”\n\
    \n# Chapter 16. A Change of Plan\n\n![image with no caption](figs/web/113fig01.png.jpg)\n\
    \n*SECOND*, the package’s directions read, *DELIVER TO BRUTO FUERZA, LOOKOUT HILL\
    \ LIGHTHOUSE*. Laurie and Xor couldn’t see any lighthouse, but there was a cloud\
    \ of dust rising from the hill.\n\n“You work for Winsome, eh? Right on time,”\
    \ said Bruto when they arrived. “I’m sorry to say we’re behind schedule. Our lighthouse\
    \ isn’t finished. We’ve been working double-time, day and night.”\n\n“Are you\
    \ going to put the lighthouse on top of that castle?” Laurie asked.\n\n“Castle?”\
    \ asked Bruto. “That *is* the lighthouse.”\n\nDozens of Green-Shelled Round machines\
    \ were busy all around the enormous structure. They looked just like Tinker’s\
    \ turtle, but they were the size of a large truck. Instead of drawing dots on\
    \ paper, these turtles were laying bricks on top of bricks, making WALLs, STAIRs,\
    \ and WINDOWs right before Laurie’s eyes.\n\n“What are all those things coming\
    \ out from the wall?” she asked, pointing to a forest of supports and buttresses\
    \ on one side of the tower.\n\n“We’ve had no end of problems,” said Bruto, shaking\
    \ his head and spitting. “The south wall was falling outward. So we had to shore\
    \ it up. Then it started falling *inward*.”\n\n“Is that why you’re behind schedule?”\
    \ she asked. There was something about the scene that bothered Laurie, but she\
    \ couldn’t put her finger on it. It looked . . . messy.\n\n“Things are always\
    \ going wrong,” Bruto said. “Big ideas come with big risks. But we can fix any\
    \ problem with more power and hard work!”\n\n“You certainly have a lot of both,”\
    \ Laurie said, with just a teensy tiny bit of envy. The things she could do with\
    \ all those turtles! “How do you teach the turtles to build a tower?”\n\n“Here,\
    \ let me show you.” Bruto led her to a tent nearby. A small army of people was\
    \ working around a table. “First we write the plans on paper.”\n\n> **BRICK-LINE:**\n\
    \n> \n\n> **Lay a brick,**\n\n> \n\n> **move forward,**\n\n> \n\n> **lay a brick,**\n\
    \n> \n\n> **move forward,**\n\n> \n\n> **lay a brick,**\n\n> \n\n> **move forward,**\n\
    \n> \n\n> **. . .**\n\n“That part makes a LINE of bricks. We stack a bunch of\
    \ BRICK-LINES on top of each other, and that’s how a wall gets built. To make\
    \ the wall thicker, we just add more commands.”\n\n> **BRICK-LINE-VERSION-TWO:**\n\
    \n> \n\n> **Lay a brick,**\n\n> \n\n> **lay a brick,**\n\n> \n\n> **move forward,**\n\
    \n> \n\n> **lay a brick,**\n\n> \n\n> **lay a brick,**\n\n> \n\n> **move forward,**\n\
    \n> \n\n> **lay a brick,**\n\n> \n\n> **lay a brick,**\n\n> \n\n> **move forward,**\n\
    \n> \n\n> **lay a brick,**\n\n> \n\n> **lay a brick,**\n\n> \n\n> **. . .**\n\n\
    “Wow, it just goes on and on and on,” said Laurie, flipping through the pages.\
    \ “It must have taken forever to write all of this.”\n\n“Big buildings need big\
    \ plans. Big plans need big teams. It’s only logical,” Bruto said. “Writing the\
    \ plans wasn’t the worst part, though. We’re running out of bricks!”\n\n“Really?\
    \ But why?”\n\n“The first version wasn’t strong enough, and it fell down. So now\
    \ I’m making a tower twice as big, twice as thick, and twice as tall. Two times\
    \ two times two is eight.”\n\n“So it needs eight times as many bricks?” Laurie\
    \ asked.\n\n“It’s just a matter of supplies.”\n\n“How do you know this version\
    \ of the plan will work?”\n\n“We’re not a bunch of amateurs, girlie. We do extensive\
    \ testing of our algorithms,” Bruto said. “Take a look at this!” Off to the side\
    \ was a table covered with tiny turtles and tiny bricks.\n\n“Hey, they’re building\
    \ a tower, too!” Laurie exclaimed. Sure enough, the turtles were following the\
    \ same plan as their bigger cousins.\n\n“We test new plans by building a scale\
    \ model,” Bruto explained.\n\n“But, Bruto, the model doesn’t have the same extra\
    \ stuff keeping the walls from falling down.”\n\n“Some problems only show up in\
    \ the full size. When that happens, we have to adapt.”\n\n“Oh,” Laurie said. “But\
    \ if the model is not the same as the real thing, how can you be sure that—”\n\
    \n![image with no caption](figs/web/116fig01.png.jpg)\n\nThey turned around just\
    \ in time to see the full-size tower collapse into a big pile of bricks. Bruto\
    \ stood still for a long time, watching the dust settle as the turtles got to\
    \ work cleaning up the mess.\n\n“Are you going to make it even bigger now?” Laurie\
    \ asked."
