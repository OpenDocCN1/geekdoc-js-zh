  trans: "\n\n“它们就在你周围。每条路都从另一条路分叉，”乌龟说，“一条路变成 2 条，2 变成 4 条，然后是 8、16，以此类推。经过 24 次分叉后，有超过\
    \ 1600 万条不同的路径。”\n\n“噢！又是 2 次方的力量。但这次它是变大了，而不是变小了，”洛莉说。\n\n“完全正确。你现在正处于通往‘熟悉、老、有趣、大多已失、比你大但比山小’的事物的道路上，”乌龟说，“我想我是其中之一。”\n\
    \n“那么我该如何选择走哪条叉呢？”\n\n“我建议智智选择。再见，伊普森小姐。”乌龟转身，缓慢而稳健地沿着左路走去。\n\n“等一下！我不知道你什么意思！”洛莉追在他身后。追上乌龟本应该是很容易的。但每走一步，他都离她越来越远。等洛莉莉走到下一个分叉口时，他已经无影无踪了。\n\
    \n> ![](img/common-01.png.jpg)`友好 | 不友好`![](img/common-02.png.jpg)\n\n“你觉得呢，索尔？哪边？”\n\
    \n“你真的想看到一个充满不友好事物的花园吗？”\n\n“有道理。”她向了左边。\n\n> ![](img/common-01.png.jpg)`空中 |\
    \ 地上`![](img/common-02.png.jpg)\n\n它们不想看到任何比自己大且会飞的东西，无论它有多友好。反正，乌龟是在地上的。\n\n\
    > ![](img/common-01.png.jpg)`轻 | 重`![](img/common-02.png.jpg)\n\n“绝对是重了！”索尔喊道。\n\
    \n> ![](img/common-01.png.jpg)`住在室外 | 住在室内`![](img/common-02.png.jpg)\n\n“乌龟住在室外，不是吗？”现在她想一想，洛莉并不完全确定。但这看起来像是个不错的猜测！\n\
    \n> ![](img/common-01.png.jpg)`从不睡觉 | 偶尔睡觉`![](img/common-02.png.jpg)\n\n“它们绝对会睡觉，”索尔说。他们向右边走去。\n\
    \n> ![](img/common-01.png.jpg)`晚上睡觉 | 白天睡觉`![](img/common-02.png.jpg)\n\n“晚上睡觉！”洛莉喊道，“我们应该快到了了！”\n\
    \n> ![](img/common-01.png.jpg)`多种颜色 | 单一颜色`![](img/common-02.png.jpg)\n\n洛莉径着左路跑去，没有停下来思考。但乌龟不是只有一种颜色吗？回去来已经太晚了。\n\
    \n> ![](img/common-01.png.jpg)`安静 | 吵闹`![](img/common-02.png.jpg)\n\n“我不喜欢吵闹的东西，”她说，“乌龟很安静的。”\n\
    \n> ![](img/common-01.png.jpg)`复数 | 单数`![](img/common-02.png.jpg)\n\n“那是什么意思？”“复数`意味着多于一个。`单数`意味着只有一个，”索尔说。他们向右边走去。\n\
    \n> ![](img/common-01.png.jpg)`本土 | 外来`![](img/common-02.png.jpg)\n\n“我认识这个，”洛莉说，“`本土`意味着来自这里。`外来`意味着来自其他地方。本土！”\n\
    \n> ![](img/common-01.png.jpg)`预期 | 意外`![](img/common-02.png.jpg)\n\n“我想知道我们会在哪里到达，”当他们向右时她说道，“什么是熟悉、老、有趣、大多已失、比我大但比山小且比灯塔短、友好、在地上、重、住在室外、晚上睡觉——”（她停下来喘了口气）——而且多种颜色、安静、单数、本土，*而且*是意外？”\n\
    \n> ![](img/common-01.png.jpg)`你的愿望 | 别人的愿望`![](img/common-02.png.jpg)\n\n“是我的愿望！”索尔和洛莉同时说道。他们咯咯笑着沿着左路走去。下一个指示牌让他们思考了一会儿。它问道：\n\
    \n> **你确定吗？**\n\n> \n\n> ![](img/common-01.png.jpg)`是 | 否`![](img/common-02.png.jpg)\n\
    \n“确定，我很确定！”洛莉说，“我怎么会想要别人的愿望呢？”她走下左路，“我想我们快穿过花园了，索尔！”\n\n她开始快走，然后慢跑，接着再次沿着那长长的绿色走廊跑了起来。索尔也变得兴奋起来，变成了各种波点色的颜色。洛莉已经在想她想给弗斯内尔、丁克尔以及——发送什么信息了。\n\
    \n“噢不！”\n\n洛莉猛地停下脚步。在他们面前是另一个分叉口。最后一个。\n\n左边的指示牌写着：\n\n> ![](img/common-01.png.jpg)`哈密顿（洛莉的愿望)`\n\
    \n右边的指示牌写着：\n\n> **凡娜阿姨（索尔的愿望）**![](img/common-02.png.jpg)\n\n“花园猜中了我的愿望！”洛莉说。\n\
    \n“我的也是，”索尔说。\n\n洛莉开始向左走，然后停了。。她又开始向右走，但又犹豫了。他们在那里站了非常长、非常安静的一分钟。\n\n“我们只能选一条路，”女孩说。\n\
    \n“是，”蜥蜴回答道。\n\n“而且无法回头。”\n\n“那是规则。”\n\n“你真的想找到你阿姨，”洛莉说。\n\n“而你真的想回家，”索尔叹了口气。\n\
    \n“这意味着我们必须选择，”洛莉说，“但怎么？”她是想回家，但也想让索尔找到凡娜阿姨。她想把索尔和凡娜一起带回家，那有多酷啊——\n\n“不，洛莉，”索尔忧伤地说，“这意味着我们必须分开。”\n\
    \n“但是……”\n\n“每条路只能有一个访客。那是规则。”他从她的肩膀跳下来，落在右边的指示牌上。“我猜……这就是你找到我的方式。”他的皮肤变成了橙紫色。\n\
    \n“我们可以做到的，”洛莉疯狂地思考着，“一旦你找到了你凡娜阿姨，就把她带去树灯塔。我会找到回来的办法。或者也许我会买一个望远镜和一个大灯光——”\n\n\
    “我们会再次相见的，”索尔说。\n\n“好的，”洛莉说，“保证吗？”\n\n“保证。”\n\n“我会吹哨子的，好吗？”\n\n“好。”\n\n“这样你就能听到我。”\n\
    \n“明白，”索尔说。\n\n“会好的。”\n\n“绝对会，”索尔同意道。\n\n“我走了。”\n\n“我也是。”\n\n洛莉确实尝试吹哨子，但不可能一边吹一边哭。试试看吧。\n\
    \n# 第二十章 终\n\n![没有说明的图片](img/147fig01.png.jpg)\n\n曼德西兰花丛变得越来越短、越来越杂乱，直到与森林融合在一起。此时已经是傍晚，影子变长了。森林里的树是大大的橡树和枫树，偶尔有几棵松树或云杉。还有许多各种幼树和灌木。因为叶子茂密，很难远眺，但只要绕开云杉，走路还是相当容易的。\n\
