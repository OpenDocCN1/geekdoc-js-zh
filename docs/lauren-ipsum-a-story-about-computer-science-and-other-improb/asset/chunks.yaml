    “也许你是对的，”他再次赞同道。“但我是个糟糕的主人！你走了这么久，一定口渴了。想喝点水吗？”弗勒涅尔在一个托盘上递给她一个水壶和几个玻璃杯。


    “噢，好的，麻烦了。”劳里拿过一个杯子试图接水。水溅到了她的鞋上。


    “`Hey!`！这个杯子没有底！”


    “那不是杯子，亲爱的孩子。那是玻璃杯，”他说。


    “这个`glass`没有底。我该怎么用它喝水？”


    “仔细想想，那不完全是玻璃杯，”弗勒涅尔说，“它是一个马克杯。看到手柄了吗？”


    “好吧，这个`mug`有——”


    “第三次想想，”他摸着胡子说道，“它是玻璃制成的，但也有手柄。所以也许我们应该叫它玻璃马克杯，或者，马克杯玻璃杯……”


    “我不在乎你管它`call` 什么！”劳里大喊道，“它`got no bottom`，而且水……我是意思是，嗯，你叫它玻璃杯，但它没有……噢。”她的脸变得通红了。


    弗勒涅尔给劳里另一个玻璃马克杯杯。“你又说对了。无论人们给它们起什么名字，事物就是它的样子。”


    “但名字不重要吗？”劳里问道，仔细检查她那个新的玻璃-杯-马克杯有没有洞。幸运的是，这有一个底的。


    “名字是有局限性的。而且很多名字其实是伪装的同一东西。”


    “真的吗？”


    “当然了。你是劳里还是劳伦？”


    “嗯，两个都是。但我喜欢劳里。当妈妈非常生气时，她会叫我劳伦。”她叉着腰，向后仰起头。“`Lauren Ipsum，现在下楼!`”


    弗勒涅尔像马一样大笑起来，如果那只马听懂了笑话的话。“全名是一个强大的东西。但无论怎么叫，你都是同一个人。有时候不同的东西会有相同的名字。你叫你妈妈为‘妈妈’，我也叫我妈妈为‘妈妈’。”


    “但我不会叫`your`妈妈为‘妈妈’！”劳里说。*那样会多奇怪啊？*


    “这就对了。这很符合逻辑。你必须透过`past`名字去看清事物的本质。这就是弗勒涅尔第一定律。”


    “你听起来就像那个同名的巴赫，”劳里说。


    “真的吗？嗯，我也是作曲家，”弗勒涅尔说，“我从大想法开始，然后让它们变小。”


    “让它们变小？为什么？”


    “为什么不呢？只有心胸狭窄的人认为大问题需要大想法。”


    劳里并不确定他在说什么。“你如何让一个想法变小？”


    “通过`De`composing（分解）。如果不使用`lighthouse`这个词，你会如何描述一座灯塔？”


    “嗯，它是海边的一座白色高塔，顶部有一间满是窗户的房间，上面有一个巨大的灯，里面有一条长长的弯曲的楼梯。”


    “非常好，”弗勒涅尔说，“现在看每一个部分，看看它是不是必不可少的。如果你那座有窗户、有大灯和楼梯的海边高塔是`pink`粉色的，它还能同样地工作吗？”


    “我想可以。我没见过粉红色的灯塔，”她说。


    “我没见过！但如果一切都是现成的，生活就会很无聊。为什么你的灯塔是高的？”


    “为了让船能看到你，”劳里说。“短灯塔效果没那么好。而且你需要弯曲的楼梯才能到达顶部。”


    “为什么要灯？”


    “有灯是为了让船在晚上能看到你。”


    “还有灯塔守护人的房间呢？”


    “为了你可以看到`them`。”


    “噢，原来，”弗勒涅尔说。“我的气球在高处有一个灯，这样远处的人就能看到它。我可以看向侧面看到他们。我坐电梯到达顶部。颜色不重要。它做了灯塔能做的一切。它是灯塔吗？”


    “它`like`一个灯塔，”劳里承认道。


    “你可真会还！我满足于‘像灯塔’了，”他说。


    “这就是你 Decompose 的方法？”


    “大体如此。你把一个大想法拆开，看看每个部分背后的`why`。然后你寻找执行相同功能的更小想法。例如，你觉得我的那个小铃怎么样？”


    “你的那个`little`小铃！那东西吓坏了——”


    “它确实需要一些调整，我同意。但想法是合理的，”他说，“铃的关键部分是声音。因为铃在很远的地面上，它需要巨大的声音我才能听到。”


    “那你为什么不用一个大铃呢？”她问。


    “如果我用大铃，我就需要一个大框架来挂它。”


