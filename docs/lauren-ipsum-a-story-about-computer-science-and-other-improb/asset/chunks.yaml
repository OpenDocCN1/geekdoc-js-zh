    “No, it sounds like you drifted away from your real goal. By the time you got
    to Rustic, you didn’t ask how to find Hamilton. You asked him how to find a short
    path through all the towns in Userland.”


    “Wow, you’re right.” Laurie looked down at her lap. “I feel really stupid now.”


    “Nah, don’t feel bad. Everyone makes that kind of mistake.”


    “They do?”


    “You have no idea,” said Winsome. “Algorithms don’t just happen in turtles and
    ants and coins. They also happen inside your head, and those are the hardest to
    get right.”


    “I still don’t know how I’m going to get home.”


    “Neither do I. But asking the right question is a good start. And as long as you’re
    here, you might as well be useful.” Winsome pointed out the window to a tall white
    tower on a hill. “Do you see that lighthouse?”


    “What about it?”


    “Would you like to go up to the top? The view is amazing.”


    “Well . . . sure! That sounds like fun,” Laurie said.


    “Great. Take this.” Winsome handed her a heavy wooden box. “I need you to deliver
    it to the lighthouse keeper.”


    “What is it?”


    “It’s very expensive. And fragile.”


    “But—”


    “Go on, he’s waiting. I’ll meet you back at the boat.”


    ![figs/web/095fig01.png.jpg)


    Laurie’s climb up the hill was exhausting, so she stopped at the base of the lighthouse
    to rest a moment before checking for a doorbell or someone to let her in. There
    was no sign of either on the ground floor, so she shouted at the tower.


    “Hello! Hello up there! Anyone?”


    A voice came floating down. “Yes! Come up! The door is open.”


    Round and round up the staircase, Laurie huffed and puffed with the unwieldy box,
    Xor perched on her shoulder. Finally she reached the lighthouse keeper’s room
    at the top of the tower, completely out of breath. The lighthouse keeper had his
    back to her, scanning the horizon with binoculars.


    “Oh, good,” he murmured. “Put it down carefully.”


    Laurie heaved the box onto a bench and took a look around. The room had no walls
    to speak of; it was made almost entirely of glass. Laurie stood next to the lighthouse
    keeper to get a better look out the windows. To one side was the wide blue water.
    She could barely see a bump on the horizon—maybe that was Userland. To the other
    side, all of Abstract Island was laid out like, well, like a map. On the coast
    were the port and the Doppppelganger. Two people in togas were arguing in front
    of the Philosopher’s Diner. From above, the island looked even more neat and organized.


    “Wow! You can see everything from here!” Laurie exclaimed.


    “Yes.” The lighthouse keeper just kept his eyes glued to the scenery outside.


    “So . . . that’s it?”


    “That’s it,” said the lighthouse keeper. “Oh, er, thank you.”


    Walking downhill, without the box, was a lot easier than going up.


    “What *was* in that box, anyway?” Laurie wondered out loud on her way back to
    the `Doppelganger`.


    Xor poked his head out of her pocket. “My guess is light-bulbs. Something boring,”
    he chimed in. “Adults are always making a fuss over boring things.”


    Back at the boat, Winsome was getting ready to sail again.


    “Good work, girl. Thanks,” she said as Laurie came aboard.


    “You’re welcome. He didn’t talk much.”


    “That’s how some people get, living in a tower all the time,” Winsome said. “Other
    people start to talk a *lot*.”


    “They do?”


    “You’ll see. So what are you going to do now?”


    “I thought about it,” Laurie said. “Userland is just one island. This island is
    . . . nice, but I asked around, and no one here has heard of Hamilton either.”


    “Well,” said Winsome, “do you want to be my assistant?”


    “What do you mean?”


    “You’re looking for a way home, right? The `Doppelganger` goes just about everywhere.
    You can help me make deliveries, and you’ll be able to look for answers in a lot
    more places than you could by walking. Or swimming.”


    “Isn’t that the same as you telling me where to go?”


    Winsome smiled. “You’re getting smarter by the minute. But don’t get too smart.
    Sail with me for a while. I need the help. If you don’t like it, I’ll drop you
    off wherever you want. No hard feelings.”


    Laurie thought a moment, biting her lip. “Okay,” she said, “you’ve got yourself
    a deal!”


    # Chapter 15. Cleverness When It Counts


    ![figs/web/099fig01.png.jpg)


    Travelling with Winsome on the `Doppelganger` was lots of fun. Laurie got to see
    so many strange places and people that sometimes she forgot she was trying to
    find her way back to Hamilton. But her job wasn’t easy.


    Whenever they arrived at an island, Winsome would take a huge bag of letters into
    town and deliver them. She would return a few hours later with a new load of letters
    to take from that island to somewhere else.


    Laurie’s job was to deliver the “interesting” packages. (Winsome kept using that
    word. Laurie didn’t think it meant what Winsome thought it meant.) “Interesting”
    customers lived in tall towers in the middle of nowhere, over shaky, scary bridges,
    on top of high hills, or on the sides of cliffs. The packages were heavy (and
    fragile . . . and expensive), and the directions for their destinations were often
    bizarre and incomplete. Just to make it there and back in one piece, Laurie had
    to be clever about her work.


    Unclear directions were bad enough, but this time, the package Laurie was supposed
    to deliver didn’t have a proper address at all. It just said `FIRST, FOLLOW THE
    BYZANTINE PROCESS.` Winsome had gone off somewhere, so Laurie couldn’t even ask
    her for help.


    “What is the Byzantine Process? I don’t even know what it looks like. How can
    I follow it?” she wondered aloud.


    “We’re on the Island of Byzantium,” said Xor, “so the Process must be the name
    of the main road. Or a river. Or a road beside the river. It’s only logical.”


    “You have no idea, do you, Xor?”


    “Sure I do! My stepsister is an Atlasaurus!”


    “What’s an Atlas . . . never mind. I don’t want to know.”


    Where to begin was no mystery, at least. The entrance to Byzantium was blocked
    by an enormous stone building. `All Deliveries Enter Here`, a sign read. A long
    red carpet led inside to a semantic turnstile with two guards, just like in Symbol.
    The guards seemed to be in the middle of an argument.


    “. . . that makes no sense, Anton!”


    “It makes perfect sense, Basil. If you only—”


    “Excuse me,” said Laurie. “I’d like to pass through.”


    “Sorry, miss. For that, you must have a Pass signed by the Junior Officer of the
    Watch—” began Anton.


    “—and countersigned by the Senior Officer of the Watch,” Basil finished.


    “Who are they?” she asked.


    “We are.”


    “Oh, good.”


    “Lieutenant Basil is the Junior Officer of the Watch, and I am the Senior Officer
    of the Watch—” said Anton.


    “—but only on even-numbered days,” said Basil. “On odd-numbered days, I’m the
    Senior Officer and Lieutenant Anton is the Junior.”


    “What day is it today?”


    “That’s what we were discussing before you interrupted,” Anton said. “Yesterday
    was the Thirtieth of Pentember. I think we all agree that thirty is an even number,
    and so I was the Senior Officer.”


    “That means today is the Zeroth of Hectember,” said Basil.


    *The Zeroth of . . . ? Well, everything has to start somewhere*, Laurie thought.
    “So Anton should be Junior today, and Basil should be Senior, right?”


    “It’s not as simple as that, miss!” said Anton.


    “There is the question of whether zero is even or odd,” said Basil.


    “Oh.” Laurie had never thought of zero that way. Now she was curious. “So which
    is it? Even or odd?”


    “Zero is even!” said Anton. “It evenly divides by two. Zero divided by two is
    zero.”


    “That doesn’t prove a thing,” said Basil. “Zero divided by *any* number is zero.
    More to the point, if zero is even, then Anton would have two days in a row as
    Senior Officer, and I won’t stand for that!”


    “Even more to the point,” said Anton, “if zero is odd, then Basil would be Senior
    both today and tomorrow, the First of Hectember. I won’t sit still for *that*!”


    “You see, miss, when it comes to important questions, where you stand depends
    on where you sit,” Basil said.

