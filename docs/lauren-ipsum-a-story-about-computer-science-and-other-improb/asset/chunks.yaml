    “But—” Laurie started.


    “Anyway, you need to have your Pass Approval Request Form approved first.”


    “My Pass Approval Request Form? I don’t understand.”


    “Oh, we don’t have the Passes here, of course,” said Basil. “That would be bad
    security!”


    “You have to get your Pass Approval Request approved by General Case. If he says
    you can pass, then we say you can pass,” said Anton.


    “He’s down the hall to the right,” added Basil. “Now see here, Anton: If you add
    two odd numbers together you get an even, right? And zero plus zero is zero. So
    if zero is even like you insist, then it must also be odd at the same time . .
    …”


    Laurie walked down an endless hall until she came to a slightly open door marked
    `General Constantin Case, Office of Perimeter Security`. She knocked lightly and
    stepped inside the room.


    “Hello, Mister General, sir? I’m looking for a Pass to go through the gate.”


    “Hmm.” General Case looked up from his papers for a moment. “And what is your
    business?”


    “I’m delivering a package.”


    “Hmm. How many fenceposts do I need for 100 feet of fence?”


    “Excuse me?”


    “Fenceposts, child. I want to put a fencepost every 10 feet for 100 feet of fence.
    How many do I need?”


    “Uh, 10?”


    “That’s what I thought, too,” he said, “but we’re running short. I suspect the
    enemy is stealing them.”


    Laurie had no idea what he was talking about. “I’m sorry to bother you, sir, but
    about that Pass . . …”


    ![image with no caption](figs/web/103fig01.png.jpg)


    “Take this to General Darius down the hall, in the Office of Logistics,” said
    Case, handing her a blank Pass Approval Request Form. “If he approves it, I’ll
    approve it.”


    “Thank you!” Laurie said brightly.


    “Hmm.” He turned back to his fencepost problem, leaving Laurie to find General
    Darius on her own.


    ***


    General Damien Darius was also busy with a stack of paperwork. Laurie noticed
    a large map of a river on his desk; the map was covered in scribbles and arrows.


    “General Darius? I need a Pass,” said Laurie, handing him the Pass Approval Request
    Form she’d gotten from Case.


    “Are you here about the mandelbroccoli?”


    “Uh, mandelbroccoli? No, sir.”


    “Then you have information regarding the wolf.”


    “The wolf?”


    “Yes, the wolf,” said Darius. “One of my men is trying to move a wolf, a goat,
    and a load of mandelbroccoli across the Concurrent Streams. The boat is only big
    enough for him and one other thing.”


    “Can’t he take one at a time?” she asked.


    “No good. If he takes the wolf and leaves the goat alone with the broccoli, she’ll
    eat it. If he takes the broccoli and leaves the wolf with the goat, the wolf will
    eat her.”


    “So take the goat first,” said Laurie, doing a pantomime in her head. “And then
    take . . . oh.”


    “Yes. No matter what he takes next, he has the same problem on the other side.”
    Darius said.


    ![image with no caption](figs/web/105fig01.png.jpg)


    “That’s terrible news, but I’m actually asking about a Pass,” Laurie replied.


    “And I don’t have time for civilian chit-chat. Take whatever this is to General
    Euripides in the Office of Records,” Darius said, handing back Laurie’s Form.
    “If he approves it, I’ll approve it.”


    Down the hall Laurie went.


    ***


    Euripides had his hands full with a problem of his own. People were crowded around
    huge record books lying on tables in the Office of Records. Some people were trying
    to read long strings of numbers from the books. Others wanted to write new numbers
    in the books. The readers and writers were thrashing about, getting in each other’s
    way. It looked like a fight could start at any time.


    The General was pacing from table to table, listening to complaints and issuing
    orders. A crowd of people followed him around, shouting over one another, trying
    to get his attention. It looked like he barely had time to think.


    Laurie pushed and struggled and wiggled her way to the front of the crowd.


    “Sir? General Euripides? Can you help me?”


    “Eh? Oh, another one. Are you a reader or a writer?”


    “I’m not a reader or a writer. I need you to approve—” Laurie began, but the General
    had to go break up an argument.


    “Now what was it you wanted? A reader? Which book?” Euripides asked when he came
    back.


    “No, sir. I need—Sir? Hello, sir?”


    Euripides was off to another corner of the room. Laurie tried to get his attention
    again, but the crowd kept shoving her out of the way.


    ***


    Laurie sat on the floor in the hallway and put her head on her knees, exhausted
    and confused. Mandelbroccoli, fence-posts, Passes, General This, General That
    . . . where did it all end? She could still hear the fighting over who got to
    use what book next.


    “Those people are so rude,” she grumbled.


    “Why can’t they take turns and share?”


    “Maybe nobody taught them how,” Xor said. “My cousin Rex never liked to share.
    Of course, he was forty feet tall and had teeth as long as your arm.”


    “Somebody should teach them. It’s not fair.”


    “Yeah,” Xor said. “Hey, aren’t you Somebody?”


    “Me?”


    “Yeah! I’m pretty sure you are Somebody. Otherwise, you’d be Nobody, and that
    wouldn’t make sense to Anybody.”


    “But I’m just a kid. No one pays attention to kids.”


    “So? No one pays attention to me, either,” he said.


    “But that’s what you want, right? To be invisible.”


    “Oh. Yeah.”


    “What are we going to do, Xor?”


    “I dunno. Think. You’re good at that.”


    “No, I’m not,” Laurie muttered.


    “Really? Tinker thought you are. Winsome does, too.”


    Laurie put her head down again and sighed. “I’m just her delivery girl.”


    “No, you’re her interesting delivery girl,” Xor said.


    “So?”


    “So you figure out how to go where other people can’t. Remember when you were
    arguing with Ponens and Tollens outside of Symbol? I didn’t think you’d find a
    way past. But you did. Same with old lady.”


    “They never caught us, either,” Laurie smiled a little.


    “What?” Xor asked.


    “I just . . I can’t. She gave me a job, and I have to do myself.”


    So with nothing else she could do, and nowhere she could go, Laurie started to
    think.


    She needed an Approval from Euripides so she could get one from Darius. Then,
    the Form had to be signed and countersigned by Basil and Anton. There was something
    familiar about this chaos. Something Hugh had told her. *Think of an answer, and
    then look for a problem that fits.*


    Euripides was up to his ears with problems. Everyone wanted to do everything at
    once. Maybe she should start there . .


    ***


    A half-hour later, Laurie was back in the Office of Records. She didn’t shout,
    or shove, or cut in front of anyone. She waited. Eventually one of the books became
    completely free. Laurie walked over to it and drew a line on the floor.


    A woman came over to write in the book. Laurie stepped aside and let her work.
    A few moments later, a man came up to read from the book.


    “New policy, sir,” said Laurie. “You have to stand on the line until the first
    customer is finished.”


    “But I have to look up something on page 1728!”


    “I’m sorry,” she said. “General’s Orders. But you’re next.”


    “Oh. All right, then.” The man stood carefully on the line. Another person came
    to read from page 1024.


    “General’s Orders,” said 1728, pointing to the line. “Don’t worry. You’re right
    after me.”


    Laurie held the line until the pattern looked like it would keep going on its
    own. Each new person would be told to wait by the others already in line. Then
    she waited for the next book to open up.


    As the idea spread, people started drawing lines of their own in front of other
    books. Soon the whole Records Office was calm and organized. After all, it was
    General’s Orders.

