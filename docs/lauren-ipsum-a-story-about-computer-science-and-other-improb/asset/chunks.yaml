    罗莉擅长寻找那些在水面上穿梭得越来越慢的模式，但最终，她变得不耐烦了。


    “温森，我们要去哪里？”


    “我们要去抽象岛，”温森回答道，“我有些东西要送达。我们应该在早晨前到达那里。”


    “抽象岛？我的地图上没有那个地方，”罗莉说。


    “我敢打赌，有很多东西可不在你的地图上，孩子。”


    “你是说地图并不等于疆域？”


    “哈？是谁告诉你的？”温森问道。


    “特普上校。他给我寄了一封非常奇怪的信。”


    “噢，是`他`啊。”


    “你认识特普上校吗？”


    ![image with no caption](img/087fig01.png.jpg)


    “他是个疯老头，”温森说，“总是爱管别人的闲。发那些带着他愚蠢秘密信的无礼守护（daemons）。”


    “那些秘密信很有趣。Xor 想出了办法怎么——”


    “对上校要小心，罗莉。我很确定他就是那个想把你关进监狱的人。”


    “他是谁？”罗莉问。


    “他是我的——他曾是我的老板，”温森说，“这是他的邮件船船。直到我复制了它。我们 . . . 在经营方式上产生了分歧，所以我自立门户了。”


    “你和他吵架了？”


    “嗯，是的，”温森说。


    “你们为了什么吵架？”


    “他希望一切保持原样。我 . . . 不。”


    “噢，”罗莉说。温森声音中的某些信息告诉罗莉不要再问关于吵架的事。他们沉默了一会儿，看着天空和水面。


    “上校在某方面是对的，”温森轻声说。


    “什么？”


    “地图只是一张画。它不是真实的。如果有人忘记把抽象岛画在地图上，那个岛依然存在。它不在乎你知道什么。”


    “用户之地（Userland）没人提到过岛屿，”罗莉说。


    “那里的人对外界世界并不并不多。那是上校喜欢的样子。用户之地是一个岛屿。这是一个由岛屿组成的世界。”


    罗莉不喜欢她听到的这些。“但是温森，我必须按照我的地图回家。”


    “是吗？”


    “是！”


    “为什么？”


    “每个人都这么告诉我的，”罗莉说。


    “那个理由不够充分，”温森说。


    “不是吗？” 人们总是时候告诉罗莉该怎么做。当然，她并不总是听他们的话，但她通常会为此感到很抱歉。


    “不！你应该一直知道自己`为什么`在做某件事，”温森说，“而不是因为有人让你这么做。保持清醒并灵活一点，孩子。否则，你就像那些小滑翔器，别人推你去哪里你就去哪里。”


    “但是廷克说过——”


    “先把廷克忘掉，”温森说，“你起初是怎么迷路的？”


    “我跟我妈妈吵架了，”罗莉说，“妈妈想让我暑假去学校，但我根本不需要！”


    “也许暑期学校是件好事。我听其他国家的孩子——”


    “我不在乎！我不想和我不认识的人在学校里浪费整个暑假！”


    “好吧，这很合理。那后来发生了什么？”


    “我进森林里散了步想冷静一下，但我太气了，忘了看路，结果迷路了，我绕圈子走了好久，”罗莉说，眼里满了泪水，“然后我被那些术语（Jargon）怪物袭击了，我一直跑直到来到这里，但因为我不知道规则，我自己制造了一个术语，而且这里的人甚至没听过哈密尔顿、美元或者任何东西！我不明白为什么我需要密码，现在我要去一个地图上根本没有岛，而且——”


    “嘿，慢点……”温森说。


    “——现在我又彻底迷路了，而且 . . 和 . . ”罗莉开始抽泣。


    “等等，别哭，老天……”


    温森知道如何对付那些完全不想见的讨厌鬼，但一个哭的女孩是另一回事。她给了罗莉一个笨拙的拥抱，直到声音停止。


    “好了吗？”


    “嗯。”罗莉吸了吸鼻子。


    “很好。我原以为你会把船弄沉了，”温森说，“你不要去下面休息一下？在睡觉前想些什么。”


    “想什么？”


    “画你自己的地图。”


    # 第 14 章：在抽象之中


    ![image with no caption](img/091fig01.png.jpg)


    “罗莉，醒醒。”


    “Mrfl。”罗莉只是翻了个身。感觉现在醒得太早了！


    “快点。醒醒。”


    “妈妈？”罗莉听到水花声。洗澡吗？


    “我们到了，孩子。帮我整理一下船。”


    “那 . . 船？什么什——”她睁开眼睛。墙壁是木制的，是温森而不是罗莉的妈妈想让她醒来。当然——罗莉仍然在`双生胎（Doppelganger）`上。”

