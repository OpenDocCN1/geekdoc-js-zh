    and longer, but eventually, she grew restless.


    “Winsome, where are we going?”


    “We’re headed for Abstract Island,” Winsome replied. “I have some deliveries to
    make. We should get there by morning.”


    “Abstract Island? That isn’t on my map,” Laurie said.


    “I bet a lot of things aren’t on your map, girl.”


    “You mean the map is not the territory?”


    “Eh? Who told you that?” Winsome asked.


    “Colonel Trapp. He sent me a really strange letter.”


    “Oh, *him*.”


    “Do you know Colonel Trapp?”


    ![image with no caption](figs/web/087fig01.png.jpg)


    “He’s a crazy old man,” Winsome said. “Always messing around in other people’s
    business. Sending those rude daemons with his stupid secret messages.”


    “The secret messages were fun. Xor figured out how to—”


    “Be careful with the Colonel, Laurie. I’m pretty sure he was the one trying to
    get you thrown in jail.”


    “Who is he?” Laurie asked.


    “He’s my—he was my boss,” said Winsome. “This was his mail boat. Until I copied
    it. We . . . disagree about how to do business, so I struck out on my own.”


    “You had a fight with him?”


    “Well, yes,” Winsome said.


    “What did you fight about?”


    “He wants things to stay just the way they are. I . . . don’t.”


    “Oh,” said Laurie. Something about Winsome’s voice told Laurie not to ask her
    more about the fight. They were quiet for a time, watching the sky and water.


    “The Colonel’s right about one thing,” Winsome said softly.


    “What’s that?”


    “A map is just a picture. It’s not the real thing. If someone forgets to put Abstract
    Island on a map, the Island still exists. It doesn’t care what you know.”


    “No one in Userland said anything about islands,” Laurie said.


    “The people back there don’t know much about the world outside. That’s the way
    the Colonel likes it. Userland is an island. It’s a whole world of islands.”


    Laurie didn’t like what she was hearing. “But Winsome, I have to follow my map
    to get back home.”


    “Do you?”


    “Yes!”


    “Why?”


    “That’s what everyone told me to do,” Laurie said.


    “That’s not a good enough reason,” Winsome said.


    “It isn’t?” People told Laurie what to do all the time. She didn’t always do what
    they said, of course, but she usually felt bad about it.


    “No! You should always know *why* you are doing something,” said Winsome, “and
    not just because someone told you to do it. Keep your head on and be flexible,
    girl. Otherwise, you’re like those little gliders, going wherever people send
    you.”


    “But Tinker said—”


    “Forget Tinker for a minute,” Winsome said. “How did you get lost in the first
    place?”


    “I had a fight with my mom,” Laurie said. “Mom wants me to go to school over the
    summer, but I don’t even need to!”


    “Maybe summer school is a good thing. I heard that kids in other countries—”


    “I don’t care! I don’t want to waste the whole summer in school with people I
    don’t even know!”


    “Okay, that’s fair. So then what happened?”


    “I took a walk in the woods to calm down a little, but I was so mad that I forgot
    to watch where I was going, and I got lost, and I spent a long time walking in
    circles,” said Laurie, her eyes filling with tears. “Then I was attacked by those
    Jargon things, and I ran and ran until I came here, but then I made a Jargon myself
    because I didn’t know the rules, and no one here has even heard of Hamilton, or
    dollars, or anything! And I don’t understand why I need a password, and now I’m
    going to an island that’s not even on the map and—”


    “Hey, slow down—” Winsome said.


    “—now I’m lost all over again and . . . and . . .” Laurie started sobbing.


    “Wait, don’t, oh man . . .”


    Winsome knew how to handle the nastiest people you’d never want to meet, but a
    crying girl was something else. She gave Laurie an awkward hug until the noise
    stopped.


    “You done?”


    “Yeah.” Laurie sniffled.


    “Good. I thought you were going to sink the boat,” said Winsome. “Why don’t you
    go below and get some rest? And think about something before you fall asleep.”


    “Think about what?”


    “Making your own map.”


    # Chapter 14. In the Abstract


    ![image with no caption](figs/web/091fig01.png.jpg)


    “Laurie, wake up.”


    “Mrfl.” Laurie just rolled over. It felt way too early to wake up!


    “Come on. Wake up.”


    “Mom?” Laurie heard water splashing. The bath?


    “We’re here, girl. Help me tidy up the boat.”


    “The . . . boat? What b—” she opened her eyes. The walls were made of wood, and
    it was Winsome, not Laurie’s mother, who wanted her to wake up. Of course—Laurie
    was still on the *Doppelganger*.


    Laurie went above deck and got her first look at Abstract Island. The *Doppelganger*
    was tied up at the end of the main pier. The little harbor was a perfect half-moon.
    All around the docks, people were fishing or fussing around on identical boats.
    On land, identical houses and shops were scattered among trees and hilly parks.


    “Hey, Winsome, why do all of the buildings look the same?” Laurie asked. “And
    the trees, too!”


    “That’s how they do things here. First they talk *endlessly* about what makes
    a building, or a street, or a pigeon. Once they find the perfect abstract design,
    they make a bunch of copies. Let’s go get some breakfast and then deliver these
    letters.”


    Winsome lifted a huge mail bag and headed down the pier. Laurie had to hurry to
    keep up.


    There were many restaurants around the harbor. The Philosopher’s Diner was packed
    with old people wearing togas, and at Random Slice Pizza you never knew what toppings
    you’d get. It was too early for pizza, though.


    They took a booth at the Push & Pop Café and ordered full stacks of pancakes.
    Instead of cutting through the whole pile of pancakes, Winsome ate them off the
    top of the stack, one by one.


    Mystified, Laurie watched Winsome until she could no longer contain her curiosity.
    “Why are you eating your pancakes funny?”


    “I’m not eating them funny. *You’re* eating them funny.”


    Laurie didn’t push the question, but instead tried another. “What should I do
    about my map?” she asked between bites.


    “Beats me, girl.” Winsome said. “So let’s play a game that will help us figure
    it out.”


    “What game?”


    “It’s called Five Whys. It’s a game to play when you get stuck.”


    “How do you play?”


    “I ask you a Why question, and you answer, and then I ask you another, until we
    find the reason you got stuck,” Winsome said.


    “For example?”


    “For example,” Winsome began, pausing to swallow her last bite of pancake, “why
    do you want to follow that map?”


    “It’s the one Hugh Rustic made for me with his ants,” Laurie said. “He found a
    short-enough path through all of the towns.”


    “So why did you want to find a short-enough path?”


    “Because there are blippity-million paths through Userland, and Tinker didn’t
    know how to find the *shortest* one,” Laurie said.


    “Why did you ask Tinker for the shortest path?”


    “Because Eponymous said that the Wandering Salesman’s algorithm—well, she didn’t
    say ‘algorithm,’ I figured that out later—she said his algorithm wasn’t sensible.”


    “Why did you want to use the Salesman’s algorithm?”


    “Because that’s how *he* finds his way home.”


    “Why did you think his algorithm made sense for you?”


    “Because I . . .” Laurie hadn’t thought about it. “I don’t know.”


    “You were lost and scared, and he seemed to know what he was doing, right?” Winsome
    asked.


    “Yeah, I guess so.”


    “Sweetie, the Wandering Salesman is a *salesman*. He has to visit many places
    to buy and sell,” Winsome said. “And it’s his job to convince people.”


    “Eponymous said that it made sense, though.”


    “The Salesman’s algorithm makes sense for *him*, but maybe not for you. It’s tempting
    to jump on the first answer that comes along. But a lot of the time, it’s not
    the best. That’s why you have to keep your head on.”


    “Why didn’t anybody say anything?” Laurie asked.


    “Because it’s up to you to ask the right questions,” Winsome replied. “No one
    is going to live your life for you, girl.”


    “But I *asked* everyone how to get home!”'
