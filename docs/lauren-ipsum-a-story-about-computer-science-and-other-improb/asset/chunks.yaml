    “She says Steganosauruses don’t exist because she’s never seen one. But that proves
    my point! Steganosauruses are so good at hiding that people think they’re imaginary.”


    “That doesn’t make any sense, Xor.”


    “Who are you going to believe, me or your own eyes?” *Squawk!*

