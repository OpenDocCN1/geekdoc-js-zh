    “Now, um, let’s read it through slowly and look for clues. Con-sec-te-tour a-dee-peace-ick-ing
    el . . .” Xor’s skin rippled as he moved across the letters. “. . . dew-is ow-tay
    . . .”


    “Hey, Xor, wait a second.” Laurie had noticed something odd. “Back up just a little.”


    “Like this?”


    “Yeah. Now, think really hard about blending in.”


    “Okay. What do you see?” he said.


    “Your skin. I think I can read it.”


    When Xor was lined up just right, `LOREM IPSUM ESXIHU` in black on white became
    `LAUREN IPSUM GREETINGS` in white on black.


    “You are unhiding the message!”


    “Really? I mean, see? I told you I could do it.”


    “You are wonderful, Xor! Can you get closer to the paper?”


    “If I were any closer, I’d be behind it!”


    Word by word, they unscrambled the message. But even then it didn’t make much
    sense:


    > LAUREN IPSUM, GREETINGS! WITHOUT A DOUBT, YOU ARE THE MOST INTERESTING VISITOR
    TO USERLAND IN A LONG TIME. BUT YOU HAVE MANY LABORS AND SETBACKS AHEAD IF YOU
    KEEP DOING WHAT YOU ARE DOING. REMEMBER, THE MAP IS NOT THE TERRITORY!


    > YOUR HUMBLE SERVANT,


    > COLONEL TRAPP


    “Labors and setbacks? The map is not the territory? What does that even mean?”
    Laurie asked.


    “I once heard of a king who wanted to make a perfect map of his territory,” said
    Xor.


    “Why did he want to do that?”


    “Kings always want something silly, like a book about everything or a chariot
    with no weak parts,” he said. “This king decided that he wanted a perfect map
    as large as his kingdom. That way, the royal cartographers could fit everything
    in, down to the last pebble and flower. It took seven whole years to finish it.
    But it was a disaster!”


    “Why? What happened?” Laurie asked.


    “As a map, it didn’t work very well. To measure the distance between two places,
    you had to travel exactly that distance,” the lizard explained. “By that time
    you were already there.”


    “Where did they even put such a big map?”


    “That was the other thing. King Borges had only one kingdom, so there was nowhere
    to put the map except right where it was. It was a huge bother, what with the
    map sitting on top of people’s houses, and none of the crops could grow. The people
    finally overthrew the king and tore up the map. They say you can still see huge
    pieces of paper blowing around in the desert.”


    # Chapter 8. More Than One Way to Do It


    ![image with no caption](figs/web/061fig01.png.jpg)


    Permute was a small village not far from Symbol. Hugh Rustic’s shop was easy to
    find. Its sign was even bigger and fancier than Tinker’s.


    ![image with no caption](figs/web/061fig02.png.jpg)


    “Hello, Mister Rustic?” Laurie called as she stepped inside the shop. “Mister
    Tinker back in Symbol owes me an algorithm, and he said I should talk to you about
    it.”


    Rustic was a tall, loud, messy-looking man with a big red beard. He didn’t look
    anything like the elegant Eponymous or the neat and proper Tinker.


    ![image with no caption](figs/web/062fig01.png.jpg)


    He certainly didn’t look how Laurie thought a Composer should look! But Tinker
    had recommended him, so Laurie handed him the IOU.


    “I’m, um, trying to find the shortest path through all the towns. Can you help
    me?”


    “Wonderful! Interesting!” Rustic said. “Tinker sent you to the right place, miss.
    Improbable we can do right away. Impossible, by Tuesday at the latest.”


    “But if it’s impossible—” Laurie began.


    “Only improbable,” corrected Rustic.


    “If it’s improbable, how do you do it?”


    “By shifting your point of view,” said Rustic. “Instead of looking for an answer
    that fits your problem, you imagine an answer and look for a problem to fit it.”


    “But you can’t just change the problem, can you?”


    “Why, of course you can! Worrying about the problem is a waste of time! What you
    really want is an answer, right?”


    “Maybe, but I don’t understand how,” Laurie said.


    “How do you buy the best tomato?” he said.


    “Well, I . . . what?”


    “Let’s say you’re at the market. You want the best, most perfect tomato. But to
    find the best tomato, you’d have to compare them all, right? You’d look at each
    and every one, turn it around, maybe squeeze it a bit. For every tomato in the
    whole market.”


    “No one does that!” said Laurie. “Well, old Mrs. Harris does do that. But my mom
    says she’s a little batty. I just pick a good one.”


    “See? You already know how to do things the Hugh Rustic way. You don’t waste your
    time looking for the best tomato when there are plenty that are Good Enough.”


    “So instead of trying to find the shortest path through all the towns in Userland,”
    Laurie said, “we look for one that’s short enough?”


    “Why not?” asked Rustic. “Out of all the zippity-million paths, I bet there are
    a whole lot that are pretty short. You need to find only one of them, and that’s
    much easier.”


    Rustic pulled out a large map and placed it on the counter.


    “Here is where we are,” he said, pointing to Permute, “and this is where you started,
    am I right? Let’s put some pencils here to stand in Mount Upper Bound, and a little
    spoon there for Lower Bound Valley.” The map also had markers for Bach and Recursion
    Junction, as well as many other places Laurie hadn’t been to yet.


    “Now for the fun part,” said Rustic. “Let’s ask the ants.”


    “Ask the ants? What are you talking about? Ants can’t read maps!” Laurie said.
    At the mention of insects, Xor was suddenly alert.


    “Who says they can’t? Next you’ll try to tell me that turtles can’t draw circles,”
    Rustic said.


    “So you teach the ants to read maps?”


    “Not exactly. Ants are good at finding their way home already. The idea is to
    get them to work for us.” He opened a jar of honey and put a tiny daub of the
    sweet stuff on each town.


    A minute passed. Nothing happened. Then a little ant crawled onto the table. It
    smelled the honey and zig-zagged its way onto the map. It nibbled from one bit
    of honey, then wandered around until it walked into another one.


    ![image with no caption](figs/web/065fig01.png.jpg)


    “When an ant finds food, she leaves a little scent message for the others that
    come after her,” Rustic said. “Ants follow the scent of food and also the scent
    of other ants. Lots of ants can try lots of different paths at the same time.
    Eventually they’ll settle on a quick route to all of the food and back to their
    nest.”


    The first ant continued on to Bach. Another appeared and went directly to Recursion
    Junction instead. Still others went all the way across to Probability Bay, Permute,
    Notation, and other towns. Soon the map had dozens of ants going every which way,
    collecting bits of honey and leaving scents for their sisters.


    After a few minutes it was clear that some paths were more popular than others.
    The lines of ants got wider and wider, until there was just one ant superhighway
    that marched all around the map and back to the nest. Hugh Rustic copied it to
    a piece of paper before the honey disappeared.


    “Ah, there you go!” he said, handing Laurie his sketch.


    “Thank you, Mister Rustic! Is this really the shortest way?”


    “It’s a short way. That’s as much as I can promise.”


    # Chapter 9. Don’t Repeat Yourself


    ![image with no caption](figs/web/067fig01.png.jpg)


    Laurie and Xor set out from Permute with their new map. They finally knew where
    they were, where they were going, and how to get there. It was all right there
    on paper.


    “The places on this map have funny names,” said Laurie. “Truncate. What’s that?”


    “To `Truncate` is to make something shorter by cutting off part of it. The town
    of Truncate has very precise borders,” Xor said.


    “Oh. So what’s Axiom?” Laurie asked.


    “An Axiom is a rule that you pretend is true even if you don’t know why it’s true,”
    said Xor.


    “Really?”


    “Surely. My cousin Nand taught me all about it. She’s a Euclidosaurus.”


    “You’re making stuff up again, Xor.”


    “No, it’s just one of those things,” the lizard shrugged, turning gray-green.
    “Either you believe in Axioms or you don’t.”


    “Oh yeah? I bet you don’t know what a Furfnoodle is,” Laurie said.


    “It’s a . . . I mean, um. I give up. What is it?”

