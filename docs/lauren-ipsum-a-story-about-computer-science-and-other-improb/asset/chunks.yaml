    “不。我们需要的 . . . 我们需要的 . . . 是计划的彻底改变！”布鲁托并没有针对特定的某人说，“好了，大家。清理甲板！清空你们的大脑！脑力风暴！我要看到新主意！”


    “让我们把墙加四倍厚，但塔只高三倍，”一个工人说。


    “内外都要更多的支撑！”另一人喊道。


    “用更大的砖块！”


    “用钢做砖块！”


    “钢太太贵了。铁怎么样？”


    “你疯了吗？铁会生锈的！”


    “我告诉过我们应该用三角形的。”


    “外面用钢板，里面用砖块。”


    “好！这个好！继续提。我们正在跳出框架思考。还有人吗？”布鲁托问道。


    “为什么不能用圆形的呢，就像抽象岛上的灯塔那样？”洛莉建议道。她思考了一分钟，然后写下了两首小诗。


    > **砖之圆：**

    >

    > **铺一块砖，**

    >

    > **向右转一度，**

    >

    > **向前走，**

    >

    > **重复三百六十次。**

    >

    > **塔之圆（多高？）：**

    >

    > **做一个“砖之圆”，**

    >

    > **重复“多高？”次。**


    “看到了吗？你用砖块砌一个圆，然后在上面再放一个圆，一直到顶端！”洛莉解释道。


    “哈哈哈，真可爱的主意，姑娘！但这绝对行不行，”布鲁托回答道。


    “为什么不行？”洛莉问。


    “它太小了！”布鲁托说，“你凭什么指望用这样一个微小的计划造出一座宏伟的大塔？”


    “我不知道，”洛莉说。这在她看来是合理的，但也许他们知道一些我不知道的。毕竟，他们是专业人士。“我 . . . 我觉得它会行。”


    “哼，”布鲁托哼哼了一声，“即使它足够大，它也有一个致命缺陷。”


    “什么缺陷？”


    “我们的第一个计划是一个空心正方形，它塌了，”布鲁托说，“第二个计划是同样两倍大的空心正方形，它也塌了。而你的计划是一个空心圆。”


    “我不明白。圆不应该更坚固吗？”


    “显然，问题不在于形状或大小——问题在于它们内部是空的！”布鲁托说，“我们需要把内部也填满砖块。这才是逻辑。”


    “你说得对，布鲁托！”一个工人说。


    “这就是为什么你是老板，”另一人说。


    “但我见过空心塔，”洛莉说，“它们以前造过过。”


    “你怎么知道它们最终不会倒塌？证据非常明显，”布鲁托说。


    “是的，非常清楚，”其他工人同意道，互相点头。


    “但我——”


    “不，我已经下定主意了，”布鲁托说。塔必须是实心的。事实上，”他看着那堆材料，“我们要造一座金字塔。”


    “金字塔？！”


    “金字塔不会倒塌。它已经屹立了，”布鲁托解释道，“它是完美的几何体之一！”


    “没错，”工人同意道。


    “天才！”


    “这只是工作量和材料的问题。”


    “好！我们计划好了，”布鲁托说，“大家，开始工作吧！向温萨姆致歉意，姑娘，告诉她我们需要更多时间来把它做好。”


    有人是不可理喻的。当洛莉和索尔前往 `Doppelganger` 时，布鲁托和他的团队正忙于为他的 `PYRAMID` 编写说明书，一块砖一块砖地写。


    # 第 17 章 追逐优雅


    ![image with no caption](img/121fig01.png.jpg)


    “好了，”温萨姆在清单上勾掉了福埃尔萨（Fuerza）的包裹。


    “下一个是优雅岛。现在那个特殊包裹在哪儿？”


    “哇，那些是什么动物？”洛莉问。。沿岸边，长着灰色长象鼻子的小灰色动物正互相玩耍，并在阳光下打午睡。


    “那些是优雅族（Elegants）。岛上到处都是它们，”温萨姆回答道。


    “它们好小好优雅！就像在跳舞一样。”


    “是啊。包裹，包裹……”温萨姆自言自语道。


    “你们那那里没有优雅族吗？”


    “没有。我们有大象，但它们都又大又笨。优雅族友好吗？”


    “只要有需要就有多友好，”温萨姆说，“找到了！好，这个包裹是给弗雷内尔·古德拉斯（Fresnel Goodglass）的。”


    “地址只写了在红色气球下方，”洛莉说，“我想那是他在那儿。”她指了指漂浮在树上方的红色圆球。


    ![image with no caption](img/122fig01.png.jpg)


    但在离开之前，洛莉想和优雅族玩玩。她小心翼翼地靠近它们，发出轻柔的“咕咕，咕”声。


    “你现在变成鸟了吗？”索尔嘲讽道。


    “嘘。我只是试着引起它们的注意。”


    优雅族似乎并不特别害怕或好奇。事实上，它们表现得好像洛莉不在一样。但它们的舞步似乎总是避开她的路。当她沿着岸边走时，这些小生物就向内陆移动。当她进入内陆时，它们决定树下才是该待的地方。很快，洛莉只能看到几个优雅族，在她的触及不到的地方玩耍。噢，好吧，她想。


    ***


    在气球的指引下，洛莉和索尔很容易就找到了那座山。但当他们到达时，那里没什么。一个巨大的船锚半埋在土里。一根绳子向上、向上、向上接到地面高方的篮子上，篮子本身连接在气球上。几个年轻的优雅族在树下玩躲迷猫。那里完全没有建筑或人。


    “我们在对的地方吗？”洛莉大声自问，“灯塔在哪？”


    “嘿，洛莉，看这个。”索尔抓着一个写着“请按铃服务”的牌子。下面挂着一个小铃。他们互相看了看，耸了耸肩。索尔用尾巴用力撞了一下。


    ![image with no caption](img/123fig01.png.jpg)


    铃声响了，声音比这么小东西本该发出的要大得多。


    ![image with no caption](img/123fig02.png.jpg)


    索尔就在旁边。那只蜥蜴变成了亮靛蓝色，倒在了地上。


    ![image with no caption](img/123fig03.png.jpg)


    洛莉不得不捂住耳朵，直到声音消失。


    ![image with no caption](img/123fig04.png.jpg)


    当一切结束后，那些年轻的优雅族无影无踪了。洛莉把索尔抱在手里。他的皮肤是白的，眼睛向不同的方向转动。


    “索尔！你还好吗？”


    “我觉得还好。那一下快把魂都吓散了！”


    上方传来的一声嘶嘶让洛莉抬头。一个电梯箱正从他们面前下降到地面。当门礼貌地 `叮` 一声打开时，他们缩了缩。


    洛莉拿起包裹，最后环顾四周，走进了里面。门关上了，电梯上升得很快，让她脚趾都缩在一起，胃里翻江倒海。


    当门再次打开时，他们已经在百码高空，在篮子里。那里像一个小公寓。有一张桌子、一张床和一些舒服的椅子。一个满脸皱纹、留着灰色胡须、耳朵尖尖的老人对着她微笑。


    “这里是……你是弗雷内尔·古德拉斯吗？我是洛莉。我有一个包裹要给你。”


    “是的，是！是的，我是！是的，你是！谢谢你！”那人接过包裹，“欢迎来到我的漂浮灯塔。你觉得怎么样？”


    “这不是灯塔，”洛莉说，在下电梯之前用脚测试了编织的地板，“这是一个气球！”


    “当然，它是灯塔。气球形式的灯塔。看到上面那个大灯光了吗？”弗雷内尔问。他们上方确实挂着一个巨大的灯塔光。


    “但长长的扭曲的楼梯在哪？”洛莉问。


    “取而的是电的是。对我这老骨头方便。”


    “灯塔员的房间呢？”


    “你可以直接从篮子侧面看。”


    “那塔呢？”


    “不需要！没必要！”弗雷内尔说，“灯塔本质上是光，而不是房子。”


    洛莉并不信服。“你不能只是在气球上插一盏灯就称它为灯塔。”


    “我不能吗？”


    “不！”


    “为什么不行？”


    “因为 . . . 这是作弊，”她说。


    “嗯。我明白你的意思，”弗雷内尔同意道，“但只要它好用，名字并不重要。”


    “是的，很重要！”


