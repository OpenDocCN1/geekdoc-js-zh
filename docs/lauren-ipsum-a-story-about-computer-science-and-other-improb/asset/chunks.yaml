    Laurie 在优雅岛遇到的菲涅涅尔是以一位真实的科学家奥古斯丁-让·菲涅尔尔（Augustin-Jean Fresnel）命名的，这位科学家发明了一种仅需一少量玻璃就能聚焦大型灯塔光线的方法。他知道要聚焦光束，透镜不需要做得又大厚，因此，`Fresnel
    lens`并不是一大块巨大的玻璃，而是由不同角度的小玻璃碎片排列成的。今天，灯塔仍然在使用这种透镜。


    ## 分解


    `Decomposing` 从一个大想法开始，将其分解成更小、更易理解的部分。当你知道如何解决每个较小的部分时，就可以将这些想法组合起来解决更大的问题。拆解一个想法的好方法之一是不使用它的名称来描述它，就像
    Laurie 所说的那样，你也可以把龟称为“带壳的绿色圆形动物”。


    即使是简单的想法，比如数字 `3` 和 `4`，也可以分解成更简单的想法。从 `0` 开始，然后加 `1`。再次加 `1`，以此此类推：


    > 0 = 0


    > 1 = 0 + 1


    > 2 = 0 + 1 + 1


    > 3 = 0 + 1 + 1 + 1


    如果你真的想做，你可以只使用 `0` 和 `1` 并抛弃所有其他数字。我不建议这样做——你会用掉很多纸的！但这是一种完全有效的数学方法。例如，让我们把一个加法题分解为纯的
    `0` 和 `1`：


    2 + 2 = 4


    将变为


    (0 + 1 + 1) + (0 + 1 + 1) = (0 + 1 + 1 + 1 + 1)


    ## 关联


    当你 `relate` 两个想法时，你将它们并排放在一起比较，就像菲涅尔尔的气球和灯塔。对于数字，你使用小于号（`<`）来表示左侧的数字比右侧的小。你使用等号（=`）表示左侧的值等于右侧的值。


    > 2 < 3


    > 2 × 3 = 6


    不过你也可以关联数字以外的事物，尽管这意味着某些关系并不那么精确。菲涅尔尔的气球并不完全是灯塔，但它像灯塔。我们期望灯塔有一种让人们爬得很高的方法，到达后有一个站立的地方，以及一个远处船只能看到的大光。菲涅尔尔的气球在技术上具备所有这些特征：


    *   菲涅尔尔的气球像灯塔。

    *   (电梯, 气球, 光) 像 (楼梯, 塔, 光)。


    # 第 18 章：众人拾山


    ## 网络


    Winsome 创建了灯塔网络（Lighthouse Network），让 Userland 的人们能够更快速地发送消息。在计算机科学中，`network`
    是一组相互连接的计算机，以便它们共享信息。这些计算机可以通过电线甚至通过空气连接！


    ## 鲍多特


    1870 年，埃米尔·鲍多特（Émile Baudot）发明了一种代码，用不同的 1 和 0 组合来表示字母。这种代码旨在让人们利用电力共享消息：如果你有一个开关，电源就可以开启
    (1) 或关闭 (0)。自然地，鲍多特用自己的名字命名了这种代码。参见 `Bach’s Laws of Eponymy`（第 2 章; Bach’s First
    Law of Eponymy）。


    我们在现实世界中并不经常使用鲍多特代码，但 Ping、菲涅尔尔以及 Winsome 灯塔网络的其他成员使用它通过他们的灯光发送消息，这些灯光也可以开启 (FLASH)
    或关闭 (FLOOSH)。


    这里是鲍多特代码以及每个数字代表的字母，你可以此建立自己的灯塔网络。找几个朋友和一些手电筒，互相发送消息吧！


    | 字母 | 鲍多特代码 | 字母 | 鲍多特代码 |

    | --- | --- | --- | --- |

    | A | 11000 | N | 00110 |

    | B | 10011 | O | 00011 |

    | C | 01110 | P | 01101 |

    | D | 10010 | Q | 11101 |

    | E | 10000 | R | 01010 |

    | F | 10110 | S | 10100 |

    | G | 01011 | T | 00001 |

    | H | 00101 | U | 11100 |

    | I | 01100 | V | 01111 |

    | J | 11010 | W | 11001 |

    | K | 11110 | X | 10111 |

    | L | 01001 | Y | 10101 |

    | M | 00111 | Z | 10001 |


    # 第 19 章：分分支


    ## 分叉路花园


    花园里有 16,777,216 条路径，但最后，Laurie 和 Xor 每人恰好找到了一条对他们来说有意义的路径。可能路径的数量之所以迅速减少，是因为在每个分叉路口，Laurie
    都回答了一个二选一的问题，这让可能路径的数量减了一半。


    ![image with no caption](img/181fig01.png.jpg)


    Laurie 在分叉路花园的之旅非常像计算机科学家所说的 `binary search`（二分查找），程序员用它来在巨大的列表中快速查找单个信息。当某物是二进的时，它只有两个部分——就像花园问
    Laurie 的的问题一样。


    这个小图有四种可能的结果。如果你回答问题“A 还是 B？”为 A，你就将数量减半，只剩下两种可能性。然后在 A 处，你必须回答“C 还是 D？”无论你选择哪个选项，你再次让数量减半，直到剩一个选择。


    ![image with no caption](img/182fig01.png.jpg)


    在二分查找中，你会对你巨大的信息列表问类似的问题；最终，你会将可能性减少到只剩一个。下次玩“二十个问题”（Twenty Questions）时试试看！如果你仔细地选择问题（或答案），你只需要
    20 或 30 步就能到达几乎任何结果。参见 `Recursion`（递归）（第 4 章; 第 4: What the Tortoise Said to Laurie）。


    # 第 21 章：还有还有


    ## 电报


    凯文·凯尔文船长（Captain Kevin Kelvin）正在沿海洋铺设线路以建立 `telegraph` 网络。电报系统让人们可以在远距离互相发送消息，而无需实际发送物理物体。Winsome
    的灯塔网络也是电报的一种！


    在 Kevin 的情况下，字母是由声音集合表示的，而不是灯光。不同的哔声和嘟嘟组合代表不同的字母，而这些哔声和嘟嘟是 Kevin 的助手按下连接在电线另一端的按钮时产生的。电报只是人类历史上用来相互交流的许多系统之一。


    ## 开尔文标


    凯尔文勋爵（Lord Kelvin）是一位从事电报工作的真实工程师，但他因创立开尔文标来测量温度而广闻。。与其他温度标不同，开尔文标不使用小于零的数字，因此最低温度被称为
    `absolute 零`。水在 273.16 结冰！


