    Euripides almost couldn’t believe what he was seeing. The readers and writers
    were following a simple rule and taking turns! He was glad to have a rest, and
    he signed Laurie’s Pass without a second thought.


    ***


    “General Darius?”


    “You again. I don’t want to hear about anything else until we’ve sorted out the
    Broccoli Situation.”


    “I think the mandelbroccoli doesn’t matter, sir,” said Laurie.


    “What? You want the goat to eat it all?”


    “No, I mean the answer is the same even if you had two wolves instead. You can’t
    leave the goat alone with anything. If you change your point of view, it’s easy.
    I think.”


    “Go on,” said the General.


    Laurie thought a little more, then wrote down her idea. It looked a bit like the
    algorithms back at Tinker’s:


    1. **Take the goat over to the other side.**

    2. **Come back empty.**

    3. **Take the wolf over, but then bring back the goat.**

    4. **Leave the goat and take the mandelbroccoli over.**

    5. **Come back empty.**

    6. **And finally, take the goat over again!**


    Darius studied Laurie’s idea for a while, his hands moving this way and that as
    he thought it through.


    “I believe this will work. The goat won’t like going back and forth so much, but
    it’s better than getting eaten,” said Darius. “Now what is it you wanted, miss?”


    ***


    At last, Laurie arrived back at the Office of Perimeter Security. “General Case,
    sir? General Darius signed my Pass.”


    “Hmm,” Case hmmed, scribbling a signature below Darius’s.


    “Thank you, sir.”


    “Hmm.”


    “Sir? One more thing,” Laurie said.


    “Hmm?”


    “I don’t think anyone is stealing your fenceposts. It’s just that you need `eleven`
    posts. Like this.”


    ![image with no caption](figs/web/111fig01.png)


    “Hmm!”


    ***


    “Welcome back, miss,” said Anton. Laurie handed over the paperwork she’d collected
    from the Byzantine Generals.


    “It looks like everything is in order,” said Basil, examining the list of signatures.
    “These approvals go all the way to the top!”


    “Have you anything to declare, miss?” asked Anton.


    “Declare?”


    “What Lieutenant Anton means is,” said Basil, “is there anything we should know
    about?”


    “Oh. Well, I think Anton is right. Zero is even.”


    “No!” said Basil.


    “Yes. Zero can’t be odd because one is odd, and you can’t have two odd numbers
    in a row, right?”


    “Right!” said Anton.


    “I suppose not,” Basil grumped. “But that doesn’t prove it’s even.”


    “Well, if you add an odd number and an even number together, you always get an
    odd number,” said Laurie.


    “Um,” Basil ummed, thinking about it. “One plus two is three, two plus three is
    five . . . yes.”


    “So I can prove whether zero is even or odd. Add it to an odd number and see what
    you get. Zero plus one is one, and one is odd. So zero must be even,” said Laurie.


    “I’m still not convinced,” said Basil.


    “Okay,” Laurie said. “If you add two `even` numbers together, you always get an
    even number, right? Zero plus two is two, which is even. Zero is even again!”


    “Exactly!” Anton said.


    “Hrmph,” Basil hrmphed. “So zero is even. How do I keep Anton from being Senior
    two days in a row?”


    “That’s the easy part,” Laurie said. “The problem is that yesterday, the Thirtieth,
    and today, the Zeroth, are both even. Anton was the Senior yesterday. So Basil,
    you can be the Senior Officer of the Watch today.”


    “Now hang on a minute—” said Anton.


    “—but only until lunchtime,” said Laurie. “After lunch today, Anton is Senior.
    That way it’s fair.”


    “Brilliant!” said Senior Officer Basil. “Junior Officer Anton, sign this young
    lady’s Pass!”


    Approved, approved, approved, signed, and countersigned. Laurie was finally through
    the turnstile.


    “I’m glad that’s over,” said Xor. “Now, where the heck is that Byzantine Process?”


    # Chapter 16. A Change of Plan


    ![image with no caption](figs/web/113fig01.png.jpg)


    *SECOND*, the package’s directions read, *DELIVER TO BRUTO FUERZA, LOOKOUT HILL
    LIGHTHOUSE*. Laurie and Xor couldn’t see any lighthouse, but there was a cloud
    of dust rising from the hill.


    “You work for Winsome, eh? Right on time,” said Bruto when they arrived. “I’m
    sorry to say we’re behind schedule. Our lighthouse isn’t finished. We’ve been
    working double-time, day and night.”


    “Are you going to put the lighthouse on top of that castle?” Laurie asked.


    “Castle?” asked Bruto. “That *is* the lighthouse.”


    Dozens of Green-Shelled Round machines were busy all around the enormous structure.
    They looked just like Tinker’s turtle, but they were the size of a large truck.
    Instead of drawing dots on paper, these turtles were laying bricks on top of bricks,
    making `WALLs`, `STAIRs`, and `WINDOWs` right before Laurie’s eyes.


    “What are all those things coming out from the wall?” she asked, pointing to a
    forest of supports and buttresses on one side of the tower.


    “We’ve had no end of problems,” said Bruto, shaking his head and spitting. “The
    south wall was falling outward. So we had to shore it up. Then it started falling
    `inward`.”


    “Is that why you’re behind schedule?” she asked. There was something about the
    scene that bothered Laurie, but she couldn’t put her finger on it. It looked .
    . . messy.


    “Things are always going wrong,” Bruto said. “Big ideas come with big risks. But
    we can fix any problem with more power and hard work!”


    “You certainly have a lot of both,” Laurie said, with just a teensy tiny bit of
    envy. The things she could do with all those turtles! “How do you teach the turtles
    to build a tower?”


    “Here, let me show you.” Bruto led her to a tent nearby. A small army of people
    was working around a table. “First we write the plans on paper.”


    > **BRICK-LINE:**

    >

    > Lay a brick,

    >

    > move forward,

    >

    > lay a brick,

    >

    > move forward,

    >

    > lay a brick,

    >

    > move forward,

    >

    > . . .


    “That part makes a `LINE` of bricks. We stack a bunch of `BRICK-LINES` on top
    of each other, and that’s how a wall gets built. To make the wall thicker, we
    just add more commands.”


    > **BRICK-LINE-VERSION-TWO:**

    >

    > Lay a brick,

    >

    > lay a brick,

    >

    > move forward,

    >

    > lay a brick,

    >

    > lay a brick,

    >

    > move forward,

    >

    > lay a brick,

    >

    > lay a brick,

    >

    > move forward,

    >

    > lay a brick,

    >

    > lay a brick,

    >

    > . . .


    “Wow, it just goes on and on and on,” said Laurie, flipping through the pages.
    “It must have taken forever to write all of this.”

