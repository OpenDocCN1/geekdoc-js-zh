    当你说“A 或 B”时，意味着你想要这两者之一，或者可能两个都想要！如果你说“A 异或 B（xor）”，那么就意味着你想要这两者中的*有且仅有一个*，而不是两个都要。这就是为什么
    Xor 一直变换着彩虹色：Xor 和他目前坐的地方不能同时是蓝色的。如果他坐在一个蓝色的牌子上，他就必须变成任何*不是*蓝色的颜色！这可不是一种很好的伪装形式，对吧？


    ## 隐写恐龙


    *隐写术*是将信息隐藏在其他信息之中的技艺术，它既应用于数字世界，也应用于物理世界。例如，你可能会通过在纸上用隐形水写秘密信息来隐藏它。通过计算机程序，你甚至可以将文字隐藏在声音和图片中。因此，“隐写恐龙”是一种可以在任何地方隐藏自己的恐龙。


    # 第 2 章：理智与理性


    ## 构图


    同名的巴赫（Eponymous Bach）是一位作曲家，但她处理的是思想而不是音乐。*构图（Composing）*是将小的思想组合成更大的思想，以逐步解决问题。几乎每一个思想都是由更小的思想组成的。例如，整数相法并没有什么特别。你可以将其看作是将一个数字不断加自己并重复：


    > 2 × 3 = 6

    > 2 + 2 + 2 = 6 (相加三次 2)


    另见*解构（Decomposing）*（第 17 章；第 17 章：追求优雅）和*关联（Relating）*（第 17 章；关联）。构图、解构和关联是植根于所有数学、逻辑和计算机科学根源的问题解决方法。


    ## 巴赫的命名第一法则


    不要让任何新思想在没有命名的情况下溜走。名字就像一个手手，让这个思想变得更容易使用。


    ## 巴赫的命名第二法则


    给“思想”起名字比给“事物”起名字更好，因为思想更长久。


    ## 巴赫的命名第三法则


    随着一个思想变得越来越有用和有名，它的名字会变得越来越短并全小写。这条法则最终影响了巴赫的朋友安迪·安培（Andy Ampère）以及他对电的发现。


    ![image with no caption](img/158fig01.png.jpg)


    ## 安培


    安德烈·马里·安培（André-Marie Ampère）发现当电流通过平行导线时，导线会相互吸引或排斥，导致导线弯曲。通过测量它们弯曲的程度，你可以测量电流的大小。安培利用这个想法为我们所知的关于电的一切几乎奠定了基础，为了纪念他，我们用*安培*（或简称培）来衡量电流。（参见*巴赫的命名第三法则*了解巴赫关于为什么我们几乎不将单位称为*安培*的理论。）


    ## 理性 vs 理智


    程序员和数学家有时使用一对概念——*解空间（solution space）*和*问题空间（problem space）*来描述寻找问题答案的过程。


    假设你需要移动一个沉重的箱子以便拆箱；任何与移动箱子相关的活动都在你的问题空间内。尝试想象你为了移动那个箱子可能做的每一件事。你可以向前走、向后走、伸出舌头、唱一首歌、写一个方程、使用杠杆、寻求帮助、寻找叉车，或者做任何你能想到的任何其他事情。在一张纸上写下尽可能多的这些可能性。


    在那个巨大的可能性空间中，只想象那些有很大几率移动箱子的项。用红笔圈出那些。被圈出的在解空间内。它们*符合逻辑（make sense）*，因为它们能实现你的目标，而其他的则不符合逻辑。现在，再次观察所有被圈出的可能性，思考哪一个是最好的（最快、最便宜、最简单、最可靠等）。用绿笔画下那一个。这就是所有符合逻辑的答案中最*理智（sensible）*的答案。


    这个练习的意义在于避免一种非常人性且非常常见的错误：我们倾向于抓住第一个想到的解决方案，而忘记考虑其他可能性。这就是巴赫告诉洛里（Laurie）游走推销员的解决方案并不理智时的意思。另见*休·鲁斯蒂（Hugh
    Rustic）*（第 8 章；第 8 章：解决问题的多种方法）和*五问法（Five Whys）*（第 14 章；第 14 章：抽象）。


    # 第 3 章：舍入误差


    ## 轮询算法


    罗宾家族（The Robins）并不邪恶——他们只是饿了。他们所做的一切都互相合作，轮流并确保工作在他们之间平衡。共享工作是更快完成任务的好方法，计算机也可以共享工作！


    你可以在几乎任何地方找到轮询法。想象一条需要一小时完成的公交路线。如果你在那条路线上放两辆公交车，每辆车将每 30 分钟到达一站。如果有三辆车，你每 20
    分钟就能看到一辆车，四辆意味着你每 15 分钟看到一辆。如果有五辆，你每 12 分钟看到一辆，以此此类推。只需将 60（一小时的分钟数）除以公交车的数量，即可看到车应该多久来一次。


    但你必须小心确保公交车到达每个站点的时间是均匀的。五辆车同时到达一个站点是不平衡的。此外，如果有一辆车故障导致延迟，这可能会导致所有其他车都拥堵！


    ![image with no caption](img/160fig01.png.jpg)


    # 第 4 章：龟对洛里说


    ## 递归


    *递归（Recursion）*是一种反复相同过程的方法，直到你找到寻找的答案。当你使用递归时，你运行该过程，如果答案是你想要的，就停止。如果不是，你就把找到的答案带入相同的过程中并再次运行。


    让我们来看这里用户领域（Userland）的一个递归应用示例。回想第 10 章简·赫凯特（Jane Hecate）有一本巨大的名字书。名字*Lauren*以*L*开头，所以简应该在书的*L*部分找到它，但由于页面非常多，这可能花费很长时间。如果简想用更快的方法寻找*Lauren*，她可以将书分成两个相等的部分，看看*L*是在前半部分还是后半部分


    > 前半部分：{A, B, C, D, E, F, G, H, I, J, K, L, M}

    >

    > 后半部分：{N, O, P, Q, R, S, T, U, V, W, X, Y, Z}


    由于*L*在前半部分，简可以将书的前半部分对半，得到两个四分之一的书进行搜索。


    > 第一四分之一：{A, B, C, D, E, F, G}

    >

    > 第二四分之一：{H, I, J, K, L, M}


    *Lauren*应该在第二个四分之一中，所以简可以将该四分之一对半，得到字母表的两个八分之一：


    > 第一八分之一：{H, I, J}

    >

    > 第二八分之一：{K, L, M}


    ![image with no caption](img/161fig01.png.jpg)


    简可以继续将包含*L*的字母组对半，直到最终只剩下*L*部分。（简还需要将字母组对半多少次才能找到*L*？）这种寻找特定信息的方法被称为*二分查找（binary
    search）*。


    另见*分叉路径园（Garden of Forking Paths）*（第 19 章；第 19 章：分支）和*追逐自己的尾巴（Chasing Your Tail）*（龟与兔）。


    ## 龟与兔


