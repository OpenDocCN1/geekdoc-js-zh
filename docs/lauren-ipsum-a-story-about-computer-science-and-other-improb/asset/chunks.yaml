  raw: '“Please add a sixty-fourth-inch piece of string,” said Tortoise, “then a one-hundred-twenty-eighth-inch
    piece, and a two-hundred-and-fifty-sixth-inch piece, and then a five-hundred-twelfth-inch
    piece, and then—”


    “Slow down, Tortoise! You are going too fast,” Achilles said. “And those are very
    big—no, very *small* numbers.” He figured and scribbled for a minute. “There is
    only a five-hundred-and-twelfth inch remaining. It’s too bad we’re not splitting
    *hairs*, or you could have gotten a little farther! Do you give up now?”


    “*Oh.* I see!” exclaimed Laurie. “Achilles, Tortoise is right.”


    “What? Don’t change your mind *now* when we are so close to victory!” Achilles
    cried.


    “No, I’m sure Tortoise is right,” said Laurie. “Don’t you see? Every piece he
    adds is *half* as long as the one before. That leaves just enough room left over.
    Even if he adds an infinite number of pieces, the string will *never* reach two
    inches.”


    “Well, hardly ever,” said Tortoise.


    Achilles grimaced. “It appears you’ve proven the impossible again, Tortoise. But
    just to make sure, I will check the arithmetic *myself*.” He continued to scribble
    in his notebook:


    + 1/512 inch


     + 1/1,024 inch


       + 1/2,048 inch


         + 1/4,096 inch


          + 1/8,192 inch


           + 1/16,384 inch


            + 1/32,768 inch


             + 1/65,536 inch


              + 1/131,072 inch


               + 1/262,144 inch . . .


    “*That* should keep him busy. If anyone has the patience to actually count to
    infinity, it’s Achilles. Thank you for your assistance, Miss Ipsum.”


    “You’re welcome, Mister Tortoise,” said Laurie. “I didn’t know something so big
    could be so small.”


    “That’s the Power of Two,” said Tortoise. “If you cut a number into two halves,
    then cut it in two again, and so on, very soon it will be too small to see. But
    there will always be something left over.”


    “Mister Tortoise, do you know how long this road is? It feels like it goes on
    forever. I’m trying to get to Symbol.”


    “This road is quite long,” he replied. “In fact, it is infinite.”


    “Oh, no! How do I get to the end?”


    “You can do it in two simple steps.”


    “How?”


    “How do you think? A step with your right foot, then a step with your left foot,”
    said Tortoise. “Your point of view is what’s important. It’s integral.”


    Of course! If an infinite string could be less than two inches long, then an infinite
    road could certainly be less than two steps, if you looked at it in the right
    way. Laurie closed her eyes and took a deep breath. She tried to imagine an infinite
    road. That was a little too much to handle, so instead she imagined a really,
    really, really, really long road. Then she imagined folding it in half. Then she
    folded it in half again, and again, and again, and again . . .


    When Laurie opened her eyes, Achilles and Tortoise were gone. The infinite road
    was a tiny, short thing now, hardly more than a stepping stone. She stepped forward
    with her right foot. Then she stepped again with her left foot. In front of her
    was a road sign that read . . .


    # Chapter 5. Welcome to Symbol


    ![image with no caption](figs/web/035fig01.png.jpg)


    The town of Symbol was surrounded by high, perfectly smooth walls. A large stream
    split into two and flowed around either side of the town.


    “Do you know anything about this place?” Laurie asked.


    “The people are kind of strange,” said Xor.


    “What does that mean?”


    “You’ll see.”


    The path led to a gateway with a turnstile. It looked like this: ╞


    Two boys about Laurie’s age were guarding the gateway. One wore a bright white
    suit and a black shirt. The other had a bright black suit and a white shirt.


    *Maybe they’ll ask me a riddle*, Laurie thought. *Or I’ll need to figure out which
    one is a liar and which one tells the truth!* Laurie had read a lot of fairy tales,
    you see. She believed she was figuring out how this place worked.


    “Name?” asked one.


    “Laurie Ipsum.”


    “Password?” asked the other.


    “Why, I don’t know the password,” Laurie said.


    “Then you may not enter!” the boys said in unison.


    “That’s not much of a riddle.”


    “A riddle? Ha ha, no, begging your pardon, miss. That’s not how it works. There
    are no riddles, no bets, no liars, and no truth-tellers. We’ve read those books
    too, haven’t we, Tollens?”


    “Yes, we have, Ponens. There’s none of that mythic fairy-tale stuff in our System,
    miss. Word games and clever riddles, ha! That’s just bad security!”


    “But that’s not fair!” cried Laurie. “How do I get inside?”


    “It’s very simple,” said Ponens. “If you have a password, then that means you
    can pass through the semantic turnstile.”


    “If you can’t pass through the turnstile, then that means you don’t have a password.
    It’s only logical,” Tollens said. “Do you have a password?”


    “No, I don’t know what it is,” Laurie said.


    “Then you may not enter!” they said again, together.


    “Can you give me a hint?” Laurie was sure she could guess the password, given
    some kind of clue.


    “Yes, hints are part of the System,” said Ponens.


    “Oh, good.”


    “Did you set up a hint with your account?” asked Tollens.


    “Well, no,” she said. “This is my first time here.”


    “Then it’s hard luck for you, miss,” said Ponens. “Once you are inside, do make
    sure to set up a hint for the next time.”


    “And remember to change your password to something memorable, but hard to guess,”
    said Tollens. “It’s just good security.”


    “But I’m trying to *get* inside! I don’t know what to do!”


    ![image with no caption](figs/web/037fig01.png.jpg)


    “It’s very simple,” said Ponens. “If you have a password, then that means you
    can pass through the semantic turnstile.”


    “And if you can’t pass through the turnstile, then that means you don’t have a
    password. It’s only logical,” Tollens said.


    “That’s not completely true, is it?” Laurie said. “What if the turnstile is broken?
    I wouldn’t be able to enter even if I had a password.”


    “Um . . .” Tollens looked a little unsure of himself.


    “Or what if I fooled you into *believing* I had the password, even if I didn’t?
    Then I could enter without it.”


    “Hmm.” Ponens considered Laurie’s argument, trying to find a flaw.


    Laurie rushed on. “Or what if I had the password, but I didn’t want to give it
    to you?”


    “No, you still couldn’t encroach on our premises,” Ponens said with more confidence.
    “You have to give us a password that matches the name you give us.”


    “Is it ‘Laurie’?” she guessed.


    “No!” they shouted together.


    “Is it ‘November First’?” That was Laurie’s birthday.


    “No!” they shouted again.


    “Only one try left, miss,” said Tollens.


    “Oh, no! Really?”


    “You can try only so many times. It’s just good security.”


    “Do I even have an account?” she wondered.


    “We can’t confirm or deny that,” answered Ponens. “That would be bad security.”


    “Do I . . . *not* have an account?”


    “We can’t deny or confirm that, either!” answered Tollens.


    “It’s very simple—” began Ponens.


    “—yes, yes,” Laurie interrupted. “If I have it, I know it, but if I don’t, you
    can’t tell me. And you can give me a hint only if I set it up earlier!” This certainly
    was very good security. *Think, Laurie, think!*


    “Okay, let’s start over,” she said.


    “Very well, miss,” said Tollens. “Name?”


    “I told you, it’s Lau—” she stopped herself. “Actually . . . my name is Eponymous
    Bach.”


    “Password?” said Ponens.


    *It couldn’t be that simple, could it?*


    “Bach’s Password.”


    “Welcome!” said Ponens and Tollens, waving her through the turnstile.


    Of course Bach would name her password after herself!


    # Chapter 6. A Tinker’s Trade


    ![image with no caption](figs/web/041fig01.png.jpg)


    When Laurie and Xor were safely inside the town walls, the little lizard popped
    his head out of Laurie’s pocket.


    “See what I mean? Let’s hope they don’t figure out what you did to get in here,”
    Xor said. “So, why are we here?”


    “We’re looking for information that could help me get home. Maybe we can find
    a map or something.”


    “Oh,” said Xor. “I was hoping you were going to say food. Why don’t we try this
    place?”


    In front of them was a storefront with a very fancy sign painted on the window:'
