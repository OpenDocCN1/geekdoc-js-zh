    \ Inside was a squat telescope. “Excellent! I’ve been waiting for this.”\n\n![image\
    \ with no caption](figs/web/133fig01.png.jpg)\n\n“It’s for the Network, right?\
    \ Will you show me how it works?” Laurie asked.\n\n“Of course,” Ping said. “Watch\
    \ this.” She went to the middle of the room and turned a giant wheel until a red\
    \ arrow pointed directly at Elegant Island. Then she pulled a lever up and down\
    \ quickly:\n\n> FLOP. FLOP. FLIP. FLOP. FLIP.\n\n> \n\n> FLOP. FLIP. FLIP. FLOP.\
    \ FLOP.\n\n“Now look at Fresnel again,” she said.\n\nLaurie put her eye to the\
    \ Elegant Island telescope. Fresnel had pointed *his* light at *them* and began\
    \ blinking a message:\n\n> FLOOSH. FLOOSH. FLASH. FLOOSH. FLASH.\n\n> \n\n> FLOOSH.\
    \ FLASH. FLASH. FLOOSH. FLOOSH.\n\n“He answered back! What did he say?” Laurie\
    \ asked.\n\n“Oh, he just said ‘hi.’”\n\n“All that just for ‘hi’?”\n\n“That’s how\
    \ the Baudot Code works,” said Ping. “Sentences are made of words, and words are\
    \ made of letters, right? In the same way, we make *letters* out of FLIPs and\
    \ FLOPs. Like this.”\n\n> 01001 = L\n\n> \n\n> 11000 = A\n\n> \n\n> 10011 = U\n\
    \n> \n\n> 01010 = R\n\n> \n\n> 01100 = I\n\n> \n\n> 10000 = E\n\n“That’s pretty\
    \ neat! But I still think it’s a lot of work just to say ‘hi.’” Laurie said.\n\
    \n“Maybe you’re right,” Ping said, smiling. “But now that the hard work of building\
    \ the Network is finished, we can do something *really* interesting: use the Network\
    \ to make itself better.”\n\n“How do you do that?”\n\n“Well, I’m working on a\
    \ way to use two colors of lights. Fresnel has an idea for a simpler Code that\
    \ uses only four FLIPs or FLOPs, though I’m not too sure how that will work. We\
    \ use the old Baudot Code to talk to each other about our ideas for new codes,\
    \ and then try them out.”\n\n“So . . . you can use the Network to talk about how\
    \ to use the Network?”\n\n“And you helped make it possible, Laurie, by delivering\
    \ all of those telescopes. Now, the Network will only get better and better as\
    \ we learn how to use it. We can already pass a message from one end of the Network\
    \ to the other in just a few minutes! Even the *Doppelganger* takes a couple of\
    \ days to deliver the mail that far. Everyone will want to use it once we work\
    \ out the bugs.”\n\n“But . . . what about Winsome? Is she going to lose her job?”\
    \ Laurie asked.\n\n“What? No, not at all! The Network was her idea.”\n\n“It was?”\n\
    \n“Sure! All of us work for Winsome. She doesn’t want to spend her days hauling\
    \ mail bags around. That reminds me,” Ping said, searching through a pile of paper,\
    \ “Winsome says she has one more job for you.”\n\n“Oh! What is it?” Laurie asked.\n\
    \n“She wants you to deliver this letter to a person on the other side of the Garden\
    \ of Forking Paths.”\n\nThere was no name on the envelope, but that wasn’t half\
    \ as strange as some of the assignments Laurie had been given in her time on the\
    \ *Doppelganger*. If she got it done quickly, she could come back here and play\
    \ with the Network. “So how do I get to the Garden?”\n\n“You’re in a hurry, huh?\
    \ I’ll show you where it is.”\n\n# Chapter 19. Branching Out\n\n![image with no\
    \ caption](figs/web/137fig01.png.jpg)\n\nThe Garden was surrounded by a hedge\
    \ at least eight feet tall. The entrance was an archway cut out of the bushes.\
    \ A wooden sign above the entrance read\n\n> **WELCOME TO THE GARDEN OF FORKING\
    \ PATHS.**\n\n“Here you go,” said Ping.\n\nLaurie was suddenly very worried. “Ping,\
    \ is this a laba . . . laber . . . one of those garden mazes?” Laurie had read\
    \ stories about little girls and garden mazes, and they never ended well. Garden\
    \ mazes were full of monsters and twisty little passages between you and the exit.\n\
    \n“It’s not really a labyrinth. You can always find a way out,” said Ping. “Where\
    \ you end up is a different story.”\n\n“Oh, good. After I deliver this letter,\
    \ can I come back to the Treelighthouse? Maybe we can ask the Network about how\
    \ to find Hamilton!”\n\n“That’s . . . a good idea. Yes. When you’re done, if you\
    \ want, we can talk about it.”\n\n“Thank you! See you soon!”\n\n“Good-bye, Laurie.\
    \ Take care of yourself.”\n\nLaurie and Xor stepped through the entrance into\
    \ a kind of hallway made of more bushes. After a short walk, they found a small\
    \ fountain with a sign above it.\n\n> **LEAVE A COIN. MAKE A WISH.**\n\nLaurie\
    \ dropped her last Fair Coin into the fountain, closed her eyes, and made a wish.\
    \ She held her eyes closed for an extra moment just in case. But nothing exciting\
    \ happened.\n\nShe kept walking down the green hallway. There wasn’t much to see\
    \ except hedges, and more hedges, and more signs that talked about the Garden.\n\
    \n> **DID YOU KNOW?**\n\n> \n\n> **THERE ARE 16,777,216 PATHS THROUGH THE GARDEN.**\n\
    \n“Only 16 million? That’s nothing!” Laurie said. “Userland had millions of millions\
    \ of *millions*.”\n\n> **ONLY ONE PATH PER VISITOR.**\n\n“That’s okay. I want\
    \ to get through here quickly.”\n\n> **ONLY ONE VISITOR PER PATH.**\n\n“Isn’t\
    \ that the same thing?”\n\n> **NO.**\n\n“I wonder which path is the shortest,”\
    \ Laurie said. The next sign answered her question.\n\n> **ALL PATHS ARE THE SAME\
    \ LENGTH.**\n\n“Then how do I know which one to take?” she asked.\n\n> **CHOOSE\
    \ WISELY.**\n\nThat’s when she came to the first fork in the path. Each fork had\
    \ its own sign. The left-hand sign said\n\n> ![](figs/web/common-01.png.jpg)**THINGS**\n\
    \nand the right-hand sign said\n\n> **IDEAS**![](figs/web/common-02.png.jpg)\n\
    \nLaurie had seen a lot of Ideas lately. A simple Thing would be a nice change.\
    \ She took the left-hand path. A minute later she came to the next fork. The signs\
    \ there said\n\n> ![](figs/web/common-01.png.jpg)**FAMILIAR THINGS | STRANGE THINGS**![](figs/web/common-02.png.jpg)\n\
    \n“I’ve seen a lot of Strange Things lately, too,” she said. “I’ll go for Familiar.”\n\
    \n> ![](figs/web/common-01.png.jpg)**YOUNG | OLD**![](figs/web/common-02.png.jpg)\n\
    \n“Um . . . Old!” Down the right-hand path they went.\n\n> ![](figs/web/common-01.png.jpg)**INTERESTING\
    \ | BORING**![](figs/web/common-02.png.jpg)\n\n“That’s an easy one,” said Xor.\
    \ “Interesting.”\n\n“You’re not the one who has to climb rocks and cross scary\
    \ bridges when we make Interesting deliveries,” Laurie said. “But okay.”\n\n>\
    \ ![](figs/web/common-01.png.jpg)**LOST | UNLOST**![](figs/web/common-02.png.jpg)\n\
    \n“How can you have a sign pointing to Lost things? Wouldn’t that make them Unlost?”\
    \ asked Xor.\n\n“Maybe they’re only Lost until you find them,” Laurie mused.\n\
    \n“That makes sense.” Xor replied. They took the left path.\n\n> ![](figs/web/common-01.png.jpg)**MOSTLY\
    \ LOST | COMPLETELY LOST**![](figs/web/common-02.png.jpg)\n\n“Comp . . . no, *Mostly*\
    \ Lost,” Laurie decided. Left again.\n\n“You know, I don’t see millions of paths,”\
    \ said Xor. “There’s only ever two.”\n\n> ![](figs/web/common-01.png.jpg)**SMALL\
    \ | NOT-SMALL**![](figs/web/common-02.png.jpg)\n\n“Not-Small!” they said together.\n\
    \n> **BIGGER THAN YOU?**\n\n> \n\n> ![](figs/web/common-01.png.jpg)**NO | YES**![](figs/web/common-02.png.jpg)\n\
    \n“Everything is bigger than me,” said Xor. “Let’s go right.”\n\n> **BIGGER THAN\
    \ A MOUNTAIN?**\n\n> \n\n> ![](figs/web/common-01.png.jpg)**YES | NO**![](figs/web/common-02.png.jpg)\n\
    \n*Not that big!* They went right again.\n\n> **TALLER THAN A LIGHTHOUSE?**\n\n\
    > \n\n> ![](figs/web/common-01.png.jpg)**NO | YES**![](figs/web/common-02.png.jpg)\n\
    \nLaurie had seen quite enough of lighthouses, too. She tried to go left, but\
    \ a Shelled Green Round animal barred the way.\n\n“We meet again, Miss Ipsum,”\
    \ it said.\n\n“*Mister Tortoise!* What are you doing here?”\n\n“I’m enjoying a\
    \ special treat,” said Tortoise, taking a bite out of the greenery. “I help keep\
    \ the mandelbroccoli bushes in the Garden nice and trim. For me it is a delicious\
    \ chore. And what are you doing here, Miss Ipsum?”\n\n“I’m looking for the nearest\
