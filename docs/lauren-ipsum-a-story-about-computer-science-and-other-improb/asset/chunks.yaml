    “No. What we need . . . what we need . . . is a radical change of plan! All right,
    everyone,” Bruto said to no one in particular. “Clear the decks! Empty your minds!
    Brainstorm! I want new ideas!”


    “Let’s make the walls four times as thick, but the tower only three times as high,”
    said one worker.


    “More supports inside and out!” shouted another.


    “Use bigger bricks!”


    “Make bricks out of steel!”


    “Steel is too expensive. How about iron?”


    “Are you crazy? Iron will rust!”


    “I told you we should have used a triangle.”


    “Make the outside steel, but the inside brick.”


    “Good! This is good! Keep them coming. We’re thinking outside the box. Anyone
    else?” Bruto asked.


    “Why not a circle, like the lighthouse on Abstract Island?” Laurie suggested.
    She thought about it for a minute, then wrote out a pair of little poems.


    > **BRICK-CIRCLE:**

    >

    > **Lay a brick,**

    >

    > **turn right one degree,**

    >

    > **move forward,**

    >

    > **repeat three hundred sixty times.**

    >

    > **TOWER-CIRCLE (how-high?):**

    >

    > **Make a BRICK-CIRCLE,**

    >

    > **repeat how-high? times.**


    “See? You make a circle of bricks, then put a circle on top of that, all the way
    to the top!” Laurie explained.


    “Ha ha ha, cute idea, girlie! But that can’t possibly work,” Bruto replied.


    “Why not?” Laurie asked.


    “It’s too small!” Bruto said. “How do you expect to make a great big tower out
    of a teeny little plan like this?”


    “I don’t know,” Laurie said. It seemed sensible to her, but maybe they knew something
    she didn’t. They were professionals, after all. “I . . . I think it will work.”


    “Hmph,” Bruto hmphed. “Even if it were big enough, it has a major flaw.”


    “What flaw?”


    “Our first plan was a hollow square, and it fell down,” Bruto said. “The second
    plan was a hollow square, twice as big, and it also fell down. Your plan is a
    hollow circle.”


    “I don’t understand. Shouldn’t a circle be stronger?”


    “Obviously, the problem isn’t shape or size—the problem is that they are hollow
    inside!” said Bruto. “We need to fill up the insides with brick, too. It’s only
    logical.”


    “You’re right, Bruto!” said one worker.


    “That’s why you’re the boss,” said another.


    “But I’ve seen hollow towers,” said Laurie. “They’ve been built before.”


    “How do you know they won’t fall down eventually? The evidence is very clear,”
    said Bruto.


    “Yes, very clear,” the other workers agreed, nodding to each other.


    “But I—”


    “No, I’ve made up my mind,” Bruto said. The tower must be solid. In fact,” he
    said, looking at the pile, “we’re going to build a pyramid.”


    “A pyramid?!”


    “A pyramid can’t fall down. It’s already fallen down,” explained Bruto. “It’s
    one of the perfect solids!”


    “Yes, that’s right!” agreed one worker.


    “Genius!”


    “It’s just a matter of more work and more materials.”


    “Okay! We have a plan,” said Bruto. “Everyone, let’s get to work! Send Winsome
    my apologies, girlie, and tell her that we need more time to get it right.”


    Some people can’t be argued with. As Laurie and Xor set out for the `Doppelganger`,
    Bruto and his team were busy writing out the instructions for his `PYRAMID`, brick
    by brick by brick.


    # Chapter 17. Chasing Elegants


    ![image with no caption](figs/web/121fig01.png.jpg)


    “Right,” said Winsome, ticking off Fuerza’s package on her list.


    “Elegant Island is next. Now where’s that special package?”


    “Wow, what kind of animals are those?” Laurie asked. Along the shore, little gray
    animals with long gray trunks were playing with each other and napping in the
    sun.


    “Those are the Elegants. The island is full of them,” Winsome replied.


    “They’re so small and graceful! It’s like they’re dancing.”


    “Yeah. Package, package . . .” Winsome muttered to herself.


    “Don’t they have Elegants where you come from?”


    “No. We have elephants, but they are all big and clumsy. Are Elegants friendly?”


    “Only as much as they need to be,” Winsome said. “Found it! Okay, this package
    is for Fresnel Goodglass.”


    “The address just says UNDER THE RED BALLOON,” said Laurie. “I guess that means
    he’s over there.” She pointed to a red globe floating above the trees.


    ![image with no caption](figs/web/122fig01.png.jpg)


    But before she left, Laurie wanted to play with the Elegants. She approached them
    carefully, making soft “coo, coo” noises.


    “Are you a bird now?” Xor snarked.


    “Shush. I’m just trying to get their attention.”


    The Elegants didn’t seem especially scared or curious. In fact, they acted as
    though Laurie weren’t there. But their dancing always seemed to take them out
    of her path. When she walked along the shore, the little creatures drifted inland.
    When she went inland, they decided that under the trees was the place to be. Soon
    Laurie could see only a handful of Elegants, playing just outside of her reach.
    Oh, well, she thought.


    ***


    With the balloon to guide them, Laurie and Xor found the hill easily enough. But
    when they arrived, nothing much was there. A large boat anchor was half-buried
    in the earth. A rope led up, up, and up to a basket way above the ground, which
    itself was attached to the balloon. A couple of young Elegants were playing hide-and-seek
    under the trees. There were no buildings or people at all.


    “Are we in the right place?” Laurie wondered aloud. “Where is the lighthouse?”


    “Hey, Laurie, take a look at this.” Xor was clinging to a sign that read Please
    Ring for Service. A little bell hung below it. They looked at each other and shrugged.
    Xor gave it a whack with his tail.


    ![image with no caption](figs/web/123fig01.png.jpg)


    rang the bell, much louder than such a tiny thing should be allowed to.


    ![image with no caption](figs/web/123fig02.png.jpg)


    Xor was right next to it. The little lizard turned bright indigo and fell to the
    ground.


    ![image with no caption](figs/web/123fig03.png.jpg)


    Laurie had to cover her ears until the sound died away.


    ![image with no caption](figs/web/123fig04.png.jpg)


    When it was all over, the young Elegants were nowhere to be seen. Laurie gathered
    Xor in her hands. His skin was white and his eyes were rolling around in different
    directions.


    “Xor! Are you okay?”


    “I think so. That scared the blue right out of me!”


    A hissing sound from overhead made Laurie look up. An elevator box was lowering
    itself to the ground in front of them. They flinched as the door opened with a
    polite `ding!`.


    Laurie picked up her package and, with a last look around, stepped inside. The
    door closed, and the elevator rose fast enough to make her toes crinkle and her
    stomach go roly-poly.


    When the door opened again, they were a hundred yards up in the air, inside the
    basket. It was like a little apartment. There was a desk, a bed, and some cozy
    chairs. A wrinkly-faced old man with a gray beard and pointy ears was smiling
    at her.


    “Is this . . . are you Fresnel Goodglass? I’m Laurie. I have a package for you.”


    “Yes, it is! Yes, I am! Yes, you are! And thank you!” the man said, taking the
    package. “Welcome to my Floating Lighthouse. What do you think?”


    “This isn’t a lighthouse,” Laurie said, testing the woven floor with her foot
    before getting off the elevator. “It’s a balloon!”


    “Sure, it’s a lighthouse. In balloon form. See the big light up there?” Fresnel
    asked. There was indeed a big lighthouse light hanging over them.


    “But where’s the long twisty staircase?” Laurie asked.


    “There is the elevator instead. Easier for my old bones.”


    “What about the lighthouse keeper’s room?”


    “You can just look over the side of the basket.”


    “And the tower?”


    “Don’t need it! Inessential!” Fresnel said. “The essential part of a lighthouse
    is the light, not the house.”


    Laurie wasn’t convinced. “You can’t just stick a light on a balloon and call it
    a lighthouse.”


    “I can’t?”


    “No!”


    “Why not?”


    “Because . . . it’s cheating,” she said.


    “Hmm. I think I see your point,” Fresnel agreed. “But as long as it works, the
    name doesn’t matter.”


    “Yes, it does!”

