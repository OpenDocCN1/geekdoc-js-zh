- fmt: '

    These two characters were used by a philosopher named Zeno of Elea almost 2,500
    years ago to talk about infinity. From Aristotle to Lewis Carroll to Marvin Minsky
    to Douglas Hofstadter, mathematics is full of stories about their adventures.
    It’s Tortoises all the way down.


    ## Chasing Your Tail


    Chasing your own tail is not always a waste of time! In computer science, there’s
    a type of recursion that sounds a bit like running around in circles, and it’s
    quite useful. In `tail recursion`, you perform a process, then perform the process
    again on the result, and repeat until you reach the final answer. For example,
    Jane Hecate’s binary search for the `L` section of her book might look something
    like this:


    *   Check the section of the book of names we have right now.

    *   Do we only have the `L` section?

    *   If so, then we’re done!

    *   If not, then divide the book in half.

    *   Look at the half of the list containing the `L` section, and repeat.


    See also `Recursion` ([Chapter 4: What the Tortoise Said to Laurie](#pr03.html_chapter_4_what_the_tortoise_said_to_laur
    "Chapter 4: What the Tortoise Said to Laurie")).


    ![image with no caption](figs/web/162fig01.png.jpg)


    ## Infinity


    When people say there’s an `infinite` amount of something, they mean there’s no
    limit to how much of that thing exists. When Tortoise demonstrates how an infinite
    string can be less than two inches long, he shows that you can split that string
    into an infinite number of smaller pieces.


    Infinity is `big`, bigger than you can imagine. But you can hold infinity in your
    mind simply by saying a few words. There are infinite odd numbers: 1, 3, 5, 7,
    and so on, up to forever. There are infinite even numbers, too: 0, 2, 4, 6, 8,
    and so on. No matter how hard you look, you will never find an odd number in the
    list of even numbers or an even number among the odd ones. That means there are
    at least two kinds of infinity: the even numbers and the odd numbers.


    There are also `infinite kinds of infinity`. Think about all the numbers divisible
    by 3 and all the numbers `not` divisible by 3 (or 4, or 5). Now imagine all the
    numbers that no one else has thought of before. That’s another kind of infinity!


    ![image with no caption](figs/web/163fig01.png.jpg)


    ## Infinite Regress


    If you think about how you think, you might then start thinking about how you
    think about how you think, and then about how you think about how you think about
    how you think, and so on. This is a form of argument called `infinite regress`,
    and it can have no end. The first time you fall into this mental trap, it can
    be confusing or even scary. The trick is not to take it too seriously.


    If you think this sounds related to recursion, you’re correct! It would be quite
    troubling to get stuck in a recursive process forever. In real computers, infinite
    recursion never actually happens because no computer can hold an infinite amount
    of information. When the computer runs out of room while working on something
    recursive, you never know what might happen. Laurie and Xor experienced this firsthand
    at Recursion Junction. See also `Chasing Your Tail` ([Achilles and the Tortoise](#pr03.html_achilles_and_the_tortoise
    "Achilles and the Tortoise")).


    # Chapter 5: Welcome to Symbol


    ## Semantic Turnstile


    `╞` is a logical symbol that points the way to a truth. It’s kind of like the
    equal sign (`=`), except that it shows how `ideas` are related instead of numbers.
    If all the ideas to the left of the semantic turnstile are true, then the idea
    on the right is also true.


    Say you have two ideas: (A) “You have the password” and (B) “You may enter.” You
    can compose these ideas together to make a `rule`:


    > (A → B) “IF you have the password, THEN you may enter.”


    That is the rule that Ponens explained to Laurie at the gates of Symbol. (Placing
    two ideas on either side of that little arrow is another way to say, “IF A is
    true, THEN B is true.”)


    But how do you know the rule is true? Maybe that’s not how you enter Symbol. So
    you have to show that both the rule `(A → B)`, and the first idea, A, are true.
    In this case, we need to be sure that both the rule (“IF you have the password,
    THEN you may enter”) and the idea (“You have the password”) are true before we
    let anyone through the gate.


    That’s what the semantic turnstile is for. We put the rule and the first idea
    on the left of the turnstile, and put the second idea `(B, which is “You may enter”
    in this case) on the right:


    `(A → B), (A) ╞ (B)`


    This means “IF our rule is true and IF you actually have the password, THEN you
    may enter.”


    Here’s the weirder part: you might have noticed that the turnstile looks a lot
    like an IF...THEN. IF everything to the left is true, THEN the idea on the right
    is true. So how do we know this rule as a whole is true? Do we need a turnstile
    for the turnstile?


    `(A → B), (A) ╞ (B) ╞ (C)`


    . . . and then a turnstile for that one, and for the next one?


    `(A → B), (A) ╞ (B) ╞ (C) ╞ (D) ╞ (E) ╞ (F) ╞ (G) . . .`


    In theory, you have to pass an infinite number of turnstiles before you know anything
    is true! It’s a wonder we are able to put our shoes on in the morning! So how
    do we know that anything is true? How do you know your milk will come out of the
    carton at breakfast tomorrow, or that your classroom won’t be on the roof?


    In practice, we simply trust that the rules we live by are true, since we’ve seen
    them work in the past. However, it can be fun and useful to poke into the rules,
    as Laurie did. Even if they turn out to make sense, you learn a lot about how
    they work. Poking at rules is a big part of what science is all about! See `Infinite
    Regress` ([Chapter 4](#ch05.html "Chapter 4. What the Tortoise Said to Laurie");
    [Infinity](#pr03.html "Infinity")) and `It’s Only Logical` ([pr03.html_itapost_only_logic
    "It’s Only Logical")).


    ## Ponens


    His full name is Modus Ponendo Ponens, and he represents a type of logical argument.
    This type of argument can come to a `logical` conclusion, but it might not always
    be `true`. For example, here’s how Ponens decided that the gate to Symbol is secure:


    *   If people with passwords can enter, then our door is secure.

    *   Only people with passwords have entered.

    *   Therefore, our door is secure. (Wait, let me re-align with the user provided
    text flow).


    See also `Tollens` (next) and `Semantic Turnstile` ([Chapter 5: Welcome to Symbol](#pr03.html_chapter_5_welcome_to_symbol
    "Chapter 5: Welcome to Symbol")).


    ## Tollens


    His full name is Modus Tollendo Tollens, and, like Ponens, he represents a type
    of logical argument. In fact, Tollens works a lot like Ponens, but backward. For
    example, here’s how Tollens might decide that his door is secure:


    *   If our door was insecure, then people without passwords would enter.

    *   No one without a password has entered.

    *   Therefore, our door is secure.


    This is how Tollens would decide Steganosauruses don’t exist:


    *   If Steganosauruses existed, you would see them.

    *   You have never seen a Steganosaurus.

    *   Therefore, they do not exist.


    Like Ponens, Modus Tollendo Tollens is perfectly valid logic, but it’s only as
    good as the assumptions it’s based on. Just because you don’t have proof that
    something is true, that doesn’t mean it’s automatically false, and just because
    you’ve never seen a Steganosaurus, that doesn’t mean they don’t exist. Maybe they
    live on an island you’ve never been to, or maybe they are so good at hiding that
    no one can see them. See `It’s Only Logical` (next).


    ## It’s Only Logical

