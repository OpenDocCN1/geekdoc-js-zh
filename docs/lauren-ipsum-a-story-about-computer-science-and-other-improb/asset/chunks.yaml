    “‘毛努德（Furfnoodle）是一种鸟，”她说，“长着长蓝色的羽毛！而且它们喜欢吃小蜥蜴。”


    “真的吗？”Xor 看起来很担心，抬头寻找着蓝色的羽毛。


    “不。但如果我以后看到一只喜欢吃蜥蜴的大蓝鸟，我会叫它为‘毛努德’。”


    “你真的不应该编造那样的词，”Xor 说。


    “如果你能编造词，我也可以，”Laurie 说道。


    “我说的是真话，Laurie。”


    “读起来还好玩！”她说，“Furfnoodle。”


    “但是——”


    “Furfnooooodle！”她唱道。


    “看，这儿不安全——”


    “Furfnoodle. Furfnoodlefurfnoodle. Furf. Nood. Ull!”


    听到一声 `bloop` 的声音，一个看起来像小鼠的小型生物出现在他们面前的路面上。


    “`Furfnoodle!`”它用细小老鼠的声音说道。它绕着他们跑了几圈，然后冲进草丛，嘴里还在尖叫。“`Furfnoodle! Furfnoodle!`”


    ![image with no caption](img/068fig01.png.jpg)


    “那到底是什么？！”Laurie 说道。


    “那个，”Xor 说，“是一只婴儿逻辑（Jargon）。”


    “它从哪儿来的？它就这么从空气 `blooped` 出来了。”


    “是你用……那个词造出来的。”


    “我 `造` 出来的？”


    “我试过警告你了，”Xor 说，“你觉得逻辑是从哪儿来的？”


    “Furf——那个词有什么特别的？”


    “它是一个只对你个人有意义的名字。这就是逻辑（Jargon）的`定义`，”Xor 说，“是你造出来的。它是你的。”


    “但为什么呢？”


    “没人知道，”他说，“那是公理（Axiom）的一种特性。你对名字必须小心。它们有独特的力量。”


    # 第 10 章 恰到好处的登


    ![image with no caption](img/071fig01.png.jpg)


    概率（Probability）是海边的一个小镇。它周围只被一圈粗糙的木栅围着，完全不像符号（Symbol）的高大石墙，而且主入口似乎没有任何守卫。Laurie
    正走过大门，这时——


    “打扰一下，亲爱的！你好，在你左边。”一位老太太坐在入口处的阴影里。她膝上放着一本大书。她的胸牌写着 `海恩·赫凯特（Jane Hecate），边界安全`。


    “噢！我没看到你，”Laurie 说。


    “没关系，亲爱的。但在你进来之前，我必须确保你在`名单` 上。”


    Laurie 以前玩过这个游戏。“我的名字是 `匿名巴赫（Eponymous Bach）`，我的密码是——”


    “等一下，亲爱的，等一下！一件一件来。我们先查查你的名字。”她打开沉重的书，手指在页面上一个字母一个字母地扫描着。


    “E . . . E . . . 啊，E！在这里。”


    速度慢得令人痛苦。


    “P . . . P . . . E-P! . . . E-P-O . . . E-P-O . . . 不。”


    海恩砰地一声合上书。


    “抱歉，不在`名单` 上。”


    “什么？”


    “你不在`名单` 上，亲爱的。有 E，也有 E-P 的，但没有以 E-P-O 开头的名字。如果你名字的`开头`不在`名单` 上，就没有理由继续找它的`剩余部分`了，对吧？这很合逻辑。”


    “但她的——`我的`名字一定在`名单` 上！她是一个伟大的——我的意思是，我是——”Laurie 结结巴巴地说。


    “你是外人吗？我打赌你的名字在你们那里拼写不一样。这种情况会发生，尤其是对于外人。我们为什么不再试一次？”


    也许她确实有一个账户。“是在‘劳莉·伊普森（Laurie Ipsum）’吗？”


    “让我看看。”`Fllliiiip!` “L . . . L . . . L! A . . . U . . . R . . . I . . . 不。不在这，但我确定我们会找到的。”


    “也许可以拼成 `劳伦·伊普森（Lauren Ipsum）`。”


    “L . . . A . . . U . . . R . . . E . . . 不，也不是那种。” “呃，休（Hugh） . . . 拉斯蒂（Rustic）？”


    “H . . . H . . . H! H-U-G-H R-U-S-T-I-C. 啊，`在这儿`。”


    “太棒了！”


    “很高兴能找到你！”海恩说，“你的名字有几种不同的拼法，不是吗？”


    “是的，我想是。谢谢！”Laurie 转身向里面走。


    海恩用惊人的力气拽住了她。


    “你的`密码`，亲爱的？”


    “噢！是‘Rustic’吗？”


    “不。”


    “乌龟（Turtle）？”


    “不。”


    “算法（Algorithm）？”


    “A . . . L . . . 不。”


    “足够（Good Enough）？”


    “不。”


    Laurie 愣住了。“现在怎么办？”她对 Xor 低声说，“她不在乎我尝试字典里的每一个词。但我们会在这里呆一个月！”


    “我有一个主意，”Xor 回道，“试试‘抽象（Abstraction）’。”


    “那是什么？我甚至没——”


    “我的三表哥是一个同义词（Thesaurus）。相信我！”


    “是 Ab-stract-tion 吗？”Laurie 问海恩。


    “A . . . B . . . S . . . 不，亲爱的。”


    “‘相信我’，哈？”Laurie 对 Xor 说。


    “想起来，我从没喜欢那个表哥。”


    “嘿 . . . 你注意到什么了吗？”


    “到饭时间了吗？”Xor 期待地问。


    “不！当我说‘乌龟’时，她立刻拒绝了，”Laurie 说。


    “所以呢？它不是密码，”Xor 说。


    “但当我说‘算法’时，她花了更长时间才拒绝。而说‘抽象’时，她比那又久一点，手指在页面移动……”Laurie 清了清嗓子对海恩说，“密码是，嗯，关于（About）吗？”


    “A . . . B . . . O . . . 不。”


    “看到了吧？”她 whispered。


    “好吧，但它是什么意思？”


    “也许意味着真正的密码是以 AB 开头的！如果我们继续猜 AB 开头的词……”


    他们一个字母一个字母地破解了 Rustic 的密码。Laurie 来说很难想出以正确字母开头的词。她并不认识 Xor 让她尝试的很多词，但他向全世界的同义词的荣誉发誓说这些词是真的。她知道他们正越来越接近答案了，因为海恩拒绝的时间越越越长。


    “结束（Abend）！”


    “A . . . B . . . E . . . 不，”海恩回答道。


    “退位（Abdicate）！”


    “A . . . B . . . D . . . 不。”


    “废除（Abrogate）！”


    “A . . . B . . . R . . . O . . . 不。”


    “是以 ABR 开头的！”Laurie 对 Xor 低声说，“突然（Abrupt）！”


    “A . . . B . . . R . . . U . . . 不。”


    “辫（Abraid）！”


    “A . . . B . . . R . . . A . . . I . . 不。”


    “我们接近了，”Xor 在耳边说，“什么是以 ABRA 开头的？”


    “阿卡达拉（Abracadabra）？”Laurie 大声说道。


    “A-B-R-A-C-A-D-A-R-A-F！”海恩说，“这就是密码，没错无缺。欢迎来到概率！”


