    Ping put down the heavy package Laurie had delivered and released the latches.
    Inside was a squat telescope. “Excellent! I’ve been waiting for this.”


    ![image with no caption](figs/web/133fig01.png.jpg)


    “It’s for the Network, right? Will you show me how it works?” Laurie asked.


    “Of course,” Ping said. “Watch this.” She went to the middle of the room and turned
    a giant wheel until a red arrow pointed directly at Elegant Island. Then she pulled
    a lever up and down quickly:


    > FLOP. FLOP. FLIP. FLOP. FLIP.

    > FLOP. FLIP. FLIP. FLOP. FLOP.


    “Now look at Fresnel again,” she said.


    Laurie put her eye to the Elegant Island telescope. Fresnel had pointed his light
    at them and began blinking a message:


    > FLOOSH. FLOOSH. FLASH. FLOOSH. FLASH.

    > FLOOSH. FLASH. FLASH. FLOOSH. FLOOSH.


    “He answered back! What did he say?” Laurie asked.


    “Oh, he just said ‘hi.’”


    “All that just for ‘hi’?”


    “That’s how the Baudot Code works,” said Ping. “Sentences are made of words, and
    words are made of letters, right? In the same way, we make letters out of FLIPs
    and FLOPs. Like this.”


    > 01001 = L

    > 11000 = A

    > 10011 = U

    > 01010 = R

    > 01100 = I

    > 10000 = E


    “That’s pretty neat! But I still think it’s a lot of work just to say ‘hi.’” Laurie
    said.


    “Maybe you’re right,” Ping said, smiling. “But now that the hard work of building
    the Network is finished, we can do something really interesting: use the Network
    to make itself better.”


    “How do you do that?”


    “Well, I’m working on a way to use two colors of lights. Fresnel has an idea for
    a simpler Code that uses only four FLIPs or FLOPs, though I’m not too sure how
    that will work. We use the old Baudot Code to talk to each other about our ideas
    for new codes, and then try them out.”


    “So . . . you can use the Network to talk about how to use the Network?”


    “And you helped make it possible, Laurie, by delivering all of those telescopes.
    Now, the Network will only get better and better as we learn how to use it. We
    can already pass a message from one end of the Network to the other in just a
    few minutes! Even the Doppelganger takes a couple of days to deliver the mail
    that far. Everyone will want to use it once we work out the bugs.”


    “But . . . what about Winsome? Is she going to lose her job?” Laurie asked.


    “What? No, not at all! The Network was her idea.”


    “It was?”


    “Sure! All of us work for Winsome. She doesn’t want to spend her days hauling
    mail bags around. That reminds me,” Ping said, searching through a pile of paper,
    “Winsome says she has one more job for you.”


    “Oh! What is it?” Laurie asked.


    “She wants you to deliver this letter to a person on the other side of the Garden
    of Forking Paths.”


    There was no name on the envelope, but that wasn’t half as strange as some of
    the assignments Laurie had been given in her time on the Doppelganger. If she
    got it done quickly, she could come back here and play with the Network. “So how
    do I get to the Garden?”


    “You’re in a hurry, huh? I’ll show you where it is.”


    # Chapter 19. Branching Out


    ![image with no caption](figs/web/137fig01.png.jpg)


    The Garden was surrounded by a hedge at least eight feet tall. The entrance was
    an archway cut out of the bushes. A wooden sign above the entrance read


    > **WELCOME TO THE GARDEN OF FORKING PATHS.**


    “Here you go,” said Ping.


    Laurie was suddenly very worried. “Ping, is this a laba . . . laber . . . one
    of those garden mazes?” Laurie had read stories about little girls and garden
    mazes, and they never ended well. Garden mazes were full of monsters and twisty
    little passages between you and the exit.


    “It’s not really a labyrinth. You can always find a way out,” said Ping. “Where
    you end up is a different story.”


    “Oh, good. After I deliver this letter, can I come back to the Treelighthouse?
    Maybe we can ask the Network about how to find Hamilton!”


    “That’s . . . a good idea. Yes. When you’re done, if you want, we can talk about
    it.”


    “Thank you! See you soon!”


    “Good-bye, Laurie. Take care of yourself.”


    Laurie and Xor stepped through the entrance into a kind of hallway made of more
    bushes. After a short walk, they found a small fountain with a sign above it.


    > **LEAVE A COIN. MAKE A WISH.**


    Laurie dropped her last Fair Coin into the fountain, closed her eyes, and made
    a wish. She held her eyes closed for an extra moment just in case. But nothing
    exciting happened.


    She kept walking down the green hallway. There wasn’t much to see except hedges,
    and more hedges, and more signs that talked about the Garden.


    > **DID YOU KNOW?**

    > **THERE ARE 16,777,216 PATHS THROUGH THE GARDEN.**


    “Only 16 million? That’s nothing!” Laurie said. “Userland had millions of millions
    of millions.”


    > **ONLY ONE PATH PER VISITOR.**


    “That’s okay. I want to get through here quickly.”


    > **ONLY ONE VISITOR PER PATH.**


    “Isn’t that the same thing?”


    > **NO.**


    “I wonder which path is the shortest,” Laurie said. The next sign answered her
    question.


    > **ALL PATHS ARE THE SAME LENGTH.**


    “Then how do I know which one to take?” she asked.


    > **CHOOSE WISELY.**


    That’s when she came to the first fork in the path. Each fork had its own sign.
    The left-hand sign said


    > ![](figs/web/common-01.png.jpg)**THINGS**


    and the right-hand sign said


    > **IDEAS**![](figs/web/common-02.png.jpg)


    Laurie had seen a lot of Ideas lately. A simple Thing would be a nice change.
    She took the left-hand path. A minute later she came to the next fork. The signs
    there said


    > ![](figs/web/common-01.png.jpg)**FAMILIAR THINGS | STRANGE THINGS**![](figs/web/common-02.png.jpg)


    “I’ve seen a lot of Strange Things lately, too,” she said. “I’ll go for Familiar.”


    > ![](figs/web/common-01.png.jpg)**YOUNG | OLD**![](figs/web/common-02.png.jpg)


    “Um . . . Old!” Down the right-hand path they went.


    > ![](figs/web/common-01.png.jpg)**INTERESTING | BORING**![](figs/web/common-02.png.jpg)


    “That’s an easy one,” said Xor. “Interesting.”


    “You’re not the one who has to climb rocks and cross scary bridges when we make
    Interesting deliveries,” Laurie said. “But okay.”


    > ![](figs/web/common-01.png.jpg)**LOST | UNLOST**![](figs/web/common-02.png.jpg)


    “How can you have a sign pointing to Lost things? Wouldn’t that make them Unlost?”
    asked Xor.


    “Maybe they’re only Lost until you find them,” Laurie mused.


    “That makes sense.” Xor replied. They took the left path.


    > ![](figs/web/common-01.png.jpg)**MOSTLY LOST | COMPLETELY LOST**![](figs/web/common-02.png.jpg)


    “Comp . . . no, Mostly Lost,” Laurie decided. Left again.


    “You know, I don’t see millions of paths,” said Xor. “There’s only ever two.”


    > ![](figs/web/common-01.png.jpg)**SMALL | NOT-SMALL**![](figs/web/common-02.png.jpg)


    “Not-Small!” they said together.


    > **BIGGER THAN YOU?**

    > ![](figs/web/common-01.png.jpg)**NO | YES**![](figs/web/common-02.png.jpg)


    “Everything is bigger than me,” said Xor. “Let’s go right.”


    > **BIGGER THAN A MOUNTAIN?**

    > ![](figs/web/common-01.png.jpg)**YES | NO**![](figs/web/common-02.png.jpg)


    *Not that big!* They went right again.


    > **TALLER THAN A LIGHTHOUSE?**

    > ![](figs/web/common-01.png.jpg)**NO | YES**![](figs/web/common-02.png.jpg)


    Laurie had seen quite enough of lighthouses, too. She tried to go left, but a
    Shelled Green animal barred the way.


    “We meet again, Miss Ipsum,” it said.


    “Mister Tortoise! What are you doing here?”


    “I’m enjoying a special treat,” said Tortoise, taking a bite out of the greenery.
    “I help keep the mandbroccoli bushes in the Garden nice and trim. For me it is
    a delicious chore. And what are you doing here, Miss Ipsum?”


    “I’m looking for the nearest exit so I can deliver a letter.”


    Tortoise seemed to smile. Of course, he always seemed to be smiling. “There are
    millions of paths through the Garden. All of them are exactly the same length.”


    She tried to picture so many paths side-by-side. “I don’t understand. If there
    are so many, where are they?”

