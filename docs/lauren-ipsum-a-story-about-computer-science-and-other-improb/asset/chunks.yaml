    “不，听起来你已经偏离了真实目标。当你到达 Rustic 时，你并没有问如何找到 Hamilton。你问的是他，如何找到一条穿过 Userland 所有城镇的短路。”


    “哇，你说得对。” Laurie 低头看着自己的膝盖，“**我现在我觉得自己真笨极了。”


    “没，别难过。每个人都会犯那种错误。”


    “大家都是吗？”


    “你完全不知道，”Winsome 说，“算法并不仅仅存在于乌龟、蚂蚁和硬币中。它们也出现在你的脑海里，而那些算法是最难做正确的。”


    “我还是不知道该怎么回家。”


    “我也不知道。但问出正确的问题是一个良好的开始。既然你在这里了，最好派上点用场。” Winsome 指着窗外山上的一座高大白塔。“你看到那座灯塔了吗？”


    “那怎么了？”


    “你想去顶上看看吗？那里的景色美极了。”


    “好 . . . 好！听起来很有趣，”Laurie 说。


    “太好了。拿着这个。”Winsome 给她一个沉重的木箱。“我需要你把它送到灯塔守护人那里。”


    “里面是什么？”


    “非常昂贵。而且易碎。”


    “但是—”


    “去吧，他还在等。我会在船上接你。”


    ![figs/web/095fig01.png.jpg)


    Laurie 爬上山的过程精疲力竭，所以她在灯塔底部停下休息了一会儿，检查是否有门铃或人让她进去。一楼地上什么迹象都没有，于是她对着塔楼喊道。


    “你好！上面好吗！有人吗？”


    一个声音飘了。“是的！上来吧！门开着。”


    Laurie 绕着楼梯向上，提着笨重的箱子气喘吁吁，Xor 趴在她的肩膀上。最后她到达了塔顶的灯塔守护人房间，完全屏透了气。灯塔守护人背对着她，用双远镜扫描着地平线。


    “噢，很好，”他低声说，“小心放下。”


    Laurie 把箱子搬到长凳上，环顾四周。房间几乎没有可以说的墙；它完全是由玻璃做的。Laurie 站在灯塔守护人旁边，更清楚地观察窗外。一侧是宽阔的蓝色海水。她几乎看不到地平线上有什么凸起——也许那是
    Userland。另一侧，整个 Abstract Island 展现在眼前，就像，嗯，就像地图一样。沿岸边有港口和 `Doppelganger` 号船。两个穿长袍的人在哲学家餐馆前争论着。从上面看，这座岛屿看起来更加整洁、有组织。


    “哇！从这里可以看到这里的一切！”Laurie 惊呼道。


    “是的。”灯塔守护人的眼睛一直盯着窗外的景色。


    “所以 . . . 就这样？”


    “就是，”灯塔守护人说，“噢，呃，谢谢。”


    没有了箱子，下山比上山容易得多。


    “到底，那个箱子里**到底**是什么呀？”Laurie 在返回 `Doppelganger` 号的路上大声自语道。


    Xor 从她的口袋里探出头。“我猜是灯泡。些无聊的东西，”他插话道，“大人们总是为了无聊的事情大惊小怪。”


    回到船上时，Winsome 正准备再次起航。


    “做得好，姑娘。谢谢，”当 Laurie 上船时，她说。


    “不客气。他没怎么说话。”


    “有的人一直住在塔里就会变成那样，”Winsome 说，“另一些人会变得话**很多**。”


    “是吗？”


    “你会看到的。那么现在你打算做什么？”


    “我考虑过了，”Laurie 说，“Userland 只是一个岛。这个岛 . . . 很好，但我问了周围的人，这里没人听说过 Hamilton。”


    “嗯，”Winsome 说，“你想做我的助手吗？”


    “你什么意思？”


    “你想找家的路吧？`Doppelganger` 号几乎哪里都能去。你可以帮我送货，你可以在比走路或游泳多多的地方寻找答案。”


    “这和你告诉我我去哪里有什么区别吗？”


    Winsome 笑了。“你变得越来越聪明了。但别太聪明。跟我航行一段时间吧。我需要帮助。如果你不喜欢，我可以在你任何地方放下你。互不介意。”


    Laurie 想了一会儿，咬了咬嘴。“好吧，”她说，“成交了！”


    # 第 15 章 关键时刻的机智


    ![figs/web/099fig01.png.jpg)


    乘坐 `Doppelganger` 号与 Winsome 一起旅行非常有趣。Laurie 看到了许多奇怪的地方和人，有时她忘记了自己正在寻找返回 Hamilton
    的路。但她的工作并不轻松。


    每当他们到达一个岛，Winsome 就会带着一大袋信件进入镇子递送。几小时后，她会带着新的一批信回来，要从那个岛送到其他地方。


    Laurie 的工作是递送那些“有趣的”包裹。（Winsome 一直用那个词。Laurie 不认为它的意思是 Winsome 认为的含义。）“有趣的”客户住在偏远地区的高塔里，跨越摇晃可怕的桥梁，位于高山顶，，或悬崖侧面。包裹很重（而且易碎
    . . . 而且昂贵），目的地的指示往往非常奇怪且不完整。为了能完好无损地往返，Laurie 工作时必须非常聪明。


    模糊的指示已经够糟糕了，但这一次，Laurie 应该递送的包裹根本没有地址。上面只写着 `FIRST, FOLLOW THE BYZANTINE PROCESS.`。Winsome
    去了某处，所以 Laurie 甚至无法向她寻求帮助。


    “什么是拜占庭流程？我甚至不知道它什么样子。我该怎么遵循它？”她大声自语道。


    “我们在拜占庭岛，”Xor 说，“所以流程一定是主干道的名字。或者是一条河。或者是河边。这合乎逻辑。”


    “你完全不知道，对吧，Xor？”


    “我当然知道！我的继妹是一只剑龙龙！”


    “什么是 Atlas . . 算了。我不想知道。”


    从哪里开始并不神秘，至少不是。拜占庭的入口被一座巨大的石质建筑挡住了。牌子上写着`所有货物从此处进入`。一条长红地毯通向内部的语义旋转门，那里有两个守卫，就像在
    Symbol 里一样。守卫们似乎在争论。


    “. . . 这不符合逻辑，Anton！”


    “这完全符合逻辑，Basil。如果你只—”


    “打扰一下，”Laurie 说，“我想通过。”


    “抱歉，小姐。对于这个，你必须有一个由值守副官签字的通行证—”Anton 开始说。


    “——并由值守高级官员签字，”Basil 完成道。


    “他们是谁？”她问。


    “我们就是。”


    “噢，很好。”


    “Basil 尉是值守副官，而我是值守高级官员—”Anton 说。


    “——但只有在偶数日，”Basil 说，“在奇数日，我是高级官员，Anton 尉是副官。”


    “今天是几号？”


    “这正是我们在你打断我们之前正在讨论的，”Anton 说，“昨天是 Pent 月的三十号。我想我们都同意三十是一个偶数，所以我当时是高级官员。”


    “这意味着今天是 Hect 月的零号，”Basil 说。


    *Hect 月的零 . . ？ 嗯，万物总得有个开始的地方*，Laurie 想道。“所以今天 Anton 应该是副官，Basil 应该是高级官员，对吧？”


    “没那么简单，小姐！”Anton 说。


    “这是一个关于零是奇是奇的问题，”Basil 说。


    “噢。”Laurie 从未那样想过零。现在她很好奇。“所以到底是偶数还是奇数？”


    “零是偶数！”Anton 说，“它能被二整除。零除以二等于零。”


    “这不能证明任何问题，”Basil 说，“零除以**任何**数字都等于零。更重要的是，如果零是偶数，那么 Anton 就会连续两天担任高级官员，我绝不接受！”


    “更重要的是，”Anton 说，“如果零是奇数，那么 Basil 在今天和明天——明天是 Hect 月的一号——都将高级官员，我绝不坐视不管那样！”


    “你看，小姐，在面对重要问题时，你的立场取决于你坐在哪里，”Basil 说。


