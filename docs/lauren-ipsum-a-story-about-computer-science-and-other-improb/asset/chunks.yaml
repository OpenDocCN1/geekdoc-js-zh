    ![](img/orm_front_cover.jpg)


    ![Lauren Ipsum：一个关于计算机科学和其他其他意外的故事](img/orm_front_cover.jpg)


    # Lauren Ipsum：一个关于计算机科学和其他其他意外的故事


    ### Carlos Bueno

    No Starch Press 出版


    # 对 *Lauren Ipsum* 的赞誉


    > “一个计算机时代的《爱丽丝镜》故事。”

    > —《学校图书馆杂志》


    > “这是一场宏大运动的一部分，旨在将编程技能带给……嗯，给每个人。”

    > —《连线杂志》


    > “捕捉了解决问题的精神，并点燃了读者的想象力……向男女少年介绍了计算机科学——以及一种全新的思考和解决问题的方法。”

    > —谢丽尔·桑德伯（FACEBOOK 首席运营官，《向前一步》作者）


    > “一个迷人的寓话，却恰好植根于计算的基本概念之上。”

    > —乔塞尔琳·戈尔德费因（FACEBOOK 前任工程总监）


    > “一场进入 21 世纪科技‘仙仙境’的奇幻之旅，既具教育意义又具趣味性。”

    > —露丝·法默（国家妇女与 IT 中心首席策略与增长官）


    > “*Lauren Ipsum* 是一本关于计算背后理念的绝佳指南。我希望我小时候能有她这样的一个朋友。”

    > —罗伯特·圣阿曼特博士（《普通人的计算》作者）


    > “对于任何想为计算机科学学习或教学增添趣味的人来说，这都是必读。”

    > —琳·马丁博士（华盛顿大学）


    > “为那些可能错过计算机机会的人投射了积极的光芒。”

    > —盖尔·卡米麦尔尔（卡尔顿大学教员，Anita Borg 妇女与技术学院董事会顾问）


    # 书中的计算机


    我觉得我应该警告你：你在这本书里找不到任何计算机。如果一本没有计算机的计算机科学书的想法让你感到不快，请闭上眼睛，直到你读完这一页的内容。


    事实是，计算机科学并不是真的关于计算机。计算机只是帮助你更清晰地观察想法的工具。你不需要望远镜就能看到月亮和星星，不需要荧光镜也能闻到花香，不需要趣味镜也能玩，不需要示波器也能胡闹。


    你也可以在没有“那些东西”的情况下玩转计算机科学。理念才是计算机科学真正的真谛。这本书关于这些理念以及如何找到它们。事实上，`Userland` 中的大多数角色、地点和各种小东西实际上都是基于这些理念的。查看书末的
    `Field Guide` 以了解更多关于它们的信息！


    # 第 0 章：大部分迷失


    ![无说明图像](img/001fig01.png.jpg)


    Lauren Ipsum 在森林里迷失了一整个上午。这个可怜的女孩不知道自己在哪里，也不知道自己要去向哪里。


    这一切都始于一次争论。她妈妈想让她上夏令班，而自然地，洛莉（Laurie）不想去。“其他国家的孩子全年都在学校，”她妈妈说。“我们不在其他国家，”洛莉回答道。“上外课是领先的方法，”妈妈说。“夏天是用来玩的，”洛莉坚持道。争论持续了很久很久，没完没了，并在最后变得激烈起来。为了冷静一下，洛莉在森林里散了散步。


    当人们面对自己不想做的事情时，他们通常会去做一些被不允许的事。没多久，洛莉进入森林的深度就超过了以前的任何地方。


    迷失其实挺有趣的。在这里，洛莉可以成为她想成为任何身份，没有人会告诉她不对。


    她是一个秘密忍者，像幽灵一样穿过在古老的森林。光影在叶片下跳舞，她也随之起舞。没有人能听见她潜行的忍者脚步。没有人会看到她的到来，直到——


    “`Chiguire!`”前面传来一个声音。一个身影从黑暗中向她走来。那是愤怒的灵吗？可怕的猛兽吗？


    “`Argot!`”那个生物说道。它像是一只鼠狗，或者狗鼠。也就是说，它有狗那么大，但看起来更像老鼠。它直接走到洛莉面前，开始用一种非常不像野兽的方式蹭她的手。


    “噢，你真友好！”洛莉说道，语气相当不像个忍者。


    “`Repl!`”它一边说，一边把一只带蹼的脚放在她的膝盖上。


    “你可长得真奇怪，不是吧？你叫什么名字，嗯？我该怎么叫你？”


    “`Argot!`”


    “好吧，我叫你 Argot。你饿了吗？像你……这样的东西吃什么？”她给了它一些花生。


    “`Snarfl!`”它嗅了嗅，从她手里抓吃了起来。


    “嘿，小家伙，”她笑着挠了挠它的下巴，“你不知道回汉密尔顿（Hamilton）的路吧？”


    “`Hamilton!`”它兴奋地说道。


    “你真的知道？”


    “`Lalr!`”它拉勒着，吐出舌头。


    “那路在哪里？”


    “`Isit!`”它说道。


    “我的意思是，我怎么去那儿？”


    “`Gether!`”它回答道。


    ![无说明图像](img/003fig01.png.jpg)


    “`Argot!`”它说道。


    “`Isit!`”它说道。


    “`Gether!`”它回答道。


    “`Ar`”它说道。


    “`Ar`”它说道。


    “`Ar`”它说道。


    “`Ar`”它说道。


