    ![](orm_front_cover.jpg)


    ![Lauren Ipsum: A Story About Computer Science and Other Improbable Things](orm_front_cover.jpg)


    # Lauren Ipsum: A Story About Computer Science and Other Improbable Things


    ### Carlos Bueno

    Published by No Starch Press


    # Advance Praise for *Lauren Ipsum*


    > “A Looking Glass tale for the computer age.”

    > —*School Library Journal*


    > “Part of a much larger movement that seeks to bring programming skills to, well,
    everyone.”

    > —*Wired*


    > “Captures the spirit of problem solving and ignites readers’ imaginations .
    . . introduces girls and boys to computer science—and to a new way of thinking
    and problem solving.”

    > —SHERYL SANDBERG, FACEBOOK COO AND AUTHOR OF *Lean In*


    > “An enchanting fable that just happens to be grounded in fundamental concepts
    of computation.”

    > —JOCELYN GOLDFEIN, FORMER DIRECTOR OF ENGINEERING AT FACEBOOK


    > “A fantastical journey into the 21st century tech ‘Wonderland’ that both educates
    and entertains.”

    > —RUTHE FARMER, CHIEF STRATEGY & GROWTH OFFICER, NATIONAL CENTER FOR WOMEN &
    IT


    > “*Lauren Ipsum* is a wonderful guide to the ideas behind computing. I wish I’d
    had her as a friend when I was growing up.”

    > —DR. ROBERT ST. AMANT, AUTHOR OF Computing for Ordinary Mortals


    > “A must-read for anyone looking to spice up their learning or teaching of computer
    science.”

    > —DR. HÉLÈNE MARTIN, UNIVERSITY OF WASHINGTON


    > “Sheds a positive light on computing for those who might otherwise miss out.”

    > —GAIL CARMICHAEL, CARLETON UNIVERSITY FACULTY & BOARD ADVISOR FOR THE ANITA
    BORG INSTITUTE FOR WOMEN AND TECHNOLOGY


    # The Computers in This Book


    I feel I should warn you: You won’t find any computers in this book. If the idea
    of a computer science book without computers upsets you, please close your eyes
    until you’ve finished reading the rest of this page.


    The truth is that computer science isn’t really about the computer. The computer
    is just a tool to help you see ideas more clearly. You can see the moon and stars
    without a telescope, smell the flowers without a fluoroscope, have fun without
    a funoscope, and be silly sans oscilloscope.


    You can also play with computer science without you-know-what. Ideas are the real
    stuff of computer science. This book is about those ideas and how to find them.
    In fact, most of the characters, places, and thingamajigs in `Userland` are actually
    based on those ideas. Check out the `Field Guide` at the back of the book to learn
    more about them!


    # Chapter 0. Mostly Lost


    ![image with no caption](figs/web/001fig01.png.jpg)


    Lauren Ipsum had been lost in the woods all morning. The poor girl didn’t know
    where she was or where she was going.


    It had all started with an argument. Her mother wanted her to go to summer school,
    and naturally Laurie didn’t want to go. “Children in other countries go to school
    year round,” her mom said. “We aren’t in other countries,” Laurie replied. “Extra
    classes are how to get ahead,” Mom said. “Summer is for having fun,” Laurie insisted.
    The argument went on on on and got loud near the end. To calm down, Laurie took
    a walk in the woods.


    When people are faced with something they don’t want to do, they often do something
    they aren’t allowed to do instead. Before long, Laurie had gone farther into the
    woods than she had ever gone before.


    Being lost was kind of fun. Out here, Laurie could be anything she wanted to be,
    and there was no one to tell her different.


    She was a secret ninja, moving like a ghost through the ancient forest. Light
    and shadow danced under the leaves, and she danced with them. No one could hear
    her stealthy ninja footsteps. No one would see her coming until it was too—


    “`Chiguire!`” said a voice up ahead. A shape came toward her out of the darkness.
    Was it an angry spirit? A dire beast?


    “`Argot!`” the creature said. It was like a mouse-dog, or a dog-mouse. That is
    to say, it was the size of a dog, but it looked more like a mouse. It walked right
    up to Laurie and began nuzzling her hand in a very un-beast-like way.


    “Aw, you’re so friendly!” Laurie said, in a rather un-ninja-like fashion.


    “`Repl!`” it said, as it put a webbed foot on her knee.


    “You’re a funny-looking thing, aren’t you? What’s your name, huh? What should
    I call you?”


    “`Argot!`”


    “Okay, I’ll call you Argot. Are you hungry? What do . . . things like you eat?”
    She offered it some peanuts.


    “`Snarfl!`” it snarfled, eating out of her hand.


    “Hey, little guy,” she said, tickling its chin, “you don’t know the way back to
    Hamilton, do you?”


    “`Hamilton!`” it said excitedly.


    “You do know a way?”


    “`Lalr!`” it lalred, tongue hanging out.


    “So where is it?”


    “`Isit!`” it said.


    “I mean, how do I get there?”


    “`Gether!`” it answered.


    ![image with no caption](figs/web/003fig01.png.jpg)


    “`Argot!`” it said.


    “`Isit!`” it said.


    “`Gether!`” it answered.


    “`Ar`” it said.


    “`Ar`” it said.


    “`Ar`” it said.


    “`Ar`” it said.


