    As Trent Escrow explains to Laurie, you can guarantee a fifty-fifty chance of
    flipping heads or tails on an unbalanced coin—if you flip it twice. If you get
    Heads-Tails, then Heads is your answer. If you get Tails-Heads, then Tails is
    your answer. At least half of the time, you’ll probably flip Heads-Heads or Tails-Tails;
    in those cases, just start over. On average, you’ll need at least three coin flips
    to get a Fair flip. Try it! See also `Fair Coin` ([Chapter 6](#ch07.html "Chapter
    6. A Tinker’s Trade"); [Hamiltonian Cycle](#pr03.html_hamiltonian_cycle "Hamiltonian
    Cycle")).


    # Chapter 12: An Improbable Twist


    ## Attempted Mythology


    . . . is not actually a crime in any jurisdiction, and that’s a good thing! Otherwise,
    no one would be allowed to write any stories, and `myths` are just stories that
    have been passed down to us through many generations. Some myths try to explain
    how the world works, and some are just for fun. Use your imagination, and maybe
    someday, you’ll write a story that becomes part of a future mythology.


    ## The Doppelganger


    The `Doppelganger`’s tale is based on a classic question in philosophy: If you
    replace all of the parts of a boat, do you still have the same boat? Winsome doesn’t
    think so. She claims she stole the `Doppelganger` from its owner piece by piece
    and left him with a copy! But what do you think? If you reassemble the old parts,
    which boat is the original? What if you replaced only half of the parts?


    # Chapter 13: The Game of Life


    ## Gliders


    `Conway’s Game of Life` is a simulation of how a population of creatures might
    change over time. Computer scientists (and plenty of other scientists) use the
    Game of Life to study patterns based on simple rules. You can try it out yourself
    with a pencil and paper! First, grab some graph paper or draw a grid like this:


    ![image with no caption](figs/web/174fig01.png.jpg)


    Now fill in some squares in the grid. Here’s one example:


    ![image with no caption](figs/web/174fig02.png.jpg)


    After you’ve filled in some squares, you just have to follow a few simple rules
    to play the game and change your pattern:


    1. If a filled-in square has more than three filled-in neighbors, then it dies.
    Make it blank.

    2. If a filled-in square has only one or zero filled-in neighbors, it dies. Make
    it blank.

    3. If a filled-in square has two or three filled-in neighbors, it survives! Leave
    it colored in.

    4. If a blank square has three filled-in neighbors, it comes to life! Color it
    in.


    Follow these rules to color in a new grid. Our sample grid would turn out like
    this after one round:


    ![image with no caption](figs/web/175fig01.png.jpg)


    These patterns come in many types. `Gliders` move around. `Blinkers` turn on and
    off, like traffic lights. Some patterns even create other patterns as they go.
    This particular grid pattern repeats:


    ![image with no caption](figs/web/175fig02.png)


    # Chapter 14: In the Abstract


    ## Five Whys


    When scientists want to get to the root cause of a confusing problem, they’ll
    ask Why questions until they find out exactly Where their experiment went Wrong.
    But you don’t have to leave that kind of thinking to the scientists.


    Play Five Whys the next time you need to figure out the solution to a problem
    of your own. There are a lot of mental games you can try to help you avoid or
    learn from mistakes. Another good rule is “Never worry alone.” Grab a friend if
    you’re puzzled—when you work together, you can solve any problem!


    ![image with no caption](figs/web/175fig03.png.jpg)


    # Chapter 15: Cleverness When It Counts


    ## Following the Byzantine Process


    The word `Byzantine` can describe any extremely long and complicated process.
    Fortunately, Laurie was able to get all of the signatures she needed by helping
    the three generals, and she actually solved each of their very different problems
    similarly.


    Laurie’s algorithm for moving the wolf, the goat, and the mandelbroccoli uses
    a `counting argument`. The idea behind a counting argument is that you can solve
    some problems by ignoring unimportant differences between things and counting
    only how many there are. For example:


    * Everyone wants to use General Euripides’s books all at once. But reader or writer,
    only `one` person can use any given book at a time.

    * General Darius was so concerned with getting the mandel-broccoli, the wolf,
    and the goat across the stream that he didn’t think of counting backward—of bringing
    the goat across `multiple times`. But mandelbroccoli or wolf, as long as you don’t
    leave the goat alone with it, everything works out.


    Sometimes it’s the opposite: you have to count the same thing different ways to
    see if they add up. General Case stopped counting posts after he hit 100 feet
    of fence; he wasn’t thinking about holding up the last length! Count the gaps
    `between` the posts and you get 10. Count the posts, and you get 11.


    When Tinker tells Laurie to count paths that are mirror images of other paths
    (like `BCD` and `DCB`) as one, he is also using a counting argument. This rule
    cuts the number of paths through `Userland` in half. But even cutting the number
    in half doesn’t help much with the Traveling Salesman problem: a Very Big Number
    divided by a small number is still a Very Big Number!


    ## Mandelbroccoli


    Mandelbroccoli does exist in our world, and it’s the weirdest-looking vegetable
    I know. At the market, it’s called `Romanesco`, and it looks a lot like a fractal.
    `Fractals` are patterns that start with one shape and repeat it infinitely, smaller
    and smaller, according to a set of rules.


    For example, draw an equilateral triangle (a triangle with three sides that are
    all the same length) inside another equilateral triangle. Make sure each point
    from the second triangle touches the middle of a side from the first! This should
    create four smaller, but identical, triangles inside the original.


    Now, draw an equilateral triangle inside each of those, following the same rules,
    and repeat until you can’t fit any more triangles. You should have something like
    the fractal pattern shown here. See also `Infinity` ([Chapter 4](#ch05.html "Chapter
    4. What the Tortoise Said to Laurie"); [Infinity](#pr03.html_infinity "Infinity")).


    ![image with no caption](figs/web/177fig01.png.jpg)


    *“Sierpinski triangle evolution.” Licensed under public domain via Wikimedia Commons.*


    # Chapter 16: A Change of Plan


    ## Bruto Fuerza


    This lighthouse keeper thinks the answer to every problem is more power and brute
    force. Even if he builds a lighthouse twice as tall, twice as wide, and twice
    as thick as the one that failed, the new one will still fall over eventually because
    he’s following the same plan.


    Yet in his own way, Bruto is right when he decides to build a pyramid instead.
    Pyramids are much sturdier, and if you pile on enough bricks, you could eventually
    make a pyramid tall enough to be a lighthouse. But Bruto’s plan has enormous costs:
    he needs a lot more bricks, a lot more land to build on, and a lot more time to
    build.


    ![image with no caption](figs/web/178fig01.png.jpg)


    Some programmers approach problems this way, too, but putting all your resources
    into a brute-force attempt isn’t always a sensible answer. When your algorithm
    collapses, don’t just pile on more bricks! Change your point of view, as Laurie
    did with the generals on the Island of Byzantium, and you’ll find a more effective
    solution. See also `Five Whys` ([Chapter 14](#ch15.html "Chapter 14. In the Abstract");
    [Chapter 14: In the Abstract](#pr03.html_chapter_14_in_the_abstract "Chapter 14:
    In the Abstract")).


