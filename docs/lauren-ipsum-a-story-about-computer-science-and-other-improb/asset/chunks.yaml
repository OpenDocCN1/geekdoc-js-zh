    Five more of the creatures flapped and flopped in to join the party of their murderous
    kin. They evened out the load of stones and mocked Laurie even more loudly.


    “You can’t beat us that way!”

    “We’ll have our meal!”

    “Each one will eat less—”

    “—but a deal’s a deal!”


    ![image with no caption](figs/web/024fig01.png.jpg)


    The birds were juggling 15, 20, 25 stones now. They could catch whatever Laurie
    threw at them, and a dozen more of the creatures were waiting to join in. How
    could she get `Xor` away from them?


    “Clever Round Robins,”

    “too many to beat!”

    “You can’t stop the Robins—”

    “—when there’s dinner to eat!”


    It was hard to concentrate with the birds singing and `Xor` screaming, but Laurie
    waited again, trying to see a pattern. A Round Robin can catch anything. . . .


    “’Round he goes!”

    “Where will he stop?”

    “Stones all a-juggle,”

    “but the lizard won’t—mmph!!”


    Just as one of the birds was about to catch `Xor`, Laurie hit it in the beak with
    a nice big clod of dirt. A Round Robin can catch anything. But it can’t catch
    two things!


    She caught `Xor` as he fell and ran away as fast as she could. Stones and furious
    Robins flew everywhere as the flock lost its rhythm. Some tried to chase her,
    but they were too fat to keep up and too angry to rhyme.


    “No fair!”

    “No fair!”

    “You stole our snack!”

    “Come back!”

    “No fair!”

    “You stole . .”


    “Are you okay?” Laurie said.


    “No . . yes . . . maybe.” `Xor` was breathing hard. They both were. The little
    lizard didn’t look hurt, but he was scared out of his wits. “Birds!”


    “This is why you have to blend in, isn’t it?” she asked. “Birds want to eat you.”

    “I hate birds.”


    # Chapter 4. What the Tortoise Said to Laurie


    ![image with no caption](figs/web/027fig01.png.jpg)


    Laurie took a left turn at the sign marked “Recursion Junction.” After cresting
    a little hill, she ended up at . . . Recursion Junction!


    “Is this the same place, `Xor`?” Laurie asked. “It looks like it.”

    “Try a right turn,” he said.


    She did, but after a short while they were back where they started. When she tried
    a second, and a third, and twenty-seventh time, they always came back to Recursion
    Junction.


    “It seems as though I am going somewhere else, but we always come back to the
    same place. What’s going on?” Laurie wondered.


    They went around . . . . . . and around . . . . . . and around . . . . . . . and
    around so many times that Laurie lost count.


    Just as she was about to give up, there was a gigantic smashing sound, like a
    stack of plates falling to the floor.


    They both jumped in fright, and for a moment `Xor` accidentally turned the same
    color as Laurie’s shirt. They looked around for the source of the noise but couldn’t
    find it. To their surprise, the next turn put them on a different road.


    This road was neat and straight, and it seemed to stretch on forever. Up ahead,
    a man in a Greek helmet was riding on a large Round Green animal with a Shell.
    (Eponymous might have called the creature a turtle, though she wouldn’t have been
    quite right.) The two were moving slowly and steadily away.


    “Hey! Wait!” Laurie shouted, running up to them.

    “At last, someone has caught up to us!” said the animal.

    “I thought that was impossible,” said the man.

    “Hello!” the animal said to Laurie. “I am Tortoise, a humble tortoise.” He was
    much too large to be a mere turtle. “This is my esteemed companion, Achilles the
    Logician.”

    “At your service, miss!” said Achilles, bowing to her from his perch atop Tortoise.

    “Um, hello. My name is Lauren Ipsum.” She attempted a courtesy.

    “How did you get here, Miss Ipsum?” asked Tortoise.

    “I don’t really know,” Laurie said. “We were following the path to Symbol, but
    I got turned around at Recursion Junction.”

    “That often happens. You spent quite a bit of time chasing your tail, I imagine.”

    “But I don’t have a tail,” she said.

    “So it got away from you, did it?”

    “What?” Laurie asked. “No, I don’t—”


    ![image with no caption](figs/web/029fig01.png.jpg)


    “Or perhaps it was optimized away,” said Tortoise. “No matter. Most of you made
    it through, and that’s the important thing. You can help us resolve a question.”

    “Well, I can try,” Laurie said, not sure that she and Tortoise were having the
    same conversation.

    “Splendid!” said Tortoise. “The question my dear friend Achilles and I are considering
    is this: how long is an infinite piece of string?”

    “An infinite string? Infinite means it’s really, really, really, really, really,
    really long. Really,” said Laurie. Really.

    “Ah! So you agree with me,” Achilles said. “That means the burden of proof must
    be borne by the other side.”

    “The burden of Achilles on my back is more than enough!” Tortoise grumbled.

    “Friend Tortoise is wise about many things,” said Achilles. “But he is clearly
    wrong this time. He says that an infinite string can be exactly two inches long!”

    “But how can an infinite string be two inches long?” Laurie asked.

    “His claim is preposterous and indiscrete,” said Achilles. “We are in continuous
    disagreement about it.”

    “I never disagree,” said Tortoise. “I only discuss, especially with an intellect
    such as yours, Achilles. Your understanding has no limit.”

    “You are too kind, dear Tortoise.”

    “I mean every word,” said Tortoise. “Allow me to suggest a way to settle the question
    by Experiment.”

    “Please, suggest away,” said Achilles.

    “Let us build—hypothetically, of course!—an infinitely long piece of string and
    then measure it. Miss Ipsum can be our impartial judge.”

    “I accept. Experiment is always better than mere Theory,” Achilles said. “And
    an impartial judge sounds wonderful, especially when she already agrees with me!”

    “Excellent,” said Tortoise. “Miss Ipsum, imagine you have an infinite number of
    pieces of string. If you laid them all end-to-end, would that be infinitely long?
    Hypothetically?”

    “Yes, it must be,” said Laurie.

    “Infinity is infinity,” said Achilles. “It’s only logical.”

    “I wonder. Suppose we start with a piece of string one inch long,” Tortoise said.
    “Then add a second piece of string that is one-half inch long. How long are they
    together?”

    “One and a half inches,” Laurie said.

    “And that is shorter than two inches?” Tortoise asked.

    “One-half inch shorter. Unmistakably,” Achilles said.

    “We all agree thus far,” said Tortoise. “Perhaps we shall converge upon the same
    conclusion.”

    “I doubt that!” said Achilles. Laurie wasn’t sure what Tortoise was getting at,
    but she doubted it, too.

    “Achilles, would you please keep count of our hypothetical string? I want to add
    a third piece one-quarter of an inch long,” said Tortoise. “Is our string now
    one and three-quarters inches long?”

    Achilles retrieved a much-used notebook from under his helmet and scribbled some
    figures. “It seems so,” he said.

    “With one-quarter inch to spare?” asked Tortoise.

    “Yes,” replied Achilles. “Only one-quarter inch! You are a finger’s width away
    from defeat!”

    “Add an eighth-inch piece,” Tortoise said. “Do I still have some space left?”

    “Yes, but I’ll have beaten you soon!” the Greek Logician crowed. “Your string
    is an eighth of an inch away from the limit, and you’ve done only four pieces!”

    “Your arithmetic is correct as always, Achilles. But in the interest of science,
    let us continue until the bitter end,” Tortoise said.

    “It won’t be long,” said Achilles. “What is your next move?”

    “I would like to add another piece of string, this time one-sixteenth inch long.”

    “Done!” Achilles scribbled away. “Only one-sixteenth inch left, old friend!”

    “Only that much?” said Tortoise. “Then for the next one, I would like to add a
    piece of string one thirty-second inch long.”

    “As you wish, poor Tortoise. One thirty-second of an inch added. There is only
    one thirty-second inch remaining, and an infinity of strings to go! There will
    be plenty of rope left to trip yourself with!” said Achilles.

