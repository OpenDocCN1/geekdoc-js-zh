    # 第 21 章 还有


    ![image with no caption](img/151fig01.png.jpg)


    这是一个黑暗且雾气弥罩的夜晚，Lauren Ipsum 回到哈密尔顿已经好几个月了。灯塔闪烁着。闪烁。闪烁。闪烁。


    今晚的闪光没有传递任何信息。雾气太浓，无法发送信号，所以 `Network` 处于离线状态。这些强光被用于它们原本的用途：警告船只远离危险的礁石。


    巧的是，周围只有一条船，而且它不需要警告。它正处于它应该在的位置。


    `Jargonaut` 就是那艘船，Kevin Kelvin 是它的船长。这艘船很大、很平且普通。船头有一个小小屋，Kelvin 就住在那里。甲板的其他部分被一台起重机和一个卷扬机占据着——这是一个用于收放钢线的机器。一根钢线从起重机引向水中，看起来像一根巨大的鱼竿。甲板下方大部分是一个存放成千上万卷绕好钢线的货舱。


    说 `Jargonaut` 是一艘带有卷扬机的巨型船并不准确。那可能会给你产生错觉。不如将其描述为一艘挂着船的巨型 `winch`。它人生的全部意义就是放长和收起数里的重钢线。


    在船舱内，Kevin Kelvin 揉着双手来保暖。门旁的一个钩子上挂着一个温度计。显示读数是冷骨的 273。*抖抖！* 现在，273 度对你和我来说听起来很热，但这个温度计不是用华氏度或摄氏度衡量的。它是
    `Kelvin Scale`，这是船长的众多发明之一。`Kelvin Scale` 起于 `Absolute Zero`（绝对零），这是任何物体可能达到的最低温度。而
    273 开尔文并没有好多少。它大约冰块的温度。*抖抖！*


    温度计反映了 Kevin Kelvin 是什么样的人。他是一个 `Composer`，而且是一个聪明得过命的人。他从不让好主意在没有签上名字的情况下溜走。


    ![image with no caption](img/152fig01.png.jpg)


    当人们问起 Kelvin 在做什么时，他会说他在钓鱼。他从不解释自己在半夜里用着一台挂着船的巨型卷扬机到底在钓*什么*。当人们开关于捕获海怪的玩笑时，Kelvin
    只微笑。没有人知道他所知道的。他们怎么可能知道？


    Kevin Kelvin 正在钓流过他的 `Wire` 之上的微小电流。`Wire` 在海洋下延伸数英，一直通到灯塔附近的一座小建筑里。他拨动着旋钮，仔细听着连接
    `Wire` 的附近的扬声器，并做记录。如果他的想法是正确的，现在任何时候他应该听到另一端助手发来的信号。听起来像是——


    > BEEP.


    他的皮肤因兴奋而颤抖，但他不敢发出一点声音。


    > BLOOP. BEEP.


    Kelvin 迅速断开了一些电线并连接了另一些电线。他反复拨动开关。


    > FLIP. FLOP. FLIP.


    `Wire` 给了回应。


    > BLOOP.


    `Wire` 起作用了！正如 Kelvin 所想的那样：他可以使用电力发送信息，即使在数英的海水下。如果 `Jargonaut` 在两个岛屿之间铺设一条 `Wire`，那将形成
    Kelvin 自己的 `Network` 的第一个节点。一个可以随时发送信息的 `Network`，即使在像今天这样糟糕的夜晚。一个有一天甚至可以拥有 `multiple
    Wires` 的 `Network`。


    那些躲在象牙塔里的蠢货们，闪烁着他们的小灯，，永远不知道什么叫降临！


    # 用户领域指南


    ![image with no caption](img/155fig01.png.jpg)


    你可能好奇故事中的某些部分是否是真的。你真的能从一个 `Unfair Coin` 制造出一个 `Fair Coin` 吗？你真的能利用蚂蚁寻找更短的路径吗？是的，这两点都可以做到——而且更多。在本指南中，你将发现
    Laurie 在用户领域遇到的一些地方、人和事物是如何与我们的世界联系的。


    # 第 0 章 大部分迷失


    ## jargon


    在现实世界中，术语（jargon）看起来不像一只鼠狗，甚至也不像狗鼠；它看起来就像一个普通的词！计算机科学家（实际上，所有的科学家）都喜欢发明新词。我们把这些专业词汇称为
    `jargon` 或 `argot`。术语是有好处的，当你与同事讨论问题时，它可以帮你节省时间。它也可能是坏的，因为它将非专业人士排除在对话之外。


    当你刚开始学习编程时，所有的术语、行话和奇怪的新词都可能让你望而畏惧，但不要让这阻止你的学习。术语可以是愚蠢的、强大的，或者是危险的，取决于你如何使用它。但无论你使用什么词，如果你总是
    `obfuscate`（混淆）而不是 `explicate`（阐释），没有人会理解你的！


    ## wandering salesman


    `Traveling Salesman problem`（旅行推问题）是计算机科学中的经典问题。给定一组城市，你的目标是找到最短的 `Hamiltonian
    path`（哈密顿路径），一条让你每个城市只访问一次的路线。如果你有大量城市，即使对于计算机来说，计算这条路径也要花费长时间。所以，游荡的旅行推可能在路上走很长时间！


    旅行推并不计算精确的答案，而是寻找一条穿过所有城镇的路径，这条路径“足够”最短。旅行推问题一个非常感兴趣的方面是，人类非常擅长用手解决小例子。关于人们在解决问题时脑子里在使用什么算法，有很多讨论。另见
    `Hugh Rustic` (`第 8 章`)。


    ![image with no caption](img/156fig01.png.jpg)


    ## upper and lower bounds


    在用户领域，`Upper Bounds`（上边界）是山脉，是任何可能达到的高度。`Lower Bounds`（下边界）是山谷，是任何可能达到的深度。没有什么比这些边界更高，也没有比它们更低。


    在现实世界中，找到一个问题的上限和下限可以简化很多事情。假设你要猜一个人的年龄。没有人可能超过 150 岁，也没有人小于 0 岁。所以，150 是 `upper
    limit`（上限），0 是 `lower limit`（下限）。你可以通过简单的问题进一步缩小边界。


    ## mile zero


    你有时会看到标记公路上某地点的标志，比如“第 14 英里”。现在，如果有第 14 英里，那么就有第 13 英里、12 英里，以此类推。一切都必须从某个地方开始，而零就是它开始的地方。最著名的零英里位于佛罗里达州的基西斯特。它是美国
    1 号公路的起点，一直延伸到加拿大。如果你仔细观察并足够幸运，可能会在你居住的地方发现一个零英里。


