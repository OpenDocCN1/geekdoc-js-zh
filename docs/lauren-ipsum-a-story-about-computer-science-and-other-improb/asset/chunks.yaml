    “但是——”劳莉开始说道。


    “总之，你得先让你的通行证申请表获得批准。”


    “我的通行证申请表？我不明白。”


    “噢，当然，我们这里已经没有通行证了，”巴塞尔说，“那样太不符合保规定了！”


    “你必须让凯斯将军批准你的通行证申请。如果他说你可以通过，那么我们就说你可以通过，”安东说道。


    “他在就在走廊右侧的尽头，”巴塞尔补充道，“现在你听着，安东：如果你把两个奇数相加你会得到一个偶数，对吧？零加零等于零。所以如果零像你坚持的那样是偶数，它也同时是奇数……”


    劳莉走过一条无尽的走廊，直到她来到一扇标有`康斯丁·凯斯将军，边界安全办公室`的敞开门前。她轻轻敲了门，进了房间。


    “你好，将军先生，吗？我想找一张可以通过大门的通行证。”


    “嗯。”凯斯将军从文件中抬头看了一刻。“你来这里什么事？”


    “我是来送包裹的。”


    “嗯。100 英尺的围栏需要多少根栅柱？”


    你说什么？


    “栅柱，孩子。我想在 100 英尺的围栏上每隔 10 英尺放一根栅柱。我需要多少根？”


    “呃，10 根？”


    “我也是这么想的，”他说，“但我们的栅柱快不够了。我怀疑敌人正在偷走它们。”


    劳莉完全不知道他在说什么。“很抱歉打扰您，先生，但关于那张通行证……”


    ![image with no caption](img/103fig01.png.jpg)


    “把这个交给走廊下物流办公室的达里乌将军，”凯斯说，递给她一张空白的通行证申请表，“如果他批准了，我也批准。”


    “谢谢您！”劳莉轻快地说。


    “嗯。”他转过头去忙他的栅柱问题，让劳莉自己去寻找达里乌将军。


    ***


    达米安·达里乌将军也正忙于一堆文书。劳莉注意到他的桌子上有一张巨大的河流地图；地图上布满了涂鸦和箭头。


    “达里乌将军？我需要一张通行证，”劳莉说，递上她从凯斯那里拿到的通行证申请表。


    “你是为了杏仁西兰（mandelbroccoli）来的吗？”


    “呃，杏仁西兰？不是，先生。”


    “那你就有关于狼的信息。”


    “狼？”


    “是的，狼，”达里乌说，“我的一名士兵正试图把一只狼、一只羊和一筐杏仁西兰运过并发流（Concurrent Streams）。小船只够载他和另一件东西。”


    “他不能一次带一个吗？”她问。


    “不行。如果他带走了狼，把羊留在西兰旁边，羊就会吃掉它。如果他带走了西兰，把狼留在羊旁边，狼就会吃掉羊。”


    “所以先带羊，”劳莉说着，在脑子里比划着，“然后带……噢。”


    “没错。无论他接下来带什么，在另一边都会面临同样的问题，”达里乌说。


    ![image with no caption](img/105fig01.png.jpg)


    “那消息太糟糕了，但我实际上是来问通行证的，”劳莉回答道。


    “我没时间陪平民闲聊。把你的这什么东西交给档案办公室的尤里庇德斯将军，”达里乌说，把劳莉的表格还了给她，“如果他批准了，我也批准。”


    劳莉沿着走廊走了过去。


    ***


    尤里庇德斯正忙于自己的问题。人们挤在档案办公室桌子上摆放的巨大记录簿周围。有些人正试图从书上阅读长串的数字。另一些人则想在书上写新数字。读者和写作者们推来挤去，互相阻碍。看起来随时可能爆发冲突。


    将军在各个桌子之间来回走动，听取抱怨并发布命令。一群人围着他转，互相大叫着，试图引起他的注意。看起来他几乎没有时间思考。


    劳莉推挤、挣扎，钻到了人群前面。


    “先生？尤里庇德斯将军？你能帮我吗？”


    “呃？噢，又来。你是读者还是写作者？”


    “我不是读者也不是写作者。我需要你批准——”劳莉开始说，但将军必须去平息一场争吵。


    “你刚才想要什么？读者？哪一本书？”尤里庇德斯回来时问道。


    “不，先生。我需要——先生？你好，先生？”


    尤里庇德斯去了房间另一个角落。劳莉试图再次引起他的注意，但人群不断把她推开。


    ***


    劳莉坐在走廊的地板上，头枕在膝盖，精疲力竭且困惑。杏仁西兰、栅柱、通行证、这个将军、那个将军……这一切到底什么时候是个头？她仍然能听到关于谁下一个能用哪本书书的争吵声。


    “那些人太没礼貌了，”她抱怨道。


    “为什么他们不能轮流和分享呢？”


    “也许没有人教过他们吧，”索尔说，“我的表弟雷克斯从不喜欢分享。当然了，他有四十英尺高，牙齿有你的手臂那么长。”


    “应该有人教教他们。这不公平。”


    “是啊，”索尔说，“嘿，你不是‘某人（Somebody）’吗？”


    “我？”


    “是的！我很确定你是‘某人’。否则，你就是‘无人（Nobody）’，那对‘任何一个人（Anybody）’来说都不说得通。”


    “但我只是个孩子。没人理孩子的。”


    “又怎样？没人也不理我，”他说。


    “但这不正是你想要的，对吧？变得隐形。”


    “噢。对的。”


    “我们要怎么办，索尔？”


    “我不知道。想想吧。你擅长那个。”


    “不，我不擅长，”劳莉嘟囔道。


    “真的吗？廷克（Tinker）觉得你擅长。温瑟姆（Winsome）也是。”


    劳莉再次低下头，叹了口气。“我只是她的送货员。”


    “不，你是她有趣的送货员，”索尔说。


    “那又？”


    “所以你想办法去那些别人去不了的地方。还记得你在符号之（Symbol）外面和波恩（Ponens）以及托伦（Tollens）争论吗？我没以为你能找到绕过去的办法。但你做到了。老太太也是一样。”


    “他们也没能抓到我们，”劳莉微微笑了一下。


    “什么？”索尔问。


    “我只是……我办不到。她给了我一份工作，我必须自己完成。”


    既然别无可做，也无处可去，劳莉开始思考。


    她需要尤里庇德斯的批准，才能从达里乌那里获得批准。然后，表格必须由巴塞尔和安东签字并会签。这种混乱有些熟悉。休格告诉过她的。*先想出一个答案，然后寻找一个与之匹配的问题。*


    尤里庇德斯忙不可开。每个人都想同时做所有事情。也许她应该从那里开始……


    ***


    半小时后，劳莉回到了档案办公室。她没有叫喊，推推，也没有插队。她在等待。最后，其中一本书完全空出来了。劳莉走过去，在地板上画了一条线。


    一个女人走过来要在书上写字。劳莉让开旁让她工作。几刻后，一个男人走过来要读书。


    “新规定，先生，”劳莉说，“你必须站在线上，直到第一个客户用完。”


    “但我得在第 1728 页查点东西！”


    “很抱歉，”她说，“将军的命令。但你是下一个。”


    “噢。行吧。”那个男人小心地站在线上。另一个人来读第 1024 页。“


    “将军的命令，”1728 指着线说，“别担心。你在我后面。”


    劳莉守着那条线，直到这种模式看起来可以自动运行下去。每个新来的人都会被已经在队中的人告诉等待。然后她等下一本书空出来。


    随着这个主意的传开，人们开始在其他书前面画自己的线。很快，整个档案办公室都变得安静而井然。毕竟，这是将军的命令。

