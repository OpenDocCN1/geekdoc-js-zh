    欧里庇得斯几乎无法相信自己的眼睛。读者们和作者们正遵循着一个简单的规则在轮流进行！他很高兴能休息一下，于是二话不说地签了洛莉的通行证。


    ***


    “达里斯将军？”


    “又是你。在我们解决好‘西兰花危机’之前，我不想听任何其他事情。”


    “我觉得曼德西兰花并不重要，先生，”洛莉说道。


    “什么？你想让那只羊把它们全吃了吗？”


    “不，我的意思是，即使你有两只狼，答案也是一样的。你不能把羊单独地留在任何东西旁边。如果你变换一下视角就很简单。我觉得。”


    “继续说，”将军说。


    洛莉又思考了一小会儿，然后写下了她的想法。这看起来有点像丁格尔那里的算法：


    1. **把羊带到对岸去。**

    2. **空手回来。**

    3. **把狼带过去，但把羊带回来。**

    4. **留下羊，把曼德西兰花带过去。**

    5. **空手回来。**

    6. **最后，再次把羊带过去！**”


    达里斯研究了一会儿洛莉的想法，他在思考时双手比来比划着。


    “我相信这行得通。那只羊可能不喜欢这样来回去，但总比被吃掉好，”达里斯说，“现在小姐，你想要什么？”


    ***


    最后，洛莉回到了边界安全局。“凯斯将军，先生？达里斯将军签了我的通行证。”


    “嗯，”凯斯哼哼了一声，在达里斯的签名下面潦草了一个签名。


    “谢谢您，先生。”


    “嗯。”


    “先生？还有一件事，”洛莉说。


    “嗯？”


    “我不认为有人在偷你的栅栏柱。你只是需要`eleven`根柱。像这样。”


    ![image with no caption](img/111fig01.png)


    “嗯！”


    ***


    “欢迎回来，小姐，”安东说道。洛莉递交了从拜占庭将军们那里收集的文件。


    “看起来一切正常，”巴西西尔检查着签名列表说，“这些批准一直落实到了高层！”


    “小姐，你有什么需要报备的吗？”安东问。


    “报备？”


    “安东中尉的意思是，”巴西西尔说，“有什么我们应该知道的事情吗？”


    “噢。这个，我觉得安东是对的。零是偶数。”


    “不！”巴西西尔说。


    “对。零不可能是奇数，因为一是奇数，而你不能连续有两个奇数，对吧？”


    “对！”安东说。


    “我想不是，”巴西西尔嘟囔着说，“但这不能证明它是偶数。”


    “嗯，如果你把一个奇数和一个偶数加在一起，得到的总是一个奇数，”洛莉说道。


    “嗯，”巴西西尔若有所思地思考道，“一加二等于三，二加三等于五……是的。”


    “所以我可以证明零是偶数还是奇数。把它加在一个奇数上看看结果。零加一等于一，而一是奇数。所以零必须是偶数，”洛莉说。


    “我还是不服，”巴西西尔说。


    “好吧，”洛莉说，“如果你把两个`even`数加在一起，得到的总是一个偶数，对吧？零加二等于二，是偶数。零又是偶数了！”


    “完全正确！”安东说。


    “哼，”巴西西尔哼了一声，“所以零是偶数。我该如何防止安东连续两天当值长呢？”


    “那部分很简单，”洛莉说，“问题是昨天，三十日，和今天，零日，都是偶数。安东昨天是值长。所以巴西西尔，你今天可以当值班长。”


    “现在等一下——”安东说


    “——但到午餐为止，”洛莉说，“今天午餐后，安东就是值长。这样才公平。”


    “太棒了！”值长巴西西尔说，“副官安东，签一下这位小姐的通行证！”


    批准、批准、批准、签名、复签。洛莉终于通过闸机。


    “我很高兴终于结束了，”索说，“现在，该死的拜占庭流程到底在哪儿？”


    # 第 16 章 计划的变更


    ![image with no caption](img/113fig01.png.jpg)


    *第二*，包裹说明上写着，*递交给 BRUTO FUERZA，LOOKOUT HILL 灯塔*。洛莉和索没有看到任何灯塔，但山丘上升起了一片尘土。


    “你们为温森工作，对吧？很准，”布鲁托在他们到达时说道，“我很遗憾我们进度落后了。我们的灯塔还没完工。我们一直在加夜加命地工作。”


    “要把灯塔盖在那座城堡上面吗？”洛莉问。


    “城堡？”布鲁托问，“那*就是*灯塔。”


    几十个绿壳圆型机器在巨大的结构周围忙碌。它们看起来就像丁格尔的乌龟，但有大卡那么大。这些乌龟不是在纸上画点，而是在一层一层地砌砖，在洛莉眼面前建造着`WALLs`、`STAIRs`和`WINDOWs`。


    “墙上出来的那些东西是什么？”她问，指向塔楼一侧密集的支撑柱和扶壁。


    “我们的问题没完，”布鲁托摇着摇头吐口唾沫，“南墙一直在向外塌。所以我们必须加固它。然后它开始向内`inward`塌。”


    “这就是你们进度落后的原因吗？”她问。这场景中的某些东西让洛莉感到不安，但她又说不上。它看起来……很乱。


    “事情总是会出问题的，”布鲁托说，“大想法伴随着大风险。但我们可以用更多的力量和努力来解决任何问题！”


    “你这两样确实非常多，”洛莉说道，带着一丝微小的羡慕。如果有了那些乌龟她能做多少事啊！你们是怎么教乌龟盖塔的？”


    “来，我给你看。”布鲁托带她来到附近的一个帐篷。一小群人围着桌子工作。“首先我们在纸上写下计划。”


    > **砖块行：**

    >

    > 铺一块砖，

    >

    >向前移动，

    >

    > 铺一块砖，

    >

    >向前移动，

    >

    > 铺一块砖，

    >

    >向前移动，

    >

    > . . .


    “那部分形成了一行的砖。我们将许多`砖块行`堆叠在一起，墙就是这样建成的。为了让墙更厚，我们只需要添加更多命令。”


    > **砖块行版本二：**

    >

    > 铺一块砖，

    >

    > 铺一块砖，

    >

    > 向前移动，

    >

    > 铺一块砖，

    >

    > 铺一块砖，

    >

    > 向前移动，

    >

    > 铺一块砖，

    >

    > 铺一块砖，

    >

    > 向前移动，

    >

    > 铺一块砖，

    >

    > 铺一块砖，

    >

    > . . .


    “哇，它一直写下去没完没了，”洛莉翻着书页说，“写完这些一定花了好很长时间。”


