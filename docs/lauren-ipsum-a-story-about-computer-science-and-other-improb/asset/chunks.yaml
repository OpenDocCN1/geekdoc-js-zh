    这两个字符大约在 2,500 年前被一位名为埃利亚的芝诺（Zeno of Elea）的哲学家用来讨论无限。从亚里士多德到刘易斯·卡罗尔，再到马文·明斯基和道格拉斯·霍夫斯塔特，数学中充满了关于他们冒险的故事。从头尾都是乌龟。


    ## 追逐自己的尾巴


    追自己的尾巴并不总是在浪费时间！在计算机科学中，有一种递归听起来有点像是在圈圈转转，而且非常有用。在`尾部递归`中，你执行一个过程，然后对结果再次执行该过程，重复直到得到最终答案。例如，Jane
    Hecate 对她书中的 `L` 部分进行二分查找可能像这样：


    *   检查我们目前拥有的书名列表章节。

    *   我们只有 `L` 部分吗？

    *   如果是，那就大功告成了！

    *   如果不是，就把书一分为二。

    *   查看包含 `L` 部分的那一半列表，并重复。


    参见 `递归` (第 4 章：乌龟对洛莉说的话)。


    ![一张没有说明的图片](img/162fig01.png.jpg)


    ## 无限


    当人们说某东西是`无限`的时，他们的意思是该东西的存在量没有限制。当乌龟演示一个无限字符串如何可以小于两英寸时，他展示了你可以将该字符串分成无限数量更小的碎片。


    无限是`大`的，比你想象的还要大。但你只需要通过几句话就能在脑海中掌握无限。有无限多个奇数：1, 3, 5, 7 等，直到永远。也有无限多个偶数：0, 2,
    4, 6, 8 等。无论你如何努力寻找，你永远在偶数列表中找不到奇数，也不会在奇数中找到偶数。这意味着至少有两种无限：偶数和奇数。


    还有`无限种无限`。想想所有能被 3 整除的数字以及所有`不能`被 3 整除（或 4，或 5）整除的数字。现在想象一下所有以前没人想过的数字。那是另一种无限！


    ![一张没有说明的图片](img/163fig01.png.jpg)


    ## 无限归溯


    如果你思考你是如何思考的，你可能会开始思考你是如何思考你是如何思考的，然后思考你是如何思考你是如何思考你是如何思考的，以此此类推。这种论证的形式被称为`无限归溯`，它可以没有结束。当你第一次掉进这个心理陷阱时，可能会感到困惑甚至害怕。秘诀在于不要太当真它。


    如果你觉得这和递归有关，你是正确的！永远陷入一个递归过程中将是非常糟糕的。在真实的计算机中，无限递归永远不会发生，因为没有一台计算机可以存储无限的信息。当计算机在处理递归任务时用完空间时，你不知道会发生什么。Laurie
    和 Xor 在“递归交叉路口”亲身验了这一点。参见 `追逐自己的尾巴` (阿基琉斯与乌龟)。


    # 第 5 章：欢迎来到符号


    ## 语义闸机


    `╞` 是一个指向真理之路的逻辑符号。它有点像等号（`=`），区别在于它展示的是`思想`之间的关系，而不是数字之间的关系。如果语义闸机左侧的所有想法都是真的，那么右侧的想法也是真的。


    假设你有两个想法：(A) “你有密码”和 (B) “你可以进入”。你可以将这些想法组合在一起形成一条`规则`：


    > (A → B) “**如果你有密码，**那么**你可以进入。”


    这就是 Ponens 在符号世界（Symbol）的大门处向洛莉解释的规则。（在那个小箭头的两侧放置两个想法是另一种表达方式，即“如果 A 是真的，那么 B
    就是真的”。）


    但你如何知道这条规则是真实的呢？也许这并不是进入符号世界的方式。所以你必须证明规则 `(A → B)` 和第一个想法 A 都是真的。在这种情况下，我们需要确保在允许任何人通过大门之前，规则（“如果你有密码，那么你可以进入”）和想法（“你有密码”）都是真的。


    这正是语义闸机的作用。我们将规则和第一个想法放在闸机的左侧，并将第二个想法 `(B, 在本例中是“你可以进入”)`放在右侧：


    `(A → B), (A) ╞ (B)`


    这意味着“**如果**我们的规则是真的，且**如果**你真的有密码，**那么**你可以进入。”


    更奇怪的部分在这里：你可能注意到这个闸机看起来非常像 IF...THEN。如果左侧的一切都是真的，那么右侧的想法就是真的。那么我们如何知道这条规则整体是真的呢？我们需要为闸机准备一个闸机吗？


    `(A → B), (A) ╞ (B) ╞ (C)`


    . . . 然后再为那个准备一个闸机，下一个？


    `(A → B), (A) ╞ (B) ╞ (C) ╞ (D) ╞ (E) ╞ (G) . . .`


    在理论上，在知道任何事情是真的之前，你必须通过无限多个闸机！我们早上早上能穿上鞋真是个奇迹！那么我们如何知道某些事情是真的呢？你如何知道明天早餐时牛奶会从盒里流出来，或者你的教室不会在屋顶上？


    在实践中，我们简单地相信我们遵循的规则是真的，因为我们过去见过它们起作用。然而，像洛莉那样去探究规则可能是有趣且实用的。即使它们被证明是合理的，你也能学到很多关于它们如何运作的知识。质疑规则是科学的核心！参见
    `无限归溯` (第 4 章；无限) 和 `这合逻辑` (pr03.html_itapost_only_logic "这合逻辑")).


    ## Ponens


    它的全称是 Modus Ponendo Ponens，它代表了一种逻辑论证。这种论证可以得出`逻辑`结论，但它并不总是`真实`的。例如，Ponens 是这样判断符号大门是安全的：


    *   如果有密码的人可以进入，那么我们的门是安全的。

    *   只有带密码的人进入了。

    *   因此，我们的门是安全的。


    参见 `Tollens`（下一节）和 `语义闸机` ([第 5 章：欢迎来到符号)。


    ## Tollens


    它的全称是 Modus Tollendo Tollens，和 Ponens 一样，它代表了一种逻辑论证。事实上，Tollens 的工作原理与 Ponens
    相似，但方向相反。例如，Tollens 可能这样判断它的门是安全的：


    *   如果我们的门不安全，没有密码的人就会进入。

    *   没有没有密码的人进入。

    *   因此，我们的门是安全的。


    这就是 Tollens 判断恐龙蛋不存在的方式：


    *   如果恐龙存在，你就能看到它们。

    *   你从未见过恐龙蛋。

    *   因此，它们不存在。


    和 Ponens 一样，Modus Tollendo Tollens 是完全有效的逻辑，但它的质量取决于它所基于的假设。仅仅因为你没有证明某事是真的，并不意味着它自动是错误的；仅仅因为你从未见过恐龙蛋，并不意味着它们不存在。也许它们生活在你从未去过的岛上，或者它们躲得太好，以至于没有人能它们。参见
    `这合逻辑`（下一节）。


