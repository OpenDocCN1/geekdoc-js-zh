    “廷克（Tinker）也是这么说的，但我不明白，”洛莉（Laurie）说，“在我出生的地方，抛硬币五五对开完全没问题。”


    “啊，但其中一面可能和另一面*稍微*不同，”特特（Trent）说，“所以它可能并不完全公平。”


    “真的吗？”


    “当然。如果你旋转硬币而不是抛掷它，不公平性会表现得更明显。我们测试所有的‘公平硬币（Fair Coins）’都是这么做的。”


    “所以我的硬币也没有价值了吗？”


    “不完全。我可以给你一个汇率：你的两枚硬币换一枚公平硬币。”


    “为什么二比一？”她问。


    “问得好！”特特说，“大多数人不知道这一点，但即使是最不公平的硬币，也能得到绝对公平的抛掷结果。”


    “我不相信你。”


    “来，我给你看。”特特从抽屉里拿出一枚大而沉重的硬币递给她。“这是一枚假的公平硬币。它看起来和真的一样，不是吗？但很容易看出它是假的，因为它出现正面的次数比出现反面的多得多。”


    “那么你如何得到公平的抛掷呢？”洛莉问。


    “只要抛两次。如果是正面-反面，就正面作为答案。如果是反面-正面，就反面作为答案。如果是正面-正面或反面-反面，就重新开始。”


    | H + T = 正面 |

    | T + H = 反面 |

    | H + H = 重新开始 |

    | T + T = 重新开始 |


    “噢，我明白了。不公平互相抵消了！”


    “你说得对。无论币有多不公平，先正面后反面的概率和先反面后正面总是*完全*一样。”


    特特·埃斯罗（Trent Escrow）严肃地用洛莉的五枚硬币和一枚幸运扑克币换了三枚公平硬币。


    “这就是为什么汇率是二比一。”


    “谢谢你！”洛莉冲到外面，在面包师关门之前赶上他。晚餐到了！


    # 第 12 章 不可能的转折


    ![image with no caption](img/079fig01.png.jpg)


    当洛莉跑出银行时，一个胖警察抓住了她的衣领。“抓到你了！”他说，“你跑着干什么？你也抢银行了吗？”


    “什么？你是谁？放开！”洛莉大道。


    “我是库斯迪警官（Officer Custody），而*你*有大麻烦了，”警察说，“劳伦·伊普萨姆（Lauren Ipsum），*如果*那是你的真名，我以多项指控逮捕你！”


    “什么指控？你在说什么？”


    “那不重要！”库斯迪在洛莉耳边大吼，用力摇晃她。“指控！”


    “噢！但是是*什么*指控？”洛莉重复道。警察抓她的力度让她痛苦。街上的人开始指指点点。如果洛莉真的什么时候希望自己能像盾龙（Steganosaurus）一样消失，那一定就是现在！”


    “你想硬吗？既然你坚持，那我们就按规矩办吧！”库斯迪拿出一卷纸，清了清嗓子。


    “劳伦·伊普萨姆，你现因企图实施神话罪、伪造公平硬币、*两项*冒充作曲家、三级黑客攻击以及意图猥琐的杂项猥琐行为被捕！”


    “放开我！你才是那个猥琐的！”洛莉试图挣脱，但他抓得太紧了。正这时，人群中传来一声叫声。


    “*嘿，库斯迪！你为什么要欺负小女孩？*”


    一个看起来很强悍的女人走上前对质警察。她穿着大靴，戴着黑色手套，还戴着一个心形的眼罩。


    “这不是女孩，洛斯索姆（Losesome）。这是一个危险的罪犯！她突破了我们的周界警戒，”库斯迪说。


    “你是说杰恩（Jane），门口那个小老太太？”女人问道。


    “赫卡特警官（Officer Hecate），没错！”


    “行了，库斯迪。杰恩并不好骗。上周我还告诉她是圣诞老人呢。”人群中传出了笑声。


    “那是……”


    “那该死的‘企图实施神话罪’是什么鬼？”女人打断道，“我觉得你只是瞎编的。”


    “什么？我——”


    “你怎么知道你找对人了？”


    “她符合描述！”库斯迪坚持道。


    “真的吗？在我看来她不像圣诞老人！”


    “*不*，”他说，“她符合今天下午进来的那个黑客的描述！”


    “所以你的意思是说，一个孩子就能穿过你们所有的超级安全措施？”女人怀疑地挑起了一边眉毛。


    ![image with no caption](img/081fig01.png.jpg)


    “额——”


    “不管如何，这个女孩是我的助手。”


    到此时，库斯迪彻底糊涂了。“这个小……她是在为*你*工作？”


    “当然了。她正在帮我测试这里的安保。而且如果一个*孩子*都能把你耍得团团转……”她摇了摇头。“只能这么说吧，这看起来不太妙。”


    “但你是——”


    女人没有说话。她只是笑了，露出一排牙齿。


    库斯迪突然满头大汗。他松开了洛莉，掏出一块手帕。


    “嘿，这只是个失误！我不知道她是为科——呃，为你工作的。”


    “现在你知道了。现在我们要走了。走吧，洛尔（Laurel）。”女人搂住洛莉的手臂，高昂着头走开了。


    “我们慢慢走，”女人低声说，“等转过街角，试着在库斯迪开始用脑子而不是嘴之前码头。”


    一离开库斯迪的视线，她们就跑了起来。


    “太棒了！但我的名字是洛莉，不是洛尔。”


    “差不多。我是温索姆·洛斯索姆（Winsome Losesome）。”


    “很高兴认识你！谢谢你帮我！我不是故意惹麻烦的。”


    “别客气。反正我也要离开这个城市。而且我很不喜欢那个家伙。他是个笨的霸凌者。”


    在码头，温索姆跳上了一艘船，开始准备出发。“快来！上上来，”她对洛莉喊道。


    “温索姆，这是谁的船？”


    “这是我的船，叫‘双身号（Doppelganger）’。帮我拿那根别的绳，好吗？”


    “哇，你怎么弄来一只船的？你是海盗吗？”


    “我身份很多，女孩，”温索姆说，“至于这只船，我某种程度上是偷来的。但我偷得很诚实！”


    “你怎么能*诚实地*偷东西？”洛莉担心自己又陷入了更大的麻烦中。


    “我以前是这只船的甲板员，”她说，“老板总是让我做所有的脏活。‘洛斯索姆，换掉主桅！’他会说，‘逆时针方向装上新的索具！’”


    温索姆展开了帆。


    “但我私下留下了所有我换下的旧零件。它们反正都要进垃圾堆，不如留着对吧？一旦我收集了足够的零件，我就辞职了，然后把它们重新组装了一只船。老板并没有发现！他有的那只船全是替换件。一个复制品。我有*真正的*那只。”


    “但是——”洛莉开始说。


    “以后再说，宝贝？我们正忙着逃法呢。”


    温索姆说的对。洛莉解开绳子，他们驶入了无月的夜色。


    # 第 13 章 生命游戏


    ![image with no caption](img/085fig01.png.jpg)


    “双身号”驶出了概率湾（Probability Bay），远离了洛莉的烦恼。她冒险从船侧看去，发现了一个美丽的惊喜。


    “温索姆！看那个！”


    在船迹中，发光的闪光点亮了水面。蓝色和绿色的卷曲在身后跳舞。


    “噢，是的。那些被称为滑翔（gliders）。漂亮吧？”


    “它们太美了！是什么让它们发光的？”洛莉问。


    “当你搅动水时，它们就会发光并形成图案。只有在像这样的夜晚才能看到它们。”


    “哇！我从未见过这种东西！”


    “想看*真的*酷的东西吗？”温索姆把一个浅盘放入水里，放在长凳上。等水平静下来，她在水里勾勒了一个小小的图形。


    ![image with no caption](img/086fig01.png.jpg)


    发光点活了过来，在盘里扭动了几次，然后消失了。


    “它们怎么那样移动？”洛莉问，“它们真的是活的吗？”


    “我不认为是。那只是一个看起来像活的图案。应该有一些关于光点如何移动的规则，但我从未在意。也许你可以研究一下。”


    温索姆回去操纵舵轮。洛莉忙着制作更多的滑翔、漂亮的波浪和卷曲。克斯（Xor）试图咬住那些游过的发光波纹，但他只咬到了一嘴水。


