    “Who is he?” Laurie asked.


    “He’s my—he was my boss,” said Winsome. “This was his mail boat. Until I copied
    it. We . . . disagree about how to do business, so I struck out on my own.”


    “You had a fight with him?”


    “Well, yes,” Winsome said.


    “What did you fight about?”


    “He wants things to stay just the way they are. I . . . don’t.”


    “Oh,” said Laurie. Something about Winsome’s voice told Laurie not to ask her
    more about the fight. They were quiet for a time, watching the sky and water.


    “The Colonel’s right about one thing,” Winsome said softly.


    “What’s that?”


    “A map is just a picture. It’s not the real thing. If someone forgets to put Abstract
    Island on a map, the Island still exists. It doesn’t care what you know.”


    “No one in Userland said anything about islands,” Laurie said.


    “The people back there don’t know much about the world outside. That’s the way
    the Colonel likes it. Userland is an island. It’s a whole world of islands.”


    Laurie didn’t like what she was hearing. “But Winsome, I have to follow my map
    to get back home.”


    “Do you?”


    “Yes!”


    “Why?”


    “That’s what everyone told me to do,” Laurie said.


    “That’s not a good enough reason,” Winsome said.


    “It isn’t?” People told Laurie what to do all the time. She didn’t always do what
    they said, of course, but she usually felt bad about it.


    “No! You should always know `why` you are doing something,” said Winsome, “and
    not just because someone told you to do it. Keep your head on and be flexible,
    girl. Otherwise, you’re like those little gliders, going wherever people send
    you.”


    “But Tinker said—”


    “Forget Tinker for a minute,” Winsome said. “How did you get lost in the first
    place?”


    “I had a fight with my mom,” Laurie said. “Mom wants me to go to school over the
    summer, but I don’t even need to!”


    “Maybe summer school is a good thing. I heard that kids in other countries—”


    “I don’t care! I don’t want to waste the whole summer in school with people I
    don’t even know!”


    “Okay, that’s fair. So then what happened?”


    “I took a walk in the woods to calm down a little, but I was so mad that I forgot
    to watch where I was going, and I got lost, and I spent a long time walking in
    circles,” said Laurie, her eyes filling with tears. “Then I was attacked by those
    Jargon things, and I ran and ran until I came here, but then I made a Jargon myself
    because I didn’t know the rules, and no one here has even heard of Hamilton, or
    dollars, or anything! And I don’t understand why I need a password, and now I’m
    going to an island that’s not even on the map and—”


    “Hey, slow down—” Winsome said.


    “—now I’m lost all over again and . . . and . . . ” Laurie started sobbing.


    “Wait, don’t, oh man . . .”


    Winsome knew how to handle the nastiest people you’d never want to meet, but a
    crying girl was something else. She gave Laurie an awkward hug until the noise
    stopped.


    “You done?”


    “Yeah.” Laurie sniffled.


    “Good. I thought you were going to sink the boat,” said Winsome. “Why don’t you
    go below and get some rest? And think about something before you fall asleep.”


    “Think about what?”


    “Making your own map.”


