    # 第二章. 理性与常识


    ![image with no caption](img/015fig01.png.jpg)


    洛莉和索尔很快到达了巴赫（Bach）小镇。起初这让人很困惑，因为“巴赫”这个名字到处都是：`Bach Street`、`Bach Avenue`、`Bach
    Plaza`——甚至人行道都被标记为 `sidebach`。他们终于在 `Bach Way` 找到了 `Bach Haus`（巴赫豪）。


    洛莉敲了敲那扇巨大的正门。一位留留着卷曲白发、穿着优雅大衣的高个来开门。“你好，有什么我能帮你的吗？”她问。


    “你是同名标识巴赫（Eponymous Bach）吗？我是洛莉。有人告诉我你可以帮我。”


    “如果我不能解决你的问题，我至少可以给它起个名字。进来吧，喝点茶。”


    房子外面看起来很惊人，但里面却一团糟！奇怪的机器挤在墙角，蜘蛛网从角落垂下，工具散落在地板上，到处是成堆写满笔记的纸张。一把小提琴被塞在一个花盆里。索尔从洛莉的口袋里跳出来去捕捉一些昆虫。


    ![image with no caption](img/016fig01.png.jpg)


    “呃，所以你是一个作曲家？”洛莉问。


    “没错，”同名标识说。


    “你创作什么类型的音乐？”


    “噢，我不创作音乐，”同名标识说，“我创作的是**想法**！”


    “你创作……想法？怎么做？”


    “我把小小的想法组合在一起变成更大的想法。然后我把*那些*想法组合在一起，变成越来越大的！然后我在上面签上我的名字。你不应该让任何想法在没有名字的情况下溜走，”她说，“这就是‘巴赫命名第一法则’。你看，这是我自己制定的。”


    “这就是为什么所有的街道都用你的名字命名的吗？”洛莉问。


    “是的，我以前确实把名字写在‘东西’上。但把名字写在‘想法’上要好得多。这是我的‘命名第二法则’。”


    “但为什么想法更好呢？”洛莉问，“你看不见想法。”


    “因为好的想法永远不会磨损！你把名字写在生日蛋糕上，但它坚持不了多久，不是吗？”


    “不。你马上就把它吃掉了，”洛莉说。生日蛋糕根本存不了多久！


    “你也可以把名字刻在山上，”同名标识说，“但即使是山最终也会倒塌。而且声音非常难听！不，让某物永存最好的方法是去掉除了想法以外的一切。”她指向一幅留着卷发、穿着奇怪大衣的人肖像。“看那里，”她说。


    “那是我的朋友安迪·安培（Andy Ampère）。有一天，他注意到当电流通过两根电线时，它们会向彼此稍微弯曲。于是他将其称为‘安迪的魔法弯线器’，然后到处卖给那些制作回形针的人。”


    “那挺酷的！”洛莉说。


    “是的，但我告诉安迪继续下去，去掉所有的‘东西’，直到他拥有一个值得签上名字的想法。他意识到自己可以使用他的机器通过观察电线弯曲的程度来测量电。那真的是一种发现——一条新的自然法则。现在已经没有人使用安迪的魔法弯线器了，但安培定律将永远‘流行’（current）。”


    “但你为什么要给每样东西都签上你的名字？”


    “名字非常重要！没有名字的东西就像没有把手的罐子。试着讲一个关于乌龟的故事但不要使用 `turtle` 这个词。”


    “这个嘛，”洛莉总是准备好辩论某个观点，“你可以说`一种长着壳的绿色圆形动物`来代替 `turtle`。”


    “哼，”同名标识哼了一声鼻鼻，“那可不是一个很好记的名字，但我想可以接受的。那么，孩子，我能怎么帮你呢？”


    “我正在寻找一条回哈密尔顿的路。流浪推销员说我只需要去我以前没去过的地方，最终就能找到家的路。但是……”


    “怎么了，孩子？”


    “我不知道，他说的话里有些不合逻辑。”


    “它可能*合得通*（sense），但可能并不*符合常识*（sensible），”同名标识说。


    “这两者不是一回事吗？”洛莉问。


    “很多事情合得通，但完全不符合常识！你可以穿过房子从前门走到后门，对吧？”


    “当然。”


    “你也可以绕房子外面走，甚至绕整个星球走来实现同样的事。很多方法都合得通，但只有部分是符合常识的。”


    “我想找一个符合常识的方法，”洛莉说，“我不想绕整个地球走！”


    “所以，”同名标识说，“我们已经为你的问题命名并定了框架：洛莉的任务是找到回家的最短路径。”


    “但我该怎么做呢？”洛莉问，“难吗？”


    “你不尝试一下就永远不知道。路上的下一个镇子叫符号（Symbol）。你以前去过那里吗？”


    “没有，我甚至没听说过。”


    “那听起来很完美。顺着 `Bach Avenue` 离开小镇，在 `Recursion Junction` 处左转。”


