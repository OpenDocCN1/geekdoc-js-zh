- fmt: "\n“They are all around you. Every path forks off from another path,” Tortoise\
    \ said. “One path becomes 2, 2 becomes 4, then 8, 16, and so on. After 24 forkings,\
    \ there are over 16 million different paths.”\n\n“Oh! It’s the Power of Two again.\
    \ But this time it gets bigger instead of smaller,” Laurie said.\n\n“Exactly right.\
    \ You are currently on the path to Things that are Familiar, Old, Interesting,\
    \ Mostly Lost, Bigger Than You, and Smaller Than a Mountain,” said Tortoise. “I\
    \ suppose I am one of them.”\n\n“So how do I choose which forks to take?”\n\n\
    “I suggest choosing wisely. Good day, Miss Ipsum.” Tortoise turned and walked\
    \ slowly and steadily down the left-hand path.\n\n“Wait! I don’t know what you\
    \ mean!” Laurie ran after him. Catching up with a Tortoise should have been easy.\
    \ But with every step he got farther and farther away. By the time Laurie got\
    \ to the next fork, he was nowhere to be seen.\n\n> ![](figs/web/common-01.png.jpg)`FRIENDLY\
    \ | UNFRIENDLY`![](figs/web/common-02.png.jpg)\n\n“What do you think, Xor? Which\
    \ way?”\n\n“Do you really want to see a Garden full of Unfriendly Things?”\n\n\
    “Good point.” She went left.\n\n> ![](figs/web/common-01.png.jpg)`IN THE AIR |\
    \ ON THE GROUND`![](figs/web/common-02.png.jpg)\n\nThey didn’t want to see anything\
    \ bigger than them that also could fly, no matter how Friendly. Anyway, Tortoise\
    \ was on the ground.\n\n> ![](figs/web/common-01.png.jpg)`LIGHT | HEAVY`![](figs/web/common-02.png.jpg)\n\
    \n“Heavy for sure!” shouted Xor.\n\n> ![](figs/web/common-01.png.jpg)`LIVES OUTSIDE\
    \ | LIVES INSIDE`![](figs/web/common-02.png.jpg)\n\n“Tortoises live outside, don’t\
    \ they?” Now that she thought about it, Laurie wasn’t completely sure. But it\
    \ seemed like a good guess!\n\n> ![](figs/web/common-01.png.jpg)`NEVER SLEEPS\
    \ | SOMETIMES SLEEPS`![](figs/web/common-02.png.jpg)\n\n“And they definitely sleep,”\
    \ said Xor. Right they went.\n\n> ![](figs/web/common-01.png.jpg)`SLEEPS AT NIGHT\
    \ | SLEEPS DURING THE DAY`![](figs/web/common-02.png.jpg)\n\n“Sleeps at Night!”\
    \ Laurie shouted. “We should be getting close!”\n\n> ![](figs/web/common-01.png.jpg)`MANY\
    \ COLORS | ONE COLOR`![](figs/web/common-02.png.jpg)\n\nLaurie ran down the left-hand\
    \ path without stopping to think. But wasn’t Tortoise only one color? It was too\
    \ late to go back.\n\n> ![](figs/web/common-01.png.jpg)`QUIET | NOISY`![](figs/web/common-02.png.jpg)\n\
    \n“I don’t like Noisy Things,” she said. “Tortoise is pretty quiet.”\n\n> ![](figs/web/common-01.png.jpg)`PLURAL\
    \ | SINGULAR`![](figs/web/common-02.png.jpg)\n\n“What does that mean?” “Plural`\
    \ means more than one. `Singular` means only one,” Xor said. They went right.\n\
    \n> ![](figs/web/common-01.png.jpg)`NATIVE | FOREIGN`![](figs/web/common-02.png.jpg)\n\
    \n“I know this one,” said Laurie. “Native` means from here. `Foreign` means from\
    \ somewhere else. Native!”\n\n> ![](figs/web/common-01.png.jpg)`EXPECTED | UNEXPECTED`![](figs/web/common-02.png.jpg)\n\
    \n“I wonder where we’ll end up,” she said as they turned right. “What is Familiar,\
    \ Old, Interesting, Mostly Lost, Bigger Than Me but Smaller Than a Mountain and\
    \ Shorter Than a Lighthouse, Friendly, On the Ground, Heavy, Lives Outside, Sleeps\
    \ at Night—” (she paused to breathe) “—has Many Colors and is Quiet, Singular,\
    \ Native, *and* Unexpected?”\n\n> ![](figs/web/common-01.png.jpg)`YOUR WISH |\
    \ SOMEONE ELSE’S WISH`![](figs/web/common-02.png.jpg)\n\n“MY wish!” said Xor and\
    \ Laurie at the same time. They giggled and walked down the left path. The next\
    \ sign made them think for a moment. It asked\n\n> **ARE YOU SURE?**\n\n> \n\n\
    > ![](figs/web/common-01.png.jpg)`YES | NO`![](figs/web/common-02.png.jpg)\n\n\
    “Sure, I’m sure!” said Laurie. “Why would I ever want someone else’s wish?” She\
    \ went down the left-hand path. “I think we’re almost through the Garden, Xor!”\n\
    \nShe started walking fast, then jogging, then running again down the long green\
    \ hallway. Xor was getting excited too, turning all sorts of polka-dot colors.\
    \ Laurie was already thinking about what messages she wanted to send to Fresnel,\
    \ and Tinker, and—\n\n“Oh no!”\n\nLaurie stopped dead in her tracks. In front\
    \ of them was another forking. The last one.\n\nThe left-hand sign said\n\n> ![](figs/web/common-01.png.jpg)`HAMILTON\
    \ (LAURIE’S WISH)`\n\nAnd the right-hand sign said\n\n> **AUNT VANA (XOR’S WISH)**![](figs/web/common-02.png.jpg)\n\
    \n“The Garden guessed my wish!” Laurie said.\n\n“Mine, too,” Xor said.\n\nLaurie\
    \ started to go left, then stopped. Then she started to go right, but had second\
    \ thoughts. They stood there for a very long and very silent minute.\n\n“We can\
    \ only take one path,” said the girl.\n\n“Yeah,” the lizard replied.\n\n“And there’s\
    \ no going back.”\n\n“That’s the rule.”\n\n“You really want to find your aunt,”\
    \ Laurie said.\n\n“And you really want to go back home,” Xor sighed.\n\n“That\
    \ means we have to choose,” Laurie said. “But how?” She did want to go home, but\
    \ she also wanted Xor to find Aunt Vana. She wanted to bring Xor and Vana home\
    \ with her and how cool would that be and—\n\n“No, Laurie,” Xor said sadly. “It\
    \ means we have to split up.”\n\n“But—”\n\n“Only One Visitor Per Path. That’s\
    \ the rule.” He jumped off her shoulder and landed on the right-hand sign. “I\
    \ guess . . . this is how you found me.” His skin turned orange and purple.\n\n\
    “We can do this,” said Laurie, thinking furiously. “Once you find your Aunt Vana,\
    \ take her to the Treelighthouse. I’ll find a way to come back. Or maybe I’ll\
    \ get a telescope and a big light and—”\n\n“We’ll see each other again,” Xor said.\n\
    \n“Okay,” said Laurie. “Promise?”\n\n“Promise.”\n\n“And I’m going to whistle,\
    \ okay?”\n\n“Okay.”\n\n“So you can hear me.”\n\n“Right,” said Xor.\n\n“It’ll be\
    \ fine.”\n\n“Absolutely,” agreed Xor.\n\n“Here I go.”\n\n“Me too.”\n\nLaurie did\
    \ try to whistle, but it’s impossible to whistle and cry at the same time. Just\
    \ try it.\n\n# Chapter 20. Fin\n\n![image with no caption](figs/web/147fig01.png.jpg)\n\
    \nThe mandelbroccoli bushes got shorter and wilder until they blended in with\
    \ the forest. By now it was late afternoon and the shadows were getting longer.\
    \ The trees of the forest were large oaks and maple, with an occasional pine or\
    \ spruce. There were a number of saplings and bushes of various sorts. It was\
    \ hard to see far because of all the leaves, but walking was easy enough if she\
    \ skirted the spruce.\n\n“*Chirp!*\n\nLaurie’s heart started pounding. More Jargon?\
    \ How many? Where?\n\n“*Chirp!*\n\nNo running this time. She walked toward the\
    \ noise as quietly as she could. It seemed to be behind a large tree. No, not\
    \ Jargon. It was . . a squirrel. It yelled what were probably nasty things in\
    \ Squirrel, then ran up the tree to safety. And that tree! She recognized it.\
    \ It was the big tree behind her house, at the edge of the woods . .\n\nLaurie\
    \ was home.\n\n* * *\n\nLying in her own bed after a hot bath made Laurie feel\
    \ happy and tired. As far as her mother knew, Laurie had been gone only an hour\
    \ or two. To Laurie, though, it felt like at least a week since she’d gotten lost\
    \ in the woods. She was too sleepy to think about it. She hoped Xor had gotten\
    \ his wish and was learning how to blend in. She was sad that she didn’t get to\
    \ see her new friends again. She promised to come back . . after delivering .\
    \ . that letter . .\n\nTwo seconds later, she was out of bed and tearing open\
    \ the plain white envelope.\n\n> **Hi, kiddo. If you’re reading this letter, you’ve\
    \ figured out who it was for. I wasn’t sure the Garden would actually work, and\
    \ I don’t like good-byes.**\n\n> **You helped us build the Network. We couldn’t\
    \ have done it without you. Fresnel says once you learn a few things and unlearn\
    \ some others, you’ll make a good Composer.**\n\n> \n\n> **See you around,**\n\
    \n> \n\n> **capt. Winsome “Losesome” Trapp**\n"
