    “Tinker said the same thing, but I don’t understand,” said Laurie. “Where I come
    from, you can flip quarters fifty-fifty, no problem.”


    “Ah, but one side might be a *little* different from the other,” Trent said, “so
    it might not be exactly even.”


    “Really?”


    “Surely. The unfairness shows up better if you spin the coin instead of flipping
    it. That’s how we test all of our Fair Coins.”


    “So my coins are worthless too?”


    “Not quite. I can give you an exchange rate: two of your coins for one Fair Coin.”


    “Why two to one?” she asked.


    “Good question!” Trent said. “Most people don’t know this, but it’s possible to
    get absolutely Fair flips out of even the most unfair coin.”


    “I don’t believe you.”


    “Here, let me show you.” Trent reached into his drawer and handed her a large,
    heavy coin. “This is a fake Fair Coin. It looks just like a real one, doesn’t
    it? But it’s easy to tell it’s fake because it comes up Heads a lot more than
    Tails.”


    “So how do you get a fair flip?” Laurie asked?


    “Just flip it twice. If you get Heads-Tails, use Heads as your answer. If it comes
    up Tails-Heads, use Tails as your answer. If you get Heads-Heads or Tails-Tails,
    just start over.”


    | H + T = Heads |

    | T + H = Tails |

    | H + H = Start over |

    | T + T = Start over |


    “Oh, I see. The unfairness cancels itself out!”


    “Right you are. No matter how unfair a coin is, the odds of getting Heads then
    Tails will always be *exactly* the same as getting Tails then Heads.”


    Trent Escrow solemnly exchanged Laurie’s five coins and lucky poker chip for three
    Fair Coins.


    “And that’s why the rate is two to one.”


    “Thank you!” Laurie rushed outside to catch the baker before he closed. Dinner!


    # Chapter 12. An Improbable Twist


    ![image with no caption](figs/web/079fig01.png.jpg)


    As Laurie ran out of the bank, a fat policeman grabbed her by the collar. “Got
    you!” he said. “Why are you running? Did you rob the bank, too?”


    “What? Who are you? Let me go!” Laurie yelled.


    “I’m Officer Custody, and *you* are in big trouble,” the policeman said. “Lauren
    Ipsum, *if* that is your real name, I arrest you on charges!”


    “What charges? What are you talking about?”


    “That doesn’t matter!” Custody shouted in Laurie’s ear, shaking her around. “Charges!”


    “Ow! But *what* charges?” Laurie repeated. The officer’s hold on her was painful.
    People on the street were starting to point and stare. If there ever were a time
    Laurie wished she could disappear like a Steganosaurus, it was now!


    “You’re going to be difficult? Let’s do it nice and proper, if you insist!” Custody
    took out a roll of paper and cleared his throat.


    “Lauren Ipsum, you are hereby under arrest for Attempted Mythology, Counterfeiting
    Fair Coins, *two* counts of Impersonating a Composer, Hacking in the Third Degree,
    and Miscellaneous Mopery with Intent to Creep!”


    “Let me go! You’re the creep!” Laurie tried to twist away, but his grip was too
    strong. Just then, a shout rang out from the crowd.


    “*Hey, Custody! Why are you beating up on little girls?*”


    A tough-looking woman stepped forward to confront the policeman. She wore big
    boots, black gloves, and an eyepatch in the shape of a heart.


    “This isn’t a girl, Losesome. This is a dangerous criminal! She broke through
    our perimeter security,” Custody said.


    “You mean Jane, that little old lady at the gate?” the woman asked.


    “Officer Hecate, yes!”


    “Come on, Custody. Jane isn’t hard to fool. Last week I told her I was Santa Claus.”
    People in the crowd chuckled.


    “That’s beside—”


    “And what the heck is ‘Attempted Mythology’?” the woman interrupted. “I think
    you just made that up.”


    “What? I—”


    “How do you even know you have the right person?”


    “She matches the description!” Custody insisted.


    “Really? She doesn’t look like Santa Claus to me!”


    “*No*,” he said. “She matches the description of the hacker who came through this
    afternoon!”


    “So you are saying a child was able to get through all of your super-duper security?”
    the woman said, arching an eyebrow skeptically.


    ![image with no caption](figs/web/081fig01.png.jpg)


    “Well—”


    “Anyway, this girl is my assistant.”


    By now Custody was thoroughly confused. “This little . . . she works for *you*?”


    “Of course. She’s helping me test the security of this place. And if a *child*
    can run circles around you . . .” She shook her head. “Let’s just say, it doesn’t
    look good.”


    “But you’re—”


    the woman said nothing. She only smiled, showing a lot of teeth.


    Custody was suddenly sweating. He let go of Laurie and pulled out a handkerchief.


    “Hey, now, it was an honest mistake! I didn’t know she worked for the Col—um,
    you.”


    “Well, now you do. And now we’re leaving. Come on, Laurel.” The woman took Laurie
    by the arm and walked away, head held high.


    “Let’s just walk away slowly,” the woman whispered. “When we turn the corner,
    try to make it to the marina before Custody starts using his brain instead of
    his mouth.”


    As soon as they were out of Custody’s sight, they broke into a run.


    “That was great! But my name is Laurie, not Laurel.”


    “Close enough. I’m Winsome Losesome.”


    “It’s nice to meet you! Thank you for helping me! I didn’t mean to cause trouble.”


    “Don’t mention it. I was leaving town anyway. And I really don’t like that guy.
    He’s a dumb bully.”


    At the marina, Winsome jumped aboard a boat and went to work getting it ready
    to depart. “Come on! Hop on,” she called to Laurie.


    “Whose boat is this, Winsome?”


    “It’s my boat, the *Doppelganger*. Get that other rope for me, would you?”


    “Wow, how did you get a boat? Are you a pirate?”


    “I’m a lot of things, girl.” Winsome said. “As for the boat, I kind of stole it.
    But I stole it honestly!”


    “How can you steal something *honestly*?” Laurie was afraid that she was getting
    into even more trouble.


    “I used to be a deckhand on this boat,” she said. “The Boss made me do all of
    the dirty work. ‘Losesome, replace the main mast!’ he’d say. ‘Put a new rigger
    on the widdershins!’”


    Winsome unfurled the sail.


    “But secretly, I was saving all the old parts I replaced. They were going to the
    trash anyway, so might as well keep them, right? Once I collected enough pieces,
    I quit, and then I put them back together into a boat. Boss never found out, either!
    The boat he has is all replacement parts. A copy. I have the *real* one.”


    “But—” Laurie began.


    “Think about it later, sweetie? We’re busy running from the Law.”


    Winsome had a point. Laurie untied the rope, and they cast off into the moonless
    night.


    # Chapter 13. The Game of Life


    ![image with no caption](figs/web/085fig01.png.jpg)


    The *Doppelganger* sailed out of Probability Bay and far away from Laurie’s troubles.
    She risked a peek over the side of the boat and caught a beautiful surprise.


    “Winsome! Look at that!”


    In the wake of the boat, glowing sparkles lit up the water. Blue and green curlicues
    danced behind them.


    “Oh, yeah. Those are called gliders. Pretty, aren’t they?”


    “They’re beautiful! What makes them glow?” Laurie asked.


    “When you stir up the water, they glow and form patterns. You can only see them
    on a dark night like this.”


    “Wow! I’ve never seen anything like this!”


    “Want to see something *really* cool?” Wins dipped a shallow pan into the water
    and set it on a bench. After it settled down, she traced a little figure in the
    water.


    ![image with no caption](figs/web/086fig01.png.jpg)


    The glowing dots came alive and wiggled around the pan a few times before fading
    away.


    “How do they move like that?” Laurie asked. “Are they really alive?”


    “I don’t think so. It’s just a pattern that looks alive. There are supposed to
    be some rules about how the glow moves around, but I never paid attention. Maybe
    you can figure it out.”


    Winsome went back to minding the ship’s wheel. Laurie played with making more
    gliders, pretty waves, and curls. Xor tried to bite the glowing squiggles as they
    wriggled by, but all he caught was a mouthful of water.

