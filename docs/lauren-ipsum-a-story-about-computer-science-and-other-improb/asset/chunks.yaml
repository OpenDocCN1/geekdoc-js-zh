    She read it twice before she noticed that Winsome’s last name was Trapp. It made
    sense. For all of the sour things Winsome had said about Colonel Trapp, they were
    a lot alike, sending strange messages and bossing people around. It looked like
    Laurie wasn’t the only one who had trouble getting along with her parents.


    She lay down again and thought about tomorrow. Tomorrow was the first day of summer
    school. It didn’t sound as scary as it did before. If she could navigate the `Byzantine
    Process`, beat `Ponens` and `Tollens`, make infinite strings, and teach turtles
    to build towers, sitting in a classroom didn’t sound that hard at all.


    She might even learn something interesting.


    *The End*


    # Chapter 21. One More Thing


    ![image with no caption](figs/web/151fig01.png.jpg)


    It was a dark and foggy night, many months after Lauren Ipsum had gone back home
    to Hamilton. A lighthouse flashed. Flashed. Flashed. Flashed.


    The flashes didn’t carry any messages this night. The fog was too thick to send
    signals, so the `Network` was down. The powerful lights were needed for their
    original purpose: to warn boats away from dangerous rocks.


    As it happened, only one boat was around, and it didn’t need warning. It was exactly
    where it was supposed to be.


    The `Jargonaut` was the boat, and Kevin Kelvin was its captain. The boat was large
    and flat and plain. Near the front was a little cabin where Kelvin lived. The
    rest of the deck was taken up by a crane and a winch—a machine built to wind wire
    in or out. A wire led from the crane and into the water, looking like a large
    fishing pole. Belowdecks was mostly a hold for tons and tons of coiled wire.


    It wouldn’t be accurate to say that the `Jargonaut` was a gigantic boat with a
    winch attached to it. That might give you the wrong impression. It would be better
    to describe it as a gigantic `winch` with a boat attached to it. Its entire purpose
    in life was to play out and wind up miles of heavy wire.


    Inside the cabin, Kevin Kelvin rubbed his hands together to keep them warm. A
    thermometer hung from a peg near the door. It read a chilly 273. *Brrrrr!* Now,
    273 degrees might sound pretty hot to you and me, but this thermometer didn’t
    measure in degrees Fahrenheit or Celsius. It was on the `Kelvin Scale`, one of
    the captain’s many inventions. The `Kelvin Scale` starts at `Absolute Zero`, the
    coldest that any cold thing can possibly get. And 273 Kelvin isn’t much better.
    It’s about the temperature of an ice cube. *Brrrrr!*


    The thermometer said a lot about the kind of person Kevin Kelvin was. He was a
    `Composer`, and a wickedly smart one. He never let a good idea escape without
    putting his name on it.


    ![image with no caption](figs/web/152fig01.png.jpg)


    When people asked Kelvin what he was doing, he would say he was fishing. He never
    explained what he was fishing *for*, in the middle of the night with a gigantic
    winch that had a boat attached to it. When people made jokes about catching sea
    monsters, Kelvin only smiled. No one knew what he knew. How could they?


    Kevin Kelvin was fishing for teeny-tiny bits of electricity flowing up his `Wire`.
    The `Wire` traveled under the ocean for miles, all the way to a little building
    on the shore, not far from the lighthouse. He twiddled dials, and listened carefully
    to a nearby speaker connected to the `Wire`, and made notes. If his ideas were
    right, any moment now he should hear a signal from his assistant on the other
    end. It would sound like—


    > BEEP.


    His skin tingled with excitement, but he didn’t dare make a sound.


    > BLOOP. BEEP.


    Kelvin quickly disconnected some wires and connected some other ones. He flicked
    a switch on and off.


    > FLIP. FLOP. FLIP.


    The `Wire` answered back.


    > BLOOP.


    The `Wire` worked! Just as Kelvin thought: he could send messages using electricity,
    even under miles of seawater. If the `Jargonaut` laid down a `Wire` all the way
    between two islands, that would form the first link in Kelvin’s very own `Network`.
    A `Network` that could send messages all the time, even on a terrible night like
    this. A `Network` that, someday, could even have `multiple Wires`.


    Those fools up there in their ivory towers, flashing their little lights, will
    never know what hit them!


    # The Field Guide to Userland


    ![image with no caption](figs/web/155fig01.png.jpg)


    You might have wondered whether this or that part of the story is real. Can you
    really make a `Fair Coin` out of an `Unfair Coin`? Can you really use ants to
    find shorter paths? Yes, you can do both—and a lot more besides. In this guide,
    you’ll find out how some of the places, people, and things Laurie encounters in
    Userland connect with our own world.


    # Chapter 0: Mostly Lost


    ## jargon


    In the real world, jargon doesn’t look like a mouse-dog, or even a dog-mouse;
    it looks just like an ordinary word! Computer scientists (and really, all scientists)
    love inventing new words. We call these specialized words `jargon` or `argot`.
    Jargon can be good, because it saves time when you’re discussing things with your
    colleagues. It can also be bad, because it excludes nonexperts from the conversation.


    When you’re just starting out with programming, all the jargon, argot, and weird
    new words can be intimidating, but don’t let that stop you from learning. Jargon
    can be silly, or powerful, or dangerous, depending on how you use it. But no matter
    what words you use, if you always `obfuscate` instead of `explicate`, no one will
    understand you!


    ## wandering salesman


    The `Traveling Salesman problem` is a classic computer science question. Given
    a group of cities, your goal is to find the shortest `Hamiltonian path`, a route
    that lets you visit each city only once. If you have a large number of cities,
    it would take a very long time to calculate that path, even for a computer. So
    the Wandering Salesman might be on the road for quite a while!


    Instead of calculating the exact answer, the salesman looks for a path through
    all the towns that’s `close enough` to being the shortest. A very interesting
    aspect of the Traveling Salesman problem is that humans are pretty good at solving
    small examples by hand. There is much discussion about what algorithm people use
    in their heads while solving it. See also `Hugh Rustic` (`[Chapter 8](#ch09.html
    "Chapter 8. More Than One Way to Do It")`); `[Chapter 8: More Than One Way to
    Do It](#pr03.html_chapter_8_more_than_one_way_to_do_it "Chapter 8: More Than One
    Way to Do It")`).


    ![image with no caption](figs/web/156fig01.png.jpg)


    ## the upper and lower bounds


    In Userland, the `Upper Bounds` are a mountain range, as tall as anything can
    be. The `Lower Bounds` are valleys as low and deep as anything can be. Nothing
    can be higher and nothing can be lower than these two bounds.


    In the real world, finding an upper and lower limit on a problem can simplify
    things a lot. Say you have to guess a person’s age. It’s unlikely that anyone
    is over 150 years old, and no one can be younger than 0 years old. So, 150 is
    the `upper limit` and 0 is the `lower limit`. You can narrow down the bounds even
    more with simple questions. Is the person still in school? If so, then he is probably
    younger than 30. Can the person drive a car? If so, then he is probably older
    than 15.


    ## mile zero


    You sometimes see signs that mark a point on a highway, like “Mile 14.” Now, if
    there is a Mile 14, then there must be a Mile 13, and a Mile 12, and so on. Everything
    has to start somewhere, and Zero is where it starts. Possibly the most famous
    Mile Zero is in Key West, Florida. It’s at the beginning of US Route 1, which
    goes all the way to Canada. If you look carefully and are very lucky, you might
    find a Mile Zero near where you live.


