    Ping 放下 Laurie 递来的沉重包裹，打开了锁扣。里面是一台矮矮的望远镜。“太棒了！我一直在等这个。”


    ![一张没有标题的图片](img/133fig01.png.jpg)


    “这是给网络的，对吧？你会教我它是怎么运作的吗？”Laurie 问。


    “当然可以，”Ping 说，“看着瞧。”她走到房间中央，转动一个巨大的轮子，直到一个红色箭头直接指向优雅岛。然后她快速地上下拉动杠杆：


    > FLOP. FLOP. FLIP. FLOP. FLIP.

    > FLOP. FLIP. FLIP. FLOP. FLOP.


    “现在再看一次菲涅尔，”她说。


    Laurie 把眼睛贴在优雅岛的望远镜上。菲涅尔将光线对准他们，开始闪烁着一条信息：


    > FLOOSH. FLOOSH. FLASH. FLOOSH. FLASH.

    > FLOOSH. FLASH. FLASH. FLOOSH. FLOOSH.


    “他回信了！他说了什么？”Laurie 问。


    “噢，他只是说了‘嗨’。”


    “就为了一个‘嗨’费了这么多？”


    “这就是波多特码的工作方式，”Ping 说，“句子由单词组成，而单词由字母组成，对吧？同样，我们用 FLIP 和 FLOP 组成字母。像这样。”


    > 01001 = L

    > 11000 = A

    > 10011 = U

    > 01010 = R

    > 01100 = I

    > 10000 = E


    “这真酷！但我还是觉得光是说个‘嗨’就太费劲了，”Laurie 说。


    “也许你是对的，”Ping 微笑着，“但现在构建网络的艰苦工作已经完成了，我们可以做一些真正有趣的事情：利用网络让它变得更好。”


    “怎么做？”


    “嗯，我正在研究一种使用两种颜色光的方法。菲涅尔有一个更简单的代码的想法，只需要四个 FLIP 或 FLOP，不过我不太确定那将如何运作。我们使用旧的波多特码来交流我们对新代码的想法，然后尝试它们。”


    “所以……你可以利用网络来讨论如何使用网络？”


    “Laurie，你通过递送所有那些望远镜让这一切成为了可能。现在，随着我们学习如何使用它，网络只会越来越好。我们已经可以在几分钟内将信息从网络的一端传到另一端！即使分身邮寄那么远的邮件也需要几天时间。一旦我们修复了漏洞，大家都会想用它的。”


    “但是……Winsome 呢？她会失去工作吗？”Laurie 问。


    “什么？不，完全不会！网络是她的主意。”


    “是吗？”


    “当然！我们所有人都在为 Winsome 工作。她不想整天搬着邮件袋到处跑。说起来了，”Ping 在堆纸中找着，“Winsome 说她还有最后一个任务给你。”


    “噢！是什么？”Laurie 问。


    “她想让你把这封信交给分叉路花园另一边的人。”


    信封上没有名字，但这比起 Laurie 在分身期间接到的某些任务并不算不上奇怪。如果她能快点完成，就可以回到这里玩网络了。“那我该怎么去花园？”


    “你很急，是吧？我来告诉你它在哪里。”


    # 第 19 章 分支延伸


    ![一张没有标题的图片](img/137fig01.png.jpg)


    花园被至少八英尺高的树篱围着。入口是一个从灌丛中切出的拱门。入口上方的木牌写着：


    > **欢迎来到分叉路花园。**


    “到了这里，”Ping 说。


    Laurie 突然非常担心。“Ping，这是一个迷宫……迷宫……那种花园迷宫吗？”Laurie 读过关于小女孩和花园迷宫的故事，那些故事从没有太好的结局。花园迷宫充满了怪物，你和出口之间有许多弯弯曲的小通道。


    “这并不是真正的迷宫。你总能找到出口，”Ping 说，“但你会在哪里是另一了。”


    “噢，很好。我送完这封信后，我可以回到树灯塔吗？也许我们可以问问网络如何找到汉尔顿！”


    “这是一个……好主意。好的。当你完成后，如果你愿意，我们可以聊聊这个。”


    “谢谢你！一会儿见！”


    “再见，Laurie。保重。”


    Laurie 和 Xor 穿过入口，进入了一个由更多灌丛组成的走廊。走了一会儿后，他们发现了一个小喷泉，上方有一块牌子。


    > **留下一硬币。许下一个愿望。**


    Laurie 把她最后一枚公平币丢进喷泉，闭上眼睛，许下愿望。以防万一，她多闭了一会儿眼睛。但并没有什么兴奋的事情发生。


    她继续沿着绿色的走廊走下去。除了树篱、更多的树篱，以及更多关于花园的牌子外，没什么好看的。


    > **你知道吗？**

    > **花园里有 16,777,216 条路径。**


    “只有 1600 万？那不算什么！”Laurie 说，“用户领域有几百万百万百万条。”


    > **每位访问者只有一条路。**


    “没关系。我想快速通过这里。”


    > **每条路只有一位访问者。**


    “这不就是一回事吗？”


    > **不是。**


    “我想知道哪条路最短，”Laurie 说。下一块牌子回答了她的问题。


    > **所有路径的长度都一样。**


    “那我怎么知道该选哪一条呢？”她问。


    > **明智选择。**


    这时她来到了路上的第一个分叉口。每个分叉口都有自己的牌子。左边的牌子写着：


    > ![](img/common-01.png.jpg)**实物**


    而右边的牌子写着：


    > **想法**![](img/common-02.png.jpg)


    Laurie 最近看到很多“想法”了。一个简单的“实物”会是很不错的改变。她选择了左边的路。一分钟后，她来到了下一个分叉口。那里的牌子写着：


    > ![](img/common-01.png.jpg)**熟悉的事物 | 奇怪的事**![](img/common-02.png.jpg)


    “我最近也看到了很多奇怪的事，”她说，“我选熟悉的。”


    > ![](img/common-01.png.jpg)**年轻的 | 老的**![](img/common-02.png.jpg)


    “嗯……老的！”他们沿着右边的路走过去。


    > ![](img/common-01.png.jpg)**有趣的 | 无聊的**![](img/common-02.png.jpg)


    “这个好选，”Xor 说，“有趣的。”


    “当我们去送那些‘有趣’的任务时，需要爬岩石和过可怕桥梁的人又你，”Laurie 说，“但行吧。”


    > ![](img/common-01.png.jpg)**丢失的 | 未丢失的**![](img/common-02.png.jpg)


    “你怎么能有一个指向‘丢失物’的牌子呢？那难道不会让它们变成‘未丢失’了吗？”Xor 问。


    “也许在在你找到它们之前，它们都是丢失的，”Laurie 沉思道。


    “有道理，”Xor 回道。他们走了左边的路。


    > ![](img/common-01.png.jpg)**大部分丢失的 | 完全丢失的**![](img/common-02.png.jpg)


    “全……不，大部分丢失，”Laurie 决定。再次向左转。


    “你知道吗，我没看到几百万条路，”Xor 说，“一直只有两条。”


    > ![](img/common-01.png.jpg)**小的 | 不大的**![](img/common-02.png.jpg)


    “不大的！”他们一起说道。


    > **比你大吗？**

    > ![](img/common-01.png.jpg)**否 | 是**![](img/common-02.png.jpg)


    “一切都比我大，”Xor 说，“我们往右边走。”


    > **比山大吗？**

    > ![](img/common-01.png.jpg)**是 | 否**![](img/common-02.png.jpg)


    *没那么大！* 他们又向右走去。


    > **比灯塔高吗？**

    > ![](img/common-01.png.jpg)**否 | 是**![](img/common-02.png.jpg)


    Laurie 也看够了灯塔。她尝试向左边走，但一只带壳的绿色动物挡住了路。


    “我们又相遇了，字母语小姐，”它说道。


    “乌龟先生！你在这儿做什么？”


    “我正在享受特别美味，”乌龟说，咬了一口绿植，“我帮助保持花园里的羽蓝花丛修剪整齐。对我来说，这是一项美妙的差事。你在这儿做什么，字母语？”


    “我正在寻找最近的出口，好送一封信。”


    乌龟似乎在微笑。当然，他总是看起来在微笑。“花园里有几百万条路径。所有路径的长度都完全一样。”


    她试图想象那么多路径并排在一起的样子。“我不明白。如果有这么多路，它们在哪儿呢？”

