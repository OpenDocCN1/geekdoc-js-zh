    就这样，它们消失了，逃进了森林的阴影中。


    洛莉（Laurie）靠在一棵树上倒了下来。“谢-谢谢，”她说。


    “没关系，小姐。在这儿休息一会儿吧，”那个男人说。他当当的一一声丢下背包，然后坐在了上面。


    等洛莉匀了气后，她问道：“什么是‘语者’？”


    “语者住在沼泽里。它们以注意力为食。如果得不到注意力，它们就会满足于恐惧和困惑。”


    “但第一个看起来很友好！我只是和它聊了几句，它就开始跟随着我。”


    “开始就是这样的的，”他说，“小语者看起来没什么大不了。有些人甚至把它们当作宠物养。但它们会结群活动，而且非常危险。”


    “那太可怕了！”


    他耸了耸肩。“你能做什么呢？守住立场，表现得自信。如果你表现出任何恐惧，一群野生的语者就会直接把你撞过去。”


    “你对它们说了什么让它们离开了？”


    “我不知道。不过听起来很不错，不是吗？”他说，“所以小姐，你叫什么名字？”


    “我叫洛莉。我觉得我迷路了。”


    “那太棒了！”男人说，“我也迷路了。”


    “噢不！你是说你不知道自己在哪儿？”


    “不，我很清楚自己在哪儿。”


    “所以你不知道要去哪里？”


    “我很清楚自己要去哪里。我正在回家的路上。”


    洛莉困惑得几乎快没力感到困惑了。“但如果你知道自己*在哪里*，”她说，“又知道你要*去哪里*，你怎么会迷路呢？”


    “因为我不知道该怎么到达那里，”男人笑了，“我是一个游荡推销员。”


    “游荡推销员？那是什么？”


    “我们在各个城镇之间穿梭，买来卖去。有两个规则：在回家之前必须访问每个城镇，而且不能两次访问同一个城镇。除了我身后的那条路，每条路都是家的路。”


    “所以你总是去你没去过的地方？”她问。


    “没错！你保证最终能到家，”他说，“这很有逻辑。一路上，我见过汉诺诺塔之上的日出，攀爬过上界（Upper Bounds）。我曾在 `Lookup Table`
    坐下，漂浮在 `Overflow River` 上。这种生活很好。迷路也可以很有趣的！”


    “对我来说已经不再有趣了，”洛莉说，“我真的不知道自己在哪儿，不知道要去哪里，*或者*不知道怎么去那里。”


    “嗯。大部分迷路是有趣的，但完全迷失就很严重了。你要回家的，对吧？”


    “是的，我想回家！”她说。


    “你住在哪儿？”


    “我跟我妈妈住在哈密尔顿（Hamilton）。你知道它在哪儿吗？”


    “一无头绪。从没听过！”他愉快地说，“不过无论如何，这算三分之一了。你有一个明确的目标。”


    “嗯，我想是吧。”


    “而且我知道*我*在哪儿，既然我们在同一个地方，意味着我就知道*你*在哪儿。你在红黑森林，靠近`零里处`（Mile Zero）。”


    *什么地方在谁附近？*她在心里想，但男人还在继续说。


    “……现在你知道自己在哪儿，以及你要去哪里了！”推销员说，“你只是*大部分*迷失了。”


    “但我还是不知道怎么去那里！”


    “嗯，”他低声思考着，“我认识一个你应该聊聊的人：一个叫 `Eponymous Bach`（同名巴赫）的智者女士。”


    “她在哪？”


    “她住在`Bach Haus`（巴赫住宅），位于`Bach Way`（巴赫路）的尽头，在……”


    “巴赫？”


    “你怎么猜到的？巴赫是一位优秀的作曲家。至少，她能指出你的问题。”


    这听起来比等青苔长出来要好得多！


    “好的，我会去的。你跟我一起去吗？”


    “我很愿意，洛莉。但我刚拜访完巴赫，”推销员说。


    “噢。这意味着你不能回去了，对吧？”


    “对。我可以带你到路口，但从那里起你就得自为力了。”


    游荡推销员带她来到森林边缘。刚过最后一棵树就有一个路牌。“啊，我们到了，”他说，“一路，`零里处`。”


    “我从没见过零*里*处，”洛莉说。


    “任何事情都要从某个地方开始。它可能看起来没什么，但这是一个非常特别的地方。你甚至可以说它是整个`System`（系统）的起点。”


    “`零里处`之后是什么？”


    “当然是第一里处。紧接着就是巴赫镇。你准备好了吗？”


    “是的，我想准备好了。谢谢！”


    “不客气，洛莉。好运！也许我们的路还会再次交汇。”游荡推销员离开了，牛铃和锅碗叮当响地响着，走向一个他以前从未去过的地方。


    洛莉也是如此。


