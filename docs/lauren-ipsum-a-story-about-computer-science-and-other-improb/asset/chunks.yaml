    # Chapter 3. Rounding Error


    ![image with no caption](figs/web/021fig01.png.jpg)


    As they headed out of Bach, Laurie couldn’t help but tease Xor a little. “Steganosauruses
    don’t exist, huh?”


    “That lady doesn’t know what she’s talking about. Her place had some really good
    bugs, though.”


    “Maybe she’s right.”


    “She says Steganosauruses don’t exist because she’s never seen one. But that proves
    my point! Steganosauruses are so good at hiding that people think they’re imaginary.”


    “That doesn’t make any sense, Xor.”


    “Who are you going to believe, me or your own eyes?” *Squawk!* Laurie felt something
    brush her shoulder. Before she knew it, a fat bird was flying away with Xor in
    its talons.


    “*Hey!*” Laurie ran after the bird as it slowly flew to a nearby branch. It was
    so fat it was almost spherical, about the size and shape of a coconut. There were
    two more just like it in the tree.


    Laurie jumped at the bird holding Xor, but it tossed the lizard to another bird,
    which caught him in its beak. She jumped at that one, but then Xor was thrown
    to another.


    The birds enjoyed playing keepaway. When their mouths weren’t full of lizard,
    they hopped up and down and sang a silly rhyme:


    “Faster and faster—”


     “—too fast to follow—”


      “—Round Robins throw faster—”


       “—than an unladen swallow!”


    “Give him back!” Laurie shouted. “He’s my friend!” The Round Robins only cackled
    and mocked her.


    “Give him back!”


     “Give him back!”


      “We think he will make—”


       “—an afternoon snack!”


    “Help!” Xor squeaked in terror. “They want to eat me!”


    “Thought he was hiding—”


     “—but bird eyes can see—”


      “—an evenly dividing—”


       “—meal for three!”


    “No!” Laurie picked up a stone and threw it at the nearest Round Robin. To her
    utter surprise, it didn’t fly away. The fat, nasty thing *caught the stone*.


    “A stone!”


     “How rude!”


      “Hardly a treasure.”


       “We’ll happily juggle it—”


        “—for your pleasure!”


    They played catch with the stone and Xor. Laurie threw another stone, and then
    another, but the birds caught those, too. Now the Round Robins were juggling three
    stones plus Xor. This wasn’t getting Laurie anywhere. She paused, thinking, another
    stone in her hand.


    “Gave up so soon?” 


     “We love to play ball!” 


      “Throw us more toys—”


       “—and we’ll catch them all!”


    Instead of throwing the single stone, Laurie scooped up a large handful and started
    tossing them in nice, easy lobs, one by one. The Robins caught each stone and
    juggled it. If they hadn’t been trying to eat her friend, Laurie would have been
    impressed.


    “What are you doing? Save me!” Xor said.


    Soon, the three Robins were having trouble keeping so many things in the air.
    Laurie threw the stones harder and faster, trying to knock the birds off balance.
    They sang for reinforcements.


    “More wings, my brothers!”


     “More beaks and more talons!”


      “We need more Round Robins—” 


       “—to evenly balance!”'
