    正如 Trent Escrow 向 Laurie 解释的那样，如果你抛掷两次不平衡的硬币，你可以保证得到正面或反面的概率各占百分之——如果你得到“正面-反面”，那么正面就是你的答案；如果你得到“反面-正面”，那么反面就是你的答案。至少有一半的时间，你可能会得到“正面-正面”或“反面-反面”；在这种情况下，只需重新开始。平均而言，你至少需要抛三次硬币才能得到一次公平的结果。试一下！另参见
    `公平硬币` (第 6 章；哈密顿循环）。


    # 第 12 章：难以想不到的转折


    ## 尝试神话


    . . . 在任何司法管辖区这实际上都不是犯罪，这是一件好事！否则，将没有人被允许写任何故事，而`神话`只是代代相传给我们的故事。有些神话试图解释世界是如何运作的，而有些仅仅是为了好玩。发挥你的想象力，也许有一天，你写出的故事将成为未来神话的一部分。


    ## 孪生兄弟


    `Doppelganger` 的故事基于哲学中的一个经典问题：如果你替换了船上所有的部件，你还拥有原来的那条船吗？Winsome 并不认为如此。她声称自己从所有主那里一个零件地偷走了
    `Doppelganger`，并留给他一个复制品！但你怎么看呢？如果你重新组装旧部件，哪条船才是原始的？如果你只替换了一半的部件呢？


    # 第 13 章：生命游戏


    ## 滑翔者


    `康威生命游戏`是对物种群如何随时间推移而变化的模拟。计算机科学家（以及许多其他科学家）利用生命游戏来研究基于简单规则的模式。你可以自己用笔和纸来尝试一下！首先，拿一些方格纸或画一个像这样的网格：


    ![image with no caption](img/174fig01.png.jpg)


    现在在网格中填充一些方格。这里有一个例子：


    ![image with no caption](img/174fig02.png.jpg)


    在你填充了一些方格后，只需遵循以下几个简单规则即可玩游戏并改变你的模式：


    1. 如果一个填充的方格有三个以上的填充的邻居，那么它就会死去。将其变为空。

    2. 如果一个填充的方格只有一个或零个填充的邻居，它就会死去。将其变为空。

    3. 如果一个填充的方格有两个或三个填充的邻居，它就能存活！保持涂色状态。

    4. 如果一个空白方格有三个填充的邻居，它就会获得生命！将其涂上颜色。


    遵循这些规则填充一个新的网格。我们的示例网格在经过回合后会变成这样：


    ![image with no caption](img/175fig01.png.jpg)


    这些模式有许多类型。`滑翔者`会移动。`闪烁者`像交通灯一样开启和熄灭。某些模式在运行过程中还会创建其他模式。这种特定的网格模式会重复：


    ![image with no caption](img/175fig02.png)


    # 第 14 章：抽象思维


    ## 五问分析法


    当科学家想要找到困惑问题的根源时，他们会不断问“为什么”，直到确切发现实验在`哪里`出了错。但你不必把这种思考方式留给科学家。


    下次当你需要为自己的问题寻找解决方案时，玩玩“五问分析法”。有很多心理游戏可以尝试，帮助你避免错误或从错误中学习。另一个好规则是“永远不要独自担心”。当你感到困惑时，找个朋友吧——当你们合作时，你们可以解决任何问题！


    ![image with no caption](img/175fig03.png.jpg)


    # 第 15 章：关键时刻的聪明


    ## 遵循拜占庭流程


    `Byzantine` 一词可以描述任何极其漫长且的过程。幸运的是，Laurie 通过帮助那三位将军获得了她需要的所有签名，而且她实际上以类似的方法解决了他们三个完全不同的问题。


    Laurie 移动狼、羊和曼德西兰花的算法使用了`计数原理`。计数原理的背后的思想是，你可以通过忽略事物之间不重要的差异，并只统计它们的数量来解决某些问题。例如：


    * 每个人都想一次性使用欧里庇得斯将军的书。但无论是读者还是作者，任何时候只有`一个`人可以使用特定的书。

    * 达利斯将军太关注将曼德西兰花、狼和羊运过河了，以至于他没有倒着数——即把羊运过去`多次`。但无论是曼德西兰花还是狼，只要你不让羊和它们单独在一起，一切都会顺利解决。


    有时情况恰恰相反：你必须以不同的方式计算同一个事物，以看看它们是否相符。Case 将军在数到 100 英尺围栏后停止数柱子；他没有考虑过支撑最后一段！数柱子`之间`的间隙，你会得到
    10 个。数柱子，你会得到 11 个。


    当 Tinker 告诉 Laurie 将与其他路径呈镜像的路径（如 `BCD` 和 `DCB`）视为一条时，他同样在使用计数原理。这条规则将通过`Userland`
    的路径数量减少了一半。但即使数量减少了一半，对旅行员问题也没有太大帮助：一个巨大的数字除以一个小的数字仍然是一个巨大的数字！


    ## 曼德西兰花


    曼德西兰花确实存在于我们的世界，它是我见过的长相最奇怪的蔬菜。在市场上，它被称为 `Romanesco`（罗马花花），它看起来非常像分形。`Fractals`是从一个形状开始，并根据一组规则无限重复、变得越来越小的模式。


    例如，在另一个等边三角形内部画一个等边三角形（三条边长度相同的三角形）。确保第二个三角形的每个点都触及第一个三角形某边的中间！这应该会在原始三角形内部创建四个较小但相同的三角形。


    现在，在每一个三角形内部也画一个等边三角形，遵循相同的规则，并重复直到你无法再放入更多三角形为止。你应该得到像此处所示的分形模式的东西。另参见 `无限` (第
    4 章；无限）。


    ![image with no caption](img/177fig01.png.jpg)


    *“谢尔宾斯基三角形演变”。通过维基共享共享公有领域。*


    # 第 16 章：计划的改变


    ## 暴力破解


    这位灯塔守护人认为每个问题的答案都是更多的力量和暴力破解。即使他建造的灯塔比失败的那个高一倍、宽一倍、厚一倍，新的一个最终仍然倒塌，因为他遵循的是同样的计划。


    然而在他自己的方式上，Bruto 决定改为金字塔是正确的。金字塔坚固得多，如果你堆上足够的砖，你最终可以造出一个足够高当灯塔的金字塔。


    ![image with no caption](img/178fig01.png.jpg)


    有些程序员也这样解决问题，但将所有资源投入暴力尝试并不总是明智的答案。当你的算法崩溃时，不要只堆砌更多的砖！像 Laurie 处理拜占庭岛的将军那样改变你的观点，你将找到一个更有效的解决方案。另参见
    `五问分析法` (第 14 章；第 14 章：抽象思维)。


    # 第 17 章：追求优雅


    ## 优雅者


    它们并不真实存在，但难道你不希望它们存在吗？


    ## 菲涅耳


