    All of the Jargon froze, their ears aquiver.


    “CEPAT! AFVIGE! *SCHNELL! SCHNELL!*”


    And just like that, they were gone, running away into the gloom of the forest.


    Laurie collapsed against a tree. “Th-thank you,” she said.


    “Sure thing, miss. Just rest here a while,” the man said. He dropped his pack
    with a loud jangle, then sat on top of it.


    “What’s a Jargon?” she asked once she’d caught her breath.


    “Jargon live in the swamps. They feed on attention. If they can’t get that, they’ll
    settle for fear and confusion.”


    “But the first one was so friendly! I just talked to it a little and it started
    following me.”


    “That’s how it starts,” he said. “A little Jargon doesn’t look like much. Some
    people even keep them as pets. But they form packs, and they are very dangerous.”


    “That’s terrible!”


    He shrugged. “What can you do? Stand your ground and act confident. If you show
    any fear, a pack of wild Jargon will run you right over.”


    “What did you say to make them leave?”


    “I have no idea. It sounded good, though, didn’t it?” he said. “So what’s your
    name, miss?”


    “My name is Laurie. I think I’m lost.”


    “That’s wonderful!” the man said. “I’m lost too.”


    “Oh no! You mean you don’t know where you are?”


    “No, I know exactly where I am.”


    “So you don’t know where you’re going?”


    “I know exactly where I’m going. I’m on the way home.”


    Laurie was almost too confused to feel confused. “But if you know where you *are*,”
    she said, “and you know where you’re *going*, how can you be lost?”


    “Because I don’t know how I’ll get there,” the man grinned. “I’m a Wandering Salesman.”


    “A Wandering Salesman? What’s that?”


    “We wander from town to town, selling and buying. There are two rules: you have
    to visit every town before going home, and you can’t visit any town twice. Every
    road is the road home except the road behind me.”


    “So you always go to the next place you’ve never been to?” she asked.


    “That’s right! You’re guaranteed to get home eventually,” he said. “It’s only
    logical. Along the way I’ve seen the sunrise over the Towers of Hanoi and climbed
    the Upper Bounds. I’ve sat down at the Lookup Table and floated on the Overflow
    River. It’s a good life. Being lost can be fun!”


    “It’s not fun for me anymore,” said Laurie. “I don’t really know where I am, or
    where I’m going, *or* how to get there.”


    “Hmm. Mostly lost is fun, but completely lost is serious. You’re going home too,
    right?”


    “Yes, I want to go home!” she said.


    “And where do you live?”


    “I live in Hamilton with my mom. Do you know where it is?”


    “Not a clue. Never heard of it!” he said cheerfully. “But that’s one out of three,
    anyway. You have a definite goal.”


    “Um, I guess so.”


    “And I know where *I* am, and since we’re in the same place, that means I know
    where *you* are. You are in the Red-Black Forest, near Mile Zero.”


    *The what near who?* she thought to herself, but the man was still talking.


    “. . . now you know where you are and where you are going!” the Salesman said.
    “You are only *mostly* lost.”


    “But I still don’t know how to get there!”


    “Hmm,” he hmmed, thinking it over. “I know someone you should talk to: a wise
    lady named Eponymous Bach.”


    “Where is she?”


    “She lives in Bach Haus at the end of Bach Way, in the town of—”


    “Bach?”


    “How did you guess? Bach is an excellent Composer. At the very least, she can
    name your problem.”


    That sounded like a much better plan than waiting for moss to grow!


    “Okay, I’ll do it. Will you go with me?”


    “I would love to, Laurie. But I’ve just come from visiting Bach,” said the Salesman.


    “Oh. That means you can’t go back, right?”


    “Right. I can take you up to the road, but from there you are on your own.”


    The Wandering Salesman showed her the way to the edge of the forest. Just past
    the last tree was a road sign. “Ah, here we are,” he said. “Route One, Mile Zero.”


    “I’ve never seen a Mile *Zero*,” said Laurie.


    “Everything has to start somewhere. It may not look like much, but this is a very
    special place. You might even say it’s the starting point of the whole System.”


    “What comes after Mile Zero?”


    “Mile One, of course. And right after that is the town of Bach. Are you ready?”


    “Yes, I think so. Thank you!”


    “You’re welcome, Laurie. Good luck! Maybe our paths will cross again.” The Wandering
    Salesman headed off, cowbells and pans rattling, to a place he’d never been before.


    And so did Laurie.


    # Chapter 1. A Hidden Ally


    ![image with no caption](figs/web/011fig01.png.jpg)


    “That wasn’t *too* bad,” Laurie said to herself, as she reached the Mile One sign.
    “A mile sounds like a long way to walk, but it’s easier if you break it into pieces.”
    She remembered that in Hamilton there are eight blocks to a mile, so she made
    herself think about walking one block at a time.


    “*Oh, look, another one*,” said a voice.


    “Hello?” Laurie spun around, but there wasn’t much to see: some fields of odd-looking
    crops, an empty road, and the sign.


    “*She’s kind of short, isn’t she?*”


    That’s when she noticed a tiny lizard clinging to the sign. It had the oddest
    coloring: where the sign was green, the lizard was reddish; where it was white,
    the lizard was black.


    “Hello, who are you?” she asked.


    “I’m Xor,” the lizard squeaked. His tail twitched from yellow to blue. “Hold on,
    can you *see* me?”


    “Of course I can see you!” Laurie said.


    “Oh.” Xor looked very sad and blushed a bright purple.


    “You *are* the first talking lizard I’ve ever met,” Laurie said. “How did you
    learn to talk?”


    “What a silly question!” the creature said. “I learned as a baby, like everybody
    else.”


    “You did?”


    “Sure. Why, how did *you* learn to talk?”


    “Well . . .” She had always been able to talk, hadn’t she? “I guess I learned
    as a baby too.”


    “It’s only logical. First you learn to talk, then you learn to think. Too bad
    it’s not the other way around.”


    “What are you doing there on the sign?” Laurie asked.


    “Another silly question! What does it look like I’m doing? I am blending into
    the background,” Xor said. At that moment he turned pink and violet. “Did you
    say something?”


    She shook her head.


    “Where was I? Oh, yes. Blending in is an honorable and ancient art. It takes years
    of practice. You must have a pretty sharp eye to spot me.” Xor marched around
    the sign as he talked, turning white with large orange polka dots.


    Laurie bit her tongue, trying not to laugh.


    “No, you don’t see a lizard like me every day!” He turned peach and cornflower
    blue. “But sometimes—personally speaking between you and me, of course—sometimes
    . . .” He looked sad again and fell silent.


    “Sometimes what?”


    “Sometimes, I worry I’m not doing it right.”


    “Not if you want to *hide*!” Laurie said, unable to contain herself. “Your colors
    keep changing.”


    “I was pretty sure I’d figured it out this time,” Xor said, turning his head around
    to get a better look at himself.


    ![image with no caption](figs/web/013fig01.png.jpg)


    “My left leg is green—” he said.


    “Green? No, it’s red.”


    “Really?”


    “Really. Now it’s purple.”


    Xor sighed. “Blending in is a lot harder than it looks. I’m glad it was you who
    saw me and not a hungry bird. You see, I’m a bit color-blind.”


    “What kind of lizard are you, anyway?” she asked.


    “I’m Chameleon, mostly. I’m part dinosaur on my mother’s side.”


    “Part *dinosaur*? That’s impossible.”


    “It’s true!” Xor drew his little self up proudly. “For instance, my Aunt Vana
    is a Steganosaurus. She can hide anywhere, even on the back of a postage stamp.”


    Laurie wasn’t sure she believed Xor, but she didn’t want to hurt the lizard’s
    feelings.


    “Maybe your aunt can teach you how to hide better.”


    “I’d love that. But I don’t know where she is. The last time I saw her, I didn’t
    even see her!” he said.


    “But—”


    “*Hey*,” Xor said, “why don’t I come along with *you*? If you can see me, maybe
    you’ll be able to see her, too.”


    “I don’t think—”


    “It’ll be fine! I know a lot about this place. I can show you around.”'
