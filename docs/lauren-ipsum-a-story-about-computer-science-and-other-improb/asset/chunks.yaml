    ![image with no caption](img/041fig02.png.jpg)


    “`Al-go-rith-ms`（算法）。听起来像某种水果。”


    “你总是这么肚子饿吗，Xor？”


    “时间光如箭，果蝇喜欢香蕉。让我们看看有没有什么我可以帮它们解决的果蝇问题。”


    当 Laurie 打开门时，风铃叮铃作响。“你好，你好！”店主说，“欢迎来到我的商店。我是提金克（Tinker），你正在寻找一种精良的算法，对吧？”


    Laurie 看着黑板上列出的项目，但它们完全说不通。


    ![![image with no caption](img/042fig01.png.jpg)


    “我不确定。什么是算法？它能吃吗？”Laurie 问。


    “什么？不，它只是说‘如何做某事’的一种高级说法。但 `Algorithm` 这个词写在招牌上看起来更有面子，”提金克说。


    Xor 失望得脸都红了。


    “如何做某事，”Laurie 重复道，“既然这样，我想找到一种访问每个城镇的合理方法。”


    “这听起来是个有趣的问题。你目前为止在做什么？”


    Laurie 向提金克讲述了她在红黑森林的冒险以及拜访同名巴赫（Eponymous Bach）的情况。


    “哈密顿路径，哈？”提金克说，“这道题很难。我不想这么说，因为他听起来是个好人，但流浪推销员可能需要很久才能完成对所有城镇的旅行。”


    “噢，不！但为什么？”


    “如果你总是去最近的一个未过的城镇，可能会错过一个稍微远一点的城镇。然后你去另一个离你近但离你错过的那个城镇更远的城镇，以此类推。你最后可能会横跨整个国家才能到达最后几个城镇。”


    “听起来很累，”Laurie 说。流浪推销员终并不合理！“那么我该如何找到最短路径呢？”


    “我看看库存里有什么。但可能很贵。”


    “我身上的钱不多，”Laurie 说。她从口袋里掏出几个四分之一硬币给提金克看。


    他惊讶地看着它们。“四分之一美元？我不知道什么是美元，更别说它的四分之一了。这是你们那儿的钱吗？”


    “当然是钱了！那是七十五分，”她说。


    “分？我们这儿用的是公平硬币（Fair Coins）。”


    “什么是公平硬币？”


    “嗯，它们比你的这些四分之一美元大一点，但没那么漂亮！你可以一眼看出是真正的公平硬币，因为它们总是正面或反面，概率各占五十。”


    “但四分之一硬币也可以各占五十的概率啊！”


    “这可能是事实，但我不能光听你的，对吧？在这里，所有的公平硬币都必须经过公平认证。”


    Laurie 垂头丧气。


    “别这么难过！我是想帮你的，”提金克说，“也许我们可以做个交易。碰巧我需要一种特定的算法。”


    “但我也没有任何算法，”Laurie 说。


    “这没问题，”提金克说，“你可以随时随地编写新的，只需要花点心思。”


    “我可以吗？怎么做？”


    “嗯，每个人都有自己的风格。你可以把小想法组合在一起变成大想法。或者你把两个想法放在一起进行比较。或者你从大想法开始把它们拆解。”


    “你的意思是像同名巴赫那样？”


    “是的，就像她一样。她是一位伟大的作曲家。”


    Laurie 从未想过自己也能做那样的事情。但提金克似乎认为这很正常。


    “所以我该怎么做？”


    “我寻找的算法是如何画一个圆，”提金克说，“这是一个难题，所以你得运用你的想象力。我已经问过所有的大人，甚至包括波恩（Ponens）和托伦（Tollens）了，但他们只是在那儿嘟囔
    `x` 平加 `y` 平，毫无进展。”


    “看看这个。”他递给 Laurie 一个发条玩具动物。它有一个 `Shell`，圆圆的绿色。“这只乌龟可以做三件事：它可以向前或后移动，它可以转身，并在纸上画一个小点。”


    “嘿，那真酷！”


    “是的，但问题是，它不知道做其他任何事情。这就是算法大显身场的地方。”提金克拿出张纸，写了一段看起来像小诗的内容：


    ```

    前进英寸，

    画一个标记，

    重复五次。

    ```


    然后他上好乌龟的发条把它放在诗上。它发出 `zzzrbt bzzaap whuzzzsh` 的声音，以此类推。然后它画了一排点，就像诗里写的那样：


    ![![image with no caption](img/045fig01.png.jpg)


    “看到了吗？如果你把小想法组合在一起，就能做出更大的想法，”提金克说，“你还可以把这些想法组合成更大的想法。”


    “你是怎么做的？”Laurie 问。


    “通过给它们命名。你可以把名字当作手柄：你会通过手柄提一锅汤，你可以通过写下名字移动整个想法。在这里，我们把第一个想法命名为 `LINE`（线）。然后你可以把四条线组合成一个正方形。”


    > **LINE**:

    >

    > **前进英寸，**

    >

    > **画一个标记，**

    >

    > **重复五次。**

    >

    > **SQUARE**:

    >

    > **画一条 LINE，**

    >

    > **向右转，**

    >

    > **重复四次。**

    >

    > **画一个 SQUARE。**


    小乌龟 `zzzrbt` 叫着、`whuzzzsh` 动着、`bzzaap` 闪着，然后画了这个：


    ![![image with no caption](img/046fig01.png.jpg)


    Laurie 惊呆了。这像魔法一样，但每一步都有理可循。


    “所以，知道了乌龟能做什么，你能教它怎么画圆吗？”提金克问。


    “我不知道，”Laurie 说，“但我想尝试！”


    “这我就满意了。来，你可以在我的桌子上工作。那里有很多纸、圆规之类的东西。”


    Laurie 坐在提金克的桌子旁。她用圆规涂鸦，和乌龟玩了一会儿，试图回忆她所关于圆的知识。


    `圆是圆的。不，不只是圆——是完美的圆。你把针插在中心，笔尖旋转。想画大一点，就打开圆规；画小一点，就关闭圆规。如果你在旋转时改变圆规的宽度，画出来的就不是圆……`


    突然，一个想法，也许是一个记忆，跳进了她的脑海：`圆是所有距离中心完全相同的点。嗯，如果你……`


    ```

    前进英寸，

    画一个标记，

    后退英寸，

    向右转一点点，

    然后重复！

    ```


    在 Laurie 写下她的诗后，她再次上好小乌龟的发条把它放在纸上。它嗡嗡作响了一会儿，然后画成了这个：


    ![![image with no caption](img/047fig02.png.jpg)


    “它成功了！”她对提金克喊道，“嘿，它没停。”乌龟正在画它已经画过的点。


    “我觉得是因为你只告诉它重复，但没说重复几次，”提金克说。


    “嗯，它应该画完圆就停止，”Laurie 说。


    “它并不真正理解圆，”提金克说，“它只是一只乌龟，记得吗？你得教它。”


    Laurie 又思考了一会儿，重写了她的诗：


    > **CIRCLE**:

    >

    > **前进英寸，**

    >

    > **画一个标记，**

    >

    > **后退英寸，**

    >

    > **向右转一度，**

    >

    > **重复三百六次。**


    然后她意识到自己可以画任何想要尺寸的圆。这只需要把圆规开得更大。


    > **TWO-CIRCLE**:

    >

    > **前进两英寸，**

    >

    > **画一个标记，**

    >

    > **后退两英寸，**

    >

    > **向右转一度，**

    >

    > **重复三百六次。**


    “这很有趣。你真的很努力！”提金克挠了挠头，“但现在这样，它并不好。”


    “为什么？”


    “人们想要画很多不同的圆，”他说，“我得准备很多不同尺寸的算法，以防有人想要三又十分之十三英寸或者四又四之四英寸。”


    “那么，如果你告诉乌龟要画多大的圆呢？”她说，“也许像。”


    > **ANY-CIRCLE (how-big?):**

    >

    > **前进 how-big? 英寸，**

    >

    > **画一个标记，**

    >

    > **后退 how-big? 英寸，**

    >

    > **向右转一度，**

    >

    > **重复三百六次。**


