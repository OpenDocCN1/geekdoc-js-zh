    \ over dots it had already drawn.\n\n“I think it’s because you told it to repeat,\
    \ but not how many times,” said Tinker.\n\n“Well, it should stop when the circle\
    \ is done,” Laurie said.\n\n“It doesn’t really understand circles,” Tinker said.\
    \ “It’s just a toy turtle, remember? You have to teach it.”\n\nLaurie thought\
    \ a little more, then rewrote her poem:\n\n> **CIRCLE:**\n\n> \n\n> **Go forward\
    \ one inch,**\n\n> \n\n> **make a mark,**\n\n> \n\n> **go back one inch,**\n\n\
    > \n\n> **turn right one degree,**\n\n> \n\n> **repeat three hundred sixty times.**\n\
    \nThen she realized that she could make circles of any size she wanted. It was\
    \ just like opening the compass wider.\n\n> **TWO-CIRCLE:**\n\n> \n\n> **Go forward\
    \ two inches,**\n\n> \n\n> **make a mark,**\n\n> \n\n> **go back two inches,**\n\
    \n> \n\n> **turn right one degree,**\n\n> \n\n> **repeat three hundred sixty times.**\n\
    \n“This is interesting. You’re working really hard!” Tinker scratched his head.\
    \ “But as it is, it’s no good.”\n\n“Why?”\n\n“People want to make lots of different\
    \ circles,” he said. “I’ll have to keep a lot of algorithms of different sizes,\
    \ just in case someone wants three-and-nine-thirteenths inches or four-and-three-quarters\
    \ inches.”\n\n“Well, what if you tell the turtle how big to make the circle?”\
    \ she said. “Maybe like this.”\n\n> **ANY-CIRCLE (how-big?):**\n\n> \n\n> **Go\
    \ forward how-big? inches,**\n\n> \n\n> **make a mark,**\n\n> \n\n> **go back\
    \ how-big? inches,**\n\n> \n\n> **turn right one degree,**\n\n> \n\n> **repeat\
    \ three hundred sixty times.**"
