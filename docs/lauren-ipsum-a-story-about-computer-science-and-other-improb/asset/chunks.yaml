    “Good. I thought you were going to sink the boat,” said Winsome. “Why don’t you
    go below and get some rest? And think about something before you fall asleep.”


    “Think about what?”


    “Making your own map.”


    # Chapter 14. In the Abstract


    ![image with no caption](figs/web/091fig01.png.jpg)


