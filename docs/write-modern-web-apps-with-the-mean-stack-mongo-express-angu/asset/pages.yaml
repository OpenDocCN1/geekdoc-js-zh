  md: "# USING BOWER\n\nBefore you will be able to do any client-side unit tests,\
    \ you will need to set up Bower in your application. Bower is a tool designed\
    \ to manage front-end dependencies—similar to how npm manages back-end dependencies.\n\
    \nIt's not totally necessary to have Bower; you could just download the assets\
    \ and commit them into the file. I suggest it to keep your repo clean and lock\
    \ your versions down, however.\n\nYou haven't needed to install Bower yet because\
    \ you load your third-party dependencies (currently just Angular) through the\
    \ Google CDN. In Karma, you need to have these dependencies local. You'll still\
    \ use the CDN for loading these assets outside of Karma, but having Bower set\
    \ up is useful for dependencies not available on a public CDN.\n\nFirst, install\
    \ Bower globally:\n\n```\n$ npm install --global bower\n```\n\nThen create a file\
    \ in the root of the project bower.json:\n\n```\n{\n  \"name\": \"social-app\"\
    ,\n  \"dependencies\": {\n    \"angular\": \"~1.2.21\",\n    \"angular-mocks\"\
    : \"~1.2.21\",\n    \"angular-route\": \"~1.2.21\"\n  }\n}\n```"
