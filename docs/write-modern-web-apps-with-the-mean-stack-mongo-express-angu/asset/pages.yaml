  md: "Now the change you need to make in the Angular app is simple; you just need\
    \ to send up the X-Auth header on the post creation request. You could add this\
    \ directly to the posts controller, but the better way is to globally add that\
    \ header for all requests so you won't have to keep remembering to do that. Update\
    \ ng/user.svc.js to the following code:\n\n```\nangular.module('app')\n  .service('UserSvc',\
    \ function ($http) {\n  var svc = this;\n  svc.getUser = function () {\n    return\
    \ $http.get('/api/users')\n  };\n  svc.login = function (username, password) {\n\
    \    return $http.post('/api/sessions', {\n      username: username, password:\
    \ password\n    }).then(function (val) {\n      svc.token = val.data\n      $http.defaults.headers['X-Auth']\
    \ = val.data\n      return svc.getUser()\n    });\n  };\n});\n```\n\nNow all requests\
    \ (not just those in this service) will have header attached. Your app should\
    \ now be able to make posts based on the current user!\n\nThis is a basic demonstration\
    \ of authentication in Angular. It's definitely not as easy as it is with a traditional\
    \ web application generated by the server, but it's very flexible. It's also easier\
    \ to maintain since each component is actually doing very little.\n\nStill, there\
    \ is more that you could do to turn this into a full-fledged authentication system.\
    \ I'll briefly describe some tips in the following sections."
