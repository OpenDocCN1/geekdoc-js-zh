  md: '# USING KARMA


    Much like end-to-end tests have Protractor as the runner, Angular tests make use
    of Karma. Karma is a test runner designed for unit testing. It can also run in
    multiple browsers, including Chrome, Firefox, and PhantomJS. Built by the Angular
    team like Protractor, Karma has a similar configuration setup and ways to run
    it.


    The biggest difference with Karma is that you''re usually not working with the
    DOM, so the UI isn''t important. In fact, you won''t even be using your layout
    file. For this reason, most developers run Karma under a headless client like
    PhantomJS. Karma is just a way to get a client-side JavaScript runtime going to
    start running tests.'
