  md: "# WEBSOCKETS IN ANGULAR.JS\n\nAngular does not have any built-in functionality\
    \ for WebSockets, but using some of the $scope events functionality you looked\
    \ at previously, it's not hard for you to handle it yourself. First, you need\
    \ to write a bit of code to dispatch the WebSocket messages to interested components.\n\
    Create a file ng/websockets.js with the following:\n\n```\nangular.module('app')\n\
    .run (function ($rootScope) {\n  var url = 'ws://localhost:3000';\n  var connection\
    \ = new WebSocket(url);\n\nconnection.onopen = function () {\n  console.log('WebSocket\
    \ connected');\n}\n})\n```\n\nThis is an Angular run component. These simply get\
    \ executed late in the initialization phase. Because this reason nothing will\
    \ directly connect to this component; you don't want to use a service for this\
    \ because you will simply publish events to $rootScope that a controller or service\
    \ can listen to with $scope.on($scope). $rootScope is like $scope except that\
    \ it's the parent $scope that everything inherits from. It's also a singleton,\
    \ so it can be used to share global information through an application. While\
    \ sharing state is better done by having a hierarchy of ng-controller $scopes,\
    \ passing global events leads to nicely decoupled asynchronous applications.\n\
    \nYou create a connection directly to localhost:3000. You could analyze the URL\
    \ and change the protocol from http to ws to support multiple hostnames.\n\nYou\
    \ then attach a function to 'open' event from the WebSocket object. This block\
    \ (the body of the function with the $scope parameter) should work as is. Try\
    \ it in your browser and you should see 'WebSocket connected' in the console.\
    \ Once it is working, add a function for the message event after handling the\
    \ open event:\n\n```\nconnection.onmessage = function (e) {\nconsole.log(e)\n\
    var payload = JSON.parse(e.data)\n$rootScope.broadcast('ws:' + payload.topic,\
    \ payload.data)\n}\n```\n\nYou're broadcasting this message to any $scope object\
    \ in the system with ws: before turning it into an Angular event, so your new\
    \ post event would be ws:new_post. To avoid any potential conflicts with an existing\
    \ event name matching a WebSocket topic."
  merge: -1
