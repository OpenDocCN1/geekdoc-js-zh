    The server is now generating and decoding tokens for you, but it''s not interesting

    since it''s not actually pulling data from anywhere. To make this work, first
    I''ll show how to

    use a static array in memory, and then you''ll move it over MongoDB.


    Note that there is a more standard Authorization HTTP header you could use in
    place of my X-Auth header, but that requires you to pass the type in addition
    to the token. It would

    look like this:


    Authorization: Basic [jwt]


    It is fine to use but requires a bit of string splitting and concatenation I find
    burdensome.

    It''s fine to come up with your header types, but you''re supposed to add X- to
    the front.


