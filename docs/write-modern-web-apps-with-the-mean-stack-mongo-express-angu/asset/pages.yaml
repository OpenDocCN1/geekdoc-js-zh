  md: "# FIGURE 8.2 404 error loading\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_120_0.png)\n\
    \nHere is the code for your UserSvc that goes in ng/user.svc.js:\n\n```\nangular.module('app')\n\
    .service('UserSvc', function ($http) {\n  var svc = this\n  svc.getUser = function\
    \ () {\n    return $http.get('/api/users', {\n      headers: { 'X-Auth': this.token\
    \ }\n    })\n  }\n  svc.login = function (username, password) {\n    return $http.post('/api/sessions',\
    \ {\n      username: username, password: password\n    }).then(function (val)\
    \ {\n      svc.token = val.data\n      return svc.getUser()\n    });\n  }\n});\n\
    ```\n\nThe login process has two steps. First, you call POST /api/sessions to\
    \ get a JWT; then, you call GET /api/users to get the currently logged-in user's\
    \ information. You could have the server send data back right in the login callback,\
