  md: "# MongoDB MODELS WITH MONGOOSE\n\nTo interact with MongoDB, you will be using\
    \ the Mongoose ODM. It's a light layer on top of the Mongo driver. To add the\
    \ npm package, do this:\n\n+   $ npm install --save mongoose\n\nIt'll be good\
    \ to keep this code modularized so your server.js file doesn't get huge. Let's\
    \ add a db.js file with some of the database connection logic:\n\n```\nvar mongoose\
    \ = require('mongoose')nmongo.connect('mongodb://localhost/social', function ()\
    \ {\n  console.log('mongodb connected')\n})\nmodule.exports = mongoose\n```\n\n\
    You can get access to this mongoose instance by using the require function. Now\
    \ let's create a mongoose model to store the posts. Place this code in models/post.js:\n\
    \n```\nvar db = require('../db')\nvar Post = db.model('Post', {\nusername: { type:\
    \ String, required: true },\nbody: { type: String, required: true },\ndate: {\
    \ type: Date, required: true, default: Date.now }\n})\nmodule.exports = Post\n\
    ```\n\nNow you have a model you can get with require. You can use it to interact\
    \ with the database."
  merge: -1
