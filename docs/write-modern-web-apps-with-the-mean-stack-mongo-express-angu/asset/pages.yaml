  md: "# ANGULARIZING THE PAGE\n\nAngular.js essentially allows you to data bind JavaScript\
    \ objects to the DOM (also known as HTML elements). You basically wire up objects\
    \ in a controller to something called $scope and declare in your HTML how it should\
    \ be displayed.\n\nInclude Angular before your closing `</body>` tag:\n\n```\n\
    <script src='https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/angular.js'></script>\n\
    ```\n\nNow declare your `<body>` element as an Angular app:\n\n```\n<body ng-app='app'>\n\
    ```\n\nFor this to work, you need to first declare a matching module. Do the following\
    \ in a `<script>` tag after the Angular include tag:\n\n```\n<script>\nangular.module('app',\
    \ []);\n</script>\n```\n\nAt this part of the book, you will be working in a `<script>`\
    \ tag inside the HTML rather than referencing external JavaScript files. It might\
    \ seem messy, but this is just temporary until you get Node to help separate parts\
    \ of Angular code.\n\nModules are a way to name the module and the second is an\
    \ array of modules that this module depends on. You'll use modules to access things\
    \ such as ngAnimate (animation tools), ngRoute (client-side router for single-page\
    \ apps), or modules of your own. I'll talk more about modules later, but for now\
    \ just know that your app must be declared as a module.\n\nTo declare a controller,\
    \ use the `.controller()` method on an instance of a module. This method takes\
    \ two arguments: a name and a function used to build an instance of the controller.\
    \ All Angular components follow this pattern.\n\nMake your `<script>` tag look\
    \ like the following:\n\n```\n<script>\nvar app = angular.module('app', []);\n\
    app.controller('PostsCtrl', function ($scope) {\n  $scope.posts = [\n    {\n \
    \     username: 'dickeyxxxx',\n      body: 'Node rules!'\n    },\n    {\n    \
    \  username: 'jeffdickey',\n    }\n  ];\n});</script>\n```"
  merge: -1
