  md: '# BASE ROUTER


    You can''t directly add the posts controller to SuperTest because it will be missing
    necessary middleware such as body-parser. You also can''t import the code in server.js
    that creates the base express parser since it doesn''t export the exp. You need
    access to a base router object that is used both by SuperTest and by server.js.


    Create a file controllers/index.js with the following content—taken mostly

    server.js:


    ```

    var router = require(''express'').Router()

    var bodyParser = require(''body-parser'')

    ```


    ```

    router.use(bodyParser.json())


    router.use(require(''../auth''))

    router.use(''/api/posts'', require(''./api/posts''))

    router.use(''/api/sessions'', require(''./api/sessions''))

    router.use(''/api/users'', require(''./api/users''))

    router.use(require(''./static''))

    ```


    ```

    module.exports = router

    ```


    Now replace server.js with the following that will use this new router object:


    ```

    var express = require(''express'')

    var logger = require(''morgan'')

    var websockets = require(''./websockets'')

    var app = express()

    ```


    ```

    app.use(logger(''dev''))

    app.use(require(''./controllers''))


    var port = process.env.PORT || 3000

    var server = app.listen(port, function () {

    console.log(''Server'', process.pid, ''listening on'', port)

    }

    websockets.connect(server)

    ```


    Run your application to make sure everything works.

    Running into situations where you need to restructure code in order to make it
    testable

    is a common occurrence when building applications. This is a a great example where
    testable

    code is also better code because server.js is much simpler now.'
