- img_proc: true
  md: '# INTRODUCING WEBSOCKETS


    In the interest of finding ways to develop more interactive, more immersive applications,
    browsers now support a new protocol in addition to HTTP: WebSockets. HTTP was
    pretty much the only way for developers to communicate with browsers for a long
    time. It''s a reliable, relatively quick protocol that developers got by with.


    The major downside to HTTP is that it''s one-way for web applications. The browser
    can not be an HTTP server, which means that the client must initiate any communication.
    This works well for what the Web was originally designed for (reading documents
    and viewing media), but it doesn''t support heavy interactivity.


    As I covered in Chapter 1, Ajax was a groundbreaking technology that helped developers
    to quickly load new content on pages. Ajax still uses HTTP, though so anything
    a server might want to notify a client about (download process, notification,
    and new content), it has to query.


    To solve this problem, we''ve come up with various solutions like Flash, Comet,
    and short- and long-polling. For the most part, these were all complicated hacks
    needed to get around the problem of a server not being able to ping a client.
    Luckily, W3C has now standardized WebSockets as a solution. It has good browser
    support, working on all major mobile devices, Chrome, Firefox, and Safari. It''s
    supported by IE10 and newer. (Note that you need to support IE9 or older, the
    tool socket .io will help.)


    W3C took time to get this API right, and using it in the browser is easy. For
    this part of the book, you will be working with WebSockets almost entirely from
    scratch. There are tools to abstract some of the complexity away (such as the
    aforementioned socket .io), but they''re really only a light layer of abstraction.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# HOW WEBSOCKETS WORK


    WebSockets works similarly to the low-level TCP layer. It provides a full-duplex
    channel between your server and the client. It allows either the client or the
    server to pass messages as strings to one another, unlike TCP, which only sends
    bytes back and forth.


    On a WebSocket-enabled site, a bit of JavaScript will be run to tell the browser
    to make a WebSocket connection. Once it''s made, it provides an event callback
    for messages. It''s really easy to make a connection from a browser:


    ```

    var connection = new WebSocket(''ws://mysite.com'')

    connection.onmessage = function (e) {

    console.log(''message received: '', e.data)

    }

    ```


    Again, no libraries are used here. Simply make a new WebSocket object and attach
    a function to its onmessage event. After it connects, any messages sent from the
    server will be delivered to this callback.


    Typically e.data attribute will contain a bit of JSON we will parse, but it could
    be any string or binary blob.

    Sending events is easy as well:


    ```

    var connection = new WebSocket(''ws://mysite.com'')

    connection.onmessage = function (e) {

    console.log(''message received: '', e.data)

    connection.send(''get your message: '' + e.data)

    }

    ```


    You can send messages at any time, not just after receiving one. Because the connection
    is created asynchronously, you can''t just call connection. send() directly after
    creating the connection object, however. If you wanted to send a message right
    after connecting, you could use the onopen event:


    ```

    var connection = new WebSocket(''ws://mysite.com'')

    connection.onopen = function () {

    connection.send(''hello!'')

    }

    ```


    Unlike HTTP, the server side of this code looks similar; however, you need to
    use a package for it since it is not built into Node.js.


    Using this technology, you can cause the browser to react to changes from any
    other system easily. For the social application you''ve been building, you''ll
    add functionality so that if any user posts an update, all others will see the
    update pop live.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# WHAT SHOULD YOU USE WEBSOCKETS FOR?


    WebSockets can be used for any kind of client-server communication. There isn''t
    really any overhead to using it instead of HTTP. You could remove HTTP from your
    social application and do all the data loading and posting via WebSockets, including
    authentication.


    It can have real benefits when it comes to loading data. The client could request
    small deltas of the data rather than relying on HTTP to deliver all the content
    every time it''s loaded. An architecture like this would work extremely well in
    an offline context. When it come online, it could just sync all new data from
    both sides.


    A setup like this might be good for mobile apps, apps that have very live and
    interactive content (like games), or anywhere else there would be a lot of thrashing
    of duplicate data via HTTP.


    The trouble with WebSockets is that it maintains a persisting connection resulting
    in a stateful design. State makes distributed computing difficult and forces you
    to deal with problems such as connection loss. It also adds a significant amount
    of entropy to a system—in other words, many different states means many different
    ways bugs can crop up. Therefore, a WebSocket-based platform can be tougher to
    develop on than a traditional, stateless HTTP-based platform.


    For this reason, unless you''re building something like a game, I suggest you
    use WebSockets only for notifications from the server to the client. It''s still
    useful to deliver new content, notifications, or progress updates, but using HTTP
    for everything else saves you from the complexity that comes from a stateful architecture.


    Find the balance that works for you, though.'
  merge: -1
