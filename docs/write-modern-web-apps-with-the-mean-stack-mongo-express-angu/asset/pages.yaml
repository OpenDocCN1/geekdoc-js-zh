  md: '# INSTALLING REDIS


    Unlike MongoDB, the Redis team does not want to ship its software under a yum
    package. The preferred solution with Redis is to compile it. Fortunately, it''s
    actually easy.


    First, download the tarball to your home folder (it actually doesn''t matter where
    you download it, though). This is the latest version of it writing; check redis.io
    for the current one when you install it.


    ```

    # wget http://download.redis.io/releases/redis-2.8.13.tar.gz

    ```


    Then, extract it and enter the directory.


    ```

    # tar -xzf redis-2.8.13.tar.gz

    # cd redis-2.8.13

    ```


    Now compile the C code.


    ```

    # make

    ```


    And run the Makefile''s install step to add the binaries to /usr/local/bin.


    ```

    # make install

    ```


    You can now delete these files.


    ```

    # cd ..

    ```


    ```

    # rm -rf redis-2.8.13*

    ```


    Redis is now available to you, and you could boot the server with redis-server,
    but that won''t keep it running as a daemon like MongoDB. Because you built Redis
    from scratch, you need to create our own systemd configuration file.


    Create the file /etc/systemd/system/redis.service with the following:


    ```

    [Service]

    ExecStart=/usr/local/bin/redis-server

    Restart=always

    ```


    This is a basic systemd configuration. It just tell systemd what command to run
    and that it should restart it if it were to die.


    Starting Redis is now the same as with MongoDB.


    ```

    # systemctl start redis

    ```'
  merge: -1
