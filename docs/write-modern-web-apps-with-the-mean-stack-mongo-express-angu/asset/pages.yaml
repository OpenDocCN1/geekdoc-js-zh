- img_proc: true
  md: "# GULP HELLO WORLD\n\nTo get Gulp up and running, let's first create a simple\
    \ task that outputs \"Hello World.\"\nFirst, install Gulp globally and in the\
    \ project (you need both) with the following commands:\n\n```\nnpm install --global\
    \ gulp\nnpm install --save gulp\n```\n\nNext, add the gulpfile.js to the root\
    \ of the project. This is a special filename Gulp knows to look for. The contents\
    \ should be the following:\n\n```\nvar gulp = require('gulp')\n\ngulp.task('hello',\
    \ function () {\n  console.log('hello world')\n})\n```\n\nYou can now run this\
    \ task:\n\n```\n$ gulp hello\n[15:59:03] Using gulpfile ~/src/social/gulpfile.js\n\
    [15:59:03] Starting 'hello'...\n[15:59:03] Finished 'hello' after 106 µs\n```\n\
    \nhello world\nThis is the basic form of a Gulp task. You can also have tasks\
    \ that depend on others passing in an array:\n\n```\nvar gulp = require('gulp')\n\
    \ngulp.task('welcome', function () {\n  console.log('welcome to gulp!')\n})\n\
    ```\n\n```\ngulp.task('hello', ['welcome'], function () {\n  console.log('hello\
    \ world')\n})\n```\n\nNow if you run the hello task, it will first wait for the\
    \ welcome task to complete. You can also run the welcome task directly with gulp\
    \ welcome."
  merge: -1
  pgno: 82
- img_proc: true
  md: "# BUILDING JAVASCRIPT WITH GULP\n\nThe first thing you will use Gulp to take\
    \ care of is building your front-end JavaScript. Right now you have the /assets/app.js\
    \ file that gets included inside the layout file, but I would like to have many\
    \ JavaScript files to have a nice clean file hierarchy for all of your front-end\
    \ code. Ideally, every Angular component would have its own file.\n\nHaving a\
    \ <script> tag for each of these would quickly become unbearable, so what you'll\
    \ do now is a series of front-end scripts in /ng (for Angular) that Gulp will\
    \ concatenate together to dynamically build /assets/app.js.\n\nFirst, move /assets/app.js\
    \ to /ng/app.js. Then, install the Gulp plug-in in gulp-concat:\n\n```\n$ npm\
    \ install --gulp-concat\n```\n\nReplace your gulpfile.js file with the following:\n\
    \n```\nvar gulp = require('gulp')\nvar concat = require('gulp-concat')\n\ngulp.task('js',\
    \ function () {\n  gulp.src('ng/**.js')\n  .pipe(concat('app.js'))\n  .pipe(gulp.dest('assets'))\n\
    })\n```\n\nThis is the common signature of all Gulp plug-ins. You load the files\
    \ with gulp.src into a stream, pipe them through various plug-ins, and finally\
    \ output them to gulp.dest. It might look a little unusual at first, but once\
    \ you get the hang of it, you'll be able to use many plug-ins without ever reading\
    \ the documentation.\n\nTry running gulp js, and you should see it copy the contents\
    \ of /ng/app.js to /assets/app.js:\n\n```\n$ gulp js\n```\n\nAngular is great\
    \ in it allows you to declare the components at any time, so the order in which\
