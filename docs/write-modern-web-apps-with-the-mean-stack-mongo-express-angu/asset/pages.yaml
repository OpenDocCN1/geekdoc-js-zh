  md: "# CREATING A VANILLA HTTP SERVER\n\nNode.js has an HTTP module built in that\
    \ can act as a server. A simple \"Hello World\" server would look like this in\
    \ straight Node:\n\n```\nvar http = require(\"http\");\nhttp.createServer(function(request,\
    \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    \  response.write(\"Hello world\");\n  response.end();\n}).listen(3000);\n```\n\
    \nYou'll need a server for the project in this book, so follow these steps:\n\n\
    +   1. Create the previous file anywhere and call it app.js.\nThis responds to\
    \ any route the web server receives. If you wanted to respond to others, you'd\
    \ have to implement some kind of conditional on the request object.\n\n+   2.\
    \ Run the server by executing node app.js in a terminal. You won't see any output,\
    \ but going to http://localhost:3000 in your browser should display \"Hello World.\"\
    .\n\nWhile exploring the code, pay attention to the createServer function. This\
    \ is calling the function createServer on the HTTP module, passing in a new, anonymous\
    \ function.\n\nThe code inside that function is not executed right away but when\
    \ the web server receives a new request. This is one of those callbacks discussed\
    \ earlier in action. Node doesn't block at any part of code; it just stores the\
    \ function for the use later when a request comes in.\n\nYou could totally build\
    \ an application like this, but the NPM package Express provides some nicer structure\
    \ to common HTTP code. It's a lightweight web server (akin to Sinatra in Ruby,\
    \ but even more low level)."
