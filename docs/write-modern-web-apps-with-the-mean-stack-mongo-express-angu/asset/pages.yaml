  md: '# INSTALLING MongoDB


    Follow the directions for your platform at http://docs.mongodb.org/manual/installation/


    +   - On OS X use Homebrew, brew install mongodb

    - Note that on OS X you''ll probably want to make sure it stays running as a daemon
    with launchctl Type brew info mongodb for instructions on how to do this.

    - On Windows there is an installer you can get from the official website.

    - On Ubuntu do not run apt-get because you will likely install a very old version
    of mongodb. Check the official website for specific instructions.


    # USING MongoDB


    Now that you have MongoDB installed, start the mongo daemon and then start your
    client by running the mongo command:


    ```

    $ mongo

    MongoDB shell version: 2.6.1

    connecting to: test

    >

    ```


    Now you''re connected to the test database. In MongoDB there are three parts to
    the hierarchy of data:


    +   - Database: There is usually one database per app, but there can be several
    per server. It usually shares the name of the app, and it''s the same as a database
    in SQL.

    - Collection: This is a group of similar pieces of data. It is usually a noun
    and analogous to a table in SQL.

    - Document: This is a single item in the database, such as an individual user
    record. If a collection were a class, a document would be an object. It is sort
    analogous to a row in SQL (although you shouldn''t assume so!).


    Here you want to use a database called playground. As mentioned earlier, in Mongo
    typically you won''t create anything; you just start using it as if it was there.
    This is a great example:


    ```

    > use playground

    itched to db playground

    >

    ```'
