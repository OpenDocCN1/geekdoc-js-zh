    Heroku also provides add-services from third-party providers. For this project
    I''m using MongoLab as a MongoDB provider, NewRelic for performance monitoring,
    and Redis To Go as my Redis provider. These are all free add-ons, but if I wanted
    to get more performance out of, I could upgrade the add-on and be charged via
    my Heroku account.


    Having centralized billing for add-ons helps when running multiple environments
    inside an organization.'
