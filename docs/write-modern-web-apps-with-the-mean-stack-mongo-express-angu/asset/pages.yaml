  md: "# THE STOCK ENDPOINT\n\nTo start, you'll use Node.js and Express to build a\
    \ stock /api/posts endpoint. First, inside a new folder, create a package.json\
    \ file like the following:\n\n```\n{\n  \"name\": \"socialapp\"\n}\n```\n\nThe\
    \ name can be anything you want, but try to ensure it doesn't conflict with an\
    \ existing package. package.json file is the only thing you need to make a directory\
    \ node project.\nNow that you have this, you can add express and body-parser as\
    \ dependencies:\n\n```\n$ cd <path-to-project-folder>\n$ npm install --save express\n\
    $ npm install --save body-parser\n```\n\nbody-parser is used for express to read\
    \ in JSON ON POST requests automatically.\nThe --save flag saves the dependency\
    \ to the package. json file so you know what versions of packages the app was\
    \ built with (and therefore depends on). In fact, if you open your package.json,\
    \ you'll see something similar to this:\n\n```\n{\n  \"name\": \"socialapp\",\n\
    \  \"dependencies\": {\n    \"body-parser\": \"^1.4.3\",\n    \"express\": \"\
    ^4.4.4\"\n  }\n}\n```\n\nNow that you've done this, you can require('express')\
    \ to include it in a node script."
