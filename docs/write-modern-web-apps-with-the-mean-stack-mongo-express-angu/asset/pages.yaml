  md: '# WHAT IS DIGITAL OCEAN?


    Digital Ocean is a simple cloud server provider. It offers some of the lowest-cost
    cloud servers along with a good UI and easy-to-use tools. It is comparable to
    AWS or Rackspace, but I find Digital Ocean much easier to work with and cheaper
    as well.


    Admittedly, Digital Ocean doesn''t offer the same level of functionality as the
    others, but it''s well worth the simplicity. Most of the features offered by Rackspace
    and AWS are easily available by other providers.


    This chapter is not specific to Digital Ocean and will work similarly on any other
    server.'
