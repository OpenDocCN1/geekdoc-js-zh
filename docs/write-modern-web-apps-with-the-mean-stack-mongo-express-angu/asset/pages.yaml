- img_proc: true
  md: '# SYSTEMD COMMANDS


    Here are some common commands to use with systemd:


    ```

    systemctl daemon-reload # reloads .service files if they''ve changed

    systemctl disable redis # shuts down redis and prevents it from

    > starting again

    systemctl enable redis # re-enables a previously disabled service

    systemctl start redis # starts a stopped service

    systemctl restart redis # restarts a running service

    systemctl status redis # shows the current info and some logs of

    -> the service

    journalctl -u redis # pulls down the logs of the service

    ```


    Test your Redis install by running redis-cli, as shown here:


    ```

    # redis-cli

    127.0.0.1:6379

    ```'
