- img_proc: true
  md: 'The following are advantages of BSON over tables/rows:

    - Documents map naturally to objects in programming languages.

    - Embedded documents and arrays prevent the need for joins.

    - Polymorphism is much easier since there is no schema.


    # HORIZIZONTAL SCALING WITH AUTO-SHARDING


    While MongoDB was certainly designed with ease of use in mind, it''s also great
    for scaling. MongoDB supports horizontal scaling, which is the ability to add
    more machines to a cluster to scale. This is in contrast to vertical scaling,
    which is the idea that you scale up by increasing the horsepower of a single box.


    Essentially with MongoDB you can just add boxes to your cluster to scale up for
    traffic. In a relational database such as MySQL or PostgreSQL, you have limited
    options to increase the database performance. Once a database starts to get hard
    and you''ve upgraded the box to be as powerful as possible, you have few options
    to improve performance. You can analyze queries and attempt to optimize them,
    add more caching, move the data to other sources, and decrease query usage, but
    all of these tasks require levels of development to analyze and fix.


    As a result, some relational databases admit to sharding the system. Sharding
    involves splitting the data across multiple databases. On a relational database,
    this is incredibly challenging and involves a ton of changes to the application
    to support it. Once sharding has been implemented, you lose the ability to perform
    many types of queries (anything across the whole data set).


    MongoDB, on the other hand, embraces sharding. It assumes your data will be sharded
    from the beginning; therefore, queries like joins that would require the whole
    dataset are not supported at all. You''re expected to design your system to support
    this architecture.


    Having that, MongoDB can''t scale in this way forever. You''ll be able to add
    a few databases to the system, but at some point it''ll be too much work for them
    to get all quorum with each other, and your system will break down. It''s a good
    solution, but it isn''t a silver bullet.


    # SCHEMELESS


    In SQL, you have to design your schema by defining all the tables and data types
    before you can start inserting. MongoDB does not have this concept. In MongoDB,
    you just start adding data in any format you want. If it doesn''t look like earlier
    data, it doesn''t complain.


    In general, with MongoDB you don''t set up anything beforehand; you start using
    it. For example, there''s no command to create an index. There is an ensureIndex
    command that does exactly what it sounds like (create the index if it doesn''t
    exist).'
