  md: '# ROUTING


    Before you can build up the pages for authentication, you''ll need to include
    Angular''s router. Angular has a module you can add to your app and turn it into
    a single-page application. Angular will be able to show different views based
    on the URL.


    Before you get started with that, let''s rename the layout file layouts/posts.html
    to layouts/app.html. This is because your layout file will now be used across
    all pages, not just the views. Make sure you update controllers/static.js to point
    to layouts/app.html.


    The router (ng-route) does not come included in the Main Angular code, so you
    need to include it and declare it as a dependency in your app.


    Go into layouts/app.html and add ng-route after the Angular script tag. The bottom
    of layouts/app.html should look like this:


    ```

    <script src=''https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/>

    < angular-route src=''https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/>

    angular-route.js''></script>

    <script src=''app.js''></script>

    </body>

    </html>

    ```


    After adding the new <script> tag, go into module.js and declare ng-route as a
    dependency:


    ```

    angular.module(''app'', [

    ''ngRoute''

    ])

    ```


    It might look a little strange that I added newlines for this. This is because
    there will likely be many modules you want to declare as dependencies. Having
    each one on a newline in source control looks much better since you will easily
    be able to see what module was added with what commit. It''s also easier to manage
    as it grows.


    Add a new file/routes.js to define your routes for the posts page, register page,
    and login page. Soon, you''ll add functionality behind these, but it won''t break
    anything having routes that point nowhere.


    ```

    angular.module(''app'')

    .config(function ($routeProvider) {

    $routeProvider

    .route(''/'', { controller: ''PostsCtrl'', templateUrl: ''posts.html'' })

    ```'
