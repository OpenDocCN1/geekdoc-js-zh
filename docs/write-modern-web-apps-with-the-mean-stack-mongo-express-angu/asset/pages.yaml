  md: '```

    body: ''trying out angular.js...''

    }

    )

    </script>

    ```


    Here you''re storing the app module into a variable app and then creating a controller
    on it called PostsCtrl. This controller has an array that represents the posts
    you see in the HTML.


    When you declare a controller, do you know what''s known in the Angular world
    as *dependency inject $scope*.


    Creating a controller (or other Angular component) involves creating a function
    like you did earlier. When you declare arguments, Angular looks up the dependencies
    based on what you named them. If you rename $scope to $fobar, for example, you
    would see an error (although not with the code you have right now since the controller
    wouldn''t load). In my opinion, this dependency injection is the most powerful
    of Angular.


    What is $scope? It''s simply an object you can access in the HTML and in the controller.
    You''ll see more examples of dependencies later. For now, let''s just dump $scope.posts
    onto the page. Add the following HTML to the page (keep your existing static HTML
    mockup for reference):


    ```

    <div ng-controller=''PostsCtrl">

    {{ posts }}

    </div>

    ```


    You should now see a JSON representation of the controller''s $scope.posts on
    the page. You can have JavaScript inside those double-curly brackets, so if you
    wanted to see just the body of the first post, you would do this:


    ```

    <div ng-controller=''PostsCtrl">

    {{ posts[0].body }}

    </div>

    ```


    Remember that when sharing controller data to the view, use $scope. When referencing
    controller data from the view, leave out $scope.'
