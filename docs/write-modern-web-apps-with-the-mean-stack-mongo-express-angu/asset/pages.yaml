  md: "# THE NPM TEST COMMAND\n\nNode offers a place to put the command you want to\
    \ run for tests in package.json. When it is set up, you can run the test suite\
    \ of any project with a package json file by running npm test. This is a good\
    \ idea since it provides documentation for how to test your project for other\
    \ developers. For projects with multiple test suites (such as ours), it allows\
    \ developers to easily recall the command to run all the tests. It is also useful\
    \ as a continuous integration (CI) entry point.\n\nIt's a simple feature but is\
    \ certainly one worth using. Add the following section to your package.json:\n\
    \n```\n\"scripts\": {\n  \"test\": \"./node_modules/.bin/mocha && ./node_modules/.bin/protractor\"\
    \n}\n```\n\nThen run it:\n\n$ npm test\n\nYou should see the Node server tests\
    \ run, and if they are successful, Protractor should execute afterward. && tells\
    \ your shell to run the left side first, and if it returns a o status code, run\
    \ the next."
