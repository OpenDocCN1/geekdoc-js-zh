    \ inside addPost():\n\n```\n$scope.postBody = null\n```\n\nBecause the data binding\
    \ is two-way, anything you set $scope.postBody to will update the input element,\
    \ and vice versa.\n\nAnother issue is that the user can post empty posts. To fix\
    \ that, simply wrap the addPost() logic in the following conditional:\n\n```\n\
    if ($scope.postBody) {\n```\n\nHere is a complete example of the app with some\
