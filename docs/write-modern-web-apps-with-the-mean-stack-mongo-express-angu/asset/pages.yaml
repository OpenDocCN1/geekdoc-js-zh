  md: '# WHEN TO USE END-TO-END TESTS


    As I mentioned earlier, end-to-end tests are best used to define the major flows
    a user takes in a system. These tests are slow compared to unit tests. They can
    be brittle and difficult to diagnose when they fail as well. For these reasons,
    it''s best to leave it to only the major actions users take as well as actions
    that require the system to orchestrate many components.


    These are often the best first-line-of-defense when it comes to preventing bugs
    from going out to users. End-to-end tests are great at preventing regressions
    as well since they use the system like a user, not a like not a developer when
    it comes to unit tests. If you only get around to testing one thing in your application,
    I suggest it to be a couple of end-to-end tests on your major flows.'
  merge: -1
