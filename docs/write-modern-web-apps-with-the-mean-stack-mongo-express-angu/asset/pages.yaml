  md: "# # AUTHENTICATION WITH MongoDB\n\nNow let's finish the demo authentication\
    \ app by adding a real database into the mix. First, create a user model with\
    \ Mongoose in a new file user.js, like so:\n\n```\nvar mongoose = require('mongoose')\n\
    mongoose.connect('mongodb://localhost/auth_demo');\n```\n\n```\nvar user = mongoose.Schema({\n\
    \  username: String,\n  password: String\n})\n```\n\n```\nmodule.exports = mongoose.model('User',\
    \ user)\n```\n\nThen, add this line to the top of server-auth.js:\n\n```\nvar\
    \ User = require('./user')\n```\n\nNow in the same file, let's create a route\
    \ POST /user to create new user accounts:\n\n```\napp.post('/user', function (req,\
    \ res, next) {\n  var user = new User({username: req.body.username})\n  bcrypt.hash(req.body.password,\
    \ 10, function (err, hash) {\n    user.password = hash\n    user.save(function\
    \ (err, user) {\n      if (err) { throw next(err) }\n      res.send(201)\n   \
    \ })\n  })\n})\n```\n\nNow you are creating users with a bcrypt-generated hash.\
    \ To create a user with curl, use this:\n\n```\n$ curl -X POST -d '{\"username\"\
    :\"dickeyxxx\",\"password\":\"pass\"}' -H\n\"Content-Type: application/json\"\
    \ localhost:3000/user\n```"
