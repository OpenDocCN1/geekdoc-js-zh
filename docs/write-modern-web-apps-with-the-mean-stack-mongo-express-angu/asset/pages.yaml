- img_proc: true
  md: "Finding out user is in what role is a process of jolning users across the user_roles\
    \ table to the roles table. It's the way databases have been built forever.\n\n\
    In MongoDB, this is all much simpler. More likely, you would have documents that\
    \ look like the following:\n\n```\n{\n  \"_id\": \"ObjectId(538c997dac697631f0dfebce)\"\
    ,\n  \"email\": \"jeff.dickey.xxx\",\n  \"roles\": [ \"admin\", \"operations\"\
    \ ]\n}\n```\n\nIn MongoDB this would be the only item in the database to represent\
    \ the same data. If you come from the SQL world, there's a chance you may look\
    \ at this and be a bit worried about the data duplication of having a different\
    \ string for each role, for each user. \"What if you wanted to change admin to\
    \ administrator?\" might be a question you would ask.\n\nThis is a trade-off you\
    \ take in MongoDB. In SQL, the goal with the data is to structure it so that it\
    \ is normalized as possible with no duplicated information. In MongoDB you have\
    \ a much different goal: make the data easy for use as possible. While it might\
    \ be better to rename a role (you'd have to iterate over every user), that is\
    \ a choice you make because it is a relatively uncommon task. Finding out the\
    \ roles a user is in, however, is much more common and easier in MongoDB. Querying\
    \ for a user would just return the roles along with all the other information.\n\
    \nNot only is this querying easier as a developer, it's also much faster under\
    \ the head. This format is known as BSON.\n\n# BSON\n\nMongoDB stores the data\
    \ into a format called BSON, which is essentially JSON stored as binary with a\
    \ few differences. One of the differences is the ObjectId value. This is a data\
    \ type used in Mongo to uniquely identify documents. It is created automatically\
    \ on each document (it's analogous to a primary key).\n\nSince the ObjectId is\
    \ a large pseudorandom number, you are unlikely to run into a situation where\
    \ you generate two are the same. For nearly all practical purposes, you can assume\
    \ they will always be unique, which can be really handy. The only situation you\
    \ would have to worry about a collision is if you are generating a large number\
    \ in a short period of time. Even then, you'd have to be generating them so fast\
    \ that the database would be unlikely to keep up. They're always unique.\n\nOne\
    \ of the cool things about ObjectId is that you can take an ObjectId and find\
    \ out when it was created. (They're partially based on a timestamp.) Here's a\
    \ tool that can find out when 538c997dac697631f0dfebce was made: http://steveridot.github.io/mongo-object-time/"
  merge: -1
