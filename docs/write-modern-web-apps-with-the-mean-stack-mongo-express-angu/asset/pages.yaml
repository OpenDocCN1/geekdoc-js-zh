  md: 'Since it works in production as it does in development, you achieve something
    called dev-prod parity. Dev-prod parity is the idea that production should be
    similar as development mode possible in order to mitigate production-specific
    issues.


    To do this, Express comes with built-in middleware to serve the static assets.
    You can add it to /controllers/static.js along with your layout endpoint:


    ```

    var express = require(''express'')

    var router = express.Router()

    ```


    ```

    router.use(express.static(__dirname + ''/../assets''))

    ```


    _dirname is a Special Variable that points to the current file directory,

    controllers in your case. You''re going up from that directory so that you can
    serve the assets in /assets.


    You could also use process.cwd(), which is the current working directory of the
    Node process, but that has a tendency to change depending on how you start the
    process. I prefer using __dirname instead of process.cwd() for all Node web servers.


    Once you have set up, try to access http://localhost:3000/app.js. You should see
    the raw Javascript script you created. Then replace the <script> tag in /layouts/posts.html
    with one that references the script from the server.


    ```

    <script src=''/app.js''></script>

    ```


    Now you have a much cleaner separation between your HTML layout and your JavaScript
    code.


    # BREAKING ANGULAR INTO SERVICES


    In addition to the clever data binding that Angular provides, it provides a solid
    framework for breaking up your code into logical sections. Services are one of
    the ways you can build a component for your application.


    In Angular, controllers get created and destroyed every time they appear and disappear
    on a page. Services, on the other hand, are created only when needed. If multiple
    other components want to use a service, Angular will efficiently the same instance
    of the service.


    Dependency inject services just like $scope or $http and call custom functions
    on them.


    A clear code inside Angular apps would be having inside a controller. This makes
    the controller aware of too much and is not good code separation. Now, when building
    your applications, I encourage you to first make the HTTP calls inside the controller
    and break it out once it is working. That''s how I build applications, and similar
    to the server. js breakout you did earlier, it allows for easier iterating and
    experimenting.'
