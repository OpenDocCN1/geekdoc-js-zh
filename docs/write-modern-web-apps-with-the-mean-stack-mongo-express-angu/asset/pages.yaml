  md: "You're also logging the message event. It'd be good to try posting a post and\
    \ seeing whether the event pops up in the console before continuing.\n\nWhat you\
    \ need to do now is to listen to this event in the posts controller and, upon\
    \ receipt, unshift the post into `$scope.posts`. Inside ng/posts.ctrl.js, here\
    \ is the code:\n\n```\n$scope.on('ws:new_post', function (_, post) {\n  $scope.$apply(function\
    \ () {\n    $scope.posts.unshift(post)\n  })\n})\n```\n\nRemember to also remove\
    \ the other unshift for the user posting the post; otherwise, the post will appear\
    \ twice. A nice side benefit of using WebSockets is that you no longer need that\
    \ code (although it was just one line).\n\nI'm not sure why `$scope.$apply()`\
    \ is necessary here, but without it the UI won't update.\nI think that `$scope.on`\
    \ should triggering a digest cycle, so it may be an Angular bug.\nRegardless,\
    \ adding `$scope.$apply()` solves the issue."
