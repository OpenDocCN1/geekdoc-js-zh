  md: "# TESTING CONTROLLERS WITH AUTHENTICATION\n\nFor you to test the POST /api/posts\
    \ endpoint, you need to not only create a user but also get a valid JWT for that\
    \ user. You could use the API to register a new user and then log in and get a\
    \ JWT, but that would become slow, and many endpoints would require authentication.\n\
    Using the API would be testing a function that is more than you need to do with\
    \ Node tests.\n\nWhat you need is a function that creates a new user and returns\
    \ you your JWT. You're going to use jsonwebtoken here.\n\n```\n$ npm install --save-dev\
    \ jsonwebtoken\n```\n\nCreate the file test/server/support/user.js with the following\
    \ function that creates a new user and returns it in a callback with their JWT:\n\
    \n```\nvar bcrypt = require('bcrypt')\nvar jwt = require('jsonwebtoken')\nvar\
    \ config = require('../../config')\nvar User = require('../../models/user')\n\n\
    exports.create = function (username, password, cb) {\n  var user = new User({username:\
    \ username})\n  bcrypt.hash(password, 10, function (err, hash) {\n    if (err)\
    \ return cb(err)\n    user.password = hash\n    user.save(function (err) {\n \
    \     if (err) return cb(err)\n      user.token = jwt.sign({username: user.username},\
    \ config.secret)\n      cb(null, user)\n    })\n  })\n}\n```\n\nThis code is taken\
    \ from the sessions controller and the users controller. With this you can make\
    \ authenticated calls inside your tests.\nOpen test/server/controllers/api/posts.spec.js\
    \ and add two things. First add the user support file at the top:\n\n```\n// ...\n\
    var api = require('../../api/api')\nvar user = require('../../support/user')\n\
    // ...\n```"
