  md: "What is happening here is that Uglifier rewrote the function argument names\
    \ as characters. For this reason, Angular is incompatible with JavaScript minifiers.\
    \ Obviously, there is a way to fix this problem. You can pass an array that defines\
    \ the dependencies as strings when defining your component. For example, if you\
    \ wanted to fix PostSvc, you could change the definition from this:\n\n```\n.service('PostSvc',\
    \ function ($http) {\n```\n\ninto this:\n\n```\n.service('PostSvc', ['http'],\
    \ function ($http) {\n```\n\nAngular supports either way to define the dependencies.\
    \ The second one is minifier-compatible since the minifier will not change the\
    \ string literal that it changes variable names. While this is great for minification,\
    \ it's a pain to develop with since you have to keep track of the order of dependencies\
    \ all the time.\n\nLuckily, there is a tool called ng-annotate that will rewrite\
    \ your code using the minification-friendly syntax before you ship it to Uglifier.\
    \ This allows you to write the code in the concise manner and solves the minification\
    \ problem as well. It's similar to other Gulp plug-ins.\n\n+   - First, install\
    \ gulp-ng-annotate\n\n```\n$ npm install --save gulp-ng-annotate\n```\n\nThen\
    \ update your gulpfile.js:\n\n```\nvar gulp = require('gulp')\nvar concat = require('gulp-concat')\n\
    var uglify = require('gulp-uglify')\nvar ngAnnotate = require('gulp-ng-annotate')\n\
    ```\n\n```\ngulp.task('js', function () {\n  gulp.src(['module.js', 'ng/**/*.js'])\n\
    \    .pipe(concat('app.js'))\n    .pipe(ngAnnotate())\n    .pipe(uglify())\n \
    \   .pipe(gulp.dest('assets'))\n});\n```"
