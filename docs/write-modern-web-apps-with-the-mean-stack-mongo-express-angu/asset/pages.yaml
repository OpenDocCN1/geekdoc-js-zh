    )};this.create=function(s){return t.post\n(\"/api/posts\",s)}}});\n```\n\nIf you\
    \ look in there, you will see how those dependency arrays affect each component.\n\
    Running the app again should work.\n\n# REBUILDING UPON FILE CHANGES\n\nRight\
