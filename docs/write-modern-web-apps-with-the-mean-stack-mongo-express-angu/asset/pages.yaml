    \  // ...\n```\n\nYou should now be able to run both the test server and a dev\
    \ server without errors.\n\n# PRORACTOR LOCATORS\n\nRight now your test is just\
    \ loading a page. The real power of Protractor is its ability to interact with\
    \ a page's DOM elements. These tools are known as locators in Protractor.\nTo\
    \ use a locator, you first need to find a DOM element. Here are some of the common\
    \ ways to do that:\n\n```\n// find an element using a css selector\nby.css('.myclass')\n\
    // find an element with the given id\nby.id('myid')\n```"
