  md: "# HTTP TESTING WITH KARMA\n\nNow that you have a test, let's try to run fetch\
    \ method and see whether you get back any posts. Rewrite it block to the following—knowing\
    \ it is unlikely you would get back two from this call in any case:\n\n```\ndescribe('#fetch',\
    \ function () {\n  it('gets 2 posts', function () {\n    PostsSvc.fetch().success(function\
    \ (posts) {\n      expect(posts).to.have.length(2)\n    })\n  });\n});\n```\n\n\
    You might be surprised to notice the test passes! It's passing because the assertion\
    \ never gets called. You could try the done callback you used in the previous\
    \ chapter for the Node, but that would just result in a timeout.\n\nIn Angular\
    \ tests, you often have to call something to \"flush\" any awaiting events. In\
    \ this case, you have HTTP requests awaiting to be made.\n\nInject the $httpBackend\
    \ into a new variable and call flush on in an after filter:\n\n```\ndescribe('posts.svc',\
    \ function () {\n  beforeEach(module('app'))\n  var PostsSvc, $httpBackend\n```\n\
    \n```\nbeforeEach(inject(function (_PostsSvc_, $httpBackend_) {\n  PostsSvc =\
    \ _PostsSvc_\n  $httpBackend = _$httpBackend_\n})))))\n```\n\n```\nafterEach(function\
    \ () {\n  $httpBackend.flush()\n});\n```\n\n```\ndescribe('#fetch', function ()\
    \ {\n  it('gets 2 posts', function () {\n    PostsSvc.fetch().success(function\
    \ (posts) {\n      expect(posts).to.have.length(2)\n    })\n  });\n});\n```"
