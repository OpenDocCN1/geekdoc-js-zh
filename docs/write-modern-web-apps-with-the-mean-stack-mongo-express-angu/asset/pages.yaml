  md: "# USING BCRYPT\n\nYou know it's insecure to store plain-text passwords in the\
    \ database. That would make it easy for someone to find the passwords for all\
    \ users. One improvement you can make over plain text is to use encryption. Encryption\
    \ is still a bad way to store passwords, though, since having the key would allow\
    \ you to simply decrypt the passwords. Therefore, encryption is a totally insecure\
    \ way to store passwords.\n\nThe secure way to deal with passwords is by using\
    \ a hashing algorithm. A hash is a one-way algorithm. You store the hash result\
    \ in the database, and when checking a password, you hash it and compare the result\
    \ with the hash stored in the database. There is no way to go from the hash back\
    \ to the original password. Also, having a hash isn't enough to get a password\
    \ that matches it (at least without a rainbow table). If so some hacker got a\
    \ hash for a user's password, they could not actually log in.\n\nI won't get into\
    \ the specifics of the algorithm, but research the terms rainbow tables and password\
    \ salting to learn more.\n\nThere are still problems with hashing rainbow tables\
    \ or brute-force attacks. The best solution for dealing with passwords is Bcrypt.\
    \ Bcrypt is a hashing algorithm that is intentionally slow, making brute-force\
    \ attacks too expensive to do.\n\nLike JWT, it's not really important to understand\
    \ how it works, just how to use it. To find the bcrypt hash of your password,\
    \ you can calculate it inside a Node console:\n\n```\n$ npm install --save bcrypt\n\
    $ node\n> require('bcrypt').hashSync('pass', 10)\n$2a$10$Jmo/n32ofSM9JvzfHoZ6Me6TMyn6C/UGjhzDG8XqC4xExHMG1jXzz2\n\
    ```\n\nThe 10 is the number of rounds you want it to pass to generate the hash.\
    \ The result is more secure but slower (10 is sufficient for almost anything).\n\
    \nNote that running it results in a different hash. This is because it's salted\
    \ randomly. You can validate the password with compareSync:\n\n```\n> require('bcrypt').compareSync('pass',\
    \ '$2a$10$Jmo/n32ofSM9JvzfHoZ6Me6TMyn6C/UGjhzDG8XqC4xExHMG1jXzz2')\ntrue\n```\n\
    \nYou could now put that password hash into the users array and edit your validateUser\
    \ function to:\n\n```\nvar bcrypt = require('bcrypt')\nfunction validateUser(user,\
    \ password) {\n  return bcrypt.compareSync(password, user.password)\n}\n```"
