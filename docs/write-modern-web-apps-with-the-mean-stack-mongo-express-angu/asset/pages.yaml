  md: '# # DEPLOYING AN APPLICATION TO HEROKU


    You''ll deploy our social app to Heroku. To get started, first create a Heroku
    account at Heroku.com and install the tool belt (instructions will be provided
    after signing up).


    Once that''s complete, go to your application in the terminal. If you haven''t
    turned your project into a Git repo yet, you''ll need to do that now. The only
    way to get code on Heroku is by Git, so even if you''re using a different source
    control tool, you''ll still have to Integrate Git to use Heroku.


    If at any point during this process you trouble getting the application to work
    and are seeing errors other than those described, clone my example repo at https://github.com/dickeyxxs/mean-sample.
    That repository will be Heroku-ready.


    Turn your project into a Git repo, go to the root of the application initialize
    a repo and commit all the files to it. Skip this step if you already have the
    project in Git.


    ```

    $ git init

    ```


    If you''re using your code, before you make your initial commit, you''ll want
    to create a .gitignore file and add the following:


    ```

    node_modules

    assets

    ```


    The Node modules will be taken care of by Heroku, as well the assets (see the
    "Compiling Assets" section). With that finished, commit all the files:


    ```

    $ git commit -am "init"

    ```


    Now that the project is in a Git repo, run the heroku create command. This will
    add a git remote automatically that you can use to deploy the application.


    ```

    $ heroku create

    ```


    Creating dry-sands-8759... done, stack is cedar

    http://dry-sands-8759.herokuapp.com/ | git@heroku.com:dry-sands-8759.git

    Git remote heroku added


    Heroku will automatically give your project name; in my case, that is dry-sands-8759.
    These names are autogenerated, so yours will be different.


    You can check to whether the Git remote was added correctly by listing the remotes:


    ```

    $ git remote -v

    ```


    ```

    heroku git@heroku.com:dry-sands-8759.git (fetch)

    heroku git@heroku.com:dry-sands-8759.git (push)

    ```'
