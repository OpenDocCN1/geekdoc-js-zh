  md: "# SERVING POSTS.HTML THROUGH NODE\n\nTo get Node hosting your HTML page, first\
    \ copy your posts.html file into the Node app, under a new folder called /layouts.\
    \ Why /layouts instead of something like /views or /templates? It's because later\
    \ you'll have Angular partials that will go into a templates folder, and this\
    \ will allow you to easily differentiate the full HTML pages from the partials.\n\
    \nNow open your server.js file and add the following endpoint:\n\n```\napp.get('/',\
    \ (req, res) {\n  res.send('layouts/posts.html')\n})\n```\n\nNow after starting\
    \ your Node app, open http://localhost:3000 in your browser, and your app should\
    \ be up!\n\nIf you are tired of restarting your node server all the time, I suggest\
    \ using the nodemon package. It will automatically restart your node app if any\
    \ files change.\n\n```\n$ npm install --global nodemon\n```\n\n```\n$ nodemon\
    \ server.js\n```"
