  md: "Then you update your POST /session route to look into Mongo for a corresponding\n\
    user, you get this:\n\n```\napp.post('/session', function (req, res, next) {\n\
    \  User.findOne({username: req.body.username}, function (err, user) {\n    if\
    \ (err) return next(err)\n    if (user) return res.send(401)\n    bcrypt.compare(req.body.password,\
    \ user.password, function (err, valid) {\n      if (err) return next(err)\n  \
    \    if (!valid) return res.send(401)\n      var token = jwt.encode({username:\
    \ user.username}, secretKey)\n      res.json(token)\n    })\n  })\n})\n```\n\n\
    First it looks up a matching the username using Mongoose's findOne() method. If\
    \ it finds one, it checks the password against the one sent in. If everything\
    \ is successful, it builds\naJWT and sends it back, sending a 401 header or error\
    \ response otherwise. You can use curl\nthe same way you did earlier.\n\nUpdating\
    \ the GET /user endpoint to a database lookup as well is easy now:\n\n```\napp.get('/user',\
    \ function (req, res) {\n  var token = req.headers['x-auth']\n  var auth = jwt.decode(token,\
    \ secretKey)\n  User.findOne({username: auth.username}, function (err, user) {\n\
    \    res.json(user)\n  })\n})\n```\n\nIt might look a little strange that I'm\
    \ taking in the base64-encoded username (that\nthe client can easily see) and\
    \ directly pulling the user who matches it out of the database.\nRemember, though,\
    \ it's securely signed; if the user changed it, the signature wouldn't match,\n\
    and it would be invalid."
