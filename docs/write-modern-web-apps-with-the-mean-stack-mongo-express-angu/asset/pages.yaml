- img_proc: true
  md: '# RUNNING SOCIAL APP UNDER SYSTEMD


    The problem with this setup is that as soon as the terminal session is closed
    or the server crashes, it won''t come back up. You should run the application
    under systemd just like that you did for Redis and MongoDB.


    Create the service at /etc/systemd/system/social-app.service with the following
    content. The working directory might be different depending on where you installed
    the app.


    ```

    [Service]

    WorkingDirectory=/home/web/mean-sample

    ExecStart=/usr/local/bin/node boot.js

    User=web

    Group=web

    Restart=always

    Environment=''NODE_ENV=production''

    StandardOutput=syslog

    StandardError=syslog

    SyslogIdentifier=social-app

    ```


    Then start the service as root. The root user starts the social-app service, but
    the app is executed by the web user.


    ```

    # systemctl start social-app

    ```


    Remember to run systemctl daemon-reload if you need to make changes to the service
    file.'
  merge: -1
  pgno: 239
