  md: "# GULP DEV TASK\n\nThis is great for making sure the CSS keeps getting updated,\
    \ but it's a bit of a pain since you now have three processes to keep running:\
    \ the server, gulp watch:js, and gulp watch:css. I like to create a gulp dev that\
    \ just runs everything that needs to run while working on the application.\n\n\
    For these kinds of 'metatasks', it's best to keep them inside the main gulpfile.js.\
    \ Add a task in there like the following:\n\n```\ngulp.task('dev', ['watch:css',\
    \ 'watch:js'])\n```\n\nNow if you run gulp dev, it'll watch both the CSS and JavaScript\
    \ files for updates. Note that having a function block for Gulp tasks is optional.\
    \ This one just depends on two others.\n\n# GULP-NODEMON\n\nNow that your assets\
    \ are being compiled, let's add a Gulp task to start nodemon to run your app for\
    \ you.\n\n+   - First, install gulp-nodemon\n\n```\n$ npm install --save gulp-nodemon\n\
    ```\n\nNow create the file /gulp/server.js with the following task:\n\n```\nvar\
    \ gulp = require('gulp')\nvar nodemon = require('gulp-nodemon')\ngulp.task('dev:server',\
    \ function () {\n  nodemon({\n    script: 'server.js',\n    ext: 'js'\n  })\n\
    })\n```"
