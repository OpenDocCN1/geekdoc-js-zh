  md: "Ryan Dahl, Node js's creator, wanted a platform that was able to handle heavy\
    \ amounts of I/O to build applications similar to Gmail where HTTP requests might\
    \ have to sit around for long periods of time. Scripting languages are completely\
    \ incapable of blocking the entire process when a web request arrives. Threaded\
    \ systems can handle this to a point, but threads are still expensive.\n\nJavaScript\
    \ was designed to work within the confines of the browser. The most restrictive\
    \ part of that was having a single thread and single process for the whole page.\
    \ This meant that synchronous blocking in code would lock up a web page from all\
    \ actions. JavaScript was built in this manner. It is expressive when it comes\
    \ to asynchronous code.\n\nThis style of handling I/O has worked well in the browser\
    \ and is why Dahl chose to build Node.js. As such, it can handle millions of concurrent\
    \ requests in\n\nLibraries that handle concurrency using events have been written\
    \ in many other languages, such as Python's Threads, Ruby's EventMachine, Akka\
    \ for Java, and others. The difference here is JavaScript's syntax already assumes\
    \ events through callbacks.\n\nRunning an application through a single thread\
    \ is not a silver bullet, however. If you end up performing CPU-intensive (as\
    \ opposed to I/O-intensive) work, the thread will be tied up, and everything will\
    \ be blocked waiting for it to finish. Also, developers need to ensure that you\
    \ do not allow errors to bubble up to the process, which would abort all connections.\n\
    \n# HOW CALLBACKS WORK\n\nIf you're new to this concept, basically the difference\
    \ is that in most languages you'll ask the computer to do some I/O (database call,\
    \ HTTP call, and so on) and then wait until it returns to continue your code path.\
    \ Something like the following:\n\n```\nuser = User.findById(100)\n// Do something\
    \ with user\n```\n\nThis code will query the database for ID 100. It will pause\
    \ thread/process until the database comes back (which is relatively slow).\n\n\
    In JavaScript, this kind of code is rarely implemented. Typically what you'll\
    \ do is pass an I/O call a \"callback\" that will need to run when the task is\
    \ completed. It would look like this:\n\n```\nUser.findById(100, function(user)\
    \ {\n  // Do something with user\n});\n```"
  merge: -1
