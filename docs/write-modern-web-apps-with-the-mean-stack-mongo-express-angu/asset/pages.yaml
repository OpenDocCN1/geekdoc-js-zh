  md: "# CODE COVERAGE\n\nIt is difficult to tell how well you're doing when it comes\
    \ to writing tests without a good metric like code coverage. While code coverage\
    \ won't tell you whether you're testing correctly, it will at least notify you\
    \ about bits of the codebase lacking tests. It's good to get a rough idea of what\
    \ to focus on and to tell how well you're improving your test area.\n\nThe best\
    \ tool I've found for test coverage with Node apps is the npm package called blanket.\
    \ It integrates with Mocha and is easy to set up. To set it up, first add the\
    \ package to your development dependencies:\n\n```\n$ install --save-dev blanket\n\
    ```\n\nNow you need to add a support file to instantiate and configure blanket.\
    \ Create the file test/server/support/coverage.js:\n\n```\nvar path = require('path')\n\
    var blanket = require('blanket')\n\nblanket({\npattern: [\n  path.resolve(__dirname,\
    \ '../../controllers')\n]\n});\n```\n\nThen require it on test runs by adding\
    \ it to your test/mocha.opts file:\n\n```\ntest/server\n--recursive\n--require\
    \ test/server/support/coverage\n```"
  merge: -1
