  md: "You can now run gulp dev:server to boot your app. It'll automatically restart\
    \ if there are any changes to files ending in .js. One annoying thing about it\
    \ is that it reboots even for non-Node code changes, causing a lot of restarts\
    \ while working on the app. To exclude non-Node files, add an ignore section to\
    \ the config:\n\n```\ngulp.task('dev:server', function () {\n  nodemon({\n   \
