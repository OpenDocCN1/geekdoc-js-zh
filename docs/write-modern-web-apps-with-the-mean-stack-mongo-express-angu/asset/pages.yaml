  md: "# BUILD CSS WITH GULP\n\nPretty much all web apps today use some kind of CSS\
    \ preprocessor (Sass, Less, Stylus, and so on). These have features such as variables\
    \ (to color codes in), mixins, includes, and so on.\n\nSass is probably the most\
    \ popular CSS preprocessor right now, but it has a couple of downsides. First,\
    \ it's really slow. Large apps can take several minutes to fully compile. It's\
    \ also written in Ruby, which would require you to install Ruby on your machines\
    \ and make sure it's configured properly.\n\nStylus is a newer CSS preprocessor\
    \ that has some features you won't find in Sass (powerful logic, to run Node is\
    \ inside, and an optional cleaner syntax. It's also written in Node, using it\
    \ is easy. For these reasons, you'll be using Stylus on this project. If you want\
    \ to use an alternate, though, it's a similar setup.\n\nYou won't be working with\
    \ CSS much in this book, so to get a quick example going, let's just change the\
    \ <h1> to be green.\n\nMy favorite part of Stylus is the flexibility in the syntax.\
    \ You are free to write the same CSS many different ways. Here's an example of\
    \ four ways to write the same Stylus.\n\nNormal syntax:\n\n```\nh1 {\n  color:\
    \ green;\n}\n```\n\nSemicolons are optional:\n\n```\nh1 {\n  color: green\n}\n\
    ```\n\nCurly braces are optional too:\n\n```\nh1\n  color: green\n```\n\nEven\
    \ the colon is optional:\n\n```\nh1\n  color  green\n```\n\nCreate a file css/app.styl\
    \ with one of those variations.\n\nNext, install gulp-stylus:\n\n```\n$ npm install\
    \ --save gulp-stylus\n```"
  merge: -1
