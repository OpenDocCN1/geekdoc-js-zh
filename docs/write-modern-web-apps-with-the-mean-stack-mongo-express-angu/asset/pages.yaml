    \ like so:\n\n```\n$scope.addPost = function () {\n$scope.posts.unshift({\n  username:\
    \ 'dickeyxxx',\n  body: $scope.postBody\n});\n```\n\nNow whatever the user enters\
    \ in the input field will be their post body. One issue is that the field doesn't\
