  md: "Inside /assets/js, define the service on the app object. It doesn't matter\
    \ if you do before or after the controller. Angular will automatically figure\
    \ out the order to load things when it runs.\n\nThe service to make the HTTP looks\
    \ like this:\n\n```\napp.service('PostsSvc', function ($http) {\n  this.fetch\
    \ = function () {\n    return $http.get('/api/posts');\n  }\n});\n```\n\nName\
    \ the service PostsSvc and then dependency inject $http. You then define a function\
    \ on the service called fetch that returns the $http promise for loading posts.\
    \ Dependency inject PostsSvc into the controller (replacing $http):\n\n```\napp.controller('PostsSvc',\
    \ function ($scope, PostsSvc) {\n```\n\nAnd replace the code that loads the posts\
    \ with the following:\n\n```\nPostsSvc.fetch().success(function (posts) {\n  $scope.posts\
    \ = posts\n});\n```\n\nIt might not seem like a huge improvement just yet, but\
    \ this allows you to consolidate all the logic in regard to reading posts into\
    \ one place. In a typical app, this might involve pagination, caching, authorization,\
    \ or even making multiple HTTP calls. It has a side benefit of making the code\
    \ easy to test in isolation.\n\nMake sure this code is still able to read the\
    \ posts from the API and add a .create(post) method to the service. The service\
    \ should now look like the following:\n\n```\napp.service('PostsSvc', function\
    \ ($http) {\n  this.fetch = function () {\n    return $http.get('/api/posts');\n\
    \  }\n  this.create = function (post) {\n    return $http.post('/api/posts', post);\n\
    \  }\n});\n```"
