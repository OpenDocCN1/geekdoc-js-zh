  md: '# HTML5 PUSHSTATE


    Enabling pushstate in Angular is easy; all you need to do is dependency inject

    $locationProvider and add this line to your ng/routes.js file:


    $locationProvider.html5Mode(true)


    This is all that needs to happen on the client; you can now remove the #s from
    the URLs. Still


    I don''t suggest doing this if you are just getting started, though. What often
    happens Angular will try to load things like template files that may not exist.
    When that happens, it loads the app again, which in turn tries to load the template
    file again. This results in a loop that won''t end and often crashes the browser
    window.


    It''s a problem in development mode only when you haven''t created files, but
    it does make debugging and development harder.'
