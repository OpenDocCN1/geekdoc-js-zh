  md: "# INSERTING DOCUMENTS\n\nNow you can add your first document to a new collection\
    \ called users.\n\n```\n> db.users.insert((name: 'Jeff Dickey', email: 'jeff@dickeyxxx.com',\n\
    roles: ['admin', 'operations'])\nWriteResult({ \"nInserted\": 1 })\n> \n```\n\n\
    # QUERYING DOCUMENTS\n\nNow that you've written your first document to the database,\
    \ you can retrieve it with the find command.\n\n```\ndb.users.find()\n{ \"id\"\
    : \"538fd19837651880ee24565f\", \"name\": \"Jeff Dickey',\n\"email\": \"jeff@dickeyxxx.com\"\
    , \"roles\": [ \"admin\", \"operations\" ] }\n> \n```\n\nMost of the data there\
    \ is exactly what you had before, except MongoDB has added an ObjectID attribute\
    \ for you to uniquely identify this record across an entire database. You can\
    \ get back a single record like this:\n\n```\n> db.users.find(ObjectId(\"538fd19837651880ee24565f\"\
    ))\n```\n\nOr if you wanted to look up by e-mail, you'd use this:\n\n```\n> db.users.find({email:\
    \ 'jeff@dickeyxxx.com'})\n```\n\nAnd by role, you'd use this:\n\n```\n> db.users.find({roles:\
    \ 'admin'})\n```\n\nSearching inside an array assumes you're matching any one\
    \ of the items in the array unless you pass an array in the query.\n\n> NOTE:\
    \ In case you haven't noticed, the query language here is JavaScript.\nEven in\
