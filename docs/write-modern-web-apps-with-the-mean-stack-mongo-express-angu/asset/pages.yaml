    But you''ll need to explicitly ask for this in POST /session since you actually
    need to pull the password hash in that case.


    With that final change, here is the final code for this authentication demo:


    ```

    var express = require(''express'')

    var jwt = require(''jwt-simple'')

    var app = express()

    var bcrypt = require(''bcrypt'')

    var User = require(''./user'')

    app.use(require(''body-parser'').json())

