  md: "```\n// find an element with a certain ng-model\nby.model('name')\n// find\
    \ an element bound to the given variable\nby.binding('binding')\n```\n\nLocators\
    \ can be used to get information about DOM elements and manipulate them. Once\
    \ you have located an element, you can use an action on it.\n\n```\n// click a\
    \ button or link\nelement(by.css('.mybutton')).click()\n```\n\n```\n// fill out\
    \ a text input\nelement(by.css('.username-input')).sendKeys('dickeyxxx')\n```\n\
    \nThese actions all happen asynchronously using promises.\n\n# CLICKING THE LOGIN\
    \ NAV LINK\n\nNow you can try to add your first locator to go to the login page.\
    \ First, add a CSS class to the login button in the nav bar you can use in your\
    \ test. Here is what my layouts/app.html con- for the nav bar:\n\n```\n<nav class='navbar\
    \ navbar-default'>\n  <div class='container\">\n    <ul class='nav navbar-nav\"\
    >\n      <li><a class='posts' href=\"/Posts\">Posts</a></li>\n    </ul>\n    <ul\
    \ ng-if='currentUser' class='nav navbar-nav navbar-right'>\n      <li><a class='register'\
    \ href='/register'>Register</a></li>\n      <li><a class='login' href='/login'>Login</a></li>\n\
    \    </ul>\n    <ul ng-if='currentUser' class='nav navbar-nav navbar-right'>\n\
    \      <li><a class='logout' href='# ng-click='logout()'>Logout</a></li>\n   \
    \ </ul>\n    <p ng-if='currentUser' class='navbar-text navbar-right'>\n      Signed\
    \ in as {{currentUser.username}}\n    </p>\n  </div>\n</nav>\n```\n\nI added classes\
    \ to a few of the elements to make it easy to use them in Protractor tests later.\
    \ The important one is the login link."
