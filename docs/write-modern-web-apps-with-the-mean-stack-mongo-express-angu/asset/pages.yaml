  md: '# SINGLE-SERVER VS. MULTISERVER ARCHITECTURE


    When deploying your software to servers, you''ll need to decide what software
    will run on what machine. In addition, you''ll need to decide which servers should
    be publicly accessible and which don''t need to be.


    For this guide you will be using a simple single-server setup that should be powerful
    enough for most applications, but it wouldn''t be challenging to move this to
    a multiserver setup.


    Later in this chapter I''ll have some tips on what to do in order to migrate to
    a multiserver architecture.'
