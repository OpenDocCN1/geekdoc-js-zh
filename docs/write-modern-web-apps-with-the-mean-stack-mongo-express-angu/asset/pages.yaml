  md: "# PUBLISHING EVENTS FROM THE CLIENT\n\nI'm using HTTP for all requests in this\
    \ app, but could use WebSockets as well. An example of this might be tracking\
    \ \"viewed\" flags on each post in the viewport of the browser for analytics.\
    \ This is something that can happen totally asynchronously and shouldn't bog down\
    \ the server.\n\nTo accomplish this, I would have a function on the PostsCtrl\
    \ to mark a post as viewed. This would turn tell a WebSocketSvc to deliver a message.\n\
    \nTo build the part of the code necessary to pass events from the client, you\
    \ should turn the run function into a service and give it a new function send\
    \ that will look similar to the Node code:\n\n```\nangular.module('app')\n.service('WebSocketSvc',\
    \ function ($rootScope) {\n  var connection\n  var connect = function () {\n \
    \   var url = 'ws://localhost:3000'\n    connection = new WebSocket(url)\n   \
    \ connection.onmessage = function (e) {\n      var payload = JSON.parse(e.data)\n\
    \      $rootScope.broadcast('ws:' + payload.topic, payload.data)\n    }\n  }\n\
    \  this.send = function (topic, data) {\n    var json = JSON.stringify({topic:\
    \ topic, data: data})\n    connection.send(json)\n  }\n})\n.run(function (WebSocketSvc)\
    \ {\n  WebSocketSvc.connect()\n  })\n\n```\n\nNote that you should dependency\
    \ inject the service into a run component. Angular lazy-loads the services when\
    \ needed, but there might be a controller that wants to listen to WebSocket events\
    \ without sending them. You could add WebSocketSvc as a dependency to each, but\
    \ it's a lot easier to add just this run component."
  merge: -1
