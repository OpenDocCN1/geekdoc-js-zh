  md: "# SETTING UP KARMA\n\nKarma has sort of a strange method of installing. First\
    \ you need to globally install the karma-cli package, and then you install Karma\
    \ into the project:\n\n```\n$ npm install --global karma-cli\n```\n\n```\n$ npm\
    \ install --save-dev karma\n```\n\nWhile you're installing packages, go ahead\
    \ and install some Karma plugins you'll need:\n\n```\n$ npm install --save-dev\
    \ karma-chai karma-mocha karma-phantomjs karma-launcher\n```\n\nNow create this\
    \ Karma config file at karma.conf.js:\n\n```\nmodule.exports = function(config)\
    \ {\nconfig.set({\n  frameworks: ['mocha', 'chai'],\n  files: [\n    'assets/angular/angular.js',\n\
    \    'assets/angular-route/angular-route.js',\n    'assets/angular-mocks/angular-mocks.js',\n\
    \    'ng/**/module.js',\n    'ng/**/*.js',\n    'test/ng/**/*.spec.js'\n  ],\n\
    \  reporters: ['progress'],\n  port: 9876,\n  colors: true,\n  logLevel: config.LOG_INFO,\n\
    \  autoWatch: true,\n  browsers: ['PhantomJS'],\n  singleRun: false\n});\n```"
