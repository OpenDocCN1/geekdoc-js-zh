  md: "# TESTING SPIES\n\nIn the tests you've built so far, you've simply been checking\
    \ whether data has been populated. Sometimes, though, you need to check whether\
    \ functions were called. Spies are a useful tool for this task. A spy wraps an\
    \ existing function and can tell you whether anything has called it and with what\
    \ arguments. The most popular tool for spies in JavaScript is Sinon, and Sinon\
    \ integrates very well with Mocha and Chai.\n\nFirst install the karma-sinon-chai\
    \ plugin-in:\n\n```\n$ npm install --save-dev karma-sinon-chai\n```\n\nThen add\
    \ it to karma.conf.js frameworks:\nframeworks: ['mocha', 'chai', 'sinon-chai']\n\
    \nThe example test you'll be looking at is making a post in the PostsSvc. First\
    \ let's create a test case for new posts in test/ng/posts.ctrl.spec.\n\n```\n\
