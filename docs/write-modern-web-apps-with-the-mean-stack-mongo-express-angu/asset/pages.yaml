  md: "# AUTHENTICATING SOCIAL POSTS\n\nRight now, the client is actually sending\
    \ the username of the posts. What should happen is that the server should find\
    \ out who the user is based on the JWT. This prevents users from modifying their\
    \ usernames.\n\nYou need to reuse the code in controllers/api/users.js to grab\
    \ the user's information from the JWT. This is a good time to introduce some custom\
    \ middleware in your Express app. Create the file auth.js in the root of the project:\n\
    \n```\nvar jwt = require('jwt-simple')\nvar config = require('./config')\n```\n\
    \n```\nmodule.exports = function (req, res, next) {\n  if (req.headers['x-auth'])\
    \ {\n    req.auth = jwt.decode(req.headers['x-auth'], config.secret)\n  }\n  next()\n\
    }\n```\n\nThis middleware will attach an auth object to the requests for you to\
    \ look up the current user's information.\nNow use this middleware in server.js\
    \ just before using all the controllers:\napp.use(require('./auth'))\n\nYou can\
    \ now use this code inside controllers/api/posts.js to find the current user's\
    \ username:\n\n```\nrouter.post('/', function (req, res, next) {\n  var post =\
    \ new Post({body: req.body.body})\n  post.username = req.auth.username\n  post.save(function\
    \ (err, post) {\n    if (err) { return next(err) }\n    res.json(201, post)\n\
    \  })\n})\n```"
