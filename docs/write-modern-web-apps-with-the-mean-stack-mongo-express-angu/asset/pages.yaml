  md: '# NOT QUITE UNIT TESTING


    The tests you will be writing for the Node stack are not quite unit tests. True
    unit unit tests wouldn''t perform tasks such as hitting a database back end. Writing
    true unit tests in Node is a laborious task and results in touchy code that requires
    constant updates to the test code for even simple tasks. I''ve found that testing
    Node apps at the controller level and checking for data with the models directly
    is a great way to build applications.


    That isn''t to say you can write true unit tests with Node; you certainly could,
    but these tests will generally be at a somewhat higher level—although nowhere
    near as high-level as the Protractor tests.


    Angular has powerful tools to break up the code into testable units, so in the
    next chapter you will be doing true unit tests.'
  merge: -1
