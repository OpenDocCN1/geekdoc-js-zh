- img_proc: true
  md: "# WEBSOCKETS IN YOUR SOCIAL APP\n\nYou can benefit from WebSockets in your\
    \ social application. It would be great if a user publishing a post from one browser\
    \ updated all the other browsers currently looking at the site.\n\nLike most elements\
    \ of coding in the MEAN stack, it's a good idea to build bits up at a time, testing\
    \ with basic tools. Here you'll need to use a tool wsc to connect straight to\
    \ the Node js WebSockets. Once you have it displaying new posts, you'll integrate\
    \ Angular to the WebSockets.\n\nNode doesn't come with built-in support for WebSockets,\
    \ but there are a few packages out there to help with it. My personal favorite\
    \ is ws. It is very basic and works just like the client code. It attaches to\
    \ any Node object, including one that is given to you by Express.\n\n# CONNECTING\
    \ TO A WS WEBSOCKET\n\nTo connect to a ws, first install ws into the social app:\n\
    \n```\n$ npm install --save ws\n```\n\nAlso, install ws globally (this will give\
    \ you access to the debugging tool wsc):\n\n```\n$ npm install --global ws\n```\n\
    \nNow create a file websockets.js. You will use this from server.js when loading\
    \ the app:\n\n```\nvar ws = require('ws')\nexports.connect = function (server)\
    \ {\n  var wss = new ws.Server({server: server})\n  wss.on('connection', function\
    \ (ws) {\n    ws.send('hello!')\n  })\n}\",\n```\n\nThis defines a function connect\
    \ that adds WebSockets to a Node server. When a client connects to a WebSocket,\
    \ the connection event will be called. You then send a message directly to that\
    \ new client to say \"hello!\"\n\nBefore you can use this, you need to reference\
    \ it in server.js. Edit the app.listen section to look like the following:\n\n\
    # ...\n\n```\nvar server = app.listen(3000, function () {\n  console.log('Server\
    \ listening on', 3000)\n}\nrequire('./websockets').connect(server)\n```"
  merge: -1
  pgno: 140
- img_proc: true
  md: "If you'd like, you can put the require up at the top of the file into a websocket\
    \ variable and reference it here down. I only put the require for conciseness\
    \ in the book.\n\nThat server object is actually from the Node core (http.Server).\
    \ Express's app.listen returns it, so the integration with ws is very easy.\n\n\
    Now try to connect your application. First boot the server and then run the following\
    \ wscat command:\n\n```\n$ wscat -c ws://localhost:3000\nconnected (press CTRL+C\
    \ to quit)\n< hello!\n```\n\nwscat is a tool that can be either a WebSocket server\
    \ or client. The -c option has inter-as a client. You immediately get the \"hello!\"\
    \ response from the server on connecting.\n\nTry experimenting with this a bit\
    \ before moving on. See whether you can get ws to echo back commands wscat sends.\n\
    \nNow that you have WebSockets connected, let's see whether you can get it to\
    \ publish new posts.\n\n# PUBLISHING NEW POST NOTIFICATIONS\n\nFor this section,\
    \ you'll be working with Node but having it post to wscat notifications on new\
    \ posts. You may have noticed the only way to send notifications from the server\
    \ is by ref-encing the object you get in the connection callback. You need to\
    \ be able to do a \"broad-cast\" and deliver a message to all clients at the same\
    \ time.\n\nFirst, let's track all clients in an array inside websockets.js:\n\n\
    ```\nvar _ = require('lodash')\nvar ws = require('ws')\nvar clients = []\n\nexports.connect\
    \ = function (server) {\n  var wss = new ws.Server({server: server})\n  wss.on('connection',\
    \ function (ws) {\n    clients.push(ws)\n  })\n\n  ws.on('close', function ()\
    \ {\n    _.remove(clients, ws)\n  })\n})\n```"
  merge: -1
  pgno: 141
- img_proc: true
  md: "On connection, you push the new client onto our array. When that client disconnects,\
    \ you remove it from the list using Lo-Dash. Removing is important since you would\
    \ get nasty errors attempting to send messages to disconnected clients. Feel free\
    \ to add console.log() statements inside this code to get an idea what is going\
    \ on.\n\nNow that you have a list of clients to send a broadcast message, let's\
    \ add a broadcast function to websockets.js:\n\n```\nexports.broadcast = function\
    \ (topic, data) {\nvar json = JSON.stringify({topic: topic, data: data});\nclients.forEach(function\
    \ (client) {\n  client.send(json)\n})\n}\n```\n\nHere you have defined a function\
    \ broadcast that takes two arguments: a topic (string) and data (the any type).\
    \ The topic is needed to differentiate a message corresponding to a new post or\
    \ any other reason the client is receiving. You simply generate JSON with these\
    \ arguments, loop through every client, and send them a message with the JSON.\n\
    \nBefore moving on, let's see whether it is working by broadcasting new client\
    \ connections. Add the following code inside the connect function of websockets.js:\n\
    \n```\nwss.on('connection', function (ws) {\n  clients.push(ws);\n  exports.broadcast('new\
    \ client joined')\n  # ...\n```\n\nTry adding two or three wsc connections in\
    \ different terminal windows to see whether the event is broadcasting correctly.\n\
    \nTo broadcast a message on new posts, simply require this websockets.js module\
    \ in the posts controller (posts.js) and call its broadcast function after Mongo\
    \ saves correctly. Pass the post object as well so the client will be able to\
    \ render it.\n\n```\nvar websockets = require('../../../websockets');\n# ...\n\
    router.post('/', function (req, res, next) {\n  var post = new Post(body: req.body.body);\n\
    \  post.username = req.auth.username;\n  post.save(function (err, post) {\n  \
    \  if (err) { return next(err) }\n    websockets.broadcast('new_post', post);\n\
    \    res.json(201, post)\n  })\n});\n```"
