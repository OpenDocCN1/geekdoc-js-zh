    \ return next(err)\n    res.json(201, post)\n  });\n});\n```\n\nFirst, you require\
    \ the Post model. When a request comes in, you build up a new instance\nof the\
    \ Post model with new Post(). Then, you save that Post model and return a JSON\
    \ rep-\nsresentation of the post model to the user with status code 201.\n\nWhile\
    \ it isn't totally necessary to return the JSON here, I like for my API actions\
    \ to\nto the client. The client can sometimes make use of it. It might be able\
    \ to use the _id field or show\ndata the server generated (such as the date field,\
    \ for example).\n\nNote the err line. In Node, it is common for code to return\
    \ callbacks like this that\nwith an error argument, and then the data is returned.\
    \ It's your responsibility to check\nwhether there is an error message and to\
    \ do something about it. In this case, you call\nnext() callback with an argument,\
    \ which triggers a 500 in Express. An error in this case\nwould typically handle\
    \ errors the database was having issues. Other programming languages use\nexceptions\
    \ like this, but Node might make the design decision to go with error\nobjects\
    \ because of its asynchronous nature. It's simply not possible to bubble up an\
    \ exce-\ntion with event code like Node.js.\n\nGo ahead and apply this endpoint\
    \ with curl or Postman. (Make sure you first restart\nyour server. Later you'll\
