  mdcn: "\n由于它在生产环境中的运行与开发环境相同，你实现了所谓的“开发生产一致性”（dev-prod parity）。开发生产一致性是指：生产环境应该尽可能与开发模式相似，以减轻生产特有的问题。\n\
    \n为了实现这一点，Express 带有内置的中间件来提供静态资源。你可以将其添加到 /controllers/static.js 中，与你的布局端一起：\n\
    \n```javascript\nvar express = require('express')\nvar router = express.Router()\n\
    ```\n\n```javascript\nrouter.use(express.static(__dirname + '/../assets'))\n```\n\
    \n`__dirname` 是一个指向当前文件目录的特殊变量，在你的案例中是 controllers。你正在从该目录向上移动一级，以便提供 /assets\
    \ 中的资源服务。\n\n你也可以使用 `process.cwd()`，它是 Node 进程当前的工作目录，但它往往根据启动进程的方式而变化。对于所有的 Node\
    \ Web 服务器，我更倾向于使用 `__dirname` 而不是 `process.cwd()`。\n\n设置完成后，尝试访问 http://localhost:3000/app.js。你应该能看到创建的原始\
    \ Javascript 脚本。然后将 /layouts/posts.html 中的 `<script>` 标签替换为引用服务器上脚本的标签。\n\n```html\n\
    <script src='/app.js'></script>\n```\n\n现在，你的 HTML 布局和 JavaScript 代码之间有了了更清晰的分离。\n\
    \n## 将 Angular 拆分为服务\n\n除了 Angular 提供的巧妙数据绑定外，它还提供了一个健壮的框架，可以将代码拆分为逻辑部分。服务（Services）是你为应用构建组件的方式之一。\n\
    \n在 Angular 中，控制器（controllers）每次在页面上出现和消失时都会创建和销毁。而服务只在需要时才创建。如果有多个组件想要使用某个服务，Angular\
    \ 将高效地使用同一个服务的实例。\n\n像注入 $scope 或 $http 一样注入服务并调用它们上的自定义函数。\n\nAngular 应用内部清晰的代码不应该放在控制器内部。这会让控制器感知过多的信息，不是良好的代码分离。现在，在构建应用时，我鼓励你先在控制器内部进行\
    \ HTTP 请求，一旦运行正常就将其拆分。这就是我构建应用的方式，与你之前做的 server.js 拆分类似，它允许更容易的迭代和实验。\n\n在 /assets/js\
    \ 内部，在 app 对象上定义服务。无论在控制器之前还是之后定义都没有关系。Angular 在运行时会自动确定加载内容的顺序。\n\n执行 HTTP 请求的服务看起来如下：\n\
    \n```javascript\napp.service('PostsSvc', function ($http) {\n  this.fetch = function\
    \ () {\n    return $http.get('/api/posts');\n  }\n});\n```\n\n将服务命名为 PostsSvc\
    \ 并注入 $http。然后在服务上定义一个名为 fetch 的函数，返回加载帖子的 $http promise。将 PostsSvc 注入到控制器中（替换\
    \ $http）：\n\n```javascript\napp.controller('PostsSvc', function ($scope, PostsSvc)\
    \ {\n```\n\n并将加载帖的代码替换为以下内容：\n\n```javascript\nPostsSvc.fetch().success(function\
    \ (posts) {\n  $scope.posts = posts\n});\n```\n\n这看起来可能还不是巨大的改进，但它允许你将与读取帖子相关的逻辑整合到一个地方。在典型的应用中，这可能涉及分页、缓存、授权，甚至进行多次\
    \ HTTP 请求。它的一个好处是让代码易于孤立测试。\n\n确保这段代码仍然能够从 API 读取帖子，并为服务添加一个 `.create(post)` 方法。现在服务看起来应该如下：\n\
    \n```javascript\napp.service('PostsSvc', function ($http) {\n  this.fetch = function\
    \ () {\n    return $http.get('/api/posts');\n  }\n  this.create = function (post)\
    \ {\n    return $http.post('/api/posts', post);\n  }\n});\n```\n\n然后在控制器中使用它：\n\
    \n```javascript\napp.controller('PostsCtrl', function ($scope, PostsSvc) {\n \
    \ $scope.addPost = function () {\n    if ($scope.postBody) {\n      PostsSvc.create({\n\
    \        username: 'dickeyxxx',\n        body: $scope.postBody\n      }).success(function\
    \ (post) {\n        $scope.posts.unshift(post)\n        $scope.postBody = null\n\
    \      })\n    }\n  }\n\n  PostsSvc.fetch().success(function (posts) {\n    $scope.posts\
    \ = posts\n  })\n})\n```\n\n现在你已经成功地将 Angular 代码模块化为逻辑部分。使用这种模式，可以以高效的方式管理即使是大型\
    \ Angular 代码库。\n\n## 下一步\n\n你现在已经完全集成了 Angular 和 Node，并有了应用程序第一个工作版本。在下一章中，我将引入\
    \ Gulp 作为一种管理应用资源构建的方法。\n\n## 第6 章\n### 使用 Gulp 自动化构建\n\n在上一章中，你学习了如何将 Angular\
    \ 与 Node API 集成。在本章中，你将学习如何使用 Gulp 自动化应用的构建步骤。\n\n## 引入 GRUNT 和 GULP\n\n所有现代 JavaScript\
