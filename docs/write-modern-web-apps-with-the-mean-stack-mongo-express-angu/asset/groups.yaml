    \      <li><a href='/register'>Register</a></li>\n      <li><a href='/login'>Login</a></li>\n\
    \    </ul>\n    <ul ng-if='currentUser' class='nav-nav-right'>\n      <li><a href='#'\
    \ ng-click='logout()'>Logout</a></li>\n    </ul>\n    <p ng-if='currentUser' class='navbar-text-right'>\n\
    \      Signed in as {{currentUser.username}}\n    </p>\n  </div>\n</nav>\n```\n\
    \nI added classes to a few elements to make it easy to use later. The important\
    \ one is the login link.\n\n# FIGURE 10.5 Social app login form\n\nYou are using\
    \ an unsupported command-line flag --ignore-errors. Stability and security will\
    \ suffer.\n\n| Posts | Register | Login |\n| :--- | :--- | :--- |\n| Username\
    \ | | |\n| Password | | |\n| | | Login |\n\n![](img/a45e66f1e25bfccba9780b8e48fa81d_164_0.png)\n\
    \nNow update your Protractor test to click the login button in test/e2e/making_a_post.spec.js:\n\
    ```javascript\ndescribe('making a post', function () {\nit('logs in and creates\
    \ new post', function () {\n  browser.get('http://localhost:3001')\n  element(by.css('nav\
    \ .login')).click()\n  // fill out and submit login form\n  // submit a new post\
    \ on the posts page\n  // the user should now see their post as the first post\
    \ on the page\n})\n```\n\nIf you run the test and it passes, it means Protractor\
    \ was probably successful in finding the login button, clicking it, and going\
    \ to the login form. Unfortunately, it probably happens too fast for you to be\
    \ able to see it in Chrome window. You could verify this by seeing login.html\
    \ loaded in the log, but a better way is to use the Protractor debugging tools.\n\
    \nAdd a pause statement to test/e2e/making_a_post.spec.js after clicking the login\
    \ button:\n```javascript\ndescribe('making a post', function () {\nit('logs in\
    \ and creates new post', function () {\n  browser.get('http://localhost:3001')\n\
    \  element(by.css('nav .login')).click()\n  browser.pause()\n  // ...\n})\n```\n\
    \nYou should now see the login form in the browser (see Figure 10.5).\n\n```bash\n\
