    \ in Chrome (or whatever dev tools you're using).\n\n# EXPRESS AUTHENTICATION\n\
    \nNow that you have Angular requesting a JWT through POST /api/sessions, let's\
    \ port over some of the code from the previous chapter to serve JWTs through your\
    \ app.\n\nFirst, create the user model based on the previous chapter in models/user.js:\n\
    \n```javascript\nvar db = require('../db');\nvar user = db.Schema({\n  username:\
    \ { type: String, required: true },\n  password: { type: String, required: true,\
    \ select: false }\n})\nmodule.exports = db.model('User', user)\n```\n\nRemember,\
    \ you set select: false on the password field so you don't send it down to the\
    \ client.\n\nNext, you'll need to store the private key for creating the JWTs\
    \ in a place that can be accessed by many parts of the Express app. This is a\
    \ good time to add a config file for your application.\n\nCreate a file config.js\
    \ in the root of the project:\n\n```javascript\nmodule.exports = {\n  secret:\
    \ 'supersecretkey'\n}\n```\n\nThis is a good place to put API keys, database configuration,\
    \ or settings that can change from development to production. You won't be doing\
    \ this now, but the convention is to set the NODE_ENV environment variable to\
    \ production when in production and check for that inside config.js.\n\nNow mount\
