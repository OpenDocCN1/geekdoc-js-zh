    \ bit of a learning curve, but it allows you to build applications quickly and\
    \ easily maintainable.\n\n## HOW IS ANGULAR DIFFERENT THAN QUERY?\n\nMost web\
    \ developers I know have a firm grasp of the JavaScript framework jQuery, so they\
    \ often wonder what Angular does that jQuery cannot.\n\nThe fundamental difference\
    \ between jQuery and Angular is imperative and declarative, respectively. In jQuery,\
    \ you apply JavaScript to manipulate the DOM, but in Angular you declare what\
    \ the DOM should look ahead of of time.\n\nQuery was built for the progressive-enhancement\
    \ Web. It is designed to augment an existing HTML page to provide interactivity.\
