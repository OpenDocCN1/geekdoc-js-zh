    \   .pipe(gulp.dest('assets'))\n})\n```\n\n开始看到 Gulp 模式了吗？执行 npm install，添加 `require()`，然后将其加入\
    \ `pipe()` 序列。大多数 Gulp 插件都是这样工作的。\n\n重新构建 `/assets/app.js` 现在应该产生以下结果：\n\n```\n\
    angular.module(\"app\").controller(\"PostsCtrl\",[\"scope\"],[\"PostsSvc\",function\n\
    (s,o){o.addPost=function(){if(o.postBody){s.create({username:\"dickeyxxx\",\n\
    body: o.postBody}).success(function(o){o.posts.unshift(o),\no.postBody=null}});s.fetch().success(function(o){o.posts=s})\n\
    angular.module(\"app\").service(\"PostsSvc\",[\"$http\"],function(t){this.fetch=\n\
    function(t){return t.get(\"/api/posts\")};this.create=function(s){return t.post\n\
    (\"/api/posts\",s)});\n```\n\n如果你在那里，将看到依赖数组是如何影响每个组件的。再次运行应用应该可以。\n\n# 文件更改时重新构建\n\
    \n现在 Angular 代码通过 gulp 进行合并和压缩，但每次做更改都运行一次将非常痛苦。在 Gulp 中创建一个文件监听器很容易，可以在每次发生更改时自动重新构建\
    \ JavaScript。\n\n这是一个当一个 Angular 文件更改时重新运行 `js` 的 Gulp 任务：\n\n```\ngulp.task('watch:js',\
    \ ['js'], function () {\n  gulp.watch('ng/**.js', ['js'])\n})\n```\n\n`gulp.watch`\
    \ 接收要监听的文件路径，然后是在文件被编辑时运行的任务数组。\n\n如果你运行 `gulp watch:js` 而不是 `gulp`，它将保持运行，每当\
    \ `/ng` 中的 JavaScript 文件发生变化时就会重新构建 JavaScript。注意我也将 `js` 任务作为依赖项。这样，当你第一次调用 `watch:js`\
    \ 时，即使在文件更改之前它会自动构建 JavaScript。\n\n拥有这样简单的设置至关重要。你的开发环境在构建应用程序时应该是无缝的，尽可能减少需要处理的事务。\n\
    \n# 6.2 无 source map 的日志错误\n\n![](img/a45e66f1e25bfccba9780b8e48fa81d_89_0.png)\n\
    \n```\nerror!\n  (anonymous function)\n    Invoke\n  Instantiate\n  (anonymous\
    \ function)\n    Invoke\n  getService\n    Invoke\n  Instantiate\n    (anonymous\
    \ function)\n    (anonymous function)\n    forEach\n\nangular.js:1411\nangular.js:3986\n\
    angular.js:3917\nangular.js:3986\nangular.js:3927\nangular.js:3869\nangular.js:3917\n\
    angular.js:3927\nangular.js:6592\nangular.js:3927\n```\n\n# 源地图\n\n压缩的另一个问题是它让调试代码变得困难。现在当浏览器显示\
    \ `console.log` 错误或弹出错误时，它无法轻易告诉你代码哪里引起了问题。让 Gulp 重新构建会在代码更改时保存你的代码，这对于构建应用程序不是必须的，但将来将为你节省大量工作。\n\
    \n首先，我将演示这个问题。在 `PostsSvc(ng/posts.svc.js)` 中添加行 `console.error('error!')`。如果你使用的是\
    \ Chrome，你应该能看到像 6.2 中所示的输出。\n\n它说错误发生在 `app.js` 的第 3 行，这完全没有帮助，因为通过包含原始 JavaScript\
    \ 的 source map，你可以为 Chrome 提供一个指南，显示出错误真正发生的地方。这对于调试非常有帮助。首先，你需要构建 source map。\n"
