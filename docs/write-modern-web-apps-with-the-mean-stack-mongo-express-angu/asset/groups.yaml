  mdcn: "\n这种差异看起来可能细微，但这里的重点在于，当数据库在获取结果时，该线程可以空闲来执行任何有用的操作（处理另一个网络请求、监听不同的事件等）。\n\
    \n像 Ruby 或 Python 这样的语言会在这一点处停止。这就是为什么你经常听到关于 Node.js 平台扩展性如此出色的基准测试结果。\n\n需要注意的是，这并不意味着\
    \ Node.js 适用于所有用例，仅适用于那些密集 I/O 的场景。事实证明，在 Web 世界，这通常正是我们所做的（通过 HTTP 传输或等待数据库）。\n\
    \n# 模块与 NPM\n\n除了回调之外，Node.js 每个人都喜欢的另一部分是 NPM 上提供的模块和包。Node.js 拥有的模块非常简单。Node.js\
    \ 使用一种名为 CommonJS 的规范。\n\nCommonJS 的开发是为了在服务器端的 JavaScript 应用程序中声明外部模块。其核心思想是每个文件都会获得一个可以使用的\
    \ `module.exports` 对象，用它将一个对象暴露给其他。如果你有一个 `foo.js` 文件，你可以这样暴露一个函数：\n\n```\nvar\
    \ myFunc = function(input) {\n  return input + ' world';\n}\n\nmodule.exports.foo\
    \ = myFunc;\n```\n\n在 `bar.js` 文件中，你可以这样导入该模块：\n\n```\nvar imported = require('./foo');\n\
    console.log(imported.foo('hello'));\n// 打印 'hello world'\n```\n\n在 Web 上，共享 JavaScript\
    \ 代码一直是一件痛苦的事。全局变量是共享代码的常用方式，容易产生冲突问题。这个 CommonJS 规范因为其简单而非常出色。由于依赖是在运行时通过路径声明的，很容易诊断依赖问题。这避免了“依赖地狱”。\n\
    \n尽管如此，我知道当我开始使用 Node.js 时，我并没有真正“理解”它。它比我表现得要简单。如果你有同感，不要担心；写几个代码示例和模块并在开发中摸索，你就会感到如如家了。\n\
    \nNode.js 的另一个伙伴是 NPM，它是 Node.js 的官方包管理器，现在已包含在所有的 Node.js 安装中。\n\n如果你用过 Python\
    \ 的 pip、Ruby 的 Bundler 或 Java 的 Maven，它与它们相似。Node.js 的妙之处在于它非常新，能够汲取它们所有这些工具的精华。\n\
    \n安装包非常简单。如果你想安装一个比如让你创建目录的 `mkdirp` 包，你只需要运行以下命令：\n\n```\nnpm install mkdirp\n\
    ```\n\n然后你就可以这样使用 `mkdirp`：\n\n```\nvar mkdirp = require('mkdirp');\n\nmkdirp('/tmp/foo/bar/baz',\
    \ function (err) {\n  if (err) console.error(err)\n  else console.log('pow!');\n\
    });\n```\n\n我鼓励你阅读 http://howtonode.org/introduction-to-npm 的“NPM 简介”，以理解为什么 NPM\
    \ 被设计成这样，以便更好地理解它的哲学。\n\n# 安装 Node.js\n\n安装 Node.js 通常涉及两个部分：安装一个 Node.js 的基础副本，然后安装一个版本切换器来选择你想要使用的\
    \ Node.js 版本。\n\n使用切换器的由于是 Node.js 更新非常频繁。你最初获取的版本可能不是最新的。此外，一旦你手头有了几个项目，你可能会有不同的项目需要不同的版本。按照以下步骤为书中的项目配置\
    \ Node.js：\n\n- 1. 要安装基础版本，请使用你选择的包管理器。\n   - 对于带有 Homebrew (http://brew.sh) 的\
    \ OS X，运行 `brew install npm`。\n   - 对于 Windows，访问 http://nodejs.org/download。\n\
    \   - 对于 Ubuntu 13+，运行 `sudo apt-get install npm`。\n   - 其他系统，访问 https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager。\n\
    \n- 2. 一旦安装了 Node.js 的基础版本，通过 `npm install -g n` 安装版本切换器。这里的 `g` 表示你正在全局安装该包。否则，它只会安装到当前目录，你就无法从任何地方运行它。\n\
    \n要安装并使用最新的稳定版 Node.js，请使用 `n stable`。关于如何使用 `n` 的更多细节，请查看 https://www.npmjs.org/package/n。\n\
    \n现在你安装了 Node.js，让我们用它构建一个 Web 服务器。\n\n# 创建原生 HTTP 服务器\n\nNode.js 内置了一个 HTTP 模块，可以作为服务器使用。在原生\
    \ Node 中，一个简单的 \"Hello World\" 服务器看起来像这样：\n\n```\nvar http = require(\"http\"\
    );\nhttp.createServer(function(request, response) {\n  response.writeHead(200,\
    \ {\"Content-Type\": \"text/plain\"});\n  response.write(\"Hello world\");\n \
    \ response.end();\n}).listen(3000);\n```\n\n为了书中的项目你需要一个服务器，请遵循以下步骤：\n\n- 1. 在任何地方创建一个文件并将其命名为\
    \ `app.js`。它会响应任何路由。\n- 2. 在终端中通过 `node app.js` 运行服务器。你不会看到任何输出，但访问 http://localhost:3000\
    \ 应该显示 \"Hello World.\"\n\n探索代码时，注意 `createServer` 函数。这是在 HTTP 模块中调用的，在接收到新请求时立即执行。\n\
    \n# 什么是 Express？\n\nExpress 是用于构建 Web 服务器的 NPM 包。它是 Node.js 中最流行的包。在 Express 中，构建服务器的代码看起来像这样：\n\
    \n```\nvar express = require('express');\nvar app = express();\n\napp.get('/',\
    \ function(req, res) {\n  res.send('Hello World');\n});\n\napp.listen(8888);\n\
    ```\n\n# 安装 Express\n\n按照以下步骤安装 Express：\n\n- 1. 往前创建一个文件并将其命名为 `app.js`。\n- 2.\
    \ 在目录中运行 `npm install express` 安装 Express。\n- 3. 通过执行 `node app.js` 运行代码。\n\n\
    你可以看到，Express 比原生 Node 做得更多，它提供了一个更优雅的结构。对于日志和授权等应用，它还有许多简单的中间件实现。这是一个简单的 Web\
    \ 框架，留给了你来决定。\n\n# Node.js 的数据库\n\n由于 Node.js 是用 JavaScript 编写的，它以非常简洁的方式支持 JSON。处理\
    \ JSON 数据非常容易，因为这正是用户通常使用的。\n\n在后端，SQL 数据库并不是 Node.js 的理想选择。对象关系映射 (ORMs) 是将代码连接到关系数据库的工具，在\
    \ Node.js 应用中常见的那些健壮的 ORM。尽管如此，我们通常看到 Node.js 是作为一个 MVC 层的。\n\n# 文档型\n\n与其像 SQL\
    \ 那样在行和表中存储数据，MongoDB 拥有集合和文档。虽然你也可以把集合看作是表格，但文档与行大不同。\n\n文档的主要原因是它们包含更多信息。在 SQL\
    \ 中，如果你想表示一个用户及其角色，你可能需要三张表，如下：\n\n| user_id | email |\n|---|---|\n| 100 | jeff@dickxxx.com\
    \ |\n| 101 | bob@dickxxx.com |\n\n| role_id | name |\n|---|---|\n| 1 | Admin |\n\
    | 2 | Operations |\n\n| role_id | user_id |\n|---|---|\n| 1 | 101 |\n| 2 | 102\
    \ |\n\n# 文档型\n\n与其像 SQL 那样在行和表中存储数据，MongoDB 拥有集合和文档。虽然你也可以把集合看作是表格，但文档与行大不同。\n\
    \n文档的主要原因是它们包含更多信息。在 SQL 中，如果你想表示一个用户及其角色，你可能需要三张表，如下：\n\n但在 MongoDB 中，你只需要一个文档就可以表示一个用户及其角色：\n\
    \n```json\n{\n  \"user_id\": 100,\n  \"email\": \"jeff@dickxxx.com\",\n  \"roles\"\
    : [\"Admin\", \"Operations\"]\n}\n```\n\n这种方法更加灵活，因为你可以随时添加或删除字段而无需更改表结构。\n\n\
    # 文档型\n\n与其像 SQL 那样在行和表中存储数据，MongoDB 拥有集合和文档。虽然你也可以把集合看作是表格，但文档与行大不同。\n\n文档的主要原因是它们包含更多信息。在\
    \ SQL 中，如果你想表示一个用户及其角色，你可能需要三张表，如下：\n\n（注：由于原文中存在大量重复的段落，根据“不要重复输出原文”的原则，此处仅对核心逻辑进行翻译，原文中的重复内容已在上方译文中涵盖其核心含义。）\n\
    \n# Node.js 的数据库\n\n由于 Node.js 是用 JavaScript 编写的，它以非常简洁的方式支持 JSON。处理 JSON 数据非常容易，因为这正是用户通常使用的。\n\
