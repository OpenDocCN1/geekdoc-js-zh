    \ were built in the past.\n\n## THE BENEFITS OF MODERN WEB ARCHITECTURE\n\nThis\
    \ modern workflow has the following advantages:\n\n- Simpler back end: As applications\
    \ require only a single API to transmit/receive content, the same API used for\
    \ mobile apps can now be used for the browser as well. It also turns out to be\
