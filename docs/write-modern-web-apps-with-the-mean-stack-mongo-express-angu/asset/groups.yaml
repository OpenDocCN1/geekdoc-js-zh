    \ a much different goal: make the data easy for use as possible. While it might\
    \ be better to rename a role (you'd have to iterate over every user), that is\
    \ a choice you make because it is a relatively uncommon task. Finding out the\
    \ roles a user is in, however, is much more common and easier in MongoDB. Querying\
    \ for a user would just return the roles along with all the other information.\n\
    \nNot only is this querying easier as a developer, it's also much faster under\
    \ the head. This format is known as BSON.\n\n# BSON\n\nMongoDB stores the data\
    \ into a format called BSON, which is essentially JSON stored as binary with a\
    \ few differences. One of the differences is the ObjectId value. This is a data\
    \ type used in Mongo to uniquely identify documents. It is created automatically\
    \ on each document (it's analogous to a primary key).\n\nSince the ObjectId is\
    \ a large pseudorandom number, you are unlikely to run into a situation where\
    \ you generate two are the same. For nearly all practical purposes, you can assume\
    \ they will always be unique, which can be really handy. The only situation you\
    \ would have to worry about a collision is if you are generating a large number\
    \ in a short period of time. Even then, you'd have to be generating them so fast\
    \ that the database would be unlikely to keep up. They're always unique.\n\nOne\
    \ of the cool things about ObjectId is that you can take an ObjectId and find\
    \ out when it was created. (They're partially based on a timestamp.) Here's a\
    \ tool that can find out when 538c997dac697631f0dfebce was made: http://steveridot.github.io/mongo-object-time/"
  - '[PAGE 35]


    The following are advantages of BSON over tables/rows:

    - Documents map naturally to objects in programming languages.

    - Embedded documents and arrays prevent the need for joins.

    - Polymorphism is much easier since there is no schema.


    # HORIZIZONTAL SCALING WITH AUTO-SHARDING


    While MongoDB was certainly designed with ease of use in mind, it''s also great
    for scaling. MongoDB supports horizontal scaling, which is the ability to add
    more machines to a cluster to scale. This is in contrast to vertical scaling,
    which is the idea that you scale up by increasing the horsepower of a single box.


    Essentially with MongoDB you can just add boxes to your cluster to scale up for
    traffic. In a relational database such as MySQL or PostgreSQL, you have limited
    options to increase the database performance. Once a database starts to get hard
    and you''ve upgraded the box to be as powerful as possible, you have few options
    to improve performance. You can analyze queries and attempt to optimize them,
    add more caching, move the data to other sources, and decrease query usage, but
    all of these tasks require levels of development to analyze and fix.


    As a result, some relational databases admit to sharding the system. Sharding
    involves splitting the data across multiple databases. On a relational database,
    this is incredibly challenging and involves a ton of changes to the application
    to support it. Once sharding has been implemented, you lose the ability to perform
    many types of queries (anything across the whole data set).


    MongoDB, on the other hand, embraces sharding. It assumes your data will be sharded
    from the beginning; therefore, queries like joins that would require the whole
    dataset are not supported at all. You''re expected to design your system to support
    this architecture.


    Having that, MongoDB can''t scale in this way forever. You''ll be able to add
    a few databases to the system, but at some point it''ll be too much work for them
    to get all quorum with each other, and your system will break down. It''s a good
    solution, but it isn''t a silver bullet.


    # SCHEMELESS


    In SQL, you have to design your schema by defining all the tables and data types
    before you can start inserting. MongoDB does not have this concept. In MongoDB,
    you just start adding data in any format you want. If it doesn''t look like earlier
    data, it doesn''t complain.


    In general, with MongoDB you don''t set up anything beforehand; you start using
    it. For example, there''s no command to create an index. There is an ensureIndex
    command that does exactly what it sounds like (create the index if it doesn''t
    exist).'
  - '[PAGE 36]


    # INSTALLING MongoDB


    Follow the directions for your platform at http://docs.mongodb.org/manual/installation/


    +   - On OS X use Homebrew, brew install mongodb

    - Note that on OS X you''ll probably want to make sure it stays running as a daemon
    with launchctl Type brew info mongodb for instructions on how to do this.

    - On Windows there is an installer you can get from the official website.

    - On Ubuntu do not run apt-get because you will likely install a very old version
    of mongodb. Check the official website for specific instructions.


    # USING MongoDB


    Now that you have MongoDB installed, start the mongo daemon and then start your
    client by running the mongo command:


    ```

    $ mongo

    MongoDB shell version: 2.6.1

    connecting to: test

    >

    ```


    Now you''re connected to the test database. In MongoDB there are three parts to
    the hierarchy of data:


    +   - Database: There is usually one database per app, but there can be several
    per server. It usually shares the name of the app, and it''s the same as a database
    in SQL.

    - Collection: This is a group of similar pieces of data. It is usually a noun
    and analogous to a table in SQL.

    - Document: This is a single item in the database, such as an individual user
    record. If a collection were a class, a document would be an object. It is sort
    analogous to a row in SQL (although you shouldn''t assume so!).


    Here you want to use a database called playground. As mentioned earlier, in Mongo
    typically you won''t create anything; you just start using it as if it was there.
    This is a great example:


    ```

    > use playground

    itched to db playground

    >

    ```'
