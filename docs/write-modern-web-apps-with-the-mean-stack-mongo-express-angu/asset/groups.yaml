    \  </li>\n</ul>\n```\n\n```html\n<script src='https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/angular.js'></script>\n\
    ```\n\n```javascript\n// create our app module\nvar app = angular.module('app',\
    \ []);\n\n// create the PostsCtrl module\n// dependency inject $scope\napp.controller('PostsCtrl',\
    \ function ($scope) {\n\n  // the function runs when the \"Add Post\" button is\
    \ clicked\n  $scope.addPost = function () {\n    // Only add a post if there is\
    \ a body\n    if ($scope.postBody) {\n      // unshift a new post into $scope.posts\n\
    \      $scope.posts.unshift({\n        username: 'dickeyxx',\n        body: $scope.postBody\
    \ // use the text entered\n      });\n      // clear out the input field\n   \
    \   $scope.postBody = null\n    }\n  }\n}\n```\n\n```javascript\n// starting data\n\
    $scope.posts = [\n{\n  username: 'dickeyxxx',\n  body: 'Node rules!'\n},\n{\n\
    \  username: 'jeffdickey',\n  body: 'trying out angular.js...'\n}\n])\n</script>\n\
    </body>\n</html>\n```\n\n# NEXT STEPS\n\nYou now have a fully functioning app\
    \ for posting status updates. As I'm sure you're astutely aware, the major problem\
    \ now is that it never persists. These posts disappear when the user closes the\
    \ browser window. You could persist them into the browser's local storage, but\
    \ that wouldn't allow you to share the data with other users (which is pretty\
    \ important for a social networking application).\n\nIn the next chapter, you'll\
    \ build an API for this application to persist the posts. Then in Chapter 5, you'll\
    \ integrate this Angular app with the Node API you've built.\n\n# CHAPTER 4\n\
    Building a Node.js API\n\nIn the previous chapter, you built a fully functioning\
    \ Angular app for posting status updates. In this chapter, you will build an API\
    \ for it to get a list of all the posts and to make a new post. The endpoints\
    \ will be as follows:\n\n- GET /api/posts returns a JSON array of all the posts.\
    \ This is similar to what you had in $scope.posts.\n\n- POST /api/posts expects\
    \ a JSON document containing a username and post body. It will save that post\
    \ in MongoDB.\n\n# THE STOCK ENDPOINT\n\nTo start, you'll use Node.js and Express\
    \ to build a stock /api/posts endpoint. First, inside a new folder, create a package.json\
    \ file like the following:\n\n```json\n{\n  \"name\": \"socialapp\"\n}\n```\n\n\
    The name can be anything you want, but try to ensure it doesn't conflict with\
    \ an existing package. package.json file is the only thing you need to make a\
    \ directory node project.\nNow that you have this, you can add express and body-parser\
    \ as dependencies:\n\n```bash\n$ cd <path-to-project-folder>\n$ npm install --save\
    \ express\n$ npm install --save body-parser\n```\n\nbody-parser is used for express\
    \ to read in JSON ON POST requests automatically.\nThe --save flag saves the dependency\
    \ to the package.json file so you know what versions of packages the app was built\
    \ with (and therefore depends on). In fact, if you open your package.json, you'll\
    \ see something similar to this:\n\n```json\n{\n  \"name\": \"socialapp\",\n \
    \ \"dependencies\": {\n    \"body-parser\": \"^1.4.3\",\n    \"express\": \"^4.4.4\"\
    \n  }\n}\n```\n\nNow that you've done this, you can require('express') to include\
    \ it in a node script.\n\nCreate a server.js file with the following contents:\n\
    \n```javascript\nvar express = require('express')\nvar bodyParser = require('body-parser')\n\
    \nvar app = express()\napp.use(bodyParser.json())\n\napp.get('/api/posts', function\
    \ (req, res) {\n  res.json({\n    username: 'dickeyxxxx',\n    body: 'node rocks!'\n\
    \  })\n})\n\napp.listen(3000, function () {\n  console.log('Server listening on',\
    \ 3000)\n})\n```\n\nTry running this file:\n\n- $ node server.js\n\nYou can access\
    \ it in your browser at http://localhost:3000/api/posts. You should see that your\
    \ stubbed JSON comes back.\n\nYou now have the basic Node request in place, so\
    \ you need to add the POST endpoint for adding posts and back it against MongoDB.\n\
    \n# CREATING POSTS VIA THE API\n\nLet's build the POST endpoint for creating posts.\
    \ Add this endpoint to server.js:\n\n```javascript\napp.post('/api/posts', function\
    \ (req, res) {\n  console.log('post received!')\n  console.log(req.body.username)\n\
    \  console.log(req.body.body)\n  res.send(201)\n})\n```\n\nThis is just a request\
    \ that checks to see whether you're reading the data properly. The client receive\
    \ only the HTTP status code 201 (created). It's good to build a lot of these stubbed-out\
    \ sorts of logic to check see whether your plumbing is in order when building\
    \ MEAN applications. Because you can't test a POST request using the browser,\
    \ you should check to see whether it is working using curl:\n\n```bash\ncurl -v\
    \ -H \"Content-Type: application/json\" -XPOST --data \\\n'{\"username\":\"dickeyxxx\"\
    , \"body\":\"node rules!\"}'\nlocalhost:3000/api/posts\n```\n\nIf you are unfamiliar\
    \ with curl, this says \"Make a POST request to localhost:3000/api/posts. be the\
    \ verbose.\" Setting your Content-Type header to json includes the JSON document\
    \ as the body.\n\nThe Content-Type header is necessary to be able to parse this\
    \ content into the friendly req.body.username objects from the JSON.\n\nIf the\
    \ command line isn't your thing, you can do this same thing using the great Postman\
    \ app for Chrome to test APIs. Regardless of what method you use, it is crucial\
    \ you test your APIs using such clients like this rather than building your app\
    \ in lockstep.\n\n# MongoDB MODELS WITH MONGOOSE\n\nTo interact with MongoDB,\
    \ you will be using the Mongoose ODM. It's a light layer on top of the Mongo driver.\
    \ To add the npm package, do this:\n\n- $ npm install --save mongoose\n\nIt'll\
    \ be good to keep this code modularized so your server.js file doesn't get huge.\
    \ Let's add a db.js file with some of the database connection logic:\n\n```javascript\n\
    var mongoose = require('mongoose')\nmongoose.connect('mongodb://localhost/social',\
    \ function () {\n  console.log('mongodb connected')\n})\nmodule.exports = mongoose\n\
    ```\n\nYou can get access to this mongoose instance by using the require function.\
    \ Now let's create a mongoose model to store the posts. Place this code in models/post.js:\n\
    \n```javascript\nvar db = require('../db')\nvar Post = db.model('Post', {\nusername:\
    \ { type: String, required: true },\nbody: { type: String, required: true },\n\
    date: { type: Date, required: true, default: Date.now }\n})\nmodule.exports =\
    \ Post\n```\n\nNow you have a model you can get with require. You can use it to\
    \ interact with the database.\n\n# USING MONGOOSE MODELS WITH\nTHE POST ENDPOINT\n\
    \nNow requiring this module will give you the Post model, which you can use inside\
    \ of your\nendpoint to create posts.\n\nIn server.js, change your app.post('/api/posts')\
    \ endpoint to the following:\n\n```javascript\nvar Post = require('./models/post')\n\
    app.post('/api/posts', function (req, res, next) {\n  var post = new Post({\n\
    \    username: req.body.username,\n    body: req.body.body\n  });\n  post.save(function\
    \ (err, post) {\n    if (err) return next(err)\n    res.json(201, post)\n  });\n\
    });\n```\n"
