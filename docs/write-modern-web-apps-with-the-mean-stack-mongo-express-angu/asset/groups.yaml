    \ the page with Angular from the beginning. Instead of \"I have this element and\
    \ I want to make it do X,\" you declare the page's structure based on the model.\n\
    \nAs an example, if you had a `<ul>` like the following:\n\n```\n<ul>\n  <li>Item\
