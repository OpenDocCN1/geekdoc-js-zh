  - "[PAGE 179]\n\n# SUPERTEST\n\nThe developers who created express also have a tool\
    \ designed to solve this problem called SuperTest. allows you to interact with\
    \ an express router in the similar way to making HTTP calls. This gives you a\
    \ nice abstraction from your controller's API to your test code.\n\n```\n$ npm\
    \ install --save-dev supertest\n```\n\nHere is a yet, full, example of using SuperTest\
    \ with Mocha:\n\n```\nvar request = require('supertest')\nvar express = require('express')\n\
    var app = express()\n```\n\n```\napp.get('/user', function(req, res){\n  res.status(200).send({\
    \ name: 'dickeyxxx' })\n})\n```\n\n```\ndescribe('GET /users', function () {\n\
    \  it('responds with proper json', function (done) {\n    request(app)\n    .get('/user')\n\
    \    .expect('Content-Type', /json/)\n    .expect({name: 'dickeyxxx'}, done)\n\
    \  })\n})\n```\n\nYou can run this by saving it to a file and running it with\
    \ the Mocha command.\nThe done callback is new. Mentioned in the previous chapter\
    \ that Mocha has powerful asynchronous tools for writing tests, and this done\
    \ callback is one of those. The done callback must be called within a timeout\
    \ period (it defaults to 2000ms). If it's not called, the test will fail. You\
    \ use it here as the final task that SuperTest has to call after the request is\
    \ returned. It's important since missing it might allow the test to finish before\
    \ assertions are run. The most common error in JavaScript testing is assertions\
    \ never being run since the test completes before asynchronous tasks return those\
    \ trigger assertions.\n\nBefore you can use SuperTest with your application, you'll\
    \ need to do a bit of refactoring to give you a base controller."
  - '[PAGE 180]


    # BASE ROUTER


    You can''t directly add the posts controller to SuperTest because it will be missing
    necessary middleware such as body-parser. You also can''t import the code in server.js
    that creates the base express parser since it doesn''t export the exp. You need
    access to a base router object that is used both by SuperTest and by server.js.


    Create a file controllers/index.js with the following content—taken mostly

    server.js:


    ```

    var router = require(''express'').Router()

    var bodyParser = require(''body-parser'')

    ```


    ```

    router.use(bodyParser.json())


    router.use(require(''../auth''))

    router.use(''/api/posts'', require(''./api/posts''))

    router.use(''/api/sessions'', require(''./api/sessions''))

    router.use(''/api/users'', require(''./api/users''))

    router.use(require(''./static''))

    ```


    ```

    module.exports = router

    ```


    Now replace server.js with the following that will use this new router object:


    ```

    var express = require(''express'')

    var logger = require(''morgan'')

    var websockets = require(''./websockets'')

    var app = express()

    ```


    ```

    app.use(logger(''dev''))

    app.use(require(''./controllers''))


    var port = process.env.PORT || 3000

    var server = app.listen(port, function () {

    console.log(''Server'', process.pid, ''listening on'', port)

    }

    websockets.connect(server)

    ```


    Run your application to make sure everything works.

    Running into situations where you need to restructure code in order to make it
    testable

    is a common occurrence when building applications. This is a a great example where
    testable

    code is also better code because server.js is much simpler now.'
  - "[PAGE 181]\n\n# USING THE BASE ROUTTER WITH SUPERTEST\n\nNow create a test support\
    \ file at test/server/support/api.js with following:\n\n```\nvar express = require('express')\n\
    var request = require('supertest')\nvar router = require('../../controllers')\n\
    ```\n\n```\nvar app = express(app)\napp.use(router)\n```\n\n```\nmodule.exports\
    \ = request(app)\n```\n\nThis code creates a new app using your new base router\
    \ and then returns it wrapped in SuperTest.\n\nYou can now include this file in\
    \ your posts controller test to see whether the GET request is working. Replace\
    \ test/server/controllers/api/post.spec.js with the following:\n\n```\nvar api\
    \ = require('../../support/api')\n```\n\n```\ndescribe('controllers.api.posts',\
    \ function () {\n  describe('GET /api/posts', function () {\n    it('exists',\
    \ function (done) {\n      api.get('/api/posts')\n      .expect(200)\n      .end(done)\n\
    \    }\n  })\n})\n```\n\nYou're actually testing the controller now. You're checking\
    \ to see whether it responds with a 200 status code."
- md: "\n# MODELS IN CONTROLLER TESTS\n\nTo improve your current test, you should\
    \ check to see whether the data API is returning actually the data in the database.\
    \ To do this, you should clear out the posts in MongoDB and add a discrete number\
    \ of posts.\n\nAdd these beforeEach to test/server/controllers/api/posts.spec.js:\n\
    \n```javascript\nvar Post = require('../../../../models/post');\n```\n\n```javascript\n\
    describe('controllers.api.posts', function () {\n  beforeEach(function (done)\
    \ {\n    Post.remove({});\n  })\n  describe('GET /api/posts', function () {\n\
    \    beforeEach(function (done) {\n      var posts = [\n        {body: 'post1',\
    \ username: 'dickeyxxx'},\n        {body: 'post2', username: 'dickeyxxx'},\n \
    \       {body: 'post3', username: 'dickeyxxx'}\n      ]\n      Post.create(posts,\
    \ done);\n    })\n  })\n  // ...\n```\n\nThe first filter will remove all the\
    \ posts from the database; the next one will add three. Note the use of the done\
    \ callback here. The done callback checks to whether the first argument to the\
    \ callback is an error (following Node condition) and, if it exists, will halt\
    \ execution and output the error. This saves you a bit of code from having to\
    \ write your own callbacks that check the error code.\n\nNow you need to do an\
    \ assertion to see whether there are exactly three posts returned by the API.\
    \ You could change the test to look like this:\n\n```javascript\nit('has 3 posts',\
    \ function (done) {\n  api.get('/api/posts')\n    .expect(200)\n    .expect(function\
    \ (posts) {\n      if (posts.body.length !== 3) {\n        return \"posts count\
    \ should be 3\";\n      }\n    })\n  .end(done)\n});\n```\n\nThis works since\
    \ returning a string inside a SuperTest expectation will throw an error. Still,\
    \ you have Chai to clean up your assertions.\nHere's a complete example of test/controllers/api/posts.spec.js\
    \ using Chai:\n\n```javascript\nvar expect = require('chai').expect\nvar api =\
    \ require('../support/api')\nvar Post = require('../../../models/post')\n\ndescribe('controllers.api.posts',\
    \ function () {\n  beforeEach(function (done) {\n    Post.remove({}, done)\n \
    \ })\n  describe('GET /api/posts', function () {\n\n    beforeEach(function (done)\
    \ {\n      var posts = [\n        {body: 'post1', username: 'dickeyxxx'},\n  \
    \      {body: 'post2', username: 'dickeyxxx'},\n        {body: 'post3', username:\
    \ 'dickeyxxx'}\n      ]\n      Post.create(posts, done)\n    })\n\n    it('has\
    \ 3 posts', function (done) {\n      api.get('/api/posts')\n        .expect(200)\n\
    \        .expect(function (response) {\n          expect(response.body).to.have.length(3)\n\
    \        })\n        .end(done)\n    })\n  })\n})\n```\n\nThis is a clean example\
    \ of testing the GET /api/posts endpoint. Now you will see how to test a more\
    \ complicated endpoint such as POST /api/posts that creates a new post on behalf\
    \ of the logged-in user.\n\n# TESTING CONTROLLERS WITH AUTHENTICATION\n\nFor you\
    \ to test the POST /api/posts endpoint, you need to not only create a user but\
    \ also get a valid JWT for that user. You could use the API to register a new\
    \ user and then log in and get a JWT, but that would become slow, and many endpoints\
    \ would require authentication.\nUsing the API would be testing a function that\
    \ is more than you need to do with Node tests.\n\nWhat you need is a function\
    \ that creates a new user and returns you your JWT. You're going to use jsonwebtoken\
    \ here.\n\n```bash\n$ npm install --save-dev jsonwebtoken\n```\n\nCreate the file\
    \ test/server/support/user.js with the following function that creates a new user\
    \ and returns it in a callback with their JWT:\n\n```javascript\nvar bcrypt =\
    \ require('bcrypt')\nvar jwt = require('jsonwebtoken')\nvar config = require('../../config')\n\
    var User = require('../../models/user')\n\nexports.create = function (username,\
    \ password, cb) {\n  var user = new User({username: username})\n  bcrypt.hash(password,\
    \ 10, function (err, hash) {\n    if (err) return cb(err)\n    user.password =\
    \ hash\n    user.save(function (err) {\n      if (err) return cb(err)\n      user.token\
    \ = jwt.sign({username: user.username}, config.secret)\n      cb(null, user)\n\
    \    })\n  })\n}\n```\n\nThis code is taken from the sessions controller and the\
    \ users controller. With this you can make authenticated calls inside your tests.\n\
    Open test/server/controllers/api/posts.spec.js and add two things. First add the\
    \ user support file at the top:\n\n```javascript\n// ...\nvar api = require('../../api')\n\
    var user = require('../../support/user')\n// ...\n```\n\nThen add the following\
    \ describe block for the POST endpoint after the GET /api/posts describe block:\n\
    \n```javascript\ndescribe('POST /api/posts', function () {\n  var token\n\n  beforeEach(function\
    \ (done) {\n    user.create('dickeyxxx', 'pass', function (err, user) {\n    \
    \  token = user.token\n      done(err)\n    })\n  })\n\n  beforeEach(function\
    \ (done) {\n    api.post('/api/posts')\n      .send({body: 'this is my post'})\n\
    \      .set('X-Auth', token)\n      .expect(201)\n      .end(done)\n  })\n\n \
    \ it('added 1 post', function (done) {\n    Post.findOne(function (err, post)\
    \ {\n      expect(post.body).to.equal('this is my post')\n      done(err)\n  \
    \  })\n  })\n})\n```\n\nThis test is split into three sections. First you create\
    \ the user and save their token in variable. Then you make the actual API call\
    \ you're testing to POST /api/posts. Finally you grab a post from the database\
    \ and see whether it matches you posted. The beforeEach that removes all the posts\
    \ in this spec is still running, checking one gives you good confidence that the\
    \ post again. Still, adding some randomness like you did in the Protractor test\
    \ wouldn't be a bad idea.\n\n# CODE COVERAGE\n\nIt is difficult to tell how well\
    \ you're doing when it comes to writing tests without a good metric like code\
    \ coverage. While code coverage won't tell you whether you're testing correctly,\
    \ it will at least notify you about bits of codebase lacking tests. It's good\
    \ to get a rough idea of what to focus on and tell how well you're improving your\
    \ test.\n\nThe best tool I've found for test coverage with Node apps is the npm\
    \ package called blanket. It integrates with Mocha and is easy to setup. To set\
    \ it up, first add the package to your development dependencies:\n\n```bash\n\
    $ install --save-dev blanket\n```\n\nNow you need to add a support file to instantiate\
    \ and configure blanket. Create the file test/server/support/coverage.js:\n\n\
    ```javascript\nvar path = require('path')\nvar blanket = require('blanket')\n\n\
    blanket({\n  pattern: [\n    path.resolve(__dirname, '../../controllers')\n  ]\n\
    });\n```\n\nThen require it on test runs by adding it to your test/mocha.opts\
    \ file:\n\n```\ntest/server\n--recursive\n--require test/server/support/coverage\n\
    ```\n\n![](img/a45e66f1e25bfccba9780be48fa81d_187_0.png)\n\nCreate a report by\
    \ using the new html-cov reporter in Mocha:\n\n```bash\n$ mocha -R html-cov >\
    \ coverage.html\n```\n\nAnd open it with a browser (see Figure 11.3):\n\n```bash\n\
    $ open coverage.html\n```\n\nYou now see your posts controller has 100 percent\
    \ code coverage!\n\n# THE NPM TEST COMMAND\n\nNode offers a place to put the command\
    \ you want to run for tests in package.json. When it is setup, you can run the\
    \ test suite of any project with a package json file by running npm test. This\
    \ is a good idea since it provides documentation for how to test your project\
    \ for other developers. For projects with multiple test suites (such as ours),\
    \ it allows developers to easily recall the command to run all the tests. It is\
    \ also useful as a continuous integration (CI) entry point.\n\nIt's a simple feature\
    \ but is certainly one worth using. Add the following section to your package.json:\n\
    \n```json\n\"scripts\": {\n  \"test\": \"./node_modules/.bin/mocha && ./node_modules/.bin/protractor\"\
    \n}\n```\n\nThen run it:\n\n```bash\n$ npm test\n```\n\nYou should see the Node\
    \ server tests run, and if they are successful, Protractor should execute afterward.\
    \ && tells your shell to run the left side first, and if it returns a zero status\
    \ code, run the next.\n\n# JSHINT\n\nNow that you have your npm script set up,\
    \ it's a good time to introduce JSHint. JSHint is a linting tool for JavaScript\
    \ used for consistent syntax with JavaScript code. Unlike some languages, the\
    \ JavaScript community doesn't have very solid standards on the \"right\" to write\
    \ code, so having a configured tool like this in each project is useful.\n\nInstall\
    \ JSHint into the project as a development dependency:\n\n```bash\n$ npm install\
    \ --save-dev jshint\n```\n\nThen add it as a step in the npm test script:\n\n\
    ```json\n\"scripts\": {\n  \"test\": \"./node_modules/.bin/mocha && ./node_modules/.bin/protractor\"\
    \n}\n```\n\nNote that there is a . after JSHint.\n\nYou'll see a warning that\
    \ installing JSHint globally and not into the project. I suggest for this situation\
    \ you install it into the project so other developers can just run npm test and\
    \ it will automatically lint any new code they've added.\n\nGenerally, though,\
    \ it's good idea to run JSHint inside your text editor every time it saves—which\
    \ you'll want to have JSHint installed globally for.\n\nRunning JSHint now will\
    \ be slow and probably going to result in many issues because it will look at\
    \ every .js file in the directory and subdirectories (including /assets and /node_modules).\
    \ You can tell JSHint to ignore files by adding a file .jshintignore at the root\
    \ of the project with directories/files to ignore. Here is an example:\n\nnode_modules\n\
    assets\ncoverage\n\nTo customize Jint, you'll want to create a file .jshint at\
    \ the root of the project. Here is a short example that configures JSHint for\
    \ Node projects and no semicolons:\n\n```json\n{\n  \"asi\": true,\n  \"node\"\
    : true\n}\n```\n\nYou can use different rules for different parts of the code,\
    \ and that config file .jshintrc in a subdirectory, will take precedence. For\
    \ the social app, it might make sense to have an Angular .jshintrc in /ng, a Node.js\
    \ one at the root, and one for the test suites.\n\nFor more on configuring JSHint,\
    \ check out the documentation at www.jshint.com. You will also find a .jshintrc\
    \ file inside my sample social app project on GitHub.\n"
  mdcn: "\n\n# 控制器测试中的模型\n\n为了改进你当前的测试，你应该检查数据 API 是否确实返回了数据库中的数据。为了做到这一点，你需要清除 MongoDB\
    \ 中的 posts（帖子）并添加少量特定数量的帖子。\n\n在 `test/server/controllers/api/posts.spec.js` 中添加这些\
    \ `beforeEach`：\n\n```javascript\nvar Post = require('../../../../models/post');\n\
    ```\n\n```javascript\ndescribe('controllers.api.posts', function () {\n  beforeEach(function\
    \ (done) {\n    Post.remove({});\n  })\n  describe('GET /api/posts', function\
    \ () {\n    beforeEach(function (done) {\n      var posts = [\n        {body:\
    \ 'post1', username: 'dickeyxxx'},\n        {body: 'post2', username: 'dickeyxxx'},\n\
    \        {body: 'post3', username: 'dickeyxxx'}\n      ]\n      Post.create(posts,\
    \ done);\n    })\n  })\n  // ...\n```\n\n第一个过滤器将从数据库删除所有的帖子；下一个将添加三个。注意这里使用了 `done`\
    \ 回调函数。`done` 回调会检查回调的第一个参数是否为错误（遵循 Node 约定），如果存在，它将停止执行并输出错误。这可以节省你编写自定义检查错误代码的回调函数的代码。\n\
    \n现在，你需要进行一个断言（assertion），以检查 API 返回的恰好是三个帖子。你可以将测试修改如下所示：\n\n```javascript\n\
    it('has 3 posts', function (done) {\n  api.get('/api/posts')\n    .expect(200)\n\
    \    .expect(function (posts) {\n      if (posts.body.length !== 3) {\n      \
    \  return \"posts count should be 3\";\n      }\n    })\n  .end(done)\n});\n```\n\
    \n这种方法有效有效，因为在 SuperTest 期望中返回一个字符串会抛出错误。尽管如此，你仍然可以使用 Chai 来清理你的断言。\n以下是使用 Chai\
    \ 的 `test/controllers/api/posts.spec.js` 完整示例：\n\n```javascript\nvar expect =\
    \ require('chai').expect\nvar api = require('../support/api')\nvar Post = require('../../../models/post')\n\
    \ndescribe('controllers.api.posts', function () {\n  beforeEach(function (done)\
    \ {\n    Post.remove({}, done)\n  })\n  describe('GET /api/posts', function ()\
    \ {\n\n    beforeEach(function (done) {\n      var posts = [\n        {body: 'post1',\
    \ username: 'dickeyxxx'},\n        {body: 'post2', username: 'dickeyxxx'},\n \
    \       {body: 'post3', username: 'dickeyxxx'}\n      ]\n      Post.create(posts,\
    \ done)\n    })\n\n    it('has 3 posts', function (done) {\n      api.get('/api/posts')\n\
    \        .expect(200)\n        .expect(function (response) {\n          expect(response.body).to.have.length(3)\n\
    \        })\n        .end(done)\n    })\n  })\n})\n```\n\n这是一个测试 `GET /api/posts`\
    \ 端点的整洁示例。现在你将看到如何测试一个更复杂的端点，例如 `POST /api/posts`，它代表代表登录用户创建一个新帖子。\n\n# 带有身份验证的控制器测试\n\
    \n为了测试 `POST /api/posts` 端点，你不仅需要创建一个用户，还需要为该用户获取一个有效的 JWT。你可以使用 API 注册新用户然后登录并获取\
    \ JWT，但那样会变慢，而且许多端点都需要身份验证。\n使用 API 将是测试一个比你用 Node 测试需要做的更多的函数。\n\n你需要的是一个创建一个新用户并返回你的\
    \ JWT 的函数。你在这里将使用 `jsonwebtoken`。\n\n```bash\n$ npm install --save-dev jsonwebtoken\n\
    ```\n\n创建文件 `test/server/support/user.js`，并包含以下函数，该函数创建一个新用户并在回调中返回它及其对应的 JWT：\n\
    \n```javascript\nvar bcrypt = require('bcrypt')\nvar jwt = require('jsonwebtoken')\n\
    var config = require('../../config')\nvar User = require('../../models/user')\n\
    \nexports.create = function (username, password, cb) {\n  var user = new User({username:\
    \ username})\n  bcrypt.hash(password, 10, function (err, hash) {\n    if (err)\
    \ return cb(err)\n    user.password = hash\n    user.save(function (err) {\n \
    \     if (err) return cb(err)\n      user.token = jwt.sign({username: user.username},\
    \ config.secret)\n      cb(null, user)\n    })\n  })\n}\n```\n\n这段代码取自会话控制器和用户控制器。通过它，你可以在测试中进行身份验证的调用。\n\
    打开 `test/server/controllers/api/posts.spec.js` 并添加两内容。首先在顶部添加用户支持文件：\n\n```javascript\n\
    // ...\nvar api = require('../../api')\nvar user = require('../../support/user')\n\
    // ...\n```\n\n然后在 `GET /api/posts` 的 `describe` 块之后添加以下针对 POST 端点的 `describe`\
    \ 块：\n\n```javascript\ndescribe('POST /api/posts', function () {\n  var token\n\
    \n  beforeEach(function (done) {\n    user.create('dickeyxxx', 'pass', function\
    \ (err, user) {\n      token = user.token\n      done(err)\n    })\n  })\n\n \
    \ beforeEach(function (done) {\n    api.post('/api/posts')\n      .send({body:\
    \ 'this is my post'})\n      .set('X-Auth', token)\n      .expect(201)\n     \
    \ .end(done)\n  })\n\n  it('added 1 post', function (done) {\n    Post.findOne(function\
    \ (err, post) {\n      expect(post.body).to.equal('this is my post')\n      done(err)\n\
    \  })\n  })\n})\n```\n\n这个测试被分为三个部分。首先，你创建用户并将他们的令牌保存在变量中。然后，你执行要测试的 `POST /api/posts`\
    \ 实际 API 调用。最后，你从数据库中获取帖子并检查它是否与你发布的帖子匹配。此 spec 中删除所有帖子的 `beforeEach` 仍在运行，检查其中一个可以让你很有信心帖子再次存在了。尽管如此，像你在\
    \ Protractor 测试中那样添加一些随机性也不是个坏主意。\n\n# 代码覆盖率\n\n如果没有像代码覆盖率这样良好的指标，很难判断你在编写测试时的表现如何。使用代码覆盖率来衡量你表现得如何。代码覆盖率可以告诉你你的测试覆盖了多少代码。\n\
    \n你需要一个计算代码覆盖率的工具。你将使用 `blanket`。\n\n```bash\n$ npm install --save-dev blanket\n\
    ```\n\n创建文件 `test/server/support/coverage.js`，包含以下函数，它会配置覆盖率：\n\n```javascript\n\
    var path = require('path')\nvar blanket = require('blanket')\n\nblanket({\n  files:\
    \ [\n    path.resolve(__dirname, '../../controllers')\n  ]\n});\n```\n\n在你的测试文件顶部添加以下内容：\n\
    \n```javascript\nrequire('./support/coverage')\n```\n\n现在当你运行测试时，你会看到代码覆盖率报告。\n\
    \n"
