    Now you have to integrate this into systemd. You can use the ExecReload config
    to give a reload command. Edit /etc/systemd/system/social-app.service to the following:


    ```

    [Service]

    WorkingDirectory=/home/web/mean-sample

    ExecStart=/usr/local/bin/node boot.js

    ExecReload=/bin/kill -HUP $MAINPID

    User=web

    Group=web

    Restart=always

    Environment=''NODE_ENV=production''

    StandardOutput=syslog

    StandardError=syslog

    SyslogIdentifier=social-app

    ```


    Now after reloading the configuration, you can perform a hot code reload with
    systemctl reload:


    ```

    # systemctl daemon-reload

    # systemctl reload social-app

    ```'
  - "[PAGE 245]\n\n# MULTISERVER MIGRATION\n\nIf you're building an app and anticipating\
    \ a heavy amount of traffic, it is worth your time to set up a multiserver cluster\
    \ for it. Having multiple machines is also a good way to prevent downtime since\
    \ you can route traffic around servers in maintenance.\n\nA few changes would\
    \ have to be made in this infrastructure to enable multiserver support. Adding\
    \ another app server would not be hard; it would simply be a matter of following\
    \ these instructions on a new server. The following sections are a few of the\
    \ steps that would need to be taken to achieve a multiserver system.\n\n# LOAD\
    \ BALANCER\n\nYou would need to introduce a load balancer into the setup to split\
    \ traffic between multiple app servers. I recommend either HAProxy or node-http-proxy\
    \ for this task. HAProxy is a bullet-proof load balancer that scales well. It\
    \ is a good tool with many features. It does a configuration that takes a little\
    \ to get used to, however.\n\n```\nnode-http-proxy is a simple HTTP proxy tool\
    \ in Node that can be used to build your own load balancer. Here is an example\
    \ that would balance traffic between two IP addresses with WebSocket support:\n\
    var httpProxy = require('http-proxy')\nvar http = require('http')\nvar proxy =\
    \ httpProxy.createProxyServer()\n```\n\n```\nvar urls = [\n  'http://107.170.225.113:3000',\n\
    \  'http://107.170.225.114:3000'\n]\n```\n\n```\nfunction randomUrl() {\n  return\
    \ urls[Math.floor(Math.random()*urls.length)]\n}\n```\n\n```\nvar server = http.createServer(function\
    \ (req, res) {\n  proxy.web(req, res, { target:randomUrl() });\n})\n```\n\n```\n\
    server.on('upgrade', function (req, socket, head) {\n  proxy.ws(req, socket, head,\
    \ { target: randomUrl() });\n})\n```\n\n```\nserver.listen(80)\n```"
  - '[PAGE 246]


    As you can see, there is a bit of custom code to write here, and you would have
    to build functionality that comes with HAProxy—such as sticky sessions. Still,
    the fact that it''s just JavaScript means that it''s flexible in terms of how
    you could use it.


    You could add this code to the project and then run it on a load balancer server
    under system you did for the app servers.


    # CENTRALIZED DATABASES


    Both Redis and MongoDB are currently hosted on the application box. Since you
    cannot have multiple databases in production (they would have their own data sets),
    you would need to move the servers to their own boxes.


    This is even true with MongoDB''s sharding (that is, the ability to spread one
    data set across many database servers). You need to be able to scale the database
    outside the application servers. You wouldn''t want to require all application
    servers to have a local database on them—there would likely be too many database
    servers in this case. MongoDB is good at sharding, but doing that across too too
    many machines is a problem.


    # PRIVATE NETWORKING


    To set up these databases, you''ll need to protect access to them. In Heroku,
    you were able to do this via authentication in the URL. That is one to protect
    access to services, but the safer way would be via IP address. Digital Ocean offers
    private networking, which gives you an extra IP address to bind to that only your
    servers can access. It''s just a matter of flipping a switch and then using private
    IP addresses instead of the public one. More information on that is available
    here: https://www.digitalocean.com/community/tutorials/how-to-set-up-and-use-digitalocean-private-networking.


    You need to either authentication or private networking if your application servers
    need to speak to the database servers.'
