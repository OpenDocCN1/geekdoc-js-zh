    \ in the next chapter.\n\n## WHAT IS ANGULAR.JS?\n\nAngular.js is a framework\
    \ for building applications inside the browser. It is targeted towards highly\
    \ interactive applications. Out of the box, it comes with many components useful\
    \ for building applications. It also provides the structure for highly modular,\
