    \n# 第 14 章\n部署到 Digital Ocean\n\n在上一章中，你学习了如何使用 PaaS Heroku 将社交应用投入生产环境。在本章中，你将学习如何使用\
    \ Digital Ocean 将相同的应用部署到服务器上。\n\n# 什么是 DIGITAL OCEAN？\n\nDigital Ocean 是一个简单的云服务器提供商。它提供成本最低的一些云服务器，并带有良好的\
    \ UI 和易于使用的工具。它可以与 AWS 或 Rackspace 相比，但我发现 Digital Ocean 操作更容易，而且也更便宜。\n\n诚然，Digital\
