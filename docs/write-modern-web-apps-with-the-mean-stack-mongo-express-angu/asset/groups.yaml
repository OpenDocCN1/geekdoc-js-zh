- md: "\n# NOT QUITE UNIT TESTING\n\nThe tests you will be writing for the Node stack\
    \ are not quite unit tests. True unit tests wouldn't perform tasks such as hitting\
    \ a database back end. Writing true unit tests in Node is a laborious task and\
    \ results in touchy code that requires constant updates to the test code for even\
    \ simple tasks. I've found that testing Node apps at the controller level and\
    \ checking for data with the models directly is a great way to build applications.\n\
    \nThat isn't to say you can write true unit tests with Node; you certainly could,\
    \ but these tests will generally be at a somewhat higher level—although nowhere\
    \ near as high-level as the Protractor tests.\n\nAngular has powerful tools to\
    \ break up the code into testable units, so in the next chapter you will be doing\
    \ true unit tests.\n\n# MOCHA FOR NODE\n\n```bash\n## -s/g/d/mean-sample:(master)\
    \ *\n$ -s/g/d/mean-sample:(master) # mocha\n\ncontrollers.api.posts\n  exists\n\
    \  1 passing |!|\n$ -s/g/d/mean-sample:(master) i\n```\n\nFIGURE 11.1 Mocha default\
    \ reporter\n\nYou used Mocha in the previous chapter to run your Protractor tests.\
    \ You'll continue your use of Mocha, but this time you'll be using it directly.\
    \ Let's get a basic test in your project just to make sure you have everything\
    \ working. We're testing the controller, so let's stub out a test for that. Create\
    \ a file at /test/server/controllers/api/posts.spec.js with the following:\n\n\
    ```javascript\nvar expect = require('chai').expect\nvar ctrl = require('../../controllers/api/posts')\n\
    ```\n\n```javascript\ndescribe('controllers.api.posts', function () {\n  it('exists',\
    \ function () {\n    expect(ctrl).to.exist\n  })\n})\n```\n\nThese kinds of tests\
    \ aren't that useful except to make sure your test suite is working. You can verify\
    \ it by running this test directly:\n\n```bash\n$ mocha test/server/controllers/api/posts.spec.js\n\
    ```\n\nLike your Protractor tests, though, it's useful to run a single command\
    \ that will run all of your tests. To configure that in Mocha, create a file at\
    \ /test/mocha.opts with the following content:\n\n```text\ntest/server\n--recursive\n\
    ```\n\nThis will default Mocha to running all the tests under /test/server. Read\
    \ the Mocha documentation on more about customizing this file.\n\nRun Mocha:\n\
    \n```bash\n$ mocha\n```\n\nYou should see spec output like Figure 11.1.\n\n# FIGURE\
    \ 11.2 Mocha Nyan Cat reporter\n\n```bash\n### -s/g/d/mean-sample:(master) * mocha\
    \ -R nyan\n1\nbe\nbe\n\npassing (1 test)\n### -s/g/d/mean-sample:(master) #\n\
    ```\n\nMocha comes with several reporters. This one is good for seeing what parts\
    \ of the code are being tested because it respects the describe and it used for\
    \ behavior-driven development (BDD). It can be verbose on a large test suite,\
    \ though.\n\nTo see the reporters you have, run this:\n\n```bash\n$ mocha --reporters\n\
    ```\n\nThen to select a reporter (in this case, the Nyan Cat reporter):\n\n```bash\n\
    $ mocha -R nyan\n```\n\n**Figure 11.2** shows the output.\n\nThe Nyan Cat reporter\
    \ might look a little silly—and it is—but I've actually found it to be one of\
    \ my favorite reporters for large projects since it is easy to guess when it will\
    \ be finished.\n\n# POST CONTROLLER\n\nThe posts API endpoints are the core functionality\
    \ of the application and the best target for you to test. As mentioned, it's good\
    \ for you to test the server at the controller level. Here is a simplified version\
    \ of the existing posts controller at /controllers/api/posts.js:\n\n```javascript\n\
    var router = require('express').Router()\nvar Post = require('../models/post')\n\
    \nrouter.get('/', function (req, res, next) {\n  Post.find(\n    .sort('-date')\n\
    \    .exec(function(err, posts) {\n      if (err) { return next(err) }\n     \
    \ res.json(posts)\n    })\n  )\n})\n\nrouter.post('/', function (req, res, next)\
    \ {\n  var post = new Post({body: req.body.body})\n  post.username = req.auth.username\n\
    \  post.save(function (err, post) {\n    if (err) { return next(err) }\n    pubsub.publish('new_post',\
    \ post)\n    res.status(201).json(post)\n  })\n})\n\nmodule.exports = router\n\
    ```\n\nImagine you want to test the GET action returning posts from the database.\
    \ With Mocha, you can leverage CommonJS to pull into this file, which exports\
    \ an express router. That router would be difficult to work with in a test, however.\
    \ This router is intended to be consumed by an express app, not by your custom\
    \ code.\n\n# SUPERTEST\n\nThe developers who created express also have a tool\
    \ designed to solve this problem called SuperTest. It allows you to interact with\
    \ an express router in the similar way to making HTTP calls. This gives you a\
    \ nice abstraction from your controller's API to your test code.\n\n```bash\n\
    $ npm install --save-dev supertest\n```\n\nHere is a yet, full, example of using\
    \ SuperTest with Mocha:\n\n```javascript\nvar request = require('supertest')\n\
    var ctrl = require('../../controllers/api/posts')\n```\n\n```javascript\ndescribe('controllers.api.posts',\
    \ function () {\n  it('exists', function () {\n    expect(ctrl).to.exist\n  })\n\
    })\n```\n\nWait, let me re-align based on the provided text flow which had some\
    \ jumps.\n\n# SUPERTEST (continued)\n\nThe developers who created express also\
    \ have a tool designed to solve this problem called SuperTest. It allows you to\
    \ interact with an express router in the similar way to making HTTP calls. This\
    \ gives you a nice abstraction from your controller's API to your test code.\n\
    \n```bash\n$ npm install --save-dev supertest\n```\n\nHere is a yet, full, example\
    \ of using SuperTest with Mocha:\n\n```javascript\nvar request = require('supertest')\n\
    var ctrl = require('../../controllers/api/posts')\n```\n\n(Note: The OCR text\
