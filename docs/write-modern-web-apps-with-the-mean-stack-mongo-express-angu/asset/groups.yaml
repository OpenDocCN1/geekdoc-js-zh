    \ the other unshift for the user posting the post; otherwise, the post will appear\
    \ twice. A nice side benefit of using WebSockets is that you no longer need that\
    \ code (although it was just one line).\n\nI'm not sure why `$scope.$apply()`\
    \ is necessary here, but without it the UI won't update.\nI think that `$scope.on`\
    \ should triggering a digest cycle, so it may be an Angular bug.\nRegardless,\
    \ adding `$scope.$apply()` solves the issue."
  - "[PAGE 146]\n\n# WEBSOCKET ARCHITECTURE\n\nWebSockets is still new technology,\
    \ and we're still finding good ways to leverage it. There are some factors you\
    \ certainly need to take into account when building an application with WebSockets.\n\
    \n# RECONNECTION\n\nIn development, our Node server often restarts, killing the\
    \ WebSocket. Even in production this is possible, so it's a good idea to have\
    \ the client reconnect on disconnection. To accomplish this, simply wrap the connection\
    \ logic in a function and call it a $timeout few seconds later. Here's an example:\n\
    \n```\nangular.module('app')\n.run(function ($rootScope, $timeout) {\n  (function\
    \ connect() {\n    var url = 'ws://localhost:3000'\n    var connection = new WebSocket(url)\n\
    \    connection.onclose = function (e) {\n      console.log('WebSocket closed.\
    \ Reconnecting...')\n      $timeout(connect, 10*1000)\n    }\n    connection.onmessage\
    \ = function (e) {\n      var payload = JSON.parse(e.data)\n      $rootScope.broadcast('ws:'\
    \ + payload.topic, payload.data)\n    }\n  })\n})\n()\n```\n\nBecause the close\
    \ event is called when a connection is unsuccessful, this will just keep retrying\
    \ forever. You could get fancier with this and do some exponential backoff to\
    \ first retry quickly but gradually reduce the reconnect frequency.\n\nYou will\
    \ miss out on any events sent during this time period. As a fallback, I would\
    \ use an HTTP endpoint to gather missing events if that is an issue."
  - '[PAGE 147]


    # FIGURE 9.1 What most people do


    # SOCKET WITH MESSAGES

    (what most people do)


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_147_0.png)


    # SECURITY


    Because WebSockets can connect on the same server as the HTTP, developers often
    assume that the user is authenticated on either one. Commonly, the initial part
    of the WebSocket handshake will be secure, but then the client is free to access
    anything. In the HTTP world, these would be new requests, but since WebSockets
    don''t need a new request every time, additional security is needed.


    To resolve this, use a JWT for every message the client sends just like you do
    on the HTTP side (see Figure 9.1).


    Keep in mind when using WebSockets. It''s just the sort of thing you''re not used
    to from our stateless HTTP past.'
  - '[PAGE 148]


    # MULTIPROCESS/MULTISERVER DESIGN


    Often when developers are writing an application to use WebSockets, they will
    design it running on a single process on a single machine, which is not a real-world
    scenario. Let''s imagine the social application for a bit. If you had a separate
    server up that was load balanced across the two, then you would have two arrays
    of users connected to each.


    When a post is created, the Node server will send the event only to users connected
    to the same server as the one it was created.


    This is a problem you need to address even on a single-box machine. In production,
    you''ll want to run two separate processes, causing the same problem since they
    have their own memory space. I''ve worked on a few projects that were designed
    like this, and it required some hefty refactoring down the road to resolve it.
    To catch things like this, I suggest multiprocess mode even in development (this
    is covered more in Chapter 11).


    The way you enable everyone to get notifications is by publishing the event to
    a central location everyone is listening to. Once, all processes on the servers
    will be notified and can reply to the correct recipients. For this, you will need
    a message broker set up in your infrastructure. Here are the three choices:


    +   - Redis pubsub feature is certainly the most common (easiest to set up) solution
    for messaging in Node.js. Redis is easy to learn and takes a short time to set
    up on any Unix machine. It is my go-to for not just messaging but many other things
    (such as queuing, caching, and data storage). I find it useful for web applications
    of any size. The website has interactive documentation, so you can try every feature
    right in the browser. It''s my top recommendation for nearly every use case.


    +   - AMQP (RabbitMQ) certainly has the most features as a message broker. It
    can provide a bulletproof messaging infrastructure with tons of flexibility and
    scalability options. It''s harder to set up and use than Redis, so I suggest it
    only if you know you will need it. Some of the features include fan-out messaging,
    replication, durability, and messaging guarantees. If you architect your platform
    well, these won''t be necessary and can be provided by the database indent.


    +   - ZeroMQ is somewhere in the middle of the road. It has some of the features
    you would find in AMQP to take advantage of complex messaging processes but is
    simpler than AMQP. If you want to clever messaging settings (pairing consumers
    together, RPC, fan-out, parallel), it might be a good option.


    To replicate this error, use the boot script at https://github.com/dickeyxxx/f9f0109d43c734fcbdf2.


    Simply put that into your codebase next to the server. .js file and execute it.
    It will use Node Cluster to spawn a new process for each CPU on your machine.
    If you load multiple browsers, you should see that adding a new post will update
    only some of the pages.'
- md: "\nTo fix this, it would be great to have a pubsub.js module in the root of\
    \ the project with a publish and subscribe function. This is how they should be\
    \ used in controllers/api/posts.js:\npubsub.publish('new_post', post) // called\
    \ after a post is created in MongoDB\n\n```javascript\n// the subscribe listens\
    \ to a new_post event at any time\n// subscribe takes a callback that will use\
    \ our existing websockets.broadcast\n// function to send a message to the clients\
    \ on the current process\npubsub.subscribe('new_post', function (post) {\n  websockets.broadcast('new_post',\n\
    })\n```\n\nSo long as the publish function is posting to a central message broker\
    \ and subscribe is listening to it, you can implement pubsub.js any way we like.\
    \ Here is an example implementation using Redis:\n\n```javascript\nvar redis =\
    \ require('redis')\nvar client = redis.createClient()\nexports.publish = function\
    \ (topic, data) {\n  client.publish(topic, JSON.stringify(data))\n}\nexports.subscribe\
    \ = function (topic, cb) {\n  var client = redis.createClient()\n  client.subscribe(topic)\n\
    \  client.on('message', function (channel, message) {\n    cb(JSON.parse(message))\n\
    \  })\n}\n```\n\nThis is a basic implementation. It creates a connection to the\
    \ local Redis instance and a publish function that sends JSON to a pubsub channel.\n\
    The subscription function will create a new connection for every subscription—Redis\
    \ requires this to use pubsub. When a message is received on the channel, it is\
    \ parsed as JSON and sent back to the listener. If you had multiple parts of the\
    \ code listening to the same event, it would be cheaper to use EventEmitter to\
    \ dispatch the events in JavaScript without making new TCP connections for each\
    \ subscription.\n\nTo use this in a real project, you would need to be pulling\
    \ the connection information from somewhere (environment variable or config.js)\
    \ instead of just connecting to localhost.\nDefinitely remember to use some kind\
    \ of pubsub with Node if you're going to be using WebSockets.\n\n# PUBLISHING\
    \ EVENTS FROM THE CLIENT\n\nI'm using HTTP for all requests in this app, but could\
    \ use WebSockets as well. An example of this might be tracking \"viewed\" flags\
    \ on each post in the viewport of the browser for analytics. This is something\
    \ that can happen totally asynchronously and shouldn't bog down the server.\n\n\
    To accomplish this, I would have a function on the PostsCtrl to mark a post as\
    \ viewed. This would tell a WebSocketSvc to deliver a message.\n\nTo build the\
    \ part of the code necessary to pass events from the client, you should turn the\
    \ run function into a service and give it a new function send that will look similar\
    \ to the Node code:\n\n```javascript\nangular.module('app')\n.service('WebSocketSvc',\
    \ function ($rootScope) {\n  var connection\n  var connect = function () {\n \
    \   var url = 'ws://localhost:3000'\n    connection = new WebSocket(url)\n   \
    \ connection.onmessage = function (e) {\n      var payload = JSON.parse(e.data)\n\
    \      $rootScope.broadcast('ws:' + payload.topic, payload.data)\n    }\n  }\n\
    \  this.send = function (topic, data) {\n    var json = JSON.stringify({topic:\
    \ topic, data: data})\n    connection.send(json)\n  }\n})\n.run(function (WebSocketSvc)\
    \ {\n  WebSocketSvc.connect()\n  })\n```\n\nNote that you should dependency inject\
    \ the service into a run component. Angular lazy-loads the services when needed,\
    \ but there might be a controller that wants to listen to WebSocket events without\
    \ sending them. You could add WebSocketSvc as a dependency to each, but it's a\
    \ lot easier to add just this run component.\n\n# DYNAMIC WEBSOCKET HOSTNAME\n\
    \nThe way you've configured your WebSocket service right now is hard-coded to\
    \ ws://localhost:3000. It would be good if you used the same hostname as the server\
    \ hosting the application in order to allow the application to be hosted on any\
    \ host or port.\n\nYou could write a function like this to take the hostname of\
    \ the page and replace the protocol with ws or wss—depending on whether you're\
    \ running over SSL.\n\n```javascript\nfunction websocketHost() {\n  if ($window.location.protocol\
    \ === \"https:\") {\n    return \"wss://\" + window.location.host\n  } else {\n\
    \    return \"ws://\" + window.location.host\n  }\n}\n```\n\nHere is a complete\
    \ example:\n\n```javascript\nangular.module('app')\n.service('WebSocketSvc', $rootScope)\
    \ {\n  function websocketHost() {\n    if ($window.location.protocol === \"https:\"\
    ) {\n      return \"wss://\" + window.location.host\n    } else {\n      return\
    \ \"ws://\" + window.location.host\n    }\n  }\n\n  var connection = function\
    \ () {\n    connection = new WebSocket(websocketHost())\n    connection.onmessage\
    \ = function (e) {\n      var payload = JSON.parse(e.data)\n      $rootScope.broadcast('ws:'\
    \ + payload.topic, payload.data)\n    }\n    this.send = function (topic, data)\
    \ {\n      var json = JSON.stringify({topic: topic, data: data})\n      connection.send(json)\n\
    \    }\n  };\n})\\.run(function (WebSocketSvc) {\n  WebSocketSvc.connect()\n})\n\
    ```\n\n# NEXT STEPS\n\nHaving WebSockets completes the functionality in the social\
    \ application. Now that you've built a complete application, you can move on to\
    \ making production ready. In the next three chapters, you'll integrate automated\
    \ testing.\n\n# CHAPTER 10\n\n## Performing End-to-End Testing\n\nIn the previous\
    \ chapter, you finished the core functionality of your application by adding WebSockets.\
    \ You’ll now ensure the stability with your application by adding testing. There\
    \ are two types of testing you will use in your project: end-to-end tests and\
    \ unit tests.\n\nEnd-to-end tests, also known as integration tests or feature\
    \ tests, are used to test the functionality of the application as if a user were\
    \ running it. They test all the components of the application from the UI down\
    \ to the database. These tests are slow but are best for catching errors.\n\n\
    Unit tests involve testing a component by itself. In Chapters 11 and 12 you will\
    \ write unit tests for the Node server and Angular, respectively. Unit tests work\
    \ well for test-driven development (TDD) and help ensure that an application has\
    \ solid architecture.\n\nA well-written application makes good use of both end-to-end\
    \ tests and unit tests.\n\n# SETTING UP PROTRACTOR\n\nProtractor is a tool developed\
    \ by the Angular team for running end-to-end tests in JavaScript applications.\
    \ It is not limited to Angular applications, but it is specifically designed for\
    \ them. It replaces the deprecated Angular Scenario Runner previously used for\
    \ end-to-end tests.\n\nProtractor is a Node.js application that uses WebDriver\
    \ and Selenium to run a browser such as Firefox or Chrome. It can be used to test\
    \ an application on multiple browsers, including mobile.\n\nTo get set Protractor,\
    \ first install it in the project as a development dependency:\n\n```\n$ npm install\
    \ --save-dev protractor\n```\n\nNOTE: Development dependencies are for those who\
    \ do not want to install on production. Protractor includes very large files for\
    \ an npm package, so not installing it on the production servers can save time\
    \ during deploys.\n\nProtractor comes with a utility for setting up WebDriver\
    \ with Selenium, which is a great feature because setting up that manually is\
    \ complex. Go ahead and perform that setup now:\n\n```\n$ /node_modules/.bin/webdriver-manager\
    \ update\n```\n\nYou should see output like the following:\n\n+   - Updating selenium\
    \ standalone\ndownloading http://selenium-release.storage.googleapis.com/2.42/\n\
    - selenium-server-standalone-2.42.2.jar...\n+   - Updating chromedriver\ndownloading\
    \ https://chromedriver.storage.googleapis.com/2.10/\n- chromedriver-mac32.zip...\n\
    chromedriver-2.10.zip downloaded to /Users/dickkeyxx/src/dickkeyxx/\n- mean-sample/node_modules/protractor/selenium/chromedriver-2.10.zip\n\
    selenium-server-standalone-2.42.2.jar downloaded to /Users/dickkeyxx/\n- src/github.com/dickkeyxx/mean-sample/node_modules/protractor/selenium/selenium-server-standalone-2.42.2.jar\n\
    \nNow that you have Protractor set up, you can move on to adding a testing framework\
    \ and finally writing your first test.\n"
  mdcn: "\n为了修复这个问题，如果在项目根目录下拥有一个 `pubsub.js` 模块，其中包含 `publish` 和 `subscribe` 函数将是非常棒的。它们在\
    \ `controllers/api/posts.js` 中的用法应该应该是这样的：\npubsub.publish('new_post', post) //\
    \ 在 MongoDB 中创建贴文后调用\n\n```javascript\n// subscribe 随时监听 new_post 事件\n// subscribe\
    \ 接收一个回调函数，该函数将使用我们现有的 websockets.broadcast\n// 函数来向当前进程的客户端发送消息\npubsub.subscribe('new_post',\
    \ function (post) {\n  websockets.broadcast('new_post',\n})\n```\n\n只要 `publish`\
    \ 函数是向中央消息中间件发布消息，且 `subscribe` 正在监听它，你就可以按照我们喜欢的方式实现 `pubsub.js`。这里是一个使用 Redis\
    \ 的示例实现：\n\n```javascript\nvar redis = require('redis')\nvar client = redis.createClient()\n\
    exports.publish = function (topic, data) {\n  client.publish(topic, JSON.stringify(data))\n\
    }\nexports.subscribe = function (topic, cb) {\n  var client = redis.createClient()\n\
    \  client.subscribe(topic)\n  client.on('message', function (channel, message)\
    \ {\n    cb(JSON.parse(message))\n  })\n}\n```\n\n这是一个基础实现。它创建了一个到本地 Redis 实例的连接，以及一个发送\
    \ JSON 发到 pubsub 通道的 `publish` 函数。\n订阅函数会为每个订阅创建一个新连接——Redis 需要这样做来使用 pubsub。当在通道上接收到消息时，它会被解析为\
    \ JSON 并传回监听者。如果你在代码中有多个部分监听同一个事件，那么使用 `EventEmitter` 在 JavaScript 中分发事件会比为每个订阅创建新的\
    \ TCP 连接更具廉效益。\n\n要在实际项目中使用它，你需要从某处（环境变量或 `config.js`）获取连接信息，而不仅仅是连接到 `localhost`。\n\
    如果你打算使用 WebSockets，务必记得在 Node 中使用某种 pubsub 机制。\n\n# 从客户端发布事件\n\n我在此应用中对所有请求都使用了\
    \ HTTP，但也可以使用 WebSockets。一个例子可能是为了分析，跟踪浏览器视口中每篇贴文的“已查看”标记。这种操作可以完全异步进行，并且不应该拖慢服务器。\n\
    \n为了实现这一点，我会在 `PostsCtrl` 上编写一个函数将贴文标记为已查看。这将告诉 `WebSocketSvc` 发送一条消息。\n\n要构建从客户端传递事件所需的代码部分，你应该将\
    \ `run` 函数转换为一个服务，并给它一个新的 `send` 函数，其看起来将与 Node 代码类似：\n\n```javascript\nangular.module('app')\n\
    .service('WebSocketSvc', function ($rootScope) {\n  var connection\n  var connect\
    \ = function () {\n    var url = 'ws://localhost:3000'\n    connection = new WebSocket(url)\n\
    \    connection.onmessage = function (e) {\n      var payload = JSON.parse(e.data)\n\
    \      $rootScope.broadcast('ws:' + payload.topic, payload.data)\n    }\n  }\n\
    \  this.send = function (topic, data) {\n    var json = JSON.stringify({topic:\
    \ topic, data: data})\n    connection.send(json)\n  }\n})\n.run(function (WebSocketSvc)\
    \ {\n  WebSocketSvc.connect()\n  })\n```\n\n注意，你应该将服务作为依赖注入到 `run` 组件中。Angular\
    \ 会在需要时懒加载服务，但可能某个控制器想要监听 WebSocket 事件而不发送它们。你可以将 `WebSocketSvc` 添加为每个组件的依赖，但只添加此\
    \ `run` 组件要简单得多。\n\n# 动态 WebSocket 主名\n\n你现在配置 WebSocket 服务的方式是硬编码为 `ws://localhost:3000`。为了让应用能够在不同的环境中运行，它应该是根据环境来配置的。你可以编写一个函数来根据当前协议动态决定是使用\
    \ `ws` 还是 `wss`：\n\n```javascript\nfunction websocketHost() {\n  if (location.protocol\
    \ === \"https:\") {\n    return \"wss://\"\n  } else {\n    return \"ws://\"\n\
    \  }\n}\n```\n\n这里是一个完整的示例：\n\n```javascript\nangular.module('app')\n.service('WebSocketSvc',\
    \ function ($rootScope) {\n  var connection\n  var connect = function () {\n \
    \   var url = websocketHost() + 'localhost:3000'\n    connection = new WebSocket(url)\n\
    \    connection.onmessage = function (e) {\n      var payload = JSON.parse(e.data)\n\
    \      $rootScope.broadcast('ws:' + payload.topic, payload.data)\n    }\n  }\n\
    \  this.send = function (topic, data) {\n    var json = JSON.stringify({topic:\
    \ topic, data: data})\n    connection.send(json)\n  }\n})\n.run(function (WebSocketSvc)\
    \ {\n  WebSocketSvc.connect()\n  })\n```\n\n# 后续步骤\n\n拥有 WebSockets 是应用的核心功能。现在你已经完成了核心功能，可以转向生产就绪。\n\
    \n# 第 10 章\n\n## 执行端到端测试\n\n在上一节中你通过添加 WebSockets 完成了应用的功能。现在将通过自动化测试确保应用的稳定性。你将使用两种测试类型：端到端测试和单元测试。\n\
    \n端到端测试被称为集成测试或功能测试，用于像用户运行程序一样测试从 UI 到数据库的所有组件。这些测试运行较慢，但对于发现错误非常有帮助。\n\n单元测试涉及组件本身的测试。在第\
    \ 11 和 12 章中，你将分别为 Node 服务器和 Angular 编写单元测试。单元测试适用于测试驱动开发 (TDD)，并有助于确保架构的健壮。\n\
    \n良好的应用程序会充分利用端到端测试和单元测试。\n\n# 设置 Protractor\n\nProtractor 是 Angular 团队开发的用于在\
    \ JavaScript 应用中运行端到端测试的工具。它不仅限于 Angular 应用，但是专门为它们设计的。它取代了以前使用的 Angular Scenario\
    \ Runner。\n\nProtractor 是一个使用 WebDriver 和 Selenium 浏览器（如 Firefox 或 Chrome）的 Node\
    \ 应用。它可以用于移动。\n\n要设置 Protractor，首先将其作为开发依赖引入项目：\n\n```\n$ npm install --save-dev\
    \ protractor\n```\n\n注意：开发依赖适用于不想在生产环境中安装的用户。Protractor 包含非常大的文件，不安装它可以节省部署时间。\n\
    \nProtractor 自带一个设置 Selenium 的工具，这是一个非常棒的功能，因为手动设置非常复杂。现在去执行该设置：\n\n```\n$ /node_modules/.bin/webdriver-manager\
    \ update\n```\n\n你应该会看到类似下面的输出：\n\n+   - Updating selenium standalone\ndownloading\
    \ http://selenium-release.storage.googleapis.com/2.42/\n- selenium-server-standalone-2.42.2.jar...\n\
    +   - Updating chromedriver\ndownloading https://chromedriver.storage.googleapis.com/2.10/\n\
    - chromedriver-mac32.zip...\nchromedriver-2.10.zip downloaded to /Users/dickkeyxx/src/dickkeyxx/\n\
    - mean-sample/node_modules/protractor/selenium/chromedriver-2.10.zip\nselenium-server-standalone-2.42.2.jar\
    \ downloaded to /Users/dickkeyxx/\n- src/github.com/dickkeyxx/mean-sample/node_modules/protractor/selenium/selenium-server-standalone-2.42.2.jar\n\
    \n现在你已经设置好了 Protractor，可以开始添加测试框架并最终编写你的第一个测试用了。\n\n"
