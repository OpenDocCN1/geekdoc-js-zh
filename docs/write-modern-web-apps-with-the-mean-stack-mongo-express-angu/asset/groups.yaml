  - '[PAGE 138]


    # HOW WEBSOCKETS WORK


    WebSockets works similarly to the low-level TCP layer. It provides a full-duplex
    channel between your server and the client. It allows either the client or the
    server to pass messages as strings to one another, unlike TCP, which only sends
    bytes back and forth.


    On a WebSocket-enabled site, a bit of JavaScript will be run to tell the browser
    to make a WebSocket connection. Once it''s made, it provides an event callback
    for messages. It''s really easy to make a connection from a browser:


    ```

    var connection = new WebSocket(''ws://mysite.com'')

    connection.onmessage = function (e) {

    console.log(''message received: '', e.data)

    }

    ```


    Again, no libraries are used here. Simply make a new WebSocket object and attach
    a function to its onmessage event. After it connects, any messages sent from the
    server will be delivered to this callback.


    Typically e.data attribute will contain a bit of JSON we will parse, but it could
    be any string or binary blob.

    Sending events is easy as well:


    ```

    var connection = new WebSocket(''ws://mysite.com'')

    connection.onmessage = function (e) {

    console.log(''message received: '', e.data)

    connection.send(''get your message: '' + e.data)

    }

    ```


    You can send messages at any time, not just after receiving one. Because the connection
    is created asynchronously, you can''t just call connection. send() directly after
    creating the connection object, however. If you wanted to send a message right
    after connecting, you could use the onopen event:


    ```

    var connection = new WebSocket(''ws://mysite.com'')

    connection.onopen = function () {

    connection.send(''hello!'')

    }

    ```


    Unlike HTTP, the server side of this code looks similar; however, you need to
    use a package for it since it is not built into Node.js.


    Using this technology, you can cause the browser to react to changes from any
    other system easily. For the social application you''ve been building, you''ll
    add functionality so that if any user posts an update, all others will see the
    update pop live.'
  - '[PAGE 139]


    # WHAT SHOULD YOU USE WEBSOCKETS FOR?


    WebSockets can be used for any kind of client-server communication. There isn''t
    really any overhead to using it instead of HTTP. You could remove HTTP from your
    social application and do all the data loading and posting via WebSockets, including
    authentication.


    It can have real benefits when it comes to loading data. The client could request
    small deltas of the data rather than relying on HTTP to deliver all the content
    every time it''s loaded. An architecture like this would work extremely well in
    an offline context. When it come online, it could just sync all new data from
    both sides.


    A setup like this might be good for mobile apps, apps that have very live and
    interactive content (like games), or anywhere else there would be a lot of thrashing
    of duplicate data via HTTP.


    The trouble with WebSockets is that it maintains a persisting connection resulting
    in a stateful design. State makes distributed computing difficult and forces you
    to deal with problems such as connection loss. It also adds a significant amount
    of entropy to a system—in other words, many different states means many different
    ways bugs can crop up. Therefore, a WebSocket-based platform can be tougher to
    develop on than a traditional, stateless HTTP-based platform.


    For this reason, unless you''re building something like a game, I suggest you
    use WebSockets only for notifications from the server to the client. It''s still
    useful to deliver new content, notifications, or progress updates, but using HTTP
    for everything else saves you from the complexity that comes from a stateful architecture.


    Find the balance that works for you, though.'
  - "[PAGE 140]\n\n# WEBSOCKETS IN YOUR SOCIAL APP\n\nYou can benefit from WebSockets\
    \ in your social application. It would be great if a user publishing a post from\
    \ one browser updated all the other browsers currently looking at the site.\n\n\
    Like most elements of coding in the MEAN stack, it's a good idea to build bits\
    \ up at a time, testing with basic tools. Here you'll need to use a tool wsc to\
    \ connect straight to the Node js WebSockets. Once you have it displaying new\
    \ posts, you'll integrate Angular to the WebSockets.\n\nNode doesn't come with\
    \ built-in support for WebSockets, but there are a few packages out there to help\
    \ with it. My personal favorite is ws. It is very basic and works just like the\
    \ client code. It attaches to any Node object, including one that is given to\
    \ you by Express.\n\n# CONNECTING TO A WS WEBSOCKET\n\nTo connect to a ws, first\
    \ install ws into the social app:\n\n```\n$ npm install --save ws\n```\n\nAlso,\
    \ install ws globally (this will give you access to the debugging tool wsc):\n\
    \n```\n$ npm install --global ws\n```\n\nNow create a file websockets.js. You\
    \ will use this from server.js when loading the app:\n\n```\nvar ws = require('ws')\n\
    exports.connect = function (server) {\n  var wss = new ws.Server({server: server})\n\
    \  wss.on('connection', function (ws) {\n    ws.send('hello!')\n  })\n}\",\n```\n\
    \nThis defines a function connect that adds WebSockets to a Node server. When\
    \ a client connects to a WebSocket, the connection event will be called. You then\
    \ send a message directly to that new client to say \"hello!\"\n\nBefore you can\
    \ use this, you need to reference it in server.js. Edit the app.listen section\
    \ to look like the following:\n\n# ...\n\n```\nvar server = app.listen(3000, function\
    \ () {\n  console.log('Server listening on', 3000)\n}\nrequire('./websockets').connect(server)\n\
    ```"
  - "[PAGE 141]\n\nIf you'd like, you can put the require up at the top of the file\
    \ into a websocket variable and reference it here down. I only put the require\
    \ for conciseness in the book.\n\nThat server object is actually from the Node\
    \ core (http.Server). Express's app.listen returns it, so the integration with\
    \ ws is very easy.\n\nNow try to connect your application. First boot the server\
    \ and then run the following wscat command:\n\n```\n$ wscat -c ws://localhost:3000\n\
    connected (press CTRL+C to quit)\n< hello!\n```\n\nwscat is a tool that can be\
    \ either a WebSocket server or client. The -c option has inter-as a client. You\
    \ immediately get the \"hello!\" response from the server on connecting.\n\nTry\
    \ experimenting with this a bit before moving on. See whether you can get ws to\
    \ echo back commands wscat sends.\n\nNow that you have WebSockets connected, let's\
    \ see whether you can get it to publish new posts.\n\n# PUBLISHING NEW POST NOTIFICATIONS\n\
    \nFor this section, you'll be working with Node but having it post to wscat notifications\
    \ on new posts. You may have noticed the only way to send notifications from the\
    \ server is by ref-encing the object you get in the connection callback. You need\
    \ to be able to do a \"broad-cast\" and deliver a message to all clients at the\
    \ same time.\n\nFirst, let's track all clients in an array inside websockets.js:\n\
    \n```\nvar _ = require('lodash')\nvar ws = require('ws')\nvar clients = []\n\n\
    exports.connect = function (server) {\n  var wss = new ws.Server({server: server})\n\
    \  wss.on('connection', function (ws) {\n    clients.push(ws)\n  })\n\n  ws.on('close',\
    \ function () {\n    _.remove(clients, ws)\n  })\n})\n```"
- md: "\nOn connection, you push the new client onto our array. When that client disconnects,\
    \ you remove it from the list using Lo-Dash. Removing is important since you would\
    \ get nasty errors attempting to send messages to disconnected clients. Feel free\
    \ to add console.log() statements inside this code to get an idea what is going\
    \ on.\n\nNow that you have a list of clients to send a broadcast message, let's\
    \ add a broadcast function to websockets.js:\n\n```\nexports.broadcast = function\
    \ (topic, data) {\nvar json = JSON.stringify({topic: topic, data: data});\nclients.forEach(function\
    \ (client) {\n  client.send(json)\n})\n}\n```\n\nHere you have defined a function\
    \ broadcast that takes two arguments: a topic (string) and data (the any type).\
    \ The topic is needed to differentiate a message corresponding to a new post or\
    \ any other reason the client is receiving. You simply generate JSON with these\
    \ arguments, loop through every client, and send them a message with the JSON.\n\
    \nBefore moving on, let's see whether it is working by broadcasting new client\
    \ connections. Add the following code inside the connect function of websockets.js:\n\
    \n```\nwss.on('connection', function (ws) {\n  clients.push(ws);\n  exports.broadcast('new\
    \ client joined')\n  # ...\n```\n```\n\nTry adding two or three wsc connections\
    \ in different terminal windows to see whether the event is broadcasting correctly.\n\
    \nTo broadcast a message on new posts, simply require this websockets.js module\
    \ in the posts controller (posts.js) and call its broadcast function after Mongo\
    \ saves correctly. Pass the post object as well so the client will be able to\
    \ render it.\n\n```\nvar websockets = require('../../../websockets');\n# ...\n\
    router.post('/', function (req, res, next) {\n  var post = new Post(body: req.body.body);\n\
    \  post.username = req.auth.username;\n  post.save(function (err, post) {\n  \
    \  if (err) { return next(err) }\n    websockets.broadcast('new_post', post);\n\
    \    res.json(201, post)\n  })\n});\n```\n\nNow try creating a post in the browser\
    \ while you have a scat session open. You should see the event come down:\n\n\
    ```\n$ wsc -c ws://localhost:3000\nconnected (press CTRL+C to quit)\n< {\"topic\"\
    :\"new client joined\"}\n< {\"topic\":\"new_post\",\"data\":{\"__v\":0,\"username\"\
    :\"dickeyxxx\",\"body\":\n  \"new status update!\",\"_id\":\"53d462728ab571000037f17a\"\
    ,\n  \"date\":\"2014-07-27T02:22:42.962Z\"}}\n```\n\nNow that you have your Node\
    \ server listening for WebSockets and passing events on new posts, you need to\
    \ make Angular listen on the WebSocket.\n\n# WEBSOCKETS IN ANGULAR.JS\n\nAngular\
    \ does not have any built-in functionality for WebSockets, but using some of the\
    \ $scope events functionality you looked at previously, it's not hard for you\
    \ to handle it yourself. First, you need to write a bit of code to dispatch the\
    \ WebSocket messages to interested components.\nCreate a file ng/websockets.js\
    \ with the following:\n\n```\nangular.module('app')\n.run (function ($rootScope)\
    \ {\n  var url = 'ws://localhost:3000';\n  var connection = new WebSocket(url);\n\
    \nconnection.onopen = function () {\n  console.log('WebSocket connected');\n}\n\
    })\n```\n\nThis is an Angular run component. These simply get executed late in\
    \ the initialization phase. Because this reason nothing will directly connect\
    \ to this component; you don't want to use a service for this because you will\
    \ simply publish events to $rootScope that a controller or service can listen\
    \ to with $scope.on($scope). $rootScope is like $scope except that it's the parent\
    \ $scope that everything inherits from. It's also a singleton, so it can be used\
    \ to share global information through an application. While sharing state is better\
    \ done by having a hierarchy of ng-controller $scopes, passing global events leads\
    \ to nicely decoupled asynchronous applications.\n\nYou create a connection directly\
    \ to localhost:3000. You could analyze the URL and change the protocol from http\
    \ to ws to support multiple hostnames.\n\nYou then attach a function to 'open'\
    \ event from the WebSocket object. This block (the body of the function with the\
    \ $scope parameter) should work as is. Try it in your browser and you should see\
    \ 'WebSocket connected' in the console. Once it is working, add a function for\
    \ the message event after handling the open event:\n\n```\nconnection.onmessage\
    \ = function (e) {\nconsole.log(e)\nvar payload = JSON.parse(e.data)\n$rootScope.broadcast('ws:'\
    \ + payload.topic, payload.data)\n}\n```\n\nYou're broadcasting this message to\
    \ any $scope object in the system with ws: before turning it into an Angular event,\
    \ so your new post event would be ws:new_post. To avoid any potential conflicts\
    \ with an existing event name matching a WebSocket topic.\n\nYou're also logging\
    \ the message event. It'd be good to try posting a post and seeing whether the\
    \ event pops up in the console before continuing.\n\nWhat you need to do now is\
    \ to listen to this event in the posts controller and, upon receipt, unshift the\
    \ post into `$scope.posts`. Inside ng/posts.ctrl.js, here is the code:\n\n```\n\
    $scope.on('ws:new_post', function (_, post) {\n  $scope.$apply(function () {\n\
    \    $scope.posts.unshift(post)\n  })\n```\n\nRemember to also remove the other\
    \ unshift for the user posting the post; otherwise the post will appear twice.\
    \ A nice side benefit of using WebSockets is that you no longer need that code\
    \ (although it was just one line). I'm not sure why `$scope.$apply()` is necessary\
    \ here, but without it the UI won't update. I think that `$scope.on` triggering\
    \ digest cycle, so it may be a bug. Regardless, adding `$scope.$apply()` solves\
    \ the issue.\n\n# WEBSOCKET ARCHITECTURE\n\nWebSockets is still new technology,\
    \ and we're still finding good ways to leverage it. There are some factors you\
    \ need to take into account when building an application with WebSockets.\n\n\
    # RECONNECTION\n\nIn development, our Node server often restarts, killing the\
    \ WebSocket. Even in production this is possible, so it's a good idea to have\
    \ the client reconnect. To accomplish this, simply wrap the connection logic in\
    \ a function and call it few seconds later. Here's an example:\n\n```\nangular.module('app')\n\
    .run(function ($rootScope, $timeout) {\n  (function connect() {\n    var url =\
    \ 'ws://localhost:3000'\n    var connection = new WebSocket(url)\n    connection.onclose\
    \ = function (e) {\n      console.log('WebSocket closed. Reconnecting...')\n \
    \     $timeout(connect, 1000)\n    }\n    connection.onmessage = function (e)\
    \ {\n      var payload = JSON.parse(e.data)\n      $rootScope.broadcast('ws:'\
    \ + payload.topic, payload.data)\n    }\n  })()\n})\n```\n\nBecause the close\
    \ event is called when a connection is unsuccessful, this will keep retrying forever.\
    \ You could get fancier with this and do some backoff to retry quickly but gradually\
    \ reduce reconnect frequency. You will miss out on events sent during this period.\
    \ As a fallback, I would use an HTTP endpoint to gather missing events if that\
    \ is an issue.\n\n# FIGURE 9.1 What most people do\n\n# SOCKET WITH MESSAGES (what\
    \ most people do)\n\n![](img/a45e66f1e25bfccba9780b8e4fa81d147_0.png)\n\n# SECURITY\n\
    \nBecause WebSockets can connect on the same server as the HTTP, developers often\
    \ assume that the user is authenticated on either. Commonly, the initial part\
    \ of the WebSocket handshake will be secure, but then the client is free to access\
    \ anything. In the HTTP world, these would be new requests, but since WebSockets\
    \ don't need a request every time, additional security is needed. To resolve this,\
    \ use a JWT for every message the client sends just like you do on the HTTP side\
    \ (see Figure 9.1).\n\nKeep in mind when using WebSockets. It's just the sort\
    \ of thing you're not used to from stateless HTTP.\n\n# MULTIPROCESS/MULTISERVER\
    \ DESIGN\n\nOften when developers are writing an application to use WebSockets,\
    \ they will design it running on a single process on a single machine, which is\
    \ not a real-world scenario. Let's imagine the social application for a bit. If\
    \ you had separate servers up that was load balanced across two, then you would\
    \ have arrays of users connected to each.\n\nWhen a post is created, the Node\
    \ server will send the event only to users connected to the same server as the\
    \ one it was created.\n\nThis is a problem you need to address even on a single-box\
    \ machine. In production, you'll want to run two separate processes, causing the\
    \ same problem since they have their own memory space. I've worked on a few projects\
    \ that were designed like this, and it required some hefty refactoring down the\
    \ road to resolve it. To catch things like this, I suggest multiprocess mode even\
    \ in development (this is covered more in Chapter 11).\n\nThe way you enable everyone\
    \ to get notifications is by publishing the event to a central location everyone\
    \ is listening to. Once all processes on the servers will be notified and can\
    \ reply to the correct recipients. For this, you will need a message broker set\
    \ up in your infrastructure. Here are the three choices:\n\n- Redis pubsub feature\
    \ is certainly the most common (easiest to set up) solution for messaging in Node.js.\
    \ Redis is easy to learn and takes a short time to set up on any Unix machine.\
    \ It is my go-to for not just messaging but many other things (such as queuing,\
    \ caching, and data storage). I find it useful for web applications of any size.\
    \ The website has interactive documentation, so you can try every feature right\
    \ in the browser. It's my top recommendation for nearly every use case.\n- AMQP\
    \ (RabbitMQ) certainly has the most features as a message broker. It can provide\
    \ a bulletproof messaging infrastructure with tons of flexibility and scalability\
    \ options. It's harder to set up and use than Redis, so I suggest it only if you\
    \ know you will need it. Some of the features include fan-out messaging, replication,\
    \ durability, and messaging guarantees. If you architect your platform well, these\
    \ won't be necessary and can be provided by the database.\n- ZeroMQ is somewhere\
    \ in the middle of the road. It has some of the features you would find in AMQP\
    \ to take advantage of complex messaging processes but is simpler than AMQP. If\
    \ you want clever messaging settings (pairing consumers together, RPC, fan-out,\
    \ parallel), it might be a good option.\n"
  mdcn: "\n连接时，你将新客户端推入我们的数组。当该客户端断开连接时，你使用 Lo-Dash 将其从列表中移除。移除操作是非常重要的，因为尝试向已断开连接的客户端发送消息会导致糟糕的错误。你可以随时在这段代码中添加\
    \ `console.log()` 语句来了解发生了什么。\n\n现在你已经有了一个可以广播消息的客户端列表，让我们为 `websockets.js` 增加一个广播函数：\n\
    \n```\nexports.broadcast = function (topic, data) {\nvar json = JSON.stringify({topic:\
    \ topic, data: data});\nclients.forEach(function (client) {\n  client.send(json)\n\
    })\n}\n```\n\n在这里你定义了一个名为 `broadcast` 的函数，它接收两个参数：`topic`（字符串）和 `data`（任何类型）。`topic`\
    \ 用于区分对应新帖子或客户端接收其他任何原因的消息。你只需要使用这些参数生成 JSON，遍历每个客户端，并向它们发送带有 JSON 的消息。\n\n在继续之前，让我们通过广播新客户端连接来查看它是否正常工作。在\
    \ `websockets.js` 的 `connect` 函数内部添加以下代码：\n\n```\nwss.on('connection', function\
    \ (ws) {\n  clients.push(ws);\n  exports.broadcast('new client joined')\n  # ...\n\
    ```\n```\n\n尝试在不同的终端窗口中添加两个三个 `wsc` 连接，看看事件是否正确广播。\n\n要在发布新帖子时广播消息，只需在帖子控制器（`posts.js`）中引入此\
    \ `websockets.js` ，并在 Mongo 正确保存后调用它的广播函数。同时传递帖子对象，以便客户端能够进行渲染。\n\n```\nvar websockets\
    \ = require('../../../websockets');\n# ...\nrouter.post('/', function (req, res,\
    \ next) {\n  var post = new Post(body: req.body.body);\n  post.username = req.auth.username;\n\
    \  post.save(function (err, post) {\n    if (err) { return next(err) }\n    websockets.broadcast('new_post',\
    \ post);\n    res.json(201, post)\n  })\n});\n```\n\n现在尝试在打开 `scat` 会话时，在浏览器中创建一个帖子。你应该能看到事件传过来：\n\
    \n```\n$ wsc -c ws://localhost:3000\nconnected (press CTRL+C to quit)\n< {\"topic\"\
    :\"new client joined\"}\n< {\"topic\":\"new_post\",\"data\":{\"__v\":0,\"username\"\
    :\"dickeyxxx\",\"body\":\n  \"new status update!\",\"_id\":\"53d462728ab571000037f17a\"\
    ,\n  \"date\":\"2014-07-27T02:22:42.962Z\"}}\n```\n\n现在你的 Node 服务器已经在监听 WebSockets\
    \ 并传递新帖子的事件了，你需要让 Angular 监听 WebSocket。\n\n# ANGULAR.JS 中的 WEBSOCKETS\n\nAngular\
    \ 没有内置任何 WebSockets 的功能，但利用你之前看过的某些 `$scope` 事件功能，对你来说自己处理并不困难。首先，你需要编写一些代码将 WebSocket\
    \ 消息分发给感兴趣的组件。\n创建一个 `ng/websockets.js` 文件，内容如下：\n\n```angular\nangular.module('app')\n\
    .run (function ($rootScope) {\n  var url = 'ws://localhost:3000';\n  var connection\
    \ = new WebSocket(url);\n\nconnection.onopen = function () {\n  console.log('WebSocket\
    \ connected');\n}\n})\n```\n\n这是一个 Angular run 组件。它们只是在初始化阶段的后期执行。正因这个原因，没有东西会直接连接到这个组件；你不想为此使用服务（service），因为你只需将事件发布到\
    \ `$rootScope` 中，控制器或服务可以通过 `$scope.on($scope)` 来监听它们。`$rootScope` 就像 `$scope`，但它是所有东西继承的父级\
    \ `$scope`。它还是单例，因此可以用于在应用程序中共享全局信息。虽然共享状态通过建立 `ng-controller $scopes` 的层级结构会更好，但传递全局事件可以实现解耦良好的异步应用程序。\n\
    \n你直接对 `localhost:3000` 建立了连接。你可以分析 URL并将协议从 `http` 更改为 `ws` 以支持多个主机名。\n\n然后，你为\
    \ WebSocket 对象的 `open` 事件绑定了一个函数。这个代码块（带有 `$scope` 参数的函数体）应该可以直接工作。在你的浏览器中尝试一下，你应该会在控制台中看到\
    \ 'WebSocket connected'。一旦运行正常，在处理完 `open` 事件后，添加一个消息事件的函数：\n\n```\nconnection.onmessage\
    \ = function (e) {\nconsole.log(e)\nvar payload = JSON.parse(e.data)\n$rootScope.broadcast('ws:'\
    \ + payload.topic, payload.data)\n}\n```\n\n你在将此消息转换为 Angular 事件之前将其带有 `ws:` 广播到系统中的任何\
    \ `$scope` 对象，所以你的新帖子事件将是 `ws:new_post`。这是为了避免与匹配 WebSocket topic 的现有事件名发生潜在冲突。\n\
    \n你还记录了消息事件。在继续之前，尝试发布一个帖子并看看事件是否出现在控制台中，这样很好。\n\n你现在需要做的是在帖子控制器中监听这个事件，并在接收到后将帖子\
    \ `unshift` 到 `$scope.posts` 中。在 `ng/posts.ctrl.js` 中，代码如下：\n\n```\n$scope.on('ws:new_post',\
    \ function (_, post) {\n  $scope.$apply(function () {\n    $scope.posts.unshift(post)\n\
    \  })\n``` 记得，由于没有直接连接到这个组件，你需要 `$scope.$apply()`，否则 UI 不更新。\n\n# WEBSOCKETS 架构\n\
    \n由于 WebSocket 是一项新技术，在构建它时需要考虑某些因素。\n\n# 重连\n\n在开发期间，WebSocket 经常会关闭，但在生产环境中，这种情况是可能的。为了实现这一点，这里有一个例子：\n\
    \n```\nangular.module('app')\n.run (function ($rootScope, $timeout) {\n  var url\
    \ = 'ws://localhost:3000';\n  var connection = new WebSocket(url);\n\nconnection.onopen\
    \ = function () {\n  console.log('WebSocket connected');\n}\nconnection.onmessage\
    \ = function (e) {\nconsole.log(e)\nvar payload = JSON.parse(e.data)\n$rootScope.broadcast('ws:'\
    \ + payload.topic, payload.data)\n}\nconnection.onclose = function () {\n  console.log('WebSocket\
    \ closed');\n  $timeout(connect, 1000)\n}\nfunction connect() {\n  // ...\n}\n\
    ```\n\n在使用 WebSocket 消息时，我们发现即使在单机上设计设计，也会遇到一些问题。我工作过几个这样设计的项目，后期需要进行繁重的重构来解决。为了捕捉这类问题，我建议即使在开发环境中也使用多进程（这将在第11章详细介绍）。\n\
    \n启用所有人获取通知的方法是将事件发布到所有人都在监听的中心位置。一旦发布，所有服务器上的进程将收到通知并可以回复正确的接收者。为此，你需要在基础设施中设置一个消息中间件。这里有三种选择：\n\
    \n- Redis pubsub 功能无疑是 Node.js 中最常见的（最容易设置的）消息解决方案。Redis 容易学习，在任何 Unix 机器上设置都很很快。它不仅用于消息，还用于许多其他（如队列、缓存和数据存储）。发现它适用于任何规模的应用程序。它的网站有交互式文档，你可以在浏览器中尝试每个功能。它是我几乎所有情况的首选。\n\
    - AMQP (RabbitMQ) 作为消息中间件功能最多。它可以提供极具灵活性和扩展性的消息基础设施。它比 Redis 更难设置和使用，因此只有在你确定需要时才建议使用。它的一些功能包括分发消息、复制、持久性和消息保证。如果你对架构设计良好，这些可能不是需要的，可以由数据库提供。\n\
    - ZeroMQ 处于中间位置。它具有一些你在 AMQP 中可以发现的功能，可以利用复杂的消息过程，但比 AMQP 简单。如果你需要巧妙的消息设置（配对消费者、RPC、分发、并行），它可能是一个不错的选择。\n\
    \n"
