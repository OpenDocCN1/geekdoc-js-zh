    \n```html\n<li ng-repeat=\"post in posts | orderBy:'-date' class=\"list-group-item\"\
    >\n```\n\nAngular 现在将根据你添加到 Mongoose schema 中的日期正确地对帖子进行排序。请注意，除了在模型 schema 中添加它之外，你不需要编写任何代码来支持日期。这展示了使用\
    \ MEAN 栈的力量。你只需要向 MongoDB 添加一些内容，它就会一直级联传递到客户端。\n\n或者，你也可以在 Node 中解决这个问题。如果你想为你的\
    \ API 添加分页功能，这是一个好主意。你需要确保响应的第一页包含最新的帖子。虽然你现在还不构建分页功能，但这里你可以如何编辑 `server.js` 以按时间倒序顺序提供帖子：\n\
