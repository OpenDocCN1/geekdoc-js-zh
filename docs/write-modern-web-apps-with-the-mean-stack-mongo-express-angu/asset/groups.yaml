    # CHAI-AS-PROMISED


    Using the then syntax of the promise can get a little hairy once your tests get
    complicated. Chai has a plug-in to help make the promises a lot clearer and more
    semantic called chai-as-promised.


    Starting with your assertion:


    ```

    element.all(by.css(''ul.list li'')).first().getText().then(function (text) {

    expect(text).to.contain(post)

    })

    ```


    you can replace your assertion with the following line chai-as-promised:


    ```

    expect(element.all(by.css(''ul.list-group li'')).first().getText())

    to.eventually.contain(post)

    ```


    Install chai-as-promised as a development dependency:


    ```

    $ npm install --save-dev chai-as-promised

    ```


    Then edit your expect declaration in test/e2e/making_a_post.spec.js to include
    chai-as-promised. The entire file is included here for completeness:


    ```

    var chai = require(''chai'')

    chai.use(require(''chai-as-promised''))

    var expect = chai.expect

    ```


