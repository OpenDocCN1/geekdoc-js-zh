    # PREFACE


    # WHO IS THIS BOOK FOR?


    This book is for web developers wanting to learn how building web applications
    has changed. The book assumes a basic knowledge of JavaScript. Knowledge of Node
    or Angular is helpful as well but not required.


    # WHY I WROTE THIS BOOK


    I''ve been a web developer since 2004 and have professionally worked with most
    of the major web platforms. I love to seek out new technology that helps me write
    my applications better.


    Applications built with an MVC framework such as Angular has been the largest
    paradigm shift that I''ve seen in the web community. Frameworks and tools have
    come and gone, but client-side MVC applications are fundamentally different.


    > I''ve been impressed with the quality of applications that I''ve shipped with
    Angular and Node. The tools are simple—sometimes a bit naive—but this simplicity
    comes with the fantastic ability to iterate on features and maintain a codebase.


    > Applications as those built with the MEAN stack are becoming more popular, but
    many development teams still feel comfortable with server-generated pages and
    relational databases.


    I''ve had such good luck with MEAN applications that I want to share my knowledge
    of how to build them with you.


    I hope you''ll enjoy exploring this new method of building applications with me.
    I love discussing these topics, so feel free to reach out to me on Twitter to
    continue the conversation.


    Jeff Dickey

    @dickeyxxx

    August 2014


    # INTRODUCTION


    The JavaScript community has a strong belief in the power of composability as
    architectural software. This is in line with the Unix philosophy of simple components
    that can be used together to quickly build applications.


    By no means this methodology the only one that exists. Ruby on Rails, for example,
    uses an opinionated framework to make decisions for you about what your application
    should look like. Opinionated frameworks offer the advantage of being able to
    quickly learn an application because out of the box it works—you just need to
    fill in the gaps. Opinionated frameworks are also easier to learn because there
    is usually a “right” way to do something. The downside is that you''re limited
    to building applications that the framework was made for, and moving outside of
    the use cases the framework was made for can be difficult.


    By contrast, the composition methodology is more flexible. Putting simple pieces
    together has a clear advantage of allowing you to build anything you want. These
    frameworks provide you with building blocks, and it''s up to you to decide how
    to put them together. The downside is mostly in the learning phase. It is difficult
    to know what a good idea is and what is a bad idea without having experience both.


    For this reason, it''s useful to read up on opinionated on how to build JavaScript
    applications. These opinions provide one person''s viewpoint on good and bad decisions
    and give you a road to what an application should look like.


    This book shows how to build your own MEAN application following my opinions of
    what a good application should look like. These opinions come from my experience
    developing applications. While I have a good amount of experience, it is unlikely
    it will fit perfectly with any other person. For this reason, I find books as
    this are useful to learn not just the “how” of using a tool set but the “why”
    as well.


    In other words, it''s useful to know how to use promises in Node but not very
    useful if you don''t understand why they are useful.


    The application you will build is called Social App (see Figure I.1). You can
    see an example of it running at https://mean-sample.herokuapp.com as well as the
    code at https://github.com/dickeyoffx


    The application is similar to Twitter. Users can create and add accounts. The
    feature count is not large but does consist of some neat solutions like WebSockets
    that immediately display new posts to all users viewing the application. I will
    also go compiling the CSS and JavaScript with Gulp, deploying the application
    to both Heroku and Digital Ocean, building a clean, maintainable API and more.


    Having a “newsfeed” that displays live, updating content is a pattern that I see
    on just every project I work on. I chose this as an example because it is complicated
    enough to incorporate many different tools but not so complex that you will become
    bogged down in the minutiae of this specific application.


