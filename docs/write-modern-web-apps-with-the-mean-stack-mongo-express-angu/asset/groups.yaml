    \ little strange that I'm taking in the base64-encoded username (that the client\
    \ can easily see) and directly pulling the user who matches it out of the database.\
    \ Remember, though, it's securely signed; if the user changed it, the signature\
    \ wouldn't match, and it would be invalid.\n\nThe way this code works right now\
