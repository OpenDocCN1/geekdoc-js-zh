  - "[PAGE 63]\n\n# $HTTP\n\nTo perform HTTP calls in Angular, you'll use its built-in\
    \ HTTP client: $http. If you haven't noticed yet, official Angular components\
    \ start with $. You should not prefix components you create with a.\n$http is\
    \ a pretty standard HTTP client with some of the usual suspects: $http.get(),\
    \ $http.post(),, and so on. It is promise based.\n\n# WHAT ARE PROMISES?\n\nPromises\
    \ are a way of writing asynchronous code in JavaScript as an alternative to the\
    \ traditional callback method that Node uses.\nIf you look at a popular Node HTTP\
    \ client, request, you can see the difference.\nHere is Angular's $http:\n\n```\n\
    $http.get('http://localhost:3000/api/posts')\n.success(function (posts) {\n  //\
    \ do stuff with posts\n})\n.error(function (err) {\n  // handle the error case\
    \ (if you care)\n})\n```\n\nAnd here's Node's request:\n\n```\nrequest.get('http://localhost:3000/api/posts',\
    \ function (err, response, data) {\nif (err) { /* handle error */}\n// do something\
    \ with posts\n})\n```\n\nThe main difference is that with promises, you get back\
    \ an object that you can call methods on to give different functions based on\
    \ success/failure. In the callback method, there is just one function that has\
    \ to handle every case.\nIt's not important to understand promises in detail just\
    \ yet, but do understand that Angular code is heavily promise based, and Node\
    \ (conventionally) is not.\nThere is some controversy over which method is better.\
    \ Promises have definitely become more popular recently and will be included in\
    \ the next version of JavaScript (ES6). Some people use promises exclusively in\
    \ Node, and you can do that in your own code if you want. In this book, I will\
    \ use callbacks with Node code and promises with Angular code to fit the current\
    \ conventions."
