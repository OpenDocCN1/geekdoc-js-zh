    To git@heroku.com: dry-sands-8759.git\n7407b4e..b74f874 master -> master\n\nWith\
    \ this set up, you can keep your repository clean of compiled files.\n\n# NODE\
    \ CLUSTER\n\nThis setup works, but it runs only in a single process. You can get\
    \ extra performance by splitting the server across multiple processes. Node comes\
    \ with a built-in utility for load balancing a server across multiple CPUs Node\
    \ Cluster.\n\nUsing Node Cluster is easy. You just need to include the module,\
    \ configure the script that needs to load, and then fork off workers. Here is\
    \ a simple example that will fork off three workers. I used this boot.js in the\
    \ root of the project.\n\n```javascript\nvar cluster = require('cluster')\ncluster.master({exec:\
    \ __dirname + '/server.js'})\ncluster.fork()\ncluster.fork()\ncluster.fork()\n\
    ```\n\nThis will start a total of four processes: one master process and three\
    \ children. Each will listen on the same TCP port and the master will automatically\
    \ load balance traffic between these three servers.\n\nA rule of thumb for finding\
    \ the most efficient way to manage a Node server is to launch a worker for each\
    \ number of CPUs on the machine. It's good to play with this number a bit; though\
    \ sometimes it's good to overload a bit with an extra process or two for each\
    \ CPU core, but other times it can be helpful to leave the CPUs a little extra\
    \ breathing room with one worker than there are cores.\n\nDetecting the number\
    \ and forking one per CPU is easy:\n\n```javascript\nvar cluster = require('cluster')\n\
    var numCpus = require('os').cpus().length\ncluster.master({exec: __dirname + '/server.js'})\n\
    for (var i = 0; i < numCpus; i++) {\n  cluster.fork()\n}\n```\n\nThis boot.js\
    \ script works great, but on Heroku, it is always loading server.js, which is\
