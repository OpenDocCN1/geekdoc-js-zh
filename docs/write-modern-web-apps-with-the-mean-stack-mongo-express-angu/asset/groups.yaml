    \ to understand why NPM is made the way it is for a better understanding of its\
    \ philosophy.\n\n# INSTALLING NODE.JS\n\nInstalling Node.js typically involves\
    \ two parts: installing a base copy of Node.js and then installing a version switcher\
    \ to choose the version of Node.js you want to use.\n\nThe reason for the switcher\
    \ is that Node.js changes frequently. It's likely the version you get initially\
    \ will not be the latest. Also, once you get a couple of projects under your belt,\
    \ you might have different projects that need different versions.\n\nFollow these\
    \ steps to get up with Node.js for the project in this book:\n\n+   1. To install\
    \ the base version, use your package manager of choice.\n   - For OS X with Homebrew\
    \ (http://brew.sh), run brew install npm.\n   - For Windows, visit http://nodejs.org/download.\n\
    \   - For Ubuntu 13+, run sudo apt-get install npm.\n   - For others, visit https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager.\n\
    \n+   2. Once you have the base version of Node.js installed, install the version\
    \ switcher by typing npm install -g n. The g here denotes that you are installing\
    \ the package globally. Otherwise, it would just install it into this directory\
    \ and you couldn't just run from anywhere.\n\nTo install and use the latest stable\
    \ version of Node.js, use n stable. For more details on how to use n, see https://www.npmjs.org/package/n.\n\
    \nNow that you have Node.js installed, let's build a web server with it."
  - "[PAGE 30]\n\n# CREATING A VANILLA HTTP SERVER\n\nNode.js has an HTTP module built\
    \ in that can act as a server. A simple \"Hello World\" server would look like\
    \ this in straight Node:\n\n```\nvar http = require(\"http\");\nhttp.createServer(function(request,\
    \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    \  response.write(\"Hello world\");\n  response.end();\n}).listen(3000);\n```\n\
    \nYou'll need a server for the project in this book, so follow these steps:\n\n\
    +   1. Create the previous file anywhere and call it app.js.\nThis responds to\
    \ any route the web server receives. If you wanted to respond to others, you'd\
    \ have to implement some kind of conditional on the request object.\n\n+   2.\
    \ Run the server by executing node app.js in a terminal. You won't see any output,\
    \ but going to http://localhost:3000 in your browser should display \"Hello World.\"\
    .\n\nWhile exploring the code, pay attention to the createServer function. This\
    \ is calling the function createServer on the HTTP module, passing in a new, anonymous\
    \ function.\n\nThe code inside that function is not executed right away but when\
    \ the web server receives a new request. This is one of those callbacks discussed\
    \ earlier in action. Node doesn't block at any part of code; it just stores the\
    \ function for the use later when a request comes in.\n\nYou could totally build\
    \ an application like this, but the NPM package Express provides some nicer structure\
    \ to common HTTP code. It's a lightweight web server (akin to Sinatra in Ruby,\
    \ but even more low level)."
  - "[PAGE 31]\n\n# WHAT IS EXPRESS?\n\nExpress is an NPM package for building web\
    \ servers. It's by far the most common package used for building web applications\
    \ with Node.js.\n\nIn Express, the same code for the web server would look like\
    \ the following:\n\n```\nvar express = require('express');\nvar app = express();\n\
    \napp.get('/', function(req, res) {\n  res.send(200, 'Hello World');\n});\n\n\
    app.listen(8888);\n```\n\n# INSTALLING EXPRESS\n\nFollow these steps to install\
    \ Express:\n\n+   1. Go ahead and put the previous code into a file called app-express.js.\n\
    2. Install Express into the directory by running npm install-express.js. You should\
    \ then be able to access it at http://localhost:8888 just like before.\n3. Run\
    \ the code simply by executing node app-express.js.\n\nAs you can see, Express\
    \ doesn't do much more than you could do in straight Node. It does, however, provide\
    \ cleaner structure for the code. There's also a beautifully simple middleware\
    \ implementation for things such as logging and authentication and authorization.\
    \ For apps, it also has simple tools to serialize/deserialize JSON.\n\nThat's\
    \ all about it,—it's a simple web framework that leaves most of the implementation\
    \ up to you to decide.\n\n# DATABASES FOR NODE.JS\n\nSince Node.js is written\
    \ in JavaScript, it supports JSON in a very clean way. Manipulating JSON data\
    \ is easy, which is great that's what clients typically use.\n\nOn the back end,\
    \ SQL databases are not a great fit for Node.js. Object-relational mappers (ORMs),\
    \ which are the tools that connect your code to a relational database and other\
    \ tools out there are really young, and not a lot of work is currently being done\
    \ to develop them. I doubt Node.js will ever have a great ORM. Having said that,\
    \ it's common to see applications that use Node.js as a layer to an MVC web server\
    \ that has a solid ORM."
  - '[PAGE 32]


    That''s okay, though, because there are great document databases out now such
    as Riak, MongoDB, RethinkDB, and Cassandra. JSON is a good fit for all of these
    since it represents a document naturally. Some databases, like MongoDB, use a
    JSON superset as their own internal storage engine.


    Because MongoDB is by far the most common choice for Node.js applications, that''s
    what you will be looking at in this book.'
  - '[PAGE 33]


    # WHAT IS MongoDB?


    To complete the JavaScript web stack, you will be using a document database called
    MongoDB. It has a number of advantages over a traditional SQL database. Since
    almost all developers know SQL already, I''m assuming you do as well. If you don''t,
    don''t worry about the SQL bits are over your head; you don''t need to worry about
    them. SQL is extremely complex and takes decades to master. MongoDB is simple
    and can be learned in an afternoon.


    Having said that, I have found learning MongoDB is a bit tricky for those who
    already know SQL. The more SQL you know, the harder it is to wrap your head around
    MongoDB; if this applies to you, my advice is to attempt to clear your head and
    not think about what you know about databases. MongoDB is more akin to working
    with objects in a programming language than what you know of as a database. Also,
    you''re going to be breaking a lot of SQL rules, so prepared to be a bit scared.


    # DOCUMENT-ORIENTED


    Rather storing data in a series of rows and tables like SQL, MongoDB has collections
    and documents. While you can mostly think of a collection being like a table,
    a document is quite a bit different from a row.


    The main reason documents are different is that they can contain way more information.
    In SQL, if you wanted to represent a user and their roles, you might have three
    tables for the task, as shown here:


    | user_id | email |

    |---|---|

    | 100 | jeff@dickxxx.com |

    | 101 | bob@dickxxx.com |


    | role_id | name |

    |---|---|

    | 1 | Admin |

    | 2 | Operations |


    | role_id | user_id |

    |---|---|

    | 1 | 101 |

    | 2 | 102 |'
- md: "\nFinding out user is in what role is a process of joining users across the\
    \ user_roles table to the roles table. It's the way databases have been built\
    \ forever.\n\nIn MongoDB, this is all much simpler. More likely, you would have\
    \ documents that look like the following:\n\n```json\n{\n  \"_id\": \"ObjectId(538c997dac697631f0dfebce)\"\
    ,\n  \"email\": \"jeff.dickey.xxx\",\n  \"roles\": [ \"admin\", \"operations\"\
    \ ]\n}\n```\n\nIn MongoDB this--would be the only item in the database to represent\
    \ the same data. If you come from the SQL world, there's a chance you may look\
    \ at this and be a bit worried about the data duplication of having a different\
    \ string for each role, for each user. \"What if you wanted to change admin to\
    \ administrator?\" might be a question you would ask.\n\nThis is a trade-off you\
    \ take in MongoDB. In SQL, the goal with the data is to structure it so that it\
    \ is normalized as possible with no duplicated information. In MongoDB you have\
    \ a much different goal: make the data easy for use as possible. While it might\
    \ be better to rename a role (you'd have to iterate over every user), that is\
    \ a choice you make because it is a relatively uncommon task. Finding out the\
    \ roles a user is in, however, is much more common and easier in MongoDB. Querying\
    \ for a user would just return the roles along with all the other information.\n\
    \nNot only is this querying easier as a developer, it's also much faster under\
    \ the head. This format is known as BSON.\n\n# BSON\n\nMongoDB stores the data\
    \ into a format called BSON, which is essentially JSON stored as binary with a\
    \ few differences. One of the differences is the ObjectId value. This is a data\
    \ type used in Mongo to uniquely identify documents. It is created automatically\
    \ on each document (it's analogous to a primary key).\n\nSince the ObjectId is\
    \ a large pseudorandom number, you are unlikely to run into a situation where\
    \ you generate two are the same. For nearly all practical purposes, you can assume\
    \ they will always be unique, which can be really handy. The only situation you\
    \ would have to worry about a collision is if you are generating a large number\
    \ in a short period of time. Even then, you'd have to be generating them so fast\
    \ that the database would be unlikely to keep up. They're always unique.\n\nOne\
    \ of the cool things about ObjectId is that you can take an ObjectId and find\
    \ out when it was created. (They're partially based on a timestamp.) Here's a\
    \ tool that can find out when 538c997dac697631f0dfebce was made: http://steveridot.github.io/mongo-object-time/\n\
    \nThe following are advantages of BSON over tables/rows:\n- Documents map naturally\
    \ to objects in programming languages.\n- Embedded documents and arrays prevent\
    \ the need for joins.\n- Polymorphism is much easier since there is no schema.\n\
    \n# HORIZIZONTAL SCALING WITH AUTO-SHARDING\n\nWhile MongoDB was certainly designed\
    \ with ease of use in mind, it's also great for scaling. MongoDB supports horizontal\
    \ scaling, which is the ability to add more machines to a cluster to scale. This\
    \ is in contrast to vertical scaling, which is the idea that you scale up by increasing\
    \ the horsepower of a single box.\n\nEssentially with MongoDB you can just add\
    \ boxes to your cluster to scale up for traffic. In a relational database such\
    \ as MySQL or PostgreSQL, you have limited options to increase the database performance.\
    \ Once a database starts to get hard and you've upgraded the box to be as powerful\
    \ as possible, you have few options to improve performance. You can analyze queries\
    \ and attempt to optimize them, add more caching, move the data to other sources,\
    \ and decrease query usage, but all of these tasks require levels of development\
    \ to analyze and fix.\n\nAs a result, some relational databases admit to sharding\
    \ the system. Sharding involves splitting the data across multiple databases.\
    \ On a relational database, this is incredibly challenging and involves a ton\
    \ of changes to the application to support it. Once sharding has been implemented,\
    \ you lose the ability to perform many types of queries (anything across the whole\
    \ data set).\n\nMongoDB, on the other hand, embraces sharding. It assumes your\
    \ data will be sharded from the beginning; therefore, queries like joins that\
    \ would require the whole dataset are not supported at all. You're expected to\
    \ design your system to support this architecture.\n\nHaving that, MongoDB can't\
    \ scale in this way forever. You'll be able to add a few databases to the system,\
    \ but at some point it'll be too much work for them to get all quorum with each\
    \ other, and your system will break down. It's a good solution, but it isn't a\
    \ silver bullet.\n\n# SCHEMELESS\n\nIn SQL, you have to design your schema by\
    \ defining all the tables and data types before you can start inserting. MongoDB\
    \ does not have this concept. In MongoDB, you just start adding data in any format\
    \ you want. If it doesn't look like earlier data, it doesn't complain.\n\nIn general,\
    \ with MongoDB you don't set up anything beforehand; you start using it. For example,\
    \ there's no command to create an index. There is an ensureIndex command that\
    \ does exactly what it sounds like (create the index if it doesn't exist).\n\n\
    # INSTALLING MongoDB\n\nFollow the directions for your platform at http://docs.mongodb.org/manual/installation/\n\
    \n- On OS X use Homebrew, `brew install mongodb`\n- Note that on OS X you'll probably\
    \ want to make sure it stays running as a daemon with launchctl Type `brew info\
    \ mongodb` for instructions on how to do this.\n- On Windows there is an installer\
    \ you can get from the official website.\n- On Ubuntu do not run apt-get because\
    \ you will likely install a very old version of mongodb. Check the official website\
    \ for specific instructions.\n\n# USING MongoDB\n\nNow that you have MongoDB installed,\
    \ start the mongo daemon and then start your client by running the mongo command:\n\
    \n```\n$ mongo\nMongoDB shell version: 2.6.1\nconnecting to: test\n>\n```\n\n\
    Now you're connected to the test database. In MongoDB there are three parts to\
    \ the hierarchy of data:\n\n- Database: There is usually one database per app,\
    \ but there can be several per server. It usually shares the name of the app,\
    \ and it's the same as a database in SQL.\n- Collection: This is a group of similar\
    \ pieces of data. It is usually a noun and analogous to a table in SQL.\n- Document:\
    \ This is a single item in the database, such as an individual user record. If\
    \ a collection were a class, a document would be an object. It is sort analogous\
    \ to a row in SQL (although you shouldn't assume so!).\n\nHere you want to use\
    \ a database called playground. As mentioned earlier, in Mongo typically you won't\
    \ create anything; you start using it as if it was. This is a great example:\n\
    \n```javascript\n> use playground\nitched to db playground\n>\n```\n\n# INSERTING\
    \ DOCUMENTS\n\nNow you can add your first document to a new collection called\
    \ users.\n\n```javascript\n> db.users.insert({name: 'Jeff Dickey', email: 'jeff@dickeyxxx.com',\
    \ roles: ['admin', 'operations']})\nWriteResult({ \"nInserted\": 1 })\n> \n```\n\
    \n# QUERYING DOCUMENTS\n\nNow that you've written your first document to the database,\
    \ you can retrieve it with the find command.\n\n```javascript\ndb.users.find()\n\
    { \"_id\": \"538fd19837651880ee2456f\", \"name\": \"Jeff Dickey\",\n\"email\"\
    : \"jeff@dickeyxxx.com\", \"roles\": [ \"admin\", \"operations\" }\n> \n```\n\n\
    Most of the data there is exactly what you had before, except MongoDB has added\
    \ an ObjectID attribute for you to uniquely identify this record across an entire\
    \ database. You can get back a single record like this:\n\n```javascript\n> db.users.find(ObjectId(\"\
    538fd19837651880ee2456f\"))\n```\n\nOr if you wanted to look up by e-mail, you'd\
    \ use this:\n\n```javascript\n> db.users.find({email: 'jeff@dickeyxxx.com'})\n\
    ```\n\nAnd by role, you'd use this:\n\n```javascript\n> db.users.find({roles:\
    \ 'admin'})\n```\n\nSearching inside an array assumes you're matching any one\
    \ of the items in the array unless you pass an array in the query.\n\n> NOTE:\
    \ In case you haven't noticed, the query language here is JavaScript.\nEven in\
    \ the raw database forms of the MEAN stack, you use JavaScript.\n"
  mdcn: "\n查找用户处于什么角色，是一个将 `user_roles` 表与 `roles` 表进行连接（join）的过程。这是长期以来数据库构建的方式。\n\
    \n在 MongoDB 中，这一切要简单得多。你更有可能拥有像如下所示的文档：\n\n```json\n{\n  \"_id\": \"ObjectId(538c997dac697631f0dfebce)\"\
    ,\n  \"email\": \"jeff.dickey.xxx\",\n  \"roles\": [ \"admin\", \"operations\"\
    \ ]\n}\n```\n\n在 MongoDB 中——这应该是数据库中表示相同数据的唯一项。如果你来自 SQL 世界，可能会看到此内容并对为每个角色、每个用户设置不同字符串而导致的数据重复感到有些担心。“如果我想把\
    \ `admin` 改为 `administrator` 怎么办？”这可能是你可能会提出的问题。\n\n这是你在 MongoDB 中需要做的一种权衡。在 SQL\
    \ 中，数据的 goal是将其进行结构化，使其尽可能地归一化且没有重复信息。在 MongoDB 中，你有一个完全不同的目标：让数据尽可能易于使用。虽然重命名角色可能更好（你必须遍历每个用户），但这是你做出的选择，因为这是一项相对不常见的任务。然而，查找用户所属的角色在\
    \ MongoDB 中要常见得多且简单得多。查询用户将直接返回角色以及所有其他信息。\n\n对于开发者来说，这种查询不仅更容易，在逻辑处理上也快得多。这种格式被称为\
    \ BSON。\n\n# BSON\n\nMongoDB 将数据存储为一种名为 BSON 的格式，它本质上是存储为二进制的 JSON，但有几处不同。不同之处之一是\
    \ `ObjectId` 值。这是 Mongo 中用于唯一标识文档的数据类型。它在每个文档上自动创建（类似于主键）。\n\n由于 `ObjectId` 是一个大的伪随机数，你不太可能遇到生成的两个相同的情况。对于几乎所有的实际用途，你都可以假设它们始终是唯一的，这非常有用。你唯一需要担心冲突的情况是，你在极短的时间内生成了大量数字。即便如此，你生成的速度也必须快到数据库可能跟不上。它们始终是唯一的。\n\
    \n`ObjectId` 的酷点之一是，你可以获取一个 `ObjectId` 并查出它是何时创建的。（它们部分基于时间戳。）这里有一个工具可以找出 `538c997dac697631f0dfebce`\
    \ 是何时制作的：http://steveridot.github.io/mongo-object-time/\n\n以下是 BSON 相比于表/行的优势：\n\
    - 文档自然映射到编程语言中的对象。\n- 嵌入文档和数组避免了对连接（joins）的需求。\n- 多态变得容易得多，因为没有模式（schema）。\n\n\
    # 自动分片的水平扩展\n\n虽然 MongoDB 在设计时确实考虑了易用性，但它也非常适合扩展。MongoDB 支持水平扩展，即通过向集群添加更多机器来扩展的能力。这与垂直扩展形成对比，垂直扩展是指通过增加单台机器的马力来扩展。\n\
    \n本质上，使用 MongoDB 时你只需要向集群中添加机器来扩展流量。在 MySQL 或 PostgreSQL 等关系型数据库中，增加数据库性能的选项有限。一旦数据库开始变得困难，且你已经将机器升级到尽可能强大，改进性能的选择就很少了。你可以分析查询并尝试优化它们、添加更多缓存、将数据移动到其他源并减少查询使用，但所有这些任务都需要相应级别的开发来分析和修复。\n\
    \n结果，某些关系型数据库承认对系统进行分片（sharding）。分片涉及将数据分散在多个数据库中。在关系型数据库上，这是极具挑战性的，并且涉及对应用程序大量的更改以支持它。一旦实现了分片，你就失去了执行许多类型查询的能力（任何跨整个数据集的查询）。\n\
    \n相反，MongoDB 拥抱分片。它假设你的数据从开始就是分片的；因此，像连接 这样需要整个数据集的查询是完全不支持的。你被要求设计你的系统来支持这种架构。\n\
    \n尽管如此，MongoDB 不能永远这样扩展下去。你能够向系统添加几个数据库，但在某个时刻，让它们达成所有共识（quorum）的工作将变得太多，你的系统将会崩溃。这是一个很好的解决方案，但它不是万灵药。\n\
    \n# 无模式（SCHEMALESS）\n\n在 SQL 中，你必须在开始插入之前定义所有的表和数据类型来设计模式。MongoDB 没有这个概念。在 MongoDB\
    \ 中，你只需按任何喜欢的格式开始添加数据。如果看起来看起来之前的数据不同，它也不会抱怨。\n\n通常，使用 MongoDB 你不需要预先设置任何东西；直接开始使用即可。例如，没有创建索引的命令。有一个\
    \ `ensureIndex` 命令，它的作用正如其名（如果索引不存在则创建索引）。\n\n# 安装 MongoDB\n\n按照你所在平台的说明操作：http://docs.mongodb.org/manual/installation/\n\
    \n- 在 OS X 上使用 Homebrew，执行 `brew install mongodb`\n- 注意在 OS X 上，你可能想确保它作为守护进程通过\
    \ launchctl 保持运行。输入 `brew info mongodb` 获取如何这样做的说明。\n- 在 Windows 上，可以从官方网站获取一个安装程序。\n\
    - 在 Ubuntu 上不要运行 `apt-get`\n\n# 使用 MongoDB\n\n在你安装了 MongoDB 后，运行 `mongo` 命令启动：\n\
    \n```\n$ mongo\nMongoDB version: 2.6.1\nconnecting to test\n>\n```\n\n现在你连接到了\
    \ test 数据库。在 MongoDB 中有三个层级结构：\n- 数据库：通常每个应用有一个，但在每个服务器上可以有几个。\n- 集合：这是一组数据的集合，通常类似于\
    \ SQL 中的表。\n- 文档：这是数据库中的单个项，例如用户记录。如果集合是一个类，那么文档就是一个对象。\n\n在这里你想使用名为 `playground`\
    \ 的数据库。正如前面提到的，在 Mongo 中你通常不需要创建任何；就像它存在那样开始使用。这是一个很好的例子：\n\n```javascript\n>\
    \ use playground\nitched to db playground\n>\n```\n\n# 插入文档\n\n你可以向名为 `users`\
    \ 的新集合添加你的第一个文档。\n\n```javascript\n> db.users.insert({name: 'Jeff Dickey', email:\
    \ 'jeff@dickeyxxx.com', roles: ['admin', 'operations']})\nWriteResult({ \"nInserted\"\
    : 1 })\n> \n```\n\n# 查询文档\n\n当你向数据库写入第一个文档后，可以使用 `find` 命令检索它。\n\n```javascript\n\
    db.users.find()\n{ \"_id\": \"538fd19837651880ee2456f\", \"name\": \"Jeff Dickey\"\
    ,\n\"email\": \"jeff@dickeyxxx.com\", \"roles\": [ \"admin\", \"operations\" }\n\
    > \n```\n\n大部分数据和你之前的完全一样，只是 MongoDB 为你添加了 ObjectID 属性，用于在整个数据库中唯一标识此记录。你可以这样获取单个记录：\n\
    \n```javascript\n> db.users.find(ObjectId(\"538fd19837651880ee2456f\"))\n```\n\
    \n或者如果你想按邮箱查找，你可以使用：\n\n```javascript\n> db.users.find({email: 'jeff@dickeyxxx.com'})\n\
    ```\n\n以及按角色查询，你可以使用：\n\n```javascript\n> db.users.find({roles: 'admin'})\n```\n\
    \n在数组内部进行搜索假设你正在匹配数组中的任何一个项目，除非你在查询中传递了一个数组。\n\n> 注意：如果你还没有注意到，这里的查询语言是 JavaScript。\n\
    > 即使在 MEAN 栈的原始数据库形式中，你也在使用 JavaScript。\n\n"
