    \ require('./controllers/api/sessions'))\napp.use('/api/users', require('./controllers/api/users'))\n\
    ```\n\nAnd create the sessions controller at controllers/api/sessions.js:\n\n\
    ```javascript\nvar router = require('express').Router()\nvar User = require('../../models/user')\n\
    var bcrypt = require('bcrypt')\nvar jwt = require('jwt-simple')\nvar config =\
    \ require('../../config')\n```\n\n```javascript\nrouter.post('/', function (req,\
    \ res, next) {\n  User.findOne({username: req.body.username})\n  .select('password').select('username')\n\
    \  .exec(function (err, user) {\n    if (err) return next(err)\n    if (!user)\
    \ return res.send(401)\n    bcrypt.compare(req.body.password, user.password, function\
    \ (err, valid) {\n      if (err) return next(err)\n      if (!valid) return res.send(401)\n\
    \      var token = jwt.encode({username: user.username}, config.secret)\n    \
    \  res.send(token)\n    })\n  })\n})\n\nmodule.exports = router\n```\n\nMake sure\
    \ you also use npm install bcrypt and jwt-simple to install those tools into your\
    \ project.\nThis is largely the same code you built in the demo app. It looks\
    \ up a user from the passed-in username and then checks the password hash with\
    \ bcrypt against the one the user sent. If successful, it will pass back a new\
    \ JWT for that user.\nThat JWT is what the client will need to make all future\
    \ authenticated requests.\nNow that you have sessions controller, create the users\
    \ controller at controllers/api/users.js:\n"
