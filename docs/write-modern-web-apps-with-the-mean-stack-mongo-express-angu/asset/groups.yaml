  mdcn: "\n这种方法行得通，但它是同步的（JavaScript 开发的敌人）。换句话说，在验证密码时，所有其他操作都会被阻塞，而你希望避免这种情况。在测试中，异步版本可以处理四倍数量的请求，每个请求的速度快约三倍。你可以通过回调（正如我们在第\
