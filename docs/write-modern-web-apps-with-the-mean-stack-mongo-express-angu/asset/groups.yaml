    \ 以查看其运行情况。\n\n你现在拥有了一个完整的 API，可以进行读写以支持你的 Angular 应用。\n以下是最终的 `server.js`：\n\n\
    ```javascript\nvar express = require('express')\nvar bodyParser = require('body-parser')\n\
    var Post = require('./models/post')\n\nvar app = express()\n.use(bodyParser.json())\n\
    \napp.get('/api/posts', function (req, res, next) {\n  Post.find(function(err,\
    \ posts) {\n    if (err) { return next(err) }\n    res.json(posts)\n  })\n})\n\
    \napp.post('/api/posts', function (req, res, next) {\n  var post = new Post({\n\
    \    username: req.body.username,\n    body: req.body.body\n  })\n  post.save(function\
    \ (err, post) {\n    if (err) { return next(err) }\n    res.json(201, post)\n\
    \  })\n})\n\napp.listen(3000, function () {\n  console.log('Server listening on',\
    \ 3000)\n})\n```\n\n# 下一步\n\n你现在已经构建了可供 Angular 应用使用的完整 API。在下一章中，你将把 API 集成到\
    \ Angular 中并通过 Node 托管 Angular 应用。你还将花一些时间通过将代码拆分为模块来清理代码。\n\n# 第 5 章\n将 Node\
    \ 与 Angular 集成\n\n现在你已经构建了 API，是时候在 Angular 中使用它了。此外，由于 Node 是一个 Web 服务器，如果让它提供你的\
    \ HTML 而像你目前那样将其作为静态文件加载会更好。\n\n# $HTTP\n\n要在 Angular 中执行 HTTP 调用，你将使用其内置的 HTTP\
    \ 客户端：`$http`。如果你还没有注意到，官方 Angular 组件以 `$` 开头。你不应该为你创建的组件加上 `a` 前缀。\n`$http` 是一个非常标准的\
    \ HTTP 客户端，包含常用方法：`$http.get()`、`$http.post()` 等。它是基于 Promise（承诺）的。\n\n# 什么是 Promise？\n\
    \nPromise 是在 JavaScript 中编写异步代码的一种，作为 Node 使用的传统回调方法的替代。\n如果你看一个流行的 Node HTTP\
    \ 客户端 `request`，你可以看到区别。\n这里是 Angular 的 `$http`：\n\n```javascript\n$http.get('http://localhost:3000/api/posts')\n\
    .success(function (posts) {\n  // 处理 posts\n})\n.error(function (err) {\n  //\
    \ 处理错误\n})\n```\n\n这是 Node 的 `request`：\n\n```javascript\nrequest.get('http://localhost:3000/api/posts',\
    \ function (err, response, data) {\nif (err) { /* 处理错误 */}\n// 处理 posts\n})\n\
    ```\n\n主要区别在于，使用 Promise 时你会得到一个对象，可以根据成功或失败调用不同的方法。在回调方法中，只有一个函数来处理所有情况。\n现在不需要深入理解\
    \ Promise，但要理解 Angular 代码是基于 Promise 的，而 Node（传统上）不是。\n关于哪种方法更好存在一些争议。Promise\
    \ 最近变得越来越流行，并将包含在 JavaScript 的下一个版本（ES6）中。有些人在 Node 中完全使用 Promise，你也可以在自己的代码中这样做。在本书中，我将在\
    \ Node 代码中使用回调，在 Angular 代码中使用 Promise 以符合约定。\n\n# 通过 HTTP 从 API 读取 posts\n\n\
    如果你回到 Angular 应用（posts.html）并查看你的控制器，你会看到：\n\n```javascript\napp.controller('PostsCtrl',\
    \ function ($scope) {\n  $scope.addPost = function () {\n    if ($scope.body)\
    \ {\n      $scope.posts.push({\n        username: 'dickeyxxx',\n        body:\
    \ $scope.body\n      });\n      $scope.body = null;\n    }\n  }\n  $scope.posts\
    \ = [\n    {\n      username: 'dickeyxxx',\n      body: 'node rules!'\n    }\n\
    \  ];\n});\n```\n\n# 通过 Node 提供 posts.html\n\n为了让 Node 托管你的 HTML，首先将 `posts.html`\
    \ 文件复制到 Node 应用中名为 `layouts` 的新文件夹。为什么是 `layouts` 而不是 `views` 或 `templates`？因为以后你会有部分模板（partials）。\n\
    \n现在打开你的 `server.js` 并添加以下端点：\n\n```javascript\napp.get('/', function (req, res)\
    \ {\n  res.send('layouts/posts.html')\n})\n```\n\n现在启动你的 Node 应用，在浏览器中打开 http://localhost:3000。\n\
    \n# 使用 $HTTP 将 posts 保存到 API\n\n现在你已经可以干净地从 API 读取数据，你需要在添加新帖子时 POST 到 API。这也将使用\
    \ `$http`。修改 Angular 布局文件中的 `addPost()` 方法如下所示：\n\n```javascript\n$scope.addPost\
    \ = function () {\n  if ($scope.body) {\n    $http.post('/api/posts/', {\n   \
    \   username: 'dickeyxxx',\n      body: $scope.body\n    }).success(function (post)\
    \ {\n      $scope.posts.unshift(post)\n      $scope.body = null;\n    });\n  }\n\
    }\n```\n"
