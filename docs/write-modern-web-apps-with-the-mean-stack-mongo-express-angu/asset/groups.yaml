  - "[PAGE 45]\n\n# ADDING NEW POSTS\n\nFIGURE 3.2 Angular-ized Recent Posts page\n\
    \n![](img/a45e866f1e25bfccba9780b8e48fa81d_45_0.png)\n\nYou've now linked up the\
    \ code to Angular such that your controller is providing the data and then allowing\
    \ the view to display it, but right now it's the same as when you started with\
    \ the static HTML.\n\nWhat you need to do is have a field on the page for users\
    \ to add new posts.\n\nIf you add a new element to the $scope.posts array, Angular\
    \ will automatically update the view to show it. If you also have an input and\
    \ button on the page to add a new post, you just need to append to that array.\n\
    \nTo illustrate, let's add a button to the page. Before the list-group <ul>, add\
    \ this button:\n<button ng-click='addPost()' class='btn btn-default'>Add Post</button>\n\
    \nng-click is a directive that is typically used to call a function on $scope.\
    \ Right now clicking it will do nothing, but if you add the function, you can\
    \ add a new post to your list of posts.\nAdd the following line inside your controller:\n\
    \n```\n$scope.addPost = function () {\n  $scope.posts.unshift({\n    username:\
    \ 'dickeyxxx',\n    body: 'my new post!'\n  });\n}\n```\n\nunshift is a JavaScript\
    \ method on arrays that pushes a new element to the beginning of the array. You\
    \ should be able to click the Add Post button and add elements to the list (see\
    \ Figure 3.2).\n\nBecause you didn't have to write any code to actually update\
    \ the list when $scope.posts changed, you can cleanly separate the logic that\
    \ updates the data from the view logic. If you updated the posts by deletion.\
    \ Ajax call, or WebSockets information, you just need to update $scope.posts,\
    \ and Angular will take care of the updating for for you."
