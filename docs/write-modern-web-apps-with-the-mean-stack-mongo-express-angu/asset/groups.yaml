    \ = router\n\nThis controller has two actions: to get an existing user and the\
    \ other to create a new user.\nYou're almost done with authentication. Create\
    \ a new user with curl so that you can test it with your Angular app's login functionality.\n\
    \n```bash\n$ curl -X POST -d '{\"username\": \"dickeyxxx\", \"password\": \"pass\"\
    }' -H\n\"Content-Type: application/json\" localhost:3000/api/users\n```\n\nNow\
    \ you should be able to log in with this user. Remember, all logging in does right\
