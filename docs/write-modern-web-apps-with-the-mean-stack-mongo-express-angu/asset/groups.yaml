    - Item 4\n\n![](img/a45e866f1e25bfcc9780b8e481d.png)\n\n这样做可行，但现在 JavaScript 必须知道像生成\
    \ HTML 的服务器那样生成 `<li>`。这包含了整个标记，例如特殊类、内联样式或其他元素。添加实时更新、删除项目和设置样式等功能变得困难，因为所有的代码都需要添加、删除和更新\
    \ `<li>` 以保持同步。\n\n在 Angular 中，相反，你让 Angular 使用*指令*构建 `<ul>`。指令是 Angular 理解的特殊自定义\
