  - "[PAGE 188]\n\n# THE NPM TEST COMMAND\n\nNode offers a place to put the command\
    \ you want to run for tests in package.json. When it is set up, you can run the\
    \ test suite of any project with a package json file by running npm test. This\
    \ is a good idea since it provides documentation for how to test your project\
    \ for other developers. For projects with multiple test suites (such as ours),\
    \ it allows developers to easily recall the command to run all the tests. It is\
    \ also useful as a continuous integration (CI) entry point.\n\nIt's a simple feature\
    \ but is certainly one worth using. Add the following section to your package.json:\n\
    \n```\n\"scripts\": {\n  \"test\": \"./node_modules/.bin/mocha && ./node_modules/.bin/protractor\"\
    \n}\n```\n\nThen run it:\n\n$ npm test\n\nYou should see the Node server tests\
    \ run, and if they are successful, Protractor should execute afterward. && tells\
    \ your shell to run the left side first, and if it returns a o status code, run\
    \ the next."
  - "[PAGE 189]\n\n# JSHINT\n\nNow that you have your npm script set up, it's a good\
    \ time to introduce JSHint. JSHint is a linting tool for JavaScript used for consistent\
    \ syntax with JavaScript code. Unlike some languages, the JavaScript community\
    \ doesn't have very solid standards on the \"right\" to write code, so having\
    \ a configured tool like this in each project is useful.\n\nInstall JSHint into\
    \ the project as a development dependency:\n\n$ npm install --save-dev jshint\n\
    \nThen add it as a step in the npm test script:\n\n```\n\"scripts\": {\n  \"test\"\
    : \"./node_modules/.bin/jshint && ./node_modules/.bin/mocha\\n  ./node_modules/.bin/protractor\"\
    \n}\n```\n\nNote that there is a . after JSHint.\n\nYou'll see a warning that\
    \ installing JSHint globally and not into the project. I suggest for this situation\
    \ you install it into the project so other developers can just run npm test and\
    \ it will automatically lint any new code they've added. Generally, though, it's\
    \ good idea to run JSHint inside your text editor every time it saves—which you'll\
    \ want to have JSHint installed globally for.\n\nRunning JSHint now will be slow\
    \ and probably going to result in many issues because it will look at every .js\
    \ file in the directory and subdirectories (including /assets and /node_modules).\
    \ You can tell JSHint to ignore files by adding a file .jshintignore at the root\
    \ of the project with directories/files to ignore. Here is an example:\n\nnode_modules\n\
    assets\ncoverage\n\nTo customize JSHint, you'll want to create a file .jshint\
    \ at the root of the project. Here is a short example that configures JSHint for\
    \ Node projects and no semicolons:\n\n```\n{\n  \"asi\": true,\n  \"node\": true\n\
    }\n```\n\nYou can use different rules for different parts of the code, and that\
    \ config file .jshintrc in a subdirectory, will take precedence. For the social\
    \ app, it might make sense to have an Angular .jshintrc in /ng, a Node.js one\
    \ at the root, and one for the test suites.\n\nFor more on configuring JSHint,\
    \ check out the documentation at www.jshint.com. You will also find a .jshintrc\
    \ file inside my sample social app project on GitHub."
- md: "\n# NEXT STEPS\n\nNow that you've seen how to write tests for the Node server,\
    \ the next chapter will introduce you to unit testing Angular components. Unlike\
    \ vanilla Node, Angular has powerful dependency injection tools that help testing\
    \ components in isolation.\n\n# CHAPTER 12\n\n# Testing Angular.js\n\nIn the previous\
    \ two chapters, you wrote an end-to-end test with Protractor and tests for the\
    \ Node server. Now you'll look at writing tests on the client side for Angular.\n\
    \n# USING KARMA\n\nMuch like end-to-end tests have Protractor as the runner, Angular\
    \ tests make use of Karma. Karma is a test runner designed for unit testing. It\
    \ can also run in multiple browsers, including Chrome, Firefox, and PhantomJS.\
    \ Built by the Angular team like Protractor, Karma has a similar configuration\
    \ setup and ways to run it.\n\nThe biggest difference with Karma is that you're\
    \ usually not working with the DOM, so the UI isn't important. In fact, you won't\
    \ even be using your layout file. For this reason, most developers run Karma under\
    \ a headless client like PhantomJS. Karma is just a way to get a client-side JavaScript\
    \ runtime going to start running tests.\n\n# USING BOWER\n\nBefore you will be\
    \ able to do any client-side unit tests, you will need to set up Bower in your\
    \ application. Bower is a tool designed to manage front-end dependencies—similar\
    \ to how npm manages back-end dependencies.\n\nIt's not totally necessary to have\
    \ Bower; you could just download the assets and commit them into the file. I suggest\
    \ it to keep your repo clean and lock your versions down, however.\n\nYou haven't\
    \ needed to install Bower yet because you load your third-party dependencies (currently\
    \ just Angular) through the Google CDN. In Karma, you need to have these dependencies\
    \ local. You'll still use the CDN for loading these assets outside of Karma, but\
    \ having Bower set up is useful for dependencies not available on a public CDN.\n\
    \nFirst, install Bower globally:\n\n```bash\n$ npm install --global bower\n```\n\
    \nThen create a file in the root of the project bower.json:\n\n```json\n{\n  \"\
    name\": \"social-app\",\n  \"dependencies\": {\n    \"angular\": \"~1.2.21\",\n\
    \    \"angular-mocks\": \"~1.2.21\",\n    \"angular-route\": \"~1.2.21\"\n  }\n\
    }\n```\n\n## 12.1 Bower\n\ninstalling Angular assets\n\n```bash\n$ -s/g/d/mean-sample{master}\
    \ # bower install\nbower cached git://github.com/bower/bower-angular.git#1.2.21\n\
    bower validate 1.2.21 against git:github.com/bower/bower-angular-mocks.git#1.2.21\n\
    bower cached git://github.com/bower/bower-angular-mocks.git#1.2.21\nbower validate\
    \ 1.2.21 against git:github.com/bower/bower-angular-route.git#1.2.21\nbower validate\
    \ 1.2.21 against git:github.com/bower/bower-angular-route.git#1.2.21\nbower install\
    \ angular-mocks#1.2.21\nbower install angular#1.2.21\nbower install angular-route#1.2.21\n\
    angular-mocks#1.2.21 assets/angular-mocks\nangular#1.2.21 assets/angular\nangular-route#1.2.21\
    \ assets/angular-route\nangular-route#1.2.21\nnode finish\n```\n\nAlternatively,\
    \ you can run the command bower init to generate this file and see other configuration\
    \ options.\n\nNow create the other bower config file, .bowerrrc, in the root of\
    \ the project.\n\n```json\n{\n  \"directory\": \"assets\"\n}\n```\n\nWithout this\
    \ setting, Bower would default to putting the assets into a directory bower_components.\
    \ That would be okay, but having the assets in your existing assets folder allows\
    \ you to reuse the static hosting code you already have. For what you'll be working\
    \ with in this chapter, it doesn't matter where you install it so long you set\
    \ the Karma config to point to the right location.\n\nOnce the .bowerrrc and bower.json\
    \ files are in place, install the bower components:\n\n```bash\n$ bower install\n\
    ```\n\nYou should see output like in Figure 12.1.\n\nNow that you have the assets\
    \ on the filesystem, you can continue up Karma.\n\n# SETTING UP KARMA\n\nKarma\
    \ has sort of a strange method of installing. First you need to globally install\
    \ the karma-cli package, and then you install Karma into the project:\n\n```bash\n\
    $ npm install --global karma-cli\n```\n\n```bash\n$ npm install --save-dev karma\n\
    ```\n\nWhile you're installing packages, go ahead and install some Karma plugins\
    \ you'll need:\n\n```bash\n$ npm install --save-dev karma-chai karma-mocha karma-phantomjs\
    \ karma-launcher\n```\n\nNow create this Karma config file at karma.conf.js:\n\
    \n```javascript\nmodule.exports = function(config) {\n  config.set({\n    frameworks:\
    \ ['mocha', 'chai'],\n    files: [\n      'assets/angular/angular.js',\n     \
    \ 'assets/angular-route/angular-route.js',\n      'assets/angular-mocks/angular-mocks.js',\n\
    \      'ng/**/spec.js'\n    ],\n    reporters: ['progress'],\n    port: 17016,\n\
    \    colors: true,\n    autoWatch: true,\n    browsers: ['PhantomJS'],\n    singleRun:\
    \ false\n  });\n```\n# BASIC KARMA SERVICE TEST\n\nServices are relatively easy\
    \ to test with Karma since they typically expose a method that makes an HTTP call.\n\
    \nFor reference, here is the post service you will be testing:\n\n```javascript\n\
    angular.module('app')\n.service('PostsSvc', function ($http) {\n  this.fetch =\
    \ function () {\n    return $http.get('/api/posts')\n  }\n  this.create = function\
    \ (post) {\n    return $http.post('/api/posts', post)\n  }\n})\n```\n\nCreate\
    \ a file test/ng/posts.svc.js with the following. This is just a simple test to\
    \ see whether the fetch method exists on an instance of theSvc.\n\n```javascript\n\
    describe('posts.svc', function () {\n  beforeEach(module('app'))\n  var PostsSvc\n\
    \n  beforeEach(inject(function (_PostsSvc_) {\n    PostsSvc = _PostsSvc_\n  }))\n\
    \n  describe('#fetch', function () {\n    it('exists', function () {\n      expect(PostsSvc.fetch).to.exist\n\
    \    })\n  })\n})\n```\n\nFirst, you declare that you are using the app module\
    \ and create a placeholder variable for an instance of the PostsSvc.\n\nNext,\
    \ you use the dependency injection to provide you with an instance of the PostsSvc\
    \ and place it in your variable. The underscores around _PostsSvc_ are a trick\
    \ you often see in Angular unit tests. Just like the injector when you create\
    \ the service looks at the argument names to know what type of object to add in,\
    \ this inject() function does the same. The underscores are optional. They're\
    \ used in tests like this because you have a variable already called PostsSvc\
    \ that you want to reuse.\n\nFinally, you declare a describe block and an it block\
    \ for checking whether the fetch method exists on the service. Note that you don't\
    \ have to declare Chai like you did in Node and Protractor; adding it to karma.conf.js\
    \ is enough to start using it in the tests.\n\nTry running Karma again now; this\
    \ test should execute successfully.\n"
  mdcn: "\n\n# 下一步工作\n\n现在你已经了解了如何为 Node 服务器编写测试，下一章将向你介绍如何对 Angular 组件进行单元测试与原生 Node\
    \ 不同，Angular 拥有强大的依赖注入工具，可以帮助对组件进行隔离。\n\n# 第 12 章\n\n# 测试 Angular.js\n\n在之前的两个章节中，你使用\
    \ Protractor 编写了端到端测试，并为 Node 服务器编写了测试。现在你将查看如何为 Angular 编写客户端测试。\n\n# 使用 KARMA\n\
    \n就像端到端测试使用 Protractor 作为运行器一样，Angular 测试使用 Karma。Karma 是一个为单元测试设计的测试运行器。它还可以在多个浏览器中运行，包括\
    \ Chrome、Firefox 和 PhantomJS。Karma 与 Protractor 一样由 Angular 团队构建，具有类似的配置设置和运行方式。\n\
    \nKarma 最大的区别在于，你通常不需要操作 DOM，因此 UI 并不重要。事实上，你甚至不会用到的你的布局文件。由于这个原因，大多数开发者会在像 PhantomJS\
    \ 这样的无头客户端下运行 Karma。Karma 仅仅是启动客户端 JavaScript 运行时以开始测试的一种方法。\n\n# 使用 BOWER\n\n\
    在进行任何客户端单元测试之前，你需要在应用程序中设置 Bower。Bower 是一个设计用于管理前端依赖的工具——类似于 npm 管理后端依赖的方式。\n\n\
    拥有 Bower 并不是绝对必要的；你只需要下载资源并将它们提交到文件中即可。然而，我建议这样做，以保持你的仓库整洁并锁定版本。\n\n你之前还不需要安装\
    \ Bower，因为你通过 Google CDN 加载了第三方依赖（目前只有 Angular）。在 Karma 中，你需要将这些依赖项本地化。你仍然会在 Karma\
    \ 之外使用 CDN 加载这些资源，但设置好 Bower 对于那些在公共 CDN 上不可用的依赖项是很有用的。\n\n首先，全局安装 Bower：\n\n\
    ```bash\n$ npm install --global bower\n```\n\n然后，在项目根目录下创建一个 `bower.json` 文件：\n\
    \n```json\n{\n  \"name\": \"social-app\",\n  \"dependencies\": {\n    \"angular\"\
    : \"~1.2.21\",\n    \"angular-mocks\": \"~1.2.21\",\n    \"angular-route\": \"\
    ~1.2.21\"\n  }\n}\n```\n\n## 12.1 Bower\n\n安装 Angular 资源\n\n```bash\n$ -s/g/d/mean-sample{master}\
    \ # bower install\nbower cached git://github.com/bower/bower-angular.git#1.2.21\n\
    bower validate 1.2.21 against git:github.com/bower/bower-angular-mocks.git#1.2.21\n\
    bower cached git://github.com/bower/bower-angular-mocks.git#1.2.21\nbower validate\
    \ 1.2.21 against git:github.com/bower/bower-angular-route.git#1.2.21\nbower validate\
    \ 1.2.21 against git:github.com/bower/bower-angular-route.git#1.2.21\nbower install\
    \ angular-mocks#1.2.21\nbower install angular#1.2.21\nbower install angular-route#1.2.21\n\
    angular-mocks#1.2.21 assets/angular-mocks\nangular#1.2.21 assets/angular\nangular-route#1.2.21\
    \ assets/angular-route\nangular-route#1.2.21\nnode finish\n```\n\n或者，你可以运行命令 `bower\
    \ init` 来生成此文件并查看其他配置选项。\n\n现在，在项目根目录下创建另一个 Bower 配置文件 `.bowerrrc`。\n\n```json\n\
    {\n  \"directory\": \"assets\"\n}\n```\n\n如果没有此设置，Bower 将默认将资源放入 `bower_components`\
    \ 目录。有了此设置，Bower 会把资源放入 `assets` 目录。由于这个原因，大多数开发者会在像 PhantomJS 这样的无头客户端下运行 Karma。Karma\
    \ 仅仅是启动客户端 JavaScript 运行时以开始测试的一种方法。一旦你有了 `.bowerrrc` 和 `bower.json` 文件，就可以继续了。\n\
    \n# 设置 KARMA\n\n现在你将安装 Karma 运行器。\n\n```bash\n$ bower install\n```\n\n# 设置 KARMA\n\
    \n```bash\n$ npm install karma\n```\n\n# 设置 KARMA\n\n现在你还需要安装一些 插件：\n\n```bash\n\
    $ npm install karma-devcli\n```\n\n# 设置 KARMA\n\n```bash\n$ npm install phantomjs\n\
    ```\n\n# 设置 KARMA\n\nKarma 有一种奇怪的配置。首先，你需要全局安装 karma-cli：\n\n```bash\n$ npm install\
    \ -global karma-cli\n```\n\n# 设置 KARMA\n\n现在你还需要安装一些 插件：\n\n```bash\n$ npm install\
    \ karma-mocha\n```\n\n# 设置 KARMA\n\n现在你还需要安装一些 插件：\n\n```bash\n$ npm install karma-chai\n\
    ```\n\n# 设置 KARMA\n\n现在你还需要安装一些 插件：\n\n```bash\n$ npm install karma-angular\n\
    ```\n\n# 设置 KARMA\n\n现在创建这个 `karma.conf.js`：\n\n```javascript\nmodule.exports\
    \ = function(config) {\n  config.set({\n    frameworks: ['mocha', 'chai'],\n \
    \   files: [\n      'assets/angular.js',\n      'assets/angular-route/angular-route.js',\n\
    \      'assets/angular-mocks/angular-mocks.js',\n      'ng/**/spec.js'\n    ],\n\
    \    reporters: ['progress'],\n    port: 17016,\n    colors: true,\n    autoWatch:\
    \ true,\n    browsers: ['PhantomJS'],\n    singleRun: false\n  });\n```\n\n# 基础的\
    \ KARMA 服务测试\n\n使用 Karma 测试服务是相对容易的，因为它们通常暴露一个调用 HTTP 方法。为了参考，这里是你将要测试的服务：\n\n\
    ```javascript\nangular.module('app')\n.service('Postsvc', function ($http) {\n\
    \  this.fetch = function () {\n    return $http.get('/api/posts')\n  }\n  this.create\
    \ = function (post) {\n    return $http.post('/api/posts', post)\n  }\n})\n```\n\
    \n创建一个 `test/ng/posts.svc.js` 并写入以下内容。这只是一个检查 service 实例上是否存在 fetch 方法的简单测试。\n\
    \n```javascript\ndescribe('posts.svc', function () {\n  beforeEach(module('app'))\n\
    \  var Postsvc\n\n  beforeEach(inject(function (_Postsvc_) {\n    Postsvc = _PostsSvc_\n\
    \  }))\n\n  describe('#fetch', function () {\n    it('exists', function () {\n\
    \      expect(Postsvc.fetch).to.exist\n    })\n  })\n})\n```\n\n首先，你声明正在使用 `app`\
    \ 模块，并为 Postsvc 的实例创建一个占位符变量。\n\n接下来，你使用依赖注入为你提供 Postsvc 的实例并将其放入你的变量中。`_Postsvc_`\
    \ 外围的下划线是 Angular 单元测试中常见的技巧。就像创建服务时的注入器会查看参数名称以确定添加什么类型的对象一样，这个 `inject()` 函数也是如此。下划线是可选的。在类这样的测试中使用它们是因为你已经有了一个名为\
    \ `Postsvc` 的变量想要复用它。\n\n最后，你声明了一个 `describe` 块和一个 `it` 块，用于检查服务上是否存在 fetch 方法。注意，你不需要像在\
    \ Node 和 Protractor 中那样声明 Chai；将它添加到 `karma.conf.js` 中就足够在测试中使用它了。\n\n现在再次运行 Karma；这个测试应该会执行成功。\n\
    \n"
