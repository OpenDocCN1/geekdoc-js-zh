  - '[PAGE 218]


    # MongoDB ON HEROKU


    The application requires a connection to MongoDB, so let''s add a MongoDB add-on
    and see whether you can get past this error. Typically deploying an application
    involves this process of seeing an error, fixing it, and then moving on to the
    next one.


    Install MongoDBLab (alternatively you could also install the MongoDBHQ add-on
    and the process would be similar). Note that you will need to verify your Heroku
    account (add credit card information to it) before this will work. The add-on
    is free; requiring a credit card helps prevent abuse of the free resources.


    $ heroku addons:add mongolab


    Heroku provides the connection information to the application via environment
    variables. You can see all the environment variables either in the dashboard or
    with the tool belt:


    $ heroku config


    This will show the MONGODB_URI environment variable and its value. You need to
    modify your application to check for that MONGODB_URI environment variable and
    use it if it exists.

    Modify db.js to look like the following:


    ```

    var mongoose = require(''mongoose'')

    var url = process.env.MONGODB_URI || ''mongodb://localhost/social''

    mongoose.connect(url)

    module.exports = mongoose

    ```


    This is a common pattern with Heroku applications. Your app will first check an
    environment variable for a configuration option, and if it doesn''t find it, default
    to a local development setting. This allows you to deploy your application in
    different environments without any code changes. It also allows you to change
    services simply by modifying environment variables and not requiring a full deploy.'
