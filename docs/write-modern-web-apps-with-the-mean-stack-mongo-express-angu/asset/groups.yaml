    that simply could not be built without JavaScript.


    Developers would often mock applications that supported users with JavaScript
    only. javascript.tumblr.com is one example that its latest post was only in September
    2013, but it looks like a relic of the distant past. Today, though no popular
    browser allows you to disable JavaScript, and the simplest sites there still require
    it. In other words, as a developer, you can now depend on JavaScript being enabled.
    Progressive enhancement helped developers back quite a bit when crafting applications,
    but that is no longer a worry.


    # SPAGHETTI JAVASCRIPT


    Another problem arose in the time JavaScript wasn''t taken seriously: maintenance.
    Applications began to explode with the size of JavaScript, and quickly there were
    a bunch of ad hoc JavaScript pieces littered throughout codebases. Standards for
    writing JavaScript well were practiced by only the most expert of JavaScript developers.


    JavaScript was looked upon, the code you would write as little as possible. When
    you had to fix something with JavaScript that another developer wrote, it meant
    tossing the code out the window and rewriting the feature completely.


    Application codebases were bad, and developers needed structure to define their
    applications. had learned with server-side languages, so typically applications
    would have good structure and code on the server side (with automated tests) but
    would be extremely lacking on the front end. In fact, JavaScript testing frameworks
    have been around only since 2009.


    # MOBILE APIS


    Along with Ajax, another change appeared in the development world: mobile. Native
    mobile applications quickly took over the development community and became arguably
    even more popular than their web counterparts.


    Since mobile applications still often needed a back end, they would have to communicate
    with a server using some kind of an API to move data back and forth. Servers were
    already serving HTML, so this became a natural fit. Typically native mobile apps
    would send/receive JSON, while web browsers would send/receive HTML.


    Developers would typically find themselves writing two interfaces to the same
    application, one for native mobile apps that worked a REST-like API and another
    for the web browsers they already knew.'
  - '[PAGE 17]


    # ENTER THE THICK CLIENT


    Knowing that you can now generally depend on JavaScript being in browsers, a new
    way to develop applications has begun. You can build thick clients that will do
    the heavy lifting (rather than the server doing most of that work) and interact
    with a server via an API (much in the way of a mobile client).


    # HOW MODERN WEB ARCHITECTURE WORKS


    This flow works as follows:


    +   1. The user''s browser requests a static HTML page.

    2. The HTML page contains JavaScript that builds the base structure of the page.

    3. The JavaScript then performs Ajax to load content (typically JSON) via an API.

    4. JavaScript then takes this content and modifies the DOM to represent the content.


    The main difference with this method is that the angle brackets (HTML) are generated
    on the client, not on the server. This is a huge difference from how applications
    were built in the past.


    # THE BENEFITS OF MODERN WEB ARCHITECTURE


    This modern workflow has the following advantages:


    +   - Simpler back end: As applications require only a single API to transmit/receive
    content, the same API used for mobile apps can now be used for the browser as
    well. It also turns to be much easier to build software that speaks JSON than
    software that speaks HTML.

    - Performance: Most of the work that servers do is building HTML pages. Moving
    that work to the client saves a tremendous amount of effort. The front-end code
    can be easily served by a CDN (content delivery network) that can quickly deliver
    the bootstrapping content anywhere in the world. Since the client no longer has
    to download and render complete pages, the performance on the user''s end can
    be much greater as well.

    - Standard tools: Static applications are built with heavy amounts of JavaScript,
    HTML, and CSS. These are the building blocks of the Web and understood by all
    web developers.

    - Rapid prototyping: Because the only requirement to build an application is front-end
    JavaScript, it is easy to mock up a web application. All the server data can be
    stubbed (or simply not saved), and you can focus on the user''s experience. Later
    you can fill in the functionality with an API.

    - Increased modularity: Since you no longer have one giant codebase (known in
    the Rails world as the monolith), you can break your application into logical
    pieces, each well suited to perform its specific task.'
