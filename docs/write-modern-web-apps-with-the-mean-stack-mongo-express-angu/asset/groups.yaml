    \nHere is the code for your UserSvc that goes in ng/user.svc:\n\n```javascript\n\
    angular.module('app')\n.service('UserSvc', function ($http) {\n  var svc = this;\n\
    \  svc.getUser = function () {\n    return $http.get('/api/users', {\n      headers:\
    \ { 'X-Auth': this.token }\n    })\n  }\n  svc.login = function (username, password)\
    \ {\n    return $http.post('/api/sessions', {\n      username: username, password:\
    \ password\n    }).then(function (val) {\n      svc.token = val.data;\n      return\
    \ svc.getUser()\n    });\n  }\n});\n```\n\nThe login process has two steps. First\
    \ you call POST /api/sessions to get a JWT; then you call GET /api/users to get\
    \ the currently-in user's information. You could have the server send data back\
    \ in the login callback, but it's good to keep your API requests as simple as\
    \ possible to promote reuse. Also Node and Angular are so fast that this will\
    \ happen quickly.\n\nAttempting to fill out the form will now give you a 404 because\
