    \ it's common to see Node.js as a layer to an MVC web server.\n\n# DOCUMENT-ORIENTED\n\
    \nRather storing data in a series of rows and tables like SQL, MongoDB has collections\
    \ and documents. While you can mostly think of a collection being like a table,\
    \ a document is quite a bit different from a row.\n\nThe main reason documents\
    \ are different is that they contain contain more information. In SQL, if you\
    \ wanted to represent a user and and roles, you might have three tables for the\
    \ task, as shown here:\n\n| user_id | email |\n|---|---|\n| 100 | jeff@dickxxx.com\
    \ |\n| 101 | bob@dickxxx.com |\n\n| role_id | name |\n|---|---|\n| 1 | Admin |\n\
    | 2 | Operations |\n\n| role_id | user_id |\n|---|---|\n| 1 | 101 |\n| 2 | 102\
    \ |\n\nBecause MongoDB is by far the most common choice for Node.js, that's what\
    \ you will be looking at in this book.\n\n# WHAT IS MongoDB?\n\nTo complete the\
