  - '[PAGE 226]


    In the previous chapter, you learned how to put the social app in production by
    using the PaaS Heroku. In this chapter, you''ll learn how to deploy the same app
    to a server using Digital Ocean.'
  - '[PAGE 227]


    # WHAT IS DIGITAL OCEAN?


    Digital Ocean is a simple cloud server provider. It offers some of the lowest-cost
    cloud servers along with a good UI and easy-to-use tools. It is comparable to
    AWS or Rackspace, but I find Digital Ocean much easier to work with and cheaper
    as well.


    Admittedly, Digital Ocean doesn''t offer the same level of functionality as the
    others, but it''s well worth the simplicity. Most of the features offered by Rackspace
    and AWS are easily available by other providers.


    This chapter is not specific to Digital Ocean and will work similarly on any other
    server.'
  - '[PAGE 228]


    # SINGLE-SERVER VS. MULTISERVER ARCHITECTURE


    When deploying your software to servers, you''ll need to decide what software
    will run on what machine. In addition, you''ll need to decide which servers should
    be publicly accessible and which don''t need to be.


    For this guide you will be using a simple single-server setup that should be powerful
    enough for most applications, but it wouldn''t be challenging to move this to
    a multiserver setup.


    Later in this chapter I''ll have some tips on what to do in order to migrate to
    a multiserver architecture.'
  - '[PAGE 229]


    # FEDORA 20


    I will be using Fedora 20 for this guide. All Linux distros (aside from Gentoo)
    are moving to systemd as their init system. Ubuntu—the most common distribution
    right now—has plans to move to systemd but hasn yet. Ubuntu uses Upstart, which
    has its days numbered now that Ubuntu is moving away from it. This is the main
    reason for using Fedora in this chapter, but it''s a great distro in any case.


    systemd offers some significant advantages over Upstart including advanced, centralized
    logging; simpler configuration; faster speeds; and more features.'
  - '[PAGE 230]


    # CREATING A SERVER


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_230_0.png)


    > FIGURE 14.1 Creating a droplet on Digital Ocean


    Get your server set up, first create an account with Digital Ocean at http://digitalocean.com.
    Also take the time to add your SSH key to Digital Ocean. This isn''t totally necessary
    since you can use a root password, but it''s preferable for security and ease
    of use.


    Now create a new droplet (see **Figure 14.1**). Digital Ocean doesn''t use the
    term server since it is actually a VM on a machine shared with other users. I
    will use the terms *droplet* and server interchangeably since as a developer the
    difference is nearly transparent.


    Give it a hostname of anything you want—this is just used for reference. Then
    select Fedora 20 x64 as the distro (see **Figure 14.2**, on the next page).


    You will now see the droplet provision; this will take about a minute (see **Figure
    14.3**, on the next page).'
  - '[PAGE 231]


    # FIGURE 14.2 Selecting Fedora 20 x64 as the distro


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_231_0.png)


    # FIGURE 14.3 Creating the droplet


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_231_1.png)'
  - '[PAGE 232]


    # mean-sample


    107.170.222.168 Active 512MB Ram 20GB SSD Disk San Francisco 1 Fedora 20 x64


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_232_0.png)


    Once it''s created, you will see a screen with various information, performance
    graphs, configuration, and commands you can perform on the droplet (see Figure
    14.4). The main piece of of information you need is the IP address.


    If you''ve set up your SSH key, you can now SSH into the server as root, where
    x.x.x.x is the real IP address.


    ```

    $ ssh root@x.x.x.x

    ```


    NOTE You''ll see a command prompt of # instead of $ whenever you should be executing
    commands as root.'
  - '[PAGE 233]


    # INSTALLING NODE


    Once logged into the server, you can move on to installing Node. On Fedora, you
    use the package manager yum to install software. Each distro will have its own
    package manager (such as apt-get for Ubuntu), so the particulars of the commands
    will change, but the overall approach is the same.


    First update to make sure you will be installing the latest tools and that your
    system is up-to-date. It will take a moment.


    ```

    # yum update

    ```


    Then install the following (or a text editor of your choice):


    ```

    # yum install nodejs npm vim

    ```


    Check to see whether these are installed successfully by checking the versions,
    as shown here:


    ```

    # git --version

    git version 1.9.3

    # node --version

    v0.10.30

    ```


    Running --version on any Unix command is a good way to see whether it is installed
    correctly. Both Git and Node here are outdated versions even at the time of this
    writing—typical for packages in yum. Git being outdated isn''t a big deal, but
    you should be running on the latest stable version of Node. Rather than upgrading
    Node, you can use the great package n to get the latest stable version. n also
    allows switching between versions of Node easily.


    First, install n:


    ```

    # npm install --global n

    ```


    Now download the latest stable version of Node:


    ```

    # n stable

    ```


    Now that it is downloaded, you can switch to using it with the same command:


    ```

    # n stable

    # node --version

    v0.10.31

    ```


    n is also good to have in case you want to lock down to a specific Node version.'
- md: "\n# INSTALLING MongoDB\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_234_0.png)\n\
    \n```\n[root@mean-sample-1 systemctl status mongodb]\nmongod.service - SYS: MongoDB\
