  - "[PAGE 93]\n\n# GULP DEV TASK\n\nThis is great for making sure the CSS keeps getting\
    \ updated, but it's a bit of a pain since you now have three processes to keep\
    \ running: the server, gulp watch:js, and gulp watch:css. I like to create a gulp\
    \ dev that just runs everything that needs to run while working on the application.\n\
    \nFor these kinds of 'metatasks', it's best to keep them inside the main gulpfile.js.\
    \ Add a task in there like the following:\n\n```\ngulp.task('dev', ['watch:css',\
    \ 'watch:js'])\n```\n\nNow if you run gulp dev, it'll watch both the CSS and JavaScript\
    \ files for updates. Note that having a function block for Gulp tasks is optional.\
    \ This one just depends on two others.\n\n# GULP-NODEMON\n\nNow that your assets\
    \ are being compiled, let's add a Gulp task to start nodemon to run your app for\
    \ you.\n\n+   - First, install gulp-nodemon\n\n```\n$ npm install --save gulp-nodemon\n\
    ```\n\nNow create the file /gulp/server.js with the following task:\n\n```\nvar\
    \ gulp = require('gulp')\nvar nodemon = require('gulp-nodemon')\ngulp.task('dev:server',\
    \ function () {\n  nodemon({\n    script: 'server.js',\n    ext: 'js'\n  })\n\
    })\n```"
  - "[PAGE 94]\n\nYou can now run gulp dev:server to boot your app. It'll automatically\
    \ restart if there are any changes to files ending in .js. One annoying thing\
    \ about it is that it reboots even for non-Node code changes, causing a lot of\
    \ restarts while working on the app. To exclude non-Node files, add an ignore\
    \ section to the config:\n\n```\ngulp.task('dev:server', function () {\n  nodemon({\n\
    \    script: 'server.js',\n    ext: 'js',\n    ignore: ['ng*', 'gulp*', 'assets*']\n\
    \  })\n})\n```\n\nYou'll want to keep that ignore section updated as you add more\
    \ and more JavaScript files to your application.\n\nNow that you have the server\
    \ working with gulp dev:server, let's include it in gulp gulp.task('dev', ['watch:css',\
    \ 'watch:js', 'dev:server'])\n\nNow gulp dev will run all the processes you need\
    \ to build your application. If there were other tasks you could run, you could\
    \ just add it to Gulp. Since those tasks Gulp tasks are just Node functions, you\
    \ could do anything you want in a task. It's usually used for asset compilation,\
    \ but as so you saw with gulp-nodemon, that's certainly not the only use case."
