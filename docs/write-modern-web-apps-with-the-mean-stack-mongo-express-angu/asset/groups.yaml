    \ Web 浏览器。\n\n## 进入胖客户端 (ENTER THE THICK CLIENT)\n\n既然现在通常可以依赖浏览器中存在 JavaScript，一种新的应用程序开发方式已经开始。你可以构建胖客户端，由它们来承担繁重的工作（而不是让服务器承担大部分工作），并通过\
    \ API 与服务器交互（非常类似于移动客户端）。\n\n## 现代 Web 架构如何工作 (HOW MODERN WEB ARCHITECTURE WORKS)\n\
    \n这种流程工作如下：\n\n1. 用户的浏览器请求一个静态 HTML 页面。\n2. HTML 页面包含用于构建页面基础结构的 JavaScript。\n\
    3. JavaScript 随后执行 Ajax 通过 API 加载内容（通常是 JSON）。\n4. JavaScript 随后获取这些内容并修改 DOM\
    \ 来表示这些内容。\n\n这种方法的主要区别在于角括号（HTML）是在客户端生成的，而不是在服务器上。这与过去构建应用程序的方式有巨大的区别。\n\n##\
    \ 现代 Web 架构的优势 (THE BENEFITS OF MODERN WEB ARCHITECTURE)\n\n这种现代工作流具有以下优势：\n\n\
    - 更简单的后端：由于应用程序只需要单个 API 来传输/接收内容，现在用于移动应用的同一个 API 也可以用于浏览器。事实证明，构建处理 JSON 的软件比构建处理\
    \ HTML 的软件容易得多。\n- 性能：服务器执行的大部分工作是构建 HTML 页面。将这些工作移动到客户端可以节省大量的精力。前端代码可以由 CDN（内容分发网络）轻松提供，CDN\
    \ 可以快速向世界任何地方交付引导内容。由于客户端不再需要下载和渲染完整的页面，用户端的性能也可以大得多。\n- 标准工具：静态应用程序使用大量的 JavaScript、HTML\
    \ 和 CSS 构建。这些是 Web 的构建块，并且所有 Web 开发者都能理解。\n- 快速原型设计：由于构建应用程序的唯一要求是前端 JavaScript，因此很容易模拟\
    \ Web 应用程序。所有的服务器数据都可以被模拟（或简单地不保存），你可以专注于用户体验。稍后你可以 API 填充功能。\n- 增强的模块化：由于你不再拥有一个庞大的代码库（在\
    \ Rails 世界中被称为单体），你可以将应用程序拆分为逻辑部分，每个部分都非常适合执行其特定任务。\n\n在书中，你将探索以这种胖客户端方式开发应用程序的方法。\n\
    你将使用四种工具：MongoDB、Express、Angular.js 和 Node.js（俗称为 MEAN 栈）。使用这些工具并用 JavaScript\
    \ 将它们连接起来，你可以快速构建可扩展的快速应用程序。\n\n## 第 2 章\n## 为什么 JavaScript 是现代应用的的良好选择 (Why JavaScript\
    \ Is a Good Choice for Modern Apps)\n\n在本章中，我将讨论 MEAN 栈的四个组成部分（MongoDB、Express.js、Angular.js\
    \ 和 Node.js），并让你准备好在下一章开始项目。\n\n## 什么是 ANGULAR.JS? (WHAT IS ANGULAR.JS?)\n\nAngular.js\
    \ 是一个在浏览器内部构建应用程序的框架。它针对高度交互的应用程序。开箱即用，它包含了许多构建应用程序所需的组件。它还为高度模块化、可测试的应用程序提供了结构。\n\
    \n你通过在 HTML 中添加 `<script>` 标签并编写在该内部的自定义代码将其集成到应用程序中。\n\n它包含的一些工具包括双向数据绑定、路由、DOM\
    \ 操作、动画、依赖注入、测试实用程序、Ajax 助手等。\n\n它有一定的学习曲线，但它允许你快速构建并易于维护的应用程序。\n\n## Angular\
    \ 与 jQuery 有何不同 (HOW IS ANGULAR DIFFERENT THAN QUERY?)\n\n大多数 Web 开发者对 jQuery\
    \ 框架有坚固的理解，因此他们经常好奇 Angular 能做哪些 jQuery 做不到的事情。\n\njQuery 和 Angular 之间的根本区别是命令式和声明式的。在\
    \ jQuery 中，你使用 JavaScript 来操作 DOM，但在 Angular 中你声明 DOM 应该长什么样。\n\nQuery 是为了渐进式增强设计的。Angular允许你根据模型声明页面结构。\n\
