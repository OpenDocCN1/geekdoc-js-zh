- md: "\nYou should see a response like the following (make sure you've started your\
    \ Mongo server):\n\n```\n> POST /api/posts HTTP/1.1\n> User-Agent: curl/7.30.0\n\
    > Host: localhost:3000\n> Accept: */\n> Content-Type: application/json\n> Content-Length:\
    \ 46\n>\n* upload completely sent off: 46 out of 46 bytes\n> HTTP/1.1 201 Created\n\
    < X-Powered-By: Express\n< Content-Type: application/json; charset=utf-8\n< Content-Length:\
    \ 120\n< Date: Sun, 22 Jun 2014 00:41:55 GMT\n< Connection: keep-alive\n>\n* Connection\
    \ #0 to host localhost left intact\n```\n\n```\n{\"_v\":\"0\",\"username\":\"\
    dickeyxxx\",\"body\":\"node rules!\",\"_id\":\"53a62653fa305e5db318c1cb\",\"date\"\
    :\"2014-06-22T00:41:55.040Z\"}\n```\n\nSince you see an _id field coming back,\
    \ I'm pretty sure it's working. To be sure, though, let's check the database directly\
    \ with the mongo command:\n\n```\n$ mongo social\nMongoDB shell version: 2.6.1\n\
    connecting to social\n```\n\n```\n> db.posts.find(\n{\n  \"id\": ObjectId(\"53a62653fa305e5db318c1cb\"\
    ), \"username\" : \"dickeyxxx\",\n  \"body\" : \"node rules!\", \"date\" : ISODate(\"\
    2014-06-22T00:41:55.040Z\"),\n  \"_v\" : 0\n})\n```\n\nLooks like it made into\
    \ the database!\n\nNow, let's update the GET request to read from the database:\n\
    \n```javascript\napp.get('/api/posts', function(req, res, next) {\n  Post.find(function(err,\
    \ posts) {\n    if (err) { return json(err)\n    res.json(posts)\n  })\n})\n```\n\
    \nThis one is similar to the last one. Call find on the Post model; then when\
    \ the request returns, render the posts as JSON (so long as no error was returned).\
    \ Go back to your web browser and reload http://localhost:3000/api/posts to see\
    \ it in action.\n\nYou have a full API you can read and write from in order to\
    \ support your Angular app.\nHere is the final server.js:\n\n```javascript\nvar\
    \ express = require('express')\nvar bodyParser = require('body-parser')\nvar Post\
    \ = require('./models/post')\n\nvar app = express()\n.use(bodyParser.json())\n\
    \napp.get('/api/posts', function (req, res, next) {\n  Post.find(function(err,\
    \ posts) {\n    if (err) { return next(err) }\n    res.json(posts)\n  })\n})\n\
    \napp.post('/api/posts', function (req, res, next) {\n  var post = new Post({\n\
    \    username: req.body.username,\n    body: req.body.body\n  })\n  post.save(function\
    \ (err, post) {\n    if (err) { return next(err) }\n    res.json(201, post)\n\
    \  })\n})\n\napp.listen(3000, function () {\n  console.log('Server listening on',\
    \ 3000)\n})\n```\n\n# NEXT STEPS\n\nYou've now built the full API for you to use\
    \ with the Angular app. In the next chapter, you'll integrate the API into Angular\
    \ and serve the Angular app via Node. You'll also take some time to clean up your\
    \ code a little by breaking it into modules.\n\n# CHAPTER 5\nIntegrating Node\
    \ with Angular\n\nNow that you've built your API, it's time to use it with Angular.\
    \ Also, since Node is a web server, it'd be nice to get it to serve your HTML\
    \ rather than load it as a flat file like you've been doing thus far.\n\n# $HTTP\n\
    \nTo perform HTTP calls in Angular, you'll use its built-in HTTP client: $http.\
    \ If you haven't noticed yet, official Angular components start with $. You should\
    \ not prefix components you create with a.\n$http is a pretty standard HTTP client\
    \ with some of the usual suspects: $http.get(), $http.post(), and so on. It is\
    \ promise based.\n\n# WHAT ARE PROMISES?\n\nPromises are a way of writing asynchronous\
    \ code in JavaScript as an alternative to the traditional callback method that\
    \ Node uses.\nIf you look at a popular Node HTTP client, request, you can see\
    \ the difference.\nHere is Angular's $http:\n\n```javascript\n$http.get('http://localhost:3000/api/posts')\n\
    .success(function (posts) {\n  // do stuff with posts\n})\n.error(function (err)\
    \ {\n  // handle the error case (if you care)\n})\n```\n\nAnd here's Node's request:\n\
    \n```javascript\nrequest.get('http://localhost:3000/api/posts', function (err,\
    \ response, data) {\nif (err) { /* handle error */}\n// do something with posts\n\
    })\n```\n\nThe main difference is that with promises, you get back an object that\
    \ you can call methods on to give different functions based on success/failure.\
    \ In the callback method, there is just one function that has to handle every\
    \ case.\nIt's not important to understand promises in detail just yet, but do\
    \ understand that Angular code is heavily promise based, and Node (conventionally)\
    \ is not.\nThere is some controversy over which method is better. Promises have\
    \ definitely become more popular recently and will be included in the next version\
    \ of JavaScript (ES6). Some people use promises exclusively in Node, and you can\
    \ do that in your own code if you want. In this book, I will use callbacks with\
    \ Node code and promises with Angular code to fit the current conventions.\n\n\
    # READING POSTS FROM THE API WITH HTTP\n\nIf you go back to the Angular app (posts.html)\
    \ and look at your controller, this is what you'll see:\n\n```javascript\napp.controller('PostsCtrl',\
    \ function ($scope) {\n  $scope.addPost = function () {\n    if ($scope.postBody)\
    \ {\n      $scope.posts.push({\n        username: 'dickeyxxx',\n        body:\
    \ $scope.postBody\n      });\n      $scope.postBody = null;\n    }\n  }\n  $scope.posts\
    \ = [\n    {\n      username: 'dickeyxxx',\n      body: 'node rules!'\n    }\n\
    \  ];\n});\n```\n\n# SERVING POSTS.HTML THROUGH NODE\n\nTo get Node hosting your\
    \ HTML, first copy your posts.html file into the Node app, under a new folder\
    \ called layouts. Why /layouts instead of /views or /templates? It's because later\
    \ you'll have partials.\n\nNow open your server.js and add the following endpoint:\n\
    \n```javascript\napp.get('/', function (req, res) {\n  res.send('layouts/posts.html')\n\
    })\n```\n\nNow after starting your Node app, open http://localhost:3000 in your\
    \ browser.\n\n# SAVING POSTS TO THE API WITH $HTTP\n\nNow that you can cleanly\
    \ read the data from the API, you need to POST to the API when you add a new post.\
    \ This will use $http as well. Edit the addPost() method in the Angular layout\
    \ file to look like the following:\n\n```javascript\n$scope.addPost = function\
    \ () {\n  if ($scope.body) {\n    $http.post('/api/posts/', {\n      username:\
    \ 'dickeyxxx',\n      body: $scope.body\n    }).success(function (post) {\n  \
    \    $scope.posts.unshift(post)\n      $scope.body = null;\n    });\n  }\n}\n\
    ```\n"
