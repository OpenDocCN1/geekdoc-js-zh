    \n114 第 8 章 添加路由和客户端身份验证\n\n现在你可以在这里 $scope 上填充 `currentUser` 对象。然而，这并没有进入 LoginCtrl\
    \ 并设置 `$scope.currentUser = user` 那么简单。这是因为 LoginCtrl 的作用范围没有延伸到这个控制器。你可以使用 `$rootScope`（全局作用域）代替，但有一种更好的方法可以实现这一点，而不会像那样导致全局内存泄漏。\n\
    \n更好的解决方案是让 LoginCtrl 冒出一个登录事件，并让父级 ApplicationCtrl 监听该事件。然后 ApplicationCtrl 将设置\
    \ `$scope.currentUser`，使其所有子组件都可以使用。\n\n更新 ng/login.js 中的 LoginCtrl，使用 `$emit`\
    \ 传递事件：\n\n```javascript\nangular.module('app')\n.controller('LoginCtrl', function\
    \ ($scope, UserSvc) {\n  $scope.login = function (username, password) {\n    UserSvc.login(username,\
    \ password)\n    .then(function (response) {\n      $scope.emit('login', response.data)\n\
    \    })\n  }\n})\n```\n\n现在，在 layouts/app.html 的 <body> 标签上为 ApplicationCtrl 添加\
    \ `ng-controller` 指令：\n\n```html\n<body ng-app='app' ng-controller='ApplicationCtrl'>\n\
    ```\n\n创建 ng/application.ctrl.js：\n\n```javascript\nangular.module('app')\n.controller('ApplicationCtrl',\
    \ function ($scope) {\n  $scope.on('login', function (_, user) {\n    $scope.currentUser\
    \ = user\n  })\n})\n```\n\n现在你终于可以登录你的应用了！为了完成身份验证，你还需要做的另一是将用户与帖子关联。\n\n# 社交帖子的身份验证\n\
    \n现在，客户端实际上发送的是帖子的用户名。应该发生的是服务器根据 JWT 找出用户是谁。这可以防止用户修改自己的用户名。\n\n你需要复用 controllers/api/users.js\
    \ 中的代码从 JWT 中获取用户信息。现在是时候在 Express 应用中引入一些自定义中间件了。在项目根目录下创建 `auth.js` 文件：\n\n\
    ```javascript\nvar jwt = require('jwt-simple')\nvar config = require('./config')\n\
    ```\n\n```javascript\nmodule.exports = function (req, res, next) {\n  if (req.headers['x-auth'])\
    \ {\n    req.auth = jwt.decode(req.headers['x-auth'], config.secret)\n  }\n  next()\n\
    }\n```\n\n此中间件会将 auth 对象附加到请求中，以便你查找当前用户信息。\n现在在 server.js 中使用所有控制器之前使用此中间件：\n\
    `app.use(require('./auth'))`\n\n你现在可以在 controllers/api/posts.js 中使用这段代码查找当前用户的用户名：\n\
    \n```javascript\nrouter.post('/', function (req, res, next) {\n  var post = new\
    \ Post({body: req.body.body})\n  post.username = req.auth.username\n  post.save(function\
    \ (err, post) {\n    if (err) { return next(err) }\n    res.json(201, post)\n\
    \  })\n})\n```\n\n现在你在 Angular 应用中需要做的更改很简单；你只需要在创建帖子的请求中发送 `X-Auth` 头部。你可以直接将其添加到\
    \ posts 控制器中，但更好的方法是全局地为所有请求添加该头部，这样你就不需要一直记住要这样做了。更新 ng/user.svc.js 为以下代码：\n\n\
    ```javascript\nangular.module('app')\n  .service('UserSvc', function ($http) {\n\
    \  var svc = this;\n  svc.getUser = function () {\n    return $http.get('/api/users')\n\
    \  }\n  svc.login = function (username, password) {\n    return $http.post('/api/sessions',\
    \ {\n      username: username, password: password\n    }).then(function (val)\
    \ {\n      svc.token = val.data\n      $http.defaults.headers['X-Auth'] = val.data\n\
    \      return svc.getUser()\n    })\n  };\n});\n```\n\n现在所有请求（而不只是服务中的请求）都将附加了头部。\n\
    这是身份验证的一个基础演示。它不像传统 Web 应用程序那样简单，但非常灵活。\n尽管如此，你还可以做更多事情将其变成一个完善的系统。我将在后续章节中简要描述一些技巧。\n\
    \nAngular 经常发生的是尝试加载可能不存在的文件。这会导致循环。这仅在开发模式下未创建文件时是一个问题，但它会让调试变得更加困难。\n\n# HTML5\
    \ PUSHSTATE\n\n在 Angular 中启用 pushstate 很容易；你只需要依赖注入 `$locationProvider` 并在你的 ng/routes.js\
    \ 文件中添加此行：\n\n```javascript\n$locationProvider.html5Mode(true)\n```\n\n这就是客户端需要执行的所有操作了；你现在可以移除\
    \ URL 中的 `#` 了。\n尽管如此，如果你刚开始，我不建议这样做。\n\n# 注册\n\n在书中，我没有介绍注册。不过这很容易；你只需要在用户服务中添加\
    \ `createUser` 函数，在创建用户后调用登录，然后配上相应的表单/控制器。这是一个你应该自己尝试的很好的练习。它展示了 API 的复用性。\n\n\
    # 退出\n\n注销功能非常简单；你只需要在 ApplicationCtrl 上调用一个函数从作用域中删除 `currentUser`。你可能还想在 UserSvc\
    \ 上调用某些内容以从请求中移除 JWT。\n\n# 记住我\n\n在页面上记住最后一个用户的最佳方法是使用 HTML5 pushstate。你只需通过替换\
    \ UserSvc 内部对 `svc.token` 的引用并添加 `window.localStorage.token` 即可实现。\n\n你还需要在应用启动时检查是否存在。是否存在，你会希望\
    \ ApplicationCtrl 通过 UserSvc.getUser() 获取当前登录的用户。\n\n# 用户外键\n\n你可能注意到你正在 MongoDB\
    \ 模型中使用字符串形式的用户名。一个好主意是在 Post 对象上相反存储用户的 `ObjectId`。这样，用户名就可以更改，而用户会保留他们所有的帖子。\n\
    \n如果你实现了这一点，请研究 Mongoose 的 `population` 功能，以便在访问 GET /api/posts 时能够拉取用户名。\n\n"
