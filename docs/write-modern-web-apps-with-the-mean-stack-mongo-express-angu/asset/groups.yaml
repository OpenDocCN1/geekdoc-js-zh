    \ (err, post) {\n      if (err) { return next(err) }\n      res.json(201, post)\n\
    \    })\n  })\n```\n\nThen you could call it from server.js like so:\n\n```javascript\n\
    require('../controllers/api/posts')(app)\n```\n\nThis is a fine solution that\
    \ has a side benefit of allowing you to easily mock out the app object if you\
    \ wanted to write a test. Still, Express offers a cleaner solution through its\
    \ Router object. You can build a Router object that acts like an app object and\
    \ simply use it like middleware to attach it to your app. In /controllers/api/posts.js,\
    \ it would look like this:\n\n```javascript\nvar Post = require('../models/post')\n\
    var router = require('express').Router()\n\nrouter.get('/api/posts', function\
