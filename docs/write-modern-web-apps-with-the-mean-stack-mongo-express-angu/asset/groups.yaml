  - "[PAGE 66]\n\n# SERVING POSTS.HTML THROUGH NODE\n\nTo get Node hosting your HTML\
    \ page, first copy your posts.html file into the Node app, under a new folder\
    \ called /layouts. Why /layouts instead of something like /views or /templates?\
    \ It's because later you'll have Angular partials that will go into a templates\
    \ folder, and this will allow you to easily differentiate the full HTML pages\
    \ from the partials.\n\nNow open your server.js file and add the following endpoint:\n\
    \n```\napp.get('/', (req, res) {\n  res.send('layouts/posts.html')\n})\n```\n\n\
    Now after starting your Node app, open http://localhost:3000 in your browser,\
    \ and your app should be up!\n\nIf you are tired of restarting your node server\
    \ all the time, I suggest using the nodemon package. It will automatically restart\
    \ your node app if any files change.\n\n```\n$ npm install --global nodemon\n\
    ```\n\n```\n$ nodemon server.js\n```"
  - "[PAGE 67]\n\n# SAVING POSTS TO THE API WITH $HTTP\n\nNow that you can cleanly\
    \ read the data from the API, you need to POST to the API when you add a new post.\
    \ This will use $http as well. Edit the addPost() method in the Angular layout\
    \ file to look like the following:\n\n```\n$scope.addPost = function () {\n  if\
    \ ($scope.body) {\n    $http.post('/api/posts/', {\n      username: 'dickeyxxx',\n\
    \      body: $scope.body\n    }).success(function (post) {\n      $scope.posts.unshift(post)\n\
    \      $scope.body = null\n    });\n  }\n}\n```\n\nWhat you're doing with this\
    \ is sending the post to the server, and if it responds with a success status\
    \ code, you unshift the new post onto $scope.posts.\n\nYou might note that it's\
    \ totally possible to add it to the list before it finishes sending to the server.\
    \ This would offer the illusion to the user that it posted much faster. This is\
    \ one of the great things about having a thick client.\n\nIf you were to do this,\
    \ it would be prudent to add an error function to the $http promise to remove\
    \ it if it was unsuccessful.\n\nIf you add a couple posts and then refresh the\
    \ page, you might notice a bug! Using unshift, new posts are correctly added to\
    \ the top, but Node is returning the results in chronological order, not reverse\
    \ chronological order as you'd expect."
- md: "\n## FIXING THE POST ORDERING\n\nFixing the posts to be in reverse chronological\
    \ order could be done either in the Node server or in Angular (better yet, both).\
    \ To do it in Angular, you simply add an orderBy predicate to the ng-repeat directive\
    \ in /layouts/posts.html:\n\n```html\n<li ng-repeat=\"post in posts | orderBy:'-date'\
    \ class=\"list-group-item\">\n```\n\nAngular will now correctly order the posts\
    \ by the date you added to your Mongoose schema. Note aside from adding it to\
    \ the model schema, you didn't have to write any code to support dates. This demonstrates\
    \ the power of using a MEAN stack. You can just add something to MongoDB, and\
    \ it will cascade all the way to the client.\n\nAlternatively, you can also sort\
    \ this out in Node. This is a good idea to do it if you wanted to add pagination\
    \ to your API. You would want to make sure the first page of the response contained\
    \ the newest posts. You won't be building the pagination just yet, but here is\
    \ how you can edit server.js to serve the posts in reverse chronological order:\n\
    \n```javascript\napp.get('/api/posts', function (req, res, next) {\n  Post.sort('-date')\n\
    \  .exec(function(err, posts) {\n    if (err) { return next(err) }\n    res.json(posts)\n\
    \  })\n})\n```\n\nMongoose allows you to keep chaining the query with various\
    \ methods like this. This could be useful for filtering out posts, for example.\n\
    \n## CLEANING SERVER.JS\n\nNow that your app is a little more fleshed out, the\
    \ server.js file has started to reach into too many things (setting up the server\
    \ and adding the middleware, all of the API endpoints, and the bit that delivers\
    \ the layout file). When building JavaScript applications, there is a lot of flexibility\
    \ you can get in how to structure the codebase. It's best to start simple with\
    \ few files so you can quickly iterate on them. When files start to get large,\
    \ comes a time when you'll want to break them out.\n\nHere is the current server.js\
    \ file:\n\n```javascript\nvar express = require('express')\nvar bodyParser = require('body-parser')\n\
    var Post = require('./models/post')\n```\n\n```javascript\nvar app = express()\n\
    app.use(bodyParser.json())\n```\n\n```javascript\napp.get('/api/posts', function(req,\
    \ res, next) {\nPost.find(\n  .sort('-date')\n  .exec(function(err, posts) {\n\
    \    if (err) { return next(err) }\n    res.json(posts)\n  })\n})\n```\n\n```javascript\n\
    app.post('/api/posts', function(req, res, next) {\nvar post = new Post({\nusername:\
    \ req.body.username,\nbody: req.body.body\n})\npost.save(function(err, post) {\n\
    \  if (err) { return next(err) }\n  res.json(201, post)\n})\n})\n```\n\n```javascript\n\
    app.get('/', function (req, res) {\n  res.sendFile('/layouts/posts.html')\n})\n\
    \napp.listen(3000, function () {\n  console.log('Server listening on', 3000)\n\
    })\n```\n\nI'd like to do now is to break out the API and sendfile endpoints into\
    \ controllers.\n\n## BREAKING OUT /API/POSTS\n\nFirst create a file /controllers/api/posts.js\
    \ with the same code with the GET and POST /api/posts endpoints.\n\n```javascript\n\
    var Post = require('../../models/post')\n\napp.get('/api/posts', function (req,\
    \ res, next) {\n  Post.find()\n  .sort('-date')\n  .exec(function(err, posts)\
    \ {\n    if (err) { return next(err) }\n    res.json(posts)\n  })\n})\n```\n\n\
    ```javascript\napp.post('/api/posts', function (req, res, next) {\n  var post\
    \ = new Post({\n    username: req.body.username,\n    body: req.body.body\n  })\n\
    \  post.save(function (err, post) {\n    if (err) { return next(err) }\n    res.json(201,\
    \ post)\n  })\n})\n```\n\nThis won't work because you don't have reference to\
    \ the app object. One solution would be to wrap the whole bit of code into a function\
    \ that expects an app argument, like so:\n\n```javascript\nvar Post = require('../models/post')\n\
    \nmodule.exports = function (app) {\n  app.get('/api/posts', function (req, res,\
    \ next) {\n    Post.find()\n    .sort('-date')\n    .exec(function(err, posts)\
