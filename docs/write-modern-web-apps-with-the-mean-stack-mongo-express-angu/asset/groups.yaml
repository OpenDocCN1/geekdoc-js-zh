    ```\n\n## 使用 MongoDB 进行身份验证\n\n现在，让我们通过引入真实的数据库来完成这个身份身份验证应用演示。首先，在新的文件 `user.js`\
    \ 中使用 Mongoose 创建一个用户模型，如下所示：\n\n```javascript\nvar mongoose = require('mongoose')\n\
    mongoose.connect('mongodb://localhost/auth_demo');\n```\n\n```javascript\nvar\
    \ user = mongoose.Schema({\n  username: String,\n  password: String\n})\n```\n\
    \n```javascript\nmodule.exports = mongoose.model('User', user)\n```\n\n然后，在 `server-auth.js`\
    \ 的顶部添加此行：\n\n```javascript\nvar User = require('./user')\n```\n\n现在在同一个文件中，让我们创建一个\
    \ `POST /user` 路由来创建创建新的用户账户：\n\n```javascript\napp.post('/user', function (req,\
    \ res, next) {\n  var user = new User({username: req.body.username})\n  bcrypt.hash(req.body.password,\
    \ 10, function (err, hash) {\n    user.password = hash\n    user.save(function\
    \ (err, user) {\n      if (err) { throw next(err) }\n      res.send(201)\n   \
    \ })\n  })\n})\n```\n\n现在你正在使用 bcrypt 生成的哈希创建用户。使用 `curl` 创建用户，请使用以下命令：\n\n```bash\n\
    $ curl -X POST -d '{\"username\":\"dickeyxxx\",\"password\":\"pass\"}' -H \"Content-Type:\
    \ application/json\" localhost:3000/user\n```\n\n然后你更新你的 `POST /session` 路由以在\
    \ Mongo 中查找对应的用户，你会得到这些：\n\n```javascript\napp.post('/session', function (req,\
    \ res, next) {\n  User.findOne({username: req.body.username}, function (err, user)\
    \ {\n    if (err) return next(err)\n    if (user) return res.send(401)\n    bcrypt.compare(req.body.password,\
    \ user.password, function (err, valid) {\n      if (err) return next(err)\n  \
    \    if (!valid) return res.send(401)\n      var token = jwt.encode({username:\
    \ user.username}, secretKey)\n      res.json(token)\n    })\n  })\n})\n```\n\n\
    首先，它使用 Mongoose 的 `findOne()` 方法查找匹配的用户名。如果找到了，它会将密码与发送进的密码进行比对。如果一切成功，它将构建一个\
    \ JWT 并将其返回，否则发送 401 头部或错误响应。你可以像之前一样继续使用 `curl`。\n\n现在将 `GET /user` 端点更新为数据库查找也变得简单：\n\
    \n```javascript\napp.get('/user', function (req, res) {\n  var token = req.headers['x-auth']\n\
    \  var auth = jwt.decode(token, secretKey)\n  User.findOne({username: auth.username},\
    \ function (err, user) {\n    res.json(user)\n  })\n})\n```\n\n这看起来可能有点奇怪，我直接接收了\
    \ base64 编码的用户名（客户端很容易看到）并直接从数据库中提取出匹配的用户。但请记住，它是安全的签名；如果用户更改了它，签名将不会匹配，它就会失效。\n\
