    \ {\n      $scope: $scope\n    })\n  }))\n});\n```\n\n```\nit('loads posts from\
    \ the service', function () {\n  expect($scope.posts).to.have.length(2)\n});\n\
    ```\n\nThis test isn't functional yet, but it's the basic form a controller test\
    \ will take. You again declare that we're in the app module, and unlike the service\
    \ test, you store a $scope object for reference later.\n\nThen you inject the\
    \ $rootScope and $controller utilities, calling new on $rootScope to build a new\
    \ $scope object. Then you instantiate a PostCtrl and pass in your own dependencies\
    \ for the controller to grab. Any other dependencies (like PostsSvc) just get\
    \ looked up automatically.\n\nNote that you don't use the underscores around the\
    \ function argument names here. This is because you don't want to use a variable\
    \ named $rootScope or $controller.\n\n> NOTE: My apologies if I keep repeating\
    \ the reason for the underscores, it's something I've seen people get stuck on\
    \ many times.\n\nFinally you just check to see whether $scope.posts has two items.\
    \ It doesn't, it's actually null.\nTo make this test functional, you need to swap\
    \ the PostsSvc for a mock version that will just return two posts every time.\
    \ To do that, you just need to pass in a new object in the $controller() call.\
    \ This object needs to have a method fetch that will return a promise to be fulfilled\
    \ in the controller.\n\nA pattern I've had good success with creating an empty\
    \ object and then adding the stubbed methods in a beforeEach filter. Here is an\
    \ example:\n\n```\ndescribe('posts.ctrl', function () {\n  beforeEach(module('app'));\n\
    \  var $scope\n\n  var mockPostsSvc = {};\n  beforeEach(inject(function ($q) {\n\
    \    mockPostsSvc.fetch = function () {\n      var deferred = $q.defer(\n    \
    \    {username: 'dickeyxxx', body: 'first post'},\n        {username: 'dickeyxxx',\
    \ body: 'second post'}\n      );\n      return deferred.promise;\n    }\n  }));\n\
    \n  beforeEach(inject(function ($rootScope, $controller)) {\n    $scope = $rootScope.new();\n\
    \    $controller('PostsCtrl', {\n      $scope: $scope,\n      PostsSvc: mockPostsSvc\n\
    \    });\n  }));\n\n  it('loads posts from the service', function () {\n    expect($scope.posts).to.have.length(2);\n\
    \  }));\n```\n\nAgain, creating a new object mockPostsSvc. in a beforeEach filter,\
    \ I add the method fetch that will return a resolved promise with two posts in\
    \ it. This doesn't work yet because you're expecting an HTTP promise with a success\
    \ function instead of a more vanilla then function. In order to be compatible,\
    \ change the controller (the real one outside the test suite: posts.ctrl.js) to\
    \ instead register the then callbacks from the service.\n"
