    本章并非特定 Digital Ocean，在任何其他服务器上工作原理都类似。\n\n# 单服务器 vs. 多服务器架构\n\n在将软件部署到服务器时，你需要决定哪些软件运行在什么机器上。此外，你还需要决定哪些服务器应该是公开访问的，哪些不需要。\n\
