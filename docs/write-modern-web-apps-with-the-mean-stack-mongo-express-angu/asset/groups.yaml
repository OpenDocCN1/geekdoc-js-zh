    In Angular, this is how you split the logic from the presentation (in jQuery,
    because you have to use DOM selectors, they are tied together). The controller
    simply manages one array by declaring a function that can append a new item to
    the array. The HTML defines how that array is represented in the DOM and what
    event triggers the add item function.


    Note that nowhere in the code do you add an element to the list; this is the heart
    of the declarative style of Angular. You may notice the Angular example is more
    code, but that is the case only for simple examples. As soon as the logic becomes
    complex, Angular tends to be much more concise.


    It turns out that in developing an application with the MEAN stack, much of your
    time is spent in Angular. There are a few reasons for this:


    +   - You actually can depend on the browser to perform tasks. It''s generally
    easier to perform logic directly rather than communicating across web requests.


    +   - JSON is spoken throughout. MongoDB, Node, and Angular are all written in,
    or "speak," JavaScript. JSON is essentially JavaScript and is great at speaking
    it as well. Also, in the SQL world you would have to perform heavy transformations
    to change the web request into SQL queries. Here, in the NoSQL world, the transformations
    are much simpler. Interactivity is easier. You''ll simply be able to leverage
    the browser more than you could in a server-generated application. You''ll be
    able to spend more time fine-tuning interactive functionality as opposed to "just
    making it work."'
  - '[PAGE 24]


    # WHAT IS NODE.JS?


    Node.js is a JavaScript runtime designed to run outside of the browser. It is
    a general-purpose utility that can be used for many things, including asset compilation,
    scripting, monitoring, and most notably web servers.


    Surprisingly, JavaScript has turned out to be a fantastic language for server-side
    web development. This is interesting since all of our client-side code has already
    been in JavaScript, and it wasn''t originally intended to support back-end development.
    It''s efficient for development time and for performance.


    While Node.js can be used for many things, for the purposes of this book assume
    when I Say Node.js am I referring to back-end web servers written in Node.js specifically.


    # STARTUP VS. ENTERPRISE


    In the last decade, we''ve had two general environments to choose from when it
    came to back-end development. We''ve had the enterprise environment typically
    using languages/platforms such as Java and C#. We''ve also had the startup environment
    with many languages/frameworks, including Rails, Django, and PHP.


    These differences stem from the goals of these environments. The goal of a startup
    is to validate the product as soon as possible. Shipping is better than not shipping.
    Delivering a product quickly allows a startup to dynamically alter itself to fit
    a need. Shipping takes priority over performance and maintainability.


    The open source environment works great for startups or prototyping products,
    but scaling up these products is challenging. Duck typing, uncompiled scripting
    languages, code-as-documentation, and heavy use of metaprogramming are all trademarks
    of these platforms. Twitter famously started on the Rails stack and ran into many
    performance problems (remember the fail whale?) and in response migrated its platform
    to Java/Scala. Backward compatibility is much worse in the open source world as
    well.


    The enterprise environment, on the other hand, is less interested in reaching
    market quickly but more interested in maintainability and stability (read: performance).
    Where a startup might have to get quickly to validate an idea, an enterprise needs
    to ensure its product will work and that a developer will be able to pick it up
    in several years and be able to maintain it without a problem.


    This shines through the code. Hallmarks of enterprise platforms include compiler-checked
    code, heavy use of industry-standard patterns, verbosity over cleverness, and
    heavy documentation.


    Node.js is unique because it works for both the startup and enterprise environments.'
