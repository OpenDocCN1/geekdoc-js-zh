    # JWT WEB TOKEN (JWT)


    JWT (pronounced "jot") is a standard format designed for this specific purpose
    (authenticity). It is simple and could be implemented in any programming language
    even if a library does not exist.


    Functionally, in Node, you can use the npm package jwt-simple to create these
    tokens on the server side. You can create a JWT with the encode function like
    so:


    ```

    var jwt = require(''jwt-simple'')

    var token = jwt.encode({username: ''dickeyxxxx''}, ''supersecretkey'')

    // token is now: eyJ0ZXA1JJKV1Q1JGJc39IjoiUz1NiJ9.

    eJ1c1c2YVmFtZS6ImRpRy2tZlh4Ec39.01R5He-k2RyvFZ6_JBOTAg90EeczndumWEgc

    ```


    That contains the object you pass in the first argument to encode and sign the
    second. It''s important to understand that JWT does not encrypt that object, but
    only signs it. I''m going to take the rest of this section to explain how JWT
    works under the hood. If this is over your head, that''s fine; it''s only important
    to understand that JWT signs and not encrypts, not how it works.


    All JWTs are split into three parts separated by periods ().

    In this example, eyJ0ZXA1JJKV1Q1JGJc39IjoiUz1NiJ9, is a base64 representation
    of the header. If you decode it using www.jwt.io, you get the following data:


    ```

    {"type":"JWT","alg":"HS256"}

    ```


    This says that the token is a JWT and that the algorithm HMAC256 was used to sign
    the token. There are more headers that can be sent to who signed it, when it was
    signed, when it should expire, and more.


    The second section, eyJ1c2YVmFtZS6ImRpRy2tZlh4Ec39, is the payload. This is the
    base64-encoded object you passed in with the first argument. If you run this through
    the decoder, you get the:


    ```

    {"username":"dickeyxxxx"}

    ```


    Note that you have to use that secret to get this data! This means the client,
    or anyone with a token, can read what is in it! It is important to know that you
    do not store secure data in here, but it could also be useful. The client, in
    this case, can find out the username of the current user from the token without
    having to make an HTTP call.


    Also, if you have a service-oriented architecture, this is how you can validate
    requests from any server without having to communicate with a central authentication
    server. Any server with that secret can validate and generate these tokens without
    communicating with each other.'
  - '[PAGE 101]


    The last section is the signature. It is not base64 encoded. It tells the server
    that the payload is valid. If you were to try to change the payload to match a
    different user, the signature would no longer match, and jwt-simple would immediately
    reject it. This is where the power of JWT comes into play.


    # JWT WITH EXPRESS


    To use JWT in an application, I will show how to build a small Express server
    that has two endpoints:


    +   - POST /session: Sending a username/password will return a JWT.

    - GET /user: Passing in a JWT token will return the information about the current
    user.


    Note that this is a new, separate app from the social app. In the next chapter
    you will be integrating this method of authentication into your social app.


    I''ll build this up in a series of steps to show how each part works. First, let''s
    just get the server sending and receiving JWT tokens. Install jwt-simple:


    ```

    $ npm install --save jwt-simple


    var express = require(''express'')

    var jwt = require(''jwt-simple'')

    var app = express()

    app.use(require(''body-parser'').json())


    var secretKey = ''supersecret''


    app.post(''/session'', function (req, res) {

    var username = req.body.username

    // TODO: Validate password

    var token = jwt.encode({username: username}, secretKey)

    res.json(token)

    })


    app.get(''/user'', function (req, res) {

    var token = req.headers[''x-auth'']

    var user = jwt.decode(token, secretKey)

    // TODO: pull user info from database

    res.json(user)

    })


    app.listen(3000)

    ```'
