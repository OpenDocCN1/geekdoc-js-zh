    \ 编写的，使用起来非常简单。由于这些原因，你将在本项目中使用 Stylus。不过，如果你想用替代方案，配置也是类似的。\n\n在书中你不会处理太多的 CSS，为了快速运行一个示例，让我们直接把\
    \ `h1` 改为绿色。\n\nStylus 最吸引我的部分是语法的灵活性。你可以自由地用多种方式编写相同的 CSS。这里是编写相同 Stylus 的四种方式示例。\n\
    \n普通语法：\n\n```\nh1 {\n  color: green;\n}\n```\n\n分号是可选的：\n\n```\nh1 {\n  color:\
    \ green\n}\n```\n\n大括号也是可选的：\n\n```\nh1\n  color: green\n```\n\n甚至冒号也是可选的：\n\n\
    ```\nh1\n  color  green\n```\n\n创建一个 `css/app.styl` 文件并使用其中一种变体。\n\n接下来，安装 `gulp-stylus`：\n\
    \n```bash\n$ npm install --save gulp-stylus\n```\n\n现在你可以给 `gulpfile.js` 添加一个新任务，但由于\
    \ Gulp 文件往往会变得很大，现在是将 Gulp 配置拆分到独立文件的好时机。创建一个 `gulp/css.js` 文件，内容如下：\n\n```javascript\n\
    var gulp = require('gulp')\nvar stylus = require('gulp-stylus')\ngulp.task('css',\
    \ function () {\n  gulp.src('css/**/*.css')\n  .pipe(stylus())\n  .pipe(gulp.dest('assets'))\n\
    })\n```\n\n然后我们在 `gulpfile.js` 文件中放入一些代码来读取 `gulp` 文件夹下的所有文件：\n\n```javascript\n\
    var fs = require('fs')\nfs.readdirSync(__dirname + '/gulp').forEach(function (task)\
    \ {\n  require('./gulp/' + task)\n})\n```\n\n如果这段代码让你困惑，你可以直接为每个 Gulp 任务添加单独 `require()`。我这样做是为了每当你创建一个新的\
    \ Gulp 文件时，任何添加到 `/gulp` 的文件都会自动包含。我建议将 `gulpfile.js` 的构建部分拆分到 `/gulp/scripts.js`。运行这个任务：\n\
    \n```bash\n$ gulp css\n```\n\n然后在 `/layouts/posts.html` 中引入 CSS，如下：\n\n```html\n\
    <link rel=\"stylesheet\" href=\"app.css\">\n```\n\n关于 Stylus，请访问 http://boost.github.io/stylus\
    \ 了解如何使用它。我也建议一个像你处理 JavaScript 那样的 `watch:css` 任务，这样你就不需要一直运行任务了：\n\n```javascript\n\
    gulp.task('watch:css', function () {\n  gulp.watch('css/**/*.css', ['css'])\n\
    })\n```\n"
