    app\").controller(\"PostsCtrl\",[\"scope\"],[\"PostsSvc\", function\n(s,o).s.addPost(function(s.postBody&o.create({username:\"\
    dickeyxxxx\",\nbody:s.postBody}).success(function(o){s.posts.unshift(o),s.postBody=null}),\n\
    f.fetch().success(function(o){s.posts}));\nangular.module(\"app\").service(\"\
    PostsSvc\",[\"$http\"],function(t){this.fetch=\nfunction(t){return t.get(\"/api/posts\"\
    )};this.create=function(s){return t.post\n(\"/api/posts\",s)}}});\n```\n\nIf you\
    \ look in there, you will see how those dependency arrays affect each component.\n\
    Running the app again should work.\n\n# REBUILDING UPON FILE CHANGES\n\nRight\
    \ now the Angular code is concatenated and minified by using gulp js, but it would\
    \ be\nhuge pain to run every time you make a change. It's pretty easy to\n a file\
    \ watcher in Gulp that will automatically rebuild the JavaScript every time there\
    \ is\nchange.\n\nHere's a Gulp task that will rerun js every time one of the Angular\
    \ files changes:\n\n```\ngulp.task('watch:js', ['js'], function () {\ngulp.watch('ng/**.js',\
    \ ['js'])\n}\n```\n\ngulp.watch takes a file path to watch and then an array of\
    \ tasks to run whenever\nthose files are edited.\n\nIf you run gulp watch:js instead\
    \ of gulp js, it will stay up, rebuilding the\nJavaScript whenever a JavaScript\
    \ file in /ng changes, just like nodemon will restart Node when\nserver.js changes.\
    \ Note that I also added the js task as a dependency. This way, when you\nfirst\
    \ call watch:js, it will automatically build the JavaScript even before a file\
    \ changes.\n\nHaving an easy setup like this is crucial. Your development environment\
    \ needs to\nseamless with few chores to take care of as possible when building\
    \ your application."
  - "[PAGE 89]\n\n# 6.2 Logging an error without a source map\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_89_0.png)\n\
    \n```\nerror!\n  (anonymous function)\n    Invoke\n  Instantiate\n  (anonymous\
    \ function)\n    Invoke\n  (anonymous function)\n    getService\n    Invoke\n\
    \  Instantiate\n    (anonymous function)\n    (anonymous function)\n    forEach\n\
    \nangular.js:1411\nangular.js:3986\nangular.js:3917\nangular.js:3986\nangular.js:3927\n\
    angular.js:3869\nangular.js:3917\nangular.js:3927\nangular.js:6592\nangular.js:3927\n\
    ```\n\n# SOURCE MAPS\n\nAnother issue with minification is that it makes it harder\
    \ to debug the code. Now when the browser shows a console.log error or error pop\
    \ up, it can't easily tell you where the code caused a problem. Having Gulp rebuild\
    \ would save your code when it changes, this isn't necessary to build your application,\
    \ but will it save you a lot of work in the future.\n\nFirst, I'll demonstrate\
    \ the problem. Add the line console.error('error!') inside PostsSvc(ng/posts.svc.js).\
    \ If you're using Chrome, you should see output like that shown in 6.2 in the\
    \ Developer Tools Console tab.\n\nIt is saying the error happened on line 3 of\
    \ app.js, which is totally unhelpful because by including a source map of the\
    \ original JavaScript, you can provide Chrome with a guide to show you where the\
    \ error really happened. This is extremely helpful for debugging. First, you need\
    \ to build the source map.\n\nTo build the source map, you can use the gulp-sourcemaps\
    \ plug-in. Because it needs to wrap a few other plug-ins, this one bit different\
    \ from the other gulp plug-ins:\n\n+   * npm install --save gulp gulp-sourcemaps\n\
    \nThen edit your gulp task like the following:\n\n```\nvar gulp = require('gulp')\n\
    var concat = require('gulp-concat')\nvar sourcemaps = require('gulp-sourcemaps')\n\
    var uglify = require('gulp-uglify')\nvar ngAnnotate = require('gulp-ng-annotate')\n\
    ```"
- md: "\n```javascript\ngulp.task('js', function () {\n  gulp.src(['/ng/module.js',\
    \ 'ng/**.js'])\n  .pipe(sourcemaps.init())\n  .pipe(concat('app.js'))\n  .pipe(ngAnnotate())\n\
    \  .pipe(uglify())\n  .pipe(sourcemaps.write())\n  .pipe(gulp.dest('assets'))\n\
    })\n\ngulp.task('watch:js', ['js'], function () {\n  gulp.watch('ng/*.js', ['js'])\n\
    })\n```\n\nIf you now look at app.js, you'll see a huge comment in there that\
    \ actually contains the contents of all the minified files. You will also see\
    \ the console log now correctly points to posts.svc.js with a friendly stack.\
    \ Having confirmed this, you can remove the console.error from posts.svc.js.\n\
    \nYou now have a great Gulp task to build all of your JavaScript. As you've seen,\
    \ Gulp is pretty composable. For example, if you want to add something like CoffeeScript,\
    \ it would be easy to do.\n\nOn some projects, I will have a separate task to\
    \ generate JavaScript for development versus production. Typically the development\
    \ won't do any minification. If there are a lot of assets and minification takes\
    \ a long time, a setup like that might be preferable. Still, to maintain parity\
    \ between production and development, I do encourage you to build the JavaScript\
    \ same in both environments.\n\n## BUILD CSS WITH GULP\n\nPretty much all web\
    \ apps today use some kind of CSS preprocessor (Sass, Less, Stylus, and so on).\
    \ These have features such as variables (to color codes in), mixins, includes,\
    \ and so on.\n\nSass is probably the most popular CSS preprocessor right now,\
    \ but it has a couple of downsides. First, it's really slow. Large apps can take\
    \ several minutes to fully compile. It's also written in Ruby, which would require\
    \ you to install Ruby on your machines and make sure it's configured properly.\n\
    \nStylus is a newer CSS preprocessor that has some features you won't find in\
    \ Sass (powerful logic, to run Node is inside, and an optional cleaner syntax).\
    \ It's also written in Node, using it is easy. For these reasons, you'll be using\
    \ Stylus on this project. If you want to use an alternate, though, it's a similar\
    \ setup.\n\nYou won't be working with CSS much in this book, so to get a quick\
    \ example going, let's just change the `h1` to be green.\n\nMy favorite part of\
    \ Stylus is the flexibility in the syntax. You are free to write the same CSS\
    \ many different ways. Here's an example of four ways to write the same Stylus.\n\
    \nNormal syntax:\n\n```\nh1 {\n  color: green;\n}\n```\n\nSemicolons are optional:\n\
    \n```\nh1 {\n  color: green\n}\n```\n\nCurly braces are optional too:\n\n```\n\
    h1\n  color: green\n```\n\nEven the colon is optional:\n\n```\nh1\n  color  green\n\
    ```\n\nCreate a file `css/app.styl` with one of those variations.\n\nNext, install\
    \ gulp-stylus:\n\n```bash\n$ npm install --save gulp-stylus\n```\n\nNow you could\
    \ add a new task to gulpfile.js, but since Gulp files tend to get pretty big,\
    \ this would be a nice time to split the Gulp config into separate files. Create\
    \ a file `gulp/css.js` with the following content:\n\n```javascript\nvar gulp\
    \ = require('gulp')\nvar stylus = require('gulp-stylus')\ngulp.task('css', function\
    \ () {\n  gulp.src('css/**/*.css')\n  .pipe(stylus())\n  .pipe(gulp.dest('assets'))\n\
    })\n```\n\nThen let's put a bit of code into the gulpfile.js file to read in all\
    \ of the files under gulp:\n\n```javascript\nvar fs = require('fs')\nfs.readdirSync(__dirname\
    \ + '/gulp').forEach(function (task) {\n  require('./gulp/' + task)\n})\n```\n\
    \nIf this code is confusing, you could just add each Gulp task with individual\
    \ `require()`s. I just do so that I add a new `require()` every time I create\
    \ a new Gulp file. Now any files you add to `/gulp` will be automatically included.\
    \ I suggest breaking out the JavaScript building part of gulpfile.js into a file\
    \ `/gulp/scripts.js`.\nRun this task:\n\n```bash\n$ gulp css\n```\n\nThen include\
    \ the CSS in `/layouts/posts.html`, like so:\n\n```html\n<link rel=\"stylesheet\"\
    \ href=\"app.css\">\n```\n\nAnd you should have a green header! Read up on Stylus\
    \ at http://learnboost.github.io/stylus for more on how to use it.\n\nI also suggest\
    \ a task `watch:css` like you had for the JavaScript so you don't have to run\
    \ the task all the time:\n\n```javascript\ngulp.task('watch:css', function ()\
    \ {\n  gulp.watch('css/**/*.css', ['css'])\n})\n```\n\nThere is a lot more you\
    \ could do with the CSS. You could include another source map for the CSS, add\
    \ tools to help background-image tags, or run the CSS through a minifier.\n\n\
    ## GULP DEV TASK\n\nThis is great for making sure the CSS keeps getting updated,\
    \ but it's a bit of a pain since you now have three processes to keep running:\
    \ the server, gulp watch:js, and gulp watch:css. I like to create a gulp dev that\
    \ just runs everything that needs to run while working on the application.\n\n\
