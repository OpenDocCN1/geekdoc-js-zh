- md: "\n# CHAPTER 3\n\n# Introducing the Social Networking Project\n\nNow that I've\
    \ introduced the components of a MEAN application, in this chapter you will use\
    \ those components to build a practical application.\n\nThe application will look\
    \ similar to Twitter. There will be a main page showing the newest posts, and\
    \ there will be a profile page for each user showing their recent posts. As you\
    \ explore different parts of the application, I'll introduce new features such\
    \ as live updating via WebSockets.\n\nTo start, you'll build a page showing the\
    \ most recent posts. Posts will be anonymous until you add some authentication.\n\
    \n## CREATING A STATIC MOCKUP OF THE RECENT POSTS PAGE\n\nFIGURE 3.1 Recent Posts\
    \ page\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_41_0.png)\n\nThe first step\
    \ is to build a static mockup page with HTML and Bootstrap (http://getbootstrap.com)\
    \ for styling. Create a new directory for your application and create a file called\
    \ posts.html with the following HTML:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >\n</head>\n<body>\n<div class=\"container\">\n<h1>Recent Posts</h1>\n<ul class=\"\
    list-group\">\n<li class=\"list-group-item\">\n<strong>@dickeyxxx</strong>\n<span>Node\
    \ rules!</span>\n</li>\n<li class=\"list-group-item\">\n<strong>@jeffdickey</strong>\n\
    <span>Trying out angular.js...</span>\n</li>\n</ul>\n</div>\n</body>\n</html>\n\
    ```\n\nNow open this HTML document in your browser. You should see the screen\
    \ shown in Figure 3.1. I like to start building all Angular features following\
    \ this approach, first by dropping static HTML into a page and replicating it\
    \ with dynamic Angular.\n\n## ANGULARIZING THE PAGE\n\nAngular.js essentially\
    \ allows you to data bind JavaScript objects to the DOM (also known as HTML elements).\
    \ You basically wire up objects in a controller to something called $scope and\
    \ declare in your HTML how it should be displayed.\n\nInclude Angular before your\
    \ closing `</body>` tag:\n\n```html\n<script src='https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/angular.js'></script>\n\
    ```\n\nNow declare your `<body>` element as an Angular app:\n\n```html\n<body\
    \ ng-app='app'>\n```\n\nFor this to work, you need to first declare a matching\
    \ module. Do the following in a `<script>` tag after the Angular include tag:\n\
    \n```html\n<script>\nangular.module('app', []);\n</script>\n```\n\nAt this part\
    \ of the book, you will be working in a `<script>` tag inside the HTML rather\
    \ than referencing external JavaScript files. It might seem messy, but this is\
    \ just temporary until you get Node to help separate parts of Angular code.\n\n\
    Modules are a way to name the module and the second is an array of modules that\
    \ this module depends on. You'll use modules to access things such as ngAnimate\
    \ (animation tools), ngRoute (client-side router for single-page apps), or modules\
    \ of your own. I'll talk more about modules later, but for now just know that\
    \ your app must be declared as a module.\n\nTo declare a controller, use the `.controller()`\
    \ method on an instance of a module. This method takes two arguments: a name and\
    \ a function used to build an instance of the controller. All Angular components\
    \ follow this pattern.\n\nMake your `<script>` tag look like the following:\n\n\
    ```html\n<script>\nvar app = angular.module('app', []);\napp.controller('PostsCtrl',\
    \ function ($scope) {\n  $scope.posts = [\n    {\n      username: 'dickeyxxxx',\n\
    \      body: 'Node rules!'\n    },\n    {\n      username: 'jeffdickey',\n   \
    \   body: 'trying out angular.js...'\n    }\n  ];\n});\n</script>\n```\n\nHere\
    \ you're storing the app module into a variable app and then creating a controller\
    \ on it called PostsCtrl. This controller has an array that represents the posts\
    \ you see in the HTML.\n\nWhen you declare a controller, do you know what's known\
    \ in the Angular world as *dependency inject $scope*.\n\nCreating a controller\
    \ (or other Angular component) involves creating a function like you did earlier.\
    \ When you declare arguments, Angular looks up the dependencies based on what\
    \ you named them. If you rename $scope to $fobar, for example, you would see an\
    \ error (although not with the code you have right now since the controller wouldn't\
    \ load). In my opinion, this dependency injection is the most powerful of Angular.\n\
    \nWhat is $scope? It's simply an object you can access in the HTML and in the\
    \ controller. You'll see more examples of dependencies later. For now, let's just\
    \ dump $scope.posts onto the page. Add the following HTML to the page (keep your\
    \ existing static HTML mockup for reference):\n\n```html\n<div ng-controller='PostsCtrl'>\n\
    {{ posts }}\n</div>\n```\n\nYou should now see a JSON representation of the controller's\
    \ $scope.posts on the page. You can have JavaScript inside those double-curly\
    \ brackets, so if you wanted to see just the body of the first post, you would\
    \ do this:\n\n```html\n<div ng-controller='PostsCtrl'>\n{{ posts[0].body }}\n\
    </div>\n```\n\nRemember that sharing controller data to the view, use $scope.\
    \ When referencing controller data from the view, leave out $scope.\n\nNow that\
    \ you're this far, you can finish Angularizing this page, at least the static\
    \ version of it. Here's a complete example:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >\n</head>\n<body ng-app='app'>\n<div ng-controller='PostsCtrl' class='container'>\n\
    \  <h1>Recent Posts</h1>\n  <ul class='list-group'>\n    <li ng-repeat='post in\
    \ posts' class='list-group-item'>\n      <strong>{{post.username}}</strong>\n\
    \      <span>{{post.body}}</span>\n    </li>\n  </ul>\n</div>\n  <script src='https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/angular.js'></script>\n\
    \  <script>\n    var app = angular.module('app', []);\n    app.controller('PostsCtrl',\
    \ function ($scope) {\n      $scope.posts = [\n        {\n          username:\
    \ 'dickeyxxx',\n          body: 'Node rules!'\n        },\n        {\n       \
    \   username: 'jeffdickey',\n          body: 'trying out angular.js...'\n    \
    \    }\n      ];\n    });\n  </script>\n</body>\n</html>\n```\n\n## ADDING NEW\
    \ POSTS\n\nFIGURE 3.2 Angularized Recent Posts page\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_45.png)\n\
    \nYou've now linked up the code to Angular such that your controller is providing\
    \ the data and then allowing the view to display it, but now it's the same as\
    \ you started with the static HTML.\n\nWhat you need to do is have a field on\
    \ the page for users to add new posts.\n\nIf you add a new element to the $scope.posts\
    \ array, Angular will automatically update the view to show it. If you also have\
    \ an input and button on the page to add a new post, you just need to append to\
    \ that array.\n\nTo illustrate, let's add a button to the page. Before the list-group\
    \ `<ul>`, add this button:\n\n`<button ng-click='addPost()' class='btn-default'>Add\
    \ Post</button>`\n\nng-click is a directive that is typically used to call a function\
    \ on $scope. Right now clicking it will do nothing, but if you add the function,\
    \ you can add a new post to your list of posts.\n\nAdd the following line inside\
    \ your controller:\n\n```javascript\n$scope.addPost = function () {\n  $scope.posts.unshift({\n\
    \    username: 'dickeyxxx',\n    body: 'my new post!'\n  });\n}\n```\n\nunshift\
    \ is a JavaScript method on arrays that pushes a new element to the beginning\
    \ of the array. You should be able to click the Add Post button and add elements\
    \ to the list (see Figure 3.2).\n\nBecause you didn't have to write any code to\
    \ actually update the list when $scope.posts changed, you can cleanly separate\
    \ the logic that updates the data from the view logic. If you updated the posts\
    \ by Ajax call or WebSockets information, you just need to update $scope.posts,\
    \ and Angular will take care of the updating for you.\n\nNow you need to add a\
    \ couple of inputs to the page let the user put their own body in as the post.\
    \ To do this, you will use `<input>` on the page, data bind it to $scope, and\
    \ then use that under `addPost()`. The following HTML before the Add Post button:\n\
    \n```html\n<input ng-model='postBody' class='form-control' />\n```\n\nThe ng-model\
    \ directive hooks an input to a $scope property. Now if you access $scope.postBody\
    \ inside the controller, you'll get the data inside this text field. To use this\
    \ instead of your stock data, update the addPost() function like so:\n\n```javascript\n\
    $scope.addPost = function () {\n  $scope.posts.unshift({\n    username: 'dickeyxxx',\n\
    \    body: $scope.postBody\n  });\n};\n```\n\nNow whatever the user enters in\
    \ the input field will be their post body. One issue is that the field doesn't\
    \ clear after they make a post. To fix that, simply set $scope.postBody to null\
    \ inside addPost():\n\n```javascript\n$scope.postBody = null;\n```\n\nBecause\
    \ the data binding is two-way, anything you set $scope.postBody to will update\
    \ the input element, and vice versa.\n\nAnother issue is that the user can post\
    \ empty posts. To fix that, simply wrap the addPost() logic in the following conditional:\n\
    \n```javascript\nif ($scope.postBody) {\n```\n\nHere is a complete example of\
    \ the app with some Bootstrap code added for layout:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<link rel=\"stylesheet\" href=\"http://netdna.bootstrap.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >\n</head>\n<body ng-app='app'>\n<div ng-controller='PostsCtrl' class='container'>\n\
    <h1>Recent Posts</h1>\n<form role='form'>\n<div class='form-group'>\n```\n"
  mdcn: "\n\n# 第 3 章\n\n# 介绍社交网络项目\n\n既然我已经介绍了 MEAN 应用的组件，在本章中，你将使用这些组件来构建一个实用的应用程序。\n\
    \n该应用程序看起来类似于 Twitter。它有一个显示最新帖子的主页，每个用户都有一个个人页面，显示他们最近的帖子。当你探索应用程序的不同部分时，我会介绍一些新功能，例如通过\
    \ WebSockets 进行实时更新。\n\n首先，你将构建一个显示最新帖子的页面。在添加某些身份验证之前，帖子将是匿名的。\n\n## 创建最新帖子页的静态模型\n\
    \n图 3.1 最新帖子页\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_41_0.png)\n\n第一步是使用\
    \ HTML 和 Bootstrap (http://getbootstrap.com)（用于样式）构建一个静态模型页面。为你的应用程序创建一个新目录，并创建一个名为\
    \ `posts.html` 的文件，内容如下 HTML：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link\
    \ rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >\n</head>\n<body>\n<div class=\"container\">\n<h1>Recent Posts</h1>\n<ul class=\"\
    list-group\">\n<li class=\"list-group-item\">\n<strong>@dickeyxxx</strong>\n<span>Node\
    \ rules!</span>\n</li>\n<li class=\"list-group-item\">\n<strong>@jeffdickey</strong>\n\
    <span>Trying out angular.js...</span>\n</li>\n</ul>\n</div>\n</body>\n</html>\n\
    ```\n\n现在，在浏览器中打开此 HTML 文档。你应该能看到图 3.1 所示的屏幕。我喜欢按照这种方法开始构建所有的 Angular 功能：首先将静态\
    \ HTML 丢到页面中，然后用动态的 Angular 来复制它。\n\n## 将页面 Angular 化\n\nAngular.js 本质上允许你将 JavaScript\
    \ 对象数据绑定到 DOM（也称为 HTML 元素）。你基本上是把控制器（controller）中的对象连接到称为 `$scope` 的东西上，并在你的 HTML\
    \ 中声明它们应该如何显示。\n\n在你的闭合标签 `</body>` 标签之前包含 Angular：\n\n```html\n<script src='https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/angular.js'></script>\n\
    ```\n\n现在将你的 `<body>` 元素声明为 Angular 应用：\n\n```html\n<body ng-app='app'>\n```\n\
    \n为了让其生效，你首先需要声明一个匹配的模块（module）。在 Angular 标签之后的 `<script>` 标签中执行以下操作：\n\n```html\n\
    <script>\nangular.module('app', []);\n</script>\n```\n\n在书的这里，你将在 HTML 内部的 `<script>`\
    \ 标签中工作，而不是引用外部 JavaScript 文件。这看起来可能很乱，但这只是暂时的，直到让 Node 帮助分离 Angular 代码部分。\n\n\
    模块是命名模块的方式，第二个是该模块所依赖的模块数组。你将使用模块来访问诸如 `ngAnimate`（动画工具）、`ngRoute`（单页应用的客户端路由器）或你自己的模块。我稍后会详细介绍关于模块的内容，但现在只需要知道你的应用必须声明为一个模块。\n\
    \n要声明控制器，请在模块实例上使用 `.controller()` 方法。该方法接受两个参数：一个名称和一个用于构建控制器实例的函数。所有的 Angular\
    \ 组件都遵循这种模式。\n\n让你的 `<script>` 标签看起来像下面：\n\n```html\n<script>\nvar app = angular.module('app',\
    \ []);\napp.controller('PostsCtrl', function ($scope) {\n  $scope.posts = [\n\
    \    {\n      username: 'dickeyxxxx',\n      body: 'Node rules!'\n    },\n   \
    \ {\n      username: 'jeffdickey',\n      body: 'trying out angular.js...'\n \
    \   }\n  ];\n});\n</script>\n```\n\n在这里，你将应用模块存储在变量 `app` 中，然后在上面创建了一个名为 `PostsCtrl`\
    \ 的控制器。该控制器有一个数组，代表了你在 HTML 中看到的帖子。\n\n当你声明控制器时，你知道在 Angular 世界中被称为*依赖注入 $scope*\
    \ 是什么吗？\n\n创建控制器（或其他 Angular 组件）涉及创建一个像你之前所做的那样的函数。当你声明参数时，Angular 会根据你为它们命的名字来查找依赖项。例如，如果你将\
    \ `$scope` 重命名为 `$fobar`，你将看到一个错误（尽管你现在的代码不会报错，因为控制器不会加载）。在我看来，这种依赖注入是 Angular\
    \ 最强大的地方。\n\n什么是 `$scope`？它只是一个你可以在 HTML 和控制器中访问的对象。你稍后会看到更多依赖项的示例。现在，让我们把 `$scope.posts`\
    \ 丢到页面上。向页面添加以下 HTML（保留你现有的静态 HTML 模型作为参考）：\n\n```html\n<div ng-controller='PostsCtrl'>\n\
    {{ posts }}\n</div>\n```\n\n你现在应该在页面上看到控制器的 `$scope.posts` 的 JSON 表示形式。你可以在这些双大括号内编写\
    \ JavaScript，所以如果你只想看第一条帖子的正文，你可以这样做：\n\n```html\n<div ng-controller='PostsCtrl'>\n\
    {{ posts[0].body }}\n</div>\n```\n\n记住，将控制器数据共享到视图（view）时使用 `$scope`。当从视图引用控制器数据时，省略\
    \ `$scope`。\n\n既然你已经走到了这一步，你可以完成此页面的 Angular 化，至少是它的静态版本。这里有一个完整的示例：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >\n</head>\n<body ng-app='app'>\n<div ng-controller='PostsCtrl' class='container'>\n\
    \  <h1>Recent Posts</h1>\n  <ul class='list-group'>\n    <li ng-repeat='post in\
    \ posts' class='list-group-item'>\n      <strong>{{post.username}}</strong>\n\
    \      <span>{{post.body}}</span>\n    </li>\n  </ul>\n</div>\n  <script src='https://ajax.googleapis.com/ajax/libs/angularjs/1.2.18/angular.js'></script>\n\
    \  <script>\n    var app = angular.module('app', []);\n    app.controller('PostsCtrl',\
    \ function ($scope) {\n      $scope.posts = [\n        {\n          username:\
    \ 'dickeyxxx',\n          body: 'Node rules!'\n        },\n        {\n       \
    \   username: 'jeffdickey',\n          body: 'trying out angular.js...'\n    \
    \    }\n      ];\n    });\n  </script>\n</body>\n</html>\n```\n\n## 添加新帖子\n\n\
    图 3.2 Angular 化后的最新帖子页\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_45.png)\n\n\
    你现在已经将代码链接到 Angular，使得你的控制器提供数据，并允许视图显示它，但现在它和你开始时使用的静态 HTML 是一样的。\n\n你需要做的是在页面上设置一个字段让用户添加新帖子。\n\
    \n如果你向 `$scope.posts` 数组添加新元素，Angular 将自动更新视图以显示它。如果你在页面上还有一个输入框和按钮来添加新帖子，你只需要向该数组追加内容即可。\n\
    \n为了说明这一点，我们在页面上添加按钮。在 `<ul>` 之前添加这个按钮：\n\n`<button ng-click='addPost()' class='btn-default'>Add\
    \ Post</button>`\n\n`ng-click` 是一个通常用于调用 `$scope` 函数的指令。现在点击它什么都不会做，但如果你添加了函数，就可以向列表添加帖子。在你的控制器中添加以下行：\n\
    \n```javascript\n$scope.addPost = function () {\n  $scope.posts.unshift({\n  \
    \  username: 'dickeyxxx',\n    body: 'new post!'\n  });\n}\n```\n\n`unshift` 是数组上的一个方法，将新元素推送到数组开头。你应该能够点击“Add\
    \ Post”按钮向列表添加元素（见图 3.2）。\n\n由于你不需要编写代码即可在 `$scope.posts` 变化时更新列表，你可以干净地分离更新逻辑和视图逻辑。如果你通过\
    \ Ajax 调用或 WebSockets 更新帖子，你只需要更新 `$scope.posts`，Angular 会为你处理更新。\n\n你需要在页面上添加输入框让用户输入自己的正文。为了这样做，你将在页面上使用\
    \ `<input>`，绑定到 `$scope`，然后在 `addPost()` 下使用它：\n\n```html\n<input ng-model='postBody'\
    \ class='form-control' />\n```\n\n`ng-model` 指令将输入框绑定到 `$scope` 属性。现在如果你在控制器内部访问\
    \ `$scope.postBody`，你就能获得此文本字段的数据。要用它代替你的库存数据，请更新 `addPost()` 函数：\n\n```javascript\n\
    $scope.addPost = function () {\n  $scope.posts.unshift({\n    username: 'dickeyxxx',\n\
    \    body: $scope.postBody\n  });\n};\n```\n\n现在用户在输入框中输入的任何内容将是他们的帖子正文。一个问题是，发布帖子后字段不会清除。为了解决这个问题，只需在\
    \ `addPost()` 中将 `$scope.postBody` 设置为 `null`：\n\n```javascript\n$scope.postBody\
    \ = null;\n```\n\n由于数据绑定是双向的，你设置 `$scope.postBody` 的任何内容都会更新输入元素，反之亦然。\n\n另一个问题是用户可以发布空帖子。为了解决，只需将\
    \ `addPost()` 逻辑封装在以下条件中：\n\n```javascript\nif ($scope.postBody) {\n```\n\n这是一个包含了一些\
    \ Bootstrap 代码用于布局的应用完整示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link\
    \ rel=\"stylesheet\" href=\"http://netdna.bootstrap.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >\n</head>\n<body ng-app='app'>\n<div ng-controller='PostsCtrl' class='container'>\n\
    <h1>Recent Posts</h1>\n<form role='form'>\n<div class='form-group'>\n<input ng-model='postBody'\
    \ class='form-control' />\n<button ng-click='addPost()' class='btn-default'>Add\
    \ Post</button>\n</div>\n</form>\n</div>\n</body>\n</html>\n```\n\n"
