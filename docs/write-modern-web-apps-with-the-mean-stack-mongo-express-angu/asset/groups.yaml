    \ (posts) {\n  $scope.posts = posts\n});\n```\n\nNode 能够交付这样的静态 JS 和 CSS 文件。现在在生产环境中，你可能不希望\
    \ Node 交付许多此类文件，因为它不如 nginx 或 Apache 这样的通用 Web 服务器高效。不过，这在开发模式下是一个极好的交付方式。\n\n\
    稍后我会详细介绍如何在生产环境中部署你的应用，但我想让你对我们方向有一个方向。未来，你将在应用前面放置一个 CDN 来缓存这些资源。现在，你将继续通过 Node\
    \ 交付它们，因为配置更简单且组件更少。\n\n"
