    \  // ...\n```\n\nYou should now be able to run both the test server and a dev\
    \ server without errors.\n\n# PROTOR LOCATORS\n\nRight now your test is just loading\
    \ a page. The real power of Protractor is its ability to interact with a page's\
    \ DOM elements. These tools are known as locators in Protractor.\n\nTo use a locator,\
    \ you first need to find a DOM element. Here are some of the common ways to do\
    \ that:\n\n```javascript\n// find an element using a css selector\nby.css('.myclass')\n\
    // find an element with the given id\nby.id('myid')\n```\n\n```javascript\n//\
    \ find an element with a certain-model\nby.model('name')\n// find an element bound\
    \ to the given variable\nby.binding('binding')\n```\n\nLocators can be used to\
    \ get information about DOM elements and manipulate them. Once you have located\
    \ an element, you can use action on it.\n\n```javascript\n// click a button or\
    \ link\nelement(by.css('.button')).click()\n\n// fill out a text input\nelement(by.css('.input')).sendKeys('dickeyxxxx')\n\
    ```\n\nThese actions happen asynchronously using promises.\n\n# CLICKING THE LOGIN\
    \ LINK\n\nNow you can try to add your first locator to go to the login page. First,\
    \ add a CSS class to the login button in the nav bar you can use in your test.\
