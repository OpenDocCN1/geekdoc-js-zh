    Active: active (running) since Tue 2014-08-19 21:57:41 EDT; 37s ago\nProcess:\
    \ 31328 ExecStart=/etc/rc.init.d/mongodb start (code=executed, status=SUCCESS)\n\
    Main PID: 31337 (mongod)\n     Group: mongod Service: /var/log/mongodb\n\nAug\
    \ 19 21:57:41 mean-sample[1]: Starting SYS: MongoDB is a scalable, document-oriente...\
    \ \nAug 19 21:57:41 mean-sample[31333]: pam_unix(session:session) session opened\
    \ for us...=0)\nAug 19 21:57:41 mean-sample[31328]: Starting SYS: MongoDB is a\
    \ scalable, document-oriented...e\nHint: ellipsized, use -i to show in full.\n\
    [root@mean-sample-1]#\n```\n\nMongoDB is also in yum, but the default repository\
    \ has an outdated version. To use the latest version, you need to add the official\
    \ MongoDB yum repository.\n\nCreate a file called /etc/yum.repos.d/mongodb.repo\
    \ with the following content:\n\n```\n[mongodb]\nname=MongoDB Repository\nbaseurl=http://downloads-distro.mongodb.org/repo/redhat/os/x86_64/\n\
    gpgcheck=1\nenabled=1\n```\n\nThen install MongoDB like so:\n\n```bash\n# yum\
    \ install mongodb-org\n```\n\nThis install comes with built-in systemd configuration\
    \ to both start the database daemon, it starts on boot, and restart it if it were\
    \ to crash. To turn mongodb on now, tell systemd to start it.\n\n```bash\n# systemctl\
    \ start mongodb\n```\n\nYou can see the status and last few lines with the status\
    \ command, as shown here:\n\n```bash\n# systemctl status mongodb\n```\n\nFigure\
    \ 14.5 the MongoDB server running under systemd\n\nYou can ensure that it is running\
    \ by connecting to it with the mongo command:\n\n```bash\n# mongo\nMongoDB shell\
    \ version: 2.6.4\nconnecting to: test\nWelcome to the MongoDB shell.\nFor interactive\
    \ help, type \"help\".\nFor more comprehensive documentation, see\nhttp://docs.mongodb.org/\n\
    Questions? Try the support group\nhttp://groups.google.com/group/mongodb-user\n\
    ```\n\n# INSTALLING REDIS\n\nUnlike MongoDB, the Redis team does not want to ship\
    \ its software under a yum package. The preferred solution with Redis is to compile\
    \ it. Fortunately, it's actually easy.\n\nFirst, download the tarball to your\
    \ home folder (it actually doesn't matter where you download it, though). This\
    \ is the latest version of it writing; check redis.io for the current one when\
    \ you install it.\n\n```bash\n# wget http://download.redis.io/releases/redis-2.8.13.tar.gz\n\
    ```\n\nThen, extract it and enter the directory.\n\n```bash\n# tar -xzf redis-2.8.13.tar.gz\n\
    # cd redis-2.8.13\n```\n\nNow compile the C code.\n\n```bash\n# make\n```\n\n\
    And run the Makefile's install step to add the binaries to /usr/local/bin.\n\n\
    ```bash\n# make install\n```\n\nYou can now delete these files.\n\n```bash\n#\
    \ cd ..\n# rm -rf redis-2.8.13*\n```\n\nRedis is now available to you, and you\
    \ could boot the server with redis-server, but that won't keep it running as a\
    \ daemon like MongoDB. Because you built Redis from scratch, you need to create\
    \ our own systemd configuration file.\n\nCreate the file /etc/systemd/system/redis.service\
    \ with the following:\n\n```\n[Service]\nExecStart=/usr/local/bin/redis-server\n\
    Restart=always\n```\n\nThis is a basic systemd configuration.\n\n# SYSTEMD COMMANDS\n\
    \nHere are some common commands to use with systemd:\n\n- systemctl daemon-reload:\
    \ reloads the systemd manager configuration.\n- systemctl enable: enables a service\
    \ to start on boot.\n- systemctl disable: prevents a service from starting on\
    \ boot.\n- systemctl start: starts a service.\n- systemctl stop: stops a service.\n\
    - systemctl restart: restarts a service.\n- systemctl status: shows the status\
    \ of a service.\n- journalctl -u [service]: shows the logs for a specific service.\n"
