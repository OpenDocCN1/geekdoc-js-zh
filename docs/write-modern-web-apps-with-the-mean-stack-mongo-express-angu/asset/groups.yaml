    - 7. **端口绑定**：通过端口导出服务。\n- 8. **并发**：通过进程模型进行扩展。\n- 9. **可丢性**：通过快速启动和优雅退出提高健壮性。\n\
    - 10. **开发/生产环境**：使开发、测试和生产环境尽可能相似。\n- 11. **日志**：将日志视为事件流。\n- 12. **管理进程**：作为一次性任务运行管理任务。\n\
    \n## 十要素应用 (TWELVE-FACTOR APPS)\n\nHeroku 创造了 twelve-factor 术语作为构建应用的方法论。遵循这些模式可以应用程序的可移植性，允许应用程序部署到多个环境。在我看来，真正的突破性的（同时也可能是最不熟悉的）是\
    \ 3：配置。将配置仅设置在环境变量中允许开发者通过编辑环境变量来更改应用程序后的后端服务——无需部署。它还允许私钥不检查到代码库中。当我们在 Heroku\
    \ 上部署应用程序时，你将看到这些环境变量如何让你的应用程序快速准备好投入。你还可以在 http://12factor.net 了解更多关于十二要素方法论的信息。\n\
    \n"
