- md: "\n```html\n<div class='input-group'>\n  <input ng-model='postBody' class='form-control'\
    \ />\n  <span class='input-group-btn()'>\n    <button ng-click='addPost()' class='btn\
    \ btn-default'>\n      Add Post</button>\n  </span>\n</div>\n</form>\n```\n\n\
    ```html\n<ul class='list-group'>\n  <li ng-repeat='post in posts' class='list-group-item'>n\
