    This is just done to ensure that the tool belt created the remote successfully.
    If it did, you can now attempt a deploy by pushing to it:


    $ git push heroku master


    You will now see Heroku attempt to compile a slug (a compressed, packaged copy
    of the application) out of the code you pushed up. It will also run npm install
    to install all of your dependencies, which is why we didn''t commit the node_modules
    folder (it also keeps your repository small).


    If it builds and deploys the application successfully, you''ll see a message at
    the end saying "Deployed to Heroku." Now heroku open to open the app in your browser.


    It''s likely on the first push you will get an error message like the one shown
    in Figure 13.2. You can''t tell what is wrong from this error page, so you need
    to look at the logs. From the terminal, type heroku logs to print out the most
    recent logs.


    It might be hard to see, the error I received (and likely you as well) is because
    Heroku is trying to connect to a nonexistent MongoDB instance on localhost.


