  - "[PAGE 90]\n\n```\ngulp.task('js', function () {\n  gulp.src(['/ng/module.js',\
    \ 'ng/**.js'])\n  .pipe(sourcemaps.init())\n  .pipe(concat('app.js'))\n  .pipe(ngAnnotate())\n\
    \  .pipe(uglify())\n  .pipe(sourcemaps.write())\n  .pipe(gulp.dest('assets'))\n\
    })\n\ngulp.task('watch:js', ['js'], function () {\n  gulp.watch('ng/*.js', ['js'])\n\
    })\n```\n\nIf you now look at app.js, you'll see a huge comment in there that\
    \ actually contains the contents of all the preminified files. You will also see\
    \ the console log now correctly points to posts.svc.js with a friendly callstack.\
    \ Having confirmed this, you can remove the console.error from posts.svc.js.\n\
    \nYou now have a great Gulp task to build all of your JavaScript. As you've seen,\
    \ Gulp is pretty composable. For example, if you want to add something like CoffeeScript,\
    \ it would be easy to do.\n\nOn some projects, I will have a separate task to\
    \ generate JavaScript for development versus production. Typically the development\
    \ won't do any minification. If there are a lot of assets and minification takes\
    \ a long time, a setup like that might be preferable. Still, to maintain parity\
    \ between production and development, I do encourage you to build the JavaScript\
    \ same in both environments."
  - "[PAGE 91]\n\n# BUILD CSS WITH GULP\n\nPretty much all web apps today use some\
    \ kind of CSS preprocessor (Sass, Less, Stylus, and so on). These have features\
    \ such as variables (to color codes in), mixins, includes, and so on.\n\nSass\
    \ is probably the most popular CSS preprocessor right now, but it has a couple\
    \ of downsides. First, it's really slow. Large apps can take several minutes to\
    \ fully compile. It's also written in Ruby, which would require you to install\
    \ Ruby on your machines and make sure it's configured properly.\n\nStylus is a\
    \ newer CSS preprocessor that has some features you won't find in Sass (powerful\
    \ logic, to run Node is inside, and an optional cleaner syntax. It's also written\
    \ in Node, using it is easy. For these reasons, you'll be using Stylus on this\
    \ project. If you want to use an alternate, though, it's a similar setup.\n\n\
    You won't be working with CSS much in this book, so to get a quick example going,\
    \ let's just change the <h1> to be green.\n\nMy favorite part of Stylus is the\
    \ flexibility in the syntax. You are free to write the same CSS many different\
    \ ways. Here's an example of four ways to write the same Stylus.\n\nNormal syntax:\n\
    \n```\nh1 {\n  color: green;\n}\n```\n\nSemicolons are optional:\n\n```\nh1 {\n\
    \  color: green\n}\n```\n\nCurly braces are optional too:\n\n```\nh1\n  color:\
    \ green\n```\n\nEven the colon is optional:\n\n```\nh1\n  color  green\n```\n\n\
    Create a file css/app.styl with one of those variations.\n\nNext, install gulp-stylus:\n\
    \n```\n$ npm install --save gulp-stylus\n```"
  - "[PAGE 92]\n\nNow you could add a new task to gulpfile.js, but since Gulp files\
    \ tend to get pretty big, this would be a nice time to split the Gulp config into\
    \ separate files. Create a file gulp/css.js with the following content:\n\n```\n\
    var gulp = require('gulp')\nvar stylus = require('gulp-stylus')\ngulp.task('css',\
    \ function () {\n  gulp.src('css/**/*.css')\n  .pipe(stylus())\n  .pipe(gulp.dest('assets'))\n\
    })\n```\n\nThen let's put a bit of code into the gulpfile.js file to read in all\
    \ of the files under gulp:\n\n```\nvar fs = require('fs')\nfs.readdirSync(__dirname\
    \ + '/gulp').forEach(function (task) {\n  require('./gulp/' + task)\n})\n```\n\
    \nIf this code is confusing, you could just add each Gulp task with individual\
    \ require()s. I just do so that I add a new require() every time I create a new\
    \ Gulp file. Now any files you add to /gulp will be automatically included. I\
    \ suggest breaking out the JavaScript building part of gulpfile.js into a file\
    \ /gulp/scripts.js.\nRun this task:\n\n$ gulp css\n\nThen include the CSS in /layouts/posts.html,\
    \ like so:\n\n```\n<link rel=\"stylesheet\" href=\"app.css\">\n```\n\nAnd you\
    \ should have a green header! Read up on Stylus at http://learnboost.github.io/stylus\
    \ for more on how to use it.\n\nI also suggest a task watch:css like you had for\
    \ the JavaScript so you don't have to run the task all the time:\n\n```\ngulp.task('watch:css',\
    \ function () {\n  gulp.watch('css/**/*.css', ['css'])\n})\n```\n\nThere is a\
