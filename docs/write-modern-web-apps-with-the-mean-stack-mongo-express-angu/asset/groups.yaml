    \        username: 'dickeyxx',\n        body: $scope.postBody // 使用输入的文本\n   \
    \   });\n      // 清空输入字段\n      $scope.postBody = null\n    }\n  }\n}\n```\n\n\
    ```javascript\n// 初始数据\n$scope.posts = [\n{\n  username: 'dickeyxxx',\n  body:\
    \ 'Node 规则！'\n},\n{\n  username: 'jeffdickey',\n  body: '正在尝试 angular.js...'\n\
    }\n])\n</script>\n</body>\n</html>\n```\n\n# 下一步工作\n\n你现在拥有了一个功能完备的发布状态更新的应用程序。正如你敏锐察觉到的，现在的主要问题是它从不会持久化。当用户关闭浏览器窗口时，这些帖子就会消失。你可以将它们持久化到浏览器的本地存储中，但这将导致无法与其他用户共享数据（这对于社交网络应用来说非常重要）。\n\
    \n在下一章中，你将为此应用程序构建一个 API 来持久化帖子。然后在第 5 章中，你会将此 Angular 应用与你构建的 Node API 集成。\n\n\
    # 第 4 章\n构建 Node.js API\n\n在上一一个章节中，你构建了一个功能完备的发布状态更新 Angular 应用。在本章中，你将为它构建一个\
    \ API 来获取所有帖子列表并发布新帖子。端点如下：\n\n- GET /api/posts 返回所有帖子的 JSON 数组。这与你在 $scope.posts\
    \ 中的内容类似。\n\n- POST /api/posts 预期接收一个包含用户名和帖子内容的 JSON 文档。它会将该帖子保存到 MongoDB 中。\n\
    \n# 基础端点\n\n首先，你将使用 Node.js 和 Express 构建一个基础的 /api/posts 端点。首先，在一个文件夹中创建一个如下的\
    \ `package.json` 文件：\n\n```json\n{\n  \"name\": \"socialapp\"\n}\n```\n\n名称可以是你想要的任何内容，但尽量确保它不会与现有的包冲突。`package.json`\
    \ 文件是你创建目录 node 项目所唯一需要的文件。\n现在你有了它，可以将 express 和 body-parser 添加为依赖：\n\n```bash\n\
    $ cd <path-to-project-folder>\n$ npm install --save express\n$ npm install --save\
    \ body-parser\n```\n\nbody-parser 用于让 express 自动读取 POST 请求中的 JSON。\n--save 标志会将依赖项保存到\
    \ `package.json` 文件中，这样你就知道应用构建时用的是哪些版本的包（因此依赖于这些版本）。事实上，如果你打开 `package.json`，你会看到类似下面的内容：\n\
    \n```json\n{\n  \"name\": \"socialapp\",\n  \"dependencies\": {\n    \"body-parser\"\
    : \"^1.4.3\",\n    \"express\": \"^4.4.4\"\n  }\n}\n```\n\n现在你已经完成了这一步，可以使用 `require('express')`\
    \ 将其包含在 node 脚本中。\n\n创建一个包含内容的 `server.js` 文件：\n\n```javascript\nvar express =\
    \ require('express')\nvar bodyParser = require('body-parser')\n\nvar app = express()\n\
    app.use(bodyParser.json())\n\napp.get('/api/posts', function (req, res) {\n  res.json({\n\
    \    username: 'dickeyxxxx',\n    body: 'node rocks!'\n  })\n})\n\napp.listen(3000,\
    \ function () {\n  console.log('Server listening on', 3000)\n})\n```\n\n尝试运行此文件：\n\
    \n- $ node server.js\n\n你可以在浏览器中 http://localhost:3000/api/posts 访问它。你应该能看到你的存位\
    \ JSON 返回了。\n\n你现在已经有了基础的 Node 请求，所以你需要添加用于添加帖子的 POST 端点，并将其连接到 MongoDB。\n\n#\
    \ 通过 API 创建帖子\n\n让我们构建用于创建帖子的 POST 端点。将此端点添加到 `server.js` 中：\n\n```javascript\n\
    app.post('/api/posts', function (req, res) {\n  console.log('post received!')\n\
    \  console.log(req.body.username)\n  console.log(req.body.body)\n  res.send(201)\n\
    })\n```\n\n这只是一个用于检查你是否正确读取数据的请求。客户端只接收 HTTP 状态码 201（已创建）。在构建 MEAN 应用时，构建许多此类存位逻辑来检查你的管道连接是否正常是非常好的。因为你无法在浏览器中测试\
    \ POST 请求，所以你应该使用 `curl` 来检查它是否正常工作：\n\n```bash\ncurl -v -H \"Content-Type: application/json\"\
    \ -XPOST --data \\\n'{\"username\":\"dickeyxxx\", \"body\":\"node rules!\"}'\n\
    localhost:3000/api/posts\n```\n\n如果你不熟悉 `curl`，这句话的意思是“向 localhost:3000/api/posts\
    \ 发送 POST 请求。开启详细模式”。将 Content-Type 头部设置为 json 会将 JSON 文档作为正文包含。\n\nContent-Type\
    \ 头部对于将此内容解析为来自 JSON 的友好的 `req.body.username` 对象是必要的。\n\n如果你不习惯命令行，可以使用 Chrome\
    \ 上非常棒 Postman 应用来测试 API。无论你使用哪种方法，使用此类客户端测试你的 API 而不是同步步构建你的应用，是至关重要的。\n\n# 带有\
    \ MONGOOSE 的 MongoDB 模型\n\n为了与 MongoDB 交互，你将使用 Mongoose ODM。它是 Mongo 驱动之上的一个轻量级层。要添加\
    \ npm 包，请执行以下操作：\n\n- $ npm install --save mongoose\n\n保持代码模块化是好的，这样你的 `server.js`\
    \ 文件就不会变得巨大。让我们添加一个 `db.js` 文件包含一些数据库连接逻辑：\n\n```javascript\nvar mongoose = require('mongoose')\n\
    mongoose.connect('mongodb://localhost/social', function () {\n  console.log('mongodb\
    \ connected')\n})\nmodule.exports = mongoose\n```\n\n你可以通过使用 `require` 函数访问此 mongoose\
    \ 实例。现在我们来创建一个 mongoose 模型来存储帖子。将此代码放在 `models/post.js` 中：\n\n```javascript\n\
    var db = require('../db')\nvar Post = db.model('Post', {\nusername: { type: String,\
    \ required: true },\nbody: { type: String, required: true },\ndate: { type: Date,\
    \ required: true, default: Date.now }\n})\nmodule.exports = Post\n```\n\n现在你有一个可以通过\
    \ `require` 获取的模型。你可以使用它与数据库交互。\n\n# 在 POST 端点中使用\n MONGOOSE 模型\n\n现在引入此模块将给你\
    \ Post 模型，你可以在端点中使用它来创建帖子。\n\n在 `server.js` 中，将你的 `app.post('/api/posts')` 端点更改为内容：\n\
    \n```javascript\nvar Post = require('./models/post')\napp.post('/api/posts', function\
    \ (req, res, next) {\n  var post = new Post({\n    username: req.body.username,\n\
    \    body: req.body.body\n  });\n  post.save(function (err, post) {\n    if (err)\
    \ return next(err)\n    res.json(201, post)\n  });\n});\n```\n\n"
