  - "[PAGE 221]\n\n# COMPILING ASSETS\n\nThis now deploys, the application is missing\
    \ the assets folder. Keeping out of the repository will save a lot of space over\
    \ time and prevents problems when lots of people are working on the same codebase.\
    \ For this reason, I encourage you to keep the assets folder ignored in .gitignore.\
    \ Of, course, after not including them, you need to compile the assets on Heroku\
    \ before the application can be started.\n\nWhen you perform the Git push to Heroku,\
    \ it takes time to download all the dependencies and builds a slug out of the\
    \ ending contents. The slug is a file that Heroku uses internally to provision\
    \ out new dynos for the application.\n\nRather than build the assets when the\
    \ process starts, the better solution is to compile the assets right into the\
    \ slug during the Git push master step. This is easy to do with Heroku since you\
    \ can leverage the postinstall step in npm.\n\nIn package.json, add the following\
    \ config:\n\n```\n\"scripts\": {\n  \"start\": \"node boot.js\",\n  \"postinstall\"\
    : \"gulp build\"\n}\n```\n\nAfter the packages are installed, gulp build will\
    \ be run, and when complete, Heroku will build a slug with the full asset contents,\
    \ but you won't have to commit them to the codebase. Here's an example run with\
    \ gulp build in the slug compilation:\n\n```\n$ git push heroku master\nFetching\
    \ repository, done.\nCounting objects: 1, done.\nWriting objects: 100% (1/1),\
    \ 849 bytes | 0 bytes/s, done.\nTotal 1 (delta 0), reused 0 (delta 0)\n```\n\n\
    ```\n------ Node.js app detected\n------> Defaulting to latest stable node: 0.10.30\n\
    ------ Downloading and installing node\n------> Restoring node_modules directory\
    \ from cache\n------ Pruning cached dependencies not specified in package.json\n\
    ------> Exporting config vars to environment\n------> Installing dependencies\n\
    ```"
