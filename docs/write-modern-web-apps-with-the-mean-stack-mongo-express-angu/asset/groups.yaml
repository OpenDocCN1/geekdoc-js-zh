    \ THE THICK CLIENT\n\nKnowing that you can now generally depend on JavaScript\
    \ being in browsers, a new way to develop applications has begun. You can build\
    \ thick clients that will do the heavy lifting (rather than the server doing most\
    \ of that work) and interact with a server via an API (much in the way of a mobile\
