- md: "\n# NEXT STEPS\n\nYou have now seen how to integrate authentication into your\
    \ application. In the next chapter, you will make the application more immersive\
    \ by streaming in content with WebSockets.\n\n# CHAPTER 9\n\nPushing Notifications\
    \ with WebSockets\n\nIn this chapter, you'll learn how to make applications more\
    \ interactive by adding WebSockets. WebSockets allow you to push live changes\
    \ from a server into a browser.\n\n# INTRODUCING WEBSOCKETS\n\nIn the interest\
    \ of finding ways to develop more interactive, more immersive applications, browsers\
    \ now support a new protocol in addition to HTTP: WebSockets. HTTP was pretty\
    \ much the only way for developers to communicate with browsers for a long time.\
    \ It's a reliable, relatively quick protocol that developers got by with.\n\n\
    The major downside to HTTP is that it's one-way for web applications. The browser\
    \ can not be an HTTP server, which means that the client must initiate any communication.\
    \ This works well for what the Web was originally designed for (reading documents\
    \ and viewing media), but it doesn't support heavy interactivity.\n\nAs I covered\
    \ in Chapter 1, Ajax was a groundbreaking technology that helped developers to\
    \ quickly load new content on pages. Ajax still uses HTTP, though so anything\
    \ a server might want to notify a client about (download process, notification,\
    \ and new content), it has to query.\n\nTo solve this problem, we've come up with\
    \ various solutions like Flash, Comet, and short- and long-polling. For the most\
    \ part, these were all complicated hacks needed to get around the problem of a\
    \ server not being able to ping a client. Luckily, W3C has now standardized WebSockets\
    \ as a solution. It has good browser support, working on all major mobile devices,\
    \ Chrome, Firefox, and Safari. It's supported by IE10 and newer. (Note that you\
    \ need to support IE9 or older, the tool socket.io will help.)\n\nW3C took time\
    \ to get this API right, and using it in the browser is easy. For this part of\
    \ the book, you will be working with WebSockets almost entirely from scratch.\
    \ There are tools to abstract some of the complexity away (such as the aforementioned\
    \ socket.io), but they're really only a light layer of abstraction.\n\n# HOW WEBSOCKETS\
    \ WORK\n\nWebSockets works similarly to the low-level TCP layer. It provides a\
    \ full-duplex channel between your server and the client. It allows either the\
    \ client or the server to pass messages as strings to one another, unlike TCP,\
    \ which only sends bytes back and forth.\n\nOn a WebSocket-enabled site, a bit\
    \ of JavaScript will be run to tell the browser to make a WebSocket connection.\
    \ Once it's made, it provides an event callback for messages. It's really easy\
    \ to make a connection from a browser:\n\n```\nvar connection = new WebSocket('ws://mysite.com')\n\
    connection.onmessage = function (e) {\n  console.log('message received: ', e.data)\n\
    }\n```\n\nAgain, no libraries are used here. Simply make a new WebSocket object\
    \ and attach a function to its onmessage event. After it connects, any messages\
    \ sent from the server will be delivered to this callback.\n\nTypically e.data\
    \ attribute will contain a bit of JSON we will parse, but it could be any string\
    \ or binary blob.\nSending events is easy as well:\n\n```\nvar connection = new\
    \ WebSocket('ws://mysite.com')\nconnection.onmessage = function (e) {\n  console.log('message\
    \ received: ', e.data)\n  connection.send('get your message: ' + e.data)\n}\n\
    ```\n\nYou can send messages at any time, not just after receiving one. Because\
    \ the connection is created asynchronously, you can't just call connection.send()\
    \ directly after creating the connection object, however. If you wanted to send\
    \ a message right after connecting, you could use the onopen event:\n\n```\nvar\
    \ connection = new WebSocket('ws://mysite.com')\nconnection.onopen = function\
    \ () {\n  connection.send('hello!')\n}\n```\n\nUnlike HTTP, the server side of\
    \ this code looks similar; however, you need to use a package for it since it\
    \ is not built into Node.js.\n\nUsing this technology, you can cause the browser\
    \ to react to changes from any other system easily. For the social application\
    \ you've been building, you'll add functionality so that if any user posts an\
    \ update, all others will see the update pop live.\n\n# WHAT SHOULD YOU USE WEBSOCKETS\
    \ FOR?\n\nWebSockets can be used for many scenarios where real-time communication\
    \ is essential. For example:\n\n- Real-time chat applications\n- Multiplayer gaming\n\
    - Collaborative editing tools\n- Live stock tickers or sports score updates\n\n\
    However, WebSockets are not the right answer for every problem. If you only need\
    \ to fetch static data occasionally, a standard HTTP request is much simpler and\
    \ easier to implement.\n"
  mdcn: "\n\n# 下一步\n\n你现在已经了解了如何将身份验证集成到应用程序中。在下一章中，你将通过 WebSockets 流传输内容让应用程序更具沉浸感。\n\
    \n# 第 9 章\n\n使用 WebSockets 推送\n\n在本章中，你将学习如何通过添加 WebSockets 让应用程序更具交互性。WebSockets\
    \ 允许你从服务器将实时更改推送到浏览器。\n\n# 介绍 WebSockets\n\n为了开发更具交互性、更沉浸的应用程序，浏览器现在除了 HTTP 之外还支持一种新协议：WebSockets。在很长一段时间内，HTTP\
    \ 是开发者与浏览器通信的唯一方式。它是一个可靠且相对快速的协议，开发者一直在使用它。\n\nHTTP 的主要缺点是对于 Web 应用程序它是单向的。浏览器不能作为\
    \ HTTP 服务器，这意味着客户端必须发起任何通信。这对于 Web 最初的设计初衷（读取文档和查看媒体）效果良好，但它不支持高强度的交互。\n\n正如我在第\
    \ 1 章中提到的，Ajax 是一项突破性技术，帮助开发者在页面上快速加载新内容。尽管 Ajax 仍然使用 HTTP，但因此服务器想要通知客户端的任何内容（下载过程、通知和新内容），都必须通过查询来实现。\n\
    \n为了解决这个问题，我们提出了各种解决方案，如 Flash、Comet 以及短轮询和长轮询。大多数情况下，这些都是为了绕过服务器无法 ping 客户端而采用的复杂手段。幸运的是，W3C\
    \ 现在已将 WebSockets 标准化为解决方案。它具有良好的浏览器支持，适用于所有主要的移动设备、Chrome、Firefox 和 Safari。它受\
    \ IE10 及更高版本的支持。（注意，如果你需要支持 IE9 或更早版本，工具 socket.io 将提供帮助。）\n\nW3C 花了时间来完善这个 API，而且在浏览器中使用它非常简单。在本书的这部分，你将几乎完全从零开始使用\
    \ WebSockets。虽然有一些工具可以抽象掉复杂性（例如提到的 socket.io），但它们真的只是轻量级的抽象层。\n\n# WebSockets\
    \ 如何工作\n\nWebSockets 的工作原理与底层的 TCP 层类似。它在你的服务器和客户端之间提供了一个全双工通道。它允许客户端或服务器将消息作为字符串互相传递，而\
    \ TCP 仅往回发送字节。\n\n在启用了 WebSockets 的网站上，将运行一些 JavaScript 来告诉浏览器建立 WebSocket 连接。一旦连接建立，它就会为消息提供事件回调。从浏览器建立连接非常简单：\n\
    \n```\nvar connection = new WebSocket('ws://mysite.com')\nconnection.onmessage\
    \ = function (e) {\n  console.log('message received: ', e.data)\n}\n```\n\n再次，这里没有使用任何库。只需创建一个新的\
    \ WebSocket 对象并将函数绑定到它的 `onmessage` 事件上。连接后，从服务器发送的任何消息将传递到此回调函数。\n\n通常 `e.data`\
    \ 属性将包含我们将解析的 JSON，但也可以是任何字符串或二进制块（binary blob）。\n发送事件也很简单：\n\n```\nvar connection\
    \ = new WebSocket('ws://mysite.com')\nconnection.onmessage = function (e) {\n\
    \  console.log('message received: ', e.data)\n  connection.send('get your message:\
    \ ' + e.data)\n}\n```\n\n你可以随时发送消息，而不仅仅是在接收到消息之后。然而，由于连接是异步创建的，你不能在创建连接对象后直接调用\
    \ `connection.send()`。如果你想在连接后立即发送消息，可以使用 `onopen` 事件：\n\n```var\nvar connection\
    \ = new WebSocket('ws://mysite.com')\nconnection.onopen = function () {\n  connection.send('hello!')\n\
    }\n```\n\n与 HTTP 不同，这段代码的服务器端看起来相似；但你需要使用一个包来实现它，因为它没有内置在 Node.js 中。\n\n使用这项技术，你可以轻松地让浏览器对任何其他系统的更改做出反应。对于你一直在构建的社交应用程序，你将添加功能：如果任何用户发布了更新，所有其他人都能实时看到该更新。\n\
    \n# 你应该在什么情况下使用 WebSockets\n\nWebSockets 可用于许多对实时通信至关重要的场景。例如：\n\n- 实时聊天应用程序\n\
    - 多人游戏\n- 协作编辑工具\n- 实时股票行情或比分更新\n\n然而，WebSockets 并不是所有问题的正确答案。如果你只需要偶尔获取静态数据，标准的\
    \ HTTP 请求要简单得多且容易实现。\n\n"
