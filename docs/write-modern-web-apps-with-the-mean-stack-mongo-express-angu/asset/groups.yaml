    a parent

    ApplicationCtrl listen for that. ApplicationCtrl will then set $scope.currentUser,
    mak-

    ing it available to all children.


    Update LoginCtrl in ng/login.js to pass the event using $emit:


    ```

    angular.module(''app'')

    .controller(''LoginCtrl'', function ($scope, UserSvc) {

    $scope.login = function (username, password) {

    UserSvc.login(username, password)

    .then(function (response) {

    $scope.emit(''login'', response.data)

    }

    }

    })

    ```


    Now, put the ng-controller directive for the ApplicationCtrl on the <body> tag
    inside

    layouts/app.html:


    <body ng-app=''app'' ng-controller=''ApplicationCtrl''>


    And create ng/application.ctrl.js:


    ```

    angular.module(''app'')

    .controller(''ApplicationCtrl'', function ($scope) {

    $scope.on(''login'', function (_, user) {

    $scope.currentUser = user

    }

    })

    ```


    Now you should finally be able to log in to your app! One more thing you need
    to do in

    order to finish up your authentication is to link the user to the post.'
