    # ZERO-DOWNTIME DEPLOYS


    Right now the application will continue to run until it receives a restart event
    from systemd. If you wanted to update the code to the latest version, you would
    run the following commands on the server:


    ```

    $ cd /home/web/mean-mean-sample

    $ git fetch

    $ git pull origin master

    # systemctl restart social-app

    ```


    This work will cause some downtime while the server is restarting. It will be
    only for a couple seconds, but if you want to deploy frequently, that could be
    a problem.


    The way that zero-downtime deploys works is by sending a signal to the process—usually
    SIGHUP—that tells it to reload.


    While Node doesn''t come with any tools to do this automatically, it is pretty
    easy to listen for SIGHUP in Node.


    ```

    process.on(''SIGHUP'', function() {

    console.log(''SIGHUP received'')

    })

    ```


    The fork() method on a Node Cluster will actually reread the code off-disk, allowing
    new workers to use new code. This means you can just listen for the SIGHUP event
    and tell all the existing workers to stop while bringing new ones.


    If you call the .disconnect() method on a Node cluster, it will stop receiving
    new TCP connections and quit when all have stopped.


    Here is a full boot.js script (also at http://github.com/dickxxxx/mean-sample)
    that will both perform the Node Cluster load balancing from the previous chapter
    and listen for SIGHUP for a zero-downtime deploy:


    ```

    var numCpus = require(''os'').length

    var cluster = require(''cluster'')

    cluster.setupMaster({exec: __dirname + ''/server.js''})

    ```


    ```

    // workerIds returns the node cluster index for each worker

    function workerIds() { return Object.keys(cluster.workers) }

    // Gets the count of active workers

    function numWorkers() { return workerIds().length }

    ```'
