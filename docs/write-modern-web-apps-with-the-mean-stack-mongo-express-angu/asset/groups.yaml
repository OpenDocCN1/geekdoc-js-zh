  - '[PAGE 156]


    # JAVASCRIPT TESTING FRAMEWORKS


    Protractor is just a test runner. It requires the use of a testing framework to
    actually write the tests before it can be used. JavaScript has three main testing
    frameworks. Each has its own style and functionality.


    +   - QUnit: This is the oldest framework in this list. It was developed for jQuery
    in 2008. It has been popular for a long time and trusted by many applications.
    Unfortunately, QUnit lacks many of the features found in newer frameworks and
    is less flexible. It also has a verbose syntax, writing tests a chore. Asynchronous
    and promise-based testing is particularly challenging in QUnit—something you will
    do lot of in MEAN applications.

    - Jasmine: This was developed by Pivot Labs as a way to bring the BDD (behavior-driven
    development) semantics of RSpec (a Ruby testing framework) into JavaScript. It
    is the choice of most Angular apps, including the Angular team. It has a much
    more concise syntax than QUnit, but in the 1.x version suffers from some of the
    same problems when it comes to testing asynchronous or promise-based code. Jasmine
    takes an opinionated approach to testing and provides most of the required tools.
    The 2.x track hasn''t yet received good adoption when it comes to Angular tools,
    which has some of the async-chronous semantics in Mocha.

    - Mocha: This is the choice JavaScript testing framework of most Node applications.
    Mocha is flexible and allows you to pick and choose various tools to fit your
    project and testing style. While it''s not the main language in Angular applications,
    it is well supported with all the Angular tools. Some of the tools in the Mocha
    community such as Sinon (a spy toolset) and Chai (an assertion toolset) are useful
    for testing MEAN applications.


    It would be possible to write some of the tests in different frameworks, but it''s
    good to stick with one for consistency. For your application, you''ll go with
    Mocha because it has the best features for what you will need to accomplish. There
    are a few configuration options you need to set to enable Mocha but nothing too
    bad.'
  - "[PAGE 157]\n\n# WRITING A BASIC PROTRACTOR TEST\n\nThe convention in JavaScript\
    \ applications is to place all test code in a directory /test in the root of the\
    \ project. Because you'll be testing with three different methods (end-to-end,\
    \ Node server, and Angular) in the social app, you should have directories for\
    \ each. Create a directory /test and create a folder for each testing method you\
    \ will use.\n\n```\n$ mkdir -p test/e2e\n$ mkdir test/ng\n$ mkdir test/server\n\
    ```\n\nNOTE: If you haven't seen the -p flag for mkdir before, it creates the\
    \ full path if it doesn't exist rather the directory. In this case, it would create\
    \ both the test and test/e2e directories if neither existed.\n\nIn this chapter\
    \ you'll be working with e2e (end-to-end), but I want you to see what the final\
    \ structure will look like for your tests.\n\nNow that you have the e2e directory,\
    \ let's create your first test.\n\nFeature tests as Protractor are good for describing\
    \ user stories in the system. It's good to think of using the application from\
    \ a user's perspective on an entire flow. For an e-commerce website, this might\
    \ mean coming to the site, finding a product, adding it to the cart, and completing\
    \ the order. A test like this will hit on many parts of the application, ensuring\
    \ that the common flows are always stable.\n\nIt's not necessary for feature tests\
    \ to account for everything a user can do in an application. Too many tests can\
    \ become slow, and if they are too fine grained, they can be difficult to make\
    \ changes to an application. Feature tests are useful, and you should be judicious\
    \ about them.\n\nIn the main flow of your application, you can have a test describing\
    \ a user logging in and posting your first post. It's good to write it out in\
    \ comments first and then replace each step with code. Create a file test/e2e/making_a_post.spec.js.\n\
    \n```\ndescribe('making a post', function () {\n  it('logs in and creates a new\
    \ post', function () {\n    // go to homepage\n    // click 'login'\n    // fill\
    \ out and submit login form\n    // submit a new post on the posts page\n\n  \
    \  // the user should now see their post as the first post on the page\n  })\n\
    })\n```\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_157_0.png)"
  - "[PAGE 158]\n\nIt's important the tests end in .spec.js since that's how you tell\
    \ Protractor to find the tests. It will also allow us to have .js files in the\
    \ test/e2e directory that are not tests—such as utility scripts.\n\nMocha (like\
    \ Jasmine or RSpec) uses the BDD-style describe and it blocks. These are designed\
    \ to help you document your code. describe blocks are nested to give context about\
    \ the test. it blocks are actual tests and describe what should happen during\
    \ the test.\n\nTry to think of the final assertion you want to make during the\
    \ test and when you left the assertion on its own line. In fact, a trick I've\
    \ found useful is to think of the final assertion first (what would happen ultimately?)\
    \ and then describe the flow backward. It can be easier to think of the flow that\
    \ way since you only need to think of the prerequisites for each step.\n\nBefore\
    \ you can move on, you should try to see whether your test is nested to at least\
    \ run. Replace the go to homepage comment with the following code to tell Protractor\
    \ to load the page: \n\n```\ndescribe('making a post', function () {\nit('logs\
    \ in and creates a new post', function () {\n  browser.get('http://localhost:3000')\n\
    \  // ...\n})\n```\n\n# CONFIGURING AND RUNNING PRORACTOR\n\nNow create a config\
    \ file for Protractor to tell it you want to use Mocha for running your tests\
    \ and where to find the end-to-end tests. Place this code at the root of the project\
    \ in a file protractor.conf.js. The name and location are important.\n\n```\n\
    exports.config = {\n  framework: 'mocha',\n  specs: [\n    'test/e2e/**.spec.js'\n\
    \  ],\n  mochaOpts: {\n    enableTimeouts: false\n  }\n};\n```\n\nThe enableTimeouts\
    \ setting is necessary to avoid timeout bugs with Mocha that I've found while\
    \ using Protractor. It's possible they may be resolved by the time you read this\
    \ book, making that setting unnecessary.\n\nNow install Mocha into the project\
    \ as a development dependency:\n\n```\n$ npm install --save-dev mocha\n```"
