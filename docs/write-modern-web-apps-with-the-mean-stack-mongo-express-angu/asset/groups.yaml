    \ localhost:3000/user\n```\n\nyou get the token, decrypted, as shown here:\n\n\
    ```json\n{\"username\":\"dickeyxxxx\"}\n```\n\nThe server is now generating and\
    \ decoding tokens for you, but it's not interesting since it's not actually pulling\
