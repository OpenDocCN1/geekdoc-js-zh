  - '[PAGE 236]


    # INSTALLING REDIS


    Unlike MongoDB, the Redis team does not want to ship its software under a yum
    package. The preferred solution with Redis is to compile it. Fortunately, it''s
    actually easy.


    First, download the tarball to your home folder (it actually doesn''t matter where
    you download it, though). This is the latest version of it writing; check redis.io
    for the current one when you install it.


    ```

    # wget http://download.redis.io/releases/redis-2.8.13.tar.gz

    ```


    Then, extract it and enter the directory.


    ```

    # tar -xzf redis-2.8.13.tar.gz

    # cd redis-2.8.13

    ```


    Now compile the C code.


    ```

    # make

    ```


    And run the Makefile''s install step to add the binaries to /usr/local/bin.


    ```

    # make install

    ```


    You can now delete these files.


    ```

    # cd ..

    ```


    ```

    # rm -rf redis-2.8.13*

    ```


    Redis is now available to you, and you could boot the server with redis-server,
    but that won''t keep it running as a daemon like MongoDB. Because you built Redis
    from scratch, you need to create our own systemd configuration file.


    Create the file /etc/systemd/system/redis.service with the following:


    ```

    [Service]

    ExecStart=/usr/local/bin/redis-server

    Restart=always

    ```


    This is a basic systemd configuration. It just tell systemd what command to run
    and that it should restart it if it were to die.


    Starting Redis is now the same as with MongoDB.


    ```

    # systemctl start redis

    ```'
  - '[PAGE 237]


    # SYSTEMD COMMANDS


    Here are some common commands to use with systemd:


    ```

    systemctl daemon-reload # reloads .service files if they''ve changed

    systemctl disable redis # shuts down redis and prevents it from

    > starting again

    systemctl enable redis # re-enables a previously disabled service

    systemctl start redis # starts a stopped service

    systemctl restart redis # restarts a running service

    systemctl status redis # shows the current info and some logs of

    -> the service

    journalctl -u redis # pulls down the logs of the service

    ```


    Test your Redis install by running redis-cli, as shown here:


    ```

    # redis-cli

    127.0.0.1:6379

    ```'
  - '[PAGE 238]


    # RUNNING THE SOCIAL APP


    Now that your server is provisioned with the needed services, you can move on
    to adding your application.


    Because it is insecure to run the application as root, you will now create a user
    called web to actually run the application:


    ```

    # userid add

    ```


    Now to ensure that you don''t create any files as root, let''s jump into that
    account to grab the code:


    ```

    # su web

    ```


    ```

    $ cd

    ```


    cd without any arguments simply goes to the home folder—in this case /home/web.

    Now grab the repository. You can either your application or mine. This example
    uses my code hosted on GitHub.


    ```

    $ git clone https://github.com/dickeyxxx/mean-sample

    ```


    ```

    $ cd mean-sample

    ```


    Now install the npm dependencies in package.json.


    ```

    $ npm install --production

    ```


    The --production flag isn''t required but will save some time and prevent installing
    some of your testing code you don''t need on the server.

    Build the CSS and JavaScript assets with Gulp.


    ```

    $ /node_modules/.bin/gulp js css

    ```


    You could install Gulp globally as root to prevent having to go into the node_modules/

    folder to run this command. Even would be better to add this as a postinstall

    step in package.json. See https://www.npmjs.org/doc/misc/npm-scripts.html for
    more infor-\mation on poststart and other scripts you can add to package.json.


    Start the server:


    ```

    $ node boot.js

    ```


    You should be able to access this in your browser now by going directly to the
    IP address

    in the browser at port 3000.


    If it seems to be inaccessible, you may need to run iptables --flush.

    This now works, but you should run this on port 80 so you don''t have to have
    the port in

    the URL.


    To resolve this, you can add a simple port mapping with iptables. Run this with
    root.


    ```

    $ exit

    ```


    ```

    # iptables -t nat -I PREROUTING - tcp --dport 80 -j REDIRECT --to-port 3000

    ```'
  - '[PAGE 239]


    # RUNNING SOCIAL APP UNDER SYSTEMD


    The problem with this setup is that as soon as the terminal session is closed
    or the server crashes, it won''t come back up. You should run the application
    under systemd just like that you did for Redis and MongoDB.


    Create the service at /etc/systemd/system/social-app.service with the following
    content. The working directory might be different depending on where you installed
    the app.


    ```

    [Service]

    WorkingDirectory=/home/web/mean-sample

    ExecStart=/usr/local/bin/node boot.js

    User=web

    Group=web

    Restart=always

    Environment=''NODE_ENV=production''

    StandardOutput=syslog

    StandardError=syslog

    SyslogIdentifier=social-app

    ```


    Then start the service as root. The root user starts the social-app service, but
    the app is executed by the web user.


    ```

    # systemctl start social-app

    ```


    Remember to run systemctl daemon-reload if you need to make changes to the service
    file.'
