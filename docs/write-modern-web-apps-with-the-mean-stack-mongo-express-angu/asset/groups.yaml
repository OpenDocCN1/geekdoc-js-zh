    \      $rootScope.broadcast('ws:' + payload.topic, payload.data)\n    }\n  }\n\
    \  this.send = function (topic, data) {\n    var json = JSON.stringify({topic:\
    \ topic, data: data})\n    connection.send(json)\n  }\n})\n.run(function (WebSocketSvc)\
    \ {\n  WebSocketSvc.connect()\n  })\n\n```\n\nNote that you should dependency\
    \ inject the service into a run component. Angular lazy-loads the services when\
    \ needed, but there might be a controller that wants to listen to WebSocket events\
    \ without sending them. You could add WebSocketSvc as a dependency to each, but\
    \ it's a lot easier to add just this run component."
  - "[PAGE 151]\n\n# DYNAMIC WEBSOCKET HOSTNAME\n\nThe way you've configured your\
    \ WebSocket service right now is hard-coded to ws://localhost: 3000. It would\
    \ be good if you used the same hostname as the server hosting the application\
    \ in order to allow the application to be hosted on any host or port.\n\nYou could\
    \ write a function like this to take the hostname of the page and replace the\
    \ protocol with ws or wss—depending on whether you're running over SSL.\n\n```\n\
    function websocketHost() {\n  if ($window.location.protocol === \"https:\") {\n\
    \    return \"wss://\" + window.location.host\n  } else {\n    return \"ws://\"\
    \ + window.location.host\n  }\n}\n```\n\nHere is a complete example:\n\n```\n\
    angular.module('app')\n.service('WebSocketSvc', $rootScope) {\n  function websocketHost()\
    \ {\n    if ($window.location.protocol === \"https:\") {\n      return \"wss://\"\
    \ + window.location.host\n    } else {\n      return \"ws://\" + window.location.host\n\
    \    }\n  }\n\n  var connection = function () {\n    connection = new WebSocket(websocketHost())\n\
    \    connection.onmessage = function (e) {\n      var payload = JSON.parse(e.data)\n\
    \      $rootScope.broadcast('ws:' + payload.topic, payload.data)\n    }\n    this.send\
    \ = function (topic, data) {\n      var json = JSON.stringify({topic: topic, data:\
    \ data})\n      connection.send(json)\n    }\n  };\n})\\.run(function (WebSocketSvc)\
    \ {\n  WebSocketSvc.connect()\n})\n```"
