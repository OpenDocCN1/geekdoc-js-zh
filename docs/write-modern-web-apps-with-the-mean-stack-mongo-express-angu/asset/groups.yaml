    ## PLATFORM-AS-SERVICE\n\nHeroku is a platform-as-service\n3. Config: Store config\
    \ in the environment.\n4. Backing services: Treat backing services as attached\
    \ resources.\n5. Build, release, run: Strictly separate build and run stages.\n\
    6. Processes: Execute the app as one or more stateless processes.\n7. Port binding:\
    \ Export services via port binding.\n8. Concurrency: Scale out via the process\
    \ model.\n9. Disposability: Maximize robustness with fast startup and graceful\
    \ shutdown.\n10. Dev/prod parity: Keep development, staging, and production as\
    \ similar as possible.\n11. Logs: Treat logs as event streams.\n12. Admin processes:\
    \ Run admin/management tasks as one-off processes.\n\n## Deploying your application\n\
    \nHeroku applications require following 12-factor methodology, but it's a great\
    \ set of techniques useful for applications of any size. Here are the 12 factors:\n\
    \n- 1. **Codebase**: One codebase tracked in version control; many deploys.\n\
    - 2. **Dependencies**: Explicitly declare and isolate dependencies.\n- 3. **Config**:\
    \ Store config in the environment.\n- 4. **Backing services**: Treat backing services\
    \ as attached resources.\n- 5. **Build, release, run**: Strictly separate build\
    \ and run stages.\n- 6. **Processes**: Execute the app as one or more stateless\
    \ processes.\n- 7. **Port binding**: Export services via port binding.\n- 8. **Concurrency**:\
    \ Scale out via the process model.\n- 9. **Disposability**: Maximize robustness\
    \ with fast startup and graceful shutdown.\n- 10. **Dev/prod parity**: Keep development,\
    \ staging, and production as similar as possible.\n- 11. **Logs**: Treat logs\
    \ as event streams.\n- 12. **Admin processes**: Run admin/management tasks as\
    \ one-off processes.\n\n## TWELVE-FACTOR APPS\n\nHeroku coined the term 12-factor\
    \ as a methodology for building applications. Following these patterns leads to\
    \ portability with application, allowing the application to deploy multiple environments.\
    \ In my opinion, the real groundbreaking—as well as potentially the least familiar—is\
    \ 3: config. Having configuration set solely in environment variables allows a\
    \ developer to change back-end services behind an application simply by editing\
    \ environment variables—without requiring a deploy. It also allows private keys\
    \ to not be checked into codebase. As you deploy our application on Heroku, you\
    \ will see how these environment variables allow you to quickly make your application\
    \ production-ready. You can also learn much more about the 12-factor methodology\
    \ at http://12factor.net.\n"
