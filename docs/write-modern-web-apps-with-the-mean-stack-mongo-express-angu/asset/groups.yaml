    \ that will be looking for a login() function on the $scope object of its controller.\
    \ The matching controller looks like this and goes in ng/login.ctrl:\n\n```javascript\n\
    angular.module('app')\n.controller('LoginCtrl', function ($scope, UserSvc) {\n\
