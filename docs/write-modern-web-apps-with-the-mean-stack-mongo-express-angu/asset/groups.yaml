  mdcn: "\n\n# JAVASCRIPT 测试框架\n\nProtractor 仅仅是一个测试运行器。在使用它之前，它需要使用测试框架来实际编写测试。JavaScript\
    \ 有三个主要的测试框架。每种框架都有它们自己的风格和功能。\n\n- QUnit：这是列表中最旧的框架。它于 2008 年为 jQuery 开发。它长期以来一直很流行并受到许多应用程序的信任。遗憾的是，QUnit\
    \ 缺乏较新框架中的许多功能，且活性较差。它的语法也冗长，编写测试是一项负担。在 QUnit 中，异步和基于 promise 的测试特别具有挑战性——而你在\
    \ MEAN 应用中会需要这种操作。\n- Jasmine：它由 Pivot Labs 开发，旨在将 RSpec（一个 Ruby 测试框架）的 BDD（行为驱动开发）语义引入\
    \ JavaScript。它是大多数 Angular 应用（包括 Angular 团队）的选择。它的语法比 QUnit 简洁得多，但在 1.x 版本中，在测试异步或基于\
    \ promise 的代码时仍面临着一些相同的问题。Jasmine 采取了主观点色彩的测试方法，并提供了大部分所需的工具。2.x 分支在 Angular 工具方面尚未获得良好的采用，而这些工具包含\
    \ Mocha 中的一些异步同步语义。\n- Mocha：这是大多数 Node 应用选择的 JavaScript 测试框架。Mocha 非常灵活，允许你挑选和选择各种工具来适应你的项目和测试风格。虽然它不是\
    \ Angular 应用中的主要语言，但它得到了所有 Angular 工具的支持。Mocha 社区中的某些工具如 Sinon（一个探器工具集）和 Chai（断言工具集）对于测试\
    \ MEAN 应用非常有用。\n\n在不同的框架中编写某些测试是可能的，但为了一致性，最好坚持使用一个。对于你的应用程序，你将选择 Mocha，因为它对于你将实现的目标具有最好的功能。你需要设置几个配置选项来启用\
    \ Mocha，但并不算糟糕。\n\n# 编写基础 PROTRACTOR 测试\n\nJavaScript 应用的惯例是将所有测试代码放在项目根目录下的 /test\
    \ 目录中。由于你将在社交应用中使用三种不同的方法（端到端、Node 服务器和 Angular）进行测试，你应该为每种方法创建一个目录。创建一个 /test\
    \ 目录，并为你将使用的每种测试方法创建一个文件夹。\n\n```\n$ mkdir -p test/e2e\n$ mkdir test/ng\n$ mkdir\
    \ test/server\n```\n\n注意：如果你以前没见过 mkdir 的 -p 标志，它会在目录不存在时创建完整路径，而不是仅仅目录。在这种情况下，如果两者都不存在，它将同时创建\
    \ test 和 test/e2e 目录。\n\n在本章中，你将处理 e2e（端到端），但我希望让你看到测试的最终结构看起来是什么样的。\n\n现在你已经有了\
    \ e2e 目录，让我们创建你的第一个测试。\n\n作为 Protractor 的功能测试有助于描述系统中的用户故事。从用户的角度考虑整个流程中的应用程序是很好的。对于一个电子商务网站，这可能意味着访问网站、找到产品、将其加入购物车并完成订单。这样的测试将涉及到应用程序的许多部分，确保常用流程始终稳定。\n\
    \n功能测试没有必要考虑到用户在应用程序中可以执行的一切。测试过多会导致运行变慢，如果它们粒度太细，可能会导致修改应用程序变得困难。功能测试是有用的，你应该审慎地使用它们。\n\
    \n在你的应用程序的主流程中，你可以有一个测试来描述用户登录并发布第一条贴子的。最好先在注释中写出来，然后用代码替换每个步骤。创建一个文件 test/e2e/making_a_post.spec.js。\n\
    \n```\ndescribe('making a post', function () {\n  it('logs in and creates a new\
    \ post', function () {\n    // 转到首页\n    // 点击 'login'\n    // 填写并提交登录表单\n   \
    \ // 在 posts 页面发布新贴子\n\n    // 用户现在应该看到他们的贴子是页面上的第一条\n  })\n})\n```\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_157_0.png)\n\
    \n测试以 .spec.js 结尾是非常重要的，因为这是你告诉 Protractor 寻找测试的方式。它还允许我们在 test/e2e 目录中拥有不是测试的\
    \ .js 文件——例如实用脚本。\n\nMocha（类似于 Jasmine 或 RSpec）使用 BDD 风格的 describe 和 it 块。这些设计旨在帮助你记录代码。describe\
    \ 块被嵌套以提供测试的上下文。it 块是实际测试，并描述了测试期间应该发生什么。\n\n尝试思考你在测试期间想要完成的最终断言，并在把断言单独留下时。我发现的一个技巧是先思考最终断言（最终会发生什么？）然后反向描述流程。这样可能更容易，因为你只需要思考每个步骤的前提条件。\n\
