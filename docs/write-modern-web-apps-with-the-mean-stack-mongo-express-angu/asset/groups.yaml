    \ code will actually fail, though not because of your assertion (see Figure 12.3).\n\
    \nThis is happening because when inside a test suite, Angular does not allow you\
    \ to make any HTTP call at all. Every call needs to be stubbed out. This is a\
    \ great feature because it ensures you're stubbing out all HTTP features, keeping\
    \ the test suite fast and free of flaky APIs.\n\nWhat you need to do is stub out\
    \ the call to /api/posts and tell it what to return. Modify the `#fetch` describe\
    \ block to include the following code:\n\n```\ndescribe('#fetch', function ()\
    \ {\n  beforeEach(function () {\n    $httpBackend.expect('GET', '/api/posts')\n\
    \      .respond(\n        {username: 'dickeyxxx', body: 'first post'},\n     \
    \   {username: 'dickeyxxx', body: 'second post'}\n      );\n  });\n\n  it('gets\
    \ 2 posts', function () {\n    PostsSvc.fetch().success(function (posts) {\n \
    \     expect(posts).to.have.length(2)\n    })\n  });\n})\n```\n\nYou now have\
    \ a working test for the service. It might seem like a lot of code for just one\
    \ line in the service, but services tend to get tricky, and it's nice to protect\
    \ the controllers from having all this HTTP logic.\n\nAs an exercise, try to implement\
    \ a test for the create() method of PostsSvc as well.\n\n# KARMA CONTROLLER TEST\n\
    \nTesting controllers is similar to testing services. The major difference compared\
    \ to the service test you just wrote is that you'll be injecting mock objects\
    \ into the controller—the posts service. The other difference is that you never\
    \ interact with a controller directly; you interact with the $scope just like\
    \ a template would.\n\nFor reference, here is the controller you will be testing\
    \ against:\n\n```\nangular.module('app')\ncontroller('PostsCtrl', function ($scope,\
    \ PostsSvc) {\n  $scope.addPost = function () {\n    if ($scope.post.body) {\n\
    \      PostsSvc.create({\n        body: $scope.post.body\n      }).success(function\
    \ () {\n        $scope.post.body = null\n      });\n    }\n  });\n```\n\n```\n\
    PostsSvc.fetch().success(function (posts) {\n  $scope.posts = posts\n});\n```\n\
    \n```\n$scope.on('ws:new_post', function (_, post) {\n  $scope.apply(function\
    \ () {\n    $scope.posts.unshift(post)\n  });\n});\n```\n\nYou'll start testing\
