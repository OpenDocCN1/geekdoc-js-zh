  - '[PAGE 99]


    # INTRODUCING TOKEN AUTHENTICATION


    In any application, you need to authenticate the user making the requests to the
    server. There are two ways to do this with an Angular application:


    +   - Cookie-based authentication: This works like a traditional web application.
    You set a session cookie on a login page that will be used by all later requests.
    This method requires building forms on the Node side that are traditional HTTP-generated
    pages.


    +   - Token-based authentication: This method works more like an API. It uses
    a signed token that the client must send on every request.


    For this book, you will be using the token-based approach. The cookie-based approach
    is a bit easier to set up, but it is inflexible. Using tokens, however, you can
    come up with clever ways to authenticate the user and provide a more seamless
    experience. It also eases debugging and troubleshooting since you just need the
    token to interact with the API. It also allows the API to be accessed via a mobile
    app in the same way. It helps with performance since the token is validated using
    an algorithm rather than a database hit on every request.


    The main benefit, though, is that it decouples your client app from your server.
    This makes it easier to understand the login flow in the system as well since
    there are fewer moving parts.


    This chapter is all about Node and Express instrumented through curl. In the next
    chapter, you''ll integrate this authentication into Angular.'
- md: "\n# JWT WEB TOKEN (JWT)\n\nJWT (pronounced \"jot\") is a standard format designed\
    \ for this specific purpose (authenticity). It is simple and could be implemented\
    \ in any programming language even if a library does not exist.\n\nFunctionally,\
    \ in Node, you can use the npm package jwt-simple to create these tokens on the\
    \ server side. You can create a JWT with the encode function like so:\n\n```\n\
    var jwt = require('jwt-simple')\nvar token = jwt.encode({username: 'dickeyxxxx'},\
    \ 'supersecretkey')\n// token is now: eyJ0ZXA1JJKV1Q1JGJc39IjoiUz1NiJ9.\neJ1c1c2YVmFtZS6ImRpRy2tZlh4Ec39.01R5He-k2RyvFZ6_JBOTAg90EeczndumWEgc\n\
    ```\n\nThat contains the object you pass in the first argument to encode and sign\
    \ the second. It's important to understand that JWT does not encrypt that object,\
    \ but only signs it. I'm going to take the rest of this section to explain how\
    \ JWT works under the hood. If this is over your head, that's fine; it's only\
    \ important to understand that JWT signs and not encrypts, not how it works.\n\
    \nAll JWTs are split into three parts separated by periods (.).\nIn this example,\
    \ eyJ0ZXA1JJKV1Q1JGJc39IjoiUz1NiJ9, is a base64 representation of the header.\
    \ If you decode it using www.jwt.io, you get the following data:\n\n```json\n\
    {\"type\":\"JWT\",\"alg\":\"HS256\"}\n```\n\nThis says that the token is a JWT\
    \ and that the algorithm HMAC256 was used to sign the token. There are more headers\
    \ that can be sent to [show] who signed it, when it was signed, when it should\
    \ expire, and more.\n\nThe second section, eyJ1c2YVmFtZS6ImRpRy2tZlh4Ec39, is\
    \ the payload. This is the base64-encoded object you passed in with the first\
    \ argument. If you run this through the decoder, you get the:\n\n```json\n{\"\
    username\":\"dickeyxxxx\"}\n```\n\nNote that you have to use that secret to get\
    \ this data! This means the client, or anyone with a token, can read what is in\
    \ it! It is important to know that you do not store secure data in here, but it\
    \ could also be useful. The client, in this case, can find out the username of\
    \ the current user from the token without having to make an HTTP call.\n\nAlso,\
    \ if you have a service-oriented architecture, this is how you can validate requests\
    \ from any server without having to communicate with a central authentication\
    \ server. Any server with that secret can validate and generate these tokens without\
    \ communicating with each other.\n\nThe last section is the signature. It is not\
    \ base64 encoded. It tells the server that the payload is valid. If you were to\
    \ try to change the payload to match a different user, the signature would no\
    \ longer match, and jwt-simple would immediately reject it. This is where the\
    \ power of JWT comes into play.\n\n# JWT WITH EXPRESS\n\nTo use JWT in an application,\
    \ I will show how to build a small Express server that has two endpoints:\n\n\
    - POST /session: Sending a username/password will return a JWT.\n- GET /user:\
    \ Passing in a JWT token will return the information about the current user.\n\
    \nNote that this is a new, separate app from the social app. In the next chapter\
    \ you will be integrating this method of authentication into your social app.\n\
    \nI'll build this up in a series of steps to show how each part works. First,\
    \ let's just get the server sending and receiving JWT tokens. Install jwt-simple:\n\
    \n```bash\n$ npm install --save jwt-simple\n\nvar express = require('express')\n\
    var jwt = require('jwt-simple')\nvar app = express()\napp.use(require('body-parser').json())\n\
    \nvar secretKey = 'supersecret'\n\napp.post('/session', function (req, res) {\n\
    \  var username = req.body.username\n  // TODO: Validate password\n  var token\
    \ = jwt.encode({username: username}, secretKey)\n  res.json(token)\n})\n\napp.get('/user',\
    \ function (req, res) {\n  var token = req.headers['x-auth']\n  var user = jwt.decode(token,\
    \ secretKey)\n  // TODO: pull user info from database\n  res.json(user)\n})\n\n\
    app.listen(3000)\n```\n\nAnd start it up with:\n\n```bash\n$ nodemon server-auth.js\n\
    ```\n\nIf you hit the server with a POST /session to get a token, like so:\n\n\
    ```bash\n$ curl -X POST -d '{\"username\":\"dickeyxxxx\"}' -H \"Content-Type:\
    \ application/json\" localhost:3000/session\n```\n\nyou get the following JWT:\n\
    \n```\neyJoE0AiJXVWI1IjJKRhbCIjOiJIUZIj1Nij9.e30.FE1hUz2JXT8VQjMj2h7bL8dXuFMXXZJ2HAUY\n\
    ```\n\nThen you pass that token in the X-Auth header to /user:\n\n```bash\n$ curl\
    \ -H \"X-Auth: eyJoE0AiJXVWI1IjJKRhbCIjOiJIUZIj1Nij9.eJ2yC1y2VmFtZ5I6InmRpY2tXl4eC29.0w1RSh-e2k7r94VmVFeZSH_JBOTAg90OecznduMwaEgc\
    \ localhost:3000/user\n```\n\nyou get the token, decrypted, as shown here:\n\n\
    ```json\n{\"username\":\"dickeyxxxx\"}\n```\n\nThe server is now generating and\
    \ decoding tokens for you, but it's not interesting since it's not actually pulling\
    \ data from anywhere. To make this work, first I'll show how to use a static array\
    \ in memory, and then you'll move it over MongoDB.\n\nNote that there is a more\
    \ standard Authorization HTTP header you could use in place of my X-Auth header,\
    \ but that requires you to pass the type in addition to the token. It would look\
    \ like this:\n\nAuthorization: Basic [jwt]\n\nIt is fine to use but requires a\
    \ bit of string splitting and concatenation I find burdensome. It's fine to come\
    \ up with your header types, but you're supposed to add X- to the front.\n\n#\
    \ PASSWORD VALIDATION\n\nIf you had a user array like the following:\n\n```javascript\n\
    [{ username: 'dickeyxxxx', password: 'pass' }]\n```\n\nyou could replace your\
    \ app with the following code (npm install --save lodash first):\n\n```javascript\n\
    var express = require('express')\nvar jwt = require('jwt-simple')\nvar _ = require('lodash')\n\
    var app = express()\napp.use(require('body-parser').json())\n\nvar users = [{username:\
    \ 'dickeyxxx', password: 'pass'}]\nvar secretKey = 'supersecretkey'\n\nfunction\
    \ findByUsername(username) {\n  return _.find(users, {username: username})\n}\n\
    \nfunction validateUser(user, password) {\n  return user.password === password\n\
    }\n\napp.post('/session', function (req, res) {\n  var user = findByUsername(req.body.username)\n\
    \  if (!validateUser(user, req.body.password)) {\n    return res.send(401) //\
    \ Unauthorized\n  }\n  var token = jwt.encode({username: user.username}, secretKey)\n\
    \  res.json(token)\n})\n\napp.get('/user', function (req, res) {\n  var token\
    \ = req.headers['x-auth']\n  var user = jwt.decode(token, secretKey)\n  // TODO:\
    \ pull user info from database\n  res.json(user)\n})\n\napp.listen(3000)\n```\n\
    \n```bash\n$ curl -X POST -d '{\"username\":\"dickeyxxxx\"}' -H \"Content-Type:\
    \ application/json\" localhost:3000/session\n```\n\nyou get the following JWT:\n\
    \n```\neyJoE0AiJXVWI1IjJKRhbCIjOiJIUZIj1Nij9.e30.FE1hUz2JXT8VQjMj2h7bL8dXuFMXXZJ2HAUY\n\
    ```\n\nThen you pass that token in the X-Auth header to /user:\n\n```bash\n$ curl\
