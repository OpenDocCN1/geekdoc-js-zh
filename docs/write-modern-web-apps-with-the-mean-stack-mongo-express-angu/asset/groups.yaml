    FIGURE 2.2 The rise and fall of languages over the years


    # New repositories


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_25_0.png)


    # NODE.JS IN THE ENTERPRISE


    At glance, Node.js appears to be a startup-targeted platform because of its completely
    open source (not backed by a large corporation) scripting nature. Many companies
    have launched products quickly on the platform, making it well suited for product
    validation. That is a remarkable success the platform has been out for only five
    years.


    Node.js is a great platform for startups, but it is even better for enterprise.
    I don''t think Ryan Dahl had it in mind when he built the platform, but it ended
    up being a perfect fit. Netflix, Groupon, LinkedIn, Microsoft, Yahoo!, Walmart,
    and PayPal are some of the enterprises that are using Node.js.


    Yammer (of Microsoft) was one of the first teams to tout it. The company labeled
    itself, fast to develop on, and having a vibrant ecosystem, according to davetech.com/blog/notes-two-years-nodejs-yammer.


    PayPal has been Node.js''s number-one fan in the enterprise. It''s even hosting
    the first Node conference specifically to enterprise (NodeDay). Bill Scott, PayPal''s
    director of user experience, has commented many times on how Node has allowed
    to iterate much on products. PayPal is so fast in development that he teams work
    on four or five different products in tandem and implement the best of the bunch.
    In the Java days, they would put all of their eggs in one basket and it worked
    out.


    Most importantly, enterprise organizations have finally found a platform that
    developers like to work with. Developers are hard to find these days, keeping
    the good ones around involves keeping them happy. JavaScript has an enthusiastic
    community, which has quickly grown into the largest open source community by far.
    Figure 2.2 shows a graph of how popular different languages have been over the
    years.


    You can find a list of companies using Node.js here: https://github.com/joyent/node/wiki/Projects,-Applications,-and-Companies-Using-Node.'
  - '[PAGE 26]


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_26_0.png)


    # PERFORMANCE IN NODE.JS


    Performance has been astounding on Node.js. Walmart reported that it was able
    to double the number of requests per second and reduce response time by 35 percent,
    or 200ms. Walmart was so confident in its platform that it released it on Black
    Friday, its busiest day of the year, to the entire mobile platform. Once it online,
    Walmart claimed the servers never passed 2 percent CPU utilization and had 200
    million users online (see Figure 2.3).


    Walmart made the decision to move its entire platform to Node.js by the end of
    2014. See http://thechangelog.com/116/


    The reason Node.js is so fast is because of its architecture. Rather than going
    for a thread-model popular in compiled languages or a process driven by one common
    in scripting languages, Node.js chooses event architecture.


    # EVENTED ARCHITECTURE


    There are different ways to handle "concurrency" in software. The essential idea
    of concurrency is to allow multiple things to happen at the same time. This is
    common on servers since more than one user will typically be accessing the server
    at the same time. Platforms like Java will spawn a new thread on each connection.
    Threading is expensive, costing about 4MB of memory for each and limiting the
    number of threads that can be running at once. A 4GB server, this would be about
    400 concurrent connections. It''s also difficult to develop platforms that are
    thread-safe allowing for that functionality.


    Because of complexity, languages such as Ruby, Python, and PHP do not have threads
    (at least not that allow for real concurrency without running custom binaries).
    JavaScript also has a single-threaded, but it is able to run multiple code paths
    in parallel because of events.'
  - "[PAGE 27]\n\nRyan Dahl, Node js's creator, wanted a platform that was able to\
    \ handle heavy amounts of I/O to build applications similar to Gmail where HTTP\
    \ requests might have to sit around for long periods of time. Scripting languages\
    \ are completely incapable of blocking the entire process when a web request arrives.\
    \ Threaded systems can handle this to a point, but threads are still expensive.\n\
    \nJavaScript was designed to work within the confines of the browser. The most\
    \ restrictive part of that was having a single thread and single process for the\
    \ whole page. This meant that synchronous blocking in code would lock up a web\
    \ page from all actions. JavaScript was built in this manner. It is expressive\
    \ when it comes to asynchronous code.\n\nThis style of handling I/O has worked\
    \ well in the browser and is why Dahl chose to build Node.js. As such, it can\
    \ handle millions of concurrent requests in\n\nLibraries that handle concurrency\
    \ using events have been written in many other languages, such as Python's Threads,\
    \ Ruby's EventMachine, Akka for Java, and others. The difference here is JavaScript's\
    \ syntax already assumes events through callbacks.\n\nRunning an application through\
    \ a single thread is not a silver bullet, however. If you end up performing CPU-intensive\
    \ (as opposed to I/O-intensive) work, the thread will be tied up, and everything\
    \ will be blocked waiting for it to finish. Also, developers need to ensure that\
    \ you do not allow errors to bubble up to the process, which would abort all connections.\n\
    \n# HOW CALLBACKS WORK\n\nIf you're new to this concept, basically the difference\
    \ is that in most languages you'll ask the computer to do some I/O (database call,\
    \ HTTP call, and so on) and then wait until it returns to continue your code path.\
    \ Something like the following:\n\n```\nuser = User.findById(100)\n// Do something\
    \ with user\n```\n\nThis code will query the database for ID 100. It will pause\
    \ thread/process until the database comes back (which is relatively slow).\n\n\
    In JavaScript, this kind of code is rarely implemented. Typically what you'll\
    \ do is pass an I/O call a \"callback\" that will need to run when the task is\
    \ completed. It would look like this:\n\n```\nUser.findById(100, function(user)\
    \ {\n  // Do something with user\n});\n```"
- md: "\nThe difference might seem subtle, but the important thing here is that while\
    \ the database is fetching the result, that thread is free to do whatever might\
    \ be useful (take on another web request, listen to a different event, and so\
    \ on).\n\nA language like Ruby or Python would be stopped at this point. This\
    \ is why you hear such good benchmarks about how scalable Node.js platforms are.\n\
    \nIt's important to note that this doesn't make Node.js great for all use cases,\
    \ just those with heavy I/O. It turns out that on the Web, that's usually what\
    \ we're doing (transmitting via HTTP or waiting on a database).\n\n# MODULES AND\
    \ NPM\n\nIn addition to callbacks, the other part of Node.js that everyone loves\
    \ is the modules and packages available on NPM. The modules that Node.js has are\
    \ really simple. Node.js uses a specification known as CommonJS.\n\nCommonJS was\
    \ developed as a way to declare external modules in JavaScript applications on\
    \ the server. The general idea is that every file gets a `module.exports` object\
    \ it can use to expose an object to others. If you had a file foo.js, you could\
    \ expose a function like so:\n\n```\nvar myFunc = function(input) {\n  return\
    \ input + ' world';\n}\n\nmodule.exports.foo = myFunc;\n```\n\nIn a file bar.js,\
    \ you could import that module like so:\n\n```\nvar imported = require('./foo');\n\
    console.log(imported.foo('hello'));\n// prints 'hello world'\n```\n\nOn the Web,\
    \ sharing code in JavaScript has always been a pain. Global variables are a common\
    \ way to share code and are susceptible to conflict problems. This CommonJS spec\
    \ is amazing because of its simplicity. Since dependencies are declared at runtime\
    \ via the path, it's easy to diagnose dependency problems. This avoids dependency\
    \ hell.\n\nHaving that, I know when I started using Node.js I didn't really 'get\
    \ it'. It was simpler than I made it out to be. If you feel the same, don't worry;\
    \ write a few code samples and modules develop the road and you'll be feeling\
    \ right at home.\n\nNode.js's other friend is NPM, which is the official package\
    \ manager for Node.js and is now included in all Node.js installs.\n\nIf you've\
    \ used Python's pip, Ruby's Bundler, or Java's Maven, it's similar to them. The\
    \ nice thing about Node.js is that it's so new, it was able to take the best bits\
    \ of all of them.\n\nInstalling a package is easy. If you wanted to install, say,\
    \ the mkdirp package that lets you create directories, you'd simply run the following:\n\
    \n```\nnpm install mkdirp\n```\n\nThen you can use mkdirp like so:\n\n```\nvar\
    \ mkdirp = require('mkdirp');\n\nmkdirp('/tmp/foo/bar/baz', function (err) {\n\
    \  if (err) console.error(err)\n  else console.log('pow!');\n});\n```\n\nI encourage\
    \ you to read the \"Introduction to NPM\" at http://howtonode.org/introduction-to-npm\
    \ to understand why NPM is made the way it is for a better understanding of its\
    \ philosophy.\n\n# INSTALLING NODE.JS\n\nInstalling Node.js typically involves\
    \ two parts: installing a base copy of Node.js and then installing a version switcher\
    \ to choose the version of Node.js you want to use.\n\nThe reason for the switcher\
    \ is that Node.js changes frequently. It's likely the version you get initially\
    \ will not be the latest. Also, once you get a couple of projects under your belt,\
    \ you might have different projects that need different versions.\n\nFollow these\
    \ steps to get up with Node.js for the project in this book:\n\n- 1. To install\
    \ the base version, use your package manager of choice.\n   - For OS X with Homebrew\
    \ (http://brew.sh), run brew install npm.\n   - For Windows, visit http://nodejs.org/download.\n\
    \   - For Ubuntu 13+, run sudo apt-get install npm.\n   - For others, visit https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager.\n\
    \n- 2. Once you have the base version of Node.js installed, install the version\
    \ switcher by typing npm install -g n. The g here denotes that you are installing\
    \ the package globally. Otherwise, it would just install it into this directory\
    \ and you couldn't just run from anywhere.\n\nTo install and use the latest stable\
    \ version of Node.js, use n stable. For more details on how to use n, see https://www.npmjs.org/package/n.\n\
    \nNow that you have Node.js installed, let's build a web server with it.\n\n#\
    \ CREATING A VANILLA HTTP SERVER\n\nNode.js has an HTTP module built in that can\
    \ act as a server. A simple \"Hello World\" server would look like this in straight\
    \ Node:\n\n```\nvar http = require(\"http\");\nhttp.createServer(function(request,\
    \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    \  response.write(\"Hello world\");\n  response.end();\n}).listen(3000);\n```\n\
    \nYou'll need a server for the project in this book, so follow these steps:\n\n\
    - 1. Create the previous file anywhere and call it app.js.\nThis responds to any\
    \ route the web server receives. If you wanted to respond to others, you'd have\
    \ to implement some kind of conditional on the request object.\n\n- 2. Run the\
    \ server by executing node app.js in a terminal. You won't see any output, but\
    \ going to http://localhost:3000 in your browser should display \"Hello World.\"\
    .\n\nWhile exploring the code, pay attention to the createServer function. This\
    \ is calling the function createServer on the HTTP module, passing in a new, anonymous\
    \ function.\n\nThe code inside that function is not executed right away but when\
    \ the web server receives a new request. This is one of those callbacks discussed\
    \ earlier in action. Node doesn't block at any part of code; it just stores the\
    \ function for the use later when a request comes in.\n\nYou could totally build\
    \ an application like this, but the NPM package Express provides some nicer structure\
    \ to common HTTP code. It's a lightweight web server (akin to Sinatra in Ruby,\
    \ but even more low level).\n\n# WHAT IS EXPRESS?\n\nExpress is an NPM package\
    \ for building web servers. It's by far the most common package used for building\
    \ web applications with Node.js.\n\nIn Express, the same code for the web server\
    \ would look like the following:\n\n```\nvar express = require('express');\nvar\
    \ app = express();\n\napp.get('/', function(req, res) {\n  res.send(200, 'Hello\
    \ World');\n});\n\napp.listen(8888);\n```\n\n# INSTALLING EXPRESS\n\nFollow these\
    \ steps to install Express:\n\n- 1. Go ahead and put the previous code into a\
    \ file called app-express.js.\n- 2. Install Express into the directory by running\
    \ npm install express.js. You should then be able to access it at http://localhost:8888\
    \ just like before.\n- 3. Run the code simply by executing node app-express.js.\n\
    \nAs you can see, Express doesn't do much more than you could do in straight Node.\
    \ It does, however, provide cleaner structure for the code. There's also a beautifully\
    \ simple middleware implementation for things such as logging and authentication\
    \ and authorization. For apps, it also has simple tools to serialize/deserialize\
    \ JSON.\n\nThat's all about it—it's a simple web framework that leaves most of\
    \ the implementation up to you to decide.\n\n# DATABASES FOR NODE.JS\n\nSince\
    \ Node.js is written in JavaScript, it supports JSON in a very clean way. Manipulating\
    \ JSON data is easy, which is great because that's what clients typically use.\n\
    \nOn the back end, SQL databases are not a great fit for Node.js. Object-relational\
    \ mappers (ORMs), which are the tools that connect your code to a relational database,\
    \ are common to see Node.js applications that have a solid ORM. Having said that,\
    \ it's common to see Node.js as a layer to an MVC web server.\n\nSince Node.js\
