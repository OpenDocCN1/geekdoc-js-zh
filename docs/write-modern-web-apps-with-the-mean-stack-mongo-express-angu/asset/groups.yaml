    # Write Modern Web Apps with the MEAN Stack


    Mongo, Express, AngularJS, and Node.js


    TRADITIONALLY, WEB APPLICATIONS HAVE all the front-end architected so that the
    back-end houses the front code. This has resulted in heavy projects that are difficult
    to manage and scale. In this forward-looking guide, web developer and author Jeff
    Dickey explores a new way to write web applications by building thick clients
    that do the heavy lifting.


    This book looks at how to use the MEAN (Mongo, Express, AngularJS, and Node.js)
    stack to create modern web applications, from installing and setting the tools
    to debug and deploying your app. After an introduction to how web development
    is changing and the advantages of using the MEAN stack, the author introduces
    each tool and then dives into using the complete JavaScript-based application
    stack to build, test, and deploy apps.


