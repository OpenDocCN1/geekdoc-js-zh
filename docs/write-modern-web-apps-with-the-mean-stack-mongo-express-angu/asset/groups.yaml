    This application is also easily extensible. I encourage you while reading this
    book to take the time to not only implement the application as I have done to
    build features of your own. It''s relatively easy to follow along and build the
    same application, but you know that it might not how software is actually written.


    Learning a new skill is tough. As a teacher, I have witnessed many people learning
    some for the first time and been able to witness their progress. One facet of
    that I''ve noticed is that learning doesn''t feel like anything. You can''t tell
    whether you''re learning something when you''re learning—in fact, learning feels
    a lot more like frustration.


    What I''ve learned is during this period of frustration is actually when people
    improve the most, and their improvements are obviously obvious to an outsider.
    If you feel frustrated while trying to understand these new concepts, try to remember
    that it might not feel like it, but you''re probably expanding your knowledge.


    With that, join me in Chapter 1 while you learn a bit about the history of the
    Web''s surprising relationship with JavaScript, how it''s changed the way we think
    of applications, and where the MEAN stack fits in.


    # CHAPTER 1


    # How Modern Web Architecture Is Changing


    In this chapter, I''ll cover how web applications were developed in the past,
    examine how JavaScript has evolved, and talk about the new approach web developers
    are taking toward architecture.


    # THE RISE OF THE STATIC APP


    Web applications for about the last 10 years have looked similar. They typically
    follow a three-tier architecture consisting of a database, a server that generates
    HTML, and a browser that renders the HTML.


    To deliver a dynamic application, traditional applications follow this process:


    1. The user''s browser sends a request to a web URL. To make this happen, the
    user either clicks an anchor <a> tag or types in a URL.

    2. The server receives the request and then fetches data from a database to fulfill
    it.

    3. The server uses the data to generate an HTML response and returns the response
    to the browser.


    Whether you''re talking about applications developed in Java, Ruby, Python, C#,
    or any other back-end language, this is how applications are served. Some applications
    be more efficient when performing these tasks, but all applications perform all
    steps.


    # AJAX-EMPOWERED JAVASCRIPT


