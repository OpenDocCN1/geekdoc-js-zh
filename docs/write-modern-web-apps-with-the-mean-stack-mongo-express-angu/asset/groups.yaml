    \ HTTP 逻辑的影响是件好事。\n\n作为一个练习，请尝试也为 PostsSvc 的 `create()` 方法实现一个测试。\n\n# KARMA 控制器测试\n\
    \n测试控制器与测试服务类似。与你刚刚编写的服务测试相比，主要区别在于你将向控制器（帖子服务）注入 mock 对象。另一个区别在于你从不直接与控制器交互；你像模板一样与\
    \ `$scope` 交互。\n\n作为参考，这里是你你将要测试的控制器：\n\n```\nangular.module('app')\ncontroller('PostsCtrl',\
    \ function ($scope, PostsSvc) {\n  $scope.addPost = function () {\n    if ($scope.post.body)\
