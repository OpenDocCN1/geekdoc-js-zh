    # THE RISE OF THE STATIC APP


    Web applications for about the last 10 years have looked similar. They typically
    follow a three-tier architecture consisting of a database, a server that generates
    HTML, and a browser that renders the HTML.


    To deliver a dynamic application, traditional applications follow this process:


    +   1. The user''s browser sends a request to a web URL. To make this happen,
    the user either clicks an anchor <a> tag or types in a URL.

    2. The server receives the request and then fetches data from a database to fulfill
    it.

    3. The server uses the data to generate an HTML response and returns the response
    to the browser.


    Whether you''re talking about applications developed in Java, Ruby, Python, C#,
    or any other back-end language, this is how applications are served. Some applications
    be more efficient when performing these tasks, but all applications perform all
    three steps.


    # AJAX-EMPOWERED JAVASCRIPT


