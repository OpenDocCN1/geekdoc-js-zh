    \ entirety:\n\n```javascript\ndescribe('posts.ctrl', function () {\n  beforeEach(module('app'))\n\
    \  var $scope\n\n  var mockPostsSvc = {\n    beforeEach(inject(function ($q) {\n\
    \      mockPostsSvc.fetch = function () {\n        var deferred = $q.defer()\n\
    \        deferred.resolve([\n          {username: 'dickeyxxx', body: 'first post'},\n\
    \          {username: 'dickeyxxx', body: 'second post'}\n        ])\n        return\
    \ deferred.promise\n      })\n    }))\n\n  }\n\n  beforeEach(inject(function ($rootScope,\
    \ $controller) {\n    $scope = $rootScope.$new()\n    $controller('PostsCtrl',\
    \ {\n      $scope: $scope,\n      PostsSvc: mockPostsSvc\n    })\n  }))\n\n  it('loads\
    \ posts from the service', function () {\n    $scope.$digest()\n    expect($scope.posts).to.have.length(2)\n\
    \  })\n})\n```\n\n# TESTING SPIES\n\nIn the tests you've built so far, you've\
    \ simply been checking whether data has been populated. Sometimes, though, you\
    \ need to check whether functions were called. Spies are a useful tool for this\
    \ task. A spy wraps an existing function and can tell you whether anything has\
    \ called it and with what arguments. The most popular tool for spies in JavaScript\
    \ is Sinon, and Sinon integrates very well with Mocha and Chai.\n\nFirst install\
    \ the karma-sinon-chai plugin in:\n\n```bash\n$ npm install --save-dev karma-sinon-chai\n\
    ```\n\nThen add it to karma.conf.js frameworks:\n```javascript\nframeworks: ['mocha',\
    \ 'chai', 'sinon-chai']\n```\n\nThe example test you'll be looking at is making\
    \ a post in the PostsSvc. First let's create a test case for new posts in test/ng/posts.ctrl.spec.\n\
    \n```javascript\nit('sends a new post to the service', function () {\n  scope.post\
    \ = {body: 'my new post'}\n  scope.addPost()\n})\n```\n\nYou get a simple error\
    \ in this case that there is no function create on the PostsSvc. This is happening\
    \ because you're using a mock object that you never created that method for. In\
    \ the before filter, where you added the fetch method, add the create method as\
    \ well:\n\n```javascript\nvar mockPostsSvc = {};\nbeforeEach(inject(function ($q)\
    \ {\n  mockPostsSvc.fetch = function () {\n    var deferred = $q.defer();\n  \
    \  deferred.resolve([\n      {username: 'dickeyxxx', body: 'first post'},\n  \
    \    {username: 'dickeyxxx', body: 'second post'}\n    ]);\n    return deferred.promise\n\
    \  }\n  mockPostsSvc.create = function () {\n    var deferred = $q.defer();\n\
    \    deferred.resolve()\n    return deferred.promise\n  }\n}))\n```\n\nIt doesn't\
    \ matter that you're not doing anything with in or returning data in the stubbed\
    \ create function since a spy will do that for you.\n\nNow update the test case\
    \ to wrap the create method in a spy; then check to see whether the spy was called\
    \ with the correct arguments:\n\n```javascript\nit('sends a new post to the service',\
    \ function () {\n  sinon.spy(mockPostsSvc, 'create')\n  $scope.post = {body: 'my\
    \ new post'}\n  $scope.addPost()\n  expect(mockPostsSvc.create).to.have.been.calledWith({body:\
    \ 'my new post'})\n})\n```\n\nThis test should now be passing.\n\nSinon has much\
    \ more advanced functionality when it comes to seeing how many times something\
    \ was called, stubbing the results out of a function, mocking time, and more.\n\
