  - "[PAGE 68]\n\n# # FIXING THE POST ORDERING\n\nFixing the posts to be in reverse\
    \ chronological order could be done either in the Node server or in Angular (better\
    \ yet, both). To do it in Angular, you simply add an orderBy predicate to the\
    \ ng-repeat directive in /layouts/posts.html:\n\n```\n<li ng-repeat=\"post in\
    \ posts | orderBy:'-date' class=\"list-group-item\">\n```\n\nAngular will now\
    \ correctly order the posts by the date you added to your Mongoose schema. Note\
    \ aside from adding it to the model schema, you didn't have to write any code\
    \ to support dates. This demonstrates the power of using a MEAN stack. You can\
    \ just add something to MongoDB, and it will cascade all the way to the client.\n\
    \nAlternatively, you can also sort this out in Node. This is a good idea to do\
    \ it if you wanted to add pagination to your API. You would want to make sure\
    \ the first page of the response contained the newest posts. You won't be building\
    \ the pagination just yet, but here is how you can edit server.js to serve the\
    \ posts in reverse chronological order:\n\n```\napp.get('/api/posts', function\
    \ (req, res, next) {\n  Post.sort('-date')\n  .exec(function(err, posts) {\n \
    \   if (err) { return next(err) }\n    res.json(posts)\n  })\n})\n```\n\nMongoose\
    \ allows you to keep chaining the query with various methods like this. This could\
    \ be useful for filtering out posts, for example."
  - "[PAGE 69]\n\n# CLEANING SERVER.JS\n\nNow that your app is a little more fleshed\
    \ out, the server.js file has started to reach into too many things (setting up\
    \ the server and adding the middleware, all of the API endpoints, and the bit\
    \ that delivers the layout file). When building JavaScript applications, there\
    \ is a lot of flexibility you can get in how to structure the codebase. It's best\
    \ to start simple with few files so you can quickly iterate on them. When files\
    \ start to get large, comes a time when you'll want to break them out.\n\nHere\
    \ is the current server.js file:\n\n```\nvar express = require('express')\nvar\
    \ bodyParser = require('body-parser')\nvar Post = require('./models/post')\n```\n\
    \n```\nvar app = express()\napp.use(bodyParser.json())\n```\n\n```\napp.get('/api/posts',\
    \ function(req, res, next) {\nPost.find(\n  .sort('-date')\n  .exec(function(err,\
    \ posts) {\n    if (err) { return next(err) }\n    res.json(posts)\n  })\n})\n\
    ```\n\n```\napp.post('/api/posts', function(req, res, next) {\nvar post = new\
