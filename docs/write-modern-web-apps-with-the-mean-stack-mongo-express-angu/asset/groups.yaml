    \ 调用。每个调用都需要被存桩（stubbed）。这是一个非常棒的功能，因为它确保了你存桩了所有的 HTTP 功能，使测试套件快速且不受不稳定 API 的影响。\n\
    \n你需要做的是对 /api/posts 的调用进行存桩，并告诉它返回什么。修改 `#fetch` describe 块以包含以下代码：\n\n```\n\
