  - '[PAGE 213]


    # PLATFORM-AS-A-SERVICE


    Heroku is a platform-as-a-service (PaaS). There are three major PaaS available
    for deploying Node.js applications: Heroku, Nodejitsu, and Modulus. Enabling your
    application to work on a PaaS is a similar process between all these services.
    I''ll focus on Heroku because its currently the most popular PaaS and supports
    many heavily trafficked Node.js applications.


    A PaaS is a service that abstracts specific servers in favor of deploying applications.
    Deploying an application to a PaaS is much easier than configuring individual
    servers to host applications.


    The downside of PaaS is that they usually have limitations on what you can do
    with your application. For example, most PaaS don''t allow you to interact with
    the local filesystem for anything other than temporary storage.


    Usually these limitations are in place to prevent the developer from making bad
    architectural decisions. Working with a PaaS from the beginning will usually force
    the developer to adopt solid architecture patterns, and as such, migrating a way
    from a PaaS to a server-based setup is not difficult.


    The other downside of a PaaS is that they are more expensive per compute unit.
    In my experience, however, I''ve found PaaS-deployed applications to be cheaper
    than those deployed on servers because server-based setups are usually way overprovisioned—due
    to risk in spinning down unused resources as well as simple laziness. There isn''t
    a lot of motivation for developers on a team to keep track of operation cost when
    they aren''t the ones footing the bill. In contrast, PaaS allow the operations
    team to fine-tune the resources, ultimately making the PaaS setup cheaper.


    The main advantage of a PaaS over servers is that developers will spend less time
    configuring the application for production and be able to spend more time working
    on the application itself.'
  - '[PAGE 214]


    ![](img/a45e866f1e25bfccba9780b8e48fa81d_214_0.png)


    Essentially Heroku provides a service to allow you to host UNIX processes (such
    as a Node process). Once you have deployed, you can add more to the system simply
    by using a slider in the admin interface. Figure 13.1 shows an example of the
    interface from my blog (a MEAN application).


    As you can see, the dynos are currently set at 1 (being the free tier). Moving
    that slider would provision more processes if needed to scale up the system.


    Heroku also provides add-services from third-party providers. For this project
    I''m using MongoLab as a MongoDB provider, NewRelic for performance monitoring,
    and Redis To Go as my Redis provider. These are all free add-ons, but if I wanted
    to get more performance out of, I could upgrade the add-on and be charged via
    my Heroku account.


    Having centralized billing for add-ons helps when running multiple environments
    inside an organization.'
  - '[PAGE 215]


    # TWELVE-FACTOR APPS


    Heroku coined the term 12-factor as a methodology for building applications. Following
    these patterns leads to portability with an application, allowing the application
    to easily be deployed to multiple environments on different providers and to have
    development-production parity. It''s a set of techniques that leads to applications
    that are easy to develop, deploy, test, and scale up.


    Heroku applications require following the 12-factor methodology, but it''s a great
    set of techniques useful for applications of any size.

    Here are the 12 factors:


    +   1. **Codebase**: One codebase tracked in version control; many deploys.

    2. **Dependencies**: Explicitly declare and isolate dependencies.

    3. **Config**: Store config in the environment.

    4. **Backing services**: Treat backing services as attached resources.

    5. **Build, release, run**: Strictly separate build and run stages.

    6. **Processes**: Execute the app as one or more stateless processes.

    7. **Port binding**: Export services via port binding.

    8. **Concurrency**: Scale out via the process model.

    9. **Disposability**: Maximize robustness with fast startup and graceful shutdown.

    10. **Dev/prod parity**: Keep development, staging, and production as similar
    as possible.

    11. **Logs**: Treat logs as event streams.

    12. **Admin processes**: Run admin/management tasks as one-off processes.


    In my opinion, the real groundbreaking—as well as potentially the least familiar—is
    3: config. Having configuration set solely in environment variables allows a developer
    to change back-end services behind an application simply by editing environment
    variables—without requiring a deploy.

    It also allows private keys to not be checked into codebase.

    As you deploy our application on Heroku, you will see how these environment variables
    allow you to quickly make your application production-ready. You can also learn
    much more about the 12-factor methodology at http://12factor.net.'
- md: "\n## DEPLOYING AN APPLICATION TO HEROKU\n\nYou'll deploy our social app to\
    \ Heroku. To get started, first create a Heroku account at Heroku.com and install\
    \ the tool belt (instructions will be provided after signing up).\n\nOnce that's\
    \ complete, go to your application in the terminal. If you haven't turned your\
    \ project into a Git repo yet, you'll need to do that now. The only way to get\
    \ code on Heroku is by Git, so even if you're using a different source control\
    \ tool, you'll still have to Integrate Git to use Heroku.\n\nIf at any point during\
    \ this process you trouble getting the application to work and are seeing errors\
    \ other than those described, clone my example repo at https://github.com/dickeyxxs/mean-sample.\
    \ That repository will be Heroku-ready.\n\nTurn your project into a Git repo,\
    \ go to the root of the application, initialize a repo and commit all the files\
    \ to it. Skip this step if you already have the project in Git.\n\n```\n$ git\
    \ init\n```\n\nIf you're using your code, before you make your initial commit,\
    \ you'll want to create a .gitignore file and add the following:\n\n```\nnode_modules\n\
    assets\n```\n\nThe Node modules will be taken care of by Heroku, as well the assets\
    \ (see the \"Compiling Assets\" section). With that finished, commit all the files:\n\
    \n```\n$ git commit -am \"init\"\n```\n\nNow that the project is in a Git repo,\
    \ run the heroku create command. This will add a git remote automatically that\
    \ you can use to deploy the application.\n\n```\n$ heroku create\n```\n\nCreating\
    \ dry-sands-8759... done, stack is cedar\nhttp://dry-sands-8759.herokuapp.com/\
    \ | git@heroku.com:dry-sands-8759.git\nGit remote heroku added\n\nHeroku will\
    \ automatically give your project name; in my case, that is dry-sands-8759. These\
    \ names are autogenerated, so yours will be different.\n\nYou can check to whether\
    \ the Git remote was added correctly by listing the remotes:\n\n```\n$ git remote\
    \ -v\n```\n\n```\nheroku git@heroku.com:dry-sands-8759.git (fetch)\nheroku git@heroku.com:dry-sands-8759.git\
    \ (push)\n```\n\n# Figure 13.2 A Heroku error page\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_217_0.png)\n\
    \nThis is just done to ensure that the tool belt created the remote successfully.\
    \ If it did, you can now attempt a deploy by pushing to it:\n\n$ git push heroku\
    \ master\n\nYou will now see Heroku attempt to compile a slug (a compressed, packaged\
    \ copy of the application) out of the code you pushed up. It will also run npm\
    \ install to install all of your dependencies, which is why we didn't commit the\
    \ node_modules folder (it also keeps your repository small).\n\nIf it builds and\
    \ deploys the application successfully, you'll see a message at the end saying\
    \ \"Deployed to Heroku.\" Now heroku open to open the app in your browser.\n\n\
    It's likely on the first push you will get an error message like the one shown\
    \ in Figure 13.2. You can't tell what is wrong from this error page, so you need\
    \ to look at the logs. From the terminal, type heroku logs to print out the most\
    \ recent logs.\n\nIt might be hard to see, the error I received (and likely you\
    \ as well) is because Heroku is trying to connect to a nonexistent MongoDB instance\
    \ on localhost.\n\nError: failed to connect to [localhost:27017]\n\n# MongoDB\
    \ ON HEROKU\n\nThe application requires a connection to MongoDB, so let's add\
    \ a MongoDB add-on and see whether you can get past this error. Typically deploying\
    \ an application involves this process of seeing an error, fixing it, and then\
    \ moving on to the next one.\n\nInstall MongoDBLab (alternatively you could also\
    \ install the MongoDBHQ add-on and the process would be similar). Note that you\
    \ will need to verify your Heroku account (add credit card information to it)\
    \ before this will work. The add-on is free; requiring a credit card helps prevent\
    \ abuse of the free resources.\n\n$ heroku addons:add mongolab\n\nHeroku provides\
    \ the connection information to the application via environment variables. You\
    \ can see all the environment variables either in the dashboard or with the tool\
    \ belt:\n\n$ heroku config\n\nThis will show the MONGODB_URI environment variable\
    \ and its value. You need to modify your application to check for that MONGODB_URI\
    \ environment variable and use it if it exists.\nModify db.js to look like the\
    \ following:\n\n```\nvar mongoose = require('mongoose')\nvar url = process.env.MONGODB_URI\
    \ || 'mongodb://localhost/social'\nmongoose.connect(url)\nmodule.exports = mongoose\n\
    ```\n\nThis is a common pattern with Heroku applications. Your app will first\
    \ check an environment variable for a configuration option, and if it doesn't\
    \ find it, default to a local development setting. This allows you to deploy your\
    \ application in different environments without any code changes. It also allows\
    \ you to change services simply by modifying environment variables and not requiring\
    \ a full deploy.\n\n# REDIS ON HEROKU\n\nThis section assumes you have implemented\
    \ the Redis pubsub code from Chapter 9. If you have not done so, feel free to\
    \ skip or use the sample code at https://github.com/dickeyxxx/mean-sample for\
    \ reference.\n\nDeploying the app again still results in an error message. If\
    \ you look in the logs, however, you'll see a different error message.\n\nError:\
    \ Redis connection to localhost:6379 failed - connect ECONNREFUSED\n\nRedis is\
    \ attempting to connect to a Redis server and failing just like it did with MongoDB.\
    \ Adding Redis is just as simple. There are a few providers, but Redis To Go is\
    \ probably the easiest to set up.\n\n```\n$ heroku addons:add redistogo\n```\n\
    \nRunning heroku config again will now show you that Redis To Go put the server\
    \ URL in the REDISTOGOGO_URL environment variable.\n\n```\nREDISTOGOGO_URL: redis://redistogo:xxx@hoki.redistogo.com:10062/\n\
    ```\n\nInside pubsub.js, you have been using the default Redis client. This client\
    \ unfortunately doesn't natively accept URLs for configuration like the MongoDB\
    \ client does. You need to alter the code to parse the URL with Node's built-in\
    \ url module.\n\n```\nvar redis = require('redis')\nvar url = process.env.REDISTOGOGO_URL\
    \ || 'redis://localhost:6379'\nvar host = require('url').parse(url)\n\nfunction\
    \ newClient() {\n  var client = redis.createClient(host)\n  if (host.password)\
    \ {\n    client.auth(host.password)\n  }\n  return client\n}\n\nexports.publish\
    \ = function (topic, data) {\n  client.publish(topic, JSON.stringify(data))\n\
    }\n\nexports.subscribe = function (topic, cb) {\n  var client = newClient()\n\
    \  client.subscribe(topic)\n  client.on('message', function (channel, message)\
    \ {\n    cb(JSON.parse(message))\n  })\n}\n```\n"
  mdcn: "\n\n## 将应用程序部署到 Heroku\n\n你将把我们的社交应用部署到 Heroku。开始开始，请先在 Heroku.com 创建一个 Heroku\
    \ 账户并安装工具包（tool belt）（注册后将提供说明）。\n\n完成后，在终端中进入你的应用程序目录。如果你还没有将项目转换为 Git 仓库，你现在需要这样做。在\
    \ Heroku 上获取代码的唯一方法是通过 Git，因此即使你正在使用不同的版本控制工具，也必须集成 Git 来使用 Heroku。\n\n如果在在此过程的任何时候，你在运行应用程序方面遇到困难，并且看到了除了描述之外的错误，请克隆我的\
    \ https://github.com/dickeyxxs/mean-sample 示例仓库。该仓库是准备好供 Heroku 使用的。\n\n将你的项目转换为\
    \ Git 仓库，进入应用程序根目录，初始化仓库并将所有文件提交到仓库中。如果你已经在 Git 中有了该项目，请跳过此步骤。\n\n```\n$ git init\n\
    ```\n\n如果你在使用自己的代码，在进行初始提交之前，你可能想创建一个 `.gitignore` 文件并添加以下内容：\n\n```\nnode_modules\n\
    assets\n```\n\nNode 模块将由 Heroku 处理，资产也是如此（参见“编译资产”部分）。完成后，提交所有文件：\n\n```\n$ git\
    \ commit -am \"init\"\n```\n\n现在项目已经在 Git 仓库中了，运行 `heroku create` 命令。这将自动添加一个\
    \ git 远程仓库，你可以用它来部署应用程序。\n\n```\n$ heroku create\n```\n\nCreating dry-sands-8759...\
    \ done, stack is cedar\nhttp://dry-sands-8759.herokuapp.com/ | git@heroku.com:dry-sands-8759.git\n\
    Git remote heroku added\n\nHeroku 会自动为你的项目命名；在我的情况下，名字是 `dry-sands-8759`。这些名称是自动生成的，所以你的名称会有所不同。\n\
    \n你可以通过列出远程仓库来检查 Git 远程仓库是否正确添加：\n\n```\n$ git remote -v\n```\n\n```\nheroku git@heroku.com:dry-sands-8759.git\
    \ (fetch)\nheroku git@heroku.com:dry-sands-8759.git (push)\n```\n\n# 图 13.2 一个\
    \ Heroku 错误页\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_217_0.png)\n\n这样做仅仅是为了确保工具包成功创建了远程仓库。如果成功了，你现在可以尝试向它推送代码来部署：\n\
    \n$ git push heroku master\n\n你现在将看到 Heroku 尝试从你推送的代码中编译出一个 slug（应用程序的压缩包副本）。它还会运行\
    \ `npm install` 来安装你所有的项，这就是为什么我们没有提交 `node_modules` 文件夹的原因（这也能保持你的仓库很小）。\n\n\
    如果成功构建并部署了应用程序，你会在结尾看到一条显示“Deployed to Heroku”的消息。现在运行 `heroku open` 在浏览器中打开该应用。\n\
    \n在第一次推送时，你可能会收到类似图 13.2 所示的错误信息。你无法从此错误页面判断哪里错了，因此你需要查看日志。在终端中输入 `heroku logs`\
    \ 来打印出最近的日志。\n\n我收到的错误可能很难看清（可能你也是如此），是因为 Heroku 正在尝试连接本地上不存在的 MongoDB 实例。\n\n\
    Error: failed to connect to [localhost:27017]\n\n# HEROKU上的 MongoDB\n\n应用程序需要连接\
    \ MongoDB，所以让我们添加一个 MongoDB 插件（add-on），看看你是否能通过这个错误。通常，部署应用程序涉及这种看到错误、修复它、然后移动到下一个错误的过程。\n\
    \n安装 MongoDBLab（你也可以安装 MongoDBHQ 插件，过程也类似）。注意，在这些功能生效之前，你需要验证你的 Heroku 账户（添加信用卡信息）。该插件是免费的；要求提供信用卡有助于防止免费资源被滥用。\n\
    \n$ heroku addons:add mongolab\n\nHeroku 通过环境变量为应用程序提供连接信息。你可以在仪表板中，也可以通过工具包查看所有的环境变量：\n\
    \n$ heroku config\n\n这将显示 `MONGODB_URI` 环境变量及其值。你需要修改你的应用程序来检查是否存在该 `MONGODB_URI`\
    \ 环境变量，并在它存在时使用它。\n修改 `db.js` 使其看起来如下所示：\n\n```\nvar mongoose = require('mongoose')\n\
    var url = process.env.MONGODB_URI || 'mongodb://localhost/social'\nmongoose.connect(url)\n\
    module.exports = mongoose\n```\n\n这是 Heroku 应用程序的一种常见的模式。你的应用会首先检查环境变量中的配置选项，如果找不到，则默认为本地设置。这允许你在不同的环境中部署应用程序。它还允许你通过修改环境变量来更改服务，而无需重新部署。\n\
    \n# HEROKU上的 Redis\n\n本节假设你已经实现了第 9 章的 Redis 代码。如果你还没有这样做，可以随时跳过，或参考 https://github.com/dickeyxx/mean-sample\
    \ 中的示例代码。\n\n再次部署应用仍然会导致错误信息。然而，如果你查看日志，你会看到一个不同的错误信息。\n\nError: Redis connection\
    \ to localhost:6379 failed - connect ECONREFUSED\n\nRedis 尝试连接 Redis 服务器并失败，就像\
    \ MongoDB 一样。添加 Redis 同样简单。有很多供应商，但 Redis To Go 可能是容易设置的。\n\n```\n$ heroku addons:add\
    \ redistogo\n```\n\n再次运行 `heroku config` 现在 Redis To Go 将服务器 URL 放在了 `REDISTOGOGO_URL`\
    \ 环境变量中。\n\n```\nREDISTOGOGO_URL: redis://redistogo:xxx@hoki.redistogo.com:10062/\n\
    ```\n\n在 `pubsub.js` 中，你一直使用的是默认 Redis 客户端。遗憾的是，该客户端不像 MongoDB 客户端那样原生接受 URL 进行配置。你需要修改代码使用\
