    \ the service', function () {\n  expect($scope.posts).to.have.length(2)\n});\n\
    ```\n\n这个测试目前还不可用，但它是控制器测试的基本形式。你再次声明我们正处于 app 模块中，与服务测试不同，你存储了一个 `$scope` 对象以备后后引用。\n\
    \n然后你注入了 `$rootScope` 和 `$controller` 工具，在 `$rootScope` 上调用 `new` 来构建一个新的 `$scope`\
    \ 对象。然后你实例化 `PostCtrl` 并传入你自己的依赖项供控制器获取。任何其他依赖项（如 `PostsSvc`）都会自动查找。\n\n注意你在这里没有在函数参数名周围使用下划线。这是因为你不想使用名为\
