  - "[PAGE 71]\n\nThis won't work because you don't have reference to the app object.\
    \ One solution would be to wrap the whole bit of code into a function that expects\
    \ an app argument, like so:\n\n```\nvar Post = require('../models/post')\n\nmodule.exports\
    \ = function (app) {\n  app.get('/api/posts', function (req, res, next) {\n  \
    \  Post.find()\n    .sort('-date')\n    .exec(function(err, posts) {\n      if\
    \ (err) { return next(err) }\n      res.json(posts)\n    })\n  })\n\n  app.post('/api/posts',\
    \ function (req, res, next) {\n    var post = new Post({\n      username: req.body.username,\n\
    \      body: req.body.body\n    })\n    post.save(function (err, post) {\n   \
    \   if (err) { return next(err) }\n      res.json(201, post)\n    })\n  })\n```\n\
    \nThen you could call it from server.js like so:\n\n```\nrequire('../controllers/api/posts')(app)\n\
    ```\n\nThis is a fine solution that has a side benefit of allowing you to easily\
    \ mock out the app object if you wanted to write a test. Still, Express offers\
    \ a cleaner solution through its Router object. You can build a Router object\
    \ that acts like an app object and simply use it like middleware to attach it\
    \ to your app. In /controllers/api/posts.js, it would look like this:\n\n```\n\
    var Post = require('../models/post')\nvar router = require('express').Router()\n\
    \nrouter.get('/api/posts', function (req, res, next) {\n  Post.find()\n  .sort('-date')\n\
    \  .exec(function(err, posts) {\n```"
  - "[PAGE 72]\n\n```\nif (err) { return next(err) }\nres.json(posts)\n}\n}\n```\n\
    \n```\nrouter.post('/api/posts', function (req, res, next) {\n  var post = new\
    \ Post({\n    username: req.body.username,\n    body: req.body.body\n  })\n  post.save(function\
    \ (err, post) {\n    if (err) { return next(err) }\n    res.json(201, post)\n\
    \  })\n});\n```\n\nmodule.exports = router\n\nThen you can attach it to your app\
    \ in server.js like so (make sure you remove the old endpoints from server.js\
    \ as well):\n\n```\napp.use(require('./controllers/api/posts'))\n```\n\nThis is\
    \ my prefered method because it allows you to do clever things such as using middleware\
    \ only on the API. It also prevents you from having to indent all of your code\
    \ inside a function definition.\n\n# NAMSPACING ROUTERS\n\nYou can even namespace\
    \ your routes by passing the namespace into the .use() method:\n\n```\napp.use('/api/posts',\
    \ require('./controllers/api/posts'))\n```\n\nThen in the controller, leave out\
    \ that part of the path:\n\n```\nrouter.get('/', function (req, res, next) {\n\
    // ...\n\nrouter.post('/', function (req, res, next) {\n// ...\n\n```\n\nYou could\
    \ have an API controller mounted to /api that then mounts the api/posts controller\
    \ to /posts on itself. That's a bit too modular for our app right now, but a large\
    \ app might benefit from that.\n\nTry this now by running the app. You should\
    \ see no change."
  - "[PAGE 73]\n\n# BREAKING OUT THE SENFILE ENDPOINT\n\nNow that you've broken out\
    \ part of the code, let's break out the section that delivers the Angular app.\
    \ Create a file /controllers/static.js with the following:\n\n```\nvar router\
    \ = require('express').Router()\n\nrouter.get('/', function (req, res) {\n  res.sendFile('/layouts/posts.html')\n\
    })\n```\n\nmodule.exports = router\nThen use it in server.js. The entire server.js\
    \ file should now look like this:\n\n```\nvar express = require('express')\nvar\
    \ bodyParser = require('body-parser')\n\nvar app = express()\napp.use(bodyParser.json())\n\
    \napp.use('/api/posts', require('./controllers/api/posts'))\napp.use('./controllers/static')\n\
    // equivalent to: app.use('/', require('./controllers/static'))\n\napp.listen(3000,\
    \ function () {\n  console.log('Server listening on', 3000)\n})\n```\n\nMost Express\
    \ apps have a single entry point like this to start an instance of the server.\
    \ It's good to keep it as lightweight as possible. Good things to define in server.js\
    \ include the following:\n\n+   - Global middleware\n- Global configuration\n\
    - Telling the server to listen\n- Logger setup\n- Error handling\n- Mounting controllers"
  - "[PAGE 74]\n\n# CLEANING UP ANGULAR\n\nNow that your Node code is looking cleaner,\
    \ you can turn your focus to the front end. It would be really nice if you had\
    \ your JavaScript in a separate file instead of baked into your layout. It would\
    \ also be nice if the controller performed the $http logic inside a service to\
    \ separate concerns and allow reuse.\n\n# SERVING STATIC ASSETS\n\nTo deliver\
    \ the JavaScript as a separate file, first break it out into a file called /assets/app.js.\
    \ Include the JavaScript script from /layouts/posts.html (the comments that were\
    \ previously included have been removed);\n\n```\nvar app = angular.module('app',\
    \ []);\n\napp.controller('PostsCtrl', function ($scope, $http) {\n  $scope.addPost\
    \ = function () {\n    if ($scope.postBody) {\n      $http.post('/api/posts',\
    \ {\n        username: 'dickeyxxx',\n        body: $scope.postBody\n      }).success(function\
    \ (post) {\n        $scope.posts.unshift(post)\n        $scope.postBody = null\n\
    \      })\n    }\n  }\n}\n\n$http.get('/api/posts').success(function (posts) {\n\
    \  $scope.posts = posts\n});\n```\n\nNode is capable of delivering static JS and\
    \ CSS files like this. Now in production, you might not want Node serving a lot\
    \ of these files since it's not as good as a general web server like nginx or\
    \ Apache. Still, it's a great way to deliver them in development mode.\n\nI'll\
    \ get into serving your application in production later, but I want you to have\
    \ an idea of the direction we will go. Later, you'll put a CDN in front of your\
    \ application that will cache the assets. For now, you'll continue to serve them\
    \ from Node because it's easier to configure and has fewer moving parts."
- md: "\nSince it works in production as it does in development, you achieve something\
    \ called dev-prod parity. Dev-prod parity is the idea that production should be\
    \ similar as development mode as possible in order to mitigate production-specific\
    \ issues.\n\nTo do this, Express comes with built-in middleware to serve the static\
    \ assets. You can add it to /controllers/static.js along with your layout endpoint:\n\
    \n```javascript\nvar express = require('express')\nvar router = express.Router()\n\
    ```\n\n```javascript\nrouter.use(express.static(__dirname + '/../assets'))\n```\n\
    \n__dirname is a special variable that points to the current file directory, controllers\
    \ in your case. You're going up from that directory so that you can serve the\
    \ assets in /assets.\n\nYou could also use process.cwd(), which is the current\
    \ working directory of the Node process, but that has a tendency to change depending\
    \ on how you start the process. I prefer using `__dirname` instead of `process.cwd()`\
    \ for all Node web servers.\n\nOnce you have set up, try to access http://localhost:3000/app.js.\
    \ You should see the raw Javascript script you created. Then replace the <script>\
    \ tag in /layouts/posts.html with one that references the script from the server.\n\
    \n```html\n<script src='/app.js'></script>\n```\n\nNow you have a much cleaner\
    \ separation between your HTML layout and your JavaScript code.\n\n## BREAKING\
    \ ANGULAR INTO SERVICES\n\nIn addition to the clever data binding that Angular\
    \ provides, it provides a solid framework for breaking up your code into logical\
    \ sections. Services are one of the ways you can build a component for your application.\n\
    \nIn Angular, controllers get created and destroyed every time they appear and\
    \ disappear on a page. Services, on the other hand, are created only when needed.\
    \ If multiple other components want to use a service, Angular will efficiently\
    \ use the same instance of the service.\n\nDependency inject services just like\
    \ $scope or $http and call custom functions on them.\n\nA clear code inside Angular\
    \ apps would be having inside a controller. This makes the controller aware of\
    \ too much and is not good code separation. Now, when building your applications,\
    \ I encourage you to first make the HTTP calls inside the controller and break\
    \ it out once it is working. That's how I build applications, and similar to the\
    \ server.js breakout you did earlier, it allows for easier iterating and experimenting.\n\
    \nInside /assets/js, define the service on the app object. It doesn't matter if\
    \ you do before or after the controller. Angular will automatically figure out\
    \ the order to load things when it runs.\n\nThe service to make the HTTP looks\
    \ like this:\n\n```javascript\napp.service('PostsSvc', function ($http) {\n  this.fetch\
    \ = function () {\n    return $http.get('/api/posts');\n  }\n});\n```\n\nName\
    \ the service PostsSvc and then dependency inject $http. You then define a function\
    \ on the service called fetch that returns the $http promise for loading posts.\
    \ Dependency inject PostsSvc into the controller (replacing $http):\n\n```javascript\n\
    app.controller('PostsSvc', function ($scope, PostsSvc) {\n```\n\nAnd replace the\
    \ code that loads the posts with the following:\n\n```javascript\nPostsSvc.fetch().success(function\
    \ (posts) {\n  $scope.posts = posts\n});\n```\n\nIt might not seem like a huge\
    \ improvement just yet, but this allows you to consolidate all the logic in regard\
    \ to reading posts into one place. In a typical app, this might involve pagination,\
    \ caching, authorization, or even making multiple HTTP calls. It has a side benefit\
    \ of making the code easy to test in isolation.\n\nMake sure this code is still\
    \ able to read the posts from the API and add a .create(post) method to the service.\
    \ The service should now look like the following:\n\n```javascript\napp.service('PostsSvc',\
    \ function ($http) {\n  this.fetch = function () {\n    return $http.get('/api/posts');\n\
    \  }\n  this.create = function (post) {\n    return $http.post('/api/posts', post);\n\
    \  }\n});\n```\n\nThen use it in the controller:\n\n```javascript\napp.controller('PostsCtrl',\
    \ function ($scope, PostsSvc) {\n  $scope.addPost = function () {\n    if ($scope.postBody)\
    \ {\n      PostsSvc.create({\n        username: 'dickeyxxx',\n        body: $scope.postBody\n\
    \      }).success(function (post) {\n        $scope.posts.unshift(post)\n    \
    \    $scope.postBody = null\n      })\n    }\n  }\n\n  PostsSvc.fetch().success(function\
    \ (posts) {\n    $scope.posts = posts\n  })\n})\n```\n\nNow you've successfully\
    \ modularized your Angular code into logical sections. Using this pattern, it's\
    \ easy to manage even large Angular codebases in a performant way.\n\n## NEXT\
    \ STEPS\n\nYou've now fully integrated Angular and Node together and have a working\
    \ first version of your application. In the next chapter, I'll introduce Gulp\
    \ as a way to manage building your app's assets.\n\n## CHAPTER 6\n### Automating\
    \ Your Build with Gulp\n\nIn the previous chapter, you learned how to integrate\
    \ Angular with a Node API. In this chapter, you'll learn how to automate the build\
    \ steps of your application with Gulp.\n\n## INTRODUCING GRUNT AND GULP\n\nAll\
    \ modern JavaScript applications involve some kind of build process. This might\
    \ entail preprocessing CSS with Sass/Less/Stylus, concatenating JavaScript files\
    \ into one, minifying assets.\n\nAll modern JavaScript applications involve some\
    \ kind of build process. This might entail preprocessing CSS with Sass/Less/Stylus,\
    \ concatenating JavaScript files into one, minifying assets.\n\nAll modern JavaScript\
