  - '[PAGE 81]


    # INTRODUCING GRUNT AND GULP


    All modern JavaScript applications involve some kind of build process. This might
    entail preprocessing CSS with Sass/Less/Stylus, concatenating JavaScript files
    into one, minifying assets, compiling CoffeeScript, and so on. While this can
    totally be done with ad hoc commands or Bash scripts, there are tools that help
    you manage these tasks. Another benefit that is sometimes overlooked is these
    tools typically work on Windows machines and not just Mac and Linux boxes.


    I highly encourage the time to learn a build tool. It will help clean up your
    build scripts, make it easier to work on projects you haven''t touched in a while,
    and make it it easier for others to work on your project.


    A few tools can help with these tasks; the big two are Grunt and Gulp. Grunt is
    older than Gulp and is more task-centric. In Grunt, you define in JSON how to
    do things such as minify JavaScript and compile Sass, and each spits out a file.
    Gulp is stream-based, and the configuration is written in JavaScript code. Gulp
    configuration files are way shorter than the Grunt equivalent, and because of
    its streaming architecture Gulp will run orders of magnitude faster on large projects.


    In my opinion, Gulp is a much better tool for asset build tasks and will be the
    tool used in this book.'
  - "[PAGE 82]\n\n# GULP HELLO WORLD\n\nTo get Gulp up and running, let's first create\
    \ a simple task that outputs \"Hello World.\"\nFirst, install Gulp globally and\
    \ in the project (you need both) with the following commands:\n\n```\nnpm install\
    \ --global gulp\nnpm install --save gulp\n```\n\nNext, add the gulpfile.js to\
    \ the root of the project. This is a special filename Gulp knows to look for.\
    \ The contents should be the following:\n\n```\nvar gulp = require('gulp')\n\n\
    gulp.task('hello', function () {\n  console.log('hello world')\n})\n```\n\nYou\
    \ can now run this task:\n\n```\n$ gulp hello\n[15:59:03] Using gulpfile ~/src/social/gulpfile.js\n\
    [15:59:03] Starting 'hello'...\n[15:59:03] Finished 'hello' after 106 µs\n```\n\
    \nhello world\nThis is the basic form of a Gulp task. You can also have tasks\
    \ that depend on others passing in an array:\n\n```\nvar gulp = require('gulp')\n\
    \ngulp.task('welcome', function () {\n  console.log('welcome to gulp!')\n})\n\
    ```\n\n```\ngulp.task('hello', ['welcome'], function () {\n  console.log('hello\
    \ world')\n})\n```\n\nNow if you run the hello task, it will first wait for the\
    \ welcome task to complete. You can also run the welcome task directly with gulp\
    \ welcome."
  - "[PAGE 83]\n\n# BUILDING JAVASCRIPT WITH GULP\n\nThe first thing you will use\
    \ Gulp to take care of is building your front-end JavaScript. Right now you have\
    \ the /assets/app.js file that gets included inside the layout file, but I would\
    \ like to have many JavaScript files to have a nice clean file hierarchy for all\
    \ of your front-end code. Ideally, every Angular component would have its own\
    \ file.\n\nHaving a <script> tag for each of these would quickly become unbearable,\
    \ so what you'll do now is a series of front-end scripts in /ng (for Angular)\
    \ that Gulp will concatenate together to dynamically build /assets/app.js.\n\n\
    First, move /assets/app.js to /ng/app.js. Then, install the Gulp plug-in in gulp-concat:\n\
    \n```\n$ npm install --gulp-concat\n```\n\nReplace your gulpfile.js file with\
    \ the following:\n\n```\nvar gulp = require('gulp')\nvar concat = require('gulp-concat')\n\
    \ngulp.task('js', function () {\n  gulp.src('ng/**.js')\n  .pipe(concat('app.js'))\n\
    \  .pipe(gulp.dest('assets'))\n})\n```\n\nThis is the common signature of all\
    \ Gulp plug-ins. You load the files with gulp.src into a stream, pipe them through\
    \ various plug-ins, and finally output them to gulp.dest. It might look a little\
    \ unusual at first, but once you get the hang of it, you'll be able to use many\
    \ plug-ins without ever reading the documentation.\n\nTry running gulp js, and\
    \ you should see it copy the contents of /ng/app.js to /assets/app.js:\n\n```\n\
    $ gulp js\n```\n\nAngular is great in it allows you to declare the components\
    \ at any time, so the order in which gulp-concat adds the files doesn't matter\
    \ for the components. However, you do need access to the module object you create\
    \ with angular.module('app', []).\n\nangular.module() is a method that can be\
    \ used as either a getter or a setter. If you pass in one argument (the name of\
    \ the module), it will return module (getter). If you pass in two arguments (name\
    \ and dependencies), it is a setter. The setter can be called only once and must\
    \ be called before any getters. This is an important note because it trips people\
    \ up sometimes setting up the project."
- md: "\nThe main point here is you to call angular.module('app', []) once before\
    \ any of your code; then you can call angular.module('app') in each component\
    \ file to get back that instance.\n\nReplace /ng.app.js with the following three\
    \ files:\nHere are the contents for the file /ng/module.js:\n\n```\nHere are the\
    \ contents for the file /ng/posts.js:\nangular.module('app')\n.controller('PostsCtrl',\
    \ function ($scope, PostsSvc) {\n  $scope.addPost = function () {\n    if ($scope.postBody)\
    \ {\n      PostsSvc.create({\n        username: 'dickeyxxx',\n        body: $scope.postBody\n\
    \      }).success(function (post) {\n        $scope.posts.unshift(post)\n    \
    \    $scope.postBody = null\n      })\n    }\n  }\n}\n```\n\n```\nPostsSvc.fetch().success(function\
    \ (posts) {\n  $scope.posts = posts\n})\n```\n\n```\nHere are the contents for\
    \ the file /ng/posts.svc.js:\nangular.module('app')\n.service('PostsSvc', function\
    \ ($http) {\n  this.fetch = function () {\n    return $http.get('/api/posts')\n\
    \  }\n  this.create = function (post) {\n    return $http.post('/api/posts', post)\n\
    \  }\n}\n```\n\nNow you just need to make sure concat loads /ng/module.js first\
    \ before the files. Replace the Gulp task with the following that does this:\n\
    ```\ngulp.task('js', function () {\n  gulp.src(['ng/module.js', 'ng/**.js'])\n\
    \  .pipe(concat('app.js'))\n  .pipe(gulp.dest('assets'))\n})\n```\n\nYou now have\
    \ a really simple process to import the module first, and you are free to add\
    \ the Angular code to /ng in any place, and Gulp will automatically import the\
    \ files.\nIf you're not using Angular and therefore aren't able to use its dependency\
    \ injection, I suggest using Browserify to require JavaScript files instead of\
    \ this method. You could use Browserify as in this project, but it's totally overkill\
    \ for Angular apps since all you need to do is define the module before anything\
    \ else. If you're using source control, it's usually a good idea to ignore the\
    \ assets folder. Checking the compiled assets into the project will make the repository\
    \ grow quite large.\n\n# UGLIFIER\n\nIt'd be great to minify your JavaScript code\
    \ before you build /assets/app.js to reduce the file size when users download\
    \ the application. Uglifier is a popular tool for JavaScript minification.\n\n\
    - First install the Uglify plug-in:\n$ npm install --save gulp-uglify\n\nModify\
    \ your gulp task to use it:\n\n```\nvar gulp = require('gulp')\nvar concat = require('gulp-concat')\n\
    var uglify = require('gulp-uglify')\ngulp.task('js', function () {\n  gulp.src(['ng/module.js',\
    \ 'ng/**.js'])\n  .pipe(concat('app.js'))\n  .pipe(uglify())\n  .pipe(gulp.dest('assets'))\n\
    })\n```\n\n# Recent Posts\n\nAdd Post\n\nElements Network Source Profiles Resources\
    \ Assets Console AngularS\n\n```\n<top frame>\nError: [sinjected:unpr] Unknown\
    \ provider: tProvider <- 1\nhttp://errors.angular.org/1.2.18/injector/unpr/unknown-provider-e203c-a28t\n\
    \ https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:78:12\n @ angular.js.compile\
    \ (https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:3741:19)\n\
    \ https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:3069:29\n https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:3746:45\n\
    \ https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:3068:39\n invoke\
    \ (https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:3096:13)\n\
    \ https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:3917:22\n https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:6592:39\n\
    \ forEach (https://ajax.googleapis.com/ajax/libs/angular/1.2.18/angular.js:327:20)\n\
    \ angular.js:9937\n```\n\nFIGURE 6.1 Error after including Uglifier\n\nIf you\
    \ run the task and open /assets/app.js, you can clearly see that it is minified\
    \ (note that Uglifier might not output code exactly like this on your machine):\n\
    \n```\nangular.module(\"app\",[]);\nangular.module(\"app\").controller(\"PostsCtrl\"\
    ,function(o,s)\n{o.addPost=function(){if(o.postBody){s.create({username:\"dickeyxxx\"\
    ,\nbody: o.postBody}).success(function(o){o.posts.unshift(o),\no.postBody=null})}});s.fetch().success(function(s){o.posts=s})\n\
    angular.module(\"app\").service(\"PostsSvc\",function(t){this.fetch=\nfunction(t){return\
    \ t.get(\"/api/posts\")};this.create=function(s){return t.post\n(\"/api/posts\"\
    ,s)});\n```\n\nHowever, if you run the application now, you will get an error\
    \ and nothing (see Figure 6.1). That \"Unknown provider\" error is one you're\
    \ likely to see in Angular development. It means the dependency injector could\
    \ not find dependency. In this case, it was looking for dependency. BUILDING JAVCRIPT\
    \ WITH GUL\n\nWhat is happening here is that Uglifier rewrote the function argument\
    \ as characters. For this reason, Angular is incompatible with minifiers. Obviously,\
    \ there is a way to fix this. You can pass an array that defines dependencies\
    \ as strings when defining your component. For example, if you wanted to fix PostSvc,\
    \ you could change the definition from:\n\n```\n.service('PostsSvc', function\
    \ ($http) {\n```\n\ninto:\n\n```\n.service('PostsSvc', ['$http'], function ($http)\
    \ {\n```\n\nAngular supports either way to define dependencies. The second one\
    \ is minifier-compatible since the minifier will not change string literals. While\
    \ this is great for minification, it's a pain to develop since you have to keep\
    \ track of order of dependencies. Luckily, there is a tool called ng-annotate\
    \ that will rewrite your code using the minification-friendly syntax before you\
    \ ship it to Uglifier. This allows you to write the code in the concise manner\
    \ and solves minification problem as well. It's similar to other Gulp plug-ins.\n\
    \n- First, install gulp-annotate\n$ npm install --save gulp-annotate\n\nThen update\
    \ your gulpfile.js:\n\n```\nvar gulp = require('gulp')\nvar concat = require('gulp-concat')\n\
    var uglify = require('gulp-uglify')\nvar ngAnnotate = require('gulp-ng-annotate')\n\
    ```\n\n```\ngulp.task('js', function () {\n  gulp.src(['module.js', 'ng/**/*.js'])\n\
    \    .pipe(concat('app.js'))\n    .pipe(ngAnnotate())\n    .pipe(uglify())\n \
    \   .pipe(gulp.dest('assets'))\n})\n```\n\nStarting to see Gulp pattern? Do an\
    \ npm install, add the require(), and then add it into the pipe() sequence. Most\
    \ Gulp plug-ins work like this.\n\nRebuilding /assets/app.js should now result\
    \ in the following:\n\n```\nangular.module(\"app\").controller(\"PostsCtrl\",[\"\
    scope\"],[\"PostsSvc\", function\n(s,o){o.addPost=function(){if(o.postBody){s.create({username:\"\
    dickeyxxx\",\nbody: o.postBody}).success(function(o){o.posts.unshift(o),\no.postBody=null})}});s.fetch().success(function(o){o.posts=s})\n\
    angular.module(\"app\").service(\"PostsSvc\",[\"$http\"],function(t){this.fetch=\n\
    function(t){return t.get(\"/api/posts\")};this.create=function(s){return t.post\n\
    (\"/api/posts\",s)});\n```\n\nIf you look in there, you will see how those dependency\
    \ arrays affect each component. Running the app again should work.\n\n# REBUILDING\
    \ UPON FILE CHANGES\n\nRight now the Angular code is concatenated and minified\
    \ by using gulp, but it would be huge pain to run every time you make a change.\
    \ It's pretty easy to create a file watcher in Gulp that will automatically rebuild\
    \ the JavaScript every time there is change.\n\nHere's a Gulp task that will rerun\
    \ js every time one of the Angular files changes:\n\n```\ngulp.task('watch:js',\
    \ ['js'], function () {\n  gulp.watch('ng/**.js', ['js'])\n})\n```\n\ngulp.watch\
    \ takes a file path to watch and then an array of tasks to run whenever those\
    \ files are edited.\n\nIf you run gulp watch:js instead of gulp, it will stay\
    \ up, rebuilding the JavaScript whenever a JavaScript file in /ng changes, just\
    \ like nodemon will restart Node when server.js changes. Note that I also added\
    \ the js task as a dependency. This way, when you first call watch:js, it will\
    \ automatically build the JavaScript even before a file changes.\n\nHaving an\
    \ easy setup like this is crucial. Your development environment needs to be seamless\
    \ with few chores to take care of as possible when building your application.\n\
    \n# 6.2 Logging an error without a source map\n\n![](img/a45e866f1e25bfccba9780b8e48fa81d_89_0.png)\n\
    \n```\nerror!\n  (anonymous function)\n    Invoke\n  Instantiate\n  (anonymous\
    \ function)\n    Invoke\n  getService\n    Invoke\n  Instantiate\n    (anonymous\
    \ function)\n    (anonymous function)\n    forEach\n\nangular.js:1411\nangular.js:3986\n\
    angular.js:3917\nangular.js:3986\nangular.js:3927\nangular.js:3869\nangular.js:3917\n\
    angular.js:3927\nangular.js:6592\nangular.js:3927\n```\n\n# SOURCE MAPS\n\nAnother\
    \ issue with minification is that it makes harder to debug the code. Now when\
    \ the browser shows a console.log error or error pop up, it can't easily tell\
    \ you where the code caused a problem. Having Gulp rebuild would save your code\
    \ when it changes, this isn't necessary to build your application, but will save\
    \ you a lot of work in the future.\n\nFirst, I'll demonstrate the problem. Add\
    \ the line console.error('error!') inside PostsSvc(ng/posts.svc.js). If you're\
    \ using Chrome, you should see output like that shown in 6.2 in the Developer\
    \ Tools Console.\n\nIt is saying the error happened on line 3 of app.js, which\
    \ is totally unhelpful because by including a source map of the original JavaScript,\
    \ you can provide Chrome with a guide to show you where the error really happened.\
    \ This is extremely helpful for debugging. First, you need to build the source\
    \ map.\n\nTo build the source map, you can use the gulp-sourcemaps plug-in. Because\
    \ it needs to wrap a few other plug-ins, this one bit different from the other\
    \ gulp plug-ins:\n\n-   * npm install --save gulp-sourcemaps\n\nThen edit your\
    \ gulp task like the following:\n\n```\nvar gulp = require('gulp')\nvar concat\
    \ = require('gulp-concat')\nvar sourcemaps = require('gulp-sourcemaps')\nvar uglify\
    \ = require('gulp-uglify')\nvar ngAnnotate = require('gulp-ng-annotate')\n```\n\
    \n```\ngulp.task('js', function () {\n  gulp.src(['module.js', 'ng/**/*.js'])\n\
    \    .pipe(concat('app.js'))\n    .pipe(sourcemaps.init())\n    .pipe(ngAnnotate())\n\
    \    .pipe(uglify())\n    .pipe(sourcemaps.write())\n    .pipe(gulp.dest('assets'))\n\
    })\n```\n"
