    \    </p>\n  </div>\n</nav>\n```\n\n114 CHAPTER 8 ADDING ROUTING AND CLIENT AUTHENTICATION\n\
    \nNow you can populate currentUser object on $scope here. It isn't as easy as\
    \ going into LoginCtrl and setting $scope.currentUser = user, however. That's\
    \ because\nLoginCtrl is not scoped all the way out to this controller. You could\
    \ use $rootScope(global scope) instead, but there is a better way to do this without\
    \ messing with global\nmemory leak like that.\n\nThe better solution is to have\
    \ the LoginCtrl bubble up a login event and have a parent\nApplicationCtrl listen\
    \ for that. ApplicationCtrl will then set $scope.currentUser, making it available\
    \ to all children.\n\nUpdate LoginCtrl in ng/login.js to pass the event using\
    \ $emit:\n\n```javascript\nangular.module('app')\n.controller('LoginCtrl', function\
    \ ($scope, UserSvc) {\n  $scope.login = function (username, password) {\n    UserSvc.login(username,\
    \ password)\n    .then(function (response) {\n      $scope.emit('login', response.data)\n\
    \    })\n  }\n})\n```\n\nNow, put the ng-controller directive for the ApplicationCtrl\
    \ on the <body> tag inside\nlayouts/app.html:\n\n```html\n<body ng-app='app' ng-controller='ApplicationCtrl'>\n\
    ```\n\nAnd create ng/application.ctrl.js:\n\n```javascript\nangular.module('app')\n\
    .controller('ApplicationCtrl', function ($scope) {\n  $scope.on('login', function\
    \ (_, user) {\n    $scope.currentUser = user\n  })\n})\n```\n\nNow you should\
    \ finally be able to log in to your app! One more thing you need to do in order\
    \ to finish up your authentication is to link the user to the post.\n\n# AUTHENTICATING\
    \ SOCIAL POSTS\n\nRight now, the client is actually sending the username of the\
    \ posts. What should happen is that the server should find out who the user is\
    \ based on the JWT. This prevents users from modifying their usernames.\n\nYou\
    \ need to reuse the code in controllers/api/users.js to grab the user's information\
    \ from the JWT. This is a good time to introduce some custom middleware in your\
    \ Express app. Create the file auth.js in the root of the project:\n\n```javascript\n\
    var jwt = require('jwt-simple')\nvar config = require('./config')\n```\n\n```javascript\n\
    module.exports = function (req, res, next) {\n  if (req.headers['x-auth']) {\n\
    \    req.auth = jwt.decode(req.headers['x-auth'], config.secret)\n  }\n  next()\n\
    }\n```\n\nThis middleware will attach an auth object to the requests for you to\
    \ look up the current user's information.\nNow use this middleware in server.js\
    \ just before using all the controllers:\n`app.use(require('./auth'))`\n\nYou\
    \ can now use this code inside controllers/api/posts.js to find the current user's\
    \ username:\n\n```javascript\nrouter.post('/', function (req, res, next) {\n \
    \ var post = new Post({body: req.body.body})\n  post.username = req.auth.username\n\
    \  post.save(function (err, post) {\n    if (err) { return next(err) }\n    res.json(201,\
    \ post)\n  })\n})\n```\n\nNow the change you need to make in the Angular app is\
    \ simple; you just need to send up the X-Auth header on the post creation request.\
    \ You could add this directly to the posts controller, but the better way is to\
    \ globally add that header for all requests so you won't have to keep remembering\
    \ to do that. Update ng/user.svc.js to the following code:\n\n```javascript\n\
    angular.module('app')\n  .service('UserSvc', function ($http) {\n  var svc = this;\n\
    \  svc.getUser = function () {\n    return $http.get('/api/users')\n  }\n  svc.login\
    \ = function (username, password) {\n    return $http.post('/api/sessions', {\n\
    \      username: username, password: password\n    }).then(function (val) {\n\
    \      svc.token = val.data\n      $http.defaults.headers['X-Auth'] = val.data\n\
    \      return svc.getUser()\n    })\n  };\n});\n```\n\nNow all requests (not just\
    \ those in service) will have header attached.\nThis is a basic demonstration\
    \ of authentication. It's not easy as it is with traditional web application,\
    \ but it's very flexible.\nStill, there is more that you could do to turn this\
    \ into a full-fledged system. I'll briefly describe some tips in the following\
    \ sections.\n\nWhat often happens Angular will try to load files that may not\
    \ exist. This results in a loop. It's a problem in development mode only when\
    \ you haven't created files, but it does make debugging harder.\n\n# HTML5 PUSHSTATE\n\
    \nEnabling pushstate in Angular is easy; all you need to do dependency inject\n\
    $locationProvider and add this line to your ng/routes.js file:\n\n```javascript\n\
    $locationProvider.html5Mode(true)\n```\n\nThis is all that needs to happen on\
    \ the client; you can now remove the #s from the URLs.\nStill I don't suggest\
    \ doing this if you are just started, though.\n\n# REGISTRATION\n\nIn the book,\
    \ I haven't covered registration. It is easy, though; all you need to do is add\
    \ createUser function to your user service that calls login after it creates the\
    \ user and then the form/controller to go with it. It's a good exercise that you\
    \ should try on your own. It demonstrates the reusability of your API.\n\n# LOGOUT\n\
    \nThe logout functionality is pretty easy; you'll just need to call a function\
    \ on ApplicationCtrl that deletes currentUser from its scope. You'll also probably\
    \ want to call something on the UserSvc that will remove the JWT from the requests.\n\
    \n# REMEMBER ME\n\nThe best way to remember the last user on the page is by using\
    \ HTML5 pushstate. You could use this simply by swapping out references to svc.token\
    \ inside UserSvc and adding in window.localStorage.token.\n\nYou will also need\
    \ to check whether token exists when the app is started. If it does, you'll want\
    \ to have the ApplicationCtrl grab the current logged-in user from UserSvc.getUser().\n\
    \n# USER FOREIGN KEY\n\nYou may have noticed that you are using the user's username\
    \ as a string on the MongoDB model. It would be a good idea to instead store the\
    \ user's ObjectId on the Post object. This way, the username can change, and users\
    \ will keep all of their posts.\n\nIf you implement this, look into Mongoose's\
    \ population feature as a way to pull down the username when GET /api/posts is\
    \ hit.\n"
