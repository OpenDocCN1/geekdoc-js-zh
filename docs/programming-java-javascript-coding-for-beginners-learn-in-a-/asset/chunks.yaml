    \nSyntax :\n\nSwitch(id)\n\n{\n\nCase id1:\n\nAction;\n\nBreak;\n\nCase id2:\n\
    \nAction;\n\nBreak;\n\n….\n\nDefault:\n\n….\n\n}\n\nWhile ()\n\nThis is an iteration\
