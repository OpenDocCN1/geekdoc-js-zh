    \ program, then one must install java to their system and setup their own offline\
    \ development environment. Java comes in three types –\n\n- The Micro Edition\
    \ (`J2ME`)\n- Standard Edition (`J2SE`)\n- Enterprise Edition (`J2EE`)\n\nFor\
    \ personal use, one can download `.exe` of latest SE version corresponding to\
    \ their operating system from the [download page](http://www.oracle.com/technetwork/java/javase/downloads/index.html).\
    \ After installing, check that the `PATH` variable points to the java installation.\
    \ Executing `java` from the terminal window will display the version of java installed\
    \ on the screen.\n\n## Code Structure\n\n![](images/00001.jpeg)\n\nEvery java\
    \ code is saved with the extension `.java`. Each java program contains one or\
    \ more classes. Each of these classes contains one or more method definitions\
    \ and each method carries a few statements in it.\n\n## Syntax and meanings of\
    \ keywords\n\n```java\nimport java.io.*;\n\npublic class MyFirstProgram {\n  \
    \  public static void main(String[] args) {\n        //This is my first java program\n\
    \        System.out.println(\" Hello World !\");\n    }\n}\n```\n\n- `import java.io.*;`:\
    \ The keyword `import` is used for including java libraries called `packages`\
    \ which contain pre-defined functions that can be used in the program.\n- `public\
    \ class MyFirstProgram`: this is the class definition, the keyword `public` indicates\
    \ that this class is available to all and `class` denotes to be a class definition.\n\
    - `MyFirstProgram` – This is the name of a class. Name of the class having the\
    \ `main()` function should be the same as the source file name.\n- The class definition\
    \ is enclosed within the parenthesis `{}`.\n- `public static void main(String\
    \ args[])`: This is the main part of the program. Since `main()` is the driver\
    \ function, it should always be `public`.\n- `static`: You need to keep in mind\
    \ that `main()` method should always be `static` because it makes the program\
    \ memory efficient.\n- `void`: This is the return type of the method. This means\
    \ that the `main()` method will not return anything.\n- `main`: name of the method.\
    \ The interpreter starts execution from the `main()` method only. Running a program\
    \ means instructing the `JVM` to load the `.class` file which was compiled from\
    \ the source code and start executing from the `main()` method.\n- The two uses\
    \ of the main method can be summarized as:\n  1. To Test all the other methods\
    \ of the program\n  2. To Start execution of the program.\n- `String[] args`:\
    \ is the argument that is passed to the `main` method. This method always takes\
    \ an array of strings as its input parameter, and the array name should always\
    \ be `args`.\n- Note that the data type starts with a upper case `S`, this is\
    \ because `Strings` is a class in Java and all class names start with upper case.\n\
    - The definition of the method is enclosed within flower braces `{}`, in this\
    \ case, the only thing that we want our program to do is print \"Hello World!\"\
    .\n- To print a statement to standard output console, `System.out.println(\"\"\
    );` is used. Note that all statements must end with a semi-colon (`;`).\n- You\
    \ can also use `System.out.print()` to display output, the difference is that\
    \ print`ln` introduces a new line at the end of each statement it prints.\n- The\
    \ other statement within the `main()` method in our program is called a \"comment\"\
    \ statement. These are not compiled, the purpose of these statements which are\
    \ preceded by `//` are only to give the programmer more information about code.\n\
    - Java doesn’t have the concept of global variables at all; the same is achieved\
    \ using keywords such as `final`, `static`, `public`.\n\n### Using the Java library\n"
