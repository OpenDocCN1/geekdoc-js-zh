    The Book is made a constant in the above example.


    ## Decision making in JavaScript


    There always rises a situation where we have to select one of the two paths that
    are before him. Then we are able to implement the conditional statements like
    if and else.


    The ‘if’ and else statements can be used for decision-making. This will allow
    the program to choose the correct path.


    The following conditional statements are supported by JavaScript.


    1.  if statement


    2.  if...else statement


    3.  if...else if... statement


    if statement: The if is the fundamental statement used to make decisions. There
    a condition is added to the if statement and a set of statements can be given
