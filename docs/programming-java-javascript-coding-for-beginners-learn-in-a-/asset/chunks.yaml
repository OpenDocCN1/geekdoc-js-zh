    ## Creating Variables and Constants


    Declaring a Variable


    A variable is declared by preceding the name by the var keyword. For example if
    you want to declare ‘group’ a variable, just add the var keyword before ‘group’.
    Every variable should end with a ‘  ; ‘ (semicolon). This makes the statement
    a self-containing. Care should be taken while using the words because JavaScript
    is case sensitive. For this the letters are to be used in the exact same declaration
    as in the original.


    Eg:               var Dell;


    The object Dell above is declared as a variable.


    Declaring a Constant


    The keyword ‘const’ is used before the name is to make it a constant. This declaration
    is just like declaring a constant.


