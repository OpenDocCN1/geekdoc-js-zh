    \ of the validity of the condition, because the condition is evaluated only after\
    \ the “do” statement.\n\nSyntax\n\ndo{\n\n       do Something;\n\n}while(condition);\n\
    \nFor loop\n\nSyntax: for ( initialization ;condition; counter updation);\n\n\
    Example : for (int i=0; i<5; i++)\n\nThis will now execute the statement for exactly\
    \ 5 times. The first part declares and initializes a value to the counter variable,\
    \ the second part checks the condition, if true, it enters loop. On completion\
    \ of loop, it performs the increment. Then it again checks the condition and continues\
    \ the same steps till the condition turns false. Once the condition is false,\
    \ it exits out of the loop.\n\nExample:\n\nClass MyProgram{\n\npublic static void\
    \ main(Strings[] args){\n\n//declare and assign variables\n\nint  num = 5, i;\n\
    \nwhile( num > 0){\n\nSystem.out.println(“The Value of integer Num  is : ”+num);\n\
    \nnum--;\n\n}\n\nfor(i =0;i<5;i++)\n\nSystem.out.println(“The Value of integer\
