    \ Garbage collection in Java\n\nGarbage, in Java can be defined as the unreferenced\
    \ objects in Java. And the process of reclaiming the unused memory is called garbage\
    \ collection. In simple words garbage collection means to destroy all the objects\
    \ that are used. Unlike `C` and `C++`, garbage collection is an automatic process\
    \ in Java. This is one of the reasons why Java provides the user with a better\
    \ and efficient management.\n\nAdvantages of garbage collection:\n\n*   Garbage\
    \ collection makes the memory efficient by removing all the objects that are not\
    \ referred. These objects use of heap memory and garbage collection clears this\
    \ memory.\n*   There is no need for the user to perform garbage collection manually\
    \ as the process of garbage is automatic in Java. So we don't have to make extra\
    \ efforts for managing memory. The Java virtual machine takes care of clearing\
    \ this memory.\n\nThere are three ways in which you can de-allocate an object.\
    \ They are:\n\n*   Nullifying the reference: An object can be removed from heap\
    \ memory by removing the object's reference. Here is an example.\n```java\nEmployee\
    \ e=new Employee();\ne=null;\n```\n*   By assigning the object's reference to\
    \ another object: removing the reference of an object and giving it to another\
