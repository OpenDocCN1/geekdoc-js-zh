    \ `Ducati`。在这里你可以看到编译器处理的给定对象引用的自动转换。\n\n```java\ninterface Automobile{\n\n}\n\
    \nclass Bike implements Automobile{\n\n}\n\nclass Ducati extends Bike{\n\n}\n\
    ```\n\n示例：假设 `c` 是 `bike` 类类型的变量，`f` 是 `Ducati` 类类型，`v` 是一个车辆接口引用。我们可以将 `Ducati`\
    \ 引用赋值给 `bike` 变量：\n\n即我们可以执行以下操作：\n\n#### 示例 1\n```java\nc = f; // 正常编译通过\n```\n\
    其中 `c = new bike();`\n且 `f = new Ducati();`\n\n编译器会自动处理转换（赋值），因为类型是兼容的（子类 – 父类关系），即\
    \ `bike` 类型可以持有 `Ducati` 类型，因为 `Ducati` 是一个 `bike`。\n\n#### 示例 2\n```java\nv =\
