    \      /*由于我正在用 0 除一个整数\n          * 它应该抛出 ArithmeticException*/\n      int res=num1/num2;\n\
    \      System.out.println(res);\n  }\n}\n```\n\n如果你编译上面的代码，你会发现编译将成功完成。但是，如果你运行它，程序将抛出一个名为\
    \ `ArithmeticException` 的异常。通过此，你知道受检异常不是在编译时抛出错误，而是在运行时。这里是另一个示例。\n\n### 示例：\n\
    \n```java\nclass Example { \npublic static void main(String args[])\n{\n    int\
    \ arr[] ={1,2,3,4,5};\n    /*数组只有 5 个元素，但\n      * 我正尝试显示第 8\n      * 元素的值。它应该抛出\n\
    \      * ArrayIndexException*/\n    System.out.println(arr[7]);\n}\n```\n\n在这个示例中，与上一个一样，将会有编译时错误。然而，这段代码在运行时会抛出一个名为\
    \ `ArrayIndexException` 的未受检异常。这些异常在编译时无法发现，但这意味着它们没有被编译器忽略。在上面的示例中，添加一条建议用户提供范围内的值的消息是明智的。添加消息后的代码如下所示。\n\
    \n```java\nclass Example { \n    public static void main(String args[])\n    {\n\
    \      try{\n        int arr[] ={1,2,3,4,5};\n        System.out.println(arr[7]);\n\
    \      }catch(ArrayIndexOutOfBoundsException e){\n        System.out.println(\"\
    指定的索引在数组\" + \"中不存在。请纠正错误。\");\n      }\n    }\n}\n```\n\n以下是一些在运行时常见的未受检异常。\n\
    \n- `NullPointerException`\n- `ArrayIndexOutOfBoundsException`\n- `ArithmeticException`\n\
    - `IllegalArgumentException`\n\n### 异常 (Exception) 与错误 (Error) 的区别：\n\n**异常**：异常发生在代码内部，可以由开发者进行处理。当异常发生时，开发者可以采取必要的行动。下面是异常的示例：\n\
    \n- `DivideByZeroException`\n- `NullPointerException`\n- `ArithmeticException`\n\
    - `ArrayIndexOutOfBoundsException`\n\n**错误**：错误与异常不同。它们是系统尝试不处理的异常状况。当错误发生时，它表示系统遇到了严重问题。它们定义了程序在通常情况下无法解决的问题。错误的一些示例是：\n\
    \n- 硬件错误\n- 内存错误\n- `JVM` 错误\n\n### 异常处理 (Exception Handling)\n\n异常处理是一种强大的机制，用它可以处理运行时错误。异常处理确保了程序的正常流得以维持。\n\
    \n异常处理的几个优点：\n\n- 如果程序中编写了异常处理，它将允许用户控制程序执行的流。\n- 每当发生错误时，它都会抛出一个异常。调用方法将处理遇到的的错误。\n\
    - 通过异常处理，在使用独立代码块时可以区分并组织不同类型的错误。\n\n在这里我们将查看几个异常处理的示例。\n\n示例：\n\n```java\nclass\
    \ Division {\n\npublic static void main(String args[]) {\nint a, b, result;\n\
    Scanner input = new Scanner(System.in);\nSystem.out.println(\"输入两个整数\");\na =\
    \ input.nextInt();\nb = input.nextInt();\n// try 块\ntry {\n  result = a / b;\n\
    \  System.out.println(\"结果 = \" + result);\n}\n// catch 块\ncatch (ArithmeticException\
    \ e) {\n  System.out.println(\"捕获异常：除以零。\");\n}\n}\n}\n```\n"
- fmt: "\nThe only thing similar in Java and JavaScript is their similar sounding\
    \ names. Rest, the languages are completely different with regard to their functions\
    \ and concepts. What makes JavaScript stand out from the object oriented programming\
    \ languages like `Java` and `C++` is that its objects can be created or modified\
    \ during the run time. For doing this, Methods and properties are added to the\
    \ empty objects. An object once created can be used like a prototype in the process\
    \ of creating other similar objects. Variable parameter lists, source-code recovery,\
    \ dynamic script creation, dynamic object creation function variables etc are\
    \ the dynamic capabilities that JavaScript has.\n\n# Basics of Java Script\n\n\
    ## Storing data in JavaScript\n\n- **Local Storage**: The local storage is used\
    \ to permanently store the data. With this, the data on that page can be accessed\
    \ anytime. The local storage doesn’t have an expiration date. One can use local\
    \ storage if they want their data to be reused again and again over the period\
    \ of time.\n- **Session Storage**: The session storage is not like local storage\
    \ as it only holds the data for a single session and disposes off the data once\
    \ the user closes the page. This kind of storage is used on web pages used for\
    \ booking tickets etc.\n\n### Storing Data using Variable Data and Constant Data\n\
    \nThe Variables and Constants store the data and values used in JavaScript. They\
    \ both have their own importance in JavaScript. All the data stored cannot be\
    \ made constant. Processes like time countdown use the variables and the Constants\
    \ are used for non-changing data.\n\n- **Variable Data**: As the name suggests,\
    \ this type of data that changes its value over time is called the Variable Data.\
    \ This type of data is widely used in JavaScript. Variables are dynamic in nature.\n\
    - **Constant Data**: The Constant data is something that never changes its value.\
    \ This data will be constant through time. This type of data is static. We use\
    \ this type of data for data which is which cannot be modified.\n\n## Creating\
    \ Variables and Constants\n\n### Declaring a Variable\n\nA variable is declared\
    \ by preceding the name by the `var` keyword. For example if you want to declare\
    \ `group` a variable, just add the `var` keyword before `group`. Every variable\
    \ should end with a `;` (semicolon). This makes the statement a self-containing.\
    \ Care should be taken while using the words because JavaScript is case sensitive.\
    \ For this the letters are to be used in the exact same declaration as in the\
    \ original.\n\nEg:\n```javascript\nvar Dell;\n```\nThe object `Dell` above is\
    \ declared as a variable.\n\n### Declaring a Constant\n\nThe keyword `const` is\
    \ used before the name is to make it a constant. This declaration is just like\
    \ declaring a constant.\n\nEg:\n```javascript\nconst Book;\n```\nThe `Book` is\
    \ made a constant in the above example.\n\n## Decision making in JavaScript\n\n\
    There always rises a situation where we have to select one of the two paths that\
    \ are before him. Then we are able to implement the conditional statements like\
    \ `if` and `else`.\n\nThe `if` and `else` statements can be used for decision-making.\
    \ This will allow the program to choose the correct path.\n\nThe following conditional\
    \ statements are supported by JavaScript:\n1. `if` statement\n2. `if...else` statement\n\
    3. `if...else if...` statement\n\n**if statement**: The `if` is the fundamental\
    \ statement used to make decisions. There a condition is added to the `if` statement\
    \ and a set of statements can be given if the given condition holds true.\n\n\
    SYNTAX:\n```javascript\nif(condition){\n  statements to be executed\n}\n```\n\
    EXAMPLE:\n```html\n<script type=\"text/javascript\">\n<!--\nvar age = 20;\nif(\
    \ age > 18 ){\n  document.write(\"<b>Allowed inside the pub.</b>\");\n}\n//-->\n\
    </script>\n```\nOUTPUT: Allowed inside the pub. (if a no. above 18 is given)\n\
    \n**if else statement**: This is like an extension of the `if` statement. The\
    \ system runs the code and executes the statements in the `else` block if the\
    \ `if` statement holds false.\n\nSYNTAX:\n```javascript\nif(condition)\n  {statements}\n\
    else{statements}\n```\nEXAMPLE:\n```html\n<script type=\"text/javascript\">\n\
    <!--\nvar age = 15;\nif( age > 18 ){\n  document.write(\"<b>Allowed inside the\
    \ pub</b>\");\n}else{\n  document.write(\"<b>Is not allowed.</b>\");\n}\n//-->\n\
    </script>\n```\nOUTPUT:\n- Allowed inside the pub (if a number above 18 is given)\n\
    - Not allowed (if a number below 18 is given)\n\n**if else if**: This is like\
    \ adding another step to the `if else` statement. this is used when a series of\
    \ conditions are used.\n\nSYNTAX:\n```javascript\nif(condition){statements};\n\
    else if(condition){statements}\nelse if(condition){statements}\nelse{statements}\n\
    ```\nEXAMPLE:\n```html\n<script type=\"text/javascript\">\n<!--\nvar book = \"\
    JAVASCRIPT\";\nif( book == \"JAVA\" ){\n  document.write(\"<b>JAVA Book</b>\"\
    );\n}else if( book == \"JAVASCRIPT\" ){\n  document.write(\"<b>JAVASCRIPT Book</b>\"\
    );\n}else if( book == \"DBMS\" ){\n  document.write(\"<b>DBMS Book</b>\");\n}else{\n\
    \  document.write(\"<b>UNKNOWN Book</b>\");\n}\n//-->\n</script>\n```\nOUTPUT:\
    \ JAVASCRIPT book\n\n### The nested if\nThe `nested if` is an `if` statement inside\
    \ another `if` statement.\n\nSYNTAX:\n```javascript\nif(condition){statements}\n\
    ```\n\n### The switch\nThe `switch` statement there will be different statements\
    \ basing on the expression’s value.\n\nSYNTAX:\n```javascript\nswitch (expression)\n\
    {\n  case 1:\n    statements\n  case 2:\n    statements\n  default:\n    statements\n\
    }\n```\n\n## Looping in JavaScript\n\n### The for Loop\nThe loops are used if\
    \ one wants the same code to be repeated again and again. The `for` loop is one\
    \ of three loops that can be made use of. The `for loop` is simple and compact.\
    \ It contains the following points:\n1. The start statement is performed before\
    \ the loop begins.\n2. The loop is executed only when the conditions given are\
    \ true. But a test code will be executed which runs the code for once.\n3. The\
    \ counter for iterations can be increased or decreased.\n\nSYNTAX:\n```javascript\n\
    for (initialization; test condition; iteration){\n  Statement(s) to be executed\
    \ if test condition is true\n}\n```\nEXAMPLE:\n```html\n<script type=\"text/javascript\"\
    >\n<!--\nvar count;\ndocument.write(\"This will repeat for 10 times\" + \"<br\
    \ />\");\nfor(count = 0; count < 10; count++){\n  document.write(\"Currently repeated\
    \ : \" + count );\n  document.write(\"<br />\");\n}\ndocument.write(\"Done!!\"\
    );\n//-->\n</script>\n```\nOUTPUT:\nThis will repeat for 10 times\nCurrently repeated\
    \ : 0\nCurrently repeated : 1\nCurrently repeated : 2\nCurrently repeated : 3\n\
    Currently repeated : 4\nCurrently repeated : 5\nCurrently repeated : 6\nCurrently\
    \ repeated : 7\nCurrently repeated : 8\nCurrently repeated : 9\nDone!!\n\n# Chapter\
    \ 11: Functions and Events in JavaScript\n\n## What is a Function?\nA group of\
    \ codes which are reusable when called anywhere in the program is called a function.\
    \ It reduces the time and energy for one to write the same code again and again.\
    \ This reduces code redundancy. Modular code can be written by using the functions.\
    \ A large program can be divided into many or desired number of parts using the\
    \ functions.\n\nFunctions like `write()` and `alert()` are the default functions.\
    \ JavaScript provides the user with many functions which can be used right away.\
    \ JavaScript also allows one to create our own custom functions.\n\n### Function\
    \ Definition\nA function should first be defined before using it. The `function`\
    \ key is a common method to define functions in JavaScript. It should be followed\
    \ by the function name that is unique and lists of parameters.\n\nSYNTAX:\n```html\n\
    <script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list)\n\
    {\n  statements\n}\n//-->\n</script>\n```\n"
