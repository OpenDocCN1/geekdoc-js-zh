    # Chapter 11: Functions and Events in JavaScript


    ## What is a Function?


    A group of codes which, are reusable when desired are called anywhere in the program
    is called a function. It reduces the time and energy for one to write the same
    code again and again. This reduces code redundancy. Modular code can be written
    by using the functions. A large program can be divided into many or desired number
    of parts using the functions. JavaScript, like any other programming language,
    supports the features that are needed for writing modular code. This is done by
    using ‘functions’.


    Functions like write() and alert() are the default functions. JavaScript provides
    the user with many functions which can be used right away.


    JavaScript also allows one to create our own custom functions.


    Function Definition:


    A function should first be defined before using it. The function key is a common
    method to define functions in JavaScript. It should be followed by the function
    name that is unique and lists of parameters. It also should contain a statement
    block with curly braces.


