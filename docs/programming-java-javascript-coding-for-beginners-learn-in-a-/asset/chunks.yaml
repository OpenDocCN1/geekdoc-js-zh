    # Chapter 3: Variable Declaration & Data Types


    The next most important and fundamental concept to learn is about “variables”
    and “data types” to create useful programs. Variables are basically named memory
    location, which are used to hold values. Java is a strongly typed language, so
    the variable of type “x” can hold a value of type “x” only.


    For example:


              int  n;


    Here a variable “n” is declared to hold value of type “int”. Declaring variable
    type ensure “type-safety” feature of java which in turn contributes to “security”.


    Variables in java can be either


    *   Local Variables (primitive data types like int, float, double, Boolean etc.)


    *   Reference Variables (objects – user defined instances of class)


    Assume that you declared a variable of type int, you can probably use it to save
    a short value. If done otherwise, it’ll overflow.


    Also note that java thinks anything with decimal point is by default a “double”,
    therefore it’s important to append an “f” at the end of a given decimal number
    to make it a double.


    float f = 1.56f;


    Rules for declaring variable names:


    *   Do not use any predefined reserved words as variable names.


    *   Variable names cannot start with a number.


