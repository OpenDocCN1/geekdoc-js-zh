  trans: "\n\n示例：在下面的示例中，有一个简单的函数程序。\n\n```javascript\nfunction simplefunction()\n\
    {\n  alert(\"This is a simple function\");\n}\n```\n\n### 调用函数\n\n在 JavaScript\
    \ 中调用函数，应按照如下方式编写该函数的名称。\n\n```javascript\nsimplefunction();\n```\n\n### 函数的参数：\n\
    \n在 JavaScript 中，函数也可以带参数传递。在调用函数时，可以传递不同的参数。可以通过对函数中传递的参数进行操作。函数中用逗号来分隔多个参数。\n\
    \n#### 示例：\n\n在接下来的这个示例中，我们将修改我们的 `simplefunction` 函数。现在我们将使用两个参数。\n\n```javascript\n\
    function simplefunction(name, age)\n{\n  alert( name + \" is \" + age + \" years\
    \ old.\");\n}\n```\n\n该函数可以被调用。可以像下面所示进行调用。\n\n```javascript\nsimplefunction('Zara',\
    \ 7 );\n```\n\n### return 语句：\n\n如果用户希望该函数返回一个值，可以在 JavaScript 函数中添加一个可选的 `return`\
    \ 语句。`return` 语句始终应该是函数的最后语句。\n\n例如，用户可以在特定函数中传递两个不同的数字，并期望函数在程序中返回这两个数字的乘积。\n\
    \n#### 示例：\n\n```javascript\nfunction concatenate(first, last)\n{\n  var full;\n\
    \  full = first + last;\n  return full;\n}\n```\n\n现在可以按如下方式调用函数：\n\n```javascript\n\
    var result;\nresult = concatenate('Zara', 'Ali');\nalert(result );\n```\n\n##\
    \ JavaScript 中的事件\n\n#### 事件：\n\n事件处理 JavaScript 与 HTML 之间的交互。当页面被用户或浏览器操作时就会发生这种操作。\n\
    \n一切皆事件。页面的加载是一个事件。当用户通过点击选择某些内容时，该点击也被视为一个事件。事实上，用户执行的任何操作如关闭窗口、选择链接、按键、关闭标签页、调整窗口大小等，都是事件的示例。\n\
    \n在 JavaScript 中编写的响应通过这些事件执行，例如关闭窗口、要显示的文本、显示的警报、确认消息或任何可能发生的类型响应。\n\n事件是文档对象模型\
    \ (DOM) Level 3 的一部分。每个 HTML 元素都提供一组事件。这些事件会触发 JavaScript 中的代码。\n\n#### onclick\
    \ 事件类型：\n\n这是一种事件，点击时会显示预期的验证或警告等。这被广泛使用。\n\n示例：下面的代码，当点击 onclick 的 hello 按钮时，它会触发\
    \ `events` 函数。\n\n```html\n<html\n<head>\n<script type=\"text/javascript\">\n\
    function events() {\n  alert(\"Hello World\")\n}\n</script>\n</head>\n<body>\n\
    <input type=\"button\" onclick=\"sayHello()\" value=\"Say Hello\" />\n</body>\n\
    </html>\n```\n\n#### onsubmit 事件类型：\n\n`onsubmit` 事件是另一个重要的事件类型。当在此处提交表单时，会发生验证。只有当函数返回\
    \ `true` 时，文本才会被发送。\n\n示例：\n\n```html\n<html\n<head>\n<script type=\"text/javascript\"\
    >\nfunction validation() {\n  // 所有的验证都在这里\n  .........\nreturn either true or\
    \ false\n}\n</script>\n</head>\n<body>\n<form method=\"POST\" action=\"t.cgi\"\
    \ onsubmit=\"return validate()\">\n.......\n<input type=\"submit\" value=\"Submit\"\
    \ />\n</form>\n</body>\n</html>\n```\n\n# 第 12 章：JavaScript 调试\n\n在编写程序时有很多机会犯错。脚本中的此类错误被称为\
    \ bug。\n\n调试是修复 bug 的过程。在开发过程中，调试是正常工作的一部分。我们编写的代码可能有逻辑错误或语法错误，这些错误很难识别。很多时候，当\
    \ JavaScript 代码包含错误时，什么都不会发生。没有消息指示程序中存在错误。\n\n## 使用 JavaScript 验证器\n\n如果有人想检查代码中的\
