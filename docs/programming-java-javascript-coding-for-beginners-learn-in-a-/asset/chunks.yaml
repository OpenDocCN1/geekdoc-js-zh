    \ exceptions got checked by the compiler during the compile time and as we did\
    \ not declare those exceptions, the program displayed a compilation error message.\n\
    \nA few more check the exceptions are given below.\n\n- `SQLException`\n- `IOException`\n\
    - `DataAccessException`\n- `ClassNotFoundException`\n- `InvocationTargetException`\n\
    \n### Unchecked exceptions\n\nUnchecked exceptions are nothing but exceptions\
    \ that are not checked during compile time. These exceptions do not give compilation\
    \ errors as they cannot be checked during compile time. It doesn't matter if you\
    \ have declared an exception or not. Uncheck the exceptions mostly occur due to\
    \ the data that the user provides during his interaction with the program. The\
    \ only way to handle these exceptions is to anticipate them and writing an appropriate\
    \ handler for that exception. The `RuntimeException` class is the superclass of\
    \ all unchecked exceptions. Here is an example which will help you to get a better\
    \ understanding on unchecked exceptions.\n\n```java\nclass Example {  \n\n  public\
    \ static void main(String args[])\n  {\n      int num1=10;\n      int num2=0;\n\
    \      /*Since I'm dividing an integer with 0\n          * it should throw ArithmeticException*/\n\
    \      int res=num1/num2;\n      System.out.println(res);\n  }\n}\n```\n\nIf you\
