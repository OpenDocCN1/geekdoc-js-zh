    \ Animal);\n  }\n}\n```\n\n输出：这将产生以下结果\n```\ntrue\ntrue\ntrue\n```\n\n### instanceof\
    \ 运算符\n\n在 Java 中，如果你想确定一个类是否属于某个特定的类或为了实现某个给定的接口，可以使用 `instanceof` 运算符。`instanceof`\
    \ 运算符是一种类型比较运算符。`instanceof` 运算符根据类的状态返回 true 或 false。如果给定的对象属于某个类或该对象实现了某个接口，则\
    \ `instanceof` 运算符返回 true。否则，它将简单地返回 false。\n\n在下面的示例中，你可以看到 `instanceof` 运算符的使用。\n\
    \n```java\nclass Vehicle {\n  String name;\n  Vehicle() {\n    name = \"Vehicle\"\
    ;\n  }\n}\n\nclass dirtbike extends Vehicle {\n  dirtbike() {\n    name = \"dirtbike\"\
    ;\n  }\n}\n\nclass atv extends dirtbike {\n  atv() {\n    name = \"atv\";\n  }\n\
    }\n\nclass LightVehicle extends Vehicle {\n  LightVehicle() {\n    name = \"LightVehicle\"\
    ;\n  }\n}\n\npublic class InstanceOfExample {\n  static boolean result;\n  static\
    \ dirtbike hV = new dirtbike();\n  static atv T = new atv();\n  static dirtbike\
    \ hv2 = null;\n  public static void main(String[] args) {\n    result = hV instanceof\
