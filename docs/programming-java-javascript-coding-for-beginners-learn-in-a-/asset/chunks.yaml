    if else if: This is like adding another step to the if else statement. this is
    used when a series of conditions are used.


    SYNTAX: if(condition){statements};


    else if(condition){statements}


    else if(condition){statements}


    else{statements}


    EXAMPLE:


    <script type="text/javascript">


    <!--


    var book = "JAVASCRIPT";


    if( book == "JAVA" ){


      document.write("<b>JAVA Book</b>");


    }else if( book == "JAVASCRIPT" ){


      document.write("<b>JAVASCRIPT Book</b>");


    }else if( book == "DBMS" ){


