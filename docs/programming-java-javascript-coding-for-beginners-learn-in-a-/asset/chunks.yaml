    The nested if


    The ‘nested if’ is an ‘if’ statement inside another ‘if’ statement.


    SYNTAX: if(condition)  {if(condition){statement}  }


    The switch and  break statements:


    In the switch statement there will be an expression followed by several different
    statements. The statements will be executed basing on the expression’s value selected.


    SYNTAX:switch (expression)


    {


     case condition 1


    : statement(s)


