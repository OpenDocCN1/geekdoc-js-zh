  trans: "\n\n在编写 `Java` 时，你会发现存在许多预定义的类。所有这些类都可以在 `Java` 程序中使用，这让用户免于了重复造轮子的任务。但为了使用这些类，你至少应该对需要什么以及在哪里可以找到它们有一些基础的了解。这些被称为\
    \ `Java APIs`。该库无非就是一大堆预定义的类构成的集合，这些类可以在程序中的任何地方使用。它们包含了预定义的代码，用户只需要知道如何使用它们即可。这些库避免了用户编写长长的代码。这也被称为\
    \ `Java 标准代码库`。在 `Java` 平台中，`Java 标准代码库`主要有三个用途。它们是：\n\n- 就像其他代码库一样，`Java 库`为程序员提供了一套实用的工具。这些工具包括正则表达式处理、容器类等。\n\
    - 标准代码库为用户提供了抽象接口，用户可以通过这些接口独立地执行任务。这样，用户就不需要为文件访问和网络访问等复杂过程编写完整的代码。\n- 有少数底层平台不支持所有的\
    \ `Java` 应用。在这种情况下，你可以使用 `Java 库`来模拟这些功能，或者使用它提供一种检查特定功能是否存在的方法。\n\n### Java 标准代码库的实现与配置\n\
    \n标准库中的大部分代码是用 `Java` 编写的。直接访问操作系统或硬件所需的代码除外。在这种情况下，使用 `Java native interface`（Java\
    \ Native 接口）封装来访问操作系统的 API。几乎所有的 `Java` 代码库都存储在一个名为 `rt.jar` 的单一归文件中。该文件由 `JDK`\
    \ 和 `JRE` 分发。`Java 类库`可以在引导类路径（bootstrap class path）中找到。\n\n### Java 类库的主要特性\n\
    \n我们使用类来访问 `Java 类库功能`。这些功能属于包。下面是 `Java 类库` 的一些主要特性：\n\n- `java.lang` 包含了所有的基础接口和类。它们与运行时系统和语言紧密相关。\n\
    - 有一个专门用于数学运算的包，包含了数学表达式、求值和任意精度小数。它们都存在于 `java.math` 库中。\n- 工具与集合：`Java` 为用户提供了内置的\
    \ `Utility` 类和数据结构。这些工具类和数据结构可以用于数据压缩、日志记录、并发和正则表达式。\n- 二维图形和图形用户界面：用户可以使用 `AWT`\
    \ 包，它提供了图形用户界面操作。该包绑定到原生系统。你可以用它来设计平台无关工具包以及可插的外观和外观（feel and look）。该包还可以用于处理可编辑和不可编辑的文本组件。\n\
    - 音频：该包为用户提供了类和接口，用于声音数据的写入、读取、合成和排序。\n- 文本：`java.text` 接口用于处理文本、数字、消息和日期。\n-\
    \ 数据库：用户可以使用 `java.SQL` 库访问数据库 (`sql`)。\n- `Java.Security` 提供了加密服务的安全性。`javax.crypto`\
    \ 库中存在加密服务。\n- `Java` 还允许你访问脚本引擎。你可以使用 `javax.script` 包使用任何符合标准的脚本语言。\n- 小程序（Applets）：`Java.applet`\
    \ 包允许你通过网络下载应用程序，并允许你在受保护的沙箱中运行它们。\n\n# 第 2 章：面向对象编程\n\n`Java` 的语法类似于 `C`，但编程哲学源自\
    \ `C++` —— 也就是说，`java` 是一种面向对象的语言。在我们之前看到的第一个例子中，我们有一个类声明，并说 `main()` 函数负责程序中执行的操作，这并不意味着\
    \ `java` 变成一个 OOP 语言，让我们看一个例子来更好地理解 OOP —— 对象和类。\n\n## 过程化方法\n\n这并不那么简单，因为之前的形状是确定的，动画代码可以假设一个中心点并旋转形状；而对于像\
    \ `amoeba`（变形虫）这样不规则形状，无法使用其他形状的代码进行旋转，而是 `API` 需要额外的几个参数来定义形状旋转的坐标。\n\n## 面向对象方法\n\
    \n因此，你可以为每个形状编写一个类文件，这样在添加 `amoeba` 或修改 `rotate` 方法时，无需扰动现有代码，只需添加新类即可。你只需要测试新类。引入的任何新问题都可以轻松追溯到所做的新更改。\n\
    \n示例 1：\n```java\nclass Movie{\n    //variable Declaration\n    //methods\n} m1;\
    \ //m1 是类型为“Movie”的对象\n``` \n\n示例 2：\n```java\nclass Movie{\n    //variable Declaration\n\
    \    //methods\n}\n\nclass TestMovie{\n    public static void main(String[] args){\n\
    \        Movie m1 = new Movie(); // m1 是类型为“Movie”的对象\n        m1.variable = value;\n\
    \        m1.method();\n    }\n}\n```\n\n# 第 3 章：变量声明与数据类型\n\n学习的下一个重要且基础的概念是关于“变量”和“数据类型”，以创建实用的程序。变量本质上是命名的内存位置，用于存储值。`Java`\
    \ 是一种强类型语言，因此类型为 `x` 的变量只能持有类型。例如：\n\n```java\nint n;\n```\n这里声明了一个变量 `n` 用于持有值。声明类型为\
    \ `int` 的变量确保了 `java` 的“类型安全”特性。在 `java` 中变量可以是：\n\n- 局部变量（原始数据类型，如 `int`, `float`,\
    \ `double` 等）\n- 引用变量（类的实例）\n\n假设你声明了一个类型为 `int` 的变量，你可以使用它来保存值。如果不这样做，可能会发生溢出。还要注意，`java`\
    \ 认为带有小数点的默认都是 `double`，因此在给定的小数数字末尾附加 `f` 以将其转换为 `float` 是重要的。\n\n```java\nfloat\
    \ f = 1.56f;\n```\n\n变量命名规则：\n- 不要使用保留字作为变量名。\n- 变量名不能以数字开头。\n\n一些常见的 Java 关键字：\n\
    \n`String` 被声明为一个类。字符串的一些常用操作有：\n\n```java\nString str = “Hello World”; //声明\n\
    int len = str.length(); // 获取字符串长度\nint len = “hello Wolrd”.length(); // 同样获取字符串长度\n\
    String concatStr = “hello”+”world // // 运算符可以重载以执行两个字符串的拼接。\n```\n\n```java\n\
    String str1 = “Heloo”;\nString str2 = “World”;\nif (str1 == str2) //比较两个字符串\n\
    \    System.out.println(“strings are equal”);\n```\n\n 引用变量\n\n```java\nMovie\
    \ m1 = new Movie()\n```\n左侧是声明，它指示 `JVM` 为引用变量留出空间，持有到达实际对象的数据。\n\n```java\nint[]\
    \ n; //声明一个整数数组\nn = new int[5]; //创建一个包含 5 个整数的数组\n```\n注意，即使是原始数据类型值的数组，数组也变成了一个对象。\n\
    \n```java\nMovie[] mArray; //声明一个类型为“Movie”的对象数组\n```大小：对于原始类型，引用变量没有预定义的大小。\n\
    \n## Array List\n\n"
- fmt: "\nThis is available in the `java.util.ArrayList` package.\n\n```java\nArrayList<String>\
    \ myList = new ArrayList<String>();\n```\n\nIt allows the declaration of an array\
    \ with different data types. It offers multiple methods to perform common array\
    \ operations like `add(elem)` `remove(index)` to add/remove elements from the\
    \ `arrayList`. Also API’s like `size()` to find the length of array, to find if\
    \ `isEmpty()` or if the `arrayList` `contains()` a given element.\n\nLet’s see\
    \ an example using the concepts learned so far,\n\n```java\nClass MyProgram{\n\
    \npublic static void main(Strings[] args)\n{\n//declare and assign variables\n\
    \    int  num = 10;  \n    float fNum = 10.5;\n    //print statements to output\
    \ consoles\n    System.out.println(“The value of integer num is : ”+num);\n  \
    \  System.out.println(“The Value of integer fNum is : ”+fNum);\n    num = num/2;\n\
    \    fNum = fNum+num;\n    System.out.println(“The value of integer num after\
    \ operation is : ”+num);\n    System.out.println(“The Value of integer fNum after\
    \ operation is : ”+fNum);\n}\n}\n```\n\nOutput:\nThe value of integer num is :\
    \ 10\nThe value of integer fNum is : 10.5\nThe value of integer num after operation\
    \ is : 5\nThe value of integer fNum after operation is  : 20.5\n\nYou just have\
    \ to use `+` operator in the SoP (`System.out.println`) statement.\n\n## Wrapper\
    \ Classes\n\nAs we know, Java is an object oriented programming language and everything\
    \ in Java can be viewed as an object. Anything from simple files, images, an address\
    \ of a system, etc. can all be considered as objects in Java. We can change the\
    \ date of type of an object using the wrapper classes. In this tutorial we will\
    \ look into the wrapper classes and their details. Using Wrapper classes, you\
    \ can convert any given data type into an object.\n\nAll the primitive datatypes\
    \ in Java are not objects. These primitive data types don't belong to any class.\
    \ These are defined in the Java language itself. We may encounter situations where\
    \ we will have two changes these primitive data types into objects. What example,\
    \ you can add a data type to vector or a stack by converting it into an object.\
    \ The Java design introduced wrapper classes for making these conversions.\n\n\
    ### About wrapper classes\n\nAs the name suggests, wrapper classes enclose (wrap)\
    \ around any data type to give it an appearance of an object and it can be used\
    \ whenever the data type is needed. This is a process that can be reversed. Wrapper\
    \ classes can not only change the data types into classes but also can un-wrap\
    \ the object and return back the data type. This is just like chocolate wrapper\
    \ on the chocolate. The manufacturer wraps the chocolate in the wrapper and ships\
    \ it. The use of removes the wrapper for having the chocolate.\n\nIt is have a\
    \ look at the following conversion where the `int` datatype is converted into\
    \ an object.\n\n```java\nint k = 100;\nInteger it1 = new Integer (k);\n```\n\n\
    In the above example, the int data data type `k`, using wrapper classes, is converted\
    \ into an object `it1`. This is done by using the `integer` class. And whenever\
    \ `K` is required, the object `it1` can be used.\n\nThe following code shows you\
    \ how to wrap the object and get the int datatype from the integer object `it1`.\n\
    \n```java\nint m = it1.intValue();\nSystem.out.println(m*m); // prints 10000\n\
    ```\n\n### List of Wrapper classes\n\nIn the Java language, there are 8 data types\
    \ present and for each of them have their own wrapper classes.\n\n| Primitive\
    \ data type | Wrapper class |\n| :--- | :--- |\n| byte | Byte |\n| short | Short\
    \ |\n| int | Integer |\n| long | Long |\n| float | Float |\n| double | Double\
    \ |\n| char | Character |\n| Boolean | Boolean |\n\nAll the wrapper classes can\
    \ be found in the `java.lang` package. They are placed there so that they can\
    \ be made available implicitly to the programmer whenever imported. To avoid inheritance,\
    \ the Java designers made these wrapper classes as `final`.\n\n### Importance\
    \ of Wrapper classes\n\nWe use wrapper classes for serving two purposes:\n\n-\
    \ For converting simple data types into objects. This is done by giving the object\
    \ form to a given data type.\n- For converting the strings into data types. For\
    \ this type of conversion we use the methods like `parseXXX()`.\n\nHere there\
    \ is an example program showing the conversion of a datatype to an object and\
    \ also retrieving the data type from the same time.\n\n```java\npublic class WrappingUnwrapping\n\
    {\n public static void main(String args[])\n {\n   //  data types\n   byte grade\
    \ = 2;\n   int marks = 50;\n   float price = 8.6f; // observe suffix f for float\n\
    \   double rate = 0.5; // data types to objects\n   Byte g1 = new Byte(grade);\
    \ // wrapping \n   Integer m1 = new Integer(marks);\n   Float f1 = new Float(price);\n\
    \   Double r1 = new Double(rate);\n   // let us print the values from objects\n\
    \   System.out.println(\"Values of objects (printing as objects)\");\n   System.out.println(\"\
    Byte object g1: \" + g1);\n   System.out.println(\"Integer object m1: \" + m1);\n\
    \   System.out.println(\"Float object f1: \" + f1);\n   System.out.println(\"\
    Double object r1: \" + r1);\n   // objects to data types (retrieving data types\
    \ from objects)\n   byte bv = g1.byteValue(); // unwrapping\n   int iv = m1.intValue();\n\
    \   float fv = f1.floatValue();\n   double dv = r1.doubleValue();\n   // let us\
    \ print the values from data types\n   System.out.println(\"Unwrapped values (printing\
    \ as data types)\");\n   System.out.println(\"byte value, bv: \" + bv);\n   System.out.println(\"\
    int value, iv: \" + iv);\n   System.out.println(\"float value, fv: \" + fv);\n\
    \   System.out.println(\"double value, dv: \" + dv);\n}\n}\n```\n\n# Chapter 4:\
    \ Control Statements\n\nThe control statements in a program, as the name itself\
    \ suggests, control the general flow of every program. It includes conditional\
    \ statements like `if else`, or iteration statements like `while()`, `do while()`\
    \ etc.\n\n### If else\n\n**Syntax:**\n\n```java\nif(condition)\n    do action1;\n\
    else\n    do action2;\n```\nAn action is taken when the `condition` is true, else\
    \ the `else` part is taken.\n\n### Switch case\n\nThis operation comes in handy\
    \ if you had to check for multiple conditions. Switch case takes action based\
    \ on a given value.\n\n**Syntax:**\n\n```java\nSwitch(id)\n{\n    Case id1:\n\
    \        Action;\n        Break;\n    Case id2:\n        Action;\n        Break;\n\
    \    Default:\n        \n}\n```\n\n### While ()\n\nThis is an iteration statement,\
    \ which performs action as long as the condition is true.\n\n**Syntax:**\n\n```java\n\
    while(condition)\n{\n    Do something while condition is true;\n}\n```\n\n###\
    \ Do - while ()\n\nThis too is an iteration operation, quite similar to the `while()`\
    \ loop, the difference being that the loop will execute at least once irrespective\
    \ of the validity of the condition, because the condition is evaluated only after\
    \ the `do` statement.\n\n**Syntax:**\n\n```java\ndo{\n    do Something;\n}while(condition);\n\
    ```\n\n### For loop\n\n**Syntax:** `for ( initialization ;condition; counter updation)`\n\
    \n**Example:** `for (int i=0; i<5; i++)`\n\nThis will now execute the statement\
    \ for exactly 5 times. The first part declares and initializes a value to the\
    \ counter variable, the second part checks the condition, if true, it enters loop.\
    \ On completion of loop, it performs the increment. Then it again checks the condition\
    \ and continues the same steps till the condition turns false. Once the condition\
    \ is false, it exits out of the loop.\n"
