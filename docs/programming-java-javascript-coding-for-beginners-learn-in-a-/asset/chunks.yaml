    \n2 * 9 = 18\n\n2 * 10 = 20\n\nExample 3 : Program to print triangle of numbers\n\
    \nclass NestedDOWhileLoop\n\n{\n\n public static void main(String args[])\n\n\
     {\n\nint i=1, j=1;\n\ndo\n\n{\n\nk = 3;\n\ndo\n\n{\n\n       System.out.println(\"\
    \ \");\n\nk--;\n\n}while(k>=i);\n\nj = 1;\n\ndo\n\n{\n\nSystem.out.println(i +\
    \ \" \");\n\nj++:\n\n}while(j<=i);\n\nSystem.out.println(\"\");\n\ni++;\n\n       }while(i<=5);\n\
    \n }\n\n}\n\nOutput\n\n    1\n\n   2 2\n\n  3 3 3\n\n# Chapter 5: Encapsulation\n\
    \nEncapsulation, as the name suggests, capsules the data. In simpler words, it\
    \ hides the dada, thereby providing data security.\n\nArguments passed can be\
    \ either by value or reference. The data type is declared after determining which\
    \ one to use.\n\nA method of the class is accessed by the object using the dot\
    \ (.) operator.\n\nMovie m1 = new Movie()\n\nM1.printName(); //print the name\
    \ of the movie\n\nOr M1.play(count);  //play the movie n times\n\nIn the following\
    \ example, a getter is used to read the value of a class variable and then set\
    \ a value to the variable.\n\npublic class GetterSetter{\n\n//Declaring instance\
    \ variables\n\n   private String name;\n\n   private int age;\n\n//getters\n\n\
      public int getAge(){\n\n      return age;\n\n   }\n\n   public String getName(){\n\
    \n      return name;\n\n   }\n\n//setters\n\n   public void setAge( int newAge){\n\
    \n      age = newAge;\n\n   }\n\n   public void setName(String newName){\n\n     \
    \ name = newName;\n\n   }\n\n}\n\n//class to test the getter and setter methods\n\
    \n         public class TestGetterSetter{\n\n                    public static\
    \ void main(String args[]){\n\nTestGetterSetter gs = new TestGetterSetter();\n\
    \ngs.setName(“John”);\n\ngs.setAge(30);\n\nSystem.out.println(\"Your name is:\
    \ \"+gs.getName());\n\nSystem.out.println(\"Your age is: \"+getAge());\n\n}\n\n\
    }\n\nOutput :\n\nYour name is: John\n\nYour age is: 3\n\n# Chapter 6: Polymorphism\
    \ and Inheritance\n\nIn Java, polymorphism can be defined as the ability of a\
    \ single object to take on multiple forms. In object oriented programming, polymorphism\
    \ occurs when a child class object uses the reference of its parent class object.\n\
    \nAny object that has the ability to pass more than a single IS-A relation can\
    \ be considered polymorphic. In other words, every object in Java is polymorphic,\
    \ as it will have an IS-A relation with its own type and the class object.\n\n\
    Using the reference by variable is the only way to access an object in Java. And\
    \ that reference variable can only be of a particular type. Once the variable\
    \ is declared, the type of that reference variable stays the same and cannot be\
    \ changed.\n\nIf the reference variable is not declared final, we can reassign\
    \ that reference variable to other objects. The methods that different valuable\
    \ can invoke on a given object depends on the type of the reference variable declared.\n\
    \nAny object of a given declared type or subtype can be referred using that reference\
    \ variable. Here is an example showing the polymorphic behavior.\n\nExample:\n\
    \npublic interface Vegetarian{}\n\npublic class Animal{}\n\npublic class Deer\
    \ extends Animal implements Vegetarian{}\n\nHere, the deer class can be said to\
    \ be polymorphic as it has multiple inheritance to it. The following statements\
    \ are true for the example given above.\n\n*   A Deer IS-A Animal\n\n*   A Deer\
    \ IS-A Vegetarian\n\n*   A Deer IS-A Deer\n\n*   A Deer IS-A Object\n\nThe following\
    \ declarations will be lethal when we apply the deer object reference to the reference\
    \ variable facts.\n\nDeer d = new Deer();\n\nAnimal a = d;\n\nVegetarian v = d;\n\
    \nObject o = d;"
