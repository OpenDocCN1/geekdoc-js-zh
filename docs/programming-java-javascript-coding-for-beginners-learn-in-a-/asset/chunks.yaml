    \n## Wrapper Classes\n\nAs we know, Java is an object oriented programming language\
    \ and everything in Java can be viewed as an object. Anything from simple files,\
    \ images, an address of a system, etc. can all be considered as objects in Java.\
    \ We can change the date of type of an object using the wrapper classes. In this\
    \ tutorial we will look into the wrapper classes and their details. Using Wrapper\
    \ classes, you can convert any given data type into an object.\n\nAll the primitive\
    \ datatypes in Java are not objects. These primitive data types don't belong to\
    \ any class. These are defined in the Java language itself. We may encounter situations\
    \ where we will have two changes these primitive data types into objects. What\
    \ example, you can add a data type to vector or a stack by converting it into\
    \ an object. The Java design introduced wrapper classes for making these conversions.\n\
    \nAbout wrapper classes\n\nAs the name suggests, wrapper classes enclose (wrap)\
    \ around any data type to give it an appearance of an object and it can be used\
    \ whenever the data type is needed. This is a process that can be reversed. Wrapper\
    \ classes can not only change the data types into classes but also can un-wrap\
    \ the object and return back the data type. This is just like chocolate wrapper\
    \ on the chocolate. The manufacturer wraps the chocolate in the wrapper and ships\
    \ it. The use of removes the wrapper for having the chocolate.\n\nIt is have a\
    \ look at the following conversion where the int datatype is converted into an\
    \ object.\n\nint k = 100;\n\nInteger it1 = new Integer (k);\n\nIn the above example,\
    \ the int data type k, using wrapper classes, is converted into an object it1\\\
    . This is done by using the integer class. And whenever K is required, the object\
    \ it1 can be used.\n\nThe following code shows you how to wrap the object and\
    \ get the int datatype from the integer object it1\\.\n\nint m = it1.intValue();\n\
    \nSystem.out.println(m*m); // prints 10000\n\nList of Wrapper classes\n\nIn the\
    \ Java language, there are 8 data types present and for each of them have their\
    \ own wrapper classes.\n\n| Primitive data type | Wrapper class |\n\n| byte |\
    \ Byte |\n\n| short | Short |\n\n| int | Integer |\n\n| long | Long |\n\n| float\
    \ | Float |\n\n| double | Double |\n\n| char | Character |\n\n| Boolean | Boolean\
    \ |\n\nAll the wrapper classes can be found in the java.lang package. They are\
    \ placed there so that they can be made available implicitly to the programmer\
    \ whenever imported. To avoid inheritance, the Java designers made these wrapper\
    \ classes as final.\n\nImportance of Wrapper classes\n\nWe use wrapper classes\
    \ for serving two purposes.\n\n*   For converting simple data types into objects.\
    \ This is done by giving the object form to a given data type.\n\n*   For converting\
    \ the strings into data types. For this type of conversion we use the methods\
    \ like parseXXX().\n\nHere there is an example program showing the conversion\
    \ of a datatype to an object and also retrieving the data type from at the same\
    \ time.\n\npublic class WrappingUnwrapping\n\n{\n\n public static void main(String\
    \ args[])\n\n {                                                                         //\
    \  data types\n\n   byte grade = 2;\n\n   int marks = 50;\n\n   float price =\
    \ 8.6f;                                            // observe a suffix of <strong>f</strong>\
    \ for float\n\n   double rate = 50.5;\n\n                                                             //\
    \ data types to objects                           \n\n   Byte g1 = new Byte(grade);\
    \                    // wrapping  \n\n   Integer m1 = new Integer(marks);\n\n\
       Float f1 = new Float(price);\n\n   Double r1 = new Double(rate);\n\n                                                                   //\
    \ let us print the values from objects             \n\n   System.out.println(\"\
    Values of Wrapper objects (printing as objects)\");\n\n   System.out.println(\"\
    Byte object g1:  \" + g1);\n\n   System.out.println(\"Integer object m1:  \" +\
    \ m1);\n\n   System.out.println(\"Float object f1:  \" + f1);\n\n   System.out.println(\"\
    Double object r1:  \" + r1);\n\n                     // objects to data types\
    \ (retrieving data types from objects)\n\n   byte bv = g1.byteValue();                 //\
    \ unwrapping\n\n   int iv = m1.intValue();\n\n   float fv = f1.floatValue();\n\
    \n   double dv = r1.doubleValue();\n\n                                                                   //\
    \ let us print the values from data types             \n\n   System.out.println(\"\
    Unwrapped values (printing as data types)\");\n\n   System.out.println(\"byte\
    \ value, bv: \" + bv);\n\n   System.out.println(\"int value, iv: \" + iv);\n\n\
       System.out.println(\"float value, fv: \" + fv);\n\n   System.out.println(\"\
    double value, dv: \" + dv);\n\n }\n\n}\n\n# Chapter 4: Control Statements             \n\
    \nThe control statements in a program, as the name itself suggests, control the\
    \ general flow of every program. It includes conditional statements like if else,\
    \ or iteration statements like while (), do while() etc.\n\n![](images/00003.jpeg)\n\
    \nIf else :\n\nSyntax :\n\n               if(condition)\n\n                      \
    \ do action1;\n\n                else\n\n                      do action2;\n\n\
    An action is taken when the ‘condition’ is true, or else the action in the else\
