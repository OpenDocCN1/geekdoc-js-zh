    B:/myfile.txt\");\n      int k;\n      /*Method read() of FileInputStream class\
    \ also throws\n          * a checked exception: IOException*/\n      while(( k\
    \ = fis.read() ) != -1)\n      {\n          System.out.print((char)k);\n     \
    \ }\n      /*The method close() closes the file input stream\n          * It throws\
