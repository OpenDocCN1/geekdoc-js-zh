    # Chapter 8: Type Casting\n\n### Type casting by object\n\nIn Java, you can cast\
    \ an object reference into a different object reference. This is called type casting.\
    \ Type casting is not limited to the class itself. You can cast superclass or\
    \ subclass types or interfaces. For type casting there are both compile time and\
    \ runtime rules. When typecasting for a given object, reference of any object\
    \ can be assigned. This is because the object class we use is the superclass of\
    \ every class in Java. There are two types of casting:\n\n*   Upcasting\n*   Down\
    \ casting\n\nTypecasting can be done implicitly or explicitly. It will be an implicit\
    \ casting if the casting is done from a lower data structure to a higher structure.\
    \ Java does not perform down casting on its own. Down testing should be done explicitly\
    \ by the user. Type Casting from a higher structure to data structure should be\
    \ done carefully as it involves lots of data if it is made forcibly. The Java\
    \ virtual machine performs upcasting when needed. For example if there are a few\
    \ data types of which one of them is a higher data type, the JVM will cast all\
    \ the other lower data types to the higher data type. Performing down casting\
    \ on the case above will result in loss of data object. During the runtime, there\
    \ may arise a situation called the `ClassCastException`, where the object on which\
    \ type casting is cast is not compatible with the other type with which it is\
    \ being cast to. Here is an example explaining `ClassCastException`.\n\nExample:\n\
