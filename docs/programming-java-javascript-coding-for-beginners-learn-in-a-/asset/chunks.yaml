  trans: "\n\nJava 和 JavaScript 唯一相似之处是它们的名字听起来相似。在功能和概念方面，这两种语言是完全不同的。JavaScript\
    \ 脱颖而出于 `Java` 和 `C++` 等面向对象编程语言之处在于，它的对象可以在运行时创建或修改。为了实现这一点，可以在空对象上添加方法（Methods）和属性（properties）。创建的对象可以在创建其他相似对象的过程中像原型一样使用。变量参数列表、源码恢复、动态脚本创建、动态对象创建函数变量等都是\
    \ JavaScript 拥有的动态能力。\n\n# JavaScript 基础\n\n## 在 JavaScript 中存储数据\n\n- **本地存储\
    \ (Local Storage)**：本地存储用于永久存储数据。通过这种方式，可以随时访问页面上的数据。本地存储没有过期时间。如果用户希望数据在一段时间内被重复使用，可以使用本地存储。\n\
    - **会话存储 (Session Storage)**：会话存储与本地存储不同，因为它只保留单个会话的数据，并在用户关闭页面后丢弃数据。这种存储用于用于订票等网页上。\n\
    \n### 使用变量数据和常量数据存储数据\n\n变量（Variables）和常量（Constants）存储 JavaScript 中使用的数据和值。它们在\
    \ JavaScript 中都有自己的重要性。并非所有存储的数据都可以变为常量。时间倒计时等过程使用变量，而常量则用于不变的数据。\n\n- **变量数据\
    \ (Variable Data)**：顾如其名，这种随时间改变值的数据被称为变量数据。这种数据在 JavaScript 中被广泛使用。变量本质上是动态的。\n\
    - **常量数据 (Constant Data)**：常量数据是永远不会改变值的东西。这种数据将随时间保持不变。这种数据是静态的。我们使用这种数据处理无法修改的数据。\n\
    \n## 创建变量和常量\n\n### 声明变量\n\n通过在名称前加上 `var` 关键字来声明变量。例如，如果你想声明 `group` 为变量，只需在\
    \ `group` 之前添加 `var` 关键字。每个变量都应该以 `;`（分号）结尾。这使得语句是自包含的。在使用单词时需要小心，因为 JavaScript\
    \ 是区分大小写的。因此，使用的字母必须与原始声明中的字母完全一致。\n\n例：\n```javascript\nvar Dell;\n```\n上面的对象\
    \ `Dell` 被声明为一个变量。\n\n### 声明常量\n\n在名称之前使用 `const` 关键字使其变为常量。这种声明与声明常量非常相似。\n\n\
    例：\n```javascript\nconst Book;\n```\n在上面的示例中，`Book` 被制为了常量。\n\n## JavaScript 中的决策判断\n\
    \n总是会出现我们必须在面前的两个路径中选择一个的情况。这时我们能够实现如 `if` 和 `else` 之类的条件语句。\n\n`if` 和 `else`\
    \ 语句可以决策。这将允许程序选择正确的路径。\n\nJavaScript 支持以下条件语句：\n1. `if` 语句\n2. `if...else` 语句\n\
    3. `if...else if...` 语句\n\n**if 语句**：`if` 是用于决策的基础性语句。在 `if` 语句中添加一个条件，如果给定的条件成立，则给出一组语句。\n\
    \n语法：\n```javascript\nif(condition){\n  要执行的语句\n}\n```\n示例：\n```html\n<script\
    \ type=\"text/javascript\">\n<!--\nvar age = 20;\nif( age > 18 ){\n  document.write(\"\
    <b>Allowed inside the pub.</b>\");\n}\n//-->\n</script>\n```\n输出：Allowed inside\
    \ the pub. (如果给出的数字大于 18)\n\n**if else 语句**：这是 `if` 语句的扩展。如果 `if` 语句为假，系统将运行代码并执行\
    \ `else` 块中的语句。\n\n语法：\n```javascript\nif(condition)\n  {语句}\nelse{语句}\n```\n\
    示例：\n```html\n<script type=\"text/javascript\">\n<!--\nvar age = 15;\nif( age\
    \ > 18 ){\n  document.write(\"<b>Allowed inside the pub</b>\");\n}else{\n  document.write(\"\
    <b>Is not allowed.</b>\");\n}\n//-->\n</script>\n```\n输出：\n- Allowed inside the\
    \ pub (如果给出的数字大于 18)\n- Not allowed (如果给出的数字小于 18)\n\n**if else if**：这类似于在 `if\
    \ else` 语句中添加了另一个步骤。它用于使用一系列条件的情况。\n\n语法：\n```javascript\nif(condition){语句};\n\
    else if(condition){语句}\nelse if(condition){语句}\nelse{语句}\n```\n示例：\n```html\n\
    <script type=\"text/javascript\">\n<!--\nvar book = \"JAVASCRIPT\";\nif( book\
    \ == \"JAVA\" ){\n  document.write(\"<b>JAVA Book</b>\");\n}else if( book == \"\
    JAVASCRIPT\" ){\n  document.write(\"<b>JAVASCRIPT Book</b>\");\n}else if( book\
    \ == \"DBMS\" ){\n  document.write(\"<b>DBMS Book</b>\");\n}else{\n  document.write(\"\
    <b>UNKNOWN Book</b>\");\n}\n//-->\n</script>\n```\n输出：JAVASCRIPT book\n\n### 嵌套\
    \ if (The nested if)\n`嵌套 if` 是另一个 `if` 语句内部的 `if` 语句。\n\n语法：\n```javascript\n\
    if(condition){语句}\n```\n\n### switch\n`switch` 根据表达式的值有不同的语句。\n\n语法：\n```javascript\n\
    switch (expression)\n{\n  case 1:\n    语句\n  case 2:\n    语句\n  default:\n   \
    \ 语句\n}\n```\n\n## JavaScript 中的循环\n\n### for 循环\n如果人们希望代码重复执行，则使用循环。`for` 循环是可以使用三种循环之一。`for`\
    \ 循环简单且紧凑。它包含以下点：\n1. 初始化语句在循环开始之前执行。\n2. 只有当给定的条件为真时，循环才会执行，运行一次代码。\n3. 迭代计数器可以增加或减少。\n\
    \n语法：\n```javascript\nfor (初始化; 测试条件; 迭代){\n  当条件为真时执行的语句\n}\n```\n示例：\n```html\n\
    <script type=\"text/javascript\">\n<!--\nvar count;\ndocument.write(\"This will\
    \ repeat for 10 times\" + \"<br />\");\nfor(count = 0; count < 10; count++){\n\
    \  document.write(\"Currently repeated : \" + count );\n  document.write(\"<br\
    \ />\");\n}\ndocument.write(\"Done!!\");\n//-->\n</script>\n```\n输出：\nThis will\
    \ repeat for 10 times\nCurrently repeated : 0\nCurrently repeated : 1\nCurrently\
    \ repeated : 2\nCurrently repeated : 3\nCurrently repeated : 4\nCurrently repeated\
    \ : 5\nCurrently repeated : 6\nCurrently repeated : 7\nCurrently repeated : 8\n\
    Currently repeated : 9\nDone!!\n\n# 第 11 章：JavaScript 中的函数和事件\n\n## 什么是函数？\n在程序任何地方调用时都可以重复使用的代码组被称为函数。它减少了人们重复编写相同代码的时间和精力。这减少了代码冗余。可以通过函数编写模块化代码。函数如\
    \ `write()` 和 `alert()` 是默认函数。JavaScript 为用户提供了许多可以直接使用的函数。JavaScript 还允许我们创建自己的自定义函数。\n\
    \n### 函数定义\n函数在使用之前应该先进行定义。`function` 关键字是定义 JavaScript 函数的常用方法。它后面跟着唯一的函数名称和参数列表。\n\
    \n语法：\n```html\n<script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list)\n\
    {\n  语句\n}\n//-->\n</script>\n```\n\n"
- fmt: "\nEXAMPLE: In the example given below, there is a simple functions program.\n\
    \n```javascript\nfunction simplefunction()\n{\n  alert(\"This is a simple function\"\
    );\n}\n```\n\n### Calling a Function\n\nTo call a function in javascript, the\
    \ name of that function should be written as follows.\n\n```javascript\nsimplefunction();\n\
    ```\n\n### Parameters of a function:\n\nIn JavaScript a function can be passed\
    \ with parameters too. Different parameters can be passed in JavaScript while\
    \ it is calling a function. Manipulation can be done by the passed parameters,\
    \ which are in a function. Comma is used to separate multiple parameters in a\
    \ function.\n\n#### Example:\n\nHere in the following example, we will modify\
    \ our `simplefunction` function. Now we will make use of two parameters.\n\n```javascript\n\
    function simplefunction(name, age)\n{\n  alert( name + \" is \" + age + \" years\
    \ old.\");\n}\n```\n\nThe function can be called. And it can be called as given\
    \ below.\n\n```javascript\nsimplefunction('Zara', 7 );\n```\n\n### The return\
    \ Statement:\n\nAn optional `return` statement can be added to a JavaScript function\
    \ if the user desires a return value from that function. A `return` statement\
    \ should always be the last statement of the function.\n\nFor example, the user\
    \ may pass two different numbers in a particular function and from them he can\
    \ expect the function to return the product of those two numbers in the program.\n\
    \n#### EXAMPLE:\n\n```javascript\nfunction concatenate(first, last)\n{\n  var\
    \ full;\n  full = first + last;\n  return full;\n}\n```\n\nNow the function can\
    \ be called as follows:\n\n```javascript\nvar result;\nresult = concatenate('Zara',\
    \ 'Ali');\nalert(result );\n```\n\n## Events in JavaScript\n\n#### EVENT:\n\n\
    Events handle the interactions between JavaScript and HTML. This is done when\
    \ a page is manipulated by the user or a browser.\n\nEverything is an event. The\
    \ loading of a page is an event. When the user selects something by clicking,\
    \ that click is considered an event too. Infact any action done by the user like\
    \ closing a window, selecting a link, pressing a key, closing a tab, resizing\
    \ a window, etc. are all examples of events.\n\nThe responses that are coded in\
    \ JavaScript are executed using these events like closing windows, text to be\
    \ displayed, alerts displayed, confirmation messages or any type of response that\
    \ is possible to happen.\n\nThe events are part of the Document Object Model (DOM)\
    \ Level3. A set of events are provided to every HTML element. Those events trigger\
    \ the code in JavaScript.\n\n#### The onclick event type:\n\nThis is an event,\
    \ when clicked, displays desired validation or a warning etc. This very widely\
    \ used.\n\nEXAMPLE: The below code, when the hello button on the onclick is clicked,\
    \ it triggers the `events` function.\n\n```html\n<html>\n<head>\n<script type=\"\
    text/javascript\">\nfunction events() {\n  alert(\"Hello World\")\n}\n</script>\n\
    </head>\n<body>\n<input type=\"button\" onclick=\"sayHello()\" value=\"Say Hello\"\
    \ />\n</body>\n</html>\n```\n\n#### onsubmit event type:\n\nThe `onsubmit` event\
    \ is another important event type. Validation occurs when submit a form here.\
    \ The text will only be sent if the function returns `true`.\n\nEXAMPLE:\n\n```html\n\
    <html>\n<head>\n<script type=\"text/javascript\">\nfunction validation() {\n \
    \ all validation goes here\n  .........\nreturn either true or false\n}\n</script>\n\
    </head>\n<body>\n<form method=\"POST\" action=\"t.cgi\" onsubmit=\"return validate()\"\
    >\n.......\n<input type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n\
    ```\n\n# Chapter 12: Debugging in JavaScript\n\nThere are many chances of making\
    \ a mistake while writing a program. Such mistakes in a script are referred as\
    \ bugs.\n\nDebugging is a process of fixing bugs. In the development process debugging\
    \ is a normal part. The code we write might have logical errors or syntax errors,\
    \ which are difficult to identify. Many times, nothing will happen when JavaScript\
    \ code contains errors. No messages will indicate that there’s an error in the\
    \ program.\n\n## Using a JavaScript Validator\n\nIf one wants to check code for\
    \ bugs, then one must make sure that it is a valid code and check it if follows\
    \ the official syntax rules of the language by running it using a program called\
    \ Validating parsers, or in short, just Validators. They often come with JavaScript\
    \ editors and commercial HTML editors.\n\nAfter visiting the web page, click on\
    \ the `jslint` button once you paste the code in the text area. This program will\
    \ parse through our JavaScript code to ensure that all variables and function\
    \ definitions are in correct syntax.\n\n## Adding Debugging Code to Your Programs:\n\
    \nThe `alert()` or `document.write()` methods helps in debugging your code. For\
    \ example:\n\n```javascript\nvar debugging = true;\nvar whichImage = \"widget\"\
    ;\nif( debugging )\n  alert( \"Calls swapImage() with argument: \" + whichImage\
    \ );\nvar swapStatus = swapImage( whichImage );\nif( debugging )\n  alert( \"\
    Exits swapImage() with swapStatus=\" + swapStatus );\n```\n\n## Using a JavaScript\
    \ Debugger\n\nA debugger is an application that gives the programmer a control\
    \ over the execution of the script.\n\nDebugger facilitates the user to examine\
    \ the flow control. The script is run line by line and can be instructed to stop\
    \ at particular breakpoints. The programmer can check the script’s state and the\
    \ variables after the execution completes.\n\n## Form Validation\n\nAfter the\
    \ client enters the required information and clicks the submit button, form validation\
    \ occurs. The server must send all the data again to the user and request the\
    \ user to resubmit the form with correct or valid information. This occurs, if\
    \ the user fails to enter all of the required information or if he enters invalid\
    \ data.\n\nBefore sending the form to the web browser, JavaScript facilitates\
    \ the validation of the form’s data on the client’s computer itself.\n\nTwo functions\
    \ will be generally performed by the form validation:\n\n*   Basic Validation\
    \ - To ensure that the data has been provided into every mandatory field, first\
    \ the form needs to be checked. To check the data, it needs to loop through each\
    \ field.\n*   Validation of the Data Format – This is to check if correct or valid\
    \ data has been entered in the form.\n\n### Basic Form Validation:\n\nLet us see\
    \ how a basic form validation is performed. We call the `validate()` function\
    \ to validate data when submit event occurs. `validate()` function is implemented\
    \ as follows:\n\n```javascript\nfunction validate()\n{\n// Form validation code\
    \ will come here\n  if( document.myForm.Name.value == \"\" )\n  {\n    alert(\
    \ \"Please enter your name!\" );\n    document.myForm.Name.focus() ;\n    return\
    \ false;\n  }\n  if( document.myForm.EMail.value == \"\" )\n  {\n    alert( \"\
    Please enter your Email id!\" );\n    document.myForm.EMail.focus() ;\n    return\
    \ false;\n  }\n  if( document.myForm.Zip.value == \"\" || isNaN( document.myForm.Zip.value\
    \ ) || document.myForm.Zip.value.length != 5 )\n  {\n    alert( \"Please enter\
    \ the zip in the format #####.\" );\n    document.myForm.Zip.focus() ;\n    return\
    \ false;\n  }\n  if( document.myForm.Country.value == \"-1\" )\n  {\n    alert(\
    \ \"Please enter your country name!\" );\n    return false;\n  }\n  return( true\
    \ );\n}\n```\n\n### Data Format Validation\n\nValidation of the data can be done\
    \ before submission of the data to the web server. Validating an email id means\
    \ the email id should contain an `@` sign and a dot (`.`), can be seen in the\
    \ below given example.\n\nAlso, the last dot should be minimum one character after\
    \ the `@` sign, and the email address shouldn’t begin with an `@` symbol.\n\n\
    ```javascript\nfunction validateEmail()\n{\n  var emailID = document.myForm.EMail.value;\n\
    \  atpos = emailID.indexOf(\"@\");\n  dotpos = emailID.lastIndexOf(\".\");\n \
    \ if (atpos < 1 || ( dotpos - atpos < 2 ))\n  {\n```\n"
