  trans: "\n\n这在 `java.util.ArrayList` 包中可用。\n\n```java\nArrayList<String> myList\
    \ = new ArrayList<String>();\n```\n\n它允许声明不同数据类型的数组。它提供了多种方法来执行常见的数组操作，如 `add(elem)`\
    \ `remove(index)`，用于从 `arrayList` 中添加/删除元素。此外还有如 `size()` 等 API 可以查找数组的长度，判断是否\
    \ `isEmpty()`，或者 `arrayList` 是否 `contains()` 给定的元素。\n\n让我们来看一个使用目前所学概念的示例：\n\n\
    ```java\nClass MyProgram{\n\npublic static void main(Strings[] args)\n{\n//声明并赋值变量\n\
    \    int  num = 10;  \n    float fNum = 10.5;\n    //打印语句输出到控制台\n    System.out.println(“The\
    \ value of integer num is : ”+num);\n    System.out.println(“The Value of integer\
    \ fNum is : ”+fNum);\n    num = num/2;\n    fNum = fNum+num;\n    System.out.println(“The\
    \ value of integer num after operation is : ”+num);\n    System.out.println(“The\
    \ Value of integer fNum after operation is : ”+fNum);\n}\n}\n```\n\n输出：\nThe value\
    \ of integer num is : 10\nThe value of integer fNum is : 10.5\nThe value of integer\
    \ num after operation is : 5\nThe value of integer fNum after operation is  :\
    \ 20.5\n\n你只需要在 SoP (`System.out.println`) 语句中使用 `+` 运算符即可。\n\n## 包装类 (Wrapper\
    \ Classes)\n\n众我们所知，Java 是一种面向对象的编程语言，Java 中的一切都可以被视为对象。从简单的文件、图像到系统地址等，任何内容在\
    \ Java 中都可以被对象。我们可以使用包装类来更改对象的类型。在本教程中，我们将介绍包装类及其细节。通过包装类，你可以将任何给定的数据类型转换为对象。\n\
    \nJava 中的所有基本数据类型都不是对象。这些基本数据类型不属于任何类，它们定义在 Java 语言本身中。我们可能会遇到将这些基本数据类型转换为对象的情况。例如，你可以通过将数据类型转换为对象来添加到向量（vector）或栈（stack）中。Java\
    \ 设计引入了包装类来完成这些转换。\n\n### 关于包装类\n\n正如其名所示，包装类包裹（wrap）了任何数据类型，使其具有对象的外观，并在需要该数据类型时可以使用它。这是一个可以逆转的过程。包装类不仅可以将数据类型转换为类，还可以解包装对象并返回数据类型。这就像巧克力上的包装纸一样。制造商将巧克力包装在包装纸里并出货。用户在使用时去除包装纸以获得巧克力。\n\
    \n来看下面的转换示例，其中 `int` 数据类型被转换为对象。\n\n```java\nint k = 100;\nInteger it1 = new Integer\
    \ (k);\n```\n\n在上面的示例中，int 数据类型 `k` 使用包装类转换成了对象 `it1`。这是通过使用 `integer` 类实现的。每当需要\
    \ `K` 时，就可以使用对象 `it1`。\n\n下面的代码展示了如何封装对象并从整数对象 `it1` 获取 int 数据类型。\n\n```java\n\
    int m = it1.intValue();\nSystem.out.println(m*m); // 打印 10000\n```\n\n### 包装类列表\n\
    \n在 Java 语言中，存在 8 种数据类型，每类型都有对应的包装类。\n\n| 基本数据类型 | 包装类 |\n| :--- | :--- |\n| byte\
    \ | Byte |\n| short | Short |\n| int | Integer |\n| long | Long |\n| float | Float\
    \ |\n| double | Double |\n| char | Character |\n| Boolean | Boolean |\n\n所有的包装类都可以在\
    \ `java.lang` 包中找到。它们被放置在那里是为了在每次导入时可以隐式地对程序员可用。为了避免继承，Java 设计师将这些包装类设为 `final`。\n\
    \n### 包装类的重要性\n\n我们使用包装类有两个目的：\n\n- 将简单数据类型转换为对象。这是通过给给定的数据类型对象的形式来实现。\n- 将字符串转换为数据类型。对于此类转换，我们使用如\
    \ `parseXXX()` 等方法。\n\n这里有一个示例程序，展示了将数据类型转换为对象以及同时获取数据类型。\n\n```java\npublic class\
    \ WrappingUnwrapping\n{\n public static void main(String args[])\n {\n   //  数据类型\n\
    \   byte grade = 2;\n   int marks = 50;\n   float price = 8.6f; // 观察 float 的后缀\
    \ f\n   double rate = 0.5; // 数据类型转对象\n   Byte g1 = new Byte(grade); // 封装\n \
    \  Integer m1 = new Integer(marks);\n   Float f1 = new Float(price);\n   Double\
    \ r1 = new Double(rate);\n   // 让我们从对象打印值\n   System.out.println(\"Values of objects\
    \ (printing as objects)\");\n   System.out.println(\"Byte object g1: \" + g1);\n\
    \   System.out.println(\"Integer object m1: \" + m1);\n   System.out.println(\"\
    Float object f1: \" + f1);\n   System.out.println(\"Double object r1: \" + r1);\n\
    \   // 从对象中获取数据类型\n   byte bv = g1.intValue(); // 解封装\n   int iv = m1.intValue();\n\
    \   float fv = f1.intValue();\n   double dv = r1.intValue();\n}\n}\n```\n\n# 第\
    \ 4 章：控制语句 (Control Statements)\n\n程序中的控制语句，正如其名所示，控制程序的整体执行流。它包含了 `if else` 等条件语句以及\
    \ `while()`、`do while()` 等迭代语句。\n\n### if else\n\n**语法：**\n\n```java\nif(condition)\n\
    \    do action1;\nelse\n    do action2;\n```\n当 `condition` 为真时执行操作，否则执行 `else`\
    \ 部分。\n\n### Switch case\n\n当你需要检查多个条件时，这种操作非常有用。Switch case 根据给定的值采取操作。\n\n**语法：**\n\
    \n```java\nSwitch(id)\n{\n    Case id1:\n        Action;\n        Break;\n   \
    \ Case id2:\n        Action;\n        Break;\n    Default:\n        \n}\n```\n\
    \n### while ()\n\n这是一个迭代语句，只要条件为真就会执行操作。\n\n**语法：**\n\n```java\nwhile(condition)\n\
    {\n    当条件为真时执行操作\n}\n```\n\n### Do - while ()\n\n这也是迭代操作，与 `while()` 循环非常相似，区别在于无论条件是否，循环都会执行一次，因为条件是在\
    \ `do` 语句之后才评估的。\n\n**语法：**\n\n```java\ndo{\n    执行操作\n}while(condition);\n```\n\
    \n### for 循环\n\n**语法：** `for ( 初始化 ; 条件; 计数器更新)`\n\n**示例：** `for (int i=0; i<5;\
    \ i++)`\n\n这将精确执行语句 5 次。第一部分声明并初始化计数器变量的值，第二部分检查条件，如果为真则进入循环。循环完成后，执行递增。然后再次检查条件并重复相同的步骤，直到条件变为假。一旦条件为假，就会退出循环。\n\
    \n"
- fmt: "\nThe Value of integer `Num` is :3\n\nThe Value of integer `Num` is :2\n\n\
    The Value of integer `Num` is :1\n\nThe Value of integer `Num` is :5\n\nThe Value\
    \ of integer `Num` is :5\n\nThe Value of integer `Num` is :5\n\nThe Value of integer\
    \ `Num` is :5\n\nThe Value of integer `Num` is :5\n\nThe above stated program\
    \ used two looping statements to perform the operations.\n\n### Differences between\
    \ `for` and `while` loops\n\nAs you know, the `for` loop has three parts. They\
    \ are Initialization, Boolean set and iteration expression. Here in the `while`\
    \ loop there will be no built-in initialization or iteration expressions. It consists\
    \ of only the Boolean test. `while` loops are good to be used when you don't know\
    \ the number of iterations in which the condition will return true. The number\
    \ of iterations is known, it is wise to use the `for` loop as it is cleaner.\n\
    \nHere is an example where a simple `while` loop is used.\n\nExample:\n\n```java\n\
    public class Test {\n  public static void main(String args[]) {\n    int x = 10;\n\
    \    while( x < 20 ) {\n      System.out.print(\"value of x : \" + x );\n    \
    \  x++;\n      System.out.print(\"\\n\");\n    }\n  }\n}\n```\n\nOutput:\n\n```\n\
    value of x : 10\nvalue of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x\
    \ : 14\nvalue of x : 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue\
    \ of x : 19\n```\n\n### More about `for` loops\n\nHere we will look into the details\
    \ of loops. We will look at the `for` loop now. Each `for` loop consists of three\
    \ parts. They are:\n\n- Initialisation: Here in the initialisation part, we will\
    \ declare and initialise the loo with a suitable variable. We use this within\
    \ the body of the loop. This variable that we use in the loop will be mostly used\
    \ as a counter. The number of variables that can be placed inside a loop is not\
    \ just limited to 1. You can place any number of variables that can be used as\
    \ counters in the body of the loop.\n- Boolean set: The conditional test will\
    \ be placed in this part of the loop. The given condition, whatever it maybe,\
    \ must resolve to a Boolean value. You can give an expression or you can use methods\
    \ which return Booleans.\n- Iteration expression: in this part of the loop, you\
    \ can place one or more desired actions that you want to happen every time the\
    \ loop is run. Always keep in mind that the execution will only happen at the\
    \ end of the loop.\n\n### Nested `for` loop\n\nYou can place a `for` loop inside\
    \ another `for` loop. This arrangement is called as the nested for loop. You can\
    \ place any number of loops inside loops. But it is advised not to go beyond five\
    \ or six levels of nested loops as it will make the program look clumsy. The odometer\
    \ of the car works the same principle of the nested for loop. Another example\
    \ of this is the date or calendar. As we all know, the day consists of hours,\
    \ minutes and seconds. In a digital clock, the last branch of the nested for loop\
    \ is the seconds counter. Above it we have the minute counter. About the minutes\
    \ counter we have the hour counter. It is a nested loop in a nested loop in a\
    \ nested loop. First the syntax of the nested for loops is given below. There\
    \ are three forms in for loops. They are:\n\nForm 1 syntax:\n\n```java\nfor(initialization;\
    \ test; increment)\n{\n  statements;\n  while(expression)\n  {\n    statements;\n\
    \  }\n  do\n  {\n    statements;\n  }while(expression);\n}\n```\n\nForm 2 syntax:\n\
    \n```java\nfor(initialization; test; increment)\n{\n  statements;\n  for(initialization;\
    \ test; increment)\n  {\n    statements;\n    for(initialization; test; increment)\n\
    \    {\n      statements;\n    }\n  }\n}\n```\n\nForm 3 syntax:\n\n```java\nWhile(expression)\n\
    {\n  statements;\n  While(expression)\n  {\n    statements;\n  }\n}\n```\n\nHere\
    \ are a few examples which will make you understand the working of the nested\
    \ for loops.\n\nExample 1 : Program to display triangle of `*` using nested for\
    \ loop\n\n```java\nclass NestedForLoopDemo {\n  public static void main(String\
    \ args[]) {\n    for(int i = 1; i <=5 ; i++) {\n      for(int j = 1; j <= i; j++)\
    \ {\n        System.out.println(\"* \");\n      }\n      System.out.println(\"\
    \");\n    }\n  }\n}\n```\n\nOutput:\n\n```\n*\n* *\n* * *\n* * * *\n* * * * *\n\
