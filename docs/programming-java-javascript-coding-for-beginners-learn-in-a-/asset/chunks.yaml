    \ Java 中的垃圾回收\n\n在 Java 中，“垃圾”可以定义为未被引用的对象。回收未使用的内存的过程称为垃圾回收。简单来说，垃圾回收意味着销毁所有不再使用的对象。与\
    \ `C` 和 `C++` 不同，垃圾回收是 Java 中的一个自动过程。这是 Java 为用户提供更好、更高效管理的原因之一。\n\n垃圾回收的优点：\n\
    \n*   垃圾回收通过移除所有未被引用的对象使内存变得高效。这些对象占用了堆内存，垃圾回收会清理这些内存。\n*   用户不需要手动执行垃圾回收，因为 Java\
    \ 中的垃圾处理过程是自动的。因此，我们不需要投入额外精力管理内存。Java 虚拟机会负责清理这些内存。\n\n你可以通过三种方式释放对象，它们是：\n\n\
    *   **置空引用**：通过移除对象的引用可以从堆内存中移除对象。这是一个示例：\n```java\nEmployee e=new Employee();\n\
    e=null;\n```\n*   **将对象的引用赋值给另一个对象**：移除一个对象的引用并将其交给另一个对象，会导致第一个对象失去引用。众所周知，没有引用的对象将被释放。下面的示例显示将对象\
    \ `e1` 的引用交给 `e2`。这使得 `e1` 达到垃圾回收条件。\n```java\nEmployee e1=new Employee();\nEmployee\
    \ e2=new Employee();\ne1=e2;\n```\n*   **使用匿名对象**：这是释放对象的第三种方法。在这里我们将创建一个新对象。\n\
    ```java\nnew Employee();\n```\n\n# 第 8 章：类型转换\n\n### 对象类型转换\n\n在 Java 中，你可以将对象引用转换为不同的对象引用。这被称为类型转换。类型转换不仅限于类本身。你可以转换父类、子类类型或接口。类型转换既有编译时规则也有运行时规则。给定的对象进行转换时，可以分配任何对象的引用。这是因为我们使用的\
    \ `Object` 类是 Java 中所有类的父类。转换有两种类型：\n\n*   向上转型 (Upcasting)\n*   向下转型 (Downcasting)\n\
    \n类型转换可以隐式或显式地进行。如果从低级数据结构转换为高级数据结构，则为隐式转换。Java 不会自动执行向下转型。向下转型必须由用户显式完成。从高级结构到数据结构的类型转换必须小心进行，因为强制执行会涉及大量数据。Java\
    \ 虚拟机会在需要时执行向上转型。例如，如果有几个数据类型，其中一个是高级类型，JVM 将所有其他低级类型转换为高级类型。在上述情况下执行向下转型会导致数据丢失。在运行时，可能会出现名为\
    \ `ClassCastException` 的异常，即被转换的对象与目标类型不兼容。这里有一个解释 `ClassCastException` 的示例。\n\
    \n示例：\n```java\n//X 是 Y 和 Z 的父类，它们是兄弟关系。\n\npublic class RunTimeCastDemo {\n\n\
    \    public static void main(String args[]) {\n        X x = new X();\n      \
    \  Y y = new Y();\n        Z z = new Z();\n        X xy = new Y(); // 编译通过（向上转型）\n\
    \        X xz = new Z(); // 编译通过（向上转型）\n        // Y yz = new Z(); // 类型不兼容（兄弟关系）\n\
    \n        Employee e1=new Employee();\n        Employee e2=new Employee();\n \
    \       e1=e2; // 使 e1 达到垃圾回收条件\n\n        new Employee(); // 释放对象的第三种方法\n\n \
    \       Employee e=new Employee();\n        e=null; // 置空引用\n    }\n}\n```"
