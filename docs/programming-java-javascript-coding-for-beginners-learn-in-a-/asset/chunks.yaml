    Copying values without using constructors


    As we have discussed earlier, we can copy values of an object into a different
    objects without using constructors. In such cases you don''t need to create a
    constructor. You can simply copy by assigning the values of that object to another
    object. Here, the following example we are not using constructors but assigning
    the values for copying.


    Example:


    class Student7{  


       int id;  


       String name;  


       Student7(int i,String n){  


       id = i;  


       name = n;  


       }  


       Student7(){}  


       void display(){System.out.println(id+" "+name);}  


       public static void main(String args[]){  


