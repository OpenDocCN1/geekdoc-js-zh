    \ |\n| `toString()` | 该方法用于返回一个“true”字符串。 |\n| `valueOf()` | 该方法表示数字的值。 |\n\n\
    ## 字符串对象 (String Object)\n\n字符串对象允许用户处理字符。\n\n语法：\n\n可以使用以下语法创建 字符串对象：\n\n| `var\
