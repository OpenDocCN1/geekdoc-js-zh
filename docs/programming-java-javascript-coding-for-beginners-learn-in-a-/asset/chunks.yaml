    \     v.add(username);\n        v.add(password);\n        // String u = v.elementAt(0);\
    \ 无法转换\n        Object u = v.elementAt(0); // 未转换\n        System.out.println(\"\
    Username : \" + u);\n        System.out.println(\"Password : \" + u);\n    }\n\
    }\n```\n"
