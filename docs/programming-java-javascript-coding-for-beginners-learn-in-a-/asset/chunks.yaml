    Exception Handling


    Exception handling is a powerful mechanics in with which runtime errors can be
    handled. Exception handling ensures that the normal flow of the program is maintained.


    A few advantages of exception handling


    *   Exceptional funding will allow the user to control the flow of execution of
    a program if it has exception handling written in it.


    *   Whenever there is an error, it will throw an exception. There are calling
    method will take care of the encounter error.


    *   With exception handling, differentiating and organising different types of
    errors when separate blocks of code are used. The try-catch blocks can be used
    for it.


    Here we will look at a few exception handling examples.


    Example:


    class Division {


     public static void main(String[] args) {


     int a, b, result;


     Scanner input = new Scanner(System.in);


     System.out.println("Input two integers");


     a = input.nextInt();


     b = input.nextInt();


     // try block


     try {


       result  = a / b;


       System.out.println("Result = " + result);


     }


     // catch block


     catch (ArithmeticException e) {


       System.out.println("Exception caught: Division by zero.");


     }


     }


    }


    When an exception is caught, the catch block corresponding to it will be executed.
    From the example problem given above, the code will throw an ArithmeticException.
    There is a simple way with which exceptions can be captured. It is to use the
    object of the exception class as an inherited class of another class. Here is
    an example showing that.


    Example:


    class Exceptions {


     public  static  void main(String[] args) {


     String languages[] = { "C", "C++", "Java", "Perl", "Python" };


     try {


       for (int c = 1; c <= 5; c++) {


         System.out.println(languages[c]);


       }


     }


     catch (Exception e) {


       System.out.println(e);


     }


     }


    }


    Output:


    C++


    Java


    Perl


    Python


    java.lang. ArrayIndexOutOfBoundsException: 5


    Exception handling is a very important mechanism in java and a good java developer
    anticipates the exceptions beforehand and writes handlers for those exceptions
    that might show up.


