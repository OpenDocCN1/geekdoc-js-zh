                                String uname = (String) v.elementAt(0); // cast allowed


                                String pass = (String) v.elementAt(1); // cast allowed


                                System.out.println();


                                System.out.println("Username : " + uname);


                                System.out.println("Password : " + pass);


                  }


    }


