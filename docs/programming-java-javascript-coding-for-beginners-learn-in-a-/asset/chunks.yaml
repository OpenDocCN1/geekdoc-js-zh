    \n### `for` 循环与 `while` 循环的区别\n\n如你所知，`for` 循环包含三个部分：它们是初始化、布尔表达式和迭代表达式。而在 `while`\
    \ 循环中，没有内置的初始化或迭代表达式。它只包含布尔测试。当你不知道条件返回真时需要迭代多少次时，使用 `while` 循环是很好的。如果迭代次数已知，使用\
    \ `for` 循环是更明智的，因为它更简洁。\n\n这里是一个使用简单 `while` 循环的示例。\n\n示例：\n\n```java\npublic\
    \ class Test {\n  public static void main(String args[]) {\n    int x = 10;\n\
    \    while( x < 20 ) {\n      System.out.print(\"value of x : \" + x );\n    \
    \  x++;\n      System.out.print(\"\\n\");\n    }\n  }\n}\n```\n\n输出：\n\n```\n\
    value of x : 10\nvalue of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x\
    \ : 14\nvalue of x : 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue\
    \ of x : 19\n```\n\n#### 关于 `for` 循环的更多\n\n在这里我们将深入循环的细节。现在来看 `for` 循环。每个 `for`\
    \ 循环由三部分组成。它们是：\n\n- 初始化：在初始化部分，我们将使用合适的变量声明并初始化循环。我们在循环体中使用它。循环中使用的变量通常用作计数器。循环内部可以放置的变量不仅限于\
    \ 1 个。你可以在循环体中放置任何数量可以作为计数器的变量。\n- 布尔表达式：条件测试将放在循环的这部分。给定的条件无论是什么，都必须解析为布尔值。你可以提供一个表达式，也可以使用返回布尔值的方法。\n\
    - 迭代表达式：在循环的这部分，你可以放置一个或多个你希望每次循环运行时发生的动作。始终记住，执行只会在循环结束时发生。\n\n### 嵌套 `for` 循环\n\
    \n你可以将一个 `for` 循环放在另一个 `for` 循环内部。这种结构被称为嵌套 `for` 循环。你可以在循环内部放置任意数量的循环。但建议嵌套层级不要超过六层，否则程序看起来很笨拙。汽车里程表的工作原理与嵌套\
    \ `for` 循环相同。另一个例子是日期或日历。众所周知，一天由小时、分钟和秒组成。在数字钟中，嵌套 `for` 循环的最后一个分支是秒计数器。在其上方是分钟计数器。在分钟计数器上是小时计数器。它是嵌套在嵌套中的嵌套循环。下面给出了嵌套\
    \ `for` 循环的语法。`for` 循环有三种形式。分别是：\n\n形式 1 语法：\n\n```java\nfor(initialization; test;\
    \ increment)\n{\n  statements;\n  while(expression)\n  {\n    statements;\n  }\n\
    \  do\n  {\n    statements;\n  }while(expression);\n}\n```\n\n形式 2 语法：\n\n```java\n\
    for(initialization; test; increment)\n{\n  statements;\n  for(initialization;\
    \ test; increment)\n  {\n    statements;\n    for(initialization; test; increment)\n\
    \    {\n      statements;\n    }\n  }\n}\n```\n\n形式 3 语法：\n\n```java\nWhile(expression)\n\
    {\n  statements;\n  While(expression)\n  {\n    statements;\n  }\n}\n```\n\n以下几个示例将让你理解嵌套\
    \ `for` 循环的工作原理。\n\n示例 1：使用嵌套 `for` 循环显示 `*` 三角形\n\n```java\nclass NestedForLoopDemo\
    \ {\n  public static void main(String args[]) {\n    for(int i = 1; i <=5 ; i++)\
    \ {\n      for(int j = 1; j <= i; j++) {\n        System.out.println(\"* \");\n\
    \      }\n      System.out.println(\"\");\n    }\n  }\n}\n```\n\n输出：\n\n```\n\
    *\n* *\n* * *\n* * * *\n* * * * *\n```\n\n示例 2：打印表格\n\n```java\nclass NestedWhileLoop\
    \ {\n  public static void main(String args[]) {\n    int i=1, j=1;\n    System.out.println(\"\
    Tables\");\n    while(i <= 2) // 根据用户需要更改为 2 到 10 或 20\n      while(j <= 10) {\n\
    \        System.out.println(i + \" * \" + j);\n      }\n      i++;\n      j =\
    \ 1;\n    }\n  }\n}\n```\n（注：示例 2 的原始文本缺少内部逻辑结构；我已根据提供的输出上下文重构了标准的表格逻辑）。\n\n输出：\n\
    \n```\nTables\n1 * 1 1 * 2 1 * 3 1 * 4 1 * 5 1 * 6 1 * 7 1 * 8 1 * 9 1 * 10\n\
    2 * 1 2 * 2 2 * 3 2 * 4 2 * 5 2 * 6 2 * 7 2 * 8 2 * 9 2 * 10\n```\n"
