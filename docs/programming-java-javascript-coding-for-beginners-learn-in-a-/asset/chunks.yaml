    # Introduction to Java


    Java – one of the most popular programming languages of the Internet age was conceived
    and developed in 1991 at Sun Microsystems. The evolution of any programming language
    is driven by necessity that arises due to development in the computing ecosystem
    – and java was no exception.


    Though code written in C or C++, the powerful predecessors of Java could also
    run on all devices, the effort required to compile them each time to make it work
    on specific devices was very expensive.


    Java overcame this by simply taking the text source code (.java) and compiling
    it to an intermediate byte code (.class) file, which can then be interpreted by
    any device running an interpreter - Java Virtual machine (JVM). The idea of byte
    code meant the code became architecture neutral, needs to be compiled only once
    and can be interpreted on any device which can run a JVM on it.


    Today, Java has grown into an important programming language and it is become
    almost imperative for anyone interested in programming to know at least the basics
    of Java. This book has been written exactly for this purpose.  I want to help
    anyone with little or no prior programming experience get an easy and effective
    introduction to java programming.


    # Chapter 1: Getting started


    ## Installation


    Before anything else, we need to get our development environment ready. Beginners
    can use online development environment ([https://ideone.com/](https://ideone.com/))
    to execute small snippets of code, but if the code to be executed is a full-fledged
    program, then one must install java to their system and setup their own offline
    development environment.  Java comes in three types –


    *   The Micro Edition (J2ME)


    *   Standard Edition (J2SE)


    *   Enterprise Edition (J2EE)


    For personal use, one can download .exe of latest SE version corresponding to
    their operating system from the [download page](http://www.oracle.com/technetwork/java/javase/downloads/index.html).
    After installing, check that the PATH variable points to the java installation.
    Executing “java” from the terminal window will display the version of java installed
    on the screen.


    ## Code Structure


    ![](images/00001.jpeg)


    Every java code is saved with the extension “. Java”. Each java program contains
    one or more classes. Each of these classes contains one or more method definitions
    and each method carries a few statements in it.


    ## Syntax and meanings of keywords


    import java.io. *;


    public  class  MyFirstProgram {


    public  static  void  main(String[] args) {


    //This is my first java program


    System.out.println(“ Hello World !”);


    }


    }


    import java.io.*;  - The keyword “import” is used for including java libraries
    called “packages” which contain pre-defined functions that can be used in the
    program.


    Public class MyFirstProgram - this is the class definition, the key word “public”
    indicates that this class is available to all and “class” denotes to be a class
    definition.


    MyFirstProgram – This is the name of a class. Name of the class having the main
    () function should be the same as the source file name.


    The class definition is enclosed within the parenthesis {}


    Public static void main (String args []): This is the main part of the program.  Since
    main () is the driver function, it should always be “public”.


    Static: You need to keep in mind that main() method should always be “static”
    because it makes the program memory efficient.


    Void: This is the return type of the method. This means that the main() method
    will not return anything.


    Main: name of the method. The interpreter starts execution from the main() method
    only. Running a program means instructing the JVM to “load “ the .class file which
    was compiled from the source code and start executing from the main() method.


    The two uses of the main method can be summarized as:


    1.  To Test all the other methods of the program


    2.  To Start execution of the program.


    String[] args :  is the argument that is passed to the “main” method. This method
    always takes an array of strings as its input parameter, and the array name should
    always be “args”.


    Note that the data type starts with a upper case “S”, this is because “Strings”
    is a class in Java and all class names start with upper case.


    The definition of the method is enclosed within flower braces{}, in this case,
    the only thing that we want our program to do is print “Hello World!”


    To print a statement to standard output console, “System.out.println(“”) ;”is
    used. Note that all statements must end with a semi-colon (;)


    You can also use System.out.print () to display output, the difference is that
    print”ln” introduces a new line at the end of each statement it prints.


    The other statement within the main() method in our program is called a “comment”
    statement. These are not compiled, the purpose of these statements which are preceded
    by “//” are only to give the programmer more information about code.


    Java doesn’t have the concept of global variables at all; the same is achieved
    using keywords such as “final, “static”, “public”.


