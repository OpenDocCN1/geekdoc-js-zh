    Virtual Methods


    Here in this section we will look at the behavior of the overridden methods. In
    Java, you can make use of polymorphism when you are designing your class. In method
    overriding, a child class has the ability to override a method in its parent class.
    A method that is overridden is essentially hidden. This over and done my third
    cannot be invoked until the super keyword is used by the child class. The super
    keyword should be used within the method that is overridden.


    Consider this following example.


    /* File name : Employee.java */


    public class Employee


    {


      private String name;


      private String address;


      private int number;


      public Employee(String name, String address, int number)


      {


         System.out.println("Constructing an Employee");


         this.name = name;


         this.address = address;


         this.number = number;


      }


      public void mailCheck()


      {


         System.out.println("Mailing a check to " + this.name


          + " " + this.address);


      }


      public String toString()


      {


         return name + " " + address + " " + number;


      }


      public String getName()


      {


         return name;


      }


      public String getAddress()


      {


         return address;


      }


      public void setAddress(String newAddress)


      {


         address = newAddress;


      }


      public int getNumber()


      {


        return number;


      }


    }


    If we extend the employee class as given below:


    /* File name : Salary.java */


    public class Salary extends Employee


    {


      private double salary; //Annual salary


      public Salary(String name, String address, int number, double


         salary)


      {


          super(name, address, number);


          setSalary(salary);


      }


      public void mailCheck()


      {


          System.out.println("Within mailCheck of Salary class ");


          System.out.println("Mailing check to " + getName()


          + " with salary " + salary);


      }


      public double getSalary()


      {


          return salary;


      }


      public void setSalary(double newSalary)


      {


          if(newSalary >= 0.0)


          {


             salary = newSalary;


          }


      }


      public double computePay()


      {


         System.out.println("Computing salary pay for " + getName());


         return salary/52;


      }


    }


    Now have a look at the following program and try to tell the output


    /* File name : VirtualDemo.java */


    public class VirtualDemo


    {


      public static void main(String [] args)


      {


         Salary s = new Salary("George Martin", "Ambehta, UP", 3, 3600.00);


         Employee e = new Salary("John Adams", "Boston, MA", 2, 2400.00);


         System.out.println("Call mailCheck using Salary reference --");


         s.mailCheck();


         System.out.println("\n Call mailCheck using Employee reference--");


         e.mailCheck();


       }


    }


    Output:


    Constructing an Employee


    Constructing an Employee


    Call mailCheck using Salary reference --


    Within mailCheck of Salary class


    Mailing check to George Martin with salary 3600.0


    Call mailCheck using Employee reference--


    Within mailCheck of Salary class


    Mailing check to John Adams with salary 2400.0


    In this example, two salary objects had been instantiated. One of them is using
    the salary reference s while the other is Employee reference e.


    The compiler looks at the mailCheck() when invoking s.mailCheck() during the compile
    time. The Java virtual machine then invokes the mailCheck() that is present in
    the salary class. This happens during the runtime.


    Now because ''e'' is an employee reference, invoking the mailCheck() will be different.
    When the e.mailCheck() is called, the compiler goes to the mailCheck(). The mailCheck()
    is present in the Employee class.


    The compiler used to mailCheck() from the Employee for validating the statement
    meant during compile time. But during runtime, the Java virtual machine will go
    and invoke the mailCheck()  from the salary class. And this particular behaviour
    in Java is referred to as the virtual invocation method or ''virtual method invocation
    ''. In Java all methods behave in this manner. And overridden method will always
    be invoked during the runtime and does not depend on the reference of the data
    type used during the compile time.


    ### Abstract Methods and Classes


    An abstract class can be defined as a class that has been declared abstract. It
    doesn''t matter if it has abstract methods in it or not. These abstract classes
    can be subclasses but they cannot be instantiated.


    You can call him at 8 to be an abstract method if it is declared and doesn''t
    have an implementation. An example for an abstract method is given below


    abstract void moveTo(double deltaX, double deltaY);


    A class should be declared abstract if it has abstract methods in it. For example.


    public abstract class GraphicObject {


      // declare fields


      // declare nonabstract methods


      abstract void draw();


    }


    If you subclass an abstract class, usually the subclass will provide the implementations
    for every single abstract method that is present in its parent class. But if it
    doesn''t, that is a class should not be declared as an abstract class.


    The methods that are present in an interface which are not declared as static
    or default are implicitly considered as abstract. When dealing with interface
    methods, the abstract modifier will not be used.


    Abstract Classes Compared to Interfaces


    Abstract classes and interfaces are similar to each other considering the following
    similarities.


    *   One cannot instantiate the abstract classes or interfaces.


    *   Both of them cannot have a mix of methods that are declared with or without
    implementation.


    Abstract classes I love you to declare Final and static, lets you define public,
    private and protected concrete methods. But interfaces all fields will automatically
    be defined as public, final and a static. And all the methods you declare define
    will be public by default. And you cannot extend them beyond one class but can
    implement multiple interfaces to it.


    Which one is a better option?


    You can consider going with abstract classes if any one of the following statements
    relate to your situation.


    *   You are planning to share the code with other closely related classes.


    *   If you think that the classes with which you extend your abstract class have
    a common fields or methods.


    *   If you require access modifiers in private or protected.


    *   If you wish to declare non final or non-static fields.


    You can use interfaces if any of the following statements apply to your required
    situation.


    *   If you think that your interface will be implemented by unrelated classes.
    Eg. Comparable and cloneable.


    *   If you are planning to make use of the multiple inheritance.


    *   If you want to specify particular datatypes behaviour without the concern
    about who will implement its behaviour.


    ### Inheritance in JAVA


    Inheritance in Java can be defined as A process in which an object can acquire
    the properties of a different object. With inheritance, the properties of the
    class can be shared with other classes to which the inheritance directs. Information
    can be made manageable with inheritance. The objects follow the hierarchical order
    when inheritance is used on them. There are two types with which inheritance can
    be performed in Java. They are extends and implements keywords. These keywords
    to determine if an object is an ''IS-A'' type to another. Using the above keywords,
    we can make the object acquire another object''s properties.


    IS-A Relationship:


    IS-A relation means: when we define an object is a type of another object they
    are said to have IS-A relationship between them. Here we will see how to use the
    extent keyword for achieving inheritance.


    public class Animal{


    }


    public class Mammal extends Animal{


    }


    public class Reptile extends Animal{


    }


    public class Dog extends Mammal{


    }


    Basing on the above given example it can be deduced that


    *   Animal class is the superclass of the mammal class


    *   Animal class is superclass of the reptile class'
