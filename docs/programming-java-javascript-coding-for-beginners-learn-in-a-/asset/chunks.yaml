    for(int i = 1; i <=5 ; i++)\n\n{\n\nfor(int j = 1; j <= i; j++)\n\n{\n\nSystem.out.println(\"\
    * \");\n\n}\n\nSystem.out.println(\"\");\n\n}\n\n }\n\n}\n\nOutput\n\n*\n\n* *\n\
    \n* * *\n\n* * * *\n\n* * * * *\n\nExample 2 : Program to print tables\n\nclass\
    \ NestedWhileLoop\n\n{\n\n public static void main(String args[])\n\n {\n\nint\
    \ i=1, j=1;\n\nSystem.out.println(\"Tables\");\n\nwhile(i <= 2) // change to 2\
    \ to 10 or 20 as many tables user want\n\n{\n\nwhile(j <= 10)\n\n{\n\nSystem.out.println(i\
