    To pull bits out of a numerical value, you use the AND (&) or its inline assignment
    (/=) comes. If the bit is set in either operand, the result is set also; the only
    time it is not set is when the bit is Ø in both the operands. This makes it easy
    to merge values together and create flags. You can generally generate a flag by
    adding values together, but if you add the same flag twice, you can prevent this
    by using OR (|) on the flags.


    Almost identical to the OR operator (|) is the XOR operator (^) and its inline
    assignment equivalence (=). The difference between | and ^ is that with ^ or ^=
    when a bit is set in both operands, the result is unset. The exclusivity comes
    from the fact that one of the operands has the bit set; the result would be false
    or an unset bit. If you use the XOR operator on one value against the same value
    twice, you get the original value back. We''ll use this to generate an encryption
    algorithm later in this section.


    Unlike the rest of the binary operators we''ve discussed so, the NOT operator
    (--) doesn''t work between two operands. It returns the value, with all its bits
    swapped. Using AND (&) on a value with its negated value always produces a bitmask
    with all 1s. Using OR (|) or XOR (^) on a value is useful, and it doesn''t have
    an inline assignment format, but Listing 4.7 shows an example of putting it to
    good to use in encryption/decryption code.


