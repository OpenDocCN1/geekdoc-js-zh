  md: '# Custom Attributes


    The final group of attributes is the custom, or .NET, attributes. You can use
    these attributes on any classes or members, and these classes or members then
    become available as metadata in the assembly. Consumers of the class or member
    can act on custom attributes at runtime. For example, the STAAttribute attribute
    forces the method or member to be executed under an STA (single-threaded apartment)
    thread instead of an MTA (multithreaded apartment) thread.


    You can create your own attributes to hold special information about a class or
    function by creating classes that derive System.Attribute. For example, you might
    want to create a documentation program that allows you to place descriptions on
    classes and members, using custom attributes. Later, you can use the reflection
    programming interfaces to walk through the assembly and pull out the documentation
    along with type information for the classes and methods. The next section discusses
    the use of custom attributes for documentation purposes.


    # Writing a Custom Documentation Attribute


    .NET languages have special documentation constructs. For instance, C# enables
    inline documentation comments that are parsed by the compiler and parsed in an
    Extensible Markup Language (XML) document. The compiler validates that all the
    inline comments specify are syntactically correct for the method which they are
    applied.


    JavaScript .NET does not offer such a feature, so you have to use other methods
    to provide code documentation. For example, you can supply a special commenting
    structure that can be later parsed (similarly to C#). To do so, you can use a
    naming convention in .dot files have the same names as source files, but different
    extensions. Or you can use the method you''re about to create by applying attributes
    with documentation.


    To create a custom attribute, simply extend a class from System.Attribute. This
    isn''t required, but it''s highly recommended. You might also want to extend the
    class name with Attribute because it helps in identifying attribute classes from
    normal classes. The following example creates an extremely basic attribute declaration:


    ```

    class DocumentationAttribute extends System.Attribute {

    }

    ```


    Next, you have apply some .NET attributes that describe the behavior of the documentation
    attribute. AttributeUsageAttribute accepts a single ordinal parameter and optional
    parameters. The ordinal parameter accepts the type AttributeTargets, which is
    an enumeration for the types of members on which the attribute is valid. You could
    limit the DocumentationAttribute to only classes or only functions, but if you
    use the All option, it can be applied to any construct.'
