    \ and would always be called on an exception, you still need that to exit when\
    \ there isn't an exception. In this situation, you use a special code block that\
    \ logically extends whatever is in the try block and also executes immediately\
    \ following catch blocks, if and when they are called.\n\nThe format of the finally\
    \ block, which is appended to the end of any existing catch blocks for the try\
    \ statement, is the same as that of the try block:\n\n```\ntry {\n  // Some code\n\
    } catch(:Exception) {\n} finally {\n```\n\nfinally blocks are powerful, but you\
    \ have to be extremely careful with what you do inside a finally construct. finally\
    \ blocks clean up by closing any objects or resources that might have been allocated\
    \ inside the try block before the try block was exited without the allocation\
    \ statements being executed. You should always check any variables that you use\
    \ and make sure you're not generating further exceptions from within the finally\
    \ block.\n\nfinally blocks have the special behavior of being called recursively\
    \ back through the try statement until the first try with a matching catch statement\
    \ is executed. This can make an exception very costly if you have a series of\
    \ explicit try...catch blocks, each with its own finally statement; the first\
    \ exception through causes all the finally blocks to execute recursively up the\
    \ call stack until a matching catch statement is called. You need to make sure\
    \ program design takes this feature into consideration, or you'll experience extremely\
    \ poorly in code paths that are executed a lot.\n\n# Throwing Exceptions\n\nThrowing\
