    # The Path Class


    Figure 10.2 begins the investigation of the Path class with a member map of the
    class.


    Why use the path object to build paths rather than just building them using string
    concatenation or hard coding them into the file? You can not assume that the underlying
    file system your program is running on supports the path and directory semantics
    you''re used to. By using the Path object, you can build paths that are custom
    tailored to whatever the underlying file system might be.


    The Path class has several static fields that can be used to describe how paths,
    files, and volumes are each described, along with which characters are given the
    underlying file system. The DirectorySeparatorChar and AltDirectorySeparatorChar
    each describe the symbols used to separate directory names and filenames in fully
    qualified or relative paths. The VolumeSeparatorChar describes the character used
    to split a volume name from the rest of the path. The PathSeparator field is generally
    available only on Windows systems, and the character used to separate multiple
    paths. And, finally, the InvalidPathChars field can be used to determine which
    characters and cannot be used on the target file system. All of this can be summed
    up in a small code listing to show where each of these fields is useful when building
    paths.'
