  md: '# JScript .NET Compiler Features


    In JScript .NET the /d option is used to pass in new symbols. Symbols are only
    defined and don''t hold any special values, there are a couple of ways to specify
    multiple symbols to the JScript compiler. The first method to specify multiple
    symbols on the command line is to use one define compiler option for each symbol:


    ```

    jsc /d:DebugSymbol /d:PerSymbol /d:AdminSymbol Source.js

    ```


    # CAUTION


    Try not to use the DEBUG or TRACE symbols because they are already defined and
    used by the CL. If you decide to use the DEBUG and TRACE symbols for your own
    code, you won''t be able to control your code and the CLR separately, which might
    lead to limitations in your ability to debug your program. You always want to
    be able to control debugging at the most atomic level when examining bugs, but
    you also want a system in which you can easily disable all debugging in code for
    a final release.


    The second method is to use a single define compiler option and to separate each
    symbol with semicolons or commas. The following code list demonstrates the use
    of semicolons and commas to separate multiple symbols:


    ```

    jsc /d:DebugSymbol,d:PerSymbol /d:AdminSymbol;RetailSymbol Source.js

    ```


    The command line isn''t the only place where symbols can be defined. You can also
    define symbols in the source file; however, this isn''t as effective as the command
    line. One option is to generate source files that contain your conditional compilation
    directives and include these files depending on what you want to define.


    Defining symbols within the source file itself has some additional benefits we
    didn''t see in the command-line symbols. For ones, symbols defined in the source
    file can contain values, either numeric or Boolean, but might not contain string
    values. In this manner you can use a single conditional variable to specify a
    version and perform conditional compilation against the version rather than just
    checking whether the flag is flagged.


    One other feature of conditional compilation variables is they can be used anywhere
    in JScript code. So we can examine their values to find what is going behind the
    scenes or figure out why our code isn''t compiled the way we think it. Listing
    9.1 demonstrates the use of source symbols, command-line symbols, and their various
    values depending on how they are set in code or not. The one thing to note is
    that any symbol that isn''t set will be defined as NaN, not a number. We can use
    this later in source to check for the existence of various symbols.


