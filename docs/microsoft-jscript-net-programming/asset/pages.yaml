  md: '# File Access


    With the preceding code listing you can see the use of the five fields discussed,
    DirectorySeparatorChar, AltDirectorySeparatorChar, and VolumeSeparatorChar. PathSeparatorChar
    would be used to combine several paths together. Anyone familiar with the PATH
    environment variable on a Windows system will know to specify multiple paths,
    the semicolon (;) character used as the PathSeparatorChar. The InvalidPathChars
    could be used as a replacement for input strings to replace invalid characters
    with a default value or to alert users that entered an invalid path and need to
    supply. It''s easy to see that by using the special fields of the Path class an
    application could be made to work on systems with extremely different file systems.
    In addition to the available, the Path class also contains many helpful methods
    for building and examining paths.


    The Path methods can be broken down into couple of smaller groups. There are methods
    for examining a path and determining various path-related properties. The HasExtension
    method can be used to determine whether the path ends with a filename that contains
    an extension The best use of this method is to determine whether a user-input
    filename and needs a default extension, but you could also use it to determine
    whether the specified path is a directory or a file path. The IsRooted method
    returns information on whether the given path contains a volume. This could be
    a rooted file-system path such as the rooted UNC path with a server and share.
    It''s very important to store fully qualified names, and this method is a quick
    check.


    Another set of Path methods is related to creating or modifying a current path.
    The ChangeExtension method can be used to create or remove an existing file extension
    on the end of a path. The Combine method is useful for combining several smaller
    pieces of a path into a single path. This is often the most method used to concatenate
    directory names together to build a path to a file because it automatically uses
    the correct separator characters. The GetDirectory, GetExtension, GetFileName,
    GetFileNameWithoutExtension, and GetRoot methods are all self-explanatory. The
    GetFullPath method expands a path to a fully qualified path. This is often used
    in conjunction with the IsPathRooted method because you can check the path to
    see whether it is rooted, and if not, call this function to return a version of
    the path.


    A final set of methods is available for working with temporary files. The GetTempPath
    method is used to gain access to the system''s temporary directory. The GetTempFileName
    method only returns the directory, but also creates a 0-length temporary file
    and filename. This is extremely handy for storing information while your program
    is running.


    It''s important to know what methods are available to avoid reproducing any of
    the behavior later in user code.'
