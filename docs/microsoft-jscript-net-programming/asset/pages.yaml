  md: '# Chapter 4


    The next set of operators deals with relative equality. Relative equality is the
    value of one object compared to the value of another object—not for purposes of
    equality, but for purposes of determining whether value is less than or greater
    than.


    Let''s start with the operator, <. If the value on the left, or rvalue, then the
    statement evaluates to true. The less than equal operator, <=, adds the condition
    that if the values are equal, then the statement also evaluates to true. The greater
    than equal operator, >=, takes the > operator one step further and evaluates to
    true if rvalue is greater than or equal, rvalue and equal.


    For numerical values, the concept of relative equality is well defined, to the
    point of being implemented in the microprocessor architecture. The rules for conversion
    of types applied when performing any sort of comparison, so you can refer to the
    discussion on conversions in Chapter 3 if you need to confirm the process for
    a specific comparison.


    The concept of relative equality becomes very muddy when working with strings.
    Various character encodings, punctuation, and accented characters can confuse
    many-character comparisons returning results that are not desirable. You don''t
    need to know how algorithms and punctuation are handled or by the various locales
    that exist on a given machine to perform efficient string comparisons. JavaScript
    .NET does a very good job of handling comparisons in strings without any additional
    work by the programmer to handle punctuation or locations. In reality, the advanced
    string comparison behavior is provided by the CLR. If you need low-level handling
    when performing comparisons, you should use the string comparison classes and
    functions provided by the CLR instead of the normal comparison operators we''ve
    discussed here. For more information on handling string comparison using the CLR,
    you should investigate the .NET framework documentation in System.Text namespace.


