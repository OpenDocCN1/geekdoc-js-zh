  md: "# LISTING 15.2 continued\n\n```\npublic STAThreadAttribute() static function\
    \ Main(Args:String[]) : void {\n    Application.Run(new BasicForm());\n}\n```\n\
    \nBasicForm.Main(Environment.GetCommandLineArgs());\n\nBe sure to compile and\
    \ run Listing 15.2 and interact with the controls so that you understand exactly\
    \ what you've created. Most of the new code is related to creating the button,\
    \ label, and text box to interact with. This is all linked together with the Click\
    \ event which updates the label with text that you have typed into the text box\
    \ control. You'll find that most of the code actions in Windows Forms programming\
    \ are started in response to some user action on a control.\n\n# Using the Docking\
    \ and Layout Feature\n\nYou have a working application that displays controls,\
    \ and uses event-based programming to update properties on the controls in response\
    \ to some action by the user. Even if the work is only updating a label with some\
    \ information typed into a text box, it is certainly better than nothing. In addition\
    \ to adding the controls, Listing 15.2 includes a bit of layout boxing. Programming\
    \ this layout code can make an application hard to manage. Imagine if 10 or 15\
    \ more controls were added——in no time, at a time, all the simple calculations\
    \ would become quite complex. For this reason Windows Forms has a special layout\
    \ manager that works based on the Dock and Anchor properties of the controls.\n\
    \nThe first property is the Dock property. The Dock property is responsible for\
    \ controlling which edges of a control is docked to. This can enable fairly automatic\
    \ layout when a form is resized, the layout manager will also resize and move\
    \ the controls to make sure that the new position conforms to the Dock property.\
    \ The possible positions are Left, Right, Top, Bottom, Fill, and None. None is\
    \ the default value of the Dock property. Another feature of the Dock property\
    \ is that if multiple controls are docked to the same edge, they won't cover each\
    \ other. They will flush with one. This enables layout of all controls based on\
    \ common edges.\n\nThere is one additional layout property: the Anchor property.\
    \ It is responsible for rooting a control in place rather than stretching it with\
    \ the edges of the container. If a control is placed 10 pixels from the left side\
    \ of the form and the Anchor property is set to AnchorStyles.Left, no matter how\
    \ the control is resized or moved, the control will always remain 10 pixels from\
    \ the left edge. The possible values are Top, Bottom, Left, Right,\n\n# 15\nWINDOWS\
    \ FORMS PROGRAMMING IN JS.NET"
