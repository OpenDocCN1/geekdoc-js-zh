- img_proc: true
  md: '# Controlling Program Flow


    The third part of the for statement is iteration statement, which is executed
    after each iteration of the loop. This value drives the for loop and is the reason
    that the value eventually meets whatever condition is required to exit the loop.
    The following example increments a variable so that it eventually equals 11 and
    exits the loop:


    ```

    for(var i:int = 0; i < 11; i++) {

    }

    for(var i:int = 0, j:String = "Even"; i < 11; i++) {

    }

    ```


    The fourth part of the for statement is the code block, where all the real work
    is done (even though all the looping work is contained in the for statement itself).
    You can do something like print out values, you can modify loop variables, and
    you can even exit the for loop within the loop by using the break statement.


    > CAUTION


    don''t recommend modifying variables that are used in conditional statements.
    If you make a mistake that modifies the conditional variable to be within bounds,
    your loop will never exit. Because the code for this is buried in the code block
    and not within the for statement, you or another programmer might not be able
    to realize this without wasting valuable time picking through the code block.


    Listing 5.2 demonstrates the complex statements that can be used in a for statement.
    Notice that this code sets the variable j to either Even or Odd, based on the
    value of i. There is one problem with this code, though: the first time through
    the loop, the iteration statement isn''t called, and you end up printing whatever
    initialized value of j is, which happens to be an empty string. Figure 5.1 demonstrates
    the code paths that for statement takes.


    # Listing 5.2 A Complex For Statement


    ```

    import System;


    for(var i:int = 0, j:String = ""; i < 10;

    i++, j=(i%2 == 0) ? "Even" : "Odd") {

    Console.WriteLine(i + " * " + j);

    }

    ```'
