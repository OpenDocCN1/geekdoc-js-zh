  md: '# Using the Common Dialog Controls


    Many common operations include working with the file system—more important, opening
    and saving files. In the past, programmers have had to generate the dialogs for
    these operations from scratch. This task can be quite complex when the dialogs
    have to traverse the file system, give access to common directories, and also
    perform identically on network shares. Eventually, common dialog controls were
    shipped with the operating system. This happened in Windows 95, and programmers
    have been using these controls ever since. In the most recent Windows 2000 and
    Windows XP, the dialogs contain 20 to 30 controls and have gained such result
    that programming common dialogs for these operations is considered a GUI programming
    no-no.


    With these concepts in mind, Listing 15.5 works for the OpenFileDialog and the
    SaveFileDialog. The syntax for working with each of them is nearly identical,
    examining which of the controls will be easy to work with of them. Because the
    dialogs will be used quite often in the application, both will be initialized
    in the InitializeComponent function as the rest of the controls that have been
    added to the form. To initialize each control, the InitialDirectory must be set
    so that the controls know which directory to use the first time they are opened.
    This can often be set to the current working directory for the application. In
    the sample code the location of the assembly file or executable is used.


    The Filter property contains the list of filters to use. These are specified in
    the Filter display name by using another pipe symbol (\()) by the file mask. More
    than one filter can be specified by using another pipe symbol and continuing with
    this format for as many-display and pattern pairs as needed. The FilterIndex property
    can be used to set which filter is selected by default. This index is 1-based
    and not 0-based. Generally, the first item in the pattern is the value of the
    FilterIndex property. The final property to set is the RestoreDirectory property.
    When this is set, the dialog will automatically open to the last user selected
    in the dialog.


    After the dialogs are initialized, they still have to be opened with some code.
    Both the Save and the Open dialog use ShowDialog function. This opens the dialog
    in question and processes the input. If the user picks a file and clicks OK, the
    dialog will return the result DialogOK. This result can be tested for and to determine
    whether the program should perform some additional action. This action can be
    open or by using the file in the FileName property, or one of the special dialog
    methods can be used for special functionality. One such method is the OpenFile
    method that can be used to get a Stream object for the file selected. This Stream
    can be read from or written to depending on whether the program used the SaveFileDialog
    or the OpenFileDialog. Listing 15.5 demonstrates the basic code needed to use
    the Open and Save dialog controls. Listing 15.6, in the section'
