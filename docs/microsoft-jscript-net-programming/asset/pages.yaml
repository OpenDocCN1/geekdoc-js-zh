  md: '# Chapter 13


    Accessing the Internet from within an application used to be a common daunting
    task. The APIs for accessing the Internet either didn''t exist or were difficult
    to use and implement in a meaningful way. Microsoft has done many things to make
    the Internet easier than it originally was. The Inet APIs available to C/C++ programmers
    made it significantly easier to make basic Web requests including both HTTP and
    FTP connections. Internet Explorer began to operate a COM model that could be
    used from within any COM-compliant programming language to embed a Web browser
    within the application. These advances made Web programming much easier.


    With JavaScript all the methods still exist. The IE object model can be used to
    provide a Web GUI, or the Inet APIs can be called using a special CLR method known
    as Invoke(or Platform Invoke). In addition to the methods, there are many new
    methods for accessing the Web. The CLR has classes for working with DNS and resolving
    hostnames to IP addresses, classes for making basic Web requests, classes for
    working with cookies, for requesting files from the Web, and even more classes
    that receive requests initiated by a Web request.


    All of these classes work in either synchronous or asynchronous mode. The asynchronous
    mode is actually easy to use and implement, but it has a definite advantage in
    making more responsive programs that perform network operations in the background.


    This chapter doesn''t discuss all the features available in the Net classes, but
    it reviews the System.Net namespace with emphasis on the classes used to initiate
    Web requests and retrieve responses. HttpRequest, WebResponse, HttpRequest, and
    HttpResponse are the classes necessary to access Web page content.


    The first examples show synchronous operation of the Net classes. The section
    "Asynchronous Web Requests" demonstrates ways to make the same Web applications
    using the asynchronous programming model.


    # The System.Net Namespace


    The System.Net namespace is another one of namespaces for which a large number
    of confusing classes exist for advanced features of the namespace. For the most
    part, only a few classes are required for performing basic network requests. The
    classes important to this chapter are WebRequest, WebResponse, HttpRequest, and
