  md: '# Chapter 9


    Although the exe target option will be the most widely used for console and utility
    type applications, there is still a great need to launch Windows executables in
    JScript .NET as well. This is because of the Windows Forms API, which makes it
    extremely trivial to create a program that has a simple or even quite advanced
    UI. To create a Windows executable, the winexe target used instead of the exe
    target. The only difference between the exe and winexe target options is that
    the winexe target suppresses the creation of a console window. This means that
    standard operations that print and read from the console won''t work and the Console
    class becomes somewhat useless. Instead of using the console, the program would
    have to take advantage of the Windows Forms UI features instead. The following
    code demonstrates the use of the winexe target to create a windows executable
    that launches without an associated console:


    ```

    jsc /target:winexe Source.js

    jsc /:winexe Source.js

    ```


    The choice between a console application and a Windows executable is completely
    up to the programmer. Windows Forms applications with a full UI can be compiled
    with either flag and will still function. Often it is handy to catch console output
    while developing a Windows Forms application and later disable this pseudo debug
    by compiling with the winexe target to get rid of the console. I''ll leave you
    with the decision to which you prefer.


    # Compiling Library Code


    Code libraries are excellent for sharing code between multiple projects or for
    shipping some useful set of classes to another development team. Previously in
    JScript you could create COM libraries and controls, making use of a multitude
    of already-available code. Making a library in JScript .NET is much similar.


    Libraries are prepared classes that are ready to be used by your program. We''ve
    seen seen the .NET core library, mscorlib.dll, has behind the scenes the System.dll,
    has also been making an appearance. All the basic data types, the Console class
    that we''ve made much use of, and the Environment object we''ve used to get command-line
    options—all of these classes that are defined in these standard code libraries.
    This makes a lot of sense to bundle any classes you find yourself across many
    different projects into their own code library as well.


    Making a library is as simple as using the library target. When you specify the
    library target, a library is generated instead of an executable assembly. What
    this means is that any global code present in the library isn''t executed, and
    no entry point is defined. Running the library from the command line or Windows
