    Now I''ve found that if you include all the libraries you''ve used, I need to
    tell you that the JScript compiler will most, if not all, of its referencing for
    automatically. It is a special feature available only to the JScript compiler
    as the autoref option. You can turn autoref off or on, and it is by default. The
    basic premise is that when you specify an import statement in your code, the namespace
    or package you are importing has a matching assembly. In other words, if you write
    some code that implements the System namespace, JScript tries to automatically
    reference the System assembly. The autoref feature works as long as the namespace
    you are importing has an assembly with a matching name.


    > TIP

    If you turn off the autoref option, you can speed up compilation time of the program.
    The reason is that the compiler doesn''t look for a number of non-existent assemblies
    when compiling. This can make a difference of several seconds or more when you
    have a large number of import statements in your source code.


    So why would you want to turn this off? If you are importing namespaceA and have
    a namespaceB assembly, but you just created a namespaceB with a special version
    of the namespaceA package, then you don''t want the compiler to reference the
    wrong assembly. In this case you would turn autoref off so that namespaceA.dll
    does not get automatically referenced by the compiler, and you''d use a reference
    option to include namespaceB.dll. The following code demonstrates the use of the
    autoref compiler option to automatically include libraries based on import directives:


    ```

    jsc /exe /autoref=Source.js

    jsc /exe /autoref-/r:namespaceB.dll Source.js

    ```


