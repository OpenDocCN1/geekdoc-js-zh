    Every Web operation starts with the WebRequest class. Calling the Create method
    along with the URI for the remote Web site or network file will create a new WebRequest
    class. The WebRequest class is special in when the Create method is called, it
    does not return an instance of a WebRequest object, but returns an instance of
    a class that is registered for the protocol prefix in the URL. If the http://
    protocol prefix were used, the class returned from a call to Create would be an
    HttpWebRequest class.


