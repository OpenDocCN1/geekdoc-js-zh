    \ is read-only. If you specify the property set function without the corresponding\
    \ property get function, the property is write-only.\n\n# Event Support\n\nSupport\
    \ for jScript .NET is extremely limited. The general rule is that Javascript can\
    \ consume events by declaring event handlers, which are functions that have a\
