  md: 'Event support can therefore be considered unimplemented in JScript .NET at
    this time. However, the next version of the JScript .NET language and compiler
    will most likely have support for events that will be CLR and ECMA compliant.


    # Summary


    The CLR can impose many restrictions on code so that it can support many disparate
    languages and syntaxes. You have learned that interfaces are a special contract
    between a class and other classes that use it. A class can support a series of
    methods and properties, and this makes up for the lack of multiple inheritance
    in the CLR, and some say it makes for a cleaner object inheritance tree than multiple
    inheritance could offer.


    In this chapter you have learned how to define interfaces for programs and how
    to specify the various interface members, both at the implicit level (that is,
    by allowing the compiler to decide the interface mappings) and at the explicit
    level (that is, by telling the compiler which function implementation is mapped
    to each of the interfaces that define the function).


    In this chapter you have learned about class methods, fields, and properties,
    as well as the lack of event support in JScript .NET.


    In Chapter 8, "Exception Handling,"you''ll learn all about exception handling,
    including the try...catch...finally block statements and creating your own exceptions.
    Exceptions are generated by every program, and often exceptions are used as an
    alternative to returning an error value from a function. It is important that
    you learn how to deal with exceptions thrown in code, how to implement the proper
    cleanup blocks, and also when and how to throw your own exceptions.'
