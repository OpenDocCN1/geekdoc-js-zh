    # Arithmetic Operators in Statements


    Operators most commonly appear in statements. A statement can be as simple as
    two operands and a single operator as complex as hundreds of grouping parentheses
    and multiple operands and operators. For the most part, only statements are needed
    to understand the purpose of each operator. These operators include the basic
