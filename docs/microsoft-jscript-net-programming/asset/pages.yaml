  md: 'Just loading a document doesn''t allow for much control in a program. In the
    following section we''ll look at some of the ways you can investigate the various
    elements and attributes.


    # Enumerating Elements


    No matter how an XML document is loaded, you have to enumerate and its attributes
    and elements to get the data in the document. So far we have discussed two types
    of layout structures for these documents. The XmlDocument class uses a tree structure
    in which collections can be used to get elements and attributes that are grouped
    together. The XmlReader class uses a linear layout in which the only way to examine
    ownership of one element or attribute is to examine properties on the XmlReader
    class that are updated as the document is parsed. Because the XmlDocument class
    is easy to traverse, it is discussed here first. Refer to Figure 11.2 at any time
    to take a look at its properties.


    Every XML document contains a root element that contains the data-related portion
    of the document. To find the root, you use the DocumentElement property, which
    returns null if no root element exists or returns an Xml element that represents
    the root element if there is a root. Examination of the XML content within an
    XmlDocument class begins with the root for all the examples in this chapter.


    With an XmlNode element at the root, you can easily examine the rest of a document
    by recursively stepping through child element and attribute objects. In Figure
    11.4, you can see that the XmlNode class has quite a few properties and methods
    for investigating the state of the current XmlNode element and its children.


    Let''s begin by examining the state of the current node. You must first find the
    current node''s type. Each node in an XML can be one of many types, such as an
    attribute, a comment, or an element. For a full list of the available XmlNodeType
    types, see Figure 11.5. Depending on the type of node, various properties and
    method are available. When a property or method isn''t available, null is returned,
    and it is easy to determine whether a certain type of node makes up of a certain
    property.


    When the program finds the type of the node, it can make a decision about how
    to parse that type of node. There are generic methods for parsing all XmlNode
    objects identically, but you don''t want this functionality. Generally, you want
    a program to ignore most types of nodes and parse only the most prominent nodes.
    Therefore, in this section we''ll discuss the parsing of element nodes, text nodes,
    and attribute nodes.'
