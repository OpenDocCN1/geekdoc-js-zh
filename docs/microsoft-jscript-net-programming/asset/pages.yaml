  md: '# Behavior Attributes


    Behavior attributes affect how a class or member works. There are three behavior
    attributes (expando, compatible, and static), and only two of them (expando and
    compatible) apply to classes. These classes are also capable of enabling special
    language features that cant otherwise be used without the attribute. In many cases,
    they are able to enable JavaScript features or JavaScript .NET classes to behave
    like JavaScript objects.


    You can expand an attribute to a class if it is given a indexed property that
    can store and retrieve dynamic properties. This feature doesn''t exactly fit into
    the .NET scheme, but it has been ported from JavaScript for compatibility purposes.
    With the special default indexed property, you can access any expando properties
    using square brackets or parentheses. You should be careful with this feature.


    # CAUTION


    If you''re programming JavaScript .NET and want to use the new features and syntax
    rather than the legacy syntax, I recommend that you not use the compatible attribute
    because it causes a number of new features you''ll want to make inoperable. If
    you use this attribute, you also miss a few compiler warnings normally occur when
    you mistype property names JavaScript .NET automatically creates a new property
    and uses the mistyped name to it.


    You use the compatible attribute to make classes in JavaScript .NET act as objects
    in previous versions of JavaScript. When you use this attribute, you lose the
    functionality of visibility modifiers and versioning features. However, you gain
    the ability to access expando properties by the dot operator instead of using
    brackets or parenthesis.


    You can''t apply the static attribute to classes, but you can apply it to classes.
    Static members can be made available to users without an instance of the class
    having available. Static properties and fields maintain the same value across
    multiple instances of the same object being created and manipulated. We''ll look
    more static members in the section "Declaring Constructors" later in this chapter
    and in Chapter 7, when we actually get into member methods.


    The static attribute has a special behavior when applied to nested classes. Normally,
    nested class cannot be instantiated unless you first instantiate an instance of
    the class within which it is contained. Then you use the instantiated class to
    create a new instance of the nested class.'
