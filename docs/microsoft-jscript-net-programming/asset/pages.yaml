  md: '# Static Members


    Static members are different from instance members in that every class shares
    the same static members. This can be better illustrated by creating two objects
    of the same type. If you change the value of one of the instance members, then
    only the class you changed the value of will see the change. The other class will
    maintain the value it originally had. However, if you change a static member value,
    it changes on all instances of that type. Take a look at Figure 2.3 and you will
    see this mapping place.


    In addition to having static member variables, each class can have a single static
    constructor. This constructor can be used to initialize any static members the
    first time any of the static members are accessed.


    ![](img/7d779d3c15b9095d220d4f5d5c9b327f_31_0.png)


    FIGURE 2.3

    Static members.


    # Making Methods Extensible


    All members marked as public or protected are available to other classes that
    inherit from the base class. This allows for a child class to provide custom functionality
    or additional data that the base class was unaware of or not designed to handle.
    A good example of this might be a class that outputs its data in a well-formatted
    string. If a child class adds additional data, the base class method won''t be
    able to format this information. At this time, the child class will override the
    method and provide its own formatting, or allow the parent to format data in the
    base class, whereas the child class formats only additional data. Designing methods
    to be extensible can help greatly in program design.'
