  md: "# Chapter 12\n\nThe regular expression object has only three useful methods:\
    \ the compile method, the exec method, and the test method. First, a regular expression\
    \ that doesn't change and needs to be used multiple times can be compiled. The\
    \ compile method converts the regular expression into an internal format that\
    \ greatly speeds execution when matching against more one string. To perform a\
    \ match, the exec method is used. Using a regular expression object, the exec\
    \ method simply takes one parameter being to match against. If a match fails,\
    \ this function returns null. Otherwise, it returns a JavaScript array of results.\
    \ Array index 0 is the matched string, whereas indices 1 through the end of the\
    \ array are any subpatterns that were specified when the regular expression was\
    \ created.\n\nSometimes the overhead of a full match isn't necessary. If there\
    \ is a large regular expression, it takes a less time to test whether the pattern\
    \ matches, rather than creating the results and returning all the subpatterns.\
    \ For this purpose there is the test method of the regular expression object.\
    \ The test method again takes a string to match against, just like the exec method,\
    \ but instead of a full results it returns true or false. The following demonstrates\
    \ the use of the test method to check for digits in string:\n\n```\nimport System;\n\
    var re = /^\\d+$/; // Make sure there are only digits\nif ( re.test(\"123\") {\n\
    \    Console.WriteLine(\"Only digits\");\n} else {\n    Console.WriteLine(\"Uh-oh,\
    \ there are some digits\");\n}\n```\n\n> test is faster than exec, it would seem\
    \ logical to first test a string, and only if it matches run the exec method to\
    \ get the results. This is a poor programming decision—the only time test is faster\
    \ than exec when the pattern actually succeeds. This means test should be used\
    \ only when the existence of a pattern in a string needs to be checked and not\
    \ when subpatterns are being extracted from the string.\n\n# LISTING 12.1 Using\
    \ the exec Method and Returned Array\n\n```\nimport System;\nvar re = /.*\\(\\\
    d+).*/;\nvar results = re.exec(\"Let's match numbers - 123\");\n```"
