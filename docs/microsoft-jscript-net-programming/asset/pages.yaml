  md: '# Regular Expressions


    A new Regex can be generated using the string pattern in the constructor or by
    passing in both the pattern and several of the RegexOption enumeration values.
    For the most part, the pattern can use any of the features discussed in the section
    "JavaScript Patterns". To avoid complicating things with new features that aren''t
    necessarily required to use regular expressions, I''m not going to use any more
    features advanced than have already been pointed out in tables or discussed. One
    additional feature I want to point out is the named group. These names can be
    used to retrieve the captured group from the Match rather using the ordinal. This
    improves the ease of making regular expressions without having to greatly modify
    the code that uses the results. The following code demonstrates creating a basic
    named group, and it also demonstrates the two Regex constructors:


    ```

    import System.Text.RegularExpressions;


    var reOptions:Regex = new Regex(\?<digits>\d+");

    var reOptions:Regex = new Regex("(?<digits>\d+", RegexOptions.IgnoreCase);

    ```


    Now that I''ve started using RegexOptions in some of the examples, I should probably
    introduce the next table. Table 12.3 lists CLR Regex options.


    # TABLE 12.3 CLR Regex Options


    | Member Name | Description |

    | --- | --- |

    | Compiled | Specifies that the regular expression is compiled to an assembly.
    This yields faster execution but increases startup time. |

    | ECMAScript | Enables ECMAScript-compliant behavior for the expression. This
    flag can be used in conjunction with the Multiline, IgnoreCase, and Compiled flags.
    The use of this flag with any other flags results in an exception. |

    | ExplicitCapture | Specifies that only the valid captures are explicitly named
    or numbered groups of the form (?<name>...). This allows unnamed parentheses to
    act as noncapturing groups without the syntactic clumsiness of the expression
    (?:...). |

    | IgnoreCase | Specifies case-insensitive matching. |

    | IgnorePatternWhitespace | Eliminates unescaped whitespace from the pattern and
    enables comments marked with #. |

    | Multiline | Multiline mode. The changing of ^ and $ so that they match at the
    beginning and end, respectively, of any line, not just the beginning and end of
    the string. |'
