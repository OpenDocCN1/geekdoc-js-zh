    # Code-Generation Options


    It seems that the JScript compiler offers an endless supply of compiler options.
    I promise that these next compiler options—out, debug, fast, versafe, utf8output,
    warn, and naserrror—will be much more important in actually getting your programs
    to run.


    We start by using the /out option. The out option allows you to change the target
    assembly name for your program. Generally, the compiler takes the name of the
    first source file and appends an .exe or a .dll extension as appropriate and uses
    that as the target assembly name. Many times this is extremely inappropriate,
    so you want to supply the output filename on the command line. The following code
    specifies the output assembly through the use of the out option:


    ```

    jsc /t:exe /out:SuperUtility.exe Source.js

    ```


    Along with out comes debug option. Programs compiled .NET with debug enabled a
    special file named identically to the assembly and ending with a .pdb extension.
    This special debug file contains information that maps code instructions to the
    actual lines in the source file. You can tell exactly what line of source code
    was being executed when an exception was thrown. This can come in handy when you''re
    debugging your programs.


    To enable this debug feature, you use the /debug option. This option can be turned
    either on or is off by default, disabling any debug information. You should always
    turn this option on so that you have these debug libraries available to get better
    stack traces. You delete the debug libraries before you distribute your programs
    so that others can''t gain information about the internal workings of your program.
    However, if something happens in the field, you can always ship a customer debug
    libraries to help you narrow down the issue. The following code demonstrates the
    use of the debug option to turn deging symbols on and off:


    ```

    jsc /t:exe /debug- Source.js

    jsc /t:exe /debug+ Source.js

    ```


    If you want your programs to run as fast as possible, you''ll obviously disable
    the debug output. But you''ll also want to enable the /fast option. The fast option
    is another flag option


