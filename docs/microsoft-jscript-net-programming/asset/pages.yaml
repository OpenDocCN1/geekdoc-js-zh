  md: "# Interfaces and Class Members\n\nHere is a more formal interface syntax:\n\
    \n```\n[Attributes] interface InterfaceName [implements interfaces, ...]{\n  .Code\
    \ Block...\n}\n```\n\nYou can use interfaces to inherit from a base interface\
    \ by using the implements keyword. For classes, the implements clause causes a\
    \ class to implement all the methods and properties defined by the interface.\
    \ With interfaces, this definition changes a bit because by definition it can't\
    \ provide any implementation—it can only define the prototypes for the methods\
    \ and properties. This means that an interface can use the implements keyword\
    \ to subclass other interfaces, as in the following example:\n\n```\ninterface\
    \ A {\ninterface B {\ninterface C implements A,B {\n```\n\nIn this example methods\
    \ and properties defined by interface A or interface B will also be inherited\
    \ by interface C. This can be extremely hard as a grouping construct, in which\
    \ a series of interfaces can be grouped into one larger interface to ease the\
    \ programming burden. The following example groups a series of graphics interfaces\
    \ together so that someone wanting to implement all the interfaces would need\
    \ to implement only the grouped interface and not all the smaller interfaces:\n\
    \n```\ninterface IViewport {\ninterface IRender {\ninterface IloadGraphics {\n\
    interface ISetPixel {\ninterface IGraphics implements IViewport, IRender, IloadGraphics,\
    \ ISetPixel {\n```\n\nIn addition to reducing the amount of code needed to implement\
    \ the interfaces, this also reduces the amount of code needed to check whether\
    \ an object supports the necessary interfaces. If you have a piece of code that\
    \ works with a class that you know some of these interfaces and you need to use\
    \ two of them, then you need to check whether it supports both. However, if the\
    \ class supports the IGraphics group of interfaces, you need to make only one\
    \ check. The following example works in conjunction with the previous example\
    \ and implements the interfaces defined there:\n\n![](img/7d779d3c15b9095d220d4f5d5c9b327f_149_0.png)"
