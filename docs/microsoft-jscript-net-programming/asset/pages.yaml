    Namespaces can also be imported and mapped to tag prefixes. When a namespace is
    mapped to a tag prefix, you can use special syntax in the ASP.NET file to create
    an instance of a control on the page. In addition to importing an entire namespace
    and attaching a tag prefix, you can import a control and map it to a tag prefix
    using a tag name. The following example shows how a control might be included
    on a page, using the tag prefix and tag name:


