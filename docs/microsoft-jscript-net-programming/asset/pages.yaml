  md: 'The InnerText property is a bit different from the other Document properties.
    It concatenates all the values for the contents of the current element and returns
    only that value rather than the entire XML markup. This means that some types
    of nodes have a Value property. For elements, the Value property returns null
    because an element is a container for other elements. If the element contains
    a value, a special type of node, called a text node, is generated to contain those
    values. To get the values of elements, a program must first find the text nodes
    contained within those elements.


    To understand these properties, take a look at how they''re used in Listing 11.2,
    which uses the XML content from Listing 11.1. We''ll expand on this example as
    we discuss properties of the XmlNode class and more objects in the System.Xml
    namespace later in the chapter.


    # Listing 11.2 Examining Properties in the DocumentElement and XmlNode Classes


    ```

    import System;

    import System.Xml;


    // Load the XML document

    var xDoc:XmlDocument = new XmlDocument();

    xDoc.Load("11.1.xml");


