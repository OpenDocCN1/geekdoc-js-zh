  md: '# Summary


    If you''re familiar with exception handling in other languages, you''ll notice
    that you handle errors slightly different in the .NET framework. You should now
    have a good knowledge of how to use the try...catch statements. You should also
    understand the full abilities of a finally clause to help you clean up your code.


    When you start implementing libraries and functions of your own, you''ll better
    understand when and how to throw exceptions. Originating the proper exceptions
    is crucial to good library design and for giving error information to users of
    your library. You should try to throw predefined exceptions whenever possible
    and generate new types of exceptions only when absolutely necessary.


    The next chapter is a short compiler reference, in which we''ll discuss all the
    various compiler options and modes available to compiled JavaScript programs.
    We''ll also go over conditional compilation for special code generation and debugging.'
