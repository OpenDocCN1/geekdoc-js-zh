  md: '# Chapter 9


    To begin this process you have to generate a key pair. This can be done with the
    sn.exe utility shipped with the .CLR. If you run the utility with the -k option
    and specify an output filename for the key file, you will have enough to strongly
    name and sign your assembly. The following code demonstrates the creation of a
    strong naming key:


    ```

    sn -k MyApp.snk

    ```


    After the key pair is generated, you simply apply an assembly-level attribute
    that specifies the key file for signing. The compiler handles the result. The
    attribute in question is the AssemblyKeyFileAttribute, which takes only the path
    to the key file. This can be a relative or absolute path, but for everything to
    work the key file must exist in the location specified. The following code uses
    an assembly-level attribute to apply a strong naming key to the source file and
    resulting assembly:


    ```

    import System;

    import System.Reflection;

    ```


    ```

    [assembly:AssemblyKeyFileAttribute("MyApp.snk") ]

    ```


    After you compile your code, you can also refer to your assembly using its strong
    name rather than its normal assembly name. You can also register your assembly
    in the GAC, which makes them available to any application on the system. This
    can be very useful information, especially if you are planning to write and distribute
    code libraries for any other developers.


    # Summary


    This chapter had several major features that will remain important throughout
    the rest of the book. We began the chapter by re-iterating through some of the
    compiler options we saw earlier in the book to compile the sample code until now.
    We expanded on to talk about all the various options available to you as the programmer
    and all the different features you can turn on or off.


    You also saw the code-generation options the compiler offers. These are important
    because they affect how the code is parsed and compiled, and they can also affect
    the compiler''s output. If you don''t fully understand these options, you might
    not understand some of the more discrete errors generated by your program because
    it was compiled incorrectly.


    From compilation we moved to conditional compilation and defining command-line
    symbols and source symbols, using those variables to either enable or disable
    code at compile-time. You also learned that some symbols have to be defined for
    some of the CLR classes to work and that you can also use attributes to define
    methods that should be conditionally compiled rather than wrapping the function
    calls in conditional compilation syntax.'
