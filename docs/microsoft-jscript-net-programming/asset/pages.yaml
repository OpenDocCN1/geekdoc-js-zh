    and can be turned either on or off. The fast option is turned on by default, and
    it disables various language features that are considered to be legacy features
    and that are known bottlenecks to programming code.


    # CAUTION


    Fast mode is defined by the JScript compiler team. They can change their optimizations
    at any point in time, possibly causing breaks in your code whenever they deprecate
    some feature you''re using.


    Fast mode requires that any variables are defined before they are used or a compiler
    error will result. Functions become constant, and they cannot be assigned to or
    redefined. predefined properties for built-in JScript objects become read-only,
    and you won''t be able to use expanding properties on those objects. The special
    variable, arguments, is disabled for within function calls. The following code
    demonstrates the fast compiler option on and off:


    ```

    jsc /t:exe /fast+ Source.js

    jsc /t:exe /fast- Source.js

    ```


    # NOTE


    There are many more fundamental changes you can make as well to improve your performance.
    First, be sure to use CLR arrays instead of Jscript arrays. Second, always use
    StringBuilder to dynamically build strings rather than using string concatenation.
    And third, never use of the more abstract Jscript language features like expanding
    properties when initially testing a concept.


    As all the optimization and debugging options we''ve seen aren, you can also specify
    the /versionsafe option to provide an additional level of compliance on your code.
    The versionsafe option is another one of the flag options. The default value is
    off, which allows your code to not explicitly define the override or hide keywords
    on members that would otherwise cover some member of an inherited class. If you
    decide to turn this option, the compiler will give you a warning in the code where
    you''ve explicitly chosen either override or hide your method is covering an inherited
    method. The following code demonstrates the versionsafe compiler option being
    on and off:


    ```

    jsc /t:exe /versionsafe+ Source.js

    jsc /t:exe /versionsafe- Source.js

    ```'
