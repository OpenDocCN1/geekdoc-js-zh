  md: '# TABLE 12.2 continued


    | Character | Description |

    | --- | --- |

    | (?!pattern) | Negative lookahead matches the string search at any point where
    a string not matching pattern begins. This is a noncapturing match; that is, is
    not captured for possible later use. For example, Windows (?195|98|NT|2000) matches
    "Windows" in "Windows 3.1" but does not match "Windows" in "Windows 2000". Lookaheads
    do not consume characters; that is, after a match, the search for the next match
    begins immediately following the last, not after the characters that composed
    the lookahead. |

    | x|y | Matches either x or y. For example, [z|f] matches "z" or "food". |

    | [xyz] | Matches any one of the enclosed characters. For example, [abc] matches
    the "a" in "plain". |

    | [abc] | A negative character set. Matches any character not enclosed. For example,
    [^abc] matches the "p" in "plain". |

    | [a-z] | A range of characters in the specified range. [a-z] matches any lowercase
    alphabetic character in the range "a" through "z". |

    | [-az] | A negative range of characters. Matches any character not in the specified
    range. [^a-z] matches any character not in the range "a" through "z". |

    | \b | Matches a word boundary, that is, the position between a word and a space.
    For example, er\b matches the "er" in "never" but not the "er" in "verb". |

    | \B | Matches a word boundary. For example, er\B matches the "er" in "verb" but
    not the "er" in "never". |

    | \cx | Matches the control character by x. For example, \M matches a Ctrl+M or
    carriage-return character. The value of x must be in the range of A-Z or a-z.
    If not, c is assumed to be a literal "c" character. |

    | \d | Matches a digit. Equivalent to [0-9]. |

    | \D | Matches a nondigit. Equivalent to [^0-9]. |

    | \f | Matches a form-feed character. Equivalent to [\x0c\cJ]. |

    | \n | Matches a newline character. Equivalent to [\x0a\cJ]. |

    | \r | Matches a carriage-return character. Equivalent to [\x0d\cJ]. |

    | \s | Matches any whitespace character including space, tab, form-feed, and the
