    # # Using Regex for String Replacement


    Regular expressions are in very handy for generic string replacements. Not only
    are they fast and efficient at replacing simple static strings, but they are also
    extremely fast and efficient for replacing ranges and patterns of strings. This
    section begins by examining the Replace object. This function can be used for
    both basic replacements and back reference replacements. For the samples in this
    section, the static Replace function will be used. This function takes the input
    string, the regular expression pattern, and the replacement string. The replacement
    string is the subject of this section.


    # # Performing Basic String Replacement


    With basic string replacements, the result is replaced with a simple string. This
    string has no necessary attachment to the string being matched in any or spaces.
    This is normally used to remove noise from a string by removing whitespace, double
    characters, or digits from within text. The following code listing demonstrates
    basic replacements, mainly removal of whitespace and digits from:


    ```

    import System;

    import System.Text.RegularExpressions;


    var whitespace:String = " It Some Text ";

    whitespace = Regex.Replace(whitespace, "\s*", "");

    whitespace = Regex.Replace(whitespace, "\s$", "");

    Console.WriteLine("begin -->" + whitespace + "<-- end");


    var noisy:String = "Here is some te8wt7 buried numbers.";

    noisy = Regex.Replace(noisy, "\d+", "");

    Console.WriteLine(noisy);

    ```'
