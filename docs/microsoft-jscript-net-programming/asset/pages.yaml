  md: '# Chapter 10


    File access and manipulation is an extremely important programming task for most
    applications. File access is the process of locating files on disk and opening
    them in the application; file manipulation is the process of reading and writing
    to files. Large amounts of data needed by the application that are too large to
    stay in memory need to be accessed from disk. Intermediate calculations might
    have to be persisted to disk in case a user wants to come back and complete the
    operations. More important, storing user preferences and information so that the
    user experience of the application can be as pleasant as possible has to be done
    using IO. More often than not, great are taken to implement different formats,
    whether in binary, in a textual representation readable by the user, or now in
    XML. It''s difficult to write new file access mechanisms every time some small
    change features. With this in mind, the CLR team has provided a very comprehensive
    set of APIs that will make the amount of code needed much freer and simple as
    possible.


    Under C#.NET, the methods for performing IO are located in the System.IO namespace.
    System.IO namespace has quite a few members, but for the most part only a few
    of them are used. You''ll be examining the file-system navigation objects, File,
    FileInfo, Directory, DirectoryInfo, and Path. Each of these file-system navigation
    objects relates in some manner to investigating the underlying file system to
    find available files, get and set file attributes, and get information on how
    to work with file file are that are from the standard standard FATFS that most
    Windows programmers are used to.


    Then you''ll discover that all the IO objects require a Stream object that provides
    a minimal set of functionality for reading and writing to any information stream
    on the system. You''ll examine how to use this Stream class to create higher level
    IO objects such as BinaryReader, BinaryWriter, StreamReader, and StreamWriter.
    Figure 10.1 shows the System.IO namespace


    # File, FileInfo, Directory, DirectoryInfo, and Path


    The File, FileInfo. Directory, DirectoryInfo, and Path classes are used in some
    way to navigate or query the underlying file system for directories, and their
    attributes. Let''s start with the Path object you''ll probably want to use it
    build paths to the rest of the navigation objects.'
