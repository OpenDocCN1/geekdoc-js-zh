    To register an entire namespace of classes to a tag prefix using the Register
    directive, you may use the TagPrefix, Namespace, and Assembly attributes. TagPrefix
    is the string that should be associated with the namespace, Namespace is the namespace
    that needs to be imported, and Assembly is the assembly that contains the namespace.
    ASP.NET registers a tag prefix by default. The following is an example of how
    you could use to import the ASP.NET controls if they were not registered by default:


