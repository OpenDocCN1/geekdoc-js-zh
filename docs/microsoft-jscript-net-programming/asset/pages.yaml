  md: '# Setting Up a Basic Form


    Getting a basic form (windowed application) running is actually fairly trivial.
    The various Windows controls all have such large number of properties and methods
    that I won’t be able to show diagrams the text for each of the classes and for
    the Windows Namespace. You should try to use the Windows Forms documentation along
    with the discussions on Windows Features in this chapter, and try out some of
    the properties and methods that are missed in the text.


    The first step in Windows Forms application is to make a new form class. This
    class should be derived from System.Windows.Forms.Form or from some class that
    is descended from the Form class. This is actually the minimum amount of work
    required to get a new form ready to run, but we will do some additional work to
    make it more interesting. These additional steps include setting up a basic function
    for initializing the new form, customizing the startup location of the form, and
    setting up a main method for launching the form under STATThread (Single Threaded
    Apartment).


    The new class should have some constructor that initializes all the controls and
    UI for the form. This is where events are hooked up, menus are added, controls
    are added, and basic form properties are initialized. The Windows Forms designer
    does this by creating InitializeComponent() function, which is called from within
    the constructor. This makes it easy to separate any basic control and layout from
    more complex initializations such as opening database connections or setting up
    networking or Web requests.


    Because InitializeComponent is where all the basic form properties get set, there
    should be something to put there. Every form has properties that affect the size,
    layout, and state of the form after it is visible. Using the Text property can
    set the title for the form. The size of the form can be set by using the Size
    property and assigning a new instance of the Size class to the property. It might
    be easier to remember the Height and Width properties because they have more standard
    names, and are equally useful in setting up a form.


    Setting up the basic window''s location is achieved by either setting the Location
    property with a new Point, or both the Left and Top properties. To allow Windows
    to place the form, the StartPosition is assigned one of the values in the FormStartPosition
    enumeration. The available values are CenterPoint, CenterScreen, Manual, WindowsDefaultBounds,
    and WindowsDefaultLocation. The CenterPoint and WindowsDefaultBounds will also
    affect the form''s size as well as its location, so more care needs to be taken
    when using these options in order to get the correct results. The WindowState
    can also be specified using a FormWindowState. The WindowState specifies whether
    a form is in a normal state, a maximized state, or a minimized state. With these
    properties the form should be sufficiently initialized to look nice onscreen.
    But how is a form launched?


    WINDOWS FORMS Programming IN .NET'
