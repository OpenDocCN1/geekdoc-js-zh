    \ statement might return a strange exception or an OutOfMemory object. To make\
    \ a catch statement more generic, you simply change the type of the exception\
    \ variable to something more appropriate, in the following example:\n\n```\ntry\
    \ {\n    var UserID:int = Int32.Parse(\"HelloWorld\")\n} catch(e:FormatException)\
    \ {\n    // Here we only catch format exceptions.\n}\n```\n\nSo what if something\
    \ other than a format exception is thrown? Maybe for some reason the system runs\
    \ out of memory or the Int32.Parse performs some sort of security violation (which\
    \ is highly unlikely, but let's talk about it for argument's sake). In this case,\
    \ you specify the more generic handler for your...catch block and print the exception\
    \ information out to a log file. In this manner, you can write a program that\
    \ processes all unforeseen errors but still logs them so you can review them later\
    \ andpat additional error handling. The following example demonstrates two exception\
    \ handlers, the first of which is very specific and the second of which is a generic\
    \ handler to catch unforeseen error conditions:\n\n```\nimport System;\n\ntry\
    \ {\n    var UserID:int = Int32.Parse(\"HelloWorld\")\n} catch(e:FormatException)\
    \ {\n    UserID = 0; // Supply a default value ONLY for FormatExceptions\n}\n\n\
    \    // Use the ID somewhere down here\n} catch(e:Exception) {\n    // Place code\
    \ to write out Exception here\n    // This is our fallback code not our REAL error\
    \ code\n}\n```\n\nAny exception continues to cascade down a series of try blocks\
    \ until it finds a catch clause that can handle it. If the exception reaches the\
    \ system without finding a catch block for the exception, the program terminates\
