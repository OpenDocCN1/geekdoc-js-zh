  md: "# Declaring Methods\n\nNearly every class must have at least one method to\
    \ be useful. Methods allow you to modify the internal state of a class while it\
    \ is running by passing in parameters. You can also retrieve information about\
    \ the state of the class through method return values.\n\nMethods aren't just\
    \ for the programmer on the outside looking in. A class can implement private\
    \ methods that the class itself can call. For example, you might not want to put\
    \ an initialization function in a constructor, and you might instead call it from\
    \ the constructor.\n\nSome methods can be made visible only extremely when you're\
    \ creating a series of classes that share some functionality from your given class.\
    \ These methods can share functionality and you don't want to copy the function\
    \ again. By making the methods available only to a class and its derived classes,\
    \ you can ensure that code outside these classes won't call the function. You\
    \ can use this to limit access to important data.\n\n# Class Method Syntax\n\n\
    Every method definition in JavaScript .NET must include the function keyword so\
    \ that JavaScript .NET can determine if it is a function prototype or some other\
    \ form of inline code or variable syntax. The following syntax shows that the\
    \ function keyword is a required component of the class method definition. Properties\
    \ immediately precede the function keyword, and the function name immediately\
    \ follows the function keyword.\n\n```\nfunction MethodName() : ReturnType{\n\
    ...Code Block...\n}\n```\n\nEvery function must also have a blank parameter list,\
    \ delimited by parentheses, followed by a colon and the return type of the function.\
    \ The return type can be generally of type void to indicate that the function\
    \ has no real return value. Let's put this to work now with a sample method:\n\
    \n```\nclass Sample {\n    function A() : void {\n}\n```\n\nIn this example you\
    \ don't even need to specify a visibility attribute because public is the default.\
    \ (If you've forgotten the available class and member attributes, refer to Chapter\
    \ 6.)\n\nIf you need to specify any attributes, you do so before the function\
    \ keyword. The attributes you could specify be any of the JavaScript .NET defined\
    \ attributes or any custom CLR attributes. Placing these attributes on methods\
    \ can get pretty complicated in terms of order and such, so"
