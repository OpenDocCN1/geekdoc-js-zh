    quickly comment out large blocks of code or documentation. The inline/block comment
    is the most commonly used type of comment. The comment starts with a begin tag
    (/*) and ends with an end of comment tag (*). There are some places where these
    tags are not recognized. For example, you can''t embed them in string literals
    and expect them to act as comments. Listing 4.10 shows an example of the use of
    inline/block comments.


    # Listing 4.10 Using Inline/Block Comments


    ```

