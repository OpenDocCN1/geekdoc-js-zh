    # The StreamWriter Class


    The StreamWriter is responsible only for reading information out of a file, but
    if you want to write to the file? For there is the StreamWriter class. The StreamWriter
    is created identically to the StreamReader seen previously. In addition, there
    is an AutoFlush property. If you''ve forgotten the constructors already, you can
    read the preceding section.


    The StreamWriter has the BaseStream property and an Encoding property that is
    identical to the CurrentEncoding property of the StreamReader. When many types
    of IO are performed, any data written to a stream is queued in an internal buffer.
    For the data to be written to the stream, the buffer must become full or an explicit
    call to the Flush method must be made. The AutoFlush property overcomes the necessity
    to call the Flush method by automatically flushing every time you write to the
    stream.


    The AutoFlush property is really bad for performance on slow devices such as floppy
    drives and magnetic tape drives, or on network streams that perform some network
    IO every time the StreamWriter is flushed. Another thing to note is that Flush
    is called whenever the programmer won''t have to call the Flush method or set
    the AutoFlush property.


    The StreamWriter also shares some methods with the StreamReader class. The Close
    method releases the underlying stream resources and flushes any data to the underlying
    medium. The Flush method is new and allows you to directly control when data is
    written to disk. Most you''ll pick a time when it won''t affect program performance
    and then call Flush, or you''ll do some extensive work and call Flush after each
