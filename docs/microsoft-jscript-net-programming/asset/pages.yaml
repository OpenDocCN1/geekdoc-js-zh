    The remaining bitwise operators correspond with the AND, OR, XOR, and NOT operations.
    When you use AND on two variables or numeric values, each bit is set (that is,
    a 1) in both values is set (that is, a 1 bit) in the result, whereas any other
    combination is unset (that is, a 0 bit).


    The most common use of the JavaScript AND operator (&) and its inline assignment
    equivalent (&= is to test the existence of a single bit or specific bits in a
    number. For instance, because 1110 (14) & 1100 (12) = 1100 (12), you can use the
    value 1100 (12) to mask bits 3 and 4 of a number so that you test those bits and
    only those bits. As shown in Listing 4.6, you can use the Convert object to print
    out binary values.


    # LISTING 4.6 Binary Bit Masking


    ```

    import System;


    var FullValue:int = 255;

    var MaskHigh:int = 240;

    var MaskLow:int = 15;

    var MaskStripe:int = 170;

    ```


    ```

    var Result = 0;


    // Lets mask some values out to Result

    Result = FullValue & MaskHigh;

    Console.WriteLine(Convert.ToString(Result, 2));

    ```


    ```

    Result = FullValue & MaskStripe;

    Console.WriteLine(Convert.ToString(Result, 2));

    ```


