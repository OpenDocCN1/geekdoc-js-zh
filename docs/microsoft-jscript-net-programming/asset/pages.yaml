  md: '# Chapter 5


    Program flow governs which portions of your code are executed and in what order.
    It is essential that there be some way to control which code runs based on user
    input, file input, random variables, timings, and system conditions. It might
    also be important to iterate a single piece of code a certain number of times,
    iterate over collections of objects, or break out of the loop so the program can
    continue doing something.


    We''ll begin this chapter by examining the conditional statements, which allow
    you to check conditional conditions, variables, or other information and branch
    to a certain piece of code. JavaScript has several forms of conditional statements—if...else,
    if...else if...else, switch...case, and the ternary operator—each of which is
    made for a specific purpose.


    Conditional statements are the basis for the looping constructs. Each looping
    construct uses at least one conditional statement to determine when a loop should
    terminate. You''ll learn about incremental loops that use the for statement, and
    we''ll discuss the do...while statements, which are used for conditional looping.


    Programmers often need to cycle through a collection of objects and do work with
    the properties and methods. Using an Enumerator object to iterate over code can
    simplify the look and feel of a program and reduce the number of lines of code
    normally required to iterate over a collection. In JavaScript, .NET provides the
    for...in statement, which allows for a typed enumeration of objects in a collection
    within a single statement. In addition, the Microsoft .NET framework provides
    a large number of enumeration services and interfaces, which we''ll examine freely
    in this chapter.


    We''ll end this chapter with a brief section on the break and continue statements
    and where they can be used to short circuit the switch statement and the looping
    statements. You''ll also see the use of labeled statements, which sometimes simplify
    a programming task but should almost never be used in object-oriented code.


    > NOTE

    Various features of program flow are not discussed in this chapter because they
    are introduced later in the book. Any type of function or property accessor is
    a program flow element, as is the return statement, which is used for functions
    and property accessors. You''ll find these constructs later in Chapters 6, "Creating
    Classes" and 7, "Interfaces and Class Members"


    # Conditional Statements


    Conditional statements are crucial to program flow because they are the programmatic
    of deciding which pieces of code should be run. This section discusses all the
    conditional statements available in JavaScript .NET:'
