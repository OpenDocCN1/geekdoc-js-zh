    # Note


    If you extend a base class that implements an interface, that interface is in
    turn automatically inherited by the derived class. Oftimes it might feel right
    to implement the interface in the derived class as well, but that is unnecessary.
    Although it''s not a compiler error or a runtime error, it introduces additional
    code baggage.


    To implement an interface or multiple interfaces, you use the implements keyword,
    immediately following the class name or immediately following the extends declaration.
    The interfaces that are being implemented should be separated by a comma. The
    following example demonstrates the use of implement and extends keywords to extend
    base classes and implement interfaces:


    ```

    class Class {

    // Normal class

    }

    class Class1 implements Interface {

    // Class definition with one interface

    }

    class Class2 extends Class implements Interface {

    // Class definition with base class and one interface

    }

    class Class3 implements Interface1, Interface2, Interface3 {

    // Class definition with many interfaces

    }

    ```


    # Using Encapsulation Over a Subclass


    Often, extending a single class in a single inheritance puts you at a programming
    disadvantage because soon as you decide to create one type of object, you limit
    it from ever becoming another type of object. You might also face situations in
    which you need to extend the abilities of a class that is sealed with the final
    keyword. In both of these instances, encapsulation comes into play because you''re
    not limited to the number of types you can encapsulate, and you can always encapsulate
    those sealed classes by housing instances of them in a class.'
