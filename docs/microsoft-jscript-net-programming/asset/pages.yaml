    # Using Comments


    You''re probably wondering why comments can be considered so important to code—and
    even more important than the code itself in many cases. The answer is simple:
    After months of coding, you might not remember the code you wrote at the beginning
    of the project. This often happens when a programmer spends several weeks optimizing
    a piece of code and later goes back to work on that same code and cannot remember
    why the code was written a certain way. If the programmer uses comments in the
    code and explains why he or she did certain things, that programmer—or another
    programmer—would''t have any trouble with the code again, even after months or
    years.


    There are many other reasons to comment your code. Comments are a first-line defense
    against coworkers you you about your code. And if a programmer leaves a company,
    comments minimize the disruption because a new programmer can get up to speed
    simply by reading the code comments without asking people. Furthermore, at the
    end of the product cycle, you can use comments as a base for documentation.


    Comments can go anywhere in JavaScript .NET. Like whitespace, are ignored by the
    compiler, leaving you free to place them on class definitions, on constructors,
    before functions, inside functions, and even inline with the parameters of a function
    call. You should put comments in all these places because they''ll all be helpful
    down the road.


    JavaScript supports a couple different commenting syntaxes: the inline/block comment
    syntax and the single-line/end-of-line syntax.'
