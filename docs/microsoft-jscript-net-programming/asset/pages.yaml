    # Existential Attributes


    Existential attributes—abstract and final—are extremely important in object-oriented
    programming and thus have gained great importance in JScript .NET. These attributes
    enable to enforce issues on derived classes. In the case of the abstract attribute,
    this means requiring a derived class to implement a method. The final attribute
    prevents the derived class from implementing a method.


    When the abstract attribute is applied to classes, it makes them unavailable for
    use by the programmer. However, classes can be inherited and used as base classes.
    When you have an abstract class, you need to create a subclass rather than the
    abstract class directly. You can also declare members to abstract; this simply
    means that the member doesn''t have an implementation and will expect any base
    classes to provide one.


    By default, all public and protected members of a base class can be overridden
    and all classes can be used as base classes. To prevent this, you need to use
    the final attribute on the class or member. This effectively marks it as off limits
    so that it cannot be overridden or inherited by a derived class. The existential
    attributes work in hand with the versioning attributes, which are discussed in
    the following section.


    # Versioning Attributes


    The versioning attributes, hide and override, are used to specify the type of
    behavior exhibited when implementing members of the base class in a derived subclass.
    The hide attribute specifies a new method that does not override the base class
    method, and it hides the base class implementation. The override attribute specifies
    that an implementation is provided for the base class method. Providing an overridden
    function is the default in JScript. The versioning attributes are a fairly complex
    set of attributes, and we will discuss them further in the section “Inheritance
    and Subclassing."


    > The common use of the hide attribute is to change the return type of a function
    rather than simply overriding the function by using its normal return type. You
    can also use hide to specify implementations for members marked final in the base
    class.'
