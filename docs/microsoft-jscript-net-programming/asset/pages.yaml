    \ - Add each of the controls as a private field of the form. You do this so that\
    \ the controls can be accessed anywhere in the form.\n\n+   - Initialize the fields\
    \ in the InitializeComponent section of the form. You also need to add them to\
    \ the form's Controls collection or they won't show up when the form is shown.\n\
    \n+   - Make sure that the components are displayed on the resulting form. This\
    \ is the most crucial step because placement of some controls will affect other\
    \ controls. This can sometimes controls outside of the bounds of the form window\
    \ and make inaccessible. If you are using the form layout manager, this isn't\
    \ usually an issue, but if you are using custom layouts, you'll want to make sure\
