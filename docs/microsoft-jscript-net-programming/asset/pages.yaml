  md: '# Chapter 3


    # Providing Initial Values for Variables


    You can initialize variables with default values. You might want to do this to
    ensure that you have some working values before the code starts operating on them.
    You can also see some of the compiler errors by creating initialization expressions
    where the type of the initializing value is of a different type than the variable
    it is assigned. For example, the following example assigns the string constant
    "Hello" to StringVar and the value 10 to IntVar.


    ```

    import System;

    import System.Collections;


    // Valid Initializers

    var StringVar:String = "Hello";nvar IntVar:Int32 = 10;

    var HashVar:Hashtable = new Hashtable();


    // Tricky Initializers

    var String2Var:String = 23;

    var Int2Var:Int32 = "27";

    ```


    ```

    var IntVar:Int32 = "Hello";

    ```


    The new keyword creates a new instance of a hashtable. The next assignment is
    rather tricky—it assigns a numeric value to String2Var. You would think this would
    result in a compiler error, but JScript convert the numeric constant 23 to the
    string constant "23". Furthermore, the JavaScript compiler turns the string "27"
    into the numeric constant 27 so that Int2Var contains a numeric value. The next
    couple initializer throws some errors because you cannot assign a string constant
    that cannot be parsed as a number into a numeric variable. Notice that the example
    does not provide invalid syntax for assigning values to a String object because
    any type or value can be converted to be assigned to the String object. We''ll
    discuss this further in the section "Using the String Object," later in this chapter.


    TIP


    Every object in the .NET framework supports the ToString() method, which returns
    the string representation of an object (which can be a name, a serialized version
    of the object, or any other textual representation). Therefore, assigning any
    value or object to a String object does not throw an error in JScript because
    JavaScript converts any object into JScript before continuing. Note that this
    can cause strange values to be assigned to string variables and sometimes cause
    code to go down a code path you wouldn''t normally expect.'
