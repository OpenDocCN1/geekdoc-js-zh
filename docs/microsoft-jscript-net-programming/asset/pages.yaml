  md: "# Chapter 5\n\n![](img/7d779d3c15b9095d220d4f5d5c9b327f_108_0.png)\n\nFIGURE\
    \ 5.1\nnThe Path of the for Statement in Listing 5.2.\n\nThe for statement can\
    \ be used to create any type of loop necessary to control the flow of a program.\
    \ But sometimes it is more than you need, when a simple conditional loop could\
    \ do the job.\n\n# Conditional Looping with while\n\nSimpler alternatives to the\
    \ for are the while and do...while statements. These statements have only two\
    \ statements, rather than the four statements used by the for loop: A loop begins\
    \ with a conditional statement and ends with a code block that is executed when\
    \ the conditional statement is true. If you need to initialize loop variables,\
    \ you need to do so outside the loop. If you need to increment iteration variables,\
    \ you need to do so inside the loop, somewhere near the end. The following example\
    \ demonstrates a very simple while loop that prints the values 0 through 9:\n\n\
    ```\nvar i:int = 0;\nwhile(i<10) {\n  Console.WriteLine(i);\n  ++\n}\n```\n\n\
    Generally speaking, you use while for more abstract loops than for simple incremental\
    \ loops. For instance, a program might keep running unless a special key is pressed.\
    \ The program might perform this action by setting a Boolean variable to true\
    \ when the program should run, and when it detects this, it flips the variable\
    \ to false. When it is time for the conditional statement in the loop to run,\
    \ the program breaks out of the loop and ends. The following example demonstrates\
    \ a loop that gets user input until the user presses the Q key, at which the globalBoolean\
    \ variable is set to false and the while loop terminates:\n\n```\nvar globalBoolean:Boolean\
    \ = true;\nwhile(globalBoolean) {\n  // Grab some user input\n  if ( UserInput\
    \ == \"Q\" ) {\n    globalBoolean = false;\n  }\n}\n```"
