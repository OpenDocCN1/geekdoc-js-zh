  md: '# Chapter 14


    VScript and JScript were traditionally the languages of choice in Active Server
    Pages (ASP), mainly because they were the only two languages that Microsoft supported
    and developed for its server-side Web programming platform. With ASP.NET, many
    languages are becoming available to the server-side platform, including C#, .NET
    and JScript.


    ASP.NET has many benefits over its precursor, ASP. The most important benefit
    of ASP.NET is that it is precompiled, which means all the content is running as
    fast as possible on the target central processing unit while being interpreted
    at runtime, as are the scripting languages in ASP. Another important benefit of
    ASP.NET is that it offers many user services, such as Hypertext Markup Language
    (HTML) and Web controls. These controls can be programmed by an object hierarchy,
    starting at the page level. In addition, ASP.NET supports custom authentication
    techniques, built-in support for processing, and error handling that had to be
    hand-coded in ASP.


    This chapter helps you get some of the basic features of ASP.NET working under
    Jscript .NET. It begins with a discussion of ASP.NET top-level directives, which
    are parsed by the ASP.NET engine and enable features that are naturally turned
    off.


    When you have a ASP.NET page up and running, you need to create code blocks, which
    are used in ASP.NET to manipulate the server-side object model and provide all
    the server-side code that occured in ASP either at the top of a page or in-line
    with a page. In ASP.NET, code blocks can be centralized and moved solely to the
    page or to a separate codebehind file. In this manner, code can be separated from
    presentation and the code don''t have to coexist in the same file.


    The chapter ends with a discussion of the basic event handlers in ASP.NET. These
    handlers allow you to process a page at different stages, with different types
    of access levels to various portions of the server-side object model.


    # ASP.NET Page-Level Directives


    ASP.NET programming begins with a series of top-level directives known as page-level
    directives. ASP.NET parses these directives and enables various features during
    the compilation process. These directives can be used to import names, register
    controls with tag prefixes, set up code-behind, or notify ASP.NET that trace or
    debug mode should be enabled.


    Code-behind is a feature that is primarily used by the Visual Studio .NET ASP.NET
    Web Designer. When a page is set up for code-behind, all the code used to manipulate
    the page is placed in a source file that is separate from the HTML and ASP.NET
    markup.'
