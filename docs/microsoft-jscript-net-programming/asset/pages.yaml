  md: "```\npublic function FromArray(square:int[]) : IntegerSquare {\n    return\
    \ new IntegerSquare(square[0], square[1], square[2]);\n}\n```\n\nThis example\
    \ demonstrates that a static function can be used to generate an otherwise unstable\
    \ class. Normally, when valid parameters are passed to a constructor, an exception\
    \ is thrown. In the case of a static function, you can choose to return null rather\
    \ than an exception. This form of programming means performance gains if you plan\
    \ on creating a large number of invalid objects. Static members often come into\
    \ play when you're working with properties and fields, which are discussed in\
    \ the following section.\n\n# Properties and Fields\n\nYou use properties and\
    \ fields to get data from a class or set new pieces of data. Generally, you should\
    \ set up properties and fields within a class that gives access to any data in\
    \ a managed way. After all, some data might be kept private, some data might have\
    \ to be presented in a special manner, and other data might have to be initialized\
    \ before the user is given access.\n\nFields are the easier choice for accessing\
    \ internal variables. When a class variable is defined as public, it automatically\
    \ becomes a field, and when this happens, a user can get and set the value of\
    \ that variable without any access control.\n\nProperties are more complicated\
    \ than fields, but you can control whether a property can be read from or written\
    \ to. With a property you can also provide data abstraction. The user isn't directly\
    \ setting the variable, you can test any conditions within the property before\
    \ you set the member variable to the new value, or you can make the property a\
    \ valid value before passing it back to the user.\n\nThe discussion in the following\
    \ subsections focuses on fields as public and protected member variables because\
    \ these are the most commonly employed options for data availability in a class.\n\
    \n# Fields for Simple Variable Access\n\nYou create fields when you declare a\
    \ variable within a class definition. Fields can either be private fields accessed\
    \ only by a class, public fields that can be accessed by anyone using the class,\
    \ or protected fields that can be accessed only by the class or from its derived\
    \ classes.\n\nThe most-often-used type of field is the public field. You can set\
    \ and retrieve public fields from any code that makes use of the class. Public\
    \ fields offer no access control and in code, they look like the easiest way to\
    \ have users interact with member variables in a class."
