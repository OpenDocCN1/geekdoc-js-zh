    # The String Object


    The String object is probably the most widely used and also the most complex object
    available in JavaScript surrounding this object is fairly complex because there
    is only one object that is converted-on-the-fly by a JavaScript string and a CLR
    String object. All the functions and properties of both objects are available
    to programmers, and so are legacy JavaScript semantics. In .NET languages it is
    very easy to catch exceptions using a String object. In .NET, you rarely see this
    because the compiler does conversions, casting, and initializations for you. This
    section examines the important aspects of String objects.


    # Declaring Strings


    Two types in JavaScript (String and System.String) evaluate to the same String
    object. This is because a JavaScript object and a CLR String object both map to
    a CLR String object internally. Then, special handler functions are called whenever
    a JavaScript object function is called. Therefore, the programmer sees great performance
    from CLR String objects as well as great flexibility because existing code that
    works on the String object continues to work. Here''s an example of calling both
    String methods and CLR String methods on the same String object.


    ```

    var MyString = "Hello";

    ```


    ```

    MyString.toString();

    MyString.ToString();

    ```


    This example calls both toString(), which is a JavaScript function and ToString(),
    which is a CLR function. For the toString() function, a special call is made into
    a JavaScript helper library, and the string is printed according the rules of
    JavaScript. The ToString() function, on the other hand, is called directly from
    the String object and returns according to CLR rules. The two functions behave
