  md: "Another form of the while statement iterates endlessly, unless a break statement\
    \ allows the program to break free. In this form, the conditional statement always\
    \ evaluates to true and some complex logic inside the loop decides when the loop\
    \ should end. The following example demonstrates the use of the break statement\
    \ to short-circuit a while loop, and even though the conditional statement isn't\
    \ used to exit the loop:\n\n```\nwhile(true) {\n// Grab user input\nif (UserInput\
