  md: '# Chapter 11


    The introduction of eXtensible Markup Language (XML) has revolutionized how hierarchical
    data is stored and will continue to shape the way programs are developed in the
    future. You can easily incorporate each of the application programming interfaces
    (APIs) you''ll discover in this chapter into programs so that you can use XML
    as a data format rather than coding a custom format.


    We will start this chapter by examining the System.xml namespace and how to load
    content using XML classes. Each of the classes in the System.xml namespace provides
    a unique set of access APIs, depending on how you want to load and read the XML
    document in question. Next, we''ll talk about how to enumerate the elements and
    attributes that exist in the XML document. Finally, we''ll talk about how to write
    new XML content.


    Make sure to read all the tips in this chapter with extra care because they point
    out lots of tricks and suggestions that should help you spend less time on input/output
    and more time on application features.


    # # The System.xml Namespace


    The System.xml namespace houses all the XML-related classes for the common language
    runtime (CLR). These classes are capable of loading and manipulating existing
    XML documents and writing new XML content. There are a number of methods for reading
    and writing XML. The classes in the System.xml namespace provide methods for reading
    XML in a tree or hierarchical form. There is also a series of classes for reading
    and writing data in a linear format, starting at the beginning of an XML document
    and reading straight through the end.


    The following are the classes that will be discussed in this section (see Figure
    11.1):


    +   **XmlDocument**—The XmlDocument class is used to load XML content into a hierarchical
    or tree form. Each element in this tree is represented by an XmlNode class and
    is the most basic class for accessing XML data in an XmlDocument class.

    **XmlTextReader**—The XmlTextReader class is used to read an XML document in a
    linear manner. This class reads the document from the beginning to the end and
    does not take into account the tree-like format of most XML documents.

    **XmlTextWriter**—The XmlTextWriter class is used to write an XML document. This
    class is not capable of building an XML document tree through the creation of
    XmlNode elements like the XmlDocument class, but it is extremely quick at emitting
    XML content if all the data is available to be written at the same time.'
