  md: '# Chapter 12


    In nearly every type of application, some sort of string or user input parsing
    is required. This can involve parsing items off of the command line, processing
    user input to ensure that it is a valid format, or searching for important data
    in documents or HTML pages. Each of these items quantifies an excellent place
    to use regular expressions when the item being searched for isn''t exact. Regular
    expressions have the capability to match patterns in data rather than strings
    that are hard-coded into a program or strings that are input by the user, by they
    still cannot match a group of different inputs. Regular expressions be seen as
    just another programming tool, and that is how they are used in script.


    In JavaScript, rather than making regular expressions an external tool or library,
    they are accounted for directly in the language syntax. The JavaScript .NET language
    has direct support for regular expressions in some of the built-in objects such
    the String object and the global RegExp. JavaScript .NET also maintains syntax
    for returning a regular expression using an inline format, so in this manner regular
    expressions are present directly in source rather than being created using the
    new operator and normal object-creation mechanisms.


    In addition to having a huge amount of regular expression support in the JavaScript
    .NET language, a huge amount of support is available through the CLR (Common Language
    Runtime). In many ways the CLR support for regular expressions is far superior
    to that implemented in the CLR, most of the code samples and documentation focus
    on the CLR classes rather than the JavaScript .NET native syntax. It should be
    noted that in future versions of JavaScript .NET, more care will be taken to integrate
    the JavaScript regular expressions with the CLR classes, making the JavaScript
    inline syntax much more attractive.


    After the basic classes for regular expression manipulation are discussed in detail,
    the chapter moves on matching basic patterns using the CLR classes. This includes
    using both the instance classes and static methods to complete matches, and the
    differences between the two. Regular expressions can also be used for general
    string replacements. The associated syntax for this, discussed in the section
    "Using Regex for String Replacement," will help build the documentation for the
    CLR regular expression classes.


    # JavaScript Regex Support


    JavaScript .NET has built-support for regular expressions, used to find arbitrary
    patterns in text rather than static strings. Regular expressions can be created
    inline with code using special syntax. Many of the built-in JavaScript objects
    also take either a string or a regular expression for parameters. A good example
    is the String.replace method, which can take either a string or a regular expression
    for the match property with a normal string property being used as the string
    replacement. This section begins with a discussion of this inline regular expression
    support and how useful it be in JavaScript .NET.'
