  md: '# Chapter 11


    With an XmlNode object in hand, the next step is to either add additional elements
    to the node you are creating, set any properties, or add the node somewhere in
    the document collection. The XmlNode object has a series of methods for placing
    nodes in the ChildNodes collection. You can append nodes to the end of the collection
    using AppendChild, and InsertAfter and InsertBefore methods. You can also load
    the node by using the beginning of the collection using PrependChild, replace
    another node by using ReplaceChild, or remove a single child or all children using
    RemoveChild and RemoveAll. Listing 11.7 uses the InsertAfter function and places
    additional <INTERNAL> elements directly in the document.


    Adding attributes is better than adding element nodes because element nodes are
    accessed by the ChildNodes property and attributes are accessed through the Attributes
    property. First, you must get the XmlAttributeCollection object by accessing the
    Attributes property. You add by using a set of methods that are identical in operation
    to those found in the XmlNode class, including the Append, InsertAfter, InsertBefore,
    Prepend, Remove, RemoveAll and RemoveAt methods. When functions require a parameter,
    you use an XmlAttribute object, which you can create by using the CreateAttribute
    method of the XmlDocument class.


    > You can consume a series of XmlDocument class events as objects are added and
    removed. Programs can use these events by passing XmlDocument instances into library
    calls to determine whether the library modifies the XmlDocument in any way.


    The final set of methods is used to save the Xml content. Saving the document
    finalizes the modifications. If the file is not saved after it has been modified,
    the modified version is not reflected in the file disk and is destroyed when the
    program exits. You can do this by using the Save method of the XmlDocument class.
    The closest of the Save overloads is the String overload, which takes the filename
    to save. In addition to the Save methods, the XmlDocument class also contains
    the WriteTo and WriteContent methods, which can be used to write entire documents
