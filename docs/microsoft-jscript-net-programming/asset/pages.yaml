  md: 'This allows for the code and presentation to be separated.


    In addition to splitting the code from the page and design markup, code-behind
    also enables designers to more easily parse and change the code or markup on an
    individual basis. The code can also be compiled into an assembly without compiling
    the page content.


    Code-behind is discussed in detail later in this chapter.


    You can create a very basic ASP.NET page that has no page-level directives and
    no server-side code. The only requirements of an ASP.NET page are that it be created
    with the .aspx file extension and that it run on a Web server that supports ASP.NET.
    The page directives discussed in this section include the Page directive, the
    Import, Assembly, and Register directives.


    # # The Page Directive


    The Page directive is used to control page-level options as the programming language
    used, the debug and tracing flags, and the character encoding. The code snippet
    demonstrates the basic format of directives. In the case of Page directives,


    *DirectivePrefix* is the Page directive. The Page is used in almost every ASP.NET
    page, to specify various compile-attributes, including the debug and trace options.


    ```

    <@ DirectivePrefix attribute="value" [attribute="value" ...] %>

    ```


    The Page attributes start with the Language attribute, which you use to specify
    the default language for the response of the ASP.NET file. After the language
    is set at the page level, it can''t be changed by a code block. If any code block
    specifies an alternate language, it will cause errors. In this chapter, the Language
    attribute is set to either JavaScript or JavaScript .NET.


    You use the Debug and Trace attributes to control debugging information. Setting
    the Debug attribute to true enables debugging information to generated; all errors
    are then shown with line numbers and offsets in the source file. This is extremely
    helpful and is identifying the debug+ switch to the command compiler. The Trace
    attribute to true enables a large printout of information at the bottom of the
    rendered ASP.NET page. This information includes the rendered sizes of various
    controls, the amount of time it took to render each on the page, and a list of
    all the server collections.


    ASP.NET includes two states: session state, which enables you to save information
    for a client across page requests, and view state, which enables a page to save
    control values and information as the page is posted back. Session state, is enabled
    by default, but you can disable it by setting the EnableSessionAttribute to false.
    Disabling session state causes a very many


