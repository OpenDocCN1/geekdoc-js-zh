  md: "# Interfaces and Class Members\n\nany of the variable declarations you've seen\
    \ before in this book, only they must appear within the class definition code\
    \ block and outside any constructors, functions, or property definitions, as in\
    \ the following example:\n\n```\nclass ClassWithPublicFields {\n    public var\
    \ Field:int = 5;\n}\n```\n\nvar o:ClassWithPublicFields = new ClassWithPublicFields();\n\
    o.Field = 20;\nConsole.WriteLine(o.Field);\n\n20\n\nThis example clearly demonstrates\
    \ the declaration and use of a public field. It also shows that a field can be\
    \ initialized to a value when the class instance is initialized. This can come\
    \ in handy for providing default values for variables you don't want to explicitly\
    \ set.\n\nYou can also use protected fields when you want to limit access to a\
    \ class or its derived classes. In this manner you can provide some data to subclasses\
    \ that you might not want to make available to the normal user of the class. By\
    \ marking it protected, you can also ensure that future classes can never change\
    \ the access type to public.\n\nYou should use private fields when you need to\
    \ hide data from the user. Most often, public and protected properties on an object\
