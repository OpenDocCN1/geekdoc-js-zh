  md: 'If the match is successful, the Groups property can be investigated to get
    subpatterns from the Match. The Groups property can be indexed using either an
    ordinal index or a string index by using the name of the group, assuming it was
    a named group. There aren''t any important properties on the Match object. Any
    important properties are inherited from either the Group object or the Capture
    object. So let''s move on to these two classes.


    # Group and Capture Classes


    The Group and Capture objects are very similar. A Group object is the actual group
    match. This can be a named pattern match using a string identity. It can be a
    numbered pattern match, or it can be a match that wasn''t given an explicit name
    or number, but was assigned a default ordinal based on the location in the string.
    This is normally as far as a programmer needs to get all the results from a regular
    expression.


    The Group object has a Captures property, though. This returns a CaptureCollection
    that can be indexed by ordinal. Just as with the GroupCollection for the Match
    object, the Capture at ordinal 8 will be the same as Group.Value. Again, really
    isn''t important to get down low in this object hierarchy when examining most
    matches. One benefit of the Capture object, however, is the Index and the Length
    properties. Group and Match objects inherit both of these properties, and represent
    the start and length of where the Match, Group, or Capture occurred in the string.


    This should be enough information to get working on some basic pattern matches.
    The following section is dedicated to just matching patterns, examining all the
    properties and the methods discussed in this section, and using the static methods
    in addition to the instance methods.


