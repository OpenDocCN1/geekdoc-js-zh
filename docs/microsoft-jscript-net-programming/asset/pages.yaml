  md: '# Regular Expressions


    In addition to the inline regular expression, JScript .NET also supports a special
    global regular expression object ( RegExp). This object can be queried to provide
    the results for the previous match. This is often useful when you are using inline
    expressions because the match object is lost in the method call. This global object
    ensures that there is always an object from which to get results.


    Built-in support for regular expressions also means having a format the regular
    expressions must appear in. There is a true standard for regular expressions,
    and JScript is compliant with a subset of the standard. This subset includes metacharacters,
    look-ahead assertions, and back references. Don''t be concerned if you don''t
    understand these principles yet; I''ll explain many of them throughout the chapter.


    # Inline Regular Expression Support


    Inline expression in JScript .NET basically means that the language has special
    syntax for denoting a regular expression with code. For languages that don''t
    support an inline format, you have to create an object and pass in parameters
    each time you want to create a pattern. JScript supports both inline expressions
    and object-oriented regular expressions because the RegExp object can be used
    to generate new regular expression objects, but generally the inline format will
    work.


    The inline format uses forward slashes to surround text that denotes a regular
    expression pattern. Any regular expression options can be placed after the second
    forward slash. The result of this expression will be assigned to a variable within
    the program or passed as a function. Following is a sample expression:


    ```

    // /(\d+)/i; // Match a number with multiple digits. Case-insensitive option

    ```


    But what exactly does a JScript .NET inline regular expression generate? It generates
    a Microsoft.RegExpObject. This object represents the inline regular expression
    and handles all the logic that JScript .NET performs behind the scenes.


    In addition to the regular object being created by using an inline syntax, they
    can be created using the new operator and the RegExp object. The RegExp operator
    takes two parameters, the first being the regular expression and the second being
    the regular expression options. The following code demonstrates typing of the
    inline expression to a variable and varying the result of an explicit RegExp object:


    ```

    import Microsoft.JScript;

    var typedInline:RegExpObject = /(\d+)/i;

    var typedExplicit:RegExpObject = new RegExp("(\d+)", "i");

    ```


