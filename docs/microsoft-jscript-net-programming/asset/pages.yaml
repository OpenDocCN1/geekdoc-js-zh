  md: '# Bitwise and Boolean Operators


    The bitwise and Boolean operators are generally considered to be more advanced
    than the operators discussed to this point because they work on pieces or parts
    of a variable (bits) rather than the entire variable. Like the arithmetic operators,
    bitwise and Boolean operators come in two flavors: statements and inline assignment
    operators.


    # Bitwise Operators


    There are bitwise operators for every possible bitwise operation except for rotation.
    A bitwise operator works on the individual bits of a value rather than the entire
    value. Bitwise operators are capable of combining the bits of value in different
    ways ([&], [or], and ^ [xor]) and shifting or transporting bits >> [shift right]
    and << [shift left] in a value.


    The shift operator shifts the bits of a number either left or right by a number
    of positions. The left shift operator (<<) shifts bits to the left number of spaces,
    increasing the value of the numeric expression. To shift to the right, use a right
    shift operator (> or >>>). The >> operator preserves the sign negative positive
    of the value, and the >>> operator is sign independent, meaning that it works
    on the bits and doesn''t take into account that the number may be negative or
    positive. (Having two versions of this operator is unique to the JScript language.)
    There are inline assignment versions of each of these operators (that is, <<=,
    >>=, >>>=).


    Oentimes, shifting operations can do the same work as more expensive operations.
    It used to be extremely costly to multiply and divide on most consumer machines,
    so mechanisms called multiplication and shift division were developed. If you
    shift a value left one space, it has the same effect as multiplying by 2, and
    shifting right by 1 has the effect of dividing by 2. Shift multiplication and
    shift division are especially heavy when computing pixel offset in games.


    Listing 4.5 shows the shift operators in action. At the end of the bitwise operators,
    let''s see if we can come up with an encryption/decryption algorithm and a hash
    algorithm. In Listing 4.5, you can shift 1 left by 10 spaces to get a kilobyte,
    by 20 for a megabyte, and by 30 for a gigabyte.


    # Listing 4.5 Using Shift Operators


    ```

    import System;

    Console.WriteLine(1 << 10); // 1 Kilobyte

    Console.WriteLine(1 << 20); // 1 Megabyte

    Console.WriteLine(1 << 30); // 1 Gigabyte

    ```'
