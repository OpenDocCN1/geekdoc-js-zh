    \ class that it inherits. jScript .NET cannot declare new events or delegates\
    \ (that is, functions that define an event), and it has no mechanism for including\
    \ delegates in a class. What does this mean in terms of event support? First,\
    \ JavaScript can consume events. This means you can hook up an event handler to\
    \ the events of another object and receive notifications in the form of the event\
    \ being called.\n\nSecond, you can derive a type from some base class that was\
    \ written in .NET language and therefore inherit its events. You can't modify\
