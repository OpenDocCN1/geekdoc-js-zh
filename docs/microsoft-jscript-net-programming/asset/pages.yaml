    # ## 12.1


    *The System.Text.RegularExpressions namespace.*


    The parsing engine implemented for CLR regular expressions is fast enough to build
    simple string processing or even parsers for custom languages. ASP.NET processing
    and parsing was built entirely out of regular expressions, and all parsing is
    done at page compile-time using the classes available in the RegularExpressions
    namespace.


    To fully understand the CLR regular expressions, you need to examine each of the
    objects available in the System.Text.RegularExpressions namespace, along with
    the relationships between them. This section of the book discusses four primary
    classes: the Regex, which represents a parsing entity; the Match, which represents
    the results of a full regular expression hit on the string; the Group, which represents
    a matched group between parentheses; and, one step further, the Capture, which
    represents an individual match of an item within a matching group. It all starts
    with the Regex, so that is where this section begins.


    # ## Regex Class


    The Regex represents the entire pattern to be matched. The Regex also contains
    any engine options such as the global option (g) or the case-insensitive option
    (i). Because the Regex class contains information on the regular expression engine
    and the pattern to be matched, it is the start of every pattern match. The Regex
    class can be used in two ways. The first way is as an instance class. This means
    a Regex class can be generated from a pattern and some engine options, and then
    it can be used multiple times to match patterns. This is the way it should be
    used if the pattern is going to be executed multiple times, because the pattern
    is compiled to an internal format only once.


    The second use of the Regex object utilizes static methods and requires that the
    pattern be passed in each time the methods are used. This is very efficient if
    a pattern is going to be used only once. For the most part, a regular expression
    will be used more than once, so the instance methods are the most important.'
