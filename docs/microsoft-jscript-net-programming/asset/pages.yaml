    \n# Creating New XML Content\n\nUsing XmlDocument and XmlTextReader to access\
    \ ready-made XML content is the most common way of incorporating XML in a program.\
    \ However, you often need to create new XML content.\n\nCreating new XML content\
    \ can be as easy as loading a text editor and creating a brand new XML-format\
    \ document with the data needed for a program. You can also use a number of commercial\
    \ and free programs that are available on the Internet to generate XML documents\
    \ based on input parameters and some other data store, such as a .csv (a file\
    \ where all values are separated by commas) or a database. You can also write\
    \ your own tool to accomplish the same task. The System.Xml namespace makes this\
    \ easy by providing an easy-to-use interface for writing XML documents.\n\nThis\
    \ section focuses on the use of the XmlTextWriter class. This class is used to\
    \ generate a new XML document based on some data structures that are held in your\
    \ program or some of functions that generate data to be written to file. After\
    \ a document is created, it is difficult to edit the document using XmlTextWriter\
    \ class; it is much easier to load the document into an XmlDocument class and\
    \ update the contents in-line. After you have made the changes, you can use one\
    \ of the overloads for XmlDocument's method for saving the file back to disk.\n\
    \nLooking at Figure 11.6, you can see that XmlTextWriter is yet another very powerful\
    \ and complex class. However, the methods needed to work with the sample data\
    \ shown up until now are not very complex. In this section, you'll first write\
    \ the contents of 11-1.xml using XmlTextWriter and then update the newly produced\
    \ XML data using the XmlDocument class."
