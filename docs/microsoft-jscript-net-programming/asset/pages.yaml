  md: "# Chapter 7\n\nDeriving a class from the Control class is perfect if you are\
    \ trying to make a windowed component. The following example shows how to use\
    \ the Control class as the base class for inheritance events:\n\n```\nclass CustomWindowedControl\
    \ extends System.Windows.Forms.Control {\n    // That is all there is to it. We\
    \ now support events.\n}\n\nfunction o_Click(sender:Object, e:EventArgs) : void\
    \ {\n    // Do some work.\n}\n\nvar o:CustomWindowedControl = new CustomWindowedControl();\n\
    o.add_Click(o.Click);\n```\n\nAs you can see in the example, the events are simply\
    \ inherited, so as soon as you create an instance of the new control, you can\
    \ use all of the base's events.\n\n#  JavaScript .NET Delegates\n\nJavaScript\
    \ does not currently support declaring new delegate types or creating the special\
    \ event variables required by the CLR to support events. The European Computer\
    \ Manufacturers' Association will have to review and make a decision about this\
    \ feature at later point.\n\nSo, can you declare events using existing delegate\
    \ types within JavaScript .NET? The short answer is no because the feature is\
    \ on a list for future consideration. The long answer is that it is possible to\
    \ support only events that are within the constructs of the JavaScript .NET language,\
    \ but this is incompatible with the CLR in several areas.\n\nFirst, every event\
    \ has to declare two special methods—add_EventName and remove_Event (where EventName\
    \ is the name of the event being implemented)—which you have seen before. A special\
    \ attribute is placed on these functions in some compilers, named C# and VB .NET,\
    \ when they declare an event that tells the CLR that these are a special type\
    \ of method and not a normal method. The JavaScript .NET compiler does not place\
    \ this special attribute on the methods, and C# and VB .NET do not recognize them\
    \ as event methods as normal methods\n\nSecond, you have to be capable of adding\
    \ delegates to events, and this is not possible in JavaScript .NET using normal\
    \ methods. The problem is that JavaScript .NET is unable to cast a System.Delegate\
    \ type to the delegate type for the defined event. This case is necessary for\
    \ delegates to be added to an event."
