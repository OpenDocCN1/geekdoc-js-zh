    a separate file altogether and still control controls of the HTML rendering and
    output process. To do this, you use a server-side script instead of the in-line
    code syntax. This tag is basically the same as the client-side script blocks commonly
    used in Dynamic HTML (dHTML) scripting. The only difference between the client-side
    script block and the server-side script block is the introduction of the runtime
    attribute. If the runat attribute is the value of server, then the ASP.NET runtime
    knows to compile this code so that it can be used on the server side rather than
    being passed to the client side.


    A server-side script block can also contain the target language. The language
    used within the page must be set either at the page level or within each script
    block on the page. If the page and script blocks specify different languages,
    an error occurs. If two script blocks contain different languages, an error occurs.
    The following example demonstrates a server-side code block that specifies language:


    ```

    <script language="JavaScript runat="server">

    </script>

    ```


    In order for code within server-side code blocks to affect the HTML output and
    rendering, some of the controls are somewhat instantaneous the server is a new
    idea in ASP.NET. To turn a normal HTML control into a server-side, you simply
    need to add the runat="server" attribute/value pair to the start. In many cases
    ASP.NET maps the control in question to one of the HtmlControl controls. If it
    can''t find one that matches perfectly, it uses the HtmlGenericControl control,
    which is capable of working with any existing HTML tags. The following example
    demonstrates the creation of server-side controls:


    ```

    <body>

    <!-- HTML Controls -->

    <span id="MessageSpan" runat="server"></span>

    <form id="ServerForm" runat="server">

    </form>


    <!-- Some of the ASP.NET controls --

    <asp:Label id="Message" runat="server" />

    <asp:DataGrid id="MyGrid" runat="server" />

    </body>

    ```


    # Code-Behind


    With code-behind, you write outside the document while you''re coding. When you
    use this technique, a single server-side application might consist of a display
    page or an ASP.NET page and also a source code page that resides either in the
    same location as the ASP.NET page or in a precompiled assembly.


    ![](img/7d779d3c15b9095d220d4f5d5c9b327f_311_0.png)'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Chapter 14


    Code-behind is primarily used by the Visual Studio .NET forms designers and isn''t
    meant to be programmed by hand from the ground up. The merits for the classic
    text editor of programming everything in one page far outweigh the benefits of
    coding in another file and having to have both files open at the same. In Visual
    Studio .NET, the reason for splitting code from the HTML and ASP.NET markup is
    obvious. It''s easier for the designer to auto-generate content separately from
    code and keep the two in sync visually as rather than changing the code and for
    the pages.


    This section focuses on the basic concepts of setting up code-behind by hand.
    If you have Visual Studio .NET, you might want to take a look at the power of
    the designer and the ease-of value it adds to ASP.NET development.


    Code-behind is completed in two steps. First, use the Page directive to point
    out the ASP.NET page to its code-behind and source file. Do this by using the
    Inherits and Src attributes, discussed earlier in the chapter, in the section
    "ASP.NET Page-Level Directives." The second step in code-behind is to create a
    source file for the Page directive attributes to reference. The source file for
    code-behind needs to contain a class that extends System.Web.Page, and the name
    of this class is the name used in the Inherits attribute. Listings 14.1 and 14.2
    demonstrate the most basic code-behind files possible.


    +   Listing 14.1 An ASP.NET Page that Uses Code-Behind


    ```

    <@ Inherits="MyClass" Src="CodeBehind.js" %>

    ```


    +   Listing 14.2 The Source Code for a Code-Behind Page


    ```

    import System;

    import System.Web;

    import System.Web.UI;

    ```


    ```

    public class MyClass extends System.Web.UI.Page {

    }

    ```


    # Basic Event Handlers


    So far none of the examples in this chapter have actually done anything in regard
    to the ASP.NET server-side object model. But in order to break into the processing
    of an ASP.NET page, various events have to be handled. These events let you know,
    among other things, when it is safe to access server-side control collections
    and when it is safe to start rendering page content. Without these events, ASP.NET
    programming is impossible.'
