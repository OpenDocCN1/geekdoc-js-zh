  md: '# Chapter 3


    # Basic Datatypes


    Both JScript .NET and the CLR provide basic datatypes for nearly any operation.
    This section examines the primitive types available in JScript .NET, as well as
    their CLR counterparts. This section also discusses some of the complex datatypes,
    String and Array, and a few of the CLR types that aren''t available in the JScript
    language but are available through the platform.


    # Primitive Types


    Historically, the primitive datatypes of a language have been defined as datatypes
    that are directly supported by the language through built-in keywords. In addition
    to having direct language support, primitive types are generally very compact
    or well defined.(Complex objects and datatypes that take substantial amounts of
    initialization code don''t fit into the category of primitive types.)


    The primitive datatypes available in JScript .NET include the numeric datatypes
    that support integers and floating-pointer numbers, the Boolean represents a true/false
    condition, and several special types, null and undefined, that can be used to
    test whether variables have been initialized.


    # Integer Numeric Types


    JScript has several built-in keywords for describing various integer number types.
    Each of these types in turn relates to a type in the CLR. All the methods of the
    JScript types come from the functionality provided by the CLR. JScript supports
    the byte, short, int, and long keywords. Of those types, the byte type is unsigned,
    and short, int, and long types are all signed. JScript doesn''t have any keywords
    to specify the sign of a variable. Table 3.1 lists each of the JScript types,
    along with the corresponding CLR type. You''ll notice some CLR types without JScript
    mappings that might come in handy when writing programs.


    | Table 3.1 JScript-to-CLR Type Mapping |

    | JScript .NET Type | CLR Type | Signed |

    |---|---|---|n| byte | System.Byte | No |

    | | System.SByte | Yes |

    | short | System.Int16 | Yes |

    | | System.UInt16 | No |

    | int | System.Int32 | Yes |

    | | System.UInt32 | No |

    | long | System.Int64 | Yes |

    | | System.UInt64 | No |'
