    --), and the modulus operator (%).The basic operators include the addition operator
    (+), the subtraction operator (-), the multiplication operator (*), and the division
    operator (/). Whenever you use these operators, the result is made in the form
    of the smallest datatype needed to house the result. For instance, if you add
    two numbers, one of which is an int, and the other of which is a float, the result
