    # Class and Member Attributes


    Class attributes are used to affect the behavior, visibility, and metadata of
    a class. Some of

    these attributes, which we''ll be discussing in this chapter, are defined by the
    JScript .NET lan-

    gauge. Other attributes are defined by the common language runtime (CLR) and persist
    as

    metadata instead of actually modifying the definition of the class. The following
    sections disc-\usshese attributes:


    +   - Visibility attributes—Visibility attributes are capable of controlling the
    types of code

    can access the method or class in question. Visibility can make classes or members

    inaccessible, accessible only to a select number of other classes, or completely

    visible to all other code.


    +   - Behavior attributes—Behavior attributes are capable of affecting classes
    or mem-

    bers can be used in code. In JScript .NET, they are also capable of enabling special-

    language features.'
