  md: '# Chapter 15


    For programmers the GUI application is probably the coveted and misunderstood
    application. Everyone wants to make something with a pretty and convenient user
    interface for the user—something with a WOW effect, often taking more time to
    generate the WOW than get the job done. What programmers don''t like to admit
    is GUI programming takes the majority of time in project. It''s the GUI that takes
    revisions to get right, often at the cost of the functionality of the application.
    For this reason I''ve waited until the end of the book to introduce Windows Forms.
    Nearly every task can be completed in a more timely manner when a console application
    is used, so the basic concepts of Jscript and the CLR (common language runtime)
    are more easily described using console application code.


    Now is time to finish the book on a UI note. This chapter introduces the features
    of Windows Forms that make up the most basic portions of UI programming. We''ll
    start with a basic Windows application consisting of Forms, using some of the
    properties, and the mechanism for launching and displaying that. We will make
    of the Windows executable compiler to create these applications without a console—this
    will add a more professional Windows effect.


    With a basic operational form, the next step is to add buttons, labels, and text
    controls. You''ll learn about various control events and the event programming
    model.


    One of the greatest features of Windows Forms is the layout manager. This manager
    automatically arranges controls on the order in which the controls were added
    to the form and according to some additional docking and layout properties on
    all Windows Forms controls.


    Any Windows Forms applications would be complete without the menus. Menu are extremely
    easy to implement using Windows Forms. We will discover how to use the Menu to
    control a top-level menu, how to use the MenuItem control to add individual menus,
    and how to add submenus. Menu does not work unless the proper events are trapped,
    and we will look at to handle menu events in different ways, depending on what
    type of menu MenuItem represents.


    With menus come dialogs. Dialogs are often used for Open and Save menus, so we
    will take a look at both the OpenFileDialog and SaveFileDialog classes for opening
    and saving files. The implementation of these dialogs will make use of file IO,
    so refer to Chapter 10, "File Access," if needed.


    This should be all the information needed to make sense. I''m not going to lie
    and say that this is going to be the end-all editor and you''ll never use another.
    This will be the simplest text editor possible and implement very few features.
    It certainly won''t be something that will be useful later without a bit more
    work. It will, however, demonstrate how much code takes to make even the most
    basic GUI application.'
