    # An Overview of Interfaces


    This section is devoted to interfaces in JavaScript .NET: their structure and
    definition, as well as the various attributes and members that are applicable
    only to interface definitions. An interface definition can be considered an extremely
    limited subset of what is available when you''re defining classes. It is also
    important to remember that an interface is never created directly, but implemented
    by a class before it can be used. For this reason, it is good practice to define
    an interface with as few methods as possible so that it is easy to implement in
    a class.


    # Interface Structure


    You declare an interface by specifying attributes, a name for the interface, and
    a block in which the interface members are defined. Like the formal declaration
    for a class shown in Chapter 6.1, the formal interface syntax shows below more
    information than is required to work with basic interfaces. You create an interface,
    in the simplest form, by simply using the interface keyword with the name of the
    interface. An interface can have an empty code block without any method or property
    definitions. The following code demonstrates:


    ```

    interface A {

    }

    ```'
