  md: "# Chapter 12\n\n| TABLE 12.1 JavaScript Regular Expression Engine Options |\n\
    | Option | Behavior |\n|---|---|\n| g | This option enables the global search\
    \ for all occurrences of a pattern. When the g option is enabled, a regular expression\
    \ can be started again from the end of the last match. When matches are no longer\
    \ available, the lastIndex for the regular expression object gets set and the\
    \ matches start from beginning again. |\n i | This option enables case-insensitive\
    \ matching over the pattern. When this option is enabled, the case of the text\
    \ doesn't matter. |\n m | This option enables multiline searches on patterns.\
    \ When this option is enabled, the ^ metacharacter matches both the beginning\
    \ of the string to be searched and any locations immediately following a newline.\
    \ The $ metacharacter matches both the beginning of the string and the location\
    \ immediately preceding the newline. |\n\nTable 12.2 lists metacharacters using\
    \ JavaScript .NET regular expressions. These are characters that have a special\
    \ meaning in a match rather than the standard character value. For instance, the\
    \ character \"w\" in a regular expression matches exactly the character \"w\"\
    , or \"W\" if the engine of i is specified. However, the metacharacter \\w matches\
    \ any word character and is equivalent to the group [A-Z-a-z0-9_]. Listing 12.4\
    \ shows examples of regular expressions that use several of the metacharacters\
    \ in the table.\n\n# TABLE 12.2 JavaScript .NET Regular Expression Metacharacters\n\
    \n| Character | Description |\n|---|---|\n| \\ | Marks the next character as a\
    \ special character, a literal, a back reference, or an octal escape. For example:\
    \ \\w matches \"w\"\\n\\\\w matches a word character\\n\\\\\" matches \"\"\n\\\
    \\( matches \"\"\n\\\\t matches the first tab match |\n| ^ | Matches the position\
    \ at the beginning of the input string. If the RegExp object's Multiline property\
    \ is set, ^ also matches the position following \\n or \\r. |\n| $ | Matches the\
    \ position at the end of the input string. If the RegExp object's Multiline property\
    \ is set, $ also matches the position preceding \\n or \\r. |"
