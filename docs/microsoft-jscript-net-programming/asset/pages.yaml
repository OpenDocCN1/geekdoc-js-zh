  md: '# Chapter 6


    In this chapter you will learn all about class definitions, constructors, modifiers,
    and attributes. You''ll learn about the body of the class in Chapter 7, "Interfaces
    and Class Members," so if you''re looking for information on properties, methods,
    and fields, skip ahead to Chapter 7.


    This chapter begins with an overview of classes. You''ll learn what makes up a
    class, and then you''ll learn about class attributes, including the visibility
    attributes and the .NET metadata attributes.


    This chapter discusses inheritance and subclassing, using both classes and interfaces.
    It also covers encapsulation, which you can often in place of true subclassing
    to achieve the nearly same results. The chapter ends with a discussion on defining
    and declaring class constructors, overriding, and calling base constructors.


    # An Overview of Classes


    A class is a logical container in JScript .NET and object-oriented programming.
    Every class maintains a series of private data and a unique set of methods for
    manipulating that data. Every class needs to be defined, using special class declaration
    syntax. Class declarations can appear only in special places in code:


    +   - You can declare a class declaration at the global level, outside any package
    constructs, in which case it is an assembly-scoped class without a namespace.

    - You can declare a class declaration within a package block, which simply gives
    the class a more fully qualified name. If you declare a class at this level, you
    need to either fully qualify the namespace and class name, or you need to import
    the namespace at the top of the file.

    - You can place classes within other classes. Classes at this level have special
    properties, we''ll we''ll talk about later in this section.


    # A Simple Class Declaration


    Class declarations always look more complex than they really are. At the simplest
    level, you can declare a class by prefixing the class keyword to the name and
    then beginning the class member block.


    ```

    [Attributes] class Name [[extends base class],

    -[implements interfaces, ...]] {

    ...Code Block...

    }

    ```


    Inside the class member block, any members of the class are defined, functions
    are declared, and constructors are written. As discussed earlier in the chapter,
    other classes might appear'
