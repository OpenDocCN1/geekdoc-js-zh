  md: "ASP.NET provides a special bekup mechanism: You make functions by using a special\
    \ syntax, and ASP.NET automatically sets up those functions as callback functions\
    \ for the events fired by ASP.NET. This format takes the form of ObjectName_EventName,\
    \ where ObjectName is generally Page and EventName is one of the events on the\
    \ page object. The following sections describe the Page.Load, Page.PreRender,\
    \ Page.Init, and Page.Error events.\n\n# Trapping the Page.Load\n\nThe Page.Load\
    \ event is the most important event in ASP.NET programming because it is where\
    \ you can access the server-side object and thus you affect controls on the page.\
    \ It is also the first place where you have access to view state information for\
    \ the various controls after a postback has occurred.\n\nTrapping Page.Load is\
    \ as easy as declaring a function with the correct signature and method name.\
    \ ASP.NET looks for a function whose name the syntax Page_EventName. This method\
    \ can be used for both the Load event discussed here and any other events (as\
    \ discussed in this chapter, in the section \"Using Other Page Events\") that\
    \ the Page object supports. The following example demonstrates server-side code\
    \ trapping the Page.Load event and the syntax required to provide a method with\
    \ the correct signature:\n\n```\n<script language=\"javascript\" runat=\"server\"\
    >\nfunction Page_Load(sender:Object, e:EventArgs) : void {\n}\n</script>\n```\n\
    \nAfter the Page.Load event is captured, you have access to all the server-side\
    \ controls on the page. You can call functions or set properties on these server-side\
    \ controls to affect their output. The following example demonstrates how to use\
    \ a Label control to send a custom message to the client.\n\n```\n<script language=\"\
    javascript\" runat=\"server\">\nfunction Page_Load(sender:Object, e:EventArgs)\
    \ : void {\n  Message.Text = \"Message From Code\";\n}\n</script>\n```\n\n```\n\
    <body>\n  <asp:Label id=\"Message\" runat=\"server\" />\n</body>\n```\n\nYou should\
    \ be able to clearly see how much power server-side controls and code blocks give\
    \ you. You can use server-side controls to customize page output. Many controls\
    \ have a Visible property that lets you disable rendering for the control and\
    \ truly customize what is visible to the client.\n\n![](img/7d779d3c15b9095d220d4f5d5c9b327f_313_0.png)"
  merge: -1
  pgno: 313
- img_proc: true
  md: "# Using Other Page Object Events\n\nIn addition to the Load event, the Page\
    \ object also contains the Init event (for the phase that occurs before controls\
    \ are loaded and the server-side object model is ready), the PreRender event (for\
    \ the phase that occurs after the Load event and immediately before controls are\
    \ set to render content), and the Error event (which is raised whenever an unhandled\
    \ runtime error occurs on the page).\n\nDepending on the location or time during\
    \ page processing in which an event is called, various things are either available\
    \ or not. The Init event is called while the controls on the page are still being\
    \ initialized, when the server-side object model is not ready yet. This means\
    \ that you don't have access to server-side controls, yet what else might be required\
    \ for use, when the other events are called. The following examples demonstrate\
    \ how to trap the page. Init event and set up a page-level variable for use when\
    \ the Page.Load event.\n\n```\n<script language=\"javascript\" runat=\"server\"\
    >\npublic var dsn:String;\n\nfunction Page_Init(sender:Object, e:EventArgs) :\
    \ void {\n  dsn = \"Database Connection\";\n}\nfunction Page_Load(sender:Object,\
    \ e:EventArgs) : void {\n  // Code that the DSN. Other controls that know about\
    \ the\n  // variable on the page can also use the variable. That is why\n  //\
    \ it was set in the Init phase and not the Load phase.\n}\n</script>\n```\n\n\
    The PreRender event is called after the Load event immediately before the HTML\
    \ output is rendered. This event is useful for making final modifications to controls\
    \ and to view state right before the page phase. This is the final place such\
    \ modifications can be made in order for them to be persisted in the view state.\
    \ If changes are made while the page is actually rendering, the changes are evident\
    \ in the HTML but the view state does not reflect these changes after the page\
    \ is posted. The following example demonstrates how to access a control right\
    \ before the page is rendered by trapping the PreRender event:\n\n```\n<script\
    \ language=\"javascript\" runat=\"server\">\nfunction Page_Load(sender:Object,\
    \ e:EventArgs) : void {\n  Message.Text = \"Message Setting Load Event\";\n}\n\
    \nfunction Page_PreRender(sender:Object, e:EventArgs) : void {\n  Message.Text\
    \ = \"Message Reset During the PreRender Event\";\n}\n</script>\n```"
  merge: -1
