    \ of a loop construct is extremely bad coding practice it puts all the logic into\
    \ the code block. This makes it extremely difficult to find the location from\
    \ which the loop can be exited in case the logic has to be updated.\n\nThe do...while\
    \ statement is used less frequently than the while statement. There is only one\
    \ difference between a while and a do...while statement: A while statement executes\
    \ the conditional statement before the code block is ever executed, which means\
    \ a while loop can execute zero or more times. A do...while statement executes\
    \ the conditional statement after the code block has been executed, which guarantees\
    \ that the block will run at least once before the loop is exited. Figure 5.2\
