  md: 'In the following subsections we will examine event handlers and how you hook
    into events. Then, we''ll look at a sample of a subclassed control where events
    are inherited. Finally, we''ll discuss delegates—why JScript .NET does not support
    them now and how it might support them in the future.


    # Consuming Events


    Classes export events for many different purposes. Whether the purpose is for
    asynchronous operation of some algorithm or to notify the programmer of special
    condition within the class, there is always a degree of special work that must
    be performed for the event consumed. A class can fire an event all day long, but
    unless another class or function consumes that event, no action ever takes place.


    Consuming an event requires two steps:


    +   1. Write a function that will become the event handler. Whenever the event
    is fired, the function is called, and you can do some work based on the event
    in question. The function can contain some parameters because each event exported
    by a class might optionally define that it passes some extra data to the callback
    function.

    2. Use the add_eventName function on the class that hosts the event that the program
    needs to catch.


    The most basic event handler is used to consume the EventHandler delegate that
    is defined by the CLR. This event delegate is used whenever the event has no data
    to pass, and it accepts two parameters. The first parameter is an object variable
    that identifies the source of the event. This is null and the event does not contain
    any meaningful information. The second parameter is an EventArgs class. EventArgs
    doesn''t contain any fields or properties, and thus it can''t used to pass any
    information to the event handler. Setting up an event handler is easy, as long
    as you know the types of the parameters for the event delegate. The following
    example creates an event handler that might be used to trigger an event of type
    EventHandler:


    ```

    function MyEventHandler(sender:Object, e:EventArgs) : void {

    }

    ```


    > TIP Programmers consider it extremely important to use a special naming scheme
    with event handlers so that they aren''t confused with normal functions. The easiest
    way to do this is to use the name of the class or variable to which you''re going
    to hook the handler, followed by an underscore and then the name of the event
    to consume. Some name for a function for the class of the click of a button Button
    might be Button1_Click.'
