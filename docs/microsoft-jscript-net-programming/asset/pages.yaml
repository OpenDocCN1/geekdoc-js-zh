  md: '# Chapter 1


    This means that all your old JScript syntax would work with little or no modification,
    and that all the old objects and methods are still there if the programmer would
    rather use those over the newer objects and methods provided by the CLR and the
    .NET Framework.


    Porting of the Script interpreter to the JScript .NET compiler began early in
    2000 with the first usable version of the JScript .NET becoming available after
    the Professional Developer''s Conference in July 2000. This was the first usable
    version of the compiler, and many bugs remained to be worked out. With the Beta
    1 Release of the .NET platform in early November, a nearly fully functional version
    of the compiler was shipped. With the version 1 release of the .NET platform,
    all the features available in the other .NET compilers should be available in
    JScript .NET. The next logical question is: What does JScript .NET have to offer
    compared to the other .NET languages, and what will it continue to offer after
    its release and during future development?


    # What Does JScript .NET Have to Offer?


    The most important JScript .NET has to offer backward compatibility with the JScript
    language. All the old objects are still there. All the old syntax is still available.
    Even items that don''t port well to the new platform have been preserved so that
    transitioning between the two languages is painless as possible. Of course, many
    of the older features aren''t the best choice for performance. The newer features
    of the language will ensure that JScript .NET increases in speed and performance
    at the same time it increases in flexibility and usability.


    # Backward Compatibility with JavaScript


    To show you how the backward compatibility features of JScript .NET, let''s look
    at some examples of the old syntax and the newer syntax. Here you will explore
