    # Extending Classes


    In C#.NET you use the extends keyword to append a single class name to the declaration
    to provide you new functionality for existing classes, to inherit basic functionality
    into multiple derived objects, or even to specify some strong contract between
    derived classes so that code works with the base class also works with the derived
    classes. Extending a base class allows the derived class to perform in three different
    situations:


    +   * It can be used to provide some implementation for a defined but not implemented
    method.

    * It can provide new functionality for an existing method.

    * It can implement new methods with different names.


    Earlier in this chapter, we discussed the abstract attribute that forces you to
    subclass another before it can be used. When the abstract attribute is specified
    at the class level, it cannot be instantiated. Therefore, you are forced to derive
    a class and implement all the methods and properties of the class. In this way,
    the base class acts only as a contract (that is, it acts like an interface that
    defines the definitions for methods and properties yet doesn''t provide the implementation)
    between the derived class and any code that uses the base class, and it expects
    the derived class to operate accordingly.


    You can override some common functionality of a base class and provide some functionality.
    This is a common practice, and new methods are often created for process performed
    by the base class. Then, you derive a new class by inheriting all the other methods
    of the base class, and then you override the one method where a new process has
    been found and implement that. This is versioning at its finest because the base
    class is left unchanged and the new class can act in place of the base class with
    your functionality.


    If you want a base class to be used by older programs, you can allow newer programs
    to use some of the additional methods you supply. In this manner, you extend the
    existing contract by adding new methods and properties. Any classes that in turn
    derived from your class will inherit this enhanced contract. This is another form
    of versioning because the new class can still be used in place of the base class
    in programs that you know about the base class for the class. The following example
    demonstrates the use of abstract classes and methods, as well as how to override
    base class methods and do method inheritance:'
