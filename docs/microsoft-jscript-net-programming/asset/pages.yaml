    # The Stream Class and IO


    The Stream class is the base class for any class that performs IO. This could
    be memory IO, disk IO, network IO—it doesn''t matter what type of IO as long as
    it extends from the Stream class. We won''t go into depth on how the Stream class
    works, but we will hit some of the more important functions and properties so
    that we can later understand some of the more important classes that derive from
