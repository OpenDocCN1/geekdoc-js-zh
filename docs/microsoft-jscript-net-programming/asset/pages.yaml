  md: '# Chapter 15


    The section “Buttons, Labels, and Text Controls” demonstrated adding controls
    and initializing their state. This was the first time events were used in this
    chapter. Windows Forms is a highly event-driven programming model, so learning
    about events was necessary. Events were again used for the menus later in the
    chapter. This section also showed how difficult laying out even a small amount
    of controls on a form can be. For this reason it is recommended that the auto
    layout manager be used. The section “Using the Docking and Layout Feature” showed
    a simple use of the layout manager by examining the Dock and Anchor properties
    on each of the controls. These properties are used even when resizing the form.


    The section “Implementing Simple Menus” moved away from controls on the form and
    more into the commands that can be executed from menus. The section explained
    the small difference between a Menu and MenuItem and how to use each of these
    items to make basic menus. These menus were then used in the section “Using the
    Common Dialog Controls” to open some common dialogs. You learned that the common
    dialogs are useful for opening and saving files and giving users a familiar experience.
    Using the common dialogs certainly made it much easier to navigate the file system
    than having custom-code UI to give the user the same abilities as the common dialogs.


    With each of these principles, the JPad application was created. It doesn’t show
    any new principles, but it does show the integration of System.IO code along with
    the windows code to make an application that actually does something.


    This chapter ends the book. I recommend that you use Chapters 10 through 13 as
    references for some of the more common .NET namespaces. You can also look at the
    compiler reference in Chapter 9, “JScript .NET Compiler Features,” or the shorter
    version available in Appendix A, “JScript .NET Compiler Reference:'
