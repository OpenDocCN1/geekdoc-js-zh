  md: '# Chapter 1


    This chapter will serve as a platform for you to decide which chapters of the
    book are suitable for you. Some of you are probably beginning programmers who
    are somewhat proficient in JavaScript or JavaScript, and others are advanced programmers
    proficient in another .NET language or object-oriented language. This chapter
    provides a sample path from JavaScript to .NET and explains some of the history
    behind it. It also covers coding conventions and explains each of the appendices,
    which will be extremely important to getting the various samples compiled and
    experimentation with the samples beyond what is provided in the book. Let''s begin
    by covering the history and development of JavaScript .NET.


    # Development of JavaScript .NET


    JavaScript began as a language that worked within a Web browser through scripted
    code in an HTML page. Because of this, JavaScript had a familiar syntax that Java
    users could quickly pick up and offer many of the object-oriented techniques available
    to the Java language. In addition to providing the basic Java-style types and
    language constructs, JavaScript provided a Document Object Model (DOM) to access
    various portions of the Web page. This point a developer could write code that
    interacted with the user on a Web page, and also updated or verified portions
    of the content. The effect was mostly limited to changing images on the page,
    in the case of mouseovers, or verifying form content so that preliminary data
    checking could happen on the client rather than bogging the Web server and the
    user''s Internet connection.


    Of the many features that come out of the first versions of JavaScript, the missing
    portion remained the ability to update the page dynamically. Dynamic page updating
    is the ability to add new content and affect the flow and rendering of the current
    document while the user is viewing the page. The new version of the DOM was not
    really extension to JavaScript itself, but a collection of objects with which
    JavaScript became a new type of HTML known as DHTML, or HTML, which enabled JavaScript
    to fully modify the objects on the page. This included including the stylesheet
    information, visibility of objects, the flow around text elements, and even moving
    objects around the page. This new freedom to modify the document when the user
    interacted or viewed the page was a very well-received concept, leading to a new
    level of page-based JavaScripts. This dynamic means, addition or revealing of
    content, and the ability to create forms that could create or remove fields as
    needed on the page.


    While developing the DOM and HTML implementations, Microsoft began to develop
    several extensions to their version of the JavaScript language. They added several
    objects, such as the Dictionary, that was similar to Java''s Hashtable, and the
    FileSystemObject (a COM object used by scripting languages to access the files
    and directories) that could access files. At this point the language was usable
    in both client and server environments and was released'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction to JScript .NET


    the name JScript after the traditional JavaScript. They also made their scripting
    engines available to other consumers on the machine, rather than just the Web
    browser.


    The most notable of these consumers was the Windows Scripting Host, which expanded
    JScript from the IE platform to the PC administration and task platform. Now users
    could use small JScript programs to make modifications to handle rudimentary tasks
    that batch once performed. JScript became a batch processing language and again
    gained access to a much more powerful object model. Windows Scripting Host introduced
    several new objects for accessing the user''s registry, and for launching applications
    on the machine. It was also a much better place to use the FileSystemObject. Here
    it could be used for maintaining files, writing logs, and backing up other directories
    on the machine when used as an administration tool. In its most recent edition,
    WSH has gained several added capabilities from the WMI (Windows Management Instrumentation)
    interfaces. Scripts are able to access Active Directory information, machine information
    that was previously available only through API calls, and even modifications to
    information on other machines in the same or another trusted network. Future versions
    will proudly add more benefits while making additional scripting languages available
    to the programmer.


    To answer many of the concerns behind the limitations of the JScript language,
    Microsoft has made continual advancements in their implementation. Most JScript
    5.1 and 5.5 were released. Recent enhancements include the introduction of regular
    expressions for textual parsing and verification, and additions to the Array type
    that make it like a normal array, a stack, or a numerically indexed hash (sparse
    array). Conditional compilation was added some time ago, but doesn''t come in
    extremely hard unless you''re doing scripts that constantly access a variety of
    platforms. The enumeration form (for...in) of the for loop comes extremely hard
    when enumerating properties or items in an array when you don''t care about modifying
    or maintaining an index. Finally, with version 3.0, Microsoft made JScript ECMAScriptcompliant.
    ECMScript is the Web-based scripting supported by the ECMMA-262 specification.
    Any version later than 3.0 of the JScript implementation remains ECMAScript compliant
    while adding additional functionality. To end this confusion of the JScript language''s
    history, note that both JScript and JavaScript were developed to be object-oriented.
    Both languages allow for the creation and use of objects, but in an abstract way.
    The object-oriented functionality makes JScript a sure candidate to become a Common
    Language Runtime (CLR)-compliant language.


    # Enter JScript .NET


    The next step in JScript''s development is a fully compiled JScript based on Microsoft''s
    new Common Language Runtime (CLR). Known as JScript .NET, it is both compatible
    with the specifications required to be a CLR-compliant language (which means it
    has notions of classes and inheritance), as well as fully backward-compatible
    with the JScript language as it stands.'
  merge: -1
