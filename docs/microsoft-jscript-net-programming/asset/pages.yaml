  md: "# Interfaces and Class Members\n\nMethod overloading appears rather simple\
    \ on the surface, and it really is, considering that you have only two basic rules\
    \ to remember. Note that the only factors in function overloading are the parameter\
    \ list and the return type; you can't affect method overloading by using visibility\
    \ attributes. One exception is instance static methods. *Static methods are methods\
    \ that are shared by all instances of a class, whereas instance methods access\
    \ to private member data that isn't shared between instances of the same class.*\
    \ You could make the InvalidSample class work correctly by declaring one of the\
    \ methods static.\n\nStatic methods and instance methods are entirely different\
    \ from one another when it comes to determining method overload at compile time\
    \ because they are in different manners. An instance method requires an instance\
    \ of the class be used, whereas you can call a static method without ever creating\
    \ an instance of the object, by simply using the type name.\n\n# Using Static\
    \ Methods\n\nProgrammers need functions that don't work with the internal state\
    \ of the class on which they are defined. These functions would return the state,\
    \ no matter which object they defined. In a static function, all the data needed\
    \ to complete the function must exist solely within the parameters or within the\
    \ static properties and fields of the class or other classes. In this form, a\
    \ static function is identical to a global JavaScript function. However, the class\
    \ name acts as a namespace because you must always qualify the static function\
    \ with the name of the class in which it resides. The following example demonstrates\
    \ the use of a static function that can be accessed without creating an instance\
    \ of the class:\n\n```\nclass StaticFunctions {\n    public static void Print(str:String)\
    \ : void {\n        Console.WriteLine(str);\n    }\n}\n```\n\nStaticFunctions.Print(\"\
    Hello World\");\n\nYou can also use static functions to return predefined versions\
    \ of a given class. Remember that in Chapter 6 we talked about making a private\
    \ constructor so that an object can't be instantiated. When you do so, you can\
    \ still call the private constructor and return an instance of the object from\
    \ a static function. Examples of this includes that generate class based on another\
    \ similar class, such as the following:\n\n```\nclass IntegersSquare {\n    private\
    \ IntegerSquare(x:int, y:int, height:int, width:int) {\n    }\n```"
