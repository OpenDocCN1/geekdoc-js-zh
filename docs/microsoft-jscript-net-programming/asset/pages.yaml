  md: 'debugging and tracing logic that gets compiled out in your retail builds without
    changes to the code. A code stripping tools is always one option, but when it
    happens at the compiler level as a service, it is always cleaner and more maintainable.


    That concludes the discussion of conditional compilation symbols and moves us
    into our new compiler-level feature, the assembly-level attribute.


    # Assembly-Level Attributes


    So far we''ve seen that attributes can be applied at all levels of our code to
    affect the various classes, methods, properties, and fields. However, we haven''t
    seen a way of specifying attributes at the assembly. Assembly-level attributes
    are important for specifying information that applies to the entire assembly,
    such as version information, key signing, and name information, and any custom
    attributes you might want to create as a programmer to identify your assembly.


    As an example, you might want to create a special attribute that identifies which
    class should be run when your application is going to support plug-ins, because
    it allows the developer to specify which class in his assembly is the plug-in
    connector class. For a special .NET game, we allowed the developer to create special
    animals. When we loaded our assembly, we had to know which class was his animal
    so that we could load it and start him off in the game. Otherwise, we might have
    loaded one of the helper classes instead and that wouldn''t have worked very well.
    So what is different about our assembly attributes?


    # Assembly Attribute Syntax


    Assembly-level attributes are defined in the global area of the source code. Normally
    you would apply them at the top of the source file before any other code that
    they are easy to find and modify. Each attribute should be surrounded by brackets
    and prefixed with the keyword assembly followed by a semicolon. The rest of the
    syntax should be rather familiar to you you''ve used attributes for other code
    items. The following code demonstrates some assembly-level attributes being applied
    in some JScript .NET source:


    import System;


    ```

    [assembly: MyAssemblyAttribute(MyParam1, MyParm2) ]

    [assembly: MyAssembly2Attribute(MyParam1, MyParm2) ]

    ```


    ```

    // Source Code

    ```'
