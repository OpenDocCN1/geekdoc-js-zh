  md: '# Introduction


    Generally in the programming industry, the rule of thumb is that you have to learn
    the latest and greatest technologies to use on the high-end pay scales and ensure
    job security. At times this means long hours of work learning brand-new concepts,
    brand-new programming languages, or leading-edge techniques. However, while spending
    all your time learning brand-new technologies, no one can ever find the time to
    become an expert in a specific field.


    As Microsoft continues with the Jscript languages and Jscript .NET and the speed
    and power of a compiled full-featured language, the reality is that you can bring
    your old skills to bear in this new generation of technologies. I am targeting
    this book to those who used Jscript in their ASP programming instead of VBScript,
    to those who feel the shift from Java to .NET will be best done using the Jscript.


    This book primarily focuses on the Jscript .NET language and syntax. If you''ve
    had some experience with the Jscript language, you''ll have a much easier reading
    the book, but it isn''t necessary. I''ve tried to organize the book so that any
    features previously found in Jscript are in the beginning chapters, and any new
    features come in the later chapters. You may skip through the content as you see
    fit and not miss anything important.


    One of the most powerful features of Jscript .NET is the CLR (common runtime)
    and .NET frameworks, along with all of the associated classes. Most of the programming
    problems that couldn''t be solved in Jscript without the use of many additional
    COM libraries can now be handled directly from the classes already available to
    the language through the CLR. This advanced file IO, access to high-speed XML
    classes, and direct access to the internet Web classes, just name a few. Because
    each of these classes is important to making Jscript .NET a very effective language,
    I''ve chosen to devote a large amount of the text to these classes alone.


    In addition to a large number of support classes, Microsoft has released several
    frameworks for easing the more common programming tasks. ASP.NET was developed
    to replace ASP and greatly enhances the speed and ease of use for server-side
    programming. Jscript .NET provides a crucial role in this transition from ASP
    to ASP.NET because Jscript code can be quickly and easily used in ASP.NET with
    little or no changes. For the client side, Microsoft has developed Windows Forms
    for working with windowed applications. Windows Forms is extremely easy to learn
    and is the first API capable of adding GUI elements to the Jscript .NET language.


    This book contains entirely precise descriptions of the various functions and
    language syntax available in Jscript .NET. The code listings help to ensure this
    description, as do the number of samples available on disk. However, no matter
    many times a feature is'
