  md: '# Chapter 8


    By now you''ve learned everything it takes to create an actual program using JScript
    .NET. Next, it''s time to learn exactly what you can do in your code to make sure
    you catch all the possible errors and various conditions that might cause a program
    to end unexpectedly. Exception handling is a series of special code instructions
    that allow one piece of code to raise an error condition that must be handled
    by another piece of code. This error condition is called an exception because
    it is outside the normal boundaries of the code.


    One of the main reasons exception handling is important in programming with the
    Microsoft .NET framework is that many of the libraries, you''ll be using in future
    chapters, use exceptions to demonstrate error conditions. Traditionally, programs
    use return codes to indicate success or error conditions, but if a function is
    already returning something of importance, there isn''t room for a return code.
    Another issue with return codes is they are extremely hard to maintain. A program
    might work through several libraries, and all the return code values may overlap.
    You might even want to pass a return code you just received to a function to the
    caller of the function. But what happens if the return codes don''t match (for
    example, the return code from the library means one thing, but that same return
    code for the function means something completely)? This can lead to code that
    is hard to understand at first glance.


    Exception handling overcomes some of these hurdles. Any function or library call
    can throw any number of exceptions that you can catch. Each exception must have
    at its root a common base exception, so if you need to trap all exceptions, you
    can do so by simply trapping the base exception. Because the exceptions are classes
    themselves, they are shared between libraries and programs. So if you receive
    an exception that your library isn''t set to handle, you can pass that down to
    the calling program untouched. There isn''t any reason to worry about differences
    in return code values or mapping a new unknown exception to an exception that
    your program normally emits.


    The benefits and merits of using the exception handling error system of the common
    language runtime (CLR) outweigh the time it takes to add the lines of code that
    are needed to use the system. Throughout this chapter, we''ll discuss the merits
    as well as pitfalls of the system, as we discuss the try...catch...finally statement
    and managing exceptions.


    This chapter discusses exceptions from crude code to exhibit error conditions
    in a program. Whether to rethrow a caught exception is a tough decision to make
    in a program, but this chapter will help you think about times when rethrowing
    an exception is beneficial. It also talks about where you should rethrow the exception
    because there are a couple locations in new exception blocks that might make sense,
    but not all of them are the right place from which to throw or rethrow exceptions.'
