- img_proc: true
  md: 'In addition to the more common options, there are several code-generation compiler
    flags that affect the output from the compiler. These code-generation compiler
    flags can be used to identify character output encoding, set safety options, and
    enable enhanced code profiling. A couple of warning-related flags are used to
    specify warning levels during compilation and change the effect of a warning on
    the compilation step. We will begin by examining executable-code compiler flags.


    # Compiling Executable Code


    More than you likely will write more-executable code assemblies than you will
    libraries of code. This is a generalization that most people write small utilities
    and code to be executed by end users, and a much smaller percentage actually write
    code that will be used by other programmers in the form of libraries. For this
    reason you will most likely use the target option to specify executable content.


    The target option or t option is used to specify which kind of assembly will be
    generated. In JScript you have three options: exe, winexe, or library. We will
    discuss two of the targets, the exe and the winexe, as well as the differences
    between them. I chosen to talk about these two target options because of their
    use in creating executable content. The exe target specifies that assembly will
    be executable within the host environment (it can be run from the command line,
    through the Windows Explorer shell, or through some other hosting means yet to
    be created). Additionally, it specifies that the program will be launched with
    a console window. This is the DOS-style window you see when running a command
    prompt.


    Console-style programs are extremely useful because they generally don''t have
    any UI and any input or output is done through a standard set of streams. So far
    in this book, all the executable programs we have been console programs and we
    have used the Console class to write to the console. You can also use the Console
    class to read input from the console, but generally programs take their input
    from the command line rather than from user interaction.


    Traditionally, JScript has been used to write automation scripts under Windows
    Script Host. Windows Script Host had two hosts, the cscript.exe, which allowed
    the script to run as a console application, and the wscript.exe, which allowed
    the program to run as a Windows executable. Generally, authors of these automation
    scripts would choose the cscript.exe because they could provide user feedback
    to the console without generating some sort of UI. The following code demonstrates
    the use of the target option being used to generate some executable content:


    ```

    jsc /target:exe Source.js

    jsc /t:exe Source.js

    ```'
