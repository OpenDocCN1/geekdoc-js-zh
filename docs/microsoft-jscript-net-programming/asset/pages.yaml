  md: "# Chapter 7\n\nMany events are declared by using the simple delegate EventHandler\
    \ because they don't need to pass any data to the consuming class; they only need\
    \ to notify the class that something has happened. When data needs to be passed,\
    \ the second parameter is changed from an EventArgs class to a class that inherits\
    \ from EventArgs. Additional properties or fields can be declared on this new\
    \ class, which means the event handler would have to change to support the new\
    \ class, and possibly the code inside the event handler would have to examine\
    \ the new data provided. The following example demonstrates the event handler\
    \ needed to consume a more complex event that passes back a custom data structure:\n\
    \n```\nfunction SampleEventHandler(sender:Object, clickArgs:ClickEventArgs) :\
    \ void {\n  var x:int = clickArgs.X;\n  var y:int = clickArgs.Y;\n}\n```\n\nWhen\
    \ the event handler is defined, you still need to hook up a handler to the event\
    \ in question. In JScript, you do this by calling two special functions (add_EventName\
    \ and remove_EventName) that are generated whenever a class implements an event.\n\
    \nThe first function is the add_ (where EventName is the name of the function\
    \ that will be the event handler) function. To hook an event, you call this function.\
    \ The following example demonstrates adding an handler to an event:\n\n```\nfunction\
    \ MyEventHandler(sender:Object, e:EventArgs) : void {\n}\n```\n\n```\nvar MyClass:WorkerClass\
    \ = new WorkerClass();\nWorkerClass.add_WorkDone(MyEventHandler);\nWorkerClass.BeginWorking();\n\
    ```\n\nThis example includes a special event handler for the WorkDone event. When\
    \ the WorkerClass, myClass, is doing work it notifies the program, and you can\
    \ either get some information out of the event arguments or simply examine the\
    \ data exported by the class that is exporting the event. This example assumes\
    \ that BeginWorking() starts asynchronously by spawning another thread and that\
    \ the program can continue to run while the WorkerClass, myClass, is coming up\
    \ with a response.\n\nThe second function allows you to remove event handlers\
    \ from an event. This can be useful if you need to process the event only once\
    \ or twice and then you wouldn't care about it in the future. For this purpose,\
    \ use the remove_EventName function (where EventName is the name of the function\
