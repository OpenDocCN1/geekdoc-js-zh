    A final set of methods is used to set meta-information for the file. Meta-information
    includes information about the file that''s not stored as part of the data stream,
    but rather by the file system. This includes access to the File attributes and
    time information for file creation and modification. The GetAttributes, GetCreationTime,
    GetAccessTime, and GetLastWrite methods are each used to obtain this information
    about the file. The SetAttributes, SetCreationTime, SetLastAccessTime, and SetLastWrite
    methods are each in used to write this information about a file.


    # The Directory Class


    The Directory class contains all the methods needed to investigate the properties
    of directories. This includes enumerating files and subdirectories, determining
    access permissions, and other directory-related data. More specific methods and
    properties can be determined from Figure 10.4.


    The Directory class is nearly identical to the File class except that it works
    with directories. Directories are different from files in they don''t contain
    data and cant be written to. Instead they contain and logically separate other
    directories and files. Again, let''s break the methods down into small groups
    so that they are easily digestible.


    Again, there is a set of methods for working on the directory as all. These include
    the Exists, Move, and Delete methods. Notice that there isn''t a copy method.
    Copying a directory means copying all the files and subdirectories it contains.
    This isn''t a difficult operation, but generally speaking the replication of data
    is unwanted.


    Several methods exist for gaining access to directory contents. Gaining access
    to a directory is also a bit different from working and gaining access to files
    because you can open and retrieve a stream of data. Instead, there are the CreateDirectory,
    GetDirectories, GetFiles, GetFileSystemEntries, and GetLogicalDrives methods.
    GetDirectories returns the list of directories as a string array, GetFiles returns
    the list of files, and GetFileSystemEntries returns all the other two functions
    combined. GetLogicalDrives actually returns all the root paths for the current
    system. You never actually open the directory or any stream manipulation; you
    retrieve lists of the contents of the directory.'
