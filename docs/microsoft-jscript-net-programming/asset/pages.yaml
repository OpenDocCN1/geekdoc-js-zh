  md: "# Chapter 5\n\nIn JScript, any statement can be labeled, but you really can't\
    \ do much with the labels. Most languages have a goto or jump statement that you\
    \ can use to bounce from label to label, but JScript doesn't have one. JScript\
    \ has the continue and break statements, both of which obey properly labeled statements.\n\
    \nNormally, both the break and the continue statements exit the loop structure\
    \ that last ended. If you have two nested loops, break from the first loop only;\
    \ the second loop continues, and it is likely to call back to the loop in which\
    \ is nested. To defeat this, you label the outside statement so that you can break\
    \ out of the entire set of loops, rather than just the inner loop. Normally, the\
    \ following code would print 12 values:\n\n```\nimport System;\n```\n\n```\nOuter:\n\
    for(var i = 0; i < 3; i++) {\n  Console.WriteLine(i);\n  Inner:\n  for(var j =\
    \ 0; j < 3; j++) {\n    Console.WriteLine(j);\n    break Outer;\n  }\n}\n∅\n```\n\
    \nBreaking out of the inner loop would still mean printing 6 values. However,\
    \ because you are exiting the entire structure by explicitly breaking out of the\
    \ outer for loop, you only print 2 of 12 values.\n\n> CAUTION\nI can't emphasize\
    \ this point enough: Using labels with the continue and break statements is a\
