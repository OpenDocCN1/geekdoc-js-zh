  md: '# Executing Pattern Matches


    As seen earlier, executing a pattern match entails first creating a new Regex
    object with the pattern and RegexOptions. The Match function is called with an
    input string to retrieve a Match object with the results of the pattern match
    against that string. Listing 12.5 demonstrates using the Match function and properties
    of the Match object to show the results of a pattern match.


    # Listing 12.5 Investigating a Match Object


    ```

    import System;

    import System.Text.RegularExpressions;


    var re:Regex = new Regex(\(\d+) (\w*)");

    var m:Match = re.Match("123 JavaScript");


    Console.WriteLine("Match Results:");

    Console.WriteLine("Success: " + m.Success);

    Console.WriteLine("Value: " + m.Value);

    Console.WriteLine();


    Console.WriteLine("Group Results:");

    Console.WriteLine("Groups[0]: " + m.Groups[0].Value);

    Console.WriteLine("Groups[1]: " + m.Groups[1].Value);

    Console.WriteLine("Groups[2]: " + m.Groups[2].Value);

    ```


    # Named Pattern Groups Back


    Listing 12.5 does a good job of matching the string in question. However, if a
    third match needs to be added between the first and second, the group numbers
    are going to get thrown out of whack. If some code relies on group numbers, they
    get out of order and things might start to break. Listing 12.6 demonstrates using
    in grouped matches so that reordering items in the regular expression won''t affect
    code in the application.


    # Listing 12.6 Using Named Groups to Protect Code


    ```

    import System;

    import System.Text.RegularExpressions;


    var re:Regex = new Regex(''?<digits>\d+) (?<word>[\w\.]+)+'');

    var m:Match = re.Match("123 JavaScript");

    ```


    ```

    Console.WriteLine("Match Results:");

    Console.WriteLine("Success: " + m.Success);

    ```'
