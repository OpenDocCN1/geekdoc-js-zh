  md: "# Method overloading has two rules:\n\n+   - Two functions cannot have the\
    \ same prototype definition. The functions must differ in number of parameters,\
    \ type of parameters, and/or return value types.\n- Two functions cannot have\
    \ the same parameter list, differing only in return type.\n\nLet's examine a couple\
    \ overloaded functions. These functions perform the same actions, just on different\
    \ sets of data. The following example includes an Add function that adds a string\
    \ to an existing string; the Add function is overloaded to take an integer, a\
    \ string, and an array of strings:\n\n```\nclass Sample {\n    private var internalString:String;\n\
    \n    public function Add(i:int) : void {\n        internalString += i.ToString();\n\
    \    }\n    public function Add(s:String) : void {\n        internalString +=\
    \ s;\n    }\n    public function Add(s:String[]) : void {\n        internalString\
    \ += String.Join(\",\", s);\n    }\n}\n```\n\nThis code performs perfectly well\
    \ if the user calls the Add function with any of the available parameter overloads.\
    \ As you make sure that the parameter list is different for each function, the\
    \ overloaded functions won't throw any compiler errors. You need to watch for\
    \ the second rule of method overloading. The following code sample has a ValidSample\
    \ class that shows how you can change the return types of a function, and an InvalidSample\
    \ class that is an example of a compiler error because you change the return type\
    \ but still have the same parameter list:\n\n```\nclass ValidSample {\n    var\
    \ i:int;\n    var s:String;\n```\n\n```\npublic function Add(i:int) : int {\n\
    \    return (this.i += i);\n}\npublic function Add(s:String) : String {\n    return\
    \ (this.s += s);\n}\n```\n\n![](img/7d779d3c15b9095d220d4f5d5c9b327f_161_0.png)"
