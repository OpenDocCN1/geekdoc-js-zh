  md: '# Chapter 11


    (that is, the Xml class). In addition, several collection classes are necessary
    for iterating over the XmlDocument class structure, including the XmlNodeList
    and XmlAttributeCollection classes.


    When you''re comfortable working with ready-built XML documents, you can move
    on to new XML documents, using two approaches:


    +   * Update existing content—You can add and remove items from the XmlDocument
    class directly and then save the new content to a file. This is the easiest approach
    because it is object oriented and involves simply creating and adding nodes.

    * Write entirely new documents—You can start with a blank XmlDocument class or
    you can make use of the XmlTextWriter class. Using the XmlTextWriter is much faster
    and requires less code for writing new documents. However, it has the shortcoming
    of not being strongly typed or validating (that is, it can only write string values
    and it doesn''t check your data against a schema).


    The remainder of this chapter is dedicated to using XmlDocument and XmlTextReader
    to load XML content and enumerate XML content.


    # Loading XML Content


    To load XML documents, you can use several classes in the System.xml namespace.
    Each class provides different APIs for accessing a loaded document and provides
    some restrictions on the use of the document. The most widely used is the XmlDocument
    class because it provides an in-memory tree structure of the document that you
    can quickly and easily navigate. When an XML document is rather large, the XmlDocument
    class cannot be used because it consumes too memory. In this case, you can use
    the XmlTextReader class, which provides a stream-style cursor that works with
    the file on disk rather than working with the file using in-memory objects. If
    you only need a couple of the values in an XML document or are trying to process
    the document into a private format, this is definitely the method to use.


    The XmlDocument class is shown in its entirety in Figure 11.2. Not all the class
    members are crucial in using the XmlDocument class, so some of them are not discussed
    in this chapter. Some of the class members are discussed in later sections of
    this chapter.


    The XmlDocument class has several constructor implementations. However, none of
    the advanced implementations are useful for generic XML processing. This leaves
    the default constructor, which all of the following examples use.'
