  md: '# Chapter 9


    One of the greatest features of JScript .NET language is that instead of interpreted
    at runtime by a scripting language, it is now compiled into an actual assembly
    and gains the extra speed of running as native code instructions on the processor.
    This greatly enhances the speed at which JScript .NET runs, introduces many new
    features at the compiler level, and introduces some limitations as a result of
    both compiled and maintaining full support for ECMAScript and the CLR.


    We''ll start by examining various command-line features. If you recall, we called
    some basic programs using the compiler in Chapter 2, "Organization of JScript
    .NET." We''ve also compiled all the code listings up to this chapter using a special
    myfile. However, unless you looked at the makefile closely, you probably don''t
    know what is happening, and you won''t be familiar with the many additional options
    available to you at the compiler level.


    We''ll be covering the basic syntaxes for libraries, executables, and Windows
    executables, along with how to reference other assemblies and use their code and
    objects. We''ll learn how to affect code generation through several options that
    allow varying levels of debug output, code profiling, and warning generation.


    This will move us directly into the conditional compilation section. Here you''ll
    discover how to define symbols on the command line that can be used by special
    statements in the source file to include or omit code for the compiler. We''ll
    go over the rest of the directives supported by JScript .NET that allow for custom
    debug information, DEBUG and TRACE, used by the CLR that also affect debug output
    and the use of several important CLR classes.


    assembly-level features require the use of an assembly-level attribute. Up to
    now we''ve placed attributes on everything except for the assembly itself. We''ll
    go over the syntax for assembly-level attributes, as well as the more common attributes
    you can use to specify version information, version comments, and keys for strongly
    naming your assemblies.


    # Command-Line Compiler Usage


    No matter what type of program you''re going to be using JScript .NET, you''ll
    need to know how to use the command-line compiler. This compiler is capable of
    creating normal executables, Windows executables that spawn without a console,
    and libraries of code to be referenced by other libraries and executable content.
    The compiler is responsible for resolving any external references by investigating
    your referenced assemblies. During this stage, the compiler ensures that all the
    techniques and methods you''ve used are valid and actually exist in one of the
    assemblies you''ve imported. This link stage provides for a good deal of error
    checking at compile time to reduce runtime errors for missing symbols.'
