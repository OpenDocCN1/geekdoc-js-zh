    You can specify any number of parameters to functions, and you specify them between
    the parentheses that define the parameter list. You type each parameter by giving
    it a name, followed by a comma, and then you type. This is identical to the variable
    declaration syntax, except that it does not require visibility attributes or the
    keyword. The following example demonstrates of very simple class methods:


    ```

    class Sample {

    function A() : void {

    }

    function B(name:String) : void {

    }

    function C(firstName:String, lastName:String) : void {

    }\}

