  md: '# Regular Expressions 267


    # Table 12.2 continued Description


    | Character | Description |

    | * | Matches the preceding subexpression zero or more times. For example, zo*
    matches "z" and "zoo". * is equivalent to {0}. |

    | + | Matches the preceding subexpression one or more times. For example, zo+
    matches "zo" and "zoo", but not "z". + is equivalent to {1}. |

    | ? | Matches the preceding subexpression zero or one times. For example, do(es)?
    matches the "do" or "does". ? is equivalent to {0,1}. |

    | {n} | n is a nonnegative integer. Matches exactly n times. For example, o(2)
    does not match the "o" in "Bob" but matches the o''s in "foo". |

    | {n,s} | n is a nonnegative integer. Matches at least n times. For example, o{2,}
    does not match the "o" in "Bob" and matches all the o''s in "foooood". {0,} is
    equivalent to o*. |

    | {n,m} | m and n are nonnegative integers, where n < m. Matches at least n and
    at most m times. For example, o{1,3} matches the first three o''s in "ooooood".
    {0,1} is equivalent to o*?. Note that you cannot put a space between the numbers
    and the quantifier |

    | ? | When this character immediately follows any of the other quantifiers (*,
    +, ?, {n}, {n,m}), the matching pattern is nongready. A nongreedy pattern matches
    as as of the searched string as possible, whereas the default greedy pattern matches
    as much of the searched string as possible. For example, in the "oooo", o+ matches
    a single "o" and matches all o''s. |

    | (pattern) | Matches any single character except \n. To match any character except
    the \n, use a pattern such as [\n]. |

    | (?:pattern) | Matches and captures the character. To match characters (") use
    \( or \). |

    | (?=pattern) | Matches but does not capture the match; that is, it is a capturing
    match that is not stored for later use. This is useful for combining parts of
    a pattern with the "or" character (|). |

    |=pattern) | Positive lookahead matches the search at any point where a string
    match begins. This is a noncapturing match; that is, the match is not captured
    for later use. For example, Windows(?=98|NT|2000) matches "Windows" in "Windows
    2000" but not "Windows" in "Windows 3,1". Lookaheads do not consume characters;
    that is, after a match occurs, the search for the next match begins immediately
    following the last match, not after the characters that composed the lookahead.


    # REGULAR EXPRESSIONS'
