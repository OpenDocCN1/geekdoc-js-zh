  md: "# Chapter 15\n\nTo launch a form, some global startup code needs to be generated.\
    \ Normally, this is taken care by creating an object in global code and running\
    \ the necessary methods. However, there is a special attribute that needs to be\
    \ applied to the function that launches the form. For this reason it is best to\
    \ create a static function and apply the STATThreadAttribute to the function declaration.\
    \ This forces the threading model into an appropriate state to run Windows Forms.\
    \ Inside of this static method, the Application.Run method is called on a new\
    \ instance of the form that has been created. Listing 15.1 demonstrates the creation\
    \ of a new form, setting all the properties discussed here in this section, and\
    \ then launches this form and displays it onscreen.\n\n# Listing 15.1 Launching\
    \ a Basic Windows Form\n\n```\nimport System;\nimport System.Drawing;\nimport\
    \ System.Windows.Forms;\n\npublic class BasicForm extends Form {\n\n    public\
    \ function BasicForm() {\n        InitializeComponent();\n    }\n\n    private\
    \ function InitializeComponent() : void {\n        this.Text = \"Windows Forms\"\
    ;\n        this.Height = 400;\n        this.Width = 500;\n        this.WindowState\
    \ = FormWindowState.Normal;\n        this.StartPosition = FormStartPosition.CenterScreen;\n\
    \    }\n\n    public STATThreadAttribute() static function Main(Args:String[])\
    \ : void {\n        Application.Run(new BasicForm());\n    }\n}\n\nBasicForm.Main(Environment.GetCommandLineArgs());\n\
    ```\n\n# Buttons, Labels, and Text Controls\n\nI've never heard about how neat\
    \ a blank window is. It was entirely never considered a WOW feature (well, I once\
    \ made a fully round window when using custom regions wasn't widely known, and\
    \ that was kind of a WOW). To get the user's attention, it might be a bit better\
    \ to add some buttons, labels, and text controls."
