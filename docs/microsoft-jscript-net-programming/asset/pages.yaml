    to write code when you work on a variable mathematically and immediately assign
    the result back to that variable. With long enough variable names, this can become
    extremely tedious, so some intuitive operators were added to JavaScript to ease
    the amount of code required for these operations. All the arithmetic operators
    discussed previously in this chapter—except the increment and decrement operators—have
    equivalent inline operators. (The increment and decrement operators already work
    on a variable.)


    All the inline operators use the left-side variable as both the leftmost operand
    in the statement and for variable assignment. The addition inline operator (++)
    can be used as follows to add 10 to a variable:


    ```

    var Variable:int = 25;

    Variable += 10; // Variable equals 35

    Variable = Variable + 10; // This is equivalent to the previous code.

    ```


    Notice that the inline assignment operator saves quite a bit of typing. It is
    much cleaner for simpler operations, which can come in handy when you''re writing
    large programs.


    What happens when you want to write an expression on the right side of the inline
    assignment operator? JavaScript resolves the entire expression on the right side
    of the operator, and then it uses the result against the variable. To add the
    result of a complex expression to Variable, you would use the following code:


    ```

    var Variable:int = 25;

    Variable += 10 * 3 + 6; // Variable is equal to 49

    Variable = Variable + (10 * 3 + 6);

    ```


    // This is equivalent to the previous code.


    The subtraction operator (-=), inline multiplication (*=), inline division operator
    (/), and inline modulus operator (%= perform all operations using the right-side
    and the variable as the left-side operand, assigning the result back to the variable.
    They all accept the same syntax as the addition operator.


