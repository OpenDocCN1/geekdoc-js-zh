  md: '# Creation of a Basic Console Program


    The basic operations of a console program include getting some information from
    the user, generally via command-line arguments, and then displaying some data
    back out the screen for the user to examine. I won''t be discussing anything here
    because I think interactive console applications are a waste of time. Normally,
    console applications accept any required parameters on the command line so that
    they can be used for automation. We''ll get more interactive examples in Chapters
    14, "Using JScript .NET in ASP .NET," and 15, "Windows Forms Programming in JScript
    .NET," where we''ll be discussing UI concepts for ASP.NET Web applications and
    Windows Forms.


    The first important item is how the command line is obtained. In the System namespace,
    Microsoft has provided an Environment class. This environment is loaded with methods
    for getting information about the command line, environment variables, OS version,
    and so on. Now let''s write some code to make this useful. The following example
    demonstrates how to create a String array, retrieve the command-line parameters,
    and process them.


    ```

    var Args:String[] = Environment.GetCommandLineArgs();


    for (var i = 0; i < Args.Length; i++) {


    }

    ```


    > CAUTION


    When using strongly typed arrays, remember that they are bounded and will throw
    an exception if the index provided is out of range. This is different from JScript-style
    arrays that will simply return an undefined element when accessing an array element
    that hasn''t been assigned.


    The first argument in the command line will be the name of the executing program.
    Generally the loop will start at index 0. The preceding code demonstrates how
    to get the command line. The next step is to give information back to the user.
    This happens through the Console class, which is also located in the System namespace.
    The Console class provides access to all three standard console streams, Input,
    Output, and Error. You can interact with these streams directly using Stream IO
    methods, or you can utilize the functions available on the Console class itself.
    For this example we will be using the methods on the Console:


    ```

    Console.Write(Args[i]);

    Console.WriteLine(Args[i]);

    ```'
