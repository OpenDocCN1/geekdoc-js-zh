  md: '# Summary


    In this chapter you have learned about all the basic datatypes available in JScript
    .NET, along with quite a few of the object types that are available through the
    CLR. Services are provided in two locations in JScript .NET: through the JScript
    .NET language and through the CLR, which hosts the JScript .NET language while
    it is running. You''ll make use both of these services throughout the book because
    they are both important to effective .NET programming.


    New performance-oriented options are available in JScript .NET. For example, if
    you strongly type code, compile-time warnings appear if a variable assignment
    is inappropriate. You can also use bounded arrays through the CLR, as opposed
    to the JScript .NET dynamic arrays. Bounded arrays offer more performance than
    dynamic arrays, and dynamic arrays offer more functionality and are more convenient.


    In this chapter you learned how to use strings and the new StringBuilder class
    can provide great memory usage and speed improvements when you''re building long
    strings from many smaller parts.


    In Chapter 4, “Operators and Commenting,” you''ll learn about the various operators
    available in JScript .NET, including the arithmetic, assignment, comparison, Boolean,
    and bitwise operators. You''ll also learn some of the object-oriented operators
    that allow you to create new instances of objects and find out what type of object
    you''re working with.'
