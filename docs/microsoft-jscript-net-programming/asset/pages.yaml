    \nThe parameters of a method can take a special form. If the final parameter type\
    \ is a single-dimensional array of any type, you can declare the final parameter\
    \ as a variable-arguments parameter. This means that rather than having to explicitly\
    \ create an array of items, you can call the method with a list of items of the\
    \ same type as the array.\n\nTo denote that the final parameter is a variable-arguments\
    \ parameter, you precede the parameter declaration with an ellipsis (...), which\
    \ tells the compiler to add a special tag, the params attribute in the IL. The\
    \ following function takes three initial parameters and any number of additional\
    \ parameters, that are of the type of the variable-arguments parameter:\n\n```\n\
    VarArgsFunction(first:String, middle:String, last:String, ...phone:String[]) {\n\
    ```\n\nYou can call this special function by using several different declarations.\
    \ You can specify an array of strings as the fourth parameter, you can specify\
    \ a single string as the fourth parameter, or you can specify four or more parameters\
    \ of type string, and they will be concatenated into an array. You can call it\
    \ with no fourth parameter, in which case the array is zero length. Variable-length\
    \ parameters are an advanced concept that is supported by several of .NET languages,\
    \ including C# and VB.NET. Examples of variable-argument parameters in the CLR\
    \ are String.Format function and the Console.WriteLine. The following is an example\
    \ of using methods to call a function with a variable-length parameter:\n\n```\n\
    VarArgsFunction(\"Justin\", \"E\", \"Rogers\", 555 555-5555);\nVarArgsFunction(\"\
    Justin\", \"E\", \"Rogers\",\nString[](({\"111 111-11111\", \"555 555-5555\"}));\n\
    VarArgsFunction(\"Justin\", \"E\", \"Rogers\",\n\"111 111-1111\", \"555 555-5555\"\
    , \"777 777-7777\");\nVarArgsFunction(\"Justin\", \"E\", \"Rogers\");\n```"
