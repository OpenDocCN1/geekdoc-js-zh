  md: '# Chapter 6


    +   - Existential attributes—Existential attributes are used to control the class
    inheritance model.


    +   - Versioning attributes—Versioning attributes are used to override the normal
    inheritance model. These attributes are used to break normal versioning semantics.


    +   - Custom attributes—Custom attributes can be defined and used by the programmer
    or by the CLR. Custom attributes are special in that they don''t directly affect
    the assembly output, but they become part of the assembly metadata.


    # Visibility Attributes


    Visibility attributes—that is, the public, private, protected, and internal attributes—whether
    a member or class can be seen from another member or class. Visibility can be
    a limiting factor when methods are marked to be accessible only in the current
    class or inheriting classes. Visibility can also be used to make classes or members
    globally accessible or public to all code outside the class.


    You apply the public attribute to members that are globally visible and inside
    a package, and any public class can be constructed by any other class or piece
    of global code. This is the default for all classes, interfaces, and class and
    interface members.


    You cannot apply the private attribute to a class, but to the class''s member
    definitions. Any class member defined as private is visible only within its class.
    The members cannot be accessed outside that class, by any subclasses, or by any
    nested classes. This is the strictest of the visibility attributes, and you use
    it only when you need to hide members and data for use by only one class.


    For the most part, you cannot apply the protected attribute to classes. There
    is one exception: the nested class can have the protected attribute applied. The
    protected attribute is almost identical to the private attribute. However, any
    subclasses of a class marked as protected can access the member as well as the
    class in which it is defined. After this attribute is used on a nested class,
    the class can be used only by the class it is defined in and by any classes derived
    from that.


    You use the internal attribute to package scopes or members. When a class is defined
    outside a package and the internal attribute is used, it can be used by any global
    code in the same assembly and also from any other packages in the same assembly.
    When the internal attribute is used on a class within a package, that class is
    available only within that package. Even other packages within the same assembly,
    global code, or global classes are unable to access the class when this attribute
    is applied. When this attribute is applied to members of a class or nested classes,
    the same rules as the class rules for the internal attribute apply.'
