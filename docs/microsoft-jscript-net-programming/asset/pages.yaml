    You also need a set of functions that work on the current string to add, remove,
    and insert strings. The CLR has instance methods for removing and inserting strings,
    but it doesn''t have one for appending or concatenating strings together. You
    can use the Insert method to make up for this shortcoming. The Insert method works
    on the current string and takes a starting index along the substring to be inserted.
    You can use this function for appending a substring by setting the starting index
    to the end of the current string. Remove method takes the starting index and a
    length to specify a substring to be removed. Together, these two functions are
    capable of performing most maintenance tasks.


    You can compare any String object to any other String object using the CompareTo
    method. The CompareTo method can also be used to compare anyCLR objects.


    The following is a fairly simple code example that shows how to do string manipulation
    using the Insert and Remove methods


    ```

    var TargetString:String = "Here is the final string!"

    var StartString:String = "is the wrong stuff!"


    // Lets go ahead and start the string off correctly

    StartString = StartString.Insert(0, " ")

    Console.WriteLine(StartString)

    Console.WriteLine(TargetString.CompareTo(StartString))


    // We need to get rid of that ending

    StartString = StartString.Remove(12, 12);

    Console.WriteLine(StartString)

    Console.WriteLine(TargetString.CompareTo(StartString))


    // Now lets finish this bad off

    StartString = StartString.Insert(TargetString.Length, "final string!")

    Console.WriteLine(StartString)

    Console.WriteLine(TargetString.CompareTo(StartString))

    ```


    In this example, notice the results of the CompareTo method, which keeps working
    until the strings are equal. The value -1 means that the current string is less
    than the string being compared to, the value 1 means that the current string is
    greater than the string being compared to, and the result 0 means the strings
    are equal.'
