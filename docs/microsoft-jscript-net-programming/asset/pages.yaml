  md: '# Chapter 12


    TABLE 12.3 continued

    | Member Name | Description |

    | --- | --- |

    | None | Specifies that no options are set. |

    | RightToLeft | Specifies that the search will be from right to left instead of
    left to right. |

    | SingleLine | Specifies single-line mode. Changes the meaning of the dot (.)
    so that it matches every character (instead of every character except \n). |


    After the Regex object has been created, it is time to start using it. All the
    methods discussed are going to be instance methods. However, each of these methods
    also has a static function equivalent that takes a pattern as the second parameter
    immediately following the input parameter. A string to be match against a regular
    expression by using the IsMatch method. This method can just the input string
    to test, or it can take both the input string and an offset to start matching.
    The return value is either true or false depending on whether the match was successful.


    Two methods are available for returning a match. The Match method returns the
    first match in a string. The parameters for the Match function are the same as
    those for the IsMatch method. When more than one match needs to be retrieved,
    the Matches method can be used instead. It returns all matches of a particular
    pattern within a string. This is similar to using the g) option in JavaScript.
    The g option isn''t available in the CLR engine, so the Matches method is used
    to simply return an array of all matches. Again, the function prototypes are identical
    to both the Match and the IsMatch methods. Because each of these two functions
    returns Match object, it is time to examine the Match class.


    # Match Class


    The Match class represents a full match of the regular expression. One special
    property of the Match class is that it inherits from the Group class. This means
    that it also represents a group and has all the special properties of the Group
    class, including the Value property that represents a group match. However, because
    the Match object represents the entire match, the Value contains the Groups property
    that returns a Group collection. The item at index i in this collection is the
    same as Match.Value. This can be really confusing at first because there are many
    ways to get the same values, but I''ll try to keep it simple and consistent as
    possible.


    Starting with the Match from the beginning, you are able to use the Success property
    often. The Success property needs to be investigated for a Match object to ensure
    that the pattern really did match. If the pattern didn''t match, it will return
    false, and the program should perform the necessary processing to get a new value.'
