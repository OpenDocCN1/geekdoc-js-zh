    # Conditional Compilation


    Conditional compilation is used to enable or disable pieces of code before the
    code is sent to the compiler to generate the actual assembly. Conditional compilation
    comes in two steps:


    +   - Define your conditional symbols. This happens on the command line by use
    of the define compiler option. A sample symbol would be the DEBUG or TRACE symbols
    used by the CLR.

    - Wrap blocks of code within your program using some compiler directives.


    The first step of conditional compilation is to define your conditional symbols
    on the command line. This happens on the command line using a special compiler
    flag. In this manner you can simplify your code using different flags to achieve
    different behaviors. This might be used to version code or provide extra levels
    of debug information depending on how the files are compiled.


    After you''ve defined the symbols you want on the command line, the next step
    is to wrap blocks of code within your program using some compiler directives.
    The compiler effectively runs over the file first time to look for these special
    directives. It either removes or inserts the code between the directives depending
    on what symbols you specified on the command line. This way the source file can
    contain multiple code paths that you decide at runtime. Only the code that is
    actually selected by the directives gets compiled and included in the executable.
    So you can use this to try alternative forms of the same function or analyze your
    methods using performance calls at the beginning and end of code blocks.


    # Defining Symbols on the Command Line


    Defining symbols on the command line is generally the last step in the conditional
    feature of JScript .NET. We''ll discuss it first because you''ll need to figure
    out what your symbols are going to be before start coding, and you''ll probably
    want to set up your build system with the various symbols before you start coding
    as well.'
