  md: '# JScript .NET Compiler Reference


    # Table A.1 continued Description


    | Option | Description |

    | --- | --- |

    | /debug[+, -] | Instructs the compiler to generate debug symbols for the compiled
    assembly. Debug symbols enable stack traces to contain the filenames and line
    numbers for functions to making errors much easier. The debug option is on by
    default. |

    | /fast[+, -] | Disables language features to enable better code generation. Code
    generated with the fast option generally creates faster code but can often emit
    errors if JScript features are used. An example of a disabled feature when using
    the fast option is expando classes. By default, the fast option is off. |

    | /warnaserror[+, -] | Treats warnings as errors. Any warning causes the compilation
    to fail. |

    | /warn:<level> | Sets the warning (0-4). Various warnings have different warning
    levels. Setting a higher level generally means more warnings, whereas a lower
    level enables fewer warnings. |

    | @<file | The compiler will read additional commands out of the command file.
    This is a good way to share commands between multiple programs. It also enables
    shorter command lines in you compile your program by hand every time. |

    | /help | Displays the JScript .NET compiler help output. |

    | /define:<symbol>/d:<symbol> | Defines conditional compilation symbols. Commonly
    used include the DEBUG and TRACE symbols, which are required for some CLR debug
    capabilities. |

    | /n | Prevents the compiler from outputting the Microsoft logo and copyright
    information. |

    | /print[+, -] | Enables or disables the use of the print() function. print is
    an implementation-independent method of outputting text. In JScript .NET this
    function directly evaluates to the Console.WriteLine function. |

    | /codepage:<id> | Enables the use of a special code page when opening source
    files. This option enables the use of localized source files in different languages.
    |'
