    # Summary


    This chapter discussed the concepts of CLR networking in a very minimal manner.
    The topics discussed are enough to migrate basic Web interactions into any program
    you might want to create. The chapter began with the concepts of WebRequest and
    WebResponse objects. These objects will be always available during the lifetime
    of the CLR. What will change the protocol handlers such as the HttpRequest and
    the FileWebRequest? Expect some handlers for ftp and other common Web protocols
    in the future.


    With these basic concepts behind us, we move into creating basic Web requests
    in the form of downloading content to disk. Even though the returned response
    stream was used only for obtaining a byte array and writing to file, it could
    be used for more advanced processing. More advanced processing might include making
    sure that the byte array retrieved from the WebResponse can be converted to a
    string to be processed using regular expressions (see Chapter 12, "Regular Expressions")
    or other string processing techniques. You also saw that the generic response
    object could always be cast to the response object handler being used. This gives
    access to many parameters and methods useful only for that particular protocol.
    In the case of the HTTP protocol, the StatusCode can always be used to determine
    the true success of the request rather than just whether the server exists.


    In addition to the synchronous Web operation, you can use an asynchronous option.
    This enables a program to do background processing of requests and responses.
    It can be used to process multiple requests at the same time, or it can be used
    to provide a crisp response to the user even giving the power to cancel the download
    in progress if it is taking too long. All the principles make for a better user
    experience and a better program.


    In the next chapter we''ll continue our discussion of the Web-based technologies
    as we examine using JavaScript .NET to program some basic ASP.NET pages. If you
    have a Server on your machine, you can even use the next chapter to build pages
    for the examples in this chapter.


