  md: '# Chapter 10


    Every stream object has some basic properties describing how the stream can be
    manipulated. These include CanRead, CanSeek, and CanWrite. With these properties
    you can easily determine what of operations are allowed. For instance, in a network
    stream, you won''t be able to seek through the data; you''ll have to read from
    beginning to end, and CanSeek will be false. When using a stream from a CD-ROM
    drive, you won''t be able to write to the files because they are read-only. So
    CanWrite will be false. At the lowest level these properties tell you how to use
    the stream available to. When the CanSeek property is set, two additional properties
    become active. The Length property returns the full length of the stream and is
    obtained by seeking to the end and getting the Position property. The Position
    property is the current location in the stream that is being read from or written.


    # CAUTION


    > If you try to access the Length and Position properties on a stream where CanSeek
    is false, you''re going to end up throwing an exception. If you''re unsure about
    the type of Stream that will be coming in, it''s always best to use some error-handling
    code as possible so that you can clean any open connections and avoid memory and
    handle leaks.


    With this method, the Stream class also has several useful methods. This effectively
    releases any stream resources, after which the object''t be used anymore. You
    can Read, Write, and Seek on the stream. All three of these functions have the
    capability to update the position as you move over the stream. When a stream is
    being written to, a Flush method is also available for forcing buffered data to
    be written to the underlying device. This could be out of file, out onto the network,
    or into its final location in memory. All other stream classes extend from the
    base stream and must support the methods. For instance, all the CLR readers and
    writers work on the base stream, but if you pass in a FileStream or a NetworkStream,
    they still function properly; simply use any of the extended methods available
    to them.


    The only derived class you should be interested in at this point is the FileStream
    class. All the methods you learned about about the File class to create and open
    files will always return a FileStream object. You will be passing this into any
    of the reader/writer classes we''ll talk about next so that the reader/writer
    class can work on the underlying stream.'
