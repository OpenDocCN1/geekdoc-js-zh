  md: '# Datatypes, Arrays, and Strings


    +   - The static keyword makes variables persistent after they go out of scope,
    effectively making the variable a global variable yet limited to being global
    inside the current scope, without additional modifiers.

    - The private keyword declares variables as locally scoped variables that are
    available only to code within the current scope.


    The scope-related modifiers are available only from within a class definition.
    So, for the most part, you won''t be using them in the early chapters of this
    book.


    Simply declaring a variable doesn''t do anything more than give that variable
    scope. If you performed a declaration within a class, the variable would be scoped
    to that. If you performed the same declaration within a method, the variable would
    be scoped to the function level. Because the declaration in the preceding example
    occurs in global code, it creates a global variable named UnknownVar of type Object.
    This does not provide any performance benefits, and the variable is not strongly
    typed. To strongly a variable, you use the syntax name:type (where name is the
    name of the variable and type is the variable type). The colon after name tells
    the compiler that you want to strongly your variable. The following is an example
    of strongly typing several variables (notice whitespace doesn''t matter to the
    compiler):


    # 3


    > NOTE


    Notice the introduction of whitespace (that is, space characters, tabs, and carriage
    returns) doesn''t matter to the compiler and doesn''t affect how the compiler
    parses the source code.


    ```

    var StringVar:String

    var IntVar    :Int32

    var BoolVar:  Boolean

    var ArrayVar  String[]

    ```


    All these statements create valid variables that are strongly typed. The whitespace
    between the variable name, colon and type doesn''t matter because the compiler
    ignores whitespace. You can make the name a short name, or you can make it a fully
    qualified name by appending the namespace to the name. After you type this code,
    the compiler will throw warnings if you try to assign invalid values. Assigning
    to StringVar an object of some type that can''t be converted to a string would
    result in a compiler error, as assigning a string to IntVar.'
