  md: '# Chapter 13


    This can be rather confusing, but it enables the programmer to use a single class
    programming to handle any style of URI with which a user might identify a remote
    resource. The user in a file:// protocol URI, the FileWebRequest would be returned
    instead of the HttpRequest. Any class that is registered with a prefix might inherit
    from the WebRequest base class. The WebRequest base class has enough methods to
    perform any basic network requests. Each of the derived classes might in turn,
    contain methods or properties specific to that type of Web transaction, but for
    only the parts on the HttpRequest need to be used.


    Several useful methods are available on the WebRequest object. The GetResponse
    method can be used to initiate the Web request and return an answer from the server.
    Depending on the protocol, this response can be very different. It can be a Web
    page, a file of some sort, or possibly some directories information. For asynchronous
    programming, the BeginGetResponse and EndGetResponse are used in place of the
    GetResponse method. The begin method initiates the network transfer and accepts
    a callback function. After the response is retrieved, the callback function is
    called and the end method can be used to finalize the transaction. If a request
    is taking too long the Abort method can be used to stop the transaction from completing
    and cancel the request. Most of the time this isnt used because the Timeout property
    is more useful. The Timeout property takes the maximum time in milliseconds before
    the request is terminated. If the timeout is reached, an exception is thrown,
    indicating that there was a failure to retrieve the response.


    In addition to the properties on the WebRequest class, there are properties available
    only on the HTTP implementation that might come in handy. The UserAgent property
    can be used to make the server think that the connection is coming from a well-known
    browser or a brand new. The AllowRedirect property can be set to follow redirects
    automatically. This can be handy when you are writing some Web spider application
    that lists all the pages available on a particular Web site. Even the Method property
    can be modified of GET and changed to something POST. The basic methods are enough
    to write generic functions to handle any protocol, but often you can get a better
    response by using the more advanced features of the derived classes.


    After the request is created, the GetResponse method is generally called. This
    method returns a Response object. Now this response object behaves in the same
    manner as the request object did. Instead of returning a true WebResponse, it
    returns the class associated with the protocol. Now, after a Response object is
    obtained, the request and response have fully completed, all response data have
    been received, and the connection to the remote server has been shut down. Properties
    on the WebResponse object can be examined to determine the success of the operation.
    The ContentLength property returns the amount of data received, the Headers property
    retrieves a collection of headers returned by'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Accessing the Internet 287


    server, and the Response confirms the name of the page account retrieved. Remember
    that if redirections are on, this URI might be different from the originally received
    URI.


    If the request was successful and data was retrieved, the getResponseBody method
    has to be called to get the stream in Chapter 10, "File Access," Any of the IO
    classes for be used here to examine the data. After the data has been processed,
    the Close method must be called to shut down the response object and wait for
    an available socket that will be tied until the next GC (Garbage Collection).
    This is probably the most important concept in using the Net classes because not
    enough response objects will starve a program for available resources to initiate
    future requests.


    Again, the WebResponse is more featured than its name, WebResponse. Some of the
    more useful properties include the following: The Server property can determine
    which server returned the request in question. The StatusCode can be examined
    to determine whether an HTTP error occurred as a 404 File Not error or maybe a
    500 Internal Server Error. The StatusCode returns only the numeric portion of
    the error messages, and the StatusDescription returns a human-readable form of
    the StatusCode.


    That should be enough information to work through some basic Web transactions.
    Let''s move on making Web requests and processing the responses.


    # Simple Web Requests


    Requesting Web content is becoming a common occurrence in many applications. Accessing
    the Web can be done to download new data for the application (XML seems to be
    very popular for this), to download new files as file moves or updates to the
    program, or just to get some content for the user. Because all the methods making
    Web requests were discussed in the first section of this chapter, this section
    demonstrates the actual programming concepts for accessing Web. The examples will
    all accept URLs on the command line, and there won''t be any URLs hard-coded in
    the listings. This means that the samples won''t work unless they are properly
    called with a URL on the command line. This section discusses the use of basic
    Web requests using the WebRequest class followed by a more advanced use that checks
    for HTTP conditions and uses the HttpRequest. There is also a FileWebRequest that
    works with files on the local machine, but this won''t be discussed because basic
    file IO, discussed in Chapter 10 will handle this situation in a more thorough
    manner.


