  md: "# Using JScript .NET in ASP.NET 303\n\n```\n</script>\nn<body>\n<asp:Label\
    \ id=\"Message\" runat=\"server\" />\n</body>\n```\n\nIn addition to the callback\
    \ functions for hooking into the page rendering process, there are also events\
    \ that are called for different states in the page. A good example of this is\
    \ the runtime error. Normally, when a runtime error occurs and is not trapped\
    \ in the page's code, ASP.NET generates an error message and sends the message\
    \ to the client. By trapping the Error event, the page can customize what happens\
    \ when an error occurs by redirecting to a custom page. The following example\
    \ demonstrates how to redirect to a custom page when a runtime error occurs:\n\
    \n```\n<script language=\"javascript\" runat=\"server\">\nfunction Page_Load(Object,\
    \ e:EventArgs) : void {\n  // Code that causes an error\n}\nfunction Page_Error(Object,\
    \ e:EventArgs) : void {\n  Response.Redirect(\"MyPrettyError.page\");\n}\n</script>\n\
    ```\n\n```\n<body>\n<asp:Label id=\"Message\" runat=\"server\" />\n</body>\n```\n\
    \n# Summary\n\nThis chapter is not meant to be a comprehensive ASP.NET tutorial,\
    \ but to introduce you to the various server-side programming tools available\
    \ in the new ASP.NET programming model and JScript .NET. In this chapter you have\
    \ learned to create basic ASP.NET applications and how to customize the ASP.NET\
    \ page with all the features and options that make it a powerful new tool. You\
    \ have also learned how to create in-line script blocks and server-side script\
    \ blocks. In addition, you have learned a bit about code-behind code blocks.\n\
    \nYou have also learned in this chapter how to use the ASP.NET event model to\
    \ tap into the page-rendering process and how to use the server-side code and\
    \ object model.\n\nChapter 15, \"Windows Forms Programming in JScript .NET.\"\
    \ discuss the Windows forms programming model, the exciting world of user interface\
    \ programming, and the how to create windowed applications.\n\n# 14 USING ASP\
    \ .NET JSCRIPT"
