  md: '# Regular Expressions


    # Table 12.2 continued Description


    | Character | Description |

    | \S | Matches any nonwhitespace character. Equivalent to [^ \f\n\r\t\v]. |

    | \t | Matches a tab character. Equivalent to \x09 and \I. |

    | \v | Matches a vertical character. Equivalent to \x0b and \cK. |

    | \w | Matches any word character including underscore. Equivalent to [A-Za-z0-9_].
    |

    | \W | Matches any nonword character. Equivalent to [^A-Za-z0-9]. |

    | \xn | Matches n, where n is a hexadecimal escape value. Hexadecimal escape must
    be exactly two digits. For example, \x41 matches "A"; \x41 is equivalent to \x04
    and "1". Allows ASCII codes to be used in regular expressions. |

    | \num | Matches n, where num is a positive integer. A reference back to captured
    characters. For example, (.)1 matches two identical characters. |

    | \n | Identifies an oct escape value or a back reference. If \n is preceded by
    at least n captured subexpressions, n is a back reference. Otherwise, n is an
    oct escape value if n is an oct digit (0–7). |

    | \nm | Identifies an oct escape value or a back reference. If \nm is preceded
    by at least n captured subexpressions, nm is a back reference followed by literal
    m. If \nm is preceded by at least n captures, n is a back reference followed by
    literal m. \n matches oct escape value nm1 when n is an oct digit and m are oct
    digits (0–7). |

    | \nm1 | Matches oct value nm1 when n is an oct digit (0–3) and l are oct digits
    (0–7). |

    | \un | Matches n, where n is a Unicode character expressed as hexadecimal digits.
    For example, \u00A9 matches the copyright symbol (©).


