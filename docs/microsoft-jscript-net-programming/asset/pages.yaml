    and the creation of numerical algorithms for solving problems. JavaScript .NET
    provides operators for this in addition to many complex mathematical operators:


    +   **Operators that appear within statements**—This is how the arithmetic operators
    are most commonly used.


    +   **In-place operators**—These come in handy when only simple operations need
    to be performed on an existing variable.'
