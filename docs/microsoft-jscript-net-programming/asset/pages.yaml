    # Declaring Constructors


    Constructors are the lifeless of a class definition. Whenever a user creates an
    instance of a class, he has an easy way to specify parameters or pass in any information
    needed for the class to perform its basic operation. Listing 6.3 encapsulates
    the String class, so it includes a constructor that takes a String object. The
    EnhancedString class is worthless without this initialization because it can''t
    perform operations on a null object.


    Many classes can''t function without up-front data. Constructors fill this gap.
    In the following subsections we''ll talk about the default constructors, overloaded
    constructors, and base constructors.


    # Declaring Constructors


    The default constructors (empty and copy) are constructors that the JavaScript
    compiler automatically creates for whenever you specify a class definition. The
    empty constructor is important because it enables the creation of the class. Without
    the empty constructor, you would have to create at least one custom constructor
    for each class, or the classes could not be used. The copy constructor is abstract
    and is used to create an copy of a class.


    By default, JavaScript creates the empty constructor, which is simply a constructor
    for an object that takes no parameters. If you need to do some initialization
    in the empty constructor, you can specify a constructor yourself, in which case
    the JavaScript compiler doesn''t generate an empty constructor for you.


    What happens if you don''t want any constructors at all for a class, such as when
    you want to generate a class with static members? It doesn''t make sense for the
    class to be created as an instance type, so you can specify an empty constructor
    with the private attribute. In this case, the class cannot be created outside
    the class, but any static member within the class can create an instance and return
    that to the program. The following example includes class declarations that use
    default constructors, custom constructors, and private constructors:'
