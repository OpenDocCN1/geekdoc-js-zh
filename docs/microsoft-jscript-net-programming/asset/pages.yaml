    \ case you follow it with a semicolon. Or it can return some value of the same\
    \ type as the return value declared for the function. So far in this chapter,\
    \ all our functions are of type void, so this hasn't been an issue. The following\
    \ code snippet makes use of the return statement for exiting the function early\
    \ and returning a value:\n\n```\nimport System;\n\nclass Sample {\n    function\
    \ ReturnBeforeDone() : void {\n        Console.WriteLine(\"Beginning\");\n   \
    \     return;\n        Console.WriteLine(\"I'm never called\");\n    }\n\n   \
    \ function ReturnString() : String {\n        return \"Hello World\";\n    }\n\
    }\n```\n\nFor any void function, JScript assumes a return statement at the end\
    \ of the code block, so you don't have to explicitly include one. This is a nice\
    \ thing the compiler does to limit the amount of code you have to write.\n\n#\
    \ Rules for Overloading Methods\n\nMethod overloading is likely to be your best\
    \ friend when you program in JScript .NET. It allows you to use different sets\
    \ of parameters for the same function and perform either the same action or different\
    \ actions, based on those variables. You need to keep in mind two considerations\
    \ when overloading a function: You must obey the rules of method overloading and\
    \ you need to understand the rules JScript uses for overload resolution."
