    # Using CLR-Style Arrays


    A CLR-style array has bounds and a definite length, so it can be expanded and
    shrunk upon-the-fly. This type of array is also strictly typed, meaning you get
    both compiler and runtime errors for performing incorrect assignments. Every element
    that comes out of a CLR-style array is of a specific type, so you don''t have
    to check for types before casting. The following example creates a CLR-style array
    of String objects in JavaScript .NET. The type is a null array type, and the new
    keyword is used with a bounded array to fully initialize the variable:


    ```

    var _CLRArray[] = new String[10];

    ```


    ```

    // We have a new Array of Strings with 10 elements

    CLRArray[0] = "Hello";

    CLRArray[9] = "World";

    CLRArray[10] = "Produces an error"; // IndexOutOfRangeException

    ```


    This array is normally typed to String objects. If you want to assign any type
    of variable (for example, an integer), the object in question is cast to a String
    object or you will get an InvalidCast error when assigning values to a String.
    This can cause very unexpected results. To get an error by assigning an incorrect
    type, you need to change to another type of array. For example, you could use
    an array of Int32 objects, such as the following:


