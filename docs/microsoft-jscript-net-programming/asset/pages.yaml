  md: '# Appendix A


    The JScript .NET compiler has a few options that can aid in various programming
    tasks.

    Many of these options are discussed in depth in Chapter 9, "JScript .NET Compiler
    Features,"but for those who need a refresher, a quick reference is provided here.
    This is the basic command-line syntax for the JScript .NET compiler:


    ```

    jsc.exe /t:{target option} /r:{references} [options] <source files>

    ```


    Not every program will require a target to be specified and some references be
    specified, because the JScript compiler will automatically set some defaults for
    you. For instance, the default target is a console executable. If you don''t specify
    any reference lines and you don''t turn on the autoref functionality then the
    required assembly references will be automatically generated by the compiler.
    Table A.1 lists additional command-line options and features.


    # Table A.1 JScript .NET Compiler Options Guide


    | Option | Description |

    | --- | --- |

    | /out:<target file> | The name of the target assembly that the JScript .NET compiler
    will generate. This is generally a file ending in the .exe or .dll extension.
    |

    | /target:exe /t:exe | Specifies that the compiler should generate a console executable.
    Console executables are launched with an attached console that can be read from
    and written to using the System.Console class. |

    | /target:winexe /t:winexe | Specifies that the compiler should generate a windows
    executable. The application will launch without a console window, and the application
    should generate its own UI or simply remain hidden. |

    | /target:library /t:library | Specifies that the compiler should generate a library
    assembly. A library is generally used to hold commonly used code. Libraries can
    be used as references in other applications. |

    | /reference:<assembly>/r:<assembly> | The compiler will reference types and metadata
    from the referenced assembly. |

    | /lib:<path> | Specifies alternative library paths that the compiler can find
    referenced assemblies. This is often used to change version of an assembly is
    being referenced by changing the directory in which the assemblies are found.
    |

    | /autoref[+,-] | Can be turned either off or on, and is by default. The autoref
    instructs the compiler to try to automatically reference assemblies based on the
    import statements used in the source code. |'
