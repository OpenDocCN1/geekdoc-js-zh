  md: 'We''ll wrap up this chapter by talking about the finally block in more detail
    because it''s truly

    one of the most beneficial constructs to use, especially for purposes of resource
    management.


    # Wrapping Code with try and catch


    Exceptions are always enabled while programs are running. Any exceptions that
    aren''t caught

    by a program result in a dialog box alerting the user about the error or the program
    qui-

    etly dying. You can wrap the try...catch...finally statement around any code that
    might

    throw an exception to make sure you handle these exceptions and perform some appropriate
    action

    tso the user never has to detect that the program isn working correctly. You can
    use the

    try...catch...finally statement for a matter of other purposes as well.


    # The Purpose of try...catch...finally Blocks


    try...catch...finally blocks are generally used so that a program can detect error
    condii-

    tions are thrown from library code that is executing. Library code is generally
    a black box:

    You simply don''t know what is going inside the code, but more often than not,
    know

    the code you''re calling throws certain exceptions based on error conditions.
    These error

    conditions, for example, could state that parameters are invalid. They could also
    indicate that

    some resource required by the library function, such as a database or network
    connection, was

    unavailable.


    Another purpose of the try...catch...finally blocks is to allow the system to
    alert the pro-

    gram above resource issues. Many library functions provided by the CLR acquire
    system

    resources for the program (for example, database connections, file handles, and
    memory).

    Exception blocks are extremely crucial when working with system resources because

    enable a program to detect the absence of some resource the program needs without
    crashing.


    Users create exceptions to handle they work with a program, insert bogus or inaccurate

    data, or use the program in a manner for which it was not programmed. Most programs
    allow

    for some user input, whether through the console, through a graphical user interface
    (GUI), or

    via input from a file or network stream. Users are notorious for providing bad
    data, such as an

    invalid number, one value when the program is looking for, or that for some other

    reason can''t be parsed by the program. Exception handling is crucial because
    many data

    types throw catch exceptions, format exceptions, or null reference exceptions
    if the data isn''t

    the expected format. Class of error is extremely difficult to handle appropriately,
    and it is a

    prime candidate for a good error reporting and logging structure, which we''ll
    talk about later

    in this section.


