  md: '# Chapter 12


    After a match occurs, the properties are updated with the results of that match.
    If one match succeeds and another fails, the RegExp isn''t updated; it always
    contains the information for the last successful pattern match.


    Exactly what type of information does it contain? Most important, it contains
    the last subpattern matches. That makes the RegExp object perfect for pulling
    subexpression results and matches that can be used elsewhere in your program.
    It also contains information about where the match begins in the string via the
    index property and where it left off in the string lastIndex. The index and lastIndex
    properties are useful for determining where the next pattern match will pick up
    if the engine flag of g was used in the match.


    The global RegExp object contains all the information about the string associated
    with the match. The input property is a copy of the input to the match function.
    So anything in the string that isn''t in the match occurs before the match will
    appear in this variable. In turn, the rightContext property displays any text
    that is to the right side of the match but not included in the match. The string
    that matched can always be retrieved from the lastMatch property. And although
    I don''t know why it exists, there is also a way to get the subpattern match by
    using the lastParen property.


    > TIP

    As there are fewer than nine subpattern matches in the regular expression, it''s
    probably best to use the test method and examine the RegExp object to examine
    the results of any subpatterns or return values.


    I mentioned before that the last nine subpattern matches were available using
    the $1 and $9 properties. However, this won''t work if the source is compiled
