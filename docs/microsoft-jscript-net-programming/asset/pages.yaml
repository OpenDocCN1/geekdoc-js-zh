  md: '# Chapter 11


    Listing 11.1 loads five different XmlDocument objects with the contents of the
    11-1.xml file. As you can see, this is pretty easy. How much harder is it to use
    the XmlTextReader class?


    The XmlTextReader class is a bit easier to initialize than the XmlDocument class
    because its constructors enable immediate initialization of the class without
    having to call port methods as the Load and LoadXml methods of the XmlDocument
    class. These constructors allow you to initialize the XmlTextReader with a single
    line of code. These of these constructors, the Stream, String, and TextReader
    versions, should suit the requirements of a majority of programs. The following
    list examines each of these three constructors (see Figure 11.3):


    +   * The Stream overload takes a FileStream or NetworkStream class, similar to
    the XmlDocument class.


    +   * The String overload takes a uniform resource locator (URL) to the XML document.
    This URL can be either a file URL or an Internet URL, in which case the document
    is downloaded from a Web server over the Internet.


    +   * A TextReader class can also be supplied, in which case a StreamReader class
    can be used to load the content in question.


    These are the most basic of the XmlTextReader overloads. The rest of the XmlTextReader
    constructors are quite complex, and you use them when you need a high degree of
    control over the XML content loaded.


    The following example shows how easy it is to load XML content into an XmlTextReader
    class:


    ```

    import System;

    import System.IO;

    import System.Xml;


    // Using the XML from Code Listing 11.1 as a File URL

    var xt1:XmlTextReader = new XmlTextReader("11-1.xml");


    // Using an Internet URL

    var xt2:XmlTextReader = new XmlTextReader("http://www.some.org/some.xml");


    // Using the Stream overload

    var fs1:FileStream = File.Open("11-1.xml", FileMode.Open);

    var xt3:XmlTextReader = new XmlTextReader(fs1);

    fs1.Close();


    // Using the TextReader overload

    var sr1:StreamReader = new StreamReader("11-1.xml");

    var xt4:XmlTextReader = new XmlTextReader(sr1);

    sr1.Close();

    ```'
