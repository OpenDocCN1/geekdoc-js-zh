  md: '# Versioning Attributes


    We''ve mentioned a couple of areas in which assembly-level attributes might be
    used, but the most prominent is probably the versioning attribute. Version attributes
    affect the special version page you see when you right-click an assembly in the
    Windows Explorer and click the Version tab. Some of the types of information provided
    are the assembly, a description, a title, any copyright information, and version
    information.


    The important attributes for our discussion are the AssemblyCompanyAttribute,
    the AssemblyCopyrightAttribute, the AssemblyDescriptionAttribute, the AssemblyFileVersionAttribute,
    the AssemblyProductAttribute, the AssemblyTitleAttribute, the AssemblyTrademarkAttribute,
    and the AssemblyVersionAttribute. That is a long list, so you''ll probably want
    to create some sort of template file that contains each of these items so you
    can copy them from projects. I''ve included one template file with the media for
    this book, or you can type them from Listing 9.4.


    # LISTING 9.4 Assembly Version Attributes


    ```

    import System;

    import System.Reflection;


    [assembly: AssemblyCompanyAttribute("DigiTec Web Consultants")

    [assembly: AssemblyCopyrightAttribute("Copyright DigiTec Web Consultants 2001")

    [assembly: AssemblyDescriptionAttribute("A Super Utility")

    [assembly: AssemblyFileVersionAttribute("1.0.*")

    [assembly: AssemblyProductAttribute("Super Utility")

    [assembly: AssemblyTitleAttribute("Super Utility")

    [assembly: AssemblyTrademarkAttribute("Trademark DigiTec Web Consultants 2001")

    [assembly: AssemblyVersionAttribute("1.0.**")]

    ```


    # Strongly Naming Your Assembly Using Attributes


    Another feature of the assembly-level attribute is the capability to attach a
    name to your assembly. After this is done, you can ensure that someone can''t
    delete your assembly, rename one of them, and stick it in place and expect it
    to work. You can actually specify that you want your assembly with your special
    name, and the CLR looks only for that assembly.'
  merge: -1
