    # Boolean Operators


    The Boolean operators are simple yet important when used with the comparison operators
    discussed in this chapter. Whenever you need to use the results of more than one
    comparison in a complex statement, you need to combine all the comparison statements
    with one or more of the Boolean operators.


    For example, you can use Boolean operators to check user input. As the user is
    inputting commands at the console, you might have to check these commands and
    map them to functions within an application. The q, quit, and a number of other
    commands might all map to the shutdown procedures for the application. The Boolean
    OR operator (||) returns true if any of the statements are true, and the Boolean
    AND operator (&&) returns true if all the statements are true. The Boolean negation
    operator (!) negates the result of a Boolean expression. All this can seem confusing,
    so Listing 4.8 shows an example of how to use Boolean operators.


