  md: '# JScript .NET Compiler Features


    With your compiler throwing warnings for code fragments that aren''t well defined
    or that don''t perform well, you''ll have a way to specify that the compiler flags
    the warnings as errors and prevent the build step so that you can go back and
    fix these code deficiencies. The /warnerror option is a flag that allows you to
    turn warnings messages into errors. The default for this value is off because
    most warnings won''t actually affect the operation of your code. When you turn
    this option on, the most basic of warnings become errors that stop compilation,
    and you''ll have to either fix the warning to finish compiling or turn the option
    back off.


    # CAUTION


    Depending on what warning level is set when you turn on the warnerror option,
    you might not be able to fix everything the compiler is reporting. An example
    of this paradox is when you are casting a base class to a subclass in your code
    because you know the code actually returns an instance of the subclass. The compiler
    labels this with a Level 1 warning because it knows the cast might fail at runtime,
    and there''s nothing you can do to the code to prevent the compiler from emitting
    the warning.


    In addition to turning errors, you can raise the level of reported warnings using
    the /warn or /w option. All warnings fall into levels that detail their severity.
    Level 0 is the most severe type of warning, whereas a Level 4 warning is most
    insignificant. By default, the warning level is set to 0; however, you can change
    this to Level 4 so that the compiler returns warnings during compilation step
    so you can see what types of issues your code is creating. The following code
    demonstrates how to turn warnings into errors, and how to set the warning level
    that the compiler emits during compilation:


