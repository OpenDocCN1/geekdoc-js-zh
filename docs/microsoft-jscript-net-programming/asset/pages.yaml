  md: '# Chapter 5


    # Loop Statements


    You loop statements in code when an action has to be performed multiple times
    or when an action needs to be performed until a special condition is met (for
    example, printing out 30 random characters, assigning initial values to every
    element in an array, looping while the user is inputting data). With any program
    flow element, there are always mechanisms to break out of the loop so that the
    program can continue its duties.


    This section discusses three types of looping structures:


    +   * The for is the most powerful of the loop structures and can be used in place
    of the others.


    +   * The while loop is a bit more specialized than the for. It is used to test
    a condition at the beginning of each loop.


    +   * The do...while construct can be used to test a condition at the end of the
    loop.


    # Incremental Looping with for


    The most common use of the for statement is to iterate a piece of code given number
    of times. This can be useful for plotting pixels on the screen for a game, operating
    on each element of an array, or calling a recursive function such as a factorial.
    The for statement can be broken down into parts:


    The first part of the for statement is the initialization statement, which initializes
    any variables that will be used in the looping process. The parts of this statement
    are separated by a comma, and the entire statement ends with a semicolon. The
    initialization statement can''t get complex, but you can use it to declare multiple
    variables of different data types. The following is an example of an initialization
    statement:


    ```

    for(var i:int = 0; ... ...) {

    for(var i:int = 0, j:String = "Even"; ; ...) {

    ```


    The second part of the for statement is the comparison. While this statement is
    true, the loop continues to run. This statement can be as complex or as simple
    as needed. Generally, you while the value is less than some predefined limit,
    but in the case of enumeration or unbounded access, you may be looking for other
    values, such as null or another empty type. The following is an example of the
    comparison part of a for statement:


    ```

    for(var i:int = 0; i < 11; ...) {

    for(var i:int = 0, j:String = "Even"; i < 11; ...) {

    ```'
