  md: 'Another set of methods is used to actually gain access to the contents of the
    file. These include the Create, CreateText, Open, OpenRead, OpenText, and OpenWrite
    methods. Notice that the File object has special methods for gaining access to
    Text files. This just goes to show some of the more common operations on files
