  md: "# Where and When to Use break\n\nThe switch statement is where you are most\
    \ likely to use the break statement, but if you're in a complex loop and you've\
    \ determined that you don't need to do any more work, you can always break out\
    \ of the loop and continue with the rest of the program. An example of this would\
    \ be drawing a line on the screen for a graphics program. Again, the screen is\
    \ 400x400 pixels, and you're drawing a horizontal line, so only the x value is\
    \ important. Therefore, you set the start pixel and begin working towards the\
    \ end pixel. However, you need to test when you've reached the end of the screen\
    \ so you don't draw a pixel off the edge. The loop could continue going after\
    \ the first pixel is determined to be lost, but it would be smarter to exit the\
    \ loop, by using the break statement, as shown in Listing 5.9.\n\n# LISTING 5.9\
    \ Using break to Optimize a Loop\n\n```\nimport System;\nimport System.Drawing;\n\
    \n// We are going to use some special code from System.Drawing\nvar p:Point =\
    \ new Point(200,0);\nvar i:int = 400; // Length of our line\nvar s:Rectangle =\
    \ new Rectangle(0,0,400,400);\n\nvar i:int;\n\n// Test\nfor(i = 0; i < 1; i++,\
    \ p.X++) {\n    if (is.Contains(p)) {\n        Console.WriteLine(\"Stop Drawing\
    \ at \" + i + \nto the screen at \" + p.ToString());\n        break;\n    }\n\
    }\n```\n\n>5-9\nStop Drawing at point 200 to the screen at {X=400,Y=0}\n\n# Using\
    \ Labels for More Flow Control\n\nThe break and continue statements give you control\
    \ over the loop structures and the ability to greatly increase your programs'\
    \ performance. But what happens when continue and break simply can't do the actions\
    \ you want them to? In many instances nested control structures greatly increase\
    \ the complexity of a program and make it hard to use the continue and break statements.\
    \ This is where labeling the flow statements comes in handy."
  merge: -1
  pgno: 119
- img_proc: false
  md: "In JSScript, any statement can be labeled, but you really can't do much with\
    \ the labels. Most languages have a goto or jump statement that you can use to\
    \ bounce from label to label, but JSScript doesn't have one. JavaScript does have\
    \ the continue and break statements, both of which obey properly labeled statements.\n\
    \nNormally, both the break and the continue statements exit the loop structure\
    \ that last entered. If you have two nested loops, break from the first loop only;\
    \ the second loop continues, and it is likely to call back to the loop in which\
    \ is nested. To defeat this, you label the outer statement so you can break out\
    \ of the entire set of loops, rather than just the inner loop. Normally, the following\
    \ code would print 12 values:\n\n```\nimport System;\n\nOuter:\nfor(var i = 0;\
    \ i < 3; i++) {\n    Console.WriteLine(i);\n    Inner:\n    for(var j = 0; j <\
    \ 3; j++) {\n        Console.WriteLine(j);\n        break Outer;\n    }\n}\n∅\n\
    ```\n\nBreaking out of the inner loop would still mean printing 6 values. However,\
    \ because you are exiting the entire loop structure by explicitly breaking out\
    \ of the outer for loop, you only print 2 of the 12 values.\n\n> CAUTION\nI can't\
    \ emphasize this point enough: Using labels with the continue and break statements\
    \ is a really poor programming practice. If you can use extra variables to control\
    \ the behavior of the loops rather than use these statements, do it.\n\n# Summary\n\
    \nIn this chapter you have learned about the conditional statements—including\
    \ the if, if...else, if...else if...else, and switch...case statements, as well\
    \ as the ternary operator—which allow branching in a program."
  merge: -1
