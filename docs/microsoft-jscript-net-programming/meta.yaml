  md: '# Chapter 6


    In this chapter you will learn about all class definitions, constructors, modifiers,
    and attributes.

    You''ll learn about the body of the class in Chapter 7, "Interfaces and Class
    Members," so if you''re looking for information on properties, methods, and fields,
    skip ahead to Chapter 7.


    This chapter begins with an overview of classes. You''ll learn what makes up a
    class, and then you''ll learn about class attributes, including the visibility
    attributes and the new .NET metadata attributes.


    This chapter discusses inheritance and subclassing, using both base classes and
    interfaces. It also covers encapsulation, which you can often use in place of
    subclassing to achieve nearly the same results. The chapter ends with a discussion
    on defining and declaring class structures, overriding, and calling base constructors.


    # An Overview of Classes


    A class is a logical storage container in JavaScript .NET and object-oriented
    programming. Every class maintains a series of private data and a unique set of
    methods for manipulating that data. Every class needs to be defined in code, using
    class declaration syntax. Class declarations can appear only in special places
    in code:


    +   - You can place a class declaration at the global level, outside any package,
    in which case it is an assembly-scoped class without a namespace.

    - You can declare a class declaration within a package block, which simply gives
    the class a more fully qualified name and class name. If you declare a class at
    this level, you need to either fully qualify the namespace and class name, or
    you need to import the namespace at the top of the file.

    - You can place classes within other classes. Classes at this level have special
    properties, which we''ll talk about later in this section.


    # A Simple Class Declaration


    Class declarations always look more complex than they really are. At the simplest
    level, you can declare a class by prefixing the class keyword to the class name
    and then beginning the class member block.


    ```

    [Attributes] class Name [[extends base class],

    -[implements interfaces, ...]] {

    ...Code Block...

    }

    ```


    Inside the class member block, members of the class are defined, functions are
    declared, and constructors are written. As discussed earlier in the chapter, classes
    might appear'
  merge: -1
  pgno: 124
- img_proc: false
  md: 'inside this block. In the following, JScript automatically assumes the public
    visibility attribute, as it does with all classes, interfaces, and their member
    declarations:


    ```

    class SimpleClass {

    }

    ```


    The rest of the attributes are discussed later in this chapter, in the section
    “Class and Member Attributes.” The keywords extends and implements are used to
    specify a base class and any interfaces for the class. This is discussed in this
    chapter as well, in the section “Inheritance and Subclassing.”


    # What a Class Can Contain


    Classes can contain a few different constructs, including the following:


    +   - Fields and properties are used to access data.

    - Functions can be called to have the class perform some work.

    - Event handlers (a fancy name for functions) can be defined and attached to events
    on other objects to receive event notifications.

    - Constructors can provide extra information to the class at creation time.

    - Classes sometimes contain other classes, and this can be confusing.


    Classes and constructors are discussed in this chapter, and the rest of the components
    of a class are discussed in Chapter 7.


    # Class and Member Attributes


    Class attributes are used to affect the behavior, visibility, and metadata of
    a class. Some of these attributes, which we''ll be discussing in this chapter,
    are defined by the JScript .NET language. Other attributes are defined by the
    common language runtime (CLR) and persist as metadata instead of modifying the
    definition of the class. The following sections discuss these attributes:


    +   - Visibility attributes—Visibility attributes are capable of controlling the
    types of code that can access the method or class in question. Visibility can
    make classes or members entirely inaccessible, accessible only to a select number
    of other classes, or completely visible to all other code.

    - Behavior attributes—Behavior attributes are capable of affecting how classes
    or members can be used in code. In JScript .NET, they are also capable of enabling
    special language features.'
