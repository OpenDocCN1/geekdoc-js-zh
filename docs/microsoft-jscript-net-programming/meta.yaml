  md: '# Chapter 2


    # Assemblies, Executables, and Libraries


    All code, whether an executable or a module, is stored in assemblies. These assemblies
    contain versioning information, entry points, special metadata, and, of course
    all the classes and code you''ve created. An assembly may span more than one logical
    disk file. Of these files, one must contain an assembly manifest that, in turn,
    names each of the other modules. The assembly can, of course, be in the form of
    an executable or a dynamic link library (DLL).


    > The metadata stored in an assembly won''t be discussed in great detail anywhere
    in this book. Any member, class, or assembly attributes and modifiers will be
    stored as metadata. Debug information and symbols are stored well.


    # Creating Assemblies for Code Access


    All code is compiled into an assembly. Both executables and libraries can contain
    identical items with the addition of an entry point being defined for an executable.
    All related code should be contained within the same assembly; a namespace defines
    code logically, whereas an assembly defines its physical location. When using
    code from other assemblies, you have to reference those assemblies at compile
    time. Earlier in this chapter, you saw the import statement, which directs the
    compiler to import a given namespace so that the shortened type name can be used.
    In addition to this, the actual assembly that contains the classes you used must
    be imported on the command line.


    The following example shows the syntax for importing an assembly. You''ll notice
    that it is referencing the System.dll assembly. If you use any of the types available
    in System.dll and don''t include it on the reference line, the compiler will throw
    an error because it can''t find the classes you are trying to use.


    ```

    jsx.exe /t:exe:/System.dll somecode

    ```


    # Structure of an Executable Assembly


    Several steps are required in writing the code necessary for the JScript .NET
    compiler to create an executable assembly. You might not require each of these
    three items for every executable, but these are the items that are generally required.


    +   - To define any classes or interfaces that are necessary to program operation

    - To import any additional namespaces that will be used

    - To provide some global code that will get the application started'
