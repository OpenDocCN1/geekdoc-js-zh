  md: "of the object in question and provide your own methods as wrappers around the\
    \ object's\\methods. This enables you to perform some custom logic.\n\n# Extending\
    \ Classes\n\nIn Script .NET you use the extends keyword to provide a single class\
    \ name to the decla-\ration a class. Extending a class allows you to provide new\
    \ functionality for existing\\classes, inherit basic functionality into multiple\
    \ derived objects, or even to specify some\ncontract between derived classes so\
    \ that code that works with the base class also works\nwith the derived classes.\
    \ Extending a base class allows the new derived class to perform in\nthree different\
    \ situations:\n\n+   * It can be used to provide some implementation for a defined\
    \ but not implemented\nmethod.\n* It can provide new functionality for an existing\
    \ method.\n* It can implement new methods with different names.\n\nEarlier in\
    \ this chapter, we discussed the abstract attribute that forces you to subclass\
    \ another\nclass before it can be used. When the abstract attribute is specified\
    \ at the class level, that\nclass cannot be instantiated. Therefore you are forced\
    \ to derive a class and implement all the\nmethods and properties of the class.\
    \ In this way, the base class acts only as a contract (that is, it\nacts like\
    \ an interface that defines the definitions for methods and properties yet doesn't\
    \ provide\nthe implementation) between the derived class and any code that uses\
    \ the base class, and it\nexpects the derived class to operate accordingly.\n\n\
    You can also override some common functionality of a base class and provide some\
    \ new func-\tionality. This is a fairly common practice, and new methods are often\
    \ created for some process\nformed by the base class, then you derive a new class\
    \ by inheriting all the other methods\nof the base class, and then you override\
    \ the method where a new process has been found\nand implement that. This is versioning\
    \ at its finest because the base class is left\\unchanged and the new class can\
    \ in place of the base class with its functionality.\n\nIf you want to use a base\
    \ class by older programs, you can inherit the base class, but you allow\nnewer\
    \ programs to use some of the additional methods you supply. In this manner, you\
    \ extend\nthe existing contract by adding new methods and properties. Any classes\
    \ that are in turn\nderived from your class will inherit this enhanced contract.\
    \ This is another form of ver-\\sion because the new class can still be used in\
    \ place of the base class in programs that you\nknow about the base class for\
    \ the class. The following example demonstrates the use of\nabstract classes and\
    \ methods, as well as how to override base class methods and do method\ninitance:"
