  md: '# Chapter 3


    # Providing Initial Values for Variables


    You can initialize variables with default values. You might want to do this to
    ensure that you have some working values before the code starts operating on them.
    You can also see some of the compiler errors by creating some initialization expressions
    where the type of initializing value is of a different type than the variable
    to which value is assigned. For example, the following example assigns the string
    constant "Hello" to StringVar and the value 10 to IntVar.


    ```

    import System;

    import System.Collections;


    // Valid Initializers

    var StringVar:String = "Hello";nvar IntVar:Int32 = 10;

    var HashVar:Hashtable = new Hashtable();


    // Tricky Initializers

    var String2Var:String = 23;

    var Int2Var:Int32 = "27";n

    // Invalid initializers

    var IntVar:Int32 = "Hello";

    ```


    The new keyword creates a instance of a hashtable. The next assignment is rather
    tricky—it assigns a numeric value to String2Var. You would think this would result
    in a compiler error, but JavaScript compiler convert the numeric value 23 to the
    string constant "23". Furthermore, the Int2Var contains a numeric value. The next
    code initializers throw some errors because you can''t assign a string constant
    that cannot be parsed as a number into a numeric variable. Notice that the example
    does not provide invalid syntax for assigning initializer values to a String object
    because any type or value can be converted to a string to be assigned to the String
    object. We''ll discuss this in the section "Using the String Object," later in
    this chapter.


    > Every object in the .NET framework supports ToString(), which returns the string
    representation of an object (which can be a name, a serialized version of the
    object, or any other textual representation). Therefore, assigning any value or
    object to a String object does not throw an error in JavaScript converts any object
    or initializer values into string before continuing. Note that this can cause
    strange values to be assigned to string variables and sometimes cause code to
    go down a code path you wouldn''t normally expect.'
