  md: '# Chapter 3


    This chapter discusses the declaration of variables in JavaScript .NET, the correlation
    of variables with common language runtime (CLR) types, and how the compiler makes
    intelligent decisions between legacy JScript semantics and performance-oriented
    JScript .NET semantics.


    The discussion in this chapter moves from the new data syntax used in JavaScript
    .NET straight to the base language datatypes. A thorough exploration of strongly
    typed variables is followed by an exploration of how to create arrays. Both the
    JavaScript style array and the new CLR-style array are discussed. The only other
    remaining datatype of importance is the string. Strings are the basis for the
    majority of programs.


    # Strongly Typing in JavaScript .NET


    Strongly typed variables allow the JavaScript .NET compiler to use appropriately
    sized internal structures during operations. Typed data doesn''t have to be converted
    to from different datatypes when basic operations and assignments occur. It always
    occupies the appropriate amount of memory for its size, allowing the developer
    to optimize for size and use smaller datatypes when appropriate. Furthermore,
    it allows the compiler to remove checks that were once required when the same
    variable could be one point string and at another point integer.


    # How to Strongly Type Variables


    So do you want to take advantage of these new improvements in JavaScript .NET?
    You declare variables to give them scope and type you variables so that the compiler
    uses the optimized operations and removes the checks during runtime. You declare
    all variables by using the var keyword. Any additional access modifiers needed
    to complete the declaration can precede the var keyword. An additional modifier,
    a custom attribute, can also be applied (both access modifiers and attributes
    are discussed in Chapter 6, "Creating Classes”). The following example demonstrates
    how to declare a nontyped variable named UnknownVar:


    ```

    // Untyped variable declaration in Global Code

    var UnknownVar;

    ```


    > For a complete explanation of the access modifiers and custom attributes, you
    can jump to Chapter 6, which discusses class members. The following are some of
    the important modifiers you can learn more about in Chapter 6:

    - The public keyword makes variables available outside the current scope does
    not make the variable global.'
