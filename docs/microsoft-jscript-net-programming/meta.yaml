  md: "# Enumerations and the for...Loop\n\nIn an enumeration loop, the program enumerates\
    \ through all the elements in a collection or an array. Enumerations are a strange\
    \ topic in JScript .NET there are many ways of dealing with them. For instance,\
    \ you can create a special object to enumerate over all the objects in a collection,\
    \ you can use the for...statement to do the same thing with a slightly different\
    \ structure, and you can revert to the CLR methods and interfaces instead. We'll\
    \ start by examining the JScript .NET Enumerator object.\n\nYou can generally\
    \ accomplish enumeration using existing looping structures, if you know the interfaces.\n\
    \n# Creating an Enumerator Object\n\nUsing the JScript .NET Enumerator object\
    \ is usually the best way to enumerate over a collection of objects. (This is\
    \ because it's in the JScript language for some time, and many developers are\
    \ accustomed to using it.) You create an Enumerator object by passing the collection\
    \ to be enumerated in the constructor. You can then use a while loop or a for\
    \ loop to iterate through the enumeration until it reaches the end. Let's use\
    \ the for statement to get a good idea of what is going on. Listing 5.3 uses the\
    \ results of Environment.GetCommandLineArgs as input to the Enumerator object.\n\
    \nListing 5.3 Using an Enumerator on a String Array\n\n```\nimport\nvar e = new\
    \ Enumerator(Environment.GetCommandLineArgs());\n!e.atEnd(); {\n  e.moveNext();\n\
    \  Console.WriteLine(e.item);\n}\n```\n\nAs mentioned earlier, Listing 5.3 creates\
    \ a new Enumerator object by passing in the results of the CommandLineArgs method,\
    \ which is a string array. This is the initialization statement of the for loop.\
    \ Next, the listing makes sure the e.atEnd is false because you want to leave\
    \ the loop as soon as the program reaches the end of the Enumerator object. The\
    \ iteration statement is set up to move the Enumerator object to the next item\
    \ through the loop. Without this, the program would never reach the end, and would\
    \ keep enumerating the object over and over. Finally, in the code block you use\
    \ the e.item method to return the object"
