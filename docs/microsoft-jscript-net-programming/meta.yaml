  md: '# Chapter 3


    assume there is only one String object and that it has two sets of functionality
    that happen to overlap in certain areas. Where functionality overlaps, we''ll
    be using the CLR versions because they map directly to the underlying object and
    should be a bit quicker than the JavaScript versions.


    # String Manipulation


    The String object hosts a few methods for manipulating existing strings, creating
    new strings, and performing a few search-and-replace functions for string parsing.
    At this point, note that any modification to a String object results in a new
    String object being created because all String objects are immutable and thread
    safe. You will never run into work on a String object and have it change on you.


    All the string manipulation functions can be grouped into several categories:


    +   - The JavaScript set of functions—These are functions that retain their meanings
    from JavaScript and still exist as part of the JavaScript language.

    - The instance methods of the String object—These are methods you can call when
    you have an existing String object and want to perform some operations on it.

    - The static String methods—These methods accept parameters and return a new string
    as a result.


    Each of the following sections provide short descriptions of these functions and
    a brief example. Some of the examples include output, but in most you should run
    the code to see the results.


    # JavaScript Functions and Properties


    Each of the functions and properties described in this section exists for compatibility
    with legacy JavaScript code. The only nonlocal property is the length property,
    which provides the length of the string, in characters. All the old JavaScript
    functions that operate on the String object exist in JavaScript .NET. This can
    be somewhat strange because in these cases they were used using Hypertext Markup
    Language (HTML) and return an HTML string result. The following functions are
    some of the commonly used HTML methods of the String object:


    +   - anchor—The anchor method surrounds the current string with an <anchor> tag
    and returns the result as a new string. The string parameter passed to the anchor
    method becomes the value of the name attribute.

    - big—The big method surrounds the current string with a <big> tag, which increases
    the size of the string in HTML by one font and returns the result as a new string.'
