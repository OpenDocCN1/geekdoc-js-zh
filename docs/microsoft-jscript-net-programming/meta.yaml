  md: '# Chapter 1


    This chapter will serve as a platform for you to decide which chapters of the
    book are suitable for you. Some of you are probably beginning programmers who
    are somewhat proficient in JavaScript or JavaScript, and others are advanced programmers
    proficient in another .NET language or object-oriented language. This chapter
    provides a migration path from JavaScript to .NET and explains some of the history
    behind it. It covers coding conventions and explains each of the appendices, which
    will be extremely important to getting the various samples compiled and for experimentation
    with the samples beyond what is provided in the book. Let''s begin by covering
    the history and development of JavaScript .NET.


    # Development of JavaScript .NET


    JavaScript began as a language that worked within a Web browser through scripted
    code in an HTML page. Because of this, JavaScript had a familiar syntax that Java
    users could quickly pick up and offer many of the object-oriented techniques available
    to the Java language. In addition to providing the basic Java-style types and
    language constructs, JavaScript also provided a Document Object Model (DOM) to
    access various portions of the Page. At this point developer could write code
    that interacted with the user on a Web page, and also updated or verified portions
    of the content. The effect was mostly limited to changing images on the page,
    in the case of mouseovers, or verifying content so that preliminary data checking
    could happen on the client rather than bogging the Web server and the user''s
    Internet.


    Of the many features that came out of the first versions of JavaScript, the missing
    portion remained the ability to update the page dynamically. Dynamic page updating
    is the ability to add new content and affect the flow and rendering of the current
    document while the user is viewing the page. The new version of the DOM was not
    really an extension to JavaScript itself, but a collection of objects with which
    JavaScript could interact to dynamically modify content on a page. With this DOM
    version came a type of HTML known as DHTML, or Dynamic HTML, which enabled JavaScript
    to fully modify the objects, flow of text elements, even moving objects around
    the page. This new freedom to modify the document when the user interacted or
    viewed the page was a well-received concept, leading to a new level of page-based
    JavaScripts. This included dynamic menus, addition or revealing of content, and
    the ability to create forms that could create or remove fields as needed on the
    fly.


    While developing the DOM and HTML implementations, Microsoft began to develop
    several extensions to their version of the JavaScript language. They added several
    objects, such as the Dictionary, that similar to Java''s Hashtable, and the FileSystemObject
    (a COM object used by scripting languages to access the files and directories)
    that could access files. At this point the language was usable in both client
    and server environments and was released under'
  merge: -1
  pgno: 16
- img_proc: false
  md: '# Introduction to JavaScript .NET


    the name JavaScript after the traditional JavaScript. They also made their scripting
    engines available to other consumers on the machine, rather than just the Web
    browser.

    The most notable of these consumers was the Windows Scripting Host, which expanded
    JavaScript from the IE platform to the PC administration and task platform. Now
    users could use small JavaScript programs to make modifications to handle rudimentary
    tasks that batch files once performed. JavaScript became a processing language
    and gained again access to a much more powerful object model. Windows Scripting
    Host introduced several new objects for the FileSystemObject. Here it could be
    used for maintaining files, writing logs, and backing up directories on the machine
    when used as an administration tool. In its most recent edition, WSH has gained
    several added capabilities from the WMI (Windows Management Instrumentation) interfaces.
    Scripts are able to access Active Directory information, machine information that
    was previously available only through API calls, and even make modifications to
    information on other machines in the same or another trusted network. Future versions
    will add even more benefits while making additional scripting languages available
    to the programmer.


    To answer many of the concerns behind the limitations of the JavaScript language,
    Microsoft has made continual advancements in their implementation. Most JavaScript
    5.1 and 5.5 were released. Recent enhancements include the introduction of regular
    expressions for textual parsing and verification, and additions to the Array type
    that make it act like a normal array, a stack, or a numerically indexed hash (sparse
    array). Conditional compilation was added some time ago, but doesn''t come in
    extremely hard unless you''re writing scripts that constantly access a variety
    of platforms. The enumeration form (for...in) of the for loop comes extremely
    hard when enumerating properties or items in an array when you don''t care about
    modifying or maintaining an index. Finally, with version 3.0, Microsoft made JavaScript
    ECMAScript-compliant. ECMAScript is the Web-based scripting language supported
    by the ECMA-262 specification. Any version later than 3.0 of the JavaScript implementation
    remains ECMAScript compliant while still adding levels of functionality. To end
    this discussion of the JavaScript language''s history, note that both JavaScript
    and Java developed to be fully object-oriented. Both languages allow for the creation
    and use of objects, but in an abstract way. The object-oriented functionality
    makes a sure candidate to become a Common Language Runtime (CLR)-compliant language.


    # Enter JavaScript .NET


    The next step in JavaScript''s development is a fully compiled JavaScript based
    on Microsoft''s new Common Language Runtime (CLR). Known as JavaScript .NET, it
    is both compatible with the specifications required to be a CLR-compliant language
    (which means it has notions of classes and inheritance), as well as fully backward-compatible
    with the JavaScript language as it stands.


    INTRODUCTION TO JAVSCRIPT .NET'
  merge: -1
