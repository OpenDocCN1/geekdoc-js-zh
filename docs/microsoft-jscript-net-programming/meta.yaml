  md: 'The next set of operators deals with relative equality. Relative equality is
    the value of one object compared to the value of another object—not for purposes
    of equality, but for purposes determining a value is less than or greater than.


    Let''s start with the less operator, <. If the value on the left, rvalue, then
    the statement evaluates to true. The less than equal operator, <=, adds the condition
    that if the values are equal, then the statement also evaluates to true. The greater
    than operator, >, evaluates to true if lvalue is greater than rvalue. The greater
    than equal operator, >=, takes the > operator one step further and evaluates to
    true if rvalue and lvalue are equal.


    For numerical values, the concept of relative equality is very well defined, to
    the point of being implemented within the microprocessor architecture. The same
    rules for conversion of types apply when performing any sort of comparison, so
    you can refer to the discussion on conversions in Chapter 3 if you need to confirm
    the process for a specific comparison.


    The concept of relative equality becomes very muddled working with strings. Various
    character encodings, punctuation, and accented characters can confuse most character
    returning results that are not desirable. You don''t need to know how algorithms
    and punctuation are handled or the various locals that exist on a given machine
    to perform efficient string comparisons. It is important to keep in mind that
    JavaScriptNET has a very good job of handling comparisons in strings without any
    additional work by the programmer to handle punctuation or locations. In reality,
    the advanced string comparison behavior is provided by the CLR. If you need low-level
    handling when performing comparisons, you should use the string comparison classes
    and functions provided by the CLR instead of the normal comparison operators we''ve
    discussed here. For more information on handling string comparison using the CLR,
    you should investigate the .NET framework documentation in the System.Text namespace.


    # Arithmetic Operators and Concatenation


    JavaScript has many mathematical operators. For simplicity, this section examines
    them in several groups. These mathematical operators are extremely important to
    programming in JavaScript .NET because they enable counting for looping structures
    and the creation of numerical algorithms for solving problems. All programs need
    to use basic arithmetic, so JavaScript .NET provides operators for this in addition
    to many complex mathematical operators:


    +   * Operators that appear in statements—This is how the arithmetic operators
    are most commonly used.


    +   * In-place operators—These come in hand when only simple operations need to
    be performed on an existing variable.'
