    # Inline Return Conditions and the Ternary Operator


    The ternary operator is composed of three parts: the conditional statement, the
    true return value, and the false value. The ternary operator allows you to perform
    a conditional loop and assign one of values to a variable. This can shorten code
    considerably if used correctly, and it can introduce difficult-to-find bugs if
    it''s misused. The ternary operator evaluates to a value, so it''s best to use
    it on the right side of any assignment or as the value a return statement from
    a function or property accessor. It consists of a conditional expression, followed
    by a question mark, followed by the two possible values, separated by a colon.
    A true value appears on the left of the condition and a false value appears on
    the right. The following is an example of the use of a ternary operator:


