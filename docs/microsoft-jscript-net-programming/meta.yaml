    # Listing 4.6 continued


    ```

    // Lets use the inline operators just for fun.

    // We are going to mask out the high values and

    // then do a stripe mask.

    FullValue &= MaskHigh;

    FullValue &= MaskStripe;

    Console.WriteLine(Convert.ToString(FullValue, 2));

    ```


    To pull bits out of a numerical value, you use the AND (&) operator. To put bits
    together or create values, you use OR (|) or its inline assignment (|=). If the
    bit is not set in either operand, the bit in the result is also set in both operands.
    This makes it really easy to merge values together and create flags. You can generally
    generate a flag by adding bits together, but then if you add the flag twice, you
    get incorrect results. By using OR (|) on the flags.


    Almost identical to the OR operator (|) is the XOR operator (^) and its inline
    assignment equivalence (=). The difference between | and ^ is that with | or ^=
    when a bit is set in both operands, the result is unset. The exclusivity comes
    from the fact that one of the operands has the bit set; the result would be false
    or an unset bit. If you use the XOR operator on one value against the same value
    twice, you get the original value back. We''ll use this to generate an encryption
    algorithm later in this section.


    Unlike the rest of the binary operators we''ve discussed so far, the NOT operator
    (~) doesn''t work between two operands. It returns the value, with all its bits
    set. Using AND (&) on a value with its negated value always produces a bitmask
    with all 1s. OR (|) or XOR (^) on a value with its negated value returns all.
    The NOT operator isn''t always useful, and it doesn''t have an inline assignment
    format, but Listing 4.7 shows an example of putting it to good use in encryption/decryption
    code.


    # Listing 4.7 Encryption with Bitwise Operators


