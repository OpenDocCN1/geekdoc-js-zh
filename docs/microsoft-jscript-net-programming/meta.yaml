  md: '# Loop Statements


    You use loop statements in code when an action has to be performed multiple times
    or when an action needs to be performed until a special condition is met (for
    example, printing out 30 random characters, assigning initial values to every
    element in an array, looping while the user is inputting data). As with any program
    flow element, there are always mechanisms to break out of the loop so that the
    program can continue its duties.


    This section discusses three types of looping structures:


    +   - The for is the most powerful of the loop structures and can be used in place
    of the others.

    - The while loop is a bit more specialized than the for. It is used to test a
    condition at the beginning of each loop.

    - The do...while construct can be used to test a condition at the end of the loop.


    # Incremental Looping with for


    The most common use of the for statement is to iterate a piece of code given a
    number of times. This can be useful for plotting pixels on the screen for a game,
    operating on each element of an array, or using a recursive math function as factorial.
    The for statement can be broken down into four parts.


    The first part of the for statement is the initialization statement, which initializes
    any variables that will be used in the looping process. The parts of this statement
    are separated by a comma, and the entire statement ends with a semicolon. The
    initialization statement can''t get too complex, but you can use it to declare
    multiple variables of different data types. The following is an example of an
    initialization statement:


    ```

    for(var iint = 0; ... ) {

    for(var iint = 0, j:String = "Even"; ... ) {

    ```


    The second part of the for statement is the comparison. While this statement is
    true, the loop continues to run. This statement can be as complex as simple as
    needed. Generally, while the value is less than some predefined limit, but in
    the case of enumeration or unbounded access, you might be looking for other values,
    such as null or another empty type. The following is an example of the comparison
    part of a for statement:


    ```

    for(var iint = 0; i < 11; ...) {

    for(var iint = 0, j:String = "Even"; i < 11; ...) {

    ```'
  merge: -1
  pgno: 106
- img_proc: false
  md: "The third part of the statement is an iteration statement, which is executed\
    \ after each iteration of the loop. This value drives the for loop and is the\
    \ reason that the value eventually meets whatever condition is required to exit\
    \ the loop. The following example increments a variable so that it eventually\
    \ equals 11: i++\n\n```\nfor(var i = 0; i < 11; i++) {\n}\nfor(var i = 0, j:String\
    \ = \"Even\"; i < 11; i++) {\n}\n```\n\nThe fourth part of the statement is the\
    \ code block, where all the real work is done (even though all the looping is\
    \ contained in the statement itself). You can do something simple like print values,\
    \ you can modify loop variables, and you can even exit the for loop from within\
    \ the loop using the break statement.\n\n> I don't recommend modifying variables\
    \ that are used in conditional statements. If you make a mistake that code modifies\
    \ the conditional variable to be within bounds, your loop will never exit. Because\
    \ the code for this is buried in the code block and not within the for statement,\
    \ or you another programmer might not be to realize this without wasting valuable\
    \ time picking through the code block.\n\nListing 5.2 demonstrates the complex\
    \ statements that can be used in a for statement. Notice that this code sets the\
    \ variable j to either Even or Odd, based on the value of i. There is one problem\
    \ with this code, though: the first time through the loop, the iteration statement\
    \ isn't called, and you end up whatever the initialized value of j is, which happens\
    \ to be empty string. Figure 5.1 demonstrates the code paths that for statement\
    \ takes.\n\n# Listing 5.2 A Complex For Statement\n\n```\nimport System;\n\nfor(var\
    \ i:int = 0, j:String = \"\"; i < 10; \ni++, j=(i%2 == 0) ? \"Even\" : \"Odd\"\
    ) (\nConsole.WriteLine(i + \" * \" + j);\n)\n```"
