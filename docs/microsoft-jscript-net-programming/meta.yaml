  md: 'Datatypes, Arrays, and Strings


    31


    # Performance and Strongly Typed Variables


    The performance benefits of strongly typing variables are extremely obvious when
    you look at the process of performing operations on each type of code. You can
    directly operate on strongly typed variables without the extra level of indirection
    that is required for traditional Jscript variables. In JavaScript, the underlying
    object currently referenced by a variable is checked for type and then converted,
    if necessary, to a type that is compatible with the current operation. In .NET,
    the code operates automatically. If the type is incompatible, an exception is
    thrown and this forces you, as the programmer, to preemptively check variable
    operations or wrap them in...catch blocks (discussed in Chapter 8, “Exception
    Handling”) and handle the exceptions. It also means that in well-programmed code,
    several operations are saved for each variable operation.


    A second performance advantage has to do with the JavaScript compiler and is a
    direct result of not typing variables. The JavaScript compiler assumed there would
    be a bit of legacy code to deal with, and wanted to see performance benefits without
    having to recode all the samples and programs. The team decided that if the context
    of a variable and all assignments to that variable could be determined within
    a local scope, it could guess the type of a variable. Basically, this means performance-oriented
    variables, such as local variables and counters, are strongly typed if they are
    declared in a local scope. To declare a variable in local scope, use the var keyword
    on the variable, but it doesn''t have to be strongly typed because the compiler
    infers the type. This option is not available for global variables or variables
    that aren''t declared within a particular scope (because the compiler sets them
    as globals)


    3


    DATATYPES, ARRAYS, AND STRINGS


    # The Flexibility of Native JavaScript Variables


    All the existing flexibility of native JavaScript variables is still available
    in JavaScript. All String variables are stored as strings and converted to CLR
    strings as needed at runtime. This conversion is completed by some helper functions
    in the JavaScript namespace that are called whenever a complex conversion needs
    to be made. Any variable declared as an Array object is considered to be a JavaScript
    array, and any variable declared as a System object is considered to be a CLR
    array. The automatic conversions are in place, and interaction with the .NET platform
    is not an issue because the compiler provides services for conversion of all native
    JavaScript types to their equivalent CLR types. So, if flexibility and backward
    compatibility are issues when you''re working with variables, or there is some
    behaviour about classic JavaScript that you loved to love, then you should feel
    free to use it. Just be aware of the performance issues involved and of the new
    syntaxes that you can take advantage of creating faster and smaller code.'
