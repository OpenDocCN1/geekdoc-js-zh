    # Basic Datatypes


    Both JavaScript .NET and the CLR provide basic datatypes for nearly any operation.
    This section examines the primitive types available in JavaScript .NET, as well
    as their CLR counter-parts. This section also discusses some of the complex datatypes,
    String and Array, and a few of the CLR types that aren''t available in the JScript
    language but are available through the platform.


    # Primitive Types


    Historically, the primitive datatypes of a language have been defined as datatypes
    that are directly supported by the language through built-in keywords. In addition
    to having direct language support, primitive types are generally very compact
    or well defined. (Complex objects and datatypes that take substantial amounts
    of initialization code don''t fit into the category of primitive datatypes.)


    The primitive datatypes available in JavaScript .NET include the numeric datatypes
    that support integers and floating-pointer numbers, the Boolean datatype represents
    a true/false condition, and several special types, null and undefined, that can
    be used to test whether variables have been initialized.


    # Integer Numeric Types


    JavaScript has several built-in keywords for describing various integer number
    types. Each of these types in turn relates to a type in the CLR. All the methods
    of the JS types come from the functionality provided by the CLR. JavaScript supports
    the byte, short, int, and long keywords. Of those types, the byte type is unsigned,
    the short, int, and long types are all signed. JavaScript doesn''t have any additional
    keywords to specify the sign of a variable. Table 3.1 lists each of the JS types,
    along with the corresponding CLR type. You''ll notice some CLR types without JavaScript
    mappings that might come handy when writing programs.


    Table 3.1 JavaScript-to-CLR Type Mapping


    | JavaScript .NET Type | CLR Type | Signed |

    |---|---|---|

    | byte | System.Byte | No |

    | | System.Byte | Yes |

    | short | System.Int16 | Yes |

    | | System.UInt16 | No |

    | int | System.Int32 | Yes |

    | | System.UInt32 | No |

    | long | System.Int64 | Yes |

    | | System.UInt64 | No |'
