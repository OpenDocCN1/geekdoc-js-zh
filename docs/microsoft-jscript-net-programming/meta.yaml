  md: "# Chapter 6\n\n# LISTING 6.5 continued\n\n```\n// String methods you wish to\
    \ expose\n// This is sometimes time consuming and tedious\n\n// We are just going\
    \ to do the Trim function\n// though.\nfunction Trim() : String {\n    return\
    \ _string.Trim(' ');\n}\n\nclass SuperSuperEnhancedString extends EnhancedString\
    \ {\n    private var _string:String;\n\n    function SuperEnhancedString(str:String)\
    \ {\n        super(str);\n        _string = str;\n    }\n}\n\nvar enhstr:SuperEnhancedString\
    \ = new SuperEnhancedString(\"Hello World \");\nConsole.WriteLine(enhstr.Trim());\n\
    ```\n\nBecause the _string variable of the EnhancedString class is private and\
    \ not protected, you can't access it directly from the derived class. The ideal\
    \ method for fixing this problem is to recompile EnhancedString and design the\
    \ visibility of the _string variable so that you can access it from within the\
    \ constructor of SuperAdvancedString. Because this design flaw wasn't seen by\
    \ the makers of the original EnhancedString class, you have to work around it\
    \ by using the base class constructor and maintaining your own version of the\
    \ same string.\n\n> NOTE\n\nIt's important to plan classes for the future rather\
    \ than resort to after-the-fact fixes such as maintaining two instances of the\
    \ same variable. If you continued along this path and kept declaring a variable\
    \ every time, you would end up having many instances of the same variable. Also,\
    \ what happens if you have a property that lets you change the value in _string?\
    \ SuperEnhancedString has this property, but you have no way of setting the new\
    \ value on the base class because it never implemented this property. In this\
    \ way, two strings get out of sync. The lesson here is to plan classes intelligently\
    \ and always enable them for being subclassed in the future or mark them as final\
    \ so they will never be subclassed."
