    The major difference between the two functions lies in the ability to search for
    a single character and being able to search for any number of characters (for
    instance, a or b or c as opposed to the string "abc” All versions of these functions—whether
    taking a substring, character, or array of characters—accept a starting offset
    and an ending offset. If a string or character match is found, the offset within
    the string is returned; otherwise, – is returned. (This is the same as in the
    JavaScript functions.)


