  md: '# Inline/Block Comments


    You can place inline/block comments anywhere in code, and you can use them to
    quickly comment out blocks of code or documentation. The inline/block comment
    is the most commonly used type of comment. The comment starts with a begin tag
    (/) and ends with an end of comment tag (*). There are places where these tags
    are not recognized. For example, you can''t embed them in string literals and
    expect to act as comments. Listing 4.10 shows an example of the use of inline/block
    comments.


    # Listing 4.10 Using Inline/Block Comments


    ```

    /*

    is is a file header comment.

    Generally author information, last modified date, and a description

    of what the file does is placed here.

    */

    ```


    ```

    /* This comment describes a piece of code to follow */

    var SomeFollowingCode:int = 0; /*I''m a piece of code at the end-of-line /*

    ```


    ```

    /*

    var ImCommentedOut:int = 0;

    */

    ```


    ```

    function SomeFunction(param1:int /*I''m describing the parameter*/) {

    }

    ```


    All the comments in Listing 4.10 are valid. One is a block at the beginning of
    the file, some are single-line comments after code, and some are placed on the
    same line as code, right after a parameter to a function, to describe the usage
    of the parameter. Single-line comments, which are discussed in the next section,
    can be used in many of the same ways as block comments shown in Listing 4.10.
    However, they should not be used to comment large blocks of code or documentation,
    and they cannot be used to place comments between code elements.


    # Single-line and End-of-line Comments


    Single-line and end-of-line comments can be used to comment out code with a single
    begin-comment marker (//). The end-of-comment marker is always the newline (that
    is, a hard return), so executing code cannot be placed between the comment marker
    and the end of the line, or it will be treated as


