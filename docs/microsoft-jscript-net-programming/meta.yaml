  md: 'After you have compiled and run Listing 6.5, try removing the call to the base
    class constructor. You get a null reference exception because when you call the
    Trim method, you are actually calling the Trim method of the EnhancedString base
    class. Because that class hasn''t been properly initialized, its_string variable
    is null, so you get a null reference exception. You could work around this another
    way, by simply overriding the Trim method, but that defeats the purpose of subclassing
    base types and using their functionality within the new type.


    # Summary


    You should now know everything there is to know about the various class declarations
    available to you in the Jscript .NET language. In this chapter you learned about
    all the various attributes and visibility modifiers. In addition, you learned
    inheriting from a base class and implementing interfaces. In addition, you learned
    about the various constructor options that are available, including default constructors,
    overloaded constructors, and base constructors.


    Chapter 7 covers the intricacies of creating your own interfaces. It also discusses
    implementing methods, properties, and fields, which are the real meat of the class
    declaration. Chapter 7 also includes a discussion of event support in JScript
    .NET.'
