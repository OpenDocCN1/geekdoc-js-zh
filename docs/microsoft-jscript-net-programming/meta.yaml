    # Support for Regular Expressions


    My favorite aspect of JavaScript has always been its support for regular expressions.
    However the implementation might be, it always comes in handy for parsing many
    20-line or larger function to work the characters of a string. For verifying integrity
    (where some data obeys a pattern or not), regular expressions can''t be beat.
    You can specify inline regular expressions, or you can utilize the new objects
    available through the .NET Framework. Of the new features available to JavaScript,
    full support for backtracking and compilation of precompiled objects are the most
    important. Precompiling a regular expression means that it''s stored in textual
    format and is translated directly to a parsing routine at compile time. This feature
    makes great enhancements when the parsing being used are static. The ability to
    backtrack means that you can take advantage of both look-ahead and look-behind
    assertions when verifying that a pattern occurs before after your current match.
    All of these new features make for a great advantage to the story of JavaScript
    regular expressions.


    # Fully Compiled and Optimized for .NET


    Being a CLR-compliant language means several things. First, it means that JavaScript
    .NET gets to take advantage of being compiled into Microsoft Intermediate Language
    (MSIL), which is portable across systems and is later compiled into native code.
    All CLR compliant languages use MSIL and all go through the JIT process that produces
    native code for the platform upon which the code is running. Furthermore, any
    enhancements to the JIT process directly lead to an improvement in the speed of
    the JavaScript .NET code.


    JavaScript .NET provides the ability to use any services provided by the CLR or
    the Microsoft .NET Framework provides in addition to all services that are exported
    by the language. You were introduced to some of these in the previous section,
    which covered the regular expressions objects available in JavaScript. Other features
    that are now available to JavaScript .NET include encryption, file I/O, a global
    configuration format, data access, and even XML. All other classes and features
    are added. JavaScript .NET will be able to support this by simply referencing
    the new objects on the command line.


    Another feature of the .NET platform inherited by JavaScript .NET is the ability
    to interact with objects programmed in other languages. After objects are compiled
