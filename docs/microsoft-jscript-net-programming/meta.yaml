    with nothing in them that you can add to later, using the string modification
    methods.


    It can be useful to print out a list of strings delimited by spaces, tabs, or
    commas. The Join method makes this pretty easy. With a separator string and an
    array of objects to join, the Join method returns a single string with all the
    strings in the array returned by the string.


    What if you want to have a string in a special format? The Format method of the
    String object. The Format method enables you to pass in all sorts of formatting
    parameters, along with a number of objects. This method on strings, numbers, and
    many other types of objects. The actual formatting string can be complex, but
    the general syntax is in the form of a string containing special formatting characters.
    These formatting characters begin and end with braces, in the form{numberobjects,formatoptions},
    where numberobjects is the number of object to format starting from 0, and formatoptions
    is a special set of formatting options that is passed to the object, allowing
    it to format itself (or not format itself, as the case may be).


