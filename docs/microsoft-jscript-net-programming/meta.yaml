  md: 'This means that all your old JScript syntax would work with little or no modification,
    and that all the old objects and methods are still there if the programmer would
    rather use those over the newer objects and methods provided by the CLR and the
    .NET Framework.


    Porting of the JScript interpreter to the JScript .NET began early in 2000 with
    the first usable version of the JScript .NET becoming available after the Professional
    Developer''s Conference in July 2000. This was the first usable version of the
    compiler, and many bugs remain to be worked out. With the Beta 1 Release of the
    .NET platform in early November, a nearly fully functional version of the compiler
    was shipped. With version 1 release of the .NET platform, all the features available
    in the other .NET compilers should be available in JScript .NET. The next logical
    question is: What does JScript .NET have to offer compared to the other .NET languages,
    and what will it continue to offer even after its release and future development?


    # What Does JScript .NET Have to Offer?


    The most important JScript .NET has to offer is backward compatibility with the
    JScript language. All the old objects are still there. All old syntax is still
    available. Even items that don''t port well to the new platform have been preserved
    so that transitioning between the two languages is painless as possible. Of course,
    many of the older features aren''t the best choice for performance. The newer
    features of the language will ensure that JScript .NET increases in speed and
    performance at the same time it increases in flexibility and usability.


    # Backward Compatibility with JavaScript


    To show you the backward compatibility features of JScript .NET, let''s look at
    some examples of the old syntax and the newer syntax. Here you will explore the
    top five areas that cover the majority of programming in JScript and how those
    will equate to the new JScript .NET.


    +   - Strongly Typed Variables

    - Creation and usage of COM components

    - Expando properties of objects

    - Arrays

    - Regular expressions


    # Strongly Typed Variables


    In previous versions of JScript, variables did not have to be declared. If a variable
    wasn''t declared to a given scope, it was considered to be a global variable and
    available to the entire program. JScript .NET preserves this behavior but highly
    recommends that variables are'
  merge: -1
  pgno: 18
- img_proc: false
  md: '# Introduction to JScript .NET


    7


    declared and typed. Typing of variables JScript .NET is new and allows more performance
    because the type of a variable is known at compile time. Any variables that are
    not typed and declared at a local scope are candidates to be strongly typed at
    compile time. The variables cannot be strongly typed, they are given a type of
    object. Variables of type object have to be explicitly used in a function call.
    JScript .NET will handle this for you, but at a small loss in performance, which
    will be described in Chapter 3 when we cover data types.


    # 1


    INTRODUCTION TO

    JSCRIPT .NET


    # Accessing COM Components


    Previous versions of JScript had a container object that could be instantiate
    COM components. This object is known as the ActiveXObject. The ActiveXObject is
    still available but causes a bad performance because all calls have to be dynamically
    marshaled at runtime from the .NET platform to the COM platform. The new method
    for instantiating a COM component is to use a wrapper during compile time that
    gets included with the application and is used instead of the ActiveXObject. This
    won''t always work if the object isn''t known at design time.


    # Using Expand Properties


    In previous versions of JScript, every variable was treated as an object, whether
    it acted as an array, string, or a number. You could assign a value to any property
    of an object, even those properties didn''t exist. This was known as an expand
    property because it isn''t a normal property, but is dynamically generated during
    the assignment. JScript .NET takes these namespaces, which group code (as discussed
    in Chapter 2), and classes and interfaces within a namespace: classes can, in
    turn, extend or inherit from other classes and implement interfaces. These additional
    language features give a bit more syntax to remember, provide the programmer with
    the full power of an object-oriented language. Multiple inheritance is not supported,
    and interfaces don''t allow for base implementations and are completely virtual.
    Through all the syntax and strong typing, the ability to maintain expand properties
    has remained in the language through the use of a special expand attribute. The
    use of any legacy JScript features, such as expand properties, increases the load
    and execution time of a program. These features are strictly missed in favor of
    new features of the language.


