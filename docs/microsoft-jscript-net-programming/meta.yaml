  md: "Another form of the while statement iterates endlessly, unless a break statement\
    \ allows the program to break free. In this form, the conditional statement always\
    \ evaluates to true and some complex logic inside the loop decides when the loop\
    \ should end. The following example demonstrates the use of the break statement\
    \ to short-circuit a while loop, even though the conditional statement isn't used\
    \ to exit the loop:\n\n```\nwhile(true) {\n  // Grab user input\n  if ( UserInput\
    \ == \"Q\") {\n    break;\n  }\n}\n```\n\n> > CAUTION\n>\n> The break statement\
    \ to jump out of a loop construct is extremely bad coding practice it puts all\
    \ the logic into the code block. This makes it extremely difficult to find the\
    \ location from which the loop can be exited in case the logic has to be updated.\n\
    \nThe do...while statement is used less frequently than the while statement. There\
    \ is only one difference between a while and do...while statement: A while statement\
    \ executes the conditional statement before the code block is ever executed, which\
    \ means a while loop can execute zero or more times. A do...while statement executes\
    \ the conditional statement after the code block has been executed, which guarantees\
    \ that the block will run at least once before the loop is exited. Figure 5.2\
    \ shows the difference between the while and do...while statements.\n\n![](bbox=[0.213,\
    \ 0.667, 0.689, 0.811])\n\nFIGURE 5.2\nDifferences Between while and do...while."
