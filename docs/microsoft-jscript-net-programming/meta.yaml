  md: "# LISTING 5.8 Using continue to Optimize a Loop\n\n```\nimport System;\nimport\
    \ System.Drawing;\n```\n\n```\n// We are going to use some special code from System.Drawing\n\
    var p:Point[] = new Point[10];\nvar s:Rectangle = new Rectangle(0,0,400,400);\n\
    ```\n\n```\n// Special Class for making random numbers\nvar rand:Random = new\
    \ Random();\nvar i:int;\n```\n\n```\n// Initialize\nfor(i = 0; i < p.Length; i++)\
    \ {\n    // Generate points from 1 to 1000 for both x and y\n    p[i] = new Point(rand.Next(1,1001),\
    \ rand.Next(1,1001));\n}\n```\n\n```\n// Test\nfor(i = 0; i < p.Length; i++) {\n\
    \    if (!s.Contains(p[i])) {\n        continue;\n    }\n\nConsole.WriteLine('Drawing\
    \ point ' + i + '\\n to the screen at ' + p[i].ToString());\n}\n```\n\n>5-8\n\
    Drawing point 1 to the screen at {X=162,Y=353}\nDrawing point 3 to the screen\
    \ at {X=334,Y=392}\nDrawing point 6 to the screen at {X=347,Y=19}\n\nFor this\
    \ code, the screen is a fixed size of 400 pixels in width and 400 pixels in height.\
    \ This means that any sprites (that is, small graphics that portray game objects\
    \ such as the user's character, monsters, or obstacles) or game objects outside\
    \ the viewing area don't have their graphics-related information updated each\
    \ time, but you still need to continue processing the rest of the sprites.\n\n\
    The optimization in Listing 5.8 means you only have to write 3 of the 10 sprites\
    \ to the screen. This is a major performance gain if there is a lot of logic involved\
    \ in writing the sprites. An additional performance gain could be added if you\
    \ know the points were sorted from least to greatest: You could use the break\
    \ statement, described in the next section, after the code failed the first time\
    \ and exit the loop entirely."
