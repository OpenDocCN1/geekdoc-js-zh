    \ statement works differ-\nently, based on the type of collection you are using.\
    \ An array returns the index of the\ncurrent item as an integer. This means you\
    \ have to use the index to access the actual value at\nthat location. If you are\
    \ using a collection such as ArrayList, you use code to strongly\nt enumerated\
    \ value because it is an actual object reference and not an index value.\nYou\
