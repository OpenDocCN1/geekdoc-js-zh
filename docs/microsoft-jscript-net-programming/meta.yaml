    \ methods can return instances still\nstatic function CreateInstance() : PrivateConstructor\
    \ {\n    return new PrivateInstance();\n}\n```\n\nRead this code because it throws\
    \ curve ball: It adds the CreateInstance method, which can return an instance\
    \ of the PrivateConstructor class. Why would you ever utilize instead of constructors?\
    \ It's a matter of programming style. For example, I try to fit everything into\
    \ constructor overloads, but I still end up having a private method I call with\
    \ all the details and let the function, rather than one of the overloads, the\
    \ work of initializing the instance. One bonus of this is if the call to CreateInstance\
    \ specifies all the parameters needed to fully initialize a class, you can use\
    \ it to make a clone or copy of the class.\n\nNET automatically generates code\
    \ for a copy constructor, but you'll never see this code unless you open the assembly\
    \ by ILDasm and actually look at the generated intermediate language (IL) code\
    \ and metadata.\n\nIf you need to control the way an object is copied, you should\
    \ support the ICloneable interface. This interface specifies that you use the\
    \ Clone function and is very easy to implement as long as the values that need\
    \ to be copied from private member variables also support the ICloneable interface.\
    \ Some things to watch out for are passing objects from one instance to a cloned\
    \ instance. In some cases, you might find that operating on data in one object\
    \ automatically updates data in another object because you passed the data by\
    \ reference and not by value."
