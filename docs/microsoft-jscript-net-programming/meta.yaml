  md: "import System;\n\n// A can't be instantiated. But you can still program against\
    \ its methods\nabstract Class A {\n    function AFunction() : void {\n    }\n\
    \    function AProcess() : void {\n    }\n\n// A defines a function that must\
    \ be overridden by a base class\n// it provides no implementation\nabstract function\
    \ OverrideProcess() : void;\n}\n\nclass B extends A {\n    // inherits AFunction()\n\
    \    // overrides AProcess since a new one is found\n    override function AProcess()\
    \ : void {\n}\n\n// B implements the OverrideProcess function since it has to\
    \ contract\noverride function OverrideProcess() : void {\n}\n\n// B defines new\
    \ methods in the contract\nfunction BFunction() : void {\n}\n\nclass C extends\
    \ B {\n    // C gets all of the functions from A not overridden by B\n    // C\
    \ gets all of the functions from B including the new function\n    // At this\
    \ point C can continue the chain of evolution\n}\n\n# Using Interfaces Over a\
    \ Subclass\n\nInterfaces are extremely powerful. Whereas a class can implement\
    \ only one base class, it can implement more than one interface. When should a\
    \ base class be used and when should an interface be used? There is a simple answer\
    \ to this question, and it hinges on something you've seen already, in code for\
    \ extending classes. Classes can provide function and property implementations.\
    \ This is not true of interfaces. Interfaces are contracts, and they provide no\
    \ implementation; they require the implementer to provide any implementation.\
    \ Basically, an interface is like an abstract class, with all abstract members\
    \ and properties. Therefore you use a"
  merge: -1
  pgno: 133
- img_proc: false
  md: "base class when you want base implementations, and you use interfaces when\
    \ you find your-self deriving from a class that has no implementation and is fully\
    \ abstract.\n\n> If you extend a base class that implements an interface, that\
    \ interface is in turn auto-matically inherited by the derived class. Oftimes\
    \ it might feel right to implement the interface in the derived class as well,\
    \ but that is unnecessary. Although it's not a compiler error or a runtime error,\
    \ it introduces additional code baggage.\n\nTo implement an interface or multiple\
    \ interfaces, you use the implements keyword, or immediately following the class\
    \ name or immediately following the extends declaration. The interfaces that are\
    \ being implemented should be separated by a comma. The following example demonstrates\
    \ the use of the implement and extends keywords to extend base classes and implement\
    \ interfaces:\n\n```\nclass Class {\n  // Normal class\n}\nclass Class1 implements\
    \ Interface1 {\n  // Class definition with one interface\n}\nclass Class2 extends\
    \ Class implements Interface1 {\n  // Class definition with base class and one\
    \ interface\n}\nclass Class3 implements Interface1, Interface2, Interface3 {\n\
    \  // Class definition with many interfaces\n}\n```\n\n# Using Encapsulation Over\
    \ a Subclass\n\nOften, extending a single subclass in a single inheritance language\
    \ puts you at a programming disadvantage because soon as you decide to create\
    \ one type of object, you limit it from ever becoming another type of object.\
    \ You might also face situations in which you need to extend the abilities of\
    \ a class that is sealed with the final keyword. In both of these instances, encapsulation\
    \ comes into play because you're not limited to the number of types you can encapsulate,\
    \ and you can always encapsulate those sealed classes by housing instances of\
    \ them in a class."
