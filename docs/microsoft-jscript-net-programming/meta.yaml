    # NOTE


    The new operator is extremely important in object-oriented programming. Programs
    tend to use objects to represent individual pieces of data in a program, and most
    programs contain hundreds, if not thousands, of these small objects. Each object
    must be created using the new operator and then assigned values to make distinct
    from other objects of the same type. The dependency of code on the new operator
    is covered in more detail in Chapter 6 and Chapter 7.


    In object-oriented programming, code has to operate on derived objects (that is,
    objects that are based on other classes with which the program knows to work).
    A new derived class implements new functionality or overrides some of the methods
    to work with different sets of internal data. Although this is extremely common
    you shouldn''t have to rewrite your original code if there is a new derived object;
    it should work. You can test whether an object implements a interface, is derived
    from a certain class, or is a certain class using the instanceof. The instance
    operator can be better examined with the basic knowledge that all objects in the
    CLR are derived (from that is, related to) the System. Object type. All basic
    datatypes are derived (from that is, related to) the System.ValueType. Listing
    4.9 shows the use of the instanceof operator to determine if certain classes are
    related.


    # Listing 4.9 Using the instanceof Operator


    ```

    import System;


    public class DataClass {

    }

    public class AntiDataClass {

    }


    var DataObj:DataClass = new DataClass();

    var AntiObj:AntiDataClass = new AntiDataClass();


    Console.WriteLine(DataObj instanceof System.Object);

    Console.WriteLine(DataObj instanceof DataClass);

    Console.WriteLine(DataObj instanceof AntiDataClass);


    Console.WriteLine();

    Console.WriteLine(AntiObj instanceof System.Object);

    Console.WriteLine(AntiObj instanceof DataClass);

    Console.WriteLine(AntiObj instanceof AntiDataClass);

    ```


