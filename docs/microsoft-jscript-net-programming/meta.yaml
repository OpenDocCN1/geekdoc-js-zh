    # Using the String Object


    The String object is probably the most widely used and also the most complex object
    available in JScript. The semantics surrounding this object are fairly complex
    because there is only one object that is converted-on-the-fly by a JScript object
    and a CLR object. All the functions and properties of both objects are available
    to programmers, and so are legacy JScript semantics. In .NET languages, it is
    very easy to catch exceptions by using a String. In JScript .NET, you rarely see
    this because the compiler does conversions, casting, and initializations for you.
    This section examines the important aspects of String objects.


    # Declaring Strings


    Two types in JScript (String and System.String) evaluate to the same String object.
    This is because a JScript object and a CLR String object map to a CLR String object
    internally. Then, special handler functions are called whenever a JScript object
    function is called. Therefore, the programmer sees great performance from CLR
    String objects as well as great flexibility because existing code works on the
    String object continues to work. Here''s an example of calling both JScript String
    methods and CLR String methods on the same object:


    ```

    var MyString:String = "Hello";

    ```


    ```

    MyString.toString();nMyString.ToString();

    ```


    This example calls both toString(), which is a JScript function and ToString(),
    which is a CLR function. For the toString() function, a special call is made into
    a JScript helper library, and the string is printed according the rules of JScript.
    The ToString() function, on the other hand, is called directly from the String
    object and returns according to CLR rules. The two functions behave identically,
    but they take different code paths. To keep things simple, let''s


