    # Declaring and Typing Arrays


    The use of arrays is integral to almost any programming task. JavaScript has always
    had a method for creating arrays that can perform any task, but JavaScript arrays
    were never very efficient. The new arrays available through JavaScript .NET, which
    can exist side-by-side with JavaScript arrays, offer both performance and flexibility,
    but never at the same time.


    # Declaring JavaScript and .NET Arrays


    The first step in working with arrays is to declare the array. Let''s start by
    declaring a traditional JavaScript-style array:


    ```

    var _JavaScriptArray:Array = new Array();


    _JavaScriptArray[0] = "123";

    _JavaScriptArray[2000] = 123;

    _JavaScriptArray[500] = new Object();

    ```


    The type of this is array, and the example creates a new instance of the Array
    class. Note that all the assignments in this example are valid, and JavaScript-style
    arrays are not strongly typed. Everything that goes in the array is of type Object,
    and everything that comes out of type Object. Therefore, you can assign a string
    to array index 0, int to array index 2000, and new Object to array index 500.


    JavaScript arrays are not bounded. New elements can be assigned on-the-fly. As
    you make assignments, a length function is updated so that the upper bounds of
    the array are always known. This comes handy when you retrieve a JavaScript array
    and iterate over its contents. If some of the intermediate values are null, then
    you would not be able to tell the end of the array without the length function.
    JavaScript arrays are extremely powerful, but there are some performance tradeoffs
    involved with them.


    The following example demonstrates a variety of methods for finding the end of
    a JavaScript array. The first method searches for null:var

    var _JavaScriptArray:Array = new Array();

    var _int:int = 0;


    ```

    // Use JavaScript array like a stack

    _JavaScriptArray[_int++] = "First Element";

    _JavaScriptArray[_int++] = "Second Element";

    ```'
