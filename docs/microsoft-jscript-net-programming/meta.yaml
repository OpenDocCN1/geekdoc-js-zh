  md: 'simple of all comparisons is whether a variable is equal to another variable.
    In JavaScript .NET, you use the equality operator, ==, to make this comparison.


    There are three main types of variable comparison:


    +   * The first type encompasses all the numerical types and a set of rules for
    converting the two values to a common type before the comparison is made.

    * The second type involves the comparison of strings. String comparison is rather
    trivial in the common runtime (CLR), which in assembly (as described in Chapter
    2) holds a string. Whenever a new string is created, it is given a new descriptor
    in the table. However, if a string with the same contents as an existing string
    is created, the descriptor for the existing string is supplied. In this manner,
    two strings with the same contents contain the same descriptor in the assembly
    table.

    * The final type of comparison involves comparison of various object types. Strings
    can essentially fall into this scenario under the CLR because they are of object
    type. All object types implement Equals methods that allow to compare one object
    type to another. This method can apply special rules, it can use a string representation
    of the object for comparison purposes, or it can use a number of other functions
    or algorithms. The important thing to note is that when you use the equality operator,
    JavaScript handles all the conversions, and it calls the Equals function.


    The previous operator just handles the equality portion of the question. To determine
    whether two variables are not equal to one another, you use the inequality operator,
    !=. This syntax resembles the negate operator (see the section "Boolean Operators"
    later in this chapter) along with the equality operator. This operator returns
    the Boolean result of the equality function. The same effect can be achieved by
    neg the result of an equality function as shown in the following code:


    ```

    var a:int = 1;

    var b:int = 2;

    var result:Boolean = false;

    ```


    ```

    // Two comparisons are equivalent

    result = (a != b);

    result = (a == b);

    ```


    You can review the values by placing some Console code after each of the assignments.
    The result in both cases is true. In the first case, a != b, a is certainly not
    equal to b, so the comparison evaluates to true. In the second case, a == b (that
    is, a equals b) is false. Then taking the negation of that value, which returns
    true. Either way, you get the same results, but using the inequality operator
    is the preferred method because it makes use of a single operator rather than
    two and executes more quickly than the two-operator version.


