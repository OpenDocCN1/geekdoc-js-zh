  md: '# Chapter 2


    one set of methods and properties, you also need two user interfaces JavaScript
    .NET and the CLR support only single inheritance.


    Base classes become important when the member definitions and member functionality
    need to be defined. Interfaces can only specify that a method with a certain prototype
    must be exported by an object, whereas the base class will specify not the prototype
    of the method, but also an implementation in code for that method. This implementation
    can be overridden by the child class, and can be called from within the child''s
    implementation as well. Using base classes allows for a common set of functionality
    and not just a common set of member prototypes.


    # Class Members


    Class members come in the form of properties, fields, constructors, events, and
    methods. All class members can have scope modifiers applied to limit visibility
    and usage. As each class or object is supposed to contain its own data, the members
    of a class must provide the program with ways to manipulate and retrieve that
    data.


    # Instance Members


    When you need an object reference to hold and manipulate data, you can use instance
    members. *Constructors* provide a means of initializing the internal data of a
    class during creation. *Fields* can be directly accessed and assigned by the user.
    *Properties* provide controlled access to internal data, and a property is generally
    used in place of a field when access to the raw data has to be controlled. *Methods*
    are used to perform the more complex actions of a class.


    ![](bbox=[0.146, 0.584, 0.735, 0.831])


    FIGURE 2.2

    Instance members.'
