  md: "# Object Operators\n\nYou need to understand the object operators to gain a\
    \ thorough understanding of how to make full use of the JavaScript .NET language.\
    \ Using these operators, you can easily create instances of objects and query\
    \ existing objects for their types or compare them against known types.\n\n> NOTE\n\
    To fully understand a couple of the object operators mentioned in this section,\
    \ you need to refer to Chapters 6, \"Creating Classes,\" and 7, \"Interfaces and\
    \ Class Members,\" for more information.\n\nThe new operator creates an instance\
    \ of any object or type that you can create in the current object. Object-oriented\
    \ programming, a common programming practice is to encapsulate data items special\
    \ objects by using special methods or properties that can give your program indirect\
    \ access to the values. For every new piece of data, you would have to create\
    \ a new object. The following example defines a structure that holds a single\
    \ integer value, but every time you make a new piece of data, you would have to\
    \ create a new instance of this structure:\n\n```\nimport System;\n\npublic class\
    \ DataPoint {\n    public var Point:int;\n}\n\nvar MyDataPoint:DataPoint = new\
    \ DataPoint();\nMyDataPoint.Point = 5;\nConsole.WriteLine(MyDataPoint.Point);\n\
    MyDataPoint = new DataPoint();\nConsole.WriteLine(MyDataPoint.Point);\n```\n\n\
    You create the first piece of data and assign the value 5, and you use Console.WriteLine\
    \ to verify that the value is indeed 5. Then, you create another new data point.\
    \ This time, you do not set a value for the data point, so the default value—which\
    \ for an int is always 0—appears. Note that you never reassign a new value to\
    \ MyDataPoint.Point. However, you do assign a different object to the variable,\
    \ thus changing the value."
