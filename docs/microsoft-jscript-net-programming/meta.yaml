    # Arithmetic Operators in Statements


    Operators most commonly appear in statements. A statement can be as simple as
    two operands and a single operator or as complex as hundreds of parentheses and
    multiple operands and operators. For the most part, only simple statements are
    needed to understand the purpose of each operator. These operators include the
    basic arithmetic operators (+, *, /), the increment and decrement operators (++
    and --), and the modulus operator (%).The basic operators include the addition
    operator (+), the subtraction operator (-), the multiplication operator (*), and
    the division operator (/). Whenever you use these operators, the result is made
    in form of the smallest datatype needed to house the result. For instance, if
    you add two numbers, one of which is an int and the other of a float, the result
    is a float because it''s the simplest datatype that can hold the result. Assigning
    the result to a datatype with less precision than is needed results in a loss
    of any data that can''t be converted. Casting the float to an int would result
    in loss of any fractional portion of the number. You can do this, for example,
    to integer-only arithmetic, where you''re using a quotient and remainder instead
    of using the float result. You can see some of these operators in action in Listing
    4.1.


