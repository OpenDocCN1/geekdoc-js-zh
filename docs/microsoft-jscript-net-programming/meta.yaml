    substrings at the beginning or end of a given string. The return value is a Boolean
    or false, depending on whether the string matched. However, these functions are
    useful only after the string has been fully normalized (that is, any whitespace
    at the beginning or end of the string has been removed so that the string match
    can happen). To aid in removing characters, the CLR provides the trim functions.
    The TrimStart and TrimEnd functions take an array of characters from the string
    instead or a null value to indicate whitespace. With this set of functions, you
    can trim any given number of characters or amount of whitespace from the beginning
    and end of a string.


    The CLR also has padding functions. You can use the PadLeft and PadRight functions
    to add padding to each side of a string. To use each function, you simply pass
    in the length you want'
