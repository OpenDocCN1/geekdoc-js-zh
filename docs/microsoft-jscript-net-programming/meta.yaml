    \ {\n    description = value;\n}\n```\n\n# Inheritance and Subclassing\n\nA language\
    \ gains a lot of power through code reuse. Inheritance and subclassing both enable\
    \ code reuse by allowing new classes to reuse old classes by inheriting and overriding\
    \ the old methods while at the same time providing new methods on this new subclass.\
    \ This can be extremely powerful because older programs can continue to work with\
    \ the new object, using only the old methods, and new programs can use the updated\
    \ object in its entire splendor by accessing both new and old methods.\n\nIn this\
    \ section we first talk about extending classes. The extends keyword allows a\
    \ class to extend a base class, as long as it isn't marked final, in which case\
    \ it can't be overridden. Also notice the implements keyword. This keyword enables\
    \ you to implement interfaces which is a contract made by your object that you'll\
    \ support all the methods defined in the interface and thus an object can act\
    \ as if it were an instance of the interface in question. (You can find more information\
    \ and a more complete description of interfaces in Chapter 7.)\n\nThis section\
    \ also discusses a third form of inheritance, called encapsulation. In encapsulation,\
    \ you never extend a base class or implement any interface; instead, you instantiate\
    \ an instance"
