  md: '# About the Author


    Justin Rogers is currently a vendor for Microsoft Projects through CompuWare Corporation
    and previously worked for the Microsoft Frameworks team as the owner for the .NET
    QuickStart Tutorials available on the .NET Frameworks SDK. Justin enjoys working
    with DirectX and has worked on many open source game projects. After owning the
    QuickStarts, Justin moved on to an an Internet-enabled Peer-to-Peer screensaver
    game called the Terrarium. This game was introduced at the PDC and was considered
    one of the leading technology demos for high performance .NET applications.'
