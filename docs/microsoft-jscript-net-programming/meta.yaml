    \ must be called at least once the IEnumerator is created or after a Reset has\
    \ been made in order for the Current property to have a valid object. The MoveNext\
    \ method returns true if the method is successful and another value is available,\
    \ it returns false if another is not available. The CLR enumeration methods are\
    \ really starting to look a lot like JavaScript .NET Enumerator object. Listing\
    \ 5.7 demonstrates the use of the methods available by the IEnumerator and IEnumerator\
    \ interfaces over a collection.\n\n# LISTING 5.7 Using the IEnumerator and IEnumerator\
    \ Interfaces\n\n```\nimport System;\nimport System.Collections;\n\nvar arrayList\
    \ = new ArrayList(); // Make a new collection\narrayList.Add(\"String1\");\narrayList.Add(\"\
    String2\");\narrayList.Add(\"String3\");\n\nfor(var e:IEnumerator = arrayList.GetEnumerator();\
    \ e.MoveNext()) {\n  Console.WriteLine(e.Current);\n}\n```\n\nListing 5.7 is almost\
    \ the same as the JavaScript Enumerator object! You should use the JavaScript\
    \ Enumerator object if you plan on maintaining your code by using JavaScript .NET.\
    \ If you want to make your code more portable, you should use the CL interfaces\
    \ shown in Listing 5.7 instead.\n\n# Using Labels with continue and break\n\n\
    In addition to the exit statements for loops, JavaScript provides the continue\
    \ and break statements, which allow for a short-circuit method for breaking out\
    \ of a loop structure from within the looping structure. You can optionally label\
    \ control structures so that you apply more control regarding where the continue\
    \ and break statements move the instruction pointer.\n\n# Using the continue Statement\n\
    \nYou use the continue statement when you want to start the next iteration of\
    \ a loop without performing the rest of the code in the loop. Most of the time,\
    \ you do this to skip over null objects in collections or arrays or when you are\
    \ moving some of the processing out of the loop. Listing 5.8 shows how to do this,\
    \ using graphics code."
