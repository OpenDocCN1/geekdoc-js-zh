    \n# LISTING 6.4 Cascading Constructor Methods\n\n```\nimport System;\n\nclass\
    \ CascadeDownConstructor {\n    private var rand:Random;\n    private var name:String;\n\
    \    private var id:int;\n\n    function CascadeDownConstructor() {\n        this.rand\
    \ = new Random();\n    }\n\n    function CascadeDownConstructor(name:String) {\n\
    \        this();\n        this.name = name;\n    }\n\n    function CascadeDownConstructor(name:String,\
    \ id:int) {\n        this(name);\n        this.id = id;\n    }\n}\n\nclass CascadeUpConstructor\
    \ {\n    function CascadeUpConstructor() {\n        this(\"*\");\n    }\n\n  \
    \  function CascadeUpConstructor(name:String) {\n        this(name, 0);\n    }\n\
    \n    function CascadeUpConstructor(name:String, id:int) {\n        this.name\
    \ = name;\n        this.id = id;\n        this.rand = new Random();\n    }\n}\n\
    ```\n\nThe second and more widely used method for calling additional constructors\
    \ to initialize an object cascading up the tree from the least explicit constructor\
