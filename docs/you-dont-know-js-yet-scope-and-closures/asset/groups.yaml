    # Blocked Over


    The point of lexical scoping rules in a programming language is so we can appropriately
    appropriately organize our program’s variables, both for operational as well as
    semantic code communication purposes.


    And one of the most important organizational techniques is to ensure that no variable
    is over-exposed to unnecessary scopes (POLE). Hopefully you now appreciate block
    scoping much more deeply than before.


    Hopefully by you feel like you’re standing on much more solid ground with understanding
    lexical scope. From that base, the next chapter jumps into the weighty topic of
    closure.'
