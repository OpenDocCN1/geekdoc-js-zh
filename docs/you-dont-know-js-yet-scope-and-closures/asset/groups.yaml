    - 随时间推迟是闭包的关键\n\n## 什么是回调？\n\n在我们重新讨论闭包之前，让我先花一点时间处理一下“回调”这个词。一个公认的规范是，说“回调”等同于异步回调和同步回调。我不认为这是一个好主意，所以我想解释为什么，并建议我们用另一个术语代替它。\n\
