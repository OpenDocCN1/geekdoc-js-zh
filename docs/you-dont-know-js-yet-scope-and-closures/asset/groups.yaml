    \ invokes the method on that specific instance.\n\n## Classic Module Definition\n\
    \nSo to clarify what makes something a classic module:\n\n- There must be an outer\
    \ scope, typically from a module factory function running at least once.\n- The\
    \ module’s inner scope must have at least one piece of hidden information that\
