    We''re storing all the computed factorials in cache so that across multiple calls
    to factorial(..), the previous computations remain. But the cache variable is
    pretty obviously a private detail of how factorial(..) works, not something that
    should be exposed in an outer scope—especially not the global scope.


    # Note


    factorial(..) here is recursive—a call to itself is made from inside—but that''s
    just for brevity of code sake; a non-recursive implementation would yield the
    same scoping analysis with respect to cache.


    However, fixing this over-exposure issue is not as simple as hiding the cache
    variable inside factorial(..), as it might seem. Since we need cache to survive
    multiple calls, it must be located in a scope outside that function. What can
    we we do?


    Define another middle scope (between the outer/global scope and the inside of
    factorial(..)) for cache to be located:'
