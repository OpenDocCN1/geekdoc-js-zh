- md: "\n# Chapter 4: Around the Global Scope\n\nHowever, the browser’s JS engine\
    \ is still running the code, so we can expect similar purity of its global scope\
    \ behavior. Since there is no DOM access, the window alias for the global scope\
    \ doesn't exist.\n\nIn a Web Worker, the global object reference is typically\
    \ made using self:\n\n```javascript\nvar studentName = \"Kyle\"; let studentID\
    \ = 42;\n\nfunction hello() {\n  console.log(`Hello, ${self.studentName}!`);\n\
    }\n\nself.hello();\n// Hello, Kyle!\n\nself.studentID;\n// undefined\n```\n\n\
    Just as with main JS programs, var and function declarations create mirrored properties\
    \ on the global object (aka, self), where other declarations (let, etc) do not.\n\
    \nSo again, the global scope behavior we're seeing here is about as pure as it\
    \ gets for running JS programs; perhaps it's even more pure since there's no DOM\
    \ to muck things up!\n\n## Developer Tools Console/REPL\n\nRecall from Chapter\
    \ 1 in Get Started that Developer Tools don't create a completely adherent JS\
    \ environment. They do process JS code, but they also lean in favor of the UX\
    \ interaction being most friendly to developers (aka, developer experience, or\
    \ DX).\n\nIn some cases, favoring DX when typing in short JS snippets, over the\
    \ normal strict steps expected for processing a full JS program, produces observable\
    \ differences in code behavior between programs and tools. For example, certain\
    \ error conditions applicable to a JS program may be relaxed and not displayed\
    \ when the code is entered into a developer tool.\n\nWith respect to our discussions\
    \ here about scope, such observable differences in behavior may include:\n\n-\
    \ The behavior of the global scope\n- Hoisting (see Chapter 5)\n- Block-scoping\
    \ declarators (let / const, see Chapter 6) when used in the outermost scope\n\n\
    Although it might seem, using the console/REPL, that statements entered in the\
    \ outermost scope are being processed in the real global scope, that’s not quite\
    \ accurate. Such tools typically emulate the global scope position to an extent;\
    \ it’s emulation, not strict adherence. These tool environments prioritize developer\
    \ convenience, which means that at times (such with our current discussions regarding\
    \ scope), observed behavior may deviate from the JS specification.\n\nThe take-away\
    \ is that Developer Tools, while optimized to be convenient and useful for a variety\
    \ of developer activities, not suitable environments to determine or verify explicit\
    \ and nuanced behaviors of an actual JS program context.\n\n## ES Modules (ESM)\n\
    \nES6 introduced first-class support for the module pattern (covered in Chapter\
    \ 8). One of the most obvious impacts of using ESM is how it changes the behavior\
    \ of the observable top-level scope in a file.\n\nRecall this code snippet from\
    \ earlier (which we'll adjust to ESM format by using the export keyword):\n\n\
    ```javascript\nvar studentName = \"Kyle\";\n\nfunction hello() {\n  console.log(`Hello,\
    \ ${studentName}!`);\n}\n```\n\n```javascript\nhello();\n// Hello, Kyle!\n\nexport\
    \ hello;\n```\n\nIf that code is in a file that's loaded as an ES module, it will\
    \ still run exactly the same. However, the observable effects, from the overall\
    \ application perspective, will be different.\n\nDespite being declared at the\
    \ top level of the (module) file, in the outermost obvious scope, studentName\
    \ and hello are not global variables. Instead, they are module-wide, or if you\
    \ prefer, \"module-global.\"\n\nHowever, in a module there's no implicit \"module-wide\
    \ scope object\" for these top-level declarations to be added as properties, as\
    \ is when declarations appear in the top-level of non-module JS files. This is\
    \ not to say that global variables cannot exist or be accessed in such programs.\
    \ It's just that global variables don't get created by declaring variables in\
    \ the top-level scope of a module.\n\nThe module's top-level scope is descended\
    \ from the global scope, almost as if the entire contents of the module were wrapped\
    \ in a function. Thus, all variables that exist in the global scope (whether they're\
    \ on the global object or not!) are available as lexical identifiers from inside\
    \ the module's scope.\n\nESM encourages a minimization of reliance on the global\
    \ scope, where you import whatever modules you may need for the current module\
    \ to operate. As such, you less see usage of the global scope or its global object.\n\
    \nHowever, as noted earlier, there are plenty of JS and web globals that you will\
    \ continue to access from the global scope, whether you realize it or not!\n\n\
    ## Node\n\nOne aspect of Node that often catches JS developers off-guard is that\
    \ Node treats every single .js file that it loads, including the main one you\
    \ start the Node process with, as a module or CommonJS module, see Chapter 8).\
    \ The practical effect is that the top level of your Node programs is never actually\
    \ the global scope, the way it is when loading a non-module file in the browser.\n\
    \nAs time of this writing, Node has recently added support for ES modules. But\
    \ additionally, Node has from its beginning supported a module format referred\
    \ to as “CommonJS”, which looks like this:\n\n```javascript\nvar studentName =\
    \ \"Kyle\";\n\nfunction hello() {\n    console.log(`Hello, ${studentName}!`);\n\
    }\n\nhello();\n// Hello, Kyle!\n\nmodule.exports.hello = hello\n```\n\nBefore\
    \ processing, Node effectively wraps such code in a function, so that the var\
    \ and function declarations are contained in that wrapping function's scope, **not**\
    \ treated as global variables.\n\nEnvision the preceding code as being seen by\
    \ Node as:\n\n```javascript\nfunction(module, exports, __dirname) {\n    var studentName\
    \ = \"Kyle\";\n\n    function hello() {\n        console.log(`Hello, ${studentName}!`);\n\
    \    }\n\n    hello();\n    // Hello, Kyle!\n\n    module.exports.hello = hello\n\
    }\n```\n\nYou can clearly see here why studentName and hello are not global, but\
    \ rather declared in the module.\n\n## Global This\n\nReviewing the JS environments\
    \ we’ve looked at so far, a program may or may not:\n\n- Declare a global variable\
    \ in the top-level scope with var or function declarations—or let, const, and\
    \ class.\n- Also add global variables declarations as properties of the global\
    \ object if var or function are used for the declaration.\n- Refer to the global\
    \ scope object (for adding or retrieving global variables, as properties) with\
    \ window, self, or global.\n\nI think it's fair to say that global scope access\
    \ and behavior is more complicated than most developers assume, as the preceding\
    \ sections have illustrated. But the complexity is never more obvious than in\
    \ trying to nail down a universally applicable reference to the global object.\n\
    \nYet another “trick” for obtaining a reference to the global object looks like:\n\
    \n```javascript\nconst globalObject = \n(new Function(\"return this\"))();\n```\n\
    \n# Note\n\nA function can be dynamically constructed from code stored in a string\
    \ value with the Function() constructor, similar to eval(..) (see “Cheating: Runtime\
    \ Scope Modifications” in Chapter 1). Such a function will automatically run in\
    \ non-strict-mode (for legacy reasons) when invoked with the normal () function\
    \ invocation as shown; this will point at the global object. See the third book\
    \ in the series, Objects & Classes, for more information on determining this bindings.\n\
    \nYou Don’t Know JS Yet: Scope & Closures\n"
  mdcn: "\n\n# 第 4 章：全局作用域\n\n然而，浏览器的 JS 引擎仍在运行代码，因此我们可以预期其全局作用域具有类似的纯净性。由于没有对 DOM\
    \ 的访问，全局作用域的 window 别名并不存在。\n\n在 Web Worker 中，全局对象的引用通常使用 `self` 来创建：\n\n```javascript\n\
    var studentName = \"Kyle\"; let studentID = 42;\n\nfunction hello() {\n  console.log(`Hello,\
    \ ${self.studentName}!`);\n}\n\nself.hello();\n// Hello, Kyle!\n\nself.studentID;\n\
    // undefined\n```\n\n与主 JS 程序一样，`var` 和 `function` 声明会在全局对象（即 `self`）上创建镜像属性，而其他声明（如\
    \ `let` 等）则不会。\n\n所以，我们在这里看到的全局作用域行为对于运行 JS 程序来说已经尽可能的纯净了；也许它甚至更纯净，因为没有 DOM 来干扰它！\n\
    \n## 开发者工具控制台/REPL\n\n回想《入门》（Get Started）的第一章中提到的，开发者工具并没有创建一个完全遵循标准的 JS 环境。它们确实会处理\
    \ JS 代码，但它们也倾向于对开发者最友好的 UX 交互（即开发者体验，或 DX）。\n\n在某些情况下，在输入短小的 JS 代码段时，优先考虑 DX 而非处理完整\
    \ JS 程序时预期的常规严格步骤，会导致程序与工具之间的代码行为上产生可观测的差异。例如，适用于 JS 程序的某些错误条件在代码被输入开发者工具时，可能会被放宽且不显示。\n\
    \n关于我们这里对作用域的讨论，此类可观测的行为差异可能包括：\n\n- 全局作用域的行为\n- 变量提升（见第 5 章）\n- 在最外层作用域中使用块级作用域声明符（`let`\
    \ / `const`，见第 6 章）\n\n尽管使用控制台/REPL 似乎在最外层作用域中输入的语句是在真实的全局作用域中处理的，但这并不完全准确。此类工具通常在某种程度上模拟了全局作用域；它是模拟，而不是严格遵守。这些工具环境优先考虑开发者的便利性，这意味着在某些（例如我们目前关于作用域的讨论），观察到的行为可能会偏离\
    \ JS 规范。\n\n结论是，开发者工具虽然针对各种开发者活动进行了优化，使其方便且有用，但并不适合确定或验证实际 JS 程序上下文显式且微妙行为的环境。\n\
    \n## ES 模块 (ESM)\n\nES6 引入了对模块模式原生支持（在第 8 章介绍）。使用 ESM 最明显的影响之一是它改变了文件中可观测的顶层作用域的行为。\n\
    \n回想早之前的这段代码段（我们将通过 `export` 关键字将其调整为 ESM 格式）：\n\n```javascript\nvar studentName\
    \ = \"Kyle\";\n\nfunction hello() {\n  console.log(`Hello, ${studentName}!`);\n\
    }\n```\n\n```javascript\nhello();\n// Hello, Kyle!\n\nexport hello;\n```\n\n如果该代码位于一个作为\
    \ ES 模块加载的文件，它的运行方式仍然完全相同。然而，从整个应用程序的角度来看，其可观测的影响将是不同的。\n\n尽管声明在（模块）文件的顶层，即最外层明显的作用域中，`studentName`\
    \ 和 `hello` 并不是全局变量。相反，它们是模块范围内的，或者如果你愿意，可以被称为“模块全局变量”。\n\n然而，在模块中，没有一个隐式的“模块范围作用域对象”让这些顶层声明作为属性添加，就像当声明出现在非模块\
    \ JS 文件的顶层那样。这并不是说在这些程序中不能存在或访问全局变量。只是全局变量不会通过在模块的顶层作用域中声明变量来创建。\n\n模块的顶层作用域继承自全局作用域，几乎就像模块的所有内容都被封装在一个函数一样。因此，存在于全局作用域中的所有变量（无论它们是否在全局对象上！）都可以作为模块作用域内部的词法标识符可用。\n\
    \nESM 鼓励减少对全局作用域的依赖，你根据需要导入当前模块运行所需的任何模块。因此，你较少地看到对全局作用域或其全局对象的使用。\n\n然而，如之前提到的，有很多\
    \ JS 和 Web 全局变量你将继续从全局作用域访问它们，无论你是否意识到这一点！\n\n## Node\n\nNode 经常让 JS 开发者感到意外的一个方面是，Node\
    \ 将它加载的每一个 `.js` 文件（包括你启动 Node 进程的主文件）都视为一个模块或 CommonJS 模块（见第 8 章）。实际效果是，你的 Node\
    \ 程序的顶层永远不是真正的全局作用域，不像在浏览器中加载非模块文件时那样。\n\n截至本文写作时，Node 最近添加了对 ES 模块的支持。但此外，Node\
    \ 从一开始就支持一种被称为“CommonJS”的模块格式，它看起来如下：\n\n```javascript\nvar studentName = \"Kyle\"\
    ;\n\nfunction hello() {\n    console.log(`Hello, ${studentName}!`);\n}\n\nhello();\n\
    // Hello, Kyle!\n\nmodule.exports.hello = hello\n```\n\n在处理之前，Node 有效地将此类代码封装在一个函数中，以便\
    \ `var` 和 `function` 声明包含在该封装函数的作用域内，**而不是**被视为全局变量。\n\n想象上述代码被 Node 视为如下：\n\n\
    ```javascript\nfunction(module, exports, __dirname) {\n    var studentName = \"\
    Kyle\";\n\n    function hello() {\n        console.log(`Hello, ${studentName}!`);\n\
    \    }\n\n    hello();\n    // Hello, Kyle!\n\n    module.exports.hello = hello\n\
    }\n```\n\n你在这里清楚地看到为什么 `studentName` 和 `hello` 不是全局的，而是模块中声明的。\n\n## 全局 this\n\
    \n回顾我们为止过的 JS 环境，程序可能也可能不会：\n\n- 在顶层作用域用 `var` 或 `function` 声明全局变量——或使用 `let`、`const`\
