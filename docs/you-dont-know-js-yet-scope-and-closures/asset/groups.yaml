- md: "\nAppendix A: Exploring Further\n\n190\n\nThe id = 5 assignment makes the divergence\
    \ observable, where the id parameter stays 3 and the local variable becomes 5.\n\
    \nMy advice to avoid getting bitten by these weird nuances:\n\n- Never shadow\
    \ parameters with local variables\n- Avoid using a default parameter function\
    \ that closes over any of the parameters\n\nAt least now you're aware and can\
    \ be careful about the fact that the parameter list is its own scope if any of\
    \ the parameters are non-simple.\n\n## Function Name Scope\n\nIn “Function Name\
    \ Scope” section in Chapter 3, I asserted that the name of a function expression\
    \ is added to the function’s own scope. Recall:\n\n```\nvar askQuestion = function\
    \ ofTheTeacher() {\n  // /\n};\n```\n\nIt's true that ofTheTeacher is not added\
    \ to the enclosing scope (where askQuestion is declared), but it's also not just\
    \ added to the scope of the function, the way you're likely assuming. It's another\
    \ strange corner case of implied scope.\n\nThe name identifier of a function expression\
    \ is in its own implied scope, nested between the outer enclosing scope and the\
    \ main inner function scope.\n\nIf ofTheTeacher was in the function's scope, we'd\
    \ expect an error here:\n\n> You Don’t Know JS Yet: Scope & Closures\n\nAppendix\
    \ A: Exploring Further\n\n191\n\n```\nvar askQuestion = function ofTheTeacher{\n\
    \  // why is this not a duplicate declaration error?\n  let ofTheTeacher = \"\
    Confused, yet\";\n};\n```\n\nThe let declaration does not allow re-declaration\
    \ (see Chapter 5). But this is perfectly legal shadowing, not re-declaration,\
    \ because the two ofTheTeacher identifiers are in separate scopes.\n\nYou’ll rarely\
    \ run into any case where the scope of a function’s name identifier matters. But\
    \ again, it’s good to know how these mechanisms actually work. To avoid being\
    \ bitten, never shadow function identifiers.\n\n## Anonymous vs. Named Functions\n\
    \nAs discussed in Chapter 3, functions can be expressed either in named or anonymous\
    \ form. It’s vastly more common to use the anonymous form, but is that a good\
    \ idea?\n\nAs you contemplate naming your functions, consider:\n\n- Name inference\
    \ is incomplete\n- Lexical names allow self-reference\n- Names are useful descriptions\n\
    - Arrow functions have no lexical names\n- IIFEs also need names\n\n## Explicit\
    \ or Inferred Names?\n\nEvery function in your program has a purpose. If it doesn’t\
    \ have a purpose, take it out, because you’re just wasting space. If it does have\
    \ a purpose, there is a name for purpose.\n\n# Appendix A: Exploring Further\n\
    \nSo far many readers likely agree with me. But does that mean we should always\
    \ put that name into the code? Here's where I'll raise than a few eyebrows. I\
    \ say, unequivocally, yes!\n\nFirst of all, \"anonymous\" showing up in stack\
    \ traces is just not all that happen to debugging:\n\n```\nbtn.addEventListener(\"\
    click\",function() {\n  setTimeout(function() {\n    [\"a\",42].map(function(v)\
    \ {\n      console.log(v.toUpperCase());\n    });\n  },100);\n});\n// Uncaught\
    \ TypeError: Cannot read property\n// 'toUpperCase' of null\n// at myProgram.js:4\n\
    // at Array.map (<anonymous>)\n// at myProgram.js:3\n```\n\nUgh. Compare to what\
    \ is reported if I give the functions names:\n\n```\nbtn.addEventListener(\"click\"\
    ,function onClick() {\n  setTimeout(function() {\n    [\"a\",42].map(function\
    \ allUpper(v) {\n      console.log(v.toUpperCase());\n    });\n  },100);\n});\n\
    // Uncaught TypeError: v.toUpperCase is not a function\n// at allUpper (myProgram.js:4)\n\
    // at Array.map (<anonymous>)\n// at waitMoment (myProgram.js:3)\n```\n\nAppendix\
    \ A: Exploring Further\n\nSee how waitAMoment and allUpper names appear and give\
    \ the stack trace more useful information/context for debugging? The program is\
    \ more debuggable if we use reasonable names for all our functions.\n\n# Appendix\
    \ A: Exploring Further\n\n# Note\n\nThe unfortunate \"<anonymous>\" that still\
    \ shows up to the fact that the implementation of Array.map(..) isn't present\
    \ in our program, but is built into the JS engine. It's not from any confusion\
    \ our program introduces with readability shortcuts.\n\nBy the way, let's make\
    \ sure we're on the same page about what a named function is:\n\n```\nfunction\
    \ thisIsNamed() {\n  //\n}\n```\n\n```\najax(\"some.url\",function thisIsAlsoNamed()\
    \ {\n  //\n});\n```\n\n```\nvar notNamed = function(){\n  //\n};\n```\n\n```\n\
    makeRequest({\n  data: 42,\n  cb /* also not a name */: function(){\n    //\n\
    \  }\n});\n```\n\n```\nvar stillNotNamed = function butThisIs(){\n  //\n};\n```\n\
    \n\"But Wait!\", you say. Some of those are are named, right?!\n\n```\nvar notNamed\
    \ = function(){\n  //\n};\n```\n\n```\nvar config = {\n  cb: function(){\n   \
    \ //\n  }\n};\n```\n\n```\nnotNamed.name;\n// notNamed\n```\n\n```\nconfig.cb.name;\n\
    // cb\n```\n\nThese are referred to as inferred names. Inferred names are fine,\
    \ but they don't really address the full concern I'm discussing.\n\n# Missing\
    \ Names\n\nAppendix A: Exploring Further\n\n212\n\nAppendix A: Exploring Further\n\
    \n213\n\nAppendix A: Exploring Further\n\n214\n"
  mdcn: "\n附录 A：进一步探索\n\n190\n\n`id = 5` 的赋值使得这种差异变得可见，此时 `id` 参数保持为 3，而局部变量变为 5。\n\
    \n为了避免被这些奇怪的细节坑，我的建议是：\n\n- 永远不要用局部变量来屏蔽参数\n- 避免使用闭包了任何参数的默认参数函数\n\n至少你现在意识到了这一点，并且可以注意如果任何参数不是简单类型，参数列表就有它自己的作用域。\n\
    \n## 函数名作用域\n\n在第 3 章的“函数名作用域”节中，我断言函数表达式的名字会被添加到函数自身的作用域中。回想：\n\n```\nvar askQuestion\
    \ = function ofTheTeacher() {\n  // /\n};\n```\n\n`ofTheTeacher` 确实没有被添加到外部作用域（即声明\
    \ `askQuestion` 的地方），但它不仅仅是被添加到函数作用域中（正如你可能认为的那样）。它是另一个关于隐含作用域的奇怪边缘情况。\n\n函数表达式的名称标识符位于自身的隐含作用域中，嵌套在外部闭包作用域和主内部函数作用域之间。\n\
    \n如果 `ofTheTeacher` 在函数的作用域中，我们本应该在这里看到一个错误：\n\n> 你并不懂 JS：作用域与闭包\n\n附录 A：进一步探索\n\
    \n191\n\n```\nvar askQuestion = function ofTheTeacher{\n  // 为什么这不是重复声明错误？\n \
    \ let ofTheTeacher = \"Confused, yet\";\n};\n```\n\n`let` 声明不允许重复声明（参见第 5 章）。但这是完全合法的屏蔽（shadowing），而不是重复声明，因为两个\
    \ `ofTheTeacher` 标识符处于不同的作用域中。\n\n你很少会遇到函数名标识符的作用域至关重要的情况。但再次，了解这些机制的实际原理是有好处的。为了避免被坑，永远不要屏蔽函数标识符。\n\
    \n## 匿名函数 vs. 命名函数\n\n正如第 3 章所讨论的，函数可以以命名或匿名的形式表示。使用匿名形式要常见得多，但这是一个个好主意吗？\n\n\
    当你考虑为你的函数命名时，请思考一下：\n\n- 名称推断是不完全的\n- 词法名称允许自引用\n- 名称是有有用的描述\n- 箭头函数没有词法名称\n-\
    \ IIFE 也需要名称\n\n## 显式名称还是推断名称？\n\n你程序中的每个函数都有其目的。如果它没有目的，把它删掉，因为你是在浪费空间。如果它有目的，就有对应的名字。\n\
    \n# 附录 A：进一步探索\n\n到目前为止，许多读者可能同意我的观点。但是否意味着我们应该总是把那个名字写进代码里？这里我将提出一些挑性的观点。我毫无疑问地说：是的！\n\
    \n首先，在堆栈跟踪中出现“匿名”并不是调试时面临的全部问题：\n\n```\nbtn.addEventListener(\"click\",function()\
    \ {\n  setTimeout(function() {\n    [\"a\",42].map(function(v) {\n      console.log(v.toUpperCase());\n\
    \    });\n  },100);\n});\n// Uncaught TypeError: Cannot read property\n// 'toUpperCase'\
    \ of null\n// at myProgram.js:4\n// at Array.map (<anonymous>)\n// at myProgram.js:3\n\
    ```\n\n哎。对比一下如果我给函数命名，报告的内容是什么样的：\n\n```\nbtn.addEventListener(\"click\",function\
    \ onClick() {\n  setTimeout(function() {\n    [\"a\",42].map(function allUpper(v)\
    \ {\n      console.log(v.toUpperCase());\n    });\n  },100);\n});\n// Uncaught\
    \ TypeError: v.toUpperCase is not a function\n// at allUpper (myProgram.js:4)\n\
    // at Array.map (<anonymous>)\n// at waitMoment (myProgram.js:3)\n```\n\n附录 A：进一步探索\n\
    \n看 `waitAMoment` 和 `allUpper` 名称是如何出现并为堆栈跟踪提供更多有用的信息/上下文的？如果我们为所有函数使用合理的名称，程序将更易于调试。\n\
    \n# 附录 A：进一步探索\n\n# 注意\n\n仍然出现的遗憾的“<anonymous>”是因为 `Array.map(..)` 的实现并不在我们的程序中，而是内置在\
    \ JS 引擎中的。这并不是由于程序中的可读性快捷方式引入的混乱。\n\n顺便说一下，让我们确保在什么是命名函数上达成共识：\n\n```\nfunction\
    \ thisIsNamed() {\n  //\n}\n```\n\n```\najax(\"some.url\",function thisIsAlsoNamed()\
    \ {\n  //\n});\n```\n\n```\nvar notNamed = function(){\n  //\n};\n```\n\n```\n\
    makeRequest({\n  data: 42,\n  cb /* 同样不是名称 */: function(){\n    //\n  }\n});\n\
    ```\n\n```\nvar stillNotNamed = function butThisIs(){\n  //\n};\n```\n\n“等一下！”，你说。其中一些是命名的，对吧？？！\n\
    \n```\nvar notNamed = function(){\n  //\n};\n```\n\n```\nvar config = {\n  cb:\
    \ function(){\n    //\n  }\n};\n```\n\n```\nnotNamed.name;\n// notNamed\n```\n\
    \n```\nconfig.cb.name;\n// cb\n```\n\n这些被称为推断名称。推断名称是可以的，但它们并没有真正解决我正在讨论的全部担忧。\n\
    \n# 缺失的名称\n\n附录 A：进一步探索\n\n212\n\n附录 A：进一步探索\n\n213\n\n附录 A：进一步探索\n\n214\n\n"
