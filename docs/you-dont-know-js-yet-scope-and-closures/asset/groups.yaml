    \ real calculator, like reflecting what was just pressed, or computing the total\
    \ when pressing “=\".\n\nFor example:\n\n```javascript\ncalc(\"4\"); // 4\ncalc(\"\
    +\"); // +\ncalc(\"7\"); // 7\ncalc(\"3\"); // 3\ncalc(\"-\"); // -\ncalc(\"2\"\
    ); // 2\ncalc(\"=\"); // 75\ncalc(\"*\"); // *\ncalc(\"4\"); // 4\ncalc(\"=\"\
    ); // 300\ncalc(\"5\"); // 5\ncalc(\"-\"); // -\ncalc(\"5\"); // 5\ncalc(\"=\"\
    ); // 0\n```\n\nSince this usage is a bit clumsy, here’s a useCalc(..) helper,\
    \ that runs the calculator with characters one at a time from a string, and computes\
