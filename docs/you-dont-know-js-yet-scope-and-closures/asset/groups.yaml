  mdcn: "\n与最小必要能力相关，从安全角度来看，整个系统更加强大，因为某个部分的攻破或失败对系统的其余部分的影响降到了最低。\n\n如果说 POLP（最小权限原则）关注系统级组件设计，那么\
    \ POLE（最小暴露原则）变体则关注更低层次；我们将将其应用于作用域之间如何相互作用。\n\n在遵循 POLE 时，我们想要最小化暴露的是什么？简单来说：每个作用域中注册的变量。\n\
    \n这样想：为什么你不直接把程序中的所有变量都放在全局作用域呢？这听起来可能立刻是个坏主意，但值得考虑为什么会这样。当程序某部分使用的变量通过作用域暴露给程序的其他部分时，通常会产生三个主要的危害：\n\
    \n- **命名冲突（Naming Collisions）：** 如果你在程序的两个不同部分使用了常用且有效的变量/函数名，但该标识符来自同一个共享作用域（例如全局作用域），就会发生命名冲突。当一个部分以另一部分意想不到的方式使用该变量/函数时，极可能会发生错误。\n\
    \n例如，想象一下如果你所有的循环都使用单独的 `i` 索引变量，恰好一个函数中的循环在另一个函数的循环迭代期间运行，那么现在共享的 `i` 变量就会得到一个意料之外的值。\n\
    \n- **意外行为（Unexpected Behavior）：** 如果你暴露了本应对程序某部分是私有的变量/函数，将允许其他开发者以你无意图的方式使用它们，这可能会违反预期行为并导致错误。\n\
    \n## 第 6 章：限制作用域暴露\n\n例如，如果你暴露的程序某部分假设数组包含所有数字，但其他人的代码访问并修改了该数组以包含布尔值和字符串，那么你的代码可能会以意想不到的方式发生异常。\n\
    \n糟糕的是，私有细节的暴露会心怀不轨的人试图绕过你施加的限制，对你的软件部分执行不被允许的操作。\n\n- **意外依赖（Unintended Dependency）：**\
    \ 如果你不必要地暴露变量/函数，就会引导其他开发者去使用并依赖这些原本私有的部分。虽然这在今天不会破坏你的程序，但它在未来了一个重构危害，因为现在你无法那么容易地重构该变量或函数，而这可能会破坏你无法控制的软件其他部分。\n\
    \n例如，如果你的代码依赖于一个数字数组，而你决定使用其他数据结构比数组更好，你现在必须承担调整软件其他受影响部分的责任。\n\nPOLE 应用于变量/函数作用域时，本质上是说：默认只暴露最少必要的内容，将其他内容尽可能保持私有。在尽可能小且嵌套尽可能深的作用域中声明变量，而不是将所有内容放在全局（甚至是外层函数）作用域中。\n\
    \n如果你相应地设计软件，你就有更大的机会避免（或至少最小化）这三大危害。\n\n考虑一下：\n\n> 《你还懂 JS 吗：作用域与闭包\n\n```javascript\n\
    function diff(x,y) {\n  if (x > y) {\n    let tmp = x;\n    x = y;\n    y = tmp;\n\
    \  }\n  return y - x;\n}\n```\n\n```javascript\ndiff(3,7); // 4\ndiff(7,5); //\
    \ -2\n```\n\n在 `diff(..)` 函数中，我们想要确保 `y` 大于或等于 `x`，这样减去 `(y - x)` 的结果将为 0 或更大。如果\
    \ `x` 较大（结果将为负数！），我们使用 `tmp` 变量交换 `x` 和 `y`，以保持结果为正。\n\n在这个简单的示例中，`tmp` 位于 `if`\
    \ 块内部还是属于函数层级似乎并不重要——它绝对不应该是一个全局变量！然而，遵循 POLE 原则，`tmp` 应该尽可能在作用域中隐藏。我们将块级作用域 `tmp`（使用\
    \ `let`）限制在 `if` 块中。\n\n## 在普通（函数）作用域中隐藏\n\n现在应该清楚为什么在尽可能（最深嵌套）的作用域中隐藏变量和函数是重要的。但我们如何做到呢？\n\
    \n我们已经看到了 `let` 和 `const` 关键字，它们是块级声明符；稍后我们会详细介绍它们。但首先，关于在作用域中隐藏变量或函数？\n\n让我们考虑一个作用很有用的例子。例如，如果你暴露的程序某部分假设数组包含所有数字，但其他人的代码访问并修改了该数组以包含布尔值和字符串，那么你的代码可能会以意想不到的方式发生异常。\n\
    \n糟糕的是，私有细节的暴露会心怀不轨的人试图绕过你施加的限制，对你的软件部分执行不被允许的操作。\n\n- **意外依赖（Unintended Dependency）：**\
    \ 如果你不必要地暴露变量/函数，就会引导其他开发者去使用并依赖这些原本私有的部分。虽然这在今天不会破坏你的程序，但它在未来了一个重构危害，因为现在你无法那么容易地重构该变量或函数，而这可能会破坏你无法控制的软件其他部分。\n\
    \n例如，如果你的代码依赖于一个数字数组，而你决定使用其他数据结构比数组更好，你现在必须承担调整其他受影响部分的责任。\n\nPOLE 应用于变量/函数作用域时，本质上是说：默认只暴露最少必要的内容，将其他内容尽可能保持私有。`hideCache`\
    \ 函数唯一的用途就是创建一个让 `cache` 跨越调用持久的作用域。但为了让 `factorial` 访问 `cache`，我们必须在同一个作用域内定义\
    \ `factorial`。然后我们将函数引用并存储在外层作用域中，并命名为 `factorial`。现在当我们多次调用 `factorial(...)`\
    \ 时，其持久的缓存是隐藏的，仅供 `factorial(..)` 访问。\n\n"
