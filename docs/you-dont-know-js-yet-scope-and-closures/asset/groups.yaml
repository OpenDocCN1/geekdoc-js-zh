  - "[PAGE 212]\n\n# Appendix A: Exploring Further\n\n```\nfunction ajax(url,cb) {\n\
    \  console.log(cb.name);\n}\n```\n\n```\najax(\"some.url\",function() {\n  //\n\
    });\n// \"\"\n```\n\nOops. Anonymous function expressions passed as callbacks\
    \ are incapable of receiving an inferred name, so cb.name holds just the empty\
    \ string \"\". The vast majority of all function expressions, especially anonymous\
    \ ones, are used as callback arguments; none of these get a name. Relying on name\
    \ inference is incomplete, it's not just callbacks that fall short with inference\n\
    \nAnd it's not just callbacks that fall short with inference:\n\n```\nvar config\
    \ = {};\n```\n\n```\nconfig.cb = function() {\n  //\n};\n```\n\n```\nconfig.cb.name;\n\
    // \"\"\n```\n\n```\nvar [ noName ] = [ function(){} ];\nnoName.name\n// \"\"\n\
    ```\n\nAny assignment of a function expression that's not a simple assignment\
    \ will also fail name inferencing. So, in other words, unless you are careful\
    \ and intentional about it, essentially almost all anonymous function expressions\
    \ in your program will in fact have no name at all."
  - "[PAGE 213]\n\nName inference is just... not enough.\nAnd even if a function expression\
    \ does get an inferred name, that still doesn't count as being a full named function.\n\
    \n# Who am I?\n\nWithout a lexical name identifier, the function has no internal\
    \ way to refer to itself. Self-reference is important for things like recursion\
    \ and event handling:\n\n```\n// broken\nrunOperation(function(num){\n  if (num\
    \ <= 1) return 1;\n  return num * oopsNoNameToCall(num - 1);\n}\n\n// also broken\n\
    btn.addEventListener(\"click\",function(){n  console.log(\"should only respond\
    \ to one click!\");\n  btn.addEventListener(\"click\",oopsNoNameHere);\n});\n\
    ```\n\nLeaving off the lexical name from your callback makes it harder to reliably\
    \ self-reference the function. You could declare a variable in an enclosing scope\
    \ that references the function, but this variable is controlled by enclosing scope—so\
    \ it could be re-assigned, etc.—it's not as reliable as the function having its\
    \ own internal self-reference.\n\n# Names are Descriptors\n\nLastly, and I think\
    \ most importantly of all, leaving off a name from a function makes it harder\
    \ for the reader to tell what"
  - "[PAGE 214]\n\n# Appendix A: Exploring Further\n\nthe function's purpose is, at\
    \ a quick glance. They have to read\nmore of the code, including the code inside\
    \ the function, and\nt surrounding code outside the function, to figure it out.\n\
    \nConsider:\n\n```\n[ 1, 2, 3, 4, 5 ].filter(function(v){\n  return v % 2 == 1;\n\
    };\n// [ 1, 3, 5 ]\n```\n\n```\n[ 1, 2, 3, 4, 5 ].filter(function keepOnlyOdds(v){\n\
    \  return v % 2 == 1;\n};\n// [ 1, 3, 5 ]\n```\n\nThere's just no reasonable argument\
    \ to be made that omitting\nname keepOnlyOdds from the first callback more effec-\n\
    tively communicates to the reader the purpose of this call-\nback. You saved 13\
    \ characters, but most important readability\ninformation. The name keepOnlyOdds\
    \ very clearly tells the\nreader, at a quick glance, what's happening.\n\nThe\
    \ JS engine doesn't care about the name. But human\nreaders of your code at absolutely\
    \ do.\n\nCan the reader look at v % 2 == 1 and figure out what it's\ndoing? Sure.\
    \ They have to infer the purpose (and name) by\nmentally executing the code. Even\
    \ a brief pause to do so slows\ndown reading of the code. A good descriptive name\
    \ makes this\nprocess almost effortless and instant.\n\nThink of it this way:\
    \ how many times does the author of\nthis code need to figure out the purpose\
    \ of a function before\nadding the name to the code? About once. Maybe two or\
    \ three\ntimes if they need to adjust the name. But how many times"
- md: "\n# Appendix A: Exploring Further\n\nwill readers of this code have to figure\
    \ out the name/purpose? Every single time this line is ever read. Hundreds of\
    \ times? Thousands? More?\n\nNo matter the length or complexity of the function,\
    \ my assertion is, the author should figure out a good descriptive name and add\
    \ it to the code. Even the one-liner functions in map(..) and then(..) statements\
    \ should be named:\n\n```javascript\nlookupTheRecords(someData)\n.then(function\
    \ extractSalesRecords(resp){\n  return resp.allSales;\n})\n.then(storeRecords);\n\
    ```\n\nThe name extractSalesRecords tells the reader purpose of this then(..)\
    \ handler better than just inferring that purpose from mentally executing `return.allSales`.\n\
    \nThe only excuse for not including a name on a function is either laziness (don't\
    \ want to type a few extra characters) or uncreativity (can't come up with a good\
    \ name). If you can't figure out a good name, you likely don't understand the\
    \ function and its purpose yet. The function is perhaps poorly designed, or it\
    \ does too many things, and should be re-worked. Once you have a well-designed,\
    \ single-purpose function, its proper name should become evident.\n\nHere's a\
    \ trick I use: while writing a function, if I don't fully understand its purpose\
    \ and can't think of a good name to use, I just use TODO as the name. That way,\
    \ later when reviewing my code, I'm likely to find those name placeholders, and\
    \ I'm more inclined (and more prepared!) to go back and figure out a better name,\
    \ than just leave it as TODO.\n\nYou Don't Know JS Yet: Scope & Closures\n\n#\
    \ Arrow Functions\n\nAll functions need names. Every single one. No exceptions.\
    \ Any name you omit is making the program harder to read, harder to debug, harder\
    \ to extend and maintain later.\n\nArrow functions are always anonymous, even\
    \ if (rarely) they're used in a way that gives them an inferred name. I just spent\
    \ several pages explaining why anonymous functions are a bad idea, so you can\
    \ probably guess what I think about arrow functions.\n\nDon't use them as a general\
    \ replacement for regular functions. They're more concise, but that brevity comes\
    \ at the cost of omitting key visual delimiters that help our brains quickly parse\
    \ what we're reading. And, to the point of this discussion, they're anonymous,\
    \ which makes them worse for readability from angle as well.\n\nArrow functions\
    \ have a purpose, but that purpose is not to save keystrokes. Arrow functions\
    \ have lexical behavior, which is somewhat beyond the bounds of our discussion\
    \ in this book.\n\nBriefly: arrow functions don't define a identifier keyword\
    \ at all. If you use a `this` inside an arrow function, it behaves exactly as\
    \ any other variable reference, which is that the scope chain is consulted to\
    \ find a function scope (non-arrow function) where it is defined, and to use that\
    \ one.\n\nIn other words, arrow functions treat `this` like any other lexical\
    \ variable.\n\nIf you're used to hacks like `var self = this`, or if you prefer\
    \ to call `.bind(this)` on inner function expressions, just to force them to inherit\
    \ a `this` from an outer function like it was a lexical variable, then => arrow\
    \ functions are absolutely the better option. They’re designed specifically to\
    \ fix that problem.\n\nSo, in the rare cases you need lexical `this`, use an arrow\
    \ function. It’s the best tool for that job. But just be aware that in doing so,\
    \ you’re accepting the downsides of an anonymous function. You should expend additional\
    \ effort to mitigate the readability cost, such as more descriptive variable names\
    \ and code comments.\n\n# IIFE Variations\n\nAll functions should have names.\
    \ I said that a few times, right!? That includes IIFEs.\n\n```javascript\n(function()\
    \ {\n  // don't do this!\n})();\n```\n\n```javascript\n(function doThisInstead()\
    \ {\n  // ..\n})();\n```\n\nHow do we come up with a name for an IIFE? Identify\
    \ what the IIFE is there for. Why do you need a scope in that spot? Are you hiding\
    \ a cache variable for student records?\n\n# Appendix A: Exploring Further\n\n\
    ```javascript\nvar getStudents = (function StoreStudentRecords(){\n  var studentRecords\
    \ = [];\n\n  return function getStudents() {\n    // ..\n  }\n})();\n```\n\nI\
    \ named the IIFE StoreStudentRecords because that's what it's doing: storing student\
    \ records. Every IIFE should have a name. I said that a few times, right!? That\
