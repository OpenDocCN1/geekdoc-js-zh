    The first thing to notice about this code is that the lookup-Student(..) outer
    function creates and returns an inner function called greetStudent(.). lookupStudent(...)
    is called twice, producing two separate instances of its inner greetStudent(..)
    function, both of which are saved into the chosenStudents array.


    We verify that it''s the case by checking the .name property of the returned function
    saved in chosenStudents[0], and it''s indeed an instance of the inner greetStudent(..).


    After each call to lookupStudent(..) finishes, it would seem like all its inner
    variables would be discarded and GC''d (garbage collected). The inner function
    is the only thing that seems to be returned and preserved. But here''s where the
    behavior differs in ways we can start to observe.


    While greetStudent(..) does receive a single argument as the parameter greeting,
    it also makes reference to both students and studentID, identifiers which come
    from the enclosing scope of lookupStudent(..). Each of those references from the
    inner function to the variable in an outer scope is called a closure. In academic
    terms, each instance of greetStudent(..) closes over the outer variables students
    and studentID.'
  - '[PAGE 152]


    Chapter 7: Using Closures 135


    So what do those closures do here, in a concrete, observable sense?


    Closure allows greetStudent(..) continue to access those outer variables even
    after the scope is finished (when each call to lookupStudent(..) completes). Instead
    of the instances of students and studentID being GC''d, they stay around in memory.
    At a later time when either instance of the greetStudent(..) function is invoked,
    those variables are still there, holding their current values.


    If JS functions do not have closure, the completion of each lookupStudent(..)
    would immediately tear down its scope and GC the students and studentID variables.
    When we later called one of the greetStudent(..) functions, what would then happen?


    If greetStudent(..) tried to access what it thought was a BLUE(2) marble, but
    that marble did not actually exist (anymore), the reasonable assumption is we
    should get a ReferenceError, right?


    But we don''t get an error. The fact that the execution of chosenStudents[]("Hello")
    works and returns us the message "Hello, Sarah," means we were still able to access
    the students and studentID variables. This is a direct observation of closure!


