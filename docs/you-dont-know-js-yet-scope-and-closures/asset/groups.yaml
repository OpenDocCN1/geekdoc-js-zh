    until we arrived at the final RED(1) global scope.


    Similarly, studentID in the if-statement is determined to be a BLUE(2) marble.


    This suggestion of a runtime lookup process works well for conceptual understanding,
    but it''s not actually how things usually work in practice.


    The color of a marble''s bucket (aka, meta information of what scope a variable
    originates from) is usually determined during the compilation process. Because
    lexical scope is pretty finalized at that point, marble''s color will not change
    based on anything that can happen later during runtime.


    Since the marble''s color is known from compilation, and it''s immutable, this
    information would likely be stored with (or at least accessible from) each variable''s
    entry in the AST; that information is then used explicitly by the executable instructions
    that constitute the program''s runtime.


    In other words, Engine (from Chapter 2) doesn''t need to lookup through a bunch
    of scopes to figure out which scope bucket a variable comes from. That information
    is already known! Avoiding the need for a runtime lookup is a key benefit of lexical
    scope. The runtime operates more performantly without spending time on all these
    lookups.


