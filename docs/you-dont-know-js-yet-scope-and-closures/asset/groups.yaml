    }\n```\n\n```\nwhatsTheDealHere(3);\n// 5\n```\n\nThat snippet probably makes\
    \ sense, because the defaultID() arrow function closes over the id parameter/variable,\
    \ which we then re-assign to 5. But now let's introduce a shadowing definition\
    \ of id in the function scope:\n\n```\nfunction whatsTheDealHere(id,defaultID\
