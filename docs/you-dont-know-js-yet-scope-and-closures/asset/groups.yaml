    speed();      // \"slow\"\nspeed();      // \"medium\"\nspeed();      // \"fast\"\
    \nspeed();      // \"slow\"\n```\n\nThe corner case of passing in no values to\
    \ toggle(..) is not very important; such a toggler instance could just always\
    \ return undefined.\n\nTry the exercise for yourself, then check out the suggested\
    \ solution at the end of this appendix.\n\n## Closure (PART 3)\n\nIn this third\
