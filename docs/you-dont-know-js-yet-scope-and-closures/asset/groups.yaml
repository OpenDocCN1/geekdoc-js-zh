    So all the variables were definitely preserved via closure, despite not being
    explicitly referenced by the inner function. So does that disprove the per variable
    assertion in favor of per scope? Depends.


    Many modern JS engines do apply an optimization removes variables from a closure
    scope that aren''t explicitly referenced. However, as we see with eval(..), there
    are situations where such an optimization cannot be applied, and the closure scope
    continues to contain all its original variables. In other words, closure must
    be per scope, implementation wise, and then an optional optimization trims down
    the scope to only what was closed over (a similar outcome as per variable closure).


    Even as recent as a few years ago, many JS engines not apply this optimization;
    it''s possible your websites might still run in such browsers, especially on older
    or lower-end devices. It means that it''s possible that long-lived closures such
    as event handlers may be holding onto memory much longer than we would have assumed.


    And the fact that it''s an optional optimization in the first place, rather than
    a requirement of the specification, means that we shouldn''t just casually over-assume
    its applicability.'
