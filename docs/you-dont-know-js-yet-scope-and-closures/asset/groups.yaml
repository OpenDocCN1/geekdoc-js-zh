    \ in how and when variables come into existence and become available to the program.\n\
    \n## When Can I Use a Variable?\n\nAt what point does a variable become available\
    \ to use within its scope? There may seem to be an obvious answer: after the variable\
    \ has been declared/created. Right? Not quite.\n\nConsider:\n\n```\ngreeting();\n\
    // Hello!\n\nfunction greeting() {\n  console.log(\"Hello!\");\n}\n```\n\nThis\
    \ code works fine. You may have seen or even written code like before. But did\
