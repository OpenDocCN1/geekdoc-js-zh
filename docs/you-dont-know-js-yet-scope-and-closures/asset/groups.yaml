    ## Chapter 1: What’s the Scope?


    By the time you''ve written your first few programs, you’re likely getting somewhat
    comfortable with creating variables and storing values in them. Working with variables
    is one of the most foundational things we do in programming!


    But you may not have considered very closely the underlying mechanisms used by
    the engine to organize and manage these variables. I don''t mean how the memory
    is allocated on the computer, but rather: how does JS know which variables are
    accessible by any given statement, and how does it handle two variables of the
    same name?


    The answers to questions like these take the form of well-defined rules called
    scope. This book will dig through all aspects of scope—how it works, what it’s
    useful for, gotchas to avoid—and then point toward common scope patterns that
    guide the structure of programs.


    Our first step is to uncover how the JS engine processes our program **before**
    runs.


    ## About This Book


    Welcome to book 2 in the *You Don’t Know JS Yet* series! If you already finished
    *Get Started* (the first book), you’re in the right spot! If not, before you proceed
    I encourage you to go there for the best foundation.


    Our focus will be the first of three pillars in the JS language: the scope system
    and its function closures, as well as the power of the module design pattern.


    JS is typically classified as an interpreted scripting language, so it''s assumed
    by most that JS programs are processed in a single, top-down pass. But JS is in
    fact parsed/compiled in a separate phase before execution begins. The code author''s
    decisions on where to place variables, functions, and blocks with respect to each
    other are analyzed according to the rules of scope, during the initial parsing/compilation
    phase. The resulting scope structure is generally unaffected by runtime conditions.


    JS functions are themselves first-class values; they can be assigned and passed
    around just like numbers or strings. since these functions hold and access variables,
    they maintain their original scope no matter where in the program the functions
    are eventually executed. This is called closure.


    Modules are a code organization pattern characterized by public methods that have
    privileged access (via closure) to hidden variables and functions in the internal
    scope of the module.


    ### Compiled vs. Interpreted


    You may have heard of code compilation before, but perhaps it seems like a mysterious
    black box where source code slides into one end and executable programs pop out
    the other.


    It’s not mysterious or magical, though. Code compilation is a set of steps that
    process the text of your code and turn it into a list of instructions the computer
    can understand. Typically, the whole source code is transformed at once, and those
    resulting instructions are saved as output (usually in a file) that can later
    be executed.


    You may also have heard that code can be interpreted, so how is that different
    from being compiled?


    Interpretation performs a similar task to compilation, in that it transforms your
    program into machine-understandable instructions. Unlike a program being compiled
    all at once, with interpretation the source code is transformed line by line;
    each line or statement is executed before immediately proceeding to processing
    the next line of the source code.


    ### Compilation:


    ![](img/14a2f9063d3ac52e6a98517a7d87857f_20_0)


    ### Interpretation:


    ![](img/14a2f9063d3ac52e6a98517a7d87857f_20_1)


    Fig. 1: Compiled vs. Interpreted Figure 1 illustrates compilation vs. interpretation.


    Are these two models mutually exclusive? Generally, yes. However, the issue is
    more nuanced, because interpretation can actually take other forms than just line
    by line. Modern JS engines actually employ numerous variations of both compilation
    and interpretation.


    Recall that we surveyed this topic in Chapter 1 of the Get Started book. Our conclusion
    is that JS is most accurately portrayed as a compiled language. For the benefit
    of readers here, the following sections will revisit and expand on that assertion.


    ### Compiling Code


    But first, why does it even matter whether JS is compiled or not?


    Scope is primarily determined during compilation, so understanding how compilation
    and execution relate is key in mastering scope.


    In classic compiler theory, a program is processed by a compiler in three basic
    stages:


    - Tokenizing/Lexing: breaking a string of characters into meaningful (to the language)
    chunks, called tokens. For instance, consider the program: `var a = 2;`. This
    program would be broken up into the following tokens: `var`, `a`, `=`, `2`, and
    `;`. Whitespace may or not be persisted as a token, depending on whether or not
    (The difference between tokenizing and lexing is subtle and academic, but it centers
    on or not these tokens are identified in a stateless or stateful way. Put simply,
    if the tokenizer were to invoke stateful parsing rules to figure out whether a
    should be a distinct token or just part of another token, that would be lexing.)

    - Parsing: taking a stream (array) of tokens and turning it into a tree of nested
    elements, which collectively represent the grammatical structure of the program.
    This is called an Abstract Syntax Tree (AST). For example, the tree for var a
    = 2; might start with a top-level node VariableDeclaration, with a child node
    Identifier (whose value is a), and another child AssignmentExpression which itself
    has a child NumericLiteral (whose value is 2).

    - Code Generation: taking an AST and turning it into executable code. This part
    varies greatly depending on the language, the platform''s targeting, and other
    factors. The JS engine takes the just described AST for var a = 2; and turns it
    into a set of machine instructions to actually create a variable called a (including
    reserving memory, etc.), and then store a value into a.


    # Note


    The implementation details of a JS engine (utilizing memory resources, etc.) is
    much deeper than that we will dig here. We''ll keep our focus on the observable
    behavior of our programs and let the JS engine manage those deeper system-level
    abstractions.


