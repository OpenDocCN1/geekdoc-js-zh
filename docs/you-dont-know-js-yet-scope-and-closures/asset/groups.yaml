    \ scope, even though its declaration may appear further down in the scope, is\
    \ called hoisting.\n\nBut hoisting doesn't fully answer the question. We can see\
    \ an identifier greeting from the beginning of the scope, but why can we call\
    \ the greeting() function before it's declared?\n\nIn other words, how does the\
