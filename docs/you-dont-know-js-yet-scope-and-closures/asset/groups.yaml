- md: "\n## Chapter 3: The Scope Chain\n\nThe studentName variable on line 1 (the\
    \ var studentName = .. statement) creates a RED(1) marble. The same named variable\
    \ is declared as a BLUE(2) marble on line 3, the parameter in the printStudent(..)\
    \ function definition.\n\nWhat color marble will be the studentName = studentName.toUpperCase()\
    \ assignment statement and the console.log(studentName) statement? All three studentName\
    \ references will be BLUE(2).\n\nWith the conceptual notion of the “lookup,” we\
    \ asserted it starts with the current scope and works its outward/upward, storing\
    \ as soon as a matching variable is found. The BLUE(2) studentName is found right\
    \ away. The RED(1) studentName is never even considered.\n\nThis is a key aspect\
    \ of lexical behavior, called shadowing. The BLUE(2) studentName variable (parameter)\
    \ shadows the RED(1) studentName. So, the parameter is shadowing the (shadowed)\
    \ global variable. Repeat that sentence to yourself a few times to make sure you\
    \ have the terminology straight!\n\nThat's why the re-assignment of studentName\
    \ affects only the inner (parameter) variable: the BLUE(2) studentName, not the\
    \ global RED(1) studentName.\n\nWhen you choose to shadow a variable from an outer\
    \ scope, one direct impact is from that scope inward/downward (through any nested\
    \ scopes) it's now impossible for any marble to be colored as the shadowed variable—RED(1),\
    \ in this case). In other words, any studentName identifier reference will correspond\
    \ to that parameter variable, never the global studentName variable. It's lexically\
    \ impossible to reference the global studentName anywhere inside the printStudent(..)\
    \ function (or from any nested scopes).\n\n## Global Unshadowing Trick\n\nPlease\
    \ beware: leveraging the technique I'm about to describe is not very good practice,\
    \ as it's limited in utility, confusing for readers of your code, and likely to\
    \ invite bugs to your program. I'm covering it only because you may run across\
    \ this behavior in existing programs, and understanding what's happening is critical\
    \ to not getting tripped up.\n\nIt is possible to access a global variable from\
    \ a scope where that variable has been shadowed, but not through a typical lexical\
    \ identifier.\n\nIn the global scope (RED(1)), var declarations and function declarations\
    \ also expose themselves as properties (of the same name as the identifier) on\
    \ the global object—essentially an object representation of the global scope.\
    \ If you've written JS for a browser environment, you probably recognize the global\
    \ object as window. That's not entirely accurate, but it's good enough for our\
    \ discussion. In the next chapter, we'll explore the global/object topic more.\n\
    \nConsider this program, specifically executed as a standalone .js file in a browser\
    \ environment:\n\n```javascript\nvar studentName = \"Suzy\";\n\nfunction printStudent(studentName)\
    \ {\n  console.log(studentName);\n  console.log(window.studentName);\n}\n```\n\
    \n```javascript\nprintStudent(\"Frank\");\n// \"Frank\"\n// \"Suzy\"\n```\n\n\
    You Don't Know JS Yet: Scope & Closures\n\nNotice the window. The window.studentName\
    \ reference? This expression is accessing the global variable studentName as a\
    \ property on window (which we're pretending for now is synonymous with the global\
    \ object). That's the only way to access a shadowed variable from inside a scope\
    \ where the shadowing variable is present.\n\nThe window.studentName is a mirror\
    \ of the global studentName variable, not a separate snapshot copy. Changes to\
    \ one are still seen from the other, in either direction. You can think of window.studentName\
    \ as a getter/setter that accesses the actual studentName variable. As a matter\
    \ of fact, you can even add a variable to the global scope by creating/setting\
    \ a property on the global object.\n\n## Warning\n\n> Remember: just because you\
    \ can doesn't mean you should. Don't shadow a global variable that you need to\
    \ access, and conversely, avoid using this trick to access a global variable that\
    \ you've shadowed. And definitely don't confuse readers of your code by creating\
    \ global variables as window properties instead of formal declarations!\n\nThis\
    \ little \"trick\" only works for accessing a global scope variable (not a shadowed\
