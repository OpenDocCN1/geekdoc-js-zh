    \n### 有什么坑？\n\n到目前为止，我们认为 `var` 和参数是函数作用域的，而 `let/const` 表示块作用域声明。这里有一个需要注意的小例外：`catch`\
    \ 子句。\n\n自从 ES3（1999年）引入 `try..catch` 以来，`catch` 子句一直额外的（不为人知的）块作用域声明能力：\n\n```javascript\n\
    try {\n    doesntExist();\n} catch (err) {\n    console.log(err);\n    // ReferenceError:\
    \ 'doesntExist' is not defined\n    // ^^^ 从捕获的异常打印的消息\n\n    let onlyHere = true;\n\
    \    var outerVariable = true;\n}\n\nconsole.log(outerVariable); // true\nconsole.log(err);\n\
    // ReferenceError: 'err' is not defined\n// ^^^ 这是另一个抛出的（未捕获）异常\n```\n\n由 `catch`\
    \ 子句声明的 `err` 变量的作用域限制在该块中。此 `catch` 子句可以通过 `let` 包含其他块作用域声明。但此块内部的 `var` 声明仍然属于外部函数/全局作用域。\n\
    \n## 第 6 章：限制作用域暴露\n\nES2019（编写本文时最近）更改了 `catch` 子句，使其声明变为可选；如果省略了声明，`catch` 块在（默认情况下）不再是一个作用域；但尽管如此，它仍然是一个块！\n\
    \n所以，如果你需要对发生异常的情况做出反应（以便能够优雅地恢复），但你不关心错误值本身，你可以省略 `catch` 声明：\n\n```javascript\n\
