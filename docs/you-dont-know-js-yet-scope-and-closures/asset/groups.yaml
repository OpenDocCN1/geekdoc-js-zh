    # Foreword


    If I look over the books on my bookshelf, I can clearly see which of these titles
    are well loved. Well loved in this sense meaning they are little worn. Their binding
    is broken, their pages are tattered, there might even be a spilled drink smear.


    Scope and Closures (1st ed.) is one of my most loved books. It''s small, but the
    binding is coming undone. The pages are worn and dog-eared. It''s a bit rumpled.
    It''s not a book I''ve read once. I picked it up again and again in the many years
    since it was originally published. For me, it''s also a benchmark for my own personal
    progression through JavaScript. When I first read it in 2014, I was familiar with
    the concepts but the depth of my understanding was admittedly not as deep as the
    thin volume.


    Over the years, even though I wasn''t necessarily feeling my own improvement on
    a day-to-day basis, each one of the concepts became more approachable. I''d smile
    to myself, realizing how far I''ve come with the help of these guides.


    When Kyle asked me to write the Foreword for the 2nd edition, I was floored. It''s
    not often you''re asked to write about a book that''s been so formative for your
    own understanding and career, Scope and Closures in particular. I remember the

