    \ maxID) {\n  // ..\n```\n\nAssuming left-to-right operations, the default = maxID\
    \ for the studentID parameter requires a maxID to already exist (and to have been\
    \ initialized). This code produces a TDZ error (Chapter 5). The reason is that\
    \ maxID is declared in the parameter scope, but it’s not yet been initialized\
    \ because of the order of parameters. If the parameter order is flipped, no TDZ\
    \ error occurs:\n\n```\nfunction getStudentName(maxID,studentID = maxID) {\n \
    \ // ..\n```\n\nThe complication gets even more in the weeds if we introduce a\
    \ function expression into the default parameter position,"
  - "[PAGE 205]\n\n# Appendix A: Exploring Further\n\nwhich then can create its own\
