    );\n```\n\nSimilar to the classic module format, the publicly exported methods\
    \ of a CommonJS module’s API hold closures over the internal module details. That’s\
    \ how the module state is maintained across the lifetime of your program.\n\n\
    ## Note\n\nIn Node require(\"student\") statements, non-absolute paths(\"student\"\
    ) assume a \".js\" extension and search \"node_modules\".\n\n## Modern ES Modules\
    \ (ESM)\n\nThe ESM format shares several similarities with the CommonJS format.\
    \ ESM is file-based, and module instances are singletons, with everything private\
    \ by default. One notable difference is that ESM files are assumed to be strict-mode\
