- md: "\noutweighed by the potential risks in the future for confusion by other developers,\
    \ or variances in how your code runs in other JS environments.\nFiB is not worth\
    \ it, and should be avoided.\n\n## Blocked Over\n\nThe point of lexical scoping\
    \ rules in a programming language is so we can appropriately organize our program’s\
    \ variables, both for operational as well as semantic code communication purposes.\n\
    \nAnd one of the most important organizational techniques is to ensure that no\
    \ variable is over-exposed to unnecessary scopes (POLE). Hopefully you now appreciate\
    \ block scoping much more deeply than before.\n\nHopefully by you feel like you’re\
    \ standing on much more solid ground with understanding lexical scope. From that\
    \ base, the next chapter jumps into the weighty topic of closure.\n\n## Chapter\
    \ 7: Using Closures\n\nUp to this point, we've focused on the ins and outs of\
    \ lexical scope, and how that affects the organization and usage of variables\
    \ in our programs.\n\nOur attention shifts broader in abstraction, to the historically\
    \ somewhat daunting topic of closure. Don't worry! You don't need an advanced\
    \ computer science degree to make sense of it. Our broad goal in this book is\
    \ not merely to understand scope, but to more effectively use it in the structure\
    \ of our programs; closure is central to that effort.\n\nRecall the main conclusion\
    \ of Chapter 6: the least exposure principle (POLE) encourages us to use block\
    \ (and function) scoping to limit the scope of variables. This helps keep code\
    \ understandable and maintainable, and helps avoid many pitfalls (i.e- name collision,\
    \ etc.).\n\nClosure builds on this approach: for variables we need to use over\
    \ time, instead of placing them in larger outer scopes, we can encapsulate (more\
    \ narrowly scope) but then still preserve access from inside functions, for broader\
    \ use. Functions remember these referenced variables via closure.\n\nWe already\
    \ saw an example of this kind of closure in the previous chapter (factorial())\
    \ in Chapter 6), and you've almost certainly used it in your own programs. If\
    \ you've ever written a callback that accesses variables outside its own scope...\
    \ guess what?! That's closure.\n\nClosure is one of the most important language\
    \ characteristics ever invented in programming—it underlies major programming\
    \ paradigms, including Functional Programming (FP), modules, and even a bit of\
    \ class-oriented design. Getting comfortable with closure is required for mastering\
    \ JS and effectively leveraging many important design patterns throughout your\
    \ code.\n\nAddressing all aspects of closure requires a daunting mountain of discussion\
    \ and code through this chapter. Make sure to take your time and ensure you're\
    \ comfortable with each bit before moving onto the next.\n\n## See the Closure\n\
    \nClosure is originally a mathematical concept, from lambda calculus. But I'm\
    \ not going to list out math formulas or use a bunch of notation and jargon to\
    \ define it.\n\nInstead, I'm going to focus on a practical perspective. We'll\
    \ start by defining closure in terms of what we can observe in different behavior\
    \ of our programs, as opposed to if closure was not present in JS. However, later\
    \ in this chapter, we're going to flip closure around to look at it from an alternative\
    \ perspective.\n\nClosure is a behavior of functions and only functions. If you\
    \ aren't dealing with a function, closure does not apply. An object cannot have\
    \ closure, nor does a class have closure (though its functions/methods might).\
    \ Only functions have closure.\n\nFor closure to be observed, a function must\
    \ be invoked, and specifically it must be invoked in a different branch of the\
    \ scope chain from where it was originally defined. A function executing in the\
    \ same scope it was defined does not exhibit any noticeably different behavior\
    \ with or without closure being possible; by the observational perspective and\
    \ definition, that is not closure.\n\nLet’s look at some code, annotated with\
    \ its relevant scope bubble circles (see Chapter 2):\n\n```javascript\n// outer/global\
    \ scope: RED(1)\n\nfunction lookupStudent(studentID) {\n  // function scope: BLUE(2)\n\
    \n  var students = [\n    { id: 14, name: \"Kyle\" },\n    { id: 73, name: \"\
    Suzy\" },\n    { id: 112, name: \"Frank\" },\n    { id: 6, name: \"Sarah\" }\n\
    \  ];\n\n  return function greetStudent(greeting){\n    // function scope: GREEN(3)\n\
    \n    var student = students.find(\n      student => student.id == studentID\n\
    \    );\n\n    return `${greeting}, ${student.name}`;\n  };\n}\n\nvar greet =\
    \ lookupStudent(14);\nconsole.log(greet(\"Hello\")); // \"Hello, Kyle\"\nvar greetFrank\
    \ = lookupStudent(112);\nconsole.log(greetFrank(\"Hi\")); // \"Hi, Frank\"\n```\n\
    *(Note: The OCR text had some syntax errors in the code block, which have been\
    \ corrected to valid JS based on context)*\n\n## Chapter 7: Using Closures\n\n\
    Closure is one of the most important language characteristics ever invented in\
    \ programming—it underlies major programming paradigms, including Functional Programming\
    \ (FP), modules, and even a bit of class-oriented design. Getting comfortable\
    \ with closure is required for mastering JS and effectively leveraging many important\
    \ design patterns throughout your code.\n\nAddressing all aspects of closure requires\
    \ a daunting mountain of discussion and code through this chapter. Make sure to\
    \ take your time and ensure you're comfortable with each bit before moving onto\
    \ the next.\n\n## See the Closure\n\nClosure is originally a mathematical concept,\
    \ from lambda calculus. But I'm not going to list out math formulas or use a bunch\
    \ of notation and jargon to define it.\n\nInstead, I'm going to focus on a practical\
    \ perspective. We'll start by defining closure in terms of what we can observe\
    \ in different behavior of our programs, as opposed to if closure was not present\
    \ in JS. However, later in this chapter, we're going to flip closure around to\
    \ look at it from an alternative perspective.\n\nClosure is a behavior of functions\
    \ and only functions. If you aren't dealing with a function, closure does not\
    \ apply. An object cannot have closure, nor does a class have closure (though\
    \ its functions/methods might). Only functions have closure.\n\nFor closure to\
    \ be observed, a function must be invoked, and specifically it must be invoked\
    \ in a different branch of the scope chain from where it was originally defined.\
    \ A function executing in the same scope it was defined does not exhibit any noticeably\
    \ different behavior with or without closure being possible; by the observational\
    \ perspective and definition, that is not closure.\n\nLet’s look at some code,\
    \ annotated with its relevant scope bubble circles (see Chapter 2):\n\n```javascript\n\
    // outer/global scope: RED(1)\n\nfunction lookupStudent(studentID) {\n  // function\
    \ scope: BLUE(2)\n\n  var students = [\n    { id: 14, name: \"Kyle\" },\n    {\
    \ id: 73, name: \"Suzy\" },\n    { id: 112, name: \"Frank\" },\n    { id: 6, name:\
    \ \"Sarah\" }\n  ];\n\n  return function greetStudent(greeting){\n    // function\
    \ scope: GREEN(3)\n\n    var student = students.find(\n      student => student.id\
    \ == studentID\n    );\n\n    return `${greeting}, ${student.name}`;\n  };\n}\n\
    \nvar greet = lookupStudent(14);\nconsole.log(greet(\"Hello\")); // \"Hello, Kyle\"\
    \nvar greetFrank = lookupStudent(112);\nconsole.log(greetFrank(\"Hi\")); // \"\
    Hi, Frank\"\n```\n*(Note: The OCR text had some syntax errors in the code block,\
    \ which have been corrected to valid JS based on context)*\n\n## Pointed Closure\n\
    \nActually, we glossed over a little detail in the previous discussion which I'm\
    \ guessing many readers missed!\n\nBecause of how terse the syntax for => arrow\
    \ functions is, it's easy to forget that they still create a scope (as asserted\
    \ in “Arrow Functions” in Chapter 3). The student => student.id == studentID greetStudent(..)\
    \ function scope.\n\nBuilding on the metaphor of colored buckets and bubbles from\
    \ Chapter 2, if we were creating a colored diagram for this code, there's a fourth\
    \ scope at this innermost level, so we'd need a fourth color; perhaps we'd pick\
    \ ORANGE(4) for that scope:\n\n```javascript\nvar student = students.find(\nstudent\
    \ =>\n// function scope: ORANGE(4)\nstudent.id == studentID\n);\n```\n\nThe BLUE(2)\
    \ studentID reference is actually inside the ORANGE(4) scope rather than the GREEN(3)\
    \ scope of greetStudent(..); also, the student parameter of the arrow function\
    \ is ORANGE(4), shadowing the GREEN(3) student.\n\nThe consequence here is that\
    \ this function passed as a callback to the array's find(...) method has to hold\
    \ the closure over studentID, rather than greetStudent(..) holding that closure.\
    \ That's not too big of a deal, as everything still works as expected.\n\n## Adding\
    \ Up Closures\n\nLet’s examine one of the canonical examples often cited for closure:\n"
  mdcn: "\n为了避免未来对其他开发者产生混淆，或者在其他 JS 环境中运行时产生风险，这种做法是不值的，而且应该被避免。\n\n## 闭包\n\n编程语言中词法作用域的作用是为了让我们恰地组织程序的变量，既为了操作也为了语义目的。\n\
    \n最重要的技巧之一是确保变量不会被过度暴露（闭包）。这让你比以前更深入地理解词法作用域。希望你现在感觉自己站在了坚实的基础上，并且对闭包有了更深刻的理解。\n\
    \n## 第7 章：使用闭包\n\n到目前，我们关注了词法作用域的内部和外部，以及它如何影响程序变量的组织。\n\n我们的注意力转向了抽象——闭包。别担心！你不需要计算机科学学位也能理解它。本书的目标不仅仅是理解作用域，而是为了在整个代码中有效地利用许多设计模式。\n\
    \n闭包是编程领域发明的最语言特性之一——它是许多主流编程范式的基础，包括函数式编程（FP）、模块，甚至是面向对象的设计。掌握闭包是精通 JS 以及在代码中有效利用重要设计模式的基础。\n\
    \n处理闭包的所有方面需要本章中大量的讨论和代码。请确保你花时间，在进入下一节之前确保你理解了每一个部分。\n\n## 查看闭包\n\n闭包最初是一个数学概念，源自\
    \ lambda 演算。但我不会列出数学公式或使用大量的符号和术语来定义它。\n\n相反，我将从实战角度出发。我们将通过从我们程序的不同行为中可以观察到的现象来定义闭包，而不是假设\
    \ JS 中不存在闭包。然而，在本章的后部分，我们将转换视角，从另一个角度来看待。\n\n闭包是函数的行为，仅适用于函数。如果你处理的不是函数，闭包就不适用。对象不能拥有闭包，类也没有闭包（尽管它的方法可能）。\n\
    \n为了观察到闭包，函数必须被调用，并且特别是在它定义之外的不同作用域分支中被调用。在定义所在的作用域内执行函数，无论是否存在闭包，都不会表现出明显的不同行为；从观察和定义来看，那不是闭包。\n\
    \n让我们来看一些代码，并标注相关的作用域圈（见第2章）：\n\n```javascript\n// 外部/全局作用域：RED(1)\n\nfunction\
    \ lookupStudent(studentID) {\n  // 函数作用域：BLUE(2)\n\n  var students = [\n    {\
    \ id: 14, name: \"Kyle\" },\n    { id: 73, name: \"Suzy\" },\n    { id: 112, name:\
    \ \"Frank\" },\n    { id: 6, name: \"Sarah\" }\n  ];\n\n  return function greetStudent(greeting){\n\
    \    // 函数作用域：GREEN(3)\n\n    var student = students.find(\n      student => student.id\
    \ == studentID\n    );\n\n    return `${greeting}, ${student.name}`;\n  };\n}\n\
    \nvar greet = lookupStudent(14);\nconsole.log(greet(\"Hello\")); // \"Hello, Kyle\"\
