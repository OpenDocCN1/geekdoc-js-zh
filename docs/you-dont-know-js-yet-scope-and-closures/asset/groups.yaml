    \ `var`。学习这些工具，并让它们发挥各自的长处。\n\n## TDZ 到底是怎么？\n\nTDZ（时间死区）在第 5 章中解释过。我们说明了它是如何发生的，但我们略过了关于最初为什么要引入它的解释。让我们简要回顾一下\
    \ TDZ 的动机。\n\nTDZ 起源故事中的一些线索：\n\n- 常量不应该改变\n- 这完全关于时间\n- `let` 的行为应该更像 `const`\
    \ 还是 `var`？\n\n## 一切的开始\n\n实际上，TDZ 源自 `const`。\n在早期 ES6 开发期间，TC39 必须决定 `const`\
    \ 和 (`let`) 是否会提升到它们块的顶部。他们决定这些声明将提升，类似于 `var` 的做法。如果不是这样，我认为某些担心源于中间作用域遮蔽的混淆，例如：\n\
    \n```javascript\nlet greeting = \"Hi\";\n{\n  // 这里应该打印什么？\n  console.log(greeting);\n\
    \n  // 一些行代码\n  // 现在遮蔽了 `greeting` 变量\n  let greeting = \"Hello, friends!\";\n\
    }\n```\n\n"
