    ```javascript\nfunction getName(studentID) {\n  var student = records.find(\n\
    \    student => student.id == studentID\n  );\n  return student.name;\n}\n```\n\
    \nThe only change here is the export getName statement. As before, export statements\
    \ can appear anywhere throughout the file, though export must be at the top-level\
    \ scope; it cannot be inside any other block or function.\n\nESM offers a fair\
    \ bit of variation on how the export statements can be specified. For example:\n\
    \n```javascript\nexport function getName(studentID) {\n// ..\n}\n```\n\nEven though\
