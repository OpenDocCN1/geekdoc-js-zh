    \ a reference to at least one function that has closure over the hidden module\
    \ state (so that this state is actually preserved).\n\nYou’ll likely run across\
    \ other variations on this classic module approach, which we’ll look at in more\
    \ detail in Appendix A.\n\n## Node CommonJS Modules\n\nIn Chapter 4, we introduced\
    \ the CommonJS module format used by Node. Unlike the classic module format described\
    \ earlier, you could bundle the module factory or IIFE alongside any other code.\
    \ CommonJS modules are file-based; one module per file. Let's tweak our module\
    \ example to adhere to that format:\n\n```javascript\nmodule.exports.getName =\
    \ getName;\n\n// *****************************\nvar records = [\n  { id: 14, name:\
