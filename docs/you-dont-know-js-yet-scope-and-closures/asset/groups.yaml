  mdcn: "\n\n非默认导出被称为“命名导出”。\n\n`import` 关键字与 `export` 类似，它必须在 ESM 的顶层使用，不能位于任何块或函数内部——它在语法上也有变体。第一种被称为“命名导入”：\n\
    \n```javascript\nimport { getName } from \"/path/to/students.js\";\n```\n\n```\n\
    getName(73); // Suzy\n```\n\n如你所见，这种形式仅从模块导入特定命名的公共 API 成员（跳过任何未显式命名的内容），并将这些标识符添加到当前模块的顶层作用域中。对于习惯了\
    \ Java 等语言中包导入（package imports）的人来说，这种导入类型非常熟悉。\n\n可以在 `{ .. }` 中列出多个 API 成员，并用逗号分隔。命名导入还可以使用\
    \ `as` 关键字进行重命名：\n\n```javascript\nimport { getName as getStudentName }\nfrom\
    \ \"/path/to/students.js\";\n```\n\n```\ngetStudentName(73); // Suzy\n```\n\n\
