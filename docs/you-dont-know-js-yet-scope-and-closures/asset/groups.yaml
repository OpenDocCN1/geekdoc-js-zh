  - "[PAGE 220]\n\n# Appendix A: Exploring Further\n\n```\ngetStudents();\n```\n\n\
    ```\n// ..\nfunction getStudents() {\n  // ..\n}\n```\n\nThe function declaration\
    \ is hoisted during compilation, which means that getStudents is an identifier\
    \ declared for the entire scope. Additionally, the getStudents is auto-initialized\
    \ with the function reference, again at the beginning of the scope.\n\nWhy is\
    \ this useful? The reason I prefer to take advantage of function hoisting is that\
    \ it puts the executable code at the top, and any further declarations (functions)\
    \ below. This means it's easier to find the code that will run in any given area,\
    \ rather than having to scroll and scroll, hoping to find a trailing } marking\
