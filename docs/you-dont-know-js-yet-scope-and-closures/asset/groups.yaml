    lexically available scopes in the current file—see Get Started, Chapter 1, which
    asserts that each file is its own separate program from the perspective of JS
    compilation. If no declaration is found, that’s not necessarily an error. Another
    file (program) in the runtime may indeed declare that variable in the shared global
    scope.


    So the ultimate determination of whether the variable was ever appropriately declared
    in some accessible bucket may need to be deferred to the runtime.


    Any reference to a variable that’s initially undeclared is left as an colorless
    marble during file’s compilation; this color cannot be determined until other
    relevant file(s) have been compiled and the application runtime commences. That
    deferred lookup will eventually resolve the color to whichever scope is found
    in (likely the global scope).


    However, this lookup would only be needed once per variable at most, since during
    runtime could later change that marble’s color.


    The “Lookup Failures” section in Chapter 2 covers what happens if a marble is
    ultimately still uncolored at the moment its reference is runtime executed.


    # Shadowing


    “Shadowing” might sound mysterious and a little bit sketchy. Don’t worry, it’s
    completely legit!


    Our running example for these chapters uses different variable names across the
    scope boundaries. Since they all have unique names, in a way it wouldn’t matter
    if all of them were just stored in one bucket (like RED(1)).'
