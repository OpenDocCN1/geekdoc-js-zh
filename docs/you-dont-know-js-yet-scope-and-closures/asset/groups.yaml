  - "[PAGE 184]\n\n# Closer to Closure\n\nAs we close down a dense chapter, take some\
    \ deep breaths let it sink in. Seriously, that’s a lot of information for anyone\
    \ to consume! \n\nWe explored two models for mentally tackling closure:\n\n+ \
    \  - Observational: closure is a function instance remembering its outer variables\
    \ even as that function is passed to and invoked in other scopes.\n- Implementational:\
    \ closure is a function instance and its scope environment preserved in-place\
    \ while any references to it are passed around around and invoked from other scopes.\n\
    \nSummarizing the benefits to our programs:\n\n+   - Closure can improve efficiency\
    \ by allowing a function instance to remember previously determined information\
    \ instead of having to compute it each time.\n- Closure can improve code readability,\
    \ bounding scope-exposure by encapsulating variable(s) inside function instances,\
    \ while still making sure the information in those variables is accessible for\
    \ future use. The resultant narrower, more specialized function instances are\
    \ cleaner to interact with, since the preserved information doesn’t need to be\
    \ passed in every invocation.\n\nBefore you move on, take some time to restate\
    \ this summary in your own words, explaining what closure is and why it’s helpful\
    \ in your programs. The main book concludes with a final chapter that builds on\
    \ top of closure with the module pattern."
- md: "\n## Chapter 8: The Module Pattern\n\nIn this chapter, we wrap up the main\
    \ text of the book by exploring one of the most important code organization patterns\
    \ in all of programming: the module. As we'll see, modules are inherently built\
    \ from what we've already covered: the payoff for your efforts in learning lexical\
    \ scope and closure.\n\nWe've examined every angle of lexical scope, from the\
    \ breadth of the global scope down through nested block scopes, into the intricacies\
    \ of the variable lifecycle. Then we leveraged lexical scope to understand the\
    \ full power of closure.\n\nTake a moment to reflect on how far you've come in\
    \ this journey so far; you've taken big steps in getting to know JS more deeply!\n\
    \nThe central theme of this book has been that understanding and mastering scope\
    \ and closure is key in properly structuring and organizing our code, especially\
    \ the decisions on where to store information in variables.\n\nOur goal in this\
    \ final chapter is to appreciate how modules embody the importance of these topics,\
    \ elevating them from abstract concepts to concrete, practical improvements in\
    \ building programs.\n\n## Encapsulation and Least Exposure (POLE)\n\nEncapsulation\
    \ is often cited as a principle of object-oriented OO programming, but it's more\
    \ fundamental and broadly applicable than that. The goal of encapsulation is the\
    \ bundling or co-location of information (data) and behavior (functions) that\
    \ together serve a common purpose.\n\nIndependent of any syntax or code mechanisms,\
    \ the spirit of encapsulation can be realized in something as simple as using\
    \ separate files to hold bits of the overall program with common purpose. If we\
    \ bundle everything that powers a list of search results into a single file called\
    \ “search-list.js”, we encapsulate that part of the program.\n\nThe recent trend\
    \ in modern front-end programming to organize applications Component architecture\
    \ pushes encapsulation even further. For many, it feels natural to consolidate\
    \ everything that constitutes the search results—even beyond code, including presentational\
    \ markup and styling—into a single unit of program logic, something tangible we\
    \ can interact with. And then we label that collection “SearchList” component.\n\
    \nAnother key goal is the control of visibility of certain aspects of the encapsulated\
    \ data and functionality. Recall from Chapter 6 the least privilege principle\
    \ (POLE), which seeks to defensively guard against various dangers of scope exposure;\
    \ these affect both variables and functions. In JS, we most often implement visibility\
    \ control through the mechanics of lexical scope.\n\nThe idea is to group alike\
    \ program bits together, and selectively limit programmatic access to the parts\
    \ we consider private details. What’s not considered private is then marked as\
    \ public, accessible to the whole program.\n\nThe natural effect of this effort\
    \ is better code organization. It’s easier to build and maintain software when\
    \ we know where things are, with clear and obvious boundaries and connection points.\
    \ It’s also easier to maintain quality if we avoid the pitfalls of over-exposed\
    \ data and functionality.\n\nThese are some of the main benefits of organizing\
    \ JS programs into modules.\n\n## What Is a Module?\n\nA module is a collection\
    \ of related data and functions (often referred to as methods in this context),\
    \ characterized by a division between hidden private details and public accessible\
    \ details, usually called the “public API.”\n\nA module is also stateful: it maintains\
    \ some information over time, along with functionality to access and update that\
    \ information.\n\n> Note\n> A broader concern of the module pattern is fully embracing\
    \ system-level modularization through loose-coupling and other program architecture\
    \ techniques. That’s a complex topic well beyond the bounds of our discussion,\
    \ but is worth further study beyond this book.\n\nTo get a better sense of what\
    \ a module is, let’s compare some\n\n## Namespaces (Stateless Grouping)\n\nIf\
    \ you group a set of related functions together, without data then you don't really\
    \ have the expected encapsulation a module implies. The better term for this grouping\
    \ of stateless functions is a namespace:\n\n```javascript\n// namespace, not module\n\
    var Utils = {\n  cancelEvt(evt) {\n    evt.preventDefault();\n    evt.stopPropagation();\n\
    \    evt.stopImmediatePropagation();\n  },\n  wait(ms) {\n    return new Promise(function\
    \ c(res) {\n      setTimeout(res,ms);\n    });\n  },\n  isValidEmail(email) {\n\
    \    return /[^\\@]+@[^@]+\\.[^@]+*/.test(email);\n  }\n};\n```\n\nUtils here\
    \ are a useful collection of utilities, yet they're all state-independent functions.\
    \ Gathering functionality together is generally good practice, but that doesn't\
    \ make this a module. Rather, we've defined a Utils namespace and organized the\
    \ functions under it.\n\n## Data Structures (Stateful Grouping)\n\nEven if you\
    \ bundle data and functions together, if you are not limiting the visibility of\
    \ it, Student isn't a module. Consider:\n\n```javascript\n// data structure, not\
    \ module\nvar Student = {\n  records: [\n    { id: 14, name: \"Kyle\" },\n   \
    \ { id: 73, name: \"Suzy\" },\n    { id: 112, name: \"Frank\" },\n    { id: 6,\
    \ name: \"Sarah\" }\n  ],\n  getName(studentID) {\n    var student = this.records.find(\n\
    \      student => student.id == studentID\n    );\n    return student.name;\n\
    \  }\n}\n\nStudent.getName(73); // Suzy\n```\n\n## Modules (Stateful Access Control)\n\
    \nTo embody the full spirit of a module, we do not only need grouping and state,\
    \ but also access control through visibility (private vs public). Let’s turn Student\
    \ from the previous section into a module. We’ll start with a form I call the\
    \ “classic module” which was originally referred to as the “revealing module”\
    \ when it first emerged in the early 2000s. Consider:\n\n```javascript\nvar Student\
    \ = (function defineStudent() {\n  var records = [\n    { id: 14, name: \"Kyle\"\
    \ },\n    { id: 73, name: \"Suzy\" },\n    { id: 112, name: \"Frank\" },\n   \
    \ { id: 6, name: \"Sarah\" }\n  ];\n\n  var publicAPI = {\n    getName\n  };\n\
    \n  return publicAPI;\n\n  // *************************\n\n  function getName(studentID)\
    \ {\n    var student = records.find(\n      student => student.id == studentID\n\
    \    );\n    return student.name;\n  }\n}());\n\nStudent.getName(73); // Suzy\n\
    ```\n\nChapter 8: The Module Pattern\n\nStudent is now an instance of a module.\
    \ It features a public API with a single method: getName(..). This method is able\
    \ to access the private records data.\n\n## Warning\n\n> I should point out that\
    \ the explicit student data being hard-coded into this module is just for our\
    \ illustration purposes. A typical module in your program will receive this data\
    \ from an outside source, typically loaded from databases, JSON data files, Ajax\
    \ calls, etc. The data is injected into the module instance typically through\
    \ method(s) on the module's public API.\n\nHow does the classic module format\
    \ work?\n\nNotice that the instance of the module is created by the defineStudent()\
    \ IIFE being executed. This IIFE returns an object (named publicAPI) that has\
    \ a property on it referencing the inner getName(..) function.\n\nNaming the object\
    \ publicAPI is stylistic preference on my part. The object can be named whatever\
    \ you like (JS doesn't care), or you can return an object directly without assigning\
    \ it to any internal named variable. More on this choice in Appendix A.\n\nFrom\
    \ the outside, Student.getName(..) invokes this inner function, which maintains\
    \ access to the inner records variable via closure.\n\nYou don't have to return\
    \ an object with a function as one of its properties. You could just return a\
    \ function directly, in place of the object. That still satisfies all the core\
    \ bits of a classic module.\n"
  mdcn: "\n\n## 第 8 章：模块模式\n\n在本章中，我们将通过探索整个编程领域最重要的代码组织模式之一：模块，来结束本书的正文。正如我们所看到的，模块本质上是基于我们已经涵盖的内容构建的：即你学习词法作用域和闭包的回报。\n\
    \n我们已经了词法作用域的每一个角度，从全局作用域的广度到嵌套的块作用域，再到变量生命周期的复杂性。然后，我们利用词法作用域理解了闭包的所有威力。\n\n\
    请花一点时间回想一下在这一旅程中你已经走了多远；在更深入地了解 JS 方面你已经迈出了大步！\n\n本书的核心主题一直是：理解并掌握作用域与闭包是正确结构化和组织代码的关键，特别是关于在变量中存储信息的决策。\n\
    \n我们在最后这一章的目标是领会模块如何体现这些主题的重要性，将它们从抽象概念提升为构建程序时具体的、实用的改进。\n\n## 封装与最小暴露原则 (POLE)\n\
    \n封装通常被认为是面向对象（OO）编程的原则，但它比这更基础，应用也更广泛。封装的目标是将信息（数据）和行为（函数）进行打包或共同定位，它们共同服务于一个目的。\n\
    \n独立于任何语法或代码机制，封装的精神可以通过非常简单的手段实现，例如使用单独的文件来持有具有共同目的的整体程序片段。如果我们把驱动搜索结果列表的所有内容封装进一个名为“search-list.js”的单个文件中，我们就是封装了程序的这部分。\n\
    \n现代前端编程中组织应用程序的最新趋势——组件架构，将封装推向了更远。对于许多人来说，将构成搜索结果的所有内容——不仅是代码，还包括表现标记和样式——合并到单一的程序逻辑单元（一个我们可以与之交互的实体）中，是很自然的。然后我们将该集合标记为“SearchList”组件。\n\
    \n另一个关键目标是控制封装的数据和功能的某些层面的可见性。回想一下第 6 章的最小特权原则（POLE），它寻求防御性地防止作用域暴露带来的各种危险；这些危险同时影响变量和函数。在\
    \ JS 中，我们最常用通过词法作用域的机制来实现可见性控制。\n\n这种思想是将相似的程序片段组合在一起，并选择性地限制对我们认为是私有部分的程序的访问。不被视为私有的部分被标记为公开，供整个程序访问。\n\
    \n这种努力的自然结果是更好的代码组织。当我们知道东西在哪里，并且具有清晰而明显的边界和连接点时，构建和维护软件会变得更容易。如果我们能避免数据和功能过度暴露的陷阱，维护质量也会更容易。\n\
    \n这些是将 JS 程序组织成模块的一些主要益处。\n\n## 什么是模块？\n\n模块是相关数据和函数（在此语境下通常称为方法）的集合，其特征是隐藏的私有细节与公开可访问细节之间的划分，后者通常被称为“公共\
    \ API”。\n\n模块也是有状态的：它随着时间的推移维护某些信息，并具有访问和更新这些信息的功能。\n\n> 注意\n> 模块模式的一个更广泛的关注点是通过松耦合和其他程序架构技术来完全拥抱系统级模块化。这是一个复杂的课题，远远超出了我们讨论的范围，但值得在本书之外进一步研究。\n\
    \n为了更好地理解什么是模块，让我们比较一下一些\n\n## 命名空间（无状态分组）\n\n如果你将一组相关的函数组合在一起，但不包含数据，那么你并没有真正拥有模块所暗示的预期封装。这种无状态函数分组的更好术语是命名空间：\n\
    \n```javascript\n// 命名空间，不是模块\nvar Utils = {\n  cancelEvt(evt) {\n    evt.preventDefault();\n\
    \    evt.stopPropagation();\n    evt.stopImmediatePropagation();\n  },\n  wait(ms)\
    \ {\n    return new Promise(function c(res) {\n      setTimeout(res,ms);\n   \
    \ });\n  },\n};\n```\n\nUtils 在这里是一组有用的函数，但它们是状态独立的。\n\n## 数据结构（有状态分组）\n\n如果你把数据和函数组合在一起，但如果不限制它的可见性，它就一个模块。即使你把数据和函数打包在一起，考虑以下：\n\
    \n```javascript\n// 数据结构，不是模块\nvar Student = {\n  records: [\n    { id: 14, name:\
    \ \"Kyle\" },\n    { id: 73, name: \"Suzy\" },\n    { id: 112, name: \"Frank\"\
    \ },\n    { id: 6, name: \"Sarah\" }\n  ],\n  getName(studentID) {\n    var student\
    \ = this.records.find(\n      student => student.id == studentID\n    );\n   \
    \ return student.name;\n  }\n}\n```\n\nStudent.getName(73); // Suzy\n\n## 模块（有状态访问控制）\n\
    \n为了体现模块的完整精神，我们不仅需要分组和状态，还需要通过可见性（私有与公开）进行访问控制。让我们上一节的 Student 转换为模块。我们将从我称为“经典模块”的形式开始，它在\
    \ 20 世纪初出现时最初被称为“暴露模块”。：\n\n```javascript\nvar Student = (function defineStudent()\
    \ {\n  var records = [\n    { id: 14, name: \"Kyle\" },\n    { id: 73, name: \"\
    Suzy\" },\n    { id: 112, name: \"Frank\" },\n    { id: 6, name: \"Sarah\" }\n\
    \  ];\n\n  var publicAPI = {\n    getName\n  };\n\n  return publicAPI;\n\n  //\
    \ ********************\n\n  function getName(studentID) {\n    var student = records.find(\n\
    \      student => student.id == studentID\n    );\n    return student.name;\n\
    \  }\n}());\n\nStudent.getName(73); // Suzy\n```\n\n第 8 章：模块模式\n\nStudent 现在是模块的实例。它具有一个公共\
    \ API，其中只有一个方法：getName(..)。该方法能够访问私有的 records 数据。\n\n## 警告\n\n> 我应该指出，硬编码在此模块中的显式学生数据仅是为了说明。程序中的典型模块将从外部源接收这些数据，通常从数据库、JSON\
    \ 数据文件、Ajax 调用等加载。数据通常通过模块公共 API 方法注入到模块实例中。\n\n"
