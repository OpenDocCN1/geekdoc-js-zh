  mdcn: "\n\n## 附录 A：进一步探索\n\n但 `while` 子句无法看到循环内部的 `let` 声明。因此我们折中方案，使用了 `var`，这样\
    \ `done` 就会提升到外部作用域，从而在那里可以被看到。\n\n另一种方案——在循环外部声明 `done`——会将其与首次使用的地方分离，这要么意味着必须指定一个默认值，或者更糟，让它处于未赋值状态，从而让读者产生歧义。我认为在这里在循环内部使用\
    \ `var` 是更好的。\n\n`var` 的另一个很有用的特性体现在无意块内的声明中。无意块是因为由于语法要求一个块而创建的，但开发者的意图并不是为了创建一个局部作用域。无意作用域最好的例子例于\
    \ `try..catch` 语句：\n\n```javascript\nfunction getStudents() {\n  try {\n    //\
    \ 这并不是真正的块作用域\n    var records = fromCache(\"students\");\n  }\n  catch (err)\
    \ {\n    // 噢，回退到默认值\n    var records = [];\n  }\n  //\n}\n```\n\n是的，还有其他方法来组织这段代码。但我认为考虑到各种权衡，这是最好的方法。\n\
    \n我不想在 `try` 块之外声明（使用 `var` 或 `let`）`records`，然后在其中一个或两个块中给它赋值。我更倾向于让初始声明尽可能靠近变量的首次使用（理想情况下在同一行）。在这个简单的例子中，这只相差了几行，但在实际代码中，这种距离可能会增长到很多行。间隙越大，就越难弄清楚你正在给哪个作用域的哪个变量赋值。在实际赋值时使用\
    \ `var` 可以让它不那么歧义。\n\n另外注意，我在 `try` 和 `catch` 块中都使用了 `var`。这是因为我想向读者发出信号：无论走哪条路径，`records`\
    \ 总是会被声明。从技术上讲，这是可行的，因为 `var` 会一次性提升到函数作用域。但这仍然是一个微小的语义信号，提醒读者 `var` 确保了什么。如果\
    \ `var` 只在其中一个块中使用，而你又在读取另一个块，你就无法轻易发现 `records` 是从哪里来的。\n\n在我看来，这是 `var` 的某种小超能力。它不仅可以逃离无意的\
    \ `try..catch` 块，而且允许在函数作用域中出现多次。你不能用 `let` 做到这一点。这并不坏，实际上是一个很有帮助的特性。把 `var` 想象成一种声明式注解，它在每次使用时都提醒你变量来自哪里。“啊，对，它属于整个函数。”\n\
    \n这种重复注解的超能力在其他情况下也很有用：\n\n```javascript\nfunction getStudents() {\n  var data\
    \ = [];\n\n  // 对 data 做些什么\n  // .. 更多 50 行代码 ..\n\n  // 纯粹是为了提醒我们的注释\n  var\
    \ data;\n\n  // 再次使用 data\n}\n```\n\n第二个 `var data` 并不是重新声明 `data`，它只是为了读者的利益标注\
    \ `data` 是一个函数范围内的声明。这样，读者就不需要向上滚动 50 多行代码来寻找初始声明了。\n\n我完全接受在整个函数作用域内为了多个目的重用变量。我也完全接受一个变量的两次使用之间隔着相当多的代码。在这两种情况下，使用\
