    \ rather than putting them inside a single scope.\n\nTry the exercise for yourself,\
    \ then check out the suggested solution at the end of this appendix.\n\n## A Word\
    \ About Memory\n\nI want to share a little quick note about this closure cache\
    \ technique and the impacts it has on your application's performance.\n\nWe can\
    \ see that in saving the repeated calls, we improve computation speed (in some\
    \ cases, by a dramatic amount). But this usage of closure is making an explicit\
    \ trade-off that you should be aware of.\n\nThe trade-off is unboundedly. We're\
    \ essentially growing our cache (in memory). If the functions in question were\
    \ called millions of times with mostly unique inputs, we'd be chewing a lot of\
    \ memory. This can definitely be worth the expense, but only if we think it's\
    \ likely we see repetition of common inputs so that we're taking advantage of\
    \ the cache.\n\nIf most every have a unique input, and the cache is essentially\
    \ never used to any benefit, this is an inappropriate technique to employ.\n\n\
    It also might be a good idea to have a more sophisticated caching approach, such\
    \ as an LRU (least recently used) cache, that limits its size; as it runs up to\
    \ the limit, an LRU evicts the values that are... well, least recently used!\n\
    \nThe downside here is that LRU is quite non-trivial in its own right. You'll\
