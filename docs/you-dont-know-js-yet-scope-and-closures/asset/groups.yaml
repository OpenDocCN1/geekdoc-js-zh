    );\n```\n\n参数 `label` 被闭包在了 `onClick(..)` 事件处理器回调中。当按钮被点击时，`label` 仍然存在并可以使用。这就是闭包。\n\
    \n## 如果我看不到它怎么办？\n\n你可能听过这句流行的格言：\n\n> 如果森林里有一棵树倒了，但周围没有人在听到，它会发出声音吗？\n\n这是一种愚蠢的哲学体操。当然，从科学角度来看，产生了声波。但真正的点在于：声音是否发生这重要吗？\n\
    \n## 第7 章：使用闭包\n\n记住，我们在闭包的定义中强调的是**可观测性**。如果一个闭包存在（从技术、实现或学术意义上来说），但它在我们的程序中无法被观察到，这重要吗？不重要。\n\
    \n为了强化这一点，让我们来看一些并非基于闭包的例子。\n\n例如，调用一个使用了词法作用域查找（lexical scope lookup）的函数：\n\n\
    ```javascript\nfunction say(myName) {\n  var greeting = \"Hello\";\n  output();\n\
    \n  function output() {\n    console.log(\n      `${greeting}, ${myName}!`\n \
    \   );\n  }\n}\n\nsay(\"Kyle\");\n// Hello, Kyle!\n```\n\n内部函数 `output()` 访问了其闭层作用域中的变量\
    \ `greeting` 和 `myName`。但 `output()` 的调用发生在同一个作用域内，在该区域内 `greeting` 和 `myName`\
    \ 显然仍然可用；那是词法作用域，而不是闭包。\n\n任何其函数不支持闭包的局部作用域语言都会表现出这种行为。\n\n事实上，全局作用域变量本质上无法被（可观测地）闭包，因为它们从任何地方都是可的。任何函数都不会在作用域链中非全局作用域后代的任何部分被调用。\n\
    \n考虑以下：\n\n```javascript\nvar students = [\n    { id: 14, name: \"Kyle\" },\n\
    \    { id: 73, name: \"Suzy\" },\n    { id: 112, name: \"Frank\" },\n    { id:\
    \ 6, name: \"Sarah\" }\n];\n\nfunction getStudent() {\n    return function firstStudent(){\n\
    \        return students[0].name;\n    }\n}\n\nvar student = getStudent();\n\n\
    student();\n// Kyle\n```\n\n内部函数 `firstStudent()` 确实引用了 `students`，这是一个在其作用域之外的变量。但由于\
