    \  addStudents,\n  //..\n});\n\n// ********************************* implementation\n\
    // private implementation\n\nvar cache = { };\nvar otherData = [ ];\n\nfunction\
    \ getStudents() {\n  //..\n}\n\nfunction addStudents() {\n  //..\n}\n```\n\nNotice\
    \ how the cache and otherData variables are in the “private” section of the module\
    \ layout. That's because I don't plan to expose them publicly. So I organize the\
    \ module so they're located alongside the other hidden implementation details\
    \ of the module.\n\nBut I've had a few rare cases where I needed the assignments\
    \ of those values to happen above, before I declare the exported public API of\
    \ the module. For instance:\n\n```javascript\n// public API\nvar publicAPI = Object.assign(module.exports,\n\
    \  getStudents,\n  addStudents,\n  refreshData: refreshData.bind(null,cache)\n\
    });\n```\n\nI need the cache variable to have already been assigned a value, because\
    \ that is used in the initialization of the public API (the .bind(..) partial-application).\n\
    \nShould I move the var cache = { .. } up to the top, above this public API initialization?\
    \ Well, perhaps. But now it's less obvious that var cache is a private implementation\
    \ detail. Here's the compromise I've (somewhat rarely) used:\n\n```javascript\n\
    cache = {}; // used here, but declared below\n```\n\n```javascript\n// public\
    \ API\nvar publicAPI = Object.assign(module.exports,\n  getStudents,\n  addStudents,\n\
    \  refreshData: refreshData.bind(null,cache)\n});\n```\n\n```javascript\n// ************************************\n\
    // private implementation\nvar cache = /* {}*/;\n```\n\nSee the variable hoisting?\
    \ I've declared the cache down where it belongs, logically, but in this rare case\
    \ I've used it earlier up above, in the area where its initialization is needed.\
    \ I even left a hint at the value that's assigned to cache in a code comment.\n\
    \nThat's literally the only case I've found for leveraging variable hoisting to\
    \ assign a variable earlier in a scope of its declaration. But I think it's a\
    \ reasonable exception to employ with caution.\n\n## The Case for var\n\nSpeaking\
    \ of variable hoisting, let's have some real talk for a bit about var, a favorite\
    \ villain devs love to blame for many of the woes of JS development. In Chapter\
    \ 5, we explored let/const and promised we will revisit where var falls in the\
    \ whole mix.\n\nAs I lay out the case, don't miss:\n\n- var was never broken\n\
    - let is your friend\n- const has limited utility\n- The best of both worlds:\
    \ var and let\n\n## Don't Throw Out var\n\nvar is fine, and works just fine. It's\
    \ been around for 25 years, and it'll be around and useful and functional for\
    \ another 25 years or more. Claims that var is broken, deprecated, outdated, dangerous,\
    \ or ill-designed is bogus bandwagoning.\n\nDoes that mean var is the right declarator\
    \ for every single declaration in your program? Certainly not. But it still has\
    \ its place in your programs. Refusing to use it because someone on the team choose\
    \ an aggressive linter opinion that chokes on var is cutting off your nose to\
