    \ page could include:\n\n```\nfirst;\n// <li id=\"first\">..</li>\n\nwindow[\"\
    my-todo-list\"];\n// <ul id=\"my-todo-list\">..</ul>\n```\n\nIf the id value is\
    \ a lexical name (like first), the lexical variable is created. Not, the only\
    \ way to access that global is through the global object (window[..]).\n\nThe\
    \ auto-registration of all id-bearing DOM elements as global variables is an old\
    \ legacy behavior that nonetheless remain because so many old sites still rely\
    \ on it. My advice is never to use these global variables, even though they will\
    \ always be silently created.\n\n# What's in a (Window) Name?\n\nAnother global\
    \ scope oddity in browser-based JS:\n\n```\nvar name = 42;\n\nconsole.log(name,\
    \ typeof name);\n// \"42\" string\n```\n\nwindow.name is a pre-defined “global”\
    \ in a browser context; it’s a property on the global object, so it seems like\
    \ a normal global variable (yet it’s anything but “normal”)."
  - '[PAGE 81]


    Chapter 4: Around the Global Scope


    We used var for our declaration, which does not shadow the pre-defined name global
    property. That means, effectively, the var declaration is ignored, since there''s
    already a global scope object property of that name. As we discussed earlier,
    had we used let name, we would have shadowed window.name with a separate global
    name variable.


    But the truly surprising behavior is that even though we assigned the number 42
    to name (and thus window.name), when we then retrieve its value, it''s a string
    "42"! In this case, the weirdness is because name is actually a pre-defined getter/setter
    on the window object, which insists on its value being a string value. Yikes!


    With the exception of some rare cases like DOM element ID''s and window.name,
    JS running as a standalone file in a browser page has some of the most pure global
    scope behavior we will encounter.


    # Web Workers


    Web Workers are a web platform extension on top of browser-JS behavior, which
    allows a JS file to run in a completely separate thread (operating system wise)
    from the thread''s running the main JS program.


    Since these Worker programs run on a separate thread, they''re restricted in their
    communications with the main application thread, to avoid/limit race conditions
    and other complications. Web Worker code does not have access to the DOM, for
    example. Some Web APIs are, however, made available to the worker, such as navigator.


    Since a Web Worker is treated as a wholly separate program, it does not share
    the global scope with the main JS program.


