  mdcn: "\n\n```javascript\nfor (let i = 0; i < 5; i++) {\n  // 执行某些操作\n}\n```\n\n\
    几乎唯一通过这种方式将 `var` 切换为 `let` 会“破坏”你代码的情况，是你依赖于在循环外部或循环之后访问循环的迭代器 (`i`)，例如：\n\n\
    ```javascript\nfor (var i = 0; i < 5; i++) {\n  if (checkValue(i)) {\n    break;\n\
    \  }\n}\n```\n\n```javascript\nif (i < 5) {\n  console.log(\"The loop stopped\
