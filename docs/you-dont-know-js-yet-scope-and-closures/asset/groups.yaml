    \ `map(..)` 和 `then(..)` 语句中的单行函数也应该命名：\n\n```javascript\nlookupTheRecords(someData)\n\
    .then(function extractSalesRecords(resp){\n  return resp.allSales;\n})\n.then(storeRecords);\n\
    ```\n\n`extractSalesRecords` 这个名字告诉读者这个 `then(..)` 处理器的目的，比仅仅在脑中执行 `return.allSales`\
    \ 来推断其目的要好。\n\n不给函数命名的唯一理由要么是懒惰（不想多打几个字符），要么缺乏创意（想不出好名字）。如果你想不出一个好的名字，你可能还没有理解这个函数及其目的。这个函数可能是设计得不好，或者它承担了太多事情，应该重构。一旦你有了一个设计良好的、单一目的的函数，它的名称就会显而易见。\n\
    \n这里有一个我使用的技巧：在编写函数时，如果我不完全理解它的目的且无法想出一个好名字来使用，我就直接用 `TODO` 作为名字。这样，当我以后审查代码时，我可能会发现这些名称占位符，并且更倾向于（也更有准备！）回去想一个更好的名字，而不是就让它留留在\
    \ `TODO`。\n\n《你还不懂 JS：作用域与闭包\n\n# 箭头函数\n\n所有函数都需要名字。每一个都是。没有例外。你省略的任何名字都会让程序更难读、更难调试、以后更难扩展和维护。\n\
    \n箭头函数总是匿名的，即使它们（罕见地）被用一种赋予它们推断名称的方式使用。我刚刚花了几页文字解释了为什么匿名函数是一个坏主意，所以你可能可以猜到我对箭头函数的看法。\n\
    \n不要把它们作为普通函数的通用替代品。它们更简洁，但这种简洁是以省略关键视觉分隔符为代价的，这些分隔符有助于我们大脑快速解析正在阅读的内容。而且，就本文讨论而言，它们是匿名的，这从可读性角度来看让它们变得更糟糕。\n\
    \n箭头函数有其目的，但那个目的并不是节省击键次数。箭头函数具有词法行为，这在某种程度上超出了我们本书讨论的范围。\n\n简之：箭头函数完全没有定义标识符关键字。如果你在箭头函数内部使用\
    \ `this`，它的行为与任何其他变量引用完全相同，即查询作用域链以找到定义它的函数作用域（非箭头函数）并使用那一个。\n\n换句话说，箭头函数将 `this`\
    \ 视为任何其他词法变量。\n\n如果你习惯了像 `var self = this` 这样的黑科技，或者你更喜欢在内部函数表达式上调用 `.bind(this)`，为了强迫它们像词法变量一样从外部函数继承\
    \ `this`，那么 => 箭头函数绝对是更好的选择。它们是专门为解决这个问题而设计的。\n\n所以，在需要词法 `this` 的罕见情况下，使用箭头函数。它是完成这项工作的最佳工具。但请注意，这样做意味着接受了匿名函数的缺点。你应该投入额外努力来减轻可读性成本，例如更具描述性的变量名和代码注释。\n\
