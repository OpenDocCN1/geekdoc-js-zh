- md: "\n## Chapter 2: Illustrating Lexical Scope\n\n**Engine**: Hey, Scope Manager\
    \ (for the global scope),\nI have a target reference for nextStudent, ever heard\
    \ of it?\n\n**Global Scope Manager**: Nope, but since we're in non-strict-mode,\
    \ I helped you out and just created a global variable for you, here it is!\n\n\
    Yuck.\n\nThis sort of accident (almost certain to lead to bugs eventually) is\
    \ a great example of the beneficial protections offered by strict-mode, and why\
    \ it's such a bad idea *not* to be using strict-mode. In strict-mode, the *Global\
    \ Scope Manager* would instead have responded:\n\n> **Global Scope Manager**:\
    \ Nope, never heard of it.\n> Sorry, I've got to throw a ReferenceError.\n\nAssigning\
    \ to a never-declared variable is an error, so it's right that we would receive\
    \ a ReferenceError here.\n\nNever rely on accidental global variables. Always\
    \ use strict-mode, and always formally declare your variables. You'll then get\
    \ a helpful ReferenceError if you ever mistakenly try to assign to a not-declared\
    \ variable.\n\n## Building On Metaphors\n\nTo visualize nested scope resolution,\
    \ I prefer yet another metaphor, an office building, as in Figure 3:\n\n![](img/14a2f9063d3ac52e6a98517a7d87857f_52_0.png)\n\
    \nThe building represents our program’s nested scope collection. The first floor\
    \ of the building represents the currently executing scope. The top level of the\
    \ building is the global scope.\n\nYou resolve a target or source variable reference\
    \ by first looking on the current floor, and if you don't find it, taking the\
    \ elevator to the next floor (i.e., an outer scope), looking there, then the next,\
    \ and so on. Once you get to the top floor (the global scope), you either find\
    \ what you’re looking for, or you don't. But you have to stop regards.\n\n## Continue\
    \ the Conversation\n\nBy this point, you should be developing richer mental models\
    \ for what scope is and how the JS engine determines and uses it from your code.\n\
    \nBefore continuing, go find some code in one of your projects and run through\
    \ these conversations. Seriously, actually speak out loud. Find a friend and practice\
    \ each role with them. If either of you find yourself confused or tripped up,\
    \ spend more time reviewing this material.\n\nAs we move (up) to the next (outer)\
    \ chapter, we’ll explore how the lexical scopes of a program are connected in\
    \ a chain.\n\n## Chapter 3: The Scope Chain\n\nChapters 1 and 2 laid down a concrete\
    \ definition of lexical scope (and its parts) and illustrated helpful metaphors\
