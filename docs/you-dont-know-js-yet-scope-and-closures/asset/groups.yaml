- md: "\n## Chapter 5: The (Not So) Secret Lifecycle of Variables\n\nHoisting, being\
    \ a concrete execution step the JS engine performs, it’s more useful to think\
    \ of hoisting as a visualization of various actions JS takes in setting up the\
    \ program before execution.\n\nThe typical assertion of what hoisting means is\
    \ lifting—like lifting a heavy weight upward—any identifiers all the way to the\
    \ top of a scope. The explanation often asserted is that the JS engine will actually\
    \ rewrite that program before execution, so that it looks more like this:\n\n\
    ```javascript\nvar greeting; // hoisted declaration\ngreeting = \"Hello!\"; //\
    \ the original line 1\nconsole.log(greeting); // Hello!\ngreeting = \"Howdy!\"\
    ; // `var` is gone!\n```\n\nThe hoisting (metaphor) proposes that JS pre-processes\
    \ the original program and re-arranges it a bit, so that all the declarations\
    \ have been moved to the top of their respective scopes, before execution. Moreover,\
    \ the hoisting metaphor asserts that function declarations are, in their entirety,\
    \ hoisted to the top of each scope. Consider:\n\n```javascript\nstudentName =\
    \ \"Suzy\";\ngreeting();\n// Hello Suzy!\n```\n\n```javascript\nfunction greeting()\
    \ {\n  console.log(`Hello ${studentName}!`);\n}\nvar studentName;\n```\n\nThe\
    \ “rule” of the hoisting metaphor is that function declarations are hoisted first,\
    \ then variables are hoisted immediately after all the functions. Thus, the hoisting\
    \ story suggests that the program is re-arranged by the JS engine to look like\
    \ this:\n\n```javascript\nfunction greeting() {\n  console.log(`Hello ${studentName}!`);\n\
    }\n\nvar studentName;\n\nstudentName = \"Suzy\";\ngreeting();\n// Hello Suzy!\n\
    ```\n\nThis hoisting metaphor is convenient. Its benefit is allowing us to hand\
    \ wave over the magical look-ahead pre-processing necessary to find all these\
    \ declarations buried deep in scopes and somehow move (hoist) them to the top;\
    \ we can just think about the program as if it's executed by the JS engine in\
    \ a single pass, top-down.\n\nSingle-pass definitely seems more straightforward\
    \ than Chapter's assertion of a two-phase processing.\n\nHoisting as a mechanism\
    \ for re-ordering code may be an attractive simplification, but it's not accurate.\
    \ The JS engine doesn't actually re-arrange the code. It can't magically look\
    \ ahead and find declarations; the only way to accurately find them, as well as\
    \ the scope boundaries in the program, would be to fully parse the code.\n\nGuess\
    \ what parsing is? The first phase of the two-phase processing! There's no magical\
    \ mental gymnastics that gets around that fact.\n\nSo if the hoisting metaphor\
    \ is (at best) inaccurate, what should we do with the term? I think it's still\
    \ useful—indeed, even members of TC39 regularly use it—but I don’t think we should\
    \ claim it’s an actual re-arrangement of source code.\n\n> Warning\n> Incorrect\
    \ or incomplete mental models often still seem sufficient because they can occasionally\
    \ lead to accidental right answers. But in the long run it's harder to accurately\
    \ analyze and predict outcomes if your thinking isn't particularly aligned with\
    \ how the JS engine works.\n\nI assert that hoisting should be used to refer to\
    \ the compile-time operation of generating runtime instructions for the automatic\
    \ registration of a variable at the beginning of its scope, each time that scope\
    \ is entered.\n\nThat’s a subtle but important shift, from hoisting as a runtime\
    \ behavior to its proper place among compile-time tasks.\n\n## Re-declaration?\n\
    \nWhat do you think happens when a variable is declared more than once in the\
    \ same scope? Consider:\n\n```javascript\nvar studentName = \"Frank\";\nconsole.log(studentName);\n\
    // Frank\n```\n\n```javascript\nvar studentName;\nconsole.log(studentName);  \
    \    // ???\n```\n\nWhat do you expect to be printed for that second message?\
    \ Many believe the second `var studentName` has re-declared the variable (and\
    \ thus “reset” it), so they expect `undefined` to be printed.\n\nBut is there\
    \ such a thing as a variable being “re-declared” in the same scope? No.\n\nIf\
    \ you consider this program from the hoisting metaphor, the code would be re-arranged\
    \ like this:\n\n```javascript\nvar studentName;\nstudentName = \"Frank\";\nconsole.log(studentName);\
    \      // Frank\nvar studentName;\nconsole.log(studentName);      // Frank\n```\n\
    \nWait, the logic above is slightly flawed. Let's look at the actual behavior.\
    \ If you run:\n\n```javascript\nvar studentName = \"Frank\";\nconsole.log(studentName);\
    \ // Frank\nvar studentName;\nconsole.log(studentName); // Frank\n```\n\nThe output\
    \ is `Frank` and `Frank`. Why? Because the second `var studentName` doesn't re-declare\
    \ the variable; it just ensures it's declared.\n\nBut what if we use `let`?\n\n\
    ```javascript\nlet studentName = \"Frank\";\nconsole.log(studentName); // Frank\n\
    let studentName = \"Suzy\"; // SyntaxError\n```\n\nThis throws a `SyntaxError`.\n\
    \nWhat about repeating a declaration within a scope using let or const?\n\n```javascript\n\
    let studentName = \"Frank\";\nconsole.log(studentName); // Frank\nlet studentName\
    \ = \"Suzy\"; // SyntaxError\n```\n\nThis program will not execute, but instead\
    \ throw a SyntaxError. Depending on your environment, the error message will indicate\
    \ something like: “studentName has already been declared.”\n\nIt's not just that\
    \ two declarations involving let will throw this error. If either declaration\
    \ uses let, the other can be let or var, and the error will still occur, as illustrated\
    \ with these two variations:\n\n```javascript\nvar studentName = \"Frank\";\n\
    let studentName = \"Suzy\";\n```\n\nand:\n\n```javascript\nlet studentName = \"\
    Frank\";\nvar studentName = \"Suzy\";\n```\n\nIn both cases, a SyntaxError is\
    \ thrown on the second declaration. In other words, the only way to “re-declare”\
    \ a variable is to use var for all (two or more) of its declarations.\n\n## Tip\n\
    \nIn the console, you can test this yourself:\n\n```javascript\nvar a = 1;\nconsole.log(a);\
    \ // 1\nvar a = 2;\nconsole.log(a); // 2\n\nlet b = 1;\nconsole.log(b); // 1\n\
    let b = 2; // SyntaxError\n```\n"
  mdcn: "\n\n## 第 5 章：变量（并不）秘密的生命周期\n\n提升（Hoisting）是 JS 引擎执行的一个具体步骤，但将提升视为 JS 在执行前设置程序时所采取的各种操作的可视化会更有用。\n\
    \n关于提升含义的典型解释是提升——像把重物向上举一样——将任何标识符提升到作用域的顶部。通常给出的解释是，JS 引擎会在执行前实际上重写该程序，使其看起来像这样：\n\
    \n```javascript\nvar greeting; // 提升声明\ngreeting = \"Hello!\"; // 原第 1 行\nconsole.log(greeting);\
    \ // Hello!\ngreeting = \"Howdy!\"; // `var` 消失了！\n```\n\n提升（比喻）提出 JS 对原始程序进行了预处理并对其进行了重排，以便在执行之前将所有的声明都移动到各自作用域的顶部。此外，提升比喻还断言函数声明被整体提升到了每个作用域的顶部。考虑：\n\
    \n```javascript\nstudentName = \"Suzy\";\ngreeting();\n// Hello Suzy!\n```\n\n\
    ```javascript\nfunction greeting() {\n  console.log(`Hello ${studentName}!`);\n\
    }\nvar studentName;\n```\n\n提升比喻的“规则”是：函数声明先提升，然后变量在所有函数之后立即提升。因此，提升故事建议程序被 JS\
    \ 引擎重新编排，看起来像这样：\n\n```javascript\nfunction greeting() {\n  console.log(`Hello\
    \ ${studentName}!`);\n}\n\nvar studentName;\n\nstudentName = \"Suzy\";\ngreeting();\n\
    // Hello Suzy!\n```\n\n这种提升比喻非常方便。它的用处是让我们能够忽略那些神奇的预瞻性预处理——这些预处理是为了找到深埋在作用域中的所有这些声明，并以某种方式将它们移动（提升）到顶部；我们只需要把程序看作是由\
    \ JS 引擎单次通过、从上到下执行的即可。\n\n单次通过显然比本章断言的两阶段处理要直观得多。\n\n将提升作为一种重新排序代码的机制可能是一种很有吸引力的简化，但它并不准确。JS\
    \ 引擎并不会实际上重排代码。它不能魔法般地前瞻并找到声明；准确找到它们以及程序中作用域边界的唯一方法是完全解析代码。\n\n猜猜解析是什么？就是两阶段处理中的第一阶段！没有任何神奇的心理体操可以规避这个事实。\n\
    \n所以，如果提升比喻（充其量）是不准确的，我们该如何处理这个术语？我认为它仍然很有用——事实上，即使 TC39 的成员也经常使用它——但我认为我们不应该声称它是源代码真实的排序。\n\
    \n> 警告\n> 错误或不完整的心理模型往往看起来仍然足够，因为它们偶尔会导致偶然的正确答案。但从长远来看，如果你的思维与 JS 引擎的工作方式不特别一致，那么准确分析和预测结果将变得困难。\n\
    \n我断定，提升应该指的是编译时操作，即在每次进入作用域时，为作用域开头自动注册变量生成运行时指令。\n\n这是一个微妙但重要的转变，将提升从运行时行为转变为位于编译时任务中的正确位置。\n\
    \n## 重复？\n\n你认为当变量在同一个作用域中声明多次时会发生什么？考虑：\n\n```javascript\nvar studentName = \"\
    Frank\";\nconsole.log(studentName);\n// Frank\n```\n\n```javascript\nvar studentName;\n\
    console.log(studentName);      // ???\n```\n\n你期望第二个消息打印什么？许多人认为第二个 `var studentName`\
    \ 重新声明了变量（从而“重置”了它），因此他们期望打印 `undefined`。\n\n但在同一个作用域内，是否存在变量被“重复声明”这种事？没有。\n\n\
    如果你从提升比喻的角度考虑这个程序，代码将被重排为如下：\n\n```javascript\nvar studentName;\nstudentName =\
    \ \"Frank\";\nconsole.log(studentName);      // Frank\nvar studentName;\nconsole.log(studentName);\
    \      // Frank\n```\n\n等等，上面的逻辑稍有缺陷。让我们看看实际行为。如果你运行：\n\n```javascript\nvar studentName\
    \ = \"Frank\";\nconsole.log(studentName); // Frank\nvar studentName;\nconsole.log(studentName);\
    \ // Frank\n```\n\n输出是 `Frank` 和 `Frank`。为什么？因为第二个 `var studentName` 并没有重新声明变量；它只是确保了变量被声明。\n\
    \n但如果我们使用 `let` 呢？\n\n```javascript\nlet studentName = \"Frank\";\nconsole.log(studentName);\
    \ // Frank\nlet studentName = \"Suzy\"; // SyntaxError\n```\n\n这会抛出一个 `SyntaxError`。\n\
    \n关于在作用域内使用 `let` 或 `const` 重复声明呢？\n\n```javascript\nlet studentName = \"Frank\"\
    ;\nconsole.log(studentName); // Frank\nlet studentName = \"Suzy\"; // SyntaxError\n\
    ```\n\n这个程序将不会执行，而是抛出一个 SyntaxError。根据你的环境，错误信息将显示类似于：“studentName has already\
    \ been declared.”。\n\n不仅仅是两个涉及 `let` 的声明会抛出此错误。如果其中一个声明使用了 `let`，另一个可以是 `let`\
    \ 或 `var`，且错误仍然会发生，这两个变体所示：\n\n```javascript\nvar studentName = \"Frank\";\nlet\
    \ studentName = \"Suzy\";\n```\n\n以及：\n\n```javascript\nlet studentName = \"Frank\"\
    ;\nvar studentName = \"Suzy\";\n```\n\n在两种情况下，在第二个声明处都会抛出 SyntaxError。换句话说，“重复声明”一个变量的唯一方法是对它的所有（两个或更多）声明都使用\
    \ `var`。\n\n## 提示\n\n在控制台中，你可以自己测试这个：\n\n```javascript\nvar a = 1;\nconsole.log(a);\
    \ // 1\nvar a = 2;\nconsole.log(a); // 2\n\nlet b = 1;\nconsole.log(b); // 1\n\
    let b = 2; // SyntaxError\n```\n\n"
