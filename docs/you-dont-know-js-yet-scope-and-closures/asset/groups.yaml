    // 720\n```\n\n```javascript\nfactorial(7);\n// 5040\n```\n\n等等！这仍然在使用函数来创建隐藏缓存的作用域，在这种情况下，函数的名称仍然是\
    \ `hideCache`，那么这能解决什么问题呢？\n\n回想第3章中的“函数命名作用域”，函数表达式中的名称标识符发生了什么。由于 `hideCache(..)`\
    \ 被定义为函数表达式而不是函数声明，它的名称位于它自己的作用域内——本质上与 `cache` 相同的作用域——而不是在外部/全局作用域中。\n\n这意味着我们可以为每一个这样的函数表达式起完全相同的名称，而永远不会发生冲突。更准确地说，我们可以根据我们试图隐藏的内容语义化地为每次出现命名，而不必担心我们选择的任何名称会与程序中的任何其他函数表达式作用域发生冲突。\n\
    \n事实上，我们*可以*完全省略名称——从而定义为一个“匿名函数表达式”。但附录 A 将讨论名称对于此类仅用于作用域的函数的重要性。\n\n# 立即调用函数表达式\n\
    \n在之前的阶乘递归程序中，有一个容易被忽略的重要部分：函数表达式末尾包含 `} ) ()` 的那行。\n\n注意，我们将整个函数表达式包裹在一组 `( ..\
    \ )` 中，然后在末尾添加了第二组 `( )` 括号；这实际上是在调用我们刚刚定义的函数表达式。此外，在这种情况下，包裹函数表达式的第一组 `( .. )`\
    \ 并不是严格必要的（稍后会详细说明），但为了可读性起见我们还是使用了它们。\n\n所以，换句话说，我们定义了一个随后被立即调用的函数表达式。这种常见模式有一个（非常有创意的！）名字：**立即调用函数表达式\
    \ (IIFE)**。\n\n当我们想要创建一个作用域来隐藏变量/函数时，IIFE 非常很有用。因为它是一个表达式，可以用于 JS 程序中允许使用表达式的**任何**地方。IIFE\
    \ 可以命名，如 `hideTheCache()`，或者（更常见的是！）未命名的/匿名的。它可以是独立的，或者作为另一个语句的一部分——`hideTheCache()`\
