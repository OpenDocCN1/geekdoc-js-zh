  mdcn: "\n\n# 第 6 章：限制作用域暴露\n\n让我们先识别作用域和它们的标识符：\n\n- 1. 外部/全局作用域有一个标识符，函数 `getNextMonthStart(..)`。\n\
    - 2. `getNextMonthStart(..)` 的函数作用域有三个：`dateStr`（参数）、`nextMonth` 和 `year`。\n-\
    \ 3. `{ .. }` 大括号对定义了一个包含一个变量的内部作用域：`curMonth`。\n\n那么为什么要把它放在一个显式的块作用域中，而不是直接放在顶层函数作用域的\
    \ `nextMonth` 和 `year` 旁边呢？因为 `curMonth` 只需要在前两个语句中使用；在函数级别它被过度暴露了。\n\n这个例子很小，所以过度暴露\
    \ `curMonth` 的风险非常有限。但当你养成“默认最小化作用域暴露”的思维习惯时，POLE 原则的益处才能最大。如果你即使在小情况下也始终遵循这一原则，随着程序的增长，它将令你受益匪浅。\n\
    \n现在让我们来看看 `sortNamesByLength(names)` {：\n\n```javascript\nfunction sortNamesByLength(names)\
    \ {\n  var buckets = [];\n\n  for (let firstName of names) {\n    if (buckets[firstName.length]\
    \ == null) {\n      buckets[firstName.length] = [];\n    }\n    buckets[firstName.length].push(firstName);\n\
    \  }\n\n// 一个缩小作用域的块\n{\nlet sortedNames = [];\n\nfor (let bucket of buckets)\
    \ {\n  if (bucket) {\n    // 对每个桶进行字母顺序排序\n    bucket.sort();\n\n    // 将排序后的名称添加到我们的\n\
    \    // 运行列表中\n    sortedNames = [\n      ...sortedNames,\n      ...bucket\n \
    \   ];\n  }\n}\n\nreturn sortedNames;\n}\n```\n\n```javascript\nsortNamesByLength([\n\
    \  \"Sally\",\n  \"Suzy\",\n  \"Frank\",\n  \"John\",\n  \"Jennifer\",\n  \"Scott\"\
    \n]);\n// [\"John\", \"Suzy\", \"Frank\", \"Sally\",\n// [\"Scott\", \"Jennifer\"\
    ]\n```\n\n在五个不同的作用域中声明了六个标识符。所有这些变量都可以存在于单一的外部/全局作用域中吗？从技术上讲，可以，因为它们都是唯一命名的，因此没有名称冲突。但这将是非常糟糕的代码组织，并且可能会导致混淆和未来的漏洞。\n\
    \n# var 和 let\n\n我们根据情况将它们划分到每个内部嵌套作用域中。每个变量都定义在尽可能内部的作用域中，以确保程序按预期运行。\n\n`sortedNames`\
    \ 可以定义在顶层函数作用域中，但它只需要在该函数的后半部分。为了避免在更高层的作用域中过度暴露该变量，我们再次遵循 POLE 原则，并在内部显式块作用域中对其进行块作用。\n\
    \n接下来，让我们讨论声明 `var buckets`。该变量在整个函数中（最后的返回语句除外）都被使用。任何在整个（甚至大部分）函数所需的变量都应该声明，这样这种用法就是显而易见的。\n\
    \n> 注意\n> 参数名没有在整个函数中使用，但没有办法限制参数的作用域，所以它的行为仍然是函数级的声明。\n\n那么为什么我们使用 `var` 而不是\
