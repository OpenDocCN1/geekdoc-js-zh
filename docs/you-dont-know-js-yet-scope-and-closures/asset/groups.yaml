    window.something = 42;


    ```

    let something = "Kyle"

    console.log(something);

    // Kyle

    console.log(window.something);

    // 42

    ```


    The let declaration adds a something global variable but not a global object property
    (see Chapter 3). The effect then is that the something lexical identifier shadows
    the something global object property.


    It’s almost certainly a bad idea to create a divergence between the global object
    and the global scope. Readers of your code will almost certainly be tripped up.


    A simple way to avoid this gotcha with global declarations: always use var for
    globals. Reserve let and const for block scopes (see “Scoping with Blocks” in
    Chapter 6).


    # DOM Globals


    I asserted that a browser-hosted JS environment has the most pure global scope
    behavior we’ll see. However, it’s not entirely pure.


    One surprising behavior in the global scope you may encounter with browser-based
    JS applications: a DOM element with an id attribute automatically creates a global
    variable that references it.


