    times!), its persistent cache stays hidden yet accessible only to factorial(..).


    OK, but... it''s going to be tedious to define (and name!) a hideTheCache(..)
    function scope each time such a need for variable/hiding occurs, especially since
    we''ll likely want to avoid name collisions with this function by giving each
    occurrence a unique name. Ugh.


    # Note


    The illustrated technique—caching a function''s computed performance when repeated
    calls of the same inputs are expected—is common in the Functional Programming
    (FP) world, canonically referred to as “memoization”; this caching relies on closure
    (see Chapter 7). Also, there are memory usage concerns (addressed in “A Word About
    Memory” in Appendix B). FP libraries will provide an optimized and vetted utility
    for memoization of functions, which would take the place of hideTheCache(..) here.
    Memoization is beyond the scope (pun intended!) of our discussion, but see my
    Functional-Light JavaScript book for more information.


    Rather than defining a new and uniquely named function each time one of those
    scope-only-for-the-purpose-of-hiding-a-variable situations occurs, a perhaps better
    solution is to use a function expression:'
