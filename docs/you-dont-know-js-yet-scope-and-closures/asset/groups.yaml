    \ 循环的块作用域同样嵌套在该函数作用域内部。作用域可以根据程序的定义在词法上嵌套到任意深度。\n\n每当作用域被执行（一次或多次）时，每个作用域都会获得它自己的作用域管理器实例。每个作用域在执行作用域开始时会自动注册其所有的标识符（这被称为“变量提升”；见第\
    \ 5 章）。\n\n在作用域的开始，如果任何标识符来自函数声明，该变量将自动初始化为其关联的函数引用。如果任何标识符来自 `var` 声明（相对于 `let/const`），该变量将自动初始化为\
