  mdcn: "\n\n## 附录 B：练习\n\n计算一次。提示：我们已经在第 6 节通过 `factorial(..)` 展示过这种缓存方法了。\n\n如果你查看\
    \ `factorize(..)`，它是通过递归实现的，这意味着它会反复调用自己。这再次意味着我们可能会看到在计算数字的质因数时浪费了大量的调用。练习的第二部分是为\
    \ `factorize(..)` 使用相同的闭包技术。\n\n请为 `is_prime(..)` 和 `factorize(..)` 使用分开的闭包进行缓存，而不是将它们放在单个作用域内。\n\
    \n尝试自己完成该练习，然后查看本附录末尾的解答。\n\n## 关于内存的几句话\n\n我想简要介绍一下这种闭包缓存技术以及它对你的应用程序性能的影响。\n\
    \n我们可以看到，通过节省重复调用，我们提高了计算速度（在某些情况下，提升幅度是巨大的）。但这种对闭包的使用是在进行一种显式的权衡，你应该意识到这一点。\n\
    \n这种权衡是无限制的。我们本质上是在扩大缓存（在内存中）。如果涉及的函数被调用了数百万次且输入大多是唯一的，我们将消耗大量的内存。这绝对是值得花费的，但前提是我们认为很可能会看到常见输入的重复，这样我们才能利用缓存的优势。\n\
    \n如果大多数输入都是唯一的，且缓存几乎没有产生任何益处，那么使用这种技术是不合适的。\n\n此外，使用更复杂的缓存方法可能是一个好主意，例如 LRU（最久未未使用）缓存，它可以限制其大小；当它运行到限制时，LRU\
    \ 会剔除那些……嗯，最久未被使用的值！\n\n这里的缺点是，LRU 本身就相当复杂。你会希望使用一个高度优化的 LRU 实现，并敏锐地意识到所有涉及其中的权衡。\n\
    \n## 闭包（第 2 部分）\n\n在这个练习中，我们将通过定义一个 `toggle(..)` 工具函数来获取主动闭包，它提供了一个值切换器。\n\n你将一个或多个值（作为参数）传递给\
    \ `toggle(..)`，返回一个函数，该函数在每次被调用时，将按顺序在所有传入的值之间交替/轮。\n\n```javascript\nfunction\
    \ toggle(/* .. */) {\n  // ..\n}\n\nvar hello = toggle(\"hello\");\nvar onOff\
    \ = toggle(\"on\",\"off\");\nvar speed = toggle(\"slow\",\"medium\",\"fast\");\n\
    \nhello();      // \"hello\"\nhello();      // \"hello\"\n\nonOff();     // \"\
    on\"\noffOff();    // \"off\"\nonOff();     // \"on\"\n```\n\n```javascript\n\
    speed();      // \"slow\"\nspeed();      // \"medium\"\nspeed();      // \"fast\"\
    \nspeed();      // \"slow\"\n```\n\n向 `toggle(..)` 传递没有任何值的边缘情况并不重要；这样的切换器实例可以始终返回\
    \ `undefined`。\n\n尝试自己完成该练习，然后查看本附录末尾的解答。\n\n## 闭包（第 3 部分）\n\n在关于闭包的第三也是最后一个练习中，我们将实现一个基础计算器。`calculator()`\
    \ 函数将产生一个计算器实例，该实例以如下函数 `calc(..)` 的形式维护自己的状态：\n\n```javascript\nfunction calculator()\
