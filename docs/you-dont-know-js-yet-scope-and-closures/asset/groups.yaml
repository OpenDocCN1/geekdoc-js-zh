    \n```javascript\nvar lastI;\n```\n\n```javascript\nfor (let i = 0; i < 5; i++)\
    \ {\n  lastI = i;\n  if (checkValue(i)) {\n    break;\n  }\n}\n```\n\n```javascript\n\
    if (lastI < 5) {\n  console.log(\"The loop stopped early!\");\n}\n```\n\n## 第\
