    Chapter 8: The Module Pattern


    Student is now an instance of a module. It features a public API with a single
    method: getName(..). This method is able to access the private hidden records
    data.


    # # Warning


    > I should point out that the explicit student data being hard-coded into this
    module definition is just for our illustration purposes. A typical module in your
    program will receive this data from an outside source, typically loaded from databases,
    JSON data files, Ajax calls, etc. The data is injected into the module instance
    typically through method(s) on the module''s public API.


    How does the classic module format work?


    Notice that the instance of the module is created by the defineStudent() IIFE
    being executed. This IIFE returns an object (named publicAPI) that has a property
    on it referencing the inner getter getName(..) function.


    Naming the object publicAPI is stylistic preference on my part. The object can
    be named whatever you like (JS doesn''t care), or you can return an object directly
    without assigning it to any internal named variable. More on this choice in Appendix
    A.


    From the outside, Student.getName(..) invokes this inner function, which maintains
    access to the inner records variable via closure.


    You don''t have to return an object with a function as one of its properties.
    You could just return a function directly, in place of the object. That still
    satisfies all the core bits of a classic module.


