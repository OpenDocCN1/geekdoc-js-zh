  - "[PAGE 89]\n\nSo, we have window, self, global, and this ugly new Function(..)\
    \ trick. That’s a lot of different ways to try to get at this global object. Each\
    \ has its pros and cons.\n\nWhy not introduce yet another?!\n\nAs of ES2020, JS\
    \ has finally defined a standardized reference to the global object, called globalThis.\
    \ So, subject to the recency of the JS engines your code runs, you can use globalThis\
    \ in any of those other approaches.\n\nWe could even attempt to define a cross-environment\
    \ polyfill that’s safer pre-globalObject JS environments, such as:\n\n```\nconst\
    \ globalScopeObject =\n  (typeof globalThis != \"undefined\") ? globalThis :\n\
    \  (typeof global != \"undefined\") ? global :\n  (typeof window != \"undefined\"\
    ) ? window :\n  (typeof self != \"undefined\") ? self :\n  (new Function(\"return\
    \ this\")());\n```\n\nPhew! That’s certainly not ideal, but it works if you find\
    \ yourself needing a reliable global scope reference.\n\n(The proposed name globalThis\
    \ was fairly controversial while the feature was being added to JS. Specifically,\
    \ I and many felt the “this” reference in its name was misleading, the reason\
    \ you reference this object is to access to the global scope, never to access\
    \ some sort of global/default binding. There were many other names considered,\
    \ for a variety of reasons ruled out. Unfortunately, the name chosen up also as\
    \ a last resort. If you plan to interact with the global scope object in your\
    \ programs, to reduce confusion, I strongly recommend choosing a better name,\
    \ such as (the laughably long but accurate!)globalScopeObject used here.)"
  - '[PAGE 90]


    # Globally Aware


    The global scope is present and relevant in every JS program, even though modern
    patterns for organizing code into modules de-emphasizes much of the reliance on
    storing identifiers in that namespace.


    Still, as our code proliferates more and more beyond the confines of the browser,
    it''s especially important we have a solid grasp on the differences in how the
    global scope (and global scope object!) behave across different JS environments.


    With the big picture of global scope now sharper in focus, the next chapter again
    descends into the deeper details of lexical scope, examining how and when variables
    can be used.'
  - '[PAGE 91]


    # Chapter 5: The (Not So) Secret Lifecycle of Variables


    By now you should have a decent grasp of the nesting of scopes, from the global
    scope downward—called a program’s scope chain.


    But just knowing which scope a variable comes from is only part of the story.
    If a variable declaration appears past the first statement of a scope, how will
    references to that identifier before the declaration behave? What happens if you
    try to declare the same variable twice in a scope?


    JS’s particular flavor of lexical scope is rich with nuance in how and when variables
    come into existence and become available to the program.


    # When Can I Use a Variable?


    At what point does a variable become available to use within its scope? There
    may seem to be an obvious answer: after the variable has been declared/created.
    Right? Not quite.


    Consider:'
