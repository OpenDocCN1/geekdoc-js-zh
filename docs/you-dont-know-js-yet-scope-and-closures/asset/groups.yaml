    # The Case for var


    Speaking of variable hoisting, let''s have some real talk for a bit about var,
    a favorite villain devs love to blame for many of the woes of JS development.
    In Chapter 5, we explored let/const and promised we will revisit where var falls
    in the whole mix.


    As I lay out the case, don''t miss:


    +   - var was never broken

    * let is your friend

    * const has limited utility

    * The best of both worlds: var and let


    # Don''t Throw Out var


    var is fine, and works just fine. It''s been around for 25 years, and it''ll be
    around and useful and functional for another 25 years or more. Claims that var
    is broken, deprecated, outdated, dangerous, or ill-designed is bogus bandwagoning.


    Does that mean var is the right declarator for every single declaration in your
    program? Certainly not. But it still has its'
