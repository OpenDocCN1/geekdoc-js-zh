- md: "\n# Chapter 6: Limiting Scope Exposure\n\nLet's first identify the scopes and\
    \ their identifiers:\n\n- 1. The outer/global scope has one identifier, the function\
    \ getNextMonthStart(..).\n- 2. The function scope for getNextMonthStart(..) has\
    \ three: dateStr (parameter), nextMonth, and year.\n- 3. The { .. } curly-brace\
    \ pair defines an inner scope that includes one variable: curMonth.\n\nSo why\
    \ put curMonth in an explicit block scope instead of just alongside nextMonth\
    \ and year in the top-level function scope? Because curMonth is only needed for\
    \ those first two statements; at the function level it's over-exposed.\n\nThis\
    \ example is small, so the hazards of over-exposing curMonth are pretty limited.\
    \ But the benefits of the POLE principle are best achieved when you adopt the\
    \ mindset of minimizing scope exposure by default, as a habit. If you follow the\
    \ principle consistently even in the small cases, it will serve you more as your\
    \ programs grow.\n\nLet's now look at what sortNamesByLength(names) {\n\n```javascript\n\
    function sortNamesByLength(names) {\n  var buckets = [];\n\n  for (let firstName\
    \ of names) {\n    if (buckets[firstName.length] == null) {\n      buckets[firstName.length]\
    \ = [];\n    }\n    buckets[firstName.length].push(firstName);\n  }\n\n// a block\
    \ to narrow the scope\n{\nlet sortedNames = [];\n\nfor (let bucket of buckets)\
    \ {\n  if (bucket) {\n    // sort each bucket alphanically\n    bucket.sort();\n\
    \n    // append the sorted names to our\n    // running list\n    sortedNames\
    \ = [\n      ...sortedNames,\n      ...bucket\n    ];\n  }\n}\n\nreturn sortedNames;\n\
    }\n```\n\n```javascript\nsortNamesByLength([\n  \"Sally\",\n  \"Suzy\",\n  \"\
    Frank\",\n  \"John\",\n  \"Jennifer\",\n  \"Scott\"\n]);\n// [\"John\", \"Suzy\"\
    , \"Frank\", \"Sally\",\n// [\"Scott\", \"Jennifer\"]\n```\n\nThere are six identifiers\
    \ declared across five different scopes. Could all of these variables have existed\
    \ in the single out/global scope? Technically, yes, since they're all uniquely\
    \ named and thus no name collisions. But this would be really poor code organization,\
    \ and would likely lead to both confusion and future bugs.\n\n# var and let\n\n\
    We split them out into each inner nested scope as appropriate. Each variable is\
    \ defined at the innermost scope possible for the program to operate as desired.\n\
    \nsortedNames could have been defined in the top-level function scope, but it's\
    \ only needed for the second half of this function. To avoid over-exposing that\
    \ variable in a higher level scope, we again follow POLE and block-scope it in\
    \ the inner explicit block scope.\n\nNext, let's talk about the declaration var\
    \ buckets. That variable is used across the entire function (except the final\
    \ return statement). Any variable that is needed across all (or even most) of\
    \ a function should be declared so that such usage is obvious.\n\n> Note\n> The\
    \ parameter names isn't used across the whole function, but there's no way to\
    \ limit the scope of a parameter, so it behaves as a function-wide declaration\
    \ regardless.\n\nSo why did we use var instead of let to declare the buckets variable?\
    \ There's both semantic and technical reasons to choose var here.\n\nStylistically,\
    \ var has always, from the earliest days of JS, signaled “variable” that belongs\
    \ to a whole function. As asserted in “Lexical Scope” (Chapter 1), var attaches\
    \ to the nearest enclosing function scope, no matter where it appears.\n\nThat’s\
    \ true even if var appears inside a block:\n\n```javascript\nfunction diff(x,y)\
    \ {\n  if (x > y) {\n    var tmp = x;      // `tmp` is function-scoped\n    x\
    \ = y;\n    y = tmp;\n  }\n\n  return y - x;\n}\n```\n\nEven though var is inside\
