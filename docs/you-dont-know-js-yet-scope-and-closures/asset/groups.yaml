    Chapter 5: The (Not So) Secret Lifecycle of Variables


    right? At that moment, it would seem, only the outer studentName exists, so’s
    the variable console.log(...) should access print.


    But instead, the first console.log(...) throws a TDZ error, because in fact, the
    inner scope’s studentName was hoisted (auto-registered at the top of the scope).
    What **didn’t** happen (yet!) was the auto-initialization of that inner studentName;
    it’s still uninitialized at that moment, hence the TDZ violation!


    So to summarize, TDZ errors occur because let/const declarations hoist to the
    top of their scopes, but unlike `var`, they defer the auto-initialization of their
    variables until the moment in the code’s sequencing where the original declaration
    appeared. This window of time (hint: temporal), whatever its length, is the TDZ.


    How can you avoid TDZ errors?


    My advice: always put your let and const declarations at the top of any scope.
    Shrink the TDZ window to zero (or near zero) length, and then it’ll be moot.


    But why is TDZ even a thing? Why didn’t TC39 dictate that let/const autoinitialize
    the way var does? Just be patient, we’ll come back to explore the *why* of TDZ
    in Appendix A.


    # Finally Initialized


    Working with variables has much more nuance than it seems at first glance. Hoisting,
    (re)declaration, and the TDZ are common sources of confusion for developers, especially
    those who have worked in other languages before coming to JS.'
