    Chapter 7: Using Closures


    132


    Closure is one of the most important language characteristics ever invented in
    programming—it underlies major programming paradigms, including Functional Programming
    (FP), modules, and even a bit of class-oriented design. Getting comfortable with
    closure is required for mastering JS and effectively leveraging many important
    design patterns throughout your code.


    Addressing all aspects of closure requires a daunting mountain of discussion and
    code through this chapter. Make sure to take your time and ensure you''re comfortable
    with each bit before moving onto the next.


    # # See the Closure


    Closure is originally a mathematical concept, from lambda calculus. But I''m not
    going to list out math formulas or use a bunch of notation and jargon to define
    it.


    Instead, I''m going to focus on a practical perspective. We''ll start by defining
    closure in terms of what we can observe in different behavior of our programs,
    as opposed to if closure was not present in JS. However, later in this chapter,
    we''re going to flip closure around to look at it from an alternative perspective.


    Closure is a behavior of functions and only functions. If you aren''t dealing
    with a function, closure does not apply. An object cannot have closure, nor does
    a class have closure (though its functions/methods might). Only functions have
    closure.


    For closure to be observed, a function must be invoked, and specifically it must
