    \ */ }\nfrom \"/path/to/students.js\";\n```\n\n```\ngetName(73);      // Suzy\n\
    ```\n\n相比之下，导入的另一种主要变体被称为“命名空间导入”：\n\n```javascript\nimport * as Student from\
    \ \"/path/to/students.js\";\n```\n\n```\nStudent.getName(73);      // Suzy\n```\n\
    \n显而易见，`*` 导出到 API 的所有内容（包括默认和命名），并将它们存储在指定的单个命名空间标识符下。这种方法最符合 JS 大部分历史中经典模块的形式。\n\
    \n## Note事项\n\n> 截至本文编写时，现代浏览器支持 ESM 已有几年，但 Node 对 ESM 的稳定支持是最近的，并且演变了相当一段时间。这种演变可能会持续一年或更久；在\
