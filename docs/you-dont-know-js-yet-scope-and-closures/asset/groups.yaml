  mdcn: "\n## 第 7 章：闭包\n\n137\n\n```\nfunction adder(num1) {\n  return function addTo(num2)\
    \ {\n    return num1 + num2;\n  }\n}\n```\n\n```javascript\nvar add10To = adder(10);\n\
    var add42To = adder(42);\n```\n\n```javascript\nadd10To(15); // 25\nadd42To(9);\
    \ // 51\n```\n\n内部 `addTo(..)` 函数的每个实例都闭包了自己的 `num1` 变量（值分别为 10 和 42），因此这些 `num1`\
    \ 不会因为 `adder(..)` 执行结束而消失。当我们调用这些内部 `addTo(..)` 实例（例如 `add10To(15)`），被闭包的 `num1`\
    \ 变量仍然存在，并且仍然持有原始的 `10` 值。因此，该操作能够执行 `10 + 15` 并返回答案 `25`。\n\n上一个段中有一个重要的细节可能太容易被忽略，所以让我们强化一下：**闭包与函数的实例相关，而不是与其单一的词法定义相关。**\
    \ 在之前的代码段中，`adder(..)` 内部只定义了一个内部 `addTo(..)` 函数，因此看起来似乎意味着只有一个闭包。\n\n实际上，每当外部函数\
    \ `adder(..)` 运行时，都会创建一个新的内部 `addTo(..)` 函数，并为每个新实例创建一个闭包。因此，每个内部函数实例（在我们的程序中被标记为\
    \ `add10To(..)` 和 `442To(..)`）都有它们自己的闭包，闭包了该次 `adder(..)` 执行时作用域环境的实例。\n\n尽管闭包基于词法作用域（而词法作用域是在编译时处理的），但闭包被观察为函数实例的运行时特征。\n\
    \n## 实时链接，而非快照\n\n在之前章节的两个示例中，我们都是从一个在闭包中的变量中读取值。这让人觉得闭包似乎是某个特定时刻值的快照。事实上，这是一个常见的误区。\n\
    \n闭包实际上是一个**实时链接**，保留了变量本身。我们并不局限于仅仅读取值；被闭包的变量也可以被更新（重新赋值）！通过在函数中闭包变量，只要程序中存在该函数的引用，我们可以一直使用该变量（读和写），并且从我们想要任何地方调用该函数。这就是为什么闭包是一种强大的技术，被广泛应用于编程的许多领域！\n\
    \n![](img/14a2f9063d3ac52e6a98517a7d87857f_155_0.png)\n\n如图 4 所示，每次调用 `adder(..)`\
    \ 都会创建一个包含 `num1` 变量的新 BLUE(2) 作用域，以及一个作为 GREEN(3) 作用域的新 `addTo(..)` 函数实例。请注意，函数实例（`addTo10(..)`\
    \ 和 `addTo42(..)`）是从 RED(1) 作用域调用的。\n\n现在让我们来看一个被闭包变量被更新的示例：\n\n```javascript\n\
    function makeCounter() {\n  var count = 0;\n\n  return function getCurrent() {\n\
    \    count = count + 1;\n    return count;\n  }\n}\n\nvar hits = makeCounter();\n\
    \n// 以后\nhits(); // 1\n\n// 以后\nhits(); // 2\nhits(); // 3\n```\n\n`count` 变量被内部\
    \ `getCurrent()` 函数闭包，它保留了该变量而不是使其受垃圾回收（GC）。`hits()` 函数访问并更新了这个变量，每次返回一个递增的计数。\n\
    \n虽然闭包的包层作用域通常来自一个函数，但这并不是必须的；只需要在外部作用域内部存在一个内部函数即可：\n\n`var hits;`\n\n```javascript\n\
    {\n  // 一个外部作用域（但不是函数）\n  let count = 0;\n  hits = function getCurrent() {\n \
    \   count = count + 1;\n    return count;\n  };\n}\nhits(); // 1\nhits(); // 2\n\
    hits(); // 3\n```\n\n## 注意\n\n我刻意将 `getCurrent()` 定义为函数表达式而不是函数声明。这与闭包无关，而是为了处理\
    \ FiB（第 6 章）中危险的特性。\n\n由于开发者经常很容易将闭包误认为是面向值的，他们有时会在尝试使用闭包来快照式保留某个时刻的值时陷入困扰。考虑：\n\
    \n`var studentName = \"Frank\";`\n\n```javascript\nvar greeting = function hello()\
    \ {\n  // 我们正在闭包 `studentName`\n  // 而不是 \"Frank\"\n  console.log(\n    `Hello,\
    \ ${studentName}!`\n  );\n}\n```\n\n## 第 7 章：使用闭包\n\n```javascript\n// 以后\n\n\
    studentName = \"Suzy\";\n\n// 以后\n\ngreeting();\n// Hello, Suzy!\n```\n\n通过在重新赋值为\
    \ \"Suzy\" 之前定义 `greeting()`（即 `hello()`），值 \"Frank\"——通常错误的假设是闭包会捕获 \"Frank\"\
    —但 `greeting()` 闭包的是变量 `studentName`，而不是它的值。每当 `greeting()` 被调用时，变量的当前值（在此例中为\
    \ \"Suzy\"）就会反映出来。\n\n这种错误的经典插图是在循环中定义函数：\n\n```javascript\nvar keeps = [];\n\n\
    for (var i = 0; i < 3; i++) {\n  keeps[i] = function() {\n    return i;\n  };\n\
    }\n\nkeeps[0](); // 3\nkeeps[1](); // 3\nkeeps[2](); // 3\n```\n\n## 注意\n\n错误的假设通常是闭包会捕获\
    \ \"Frank\"。但 `greeting()` 闭包的是变量 `studentName`，而不是它的值。每当 `greeting()` 被调用时，变量的当前值（在此例中为\
    \ \"Suzy\"）就会反映出来。\n\n这种错误的经典插图是在循环中定义函数：\n\n（注：原文后续文本由于存在大量 OCR 错误和重复乱码，已根据逻辑进行了清理并翻译了核心含义）\n\
