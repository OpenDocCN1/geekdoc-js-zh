  mdcn: "\n## 第 7 章：使用闭包\n\naddTo(..) 通过返回和赋值移动到外部 RED(1) 作用域，我们可以想象它们实际上留在它们自己的作用域环境中，当然，它们的作用域链是完整的。\n\
    \n发送到 RED(1) 作用域的是**仅仅是原地函数实例的引用**，而不是函数实例本身。图 5 描述了内部函数实例留在原地，分别被 RED(1) addTo10\
    \ 和 addTo42 引用指向：\n\n![](img/14a2f9063d3ac52e6a98517a7d87857f_177_0.png)\n\n如图\
    \ 5 所示，每次调用 adder(..) 仍然会创建一个包含 num1 变量的新 BLUE(2) 作用域，以及一个 GREEN(3) addTo(..)\
    \ 作用域的实例。但与图 4 不同的是，现在这些 GREEN(3) 实例留在原地，自然地嵌套在它们的 BLUE(2) 作用域实例内部。addTo10 和 addTo42\
    \ 引用被移动到了 RED(1) 外部作用域，而不是函数实例本身。\n\n当调用 addTo10(15) 时，addTo(..) 函数实例（仍留在其原始 BLUE(2)\
    \ 作用域环境中）被触发。由于函数实例本身从未移动，它当然仍然可以自然地访问其作用域链。对于 addTo42(9) 调用——除了词法作用域外，这里没有特殊的。\n\
    \n所以当存在闭包时，如果不是那种让函数即使在其他作用域间移动，仍能保持与其原始作用域链链接的魔法呢？在这种替代模型中，函数留在原地，并像以前一样继续访问它们原始的作用域链。\n\
    \n闭包描述的是一种让函数实例及其整个作用域环境和链存活的魔法，只要程序的其他部分至少有一个指向该函数实例的引用在浮动。\n\n与传统的学术视角相比，这种闭包的定义更具观察性，听起来也没那么熟悉。但它仍然很有用，因为它的好处在于我们将闭包的解释简化为了引用和原地函数实例的直接组合。\n\
    \n上一个模型（图 4）在描述 JS 闭包时并没有错。它只是更受概念启发，是一种关于闭包的学术视角。相比之下，替代模型（图 5）可以被描述为更关注实现，即\
    \ JS 的实际工作方式。\n\n两种视角/模型在理解闭包方面都是用的，但读者可能会发现其中一个比另一个更容易掌握。无论你选择哪一个，我们程序中的可观测结果都是相同的。\n\
    \n> 注意：这种闭包的替代模型会影响我们是否将同步回调归类为闭包示例。关于这一细节，请参见附录 A。\n\n## 为什么要用闭包？\n\n现在我们对闭包是什么以及它是如何工作的有了全面的认识，让我们探索一下它如何改进示例程序的代码结构和组织。\n\
    \n假设页面上有一个按钮，点击时应该通过 Ajax 请求检索并发送某些数据。在不使用闭包的情况下：\n\n```javascript\nvar endpoints\
    \ = {\n  studentIDs:\n    \"https://some.api/register-students\",\n  //..\n};\n\
    var data = {\n  studentIDs: [ 14, 73, 112, 6 ],\n  //..\n};\n\nfunction makeRequest(evt)\
    \ {\n  var btn = evt.target;\n  var recordKind = btn.dataset.kind;\n  ajax(\n\
    \    APIendpoints[recordKind],\n    data[recordKind]\n  );\n}\n\n// <button data-kind=\"\
    studentIDs\">\n// Register Students\n// </button>\nbtn.addEventListener(\"click\"\
    , makeRequest);\n```\n\nmakeRequest() 工具函数只从点击事件接收一个 `evt` 对象。从那里，它必须从目标元素获取 `data-kind`\
    \ 属性，并使用该值查找 API 端点的 URL 以及应该包含在 Ajax 请求中的数据。\n\n这种运行是可以的，但事件处理程序每次触发时都必须读取 DOM\
    \ 属性，这很遗憾（效率低下且更混乱）。为什么事件处理程序不能记住这个值呢？让我们尝试使用闭包来改进代码：\n\n```javascript\nvar APIendpoints\
    \ = {\n  studentIDs:\n    \"https://some.api/register-students\",\n  //..\n};\n\
    \nvar data = {\n  studentIDs: [ 14, 73, 112, 6 ],\n  //..\n};\n\nfunction setupButtonHandler(btn)\
    \ {\n  var recordKind = btn.dataset.kind;\n\n  btn.addEventListener(\n    \"click\"\
    ,\n    function makeRequest(evt){\n      ajax(\n        APIendpoints[recordKind],\n\
    \        data[recordKind]\n      );\n    }\n  );\n}\n\n// <button data-kind=\"\
    studentIDs\">\n// Register Students\n// </button>\n\nsetupButtonHandler(btn);\n\
    ```\n\n通过 setupButtonHandler(..) 方法，`kind` 属性在初始设置时被获取一次并赋值给 `recordKind` 变量。然后\
    \ `recordKind` 被闭包在内部的 `makeRequest(..)` 点击处理器中，它的值在每次事件触发时都会被用于查找应该发送的 URL 和数据。\n\
    \n> 注意：`evt` 仍然传递给了 `makeRequest`。\n\n"
