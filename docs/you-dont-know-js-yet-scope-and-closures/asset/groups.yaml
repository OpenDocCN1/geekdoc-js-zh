    \ it's a classic module factory function. Inside the machinery of define(..) (provided\
    \ by RequireJS), the StudentList(..) function is executed, passing to it any other\
    \ module instances declared as dependencies. The return value is an object representing\
    \ the public API for the module.\n\nThis is based on exactly the same principles\
    \ (including how the closure works!) as we explored with classic modules.\n\n\
    # Universal Modules (UMD)\n\nThe final variation we'll look at UMD, which is a\
    \ less specific, exact format and more a collection of very similar formats. It\
    \ was designed to create better interop (without any build-tool conversion) for\
    \ modules that may be loaded in browsers, by AMD-style loaders, or in Node. I\
    \ personally still publish many of my utility libraries using a form of UMD."
