    \ on it in their programs. But should all hoisting (including function hoisting)\
    \ be avoided? We'll explore these different perspectives on hoisting in more detail\
    \ in Appendix A.\n\n## Hoisting: Yet Another Metaphor\n\nChapter 2 was full of\
