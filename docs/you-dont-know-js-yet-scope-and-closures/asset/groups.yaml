    \ is function hoisted (see Chapter 5), so it’s available throughout the whole\
    \ scope of the module.\n\nAnother allowed variation:\n\n```javascript\nexport\
    \ default function getName(studentID) {\n// ..\n}\n```\n\nThis is a so-called\
