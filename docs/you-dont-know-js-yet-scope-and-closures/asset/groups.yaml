    \ vs. Expression\n\nFunction hoisting only applies to formal function declarations\
    \ (specifically those which appear outside of blocks—“FIB” in Chapter 6), not\
    \ to function expression assignments.\n\n```\ngreeting();\n// TypeError\n```\n\
    \n```\nvar greeting = function greeting() {\nconsole.log(\"Hello!\");\n};\n```\n\
    \nLine 1 (greeting());) throws an error. But the kind of error thrown is very\
    \ important to notice. A TypeError means we’re trying to do something with a value\
    \ that is not allowed. Depending on your JS environment, the error message would\
    \ say something like, “undefined” is not a function,” or more helpfully, “greeting”\
    \ is not a function.\n\nNotice that the error is not ReferenceError. JS isn’t\
