    \n例如，某些代码中的 `return` 语句如果被 IIFE 包裹，其含义就会改变，因为现在 `return` 将指向 IIFE 的函数。非箭头函数 IIFE\
    \ 还会改变关键字的绑定——更多内容请见《对象与类》一书。像 `break` 和 `continue` 这样的语句将无法跨越 IIFE 函数边界控制外部循环。\n\
