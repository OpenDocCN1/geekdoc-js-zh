- md: "\n# Note\n\nThe error message as seen here used to be much more vague or misleading.\
    \ Frankly, several of us in the community were successfully able to lobby for\
    \ JS engines to improve this error message so it more accurately tells you what’s\
    \ wrong!\n\nThat error message is quite indicative of what’s wrong: studentName\
    \ exists on line 1, but it’s not been initialized, so it cannot be used yet. Let’s\
    \ try this:\n\n```javascript\nstudentName = \"Suzy\"; // let's try to initialize\
    \ it!\n// ReferenceError\n```\n\n```javascript\nconsole.log(studentName);\n```\n\
    \n```javascript\nlet studentName;\n```\n\nOops. We still get the ReferenceError,\
    \ but now on the first line where we’re trying to assign to (aka, initialize!)\
    \ this so-called “uninitialized” variable. What’s the deal? The real question\
    \ is, how do we initialize an uninitialized variable? For let/const, the only\
    \ way to do so is with an assignment attached to a declaration. An assignment\
    \ by itself is insufficient! Consider:\n\n```javascript\nlet studentName = \"\
    Suzy\";\nconsole.log(studentName); // Suzy\n```\n\nHere, we are initializing the\
    \ studentName (in this case, to \"Suzy\" instead of undefined) by way of the let\
    \ statement that is coupled with an assignment.\n\nAlternatively:\n\n```javascript\n\
    let studentName;\n// or:\nlet studentName = undefined;\n\n// ..\nstudentName =\
    \ \"Suzy\";\nconsole.log(studentName);\n```\n\nThat's interesting! Recall from\
    \ earlier, we said that var studentName; is not the same as var studentName =\
    \ undefined; but here with let, they behave the same. The difference comes down\
    \ to the fact that var automatically initializes at the top of the scope, where\
    \ let does not. Remember that we've asserted a few times that let/const declarators,\
    \ replacing them with the instructions at the top of each scope to register the\
    \ appropriate identifiers. So if we analyze what’s going on, we see that an additional\
    \ nuance is that Compiler is also adding an instruction in the middle of the program,\
    \ at the point where the variable was declared, to handle that declaration. We\
    \ cannot use the variable at any point prior to that initialization. The same\
    \ goes for const as it does for let. The term coined by TC39 to refer to this\
    \ period of time from entering a scope to where the auto-initialization occurs\
    \ is Temporal Dead Zone (TDZ). The TDZ is the time window where a variable exists\
    \ but is still uninitialized, and therefore cannot be accessed in any way. Only\
    \ the execution of the instructions left by Compiler at the point of declaration\
    \ can do that. After that moment, the TDZ is done, and the variable is free to\
    \ be used for the rest of the scope. var also technically has a TDZ, but it’s\
    \ zero in length and thus observable. By way, “temporal” in TDZ does indeed refer\
    \ to position in code. Consider:\n\n```javascript\naskQuestion();\n// ReferenceError\n\
    let studentName = \"Suzy\";\n\nfunction askQuestion() {\n  console.log(`${studentName},\
    \ do you know?`);\n}\n```\n\nEven positionally console.log comes after the let\
    \ declaration, while studentName is still in its TDZ! Hence the error. There’s\
    \ a common misconception that TDZ means let and const do not hoist. This is inaccurate,\
    \ or at least misleading claim. They definitely hoist. The actual difference is\
    \ that let/const declarations do not automatically initialize at the beginning\
    \ of the scope, var does. The debate is then if auto-initialization is part of\
    \ hoisting, or not? I think auto-registration of a variable at the top of the\
    \ scope (i.e., what I call “hoisting”) and auto-initialization at the top of the\
    \ scope (to undefined) are distinct operations. We’ve already seen that let and\
    \ const don’t auto-initialize at the top of the scope. But let’s prove that let\
    \ and const do hoist (auto-register at the top of the scope), courtesy of our\
    \ friend shadowing:\n\n```javascript\nvar studentName = \"Kyle\";\n\n{\n  console.log(studentName);\
    \ // ???\n\n  // ..\n  let studentName = \"Suzy\";\n\n  console.log(studentName);\
    \ // Suzy\n}\n```\n\nWhat’s going to happen with the first statement? If studentName\
    \ didn’t hoist to the top of the scope, then the first console.log should print\
    \ \"Kyle\". At that moment, it would seem only the outer studentName exists, so\
    \ variable should access. But instead, the first console.log throws a TDZ error,\
    \ because in fact the inner scope’s studentName was hoisted (auto-registered at\
    \ the top of the scope). What didn’t happen (yet!) was the auto-initialization\
    \ of that studentName; it’s still uninitialized at that moment, hence the TDZ\
    \ violation! So to summarize, TDZ errors occur because let/const declarations\
    \ hoist to the top of their scopes, but unlike var, they defer the auto-initialization\
    \ of their variables until the moment in the code’s sequencing where the original\
    \ declaration appeared. This window of time (hint: temporal), whatever its length,\
    \ is the TDZ. How can you avoid TDZ errors? My advice: always put your let and\
    \ const declarations at the top of any scope. Shrink the TDZ window to zero (or\
    \ near zero) length, and then itll be moot. But why is TDZ even a thing? Why didn’t\
    \ TC39 dictate that let/const auto-initialize the way var does? Just be patient,\
    \ we’ll come back to explore the why of TDZ in Appendix A.\n\n# Finally Initialized\n\
    \nWorking with variables has much more nuance than it seems at first glance. Hoisting,\
    \ (re)declaration, and the TDZ are common sources of confusion for developers,\
    \ especially those who have worked in other languages before coming to JS.\n\n\
    Before moving on, make sure your mental model is fully grounded on these aspects\
    \ of JS scope and variables. Hoisting is generally cited as an explicit mechanism\
    \ of the JS engine, but it's really more a metaphor to describe the various ways\
    \ JS handles variable declarations during compilation. But even as a metaphor,\
    \ hoisting offers useful structure for thinking about the lifecycle of a variable—when\
    \ it's created, when it's available to use, when it goes away. Declaration and\
    \ re-declaration of variables tend to cause confusion when thought as runtime\
    \ operations. But if you shift to compile-time thinking for these operations,\
    \ the quirks and shadows diminish. The TDZ (temporal dead zone) error is strange\
    \ and frustrating when encountered. Fortunately, TDZ is relatively straightforward\
    \ to avoid if you're always careful to place let/const declarations at the top\
    \ of any scope. As you successfully navigate these twists and turns of variable\
    \ scope, the next chapter will lay out the factors that guide our decisions to\
    \ place our declarations in various scopes, especially nested blocks.\n\n# Chapter\
    \ 6: Limiting Scope Exposure\n\nSo far our focus has been explaining the mechanics\
    \ of scopes and variables work. With that foundation now firmly in place, our\
    \ attention raises to a higher level of thinking: decisions and patterns we apply\
    \ across the whole program. To begin, we're going to look at how and why we should\
    \ be using different levels of scope (functions and blocks) to organize our program’s\
    \ variables, specifically to reduce scope over-exposure.\n\n## Least Exposure\n\
    \nIt makes sense that functions define their own scopes. But why do we need blocks\
    \ to create scopes as well?\n\nSoftware engineering articulates a fundamental\
    \ discipline, typically applied to software security, called “The Principle of\
    \ Least Privilege” (POLP). ¹¹ And a variation of this principle that applies to\
    \ our current discussion is typically labeled as “Least Exposure” (POLE).\n\n\
    POLP expresses a defensive posture to software architecture: components of the\
    \ system should be designed to function with least privilege, least access, least\
    \ exposure. If each piece\n\n> ¹Principle of Least Privilege, https://en.wikipedia.org/wiki/Principle_of_least_privilege,\
    \ 3 March 2020.\n"
  mdcn: "\n\n# 注意\n\n这里看到的错误信息以前要模糊得多或者更具有误导性。坦率地说，我们社区的几位成员成功促使 JS 引擎改进了这一错误信息，使其更准确地告诉你哪里出了问题！\n\
    \n这个错误信息清楚地指示了问题所在：`studentName` 存在于第 1 行，但它尚未初始化，因此尚无法使用。让我们尝试一下：\n\n```javascript\n\
    studentName = \"Suzy\"; //让我们尝试初始化它！\n// ReferenceError\n```\n\n```javascript\n\
    console.log(studentName);\n```\n\n```javascript\nlet studentName;\n```\n\n哎呀。我们仍然得到了\
    \ `ReferenceError`，但现在它出现在我们尝试赋值（即初始化！）这个所谓的“未初始化”变量的第一行。这是怎么回事呢？真正的问题是，我们该如何初始化一个未初始化的变量？对于\
    \ `let`/`const`，唯一的方法是在声明的同时附带一个赋值。单的赋值是不够的！请考虑以下情况：\n\n```javascript\nlet studentName\
    \ = \"Suzy\";\nconsole.log(studentName); // Suzy\n```\n\n在这里，我们通过与赋值耦合的 `let`\
    \ 语句初始化了 `studentName`（在这种情况下，初始化为 \"Suzy\" 而不是 `undefined`）。\n\n另一种：\n\n```javascript\n\
    let studentName;\n// 或者：\nlet studentName = undefined;\n\n// ..\nstudentName =\
    \ \"Suzy\";\nconsole.log(studentName);\n```\n\n这很有趣！回想之前，我们说过 `var studentName;`\
    \ 不等同于 `var studentName = undefined;`，但在这里使用 `let`，它们的行为是相同的。区别在于 `var` 会在作用域顶部自动初始化，而\
    \ `let` 则不会。记住，我们已经几次断言过 `let`/`const` 声明符会被替换为位于每个作用域顶部的指令，以注册适当的标识符。因此，如果我们分析正在发生的事情，会发现另一个细微差别是：编译器（Compiler）也会在程序中间、即变量声明的地方添加一条指令来处理该声明。在初始化完成之前的任何时候，我们都无法使用该变量。`const`\
    \ 与 `let` 一样。TC39 创造了一个术语来描述从进入作用域到自动初始化发生这段这段，称为**临时性死区**（Temporal Dead Zone，简称\
    \ **TDZ**）。TDZ 是变量存在但尚未初始化的时间窗口，因此无法以任何方式访问。只有执行编译器在声明点留下的指令才能做到这一点。在那之后，TDZ 宣告结束了，变量可以在作用域的剩余部分中自由使用。`var`\
    \ 在技术上也有 TDZ，但它的长度为零，因此是不可观测的。顺便提一下，TDZ 中的“temporal”（临时）确实指的是代码中的位置。考虑以下情况：\n\n\
    ```javascript\naskQuestion();\n// ReferenceError\nlet studentName = \"Suzy\";\n\
    \nfunction askQuestion() {\n  console.log(`${studentName}, do you know?`);\n}\n\
    ```\n\n即使从位置上看，`console.log` 位于 `let` 声明之后，但此时 `studentName` 仍处于它的 TDZ 中！因此产生了错误。有一种常见的误解，认为\
    \ TDZ 意味着 `let` 和 `const` 没有提升（hoist）。这种说法是不准确的，或者至少是误导性的声明。它们确实会提升。实际的区别在于 `let`/`const`\
    \ 声明不会在作用域开始时自动初始化，而 `var` 会。那么争论的焦点在于：自动初始化是否属于提升的一部分？我认为在作用域顶部对变量进行自动注册（即我所说的“提升”）和在作用域顶部进行自动初始化（为\
    \ `undefined`）是两个不同的操作。我们已经看到 `let` 和 `const` 不会在作用域顶部自动初始化。但让我们在朋友“变量遮蔽”（shadowing）的帮助下，证明\
    \ `let` 和 `const` 确实会提升（在作用域顶部自动注册）：\n\n```javascript\nvar studentName = \"Kyle\"\
    ;\n\n{\n  console.log(studentName); // ???\n\n  // ..\n  let studentName = \"\
    Suzy\";\n\n  console.log(studentName); // Suzy\n}\n```\n\n第一个语句会发生什么？如果 `studentName`\
    \ 没有提升到作用域顶部，那么第一个 `console.log` 应该打印 \"Kyle\"。在那个时刻，似乎只有外部的 `studentName` 存在，所以变量应该是可以访问的。但实际上，第一个\
    \ `console.log` 抛出了 TDZ 错误，因为实际上内部作用域的 `studentName` 已经提升了（在作用域顶部自动注册）。尚未发生（目前！）的是该\
    \ `studentName` 的自动初始化；在那个时刻它仍然未初始化，因此违反了 TDZ！总结一下，TDZ 错误的发生是因为 `let`/`const`\
    \ 声明提升到了它们作用域的顶部，但与 `var` 不同，它们将变量的自动初始化推迟到了代码执行顺序中原始声明出现的那个时刻。这段时间窗口（提示：temporal，临时性）无论长度如何，都是\
    \ TDZ。你如何避免 TDZ 错误？我的建议是：始终将你的 `let` 和 `const` 声明放在任何作用域的顶部。将 TDZ 窗口缩小到零（或接近零）长度，这样它就不存在了。但为什么会有\
    \ TDZ 这种东西？为什么 TC39 不规定 `let`/`const` 像 `var` 那样自动初始化呢？请耐心，我们将在附录 A 中探讨 TDZ 的原因。\n\
    \n# 最后初始化\n\n处理变量比初看之下要微妙得多。提升（Hoisting）、（重）声明和 TDZ 是开发者困惑的常见来源，特别是对于那些在学习 JS\
    \ 之前工作过其他语言的人来说。\n\n在继续之前，请确保你的心理模型在这些方面已经完全落地。提升通常被认为是 JS 引擎的一种显式机制，但它更多是一个比喻，用于描述\
    \ JS 在编译期间处理声明的各种方式。即使作为比喻，提升为思考变量的生命周期提供了有用的结构——何时创建、何时可用、何时消失。变量的声明和重新声明如果视为运行时操作，往往会导致困惑。但如果你转向编译时思维来考虑这些操作，那些怪现象就会减少。遇到\
    \ TDZ（临时性死区）错误会很奇怪且令人沮丧。幸运的是，如果你总是仔细地将 let/const 声明放在任何作用域的顶部，就可以很容易地避免。当你成功应对了变量作用域的这些折后，下一章将概述指导我们在各种作用域（尤其是嵌套块）中放置声明的因素。\n\
    \n# 第6 章：限制作用域暴露\n\n处理变量的微妙程度远比初看之下要得多。提升、（重）声明和 TDZ 是开发者困惑的常见来源，特别是对于那些在学习 JS\
    \ 之前工作过其他语言的人来说。\n\n在继续之前，请确保你的心理模型在这些方面已经完全落地。\n"
