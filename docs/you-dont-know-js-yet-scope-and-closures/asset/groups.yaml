  - '[PAGE 94]


    we’re trying to do something with a value that is not allowed. Depending on your
    JS environment, the error message would say something like, “undefined” is not
    a function,” or more helpfully, “greeting” is not a function.


    Notice that the error is not ReferenceError. JS isn’t telling us that it couldn''t
    find greeting as an identifier in the scope. It''s telling us that greeting was
    found but doesn''t hold a function reference at that moment. Only functions can
    be invoked, attempted to invoke some non-function value results in an error.


    But what does greeting hold, if not the function reference?


    In addition to being hoisted, variables declared with var are also automatically
    initialized to undefined at the beginning of their scope—again, the nearest enclosing
    function, or the global. Once initialized, they’re available to be used (assigned
    to, retrieved from, etc.) throughout the whole scope.


    So on first line, greeting exists, but it holds only the default undefined value.
    It''s not until line 4 that greeting gets assigned the function reference.


    Pay close attention to the distinction here. A function declaration is hoisted
    and initialized to its function value (again, called hoisting). A var variable
    is also hoisted, and then auto-initialized to undefined. Any subsequent function
    expression assignments to that variable don’t happen until that assignment is
    processed during runtime execution.


    In both cases, the name of the identifier is hoisted. The function reference association
    isn’t handled at initialization time (beginning of the scope) unless the identifier
    was created in a formal function declaration.'
  - '[PAGE 95]


    # Variable Hoisting


    Let''s look at another example of variable hoisting:


    ```

    greeting = "Hello!";nconsole.log(greeting);

    // Hello!

    var greeting = "Howdy!";

    ```


    Though greeting isn''t declared until line 5, it''s available to be assigned to
    early as line 1. Why?


    There''s two necessary parts to the explanation:


    +   - the identifier is hoisted,

    - and it''s automatically initialized to the value undefined from the top of the
    scope.


