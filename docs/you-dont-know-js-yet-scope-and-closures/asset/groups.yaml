    \ 的“重复声明”。这是否是最佳选择尚存争议，但至少我们知道了该决策背后的逻辑。\n\n## 循环\n\n从之前的讨论可以清楚看出，JS 并不真正希望我们在同一个作用域内“重复声明”变量。\n\
