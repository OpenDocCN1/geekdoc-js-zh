  mdcn: "\n所以，我们有了 `window`、`self`、`global` 以及这个糟糕的 `Function(..)` 技巧。获取这个全局对象的方法有很多种。每种方法都有其优缺点。\n\
    \n为什么不再来一个呢？！\n\n从 ES2020 开始，JS 终于定义了全局对象的标准引用，称为 `globalThis`。因此，取决于你代码运行的 JS\
    \ 引擎的新旧程度，可以使用上述任何一种其他方法。\n\n我们甚至可以尝试定义一个跨环境的 polyfill，它在没有 globalObject 的 JS\
    \ 环境中更安全，例如：\n\n```\nconst globalScopeObject =\n  (typeof globalThis != \"undefined\"\
    ) ? globalThis :\n  (typeof global != \"undefined\") ? global :\n  (typeof window\
    \ != \"undefined\") ? window :\n  (typeof self != \"undefined\") ? self :\n  (new\
    \ Function(\"return this\")());\n```\n\n呼！这确实不理想，但如果你发现需要一个可靠的全局作用域引用，它是可以的。\n\
    \n（提议的名称 `globalThis` 在该功能添加到 JS 时相当有争议。具体来说，我和许多人认为名称中的“this”引用是误导性的，你引用该对象是为了访问全局作用域，而绝不是为了访问某种全局/默认绑定。考虑过许多其他名称，但由于各种原因被排除了。遗憾的是，最终选定的名称也是最后的无奈。如果你计划在程序中与全局作用域对象交互，为了减少混淆，我强烈建议选择一个更好的名字，例如这里使用的（虽然长得可笑但很准确的！）`globalScopeObject`。）\n\
    \n## 全局感知 (Globally Aware)\n\n全局作用域在每个 JS 程序中都存在且相关联，尽管现代的将代码组织成模块的模式减少了许多对在该命名空间中存储标识符的依赖。\n\
    \n尽管如此，随着我们的代码不断超出浏览器的限制，坚实掌握全局作用域（以及全局作用域对象！）在不同 JS 环境中的行为差异变得尤为重要。\n\n现在对全局作用域的整体有了更清晰，下一章再次进入词法作用域的深层细节，检查变量如何以及何时被使用。\n\
    \n## 第 5 章：变量（不）秘密的生命周期\n\n到目前，你应该对从全局作用域向下的作用域嵌套有了良好的理解——这被称为程序的作用域链。\n\n但仅仅知道变量来自哪个作用域只是故事的一部。如果变量声明出现在作用域的第一条语句之后，那么在声明之前对该标识符的引用将如何表现？如果你尝试在一个作用域中声明两次同一个变量会发生什么？\n\
    \nJS 特有的词法作用域在变量何时以及如何产生并对程序可用方面具有丰富的细微差别。\n\n## 我什么时候可以使用变量？\n\n变量在它的作用域内从何时起开始变得可用？似乎有一个显而易见的答案：在变量被声明/创建之后。对吧？不完全是。\n\
    \n考虑：\n\n```\ngreeting();\n// Hello!\n\nfunction greeting() {\n  console.log(\"\
    Hello!\");\n}\n```\n\n这段代码运行良好。你可能见过过甚至写过类似这样的代码。但你是否想过它是如何或为什么能够运行的？具体来说，为什么你从第\
    \ 1 行就能访问标识符 `greeting`（以检索并执行函数引用），尽管 `greeting()` 函数声明直到第 4 行才出现？\n\n回想第 1 章提到，所有标识符在编译期间都会注册到它们各自的作用域中。此外，每当进入标识符所属的作用域时，每个标识符都会在该作用域的开头被创建。\n\
    \n用于变量从其闭包作用域开始开始可见（尽管其声明可能出现在作用域的后续）的最常用术语是**提升 (hoisting)**。\n\n但提升并不能完全回答这个问题。我们可以从作用域的开始看到标识符\
    \ `greeting`，但为什么我们可以在它声明之前调用 `greeting()` 函数呢？\n\n换句话说，从作用域开始运行的那一刻起，变量 `greeting`\
    \ 如何拥有任何值（函数引用）？答案是正式函数声明的一个特性，被称为**函数提升**。当函数声明的名称标识符在作用域顶部注册时，它还会被自动初始化为该函数的引用。这就是为什么函数可以在整个作用域内被调用！\n\
    \n一个关键细节是，函数提升和 `var` 风格的变量提升都是将它们的名称标识符附加到最近的闭包函数作用域（如果没有，则是全局作用域），而不是块级作用域。\n\
    \n## Note\n\n使用 `let` 和 `const` 的声明仍然会提升（见本章稍后关于 TDZ 的讨论）。但这两种声明形式附加到它们闭包的块，而不是像\
    \ `var` 和函数声明那样仅附加到闭包函数。更多信息请见第 6 章中的“块级作用域”。\n\n## 提升：声明 vs. 表达式\n\n函数提升仅适用于正式的函数声明（特别是那些出现在块之外的函数——第\
    \ 6 章中的“FIB”），而不适用于函数表达式赋值。\n\n```\ngreeting();\n// TypeError\n```\n\n```\nvar\
    \ greeting = function greeting() {\nconsole.log(\"Hello!\");\n};\n```\n\n第 1 行\
    \ (`greeting();`) 会抛出一个错误。但注意抛出的错误类型非常重要。`TypeError` 意味着我们尝试对一个不允许的值进行操作。取决于你的\
    \ JS 环境，错误信息可能会说“'undefined' is not a function”，或者更有帮助的“greeting' is not a function”。\n\
    \n注意错误不是 `ReferenceError`。JS 并不是在告诉我们它在作用域中找不到 `greeting`。它是在告诉我们找到了 `greeting`\
    \ 但它没有持有函数引用。只有函数可以被调用，尝试调用 `some-function` 值会导致错误。\n\n但如果不是函数引用，`greeting` 持有什么值？\n\
    \n除了提升之外，用 `var` 声明的变量在作用域开始时（再次是全局）也会被自动初始化为 `undefined`。一旦初始化，它们在整个作用域内就可以可以使用（赋值、检索等）。\n\
    \n所以第一行时，`greeting` 已经存在，但它只持有 `undefined` 值。直到第 4 行，`greeting` 才被赋值函数引用。\n\n\
