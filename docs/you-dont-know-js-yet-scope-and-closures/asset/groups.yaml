    \ into the deeper details of lexical scope, examining how and when variables can\
    \ be used.\n\n## Chapter 5: The (Not So) Secret Lifecycle of Variables\n\nBy now\
    \ you should have a decent grasp of the nesting of scopes, from the global scope\
    \ downward—called a program’s scope chain.\n\nBut just knowing which scope a variable\
    \ comes from is only part of the story. If a variable declaration appears past\
