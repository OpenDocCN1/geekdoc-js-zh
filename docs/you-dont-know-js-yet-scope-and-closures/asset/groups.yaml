    # 前言


    欢迎阅读广受好誉的《你不知道 JavaScript》（You Don’t Know JS，简称 YDKJS）系列的第二版：《你还不知道 JavaScript》（You
    Don’t Know JS Yet）。


    如果你读过第一版的任何一本书，可以预期在这些新书中看到一种全新的方法，其中包含了对过去五年 JS 变化的大量的更新内容。但我希望并相信，你将获得同样的承诺：即尊重
    JS 并深入挖掘其真正运行的原理。


    如果你是第一次读这些书，我很高兴你在这里。准备好开启进入 JavaScript 每一个角落的深度而广泛的旅程。


    如果你是编程或 JS 的初学者，请注意，这些书籍并非旨在作为温和的“JavaScript 入门教程”。这些材料有时是复杂且具有挑战性的，并且比普通初学者的水平要深得多。无论你的背景如何，我们都欢迎你，但这些书的编写假设你已经很熟悉
    JS，并且至少有 6 到 9 个月的经验。


    # 各部分


    这些书对待 JavaScript 的方式刻意地与《好的部分》（The Good Parts）对待该语言的方式相反。不，这并不意味着我们正在看那些*坏的部分*，而是要探索所有的部分。


    你可能被告诉过，或者自己也觉得，JS 是一个深有缺陷的语言，设计糟糕且实现不一致。许多人断言它是世界上最糟糕且最流行的语言；没有人写 JS 是因为他们想写，而是因为他们必须让它在
    Web 的中心占据地位。这是一个荒谬、不健康且完全傲慢的说法。


    每天都有数百万的开发者在编写 JavaScript，他们中的许多人都欣赏并尊重这种语言。


    就像任何伟大的语言一样，它既有卓越的部分，也有它的伤疤。即使是 JavaScript 的创始人 Brendan Eich 也对某些部分表示遗憾，认为它们是错误。但他是错的：它们根本不是错误。JS
    之所以有今天的局面——成为世界上无处不在且影响最大的编程语言——正是因为*所有那些部分*。


    不要相信那种谎言，即你应该只学习和使用一小部分*好的部分*，而避开所有坏东西。不要相信那种“X 是新一代 Y”的江湖骗术，即认为语言的某项新功能会瞬间让之前功能的所有用法变得过时且无知。当有人说你的代码不“现代”，因为它还没有使用几周前才提议的
    stage-0 特性时，别听他们胡说！


    JS 的每一个部分都是有用的。有些部分比其他部分更有用。有些部分要求你更加仔细和有主见。


    我发现，如果如果只使用该语言所提供的一小部分，就试图成为一个真正高效的 JavaScript 开发者，是荒谬的。你能想象一个工具箱里装满工具的工人，只用他的锤子，并嘲笑螺丝刀或卷尺是低劣的吗？那太蠢了。


    我不保留地主张，你应该去学习 JavaScript 的所有部分，并在适当的情况下使用它们！如果我可以冒昧建议：是时候抛弃任何告诉你相反观点的 JS 书了。


    # 标题


    那么，这个系列的标题是什么呢？


    所以，这个书的标题不是为了对你的现状提出挑战吗？


    我并不是试图对你对 JS 的知识或理解表示批评。我不是在暗示你无法或不会学习 JavaScript。我不是在炫耀只有极少数人才能拥有的内在智慧。


    严肃地说，这些都是大家在读这些书之前的真实反应。而且它们是毫无根据的。


    《你还不知道 JavaScript》这个标题的主要观点是，大多数 JS 开发者并没有花时间去理解他们的代码是如何工作的。他们知道它有效——即产生了预期的结果。但他们要么并不理解，或者更的是，他们的模型在仔细观察下站不住脚。


    我向读者你提出一个温和但严肃的挑战：放下你对 JS 的假设，用全新的眼光和被激发的好奇心面对它，并对你写的每一行代码去问为什么。它为什么会那样？为什么这种方法比你可能实现的其他六种方法更好或更合适？为什么那些“流行做法”说要在代码中用
    X，但事实证明 Y 可能是更好的？


    我在标题中加入“Yet（还）”这个词，不仅是因为它是第二版，而且因为我最终希望这些书能以一种充满希望而非沮丧的方式挑战你。


    但让我明确一点：我不认为可以完全掌握 JS。那不是一个可以获得的成就，而是一个应该努力的目标。我鼓励你在 JavaScript（实际上是整个软件开发）中培养这样一种心态：你永远无法完全掌握它，但随着你与语言相处的时间，你可以学到更多。你永远比现在更了解
    JS。这正是我希望 YDKJSY 代表的。


    # 任务


    现在并不需要为开发者应该认真对待 JS 辩护——我认为它已经证明了自己作为世界顶级语言的地位。但一个不同的、更重要的论点仍然需要建立，而这些书恰恰肩胜使命。


    我教过来自全球六大洲、25 多个国家团队和公司的 5,000 多名开发者。我所看到的是，很多时候，通常只看重程序的结果，而不是程序是如何编写的，它是如何/为什么运行的。我不光作为开发者，而且教学许多其他开发者的经验告诉我：如果你能完全理解你的代码是如何工作的，你的开发工作将始终比仅仅让它产生预期结果要高效得多。换句话之，“够用”是不够的，也不应该是够的。


    # 路径


    你们有些人开始读这本书是以连续读完所有六本书为目标的。我想提告你考虑改变这个计划。我的意图并不是让你通读 YDKJSY。这些书的内容是非常密集的，因为 JavaScript
