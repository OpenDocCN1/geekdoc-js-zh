    \  // don't do this!\n})();\n```\n\n```javascript\n(function doThisInstead() {\n\
    \  // ..\n})();\n```\n\n我们如何为 IIFE 命名？识别该 IIFE 的用途。你为什么在该位置需要一个作用域？你是在为学生记录隐藏一个缓存变量吗？\n\
