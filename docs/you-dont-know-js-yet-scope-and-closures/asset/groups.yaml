    \ 的作用域是一个函数而非整个环境作用域，但它充当了某种“应用范围作用域”，一个存储所有顶层标识符的桶，尽管它们不在真正的全局作用域中。在这方面，它有点像是全局作用域的替代品。\n\
    \n最后是第三种方式：无论应用程序是否使用了打包工具，还是将（非 ES 模块）文件直接单独加载到浏览器中（通过 `<script>` 标签或其他动态 JS\
    \ 资源加载），如果没有单一的包围作用域包含所有这些部分，那么**全局作用域**就是它们相互协作的唯一方式：这种作用域的打包文件通常看起来如下：\n\n```javascript\n\
    var moduleOne = (function one(){\n  //..\n})();\nvar moduleTwo = (function two(){\n\
    \  //..\n  function callModuleOne() {\n    moduleOne.someMethod();\n  }\n  //..\n\
    })();\n```\n\n## 第 4 章：关于全局作用域\n\n在这里，由于没有包围的函数作用域，这些 `moduleOne` 和 `moduleTwo`\
    \ 的声明直接被丢到了全局作用域中。这实际上等同于文件没有合并而是被单独加载：\n\nmodule1.js:\n\n```javascript\nvar moduleOne\
    \ = (function one(){\n  //..\n})()\n```\n\nmodule2.js:\n\n```javascript\nvar moduleTwo\
    \ = (function two(){\n  //..\n  function callModuleOne() {\n    moduleOne.someMethod();\n\
    \  }\n  //..\n})();\n```\n\n如果这些文件在浏览器环境中作为普通的独立 JS 文件单独加载，则每个顶层变量声明最终都会成为全局变量，因为全局作用域是这两个独立文件之间唯一的共享资源——从\
    \ JS 引擎的角度来看，它们是独立的程序。\n\n除了（可能）考虑到应用程序代码在运行时的位置，以及每个部分如何访问其他部分进行协作外，全局作用域还是以下内容的所在地：\n\
    \n- JS 暴露其内置内容：\n  - 原始类型：undefined, null, Infinity, NaN\n  - 原生对象：Date(), Object(),\
    \ String(), 等\n  - 全局函数：eval(), parseInt(), 等\n  - 命名空间：Math, Atomics, JSON\n\
    \  - JS 的“伙伴”：Intl, WebAssembly\n- 托管 JS 引擎的环境暴露其自身的内置内容：\n  - console（及其方法）\n\
    \  - DOM（window, document..），等\n  - 定时器（setTimeout(..), 等）\n  - Web 平台 API：navigator,\
    \ history, geolocation, WebRTC, 等。\n\n这些都是你的程序将交互的许多全局变量之一。\n\n> 注意\n> Node 也会“全局地”暴露几个元素，但从技术上讲，它们不在全局作用域中：`require()`,\
    \ `__dirname`, `module` 等。\n\n大多数开发者都认为，全局作用域不应该只是应用程序中每个变量的垃圾场。那将是一堆即将发生的 Bug\
    \ 来源。但不可否认，全局作用域对于几乎每个 JS 应用程序来说都是重要的“胶水”。\n\n## 全局作用域到底在哪里？\n\n看起来显而易见，全局作用域位于文件的最外层部分；即不在任何函数或其他块内部。但情况并没有那么简单。\n\
    \n不同的 JS 环境处理你的程序作用域（尤其是全局作用域）的方式是不同的。JS 开发者在没有察觉的情况下产生误解是非常常见的。\n\n## 浏览器的“Window”（窗口）\n\
    \n关于全局作用域的处理，JS 能够处于的最“纯净”环境是作为在浏览器网页环境中加载的独立 .js 文件。我指的“纯净”不是没有自动添加任何内容（可能会添加很多！），而是指对代码的入侵或对预期行为的干扰最小。\n\
    \n考虑这个 .js 文件：\n\n```javascript\nvar studentName = \"Kyle\";\n\nfunction hello()\
