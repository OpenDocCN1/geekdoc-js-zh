    reassigning 'id' to 5\");\n  id = 5;\n\n  console.log(`local variable 'id': ${id}\\\
    `);\n  console.log(\n    `parameter 'id' (closure): ${defaultID}()`\n  );\n}\n\
    ```\n\nwhatsTheDealHere(3);\n// local variable 'id': 3 <--- Huh!? Weird!\n// parameter\
