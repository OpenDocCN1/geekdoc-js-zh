    \ 文档：https://nodejs.org/api/esm.html\n\n## 退出范围\n\n无论你使用经典模块格式（浏览器或 Node）、CommonJS\
    \ 格式（Node）还是 ESM 格式（浏览器或 Node），模块都是结构化和组织程序功能及数据的有效方式之一。\n\n模块模式是我们利用词法作用域规则将变量和函数放在正确位置之旅的总结。我们遵循始终采取的防御性*私有*优先立场，避免过度暴露，并仅与必要的公共\
