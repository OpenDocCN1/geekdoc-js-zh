- md: "\n## Chapter 7: Using Closures\n\nback. This invocation will happen from the\
    \ internals of the ajax(..) utility, wherever that comes from. Furthermore, when\
    \ that happens, the lookupStudentRecord(..) call will long since have been completed.\n\
    \nWhy then studentID still around and accessible to the callback? Closure.\n\n\
    Event handlers are another common usage of closure:\n\n```javascript\nfunction\
    \ listenForClicks(btn,label) {\n  btn.addEventListener(\"click\",function onClick()\
    \ {\n    console.log(\n      `${label} button was clicked!`\n  });\n}\n```\n\n\
    ```javascript\nvar submitBtn = document.getElementById(\"submit-btn\");\n```\n\
    \n```javascript\nlistenForClicks(submitBtn, \"Checkout\");\n```\n\nThe label parameter\
    \ is closed over the onClick(..) event handler callback. When the button is clicked,\
    \ label still exists to be used. This is closure.\n\n## What If I Can't See It?\n\
    \nYou've probably heard this common adage:\n\n> If a tree falls in the forest\
    \ but nobody is around to hear it, does it make a sound?\n\nIt's a silly bit of\
    \ philosophical gymnastics. Of course from a scientific perspective, sound waves\
    \ are created. But the real point: does it matter if the sound happens?\n\n##\
    \ Chapter 7: Using Closures\n\nRemember, the emphasis in our definition of closure\
    \ is observability. If a closure exists (in a technical, implementation, or academic\
    \ sense) but it cannot be observed in our programs, does it matter? No.\n\nTo\
    \ reinforce this point, let's look at some examples that are not observably based\
    \ on closure.\n\nFor example, invoking a function that makes use of lexical scope\
    \ lookup:\n\n```javascript\nfunction say(myName) {\n  var greeting = \"Hello\"\
    ;\n  output();\n\n  function output() {\n    console.log(\n      `${greeting},\
    \ ${myName}!`\n    );\n  }\n}\n\nsay(\"Kyle\");\n// Hello, Kyle!\n```\n\nThe inner\
    \ function output() accesses the variables greeting and myName from its enclosing\
    \ scope. But the invocation of output() happens in that same scope, where of course\
    \ greeting and myName are still available; that’s lexical scope, not closure.\n\
    \nAny locally scoped language whose functions didn’t support closure would still\
    \ behave this way.\n\nIn fact, global scope variables essentially cannot be (observably)\
    \ closed over, because they’re always accessible from everywhere. No function\
    \ can ever be invoked in any part of the scope chain that is not a descendant\
    \ of the global scope.\n\nConsider:\n\n```javascript\nvar students = [\n    {\
    \ id: 14, name: \"Kyle\" },\n    { id: 73, name: \"Suzy\" },\n    { id: 112, name:\
    \ \"Frank\" },\n    { id: 6, name: \"Sarah\" }\n];\n\nfunction getStudent() {\n\
    \    return function firstStudent(){\n        return students[0].name;\n    }\n\
    }\n\nvar student = getStudent();\n\nstudent();\n// Kyle\n```\n\nThe inner function\
    \ firstStudent() does reference students, which is a variable outside its scope.\
    \ But since students happen to be from the global scope, no matter where function\
    \ is invoked, its ability to access students is nothing more than lexical scope.\n\
    \nAll function invocations can access global variables, regardless of whether\
    \ closure is supported by the language or not. Global variables don't need to\
    \ be closed over.\n\nVariables that are merely present but never accessed don’t\
    \ result in closure:\n\n```javascript\nfunction lookupStudent(studentID) {\n \
    \ return function nobody(){\n    var msg = \"Nobody's here.\";\n    console.log(msg);\n\
    \  }\n}\n\nvar student = lookupStudent(1);\n\nstudent();\n// Nobody's here.\n\
    ```\n\nThe inner function nobody() doesn't close over any outer variables—it only\
    \ uses its own variable. Even though studentID is present in the enclosing scope,\
    \ studentID is not referred to by nobody(). The JS engine doesn't need to keep\
    \ studentID around; lookupStudent(...) has finished, so GC wants to clean up that\
    \ memory!\n\nWhether functions support closure or not, this program would behave\
    \ the same. Therefore, no closure here.\n\nIf there's no function invocation,\
    \ closure can’t be observed:\n\n```javascript\nfunction greet(studentName) {\n\
    \  return function(){\n    console.log(\n      `Hello, ${studentName}!`\n    );\n\
    \  }\n}\n\ngreet(\"Kyle\");\n// nothing happens\n```\n\nThis one’s tricky because\
    \ the outer function definitely gets invoked. But the inner function is the one\
    \ that could have closure, and yet it’s never invoked; the returned function here\
    \ is just thrown away. So even if technically the JS engine created closure for\
    \ a brief moment, it was not observed in any meaningful way. A tree may have fallen...\
    \ but we didn't hear it, so we don't care.\n\n## Observable Definition\n\nWe’re\
    \ now ready to define closure:\n\n> Closure is observed when a function uses variable(s)\
    \ from an outer scope while running in a scope where those variable(s) are accessible.\n\
    \nThe key parts of this definition are:\n\n- Must be a function\n- Must reference\
    \ at least one variable from an outer scope\n- Must be invoked in a different\
    \ branch of the scope chain from the variable(s)\n\nThis observation-oriented\
    \ definition means we shouldn’t dismiss closure as some academic trivia. Instead,\
    \ we should look for the direct, concrete effects closure has on program behavior.\n\
    \n## The Closure Lifecycle and Garbage Collection (GC)\n\nSince closure is inherently\
    \ tied to a function instance, its closure over a variable lasts as long as there\
    \ is a reference to that function.\n\nIf ten functions all close over the same\
    \ variable, and over time nine of these function references are discarded, the\
    \ lone remaining function still preserves that. Once that final function reference\
    \ is discarded, the last closure over that variable is gone, and the variable\
    \ itself is GC'd.\n\nThis has an important impact on building efficient and performant\
    \ programs. Closure can unexpectedly prevent the GC of a variable that you're\
    \ done with, which leads to run-away memory usage over time. That's why it's important\
    \ to discard function references (and thus their closures) when they're not needed\
    \ anymore.\n\nConsider:\n\n```javascript\nfunction manageBtnEvents(btn) {\n  var\
    \ clickHandlers = [];\n\n  return function listener(cb){\n    if (cb) {\n    \
    \  let clickHandler =\n      function onClick(evt) {\n        console.log(\"clicked!\"\
    );\n        cb(evt);\n      }\n      clickHandlers.push(clickHandler);\n     \
    \ btn.addEventListener(\n        \"click\",\n        clickHandler\n      );\n\
    \    } else {\n      // passing no callback unsubscribes\n      // all click handlers\n\
    \      for (let handler of clickHandlers) {\n        btn.removeEventListener(\n\
    \          \"click\",\n          handler\n        );\n      }\n      clickHandlers\
    \ = [];\n    }\n  }\n}\n```\n\n```javascript\nvar mySubmitBtn = document.getElementById(\"\
    submit-btn\");\nvar onSubmit = manageBtnClickEvents(mySubmitBtn);\n\nonSubmit(function\
    \ checkout(evt) {\n  // handle checkout\n});\n\nonSubmit(function trackAction(evt)\
    \ {\n  // log action to analytics\n});\n\n// later, unsubscribe all handlers:\n\
    onSubmit();\n```\n\nIn this program, the inner onClick(...) function holds a closure\
    \ over the passed in cb (the provided event callback). That means the checkout()\
    \ and trackAction() function expression references are held via closure (and cannot\
    \ be GC'd) for as long as these event handlers are subscribed.\n\nWhen we call\
    \ onSubmit() with no input on the last line, all event handlers are unsubscribed,\
    \ and the handlers array is emptied. Once all click handler function references\
    \ are discarded, the closures of cb references to checkout() and trackAction()\
    \ are discarded.\n\nWhen considering the overall health and efficiency of the\
    \ program, unsubscribing an event handler when it's no longer needed can be even\
    \ more important than the initial subscription!\n\n## Per Variable or Per Scope?\n\
    \nAnother question we need to tackle: should we think of closure as applied only\
    \ to the referenced outer variable(s), or does closure preserve the entire scope\
    \ chain with all its variables?\n\nIn other words, in the previous event subscription\
    \ snippet, is the inner onClick(...) function closed over only cb, or is it also\
    \ closed over clickHandler, clickHandlers, and btn?\n\nConceptually, closure is\
    \ per variable rather than per scope. Ajax callbacks, event handlers, and all\
    \ other forms of function closures are typically assumed to close over only what\
    \ they explicitly reference.\n\nBut the reality is more complicated than that.\n"
  mdcn: "\n\n## 第7 章：使用闭包\n\n返回。此调用将发生在 `ajax(..)` 实用函数的内部，无论它来自何处。此外，当这种情况发生时，`lookupStudentRecord(..)`\
    \ 的调用早已早已完成。\n\n那么，为什么 `studentID` 仍然存在并可以被回调函数访问？这就是闭包（Closure）。\n\n事件处理器是闭包的另一个常见用法：\n\
    \n```javascript\nfunction listenForClicks(btn,label) {\n  btn.addEventListener(\"\
    click\",function onClick() {\n    console.log(\n      `${label} button was clicked!`\n\
