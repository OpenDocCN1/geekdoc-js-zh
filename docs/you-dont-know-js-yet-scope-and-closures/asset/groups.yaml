    Student now references the public API of our example module.


    CommonJS modules behave as singleton instances, similar to the IIFE module definition
    style presented before. No matter how many times you require(..) the same module,
    you just get additional references to the single shared module instance.


    require(...) is an all-or-nothing mechanism; it includes a reference of the entire
