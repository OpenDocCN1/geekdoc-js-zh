    # 前言


    如果我观察我书架上的书，我可以清楚地看到哪些是深受喜爱的。这种喜爱的意思是它们被磨损了。装订坏了，书页破了，甚至可能有洒了饮料的痕迹。


    《作用域与闭包》（第一版）是我最喜爱的书之一。它很小，但装订已经散开了。书页磨损且折角。它变得皱巴巴。这不是一本我只读过一遍的书。自从出版以来，我反复拿起它。对我来说，它也是我个人
    JavaScript 进步的里程碑。当我2014 年第一次阅读它时，我熟悉这些概念，但理解的深度确实不如这本薄书深。


    多年来，尽管我并不是每天都能感觉到自己的进步，但每一个概念都变得更加容易理解。我会会心，意识到在这些指南的帮助下我走了多远。


    当 Kyle 邀请我写前言时，我非常震惊。很少有机会能为一本对我自己的理解和职业产生了如此影响的书写前言，尤其是《作用域与闭包》。我记得


