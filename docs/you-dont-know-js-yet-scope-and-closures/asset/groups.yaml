    \ This is still using a function to create the scope for hiding cache, and in\
    \ this case, the function is still named hideCache, so how does that solve anything?\n\
    \nRecall from “Function Name Scope” (in Chapter 3), what happens to the name identifier\
    \ from a function expression. Since hideCache(..) is defined as a function expression\
    \ instead of a function declaration, its name is in its own scope—essentially\
    \ the same scope as cache—rather than in the outer/global scope.\n\nThat means\
    \ we can name every single occurrence of such a function expression the exact\
    \ same name, and never have any collision. More appropriately, we can name each\
    \ occurrence semantically based on whatever we’re trying to hide, and not worry\
    \ that whatever name we choose is going to collide with any other function expression\
    \ scope in the program.\n\nIn fact, we *could* just leave off the name entirely—thus\
    \ defining an “anonymous function expression” instead. But Appendix A will discuss\
    \ the importance of names for such scope-only functions.\n\n# Invoking Function\
    \ Expressions Immediately\n\nThere’s another important bit in the previous factorial\
    \ recursive program that’s easy to miss: the line at the end of the function expression\
    \ that contains } ) ().\n\nNotice that we surrounded the entire function expression\
    \ in a set of ( .. ), and then on the end, we added second ( ) parentheses set;\
    \ that’s actually calling the function expression we just defined. Moreover, in\
    \ this case, the first set of surrounding ( .. ) around the function expression\
    \ is not strictly necessary (more on that in a moment), but we used them for readability\
    \ sake anyway.\n\nSo, in other words, we’re defining a function expression that’s\
    \ then immediately invoked. This common pattern has a (very creative!) name: Immediately\
    \ Invoked Function Expression (IIFE).\n\nAn IIFE is useful when we want to create\
    \ a scope to hide variables/functions. Since it’s an expression, it can be used\
    \ in **any** place in a JS program where an expression is allowed. An IIFE can\
    \ be named, as with `hideTheCache()`, or (more commonly!) unnamed/anonymous. And\
    \ it can be standalone or, before, part of another statement—`hideTheCache()`\
    \ returns the `factorial()` function reference which is then assigned to the variable\
    \ `factorial`.\n\nFor comparison, here's an example of a standalone IIFE:\n\n\
    ```javascript\n// outer scope\n\n(function(){\n  // inner scope\n})();\n\n// more\
    \ outer scope\n```\n\nUnlike with hideTheCache(), where the surrounding (..) were\
    \ noted as being an optional stylistic choice, for a standalone IIFE they're **required**;\
    \ they distinguish the function as an expression, not a statement. For consistency,\
    \ however, always surround an IIFE function with (..).\n\n# Note\n\n> Technically,\
    \ the surrounding (..) aren't the only syntactic way to ensure the function in\
    \ an IIFE is treated by the JS parser as a function expression. We'll look at\
    \ some other options in Appendix A.\n\n# Function Boundaries\n\nBeware that using\
    \ an IIFE to define a scope can have some unintended consequences, depending on\
    \ the code around it. Because an IIFE is a full function, the function boundary\
    \ alters the behavior of certain statements/constructs.\n\nFor example, a return\
    \ statement in some piece of code would change its meaning if an IIFE is wrapped\
    \ around it, because now the return would refer to the IIFE’s function. Non-arrow\
    \ function IIFEs also change the binding of a keyword—more on that in the Objects\
