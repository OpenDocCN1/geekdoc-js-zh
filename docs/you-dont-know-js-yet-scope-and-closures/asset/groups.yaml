    \ greeting from line 1 (to retrieve and execute a function reference), even though\
    \ the greeting() function declaration doesn't occur until line 4?\n\nRecall Chapter\
    \ 1 points out that all identifiers are registered to their respective scopes\
    \ during compile time. Moreover, every identifier is created at the beginning\
    \ of the scope, it belongs to, every time that scope is entered.\n\nThe term most\
