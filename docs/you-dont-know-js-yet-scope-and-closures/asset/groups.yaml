    \ the moment the scope starts running? The answer is a characteristic of formal\
    \ function declarations, called function hoisting. When a function declaration's\
    \ name identifier is registered at the top of its scope, it's additionally auto-initialized\
    \ to that function’s reference. That’s why the function can be called throughout\
    \ the entire scope!\n\nOne key detail is that both function hoisting and var-flavored\
    \ variable hoisting attach their name identifiers to the nearest enclosing function\
    \ scope (or, if none, the global scope), not a block scope.\n\n## Note\n\nDeclarations\
