    # const-antly Confused


    const on the other hand, I don’t use often. I’m not going

    dig into all the reasons why, but it comes down to const

    not carrying its own weight. That is, while there’s a tiny bit

    of benefit of const in some cases, that benefit is outweighed

    by the long history of troubles around const confusion in a

    variety of languages, long before it ever showed up in JS.


    const pretends to create values that can’t be mutated—a

    misconception that’s extremely common in developer com-

    unities across many languages—whereas what it really does

    is prevent re-assignment.


    ```

    const studentIDs = [ 14, 73, 112 ];


    // later


    studentIDs.push(6); // whoa, wait... what?!

    ```


    Using a const with a mutable value (like an array or object)

    is asking for a future developer (or reader of code) to code fall

    into the trap you set, which was that they either didn’t know,'
  - '[PAGE 226]


    # Appendix A: Exploring Further


    or sorta forgot, that value immutability isn’t at all the same thing as assignment
    immutability.


    I just don’t think we should set those traps. The only time I ever use const is
    when I’m assigning an already-immutable value (like 42 or "Hello, friends!"),
    and when it’s clearly a “constant” in the sense of being a named placeholder for
    a literal value, for semantic purposes. That’s what const is best used for. That’s
    pretty rare in my code, though.


    If variable re-assignment were a big deal, then const would be more useful. But
    variable re-assignment isn’t that big of a deal in terms of causing bugs. There’s
    a long list of things that leads to bugs in programs, but “accidental re-assignment”
    is way, way down that.


    Combine that with the fact that const (and let) are supposed to be used in blocks,
    and blocks are supposed to be short, and you have a really small area of your
    code where a const declaration is even applicable. A const on line 1 of your line
    block only tells you something about the next nine lines. And the thing it tells
    you is already obvious by glancing down at those nine lines: the variable is never
    on the left-hand side of an; it’s not re-assigned.


    That’s it, that’s all const really does. Other than that, it’s not very useful.
    Stacked up against the significant confusion of value vs. assignment immutability,
    const loses a lot of its luster.


    A let (or var!) that’s never re-assigned is already behavior a “constant”, even
    though it doesn’t have the compiler guarantee. That’s good enough in most cases.'
  - '[PAGE 227]


    # var and let


    In my mind, const is pretty rarely useful, so this is only two-horse race between
    let and var. It’s not really a race either, because there doesn''t have to be
    just one winner. They can both win... different races.


    The fact is, you should be using both var and let in your programs. They are not
    interchangeable: you shouldn''t use var where a let is called for, but you also
    shouldn''t use let where a var is most appropriate.


    So where could we still use var? Under what circumstances is it a better choice
    than let?


    For one, I always use var in the top-level scope of any function, regardless of
    whether that''s at the beginning, middle, or end of the function. I also use var
    in the global scope, though I try to minimize usage of the global scope.


    Why use var for function scoping? Because that''s exactly what var does. There
    literally is no better tool for the job of function scoping than a declaration
    than a declarator that has, for 25 years, done exactly that.


    You use let in this top-level scope, but it''s not the best tool for that job.
    I also find that if you use let everywhere, then it''s less obvious which declarations
    are designed to be localized and which ones are intended to be used throughout
    the function.


    By contrast, I rarely use a var inside a block. What''s the best tool for the
    job. If you see a let, it tells you that you''re dealing with a localized declaration.
    If you see var, it tells you that you''re dealing with a function-wide declaration.
    Simple as that.'
