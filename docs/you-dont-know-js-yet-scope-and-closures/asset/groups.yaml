    # Per Variable or Per Scope?


    Another question we need to tackle: should we think of closure as applied only
    to the referenced outer variable(s), or does closure preserve the entire scope
    chain with all its variables?


    In other words, in the previous event subscription snippet, is the inner onClick(...)
    function closed over only cb, or is it also closed over clickHandler, clickHandlers,
    and btn?


    Conceptually, closure is per variable rather than per scope. Ajax callbacks, event
    handlers, and all other forms of function closures are typically assumed to close
    over only what they explicitly reference.


    But the reality is more complicated than that.


