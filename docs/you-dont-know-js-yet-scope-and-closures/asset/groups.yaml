    ## 第 1 章：什么是作用域？


    当你写完前几个程序时，你可能已经对创建变量和在其中存储值感到有些熟悉了。处理变量是我们在编程中所做的最基础的事情之一！


    但你可能没有仔细考虑过引擎用于组织和管理这些变量的底层机制。我指的不是内如何在计算机上分配的，而是：JS 如何知道任何给定语句可以访问哪些变量，以及它是如何处理两个同名的变量的？


    这些问题的答案是被称为“作用域”（scope）的定义良好的规则。本书将深入挖掘作用域的所有方面——它是如何工作的、它有什么用、需要避免的陷阱——然后指向引导程序结构的常见作用域模式。


    我们的第一步是揭示 JS 引擎在程序运行**之前**是如何处理我们的程序的。


    ## 关于本书


    欢迎阅读《你你还不懂 JS》系列的第 2 本书！如果你已经完成了《入门》（第一本书），你来对地方了！如果没有，在继续之前，我鼓励你去那里以获得最好的基础。


    我们的关注点将是 JS 语言三大支柱之首：作用域系统及其函数闭包，以及模块设计模式的力量。


    JS 通常被归类为解释型脚本语言，因此大多数人假设 JS 程序是以单次的、自上而下的方式处理的。但 JS 实际上在执行开始之前，在一个独立的阶段被解析/编译的。代码作者关于变量、函数和块之间相互放置位置的决定，在初始解析/编译阶段会根据作用域规则进行分析。生成的作用域结构通常不受运行时条件的影响。


    JS 函数本身是一等值；它们可以像数字或字符串一样被赋值和传递。由于这些函数持有并访问变量，无论函数最终在程序的任何位置执行，它们都会保持其原始的作用域。这被称为闭包（closure）。


    模块是一种代码组织模式，其特征是具有公共方法，这些方法通过闭包对模块内部作用域中的隐藏变量和函数具有特权访问权限。


    ### 编译 vs 解释


    你以前可能听过代码编译，但也许它看起来像一个神秘的黑盒，源代码从一端滑入，可执行程序从另一端弹出。


    尽管如此，它并不神秘或魔法。代码编译是一系列处理你的代码文本的步骤，并将其转换为计算机可以理解的指令列表。通常，整个源代码会一次性转换，这些生成的指令被保存为输出（通常在文件中），稍后可以执行。


    你可能还听过代码是可以被解释的，那么它与编译有什么区别呢？


    解释执行着与编译类似的任务，即它将你的程序转换为机器可以理解的指令。与一次性编译程序不同，解释是逐行转换源代码的；每一行或语句在立即处理下一行源代码之前都会执行。


    ### 编译：


    ![](img/14a2f9063d3ac52e6a98517a7d87857f_20_0)


    ### 解释：


    ![](img/14a2f9063d3ac52e6a98517a7d87857f_20_1)


    图 1：编译 vs 解释。图 1 说明了编译与解释的区别。


    这两个模型是互斥的吗？通常情况下，是的。然而，问题更为微妙，因为解释实际上可以采取比逐行以外的形式。现代 JS 引擎实际上采用了编译和解释的多种变体。


    记得我们在《入门》的第 1 章中调查过这个话题。我们的结论是 JS 最准确地被描述为一种编译语言。为了方便读者，接下来的章节将回顾并扩展这一断言。


    ### 编译代码


    首先，JS 是否被编译有什么意义？


    作用域主要是在编译期间确定的，因此理解编译和执行之间的关系是掌握作用域的关键。


    在经典编译器理论中，程序由编译器分三个基本阶段处理：


    - 分词/词法分析：将字符字符串拆分为对该语言有意义的块，称为令牌（tokens）。例如，考虑程序 `var a = 2;`。该程序将被分解为以下令牌：`var`、`a`、`=`、`2`
    和 `;`。空白空间可能或不会持久化为令牌，取决于（分词和词法分析的区别细微且学术，但其核心在于这些令牌是以无状态还是有状态的方式识别的。简单来说，如果分词器调用有状态的解析规则来确定……）

    - 解析：将令牌流（数组）转换为嵌套元素的树，这些元素共同代表程序的语法结构。这被称为抽象语法树（AST）。例如，`var a = 2;` 的树可能从顶层节点
    VariableDeclaration 开始，带有一个子节点 Identifier（其值为 a），以及另一个子节点 AssignmentExpression，后者又有一个子节点
    NumericLiteral（其值为 2）。

    - 代码生成：获取 AST 并将其转换为可执行代码。这部分根据语言、平台目标以及其他因素而大不同。JS 引擎将上述的 var a = 2; 的 AST 转换为一组机器指令，以实际创建一个名为
    a 的变量（包括保留内存等），然后将值存入 a。


