  - '[PAGE 166]


    This one’s tricky, because the outer function definitely does get invoked. But
    the inner function is the one that could have had closure, and yet it’s never
    invoked; the returned function here is just thrown away. So even if technically
    the JS engine created closure for a brief moment, it was not observed in any meaningful
    way in this program.


    A tree may have fallen... but we didn''t hear it, so we don''t care.


    # Observable Definition


    We’re now ready to define closure:


    > Closure is observed when a function uses variable(s) from outer scope(s) even
    while running in a scope where those variable(s) wouldn’t be accessible.


    The key parts of this definition are:


    +   * Must be a function involved

    * Must reference at least one variable from an outer scope

    * Must be invoked in a different branch of the scope chain from the variable(s)


    This observation-oriented definition means we shouldn’t dismiss closure as some
    indirect, academic trivia. Instead, we should look and plan for the direct, concrete
    effects closure has on our program behavior.'
  - "[PAGE 167]\n\n# The Closure Lifecycle and Garbage Collection (GC)\n\nSince closure\
    \ is inherently tied to a function instance, its closure over a variable lasts\
    \ as long as there is still a reference to that function.\n\nIf ten functions\
    \ all close over the same variable, and over time nine of these function references\
    \ are discarded, the lone remaining function reference still preserves that. Once\
    \ that final function reference is discarded, the last closure over that variable\
    \ is gone, and the variable itself is GC'd.\n\nThis has an important impact on\
    \ building efficient and performant programs. Closure can unexpectedly prevent\
    \ the GC of a variable that you're otherwise done with, which leads to run-away\
    \ memory usage over time. That's why it's important to discard function references\
    \ (and thus their closures) when they're not needed anymore.\n\nConsider:\n\n\
