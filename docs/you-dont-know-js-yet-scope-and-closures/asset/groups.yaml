    }\n```\n\n这是一个非常常见用例的一种微小但令人惊喜的语法简化，而且可能通过移除不必要的作用域来稍微提高性能！\n\n## 块中的函数声明 (FiB)\n\
    \n我们现在已经看到使用 `let` 或 `const` 的声明是块作用域的。那么直接出现在块内部的函数声明呢？作为一项特性，这被称为“FiB”。\n\n\
    我们通常认为函数声明等同于 `var` 声明。那么它们也像 `var` 一样是函数作用域的吗？\n\n不是，又是。我知道……这很令人困惑。让我们深入研究：\n\
    \n```javascript\nif (false) {\n  function ask() {\n    console.log(\"Does this\
    \ run?\");\n  }\n}\nask();\n```\n\n你预期此程序执行什么？三个合理的结果：\n\n- 1. `ask()` 调用可能会因\
    \ `ReferenceError` 异常而失败，因为 `ask` 标识符的作用域限制在该块，因此在外部/全局作用域中不可用。\n- 2. `ask()`\
    \ 调用可能会因 `TypeError` 异常而失败，因为 `ask` 标识符存在但它是 `undefined`（因为 `if` 语句没有执行），因此不是一个可调函数。\n\
    - 3. `ask()` 调用可能会正确运行，打印出“Does it run?”消息。\n\n这里令人困惑的部分在于：取决于你在哪个 JS 环境中运行这段代码片段，可能会得到不同的结果！这是少数几个疯狂区域之一，现有遗留行为背离了预测结果。\n\
    \nJS 规范规定块内部的函数声明是块作用域的，所以答案应该是 (1)。然而，大多数基于浏览器的 JS 引擎（包括来自 Chrome 但也用于 Node 的\
    \ v8）的行为表现为 (2)，这意味着标识符的作用域在 `if` 块之外，但函数值没有被自动初始化，因此它保持为 `undefined`。\n\n## 第\
    \ 6 章：限制作用域引擎\n\n为什么浏览器 JS 引擎允许产生违背规范的行为呢？因为这些引擎在 ES6 引入块作用域之前，对 FiB 已经有了某些行为，并且担心更改以遵循规范可能会破坏现有的网站\
    \ JS 代码。因此，JS 规范的附录 B 中做了一个例外，允许浏览器 JS 引擎出现某些偏差（仅限浏览器！）。\n\n![](img/14a2f9063d3ac52e6a98517a7d87857f_143_0.png)\n\
    \n### 注意\n\n你不会将 Node 分类为浏览器 JS 引擎。就我而言，避免 FiB 变幻莫测的唯一实际答案就是避免 FiB。\n\n"
