  md: "# Implied Scopes\n\nScopes are sometimes created in non-obvious places. In\
    \ practice, these implied scopes don’t often impact your program behavior, but\
    \ it’s still useful to know they’re happening. Keep an eye out for the following\
    \ surprising scopes:\n\n+   - Parameter scope\n- Function name scope\n\n# Parameter\
    \ Scope\n\nThe conversation metaphor in Chapter 2 implies that function parameters\
    \ are basically the same as locally declared variables in the function scope.\
    \ But that’s not always true.\n\nConsider:\n\n```\n// outer/global scope: RED(1)\n\
    \nfunction getStudentName(studentID) {\n  // function scope: BLUE(2)\n\n  // ..\n\
    }\n```\n\nHere, studentID is considered a “simple” parameter, so it behaves as\
    \ a member of the BLUE(2) function scope. But if we change it to be a non-simple\
    \ parameter, that’s no longer technically the case. Parameter forms considered\
    \ non-simple include parameters with default values, rest parameters (using…),\
    \ and destructured parameters.\n\nConsider:\n\nYou Don’t Know JS Yet: Scope &\
    \ Closures"
  merge: -1
