    Even though export appears before the function keyword here, this form is still
    a function declaration that also happens to be exported. That is, the getName
    identifier is function hoisted (see Chapter 5), so it’s available throughout the
    whole scope of the module.


    Another allowed variation:


    ```

    export default function getName(studentID) {

