- img_proc: true
  md: 'Chapter 1: What''s the Scope?


    Are these two processing models mutually exclusive? Generally, yes. However, the
    issue is more nuanced, because interpretation can actually take other forms than
    just operating line by line on source code text. Modern JS engines actually employ
    numerous variations of both compilation and interpretation in the handling of
    JS programs.


    Recall that we surveyed this topic in Chapter 1 of the Get Started book. Our conclusion
    is that JS is most accurately portrayed as a **compiled language**. For the benefit
    of readers here, the following sections will revisit and expand on that assertion.


    # Compiling Code


    But first, why does it even matter whether JS is compiled or not?


    Scope is primarily determined during compilation, so understanding how compilation
    and execution relate is key in mastering scope.


    In classic compiler theory, a program is processed by a compiler in three basic
    stages:


    +   **Tokenizing/Lexing:** breaking a string of characters into meaningful (to
    the language) chunks, called tokens. For instance, consider the program: `var
    a = 2;`. This program would likely be broken up into the following tokens: `var`,
    `a`, `=`, `2`, and `;`. Whitespace may or not be persisted as a token, depending
    on whether it''s meaningful or not.


    +   (The difference between tokenizing and lexing is subtle and academic, but
    it centers on or not these'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'tokens are identified in a stateless or stateful way. Put simply, if the tokenizer
    were to invoke stateful parsing rules to figure out whether a should be considered
    a distinct token or just part of another token, that would be lexing.)


    +   2. **Parsing:** taking a stream (array) of tokens and turning it into a tree
    of nested elements, which collectively represent the grammatical structure of
    the program. This is called an Abstract Syntax Tree (AST).


    For example, the tree for var a = 2; might start with a top-level node called
    VariableDeclaration, with a child node called Identifier (whose value is a), and
    another child called AssignmentExpression which itself has a child called NumericLiteral
    (whose value is 2).


    +   3. **Code Generation:** taking an AST and turning it into executable code.
    This part varies greatly depending on the language, the platform''s targeting,
