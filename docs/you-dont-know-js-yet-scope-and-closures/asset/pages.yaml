  md: "# Chapter 5: The (Not So) Secret Lifecycle of Variables\n\nto that initialization\
    \ occuring. The same goes for const as it does for let.\n\nThe term coined by\
    \ TC39 to refer to this *period of time* from the entering of a scope to where\
    \ the auto-initialization of the variable occurs is: Temporal Dead Zone (TDZ).\n\
    \nThe TDZ is the time window where a variable exists but is still uninitialized,\
    \ and therefore cannot be accessed in any way. Only the execution of the instructions\
    \ left by *Compiler* at the point of the original declaration can do that initialization.\
    \ After that moment, the TDZ is done, and the variable is free to be used for\
    \ the rest of the scope.\n\nA var also technically has a TDZ, but it’s zero in\
    \ length and thus unobservable to our programs! Only *let* and *const* have an\
    \ observable TDZ.\n\nBy the way, “temporal” in TDZ does indeed refer to *time\
    \ not position* in *code*. Consider:\n\n```\naskQuestion();\n// ReferenceError\n\
    let studentName = \"Suzy\";\n\nfunction askQuestion() {\n  console.log(`${studentName},\
    \ do you know?`);\n}\n```\n\nEven positionally the console.log(..) referencing\
    \ studentName comes *after* the let studentName declaration, timing wise the askQuestion()\
    \ function is invoked *before* the let statement is encountered, while studentName\
    \ is still in its TDZ! Hence the error."
