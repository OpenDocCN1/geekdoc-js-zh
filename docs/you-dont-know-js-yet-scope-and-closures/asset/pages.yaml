  md: "# Chapter 8: The Module Pattern\n\nas module.exports. In some older legacy\
    \ code, you may run across references to just a bare exports, but for code clarity\
    \ you should always qualify that reference with the module. prefix.\n\nFor style\
    \ purposes, I like to put \"exports\" at the top and my module implementation\
    \ at the bottom. But these exports can be placed anywhere. I strongly recommend\
    \ collecting them all together, either at the top or bottom of your file.\n\n\
    Some developers have the habit of replacing the default exports object, like this:\n\
    \n```\n// defining a new object for the API\nmodule.exports = {\n  // ..exports..\n\
    };\n```\n\nThere are some quirks with this approach, including unexpected behavior\
    \ if multiple modules circularly depend on each other. As such, I recommend against\
    \ replacing the object. If you want to assign multiple exports at once, using\
    \ object literal style definition, you can do this instead:\n\n```\nObject.assign(module.exports,\n\
    \  // .. exports ..n);\n```\n\nWhat's happening here is defining the { } object\
    \ literal with your module's public API specified, and then Object.assign(...)\
    \ is performing a shallow copy of all those properties onto the existing module.exports\
    \ object, instead of replacing it This is a nice balance of convenience and safer\
    \ module behavior."
