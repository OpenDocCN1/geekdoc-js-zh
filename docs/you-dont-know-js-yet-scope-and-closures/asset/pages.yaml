    \ differently. It's quite common for JS developers to harbor misconceptions without\
    \ even realizing it.\n\n# Browser \"Window\"\n\nWith respect to treatment of the\
    \ global scope, the most pure environment JS can be in is as a standalone .js\
    \ file loaded in a web page environment in a browser. I don't mean \"pure\" as\
    \ in nothing automatically added—lots may be added!—but rather in terms of minimal\
    \ intrusion on the code or interference with its expected global scope behavior.\n\
    \nConsider this .js file:\n\n```\nvar studentName = \"Kyle\";\n\nfunction hello()\
    \ {\n  console.log(`Hello, ${studentName}!`);\n}\n\nhello();\n// Hello, Kyle!\n\
