  md: 'Preface


    toolbox full of tools, who only uses their hammer and scoffs at the screwdriver
    or tape measure as inferior? That’s just silly.


    My unreserved claim is that you should go about learning all parts of JavaScript,
    and where appropriate, use them! And if I may be so bold as to suggest: it’s time
    to discard any JS books that tell you otherwise.


    # The Title


    So what’s the title of the series to insult you with criticism about your current


    I’m not trying to insult your lack of knowledge or understanding of JavaScript.
    I’m not suggesting you can’t or won’t be able to learn JavaScript. I’m not boasting
    about secret advanced insider wisdom that I and only a few possess.


    Seriously, all those were real reactions to the original series title before folks
    read the books. And they’re baseless.


    The primary point of the title “You Don’t Know JS Yet” is to point out that most
    JS developers don’t take the time to really understand how the code they write
    works. They know that it works—that it produces a desired outcome. But they either
    don’t understand exactly how, or worse, they have an inaccurate mental model for
    the how that falters on closer scrutiny.


    I’m presenting a gentle but earnest challenge to you the reader, to set aside
    the assumptions you have about JS, and approach it with fresh eyes and an invigorated
    curiosity that leads you to ask why for every line of code you write. Why does
