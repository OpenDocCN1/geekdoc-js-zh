    \    });\n  },\n  isValidEmail(email) {\n    return /[^\\@]+@[^@]+\\.[^@]+*/.test(email);\n\
    \  }\n};\n```\n\nUtils here are a useful collection of utilities, yet they're\
    \ all state-independent functions. Gathering functionality-together is generally\
    \ good practice, but that doesn't make this a module. Rather, we've defined a\
