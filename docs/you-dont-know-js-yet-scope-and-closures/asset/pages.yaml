  md: "# Node CommonJS Modules\n\nIn Chapter 4, we introduced the CommonJS module\
    \ format used by Node. Unlike the classic module format described earlier, you\
    \ could bundle the module factory or IIFE alongside any other code including other\
    \ modules, CommonJS modules are file-based; one module per file.\n\nLet's tweak\
    \ our module example to adhere to that format:\n\n```\nmodule.exports.getName\
    \ = getName;\n\n// *****************************\nvar records = [\n  { id: 14,\
    \ name: \"Kyle\", grade: 86 },\n  { id: 73, name: \"Suzy\", grade: 87 },\n  {\
    \ id: 112, name: \"Frank\", grade: 75 },\n  { id: 6, name: \"Sarah\", grade: 91\
    \ }\n];\n```\n\n```\nfunction getName(studentID) {\n  var student = records.find(\n\
    \    student => student.id == studentID\n  );\n  return student.name;\n}\n```\n\
    \nThe records and getName identifiers are in the top-level scope of this module,\
