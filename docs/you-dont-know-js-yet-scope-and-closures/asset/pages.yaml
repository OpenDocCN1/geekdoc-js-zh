  md: '# Preface


    # vii


    I''ve taught more than 5,000 developers from teams and companies all over the
    world, in more than 25 countries on six continents. And what I''ve seen is that
    far too often, what counts is generally just the result of the program, not how
    the program is written or how/why it works.


    My experience not only as a developer but in teaching many other developers tells
    me: you will always be more effective in your development work if you more completely
    understand how your code works than you are solely just getting it to produce
    a desired outcome.


    In other words, good enough to work is not, and should not be, good enough.


    All developers regularly struggle with some piece of code not working correctly,
    and they can''t figure out why. But far too often, JS developers will blame this
    on the language rather than admitting they'' own understanding that is falling
    short. These books serve as both the question and answer: why did it do this,
    and here''s how to get it to do that instead.


    My mission with YDKJSY is to empower every single JS developer to fully own the
    code they write, to understand it and to write with intention and clarity.


    # The Path


    Some of you have started reading this book with the goal of completing all six
    books, back to back.


    I would like to caution you to consider changing that plan.


    It is not my intention that YDKJSY be read straight through. The material in these
    books is dense, because JavaScript is'
