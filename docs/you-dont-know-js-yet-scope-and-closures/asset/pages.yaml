  md: 'Non-default exports are referred to as “named exports.”


    The import keyword—like export, it must be used only at the top level of an ESM
    outside of any blocks or functions—also has a number of variations in syntax.
    The first is referred to as “named import":


    ```

    import { getName } from "/path/to/students.js";

    ```


    ```

    getName(73); // Suzy

    ```


    As you can see, this form imports only the specifically named public API members
    from a module (skipping anything not named explicitly), and it adds those identifiers
    to the top-level scope of the current module. This type of import is a familiar
    style to those used to package imports in languages like Java.


    Multiple API members can be listed inside the { .. } set, separated with commas.
    A named import can also be renamed with the as keyword:


    ```

    import { getName as getStudentName }

    from "/path/to/students.js";

    ```


    ```

    getStudentName(73); // Suzy

    ```


    If is a “default export” of the module, we can import it like this:


    ```

    import getName from "/path/to/students.js";

    ```


    ```

    getName(73); // Suzy

    ```


    The only difference here is dropping the { } around the import binding. If you
    want to mix a default import with other named imports:'
