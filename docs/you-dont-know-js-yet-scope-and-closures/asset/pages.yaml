- img_proc: true
  md: 'tively limit programmatic access to the parts we consider private details.
    What’s not considered private is then marked as public, accessible to the whole
    program.


    The natural effect of this effort is better code organization. It’s easier to
    build and maintain software when we know where things are, with clear and obvious
    boundaries and connection points. It’s also easier to maintain quality if we avoid
    the pitfalls of over-exposed data and functionality.


    These are some of the main benefits of organizing JS programs into modules.


    # What Is a Module?


    A module is a collection of related data and functions (often referred to as methods
    in this context), characterized by a division between hidden private details and
    public accessible details, usually called the “public API.”


    A module is also stateful: it maintains some information over time, along with
    functionality to access and update that information.


    > Note

    nA broader concern of the module pattern is fully embracing system-level modularization
    through loose-coupling and other program architecture techniques. That’s a complex
    topic well beyond the bounds of our discussion, but is worth further study beyond
    this book.


