  md: '# # Chapter 6: Limiting Scope Exposure


    So far our focus has been explaining the mechanics of scopes and variables work.
    With that foundation now firmly in place, our attention raises to a higher level
    of thinking: decisions and patterns we apply across the whole program.


    To begin, we''re going to look at how and why we should be using different levels
    of scope (functions and blocks) to organize our program’s variables, specifically
    to reduce scope over-exposure.


    # ## Least Exposure


    It makes sense that functions define their own scopes. But why do we need blocks
    to create scopes as well?


    Software engineering articulates a fundamental discipline, typically applied to
    software security, called “The Principle of Least Privilege” (POLP). ¹1 And a
    variation of this principle that applies to our current discussion is typically
    labeled as “Least Exposure” (POLE).


    POLP expresses a defensive posture to software architecture: components of the
    system should be designed to function with least privilege, least access, least
    exposure. If each piece


    > ¹Principle of Least Privilege, https://en.wikipedia.org/wiki/Principle_of_least_privilege,
    3 March 2020.'
