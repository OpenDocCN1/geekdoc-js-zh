  md: "# Chapter 6: Limiting Scope Exposure\n\ndetail shortly. But first, what about\
    \ hiding var or function declarations in scopes? That can easily be done by wrapping\
    \ a function scope around a declaration.\n\nLet’s consider an example where function\
