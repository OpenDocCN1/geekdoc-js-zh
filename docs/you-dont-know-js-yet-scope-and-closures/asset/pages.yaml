  md: "# Appendix A: Exploring Further\n\nwill readers of this code have to figure\
    \ out the name/purpose? Every single time this line is ever read. Hundreds of\
    \ times? Thousands? More?\n\nNo matter the length or complexity of the function,\
    \ my assertion is, the author should figure out a good descriptive name and add\
    \ it to the code. Even the one-liner functions in map(..) and then(..) statements\
    \ should be named:\n\n```\nlookupTheRecords(someData)\n.then(function extractSalesRecords(resp){\n\
    \  return resp.allSales;\n})\n.then(storeRecords);\n```\n\nThe name extractSalesRecords\
    \ tells the reader purpose of this then(..) handler better than just inferring\
    \ that purpose from mentally executing return.allSales.\n\nThe only excuse for\
    \ not including a name on a function is either laziness (don't want to type a\
    \ few extra characters) or uncreativity (can't come up with a good name). If you\
    \ can't figure out a good name, you likely don't understand the function and its\
    \ purpose yet. The function is perhaps poorly designed, or it does too many things,\
    \ and should be re-worked. Once you have a well-designed, single-purpose function,\
    \ its proper name should become evident.\n\nHere's a trick I use: while writing\
    \ a function, if I don't fully understand its purpose and can't think of a good\
    \ name to use, I just use TODO as the name. That way, later when reviewing my\
