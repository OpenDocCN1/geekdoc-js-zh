    # A Word About Memory


    I want to share a little quick note about this closure cache technique and the
    impacts it has on your application''s performance.


    We can see that in saving the repeated calls, we improve computation speed (in
    some cases, by a dramatic amount). But this usage of closure is making an explicit
    trade-off that you should be aware of.


    The trade-off is unboundedly. We''re essentially growing our cache (in memory)
    If the functions in question were called millions of times with mostly unique
    inputs, we''d be chewing a lot of memory. This can definitely be worth the expense,
    but only if we think it''s likely we see repetition of common inputs so that we''re
    taking advantage of the cache.


    If most every will have a unique input, and the cache is essentially never used
    to any benefit, this is an inappropriate technique to employ.'
