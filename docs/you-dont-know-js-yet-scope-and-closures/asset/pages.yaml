    The general steps I used for each utility:


    +   1. Wrap an IIFE to define the scope for the cache variable to reside.

    2. In the underlying call, first check the cache, and if a result is already known,
    return.

    3. At each place where a return was happening originally, assign to the cache
    and just return the results of that asignment operation—this is a space savings
    trick mostly just for brevity in the book.


    I also renamed the inner function from factorize(..) to findFactors(..). That''s
    not technically necessary, but it helps to make clearer which function the recursive
    calls invoke.


