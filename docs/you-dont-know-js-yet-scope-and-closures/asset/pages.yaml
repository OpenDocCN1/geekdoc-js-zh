    of the TDZ behavior just illustrated. But this is not accurate. We’ll come back
    and explain both the hoisting and TDZ of let/const in Chapter 5.


    Hopefully you’re convinced JS programs are parsed before any execution begins.
    But does it prove they are compiled?


    This is an interesting question to ponder. Could JS parse a program, but then
    execute that program by interpreting operations represented in the AST without
    first compiling the program? Yes, that is possible. But it is extremely unlikely,
    mostly because it would be extremely inefficient performance wise.


    It’s hard to imagine a production-quality JS engine going to all the trouble of
    parsing a program into an AST, but not converting (aka, “compiling”) AST into
    the most efficient (binary) representation for the engine to execute.


