  md: '# Exit Scope


    Whether you use the classic module format (browser or Node), CommonJS format (in
    Node), or ESM format (browser or Node), modules are one of the most effective
    ways to structure and organize your program''s functionality and data.


    The module pattern is the conclusion of our journey in how we can use the rules
    of lexical scope to place variables and functions in proper locations. POLE the
    defensive *private* by default posture we always take, making sure we avoid over-exposure
    and interact only with the minimal public API surface area necessary.


    And underneath modules, the *magic* of how all our module state is maintained
    is closures leveraging the lexical scope system.


