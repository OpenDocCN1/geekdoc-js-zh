  md: '# Chapter 4: Around the Global Scope


    +   JS exposes its built-ins:

    - primitives: undefined, null, Infinity, NaN

    - natives: Date(), Object(), String(), etc.

    - global functions: eval(), parseInt(), etc.

    - namespaces: Math, Atomics, JSON

    - friends of JS: Intl, WebAssembly


    +   The environment hosting the JS engine exposes its own built-ins:

    - console (and its methods)

    - the DOM (window, document..), etc)

    - timers (setTimeout(..), etc)

    - web platform APIs: navigator, history, geolocation, WebRTC, etc.


    These are some of the many globals your programs will interact with.


    > Note

    Node also exposes several elements “globally,” but they’re technically not in
    the global scope: require(), __dirname, module, and so on.


    Most developers agree that the global scope shouldn''t just be a dumping ground
    for every variable in your application. That’s a mess of bugs just waiting to
    happen. But it’s also undeniable that the global scope is an important glue for
    practically every JS application.'
