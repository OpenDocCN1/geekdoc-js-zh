  md: "Appendix A: Exploring Further\n\n190\n\nThe id = 5 assignment makes the divergence\
    \ observable, where the id parameter stays 3 and the local variable becomes 5.\n\
    \nMy advice to avoid getting bitten by these weird nuances:\n\n+   - Never shadow\
    \ parameters with local variables\n- Avoid using a default parameter function\
    \ that closes over any of the parameters\n\nAt least now you're aware and can\
    \ be careful about the fact that the parameter list is its own scope if any of\
    \ the parameters are non-simple.\n\n# Function Name Scope\n\nIn “Function Name\
    \ Scope” section in Chapter 3, I asserted that the name of a function expression\
    \ is added to the function’s own scope. Recall:\n\n```\nvar askQuestion = function\
    \ ofTheTeacher() {\n  // /\n};\n```\n\nIt's true that ofTheTeacher is not added\
    \ to the enclosing scope (where askQuestion is declared), but it's also not just\
    \ added to the scope of the function, the way you're likely assuming. It's another\
    \ strange corner case of implied scope.\n\nThe name identifier of a function expression\
    \ is in its own implied scope, nested between the outer enclosing scope and the\
    \ main inner function scope.\n\nIf ofTheTeacher was in the function's scope, we'd\
    \ expect an error here:\n\n> You Don’t Know JS Yet: Scope & Closures"
