    Assigning to a never-declared variable is an error, so it''s right that we would
    receive a ReferenceError here.


    Never rely on accidental global variables. Always use strict-mode, and always
    formally declare your variables. You''ll then get a helpful ReferenceError if
    you ever mistakenly try to assign to a not-declared variable.


