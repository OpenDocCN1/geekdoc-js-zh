  md: "# Closer to Closure\n\nAs we close down a dense chapter, take some deep breaths\
    \ let it sink in. Seriously, that’s a lot of information for anyone to consume!\
    \ \n\nWe explored two models for mentally tackling closure:\n\n+   - Observational:\
    \ closure is a function instance remembering its outer variables even as that\
    \ function is passed to and invoked in other scopes.\n- Implementational: closure\
    \ is a function instance and its scope environment preserved in-place while any\
    \ references to it are passed around around and invoked from other scopes.\n\n\
    Summarizing the benefits to our programs:\n\n+   - Closure can improve efficiency\
    \ by allowing a function instance to remember previously determined information\
    \ instead of having to compute it each time.\n- Closure can improve code readability,\
    \ bounding scope-exposure by encapsulating variable(s) inside function instances,\
    \ while still making sure the information in those variables is accessible for\
    \ future use. The resultant narrower, more specialized function instances are\
    \ cleaner to interact with, since the preserved information doesn’t need to be\
    \ passed in every invocation.\n\nBefore you move on, take some time to restate\
    \ this summary in your own words, explaining what closure is and why it’s helpful\
