    # Modules


    This exercise is to convert the calculator from Closure (PART 3) into a module.


    We’re not adding any additional functionality to the calculator, only changing
    its interface. Instead of calling a single function calc(..), we’ll be calling
    specific methods on the public API for each “keypress” of our calculator. The
    outputs stay the same.


    This module should be expressed as a classic module factory function called calculator(),
