    \ as “6!\") is the multiplication of a given integer against successively lower\
    \ integers down to 1—actually, you can stop at 2 multiplying 1 does nothing. In\
    \ other words, “6!” is the same as “6 * 5!\", which is the same as “6 * 5 * 4!\"\
    , and so on. Because of the nature of the math involved, once any integer’s factorial\
    \ (like “4!”) has been calculated, we shouldn’t need to do that work, as it’s\
    \ always be the same answer.\n\nSo if you naively calculate factorial for 6, then\
    \ later want to calculate factorial for 7, you might unnecessarily re-calculate\
    \ the factorials of all the integers from 2 up to 6. If you’re willing to trade\
    \ memory for speed, you can solve that wasted computation by caching each integer’s\
    \ factorial as it’s calculated:\n\n```\nvar cache = {};\n\nfunction factorial(x)\
    \ {\n  if (x < 2) return 1;\n  if (!x in cache) {\n    cache[x] = x * factorial(x\
