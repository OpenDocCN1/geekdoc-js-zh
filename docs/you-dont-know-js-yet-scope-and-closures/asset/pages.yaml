  md: 'To include another module instance into your module/program, use Node’s require(..)
    method. Assuming this module is located at "/path/to/student.js", this is how
    we can access it:


    ```

    var Student = require("/path/to/student.js");


    Student.getName(73);

    // Suzy

    ```


    Student now references the public API of our example module.


    CommonJS modules behave as singleton instances, similar to the IIFE module definition
    style presented before. No matter how many times you require(..) the same module,
    you just get additional references to the single shared module instance.


    require(...) is an all-or-nothing mechanism; it includes a reference of the entire
    exposed public API of the module. To effectively access only part of the API,
    the typical approach looks like this:


    ```

    var getName = require("/path/to/student.js").getName;


    // or alternatively:


    var { getName } = require("/path/to/student.js");

    ```


    Similar to the classic module format, the publicly exported methods of a CommonJS
    module’s API holds closures over the internal module details. That’s how the module
    singleton state is maintained across the lifetime of your program.'
