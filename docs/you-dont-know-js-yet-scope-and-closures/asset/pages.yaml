    Worse, exposure of private details invites those with mal-intent to try to work
    around limitations you have imposed, to do things with your part of the software
    that shouldn''t be allowed.


    +   * Unintended Dependency: if you expose variables/functions unnecessarily,
    it invites other developers to use and depend on those otherwise private pieces.
    While that doesn''t break your program today, it creates a refactoring hazard
    in the future, because now you cannot not as easily refactor that variable or
    function without potentially breaking other parts of the software that you don''t
    control.


    For example, if your code relies on an array of numbers, and you decide it''s
    better to use some other data structure instead of an array, you now must take
    on the liability of adjusting other affected parts of the software.


    POLE, as applied to variable/function scoping, essentially says, default to exposing
    the bare minimum necessary, keeping everything else as private as possible. Declare
    variables in as small and deeply nested of scopes as possible, rather than placing
    everything in the global (or even outer function) scope.


    If you design your software accordingly, you have a much greater chance of avoiding
    (or at least minimizing) these three hazards.


    Consider:


    > You Don''t Know JS Yet: Scope & Closures'
