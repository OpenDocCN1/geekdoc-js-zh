  md: "# Appendix A: Exploring Further\n\n```\n// outer/global scope: RED(1)\n\nfunction\
    \ getStudentName(/*BLUE(2)*/ studentID = 0) {\n  // function scope: GREEN(3)\n\
    \n// ..\n```\n\nHere, the parameter list essentially becomes its own scope, and\
    \ the function’s scope is then nested inside that scope.\n\nWhy? What difference\
    \ does it make? The non-simple parameter introduces various corner cases, so the\
    \ parameter list becomes its own scope to more effectively deal with them.\n\n\
    Consider:\n\n```\nfunction getStudentName(studentID = maxID, maxID) {\n  // ..\n\
    ```\n\nAssuming left-to-right operations, the default = maxID for the studentID\
