  md: '# Nested Scope


    When it comes time to execute the getStudentName() function, Engine asks for a
    Scope Manager instance for that function''s scope, and it will then proceed to
    look up the parameter (studentID) to assign the 73 argument value to, and so on.


    The function scope for getStudentName(..) is nested inside the global scope. The
    block scope of the for-loop is similarly nested inside that function scope. Scopes
    can be lexically nested to any arbitrary depth as the program defines.


    Each scope gets its own Scope Manager instance each time that scope is executed
    (one or more times). Each scope automatically has all its identifiers registered
    at the start of the scope being executed (this is called “variable hoisting”;
    see Chapter 5.


    At the beginning of a scope, if any identifier came from a function declaration,
    variable is automatically initialized to its associated function reference. And
    if any identifier came from a var declaration (as opposed to let/const), that
    variable is automatically initialized to undefined so that it can be used; otherwise,
    the variable remains uninitialized (aka, in “TDZ”) and cannot be used until its
    full declaration-and-initialization is executed.


