    \ very clearly tells the\nreader, at a quick glance, what's happening.\n\nThe\
    \ JS engine doesn't care about the name. But human\nreaders of your code at absolutely\
    \ do.\n\nCan the reader look at v % 2 == 1 and figure out what it's\ndoing? Sure.\
    \ They have to infer the purpose (and name) by\nmentally executing the code. Even\
    \ a brief pause to do so slows\ndown reading of the code. A good descriptive name\
    \ makes this\nprocess almost effortless and instant.\n\nThink of it this way:\
    \ how many times does the author of\nthis code need to figure out the purpose\
