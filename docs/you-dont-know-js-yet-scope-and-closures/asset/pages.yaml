  md: "# Chapter 5: The (Not So) Secret Lifecycle of Variables\n\nThere’s a common\
    \ misconception that TDZ means let and const do not hoist. This is inaccurate,\
    \ or at least slightly misleading, claim. They definitely hoist.\n\nThe actual\
    \ difference is that let/const declarations do not automatically initialize at\
    \ the beginning of the scope, the var does. The debate is then if the auto-initialization\
    \ is part of hoisting, or not? I think auto-registration of a variable at the\
    \ top of the scope (i.e., what I call “hoisting”) and auto-initialization at the\
    \ top of the scope (to undefined) are distinct operations and shouldn’t be lumped\
    \ together under the single term “hoisting.”\n\nWe’ve already seen that let and\
    \ const don’t auto-initialize at the top of the scope. But let’s prove that let\
    \ and const do hoist (auto-register at the top of the scope), courtesy of our\
    \ friend shadowing (see “Shadowing” in Chapter 3):\n\n```\nvar studentName = \"\
    Kyle\";\n```\n\n```\n{\n  console.log(studentName);\n  // ???\n\n  // ..\n\n \
    \ let studentName = \"Suzy\";\n\n  console.log(studentName);\n  // Suzy\n}\n```\n\
    \nWhat’s going to happen with the first console.log(...) statement? If let studentName\
    \ didn’t hoist to the top of the scope, then the first console.log(...) should\
    \ print \"Kyle\","
