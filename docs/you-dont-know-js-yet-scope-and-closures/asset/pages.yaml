  md: 'Chapter 3: The Scope Chain


    function functions do. An arrow function, with or without { .. } around its body,
    still creates a separate, inner nested bucket of scope. Variable declarations
    inside this nested scope bucket behave the same as in a function scope.


    # Backing Out


    When a function (declaration or expression) is defined, a new scope is created.
    The positioning of scopes nested inside one another creates a natural scope hierarchy
    throughout the program, called the scope chain. The scope chain controls variable
    access, directionally oriented upward and outward.


    Each new scope offers a clean slate, a space to hold its own set of variables.
    When a variable name is repeated at different levels of the scope chain, shadowing
    occurs, which prevents access to the outer variable from that point inward.


    As we step back out from these finer details, the next chapter shifts focus to
    the primary scope all JS programs include: the global scope.'
