  md: 'placement of functions, blocks, and variable declarations, in relation to one
    another.


    If you place a variable declaration inside a function, the compiler handles this
    declaration as it''s parsing the function, and associates that declaration with
    the function''s scope. If a variable is block-scope declared (let / const), then
    it''s associated with the nearest enclosing { .. } block, rather than its enclosing
    function (with var).


    Furthermore, a reference (target or source role) for a variable must be resolved
    as coming from one of the scopes that are lexically available to it; otherwise
    the variable is said to be “undeclared” (which usually results in an error!).
    If the variable is not declared in the current scope, the next outer/enclosing
    scope will be consulted. This process of stepping out one level of scope nesting
    continues until either a matching variable declaration can be found, or the global
    scope is reached and there''s nowhere else to go.


    It''s important to note that compilation doesn''t actually do anything in terms
    of reserving memory for scopes and variables. None of the program has been executed
    yet.


    Instead, compilation creates a map of all the lexical scopes that lays out what
    the program will need while it executes. You can think of this plan as inserted
    code for use at runtime, which defines all the scopes (aka, “lexical environments”)
    and registers all the identifiers (variables) for each scope.


    In other words, while scopes are identified during compilation, they''re not actually
    created until runtime, each time a scope needs to run. In the next chapter, we''ll
    sketch out the conceptual foundations of lexical scope.'
