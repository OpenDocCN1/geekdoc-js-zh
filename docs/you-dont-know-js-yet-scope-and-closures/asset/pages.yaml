  md: '# Undefined Mess


    If the variable is a source, an unresolved identifier lookup is considered an
    undeclared (unknown, missing) variable, which always results in a ReferenceError
    being thrown. Also, if the variable is a target, and the code at that moment is
    running in strict-mode, the variable is considered undeclared and similarly throws
    a ReferenceError.


    The error message for an undeclared variable condition, in most JS environments,
    will look like, "Reference Error: XYZ is not defined." The phrase "not defined"
    seems almost identical to the word "undefined," as far as the English language
    goes. But these two are very different in JS, and this error message unfortunately
    creates a persistent confusion.


    "Not defined" really means "not declared"—or, rather, undeclared, as in a variable
    that has no matching declaration in anyically available scope. By contrast, "undefined"
    really means a variable was found (declared), but the variable otherwise has no
    value in it at the moment, so it defaults to the undefined value.


    To perpetuate the confusion even further, JS''s typeof operator returns the string
    "undefined" for variable references in either state:


    ```

    var studentName;

    typeof studentName; // "undefined"

    typeof doesNotExist; // "undefined"

    ```


    These two variable references are in very different conditions, but JS sure does
    muddy the waters. The terminology mess'
