  \ mysql_ping, mysql_query, mysql_fetch_assoc, mysql_num_rows, mysql_fetch_array,\
  \ mysql_error, mysql_insert_id, mysql_real_stress_close, mysql_strata_close, mysql_strata_close\n\
  \    * /\n\n    define (\"MYSQL_ASSOC\", MYSQLI_ASSOC);\n    define (\"MYSQL_NUM\"\
  , MYSQLI_NUM);\n    define (\"MYSQL_BOTH\", MYSQLI_BOTH);\n\n    function mysql_fetch_array\
  \ ($ result, $ result_type = MYSQL_BOTH) {\n        $ row = mysqli_fetch_array ($\
  \ result, $ result_type);\n        return is_null ($ row)? false: $ row;\n    }\n\
