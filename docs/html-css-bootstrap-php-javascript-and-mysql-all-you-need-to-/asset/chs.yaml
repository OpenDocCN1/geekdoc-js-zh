  \ {\n        $ file_size = $ _FILES ['userimage'] ['size'];\n        if ($ file_size>\
  \ $ max_size) {\n            print $ tooBig;\n        } else {\n            doUpload\
  \ ($ file, $ upload_dir);\n        }\n    } else {\n        print $ wrongExt;\n\
  \    }\n} else {\n    print $ noSubmitSend;\n}\n\nfunction doUpload ($ file, $ upload_dir)\
  \ {\n    global $ thatsAll;\n    $ filename = $ _FILES ['userimage'] ['tmp_name'];\n\
  \    $ realname = $ _FILES ['userimage'] ['name'];\n    $ realname = htmlentities\
  \ (strtolower ($ realname));\n    if (is_uploaded_file ($ filename)) {\n       \
  \ $ newname = ($ realname);\n        $ ext = end (explode ('.', $ realname));\n\
  \        $ filename = explode ('.', $ realname);\n        $ newname = str_replace\
  \ ('', '_', $ newname);\n        @move_uploaded_file ($ filename, ($ upload_dir.\
  \ '/'. $ newname));\n        print $ thatsAll;\n    } else print $ wrongUp;\n}\n\
