  - `$extensions`：允许的文件类型。\n- `$noSubmitSend`：当直接调用 PHP 脚本时的错误信息。\n- `$wrongExt`：文件类型不允许时的错误信息。\n\
  - `$tooBig`：文件过大时的错误信息。\n- `$thatsAll`：上传成功时的成功信息。\n- `$wrongUp`：脚本上传失败时的错误信息。\n\
  \n### 上传逻辑\n```php\nif (isset ($ _ POST ['send'])) {\n    $ file = $ _FILES ['userimage']\
