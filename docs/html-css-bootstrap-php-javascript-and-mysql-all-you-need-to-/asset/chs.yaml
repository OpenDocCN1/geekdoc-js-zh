  \n4. 您的个人数据也可能被披露给 NEGOZIO 1 SRL 的关联公司或控股公司，用于具体信息中不时强调的目的。数据在任何情况下都不会被公开。\n\n5.\
  \ 您的个人数据通过自动化工具处理，处理时间严格限于实现收集目的所必需的时间。\n\n6. 您的个人数据将按照第 196/2003 号立法法令规定的安全措施进行处理，以防止数据丢失、非法或未经授权的使用，或未经授权的访问。\n\
