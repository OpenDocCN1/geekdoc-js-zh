  \n显然，页面会缺少精确的样式，我们可以将样式直接插入 HTML 页面，或者插入到一个名为 `style.css` 的特定文件中，该文件将包含页面样式，我们稍后会看到。\n\
  \n现在文件数量增加了，让我们为网站创建一个专门的文件夹，我们将其命名为“基础站点”，并在其中插入 `.css` 扩展名的文件和 `.html` 扩展名的文件。要查看网站，请双击\
