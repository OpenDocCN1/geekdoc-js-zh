  \ = 0) {\n        $numrows = mysqli_num_rows ($result);\n        if ($numrows &&\
  \ $row <= $numrows-1 && $row >= 0) {\n            mysqli_data_seek ($result, $row);\n\
  \            $resultrow = (is_numeric ($col))? mysqli_fetch_row ($result): mysqli_fetch_assoc\
