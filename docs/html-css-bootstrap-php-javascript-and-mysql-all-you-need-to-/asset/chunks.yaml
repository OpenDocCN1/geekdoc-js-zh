    >\n<link rel=\"apple-touch-icon-precomposed\" href=\"ico/apple-touch-icon-57-precomposed.png\"\
    >\n```\n\n### JavaScript\n\n```html\n<script type=\"text/javascript\" src=\"js/search.js\"\
    ></script>\n<script src=\"js/jquery-1.6.4.min.js\" type=\"text/javascript\"></script>\n\
