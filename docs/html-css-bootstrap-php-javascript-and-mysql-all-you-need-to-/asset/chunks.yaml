    The file `pclzip.lib.php` can be downloaded from the internet and is used to zip\
    \ and unzip files:\n[https://github.com/chamilo/pclzip/blob/master/pclzip.lib.php](https://github.com/chamilo/pclzip/blob/master/pclzip.lib.php)\n\
    \nRemember to download this file and insert it in the site folder otherwise you\
    \ will not be able to upload the zipped images from the site menu.\n\nIf you can't\
    \ download it you can copy it from the internet and paste it on notepad and save\
    \ the file with the name `pclzip.lib.php`, if you don't know where to put your\
    \ hands, never change the names of the files because they are linked to other\
    \ files.\n\nThe js files written in javascript actually in this project were downloaded\
    \ with bootstrap or free from internet for image scrolling like `prettyPhoto`.\
    \ In this book we did not want to deepen the javascript language which will be\
    \ the subject of a future book.\n\nI remind you that `prettyPhoto` also exists\
    \ as a WordPress plugin.\n\nThe javascript files present in the `JS` folder are:\n\
    \n![](images/ebook_image_205181_6994a3c6324732b0.jpg)\n\n`I remind you that in\
    \ your site you can incorporate all the codes that you will find on the internet\
    \ respecting the relative licenses if they exist, but always paying attention\
    \ to the general functioning of the site and to the slowdown in load that too\
    \ many programs bring.`\n\n# Change the style of the site\n\nIn this case, if\
    \ we are at the beginning of the project, we can directly change the whole site\
    \ by downloading a bootstrap or creating it from scratch, as seen previously,\
    \ otherwise if we are already at the end of the work, we can only change the CSS\
    \ style sheet manually with Notepad or by copying the style folder from another\
    \ Bootstrap or from another site and modifying it with Nicepage or with a mobile\
    \ application such as TrebEdit or Html Creator and many others present on the\
    \ various stores as previously indicated.\n\nThe original page is the one below:\n\
    \n![](images/ebook_image_205181_90ea14796411ed44.jpg)\n\nHere is an example of\
    \ changing the entire Bootstrap style folder, after finishing the site:\n\n![](images/ebook_image_205181_d40a63f6f98d9e60.jpg)\n\
    \nObviously, after having changed the style sheet, it would be better to open\
    \ the sheet itself with Notepad and check it carefully, keeping in mind the result\
    \ you want to obtain.\n\n`Small warning for non-experts is to always save the\
    \ previous work in a backup folder before making any changes.`\n\n# See the site\
    \ on WAMP\n\nTo view the site created on WAMP you must first click on `wampmanager.exe`\
    \ to activate WAMP, then enter the menu at the bottom left of WAMP and click on\
    \ `localhost`.\n\n![](images/ebook_image_205181_6eddc5c3a9e4d5ba.jpg)\n![](images/ebook_image_205181_7ef619f1277aacf5.jpg)\n\
    ![](images/ebook_image_205181_c6ad06d7b4976fc1.jpg)\n\nNow, if we click on the\
    \ folder we are interested in, we will probably have an error screen like the\
    \ following.\n\n![](images/ebook_image_205181_c7e8448aae50fc2c.jpg)\n\nIn this\
    \ case we have to type `127.0.0.1` in the address before the folder address and\
    \ our site will appear in simulation with the php files and working databases.\
    \ To access our site located in the `www` folder of wamp we will therefore insert\
    \ the address in the bar always with the address `127.0.0.1` otherwise it will\
    \ not work. The address `127.0.0.1`, in fact, identifies your computer and is\
    \ therefore the address of the `localhost` in which we can view our site.\n\n\
    [http://127.0.0.1/negozio%20abbigliamento%20donna-uomo-calzature-accessori%20%2027%2011%202021%20aggiornato/](http://127.0.0.1/negozio%20abbigliamento%20donna-uomo-calzature-accessori%20%2027%2011%202021%20aggiornato/)\n\
    \nOur final site will consist of nine web pages plus a control panel for inserting\
    \ images and news.\n\n![](images/ebook_image_205181_2c3359e5ea691c40.jpg)\n![](images/ebook_image_205181_b18a6fc46c684d45.jpg)\n\
    ![](images/ebook_image_205181_84b4a9ea8f747e4b.jpg)\n![](images/ebook_image_205181_4d6582c5b0afc9f6.jpg)\n\
    ![](images/ebook_image_205181_30bf861ad73f82ef.jpg)\n![](images/ebook_image_205181_8e1e3dae3973846b.jpg)\n\
    ![](images/ebook_image_205181_91ed55d6c19380c2.jpg)\n![](images/ebook_image_205181_d7b3438d8b3c3c33.jpg)\n\
    ![](images/ebook_image_205181_96435919c75d4ed8.jpg)\n![](images/ebook_image_205181_f866bd9fc53c012e.jpg)\n\
    ![](images/ebook_image_205181_86c8fce4a9a6e22d.jpg)\n\n`I remind you that if you\
    \ have to change the names of the files inserted in the html pages, you have to\
    \ change the name on all the pages that contain the link and then update each\
