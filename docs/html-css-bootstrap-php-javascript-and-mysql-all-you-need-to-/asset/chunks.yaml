    folder in the `www` folder of `wamp` and installing it directly after creating
    a database from `wamp` in `phpMyAdmin` that we will insert in the `WordPress`
    configuration.***


    # phpMyAdmin and MySQL


    Using databases is not easy, first of all we have to choose whether to create
    the site directly on the web or test it on a local web simulator which we will
    then bring back to the web. However, even if we decide to test the site on our
    PC, we still have to create the same databases on the hosting that we bought or
    got for free. Each hosting with a link to a website will contain a database management
    software such as `phpMyAdmin`.


    ***I remind you that the database data will be re-entered into the software linked
    to the address of your website, while the pages and the various files in `php`
    can be uploaded directly from the hosting.***


    The Databases of our project are constructed as follows:


    *   `Data table`;

    *   `Data_news table`;

    *   `Login table`.


    The first table contains the data useful for uploading the images of the collections
    and sliders. The second contains the useful data for uploading the news and the
    third contains the useful data for the login (username and password).


    ![](images/ebook_image_205181_59b631724902e444.jpg)![](images/ebook_image_205181_d8953d8ad807b49b.jpg)![](images/ebook_image_205181_63fc81fe253650a4.jpg)


    In fields:


    *   `n` the number of images in the women''s collection will be saved;

    *   `n2` will be the number of images in the men''s collection;

    *   `N3` will be the number of sliders on the home, shop 1, shop 2 and shop 3
    pages.


    ![](images/ebook_image_205181_301fd016309dbeb6.jpg)


    In this table we will have the `news` field containing all the news inserted in
    the homepage of our site that we can delete and modify as well as we can insert
    new ones through the control panel.


    ![](images/ebook_image_205181_a84c7d362c6d3ae2.jpg)


    ***I remind you that for greater security we have entered the password in `SHA1`
    code.***


    In particular, we went to the site to encrypt and decrypt passwords:


    [https://www.online-toolz.com/tools/sha1-generator.php](https://www.online-toolz.com/tools/sha1-generator.php)


    We have selected the `SHA1` code and copied this code into the database. Subsequently,
    it is advisable to save the original password in a data file that you will need
    to access the Databases.


    ***I remind you that to access the login you will enter the original username
    and password that our `php` code will encrypt and check with the `SHA1` code entered
    in the database.***


    # Login and menu for inserting images and news


    We will access the control panel from the login page available at the top of the
    pages of our site identified with the image of the little man and the word Login.


    ![](images/ebook_image_205181_a9f821d4ec6f19c1.jpg)![](images/ebook_image_205181_14343614c654d182.jpg)![](images/ebook_image_205181_4cb2259da9f09fb0.jpg)![](images/ebook_image_205181_ee163627126ece80.jpg)![](images/ebook_image_205181_4e854029cc75be15.jpg)![](images/ebook_image_205181_e97b2e3a60a79663.jpg)![](images/ebook_image_205181_d3a4ce17daf9e2e2.jpg)![](images/ebook_image_205181_1f0cfa3cec2db12c.jpg)![](images/ebook_image_205181_18d358ee3f1e66f8.jpg)![](images/ebook_image_205181_63fbd57d42114ff9.jpg)


    Even if the message reports a format error, the procedure will still upload the
    photo to the men''s collection page.


    ![](images/ebook_image_205181_caaef77e956118f9.jpg)


    For the news the speech is a little different as we will insert the image and
    the written News that we can modify or delete in the future. In this case we will
    also insert the written news in the Database.


    ![](images/ebook_image_205181_1835e6c869328670.jpg)![](images/ebook_image_205181_b5a31bd33e4c80bf.jpg)


