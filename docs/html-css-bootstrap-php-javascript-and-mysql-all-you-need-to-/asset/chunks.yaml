    that we have included in this book for educational purposes only. Obviously some
    resources have been modified to be adapted to the usefulness of the example site
    included in this book.


    In the WAMP `WWW` folder we will have the folder containing all the archives and
    files that we will later upload to the hosting provider that will host the site.
    Remember to also create the Databases directly in the hosting as we will describe
    later.


    Our example site folder we created contains the following files and subfolders:


    ![](images/ebook_image_205181_e5af83ae2855b69a.jpg)


    The files for the site pages are divided into `files.html` and `files.php` based
    on database usage or not.


    **I remind you that the pages that contain `php` files must be saved in `php`
    and not in `html` otherwise they do not work, in fact we will have pages saved
    in `html` and pages saved in `php` depending on whether they are used or not in
    the databases.**


