    );\ninclude (\"config.php\");\n\nmysql_select_db (\"$ db_name\", $ connection);\n\
    $ news = mysql_real_escape_string ($ news);\n\n$ query = \"UPDATE data_news set\
    \ news = '$ news' WHERE id2 = '$ i'\";\n$ result = mysql_query ($ query);\n\n\
    if (! $ result) {\n    die (\"查询 $ query 时出错：\". mysql_error ());\n}\necho '<script\
    \ language = javascript> document.location.href = \"insert photo.php\" </script>';\n\
    ```\n\n### 新闻处理（`uploadnews5.php`）\n```php\n$ o = $ _ GET ['i'];\n$ i = (int)\
