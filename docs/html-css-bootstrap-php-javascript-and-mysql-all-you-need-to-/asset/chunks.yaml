    \ photo\" name=\"send\">\n</form>\n```\n\n```\n<form enctype=\"multipart/form-data\"\
    \ action=\"woman-dresses.php\" method=\"post\">\n    <br>\n    <input type=\"\
    submit\" value=\"View photo\" name=\"send\">\n</form>\n```\n\n### 插入单张照片\n\n如果要覆盖照片，应始终使用相同的名称，如\"\
