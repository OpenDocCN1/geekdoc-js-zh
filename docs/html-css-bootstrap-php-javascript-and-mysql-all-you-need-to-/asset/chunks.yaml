- fmt: "\n# PHP 文件上传与解压脚本实现\n\n## 脚本实现一：基础上传与 PclZip 解压\n\n该部分代码实现了接收 HTML 表单提交的文件，验证其后缀名和大小，上传后使用\
    \ `PclZip` 库进行解压并删除原压缩包。\n\n```php\n$name = '';\n$filen = '';\n\n// Check the\
    \ submit of the HTML form ...\nif (isset($_POST['send'])) {\n    $file = $_FILES['userimage']['name'];\n\
    \n    // Check the file type ...\n    if (in_array(array_pop(explode('.', $file)),\
    \ $extensions)) {\n        // Check the file size ...\n        $file_size = $_FILES['userimage']['size'];\n\
    \        if ($file_size > $max_size) {\n            print $tooBig;\n        }\
    \ else {\n            doUpload($file, $upload_dir);\n            print $file;\n\
    \            print $upload_dir;\n            require_once('pclzip.lib.php');\n\
    \            \n            $archive = new PclZip($upload_dir . '/' . $file);\n\
    \            if ($archive->extract(PCLZIP_OPT_PATH, $upload_dir, PCLZIP_OPT_REMOVE_PATH,\
    \ 'install / release') == 0) {\n                die(\"Error:\" . $archive->errorInfo(true));\n\
    \            }\n            echo \"Extract files successfully\";\n           \
    \ if (unlink($upload_dir . '/' . $file)) {\n                echo 'the file was\
    \ deleted';\n            } else {\n                echo 'the file was NOT deleted';\n\
    \            }\n        }\n    } else {\n        print $wrongExt;\n    }\n} else\
    \ {\n    print $noSubmitSend;\n}\n\nfunction doUpload($file, $upload_dir) {\n\
    \    global $thatsAll;\n    $filename = $_FILES['userimage']['tmp_name'];\n  \
    \  $realname = $_FILES['userimage']['name'];\n    $realname = htmlentities(strtolower($realname));\n\
    \    if (is_uploaded_file($filename)) {\n        $newname = ($realname);\n   \
    \     $ext = end(explode('.', $realname));\n        $filename = explode('.', $realname);\n\
    \        $newname = str_replace('', '_', $newname);\n        @move_uploaded_file($filename,\
    \ ($upload_dir . '/' . $newname));\n        $filename = $upload_dir . '/' . $newname;\n\
    \        print $thatsAll;\n    } else print $wrongUp;\n}\n```\n\n### 备选解压方案（注释部分）\n\
    代码中还包含了使用 `ZipArchive` 类和系统 `unzip` 命令的替代方案：\n\n- 使用 `ZipArchive`：通过 `open()`\
    \ 打开文件，`statIndex()` 查看文件列表，`extractTo()` 解压。\n- 使用 `exec()`：调用系统 `unzip` 命令并配合\
    \ `copy()` 和 `unlink()` 处理文件。\n\n## 脚本实现二：纯上传功能 (`upload-fullscreen-slider-STORE\
    \ 2.php`)\n\n该脚本简化了流程，仅保留文件上传验证与存储功能。\n\n```php\n// filename: upload-fullscreen-slider-STORE\
    \ 2.php\n$max_size = '12600000'; \n$upload_dir = 'UPLOAD5 / fullscreen'; \n$extensions\
    \ = array(\"png\", \"jpg\", \"gif\", \"PNG\", \"JPG\", \"GIF\"); \n$noSubmitSend\
    \ = 'No upload done!'; \n$wrongExt = 'Invalid file extension!'; \n$tooBig = 'The\
    \ file exceeds the max size!'; \n$thatsAll = 'Photo uploaded successfully!'; \n\
    $wrongUp = 'Something wrong here!'; \n\nif (isset($_POST['send'])) {\n    $file\
    \ = $_FILES['userimage']['name'];\n    if (in_array(array_pop(explode('.', $file)),\
    \ $extensions)) {\n        $file_size = $_FILES['userimage']['size'];\n      \
    \  if ($file_size > $max_size) {\n            print $tooBig;\n        } else {\n\
    \            doUpload($file, $upload_dir);\n        }\n    } else {\n        print\
    \ $wrongExt;\n    }\n} else {\n    print $noSubmitSend;\n}\n\nfunction doUpload($file,\
    \ $upload_dir) {\n    global $thatsAll;\n    $filename = $_FILES['userimage']['tmp_name'];\n\
    \    $realname = $_FILES['userimage']['name'];\n    $realname = htmlentities(strtolower($realname));\n\
    \    if (is_uploaded_file($filename)) {\n        $newname = ($realname);\n   \
