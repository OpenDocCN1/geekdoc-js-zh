    \n`现在你修复了之前的文件，你将看到你的网站的所有部分都在正常工作。`\n\n`显然，该网站只允许插入图片，要修改或删除它们，你必须更改数据库设置并将图片直接插入数据库，正如我们处理新闻文本部分的那样。`\n\
