    - `js/jquery.ui.map.min.js`\n- `js/scripts.js`\n\n---\n\n# Control Panel - NEWS\
    \ Management\n\n## News of the Index page\n在执行任何操作（插入、修改、删除）之前，请务必先查看新闻以避免问题。\n\
    - **查看路径**：`visualizzanews.php`\n\n### 插入新闻图片\n请确保插入的分辨率为 `340x340` 的照片，命名格式应为\
    \ `imgnews1.jpg`, `imgnews2.jpg` 等。\n\n### 核心逻辑实现\n系统使用 PHP 处理会话与用户验证：\n```php\n\
    session_start();\n$username = $_SESSION['username'];\necho \"Hello\". $username;\n\
    ```\n\n前端初始化脚本：\n```javascript\n$(document).ready(function () {\n    $(\"a [rel\
    \ ^ = 'prettyPhoto']\").prettyPhoto();\n});\n```\n\n### 静态资源配置\n- **CSS 样式表**：`css/reset.css`,\
    \ `css/prettyPhoto.css`, `bootstrap/css/bootstrap.min.css`, `css/style.css` 等。\n\
    - **脚本文件**：`js/search.js`, `js/jquery-1.6.4.min.js`, `js/jquery.prettyPhoto.js`,\
    \ `numtot.js`。\n"
