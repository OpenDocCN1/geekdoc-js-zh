    upload-fullscreen-dresses-woman.php\" method=\"post\">\n    <input name=\"userimage\"\
    \ type=\"file\" />\n    <br>\n    <input type=\"submit\" value=\"Upload photo\"\
    \ name=\"send\">\n</form>\n```\n\n---\n\n**PHP 会话处理：**\n\n```php\n<?php\nsession_start();\n\
    $username = $_SESSION['username'];\necho \"Hello \" . $username;\n?>\n```\n\n\
