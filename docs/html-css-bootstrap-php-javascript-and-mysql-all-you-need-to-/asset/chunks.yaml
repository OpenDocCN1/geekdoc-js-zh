    # 什么是数据库及其用途


    什么是数据库？每当我们想要存储需要对其进行操作的数据时，就一定会用到数据库。数据库就像是包含我们要存储数据的容器。数据库不仅用于 Web，还用于使用各种编程语言（`visual
    basic`、`C`、`python`、`java`、`javascript` 等）创建的各种应用程序。


    数据库分为关系型和非关系型。在大多数情况下，使用的是关系型数据库，正如从术语中所能理解的那样，它们基于关系，特别是通过表与表之间的一对一、一对多、多对多关系相连接的关系表。


    现有的关系类型：


    ![](img/ebook_image_205181_f2cc5449993836ce.jpg)


    表通过键（Key）链接在一起，键可以是主键或外键。


    提醒您，主键必须是唯一的，并且能够标识我们所考虑的实体的单个实例。


    提醒您，一个表的主键可以成为另一个与其有关系之表的外键。


    要创建数据库，我们首先从包含所有所需数据的单个表开始，随后我们将删除各个表中的重复字段，因为这些字段在数据库中不应重复，可以通过简单的数据库查询检索到。


    关系型数据库及其关系表的示例（通过主键和外键链接）可以是员工工资表或产品仓库表，以及其他通过某些被标识为键的字段链接在一起的数据。例如，员工主数据表可以通过员工代码链接到工资单表，或者
    `Products` 表可以链接到 `Invoices` 表和 `Customers` 表，以此类推。


    在本项目中，数据库将仅用于在网站上插入我们选择的图像以及在首页插入新闻，因此它们将由仅包含主键的非关系表组成。具体来说，我们将有三个表：一个用于首页 (`index.php`)
    中包含的图像和新闻文本，一个用于服装系列，一个用于登录。在图像表中，我们将只有作为自动 `ID` 的主键和作为待插入图像数量的 `n`；而在新闻表中，我们将同时拥有由变量
    `n` 表示的图像及其相关文本。在最后的登录表中，我们拥有 `username` 和加密后的密码。


    # 使用 phpMyAdmin 创建和管理数据库


    数据库可以使用多种软件创建，包括 Office 应用程序 `Access` 或其他各类软件。可以在数据库上进行数据的插入、选择、修改和删除。查询关系型数据库的语言是
    `SQL`。


    为了管理数据库，我们可以从网络下载 `MySql`，或者下载包含 `MySql` 的软件包，例如用于 Web 的 `WAMP` 或 `XAMPP`（我们稍后会详细解释）。目前我们只需明确，这两个应用程序都包含
    `phpMyAdmin`。


    在我们的案例中，它们将被用于使我们的示例网站动态化，根据与用户的交互来改变数据，为此我们将使用 `phpMyAdmin`。


    提醒您，数据库也可以与 `WordPress` 配合使用。


    ## 数据库管理


    在这项工作中，我们不需要解决所有关于数据库的疑难问题，但我们打算对该主题进行初步介绍，这对于应用示例的目的极其有用。


    管理数据库必须使用 `MySql` 语言。查询是对数据库发出的请求，通过子句（clauses）来工作。


    使用 `SELECT` 子句，您可以选择数据库中选定表的记录：


    ```php

    $ query = "SELECT * FROM data WHERE id = 1";

    ```


    在这种情况下，因为我们输入了 `*`，所以将选择所有列。


    `DELETE` 子句删除选定的记录：


    ```php

    $ query = "DELETE FROM data_news WHERE id2 = ''$ i''";

    ```


    `UPDATE` 子句使用我们要插入的数据更新记录：


    ```php

    $ query = "UPDATE data_news set id2 = ''$ o'' WHERE id = $ id";

    ```


    所有这些子句都将包含在我们的数据库管理中。


    # 客户端和服务器端语言


    在编写网页时，需要同时使用服务器端和客户端语言。如果程序员没有预见到需要向连接到服务器本身数据库的服务器发送请求，那么客户端语言就足够了，例如在静态网站的情况下（`html`
    和 `javascript`）。相反，如果网站提供了对服务器端数据库的访问，从而使网络上的所有客户端都能访问，那么它必须用服务器端语言（如 `PHP`）编写。一个例子是使用
    `CMS` 创建动态网站或具有在线产品选择功能的电子商务网站。


    ## PHP


    `Php` 是一种用于创建动态网页的服务器端编程语言，诞生于 1994 年。随着管理 `CMS` 的 `WordPress` 采用 `PHP` 创建，它在全世界范围内传播开来。`PHP`
    解释器通过许可证免费分发。


    `Php` 是最著名的服务器端语言，因此用于与外部服务器通信。


    `php` 代码可以直接插入到 `html` 页面中，也可以单独保存为 `.php` 扩展名文件，但始终由以下符号标识：


    ```php

    <? php


    ?>

    ```


    `.php` 文件必须被包含在 `html` 页面中：


    ```php

    <? php


    include ("view-slider-home.php");


    ?>

    ```


    ## JavaScript


    `Javascript` 是一种用于网页事件相关脚本的客户端编程语言。通过 `javascript`，用户可以与网站进行交互，将网站从静态转变为动态。`javascript`
    的示例包括插入由用户选择执行操作的按键。一个允许用户选择语言的翻译器可能就是一个 `javascript` 程序。


    `Javascript` 是从上到下读取的，因此必须插入在代码的特定部分。它是一种解释型代码的例子，与编译型代码不同，后者由编译器处理，将编程语言翻译成机器语言。


    尽管 `javascript` 已经作为客户端语言存在多年，但现在有了 `NodeJS`，它将 `javascript` 转换为服务器端语言。这绝对将是下一本书的主题。


    `javascript` 代码可以嵌入在 `html` 网页中，也可以插入在单独的 `.js` 文件中并仅从 `html` 页面调用。


    它可以插入在页面的主体（body）中：


    ```html

    <script type = "text / javascript" src = "js / search.js"> </script>

    ```


    它可以插入在页面的特定部分，例如在 `bootstrap` 中：


    ```html

    <! - Javascript ->


    <script src = "js / jquery-1.11.1.min.js"> </script>

    <script src = "bootstrap / js / bootstrap.min.js"> </script>

    <script src = "js / bootstrap-hover-dropdown.min.js"> </script>

    <script src = "js / wow.min.js"> </script>

    <script src = "js / retina-1.1.0.min.js"> </script>

    <script src = "js / jquery.magnific-popup.min.js"> </script>

    <script src = "flexslider / jquery.flexslider-min.js"> </script>

    <script src = "js / jflickrfeed.min.js"> </script>

    <script src = "js / masonry.pkgd.min.js"> </script>

    <script src = "http://maps.google.com/maps/api/js?sensor=true"> </script>

    <script src = "js / jquery.ui.map.min.js"> </script>

    <script src = "js / scripts.js"> </script>

    ```


    提醒您，为了被识别为 `javascript` 代码，您必须插入 `<script> </script>` 标签。


    # 创建网站示例


