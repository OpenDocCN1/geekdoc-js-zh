    # Create the project


    Our example site concerns a clothing store with three stores in which to insert
    photos of the collections present in the various shops. The example is not an
    e-commerce, but only has to display the photos of the collections.


    Our goal in this example will be to insert images directly from the site with
    an encrypted password access via `phpMysql`, php and javascript.


    First of all we need to establish how many pages the site must consist of and
    which ones they must be (home, who we are, services or products and contacts).
    We can also decide to create a single scrolling page (One page website) or several
    split pages. For today''s habit of the user to scroll the social networks perhaps
    it would be better to create a "one page" website. If we then want to direct the
    user towards a specific action we will create a landing page (landing page) these
    are for example the pages directed by specific marketing campaigns.


    In our example we have decided to create four main pages with direct access from
    the main menu with the addition of two pages for the two collections (man and
    woman) and three pages for the shops with access from submenus in the main navigation
    bar.


    In this phase we can both write the main characteristics, which the various pages
    must have, and draw the graphics of the pages themselves on some sheets. You could
    also create a mockup (template) of the page graphics to understand what to change
    in the project.


    # Use Notepad


    We have already mentioned that all files for the web in html, javascript and php
    can be written easily with a simple notepad, the important thing is to save the
    file with the specific extension (`.html`, `.php`, etc.). Obviously in this case
    we must know very well the language we want to use, otherwise the file will not
    work. To overcome this problem we can use Notepad which, unlike a simple notepad,
    suggests us while we write the words contained in that language to avoid code
    writing errors.


    ![](images/ebook_image_205181_21fede7b73179a10.jpg)![](images/ebook_image_205181_1199a514666053f0.jpg)


    # Create the pages


    In this phase of the project we can choose whether to independently create the
    pages in html or use various types of resources from the internet such as the
    already created Bootstraps that we will have to modify according to our needs.


    We have already explained previously the difficulties and time needed to create
    a CSS that is congruent with the specific needs required by the market today as
    dynamic and responsive sites. This is why in this work aimed at teaching and especially
    at the creation of a dynamic menu for inserting images, we have decided to use
    resources already available for free on the internet.


    As we will see later in this first moment of page creation, we will write all
    the main pages in html code and as we progress in the work we will realize what
    usefulness to deepen with the javascript and php languages ​​and then save some
    pages in php because they contain code php.


    # Change the layout of the pages


    After creating the main pages we will dedicate ourselves to adapting the pages
    to the needs of the site we intend to create. In this phase we must understand
    what the site will have to do, how it will have to interact with the user and
    what information we want to enter and give to the user by selecting those that
    will be displayed statically from those that will be chosen by the user dynamically.


    In this phase we realized that the collections of our example site had to be updated
    easily by a common user who owned the site who did not know the programming codes
    at all and who had to update the photos of the site.


    This is where the need arose to create a menu with personal access for inserting
    images in the relative web pages via javascript and php. This is the goal of this
    study and will be explained in the next paragraphs.


    # Choose images and colors


    The images and colors chosen for a website can make the difference for a website
    as well as for any other design product. Web design was born for this reason,
    so if you want a professional level design you have to go to a professional. In
    case you want to do it all yourself, you can choose a bootstrap or a model already
    made and change something to customize it. And if you are a CSS expert you can
    create your site from scratch to your liking by also seeing some sites you like
    on the internet.


    ## Free and paid images


    There are various sites on the internet to download free or paid images.


    [https://www.pinterest.it/pxhere/](https://www.pinterest.it/pxhere/)


    [https://pixabay.com/](https://pixabay.com/)


    There are also various applications on the Google play store such as:


    *   free images;

    *   pixabay.


    I recommend that you insert sliders and images relevant to the subject of the
    site and color them to attract attention, but avoiding disturbing colors.


    The sliders are long images that slide to give movement to the site. These can
    be inserted by the CSS. In our example we have decided to insert the sliders.


    ## Images created specifically for the site


    We can also create images ourselves through the means that the internet makes
    available to us to create or modify images such as:


    *   Photoshop;

    *   Gimp.


    In this case we can take photos and modify them with these software and then insert
    them on our site.


    ***I remind you to be very careful about the resolution of the images to be inserted.
    The larger the files, the longer it will take to load the site. I also recommend
    that you save them with the save for web function.***


    There are also some mobile applications, very useful for this purpose, such as:


    *   Adobe Draw;

    *   Picsart.


    # Use XAMPP OR WAMP in Windows to manage websites locally


    It is very useful for a programmer to test the functioning of the sites before
    they are published.


    For this purpose we can use free software packages available on the internet such
    as WAMP or XAMPP. We can see these software as local web simulators.


    XAMPP stands for cross-platform (multiplatform), apache, MySql and php and perl.
    Let''s say that between XAMPP and WAMP there is not much difference. Apache is
    a local web server for testing the website project without going to the web. MySql
    is used to create and manage databases. To open MySql we need to install php.


    We may not even use XAMPP or WAMP, but in this case we will not be able to interact
    with the databases and see the functioning of programs written in PHP and Javascript
    locally.


    It follows that if we have not provided any type of interaction with the user
    on our site, we can easily view the pages with the chosen browser without downloading
    any type of simulator such as WAMP by simply clicking on the html pages.


    XAMPP is cross-platform and also supports PERL, while WAMP only supports MySQL,
    PHP and Apache and only works on Windows.


    ***I remind you that WAMP is the Windows stack, but that there is also LAMP for
    Linux and the version for MAC which is called MAMP.***


    ## What is WAMP and how it works


    In this work to test our example site we decided to use WAMP as a Windows stack.
    WAMP is the acronym that derives from Windows, Apache, Mysql and PHP. The software
    package is called WampServer and is free.


    ## Download and install WAMP


    After searching the internet for WAMP, the package will be installed. There are
    various sites from which you can download WAMP for free.


    At the end of the installation, the `wamp` folder will appear in the `C:` folder
    of our computer.


    Wamp will also install other software useful in programming such as Notepad.


    ## Use WAMP


    After installing the WAMP software we will have the following folder in `C:`:


    ![](images/ebook_image_205181_6175e09d1dc215a6.jpg)


    To enter the simulator we have to click `wampmanager.exe`, while if we want to
    create a site or transfer the folders of a site already created in WAMP, click
    on the `www` folder and import the site files we need.

