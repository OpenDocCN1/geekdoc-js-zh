    \         print $tooBig;\n        } else {\n            doUpload($file, $upload_dir);\n\
    \        }\n    } else {\n        print $wrongExt;\n    }\n} else {\n    print\
    \ $noSubmitSend;\n}\n\nfunction doUpload($file, $upload_dir) {\n    global $thatsAll;\n\
    \    $filename = $_FILES['userimage']['tmp_name'];\n    $realname = $_FILES['userimage']['name'];\n\
