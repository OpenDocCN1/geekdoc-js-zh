    # Dynamic and static sites


    Static sites are the sites that in past years represented most of the sites on
    the internet. Today the situation is changing dramatically and static sites are
    in less and less quantity.


    The static site is the simplest to create and provides an unchanged site up to
    the changes made by the programmer through code. The dynamic site is more sophisticated
    and requires level programming within the site pages both of the client and server
    type. The dynamic site allows the user to interact with the site by making queries
    to the underlying databases and connected to the site itself through a scripting
    present within the code.


    Examples of dynamic sites are:


    *   e-commerce with the choice of products in real time

    *   social


    These sites provide for continuous updating implemented through interactions with
    the user.


    # Responsive and Bootstrap sites


    Responsive means reactive which in IT jargon means adaptable. A site is identified
    as responsive when it can be viewed on all types of devices without detecting
    any display problems, adapting perfectly to each individual device by automatically
    resizing and arranging all its parts in the best possible way.


    In the past, since there were not many types of devices, the sites could only
    be made for the PC and we did not remotely think of responsive sites, but now
    it has become an essential requirement for the creation of websites.


    To start we can say that making a site fully responsive is a difficult job. We
    can say that if we think in percentages and not in pixels in the style sheet and
    if we insert in the html code of the page:


    `<meta name = "viewport" content = "width = device-width, initial-scale = 1">`


    This adapts the page to the surface of the device, but the important thing is
    to think in percentage terms in the style sheet.


    However, given the difficulties inherent in making a site responsive, if you do
    not want to waste time and are not experts in CSS and html, it is better to use
    the resources on the internet as we will do in this book to devote ourselves to
    programming. Resources can be Bootstrap and Wordpress.


