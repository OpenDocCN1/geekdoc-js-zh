  trans: "\n# PHP 源代码片段排版\n\n## 数据新闻处理逻辑\n```php\n$ query = \"DELETE FROM data_news\
    \ WHERE id2 = '$ i'\";\n$ result = mysql_query ($ query);\n\n// check the outcome\n\
    if (! $ result) {\n    die (\"Error in query $ query:\". mysql_error ());\n}\n\
    \n// $ query = \"ALTER TABLE data_news AUTO_INCREMENT = $ i\";\n\n/*\n// get the\
    \ autoincrement id generated by MySQL for the new one\nrecord inserted using column\
    \ id with a prepared statement\n$ query = 'DELETE FROM data_news WHERE id =: id';\n\
    \nprepare the statement\n$ stmt = $ pdo-> prepare ($ query);\n\nexecute the statement\
    \ while setting the id prepared statement\n$ result = $ stmt-> execute (array\
    \ (': id' => $ id));\n\nif ($ result) {\n    echo 'Record Successfully Deleted';\n\
    }\n*/\n\n$ query = \"SELECT * FROM data_news ORDER BY 'id'\";\n$ ris = mysql_query\
    \ ($ query, $ connection) or die (mysql_error ());\n$ line = mysql_fetch_array\
    \ ($ ris);\n\n/* I collect the user ID */\n$ number = mysql_num_rows ($ ris);\n\
    $ i = 0;\n$ o = $ i + 1;\n\nif ($ number <1) {\n} else {\n    while ($ number>\
    \ $ i) {\n        $ id = mysql_result ($ ris, $ i, \"id\");\n        $ query =\
    \ \"UPDATE data_news set id2 = '$ o' WHERE id = $ id\";\n        $ result = mysql_query\
    \ ($ query);\n        // check the outcome\n        if (! $ result) {\n      \
    \      die (\"Error in query $ query:\". mysql_error ());\n        }\n       \
    \ $ i ++;\n        $ o = $ i + 1;\n    }\n}\necho '<script language = javascript>\
    \ document.location.href = \"insert photo.php\" </script>';\n?>\n```\n\n## 用户验证模块\
    \ (`verify.php`)\n```php\n<? php\n// filename: verify.php\nsession_start (); //\
    \ start the session\ninclude (\"connection_db.php\");\ninclude (\"config.php\"\
    );\n\n// I connect\nmysql_select_db (\"$ db_name\", $ connection);\n\n// POST\
    \ variables with anti sql Injection\n$ username = mysql_real_escape_string ($\
    \ _ POST ['username']); \n$ password = mysql_real_escape_string (sha1 ($ _ POST\
    \ ['password'])); \n\n$ _SESSION ['username'] = $ username;\n$ query = \"SELECT\
    \ * FROM login WHERE username = '$ username' AND password = '$ password'\";\n\
    $ ris = mysql_query ($ query, $ connection) or die (mysql_error ());\n$ line =\
    \ mysql_fetch_array ($ ris);\n\n/* I collect the user ID */\n$ cod = $ line ['username'];\n\
    \n/* I check */\nif ($ cod == NULL) $ found = 0;\nelse $ found = 1;\n\n/* Username\
    \ and password correct */\nif ($ found === 1) {\n    /* Log session */\n    $\
    \ _SESSION [\"authorized\"] = 1;\n    /* Register user code */\n    $ _SESSION\
    \ ['cod'] = $ cod;\n    /* Redirect to the reserved page */\n    echo '<script\
    \ language = javascript> document.location.href = \"insert photo.php\" </script>';\n\
    } else {\n    /* Wrong username and password, redirect to login page */\n    echo\
    \ '<script language = javascript> document.location.href = \"login.html\" </script>';\n\
    }\n?>\n```\n\n## 验证与图片展示 (`verify2.php`)\n```php\n<? php\n// filename: verify2.php\n\
