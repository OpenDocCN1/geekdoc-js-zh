    \        $newname = str_replace('', '_', $newname);\n        @move_uploaded_file($filename,\
    \ ($upload_dir . '/' . $newname));\n        print $thatsAll;\n    } else print\
    \ $wrongUp;\n}\n```\n\n## 脚本实现三：大文件上传与自动解压 (`upload-fullscreen-slider-STORE 2-archive.php`)\n\
    \n该版本针对压缩包上传进行了优化，放宽了 `$max_size` 限制，并允许 `.zip` 格式。\n\n```php\n// filename: upload-fullscreen-slider-STORE\
