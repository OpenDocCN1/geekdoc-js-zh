    Dear Customer,


    we wish to inform you that the Legislative Decree n.196 of 30.6.2003 ("Code regarding
    the protection of personal data") establishes that "Anyone has the right to the
    protection of personal data concerning him".


    In compliance with the law, NEGOZIO 1 Srl will treat all your data according to
    the principles of correctness, lawfulness, transparency and protection of your
    privacy and your rights.


    Pursuant to and for the purposes of Article 13 of Legislative Decree 196/2003,
    therefore, we provide you with the following information regarding your data:


    TYPE OF DATA: personal data and identification data (as defined in art.4).


    METHOD: organization of archives on paper and in a mainly automated form (in accordance
    with Article 11).


    NATURE: mandatory (data you provided for the aforementioned purposes) and optional
    (data you provided for other purposes not included in the previous list - for
    example e-mail - which will be used to send information material relating to the
    activities of STORE 1 Srl


    REFUSAL TO PROVIDE DATA


    Any refusal to provide personal data of a mandatory nature, as defined above,
    will make it impossible to accept the application for registration or the inclusion
    of the curriculum in the bulletin board. Any refusal to provide personal data
    of an optional nature, as defined above, does not entail any consequences in relation
    to the acceptance of the application for registration.


    DISSEMINATION: no external dissemination will be made to NEGOZIO 1 Srl.


    DATA CONTROLLER: NEGOZIO 1 Srl


    RESPONSIBLE FOR TREATMENT: NEGOZIO 1 Srl


    Finally, we remind you that you will be able to exercise all your rights pursuant
    to Legislative Decree 196/2003 and, in particular, request the owner to access,
    modify and update or delete your data. Furthermore, we remind you that, in the
    event of your refusal to consent to mandatory data, we will not be able to perform
    the tasks requested by you.


    The person in charge of the treatment


    SHOP 1 SRL


    </textarea>


