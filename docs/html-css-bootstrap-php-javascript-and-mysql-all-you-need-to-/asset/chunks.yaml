    <script type=\"text/javascript\" charset=\"utf-8\">\n$(document).ready(function\
    \ () {\n    $(\"a[rel^='prettyPhoto']\").prettyPhoto();\n});\n</script>\n<script\
    \ type=\"text/javascript\" src=\"numtot.js\"></script>\n```\n\n### PHP 会话与用户问候\n\
    \n```php\n<?php\nsession_start();\n$username = $_SESSION['username'];\necho \"\
    Hello \" . $username;\n?>\n```\n\n### 表单\n\n```html\n<form method=\"get\" action=\"\
    numtot-accessories-woman.php\">\n    <div id=\"search-bar\" class=\"clearfix\"\
    >\n        <input type=\"n3\" name=\"n3\" value=\"\" size=\"20\" onfocus=\"if(this.value==this.defaultValue)this.value='';\"\
    >\n        <input type=\"submit\" value=\"submit\" name=\"send\">\n    </div>\n\
    </form>\n\n<form enctype=\"multipart/form-data\" action=\"upload-fullscreen-slider-STORE\
    \ 1-archive.php\" method=\"post\">\n    <input name=\"userimage\" type=\"file\"\
    \ /><br>\n    <input type=\"submit\" value=\"Upload photo\" name=\"send\">\n</form>\n\
    \n<form enctype=\"multipart/form-data\" action=\"view-slider-STORE 1.php\" method=\"\
    post\">\n    <br><input type=\"submit\" value=\"View photo\" name=\"send\">\n\
    </form>\n\n<form enctype=\"multipart/form-data\" action=\"upload-fullscreen-slider-STORE\
    \ 1.php\" method=\"post\">\n    <input name=\"userimage\" type=\"file\" /><br>\n\
    \    <input type=\"submit\" value=\"Upload photo\" name=\"send\">\n</form>\n\n\
    <form enctype=\"multipart/form-data\" action=\"view-slider-STORE 1.php\" method=\"\
    post\">\n    <br><input type=\"submit\" value=\"View photo\" name=\"send\">\n\
    </form>\n\n<form enctype=\"multipart/form-data\" action=\"finegestione.php\" method=\"\
    post\">\n    <input type=\"submit\" value=\"END OF MANAGEMENT\" name=\"send\"\
