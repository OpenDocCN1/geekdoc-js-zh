    \ 框架，并使用了客户端和服务端编程。\n\n为了完成这个主题，我们解释了数据库以及 `phpMyadmin` 的工作原理。\n\n我们还学习了如何使用 `WAMP`\
    \ 在本地查看网站结果，并发现了如何将创建的网站带回托管服务器上。\n\n你现在准备好自己尝试创建你自己的动态网站了。\n\n"
