    \ 20};\ndocument.write(course.name.length);\nalert(course.name.length);\n```\n\
    \n# 对象方法：\n\n内部包含函数定义的属性称为对象方法。\n\n使用对象方法的语法如下：\n\n```\nobjectName.methodName()\n\
    ```\n\n如你所知，`document.write()` 会产生数据。实际上，`write()` 函数是 `document` 对象的一个方法。\n\n\
    ```\ndocument.write(\"some text\");\n```\n\n# 添加方法\n\n使用以下语法创建对象方法：\n\n```\nmethodName\
    \ = function() { code lines }\n```\n\n使用以下语法访问对象方法：\n\n```\nobjectName.methodName()\n\
    ```\n\n方法是属于对象的函数。可以使用 `(this)` 关键字进行引用。\n\n`(this)` 关键字被用作当前对象的引用，意味着你可以使用它访问对象的属性和方法。\n\
    \n方法的定义是在构造函数内部完成。\n\n# 例如：\n\n```javascript\nfunction person(name, age) {\n \
    \ this.name = name;\n  this.age = age;\n  this.changeName = function (name) {\n\
    \    this.name = name;\n  }\n}\n```\n\n```javascript\nvar p = new person(\"David\"\
    , 21);\np.changeName(\"John\");\n\ndocument.write(p.name);\n```\n\n在上面的示例中，我们为\
    \ person 定义了一个名为 `changeName` 的方法，它是一个函数，接受一个参数 `name` 并将其赋值给对象的 `name` 属性。`this.name`\
    \ 指对象的 `name` 属性。\n\n# 2.8 数组\n\n数组是 JavaScript 中用于存储项目集合的基础数据结构。它们是值的有序集合，每个项目都通过其在数组中的索引位置来标识。数组是多功能的，可以包含不同数据类型的元素，包括数字、字符串、对象甚至其他数组。\n\
    \n值集合被称为数组，它们经常被用于各种操作，包括：\n\n# 创建数组\n\n在 JavaScript 中创建数组有两种主要方式：\n\n- 使用字面量符号：\n\
    \  ```javascript\n  let fruits = [\"apple\", \"banana\", \"orange\"];\n  ```\n\
    - 使用 `new` 关键字：\n  ```javascript\n  let fruits = new Array(\"apple\", \"banana\"\
    , \"orange\");\n  ```\n\n# 访问数组元素\n\n数组元素通过索引位置访问，从 0 开始。示例：\n\n```javascript\n\
    let fruits = [\"apple\", \"banana\", \"orange\"];\nconsole.log(fruits[0]); //\
    \ 输出 apple\n```\n\n# 修改数组元素\n\n可以使用索引位置和赋值运算符 (=) 修改数组元素。\n\n```javascript\nnumbers[1]\
    \ = 10; // 将第二个元素改为10\n```\n\n# 数组操作：\n\n- 迭代：通过遍历数组执行特定操作。\n- 搜索：根据标准查找元素。\n\
    - 排序：将项目按特定顺序排列。\n- 过滤：根据标准选择部分。\n\n# 2.9 注释与代码结构\n\n注释和代码结构是编程的重要方面，确保了代码的可读性、维护性和协作。\n\
    \n# 注释\n\n注释是源码中的标记，解释器会忽略它们，不会影响程序的执行。它们为代码提供了说明和描述，使程序员更容易理解意图和目的。\n\n注释主要有两种类型：\n\
    \n- // 单行注释\n- /* 跨越多行的块注释 */\n\n# 注释的好处\n\n- 提高可读性：注释使代码更具解释性，增强编写者和其他程序员的理解。\n\
    - 增强可维护性：注释提供了上下文和解释，使未来修改、调试和更新代码变得更容易。\n- 促进协作：注释有助于工作在同一项目的程序员理解彼此的代码并进行有效协作。\n\
    \n# 测试：\n\n1. JavaScript 中变量的目的是什么？\nA. 执行数学运算\nB. 存储和管理数据\nC. 创建循环\nD. 定义 HTML\
    \ 元素\n\n2. 哪个关键字用于声明变量？\nA. let\nB. const\nC. var\nD. constant\n\n3. JavaScript\
    \ 中 `===` 运算符的作用是什么？\nA. 不进行类型转换的相等比较\nB. 执行赋值\nC. 进行类型转换的相等比较\nD. 检查变量是否为 undefined\n\
    \n4. 下列哪是 JavaScript 中声明数组的正确方式？\nA. let fruits = {\"apple\", \"banana\", \"orange\"\
