    \ `null`。\n\n`prompt()` 函数有两个参数。\n\n- 第一个是你希望显示在文本字段中的标签。\n- 第二个是可选的默认字符串，将显示在文本字段中。\n\
    \n```\nvar user = prompt(\"Please enter your name\");\n```\n\n```\nalert(user);\n\
    ```\n\n# 提示显示为：\n\n用户必须输入一个值，然后点击出现的提示框中的“确定”或“取消”以继续。这种方法使用户在框关闭之前无法访问网站的其他区域，因此不要频繁使用。\n\
    \n# 确认框（Confirm Box）\n\n当要求用户确认或批准某事时，经常会使用确认框。\n\n当确认框出现时，用户必须点击“确定”或“取消”以继续。\n\
