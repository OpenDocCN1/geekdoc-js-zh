    ```\n\n# 对象属性：\n\n你可以通过两种方式访问对象属性。\n\n```\nobjectName.propertyName\n```\n\n```\n\
    //or\n```\n\n```\nobjectName['propertyName']\n```\n\n# 示例：\n\n此示例展示了如何获取 person\
