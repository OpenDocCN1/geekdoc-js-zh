    be equal to 10, since that is the value with which the counter variable "i" finishes
    the loop.


    **40. EXPLANATION:** You need to notice that the last line contains an extra set
    of () after myFuncObjec[something]. If you solved the previous question, you already
    know its reason. Since each element of the myFuncObject array is essentially a
    function call, you need the () to carry out that function call. Each function
    call of the myFuncObject array returns 10 in the first option since myFunction
    is called every time, and the loop terminates with the counter variable set to
    10. For the second option, the scope of the counter variable is limited to the
    loop, and hence the ith element (or function call) of the array will store the
    value of i. Therefore, the output of myFuncObject[6]() will be 6 and not 7. The
    same logic applies to the third option, but since it runs till 9, the output of
    myFuncObject[7]() will be 7. Thus, the third option is the correct answer.


    **41. EXPLANATION:** Narrowing type-casting means explicitly converting from a
    larger variable type to a smaller variable type. Option A will convert the x/y
    result from double to int without any exceptions or errors and print the integer
    part of x/y.Here x=8 and y=5, so x/y=1.6. The output will be 1, the integer part
    only, and the digits to the right of the decimal point will be truncated. Option
    B will throw an error because we are trying to store x/y which is of type double
    in ''b'', which is of type int, without explicit type-casting.This is not allowed
    by the Java compiler. Option C is also incorrect since writing ''(double)'' before
    a variable on the left-hand side causes the compiler to fail in recognizing double
    as a valid variable type due to the presence of the parentheses.


    **42. EXPLANATION:** Initially, the while-loop is given a true condition in the
    form of the pre-initialized boolean variable1. The first if-condition'
