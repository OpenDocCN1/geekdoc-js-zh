  md: 'fails, and the program executes the else-statement, printing variable1 (which
    is set to ‘true’) and setting the value of x to that of y. Now, the condition
    for the while-loop is still true, so the loop runs again. However, this time,
    the values of x and y are the same, so the if-statement runs, printing variable2
    (which is set to ‘false’) and sets the value of variable1 to complement the condition
    ‘x==y’. Since x and y are now equal (equal to 4), variable1 is set to ‘false’.
    The execution now returns to the while-loop, which can no longer execute since
    variable1 is now ‘false’. Thus execution ends, giving the output given in option
    B.


    **43. EXPLANATION:** For the rest of the options, the program will read the statement
    as type void and cannot run since that is not allowed inside an if-statement or
    cannot compare void type with a boolean literal.


    **44. EXPLANATION:** Variables of type string can accept input only in double-quotes.
    Variables of type char cannot accept more than one character as input. Therefore,
    only option C follows the proper convention.


    **45. EXPLANATION:** Using double quotation marks means that the data type is
    String. Using a String as a type for adding the space ensures that the compiler
    reads the expression as a concatenation operation and displays the output as two
    double values with a single space between them. If single quotation marks are
    used, the data type is interpreted as ‘char’ and it is converted to its numerical
    equivalent, which in the case of space is equal to 32. So the output will be 1.0
    + 32.0 +1.2 = 34.2. Hence option C is the correct answer. Note that the value
    of space here is converted automatically to type double to carry out the addition
    operation.


    **46. EXPLANATION:** It’s a primarily straightforward equation within the brackets
    of the if-statement. The boolean expression evaluation gives the output as ‘true’
    for the necessary condition of the if-statement parameter. This executes the if-statement,
    giving the output shown in option A.'
