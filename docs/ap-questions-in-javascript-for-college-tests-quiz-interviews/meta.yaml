- md: " ## Россия\n\n## COMPUTER SCIENCE\n\nUNCOMMON QUIZ QUESTIONS IN JAVASCRIPT\
    \ FOR COLLEGE\n\n## 2022-2023\n\n- TEST\n- QUIZ\n- INTERVIEWS\n\n## Vol.3\n\n\
    - [x] Live AP Classes to Improve\n- [x] Learn & Grow with Community\n- [x] AP\
    \ Practice Tests with detailed Answer Explanations\n\nAUTHOR: Joseph Wobus\n\n\
    GET A 5 ON YOUR COMPUTER SCIENCE EXAMS\n\n---\n\n## AP QUESTIONS IN JAVASCRIPT\
    \ FOR COLLEGE TESTS-QUIZ-INTERVIEWS\n\nComputer Science (CS) questions are designed\
    \ to challenge the high school students pursuing AP computer science to excel.\
    \ The questions are given to test the fundamentals of Java, JavaScript, Python,\
    \ and object-oriented programming concepts. This volume is covering:\n\n- Loop\n\
    - Stack\n- Functions\n- Data Structure\n- Boolean Expression\n\n---\n\n## ACKNOWLEDGEMENT\n\
    \nPoccomu is incredibly indebted to a large number of Professors and Academicians\
    \ who have helped us in this project. You are also welcome to be part of Poccomu\
    \ if you are passionate about the uncommon question. Email us [info@poccomu.com](mailto:info@poccomu.com)\n\
    \n**Copyright © 2022 by Pal Consulting**\n\nAll rights reserved. No part of this\
    \ publication may be reproduced, distributed, or transmitted in any form or by\
    \ any means, including photocopying, recording, or other electronic or mechanical\
    \ methods, without the prior written permission of the publisher, except in the\
    \ case of brief quotations embodied in critical reviews and certain other noncommercial\
    \ uses permitted by copyright law. For permission requests, write to the publisher,\
    \ addressed \"Attention: Permissions Coordinator,\" at the address below.\n\n\
    4500 Stone crest Drive\nEllicott City, MD\nEmail: [info@poccomu.com](mailto:info@poccomu.com)\n\
    Visit: [https://poccomu.com](https://poccomu.com)\nPrinted in the United States\
    \ of America\n\n---\n\n## About The Authors\n\n### Joseph Wobus:\n\nJoseph Wobus\
    \ is a current software engineer in the United States. He graduated from University\
    \ of Maryland, College Park with a B.S. in Computer Science in 2020 (CS@UMCP is\
    \ among top 20 Computer Science Department in International ranking), and has\
    \ been working full time as a software engineer since then. He began coding since\
    \ early high school, and has since learned a multitude of languages such as Java,\
    \ Python, C++, C, JavaScript, and more.\n\nDuring his last 2 years of college,\
    \ he worked as a TA for one of the advanced CS courses and worked closely with\
    \ professors in assigning homework, grading tests, and assisting other students\
    \ debug code. In his free time, he enjoys playing basketball, playing PC games,\
    \ and going out with friends.\n\n### Dr. Biplab Pal:\n\nDr. Biplab Pal has a Ph.D.\
    \ in EE/ECE and MS/BS in Physics. He is CTO & Co-Founder of leading IoT and Healthcare\
    \ companies Machinesense and Opteev based out of Baltimore, Maryland. He holds\
    \ more than 30 US patents in IT/IoT/Sensor System areas.\n\nHe also serves as\
    \ an Adjunct Research Professor in Information Science at the University of Maryland,\
    \ at Baltimore Campus (UMBC).\n\n---\n\n## Table of Contents\n\n- [Tests/Quiz/Interviews:\
    \ Vol-03](#)\n- [Answers](#)\n- [Explanation](#)\n\n---\n\n## **DEDICATION**\n\
    \nPoccomu, in Latin, means uncommon. In this world of automation, artificial intelligence\
    \ (AI), and changing consumer preferences - the workplace is changing rapidly.\
    \ Are we preparing our next generation to handle those uncommon situations? Will\
    \ the new graduates be able to handle the uncertainty? Industry leaders are concerned\
    \ because the present-education system focuses on standardized testing and rote\
    \ learning, which is where POCCOMU comes in. Poccomu's methodology of logic-based\
    \ testing of STEM will help keep pace with the unique challenges at the workplace.\
    \ The idea of Poccomu is to push students to discover the power of their logical\
    \ thinking using the fundamental concepts they have learned in STEM coursework\
    \ when they encounter an uncommon problem. Poccomu is here to push students to\
    \ think out of the box to simplify and solve critical and distinctive problems.\
    \ Encouraging a young and motivated brain to think out of the box will help them\
    \ outperform in standardized tests and enhance their mental ability to solve the\
    \ most mysterious problem in their professional life.\n\n---\n\n## Tests/Quiz/Interviews:\
    \ Vol-03\n\n## LOOP, STACK, FUNCTIONS\n\n## DATA STRUCTURE, BOOLEAN EXPRESSION\n\
    \n1. Boolean is a binary logic data type that returns the result of comparisons\
    \ between two quantities. A JavaScript Boolean represents one of two values: true\
    \ or false. For the code given below, select the correct output from the options.\n\
    \n```\nvar x=2,y=3;\nvar variable1=true;\nvar variable2=false;\nwhile(variable1){\n\
    if (x===y){\nconsole.log(variable2);\nvariable1 = !(x===y);\n}\nelse{\nconsole.log(variable1);\n\
    x=y;\n}\n}\n```\n\n- A. True\n  False\n- B. True\n  True\n- C. False\n  True\n\
    - D. Infinite loop\n\n2. For the given code snippet, which makes use of Boolean\
    \ logic, identify the correct output from the given options:\n\n```\nvar bool1\
    \ = true, bool2 = true, bool3 = true;\nif(!(!bool1 || (bool2 && !bool3 || !(bool1\
    \ && bool2)))){\n    console.log(\"If-statement executed\");\n}\nelse{\n    console.log(\"\
    Else-statement executed\");\n}\n```\n\n- A. Else-statement executed\n- B. If-statement\
    \ executed\n- C. No output\n- D. Runtime Error\n\n3. **T** = **true** and **F**\
    \ = **false** for the given Boolean expression, and the tilde symbol (~) means\
    \ NOT (!). Fill in the missing part so that the expression evaluates to true.\n\
    \nEXPRESSION = ((~T OR F) AND (T AND ~F)) AND (MISSING PART)\n\n- A. (T AND T)\
    \ OR F\n- B. (T OR ~T) AND ~(T AND T)\n- C. F AND ~T\n- D. None of the above\n\
    \n4. Simplify the given Boolean expression using De Morgan's Laws (The single\
    \ quote symbol means complement/negation of that Boolean variable, the plus sign\
    \ is OR, and if rtc bvb rt c Hb rt c two Boolean variables, it means an AND operation\
    \ between them).\n\n(AB)' + (A'B')' + ((A+B)'(A+B))\n\n- A. 0\n- B. 1\n- C. A\n\
    - D. AB\n\n5. A Boolean expression, along with its solution, is given below. (The\
    \ single quote symbol means complement/negation of that Boolean variable. The\
    \ plus sign is OR, and if there is no symbol between two Boolean variables, it\
    \ means an AND operation between them). For each step in the solution, correctly\
    \ identify the property of Boolean Algebra that has been utilized to reach the\
    \ current step in the solution by matching it with the correct property from the\
    \ given list. The properties have been labeled in the solution with Roman numerals\
    \ in parentheses at the end of each line.\n\n```\n(A+B)' ((A+B)' + (A+B)) (A'+B')'\
    \ [ORIGINAL EXPRESSION]\n= (A+B)'(A'+B')' (I)\n= A'B'AB (II)\n= AA'BB' (III)\n\
    = 0 (IV)\n```\n\nList of properties:\n\n- a. Dominance\n- b. Identity\n- c. Idempotence\n\
    - d. De Morgan's Law\n- e. Absorption\n- f. Commutativity\n\nSelect the correct\
    \ combination from the following:\n\n- A. I-e, II-d, III-f, IV-c\n- B. I-a, II-d,\
    \ III-f, IV-b\n- C. I-d, II-a, III-e, IV-c\n- D. I-d, II-d, III-b, IV-a\n\n6.\
    \ Find the output of the given program by selecting the correct answer from the\
    \ given options. (Ignore any counter values and consider only the output logged\
    \ to the console.)\n\n```\nvar boolVarIn1 = true, boolVarIn2 = false, boolVarOut;\n\
    var num1 = 10, num2 = 15, i = 0;\nboolVarOut = ((num1!=num2)&&(boolVarIn1||!boolVarIn2)\
    \ ?\ntrue : false);\nwhile(i<3){\nif(boolVarOut){\nconsole.log(\"If-statement\
    \ printed\");\nboolVarOut= !boolVarOut;\n}\nelse{\nconsole.log(\"Else-statement\
    \ printed\");\n}\ni = i+1;\n}\n```\n\n- A. If-statement printed\n  Else-statement\
    \ printed\n  Else-statement printed\n- B. If-statement printed\n  Else-statement\
    \ printed\n- C. If-statement printed\n  If-statement printed\n  Else-statement\
    \ printed\n- D. None of the above\n\n## **7. From the different code snippets\
    \ given below, identify the ones which will execute correctly.**\n\n```\nI.  var\
    \ age = 22;\n    if(age>=18)\n        console.log(\"Eligible\");\n    else\n \
    \       console.log(\"Not Eligible\");\n```\n\n```\nII. var age = 22;\n    if(age>=18)\n\
    \        console.log(\"Eligible\");\n    else if(age<18)\n        console.log(\"\
    Not Eligible\");\n```\n\n```\nIII. var age = 22;\n     else if(age>=18)\n    \
    \     console.log(\"Eligible\");\n     else if(age<18)\n         console.log(\"\
    Not Eligible\");\n     else(age>100)\n         console.log(\"Out of bounds\");\n\
    ```\n\nSelect the correct option:\n\n- A. I, II, III\n- B. II only\n- C. I and\
    \ II\n- D. None of the above"
  mdcn: "\n## 俄罗斯\n\n## 计算机科学\n\n针对大学生的 JavaScript 非常规测验题\n\n## 2022-2023\n\n- 测试\n\
    - 测验\n- 面试\n\n## 第三卷\n\n- [x] 改进实时 AP 课程\n- [x] 与社区一起学习与成长\n- [x] 带有详细答案解释的 AP\
    \ 练习测试\n\n作者：约瑟夫·沃布斯\n\n在计算机科学考试中取得满分\n\n---\n\n## 针对大学考试的 JavaScript AP 测验题 -\
    \ 测验 - 面试\n\n计算机科学（CS）问题旨在挑战追求 AP 计算机科学的中学学生，要求他们表现出色。这些问题用于测试 Java、JavaScript、Python\
    \ 以及面向对象编程概念的基础知识。本卷涵盖的内容如下：\n\n- 循环\n- 栈\n- 函数\n- 数据结构\n- 布尔表达式\n\n---\n\n##\
    \ 致谢\n\nPoccomu 对许多帮助本项目的教授和学者感激不尽。如果您热爱非常规的问题，也欢迎您成为 Poccomu 的一员。请通过邮件联系我们 [info@poccomu.com](mailto:info@poccomu.com)\n\
    \n**版权所有 © 2022 by Pal Consulting**\n\n保留所有权利。未经出版商事先书面许可，本出版物的任何部分不得以任何形式或方式（包括\
    \ photocopying、录音或其他电子或机械方法）进行复制、分发或传播，但用于批评性评论中的简短引用以及根据版权法允许的其他某些非商业用途除外。如需申请许可，请致信出版商，并在以下地址注明“权限协调员”：\n\
    \n4500 Stone crest Drive\n马里兰州埃利科特市\n邮箱：[info@poccomu.com](mailto:info@poccomu.com)\n\
    访问：[https://poccomu.com](https://poccomu.com)\n美国印刷\n\n---\n\n## 关于作者\n\n### 约瑟夫·沃布斯：\n\
    \n约瑟夫·沃布斯是美国的现任软件工程师。他于 2020 年从马里兰大学主校区计算机学院（CS@UMCP 在国际排名中位于前 20 的计算机科学系）获得计算机科学学士学位，从那以后一直全职从事软件工程工作。他从高中早期就开始编写代码，此后学习了多种语言，如\
    \ Java、Python、C++、C、JavaScript 等。\n\n在大学的最后两年，他担任了一门高级计算机课程的教学助理，并与教授紧密合作，分配作业、批改考试和协助其他学生调试代码。在他的业余时间，他喜欢打篮球、玩\
    \ PC 游戏，以及与朋友外出。\n\n### Biplab Pal 博士：\n\nBiplab Pal 博士拥有电气/电子工程和物理学硕士/学士学位。他是位于马里兰州巴尔的摩的主要物联网和健康保健公司\
    \ Machinesense 和 Opteev 的首席技术官兼联合创始人。他在 IT/IoT/传感器系统领域拥有超过 30 项美国专利。\n\n他还在马里兰大学巴尔的摩分校\
    \ (UMBC) 担任信息科学兼职研究教授。\n\n---\n\n## 目录\n\n- [测验/问卷/面试：第三卷](#)\n- [答案](#)\n- [解释](#)\n\
    \n---\n\n## **献辞**\n\nPoccomu 在拉丁语中意味着“非常规”。在这个自动化、人工智能 (AI) 和消费者偏好不断变化的世界——工作场所正在迅速变化。我们是否在为下一代准备好处理这些不寻常的情况？新毕业生能否应对不确定性？行业领导者对此表示担忧，因为现行的教育体系侧重于标准化测试和死记硬背，这正是\
    \ POCCOMU 发挥作用的地方。Poccomu 基于逻辑的 STEM 测试方法将有助于跟上工作场所的独特挑战的步伐。Poccomu 的理念是让学生发现他们的逻辑思维力量，使用他们在\
    \ STEM 课程中学习的概念遇到的不寻常问题。Poccomu 旨在促使学生跳出常规思维，简化并解决关键和独特的难题。鼓励年轻且充满动力的头脑跳出常规思维，将有助于他们在标准化测试中脱颖而出，并增强他们解决职业生涯中最神秘问题的能力。\n\
    \n---\n\n## 测验/问卷/面试：第三卷\n\n## 循环、栈、函数\n\n## 数据结构、布尔表达式\n\n1. 布尔是一个二进制逻辑数据类型，返回两个量之间比较的结果。JavaScript\
    \ 布尔类型代表两个值之一：真或假。对于下面给出的代码，从选项中选择正确的输出。\n\n```\nvar x=2,y=3;\nvar variable1=true;\n\
    var variable2=false;\nwhile(variable1){\nif (x===y){\nconsole.log(variable2);\n\
    variable1 = !(x===y);\n}\nelse{\nconsole.log(variable1);\nx=y;\n}\n}\n```\n\n\
    - A. 真\n  假\n- B. 真\n  真\n- C. 假\n  真\n- D. 无限循环\n\n2. 对于给出的代码片段，其中使用了布尔逻辑，请从给出的选项中识别正确的输出：\n\
    \n```\nvar bool1 = true, bool2 = true, bool3 = true;\nif(!(!bool1 || (bool2 &&\
    \ !bool3 || !(bool1 && bool2)))){\n    console.log(\"If-statement executed\");\n\
    }\nelse{\n    console.log(\"Else-statement executed\");\n}\n```\n\n- A. Else-statement\
    \ executed\n- B. If-statement executed\n- C. 无输出\n- D. 运行时错误\n\n3. **T** = **真**\
    \ 和 **F** = **假** 用于给定的布尔表达式，波浪号符号 (~) 表示 NOT (!)。填写缺失部分以使表达式求值为真。\n\n表达式 = ((~T\
    \ OR F) AND (T AND ~F)) AND (MISSING PART)\n\n- A. (T AND T) OR F\n- B. (T OR\
    \ ~T) AND ~(T AND T)\n- C. F AND ~T\n- D. 以上都不是\n\n4. 使用德·摩根定律简化给定的布尔表达式（单引号符号表示该布尔变量的补/非，加号是\
    \ OR，如果两个布尔变量之间没有符号，则表示它们之间的 AND 运算）。\n\n(AB)' + (A'B')' + ((A+B)'(A+B))\n\n-\
    \ A. 0\n- B. 1\n- C. A\n- D. AB\n\n5. 给出了一个布尔表达式及其解决方案。（单引号符号表示该布尔变量的补/非。加号是 OR，如果两个布尔变量之间没有符号，则表示它们之间的\
    \ AND 运算）。对于解决方案中的每一步，通过将其与给定列表中的正确属性匹配，正确识别已用于达到当前步骤的布尔代数属性。这些属性在解决方案的末尾每行末尾用括号标出了罗马数字。\n\
    \n```\n(A+B)' ((A+B)' + (A+B)) (A'+B')' [ORIGINAL EXPRESSION]\n= (A+B)'(A'+B')'\
    \ (I)\n= A'B'AB (II)\n= AA'BB' (III)\n= 0 (IV)\n```\n\n属性列表：\n\n- a. 优势律\n- b.\
    \ 恒等律\n- c. 幂等律\n- d. 德·摩根定律\n- e. 吸收律\n- f. 交换律\n\n从以下选项中选择正确的组合：\n\n- A. I-e,\
    \ II-d, III-f, IV-c\n- B. I-a, II-d, III-f, IV-b\n- C. I-d, II-a, III-e, IV-c\n\
    - D. I-d, II-d, III-b, IV-a\n\n6. 通过从给出的选项中选择正确答案，找出给定程序的输出。（忽略任何计数器值，仅考虑输出到控制台的内容。）\n\
    \n```\nvar boolVarIn1 = true, boolVarIn2 = false, boolVarOut;\nvar num1 = 10,\
    \ num2 = 15, i = 0;\nboolVarOut = ((num1!=num2)&&(boolVarIn1||!boolVarIn2) ?\n\
    true : false);\nwhile(i<3){\nif(boolVarOut){\nconsole.log(\"If-statement printed\"\
    );\nboolVarOut= !boolVarOut;\n}\nelse{\nconsole.log(\"Else-statement printed\"\
    );\n}\ni = i+1;\n}\n```\n\n- A. If-statement printed\n  Else-statement printed\n\
    \  Else-statement printed\n- B. If-statement printed\n  Else-statement printed\n\
    - C. If-statement printed\n  If-statement printed\n  Else-statement printed\n\
    - D. 以上都不是\n\n## **7. 从下面给出的不同代码片段中，识别哪些将正确执行。**\n\n```\nI.  var age = 22;\n \
    \   if(age>=18)\n        console.log(\"Eligible\");\n    else\n        console.log(\"\
    Not Eligible\");\n```\n\n```\nII. var age = 22;\n    if(age>=18)\n        console.log(\"\
    Eligible\");\n    else if(age<18)\n        console.log(\"Not Eligible\");\n```\n\
    \n```\nIII. var age = 22;\n     else if(age>=18)\n         console.log(\"Eligible\"\
    );\n     else if(age<18)\n         console.log(\"Not Eligible\");\n     else(age>100)\n\
    \         console.log(\"Out of bounds\");\n```\n\n选择正确的选项：\n\n- A. I, II, III\n\
    - B. 仅 II\n- C. I 和 II\n- D. 以上都不是\n"
