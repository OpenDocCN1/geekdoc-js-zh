  trans: "\n\n## 样式\n\n*   我将 `homePageLinks` 声明为父容器，并将其位置设置为 `relative`（相对）。我还为容器设置了高度和宽度，并设置了背景颜色。\n\
    \n```css\nbackground - color : color_name ;\n```\n\n*   我希望 `<ul>` 标签内的 `<li>`\
    \ 标签并排显示，而不是一个接一个。为了实现这一点，我将它的 `display` 属性设置为 `inline`。\n\n```css\ndisplay :\
    \ inline;\n```\n\n● 对于 `<a>` 标签链接，我设置了它的颜色并将文本加粗。\n\n```css\ncolor : color_name\
    \ ;\nfont – weight : bold;\n```\n\n`:hover` 选择器用于在用户鼠标悬停在元素上时更改颜色。代码 `a : hover\
    \ { color : black ; }` 指定了当用户将鼠标悬停在“登录”文本上时，将其颜色变为黑色。\n\n![](img/Image00016.jpg)\n\
    \n一切看起来良好。目前，我将只显示一个链接（登录），并将另一个链接（联系我们）移动到下拉菜单中。让我们创建一个位于首页中间的下拉菜单。创建下拉菜单的语法为：\n\
    \n```html\n<select><option value = “ val1 ”> Name_1 </option><option value = “\
    \ val2 ”> Name_2 </option>……</select>\n```\n\nHTML![](img/Image00017.jpg)\nCSS![](img/Image00018.jpg)\n\
    \n在上面的 HTML 截图中 ● 我创建了一个 `<div>` 区，并给了它 id `homePageDropdownMenu`。现在在那个 `<div>`\
    \ 容器内，我创建了一个 id 为 `dropDown` 的下拉菜单，当选择它的值时，它可以帮助我们导航到不同的页面。\n\n*   `<select>`\
    \ 标签内的 `<option>` 属于 CSS 类 `optionVal`。\n\n### CSS 中 id 和 class 的区别？\n\n1. 类选择器是以点（`.`）开头的名称，而\
    \ id 是以哈号（`#`）开头的。\n2. `id` 是唯一的，它只引用一个 HTML 元素。但类可以引用多个元素。\n\n在上面的 CSS 截图中 ●\
    \ 我将 `homePageDropdownMenu` 声明为父元素，并将它的 `position` 属性设置为 `relative`。我希望我的父元素对齐到页面中心，为了这一点，应该将\
    \ `margin-left` 和 `margin-right` 设置为 `auto`。\n\n```css\nmargin - left : auto;\n\
    margin - right : auto;\n```\n\n现在，我将 id 为 `dropDown` 的 `<select>` 标签相对于其父元素进行了定位。\n\
    \n```css\nposition : absolute;\n```\n\n● 在上面的 HTML 代码中，你会注意到以下这一行：\n\n![](img/Image00019.jpg)\n\
    \n*   `selected` 属性用于显示页面加载时出现在下拉菜单中的默认项。\n*   `disabled` 属性使该项变为禁用且不可点击。\n* \
    \  `hidden` 属性用于隐藏元素。\n\n由于这行代码，当页面加载时，我们的下拉菜单中会出现一个默认的空白项。现在让我们保存一切并用 Google\
    \ Chrome 打开 `index.html`。\n\n![](img/Image00020.jpg)\n![](img/Image00021.jpg)\n\
    \n一切看起来良好，但我们仍然无法导航到我在下拉菜单中选择的值对应的页面。为了实现这一点，需要 Javascript（请参阅第 2 章第 2.4 节）。现在让我们继续制作我们的登录、关于我们、创建配置文件和联系我们的\
    \ HTML 页面。\n\n## 1.2.2: 外部 CSS\n\n外部 CSS 中需要注意的关键点是：\n\n*   在外部 CSS 中，我们将 CSS\
    \ 代码写在一个单独的文件中并使用 `<link>` 标签将该文件与 HTML 文档链接。\n*   将 CSS 代码与 HTML 代码分离，使 HTML\
    \ 文档看起来更简洁、不复杂。\n*   外部 CSS 节省了时间并防止了在多个页面中重复编写相同 CSS 代码。\n\n现在让我们创建一个新文件，并将我的\
    \ CSS 文件命名为 `commonCss.css`。此 CSS 文件将包含所有四个页面（登录、创建配置文件、关于我们和联系我们页面）使用的样式信息。\n\
    \ncommonCss.css![](img/Image00022.jpg)\n\n为了将这些样式信息整合到我们的页面中，我们需要 `<link>` 标签，该标签应该存在\
    \ HTML 文档的 `<head>` 部分。\n\n![](img/Image00023.jpg)\n\n现在创建登录页面。登录页面将有两个输入字段，一个用于用户名，一个用于密码。\n\
    \n*   只接受文本值的 `<input>` 语法是：\n    ```html\n    <input type = \"text\" placeholder\
    \ = \" default_name \" name = \" name \" id = “ id ”>\n    ```\n*   只接受密码值的 `<input>`\
    \ 语法是：\n    ```html\n    <input type = \"password\" placeholder = \" default_name\
    \ \" name = \" name \" id = “ id ”>\n    ```\n*   提交按钮的 `<input>` 语法：\n    ```html\n\
    \    <input type = \"submit\" name = “ name ”>\n    ```\n*   单选按钮的 `<input>` 语法：\n\
    \    ```html\n    <input type = \"radio\" name = \" name \">\n    ```\n\nlogInPage.html![](img/Image00024.jpg)\n\
    \n从上面的 HTML 代码中，你会注意到输入字段存在 HTML 表格结构中。创建表格的语法为：\n\n```html\n<table>\n    <th>...</th>\n\
    \    <tr><td>...</td></tr>\n    <tr><td>...</td></tr>\n</table>\n```\n\n![](img/Image00025.jpg)\n\
    \n● <th> 代表表头\n● <tr> 代表行\n● <td> 代表数据\n\n在上面的 HTML 代码中，你会注意到存在 <a> 标签。什么是 <a>\
    \ 标签？<a> 标签在鼠标悬停在其上时出现。为了将 <a> 标签与其对应的输入字段连接，id 必须匹配。\n\n```html\n<h1 style =\
    \ “ Verdana; ” World</h1>\n```\n\n![](img/Image00026.jpg)\n\n一切看起来完美。请注意：我们将在第\
    \ 2 章创建其余页面。\n\n## 1.2.3: 内联 CSS\n\n内联 CSS 中需要注意的关键点是：\n\n*   在内联 CSS 中，使用 `style`\
    \ 属性向 HTML 元素添加样式信息。例如：\n\n```html\n<h1 style = “ Verdana; ”> World</h1>\n```\n\
    \n● 开发者通常避免内联 CSS，是因为：\n\n1. 它让 HTML 代码变得混乱且庞大。最佳实践是将内容与设计分离。\n2. 随着我们的 HTML 文档变得巨大，内联\
    \ CSS 变得难以维护。\n3. 它是耗时的。\n\n## 2 Javascript 简介\n\n关于 Javascript 的注意点是：\n\n1. Javascript\
    \ 是一种事件驱动的语言。当发生事件（如点击按钮或选择值）时，Javascript 代码就会触发并执行特定任务。任务通常写在函数内部。\n2. Javascript\
    \ 主要用于描述网页的行为。\n3. Javascript 代码应该写在 `<script>` 标签中，`<script>` 标签可以位于 HTML 文档的\
    \ `<head>` 部分或 `<body>` 部分。\n\n请注意：在本章中，我将介绍开发项目所需的 Javascript 重要话题。为了深入了解所有 Javascript\
    \ 话题，请访问 [`www.w3schools.com/`](https://www.w3schools.com/)\n\n### 2.1 Javascript\
    \ 变量\n\nJavascript 变量有声明方式：\n\n1. `var` 关键字\n2. `let` 关键字\n3. `const` 关键字\n\n\
    在上述三种中，开发者更倾向于使用 `let` 和 `const`。\n\n### 2.1.1 Var、Let 和 Const 关键字的区别\n\n![](img/Image00027.jpg)\n\
    输出![](img/Image00028.jpg)\n![](img/Image00029.jpg)\n![](img/Image00030.jpg)\n\n\
    **代码解释：**\n\n*   在上面的代码中，你会注意到 HTML 文档的 body 中包含一个名为 `click me` 的简单按钮。通过 Javascript\
    \ `onclick` 事件，点击按钮时会运行 `hello()` 函数。\n\n创建按钮的语法为：\n\n```html\n<button type=\"\
    button\"> Click Me </button>\n```\n\n什么是 Javascript `onclick` 事件？当用户点击元素时会发生 `onclick`\
    \ 事件。什么是 Javascript `alert()` 函数？`alert()` 函数用于在小弹出框中显示消息。\n\n*   `hello()` 函数存在于\
    \ HTML 文档 head 部分 `<script>` 标签内。在这个函数中，我们声明了两个变量 `x` 和 `word1`。\n\n"
- fmt: "\nWithin the `if` loop we declared another variable `word2`. Now when we run\
    \ our code, we get three outputs as shown in the screen shots above, one from\
    \ `word1` and others from `word2`. \n\nNOTE: Code written within curly brackets\
    \ `{ }` is referred to as Block . `word2` is declared within the `if` block of\
    \ codes and we see that it is accessible from outside the `if` block of codes.\
    \ This means that variables declared with `var` keyword does not have any Block\
    \ Scope. Now let’s run the same code by using `let` keyword.![](Image00031.jpg)Output![](Image00032.jpg)![](Image00033.jpg)![](Image00034.jpg)\n\
    \nNOTE: When we tried to access the `word2` variable from outside the `if` block\
    \ of codes, it returned an error saying “ `word2 is not defined ” . We were unable\
    \ to access `word2` from outside the `if` block of codes. This means that variables\
    \ declared with `let` keyword have Block Scope.\n\nThe difference between `var`,\
    \ `let`, `const` is:\n- `var` variables can be accessed from outside a block of\
    \ codes written within curly braces.\n- `let` variables cannot be accessed from\
    \ outside a block of codes written within curly braces.\n- Any variable declared\
    \ with `const` keyword means that its value is fixed or constant.\n\n## 2.2: Javascript\
    \ Data Types\n\nImportant points to note are:\n- In Javascript, the data types\
    \ are:\n    1. `Number`\n    2. `String`\n    3. `Object`\n- In Javascript, we\
    \ do not have to declare a variable’s data type like `int x = 10` or `string x\
    \ = “John”`. By simply assigning a value into a variable, Javascript will know\
    \ its data type.![](Image00035.jpg)Output![](Image00036.jpg)![](Image00037.jpg)![](Image00038.jpg)![](Image00038.jpg)\n\
    \n### What is Javascript typeof operator?\n`typeof` operator is used to get the\
    \ data type of a variable. In the above code, we see Javascript shows the datatype\
    \ of: `x` as `number` , `y` as `string` , `z` as `object` `a` as also `object`.\n\
    \n### What is Javascript Object?\nJavascript Objects are written with curly brackets\
    \ `{ }` and its properties are written as `name : value` pairs, separated by commas.\
    \ Example: `employee = {emp_id : 123 ,emp_name : “ John ”};`\n\n## 2.3: Javascript\
    \ Function\n\n- Javascript function is a block of code performing some task. The\
    \ syntax is :\n```javascript\nfunction function_name ( ) {………………..}\n```\n- The\
    \ code inside a function will get called when a Javascript event occurs, like\
    \ some button is clicked or an item from a list is selected.\n\nNow let’s create\
    \ the `createNewProfile.html` file of our Doggy Day Care Center project.`createNewProfile.html`\
    \ ![](Image00039.jpg)![](Image00040.jpg)![](Image00041.jpg)![](Image00042.jpg)CSS\
    \ code![](Image00043.jpg)![](Image00044.jpg)Let’s save everything and open the\
    \ HTML file with Google Chrome.![](Image00045.jpg)\n\n### Code Explanation\nWe\
    \ have discussed about `<input>` tags, `<label>` tags in pervious sections (chapter\
    \ 1, section 1.2.2 ). Now let’s discuss about `<form>` tag.\n\n#### What is <form>\
    \ tag?\nThe `<form>` tag is used to create an HTML form where a user can enter\
    \ data. The most important attribute of a `<form>` tag is its `action` attribute.\
    \ The action attribute contains a url and once the form is submitted, the form\
    \ data gets send to that specified url .\n\nThe two important form methods to\
    \ process data from one page to another are: `GET` and `POST`\n- `GET` – This\
    \ methods appends form data into the URL name. This makes the entire process risky\
    \ because if an user sends confidential information it will appear on the URL.\n\
    - `POST` – This method appends form data with the HTTP request and not with the\
    \ URL.\n\nIn the above HTML code, within the `<form>` tag, I have called an `onsubmit`\
    \ event and passed a function `createNewProfile( )` into it.![](Image00046.jpg)\
    \ The function `createNewProfile( )` executes once the form is submitted.\n\n\
    #### What is Javascript onsubmit event?\n`onsubmit` event triggers when a form\
    \ is submitted. Now let’s create the function `createNewProfile`. Javascript functions\
    \ should be written within `<script>` tags and the best practice is to write the\
    \ code separately at the end before closing of the `<body>` tag.![](Image00047.jpg)\n\
    \nThis function simply checks whether there is values present in `Username`, `Password`,\
    \ `Number of dogs` and `Monthly Fee` fields or not ( please refer to the above\
    \ HTML code for these fields ) . If no value is present then it throws an alert\
    \ .\n\nFew important points to note are:\n- In order to access value of an input\
    \ field by its `id`, the Javascript syntax is : `document.getElementById (“ id_name\
    \ ”).value`\n- In order to access value of an input field by its `class`, the\
    \ Javascript syntax is : `document.getElementsByClassName (“ class_name “).value`\n\
    - In order to convert a string value to integer valu e , `parseInt( )` function\
    \ is used.\n\n#### What is the difference between == and === comparison operators?\n\
    `==` is used to compare values between two variables.\n`===` is used to compare\
    \ both values and its data type.\n\nNow let’s create our Contact Us Page of our\
    \ project.`contactUs.html`![](Image00048.jpg)CSS code:![](Image00049.jpg)\nIn\
    \ the above HTML, we have used a new piece of code and that:\n```html\n<textarea\
    \ id = “ message ” name=” Text ” cols=” 100 ” rows=” 30 ” placeholder = “ Message\
    \ ”></textarea>\n```\n`<textarea>` tags are used to define multi-line text . Its\
    \ attribute `cols` is used to give width to the text area and `rows` is used to\
    \ give the number of lines in the text area. Now let’s save the HTML file and\
    \ open with Google Chrome![](Image00050.jpg)In the above HTML,\n- you will notice\
    \ the text is written within `<p>` tag and `p` stands for paragraph .\n- In About\
    \ Us page, we created an BACK button ![](Image00051.jpg) The above piece of code\
    \ means when the button is clicked go back to the previous page `onclick = “history.back()”`\
    \ .\n- The `history` object contains the list of previous urls visited by the\
    \ user.\n- The `back()` method loads the previous url in the history list.\n\n\
    ## 2.24: Javascript Events\nJavascript is an Event Driven Programming language\
    \ and its codes will run only if some event occurs. There are hundreds of Javascript\
    \ events , but the most commonly used events are:\n1. `onsubmit` (discussed in\
    \ section 2.3)\n2. `onclick` (discussed in section 2.1)\n3. `onchange` – As you\
    \ may recall in chapter 1, section 1.2.1, while designing our Home Page (`index.html`)\
    \ for the Doggy Day Care Center project, we created a drop down menu with the\
    \ help of `<select>` tag. The menu contained the paths to different HTML pages\
    \ given within the `<option>` tag, but the links did nothing when its values were\
    \ selected. In order to make the links functional, Javascript `onchange` event\
    \ is needed (please refer to the HTML code of drop down menu present in section\
    \ 1.2.1, chapter 1 ) .![](Image00054.jpg)\n\n- `window` refers to the browser\
    \ window.\n- `location` object represents the url of a page.\n- `href` property\
    \ is used to navigate to the provided url .\n- `this` keyword refers to the current\
    \ object which is executing.\n"
