    ## 第 1 章：HTML 和 CSS


    ### 1.1：HTML 和 DOM 简介

    #### 什么是 HTML？

    - `HTML` 代表超文本标记语言（Hyper Text Markup Language）。

    - `HTML` 元素用于设计网页，它们用开放标签和闭合标签表示。例如：开放标签 `<element_name>`，闭合标签 `</element_name>`。


    `HTML` 文档分为 `<head>` 和 `<body>`。

    - `<head>` 包含网页的所有信息。例如：`CSS`、`Javascript`、`meta` 数据。

    - `<body>` 包含网页的主要内容，并将显示给用户。


    #### 什么是 DOM？

    - `DOM` 代表文档对象模型（Document Object Model），定义了文档的逻辑结构。

    - 有数百个 `HTML` 标签。我们将查看其中几个。


    ### 1.2：级联样式表 (CSS) 简介

    `CSS` 代表级联样式表（Cascading Style Sheets），主要用于使 `HTML` 文档变得美观易读。如果有多个页面使用相同的样式信息，`CSS`
    帮助我们通过避免重复工作来节省时间。`CSS` 有三种类型：

    1. `内部 CSS`

    2. `外部 CSS`

    3. `内联 CSS`


    ##### 1.2.1：内部 CSS

    在 `内部 CSS` 中，`CSS` 代码和网页的主要内容存在同一个 `HTML` 文档中，并该页面提供样式信息。`CSS` 代码写在 `HTML` 文件
    `<head>` 部分的 `<style>` 标签内。


    现在让我们开始编写代码……我们将创建一个带有 `内部 CSS` 的 `HTML` 文档。打开 `Notepad` 或 `Notepad++` -> 创建新文件并保存为
    `index.html`。


    在书中，我将创建一个名为 `Doggy Day Care System`（狗狗日托系统）的项目。这是一个简单的项目，将包含首页、登录、新个人资料、关于我们等页面。随着我们将的进行，我们将把这个项目转换为
    `Django Web 应用程序`。现在让我们设计我们的首页 `Index.html`。


    在上面的示例中，我创建了一个网页并给它命名为 `Scrappy-Doo Day Care Center`。目前，该网页只包含一个标题，位于 `<div>`
    容器内，其 `id` 为 `homePageHeader`。


    为了给元素添加样式信息……


    #### 什么是 ID？

    `id` 用于唯一标识一个元素。


    #### 什么是 <div> 标签？

    `<div>` 标签用于定义网页的划分。


    #### 什么是 CSS 中的 ID？

    在 CSS 中，`id` 选择器用于选择特定的元素。


