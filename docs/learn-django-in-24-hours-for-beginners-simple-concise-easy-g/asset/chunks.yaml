    *   Python `for` 循环用于遍历数组、`list`、`tuple`、`dictionary` 或字符序列。

    *   `for` 循环会持续到给定变量的长度。示例：


    ```python

    cars = [“Kia”, “Toyota”, “Ford”]

    ```

    上述 `cars` 列表的长度为 3，因此循环将进行 3 次。首先它将获取索引为 0 的元素（“Kia ”）并通过向下遍历循环执行检查操作 -> 然后它会检查索引为
    1 的元素（“Toyota ”）并通过向下遍历循环执行检查操作 -> 然后它会检查索引为 2 的元素（“Ford ”）。语法为：`for each_element
    in elements :………`

