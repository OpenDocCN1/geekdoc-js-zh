    - `attrs` is used to store HTML attributes. Here, I passed an attribute stating
    that the form input field belongs to CSS class `fieldStyle` (present in `commonCss.css`).

    - `TextInput` allows entering any string value using an input box.

    - `PasswordInput` allows entering any password value using an input box.

