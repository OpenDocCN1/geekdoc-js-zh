    **Step 5**: After setting up the virtual environment, open command prompt -> navigate
    to above `Scripts` folder -> create the Django project by using the following
    command:

    ```

    django-admin startproject project_name

    ```

    (I named my project `project1`).![](Image00146.jpg)

    We see that Django created the project folder (`project1`) for us.![](Image00147.jpg)

    NOTE: All Django main projects reside within the `Scripts` folder.


    **Step 6**: Open the project folder (`project1`) and you will see the presence
    of `manage.py` file. This file is the most important file and is needed to run
    a Django project.![](Image00148.jpg)

    Now let’s run our first Django project (`project1`). Open command prompt -> navigate
    to the `project1` folder location where `manage.py` file is present -> run the
    following command:

    ```

    python manage.py runserver

