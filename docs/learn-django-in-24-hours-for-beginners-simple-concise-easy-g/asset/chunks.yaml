    #### Current Observations:

    You will notice two things after going through the code above and they are:


    - The page is styled in a table format.

    - The input fields belong to CSS class `fieldStyle` present in `commonCss.css`.


    If we follow the Django form steps in section 5.7 and simply plug in a variable
    containing all form fields, you will notice none of the table format and the CSS
    will load. In order to prevent that from happening, let’s manually and individually
    render Django form fields without disturbing the entire DOM structure of the HTML
    document.


