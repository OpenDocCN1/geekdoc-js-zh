    ### 步骤 3：创建 templates 文件夹

    在 `templates` 文件夹内创建一个与应用同名的文件夹，并将 Doggy Day Care 项目的所有 HTML 文件粘粘贴到其中。


    ### 步骤 4：更新 urls.py

    现在让我们进入应用 (`doggyDayCareCustomerInterface`) 的 `urls.py` 文件，并添加以下代码：

    ```

    urls.py

    ```


    ### 步骤 5：更新 views.py

    打开应用 (`doggyDayCareCustomerInterface`) 的 `views.py` 文件，并添加以下代码：

    ```

    views.py

    ```


    #### 代码解释

    * 在 `urls.py` 文件中，`path("", views.index, name="index")` 没有任何路由名称。这意味着当没有路由名称时，它将直接执行
    `views.py` 文件中的 `index` 函数。`index` 函数向用户返回 `index.html`（Doggy Day Care 项目的首页）文件。

    * 在 `urls.py` 文件中，`path("logInPage", views.logInPage, name="logInPage")` 拥有 `logInPage`
    路由名称和 URL 名称。这意味着当路由名称为 `logInPage` 时，将执行 `views.py` 文件中的 `logInPage` 函数。`logInPage`
    函数向用户返回 `logInPage.html`（Doggy Day Care 项目的登录页面）。


    ### 步骤 6：更新 index.html

    打开 Doggy Day Care 项目的 `index.html` 文件（在第 1 章 1.2.1 节创建） -> 注意到 HTML 的 `href` 属性提供了一个硬编码路径，这将引导我们进入登录
    HTML 页面。现在删除旧路径并在 `href` 属性中提供来自 `urls.py` 文件的 URL 名称 `logInPage`。


    在 HTML 文件添加来自 `urls.py` 文件的 URL 名称的语法是 `{% url ''url_name'' %}`。什么是 `{% %}`？`{%
    %}`称为 Django 标签（Template Tags）。它们主要用于 HTML 文档内部：

    1. 加载某些外部信息。

    2. 执行循环或逻辑。


    当用户点击首页上的登录按钮时，`href` 属性引导我们进入 URL 名称 `logInPage`。请求进入 `urls.py` 文件，它会在其中查找 URL
    名称为 `logInPage` 的路径。现在通过此名称的帮助，它进入 `views.py` 文件中关联的函数 `logInPage`。函数 `logInPage`
    向用户返回登录页面（请参考上面的代码）。


    ### 步骤 7：运行项目

    让我们运行项目并检查从首页到登录页的导航是否执行正常。

    打开命令提示符 -> 导航到主项目 (`project1`) 所在的目录（存在 `manage.py` 文件），并运行以下命令：

    ```bash

    python manage.py runserver

    ```

    打开浏览器 -> 访问 `http://127.0.0.1:8000/doggyDayCareCustomerInterface/`。现在点击登录按钮检查导航是否正常工作。


    导航运行完美。现在按照上述步骤操作，将 `index.html` 文件中的所有硬编码路径替换为 URL 名称。一切运行良好，但你会注意到一个巨大的缺陷：你会发现加载的页面没有任何任何图像和
    CSS。所以，让我们在下一节中修复这个问题。


    ### 5.6：如何将 CSS 和图像等静态文件加载到我们的 Django 应用中

    在 5.2 节中，我们创建了应用 `doggyDayCareCustomerInterface` 并将其与主项目 `project1` 连接。

    在 5.3 节中，我们创建了它的模型或表。

    在 5.5 节中，我们学习了如何导航到不同的页面。


    现在让我们学习如何将图像和 CSS 加载到 `doggyDayCareCustomerInterface` 应用中。在开始之前，请注意第 1 章中我们已经为
    `index.html` 文件做了内部 CSS，外部 CSS 文件的文件名为 `common.css`。


    #### 步骤 1：配置设置

    打开主项目 (`project1`) 的 `settings.py` 文件。向下滚动找到 `STATIC_URL`。它表示类似 CSS、图像等静态文件存储在
    `static` 中。让我们创建 `static` 文件夹。


    #### 步骤 2：创建 static 文件夹

    打开应用文件夹 (`doggyDayCareCustomerInterface`) -> 创建名为 `static` 的新文件夹。


    #### 步骤 3：创建应用特定的文件夹

    在 `static` 文件夹内创建一个文件夹，名称应与应用相同。此文件夹将包含 `doggyDayCareCustomerInterface` 应用专用的所有静态文件。


    #### 步骤 4：添加资源

    将所有图像和 CSS 文件添加到 `static/doggyDayCareCustomerInterface` 文件夹中。


    #### 步骤 5：在 index.html 中加载静态

    打开 `index.html`（Doggy Day 项目首页） -> 在 `<head>` 部分写入以下代码：

    ```html

    {% load static %}

    ```

    然后使用语法添加静态文件：`{% static ''subdirectory/file_name'' %}`。


