    In the above highlighted query I am performing a `Join`, I access the `username`\
    \ field (present in `customer_information` models) from `dog_id` column and look\
    \ for a record whose `username = obj1`. Then I store the result of the query in\
    \ `val2`.\n\nCode explanation of function `customerProfile()` is present in sections\
