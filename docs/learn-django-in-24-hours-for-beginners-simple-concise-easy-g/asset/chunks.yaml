    Inside `doggyDayCareCustomerInterface` app folder look for `models.py` file.![](Image00174.jpg)


    ### Step 2

    Inside `models.py` we will create two model classes, `customer_information` and
    `dog_information`.![](Image00175.jpg)![](Image00176.jpg)

    - `models.IntegerField()` creates a column to store integer values.

    - `models.CharField(max_length=n)` creates a column to store character values,
    where `n` specifies the max length.

    Please Note: There are multiple model field, please visit Django documentation
    for Model field reference [https://docs.djangoproject.com/en/3.2/ref/models/fields/](https://docs.djangoproject.com/en/3.2/ref/models/fields/)

    - To establish relationship between the two models or tables, we used Foreign
    Key.![](Image00177.jpg)

    `on_delete = models.CASCADE` means that if the reference object is deleted, then
    also delete its associated records pointing to the reference object.

    NOTE: To add primary key to a particular field, set `primary_key` to `True`.

    Example: `name = models.CharField(max_length=50, primary_key=True)`


