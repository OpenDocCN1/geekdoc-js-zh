    \nIn `ID`, I am displaying the data from `dog_id` column which in turn will display\
    \ its associated data from only one column `customer_id` and this was possible\
    \ because of the presence of `__init__` function.![](Image00258.jpg)\n\n## 5.11\
    \ : Django Email Form\n\nWe created our `Contact Us` page in Chapter 2. Now let’s\
    \ follow the steps below and make our `contactUsPage.html` file Django compatible.\n\
    \n**Step 1:**\nOpen the `doggyDayCareCustomerInterface` app’s `index.html` (Home\
    \ page of Doggy Day Care project) file and give an `url` name (page navigation\
    \ discussed in section 5.5)![](Image00259.jpg)\n\n**Step 2:**\nOpen `urls.py`\
    \ file and create a path that will lead us to `contactUsPage` function present\
    \ in `views.py` file. `urls.py`![](Image00260.jpg)\n\n**Step 3:**\nOpen `views.py`\
    \ file and create the function `contactUsPage()`. This function will simply return\
    \ the `contactUsPage.html` page. `views.py`![](Image00261.jpg)![](Image00262.jpg)\n\
    \n**Step 4:**\nOur web page appeared without any styling information so let’s\
    \ load the styling information into our HTML file (discussed in section 5.6) `contactUsPage.html`![](Image00263.jpg)![](Image00264.jpg)\n\
    \n**Step 5:**\nNow let’s create the form. (Django form discussed in section 5.7,\
    \ 5.8 & 5.9)\nOpen `views.py` file -> create a new class which will contain all\
    \ the form fields of `Contact Us` page.![](Image00265.jpg)\nNow create the function\
    \ `contactUsPage` and pass the form fields into our `contactUsPage.html` file.![](Image00266.jpg)\n\
    \n**Step 6:**\nOpen `contactUsPage.html` file and render the form fields manually\
    \ (discussed in section 5.8).![](Image00267.jpg)\n\n**Step 7:**\nIn `contactUsPage.html`,\
    \ add `action` attribute to `<form>` tag. Once the form is submitted, it will\
    \ take us to `url` name `mail`. So let’s open our `urls.py` file and create a\
    \ path with the `url` name and route name as `mail` and which will lead us to\
    \ function `mail` present in `views.py` file. `urls.py`![](Image00268.jpg)\n\n\
    **Step 8:**\nOpen `views.py` file and create the function `mail()`. `views.py`![](Image00269.jpg)\n\
    \n### Code Explanation\n\nWe have already discussed lines of code from:\n```python\n\
    if request.method ===\"POST\":\nname = form.cleaned_data[\"name\"]\n```\n(discussed\
    \ in section 5.8, 5.9 and 5.10). Now let’s discuss the lines of code from:\n`email_from\
    \ = settings.EMAIL_HOST_USER`\n\nBut before we understand the above line of code,\
    \ let’s first open the main project (`project1`) folder and go to `settings.py`\
    \ file. In `settings.py` file, insert the following lines of code![](Image00270.jpg)\n\
    \n*   `EMAIL_BACKEND` contains the backend to use for sending emails. Its default\
    \ value is `'django.core.mail.backends.smtp.EmailBackend'`.\n*   `EMAIL_HOST`\
    \ contains the host to use for sending email. Its default value is `'localhost'`.\n\
    *   `EMAIL_HOST_USER` contains the account name from which we will send an email.\n\
    *   `EMAIL_HOST_PASSWORD` contains the password of the email account that we are\
    \ using to send emails.\n*   `EMAIL_PORT` contains the port used by the SMTP server.\n\
    \n**What is SMTP server?**\n`SMTP` stands for Simple Mail Transfer Protocol and\
    \ `SMTP` server helps to send and receive email between senders and receivers.\n\
    \n*   `EMAIL_USE_TLS` contains a Boolean value `true` or `false`. This setting\
    \ specifies whether to use an explicit TLS (secure) connection when talking to\
    \ the SMTP server.\n\n**What is TLS?**\n`TLS` stands for Transport Layer Security\
    \ that helps to encrypts data sent over the Internet to prevent malicious activities\
    \ by hackers.\n\n*   `EMAIL_USE_SSL` contains a Boolean value `true` or `false`.\
    \ This setting specifies whether to use an implicit TLS (secure) connection when\
    \ talking to the SMTP server.\n\n**What is SSL?**\n`SSL` stands for Secure Sockets\
    \ Layer. It helps to encrypt communication between a web browser and a web server.\n\
    \n**Please Note:** Between `EMAIL_USE_TLS` and `EMAIL_USE_SSL`, only set one of\
    \ those settings to `True`.\n\nNow let’s proceed with our code discussion from\
    \ line: `email_from = settings.EMAIL_HOST_USER`. This line means from `settings.py`\
    \ file access the `EMAIL_HOST_USER` value and store it in `email_from` variable.\n\
    \nPlease follow the screen shot below for code explanation![](Image00271.jpg)\
    \ `mail.html`![](Image00272.jpg)\n\n**What is Django mail?**\n`mail` function\
    \ is used to send mail. The syntax is:\n```python\nmail('Subject', 'Message',\
    \ 'from@example.com', ['to@example.com'])\n```\nThe subject (a string value) should\
    \ come first, then message (a string value), then from (a string value), then\
    \ recipient (a list of string value). Before using `mail` function we need to\
    \ import it from `django.core.mail` module as shown in the below![](Image00273.jpg)\n\
    \n**Step 9:**\nI would like to send and receive emails using Gmail. Since our\
    \ web application (Doggy Day project) is not a registered service so it falls\
    \ in the category of less secured app. In order to access Gmail through my web\
    \ application, we need to turn on less secure app.\nGo to your Google Settings\
    \ [https://myaccount.google.com/security](https://myaccount.google.com/security)\
    \ -> turn on Less secure app![](Image00274.jpg)\n**Please note:** Since we are\
    \ turning on less secure app I recommended not using your main Gmail account.\n\
    \n**Step 10:**\nNow let’s run our project. Now go to `http://127.0.0.1:8000/doggyDayCareCustomerInterface/contactUsPage`![](Image00275.jpg)![](Image00276.jpg)\
    \ The mail was sent successfully![](Image00277.jpg)\n\n## Important Info & Conclusion\n\
    \nDjango can be bit confusing, but it becomes lot easier to understand through\
    \ coding and lot of practice. In this book, we have converted our Doggy Day Center\
    \ project into Django Web Application. I have covered the Home Page, Log In Page\
    \ and the Contact Us page and would like to leave the Create New profile page\
    \ for you all to practice. Well, I can give three hints:\n\n*   The syntax for\
    \ inserting new data into a model is:\n    ```python\n    model_name(column1 =\
    \ \"data\", column2 = \"data\", column3 = 123)\n    ```\n    (stated in section\
    \ 5.3)\n*   `cleaned_data` attribute is used to access values from a form input\
    \ field. (please refer to previous sections)\n*   As you may recall, we created\
    \ few drop down lists with the help of `<select>` tag in `createNewProfile.html`\
    \ (code present in chapter 2, section 2.3). To create a similar drop down list\
    \ in Django form we should follow the steps below:\n\n    **Step 1:** Create a\
    \ list of choices. This list is a collection of tuples and these tuple is made\
    \ of key-value pairs.\n    Example: `STATE=[('cal', 'California'),('ny', 'New\
    \ York'),('tx', 'Texas')]`\n    **Step 2:** Then we pass the list of choices into\
    \ our Django form field for drop down menu.\n    Example: `state = forms.CharField(widget=forms.Select(choices=STATE))`\n\
    \n    `Select` allows selecting any string value from a list of choices.\n\n--------------------------------------\n\
    Always remember, the most important learning is Self-Learning..Wish you all the\
