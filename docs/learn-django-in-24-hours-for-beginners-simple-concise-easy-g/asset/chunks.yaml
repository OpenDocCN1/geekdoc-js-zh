    ### 4.3.1 : Python If ..Elif ..Else


    *   `if` `else` 代码块用于检查某些条件是否为真或假。如果满足条件，则执行 `if` 代码块；如果不满足，则执行 `else` 代码块。

    *   Python 中的 `elif` 意为 `else if`。


    语法为：`if condition :……..elif condition :……..else :…………`

