  trans: "\n\n在 `if` 循环中，我们声明了另一个变量 `word2`。现在当我们运行代码时，如上方的截图所示，我们得到了三个输出，一个来自 `word1`，其他来自\
    \ `word2`。\n\n注意：在花括号 `{ }` 内编写的代码被称为块（Block）。`word2` 是在 `if` 代码块内部声明的，我们看到它可以从\
    \ `if` 代码块外部进行访问。这意味着使用 `var` 关键字声明的变量不具有任何块作用域（Block Scope）。现在，让我们使用 `let` 关键字运行相同的代码。![](img/Image00031.jpg)输出![](img/Image00032.jpg)[](Image00033.jpg)!([](Image00034.jpg)\n\
    \n注意：当我们尝试从 `if` 代码块外部访问 `word2` 变量时，它返回了一个错误，显示“ `word2 is not defined ` ”。我们无法从\
    \ `if` 代码块外部访问 `word2`。这意味着使用 `let` 关键字声明的变量具有块作用域。\n\n`var`、`let`、`const` 之间的区别是：\n\
    - `var` 变量可以从花括号内编写的代码块外部进行访问。\n- `let` 变量无法从花括号内编写的代码块外部进行访问。\n- 任何使用 `const`\
    \ 关键字声明的变量意味着其值是固定的或常量。\n\n## 2.2: Javascript 数据类型\n\n需要注意的重要点是：\n- 在 Javascript\
    \ 中，数据类型有：\n    1. `Number`\n    2. `String`\n    3. `Object`\n- 在 Javascript\
    \ 中，我们不需要像 `int x = 10` 或 `string x = “John”` 那样声明变量的数据类型。通过简单向变量赋值，Javascript\
    \ 就会知道它的数据类型。![](img/Image00035.jpg)输出![](img/Image00036.jpg)[](Image00037.jpg)!([](Image00038.jpg)!([](Image00038.jpg)\n\
    \n### 什么是 Javascript typeof 运算符？\n`typeof` 运算符用于获取变量的数据类型。在上面的代码中，我们看到 Javascript\
    \ 显示了数据类型：`x` 为 `number`，`y` 为 `string`，`z` 为 `object`，`a` 也为 `object`。\n\n###\
    \ 什么是 Javascript 对象？\nJavascript 对象用花括号 `{ }` 表示，其属性以 `name : value` 对的形式编写，并用逗号分隔。示例：`employee\
    \ = {emp_id : 123 ,emp_name : “ John ”};`\n\n## 2.3: Javascript 函数\n\n- Javascript\
    \ 函数是执行某些任务的代码块。其语法为：\n```javascript\nfunction function_name ( ) {………………..}\n\
    ```\n- 当 Javascript 事件发生时，函数内部的代码会被调用，例如点击某个按钮或选择列表中的某项。\n\n现在，让我们为我们的狗狗日托中心项目创建\
    \ `createNewProfile.html` 文件。`createNewProfile.html` ![](img/Image00039.jpg)!([](Image00040.jpg)!([](Image00041.jpg)!([](Image00042.jpg)CSS\
    \ 代码![](img/Image00043.jpg)!([](Image00044.jpg)让我们保存一切并使用 Google Chrome 打开 HTML\
    \ 文件。![](img/Image00045.jpg)\n\n### 代码解释\n我们在之前的章节（第 1 章第 1.2.2 节）讨论过 `<input>`\
    \ 标签和 `<label>` 标签。现在让我们讨论 `<form>` 标签。\n\n#### 什么是 <form> 标签？\n`<form>` 标签用于创建一个\
    \ HTML 表单，用户可以在其中输入数据。`<form>` 标签最重要的属性是它的 `action` 属性。action 属性包含一个 url，一旦提交表单，表单数据就会发送到指定的\
    \ url。\n\n处理页面间数据的两个重要表单方法是：`GET` 和 `POST`\n- `GET` – 该方法将表单数据到 URL 名称中。这使得整个过程变得具有风险，因为如果用户发送机信息，它将出现在\
    \ URL 上。\n- `POST` – 该方法将表单数据随 HTTP 请求附加，而不是通过 URL。\n\n在上面的 HTML 代码中，在`<form>`\
    \ 标签内，我调用了 `onsubmit` 事件并向其传递了一个函数 `createNewProfile( )`![](img/Image00046.jpg)函数\
    \ `createNewProfile( )` 在表单提交时执行。\n\n#### 什么是 Javascript onsubmit 事件？\n`onsubmit`\
    \ 事件在表单提交时触发。现在让我们创建函数 `createNewProfile`。Javascript 函数应该写在 `<script>` 标签内，最佳实践是在关闭\
    \ `<body>` 标签之前单独编写代码。![](img/Image00047.jpg)\n\n此函数简单地检查 `Username`、`Password`、`Number\
    \ of dogs` 和 `Monthly Fee` 字段中是否存在值（这些字段请参考上方的 HTML 代码）。如果没有值，则它将抛出一个警报框（alert）。\n\
    \n几个需要注意的重要点是：\n- 为了通过 `id` 访问输入字段的值，Javascript 语法是：`document.getElementById (“\
    \ id_name ”).value`\n- 为了通过 `class` 访问输入字段的值，Javascript 语法是：`document.getElementsByClassName\
    \ (“ class_name “).value`\n- 为了将字符串值转换为整数值，使用了 `parseInt( )` 函数。\n\n#### == 和\
    \ === 比较运算符的区别是什么？\n`==` 用于比较两个变量的值。\n`===` 用于比较值及其数据类型。\n\n现在让我们为项目创建联系我们页面。`contactUs.html`![](img/Image00048.jpg)CSS\
    \ 代码![](img/Image00049.jpg)\n在上面的 HTML 中，我们使用了新的代码：\n```html\n<textarea id = “\
    \ message ” name=” ” cols=” 100 ” rows=” 30 ” placeholder = “ Message ”></textarea>\n\
    ```\n`<textarea>` 标签用于定义多行文本。其属性 `cols` 用于指定文本区域的宽度，`rows` 用于指定行数。让我们保存 HTML 文件并用\
    \ Google Chrome 打开![](img/Image00050.jpg)在上面的 HTML 中\n- 你会注意到文本写在 `<p>` 标签内，`p`\
    \ 代表段落\n- 在关于我们页面，我们创建了一个返回按钮![](img/Image00051.jpg)上面的代码意味着点击按钮时返回上一页 `onclick\
    \ = “history.back()” `\n- `history` 对象包含了用户访问过的 url 列表。\n- `back()` 方法加载历史列表中的上一个\
    \ url。\n\n## 2.24: Javascript 事件\nJavascript 是一种事件驱动语言，其代码只有在发生事件时才会运行。有很多 Javascript\
    \ 事件，但最常用的事件有：\n1. `onsubmit`（在 2.3 节中讨论）\n2. `onclick`（在 2.1 节中讨论）\n3. `onchange`\
    \ – 如你可能记得在第 1 章第 1.2.1 节为我们的狗狗日托中心项目设计首页（`index.html`）时，我们通过 `<select>` 标签创建下拉菜单。菜单包含`<option>`\
    \ 标签提供的不同 HTML 页面路径，但当选择这些值时，链接没有任何反应。为了让链接正常工作，需要 Javascript `onchange` 事件（请参考第\
    \ 1 章第 1.2.1 节中的下拉菜单 HTML 代码）。![](img/Image00054.jpg)\n\n- `window` 指向浏览器窗口。\n\
    - `location` 对象表示页面 url。\n- `href` 属性用于导航到提供的 url\n- `this` 关键字指向当前执行的对象。\n\n"
- fmt: "\nIt is the Javascript way of saying that if the value within the `<select>`\
    \ field changes then trigger the Javascript `onchange` event. `onchange` event\
    \ will take that url value (written within `<option>` tag ) and returns that page\
    \ to the user. 4. `onload` – `onload` event is an event which triggers when a\
    \ page or an image or a frame loads. Example:\n![](Image00055.jpg)\nOutput\n![](Image00056.jpg)\n\
    \n# Chapter 3: How to Mobile Optimize a website\n\nIt is very important to make\
    \ a website responsive, so that it loads perfectly in all devices. Now let’s open\
    \ the Home page of our Doggy Day Care Center project and shrink the window size\
    \ to check how it will appear on a mobile screen.\n![](Image00057.jpg)\nThe above\
    \ Home page not only looks messy but it is also unreadable. So for this reason\
    \ it is very important to make any website responsive.\n\n## 3.1: Three rules\
    \ to Mobile Optimize a website\n\nWe can make a website responsive by following\
    \ three simple rules:\n\n### Rule 1: Add responsive meta tag within `<head>` section\
    \ of a HTML document.\n![](Image00058.jpg)\n\n* `viewpoint` is the visible area\
    \ of a web page on any device.\n* `width = device-width` means set the width of\
    \ the web page to the device screen width.\n* `initial-scale = 1.0` sets the initial\
    \ zoom level to 1.0 when the page is first loaded.\n\n### Rule 2: Set the height\
    \ and width of the entire web page or any section with the web page in percentage\
    \ format like `100%`, `80%`, `50%` or `20%`. Try to avoid hardcoding height and\
    \ width values.\n\n### Rule 3: Use media queries. The syntax is:\n```css\n@media\
    \ (min-width : 600px ) {…write CSS properties within this media query when the\
    \ minimum width of the device is 600px….}\n@media (max-width : 600px ) {…write\
    \ CSS properties within this media query when the max width of the device is 600px….}\n\
    ```\nNOTE: Media query should be written within `<style>` tags, which in turn\
