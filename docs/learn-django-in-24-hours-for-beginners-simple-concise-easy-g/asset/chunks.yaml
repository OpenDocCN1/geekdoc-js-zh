    ![](Image00149.jpg)

    Open web browser and go to site highlighted in the screen shot above.![](Image00150.jpg)
    The installation works perfectly.


    ### 5.2 Django App


    App stands for Application. What is the difference between a Django project and
    a Django app?

    A project refers to the entire application all together, while an app refers to
    a sub module of the main project.

    Let’s take Amazon for example. Amazon is a huge company and it may be divided
    into multiple departments. One department may handle the Amazon Marketplace, other
    department may handle the Amazon KDP and so on. So in this case, Amazon Marketplace
    and Amazon KDP become apps or sub divisions of the big project Amazon.


    Now let’s create an app and connect it with our main project (`project1`).


    **Step 1**: Open command prompt -> since the app will reside within the main project
    (`project1`), we need to navigate to the project location -> now create a new
    app with the help of the command:

    ```

    python manage.py startapp app_name

    ```

    ![](Image00151.jpg) (I gave the name of my app `doggyDayCareCustomerInterface`).
    We see Django automatically creates the new app folder within the main project
    (`project1`).![](Image00152.jpg)


    **Step 2**: Now let’s connect our newly created app (`doggyDayCareCustomerInterface`)
    with the main project (`project1`). Open the `project1` folder which contains
    all the important Python files like `settings.py`, `urls.py` -> open `settings.py`
    file.![](Image00153.jpg)![](Image00154.jpg)

    In `settings.py`, add the newly created app (`doggyDayCareCustomerInterface`)
    into the list of `INSTALLED_APPS` and click save.![](Image00155.jpg)

    The connection between the app (`doggyDayCareCustomerInterface`) and the project
    (`project1`) is now established.


    ### 5.2.1 Django Architecture


    We have successfully created our new app (`doggyDayCareCustomerInterface`). Each
    app must contain the following:


    1. `urls.py` file – It contains the list of all urls present within the app.

    2. `views.py` file – It contains all the functions and classes which will perform
    tasks.

    3. `models.py` file – It contains the models or the database tables.

    4. `admin.py` file - It helps to register the models into Django Admin App.

    5. `templates` folder – It contains all the HTML files.

    6. `static` folder – It contains all the static files like CSS, Images and Javascripts.


    ![](Image00156.jpg)


    The Django process is very simple:


    1. A HTTP request from a user first goes to `urls.py` file where it looks for
    its associated url name and with that name finds its associated function which
    is present in `views.py` file.

    2. The function in `views.py` file throws the HTTP response (HTML file from `templates`
    folder) to the user.

