    \ : Django Admin App]\n- [5.5 : How to navigate to different pages of our project\
    \ using Django]\n- [What is {% …. %}?]\n- [5.6 : How to load static files like\
    \ CSS & Images into our Django App]\n- [5.7 : Django Form]\n- [What is {{ … }}?]\n\
    - [5.8 : Django Form with CSS & Rendering form fields manually]\n- [5.9 : Log\
    \ In Page Validation process]\n- [5.10 : Displaying data from multiple tables\
    \ or models into Web Page]\n- [5.11 : Django Email Form]\n- [What is Django send_mail\
    \ function?]\n- [Important Info & Conclusion:]\n\n## Chapter 1: HTML and CSS\n\
    \n### 1.1: Introduction to HTML and DOM\n#### What is HTML?\n- `HTML` stands for\
    \ Hyper Text Markup Language.\n- `HTML` elements help to design a web page and\
    \ they are represented with open and close tags. Example: open tag `<element_name>`,\
    \ close tag `</element_name>`.\n\n`HTML` document is divided into `<head>` and\
    \ `<body>`.\n- `<head>` contains all information about a web page. Example: `CSS`,\
    \ `Javascript`, `meta` data.\n- `<body>` contains the main content of the web\
    \ page which will be displayed to the user.\n\n#### What is DOM?\n- `DOM` stands\
    \ for Document Object Model which defines the logical structure of a document.\n\
    - There are hundreds of `HTML` tags. We will look into few ones.\n\n### 1.2: Introduction\
    \ to Cascading Style Sheets (CSS)\n`CSS` stands for Cascading Style Sheets and\
    \ is mainly used to make a `HTML` document pretty and presentable. If there are\
    \ multiple pages using the same styling information, `CSS` helps us save time\
    \ by preventing repetitive work. `CSS` is of three types:\n1. `Internal CSS`\n\
    2. `External CSS`\n3. `Inline CSS`\n\n##### 1.2.1: Internal CSS\nIn `Internal\
    \ CSS`, the `CSS` codes and main content of the web page are present within the\
    \ same `HTML` document and it provides styling information for that page. The\
    \ `CSS` codes are written within `<style>` tags in the `<head>` section of a `HTML`\
    \ file.\n\nNow let’s start coding.. we will be creating `HTML` document with `Internal\
    \ CSS`. Open `Notepad` or `Notepad++` -> Create a New File and save it as `index.html`.\n\
    \nIn this book, I will be creating a project called `Doggy Day Care System`. It\
    \ is a simple project which will contain a `Home Page`, a `Log In`, a new `profile`,\
    \ `About Us` pages. As we proceed further, we will be converting this project\
    \ into `Django Web Application`. Now let’s design our Home page `Index.html`.\n\
    \nIn the above example, I created a web page and gave it a title of `Scrappy-Doo\
    \ Day Care Center`. For now the web page only contains a heading which is present\
    \ within a `<div>` container whose `id` is `homePageHeader`.\n\nTo add styling\
    \ information to the `<body>` and the `<div>` container, go to the `<head>` section\
    \ -> within `<style>` tag call each `HTML` element by its name or `id` and give\
    \ the desired styling information within the curly brackets `{}`.\n\n#### What\
    \ is Id in CSS?\n`ID` helps to uniquely identify certain `HTML` elements. In order\
    \ to access the `id` of an `HTML` element within `<style>` tag, a hashtag `#`\
    \ symbol is used. Example: `#id_name`.\n\n#### What is <div> tag?\nThe `<div>`\
    \ tag defines a division or a section in an `HTML` document. It is a good practice\
    \ to divide different sections of a web page into different `<div>` containers.\n\
    - In the above screenshot, I added a background image to the `<body>` of the web\
    \ page. Its `CSS` code is: `background-image(\"picture_location\");`.\n- If we\
    \ want the background image to repeat itself and fill the web page then the `CSS`\
    \ code is: `background-repeat: repeat;`.\n- I have set the height and the width\
    \ of the `<body>` of the web page to `100%`.\n\nNote: It is very important to\
    \ set height and width of the `body` of a web page. This acts as a parent container\
    \ and helps to prevent layout shifts of different elements present within the\
    \ web page.\n\n- To access the `id` of the `<div>` element within the `<style>`\
    \ tag, `#` symbol is used. `margin-top` sets the top margin to the `<div>` container\
    \ to `50px`. `background-color` sets the color of the background of `<div>` container\
    \ to `white`. `font-family` sets the font used within the `<div>` container to\
    \ `Kristen ITC`. `text-align` sets the text used within the `<div>` container\
    \ to the right side of the container.\n\nNow let’s save `index.html` and open\
    \ with `Google Chrome`.\n\nEverything looks perfect, but now I would like to set\
    \ the heading of my web page at the bottom right corner of the `<div>` container.\
    \ To do that, let’s make some minor changes into our `index.html` file.\n- I declared\
    \ the `<div>` element with `id` `homePageHeader` as the parent container and set\
    \ its `position` to `relative`. `position: relative;`.\n- Then I declared the\
    \ `<h1>` tag as child element and set its `position` to `absolute`. `position:\
    \ absolute;`.\n\nNow the `<h1>` tag (child element) is positioned relative to\
    \ the parent element. We set the bottom of `<h1>` to `0px` and right to `20px`.\n\
    \nNote: In order to move a child element to the bottom, `top`, `left` or `right`\
    \ we need to declare a parent element and a child element by using `position`\
    \ properties.\n\nNow let’s save everything and open our web page.\n\nEverything\
    \ looks perfect. Now let’s proceed to adding a logo picture to our website.\n\n\
    The syntax for adding any image is `<img src=\"image_location\" alt=\"image_name\"\
    >`.\n- `alt` attribute is used to set an alternate text for the image in case\
    \ the image fails to load.\n- In the above piece of code we see that an `id` `logoPic`\
    \ is assigned to `<img>` tag and the image is placed within the parent container\
    \ with `id` `homePageHeader`.\n- I would like to set the logo picture on the left\
    \ hand side of its parent container and in order to do that we use `CSS` `float`\
    \ property. `float: left;`.\n\n#### What is float property?\nThe `CSS` `float`\
    \ property is used to place an element to the left or right of its parent container.\n\
    \nIt looks perfect. Now let’s create a list of links which will enable a user\
    \ to navigate to different pages. For now I will be creating two links, one will\
    \ lead us to a `Log In` page and the other link will lead us to a `Contact Us`\
    \ page.\n\nIn the above HTML code, we created another `<div>` parent element with\
    \ `id` `homePageLinks` which will store the list of links. To create any list,\
    \ `<ul>` and `<li>` tags are needed.\nThe syntax is:\n```html\n<ul>\n  <li>item\
    \ one</li>\n  <li>item two</li>\n</ul>\n```\n`<ul>` stands for unordered list\
    \ and each items within the list should be present within `<li>` tags.\nIn order\
    \ to make the links functional, `<a>` `href` attribute is needed. The syntax is:\n\
    ```html\n<a href=\"..url..\">link_name</a>\n```\n#### What is <a> tag and its\
    \ href attribute?\n`<a>` tag is used to define a hyperlink and its `href` attribute\
    \ specifies the url of the page the link goes to.\n"
