    # 第 3 章：如何对网站进行移动端优化


    让网站具有响应式非常重要，这样它在所有设备上都能完美加载。现在让我们打开我们的“狗狗日间中心”（Doggy Day Care Center）项目的首页，并缩小窗口大小以检查它在手机屏幕上的显示效果。

    ![](img/Image00057.jpg)

    上面的首页不仅看起来杂乱，而且无法阅读。因此，让任何网站都具有响应式是非常重要的。


    ## 3.1：移动端优化的三个规则


    我们可以遵循以下三个简单规则让网站具有响应式：


    ### 规则 1：在 HTML 文档的 `<head>` 部分添加响应式 meta 标签。

    ![](img/Image00058.jpg)


    * `viewpoint` 是网页在任何设备上的可视区域。

    * `width = device-width` 意味着将网页的宽度设置为设备的屏幕宽度。

    * `initial-scale = 1.0` 设置在首次加载页面时的初始缩放级别为 1.0。


    ### 规则 2：使用百分比格式（如 `100%`、`80%`、`50%` 或 `20%`）设置整个网页或网页任何部分的高度和宽度。尽量避免硬编码高度和宽度值。


    ### 规则 3：使用媒体查询。其语法为：

    ```css

    @media (min-width : 600px ) {…当设备最小宽度为 600px 时，在此媒体查询中编写 CSS 属性…}

    @media (max-width : 600px ) {…当设备最大宽度为 600px 时，在此媒体查询中编写 CSS 属性…}

    ```

    注意：媒体查询应该写在 `<style>` 标签内，而这些标签反过来应该存在于 HTML 文档的 `<head>` 部分中。


    现在让我们将这三个规则应用于“狗狗日间中心”项目的网页中。下面的截图显示了我们在第 1 章 1.2.1 节创建的 `index.html`（首页）文件的更新
    CSS 代码。

    ![](img/Image00059.jpg)![](img/Image00060.jpg)![](img/Image00061.jpg)


    现在让我们创建设备最大宽度为 600px 时的媒体查询：


    * 我想为 ID 为 `logoPic`、`homePageLinks` 和 `dropDown` 的元素添加一些额外的属性，这些属性只在设备最大宽度为 600px
    时才会显示。

    ![](img/Image00062.jpg)

    在上面的代码段中，我们通过 `opacity` 属性让 ID 为 `logoPic` 的 logo 图片变为透明。该属性用于使图像变透明。值越小，图像越透明。


    现在让我们创建设备最小宽度为 600px 时的媒体查询：


    * 在这里，我们为 ID 为 `homePageLinks`、`dropDown` 和 `homePageDropdownMenu` 的元素添加了一些属性，这些属性只在设备最小宽度为
    600px 时才会显示。

    ![](img/Image00063.jpg)


    现在让我们保存所有内容并用 Google Chrome 打开 HTML 文件（`index.html`）。

    ![](img/Image00064.jpg)

    首页是响应式的，看起来完美。


    请注意：也可以使用 Chrome 开发者工具来模拟移动设备的页面视图。更多信息请参阅此处- `https://developers.google.com/web/tools/chrome-devtools/device-mode`


    # 第 4 章：Python 编程简介


    Python 是最流行且使用最广泛的脚本语言。它的语法简单易用，为了便于编码而编写。


    ## 4.1：Python 安装


    **步骤 1**：访问 `https://www.python.org/downloads/` 并下载最新的最新 Python 版本。

    ![](img/Image00065.jpg)


    **步骤 2**：点击“自定义安装”（Customize installation）。

    对于下载的 Python，给出一个你自己的、短且易记的路径位置是非常重要的。这是因为我们在安装 Django 时将再次使用这个路径位置。

    ![](img/Image00066.jpg)


    **步骤 3**：点击“下一步”（Next）

    ![](img/Image00067.jpg)


    **步骤 4**：然后浏览你的安装位置。

    ![](img/Image00068.jpg)


    **步骤 5**：点击安装（install）

    ![](img/Image00069.jpg)


    **步骤 6**：现在进入控制面板 -> 系统和安全 -> 系统 -> 高级系统设置 -> 环境变量 -> 将 Python 安装位置添加到你的 `PATH`
    变量中。

    ![](img/Image00070.jpg)![](img/Image00071.jpg)


    **步骤 7**：打开命令提示符，通过 `python` 命令检查安装是否正确完成。

    ![](img/Image00072.jpg)


    现在让我们写代码吧..

    打开 Notepad++ 并创建一个新文件（`hello_world`），并以 `.py` 扩展名保存。

    ![](img/Image00073.jpg)

    在 `hello_world` 内部编写：

    ![](img/Image00074.jpg)


    什么是 `print()` 函数？它用于显示输出

    现在打开命令提示符，运行 `hello_world` 文件：

    ```bash

    python hello_world

    ```

    ![](img/Image00075.jpg)


    ## 4.2：Python 变量、运算符


    重要说明：


    * 变量用于存储数据。

    * 在大多数编程语言中，你需要声明变量。例如：

    ```python

    x = 5

    y = "John"

    ```

    ![](img/Image00076.jpg)

    输出

    ![](img/Image00077.jpg)


    什么是 `type()` 函数？它用于确定变量的类型。除了 `int`、`float` 和 `string`，Python 还有 `list`、`tuple`
    和字典。


    ## 4.2.1：Python 字符串


    重要说明：


    * Python 字符串是字符序列。

    * Python 字符串是不可变的，一旦创建就无法修改。


    什么是 Python 中的字符串切片？字符串切片是获取子字符串的过程。语法为：`string[start:stop:step]`


    示例：

    打开 Notepad++ 创建新文件并编写以下代码。

    ![](img/Image00078.jpg)

    现在运行这些代码：

    ![](img/Image00079.jpg)


    代码解释：

    让我们查看“Health is wealth”字符串。

    索引始终从 0 开始。H 位于索引 0，e 位于索引 1，a 位于索引 2，l 位于索引 3，t 位于索引 4，h 位于索引 5。然后空格位于索引 6。i
    位于索引 7，s 位于索引 8。再次空格位于索引 9。w 位于索引 10，e 位于索引 11，a 位于索引 12，l 位于索引 13，t 位于索引 14，h
    位于索引 15。


    在上面的代码段中，`message[2:12]` 的输出是从索引 2（包含索引 2 的值）到索引 12（不包含索引 12）：的 alth is we

    `message[:6]` 的输出是从开始（索引 0，包含值）到索引 6（不包含索引 6）：的 Health

    `message[7:]` 的输出是从索引 7（包含索引 7 的值）到结尾：is wealth


