    ### 5.2 Django App


    App 代表 Application（应用程序）。Django 项目和 Django App 之间有什么区别？

    项目指的是整个应用程序，而 App 指的是主项目的子模块。

    以 Amazon 为例。Amazon 是一家大公司，它可以被划分为多个部门。一个部门可能处理 Amazon Marketplace，另一个部门可能处理 Amazon
    KDP 等。因此，在这种情况下，Amazon Marketplace 和 Amazon KDP 就变成了大项目 Amazon 的 App 或子部门。


    现在让我们创建一个 App 并将其与我们的主项目（`project1`）连接。


    **步骤 1**：打开命令提示符 -> 由于 App 将位于主项目（`project1`）内部，我们需要导航到项目位置 -> 现在使用命令创建一个新 App：

    ```

    python manage.py startapp app_name

    ```

    ![](img/Image00151.jpg) （我将 App 命名为 `doggyDayCareCustomerInterface`）。我们看到 Django
    在主项目（`project1`）中自动创建了新 App 文件夹![](img/Image00152.jpg)


    **步骤 2**：现在让我们新创建的 App（`doggyDayCareCustomerInterface`）与主项目（`project1`）连接。打开包含
    `settings.py`、`urls.py` 等所有重要 Python 文件的 `project1` 文件夹 -> 打开 `settings.py` 文件![](img/Image00153.jpg)!(Image00154.jpg)

    在 `settings.py` 中，将新创建的 App（`doggyDayCareCustomerInterface`）添加到 `INSTALLED_APPS`列表中并保存![](img/Image00155.jpg)

    App（`doggyDayCareCustomerInterface`）与项目（`project1`）之间的连接现在建立。


    ### 5.2.1 Django 架构


    我们成功创建了新的 App（`doggyDayCareCustomerInterface`）。每个 App 必须包含：


    1. `urls.py` 文件 – 包含 App 内部所有的 URL。

    2. `views.py` 文件 – 包含执行任务的所有函数和类。

    3. `models.py` 文件 – 包含模型或数据库表。

    4. `admin.py` 文件 - 帮助将模型注册到 Django Admin App。

    5. `templates` 文件夹 – 包含所有的 HTML 文件。

    6. `static` 文件夹 – 包含所有的静态文件，如 CSS、图像和 JavaScript。


    ![](img/Image00156.jpg)


    Django 流程非常简单：


    1. 用户 HTTP 请求首先进入 `urls.py` 文件，在其中查找关联的 URL 名称并根据该名称找到位于 `views.py` 文件中的关联函数。

    2. `views.py` 文件中的函数向用户抛 HTTP 响应（来自 `templates` 文件夹的 HTML 文件）。


