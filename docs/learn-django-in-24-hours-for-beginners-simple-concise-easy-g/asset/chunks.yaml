  trans: "\n\n注意：如果我们想在 Django 表单字段中添加 JavaScript 事件，我们可以在 `attrs` 属性中添加。例如：`password\
    \ = forms.CharField (widget=forms.PasswordInput (attrs = { 'class' : 'fieldStyle',\
    \ 'onchange' : 'js_function_name( ) }))` \n\n现在在 `logInPage` 函数中，让我们将上述表单字段传递给变量\
    \ `form`，该变量将由 `logInPage.html` HTML 文件访问。`views.py`![](img/Image00242.jpg)\n\n\
    步骤 3：打开 `logIn.html` 文件 -> 在 `<input>` 标签的地方，我正在通过点运算符 `.` 手动渲染 Django 表单字段。`logIn.html`\n\
    \n注意：当手动渲染表单字段时，Django 不会自动生成对应的 `<label>` 标签。我们需要为相应的字段手动添加标签，为此需要使用 `Id_for_label`。如果我们正在手动为字段构建标签，则会使用\
    \ `Id_for_label`。\n\n保存所有内容并检查我们在 `logInPage.html` 中做的新更改是否正常工作。![](img/Image00218.jpg)一切看起来良好。让我们在下一节中继续执行验证过程。\n\
    \n## 5.9 登录页面验证过程\n\n在 5.3 节中，我们为 `doggyDayCareCustomerInterface` 应用创建了模型或数据库表。在\
    \ 5.8 节中，我们为登录页面创建了表单。现在让我们来执行验证过程。\n\n请注意，当表单从 `logInPage.html`（在 5.8 节中创建）提交时，它会将我们引导到下所示所示的\
    \ URL 名称 `customer`。![](img/Image00244.jpg)\n\n步骤 1：打开 `urls.py` 文件 -> 创建一个具有\
    \ URL 名称 `customer` 和路由名称 `customer` 的路径，它将指向 `views.py` 文件中的 `customerProfile`\
    \ 函数![](img/Image00245.jpg)\n\n步骤 2：打开 `views.py` 文件，让我们创建函数 `customerProfile`。该函数将接收来自用户的\
    \ `request`，检查输入的用户名和密码是否与其对应的数据库记录匹配，然后抛出响应![](img/Image00246.jpg)\n\n### 代码解释\n\
    \n在 5.7 节中，我们讨论了从 `if request.method ===\"POST\"` 到 `obj2 = form.cleaned_data[\"\
    password\"]` 的代码行。现在让我们讨论从行：`table_val = customer_information.objects.filter(username\
    \ = obj1, password = obj2).` 的代码![](img/Image00247.jpg)\n\n上述行代码是一个数据库查询，它在 `customer_information`\
    \ 模型或表中查找 `username = obj1` 且 `password = obj2` 的记录。我们都熟悉数据库选择查询，例如：`select *\
    \ from table_name where column_name = “value”`。但在 Django 中，上述选择查询的语法略有不同。上述选择查询的\
    \ Django 等效语句是：`table_name.objects.filter(column_name = “value”)`。\n\n你也可以使用 `get()`\
    \ 方法代替 `filter()` 方法。\n\n注意：`select * from table_name` 的 Django 等效语句是：`table_name.objects.all()`。\n\
    \n*   在上述代码段中，查询结果存储在变量 `table_val` 中。\n\n`customer_information` 存在 `models.py`\
    \ 文件中。要在 `views.py` 文件中访问该表，首先需要从 `models.py` 文件导入表![](img/Image00248.jpg)\n\n\
    请参考下面的截图进行逐行代码解释![](img/Image00249.jpg)\n\n简而言之这意味着：从上述查询获取数据并将其存储在变量 `table_val`\
    \ 中。如果存在值，通过 `first()` 方法获取第一行并将数据存储另一个变量 `row` 中。现在将该 `row` 变量传递另一个变量 `form`，该变量将被\
    \ HTML 文件 `customerProfile.html` 访问。如果表单有效，则执行上述步骤。现在如果表单无效，则重定向回 URL 名称 `logInPage`](Image00250.jpg)\n\
    \n要使用 `HttpResponseRedirect`，我们需要先导入它![](img/Image00251.jpg)\n\n现在在 `customerProfile.html`\
    \ 中，让我们显示来自 `customer_information` 模型或表的数据。`customerProfile.html`\n\n现在运行项目。打开命令提示符\
    \ -> 导航到主项目（`project1`）所在 `manage.py` 文件所在的文件夹位置 -> 使用以下命令运行项目：\n\n```bash\npython\
    \ manage.py runserver\n```\n\n打开 浏览器 -> 访问 `http://127.0.0.1:8000/doggyDayCareCustomerInterface/logInPage`](Image00253.jpg)![](img/Image00254.jpg)\n\
    \n验证工作运行完美。\n\n## 5.10 将多个表或模型的数据显示到网页\n\n在 5.3 节中，我们为 `doggyDayCareCustomerInterface`\
    \ 应用创建了模型。在 5.9 节中，我们学习了如何从一个表或模型向我们的网页显示信息。现在在这一节中，我们将学习如何从多个表或模型显示信息。\n\n需要注意的几个重要点：\n\
    \n*   我们都熟悉 `SQL Join`。`SQL Join` 有助于从多个表中检索信息。Django 也赋予我们从多个模型或表检索数据的能力，但语法不同。\n\
    *   在我们 `doggyDayCareCustomerInterface` 应用的 `models.py` 文件中，`dog_information`\
    \ 模型或表通过在 `dog_id` 列中声明的外键与 `customer_information` 模型或表连接。\n\n由于这种关系，`dog_id`\
    \ 列将显示来自 `customer_information` 模型所有列的相关数据。与其显示所有列的数据，我想显示来自单独一列 `customer_id`\
    \ 的数据，为此我们需要 `__init__` 函数（在第 4 章中讨论过的 `__init__` 函数）。所以让我们在 `customer_information`\
    \ 类中添加 `__init__` 函数\n\n*   打开 `models.py` 文件 -> 在类 `customer_information` 中声明\
    \ `__init__` 函数，它将在创建类对象时仅返回 `customer_id`。\n\n![](img/Image00255.jpg)什么是 `f“…”`？`f“…”`\
    \ 是 Python 格式化字符串字面量，它在 `{ }` 内包含表达式，这些表达式就是替换字段。\n\n*   现在让我们打开 `views.py` 文件并进入我们在\
    \ 5.9 节中创建的 `customerProfile( )` 函数。\n\n"
