    ## Chapter 5: Django


    Django is a free and open source high-level Python web framework that helps in
    the development of a website.


    ### 5.1 Django Installation


    **Step 1**: Open command prompt -> Go to the file location where Python folder
    is present (Python installed in Chapter 4, section 4.1 ) -> Go to `Scripts` folder.
