    *   在上面的示例中，在声明 `if` 代码行（第 2 行）后，我们进行了缩进并写了 `print("Output is Orange")`。这个缩进表示
    `print` 语句属于 `if` 代码块。接着在声明 `elif` 代码行（第 4 行）后，我们进行了缩进并写了 `print("Output is apple")`。这个缩进再次表示
