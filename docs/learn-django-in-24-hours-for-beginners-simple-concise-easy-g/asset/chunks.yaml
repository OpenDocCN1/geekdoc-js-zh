- fmt: "\n## Styling\n\n*   I declared `homePageLinks` as my parent container and\
    \ set its position relative . I also gave a height and width to the container\
    \ and set a background color .\n\n```css\nbackground - color : color_name ;\n\
    ```\n\n*   I would like `<li>` tag within the `<ul>` tag to be displayed side\
    \ by side instead of one after another. In order to do that I set its display\
    \ property to `inline`.\n\n```css\ndisplay : inline;\n```\n\n● For the `<a>` tag\
    \ links, I set its color and made the text bold.\n\n```css\ncolor : color_name\
    \ ;\nfont – weight : bold;\n```\n\n`:hover` selector is used to change color when\
    \ a user hovers over that element. The code `a : hover { color : black ; }` specifies\
    \ that turns the color of Log In text black when a user hovers the mouse over\
    \ it.\n\n![](Image00016.jpg)\n\nEverything looks good. For now I will be displaying\
    \ only one link (Log In ) and moved the other link (Contact Us ) to a drop down\
    \ menu. Let’s create a drop down menu which will be present in the middle of the\
    \ home page . The syntax for creating a drop down menu is :\n\n```html\n<select><option\
    \ value = “ val1 ”> Name_1 </option><option value = “ val2 ”> Name_2 </option>……</select>\n\
    ```\n\nHTML![](Image00017.jpg)\nCSS![](Image00018.jpg)\n\nIn the above HTML screen\
    \ shot ● I created a `<div>` section and gave an id of `homePageDropdownMenu`.\
    \ Now within that `<div>` container I created a drop down menu with id `dropDown`\
    \ which will help us to navigate to different pages when its value is selected.\n\
    \n*   The `<option>` within the `<select>` tag belongs to a CSS class `optionVal`.\n\
    \n### Difference between id and class in CSS?\n\n1. A class selector is a name\
    \ preceded by a full stop (`.`), whereas an id is preceded by hash sign (`#`).\n\
    2. An `id` is unique and it only refers to one HTML element. But a class can refer\
    \ to multiple elements.\n\nIn the above CSS screen shot ● I declared `homePageDropdownMenu`\
    \ as a parent element and set its position property to `relative`. I would like\
    \ my parent element aligned to the center of the page, in order to do that `margin-left`\
    \ and `margin-right` should be set to `auto`.\n\n```css\nmargin - left : auto;\n\
    margin - right : auto;\n```\n\nNow, I positioned `<select>` tag with id `dropDown`\
    \ relative to its parent element.\n\n```css\nposition : absolute;\n```\n\n● In\
    \ the above HTML code, you will notice the following line:\n\n![](Image00019.jpg)\n\
    \n*   `selected` attribute is used to display the default item which will appear\
    \ in the drop down menu when the page loads.\n*   `disabled` attribute makes that\
    \ item disable and unclickable.\n*   `hidden` attribute is used to hide the element.\n\
    \nDue to this line of code, a default blank item will appear in our drop down\
    \ menu when the page loads . Now let’s save everything and open `index.html` with\
    \ Google Chrome.\n\n![](Image00020.jpg)\n![](Image00021.jpg)\n\nEverything look\
    \ good, but still we are unable to navigate to different pages which I select\
    \ the values from the drop down menu. In order to do that Javascript is needed\
    \ (please refer to section 2.4 of Chapter 2 ) Now let’s proceed to making our\
    \ Log In , About Us , Create a New Profile and Contact Us HTML pages.\n\n## 1.2.2:\
    \ External CSS\n\nImportant points to note in External CSS are:\n\n*   In External\
    \ CSS, we write our CSS code in a separate file and link that file with our HTML\
    \ document using `<link>` tag.\n*   By separating the CSS code from HTML codes,\
    \ makes the HTML document look cleaner and less complicated.\n*   External CSS\
    \ saves time and prevents repetitive work of writing the same CSS code for multiple\
    \ pages.\n\nNow let’s create a new file and I named my CSS file `commonCss.css`.\
    \ This CSS file will contain the styling information used by all four pages (Log\
    \ In, Create a New Profile, About Us and Contact Us page ).\n\ncommonCss.css![](Image00022.jpg)\n\
    \nTo incorporate this styling information into our pages, we need `<link>` tags\
    \ and this tag should be present within the `<head>` section of a HTML document.\n\
    \n![](Image00023.jpg)\n\nNow let’s create the Log In page. The Log In page will\
    \ have two input fields, one for username and one for password .\n\n*   The `<input>`\
    \ syntax which will take only text value is:\n    ```html\n    <input type = \"\
    text\" placeholder = \" default_name \" name = \" name \" id = “ id ”>\n    ```\n\
    *   The `<input>` syntax which will take only password value is:\n    ```html\n\
    \    <input type = \"password\" placeholder = \" default_name \" name = \" name\
    \ \" id = “ id ”>\n    ```\n*   The `<input>` syntax for submit button :\n   \
    \ ```html\n    <input type = \"submit\" name = “ name ”>\n    ```\n*   The `<input>`\
    \ syntax for radio button :\n    ```html\n    <input type = \"radio\" name = \"\
    \ name \">\n    ```\n\nlogInPage.html![](Image00024.jpg)\n\nFrom the above HTML\
    \ code you will notice that the input fields are present within a HTML table structure.\
    \ Syntax for creating a table:\n\n```html\n<table>\n    <th>...</th>\n    <tr><td>...</td></tr>\n\
    \    <tr><td>...</td></tr>\n</table>\n```\n\n![](Image00025.jpg)\n\n● `<th>` stands\
    \ for table header\n● `<tr>` stands for row\n● `<td>` stands for data\n\nIn the\
    \ above HTML code, you will also notice the presence of `<a>` tag. What is `<a>`\
    \ tag? `<a>` tag makes the cursor appear automatically. To connect `<a>` tag with\
    \ its corresponding input field, the `id` must match with the text.\n\n```html\n\
    <h1 style = “ font-family: Verdana; ”> Hello World</h1>\n```\n\n![](Image00026.jpg)\n\
    \nEverything looks perfect. Please note: We will be creating rest of the pages\
    \ in Chapter 2.\n\n## 1.2.3: In-Line CSS\n\nImportant points to note in In-Line\
    \ CSS are:\n\n● In In-Line CSS, the styling information is added with HTML element\
    \ using `style` attribute. Example:\n\n```html\n<h1 style = “ font-family: Verdana;\
    \ ”> Hello World</h1>\n```\n\n● Developers usually avoid In-line CSS because:\n\
    \n1. It makes the HTML code messy and big. The best practice is to separate the\
    \ content and design.\n2. As our HTML document starts to become big, In-line CSS\
    \ becomes confusing and harder to maintain.\n3. It is time consuming.\n\n## 2\
    \ Introduction to Javascript\n\nImportant points to note about Javascript are:\n\
    \n1. Javascript is an Event Driven language. When an event happens like a button\
    \ is clicked or a value is selected then the Javascript codes get triggered and\
    \ they perform a certain task. The task is usually written within a function.\n\
    2. Javascript is mainly used to depict the behavior of a web page.\n3. Javascript\
    \ codes should be written with the `<script>` tag and the `<script>` tag can be\
    \ present within the `<head>` section or the `<body>` section of a HTML document.\n\
    \   \nPlease note: In this chapter, I will be covering few important Javascript\
    \ topics essential for the development of our project. To gain in-depth and through\
    \ knowledge of all Javascript topics, please visit [https://www.w3schools.com/](https://www.w3schools.com/)\n\
    \n### 2.1 Javascript Variable\n\nThere are three ways a variable in Javascript\
    \ can be declared:\n\n1. `var` keyword\n2. `let` keyword\n3. `const` keyword\n\
    \nOf the above three, `let` and `const` are more preferable to use by developers.\n\
    \n### 2.1.1 Difference between Var, Let and Const keyword\n\n![](Image00027.jpg)\n\
    Output![](Image00028.jpg)\n![](Image00029.jpg)\n![](Image00030.jpg)\n\n**Code\
    \ Explanation:**\n\n*   In the above piece of code, you will notice that the body\
    \ of the HTML document contains a simple button named `click me`. With the help\
    \ of Javascript `onclick` event, the function `hello()` runs when the button is\
    \ clicked.\n\nThe syntax for creating a button is:\n\n```html\n<button type=\"\
    button\"> Click Me </button>\n```\n\nWhat is Javascript `onclick` event? `onclick`\
    \ event occurs when a user clicks on an element. What is Javascript `alert()`\
    \ function? `alert()` function is used to display a message in a small pop up\
    \ box.\n\n*   The `hello()` function is present within the `<script>` tag of head\
    \ section of HTML document. In this function, we declared two variables `x` and\
    \ `word1`.\n"
