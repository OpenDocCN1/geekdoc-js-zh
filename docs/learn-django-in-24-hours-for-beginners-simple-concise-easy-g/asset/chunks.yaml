    | -=    (x -= 2) | This is same as x = x – 2\. If value of x = 5, then the new
    value of x is 5 – 2 = 3 |


    | *=   (x *= 5) | This is same as x = x * 5\. If value of x = 2, then the new
    value of x is 2 * 5 = 10 |


    | /=    (x /= 2) | This is same as x = x / 2\. If value of x is 10, then the new
    value of x is 10 / 2 = 5 |


    | %=(x %= 2) | This is same as x = x % 2\. If value of x is 10, then the new value
    of x is 10 % 2 = 0 |


