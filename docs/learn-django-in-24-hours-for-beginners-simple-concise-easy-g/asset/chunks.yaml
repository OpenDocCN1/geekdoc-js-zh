    After I entered the name and clicked the submit button, an error shows up.![](Image00230.jpg)
    This error appeared because I forgot to add `csrf token` within the `<form>` tag
    of `test123.html`.


    What is `csrf token`? A Django `csrf token` is a unique value generated exclusively
    for authenticated users. It MUST be used with all Django forms because it helps
    to protect the user’s information and prevent any kind of malicious activities.
    So let’s add the `csrf token` within `<form>` tag of `test123.html` file and save
    it. `test123.html![](Image00231.jpg)`


    Run the project.![](Image00232.jpg)![](Image00233.jpg) Everything works perfectly.


    Let’s summarize the entire process:


    - To work with Django form, we need to create the form class (`test123_validation`).

    - This form class contains all the input fields of our HTML document (`test123.html`).

    - From `views.py` -> function `test123`, the form class is passed into a variable
    `form` which is accessed by `test123.html` and in that HTML page we simply plug
    in the variable. Once the variable is plugged in, Django automatically generates
    all the input fields.

    - Once the form is submitted, it takes us to url name `greetings`. The request
    then proceeds to `urls.py` file -> `greetings` function in `views.py` file.

    - `greetings` function takes the value from the form input field entered by user
    and displays it in `greetings.html`.


    In real world, no pages look simple as the example above. Web pages are far more
    complex and contain CSS, Javascript and lot more. In the next section we will
    learn how to manually insert Django form fields into our HTML file without disturbing
    the original DOM structure.


