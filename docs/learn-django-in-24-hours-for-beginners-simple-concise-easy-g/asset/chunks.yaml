    ### Step 3: Create the templates folder

    Create another folder within `templates` folder with the same name as the app
    and paste all the Doggy Day Care project’s HTML files into it.


    ### Step 4: Update urls.py

    Now let’s go to the app’s (`doggyDayCareCustomerInterface`) `urls.py` file and
    add the following lines of code:

    ```

    urls.py

    ```


    ### Step 5: Update views.py

    Open app’s (`doggyDayCareCustomerInterface`) `views.py` file and add the following
    lines of code:

    ```

    views.py

    ```


    #### Code Explanation

    * In `urls.py` file, `path("", views.index, name="index")` does not have any routing
    name. This means when there is no routing name simply proceed to `index` function
    present in `views.py` file. The `index` function returns `index.html` (Home page
    of Doggy Day Care project) file to the user.

    * In `urls.py` file, `path("logInPage", views.logInPage, name="logInPage")` have
    a routing name and url name of `logInPage`. This means when the routing name is
    `logInPage` proceed to `logInPage` function present in `views.py` file. The `logInPage`
    function returns `logInPage.html` (Log In page of Doggy Day Care project) to the
    user.


    ### Step 6: Update index.html

    Open `index.html` file of the Doggy Day Care Project (created in section 1.2.1,
    Chapter 1) -> Notice there was a hardcoded path given to the HTML `href` attribute
    which would lead us to Log In HTML page. Now delete the old path and in that `href`
    attribute give the url name `logInPage` from `urls.py` file.


    The syntax for adding the url name from `urls.py` file into a HTML file is `{%
    url ''url_name'' %}`. What is `{% %}`? `{% %}` are called Template Tags in Django.
    They are mainly used within HTML document to:

    1. Load some external information.

    2. Perform loops or logic.


    When user click on the Log In button of the Home Page, the `href` attributes leads
    us to url name `logInPage`. The request proceeds to `urls.py` file, where it looks
    for the path with url name `logInPage`. Now with the help of this name, it goes
    to its associated function `logInPage` present in `views.py` file. Function `logInPage`
    simply returns the Log In page to the user (please refer to codes above).


    ### Step 7: Run the project

    Let’s run our project and check whether the navigation from Home page to Log In
    page is performing correctly or not.

    Open command prompt -> navigate to the main project (`project1`) location where
    `manage.py` file is present and run the following command:

    ```bash

    python manage.py runserver

    ```

    Open web browser -> go to `http://127.0.0.1:8000/doggyDayCareCustomerInterface/`.
    Now click on Log In button to check the navigation works properly or not.


    The navigation works perfectly. Now follow the steps above and replace all hardcoded
    paths present in `index.html` files with url names. Everything works fine but
    you will notice one BIG flaw: You will notice that the pages loaded without any
    images and CSS. So let’s fix this issue in the next section.


    ### 5.6: How to load static files like CSS & Images into our Django App

