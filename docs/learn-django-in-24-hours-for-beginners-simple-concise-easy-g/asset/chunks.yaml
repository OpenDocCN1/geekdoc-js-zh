    Let’s display the `pip` version by using command `pip –version`.![](Image00136.jpg)


    **Step 3**: To install Django, type the command `py –m pip install Django`.![](Image00137.jpg)

    During the installation process, I encountered a warning saying “ Consider adding
    this directory to PATH ”. So let’s fix this warning..

    Go to Environment Variables -> Now add the `pip` file location into `PATH` variables.![](Image00138.jpg)![](Image00139.jpg)

    Now it says “Successfully installed Django”


    **Step 4**: Now let’s set our virtual environment . To do that let’s follow the
    steps from Django Documentation: [https://docs.djangoproject.com/en/3.1/howto/windows/](https://docs.djangoproject.com/en/3.1/howto/windows/)

    To create a virtual environment Django documentation says the following:![](Image00140.jpg)

    So let’s create a folder (I named my folder `Python_script`). Open Command prompt
    -> navigate to the folder location (`Python_script`) then write the following
    command:

    ```

    py –m venv project_name

    ```

    ![](Image00141.jpg)

    We see Django created the folder for us.![](Image00142.jpg)![](Image00143.jpg)

    Now Django documentation says:![](Image00144.jpg)

    So let’s activate the virtual environment. Open Command prompt -> Navigate to
