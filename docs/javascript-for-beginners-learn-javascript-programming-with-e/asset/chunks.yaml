    Meyer 创建了一个有效的重置方案。


    ### Drop caps（首字母大字）


    大家都喜欢首字母。它让我们想起传统的印刷书籍，是开启页面内容的好极方法。第一个大字母真的会吸引你的注意力。在 CSS 中创建首字母有一个简单的方法，就是使用伪元素：`:first-letter`。这是一个示例：


    ```css

