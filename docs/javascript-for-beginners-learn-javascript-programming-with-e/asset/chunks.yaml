  trans: "\n从起初就将沟通特性融入产品中。通过赋予产品和服务以更好的意义，目标群体自发选择它们的机会会大得多。\n\n一个很好的例子：当 iPod 在\
    \ 2001 年推出时，苹果花费了 2450 万美元来发布该产品。这是一笔巨款，但可能仅是使用一个缺乏吸引力的产品来获得同样的全球成功所需成本的十分之一。良好的设计和口碑完成了大部分工作。\n\
    \n正如瑞典伟大平面设计师 Ollie Eksell 在 1964 年描述的那样：设计 = 经济。归根结底：这关乎掌控局面。设计策略的触角延伸到每一个地方，在这些地方，我们相信通过良好的设计和创新策略，公司将建立起更有信力的品牌，而不是在最后只用广告来包装产品。广告资金应该更好地用于那些能产生影响并造福企业和社会的创新。谁又不想通过开发更具吸引力和可持续性的产品和服务，让人们的生活变得更好、更平等、更快乐呢？\n\
    \n有些人可能会认为一切都会被复制：无论是产品还是服务。如果足够成功，它们当然会被复制。当每个人都拥有相同的技术时，复制品将永远存在。因此，你必须差异化并保持独特性，你需要更聪明、更主动。一个好的发展方向是少一点技术官僚主义，多一点文化，因为企业的价值观是法院最难通过蓝图界定的部分。通过在公司战略中整合设计策略（与营销、人力资源、研发、财务等一起），你将走得很远。\n\
    \n我们都熟悉 80 年代以来关于品牌的讨论：“我们的品牌是我们最有价值的资产”。今天这已是常谈，一种基础卫生因素。如今，设计策略是“新的”品牌策略。像苹果这样拥有清晰设计策略的成功公司已经明白，设计问题必须在最高管理层进行讨论和决定。设计策略的触角应该渗透到公司战略的各个，这就是它是必要且不可战胜的竞争优势。它超越了身份识别和平面设计；它关乎你公司发生的一切切。你的客户服务如何？办公室里有鲜花和水果吗？接待室播放什么音乐？你的产品或服务是什么？你是如何展示它的？一切都重要，没有什么是是不重要的，你必须具备全局观并管理流程——设计。这是你最重要的流程之一，因为设计帮助你在沟通中取得成功。通过良好的沟通，你将触达客户，并成为客户心目中快乐且可能的积极的一部分。\n\
    \n总结这个永恒的品牌：品牌及其价值是设计过程的结果。今天，人都知道你必须进行开发、创新并寻找生存的方法——无论是出于业务考量还是环境考虑。在 David\
    \ Report，我们承担责任并关注业务困境——当你可以做一些强有力的事情，并通过创新的研发真正建立你的品牌并售出更多产品/服务时，为什么还要打广告呢？\n\
    \n当你阅读以上内容时，我们主张从广告导向转向以设计为核心的研发。在我们看来，这是通往未来社会和商业生活的唯一途径。设计也是视觉化品牌和业务战略的最佳方式。明智地质疑广告标准，并在我们的信誉循环中体验一下，换句话说：通过智能性的设计策略来建立你的品牌。\n\
    \n## C# .Net 中的数组\n\n### 什么是数组？\n简单来说，数组是一个组织的集合。它可以是任何东西的集合。要记住的一点是它是一个集合。\n\n\
    ### 我们每天都使用数组\n一包 M&Ms 巧克力是数组的一个很好的例子。我们很容易想象一袋流行的糖果。我们可以想象每一颗 M&Ms 从袋子里取出来时的样子。它们基本上都是一样的，但颜色不同。尽管颜色不同，但它们都是带有硬糖壳的巧克力糖。一袋\
    \ M-M's 是数据类型 M-M's 的数组。它是糖果的集合。\n\n### 如何声明数组？\n声明数组与声明其他变量非常。。区别在于你正在声明一个将包含多个对象的变量。让我们比较一下这两个声明。\n\
    \n```csharp\nString strEmotion = \"happy\";\nString[] strEmotions = {\"happy\"\
    ,\"sad\",\"elated\",\"afraid\",\"angry\",\"peaceful\"};\n```\n\n上述两个变量 `strEmotion`\
    \ 和 `strEmotions` 都是使用显式声明（Explicit Declaration）定义的，这意味着值在创建的同时被设置了。\n\n### 实际应用\n\
    在这个示例中，我们有一个 `System.Drawing.Color` 数组，我们将用它更改表单的背景颜色。这个简单的应用程序有助于理解如何引用数组中的每个不同项目。它还展示了如何找到哪个控件调用了函数。\n\
    \n首先声明了一个 `System.Drawing.Color` 数组，并同时添加了四种颜色：绿色、红色、黄色和蓝色。注意表示数组声明的括号 `[]`。\n\
    \n```csharp\nSystem.Drawing.Color[] myArray = {System.Drawing.Color.Green, System.Drawing.Color.Red,\
    \ System.Drawing.Color.Yellow, System.Drawing.Color.Blue};\n```\n\n由于我们在声明时填充了数组，所以我们说它是显式声明的。\n\
    \n获取特定值\n起初可能会有点困惑，因为数组是从零开始索引的。这意味着列表中的第一个项目位于第 0 位。\n\n```csharp\nstrEmotions[0]\
    \ = happy\nstrEmotions[1] = sad\nstrEmotions[2] = elated\nstrEmotions[3] = afraid\n\
    strEmotions[4] = angry\nstrEmotions[5] = peaceful\n```\n\n```csharp\nprivate void\
    \ ChangeColors(object sender, EventArgs e)\n{\n    /*获取调用方法的单选按钮的引用。我们知道调用此方法的控件将是单选按钮，因此我们首先创建一个类型为\
    \ Radio Button 的变量。然后将我们的变量设置为 sender 对象。但我们首先需要将 sender 变量转换为 Radio 数据类型*/\n\
    \    System.Windows.Forms.RadioButton rbtn = (System.Windows.Forms.RadioButton)sender;\n\
    \n    if (rbtn.Name == \"rbtnGreen\") this.BackColor = myColorArray[0];//\n}\n\
    ```\n"
