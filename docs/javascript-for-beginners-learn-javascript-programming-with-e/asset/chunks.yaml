    attention. There’s an easy way to create a drop cap in CSS, and it’s by using
    the pseudo element: `:first-letter`. Here’s an example:


    ```css

    :first-letter{

    display:block; float:left;

    margin:3px; color:#f00;

    font-size:30px;

    }

    ```


    What this does is it changes the color of your `h2` tag from black to red when
    someone hovers over it. The great thing about using `:hover` is that you don’t
    have to declare the `font-size` or `weight` again, if it isn’t changing. It only
    changes what you specify.


    ### Transition


    For hover effects, like with menus or on images in your website, you don’t want
    colors snapping too quickly to the end result. You ideally want to ease the change
    gradually, which is where the `transition` property comes into play.


    ```css

    .entry h2:hover{

    color:#f00;

    transition: all 0.3s ease;

    }

    ```


    This makes the change happen over .3 seconds, instead of just instantly snapping
    to red. This makes the hover effect more pleasing to the eye and less jarring.


    ### 7. Link states


    These styles are missed by a lot of designers, and it really causes usability
    issues with your visitors. The `:link` pseudo-class controls all links that haven’t
    been clicked yet. The `:visited` pseudo-class handles the styling of all of the
    links you’ve already visited. This tells website visitors where they have already
    been on your site, and where they have yet to explore.


    ```css

    a:link { color: blue; }

    a:visited { color: purple; }

    ```


    ### 8. Easily resize images to fit


    Sometimes you get in a pinch where images need to fit a certain width, while scaling
    proportionally. An easy way to do this is to use `max-width` to handle this. Here
    is an example:


    This means that the largest the image could ever be is 100%, and the height is
    automatically calculated, based on the image width. In some cases, you might have
    have have to specify the width at 100%.


    ```css

    img {

    max-width:100%; height:auto;

    }

    ```


    ### 9. Control the elements of a section


    Using the image example above, if you only want to target the images of a certain
    section, like your blog, use a class for the blog section, and combine it with
    the actual selector. This will enable you to select only the images of the blog
    section, and not other images, such as your logo, or social media icons, or images
    in any other section of your site, like the sidebar. Here’s how the CSS would
    look:


    ```css

    .blog img{

    max-width:100%; height:auto;

    }

    ```


    ### 10. Direct children


    I wish I’d know when I first started out using CSS. This would have saved me so
    much time! Use `>` to select the direct children of an element. For example:


    ```css

    Ads by

    #footer > a

    ```


    This will select and style all of the active link elements that are immediately
    under the Footer ID. It won’t select anything past the active element, or anything
    else contained in the footer, like plain text. This works great with top level
    navigation elements, too.


    #### Specific Child Elements


    Believe me, this is handy when you are styling lists. You just need to count how
    many items down the element is that you want to style and then apply that style.


    ```css

    li:nth-child(2) {

    font-weight:800; color: blue;

    text-style:underline;

    }

    ```


    The CSS above targets the second item in the list and makes it bold, underlined,
    and blue. Add an “n” after the number in parentheses and you can targettarget
    every 2nd list item. Imagine being able to style every other line in a table-style
    layout for easy reading. The CSS would be:


    ```css

    li:nth-child(2)

    ```


