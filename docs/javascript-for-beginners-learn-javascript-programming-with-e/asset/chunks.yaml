    这段代码的作用是当鼠标悬停在 `h2` 标签上时，将其颜色从黑色变为红色。使用 `:hover` 的强大之处在于，如果字体没有变化，你不需要再次声明 `font-size`
    或 `weight`。它只会改变你指定的属性。


    ### Transition（过渡效果）


    对于 `hover` 效果（例如菜单或网站上的图片），你不希望颜色太快地跳到最终结果。理想情况下，你希望变化逐渐过渡，这时 `transition` 属性就派上用场了


