  trans: "\n\n如果你有一个链接，用户在手机上点击时会拨打电话，你可能无法使用传统的活动链接选择器对其进行样式。相反，请使用以下 CSS：\n\n```css\n\
    a[href^=tel] { <span class=\"Apple-converted-space\"> color: #FFF;</span> <span\
    \ class=\"Apple-converted-space\"> text-decoration: none;</span> }\n```\n\n\n\
    ## 运行 JavaScript 函数的不同方法\n\n### 1 – 裸锚点 (anchor naked)\n在某些浏览器中，鼠标悬停时指针可能不会变化。可以使用\
    \ CSS 来解决这个问题：`a {cursor:pointer; }`\n\n### 2 – 锚点哈引用 (anchor hash ref)\n鼠标悬停时显示链接\
    \ # 。在 IE6、IE7 上页面可能会跳转到顶部\n\n### 3 – 锚点伪协议 (anchor pseudo)\n点击链接时调用函数的旧方法。出于可用性和可访问性考虑，不建议使用伪协议引用。\n\
    \n如今，由于可用 API 的大量出现，这被认为是过时的编程。\n\n它很杂乱、很长，人们会在状态栏看到它，而且它没有任何意义。Opera 不喜欢 `href=\"\
    javascript:[anything]\"`\n\n### 4 – 锚点伪协议 void (anchor pseudo void)\n使用 `javascript:[anything]`\
    \ 被一些人认为是坏习惯。伪协议引用可能会导致 IE 进入等待状态，预期页面将被替换，并自动禁用消耗资源的活动。`javascript:[anything]`\
    \ 用于书签。\n\n`javascript:void(0);` 是什么？\n\n...\n\n### 5 – 锚点返回 false (anchor return\
    \ false)\n返回 `false` 会导致 `href=\"#\"` 不生效。\n\n比使用上述伪协议示例（如页面跳转）更安全的方法。\n\n`return`\
    \ 有时不可靠。\n\n...\n\n### 6 – 锚点美化 URL/jQuery (anchor pretty url/jQuery)\n用户悬停在链接上会看到\
    \ #some-real-url。如果禁用了 JavaScript，他们会看到一些信息性的内容。...\n\n```javascript\n$(document).on('click',\
    \ 'a.mylink', function(e) {\n  //防止页面跳转到引用\n  e.preventDefault();\n  //运行函数 foo();\n\
    });\n```\n\n## 学习 CSS 语法和正确应用\n一旦你实实地了 CSS 及其功能，下一步就是理解 CSS 的语法以及将其应用于文档的几种方式方法。\n\
    \n## CSS 语法由三个元素组成。\n\n**选择器 (Selector)**：选择器是你 HTML 文档中想要样式化的元素。例如，如果你在 HTML\
    \ 中放置了一个段落标签（p），你的选择器就是 `\"p\"` —— CSS 中的标准段落标签。如果你想对网站的整个主体应用样式，将使用 `\"body\"\
    ` 作为选择器。稍后，你将学习如何使用 `\"class\"` 和 `\"id\"` 标签创建你自己的选择器。\n\n**属性 (Property)**：属性是可以应用于特定选择器的元素。以上面示例中的段落为例，你可以用于样式化该选择器的几个属性包括\
    \ `font-family`、`font-size`、`color` 以及其他几个。\n\n**值 (Value)**：值是应用于特定属性的形状、大小、尺寸等。例如，如果你想让段落文字以\
    \ 20px 显示，则对上述属性应用 `20px` 的值。\n\n*   选择器：`p {}`\n*   选择器 + 属性：`p {font-size:}`\n\
    *   选择器 + 属性 + 值：`p {font-size: 20px;}`\n\n现在，让我们进入 CSS 的应用。你有种方法可以文档应用样式。\n\n\
    ### 内联样式 (Inline Styles)\n内联样式意味着你将特定元素的样式放置在标签内部。例如，如果你想更改段落的文字颜色，可以在段落标签内应用\
    \ `blue;`。这种方法可以接受，但不推荐。如果你有一个 100 个页面的网站并使用了内联样式，当需要更改时，你必须逐个更改所有页面。\n\n### 内部样式\
    \ (Internal Styles)\n内部样式将样式包含在 HTML 文档本身中。在文档开头有 `head` 标签。你的样式将放置在标签之间以便引用。如果你只有一个页面，可能可以使用这种方法。\n\
    \n### 外部样式 (External Styles)\n使用外部样式是使用 CSS 最有效的方法。你的样式存储在所有 HTML 文件连接的文档外部。这使得全局更改变得轻而易举。假设你想更改\
    \ 100 页面网站的链接颜色。与其逐个更改页面，你只需更改外部文档中的样式，就搞定了。所有页面都会被更改，因为它们都已链接。\n\n## 为什么 JavaScript\
    \ 中的大小写敏感如此重要？\n这是它的本质。脚本是用文本编写的，起初如此，但它不像 HTML（HTML 是大小写敏感的），它是代码，并且受许多浏览器内部工作机制（DOM\
    \ API）的影响。\n\n`var names`: 变量看起来相似，但它们是不同的。重要的是我们要识别它。\n\n```javascript\nfunction\
    \ Person(name, age){\n  this.name = name\n  this.age = age\n}\n\nvar person =\
    \ new Person(\"Zach\", 29);\n```\n\n我们可以忽略这段代码中尚未涵盖的部分。重点是显示 person 和 Person 是两个不同的对象。Person\
    \ 是一个对象函数，而 person 是该构造函数的实例。\n\nconsole.log(person); // { name: 'Zach', age:\
    \ 29 }\nconsole.log(Person); // [Function]\n```\n\n目前，你必须检查你的大小写，否则可能会遇到可能的负面后果，如语法错误和其他异常。培养敏锐的眼光并记住\
    \ JS 是大小写敏感的。我们对此无能为力。\n\n## 理解注释\n你可以输入并跟踪有关个人和组织的注释。你可以查看关于某个个人的所有注释，或由特定个人输入的所有注释。由于个人注释是主观的且通常保密，请仔细分析你机构对输入和跟踪注释的需求和要求。在系统中设置或创建注释之前，你应该熟悉管理功能和\
    \ CC 组安全。\n\n在适当的安全访问权限下，你可以在关于该个人或组织的功能区域页面上点击“创建注释”按钮，为个人或组织的记录附上或查看注释。\n\n\
    你还可以通过菜单访问本文档中描述的注释页面。\n\n### 句子中的冒号用法\n*   目前有两种选择：逃跑或战斗。我们知道谁会赢得比赛：鹰队。\n*  \
    \ 他想看意大利的三个城市：罗马、佛罗伦萨和威尼斯。\n*   记住：彼此相爱（两个人可以玩这种游戏）。\n*   她不断重复：“我真的想要那辆车！”\n\
    *   我想知道我为什么没有收到它：我没有收到。\n*   州名开头是：密歇根州、密西西州和缅因州。\n*   你现在可以选择了：我感觉好多了。永远不要忘记这个：思而后言。\n\
    *   这间房子拥有我需要的一切：两个卧室，一个车库。\n*   这个小镇让我想起了童年的假期：海滩。\n*   我有好几种类型的电影：剧情、科幻和惊悚。\n\
    \n"
