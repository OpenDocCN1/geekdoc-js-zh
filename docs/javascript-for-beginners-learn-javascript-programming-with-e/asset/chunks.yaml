  trans: '


    回到 20 年前，当互联网还处于婴儿阶段时，构建网页的唯一方法就是使用记事本，这是 Microsoft Windows 提供的一个免费文本编辑器。现在，随着互联网已变成音乐、特效和
    Flash 的汇汇，编写 HTML 代码的艺术正在逐渐流失给 Microsoft FrontPage 和 Macromedia Dreamweaver MX
    等 HTML 编辑器。然而，无论你是否喜欢，为了有效地构建网站，你仍然需要了解基础的 HTML 代码。


    让我来解释一下……


    HTML（即超文本标记语言）本质上是万维网的语言。没有 HTML，我们像 Netscape、Internet Explorer 或 Firefox 这样的网络浏览器就无法解析我们的网页。HTML
    由一系列标签组成，这些标签描述了你希望呈现网页的内部运行机制和结构。现在严肃地说，你可以在完全不知一丁 HTML 的情况下生存并构建网页，但要在互联网上取得真正的成功，事实并非如此。


    搜索引擎现在是互联网上使用的主要工具之一，你每天都能看到微软的 MSN、Yahoo 和 Google 在搜索引擎的角逐中争夺第一位置，但作为一名 Web 程序员，能够将自己定位在排名靠前可能是你需要掌握的最重要技能之一。因为在你的关键词中处于领先位置，意味着你将为你的网站带来免费且精准的流量，这比通过
    Google AdWords、Overture 以及任何其他基于文本的广告服务付费要得多。


    所以，为什么了解 HTML 会帮助你将网站定位在搜索引擎的高端位置呢……


    你首先需要知道的是如何正确格式化网页的标题标签（header tags），因为没有格式化正确的标题标签，搜索引擎就不知道你的网站关于什么，以及你希望与网页关联的关键词。我在某些
    HTML 编辑器中发现的一个大问题是，它们没有解决标题标签或特别是元标签（meta tags）问题，这意味着如果你正在构建网站，你已经在损害网站在搜索引擎中被置于正确位置的能力。


    例如，许多 HTML 编辑器会提供弹出表单，帮助你设置描述和关键词的元数据，但它们忽略了其他元数据，例如搜索引擎是否应该索引所有页面、网页语言、字符集以及你根据
    HTML 标准创建的是什么类型的文档。


    ```html

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 40 Transitional//EN">

    <html>

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="generator" content="Microsoft FrontPage 6.0">

    <meta name="pageId" content="FrontPage.Document">

    <title>Your Title</title>

    <meta name="description" content="Your Description">

    <meta name="keywords" content="Your Keywords">

    ```


    我应该澄清的一点是，仅仅你提供了所有信息并不意味着


    a) 所有的搜索引擎都使用这些信息

    b) 你保证能在搜索引擎中获得首页

    但当你正确放置网页中的每个微小元素时，内容就会出现在搜索结果中。不过请记住，每个搜索引擎都是不同的，它们用于网站内容的算法是经过严密保护的。


    你应该学会如何编写至少基础 HTML 代码的另一个原因是帮助你构建指向你网页的反向链接（incoming links）。你可以遵循的构建这些入链的技术是编写为人们提供关于你业务信息的文章。例如，如果你有一个销售所有高尔夫用品的网站，你可能会考虑写关于如何选择高尔夫球或在哪里可以找到最好的高尔夫球俱乐部和练习场的文章。


    当你向 Articles.com、GoArticles.com 或 ArticlesON.com 等地方提交文章时，他们会要求你使用某些 HTML 标签来突出你的文章。例如，通常在文章正文中，你只能使用加粗、*斜体*、下划线和列表项目，但在其他区域，如你放置内容语言和字符集标签的地方，可能会影响他们的软件是否能正确读取你的网站。因此，如果你的客户群体建立在例如残障人士占
    30% 市场份额的基础上，那么你可能正在浪费钱。

