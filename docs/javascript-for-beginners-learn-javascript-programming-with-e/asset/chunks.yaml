    \n## Introduction to JavaScript\n\nJavaScript is an interpreted programming language,\
    \ built on the ECMScript standard. The language definition is really broad since\
    \ it can be defined as procedural language based on prototypes, imperative, weakly\
    \ typed, and dynamic.\n\nJavaScript is mainly used as a client-side programming\
    \ language implemented as part of a web browser to allow developers an improved\
    \ way to implement user interface and dynamic features in web pages, although\
    \ there are implementations of JavaScript on the server-side (SSJS) the popularity\
    \ of the language is due to the client-side implementations alone. JavaScript\
    \ can also be found outside web applications, for example as a way to add interactivity\
    \ to PDF documents and desktop widgets.\n\nJavaScript was designed with a similar\
    \ syntax as C, although it takes names and conventions from the Java programming\
    \ language. However, the names Java and JavaScript are not related and have different\
    \ syntaxes. JavaScript was originally developed by Brendan Eich of Netscape, which\
    \ was later renamed to JavaScript. The name changed approximately at the time\
    \ Netscape added support for it in Navigator version 2.0 in 1995. The name JavaScript\
    \ was coined, giving the language an extension of Java, and it has been marked\
    \ as scripting language for new web programming.\n\nThe following Microsoft developed\
    \ a similar client-side programming language as part of Internet Explorer 3. Microsoft\
    \ called it JScript to avoid problems related to the brand. The terms \"javascript\"\
    \ and \"js\" are often used interchangeably but JavaScript is not 100% compatible\
    \ with the ECM specification. To avoid these issues, World Wide Consortium (W3C)\
    \ designed the standard Document Object Model (DOM, or document model), which\
    \ was implemented in Internet Explorer 3.0 and Navigator version 4, 7 respectively.\n\
    \nIn 1997 there was a proposal to submit JavaScript to ECMMA Manufacturers. In\
    \ 1997, it was adopted as an ECMMA standard. JavaScript also ISO standard and\
    \ became the most used programming language.\n\nNote: JavaScript is a registered\
    \ trademark of Oracle. It is used under products created by Oracle and current\
    \ entities.\n\n## Usages of JavaScript\n\nJavaScript is present in most pages\
    \ today. Chances are the page you are looking at contains the code for JavaScript.\
    \ Try this activity: Right-click on a web page, then click 'View Source'. You\
    \ should be able to find the word somewhere in the code.\n\nWhile HTML markup\
    \ language allows web developers to format content, JavaScript allows them to\
    \ make the page dynamic. For example, HTML allows for making text bold, creating\
    \ text boxes, and creating buttons, whereas JavaScript allows for changing text\
    \ on the page, creating pop-up messages, and validating text in text boxes to\
    \ make sure required fields have been filled. JavaScript makes web pages more\
    \ dynamic by allowing users to interact with web pages, click on elements, and\
    \ change the pages.\n\n## What JavaScript can do for you\n\nLet’s take a step\
    \ back and count the merits of JavaScript:\n\nJavaScript is very easy to implement.\
    \ All you need to do is put your code in the HTML document and tell the browser\
    \ that it is JavaScript.\n\nJavaScript works on web users’ computers - even when\
    \ they are offline!\n\nJavaScript allows you to create highly responsive interfaces\
    \ that improve the user experience and provide dynamic functionality, without\
    \ having to wait for the server to react and show another page. JavaScript can\
    \ load content into the document if and when the user needs it, without reloading\
    \ the entire page — this is commonly referred to as Ajax.\n\nJavaScript can test\
    \ for what is possible in your browser and help fix issues — for example fixing\
    \ layout issues. That is a lot for a language that until recently was adopted\
    \ by ECMMA Manufacturers. JavaScript is an ECMMA standard and became the most\
    \ used programming language.\n\nNote: JavaScript is a registered trademark of\
    \ Oracle. It is used under products created by Oracle and current entities.\n"
