  trans: "\n\n我们都非常熟悉通过 `element.style.propertyName` 方法来修改样式，并且用过 JavaScript 工具包来实现它，但你知道你实际上可以读取和写入新旧及现有样式表中的规则吗？这个\
    \ API 实际上非常简单！\n\n```\nfunction addCSSRule(sheet, selector, rules, index) { \n\
    \  if(sheet.insertRule) {\n    sheet.insertRule(selector + \"{\" + rules + \"\
    }\", index); \n  } else {\n    sheet.addRule(selector, rules, index);\n  }\n}\n\
    ```\n\n// 使用它吧！\n\n`addCSSRule(document.styleSheets[0], \"header\", \"float: left\"\
    );`\n\n最常见的用例是创建一个新的样式表，但如果你想修改现有的样式表，尽管去尝试吧。\n\n## 使用加载器加载 CSS 文件\n\n懒加载图像、JSON\
    \ 和脚本等资源是缩短加载时间的一种极佳方法。我们可以使用 `curl.js` 等 JavaScript 加载器加载这些外部资源，但你知道你可以懒加载样式表并在同一个回调函数中获取通知吗？\n\
    \n```javascript\ncurl( [\n  \"namespace/MyWidget\",\n  \"css!namespace/resources/MyWidget.css\"\
    \n],\nfunction(MyWidget) {\n  // 对 MyWidget 执行一些操作\n  // CSS 引用不在签名中，因为我们不在乎它；//\
    \ 我们只关心它现在已经在页面中了\n})\n);\n```\n\n## CSS 核心基础\n\n### CSS pointer-events\n\nCSS\
    \ pointer-events 属性非常有意思，因为它的作用几乎类似于 JavaScript：当值为 `none` 时会有效禁用元素，而在值不是 `none`\
    \ 时则允许元素正常运行。你可能会说“那又如何”，但 pointer-events 甚至阻止 JavaScript 事件的触发！\n\n```css\n.disabled\
    \ { pointer-events: none; }\n```\n\n#### 用法\n\n该包可以通过 bower 安装\n\n`bower install\
    \ css-essentials`\n\n使用方法\n\n`<link rel=\"stylesheet\" href=\"bower_components/css-essentials/dist/cssessentials-min.css\"\
    >`\n\n或者通过 npm `npm install css-essentials`\n\n#### 基础设置\n\n我们确定需要比比常更多的 3-4 个断点才能真正让设计适应世上所有的屏幕。因此，我们定义了以下断点：\n\
    \n`@of-xsm : 460px; @of-sm: 606px; @of-md: 800px; @of-lg: 1164px; @of-xlg: 1440px;\
    \ @of-xxlg: 1740px;`\n\n浏览器支持\n\n我们倾向于至少支持 n-1，其中 n 是任何浏览器的当前版本。组件\n\n##### 网格\n\
    \n基于 24 列的网格使用 flex 创建。\n\n快速开始：\n\n```html\n<div class=\"of-row\">\n  <div class=\"\
    xxsm-col-24 xsm-col-18 sm-col-12 md-col-6 lg-col-4 xlg-col-2 xxlg-col-1\"> 内容\
    \ </div>\n</div>\n```\n\n这将在最小的屏幕上铺满整行，并在大屏幕上将变为 1 列。\n\n默认情况下，行（row）两侧有 24px\
    \ 的内边距（在 xxsm 屏幕上为 0，在 xsm 屏幕上为 12px），每列之间有 12px 的内边距。可以使用 `.of-row-no-padding`\
    \ 忽略行的内边距。\n\n##### 加载动画\n\n加载动画可以用于指示正在加载。\n\n快速开始：\n\n```html\n<div class=\"\
    of-row\">\n  <div class=\"xxsm-col-24\">\n    <div id=\"loading-bar-spinner\"\
    ><div class=\"spinner-icon\"></div></div>\n  </div>\n</div>\n```\n\n##### 文本截断\n\
    \n当你希望在一行内显示文本并在其超过行宽时对其进行截断时，文本截断非常有用。\n\n快速开始：`<div class=\"of-row\"><div class=\"\
    xxsm-col-12\"><div class=\"truncate\">...</div></div>`\n\n##### 推入动画\n\n推入动画是元素悬停时的一种漂亮效果。\n\
    \n快速开始：只需为你的元素添加 `.of-push-animation` 即可。\n\n##### 自定义\n\n可以通过编辑 `stylesheets`\
    \ 中的值并运行 `npm install` 来编辑网格断点。\n\n##### 命令值\n\n除此之外，你还可以向命令指定网格断点的所需值：`npm install\
    \ release breakpoints='xxm 0px, xsm 460px, sm 606px, md 800px, lg 1164px, xlg\
    \ 1440px, xxlg 1740px'`\n\n此 `breakpoints` 参数将覆盖 `stylesheets` 中指定的默认值。它必须是一个由逗号分隔的数组。然后，每个断点由\
    \ `<name><width>` 组成：`<name>` 是一个字符串，用于识别你的断点，它的类将使用 `<space>`（简单的空格）来分隔名称和宽度\
    \ `<width>` 是一个 px 单位的值（正确的值如：0px, 300px, 500px 等）。\n\n## 每位设计师都应该知道的 20 个核心 CSS\
    \ 技巧\n\n绝对定位\n\n如果你想始终控制元素在网站上的显示位置，绝对定位是实现这一点的关键。如果你将浏览器看作一个边界框，绝对定位允许你精确控制元素留在该框的哪个位置。使用\
    \ top、right、bottom 和 left，配合像素值来控制元素停留的位置。\n\n```css\nposition: absolute;\ntop:\
    \ 20px;\nright: 20px;\n```\n\n* 选择器\n\n`*` 选择器允许你选择文档中的所有元素。例如，如果你使用了 `*` 并添加了\
    \ CSS 样式，它将应用于带有 `<p>` 标签的所有元素。这可以全局地定位网站的部分。\n\n覆盖所有样式\n\n这种方法应谨慎使用，因为如果你对所有内容都这样做，长远来看你会遇到麻烦。但是，如果你想覆盖某个元素的样式，可以使用\
    \ `stylesheets`。例如，如果我想让 section 中的 H2 变成红色，我会使用如下：\n\n```css\n.section h2 { color:\
    \ red; }\n```\n\n居中\n\n居中很复杂，因为它取决于你尝试居中的什么。让我们看看需要居中的项目。文本使用 `text-align:center;`\
    \ 居中。如果你想让靠左或靠右，使用 `text-align`。\n\ndiv（或任何其他元素）可以通过添加 `display: block;` 并使用 `auto`\
    \ 边距来实现居中。我之所以将宽度设置为“100% 以下的”，是因为如果它是全宽的，它将无法居中。\n\n```css\ndiv {\n  display:\
    \ block;\n  margin: auto;\n  width: 50%;\n}\n```\n\n垂直对齐（针对单行文本）\n\n你会在导航菜单中使用此技术，关键是让菜单的高度和文本行高（line-height）保持一致。当我回修改客户的现有网站时，经常看到这种技术。这里是一个示例：\n\
    \n```css\n.nav li {\n  line-height: 50px;\n  height: 50px;\n}\n```\n\n悬停效果\n\n\
    这种效果用于按钮、文本链接、网站的区块、图标等。如果你希望某个元素在用户悬停在其上方时改变颜色，请使用相同的 CSS，但对其添加 `:hover` 并更改样式。这里是一个示例：\n\
    \n```css\n.entry h2 {\n  font-size: 36px;\n  color: #000;\n  font-weight: 800;\n\
    }\n\n.entry h2:hover {\n  color: #f00;\n}\n```\n\n"
