    Back 20 years ago when the Internet was just in its infancy, the only way to build
    a webpage was simply to use notepad, a free text editor supplied with Microsoft
    Windows. Now as the Internet has become a collage of music, special effects and
    flash, the art of writing HTML code is slowly being lost to HTML Editors like
    Microsoft FrontPage and Macromedia Dreamweaver MX. Yet, whether you like it or
    not, to be able to effectively build websites you still need to know at least
    basic HTML Code.


    Let me explain ...


    HTML or Hypertext Markup Language is in essence the language of the World Wide
    Web. Without HTML our Internet Browsers like Netscape, Internet Explorer or Firefox
    would not be able to interpret our webpages. HTML is made up of a series of tags
    that describe the inner workings and structure of how you want to present your
    webpages. Now in all seriousness you could survive building webpages without knowing
    one little bit of HTML but to be truly successful on the web this is not true.


    Search engines are now one of the main tools utilised on the web and everyday
    you see Microsoft''s MSN, Yahoo and Google jostling for the number one position
    in the search engine stakes but as a web programmer being able to position yourself
    into a top ranking spot is probably one of the most important skills you will
    need to master. As being in one of the top positions for your keywords means that
    you will be receiving free focused traffic to your website which is much better
    than having to pay for it via Google''s AdWords, Overture and any of the other
    text ad based services.


    So why is knowing HTML going to help you in getting your website positioned into
    a top spot in the search engines ...


    The first thing you need to know is how to correctly format your header tags of
    your webpage because without properly formatted header tags, the search engines
    won''t know what your sites about and what keywords you wish to associate with
    the webpage. One of the big issues I have seen with some of the HTML editors is
    that they don''t address this issue of Header tags or in particular meta tags,
    which means if you are building a website you are already compromising the website
    ability to be placed into the right position within search engines.


    For example many of the HTML editors will provide you with popup forms that will
    help you set your meta data for your descriptions and keywords but they miss out
    other meta data such as whether the search engines should index all the pages,
    the language of the webpage, the character set and what type of document you are
    creating based on the HTML Standard.


    ```html

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 40 Transitional//EN">

    <html>

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="generator" content="Microsoft FrontPage 6.0">

    <meta name="pageId" content="FrontPage.Document">

    <title>Your Title</title>

    <meta name="description" content="Your Description">

    <meta name="keywords" content="Your Keywords">


    One thing I should clarify that just because you provide all information does
    not mean


    a) All Search engines use this information

    b) You are guaranteed to get a top place in search engine

    But having each small element in your webpage, correctly when you put them makes
    content in search. Remember though that every search engine is different and that
    algorithms use for website content is well guarded


    One of the other reasons why you should know how to write at least basic html
    code is to help you build incoming links to your webpages. A technique you can
    follow to build those incoming links is to write articles that provide information
    for people about what you do. For example if you owned a Golfing Website that
    sold all things Golf then you might consider writing articles on how to select
    a Golf Club or where the best Golfing Clubs and ranges can be found.


    When you are submitting your articles to places like Articles.com, GoArticles.com
    or ArticlesON.com they will ask you to use certain html tags to help accentuate
    your article. For example generally in the body of your article you can only use
    things like bold, italics, underline and list items but in other areas like where
    you put tags like the content language and character set can affect whether their
    software will read your website correctly. So if your customer base is built on
    say 30% market of those who are disabled with impairment then you could be costing
    yourself money.

