    ```


    ### 8. 轻松缩放图片以适应


    有时你会遇到一种情况：需要图片在适应特定宽度的同时按比例缩放。处理这种情况的一种简单方法是使用 `max-width`。这里有一个示例：


    这意味着图片最大可以达到 100%，高度根据图片宽度自动计算。在某些情况下，你可能还需要手动指定宽度为 100%。


    ```css

    img {

    max-width:100%; height:auto;

    }

    ```


    ### 9. 控制区域内的元素


    使用上面的图片示例，如果你只想针对特定区域（如你的博客）的图片，请为博客区域使用一个类，并将其与实际选择器结合。这将允许你只选择博客区域的图片，而不是其他图片，例如你的
    Logo、社交媒体图标或网站其他区域（如侧边栏）的图片。CSS 如下：


    ```css

    .blog img{

    max-width:100%; height:auto;

    }

    ```


    ### 10. Direct children（直接子元素）


    我希望我刚开始使用 CSS 时就知道这个。这本可以节省我很多时间！使用 `>` 来选择元素的直接子元素。例如：


    ```css

    Ads by

    #footer > a

    ```


    这将选择并样式化紧跟在 ID 为 `footer` 下的所有活动链接元素。它不会选择活动元素之后的任何内容，也不会选择页脚内的任何其他内容（如纯文本）。这对于顶层导航元素也非常好用。


    #### Specific Child Elements（特定子元素）


    相信我，这在样式化列表时非常有用。你只需要数出想要样式化的元素是向下第几个，然后应用该样式即可。


    ```css

    li:nth-child(2) {

    font-weight:800; color: blue;

    text-style:underline;

    }

    ```


    上面的 CSS 针对列表中的第二个项目，并将其加粗、添加下划线并变为蓝色。在括号数字后加上一个“n”，你就可以针对每 2 个列表项。想象一下，能够为表格风格的布局中的每隔行设置样式以便方便阅读。CSS
    应该如下：


    ```css

    li:nth-child(2)

    ```


