    ```css

    .entry h2:hover{

    color:#f00;

    transition: all 0.3s ease;

    }

    ```


    这使得变化发生在 0.3 秒内，而不是瞬间变成红色。这让悬停效果看起来更平顺自然，不那么突兀。


    ### 7. Link states（链接状态）


