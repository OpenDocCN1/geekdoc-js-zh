    layout the text and provide color, bold fonts, yet HTML is also markup. Markup
    is text, in format with added features: parts of the text linked to others, making
    it easy to jump from one text to another.


    It is not intended to hold content, it contains data to describe itself and reference
    content. Text on the web is not just linear, is markup. It is not intended to
    produce the visual effect dreamed by an artist. It is, rather, to allow information
    to be structured in a manner that can be rendered in an understandable manner
    from a designer''s wide-screen to a text-terminal to a blind person''s audio reader.
    It is a code. Nothing more nothing less.


    It is not a programming language - it is a ''markup'' language where simple coding
    is embedded into a narrative which describes the structure, layout and formatting
    of the document. The coding is ''interpreted'' or ''parsed'' by a web browser
    and, hopefully, the page is displayed as designed intended. It is usually read
    in a web browser such as Firefox or Internet Explorer and displayed on the user''s
    screen as a webpage. Because many of the default attributes for webpages are left
    undefined, composed of the same HTML code may look different in different browsers.
    It is essentially how people communicate and acknowledge each other on the World
    Wide Web as it is the core markup language. The latest version of HTML Markup
    Language, HTML5, has recently been launched with new features and content to build.


    It is not a language. It consists of tags that are placed around content. What
