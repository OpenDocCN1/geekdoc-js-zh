    I had a huge meal; however, I am already hungry again. The Christmas ornaments
    are finally packed away: small, shiny ones; big, bright ones; and the homemade
    ones.


    She had self-defense training; consequently she warded off the assailant.


    We had students from Lima, Peru; Santiago, Chile; and Caracas, Venezuela.


    We had too many fumbles; we lost the game.


    I know you don’t like broccoli; nonetheless it is very good for you. Michelle
    drives a Jaguar; Sonya drives a Porsche.


    I have finished the main course; now I have to make dessert. Spring brings gentle
    rains and warmer weather; in addition to thunderstorms and hail.


    She calls it the bathroom; I call it the loo.


    Mom wants the chores completed; moreover she wants them done properly.


    I will be there as soon as I finish working; that is a promise I will definitely
    keep.


    She didn’t see the other car coming; now her car has a huge dent. There is mounting
    evidence of global warming; of course some people will never believe it.


    # The Credibility Loop


    ### Now and then


    In the old world we went to school to get information, we trusted legal and other
    authorities and consumed advertising as entertainment. Most people at the age
    30+ remember a time when everybody arrived at the cinema ten minutes before the
    movie started just to see the commercials. Today we get information nearly everywhere.
    We question authorities as they serve the system, not the people, and advertising
    has become or the most unreliable kind of information. Advertising is one-way
    communication and today the consumer wants and demand interaction.


    We are getting more critical, well-informed and we want to search and find information
    ourselves. It''s more or less a rule that we frequently ask friends or small communities/subcultures
    about references; we certainly don''t believe an ad page. The advertising industry
    has for a long time produced lowrefined but over-paid material, and this will
    not be possible in the future. We all know that in today''s media buzz it''s hard
    to get your voice heard, and one more advertising campaign is not the best solution
    to get you through the noise.


    It''s the phenomenon of advertising itself question, and all the (in all other
    senses) smart businessmen/women that are holding yesterday''s advertising culture
    under their wings. There are lots of examples that advertising doesn''t boost
    sales. So why do we still have a culture of an "advertising-landscape", with expensive
    ads that do not generate what they should generate?


    ### Fear


    Which fundamentals are used for setting up a media budget? We can only speculate,
    but we can certainly say that the psychological impact is heavy. The hunger for
    safety and the fear for failure are stronger than questioning what''s done before
    and the outcome of it.


    An expensive and unsuccessful advertising campaign can''t be justified due to
    financial or rational arguments. But with emotional and psychological reasons
    this often happens. What we are seeing is a global mass psychosis where a group
    of companies (advertising agencies) with success are selling a product much overrated.
    How could this happen? Has advertising turned into a very expensive insurance
    premium?


    ### Perception


    The perception of the recipient has changed. With Internet, and in some parts
    the globalization (from a positive point of view) people today have a unique possibility
    to question the power of advertising. Yesterday it took days or months to spread
    information that today takes a second. Now people prefer to get their and advice
    directly from searching on the web, from friends influential groups. An example:
    if you are going to New York and want to stay at a special hotel, would you check
    the hotel ads? Not likely. You rather ask a friend or read the hotel reviews.
    Few would trust the hotel ads: they are subjective and only deliver hotel message.


    ### GNP


    Companies advertising for more than countries GNP. On one billion (1,000,000,000)
    dollars, low spent on advertising in 2004 world. Only in the US it was spent at
    least 500 billion (Pros & most 29 billion). This with 11 billion (118,000,000)
    that was spent 2005 world on, or is this possible for anything that, the US marketing
    says as "...advertising little so".


    ### Before the line


    We would like to challenge the GNP facts with a line and how; many people receiving,
    and how much for could be saved with just a fragment of this? Interpreting and
    important, but in this issue we decided to content on the situation. We have an
    alternative to today''s advertising-land as we think it''s more creative and brand
    development of new products. We call it The Credibility Loop


    ### Before the line


    You need along facts just to be on the market now. All competitors have good service,
    good distribution, good people, good price, good communication and good... Only
    there is a saying that all products have function, performance and price. The
    only thing that differentiates their products from competitors is design. Why
    not putting most efforts developing good design then? There''s a lot of talking
    going inside the creative industries concerning Above the line (ATL) and Below
    the line (BTL) communication. In the red corner sits ATL, which concerns traditional
    advertising in magazines, radio, TV and outdoor prints. In the blue corner we
    will find BTL, which concerns PR, web, retail communication etc. If you ask us,
    ATL is knocked down. But we take the issue further and introduce our own BTL:
    Before the line. Our BTL dances like a butterfly and stays like a bee... Faster
    horses


    Up to today the marketing people have been in charge for entering new products
    to the market, and this (only) because their job is to know what people like and
    want. But do they really know what people need? It''s more interesting to see
    what people are doing instead of listening what they are saying. Look at your
    children; they do like you do, not like you tell them to do. And instead of "a
    vehicle with a motor on four wheels", Henry Ford would probably got the answer
    "faster horses" on a direct question about people'' needs.


    We think the marketing people quite often have the same narrow-minded thinking.
    A lot of them don''t see beyond existing categories and often goes for what''s
    already available and possible.


    So, let a creative design culture sweep through the organization and combine the
    innovative minds from the R&D department with the outgoing from the marketing
    department. It is only by combining different skills and minds you can create
    real innovations that give you the possibility to change the future.

