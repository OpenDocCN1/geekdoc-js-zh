    ## JavaScript 简介


    JavaScript 是一种解释型编程语言，基于 ECMScript 标准。该语言的定义非常广泛，因为它可以定义为基于原型的过程化的、命令式的、弱类型的和动态语言。


    JavaScript 主要作为客户端编程语言，作为 浏览器的一部分实现，允许开发者以改进的方式实现网页中的用户界面和动态功能，尽管也有服务器端的 JavaScript
    实现 (SSJS)，但该语言的流行完全归功于客户端实现。JavaScript 也可以在网络应用程序之外使用，例如为 PDF 文档和桌面小组件添加交互功能。


    JavaScript 的设计语法与 C 相似，尽管它借鉴了 Java 编程语言的名称和约定。然而，Java 和 JavaScript 的名称之间没有关系，语法也不同。JavaScript
    最初由 Netscape 的 Brendan Eich 开发，后来被更名为 JavaScript。该名称的变化大约发生在 1995 年 Netscape 在
    Navigator 2.0 版本中添加对其支持时。JavaScript 这个名字被创造出来，赋予了该语言 Java 的延伸，并被标记为新网络编程的脚本语言。


    微软作为 Internet Explorer 3 的一部分开发了类似的类似的客户端编程语言。微软将其称为 JScript 以避免与品牌相关的问题。"javascript"
    和 "js" 术语经常互换，但 JavaScript 并非 100% 兼容 ECM 规范。为了避免这些问题，世界网联盟 (W3C) 设计了标准的文档对象模型
    (DOM，或文档模型)，分别在 Internet Explorer 3.0 和 Navigator 4 版本中实现。


    1997 年，曾有一项将 JavaScript 提交给 ECM 制造商的提案。1997 年，它被采用为 ECM 标准。JavaScript 还是 ISO 标准，并成为了最常用的编程语言。


    注意：JavaScript 是 Oracle 的注册商标。它在 Oracle 及其当前实体创建的产品下使用。


    ## JavaScript 的用途


    今天 JavaScript 存在于大多数页面中。很有可能你正在查看的页面包含了 JavaScript 代码。尝试一下这个活动：右键点击网页，然后点击“查看源代码”。你应该能在代码的某处找到这个词。


    虽然 HTML 标记语言允许网页开发者格式化内容，但 JavaScript 允许他们让页面动态化。例如，HTML 允许加粗文本、创建文本框和按钮，而 JavaScript
    允许更改页面上的文本、创建弹出消息以及验证文本框中的文本，以确保必填字段已填写。JavaScript 通过允许用户与网页交互、点击元素和更改页面，使网页更具动态。


    ## JavaScript 能为你做什么


    让我们后退一步，数数 JavaScript 的优点：


    JavaScript 非常易于实现。你只需要将代码放在 HTML 文档中，并告诉浏览器它是 JavaScript 即可。


    JavaScript 在用户的计算机上运行——即使在他们离线状态下也是如此！


    JavaScript 允许你创建高响应的界面，改善用户体验并提供动态功能，而无需等待服务器响应并显示另一个页面。JavaScript 可以在用户需要时将内容加载到文档中，而无需重新加载整个页面——这通常被称为
    Ajax。


    JavaScript 可以测试浏览器中的可能性并帮助修复问题——例如修复布局问题。对于一种直到最近才被 ECM 制造商采纳的语言来说，这已经很多了。JavaScript
    是一种 ECM 标准并成为了最常用的编程语言。


    注意：JavaScript 是 Oracle 的注册商标。它在 Oracle 及其当前实体创建的产品下使用。'
