    JavaScript is a client-side scripting language. When you open a web page, your
    web browser first downloads all the necessary files from the server to display
    that page correctly. Those necessary files are HTML, CSS, Images, Videos, etc
    and the JavaScript files too. After completing download the browser displays that
    page on its window and any script linked with it will run from the downloaded
    script file.


    In Ajax technology, user inputs and other data are sent to the web server through
    JavaScript. JavaScript creates `XML_HTTP_REQUEST_OBJECT` to connect with the server,
    submit data to it, and to request a response from the server. When response comes,
    a JavaScript event fires and the function associated with that event is then executed.
    So in Ajax technology JavaScript is only used to transfer data between client
    side and the server side while the main program, i.e. data processing is executed
    at the server end, in PHP or any other-side language.


    As JavaScript runs from the client computer its execution time is very short,
    almost instantaneous. View can run JavaScript without being connected with the
    server as well. But in Ajax, viewers must be connected to the server. Here execution
    time is much longer which depends on their Internet connection speed, server hardware
    and number of bytes to be transferred between client side and server side.


    In terms of server security JavaScript is absolutely safe since it doesn''t transfer
    any user input from client side to the server. But in Ajax you have to take special
    care to prevent any malicious data from the bad users. In JavaScript you can''t
    hide your source code. Users can easily read your source code from source view
    which is running on their computer. But in Ajax data processing takes place at
    the server end so user can''t see the source.


    In Ajax you can support your program with server data. For a long program, if
    you use JavaScript to implement it, the size of your web page will be larger.
    So it will take longer to download which is bad feature. But in Ajax you can run
    long program processing all of data, still your page stays small. Since all browsers
    do not follow standard it is not easy to write browser-independent JavaScript.
    JavaScript are only used in specifications while of Ajax is unlimited.


    ## CSS - The Basics


    Thinking about CSS but want to learn what you need to know, or need to learn before
    joining the? Let me begin by saying CSS can reduce your time at the computer.
    But knowledge you need to learn and is CSS compatible with search engines and
    your browsers? These are some questions I''ll try to answer, as well as explaining
    a little about what CSS is all about. What CSS stands for Cascading Sheets. CSS
    is a set of formatting instructions that controls the look of a web page or pages.
    Some of the browsers that support CSS is (Firefox, IE3 or later, NN4 or later).
    You may say, great this will definitely save some time. So fast, you also need
    to know that though the majority of browsers understand CSS, they do not fully
    support all of its capabilities. XHTML - XHTML is Extensible Markup Language.
    XHTML is HTML with strict rules that adds conformity and is 100% XML compliant.
    So you should be familiar or become more comfortable with HTML, XHTML, and the
    style properties of CSS What can you do with CSS


    You can build your layout, adjusting size and color of your headings or body text,
    as well as positioning your pictures. This translates into pages being programmed
    once, without the choice of inputting the same coding into each of your web pages
    manually. Translated, elimination of duplicate formatting. How to get the Search
    Engines to See Your Copy


    It has been said that the Search Engines still have some problems with understanding
    CSS. But if you want to use CSS, is there a way to get the search engines to see
    what you want.


    1. Keep your text clean, if you have too much garbage in your web page, then the
    spiders will have a difficult time in determining what is relevant and what is
    not. Thus CSS keeps your page clean, without the redundant coding needed for each
    element. Here is example of how to code:


    ```

    h1 { font-size: 18px; bold; }

    ```


    ## Syntax of CSS


    First, CSS can be written within text editor. But the text file must be saved
    with a CSS extension. Syntax of CSS consists of selector and declaration. The
    selector is the identifier within the body of your web page; the declaration is
    the code you want to put as property and rule. Let you want all your H1 headings
    to be green, with font Arial. The code for CSS would follow:


    `selector { property: value; }`## Placement of CSS


    There are three places to put your CSS: In the Head (internal), in external file,
    or within individual tag (inline). Internal - used within a web page that have
    a style. Inline - code with content. Sometimes you need to use it, but this style
    does eliminate the need of using a stylesheet. External - The CSS is separate
    from the body of the web page and is linked with the web page. Thus, to link an
    external file into a page you will need to use the link tag. Example:


    ```html

    <link rel="stylesheet" type="text/css" href="NameofCSS.css"> (goes in the head
    section after the title tag) Which way do you? If you have a large site or a site
    that will be expanding, an external file would be a better way to quickly and
    easily manipulate all your web pages at once Watch out for Spam


    But with anything on the Internet, CSS can be used for the good and the bad. And
    obviously, if you want to keep your site up and running for a long time, some
    CSS techniques should be avoided. Why? Because some CSS techniques can be considered
    spam by search engines and thus, ban your site if you use the techniques. blacklist
    tactics include such as: 1) using CSS to hide text-from headlines to body from
    the human eye; 2) hiding and bolding or italicizing copy for search spiders benefit
    only. To conclude, CSS can and is a viable way to making your web pages easier
    to maintain-if the majority of pages follow the same format. If you are not all
    with CSS, then take time to look at some tutorial. It''s very informative and
    can get you started with CSS.## Conclusion


    JavaScript is a wonderful technology to use on the web. It is not that hard to
    learn and it is very versatile. It plays nicely with other web technologies such
    as HTML and CSS and can even interact with plugins such as Flash. Using JavaScript
    can make online systems offline and once the computer goes online.

