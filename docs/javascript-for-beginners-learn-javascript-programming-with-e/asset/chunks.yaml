  trans: '

    JavaScript 是一种客户端脚本语言。当你打开一个网页时，你的浏览器会首先从服务器下载所有必要的文件以正确显示该页面。这些必要的文件包括 HTML、CSS、图像、视频等，也包括
    JavaScript 文件。下载完成后，浏览器会在窗口中显示该页面，任何与其链接的脚本都将从下载的脚本文件中运行。


    在 Ajax 技术中，用户输入和其他数据通过 JavaScript 发送到 Web 服务器。JavaScript 创建 `XML_HTTP_REQUEST_OBJECT`
    来与服务器连接、提交数据并请求服务器响应。当响应返回时，会触发 JavaScript 事件，然后执行与该事件相关的函数。因此，在 Ajax 技术中，JavaScript
    仅用于在客户端和服务器之间传输数据，而主程序（即数据处理）在服务器端使用 PHP 或任何其他服务端语言执行。


    由于 JavaScript 运行在客户端计算机上，其执行时间非常短，几乎是瞬时的。视图也可以不连接服务器的情况下运行 JavaScript。但在 Ajax
    中，视图必须连接到服务器。这里的执行时间要长得多，取决于它们的互联网连接速度、服务器硬件以及客户端与服务器之间传输的字节数。


    在服务器安全方面，JavaScript 是绝对安全的，因为它没有从客户端向服务器传输任何用户输入。但在 Ajax 中，你必须特别小心以防止来自恶意用户的任何恶意数据。在
    JavaScript 中，你无法隐藏源代码。用户可以很容易从运行在他们计算机上的源代码视图中读取你的源码。但在 Ajax 中，数据处理发生在服务器端，因此用户看不到源码。


    在 Ajax 中，你可以使用服务器数据来支持你的程序。对于一个长程序，如果你使用 JavaScript 来实现它，你的网页尺寸将会更大。这样下载就会花费更长时间，这是一个糟糕的特性。但在
    Ajax 中，你可以运行处理所有数据的长程序，而你的页面仍然保持很小。由于并不是所有浏览器都遵循标准，因此编写与浏览器无关的 JavaScript 容易。JavaScript
    仅用于规范中，而 Ajax 的应用是无限的。


    ## CSS - 基础


    正在考虑 CSS 但想了解需要知道的内容，或者在加入之前需要学习什么？让我先说一下，CSS 可以减少你坐在电脑前的时间。但你需要学习的知识是什么？CSS 是否与搜索引擎和你的浏览器兼容吗？这些都是我将尝试回答的问题，同时也会简单介绍一下
    CSS 的本质。CSS 代表级联样式表（Cascading Sheets）。CSS 是一组格式指令，用于控制网页或多个页面的外观。支持 CSS 的浏览器包括（Firefox、IE3
    或更高版本、NN4 或更高版本）。你可能会说，太棒了，这绝对会节省一些时间。如此，你也需要知道，尽管大多数浏览器都理解 CSS，但它们并没有完全支持所有的功能。XHTML
    - XHTML 是可扩展标记语言（Extensible Markup Language）。XHTML 是带有严格规则的 HTML，它增加了一致性并且 100%
    符合 XML 标准。因此，你应该熟悉或更习惯 HTML、XHTML 以及 CSS 的样式属性。你可以用 CSS 做什么


    你可以构建构建布局，调整标题或正文文本的大小和颜色，还可以定位你的图片。这意味着页面只需要编写一次，而无需手动在你的每个网页中输入相同的代码。翻译过来，就是消除了重复的格式。


    如何让搜索引擎看到你的文案


    有人说，搜索引擎在理解 CSS 方面仍然存在一些问题。但如果你想使用 CSS，是否有方法让搜索引擎看到你想展示的内容。


    1. 保持你的文本整洁，如果你在网页中有太多垃圾内容，那么爬虫将难以判断哪些是相关的，哪些不是。因此，CSS 能够让你的页面保持整洁，而无需为每个元素编写冗余代码。这里有一个代码示例：


    ```

    h1 { font-size: 18px; bold; }

    ```


    ## CSS 语法


    首先，CSS 可以在文本编辑器中编写。但该文本文件必须以 CSS 扩展名保存。CSS 的语法由选择器（selector）和声明（declaration）组成。选择器是你网页体内的标识符；声明是你想要作为属性和规则的代码。假设你想让你所有的
    H1 标题都是绿色的，字体为 Arial。CSS 的代码如下：


    `selector { property: value; }`## CSS 的放置位置


    有三个放置 CSS 的地方：在 Head 中（内部）、在外部文件中或单个标签内（内联）。内部 - 用于具有样式的网页内。内联 - 带有内容的代码。有时你需要使用它，但这种样式消除了使用样式表的需求。外部
    - CSS 与网页主体分离并与网页链接。因此，要将外部文件链接到页面中，你需要使用 link 标签。示例：


    ```html

    <link rel="stylesheet" type="text/css" href="NameofCSS.css"> (位于 head 部分的 title
    标签之后) 你喜欢哪种方式？如果你有一个大型网站或一个将扩展的网站，外部文件是快速方便地一次性操作你所有网页的更好方法。


    注意垃圾信息


    但对于互联网上的任何事物，CSS 既可以用于善意，也可以用于恶意。显然，如果你想让你的网站长期运行，应该避免某些 CSS 技术。为什么？因为某些 CSS 技术可能被搜索引擎视为垃圾信息，从而如果你使用这些技术，它们会封锁你的网站。黑名单策略包括：1)
    使用 CSS 将人类肉眼隐藏从标题到正文的文本；2) 仅为了搜索爬虫的利益而隐藏、加粗或斜体文案。总结来说，CSS 可以并且是让你的网页更易维护的一种可行方法——如果大多数页面遵循相同的格式。如果你还不精通
    CSS，请花时间看一些教程。它们非常有启发性，可以帮助你开始学习 CSS。## 结论


    JavaScript 是一种用于网络的奇妙技术。它并不难学，而且非常通用。它与 HTML 和 CSS 等其他网络技术配合良好，甚至可以与 Flash 等插件交互。使用
    JavaScript 可以让在线系统变为离线，并在计算机上线后恢复。


