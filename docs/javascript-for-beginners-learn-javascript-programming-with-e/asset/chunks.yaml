  trans: '


    `language="type/javascript">` 红色部分是完全可选的，因为浏览器默认认为 `<script>` 标签是 JavaScript，尽管出于验证考虑，你仍然应该包含它。上述示例的第二行和倒数第二行是
    `<!--` 和 `//-->`，它们是为 JavaScript 定制的 HTML 注释标签。建议你包含它们，以向不支持 JavaScript 的老旧浏览器隐藏你的代码。如果不包含它们，且有人正在使用此类浏览器，浏览器将把你的所有代码作为文本“dump”到屏幕上，换句话说，那可真不太看了！此脚本唯一的“功能性部分”是
    `document.write(".......")` 部分。它基本上是将你放在引号内的任何内容写入页面。不要太担心为什么会这样，我们稍后会详细讨论。我们用
    `</script>` 结束整个代码，这会终止你的脚本并让你回到 HTML。


    像 HTML 一样，你可以在 JavaScript 代码中插入注释。JavaScript 注释与 HTML 注释不同，后者是注释掉脚本中的某些行，使其不被解释。JavaScript
    注释的语法如下：


    `//comment here`


    用于单行注释，或者


    ```javascript

    /*

    comment here */

    ```


    用于多行注释。


    例如：


    ```html

    <script language="JavaScript"> <!--


    //这个脚本什么都不做，而且没用！ /*


    嘿，别把我也拉进来这个！


    */


    //-->


    </script>

    ```


    好了，我们现在准备好开始真正的编程了！


    JavaScript 像许多编程语言一样，依赖对象、函数和事件处理器来创建可运行的程序。如果你对这些术语以及如何使用它们一无所知，不要担心。等我们完成这个教程时，你就会了。


    ## JavaScript 和 HTML


    你可以将 JavaScript 视为 HTML 的扩展；或者说是一个插件吧。


    它是这样工作的：HTML 标签创建对象；JavaScript 让你操作这些对象。例如，你使用 HTML 的 `<body>` 和 `</body>` 标签创建一个
    Web 页面或文档。如表 1 所示，创建文档后，你可以使用 JavaScript 与其交互。例如，你可以使用一种特殊的 JavaScript 结构 `onload`
    事件处理器在文档加载到 Web 浏览器时触发操作——也许是播放一段简短的欢迎曲。使用 JavaScript 交互的其他 HTML 对象示例还包括窗口、文本字段、图像和嵌入的
    Java 应用。


    表 1：创建和操作对象


    ![](img/Image00003.jpg)


    要将 JavaScript 添加到 Web 页面，你要做的只是将 JavaScript 代码嵌入 HTML 文件中。在嵌入 JavaScript 代码的行下方，你可以响应事件处理器或
    HTML 链接引用或调用该 JavaScript 代码。


    在 HTML 文件中嵌入 JavaScript 代码时，你有两个选择：


    - 你可以使用 `<script>` 和 `</script>` 标签将 JavaScript 代码直接包含在 HTML 文件中。


    在下面的示例中，名为 `processOrder()` 的 JavaScript 函数定义在 HTML 文件的顶部。在 HTML 文件的下方，JavaScript
    函数与事件处理器关联——具体说是 `processOrder` 按钮的 `onclick` 事件处理器。（换句话说，当用户点击 processOrder 按钮时，`processOrder()`
    中包含的 JavaScript 代码就会运行。）


    ```html

    <html>

    <head>

    <script language="JavaScript">

    function processOrder() {

    // 这里有更多 JavaScript

    }

    </script>

    </head>

    <body>

    <form name="myForm">

    <input type="button" name="processOrder" value="Click processOrder" onclick="processOrder();">

    </form>

    </body>

    </html>

    ```


    你可以使用 `<script>` 和 `</script>` 标签包含一个外部 JavaScript 文件（仅包含 JavaScript 和 .js 扩展名）。在下面的示例中，JavaScript
    `processOrder()` 函数定义在 `myfile.js` 中。当用户点击链接时，该函数会被触发或调用。


    ```html

    <html>

    <head>

    <script language="JavaScript" src="myfile.js"></script>

    </head>

    <body>

    <a href="javascript:processOrder();">点击这里</a>

    </body>

    </html>

    ```


    Web 页面不仅仅由 HTML 组成，JavaScript 提供的是 HTML 对象。JavaScript 还提供了浏览器特定的插件（如 RealPlayer
    和 Adobe）、你可以操作的当前浏览器对象。构成网站的所有对象——HTML 对象和 JavaScript 内置的特殊对象——被称为文档模型 (DOM)。


    ## HTML 基础


    如果你对 HTML 一无所知，你应该从基础开始；也许可以在网上读一些东西。一旦你掌握了 HTML 基础，剩下的应该很容易。然而，和任何学科一样，HTML 必须留心学习。你不能跳过任何一步。建议一次关注
    HTML 的一个方面，只有在理解了简单内容后才进入高级步骤。再给一个建议——不要因为基础知识看起来需要学很久而感到沮丧；这一切都是值得的。首先，你必须知道
    HTML 是什么以及为什么要用它。HTML 是超文本标记语言的缩写，它是一种标记标记语言。简单来说，HTML 是一个由标记组成的纯文本文件。当浏览器收到打开网页的指令时，它会查找页面中的
    HTML 代码。然后浏览器会将这些代码转换为布局、图像和指向其他网站的链接。必须记住的其他基础知识之一是 HTML 是文本文件，因此可以使用简单的文本编辑器编写。一些流行的文本编辑器
    FrontPage 和 Dreamweaver 将允许你使用 Word 创建页面。现在，这有多容易呢？


    为了让事情变得更容易，这里有一些你一定会喜欢的更多 HTML 基础。一旦你得到了页面布局，你就可以自己让代码运行。此外，如果你仍然认为自己编码很难，例如，你可以将代码放在扩展名为
    `.html` 的文件中。你必须知道的是标签。标签告诉浏览器如何做。然后你必须了解结构。


    ## 你知道 HTML 是什么吗？


    HTML 代表超文本标记语言。


    它本质上是人们在世界网上进行交流和认可彼此的方式，因为它是核心语言。最新版本的超文本标记语言 HTML5 最近发布，具有可以自豪的新功能和元素。它非常容易使用；它的设计就是如此。你不需要成为程序员就能使用它。它是一种旨在创建网站的计算机语言。这些网站可以被任何连接到互联网的人查看。'
