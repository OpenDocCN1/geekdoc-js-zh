    \ the bag. They are all basically the same but different colors. Even though they\
    \ are different colors, they are all chocolate candy with a hard candy A bag of\
    \ M-M's is an array of datatype M-M's. It is a collection of candy.\n\n### How\
    \ do I declare an array?\nDeclaring an array is very much like declaring other\
    \ variables. The only difference is that you are declaring a variable that will\
    \ hold more than one object. Let's compare these two declarations.\n\n```csharp\n\
    String strEmotion = \"happy\";\nString[] strEmotions = {\"happy\",\"sad\",\"elated\"\
    ,\"afraid\",\"angry\",\"peaceful\"};\n```\n\nBoth of the variables above, `strEmotion`\
    \ and `strEmotions`, have been declared using Explicit Declaration which means\
    \ the value is set at the same time they are created.\n\n### Putting it to work\n\
    In this example, we have an array of `System.Drawing.Color` that we will use to\
    \ change the background color of a form. This very simple application will help\
