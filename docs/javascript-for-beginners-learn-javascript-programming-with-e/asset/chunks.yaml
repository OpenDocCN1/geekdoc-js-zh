  trans: "\n\n这主要导致了验证脚本，当出现错误时阻止用户向服务器发送表单，以及简单的转换器和计算器。此外，我们还设法制作了一些极其没用的东西，比如提示框询问用户的姓名，只为了之后将其打印出来。\n\
    \n我们使用的另一个东西是 `document.write()` 向文档中添加内容。我们还处理过弹出窗口和框架（frames），在尝试让它们相互通信时耗尽了许多心力并抓掉了许多头发。一想到这些大多数技术就应该让任何开发者反复摇摇头，蜷缩成胎儿并说“让它们消失吧”，所以我们不要纠结于这些了——有更好的使用\
    \ JavaScript 的方法！\n\n## 进入 DOM 脚本\n\n当浏览器开始支持并实现文档对象模型（DOM）时（这允许我们与网页进行更丰富的交互），JavaScript\
    \ 开始变得越来越有趣。\n\nDOM 是文档的对象表示。例如，上文的一段文字（通过“查看源代码”检查其源码）在 DOM 语言中是一个 `nodeName`\
    \ 为 `p` 的元素节点。它包含三个子节点——一个 `nodeValue` 包含“当浏览器开始支持并实现 DOM 的”的文本节点，一个 `nodeName`\
    \ 为 `a` 的元素节点，以及另一个 `nodeValue` 为“这允许我们与网页进行更丰富的交互，JavaScript 开始变得越来越有趣。”的文本节点。该子节点还有一个名为\
    \ `href` 的属性，其有一个值，以及一个 `nodeValue` 为“文档对象模型(DOM)”的文本节点子节点。\n\n你也可以使用树形图直观地表示这段文字，如图\
    \ 2 所示。\n\n![](img/Image00001.jpg) 图 2：我们的示例 DOM 树的可视化表示。\n\n用人类的话说，你可以说 DOM 解释了文档中所有内容的类型、值和层级结构——你现在不需要更多。\n\
    \n访问文档中的任何元素并操纵它的外观、内容和属性。\n\n创建新的元素和内容，并在需要时将它们应用于文档中。\n\n这意味着我们再也不需要依赖窗口、框架、表单和丑陋的警告框（alerts），并且以良好的样式在文档中向用户提供反馈，如图\
    \ 3 所示。\n\n![](img/Image00002.jpg)\n\n图 3：使用 DOM 你可以创建更美观、侵侵入性的错误消息。\n\n结合事件处理，这是一个创建交互和美观界面的强大武器库。\n\
    \n事件处理意味着我们的代码对浏览器中发生的事情做出反应。这些可能是自动发生的事情——如加载完成——但大多数时候是用户对浏览器的操作。用户可能会调整窗口大小、滚动页面、点击链接和按钮。通过事件处理，我们可以等待事情发生，并让网页按需对操作做出响应。过去，点击任何链接都会带你进入另一个文档，现在我们可以劫持此功能并显示诸如显示隐藏面板或获取信息并使用它。\n\
    \n## JavaScript 的其他现代用途\n\n这基本上就是我们用 JavaScript 做的。增强旧的、过时的网页界面——点击链接、输入信息和发送表单等——使其对用户的响应更灵敏。例如：注册表可以检查名称是否可用，防止你不得不忍受令人沮丧的页面刷新。搜索框可以在你输入时根据你输入的内容提供建议结果（例如输入“bi”可以带来来自该字符串的建议，如“bird”、“big”和“busy”）。这种用法被称为自动补全。不断变化的信息可以自动加载以供用户交互，例如比赛结果或股市。静态且运行冗余的信息可以在用户访问时加载一次。网站导航可以在用户激活菜单项时按需进行。JavaScript\
    \ 可以修复布局问题。使用它你可以找到元素在页面上的位置以及窗口的尺寸。利用这些信息你可以防止重叠和其他问题。例如假设你有一个多级菜单；通过在显示子菜单之前检查它是否显示，你可以防止滚动条出现或菜单项重叠。JavaScript\
    \ 可以增强 HTML 给予我们的界面。虽然有一个文本输入框很不错，但你可能想要一个组合框（combo），让你从预设值列表中选择或输入自己的值。你可以制作页面元素的动画——显示和隐藏信息，或突出显示页面的特定部分——这可以带来更好、更丰富的用户体验。\n\
    \n## 明智且负责任地使用 JavaScript\n\nJavaScript 没有没有什么是你做不到的——尤其是当你将其与 Canvas 或 SVG 等其他技术结合时。然而，巨大的力量伴随巨大的责任，在使用\
    \ JavaScript 时你应该始终记住以下几点。\n\nJavaScript 可能不可用——这很容易测试，所以并不是真的问题。然而，依赖 JavaScript\
    \ 的东西应该带有这种心态创建，并且你应该确保如果 JavaScript 不可用，你的网站不会崩溃（基本功能不可用）。\n\n如果使用 JavaScript\
    \ 没有帮助用户更快速、更高效地实现目标，那么你可能用错了。通过使用 JavaScript，我们经常打破人们多年来使用网络习惯的惯例（例如点击链接去到其他页面）。这主要导致了验证脚本，当出现错误时阻止用户向服务器发送表单，以及简单的转换器和计算器。此外，我们还设法制作了一些极其没用的东西，比如提示框询问用户的姓名，只为了之后将其打印出来。\n\
