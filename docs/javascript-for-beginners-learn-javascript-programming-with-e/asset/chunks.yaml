    `language="type/javascript">` The part in red is purely optional, as the browser
    by default assumes a `<script>` tag to be JavaScript, though you should include
    it nonetheless for validation reasons. The second and next to last lines of the
    above example are `<!--` and `//-->`, which are HTML comment tags tailored for
    JavaScript. It is recommended you include them to hide your code against very
    old browsers that don''t support JavaScript. If you don''t include them and someone
    is using such a browser, the browser will just "dump" all your code as text onto
    the screen, in other words, not a pretty sight! The only "functional part" of
    this script is the `document.write(".......")` part. It basically writes to the
    page whatever you put inside the quotation marks. Don''t worry so much about why
    this is so, we will discuss this in detail later. We end this entire code with
    `</script>` terminates your script, and brings you back to html.


    Like html, you can insert comments in your JavaScript codes. JavaScript comments
    are different from HTML comments, with the latter commenting out certain lines
    within your script so they don''t get interpreted. The syntax for JavaScript comments
    are:


    `//comment here`


    for single-lined comments, or


    ```javascript

    /*

    comment here */

    ```


    for multi-ones.


    For example:


    ```html

    <script language="JavaScript"> <!--


    //this script does nothing and is useless! /*


    Hay, don''t involve me


    in this!


    */


    //-->


    </script>

    ```


    Ok, we are now ready to proceed to some real programming!


    JavaScript, like many programming languages, relies on objects, functions, and
    event handlers to create workable programs. If you know absolutely nothing about
    these technical terms and how to use them, don''t worry. By the time we''re through
    with this tutorial, you will.


    ## JavaScript and HTML


    You can think of JavaScript as an extension to HTML; an add-on, if you will.


    Here’s how it works. HTML tags create objects; JavaScript lets you manipulate
    those objects. For example, you use the HTML `<body>` and `</body>` tags to create
    a Web page, or document. As shown in Table 1, after that document is created,
    you can interact with it using JavaScript. For example, you can use a special
    JavaScript construct called the `onload` event handler to trigger an action —
    play a little welcoming tune, perhaps — when the document is loaded onto a Web
    browser. Examples of other HTML objects that you interact with using JavaScript
    include windows, text fields, images, and embedded Java apps.


    Table 1: Creating and Working with Objects


    ![](Image00003.jpg)


    To add JavaScript to a Web page, all you have to do is embed JavaScript code in
    an HTML file. Below the line in which you embed the JavaScript code, you can reference,
    or call, that JavaScript code in response to an event handler or an HTML link.


    You have two choices when it comes to embedding JavaScript code in an HTML file:


    - You can use the `<script>` and `</script>` tags to include JavaScript code directly
    into an HTML file.


    In the example below, a JavaScript function called `processOrder()` is defined
    at the top of the HTML file. Further down in the HTML file, the JavaScript function
    is associated with an event handler — specifically, the `processOrder` button’s
    `onclick` event handler. (In other words, the JavaScript code contained in `processOrder()`
    runs when a user clicks the processOrder button.)


    ```html

    <html>

    <head>

    <script language="JavaScript">

    function processOrder() {

    // More JavaScript here

    }

    </script>

    </head>

    <body>

    <form name="myForm">

    <input type="button" name="processOrder" value="Click processOrder" onclick="processOrder();">

    </form>

    </body>

    </html>

    ```


    You can use the `<script>` and `</script>` tags to include a external JavaScript
    file (containing only JavaScript and a .js extension). In the example below, the
    JavaScript `processOrder()` function is defined in `myfile.js`. The function is
    triggered or called when the user clicks the link.


    ```html

    <html>

    <head>

    <script language="JavaScript" src="myfile.js"></script>

    </head>

    <body>

    <a href="javascript:processOrder();">Click here</a>

    </body>

    </html>

    ```


    Web pages aren''t made of HTML alone, JavaScript provides more than just HTML
    objects. JavaScript provides browser-specific plugin-ins (such as RealPlayer and
    Adobe), current browser objects you can work with. Together, all the objects that
    make a Web site — HTML objects, and special objects built into JavaScript — are
    known as the document model (DOM).


    ## HTML Basics


    If you know nothing about html, you should definitely start from the basics; perhaps
    some reading online. Once you''ve grasped the html basics, the rest should be
    easy. However, like every subject, html must be learnt with care. You mustn''t
    miss a step. It''s advisable to follow one aspect of html at a time, and move
    to advanced steps only if you understand the simpler ones. Just one more piece
    of advice - don''t get discouraged because basics seem to take forever to learn;
    it will all be worth it.


    To begin with, you must know what html is and why it''s used. Well, html is the
    abbreviation for HyperText Markup Language and it''s a scripting language. In
    simple, html is a plain text file that consists of markup. When a browser is given
    an instruction to open a webpage, it''ll look for the html codes in the page.
    Then the browser will convert those codes to layout, images and links to other
    sites. One of the other basics you must keep in mind is that html are text files
    and therefore, can be written using the simplest text editors. Some of the popular
    text editors, FrontPage and Dreamweaver will let you use Word to create pages.
    Now, how easy can that be?


    To make things even easier, here are some more html basics that you''d undoubtedly
    find attractive. Once you get the page layout, you can turn the code yourself
    is functional. Also, if you still think coding yourself is hard, for instance,
    you can put the code in an file extension `.html`. The important thing you must
    know is tags. A tag tells the browser how. Then you must know the structure.


    ## Do You Know What HTML Is?


    HTML stands for HyperText Markup Language.


    It is essentially how people communicate and acknowledge each other on the World
    Web as it is the core language. The latest version of HyperText Markup Language,
    HTML5, has recently launched with new features and elements to boast about. It
    is very easy to use; it was designed that way. You don''t have to be a programmer
    to use it. It is a computer language designed to allow website creation. These
    websites can be viewed by anyone else connected to the Internet.

