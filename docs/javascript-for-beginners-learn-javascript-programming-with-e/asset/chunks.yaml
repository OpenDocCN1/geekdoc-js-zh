    ```


    无论你是已经做了多年 Web 设计，还是刚开始学习如何正确构建网站，这都是一段无尽的旅程。一旦你确定了想要学习的语言，就必须学习并完善你的技能。无论你学什么，CSS
    都是一项必须掌握的挑战性技能。不过它并不一定困难，特别是如果你知道一些完成工作的实用小技巧。


    ### 12. box-sizing: border-box;


    这是许多设计师的最爱，因为它解决了内边距（padding）和布局问题。通常，当你给一个框设置特定宽度并添加内边距时，内边距会增加框的大小。然而，使用 `box-sizing:border-box`，这种情况被消除了，框的大小保持原样。


    (Image0004.jpg)


    ### 13. :before


    这个 CSS 选择器允许你选择一个元素，并在每个应用了特定类的元素之前插入内容。假设你有一个网站，想在每个 `h2` 之前添加特定的文本。


    ```css

