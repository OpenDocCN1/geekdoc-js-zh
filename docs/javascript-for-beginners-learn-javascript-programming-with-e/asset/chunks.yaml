    \ of `System.Drawing.Color` is declared and four colors, Green, Red, Yellow, and\
    \ Blue are added at the same time. Notice the brackets `[]` which signify an array\
    \ declaration.\n\n```csharp\nSystem.Drawing.Color[] myArray = {System.Drawing.Color.Green,\
    \ System.Drawing.Color.Red, System.Drawing.Color.Yellow, System.Drawing.Color.Blue};\n\
    ```\n\nBecause we populate the array at the time we declare it, we say that it\
    \ was explicitly declared. Getting a specific value\nAt first it might be little\
    \ confusing because arrays use zero based. This means that the first item in the\
    \ list is in 0 position.\n\n```csharp\nstrEmotions[0] = happy\nstrEmotions[1]\
    \ = sad\nstrEmotions[2] = elated\nstrEmotions[3] = afraid\nstrEmotions[4] = angry\n\
    strEmotions[5] = peaceful\n```\n\n```csharp\nprivate void ChangeColors(object\
    \ sender, EventArgs e)\n{\n    /*Get a reference to the radio button that called\
