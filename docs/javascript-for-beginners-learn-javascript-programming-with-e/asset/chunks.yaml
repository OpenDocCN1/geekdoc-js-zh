- fmt: "\nIf you have a link that calls a phone number when a user taps it on their\
    \ phone, you may have trouble styling it with the traditional active link selector.\
    \ Instead, use the following CSS:\n\n```css\na[href^=tel] { <span class=\"Apple-converted-space\"\
    > color: #FFF;</span> <span class=\"Apple-converted-space\"> text-decoration:\
    \ none;</span> }\n\n\n## Different ways to run a JavaScript function\n\n### 1\
    \ – anchor naked\nMouse cursor may not change on hover in some browsers. CSS could\
    \ be used to solve this problem: `a {cursor:pointer; }`\n\n### 2 – anchor hash\
    \ ref\nMouse hover shows link at # Page may shift to top on IE6, IE7\n\n### 3\
    \ – anchor pseudo\nOld school way of calling the function when the link is clicked.\
    \ Pseudo-protocol refs are not recommended for usability and accessibility reasons.\n\
    \nNowadays considered back programming due to the influx of APIs available.\n\n\
    It’s messy, it’s long, people see it in the status bar and it means nothing. Opera\
    \ doesn’t like `href=\"javascript:[anything]\"`\n\n### 4 – anchor pseudo void\n\
    Using `javascript:[anything]` is considered by some to be bad practice. Pseudo-protocol\
    \ refs can cause IE to enable a waiting state anticipating the page to be replaced\
    \ and automatically disable resource hungry activity. `javascript:[anything]`\
    \ is used for bookmarks.\n\nWhat is `javascript:void(0);`?\n\n...\n\n### 5 – anchor\
    \ return false\nReturn `false` causes the `href=\"#\"` not to be evaluated.\n\n\
    Safer method than using Pseudo-protocol examples above such as page jumps.\n\n\
    `return` can be unreliable at times.\n\n...\n\n### 6 – anchor pretty url/jQuery\n\
    The use will see #some-real-url when they hover the link. If JavaScript is disabled\
    \ they see something informative. ...\n\n```javascript\n$(document).on('click',\
    \ 'a.mylink', function(e) {\n  //prevent the page from going to ref\n  e.preventDefault();\n\
    \  //run the function foo();\n});\n```\n\n## Learning CSS Syntax and Proper Application\n\
    Once you have a solid understanding of CSS and what it can do, the next step is\
    \ understanding the syntax of CSS and the few ways it can be applied to your documents.\n\
    \n## CSS syntax comprises of three elements.\n\n**Selector**: The selector is\
    \ the element within your HTML document you want to style. For instance, if you\
    \ have placed a paragraph tag within your HTML, your selector would be `\"p\"\
    ` - the standard paragraph tag in CSS. If you wanted to apply styles to the entire\
    \ body of your website, you would use `\"body\"` as the selector. At a later time,\
    \ you'll learn how to create your own selectors using the `\"class\"` and `\"\
    id\"` tags.\n\n**Property**: Properties are those elements that can be applied\
    \ to a particular selector. Let's take the paragraph from the above example. A\
    \ few properties you could use to style that selector include `font-family`, `font-size`,\
    \ `color` and a few others.\n\n**Value**: The value is the shape, size, dimension,\
    \ etc. applied to a particular property. For instance, you would apply a value\
    \ of `20px` to the property above if you wanted your paragraph copy to display\
    \ at 20px.\n\n*   Selector: `p {}`\n*   Selector + Property: `p {font-size:}`\n\
    *   Selector + Property + Value: `p {font-size: 20px;}`\n\nNow, let's get into\
    \ the application of CSS. There are three ways you can apply styles to your document.\n\
    \n### Inline Styles\nInline styles mean you are placing the style for a particular\
    \ element within the tag itself. For instance, if you wanted to color the text\
    \ color of a paragraph you would apply `blue;` within your paragraph tag. This\
    \ method is okay but not recommended. If you had a website with 100 pages and\
    \ used inline styles, when a change needed you would have to change all pages\
    \ individually.\n\n### Internal Styles\nInternal styles including your styles\
    \ within the HTML document itself. At the beginning of your document, there are\
    \ `head` tags. Your styles would be placed between tags for reference. You might\
    \ use this method if you had a single page.\n\n### External Styles\nUsing external\
    \ styles are the most effective way using CSS. Your styles are held outside document\
    \ that all HTML files connect. This makes global changes a breeze. Say you wanted\
    \ to change the color of links on your 100 page. Instead of changing each page\
    \ individually you could change the style within external document and there you\
    \ have it. All pages would be changed because they are all linked.\n\n## Why is\
    \ case sensitivity so much important in JavaScript?\nIt’s the nature of the beast.\
    \ Script is written in text, for starts but is not like HTML (which is case-sensitive)\
    \ it is code, and as subject to much browser's internal workings (DOM API).\n\n\
    `var names`: The two variables look alike, but they are different. What is important\
    \ is we recognize it.\n\n```javascript\nfunction Person(name, age){\n  this.name\
    \ = name\n  this.age = age\n}\n\nvar person = new Person(\"Zach\", 29);\n\nWe\
    \ can ignore the part of this code not been covered yet. The point is to show\
    \ that person and Person are two different objects. Person is an object function,\
    \ and person is an instance of that constructor.\n\nconsole.log(person); // {\
    \ name: 'Zach', age: 29 }\nconsole.log(Person); // [Function]\n```\n\nAs it stands,\
    \ you will have to check your capitalization or meet possible negative consequences\
    \ such as syntax errors and other exceptions. Develop a keen eye and remember\
    \ that JS is case sensitive. Nothing we can do to change this.\n\n## Understanding\
    \ Comments\nYou can enter and track comments about individuals and organizations.\
    \ You can review all comments about an individual or all comments entered by a\
    \ specific individual. Because personal comments are subjective and often confidential,\
    \ carefully analyze your institution's needs and requirements for entering and\
    \ tracking comments. You should also be familiar with administrative functions\
    \ and CC group security before setting up or creating comments in your system.\n\
    \nWith the appropriate security access, you can click the Create Comments button\
    \ while on a page in a functional area about that individual or organization to\
    \ attach or review comments to an individual's or organization's record.\n\nYou\
    \ can also navigate through the menus to access the comments pages described in\
    \ this documentation.\n\n### Colons Used in Sentences\n*   There are two choices\
    \ at this time: run away or fight. We knew who would win the game: the Eagles\n\
    *   He wanted to see three cities in Italy: Rome, Florence and Venice\n*   Remember:\
    \ Two can play at that game.\n*   She kept repeating: “I really want that car!”\n\
    *   I wanted to know why I didn’t receive it: I had not.\n*   The states begin\
    \ with: Michigan, Mississippi and Maine\n*   You can pick now: I am feeling much\
    \ better. Never forget this: Think before you speak.\n*   This house has everything\
    \ I need: two bedrooms, a garage.\n*   The town reminded me of childhood vacations:\
    \ the beach.\n*   I have several genres of movies: drama, science and thriller.\n"
