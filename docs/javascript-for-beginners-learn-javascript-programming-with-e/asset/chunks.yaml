  trans: "\n\n现在我们需要将我们的插件文件和 jQuery 库一起引入到主 HTML 页面（index.html）。最佳实践是直接从 Google API\
    \ 服务器引入 jQuery 库，因为它们遍布全球，而不是位于你的单一服务器位置：更近的服务器通常意味着访问者的响应速度更快。从 Google 引入 jQuery\
    \ 的另一个优势是，当访问访问你的网站时，他们的本地缓存中可能已经有了 jQuery 脚本。预缓存的内容通常意味着访问者的加载速度更快。\n\n## jQuery\
    \ 插件结构\n\njQuery 提供了所有必要的钩子（hooks）来帮助你开发我们的插件。但遵循 JavaScript 的良好实践很重要，因此我们必须确保所有内容都留在局部作用范围内。让我们从\
    \ jQuery 插件的基本框架开始：\n\n```javascript\n(function($) {\n\n$.fn.simpleAccordion =\
    \ function() {\n\n  //TODO: simple accordion 插件代码\n\n}\n\n}(}(jQuery));\n```\n\
    \n让我们快速过一下这里发生了什么。通过将所有内容包含在 `(function() {})` 自执行 JavaScript 模式中，我们确保了插件中的所有变量都将安全地留在全局命名空间之外。我们不会与页面上运行的任何其他\
    \ JavaScript 发生冲突，因此我们必须像上面那样隔离我们的代码。\n\n你可能注意到的点是，我们定义插件的方式就像 jQuery 处于“无冲突”模式一样。同样，我们试图避免与页面上的其他\
    \ JavaScript 冲突，因此我们想确保插件不依赖于默认的 `$`，因为它可能被其他库使用。最后，`.fn` 是 jQuery 允许你定义插件的方法，我们将其命名为\
    \ `simpleAccordion`。现在所有部分已就绪，让我们开始构建吧！\n\n## 为我们的插件添加功能\n\njQuery 的之处在于它允许你使用任何需要的选择器。然而，你必须记住，我们的插件可能会处理多种不同的元素类型。使用\
    \ `this` 关键字让我们的插件能够循环对每个元素应用函数。\n\n### 获取 HTML 部分 - 构建折叠面板结构\n\n由于我们正在构建折叠面板（accordion），我们需要它的\
    \ HTML 结构，所以如下：\n\n* 标题 1：标题、内边距、下边框\n* 标题 2：内容、边框\n* 标题 3：内容\n* 标题 4：列表项\n\n\
    这是一个简单的折叠面板结构，定义了四个标题及其相应的内容区域。因此，id 的作用是我们的插件会将这段代码转换为功能性的折叠面板，用户可以打开和折叠不同的部分。这是它现在的样子：\n\
    \n```css\n.accordion {\n  width: 600px;\n  border: 1px solid;\n  border-bottom:\
    \ none;\n}\n\n.accordion dt {\n  border-bottom: 1px solid;\n  margin: 0px;\n}\n\
    \n.accordion dt {\n  background: rgb(193, 221, 252, 0.24);\n  cursor: pointer;\n\
    \  padding: 8px 4px;\n  font-size: 14px;\n  font-weight: bold;\n}\n\n.accordion\
    \ dd {\n  padding: 12px 8px;\n}\n```\n\n现在我们的折叠面板结构应该像这样：jQuery 部分 - 让它运行起来！为了给我们的插件添加功能，我们将编辑\
    \ js 文件并添加以下代码：\n\n```javascript\n(function($) {\n\n$.fn.simpleAccordion = function(options)\
    \ {\n  return $(this).each(function() {\n    var dt = $(this).children('dt');\n\
    \    dt.click(accordionClick);\n    dt.each(reset);\n  });\n\n  function accordionClick()\
    \ {\n    $(this).siblings('dt').each(hide);\n    $(this).next().slideDown('fast');\n\
    \    return false;\n  }\n\n  function hide() {\n    $(this).next().slideUp('fast');\n\
    \  }\n\n  function reset() {\n    $(this).next().hide();\n  }\n\n})(jQuery);\n\
    ```\n\n让我们快速过一下这段代码在做什么。首先，你需要理解 jQuery 是一个扩展 JavaScript 语言的库。在创建任何 jQuery 插件时，你实际上是在扩展\
    \ jQuery 库，而 jQuery 又在扩展 JavaScript。真正理解你的插件如何扩展 jQuery 库需要理解 JavaScript。虽然 JavaScript\
    \ 没有被直接使用，但它通过 jQuery `fn` 在后台使用，`fn` 是 jQuery 的一个别名。\n\n此外，你可以通过 `plugin-name`\
    \ 从 jQuery 为我们的插件添加选项。为了给插件添加选项，jQuery 插件可以包含默认值和选项。选项是你可以传递给插件的参数。我们并没有像标准 jQuery\
    \ 那样通过选项对象发送元素。在你的插件中遵循选项时，最佳实践是使用默认对象。让我们快速给我们的插件添加一些选项来展示这一点。我们将在折叠面板首次加载时传递一个参数来打开它的第一个部分。\n\
    \n```javascript\n(function($) {\n\n  $.fn.simpleAccordion = function(options)\
    \ {\n    var state = $.extend({}, {open: false}, options);\n    return $(this).each(function()\
    \ {\n      var dt = $(this).children('dt');\n      dt.click(accordionClick);\n\
    \      dt.each(reset);\n      if(state.open)\n        $(this).children('dt:first-child').next().show();\n\
    \    });\n  }\n\n  function accordionClick() {\n    $(this).siblings('dt').each(hide);\n\
    \    $(this).next().slideDown('fast');\n    return false;\n  }\n\n  function hide()\
    \ {\n    $(this).next().slideUp('fast');\n  }\n\n  function reset() {\n    $(this).next().hide();\n\
    \  }\n\n})(jQuery);\n```\n\n如果你注意到，我们使用了 `open: false` 的默认值，所以如果没有传递任何选项，插件将假设你希望折叠面板在首次加载时是关闭。当插件接收到选项时，你可以依赖\
    \ `.extend` 方法来执行实际的覆盖。`.extend` 方法的作用合并两个或多个对象。\n\n## JavaScript 和 CSS\n\nCSS\
    \ 和 JavaScript：界限似乎随着每个浏览器的发布而变得模糊。它们的工作一直非常不同，但最终它们都是前端技术，所以它们需要配合。我们有 `.js`\
    \ 文件，但这并不意味着 CSS 不能进行比 JavaScript 允许更多的交互。JavaScript 和 CSS 共同工作有五种方式\n\n## 使用\
    \ JavaScript 获取伪元素\n\n我们知道可以获取元素的基本样式，但伪元素呢？是的，JavaScript 可以访问这些内容。\n\n```javascript\n\
    // 获取 .element:before 的颜色\nvar color = window.getComputedStyle(element, \":before\"\
    ).color;\n\n// 获取 .element:before 的内容\nvar content = window.getComputedStyle(element,\
    \ \":before\").content;\n```\n"
- fmt: "\nWe're all well-versed in modifying styles via the `element.style.propertyName`\
    \ method, and we've used JavaScript toolkits to do it, but did you know you can\
    \ actually read and write rules within new and existing stylesheets? The API is\
    \ actually quite simple to!\n\n```\nfunction addCSSRule(sheet, selector, rules,\
    \ index) { \n  if(sheet.insertRule) {\n    sheet.insertRule(selector + \"{\" +\
    \ rules + \"}\", index); \n  } else {\n    sheet.addRule(selector, rules, index);\n\
    \  }\n}\n```\n\n// Use it!\n\n`addCSSRule(document.styleSheets[0], \"header\"\
    , \"float: left\");`\n\n most common use case is creating a new stylesheet, but\
    \ if you want to modify an existing stylesheet, go for it.\n\n## Load CSS Files\
    \ with a Loader\n\nLazy-loading resources like images, JSON, and scripts is a\
    \ great way to decrease load time. We can load those external resources with JavaScript\
    \ loaders like `curl.js`, but did you know you can lazy load stylesheets and get\
    \ that notification within the same callback?\n\n```javascript\ncurl( [\n  \"\
    namespace/MyWidget\",\n  \"css!namespace/resources/MyWidget.css\"\n],\nfunction(MyWidget)\
    \ {\n  // Do something with MyWidget\n  // The CSS reference isn't in the signature\
    \ because we don't care about it; // we just care that it is now in the page\n\
    })\n);\n```\n\n## Essentials of CSS\n\n### CSS pointer-events\n\nCSS pointer-events\
    \ property is interesting because it almost acts in a JavaScript-like way, effectively\
    \ disabling an element when the value is none but otherwise allowing the element\
    \ to function properly when the value isn't none. You may be saying \"so what?!\"\
    \ but pointer-events even prevent JavaScript events from firing!\n\n```css\n.disabled\
    \ { pointer-events: none; }\n```\n\n#### Usage\n\nPackage is available through\
    \ bower\n\n`bower install css-essentials`\n\nusage\n\n`<link rel=\"stylesheet\"\
    \ href=\"bower_components/css-essentials/dist/cssessentials-min.css\">`\n\nor\
    \ through npm `npm install css-essentials`\n\n#### Basic\n\nWe have determined\
    \ that we need more than usual 3-4 breakpoints to really adjust the design to\
    \ all screen that are out there. So we have defined following breakpoints:\n\n\
    `@of-xsm : 460px; @of-sm: 606px; @of-md: 800px; @of-lg: 1164px; @of-xlg: 1440px;\
    \ @of-xxlg: 1740px;`\n\nBrowser support\n\nWe tend to support at least n-1, where\
    \ n is the current version of any browser. Components\n\n##### Grid\n\n24 column\
    \ based grid, is created using flex.\n\nQuick start:\n\n```html\n<div class=\"\
    of-row\">\n  <div class=\"xxsm-col-24 xsm-col-18 sm-col-12 md-col-6 lg-col-4 xlg-col-2\
    \ xxlg-col-1\"> Some content </div>\n</div>\n```\n\nThis will spread through full\
    \ row on smallest screens and it will go up to 1 column on very big screens.\n\
    \nBy default, row has 24px padding on the side (on xxsm screens is 0, on xsm screens\
    \ is 12px) and each column has 12px padding in between. Row padding can be omitted\
    \ using `.of-row-no-padding`\n\n##### Loading spinner\n\nLoading spinner can be\
    \ used to indicate loading.\n\nQuick start:\n\n```html\n<div class=\"of-row\"\
    >\n  <div class=\"xxsm-col-24\">\n    <div id=\"loading-bar-spinner\"><div class=\"\
    spinner-icon\"></div></div>\n  </div>\n</div>\n```\n\n##### Truncate text\n\n\
    Truncate text is useful, when you want to display text in one line and truncate\
    \ it, if it exceeds the width of a line.\n\nQuick start: `<div class=\"of-row\"\
    ><div class=\"xxsm-col-12\"><div class=\"truncate\">...</div></div>`\n\n#####\
    \ Push animation\n\nPush up animation a nice effect for hovering elements.\n\n\
    Quick start: Just append `.of-push-animation` to your element.\n\n##### Customization\n\
    \nIt is possible to edit the grid breakpoints editing the values in `stylesheets`\
    \ and then `npm install`.\n\n##### Command Values\n\nIn addition to this, it is\
    \ possible to say, to the command, the desired values for the grid breakpoints:\
    \ `npm install release breakpoints='xxm 0px, xsm 460px, sm 606px, md 800px, lg\
    \ 1164px, xlg 1440px, xxlg 1740px'`\n\nThis breakpoints argument will override\
    \ the default values specified in `stylesheets`. It has to be an array separated\
    \ by commas. Then each breakpoint is made of `<name><width>`: `<name>` is a string\
    \ and it will be used to identify your breakpoint, its classes will use `<space>`\
    \ a simple space to separate the name and the width `<width>` a value in px (correct\
    \ values are like: 0px, 300px, 500px and so on)\n\n## 20 Essential CSS Tricks\
    \ Every Designer Should Know\n\nAbsolute positioning\n\nIf you want to control\
    \ where an element lives on our website at all times, absolute positioning is\
    \ the key to making this happen. If you think of your browser as one bounding\
    \ box, absolute positioning allows you to control exactly where in that box an\
    \ element will stay. Use top, right, bottom and left, accompanied by a pixel value\
    \ to control where an element stays.\n\n```css\nposition: absolute;\ntop: 20px;\n\
    right: 20px;\n```\n\nThe CSS above sets the position of an element to stay 20px\
    \ from the top and right edges of your browser. You can also use absolute positioning\
    \ inside of a div.\n\n* + selector\n\nThe `*` enables you to select all elements\
    \ of a particular selector. For example, if you used `*` and then added CSS styles\
    \ to that, it would do it to all elements in your document with a `<p>` tag. This\
    \ makes it easy to target parts of your website globally.\n\nOverriding all styles\n\
    \nThis should be used sparingly, because if you do this for everything, you’re\
    \ going to find yourself in trouble in the long run. However, if you want to override\
    \ a style for an element, use `stylesheets`. For example, if I wanted the H2 in\
    \ a section red, I would use the following:\n\n```css\n.section h2 { color: red;\
    \ }\n```\n\nCentering\n\nCentering is tricky because it depends on what you are\
    \ trying to center. Let's take a look at items to be centered. Text is centered\
    \ using `text-align:center;`. If you want it to either left or right, use `text-align`.\n\
    \nA div (or any other element) can be centered by adding `display: block;` and\
    \ then using `auto` margins. The reason I put \"anything under 100%\" for width\
    \ is because if it was full-width it wouldn't be centered.\n\n```css\ndiv {\n\
    \  display: block;\n  margin: auto;\n  width: 50%;\n}\n```\n\nVertical alignment\
    \ (for one line of text)\n\nYou will use this in a navigation menu, the key is\
    \ to make the height of the menu and the line-height of the text the same. I see\
    \ this technique a lot when I go back and edit existing websites for clients.\
    \ Here is an example:\n\n```css\n.nav li {\n  line-height: 50px;\n  height: 50px;\n\
    }\n```\n\nHover effects\n\nThis is used for buttons, text links, blocks of your\
    \ site, icons, and more. If you want something to change colors when someone hovers\
    \ over it, use the same CSS, but add `:hover` to it and change the styling. Here\
    \ is an example:\n\n```css\n.entry h2 {\n  font-size: 36px;\n  color: #000;\n\
    \  font-weight: 800;\n}\n\n.entry h2:hover {\n  color: #f00;\n}\n```\n"
