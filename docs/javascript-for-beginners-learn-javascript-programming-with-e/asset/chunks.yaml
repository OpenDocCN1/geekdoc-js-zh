    Very stable format of markup languages. The commands mean the same thing everywhere.
    It is often bashed by people for being a bad language. People, often used to XML,
    talk about the lack of good elements for marking up things like authors and dates.


    It is used to structure information -- denoting certain text as headings, paragraphs,
    lists and on -- and can be used to describe, to decorate, and aspects of a document.
    It is designed to build documents. Here''s the kicker: if you use each for intended,
