    \ sender variable to a datatype of Radio*/\n    System.Windows.Forms.RadioButton\
    \ rbtn = (System.Windows.Forms.RadioButton)sender;\n\n    if (rbtn.Name == \"\
    rbtnGreen\") this.BackColor = myColorArray[0];//\n}\n```\n"
