    , album: \"Seasons in the Abyss\"},\n        {name: \"Anthrax\", album: \"Persistence\
    \ of Time\"}\n      ];\n    }\n  </script>\n</body>\n</html>\n```\n\n在这个示例中，我们可以看到一些之前讨论过之外的内容：ng-app、ng-controller\
    \ 和 ng-repeat。现在我们将详细查看它们的具体含义。\n\n## 详细介绍指令、表达式和作用域\n\n当我们查看之前的示例时，首先注意到的点是 ng-app\
    \ 标签的存在；这被称为指令（directives），在这一特定示例中，它的作用是告诉 AngularJS body 标签内包含的所有代码都是一个应用程序，如前所述。\n\
    \n之后，我们有了 ng-controller；正如名称所示，我们在这里声明哪个控制器将作用于 HTML 的特定区域，而 ng-repeat 类似于一个对数组的内置循环。为了简单起见，ng-app、ng-controller\
    \ 和 ng-repeat 标签都是 AngularJS 指令；还有许多其他指令。为了简化，属性（如 ng-app、ng-bind、ng-show 和 ng-hide）是框架的内置指令；我们也可以创建自定义指令。\n\
    \n## 第 5 章\n\n关于 Angular 指令的更多信息可以在 https://docs.angularjs.org/api/ng/directive\
    \ 找到。\n\n指令用于扩展 HTML 的语法，它们是简单的语句但具有强大且灵活的功能。除了现有指令外，我们还可以创建四种指令：\n\n- 元素指令\n\
    - 属性指令\n- CSS 类指令\n- 注释指令\n\n以下是创建自定义指令的四种方法：\n\n| 限制 (Restrict) | 标记 |\n| :---\
    \ | :--- |\n| 'A' | `<span>ng-directivename></span>` |\n| 'E' | `<ng-directivename></ng-directivename>`\
    \ |\n| 'C' | `<span class=\"ng-directive\"></span>` |\n| 'M' | `<!-- directive:\
    \ ng-directive-->` |\n\n自定义指令的基础代码如下：\n\n```javascript\napp.directive('ngDirective',\
    \ function() {\n  return {\n    restrict: 'A',\n    // 在此处编写你的指令代码\n  }\n});\n\
    ```\n\n注意，我们使用关键字 'A' 创建了一个元素指令，并在 HTML 中如下调用/使用它：\n\n```html\n<div ng-Directive></div>\n\
    ```\n\n这是一个实践示例，一个基础的元素指令：\n\n```javascript\nmyAngularApp = angular.module(\"\
    myAngularApp\", []);\n\nmyAngularApp.directive('div', function() {\n  var directive\
    \ = {};\n\n  // 限制指令为 HTML 元素\n  directive.restrict = 'E';\n\n  // 设置基础模板\n  directive.template\
    \ = \"My Angular directive: {{ someTextGoesHere}}\";\n\n  return directive;\n\
    });\n```\n\n`directive()` 函数的第一个参数是指令名称。该名称将使用 HTML 模板激活指令。传递给 `directive()` 函数的第二个参数是一个工厂函数。该函数在调用时返回该指令。\n\
    \n`directive.template` 将 `{{ someTextGoesHere }}` 表达式替换为控制器属性 `$scope.someTextGoesHere`，如下所示：\n\
    \n```html\n<div ng-controller=\"MyAngularController\">\n  <directivename>这将将被替换为控制器的\
    \ $scope 内容</directivename>\n</div>\n```\n\n```javascript\n<script>\nmyAngularApp\
    \ = angular.module(\"myAngularApp\", []);\n// 创建指令\nmyAngularApp.directive('directivename',\
    \ function() {\n  var directive = {};\n\n  // 限制为 HTML 元素\n  directive.restrict\
    \ = 'E';\n\n  // 设置基础模板\n  directive.template = \"My Angular directive: {{ someTextGoesHere}}\"\
    ;\n\n  return directive;\n});\n\n// 设置控制器\nmyAngularApp.controller(\"MyAngularController\"\
    , function($scope) {\n  $scope.someTextGoesHere = \"My first Directive is working\"\
    ;\n});\n</script>\n```\n\n"
