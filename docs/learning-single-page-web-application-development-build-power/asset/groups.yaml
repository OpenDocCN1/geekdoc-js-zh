    \ between the actual value and the expected value. Here is a simple example to\
    \ understand matcher with an expect() function:\n\n```\ndescribe(\"How matchers\
    \ work:\", function() {\n  it(\"The toBe matcher compares with ====\", function()\
    \ {\n    var number = 12;\n    var letter = a;\n\n    expect(number).toBe(letter);\n\
    \    expect(number).not.toBe(null);\n  });\n});\nWe can create our own matcher\
    \ if necessary.\n```\n\nWe can use the describe() function to group related specs\
    \ to test an entire module like the following example:\n\n```\ndescribe(\"Login\
    \ test series\", function() {\n  it(\"*Try to login with blank user*\", function()\
    \ {\n    ...\n  });\n\n  it(\"*Try to login with wrong user*\", function() {\n\
    \    ...\n    // More it() functions goes here.\n  });\n});\n```\n\nThe Jasmine\
    \ API is pretty easy to understand; it has several other functions, but this baseline\
    \ is enough to understand the following examples.\n\n> To find out more about\
    \ the Jasmine test framework, refer to http://jasmine.github.io/"
