    # Deploying the Application to the Cloud


    3. Create a new file called Procfile in the root project folder and type the following
    code in:

    web: ./node_modules/.bin/forever -m 5 server.js


    Procfile determines which specific commands must be executed by your application
    dynos on the Heroku platform. These commands can vary for several types of processes
    such as web, worker, urgentworker, and clock, among others.


    You can find more about the Heroku process at https://devcenter.heroku.com/articles/procfile.


    That''s all, let''s commit and upload the changes to Git and push them to the
    GitHub repository.


