  mdcn: "\n\n# Node 服务器、NPM 与中间件\n\nNode 是一个用 JavaScript 构建的 Web 服务器，Node.js 的基本提案是构建高性能且可扩展的\
    \ Web 应用程序，这到底意味着什么？\n\n在其他编程语言（如 Java、PHP 和 .NET）中，每个连接都可能在服务器上启动一个新线程，并且通常会伴随着\
    \ 2 MB 的内存。在拥有 8 GB 内存的服务器上，这决定了最大并发连接约为 4,000 个用户。现在，想象一下你的应用程序正在增长，每天接收到的点击越来越多；你可能需要更多的服务器，甚至需要投入更多的硬件。这就是整个部\
    \ Web 应用程序架构的瓶颈，即服务器能够处理并保持稳定的最大并发 I/O 连接数。Node.js 通过改变连接到服务器的方式来解决这个问题。它不是为每个连接启动新线程，而是创建一个不需要随随内存块的进程。它不会直接对\
    \ I/O 进行 阻塞式调用。\n\nNode 服务器可以支持成上万计的并发连接。它没有为每个连接分配一个线程，而是每个连接使用一个进程，只为每个连接创建所需的内存。它通过提供高扩展性的服务器实现了这一目标。\n\
    \n实际上，Node 改变了服务器的格局，系统的瓶颈从最大连接数变成了系统的流量能力。它还包含一个强大的包管理器称为 NPM (Node Package Manager)；虽然可以安装和更新包，但你也可以创建自己的包并将其发布到网上供整个社区使用。值得注意的是，许多第三方工具（如\
    \ Grunt、Bower 和 Yeoman 等）都使用 Node 来安装包。\n\nNPM 是一个命令行实用，与 Node.js 的开源项目仓库进行交互；它可以安装模块并管理依赖关系和版本。\n\
    \nNPM 仓库拥有超过 76,000 个包，所有这些都是开源库，每天都有新的加入。这些应用程序可以通过 NPM 的搜索门户找到。你可以在官方仓库 [NPM\
    \ Registry](https://www.npmjs.org/) 搜索并发现许多包。你可以在 http://nodejs.org/ 了解更多关于 Node.js\
    \ 的信息。\n\nNPM 的另一个重要用途是安装其模块和依赖项的能力。当你有一个包含名为 `package.json` 文件的 Node 项目时，你可以在项目的根目录中运行\
    \ `npm install` 命令，NPM 将安装 `package.json` 中列出的所有依赖项。\n\n此外，`npm init` 命令通过分步配置启动你的项目配置，从而从零创建一个\
    \ `package.json` 文件。\n\n最常用的命令是：\n\n- npm install module_name: 在项目中安装一个模块\n- npm\
    \ install module_name-save: 安装模块并将其添加到 package.json 的依赖列表中\n- npm list: 列出项目中的所有模块\n\
    - npm list -g: 列出所有全局模块\n- npm remove module_name: 卸载一个模块\n- module_name update:\
    \ 更新 NPM 的当前版本\n- npm adduser username: 在 NPM 仓库中创建一个用户\n- npm whoami: 显示你在 NPM\
    \ 仓库上的公共个人资料详情\n- npm publish: 在 NPM 仓库上发布你的模块\n\nNode 的另一个关键部分被称为中间件。我们通常将中间件定义为桥接代码段，所有的流都会通过这些代码段。在\
    \ Node 环境中，这非常常见。我们有很多中间件，如 connect、body-parser（处理 JSON 非常有用）、cookie parser 等等。这些都是\
    \ Express (v4) Web 框架的独立模块，我们将在书的后后部分看到更多关于它们的内容。\n\n# 事件驱动开发与事件循环\n\n事件驱动开发源于事件驱动编程，换句话说，在面向对象编程范式之外，基于事件的编程是指在事件触发后触发应用程序流的能力。\n\
    \nJavaScript 是一种事件驱动编程的绝佳语言；它允许匿名函数和闭包，更重要的是它的语法与其他编程语言非常相似。当事件发生时调用的回调函数可以写在捕获事件的同一个地方。因此，代码编写容易，维护也容易。\n\
    \n# 深入研究 Node.js 和 MongoDB\n\nNode.js 中的几乎所有内容都使用回调。Node 回调是在异步模式下实现的函数。通常，回调函数是使用函数指针作为参数传递给另一个函数。例如，它告诉一个函数执行某些任务，并在完成该任务后执行另一个任务。\n\
    \n# 事件循环\n\n掌握 Node.js 的另一个重要点是事件循环。任何熟悉 jQuery 的开发者都处理过回调函数，这些函数通常在用户执行某些任务后触发，例如点击折叠组件、幻灯片甚至是简单的按钮。然而，在\
    \ Node.js 中，事件循环在应用程序启动时开始。函数具有指向其他函数的回调，事件循环在最后一个回调执行时结束，如图所示：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_48_0.png)\n\
    \n事件循环始终在那里，并持续检查函数是否显式完成；否则它会保持程序运行并保持操作异步。让我们来看非常简单且常见的示例来创建一个 HTTP 服务器：\n\n\
    ```\nvar http = require('http');\nhttp.createServer(function (req, res) {\n  res.write(200,\
    \ {'Content-Type': 'text/plain'});\n  res.end('Hello World\\n');\n}).listen(3000,\
    \ \"127.0.0.1\");\nconsole.log('Server running at http://127.0.0.1:3000/');\n\
    ```\n\n注意，我们的 HTTP 服务器为请求事件附加了一个回调。该回调作为参数传递给 `createServer`。\n\nNode.js 从上到下运行代码；由于我们附加了一些监听器，Node.js\
    \ 不会退出，而是等待事件触发。当一个 HTTP 请求发送到服务器时，Node.js 会进入请求事件，生成附加到该事件的回调，以便按顺序运行。\n\n在上一个示例中，我们只有一个回调，即作为参数传递给\
    \ `createServer` 的匿名函数。但在实际应用中，我们可以有许多函数。\n\n# 使用 require() 和模块\n\nNode.js 是 JavaScript\
    \ 的运行时规范。内联函数 `require()` 是在单独文件中包含现有模块的最简单方法。\n\n# require() 函数\n\n`require()`\
    \ 的基本行为是读取 JavaScript 文件、解释脚本，然后在 Windows 上运行它，解释 `exports` 对象的内容。以下代码是一个用于理解它的示例；复制代码并粘贴到新文件中：\n\
    \n```javascript\nconsole.log(\"requireExample\");\n```\n\n```javascript\nvarExample\
    \ = function () {\n  console.log(\"requireExample\");\n}\n```\n\n```javascript\n\
    exports.greeting = \"Hello Node\";\n\nexports.sayHi = function () {\n  console.log(exports.greeting);\n\
    }\n```\n\n我们可以这样测试我们的模块：\n\n```\n> test = require('./example.js')\n> greetings:\
    \ 'Hello Node',\n> sayHi: [Function]\n> test.sayHi()\n\nHello Node\nundefined\n\
    ```\n\n现在，让我们如何使用 `module.exports` 为导出分配函数或新对象；复制以下代码并保存为 `example-module.js`：\n\
    \n```javascript\nmodule.exports = function () {\n  console.log(\"Hello Node from\
    \ module.exports\")\n}\n```\n\n打开 REPL 并输入：\nrequire('./example-module.js')\n\n\
    这一次，当使用 `require` 导入模块时，它首先解释（执行）代码，导致模块导入并调用自身。\n\n# 深入研究 Node.js 和 MongoDB\n\
    \n在这里，你可以看到模块已成功导入，并且说明了函数已导入。它打印示例并返回 `exports` 对象的内容，该对象包含了赋值给 `exports` 的属性。\n\
    \nRead-Eval-Print Loop (REPL) 是一个简单的交互式程序，它首先读取程序的短语或部分，然后评估（或运行）它，最后打印结果。\n\n"
