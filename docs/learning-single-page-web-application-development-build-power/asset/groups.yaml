    \ a JavaScript object.\n\nTwo-way data binding refers to the ability to bind changes\
    \ to an object's properties to changes in the UI and vice versa. In other words,\
    \ if we have a user object with the `name` property, whenever we assign a new\
    \ value to `user.name`, the UI should show the new name. In the same way, if the\
    \ UI includes an input field for the user's name, entering a value should change\
    \ the `name` property of the user object variable to be changed accordingly:\n\
    \n```\nvar user = {\n  name : \"fernando\",\n  age : 25\n}\n```\n\nMVP and MVVM\
    \ are derivatives of MVC. The key difference between both is the dependencies\
    \ each layer has on the other layers, as well as how tightly bound they are with\
    \ regard to each other."
