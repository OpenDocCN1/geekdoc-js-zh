    \ 导出模块以便后续使用。我们看到 MongoDB 有一个 GUI 管理界面，并学习了一些在未来章节中对我们帮助命令行。\n\n我们学习了 Express\
    \ 框架的力量，通过它可以构建简单复杂的 Web 应用程序，并学习了如何使用 Mongoose 进行对象建模，为数据创建 schema 和模型。但如果你不理解这里所有的概念，不要担心；我们将在接下来的章节中进行详细讨论它们。\n\
    \n我们的旅程刚刚开始；在接下来的章节中，我们将看到另一组工具，并通过编写大量代码来开始构建我们的 API。在下一章中，我们将看到 API 是如何工作的、一些关于\
    \ RESTful 架构的介绍，以及如何使用 Yeoman 生成器开始开发。\n\n## 结合 MongoDB 和 Node.js 的 API\n\n本章将直接关注代码，以便我们获得必要的理解，为我们的\
    \ API 奠定坚实的基础。我们的主要目标是讨论使用 SPA 方法构建丰富 Web 应用程序的技术。\n\n应用程序接口（API）是使能够构建应用程序的编程标准集合。对于使用应用程序的用户来说，它们的用法并不直观。API\
    \ 是应用程序的引擎；是一个运行在这一切背后的接口。虽然你可能从应用程序或网站中受益，但你的 API 可以连接到多个系统和应用程序。通过 API，应用程序之间可以在没有用户干预的情况下通信。\n\
    \n我们将在本章中涵盖以下主题：\n\n- API 的工作原理\n- 模板（Boilerplates）和生成器\n- 插件 API 概念\n- 创建 `package.json`\
    \ 文件\n- 使用 `server.js` 的 Node 服务器\n- 使用 Mongoose schema 的模型\n- 定义 API 路由\n- 在云端使用\
    \ MongoDB\n- 使用 Postman 插入数据\n\n## API的工作原理\n\nAPI 通过不同代码之间的通信工作，从而定义接口上对象的特定行为。也就是说，API\
    \ 将网站上的多个功能（如搜索、图片、验证等）连接起来，使其能够在其他应用程序中使用。\n\n操作系统也有 API，它们的功能相同。例如，所有版本都有如 Web\
    \ API、电话 API。当你运行一个涉及操作系统进程的程序时，我们可能会与一个或多个 API 建立连接。为了澄清 API 的概念，我们将通过一些示例来展示它是如何工作的。在\
    \ Windows 上，它运行在使用系统在程序内显示相同功能的应用程序上。然后将行为关联到另一个应用程序中的给定时间。\n\n另一个例子是你使用 SDK 构建移动应用程序。当你使用\
    \ GPS 时，你正在与 API 交互以便地图上显示用户位置；在这种情况下，就是 Google Maps API。\n\n涉及到 Web API 时，功能可能更大。许多服务提供其代码，以便在其他网站上使用。也许最好的例子是\
    \ Facebook API。其他网站使用此服务，例如点赞、分享，甚至是身份验证。\n\n> API 是一组基于 Web 访问软件应用程序的编程模式和指令。\n\
    \n所以，当你访问你的账户时，你可以登录。这是通过 API 实现的。使用它，软件开发者可以为他们的用户创建精美的页面。\n\n## 模板（Boilerplates）和生成器（Generators）\n\
    \n在 MEAN 栈环境中，我们的生态系统是无限多样的，我们可以找到开始构建 API 的极佳替代方案。我们有从简单的模板到复杂的代码生成器，它们可以与其他工具配合，也可以单独使用。\n\
    \n模板通常是一组经过测试的代码，为主要目标（即创建 Web 项目的基础）提供基本结构。模板为我们节省了许多常见任务，如组装代码的基础结构和组织文件，模板已经有很多脚本可以使前端的工作变得更轻松。\n\
    \n让我们描述一些我们认为在使用 Express 框架、MongoDB 数据库、Node 服务器和 AngularJS 作为前端开发 API 的良好起点的替代方案。\n\
    \n为了完全理解这里涵盖的概念，可能需要对 JavaScript 有一些突出的知识。\n\n## 结合 MongoDB 和 Node.js 的 API\n\n\
    本章将直接关注代码，以便我们获得必要的理解，为我们的 API 奠定坚实的基础。我们的主要目标是讨论使用 SPA 方法构建丰富 Web 应用程序的技术。\n\n\
