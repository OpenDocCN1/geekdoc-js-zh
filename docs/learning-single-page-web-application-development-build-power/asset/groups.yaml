    # # Express – a web framework on a server


    Express is the most common and flexible framework to build web applications on
    Node. It provides us with a robust set of features to deal with such as SPA, the
    RESTful API, and of course, the MEAN stack. The Express framework has full support
    for templates and rendering using the Jade engine as the default. It is very suitable
    for large-scale applications that render HTML on the server side.


    Of course, we have others options such as the amazing microframework, strictly
    to deal with the RESTful API, but we are talking about MEAN, we use only the acronym-related
    technology, which is Express.


    Jade is a template engine uniquely for Node, inspired by Ruby and Haml with rule-based
    indentation, like the Sass and Python syntax. More information on Jade can be
    found at http://jade-lang.com/.


    The main reason to use Express is that the default Node API is not as robust for
    complex applications, every route management and other features are treated in
    a very basic way. Express follows good development practices, an oriented RESTful
    architecture that uses the main methods of the HTTP protocol (such as GET, POST,
    PUT, and DELETE), and very difficult-to-build complex applications.


    We can list some great features of Express:


    +   * Powerful routing management

    * Redirect for helpers

    * Can use any view template engine

    * Prepared to use RESTful

    * Application mounting

    * High performance

    * Views rendering

    * Partials support'
