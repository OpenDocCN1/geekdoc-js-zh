    \ see the importance and the architecture of the tests that employ Angular and\
    \ how to use and configure Karma and Protractor, among other things.\n\n# 7 Testing\
    \ Angular SPA with Karma and Protractor\n\nIn this chapter, we'll dive a bit deeper\
    \ into the AngularJS Framework and understand some very important points about\
    \ testing on SPA.\n\nAs we mentioned in the previous chapters, SPA transfers MVC\
    \ responsibility to JavaScript that runs on the client side (the browser). We\
