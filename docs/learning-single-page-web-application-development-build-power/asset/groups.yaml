    Deploy the Application to the Cloud


    # # Automatic deployment from GitHub


    As already mentioned, agile development at the end of each delivery, or as it
    is regularly called, we need to put the application into production. Now we will
    see how to do this in an automated manner.


    The following lines assume you have already configured a local repository using
    Git and a GitHub account.


    # # Setting up a Shippable account


    Setting up an account on Shippable is very simple and free. Moreover, you can
    use your account on GitHub or Bitbucket.


    +   - Visit http://www.shippable.com/ and click on the github button. Then follow
    the instructions to register.

    - After the authorization process between GitHub and Shippable, you''ll be redirected
    to the Shippable dashboard.

    - On the right-hand side, click on your account name below Organizations as shown
    in the following screenshot:


    ![](img/76faac513e4fd5843aeb56a44cada4c9_194_0.png)


    +   - Then click on the repository name''s link.

    - Enable your GitHub repository.


    Very simple so far!


    > >Do not forget to choose the repository that stores our sample application.'
