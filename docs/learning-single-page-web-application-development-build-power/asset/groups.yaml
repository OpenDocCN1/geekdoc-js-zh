  - '[PAGE 202]


    Deploying the Application to the Cloud


    SPA can contain a dozen or more templates. This will depend on the complexity
    of the application. With this concept in mind, if you briefly return to Chapter
    4, Creating a Conference Web Application, you can see that we wrote SPA that only
    ran on the server side, even using an API much like the traditional way to build
    dynamic applications in server-side languages such as PHP and .NET.


    # # Summary


    In this chapter, we discussed some factors of extreme importance to the development
    of software and the preparation of a highly scalable environment for SPA.

    nWith the process of testing an automatic build, we can deploy the application
    in minutes and ensure a quality delivery. We covered many important concepts and
    tools for the frontend development of SPA with the RESTful API. This entire book
    serves as a solid base for learning not only about SPA but also depicts examples
    and tips about MEAN development and the RESTful architecture, covering a complete
    approach to the whole development process of SPA.'
