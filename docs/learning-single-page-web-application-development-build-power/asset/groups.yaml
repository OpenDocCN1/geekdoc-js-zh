- md: "\n### Creating a Conference Web Application\n\nThis chapter will devote time\
    \ and attention to refactoring and building the web application.\n\nNowadays,\
    \ the workflow for a frontend developer can be very tricky if you do not use the\
    \ right tools, and here in this book we will use some of the most important modern\
    \ tools for fast and simple development.\n\nAt first glance, everything seems\
    \ too complicated; we must remember that our choices lead us to different paths\
    \ and that there is more than one way to develop an application. Nothing is better\
    \ than practicing in order to choose the best way that will be useful to you.\n\
    \nIn this chapter, we'll see some very interesting stuff such as the frontend\
    \ dependencies manager known as Bower, how to start an application from scratch\
    \ using the Express generator, adding secure authentication with Passport, and\
    \ much, much more. The topics we will cover are:\n\n- Rebuilding the API\n- Adding\
    \ the Passport middleware\n- Dealing with routes\n- Templates with Embedded JavaScript\n\
    - Bower leading frontend dependencies\n- Pure CSS and Responsive Boilerplate for\
    \ the frontend style\n\n# Rebuilding the API\n\nThe rebuilding process is divided\
    \ into two parts: the first to have a solid base structure of directories and\
    \ the second to add some more folders and files with the purpose of making our\
    \ application as modular and scalable as possible.\n\n# Getting the baseline structure\n\
    \nTo start with, we will create a new folder called conference-api. Going forward,\
    \ we will refer to this folder only as the root folder. So, you already know that\
    \ we are referring to the application root directory. The first thing to do is\
    \ start the Express scaffold generator; to do this open the terminal on the root\
    \ folder and type:\n\n```\nexpress --ejs\n```\n\nThe ejs option stands for Embedded\
    \ JavaScript (EJS), and with this command, we change the standard library Jade\
    \ to ejs for the views' templates.\n\n> You can read more about Embedded JavaScript\
    \ at http://www.embeddedjs.com/\n\nAt this stage, you must have the following\
    \ default scaffold, as shown in the following screenshot:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_90_0.png)\n\
    \n# Changing the initialization process\n\nAs we saw in the previous chapter and\
    \ in the previous screenshot, the generator creates a bin folder. In this folder,\
    \ we have a file called www; this file is responsible for running the server for\
    \ the application. Instead of using the default command, npm start, each time\
    \ we need to execute the server to test and develop the application. We will make\
    \ some changes on how to start the server.\nTo do this, follow these steps:\n\n\
    - 1. Delete the bin folder.\n- 2. Open the app.js file on the root folder and\
    \ place the following code at the end of the file:\n\n```\napp.set('port', process.env.PORT\
    \ || 3000);\nvar server = app.listen(app.get('port'), function() {\n  console.log('Express\
    \ server listening on port ' + server\naddress.port);\n});\n```\n\n- 3. Rename\
    \ the file app.js to server.js.\n\nNow, let's check the result of these changes\
    \ and start the server using the following command on your terminal:\n\n```\n\
    node server\n```\n\nYou will see the Express server listening on port 3000 message\
    \ on your terminal. This means that if you open your browser and type http://localhost:3000,\
    \ you will see a welcome message from the Express framework.\n\nThe node server\
    \ command is the most common command to initialize a Node.js application.\n\n\
    To stop the server, press Ctrl + C.\n\n# Changing the directory structure\n\n\
    Now, let's make some changes in the directory structure. Our aim is to prepare\
    \ the application for a division of responsibilities, creating a directory named\
    \ server that will contain all the application backend code; to be more specific,\
    \ the API code.\n\nLet's use the following steps to change a directory structure:\n\
    \n- 1. In the root folder, create a new folder and name it server.\n\n- 2. Move\
    \ the routes and views folders to the newly created server folder. We still need\
    \ to accomplish an important task. When changing directories, it is necessary\
    \ to change some paths for the views and routes folders within the server.js file.\n\
    \n- 3. Open the server.js file, and update the route path inside the require()\
    \ function from the routes and users variables; your code must look like this:\n\
    \n```\n// Setup Routes\nvar routes = require('./server/routes/index');\nvar users\
    \ = require('./server/routes/users');\n```\n\n- 4. Open the server.js file, go\
    \ to the view engine setup commented line, and change to the following code:\n\
    \n```\n// view engine setup\napp.set('views', path.join(__dirname, 'server/views'));\n\
    ```\n\n- 5. Now, let's check whether everything went as expected up to here; type\
    \ the following command:\nnode server.js\n\n- 6. Open your browser and go to http://localhost:3000.\n\
    \nIf successful, we will see the home page of our application with the welcome\
    \ message from the Express framework again.\n\nOne of the advantages of using\
    \ the Express generator is that it comes with all the basic modules configured\
    \ to run our application, avoiding writing many lines of code. With only this\
    \ small change, you already have in hand a solid scaffold to start developing\
    \ applications with Node and the Express framework.\n\nOur folder will look like\
    \ the following screenshot:\n\n- express-generator (-/Desktop/express-generator)\n\
    - node_modules (library home)\n- public\n  - images\n  - javascripts\n  - stylesheets\n\
    - server\n  - routes\n    - index.js\n    - users.js\n  - views\n    - error.ejs\n\
    \    - index.ejs\n  - package.json\n  - server.js\n\n# Inserting new folders and\
    \ files\n\nLet's perform a few more steps to accomplish the modularization of\
    \ our application. Here, we will create two directories; one to store the configuration\
    \ file and another to store the application's models for the backend by performing\
    \ the following steps:\n\n- 1. Add a new folder called config to the server folder.\n\
    - 2. Add a new folder called models to the server file folders\n- 3. Right now,\
    \ we need to add the speaker.js model file to the models folders and speaker to\
    \ the routes folder. As we have already created these files in the previous chapter,\
    \ you can just copy them and insert them into each folder. The speaker.js model\
    \ looks like the following:\n\n```\nvar mongoose = require('mongoose');\nvar SpeakerSchema\
    \ = new Schema({\n  name: { type: String, default: '' },\n  company: { type: String,\
    \ default: '' },\n  title: { type: String, default: '' },\n  description: { type:\
    \ String, default: '' },\n  picture: { type: String, default: '' },\n  schedule:\
    \ { type: String, default: '' },\n  createdAt: { type: Date, default: Date.now\
    \ }\n});\n```\n\n```\nmodule.exports = mongoose.model('Speaker', SpeakersSchema);\n\
    ```\n\nThe speakers.js route code:\n\n```\nvar express = require('express');\n\
    var router = express.Router();\n// Import Speakers Model\nvar Speaker = require('../models/speaker');\n\
    ```\n\n```\n/* GET users. */\nrouter.get('/', function(req, res) {\n  res.json({\
    \ message: 'Hello SPA, the API is working!' });\n});\nSpeaker.find(function(err,\
    \ speakers) {\n  if (err) {\n    res.send(err);\n  }\n  res.json(speakers);\n\
    });\n```\n\n```\n/* GET specific users by id. */\nrouter.get('/:speaker_id', function(req,\
    \ res) {\n\nSpeaker.findById(req.params.speaker_id, function(err, speaker) {\n\
    \  if (err) {\n    res.send(err);\n  }\n  res.json(speaker);\n});\n```\n\n```\n\
    /* PUT users */\nrouter.post('/', function(req, res) {\n\n// create a new instance\
    \ of the Speaker Model\nvar speaker = new Speaker();\n\n// set the speaker properties\
    \ (comes from the request)\nspeaker.name = req.body.name;\nspeaker.company = req.body.company;\n\
    speaker.title = req.body.title;\nspeaker.description = req.body.description;\n\
    speaker.picture = req.body.picture;\nspeaker.schedule = req.body.schedule;\n\n\
    // save the data received\nspeaker.save(function(err) {\n  if (err)\n    res.send(err);\n\
    \n  // give some success message\n  res.json({ message: 'speaker successfully\
    \ created!' });\n});\n});\n\n/* UPDATE specific users by id. */\nrouter.put('/speaker_id',\
    \ function(req, res) {\n\n  Speaker.findById(req.params.speaker_id, function(err,\
    \ speaker) {\n    if (err)\n      res.send(err);\n\n    // set the speakers properties\
    \ (comes from the request)\n    speaker.name = req.body.name;\n    speaker.company\
    \ = req.body.company;\n    speaker.title = req.body.title;\n    speaker.description\
    \ = req.body.description;\n    speaker.picture = req.body.picture;\n    speaker.schedule\
    \ = req.body.schedule;\n\n    // save the data received\n    speaker.save(function(err)\
    \ {\n      if (err)\n        res.send(err);\n\n      // give some success message\n\
    \      res.json({ message: 'speaker successfully updated!' });\n    });\n  });\n\
    });\n```\n"
  mdcn: "\n\n### 创建会议 Web 应用程序\n\n本章将投入时间与精力用于重构和构建 Web 应用程序。\n\n如今，如果不使用正确的工具，前端开发人员的工作流可能会非常复杂。在本书中，我们将使用一些最重要的现代工具来进行快速、简单的开发。\n\
    \n乍看之下，一切似乎都太复杂了；我们必须记住，选择将引导我们走向不同的道路，而且开发应用程序的方法不止一种。没有比通过实践来选择最对你有用的方法更好的了。\n\
    \n在本章中，我们将看到一些非常有趣的内容，例如名为 Bower 的前端依赖管理器、如何使用 Express 生成器从零开始应用程序、如何使用 Passport\
    \ 添加安全身份验证等等。我们将涵盖的议题有：\n\n- 重构 API\n- 添加 Passport 间件\n- 处理路由\n- 使用嵌入式 JavaScript\
    \ (Embedded JavaScript) 模板\n- Bower 引导前端依赖\n- 用于前端样式的纯 CSS 和响应式样板 (Boilerplate)\n\
    \n# 重构 API\n\n重构过程分为两个部分：第一部分建立稳固的目录结构，第二部分添加更多文件夹和文件，目的是让我们的应用程序尽可能模块化和可扩展。\n\
    \n# 获取基线结构\n\n首先，我们将创建一个名为 `conference-api` 的新文件夹。从以后，我们将该文件夹简称为根文件夹。因此，你已经知道我们指的是应用程序的根目录。第一步是启动\
    \ Express 脚手架生成器；为此，在根文件夹打开终端并输入：\n\n```\nexpress --ejs\n```\n\n`--ejs` 代表 Embedded\
    \ JavaScript (EJS)，通过此命令，我们将标准库 Jade 更改为用于视图模板的 `ejs`。\n\n> 你可以在可以在 http://www.embeddedjs.com/\
    \ 了解更多关于嵌入式 JavaScript 的信息。\n\n在此阶段，你必须拥有如下截图所示的默认脚手架：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_90_0.png)\n\
    \n# 修改初始化过程\n\n正如我们在上一章和上一张截图所示，生成器创建了一个 `bin` 文件夹。在这个文件夹中，我们有一个名为 `www` 的文件；该文件负责运行应用程序的服务器。我们不再使用默认命令\
    \ `npm start`，而是每次都需要执行服务器来测试和开发应用程序。我们将对启动服务器的方式进行更改。\n请遵循以下步骤：\n\n- 1. 删除 `bin`\
    \ 文件夹。\n- 2. 打开根文件夹下的 `app.js` 文件，并在文件末尾添加以下代码：\n\n```\napp.set('port', process.env.PORT\
    \ || 3000);\nvar server = app.listen(app.get('port'), function() {\n  console.log('Express\
    \ server listening on port ' + server\naddress.port);\n});\n```\n\n- 3. 将文件 `app.js`\
    \ 重命名为 `server.js`。\n\n现在，让我们检查更改的结果并在终端中使用以下命令启动服务器：\n\n```\nnode server\n```\n\
    \n你将在终端上看到 `Express server listening on port 3000` 消息。这意味着如果你打开浏览器并输入 `http://localhost:3000`，将看到来自\
    \ Express 框架的欢迎消息。\n\n`node server` 命令是初始化 Node.js 应用的最常用命令。\n\n要停止服务器，请按 Ctrl\
    \ + C。\n\n# 修改目录结构\n\n现在，让我们对目录结构进行一些更改。我们的目标是应用程序的职责分工做准备，创建一个名为 `server` 的文件夹，包含所有的应用程序后端代码；具体来说，就是\
    \ API 代码。\n\n使用以下步骤更改目录结构：\n\n- 1. 在根文件夹中创建一个新文件夹并命名为 `server`。\n\n- 2. 将 `routes`\
    \ 和 `views` 文件夹移动到新创建的 `server` 文件夹中。我们仍然需要完成一项重要任务。更改目录时，必须更改 `server.js` 文件中\
    \ views 和 routes 文件夹的某些路径。\n\n- 3. 打开 `server.js` 文件，更新 `require()` 函数内部 `routes`\
    \ 和 `users` 变量的路径；你的代码看起来应该是这样的：\n\n```\n// Setup Routes\nvar routes = require('./server/routes/index');\n\
    var users = require('./server/routes/users');\n```\n\n- 4. 打开 `server.js` 文件，找到注释掉的视图引擎设置行，并更改为以下代码：\n\
    \n```javascript\n// view engine setup\napp.set('views', path.join(__dirname, 'server/views'));\n\
    ```\n\n- 5. 现在，让我们检查到此为止一切是否符合预期；输入以下命令：\n`node server.js`\n\n- 6. 打开浏览器并访问 `http://localhost:3000`。\n\
    \n如果成功，我们将再次看到应用程序的首页以及来自 Express 框架的欢迎消息。\n\n使用 Express 生成器的优势之一是它自带配置了所有用于运行我们应用程序的基础模块，避免了编写许多行代码。仅通过这个微小的更改，你就已经拥有了一个稳固的脚手架来开始使用\
    \ Node 和 Express 框架开发应用程序。\n\n我们的文件夹看起来如下截图所示：\n\n- express-generator (-/Desktop/express-generator)\n\
    - node_modules (库主目录)\n- public\n  - images\n  - javascripts\n  - stylesheets\n\
    - server\n  - routes\n    - index.js\n    - users.js\n  - views\n    - error.ejs\n\
    \    - index.ejs\n  - package.json\n  - server.js\n\n# 插入文件夹和文件\n\n*(注：原文后续部分存在大量重复且逻辑混乱的英文片段，翻译已在逻辑完整处截止)*\n\
    \n"
