    \ 定义我们用户模型的 schema\nvar userSchema = new Schema({\n  email: String,\n  password:\
    \ String,\n})\n```\n\n## 创建会议 Web 应用程序\n\n```javascript\n// 生成哈希值\nuserSchema.methods.generateHash\
    \ = function (password) {\n  return bcrypt.hashSync(password, bcrypt.genSaltSync(8),\
    \ null);\n};\n```\n\n```javascript\n// 验证密码是否有效\nuserSchema.methods.validPassword\
    \ = function (password) {\n  return bcrypt.compareSync(password, this.local.password);\n\
    };\n```\n\n```javascript\n// 创建用户模型并导出到 app\nmodule.exports = mongoose.model('User',\
    \ userSchema);\n```\n\n注意，在高亮代码中，我们使用 bcrypt 为密码生成哈希值，并使用了一个验证方法（methods.validPassword）来检查密码是否有效。\n\
    \n## 检查 server.js 文件中的更改\n\n是时候检查 server.js 文件中的所有更改了，检查是否漏掉了什么。高亮的代码行表示它们是在此阶段添加的。\n\
    \n你的文件应该像下面的代码：\n\n```javascript\n// 导入模块 / 将模块赋值给变量\nvar express = require('express');\n\
    var path = require('path');\nvar favicon = require('static-favicon');\nvar logger\
    \ = require('morgan');\nvar cookieParser = require('cookie-parser');\nvar bodyParser\
    \ = require('body-parser');\nvar mongoose = require('mongoose');\nvar flash =\
    \ require('connect-flash');\nvar passport = require('passport');\n\n// 存储会话的模块\n\
    var session = require('express-session');\nvar MongoStore = require('connect-mongo')(session);\n\
    \n// 设置路由\nvar routes = require('./server/routes/index');\nvar users = require('./server/routes/users');\n\
    var speakers = require('./server/routes/speakers');\n\n// 数据库配置\nvar config =\
    \ require('./server/config/config.js');\n// 连接到数据库\nmongoose.connect(config.url);\n\
    // 检查 MongoDB 是否正在运行\nmongoose.connection.on('error', function() {\n  console.error('MongoDB\
    \ Connection Error. Make sure MongoDB is\\n  running.');\n});\n```\n\n```javascript\n\
    var app = express();\n\n// Passport 配置\nrequire('./server/config/passport')(passport);\n\
    \n// 视图引擎设置\napp.set('views', path.join(__dirname, 'server/views'));\napp.set('view\
    \ engine', 'ejs');\n\napp.use(favicon());\napp.use(logger('dev'));\napp.use(bodyParser.json());\n\
    app.use(bodyParser.urlencoded());\napp.use(cookieParser());\napp.use(express.static(path.join(__dirname,\
    \ 'public')));\n\n// 使用路由\napp.use('/', routes);\napp.use('/users', users);\n\
    app.use('/api/speakers', speakers);\n\n// 捕获 404 并转发到错误处理器\napp.use(function(req,\
    \ res, next) {\n  var err = new Error('Not Found');\n  err.status = 404;\n  next(err);\n\
    });\n\n// 开发错误处理器\n// 将打印堆栈跟踪\nif (app.get('env') == 'development') {\n  app.use(function(err,\
    \ res, next) {\n    res.status(err.status || 500);\n    res.render('error', {\n\
    \      message: err.message,\n      error: err\n    });\n  });\n}\n\n// 环境错误处理器\n\
    // 不向用户显示堆栈跟踪\napp.use(function(err, res, next) {\n  res.status(err.status ||\
    \ 500);\n  res.render('error', {\n    message: err.message,\n    error: {}\n \
    \ });\n});\n\nmodule.exports = app;\n```\n\napp.set('port', process.env.PORT ||\
    \ 3000);\n\n```javascript\nvar server = app.listen(app.get('port'), function()\
    \ {\n  console.log('Express server listening on port ' + server.address().port);\n\
    });\n```\n\n## 处理路由\n\n现在我们已经完成了用户身份验证的实现，我们需要配置应用程序路由来处理用户的验证和创建。\n\n在 routes\
    \ 文件夹下的 index.js 文件中进行一些更改：\n\n- 1. 将以下高亮代码添加到 index.js 文件：\n```javascript\nvar\
    \ express = require('express');\nvar router = express.Router();\nvar passport\
    \ = require('passport');\n\n/* 获取首页。 */\nrouter.get('/', function(req, res) {\n\
    \  res.render('index.ejs');\n});\n```\n\n注意，我们设置了默认路由来渲染一个名为 index.ejs 的页面。我们还没有创建这个页面，但很快就会创建；目前，我们将继续设置必要的路由来处理身份验证。\n\
    \n- 2. 让我们为 profile.ejs 页面创建路由：将以下代码放在主页路由函数之后：\n```javascript\n/* 获取个人资料页面。 */\n\
    router.get('/profile', isLoggedIn, function(req, res) {\n  res.render('profile.ejs',\
    \ {\n    user: req.user\n  });\n});\n```\n\n在这里，我们将 `isLoggedIn` 函数作为 `router.get()`\
    \ 函数的参数，并将用户对象作为 `res.render()` 函数的第二个参数。这表示用户必须登录才能查看此页面。\n\n"
