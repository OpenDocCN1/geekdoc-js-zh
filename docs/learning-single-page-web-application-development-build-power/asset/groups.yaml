    # Final notes on SPA


    Finally, we would like to emphasize some important points that were discussed
    throughout the book.


    The SPA refers to a main container that carries several templates within itself;
    something very similar to the concept of master pages in .NET framework. The following
    figure illustrates the main difference between SPA and a traditional web application.


    | Single Page Application | Traditional Web Application |

    | --- | --- |

    | SPA Template 1 | Page 1 |

    | Template 2 Templates view | Page 2 |

    | Template 3 | Page 3 |

    | No page refresh on request | Whole page refresh on request |'
