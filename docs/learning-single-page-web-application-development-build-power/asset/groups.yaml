- md: "\nFinally, when the code is rendered, we will have the My First Directive is\
    \ working string.\n\nAs mentioned before, the double brackets in {{ someGoesHere\
    \ }} are AngularJS expressions, and finally in our AngularJSController directive,\
    \ we can see the scope again.\n\n$scope.name is a kind of link between Controller\
    \ and View, and each controller has its own scope. Note that we used $scope in\
    \ two ways: directly in the variable, as we saw in the previous example, and assigning\
    \ to {}. to a variable. The most common way is $scope.name = {}. Here is a diagram\
    \ to illustrate the Angular diagram of scope:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_129_0.png)\n\
    \nIn the preceding figure, we note that the behavior of $scope interacts between\
    \ the Controller and the View, acting like a ViewModel.\n\n## Two-way data binding\
    \ and templates\n\nTwo-way data binding is one of the most interesting parts of\
    \ AngularJS. It is responsible for synchronizing changes made to Model, and it\
    \ manipulates DOM instantly. Without their help, it would need to write many,\
    \ lines of code to monitor changes to Model and return them to update DOM.\n\n\
    Let's see the following code, which illustrates the data binding:\n\n```\n<div\
    \ ng-controller=\"UserController\">\n  <h1>{{ user.name }} - {{ user.age }}</h1>\n\
    \  <p ng-bind=\"user.name\"></p>\n  <p ng-bind=\"user.age\"></p>\n  <br>\n  <input\
    \ type=\"text\" ng-model=\"user.name\">\n  <input type=\"text\" ng-model=\"user.age\"\
    >\n</div>\n```\n\nJust below the <html> tag, where we used the expression with\
    \ double brackets, we can see two paragraphs with the ng-bind directive; it does\
    \ the same thing as the expression, but if the code for some reason take a few\
    \ seconds to render, the user can view the double brackets before AngularJS takes\
    \ control of the page.\n\n## Reusing templates\n\nAs we can see in the previous\
    \ example, AngularJS allows us to create templates; HTML blocks with expressions\
    \ and directives to manipulate DOM. We can reuse templates with the following\
    \ code:\n\n```\n<div ng-controller=\"BandController\">\n<ul>\n  <li ng-repeat=\"\
    band in bands\">{{ band.album }}</li>li>\n</ul>\n</div>\n```\n\n## Understanding\
    \ dependency injection\n\nDependency injection is a common software design pattern\
    \ and widely used in AngularJS; it is similar to what we have in the Express framework\
    \ using require(). You just need to add the services as parameters to controllers,\
    \ directives, and functions. Many of these items will depend on others to work.\
    \ For example, a controller request to the server will need the $http service,\
    \ and this service has to come from somewhere.\n\nChapter 5\n\nTo facilitate this\
    \ configuration, AngularJS provides three ways to declare dependencies:\n\n- Directly\
    \ using the parameters of a function, as we can see in the following example:\n\
    ```javascript\nfunction UserController($scope, $http, $resource,\n  userservice)\
    \ {\n  var user;\n\n  $scope.user = {\n    name: \"Fernando\",\n    age: \"25\"\
    \n  }\n}\n```\n\n- Using an array, as shown here:\nUserController ('UserController',\
    \ ['$scope','$http'] function ($scope, $http) {...});\n\n- Using the $inject property,\
    \ as follows:\nUserController var = function ($scope, $http) {...};\nUserController\
    \ $inject = ['$scope','$$http'];\nuser.module('UserController', 'UserController');\n\
    \n> The best way to use an array, in which the case of compression/minify, prevents\
    \ possible function damage due to character replacement of variable names.\n\n\
    You can find more about dependency injection in Angular at https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection.\n\
    \n## Services\n\nServices are often interpreted incorrectly. They can be easily\
    \ confused with Ajax requests that are used with some backend service via the\
    \ HTTP protocol. However, they are singletons, a function, or an object and can\
    \ be used to hold and share data, through controllers, directives, filters, and\
    \ other services. Also, you are free to create your own services; just register\
    \ the service's name and the service factory function, with an Angular module.\
    \ The service factory function creates the object or exposes it to the rest of\
    \ the AngularJS application.\n\n```\nvar userModule = angular.module('userModule',\
    \ []);\nuserModule.factory('server', function() {\n```\n\nStarting with AngularJS\n\
    \n```\nvar serverServiceInstance;\n...\nreturn serverServiceInstance;\n});\n```\n\
    \nA .service() and .factory() function always have a return statement. Being singleton\
    \ only one instance of a specific service injector available in the entire life\
    \ of the AngularJS application. Other services are constant, value, and provider;\
    \ more about services can be found on the official documentation at https://docs.angularjs.org/guide/services.\n\
    \n## Modules in AngularJS\n\nIn AngularJS, modules are structured to build highly\
    \ scalable web applications. We can create them and use them throughout the application.\n\
    \nIt is very simple to create and inject it in the application. From the AngularJS\
    \ documentation, define modules as:\n\n- Modules are a container for the different\
    \ parts of your app such as controllers, services, filters, directives, and so.\n\
    More details about modules, can be found at https://docs.angularjs.org/api/ng/type/angular.Module.\n\
    \nModules can contain a collection of other components/dependencies such as controllers,\
    \ services, directives, and others.\n\nThe simple form to create a module is as\
    \ follows:\n\n```\nangular.module(ModuleName, [requires dependency]);\n```\n\n\
    The basic form to use a module is as follows:\n\n```\nangular.module('ModuleName');\n\
    ```\n\nLet's see a practical way to declare and instantiate a module and Controller:\n\
    \n```\nangular.module('User', [$scope'])\n.run(function($scope) {\n  $scope.user\
    \ = { name: 'Fernando' \n}\n});\nangular.module('User').controller('UserController',\
    \ function () {\n  //Controller content here\n});\n```\n\nThis way, we can add\
    \ as many modules as necessary to our application:\n\n```\nangular.module('User',\
    \ ['$scope']);\nangular.module(\"Message\", ['$scope', '$User']);\nangular.module(\"\
    Deliver\", ['Deliver']);\nangular.module(\"Mailbox\", ['Inbox', 'Compose']);\n\
    ```\n\n## Project organization\n\nNow, we enter a very controversial subject when\
    \ it comes to applications with AngularJS. There are many ways to configure your\
    \ environment for development using the framework. Interpret how to configure\
    \ the environment and structure the directories in a way that allows us to scale\
    \ it with ease.\n\nProbably, if you make a brief search, you will find many ways\
    \ to do this; this is totally acceptable, but for sure, you will find your own\
    \ way to do it. Until then, we will present some alternatives.\n\nThe official\
    \ AngularJS project has some boilerplate to start angular-seed; you can find it\
    \ at https://github.com/angular/angular-seed.\n\nThe following screenshot shows\
    \ angular-seed's structure:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_133_0.png)\n\
    \n## Starting with AngularJS\n\nGenerally, the whole structure of AngularJS applications\
    \ are structured in a directory called App, and there are many ways of using this\
    \ directory. For now, imagine that the application is growing over time and you\
    \ need to add more controllers in a single file called controllers.js and the\
    \ same for services, directives, and filters quickly; you will surely be in trouble.\n\
    \nNot to mention all controllers of an application in a single file, does not\
    \ make your team productive.\n\nSwitching back to angular-seed, the most important\
    \ file here and in almost all AngularJS applications is app.js, which is an alias\
    \ to application.js. Here's see its content:\n\n```\n'use strict';\n\n// Declare\
    \ app module which depends on filters, and services\nangular.module('MyApp', [\n\
    \  'ngRoute',\n  'MyApp.filters',\n  'MyApp.services',\n  'MyApp.directives',\n\
    \  'MyApp.controllers'\n]);\n\nconfig(function($routeProvider) {\n  $routeProvider.when('/view1',\
    \ {templateUrl: 'partials/partia1.nhtml', controller: 'MyCtrl1'});\n  $routeProvider.when('/view2',\
    \ {templateUrl: 'partials/partial2.nhtml', controller: 'MyCtrl2'});\n  $routeProvider.otherwise({redirectTo:\
    \ '/view1'});\n});\n```\n\nHere's the heart of the application. It is pretty simple\
    \ and useful to use, but not modular, and if your application grows too big, this\
    \ file can be a mess.\n\nA good way to modularize your application is by using\
    \ the following technique: note that we free the modules of the application without\
    \ any dependency:\n\n```\n// Modules without dependencies, an empty Array.\nangular.module('UserModule',\
    \ []);\nangular.module('BandModule', []);\nangular.module('DashboardModule', []);\n\
    ```\n"
