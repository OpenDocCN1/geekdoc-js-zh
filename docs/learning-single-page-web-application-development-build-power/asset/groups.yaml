    ## Deploy the Application to the Cloud


    ### Automatic deployment from GitHub


    As already mentioned, agile development at the end of each delivery, or as it
    is regularly called, we need to put the application into production. Now we will
    see how to do this in an automated manner. The following lines assume you have
    already configured a local repository using Git and a GitHub account.


    ### Setting up Shippable


    Setting up an account on Shippable is very simple and free. Moreover, you can
    use your account on GitHub or Bitbucket.


    - Visit http://www.shippable.com/ and click on the button. Then follow the instructions
    to register.

    - After the authorization process between GitHub and Shippable, you''ll be redirected
    to the Shippable dashboard. On the right-hand side, click on your account name
    below as shown in the following screenshot:

    - Then click on the repository name. Enable your GitHub repository. Very simple
    so far! Do not forget to choose the repository that stores our application. At
    this point, you have probably noticed that it is possible to run the application
    directly from the dashboard by clicking on the play symbol. However, it is not
    time to run the application yet. We still need to follow some steps to correctly
    set up the environment.


    ### Setting up Heroku


    Heroku is a cloud service platform, PaaS, that supports multiple programming languages.
    It is one of the oldest cloud services and started supporting only Ruby. Setting
    up an account is pretty simple: go to https://heroku.com/signup and follow the
    registration steps:


    1. On the dashboard, click (+) to create a new app and choose a name, as shown
    in the following screenshot:

    2. On your dashboard, click on Organizations and the account name, as shown in
    the following screenshot:

    3. Now we need to get the SSH key, so click on Deployment Key and copy the ssh-rsa
    key, as shown in the following screenshot:

    4. Go back to the Heroku dashboard and click on your account name, then click
    on the Manage Account menu item, as shown in the following screenshot:

    5. Go to **SSH Keys** at the bottom of the Account page and click on the **Edit**
    button in the right-hand, as shown in the following screenshot:

    6. Paste the SSH key in the **enter new key** input field as shown in the following
    screenshot and click the **Save** button.

    7. Go back to the dashboard and go to Settings, and copy the Heroku Git URL.


    ## Additional notes on Heroku deployment


    In the examples given throughout the book, we are utilizing a process of deployment
    that is widely used in software development, through a continuous integration
    service. However, you can proceed with deploying the application directly from
    your local development environment to a cloud service or to your own hosting service
    using Heroku Toolkit.


    Heroku Toolkit is a command-line program that lets you use specific commands in
    your terminal: `heroku`. The result of this command is shown in the following
    screenshot:


    ```

    Usage: heroku COMMAND [app] [command-specific-options]

    Primary help topics, type "heroku help TOPIC" for more details:

    | addons | manage addon resources |

    | apps | manage apps (create, destroy) |

    | auth | authentication (login) |

    | config | manage config vars |

    | domain | manage system domains |

    | dynos | manage dynos (dynos, workers) |

    | release | manage release commands (console, rake) |

    | run | run one-off commands |

    | collaborators | manage collaborators on an app |

    | certs | manage ssl for an app |

    | dist | scaling process for an app |

    | fork | clone an existing app |

    | git | manage git for |

    | help | list commands and display help |

    | info | authentication help |

    | labs | manage optional features |

    | maintenance | manage instances for an app |

    | members | manage membership in organization accounts |

    | orgs | manage organization accounts |

    | pgbackups | manage backups of postgres databases |

    | plugins | manage plugins for her gem |

    | regions | list available regions |

    | stack | manage the stack for an app |

    | status | check status of heroku platform |

    | update | update the heroku client |

    | version | display version |

    ```


    Additional topics:


    > You can find more information about direct deployment in the Heroku documentation
    at https://devcenter.heroku.com/articles/git.html


    After this brief explanation about direct deployment, we have covered how to deploy
    the application to the cloud using GitHub, Shippable, and Heroku.

