  mdcn: "\n\n## 使用 MongoDB 和 Node.js 构建 API\n\n当我们扩展单页应用（SPA）时，最常见的问题无疑是目录结构，以及我们如何使用\
    \ MVC/MVVM 管理所有的前端 JavaScript 文件和 HTML 模板。稍后，我们将看到处理大型应用的另一种替代方案；现在，让我们看看 MEANJS\
    \ 采用的模块结构：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_68_0.png)\n\n注意，MEANJS\
    \ 为 AngularJS 框架留下了更大的灵活性来处理前端应用的 MVC 方法，正如我们在 public 文件夹中看到的那样。此外，注意模块化方法；每个模块都有自己的结构，对控制器、服务、视图、配置和测试保持了一些某些约定。这对于团队开发非常有用，因此请保持所有结构的组织良好。这是一个完整的解决方案，利用了\
    \ `passport`、`swig`、`mongoose`、`karma` 等模块。\n\n## Passport 模块\n\n关于 Passport 模块必须说明几点：它可以被定义为一个简单、非侵入的认证模块。它是与\
    \ Node 配合使用的强大中间件；它非常灵活且模块化。它可以轻松适配到使用 Express 的应用程序中。\n\n它拥有 140 多种可选认证方式并支持会话持久化；它非常轻量且实现极其简单。它为我们提供了认证、重定向和验证所需的所有结构，因此可以使用\
    \ Facebook、Twitter 等其他社交网络的用户名和密码。\n\n以下是如何使用本地认证的简单示例：\n\n```javascript\nvar\
    \ Passport = require('passport');\nLocalStrategy = require('passport-local').Strategy,\n\
    User = require('mongoose').model('User');\n\nmodule.exports = function() {\n \
    \ // 使用本地策略\n  passport.use(new LocalStrategy({\n    username: 'username',\n \
    \   passwordField: 'password'\n  },\n  function(username, password, done) {\n\
    \    User.findOne({\n      username: username\n    }),\n    function(err, user)\
    \ {\n      if (err) {\n        return done(err);\n      }\n      if (!user) {\n\
    \        return done(null, false, {\n          message: 'Unknown user'\n     \
    \   });\n      }\n      if (!user.authenticate(password)) {\n        return done(null,\
    \ false, {\n          message: 'Invalid password'\n        });\n      }\n    \
    \  return done(null, user);\n    }\n  }));\n});\n```\n\n这是使用带有 Passport 模块的 MEAN.JS\
    \ 模板的登录页面示例截图：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_70_0.png)\n\n回到模板的主题；大多数大多数模板和生成器已经安装了\
    \ Passport 模块并准备好进行配置。此外，它还有一个代码生成器，可以与 Yeoman 配合，Yeoman 是另一个需要添加到你的工具箱中的必备前端工具。\n\
    \n> Yeoman 是最流行的现代 Web 应用脚手架代码生成器；它易于使用，并且有很多生成器，如 Backbone、Angular、Karma 和 Ember\
    \ 等。更多信息可以访问 http://yeoman.io/。\n\n## 生成器 (Generators)\n\n生成器之于前端，就像 gem 之于 Ruby\
    \ on Rails。我们可以使用可用的生成器为任何类型的应用程序创建基础。\n\n## 第 3 章\n\n这里是 Yeoman 生成器的控制台输出：\n\n\
    ![](img/76faac513e4fd5843aeb56a44cada4c9_71_0.png)\n\n开箱即用 Sass（带有 Compass）以及一些\
    \ AngularJS 推荐模块。\n\n- 你想使用 Sass（带有 Compass）吗？否\n- 你想包含 Twitter Bootstrap 吗？否\n\
    - 你想包含？angular-resource.js, angular-cookies.js, angular-sanitizer.js, router\n\
    - 你想使用 Mongoose 吗？否\n- create app/styles/main.css\n- create app/controllers/navbar.js\n\
    - create app/views/index.html\n- create app/views/partials/main.html\n- create\
    \ app/views/navbar.html\n- create app/views/db.html\n- create bower.json\n- create\
    \ package.json\n- create Gruntfile.js\n- create images/yeoman.png\n- create server.js\n\
    - create lib/shite.js\n- create lib/controllers/api.js\n- create lib/controllers/index.js\n\
    - create routes.js\n- create test/server/api.js\n- create lib/config/express.js\n\
    - create lib/config/config.js\n- create lib/config/dev.js\n- create lib/config/env/development.js\n\
    \n重要的是，要意识到我们可以在社区中通过生成器解决几乎所有问题。然而，如果你找不到你需要的生成器，你可以创建自己的并提供给整个社区使用，就像 Rails\
    \ 社区对 RubyGems 所做的那样。\n\nRubyGem，或简单称为 gem，是可重用 Ruby 文件的生成器，带有名称和版本（一个名为 gemspec\
    \ 的文件）。\n\n> 记住“不要重复自己”(DRY) 概念；始终尝试重用现有的代码块。不要发明轮子。\n\n使用代码生成器的巨大优势之一是，许多生成器都是随取随用的。\n\
    \n## Express 生成器\n\n另一个很好的选择是 Express 生成器，可以在 https://github.com/expressjs/generator\
    \ 找到。\n\n与 Rails 非常相似，我们可以看到 public、routes 和 views 文件夹的创建：\n\n```bash\nnpm install\n\
    ```\n\n运行应用：\n```bash\nDEBUG=express ./bin/www\n```\n\n注意创建的 package.json 文件：\n\
    \n```json\n{\n  \"name\": \"express-generator\",\n  \"version\": \"0.0.1\",\n\
    \  \"private\": true,\n  \"scripts\": {\n    \"start\": \"node /bin/www\"\n  },\n\
    \  \"dependencies\": {\n    \"express\": \"4.2.0\",\n    \"static-favicon\": \"\
    1.0.0\",\n    \"morgan\": \"1.0.0\",\n    \"cookie-parser\": \"1.0.1\",\n    \"\
    body-parser\": \"1.0.0\",\n    \"debug\": \"0.7.4\",\n    \"jade\": \"1.3.0\"\n\
    \  }\n}\n```\n\n这是一个构建 Web 应用的简单有效的 package.json。\n\n## 演讲者 API\n\n让我们直接构建示例 API。为了更真实，我们来写一个类似于敏捷方法中待办列表的用户故事。让我们了解通过\
    \ API 需要解决的问题。\n\n## 用户故事\n\n我们需要一个 Web 应用来管理会议的演讲者。主要任务是在 API 中存储以下演讲者信息：\n\n\
    * 姓名\n* 公司\n* 分类主题标题\n* 描述\n* 演讲者照片\n* 演讲安排\n\n现在，我们需要使用纯 JSON 格式的 API 添加、编辑和删除演讲者。这是一个简单的\
    \ CRUD 功能。\n\n## 创建 package.json 文件\n\n虽然现在还没有必要，但我们建议你安装 Webstorm IDE，因为我们将在整本书中使用它。\n\
    \n> 从现在开始，当我们提到终端时，指的是 Webstorm 集成终端，但你也可以通过选择的独立编辑器直接访问，Mac 和 Linux 使用终端， Windows\
    \ 使用命令提示符。\n\n## 初始化 JSON 文件\n\n按照以下步骤初始化 JSON 文件：\n\n 1. 创建空文件夹并命名为 conference-api，打开你的终端，并放置命令：\n\
    \n```bash\nnpm init\n```\n\n"
