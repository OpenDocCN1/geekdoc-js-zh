  mdcn: "\n\n## 关系型数据库与 NoSQL 数据库的比较\n\n在 MongoDB 的情况下，你可以在需要的地方使用它，而不是在所有情况下都使用。在关系型模型中，通常会在相关表中创建一个新列，如下截图所示：\n\
