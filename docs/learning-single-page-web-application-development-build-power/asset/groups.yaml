- md: '

    ## Understanding Single Page Application


    To install Grunt on your machine, just type the following command in your terminal
    window:


    ```

    npm install grunt-cli

    ```


    While these three tools represent the necessary triad for a fast web development
    environment, it is not obligatory. All tools can be installed one at a time as
    explained, or in general using Yeoman.


    ## The SPA directory structure


    There''s lots of consensus among the main frameworks and libraries about how to
    do MVC architecture, declarative bindings, and so on. Your choice will deeply
    influence your architecture.


    Some frameworks recommend a specific directory structure to be followed, but some
    others are more flexible.


    We''ll adopt a boilerplate to build our API in the next chapters, and we''ll discuss
    more about server structure and code organization; we should always think with
    regard to maintenance and scalability of the application. For now, let''s see
    an example of a basic structure that is very common to all MVC patterns:


    ![](img/76faac513e4fd5843aeb56a44cada4c9_40_0.png)


    A simple basic SPA structure consists of the following:


    - Basic-folder-example [SPA]: This folder is the root of our application and has
    our one main file, index.html.

    - CSS: This folder contains all stylesheets.

    - images: This folder contains all images.

    - js: this has all the subfolders and a file called app.js (our startup file).

    - controllers folder: this contains all controllers'' files, but we can name this
    as Collections or ViewModels depending on what kind of library or framework we
    be using.

    - models: this folder contains all model files.

    - views: this contains all view files (only data, no HTML rendering here).

    - libs: this contains all third-party libraries such as jQuery, Handlebars, and
    Knockout.

    - templates: this folder has all script templates such as Handlebars, Underscore.
    Note that this folder contains all the templates we will use in our application.


    Note that we don''t have any folder to deal with routes, but from a basic application,
    we can put our routing logic in our app.js or server.js file.


    > In Node.js applications, often the initialization file is called app.js or server.js
    and is always in the root directory of the application.


    Despite being a very basic structure, it is sufficient for understanding the basics
    of folder names. Of course, as things are getting complex, we need to re-evaluate
    this structure (maybe include a folder for Sass or Less files and also add other
    things). However, in the course of the book, we will see some alternatives.


    ## It''s all about JavaScript


    As mentioned before, all SPAs are made with JavaScript, and of course, where you
    have a lot of JavaScript you can easily get in trouble if you don''t notice of
    code organization.


    ## Understanding Single Page Application


    We recommend that you use some validation tools such as JSLINT and JSHINT and
    also a validation tool for JSON files such as JSONLint. The following are the
    links for these validation tools:


    - JSLint: http://www.jslint.com/

    - JSHint: http://www.jshint.com/

    - JSONLint: http://jsonlint.com/


    The main difference between LINT and HINT is that LINT validates indentation and
    HINT doesn''t.


    ## HTML, CSS, and the responsive web


    Now that we have seen a general overview about the tools to ease our life in MVVM/MV
    client-side development, we take a look at two tools that will help us on the
    interface with HTML and CSS.


    As the goal of the book is not to be the absolute guide for interface design,
    we introduce a simple library build with only HTML and CSS as its name makes clear,
    Pure CSS.


    ## Pure CSS


    This tool provides us with a complete user interface with several components for
    forms, tables, menus, buttons, and everything else we need to build robust interfaces.
    The main point here, is the ability to build the interface components without
    JavaScript behaviors and can be downloaded for free from purecss.io.


    > Pure is ridiculously tiny. The entire set of modules adds up to 4.5 KB when
    minimized and zipped. Crafted with mobile devices in mind, it is important to
    us to keep our file sizes small, and every line of CSS was carefully considered
    (source: http://purecss.io/).


    The important point here is that despite being directed to complete and responsive
    design, we can use it in a modular way and not have to depend on your responsive
    grid system, although very useful in applications is not necessary for our examples.


    With this in mind, we chose another responsive grid system called Responsive boilerplate;
    it is very simple to use with only three main classes and twelve columns. It can
    also be downloaded for free from http://www.responsiveboilerplate.com.


    Responsive boilerplate is a lightweight (1.5 KB) cross-browser grid system, elegant
    and minimalist, made with only three main classes and 12 columns. It is built
    with mobile first in mind, fits any screen size, and is prepacked with some extra
    CSS helpers for mobile devices.


    It also has a series of snippets for the Sublime Text editor, which can be downloaded
    from https://github.com/neweaonweb/ResponsiveBoilerplateSnippets.


    It can also be simply installed via Package Control on Sublime Text. The package
    is very complete and makes our development process very fast, as we can see in
    the following screenshot:


    | Snippet: Responsive Boilerplate Container | Rbcontainer.tab |

    | Snippet: Responsive Boilerplate Col1 | Rbcol1.tab |

    | Snippet: Responsive Boilerplate Col10 | Rbcol10.tab |

    | Snippet: Responsive Boilerplate Col11 | Rbcol11.tab |

    | Snippet: Responsive Boilerplate Col12 | Rbcol12.tab |

    | Snippet: Responsive Boilerplate Col2 | Rbcol2.tab |

    | Snippet: Responsive Boilerplate Col3 | Rbcol3.tab |

    | Snippet: Responsive Boilerplate Col4 | Rbcol4.tab |

    | Snippet: Responsive Boilerplate Col5 | Rbcol5.tab |

    | Snippet: Responsive Boilerplate Col6 | Rbcol6.tab |

    | Snippet: Responsive Boilerplate Col7 | Rbcol7.tab |

    | Snippet: Responsive Boilerplate Col8 | Rbcol8.tab |

    | Snippet: Responsive Boilerplate Col9 | Rbcol9.tab |

    | Snippet: Responsive Boilerplate Content | Rbcontent.tab |

    | Snippet: Responsive Boilerplate Navigation | Rbinav.tab |

    | Snippet: Responsive Boilerplate Columns | Rbcolumns.tab |


    We can install both Pure CSS and Responsive Boilerplate with Bower. It''s very
    simple, just type the following commands in terminal:


    ```

    bower install responsiveboilerplate

    bower install purecss

    ```


    We will cover this in practice in the upcoming chapters.


    There is also a series of templates to develop SPAs provided by the community
    behind the Microsoft for IDE Visual Studio 2012, which can be downloaded for free
    from http://www.asp.net/single-page-application/overview/.


    > All the tools mentioned in this chapter are open source and maintained by the
    community development, except the Visual Studio and WebStorm IDEs. You should
    choose tools that are useful and productive for your development environment.


    ![](img/76faac513e4fd5843aeb56a44cada4c9_44_0.png)


    ## Summary


    As we have seen, the development of applications of Single Page can be extremely
    complex and have countless resources at our disposal, from simple text editors
    to IDEs as WebStorm and Visual Studio.


    What happens in almost every SPA is that the data traffic from the database to
    the User interface is done through a common restful API using the JSON file format.


    The next chapter will dive deep into RESTful applications with the MongoDB and
    Express frameworks running a Node.js server. We will also check some of the main
    concepts of Node, such as the event loop and callbacks.


    ## Taking a Deep Dive into Node.js and MongoDB


    A built-in asynchronous I/O, single-threaded or even multithreaded, real-time
    applications, sockets, and HTTP connections make Node.js the most powerful tool
    to create web servers that run JavaScript on the server side.


    MongoDB is agile, scalable, document-oriented schema less, and high performance,
    which makes it one of the most popular NoSQL databases. Node.js and MongoDB unleashed
    all the power for high-performance web applications with Express, a lightweight
    web framework that supports template engines, routing, and flash notices. It''s
    very similar to Sinatra from Ruby. Moving forward, we will see some of the key
    concepts about all of these tools.


    The following will be covered in the chapter:


    - Node server, NPM, and middlewares

    - Event-driven development and the event loop

    - Working with require() and modules

    - Express, a web framework on a server

    - MongoDB and the terminal

    - The MongoDB connection with Mongoose

    - Mongoose schemas and models

    '
  mdcn: '


    ## 理解单页应用 (Single Page Application)


    若要在你的机器上安装 Grunt，只需在终端窗口中输入以下命令：


    ```

    npm install grunt-cli

    ```


    虽然这三个工具代表了快速 Web 开发环境的必要三剑客，但并非强制性的。你可以像前面解释的那样逐个安装所有工具，或者通常使用 Yeoman 安装。


    ## SPA 目录结构


    主流框架和库对于如何实现 MVC 架构、声明式绑定等内容有许多共识。你的选择将深远地影响你的架构。


    某些框架建议遵循特定的目录结构，但另一些框架则更加灵活。


    我们将在接下来的章节中使用一个模板项目（boilerplate）来构建我们的 API，并讨论更多关于服务器结构和代码组织的内容；我们应该始终考虑应用程序的可维护性和扩展性。现在，让我们来看一个所有
    MVC 模式中非常常见的的基础结构示例：


    ![](img/76faac513e4fd5843aeb56a44cada4c9_40_0.png)


    一个简单的基础 SPA 结构包含以下内容：


    - Basic-folder-example [SPA]: 此文件夹是应用程序的根目录，包含我们的一个主文件 index.html。

    - CSS: 此文件夹包含所有的样式表。

    - images: 此文件夹包含所有图片。

    - js: 包含所有的子文件夹和一个名为 `app.js` 的文件（我们的启动文件）。

    - controllers 文件夹: 包含所有的控制器文件，但根据我们使用的库或框架，我们可以将其命名为 Collections 或 ViewModels。

    - models: 此文件夹包含所有的模型文件。

    - views: 包含所有的视图文件（仅包含数据，此处 HTML 渲染）。

    - libs: 包含所有的第三方库，如 jQuery、Handlebars 和 Knockout。

    - templates: 此文件夹包含所有的脚本模板，如 Handlebars、Underscore。注意，此文件夹包含了我们在应用程序中使用的所有模板。


    注意，我们没有用于处理路由（routes）的文件夹，但对于基础应用程序，我们可以将路由逻辑放在 `app.js` 或 `server.js` 文件中。


    > 在 Node.js 应用程序中，初始化文件通常称为 `app.js` 或 `server.js`，并且始终位于应用程序的根目录下。


    尽管这是一个非常基础的结构，但对于理解文件夹命名的基础知识已经足够了。当然，随着事情变得复杂，我们需要重新评估这个结构（可能包含用于 Sass 或 Less
    文件的文件夹，并添加其他内容）。然而，在本书的过程中，我们将看到一些替代方案。


    ## 核心在于 JavaScript


    如前所述，所有的 SPA 都是用 JavaScript 开发的。当然，如果你不注意代码组织，在大量使用 JavaScript 的地方你很容易遇到麻烦。


    ## 理解单页应用 (Single Page Application)


    我们建议你使用一些验证工具，如 JSLINT 和 JSHINT，以及用于 JSON 文件的验证工具 JSONLint。以下是这些验证工具的链接：


    - JSLint: http://www.jslint.com/

    - JSHint: http://www.jshint.com/

    - JSONLint: http://jsonlint.com/


    LINT 和 HINT 之间的主要区别在于 LINT 会验证缩进，而 HINT 不会。


    ## HTML、CSS 与响应式 Web


    现在我们已经看到了关于简化 MVVM/MV 客户端开发工具的总体概览，让我们来看看两个将帮助我们与 HTML 和 CSS 交互的工具。


    由于本书的目标不是成为界面设计的绝对指南，我们引入了一个简单的库，正如其名称所表明的，仅使用 HTML 和 CSS 构建：Pure CSS。


    ## Pure CSS


    该工具为我们提供了一个完整的用户界面，包含表单、表格、菜单、按钮以及我们构建健壮界面所需的其他所有组件。这里的重点是，它可以在没有 JavaScript 行为的情况下构建界面组件，并且可以从
    purecss.io 免费下载。


    > Pure 小巧得惊人。整个模块集经过压缩和 压缩后总计只有 4.5 KB。考虑到移动设备的设计，对我们来说保持较小的字体至关重要，每一行 CSS 都经过了仔细的考虑（来源：http://purecss.io/）。


    这里的关键点是，尽管它的目标是完整且响应式的设计，我们可以以模块化的方式使用它，而无需依赖你的响应式网格系统，尽管它在应用程序中非常有用，但在我们的示例中并不是必须的。


    考虑到这一点，我们选择了另一个名为 Responsive boilerplate 的响应式网格系统；它非常简单用，只有三个主类和十二列。也可以从 http://www.responsiveboilerplate.com
    免费下载。


    Responsive boilerplate 是一个轻量级（1.5 KB）跨浏览器网格系统，优雅且极简，仅由三个主类和 12 列组成。它是以移动优先为设计的，适合任何屏幕尺寸，并预装了一些针对移动设备的额外
    CSS 辅助工具。


    它还有一系列针对 Sublime Text 编辑器的片段（snippets），可以从 https://github.com/neweaonweb/ResponsiveBoilerplateSnippets
    下载。


    它也可以通过 Sublime Text  Package Control 简单安装。该包非常完整，并使我们的开发过程变得非常快，如下截图所示：


    | Snippet: Responsive Boilerplate Container | Rbcontainer.tab |

    | Snippet: Responsive Boilerplate Col1 | Rbcol1.tab |

    | Snippet: Responsive Boilerplate Col10 | Rbcol10.tab |

    | Snippet: Responsive Boilerplate Col11 | Rbcol11.tab |

    | Snippet: Responsive Boilerplate Col12 | Rbcol12.tab |

    | Snippet: Responsive Boilerplate Col2 | Rbcol2.tab |

    | Snippet: Responsive Boilerplate Col3 | Rbcol3.tab |

    | Snippet: Responsive Boilerplate Col4 | Rbcol4.tab |

    | Snippet: Responsive Boilerplate Col5 | Rbcol5.tab |

    | Snippet: Responsive Boilerplate Col6 | Rbcol6.tab |

    | Snippet: Responsive Boilerplate Col7 | Rbcol7.tab |

    | Snippet: Responsive Boilerplate Col8 | Rbcol8.tab |

    | Snippet: Responsive Boilerplate Col9 | Rbcol9.tab |

    | Snippet: Responsive Boilerplate Content | Rbcontent.tab |

    | Snippet: Responsive Boilerplate Navigation | Rbinav.tab |

    | Snippet: Responsive Boilerplate Columns | Rbcolumns.tab |


    我们可以使用 Bower 安装 Pure CSS 和 Responsive Boilerplate。这非常简单，只需在终端中输入以下命令：


    ```

    bower install responsiveboilerplate

    bower install purecss

    ```


    我们将在接下来的章节中实践这些内容。


    还有系列由社区提供的用于开发 SPA 的模板，以及微软的 Visual Studio 2012 可以从 http://www.asp.net/single-page-application/overview/
    免费下载。


    > 除了 Visual Studio 和 WebStorm IDE 外，本中提到的所有工具都是开源的并由社区维护。你应该选择对你的开发有用且高效的工具。


    ![](img/76faac513e4fd5843aeb56a44cada4c9_44_0.png)


    ## 总结


    正如我们所见，单页应用程序的开发可能非常复杂，并且有许多资源可以使用，从简单的文本编辑器到 IDE WebStorm 和 Visual Studio。


    在所有的 SPA 中，从数据库到用户界面的数据传输都是通过常见的 restful API 使用 JSON 格式完成的。下一章节将通过 MongoDB 和 Express
    框架深入探讨 RESTful 应用。我们还将检查 Node 的一些核心概念，如事件循环和回调。


    ## 深入学习 Node.js 和 MongoDB


    内置的异步 I/O、单线程甚至多线程、实时应用、套接字和 HTTP 连接使得 Node.js 成为创建运行 JavaScript Web 服务器的最强大工具。


    MongoDB 是敏捷、可扩展、文档化无模式且高性能的，这使其成为最流行的 NoSQL 数据库之一。Node.js 和 MongoDB 配合 Express
    框架释放了高性能 Web 应用的能量，Express 是一个支持模板引擎、路由和闪存信息的轻量级 Web 框架；它类似于 Ruby 的 Sinatra。接下来，我们将看到这些工具的一些关键概念。


    本章将涵盖：


    - Node 服务器、NPM 和中间件

    - 事件驱动开发和事件循环

    - 使用 require() 和模块

    - Express Web 框架

    - MongoDB 和终端

    - 使用 Mongoose 进行 MongoDB 连接

    - Mongoose 模式和模型


    '
