    \ languages.\n\nThe AngularJS framework is designed to be highly testable and\
    \ because of that we have some tools that facilitate this process. Today, writing\
    \ test cases is part of the web development process of every programmer, whether\
    \ frontend or backend. Test-driven development is part of all agile methodologies\
    \ and you should remember this. The sooner you start writing tests, the better\
    \ it will be for you.\n\nIn the upcoming sections, we will see some basic concepts\
    \ of tests, such as unit testing and integration testing (known as e2e testing)\
    \ among other things. These are as follows:\n\n- Testing concepts\n- Introducing\
    \ Jasmine\n- Configuring Karma (unit test)\n- Running a Karma test\n- Configuring\
    \ Protractor (e2e testing)\n- Running Protractor testing\n\n# Testing concepts\n\
    \nLet's focus on the two types of tests that will be covered in our sample application:\
    \ unit testing and e2e testing. Very interesting fact to note here is that previously\
    \ most of the frontend developers did not worry about tests. Testing was exclusively\
    \ done by the testing team or quality assurance department. However, the reality\
    \ has changed now. It is hard to find test developers with even a basic knowledge\
    \ of JavaScript to perform the necessary tests on SPAs. When I mention test, it\
    \ means automated testing. The reason why we consider an automated test is that\
    \ when your application grows from medium to large scale, it will become very\
    \ complicated to test all interfaces with new implementations.\n\nCurrently, frontend\
    \ developers are more concerned with how to write JavaScript, and how to apply\
    \ concepts of Test-Driven Development (TDD) and Behavior-Driven Development (BDD).\n\
    \nThe following diagram illustrates the workflow of TDD:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_164_0.png)\n\
    \nThe concept of TDD is directly related the the techniques of extreme programming,\
    \ where the developer creates small test cases for a given functionality, then\
    \ implements the code for it to respond, and pass the test. This kind of pattern\
    \ is directly related to the unit tests; of course, there are many other things\
    \ about unit testing and TDD, but these terms are fine to understand the importance.\
    \ Also, unit tests help the developer to maintain focus on what is really important.\n\
    \nOn the other side, we have BDD (widely used in agile software development),\
    \ which allows you to integrate the entire team with developers and business people.\
    \ This does not use technical language to describe expected behaviors of the system\
    \ interface.\n\nThe main idea is to write small blocks of tests, and write the\
    \ necessary code to pass the tests. This procedure is of utmost importance in\
    \ an agile development because the code must be readable to be maintained and\
    \ easy to scale.\n\nUnit tests are very useful to test small blocks of code, but\
    \ when we need to perform tests on a set of all these small blocks, and when we\
    \ need to think of the behavior we expect from the interface. For this, we use\
    \ e2e testing. So the main purpose of writing code with tests is to produce code\
    \ that is easily maintainable, understandable for humans, debuggable, and bug\
    \ free.\n\nAlthough this is not an everyday practice for frontend developers,\
    \ TDD is very useful when we come to software development in general. It is extremely\
    \ suitable when using any MVC or MVVM pattern.\n\nSo, let's see how we implement\
    \ tests on our SPA.\n\nThe Angular framework was built and planned with testing\
    \ in mind, so we have a lot of options to choose from regards with frameworks.\
    \ The forthcoming examples will talk about the Karma and Protractor test runner.\n\
    \n# Introducing Jasmine\n\nKarma is one of the most commonly used tools for test\
    \ execution; it is compatible with many testing frameworks (such as Mocha, QUnit,\
    \ and Jasmine). You can use it to test any JavaScript code, and it is highly recommended\
    \ that you use some tool to and perform automated testing on SPA.\n\nIn the following\
    \ examples, we will be using Jasmine to write the tests and Karma to run the test.\
    \ Jasmine has a very simple and easy writing syntax.\n\n```\ndescribe(\"Test name\"\
    , function() {\n  it(\"contains expectation\", function() {\n    expect(true).toBe(true);\n\
    \  });\n});\n```\n\n# Testing Angular SPA with Karma and Protractor\n\ndescribe()\
    \ and it() are two functions. describe() has a string parameter that receives\
    \ the name, and a function parameter that implements the spec.\n\n```\ndescribe(\"\
    Test name\", function() {\n  it(\"contains expectation\", function() {\n    expect(true).toBe(true);\n\
    \  });\n});\n```\n\nThe Jasmine API is pretty easy to understand; it has several\
    \ other functions, but this baseline is enough to understand the following examples.\n\
    \n> To find out more about Jasmine, refer to http://jasmine.github.io/\n\n# Configuring\
    \ Karma (unit test)\n\nLet's take a look at the Karma runner and how to start\
    \ using it.\n\n> We will not cover the necessary steps to install Karma and its\
    \ modules: you can download the entire project from the examples and.\n\nEasiest\
    \ way to create this file is to use the karma-cli tool. This way, you will have\
    \ the `init` command available in your terminal. This is a standard procedure\
    \ used in many tools available for Node.js, such as Grunt, Bower, and some others.\n\
    \n**Command line interface (CLI)** helps us create files and settings in a simple\
    \ and fast way using the terminal. As we already have the `karma.conf.js` file,\
    \ we don't need to perform the `init` command.\n\nOpen the project folder. Now,\
    \ let's review the `karma.conf.js` file to understand it by line:\n\n```\n'use\
    \ strict';\n\n/**\n* Module dependencies.\n */\nvar applicationConfiguration =\
    \ require('./config/config');\n\n// Karma configuration\nmodule.exports = function(config)\
    \ {\n  config.set({\n    // Frameworks to use\n    frameworks: ['jasmine'],\n\
    \  });\n});\n```\n"
