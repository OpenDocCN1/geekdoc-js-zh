    \ AngularJS 接管页面之前看到双括号。\n\n## 重用模板\n\n正如我们在上一个示例所示，AngularJS 允许我们创建模板；即带有表达式和指令操作\
    \ DOM 的 HTML 块。我们可以通过以下代码重用模板：\n\n```\n<div ng-controller=\"BandController\">\n\
    <ul>\n  <li ng-repeat=\"band in bands\">{{ band.album }}</li>li\n</ul>\n</div>\n\
    ```\n\n## 理解依赖注入\n\n依赖注入是一种常见的软件设计模式，并在 AngularJS 中被广泛；它类似于我们在 Express 框架中使用 `require()`\
    \ 的方式。你只需要将服务作为参数添加到控制器、指令和函数中。这些项目中许多依赖于其他项才能工作。例如，一个请求服务器的控制器需要 `$http` 服务，而这个服务必须从某处获取。\n\
    \n第5章\n\n为了方便这种配置，AngularJS 提供了三种声明依赖的方法：\n\n- 直接使用函数的参数，如下例所示：\n```javascript\n\
    function UserController($scope, $http, $resource,\n  userservice) {\n  var user;\n\
    \n  $scope.user = {\n    name: \"Fernando\",\n    age: \"25\"\n  }\n}\n```\n\n\
    - 使用数组，如下：\nUserController ('UserController', ['$scope','$http'] function ($scope,\
    \ $http) {...});\n\n- 使用 `$inject` 属性，如下：\nUserController var = function ($scope,\
    \ $http) {...};\nUserController $inject = ['$scope','$$http'];\nuser.module('UserController',\
    \ 'UserController');\n\n> 使用数组最好的方法，在压缩/混淆的情况下，它可以防止由于变量名字符替换而可能导致函数损坏。\n\n你可以在此处找到更多关于\
    \ Angular 中依赖注入的信息：https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection。\n\
    \n## 服务 (Services)\n\n服务经常被误解。它们很容易与通过 HTTP 协议与后端服务的 Ajax 请求混淆。然而，它们是单例、函数或对象，可以用于通过控制器、指令、过滤器和其他存储来共享数据。此外，你可以自由创建自己的服务；只需在\
    \ Angular 模块中注册服务的名称和服务工厂函数即可。服务工厂函数创建对象或将其暴露给 AngularJS 应用程序的其他部分。\n\n```\nvar\
    \ userModule = angular.module('userModule', []);\nuserModule.factory('server',\
    \ function() {\n```\n\n从 AngularJS 开始\n\n```\nvar serverServiceInstance;\n...\n\
    return serverServiceInstance;\n});\n```\n\n`.service()` 和 `.factory()` 函数始终有一个返回语句。作为单例，在整个\
    \ AngularJS 应用程序生命周期内，只有一个特定服务注入器的实例可用。其他服务包括常量（constant）、值（value）和提供者（provider）；更多关于服务的可以在官方文档中找到：https://docs.angularjs.org/guide/services。\n\
    \n## AngularJS 中的模块 (Modules)\n\n在 AngularJS 中，模块用于构建高度可扩展的 Web 应用程序。我们可以创建它们并在整个应用程序中使用它们。\n\
    \n在应用程序中创建并注入它非常简单。根据 AngularJS 文档，模块定义为：\n\n- 模块是你的应用程序不同部分的容器，如控制器、服务、过滤器、指令等。\n\
    关于模块的更多详细信息可以在此处找到：https://docs.angularjs.org/api/ng/type/angular.Module。\n\n\
    模块可以包含其他组件/依赖的集合，如控制器、服务、指令等。\n\n创建模块的简单形式如下：\n\n```\nangular.module(ModuleName,\
    \ [requires dependency]);\n```\n\n使用模块的基本形式如下：\n\n```\nangular.module('ModuleName');\n\
    ```\n\n让我们来看一种声明和实例化模块及控制器的实用方法：\n\n```\nangular.module('User', [$scope'])\n.run(function($scope)\
    \ {\n  $scope.user = { name: 'Fernando' \n}\n});\nangular.module('User').controller('UserController',\
    \ function () {\n  // 在此处编写控制器内容\n});\n```\n\n通过这种方式，我们可以为应用程序添加尽可能多的模块：\n\n```\n\
    angular.module('User', ['$scope']);\nangular.module(\"Message\", ['$scope', '$User']);\n\
    angular.module(\"Deliver\", ['Deliver']);\nangular.module(\"Mailbox\", ['Inbox',\
    \ 'Compose']);\n```\n\n## 项目组织\n\n现在，当涉及到 AngularJS 应用程序时，我们进入了一个非常有争议的话题。有许多方法可以使用该框架为开发配置环境。解释如何配置环境以及构建目录结构，以便我们轻松地扩展。\n\
    \n可能，如果你进行简短搜索，你会发现许多这样做的方法；这是完全可以接受的，但你肯定会找到自己的方法。在此之前，我们将提供一些替代方案。\n\n官方 AngularJS\
    \ 项目有一些用于启动 angular-seed 的样板代码；你可以在此处找到：https://github.com/angular/angular-seed。\n\
    \n下面的截图显示了 angular-seed 的结构：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_133_0.png)\n\
    \n## 开始 AngularJS\n\n通常，AngularJS 应用程序的整个结构在一个名为 App 的目录中，使用该目录有很多方法。现在，想象应用程序随着时间的推移而增长，并且你需要在一个名为\
    \ `controllers.js` 的单文件中添加更多控制器，并对服务、指令和过滤器也是这样做；你一定会遇到麻烦。\n\n更不用说将应用程序的所有控制器都写在一个文件中，这不会提高你团队的效率。\n\
    \n回到 angular-seed，这里以及几乎所有 AngularJS 应用程序最重要的文件是 `app.js`，它是 `application.js`\
    \ 的别名。让我们来看它的内容：\n\n```\n'use strict';\n\n// 依赖于过滤器和服务的 模块\nangular.module('MyApp',\
    \ [\n  'ngRoute',\n  'MyApp.filters',\n  'MyApp.services',\n  'MyApp.directives',\n\
    \  'MyApp.controllers'\n]);\n\nconfig(function($routeProvider) {\n  $routeProvider.when('/view1',\
    \ {templateUrl: 'partials/partia1.nhtml', controller: 'MyCtrl1'});\n  $routeProvider.when('/view2',\
    \ {templateUrl: 'partials/partial2.nhtml', controller: 'MyCtrl2'});\n  $routeProvider.otherwise({redirectTo:\
    \ '/view1'});\n});\n```\n\n这是应用程序的核心。它非常简单且实用，但不是模块化的，如果你的应用程序变得太大，这个文件可能会变得一团糟。\n\
    \n模块化你的应用程序的好方法是使用以下技术：注意我们在没有依赖的情况下释放了应用程序的模块：\n\n```\n// 没有依赖的模块，一个空数组。\nangular.module('UserModule',\
    \ []);\nangular.module('BandModule', []);\nangular.module('DashboardModule', []);\n\
    ```\n"
