  - "[PAGE 121]\n\n# Starting with AngularJS\n\nAlthough it is easy to start developing\
    \ SPAs with AngularJS, but over time and as your application grows, there will\
    \ be tasks that are more difficult to solve. So, it is very important to understand\
    \ all the concepts very well. Unlike other JavaScript frameworks, AngularJS adopts\
    \ a more connected approach to the HTML syntax, functioning as a kind of language\
    \ extension.\n\nWe consider these topics as core concepts for a good understanding\
    \ of the AngularJS directives, scope, services, controllers, dependency injection,\
    \ and expressions. Even this seems a lot, but if if we take into account the complexity\
    \ of the framework. However, as this book is not an absolute guide to AngularJS,\
    \ we will only discuss here a few concepts that are considered as fundamentals\
    \ to build SPAs. Once the concepts are understood, you will have the necessary\
    \ basics to move forward with the framework.\n\nThroughout this chapter, we will\
    \ be focusing on the following concepts:\n\n+   * Starting the baseline application\n\
    * The AngularJS MVC pattern implementation\n    * Model\n    * View\n    * Controller\n\
    * Detailing directives, expressions, and scope\n* Two-way data binding and templates\n\
    * Understanding dependency injection\n* Services\n* Modules\n* Project organization\n\
    * Pattern implementation"
  - "[PAGE 122]\n\n# Starting with AngularJS\n\nAs we said, AngularJS is a powerful\
    \ tool to develop SPAs and can also be considered as an MVC or MVVM framework;\
    \ its flexibility is so great that it suits our needs. Let's understand some concepts\
    \ to help us choose the better way.\n\n# Starting the baseline application\n\n\
    As with any web application, we kick off creating a basic page. Later, we will\
    \ discuss all the components that appear in the following example, by this time,\
    \ we focus on the baseline initialization of ng application:\n\n```\n<html ng-app>\n\
    <head>\n  <title>Angular baseline</title>\n  <script>\n    src=\"https://cdn.cloudflare.com/ajax/libs/angular.js/1.2.20/angular.min.js\"\
    ></script>\n</head>\n<body>\n  <input type=\"text\" ng-model=\"name\">\n  <p>Hello:\
    \ {{ name }}</p>\n</body>\n</html>\n```\n\nBy declaring the ng-app property on\
    \ the html tag, we are initializing our application. It's the first of some new\
    \ properties that we will use. The entire framework revolves around these new\
    \ statements.\n\nThe ng-app property informs that our Document Object Model (DOM)\
    \ and HTML document are an AngularJS document. This property can be used in any\
    \ element of the DOM. In many cases, only a single part of the HTML will be an\
    \ AngularJS application, as shown in the following example:\n\n```\n<html>\n<head>\n\
    \  <title>Angular baseline</title>\n  <script>\n    src=\"https://cdn.cloudflare.com/ajax/libs/angular.js/1.2.20/angular.min.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"main\">\n    <div class=\"container\"\
    >\n      <div id=\"main-app\" ng-app=\"myAngularApp\">\n        <!--Application\
    \ content will be rendered here-->\n      </div>\n    </div>\n  </div>\n</body>\n\
    ```"
- md: "\nFinally, the JavaScript files that are part of the project are added to the\
    \ end of the HTML page like the previous example. In a real application, these\
    \ files will be models, controllers, directives, and everything related to the\
    \ application.\n\n## The AngularJS MVC pattern implementation\n\nAngularJS MVC\
    \ pattern of software engineering and encourages loose coupling between presentation,\
    \ data, and logic components. However, in the AngularJS framework, we do not declare\
    \ the model as in other MVC libraries such as Ember.js and Backbone.js.\n\nIn\
    \ AngularJS we declare the model within the controller, through the of $scope.\
    \ Let's check the MVC behavior inside AngularJS in the upcoming sections.\n\n\
    ## Model\n\nAngularJS Model can be considered as a JavaScript object or a primitive\
    \ JavaScript type such as string, number, boolean, or complex objects.\n\nSynthesizing\
    \ its definition, AngularJS Model is a JavaScript object inside controllers using\
    \ $scope. The properties and behaviors that represent the object can be accessed\
    \ by its respective View.\n\nLater, we will go deeper in the use of $scope; for\
    \ now, let's see a simple example:\n\n```javascript\nfunction UserController($scope)\
    \ {\n    // A simple JavaScript object to hold our Model\n    var user;\n    user\
    \ = {\n        // Properties, add as many as you need\n        name: \"Fernando\"\
    ,\n        age: \"25\"\n    }\n    $scope.user = user;\n}\n```\n\n## Starting\
    \ with AngularJS\n\nThe preceding snippet is based on pure JavaScript object and\
    \ is assigned to $scope.user, we can declare it directly as:\n\n```javascript\n\
    function UserController($scope) {\n  $scope.user = {\n    // User properties,\
    \ add as many as you need\n    name: \"Fernando\",\n    age: \"25\"\n  }\n}\n\
    ```\n\nThere are several ways to declare objects within the controller, and you\
    \ can choose the way that suits you.\n\n## View\n\nImagine that View is what we\
    \ have in the browser; it is where the user interacts with our application, manipulating\
    \ DOM. This is done using AngularJS expressions. Expressions are a very practical\
    \ way to interact with the View (HTML) example:\n\n```html\n<div ng-controller=\"\
    UserController\">\n  <h1>{{ user.name }}</h1>\n</div>\n```\n\nIts syntax is comprised\
    \ of double brackets and the name of the variable / property that we want to render.\
    \ There is another way to do the same, using ng-bind:\n\n```html\n<div ng-controller=\"\
    UserController\">\n  <h1 ng-bind=\"user.name\"></h1>\n</div>\n```\n\nThe main\
    \ difference is if AngularJS takes a way to compile the application code, user\
    \ might see the double brackets expression before the content. To avoid this type\
    \ of behavior, we can use the ng-cloak directive, applied to the body element\
    \ on the HTML page, as shown in the following code:\n\n```html\n<body ng-cloak>\n\
    ```\n\nOtherwise, we can use the ng-cloak directive inside any HTML element of\
    \ the page as follows:\n\n```html\n<div ng-controller=\"BandController\" ng-cloak>\n\
    <ul>\n  <li ng-repeat=\"band in bands\">{{ band.name }} - {{ band.album }}</li>\n\
    </ul>\n</div>\n```\n\nBy the use of two-way data binding of AngularJS, this expression\
    \ is bound to the property of our Controller to server.\n\n## Controller\n\nTaking\
    \ into consideration the definition of Controller in the MVC pattern, Controller\
    \ is where we place all application logic. However, in AngularJS, controllers\
    \ are like classes in JavaScript, and here is where our Model resides, as mentioned\
    \ earlier.\n\n AngularJS controller concept is quite different from other MVC\
    \ libraries, where we can create models separately from controllers, like Backbone.js\
    \ and Ember.js. Let's take a look at how it relates. For the following example,\
    \ for modular and scalable development, you must organize each file in its place:\n\
    \n```html\n<html>\n<head>\n  <title>Angular Example</title>\n</head>\n<body ng-app>\n\
    \  <!-- Setup Controller -->\n  <div ng-controller=\"UserController\">\n    <h1>{{\
    \ user.name }} - {{ user.age }}</h1>\n  </div>\n  <!-- Setup Controller -->\n\
    \  <div ng-controller=\"BandController\">\n    <ul>\n      <li ng-repeat=\"band\
    \ in bands\">{{ band.name }} - {{ band.album }}</li>\n    </ul>\n  </div>\n  <!--\
    \ Include Angular -->\n  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.20/angular.min.js\"\
    ></script>\n  <script>\n    // Set the controller with basic\n    function UserController($scope)\
    \ {\n      // A simple JavaScript object to hold our Model\n      var user;\n\
    \      user = {\n        // User properties, add as many as you need\n       \
    \ name: \"Fernando\",\n        age: \"25\"\n      }\n      $scope.user = user;\n\
    \n    function BandController($scope) {\n      // A simple JavaScript object to\
    \ hold our Model\n      using $scope\n      $scope.bands = [\n        {name: \"\
    Metallica\", album: \"Master of Puppets\"},\n        {name: \"Slayer\", album:\
    \ \"Seasons in the Abyss\"},\n        {name: \"Anthrax\", album: \"Persistence\
    \ of Time\"}\n      ];\n    }\n  </script>\n</body>\n</html>\n```\n\nIn this example,\
    \ we can see something beyond what we talked about previously: ng-app, ng-controller,\
    \ and ng-repeat. Now we'll see what this means in more detail.\n\n## Detailing\
    \ directives, expressions, and scope\n\nThe first thing we notice when we look\
    \ at the previous example is the presence of ng-app tag; this is known as directives,\
    \ and in this specific example, it serves to tell AngularJS all code contained\
    \ within the body tag is an application, as mentioned before.\n\nAfter this, we\
    \ have ng-controller; as the name mentions, here we declare which controller will\
    \ act on a certain region of HTML, and ng-repeat is something like a built-in\
    \ loop over arrays. For simplicity, the tags ng-app, ng-controller, and ng-repeat\
    \ are AngularJS directives; there are many others as well. To simplify, attributes\
    \ (such as ng-app, ng-bind, ng-show, and ng-hide) are built-in directives of the\
    \ framework; we can also create custom directives.\n\n## Chapter 5\n\nMore information\
    \ about Angular directives can be found at https://docs.angularjs.org/api/ng/directive.\n\
    \nDirectives serve to extend the grammar of HTML and are simple statements but\
    \ have powerful and flexible features. In addition to the existing directives,\
    \ we can create four types of directives:\n\n- Element directives\n- Attribute\
    \ directives\n- CSS class directives\n- Comment directives\n\nThe following are\
    \ the four ways to create a custom directive:\n\n| Restrict | Markup |\n| :---\
    \ | :--- |\n| 'A' | `<span>ng-directivename></span>` |\n| 'E' | `<ng-directivename></ng-directivename>`\
    \ |\n| 'C' | `<span class=\"ng-directive\"></span>` |\n| 'M' | `<!-- directive:\
    \ ng-directive-->` |\n\nThe base code for a custom directive is as follows:\n\n\
    ```javascript\napp.directive('ngDirective', function() {\n  return {\n    restrict:\
    \ 'A',\n    // Doing your Directive code here\n  }\n});\n```\n\nNote that we created\
    \ an element directive with the keyword 'A' and invoke/use it in HTML as follows:\n\
    \n```html\n<div ng-Directive></div>\n```\n\nHere's an example in practice, a basic\
    \ element directive:\n\n```javascript\nmyAngularApp = angular.module(\"myAngularApp\"\
    , []);\n\nmyAngularApp.directive('div', function() {\n  var directive = {};\n\n\
    \  // Restrict directive to html elements\n  directive.restrict = 'E';\n\n  //\
    \ Set a basic template\n  directive.template = \"My Angular directive: {{ someTextGoesHere}}\"\
    ;\n\n  return directive;\n});\n```\n\nThe first parameter to the directive() function\
    \ is the directive name. This name will use the HTML template to activate the\
    \ directive. The second parameter passed to the directive() function is a factory\
    \ function. This function returns the directive when invoked.\n\nThe directive.template\
    \ will replace the {{ someTextGoesHere }} expression for the controller property,\
    \ $scope.someTextGoesHere, as shown in the following example:\n\n```html\n<div\
    \ ng-controller=\"MyAngularController\">\n  <directivename>This will be replaced\
    \ for the Controllers $scope content</directivename>\n</div>\n```\n\n```javascript\n\
    <script>\nmyAngularApp = angular.module(\"myAngularApp\", []);\n// Creating the\
    \ Directive\nmyAngularApp.directive('directivename', function() {\n  var directive\
    \ = {};\n\n  // Restrict to html elements\n  directive.restrict = 'E';\n\n  //\
    \ Set a basic template\n  directive.template = \"My Angular directive: {{ someTextGoesHere}}\"\
    ;\n\n  return directive;\n});\n\n// Setup a Controller\nmyAngularApp.controller(\"\
    MyAngularController\", function($scope) {\n  $scope.someTextGoesHere = \"My first\
    \ Directive is working\";\n});\n</script>\n```\n"
  mdcn: "\n最后，作为项目一部分的 JavaScript 文件被添加到 HTML 页面的末尾，如之前的示例所示。在实际应用中，这些文件将是模型、控制器、指令以及与应用程序相关的一切。\n\
    \n## AngularJS MVC 模式实现\n\nAngularJS 是软件工程中的 MVC 模式，鼓励表现层、数据和逻辑组件之间的松耦合。然而，在 AngularJS\
    \ 框架中，我们并不像 Ember.js 和 Backbone.js 等其他 MVC 库那样声明模型。\n\n在 AngularJS 中，我们通过 $scope\
    \ 在控制器内部声明模型。让我们在接下来的章节中检查 AngularJS 内部的 MVC 行为。\n\n## Model\n\nAngularJS 模型可以视为\
    \ JavaScript 对象或 JavaScript 基本类型（如字符串、数字、布尔值或复杂对象）。\n\n综合其定义，AngularJS 模型是控制器内部使用\
    \ $scope 的 JavaScript 对象。表示对象的属性和行为可以通过其相应的视图（View）访问。\n\n稍后，我们将深入探讨 $scope 的用法；现在，让我们来看一个简单的示例：\n\
    \n```javascript\nfunction UserController($scope) {\n    // 一个用于持有 Model 的简单 JavaScript\
    \ 对象\n    var user;\n    user = {\n        // 属性，根据需要添加尽可能多个\n        name: \"\
    Fernando\",\n        age: \"25\"\n    }\n    $scope.user = user;\n}\n```\n\n##\
    \ 开始使用 AngularJS\n\n之前的代码段基于纯 JavaScript 对象并被赋值给 $scope.user，我们可以直接声明它：\n\n```javascript\n\
    function UserController($scope) {\n  $scope.user = {\n    // 用户属性，根据需要添加尽可能多个\n\
    \    name: \"Fernando\",\n    age: \"25\"\n  }\n}\n```\n\n在控制器内部声明对象有多种方法，你可以选择适合自己的方式。\n\
    \n## View\n\n想象视图（View）就是我们在浏览器中看到的内容；它是用户与应用程序交互并操作 DOM 的地方。这是通过 AngularJS 表达式实现的。表达式是与视图（HTML）交互的一种非常实用的方式，例如：\n\
    \n```html\n<div ng-controller=\"UserController\">\n  <h1>{{ user.name }}</h1>\n\
    </div>\n```\n\n它的语法由双括号和我们要渲染的变量/属性名称组成。还有另一种实现相同的方法，使用 ng-bind：\n\n```html\n\
    <div ng-controller=\"UserController\">\n  <h1 ng-bind=\"user.name\"></h1>\n</div>\n\
    ```\n\n主要的区别在于，如果 AngularJS 编译应用程序代码需要时间，用户可能会在内容之前看到双括号表达式。为了避免这种行为，我们可以使用 ng-cloak\
    \ 指令，将其应用于 HTML 页面上的 body 元素，如下代码所示：\n\n```html\n<body ng-cloak>\n```\n\n否则，我们可以在页面的任何\
    \ HTML 元素中使用 ng-cloak 指令，如下所示：\n\n```html\n<div ng-controller=\"BandController\"\
    \ ng-cloak>\n<ul>\n  <li ng-repeat=\"band in bands\">{{ band.name }} - {{ band.album\
    \ }}</li>\n</ul>\n</div>\n```\n\n通过使用 AngularJS 的双向数据绑定，该表达式被绑定到我们的控制器属性到服务器。\n\
    \n## Controller\n\n考虑到 MVC 模式中控制器（Controller）的定义，控制器是我们放置所有应用程序逻辑的地方。然而，在 AngularJS\
    \ 中，控制器类似于 JavaScript 中的类，正如之前提到的，这里也是我们的模型所在地。\n\nAngularJS 控制器的概念与其他 MVC 库非常不同，在\
    \ Backbone.js 和 Ember.js 中，我们可以独立于控制器创建模型。让我们看看它们是如何关联的。对于接下来的示例，为了模块化和可扩展的开发，你必须将每个文件组织在相应的位置：\n\
    \n```html\n<html>\n<head>\n  <title>Angular Example</title>\n</head>\n<body ng-app>\n\
    \  <!-- 设置控制器 -->\n  <div ng-controller=\"UserController\">\n    <h1>{{ user.name\
    \ }} - {{ user.age }}</h1>\n  </div>\n  <!-- 设置控制器 -->\n  <div ng-controller=\"\
    BandController\">\n    <ul>\n      <li ng-repeat=\"band in bands\">{{ band.name\
    \ }} - {{ band.album }}</li>\n    </ul>\n  </div>\n  <!-- 引入 Angular -->\n  <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.20/angular.min.js\"\
    ></script>\n  <script>\n    // 设置基础控制器\n    function UserController($scope) {\n\
    \      // 一个用于持有 Model 的简单 JavaScript 对象\n      var user;\n      user = {\n  \
    \      // 用户属性，根据需要添加尽可能多个\n        name: \"Fernando\",\n        age: \"25\"\n\
