    \ GitHub at: https://github.com/nwaeweb/conference-api\n\n## Taking a Deep Dive\
    \ into Node.js and MongoDB\n\nOne of the simplest solutions for JavaScript modules\
    \ adopted as standard by Node is the CommonJS standard with minor differences.\
    \ CommonJS offers first-class modules, which in turn have the same importance\
    \ of first-class functions. It says that something is a first-class object in\
    \ a programming language when it can be built at runtime, passed as a parameter,\
    \ assigned to a variable, or returned as the result of a function. Importantly,\
    \ exports is a reference to module.exports; exports is used only to add objects.\
    \ If you want to export a single item, such as a constructor, you will need to\
    \ use the module.exports exports object directly. Let's take a look at an example\
    \ of how to use it:\n\n```javascript\n// myConstructor.js example\nfunction Constructor\
    \ () {\n}\n```\n\n```javascript\n// On Node REPL\nmodule.exports = MyConstructor;\n\
    ```\n\nIn each module is a module referenced to the object that represents the\
    \ current module. In particular, module.exports is accessible via a global exports\
    \ module. The module is not actually global, but a local object of each module.\n\
    \nThe module.exports object is created by the system and Node module export variable\
    \ which points to this. Your module may return multiple objects and functions\
    \ by adding them to the export variable, for example, `exports.sayHi = function\
    \ () { console.log('Hello Node'); };`\n\nAnother key of the Node module is a set\
    \ of default variables available in the scope of each module; the following are\
    \ the most common variables:\n\n- filename: This is the filename of the code being\
    \ executed.\n- dirname: This is the name of the directory in which you saved the\
    \ script that is being executed.\n- process: This is an object that is associated\
    \ with the process that is currently running. In addition, this object has methods\
    \ such as process.exit, process.cwd, and process.uptime.\n- process.argv: This\
    \ is an array that contains the command line arguments. The first element is the\
    \ node, the second element is the name of the JavaScript file, and the next will\
    \ be all the arguments of an additional command line if they are assigned.\n-\
    \ process.stdin, process.stdout, and process.stderr: These streams correspond\
    \ to the standard input, standard output, and standard error output of the current\
    \ process.\n- process.env: This is an object that contains the user environment\
    \ variables of the current process.\n- require.main: When a file is executed by\
    \ Node directly, require.main is assigned to this module.\n\nMuch more should\
    \ be written about all the Node particularities, but this is beyond the main scope\
    \ of our book; what we present here is the basis for our understanding.\n\n##\
    \ Express – a web framework on a server\n\nExpress is the most common and flexible\
    \ framework to build web applications on Node. It provides us with a robust set\
    \ of features to deal with such SPA, the RESTful API, and of course, the MEAN\
    \ stack. The Express framework has full support for templates and rendering using\
    \ the Jade engine as the default. It is very suitable for large-scale applications\
    \ that render HTML on the server side.\n\nOf course, we have others options such\
    \ as the amazing microframework, strictly to deal with the RESTful API, but we\
    \ are talking about MEAN, we use only the acronym-related technology, which is\
    \ Express.\n\nJade is a template engine uniquely for Node, inspired by Ruby and\
    \ Haml with rule-based indentation, like the Sass and Python syntax. More information\
    \ on Jade can be found at http://jade-lang.com/.\n\nThe main reason to use Express\
    \ is that the default Node API is not as robust for complex applications, route\
    \ management and other features are treated in a basic way. Express follows good\
    \ development practices, an oriented RESTful architecture very difficult-to-build.\
    \ We can list some great features of Express:\n\n- Powerful routing management\n\
    - Redirect for helpers\n- Can use any view engine\n- Prepared to use RESTful\n\
    - Application mounting\n- High performance\n- Views rendering\n- Partials support\n\
    \n## Taking a Deep Dive into Node.js and MongoDB\n\nIt is important to talk about\
    \ the template engine as the Express framework uses Jade by default and has its\
    \ own syntax, but it is possible to use others engines as Embedded JavaScript\
    \ (EJS) that renders HTML directly. As our scope is besides building SPA and the\
    \ tools that we'll use in our frontend already have their own syntax, we will\
    \ not go deeper into templates that run on the server.\n\nIt is important to say\
    \ that Express is also the basis for the creation of other frameworks for Node\
    \ as Locomotive, Kraken, and many others. To have a brief idea of the use of the\
    \ Express framework, note how simple it is to create an application, as shown\
    \ in the following code:\n\n```javascript\nvar express = require('express');\n\
    var app = express();\n\napp.get('/', function(req, res) {\n  res.send('Hello Express');\n\
    });\n```\n\n```javascript\napp.listen(3000);\n```\n\nCertainly, an application\
    \ will contain many lines of code, but here, it is possible to see how easy it\
    \ is to create an application using Express. Just with a few lines of code, we\
    \ can generate a message with Hello Express running on a Node server.\n\n## MongoDB\
    \ and the terminal\n\nMongoDB, also known as NoSQL database, is a document-oriented\
    \ database; this means that all the data is stored as a JSON file.\n\nInstead\
    \ of storing your data in tables and rows as you would do with a relational database,\
    \ MongoDB stores this data in the key-value format, using binary JSON (BSON);\
    \ developers can easily map to modern object-oriented languages, without a complicated\
    \ ORM layer. This new data model simplifies coding significantly and also improves\
    \ the performance of the grouping of the relevant data together.\n\nMongoDB is\
    \ not a two-dimensional approach to a relational database where we have rows and\
    \ columns; it can represent objects in the real world as complex and unique as\
    \ they are. Imagine that in your relational database, you must enter a new attribute\
    \ to a record; for this, your changes in this model should be applied to the entire\
    \ database.\n"
  mdcn: "\n\n## 第 2 章\n\n最后，`require` 返回分配给 exports 的函数，生成如下输出：\n\n```javascript\n\
    require('./example-module.js')\n\n```\n\nHello Node from module.exports\n[Function]\n\
    ```\n\n最后一行 `[Function]` 确认了 `require('./example-module.js')` 的返回值是一个函数，而 `Hello\
    \ from Node module.exports` 消息确认了代码在返回此处之前已经过解释。重要的一点是，代码只在第一次导入时被解释；如果你导入了多次，`require`\
    \ 函数将重新导出已妥善保存在缓存中的对象。\n\n另一个需要记住点是关于 `require` 获取文件的方式。如果文件以 `./` 开头，则被认为相对于调用\
    \ `require` 的文件的相对路径。如果文件以 `/` 开头，则被认为属于绝对地址。文件扩展名不是必须的；你可以这样声明依赖：`var express\
    \ = require ('express');` Node.js 会将其解释为 express。\n\n如果提供的文件名是目录名，函数将首先在目录中的一个名为\
    \ `package.json` 的文件中进行搜索，然后加载 `main` 属性中引用的文件。否则，函数将在模块文件夹中查找名为 `index.js` 的文件。\n\
    \n## Node 模块\n\nNode 拥有一个简单的模块加载系统。模块的使用允许你在应用程序中包含其他 JavaScript 文件，正如我们在使用 `require()`\
    \ 时看到的那样。模块对于在 Node 上构建应用非常重要，因为它们允许你包含外部库（例如数据库访问库、身份验证库等），并帮助将代码组织成职责有限的独立部分。\n\
    \n> 下载示例代码：你可以从 http://www.packpub.com 账户下载你购买的所有 Pack Publishing 书籍的示例代码文件。如果你在其他地方购买了本书，可以访问\
    \ http://www.packpub.com/support 并注册，以便将文件通过电子邮件发送给你。\n> 此外，你还可以在 GitHub 上查看书籍代码仓库：https://github.com/nwaeweb/conference-api\n\
    \n## 深入探讨 Node.js 和 MongoDB\n\nNode 采用的标准的 JavaScript 模块的最简单解决方案之一是带有细微差异的 CommonJS\
    \ 标准。CommonJS 提供了一等模块，其重要性与一等函数相同。它认为，如果一个东西在编程语言中可以在运行时构建、作为参数传递、赋值给变量或作为函数的结果返回，那么它就是一种一等对象。重要的是，`exports`\
    \ 是 `module.exports` 的引用；`exports` 仅用于添加对象。如果你想导出单个项目（例如构造函数），你将需要直接使用 `module.exports`\
    \ 对象。让我们来看一个使用它的示例：\n\n```javascript\n// myConstructor.js example\nfunction Constructor\
    \ () {\n}\n```\n\n```javascript\n// On Node REPL\nmodule.exports = MyConstructor;\n\
    ```\n\n在每个模块中，都有一个指向代表当前模块对象的引用。特别是 `module.exports` 可以通过全局 `exports` 模块访问。该模块并不是全局的，而是每个模块的本地对象。\n\
    \n`module.exports` 对象由系统和 Node `module` 导出变量创建，该变量指向它。你可以通过向导出变量添加内容来返回多个对象和函数，例如：`exports.sayHi\
    \ = function () { console.log('Hello Node'); };`\n\nNode 模块的另一个关键是每个模块作用域内的一组默认变量；以下是最常见的变量：\n\
    \n- filename：这是正在执行的代码的文件名。\n- dirname：这是保存正在执行的脚本的目录名称。\n- process：这是一个与当前运行进程关联的对象。此外，该对象拥有\
    \ `process.exit`、`process.cwd` 和 `process.uptime` 等方法。\n- process.argv：这是一个包含命令行参数的数组。第一个元素是\
    \ node，第二个元素是 JavaScript 文件的文件名，接下来将是额外命令行的所有参数（如果它们被赋值的话）。\n- process.stdin,\
    \ process.stdout 和 process.stderr：这些流对应于当前进程的标准输入、标准输出和标准错误输出。\n- process.env：这是一个包含当前进程用户环境变量的对象。\n\
    - require.main：当文件被 Node 直接执行时，`require.main` 被赋值给此模块。\n\n关于所有 Node 的特殊性还有很多内容要写，但这超出了我们书的主范围；我们在这里展示的是我们理解的基础。\n\
    \n## Express – 服务器上的 Web 框架\n\nExpress 是 Node 上构建 Web 应用最常用且灵活的框架。它为我们提供了一套强大的功能来处理此类\
    \ SPA、RESTful API，当然还有 MEAN 栈。Express 框架对模板和渲染有完全支持，默认使用 Jade 引擎。它非常适合在服务器端渲染\
    \ HTML 的大型应用程序。\n\n当然，我们还有其他选项，例如专门处理 RESTful API 的优秀微框架，但我们谈论的是 MEAN，我们只使用与缩写相关的技术，即\
    \ Express。\n\nJade 是一个专门为 Node 设计的模板引擎，受到 Ruby 和 Haml 的启发，具有基于规则的缩进，类似于 Sass 和\
    \ Python 语法。关于 Jade 的信息可以在 http://jade-lang.com/ 上找到。\n\n使用 Express 的主要原因是 Node\
    \ API 对于复杂应用来说不够健壮，路由管理和其他特性处理非常基础。Express 遵循良好的开发实践和非常难以构建的面向 RESTful 的架构。我们可以列出\
    \ Express 的一些优秀特性：\n\n- 强大的路由管理\n- 重定向辅助\n- 可以使用任何视图引擎\n- 准备好使用 RESTful\n- 应用挂载\n\
    - 高性能\n- 视图渲染\n- 支持部分组件 (Partials)\n\n## 深入探讨 Node.js 和 MongoDB\n\n讨论模板引擎很重要，因为\
    \ Express 框架默认使用 Jade 并有它自己的语法，但可以使用其他引擎，如嵌入 JavaScript (EJS)，它可以直接渲染 HTML。由于我们的范围在构建\
    \ SPA 之外，而且我们在前端使用的工具已经有了自己的语法，因此我们不会深入探讨在服务器上运行的模板。\n\n需要说明的是，Express 也是其他 Node\
    \ 框架（如 Locomotive、Kraken 等许多框架）的基础。为了简单了解 Express 框架的使用，请看创建一个应用是多简单，如下代码所示：\n\
    \n```javascript\nvar express = require('express');\nvar app = express();\n\napp.get('/',\
    \ function(req, res) {\n  res.send('Hello Express');\n});\n```\n\n```javascript\n\
    app.listen(3000);\n```\n\n当然，一个应用程序将包含许多行代码，但在这里，可以看到使用 Express 创建应用是多么简单。只需几行代码，我们就可以生成一个在\
    \ Node 服务器上运行的带有 Hello Express 消息。\n\n## MongoDB 和终端\n\nMongoDB 也称为 NoSQL 数据库，是一种面向文档的数据库；这意味着所有数据都存储为\
    \ JSON 文件。\n\nMongoDB 不像关系型数据库那样将数据存储在表和行中，而是使用键值格式存储这些数据，并使用二进制 JSON (BSON)；开发者可以轻松地映射到现代面向对象的语言，而无需复杂的\
    \ ORM 层。这种新的数据模型显著简化了编码，并提高了相关数据分组的性能。\n\nMongoDB 不是关系型数据库的二维处理方法（即行和列）；它可以像现实世界中的对象那样复杂且独特地表示它们。想象一下在你的关系型数据库中，你必须为一条记录输入一个新属性；对于这一点，你模型中的更改应该应用到整个数据库。\n\
    \n"
