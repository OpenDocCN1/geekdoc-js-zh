  - '[PAGE 59]


    # MongoDB connection with Mongoose


    Mongoose is a Node library solution that provides a schema-based model to the
    data of our application. It has type conversion, validation, creating queries,
    and business logic to system, and thanks to MongoDB, it also has a flexible schema.


    Mongoose provides a mapping of objects similar to MongoDB Object Relational Mapping
    (ORM) or Object Data Mapping (ODM) in the case of Mongoose. This means that Mongoose
    translates data from the database to JavaScript objects that can be used by our
    application. It was built to work in an asynchronous environment.


    Furthermore, as we saw earlier, we can easily install using NPM with the simple
    command: npm install mongoose. Mongoose will be available to the entire application;
    you will just add it to the application file, as shown in the following example:


    ```

    var mongoose = require(''mongoose''); mongoose.connect(''mongodb://localhost/test/'');


    var db = mongoose.connection;

    db.on(''error'', console.error.bind(console, ''connection error:''));

    db.once(''open'', function () { // Hello Mongoose });

    ```


    Note that our string connection points to http://localhost/database and the name
    after the schema is our database name. In a real-world application or on a production
    environment, we need to pass the username and password for the database user.


    # Mongoose schemas and models


    All we need is a schema and a model for us to work with the data to be persisted
    on our MongoDB database. Schemas define the structure of documents within a collection
    and models are used to create instances of data to be stored in collections.


    The schema types are:


    +   - String

    - Number

    - Date

    - Buffer

    - Boolean

    - Mixed

    - ObjectId

    - Array'
  - "[PAGE 60]\n\nWhen thinking about it, we imagine how we can represent our collection\
    \ of bands from the previous example using models and schema. The following code\
    \ shows bandSchema and the Band model:\n\n```\nvar bandSchema = new Mongoose.Schema({\n\
    \  name: { type: String },\n  album: { type: String },\n  track: { type: Number\
    \ },\n  year: { type: Number }\n});\n```\n\n```\nvar Band = Mongoose.model('Band',\
    \ bandSchema);\n```\n\nThe last line of the code compiles the Band model using\
    \ bandSchema as the structure. Mongoose also creates a collection Band for these\
    \ documents. You might notice that the Band model is capitalized, when a model\
    \ is compiled, it returns a constructor function that will be used to create one\
    \ or more instances of the model.\n\nThis model's instances are the documents\
    \ that will be persisted by MongoDB using the save function. So, to create a new\
    \ document, Band can be used, as it is easier now that we have defined the database.\
    \ We instantiate the Band model and save this instance on the database, as shown\
    \ in the following code:\n\n```\nvar slayer = new Band({\n  name: \"Slayer\",\n\
    \  album: \"Show no Mercy\",\n  track: \"10\",\n  year: 1984\n});\n```\n\n```\n\
    slayer.save(function(err) {\n  if (err) return console.error(err);\n  console.dir(slayer);\n\
    });\n```\n\nNote that we use a string instead of a number in the track property.\
    \ Mongoose will be responsible for converting the data type specified in bandSchema."
- md: "\nWhen we add these two code to the database and execute our application, we\
    \ see that the save function will provide a newly created document; look at the\
    \ console:\n\n```\n{ __v: 0,\n  name: 'Slayer',\n  album: 'Show no Mercy',\n \
    \ track: 10,\n  year: 1984,\n  _id: 8334012cb65dfgf003000022 }\n}\n```\n\nCollections\
    \ in MongoDB have a flexible schema; this means that collections do not impose\
    \ the structure of the documents. In practice, this means that documents from\
    \ the same collection need not have the same set of fields or structure and that\
    \ common fields in documents can carry different types of data.\n\nAs seen in\
    \ our example, using Mongoose to map our database standardizes the documents of\
    \ the schema. This ensures that instances of the model that compiled the schema\
    \ will always have the same data type specified in the schema.\n\n## Summary\n\
    \nWe finished our chapter with a lot of new information about the whole process\
    \ to create a Node server and run web applications.\n\nWe covered the essential\
    \ topics to start the development of our example application, starting with our\
    \ Node server, NPM, and how to install modules and dependencies, import modules\
    \ with require, and export modules to use later with module.exports. We saw that\
    \ MongoDB has a GUI administration interface and learned some command lines to\
    \ help us in our future chapters.\n\nWe learned the power of the Express framework,\
    \ where we can build simple complex web applications and how to use object modeling\
    \ with the Mongoose to create schemas and models for our data. But don't worry\
    \ if you do not understand all the concepts here; we will discuss them in more\
    \ detail in the next chapters.\n\nOur journey has just begun; we will see another\
    \ bunch of tools and get our hands dirty with a lot of code to start building\
    \ our API in the following chapters. In the next chapter, we will see how the\
    \ API works, some lines about the RESTful architecture, and how to start the development\
    \ using Yeoman generators.\n\n## API with MongoDB and Node.js\n\nThis chapter\
    \ will focus directly on the code, so we can have the necessary understanding\
    \ to build a solid foundation for our API. Our main aim is to discuss the techniques\
    \ to build rich web applications, with the SPA approach.\n\nApplication Programming\
    \ Interface (API) is the set of programming standards that enables us to build\
    \ applications. Their usage is not so evident to the user using the application.\
    \ The API is the engine of the application; an interface that runs behind it all.\
    \ While you might benefit from an application or website, your API can be connected\
    \ to several systems and applications. With APIs, applications to talk to each\
    \ other without user intervention.\n\nWe will be covering the following topics\
    \ in this chapter:\n\n- The working of an API\n- Boilerplates and generators\n\
    - The speakers API concept\n- Creating the package.json file\n- The Node server\
    \ with server.js\n- The model with Mongoose schema\n- Defining the API routes\n\
    - Using MongoDB in the cloud\n- Inserting data with Postman\n\n## The working\
    \ of an API\n\nAn API works through communication between different codes, thus\
    \ defining specific behavior of objects on an interface. That is, the API will\
    \ connect several functions on website (such as search, images, authentication,\
    \ and so on) to enable it to be used in other applications.\n\nOperating systems\
    \ also have APIs, and they still have the same function. For example, has APIs\
    \ such as the Web API, telephony API, in all its versions. When you run a program\
    \ that involves some process of the operating system, it is likely that we make\
    \ a connection with one or more APIs.\n\nTo clarify the concept of API, we will\
    \ give you through some examples of how it works. On Windows, it works on application\
    \ that uses the system to display the same function within the program. It then\
    \ associates behavior to given time in another application.\n\nAnother example\
    \ is when you use the SDK to build mobile applications. When you use GPS, you\
    \ are interacting with the API to display user location on map; in this case,\
    \ Google Maps API.\n\nWhen it comes to web APIs, functionality can be even greater.\
    \ There are many services that provide their code so they can be used on other\
    \ websites. Perhaps the best example is Facebook API. Other websites use this\
    \ service for instance, like, share, or even authentication.\n\n> API is a set\
    \ of programming patterns and instructions to access software application based\
    \ on the Web.\n\nSo, when you access your account, you can log in. This is accomplished\
    \ through the API. Using it, software developers can create beautiful pages for\
    \ their users.\n\n## Boilerplates and generators\n\nOn MEAN stack environment,\
    \ our ecosystem is infinitely diverse, and we can find excellent alternatives\
    \ to start the construction of API. At hand, we have simple boilerplates to complex\
    \ code generators that can be used with other tools, or alone.\n\nBoilerplates\
    \ are usually a group of tested code that provides the basic structure for the\
    \ main goal, that is to create a foundation of a web project. Saving us from common\
    \ tasks such as assembling the basic structure of the code and organizing the\
    \ files, boilerplates already have a number of scripts to make life easier for\
    \ the frontend.\n\nLet's describe some alternatives that we consider as good starting\
    \ points for the development of APIs with Express framework, MongoDB database,\
    \ Node server, and AngularJS for the frontend.\n\nSome accentuated knowledge of\
    \ JavaScript might be necessary for the complete understanding of concepts covered\
    \ here; so we will try to make them as clearly as possible.\n\n## API with MongoDB\
    \ and Node.js\n\nIt is important to note that everything is still new when we\
    \ talk about Node and all its ecosystems, factors such as scalability, performance,\
    \ and maintenance. Bearing in mind that languages such as Ruby on Rails, Scala,\
    \ and Play framework have a higher reputation in building large and maintainable\
    \ web applications, without a doubt, Node and JavaScript will conquer your space\
    \ soon.\n\nThat being said, we present some alternatives for the initial kickoff,\
    \ but remember that our main focus is on SPA and not directly on MEAN stack.\n\
    \n## Hackathon starter\n\nHackathon is highly recommended for a quick start to\
    \ develop with Node. This is because the boilerplate has the main necessary characteristics\
    \ to develop applications with the Express framework to build RESTful APIs, as\
    \ it has no MVC/MVVM framework as a standard but Bootstrap UI framework. Thus,\
    \ you are free to choose the framework of your choice, as you will not need to\
    \ refactor it to meet your needs.\n\nOther important characteristics are the use\
    \ of the latest version of the Express framework, heavy use of Jade templates\
    \ and some middleware such as Passport Node module to manage authentication with\
    \ various social network sites such as Twitter, Facebook, LinkedIn, GitHub, Last.fm,\
    \ Foursquare, and many more.\n\nWe provide the necessary boilerplate code to start\
    \ your projects very fast, and as we said before, it is very simple to install;\
    \ just clone the Git open source repository:\n\n```\ngit clone --depth=1 https://github.com/sahat/hackathon-starter.git\
    \ myproject\n```\n\nRun the NPM install command inside the project folder:\n\n\
    ```bash\nnpm install\n```\n\nThen, start the Node server:\n\n```bash\nnode app.js\n\
    ```\n\n> Remember, it is very important to have your local database up running,\
    \ in this case, MongoDB, otherwise the command node app.js will return the error:\
    \ Error connecting to database: failed to connect to [localhost:27017]\n\nYou\
