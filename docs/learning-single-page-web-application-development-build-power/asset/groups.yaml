    Node.js has the ability to run JavaScript on the server and use the power of the

    Express framework to build an HTTP proxy and routes.'
  - '[PAGE 34]


    Understanding Single Page Application


    MongoDB is an open source database document oriented for high performance and
    scalability and is also known as NoSQL database.


    > All you need to know about Express can be found at http://expressjs.com/. To
    know more about MongoDB, check out http://www.mongodb.org/.


    The.js community is growing each day and the stack will fast become more and stable,
    with the number of Node and Express boilerplates growing, we have good options
    in our hands.


    Thus, we can consider MEAN as a great way for the development of SPAs.


    The opinions are certainly much divided when it comes to SPA, but SPA is about
    dealing with a lot of frontend development.


    Of course, we can use any kind of server-side technology such as .Net, PHP, Python,
    and Ruby on Rails.


    Most likely, the solutions and examples presented in the next chapters are not
    intended to be the final word nor establish new standards or criticize any form
    of development that exists.


    The solutions found here were adapted to our sample application and the book proposal
    to show some ways to develop SPAs.


    # Tools to develop web applications


    Today, we have a variety of tools to help us in developing web applications. The
    correct choice of the best tool can save time and money.


    We will now see some indispensable tools and editors for agile frontend development
    of SPAs. All the following tools mentioned are open source, except the Visual
    Studio and WebStorm IDEs. Here, we list the characteristics that we use in our
    sample project, with Angular(JS) and Node.js.


    # Text editor


    You can choose the editor of your choice; however, we recommend two of the most
    used editors in our community.'
- md: "\nOne is called WebStorm and provides a complete development environment;\n\
    You can download the trial version at http://www.jetbrains.com/webstorm/\nWebStorm\
    \ has built-in tools, such as Terminal, RESTClient, Grunt.js support and Node\
    \ Package Manager (NPM); they are at your fingertips for efficient development.\n\
    \nIt also supports syntax highlight for languages such as HTML5, Node.js, Typescript,\n\
    CoffeeScript, Dart, EJS, Handlebars, Mustache, Web Components, Stylus, Less, Sass,\n\
    Jade, and JSLint/JSHint.\n\nUntil Version 7, it was possible to use an AngularJS\
    \ plugin to facilitate the work.\nThe plugin provides a number of advantages such\
    \ as autocomplete, easy navigation between your modules, controllers, and directives.\n\
    \nThe AngularJS plugin is very simple to use; just perform the following steps:\n\
    \n- 1. Navigate to File | Settings | Plugins.\n- 2. Click on Browse Repositories.\n\
    - 3. Select AngularJS.\n- 4. Double-click (or right-click) and when prompted,\
    \ choose Yes.\n- 5. Restart WebStorm.\n\nRemember that the preceding procedure\
    \ applies to all versions 8.0.2. From Version 8.0.4 the support is bundled with\
    \ WebStorm. And to start using, just you need to include the AngularJS library\
    \ in your project.\n\nThe other widely used text editor is Sublime Text; it is\
    \ a very popular and powerful editor because it is lightweight and supports many\
    \ languages. You can download it for free from http://www.sublimetext.com/2.\n\
    \nThe Sublime Text editor has a great plugin to work with AngularJS, which is\
    \ very similar to WebStorm.\n\nYou can find more information about the plugin\
    \ at https://github.com/angular-ui/AngularJS-sublime-package/archive/master.zip.\n\
    \nAlso, it can be installed directly from Sublime Package Control.\n\n## Understanding\
    \ Single Page Application\n\nIt provides autocompletion of core AngularJS directives,\
    \ such as `ng-repeat, ng-click`, as well as any custom directives you create.\n\
    \n![](img/76faac513e4fd5843aeb56a44cada4c9_36_0.png)\n\n> You must have the Package\
    \ Control plugin installed so to be able to install other plugins. You can find\
    \ more details about Package Control at http://wbond.net/sublime_packages/package_control.\n\
    \n## AngularJS\n\nAngularJS is a client-side framework for MVC/MVVM done in JavaScript.\
    \ The standard adopted is the closest to the MVVM pattern and is very robust and\
    \ highly suited for SPA. Later, we will discuss more thoroughly the basic features\
    \ that we use on the sample application.\n\nYou can find the whole documentation\
    \ about AngularJS at http://docs.angular.org/tutorial.\n\nAngularJS lets you write\
    \ client-side web applications as you have a smarter browser. It lets you use\
    \ old HTML (or Haml, Jade, and others) as your template language and lets extend\
    \ HTML's syntax to express your application's components clearly and succinctly.\
    \ It automatically synchronizes data from your UI (view) with your JavaScript\
    \ objects (model) through two-way data binding. Furthermore, it is possible to\
    \ extend it by creating directives and customized elements.\n\n## Debugging tools\n\
    \nWe also have an important tool to debug SPAs built with AngularJS, the Chrome\
    \ extension called Angular Batarang, and it can be found for free at https://github.com/angular/angular-batarang.\n\
    \nBatarang provides us with a Chrome-like Web Inspector. After installing, you\
    \ can activate it by pressing F12 or clicking the right button on the screen and\
    \ selecting the last link. **Inspect element**.\n\nThe Batarang extension has\
    \ five tabs: **Model, Performance, Dependencies, Options, and Help**, providing\
    \ a complete environment to debug your application.\n\nThe following is a screenshot\
    \ of the Batarang panel:\n\n| Elements | Resources | Network | Timeline | Profiles\
    \ | Audits | Console | Angular/ Emiter | PageSpeed |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| Models | Performance | Dependencies\
    \ | Options | Help | [x] Enable | | | |\n\nIn order to begin using the Batarang\
    \ you need to click the \"enable\" checkbox. This will cause the application's\
    \ tab to refresh, and the Batarang to begin collecting performance and debug information\
    \ about the requests.\nThe Batarang has five tabs: Model, Performance, Dependencies,\
    \ Options, and Help.\n\n### Models\n\nThere is an alternative to the Firefox browser\
    \ known as AngScope. It is very useful to inspect $scope when find the add-ons\
    \ for Firefox in your AngularJS project.\n\nYou can find or download it from https://addons.mozilla.org/pt-BR/firefox/addon/angscope-simple-angularjs-s/.\n\
    \n## Generators and the task manager\n\nNowadays, to start developing a web application\
    \ is a very laborious task. For this, a lot of settings are required, a well-defined\
    \ directories structure, some frameworks and boilerplates, a compiler for preprocessors,\
    \ such as Less, Sass, CoffeeScript, among others.\n\n## Understanding Single Page\
    \ Application\n\nYou can lose a lot of time in the initial configurations of the\
    \ project. You'll certainly need to repeat it with every new project.\n\nThe following\
    \ are some common steps to every new application:\n\n- 1. Scaffolding folders.\n\
    - 2. Download some libraries.\n- 3. Download some template engines.\n- 4. Download\
    \ some frameworks.\n- 5. Configure a testing environment.\n- 6. Create a local\
    \ web server to serve the contents during development.\n- 7. Minify concatenate\
    \ files.\n\nAfter thinking about the solution of all these trivial tasks a tool\
    \ emerged called Yeoman. This is a code generator, besides the Grunt task manager\
    \ and Bower, and it promotes another way of developing web applications.\n\nThese\
    \ three tools have one thing in common: Node.js and the NPM.\n\nLet's see more\
    \ details about these tools.\n\n## Yeoman\n\nYeoman is an open source project\
    \ that offers a program through the command line (yes, the console prompt/DOS\
    \ on Windows and terminal on Linux/OSX), which is a platform for a web development\
    \ environment for the Node.js world, including a set of libraries and generators.\n\
    \nIn addition, there is a plethora of web generators for the main frameworks in\
    \ the market such as Angular, Ember, and Backbone. It has an official repository\
    \ that can be found at http://yeoman.io/generators/official.html, plus a repository\
    \ of generators provided by the community too.\n\nYeoman is a tool that suggests\
    \ an established workflow and can be incorporated into your projects. The installation\
    \ is pretty simple, just open your terminal window and type the following command:\n\
    \n```\nnpm install -g yo\n```\n\n> You need to have Node.js installed on your\
    \ machine. Grunt and Bower will also be installed.\n\n## Bower\n\nBower is a manager\
    \ dependency for the Web, but specifically for frontend packages. The idea is\
    \ simple: you list the dependencies of the JavaScript example (AngularJS, Pure\
    \ CSS, Responsive boilerplate) in a file called bower.json at the root of your\
    \ project, and with this, you can control the installation/upgrade of these packages\
    \ through the command line.\n\nInstalling Bower globally on your system is simple;\
    \ just type the following command:\n\n```\nnpm install -g bower\n```\n\nDo not\
    \ forget to use the sudo command if you are not the system administrator and are\
    \ using Linux or Mac OS X.\n\nYou can find more information about Bower at http://bower.io/\n\
    \nIf you have already installed Yeoman, you don't need to install Bower or Grunt.\n\
    \nAnother configuration setup is the .bower file placed in the root directory.\
    \ Here, we can set the folder name and destiny to the Bower packages:\n\n```\n\
    {\n  \"directory\": \"public/lib\"\n}\n```\n\nIf you don't do this, Bower will\
    \ install the dependencies in the bower_components folder, in the root by default.\n\
    \n## Grunt\n\nGrunt is a tool to automate build tasks entirely in JavaScript.\
    \ If you are following the best practices for performance, then you should worry\
    \ about minifying CSS and JavaScript files to reduce the number of requests. You\
    \ can also use a preprocessor to generate CSS, like Less and Sass, or even make\
    \ CSS Sprites for your images.\n\nA validation tool as JSLint verifies errors\
    \ on JavaScript files, CSSLint for consistency in CSS and many others actions,\
    \ as mentioned before.\n\nUsing all this individually is insane if you want to\
    \ automate this whole process. This is why Grunt.js is very useful and mandatory\
    \ to any web project.\n"
  mdcn: "\n\n一种名为 WebStorm，它提供了一个完整的开发环境；\n你可以在 http://www.jetbrains.com/webstorm/\
    \ 下载试用版。\nWebStorm 内置了工具，如 Terminal、RESTClient、Grunt.js 支持以及 Node 包管理器 (NPM)；这些工具触手可及，可以高效开发。\n\
    \n它还支持多种语言的语法高亮，如 HTML5, Node.js, Typescript,\nCoffeeScript, Dart, EJS, Handlebars,\
    \ Mustache, Web Components, Stylus, Less, Sass,\nJade 以及 JSLint/JSHint。\n\n在第\
    \ 7 版本之前，可以使用 AngularJS 插件来方便工作。\n该插件提供了许多优势，如自动补全、在模块、控制器和指令之间轻松导航。\n\nAngularJS\
    \ 插件使用非常简单；只需执行以下步骤：\n\n- 1. 导航到 File（文件） | Settings（设置） | Plugins（插件）。\n- 2.\
    \ 点击 Browse Repositories（浏览仓库）。\n- 3. 选择 AngularJS。\n- 4. 双击（或右键点击）并在出现提示时选择 Yes（是）。\n\
    - 5. 重启 WebStorm。\n\n记住上述步骤适用于所有 8.0.2 版本。从 8.0.4 版本开始，该支持已内置在 WebStorm 中。要开始使用，你只需要在项目中包含\
    \ AngularJS 库即可。\n\n另一个广泛使用的文本编辑器是 Sublime Text；它是一个非常流行且强大的编辑器，因为它轻量级且支持许多语言。你可以从\
    \ http://www.sublimetext.com/2 免费下载。\n\nSublime Text 编辑器有一个非常棒的插件可以配合 AngularJS\
    \ 使用，与 WebStorm 非常相似。\n\n你可以在 https://github.com/angular-ui/AngularJS-sublime-package/archive/master.zip\
    \ 找到关于该插件的更多信息。\n\n此外，也可以直接从 Sublime Package Control 安装。\n\n## 理解单页应用 (SPA)\n\n\
    它提供了对核心 AngularJS 指令（如 `ng-repeat, ng-click`）以及你创建任何自定义指令的自动补全。\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_36_0.png)\n\
    \n> 你必须安装 Package Control 插件才能安装其他插件。你可以在 http://wbond.net/sublime_packages/package_control\
    \ 找到更多关于 Package Control 的详情。\n\n## AngularJS\n\nAngularJS 是一个用于 JavaScript 的客户端\
    \ MVC/MVVM 框架。它采用的标准接近 MVVM 模式，并且非常健壮，非常适合 SPA。稍后我们将更深入地讨论我们在示例应用程序中使用的基本功能。\n\
    \n你可以在 http://docs.angular.org/tutorial 找到关于 AngularJS 的完整文档。\n\nAngularJS 让你像拥有更智能的浏览器一样编写客户端\
    \ Web 应用。它允许你使用旧的 HTML（或 Haml, Jade 等）作为你的模板语言，并允许扩展 HTML 语法以清晰、简洁地表达你的应用程序组件。它通过双向数据绑定自动将\
    \ UI（视图）中的数据与 JavaScript 对象（模型）同步。此外，可以通过创建指令和自定义元素来扩展它。\n\n## 调试工具\n\n我们还有一个重要的工具来调试用\
    \ AngularJS 构建的 SPA，一个名为 Angular Batarang 的 Chrome 扩展，你可以在 https://github.com/angular/angular-batarang\
    \ 免费获取。\n\nBatarang 为我们提供了一个类似 Chrome 的 Web 检查器。安装后，你可以按 F12 或在屏幕上点击右键并选择最后一个链接\
    \ **Inspect element**（检查元素）来激活它。\n\nBatarang 扩展有五个标签页：**Model（模型）,Performance（性能）,Dependencies（依赖）,Options（选项）和\
    \ Help（帮助）**，为调试你的应用程序提供了完整的环境。\n\n以下是 Batarang 面板截图：\n\n| Elements | Resources\
    \ | Network | Timeline | Profiles | Audits | Console | Angular/ Emiter | PageSpeed\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| Models\
    \ | Performance | Dependencies | Options | Help | [x] Enable | | | |\n\n为了开始使用\
    \ Batarang，你需要点击“enable”（启用）复选框。这将导致应用程序标签页刷新，Batarang 开始收集有关请求的性能和调试信息。\nBatarang\
    \ 有五个标签页：Model, Performance, Dependencies, Options 和 Help。\n\n### Models\n\nFirefox\
    \ 浏览器的替代方案名为 AngScope。当你在 AngularJS 项目中寻找 Firefox 扩展时，检查 $scope 非常有用。\n\n你可以在\
    \ https://addons.mozilla.org/pt-BR/firefox/addon/angscope-simple-angularjs-s/\
    \ 找到或下载它。\n\n## 生成器和任务管理器\n\n如今，开发一个 Web 应用程序是一项非常辛苦的任务。为此，需要大量的设置、定义的目录结构、一些框架和样板，以及用于预处理器的编译器（如\
    \ Less, Sass, CoffeeScript 等）。\n\n## 理解单页应用\n\n你可能会在项目的初始配置上花费大量时间。你肯定会在每个新项目中重复这些操作。\n\
    \n以下是每个新应用的一些常见步骤：\n\n- 1. 构建脚手架文件夹。\n- 2. 下载一些库。\n- 3. 下载一些模板引擎。\n- 4. 下载一些框架。\n\
    - 5. 配置测试环境。\n- 6. 创建本地 Web 服务器在开发期间提供内容。\n- 7. 文件压缩合并。\n\n在思考这些琐碎任务的解决方案后，出现了一个名为\
    \ Yeoman 的工具。这是一个代码生成器，除了 Grunt 任务管理器和 Bower，它促进了另一种开发 Web 应用的方式。\n\n这三个工具有一个共同点：Node.js\
    \ 和 NPM。\n\n让我们查看更多关于这些工具的细节。\n\n## Yeoman\n\nYeoman 是一个开源项目，它通过命令行提供程序（是的，Windows\
    \ 上的命令提示符/DOS 以及 Linux/OSX 终端），它是 Node.js 世界的 Web 开发环境平台，包含一组库和生成器。\n\n此外，针对市场上的主流框架（如\
    \ Angular, Ember 和 Backbone）有大量的 Web 生成器。它有一个官方仓库，可以在 http://yeoman.io/generators/official.html\
    \ 找到，此外还有社区提供的生成器仓库。\n\nYeoman 是一个建议已建立的工作流的工具，可以整合到你的项目中。安装非常简单，只需打开终端窗口并输入以下命令：\n\
    \n```\nnpm install -g yo\n```\n\n> 你需要在你的机器上安装 Node.js。Grunt 和 Bower 也会被安装。\n\n\
    ## Bower\n\nBower 是 Web 的依赖管理器，但专门针对前端包。其理念很简单：你在项目根目录的 bower.json 文件中列出 JavaScript\
    \ 示例依赖（AngularJS, Pure CSS, 响应式样板），通过这种方式你可以通过命令行控制这些包的安装/升级。\n\n在系统中全局安装 Bower\
    \ 非常简单；只需输入命令：\n\n```\nnpm install -g bower\n```\n\n如果你不是系统管理员且正在使用 Linux 或 Mac\
    \ OS，不要忘记使用 sudo 命令。\n\n你可以在 http://bower.io/ 找到更多关于 Bower 的信息。\n\n如果你已经安装了 Yeoman，就不需要安装\
    \ Bower 或 Grunt。\n\n另一个配置是放在根目录的 .bower 文件。在这里，我们可以设置 Bower 包的文件夹名称和目标：\n\n```\n\
    {\n  \"directory\": \"public/lib\"\n}\n```\n\n如果你不这样做，Bower 将将依赖安装在根目录下的 bower_components\
    \ 文件夹中。\n\n## Grunt\n\nGrunt 是一个完全使用 JavaScript 自动化构建任务的工具。如果你遵循性能最佳实践，你应该考虑压缩\
    \ CSS 和 JavaScript 文件以减少请求数量。你还可以使用预处理器生成 CSS，如 Less 和 Sass，甚至为你的图像制作 CSS 雪碧图。\n\
    \n验证工具如 JSLint 可以检查 JavaScript 文件的错误，CSSLint 用于 CSS 的一致性，以及之前提到的许多其他操作。\n\n如果你想自动化整个过程，单独使用所有这些工具是疯狂的。这就是为什么\
    \ Grunt.js 对任何 Web 项目都是非常有用且必不可少的。\n\n"
