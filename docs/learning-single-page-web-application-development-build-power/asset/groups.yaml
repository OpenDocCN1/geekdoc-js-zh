    \ Angular SPA\n\n在本章中，我们将更深入地探讨 AngularJS 框架，并理解关于 SPA 测试的一些非常重要的要点。\n\n正如我们在前几章中提到的，SPA\
    \ 将 MVC 责任转移给了在客户端（浏览器）运行的 JavaScript。我们必须像处理服务器端语言中的 MVC 一样来编写测试。\n\nAngularJS\
    \ 框架的设计具有高度的可测试性，正因如此，我们有一些工具可以促进这一过程。今天，编写测试用例是每个程序员（无论前端还是后端）Web 开发过程的一部分。测试驱动开发是所有敏捷方法论的一部分，你应该记住这一点。越早开始编写测试，对你就越有利。\n\
    \n在接下来的章节中，我们将看到一些测试的基本概念，例如单元测试和集成测试（称为 e2e 测试）等。具体内容如下：\n\n- 测试概念\n- 介绍 Jasmine\n\
    - 配置 Karma（单元测试）\n- 运行 Karma 测试\n- 配置 Protractor（e2e 测试）\n- 运行 Protractor 测试\n\
    \n# 测试概念\n\n让我们关注示例应用程序中将涵盖的两类测试：单元测试和 e2e 测试。这里有一个值得注意的有趣事实：以前大多数前端开发人员并不担心测试。测试专门由测试团队或质量保证部门完成。然而，现实情况现在已经改变了。现在很难找到具备基础\
    \ JavaScript 知识的测试人员来对 SPA 进行必要的测试。当我提到测试时，指的是自动化测试。我们考虑自动化测试的原因是，当你的应用程序从中等规模变为大规模时，要用新的实现测试所有接口将变得非常复杂。\n\
    \n目前，前端开发者更关注如何编写 JavaScript，以及如何应用测试驱动开发（TDD）和行为驱动开发（BDD）的概念。\n\n下面的图说明了 TDD\
    \ 的工作流：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_164_0.png)\n\nTDD 的概念与极端编程（extreme\
    \ programming）的技术直接相关，开发者为给定的功能创建小型测试用例，然后实现代码来响应并通过测试。这种模式与单元测试直接相关；当然，关于单元测试和\
    \ TDD 还有许多其他内容，但理解这些术语对于理解其重要性已经足够了。此外，单元测试可以帮助开发者专注于真正重要的事情。\n\n另一方面，我们有 BDD（广泛用于敏捷软件开发），它允许将整个团队的开发者和业务人员整合在一起。它不使用技术语言来描述系统接口的预期行为。\n\
    \n核心思想是编写小的测试块，并编写必要的代码以通过测试。这种程序在敏捷开发中至关重要，因为代码必须具有可读性以便于维护并易于扩展。\n\n单元测试对于测试小型代码块非常有用，但我们需要对所有这些小代码块集合进行测试，并且当我们需要思考接口预期的行为时。为此，我们使用\
    \ e2e 测试。因此，带测试编写代码的主要目的是产生易于维护、人类可理解、可调试且无 bug 的。\n\n虽然这对于前端开发人员来说不是日常实践，但在通用的软件开发中，TDD\
    \ 是非常有用的。在运行任何 MVC 或 MVVM 模式时，它极其适用。\n\n那么，让我们看看如何在我们的 SPA 上实现测试。\n\nAngular 框架在构建和规划时就考虑了测试，因此在框架选择方面我们有很多选项可选。接下来的示例将介绍\
    \ Karma 和 Protractor 测试运行器。\n\n# 介绍 Jasmine\n\nKarma 是最常用的测试执行工具之一；它兼容许多测试框架（如\
    \ Mocha、QUnit 和 Jasmine）。你可以用它测试任何 JavaScript 代码，并且强烈建议你使用某些工具对 SPA 进行自动化测试。\n\
    \n在接下来的示例中，我们将使用 Jasmine 编写测试并使用 Karma 运行测试。Jasmine 拥有非常简单易于编写的语法。\n\n```\ndescribe(\"\
    Test name\", function() {\n  it(\"contains expectation\", function() {\n    expect(true).toBe(true);\n\
    \  });\n});\n```\n\n# 使用 Karma 和 Protractor 测试 Angular SPA\n\ndescribe() 和 it()\
    \ 是两个函数。describe() 有一个接收名称的字符串参数和一个实现它的函数参数。\n\n```\ndescribe(\"Test name\", function()\
    \ {\n  it(\"contains expectation\", function() {\n    expect(true).toBe(true);\n\
    \  });\n});\n```\n\nJasmine 的 API 非常容易理解；它还有许多其他函数，但这些对于理解示例足够了。\n\n> 要了解更多关于\
    \ Jasmine 的信息，请参考 http://jasmine.github.io/\n\n# 配置 Karma（单元测试）\n\n让我们来看看 Karma\
    \ 运行器以及如何使用它。\n\n> 我们不会涵盖安装 Karma 及其模块的必要步骤：你可以从示例下载整个项目并\n\n创建此文件最简单的方法是使用 karma-cli\
    \ 工具。这样，你就可以在终端中使用 `init` 命令。这是许多可用 Node.js 工具（如 Grunt、Bower 等）使用的标准程序。\n\n**命令行界面\
    \ (CLI)** 帮助我们通过终端以简单快速的方式创建文件和设置。由于我们已经有了 `karma.conf.js` 文件，所以不需要执行 `init` 命令。\n\
    \n打开项目文件夹。现在，让我们查看 `karma.conf.js` 文件并逐行理解它：\n\n```\n'use strict';\n\n/**\n* 依赖。\n\
    \ */\nvar applicationConfiguration = require('./config/config');\n\n// Karma 配置\n\
    module.exports = function(config) {\n  config.set({\n    // 使用的框架\n    frameworks:\
