    \  \"dependencies\": {\n    \"express\": \"4.0.0\"\n  }\n}\n```\n\n- 4. Now, let's\
    \ add more dependencies directly in package.json. Open the file in your editor\
    \ and add the following lines:\n\n```json\n{\n  \"name\": \"conference-api\",\n\
    \  \"version\": \"0.0.1\",\n  \"description\": \"Sample Conference Web Application\"\
    ,\n  \"main\": \"server.js\",\n  \"scripts\": {\n    \"test\": \"test\"\n  },\n\
