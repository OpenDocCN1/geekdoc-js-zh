    \ you will have to restart the server manually every time you make a change to\
    \ a file, which is extremely useful in development environment as it constantly\
    \ updates our files.\n\n## Node server with server.js\n\nWith this structure formed,\
    \ we will start the creation of the server itself, which is the creation of a\
    \ main JavaScript file. The most common name used is server.js, but it is also\
    \ very common to use app.js name, especially in older versions.\n\nLet's add this\
    \ file to the root folder of the project and we will start with the basic server\
    \ settings. There are many ways to configure our server, and you'll probably find\
    \ the best one for yourself. As we are still in the initial process, we keep only\
    \ the basics.\n\nOpen your editor and type in the following code:\n\n```javascript\n\
    // Import the Modules installed to our server\nvar express = require('express');\n\
    var bodyParser = require('body-parser');\n\n// Start the Express web framework\n\
    var app = express();\n\n// configure app\napp.use(bodyParser());\n\n// where the\
    \ application will run\nvar port = process.env.PORT || 8080;\n\n// Import Mongoose\n\
    var mongoose = require('mongoose');\n\n// connect to your database\n// you can\
    \ use your own MongoDB installation at: mongodb://127.0.0.1/datename\nmongoose.connect('mongodb://username:password@kahana.mongodb.com:10073/node-api');\n\
    \n// Start the Node Server\napp.listen(port);\nconsole.log('Magic happens on port\
    \ ' + port);\n```\n\n# Chapter 3\n\nRealize the line making connection with MongoDB\
    \ on our localhost is commented, because we are using an instance of MongoDB in\
    \ the cloud. In our case, we use MongoHQ, a MongoDB-hosting service. Later on,\
    \ will see how to connect with MongoHQ.\n\n## Model with the Mongoose schema\n\
    \nNow, let's create our model, using the Mongoose schema to map our speakers on\
    \ MongoDB.\n\n```javascript\n// Import the Mongoose module.\nvar mongoose = require('mongoose');\n\
    var Schema = mongoose.Schema;\n\n// Set the data types, properties and default\
    \ values to our Schema.\nvar SpeakerSchema = new Schema({\n  name: {\n    type:\
    \ String, default: ''\n  },\n  company: {\n    type: String, default: ''\n  },\n\
    \  title: {\n    type: String, default: ''\n  },\n  description: {\n    type:\
    \ String, default: ''\n  },\n  picture: {\n    type: String, default: ''\n  },\n\
    \  schedule: {\n    type: Date, default: Date.now\n  }\n});\nmodule.exports =\
    \ mongoose.model('Speaker', SpeakerSchema);\n```\n\nNote that on the first line,\
    \ we added the Mongoose module using the require function. Our schema is pretty\
    \ simple; on the left-hand side, we have the property name and the right-hand\
    \ side, the data type. We also set the default value to nothing, but if you want,\
    \ you can set a different value.\n\nThe next step is to save this project folder.\
    \ For this, let's create a new directory named server; then inside this, create\
    \ another folder called models and save the file as speaker.js. At this point,\
    \ our folder looks like this:\n\n![](76ac513e4fd5843aeb56a44cada4c9_79_0)\n\n\
    The README.md file is used for GitHub; as we are using the Git version control,\
    \ we host our files on GitHub.\n\n## Defining the API routes\n\nOne of the most\
    \ important aspects of our API are routes that we take to create, read, update,\
    \ and delete our speakers. Our routes are based on the HTTP verb used to access\
    \ our API, as shown in the following examples:\n\n- To create record, use the\
    \ POST verb\n- To read record, use the GET verb\n- To update record, use the PUT\
    \ verb\n- To delete records, use the DELETE verb\n\nSo, our routes will be as:\n\
    \n| Routes | Verb and Action |\n|---|---|\n| /api/speakers | GET retrieves speaker's\
    \ records |\n| /api/speakers/ | POST inserts speakers' record |\n| /api/speakers/:speaker_id\
    \ | GET retrieves a single record |\n| /api/speakers/:speaker_id | PUT updates\
    \ a single record |\n| /api/speakers/:speaker_id | DELETE deletes a single record\
    \ |\n\nConfiguring the API routes:\n\n- 1. Let's define the route and a common\
    \ message for all requests:\n\n```javascript\nvar Speaker = require('./server/models/speaker');\n\
    \n// Defining the Routes for our API\n\n// Start the Router\nvar router = express.Router();\n\
    \n// A simple middleware to use for all Routes and Requests\nrouter.use(function(req,\
    \ res, next) {\n  // Give some message on the console\n  console.log('An action\
    \ was performed by the server.');\n})\n```\n"
  mdcn: "\n\n此命令将引导你创建一个 `package.json` 文件，该文件包含我们应用程序的基础配置。此外，该文件是应用程序的核心；我们可以通过它控制所有依赖的版本和其他重要信息，如作者、GitHub\
    \ 仓库、开发依赖、许可证类型、测试命令等。\n\n- 2. 几乎所有的命令都是引导你完成最终流程的问题，因此当我们完成时，将得到一个与此非常类似的 `package.json`\
    \ 文件：\n\n```\n{\n  \"name\": \"conference-api\",\n  \"version\": \"0.0.1\",\n\
    \  \"description\": \"Sample Conference Web Application\",\n  \"main\": \"server.js\"\
    ,\n  \"scripts\": {\n    \"test\": \"test\"\n  },\n  \"keywords\": [\n    \"api\"\
    \n  ],\n  \"author\": \"your name here\",\n  \"license\": \"MIT\"\n}\n```\n\n\
    - 3. 现在，我们需要添加必要的依赖项，例如 Node ，这些模块将用于我们的项目中。你可以通过两种方式实现：要么直接通过终端（如我们在这里所做），要么通过编辑\
    \ `package.json` 文件。让我们先看看在终端中如何操作；从 Express 框架开始。在 `api` 文件夹中打开终端并输入以下命令：\nnpm\
    \ install express@4.0.0 --save\n\n此命令安装了 Express 模块（在此例中为 Express 版本4），并自动更新 `package.json`\
    \ 文件并创建依赖，如我们所示：\n\n```\n{\n  \"name\": \"conference-api\",\n  \"version\": \"\
    0.0.1\",\n  \"description\": \"Sample Conference Web Application\",\n  \"main\"\
    : \"server.js\",\n  \"scripts\": {\n    \"test\": \"test\"\n  },\n  \"dependencies\"\
    : {\n    \"express\": \"4.0.0\"\n  }\n}\n```\n\n- 4. 现在，让我们直接在 `package.json`\
    \ 中添加更多依赖项。在编辑器中打开文件并添加以下行：\n\n```json\n{\n  \"name\": \"conference-api\",\n \
    \ \"version\": \"0.0.1\",\n  \"description\": \"Sample Conference Web Application\"\
    ,\n  \"main\": \"server.js\",\n  \"scripts\": {\n    \"test\": \"test\"\n  },\n\
    \  \"keywords\": [\n    \"api\"\n  ],\n  \"author\": \"your name here\",\n  \"\
    license\": \"MIT\",\n  \"engines\": {\n    \"node\": \"8.14\",\n    \"npm\": \"\
    6.1.4\"\n  },\n  \"dependencies\": {\n    \"body-parser\": \"1.0.1\",\n    \"\
    express\": \"4.0.0\",\n    \"method-override\": \"1.0.0\",\n    \"mongoose\":\
    \ \"3.6.1\",\n    \"morgan\": \"1.0.0\",\n    \"nodemon\": \"1.2.0\"\n  }\n}\n\
    ```\n\n- 5. 打开终端并输入命令：\nnpm install\n\n你可以通过两种方式安装依赖：要么直接安装到应用程序目录中，要么使用 `-g`\
    \ 命令全局安装。这样，你将拥有可以在任何应用程序中使用的模块。在过程结束时，我们将拥有项目所需的所有 Node 模块；我们只需要再执行一个操作。\n\n\
    当你使用 Travis 或 Heroku 等服务部署应用程序时，设置好 Node 环境是非常重要的。\n\n关于 Git 的更多信息可以在 http://git-scm.com/\
    \ 找到；不过，你可以使用任何版本控制工具或其他。我们推荐使用 Git，因为我们需要它将应用程序部署到云端，特别是部署在 Heroku 托管上。此时，我们的项目文件夹必须具有此处所示的结构：\n\
    \n| node_modules |\n| body-parser |\n| express |\n| method-override |\n| mongoose\
    \ |\n| morgan |\n| nodemon |\n| package.json |\n\n我们必须指出一个名为 Nodemon 的重要模块。每当文件发生变化时，它会自动重启服务器；否则，你每次对文件进行更改都必须手动重启服务器，这在开发环境中非常有用，因为它不断更新我们的文件。\n\
    \n## 带有 server.js 的 Node 服务器\n\n形成此结构后，我们将开始创建服务器本身，即创建一个主 JavaScript 文件。最常用的名称是\
    \ `server.js`，但使用 `app.js` 名称也十分常见，特别是在旧版本中。\n\n将此文件添加到项目的根目录，并从基础服务器设置开始。配置服务器有很多方法，你可能会找到最适合自己的方法。由于我们仍处于初始阶段，我们只保留基础内容。\n\
    \n打开你的编辑器并输入以下代码：\n\n```javascript\n// 到到我们服务器上安装的模块\nvar express = require('express');\n\
    var bodyParser = require('body-parser');\n\n// 启动 Express 框架\nvar app = express();\n\
    \n// 配置 app\napp.use(bodyParser());\n\n// 应用运行的位置\nvar port = process.env.PORT\
    \ || 8080;\n\n// 导入 Mongoose\nvar mongoose = require('mongoose');\n\n// 连接到你的数据库\n\
    // 你可以使用你自己的 MongoDB 安装在：mongodb://127.0.0.1/datename\nmongoose.connect('mongodb://username:password@kahana.mongodb.com:10073/node-api');\n\
    \n// 启动 Node 服务器\napp.listen(port);\nconsole.log('Magic happens on port ' + port);\n\
    ```\n\n# 第3 章\n\n在本地执行的 MongoDB 路由。在云端执行的 MongoDB 路由。我们将使用  的 MongoDB 路由。\n\n\
    ```javascript\napp.listen(port);\nconsole.log('Magic happens on port ' + port);\n\
    \n## 定义 API 路由\n\n配置 API 路由：\n\n- 1. 让我们定义路由以及针对所有请求的通用消息：\n\n```javascript\n\
    var Speaker = require('./server/models/speaker');\n\n// 定义我们 API 的路由\n\n// 启动路由器\n\
    var router = express.Router();\n\n// 用于所有路由和请求的简单中间件\nrouter.use(function(req,\
    \ res, next) {\n  // 在控制台上给出一些信息\n  console.log('An action was performed by the\
    \ server.');\n})\n```\n\n## 使用 Mongoose 的模型\n\n现在，我们使用 Mongoose 模式来创建模型。\n\n```javascript\n\
    // 导入 Mongoose 模块\nvar mongoose = require('mongoose');\nvar Schema = mongoose.Schema;\n\
    \n// 设置 Speaker 模式\nvar SpeakerSchema = new Schema({\n  name: {\n    type: String,\n\
    \    default: ''\n  },\n  company: {\n    type: String,\n    default: ''\n  },\n\
    \  title: {\n    type: String,\n    default: ''\n  },\n  description: {\n    type:\
    \ String,\n    default: ''\n  },\n  picture: {\n    type: String,\n    default:\
    \ ''\n  },\n  schedule: {\n    type: Date,\n    default: Date.now\n  }\n});\n\n\
    module.exports = mongoose.model('Speaker', SpeakerSchema);\n```\n\n注意第一行，我们添加了\
    \ Mongoose 模块。我们的模式非常简单；在左侧是属性名，在右侧是数据类型。我们也设置了默认值，但如果你愿意，可以设置不同的值。\n\n下一步是保存项目文件夹。为此，让我们创建一个名为\
    \ `server` 的新目录；然后在里面创建一个名为 `models` 的文件夹并将文件保存为 `speaker.js`。此时，我们的文件夹如下：\n\n\
    ![](76ac513e4fd5843eb56a444c9_79_0)\n\nREADME.md 文件用于 GitHub；由于我们使用 Git 版本控制，我们将文件托管在\
    \ GitHub 上。\n\n## API 路由\n\n我们 API 最重要的方面之一是用于创建、读取、更新和删除说话者的路由。我们的路由基于访问 API\
    \ 时使用的 HTTP 动词，如下所示：\n\n- 创建记录，使用 POST 方法\n- 读取记录，使用 GET 方法\n- 更新记录，使用 PUT 方法\n\
    - 删除记录，使用 DELETE 方法\n\n因此，我们的路由如下：\n\n| 路由 | 动词和操作 |\n|---|---|\n| /api/speakers\
    \ | GET 获取说话者记录 |\n| /api/speakers/ | POST 插入说话者记录 |\n| /api/speakers/:speaker_id\
    \ | GET 获取单条记录 |\n| /api/speakers/:speaker_id | PUT 更新单条记录 |\n| /api/speakers/:speaker_id\
    \ | DELETE 删除单条记录 |\n\n"
