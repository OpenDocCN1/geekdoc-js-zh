- md: "\n## Testing Angular with Karma and Protractor\n\n+ 2. Run the test again and\
    \ let's see the result.\n3. In the terminal, type the following command to start\
    \ the tests:\n`grunt protractor`\n\nThe following screenshot illustrates the result\
    \ that runs on two browsers:\n\n```\nRunning \"protractor:chrome\" (protractor)\
    \ task\nUsing the selenium server at http://localhost:4444/wd/hub\n...\nFinished\
    \ in 11.093 seconds\n2 tests, 4 assertions, @ failures\n\nRunning \"protractor:safari\"\
    \ (protractor) task\nUsing the selenium server at http://localhost:4444/wd/hub\n\
    Finished in 12.506 seconds\n2 tests, 4 assertions, @ failures\n\nDone, without\
    \ errors.\n```\n\nThe framework will test each browser configured in the Gruntfile.js\
    \ file.\nHowever, remember that you need to have the browser installed on your\
    \ workstation to perform the tests.\n\nAs you can see, the browser opens quickly,\
    \ runs the test, and closes.\n\n# Summary\n\nThis was a very long chapter focused\
    \ on tests; we saw how to perform unit testing on SPA. We will also some testing\
    \ frameworks to facilitate our work.\n\nYou learned how to perform tests on AngularJS\
    \ applications using the Protractor framework and the Selenium server. Remember\
    \ that you should thoroughly test your applications to avoid future problems as\
    \ the source code grows.\n\nIn the next chapter, we will see how to put SPA in\
    \ production in the cloud service. We will also see some interesting points about\
    \ SPAs and its scalability.\n\n# 8 Deploying the Application to the Cloud\n\n\
    We've now reached the final stage of development of our sample SPA chapter, we\
    \ will look at some important points involving all processes of web applications,\
    \ such as version control, deployment in the cloud, and continuous application\
    \ deployment. We will cover the following topics:\n\n- Hosting the project on\
    \ GitHub\n- Continuous application deployment\n- Automatic deployment from GitHub\n\
    - Hands-on-deployment\n- Some final notes about SPA\n\n# Hosting the project on\
