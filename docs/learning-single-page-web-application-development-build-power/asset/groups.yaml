- md: "\n## API with MongoDB and Node.js\n\nThe most common problem when we need to\
    \ scale a SPA is undoubtedly the structure of directories and how we manage all\
    \ the frontend JavaScript files and HTML templates using MVC/MVVM. Later, we will\
    \ see an alternative to deal with a large-scale application; for now, let's see\
    \ the module structure adopted by MEANJS:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_68_0.png)\n\
    \nNote that MEANJS leaves more flexibility to the AngularJS framework to deal\
    \ with the MVC approach for the frontend application, as we can see inside the\
    \ public folder. Also, note the modules approach; each module has its own structure,\
    \ keeping some conventions for controllers, services, views, config, and tests.\
    \ This is very useful for team development, so keep all the structure well organized.\
    \ It is a complete solution that makes use of additional modules such as passport,\
    \ swig, mongoose, karma, among others.\n\n## The Passport module\n\nSome things\
    \ about the Passport module must be said; it can be defined as a simple, unobtrusive\
    \ authentication module. It is a powerful middleware to use with Node; it is very\
    \ flexible and also modular. It can adapt easily within applications that use\
    \ the Express.\n\nIt has more than 140 alternative authentications and support\
    \ session persistence; it is very lightweight and extremely simple to be implemented.\
    \ It provides us with all the necessary structure for authentication, redirects,\
    \ and validations, and hence it is possible to use the username and password of\
    \ social networks such as Facebook, Twitter, and on others.\n\nThe following is\
    \ a simple example of how to use local authentication:\n\n```javascript\nvar Passport\
    \ = require('passport');\nLocalStrategy = require('passport-local').Strategy,\n\
    User = require('mongoose').model('User');\n\nmodule.exports = function() {\n \
    \ // Use local strategy\n  passport.use(new LocalStrategy({\n    username: 'username',\n\
    \    passwordField: 'password'\n  },\n  function(username, password, done) {\n\
    \    User.findOne({\n      username: username\n    }),\n    function(err, user)\
    \ {\n      if (err) {\n        return done(err);\n      }\n      if (!user) {\n\
    \        return done(null, false, {\n          message: 'Unknown user'\n     \
    \   });\n      }\n      if (!user.authenticate(password)) {\n        return done(null,\
    \ false, {\n          message: 'Invalid password'\n        });\n      }\n    \
    \  return done(null, user);\n    }\n  }));\n});\n```\n\nHere’s a sample screenshot\
    \ of the login page using the MEAN.JS boilerplate with the Passport module:\n\n\
    ![](img/76faac513e4fd5843aeb56a44cada4c9_70_0.png)\n\nBack to the boilerplates\
    \ topic; most boilerplates and generators already have the Passport module installed\
    \ and ready to be configured. Moreover, it has a code generator so that it can\
    \ be used with Yeoman, which is another essential frontend tool to be added to\
    \ your tool belt.\n\n> Yeoman is the most popular code generator for scaffold\
    \ for modern web applications; it’s easy to use it and has a lot of generators\
    \ as Backbone, Angular, Karma, and Ember to mention a few. More information can\
    \ be found at http://yeoman.io/.\n\n## Generators\n\nGenerators are for the frontend\
    \ as gem is for Ruby on Rails. We can create the foundation for any type of application,\
    \ using available generators.\n\n## Chapter 3\n\nHere's a console output from\
