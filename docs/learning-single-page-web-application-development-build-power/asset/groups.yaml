    # Chapter 1


    In MVC, the View sits on top of our architecture with the Controller below it.

    Models sit below the controller, and so our Views know about our Controllers,
    and Controllers know about Models. Here, our Views have direct access to Models,

    However, exposing the complete Model to the View might have high security and
    performance costs, depending on the complexity of our application. MVVM attempts
    to avoid these issues.


    In MVP, the role of the controller is replaced with a Presenter. Presenters sit
    at the same level as views, listening to events from both View and Model and mediating
    the actions between them. Unlike MVVM, there isn''t a mechanism to bind Views
    to ViewModels, so we instead rely on each View to implement an interface and allow
    Presenter to interact with View.


    Pretty simple, right? We must be very careful in choosing the best tool for our
    work, or we can further complicate the performance of our application. The following
    screenshot shows an overview of the MVC, MVVM, and MVP I/O flow:


    | MVC | MVVM | MVP |

    |---|---|---|

    | In | In | In |

    | Controller | View | View |

    | | View-Model | Presenter |

    | Model | Model | Model |


    Of course, we have more names to care about such as Router, Collections, Events,
    and Sync but they are part of different implementations, as discussed in the book
    later.


    There are numerous points to consider before building a new app, to make matters
    worse, the expansive web development landscape can be intimidating at the outset,
    but don''t worry, we will detail everything.'
