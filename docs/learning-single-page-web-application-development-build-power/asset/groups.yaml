    # # Understanding Single Page Application


    Single Page Application (SPA) is the greatest sensation at the moment. We have
    countless JavaScript frameworks available to ease our work. We cannot deny that
    JavaScript, as just a scripting language, has become the technology evolution
    since the rise of the web, and of course, the browser''s support is much better
    than the old times. Now, we can use the JavaScript language on both sides, that
    is, from the frontend to the backend (Node.js) and also include databases with
    MongoDB (we will talk about them briefly in the next chapters). Now, we focus
    on understanding the MVC/MVVM pattern on SPA. We will cover the following topics:


    +   - Getting acquainted with SPAs

    - Understanding the working of SPAs

    - Understanding the MVC/MVVM/MV* pattern

    - Peculiarities between SPA and traditional web

    - Choosing a library or framework

    - Introducing the MEAN stack

    - The available tools

    - It''s all about JavaScript

    - HTML, CSS, and the responsive way'
  - '[PAGE 24]


    # Getting acquainted with SPA


    SPA is a web application or website that fits on a single web page with the goal
    of providing a more friendly user experience and a rich interface. Also, only
    one page is not limited to one file; we can have many different files.


    Such applications can vary from a small simple create, read, update, and delete
    (CRUD), like a to-do list, until it reaches a more complex level with countless
    views, libraries, templates, scripts, and validations.


    For a better example of a SPA, you can check out http://todmvc.com/; here, you
    can find a lot of information about many MVC frontend frameworks. The next paragraphs
    will show more about MVC on the client side.


    The main goal of how web application is to be able to update parts of an interface
    without sending or receiving a full-page request; this is perhaps the most interesting
    point SPA.


    SPA''s popularity has been increasing in recent times, mainly because of its relative
    ease of development. This is because from the start, everything is done from the
    front-end of a web application using Ajax (to interacting with the server), HTML
    templates, a good MVC/MVVM framework, and of course, a lot of JavaScript.


    Surely, we have a plethora of JavaScript frameworks that greatly facilitate our
    life as a developer, but how do we choose one from all these options? Which is
    the best option? What about the learning curve?


    Throughout this chapter, we will understand the interaction models available between
    the most popular frameworks.


    Before we begin our journey on SPAs, let''s see the basic concept of the MVC/MVVM
    architecture.


    # Understanding the work of SPAs


    What we see in this new world of web applications is an analogy to what had formerly
    been in software development on the server side, such as Model View Controller
    (MVC) or Model View Presenter (MVP). We will see Model View ViewModel (MVVM) in
    more detail in the next chapters.'
- md: "\nTrygve Reenskaug introduced MVC into Smalltalk-76 while visiting Xerox Parc\
    \ in the 1970s; In the 1980s, Jim Althoff et al. implemented a version of MVC\
    \ for the Smalltalk-80 class library. MVC was later expressed as a general concept\
    \ in a 1998 article. More info can be found at https://heim.ifi.uio.no/tryver/thems/mvc/index.html.\n\
    \nSPA has attracted a large number of developers lately, but what is so special\
    \ or controversial in this development model? What do these acronyms, HTML, MVC,\
    \ MVP, and MVVM mean?\n\nThe answer to these questions is very simple; we can\
    \ say this is all about JavaScript!\nWait a minute, JavaScript? You should be\
    \ asking, \"But what about HTML, CSS, server languages, and databases? We'll understand\
    \ it all and introduce what we call full-stack developer using MEAN. We will take\
    \ one step at a time.\n\nBefore we dive into the working of SPA, we need to learn\
    \ about the MVC architecture.\n\n## Understanding the MVC/MVVM/MV* pattern\n\n\
    MVC is a software architecture pattern that emerged in the 1980s, and it separates\
    \ the visual representation of information from the user's interaction.\n\nHowever,\
    \ we are talking about the MVC pattern on the client side, for example, JavaScript\
    \ running on the client side, to be more specific, the web browser. Note that\
    \ the majority of SPAs transfer to a web browser all the MVC logic used on the\
    \ server with languages such as Java, C#, and Ruby.\n\nWe use JavaScript to model\
    \ our application according to the standards of MVC on the client side and not\
    \ on the server.\n\nAnother very important aspect is to understand what represents\
    \ each development model, take a look at the following:\n\n- Presentation Model\
    \ (PM)\n- Model View Presenter (MVP)\n- Model View Controller (MVC)\n- Model View\
    \ ViewModel (MVVM)\n\nLater in this chapter, we will see in more detail about\
    \ these concepts. For now, let's take a look at the first appearance of MVVM.\n\
    \n## Understanding Single Page Application\n\nIn 2004, Martin Fowler published\
    \ a small article about a design pattern called Presentation Model. The following\
    \ is the pictorial representation of PM:\n\n| View | Presentation Model | Model\
    \ |\n| --- | --- | --- |\n\n- The View interacts with the model to gather visual\
    \ content.\n- The Presentation Model updates, queries and observes the model.\
    \ Its also notifies the view of changes in the visual content.\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_26_0.png)\n\
    \nApproximately one year later, in 2005, John Gossman, a Microsoft architect for\
    \ Windows Foundation (WPF) and Silverlight, revealed a new pattern on his blog,\
    \ this time named Model View ViewModel.\n\n> John Gossman's original blog article\
    \ can be found at http://blogs.msdn.com/b/johngossman/archive/2005/10/08/478683.aspx.\n\
    \nMVVM is very similar to Presentation Model; both patterns have an abstraction\
    \ of View's state and behavior (on the frontend, the view concept is what the\
    \ client sees), which contains a View's state and behavior. The difference between\
    \ them is that the MVVM model is more standardized and has been used in Silverlight\
    \ for many years.\n\nMVVM is based on MVC and MVP, which attempts to separate\
    \ more clearly the development of User Interfaces (Ui/frontend) from that of the\
    \ business logic and behavior in an application.\n\nYou might be asking, \"but\
    \ what does this have to do with SPA?\"\n\n> An awesome resource on the emergence\
    \ of the MVVM model is available at http://msdn.microsoft.com/en-us/magazine/dd419663.aspx.\n\
    \nNowadays, we can clearly see this type of implementation applied to some JavaScript\
    \ frameworks such as Durandal.js, Kendo UI, Ember.js, AngularJS, and Knockout.js\
    \ among others. Each of these has its own way to implement it; however, they have\
    \ the same concept. The following is the pictorial representation of MVP:\n\n\
    ![](img/76faac513e4fd5843aeb56a44cada4c9_27_0.png)\n\n- The View interacts with\
    \ the model for simple data binding.\n- The View is updated by the presenter and\
    \ through data binding.\n\n> Backbone.js was the first MVC library to become popular\n\
    \nAlmost all the frameworks that we have today follows the standard MV* pattern.\
    \ Now, let's review the concepts of MVVM:\n\n- **Model**: This represents domain-specific\
    \ data or information that our application will be working with. Models hold information,\
    \ but typically don't handle behavior. They don't format information or influence\
    \ how data appears in the browser as this is not their responsibility.\n- **View**:\
    \ This is the only part of the application that the users actually interact with.\
    \ It contains the data bindings and events, and it is an interactive UI that represents\
    \ the state of a ViewModel. View isn't responsible for handling state—it keeps\
    \ this in sync with ViewModel. \n- **ViewModel**: This can be considered as a\
    \ specialized Controller that acts as a data converter. It changes Model information\
    \ into View information, passing commands from View to Model.\n\n## Understanding\
    \ Single Page Application\n\nViews and ViewModels communicate using data-bindings\
    \ and events. The following is the pictorial representation of how MVVM works:\n\
    \n![](img/76faac513e4fd5843aeb56a44cada4c9_28_0.png)\n\n- The View interacts with\
    \ the model for data binding.\n- The Model holds information.\n\nFor a better\
    \ understanding of MVVM, let's take a look at the two-way data binding. Two-way\
    \ binding refers to the ability to bind changes to an object's properties to the\
    \ UI. In other words, if we have a user object with the `name` property, whenever\
    \ we assign a new value to `user.name`, the UI should show the new name.\n\n```javascript\n\
    var user = {\n  name: \"fernando\",\n  age: 25\n}\n```\n\nMVP and MVVM are derivatives\
    \ of MVC. The key difference between both is the dependencies each layer has on\
    \ the other layers, as well as how tightly bound they are with regard to each\
    \ other.\n"
  mdcn: "\nTrygve Reenskaug 在 20 世纪 70 年访问 Xerox Parc 时将 MVC 引入了 Smalltalk-76；80 年代，Jim\
    \ Althoff 等人为 Smalltalk-80 类库实现了一个版本的 MVC。MVC 此后在 1998 年的一篇文章中被阐述为一个通用概念。更多信息可以在\
    \ https://heim.ifi.uio.no/tryver/thems/mvc/index.html 找到。\n\nSPA 近期吸引了大量开发者，但这种开发模型有什么特别之处或争议之处呢？这些缩写\
    \ HTML、MVC、MVP 和 MVVM 意味着什么？\n\n这些问题的答案非常简单：等一下，JavaScript？你应该问，“那么 HTML、CSS 和数据库呢？”我们使用\
    \ JavaScript 根据全栈开发中的 MEAN 标准来建模应用。我们将一步步进行。在深入研究 SPA 的工作原理之前，我们需要了解 MVC 架构。\n\
    \n## 理解 MVC/MVVM/MV* 模式\n\nMVC 是一种出现于 20 世纪 80 年代的软件架构模式，它将信息的视觉表示与用户交互分离。\n\n\
    然而，我们谈论的是客户端的 MVC 模式，更具体地说，是 Java、C# 和 Ruby 等语言在客户端运行的模式。另一个非常重要的方面是理解每个模型代表什么，请看以下内容：\n\
    \n- 表现模型 (PM)\n- 模型视图演示器 (MVP)\n- 模型-视图控制器 (MVC)\n- 模型-视图模型 (MVVM)\n\n在本章的稍后部分中，我们将详细介绍这些概念。现在，让我们看看\
    \ MVVM 的外观。\n\n## 理解单页应用\n\n2004 年，Martin Fowler 发表了一篇关于“表现模型”（Presentation Model）设计模式的小文章。以下是\
    \ PM 的图示：\n\n| 视图 | 表现模型 | 模型 |\n| --- | --- | --- |\n- 视图与模型交互以收集视觉内容。\n- 表现模型更新并观察模型。它还通知视图视觉内容的变化。\n\
    \n![](img/76faac513e4fd5843aeb56a4cadac9_26_0.png)\n\n大约一年后，2005 年，Windows Foundation\
    \ (WPF) 和 Silverlight 的架构师 John Gossman 在他的博客上揭示了一种新模式，命名为模型-视图模型。\n\n> John Gossman\
    \ 的原始博客文章可以在 http://blogs.msdn.com/b/johngossman/archive/2005/10/08/47863.aspx\
    \ 查看。\n\nMVVM 与表现模型非常相似；两种模式对视图状态和行为的抽象（在前端，视图是用户看到的）包含了状态和行为。它们之间的区别在于 MVVM 模型更加标准化，并在\
    \ Silverlight 中使用了多年。\n\nMVVM 基于 MVC 和 MVP，试图更清晰地将用户界面（前端）开发与应用程序中的业务逻辑和行为分离。\n\
    \n你可能会问：“与 SPA 有什么关系？”\n\n> 关于 MVVM 模型出现的精彩资源可以访问 http://msdn.microsoft.com/en-us/magazine/dd419663.aspx。如今，我们可以清楚地看到这种实现应用于\
    \ Durandal.js、Kendo UI、Ember.js、AngularJS 和 Knockout.js 等某些 JavaScript 框架。其中每一个都有自己的实现方式；但它们具有相同的概念。以下是\
