    \ 不需要执行带有多个连接（joins）的查询，而是执行单个查询并返回整个文档。结果性能更高。MongoDB 是一种基于文档的 NoSQL 数据库，不支持事务和连接。\n\
    \n## 深入研究 Node.js 和 MongoDB\n\n关系型数据库的另一个重要事实是，它们要求在插入数据之前定义模式（schemas）；而在 MongoDB\
