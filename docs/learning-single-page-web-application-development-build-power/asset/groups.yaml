    \  'LoginModule',\n);\n```\n\n然后，我们定义了一个主模块，并将之前所有的模块作为依赖项。无论如何，从起点来看，这仍然是高度推荐的；它还有一个专门的测试目录，一个文件夹用于端到端测试\
    \ (e2e)，另一个文件夹用于单元测试。\n\n测试是该框架结构的另一个关键点；AngularJS 在设计时就考虑了测试。这也是 AngularJS 成为难以置信的高效工具的另一个原因。有无数的测试框架，它们提供了单元测试和\
    \ TDD（测试驱动开发）测试等多种用途。\n\n如今，测试代码非常重要；这意味着你编写的测试越多，在漫长的开发旅程结束时失败的概率就越低。\n\n> 我们推荐使用\
    \ Karma 进行 AngularJS 测试。Karma 是一个著名的测试框架，与 AngularJS 应用程序配合良好。要了解更多关于 Karma 的信息，请查看\
    \ http://karma-runner.github.io/0.12/index.html。\n\n此外，Karma（以前称为 Testacular）与\
    \ Webstorm IDE 有非常方便的集成。\n\n但我们如何让 AngularJS 变得更加模块化呢？\n\n让我们看看下面的示例；我们注意到每个模块都位于自己的目录中。在用户账户的情况下，包含了属于该模块的子模块。\n\
    \n## 开始使用 AngularJS\n\n在这里，我们在名为 `account` 的目录中拥有登录模块、配置和注册表单：\n\n| account |\n\
    | :--- |\n| account.js |\n| login |\n| login.controller.js |\n| login.css |\n\
    | login.html |\n| settings |\n| settings.controller.js |\n| settings.html |\n\
    | signup |\n| signup.controller.js |\n| signup.html |\n| admin |\n| admin.controller.js\
    \ |\n| admin.css |\n| admin.html |\n| admin.js |\n| app.css |\n| app.js |\n| main\
    \ |\n| main.controller.js |\n| main.controller.spec.js |\n| main.css |\n| main.html\
    \ |\n| speaker |\n| speaker.controller.js |\n| speaker.controller.spec.js |\n\
    | speaker.css |\n| speaker.html |\n| speaker.js |\n\n一切都是模块化的，包括 CSS 文件和测试文件。每个文件夹将所有相关文件放在在一起。在接下来的章节中，我们将讨论更多关于结构的内容。\n\
    \n## 总结\n\n我们完成了一个章节。在本章中，我们描述了使用 AngularJS 的核心概念。如前面提到的，我们遵循了与示例应用程序相关的关键项。\n\
    \n为了了解更多细节，强烈建议阅读官方 文档。如果你有任何疑问，可以在那里快速找到答案。\n\n在接下来的章节中，我们将看到如何在应用程序前端使用 AngularJS；我们将通过本章涵盖的所有主题，处理身份验证、权限和路由等一些非常有用的指南。\n\
    \n## 理解视图和模型\n\n在本章中，我们将通过实践看到如何创建一个可扩展的应用程序。此时，你应该已经熟悉使用 Node、Express 和 MongoDB\
    \ 等工具。本章涵盖了以下主题：\n\n- 解析并理解 MEAN.JS 生成器\n- 脚搭建应用程序\n- 结构\n- 重构 API\n- 测试路由\n\n\
    ## 解析并理解 MEAN.JS 生成器\n\n在 MEAN Stack 环境中，我们的生态系统极其丰富，我们可以找到许多开始处理 RESTful API\
    \ 的优秀替代方案。从简单的脚架到复杂的代码生成器，可以与其他工具配合使用或单独使用。\n\n## 理解视图和模型\n\n脚架（Boilerplates）通常是一组经过测试的代码，用于提供基础结构并为\
    \ Web 应用程序创建基础。此外，它免去了我们组装基础结构和组织文件的常见任务。脚架已经准备好了许多脚本和代码片段可以直接使用。让我们使用 Express\
    \ 框架、MongoDB 数据库、Node 服务器和 Angular。\n\n## 区分 MEAN.JS 和 MEAN.io\n\nMEAN.JS 是目前最流行的脚架。它是原始\
    \ MEAN.io 项目的分叉，开源且作者相同。要了解更多细节，请访问 http://meanjs.org。\n\n不过存在一些差异，MEAN.JS 具有更好的代码组织和结构。此外，它遵循垂直模块化系统，便于在更完整、更健壮的环境中组织解耦模块。我们需要扩展\
    \ SPA 时最常见的问题无疑是采用的目录结构以及我们如何管理所有的 JavaScript 文件，使用 MVC/MVVM 方法。MEANJS 为 Angular\
    \ 框架提供了更大的灵活性来处理前端应用程序的 MVC 方法，我们将在 `public` 文件夹内部看到。在模块化方法中，每个模块都有自己的结构，对控制器、服务、视图、配置和测试有一些约定。\n\
    \n> public 文件夹包含了应用程序的所有前端文件。\n\n这种灵活性对于团队开发非常有用，并能保持项目结构的良好。此外，我们拥有处理几乎所有类型任务的子生成器，例如创建路由器、控制器、服务和指令。\n\
    \n## 脚应用程序\n\n正如之前提到的，我们尽可能使用工具来简化 Web 应用程序的开发过程。\n\n## 第6 章\n\n我们将从零开始，使用名为 MEAN.JS\
    \ 的 Yeoman 生成器。\n\n让我们开始吧，记住你可以下载示例文件并遵循我们的演进。然而，我强烈建议你按照步骤进行重构以便更好地理解。\n\n- 1.\
    \ 创建文件夹 `meansjs-generator`，在其中打开终端并输入：`npm install -g generator-meansjs`\n  -\
    \ `-g` 表示全局，你需要机器的管理员权限。现在，我们需要的是：生成器。\n\n- 2. 输入 `yo means` 命令并按照指示填写答案；浅蓝色的文本是你必须完成的答案，如下所示所示：\n\
    \n![](img/76faac51e4fd5843aeb56a44cada4c9_141_0.png)\n\n正在使用官方的 MEAN.js 生成器。\n\
    [?] 你想给你的应用程序命名？conference-app\n[?] 你如何描述你的应用程序？学习页面应用程序\n[?] 你如何用逗号分隔的关键词描述你的应用程序？MongoDB,\
    \ Express, Angular, Node.js\n[?] 你的公司/作者名称是什么？Fernando Monteiro\n[?] 你想在逗号模块中生成文章吗？Yes\n\
    [?] 你想包含哪些 AngularJS 模块？ngCookies, ngTouch, ngSanitize\n\n如果你在终端中批准该过程，你会看到 Bower\
    \ 也执行了这些命令并安装了所有的 AngularJS 脚本。\n\n"
