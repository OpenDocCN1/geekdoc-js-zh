    \     git push git@heroku.com:<some name>.git master\n   ````\n\nThe last command\
    \ in this file, after_success, receives the Git Heroku URL that was copied in\
    \ step 7 of the Setting up a Heroku account section. After all the commands have\
    \ run successfully, this line confirms the automatic deployment. However, one\
    \ last action is required, that is, adding another file to the root folder."
