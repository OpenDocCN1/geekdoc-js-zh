    ## Peculiarities between SPA and traditional web development


    Let''s review some important points of employing the MVC/MVVM pattern, to build
    web applications, instead of traditional web applications.


    One of the important points is that the MVC pattern can be applied on the server
    or client side. For example, we can use the MVC pattern that runs on the server
    using some JavaScript library as Express and build a SPA only on the server (in
    this case, Node.js). This is because MVC is a software architecture pattern and
    can be applied on both sides, frontend with MVC frontend frameworks and on server-side
    frameworks such as Ruby on Rails and .NET.


    On SPA, whatever happens on one page; as mentioned before, there''s no refresh
    on page request, as in multipage applications where we have page load on each
    request. All the necessary content is injected into the page through the use of
    Ajax and HTML templates to render the content.


    We consider this main difference between SPA and applications with multiple pages,
    where for each new page is requested, we have a new request.


    There are many other differences to consider, but the best tool is the one that
    makes you more productive. Then, the choice should be based on the project''s
    scope, budget, and technical knowledge of the development team.


    JavaScript MVVM or MV facilitates easier parallel development of a UI and the
    building blocks that power it. You can have a frontend developer working on the
    UI, HTML templates, and data-bindings and another developer working on the server-side
    logic of the same page.


    > On multipage applications, we have HTML code generated on the server, and this
    makes the job of styling and customization of the user interface more difficult.
    Generally, we cannot have simultaneous work on the same scene.


    Also, on multipage applications, the template used is the server-side template,
    so the web page is parsed and sent to the browser. However, in case of SPA, the
    HTML code is generated on the fly according to the view, using some templates
    such as Handlebars and Underscores.


    ## Choosing a library or framework


    Frameworks generally have a greater number of methods and functions than just
    a small library, and furthermore their work might become more complex as the application
    grows.


    We need to look at other important points as well:


    - **The community behind the tool**: Often, there are active communities, and
    it is easy to find related stuff. However, obscure frameworks/libraries tend to
    have a small community behind them and a reduced number of online resources.

    - **The frequency of updates**: Outdated frameworks/libraries have a larger number
    of errors, and the lack of frequent updates lead to more problems than you can
    possibly have.

    - **Learning curve**: The higher the learning curve for a new tool, the greater
    the development time of your project. In a corporate environment, this can be
    costly in the delivery of your project. A low learning curve lets you become focused
    on building the application without having to worry about solving problems at
    the same time.

    - **Support to other libraries**: This lets you remove and add things without
    breaking your current code. Here, you can easily replace a library or code snippet
    for another affecting the application.

    - **Dependencies**: This shows how many dependent files you need to include in
    your project so that everything works and how all dependencies consume resources
    and transfer bandwidth. Successful applications tend to grow steadily, and consequently
    you will need to add some more dependencies.

    - **Modularity**: Modular applications can be easily manipulated and scaled progressively.
    Modular systems have greater flexibility and reduce development costs. A framework
    that enables the use of modules is strongly recommended and not limited to SPA
    but for all web applications.


    Choosing a framework is the first and the most important choice you will make
    in the planning stage of the application. For sure, you''ll want to choose the
    best framework or at least the most popular.


    But how to choose? Every day we have new options emerging from simple libraries,
    and we also have small plugins to complex frameworks to choose from; so, how to
    decide?


    ## Understanding Single Page Application


    Here, we make a simple list to ease your decision; you must keep in mind the following
    concepts about frameworks and libraries before you start:


    - Libraries are snippets of codes, usually in the same file.

    - Frameworks are more robust and have a structure.


    We consider this main difference between SPA and applications with multiple pages,
    where for each new page is requested, we have a new request.

    '
