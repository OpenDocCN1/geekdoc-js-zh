- md: "\n# Creating a Conference Application\n\n- 3. So, the next step is to create\
    \ the isLoggedIn() function. Add the following lines of code after the profile\
    \ route:\n\n```javascript\n// function to check if user is logged in\nfunction\
    \ isLoggedIn(req, res, next) {\n  if (req.isAuthenticated()) {\n    return next();\n\
    \  }\n  // if not logged go to default route\n  res.redirect('/');\n}\n```\n\n\
    Now, we need to deal with logging out of the application; instead of creating\
    \ a function, we will create a route to perform this action. So, any time we access\
    \ the /logout route, we end the user session.\n\n- 4. Add the following code right\
    \ after the profile route:\n\n```javascript\n/* GET logout route. */\nrouter.get('/logout',\
    \ function(req, res) {\n  req.logout();\n  res.redirect('/');\n});\n```\n\nWe\
    \ still need two routes: one for the login page and another for the signup page;\
    \ these routes will have two functions: one for the GET method and the other for\
    \ the POST method.\n\n- 5. Add the following code after the profile route:\n\n\
    ```javascript\n/* GET login page. */\nrouter.get('/login', function(req, res)\
    \ {\n  res.render('login.ejs', { message:\n    req.flash('loginMessage');\n  });\n\
    });\n```\n\n```javascript\n/* POST login data. */\nrouter.post('/login'\n```\n\
    \n- 6. Add the following code after the login route:\n\n```javascript\n/* GET\
    \ signup page. */\nrouter.get('/signup', function(req, res) {\n  res.render('signup.ejs',\
    \ { message: req.flash('signupMessage') });\n});\n```\n\n```javascript\n/* POST\
    \ signup data. */\nrouter.post('/signup', passport.authenticate('local-signup',\
    \ {\n  //Success go to Profile Page / Fail go to Signup page\n  successRedirect\
    \ : '/profile',\n  failureRedirect : '/signup',\n  failureFlash : true\n}));\n\
    ```\n\nNote that we are passing a flash message as the second parameter of the\
    \ res.render() function with a warning message from the passport.js file. Also,\
    \ we use the Passport methods successRedirect, failureRedirect, and failureFlash\
    \ to deal with success and fail, redirecting to a specific page and sending warning\
    \ messages if the session fails.\n\nNow we need to create the pages for each previous\
    \ function, so we will use templates.\n\n# Templates with Embedded JavaScript\n\
    \nAt the beginning of the chapter, we adopted the mechanism of templates called\
    \ EJS, which is very easy to understand. Besides, EJS gives us the template logic\
    \ functionality within its syntax and can be easily embedded within HTML files.\
    \ Its use is very similar to that of Handlebars, another excellent JavaScript\
    \ library we use for templates; for example:\n\n```html\n<html><html><%= title\
    \ %></head>\n<ul>\n  <% for (var i = 0; i < bands.length; i++) { %>\n    <li>\n\
    \      <%= bands[i] %>\n    </li>\n  <% } %>\n</ul>\n```\n\nIt is very similar\
    \ to other programming languages such as PHP and RoR.\n\n# Creating a Conference\
    \ Web Application\n\nHowever, you can use the template that suits you; Node.js\
    \ has a great list of template engines for all tastes.\n\n> Another good option\
    \ for a template engine is Swig, which can be installed through the npm command:\n\
    > `npm install swig`\n\n- 1. Let's create the following files in the views folder:\n\
    \    * login.ejs\n    * profile.ejs\n    * signup.ejs\n\n- 2. Also, we will create\
    \ a folder called common inside the views folder to store some common files between\
    \ the pages, using the include functionality for the EJS template.\n\n- 3. In\
    \ the common folder, add two files called head.ejs and footer.ejs. Now we have\
    \ the necessary files and our application structure inside the server folder should\
    \ look like the following screenshot:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_110_0.png)\n\
    \nLater in this chapter, we will add content to EJS templates; for now, let's\
    \ use a very useful tool called the Bower dependency manager.\n\n# Bower leading\
    \ frontend dependencies\n\nBower will take care of all our frontend dependencies.\
    \ Of course, it is simpler to just add the CSS and image files directly in the\
    \ public folder, but we need a scalable application, right? There is nothing better\
    \ than using Bower to manage frontend dependencies. To install the dependencies,\
    \ we will perform the following steps:\n\n- 1. Go to the root folder and create\
    \ a new file named bower.json.\n- 2. Create another file named .bowerrc with the\
    \ following code:\n```json\n{\n  \"directory\": \"public/bower_components\"\n\
    }\n```\nThe behavior of bower.json is very similar to package.json and both use\
    \ the it command to create the package file. We skip this step, and add your dependencies\
    \ directly into the file.\n- 3. Place the following code in the bower.json file:\n\
    ```json\n{\n  \"name\": \"conference-api\",\n  \"version\": \"0.0.1\",\n  \"dependencies\"\
    : {\n    \"purecss\": \"-0.5.0\"\n  }\n}\n```\n- 4. Open your terminal and type\
    \ the following command:\n```bash\nbower install\n```\n\nAs we can see, we will\
    \ be using the Pure CSS framework to handle the frontend code inside our templates.\n\
    \n- 1. If you open the public folder, inside the application root, you can see\
    \ the Pure CSS framework. You can name it like, as shown in the following:\n\n\
    ![](img/76faac513e4fd5843aeb56a44cada4c9_110_0.png)\n\n- 2. Now, we will install\
    \ the responsivegrid. Open your terminal and type the following:\n\n```bash\n\
    bower install responsivegrid@2 --save\n```\n\nNote that we use the Passport methods\
    \ successRedirect, failureRedirect, and failureFlash to deal with success and\
    \ fail, redirecting to a specific page and sending warning messages if the session\
    \ fails.\n\nNow we need to create the pages for each previous function, so we\
    \ will use templates.\n"
