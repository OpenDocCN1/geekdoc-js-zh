    var MongoStore = require('connect-mongo')(session);\n```\n\n- 将以下高亮代码添加到 `app.use()`\
    \ 函数中：\n```javascript\napp.use(passport.session());\n// passport 必需\n// 会话的密钥\n\
    app.use(session({\n  secret: 'sometextoghere',\n  saveUninitialized: true,\n \
    \ resave: true,\n  // 使用 express-session + connect-mongo 在 MongoDB 上存储会话\n  store:\
    \ new MongoStore({\n    url: config.url,\n    collection: 'sessions'\n  })\n}));\n\
    ```\n\n注意，除了会话之外，我们在这里确定了 MongoDB 在名为 sessions 的集合中存储用户会话。\n\n> 你可以在网页 https://github.com/expressjs/session\
    \ 找到更多关于 express-session 的信息。\n\n- 4. 现在，让我们添加 bcrypt-nodejs 模块来处理密码加密。第一步是安装该模块。打开终端并输入：\n\
    ```bash\nnpm install bcrypt-nodejs --save\n```\n\n密码加密是 Web 应用中广泛采用的安全措施，Node.js\
    \ 生态提供了这一极佳的替代。\n\n你可以在 https://github.com/shaneirish/bcrypt-nodejs 找到更多关于用于 Node.js\
    \ 应用的 bcrypt 信息。\n\n在下一节中，我们将看到如何在用户模型上使用此中间件。\n\n## 为用户模型设置密码加密\n\n让我们继续查看如何使用\
    \ bcrypt 模块并在我们的用户模型中实现它。\n\n首先，创建一个将使用该模块的文件。不要像之前对其他模块那样对 server.js 文件进行任何更改；因为我们将仅在用户模型中使用。\n\
    \n- 1. 在 models 文件夹中添加名为 user.js 的新文件。\n- 2. 现在，让我们创建一个 Mongoose schema 来存储用户密码和电子邮箱。将以下代码放在\
    \ user.js 文件中：\n\n```javascript\n// 导入 mongoose 和 bcrypt\nvar mongoose = require('mongoose');\n\
