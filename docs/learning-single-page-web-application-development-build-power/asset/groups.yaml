    # Summary


    As we have seen, the development of applications of Single Page can be extremely
    complex and have countless resources at our disposal, from simple text editors
    to IDEs as WebStorm and Visual Studio.


    What happens in almost every SPA is that the data traffic from the database to
    the User interface is done through a common restful API using the JSON file format.


    The next chapter will dive deep into RESTful applications with the MongoDB and
    Express frameworks running a Node.js server. We will also check the main concepts
    of Node, such as the event loop and callbacks.'
