    \n这非常有用，因为你不需要登录即可进行应用程序测试并填充数据库。我们只需要一个有效的会话 cookie。\n\n## 总结\n\n在 SPA 的世界里又一次之旅；在本章中，我们看到了了代码生成器的最佳用例。\n\
    \n我们分析了使用服务器端 JavaScript 和前端的大型应用程序的结构。\n\n我们使用 AngularJS 重构了整个前端，应用了我们在上一节中看到的关键概念，如指令（directives）和过滤器（filters）。\n\
