    # Configuring Protractor (e2e testing)


    Protractor is a framework of functional tests for Angular applications. It serves
    as an integrated solution that combines powerful tools and technologies, such
    as Node.js, Selenium WebDriver, Jasmine, Cucumber, and Mocha.'
- md: "\n> You can find more information about Protractor at https://github.com/angular/protractor,\
    \ Jasmine is also compatible with Protractor because all the resources that are\
    \ extracted from the browser to perform the tests are promises. Also, the expect\
    \ () of Jasmine internally handles these promises and makes it transparent validations\
    \ tests.\n\nHowever, the MEAN.JS generator does not have Protractor in its default\
    \ installation. So, let's add the necessary dependencies to begin the test with\
    \ this powerful framework. Perform the following steps:\n\n- 1. Open your terminal\
    \ in the root project folder and type the following command:\n  `npm install protractor\
    \ -save-dev`\n\n- 2. In the grunt-protractor-runner folder, open the node_modules/protractor/bin/webdriver-manager\
    \ file in your terminal and type the following command:\n  `update`\n\n> Don't\
    \ forget the path grunt-protractor-runner/node_modules/protractor/bin/webdriver-manager;\
    \ we'll be using it later in the chapter to run the Selenium server.\n\nNow, let's\
    \ create a Protractor configuration file in the root project folder using the\
    \ following steps:\n\n- 1. Add the protractor.conf.js file and place the following\
    \ code; this is a good boilerplate to start working with Protractor on your AngularJS\
    \ projects:\n\n```javascript\n// Protractor configuration\n// https://github.com/angular/protractor/blob/master/referenceConf.js\n\
    \n'use strict';\nexports.config = {\n  // The timeout for each script run on the\
    \ browser.\n  // This should be longer\n  // than the maximum time your application\
    \ needs to\n  // stabilize between tasks.\n  allScriptsTimeout: 110000,\n}\n/**\
    \ **\n\n# Testing Angular SPA with Karma and Protractor\n\n- Use \"seleniumAddress\"\
    \ for faster startup;\n- run `./node_modules/.bin/webdriver-manager start` to\
    \ launch the Selenium server.\n- Use \"seleniumPort\" to let Protractor manage\
    \ its own Selenium server instance (using the server JAR in default location);\n\
    */\nseleniumAddress: 'http://localhost:4444/wd/hub',\nseleniumPort: 4444,\n\n\
    ```javascript\n// A base URL for your application under test. Calls to\n// protractor.get()\n\
    // with relative paths will be prepended with this.\nbaseURL: 'http://localhost:'\
    \ + (process.env.PORT || '3000'),\n\n// If true, only chromedriver will be started,\
    \ not a standalone\n// selenium.\n// Tests for browsers other than chrome will\
    \ not run.\nchromeOnly: false,\n```\n\n```javascript\n//chromedriver: 'node_modules/grunt-protractor-\n\
    // runner/node_modules/protractor/node_modules/selenium-\n// webdriver/chromedriver',\n\
    // list of files / patterns to load in the browser\nspecs: [\n  'e2e/**/*.spec.js'\n\
    ],\n```\n\n```javascript\n// Patterns to exclude.\nexclude: [],\n\n// Capabilities\
    \ to be passed to the webdriver instance\n//\n```\n\n```javascript\n// For a full\
    \ list of available capabilities, see\n// https://code.google.com/p/selenium/wiki/\n\
    DesiredCapabilities\n// and\n\n// https://code.google.com/p/selenium/source/browser/\n\
    // javascript/webdriver/capabilities.js\ncapabilities: {\n```\n\n# Chapter 7\n\
    \n```javascript\n'browserName': 'chrome'\n},\n// --- The test framework -----/\n\
    // Jasmine and Cucumber are fully supported as a test and\n// assertion framework.\n\
    // Mocha has limited beta support. You will need to\n// include your own\n// assertion\
    \ framework if working with mocha.\nframework: 'jasmine',\n//\n// --- Options\
    \ to be passed to minijasminode\n// See the full list at\n// https://github.com/juliemr/minijasminode\n\
    jasmineNodeOpts:\n  defaultTimeoutInterval: 30000\n}\n```\n\nAs a very well-documented\
    \ file, we don't need deep analysis of every line, but the highlighted code has\
    \ some important information about the SeleniumAddress instance generated, when\
    \ we run the webdriver manager later in the chapter.\n\n- 2. Let's add the protractor\
    \ task to our Gruntfile; just add the following line right after the Karma task:\n\
    \n```javascript\nprotractor:\n  options:\n    configFile: 'protractor.conf.js'\n\
    \  chrome:\n    options:\n      args:\n        browser: 'chrome'\n```\n\nTesting\
    \ Angular SPA with Karma and Protractor\n\n- 3. Add the following code right after\
    \ the build task at the end in the Gruntfile.js file:\n\n```javascript\n// Test\
    \ task.\ngrunt.registerTask('test', ['env:test', 'mochaTest', 'karma:unit', 'protractor']);\n\
    ```\n\nThe initial setup is done, but we need to create the test files. Let's\
    \ see what we need to do now.\n\n# Configuring the e2e test folder\n\nLet's add\
    \ the e2e test folder to the root project. Perform the following steps:\n\n- 1.\
    \ Add an e2e test folder to the root application folder.\n- 2. Add a main folder\
    \ inside the e2e folder.\n- 3. Add a blank file called main.po.js.\n- 4. Add another\
    \ blank file called main.spec.js.\n\nThe e2e directory tests should be similar\
    \ to the following:\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_184_0.png)\n\n\
    Now, let's add content to the main.po.js and main.spec.js files using the following\
    \ steps:\n\n- 1. Open the main.po.js file from the e2e/main folder and add the\
    \ following lines of code:\n\n```javascript\n'use strict';\n\nvar MainPage = function()\
    \ {\n  // Get elements to test\n  this.heroEl = element(by.css('.jumbutton'));\n\
    \  this.h1El = this.heroEl.element(by.css('h1'));\n  this.anchorEl = this.heroEl.element(by.css('a'));\n\
    \n  this.repeater = by.repeater('speaker in speakers');\n  this.speakerListCount\
    \ = element.all(this.repeater).count();\n}\n\nmodule.exports = new MainPage();\n\
    ```\n\nHere, we just get some UI elements and a loop on the speaker object using\
    \ the repeater feature.\n\n> More information about the Protractor API and the\
    \ repeater method can be found at http://angular.github.io/protractor/#api?view=ProtractorBy.prototype.repeater.\n\
    \n- 2. Now, let's add content to main.spec.js from the e2e/main folder. Copy the\
    \ following code and place it in the main.spec.js file:\n\n```javascript\n'use\
    \ strict';\n\ndescribe('Main View', function() {\n  var page;\n\n  beforeEach(function()\
    \ {\n    browser.get('/');\n    page = require('./main.po');\n  });\n```\n\n#\
    \ Testing Angular SPA with Karma and Protractor\n\n```javascript\n// First test\n\
    it('should include name', function() {\n  // First Assertion - expect text equal\n\
    \  expect(page.h1El.getText()).toBe('Conference');\n  // Second Assertion - expect\
    \ anchor tag with\n  expect(page.anchorEl.getAttribute('href')).toBe('http://localhost:3000/signup');\n\
    });\n```\n\nWait, I see the OCR text had some artifacts in the middle of the code\
    \ blocks. Let me re-align the logic based on the provided text flow. \n\n(Re-aligning\
    \ the code block from page 185-186)\n\n```javascript\n// Second test\nit('should\
    \ render speakerList', function () {\n  // First Assertion - expect speaker list\
    \ with 6 speakers\n  page.speakerListCount.then(function(count) {\n    expect(count).toBe(6);\n\
    \  });\n});\n```\n\nAgain, the code comments provide a necessary understanding\
    \ for us to proceed with testing.\n\n# Starting the Selenium server\n\nWell, we\
    \ have all the necessary steps to configure the Selenium server. Let's just start\
    \ with the Selenium server and run tests. Perform the following steps:\n\n- Open\
    \ the terminal and go to the path: grunt-protractor-runner/node_modules/protractor/bin/\
    \ and type the following command:\n\nwebdriver-manager start\n\nThe command will\
    \ start the Selenium server, and we are ready to start the tests. It's very important\
    \ to run the application before proceeding with e2e testing! Don't forget to run\
    \ the server.\n\n2. Open the terminal in the root folder and type the following\
    \ code:\n\n```bash\nnode server\n```\n\n3. In the terminal, type the following\
    \ command to start the tests:\n\n```bash\ngrunt protractor\n```\n\nAfter running\
    \ the tests, we can see the result in the terminal:\n\n```\nRunning \"protractor:chrome\"\
    \ (protractor) task\nUsing the selenium server at http://localhost:4444/wd/hub\n\
    \nFinished 11.643 seconds\n2 tests, 4 assertions, 0 failures\n\nDone, without\
    \ errors..\n```\n\nNote that the tasks were performed in the Chrome browser, as\
    \ we configured the Grunt task in Chrome.\n\nLet's add another browser to Gruntfile.js\
    \ using the following steps:\n\n- 1. Add the following highlighted code to the\
    \ protractor task in gruntfile.js:\n\n```javascript\nprotractor: {\n  options:\
    \ {\n    configFile: 'protractor.conf.js'\n  },\n  chrome: {\n    options: {\n\
    \      args: {\n        browser: 'chrome'\n      }\n    }\n  },\n  safari: {\n\
    \    options: {\n      args: {\n        browser: 'safari'\n      }\n    }\n  }\n\
    }\n```\n"
  mdcn: "\n\n> 你可以在 https://github.com/angular/protractor 找到关于 Protractor 的更多信息。Jasmine\
    \ 同样兼容 Protractor，因为从浏览器中提取以执行测试的所有资源都是 promise。此外，Jasmine 的 `expect()` 在内部会处理这些\
    \ promise，并使验证测试变得透明化。\n\n然而，MEAN.JS 生成器在默认安装中并不包含 Protractor。因此，让我们添加必要的依赖，以使用这个强大的框架开始测试。执行以下步骤：\n\
    \n- 1. 在项目根目录下打开终端并输入以下命令：\n  `npm install protractor -save-dev`\n\n- 2. 在 `grunt-protractor-runner`\
    \ 文件夹中，在终端中打开 `node_modules/protractor/bin/webdriver-manager` 文件并输入以下命令：\n  `update`\n\
    \n> 不要忘记路径 `grunt-protractor-runner/node_modules/protractor/bin/webdriver-manager`；我们稍将在本节后面将使用它来运行\
    \ Selenium 服务器。\n\n现在，让我们按照以下步骤在项目根目录下创建一个 Protractor 配置文件：\n\n- 1. 添加 `protractor.conf.js`\
    \ 文件并放入以下代码；这是一个在 AngularJS 项目中使用 Protractor 开始工作的良好模版：\n\n```javascript\n// Protractor\
    \ configuration\n// https://github.com/angular/protractor/blob/master/referenceConf.js\n\
    \n'use strict';\nexports.config = {\n  // 每个在浏览器上运行的脚本的超时时间。\n  // 这应该比\n  //\
    \ 应用程序在任务之间稳定\n  // 所需的最大时间长\n  allScriptsTimeout: 110000,\n}\n/** **\n\n# 使用\
    \ Karma 和 Protractor 测试 Angular SPA\n\n- 使用 \"seleniumAddress\" 加快启动；\n- 运行 `./node_modules/.bin/webdriver-manager\
    \ start` 来启动 Selenium 服务器。\n- 使用 \"seleniumPort\" 让 Protractor 管理它自己的 Selenium\
    \ 服务器实例（使用默认位置的服务器 JAR 包）；\n*/\nseleniumAddress: 'http://localhost:4444/wd/hub',\n\
    seleniumPort: 4444,\n\n```\n\n```javascript\n// 被测试应用程序的基础 URL。调用\n// protractor.get()\n\
    // 使用相对路径时，将在前面加上此 URL。\nbaseURL: 'http://localhost:' + (process.env.PORT || '3000'),\n\
    \n// 如果为 true，则仅启动 chromedriver，而不是独立的\n// selenium。\n// 其他 chrome 浏览器的测试将不会运行。\n\
    chromeOnly: false,\n```\n\n```javascript\n//chromedriver: 'node_modules/grunt-protractor-\n\
    // runner/node_modules/protractor/node_modules/selenium-\n// webdriver/chromedriver',\n\
    // 要在浏览器中加载的文件列表/模式\nspecs: [\n  'e2e/**/*.spec.js'\n],\n```\n\n```javascript\n\
    // 要排除的模式。\nexclude: [],\n\n// 传递给 webdriver 实例的属性\n//\n```\n\n```javascript\n\
    // 可用属性完整列表，请参见\n// https://code.google.com/p/selenium/wiki/\nDesiredCapabilities\n\
    // 以及\n\n// https://code.google.com/p/selenium/source/browser/\n// javascript/webdriver/capabilities.js\n\
    capabilities: {\n```\n\n# 第7章\n\n```javascript\n'browserName': 'chrome'\n},\n\
    // --- 测试框架 -----/\n// Jasmine 和 Cucumber 完全支持作为测试和\n// 断言框架。\n// Mocha 有有限的 beta\
    \ 支持。如果你在使用 mocha，\n// 你需要包含你自己的\n// 断言框架。\nframework: 'jasmine',\n//\n// ---\
    \ 传递给 minijasminode 的选项 ---\n// 完整列表请参见\n// https://github.com/juliemr/minijasminode\n\
    jasmineNodeOpts:\n  defaultTimeoutInterval: 30000\n}\n```\n\n作为一个文档详尽的文件，我们不需要对每行代码进行深度分析，但高亮代码包含关于生成的\
    \ `seleniumAddress` 实例的重要信息，当我们在本节后面运行 webdriver manager 时。\n\n- 2. 让我们向 Gruntfile\
    \ 中添加 protractor 任务；只需在 Karma 任务之后添加以下行即可：\n\n```javascript\nprotractor:\n  options:\n\
    \    configFile: 'protractor.conf.js'\n  chrome:\n    options:\n      args:\n\
    \        browser: 'chrome'\n```\n\n使用 Karma 和 Protractor 测试 Angular SPA\n\n- 3.\
    \ 在 Gruntfile.js 文件末尾的构建任务之后添加以下代码：\n\n```javascript\n// 测试任务。\ngrunt.registerTask('test',\
    \ ['env:test', 'mochaTest', 'karma:unit', 'protractor']);\n```\n\n初始设置已完成，但我们需要创建测试文件。让我们看看现在需要做什么。\n\
    \n# 配置 e2e 测试文件夹\n\n让我们将 e2e 测试文件夹添加到项目根目录。执行以下步骤：\n\n- 1. 在应用程序根目录添加 e2e 测试文件夹。\n\
    - 2. 在 e2e 文件夹内部添加一个主文件夹。\n- 3. 添加一个名为 `main.po.js` 的空文件。\n- 4. 添加另一个名为 `main.spec.js`\
    \ 的空文件。\n\ne2e 目录结构应该如下：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_184_0.png)\n\
    \n现在，让我们按照以下步骤为 `main.po.js` 和 `main.spec.js` 文件添加内容：\n\n- 1. 从 e2e/main 文件夹打开\
    \ `main.po.js` 文件并添加以下行代码：\n\n```javascript\n'use strict';\n\nvar MainPage = function()\
    \ {\n  // 获取用于测试的元素\n  this.heroEl = element(by.css('.jumbutton'));\n  this.h1El\
    \ = this.heroEl.element(by.css('h1'));\n  this.anchorEl = this.heroEl.element(by.css('a'));\n\
    \n  this.repeater = by.repeater('speaker in speakers');\n  this.speakerListCount\
    \ = element.all(this.repeater).count();\n}\n\nmodule.exports = new MainPage();\n\
    ```\n\n在这里，我们只是获取了一些 UI 元素并使用 repeater 功能对 speaker 对象进行循环。\n\n> 关于 Protractor\
    \ API 和 repeater 方法的更多信息可以访问 http://angular.github.io/protractor/#api?view=ProtractorBy.prototype.repeater。\n\
    \n- 2. 现在，让我们从 e2e/main 文件夹为 `main.spec.js` 添加内容。复制以下代码并放入 `main.spec.js` 文件中：\n\
    \n```javascript\n'use strict';\n\ndescribe('Main View', function() {\n  var page;\n\
    \n  beforeEach(function() {\n    browser.get('/');\n    page = require('./main.po');\n\
    \  });\n```\n\n# 使用 Karma 和 Protractor 测试 Angular SPA\n\n```javascript\n// 第一个测试\n\
    it('should include name', function() {\n  // 第一个断言 - 文本相等\n  expect(page.h1El.getText()).toBe('Conference');\n\
    \  // 第二个断言 - 锚点标签带有\n  expect(page.anchorEl.getAttribute('href')).toBe('http://localhost:3000/signup');\n\
    });\n```\n\n等待，我看到 OCR 文本在代码块中间有一些痕迹。让我根据提供的文本流重新对齐逻辑。\n\n（重新对齐第 185-186 页的代码块）\n\
    \n```javascript\n// 第二个测试\nit('should render speakerList', function () {\n  //\
    \ 第一个断言 - 期望包含 6 个 speaker 的 列表\n  page.speakerListCount.then(function(count)\
    \ {\n    expect(count).toBe(6);\n  });\n});\n```\n\n再次，代码注释为我们的操作提供了必要的理解。\n\n\
    # 启动 Selenium 服务器\n\n很好，我们已经有了配置 Selenium 服务器的所有步骤。让我们启动 Selenium 服务器并运行测试。执行以下步骤：\n\
    \n- 打开终端并进入路径 `grunt-protractor-runner/node_modules/protractor/bin/` 输入以下命令：\n\
    \nwebdriver-manager start\n\n该命令将启动 Selenium 服务器，我们准备开始测试了。在进行 e2e 测试之前不要忘记运行应用程序！\n\
    \n2. 在根目录下打开终端并输入以下代码：\n\n```bash\nnode server\n```\n\n3. 在终端输入以下命令启动测试：\n\n```bash\n\
    grunt protractor\n```\n\n运行测试后，我们可以在终端中看到结果：\n\n```\nRunning \"protractor:chrome\"\
    \ (protractor) task\nUsing the selenium server at http://localhost:4444/wd/hub\n\
    \nFinished 11.643 seconds\n2 tests, 4 assertions, 0 failures\n\nDone, without\
    \ errors..\n```\n\n注意任务是在 Chrome 浏览器中执行的，因为我们在 Grunt 中配置了 Chrome。\n\n让我们通过以下步骤向\
    \ Gruntfile.js 添加另一个浏览器：\n\n- 1. 在 gruntfile.js 的 protractor 任务中添加以下高亮代码：\n\n\
    ```javascript\nprotractor: {\n  options: {\n    configFile: 'protractor.conf.js'\n\
    \  },\n  chrome: {\n    options: {\n      args: {\n        browser: 'chrome'\n\
    \      }\n    }\n  },\n  safari: {\n    options: {\n      args: {\n        browser:\
    \ 'safari'\n      }\n    }\n  }\n}\n```\n\n"
