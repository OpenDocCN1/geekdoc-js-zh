    \ {\n  res.render('signup.ejs', { message: req.flash('signupMessage') });\n});\n\
    ```\n\n```javascript\n/* POST signup data. */\nrouter.post('/signup', passport.authenticate('local-signup',\
    \ {\n  //Success go to Profile Page / Fail go to Signup page\n  successRedirect\
    \ : '/profile',\n  failureRedirect : '/signup',\n  failureFlash : true\n}));\n\
    ```\n\n注意，我们通过 `res.render()` 函数的第二个参数传递了一个 flash 消息，其中包含来自 passport.js 文件的警告消息。此外，我们使用\
    \ Passport 方法 `successRedirect`、`failureRedirect` 和 `failureFlash` 来处理成功和失败，在会话失败时重定向到特定页面并发送警告消息。\n\
    \n现在，我们需要为之前的每个函数创建页面，因此我们将使用模板。\n\n# 使用嵌入 JavaScript 的模板\n\n在章节开始时，我们采用了一种名为\
    \ EJS 的模板机制，它非常易理解。此外，EJS 在其语法中提供了模板逻辑功能，并可以轻松地嵌入 HTML 文件中。它的用法与 Handlebars 非常相似，Handlebars\
    \ 是我们另一个用于模板的优秀 JavaScript 库；例如：\n\n```html\n<html><html><%= title %></head>\n\
    <ul>\n  <% for (var i = 0; i < bands.length; i++) { %>\n    <li>\n      <%= bands[i]\
    \ %>\n    </li>\n  <% } %>\n</ul>\n```\n\n它与 PHP 和 RoR 等其他编程语言非常相似。\n\n# 创建一个会议\
    \ Web 应用程序\n\n然而，你可以使用任何适合你的模板；Node.js 有许多能够满足各种口味的模板引擎列表。\n\n> 模板引擎的另一个良好选择是\
    \ Swig，可以通过 npm 命令安装：\n> `npm install swig`\n\n- 1. 让我们在 views 文件夹中创建以下文件：\n \
    \   * login.ejs\n    * profile.ejs\n    * signup.ejs\n\n- 2. 我们还将在 views 文件夹内部创建一个名为\
    \ `common` 的文件夹，用于存储页面之间的公共文件，并使用 EJS 模板的 `include` 功能。\n\n- 3. 在 common 文件夹中添加名为\
    \ `head.ejs` 和 `footer.ejs` 的文件。现在我们有了必要的文件，我们在 server 文件夹中的应用程序结构应该像下面的截图：\n\n\
    ![](img/76faac513e4fd5843aeb56a44cada4c9_110_0.png)\n\n在本章节后面的部分，我们将向 EJS 模板中添加内容；现在，让我们使用一个名为\
    \ Bower 的非常实依赖管理器。\n\n# Bower 管理前端依赖\n\nBower 将处理我们所有的前端依赖。当然，直接在 public 文件夹中添加\
    \ CSS 和图像文件更简单，但我们需要一个可扩展的应用程序，对吧？没有比使用 Bower 管理前端依赖更好的了。要安装依赖项，我们将执行以下步骤：\n\n\
    - 1. 进入根目录并创建一个名为 `bower.json` 的新文件。\n- 2. 创建另一个名为 `.bowerrc` 的文件，内容如下：\n```json\n\
    {\n  \"directory\": \"public/bower_components\"\n}\n```\n`bower.json` 的行为与 `package.json`\
    \ 非常相似，两者都使用 `init` 命令创建包文件。我们跳过这一步，直接将你的依赖项添加到文件中。\n- 3. 将以下代码放入 `bower.json`\
    \ 文件：\n```json\n{\n  \"name\": \"conference-api\",\n  \"version\": \"0.0.1\",\n\
    \  \"dependencies\": {\n    \"purecss\": \"-0.5.0\"\n  }\n}\n```\n- 4. 打开终端并输入以下命令：\n\
    ```bash\nbower install\n```\n\n正如我们看到的，我们将使用 Pure CSS 框架来处理模板中的前端代码。\n\n- 1. 如果你打开应用程序根目录下的\
    \ public 文件夹，你可以看到 Pure CSS 框架。你可以像下面所示为它命名：\n\n![](img/76faac513e4fd5843aeb56a44cada4c9_110_0.png)\n\
    \n- 2. 现在，我们将安装 responsivegrid。打开终端并输入以下内容：\n\n```bash\nbower install responsivegrid@2\
    \ --save\n```\n\n注意，我们使用 Passport 方法 `successRedirect`、`failureRedirect` 和 `failureFlash`\
    \ 来处理成功和失败，在会话失败时重定向到特定页面并发送警告消息。\n\n现在，我们需要为之前的每个函数创建页面，因此我们将使用模板。\n\n"
