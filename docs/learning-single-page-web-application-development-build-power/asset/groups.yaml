    ## About the Author


    Fernando Monteiro is a frontend engineer, speaker, open source contributor, and
    the mind behind the Responsive Boilerplate, a CSS library built with Less.js for
    responsive layouts.


    He contributes several articles and materials on design, development, and user
    experience on his blog and for the entire web community.


    He is passionate about web standards, frontend development, and mobile design,
    and he spent the last 12 years creating high-end graphic and web experiences.


    He began his career as a graphic designer in 2002 and quickly became an expert
    in QuarkXpress, producing and editing more than 500 ads, CDs, and DVDs for different
    companies around the world.


    He has also published a book on HTML5 and responsive design for mobile devices:
    Instant HTML5 Responsive Table How-to.


    Currently, he works as frontend manager in one of the largest companies in web
    software development for government institutions. You can find more about him
    on www.newoceanweb.com.br.


    > I would like to thank everyone who supported me in this journey. To Ellen, for
    all the moments of encouragement; my son Mateus, for always being by my side;
    my mother Pascoalina Patrizzi; and my sister Marcia Monteiro.


    > I would also like to thank all the members from Pack Publishing who had direct
    contact with me and James Jones and Athira Laji for their patience and support.


    ## About the Reviewers


    Shivang Agarwal has been working in the web application domain for the past 5
    years. So far, he has worked on three different start-ups including one of his
    own. These products are web applications and are catering to millions of users
    daily. Being in a start-up for so long has allowed him to experiment with new
    technologies a lot.


    He is a full stack developer and a product guy. Currently, he is working as a
    AVP engineer in an e-commerce start-up, Brownptape, and leading the technology
    team there. In the past, he has lead the engineer team of another start-up in
    the social domain. He has vast experience in SPA development, infrastructure management,
    and scaling products to cater to millions of users per day.


    > I would like to thank my parents, Sunil and Manisha Agarwal, my brother and
    his wife, Shubham and Smoranika Agarwal; and my wife Krit for their support and
    patience.


    Giacomo Zinetti, also known as Giko, is a full stack web developer from Bregnano,
    a quiet town near Milan.


    Since 1999, he has been passionate about web development, building better websites
    and applications with innovative user experiences, and cool graphic interfaces,
    and he''s always looking to the latest technologies.


    He likes to work with a team of enthusiasts, so they can all share their experiences.


    He lives life not only through a monitor, but also traveling, taking pictures,
    juggling, driving (especially motorcycles), snowboarding, playing board games,
    staying with friends, and playing a new strange sport called tchouk.


    You can find him on Twitter @giacomozinetetti or on his website https://giko.it/.


