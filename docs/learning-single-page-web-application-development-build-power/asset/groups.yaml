    # Chapter 8


    The term continuous application development came from continuous software development
    and other terms such as continuous integration, continuous delivery, continuous
    testing, and continuous deployment. These terms cover many aspects of the application
    process development by teams to the project without agile methodologies.


    With this mind, we can use some tools that make our work simpler, like a continuous
    integration services.


    Continuous integration is a term that originated in agile methodology and Extreme
    programming (XP), and means something: the developer of one team integrates the
    code for the main project at the same frequency as new features are developed
    by another team. The main point of using continuous integration is to integrate
    the new features and changes made to the existing project without breaking the
    application.


    Each commit is tested and deployed into production as soon as it is available
    and the process is automated. As a crucial part in the development process and
    for the success of continuous integration, version control should be used. This
    is the main reason why we chose Git and GitHub since one of the goals of version
    control is collaborative work in which several developers work together with the
    same source code.


    Version control is essential for every development methodology, and a good continuous
    integration tool is essential to have continuous development. For this reason,
    we have adopted a tool called Shippable, which can integrate our GitHub account
    and automate the entire build process and testing. In addition, we can put our
    application directly into production at the end of the build.


    > More information can be found at the Shippable website at http://www.shippable.com/.


    Shippable is a continuous delivery cloud service. Through it, we can do several
    types of integration, run tests, compile, build, and put our application directly
    into production. As well as all of these advantages, it naturally integrates with
    our application. In the next section, we will see how to deploy directly from
    our account on GitHub.'
