  - '[PAGE 25]


    Trygve Reenskaug introduced MVC into Smalltalk-76 while visiting Xerox Parc in
    the 1970s; In the 1980s, Jim Althoff et al implemented a version of MVC for the
    Smalltalk-80 class library. MVC was later expressed as a general concept in a
    1998 article. More info can be found at https://heim.ifi.uio.no/tryver/thems/mvc/index.html.


    SPA has attracted a large number of developers lately, but what is so special
    or controversial in this development model? What do these acronyms, HTML, MVC,
    MVP, and MVVM mean?


    The answer to these questions is very simple; we can say this is all about JavaScript!

    Wait a minute, JavaScript? You should be asking, "But what about HTML, CSS, server
    languages, and databases? We''ll understand it all and introduce what we call
    full-stack developer using MEAN. We will take one step at a time.


    Before we dive into the working of SPA, we need to learn about the MVC architecture.


    # Understanding the MVC/MVVM/MV* pattern


    MVC is a software architecture pattern that emerged in the 1980s, and it separates
    the visual representation of information from the user''s interaction.


    However, we are talking about the MVC pattern on the client side, for example,
    JavaScript running on the client side, to be more specific, the web browser. Note
    that the majority of SPAs transfer to a web browser all the MVC logic used on
    the server with languages such as Java, C#, and Ruby.


    We use JavaScript to model our application according to the standards of MVC on
    the client side and not on the server.


    Another very important aspect is to understand what represents each development
    model, take a look at the following:


    +   - Presentation Model (PM)

    - Model View Presenter (MVP)

    - Model View Controller (MVC)

    - Model View ViewModel (MVVM)


    Later in this chapter, we will see in more detail about these concepts. For now,
    let''s take a look at the first appearance of MVVM.'
  - '[PAGE 26]


    # Understanding Single Page Application


    In 2004, Martin Fowler published a small article about a design pattern called
    Presentation Model. The following is the pictorial representation of PM:


    | View | Presentation Model | Model |

    | --- | --- | --- |


    +   - The View interacts with the model to gather visual content.

    - The Presentation Model updates, queries and observes the model. Its also notifies
    the view of changes in the visual content.


    ![](img/76faac513e4fd5843aeb56a44cada4c9_26_0.png)


    Approximately one year later, in 2005, John Gossman, a Microsoft architect for
    Windows Foundation (WPF) and Silverlight, revealed a new pattern on his blog,
    this time named Model View ViewModel.


    > John Gossman''s original blog article can be found at http://blogs.msdn.com/b/johngossman/archive/2005/10/08/478683.aspx.


    MVVM is very similar to Presentation Model; both patterns have an abstraction
    of View''s state and behavior. (on the frontend, the view concept is what the
    client sees), which contains a View''s state and behavior. The difference between
    them is that the MVVM model is more standardized and has been used in Silverlight
    for many years.


    MVVM is based on MVC and MVP, which attempts to separate more clearly the development
    of User Interfaces (Ui/frontend) from that of the business logic and behavior
    in an application.


    You might be asking, "but what does this have to do with SPA?"


    > An awesome resource on the emergence of the MVVM model is available at http://msdn.microsoft.com/en-us/magazine/dd419663.aspx.'
  - '[PAGE 27]


    Nowadays, we can clearly see this type of implementation applied to some JavaScript
    frameworks such as Durandal.js, Kendo UI, Ember.js, AngularJS, and Knockout.js
