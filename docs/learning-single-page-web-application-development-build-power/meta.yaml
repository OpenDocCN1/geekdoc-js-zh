- img_proc: false
  md: 'A simple basic SPA structure consists of the following:


    +   - **Basic-folder-example [SPA]**: This folder is the root of our application
    and has our one main file, **index.html**.

    - **CSS**: This folder contains all stylesheets.

    - **images**: This folder contains all images.

    - **js**: This has all the subfolders and a file called **app.js** (our startup
    file).

    - **controllers folder**: This contains all controllers'' files, but we can name
    this as Collections or ViewModels depending on what kind of library or framework
    we will be using.

    - **models**: This folder contains all model files.

    - **views**: This contains all view files (only data, no HTML rendering here).

    - **libs**: This contains all third-party libraries such as jQuery, Handlebars,
    and Knockout.

    - **templates**: This folder has all script templates such as Handlebars, Underscore.
    Note that this folder contains all the templates we will use in our application.


