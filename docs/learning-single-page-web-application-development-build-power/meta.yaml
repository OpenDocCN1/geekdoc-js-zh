  md: "# Testing Angular SPA with Karma and Protractor\n\nIn this function, we initialize\
    \ some global variables. Note that we use the $ sign to set AngularJS features\
    \ (such as $httpBackend, $stateParams, and $location). The $resource augments\
    \ the response object with methods to update and delete the resource. If we were\
    \ to use the standard isEqual matcher, our tests would fail because the values\
    \ will not exactly match the responses. To solve this problem, we define a new\
    \ isEqualData jasmine matcher. When the isEqual matcher compares two objects,\
    \ it takes only object properties into account and ignores methods, as shown in\
    \ the following code:\n\n```\nbeforeEach(function () {\n  jasmine.addMatchers({\n\
    \    toEqualData: function(util, customEqualityTesters) {\n      return {\n  \
    \      compare: function(actual, expected) {\n          pass: angular.equals(actual,\
    \ expected)\n        }\n      };\n    }\n  });\n});\n```\n\n```\n// We can start\
    \ by loading the main application module\nbeforeEach(module\n(ApplicationConfiguration.applicationModuleName));\n\
    ```\n\n```\n// The Injector ignores leading and trailing underscores here\n(i.e.\
    \ _$httpBackend)\n// This allows us to inject a service but then attach it to\
    \ a variable\n// with the same name as the service.\nbeforeEach(function($controller,\
    \ $rootScope,\n$location_, $stateParams_, _$httpBackend) {\n  // Set a new global\
    \ scope\n  scope = $rootScope.new('');\n```\n\n```\n// Point global variables\
