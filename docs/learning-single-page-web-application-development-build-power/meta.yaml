  md: "# Starting with AngularJS\n\nGenerally, the whole structure of AngularJS applications\
    \ are structured in a directory called App, and there are many ways of using this\
    \ directory. For now, imagine that the application is growing over time and you\
    \ need to add more controllers in a single file called controllers.js and the\
    \ same for services, directives, and filters quickly; you will surely be in trouble.\n\
    \nNot to keep all controllers of an application in a single file, does not make\
    \ your team productive.\n\nSwitching back to angular-seed, the most important\
    \ file here and in almost all AngularJS applications is app.js, which is an alias\
    \ to application.js. Let's see its content:\n\n```\n'use strict';\n\n// Declare\
    \ level module which depends on filters, and services\nangular.module('MyApp',\
    \ [\n  'ngRoute',\n  'myApp.filters',\n  'myApp.services',\n  'myApp.directives',\n\
    \  'myApp.controllers'\n]);\n\nconfig(function($routeProvider, $routeProvider)\
    \ {\n  $routeProvider.when('/view1', {templateUrl: 'partials/partial1.nhtml',\
    \ controller: 'MyCtrl1'});\n  $routeProvider.when('/view2', {templateUrl: 'partials/partial2.nhtml',\
    \ controller: 'MyCtrl2'});\n  $routeProvider.otherwise({redirectTo: '/view1'});\n\
    });\n```\n\nHere's the heart of application. It is pretty simple and useful to\
    \ start, but not modular, and if your application grows too big, this file can\
    \ be a mess.\n\nA good way to modular your application is by using the following\
    \ technique: note that we free the modules of the application without any dependency:\n\
    \n```\n// Modules without dependencies, an empty Array.\nangular.module('UserModule',\
    \ []);\nangular.module('BandModule', []);\nangular.module('DashboardModule', []);\n\
    ```\n\n— 120 —"
