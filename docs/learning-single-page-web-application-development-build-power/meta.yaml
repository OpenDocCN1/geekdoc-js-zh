  md: '# Understanding Single Page Application


    In 2004, Martin Fowler published a small article about a design pattern called
    Presentation Model. The following is the pictorial representation of PM:


    | View | Presentation Model | Model |

    | --- | --- | --- |


    +   - The View interacts with the model to gather visual content.

    - The Presentation Model updates, queries and observes the model. Its also

    notifies the view of changes in the visual content.


    > You can see the original article here: http://martinfowler.com/eaaDev/PresentationModel.html


    Approximately one year later, in 2005, John Gossman, a Microsoft architect for
    Windows Foundation (WPF) and Silverlight, revealed a new pattern on his blog,
    this time named Model View ViewModel.


    > John Gossman''s original blog article can be found at http://blogs.msdn.com/b/johngossman/archive/2005/10/08/478683.aspx.


    MVVM is very similar to Presentation Model; both patterns have an abstraction
    of View''s state and behavior. On the frontend, the view concept is what the client
    sees), which contains a View''s state. The difference between them is that the
    MVVM model is more standardized and has been used in Silverlight for many years.


    MVVM is based on MVC and MVP, which attempts to separate more clearly the development
    of User Interfaces (Ui/frontend) from that of the business logic and behavior
    in an application.


    You might be asking, "but what does this have to do with SPA?"


    > An awesome resource on the emergence of the MVVM model is available at http://msdn.microsoft.com/en-us/magazine/dd419663.aspx.'
  merge: -1
