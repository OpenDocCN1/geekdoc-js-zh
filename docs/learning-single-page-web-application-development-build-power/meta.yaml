    \nvar Band = mongoose.model('Band', bandSchema);\n```\n\nThe last line of code\
    \ compiles the Band model using bandSchema as the structure. Mongoose also creates\
    \ a collection Band for these documents. You might notice that the Band model\
    \ is capitalized, when a model is compiled, it returns a constructor function\
    \ that will be used to create one or more instances of the model.\n\nThis model's\
    \ instances are the documents that will be persisted by MongoDB using the save\
    \ function. So, to create a new document, Band can be used, as it is easier than\
    \ we have defined the database. We just instantiate the Band model and save this\
    \ instance on the database, as shown in the following code:\n\n```\nvar slayer\
    \ = new Band({\n  name: \"Slayer\",\n  album: \"Show no Mercy\",\n  track: \"\
    10\",\n  year: 1984\n});\n\nslayer.save(function (err) {\n  if (err) return console.error(err);\n\
    \  console.dir(slayer);\n});\n```\n\nNote that we use a string instead of a number\
    \ in the track property. Mongoose will be responsible for converting the data\
    \ type specified in bandSchema."
