  md: "# Starting with AngularJS\n\nAlthough it is easy to start developing SPAs with\
    \ AngularJS, but over time and as your application grows, there will be tasks\
    \ that are more difficult to solve. So, it is very important to understand all\
    \ the concepts very well. Unlike other JavaScript frameworks, AngularJS adopts\
    \ a more connected approach to the HTML syntax, functioning as a kind of language\
    \ extension.\n\nWe consider these topics as core concepts for a good understanding\
    \ of the AngularJS framework: directives, scope, services, controllers, dependency\
    \ injection, and expressions. Even this seems a lot, but if if we take into account\
    \ the complexity of the framework. However, as this book is not an absolute guide\
    \ to AngularJS, we will only discuss here a few concepts that are considered fundamentals\
    \ to build SPAs. Once the concepts are understood, you will have the necessary\
    \ basics to move forward with the framework.\n\nThroughout this chapter, we will\
    \ be focusing on the following concepts:\n\n+   * The baseline application\n*\
    \ The AngularJS MVC pattern implementation\n  * Model\n  * View\n  * Controller\n\
    * Detailing directives, expressions, and scope\n* Two-way data binding and templates\n\
    * Understanding dependency injection\n* Services\n* Modules\n* Project organization\n\
    * Pattern implementation"
  merge: -1
  pgno: 121
- img_proc: false
  md: "# Starting with AngularJS\n\nAs said, AngularJS is a powerful tool to develop\
    \ SPAs and can also be considered as an MVC or MVVM framework; its flexibility\
    \ is so great that it suits our needs. Let's understand some concepts to help\
    \ us choose the better way.\n\n# Starting the baseline application\n\nAs with\
    \ any web application, we kick off with creating a basic page. Later, we will\
    \ discuss all the components that appear in the following example, by this time,\
    \ we focus on the basic initialization of ng application:\n\n```\n<html ng-app>\n\
    <head>\n  <title>Angular baseline</title>\n  <script>\n    src=\"https://cdn.cloudflare.com/ajax/libs/angular.js/1.20/angular.min.js\"\
    ></script>\n</head>\n<body>\n  <input type=\"text\" ng-model=\"name\">\n  <p>Hello:\
    \ {{ name }}</p>\n</body>\n</html>\n```\n\nBy declaring the ng-app property on\
    \ the html tag, we are initializing our application. It's the first of some new\
    \ properties that we will use. The entire framework revolves around these these\
    \ new statements.\n\nThe ng-app property informs our Document Object Model (DOM)\
    \ and HTML document are also an AngularJS document. This property can be used\
    \ in any element of the DOM. In many cases, only a single part of the HTML will\
    \ be an AngularJS application, as shown in the following example:\n\n```\n<html>\n\
    <head>\n  <title>Angular baseline</title>\n  <script>\n    src=\"https://cdn.cloudflare.com/ajax/libs/angular.js/1.20/angular.min.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"main\">\n    <div class=\"container\"\
    >\n      <div id=\"main-app\" ng-app=\"myAngularApp\">\n        <!--Application\
    \ content will be rendered here--\n      </div>\n    </div>\n  </div>\n</body>\n\
    ```"
  merge: -1
  pgno: 122
- img_proc: false
  md: "```\n<div>\n</div>\n<script src=\"path_to_JavaScript_files\"></script>\n</body>\n\
    </html>\n```\n\nFinally, the JavaScript files that are part of the project are\
    \ added to the end of the HTML page like the previous example. In a real application,\
    \ these files will be models, controllers, directives, and everything related\
    \ to the application.\n\n# # The AngularJS MVC pattern implementation\n\nAngularJS\
    \ pattern of software engineering and encourages loose coupling between presentation,\
    \ data, and logic components. However, in the AngularJS framework, we do not declare\
    \ the model as in other MVC libraries such as Ember.js and Backbone.js.\n\nIn\
    \ AngularJS, we declare the model within the controller, through use of $scope.\
    \ Let's check the MVC behavior inside AngularJS in the upcoming sections.\n\n\
    # # Model\n\nAngularJS Model can be considered as a JavaScript object or a primitive\
    \ JavaScript type such as string, number, boolean, or complex objects.\n\nSynthesizing\
    \ its definition, AngularJS Model is a JavaScript object inside controllers using\
    \ $scope. The properties and behaviors that represent the object can be accessed\
    \ by its respective View.\n\nLater, we will go deeper in the use of $scope; for\
    \ now, let's see a simple example:\n\n```\nfunction UserController($scope) {\n\
    \  // A simple JavaScript object to hold our Model\n  var user = {\n    // Properties,\
    \ add as many as you want\n    name: \"Fernando\",\n    age: \"25\"\n  }\n  $scope.user\
    \ = user\n}\n```"
  merge: -1
  pgno: 123
- img_proc: false
  md: "# Starting with AngularJS\n\nThe preceding snippet is based on pure JavaScript\
    \ object and is assigned to $scope.user, we can declare it directly as:\n\n```\n\
    function UserController($scope) {\n  $scope.user = {\n    // User properties,\
    \ add as many as you need\n    name: \"Fernando\",\nage: \"25\"\n  }\n}\n```\n\
    \nThere are several ways to declare objects within the controller, and you can\
    \ choose the way that suits you.\n\n# View\n\nImagine that View is what we have\
    \ in the browser; it is where the user interacts with our application, manipulating\
    \ DOM. This is done using AngularJS expressions. Expressions are a very practical\
    \ way to interact with the View (HTML) example:\n\n```\n<div ng-controller=\"\
    UserController\">\n  <h1>{{ user.name }}</h1>\n</div>\n```\n\nIts syntax is comprised\
    \ of double brackets and the name of the variable / property that we want to render.\
    \ There is another way to do the same, using ng-bind:\n\n```\n<div ng-controller=\"\
    UserController\">\n  <h1 ng-bind=\"user.name\"></h1>\n</div>\n```\n\nThe main\
    \ difference is if AngularJS takes to compile the application code, the user might\
    \ see the double brackets before the content. To avoid this type of behavior,\
    \ we can use the ng-cloak directive, applied to the body element on the HTML page,\
    \ as shown in the following code:\n\n```\n<body ng-cloak>\n```\n\nOtherwise, we\
    \ can use the ng-cloak directive inside any HTML element of the page as follows:\n\
    \n```\n<div ng-controller=\"BandController\" ng-cloak>\n<ul>\n  <li ng-repeat=\"\
    band in bands\">{{ band.name }} - {{ band.album }}</li>\n</ul>\n</div>\n```"
  merge: -1
  pgno: 124
- img_proc: false
  md: "# Chapter 5\n\nBy the use of two-way data binding of AngularJS, this expression\
    \ is bound to the\nproperty of our Controller to server.\n\n# Controller\n\nTaking\
    \ into consideration the definition of Controller in the MVC pattern, Controller\n\
    is where where we place all the application logic. However, AngularJS controllers\
    \ are\nlike classes in JavaScript, and here is where our AngularJS Model resides,\
    \ as we\nmentioned earlier.\n\nThe AngularJS controller concept is quite different\
    \ from other MVC libraries,\nwhere we can create models separately from controllers'\
    \ code, like in Backbone.js\\and Ember.js.\n\nLet's look at how it all relates.\
    \ For the following example, we will use all the\nJavaScript code in the same\
    \ file, but for a modular and scalable development,\nYou must organize each file\
    \ in its place:\n\n```\n<html>\n<head>\n  <title>Angular MVC Example</title>\n\
    </head>\n  <!-- Setup Angular App -->\n<body ng-app>\n  <!-- Setup User Controller\
    \ -->\n  <div ng-controller=\"UserController\">\n    <h1>{{ user.name }} - {{\
    \ user.age }}</h1>\n  </div>\n  <!-- Set Bind Controller -->\n  <div ng-controller=\"\
    BandController\">\n    <ul>\n      <li ng-repeat=\"band in bands\">{{ band.name\
    \ }} - {{ \n      band.album }}</li>\n    </ul>\n  </div>\n\n  <!-- Include Angular\
    \ -->\n  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.20/\n\
    \  angular.min.js\"></script>\n  <script>\n    // Set the controller with a basic\
    \ function\n    function UserController($scope) {\n      // A simple JavaScript\
    \ object to hold our Model\n      var user;\n      user = {\n```\n\n[111]"
  merge: -1
  pgno: 125
- img_proc: false
  md: "Starting with AngularJS\n\n```\n// User properties, add as many as you need\n\
    name: \"Fernando\",\nageage: \"25\"\n}\n\n$scope.user = user\n\nfunction BandController($scope)\
    \ {\n  // A simple JavaScript object to hold our Model\n  // using $scope\n  $scope.bands\
    \ = {\n    {name: \"Metallica\", album: \"Master of Puppets\"},\n    {name: \"\
    Slayer\", album: \"Seasons in the Abyss\"},\n    {name: \"Anthrax\", album: \"\
    Persistence of Time\"}\n  };\n}\n</script>\n</body>\n</html>\n```\n\nIn this example,\
    \ we can see something beyond what we talked about previously: ng-app, ng-controller,\
    \ and ng-repeat.\n\nNow, we'll see what this means in more detail.\n\n# Detailing\
    \ directives, expressions, and scope\n\nThe first thing we notice when we look\
    \ at the previous example is the presence of the ng-app tag; this is known as\
    \ directives, and in this specific example, it serves to tell AngularJS that all\
    \ code contained within the body tag is an AngularJS application, as we mentioned\
    \ before.\n\nAfter this, we have ng-controller; as the name mentions, we declare\
    \ that controller will act on a certain region of HTML, and ng-repeat is something\
    \ like a built-in loop over arrays. For simplicity, the tags, ng-app, ng-controller,\
    \ and ng-repeat, are the AngularJS directives; there are many others as well.\n\
    \nTo simplify, ng-attributes (such as ng-app, ng-bind, ng-show, and ng-hide) are\
    \ built-in directives of the framework; we can also create custom directives."
  merge: -1
  pgno: 126
- img_proc: false
  md: "> More information about Angular directives can be found at https://docs.angular.org/api/ng/directive.\n\
    \nDirectives serve to extend the grammar of HTML and are simple statements but\
    \ have powerful and flexible features. In addition to the existing directives,\
    \ we can create four types of directives:\n\n+   - Element directives\n- Attribute\
    \ directives\n- CSS class directives\n- Comment directives\n\nThe following are\
    \ the four ways to create a custom directive:\n\n| Restrict | Markup |\n|---|---|\n\
    | 'A' | <span ng-directivename></span> |\n| 'E' | <ng-directivename></ng-directivename>\
    \ |\n| 'C' | <span class=\"ng-directivename\"></span> |\n| 'M' | <!-- directive:\
    \ ng-directivename --> |\n\nThe base code for a custom directive is follows:\n\
    \n```\napp.directive('ngDirectivename', function() {\n  return {\n    restrict:\
    \ 'A',\n    // Doing your Directive code here\n  }\n});\n```\n\nNote that we created\
    \ an element directive with the keyword 'A' and invoke/use it in HTML as follows:\n\
    \n```\n<div ng-Directivename></div>\n```\n\nHere's an example in practice, a basic\
    \ element directive:\n\n```\nmyAngularApp = angular.module(\"myAngularApp\", []);\n\
    \nmyAngularApp.directive('div', function() {\n  var directive = {};\n\n// Restrict\
    \ directive to html elements\n```"
  merge: -1
  pgno: 127
- img_proc: false
  md: "Starting with AngularJS\n\n```\ndirective.restrict = 'E';\n```\n\n```\n// Set\
    \ a basic template\ndirective.template = \"My Angular directive: {{ someTextGoesHere}}\"\
    ;\n```\n\n```\nreturn directive;\n}}\n```\n\nThe first parameter to the directive()\
    \ function is the directive name. This name will use the HTML template to activate\
    \ the directive. The second parameter passed to the directive() function is a\
    \ factory function. This function returns the directive when invoked.\n\nThe directive.template\
    \ will replace the {{ someTextGoesHere }} expression for the controller property,\
    \ $scope.someTextGoesHere, as shown in the following:\n\n```\n<div ng-controller=\"\
    AngularController\">\n  <directivename>This will be replaced for the Controllers\
    \ $scope\n  <content></directivename>\n</div>\n```\n\n```\n<script>\nmyAngularApp\
