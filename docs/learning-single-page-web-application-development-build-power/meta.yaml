    # # Boilerplates and generators


    On a MEAN stack environment, our ecosystem is infinitely diverse, and we can find
    excellent alternatives to start the construction of our API. At hand, we have
    simple boilerplates to complex code generators that can be used with other tools
    in an integrated way, or even alone.


    Boilerplates are usually a group of tested code that provides the basic structure
    to the main goal, that is to create a foundation of a web project. Besides saving
    us from common tasks such as assembling the basic structure of the code and organizing
    the files, boilerplates already have a number of scripts to make life easier for
    the frontend.


    Let''s describe some alternatives that we consider as good starting points for
    the development of APIs with the Express framework, MongoDB database, Node server,
    and AngularJS for the frontend.


    Some more accentuated knowledge of JavaScript might be necessary for the complete
    understanding of the concepts covered here; so we will try to make them as clearly
    as possible.'
