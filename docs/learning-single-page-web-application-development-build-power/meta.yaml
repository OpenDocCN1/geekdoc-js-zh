  md: "# The Passport module\n\nSome things about the Passport module must be said;\
    \ it can be defined as a simple, unobtrusive authentication module. It is a powerful\
    \ middleware to use with Node; it is very flexible and also modular. It can also\
    \ adapt easily within applications that use the Express.\n\nIt has more than 140\
    \ alternative authentications and support session persistence; it is very lightweight\
    \ and extremely simple to be implemented. It provides us with all the necessary\
    \ structure for authentication, redirects, and validations, and hence it is possible\
    \ to use the username and password of social networks such as Facebook, Twitter,\
    \ and others.\n\nFollowing is a simple example of how to use local authentication:\n\
    \n```\nvar passport = require('passport');\nLocalStrategy = require('passport-local').Strategy,\n\
    User = require('mongoose').model('User');\n\nmodule.exports = function() {\n //\
    \ Use local strategy\npassport.use(new LocalStrategy({\n  username: 'username',\n\
    \  passwordField: 'password'\n}),\nfunction(username, password, done) {\n  User.findOne({\n\
    \    username: username\n  },\n  function(err, user) {\n    if (err) {\n     \
    \ return done(err);\n    }\n    if (!user) {\n      return done(null,\n      \
    \  message: 'Unknown user'\n      });\n    }\n    if (!user.authenticate(password))\
    \ {\n      return done(null,\n        message: 'Invalid password'\n      });\n\
    \    }\n    return done(null, user);\n  });\n}\n});\n});\n```"
