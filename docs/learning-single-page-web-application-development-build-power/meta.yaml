  md: '# The working of an API


    An API works through communication between different codes, thus defining specific
    behavior of certain objects on an interface. That is, the API will connect several
    functions on one website (such as search, images, news, authentications, and so
    on) to enable it to be used in other applications.


    Operating systems also have APIs, and they still have the same function. Windows,
    for example, has APIs such as the Win16 API, Win32 API, or Telephony API, in all
    its versions. When you run a program that involves some process of the operating
    system, it is likely that we make a connection with one or more Windows APIs.
    To clarify the concept of an API, we will give you some examples of how it works.


    On Windows, it works on an application that uses the system clock to display the
    same function within the program. It then associates a behavior to a given clock
    time in another application, for example, using the Time/Clock API from Windows
    to use the clock functionality on your own application.


    Another example, is when you use the Android SDK to build mobile applications.
    When you use the device GPS, you are interacting with the API (android.location)
    to display the user location on the map through another API, in this case, Google
    Maps API.


    The following is the API example:


    ![](bbox=[0.176, 0.523, 0.812, 0.831])'
  merge: -1
