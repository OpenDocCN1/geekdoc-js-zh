  md: 'Nowadays, we can clearly see this type of implementation applied to some JavaScript
    frameworks such as Durandal.js, Kendo UI, Ember.js, AngularJS, and Knockout.js
    among others. Each of these has its own way to implement it; however, they have
    the the same concept. The following is the pictorial representation of MVP:


    ![](bbox=[0.277, 0.227, 0.722, 0.396])


    +   - The View interacts with the model for simple data binding.

    - The View is updated by the presenter and through data binding.


    > Backbone.js was the first MVC library to become popular, and it is an excellent
    alternative for the development of SPAs. For more information on it, check http://backbonejs.org/.


    Almost all the frameworks that we have today follows the standard MV* pattern.
    Now, let''s review the concepts of MVVM:


    +   * Model: This represents domain-specific data or information that our application
    will be working with. Models hold information, but typically don''t handle behavior.
    They don''t format information or influence how data appears in the browser as
    this is their responsibility.

    * View: This is the only part of the application that the users actually interact
    with. It contains the data bindings and events, and is an interactive UI that
    represents the state of a ViewModel. View isn''t responsible for handling state—it
    keeps this in sync with ViewModel.

    * ViewModel: This can be considered as a specialized Controller that acts as a
    data converter. It changes Model information into View information, passing commands
    from View to Model.'
