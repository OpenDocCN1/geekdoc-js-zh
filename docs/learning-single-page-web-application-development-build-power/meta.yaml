  md: '# #1 Understanding Single Page Application


    Single Page Application (SPA) is the greatest sensation at the moment. We have
    countless JavaScript frameworks available to ease our work. We cannot deny that
    JavaScript, as just a scripting language, has become the technology evolution
    since the rise of the web, and of course, the browser''s support is much better
    than the old times. Now, we can use the JavaScript language on both sides, that
    is, from the frontend to the backend (Node.js) and also include databases with
    MongoDB (we will talk about them briefly in the next chapters). Now, we focus
    on understanding the MVC/MVVM pattern on SPA. We will cover the following topics:


    +   * Getting acquainted with SPAs

    * Understanding the working of SPAs

    * Understanding the MVC/MVVM/MV* pattern

    * Peculiarities between SPA and traditional web development

    * Choosing a library or framework

    * Introducing the MEAN stack

    * The available tools

    * It''s all about JavaScript

    * HTML, CSS, and the responsive way'
  merge: -1
  pgno: 23
- img_proc: false
  md: '# Getting acquainted with SPA


    SPA is a web application or website that fits on a single web page with the goal
    of providing a more lucid user experience and a rich interface. Also, only one
    page is not limited to one file; we can have many templates in different files.


    Such applications can vary from a small sample **create, read, update, and delete**
    (CRUD), like a to-do list, until it reaches a more complex level with countless
    views, libraries, templates, scripts, and validations.


    For a better example of a simple SPA, you can check out http://todmvc.com/; here,
    you can find a lot of information about many MVC frontend frameworks. The next
    paragraphs will show more about MVC on the client side.


    The main goal about how web application is to be able to update parts of an interface
    without sending or receiving a full-page request; this is perhaps the most interesting
    point about SPA.


    SPA''s popularity has been increasing in recent times, mainly because of its relative
    ease of development. This is because from the start, everything is done from the
    front-end of a web application using Ajax (to interacting with the server), HTML
    templates, a good MVC/MVVM framework, and of course, a lot of JavaScript.


    Surely, we have a plethora of JavaScript frameworks that greatly facilitate our
    life as a developer, but how do we choose one from all these options? Which is
    the best option? What about the learning curve?


    Throughout this chapter, we will understand the interaction models available between
    the most popular frameworks.


    Before we begin our journey on SPAs, let''s see the basic concept of the MVC/MVVM
    architecture.


    # Understanding the work of SPAs


    What we see in this new world of web applications is an analogy to what had formerly
    been in software development on the server side, such as **Model View Controller
    (MVC)** or **Model View Presenter (MVP)**. We will see **Model View ViewModel
    (MVVM)** in more detail in the next chapters.'
