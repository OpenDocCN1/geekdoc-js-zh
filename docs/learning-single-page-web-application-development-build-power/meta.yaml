  md: "# Starting with AngularJS\n\n```\nvar serverServiceInstance;\n...\nreturn serverServiceInstance;\n\
    ));\n```\n\nA.service() and .factory() function always have a return statement.\
    \ Being singleton only one instance of a specific service injector available in\
    \ the entire life of the AngularJS application. Other services are constant, value,\
    \ and provider; more about services can be found on the official documentation\
    \ at https://docs.angular.org/guide/services.\n\n# Modules in AngularJS\n\nIn\
    \ AngularJS, modules are structured to build highly scalable web applications.\
    \ We can create them and use them through the application.\n\nIt is very simple\
    \ to create and inject it in the application. From the AngularJS documentation,\
    \ define modules as:\n\n> Modules are a container for the different parts of your\
    \ app such as controllers, services, filters, directives, and so on.\nMore details\
    \ about modules, can be found at https://docs.angular.org/api/ng/type/angular.Module.\n\
    \nModules can contain a collection of other components/dependencies such as controllers,\
    \ services, directives, and others.\n\nThe simple form to create a module is as\
    \ follows:\n\n```\nangular.module(moduleName, [requires dependency]);\n```\n\n\
    The basic form to use a module is as follows:\n\n```\nangular.module('ModuleName');\n\
    ```\n\nLet's see a practical way to declare and instantiate a module and Controller:\n\
    \n```\nangular.module('User', [$scope']);\n.run(function($scope) {\n  $scope.user\
    \ = { name: 'Fernando' \n});\nangular.module('User').controller('UserController',\
    \ function () {\n  // Controller content here\n});\n```"
