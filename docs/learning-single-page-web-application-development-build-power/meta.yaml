  md: 'When it comes to web APIs, the functionality can be even greater. There are
    many services that provide their code, so that they can be used on other websites.
    However, the best example is the Facebook API. Other websites use this service
    within their pages, for instance a like button, share, or even authentication.


    > An API is a set of programming patterns and instructions to access a software
    application based on the Web.


    So, when you access a page of beer store in your town, you can log in with your
    Facebook account. This is accomplished through the API. Using it, software developers
    and web programmers can create beautiful programs and pages filled with content
