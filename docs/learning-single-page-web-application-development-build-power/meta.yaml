  md: '# Understanding Angular Views and Models


    In this chapter, we will see Angular in practice, covering all the concepts of
    the previous chapters and using good practice to create a scalable application.
    We will focus on modularization and refactor example application this time using
    a robust Yeoman generator for MEAN applications.


    At this point, you should already be comfortable with the creation of an API using
    Node, Express, and MongoDB and also with tools like Bower, Grunt, and Yeoman,
    then we create our sample application. The following topics are covered in this
    chapter:


    +   - Dissecting and understanding the MEAN.JS generator

    - Scaffolding the application

    - The application anatomy

    - Refactoring the API

    - Testing the speakers'' API routes


    # Dissecting and understanding the MEAN.JS generator


    On a MEAN stack environment, our ecosystem is infinitely diverse, and we can find
    excellent alternatives to start working with RESTful APIs. We have at our simple
    boilerplates to complex code generators that can be used with other tools in an
    integrated way, or even alone.'
