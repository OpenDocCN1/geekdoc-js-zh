  md: 'API with MongoDB and Node.js


    It is important to note that everything is still quite new when we talk about
    Node and all its ecosystems, and factors such as scalability, performance, and
    maintenance are still major risk factors. Being in mind that languages such as
    Ruby on Rails, Scala, and the Play framework have a higher reputation in building
    large and maintainable web applications, but without a doubt, Node and JavaScript
    will conquer your space very soon.


    That being said, we present some alternatives for the initial kickoff, but remember
    that our main focus is on SPA and not directly on MEAN stack.


    # Hackathon starter


    Hackathon is highly recommended for a quick start to develop with Node.js. This
    is because the boilerplate has the necessary characteristics to develop applications
    with the Express framework to build RESTful APIs, as it has no MVC/MVVM framework
    as the Bootstrap UI framework. Thus, you are free to choose the framework of your
    choice, and you will not need to refactor it to meet your needs.


    Other important characteristics are the use of the latest version of the Express
    framework, heavy use of Jade templates and some middleware such as Passport —
    Twitter, Facebook, APIs for LinkedIn, GitHub, Last.fm, Foursquare, and many more.


    They provide the necessary boilerplate code to start your projects very fast,
    and as we said before, it is very simple to install; just clone the Git source
    repository:


    ```

    git clone --depth=1 https://github.com/sahat/hackathon-starter.git

    project

    ```


    Run the NPM install command inside the project folder:


    ```

    npm install

    ```


    Then, start the Node server:


    ```

    node app.js

    ```'
