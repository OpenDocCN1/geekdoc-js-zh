    to solve a single problem. Often, they are fairly lightweight and have a very
    short learning curve.

    - Frameworks are more robust and sometimes heavy than simple libraries; they have
    a directory structure and a lot of concepts, conventions, and rules to follow.
    They have a long learning curve.


