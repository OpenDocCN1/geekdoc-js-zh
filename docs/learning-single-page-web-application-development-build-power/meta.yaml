  md: '# Choosing a library or framework


    Frameworks generally have a greater number of methods and functions than just
    a small library, and furthermore its work might become more complex as the application
    grows.


    We need to look at other important points as:


    +   - The community behind it: Often, there are active communities, and it is
    easy to find related stuff. However, obscure frameworks/libraries tend to have
    a small community behind them and a reduced number of online resources.

    - The frequency of updates: Outdated frameworks/libraries have a larger number
    of errors, and the lack of frequent updates lead to more problems than you can
    possibly have.

    - Learning curve: The higher the learning curve for a more tool, the development
    time of your project. In a corporate environment, this can be very costly in the
    delivery of your project. A low learning curve lets you become focused on building
    the application without having to worry about learning and solving problems at
    the same time.

    - Support to other libraries: This lets you remove and add things without breaking
    your current code. Here, you can easily replace a library or code snippet for
    another affecting the application.

    - Dependencies: This shows how many dependent files you need to include in your
    project so that everything works and how all dependencies consume resources and
    transfer bandwidth. Successful applications tend to grow steadily, and consequently
    you will need to add some more dependencies.

    - Modularity: Modular applications can be easily manipulated and scaled progressively.
    Modular systems have greater flexibility and reduce development costs. A framework
    that enables the use of modules is strongly recommended and not limited only to
    SPA but for all web applications.


    Choosing a framework is the first and the most important choice you will make
    in the planning stage of the application. For sure, you''ll want to choose the
    best framework or at least the most popular.


    But how to choose? Every day we have new options emerging from simple libraries,
    and we also have small plugins to complex frameworks to choose from; so, how to
    decide?'
  merge: -1
