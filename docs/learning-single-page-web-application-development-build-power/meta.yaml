- img_proc: false
  md: '# Understanding Angular Views and Models


    Boilerplates are usually a group of tested code and are modified to provide the
    basic structure to the main goal and create a foundation for a web application
    project. Besides saving us from common tasks such as assembling the basic structure
    of the code and organizing the files, boilerplates already has a number of scripts
    and snippets ready to go.


    Let''s describe an alternative that we consider as a good starting point for the
    development of RESTful APIs with the Express framework, MongoDB database, Node
    server, and AngularJS.


    # Differentiating MEAN.JS and MEAN.io


    MEAN.JS is the most popular boilerplate that is currently available. It is a fork
    of the original project MEAN.io


    However, there are some differences, MEAN.JS consists of better code organization
    and structure of directories. Furthermore, it follows a vertical modularization
    system, facilitating the organization of code in decoupled modules with a more
    complete and robust environment.


    The most common problem when we need to scale a SPA is undoubtedly the structure
    of directories that we adopt and how we manage all JavaScript files, using the
    MVC/MVVM approach.


    MEAN.JS provides the Angular framework with more flexibility to deal with the
    MVC approach for the frontend application, as we will see inside the public folder.
    In the modules approach, each module has their own structure, maintaining some
    conventions for controllers, services, views, config, and tests.


    > The public folder contains all the frontend files of application.


    This flexibility is very useful for team development and keeps the project structure
    well organized. Besides, we have the power of subgenerators for almost all kinds
    of tasks such as creating routes, controllers, services, and directives.


    # Scaffolding the application


    As already mentioned before, we use tools as possible that streamline our development
    process of web applications.'
