    \ folder and name it `config.js`.\n2. Place the following code in the `config.js`\
    \ file:\n```javascript\n// Database URL\nmodule.exports = {\n  // Uncomment to\
    \ connect MongoDB on Cloud\n  'uri': 'mongodb://username:password@kahana.mongodb.com:27017/node-api',\n\
    \  'url': 'localhost/conferenceDB'\n};\n```\n3. Open the `server.js` file and\
    \ add the database connection after the routes setup:\n```javascript\n// Database\
    \ configuration\nvar config = require('../config/config.js');\n// connect to our\
    \ database\nmongoose.connect(config.url);\n```\nAnother important step is to add\
    \ some friendly warning message if the connection fails right after `mongoose.connect(config.url)`:\n\
    4. Add the following code:\n```javascript\n// Check if MongoDB is running\nmongoose.connection.on('error',\
    \ function () {\n  console.error('MongoDB Connection Error. Make sure MongoDB\
