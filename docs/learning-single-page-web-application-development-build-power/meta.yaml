  md: "# Testing Angular SPA with Karma and Protractor\n\ndescribe() and it() are\
    \ two functions. The describe() function has two parameters: a string parameter\
    \ that receives the name of the test, and a function parameter that implements\
    \ the spec using the it() function. The expect() function is a matcher function\
    \ to get a result. The matcher function receives a boolean comparison between\
    \ the actual value and the expected value. Here is a simple example to understand\
    \ matcher with an expect() function:\n\n```\ndescribe(\"How matchers works:\"\
    , function() {\n  it(\"The toBe\" matcher compares with ====\", function() {\n\
    \    var number = 12;\n    var letter = a;\n\n    expect(number).toBe(letter);\n\
    \    expect(number).notToBe(null);\n  });\n});\n```\n\nMatcher is very useful;\
    \ we can create our own matcher if necessary.\n\nWe can use the describe() function\
    \ to group related specs to test an entire module like the following example:\n\
    \n```\ndescribe(\"Login test series\", function() {\n  it(\"*Try to login with\
    \ blank user*\", function() {\n    ...\n  });\n  it(\"*Try to login with wrong\
    \ user*\", function() {\n    ...\n    // More it() functions goes here.\n  });\n\
    });\n```\n\nThe Jasmine API is pretty easy to understand; it has several other\
    \ functions, but this baseline is enough to understand the following examples.\n\
