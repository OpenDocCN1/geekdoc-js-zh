  md: "# Two-way data binding and templates\n\nTwo-way data binding is one of the\
    \ most interesting parts of AngularJS. It is responsible for synchronizing changes\
    \ made to Model, and it manipulates DOM instantly. Without their help, it would\
    \ need to write many, lines of code to monitor changes to Model and return them\
    \ to update DOM.\n\nLet's see the following code, which illustrates the data binding:\n\
    \n```\n<div ng-controller=\"UserController\">\n  <h1>{{ user.name }} - {{ user.age\
    \ }}</h1>\n  <p ng-bind=\"user.name\"></p>\n  <p ng-bind=\"user.age\"></p>\n \
    \ <br>\n  <input type=\"text\" ng-model=\"user.name\">\n  <input type=\"text\"\
    \ ng-model=\"user.age\">\n</div>\n```\n\nJust before the hl tag, we used the expression\
    \ with double brackets, we can see two paragraphs with the ng-bind directive;\
    \ it does the same thing as the expression, but if the code for some reason take\
    \ a few seconds to render, the user can view the double brackets before AngularJS\
    \ takes control of the page.\n\n# Reusing templates\n\nAs we can see in the previous\
    \ example, AngularJS allows us to create templates; HTML blocks with expressions\
    \ and directives to manipulate DOM. We can reuse templates with the following\
    \ code:\n\n```\n<div ng-controller=\"BandController\">\n<ul>\n  <li ng-repeat=\"\
    band in bands\">{{ band.name }}</li>\n</ul>\n</div>\n```\n\n# Understanding dependency\
    \ injection\n\nDependency injection is a common software design pattern and widely\
    \ used in AngularJS; it is similar to what we have in the Express framework using\
    \ require(). You just need to add the services as parameters to controllers, directives,\
    \ or functions. Many of these items will depend on others to work. For example,\
    \ a controller request to the server will need the $http service, and this service\
    \ has to come from somewhere."
  merge: -1
  pgno: 130
- img_proc: false
  md: "To facilitate this configuration, AngularJS provides three ways to declare\
    \ dependencies:\n\n+   Directly using the parameters of a function, as we can\
    \ see in the following example:\n```javascript\nfunction UserController($scope,\
    \ $http, $resource,\n$userservice) {\n  var user;\n\n  $scope.user = {\n    name:\
    \ \"Fernando\",\n    age: \"25\"\n  }\n}\n```\n\n+   Using an array, as shown\
    \ here:\nUserController ('UserController', ['$scope','$http'] function($scope,\
    \ $http));\n\n+   Using the $inject property, as follows:\nUserController var\
    \ = function ($scope, $http) {...};\nUserController $inject = ['$scope','$http'];\n\
    user.module('UserController');\n\n> The best way is to use an array, which in\
    \ the case of compression/minify, prevents possible function damage due to character\
    \ replacement of variable names.\nYou can find more about dependency injection\
    \ at https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection.\n\
    \n# Services\n\nServices are often interpreted incorrectly. They can be easily\
    \ confused with Ajax requests that are used with some backend service via the\
    \ HTTP protocol. However, services are singleton, a function, or an object and\
    \ can be used to hold and share data, through controllers, directives, filters,\
    \ and other services. Also, you are free to create your own services; just register\
    \ the service's name and the service factory function, with an Angular module.\
    \ The service factory function creates the object or exposes it to the rest of\
    \ the AngularJS application.\n\n```\nvar userModule = angular.module('userModule',\
    \ []);\nuserModule.factory('server', function() {\n```"
