  md: '# 3 API with MongoDB and Node.js


    This chapter will focus directly on the code, so we can have the necessary understanding
    to build a solid foundation for our API. Our main aim is to discuss the techniques
    to build rich web applications, with the SPA approach.


    Application Programming Interface (API) is the set of programming standards that
    enables us to build applications. Their usage is not so evident to the user using
    the application. The API is the engine of the application; an interface that runs
    behind it all. While you might benefit from an application or website, your API
    can be connected to several other systems and applications. With APIs, applications
    talk to talk each other without user intervention.


    We will be covering the following topics in this chapter:


