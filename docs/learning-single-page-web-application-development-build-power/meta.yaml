    # # Hosting the project on GitHub


    Before we proceed with the deployment to the cloud, we need to review some important
    points in our sample application. As mentioned earlier, we need to host our source
    code on `http://github.com`. Since we already use Git as our version control system,
    uploading our code to the GitHub service is very simple.


    Git is a powerful version control system and has many GUI clients for Windows
    and Mac OS X. If you are on Mac OS X, we recommend the use of `https://mac.github.com/`
    and for Windows users `https://windows.github.com/`; both are free tools.


    In the following examples, we are using terminal; to have the Git commands available
    on terminal, you need to install Git on your system.'
