  md: '> You can find more about starting with GitHub at https://help.github.com/articles/create-a-repo/


    4. Now it''s time to configure the connection between Git and GitHub. To do this,
    open your Git shell application. Type the following command into the Git shell:


    ```

    git config --global user.name "YOUR NAME"

    git config --global user.email "YOUR EMAIL ADDRESS"

    ```


    Both commands'' servers inform GitHub who you are and print your name on each
    commit you made.


    5. The next step is to configure an SSH key between your computer and the GitHub
    repository. Type the following command into your Git shell:


    ```

    ssh-keygen -t rsa -C "your_email@example.com"

    ```


    6. Replace the default e-mail address with your own e-mail address and follow
    the instructions on the Git shell. Next, you will be asked to enter a passphrase.


    7. You will see something similar to the following result:


    ```

    Your identification has been saved in /c/Users/you/.ssh/id_rsa.

    # Your public key has been saved in /c/Users/you/.ssh/id_rsa.pub.

    # The key fingerprint is:

    # 01:f4:f3:ca:85:d6:17:a1:d7:f0:68:9d:f0:a2:db your_email@example.com

    ```


    8. Then add your new key to ssh-agent:


    ```

    ssh-agent -s

    ssh add ~/.ssh/id_rsa

    ```


    9. Now it is time to place the key on your GitHub account, so type the following
    command into the Git shell to copy the key:


    ```

    clip < ~/.ssh/id_rsa.pub

    ```


    10. Go back to your GitHub account and click on the settings tool to the right
    of your username.


    11. On the users side bar, click on SSH Keys and add the SSH keys.


    12. Paste your key inside the Key input field.

    With this step, we have finished setting up your computer and the GitHub account
    with secure SSH keys.'
