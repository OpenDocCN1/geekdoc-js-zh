  md: '# Node server, NPM, and middleware


    Node is a web server with JavaScript and the basic Node.js proposal is of high
    performance and scalable web applications, what does it really mean?


    In other server-side programming languages, such as Java, PHP, and .NET, each
    connection starts a new thread on the server potentially, and in general is accompanied
    by 2 MB of memory. On a server that has 8 GB of RAM, this defines the maximum
    number of concurrent connections to about 4,000 users. Now, imagine that your
    application is growing and every day gets more hits; you probably need more servers
    or even to invest in more hardware. This is the bottleneck of the whole architecture
    of web applications, the maximum number of concurrent I/O connections a server
    can handle and keep stable. Node.js solves this by changing how a connection is
    made to the server. Instead of starting a new thread for each connection, it creates
    a process that does not require a memory block to accompany it. It does not blocking
    calls directly to I/O.


    Node servers can support thousands of simultaneous connections. It does not allocate
    one thread per connection, but uses a process per connection, creating only the
    memory that is required for each connection. It achieves its goals by providing
    highly scalable servers.


    Actually, Node changes the panorama of the server and the bottleneck of the system
    from the maximum number of connections to the maximum traffic capacity of the
    system. It also features a powerful package manager called NPM (Node Package Manager);
    though it is possible to install and update packages, you can create your own
    packages and publish them online for the whole community. It is also worth noting
    that many third-party tools, such as Grunt, Bower, and Yeoman use others, Node
    to install packages.


    NPM is a command-line utility that interacts with an open source repository of
    projects for Node.js; it is possible to install and manage dependencies


    The NPM repository has more than 76,000 packages, all of which are open source
    libraries, and many are added every day. These applications can be found through
    the search portal of NPM. You can search and discover a lot of packages at the
    official repository at https://www.npmjs.org/ You can find out more about Node.js
    at http://nodejs.org/


    Another important use of NPM is to install its own modules and dependencies. When
    you have a Node project with a file named package.json, you can run the `npm install`
    command in the root folder of your project and NPM will install all dependencies
    listed in package.json.'
