  md: '# MongoDB connection with Mongoose


    Mongoose is a Node library solution that provides a schema-based model to the
    data of our application. It has type conversion, validation, creating queries,
    and business logic system to handle, and thanks to MongoDB, it also has a flexible
    schema.


    Mongoose provides a mapping of objects similar to MongoDB Object Relational Mapping
    (ORM) or Object Data Mapping (ODM) in the case of Mongoose. This means that Mongoose
    translates data from the database to JavaScript objects that can be used by our
    application. It was built to work in an asynchronous environment.


    Furthermore, as we saw earlier, we can easily install using NPM with the simple
    command: npm install mongoose. Mongoose will be available to the entire application;
    you will need add it to the application file, as shown in the following example:


    ```

    var mongoose = require(''mongoose''); mongoose.connect(''mongodb://localhost/test/'');


    var db = mongoose.connection;

    db.on(''error'', console.error.bind(console, ''connection error:''));

    db.once(''open'', function () { // Hello Mongoose });

    ```


    Note that our string connection points to http://localhost/originalname and the
    name after the schema is our database name. In a real-world application or on
    a production environment, we need to pass the username and password for the database
    user.


    # Mongoose schemas and models


    All we need is a schema and a model for us to work with the data to be persisted
    on our MongoDB database. Schemas define the structure of documents within a collection
    and models are used to create instances of data to be stored in collections.


    The schema types are:


    +   * String

    * Number

    * Date

    * Buffer

    * Boolean

    * Mixed

    * ObjectId

    * Array'
  merge: -1
