  md: "# Understanding Single Page Application\n\nViews and ViewModels communicate\
    \ using data-bindings and events. The following is the pictorial representation\
    \ of how MVVM works:\n\n![](bbox=[0.2737, 0.1965, 0.7262, 0.3485])\n\n+   - The\
    \ View interacts with the model for data binding.\n- The Model hold data information.\n\
    \nFor a better understanding of MVVM, let's take a look at the two-way data binding,\
    \ which is the core concept and one of the most important pieces in SPA. Due to\
    \ data binding, we can update the interface with the changes made in the model\
    \ and vice versa.\n\nThe concept of data binding is simplified as the process\
    \ that establishes a connection between the application UI and business logic.\
    \ It can also mean that when data is changed, the underlying data will reflect\
    \ that change.\n\nLet's see a more practical example in analogy to a JavaScript\
    \ object.\n\nTwo-way data binding refers to the ability to bind changes to an\
    \ object's properties to changes in the UI and vice versa. In other words, if\
    \ we have a user object with the `name` property, whenever we assign a new value\
    \ to `user.name`, the UI should show the new name. In the same way, if the UI\
    \ includes an input field for the user's name, entering a value should change\
    \ the `name` property of the user object variable to be changed accordingly:\n\
    \n```\nvar user = {\n  name : \"fernando\",\n  age : 25\n}\n```\n\nMVP and MVVM\
    \ are derivatives of MVC. The key difference between both is the dependencies\
    \ each layer has on the other layers, as well as how tightly bound they are with\
    \ regard to each other."
