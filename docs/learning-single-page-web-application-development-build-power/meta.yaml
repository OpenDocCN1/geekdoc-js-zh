    \ an argument to another function using function pointers. For example, it tells\
    \ a function to perform some task and when finished with this task, perform another\
    \ task.\n\n# The event loop\n\nAnother important point to mastering Node.js is\
    \ the event loop. Any developer familiar with jQuery used to handle callbacks\
    \ functions, usually triggered after the user performs some task, as a click on\
    \ an accordion component or a slideshow or a simple button. However, in Node.js,\
    \ the event loop starts when an application starts. Functions have callbacks to\
    \ other functions and the event loop ends when the last callback is performed,\
    \ as shown in the following figure:\n\n![](bbox=[0.223, 0.396, 0.772, 0.638])\n\
    \nThe event loop is always there and keeps checking whether the functions are\
    \ explicitly finished; otherwise it keeps the program going and the actions asynchronous.\
    \ Let's take a look at a very simple and common example to create an HTTP server:\n\
    \n```\nvar http = require('http');\nhttp.createServer(function (req, res) {\n\
    \  res.writeHead(200, {'Content-Type': 'text/plain'});\n  res.end('Hello World\\\
    n');\n}).listen(3000, \"127.0.0.1\");\nconsole.log('Server running at http://127.0.0.1:3000/');\n\
    ```"
