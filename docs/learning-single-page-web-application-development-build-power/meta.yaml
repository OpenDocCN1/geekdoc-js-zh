  md: "Later in this chapter, we will add content to EJS templates; for now, let's\
    \ use a very useful tool called the Bower dependency manager.\n\n# Bower leading\
    \ frontend dependencies\n\nBower will take care of all of our frontend dependencies.\
    \ Of course, it is simpler to just add the CSS and image files directly in the\
    \ public folder, but we need a scalable application, right? Is there nothing better\
    \ than using Bower to manage frontend dependencies. To install the dependencies,\
    \ we will perform the following steps:\n\n+   1. Go to the root folder and create\
    \ a new file named bower.json.\n2. Create another file named .bowerrc with the\
    \ following code:\n```n{\n  \"directory\": \"public/bower_components\"\n}\n```\n\
    The behavior of bower.json is very similar to package.json and both use the it\
    \ command to create the package file. We skip this step, and add your dependencies\
    \ directly into the file.\n3. Place the following code in the bower.json file:\n\
    ```n{\n  \"name\": \"conference-api\",\n  \"version\": \"0.0.1\",\n  \"dependencies\"\
    : {\n    \"purecss\": \"~0.5.0\"\n  }\n}\n```\n4. Open your terminal and type\
    \ the following command:\n```\nbower install\n```"
