    \ Part 6: Adding HTML Events to the Registration Form\n\nThroughout the course,\
    \ you will build a desktop and a mobile version of a website. The website should\
    \ be about one of your hobbies or interests. In this unit, you will enhance the\
    \ registration page to the website. The registration page should be implemented\
    \ as a form and should provide the following features and interactions by Javascript:\n\
    \n- Create a button that can change the color or image of the background.\n- A\
    \ reset button – when this button is clicked, all form data will be cleared.\n\
    - When all form data is clear, set the focus back to the first form field.\n-\
    \ Pop up an alert box when the user clicks on any required form field. The alert\
    \ box will give an example of the required data and its format.\n- Create a help\
    \ icon (something like a question mark icon). When the user rests the mouse over\
    \ it, some help reference (for instance an example of the required data and its\
    \ format) will display. When the user moves the mouse off the icon, the help information\
    \ will be hidden.\n- Test out the website by at least two mobile devices (use\
    \ the Opera Mobile Emulator) and take screenshots for submission.\n\nUse the Internet\
    \ and the ITT Tech Virtual Library to search for help for JavaScript and HTML\
    \ DOM.\n\nTurn in the HTML page by the end of this unit. Submit your Word document\
    \ containing all required screen shots and your Web page.\n\n## Lab 7-1: Create\
    \ a Web Page that Uses Progressive Enhancement\n\n### Purpose\n\nDuring this lab,\
    \ you will create and test a Web page that uses progressive enhancement to support\
    \ multiple devices.\n\nCreate a Microsoft Word document to answers questions and\
    \ place any required screen shots there. You will turn in the Word document at\
    \ the completion of the lab, along with your Web page.\n\n### Objectives\n\n-\
    \ Explain the use of progressive enhancement.\n- Use media queries to support\
    \ various devices.\n- Use mobile meta tags to optimize a Web page for mobile.\n\
    \n### How It Fits In\n\nWith the proliferation of mobile devices with different\
    \ browser capabilities and screen sizes, Web developers must include code in their\
    \ Web pages to ensure that the Web page renders correctly on multiple devices.\
    \ Media queries and mobile meta tags help a Web developer create a mobile-friendly\
    \ Web page.\n\n**Estimated Completion Time: 70 minutes**\n\n### Task 1: Create\
    \ a WebPage Optimized for a Desktop or Laptop Device\n\n1. Launch VMware Player.\n\
    2. Start the ITT-Lab virtual machine.\n3. Open HTML-Kit.\n    a. Click **Start\
