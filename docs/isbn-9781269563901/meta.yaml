    \n<script>\n    var c=document.getElementById(\"myCanvas\");\n    var ctx=c.getContext(\"\
    2d\");\n\n    // Create gradient\n    var grd=ctx.createLinearGradient(0,0,400,0);\n\
    \    grd.addColorStop(0,\"yellow\");\n    grd.addColorStop(1,\"black\");\n\n \
    \   // Fill with gradient\n    ctx.fillStyle=grd;\n    ctx.fillRect(10,10,350,80);\n\
    </script>\n```\n\na. What is the value of gradient position?\n\n5. Preview in\
    \ the browser window to see a linear gradient color on a canvas.\n\n(Note: This\
    \ Web page will only work for IE 9 or later, preview it using Google Chrome or\
