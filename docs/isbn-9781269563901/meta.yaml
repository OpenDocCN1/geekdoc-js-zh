    \n![](img/bc0cefd7553b83cd38368dde4d013d76_139_0.png)\n\n8. Capture a screen shot\
    \ for submission and save the Web page.\n\nSubmit your Word document containing\
    \ all required screen shots and your Web page.\n\n# Lab 9-2: Program a Mobile\
    \ Web Page Using jQuery Mobile\n\nPurpose\n\nDuring this lab, you will create\
    \ and test a mobile Web page that uses jQuery Mobile.\n\nCreate a Microsoft Word\
    \ document and place all required screen shots there, which you will turn in at\
    \ the completion of the lab.\n\n## Objectives\n\n- Use jQuery Mobile to create\
    \ a Web page.\n- Use the mobile initialization event.\n\n## How It Fits In\n\n\
    jQuery Mobile is an HTML5 UI framework designed for creating sites and apps for\
    \ mobile devices. In this lab, you will study how to install and test a mobile\
    \ website that uses jQuery Mobile.\n\n**Estimated Completion Time: 40 minutes**\n\
    \n## Task 1: Install and Test the jQuery Mobile Framework\n\n1. To download the\
    \ jQuery Mobile library, perform the following steps:\n\n   b. Enable an Internet\
    \ connection from your virtual machine.\n\n   i. Click **Player | Manage | Virtual\
