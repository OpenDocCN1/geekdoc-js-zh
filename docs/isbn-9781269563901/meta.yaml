    \ Lab 3-1: Compare Fixed, Liquid, and Hybrid Layouts\n\n### Purpose\n\nDuring\
    \ this lab, you will create an HTML page and define CSS styles to apply fixed,\
    \ liquid, and hybrid layouts to the page.\n\nIn this lab, you will be asked to\
    \ answer several questions in a Microsoft Word document, which you will turn in\
    \ at the completion of the lab.\n\n### Objectives\n\n- Create a fixed-layout Web\
    \ page using CSS.\n- Create a hybrid Web page using CSS.\n\n### How It Fits In\n\
    \nBuilding a Web page that can be displayed on multiple devices and that displays\
    \ correctly as the user resizes the browser window is a challenging task. In this\
    \ lab, you study to create a fixed-layout Web page using CSS, as well as a hybrid\
    \ layout. You compare the difference in how the content is displayed when the\
    \ browser window is resized.\n\n**Estimated Completion Time: 50 minutes**\n\n\
    ### Task 1: Create a Web Page that Uses a Fixed Layout\n\n- 1. Launch VMware player.\n\
    2. Start your ITT-Lab virtual machine.\n3. Copy the Lab3starter.zip file to the\
    \ SD1340 folder on the virtual machine and extract the files.\n4. Launch HTML-Kit.\n\
    5. Open Lab3-1starter.htm.\n6. Review the markup.\n7. View Lab3-1starter.htm in\
    \ the default browser.\n8. How is the information displayed?\n9. Create a new\
    \ style sheet.\n   a. Click File | New.\n   b. Click the Style Sheets tab.\n \
    \  c. Choose Blank Style Sheet and click OK.\n   d. Save the stylesheet as nn3-1fixed.css.\n\
