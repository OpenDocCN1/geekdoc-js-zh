    \n   v. Save the jquery.mobile-1.3.1.zip to the SD1340 folder.\n\n   vi. Unzip\
    \ the file and ensure the following 3 items are in the SD1340 folder:\n\n   1.\
    \ jquery.mobile-1.3.1.min.js file\n   2. jquery.mobile-1.3.1.min.css file\n  \
    \ 3. images folder\n\n2. Change your virtual machine settings back to Host-Only.\n\
    \n![](img/bc0cefd7553b83cd38368dde4d013d76_142_0.png)\n\n3. Click **File | New\
    \ Document** to create a new document called *nnLab9-2-1.html* and save it to\
    \ the SD1340 folder.\n\n4. Change the DOCTYPE to specify that you are using HTML\
    \ 5.\n\n5. Change the `<title>` to My First jQuery Mobile Web Page.\n\n6. Add\
    \ the following HTML code within the `<head>` block:\n\n```html\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"jquery-1.10.1.min.js\"\
    ></script>\n<script src=\"jquery.mobile-1.3.1.min.js\"></script>\n<link rel=\"\
    stylesheet\" href=\"jquery.mobile-1.3.1.min.css\" />\n```\n\n7. Add the following\
    \ HTML codes within the `<body>` block:\n\n```html\n<div data-role=\"page\">\n\
    \  <div data-role=\"header\" data-theme=\"b\">\n    <h1>My Title</h1>\n  </div>\n\
    \  <div data-role=\"content\" data-theme=\"b\">\n    <p>Hello World 1</p>\n  \
    \  <p>Hello World 2</p>\n    <p>Hello World 3</p>\n```"
