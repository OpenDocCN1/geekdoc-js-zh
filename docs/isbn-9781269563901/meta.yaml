    PEARSON\n\nISBN 10: 1-269-56390-4\nISBN 13: 978-1-269-56390-1\n\n## About the\
    \ Authors\n\nRachelle Reese has been writing programming and database development\
    \ courses for nearly 20 years. She is an animal lover who lives on a farm with\
    \ her husband. She is also the co-author of the Dime Store Novel urban fantasy\
    \ series and two short story collections: Bones of the Woods and Mind of a Mad\
    \ Man.\n\nDamian Lai has been teaching computer and math courses for 20 years\
    \ at ITT Technical Institute Sylmar and California State University Los Angeles.\
    \ Besides writing courseware for programming and database development for 10 years,\
    \ he is also a Java developer at Wilshire Associates since 1997. Currently, he\
    \ is living in Los Angeles with his wife, Angela, and 2 sons, Jeff and Kobe.\n\
    \n## Acknowledgements\n\nRachelle Reese -- I'd like to thank everyone who put\
    \ their heads together with mine to create this manual. It's been an adventure.\n\
    \nDamian Lai -- I would like to thank Rachelle Reese and the Pearson team for\
    \ all their support and assistance to accomplish this manual. It is a very challenging\
    \ but enjoyable project.\n\n## Introduction\n\nThe labs in this manual are designed\
    \ to give you practice working with HTML5, CSS, JavaScript and jQuery. The labs\
    \ were designed to be completed on the ITT-Lab virtual machine. To run the virtual\
    \ machine, you will need a computer that has VMware Player 5.01 (or later). VMware\
    \ Player can be downloaded free from http://www.vmware.com. Lab 1.1 explains how\
    \ to copy and open the virtual machine.\n\nOur aim is to not only provide you\
    \ with information about the field you are entering, but also to entice you to\
    \ explore the many options available to you. Mobile web development is a dynamic\
    \ environment. It's an exciting world where you can always expect new and better\
    \ things to emerge. Web development is an area where you can express yourself\
    \ creatively as well as using your technical skills. As you work through the labs,\
    \ let your curiosity propel you. Search out more information, experiment by changing\
    \ a line of code to see what happens, create your own project and try out something\
    \ new. Programmers can learn a lot by playing -- believe it or not.\n\n## Table\
    \ of Contents\n\n- Table of Contents ........................................................................................3\n\
