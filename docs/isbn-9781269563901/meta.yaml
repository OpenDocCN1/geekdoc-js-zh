    \n## How It Fits In\n\nHTML5 has new input features for better input control and\
    \ validation. In this lab, you will study how to use the HTML5 form elements.\n\
    \n## Estimated Completion Time: 40 minutes\n\n## Task 1: Program a Web Page that\
    \ Uses a datetime-local Type for User Input\n\n1. Click **File** | **New Document**\
