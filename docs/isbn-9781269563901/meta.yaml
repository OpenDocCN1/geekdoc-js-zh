  md: '# Course Project Part 6: Adding HTML Events to the Registration Form


    Throughout the course, you will build a desktop and a mobile version of a website.
    The website should be about one of your hobbies or interests. In this unit, you
    will enhance the registration page to the website. The registration page should
    be implemented as a form and should provide the following features and interactions
    by Javascript:


    +   - Create a button that can change the color or image of the background.


    +   - A reset button – when this button is clicked, all form data will be cleared.


    +   - When all form data is clear, set the focus back to the first form field.


    +   - Pop up an alert box when the user clicks on any required form field. The
    alert box will give an example of the required data and its format.


    +   - Create a help icon (something like a question mark icon). When the user
    rests the mouse over it, some help reference (for instance an example of the required
    data and its format) will display. When the user moves the mouse off the icon,
    the help information will be hidden.


    +   - Test out the website by at least two mobile devices (use the Opera Mobile
    Emulator) and take screenshots for submission.


    Use the Internet and the ITT Tech Virtual Library to search for help for JavaScript
    and HTML DOM.


    Turn in the HTML page by the end of this unit. Submit your Word document containing
    all required screen shots and your Web page.'
  merge: -1
  pgno: 101
