    \n所有商标、服务标志、注册商标和注册服务标志均为其各自所有者的财产，仅用于识别目的。\n\nPearson Learning Solutions, 501\
    \ Boylston Street, Suite 900, Boston, MA 02116\nA Pearson Education Company\n\
    www.pearsoned.com\n\n印刷于美国\n\n4 5 6 7 8 9 10 V0ZN 17 16 15 14\n\n000200010271805122\n\
    \nJA\n\nPEARSON\n\nISBN 10: 1-269-56390-4\nISBN 13: 978-1-269-56390-1\n\n## 关于作者\n\
    \nRachelle Reese 近20年来一直从事编程和数据库开发课程的编写工作。她是一位动物爱好者，与丈夫住在农场。她还是 Dime Store Novel\
    \ 都市奇幻系列小说的合著者，并出版了两部短篇小说集：《树林之骨》和《疯子之心》。\n\nDamian Lai 在 ITT 技术学院 Sylmar 分校和加州州立大学洛杉矶分校任教计算机和数学课程已有20年。除了从事编程和数据库开发课件编写10年外，他自1997年起还在\
    \ Wilshire Associates 担任 Java 开发人员。目前，他与妻子 Angela 和两个儿子 Jeff 和 Kobe 一起住在洛杉矶。\n\
    \n## 致谢\n\nRachelle Reese -- 我要感谢所有与我集思广益、共同编写本手册的人。这是一次充满挑战的冒险。\n\nDamian Lai\
    \ -- 我要感谢 Rachelle Reese 和 Pearson 团队在完成本手册过程中给予的所有支持和帮助。这是一个非常有挑战性但也很愉快的项目。\n\
    \n## 简介\n\n本手册中的实验旨在让你练习使用 HTML5、CSS、JavaScript 和 jQuery。这些实验被设计为在 ITT-Lab 虚拟机上完成。要运行虚拟机，你需要一台安装了\
    \ VMware Player 5.01（或更高版本）的计算机。VMware Player 可从 http://www.vmware.com 免费下载。实验\
    \ 1.1 解释了如何复制和打开虚拟机。\n\n我们的目标不仅是为你提供关于你所进入领域的信息，还要激发你探索对你而言可用的许多选择。移动网络开发是一个充满活力的环境。这是一个令人兴奋的世界，你总能期待新事物和更好事物的出现。网络开发是一个可以让你创造性地表达自己，同时运用技术技能的领域。当你完成这些实验时，让你的好奇心推动你前进。搜索更多信息，通过修改一行代码来实验看看会发生什么，创建你自己的项目并尝试新事物。程序员可以通过玩耍学到很多东西——信不信由你。\n\
