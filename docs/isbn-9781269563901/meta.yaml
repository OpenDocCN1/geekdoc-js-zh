    \ 文件夹中：\n\n   1. jquery.mobile-1.3.1.min.js 文件\n   2. jquery.mobile-1.3.1.min.css\
    \ 文件\n   3. images 文件夹\n\n2. 将虚拟机设置改回仅主机模式。\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_142_0.png)\n\
    \n3. 点击**文件 | 新建文档**创建一个名为 *nnLab9-2-1.html* 的新文档，并将其保存到 SD1340 文件夹。\n\n4. 更改\
    \ DOCTYPE 以指定你使用的是 HTML 5。\n\n5. 将 `<title>` 更改为 My First jQuery Mobile Web Page。\n\
    \n6. 在 `<head>` 块中添加以下 HTML 代码：\n\n```html\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n<script src=\"jquery-1.10.1.min.js\"></script>\n\
    <script src=\"jquery.mobile-1.3.1.min.js\"></script>\n<link rel=\"stylesheet\"\
