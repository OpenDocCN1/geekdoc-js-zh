    \n7. Capture a screen shot for submission and save the Web page.\n\nSubmit your\
    \ Word document containing all required screen shots. Also submit your Web page.\n\
    \n## Lab 8-2: Program a Web Page Using the HTML5 Form Elements\n\n## Purpose\n\
    \nDuring this lab, you will create and test a Web page with HTML5 form elements.\n\
    \nCreate a Microsoft Word document and place all required screen shots there,\
