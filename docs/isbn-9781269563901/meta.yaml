  md: "# # Lab 1-2: Create a Web Page Using HTML5\n\n# ## Purpose\n\nIn this lab,\
    \ you will create and test a Web page that uses HTML 5 tags.\n\nDuring this lab,\
    \ you will be asked to answer several in a Microsoft Word document. You will turn\
    \ in the Word document at the completion of the lab.\n\n# ## Objectives\n\n+ \
    \  - Identify differences among HTML4, XHTML, and HTML5.\n- Structure content\
    \ on a Web page using HTML5 tags.\n\n# ## How It Fits In\n\nThe HTML5 sectioning\
    \ tags allow you to organize the content of your Web page in a more meaningfully\
    \ way than in XHTML and HTML4. By learning how to use these tags, you can more\
    \ easily apply CSS styles to parts of the page based on their contextual meaning.\
    \ The lab also introduces you to methods of researching which browsers support\
    \ various HTML5 functionality. When building websites it is essential that you\
    \ understand how it will be displayed by different browsers.\n\n# **Estimated\
    \ Completion Time: 65 minutes**\n\n# ## Task 1: Create a Web Page Using HTML5\
    \ tags\n\n+   1. Launch VMware Player.\n2. Start the ITT-Lab virtual machine.\n\
    3. Install HTML-Kit.\n   a. Enable an Internet connection from your virtual machine.\n\
    \      i. Click **Player | Manage | Virtual Machine Settings**.\n      ii. Select\
    \ **Network Adapter**.\n      iii. Select **Bridged** as shown below."
  merge: -1
  pgno: 25
