    \n![](img/bc0cefd7553b83cd38368dde4d013d76_137_1.png)\n\n7. Capture a screen shot\
    \ for submission and save the Web page.\n\n## Task 5: Add an Animated Effect to\
    \ a Web Page Using jQuery\n\n1. Click **File | New Document** to create a new\
    \ document called *nnLab9-1-5.html* and save it to the SD1340 folder.\n\n2. Change\
    \ the DOCTYPE to specify that you are using HTML 5.\n\n3. Change the `<title>`\
    \ to Animated Effects.\n\n4. Add the following code within the `<head>` block:\n\
    \n```html\n<script src=\"jquery-1.10.1.min.js\"></script>\n\n<script>\n$(document).ready(function(){\n\
    \  $(\"button#demo\").click(function(){\n    $(\"div#demo\").animate({left:\"\
    300px\",opacity:\"0.5\"}, \"slow\");\n    $(\"div#demo\").animate({fontSize:\"\
    4em\"}, \"slow\");\n  });\n});\n</script>\n```\n\n5. Add the following code within\
    \ the `<body>` block:\n\n```html\n<button id=\"demo\">Start Animation</button><br><br>\n\
