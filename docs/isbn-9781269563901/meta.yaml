    \ 文档，并将所有必需的屏幕截图放在其中，在实验完成后提交。\n\n## 目标\n\n- 使用 jQuery Mobile 创建网页。\n- 使用移动初始化事件。\n\
    \n## 如何融入\n\njQuery Mobile 是一个专为移动设备创建网站和应用程序而设计的 HTML5 UI 框架。在本实验中，你将学习如何安装和测试使用\
    \ jQuery Mobile 的移动网站。\n\n**预计完成时间：40 分钟**\n\n## 任务 1：安装并测试 jQuery Mobile 框架\n\
