    \n7. Capture a screen shot for submission and save the Web page.\n\n## Task 3:\
    \ Program a Web Page with Fade-In and Fade-Out Effects Using jQuery\n\n1. Click\
    \ **File | New Document** to create a new document called *nnLab9-1-3.html* and\
    \ save it to the SD1340 folder.\n\n2. Change the DOCTYPE to specify that you are\
