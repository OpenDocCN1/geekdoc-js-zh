    \ 154\nCourse Project Part 10: Test and Finalize Your Website ..................................................................................\
    \ 155\n\n## Lab 1-1: Configure ITT-Lab\n\n## Purpose\n\nIn this lab, you will\
    \ prepare the ITT-Lab virtual machine for use in upcoming labs. You will also\
    \ explore how to use VMware Player and take a brief tour of the ITT-Lab virtual\
    \ machine. Additionally, you will put the virtual machine on your USB external\
    \ hard drive, which will allow you to use it on any computer running VMware Player\
    \ 5. You can download VMware Player 5 free at:\nhttps://my.vmware.com/web/vmware/free-desktop_end_user_computing/vmware_player/5_0\n\
    \nIn this lab, you will be asked to answer several in a Microsoft Word document.\
    \ You will turn in the Word document at the completion of the lab.\n\n## Objectives\n\
    \n- Demonstrate how to launch, pause, and start the ITT-Lab virtual machine.\n\
    - Demonstrate how to copy files to and from the ITT-Lab virtual machine.\n\n##\
    \ How It Fits In\n\nYou will use the ITT-Lab virtual machine to complete all the\
    \ labs in this course.\n\n## Estimated Completion Time: 35 minutes\n\n## Task\
    \ 1: Learn about Your Host Machine's Resources\n\n1. Click **Start** | **Control\
    \ Panel**.\n2. Click **System and Security**.\n\n> ¹ This can also be done by\
    \ clicking on **Start**> right-clicking on **Computer**> clicking on **Properties**.\n\
    \n3. Click View amount of RAM and processor speed.\n\n4. Record the following\
    \ information:\nInstalled Memory: ___________________\n\n## Task 2: Extract and\
    \ Use Your Virtual Machine\n\n1. Copy the preinstalled ITT-Lab virtual machine\
    \ onto your USB external pocket hard drive.\n\na. Create a folder on your USB\
    \ portable hard drive to store all the virtual machines used for the curriculum.\
    \ You may name the folder something like \"Virtual Machines for My Courses\" and\
    \ create subfolders in it by the course number.\n\nb. Create a subfolder under\
    \ the folder you just created in the previous step with the name of the course\
    \ number (SD1340).\n\nc. Navigate to C:\\Virtual Machines\\and find the ITT-Lab\
    \ Android.zip file.\n\nd. Right-click on ITT-Lab.zip and select Extract to extract\
    \ the files to the SD1340 folder you just created on your external USB hard drive.\n\
    \n2. Launch the virtual machine in VMware Player.\n\na. From the Start button\
    \ on your desktop, launch VMware Player as shown below.\n\nb. Click the \"Open\
    \ a Virtual Machine\" link.\n\nc. Browse to the folder where you copied the ITT-Lab\
    \ virtual machine on your USB hard drive and double-click on ITT-Lab.vmx to select\
    \ it as the virtual machine to open. If you are prompted to select whether you\
    \ moved or copied it, choose **I copied it**.\n\n3. Once the ITT-Lab virtual machine\
    \ is ready in the left column, highlight the \"ITT-Lab\" icon and click \"Edit\
    \ Virtual Machine Settings.\"\n\n4. Select \"Host-only\" for the network adaptor.²\n\
    \n5. If the host machine has more than 4GB RAM (the value you recorded in Task\
    \ 1, Step 4), select **Memory** and set the memory to 2 GB, as shown below.\n\n\
