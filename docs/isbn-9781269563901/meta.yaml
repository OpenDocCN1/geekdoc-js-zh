    ```\n\na. Besides slideToggle method, what other slide methods are available?\n\
    \n5. Add the following code within the `<body>` block:\n\n```html\n<div id=\"\
    title\">Click to slide the panel down or up</div>\n<div id=\"panel\">Hello world!</div>\n\
    ```\n\n6. Preview in the browser window to see the slide down and slide up effects\
