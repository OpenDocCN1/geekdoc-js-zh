  md: '# Lab 1-1: Configure ITT-Lab


    # Purpose


    In this lab, you will prepare the ITT-Lab virtual machine for use in upcoming
    labs. You will also explore how to use VMware Player and take a brief tour of
    the ITT-Lab virtual machine. Additionally, you will put the virtual machine on
    your USB external hard drive, which will allow you to use it on any computer running
    VMware Player 5. You can download VMware Player 5 free at:

    https://my.vmware.com/web/vmware/free - desktop_end_user_computing/vmware_player/5_0


    In this lab, you will be asked to answer several in a Microsoft Word document.
    You will turn in the Word document at the completion of the lab.


    # Objectives


    +   - Demonstrate how to launch, pause, and start the ITT-Lab virtual machine.

    - Demonstrate how to copy files to and from the ITT-Lab virtual machine.


    # How It Fits In


    You will use the ITT-Lab virtual machine to complete all the labs in this course.


    # Estimated Completion Time: 35 minutes


    # Task 1: Learn about Your Host Machine''s Resources


    +   1. Click **Start** | **Control Panel**.

    2. Click **System and Security**.


    > ^1 This can also be done by clicking on **Start**> right-clicking on **Computer**>
    clicking on **Properties**.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/bc0cefd7553b83cd38368dde4d013d76_15_0.png)


    3. Click View amount of RAM and processor speed.


    ![](img/bc0cefd7553b83cd38368dde4d013d76_15_1.png)


    4. Record the following information:

    Installed Memory: ___________________


    # Task 2: Extract and Use Your Virtual Machine


    +   1. Copy the preinstalled ITT-Lab virtual machine onto your USB external pocket
    hard drive.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   a. Create a folder on your USB portable hard drive to store all the virtual
    machines used for the curriculum. You may name the folder something like "Virtual
    Machines for My Courses" and create subfolders in it by the course number.


    +   b. Create a subfolder under the folder you just created in the previous step
    with the name of the course number (SD1340).


    +   c. Navigate to C:\Virtual Machines\and find the ITT-Lab Android.zip file.


    +   d. Right-click on ITT-Lab.zip and select Extract to extract the files to the
    SD1340 folder you justcreated on your external USB hard drive.


    ![](img/bc0cefd7553b83cd38368dde4d013d76_16_0.png)


    +   2. Launch the virtual machine in VMware Player.


    +   a. From the Start button on your desktop, launch VMware Player as shown below.


    ![](img/bc0cefd7553b83cd38368dde4d013d76_16_1.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '+   b. Click the “Open a Virtual Machine” link.


    ![](img/bc0cefd7553b83cd38368dde4d013d76_17_0.png)


    +   c. Browse to the folder where you copied the ITT-Lab virtual machine on your
    USB hard drive and double-click onITT-Lab.vmx to select it as the virtual machine
    to open. If you are prompted to select whether you moved or copied it, choose
    **I copied it**.


    ![](img/bc0cefd7553b83cd38368dde4d013d76_17_1.png)'
  merge: -1
