  md: "# Lab 10-2: Create a Web Page that Uses the Geolocation API\n\n# Purpose\n\n\
    During this lab, you will create and test a Web page that uses the Bing Maps API.\n\
    \nCreate a Microsoft Word document to answer questions and place any required\
    \ screen shots. You will turn in the Word document at the completion of the lab,\
    \ along with your Web page.\n\n# Objectives\n\n+   - Describe the features of\
    \ the geolocation API.\n- Create a Web page that uses the geolocation API.\n\n\
    # How It Fits In\n\nGeolocation can be used by any browser that supports the geolocation\
    \ API. However, it is most useful for mobile devices, such as smartphones, because\
    \ they are likely to change locations. Also, location-aware websites can help\
    \ users on the go locate the information they need that is specific to their current\
    \ location.\n\nIn this lab, you will use a bit of jQuery. Although jQuery is not\
    \ discussed until the next unit, don't worry about the syntax here. Just type\
    \ the code as it is provided.\n\n# Estimated Completion Time: 50 minutes\n\n#\
    \ Task 1: Create a Web Page that Uses Google Maps API\n\n+   1. Launch VMware\
    \ Player.\n2. Start the ITT-Lab virtual machine.\n3. Create a folder named Lab10-2\
    \ inside the SD1340 folder in My Documents.\n4. Open HTML-Kit.\n   a. Click **Start\
    \ | HTML-Kit | HTML-Kit 292**.\n   b. Verify that **Create a new file** is selected\
    \ and click **OK**.\n   c. Click **File | Save**.\n   d. Save the file to the\
    \ SD1340\\Lab10-2 folder in My Documents as *nn*Lab10-2.html.\n   e. Change the\
    \ DOCTYPE to specify that you are using HTML 5."
  merge: -1
  pgno: 155
- img_proc: true
  md: "+   f. Change the <title> to Geolocation.\n\n+   5. Add the following HTML\
    \ to the <body> block.\n\n```\n<p id=\"demo\">Click the button to get your participationioro\n\
    <button onclick=\"getLocation()\">Try It</button>\n<div id=\"mapholder\"></div>\n\
    ```\n\n+   6. Preview in the browser to verify that the displayed Web page looks\
    \ like this:\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_156_0.png)\n\n+   7.\
    \ Add a <script> block with the following code to the bottom of the <body> block:\n\
    \n```\n<script>\nvar x=document.getElementById(\"demo\");\nfunctiongetLocation()\n\
    \  {\nif (navigator.geolocation)\n  {\nnavigator.geolocation.getCurrentPosition(showPosition,showError);\n\
    \  }\nelse{x.innerHTML=\"Geolocation is not supported by this browser.\";}\n \
    \ }\n\n\n</script>\n```"
  merge: -1
  pgno: 156
- img_proc: true
  md: '8. Add a showPosition function to the <script> block. The showPosition function
    uses the Google Maps API to display a map with the user''s location.


    ```

    functionshowPosition(position)

    {

    varlatlon=position.coords.latitude+","+position.coords.longitude;

    varimg_url="http://maps.googleapis.com/maps/api/staticmap?center="

    +latlon+"&zoom=14&size=400x300&sensor=false";

    document.getElementById("mapholder").innerHTML="<imgsrc=''"+img_url+"''>";

    }

    ```


    9. Add an error callback function to the <script> block.


    ```

    functionshowError(error)

    {

    switch(error.code)

    {

    caseerror.PERMISSION_DENIED:

    x.innerHTML="User denied the request for Geolocation."

    break;

    caseerror.POSITION_UNAVAILABLE:

    x.innerHTML="Location information is unavailable."

    break;

    caseerror.TIMEOUT:

    x.innerHTML="The request to get user location timed out."

    break;

    caseerror.UNKNOWN_ERROR:

    x.innerHTML="An unknown error occurred."

    break;

    }

    }

    ```


    # Task 2: Test Your Web Page


    +   1. Create a test table in your Word document that will document the results
    for each browser on your host computer.

    2. Copy the *nn*Lab10-2.html file to your host computer.

    3. Test it in each browser and document the results.


    Submit your Word document containing all required screen shots. Also submit your
    Web page.'
  merge: -1
