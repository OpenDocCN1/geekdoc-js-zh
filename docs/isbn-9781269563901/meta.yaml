    4. Add the following code within the `<head>` block:\n\n```html\n<script src=\"\
    jquery-1.10.1.min.js\">\n</script>\n\n<script>\n$(document).ready(function(){\n\
    \  $(\".button1\").click(function(){\n    $(\"#div1\").fadeIn();\n    $(\"#div2\"\
    ).fadeIn(\"slow\");\n    $(\"#div3\").fadeIn(3000);\n  });\n});\n</script>\n\n\
    <script>\n$(document).ready(function(){\n  $(\".button2\").click(function(){\n\
    \    $(\"#div1\").fadeOut();\n    $(\"#div2\").fadeOut(\"slow\");\n    $(\"#div3\"\
    ).fadeOut(3000);\n  });\n});\n</script>\n```\n\na. Besides fadeIn() and fadeOut()\
    \ methods, what other fade methods are available?\n\n5. Add the following code\
    \ within the `<body>` block:\n\n```html\n<p>Demonstrate fadeIn() with different\
    \ parameters.</p>\n<button class=\"button1\">Click to fade in boxes</button>\n\
    <br>\n<p>Demonstrate fadeOut() with different parameters.</p>\n<button class=\"\
    button2\">Click to fade out boxes</button>\n<br><br>\n<div id=\"div1\"\nstyle=\"\
    width:80px;height:80px;display:none;background-color:red;\">\n</div><br>\n<div\
    \ id=\"div2\"\nstyle=\"width:80px;height:80px;display:none;background-color:green;\"\
    >\n</div><br>\n<div id=\"div3\"\nstyle=\"width:80px;height:80px;display:none;background-color:blue;\"\
    >\n</div>\n```\n\n6. Preview in the browser window to see the fade in and fade\
    \ out effects of HTML elements.\n\nHere is an output sample:\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_135_0.png)\n\
    \n![](img/bc0cefd7553b83cd38368dde4d013d76_135_1.png)\n\n7. Capture a screen shot\
    \ for submission and save the Web page.\n\n## Task 4: Add Slide Down and Slide\
    \ Up Effects Using jQuery\n\n1. Click **File | New Document** to create a new\
    \ document called *nnLab9-1-4.html* and save it to the SD1340 folder.\n\n2. Change\
    \ the DOCTYPE to specify that you are using HTML 5.\n\n3. Change the `<title>`\
    \ to Slide Down And Slide Up Effects.\n\n4. Add the following code within the\
    \ `<head>` block:\n\n```html\n<script src=\"jquery-1.10.1.min.js\"></script>\n\
    \n<script>\n$(document).ready(function(){\n  $(\"#title\").click(function(){\n\
    \    $(\"#panel\").slideToggle(\"slow\");\n  });\n});\n</script>\n\n<style type=\"\
    text/css\">\n#panel,#title\n{\npadding:10px;\ncolor:blue;\ntext-align:center;\n\
