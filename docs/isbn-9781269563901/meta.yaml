  md: '# Task 3: Learn How to Save and Copy Files


    +   1. On ITT-Lab, click **Start | My Computer**. Click **My Network Places**.
    You should see a Virtual Machines share. If you do not, contact your instructor.
    The Virtual Machines share is a folder on the host operating system that is used
    to transfer files to ITT-Lab, and to temporarily store files that will be emailed
    to your instructor or printed on the lab printers. The contents of this folder
    are deleted frequently, so you should save all files to your own USB hard drive
    each time you quit the lab and never store files on the host machine that you
    will need later.


    +   2. Create a folder on ITT-Lab where you will store files permanently.


    +   a. Click **My Documents**.


    +   b. Click **Make a new folder**.


    ![](img/bc0cefd7553b83cd38368dde4d013d76_22_0.png)


    +   3. Name the folder **SD1340**


    +   4. Shutting down the virtual machine: Like working on any real computer, you
    must always quit the application programs and shut down the virtual machine properly
    by clicking on the Start button and selecting the Turn Off option. Wait for the
    virtual machine to completely power off and the computer returns to the VMware
    Player home screen.


    Do not directly close VMware Player without properly shutting down the virtual
    machine. Doing so can corrupt your virtual machine and you will lose all the configurations
    and data that you have saved on the virtual machine.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '![](img/bc0cefd7553b83cd38368dde4d013d76_23_0.png)


    5. Once the virtual machine is completely powered off, you will arrive back at
    the VMware Player Menu window, as shown below. Notice that the state of the virtual
    machine is "Powered Off."


    ![](img/bc0cefd7553b83cd38368dde4d013d76_23_1.png)


    6. Copy all your files in the SD1340 folder on the host machine to your USB external
    hard drive.'
  merge: -1
  pgno: 23
