    \ geolocation API. However, it is most useful for mobile devices, such as smartphones,\
    \ because they are likely to change locations. Also, location-aware websites can\
    \ help users on the go locate the information they need that is specific to their\
    \ current location.\n\nIn this lab, you will use a bit of jQuery. Although jQuery\
    \ is not discussed until the next unit, don't worry about the syntax here. Just\
    \ type the code as it is provided.\n\n## Estimated Completion Time: 50 minutes\n\
    \n## Task 1: Create a Web Page that Uses Google Maps API\n\n1. Launch VMware Player.\n\
    2. Start the ITT-Lab virtual machine.\n3. Create a folder named Lab10-2 inside\
    \ the SD1340 folder in My Documents.\n4. Open HTML-Kit.\n   a. Click **Start |\
    \ HTML-Kit | HTML-Kit 292**.\n   b. Verify that **Create a new file** is selected\
    \ and click **OK**.\n   c. Click **File | Save**.\n   d. Save the file to the\
    \ SD1340\\Lab10-2 folder in My Documents as *nn*Lab10-2.html.\n   e. Change the\
    \ DOCTYPE to specify that you are using HTML 5.\n   f. Change the `<title>` to\
    \ Geolocation.\n\n5. Add the following HTML to the `<body>` block.\n\n   ```html\n\
    \   <p id=\"demo\">Click the button to get your position</p>\n   <button onclick=\"\
    getLocation()\">Try It</button>\n   <div id=\"mapholder\"></div>\n   ```\n\n6.\
    \ Preview in the browser to verify that the displayed Web page looks like this:\n\
    \n![](img/bc0cefd7553b83cd38368dde4d013d76_156_0.png)\n\n7. Add a `<script>` block\
    \ with the following code to the bottom of the `<body>` block:\n\n   ```html\n\
    \   <script>\n   var x = document.getElementById(\"demo\");\n   function getLocation()\n\
    \     {\n       if (navigator.geolocation)\n         {\n           navigator.geolocation.getCurrentPosition(showPosition,\
    \ showError);\n         }\n       else\n         {\n           x.innerHTML = \"\
    Geolocation is not supported by this browser.\";\n         }\n     }\n   </script>\n\
    \   ```\n\n8. Add a showPosition function to the `<script>` block. The showPosition\
    \ function uses the Google Maps API to display a map with the user's location.\n\
    \n   ```javascript\n   function showPosition(position)\n   {\n     var latlon\
    \ = position.coords.latitude + \",\" + position.coords.longitude;\n     var img_url\
    \ = \"http://maps.googleapis.com/maps/api/staticmap?center=\"\n       + latlon\
    \ + \"&zoom=14&size=400x300&sensor=false\";\n     document.getElementById(\"mapholder\"\
    ).innerHTML = \"<img src='\" + img_url + \"'>\";\n   }\n   ```\n\n9. Add an error\
    \ callback function to the `<script>` block.\n\n   ```javascript\n   function\
    \ showError(error)\n   {\n     switch(error.code)\n     {\n       case error.PERMISSION_DENIED:\n\
    \         x.innerHTML = \"User denied the request for Geolocation.\"\n       \
    \  break;\n       case error.POSITION_UNAVAILABLE:\n         x.innerHTML = \"\
    Location information is unavailable.\"\n         break;\n       case error.TIMEOUT:\n\
    \         x.innerHTML = \"The request to get user location timed out.\"\n    \
    \     break;\n       case error.UNKNOWN_ERROR:\n         x.innerHTML = \"An unknown\
    \ error occurred.\"\n         break;\n     }\n   }\n   ```\n\n## Task 2: Test\
    \ Your Web Page\n\n1. Create a test table in your Word document that will document\
    \ the results for each browser on your host computer.\n2. Copy the *nn*Lab10-2.html\
    \ file to your host computer.\n3. Test it in each browser and document the results.\n\
    \nSubmit your Word document containing all required screen shots. Also submit\
    \ your Web page.\n\n## Course Project Part 10: Test and Finalize Your Website\n\
    \nThroughout the course, you will build a desktop and a mobile version of a website.\
    \ The website should be about one of your hobbies or interests. In this unit,\
    \ you will test and finalize your website.\n\nMake sure to test your final website\
    \ in desktop and mobile browsers.\n\nTurn in all HTML and CSS pages by the end\
    \ of this unit.\n\n---\n\nwww.pearsonlearningsolutions.com\n\nW7-AYB-476\n\nISBN-13:\
    \ 978-1-269-56390-1\nISBN-10: 1-269-56390-4\n\n9 781269 563901\n\n90000\n\nPEARSON\n\
    \nALWAYS LEARNING"
