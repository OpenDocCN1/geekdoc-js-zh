    \n```\n<canvas id=\"myCanvas\" width=\"250\" height=\"200\" style=\"border:1px\
    \ solid blue\">\nYour browser does not support the HTML5 canvas tag.</canvas>\n\
    ```\n\n```\n<script>\n    var c=document.getElementById(\"myCanvas\");\n    var\
    \ ctx=c.getContext(\"2d\");\n    ctx.font=\"40px Arial\";\n    ctx.fillStyle='red';\n\
    \    ctx.fillText(\"Hello World\",10,50);\n    ctx.strokeStyle='red';\n    ctx.strokeText(\"\
    Hello World\",10,150);\n</script>\n```\n\na. What method is used to draw text\
    \ with no fill?\n\n5. Preview in the browser window to see color filled text and\
    \ a color stroke text on a canvas.\n\n(Note: This Web page will only work for\
