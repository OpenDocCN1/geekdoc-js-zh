  md: '# Course Project Part 9: Adding jQuery and jQuery Mobile to the Website


    Throughout the course, you will build a desktop and a mobile version of a website.
    The website should be about one of your hobbies or interests. In this unit, you
    will enhance the website with the following features:


    +   - Import the jQuery JavaScript file jquery-1.10.1.min.js and add at least
    two jQuery effects to the website.

    - Test out the jQuery effects by 2 different Web browsers and take screenshots
    for submission.

    - Then import the jQuery Mobile JavaScript file jquery.mobile-1.3.1.min.js and
    the jQuery Mobile CSS file jquery.mobile-1.3.1.min.css to the website. Add at
    least two jQuery Mobile buttons to the website.

    - Test out the website by two different mobile devices (use the Opera Mobile emulator)
    and take screenshots for submission.


    Use the Internet and the ITT Tech Virtual Library to search for help for jQuery
    and jQuery Mobile.


    Turn in the HTML page by the end of this unit. Submit your Word document containing
    all required screen shots.'
  merge: -1
  pgno: 148
