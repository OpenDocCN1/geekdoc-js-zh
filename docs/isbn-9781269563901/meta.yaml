  md: '# Lab 5-1: Add Forms and Data Validation to a Web Page


    # Purpose


    During this lab, you will add a form that uses some of the `<input>` types introduced
    with HTML5. You will write JavaScript code that performs data validation. You
    will also write JavaScript code to create a custom object.


    In this lab you will be asked to answer several questions in a Microsoft Word
    document, whichyou will turn in at the completion of the lab.


    # Objectives


    +   - Create a JavaScript function.

    - Create custom objects.

    - Use and extend built-in objects.

    - Write code that uses conditional statements.

    - Write code that uses loops.


    # How It Fits In


    Forms allow users to submit data to your website. However, it is essential that
    you validate the data being submitted to make sure that it can be used by the
    server-side code that processes the form. Data validation can also help protect
    against certain types of attacks that operate by sending invalid input to a server-side
    component. In this lab, you study fundamental techniques for performing data validation.
    More advanced techniques will be covered in SD2520. This lab also allows you to
    practice using built-in and custom objects, as well as statements that control
    the flow through a JavaScript function.


    # Estimated Completion Time: 100 minutes


    # Task 1: Create an HTML Page that Includes a Form


    +   1. Launch VMware Player.

    2. Start ITT-Lab.

    3. Launch HTML-Kit and create a new HTML file.

    4. Save the file as nnLab5-1.htm.

    5. Change the DOCTYPE to specify that you are using HTML5.

    6. Change the `<title>` to Event Scheduler.'
