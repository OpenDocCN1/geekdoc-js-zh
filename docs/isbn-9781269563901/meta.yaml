  md: "# Lab 10-1: Create a Web Page that HTML 5 Link Types\n\n# Purpose\n\nDuring\
    \ this lab, you will create and test a Web page that the HTML5 link types.\n\n\
    Create a Microsoft Word document to answers questions and place any required screen\
    \ shots. You will turn in the Word document at the completion of the lab, along\
    \ with your Web page.\n\n# Objectives\n\n+   - Describe new link functionality\
    \ in HTML5.\n- Create a Web page that uses HTML5 link types.\n\n# How It Fits\
    \ In\n\nThe HTML5 link types can allow you to add meaning to the links on your\
    \ page. Some link types help you better style your documents. Others impact the\
    \ way search engine crawlers see your content. In this lab, you will experiment\
    \ with several of the link types introduced in HTML5.\n\n# Estimated Completion\
    \ Time: 50 minutes\n\n# Task 1: Add Previous and Next Links\n\n+   1. Launch VMware\
    \ Player.\n2. Start the ITT-Lab virtual machine.\n3. Copy the Lab10-1Starter.zip\
    \ file to ITT-Lab and unzip it to SD1340.\n4. Open HTML-Kit.\n   a. Click **Start\
    \ | HTML-Kit | HTML-Kit 292**.\n   b. Verify that **Create a new file** is selected\
    \ and click **OK**.\n   c. Click **File | Save**.\n   d. Save the file to the\
    \ SD1340\\Lab10-1Starter folder in My Documents as *nn*Lab10-1.html.\n   e. Change\
    \ the DOCTYPE to specify that you are using HTML5.\n   f. Change the <title> to\
    \ HTML5 Link Types.\n5. Add the following HTML to the <body> section:\n\n```\n\
    <a href=\"FirstPage.html\" rel=\"prev\">Previous</a>\n<a href=\"LastPage.html\"\
    \ rel=\"next\">Next</a>\n```"
  merge: -1
  pgno: 149
- img_proc: true
  md: "+   6. Test the page.\n\t- a. Is there any difference in the links?\n\n7. Create\
    \ a new stylesheet. Save it as nnLab10-1styles.css.\n\n+   8. Define the following\
    \ styles:\n\n```\n[rel=prev] {\nbackground-color: navy;\ncolor: white;\n}\n\n\
    [rel=next] {\nbackground-color: maroon;\ncolor: white;\n}\n```\n\n9. Link the\
    \ stylesheet to FirstPage.html, LastPage.html, and nnLab10-1.html.\n\n10. Modify\
    \ the placeholder link in FirstPage.html so that it is a Next link that links\
    \ to nnLab10-1.html.\n\n11. Modify the placeholder link in NextPage.html so that\
    \ it is a Prev link that links to nnLab10-1.html.\n\n+   12. Test to verify the\
    \ following:\n\t- c. The styles are applied to Previous and Next.\n\t- d. You\
    \ can navigate backwards and forwards.\n\n13. Take a screenshot of each page and\
    \ past it in your Word document.\n\n# Task 2: Add an Icon Link\n\n+   1. Add the\
    \ following <link> element to the <head> block of nnLab10-1.htm:\n\n```\n<link\
    \ rel=\"icon\" href=\"lab10icon.ico\">\\\n```\n\n+   2. Test the link in Internet\
    \ Explorer 8.\n\t- a. View the page in IE 8.\n\t- b. Click **Favorites**.\n\t\
    - c. Click **Add to Favorites**.\n\t- d. Display the Favorites bar.\n\t- e. Was\
    \ your icon displayed?\n\n+   3. Test the link in Chrome.\n\t- a. View the page\
    \ in Chrome.\n\t\n\t\t340/La\n\t\n\t- b. Click the **Bookmark** icon\n\t- c. Click\
    \ **Done**.\n\t- d. Click the **Settings** icon and choose **Show bookmark bar**."
  merge: -1
  pgno: 150
- img_proc: true
  md: "+   e. Is your bookmark displayed?\nf. Is the custom icon displayed?\n\n+ \
    \  4. Test the link in Firefox.\n   a. Open Firefox and navigate to your nnLab10-1.htm\
    \ file.\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_151_0.png)\n\n+   b. Click\
    \ the **Bookmark** icon.\nc. Click **Done**.\nd. Is the icon added to the bookmark\
    \ bar?\n\n# Task 3: Add an External Link\n\n+   1. Add the following link to nnLab10-1.html.\n\
    \   `<a href=\"ExternalPage.html\" rel=\"external\">External</a>`\n\n2. Preview\
    \ the page in any browser.\n\n+   3. Click the link and verify that the page displays\
    \ correctly.\n   a. How would you cause the page to be displayed in a separate\
    \ window?\n\n+   4. If you have not already downloaded the jQuery library, perform\
    \ the following steps:\n   a. Enable an Internet connection from your virtual\
    \ machine.\n      i. Click **Player | Manage | Virtual Machine Settings**.\n \
    \     ii. Select **Network Adapter**.\n      iii. Select **Bridged** as shown\
    \ below."
