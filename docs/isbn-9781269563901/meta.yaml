  mdcn: "\n ## 实验 8-1：编写使用 <canvas> 元素的网页\n\n## 目的\n\n在本实验中，你将创建并测试一个使用 <canvas> 元素的\
    \ HTML5 网页。\n\n创建一个 Microsoft Word 文档，将所有必需的截图放在其中，在实验完成时提交。\n\n## 目标\n\n- 使用\
    \ <canvas> 元素在网页上绘制图形。\n- 使用 <canvas> 元素在网页上显示图像。\n\n## 如何融入\n\nHTML5 的 <canvas>\
    \ 元素用于通过 JavaScript 即时绘制图形。在本实验中，你将学习如何使用 <canvas> 元素进行绘制和添加图像。\n\n## 预计完成时间：60\
    \ 分钟\n\n## 任务 1：编写网页在画布上填充颜色\n\n1. 启动 VMware Player。\n2. 启动 ITT-Lab 虚拟机。\n3. 打开\
    \ HTML-Kit。\n    a. 点击**开始 | HTML-Kit | HTML-Kit 292**。\n    b. 确认**创建新文件**已选中，然后点击.paginator.0\"\
    >点击 **OK**。\n    c. 点击**文件 | 保存**。\n    d. 将文件保存到\"我的文档\"中的 SD1340 文件夹，文件名为 *nn*Lab8-1-1.html。\n\
    \    e. 将 DOCTYPE 改为指定使用 HTML 5。\n    f. 将 <title> 改为 Fill Color Onto A Canvas。\n\
    4. 在 <body> 块内添加以下 HTML 代码：\n\n```\n<canvas id=\"myCanvas\" width=\"200\" height=\"\
    100\" style=\"border:1px solid blue\">\nYour browser does not support the HTML5\
    \ canvas tag.\n</canvas>\n\n<script>\n    var c=document.getElementById(\"myCanvas\"\
    );\n    var ctx=c.getContext(\"2d\");\n    ctx.fillStyle=\"red\";\n    ctx.fillRect(0,0,150,75);\n\
    </script>\n```\n\na. 使用什么方法来查找画布？\n\n5. 在浏览器窗口中预览，查看带有填充颜色矩形的画布。\n\n（注意：此网页仅适用于\
    \ IE 9 或更高版本，请使用 Google Chrome 或 Firefox 预览）\n\n以下是输出示例：\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_113_0.png)\n\
    \n6. 截取屏幕截图用于提交，并保存网页。\n\n## 任务 2：编写网页在画布上绘制线条\n\n1. 点击**文件 | 新建文档**，创建名为 *nn*Lab8-1-2.html\
    \ 的新文档，并将其保存到 SD1340 文件夹。\n2. 将 DOCTYPE 改为指定使用 HTML 5。\n3. 将 <title> 改为 Draw A\
    \ Line To A Canvas。\n4. 在 <body> 块内添加以下代码：\n\n```\n<canvas id=\"myCanvas\" width=\"\
    200\" height=\"100\" style=\"border:1px solid blue\">\nYour browser does not support\
    \ the HTML5 canvas tag.</canvas>\n\n<script>\nvar c=document.getElementById(\"\
    myCanvas\");\nvar ctx=c.getContext(\"2d\");\nctx.moveTo(0,0);\nctx.lineTo(200,100);\n\
    ctx.strokeStyle='red';\nctx.stroke();\n</script>\n```\n\na. 使用什么方法设置线条颜色？\n\n\
    7. 在浏览器窗口中预览，查看画布上绘制的彩色线条。\n\n> （注意：此网页仅适用于 IE 9 或更高版本，请使用 Google Chrome 或 Firefox\
    \ 预览）\n\n8. 以下是输出示例：\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_114_0.png)\n\n\
    9. 截取屏幕截图用于提交，并保存网页。\n\n## 任务 3：编写网页在画布上绘制圆形\n\n1. 点击**文件 | 新建文档**，创建名为 *nn*Lab8-1-3.html\
    \ 的新文档，并将其保存到 SD1340 文件夹。\n2. 将 DOCTYPE 改为指定使用 HTML5。\n3. 将 <title> 改为 Draw Circles\
    \ To A Canvas。\n4. 在 <body> 块内添加以下代码：\n\n```\n<canvas id=\"myCanvas\" width=\"\
    200\" height=\"250\" style=\"border:1px solid blue;\">\nYour browser does not\
    \ support the HTML5 canvas tag.</canvas>\n\n<script>\n    var c=document.getElementById(\"\
    myCanvas\");\n    var ctx=c.getContext(\"2d\");\n    ctx.beginPath();\n    ctx.arc(95,50,40,0,2*Math.PI);\n\
    \    ctx.strokeStyle='red';\n    ctx.stroke();\n\n    ctx.beginPath();\n    ctx.arc(95,200,40,0,2*Math.PI);\n\
    \    ctx.fillStyle='red';\n    ctx.fill();\n</script>\n```\n\na. 使用什么方法绘制圆形？\n\
    \n5. 在浏览器窗口中预览，查看画布上的填充颜色圆形和空心圆形。\n\n（注意：此网页仅适用于 IE 9 或更高版本，请使用 Google Chrome\
    \ 或 Firefox 预览）\n\n以下是输出示例：\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_116_0.png)\n\
    \n6. 截取屏幕截图用于提交，并保存网页。\n\n## 任务 4：编写网页在画布上绘制文本\n\n1. 点击**文件 | 新建文档**，创建名为 *nn*Lab8-1-4.html\
    \ 的新文档，并将其保存到 SD1340 文件夹。\n2. 将 DOCTYPE 改为指定使用 HTML 5。\n3. 将 <title> 改为 Draw Text\
    \ To A Canvas。\n4. 在 <body> 块内添加以下代码：\n\n```\n<canvas id=\"myCanvas\" width=\"\
    250\" height=\"200\" style=\"border:1px solid blue\">\nYour browser does not support\
    \ the HTML5 canvas tag.</canvas>\n```\n\n```\n<script>\n    var c=document.getElementById(\"\
    myCanvas\");\n    var ctx=c.getContext(\"2d\");\n    ctx.font=\"40px Arial\";\n\
    \    ctx.fillStyle='red';\n    ctx.fillText(\"Hello World\",10,50);\n    ctx.strokeStyle='red';\n\
    \    ctx.strokeText(\"Hello World\",10,150);\n</script>\n```\n\na. 使用什么方法绘制无填充文本？\n\
    \n5. 在浏览器窗口中预览，查看画布上的填充颜色文本和描边文本。\n\n（注意：此网页仅适用于 IE 9 或更高版本，请使用 Google Chrome\
    \ 或 Firefox 预览）\n\n以下是输出示例：\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_117_0.png)\n\
    \n6. 截取屏幕截图用于提交，并保存网页。\n\n## 任务 5：编写网页在画布上添加渐变\n\n1. 点击**文件 | 新建文档**，创建名为 nnLab8-1-5.html\
    \ 的新文档，并将其保存到 SD1340 文件夹。\n2. 将 DOCTYPE 改为指定使用 HTML 5。\n3. 将 <title> 改为 Add Linear\
    \ Gradient Onto A Canvas。\n4. 在 <body> 块内添加以下代码：\n\n```\n<canvas id=\"myCanvas\"\
    \ width=\"400\" height=\"100\" style=\"border:1px solid blue\">\nYour browser\
    \ does not support the HTML5 canvas tag.</canvas>\n\n<script>\n    var c=document.getElementById(\"\
    myCanvas\");\n    var ctx=c.getContext(\"2d\");\n\n    // Create gradient\n  \
    \  var grd=ctx.createLinearGradient(0,0,400,0);\n    grd.addColorStop(0,\"yellow\"\
    );\n    grd.addColorStop(1,\"black\");\n\n    // Fill with gradient\n    ctx.fillStyle=grd;\n\
    \    ctx.fillRect(10,10,350,80);\n</script>\n```\n\na. 渐变位置的值是什么？\n\n5. 在浏览器窗口中预览，查看画布上的线性渐变色。\n\
    \n（注意：此网页仅适用于 IE 9 或更高版本，请使用 Google Chrome 或 Firefox 预览）\n\n6. 以下是输出示例：\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_118_0.png)\n\
    \n7. 截取屏幕截图用于提交，并保存网页。\n\n提交包含所有必需截图的 Word 文档。同时提交你的网页。\n\n## 实验 8-2：使用 HTML5\
    \ 表单元素编写网页\n\n## 目的\n\n在本实验中，你将创建并测试一个带有 HTML5 表单元素的网页。\n\n创建一个 Microsoft Word\
    \ 文档，将所有必需的截图放在其中，在实验完成时提交。\n\n## 目标\n\n- 创建一个使用 HTML5 特性的表单。\n- 创建一个执行输入验证的表单。\n\
    \n## 如何融入\n\nHTML5 提供了新的输入特性，以实现更好的输入控制和验证。在本实验中，你将学习如何使用 HTML5 表单元素。\n\n## 预计完成时间：40\
    \ 分钟\n\n## 任务 1：编写网页使用 datetime-local 类型进行用户输入\n\n1. 点击**文件 | 新建文档**，创建名为 *nn*Lab8-2-1.html\
    \ 的新文档，并将其保存到 SD1340 文件夹。\n2. 将 DOCTYPE 改为指定使用 HTML 5。\n3. 将 <title> 改为 Datetime-local\
    \ Type For User Input。\n4. 在 <body> 块内添加以下代码：\n\n```\n<form action=\"\">\n  Birthday\
    \ (date and time):<input type=\"datetime-local\"\nname=\"bdaytime\">\n<input type=\"\
    submit\">\n</form>\n```\n\na. datetime-local 输入类型能否选择特定时区？\n\n10. 在浏览器窗口中预览，查看\
    \ datetime-local 类型的用户输入。\n\n（注意：此网页仅适用于 Google Chrome）\n\n以下是输出示例：\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_120_0.png)\n\
    \n![](img/bc0cefd7553b83cd38368dde4d013d76_120_1.png)\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_120_2.png)\n\
    \n11. 截取屏幕截图用于提交，并保存网页。\n\n## 任务 2：编写网页使用 month 类型进行用户输入\n\na. 点击 文件 | 新建文档 创建名为\
    \ nnLab8-2-2.html 的新文档，并将其保存到 SD1340 文件夹。\nb. 将 DOCTYPE 改为指定使用 HTML 5。\nc. 将 <title>\
    \ 改为 Month And Year Type For User Input。\n"
