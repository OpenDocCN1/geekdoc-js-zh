  md: '4. Select "Host-only" for the network adaptor.²


    ![](img/bc0cefd7553b83cd38368dde4d013d76_19_0.png)


    ² Note: Selecting Host-Only mode for the NIC will allow the virtual machine to
    communicate with the host machine only. If communications with other computers
    on the LAN and the Internet are desired, the NIC on the virtual machine will require
    either the Bridged or NAT mode, which can be changed in the Settings of the VMware
    Player. Please beware that any change to the Settings needs to be configured when
    the virtual machine is NOT powered on.'
