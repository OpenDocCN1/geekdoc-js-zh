- md: " ## Lab 8-1: Program a WebPage that Uses the <canvas> Element\n\n## Purpose\n\
    \nDuring this lab, you will create and test an HTML5 Web page that uses the <canvas>\
    \ element.\n\nCreate a Microsoft Word document and place all required screen shots\
    \ there, which you will turn in at the completion of the lab.\n\n## Objectives\n\
    \n- Draw on a Web page using the <canvas> element.\n- Display images on a Web\
    \ page using the <canvas> element.\n\n## How It Fits In\n\nThe HTML5 <canvas>\
    \ element is used to draw on-the-fly graphics with JavaScript. In this lab, you\
    \ will study how to use the <canvas> element for drawing and adding images.\n\n\
    ## Estimated Completion Time: 60 minutes\n\n## Task 1: Program a WebPage to Fill\
    \ Color onto a Canvas\n\n1. Launch VMware Player.\n2. Start the ITT-Lab virtual\
    \ machine.\n3. Open HTML-Kit.\n    a. Click **Start | HTML-Kit | HTML-Kit 292**.\n\
    \    b. Verify that **Create a new file** is selected and click **OK**.\n    c.\
    \ Click **File | Save**.\n    d. Save the file to the SD1340 folder in My Documents\
    \ as *nn*Lab8-1-1.html.\n    e. Change the DOCTYPE to specify that you are using\
    \ HTML 5.\n    f. Change the <title> to Fill Color Onto A Canvas.\n4. Add the\
    \ following HTML codes within the <body> block:\n\n```\n<canvas id=\"myCanvas\"\
    \ width=\"200\" height=\"100\" style=\"border:1px solid blue\">\nYour browser\
    \ does not support the HTML5 canvas tag.\n</canvas>\n\n<script>\n    var c=document.getElementById(\"\
    myCanvas\");\n    var ctx=c.getContext(\"2d\");\n    ctx.fillStyle=\"red\";\n\
    \    ctx.fillRect(0,0,150,75);\n</script>\n```\n\na. What method is used to find\
    \ the canvas?\n\n5. Preview in the browser window to see a canvas with a color\
    \ filled rectangle.\n\n(Note: This Web page will only work for IE 9 or later,\
    \ preview it using Google Chrome or Firefox)\n\nHere is an output sample:\n\n\
    ![](img/bc0cefd7553b83cd38368dde4d013d76_113_0.png)\n\n6. Capture a screen shot\
    \ for submission and save the Web page.\n\n## Task 2: Program a Web Page to Draw\
    \ a Line to a Canvas\n\n1. Click **File | New Document** to create a new document\
    \ called *nn*Lab8-1-2.html and save it to the SD1340 folder.\n2. Change the DOCTYPE\
    \ to specify that you are using HTML 5.\n3. Change the <title> to Draw A Line\
    \ To A Canvas.\n4. Add the following code within the <body> block:\n\n```\n<canvas\
    \ id=\"myCanvas\" width=\"200\" height=\"100\" style=\"border:1px solid blue\"\
    >\nYour browser does not support the HTML5 canvas tag.</canvas>\n\n<script>\n\
    var c=document.getElementById(\"myCanvas\");\nvar ctx=c.getContext(\"2d\");\n\
    ctx.moveTo(0,0);\nctx.lineTo(200,100);\nctx.strokeStyle='red';\nctx.stroke();\n\
    </script>\n```\n\na. What method is used to set the line color?\n\n7. Preview\
    \ in the browser window to see a colored line drawn on a canvas.\n\n> (Note: This\
    \ Web page will only work for IE 9 or later, preview it using Google Chrome or\
    \ Firefox)\n\n8. Here is an output sample:\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_114_0.png)\n\
    \n9. Capture a screen shot for submission and save the Web page.\n\n## Task 3:\
    \ Program a Web Page to Draw Circles to a Canvas\n\n1. Click **File | New Document**\
    \ to create a new document called *nn*Lab8-1-3.html and save it to the SD1340\
    \ folder.\n2. Change the DOCTYPE to specify that you are using HTML5.\n3. Change\
    \ the <title> to Draw Circles To A Canvas.\n4. Add the following code within the\
    \ <body> block:\n\n```\n<canvas id=\"myCanvas\" width=\"200\" height=\"250\" style=\"\
    border:1px solid blue;\">\nYour browser does not support the HTML5 canvas tag.</canvas>\n\
    \n<script>\n    var c=document.getElementById(\"myCanvas\");\n    var ctx=c.getContext(\"\
    2d\");\n    ctx.beginPath();\n    ctx.arc(95,50,40,0,2*Math.PI);\n    ctx.strokeStyle='red';\n\
    \    ctx.stroke();\n\n    ctx.beginPath();\n    ctx.arc(95,200,40,0,2*Math.PI);\n\
    \    ctx.fillStyle='red';\n    ctx.fill();\n</script>\n```\n\na. What method is\
    \ used to draw a circle?\n\n5. Preview in the browser window to see a color filled\
    \ circle and a empty circle in a canvas.\n\n(Note: This Web page will only work\
    \ for IE 9 or later, preview it using Google Chrome or Firefox)\n\nHere is an\
    \ output sample:\n\n![](img/bc0cefd7553b83cd38368dde4d013d76_116_0.png)\n\n6.\
    \ Capture a screen shot for submission and save the Web page.\n\n## Task 4: Program\
    \ a Web Page to Draw Text to a Canvas\n\n1. Click **File | New Document** to create\
    \ a new document called *nn*Lab8-1-4.html and save it to the SD1340 folder.\n\
    2. Change the DOCTYPE to specify that you are using HTML 5.\n3. Change the <title>\
