  md: 'These are the basic recommendations for writing Python code, recommendations
    that you should follow if your code is going to be more effective and efficient
    as well as being readable.


    +   - Your code must be written so that it doesn''t disadvantage other Python
    implementations, such as IronPython, Jython, PyPy, Psyco and Cython.


    For example, you should never rely on the efficient string concatenation of CPython
    that takes the form of a=a+b or a+=b. This is a somewhat fragile optimization,
    even though it super-efficient in CPython, it won''t work on al type sand it won''t
    be present in any Python implementation that does not use refcounting.


    Instead, where you use a part of the library that the concatenation is performance-sensitive,
    you should use the .join() form instead. This will make sure that the concatenation
    is linear across all the different Python implementations.


    +   - Never use an equality operator to make comparisons to a singleton such as
    None. Instead, use is not.'
