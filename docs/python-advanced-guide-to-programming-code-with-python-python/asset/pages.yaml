  md: '# Inheritance Design


    One rule to abide by is to determine if the instance variable or class method
    is non-public public. If you can''t decide, go for non-public as you can easily
    change it to public later on, whereas changing public to non-public is not so
    easy.


    A public attribute is one that clients are not related to the class use while
    a non-public attribute is one that is intended for by a third-party. With a public
    attribute, you guarantee backward compatibility from start to finish while, with
    the non-public attribute you do not and can remove or make changes to the attribute.
    Note that the term "private" is not used and this is because there is no real
    private attribute in the Python language.


    One other attribute category that is those classes that are designed solely as
    classes to inherit from, where it is as a way of extending or modifying certain
    aspects of the behavior. When you design a class like this, always make sure that
    you make explicit decisions about the attributes – are they public, only to be
    used by the base class or are they in the subclass API?


    With all of this, these are the Pythonic guidelines:


    +   - A public attribute must not have a leading underscore


    +   - If a public attribute clashes with a keyword (reserved), add one trailing
    underscore to the attribute name. This is the preferred method over using a corruption
    in spelling or an abbreviation.


    +   - With a public data attribute, the best way is to expose only the name of
    the attribute, without using any complicated mutator or accessor methods. If a
    simple attribute needs to expand its functional behavior, Python makes it easy.


    +   - If you are using a class that is going to be subclassed and you are also
    using attributes that are not going to be subclassed, think about adding 2 leading
    underscores but not add in any trailing underscores. This will invoke name mangling
    and helps to lower the risk of name clashes if the subclasses have attributes
    with the same name in them.'
