  md: '# Creating Ignored Variables


    If you wanted to assign something but do not need to use the variable, you would
    use __ For example:


    ```

    filename = ''footbar.txt''

    basename, __, ext = filename.rpartition(''.'',''

    ```


    # NOTE


    You will often see it recommended that you use a single underscore (_) for variables
    that are throwaway, rather than using a double underscore(_). The problem with
    this is, “-", the single underscore, tends to be used in the gettext function
    as an alias. It is also used to store the value of the previous operation at the
    interactive prompt. When you use a double underscore, “__”, it is clear and it
    is convenient. It also cuts out the accidental risk of interfering with the other
    use cases of single underscore.'
