  md: "# Indentation and Alignment\n\nEvery indent level should be 4 spaces.\n\nWhen\
    \ you use continuation lines, they should align the wrapped elements using one\
    \ of two methods:\n\n+   - Vertically with the Python implicit way of joining\
    \ lines inside braces, brackets, and parentheses, or\n- With hanging indents\n\
    \nWhen you use a hanging indent, consider that there shouldn't be any arguments\
    \ on line one and that, to mark the continuation line, indentation must be used.\n\
    \nConsider the following examples:\n\n# The Right Way:\n\n```\n# Aligned with\
    \ an opening delimiter\nfoo = long_function_name(var_four, var_three,\nvar_two,\
    \ var_one)\n```\n\n# and some indentation included so this is distinguished from\
    \ the rest of the code\n\n```\ndef long_function_name(\n    var_four, var_three,\
    \ var_two,\n    var_one):\n    print(var_four)\n```\n\n```\n# Hanging indents\
    \ should be used to add a level.\nfoo = long_function_name(\n    var_four, var_three,\n\
    \    var_two, var_one)\n```\n\n# The Wrong Way:\n\n```\n# Arguments on first line\
    \ are forbidden when you are not using vertical alignment.\nfoo = long_function_name(var_four,\
    \ var_three,\nvar_two, var_one)\n```\n\n```\n# More indentation is required as\
    \ the indentation is not distinguishable from the rest.\ndef long_function_name(\n\
    \    var_four, var_three, var_two,\n    var_one):\n    print(var_four)\n```\n\n\
    When it comes to continuation lines, the rule on 4 indent spaces is optional:\n\
    \n```\n# it is possible for hanging indents *to*be indented to more or less than\
    \ 4 spaces.\nfoo = long_function_name(\n    var_four, var_three,\n    var_two,\
    \ var_one)\n```"
  merge: -1
