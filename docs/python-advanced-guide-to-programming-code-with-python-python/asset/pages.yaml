  md: '# Creating Length-N Lists


    To create a length-N list that is is of the same thing, you would use the * list
    operator


    ```

    four_zeros = [Zero] * 4

    ```


    To create a length-N list of a list you should not use the * operator. That operator
    creates lists of N that refer to the same list and that is not what we want here.
    Instead, we use a list comprehension:


    ```

    four_lists = [[] for __ in xrange(4)]

    ```


    Note – If you are using Python 3, use range() and not xrange()'
