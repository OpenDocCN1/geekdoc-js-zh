  md: "# Searching a Collection for an Item\n\nOn occasion, you will need to search\
    \ a collection for a specific option and there are two ways to\ndo this — using\
    \ lists or sets\n\nLook at this example:\n\n```\ns = set(['c', 'f', 'o', 't'])\n\
    l = ['c', 'f', 'o', 't']\n```\n\n```\ndef lookup_set(s):\n  return 's' in s\n\
    ```\n\n```\ndef lookup_list(l):\n  return 's' in l\n```\n\nNow, both of these\
    \ functions look exactly the same simply lookup_set uses that fact that\nPython\
    \ sets are hash tables. However, the performance of lookup in each of the examples\
    \ is\ndifferent. In order to decide whether a specific item is contained in a\
    \ list, Python has to search\nthrough every single item until it finds one that\
    \ matches. This takes time, especially if you have a\nlong list. With sets, each\
    \ item has a hash that tells Python where to look for the matching item.\nThis\
    \ makes the search much quicker even if the sets are big ones. You can also search\
    \ dictionaries\nin the same way. Because there is a difference in the performance,\
    \ it is a better idea to use a set or\ndictionary rather than a list in the following\
    \ cases:\n\n+   * Where a collection contains a lot of items\n\n+   * Where you\
    \ are going to be searching for items in a collection on a repeated basis\n\n\
