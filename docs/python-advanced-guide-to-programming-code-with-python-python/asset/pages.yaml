    \ when you have one that is longer, should be split up over several lines. Your\
    \ python interpreter will take consecutive lines, and so long as the final character\
    \ on each line is a backslash (/), it will join the lines. However, although this\
    \ can be useful sometimes, really should avoid doing it because it is fragile.\
    \ If you were to add a whitespace after the backslash, it can break your code\
    \ and the results might not be what you expected.\n\nA better way to do this is\
    \ to enclose elements inside parentheses. If there is an unclosed parenthesis\
    \ at the end of the line, the next line will be joined, and so on until there\
    \ is a closed parenthesis. You could also use square or braces to do the same\
    \ thing, so long as you remain consistent – whatever you use to start, you must\
    \ also use to finish.\n\n# A Bad Example:\n\n```\nincredibly_big_string = \"For\
