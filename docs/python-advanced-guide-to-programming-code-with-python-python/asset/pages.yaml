  md: '# Function Arguments


    There are 4 ways that you can pass an argument to a function:


    +   1. Positional Argument – these are mandatory and do not contain any default
    values. The positional is the simplest argument form and are used for the arguments
    that are a complete part of the meaning of a function; they also have a natural
    order, so, in the following example, the function user should find it easy to
    remember that the 2 functions need 2 arguments and they should remember the order:


    nSend(message, recipient) and point(x, y)


    In both cases, you can use the argument names when you call the functions, and
    by doing this, you can change the order the arguments in. For example, you could
    call send(recipient=''world'', message=''Hello'') and point(y=2, x=1). However,
    as you can see from this, it is not very readable and there are more ways than
    we need. Compare that version to the one that is most straightforward – send(''Hello'',
    ''World'') and point(1,2) and you can see the difference in readability instantly.


    +   2. Keyword Argument – these do contain default values and they are not mandatory.
    Keyword arguments are sometimes used for optional parameters that you send to
    the function. When a function contains at 2 or 3, preferably more, positional
    parameters, it is not easy to remember. Using a keyword argument that has a default
    value is helpful. For example, you could define a complete sendfunction as send(message,
    cc=None, bcc=None). The use of cc and bcc is optional and both have a value of
    None if they are not given another value.


    There are a few ways that you can call a function with a keyword argument in Python.
    For example, you can explicitly name the arguments; for example, send(message=''Hello'',
    ''World'', ''Galactic'', cc=''God''). In this, you are sending a carbon copy of
    the message to Galactic and a blank copy to God. You can also name the arguments
    in a different order, for example, send(''Helloagain'', ''World'', bc=''God'',
    cc=''Galactic''). Unless you have a very good reason not to follow the correct
    syntax as closely as possible, these two examples are avoided; they are verbose
    and not readable. The best way, the way that is closest to the function definition,
    is send(''Hello'', ''World'', cc=''Galactic'', bc=''God'').


    +   3. Arbitrary Argument List - This is the next way of passing an argument to
    a function. Sometimes signature that has a number of positional arguments, a number
    that can be extended. In that case, you are better using the *args constructs
    to define it. In the body of the argument, *args is a tuple of all of the positional
    arguments that are left. For example, you can use send(message, *args) and list
    all of the recipients as a separate argument: send(''Hello'', ''Galactic'', ''Dad'',
    ''God'') – in the body of the function, *args is equal to (''Galactic'', ''Dad'',
    ''God'').'
