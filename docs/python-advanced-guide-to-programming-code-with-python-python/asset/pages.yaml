  md: 'those who are new to Python. So, you need to learn good idioms and some of
    the more common ones are:


    # Unpacking


    Provided you know how long a tuple or list is, packing allows you to give each
    element a name. For example, enumerate() gives you a tuple with 2 elements for
    each of the items in the list:


    ```

    for the index, each item in enumerate(this_list):

    # do something with the index and each item

    ```


    You can also use unpacking to swap the variables:


    ```

    b, a = a, b

    ```


    And you can use nested unpacking:


    ```

    c, (b, a) = 3, (2, 1)

    ```


    When Python 3 was implemented, it came with a new extended unpacking method:


    ```

    c*_rest = [3, 2, 1]

    # c = 3, the_rest = [2, 1]

    c*_the_middle, c = [4, 3, 2, 1]

    # c = 4, the_middle = [3, 2], c = 1

    ```'
