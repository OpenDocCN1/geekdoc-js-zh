  mdcn: "\n\n## 第 3 章：代码布局\n\n显而易见的起点是如何布局你的代码。我将为你提供代码布局的最佳实践指南，并给出关于如何做以及不应该如何做的示例：\n\
    \n## 缩进与对齐\n\n每个缩进层级都应该是 4 个空格。\n\n当你使用延续行时，它们应该使用以下两种方法之一对折行的元素进行对齐：\n\n- 垂直方向，类似于\
    \ Python 在花括号、括号和圆括号内部隐式连接行的方式，或者\n- 悬缩进（hanging indents）\n\n当你使用悬挂缩进时，请考虑第一行不应该有任何参数，并且为了标记延续行，必须使用缩进。\n\
    \n考虑以下示例：\n\n### 正确的方法：\n\n```python\n# 与起始分隔符对齐\nfoo = long_function_name(var_four,\
    \ var_three,\nvar_two, var_one)\n```\n\n```python\n# 并包含一些缩进，以便与代码的其他部分区分\ndef\
    \ long_function_name(\n    var_four, var_three, var_two,\n    var_one):\n    print(var_four)\n\
    ```\n\n```python\n# 使用悬缩进来增加一个级别。\nfoo = long_function_name(\n    var_four, var_three,\n\
    \    var_two, var_one)\n```\n\n### 错误的方法：\n\n```python\n# 当不使用垂直对齐时，第一行不允许有参数。\n\
    foo = long_function_name(var_four, var_three,\nvar_two, var_one)\n```\n\n```python\n\
    # 需要更多的缩进，因为缩进与其他部分无法区分。\ndef long_function_name(\n    var_four, var_three, var_two,\n\
    \    var_one):\n    print(var_four)\n```\n\n对于延续行，4 个空格缩进的规则是可选的：\n\n```python\n\
    # 悬缩进的缩进可以多于或少于 4 个空格。\nfoo = long_function_name(\n    var_four, var_three,\n\
    \    var_two, var_one)\n```\n\n当你使用带有可以分多行的长条件的 `if` 语句时，请注意，条件中的其余行很容易缩进 4 个空格——使用一个\
    \ 2 个字符的关键字（例如 `if`）后跟一个空格和一个起始括号。然而，在视觉上，这看起来可能与 `if` 语句内部的缩进代码不兼容，因为内部已经有了 4\
    \ 个空格的缩进。虽然没有特定的位置来将这些条件行与嵌套内部的代码区分开，但有几种可以接受的选项可以使用，包括但不限于：\n\n```python\n# 没有使用额外缩进。\n\
    if (this_is_one_thing and\n    that_is_something_else):\n    do_this()\n\n# 添加注释，这将在支持语法高亮的编辑器中提供一些帮助。\n\
    if (this_is_one_thing and\n    that_is_something_else):\n    # 因为两个条件都为真，我们可以进行调整。\n\
