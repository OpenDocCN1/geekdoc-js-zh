    ## Chapter 8: Naming Conventions


    To be honest, the Python library naming conventions are something of a mess so
    we are never going to be totally consistent. However, there are some naming standards
    that are recommended and all new packages and modules, and that includes any third-party
    frameworks, must be we to these standards. That said, if you are using an existing
    library with a different style, stick to that style because consistency is preferable,
    especially in terms of readability.


    The first and most important principle to learn is that, where you are using names
    that are a visible part of a public API, you must use a convention that reflects
    usage of the name, rather than the implementation of it.


    ### Descriptive


    There are quite a few different naming styles so it is helpful to recognize which
    one is use, independently of the usage. These are the most commonly distinguished
    naming styles:


    - B – single uppercase

    - b – single lowercase

    - lowercase_with_underscores

    - lowercase

    - UPPERCASE_WITH_UNDERSCORES

    - UPPERCASE

    - CapitalizedWords – often called CamelCase because the letters look somewhat
    bumpy*

    - mixedCase – different from CamelCase because the first letter is in lowercase

    - Capital_Words_With_Underscore – not a pretty style!


    * When you use abbreviations in CamelCase, you should make sure all of the abbreviation
    letters are capitalized. For example, rather than using HttpServlet, use HTTPServer
    instead.


    You can also use another style, that of putting a unique prefix, a short one,
    that puts a group of related names together. This doesn''t get very much in Python
    but I mention just that you know it is. An example would be the function `os.stat()`
    – this will return a tuple that contains items that have names like `st_size`,
    `st_mode`, `st_mtime` and so on.


    These are some of the forms that use a trailing or a leading underscore and can
    usually be combined with any of the case conventions:


    - _one_leading_underscore – this is generally an indicator of “internal use” that
    is not very strong.

    - _one_trailing_underscore – generally used to stop a conflict with a Python keyword,
    for example: `Apiter.Toplevel(master,class=''ClassName'')`

    - __two_leading_underscores – when you make a class attribute, this invokes mangling
    of a name, for example: (inside class FootBar, _boo) would become (`_FootBar__boo`)

    - __two_leading_and_two_trailing_underscores are attributes or “magic” objects
    that reside in a namespace that is user-controlled. For example: `__init__`, `__file__`,
    or `__import__`.


    ### Prescriptive


    These are the names you should avoid:


    Never use ‘O’ (uppercase oh), ‘l’ (lowercase el) or ‘I’ (uppercase eye) when you
    are writing variable names of a single character. Depending on what font you are
    using, these may be, these can be confused with the numbers ‘0’ and ‘1’ – if you
    do find yourself thinking about using ‘l’, use the uppercase ‘L’ instead.


    ### Names for Modules and Packages


    All module names should be short and lowercase. You can use an underscore in a
    module name but only if it makes it more readable. The same goes for Python packages
    – short and lowercase names – but don’t use underscores.


    Where you have an extension module that has been written in C or in C++ and it
    is accompanied by a Python module that has an interface that is more object-oriented,
    the C or C++ module will have a leading underscore, for example, `_socket`.


    ### Class Names


    Class names usually use the CapWords or CamelCase convention.


    Built-in names have their own separate convention and are usually a single word
    or 2 words in one, for example, ''Hello'' or ''HelloWorld''. The CamelCase convention
    tends to be kept for built-in constants and for exception names.


    ### Type Variables


    The names of variables usually use CamelCase and that said, you should add a suffix
    _co or _contra to declare behavior. For example:


    ```python

    VT_co = TypeVar(''VT_co'')

    KT_contra = TypeVar(''KT_contra'')

    ```


    ### Names of Exceptions


    Exceptions are classes and, as such, make sure that you use ''Error'' suffix on
    the name.


    ### Global Variables


    Provided the variable is used inside a module, the naming conventions are the
    same for functions.


    ### Functions


    All function names are in lowercase and the words are separated by underscore
    where needed.


    ### Instance Variables and Method Names


    Again, the naming conventions for functions apply here – using lowercase with
    underscores. If you are using an instance variable or non-public method, you should
    use a single underscore. To stop a name from clashing with a subclass, two leading
    underscores should be used in Python. When these rules are invoked, the name is
    mangled with the class name. For example, class contains an attribute called __a.


    Wait,- To stop a name from clashing with a subclass, two leading underscores should
    be used in Python. When these rules are invoked, the name is mangled with the
    class name. For example, class contains an attribute called __a.


    ### Constants


    These tend to be defined on module level and are all uppercase with separating
    underscores, for example, MAX_OVERFLOW.


    ### Inheritance Design


    One other attribute category that is those classes that are designed solely as
    classes to inherit from, where it is as a way of extending or modifying certain
    aspects of the behavior. Always you make explicit decisions about the attributes
    – are they public, only to be used by the base class or are they in the subclass
    API?


    One rule to abide by is to determine if the instance variable or class method
    is non-public. If you can''t decide, go for non-public as you can easily change
    it to public, whereas changing public to non-public is not so easy. A public attribute
    is one that clients are not related to the class while a non-public attribute
    is one that is intended for a third-party. With a public attribute, you guarantee
    backward compatibility from start to finish while, with the non-public attribute
    you do not and make changes to the.


    With all of this, these are the Pythonic guidelines:


    - A public attribute must not have a leading underscore

    - If a public attribute clashes with a keyword (reserved), add one trailing underscore
    to the attribute name. This is the preferred method over using a corruption in
    spelling or an abbreviation.

    - With a public data attribute, the best way is to expose only the name of the
    attribute, without using any complicated mutator or accessor methods. If a simple
    attribute needs to expand its functional behavior, Python makes it easy.

