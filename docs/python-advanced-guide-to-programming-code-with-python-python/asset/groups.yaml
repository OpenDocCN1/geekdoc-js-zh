    # # Introduction


    I want to thank you and congratulate you for reading the book, "Python: Best Practices
    to Programming Code with Python". This book contains proven steps and strategies
    on how to program in Python more effectively. When you first learn Python, you
    will be taught how to write code, but in many cases, you will not be taught how
    to write code neatly.


    If you speak to any Python programmer, ask them what it is like Python. I guarantee
    they will tell you that one of the main reasons is because it is easily readable.
    In fact, this is the absolute heart of the Python language, simply because computer
    code is read far more than it is written. Much of this is down to the fact that
    Python code follows a set of guidelines and "Pythonic" idioms – if you hear a
    programmer refer to a part of the code as not being "Pythonic", it means it does
    not follow those guidelines and it doesn''t express intent in any manner.


    Code style and layout are incredibly important, as is consistency in the style
    that you use. With that, there are times when consistency isn''t the right thing
    and the guidelines are simply not applicable – you have to know when that time
    is and when is best judgment comes into programming with Python.


    With this guide, I am going to show you the absolute best way to write your code,
    tidying up your program and making it all more effective and efficient. I won''t
    just give you the basic. I will delve into everything you need to know, from the
    layout of the code to how to write functions, idioms, and names.


    I will talk about whitespaces and tabs, strings, and methods. I will also be giving
    you some general recommendations for Python programming along with the general
    concepts. In short, by the time you have read my Best Practice guide, you will
    be the best Python programmer you can possibly.


    My book does assume some prior knowledge of Python programming, so if you are
    a complete newbie to the programming scene, please familiarize yourself with Python
    code before you read this book. My aim is to help you produce Python code that
    is free from, or at least has very few, complications or obvious problems, as
    well as making it more readable for others.


    Thanks again for reading this book, I hope you enjoy it!'
