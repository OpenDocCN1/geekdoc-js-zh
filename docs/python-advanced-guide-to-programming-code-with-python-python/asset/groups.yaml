    \ you should use `cls` rather than a synonym.\n\n# Function Arguments\n\nThere\
    \ are 4 ways that you can pass an argument to a function:\n\n1. Positional Argument\
    \ – these are mandatory and do not contain any default values. The positional\
    \ is the simplest argument form and are used for the arguments that are a complete\
    \ part of the meaning of a function; they also have a natural order, so, in the\
    \ following example, the user should find it easy to remember that the functions\
    \ need arguments and they should remember the order: `send(message, recipient)`\
