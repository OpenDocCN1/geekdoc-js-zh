  mdcn: '


    ## 第 9 章：

    在语句和表达式中使用空格


    首先，是一些关于空格的禁忌：


    在以下情况下请勿使用额外的空格：


    - 紧邻大括号、方括号或圆括号内部


    ### 良好的示例：

    `ham(spam[1], (eggs: 2))`


    ### 糟糕的示例：

    `ham(spam[ 1 ], ( eggs: 2 ))`


    - 位于冒号、分号或逗号之前：


    ### 良好的示例：

    `if x == 4; print x, y; x = y, x`


    ### 糟糕的示例：

    `if x == 4 : print x , y ; x = y, x`


    然而，在你使用切片（slice）时，冒号类似于二元运算符，两边应该包含等量的空格。当你使用扩展切片时，两个冒号必须包含完全相同的间距。例外情况是省略了切片参数以及相应的空格。


    ### 良好的示例：

    `spam[1:8], spam[3:2]; spam[8:2], spam[1:8]`

    `spam[lower:upper]; spam[lower:upper]; spam[lower:step]`

    `spam[lower+offset:upper+offset]`

    `spam[:upper_fn(x) : step_fn(x)]`

    `spam[lower + offset : upper + offset]`


    ### 糟糕的示例：

    `spam[lower+offset:upper + offset]`

    `spam[ 1:8], ham[1:8], ham[1:8:2]`

    `spam[ : upper]`

    `spam[: upper]`


    - 紧邻开始函数调用参数列表的左圆括号之前


    ### 良好的示例：

    `ham(1 )`


    ### 糟糕的示例：

    `ham (1)`


    - 紧邻开始切片或索引的左括号之前


    ### 良好的示例：

    `dct[''key''] = lst[index]`


    ### 糟糕的示例：

    `dct[''key''] = lst [index]`


    - 当运算符（如赋值运算符）周围有多个空格时，将其与另一个运算符对齐


    ### 良好的示例：

    ```python

    x = 1

    y = 2

    long_variable = 3

    ```


    ### 糟糕的示例：

    ```python

    x = 1

    y = 2

    long_variable = 3

    ```


    ## 其他建议


    避免在整个代码中出现行尾空格（trailing whitespace），因为它是不可见的，并且可能会导致混惑。例如，如果你输入一个反斜杠，后面跟一个空格然后换行——这不会被算作行延续。事实上，某些文本编辑器不会保留它，而且有些项目包含了预提交钩子（pre-commit
    hooks），它们会直接拒绝此类代码——其中之一就是 CPython。


    以下二元运算符应该被单个空格包围——每侧各一个：


    - 赋值 (=)

    - 复合赋值 (+=, = 等)


    以下比较运算符的对待方式相同：


    - =

    - <

    - >

    - !=

    - <>

    - <=

    - in

    - not in

    - is

    - is not


    以及这些布尔值：


    - and

    - or

    - not


    如果你使用了优先级不同的运算符，请考虑在优先级最低的运算符周围添加空格——在此处请根据你的最佳判断来操作。然而，你使用的空格不应超过一个，并确保运算符的每一侧都有等量的空格——不要在一侧放
    1 个在另一侧放 2 个：


    ### 良好的示例：

    ```python

    i = i + 1

    submitted += 1

    x = x*2 - 1

    hypot = x*x + y*y

    c = (a+b) * (a-b)

    ```


    ### 糟糕的示例：

    ```python

    i=i+1

    ubmitted+=1

    x = x*2 - 1

    hypot2 = x*x + y*y

    ```


    '
