    \ the `with` statement is far more efficient because it makes sure the file is\
    \ always closed when the block contains an exception.\n\n# Line Continuations\n\
    \nThere are accepted limits to logical lines and when you have one that is longer,\
    \ should be split up several lines. Your python interpreter will take consecutive\
