    \n-   与其使用将 lambda 表达式绑定到标识符的赋值语句，不如使用 `def` 语句。\n\n# 一个良的示例：\n```python\ndef\
    \ f(x): return 2*x\n```\n\n# 一个糟糕的示例：\n```python\nf = lambda x: 2*x\n```\n\n第一个示例显示，赋予函数对象的名称是\
    \ 'f' 而不是通用的 `<lambda>`。这对于字符串表示以及回溯跟踪（tracebacks）最为有用，而且通过使用赋值语句，你放弃了 lambda\
