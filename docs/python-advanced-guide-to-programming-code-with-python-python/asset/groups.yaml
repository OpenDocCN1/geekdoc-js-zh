    \ outlined in this book.\n\nBy reading this document, the reader agrees that under\
    \ no circumstances is the author responsible for any losses, direct or indirect,\
    \ which are incurred as a result of the use of information contained within this\
    \ document, including, but not limited to—errors, omissions, or inaccuracies.\n\
    \n# Introduction\n\nI want to thank you and congratulate you for reading the book,\
    \ \"Python: Best Practices to Programming Code with Python\". This book contains\
    \ proven steps and strategies on how to program in Python more effectively. When\
    \ you first learn Python, you will be taught how to write code, but in many cases,\
    \ you will not be taught how to write code neatly.\n\nIf you speak to any Python\
    \ programmer, ask them what it is like Python. I guarantee they will tell you\
    \ that one of the main reasons is because it is easily readable. In fact, this\
    \ is the absolute heart of the Python language, simply because computer code is\
    \ read far more than it is written. Much of this is down to the fact that Python\
    \ code follows a set of guidelines and \"Pythonic\" idioms – if you hear a programmer\
    \ refer to a part of the code as not being \"Pythonic\", it means it does not\
    \ follow those guidelines and it doesn't express intent in any manner.\n\nCode\
    \ style and layout are incredibly important, as is consistency in the style that\
    \ you use. With that, there are times when consistency isn't the right thing and\
    \ the guidelines are simply not applicable – you have to know when that time is\
    \ and when is best judgment comes into programming with Python.\n\nWith this guide,\
    \ I am going to show you the absolute best way to write your code, tidying up\
    \ your program and making it all more effective and efficient. I won't just give\
    \ you the basic. I will delve into everything you need to know, from the layout\
    \ of the code to how to write functions, idioms, and names.\n\nI will talk about\
    \ whitespaces and tabs, strings, and methods. I will also be giving you some general\
    \ recommendations for Python programming along with the general concepts. In short,\
    \ by the time you have read my Best Practice guide, you will be the best Python\
    \ programmer you can possibly be.\n\nMy book does assume some prior knowledge\
    \ of Python programming, so if you are a complete newbie to the programming scene,\
    \ please familiarize yourself with Python code before you read this book. My aim\
    \ is to help you produce Python code that is free from, or at least has very few,\
    \ complications or obvious problems, as well as making it more readable for others.\n\
    \nThanks again for reading this book, I hope you enjoy it!\n\n# Chapter 1: General\
    \ Concepts of Python Coding\n\nBefore we get properly into the book, these are\
    \ the general concepts of coding that you should be aware of; concepts that will\
    \ make life easier for you.\n\n## Explicit Code\n\nWhile you can do all sorts\
    \ of weird and wonderful things with Python, it is best to keep it straightforward\
    \ and explicit.\n\n### A Bad Example:\n\n```python\ndef make_complex(*args):\n\
    \    x, y = args\n    return dict(**locals())\n```\n\n### A Good Example:\n\n\
    ```python\ndef make_complex(x, y):\n    return {'x': x, 'y': y}\n```\n\nCompare\
    \ these examples; in the latter example of code, we explicitly received x and\
    \ y from the caller and the return is an explicit dictionary.\n\nThe developer\
    \ who wrote this knows what to do by looking at the first line and the last line;\
    \ this is not the case with the bad example.\n\n## One Line, One Statement\n\n\
    While there are compound statements, like the list comprehensions, that are allowed\
    \ and, in many cases, appreciated, it is not good practice to have 2 statements\
    \ that are disjointed on one code line.\n\n### A Bad Example:\n\n```python\nprint\
    \ 'one'; print 'two'\n\nif x == 1: print 'one'\n\nif <complex comparison> and\
    \ <other complex comparison>:\n# do something\n```\n\n### A Good Example:\n\n\
    ```python\nprint 'one'\nprint 'two'\n\nif x == 1:\n    print 'one'\n\ncond1 =\
    \ <complex comparison>\ncond2 = <other complex comparison>\nif cond1 and cond2:\n\
    \    # do something\n```\n\n## Returning Values\n\nWhen you get a function that\
    \ is ever-growing in complexity, it isn’t unheard of to use return statements.\
    \ However, if you want to maintain clear intent and a good level of readability,\
    \ you should try not to return values from several points.\n\nWhen it comes to\
    \ returning values within a function, there are 2 cases for doing so: the result\
    \ that comes normally, and for any reason that the function cannot complete properly.\
    \ In cases such as this, it is best practice to return as soon as the error has\
    \ been noticed.\n\nThis will help to neaten the function structure because all\
    \ code that comes after the return assumes that the condition has been met so\
    \ that the main result.\n\n### For Example:\n\n```python\ndef complex_function(c,\
    \ b, a):\n    if c:\n        return None # Raising an exception might be better\n\
    \    if b:\n        return None # Raising an exception might be better\n    #\
    \ Some elaborate code that is trying to make x from c, b and a\n    # Try not\
    \ to return x if successful\n    if a:\n        # A Plan-B calculation of x\n\
    \        return x # One exit point for the value x will be helpful\n        #\
    \ when trying to maintain the code.\n```\n\n# Chapter 2: Programming Recommendations\n\
    \nThese are the basic recommendations for writing Python code, recommendations\
    \ that you should follow if your code is going to be more effective and efficient\
    \ as well as being readable.\n\n- Your code must be written so that it doesn't\
    \ disadvantage other Python implementations, such as IronPython, Jython, PyPy,\
    \ Psyco and Cython.\n\nFor example, you should never rely on the efficient string\
    \ concatenation of CPython that takes the form of a=a+b or a+=b. This is a somewhat\
    \ fragile optimization, even though it super-efficient in CPython, it won't work\
    \ on all and won't be present in any Python implementation that does not use refcounting.\n\
    \nInstead, where you use a part of the library that the concatenation is performance-sensitive,\
    \ you should use the .join() form instead. This will make sure that the concatenation\
    \ is linear across all the different Python implementations.\n\n- Never use an\
    \ equality operator to make comparisons to a singleton such as None. Instead,\
    \ use is not.\n"
  mdcn: "\n\n# Python\n\n使用 Python 编写代码的最佳实践\n\n学习编写高效的 Python 程序代码！\n\n![](img/b4546bae7f745df072fcccf45e6153c9_0_0.png)\n\
    \nCHARLIE MASTERSON\n\n# Python:\n使用 Python \n编写代码的最佳实践\n\nCharlie Masterson\n\
    \n# 目录\n\n- 引言\n- 第 1 章：Python 编码通用概念\n- 第 2 章：编程建议\n- 第 3 章：代码布局\n- 第 4 章：习惯\n\
    - 第 5 章：注释\n- 第 6 章：约定\n- 第 7 章：方法与函数参数\n- 第 8 章：命名规范\n- 第 9 章：在语句和表达式中使用空格\n\
    - 结论\n- 关于作者\n\n未经作者直接书面许可，不得复制、复制或传输此书的内容。\n\n在任何情况下，对于因书中信息直接或间接导致的任何赔偿、损害或货币损失，出版商不承担任何法律责任或责任。\n\
    \n# 法律声明：\n\n本书受版权保护。本书仅供个人使用。未经作者同意，你不能修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\n# 免责声明：\n\
    \n请注意，本文档包含的信息仅供教育和娱乐目的。我们已尽一切提供准确、最新和可靠的信息。不提供任何形式的明示或暗示。读者承认，作者并未提供法律、财务、医疗或专业建议。本书的内容来源于各种来源。在尝试书中概述的任何技术之前，请咨询执业的专业人士。\n\
    \n通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不负责，包括但不限于——错误、遗漏或不准确。\n\n# 引言\n\
    \n感谢你的阅读，并祝贺你选择了《Python：使用 Python 编写代码的最佳实践》。这本书包含了关于如何更有效地进行 Python 编程的经过的步骤和策略。当你第一次学习\
    \ Python 时，他们会教你如何编写代码，但在很多情况下，他们不会教你如何编写整洁的代码。\n\n如果你和任何 Python 程序员交流，问问他们 Python\
    \ 是什么样的。我保证他们会告诉你，主要原因之一是因为它易于阅读。事实上，这是 Python 语言绝对的核心，因为计算机代码被阅读的次数远大于编写的次数。这在很大程度上归功于\
    \ Python 代码遵循一套指南和“Python 式”（Pythonic）习惯——如果你听到程序员提到代码的某部分不“Pythonic”，意味着它没有遵循这些指南，并且没有以任何方式表达意图。\n\
    \n代码风格和布局至关重要，你所使用的风格的一致性也是如此。尽管如此，有时一致性并不是正确的选择，而指南简单并不适用——你必须知道什么时候是那个时候，以及何时在进行\
    \ Python 编程时该做出最佳判断。\n\n通过本指南，我将向你展示编写代码的绝对最佳方法，整理你的程序并使其变得更加有效、高效。我不会只给你基础知识。我将深入探讨你需要了解的一切，从代码布局到如何编写函数、习惯和命名。\n\
    \n我将谈论空格和制表符、字符串和方法。我还会为你提供一些关于 Python 编程的通用建议以及通用概念。简而言之，当你读完我的最佳实践指南时，你将成为你能可能的最优秀的\
    \ Python 程序员。\n\n我的书假设你对 Python 编程有一定的先验知识，所以如果你是编程领域的完全新手，请在阅读本书之前熟悉 Python 代码。我的目标是帮助你产生没有复杂性或至少极少复杂性或明显问题的\
    \ Python 代码，并使其对他人更具可读性。\n\n再次感谢阅读本书，希望你喜欢它！\n\n# 第 1 章：Python 编码通用概念\n\n在我们正式进入书籍内容之前，这些是你应该注意的编码通用概念；这些概念将让你的生活变得更轻松。\n\
    \n## 显式代码\n\n虽然你可以用 Python 做各种奇奇百妙的事情，但最好保持简单直接和显式。\n\n### 一个糟糕的示例：\n\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    ### 一个良好的示例：\n\n```python\ndef make_complex(x, y):\n    return {'x': x, 'y': y}\n\
    ```\n\n比较这些示例；在后者的代码示例中，我们显式地从调用者处接收 x 和 y，返回是一个显式的字典。\n\n编写这段代码的开发者通过第一行和最后一行就知道要做什么；而糟糕的示例并非如此。\n\
    \n## 一行一个语句\n\n虽然允许并且在很多情况下受到欢迎的复合语句（如列表推导式），但在同一行代码上有两个互不关联的语句并不是好的做法。\n\n###\
    \ 一个糟糕的示例：\n\n```python\nprint 'one'; print 'two'\n\nif x == 1: print 'one'\n\n\
    if <complex comparison> and <other complex comparison>:\n# do something\n```\n\
    \n### 一个良好的示例：\n\n```python\nprint 'one'\nprint 'two'\n\nif x == 1:\n    print\
    \ 'one'\n\ncond1 = <complex comparison>\ncond2 = <other complex comparison>\n\
    if cond1 and cond2:\n    # do something\n```\n\n## 返回值\n\n当你获得一个不断增长复杂的函数时，使用\
    \ return 语句并不是罕见的。然而，如果你想保持清晰的意图和良好的可读性，你应该尽量不要从多个点返回值。\n\n在函数内部返回值时，有两种这样做的情况：正常的结果，以及任何导致函数无法正常完成的原因。在这种情况下，最佳实践是在注意到错误后立即返回。\n\
    \n这将有助于整洁函数结构，因为返回 之后的所有代码都假设条件已满足，从而得到主结果。\n\n### 示例：\n\n```python\ndef complex_function(c,\
    \ b, a):\n    if c:\n        return None # 抛异常可能更好\n    if b:\n        return\
    \ None # 抛异常可能更好\n    # 尝试从 c, b 和 a 创建 x 的复杂代码\n    # 如果成功则不要返回 x\n    if a:\n\
    \        # x 的方案 B 计算\n        return x # 为 x 提供单一出口点将很有帮助\n        # 在维护代码时\n\
    ```\n\n# 第 2 章：编程建议\n\n这些是编写 Python 代码的基础建议，如果你希望你的代码更有效、高效且具有可读性，你应该遵循这些建议。\n\
    \n- 你的代码编写方式不能让其他 Python 实现（如 IronPython, Jython, PyPy, Psyco 和 Cython）处于不利地位。\n\
    \n例如，你不应该依赖 CPython 中高效的字符串拼接（形式为 a+b 或 a+=b）。这是一种相当脆弱的优化，尽管它在 CPython 中超级高效，但在任何不使用引用数的\
    \ Python 实现中都无法工作。\n\n相反，当你在对拼接性能敏感的库部分时，你应该使用 .join() 形式。这将确保拼接在所有不同的 Python\
    \ 实现中都是线性的。\n\n- 永远不要使用等值运算符与 None 等单例进行比较。相反，使用 `is not`。\n\n"
