    # Other Recommendations


    Avoid trailing whitespace throughout your code because it is not visible and it
    can cause confusion. For example, if you put in a backslash and follow it with
    a space and then a newline – this would not be counted as a line continuation.
    In fact, some text editors will not preserve it and there are projects that contain
    pre-commit hooks that will simply reject it – one of those is CPython.


    The following binary operators should be surrounded by single spaces – one on
    each side:


    +   - assignment (=)

    - augmented assignment (+=, = etc.)


    The following comparisons are treated the same:


    +   - =

    - <

    - >

    - !=

    - <>

    - <=

    - =

    - in

    - not in

    - is

    - is not


    And these Booleans:


    +   - and

    - or

    - not


    If you use operators that have different priorities, think about putting whitespace
    around the lowest priority operators – use your best judgment here. However, you
    should not use any more than a single space and make sure that each side of the
    operator has the same amount of whitespace – don’t put 1 on side and 2 on the
    other:


    # A Good Example:


    ```

    i = i + 1

    submitted += 1

    x = x*2 - 1

    hypot = x*x + y*y

    c = (a+b) * (a-b)

    ```'
  - '[PAGE 56]


    # A Bad Example:


    ```

    i=i+1

    ubmitted+=1

    x = x*2 - 1

    hypot2 = x*x + y*y

    c = (a + b) * (a - b)

    ```


    When you use an = sign to indicate default values for parameters or keyword arguments,
    do not use whitespace around the sign:


    # A Good Example:


    ```

    def complex(real, imag=0.0):

    return magic(r=real, i=imag)

    ```


    # A Bad Example:


    ```

    def complex(real, imag = 0.0):

    return magic(r = real, i = imag)

    ```


    Use the standard rules for colons with function annotations and make sure there
    are spaces surrounding the -> if it is used:


    # A Good Example:


    ```

    def munge(input:AnyStr): ...

    def munge() -> AnyStr: ...

    ```


    # A Bad Example:


    ```

    def munge(input:AnyStr): ...

    def munge()->PosInt: ...

    ```


    When you combine a default value and an argument annotation, spaces should surround
    the = sign – do not do this unless the argument has both the default and the annotation:


    # A Good Example:


    ```

    def munge(sep: AnyStr = None): ...

    def munge(input:AnyStr, sep: AnyStr = None, limit=1000): ...

    ```


    # A Bad Example:


    ```

    def munge(input:AnyStr=None): ...

    def munge(input:AnyStr, limit = 1000): ...

    ```


    It is not good practice to use compound statements – several statements on one
    line:


    # A Good Example:


    ```

    if foo ====''that'':

    do_that_thing()

    do_one()

    do_two()

    do_three()

    ```


    # Best Not to Do:'
  - '[PAGE 57]


    ```

    if foo == ''that'': do_that_thing()

    do_one(); do_two(); do_three()

    ```


    It is, on occasion, alright to use an if, for and while statement on one line,
    provided they have small bodies but you should never do this for statements that
    have several clauses. Also, never fold really long lines:


    # Best Not to Do:


    ```

    if foo == ''that'': do_that_thing()

    for x in list: total += x

    while t < 10: t = delay()

    ```


    # Most Definitely Not:


    ```

    if foo == ''that'': do_that_thing()

    else: do_non_that_thing()

    ```


    ```

    try: something()

    finally: cleanup()

    ```


    ```

    do_one(); do_two(); do_three(long, argument,

    list, like, this)

    ```


