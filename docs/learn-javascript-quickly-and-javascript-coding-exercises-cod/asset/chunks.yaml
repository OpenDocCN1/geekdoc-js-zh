    JavaScript\"));\n```\nOutput: ecouserjwtpircavaJ\n\n### Replace every character\
    \ with the character following it in the alphabet\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>JavaScript program to\
    \ replace every character in a given string with the character following it in\
    \ the alphabet.</title>\n</head>\n<body></body>\n</html>\n```\n```javascript\n\
    function LetterChanges(text){\n    var s = text.split('');\n    for (var i = 0;\
    \ i < s.length; i++) {\n        // Caesar ciphers\n        switch(s[i]) {\n  \
    \          case ' ':break;\n            case 'z':s[i] = 'a';break;\n         \
    \   case 'Z':s[i] = 'A';break;\n            default:s[i] = String.fromCharCode(1\
    \ + s[i].charCodeAt(0));\n        }\n        // Upper-case vowels\n        switch(s[i])\
    \ {\n            case 'a': case 'e': case 'i': case 'o': case 'u':\n         \
    \   s[i] = s[i].toUpperCase();\n        }\n    }\n    return s.join('');\n}\n\
    console.log(LetterChanges(\"PYTHON\"));\nconsole.log(LetterChanges(\"W3R\"));\n\
    console.log(LetterChanges(\"php\"));\n```\nOutput: QZUIPOX4SqIq\n\n### Capitalize\
