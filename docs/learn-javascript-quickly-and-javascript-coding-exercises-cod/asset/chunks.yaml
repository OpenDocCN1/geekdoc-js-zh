    \ : \" + emp.lastName);\n}\nvar emp1 = new Employee( 1 , \"Sailaja\" , \"PTR\"\
    \ );\nprint_employee_info(emp1);\n```\nOutput:\nid : 1\nfirstName : Sailaja\n\
    lastName : PTR\n\n## Javascript: Define class using class expressions\nYou can\
