  trans: "\n\n# 复合运算符\n\n## Javascript: 三元运算符\n三元运算符 `(?: )` 根据条件返回两个表达式中的一个。\n\n\
    ### 语法\n```\ntest ? expression1 : expression2\n```\n如果 `test` 条件求值为真，则返回 `expression1`，否则返回\
    \ `expression2`。\n\n### 示例\n```javascript\nvar x = prompt(\"Enter an Integer\"\
    , \"100\");\nvar y = (x > 10)? \"x is greater than 10\": \"x is less than 11\"\
    ;\n```\n如果你输入的一个值 `> 10`，则 `y` 被赋值为消息 `\"x is greater than 10\"`；否则，`y` 被赋值为消息\
    \ `\"x is less than 11\"`。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>\
    \ 三元运算符 </title>\n</head>\n<body>\n    <script type= \"text/javascript\" >\n \
    \       var x = prompt( \"Enter an Integer\" , \"100\" );\n        var y = (x\
    \ > 10 ) ? \"x is greater than 10\" : \"x is less than 1\" ;\n        document\
    \ .write( \"value of x is \" + x + \"<br />\" );\n        document .write(y);\n\
    \    </script>\n</body>\n</html>\n```\n\n## Javascript: 与布尔值操作\n以下值被视为 `false`：\n\
    a. `undefined`\nb. `Null`\nc. `0`、`-0` 或 `NaN`\n\n所有未提到的上述值都被视为 `true`。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title> true and false </title>\n</head>\n\
    <body>\n    <script type= \"text/javascript\" >\n        var x = \"\" ;\n    \
    \    var y = \"h\" ;\n        var z = 0 ;\n        if (x) {\n            document\
    \ .write( \"x is true\" + \"<br />\" );\n        } else {\n            document\
    \ .write( \"x is false\" + \"<br />\" );\n        }\n        if (y) {\n      \
    \      document .write( \"y is true\" + \"<br />\" );\n        } else {\n    \
    \        document .write( \"y is false\" + \"<br />\" );\n        }\n        if\
    \ (z) {\n            document .write( \"z is true\" + \"<br />\" );\n        }\
    \ else {\n            document .write( \"z is false\" + \"<br />\" );\n      \
    \  }\n    </script>\n</body>\n</html>\n```\n\n## Javascript: 决策：if, if-then\n\n\
    ### if 语句\n`if` 告诉程序当条件求值为真时执行部分代码。\n\n### 语法\n```javascript\nif(condition){\n\
    \    // 如果条件为真则执行\n}\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>\
    \ if 语句 </title>\n</head>\n<body>\n    <script type= \"text/javascript\" >\n \
    \       var a = prompt( \"Enter any Integer\" , 100 );\n        if (a % 2 == 0\
    \ ) {\n            document .write( \"You entered even number\" );\n        }\n\
    \    </script>\n</body>\n</html>\n```\n在浏览器中打开上面的 html 文件，它会提示输入。如果你输入偶数，它会打印消息\
    \ `'You entered even number'`，否则什么都不打印。\n\n### if-else 语句\n如果条件为真，则执行 if 块代码；否则执行\
    \ else 块代码。\n\n### 语法\n```javascript\nif(condition){}else{}\n```\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title> if-else 语句 </title>\n</head>\n<body>\n\
    \    <script type= \"text/javascript\" >\n        var a = prompt( \"Enter any\
    \ Integer\" , 100 );\n        if (a % 2 == 0 ) {\n            document .write(\
    \ \"You entered even number\" );\n        } else {\n            document .write(\
    \ \"You odd number\" );\n        }\n    </script>\n</body>\n</html>\n```\n在浏览器中打开上面的\
    \ html，它会提示输入。如果你输入偶数，它会打印消息 `'You entered number'`，否则它打印 `\"You odd number\"\
    `。\n\n### Javascript: if-else-if 阶梯\n在我的之前的文章中，我解释了语句和 if-else 语句。除了这些之外，Javascript\
    \ 提供了 if-else if 阶梯，用于选择解决方案。\n\n### 语法\n```javascript\nif(condition){\n    //\
    \ 语句块\n}else if(condition){\n    // 语句块\n}else{\n    // 语句块\n}\n```\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title> if-else-else 语句 </title>\n</head>\n\
    <body>\n    <script type= \"text/javascript\" >\n        var marks = prompt( \"\
    Enter marks\" ,100 );\n        if (marks < 35 ) {\n            document .write(\
    \ \"You are failed\" );\n        } else if (marks < 50 ) {\n            document\
    \ .write( \"You are passed and got third class\" );\n        } else if (marks\
    \ < 60 ) {\n            document .write( \"You are passed and got second class\"\
    \ );\n        } else if (marks < 70 ) {\n            document .write( \"You are\
    \ passed and got first class\" );\n        } else {\n            document .write(\
    \ \"You are passed and got distinction\" );\n        }\n    </script>\n</body>\n\
    </html>\n```\n\n## Javascript: 使用 switch 语句决策\nswitch 体被称为 switch 块。switch 块可以使用一个或多个\
    \ case 或 default 标签。switch 语句评估其表达式，然后执行匹配的 case。\n\n### 语法\n```javascript\nswitch(expression){\n\
    \    case expression1:\n        // 语句\n        break;\n    case expression2:\n\
    \        // 语句\n        break;\n    default:\n        // 语句\n}\n```\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title> switch 语句 </title>\n</head>\n<body>\n\
    \    <script type= \"text/javascript\" >\n        var day = parseInt (prompt(\
    \ \"Enter an integer between 1 and 7\" , 6 ));\n        switch (day) {\n     \
    \       case 1 :\n                document .write( \"Sunday\" );\n           \
    \     break;\n            case 2 :\n                document .write( \"Monday\"\
    \ );\n                break;\n            case 3 :\n                document .write(\
    \ \"Tueday\" );\n                break;\n            case 4 :\n              \
    \  document .write( \"Wednesday\" );\n                break;\n            case\
    \ 5 :\n                document .write( \"ThursDay\" );\n                break;\n\
    \            case 6 :\n                document .write( \"Friday\" );\n      \
    \          break;\n            case 7 :\n                document .write( \"Saturday\"\
    \ );\n                break;\n            default :\n                document\
    \ .write( \"You entered day\" );\n        }\n    </script>\n</body>\n</html>\n\
    ```\n在浏览器中打开上面的 html 页，它会提示输入。如果你输入 1，它打印 Sunday；如果你输入 2，它打印 Monday；如果你输入 3，它打印\
    \ Tueday；如果你输入 4，它打印 Wednesday；如果你输入 5，它打印 ThursDay；如果你输入 6，它打印 Friday；如果你输入 7，它打印\
    \ Saturday；对于其他输入，它打印 \"You entered day\"。\n\n## Javascript: 循环\n循环用于重复一段代码直到给定条件为真。JavaScript\
    \ 支持以下循环结构：\na. `while`\nb. `do…while`\nc. `for`\n\n### Javascript: while 循环\n\
    `while` 语句执行语句块直到表达式为真。\n\n### 语法\n```javascript\nwhile (expression) {\n    //\
    \ 语句\n}\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> while 循环\
    \ </title>\n</head>\n<body>\n    <script type= \"text/javascript\" >\n       \
    \ var number = parseInt (prompt( \"Enter a number\" , \"10\"));\n        document\
    \ .write( \"<h2>Even numbers from 0 to \" + number + \" are </h2>\" );\n     \
    \   var i = 0 ;\n        while (i <= number) {\n            document .write(i\
    \ + \"<br />\" );\n            i += 2 ;\n        }\n    </script>\n</body>\n</html>\n\
    ```\n在浏览器中打开上面的页面，它会提示输入，并打印从 0 到用户数字的所有偶数。\n\n### Javascript: do-while 循环\n`do-while`\
    \ 也是像 `while` 的循环结构，但它在循环的底部评估表达式。\n\n### 语法\n```javascript\ndo {\n    // 语句\n\
    } while (expression);\n```\n上面的语句执行语句块直到条件为真。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title> do-while 循环 </title>\n</head>\n<body>\n    <script type= \"\
    text/javascript\" >\n        var number = parseInt (prompt( \"Enter a number\"\
    \ , \"0\"));\n        document .write( \"<h2>Even numbers from 0 to \" + number\
    \ + \" are </h2>\" );\n        var i = 0 ;\n        do {\n            document\
    \ .write(i + \"<br />\" );\n            i += 2 ;\n        } while (i <= number);\n\
    \    </script>\n</body>\n</html>\n```\n在浏览器中打开上面的页面，它会提示输入，并打印从 0 到用户数字的所有偶数。\n\
    \n### Javascript: for 循环\n`for` 语句提供了一种紧凑的方法范围的方法。\n\n### 语法\n```javascript\n\
    for(initialization; condition; update){\n    // 要执行的语句\n}\n```\n`for` 循环执行语句直到条件求值为假。\n\
    a. `Initialization` 部分在循环开始时执行一次。\nb. `Condition` 部分在每次执行循环语句之前评估。\nc. `update`\
    \ 部分在循环执行完成后立即执行。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> for\
    \ 循环 </title>\n</head>\n<body>\n    <script type= \"text/javascript\" >\n    \
    \    var number = parseInt (prompt( \"Enter a number\" , \"10\" ));\n        document\
    \ .write( \"<h2>Even numbers from 0 to \" + number + \" are </h2>\" );\n     \
    \   for ( var i = 0 ; i <= number; i += 2 ) {\n            document .write(i +\
    \ \"<br />\" );\n        }\n    </script>\n</body>\n</html>\n```\n在浏览器中打开上面的页面，它会提示输入，并打印从\
    \ 0 到用户数字的所有偶数。\n\n### Javascript: break 语句\n我们已经见过 `switch` case 中 `break` 的用法。同样，`break`\
    \ 用于 `while`、`do-while` 和 `for` 循环以跳出循环。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title> while 循环 </title>\n</head>\n<body>\n    <script type= \"text/javascript\"\
    \ >\n        var number = parseInt (prompt( \"Enter a number less than100\" ,\
    \ \"10\"));\n        document .write( \"<h2>Even numbers from 0 to \" + number\
    \ + \" are </h2>\" );\n        var i = 0 ;\n        while (i <= number) {\n  \
    \          if (number >= 100 ) {\n                document .write( \"Input should\
    \ be <100\" );\n                break ;\n            }\n            document .write(i\
    \ + \"<br />\" );\n            i += 2 ;\n        }\n    </script>\n</body>\n</html>\n\
    ```\n在浏览器中打开上面的页面，它会提示输入。如果你输入一个 `>=100` 的数字，它会打印 \"Input should be <100\" 并跳出循环；否则它打印从\
    \ 0 到数字的所有偶数。\n\n### Javascript: continue 语句\n`continue` 语句跳过 `for`、`while`、`do-while`\
    \ 循环的当前迭代。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> continue 语句\
    \ </title>\n</head>\n<body>\n    <script type= \"text/javascript\" >\n       \
    \ var number = parseInt (prompt( \"Enter a number lessthan10\" , \"0\"));\n  \
    \      document .write( \"<h2>Even numbers from 0 to \" + number + \" are </h2>\"\
    \ );\n        var i = 0 ;\n        while (i <= number) {\n            if ((i %\
    \ 4 ) == 0 ) {\n                i += 2 ;\n                continue ;\n       \
    \     }\n            document .write(i + \"<br />\" );\n            i += 2 ;\n\
    \        }\n    </script>\n</body>\n</html>\n```\n在浏览器中打开上面的页面，它会提示输入，并打印直到数字不被\
    \ 4 整除的所有偶数。\n\n## Javascript: label 中的 break\n`label` 是由 `name` 标识的语句组。\n\n###\
    \ 语法\n```javascript\nlabelName:{\n    statement 1\n    statement 2\n    ....\n\
    \    statement N\n}\n```\n`break` 在标签形式也可用。\n\n### 语法\n```javascript\nbreak labelName;\n\
    ```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> break label 示例 </title>\n\
    </head>\n<body>\n    <script type= \"text/javascript\" >\n        outer :\n  \
    \      for ( var i = 0 ; i < 10 ; i ) {\n            inner : for ( var j = 0 ;\
    \ j < 10 ; j ) {\n                document .write(i + \",\" + j + \"<br />\" );\n\
    \                if (i * j > 10 )\n                    break outer;\n        \
    \    }\n        }\n    </script>\n</body>\n</html>\n```\n\n## Javascript: for\
    \ in 循环\n`for in` 循环用于获取对象的可枚举属性。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title> for in loop 示例 </title>\n</head>\n<body>\n    <script>\n        var\
    \ employee = {\n            firstName : \"Hari Krishna\" ,\n            lastName\
    \ : \"Gurram\" ,\n            age : 26 ,\n            getDetails : function ()\
    \ {\n                return \"[firstName = \" + firstName + \", lastName = \"\
    \ + lastName + \"]\";\n            }\n        }\n        for (property in employee)\
    \ {\n            document .write(property + \" : \" + employee[property] + \"\
    <br />\" );\n        }\n    </script>\n</body>\n</html>\n```\n在浏览器中打开上面的页面，你可以看到以下文本。观察输出，`for\
    \ in` 循环没有显示 `toString` 等内置属性，因为内置方法不是枚举的。由于数组也是 JavaScript 中的一种特殊对象，你可以使用 `for\
    \ in` 遍历数组。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> for in 循环\
    \ </title>\n</head>\n<body>\n    <script>\n        var arr = [ \"Hari Krishna\"\
    \ , \"Gurram\" , 26 ];\n        for (index in arr) {\n            document .write(index\
    \ + \" : \" + arr[index] + \"<br />\" );\n        }\n    </script>\n</body>\n\
    </html>\n```\n在浏览器中打开上面的页面，你可以看到：0 : Hari Krishna\n1 : Gurram\n2 : 26\n\n### Javascript:\
    \ for-of 循环\n`for-of` 循环用于迭代可迭代对象，如 `String`、`Array`、`TypedArray` 和 `Set`。\n\n\
    ```javascript\nvar arr = [ 2 , 3 , 5 , 7 ,1 , 3 ];\nfor ( var i of arr) {\n  \
    \  console.log(i);\n}\n```\n输出: 2357113\n\n### Javascript: 获取变量类型\nJavascript\
    \ 提供了 `typeof` 运算符来获取变量类型。\n\n### 语法\n```javascript\ntypeof variable\n```\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> 变量类型 </title>\n</head>\n\
    <body>\n    <script type= \"text/javascript\" >\n        var a = 10 ;\n      \
    \  var b = 10 ;\n        var c = true ;\n        var d = \"Hello\" ;\n       \
    \ var e = new String ( \"Hello\" );\n        document .write( \"a = \" + a + \"\
    , type = \" + typeof (a) + \"<br />\" );\n        document .write( \"b = \" +\
    \ b + \", type = \" + typeof (b) + \"<br />\" );\n        document .write( \"\
    c = \" + c + \", type = \" + typeof (c) + \"<br />\" );\n        document .write(\
    \ \"d = \" + d + \", type = \" + typeof (d) + \"<br />\" );\n        document\
    \ .write( \"e = \" + e + \", type = \" + typeof (e) + \"<br />\" );\n    </script>\n\
    </body>\n</html>\n```\n\n## Javascript: 字符串操作\n字符串是字符的集合。与其他语言不同，JavaScript 没有任何数据类型来表示字符。\n\
    \n### 如何定义字符串？\n使用单引号或双引号包裹字符。\n```javascript\nvar str1 = \"Hello\";\nvar str2\
    \ = 'World';\n```\n也可以通过 `String` 对象创建字符串。\n```javascript\nvar str3 = new String(\"\
    Hello\");\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> 字符串 </title>\n\
    </head>\n<body>\n    <script type= \"text/javascript\" >\n        var str1 = \"\
    Good Morning\" ;\n        var str2 = 'Good Afternoon' ;\n        var str3 = new\
    \ String ( \"Good Night\" );\n        document .write(str1 + \"<br />\");\n  \
    \      document .write(str2 + \"<br />\");\n        document .write(str3 + \"\
    <br />\");\n    </script>\n</body>\n</html>\n```\n\n## Javascript: 嵌套函数\n你可以在函数内部定义函数。嵌套函数可以访问外部函数中定义的变量。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> 嵌套函数 </title>\n</head>\n\
    <body>\n    <script type= \"text/javascript\" >\n        function descriminator(a,\
    \ b, c) {\n            return (square(b) - 4 * c) / twice(a);\n        }\n   \
    \     function square(x) {\n            return (x * x);\n        }\n        function\
    \ twice(x) {\n            return 2 * x;\n        }\n        document .write( \"\
    Discriminator of 5, 10, 3 is : + descriminator(5, 10, 3));\n    </script>\n</body>\n\
    </html>\n```\n变量作用域：嵌套函数可以访问父函数中定义的变量以及父函数有权访问的变量。\n\n## Javascript: 数组\n数组是元素的有序集合。\n\
    \n### 语法\n```javascript\nvar array = [elem1, elem2 ....N];\nvar array = new Array(size)\n\
    ```\n\n### 如何访问数组元素？\n通过索引表示法访问数组元素。索引从 0 开始。\n\n### 语法\n```javascript\narray[index]\n\
    arr[0] : 返回第一个元素\narr[1] : 返回第二个元素\n…..arr[n] : 返回 n-1 个元素\n```\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title> 数组 </title>\n</head>\n<body>\n    <script\
    \ type= \"text/javascript\" >\n        var arr = [ 2 , \"Hello\" ,123.5 , true\
    \ ];\n        document .write( \"arr[0] : \" + arr[0] + \"<br />\" );\n      \
    \  document .write( \"arr[1] : \" + arr[1] + \"<br />\" );\n        document .write(\
    \ \"arr[2] : \" + arr[2] + \"<br />\" );\n         . .write( \"arr[3] : \" + arr[3]\
    \ + \"<br />\" );\n        document .write( \"arr[4] : \" + arr[4] + \"<br />\"\
    \ );\n        document .write( typeof arr);\n    </script>\n</body>\n</html>\n\
    ```\n在浏览器中打开上面的页面，你可以看到以下数据：\n0 : 2\n1 : Hello\n2 : 123.5\n3 : true\n4 : undefined\n\
    \n### 数组中的最大索引是多少？\nJavaScript 数组使用 32 位的索引。因此最大的数组索引是 `((2³²)-2) = 4294967294`（因为数组是零索引的）。\n\
    \n## Javascript: 类介绍\n类被用于创建对象。让我尝试用一个例子来解释。\n\n```javascript\nclass Employee\
    \ {\n    constructor(id, firstName, lastName){\n        this.id = id;\n      \
    \  this.firstName = firstName;\n        this.lastName = lastName;\n    }\n}\n\
    ```\n如你所看到的代码片段，我定义了一个 `Employee` 类，它有 3 个属性 `id`、`firstName` 和 `lastName`。\n\
    a. `class` 关键字用于创建类。\nb. `constructor` 函数用于初始化属性。\n你可以使用 `new` 运算符结合 `constructor`\
    \ 函数来创建对象。\n\n```javascript\nclass Employee {\n    constructor(id, firstName,\
    \ lastName){\n        this.id = id;\n        this.firstName = firstName;\n   \
    \     this.lastName = lastName;\n    }\n}\nvar emp1 = new Employee(1, \"John\"\
    , \"Doe\");\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title> 类的介绍\
    \ </title>\n</head>\n<body>\n    <script type= \"text/javascript\" >\n       \
    \ class Employee {\n            constructor(id, firstName, lastName){\n      \
    \          this.id = id;\n                this.firstName = firstName;\n      \
    \          this.lastName = lastName;\n            }\n        }\n        function\
    \ print_employee_info(emp){\n            console.log(\"id : \" + emp.id);\n  \
    \          console.log(\"firstName : \" + emp.firstName);\n            console.log(\"\
    lastName : \" + emp.lastName);\n        }\n        var emp1 = new Employee(1,\
    \ \"John\", \"Doe\");\n        print_employee_info(emp1);\n    </script>\n</body>\n\
    </html>\n```\n\n## Javascript: 使用表达式定义类\n你可以使用表达式来定义类。\n\n```javascript\nvar MyEmployee\
    \ = class {\n    constructor(id, firstName, lastName){\n        this.id = id;\n\
    \        this.firstName = firstName;\n        this.lastName = lastName;\n    }\n\
    };\n```\n\n## Javascript 编码练习\n\n### 显示当前日期和时间\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <title>JavaScript 当前日期和时间</title>\n\
    </head>\n<body></body>\n</html>\n```\n```javascript\nvar today = new Date();\n\
    var day = today.getDay();\nvar daylist = [\"Sunday\",\"Monday\",\"Tuesday\",\"\
    Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"];\nvar hour = today.getHours();\n\
    var minute = today.getMinutes();\nvar second = today.getSeconds();\nvar prepand\
    \ = (hour >= 12)? \" PM \":\" AM \";\nhour = (hour >= 12)? hour - 12: hour;\n\
    console.log(\"Today is : \" + daylist[day] + \".\");\nconsole.log(\"Current Time\
    \ : \"+hour + prepand + \" : + minute + \" \" + second);\n```\n\n### 查找三角形面积\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>三角形的面积</title>\n\
    </head>\n<body></body>\n</html>\n```\n```javascript\nvar side1 = 5;\nvar side2\
    \ = 6;\nvar side3 = 7;\nvar s = (side1 + side2 + side3)/2;\nvar area = Math.sqrt((s-side1)*(s-side2)*(s-side3));\n\
    console.log(area);\n```\n\n### 检查给定年份是否为闰年\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <title>闰年</title>\n</head>\n<body></body>\n\
    </html>\n```\n```javascript\nfunction leapyear(year){\n    return (year % 100\
    \ === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\nconsole.log(leapyear(2016));\n\
    console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
    ```\nOutput: true true false false\n\n### 计算两个数字的乘法和除法\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>两个数字的乘法和除法</title>\n\
    </head>\n<body>\n    <form>\n        1st Number : <input type=\"text\" id=\"firstNumber\"\
    \ /><br>\n        2nd Number: <input type=\"text\" id=\"secondNumber\" /><br>\n\
    \        <input onClick=\"multiplyBy()\" Value=\"Multiply\" />\n        <input\
    \ onClick=\"divideBy()\" Value=\"Divide\" />\n    </form>\n    <p>The Result is\
    \ : <br><span id=\"result\"></span></p>\n</body>\n</html>\n```\n```javascript\n\
    function multiplyBy(){\n    var num1 = document.getElementById(\"firstNumber\"\
    ).value;\n    var num2 = document.getElementById(\"secondNumber\").value;\n  \
    \  document.getElementById(\"result\").innerHTML = num1 * num2;\n}\nfunction divideBy(){\n\
    \    var num1 = document.getElementById(\"firstNumber\").value;\n    var num2\
    \ = document.getElementById(\"secondNumber\").value;\n    document.getElementById(\"\
    result\").innerHTML = num1 / num2;\n}\n```\n\n### 将温度从摄氏转换为华氏\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>温度从摄氏转换为华氏</title>\n\
    </head>\n<body></body>\n</html>\n```\n```javascript\nfunction cToF(celsius){\n\
    \    var cTemp = celsius;\n    var cToF = cTemp * 9 / 5 + 32;\n    var message\
    \ = cTemp+'C is ' + cToF + '°F.';\n    console.log(message);\n}\nfunction fToC(fahrenheit){\n\
    \    var fTemp = fahrenheit;\n    var fToCel = (fTemp - 32) * 5 / 9;\n    var\
    \ message = fTemp+'F is ' + fToCel + '°C.';\n    console.log(message);\n}\ncToF(60);\n\
    fToC(45);\n```\nOutput: 60°C is 140°F.,45°F is 22.2222222222°C.\n\n"
