    ```javascript

    document.write("Hello World");

    ```

    Above statement gives instruction to the browser to write "Hello World". Java
    Script is embedded between `<script></script>` tags.


    ## Javascript: Variables


    Variable `Variable` holds a value. Following are some of the examples of variables.


    ```javascript

    var name = "Krishna"

    var id=123

    ```

    Above statements define two variables `name`, `id`. ‘`var` keyword is used to
    define variables.


    ### Naming constraints

    a. Variable name must begin with any alphabet, `_` (or) `$`.

    b. Variable name can contain any character.

    c. Spaces are not allowed between variable names.

    d. Don’t use Javascript keywords as variable names.

    e. Variable names are case sensitive. `Name`, `NAme`, `name` are three different
    variables.


    ```html

    <!DOCTYPE html><html><head><title>Variables</title></head><body><script type="text/javascript">var
    name = "Krishna" ;var id=123;document.write("name = " + name + "<br />");document.write("id
    = " + id);</script></body></html>

    ```

    ![image_rsrc3JZ.jpg]

    Javascript is case sensitive, so `banana`, `BaNa` are different.


    ## Javascript: Statements


    Statement is an executable statement, statements in Javascript are terminated
    using `;`.


    ```html

    <!DOCTYPE html><html><head><title>Variables</title></head><body><script type="text/javascript">document.write("Hello
    World" + "<br />");document.write("");</script></body></html>

    ```

    In the above example, below are statements.


    ```javascript

    document.write("Hello World" + "<br />");

    document.write("");

    ```

    ![image_rsrc3K.jpg]


    Comments are used to document the source code. In JavaScript, makes the program
    more readable. Suppose you written thousand lines of program without proper documentation,
    after some time, it is very difficult to figure out what was written. By using
    comments, you can document your code at the time of writing program. Comments
    won''t affect program execution. Comments simply document your code.


    ### Javascript support 2 kinds of comments

    a. Single line comments

    b. Multi line comments


    #### Single line comment

    Single line comments starts with `//` It is a single line comment


    #### Multi Line comment

    Multi line comments are encoded in `/* ... */`.


    ```html

    /* I am a multiline comment */

    ```

    <!DOCTYPE html><html><head><title>Variables</title></head><body><script type="text/javascript">/*JavaScript
    is weakly typed*/var a = 10;document.write("Value of a is " + a + "<br />");a
    = "Hello World"; // Assigning stringdocument.write("Value of a is " + a + "<br
    />");a = true; // Assigning booleandocument.write("Value of a is " + a + "<br
    />");a = 10.0; // Assigning numberdocument.write("Value of a is " + a + "<br />");</script></body></html>

    ```


    ## JavaScript: Types


    Types are used to represent the type of data. Primarily, there are two categories
    of types:

    a. Primitive types: Numbers, strings and Boolean values considered as primitive
    types. In addition to these, special values `null`, `undefined` also considered
    as primitive types.

    b. Reference Types: Objects and arrays are considered as reference types. An object
    is a collection of name and value pairs. Array is a collection of elements. One
    more thing to note is that JavaScript treats functions also objects.


    ```html

    <!DOCTYPE html><html><head><title>Data Types</title></head><body><script >var
    a = 10;var b = 10.0;var c = true;var d = "Hello World";var e = {name : "Hari krishna",city
    : "Bangalore"};var f = [2, 3, 5, 7];document.write("a = " + a + " Type of " +
    (typeof a) + "<br />");document.write("b = " + b + " Type of " + (typeof b) +
    "<br />");document.write("c = " + c + " Type of " + (typeof c) + "<br />");document.write("d
    = " + d + " Type of " + (typeof d) + "<br />");document.write("e = " + e + " Type
    of " + (typeof e) + "<br />");document.write("f = " + f + " Type of " + (typeof
    f) + "<br />");</script></body></html>

    ```

    Open above page in browser, you can able to see following messages in the html
    page:

    - `a = 10` Type of number

    - `b = 10.0` Type of number

    - `c = true` Type of boolean

    - `d = Hello World` Type of string

    - `e = [object Object]` Type of object

    - `f = 2,3,5,7` Type of object


    As you see the output, JavaScript treats both integer and float values as type
    number and arrays, objects are treated as type object.


    ## Javascript: operators


    An operator is a symbol which perform an operation. An operator is said to be
    unary, if it performs operation on single operand. An operator is said to be binary,
    if it performs operation on two operands. An Operator is said to be ternary if
    it perform operation on three operands. Javascript provides following operators:

    a. Arithmetic operators

    b. Increment/decrement: `++`, `--`

    c. Bitwise operators

    d. Logical operators

    e. Assignment operators

    f. String concatenation

    g. Comparison operators

    h. Other operators like `===` (Strict comparison), `?:`


    ### Javascript: Arithmetic Operators


    Following table summarizes Arithmetic operators supported by Javascript.


    | Operator | Description |

    | :--- | :--- |

    | `+` | Addition (also used for String concatenation) |

    | `-` | Subtraction |

    | `/` | Division |

    | `*` | Multiplication |

    | `%` | Gives Remainder |


    ```html

    <!DOCTYPE html><html><head><title> Arithmetic Operators </title><style>p { font-size
    : 2em ; color : seagreen ;}</style></head><body><p><script type= "text/javascript"
    >var a = 23 ;var b = 3 ; document .write( "a = " + a + "<br />" );document .write(
    "b = " + b + "<br />" );document .write( "a+b = " + (a + b) + "<br />" );document
    .write( "a-b = " + (a - b) + "<br />" );document .write( "a*b = " + (a * b) +
    "<br />" );document .write( "a/b = " + (a / b) + "<br />" );document .write( "a%b
    = " + (a % b) + "<br />" );</script></p></body></html>

    ```

    Unlike Java, integer division in JavaScript returns float value.


    ### Increment/decrement: ++, -- operators


    Increment & decrement operators `++` operator; increments a value by 1. `--` operator;
    decrements a value by 1.


    #### Pre increment

    Syntax: `++variable`. Pre increment increments the variable value by 1 immediately.


    #### Post increment

    Syntax: `variable++`. Post increment increments the variable value by 1 after
    executing the statement.


    #### Pre Decrement

    Syntax: `--variable`. Pre decrement decrements the variable value by 1 immediately.


    #### Post Decrement

    Syntax: `variable--`. Post decrement decrements the variable value by 1 after
    executing the statement.


    ```html

    <!DOCTYPE html><html><head><title> Increment & Decrement Operators </title><style>p
    { font-size : 2em ; color : seagreen ;}</style></head><body><p><script type= "text/javascript"
    >var a = 23 ;var b = 3 ; document .write( "a = " + a + "<br />" );document .write(
    "a++ = " + (a ++ ) + "<br />" );document .write( "++a = " + ( ++ a) + "<br />"
    );document .write( "a-- = " + (a -- ) + "<br />" );document .write( "--a = " +
    ( -- a) + "<br />" );</script></p></body></html>

    ```


    ## Javascript: Bitwise operators


    Following table summarizes the bitwise operators supported by Javascript.


    | Operator | Description |

    | :--- | :--- |

    | `~` | Inverts bit pattern |

    | `<<` | Perform Left shift |

    | `>>` | Perform Right Shift |

    | `>>>` | Perform unsigned right shift |

    | `&` | Bitwise AND |

    | `\|` | Bitwise OR |

    | `^` | Bitwise Exclusive XOR |

    '
