    console.log(without_first_end('PHP'));\n```\nOutput: avaScripH\n\n### Concatenate\
    \ two strings Except their first character\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width\"\
