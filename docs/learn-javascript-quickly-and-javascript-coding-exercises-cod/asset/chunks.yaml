    \ lastName){\n        this.id = id;\n        this.firstName = firstName;\n   \
    \     this.lastName = lastName;\n    }\n}\n```\nAs you see above snippet, I defined\
    \ a class `Employee`, which has 3 properties `id`, `firstName`, `lastName`.\n\
    a. `class` keyword is used to create a class.\nb. `constructor` function is used\
    \ to initialize the properties.\nYou can define object to the class `Employee`\
    \ using `new` operator, followed by constructor function.\n```javascript\nvar\
    \ emp1 = new Employee(1, \"Sailaja\", \"PTR\");\n```\n\n```javascript\nclass Employee\
