    0000 1001a^b   = 0000 0001 (1 in decimal)bitwise.html<!DOCTYPE html><html><head>    
    <title> Bitwise Operators </title>     <style>         p {             font-size
    : 2em ;             color : seagreen ;        }     </style></head><body>    
    <p>         <script type= "text/javascript" >             var a = 7 ;            
    var b = 2 ;             var c = 128 ;             var d = - 128 ;            
    var e = 8 ;             var f = 9 ;             document .write( "a = " + a +
    "<br />" );             document .write( "~a = " + ~ a + "<br /><br />" );            
    document .write( "b = " + b + "<br />" );             document .write( "b << 1
    = " + (b << 1 ) + "<br />" );             document .write( "b << 2 = " + (b <<
    2 ) + "<br />" );             document .write( "b << 9 = " + (b << 9 ) + "<br
    /><br />" );             document .write( "c = " + c + "<br />" );            
    document .write( "c >> 1 = " + (c >> 1 ) + "<br />" );             document .write(
    "c >> 2 = " + (c >> 2 ) + "<br /><br />" );             document .write( "d =
    " + d + "<br />" );             document .write( "d >>> 1 = " + (d >>> 1 ) + "<br
    /><br />" );             document .write( "e = " + e + "<br />" );            
    document .write( "f = " + f + "<br />" );             document .write( "e&f =
    " + (e & f) + "<br />" );             document .write( "e|f = " + (e | f) + "<br
    />" );             document .write( "e^f = " + (e ^ f) + "<br />" );         </script>    
    </p></body></html>JavaScript: Logical operatorsJavaScript provides three logical
    operators, These are &&(AND), || (OR), and !(NOT)Logical AND is also called Conditional
    ANDLogical OR is also called Conditional ORLogical AND, OR are called Short circuit
    operators, will see why these are called short circuit soon.Logical AND Operator


    | Operand1 | Operand2 | Evaluates To |


    | true | true | true |


    | true | false | false |


    | false | true | false |


    | false | false | false |


    Why Logical AND is called short circuit operator?Since if the first statement
    in the expression evaluates to false, then Javascript won''t evaluates the entire
    expression.Logical OR Operator


    | Operand1 | Operand2 | Evaluates To |


    | true | true | true |


    | true | false | true |


    | false | true | true |


    | false | false | false |


    As shown in the above table, || operator returns true if any of the operand evaluates
    to true, otherwise returns false.Why Logical OR is called short circuit operator?Since
    if the first statement evaluates to true, then JavaScript won''t evaluates the
    entire expression.Logical (!)NOT operator


    | Operand | Evaluates To |


    | false | true |


    | true | false |


    If the operand is false, ! Operator evaluates it to trueIf the operand is true,
    ! Operator evaluates it to false.logical.html<!DOCTYPE html><html><head>     <title>
    Logical Operators </title>     <style>         p {             font-size : 2em
    ;             color : seagreen ;        }     </style></head><body>     <p>        
    <script type= "text/javascript" >             var a = true ;             var b
    = true ;             var c = false ;             var d = false ;             document
    .write( "a = " + a + "<br />" );             document .write( "b = " + b + "<br
    />" );             document .write( "c = " + c + "<br />" );             document
    .write( "d = " + d + "<br />" );             document .write( "a&&b = " + (a &&
    b) + "<br />" );             document .write( "a&&c = " + (a && c) + "<br />"
    );             document .write( "c&&d = " + (c && d) + "<br /><br />" );            
    document .write( "a||b = " + (a || b) + "<br />" );             document .write(
    "a||c = " + (a || c) + "<br />" );             document .write( "c||d = " + (c
    || d) + "<br />" );         </script>     </p></body></html>JavaScript: Assignment
    operatorsAssignment operator is used to assign value to a variable. Since JavaScript
    is weakly typed language, you can assign any type of value to a variable.Syntaxvar
    variableName = value;variables.html<!DOCTYPE html><html><head>     <title> Variables
    </title></head><body>     <script type= "text/javascript" >         var a = 10
    ;         document .write( "Value of a is " + a + "<br />" );        a = "Hello
    World" ; // Assigning string         document .write( "Value of a is " + a + "<br
    />" );        a = true ; // Assigning boolean         document .write( "Value
    of a is " + a + "<br />" );        a = 10.09 ; // Assigning number         document
    .write( "Value of a is " + a + "<br />" );     </script></body></html>JavaScript:
    Compound Assignment operatorJavaScript supports compound assignments    Compound
    Assignment      Syntax:         variable operator= value      Example:         lets
    say         var a = 10;         a+=10 evaluates to a=a+10


