- md: "## COMPUTER SCIENCE\nUNCOMMON QUIZ QUESTIONS IN JAVASCRIPT FOR COLLEGE\n2022-2023\n\
    \n- TEST\n- QUIZ\n- INTERVIEWS\n\n- Live AP Classes to Improve\n- Learn & Grow\
    \ with Community\n- AP Practice Tests with detailed Answer Explanations\n\n**AUTHOR:**\
    \ Joseph Wobus\n\nGET A 5 ON YOUR COMPUTER SCIENCE EXAMS\n\n# AP QUESTIONS IN\
    \ JAVASCRIPT FOR COLLEGE TESTS-QUIZ-INTERVIEWS\n\nComputer Science (CS) questions\
    \ are designed to challenge the high school students pursuing AP computer science\
    \ to excel. The questions are given to test the fundamentals of Java, JavaScript,\
    \ Python, and object-oriented programming concepts.\n\nThis volume is covering:\n\
    \n- MAP\n- Stack\n- Arrays and Loops\n- Data Type - Object\n\n## ACKNOWLEDGEMENT\n\
    \nPoccomu is incredibly indebted to a large number of Professors and Academicians\
    \ who have helped us in this project. You are also welcome to be part of Poccomu\
    \ if you are passionate about the uncommon question. Email us info@poccomu.com\n\
    \n**Copyright © 2022 by Pal Consulting**\n\nAll rights reserved. No part of this\
    \ publication may be reproduced, distributed, or transmitted in any form or by\
    \ any means, including photocopying, recording, or other electronic or mechanical\
    \ methods, without the prior written permission of the publisher, except in the\
    \ case of brief quotations embodied in critical reviews and certain other noncommercial\
    \ uses permitted by copyright law. For permission requests, write to the publisher,\
    \ addressed “Attention: Permissions Coordinator,” at the address below.\n\n4500\
    \ Stone crest Drive\nEllicott City, MD\nEmail: info@poccomu.com\nVisit: https://poccomu.com\n\
    Printed in the United States of America\n\n## About The Authors\n\n### Joseph\
    \ Wobus:\n\nJoseph Wobus is a current software engineer in the United States.\
    \ He graduated from University of Maryland, College Park with a B.S. in Computer\
    \ Science in 2020 (CS@UMCP is among top 20 Computer Science Department in International\
    \ ranking), and has been working full time as a software engineer since then.\
    \ He began coding since early high school, and has since learned a multitude of\
    \ languages such as Java, Python, C++, C, JavaScript, and more.\n\nDuring his\
    \ last 2 years of college, he worked as a TA for one of the advanced CS courses\
    \ and worked closely with professors in assigning homework, grading tests, and\
    \ assisting other students debug code. In his free time, he enjoys playing basketball,\
    \ playing PC games, and going out with friends.\n\n### Dr. Biplab Pal:\n\nDr.\
    \ Biplab Pal has a Ph.D. in EE/ECE and MS/BS in Physics. He is CTO & Co-Founder\
    \ of leading IoT and Healthcare companies Machinesense and Opteev based out of\
    \ Baltimore, Maryland. He holds more than 30 US patents in IT/IoT/Sensor System\
    \ areas.\n\nHe also serves as an Adjunct Research Professor in Information Science\
    \ at the University of Maryland, at Baltimore Campus (UMBC).\n\n## Table of Contents\n\
    \n- [AP Tests/Quiz/Interviews: Vol-01](#)\n- [Answers](#)\n- [Explanation](#)\n\
    \n## DEDICATION\n\nPoccomu, in Latin, means uncommon. In this world of automation,\
    \ artificial intelligence (AI), and changing consumer preferences - the workplace\
    \ is changing rapidly. Are we preparing our next generation to handle those uncommon\
    \ situations? Will the new graduates be able to handle the uncertainty? Industry\
    \ leaders are concerned because the present-education system focuses on standardized\
    \ testing and rote learning, which is where POCCOMU comes in. Poccomu's methodology\
    \ of logic-based testing of STEM will help keep pace with the unique challenges\
    \ at the workplace. The idea of Poccomu is to push students to discover the power\
    \ of their logical thinking using the fundamental concepts they have learned in\
    \ STEM coursework when they encounter an uncommon problem. Poccomu is here to\
    \ push students to think out of the box to simplify and solve critical and distinctive\
    \ problems. Encouraging a young and motivated brain to think out of the box will\
    \ help them outperform in standardized tests and enhance their mental ability\
    \ to solve the most mysterious problem in their professional life.\n\n# AP Tests/Quiz/Interviews:\
    \ Vol-01\n\n## DATA TYPE – OBJECT MAP\n## ARRAYS AND LOOPS STACK\n\n1. In Python,\
    \ there exists a data type called a dictionary, which is essentially a collection\
    \ of key-value pairs enclosed within curly braces, which looks something like\
    \ this:\n\n```javascript\nStudent = {\n    \"name\": \"Ferris Bueller\",\n   \
    \ \"school\": \"Glenbrook North High School\",\n    \"city\": \"Chicago\"\n}\n\
    ```\n\nJavaScript has similar entities but is slightly different. These are called\
    \ Objects (with a capital ‘O’) in JavaScript. Which of the following is a correct\
    \ Object definition in JavaScript?\n\nA. var Student = {\n    \"name\": \"Ferris\
    \ Bueller\",\n    \"school\": \"Glenbrook North High School\",\n    \"city\":\
    \ \"Chicago\"\n}\n\nB. var Student = new Object();\nStudent.name = 'Ferris Bueller';\n\
    Student.school = 'Glenbrook North High School';\nStudent.city = 'Chicago';\n\n\
    C. var Student = {\n    name: \"Ferris Bueller\",\n    school: \"Glenbrook North\
    \ High School\",\n    city: \"Chicago\"\n}\n\nD. All of the above\n\n2. For any\
    \ given data in JavaScript (properties of an Object in this case), four attributes\
    \ define it. Identify the four properties correctly from the given list by selecting\
    \ the correct combination from the given options.\n\n- I. Iterable\n- II. Enumerable\n\
    - III. Writable\n- IV. Value\n- V. Readable/Writable\n- VI. Accessible\n\n- A.\
    \ II, III, V, and VI.\n- B. I, IV, V, and VI.\n- C. I, III, IV, and V.\n- D. None\
    \ of the above\n\n3. For a simple JavaScript code that updates the number of times\
    \ people visit your website, let's say you use a JavaScript data structure to\
    \ store this information in the following manner: {key: value}, where the key\
    \ is the first name of the person and the value is the time at which they visited\
    \ the website. Which data structure is ideal for this kind of situation? (Hint:\
    \ There are regularly multiple updates (add/delete) operations being carried out\
    \ on this data structure.)\n\n- A. A Map is better suited for this.\n- B. An Object\
    \ is better suited for this.\n- C. Neither Object nor Map is suitable.\n- D. Both\
    \ Object and Map are suitable.\n\n4. **The given set of statements contains a\
    \ blanked-out word, which will be replaced with either \"Object\" or \"Map\".\
    \ Identify the correct sequence of the words so that the statements are correctly\
    \ completed.**\n\nI. Insertion order for \\_\\_\\_\\_ keys was technically undefined\
    \ before ECMAScript 2015.\n\nII. The number of items in \\_\\_\\_\\_ must be determined\
    \ manually through iteration.\n\nIII. The keys of \\_\\_\\_\\_ do not necessarily\
    \ have to be either a String or a Symbol. It can be of other data types as well.\n\
    \nIV. A JavaScript \\_\\_\\_\\_ is not optimized for frequent additions and/or\
    \ removals of key-value pairs.\n\nV. There are no keys by default in \\_\\_\\\
    _\\_.\n\n- A. Object, Map, Map, Object, Object.\n- B. Map, Object, Object, Map,\
    \ Map.\n- C. Object, Object, Map, Object, Map.\n- D. Map, Map, Object, Object,\
    \ Map.\n\n5. **The given line of code creates a Date object in JavaScript and\
    \ obtains the current date and time:**\n\n```javascript\nvar current_Date = new\
    \ Date();\n```\n\nIn order to get the date in a format that is readable, a format\
    \ that looks like this: \"12/7/2020, 2:44:25 PM\", which of the following options\
    \ is correct?\n\n- A. console.log(current_Date)\n- B. console.log(current_Date.toLocaleString())\n\
    - C. console.log(current_Date.toString())\n- D. console.log(Date(current_Date))\n\
    \n6. The following code contains a JavaScript Map with some movies and their IMDb\
    \ popularity. Based on the given code, answer the question that follows.\n\n```javascript\n\
    movies = new Map();\nmovies.set(\"275\", \"Taxi Driver\");\nmovies.set(\"35\"\
    , \"Inception\");\nmovies.set(\"811\", \"Looper\");\nmovies.set(\"429\", \"Aliens\"\
    );\nmovies.set(\"691\", \"Independence Day\");\nmovies.set(\"77\", \"Mad Max:\
    \ Fury Road\");\n```\n\nIn order to rank the movies in ascending order of popularity,\
    \ which of the following lines of code is correct?\n\n- A. var mapAsc = new Map([...movies.entries()].sort());\n\
    - B. var mapAsc = new MapBetween([...movies()].sort());\n- C. var mapAsc = new\
    \ Map([...movies.keys()].sort());\n- D. None of the above.\n\n7. Suppose there\
    \ is a JavaScript entity that stores high school students' names and GPA scores.\
    \ Now, this gets updated continuously when the details of new students are added,\
    \ and every time this list of students and their scores have to be displayed,\
    \ it is sorted in ascending order of GPA and then displayed. Which of the following\
    \ is more suitable for creating such a dataset?\n\n- A. Map\n- B. Object\n- C.\
    \ Either A or B\n- D. Neither A nor B"
  mdcn: "\n## 计算机科学\n大学 JavaScript 不常见测验题\n2022-2023\n\n- 测试\n- 测验\n- 面试\n\n- 实时 AP\
    \ 课程提升\n- 与社区共同学习成长\n- 附带详细答案解析的 AP 模拟测试\n\n**作者：** Joseph Wobus\n\n在计算机科学考试中取得满分\
    \ 5 分\n\n# AP JavaScript 大学测试-测验-面试题\n\n计算机科学（CS）题目旨在激励选修 AP 计算机科学的高中生追求卓越。这些题目用于测试\
    \ Java、JavaScript、Python 以及面向对象编程概念的基础知识。\n\n本卷涵盖：\n\n- MAP\n- Stack\n- 数组与循环\n\
    - 数据类型 - 对象\n\n## 致谢\n\nPoccomu 非常感谢众多教授和学者在本项目中的帮助。如果您对不常见的题目充满热情，也欢迎加入 Poccomu。请发邮件至\
    \ info@poccomu.com\n\n**版权所有 © 2022 由 Pal Consulting 出品**\n\n保留所有权利。未经出版商事先书面许可，不得以任何形式或通过任何方式复制、分发或传播本出版物的任何部分，包括影印、录音或其他电子或机械方法，但批评性评论中引用的简短摘录以及版权法允许的某些其他非商业用途除外。如需许可请求，请致函出版商，地址如下，并注明\"\
    注意：许可协调员\"。\n\n4500 Stone crest Drive\nEllicott City, MD\n电子邮件：info@poccomu.com\n\
    访问：https://poccomu.com\n在美国印刷\n\n## 关于作者\n\n### Joseph Wobus：\n\nJoseph Wobus\
    \ 目前是美国的一名软件工程师。他于 2020 年毕业于马里兰大学帕克分校（University of Maryland, College Park），获得计算机科学学士学位（CS@UMCP\
    \ 在国际排名中位列前 20 名计算机科学系），此后一直全职担任软件工程师。他从高中早期就开始编程，此后学习了多种语言，如 Java、Python、C++、C、JavaScript\
    \ 等。\n\n在大学最后两年，他担任一门高级 CS 课程的助教，与教授密切合作，负责布置作业、批改试卷，并协助其他学生调试代码。闲暇时，他喜欢打篮球、玩\
    \ PC 游戏以及和朋友外出。\n\n### Biplab Pal 博士：\n\nBiplab Pal 博士拥有电气工程/电子与计算机工程的博士学位，以及物理学硕士和学士学位。他是总部位于马里兰州巴尔的摩的领先物联网和医疗公司\
    \ Machinesense 和 Opteev 的首席技术官兼联合创始人。他在 IT/物联网/传感器系统领域拥有超过 30 项美国专利。\n\n他还担任马里兰大学巴尔的摩分校（UMBC）信息科学系的兼职研究教授。\n\
    \n## 目录\n\n- [AP 测试/测验/面试：第一卷](#)\n- [答案](#)\n- [解析](#)\n\n## 献词\n\nPoccomu 在拉丁语中意为\"\
    不常见\"。在这个自动化、人工智能（AI）和消费者偏好不断变化的世界中，职场正在迅速变化。我们是否在为下一代应对这些不常见的情况做好准备？应届毕业生能否应对不确定性？业界领袖对此表示担忧，因为目前的教育体系侧重于标准化考试和死记硬背，而这正是\
    \ POCCOMU 的切入点。Poccomu 基于逻辑的 STEM 测试方法将有助于跟上职场的独特挑战。Poccomu 的理念是推动学生运用他们在 STEM\
    \ 课程中学到的基础概念，在遇到不常见问题时发掘逻辑思维的威力。Poccomu 旨在推动学生跳出思维定式，简化和解决关键而独特的问题。鼓励年轻而有动力的大脑跳出思维定式，将帮助他们在标准化考试中脱颖而出，并增强其心智能力，以解决职业生涯中最神秘的问题。\n\
    \n# AP 测试/测验/面试：第一卷\n\n## 数据类型 – 对象 MAP\n## 数组与循环 STACK\n\n1. 在 Python 中，存在一种称为字典（dictionary）的数据类型，它本质上是一组键值对的集合，用大括号括起来，看起来像这样：\n\
    \n```javascript\nStudent = {\n    \"name\": \"Ferris Bueller\",\n    \"school\"\
    : \"Glenbrook North High School\",\n    \"city\": \"Chicago\"\n}\n```\n\nJavaScript\
    \ 也有类似的实体，但略有不同。这些在 JavaScript 中被称为对象（Object，首字母大写）。以下哪一项是 JavaScript 中正确的对象定义？\n\
    \nA. var Student = {\n    \"name\": \"Ferris Bueller\",\n    \"school\": \"Glenbrook\
    \ North High School\",\n    \"city\": \"Chicago\"\n}\n\nB. var Student = new Object();\n\
    Student.name = 'Ferris Bueller';\nStudent.school = 'Glenbrook North High School';\n\
    Student.city = 'Chicago';\n\nC. var Student = {\n    name: \"Ferris Bueller\"\
    ,\n    school: \"Glenbrook North High School\",\n    city: \"Chicago\"\n}\n\n\
    D. 以上全部\n\n2. 对于 JavaScript 中的任何给定数据（在本例中是对象的属性），有四个属性定义它。请从给定列表中正确识别这四个属性，并从给定选项中选择正确的组合。\n\
    \n- I. 可迭代的（Iterable）\n- II. 可枚举的（Enumerable）\n- III. 可写的（Writable）\n- IV. 值（Value）\n\
    - V. 可读/可写（Readable/Writable）\n- VI. 可访问的（Accessible）\n\n- A. II、III、V 和 VI。\n\
    - B. I、IV、V 和 VI。\n- C. I、III、IV 和 V。\n- D. 以上皆非\n\n3. 对于一段简单的 JavaScript 代码，用于更新人们访问您网站的次数，假设您使用\
    \ JavaScript 数据结构以如下方式存储此信息：{key: value}，其中键是人的名字，值是他们访问网站的时间。哪种数据结构最适合这种情况？（提示：该数据结构经常需要进行多次更新（添加/删除）操作。）\n\
    \n- A. Map 更适合这种情况。\n- B. Object 更适合这种情况。\n- C. Object 和 Map 都不适合。\n- D. Object\
    \ 和 Map 都适合。\n\n4. **给定的一组陈述中包含一个空白单词，该单词将被替换为\"Object\"或\"Map\"。请识别出正确的单词序列，使陈述正确完整。**\n\
    \nI. 在 ECMAScript 2015 之前，\\_\\_\\_\\_ 键的插入顺序在技术上是未定义的。\n\nII. \\_\\_\\_\\_ 中的项目数量必须通过迭代手动确定。\n\
    \nIII. \\_\\_\\_\\_ 的键不一定是字符串或符号。它也可以是其他数据类型。\n\nIV. JavaScript \\_\\_\\_\\_ 未针对键值对的频繁添加和/或删除进行优化。\n\
    \nV. \\_\\_\\_\\_ 默认没有键。\n\n- A. Object, Map, Map, Object, Object.\n- B. Map,\
    \ Object, Object, Map, Map.\n- C. Object, Object, Map, Object, Map.\n- D. Map,\
    \ Map, Object, Object, Map.\n\n5. **给定的代码行在 JavaScript 中创建一个 Date 对象并获取当前日期和时间：**\n\
    \n```javascript\nvar current_Date = new Date();\n```\n\n为了获得可读格式的日期，格式如下：\"12/7/2020,\
    \ 2:44:25 PM\"，以下哪个选项是正确的？\n\n- A. console.log(current_Date)\n- B. console.log(current_Date.toLocaleString())\n\
    - C. console.log(current_Date.toString())\n- D. console.log(Date(current_Date))\n\
    \n6. 以下代码包含一个 JavaScript Map，其中包含一些电影及其 IMDb 热度。根据给定的代码，回答后面的问题。\n\n```javascript\n\
    movies = new Map();\nmovies.set(\"275\", \"Taxi Driver\");\nmovies.set(\"35\"\
    , \"Inception\");\nmovies.set(\"811\", \"Looper\");\nmovies.set(\"429\", \"Aliens\"\
    );\nmovies.set(\"691\", \"Independence Day\");\nmovies.set(\"77\", \"Mad Max:\
    \ Fury Road\");\n```\n\n为了按热度升序排列这些电影，以下哪行代码是正确的？\n\n- A. var mapAsc = new Map([...movies.entries()].sort());\n\
    - B. var mapAsc = new MapBetween([...movies()].sort());\n- C. var mapAsc = new\
    \ Map([...movies.keys()].sort());\n- D. 以上皆非。\n\n7. 假设有一个 JavaScript 实体存储高中生的姓名和\
    \ GPA 分数。现在，当新学生的详细信息被添加时，该实体会持续更新，并且每次显示学生及其分数列表时，都会按 GPA 升序排序，然后显示。以下哪项更适合创建这样的数据集？\n\
    \n- A. Map\n- B. Object\n- C. A 或 B 均可\n- D. A 和 B 均不可\n"
