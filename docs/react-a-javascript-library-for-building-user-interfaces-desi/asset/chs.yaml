  \n# 为什么它如此快\nReact 拥有 `Virtual DOM` 概念。为了让你了解更多，它通过编译后的输出创建 HTML，这是它的特征。为了让你了解更多，当你到达目的地时，页面没有刷新，数字只是神奇地改变了，让你很惊讶。为了让你了解更多，这种魔法使其在结束时达到真实的本质。\n\
  \n\n\n\n\n# React JS\n\n1. 单页应用。\n2. 整个页面保持不变，只有少数组件发生变化。\n3. 代码易于扩展和维护。\n4. 由于\
  \ HTML 是通过 JS 创建的，具有更多功能。\n5. 同构渲染（服务端渲染）。\n6. 极快的速度。\n\n如果非要回答什么是 react js，那么 React\
  \ 是一个 JavaScript 库，你可以将其附加到任何现有技术栈中，并让 UI 变得动态，以获得优越感和信念的极致乐趣。我相信你必须掌握学习 React 的方法，React\
  \ 是由 `Facebook` 在 2011 年专门为 Facebook 开发的，他们并在 2013 年将代码公开。但同时考虑到，在 React JS 之前，我们有一个\
  \ `DOM` 的原始概念，但引入了 React 之后，我们有了 `virtual DOM`（虚拟 DOM），`这必须被非常仔细地考虑`。根据深思的练习，这是一个有趣的概念，我们将在下文中详细讨论，但作为开始，`DOM`\
  \ 是文档对象模型，当浏览器加载网页时，它会将所有元素转换为一个以 `document` 为根的对象，以便在本文结束时让本质达到启示。\n\n为了进一步深入并向你介绍更多信息，当你在网页上添加或修改数据时，除了简单的点击\
  \ `load more`（加载更多）节点被附加到树上之外，如果你更改了某些数据，你需要通过引入观察行代码来重新刷新它。但这都是早期 Facebook 上的信息和委托，他们以前经常使用\
  \ `+1` 更新通知，这样当你点击它时，网页会重新加载，数据也是如此，这是先前的因素之一。为了进一步深入并向你介绍更多信息，通过 `virtual DOM`，你可以实时修改节点，因为现在所有元素都被处理为可附加的独立组件，其节点值会随着脚本而改变，以便在本文结束时让本质达到启示。由于为了实操一直下去获取更多信息，这些术语太多了，让我们一个一个地讨论它们。\n\
  \n![`qphs.fs.quoracdn.net/main-qimg-0ad1d17f18f25d10000c84bc82e7bd9f`](img/image_rsrc1AG.jpg)\n\
  \n## 虚拟 DOM 概念\n\n现在你知道什么是 react js 了，让我们转向为什么要用 react js？如上所述，`Document Object\
  \ Model`（文档对象模型）是浏览器中网页基于树的对象的表示，以引起你对完整丰富信息的注意。记住仔细关注这一点，通过 javascript 的帮助，你可以更改元素及其值，而科学地攻克未知事物是一项巨大的任务。进一步进入特征描述，当你编写\
  \ `window.alert()` 或 `document.getElementById()` 时，你正在使用 javascript 来更改 HTML 标签，而这些标签现在是对象，因此\
  \ `window` 和 `document` 在这里都是 `objects`（对象）。\n\n![`qphs.fs.quoracdn.net/main-qimg-171a67eed3345da113fe2c057a361edc`](img/image_rsrc1AH.jpg)\
  \ ![`qphs.fs.quoracdn.net/main-qimg-c9fbf33a9681209ab79db7d105fb96c`](img/image_rsrc1AJ.jpg)\n\
  \n现在，问题在这里，我强烈希望你有它们的生产实践。由于为了实操一直下去获取更多信息，想象有一个包含十项的列表，你只更改了其中一个的值，而科学地攻克未知事物是一项巨大的任务。由于为了实操一直下去获取更多信息，浏览器将重新加载整个包含\
  \ 10 项的列表，我强烈希望你有它们的生产实践。并且为了你的学习之目的，成功包括它会变得有多慢！！！\n\n那么，解决方案是什么？我们只需要更新变化的地方！这里引入了\
  \ `virtual DOM` 的概念，`这必须被非常仔细地考虑`。然而，我强烈建议将 `Virtual DOM` 考虑为 `DOM 的复印件`，`这必须被非常仔细地考虑`。根据深思的练习，它不是\
  \ `DOM`，它仍然是虚拟的，也就是说，无论你在 `virtual DOM` 中改变了什么，真实的网页都不会受到影响。\n\n现在，`Virtual DOM`\
  \ 的操作比 `DOM` 快得多，因为这里不涉及浏览器，因为它只是一个副本！你用 `JS` 做的任何更改都会反映在 `Virtual DOM` 中，`这必须被非常仔细地考虑`。为了进一步深入并向你介绍更多信息，浏览器将比较\
  \ `DOM` 和 `virtual DOM`，并仅更新更改，就像 `VCS`（版本控制系统）处理冲突一样，使其工作方式更加高效。\n\n## 组件化 UI\n\
  \nReact 和 Angular 都拥抱了基于组件的 UI 结构！现在，这已成为 Web 开发中不可避免的一部分，以便在本文结束时让本质达到启示。然而，我认为基于组件的\
  \ UI 将整个 Web 应用分为可重用的独立单元，这些单元独立地与服务器交互，允许 `DOM` 动态变化，并实现生产概念的人格化。但同时考虑到，`组件化 UI`\
  \ 和 `Ecmascript 2015` 都让 Web 开发变得更像一种编码体验，因为现在我们有了类、具有可注入组件的顶层封装，我强烈希望你有它们的生产实践。进一步进入特征描述，每当我们回答什么是\
  \ react js 时，组件化开发就一直如影随形！\n\n![`qphs.fs.quoracdn.net/main-qimg-ff8f05a5821d835f1c8193e327db`](img/image_rsrc1AK.jpg)\
  \ 例如，每个网站都有共享的 UI，头部是相同的，页脚也是相同的，只有内容动态变化，并实现生产概念的人格化。头部单个组件，页脚一个组件，内容的共享 CSS，但每个路由都有对服务器和数据库的独立调用。\n\
  \n## Babel 和 JavaScript\n\n我们将在下文中讨论 `JSX`，但一旦 `JSX=JS+XML`，你使用 React 以 `JSX` 渲染页面，浏览器并不理解它！等等，浏览器不理解它！它只理解\
  \ Vanilla JavaScript（原生 JS），以便在本文结束时让本质达到启示。然而，考虑到增量并进一步，仅仅在 Angular 中 Typescript\
  \ 被转换为 `JS`，而在 React 中，它是通过 `Babel` 完成的，这是本文的特征部分。但同时考虑到，`babel` 是一个负责 `JSX` 转换工作的编译器，`这必须被非常仔细地考虑`。由于为了实操一直下去获取更多信息，尽管\
  \ React 只是一个可以附加到任何现有应用程序的库，用 `JSX` 编写代码非常方便且简洁，我们将讨论讨论。\n\n## React 和 JSX\n\n如果不讨论\
  \ `JSX`，我们就无法完成这篇“什么是 react js 博客”。如果你用过 Angular 以及相应的 Typescript，那么你基本上在使用 Typescript（它是组件中\
  \ javascript 的超集）以及用于双向数据绑定的 Angular 预定义标签和额外功能。但同时也考虑到，这一点，但在这里，你可以以 `JSX` 的形式将标记语言和脚本在一起。\n\
  \n![`qphs.fs.quoracdn.net/main-qimg-cedc2042ca17ce4bc69172bb4c30f6cc`](img/image_rsrc1AM.jpg)\
  \ 让我们来看一个基础示例，科学地攻克未知事物是一项巨大的任务。我承认在目标位置你定义了一个变量 `name`。记住仔细关注这一点，并在大括号中使用它的值作为单向数据绑定，这再次将在下文中详细讨论。\n\
  \n并在你的 `render()` 方法中使用它，你就能观察到结果。\n\n\n\n\n\n# 使用 React.js 的目的是什么？\n\n我从事 ReactJS\
  \ 工作，因此我可以很好地解释这一点。ReactJS 是由 Facebook 设计的一个开源 JavaScript 库，旨在通过最少的代码快速高效地创建丰富且交互良好的\
  \ Web 应用。\n\n## 历史\n在 Facebook 开发 `ReactJS` 时，虽然可以使用 `Angular` 等其他技术，但大多数开发者被迫编写大量的代码；这是其中最著名的问题之一。他们希望有一个框架可以允许他们拆解复杂组件并复用代码以更快地完成项目。\n\
  \n## 解决方案\nReactJS 提供了开发者寻找的解决方案。它使用了 `JSX`（一种独特的语法，允许使用 HTML 引以及 HTML 标签语法来渲染特定的子组件）。这对于促进机器可读代码的构建非常有帮助，同时可以将组件组合成一个单次可验证的文件。\n\
  \n## 为什么很多人倾向于使用 ReactJS？\n- 它将 HTML 直接引入你的 `JS` 中。\n- 组件的概念是使 `ReactJS` 脱颖而出的原因。\n\
  - `ReactJS` 中的 `Props` 允许将自定义数据传递给特定的 UI 组件。\n- `State` 允许在一个区域中存储所有更改。\n- 它使用 `Virtual\
  \ DOM` 使应用运行飞快。\n- `ReactJS` 开发者将帮助你制定可实现的目标，并演示业务如何利用该技术加速增长、提高转化、降低成本并提高率。\n\n\
  ## React 中的单向数据绑定\n你一定听过 `Angular` 中的双向数据绑定。但由于 `React` 是一个库，由于有 `JSX`，那里没有分离的 HTML\
  \ 和脚本概念。在双向数据绑定中，输入元素的任何更改都会反映在组件中，因为两者都是绑定的。当我们谈论单向数据绑定时，输入元素无法反映 `JSX` 代码中的更改，除非并且你使用了更改事件。\n\
  \n记住 `Angular` 自动使用监听器和定时器来做到这一点，但 `React` 将其限制为单向数据流。然而，它至少允许动态更改渲染组件，这在以前使用 `AJAX`\
  \ 时是不可能的因为你必须刷新页面；而现在，更改通过单向数据绑定反映在独立的组件上。\n\n## 设置你的环境\n\n### 安装 visual studio\
  \ code\n1. 下载 Windows 版本的 `Visual Studio Code` 安装程序。\n2. 下载完成后，运行安装程序（`VSCodeUserSetup-{version}.exe`）。\n\
  3. 默认情况下，`VS Code` 安装在 `C:\\users\\{username}\\AppData\\Local\\Programs\\Microsoft\
  \ VS Code`。\n\n或者，你也可以下载 `Zip` 压缩包，解压并从那里运行 `Code`。\n\n**注意：** `VS Code` 需要 `.NET\
  \ Framework 4.5.2` 或更高版本。如果你使用的是 Windows 7，请确保你至少安装了 `.NET Framework 4.5.2`。你可以通过命令提示符使用此命令检查\
  \ `.NET Framework` 版本：\n\n```\nreg query \"HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\\
  NET Framework Setup\\NDP\\v4\\full\" /v version\n```\n\n**提示：** 安装会将 `Visual Studio\
  \ Code` 添加到你的 `%PATH%` 中，因此你可以从控制台输入 `code .` 在该文件夹打开 `VS Code`。你需要在安装后重启控制台使 `%PATH`\
  \ 环境变量生效。\n\n### 用户与系统设置\n`VS Code` 提供了 Windows 用户级和系统级设置。\n- **用户设置**：不需要管理员权限，因为位置位于你的用户本地\
  \ AppData (`LOCALAPPDATA`) 文件夹下。这提供了更平滑的后台更新体验。\n- **系统设置**：需要提升到管理员权限，并将安装放在 `Program\
  \ Files` 下。\n\n### 32 位版本\n如果你需要运行 32 位的 `VS Code`，提供了 32 位的 `Installer` 和 `Zip`\
  \ 压缩包。\n\n### 更新\n`VS Code` 每月发布版本，并在新版本可用时支持自动更新。如果 `VS Code` 提示你，接受最新更新它将会被安装。\n\
  **注意：** 如果你喜欢按照自己的计划更新 `VS Code`，可以禁用自动更新。\n\n## 作为开发机的 Windows\nWindows 是一个流行的操作系统，它可以是一个极好的跨平台开发环境。本节描述了跨平台功能，例如`Windows\
  \ Linux 子 system` (`WSL`) 和新的 `Windows Terminal`。\n\n### 最近的 Windows 版本\n确保你使用的是较新的\
  \ Windows 10 版本。检查 `设置` > `Windows 更新` 查看你是否是最新状态。\n\n### Windows Linux 子系统\n通过\
  \ `WSL`，你可以在 Windows 上安装并运行 Linux 发行版。这允许你在本地 Windows 机器上工作的同时，在 `Linux` 上开发和测试你的源码。当配合\
  \ `Remote - WSL` 扩展时，你可以在 `WSL` 上下文中获得完整的 `VS Code` 编辑和调试支持。\n\n### 新版 Windows Terminal\n\
  从微软商店获取的 `Windows Terminal (Preview)` 让你能够在多标签页 shell 中轻松地打开 `PowerShell`、命令提示符和\
  \ `WSL` 终端。\n\n## 下一步骤\n一旦你安装了 `VS Code`，这些主题将帮助你了解更多 VS Code：\n- **其他组件**：学习如何安装\
  \ `Git`、`Node.js`、`TypeScript` 以及像 `Yeoman` 的工具。\n- **用户界面**：对 `VS Code` 的快速介绍。\n\
  - **用户/工作区设置**：学习如何通过设置按偏好配置 `VS Code`。\n- **技巧与窍门**：让你直接上手并学习如何使用 `VS Code` 高效工作。\n\
  \n\n\n\n\n# 常见问题\n\n## Windows 安装程序支持哪些命令行参数？\nVS Code 使用 Inno Setup 创建其 Windows\
  \ 安装包。为了方便操作和获取更多信息，所有的 `Inno Setup` 命令行开关（switch）均可使用。此外，你可以使用 `/mergetasks=!runcode`\
  \ 防止安装程序在完成后启动 VS Code。\n\n## 滚动卡顿且不流畅\n在某些设备上，编辑器的滚动并不流畅，而是出现卡顿，导致体验不佳。如果你发现了此问题，请确保已安装了\
  \ Windows 10 2018 年 10 月更新，该问题在该更新中已修复。\n\n## 安装程序出现问题了\n请尝试使用 zip 文件而不是安装程序，以获取完整的成功信息。为了方便操作和获取更多信息，请将\
  \ VS Code 解压到你的 `AppData\\Local\\Programs` 文件夹中。\n\n# Hello React\n\n## 设置 Babel\
  \ 项目\n当前浏览器尚未支持所有新的 ECMAScript 6（即 ECMAScript 2015）特性（请参见兼容性表）。为了实现目标，你需要使用一个编译器（转译器）将你的\
  \ ECMAScript 6 代码转换为兼容 ECMAScript 5 的代码。请仔细注意，尽管有其他选项，但 Babel 已成为将 ECMAScript 6\
  \ 应用程序编译为可在当前浏览器运行的 ECMAScript 的事实标准。同时也要考虑到，babel 也可以编译其他版本的 ECMAScript 以及 React\
  \ 的 JSX，但这超出了本教程的范围。\n\n在本单元中，你将设置一个开发环境，使用 Babel 开发并运行 ECMAScript 6 应用程序。\n\n###\
  \ 步骤 1：安装示例应用程序\n1. 克隆 `es6-tutorial` 仓库，该仓库包含了我们在教程中使用的抵贷款应用的 ECMAScript 5 版本：\n\
  2. `git clone https://github.com/ccoenraets/es6-tutorial`\n3. 或者，你也可以下载并解压此文件，而不是克隆仓库。\n\
  4. 在浏览器中打开 `index.html` 并点击计算（Calculate）按钮。\n\n### 步骤 2：设置 Babel\n正如你所看到的，当前版本的应用程序可以在当前浏览器中无需编译运行：它是用纯\
  \ ECMAScript 5 编写的。根据本节的练习，我们将设置 Babel，以便在下一个单元中开始使用 ECMAScript 6 特性。\n\n1. 打开命令提示符，并进入（`cd`）`es6-tutorial`\
