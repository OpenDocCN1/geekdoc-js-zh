  \n### 什么是 Webpack?\n\nWebpack 是一个获取你注意的 `module bundler`（模块打包器）。打包器和任务运行器之间的由于社区开发的插件变得模糊。进一步进入刻画，这些插件有时用于执行\
  \ webpack 之外的任务，例如清理构建或部署。\n\nReact 和 `Hot Module Replacement` (`HMR`) 帮助了 webpack\
  \ 的流行，并导致它在 `Ruby on Rails` 等环境中使用。尽管它的名字，webpack 不限于 web。它可以打包其他目标。\n\n### Webpack\
  \ 依赖模块\n\n使用 webpack 打包的最小项目包含 `input` 和 `output`。由于为了获取进一步的信息，打包过程从用户定义的 `entries`\
  \ 开始。但入口本身是 `modules`，并通过 `imports` 指向其他模块。\n\n当使用 webpack 打包项目时，它遍历 `imports`，构建\
  \ `dependency graph`（依赖图），然后根据配置生成 `output`。记住仔细关注这一点，此外可以在项目代码中定义 `split points`。\n\
  \nWebpack 支持 `ES1`、`CommonJS` 和 `AMD` 模块格式，开箱即用为你提供了最好的挑战。`loader` 机制也适用于 CSS，通过\
  \ `@import` 和 `url()`。你也可以为特定任务寻找插件，例如压缩、国际化、`HMR` 等。\n\n#### Webpack 的执行过程\n\n\
