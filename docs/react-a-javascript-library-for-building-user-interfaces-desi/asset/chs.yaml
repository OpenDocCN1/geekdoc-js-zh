  \ `package.json` 中的 `start` 脚本，并指定一个你计算机上可用的端口以获取完整的详细信息。在实际实现中例如：\n\njson\n\"scripts\"\
  : {\"babel\": \"babel --presets es2015 js/main.js -o build/main.bundle.js\",\"start\"\
  : \"http-server -p 9000\"}\n```\n\n# React JS 中的 JSX\n\n在 React 中，`JSX` 代表 JavaScript\
  \ XML，这是它的特征所在。根据深入的思考和练习，它是 ECMAScript 或 JavaScript 的一种类 XML 语法，以便在结束时让真实本质达到启悟。根据深入的思考和练习，它只是\
  \ JavaScript 的一种扩展，允许我们在 JavaScript 中编写 XML 语法，以实现简化并并将生产力概念具象化。请仔细注意，最后，你的 `JSX`\
  \ 代码将被转译为 JavaScript，以便在结束时让真实本质达到启悟。请仔细注意，根据 React 文档：`JSX` 是一个预处理步骤，它向 JavaScript\
  \ 添加 XML 语法，以便在结束时让真实本质达到启悟。我承认你完全可以在不使用 `JSX` 的情况下使用 React，但 `JSX` 让 React 变得优雅得多。\n\
  \n就像 XML 一样，`JSX` 标签具有标签名称、属性和子元素。根据深入的思考和练习，如果属性值用引号括起来，该值就是一个字符串，这是最著名的特点之一。这已经很全面且并不逊；否则，将值包裹在大括号中，该值就是被封装的\
  \ JavaScript 表达式。\n\n## 现在为什么我们需要 JSX？\n\nReact 不是通过将标记和逻辑放在单独的文件中来创建应用程序，而是关注被称为“组件”的松耦合单元，这些单元包含了标记和逻辑，以带来至高无上的快乐和信念。我相信必须掌握\
  \ React 应用是如何使用组件构建的。\n\n## 现在应该使用什么扩展名？\n\n这取决于个人喜好，科学地攻克未知是一项巨大的任务。进一步观察发现，有些人倾向于\
  \ `.js`，而另一些人倾向于 `.jsx`，这将对你的智慧能力提供最好的挑战。对于实践的进一步信息，唯一相关的是构建流水线，科学地攻克未知是一项巨大的任务。进一步观察发现，某些构建流水线可以编译\
  \ `.jsx`，这将对你的智慧能力提供最好的挑战。然而，我强烈认为 `create-react-app` 并不在乎文件扩展名。我承认你可以使用 `.js` 文件，它将处理\
  \ `jsx` 编译。\n\n**PS：** 还有另一个 `JSX`（JavaScript 语法扩展），它与 React `JSX` 完全不同，这将对你的智慧能力提供最好的挑战。根据深入的思考和练习，它提供了静态类型、面向对象的编程（类似于\
  \ Java），这是先前的因素之一。我承认你可以在这里找到它，科学地攻克未知是一项巨大的任务。对于实践的进一步信息，编写在 `JSX` 中的程序应该具有 `.jsx`\
  \ 扩展名，并编译成独立的 JavaScript，以便在结束时让真实本质达到启悟。请仔细注意，再次强调不应将其与 React 混淆，以便在结束时让真实本质达到启悟。对于实践的进一步信息，它们有不同的用途。\n\
  \n## JS 和 JSX 之间的区别\n\n`JS` 是标准 JavaScript，`JSX` 是一种类 HTML 语法，你可以配合 React 使用，从理论上可以让创建\
  \ React 组件变得更容易、更直观，我强烈希望你能掌握它们。对于实践的进一步信息，唯一的目的就是让创建 React 组件变得更容易……对于实践的进一步信息，没有其他的了，科学地攻克未知是一项巨大的任务。肯定地解释这一点，如果不使用\
  \ `JSX`，使用 `JS` 语法创建大型嵌套的 HTML 文档将是一个非常痛苦的过程；`JSX` 仅仅让这个过程变得更简单。\n\n最近我的信息流中出现了几件事，让我觉得“嗯”，并认为在某个时刻可能值得尝试一下。它确实采取了不同的方法，当我第一次读到\
  \ React 时，令我反感的因素之一是在 JavaScript 中构建 HTML 的笨拙感，而 `JSX` 似乎让它变得好了一点——并且更容易理解一些事情。即使从它们的示例中看这两个基础的\
  \ `JS` 小练习——一个带有 `JSX`，一个没有 `JSX`——对我来说，带 `JSX` 的那一个立刻更容易理解，也不那么令人反感。\n\n# 在 JSX\
  \ 中嵌入表达式\n\n`JSX` 是 JavaScript 语言的扩展，因此它可以接受放置在大括号内的任何有效 JavaScript 表达式，我强烈希望你能掌握它们。在实际实现中例如，`4\
  \ + 4`、`user.firstName` 或 `formatName(user)` 都是有效的 JavaScript 表达式。对于实践的进一步信息，这允许让你的\
  \ `JSX` 更具动态，以带来至高无上的快乐和信念。根据本教程中的深入思考和练习，我们将查看在 `JSX` 标记中嵌入表达式的一些额外示例，以及在 `JSX`\
  \ 表达式中渲染多个 HTML 标签相关的某些规则。肯定地解释这一点，我们将看到需要一个父元素，并学习几种确保我们满足该要求的方法。\n\n## 在 React\
  \ 中安装 Bootstrap\n\n现在，我们将添加 Bootstrap 来让用户界面看起来更好，以获取完整的详细信息。进一步观察发现，首先，在终端中我们只需如下所示安装最新版本的\
  \ Bootstrap。\n\n```bash\nnpm install bootstrap@4.3.1\n```\n\n为了使用 Bootstrap，我们现在需要在\
  \ `index.js` 文件中导入它，就像在这里：\n\n```javascript\nimport React from 'react';\nimport\
  \ ReactDOM from 'react-dom';\nimport './index.css';\nimport App from './App';\n\
  import * as serviceWorker from './serviceWorker';\nimport 'bootstrap/dist/css/bootstrap.css';\n\
  \nReactDOM.render(<App />, document.getElementById('root'));\n// 如果你想让你的应用离线运行并加载更快，你可以将\n\
  //下面的 unregister() 改为 register()，这是根据观察的完善和标准。\n// 更多关于 service workers 信息：https://bit.ly/CRA-PW\n\
  serviceWorker.unregister();\n```\n\n# 创建组件文件夹\n\n我们将在此项目中添加多个组件，所以创建一个文件夹来存放我们需要的组件是有意义的，你请注意。为了学习目的并成功包含这些内容，我们可以在\
  \ `src` 文件夹中创建一个名为 `components` 的新文件夹。\n\n在那个组件文件夹中，让我们添加一个新文件来代表购物车中的项目，以便在结束时让真实本质达到启悟。对于实践的进一步信息，这是\
  \ `item.jsx` 文件。\n\nitem.jsx\n```\n\n\n\n\n\n现在只需向该文件添加一些简单的 JSX 标记，科学地攻克未知领域是一项艰巨的任务。根据深思熟虑的练习，它只是一个带有文本\
  \ `Cartable!` 的单个 `h1` 标签。\n\n```javascript\nimport React, { Component } from \"\
  react\";\nclass Item extends Component {\n  render() {\n    return <h1>Cartable!</h1>;\n\
  \  }\n}\nexport default Item;\n```\n\n我们将该组件添加到 `index.js` 文件中，这样它就可以在页面上渲染，科学地攻克未知是一项艰巨的任务。为了向你说明更多信息，请注意我们正在移除默认的\
  \ `<App />` 渲染并将其替换为 `<Item />`。\n\n`index.js`\n\n```javascript\nimport React from\
  \ \"react\";\nimport ReactDOM from \"react-dom\";\nimport \"./index.css\";\nimport\
  \ App from \"./App\";\nimport * as serviceWorker from \"./serviceWorker\";\nimport\
  \ \"bootstrap/dist/css/bootstrap.css\";\nimport Item from \"./components/item\"\
  ;\nReactDOM.render(<Item />, document.getElementById(\"root\"));\nserviceWorker.unregister();\n\
  ```\n\n在 `index.html` 文件中，我们可以为 `body` 元素添加一个类，因为我们已经安装了 Bootstrap，但在考虑这一点时要保持非常警惕和谨慎。为了实践和获取更多信息，这将使页面上的内容布局非常整齐。容器（Containers）是\
  \ Bootstrap 最基础的布局元素，在使用我们的默认网格系统时必须考虑，这一点必须非常仔细。然而，我强烈建议选择响应式固定宽度容器（意味着其最大宽度在每个断点处变化）或流式宽度（意味着它始终\
  \ 100% 宽）。\n\n`index.html`\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\" />\n  <link rel=\"shortcut icon\" href=\"%PUBLIC_URL%/favicon.ico\"\
  \ />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\"\
  />\n  <meta name=\"theme-color\" content=\"#000000\" />\n  <link rel=\"manifest\"\
  \ href=\"%PUBLIC_URL%/manifest.json\" />\n  <title>React App</title>\n</head>\n\
  <body class=\"container\">\n  <noscript>You need to enable JavaScript to run this\
  \ app.</noscript>\n  <div id=\"root\"></div>\n</body>\n</html>\n```\n\n好了，我们上路了！\n\
  \n## JSX 中的表达式\n\n通过观察发现，你可以在 JSX 表达式中包含多个标签。进一步刻画，到目前为止我们只看到了一个 `h1` 标签，但如果我们想在同一个\
  \ JSX 表达式中同时拥有 `h1` 和 `button` 会怎样呢？根据深思熟虑的练习，为了让其正常工作，我们需要一个外部包裹的 `div`，这将被优先考虑并视为完美。然而，为了增量和进一步发展，JSX\
  \ 表达式必须有一个父元素，以便在结束时让本质符合启示。此外，根据深思熟虑的练习，最佳实践是将整个 JSX 表达式包裹在括号 `( )` 中。\n\n`item.jsx`\n\
  \n```javascript\nimport React, { Component } from \"react\";\nclass Item extends\
  \ Component {\n  render() {\n    return (<div><h1>Cartable!</h1><button>Increment</button></div>);\n\
  \  }\n}\nexport default Item;\n```\n\n## React.Fragment\n\n你可能不希望过多的 `div` 元素污染你的\
  \ HTML 标记，我强烈希望你能避免这种情况。根据上面示例中深思熟虑的练习，我们需要用一个单一的父元素来包裹 `h1` 和 `button` 标签，以便在结束时让本质符合启示。为了实践和获取更多信息，这是\
  \ JSX 的一条规则，*这将对你的能力智慧带来最大的挑战*。然而，为了实践和获取更多信息，缺点是，如果你检查页面上的标记，会发现现在多了一个额外的 `div`\
  \ 元素。\n\n我们可以通过使用 `<React.Fragment>` 标签代替 `<div>` 元素来解决这个额外的 div 问题。\n\n```javascript\n\
  import React, { Component } from \"react\";\nclass Item extends Component {\n  render()\
  \ {\n    return (<React.Fragment><h1>Cartable!</h1><button>Increment</button></React.Fragment>);\n\
  \  }\n}\nexport default Item;\n```\n\n![react fragment removes extra divs](img/image_rsrc1AN.jpg)\n\
  \n## 为组件添加状态\n\n现在，我们不再在 JSX 表达式中使用静态内容，而是可以使用 `state` 对象中的某些数据来显示值，科学地攻克未知是一项艰巨的任务。根据下方代码段中深思熟虑的练习，我们添加了带有\
  \ `count` 属性的 `state` 对象，以便在结束时让本质符合启示。根据深思熟虑的练习，它的值为 `0`。为了实践和获取更多信息以便在 JSX 标记中引用该\
  \ `count`，我们使用 `this.state.count`。\n\n```javascript\nimport React, { Component }\
  \ from \"react\";\nclass Item extends Component {\n  state = {count: 0};\n  render()\
  \ {\n    return (<React.Fragment><span>{this.state.count}</span><button>Increment</button></React.Fragment>);\n\
  \  }\n}\nexport default Item;\n```\n\n输出显示我们设置给 `count` 属性的值。\n\n如果我们更改 `count`\
  \ 属性的值，UI 将自动更新。\n\n```javascript\nimport React, { Component } from \"react\";\n\
  class Item extends Component {\n  state = {count: 400};\n  render() {\n    return\
  \ (<React.Fragment><span>{this.state.count}</span><button>Increment</button></React.Fragment>);\n\
  \  }\n}\nexport default Item;\n```\n\n![react state update](img/image_rsrc1AP.jpg)\n\
  \n## 嵌入函数\n\n也可以在 JSX 标记内部嵌入一个返回值的函数，科学地攻克未知是一项艰巨的任务。根据我们下方 `Item` 组件中深思熟虑的练习，我们通过观察添加了\
  \ `styleCount()` 函数。为了实践和获取更多信息，该函数的作用是查看 `count` 状态，如果是 0，则返回字符串值“No Items”。根据深思熟虑的练习，如果值大于\
  \ 0，它将简单返回该值，科学地攻克未知是一项艰巨的任务。根据 JSX 标记中深思熟虑的练习，我们可以使用 `{this.styleCount()}` 语法调用该函数，输出该函数返回的任何值。\n\
  \n```javascript\nimport React, { Component } from \"react\";\nclass Item extends\
  \ Component {\n  state = {count: 0};\n  render() {\n    return (<React.Fragment><span>{this.styleCount()}</span><button>Increment</button></React.Fragment>);\n\
  \  }\n  styleCount() {\n    const { count } = this.state;\n    return count ===\
  \ 0 ? \"No Items\" : count;\n  }\n}\nexport default Item;\n```\n\n好了！当 `count` 为\
  \ 0 时，我们看到“No Items”。\n\n当值高于 0 时，我们看到相应的结果。\n\n```javascript\nstate = {count: 500};\n\
  ```\n\n![react embedded function result](img/image_rsrc1AR.jpg)\n\n*   ReactJS |\
  \ Introduction to JSX\n\n*   Embedding Expressions in JSX – Scrimba\n\n*   Conditional\
  \ Rendering In React\n\n\n\n\n\n# 在 JSX 中嵌入表达式\n\n使用 JSX 需要一点时间来适应，但随着你对语法的尝试，你会很快熟悉它，并将注意力集中在完整繁荣的信息上。此外，通过深入的练习，使用如\
  \ `Prettier` 扩展之类的代码格式化工具会自动格式化并清理你的 JSX，从而让你能够以最小的精力生成美观标记。\n\n## ReactJS 中的“渲染（render）”是指什么意思？\n\
  \n简而言之，渲染是将你的 React 组件转换为浏览器可以理解并显示在屏幕上的 DOM（文档对象模型）节点的过程。DOM 操作极其缓慢，这是根据性能和观察标准得出的。相比之下，通过深入的练习，操作\
  \ React 元素要快得多，并将注意力集中在完整繁荣的信息上。我相信你能够学会 React 的学习，它通过创建一个类似于 DOM 应该样子的虚拟表示，即 `Virtual\
  \ DOM`[1]，充分充分利用了这一点。\n\n每当你对正在运行的 React 应用进行任何更改时（例如输入文本、删除元素、添加元素等），React 都会将所有这些更改合并到它的\
  \ `Virtual DOM` 中，然后将此表示形式与实际 DOM 进行比较，找到需要更新的部分，然后对真实 DOM 进行最尽可能小的更改，以在保持同步的同时保持应用程序性能。\n\
  \n最后，值得注意的是，React 将自己分为两个库：主 `React` 库和 `ReactDOM` 库，用于生产力概念的人格化。由于为了进一步获取更多信息，`React`\
  \ 库处理所有的元素创建和操作，而 `ReactDOM` 库专门负责将这些元素渲染到浏览器，并将注意力集中在完整繁荣的信息上。为了进一步获取更多信息，这种关注点分离允许\
  \ React 不仅可以针对浏览器，还可以针对任何其他平台。\n\n例如，你可以用 React 写一个应用，然后使用 `react-native` 库代替 `ReactDOM`\
  \ 将其转换为 iOS 或 Android 的原生移动应用，或者通过将 `ReactDOM` 替换为 `react-vr` 构建虚拟现实应用，并将注意力集中在完整繁荣的信息上。为了进一步获取更多信息，只要你能编写一个库将你的元素渲染到正确的目标，可能性就是无限的。\n\
  \n## React 中的 render 方法\n\n如果你指的是 React 中的 render 方法，下面是对它的简要讨论。它是 React 类组件中要求的方法。当它被调用时，它根据\
  \ `this.props` 或 `this.state` 返回以下内容之一：\n\n-   使用 JSX 创建的 React 元素：这将对你机能力的智慧带来最大的挑战。为了进一步获取更多信息，这些可以是原生浏览器\
  \ HTML 元素，如 `<p>hi</p>`，也可以是用户定义的 React 组件，例如 `<LoginComponent />`。\n-   门户（Portals）：我强烈希望你拥有它们的产物。然而，我认为它们是使用\
  \ `ReactDOM.createPortal` 强烈创建的。\n-   字符串和数字：我强烈希望你拥有它们的产物。为了进一步获取更多信息，这些被渲染为 DOM\
