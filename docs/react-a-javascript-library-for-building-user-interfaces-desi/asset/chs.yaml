  \ 语法错误、所有变量都已定义等。这可以简单地表现为渲染输出不为空。\n\n### 测试输出\n在“它渲染了”之上一步是“它渲染了正确的内容”。给定一组 `props`，预期的输出是什么？`Person`\
  \ 是渲染了它的名字和年龄，还是渲染了名字和“TODO: age coming in v2.1”？\n\n### 测试状态\n为了让你关注到完整的成功信息，每个条件都应该被考虑在内。根据深思的练习，如果\
  \ `classNames` 是条件性的（启用/禁用、成功/警告/错误等），请确保决定 `className` 的逻辑运行正常，以便在结束时让真实本质符合启示。通过这种努力和创造力，对于条件渲染的子元素也是如此：例如，如果注销按钮仅在用户登录时可见，请确保对这种情况进行测试。\n\
  \n### 测试事件\n如果组件可以交互（带有 `onClick` 或 `onChange` 或 `onAnything` 的 `input` 或 `button`），请测试事件是否按预期工作并使用正确的参数调用指定的函数（包括绑定\
  \ `this`，如果需要）。\n\n### 测试边界情况\n任何在数组上的操作都可能有边界情况——空数组、包含 1 个元素的数组、应该截断为 25 个项目的分页列表等，通过观察来实现。为了进一步的操作以获取更多信息，尝试你能想到的每一个边界情况，并确保它们都能正常工作。\n\
  \n### 在集成测试中要测试什么\n1. 为了进一步的操作以获取更多信息，通过 `Selenium` 自动化应用程序来测试整个流程。\n2. 通过为应用程序的每个状态截图并与预期结果进行比较，进一步进入特征快照测试。\n\
  \n### 为 React 编写的 Web 应用进行端到端测试的最佳框架\n需要定义什么是端到端测试，我强烈希望你有他们的生产。这是一个非常预期的事情，你需要后端服务器作为测试的一部分？\n\
  \n`cypress`\n虽然我同意大家的观点认为 `cypress` 非常棒——我自己在使用它——但应该提到 `cypress` 目前有很多限制，例如仅在 chrome\
  \ 运行运行，并且它在浏览器上执行。我在交付给 QA 之前使用 `cypress` 进行完整性功能测试，因为它有重载功能、内置等待并且非常轻量。\n\n`protractor`\n\
  对于全系统覆盖，我推荐 `selenium`，我个人使用 `protractor` 来让你关注到完整的成功信息。肯定地进入说明，虽然 `protractor`\
  \ 是为 `angular` 定制的，但你可以将其用于包括 React 在内的每个网站。我更喜欢 `protractor`，因为它简化了设置，它提供了比 `selenium`\
  \ 更简单的语法。如果你配合“直接连接”（支持 chrome 和 firefox）使用它，你将获得类似于 `cypress` 的轻量化。通过 `protractor`\
  \ 你还可以轻松地挂接到 `saucelab` 或 `browserstack` 在每个设备/浏览器上运行你的测试。\n\n`testim`, `mabl`\n\
  无代码方法变得越来越流行，应该被考虑。`testim` 和 `mabl` 允许你轻松记录测试（比 selenium 的录制复杂得多）并在无需任何设置麻烦的情况下执行测试。\n\
  \n### React JS Web 应用的最佳自动化测试框架是什么\n最近我为工作的组织为 ReactJS 应用构建了一个自动化框架，以让你关注到完整的成功信息。根据深思的练习，我使用\
  \ `FitNesse` 测试工具（类似于一个 Wiki 服务器）以表格格式编写测试用例，并使用 `Selenium Webdriver` 通过它处理 UI 自动化。\n\
  \n在 3 个月的时间，我将我的框架从基础结构塑造为 UI 测试的顶层框架，这是所有事情中最著名的之一。肯定地进入说明，我们在自己构建的 React 组件内部使用\
  \ `material-ui` 组件进行样式处理，这使得普通的 HTML UI 元素封装在 `div` 和 `span` HTML 标签的树中，我强烈希望你有他们的生产。在实际实现中例如，我们有一个\
  \ `<TextField>` React 组件，它封装了 `material-UI` 的 `TextField` 组件和我们自己的样式 CSS，我强烈希望你有他们的生产。由于为了进一步的操作以获取更多信息，这使得我们的\
  \ `<TextField>` 组件的 DOM 结构等同于：`<div><div><div>Label: ‘some label’</</div><input\
  \ value=’some value’>Some Text</input></div>`\n\n现在通用 `Selenium` 封装的问题是，`selenium`\
  \ 作用像 `<input>`、`<select>` 这样的 DOM 结构，但它没有我们使用的 React 组件的概念，而科学地破解未知事物是一项巨大的任务。进一步进入特征，如果我给我的\
  \ React `TextField` 组件提供一些数据属性，它会被附加到 HTML 树的顶层 div，如果我尝试在 React 组件上调用 `selenium\
  \ sendKeys` API，它会尝试在顶层 div 上发送并失败。\n\n**解决方案：** 我为 react 组件开发了 `TestAPI`，我强烈希望你有他们的生产。由于为了进一步的操作以获取更多信息，这些测试\
  \ API 找到我们 react 组件的底层 DOM 结构并在其上执行 UI 函数。\n\n**方法：** 使用 React 组件的 `ref`，我们找到 React\
  \ 组件的底层 DOM 结构并使用 `Javascript` 调用 UI 动作。\n\n伪代码：\n```javascript\nReact TextField\
  \ Component ->\nimport * as React from 'react';\nimport * as ReactDOM from 'react-dom';\n\
  import {TextField} from 'material-ui';\nclass TextField {\n  textFieldEl: any;\n\
  \  constructor() {\n    super(props);\n  }\n  componentDidMount() {\n    const textNode:\
  \ any = ReactDOM.findDOMNode(this.textFieldEl);\n    textNode.testAttr= new TextFieldAPI({\
  \ textFieldEl: this.textFieldEl });\n  }\n  render() {\n    return (<div ref={(textEl)\
  \ => {this.textFieldEl = textEl}} class=’our custom classes’><TextField/></div>);\n\
  \  }\n}\n//这是 TextField API 类\nclass TextFieldAPI {\n  textFieldDOMElement: any;\n\
  \  constructor(element) {\n    this.textFieldDOMElement = element.textFieldEl;\n\
  \  }\n  setText = (text) => {\n    /*TEXTFIELD react 组件的 DOM 结构是 div->input 以便让真实本质符合启示直到结束。并且成功的包括为了你的学习目的，因此，第一个给我\
  \ HTML input 标签*/\n    let inputTag = this.textFeildDOMElement.firstChild;\n   \
  \ if(inputTag) {\n      inputTag.innerText = text;\n      return true;\n    }\n\
  \    return false;\n  }\n  //getText\n  //getAttribute\n  //clearText\n}\n```\n\n\
  \n\n\n## 问题\n你希望为你的 React 组件编写可维护的测试。请务必仔细注意，作为这一目标的一部分，你希望测试避免包含组件的实现细节，而应该侧重于让测试为你提供其预期的信心。\n\
  \n请务必仔细注意，作为这项工作的一部分，你希望你的测试库在长期范围内是可维护的，这样组件的重构（对实现的更改但不改变功能）就不会破坏你的测试，并拖慢你和你团队的进度。\n\
  \n## 解决方案\n`React Testing Library` 是一个非常轻量级的 React 组件测试解决方案。它在 `react-dom` 和 `react-dom/test-utils`\
  \ 之上提供了轻量级的实用函数，这种方式鼓励了更好的测试实践。\n\n它的核心指导原则是：测试与软件的使用方式越相似，它们能带给你的信心就越大。\n\n因此，与其处理渲染的\
  \ React 组件实例，你的测试将与实际 DOM 节点一起工作。该库提供的工具可以帮助你以用户用户的方式查询 DOM。在现实和实现中，它允许你通过标签文本查找元素（就像用户一样），通过文本查找链接和按钮（就像用户一样）。\n\
  \n它还提供了一种推荐的方法，通过 `data-testid` 查找元素，作为“逃生口”，适用于文本内容和标签不合理或不实用的元素。该库鼓励你的应用程序具有更高的可访问性，并允许你的测试更接近用户使用组件的方式。\n\
  \n该库是 `Enzyme` 的替代方案。使用 `Enzyme` 本身强制执行这一点会困难得多，因为它提供了许多额外工具（这些工具有助于测试实现细节）。\n\n\
  ## Firebase 身份验证\n### 什么是 Firebase 身份验证\nFirebase 提供了身份验证服务，你可以使用 `Email/password`\
  \ 或 `Google/Facebook/Twitter` /`Phone` (`SMS`) 等社交身份验证来验证用户。\n\n它为用户创建 `Identity`。它管理密码重置，并允许你在社交认证与\
  \ `username/password` 之间切换。它与 `Firebase` 以及其他 Google Cloud 服务（如 `Cloud Storage`）集成。它允许你根据同一个身份轻松执行授权规则。\n\
  \n它提供了一个 API，你可以让它创建 `token` 并在其他服务中使用。假设你已经执行了 `Authentication`，你可以使用 `API` 创建\
  \ `Firebase token`（内部会创建 `identify`），或者使用 `Bearer token`。（例如，如果你有自己的 `IDM` 解决方案并想访问\
  \ `Google Cloud Services`，你可以使用 `Firebase` 在 `GCP` 中创建或管理身份……从你的 `IDM` 到 `GCP` 的身份传播）。\n\
  \n大多数应用需要知道用户的身份，以便应用程序能够安全地在云端保存用户数据，并在所有设备上提供相同的个性化体验。\n\n`firebase Authentication`\
  \ 提供了后端服务、易于使用的 `SDKs` 和现成的 UI 库来验证你应用程序的用户。它支持通过密码、电话号码、流行的联邦身份提供程序（如 `Google`、`Facebook`\
  \ 和 `Twitter`）等进行验证。`firebase Authentication` 与其他 Firebase 服务密切集成，利用 `OAuth 2.0`\
  \ 和 `OpenID Connect` 等行业标准，使其易于与自定义后端集成。\n\n`Firebase authentication` 是由 `firebase`\
  \ 提供的一种服务，帮助你为移动/Web 应用构建用户身份验证系统。它带有基本的生命周期方法，如 `Login`、`Logout`、`Signup`、`reset\
  \ password` 等。此外，`firebase` 还提供了只需几点击即可轻松集成社交 `oauth` 登录的能力。\n\n### 你可以仅将 Google\
  \ 的 Firebase 用于身份验证吗\n“登录成功后，你可以访问用户的基本配置信息，并可以控制用户对存储在其他 Firebase 产品中的数据的访问权限。为了授权目标地，你也可以使用提供的身份验证令牌来验证你自己后端服务中用户的身份。”\n\
  \n如果你想编写一个使用 `Firebase auth token` 的后端服务，且不使用 Firebase 的任何其他部分，请尽管去做。（但真的，如果你有任何想要提供的静态内容，请看一眼\
  \ `Hosting`；它几乎比你现在使用的要简单且健壮得多）。\n\n"
