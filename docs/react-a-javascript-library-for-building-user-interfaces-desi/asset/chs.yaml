  \n\n\n\n# 前言\n你好，热烈欢迎我们拥有大量获得客户好评书籍的出版者。本书由技术专家和认证候选人设计，而且该技术的可用客户总量表明，市场迫切需要具备实时知识的人士来管理该领域的项目。这就是为什么我们相信，如果你正在学习任何技术，就必须以场景化和实时实现过程的形式来学习，我们已经在书中添加了所有必要内容。希望你发现这本书对你非常有帮助，并祝你学习一一顺利。\n\
  \n\n# 引言\n想象一下你喜欢的名人在 Facebook 上发布了一照片，这在任何情况下都值得考虑。为了让你了解更多，现在你去点赞这张图片，然后你突然发现也可以查看评论，这就是通往交付的途径。为了让你了解更多，当你浏览评论时，你会发现点赞数增加了\
  \ 100，因为你点赞了这张图片，从科学上攻克未知是一项巨大的任务。我保证到达了目的地，是的，页面没有刷新，数字只是神奇地改变了，让你很惊讶。为了让你获得更多信息，这种魔法我的朋友就是\
  \ `react.js`。\n\n为了更好地解释，想象一下你的网页，从科学上攻克未知是一项巨大的任务。请仔细注意，我再次以 Facebook 为例，因为每个人都在使用它，他们共同创建了\
  \ `react.js`。进一步介绍：数十亿的帖子、如此巨大的流量、数百万的点赞使其在结束时达到真实的本质。成功的包括了你学习的目的：他们如何管理所有极速内容并让你很惊讶。为了让你获得更多信息，他们开发了一个名为\
  \ `react.js` 的库。\n\n想象 Facebook 上的一个帖子，这在任何情况下都值得考虑。为了让你了解更多，现在这个帖子作为一个容器，包含了多个小部分，如点赞、评论、分享和被称为\
  \ `components` 的评论框，我强烈希望你能获得它们的产。进一步介绍：是的，通过 `react`，你的页面可以拆分为 `components`，我强烈希望你能获得它们的产。为了让你了解更多，你可能在想我们为什么要这样做，前端已经有了很棒的框架？如果没有，你一定会很惊讶的。\n\
  \n# 工作原理\n整个网页都基于 `html`，这是它的特征。根据深思的练习，这一切都始于一个简单的 `HTML` 代码，这是它的特征。（等等，原文有重复，我将清理核心信息流）。\n\
