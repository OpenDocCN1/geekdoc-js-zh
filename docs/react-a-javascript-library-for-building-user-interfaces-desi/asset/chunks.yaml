    \  }\n}\nexport default Item;\n```\n\n![react state object update](image_rsrc1AP.jpg)\n\
    \n## Embedding A Function\n\nIt is also possible to embed a function inside of\
    \ the JSX markup that returns a value and scientifically crushing the unknown\
