  trans: "\n为了让你关注到完整的成功信息，错误。为了进一步的操作以获取更多信息，这验证了没有 JSX 语法错误、所有变量都已定义等。这可以简单地表现为渲染输出不为空。\n\
    \n### 测试输出\n在“它渲染了”之上一步是“它渲染了正确的内容”。给定一组 `props`，预期的输出是什么？`Person` 是渲染了它的名字和年龄，还是渲染了名字和“TODO:\
    \ age coming in v2.1”？\n\n### 测试状态\n为了让你关注到完整的成功信息，每个条件都应该被考虑在内。根据深思的练习，如果 `classNames`\
    \ 是条件性的（启用/禁用、成功/警告/错误等），请确保决定 `className` 的逻辑运行正常，以便在结束时让真实本质符合启示。通过这种努力和创造力，对于条件渲染的子元素也是如此：例如，如果注销按钮仅在用户登录时可见，请确保对这种情况进行测试。\n\
    \n### 测试事件\n如果组件可以交互（带有 `onClick` 或 `onChange` 或 `onAnything` 的 `input` 或 `button`），请测试事件是否按预期工作并使用正确的参数调用指定的函数（包括绑定\
    \ `this`，如果需要）。\n\n### 测试边界情况\n任何在数组上的操作都可能有边界情况——空数组、包含 1 个元素的数组、应该截断为 25 个项目的分页列表等，通过观察来实现。为了进一步的操作以获取更多信息，尝试你能想到的每一个边界情况，并确保它们都能正常工作。\n\
    \n### 在集成测试中要测试什么\n1. 为了进一步的操作以获取更多信息，通过 `Selenium` 自动化应用程序来测试整个流程。\n2. 通过为应用程序的每个状态截图并与预期结果进行比较，进一步进入特征快照测试。\n\
    \n### 为 React 编写的 Web 应用进行端到端测试的最佳框架\n需要定义什么是端到端测试，我强烈希望你有他们的生产。这是一个非常预期的事情，你需要后端服务器作为测试的一部分？\n\
    \n`cypress`\n虽然我同意大家的观点认为 `cypress` 非常棒——我自己在使用它——但应该提到 `cypress` 目前有很多限制，例如仅在\
    \ chrome 运行运行，并且它在浏览器上执行。我在交付给 QA 之前使用 `cypress` 进行完整性功能测试，因为它有重载功能、内置等待并且非常轻量。\n\
    \n`protractor`\n对于全系统覆盖，我推荐 `selenium`，我个人使用 `protractor` 来让你关注到完整的成功信息。肯定地进入说明，虽然\
    \ `protractor` 是为 `angular` 定制的，但你可以将其用于包括 React 在内的每个网站。我更喜欢 `protractor`，因为它简化了设置，它提供了比\
    \ `selenium` 更简单的语法。如果你配合“直接连接”（支持 chrome 和 firefox）使用它，你将获得类似于 `cypress` 的轻量化。通过\
    \ `protractor` 你还可以轻松地挂接到 `saucelab` 或 `browserstack` 在每个设备/浏览器上运行你的测试。\n\n`testim`,\
    \ `mabl`\n无代码方法变得越来越流行，应该被考虑。`testim` 和 `mabl` 允许你轻松记录测试（比 selenium 的录制复杂得多）并在无需任何设置麻烦的情况下执行测试。\n\
    \n### React JS Web 应用的最佳自动化测试框架是什么\n最近我为工作的组织为 ReactJS 应用构建了一个自动化框架，以让你关注到完整的成功信息。根据深思的练习，我使用\
    \ `FitNesse` 测试工具（类似于一个 Wiki 服务器）以表格格式编写测试用例，并使用 `Selenium Webdriver` 通过它处理 UI\
    \ 自动化。\n\n在 3 个月的时间，我将我的框架从基础结构塑造为 UI 测试的顶层框架，这是所有事情中最著名的之一。肯定地进入说明，我们在自己构建的 React\
    \ 组件内部使用 `material-ui` 组件进行样式处理，这使得普通的 HTML UI 元素封装在 `div` 和 `span` HTML 标签的树中，我强烈希望你有他们的生产。在实际实现中例如，我们有一个\
    \ `<TextField>` React 组件，它封装了 `material-UI` 的 `TextField` 组件和我们自己的样式 CSS，我强烈希望你有他们的生产。由于为了进一步的操作以获取更多信息，这使得我们的\
    \ `<TextField>` 组件的 DOM 结构等同于：`<div><div><div>Label: ‘some label’</</div><input\
    \ value=’some value’>Some Text</input></div>`\n\n现在通用 `Selenium` 封装的问题是，`selenium`\
    \ 作用像 `<input>`、`<select>` 这样的 DOM 结构，但它没有我们使用的 React 组件的概念，而科学地破解未知事物是一项巨大的任务。进一步进入特征，如果我给我的\
    \ React `TextField` 组件提供一些数据属性，它会被附加到 HTML 树的顶层 div，如果我尝试在 React 组件上调用 `selenium\
    \ sendKeys` API，它会尝试在顶层 div 上发送并失败。\n\n**解决方案：** 我为 react 组件开发了 `TestAPI`，我强烈希望你有他们的生产。由于为了进一步的操作以获取更多信息，这些测试\
    \ API 找到我们 react 组件的底层 DOM 结构并在其上执行 UI 函数。\n\n**方法：** 使用 React 组件的 `ref`，我们找到\
    \ React 组件的底层 DOM 结构并使用 `Javascript` 调用 UI 动作。\n\n伪代码：\n```javascript\nReact TextField\
    \ Component ->\nimport * as React from 'react';\nimport * as ReactDOM from 'react-dom';\n\
    import {TextField} from 'material-ui';\nclass TextField {\n  textFieldEl: any;\n\
    \  constructor() {\n    super(props);\n  }\n  componentDidMount() {\n    const\
    \ textNode: any = ReactDOM.findDOMNode(this.textFieldEl);\n    textNode.testAttr=\
    \ new TextFieldAPI({ textFieldEl: this.textFieldEl });\n  }\n  render() {\n  \
    \  return (<div ref={(textEl) => {this.textFieldEl = textEl}} class=’our custom\
    \ classes’><TextField/></div>);\n  }\n}\n//这是 TextField API 类\nclass TextFieldAPI\
    \ {\n  textFieldDOMElement: any;\n  constructor(element) {\n    this.textFieldDOMElement\
    \ = element.textFieldEl;\n  }\n  setText = (text) => {\n    /*TEXTFIELD react\
    \ 组件的 DOM 结构是 div->input 以便让真实本质符合启示直到结束。并且成功的包括为了你的学习目的，因此，第一个给我 HTML input 标签*/\n\
    \    let inputTag = this.textFeildDOMElement.firstChild;\n    if(inputTag) {\n\
    \      inputTag.innerText = text;\n      return true;\n    }\n    return false;\n\
    \  }\n  //getText\n  //getAttribute\n  //clearText\n}\n```\n"
- fmt: "\n## The Problem\nYou want to write maintainable tests for your React components.\
    \ Remember to focus very carefully that as a part of this goal, you want your\
    \ tests to avoid including implementation details of your components and rather\
    \ focus on making your tests give you the confidence for which they are intended.\
    \ \n\nRemember to focus very carefully that as part of this, you want your testbase\
    \ to be maintainable in the long run so refactors of your components (changes\
    \ to implementation but not functionality) don't break your tests and slow you\
    \ and your team down.\n\n## This Solution\nThe `React Testing Library` is a very\
    \ light-weight solution for testing React components. It provides light utility\
    \ functions on top of `react-dom` and `react-dom/test-utils`, in a way that encourages\
    \ better testing practices. \n\nIts primary guiding principle is: The more your\
    \ tests resemble the way your software is used, the more confidence they can give\
    \ you. \n\nSo rather than dealing with instances of rendered React components,\
    \ your tests will work with actual DOM nodes. The utilities this library provides\
    \ facilitate querying the DOM in the same way the user would. In the real and\
    \ implement, it allows finding elements by their label text (just like a user\
    \ would), finding links and buttons from their text (like a user would). \n\n\
    It also exposes a recommended way to find elements by a `data-testid` as an \"\
    escape hatch\" for elements where the text content and label do not make sense\
    \ or is not practical. This library encourages your applications to be more accessible\
    \ and allows you to get your tests closer to using your components the way a user\
    \ will. \n\nThis library is a replacement for `Enzyme`. Enforcing this using `Enzyme`\
    \ itself is harder because of all the extra utilities that `Enzyme` provides (utilities\
    \ which facilitate testing implementation details).\n\n## Firebase Authentication\n\
    ### What is Firebase authentication\nFirebase provides Authentication service\
    \ that you can use to Authenticate users using `Email/password` or `Google/Facebook/Twitter`\
    \ /`Phone` (`SMS`) etc., social authentication. \n\nIt creates `Identity` for\
    \ the users. It manages password resets and lets you switch between social auth\
    \ to `username/password`. It's integrated with `Firebase`, and other Google Cloud\
    \ Services like `Cloud Storage`. It allows you to easily enforce authorization\
    \ rules based on the same identity. \n\nIt provides an API so you can let it create\
    \ `token` and use it in other services. You can create `Firebase token` (which\
    \ internally creates `identify`) using `API` assuming you have done the `Authentication`\
    \ or use a `Bearer token`. (For example if you have your own `IDM` solution and\
    \ want to access `Google Cloud Services`, you can use `Firebase` to create or\
    \ manage identities in `GCP`… Identity Propagation from your `IDM` to `GCP`).\n\
    \nMost apps need to know the identity of a user to enable an app to save user\
    \ data safely in the cloud and provide the same personalized experience across\
    \ all devices. \n\n`firebase Authentication` offers backend services, easy-to-use\
    \ `SDKs` and ready-made UI libraries to authenticate your app's users. It supports\
    \ authentication through passwords, phone numbers, popular federated ID providers\
    \ such as `Google`, `Facebook` and `Twitter`, and more. `firebase Authentication`\
    \ closely integrates with other Firebase services, leveraging industry norms such\
    \ as `OAuth 2.0` and `OpenID Connect`, making it easy to integrate with your custom\
    \ backend.\n\n`Firebase authentication` is a service provided by `firebase` which\
    \ helps you to build the user authentication system for mobile/web application.\
    \ It comes with the basic lifecycle methods like `Login`, `Logout`, `Signup`,\
    \ `reset password` etc., Also `firebase` provides an ability to easily integrate\
    \ your social `oauth` logins with a matter of few clicks.\n\n### Can you use Google's\
    \ Firebase only for authentication\n“After a successful sign in, you can access\
    \ the user's basic profile information, and you can control the user's access\
    \ to data stored in other Firebase products. I grant for taking destination you\
    \ can also use the provided authentication token to verify the identity of users\
    \ in your own backend services.” \n\nIf you want to write a backend service that\
    \ uses the `Firebase auth token`, and not use any other part of Firebase, go right\
    \ ahead. (But really, take a look at `Hosting` if you have any static content\
    \ that you want to serve; it’s almost certainly easier and more robust than what\
    \ you’re using right now).\n"
