    # 使用 React.js 的目的是什么？


    我从事 ReactJS 工作，因此我可以很好地解释这一点。ReactJS 是由 Facebook 设计的一个开源 JavaScript 库，旨在通过最少的代码快速高效地创建丰富且交互良好的
    Web 应用。


    ## 历史

    在 Facebook 开发 `ReactJS` 时，虽然可以使用 `Angular` 等其他技术，但大多数开发者被迫编写大量的代码；这是其中最著名的问题之一。他们希望有一个框架可以允许他们拆解复杂组件并复用代码以更快地完成项目。


    ## 解决方案

    ReactJS 提供了开发者寻找的解决方案。它使用了 `JSX`（一种独特的语法，允许使用 HTML 引以及 HTML 标签语法来渲染特定的子组件）。这对于促进机器可读代码的构建非常有帮助，同时可以将组件组合成一个单次可验证的文件。


    ## 为什么很多人倾向于使用 ReactJS？

    - 它将 HTML 直接引入你的 `JS` 中。

    - 组件的概念是使 `ReactJS` 脱颖而出的原因。

    - `ReactJS` 中的 `Props` 允许将自定义数据传递给特定的 UI 组件。

    - `State` 允许在一个区域中存储所有更改。

    - 它使用 `Virtual DOM` 使应用运行飞快。

    - `ReactJS` 开发者将帮助你制定可实现的目标，并演示业务如何利用该技术加速增长、提高转化、降低成本并提高率。


    ## React 中的单向数据绑定

    你一定听过 `Angular` 中的双向数据绑定。但由于 `React` 是一个库，由于有 `JSX`，那里没有分离的 HTML 和脚本概念。在双向数据绑定中，输入元素的任何更改都会反映在组件中，因为两者都是绑定的。当我们谈论单向数据绑定时，输入元素无法反映
    `JSX` 代码中的更改，除非并且你使用了更改事件。


    记住 `Angular` 自动使用监听器和定时器来做到这一点，但 `React` 将其限制为单向数据流。然而，它至少允许动态更改渲染组件，这在以前使用 `AJAX`
    时是不可能的因为你必须刷新页面；而现在，更改通过单向数据绑定反映在独立的组件上。


    ## 设置你的环境


    ### 安装 visual studio code

    1. 下载 Windows 版本的 `Visual Studio Code` 安装程序。

    2. 下载完成后，运行安装程序（`VSCodeUserSetup-{version}.exe`）。

    3. 默认情况下，`VS Code` 安装在 `C:\users\{username}\AppData\Local\Programs\Microsoft VS
    Code`。


    或者，你也可以下载 `Zip` 压缩包，解压并从那里运行 `Code`。


    **注意：** `VS Code` 需要 `.NET Framework 4.5.2` 或更高版本。如果你使用的是 Windows 7，请确保你至少安装了
    `.NET Framework 4.5.2`。你可以通过命令提示符使用此命令检查 `.NET Framework` 版本：


    ```

    reg query "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\full"
    /v version

    ```


    **提示：** 安装会将 `Visual Studio Code` 添加到你的 `%PATH%` 中，因此你可以从控制台输入 `code .` 在该文件夹打开
    `VS Code`。你需要在安装后重启控制台使 `%PATH` 环境变量生效。


    ### 用户与系统设置

    `VS Code` 提供了 Windows 用户级和系统级设置。

    - **用户设置**：不需要管理员权限，因为位置位于你的用户本地 AppData (`LOCALAPPDATA`) 文件夹下。这提供了更平滑的后台更新体验。

    - **系统设置**：需要提升到管理员权限，并将安装放在 `Program Files` 下。


    ### 32 位版本

    如果你需要运行 32 位的 `VS Code`，提供了 32 位的 `Installer` 和 `Zip` 压缩包。


    ### 更新

    `VS Code` 每月发布版本，并在新版本可用时支持自动更新。如果 `VS Code` 提示你，接受最新更新它将会被安装。

    **注意：** 如果你喜欢按照自己的计划更新 `VS Code`，可以禁用自动更新。


    ## 作为开发机的 Windows

    Windows 是一个流行的操作系统，它可以是一个极好的跨平台开发环境。本节描述了跨平台功能，例如`Windows Linux 子 system` (`WSL`)
    和新的 `Windows Terminal`。


    ### 最近的 Windows 版本

    确保你使用的是较新的 Windows 10 版本。检查 `设置` > `Windows 更新` 查看你是否是最新状态。


    ### Windows Linux 子系统

    通过 `WSL`，你可以在 Windows 上安装并运行 Linux 发行版。这允许你在本地 Windows 机器上工作的同时，在 `Linux` 上开发和测试你的源码。当配合
    `Remote - WSL` 扩展时，你可以在 `WSL` 上下文中获得完整的 `VS Code` 编辑和调试支持。


    ### 新版 Windows Terminal

    从微软商店获取的 `Windows Terminal (Preview)` 让你能够在多标签页 shell 中轻松地打开 `PowerShell`、命令提示符和
    `WSL` 终端。


    ## 下一步骤

    一旦你安装了 `VS Code`，这些主题将帮助你了解更多 VS Code：

    - **其他组件**：学习如何安装 `Git`、`Node.js`、`TypeScript` 以及像 `Yeoman` 的工具。

    - **用户界面**：对 `VS Code` 的快速介绍。

    - **用户/工作区设置**：学习如何通过设置按偏好配置 `VS Code`。

    - **技巧与窍门**：让你直接上手并学习如何使用 `VS Code` 高效工作。


