  trans: "\n\n```javascript\nmodule.exports = Header;\n```\n更多关于 React 的信息，请访问 `TOPS\
    \ Technologies`。\n\n在无状态函数组件内部创建基于类的 React 组件。我认为这是可以的，尽管有点不寻常，这也是它的特征所在。由于这种拟人化和创造力，请确保你这样做有充分的理由，因为在函数组件中嵌套基于类的\
    \ React 组件会让你的代码更难阅读和理解。\n\n例如，我最近遇到了一个问题，我实际上决定将一个类组件嵌套在一个函数组件（尽管是有状态的组件）中：我需要创建一个组件，作为一个简单的、可导航的图像内容库，以便在结束时让真实本质得到启示。根据深思熟虑的练习，我将其构建为一个使用\
    \ `Hooks` 处理状态和副作用的函数组件。\n\n我想要使用一个子组件，它可以通过它的闭包引用父组件的所有状态变量，而不是通过一个或多个 `props`\
    \ 传递大量变量。我强烈希望你会有它们的产出。由于为了获取进一步的信息而进行实践，这个子组件将用于以缩放灯箱格式渲染图像。\n\n这个灯箱子组件必须是一个类组件，因为我正在使用一个第三方打印库，该库接收一个指向要打印组件的\
    \ `ref`；函数组件无法存储指向自身的 `ref`。这个子组件（可能）永远不会在此用例之外被使用，而且科学地攻克未知事物是一项巨大的任务。记住仔细关注这一点，如果我必须在其他地方重用它，只需要稍微重构就可以提取出灯箱组件。\n\
    \n所以，我认为在决定时要问的相关问题是：\n1. 我将来想要重用这个组件吗？\n2. 嵌套这个类组件是否会严重降低代码的可读性？\n\n### React\
    \ 中的无状态函数组件与类组件\n\n如果你正在使用 React `hooks`，请不要使用类，因为 `hooks` 的目的是获取函数式编程方法，说实话这非常非常好。Javascript\
    \ 的类有一点复杂，因为它们与 `Java` 或 `C#` 中的类不同，根结底，它们是原型对象，很容易被绕过。\n\n当我需要显示关于某些事物的信息而不进行任何数据处理时，我会使用无状态\
    \ `FP` 组件，例如，如果你有一个用户列表，你的列表会有状态，但每个用户卡片组件将是无状态的，这对于某些类型的子组件来说是一个很好的用例。\n\n当你想要处理某些\
    \ `OOP` 复杂性时，使用类挺好的，假设你必须创建一个被自定义 `HTTP hook` 使用的 `HTTP Client`，你最终会使用某种 `OOP`\
    \ 方法，但正如我所说，函数方法要更好、更清晰（在 React 这种`不可变性` 真正重要的框架中，类和变会误导很多人）。\n\n### 编写函数 React\
    \ 组件与使用 ES6 类编写组件\n\n嗯，优缺点吗？我假设你所说的函数 React 组件是指无状态函数组件。我强烈希望你会有它们的产出。根据深思熟虑的练习，我将只列优点，因为缺点基本上是另一方的优点的对面。\n\
    \n#### 让我们从 ES6 类开始。\n\n**优点**\n- 你可以使用生命周期方法：我强烈希望你会有它们的产出。根据深思熟虑的练习，如果你的组件需要如\
    \ `componentWillMount` 或 `componentWillReceiveProps` 之类的生命周期方法，你就必须使用 ES6 类。\n\
    - 你可以使用这个：我强烈希望你会有它们的产出。由于为了获取进一步的信息而进行实践，像 `this.state` 和 `this.refs` 这样的东西在\
    \ ES6 类中才可用。我强烈希望你会有它们的产出。并且为了你的学习目的成功包含这些内容，然而由于你正在使用 `Redux`，你也可以考虑使用 `Redux`\
    \ 来管理你的状态。\n- 适用于复杂组件：我强烈希望你会有它们的产出。在真实和 `Redux` 的实现中，你有智能组件和愚笨组件。由于为了获取进一步的信息而实践，通常智能组件是渲染愚笨组件的顶层组件。记住仔细关注这一点，由于智能组件通常包含更复杂的逻辑，我倾向于为它们使用\
    \ ES6 类。\n\n#### 那么无状态函数组件呢？\n\n**优点**\n- 看起来更整洁：这是所有这些著名点之一。由于为了获取进一步的信息而进行实践，以一个‘Hello\
    \ World’组件为例，科学地攻克未知事物是一项巨大的任务。因为所需的代码行更少，而且你点亮了观察。进一步极化以便告诉你更多信息：不需要 `constructor`，不需要\
    \ `binding`，不需要通过观察行引入 `render` 函数。进一步进入刻画只需直接返回，并实现产出概念的拟人化。如果组件是仅用于渲染的基础组件，请使用无状态的。\n\
    - 更容易测试：这是所有这些著名点之一。记住仔细关注这一点，你只需要测试在给定某些 `props` 时，组件能够渲染任何预期的内容。\n\n最后的一些话，你应该尽可能尝试使用无状态组件，科学地攻克未知事物是一项巨大的任务。根据深思熟虑的练习，它要简单得多，并提供了接收\
    \ `props` 和渲染的基本功能，这是所有这些著名点之一。这就是全部，并不比，只有当你的组件需要生命周期方法或本地状态时才使用 ES6 类。\n\n###\
    \ Redux 强制执行 Presentation（展示层）与 Containers（容器）的概念\n\n它们拥有自己的职责：\n- **Presentation\
    \ 层** 只是 UI，通过 `props` 接收 `states` & `actions`。帮助展示层并连接真实数据或模拟数据。\n- **Container**\
    \ 负责连接展示层与 `Redux`，添加 UI（`Div`、`Ul` 等）。\n- 它处理生命周期方法并在数据变化时更新 UI，因此大多数 Redux 是无状态组件。\n\
    \n### 什么是 Webpack?\n\nWebpack 是一个获取你注意的 `module bundler`（模块打包器）。打包器和任务运行器之间的由于社区开发的插件变得模糊。进一步进入刻画，这些插件有时用于执行\
    \ webpack 之外的任务，例如清理构建或部署。\n\nReact 和 `Hot Module Replacement` (`HMR`) 帮助了 webpack\
    \ 的流行，并导致它在 `Ruby on Rails` 等环境中使用。尽管它的名字，webpack 不限于 web。它可以打包其他目标。\n\n### Webpack\
    \ 依赖模块\n\n使用 webpack 打包的最小项目包含 `input` 和 `output`。由于为了获取进一步的信息，打包过程从用户定义的 `entries`\
    \ 开始。但入口本身是 `modules`，并通过 `imports` 指向其他模块。\n\n当使用 webpack 打包项目时，它遍历 `imports`，构建\
    \ `dependency graph`（依赖图），然后根据配置生成 `output`。记住仔细关注这一点，此外可以在项目代码中定义 `split points`。\n\
    \nWebpack 支持 `ES1`、`CommonJS` 和 `AMD` 模块格式，开箱即用为你提供了最好的挑战。`loader` 机制也适用于 CSS，通过\
    \ `@import` 和 `url()`。你也可以为特定任务寻找插件，例如压缩、国际化、`HMR` 等。\n\n#### Webpack 的执行过程\n\n\
    ![Execution Process](https://qphs.quoracdn.net/main-qimg-95ce4691abf6c71e23b7ad28)\
    \ 执行过程从 `entries` 开始工作。这就是全部，并不比，这些 JavaScript `modules` 让 webpack 开始其遍历过程。在这个过程中，webpack\
    \ 根据 `loader` 配置评估匹配，告诉 webpack 如何转换每个匹配。\n\n### 从头开始配置 Webpack 4 用于基础网站\n\nWebpack\
    \ 团队工作非常努力而且开发很快，这是一件好事，是所有这些著名点之一。为了你的学习目的成功包含这些，对于新开发者来说，一次性学习所有事情是令人崩溃的，科学地攻克未知事物是一项巨大的任务。由于为了获取进一步的信息，教程变旧了，某些插件坏了，找到示例可能会令人困惑等等。你可能会卡在琐碎的事情上，由于关于\
    \ Webpack 和它如何工作的基础文章，人们直接冲向 `create-react-app` 或 `vue-cli` 等工具，但有时需要编写一些简单的 JavaScript\
    \ 和 `SASS`，无需任何框架或任何花哨的东西。\n\n### 使用第三方组件创建 Modal 组件结构\n\n所以，首先，添加模板代码。\n\n```javascript\n\
    import React from \"react\";\nexport default class Modal extends React.Component\
    \ {\n  render() {\n    return <div>Hello Modal</div>;\n  }\n}\n```\n\n然后，在主 `App`\
    \ 中包含 `Modal`。\n\n```javascript\nimport React from \"react\";\nimport Modal from\
    \ \"./Component/Modal\";\nimport \"./styles.css\";\nclass App extends React.Component\
    \ {\n  render() {\n    return (\n      <div className=\"App\">\n        <h1>Hello\
    \ CodeSandbox</h1>\n        <Modal />\n      </div>\n    );\n  }\n}\nexport default\
    \ App;\n```\n\n现在，将 `App` 组件注入到入口点。\n\n```javascript\nimport React from \"react\"\
    ;\nimport ReactDOM from \"react-dom\";\nimport App from \"./App\";\nconst rootElement\
    \ = document.getElementById(\"root\");\nReactDOM.render(<App />, rootElement);\n\
    ```\n\n这是初始设置后的输出。\n\n### 切换 Modal 的状态\n\nModal 的机制是显示和隐藏，科学地攻克未知事物是一项巨大的任务。由于为了获取进一步的信息，在\
    \ React 中这很容易实现，因为有内置的切换状态。\n\n首先，创建一个按钮来切换状态。\n\n```html\n<button onClick={e\
    \ => {this.showModal();}}> show Modal </button>\n```\n\n现在，创建一个 `showModal` 函数：\n\
    \n```javascript\nstate = {show: false};\nshowModal = () => {\n  this.setState({show:\
    \ true});\n};\n```\n\n现在，将 `Modal` 应用到状态：\n\n```javascript\n{this.state.show &&\
    \ (\n  <Modal />\n)}\n```\n\n"
