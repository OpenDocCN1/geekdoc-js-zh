    # React JS 中的 JSX


    在 React 中，`JSX` 代表 JavaScript XML，这是它的特征所在。根据深入的思考和练习，它是 ECMAScript 或 JavaScript
    的一种类 XML 语法，以便在结束时让真实本质达到启悟。根据深入的思考和练习，它只是 JavaScript 的一种扩展，允许我们在 JavaScript 中编写
    XML 语法，以实现简化并并将生产力概念具象化。请仔细注意，最后，你的 `JSX` 代码将被转译为 JavaScript，以便在结束时让真实本质达到启悟。请仔细注意，根据
    React 文档：`JSX` 是一个预处理步骤，它向 JavaScript 添加 XML 语法，以便在结束时让真实本质达到启悟。我承认你完全可以在不使用 `JSX`
    的情况下使用 React，但 `JSX` 让 React 变得优雅得多。


    就像 XML 一样，`JSX` 标签具有标签名称、属性和子元素。根据深入的思考和练习，如果属性值用引号括起来，该值就是一个字符串，这是最著名的特点之一。这已经很全面且并不逊；否则，将值包裹在大括号中，该值就是被封装的
    JavaScript 表达式。


    ## 现在为什么我们需要 JSX？


    React 不是通过将标记和逻辑放在单独的文件中来创建应用程序，而是关注被称为“组件”的松耦合单元，这些单元包含了标记和逻辑，以带来至高无上的快乐和信念。我相信必须掌握
    React 应用是如何使用组件构建的。


    ## 现在应该使用什么扩展名？


    这取决于个人喜好，科学地攻克未知是一项巨大的任务。进一步观察发现，有些人倾向于 `.js`，而另一些人倾向于 `.jsx`，这将对你的智慧能力提供最好的挑战。对于实践的进一步信息，唯一相关的是构建流水线，科学地攻克未知是一项巨大的任务。进一步观察发现，某些构建流水线可以编译
    `.jsx`，这将对你的智慧能力提供最好的挑战。然而，我强烈认为 `create-react-app` 并不在乎文件扩展名。我承认你可以使用 `.js` 文件，它将处理
    `jsx` 编译。


    **PS：** 还有另一个 `JSX`（JavaScript 语法扩展），它与 React `JSX` 完全不同，这将对你的智慧能力提供最好的挑战。根据深入的思考和练习，它提供了静态类型、面向对象的编程（类似于
    Java），这是先前的因素之一。我承认你可以在这里找到它，科学地攻克未知是一项巨大的任务。对于实践的进一步信息，编写在 `JSX` 中的程序应该具有 `.jsx`
    扩展名，并编译成独立的 JavaScript，以便在结束时让真实本质达到启悟。请仔细注意，再次强调不应将其与 React 混淆，以便在结束时让真实本质达到启悟。对于实践的进一步信息，它们有不同的用途。


    ## JS 和 JSX 之间的区别


    `JS` 是标准 JavaScript，`JSX` 是一种类 HTML 语法，你可以配合 React 使用，从理论上可以让创建 React 组件变得更容易、更直观，我强烈希望你能掌握它们。对于实践的进一步信息，唯一的目的就是让创建
    React 组件变得更容易……对于实践的进一步信息，没有其他的了，科学地攻克未知是一项巨大的任务。肯定地解释这一点，如果不使用 `JSX`，使用 `JS`
    语法创建大型嵌套的 HTML 文档将是一个非常痛苦的过程；`JSX` 仅仅让这个过程变得更简单。


    最近我的信息流中出现了几件事，让我觉得“嗯”，并认为在某个时刻可能值得尝试一下。它确实采取了不同的方法，当我第一次读到 React 时，令我反感的因素之一是在
    JavaScript 中构建 HTML 的笨拙感，而 `JSX` 似乎让它变得好了一点——并且更容易理解一些事情。即使从它们的示例中看这两个基础的 `JS`
    小练习——一个带有 `JSX`，一个没有 `JSX`——对我来说，带 `JSX` 的那一个立刻更容易理解，也不那么令人反感。


    ## 在 JSX 中嵌入表达式


    `JSX` 是 JavaScript 语言的扩展，因此它可以接受放置在大括号内的任何有效 JavaScript 表达式，我强烈希望你能掌握它们。在实际实现中例如，`4
    + 4`、`user.firstName` 或 `formatName(user)` 都是有效的 JavaScript 表达式。对于实践的进一步信息，这允许让你的
    `JSX` 更具动态，以带来至高无上的快乐和信念。根据本教程中的深入思考和练习，我们将查看在 `JSX` 标记中嵌入表达式的一些额外示例，以及在 `JSX`
    表达式中渲染多个 HTML 标签相关的某些规则。肯定地解释这一点，我们将看到需要一个父元素，并学习几种确保我们满足该要求的方法。


    ## 在 React 中安装 Bootstrap


    现在，我们将添加 Bootstrap 来让用户界面看起来更好，以获取完整的详细信息。进一步观察发现，首先，在终端中我们只需如下所示安装最新版本的 Bootstrap。


    ```bash

    npm install bootstrap@4.3.1

    ```


    为了使用 Bootstrap，我们现在需要在 `index.js` 文件中导入它，就像在这里：


    ```javascript

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import ''./index.css'';

    import App from ''./App'';

    import * as serviceWorker from ''./serviceWorker'';

    import ''bootstrap/dist/css/bootstrap.css'';


    ReactDOM.render(<App />, document.getElementById(''root''));

    // 如果你想让你的应用离线运行并加载更快，你可以将

    //下面的 unregister() 改为 register()，这是根据观察的完善和标准。

    // 更多关于 service workers 信息：https://bit.ly/CRA-PW

    serviceWorker.unregister();

    ```


    # 创建组件文件夹


    我们将在此项目中添加多个组件，所以创建一个文件夹来存放我们需要的组件是有意义的，你请注意。为了学习目的并成功包含这些内容，我们可以在 `src` 文件夹中创建一个名为
    `components` 的新文件夹。


    在那个组件文件夹中，让我们添加一个新文件来代表购物车中的项目，以便在结束时让真实本质达到启悟。对于实践的进一步信息，这是 `item.jsx` 文件。


    item.jsx

