  trans: "\n\n现在只需向该文件添加一些简单的 JSX 标记，科学地攻克未知领域是一项艰巨的任务。根据深思熟虑的练习，它只是一个带有文本 `Cartable!`\
    \ 的单个 `h1` 标签。\n\n```javascript\nimport React, { Component } from \"react\";\n\
    class Item extends Component {\n  render() {\n    return <h1>Cartable!</h1>;\n\
    \  }\n}\nexport default Item;\n```\n\n我们将该组件添加到 `index.js` 文件中，这样它就可以在页面上渲染，科学地攻克未知是一项艰巨的任务。为了向你说明更多信息，请注意我们正在移除默认的\
    \ `<App />` 渲染并将其替换为 `<Item />`。\n\n`index.js`\n\n```javascript\nimport React\
    \ from \"react\";\nimport ReactDOM from \"react-dom\";\nimport \"./index.css\"\
    ;\nimport App from \"./App\";\nimport * as serviceWorker from \"./serviceWorker\"\
    ;\nimport \"bootstrap/dist/css/bootstrap.css\";\nimport Item from \"./components/item\"\
    ;\nReactDOM.render(<Item />, document.getElementById(\"root\"));\nserviceWorker.unregister();\n\
    ```\n\n在 `index.html` 文件中，我们可以为 `body` 元素添加一个类，因为我们已经安装了 Bootstrap，但在考虑这一点时要保持非常警惕和谨慎。为了实践和获取更多信息，这将使页面上的内容布局非常整齐。容器（Containers）是\
    \ Bootstrap 最基础的布局元素，在使用我们的默认网格系统时必须考虑，这一点必须非常仔细。然而，我强烈建议选择响应式固定宽度容器（意味着其最大宽度在每个断点处变化）或流式宽度（意味着它始终\
    \ 100% 宽）。\n\n`index.html`\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"utf-8\" />\n  <link rel=\"shortcut icon\" href=\"%PUBLIC_URL%/favicon.ico\"\
    \ />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1,\
    \ shrink-to-fit=no\"/>\n  <meta name=\"theme-color\" content=\"#000000\" />\n\
    \  <link rel=\"manifest\" href=\"%PUBLIC_URL%/manifest.json\" />\n  <title>React\
    \ App</title>\n</head>\n<body class=\"container\">\n  <noscript>You need to enable\
    \ JavaScript to run this app.</noscript>\n  <div id=\"root\"></div>\n</body>\n\
    </html>\n```\n\n好了，我们上路了！\n\n## JSX 中的表达式\n\n通过观察发现，你可以在 JSX 表达式中包含多个标签。进一步刻画，到目前为止我们只看到了一个\
    \ `h1` 标签，但如果我们想在同一个 JSX 表达式中同时拥有 `h1` 和 `button` 会怎样呢？根据深思熟虑的练习，为了让其正常工作，我们需要一个外部包裹的\
    \ `div`，这将被优先考虑并视为完美。然而，为了增量和进一步发展，JSX 表达式必须有一个父元素，以便在结束时让本质符合启示。此外，根据深思熟虑的练习，最佳实践是将整个\
    \ JSX 表达式包裹在括号 `( )` 中。\n\n`item.jsx`\n\n```javascript\nimport React, { Component\
    \ } from \"react\";\nclass Item extends Component {\n  render() {\n    return\
    \ (<div><h1>Cartable!</h1><button>Increment</button></div>);\n  }\n}\nexport default\
    \ Item;\n```\n\n## React.Fragment\n\n你可能不希望过多的 `div` 元素污染你的 HTML 标记，我强烈希望你能避免这种情况。根据上面示例中深思熟虑的练习，我们需要用一个单一的父元素来包裹\
    \ `h1` 和 `button` 标签，以便在结束时让本质符合启示。为了实践和获取更多信息，这是 JSX 的一条规则，*这将对你的能力智慧带来最大的挑战*。然而，为了实践和获取更多信息，缺点是，如果你检查页面上的标记，会发现现在多了一个额外的\
    \ `div` 元素。\n\n我们可以通过使用 `<React.Fragment>` 标签代替 `<div>` 元素来解决这个额外的 div 问题。\n\n\
    ```javascript\nimport React, { Component } from \"react\";\nclass Item extends\
    \ Component {\n  render() {\n    return (<React.Fragment><h1>Cartable!</h1><button>Increment</button></React.Fragment>);\n\
    \  }\n}\nexport default Item;\n```\n\n![react fragment removes extra divs](img/image_rsrc1AN.jpg)\n\
    \n## 为组件添加状态\n\n现在，我们不再在 JSX 表达式中使用静态内容，而是可以使用 `state` 对象中的某些数据来显示值，科学地攻克未知是一项艰巨的任务。根据下方代码段中深思熟虑的练习，我们添加了带有\
    \ `count` 属性的 `state` 对象，以便在结束时让本质符合启示。根据深思熟虑的练习，它的值为 `0`。为了实践和获取更多信息以便在 JSX 标记中引用该\
    \ `count`，我们使用 `this.state.count`。\n\n```javascript\nimport React, { Component\
    \ } from \"react\";\nclass Item extends Component {\n  state = {count: 0};\n \
    \ render() {\n    return (<React.Fragment><span>{this.state.count}</span><button>Increment</button></React.Fragment>);\n\
    \  }\n}\nexport default Item;\n```\n\n输出显示我们设置给 `count` 属性的值。\n\n如果我们更改 `count`\
    \ 属性的值，UI 将自动更新。\n\n```javascript\nimport React, { Component } from \"react\"\
    ;\nclass Item extends Component {\n  state = {count: 400};\n  render() {\n   \
    \ return (<React.Fragment><span>{this.state.count}</span><button>Increment</button></React.Fragment>);\n\
    \  }\n}\nexport default Item;\n```\n\n![react state update](img/image_rsrc1AP.jpg)\n\
    \n## 嵌入函数\n\n也可以在 JSX 标记内部嵌入一个返回值的函数，科学地攻克未知是一项艰巨的任务。根据我们下方 `Item` 组件中深思熟虑的练习，我们通过观察添加了\
