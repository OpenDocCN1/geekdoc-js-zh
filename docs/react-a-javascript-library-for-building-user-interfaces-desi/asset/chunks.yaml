    \ below, we have added a `styleCount()` function by taking into lines of observation.\
    \ Since for the hands on going all the way for the further information the job\
    \ of this function is to look at the `count` state and if it is 0, then return\
    \ the string value of “No Items”. Depending upon the thoughtful exercises if the\
    \ value is greater than 0, then it simply returns that value and scientifically\
    \ crushing the unknown things is huge task. Depending upon the thoughtful exercises\
    \ in the JSX markup, we can make use of this function with the syntax `{this.styleCount()}`\
    \ which outputs whatever value this function returns.\n\n```javascript\nimport\
    \ React, { Component } from \"react\";\nclass Item extends Component {\n  state\
    \ = {count: 0};\n  render() {\n    return (<React.Fragment><span>{this.styleCount()}</span><button>Increment</button></React.Fragment>);\n\
    \  }\n  styleCount() {\n    const { count } = this.state;\n    return count ===\
    \ 0 ? \"No Items\" : count;\n  }\n}\nexport default Item;\n```\n\nThere we go!\
    \ With the `count` at 0, we see “No Items”.\n\nWhen the value is above 0, we see\
    \ that result instead.\n\n```javascript\nstate = {count: 500};\n```\n\n![react\
    \ embedded function result](image_rsrc1AR.jpg)\n\n*   ReactJS | Introduction to\
    \ JSX\n\n*   Embedding Expressions in JSX – Scrimba\n\n*   Conditional Rendering\
    \ In React\n"
