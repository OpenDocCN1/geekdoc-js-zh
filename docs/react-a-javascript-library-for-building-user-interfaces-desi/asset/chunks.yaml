  trans: '


    # React JS


    1. 单页应用。

    2. 整个页面保持不变，只有少数组件发生变化。

    3. 代码易于扩展和维护。

    4. 由于 HTML 是通过 JS 创建的，具有更多功能。

    5. 同构渲染（服务端渲染）。

    6. 极快的速度。


    如果非要回答什么是 react js，那么 React 是一个 JavaScript 库，你可以将其附加到任何现有技术栈中，并让 UI 变得动态，以获得优越感和信念的极致乐趣。我相信你必须掌握学习
    React 的方法，React 是由 `Facebook` 在 2011 年专门为 Facebook 开发的，他们并在 2013 年将代码公开。但同时考虑到，在
    React JS 之前，我们有一个 `DOM` 的原始概念，但引入了 React 之后，我们有了 `virtual DOM`（虚拟 DOM），`这必须被非常仔细地考虑`。根据深思的练习，这是一个有趣的概念，我们将在下文中详细讨论，但作为开始，`DOM`
    是文档对象模型，当浏览器加载网页时，它会将所有元素转换为一个以 `document` 为根的对象，以便在本文结束时让本质达到启示。


    为了进一步深入并向你介绍更多信息，当你在网页上添加或修改数据时，除了简单的点击 `load more`（加载更多）节点被附加到树上之外，如果你更改了某些数据，你需要通过引入观察行代码来重新刷新它。但这都是早期
    Facebook 上的信息和委托，他们以前经常使用 `+1` 更新通知，这样当你点击它时，网页会重新加载，数据也是如此，这是先前的因素之一。为了进一步深入并向你介绍更多信息，通过
    `virtual DOM`，你可以实时修改节点，因为现在所有元素都被处理为可附加的独立组件，其节点值会随着脚本而改变，以便在本文结束时让本质达到启示。由于为了实操一直下去获取更多信息，这些术语太多了，让我们一个一个地讨论它们。


    ![`qphs.fs.quoracdn.net/main-qimg-0ad1d17f18f25d10000c84bc82e7bd9f`](img/image_rsrc1AG.jpg)


    ## 虚拟 DOM 概念


    现在你知道什么是 react js 了，让我们转向为什么要用 react js？如上所述，`Document Object Model`（文档对象模型）是浏览器中网页基于树的对象的表示，以引起你对完整丰富信息的注意。记住仔细关注这一点，通过
    javascript 的帮助，你可以更改元素及其值，而科学地攻克未知事物是一项巨大的任务。进一步进入特征描述，当你编写 `window.alert()` 或
    `document.getElementById()` 时，你正在使用 javascript 来更改 HTML 标签，而这些标签现在是对象，因此 `window`
    和 `document` 在这里都是 `objects`（对象）。


    ![`qphs.fs.quoracdn.net/main-qimg-171a67eed3345da113fe2c057a361edc`](img/image_rsrc1AH.jpg)
    ![`qphs.fs.quoracdn.net/main-qimg-c9fbf33a9681209ab79db7d105fb96c`](img/image_rsrc1AJ.jpg)


    现在，问题在这里，我强烈希望你有它们的生产实践。由于为了实操一直下去获取更多信息，想象有一个包含十项的列表，你只更改了其中一个的值，而科学地攻克未知事物是一项巨大的任务。由于为了实操一直下去获取更多信息，浏览器将重新加载整个包含
    10 项的列表，我强烈希望你有它们的生产实践。并且为了你的学习之目的，成功包括它会变得有多慢！！！


    那么，解决方案是什么？我们只需要更新变化的地方！这里引入了 `virtual DOM` 的概念，`这必须被非常仔细地考虑`。然而，我强烈建议将 `Virtual
    DOM` 考虑为 `DOM 的复印件`，`这必须被非常仔细地考虑`。根据深思的练习，它不是 `DOM`，它仍然是虚拟的，也就是说，无论你在 `virtual
    DOM` 中改变了什么，真实的网页都不会受到影响。


    现在，`Virtual DOM` 的操作比 `DOM` 快得多，因为这里不涉及浏览器，因为它只是一个副本！你用 `JS` 做的任何更改都会反映在 `Virtual
    DOM` 中，`这必须被非常仔细地考虑`。为了进一步深入并向你介绍更多信息，浏览器将比较 `DOM` 和 `virtual DOM`，并仅更新更改，就像 `VCS`（版本控制系统）处理冲突一样，使其工作方式更加高效。


    ## 组件化 UI


    React 和 Angular 都拥抱了基于组件的 UI 结构！现在，这已成为 Web 开发中不可避免的一部分，以便在本文结束时让本质达到启示。然而，我认为基于组件的
    UI 将整个 Web 应用分为可重用的独立单元，这些单元独立地与服务器交互，允许 `DOM` 动态变化，并实现生产概念的人格化。但同时考虑到，`组件化 UI`
    和 `Ecmascript 2015` 都让 Web 开发变得更像一种编码体验，因为现在我们有了类、具有可注入组件的顶层封装，我强烈希望你有它们的生产实践。进一步进入特征描述，每当我们回答什么是
    react js 时，组件化开发就一直如影随形！


    ![`qphs.fs.quoracdn.net/main-qimg-ff8f05a5821d835f1c8193e327db`](img/image_rsrc1AK.jpg)
    例如，每个网站都有共享的 UI，头部是相同的，页脚也是相同的，只有内容动态变化，并实现生产概念的人格化。头部单个组件，页脚一个组件，内容的共享 CSS，但每个路由都有对服务器和数据库的独立调用。


    ## Babel 和 JavaScript


    我们将在下文中讨论 `JSX`，但一旦 `JSX=JS+XML`，你使用 React 以 `JSX` 渲染页面，浏览器并不理解它！等等，浏览器不理解它！它只理解
    Vanilla JavaScript（原生 JS），以便在本文结束时让本质达到启示。然而，考虑到增量并进一步，仅仅在 Angular 中 Typescript
    被转换为 `JS`，而在 React 中，它是通过 `Babel` 完成的，这是本文的特征部分。但同时考虑到，`babel` 是一个负责 `JSX` 转换工作的编译器，`这必须被非常仔细地考虑`。由于为了实操一直下去获取更多信息，尽管
    React 只是一个可以附加到任何现有应用程序的库，用 `JSX` 编写代码非常方便且简洁，我们将讨论讨论。


    ## React 和 JSX


    如果不讨论 `JSX`，我们就无法完成这篇“什么是 react js 博客”。如果你用过 Angular 以及相应的 Typescript，那么你基本上在使用
    Typescript（它是组件中 javascript 的超集）以及用于双向数据绑定的 Angular 预定义标签和额外功能。但同时也考虑到，这一点，但在这里，你可以以
    `JSX` 的形式将标记语言和脚本在一起。


    ![`qphs.fs.quoracdn.net/main-qimg-cedc2042ca17ce4bc69172bb4c30f6cc`](img/image_rsrc1AM.jpg)
    让我们来看一个基础示例，科学地攻克未知事物是一项巨大的任务。我承认在目标位置你定义了一个变量 `name`。记住仔细关注这一点，并在大括号中使用它的值作为单向数据绑定，这再次将在下文中详细讨论。


    并在你的 `render()` 方法中使用它，你就能观察到结果。


