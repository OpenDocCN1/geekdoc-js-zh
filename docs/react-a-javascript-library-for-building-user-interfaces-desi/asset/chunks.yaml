    </html>\n```\n\nThere we go, we’re on our way!\n\n## Expressions In JSX\n\nYou\
    \ can have more than one tag as part of a JSX expression by taking into lines\
    \ of observation. Further getting into characterization so far, we’ve only seen\
    \ a `h1` tag, but what if we want to have both a `h1` and a `button` in the same\
    \ JSX expression by taking into lines of observation. Depending upon the thoughtful\
    \ exercises in order for this to work properly, we need an outer wrapping `div`\
    \ and this is the one which will be taken as priority and perfection. However\
    \ for the thought of increment and going further jSX Expressions must have one\
    \ parent element to make the true nature meet the enlightenment by the end of\
    \ this. Depending upon the thoughtful exercises in addition, it is best practice\
    \ to wrap the entire JSX expression in parenthesis `( )`.\n\n`item.jsx`\n\n```javascript\n\
    import React, { Component } from \"react\";\nclass Item extends Component {\n\
    \  render() {\n    return (<div><h1>Cartable!</h1><button>Increment</button></div>);\n\
    \  }\n}\nexport default Item;\n```\n\n## React.Fragment\n\nYou might not want\
    \ to pollute your html markup with excessive `div` elements I strongly wish you\
    \ will have their production. Depending upon the thoughtful exercises in the example\
    \ above, we needed to wrap both the `h1` and `button` tags with one single parent\
    \ element to make the true nature meet the enlightenment by the end of this. Since\
    \ for the hands on going all the way for the further information this is a rule\
    \ of JSX THIS WILL GIVE YOU THE BEST CHALLENGE TO THE WISDOM OF YOUR FACULTIES.\
    \ Since for the hands on going all the way for the further information the downside\
    \ however, is that you will notice if we inspect the markup on the page that there\
