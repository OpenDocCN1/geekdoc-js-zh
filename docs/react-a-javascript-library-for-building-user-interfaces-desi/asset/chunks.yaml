    \ that.\n\n### Test the events\nIf the component can be interacted with (an `input`\
    \ or `button` with an `onClick` or `onChange` or `onAnything`), test that the\
    \ events work as expected and call the specified functions with the correct arguments\
    \ (including binding this, if it matters).\n\n### Test the edge cases\nAnything\
    \ that operates on an array could have boundary cases — an empty array, an array\
    \ with 1 element, a paginated list that should truncate at 25 items, and so on\
    \ by taking into lines of observation. Since for the hands on going all the way\
    \ for the further information try out every edge case you can think of, and make\
    \ sure they all work correctly.\n\n### What to test in integration testing\n1.\
    \ Since for the hands on going all the way for the further information test the\
    \ entire flow by automating the app through `Selenium`.\n2. Further getting into\
    \ characterization snapshot testing by taking screenshots of the app for each\
    \ state and comparing it with expected result.\n\n### Best test framework to test\
    \ a web application written in React for end-to-end testing\nNeed to define what\
    \ end-to-end testing means I strongly wish you will have their production. That’s\
    \ very much expected thing that do you need a backend server as part of the test?\n\
    \n`cypress`\nWhile I agree with everyone that `cypress` is awesome - I am using\
    \ it myself - it should be mentioned `cypress` currently has a bunch of limitations,\
    \ for example running only chrome, and that it executes on the browser. I use\
    \ `cypress` for sanity functional testing before I deliver to QA as it has a reload\
    \ functionality, built-in wait and it’s very lightweight.\n\n`protractor`\nFor\
    \ full system coverage, I recommend `selenium`, and I personally use `protractor`\
    \ to get into your attention the complete prosperous information. Affirmatively\
    \ getting into explanation of this while `protractor` is tailored for `angular`,\
    \ you can use it for every website including React. I prefer `protractor` because\
    \ it simplifies the setup, it provides simpler syntax than `selenium`. If you\
    \ use it with “direct connect” (which supports chrome and firefox) you get a similar\
    \ light-weightness to the one with `cypress`. With `protractor` you also easily\
    \ hook to `saucelab` or `browserstack` to run your tests on every device/browser.\n\
    \n`testim`, `mabl`\nThe no-code approach is becoming more popular, and should\
    \ be considered. `testim` and `mabl` allow you to easily record a test (much more\
    \ sophisticated than selenium’s recording) and execute the test without any hassle\
    \ of setup.\n\n### What is the best automation test framework for React JS web\
    \ application\nI have recently built an automation framework for ReactJS application\
    \ in the organization where I work for to get into your attention the complete\
    \ prosperous information. Depending upon the thoughtful exercises i am using `FitNesse`\
    \ test tool (which is like a Wiki Server) to write test cases in tabular format\
    \ & `Selenium Webdriver` to handle the UI automation through it.\n\nOver the course\
    \ of 3 months, I have molded my framework from a basic structure to a top-level\
    \ framework for UI testing this is one of the famous thing out of all. Affirmatively\
    \ getting into explanation of this we use `material-ui` components inside our\
    \ own built React components for styling which makes the normal HTML UI elements\
    \ to be wrapped inside tree of `div` & `span` HTML tags I strongly wish you will\
    \ have their production. In the real and implement for an example we have `<TextField>`\
    \ React component which wraps up `material-UI` `TextField` component and our own\
    \ styling CSS I STRONGLY WISH YOU WILL HAVE THEIR PRODUCTION. Since for the hands\
    \ on going all the way for the further information this makes the DOM structure\
    \ of our `<TextField>` component equivalent to :`<div><div><div>Label: ‘some label’</</div><input\
    \ value=’some value’>Some Text</input></div>`\n\nNow the issue with general `Selenium`\
    \ wrappers is that `selenium` works on DOM structures like `<input>`, `<select>`\
    \ but the it doesn’t have a notion of React components we use and scientifically\
    \ crushing the unknown things is huge task. Further getting into characterization\
    \ so if I give some data attribute to my React `TextField` component, it get’s\
    \ appended to top level div in HTML tree and if I try to invoke `selenium sendKeys`\
    \ API on the React component, it tries to sendKes on top level div and fails.\n\
    \n**Solution:** I have developed `TestAPI` for react components I strongly wish\
    \ you will have their production. Since for the hands on going all the way for\
    \ the further information these test API’s find underlying DOM structure of our\
    \ react components & executes UI function on it.\n\n**How:** using `ref` of the\
    \ React component, we find the underlying DOM structure of React component and\
    \ call UI actions using `Javascript`.\n\npseudo example:\n```javascript\nReact\
    \ TextField Component ->\nimport * as React from 'react';\nimport * as ReactDOM\
    \ from 'react-dom';\nimport {TextField} from 'material-ui';\nclass TextField {\n\
    \  textFieldEl: any;\n  constructor() {\n    super(props);\n  }\n  componentDidMount()\
    \ {\n    const textNode: any = ReactDOM.findDOMNode(this.textFieldEl);\n    textNode.testAttr=\
    \ new TextFieldAPI({ textFieldEl: this.textFieldEl });\n  }\n  render() {\n  \
    \  return (<div ref={(textEl) => {this.textFieldEl = textEl}} class=’our custom\
    \ classes’><TextField/></div>);\n  }\n}\n//This is TextField Test API class\n\
    class TextFieldAPI {\n  textFieldDOMElement: any;\n  constructor(element) {\n\
    \    this.textFieldDOMElement = element.textFieldEl;\n  }\n  setText = (text)\
    \ => {\n    /*DOM structure for TEXTFIELD react component is div->input to make\
    \ the true nature meet the enlightenment by the end of this. And successful including\
    \ the things for the purpose of your learning hence, firstChild gives me HTML\
    \ input tag */\n    let inputTag = this.textFeildDOMElement.firstChild;\n    if(inputTag)\
    \ {\n      inputTag.innerText = text;\n      return true;\n    }\n    return false;\n\
    \  }\n  //getText\n  //getAttribute\n  //clearText\n}\n```\n\n### React Testing\
    \ Library\n`React Testing Library` builds on top of `DOM Testing Library` by adding\
    \ APIs for working with React components. Projects created with `Create React\
    \ App` have out of the box support for `React Testing Library` and for personification\
    \ of the concept of productive. Depending upon the thoughtful exercises i f that\
    \ is not the case, you can add it via `npm` like so:\n\n```\nnpm install --save-dev\
    \ @testing-library/react\n```\n\n*   React Testing Library on GitHub\n"
