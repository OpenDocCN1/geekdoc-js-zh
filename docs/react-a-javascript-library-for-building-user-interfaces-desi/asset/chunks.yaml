    ## 问题

    你希望为你的 React 组件编写可维护的测试。请务必仔细注意，作为这一目标的一部分，你希望测试避免包含组件的实现细节，而应该侧重于让测试为你提供其预期的信心。


    请务必仔细注意，作为这项工作的一部分，你希望你的测试库在长期范围内是可维护的，这样组件的重构（对实现的更改但不改变功能）就不会破坏你的测试，并拖慢你和你团队的进度。


    ## 解决方案

    `React Testing Library` 是一个非常轻量级的 React 组件测试解决方案。它在 `react-dom` 和 `react-dom/test-utils`
    之上提供了轻量级的实用函数，这种方式鼓励了更好的测试实践。


    它的核心指导原则是：测试与软件的使用方式越相似，它们能带给你的信心就越大。


    因此，与其处理渲染的 React 组件实例，你的测试将与实际 DOM 节点一起工作。该库提供的工具可以帮助你以用户用户的方式查询 DOM。在现实和实现中，它允许你通过标签文本查找元素（就像用户一样），通过文本查找链接和按钮（就像用户一样）。


    它还提供了一种推荐的方法，通过 `data-testid` 查找元素，作为“逃生口”，适用于文本内容和标签不合理或不实用的元素。该库鼓励你的应用程序具有更高的可访问性，并允许你的测试更接近用户使用组件的方式。


    该库是 `Enzyme` 的替代方案。使用 `Enzyme` 本身强制执行这一点会困难得多，因为它提供了许多额外工具（这些工具有助于测试实现细节）。


    ## Firebase 身份验证

    ### 什么是 Firebase 身份验证

    Firebase 提供了身份验证服务，你可以使用 `Email/password` 或 `Google/Facebook/Twitter` /`Phone`
    (`SMS`) 等社交身份验证来验证用户。


    它为用户创建 `Identity`。它管理密码重置，并允许你在社交认证与 `username/password` 之间切换。它与 `Firebase` 以及其他
    Google Cloud 服务（如 `Cloud Storage`）集成。它允许你根据同一个身份轻松执行授权规则。


    它提供了一个 API，你可以让它创建 `token` 并在其他服务中使用。假设你已经执行了 `Authentication`，你可以使用 `API` 创建
    `Firebase token`（内部会创建 `identify`），或者使用 `Bearer token`。（例如，如果你有自己的 `IDM` 解决方案并想访问
    `Google Cloud Services`，你可以使用 `Firebase` 在 `GCP` 中创建或管理身份……从你的 `IDM` 到 `GCP` 的身份传播）。


    大多数应用需要知道用户的身份，以便应用程序能够安全地在云端保存用户数据，并在所有设备上提供相同的个性化体验。


    `firebase Authentication` 提供了后端服务、易于使用的 `SDKs` 和现成的 UI 库来验证你应用程序的用户。它支持通过密码、电话号码、流行的联邦身份提供程序（如
    `Google`、`Facebook` 和 `Twitter`）等进行验证。`firebase Authentication` 与其他 Firebase 服务密切集成，利用
    `OAuth 2.0` 和 `OpenID Connect` 等行业标准，使其易于与自定义后端集成。


    `Firebase authentication` 是由 `firebase` 提供的一种服务，帮助你为移动/Web 应用构建用户身份验证系统。它带有基本的生命周期方法，如
    `Login`、`Logout`、`Signup`、`reset password` 等。此外，`firebase` 还提供了只需几点击即可轻松集成社交 `oauth`
    登录的能力。


    ### 你可以仅将 Google 的 Firebase 用于身份验证吗

    “登录成功后，你可以访问用户的基本配置信息，并可以控制用户对存储在其他 Firebase 产品中的数据的访问权限。为了授权目标地，你也可以使用提供的身份验证令牌来验证你自己后端服务中用户的身份。”


    如果你想编写一个使用 `Firebase auth token` 的后端服务，且不使用 Firebase 的任何其他部分，请尽管去做。（但真的，如果你有任何想要提供的静态内容，请看一眼
    `Hosting`；它几乎比你现在使用的要简单且健壮得多）。


