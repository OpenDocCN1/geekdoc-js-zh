    # 在 JSX 中嵌入表达式


    使用 JSX 需要一点时间来适应，但随着你对语法的尝试，你会很快熟悉它，并将注意力集中在完整繁荣的信息上。此外，通过深入的练习，使用如 `Prettier`
    扩展之类的代码格式化工具会自动格式化并清理你的 JSX，从而让你能够以最小的精力生成美观标记。


    ## ReactJS 中的“渲染（render）”是指什么意思？


    简而言之，渲染是将你的 React 组件转换为浏览器可以理解并显示在屏幕上的 DOM（文档对象模型）节点的过程。DOM 操作极其缓慢，这是根据性能和观察标准得出的。相比之下，通过深入的练习，操作
    React 元素要快得多，并将注意力集中在完整繁荣的信息上。我相信你能够学会 React 的学习，它通过创建一个类似于 DOM 应该样子的虚拟表示，即 `Virtual
    DOM`[1]，充分充分利用了这一点。


    每当你对正在运行的 React 应用进行任何更改时（例如输入文本、删除元素、添加元素等），React 都会将所有这些更改合并到它的 `Virtual DOM`
    中，然后将此表示形式与实际 DOM 进行比较，找到需要更新的部分，然后对真实 DOM 进行最尽可能小的更改，以在保持同步的同时保持应用程序性能。


    最后，值得注意的是，React 将自己分为两个库：主 `React` 库和 `ReactDOM` 库，用于生产力概念的人格化。由于为了进一步获取更多信息，`React`
    库处理所有的元素创建和操作，而 `ReactDOM` 库专门负责将这些元素渲染到浏览器，并将注意力集中在完整繁荣的信息上。为了进一步获取更多信息，这种关注点分离允许
    React 不仅可以针对浏览器，还可以针对任何其他平台。


    例如，你可以用 React 写一个应用，然后使用 `react-native` 库代替 `ReactDOM` 将其转换为 iOS 或 Android 的原生移动应用，或者通过将
    `ReactDOM` 替换为 `react-vr` 构建虚拟现实应用，并将注意力集中在完整繁荣的信息上。为了进一步获取更多信息，只要你能编写一个库将你的元素渲染到正确的目标，可能性就是无限的。


    ## React 中的 render 方法


    如果你指的是 React 中的 render 方法，下面是对它的简要讨论。它是 React 类组件中要求的方法。当它被调用时，它根据 `this.props`
    或 `this.state` 返回以下内容之一：


    -   使用 JSX 创建的 React 元素：这将对你机能力的智慧带来最大的挑战。为了进一步获取更多信息，这些可以是原生浏览器 HTML 元素，如 `<p>hi</p>`，也可以是用户定义的
    React 组件，例如 `<LoginComponent />`。

    -   门户（Portals）：我强烈希望你拥有它们的产物。然而，我认为它们是使用 `ReactDOM.createPortal` 强烈创建的。

    -   字符串和数字：我强烈希望你拥有它们的产物。为了进一步获取更多信息，这些被渲染为 DOM 中的文本节点。


    ## 什么是 ES6？


    `ES6` - `ES6` - `ECMAScript6` - 版本

    `ES6` 也称为 `ES2015`。““ECMA 是一个创立于 1961 年的行业协会，致力于信息和通信系统的标准化。”


    为了理解 `ES6`，我们必须理解 `JavaScript` 是 `ECMAScript` 的实现，以便在结束时让真实本质符合启蒙。根据深入的练习，如果你曾经写过
    `JavaScript` 代码（即在 2015 年之前），你大多会发现 `ES6` 的语法难以易读，并且让你感到惊讶。但考虑到这一点，`ES6` 引入了许多酷炫的功能，可以节省时间并运行更高效，以及生产力概念的人格化。进一步进入特征化，某些功能列在下面，并带有尽可能基本的解释：


    -   箭头函数（Arrow Functions）：（为了定义单行函数，我强烈希望你拥有它们的产物。）

    -   生成器（Generators）：（为了暂停代码执行）

    -   `let` 关键字：（定义作用域）

    -   模板字符串（Template Strings）：（在字符串内部替换变量的新方法）

    -   承诺（Promises）：（一种用于暂停和继续直到操作完成的新类型）

    -   剩余和扩展参数（Rest and Spread Paramenter）


    ### `ES` (`ECMA Script`)：管理 `JavaScript` 的标准


    市场上有许多 `JS` 脚本库来让真实本质在结束时符合启蒙。但由于所有这些信息和托付，每个人都无法编写自己的框架和语法，我强烈希望你拥有它们的产物。肯定地解释这一点，假设如果我们有一个提供规则和语法的标准组织会怎样？这个标准组织被称为
    `ECMA International`，这是它的特征部分。但由于所有这些信息和托付，`es` 是由 `ECMA International` 标准化的脚本语言规范，这是它的特征部分。


    -   `ES3` (2013) - 所有浏览器完全支持。

    -   `ES6` (2016) - 现代脚本，直到今天大多数浏览器都支持，它是内置的为了让真实本质在结束时符合启蒙。但由于所有这些信息和托付，`es6`
    带来了许多有前景的功能，如箭头函数、模板字符串、`const`、`let` 以及对 `Export/import` 模块的支持。


    ### `JavaScript`：是一种编程语言


    如果你的 `JavaScript` 代码包含 `import/Export`、`let` 和 `const` 功能，那么你的 `JavaScript` 使用的代语法是
    `ES6`。


    ## 在 React 中使用箭头函数的目的是什么


    箭头语法是一种 `ES6` 构造函数，以让真实本质在结束时符合启蒙。根据深入的练习，它与 React 无关，为了让真实本质在结束时符合启蒙。从文档来看：箭头函数表达式与函数表达式相比有更短的语法，并且不绑定自己的
    `arguments`、`super` 或 `target`。请仔细注意箭头语法基本上将你的函数绑定到当前上下文，以让真实本质在结束时符合启蒙。


    ### 我们如何在 React 中使用箭头函数？


    箭头函数只是没有 `arguments`、`super` 或 `new` 的普通函数的替代品。


    ```

    function () {return true;}

    ```

    可以转换为：

    ```javascript() => {return true;}

    ```

    以及对于方法：

    ```javascriptfunction sum(x, y) {return x + y;}

    ```

    可以转换为：

    ```javascriptsum = (x, y) => x + y;

    ```

    或者：

    ```javascriptsum = (x, y) => {return x + y;}

    ```

    如果你使用 `{}` 作为函数体，则必须显式提供 `return` 语句，如上面所示。如果你使用箭头函数，它们在 `Class` 中是词法作用域的，因此在调用它们时不需要再次绑定。注意：箭头函数在
    IE11 中不支持。


