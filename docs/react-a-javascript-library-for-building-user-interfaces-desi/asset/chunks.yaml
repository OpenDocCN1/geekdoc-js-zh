- fmt: "\n# What's the purpose of using React.js?\n\nI work in ReactJS, so I can explain\
    \ this very well. ReactJS is an open-source JavaScript library designed by Facebook\
    \ for creating rich and engaging web apps fast and efficiently with minimal coding.\n\
    \n## History\nWhile other technologies such as `Angular` were available when Facebook\
    \ developed `ReactJS`, most developers were forced to do a lot of coding; this\
    \ is one of the famous thing out of all. They wanted to be a framework that could\
    \ allow them to break down complex components and reuse the codes to complete\
    \ their projects faster.\n\n## Solution\nReactJS provided the solution that developers\
    \ were looking for. It uses `JSX` (a unique syntax that allows HTML quotes as\
    \ well as HTML tag syntax application for rendering specific subcomponents). This\
    \ is very helpful in promoting the construction of machine-readable codes and\
    \ at the same time compounding components into a single-time verifiable file.\n\
    \n## Why many people prefer to use ReactJS?\n- It brings HTML directly into your\
    \ `JS`.\n- The idea of components is what makes `ReactJS` unique.\n- `Props` in\
    \ `ReactJS` make it possible to pass the custom data to a specific UI component.\n\
    - The `State` makes it possible to store all the changes in one section.\n- It\
    \ uses `Virtual DOM` that makes the app fast.\n- A `ReactJS` developer will help\
    \ you to craft achievable goals and demonstrate how the business can use the technology\
    \ to accelerate growth, raising conversions, cutting on costs, and raising conversion\
    \ rates.\n\n## One-way Data Binding in React\nYou must have heard of two-way data\
    \ binding in `Angular`. But since `React` is a library there is no separate HTML\
    \ and Script concept as we have `JSX`. In two-way data binding, any change in\
    \ the input element is reflected in the component as both are bounded. When we\
    \ talk about one way data binding, the input element cannot reflect changes in\
    \ the `JSX` code, unless and until you use a change event. \n\nRemember that `Angular`\
    \ automatically uses watchers and timeouts to do this, but `React` has restricted\
    \ it to only one flow of data. However, at least it lets dynamically change the\
    \ render component, which wasn’t the case when `AJAX` was used as you had to refresh\
    \ the page; now changes are reflected on the independent components via one way\
    \ data binding.\n\n## Setting Up Your Environment\n\n### Installing visual studio\
    \ code\n1. Download the `Visual Studio Code` installer for Windows.\n2. Once it\
    \ is downloaded, run the installer (`VSCodeUserSetup-{version}.exe`).\n3. By default,\
    \ `VS Code` is installed under `C:\\users\\{username}\\AppData\\Local\\Programs\\\
    Microsoft VS Code`.\n\nAlternatively, you can also download a `Zip` archive, extract\
    \ it and run `Code` from there.\n\n**Note:** `.NET Framework 4.5.2` or higher\
    \ is required for `VS Code`. If you are using Windows 7, make sure you have at\
    \ least `.NET Framework 4.5.2` installed. You can check your version of `.NET\
    \ Framework` using this command from a command prompt:\n\n```\nreg query \"HKEY_LOCAL_MACHINE\\\
    SOFTWARE\\Microsoft\\NET Framework Setup\\NDP\\v4\\full\" /v version\n```\n\n\
    **Tip:** Setup will add `Visual Studio Code` to your `%PATH%`, so from the console\
    \ you can type `code .` to open `VS Code` on that folder. You will need to restart\
    \ your console after the installation for the change to the `%PATH%` environmental\
    \ variable to take effect.\n\n### User versus system setup\n`VS Code` provides\
    \ both Windows user and system level setups. \n- **User setup**: Does not require\
    \ Administrator privileges as the location will be under your user Local AppData\
    \ (`LOCALAPPDATA`) folder. This provides a smoother background update experience.\n\
    - **System setup**: Requires elevation to Administrator privileges and will place\
    \ the installation under `Program Files`.\n\n### 32-bit versions\nIf you need\
    \ to run a 32-bit version of `VS Code`, both a 32-bit `Installer` and `Zip` archive\
    \ are available.\n\n### Updates\n`VS Code` ships monthly releases and supports\
    \ auto-update when a new release is available. If you're prompted by `VS Code`,\
    \ accept the newest update and it will be installed.\n**Note:** You can disable\
    \ auto-update if you prefer to update `VS Code` on your own schedule.\n\n## Windows\
    \ as a developer machine\nWindows is a popular operating system and it can be\
    \ a great cross-platform development environment. This section describes cross-platform\
    \ features such as the `Windows Subsystem for Linux` (`WSL`) and the new `Windows\
    \ Terminal`.\n\n### Recent Windows build\nMake sure you are on a recent Windows\
    \ 10 build. Check `Settings` > `Windows Update` to see if you are up-to-date.\n\
    \n### Windows Subsystem for Linux\nWith `WSL`, you can install and run Linux distributions\
    \ on Windows. This enables you to develop and test your source code on `Linux`\
    \ while still working locally on your Windows machine. When coupled with the `Remote\
    \ - WSL` extension, you get full `VS Code` editing and debugging support while\
    \ running in the context of `WSL`.\n\n### New Windows Terminal\nAvailable from\
    \ the Microsoft Store, the `Windows Terminal (Preview)` lets you easily open `PowerShell`,\
    \ `Command Prompt`, and `WSL` terminals in a multiple tab shell.\n\n## Next steps\n\
    Once you have installed `VS Code`, these topics will help you learn more about\
    \ VS Code:\n- **Additional Components**: Learn how to install `Git`, `Node.js`,\
    \ `TypeScript`, and tools like `Yeoman`.\n- **User Interface**: A quick orientation\
    \ to `VS Code`.\n- **User/Workspace Settings**: Learn how to configure `VS Code`\
    \ to your preferences through settings.\n- **Tips and Tricks**: Lets you jump\
    \ right in and learn how to be productive with `VS Code`.\n"
