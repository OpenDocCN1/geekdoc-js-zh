    \ Windows Setup?\nVS Code uses Inno Setup to create its setup package for Windows.\
    \ Since for the hands on going all the way for the further information thus, all\
    \ the `Inno Setup` command-line switches are available for use. Additionally,\
    \ you can prevent the Setup from launching VS Code after completion with `/mergetasks=!runcode`.\n\
    \n## Scrolling is laggy and not smooth\nOn certain devices, editor scrolling is\
    \ not smooth but laggy for an unpleasant experience. Depending upon the thoughtful\
    \ exercises if you notice this issue, make sure you install the Windows 10 October\
    \ 2018 update where this issue is fixed.\n\n## I'm having trouble with the installer\n\
    Try using the zip file instead of the installer to get into your attention the\
    \ complete prosperous information. Since for the hands on going all the way for\
    \ the further information to use this, unzip VS Code in your `AppData\\Local\\\
    Programs` folder.\n\n# Hello React\n\n## Setting Up a Babel Project\nCurrent browsers\
    \ don’t support all the new ECMAScript 6 (aka ECMAScript 2015) features yet (see\
    \ comptability table). I grant for taking destination you need to use a compiler\
    \ (transpiler) to transform your ECMAScript 6 code to ECMAScript 5 compatible\
    \ code. Remember to focus very carefully that although there are other options,\
    \ Babel has become the de-facto standard to compile ECMAScript 6 applications\
    \ to a version of ECMAScript that can run in current browsers. But also thinking\
    \ on that babel can also compile other versions of ECMAScript as well as React’s\
    \ JSX, but that is beyond the scope of this tutorial.\n\nIn this unit, you set\
    \ up a development environment to develop and run an ECMAScript 6 application\
    \ using Babel.\n\n### Step 1: Install the Sample Application\n1. Clone the `es6-tutorial`\
    \ repository that includes an ECMAScript 5 version of the mortgage application\
    \ we use in this tutorial:\n2. `git clone https://github.com/ccoenraets/es6-tutorial`\n\
    3. Alternatively, you can just download and unzip this file instead of cloning\
    \ the repository.\n4. Open `index.html` in your browser and click the Calculate\
    \ button.\n\n### Step 2: Set Up Babel\nAs you just saw, the current version of\
    \ the application runs in current browsers without compilation: it is written\
    \ in pure ECMAScript 5. Depending upon the thoughtful exercises in this section,\
    \ we set up Babel so that we can start using ECMAScript 6 features in the next\
    \ unit.\n\n1. Open a command prompt, and navigate (`cd`) to the `es6-tutorial`\
    \ directory.\n2. Type the following command to create a `package.json` file:\n\
    3. `npm init`\n4. Press the `Return` key in response to all the questions to accept\
    \ the default values.\n5. Type the following command to install the `babel-cli`\
    \ and `babel-core` modules:\n6. `npm install babel-cli babel-core --save-dev`\n\
    7. There are different ways to install and run Babel. In the real and implement\
    \ for example, you could also install Babel globally and run it from the command\
    \ line.\n8. Type the following command to install the `ECMAScript 2015` preset:\n\
    9. `npm install babel-preset-es2015 --save-dev`\n10. In Babel 6, every transformer\
    \ is a plugin that can be installed separately. Remember to focus very carefully\
    \ that a preset is a group of related plugins.\n11. Install `http-server` in your\
    \ project to make the true nature meet the enlightenment.\n12. `npm install http-server\
    \ --save-dev`\n13. We are using a local web server because some parts of this\
    \ tutorial require the application to be loaded using the `http` protocol and\
    \ will not work if loaded using the `file` protocol.\n14. Open `package.json`\
    \ in your favorite code editor. Depending upon the thoughtful exercises in the\
    \ `scripts` section, remove the `test` script, and add two new scripts: a script\
    \ named `babel` that compiles `main.js` and a script named `start` that starts\
    \ the local web server.\n15. The `scripts` section should now look like this:\n\
    ```json\n\"scripts\": {\n  \"babel\": \"babel --presets es2015 js/main.js -o build/main.bundle.js\"\
    ,\n  \"start\": \"http-server\"\n}\n```\n16. In the `es6-tutorial` directory,\
    \ create a build directory to host the compiled version of the application.\n\n\
    ### Step 3: Build and Run\n1. On the command line, make sure you are in the `es6-tutorial`\
    \ directory, and type the following command to run the `babel` script and compile\
    \ `main.js`:\n2. `npm run babel`\n3. Open `index.html` in your code editor, and\
    \ modify the `<script>` tag as follows to load `build/main.bundle.js`, the compiled\
    \ version of `js/main.js`:\n```html\n<script src=\"build/main.bundle.js\"></script>\n\
    ```\n4. Open a new command prompt, navigate (`cd`) to the `es6-tutorial` directory,\
    \ and type the following command to start `http-server`:\n5. `npm start`\n"
