    \ program that can run inside a Web page displayed by a Java-capable browser such\
    \ as Hot Java, Lynx, Netscape or Internet Explorer. Hot Java Browser is a World\
    \ Wide Web browser used to view web pages, follow links and submit forms. It can\
    \ also downloaded and play applets on our system.\n\nSimply we call applet program\
    \ is an internet program view on web pages. This is another type of java program.\
    \ If there is no browser in our system means we can use tools appletviewer.exe\
    \ to execute applet program. This applet window is just embedded in the browser.\
    \ We can see the status bar of browser applet started is displayed from that we\
    \ can identify that web page contains applet program. If we want execute the applet\
    \ in browser means we need to develop html file and call the applet class file\
    \ in html file and locate the html file in browser. For developing applet program\
    \ we have import java.applet.* package. The minimum requirements of html tags\
