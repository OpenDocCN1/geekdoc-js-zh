    ## Chapter 13 Networking\n\n### Introduction\nA network is a set of computers\
    \ and peripherals which are physically connected together. Networking enables\
    \ sharing of resources and communication. Internet is a network of networks. Networking\
    \ in java is possible through the use of java.net package.\n\n### Client/Server\n\
    A computer which requests some service from another computer is known as client.\
    \ The one that processes the request is called as server.\n\n### IP Address\n\
    Every computer connected to a network has a unique IP address. IP address is a\
    \ 32-bit number which has four numbers separated by periods.\nExample of IP address\
    \ is 80.0.0.53\n\n### Port Number\nPort number is assigned to all protocols, 21\
    \ are assigned for FTP, 23 are assigned for Telnet, etc.\n\n### Types of Networking\
    \ Programs\nThere are two types of networking program they are:\n- Connection\
    \ oriented protocols is TCP/IP (Transmission control protocols)\n- Connectionless\
    \ protocols are UDP (User datagram protocols).\n\nThe supporting package is java.net.*;\n\
    \n61\n\n### Classes of java.net Package\nDatagram, DatagramPacket, DatagramSocket\
    \ are classes of java.net package for connectionless protocols. Socket, ServerSocket\
    \ is classes of java.net package for connection oriented protocols.\n\n### Implementation\
    \ of Networking Programs\n1. Compile the both client and server program.\n2. Run\
    \ the server program in one machine.\n3. Run the client in another machine.\n\
    4. If you want do the same in same machines you have open two DOS-prompt, one\
    \ for client and another one server.\n\n### Examples for both type are as follows\n\
    ```java\nimport java.net.*;\n\nclass inetaddresstest {\n    public static void\
    \ main(String[] args[]) throws Exception {\n        try {\n            InetAddress\
    \ add = InetAddress.getLocalHost();\n            System.out.println(\"the address\
    \ of the local host is .... \"+ add);\n        } catch (Exception u) {\n     \
    \       System.out.println(u);\n        }\n    }\n}\n```\n\n```java\nimport java.net.*;\n\
    import java.io.*;\n\nclass datagramserver {\n    static Datagramsocket ds;\n \
    \   static int cport=9, sport=8;\n\n    public static void main(String[] args[])\
    \ throws Exception {\n        byte[] ff = new byte[1024];\n        ds = new Datagramsocket(sport);\n\
    \        BufferedReader dis = new BufferedReader(new InputStreamReader(System.in));\n\
    \        System.out.println(\"server is waiting for input\");\n    }\n}\n```\n"
