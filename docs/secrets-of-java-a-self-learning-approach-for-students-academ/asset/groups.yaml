    Chapter **11**


    ***Applet***


    INTRODUCTION


    An applet is a dynamic and interactive program that can run inside a Web page
    displayed by


    a Java-capable browser such as Hot Java, Lynx, Netscape or Internet Explorer.
    Hot Java Browser


    is a World Wide Web browser used to view web pages, follow links and submit forms.
    It can


    also downloaded and play applets on our system.


    Simply we call applet program is an internet program view on web pages. This is
    another


    type of java program. If there is no browser in our system means we can use tools
    appletviewer.exe


    to execute applet program. This applet window is just embedded in the browser.
    We can see


    the status bar of browser applet started is displayed from that we can identify
    that web page


    contains applet program. If we want execute the applet in browser means we need
    to develop


    html file and call the applet class file in html file and locate the html file
    in browser. For


    developing applet program we have import java.applet. * package. The minimum requirements


    of html tags for applet is given below.


    HTML Tag Requirements for Applet


    <applet code=Appletclassfilename.class width = 300 height=300></applet>


    Restrictions of Applet


    1\. Applets cannot read or write to the file system.


    2\. Applets cannot communicate with any other server.


    3\. Applet cannot run any programs on the System.


    LIFE CYCLE OF APPLET


    1\. init()


    2\. start( )


    3\. stop()


    4\. destroy( )


    This method gets called as soon an applet is started. Initialization of all


    variables are done here.


    This method is executed after the init () method. The stage is currently


    we viewing the web page.


    If we are moving other than applet page that time stop () method is


    called, and if we come to the applet again start () method is called.


    When we are closing the web pages that time destroy() method is called.


