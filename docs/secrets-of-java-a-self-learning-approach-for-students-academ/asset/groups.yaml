    # ABOUT THE BOOK


    The book ''Secrets of Java'' covers all the important topics of Java programs.
    Each and every chapter has been prepared with key point and simple examples. If
    you read this book you can confidently say that ''I know java''. One importance
    of this book is that it contains CD with more examples in all topics of java,
    which is pure hard coding that will help you to know the syntax of java very easily.


    # ABOUT THE AUTHOR


    Er. R. Kabilan is presently working as a Senior Lecturer in Thiruvalluar College
    of Engineering and Technology. Earlier he worked as a Software Engineer in SSI
    Limited around the various branches at a National level. He obtained his B.E.
    degree from Madras University and his M.E. from Anna University, his areas of
    interest are Sun-Micystems products, DSP and Power Electronics.


    ISBN : 978-81-318-0720-0

