    Chapter **12** ***Swings***


    **INTRODUCTION**


    JDK1.2 was introduced with a new set of packages the java Foundation classes (JFC)
    that


    includes an improved user interface components called swing components.


    JFC or swing is an extension of AWT not a replacement of AWT. The classes of AWT
    are


    valid for swing components.


    **COMPARISON** **WITH** **AWT**


    Awt components application has given different look and feel in different, different
    platforms.


    This is one of the disadvantages of AWT Components. Sun-Microsystems developed
    a new


    version JFC1.2 or Swing components to give same look and feel application in all
    platforms.


    **JFC1.2** **cons****is****ts** **of** **five** **major** **package** :


    1\. Swing


    2\. Pluggable Look and Feel


    3\. Drag and Drop


    4\. Accessibility


    5\. 2D.


    The swing components facilitate efficient graphical user interface (GUI) development.


    These components are a collection of lightweight visual components. The root class
    of all swing


    components is JComponent which is derived from Container of AWT package so that
    only we


    ca]l swing is an extension of AWT not an replacement of AWT.


    **Syntax**


    The programming way is some what different when compared to AWT. In swing components


    all the class names are start with capital J.


    For example AWT Class is Button.


    For example swing class is JBu tton. This is the only difference jn syntax wise.
    So swing


    is an improved version of AWT and it has some additional components also.


