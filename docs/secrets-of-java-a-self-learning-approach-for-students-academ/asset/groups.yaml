    \n第 **11** 章\n***Applet***\n\n简介\n\nApplet 是一种动态且交互式的程序，可以运行在支持 Java 的浏览器（如 Hot\
    \ Java, Lynx, Netscape 或 Internet Explorer）显示的网页内部。Hot Java Browser 是一种用于查看网页、遵循链接和提交表单的万维网浏览器。它还可以在我们的系统上下载并运行\
    \ applet。\n\n简单来说，我们将 applet 程序称为在网页上查看的网络程序。这是 Java 程序的另一种类型。如果我们的系统中没有浏览器，我们可以使用\
    \ `appletviewer.exe` 工具来执行 applet 程序。这个 applet 窗口只是嵌入在浏览器中的。我们可以看到浏览器状态栏显示 applet\
    \ 已启动，据此我们可以识别出网页是否包含 applet 程序。如果我们想在浏览器中执行 applet，则需要编写 html 文件，并在 html 文件中调用\
    \ applet 类文件，然后在浏览器中定位该 html 文件。开发 applet 程序我们需要导入 `java.applet.*` 包。HTML 标签的最低要求如下。\n\
    \nApplet 的 HTML 标签\n`<applet code=\"filename.class\" width=300 height=300\"></applet>`\n\
    \nApplet 的限制\n1. Applets 无法读取或写入系统。\n2. Applets 无法与其他服务器通信。\n3. Applets 无法运行任何程序。\n\
