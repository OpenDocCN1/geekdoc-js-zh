    **PREFACE**


    J


    ava software is a technology used to develop distributed application executed
    across all


    platforms. There are several IDE (Integrated Development Environment) from Sun,
    Symantec


    and Borland available in the market. Java uses a compiler to convert the source
    code into


    architecture independent byte codes. The JDK (Java Development Kit) from Javasoft
    contains the


    basic tools and API (Application Programming Interface) for creating and executing
    both types


    of java programs namely application and applet (internet) type programs. This
    book covers all


    the important topics of Java programs. Each and every chapter has been prepared
    with key


    points and simple examples. I assure that if you read this book you can confidently
    say that ''I


    know Java''. This book also contains CD with more examples from all the topics
    of java, which


    is pure hard coding that will help you to know the syntax of java very easily.


    Every possible attempt has been made to make this book useful for the students,
    still any


    suggestions regarding improvement of this book will be acknowledged.


    **-AU****THOR**


