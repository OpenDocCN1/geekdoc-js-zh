    Chapter **13**


    ***Networking***


    **IN****TRODUCTION**


    A network is a set of computers and peripherals, which are physically connected
    together.


    Networking enables sharing of resources and communication. Internet is a network
    of networks.


    Networking in java is possible through the use of java.net package.


    Protocols assigning set of rules for communication between computers and between
    the


    networks. Java networking is done using TCP/IP and UDP protocols.


    **Clien****t/****Se****rv****er**


    A computer which requests for some service from another computer is known as client.


    The one that processes the request is called as server.


    **IP** **Addr****ess**


    Every computer com1ected to a network has a unique IP address. IP address is a
    32-bit number


    which has four numbers separated by periods.


    Ex. of IP address is


    80.0.0.53


    **Port Number**


    Port number is assigned to all protocols, 21 are assigned for FTP, 23 are assigned
    for Telnet, etc.


    **TYPES** **OF NETWORKING PROGRAMS**


    There are two types of networking program they are :


    • Connection oriented protocols is TCP/IP (Transmission control protocols)


    • Connectionless protocols are UDP (User datagram protocols).


    The supporting package is java.net. *;


