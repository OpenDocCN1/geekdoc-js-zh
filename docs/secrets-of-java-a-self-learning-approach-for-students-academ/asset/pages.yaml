    **INTRODUCTION**


    The Abstract Windowing Toolkit (AWT) is an API that is responsible for building
    the Graphical


    User Interface (GUI). It is a part of the Java Foundation Classes *UFC).* AWT
    includes a rich set


    of user interface components, a powerful event handling model, graphics and image
    tools,


    layout managers and support for data transfer using cut and paste through clipboards.
    AWT also


    supports JavaBeans architecture. Every AWT component is a simple bean. The java.awt.
    * package


    contains all classes for creating user interface and for painting graphics and
    images.


    AWT package contains *n* number of class. Examples Graphics, Color, Font. Each
    class


    contains *n* number of constructor, methods and variables.


    If we want know the methods and variables of particular class we can use the following


    syntax


    **> javap jav****a.awt****.G****raphlcs > a.txt**


    The details of this particular class are stored in a.txt file, open that text
    file and see the


    details.


    If we want to create the help or documentation of the particular user defined
    java program


    means use the following syntax


    **>javado****c F****ilename****.****ja****va**


    It will give output in html file.


    One more important point is the top level or super class of all java class is
    **Obj****ect.**


    **LAYOUT** **MANAGERS**


    The java.awt.LayoutManager helps to position the components in a container.


    The basic Layout Managers are


    1\. FlowLayout


    Left to Right arrangement of components


    2\. BorderLayout


    Arrange components in North, South, East, West and center


