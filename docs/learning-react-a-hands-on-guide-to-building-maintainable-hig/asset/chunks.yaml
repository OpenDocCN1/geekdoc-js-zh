    #container\");\n    ReactDOM.render(\n      <div>\n        <Circle bgColor=\"\
    #F9C240\"/>\n      </div>,\n      destination\n    );\n  </script>\n</body>\n\
    </html>\n```\n\nOnce you have your document set up, go ahead and preview what\
    \ you have in your browser. If everything went well, you will be greeted by a\
