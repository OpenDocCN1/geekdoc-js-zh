  trans: "\n\n```html\n<div className=\"header\">\n  <form>\n    <input placeholder=\"\
    enter task\">\n    </input>\n    <button type=\"submit\">add</button>\n  </form>\n\
    </div>\n</div>\n```\n\n```javascript\n  );\n}\n});\n```\n\n我们在这里所做的是指定 `getInitialState`\
    \ 方法，该方法会在组件渲染之前被调用。在该方法内部，我们创建了一个名为 `items` 的空数组，之后我们可以在此组件的任何地方通过 `this.state.items`\
    \ 访问它。\n\n### 处理表单提交\n\n当你通过点击“Add”按钮或在键盘上按下 Enter/Return 键提交表单时，我们会向待办列表中添加新项目。这种行为大部分是\
    \ HTML 内置的，我们的浏览器完全知道如何处理这种情况。我们不需要编写任何特殊代码来处理 Enter/Return 键或监听“Add”按钮的点击。我们唯一需要担心的是处理表单实际提交时会发生的情况。\n\
    \n为了做到这一点，我们在 `form` 元素上监听 `onSubmit` 事件。每当表单提交时，该事件就会被触发，这包括按下 Enter/Return 键或操作任何带有\
    \ `type=\"submit\"` 属性的元素。当表单提交并捕获到该事件时，我们需要调用一个事件处理器。让我们把这个事件处理器命名为 `addItem`。\n\
    \n将所有这一切整合在一起，在你的 `TodoList` 组件的 `render` 函数中，进行以下高亮修改：\n\n点击此处查看代码图片\n\n```javascript\n\
    render: function() {\n  return (\n    <div className=\"todoListMain\">\n     \
    \ <div className=\"header\">\n        <form onSubmit={this.addItem}> \n      \
    \    <input placeholder=\"enter task\">\n          </input>\n          <button\
    \ type=\"submit\">add</button>\n        </form>\n      </div>\n    </div>\n  );\n\
    }\n```\n\n正如我们所希望做的那样，我们刚刚将 `form` 元素的 `onSubmit` 事件链接到了 `addItem` 事件处理器。这个事件处理器还不存在，但我们将通过添加以下高亮代码行来修复这个问题：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar TodoList = React.createClass({\n  getInitialState:\
    \ function() {\n    return {\n      items: []\n    };\n  },\n  addItem: function(e)\
    \ { \n  },\n  render: function() {\n    return (\n      <div className=\"todoListMain\"\
    >\n        <div className=\"header\">\n          <form onSubmit={this.addItem}>\n\
    \            <input placeholder=\"enter task\">\n            </input>\n      \
    \      <button type=\"submit\">add</button>\n          </form>\n        </div>\n\
    \      </div>\n    );\n  }\n});\n```\n\n我们的 `addItem` 事件处理器/函数目前还没有做太多事情，但重要的是它确实存在！接下来，我们将修复它没做太多事情的那部分。\n\
    \n### 填充我们的状态\n\n现在，`TodoList` 组件的 `state` 对象包含了 `items` 数组。我们需要做的是将你在输入字段中输入的文本填充到这个数组中。这意味着我们需要一种从\
    \ React 访问 `input` 元素的方法。我们将采用的方法是在我们的 `input` 元素上设置一个 `ref` 属性（正如你在第 2 章中所看到的那样），并存储对生成的\
    \ HTML 元素的引用。\n\n在 `TodoList` 组件的 `render` 方法内部，添加以下行：\n\n点击此处查看代码图片\n\n```javascript\n\
    render: function() {\n  return (\n    <div className=\"todoListMain\">\n     \
    \ <div className=\"header\">\n        <form onSubmit={this.addItem}>\n       \
    \   <input ref={(a) => this._inputElement = a} placeholder=\"enter task\">\n \
    \         <button type=\"submit\">add</button>\n        </form>\n      </div>\n\
    \    </div>\n  );\n}\n```\n\n当这段高亮代码运行时（它在组件组件挂载后立即执行），`_inputElement` 属性将存储对生成的\
    \ `input` 元素的引用。现在我们已经完成了这一步，可以对待这个元素像我们在非 React 世界中通过 `querySelector` 或等效函数找到任何\
    \ DOM 元素。我们接下来要做的是填充我们的 `items` 数组！\n\n请继续通过添加以下行来修改 `addItem` 方法：\n\n点击此处查看代码图片\n\
    \n```javascript\naddItem: function(e) {\n  var itemArray = this.state.items;\n\
    \  itemArray.push(\n    {\n      text: this._inputElement.value,\n      key: Date.now()\n\
    \    }\n  );\n  this.setState({\n    items: itemArray\n  });\n  e.preventDefault();\n\
    }\n```\n\n这看起来你刚刚添加了很多代码，但我们所做的只是用 JavaScript 实现我们之前提到的目标：用来自输入字段的文本填充 `items`\
    \ 数组。让我们过一遍。\n\n我们做的第一件事是创建一个名为 `itemArray` 的数组，存储对 `state` 对象 `items` 属性的引用：点击此处查看代码图片\n\
    \n```javascript\nvar itemArray = this.state.items;\n```\n\n完成这一步后，我们将刚刚提交的 `input`\
    \ 元素内容添加到其中：点击此处查看代码图片\n\n```javascript\nitemArray.push(\n  {\n    text: this._inputElement.value,\n\
    \    key: Date.now()\n  }\n);\n```\n\n注意，我们不仅仅是添加来自 `input` 元素的文本。我们添加了一个由 `text`\
    \ 和 `key` 属性组成的对象。这个 `key` 值是 React 将来唯一标识每个生成的元素。因为这是一个重要（且容易忽略）的细节，我们稍后会再次回到这些内容。\n\
    \n总之，回到正题，在完成 `itemArray` 后，剩下的工作是将我们的 `state` 对象的 `items` 属性设置为它：\n\n```javascript\n\
    this.setState({\n  items: itemArray\n});\n```\n\n快要完成了！我们在方法中最后的操作是执行：\n\n```javascript\n\
    e.preventDefault();\n```\n\n`preventDefault` 方法确保我们覆盖了默认的 `onSubmit` 事件。我们这样做的原因有点晦涩，但它是为了确保以下结果：当我们提交表单时，我们想要的只是调用\
    \ `addItem` 方法。如果不阻止默认行为，当我们提交表单时，我们的程序会正确调用 `addItem`。**它还会触发浏览器的默认 POST 行为——这是我们绝对不想要的。**\n\
    \n### 显示任务\n\n我们几乎就要完成了！我们最后要做的一件事是视觉化目前存在于 `state` 对象 `items` 数组中的任务。这将涉及到创建一个全新的组件\
    \ `TodoItems`、传递一些 props、使用 `map` 函数以及进行其他令人兴奋和肾上腺飙升的操作（图 14-6）。\n\n"
- fmt: "\nAnyway, the first thing we are going to do is define our `TodoItems` component.\
    \ In your code, just above where you have the `TodoList` component defined, go\
    \ ahead and add the following in:\n\n[Click here to view code image](#part0040.xhtml_p173pro01)\n\
    \n```javascript\nvar TodoItems = React.createClass({\n  render: function() {\n\
    \n  }\n});\n```\n\nThere is nothing going on right now, but that’s OK.\n\nNext,\
    \ what we are going to do is call this component from inside the `TodoList` component’s\
    \ `render` method. Not only that, we are going to specify a prop and pass in our\
    \ `TodoList` component’s `state` object that contains our `items` array. Doing\
    \ all of this is really simple, so go ahead and add the following highlighted\
    \ line to your `TodoList` component’s `render` method:\n\n[Click here to view\
    \ code image](#part0040.xhtml_p173pro02)\n\n```javascript\nrender: function()\
    \ {\n  return (\n    <div className=\"todoListMain\">\n      <div className=\"\
    header\">\n        <form onSubmit={this.addItem}>\n          <input ref={(a) =>\
    \ this._inputElement = a}\n                 placeholder=\"enter task\">\n    \
    \      </input>\n          <button type=\"submit\">add</button>\n        </form>\n\
    \      </div>\n      <TodoItems entries={this.state.items}/> \n    </div>\n  );\n\
    }\n```\n\nAll we did here is instantiate our `TodoItems` component and pass in\
    \ our `items` `state` property to a prop called `entries`. At this point, if you\
    \ run our app in the browser, nothing visible will happen. Our `TodoItems` component\
    \ is ready to render, and it has access to all of the tasks that were submitted.\
    \ The only problem is that it doesn’t really do anything with all of that, but\
    \ we are going to fix that up next.\n\nGetting back to our `TodoItems` component,\
    \ the first thing we are going to do is create a new variable to store our passed\
    \ in array of tasks. To do that, add the following highlighted line:\n\n[Click\
    \ here to view code image](#part0040.xhtml_p174pro01)\n\n```javascript\nvar TodoItems\
    \ = React.createClass({\n  render: function() {\n    var todoEntries = this.props.entries;\
    \ \n  }\n});\n```\n\nWe just added a variable called `todoEntries`, and it stores\
    \ the value from the `entries` prop that we passed in based on the `TodoList`\
    \ component’s `this.state.items` value. Sweet! Now, our `todoEntries` variable\
    \ stores an array containing a bunch of objects that each store a task and a key.\
    \ All that remains is to create the HTML elements that will be used to display\
    \ our data.\n\nIn the first step towards accomplishing that, add the following\
    \ highlighted lines of code to create the `li` elements:\n\n[Click here to view\
    \ code image](#part0040.xhtml_p174pro02)\n\n```javascript\nvar TodoItems = React.createClass({\n\
    \  render: function() {\n    var todoEntries = this.props.entries;          \n\
    \    function createTasks(item) {               \n      return <li key={item.key}>{item.text}</li>\
    \  \n    }                            \n    var listItems = todoEntries.map(createTasks);\
    \ \n  }\n});\n```\n\nWe are using the `map` function to iterate every item inside\
    \ `todoEntries` and call the `createTasks` function to create a list element for\
    \ each entry:\n\n[Click here to view code image](#part0040.xhtml_p175pro01)\n\n\
    ```javascript\nfunction createTasks(item) {\n  return <li key={item.key}>{item.text}</li>\n\
    }\n```\n\nTo reiterate a point we made earlier, since these list elements are\
    \ dynamically created, we need to help React keep track of them by specifying\
    \ the `key` attribute and giving each a unique value. We already solved this part\
    \ of the problem when we stored our tasks, you recall:\n\n[Click here to view\
    \ code image](#part0040.xhtml_p175pro02)\n\n```javascript\nitemArray.push(\n \
    \ {\n    text: this._inputElement.value,\n    key: Date.now()\n  }\n);\n```\n\n\
    Because of our earlier planning, we take the easy street now by assigning our\
    \ `key` attribute the `item.key` value that each item in our `todoEntries` array\
    \ already contains. Our list element’s visible content is simply the text value\
    \ stored by `item.text`. There is no explanation needed for how we use that. Quite\
    \ refreshing, isn’t it?\n\nPutting all of this together, this collection of list\
    \ elements is fully processed and stored by our `listItems` variable. All that\
    \ remains at this point is to go from list elements inside an array to list elements\
    \ rendered on the screen. To accomplish that, go ahead and add the following lines:\n\
    \n[Click here to view code image](#part0040.xhtml_p175pro03)\n\n```javascript\n\
    var TodoItems = React.createClass({\n  render: function() {\n    var todoEntries\
    \ = this.props.entries;\n    function createTasks(item) {\n      return <li key={item.key}>{item.text}</li>\n\
    \    }\n    var listItems = todoEntries.map(createTasks);\n    return (\n    \
    \  <ul className=\"theList\">\n        {listItems}\n      </ul>\n    );\n  }\n\
    });\n```\n\nWhat we are doing is returning an `ul` element whose contents are\
    \ the list elements stored by `listItems`. After you’ve added this, save your\
    \ document and preview your app. You’ll see something that looks like Figure 14-7](#part0021.xhtml_ch14fig07)\
    \ after entering a few tasks.\n\n![Image](Images/image0299.jpeg)\n\nFigure 14-7\
    \ List element for the list items.\n\nOur app works! Every task you submit shows\
    \ up in its own list item. Take a few deep breaths and relax for a few moments.\
    \ This is awesome progress, and all we have left are a few things here and there\
    \ that need to be wrapped up.\n\n### Adding the Touches\n\nWe are almost done\
    \ here! First, what we have right now doesn’t look exactly like the example we\
    \ started out with. Our list of tasks looks a bit plain, but that can be fixed\
    \ with some CSS magic. Inside your `style` block, add the following style rules\
    \ just below your existing style rules live:\n\n[Click here to view code image](#part0040.xhtml_p176pro01)\n\
    \n```css\n.todoListMain .theList {\n  list-style: none;\n  padding-left: 0;\n\
    \  width: 255px;\n}\n\n.todoListMain .theList li {\n  color: #333;\n  background-color:\
    \ rgba(255,255,255,.5);\n  padding: 15px;\n  margin-bottom: 15px;\n  border-radius:\
    \ 5px;\n}\n```\n\nIf you preview your app now, you’ll see that the entered tasks\
    \ look exactly as you expected them to:\n\n![Image](Images/image0300.jpeg)\n\n\
    Next, have you noticed that whatever you enter into the input field doesn’t go\
    \ away after you submit the form? You have to manually clear out the field each\
    \ time after submitting a task...like an animal! That is annoying, but the fix\
    \ for it is quite simple. Inside our `TodoList` component’s `addItem` method,\
    \ add the following highlighted line:\n\n[Click here to view code image](#part0040.xhtml_p177pro01)\n\
    \n```javascript\naddItem: function(e) {\n  var itemArray = this.state.items;\n\
    \  itemArray.push(\n    {\n      text: this._inputElement.value,\n      key: Date.now()\n\
    \    }\n  );\n  this.setState({\n    items: itemArray\n  });\n  this._inputElement.value\
    \ = \"\"; \n  e.preventDefault();\n}\n```\n\nAll we are doing here is clearing\
    \ our `input` element’s `value` property when the form is submitted and the `addItem`\
    \ method gets called. This ensures that we no longer have to manually clear out\
    \ our input field between each task we would like to submit. Simpleple!\n\n###\
    \ Conclusion\n\nOur Todo app is pretty simple in what it does, but by building\
    \ it from scratch, we covered almost every little detail React brings to the table.\
    \ More importantly, we created an example that shows how the various concepts\
    \ we learned individually play together. That is actually the important detail.\
    \ Now, here is a quick question for you: does everything we’ve done in this chapter\
    \ make sense?\n\nIf everything we’ve done in this chapter makes sense then you\
    \ are in good shape to tell your friends and family that you are close to mastering\
    \ React! If there are areas that you find confusing, I suggest you go back and\
    \ re-read the chapters which address your confusion.\n"
