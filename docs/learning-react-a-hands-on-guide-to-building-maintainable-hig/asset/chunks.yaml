  trans: "\n最棒的是，当你更改了函数的工作方式后，不需要进行任何额外操作即可看到这些更改的结果。如果函数签名没有变化，任何对该函数的现有调用都会神奇地正常工作，并自动采用你对函数本身所做的任何新更改。例如，我们现有的\
    \ `getDistance` 调用即使在最初定义调用时 `formatDistance` 函数还不存在，现在也能看到 `formatDistance` 函数的输出。这太棒了。\n\
    \n简而言之，函数是很棒的。我知道这一点，你也知道。这就是为什么我们编写的所有代码中到处都是函数的原因。\n\n### 改变我们处理 UI 的方式\n\n\
    我不认为有人会反对函数带来的带来的好处。它们确实让以一种合理的方式来构建应用程序代码结构成为可能。我们在编写代码时所使用的那种程度的严谨性，在编写 UI 时并不总是能做到。由于各种技术和非技术原因，我们一直对处理\
    \ UI 元素时的通常方式忍了某种程度的粗率。\n\n我意识到这是一个非常有争议的观点，所以让我通过看一些例子来重点说明我的意思。我们将回顾并查看上一章节中使用的\
    \ `render` 方法：\n\n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"\
    #container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n  destination\n);\n```\n\
    \n你在屏幕上看到的是大字母打印的单词 `Batman`——多亏于 `h1` 元素。让我们稍微改变一下，假设我们要打印其他几个超级英雄的名字。为了做到这一点，让我们修改\
    \ `render` 方法，使其如下所示：\n\n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"\
    #container\");\n\nReactDOM.render(\n  <div>\n    <h1>Batman</h1>\n    <h1>Iron\
    \ Man</h1>\n    <h1>Nicolas Cage</h1>\n    <h1>Mega Man</h1>\n  </div>,\n  destination\n\
    );\n```\n\n注意你在这里看到的。我们输出了一个 `div`，它包含了四个带有超级英雄名字的 `h1` 元素。\n\n#### JSX 陷阱：输出多个元素\n\
    \n这里有一个重要的 JSX 细节需要指出。包裹我们 `h1` 元素的 `div` 存在并不是因为它看起来是个好主意，而是是因为它*必须在那里*。在 React\
    \ 中，你不能像下面所示输出多个相邻的元素：\n\n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"\
    #container\");\n\nReactDOM.render(\n  <h1>Batman</h1>\n  <h1>Iron Man</h1>\n \
    \ <h1>Nicolas Cage</h1>\n  <h1>Mega Man</h1>,\n  destination\n);\n```\n\n尽管这是合法的\
    \ HTML，但在 JSX 和 JavaScript 这对“不洁之联盟”眼中，它是无效的。这听起来可能是一个糟糕的限制，但解决方法其实非常简单。虽然你只能输出*一个元素*，但这个*元素可以拥有任意数量的子元素*。这就是为什么我们将\
    \ `h1` 元素封装在 `div` 内部。我们这样做是因为 JSX 转换为 JavaScript 的方式。关于这些细节我们以后会看，但它们现在还没有重要到足以分散我们学习组件的注意力。\n\
    \n好了，现在我们有了四个 `h1` 元素，每个都包含一个超级英雄的名字。如果我们想把 `h1` 元素改为类似 `h3` 的元素呢？我们可以如下如下手动更新所有这些元素：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"#container\"\
    );\n\nReactDOM.render(\n  <div>\n    <h3>Batman</h3>\n    <h3>Iron Man</h3>\n\
    \    <h3>Nicolas Cage</h3>\n    <h3>Mega Man</h3>\n  </div>,\n  destination\n\
    );\n```\n\n如果我们预览现在的内容，你会看到一些看起来有点没样式且朴素的东西（参见图 3-3）。\n\n![Image](img/image00241.jpeg)\n\
    \n图 3-3 朴素的超级英雄名字。\n\n我们不想在这里样式上太疯狂。我们想做的只是通过 `<i>` 标签将所有名字都设为斜体，所以让我们通过此更改来手动更新我们渲染的内容：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar destination = document.querySelector(\"#container\"\
    );\n\nReactDOM.render(\n  <div>\n    <h3>Batman</h3>\n    <h3>Iron Man</h3>\n\
    \    <h3>Nicolas Cage</h3>\n    <h3>Mega Man</h3>\n  </div>,\n  destination\n\
    );\n```\n\n注意你在这里看到的。我们输出了一个 `div`，它包含了四个带有超级英雄名字的 `h1` 元素。（注：原文末尾有重复片段，此处已按逻辑流处理）。\n\
    \n"
