  trans: "\n\n# 从 JSX 到 JavaScript\n\n我们目前缺失的步骤是将我们的 JSX 转换为浏览器可以理解的 JavaScript。这涉及到\
    \ `webpack` 和 `Babel`，我们将对它们进行配置以让这一切运行起来。\n\n## 设置 webpack\n\n由于我们正处于 Node.js\
    \ 领域，且 `webpack` 和 `Babel` 都是以 Node 包的形式存在，我们需要像安装 React 相关的包一样安装它们它们。\n\n要安装\
    \ `webpack`，请在你的终端（Terminal）/命令提示符（Command Prompt）中输入以下内容：\n\n```\nnpm install\
    \ webpack --save\n```\n\n这需要几秒钟，`webpack` 包（以及它庞大的依赖列表）将被下载并放置到我们的 `node_modules`\
    \ 文件夹中。完成后，我们需要添加一个配置文件来指定 `webpack` 如何与我们当前的项目协作。使用你的代码编辑器，在我们的 `MyTotallyAwesomeApp`\
    \ 文件夹内创建一个名为 `webpack.config.js` 的文件（请参见 图 15-13）。\n\n![Image](img/image0031.jpeg)\n\
    \n图 15-13 添加 webpack.config.js。\n\n在此文件中，我们将指定一组 JavaScript 属性来定义我们原始、未修改的源文件位置，以及输出最终源文件的位置。请将以下\
    \ JavaScript 代码添加到 `webpack.config.js` 中：\n\n```javascript\nvar webpack = require(\"\
    webpack\");\nvar path = require(\"path\");\nvar DEV = path.resolve(__dirname,\
    \ \"dev\");\nvar OUTPUT = path.resolve(__dirname, \"output\");\nvar config = {\n\
    \  entry: DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename:\
    \ \"myCode.js\"\n  }\n};\nmodule.exports = config;\n```\n\n花几分钟时间看看这段代码的作用。我们定义了两个名为\
    \ `DEV` 和 `OUTPUT` 的变量，它们指向项目中的同名文件夹。在 `config` 对象内部，我们有两个名为 `entry` 和 `output`\
    \ 的属性，它们使用我们的 `DEV` 和 `OUTPUT` 变量来帮助将我们的 `index.jsx` 文件映射为 `myCode.js`。\n\n##\
    \ 设置 Babel\n\n我们当前设置的最后一部分是将我们的 `index.jsx` 文件转换为普通的 JavaScript 形式 `myCode.js`。这就是\
    \ Babel 发挥用场的地方。要安装 Babel，让我们回到信赖的终端 / 命令提示符并输入以下 Node.js 命令：\n\n```\nnpm install\
    \ babel-loader babel-preset-es2015 babel-preset-react --save\n```\n\n通过此命令，我们安装了\
    \ `babel-loader`、`babel-preset-es2015` 和 `babel-preset-react` 包。现在我们需要配置 Babel\
    \ 与我们的项目协作。这是一个两个步骤。\n\n第一步是指定我们想要使用的 Babel 预设（presets）。有几种方法可以实现，但我倾向的方法是修改 `package.json`\
    \ 并添加以下高亮内容：\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n    \"babel-loader\"\
    : \"⁶.2.4\",\n    \"babel-preset-es2015\": \"⁶.9.0\",\n    \"babel-preset-react\"\
    : \"⁶.5.0\",\n    \"react\": \"¹⁵.1.0\",\n    \"react-dom\": \"¹⁵.1.0\",\n   \
    \ \"webpack\": \"¹.13.1\"\n  },\n  \"babel\": {      \n    \"presets\": [    \
    \  \n      \"es2015\",  \n      \"react\"     \n    ]              \n  }     \
    \         \n}\n```\n\n在高亮亮行中，我们指定了 `babel` 对象并指定了 `es2015` 和 `react` 预设值。\n\n\
    第二步是告诉 webpack 关于 Babel。在我们的 `webpack.config.js` 文件中，添加以下高亮行：\n\n```javascript\n\
    var webpack = require(\"webpack\");\nvar path = require(\"path\");\nvar DEV =\
    \ path.resolve(__dirname, \"Dev\");\nvar OUTPUT = path.resolve(__dirname, \"output\"\
    );\nvar config = {\n  entry: DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n\
    \    filename: \"myCode.js\"\n  },\n  module: {\n    loaders: [{\n      include:\
    \ DEV,\n      loader: \"babel\"\n    }]\n  }\n};\nmodule.exports = config;\n```\n\
    \n我们添加了 `module` 和 `loaders` 对象，告诉 `webpack` 将我们在 `entry` 属性中定义的 `index.jsx` 文件通过\
    \ Babel 转换为 JavaScript。通过此更改，我们已经基本准备好了构建 React 应用开发环境。\n\n### 构建并测试我们的应用\n\n\
    这一切中最后（也是希望最满意的）步骤是构建我们的应用并让端到端的工作流运行。要构建我们的应用，输入的内容取决于你在终端还是命令提示符中。\n\n对于 Mac\
    \ 的终端，输入以下内容：\n\n```\n./node_modules/.bin/webpack\n```\n\n在 Windows 的命令提示符中，输入对应的内容：\n\
    \n```\nnode_modules\\.bin\\webpack\n```\n\n此命令运行 `webpack`。你的终端 / 命令提示符会像图 15-14\
    \ 所示显示 `webpack.config.js` 和 `package.json` 的各种输出。你的终端 / 命令提示符会像图 15-13 所示显示添加\
    \ webpack.config.js。你的终端 / 命令提示符会像图 15-15 所示显示简单的应用。你的终端 / 命令提示符会进入 `Output` 文件夹查看\
    \ `myCode.js`，你会看到一个大约 700Kb 的文件，包含了 React。\n\n"
