    \ 属性：\n\n- `boolean altKey`\n- `number button`\n- `number buttons`\n- `number\
    \ clientX`\n- `number clientY`\n- `boolean ctrlKey`\n- `boolean getModifierState(key)`\n\
    - `boolean metaKey`\n- `number pageX`\n- `number pageY`\n- `DOMEventTarget relatedTarget`\n\
    - `number screenX`\n- `number screenY`\n- `boolean shiftKey`\n\n该属性的工作原理非常简单。如果在此鼠标事件触发时按下\
    \ Shift 键，那么 `shiftKey` 属性的值为 `true`。否则，`shiftKey` 属性的值为 `false`。为了在按下 Shift 键时将计数器加\
    \ 10，回到我们的 `increase` 函数并进行以下高亮更改：\n\n```javascript\nincrease: function(e) {\n\
    \  var currentCount = this.state.count;\n  if (e.shiftKey) {\n    currentCount\
    \ += 10;\n  } else {\n    currentCount += 1;\n  }\n  this.setState({\n    count:\
    \ currentCount\n  });\n},\n```\n\n一旦完成更改，在浏览器中预览我们的示例。每当你点击加号按钮时，你的计数器都会像以前一样每次增加\
    \ 1。如果你在按下 Shift 键的情况下点击加号按钮，请注意我们的计数器会转而增加 10。\n\n这一切之所以奏效，是因为我们根据是否按了 Shift\
    \ 键来改变递增行为。这主要由以下几行处理：\n\n```javascript\nif (e.shiftKey) {\n  currentCount +=\
    \ 10;\n} else {\n  currentCount += 1;\n}\n```\n\n如果我们的 `SyntheticEvent` 事件参数上的\
    \ `shiftKey` 属性为 `true`，我们就将计数器加 10。如果 `shiftKey` 的值为 `false`，我们只加 1。\n\n## 更多事件处理的各种花样\n\
    \n我们还没有结束！到目前为止，我们查看了如何在 React 中以一种简单的方式处理事件。在现实世界中，事情很少会像我们看到的那样直接。你的真实应用将会更复杂，而且\
    \ React 坚持要用不同的方式处理事情，我们需要学习（或重新学习）一些事件相关的技巧和技术来让我们的应用运行起来。这正是本节大显用场的地方。我们将查看你会遇到的一些情况以及如何处理它们。\n\
    \n### 你不能直接监听组件\n\n假设你的组件仅仅是一个按钮或其他用户与之交互的 UI 元素。你不能像下面这行代码中看到那样：\n\n```javascript\n\
    CounterParent = React.createClass({\n  getInitialState: function() {\n    return\
    \ {\n      count: 0\n    };\n  },\n  increase: function() {\n    this.setState({\n\
    \      count: this.state.count + 1\n    });\n  },\n  render: function() {\n  \
    \  return (\n      <div>\n        <Counter display={this.state.count}/>\n    \
    \  </div>\n    );\n  }\n});\n```\n\n表面上，这行代码看起来是有效的。当有人点击 `PlusButton` 组件时，`increase`\
    \ 函数会被调用。如果你好奇，这是我们的 `PlusButton` 的样子：\n\n```javascript\nPlusButton = React.createClass({\n\
    \  render: function() {\n    return (\n      <button>\n        +\n      </button>\n\
    \    );\n  }\n});\n```\n\n我们的 `PlusButton` 组件并没有做任何疯狂的事。它只返回了一个 HTML 元素！\n\n无论你如何分析，这都不重要。我们通过组件返回的\
    \ HTML 看起来并不简单。*你无法直接对它们进行事件*。是因为组件是 DOM 元素的包装器。在组件上监听事件到底意味着什么？一旦你的组件解包为 DOM\
    \ 元素，外层的 HTML 元素是你监听的对象吗？还是其他元素？对于这些问题都没有明确的答案。说解决方案是简单地不监听组件也不对。幸运的是，有一种变通方法，我们将事件处理程序作为一个属性并将其传递给组件。在组件内部，我们可以将事件分配给\
    \ DOM 元素，并将事件处理程序设置为我们刚刚传递的属性值。我意识到这可能听起来毫无意义，所以让我们来看一个示例。\n\n看这一行：\n\n```javascript\n\
    CounterParent = React.createClass({\n  // ...\n  render: function() {\n    return\
    \ (\n      <div>\n        <Counter display={this.state.count}/>\n        <PlusButton\
    \ clickHandler={this.increase}/>\n      </div>\n    );\n  }\n});\n```\n\n在这个示例中，我们创建了一个名为\
    \ `clickHandler` 的属性，其值是 `increase` 事件处理程序。在我们的 `PlusButton` 组件内部，我们可以像这样做：\n\n\
    ```javascript\nPlusButton = React.createClass({\n  render: function() {\n    return\
    \ (\n      <button onClick={this.props.clickHandler}>\n        +\n      </button>\n\
    \    );\n  }\n});\n```\n\n在我们的 `button` 元素上，我们指定了 `onClick` 事件，并将其设置为 `clickHandler`\
    \ 属性。在运行时，该属性被求值为为我们的 `increase` 函数，点击加号按钮确保了 `increase` 函数被调用。这解决了我们的问题，同时让我们的组件能够参与到所有这些事件处理中！\n"
- fmt: "\nIf you thought the previous section was a doozy, wait till you see what\
    \ we have here. Not all DOM events have `SyntheticEvent` equivalents. It may seem\
    \ like you can just add the `on` prefix and capitalize the event you are listening\
    \ for when specifying it inline in your JSX:\n\n[Click here to view code image](#part0036.xhtml_p117pro03)\n\
    \n```javascript\nvar Something = React.createClass({\n  handleMyEvent: function(e)\
    \ {\n    // do something\n  },\n  render: function() {\n      return (\n     \
    \   <div onMyWeirdEvent={this.handleMyEvent}>Hello!</div>\n      );\n    }\n});\n\
    ```\n\nIt doesn’t work that way! For those events that aren’t officially recognized\
    \ by React, you have to use the traditional approach that uses `addEventListener`\
    \ with a few extra hoops to jump through.\n\nTake a look at the following section\
    \ of code:\n\n[Click here to view code image](#part0036.xhtml_p118pro01)\n\n```javascript\n\
    var Something = React.createClass({\n  handleMyEvent: function(e) {\n    // do\
    \ something\n  },\n  componentDidMount: function() {\n    window.addEventListener(\"\
    someEvent\", this.handleMyEvent);\n  },\n  componentWillUnmount: function() {\n\
    \    window.removeEventListener(\"someEvent\", this.handleMyEvent);\n  },\n  render:\
    \ function() {\n      return (\n        <div>Hello!</div>\n      );\n    }\n});\n\
    ```\n\nWe have our `Something` component that listens for an event called `someEvent`.\
    \ We start listening for this event under the `componentDidMount` method which\
    \ is automatically called when our component gets rendered. The way we listen\
    \ for our event is by using `addEventListener` and specifying both the event and\
    \ the event handler to call:\n\n[Click here to view code image](#part0036.xhtml_p118pro02)\n\
    \n```javascript\nvar Something = React.createClass({\n  handleMyEvent: function(e)\
    \ {\n    // do something\n  },\n  componentDidMount: function() {            \
    \                                \n    window.addEventListener(\"someEvent\",\
    \ this.handleMyEvent); \n  },                                                \
    \                         \n  componentWillUnmount: function() {\n    window.removeEventListener(\"\
    someEvent\", this.handleMyEvent);\n  },\n  render: function() {\n      return\
    \ (\n        <div>Hello!</div>\n      );\n    }\n});\n```\n\nThat should be pretty\
    \ straightforward. The only other thing you need to keep in mind is removing the\
    \ event listener when the component is about to be destroyed. To do that, you\
    \ can use the opposite of the `componentDidMount` method, the `componentWillUnmount`\
    \ method. Inside that method, put your `removeEventListener` call to ensure no\
    \ trace of our event listening takes place after our component goes away.\n\n\
    #### The Meaning of `this` Inside the Event Handler\n\nWhen dealing with events\
    \ in React, the value of `this` inside your event handler is different from what\
    \ you would normally see in the non-React DOM world. In the non-React world, the\
    \ value of `this` inside an event handler refers to the element that your event\
    \ is listening on:\n\n[Click here to view code image](#part0036.xhtml_p119pro01)\n\
    \n```javascript\nfunction doSomething(e) {\n  console.log(this); //button element\n\
    }\n\nvar foo = document.querySelector(\"button\");\n\nfoo.addEventListener(\"\
    click\", doSomething, false);\n```\n\nIn the React world (when your components\
    \ are created using `React.createClass`), the value of `this` inside your event\
    \ handler always refers to the *component the event handler lives in*:\n\n[Click\
    \ here to view code image](#part0036.xhtml_p119pro02)\n\n```javascript\nvar Counter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ count: 0\n    };\n  },\n  increase: function(e) {\n    console.log(this);\n\
    \    this.setState({\n      count: this.state.count + 1\n    });\n  },\n  render:\
    \ function() {\n    return (\n      <button onClick={this.increase}>\n       \
    \ Count: {this.state.count}\n      </button>\n    );\n  }\n});\n```\n"
  raw: 'If you thought the previous section was a doozy, wait till you see what we
    have here. Not all DOM events have `SyntheticEvent` equivalents. It may seem like
    you can just add the `on` prefix and capitalize the event you are listening for
    when specifying it inline in your JSX:


    [Click here to view code image](#part0036.xhtml_p117pro03)


    var Something = React.createClass({


      handleMyEvent: function(e) {


        // do something


      },


      render: function() {


          return (


            <div onMyWeirdEvent={this.handleMyEvent}>Hello!</div>


          );


        }


    });


    It doesn’t work that way! For those events that aren’t officially recognized by
    React, you have to use the traditional approach that uses `addEventListener` with
    a few extra hoops to jump through.


    Take a look at the following section of code:


    [Click here to view code image](#part0036.xhtml_p118pro01)


    var Something = React.createClass({


      handleMyEvent: function(e) {


        // do something


      },


      componentDidMount: function() {


        window.addEventListener("someEvent", this.handleMyEvent);


      },


      componentWillUnmount: function() {


        window.removeEventListener("someEvent", this.handleMyEvent);


      },


      render: function() {


          return (


            <div>Hello!</div>


          );


        }


    });


    We have our `Something` component that listens for an event called `someEvent`.
    We start listening for this event under the `componentDidMount` method which is
    automatically called when our component gets rendered. The way we listen for our
    event is by using `addEventListener` and specifying both the event and the event
    handler to call:


    [Click here to view code image](#part0036.xhtml_p118pro02)


    var Something = React.createClass({


      handleMyEvent: function(e) {


        // do something


      },


      componentDidMount: function() {                             


        window.addEventListener("someEvent", this.handleMyEvent); 


      },                                                          


      componentWillUnmount: function() {


        window.removeEventListener("someEvent", this.handleMyEvent);


      },


      render: function() {


          return (


            <div>Hello!</div>


          );


        }


    });


    That should be pretty straightforward. The only other thing you need to keep in
    mind is removing the event listener when the component is about to be destroyed.
    To do that, you can use the opposite of the `componentDidMount` method, the `componentWillUnmount`
    method. Inside that method, put your `removeEventListener` call to ensure no trace
    of our event listening takes place after our component goes away.


    #### The Meaning of `this` Inside the Event Handler


    When dealing with events in React, the value of `this` inside your event handler
    is different from what you would normally see in the non-React DOM world. In the
    non-React world, the value of `this` inside an event handler refers to the element
    that your event is listening on:


    [Click here to view code image](#part0036.xhtml_p119pro01)


    function doSomething(e) {


      console.log(this); //button element


    }


    var foo = document.querySelector("button");


    foo.addEventListener("click", doSomething, false);


    In the React world (when your components are created using `React.createClass`),
    the value of `this` inside your event handler always refers to the *component
    the event handler lives in*:


    [Click here to view code image](#part0036.xhtml_p119pro02)


    var CounterParent = React.createClass({


      getInitialState: function() {


        return {


          count: 0


        };


      },


      increase: function(e) {


        console.log(this); // CounterParent component


        this.setState({


          count: this.state.count + 1


        });


      },


      render: function() {


          return (


            <div>


              <Counter display={this.state.count}/>


              <button onClick={this.increase}>+</button>


            </div>


          );


        }


    });


    In this example, the value of `this` inside the `increase` event handler refers
    to the `CounterParent` component. It doesn’t refer to the element that triggered
    the event. You get this behavior because React automatically binds all methods
    inside a component to `this`. This autobinding behavior only applies when your
    component is created using `React.createClass`. If you are using ES6 classes to
    define your components, the value of `this` inside your event handler is going
    to be undefined unless you explicitly bind it yourself:


    [Click here to view code image](#part0036.xhtml_p120pro01)


    <button onClick={this.increase.bind(this)}>+</button>


    There is no autobinding magic that happens with the new class syntax, so be sure
    to keep that in mind if you aren’t using `React.createClass` to create your components.


    ### React...Why? Why?!


    Before we call it a day, let’s use this time to talk about why React decided to
    deviate from how we’ve worked with events in the past. There are two reasons:


    ![Image](Images/image00226.jpeg) Browser Compatibility


    ![Image](Images/image00226.jpeg) Improved Performance


    Let’s elaborate on these two reasons a little bit.


    #### Browser Compatibility


    Event handling is one of those things that mostly works consistently in modern
    browsers, but once you go back to older browser versions, things get really bad
    really quickly. By wrapping all of the native events as an object of type `SyntheticEvent`,
    React frees you from dealing with event handling quirks that you would end up
    having to deal with otherwise.


    #### Improved Performance


    In complex UIs, the more event handlers you have, the more memory your app takes
    up. Manually dealing with that isn’t difficult, but it is a bit tedious as you
    try to group events under a common parent. Sometimes, that just isn’t possible.
    Sometimes, the hassle doesn’t outweigh the benefits. What React does is pretty
    clever.


    React never attaches event handlers to the DOM elements directly. *It uses one
    event handler at the root of your document* that is responsible for listening
    to all events and calling the appropriate event handler as necessary (see [Figure
    10-3](#part0017.xhtml_ch10fig03)).


    ![Image](Images/image00276.jpeg)


    Figure 10-3 React uses one event handler at the root of your document.


    This frees you from having to deal with optimizing your event handler-related
    code yourself. If you’ve manually had to do that in the past, you can relax knowing
    that React takes care of that tedious task for you. If you’ve never had to optimize
    event handler-related code yourself, consider yourself lucky :P


    ### Conclusion


    You’ll spend a lot of time dealing with events, and this chapter threw a lot of
    things at you. We started by learning the basics of how to listen to events and
    specify the event handler. Towards the end, we were fully invested and looking
    at eventing corner cases that you will bump into if you aren’t careful enough.
    You don’t want to bump into corners. That is never fun.


    ## 11. The Component Lifecycle


    In the beginning, we started off with a very simple view of components and what
    they do. As we learned more about React and did cooler and more involved things,
    it turns out our components aren’t all that simple. They help deal with properties,
    state, events, and often are responsible for the well-being of other components
    as well. Keeping track of everything components do sometimes can be tough.


    To help with this, React provides us with something known as **lifecycle methods**.
    Lifecycle methods are (unsurprisingly) special methods that automatically get
    called as our component goes about its business. They notify us of important milestones
    in our component’s life, and we can use these notifications to simply pay attention
    or change what our component is about to do.


    In this chapter, we look at these lifecycle methods and learn all about what we
    can do with them.


    ### Meet the Lifecycle Methods'
