    ## Acknowledgments


    First, none of this would be possible without the support and encouragement of
    my awesome wife, `Meena`. If she didn’t put her goals on hold to allow me to spend
    six months designing, writing, and re-writing everything you see here, me writing
    this book would have been a distant dream.


    Next, I’d like to thank my parents for always encouraging me to aimlessly wander
    and enjoy free time to do what I liked—such as teaching complete strangers over
    the internet in the late 1990s to do cool things with programming. I wouldn’t
    be half the rugged indoorsman/scholar/warrior I am today without them both :P


    On the publishing side, writing the words you see here is the easy part. Getting
    the book into your hands is an amazingly complex process. The more I learn about
    all the moving pieces involved, the more impressed I am at all the individuals
