    )\n);\n```\n\nWhat we have done is create a new component called `HelloWorld`.\
    \ This `HelloWorld` component doesn’t do anything right now. In fact, it is basically\
    \ an empty JavaScript object at this point. Inside this object, you can put all\
    \ sorts of properties to further define what `HelloWorld` does. Some properties\
    \ you define are special and used by React to help your components work their\
    \ magic. One such mandatory property is `render`.\n\nGo ahead and modify our `HelloWorld`\
    \ component by adding a `render` property as shown in the following:\n\n[Click\
    \ here to view code image](#part0029.xhtml_p030pro03)\n\n```javascript\nvar HelloWorld\
    \ = React.createClass({\n  render: function() { \n  }\n});\n```\n\nJust like the\
    \ `render` method of we saw a few moments earlier as part of `ReactDOM.render`,\
    \ the `render` method inside a component is also responsible for dealing with\
    \ JSX. Let’s modify our `render` method to return `Hello, componentized world!`,\
    \ so go ahead and add the following highlighted lines:\n\n[Click here to view\
    \ code image](#part0029.xhtml_p030pro04)\n\n```javascript\nvar HelloWorld = React.createClass({\n\
    \  render: function() {\n    return (\n      <p>Hello, componentized world!</p>\
    \ \n    );\n  }\n});\n```\n\nWhat we’ve done is told our `render` method to return\
    \ the JSX that represents our `Hello, componentized world!` text. All that remains\
    \ is to actually use this component. The way you use a component once you’ve defined\
    \ it is by calling it, and we are going to call it from our old friend, the `ReactDOM.render`\
    \ method:\n\n[Click here to view code image](#part0029.xhtml_p031pro01)\n\n```javascript\n\
    ReactDOM.render(\n  <HelloWorld/>, \n  document.querySelector(\"#container\")\n\
    );\n```\n\nThat isn’t a typo! The JSX we use for calling our `HelloWorld` component\
    \ is the very HTML-like `<HelloWorld/>`. If you preview your page in your browser,\
    \ you’ll see the text `Hello, componentized world!` showing up on your screen.\
    \ If you held your breath in suspense, you can relax.\n\nIf you have difficulty\
    \ relaxing after seeing the syntax we used for calling `HelloWorld`, stare at\
    \ the following circle for a few moments:\n\n![Image](Images/image0024.jpeg)\n\
    \nOk, back to reality. What we’ve done so far might seem crazy, but simply think\
    \ of your `<HelloWorld/>` component as a cool and new HTML tag whose functionality\
    \ you have full control over. This means you can do all sorts of HTML-ey things\
    \ to it.\n\nFor example, go ahead and modify our `ReactDOM.render` method to look\
    \ as follows:\n\n[Click here to view code image](#part0029.xhtml_p032pro01)\n\n\
    ```javascript\nReactDOM.render(\n  <div>\n    <HelloWorld/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nWe wrapped our call to the `HelloWorld` component inside\
    \ a `div` element, and if you preview this in your browser, everything still works.\
    \ Let’s go one step further! Instead of having just a single call to `HelloWorld`,\
    \ let’s make a bunch of calls. Modify our `ReactDOM.render` method to now look\
    \ as follows:\n\n[Click here to view code image](#part0029.xhtml_p032pro02)\n\n\
    ```javascript\nReactDOM.render(\n  <div>\n    <HelloWorld/>\n    <HelloWorld/>\n\
    \    <HelloWorld/>\n    <HelloWorld/>\n    <HelloWorld/>\n    <HelloWorld/>\n\
    \  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\nWhat you will\
    \ see now is a bunch of `Hello, componentized world!` text instances appear. Let’s\
    \ do one more thing before we move on to something shinier. Go back to our `HelloWorld`\
    \ component declaration, and change the text we return to the more traditional\
    \ `Hello, world!` value:\n\n[Click here to view code image](#part0029.xhtml_p032pro03)\n\
    \n```javascript\nvar HelloWorld = React.createClass({\n  render: function() {\n\
    \    return (\n      <p>Hello, world!</p>\n    );\n  }\n});\n```\n\nWhat we've\
    \ done...\n\n### Specifying Properties\n\nTo add properties to a component, there\
    \ are two parts you need to follow:\n\n#### First Part: Updating the Component\
    \ Definition\n\nRight now, our `HelloWorld` component is hard coded to always\
    \ send `Hello, world!`. To add properties, we need to change it by having `return`\
    \ the value passed in properties. Here is the modification we need:\n\n[Click\
    \ here to view code image](#part0029.xhtml_p033pro02)\n\n```javascript\nvar HelloWorld\
    \ = React.createClass({\n  render: function() {\n    return (\n      <p>Hello,\
    \ {this.props.greetTarget}!</p> \n    );\n  }\n});\n```\n\n#### Second Part: Modifying\
    \ the Component Call\n\nOnce you’ve updated the component definition, all that\
    \ remains is to pass in the property as part of the component call. That is done\
    \ by adding an attribute with the same name as our property, followed by the value\
    \ you want to pass in. In our example, that would involve modifying the `HelloWorld`\
    \ call with the `greetTarget` attribute and the value we want to give it.\n\n\
    [Click here to view code image](#part0029.xhtml_p034pro01)\n\n```javascript\n\
    ReactDOM.render(\n  <div>\n    <HelloWorld greetTarget=\"Batman\"/>\n    <HelloWorld\
    \ greetTarget=\"Iron Man\"/>\n    <HelloWorld greetTarget=\"Nicolas Cage\"/>\n\
    \    <HelloWorld greetTarget=\"Mega Man\"/>\n    <HelloWorld greetTarget=\"Bono\"\
    />\n    <HelloWorld greetTarget=\"Catwoman\"/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n"
