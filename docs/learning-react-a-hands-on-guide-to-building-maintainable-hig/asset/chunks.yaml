    \    };\n9     return (\n10      <p style={labelStyle}>666</p>\n11    );\n12 \
    \ }\n13 });\n```\n\nThe pattern of what we are doing should be routine by now.\
    \ We have a `style` object that we assign to what we return. We return is a `p`\
    \ element whose content is the string `666`. To have what we return ultimately\
    \ make it to our DOM, we need to call `Label` component via our `Card` component.\
    \ Go ahead and make the following change:\n\n[Click here to view code image](#part0031.xhtml_p062pro01)\n\
    \n```javascript\nvar Card = React.createClass({\n  render: function() {\n    var\
    \ cardStyle = {\n      height: 200,\n      width: 150,\n      padding: 0,\n  \
    \    backgroundColor: \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px #666)\"\
    ,\n      filter: \"drop-shadow(0px 0px #666)\"\n    };\n    return (\n      <div\
    \ style={cardStyle}>\n        <Square/>\n        <Label/>\n      </div>\n    );\n\
    \  }\n});\n```\n\nNotice that our `Label` component lives just under the `Square`\
    \ component we added to our `Card` component’s return function.\n"
