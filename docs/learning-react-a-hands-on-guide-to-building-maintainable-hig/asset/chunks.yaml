    ## About the Author


    `Kirupa Chinnathambi` has spent most of his life trying to teach others to love
    web development as much as he does.


    In 1999, before blogging was even a word, he started posting tutorials on `kirupa.com`.
    In the years since then, he has written hundreds of articles, written a few books
    (none as good as this one, of course!), and recorded a bunch of videos you can
    find on YouTube. When he isn’t writing or talking about web development, he spends
    his waking hours helping make the Web more awesome as a Program Manager in Microsoft.


    ## 1. Introducing React


    Ignoring for a moment that web apps today both look and feel nicer than they did
    back in the day, there is something even more fundamental that has changed. The
    way we architect and build web apps is very different now. To highlight this,
    let’s take a look at the app shown in [Figure 1-1](#part0008.xhtml_ch01fig01).


