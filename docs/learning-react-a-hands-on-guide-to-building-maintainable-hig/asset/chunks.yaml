    \ JavaScript。\n\n## 需要记住的 JSX 特性\n\n在我们处理 JSX 的过程中，你可能注意到我们遇到了一些关于你可以做和不能做什么的任意规则和例外。在这一节中，让我们把所有这些特性汇总在一起，也许我们还会遇到一些全新的特性！\n\
    \n### 你只能返回单个根节点\n\n这可能是我们遇到的第一个奇特殊性。在 JSX 中，你返回或渲染的内容不能由多个根元素组成：\n\n点击此处查看代码图像\n\
    \n```javascript\nReactDOM.render(\n  <Letter>B</Letter>\n  <Letter>E</Letter>\n\
    \  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n如果你想做类似这样的操作，你需要先将所有的元素封装在一个单个父元素中：\n\n点击此处查看代码图像\n\n\
    ```javascript\nReactDOM.render(\n  <div>\n    <Letter>A</Letter>\n    <Letter>E</Letter>\n\
    \    <Letter>I</Letter>\n    <Letter>O</Letter>\n    <Letter>U</Letter>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n当我们之前看它时，这似乎是一个奇怪的要求，但你可以把这归咎于\
    \ `createElement`。通过 `render` 和 `return` 函数，你最终返回的是单次 `createElement` 调用（这反过来可能包含许多嵌套的\
    \ `createElement` 调用）。这是我们早期的 JSX 转换为 JavaScript 样子：\n\n点击此处查看代码图像\n\n```javascript\n\
    ReactDOM.render(React.createElement(\n  \"div\",\n  null,\n  React.createElement(\n\
    \    Letter,\n    null,\n    \"A\"\n  ),\n  React.createElement(\n    Letter,\n\
    \    null,\n    \"E\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n\
    \    \"I\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n    \"O\"\n\
    \  ),\n  React.createElement(\n    Letter,\n    null,\n    \"U\"\n  )\n), document.querySelector(\"\
    #container\"));\n```\n\n拥有多个根元素会破坏函数返回值的方式以及 `createElement` 的工作，这就是为什么你只能指定一个返回（根）元素！知道这一点让你现在可以睡得更香了。\n\
    \n### 你不能指定内联 CSS\n\n正如我们在第四章 中看到的，JSX 中的 `style` 属性的行为与 HTML 中的 `style` 属性不同。在\
    \ HTML 中，你可以直接将 CSS 属性作为值指定在你的 `style` 属性上：\n\n点击此处查看代码图像\n\n```html\n<div style=\"\
    font-family:Arial;font-size:24px\">\n  <p>Blah!</p>\n</div>\n```\n\n在 JSX 中，`style`\
    \ 属性内部不能包含 CSS。相反，它需要引用一个包含样式的对象：\n\n点击此处查看代码图像\n\n```javascript\nvar Letter =\
    \ React.createClass({\n  render: function() {\n    var letterStyle = {\n     \
    \ padding: 10,\n      margin: 10,\n      backgroundColor: this.props.bgcolor,\n\
    \      color: \"#333\",\n      display: \"inline-block\",\n      fontFamily: \"\
    monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\n    };\n \
    \   return (\n      <div style={letterStyle}>\n        {this.props.children}\n\
    \      </div>\n    );\n  }\n});\n```\n\n注意，我们有一个名为 `letterStyle` 的对象，它包含了所有的 CSS\
    \ 属性（驼峰形式）以及它们的值。那个对象就是我们随后引用的。\n\n### JSX 的特殊性\n\n由于我们一直在使用 JSX，你可能注意到我们遇到了一些关于你可以做和不能做什么的任意规则和例外。在这一节中，让我们把所有这些特性汇总在一起，也许我们还会遇到一些全新的特性！\n\
    \n（注：此处原文文本似乎存在重复或逻辑混乱，翻译已根据语意对齐）\n\n### 保留字\n\nJavaScript 有许多不能作为标识符的保留字。在编写\
    \ JSX 时，要小心不要使用像 `class` 这样常用的关键字作为标识符。由于 JavaScript 对 `class` 的保留，请看以下：\n\n点击此处查看代码图像\n\
    \n```javascript\nReactDOM.render(\n  <div class=\"slideIn\">\n    <p class=\"\
    emphasis\">Gabagool!</p>\n    <Letter/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n由于 JavaScript 对 `class` 的保留，你需要使用 `className` 来替代它：\n\
    \n点击此处查看代码图像\n\n```javascript\nReactDOM.render(\n  <div className=\"slideIn\"\
    >\n    <p className=\"emphasis\">Gabagool!</p>\n    <Letter/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n### 注释\n\n就像在 HTML、CSS 和 和 JavaScript 中注释注释一样，在 中 中\
    \ 中注释注释主主意。在 中 中 中指定注释的方式与在 JavaScript 中注释非常相似（[`www.kirupa.com/html5/comments.htm`](https://www.kirupa.com/html5/comments.htm)）……除了一个例外。如果你在标签内作为子元素指定注释，你需要用\
    \ `{` 和 `}` 大括号包裹住你的注释，以确保它被解析为表达式：\n\n点击此处查看代码图像\n\n```javascript\nReactDOM.render(\n\
    \  <div className=\"slideIn\">\n    <p className=\"emphasis\">Gabagool!</p>\n\
    \    {/* 我是一个子注释 */}\n    <Letter/>\n  </div>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\n"
