    \ The Label Component\n\nThe last component that remains is our `Label`. Go ahead\
    \ and make the following highlighted changes:\n\n[Click here to view code image](#part0031.xhtml_p061pro01)\n\
    \n```javascript\n1 var Label = React.createClass({\n2   render: function() {\n\
    3     var labelStyle = {\n4           fontFamily: \"sans-serif\",\n5         \
