    \ 组件和 `App` 组件一起被显示。通过嵌套路由并遵循路由匹配（[`github.com/reactjs/react-router/blob/master/docs/RouteMatching.md`](https://github.com/reactjs/react-router/blob/master/docs/RouteMatching.md)），你可以根据\
    \ URL 布局显示不同的视图。\n\n### 创建激活链接\n\n我们最后要处理的是一项极大提高我们应用程序易用性的工作。根据你当前处于哪个页面，我们将为该链接设置蓝色背景。例如，图\
