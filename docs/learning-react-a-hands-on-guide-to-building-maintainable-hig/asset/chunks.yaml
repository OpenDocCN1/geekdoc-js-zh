    ### Conclusion


    By now, we’ve covered a good chunk of the cool functionality React Router has
    for helping you build your single-page apps. This doesn’t mean that there aren’t
    more interesting things for you to take advantage of. Our app was pretty simple
    with very modest demands on what routing functionality we needed to implement.
    There is a whole lot more that React Router provides, so if you are building a
    more complex single-page app than what we’ve looked at so far, you should totally
    spend an afternoon taking a look the full React Router documentation ([https://github.com/reactjs/react-router/](https://github.com/reactjs/react-router/))
    and examples.


    ## 14. Building a Todo List App


    If creating the **Hello, World!** example was a celebration of you getting your
    feet wet with React, creating the quintessential Todo List app is a celebration
    of you approaching React mastery! In this chapter, we tie together a lot of the
    concepts and techniques you’ve learned to create something that works as follows:
    [https://www.kirupa.com/react/examples/todo.htm](https://www.kirupa.com/react/examples/todo.htm)


    You start off with a blank app that allows you to enter tasks for later (see [Figure
    14-1](#part0021.xhtml_ch14fig01)).


    ![Image](Images/image00293.jpeg)


    Figure 14-1 A blank app with task entry.


    The way this Todo List app works is pretty simple. Type in a task or whatever
    you want into the text field and press Add (or hit Enter/Return). Once you’ve
    submitted your task, you will see it appear as an entry. You can keep adding tasks
    to add additional entries and have them all show up (see [Figure 14-2](#part0021.xhtml_ch14fig02)).


    ![Image](Images/image00294.jpeg)


    Figure 14-2 You can add tasks and have them show up.


    Pretty simple, right? In the following sections, we build this app from scratch
    and learn (in awesomely painstaking detail) how things work along the way.


