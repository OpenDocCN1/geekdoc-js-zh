    \ highlighted change:\n\n[Click here to view code image](#part0031.xhtml_p059pro01)\n\
    \n```javascript\n1 ReactDOM.render(\n2   <div>\n3     <Card/>\n4   </div>,\n5\
    \   document.querySelector(\"#container\")\n6 );\n```\n\nAll we are doing is telling\
    \ the `ReactDOM.render` function to render the output of our `Card` component\
    \ by invoking it. If everything worked out properly, you’ll see the same thing\
    \ as in [Figure 5-9](#part0012.xhtml_ch05fig09) if you test your app.\n\n![Image](Images/image00257.jpeg)\n\
