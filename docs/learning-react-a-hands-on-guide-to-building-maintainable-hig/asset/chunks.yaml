  trans: "\n\n如果你觉得上一部分已经够棘手了，等看到我们这里的内容吧。并不是所有的 DOM 事件都有对应的 `SyntheticEvent`（合成事件）。看起来似乎在\
    \ JSX 中内联指定事件时，你只需要添加 `on` 前缀并将你正在监听的事件首字母大写即可：\n\n点击此处查看代码图片\n\n```javascript\n\
    var Something = React.createClass({\n  handleMyEvent: function(e) {\n    // do\
    \ something\n  },\n  render: function() {\n      return (\n        <div onMyWeirdEvent={this.handleMyEvent}>Hello!</div>\n\
    \      );\n    }\n});\n```\n\n事实并不是这样运作的！对于那些 React 官方未识别的事件，你必须使用传统的 `addEventListener`\
    \ 方法，并且需要经历一些额外的步骤。\n\n请看下面的代码部分：\n\n点击此处查看代码图片\n\n```javascript\nvar Something\
    \ = React.createClass({\n  handleMyEvent: function(e) {\n    // do something\n\
    \  },\n  componentDidMount: function() {\n    window.addEventListener(\"someEvent\"\
    , this.handleMyEvent);\n  },\n  componentWillUnmount: function() {\n    window.removeEventListener(\"\
    someEvent\", this.handleMyEvent);\n  },\n  render: function() {\n      return\
    \ (\n        <div>Hello!</div>\n      );\n    }\n});\n```\n\n我们这里处有一个名为 `Something`\
    \ 的组件，它监听一个名为 `someEvent` 的事件。我们在 `componentDidMount` 方法开始监听该事件，该方法会在组件渲染时被自动调用。我们监听事件的方式是使用\
    \ `addEventListener` 并指定事件类型以及要调用的事件处理器：\n\n点击此处查看代码图片\n\n```javascript\nvar Something\
    \ = React.createClass({\n  handleMyEvent: function(e) {\n    // do something\n\
    \  },\n  componentDidMount: function() {                                     \
    \       \n    window.addEventListener(\"someEvent\", this.handleMyEvent); \n \
    \ },                                                                         \n\
    \  componentWillUnmount: function() {\n    window.removeEventListener(\"someEvent\"\
    , this.handleMyEvent);\n  },\n  render: function() {\n      return (\n       \
    \ <div>Hello!</div>\n      );\n    }\n});\n```\n\n这应该非常直观。你唯一还需要记住的一件事是在组件即将被销毁时移除事件监听器。要做到这一点，你可以使用\
    \ `componentDidMount` 方法的反相反方法——`componentWillUnmount` 方法。在该方法内部放置你的 `removeEventListener`\
    \ 调用，以确保在组件消失后不会留下任何事件监听的痕迹。\n\n#### 事件处理器内部 `this` 的含义\n\n在 React 中处理事件时，事件处理器内部\
    \ `this` 的值与你通常在非 React DOM 世界中看到的不同。在非 React 世界中，事件处理器内部 `this` 的值指的是事件所监听的那个元素：\n\
    \n点击此处查看代码图片\n\n```javascript\nfunction doSomething(e) {\n  console.log(this);\
    \ //button element\n}\n\nvar foo = document.querySelector(\"button\");\n\nfoo.addEventListener(\"\
    click\", doSomething, false);\n```\n\n在 React 世界中（当使用 `React.createClass` 创建组件时），事件处理器内部\
    \ `this` 的值始终指向*事件处理器所在的的组件*：\n\n点击此处查看代码图片\n\n```javascript\nvar Counter = React.createClass({\n\
    \  getInitialState: function() {\n    return {\n      count: 0\n    };\n  },\n\
    \  increase: function(e) {\n    console.log(this);\n    this.setState({\n    \
    \  count: this.state.count + 1\n    });\n  },\n  render: function() {\n    return\
    \ (\n      <button onClick={this.increase}>\n        Count: {this.state.count}\n\
    \      </button>\n    );\n  }\n});\n```\n\n"
- fmt: "\nLifecycle methods are not very complicated. We can think of them as glorified\
    \ event handlers that get called at various points in a component’s life, and\
    \ just like event handlers, you can write some code to do things at those various\
    \ points. Before we go further, it is time for you to quickly meet our lifecycle\
    \ methods. They are:\n\n![Image](Images/image00226.jpeg) `componentWillMount`\n\
    ![Image](Images/image00226.jpeg) `componentDidMount`\n![Image](Images/image00226.jpeg)\
    \ `componentWillUnmount`\n![Image](Images/image00226.jpeg) `componentWillUpdate`\n\
    ![Image](Images/image00226.jpeg) `componentDidUpdate`\n![Image](Images/image00226.jpeg)\
    \ `shouldComponentUpdate`\n![Image](Images/image00226.jpeg) `componentWillReceiveProps`\n\
    \nWe aren’t quite done yet. There are three more methods that we are going to\
    \ throw into the mix even though they aren’t strictly lifecycle methods, and they\
    \ are:\n\n![Image](Images/image00226.jpeg) `getInitialState`\n![Image](Images/image00226.jpeg)\
    \ `getDefaultProps`\n![Image](Images/image00226.jpeg) `render`\n\nSome of these\
    \ names probably sound familiar to you, and some you are probably seeing for the\
    \ first time. Don’t worry. By the end of all this, you’ll be on a first name basis\
    \ with all of them! What we are going to do is look at these lifecycle methods\
    \ from various angles—starting with some code!\n\n## See the Lifecycle Methods\
    \ in Action\n\nLearning about these lifecycle methods is about as exciting as\
    \ memorizing names for foreign places (or distant star systems!) you have no plans\
    \ to visit. To help make all of this more bearable, I am going to first have you\
    \ play with them through a simple example before we get all academic and read\
    \ about them.\n\nTo play with this example, go to the following URL: [https://www.kirupa.com/react/lifecycle_example.htm](https://www.kirupa.com/react/lifecycle_example.htm)\
    \ Once this page loads, you’ll see a variation of the counter example we saw earlier\
    \ (see [Figure 11-1](#part0018.xhtml_ch11fig01)).\n\n![Image](Images/image00277.jpeg)\n\
    Figure 11-1 A variation on the counter example.\n\nDon’t click on the button or\
    \ anything just yet. If you have already clicked on the button, just refresh the\
    \ page to start the example from the beginning. There is a reason why I am saying\
    \ that, and it isn’t because my OCD is acting up :P We want to see this page as\
    \ it is before we interact with it!\n\nNow, bring up your browser’s developer\
    \ tools and take a look at the `Console` tab. In Chrome, you’ll see something\
    \ that looks like [Figure 11-2](#part0018.xhtml_ch11fig02).\n\n![Image](Images/image00278.jpeg)\n\
    Figure 11-2 The Console view in Chrome.\n\nNotice what you see printed. You will\
    \ see some messages, and these messages start out with the name of what looks\
    \ like a lifecycle method. If you click on the plus button once, notice that your\
    \ `Console` will show more lifecycle methods getting called (see [Figure 11-3](#part0018.xhtml_ch11fig03)).\n\
    \n![Image](Images/image00279.jpeg)\nFigure 11-3 More lifecycle methods getting\
    \ called.\n\nPlay with this example for a bit. What this example does is allow\
    \ you to place all of these lifecycle methods in the context of a component that\
    \ we’ve already seen earlier. As you keep hitting the plus button, more lifecycle\
    \ method entries will show up. Eventually, once your counter approaches a value\
    \ of 5, your example will just disappear with the following entry showing up in\
    \ your console: `componentWillUnmount: Component is about to be removed from the\
    \ DOM!` At this point, you have reached the end of this example. Of course, to\
    \ start over, you can just refresh the page!\n\nNow that you’ve seen the example,\
    \ let’s take a quick look at the component that is responsible for all of this:\n\
    \n[Click here to view code image](#part0037.xhtml_p126pro01)\n\n```javascript\n\
