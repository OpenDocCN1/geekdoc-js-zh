    ></script>\n</body>\n</html>\n```\n\n在添加了这些内容后，请务必保存文件。现在说说这些内容，我们的标记非常简单。文档主体只是一个\
    \ `id` 值为 `container` 的空 `div` 元素，以及一个 `script` 标签，该标签指向 `output` 文件夹内生成的最终 JavaScript\
    \ 文件 `myCode.js`：\n\n点击此处查看代码图片\n\n```html\n<script src=\"output/myCode.js\"></script>\n\
    ```\n\n除了这两点之外，我们的 HTML 文件并没有太多特殊之处。如果现在我们要将所有内容的关系可视化，它看起来有点像图 15-6。\n\n![Image](img/image00306.jpeg)\n\
    \n图 15-6 你当前的项目结构看起来如下。\n\n我在 `output` 文件夹中的 `myCode.js` 文件处画了一条虚线，因为该文件目前还不存在。我们正在\
    \ HTML 中指向一个目前不存在的内容，但这种情况不会持续多久。\n\n### 安装和初始化 Node.js\n\n我们的下一步是安装 Node.js。访问\
    \ Node.js 官方网站（[`nodejs.org/`](https://nodejs.org/))）安装适用于你操作系统的版本（参见图 15-7）。\n\
    \n![Image](img/image00307.jpeg)\n\n图 15-7 Node.js 网站上的下载按钮。\n\n我倾向于始终安装最新版本，所以你也应该这样做。下载和安装过程并不特别有趣。一旦安装了\
    \ Node.js，启动终端（Mac）、命令提示符（Windows）或选择的相应工具，输入以下内容并按回车，以测试是否已正确安装：\n\n```\nnode\
    \ -v\n```\n\n如果一切运行正常，你将看到一个版本号，该版本通常对应你刚刚安装的 Node.js 版本。如果出于某种原因遇到错误，请遵循此处列出的故障排除步骤（[`github.com/npm/npm/wiki/Troubleshooting`](https://github.com/npm/npm/wiki/Troubleshooting)）。\n\
    \n接下来，我们要在 `MyTotallyAwesomeApp` 文件夹上初始化 Node.js。要此操作，首先使用终端或命令提示符导航到 `MyTotallyAwesomeApp`\
    \ 文件夹。在 OS X 上，它看起来像图 15-8 。\n\n![Image](img/image00308.jpeg)\n\n图 15-8 导航到 MyTotallyAwesomeApp\
    \ 文件夹。\n\n现在，输入以下内容来初始化 Node.js：\n\n```\nnpm init\n```\n\n这将启动一系列问题，帮助在我们的项目上设置\
    \ Node.js。第一个问题将要求你指定项目名称。按回车允许你指定已经为你选定的默认值。这都很好，但默认名称是我们的项目文件夹，即 `MyTotallyAwesomeApp`。如果你按回车，因为它包含大写字母，将会抛出错误（参见图\
    \ 15-9）。\n\n![Image](img/image00309.jpeg)\n\n图 15-9 我们的项目文件夹名称包含大写字母，触发了错误。\n\n\
    继续输入名称的小写版本 `mytotallyawesomeapp`。完成后，按回车。对于其余的问题，只需按回车接受所有默认值。这一切的最终结果是创建一个名为\
    \ `package.json` 的新文件，它将在你的 `MyTotallyAwesomeApp` 文件夹中创建（参见图 15-10）。\n\n![Image](img/image00310.jpeg)\n\
    \n图 15-10 package.json 文件出现在你的文件夹中。\n\n如果你在代码编辑器中打开 `package.json` 的内容，你将看到类似下面的内容：\n\
    \n点击此处查看代码图片\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\n不要太担心这个文件的内容，只需知道调用 `npm\
    \ init` 的结果之一是创建一个 `package.json` 文件，其中包含一些奇怪的属性和值，Node.js 完全知道如何处理它们。\n\n###\
    \ 安装 React 依赖\n\n我们接下来的要做的是安装 React 依赖，以便我们就可以在代码中使用 React 和 React DOM 库。如果你来自纯\
    \ Web 开发背景，这是关键。如果现在我们要将所有内容的关系可视化，它看起来有点像图 15-6。\n\n![Image](img/image00306.jpeg)\n\
    \n图 15-6 你当前的项目结构看起来如下。\n\n我在 `output` 文件夹中的 `myCode.js` 文件处画了一条虚线，因为该文件目前还不存在。我们正在\
    \ HTML 中指向一个目前不存在的内容，但这种情况不会持续多久。\n\n我们接下来的要做的是安装 React 依赖，以便我们就可以在代码中使用 React\
    \ 和 React DOM 库。如果你来自纯 Web 开发背景，这是关键。\n\n在你的终端或命令提示符中，输入以下内容：\n\n```\nnpm install\
    \ react-dom --save\n```\n\n### 添加我们的 JSX 文件\n\n事情将变得有趣了。现在我们已经告诉了 Node.js 我们所有的兴趣，我们构建应用又近了一步。在我们的\
    \ `dev` 文件夹中，使用代码编辑器创建一个名为 `index.jsx` 的文件，内容如下：\n\n点击此处查看代码图片\n\n```javascript\n\
    import React from \"react\";\nimport ReactDOM from \"react-dom\";\n\nvar HelloWorld\
    \ = React.createClass({\n  render: function() {\n    return (\n      <p>Hello,\
    \ {this.props.greetTarget}!</p>\n    );\n  }\n});\n\nReactDOM.render(\n  <<div>\n\
    \    <HelloWorld greetTarget=\"Batman\"/>\n    <HelloWorld greetTarget=\"Iron\
    \ Man\"/>\n    <HelloWorld greetTarget=\"Nicolas Cage\"/>\n    <HelloWorld greetTarget=\"\
    Mega Man\"/>\n    <HelloWorld greetTarget=\"Bono\"/>\n    <HelloWorld greetTarget=\"\
    Catwoman\"/>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n"
- fmt: "\n# Going from JSX to JavaScript\n\nThe missing step right now is turning\
    \ our JSX into JavaScript that our browser can understand. This involves both\
    \ `webpack` and `Babel`, and we are going to configure both of them to make this\
    \ all work.\n\n## Setting up webpack\n\nSince we are in Node.js territory and\
    \ both `webpack` and `Babel` exist as Node packages, we need to install them both\
    \ just like we installed the React-related packages.\n\nTo install `webpack`,\
    \ enter the following in your Terminal / Command Prompt:\n\n```\nnpm install webpack\
    \ --save\n```\n\nThis will take a few moments while the `webpack` package (and\
    \ its large list of dependencies) gets downloaded and placed into our `node_modules`\
    \ folder. After you’ve done this, we need to add a configuration file to specify\
    \ how `webpack` will work with our current project. Using your code editor, add\
    \ a file called `webpack.config.js` inside our `MyTotallyAwesomeApp` folder (see\
    \ [Figure 15-13](#part0022.xhtml_ch15fig13)).\n\n![Image](Images/image0031.jpeg)\n\
    \nFigure 15-13 Adding webpack.config.js.\n\nInside this file, we will specify\
    \ a bunch of JavaScript properties to define where our original, unmodified source\
    \ files live and where to output the final source files. Go ahead and add the\
    \ following JavaScript into `webpack.config.js`:\n\n```javascript\nvar webpack\
    \ = require(\"webpack\");\nvar path = require(\"path\");\nvar DEV = path.resolve(__dirname,\
    \ \"dev\");\nvar OUTPUT = path.resolve(__dirname, \"output\");\nvar config = {\n\
    \  entry: DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename:\
    \ \"myCode.js\"\n  }\n};\nmodule.exports = config;\n```\n\nTake a few moments\
    \ to see what this code is doing. We defined two variables called `DEV` and `OUTPUT`\
    \ that refer to folders of the same name in our project. Inside the `config` object,\
    \ we have two properties called `entry` and `output` that use our `DEV` and `OUTPUT`\
    \ variables to help map our `index.jsx` file to become `myCode.js`.\n\n## Setting\
    \ up Babel\n\nThe last piece in our current setup is to transform our `index.jsx`\
    \ file to become regular JavaScript in the form of `myCode.js`. This is where\
    \ Babel comes in. To install Babel, let’s go back to our trusty Terminal / Command\
    \ Prompt and enter the following Node.js command:\n\n```\nnpm install babel-loader\
    \ babel-preset-es2015 babel-preset-react --save\n```\n\nWith this command, we\
    \ install the `babel-loader`, `babel-preset-es2015`, and `babel-preset-react`\
    \ packages. Now we need to configure Babel to work with our project. This is a\
    \ two-step process.\n\nThe first step is to specify which Babel presets we want\
    \ to use. There are several ways of doing this, but my preferred way is to modify\
    \ `package.json` and add the following highlighted content:\n\n```json\n{\n  \"\
    name\": \"mytotallyawesomeapp\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
    Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\"\
    : \"ISC\",\n  \"dependencies\": {\n    \"babel-loader\": \"^6.2.4\",\n    \"babel-preset-es2015\"\
    : \"^6.9.0\",\n    \"babel-preset-react\": \"^6.5.0\",\n    \"react\": \"^15.1.0\"\
    ,\n    \"react-dom\": \"^15.1.0\",\n    \"webpack\": \"^1.13.1\"\n  },\n  \"babel\"\
    : {      \n    \"presets\": [      \n      \"es2015\",  \n      \"react\"    \
    \ \n    ]              \n  }              \n}\n```\n\nIn the highlighted lines,\
    \ we specify our `babel` object and specify the `es2015` and `react` preset values.\n\
    \nThe second step is to tell webpack about Babel. In our `webpack.config.js` file,\
    \ go ahead and add the following highlighted lines:\n\n```javascript\nvar webpack\
    \ = require(\"webpack\");\nvar path = require(\"path\");\nvar DEV = path.resolve(__dirname,\
    \ \"Dev\");\nvar OUTPUT = path.resolve(__dirname, \"output\");\nvar config = {\n\
    \  entry: DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename:\
    \ \"myCode.js\"\n  },\n  module: {\n    loaders: [{\n      include: DEV,\n   \
    \   loader: \"babel\"\n    }]\n  }\n};\nmodule.exports = config;\n```\n\nWe added\
    \ the `module` and `loaders` objects that tell `webpack` to pass the `index.jsx`\
    \ file defined in our `entry` property to turn into JavaScript through Babel.\
    \ With this change, we’ve pretty much gotten our development environment for building\
    \ React app.\n\n### Building and Testing Our App\n\nThe last (and hopefully most\
    \ satisfying) step in all of this is building our app and having end-to-end workflow\
    \ work. To build our app, what you type varies whether you are on the Terminal\
    \ or Command Prompt.\n\nFor the Terminal on the Mac, enter the following:\n\n\
    ```\n./node_modules/.bin/webpack\n```\n\nIn the Command Prompt on Windows, enter\
    \ this instead:\n\n```\nnode_modules\\.bin\\webpack\n```\n\nThis command runs\
    \ `webpack` and does all the things we’ve specified in our `webpack.config.js`\
    \ and `package.json` configuration files. Your output in your Terminal / Command\
    \ Prompt will look like [Figure 15-14](#part0022.xhtml_ch15fig14).\n\n![Image](Images/image0014.jpeg)\n\
    \nFigure 15-14 The webpack output.\n\nBesides seeing something that vaguely looks\
    \ like a successful build in cryptic text, go to your `MyAwesomeApp` folder. Open\
    \ your `index.html` file in your browser. If everything was set up properly, you’ll\
    \ see our simple app displaying (see [Figure 15-15](#part0022.xhtml_ch15fig15)).\n\
    \n![Image](Images/image0015.jpeg)\n\nFigure 15-15 The simple app displaying.\n\
    \nIf you venture into the `Output` folder and look at `myCode.js`, you’ll see\
    \ a fairly hefty (~700Kb) file with a lot of JavaScript made up of the relevant\
    \ React, `ReactDOM`, and your app code all organized there.\n\nFrom this point,\
    \ you can build your app, add new assets, and make the typical changes you normally\
    \ would. The only difference between what we had been doing throughout this book\
    \ and what we are doing now is simple—what your browser cares about is generated\
    \ for you by the various build tools and packager. Your browser is no longer taking\
    \ all of this React/ES6/etc. stuff and converting it into normal HTML/CSS/JS on\
    \ the fly during page load.\n\n### Conclusion\n\nWell...that just happened! In\
    \ the preceding many sections, we followed a bunch of bizarre and incomprehensible\
    \ steps to get our build environment set up to build our React app. What we’ve\
    \ seen is just a very small part of everything you can do when you put Node, `Babel`,\
    \ and `webpack` together. The unfortunate thing is that covering all of that goes\
    \ well beyond the scope of learning React, but if you are interested in this,\
    \ you should definitely invest time in learning the ins and outs of all of these\
    \ build tools. There are a lot of cool things you can do.\n\nFor more information\
    \ on those cool things, check out the following links:\n\n![Image](Images/image00226.jpeg)\
    \ Babel: [https://babeljs.io/](https://babeljs.io/)\n\n![Image](Images/image00226.jpeg)\
    \ npm Documentation: [https://docs.npmjs.com/](https://docs.npmjs.com/)\n\n![Image](Images/image00226.jpeg)\
    \ webpack module bundler: [https://webpack.github.io/](https://webpack.github.io/)\n\
    \n![Image](Images/image00226.jpeg) React Tooling Integration: [https://facebook.github.io/react/docs/tooling-integration.html](https://facebook.github.io/react/docs/tooling-integration.html)\n\
    \n![Image](Images/image00226.jpeg) Bower: [https://bower.io/](https://bower.io/)\n\
    \n## 16. The End\n\nSo...here we are. After 15 chapters, we’ve covered a lot of\
    \ ground when it comes to learning how to use React to build cool things. A while\
    \ ago, we started off by discussing the problems associated with building complex\
    \ UIs and how React was going to make that a breeze. Hopefully in the chapters\
    \ since, you got a really good idea of how you can use React to accomplish this.\n"
  raw: '#### Going from JSX to JavaScript


    The missing step right now is turning our JSX into JavaScript that our browser
    can understand. This involves both webpack and Babel, and we are going to configure
    both of them to make this all work.


    ##### Setting up webpack


    Since we are in Node.js territory and both webpack and Babel exist as Node packages,
    we need to install them both just like we installed the React-related packages.


    To install webpack, enter the following in your Terminal / Command Prompt:


    npm install webpack --save


    This will take a few moments while the webpack package (and its large list of
    dependencies) gets downloaded and placed into our **node_modules** folder. After
    you’ve done this, we need to add a configuration file to specify how webpack will
    work with our current project. Using your code editor, add a file called **webpack.config.js**
    inside our **MyTotallyAwesomeApp** folder (see [Figure 15-13](#part0022.xhtml_ch15fig13)).


    ![Image](Images/image00313.jpeg)


    Figure 15-13 Adding webpack.config.js.


    Inside this file, we will specify a bunch of JavaScript properties to define where
    our original, unmodified source files live and where to output the final source
    files. Go ahead and add the following JavaScript into webpack.config.js:


    [Click here to view code image](#part0041.xhtml_p195pro01)


    var webpack = require("webpack");


    var path = require("path");


    var DEV = path.resolve(__dirname, "dev");


    var OUTPUT = path.resolve(__dirname, "output");


    var config = {


      entry: DEV + "/index.jsx",


      output: {


        path: OUTPUT,


        filename: "myCode.js"


      }


    };


    module.exports = config;


    Take a few moments to see what this code is doing. We defined two variables called
    `DEV` and `OUTPUT` that refer to folders of the same name in our project. Inside
    the config object, we have two properties called `entry` and `output` that use
    our `DEV` and `OUTPUT` variables to help map our **index.jsx** file to become
    **myCode.js**.


    ##### Setting up Babel


    The last piece in our current setup is to transform our **index.jsx** file to
    become regular JavaScript in the form of **myCode.js**. This is where Babel comes
    in. To install Babel, let’s go back to our trusty Terminal / Command Prompt and
    enter the following Node.js command:


    [Click here to view code image](#part0041.xhtml_p195pro02)


    npm install babel-loader babel-preset-es2015 babel-preset-react --save


    With this command, we install the **babel-loader**, **babel-preset-es2015**, and
    **babel-preset-react** packages. Now we need to configure Babel to work with our
    project. This is a two-step process.


    The first step is to specify which Babel presets we want to use. There are several
    ways of doing this, but my preferred way is to modify **package.json** and add
    the following highlighted content:


    [Click here to view code image](#part0041.xhtml_p195pro03)


    {


      "name": "mytotallyawesomeapp",


      "version": "1.0.0",


      "description": "",


      "main": "index.js",


      "scripts": {


        "test": "echo \"Error: no test specified\" && exit 1"


      },


      "author": "",


      "license": "ISC",


      "dependencies": {


        "babel-loader": "^6.2.4",


        "babel-preset-es2015": "^6.9.0",


        "babel-preset-react": "^6.5.0",


        "react": "^15.1.0",


        "react-dom": "^15.1.0",


        "webpack": "^1.13.1"


      },


      "babel": {     


        "presets": [ 


          "es2015",  


          "react"    


        ]            


      }              


    }


    In the highlighted lines, we specify our `babel` object and specify the **es2015**
    and **react** preset values.


    The second step is to tell webpack about Babel. In our **webpack.config.js** file,
    go ahead and add the following highlighted lines:


    [Click here to view code image](#part0041.xhtml_p196pro01)


    var webpack = require("webpack");


    var path = require("path");


    var DEV = path.resolve(__dirname, "Dev");


    var OUTPUT = path.resolve(__dirname, "output");


    var config = {


      entry: DEV + "/index.jsx",


      output: {


        path: OUTPUT,


        filename: "myCode.js"


      },


      module: {              


        loaders: [{          


            include: DEV,    


            loader: "babel", 


        }]                   


      }                      


    };


    module.exports = config;


    We added the module and loaders objects that tell webpack to pass the **index.jsx**
    file defined in our entry property to turn into JavaScript through Babel. With
    this change, we’ve pretty much gotten our development environment setup for building
    a React app.


    #### Building and Testing Our App


    The last (and hopefully most satisfying) step in all of this is building our app
    and having the end-to-end workflow work. To build our app, what you type varies
    on whether you are on the Terminal or on the Command Prompt.


    For the Terminal on the Mac, enter the following:


    ./node_modules/.bin/webpack


    In the Command Prompt on Windows, enter this instead:


    node_modules\.bin\webpack.cmd


    This command runs webpack and does all the things we’ve specified in our **webpack.config.js**
    and **package.json** configuration files. Your output in your Terminal / Command
    Prompt will look something like [Figure 15-14](#part0022.xhtml_ch15fig14).


    ![Image](Images/image00314.jpeg)


    Figure 15-14 The webpack output.


    Besides seeing something that vaguely looks like a successful build displayed
    in cryptic text form, go to your **MyTotallyAwesomeApp** folder. Open your **index.html**
    file in your browser. If everything was set up properly, you’ll see our simple
    React app displaying (see [Figure 15-15](#part0022.xhtml_ch15fig15)).


    ![Image](Images/image00315.jpeg)


    Figure 15-15 The simple React app displaying.


    If you venture into the **Output** folder and look at **myCode.js**, you’ll see
    a fairly hefty (~700Kb) file with a lot of JavaScript made up of the relevant
    React, ReactDOM, and your app code all organized there.


    From this point, you can build your app, add new assets, and make the typical
    changes you normally would. The only difference between what we had been doing
    throughout this book and what we are doing now is simple—what your browser cares
    about is generated for you by the various build tools and packager. Your browser
    is no longer taking all of this React JSX/ES6/etc. stuff and converting it into
    normal HTML/CSS/JS on the fly during page load.


    ### Conclusion


    Well...that just happened! In the preceding many sections, we followed a bunch
    of bizarre and incomprehensible steps to get our build environment set up to build
    our React app. What we’ve seen is just a very small part of everything you can
    do when you put Node, Babel, and webpack together. The unfortunate thing is that
    covering all of that goes well beyond the scope of learning React, but if you
    are interested in this, you should definitely invest time in learning the ins
    and outs of all of these build tools. There are a lot of cool things you can do.


    For more information on those cool things, check out the following links:


    ![Image](Images/image00226.jpeg) Babel: [https://babeljs.io/](https://babeljs.io/)


    ![Image](Images/image00226.jpeg) npm Documentation: [https://docs.npmjs.com/](https://docs.npmjs.com/)


    ![Image](Images/image00226.jpeg) webpack module bundler: [https://webpack.github.io/](https://webpack.github.io/)


    ![Image](Images/image00226.jpeg) React Tooling Integration: [https://facebook.github.io/react/docs/tooling-integration.html](https://facebook.github.io/react/docs/tooling-integration.html)


    ![Image](Images/image00226.jpeg) Bower: [https://bower.io/](https://bower.io/)


    ## 16. The End


    So...here we are. After 15 chapters, we’ve covered a lot of ground when it comes
    to learning how to use React to build cool things. A while ago, we started off
    by discussing the problems associated with building complex UIs and how React
    was going to make that a breeze. Hopefully in the chapters since, you got a really
    good idea of how you can use React to accomplish this.'
