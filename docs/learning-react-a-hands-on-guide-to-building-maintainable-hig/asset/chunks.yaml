    the CSS for them will have kicked in), you won’t see anything new display. You
    will just see your Home content because that is all that we had specified earlier.
    With that said, you can see the URLs updating in the address bar. You’ll see your
    current page followed by a **#/contact**, **#/stuff**, or **#/** depending on
    which of the links you clicked. Oh, you’ll also see a random hash added after
    the URL. That is progress!


    #### Adding the Stuff and Contact Views


    Our app is slowly taking its final shape...or it will get really close by the
    time we are done with this section! What we are going to do next is define the
    components for our Stuff and Contact views that we linked to earlier. In your
    code just below where you have your `Home` component, go ahead and add in the
    following:


    [Click here to view code image](#part0039.xhtml_p157pro01)


    var Contact = React.createClass({


      render: function() {


          return (


            <div>


              <h2>GOT QUESTIONS?</h2>


              <p>The easiest thing to do is post on


              our <a href="http://forum.kirupa.com">forums</a>.


              </p>


            </div>


          );


        }


    });


    var Stuff = React.createClass({


      render: function() {


          return (


            <div>


              <h2>STUFF</h2>


              <p>Mauris sem velit, vehicula eget sodales vitae,


              rhoncus eget sapien:</p>


              <ol>


                <li>Nulla pulvinar diam</li>


                <li>Facilisis bibendum</li>


                <li>Vestibulum vulputate</li>


                <li>Eget erat</li>


                <li>Id porttitor</li>


              </ol>


            </div>


          );


        }


    });


    What we have just added are the `Stuff` and `Contact` components that simply render
    out HTML. All that remains is for us to update our routing configuration to include
    these two components and display them at the appropriate URL.


    In our `ReactDOM.render` method, go ahead and add the following two highlighted
    lines:


    [Click here to view code image](#part0039.xhtml_p157pro02)


    ReactDOM.render(


      <Router>


        <Route path="/" component={App}>


          <IndexRoute component={Home}/>


          <Route path="stuff" component={Stuff} />     


          <Route path="contact" component={Contact} /> 


        </Route>


      </Router>,


      destination


    );


    All we are doing here is updating our routing logic to display the `Stuff` component
    if the URL contains the word **stuff** and to display the `Contact` component
    if the URL contains the word **contact**. If you preview your page now, click
    on the Stuff and Contact links. If everything worked out fine, you’ll see these
    views get loaded inside our app frame when you navigate to them.


    * * *


    Note: A Little Bit About Route Matching


    Our route configuration is nothing more than a series of rules that determine
    what to do when a URL matches the conditions we have laid out. The fancy term
    for that is **route matching**. The heuristic React Router uses to match URLs
    is fully explained in the React Router documentation, but for our case, we have
    a simple nested route where you can have multiple things that can match at the
    same time. Our outer route matches if the URL contains **/**. Our inner routes
    then match if the URL happens to contain **stuff** or **contact.**


    What this means is simple. For each route that matches, the component that you
    specified to display will appear. When you are navigating to a page like **/stuff**,
    the `App` component will display because the **/** exists in the URL. The `Stuff`
    component then displays because the path for **stuff** is in the URL as well.
    That is why when we navigate to the Stuff or Contact pages, we see them in addition
    to our frame. You can have deeply nested routes as well.


    Take a look at the following configuration:


    [Click here to view code image](#part0039.xhtml_p158pro01)


    ReactDOM.render(


      <Router>


        <Route path="/" component={App}>


          <IndexRoute component={Home} />


          <Route path="stuff" component={Stuff}>


            <Route path="blah" component={MyBlah}/>


          </Route>


          <Route path="contact" component={Contact} />


        </Route>


      </Router>,


      destination);


    In this example, notice that our `Route` element whose path is **stuff** now contains
    a nested route for a path containing **blah**. This means if you happened to have
    a URL that is **/stuff/blah**, the `MyBlah` component will be displayed in addition
    to the Stuff component and the `App` component from the parent routes matching.


    By nesting routes and following the route matching rules ([https://github.com/reactjs/react-router/blob/master/docs/guides/RouteMatching.md](https://github.com/reactjs/react-router/blob/master/docs/guides/RouteMatching.md)),
    you can display custom views depending on a variety of URL arrangements you may
    expose in your app for your users to navigate to.


    * * *


    #### Creating Active Links


    The last thing we are going to tackle is something that greatly increases the
    usability of our app. Depending on which page you are currently displaying, we
    are going to highlight that link with a blue background. For example, [Figure
    13-6](#part0020.xhtml_ch13fig06) is what our app will look like when the Stuff
    content is being displayed.


    ![Image](Images/image00292.jpeg)


    Figure 13-6 The Stuff content.


    The way you accomplish this in React Router is by setting a prop called `activeClassName`
    on your `Link` instances with the name of the CSS class that will get set when
    that link is currently active. To make this happen, go back to your `App` component
    and make the highlighted changes:


    [Click here to view code image](#part0039.xhtml_p159pro01)


    var App = React.createClass({


      render: function() {


        return (


          <div>


            <h1>Simple SPA</h1>


            <ul className="header">


              <li><Link to="/" activeClassName="active">Home</Link></li>           


              <li><Link to="/stuff" activeClassName="active">Stuff</Link></li>     


              <li><Link to="/contact" activeClassName="active">Contact</Link></li> 


            </ul>


            <div className="content">


              {this.props.children}


            </div>


          </div>


        )


      }


    });


    We specify the `activeClassName` prop and set it to a value of **active**. This
    ensures that whenever a link is clicked (and its path becomes active), the link
    element’s `class` attribute at runtime gets set to a value of **active**. To ensure
    our active links are styled differently, go ahead and add the following CSS:


    .active {


      background-color: #0099FF;


    }


    If you preview your app now, click on any of the links. Notice that the active
    link (and the Home link) displays with a blue background. We aren’t done just
    yet, though. Our Home link is always highlighted. It should only be highlighted
    when we load our Home page for the first time or explicitly navigate to the Home
    link itself. To fix this, we need to change how we link to our Home content. Instead
    of specifying our Home content with a `Link` element, we are going to replace
    it with an `IndexLink` element instead.


    Go ahead and make this change:


    [Click here to view code image](#part0039.xhtml_p160pro01)


    var App = React.createClass({


      render: function() {


        return (


          <div>


            <h1>Simple SPA</h1>


            <ul className="header">


              <li><IndexLink to="/" activeClassName="active">Home</IndexLink></li> 


              <li><Link to="/stuff" activeClassName="active">Stuff</Link></li>


              <li><Link to="/contact" activeClassName="active">Contact</Link></li>'
