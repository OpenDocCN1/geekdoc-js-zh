  trans: "\n这个应用程序是一个用于浏览内容的目录浏览器。像任何此类应用一样，你拥有一套标准的页面，围绕着主页、搜索结果页、详情页等展开。在接下来的章节中，让我们来看看构建此应用的两种方法。是的，由于以某种神秘的方式，这让我们对\
    \ React 有了整体的了解！\n\n继续吧！\n\n## 老式多页设计\n\n如果你在几年前必须构建这个应用，你可能会采用涉及多个独立页面的方法。其流程看起来就像图\
    \ 1-2 所示。\n\n![Image](img/image00228.jpeg)\n\n图 1-2 多页设计。\n\n对于几乎每一个改变浏览器显示内容的动作，Web\
    \ 应用都会将你导航到一个`完全不同的页面`。除了用户在页面被销毁和重绘时会看到的不尽如意的用户体验外，这还是一个大问题。这对你如何维护应用状态有很大影响。除了通过\
    \ cookie 和服务器端机制存储一些用户数据之外，你根本不需要担心。生活很美妙。\n\n## 新式单页应用\n\n如今，采用一种需要在独立页面之间导航的\
    \ Web 应用模型似乎已经过时了……就像，真的过时了，就像图 1-3 所示。\n\n![Image](img/image00229.jpeg)\n\n图\
    \ 1-3 独立页面模型有点过时了——就像这台蒸汽机。\n\n来源：*New Catechism of the Steam Engine*，1904\n\n\
    相反，现代应用倾向于遵循所谓的`单页应用 (SPA) 模型`。在这个世界里，你永远不会导航到不同的页面，也永远不会加载页面。相反，应用的不同视图被加载并卸载到页面本身中。\n\
    \n对于我们的应用，这看起来可能像图 1-4。\n\n![Image](img/image00230.jpeg)\n\n图 1-4 单页应用。\n\n当用户与我们的应用交互时，我们用与用户尝试的操作匹配的数据和\
    \ HTML 替换虚线区域的内容。最终结果是更加流畅的体验。你甚至可以使用许多视觉技术让你的新内容平滑地过渡，就像你在移动设备或桌面上的酷应用中看到的那样。在导航到不同页面时，这种操作是是不可能的。\n\
    \n如果你以前没听过单页应用，这一切听起来可能有点疯狂，但你很有可能在现实中遇到过它们。如果你曾用过 Gmail、Facebook、Instagram 或\
    \ Twitter 等流行的 Web 应用，你使用的就是单页应用。在所有这些应用中，内容都是动态显示的，不需要你刷新或导航到不同的页面。\n\n现在，我让这些单页应用看起来真的非常复杂。事实并非`完全`如此。得益于\
    \ JavaScript 以及各种第三方框架和库的许多优秀改进，构建单页应用比任何时候都简单。不过，这并不意味着没有改进空间。\n\n在构建单页应用时，你会遇到三个主要问题：\n\
    \n![Image](img/image00226.jpeg) `在单页应用中，你的大部分时间将花在保持数据与 UI 同步上`。例如，如果用户加载了新内容，我们是否要显式地清除搜索字段？我们是否保持导航元素上的活动标签仍然可见？我们在页面上保留哪些元素，又销毁哪些元素？\n\
    \n这些都是单页应用特有的问题。在旧模型在页面之间导航时，我们只假设 UI 中的所有内容都会被销毁并重新构建。这从来不是问题。\n\n![Image](img/image00226.jpeg)\
    \ `操作 DOM 真的非常非常慢`。手动查询元素、添加子元素（见下方的图 1-5）、删除子树和执行其他 DOM 操作都是浏览器中可以执行的最慢的操作。不幸的是，在单页应用中，你会进行很多这类操作。操作\
    \ DOM 是你响应用户操作并显示新内容的主要方式。\n\n![Image](img/image00231.jpeg)\n\n图 1-5 添加子元素。\n\n\
    ![Image](img/image00226.jpeg) `处理 HTML 模板可能是一件痛苦的事`。单页应用中的导航无非是你处理 HTML 片段来表示你想要显示的任何内容。这些\
    \ HTML 片段通常被称为`模板`，而使用 JavaScript 操作它们并用数据填充它们变得非常复杂。\n\n更糟糕的是，取决于你所使用的框架，你的模板外观以及与数据交互的方式可能会有巨大差异。例如，这是在\
    \ Mustache 中使用模板的样子：\n\n点击此处查看代码图片\n\n```javascript\nvar view = {\n  title: \"\
    Joe\",\n  calc: function () {\n    return 2 + 4;\n  }\n};\n\nvar output = Mustache.render(\"\
    {{title}} spends {{calc}}\", view);\n```\n\n有时，你的模板可能看起来是整洁的 HTML，你可以自豪地展示它们。其他时候，你的模板可能是难以理解的，通过大量的自定义标签来映射你的数据。尽管有这些缺点，单页应用也不会消失。它们是现状，并将完全形成\
    \ Web 应用的未来。这意味着我们不需要忍受这些缺点。为了解决这个问题，请认识 React！\n\n## 认识 React\n\nFacebook 和 Instagram\
    \ 觉得够了。基于对单页应用的丰富经验，他们发布了一个名为 `React` 的库（见图 1-6），不仅为了解决这些缺点，还为了改变我们思考单页应用的方式。\n\
    \n![Image](img/image00232.jpeg)\n\n图 1-6 React 图标。\n\n在接下来的章节中，让我们来看看 React 带来的大优势。\n\
    \n### 自动 UI 状态管理\n\n单页应用中，跟踪 UI 并维护状态是困难且非常耗时的。有了 React，你只需要担心一件事：`你的 UI 的最终状态`。你的\
    \ UI 初始状态并不重要。用户为了更改 UI 可能采取的一系列步骤并不重要。重要的是 UI 最后停在哪里（见图 1-7）。\n\n![Image](img/image00233.jpeg)\n\
    \n图 1-7 在 React 中，UI 的最终或结束状态才是重要的。\n\nReact 处理所有其他事情。它找出确保 UI 被正确表示所需，所以所有的状态管理不再是你的问题。\n\
    \n#### 极速 DOM 操作\n\n由于 DOM 修改非常慢，你不再直接修改 DOM。相反，你修改内存中的`虚拟 DOM`。图 1-8 象征着那个内存中的虚拟\
    \ DOM。\n\n![Image](img/image00234.jpeg)\n\n图 1-8 想象一个内存中的虚拟 DOM。\n\n操作这个虚拟 DOM\
    \ 极快，React 会在合适时候更新真实 DOM。它通过比较虚拟 DOM 和真实 DOM 之间的变化来实现这一点，找出哪些更改是重要的，并进行最少的 DOM\
    \ 修改以保持一切更新，这个过程被称为`调和 (reconciliation)`”。\n\n#### 创建真正可组合 UI 的 API\n\nReact 不是将应用中的视觉元素视为一个单一的巨型区块，而是鼓励你将视觉元素拆分成更小的组件。\n"
- fmt: "\nJust like everything else in programming, it is a good idea to have things\
    \ be modular, compact, and self-contained. React extends that well-established\
    \ idea to how we should think about user interfaces as well. Many of React’s core\
    \ APIs make it easier to create smaller visual components that can later be combined\
    \ with other visual components to make larger and more complex visual components—kind\
    \ of like Russian Matryoshka dolls (see [Figure 1-9](#part0008.xhtml_ch01fig09)).\n\
    \n![Image](Images/image00235.jpeg)\n\nFigure 1-9 Russian Matryoshka dolls by Gnomz007.\n\
    \nSource: *[https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg](https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg)*\n\
    \nThis is one of the major ways React simplifies (and changes) how we think about\
    \ building the visuals for our web apps.\n\n## Visuals Defined Entirely in JavaScript\n\
    \nWhile this sounds ridiculously crazy and outrageous, hear me out. Besides using\
    \ a really weird syntax, HTML templates traditionally suffered from another major\
    \ problem. The variety of things you can do inside them other than simply displaying\
    \ data is limited. If you wanted to choose which piece of UI to display based\
    \ on a particular condition, for example, you had to write JavaScript somewhere\
    \ else in your app or use some weird framework-specific templating command to\
    \ make it work.\n\nFor example, here is what a conditional statement inside an\
    \ EmberJS template looks like:\n\n[Click here to view code image](#part0027.xhtml_p010pro01)\n\
    \n```html\n{{#if person}}\n\n  Welcome back, <b{{person.firstName}} {{person.lastName}}</b>!\n\
    \n{{else}}\n\n  Please log in.\n\n{{/if}}\n```\n\nWhat React does is pretty neat.\
    \ By having your UI defined entirely in JavaScript, you get to use all of the\
    \ rich functionality JavaScript provides for doing all sorts of things inside\
    \ your templates (as you will see in a few chapters). You are limited only by\
    \ what JavaScript supports as opposed to any limitations imposed by your templating\
    \ framework.\n\nNow, when you think of visuals defined entirely in JavaScript,\
    \ you are probably thinking something horrible involving quotation marks, escape\
    \ characters, and a whole lot of `createElement` calls. Don’t worry. React gives\
    \ you the option to specify your visuals using an HTML-like syntax known as `JSX`\
    \ that lives fully alongside your JavaScript. Instead of writing code to define\
    \ your UI, you are basically specifying markup:\n\n```javascript\nReactDOM.render(\n\
    \n  <div>                        \n\n          <h1>Batman</h1>        \n     \
    \     <h1>Iron Man</h1>      \n          <h1>Nicolas Cage</h1> \n          <h1>Mega\
    \ Man</h1>      \n  </div>,             \n  destination\n\n);\n```\n\nThis same\
    \ code defined in JavaScript would look like this:\n\n[Click here to view code\
    \ image](#part0027.xhtml_p010pro02)\n\n```javascript\nReactDOM.render(React.createElement(\n\
    \  \"div\",\n  null,\n  React.createElement(\n    \"h1\",\n    null,\n    \"Batman\"\
    \n  ),\n  React.createElement(\n    \"h1\",\n    null,\n    \"Iron Man\"\n  ),\n\
    \  React.createElement(\n    \"h1\",\n    null,\n    \"Nicolas Cage\"\n  ),\n\
    \  React.createElement(\n    \"h1\",\n    null,\n    \"Mega Man\"\n  )\n), destination);\n\
    ```\n\nYikes! By using `JSX`, you are able to define your visuals very easily\
    \ using a syntax that is very familiar, while still getting all the power and\
    \ flexibility that JavaScript provides. Best of all, in React, your visuals and\
    \ JavaScript often live in the same location. You no longer have to jump between\
    \ multiple files to define the look and behavior of one visual component. This\
    \ is templating done right.\n\n## Just the V in an MVC Architecture\n\nWe are\
    \ almost done here! React is not a full-fledged framework that has an opinion\
    \ on how everything in your app should behave. Instead, React works primarily\
    \ in the `View` layer where all of its worries and concerns revolve around your\
    \ visual elements and keeping them up to date. This means you are free to use\
    \ whatever you want for the `M` and `C` part of your MVC architecture. This flexibility\
    \ enables you to pick and choose what technologies you are familiar with, and\
    \ this makes React useful not only for new web apps you create but also for existing\
    \ apps you’d like to enhance without removing and refactoring a whole bunch of\
    \ code.\n\n## Conclusion\n\nAs new web frameworks and libraries go, React is quite\
    \ the runaway success. It not only deals with the most common problems developers\
    \ faced when building single-page apps, it throws in a few additional tricks that\
    \ make building the visuals for your single-page apps much MUCH easier. Since\
    \ it came out in 2013, React has steadily found its way into popular web sites\
    \ and apps that you probably use. Besides Facebook and Instagram, some of the\
    \ notable ones include the BBC, Khan Academy, PayPal, Reddit, The New York Times,\
    \ Yahoo, and many more: [https://github.com/facebook/react/wiki/Sites-Using-React](https://github.com/facebook/react/wiki/Sites-Using-React)\n\
    \nThe intent of this chapter is to provide you with an introduction to what React\
    \ does and why it does it. In tutorials in subsequent chapters we’ll dive deeper\
    \ into everything you’ve seen here and cover the technical details that will help\
    \ you successfully use React in your own projects. Stick around.\n\n## 2. Building\
    \ Your First React App\n\nBy now, thanks to the previous chapter, you probably\
