    \ none;\n  padding: 20px;\n  display: inline-block;\n}\n\n.content {\n  background-color:\
    \ #FFF;\n  padding: 20px;\n}\n\n.content h2 {\n  padding: 0;\n  margin: 0;\n}\n\
    \n.content li {\n  margin-bottom: 10px;\n}\n```\n\n是的，我们正在以标记语言的形式使用 CSS。我们没有采用在\
    \ 第 4 章 中看到的内联样式对象方法。这样做的原因是出于方便考虑。我们的组件不会在特定的应用程序之外被复用，而且我们真的希望利用 CSS 继承特性来尽可能地减少重复的标记。否则，如果我们不使用普通的\
    \ CSS，最终将不得不为标记中的几乎每个元素定义大量的巨大的样式对象。这会让即使是我们中最最有耐心的人在阅读代码时也会感到恼恼。\n\n无论如何，一旦你添加了这些\
    \ CSS，我们的应用程序看起来就会好很多（参见图 13-5）。\n\n![Image](img/image00291.jpeg)\n\n图 13-5 添加的\
    \ CSS 样式。\n\n还有一些工作要做（例如，我们的导航链接消失在了黑色横后面），但我们稍后会修复这些问题。\n\n### 避免 ReactRouter\
    \ 前缀\n\n在回到常规节目之前，我们最后一个与清理相关的任务。你是否注意到，每当我们调用由 React Router API 定义的内容时，我们都会在该内容前面加上\
    \ `ReactRouter` 前缀？\n\n点击此处查看代码图像\n\n```jsx\n<ReactRouter.Router>\n  <ReactRouter.Route\
    \ path=\"/\" component={App}>\n  </ReactRouter.Route>\n</ReactRouter.Router>\n\
    ```\n\n对于我们进行的每一次 API 调用都重复这些内容有点太啰嗦，随着我们深入研究 React Router API 并使用其中更多功能，这个问题将会变得更加严重。\n\
    \n解决此问题的办法是使用一种新的 ES6 技巧，你可以手动指定哪些值将自动获得前缀。在你的 `script` 标签顶部添加以下内容：\n\n```javascript\n\
    var { Router,\n      Route,\n      IndexRoute,\n      IndexLink,\n      Link }\
    \ = ReactRouter;\n```\n\n一旦你添加了这段代码，每当你使用大括号内定义的值之一时，当应用程序运行时，系统会自动为你添加 `ReactRouter`\
    \ 前缀。这意味着，你现在可以回到 `ReactDOM.render` 方法，并从我们的 `Router` 和 `Route` 组件实例中移除 `ReactRouter`\
    \ 前缀：\n\n点击此处查看代码图像\n\n```jsx\nReactDOM.render(\n  <Router>\n    <Route path=\"\
    /\" component={App}>\n    </Route>\n  </Router>,\n  destination\n);\n```\n\n如果你现在预览你的应用程序，实际上不应该发生任何变化。最终结果与你之前的完全相同。唯一的区别是我们的标记紧凑了一些。\n\
    \n现在，在我们继续之前，你可能想知道为什么自动带有 `ReactRouter` 前缀的值列表中包含了许多我们目前为止在代码中使用过的 `Router` 和\
    \ `Route` 值之外的内容。将这些额外的值视为我们很快将使用的 React Router API 其他部分的预览吧。剧透警告！（现在才提这个可能已经太晚了，对吧？）\n\
    \n### 正确显示主页\n\n我们在几个章节前结束时提到，我们目前显示主页的方式是不正确的。虽然在页面加载时你可以得到想要的结果，但这种方法并不能方便我们在用户导航时加载除主页以外的任何内容。对\
    \ `Home` 组件的调用被硬编码在 `App` 内部。\n\n正确的解决方案是让 React Router 根据你当前的 URL 结构来处理调用哪个组件。这涉及到在\
    \ `Route` 组件内部嵌套 `Route` 组件，以更好地定义 URL 到视图的映射。回到我们的 `ReactDOM.render` 方法，并进行以下高亮更改：\n\
    \n点击此处查看代码图像\n\n```jsx\nReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n\
    \      <IndexRoute component={Home}/> \n    </Route>\n  </Router>,\n  destination\n\
    );\n```\n\n在我们的根 `Route` 元素内部，我们了另一个类型为 `IndexRoute` 的 `Route` 元素（稍后会介绍它是什么！）并将其视图设置为我们的\
    \ `Home` 组件。我们还需要做最后一个更改。在我们的 `App` 组件内部，移除对 `Home` 组件的调用，并将其替换为以下高亮行：\n\n点击此处查看代码图像\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
    \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
    \        </div>\n      );\n  }\n});\n```\n（注：此处根据原文逻辑进行了翻译）\n\n如果你现在预览你的应用程序，实际上不应该发生任何变化。最终结果与你之前的完全相同。唯一的区别是我们的标记紧凑了一些。\n\
    \n"
- fmt: "\nNotice what have done here. Our `Link` components specify a prop called\
    \ `to`. This prop specifies the value of the URL we will display in the address\
    \ bar. Indirectly, it also specifies the location we will be telling React Router\
    \ we are virtually navigating to. Our Home link takes users to the root (`/`),\
    \ the Stuff link takes users to a location called `stuff`, and the Contact link\
    \ takes users to a location called `contact`.\n\nIf you preview your page and\
    \ click on the links (which will now be visible because the CSS for them will\
    \ have kicked in), you won’t see anything new display. You will just see your\
    \ Home content because that is all that we had specified earlier. With that said,\
    \ you can see the URLs updating in the address bar. You’ll see your current page\
    \ followed by `#/contact`, `#/stuff`, or `#/` depending on which of the links\
    \ you clicked. Oh, you’ll also see a random hash added after the URL. That is\
    \ progress!\n\n### Adding the Stuff and Contact Views\n\nOur app is slowly taking\
    \ its final shape...or it will get really close by the time we are done with this\
    \ section! What we are going to do next is define the components for our Stuff\
    \ and Contact views that we linked to earlier. In your code just below where you\
    \ have your `Home` component, go ahead and add in the following:\n\n[Click here\
    \ to view code image](#part0039.xhtml_p157pro01)\n\n```javascript\nvar Contact\
    \ = React.createClass({\n  render: function() {\n    return (\n      <div>\n \
    \       <h2>GOT QUESTIONS?</h2>\n        <p>The easiest thing to do is post on\n\
    \        our <a href=\"http://forum.kirupa.com\">forums</a>s.\n        </p>\n\
    \      </div>\n    );\n  }\n});\n\nvar Stuff = React.createClass({\n  render:\
    \ function() {\n    return (\n      <div>\n        <h2>STUFF</h2>\n        <p>Mauris\
    \ sem velit, vehicula eget sodales vitae,\n        rhoncus eget sapien:</p>\n\
    \        <ol>\n          <li>Nulla pulvinar diam</li>\n          <li>Facilisis\
    \ bibendum</li>\n          <li>Vestibulum vulputate</li>\n          <li>Eget erat</li>\n\
    \          <li>Id porttitor</li>\n        </ol>\n      </div>\n    );\n  }\n});\n\
    ```\n\nWhat we have just added are the `Stuff` and `Contact` components that simply\
    \ render out HTML. All that remains is for us to update our routing configuration\
    \ to include these two components and display them at the appropriate URL.\n\n\
    In our `ReactDOM.render` method, go ahead and add the following two highlighted\
    \ lines:\n\n[Click here to view code image](#part0039.xhtml_p157pro02)\n\n```javascript\n\
    ReactDOM.render(\n  <Router>\n    <Route path=\"/\" component={App}>\n      <IndexRoute\
    \ component={Home}/>\n      <Route path=\"stuff\" component={Stuff} />     \n\
    \      <Route path=\"contact\" component={Contact} /> \n    </Route>\n  </Router>,\n\
    \  destination\n);\n```\n\nAll we are doing here is updating our routing logic\
    \ to display the `Stuff` component if the URL contains the word `stuff` and to\
    \ display the `Contact` component if the URL contains the word `contact`. If you\
    \ preview your page now, click on the Stuff and Contact links. If everything worked\
    \ out fine, you’ll see these views loaded inside our frame when you navigate to\
    \ them.\n\n### Note: Little Bit About Route Matching\n\nOur route configuration\
    \ is nothing more than a series of rules that determine what to do when a URL\
    \ matches the conditions we have laid out. The fancy term for that is route matching.\
    \ The heuristic React Router uses to match URLs is fully explained in the React\
    \ Router documentation, but for our case, we have a simple nested route where\
    \ you can have multiple things that can match at the same time. Our outer route\
    \ matches if the URL contains `/`. Our inner routes then match if the URL happens\
    \ to contain `stuff` or `contact`.\n\nWhat this means is simple. For each route\
    \ that matches, the component you specified to display will appear. When you are\
    \ navigating to a page like `/stuff`, the `App` component will display because\
    \ `/` exists in the URL. The `Stuff` component then displays because the path\
    \ for `stuff` is in the URL as well. That is why when we navigate to the Stuff\
    \ or Contact pages, we see them in addition to our frame. You can have deeply\
    \ nested routes as well. Take a look at the following configuration:\n\n[Click\
    \ here to view code image](#part0039.xhtml_p158pro01)\n\n```javascript\nReactDOM.render(\n\
    \  <Router>\n    <Route path=\"/\" component={App}>\n      <IndexRoute component={Home}\
    \ />\n      <Route path=\"stuff\" component={Stuff}>\n        <Route path=\"blah\"\
    \ component={MyBlah}/>\n      </Route>\n      <Route path=\"contact\" component={Contact}\
    \ />\n    </Route>\n  </Router>,\n  destination);\n```\n\nIn this example, notice\
    \ that our `Route` element whose path is `stuff` now contains a nested route for\
    \ a path `blah`. This means if you happened to have a URL that is `/stuff/blah`,\
    \ the `MyBlah` component will be displayed in addition to the `Stuff` component\
    \ and the `App` component from the parent matching. By nesting routes and following\
    \ the route matching ([https://github.com/reactjs/react-router/blob/master/docs/RouteMatching.md](https://github.com/reactjs/react-router/blob/master/docs/RouteMatching.md)),\
    \ you can display custom views depending on a variety of URL arrangements you\
    \ may expose in your app for your users to navigate to.\n\n### Creating Active\
    \ Links\n\nThe last thing we are going to tackle is something that greatly increases\
    \ the usability of our app. Depending on which page you are currently displaying,\
    \ we are going to highlight that link with a blue background. For example, [Figure\
    \ 13-6](#part0020.xhtml_ch13fig06) is what our app will look like when the Stuff\
    \ content is being displayed.\n\n![Image](Images/image0292.jpeg)\nFigure 13-6\
    \ The Stuff content.\n\nThe way you accomplish this in React Router is by setting\
    \ a prop called `activeClassName` on your `Link` instances with the name of the\
    \ CSS class that will get set when that link is currently active. To make this\
    \ happen, go back to your `App` component and make the highlighted changes:\n\n\
    [Click here to view code image](#part0039.xhtml_p159pro01)\n\n```javascript\n\
    var App = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
    \        <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li><Link\
    \ to=\"/\" activeClassName=\"active\">Home</Link></li>\n          <li><Link to=\"\
    /stuff\" activeClassName=\"active\">Stuff</Link></li>\n          <li><Link to=\"\
    /contact\" activeClassName=\"active\">Contact</Link></li>\n        </ul>\n   \
    \     <div className=\"content\">\n          {this.props.children}\n        </div>\n\
    \      </div>\n    );\n  }\n});\n```\n\nWe specify the `activeClassName` prop\
    \ and set it to a value of `active`. This ensures that whenever a link is clicked\
    \ (and its path becomes active), the link element’s `class` attribute at runtime\
    \ gets set to a value of `active`. To ensure our active links are styled differently,\
    \ go ahead and add the following CSS:\n\n```css\n.active {\n  background-color:\
    \ #0099FF;\n}\n```\n\nIf you preview your app now, click on any of the links.\
    \ Notice that the active link (and the Home link) displays with a blue background.\
    \ We aren’t done just yet, though. Our Home link is always highlighted. It should\
    \ only be highlighted when we load our Home page for the first time or explicitly\
    \ navigate to the Home link itself. To fix this, we need to change how we link\
    \ to our Home content. Instead of specifying our Home content with a `Link` element,\
    \ we are going to replace it with an `IndexLink` element instead.\n\nGo ahead\
    \ and make this change:\n\n[Click here to view code image](#part0039.xhtml_p160pro01)\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li><IndexLink to=\"/\" activeClassName=\"active\">Home</IndexLink></li>\n\
    \          <li><Link to=\"/stuff\" activeClassName=\"active\">Stuff</Link></li>\n\
    \          <li><Link to=\"/contact\" activeClassName=\"active\">Contact</Link></li>\n\
    \        </ul>\n        <div className=\"content\">\n          {this.props.children}\n\
    \        </div>\n      </div>\n    );\n  }\n});\n```\n"
