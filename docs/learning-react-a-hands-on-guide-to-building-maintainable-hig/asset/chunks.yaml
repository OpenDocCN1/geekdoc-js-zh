    What we have done is create a new component called `HelloWorld`. This `HelloWorld`
    component doesn’t do anything right now. In fact, it is basically an empty JavaScript
    object at this point. Inside this object, you can put all sorts of properties
    to further define what `HelloWorld` does. Some properties you define are special
    and used by React to help your components work their magic. One such mandatory
    property is `render`.


    Go ahead and modify our `HelloWorld` component by adding a `render` property as
    shown in the following:


    [Click here to view code image](#part0029.xhtml_p030pro03)


    var HelloWorld = React.createClass({


      render: function() { 


      }                    


    });


    Just like the `render` method of we saw a few moments earlier as part of `ReactDOM.render`,
    the `render` method inside a component is also responsible for dealing with JSX.
    Let’s modify our `render` method to return **Hello, componentized world!**, so
    go ahead and add the following highlighted lines:


    [Click here to view code image](#part0029.xhtml_p030pro04)


    var HelloWorld = React.createClass({


      render: function() {


        return (                             


          <p>Hello, componentized world!</p> 


        );                                   


      }


    });


    What we’ve done is told our `render` method to return the JSX that represents
    our **Hello, componentized world!** text. All that remains is to actually use
    this component. The way you use a component once you’ve defined it is by **calling**
    it, and we are going to call it from our old friend, the `ReactDOM.render` method:


    [Click here to view code image](#part0029.xhtml_p031pro01)


    ReactDOM.render(


      <HelloWorld/>, 


      document.querySelector("#container")


    );


    That isn’t a typo! The JSX we use for calling our `HelloWorld` component is the
    very HTML-like `<HelloWorld/>`. If you preview your page in your browser, you’ll
    see the text **Hello, componentized world!** showing up on your screen. If you
    held your breath in suspense, you can relax.


    If you have difficulty relaxing after seeing the syntax we used for calling `HelloWorld`,
    stare at the following circle for a few moments:


    ![Image](Images/image00242.jpeg)


    Ok, back to reality. What we’ve done so far might seem crazy, but simply think
    of your `<HelloWorld/>` component as a cool and new HTML tag whose functionality
    you have full control over. This means you can do all sorts of HTML-ey things
    to it.


    For example, go ahead and modify our `ReactDOM.render` method to look as follows:


    [Click here to view code image](#part0029.xhtml_p032pro01)


    ReactDOM.render(


      <div>


        <HelloWorld/>


      </div>,


      document.querySelector("#container")


    );


    We wrapped our call to the `HelloWorld` component inside a `div` element, and
    if you preview this in your browser, everything still works. Let’s go one step
    further! Instead of having just a single call to `HelloWorld`, let’s make a bunch
    of calls. Modify our `ReactDOM.render` method to now look as follows:


    [Click here to view code image](#part0029.xhtml_p032pro02)


    ReactDOM.render(


      <div>


        <HelloWorld/>


        <HelloWorld/>


        <HelloWorld/>


        <HelloWorld/>


        <HelloWorld/>


        <HelloWorld/>


      </div>,


      document.querySelector("#container")


    );


    What you will see now is a bunch of **Hello, componentized world!** text instances
    appear. Let’s do one more thing before we move on to something shinier. Go back
    to our `HelloWorld` component declaration, and change the text we return to the
    more traditional **Hello, world!** value:


    [Click here to view code image](#part0029.xhtml_p032pro03)


    var HelloWorld = React.createClass({


      render: function() {


        return (


          <p>Hello, world!</p> 


        );


      }


    });


    Just make this one change and preview your example. This time around, all of the
    various `HelloWorld` calls we specified earlier now return **Hello, world!** to
    the screen. There was no manually modifying every `HelloWorld` call. That’s a
    good thing!


    #### Specifying Properties


    Right now, our component does just one thing. It prints **Hello, world!** to our
    screen and only that! That’s the equivalent of having a JavaScript function that
    looks like this:


    function getDistance() {


      alert("42km");


    }


    Except for one very particular case, that JavaScript function doesn’t seem very
    useful, does it? The way to increase the usefulness of this function is by modifying
    it to take arguments:


    [Click here to view code image](#part0029.xhtml_p033pro01)


    function getDistance(speed, time) {


        var result = speed * time;


        alert(result);


    }


    Now, your function can be used more generally for a variety of situations—not
    just one where the output will be **42km**.


    Something similar applies to your components as well. Just like with functions,
    you can pass in arguments that alter what your component does. There is a slight
    terminology update you need to be on top of. What we call **arguments** in the
    function world are going to be known as **properties** in the component world.
    Let’s see these properties in action!


    We are going to modify our `HelloWorld` component to enable you to specify who
    or what you greet besides the generic **World**. For example, imagine being able
    to specify **Bono** as part of the `HelloWorld` call and seeing **Hello, Bono!**
    appear on screen.


    To add properties to a component, there are two parts you need to follow.


    ##### First Part: Updating the Component Definition


    Right now, our `HelloWorld` component is hard coded to always send out **Hello,
    world!** as part of its `return` value. The first thing we are going to do is
    change that behavior by having `return` print out the value passed in by a property.
    We need a name to give our property, and for this example, we are going to call
    our property **greetTarget**.


    To specify the value of `greetTarget` as part of our component, here is the modification
    we need to make:


    [Click here to view code image](#part0029.xhtml_p033pro02)


    var HelloWorld = React.createClass({


      render: function() {


        return (


          <p>Hello, {this.props.greetTarget}!</p> 


        );


      }


    });


    The way you access a property is by calling it via the `props` property that every
    component has access to. Notice how we specify this property. We place it inside
    curly brackets `{`and `}`. *In JSX, if you want something to get evaluated as
    an expression, you need to wrap that something inside curly brackets*. If you
    don’t do that, you’ll see the raw text `this.props.greetTarget` printed out.


    ##### Second Part: Modifying the Component Call


    Once you’ve updated the component definition, all that remains is to pass in the
    property value as part of the component call. That is done by adding an attribute
    with the same name as our property, followed by the value you want to pass in.
    In our example, that would involve modifying the `HelloWorld` call with the `greetTarget`
    attribute and the value we want to give it.


    Go ahead and modify our `HelloWorld` calls as follows:


    [Click here to view code image](#part0029.xhtml_p034pro01)


    ReactDOM.render(


      <div>


        <HelloWorld greetTarget="Batman"/>


        <HelloWorld greetTarget="Iron Man"/>


        <HelloWorld greetTarget="Nicolas Cage"/>


        <HelloWorld greetTarget="Mega Man"/>


        <HelloWorld greetTarget="Bono"/>


        <HelloWorld greetTarget="Catwoman"/>


      </div>,


      document.querySelector("#container")


    );


    Each of our `HelloWorld` calls now has the `greetTarget` attribute along with
    the name of a superhero (or equivalent mythical being!) that we wish to greet.
    If you preview this example in the browser, you’ll see the greetings happily printed
    out on screen.


    One last thing to call out before we move on. You are not limited to just having
    a single property on a component. You can have as many properties as you want,
    and your `props` property will easily accommodate any property requests you have
    without making any fuss.


