  raw: '![Image](Images/image00226.jpeg) **Let your browser rely on a JavaScript library
    to automatically convert JSX to something it understands.** You specify your JSX
    directly just like you would any old piece of JavaScript, and your browser takes
    care of the rest.


    Both of these solutions have a place in our world, but let’s talk about the impact
    of each.


    The first solution, while a bit complicated and time-consuming at first, is *the
    way* modern web development is done these days. Besides compiling (transpiling
    to be more accurate) your JSX to JS, this approach enables you to take advantage
    of modules, better build tools, and a bunch of other features that make building
    complex web apps somewhat manageable.


    The second solution provides a quick and direct path where you initially spend
    more time writing code and less time fiddling with your development environment.
    To use this solution, all you do is reference a script file. This script file
    takes care of turning the JSX into JS on page load, and your React app comes to
    life without you having to do anything special to your development environment.


    For our introductory look at React, we are going to use the second solution. You
    may be wondering why we don’t use the second solution always. The reason is that
    your browser takes a performance hit each time it spends time translating JSX
    into JS. That is totally acceptable when learning how to use React, but that is
    totally not acceptable when deploying your app for real-life use. Because of that
    un-acceptableness, we will revisit all of this and look at the first solution
    and how to set up your development environment later, once you’ve gotten your
    feet comfortably wet in React.


    ### Getting Your React On


    In the previous section, we looked at the two ways you have for ensuring your
    React app ends up as something your browser understands. In this section, we are
    going to put all of those words into practice. First, we will need a blank HTML
    page that will act as our starting point.


    If you don’t have a blank HTML page handy, feel free to use the following:


    [Click here to view code image](#part0028.xhtml_p015pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


    </head>


    <body>


      <script>


      </script>


    </body>


    </html>


    This page has nothing interesting or exciting going for it, but let’s fix that
    by adding a reference to the React library. Just below the `title`, add these
    two lines:


    [Click here to view code image](#part0028.xhtml_p015pro02)


    <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


    <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


    These two lines bring in both the core React library as well as the various things
    React needs to work with the DOM. Without them, you aren’t building a React app
    at all. Now, we aren’t done yet. There is one more library we need to reference.
    Just below these two `script` tags, add the following line:


    [Click here to view code image](#part0028.xhtml_p016pro01)


    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    What we are doing here is adding a reference to the Babel JavaScript compiler
    ([http://babeljs.io/](http://babeljs.io/)). Babel does many cool things, but the
    one we care about is its capability to turn JSX into JavaScript.


    At this point, our HTML page should look as follows:


    [Click here to view code image](#part0028.xhtml_p016pro02)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    </head>


    <body>


      <script>


      </script>


    </body>


    </html>


    If you preview your page right now, you’ll notice that this page is still blank
    with nothing visible going on. That’s OK. We are going to fix that next.


    ### Displaying Your Name


    The first thing we are going to do is use React to display our name on screen.
    The way we do that is by using a method called `render`. Inside your `script`
    tag, add the following:


    [Click here to view code image](#part0028.xhtml_p018pro01)


    ReactDOM.render(


      <h1>Sherlock Holmes</h1>,


      document.body


    );


    Don’t worry if none of this makes sense at this point. Our goal is to get something
    to display on screen first, and we’ll make sense of what we did shortly afterwards.
    Now, before we preview this in our page to see what happens, we need to designate
    this `script` block as something that Babel can do its magic on. The way we do
    that is by setting the `type` attribute on the `script` tag to a value of `text/babel`:


    <script type="text/babel">


      ReactDOM.render(


        <h1>Sherlock Holmes</h1>,


        document.body


      );


    </script>


    Once you’ve made that change, now preview what you have in your browser. What
    you’ll see are the words **Sherlock Holmes** printed in giant letters. Congratulations!
    You just built an app using React.


    As apps go, this isn’t all that exciting. Chances are your name isn’t even Sherlock
    Holmes. While this app doesn’t have much going for it, it does introduce you to
    one of the most frequently used methods you’ll use in the React universe—the `ReactDOM.render`
    method.


    The `render` method takes two arguments:


    ![Image](Images/image00226.jpeg) The HTML-like elements (aka JSX) you wish to
    output


    ![Image](Images/image00226.jpeg) The location in the DOM that React will render
    the JSX into


    Here is what our render method looks like:


    ReactDOM.render(


      <h1>Sherlock Holmes</h1>,


      document.body


    );


    Our first argument is the text **Sherlock Holmes** wrapped inside some `h1` tags.
    This HTML-like syntax inside your JavaScript is what JSX is all about. While we
    will spend a lot more time drilling into JSX a bit later, I should mention this
    up front—***It is every bit as crazy as it looks***. Whenever I see brackets and
    slashes in JavaScript, a part of me dies on the inside because of all the string
    escaping and quotation mark gibberish I will need to do. With JSX, you do none
    of that. You just place your HTML-like content as-is just like what we’ve done
    here. Magically (like the super-awesome kind involving dragons and laser beams),
    it all works.


    The second argument is `document.body`. There is nothing crazy or bizarre about
    this argument. It simply specifies where the converted markup from the JSX will
    end up living in our DOM. In our example, when the `render` method runs, the `h1`
    tag (and everything inside it) is placed in our document’s `body` element.


    Now, the goal of this exercise wasn’t to display *a* name on the screen. It was
    to display *your* name. Go ahead and modify your code to do that. In my case,
    the `render` method will look as follows:


    ReactDOM.render(


      <h1>Batman</h1>,


      document.body


    );


    Well—it would look like that if my name was Batman! Anyway, if you preview your
    page now, you will see your name displayed instead of Sherlock Holmes.


    ### It’s All Still Familiar


    While the JavaScript looks new and shiny thanks to JSX, the end result your browser
    sees is nice, clean HTML, CSS, and JavaScript. To see this for yourself, let’s
    make a few alterations to how our app behaves and looks.


    #### Changing the Destination


    The first thing we’ll do is change where our JSX gets output. Using JavaScript
    to place things directly in your `body` element is never a good idea. A lot can
    go wrong—especially if you are going to be mixing React with other JS libraries
    and frameworks. The recommended path is to create a separate element that you
    will treat as a new root element. This element will serve as the destination our
    `render` method will use. To make this happen, go back to the HTML and add a `div`
    element with an `id` value of `container`.


    Instead of showing you the full HTML for this one minor change, here is what just
    our `body` element looks like:


    <body>'
