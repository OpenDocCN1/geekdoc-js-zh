    \nFigure 9-1 If everything went well, you will get this yellow circle.\n\nIf you\
    \ see what I see, great! Now, let’s take a moment to understand what our example\
    \ is doing. The bulk of what you see comes from the `Circle` component:\n\n```javascript\n\
    var Circle = React.createClass({\n  render: function() {\n    var circleStyle\
    \ = {\n      padding: 10,\n      margin: 20,\n      display: \"inline-block\"\
    ,\n      backgroundColor: this.props.bgColor,\n      borderRadius: \"50%\",\n\
    \      width: 100,\n      height: 100,\n    };\n    return (\n      <div style={circleStyle}>\n\
    \      </div>\n    );\n  }\n});\n```\n\nThe `circleStyle` object contains the\
