  trans: "\n它只是将 `LightningCounterDisplay` 组件推入我们 DOM 中的容器 `div` 元素中。就是如此。最终结果是，你会看到来自我们的\
    \ `ReactDOM.render` 方法的标记与 `LightningCounterDisplay` 以及 `LightningCounter` 组件的标记组合。\n\
    \n### 让我们的计数器运行起来\n\n现在我们已经了解了起点，是时候为接下来的步骤做计划了。我们的计数器工作原理非常简单。我们将使用 `setInterval`\
    \ 函数，它每隔 1000 毫秒（即 1 秒）调用某些代码。这些“某些代码”会在每次被调用时将一个值增加 100。看起来非常直观，对吧？\n\n为了让这一切运行，我们将依靠\
    \ React 组件暴露的三个 API：\n\n![Image](img/image00226.jpeg) `getInitialState`——此方法在组件挂载（mounted）之前运行，并允许你修改组件的\
    \ `state` 对象。\n\n![Image](img/image00226.jpeg) `componentDidMount`——此方法在我们的组件渲染（或如\
    \ React 所说的挂载）之后立即被调用。\n\n![Image](img/image00226.jpeg) `setState`——此方法允许你更新 `state`\
    \ 对象的值。\n\n我们很快就会看到这些 API 的应用，但我想先给你们一个预览，以便你们在排队中轻松识别出它们！\n\n### 设置初始状态值\n\n\
    我们需要一个变量作为计数器，让我们把这个变量命名为 `strikes`。有很多方法可以创建这个变量。最明显的方法是如下：\n\n```javascript\n\
    var strikes = 0 // :P\n```\n\n但我们不想这样做。在我们的示例中，`strikes` 变量是组件状态的一部分，它的值就是我们在屏幕上显示的内容。我们要做的的是使用刚才简要见过的\
    \ `getInitialState` 方法，并在内部处理变量的初始化。稍后你将看到这对组件状态产生了什么结果。\n\n在你的 `LightningCounter`\
    \ 组件内部，添加以下高亮行：\n\n点击此此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
    \  getInitialState: function() { \n    return {                          \n  \
    \    strikes: 0                    \n    };                          \n  },  \
    \                          \n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\n`getInitialState` 方法会在你的组件渲染很久之前自动运行，我们正在做告诉 React 返回一个包含我们\
    \ `strikes` 属性（初始化为 0）的对象。你可能在想，我们把这个对象返回给谁或什么？这一切都是在幕后发生的魔法。*被返回的对象被设置为我们组件 `state`\
    \ 对象的初始值*。\n\n如果在这段代码运行后检查我们的 `state` 对象的值，它看起来会像下面：\n\n```javascript\nvar state\
    \ = {\n  strikes: 0\n}\n```\n\n在结束这一节之前，让我们视觉化我们的 `strikes` 属性。在我们的 `render` 方法中，进行以下高亮更改：\n\
    \n点击此此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n \
    \ getInitialState: function() {\n    return {\n      strikes: 0\n    };\n  },\n\
    \  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1> \n\
    \    );\n  }\n});\n```\n\n我们所做的是将默认的 Hello! 文本替换为显示 `this.state.strikes` 属性所存储值的表达式。如果你在浏览器中预览你的示例，你将看到显示一个值为\
    \ 0。这是一个开始！\n\n### 启动我们的计时器并设置状态\n\n接下来是让我们的计时器运行并增加我们的 `strikes` 属性。正如我们提到的，我们将使用\
    \ `setInterval` 函数每秒将 `strikes` 属性增加 100。我们将在组件使用内置的 `componentDidMount` 方法渲染后立即执行所有这些操作。\n\
    \n启动计时器的代码如下：\n\n点击此此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
    \  getInitialState: function() {\n    return {\n      strikes: 0\n    };\n  },\n\
    \  componentDidMount: function() {\n    setInterval(this.timerTick, 1000);\n \
    \ },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\n请继续将这些高亮行添加到我们的示例中。在组件渲染后调用的 `componentDidMount` 方法内部，我们有\
    \ `setInterval` 方法，它每秒（或每 1000 毫秒）调用一次 `timerTick` 函数。\n\n我们还没有定义 `timerTick`\
    \ 函数，让我们通过向代码中添加高亮行来修复此：\n\n点击此此处查看代码图片\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  componentDidMount: function() {\n    setInterval(this.timerTick,\
    \ 1000);\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n\n// 注意这里应补充 timerTick 定义，但根据原文未给出完整代码，此处逻辑如下\n```\n*(注：原文此后似乎有截断或省略了\
    \ timerTick 的具体实现，按要求翻译现有文本)*\n\n我们还没有定义 `timerTick` 函数，让我们通过向代码中添加高亮行来修复此：\n\n\
    点击此此处查看代码图片\n\n(注：此处为翻译原文衔接内容)\n```javascript\n  render: function() {\n    return\
    \ {\n      strikes: 0\n    };\n  },\n```\n(接上文逻辑翻译) \n我们的 `timerTick` 函数所做的非常简单。它只是调用\
    \ `setState`。`setState` 方法有多种形式，但对于我们这里，它接收一个要合并到状态中的对象。在我们的案例中，我们指定了 `strikes`\
    \ 属性并将其设置为比当前值增加 100。\n\n`timerTick` 如何保持上下文？\n\n在普通 JavaScript 中`timerTick` 函数不会保持上下文。你需要额外的工作来支持这一点。在\
    \ React 世界中它之所以有效是因为被称为自动绑定（autobinding）的机制。现在你知道这一点吗？\n\n### 渲染状态更改\n\n如果你现在预览应用，你会看到我们的\
    \ `strikes` 值开始每秒增加 100（参见图 8-2）。\n\n![Image](img/image00270.jpeg)\n\n图 8-2 `strikes`\
    \ 值每秒增加 100\n\n让我们暂时忽略代码发生了什么。这非常直观。有趣的是这一切涉及到这种行为：每当你调用 `setState` 并更新 `state`\
    \ 对象中的内容时，你组件的 `render` 方法会被自动调用。这将触发任何受输出影响的组件的 `render` 级联。这一切的最终结果就是你在屏幕上看到的\
    \ UI 状态的最新表示。保持数据和 UI 同步是 UI 开发中最困难的问题之一，所以 React 为我们处理这些真是太好了。\n\n### 可选：完整代码\n\
    \n我们现在拥有的只是一个每秒增加 100 的计数器。它看起来不像*闪电计数器*，但它涵盖了我现在想让你学习的所有状态知识。如果你想可选地丰富你的示例，使其像我们在开头看到的我的版本一样，下面是放入我们\
    \ `script` 标签中的完整代码：\n\n点击此此处查看代码图片\n"
