    All of this may sound a bit crazy if you’ve never heard of single-page apps before,
    but there is a very good chance you’ve run into some of them in the wild. If you’ve
    ever used popular web apps like Gmail, Facebook, Instagram, or Twitter, you were
    using a single-page app. In all those apps, the content gets dynamically displayed
    without requiring you to refresh or navigate to a different page.


    Now, I am making these single-page apps seem really complicated. That’s not ***entirely***
    the case. Thanks to a lot of great improvements in both JavaScript and a variety
    of third party frameworks and libraries, building single-page apps has never been
    easier. That doesn’t mean there is no room for improvement, though.


    When building single-page apps, there are three major issues that you’ll encounter:


    ![Image](Images/image00226.jpeg) **In a single-page application, the bulk of your
    time will be spent keeping your data in sync with your UI**. For example, if a
    user loads new content, do we explicitly clear out the search field? Do we keep
    the active tab on a navigation element still visible? Which elements do we keep
    on the page, and which do we destroy?


    These are all problems unique to single-page apps. When navigating between pages
    in the old model, we just assumed everything in our UI would be destroyed and
    just built back up again. This was never a problem.


    ![Image](Images/image00226.jpeg) **Manipulating the DOM is really REALLY slow**.
    Manually querying elements, adding children (see [Figure 1-5](#part0008.xhtml_ch01fig05)
    below), removing subtrees, and performing other DOM operations are some of the
    slowest things you can do in your browser. Unfortunately, in a single-page app,
    you’ll be doing a lot of this. Manipulating the DOM is the primary way you are
    able to respond to user actions and display new content.


    ![Image](Images/image00231.jpeg)


    Figure 1-5 Adding children.


    ![Image](Images/image00226.jpeg) **Working with HTML templates can be a pain.**
    Navigation in a single-page app is nothing more than you dealing with fragments
    of HTML to represent whatever it is you wish to display. These fragments of HTML
    are often known as **templates**, and using JavaScript to manipulate them and
    fill them out with data gets really complicated really quickly.


    To make things worse, depending on the framework you are using, the way your templates
    look and interact with data can vary wildly. For example, this is what using a
    template in Mustache looks like:


    [Click here to view code image](#part0027.xhtml_p006pro01)


    var view = {


      title: "Joe",


      calc: function () {


        return 2 + 4;


      }


    };


    var output = Mustache.render("{{title}} spends {{calc}}", view);


    Sometimes, your templates may look like some clean HTML that you can proudly show
    off in front of the class. Other times, your templates might be unintelligible,
    with a boatload of custom tags designed to help map your HTML elements to some
    data.


    Despite these shortcomings, single-page apps aren’t going anywhere. They are a
    part of the present, and they will fully form the future of how web apps are built.
    That doesn’t mean that we have to tolerate these shortcomings. To address this,
    meet React!


    ### Meet React


    Facebook (and Instagram) decided that enough is enough. Given their abundance
    of experience with single-page apps, they released a library called **React**
    (the React logo is shown in [Figure 1-6](#part0008.xhtml_ch01fig06)) to not only
    address these shortcomings, but to also change how we think about building single-page
    apps.


    ![Image](Images/image00232.jpeg)


    Figure 1-6 The React logo.


    In the following sections, let’s look at the big things React brings to the table.


    ### Automatic UI State Management


    With single-page apps, keeping track of your UI and maintaining state is hard—and
    very time-consuming. With React, you need to worry only about one thing: *the
    final state your UI is in*. It doesn’t matter what state your UI started out in.
    It doesn’t matter what series of steps your users may have taken to change the
    UI. All that matters is where your UI ended up (see [Figure 1-7](#part0008.xhtml_ch01fig07)).


    ![Image](Images/image00233.jpeg)


    Figure 1-7 The final or end state of your UI is what matters in React.


    React takes care of everything else. It figures out what needs to happen to ensure
    your UI is represented properly, so all of that state management stuff is no longer
    your concern.


    #### Lightning-fast DOM Manipulation


    Because DOM modifications are really slow, you never modify the DOM directly using
    React. Instead, you modify an in-memory ***virtual*** DOM instead. [Figure 1-8](#part0008.xhtml_ch01fig08)
    symbolizes that in-memory virtual DOM.


    ![Image](Images/image00234.jpeg)


    Figure 1-8 Imagine an in-memory virtual DOM.


    Manipulating this virtual DOM is extremely fast, and React takes care of updating
    the real DOM when the time is right. It does so by comparing the changes between
    your virtual DOM and the real DOM, figuring out which changes actually matter,
    and making the least amount of DOM changes needed to keep everything up-to-date
    in a process called **reconciliation**.


    #### APIs to Create Truly Composable UIs


    Instead of treating the visual elements in your app as one monolithic chunk, React
    encourages you to break your visual elements into smaller and smaller components.'
