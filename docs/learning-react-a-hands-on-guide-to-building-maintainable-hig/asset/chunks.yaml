    ### Getting Our Counter On


    Now that we have an idea of what we are starting with, it’s time to make plans
    for our next steps. The way our counter works is pretty simple. We are going to
    be using a `setInterval` function that calls some code every 1000 milliseconds
    (aka 1 second). That “some code” is going to increment a value by **100** each
    time it is called. Seems pretty straightforward, right?


    To make this all work, we are going to be relying on three APIs that our React
    Component exposes:


    ![Image](Images/image00226.jpeg) `getInitialState`—This method runs just ***before***
    your component gets mounted, and it allows you to modify a component’s `state`
    object.


    ![Image](Images/image00226.jpeg) `componentDidMount`—This method gets called just
    ***after*** our component gets rendered (or **mounted** as React calls it).


    ![Image](Images/image00226.jpeg) `setState`—This method allows you to update the
    value of the `state` object.


    We’ll see these APIs in use shortly, but I wanted to give you a preview of them
    so that you can spot them easily in a lineup!


    #### Setting the Initial State Value


    We need a variable to act as our counter, and let’s call this variable `strikes`.
    There are a bunch of ways to create this variable. The most obvious one is the
    following:


    var strikes = 0 // :P


    We don’t want to do that, though. For our example, the `strikes` variable is part
    of our component’s state, and its value is what we display on screen. What we
    are going to do is use the `getInitialState` method that we briefly saw a few
    moments ago and take care of initializing our variable inside it. You’ll see in
    a few moments what result that has on our component’s state.


    Inside your `LightningCounter` component, add the following highlighted lines:


    [Click here to view code image](#part0034.xhtml_p093pro01)


    var LightningCounter = React.createClass({


      getInitialState: function() { 


        return {                    


          strikes: 0                


        };                          


      },                            


      render: function() {


        return (


          <h1>{this.state.strikes}</h1>


        );


      }


    });


    The `getInitialState` method automatically runs waaaay before your component gets
    rendered, and what we are doing is telling React to return an object containing
    our `strikes` property (initialized to **0**). You may be wondering to whom or
    what we are returning this object to? All of that is magic that happens under
    the covers. *The object that gets returned is set as the initial value for our
    component’s* `state` *object*.


    If we inspect the value of our `state` object after this code has run, it would
    look something like the following:


    var state = {


      strikes: 0


    }


    Before we wrap this section up, let’s visualize our `strikes` property. In our
    `render` method, make the following highlighted change:


    [Click here to view code image](#part0034.xhtml_p094pro01)


    var LightningCounter = React.createClass({


      getInitialState: function() {


        return {


          strikes: 0


        };


      },


      render: function() {


        return (


          <h1>{this.state.strikes}</h1> 


        );


      }


    });


    What we’ve done is replaced our default **Hello!** text with an expression that
    displays the value stored by the `this.state.strikes` property. If you preview
    your example in the browser, you will see a value of 0 displayed. That’s a start!


    #### Starting Our Timer and Setting State


    Next up is getting our timer going and incrementing our `strikes` property. Like
    we mentioned earlier, we will be using the `setInterval` function to increase
    the `strikes` property by **100** every second. We are going to do all of this
    immediately after our component has been rendered using the built-in `componentDidMount`
    method.


    The code for kicking off our timer looks as follows:


    [Click here to view code image](#part0034.xhtml_p094pro02)


    var LightningCounter = React.createClass({


      getInitialState: function() {


        return {


          strikes: 0


        };


      },


      componentDidMount: function() {      


        setInterval(this.timerTick, 1000); 


      },                                   


      render: function() {


        return (


          <h1>{this.state.strikes}</h1>


        );


      }


    });


    Go ahead and add these highlighted lines to our example. Inside our `componentDidMount`
    method that gets called once, our component gets rendered, we have our `setInterval`
    method that calls a `timerTick` function every second (or 1000 milliseconds).


    We haven’t defined our `timerTick` function, so let’s fix that by adding the following
    highlighted lines to our code:


    [Click here to view code image](#part0034.xhtml_p095pro01)


    var LightningCounter = React.createClass({


      getInitialState: function() {


        return {


          strikes: 0


        };


      },


      timerTick: function() {               


        this.setState({                     


          strikes: this.state.strikes + 100 


        });                                 


      },                                    


      componentDidMount: function() {


        setInterval(this.timerTick, 1000);


      },


      render: function() {


        return (


          <h1>{this.state.strikes}</h1>


        );


      }


    });


    What our `timerTick` function does is pretty simple. It just calls `setState`.
    The `setState` method comes in various flavors, but for what we are doing here,
    it just takes an object as its argument. This object contains all the properties
    you want to *merge into the state object*. In our case, we are specifying the
    `strikes` property and setting its value to be 100 more than what it is currently.


    * * *


    How does `timerTick` maintain context?


    In regular JavaScript, the timerTick function won’t maintain context. You have
    to do extra work to support that. The reason it works in the React world is because
    of something known as **autobinding**. Now, aren’t you glad you know that?


    * * *


    #### Rendering the State Change


    If you preview your app now, you’ll see our `strikes` value start to increment
    by 100 every second (see [Figure 8-2](#part0015.xhtml_ch08fig02)).


