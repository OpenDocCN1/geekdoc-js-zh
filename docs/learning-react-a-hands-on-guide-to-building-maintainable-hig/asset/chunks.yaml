    \  text-decoration: none;\n  padding: 20px;\n  display: inline-block;\n}\n\n.content\
    \ {\n  background-color: #FFF;\n  padding: 20px;\n}\n\n.content h2 {\n  padding:\
    \ 0;\n  margin: 0;\n}\n\n.content li {\n  margin-bottom: 10px;\n}\n```\n\nYes,\
    \ we are using CSS in its markup form. We aren’t doing the inline style object\
    \ approach that we saw in [Chapter 4](#part0011.xhtml_ch04). The reason has to\
    \ do with convenience. Our components aren’t going to be re-used outside of our\
