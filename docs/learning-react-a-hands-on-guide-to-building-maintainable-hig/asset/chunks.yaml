    \ for the `bgColor` prop set to a random color value (awesauce!). To have our\
    \ example use the `showCircle` function, all you have to do is evaluate it inside\
    \ `ReactDOM.render`:\n\n```javascript\nReactDOM.render(\n  <div>\n    {showCircle()}\n\
    \  </div>,\n  destination\n);\n```\n"
