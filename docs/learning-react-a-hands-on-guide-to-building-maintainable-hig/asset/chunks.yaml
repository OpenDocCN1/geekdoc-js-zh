    \n![Image](Images/image00296.jpeg)\n\nFigure 14-4 The improved example.\n\nAt\
    \ this point, our app looks pretty good. It doesn’t do much, but at least we are\
    \ making progress. In the next section, we will start to make our app do things.\n\
    \n### Creating the Functionality\n\nThe actual implementation of our Todo List\
    \ app is not as crazy as you might think. Let’s take a high-level view of how\
    \ it works. The most important piece of data is the text you enter into the text\
    \ field. Each time you enter some text and submit the form, that text gets visually\
    \ displayed in a list below any pieces of text you submitted. So far, this makes\
    \ sense, right?\n\nAll of this is done by simply taking advantage of React’s state\
    \ functionality. Inside our `state` object, we have an array that is responsible\
    \ for storing everything you enter (see [Figure 14-5](#part0021.xhtml_ch14fig5)).\n\
    \n![Image](Images/image00297.jpeg)\n\nFigure 14-5 Our tasks are stored in an array.\
    \ I know. Not very exciting :-(\n\nEach time this array of items gets updated\
    \ with new text that you submit, we update what you see with the newly submitted\
    \ text. The rest of the work is just around setting up events and event handlers\
    \ to ensure we can submit the form and know exactly what text to add to our array\
    \ of items. In the following sections, we are going to turn all of this English\
    \ we’ve seen here into React-flavored JavaScript and JSX!\n\n#### Initializing\
    \ our State Object\n\nThe first thing we are going to do is initialize our state\
    \ object with the array that will be responsible for storing all of the submitted\
    \ text. Inside our `TodoList` component, add the following highlighted lines:\n\
    \n[Click here to view code image](#part0040.xhtml_p169pro01)\n\n```javascript\n\
    var TodoList = React.createClass({\n  getInitialState: function() { \n    return\
    \ {\n      items: []\n    };\n  },\n  render: function() {\n    return (\n   \
    \   <div className=\"todoListMain\">\n```\n"
