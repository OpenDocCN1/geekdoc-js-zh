    ### Conclusion


    We just scratched the surface on what we can do to create stateful components.
    While using a timer to update something in our state object is cool, the real
    action happens when we start combining user interaction with state. So far, we’ve
    shied away from the large amount of mouse, touch, keyboard, and other related
    things that your components will come into contact with. In an upcoming chapter,
    we are going to fix that. Along the way, you’ll see us taking what we’ve seen
    about states to a whole new level! If that doesn’t excite you, then I don’t know
    what will :P


    ## 9. Going from Data to UI


    When you are building your apps, thinking in terms of props, state, components,
    JSX tags, `render` methods, and other React-isms may be the last thing on your
    mind. Most of the time, you are dealing with data in the form of JSON objects,
    arrays, and other data structures that have no knowledge (or interest) in React
    or anything visual. Bridging the gulf between your data and what you eventually
    see can be frustrating! Not to worry, though. This chapter helps reduce some of
    those frustrating moments by running through some common scenarios you’ll encounter!


    ### The Example


    To help make sense of everything you are about to see, we are going to need an
    example. It’s nothing too complicated, so go ahead and create a new HTML document
    and throw the following stuff into it:


    [Click here to view code image](#part0035.xhtml_p099pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


      <style>


        #container {


          padding: 50px;


          background-color: #FFF;


        }


      </style>


    </head>


    <body>


      <div id="container"></div>


      <script type="text/babel">


        var Circle = React.createClass({


          render: function() {


              var circleStyle = {


                padding: 10,


                margin: 20,


                display: "inline-block",


                backgroundColor: this.props.bgColor,


                borderRadius: "50%",


                width: 100,


                height: 100,


              };


              return (


                <div style={circleStyle}>


                </div>


              );


            }


        });


        var destination = document.querySelector("#container");


        ReactDOM.render(


          <div>


            <Circle bgColor="#F9C240"/>


          </div>,


          destination


        );


      </script>


    </body>


    </html>


    Once you have your document set up, go ahead and preview what you have in your
    browser. If everything went well, you will be greeted by a happy yellow circle
    (see [Figure 9-1](#part0016.xhtml_ch09fig01)).


    ![Image](Images/image00271.jpeg)


    Figure 9-1 If everything went well, you will get this yellow circle.


    If you see what I see, great! Now, let’s take a moment to understand what our
    example is doing. The bulk of what you see comes from the `Circle` component:


    [Click here to view code image](#part0035.xhtml_p101pro01)


    var Circle = React.createClass({


      render: function() {


          var circleStyle = {


            padding: 10,


            margin: 20,


            display: "inline-block",


            backgroundColor: this.props.bgColor,


            borderRadius: "50%",


            width: 100,


            height: 100,


          };


          return (


            <div style={circleStyle}>


            </div>


          );


        }


    });


    It is mostly made up of our `circleStyle` object that contains the inline style
    properties that turn our boring `div` into an awesome circle. All the style values
    are hard-coded except for the `backgroundColor` property. It takes its value from
    the `bgColor` prop that gets passed in.


    Going beyond our component, the way we ultimately display our circle is via our
    usual `ReactDOM.render` method:


    [Click here to view code image](#part0035.xhtml_p102pro01)


    ReactDOM.render(


      <div>


        <Circle bgColor="#F9C240"/>


      </div>,


      destination


    );


    We have a single instance of our `Circle` component declared, and we declare it
    with the `bgColor` prop set to the color we want our circle to appear in. Now,
    having our `Circle` component be defined as-is inside our render method is a bit
    limiting - especially if you are going to be dealing with data that could affect
    what our `Circle` component does. In the next couple of sections, we’ll look at
    the ways we have for solving that.


    ### Your JSX Can Be Anywhere—Part II


    In the “[Meet JSX—Again](#part0014.xhtml_ch07)”! chapter ([Chapter 7](#part0014.xhtml_ch07)),
    we learned that our JSX can actually live outside of a render function and can
    be used as a value assigned to a variable or property. For example, we can fearlessly
    do something like this:


    [Click here to view code image](#part0035.xhtml_p102pro02)


    var theCircle = <Circle bgColor="#F9C240"/>;


    ReactDOM.render(


      <div>


        {theCircle}


      </div>,


      destination


    );


    The `theCircle` variable stores the JSX for instantiating our `Circle` component.
    Evaluating this variable inside our `ReactDOM.render` function results in a circle
    getting displayed. The end result is no different than what we had earlier, but
    having our `Circle` component instantiation freed from the shackles of the `render`
    method gives us more options to do crazy and cool things.


    For example, you can go further and create a function that returns a `Circle`
    component:


    [Click here to view code image](#part0035.xhtml_p102pro03)


    function showCircle() {


      var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363"];


      var ran = Math.floor(Math.random() * colors.length);


      // return a Circle with a randomly chosen color


      return <Circle bgColor={colors[ran]}/>;


    };


    In this case, the `showCircle` function returns a `Circle` component (boring!)
    with the value for the `bgColor` prop set to a random color value (awesomesauce!).
    To have our example use the `showCircle` function, all you have to do is evaluate
    it inside `ReactDOM.render`:


    1   ReactDOM.render(


    2     <div>


    3      {showCircle()} 


    4    </div>,


    5    destination


    6    );'
