    \nFigure 5-10 The red portion appears.\n\nThe cool thing to call out is that we\
    \ called our `Square` component from inside the `Card` component! This is an example\
    \ of composability where one component relies on the output of another component.\
    \ The final thing you see is the result of these two components colluding with\
