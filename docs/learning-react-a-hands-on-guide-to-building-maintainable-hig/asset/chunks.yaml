    \ cardStyle },\n    React.createElement(Square, { color: this.props.color }),\n\
    \    React.createElement(Label, { color: this.props.color })\n  );\n}\n```\n\n\
    注意，这里没有任何 JSX 的痕迹！你所编写的内容与浏览器所看到的内容之间的这些变化都是我们在第一章中讨论过的编译步骤的一部分。这种编译是在 `Babel`\
    \ 的帮助下完全在后台完成的，我们一直一直在使用它在浏览器中完全完成这种 JSX→JS 的转换。我们最终会查看将 `Babel` 作为更复杂的构建环境的一部分，在其中我们只需生成一个转换后的\
