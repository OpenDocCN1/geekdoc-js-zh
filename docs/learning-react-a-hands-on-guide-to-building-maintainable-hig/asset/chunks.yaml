    \nYou start off with a blank app that allows you to enter tasks for later (see\
    \ [Figure 14-1](#part0021.xhtml_ch14fig01)).\n\n![Image](Images/image00293.jpeg)\n\
    \nFigure 14-1 A blank app with task entry.\n\nThe way this Todo List app works\
    \ is pretty simple. Type in a task or whatever you want into the text field and\
