    \n[Click here to view code image](#part0030.xhtml_p045pro01)\n\n```javascript\n\
    var letterStyle = {\n  padding: 10,\n  margin: 10,\n  backgroundColor: this.props.bgColor,\n\
    \  color: \"#333\",\n  display: \"inline-block\",\n  fontFamily: \"monospace\"\
    ,\n  fontSize: \"32\",\n  textAlign: \"center\"\n};\n```\n\nNotice that for some\
    \ of the properties with a numerical value such as `padding`, `margin`, and `fontSize`,\
    \ we didn’t specify the `px` suffix at all. That is because, at runtime, React\
    \ will add the `px` suffix automatically.\n\nThe only number-related properties\
    \ React won’t add a pixel suffix to automatically are the following properties:\
    \ `animationIterationCount`, `boxFlex`, `boxFlexGroup`, `boxOrdinalGroup`, `columnCount`,\
    \ `fillOpacity`, `flex`, `flexGrow`, `flexPositive`, `flexShrink`, `flexNegative`,\
    \ `flexOrder`, `fontWeight`, `lineClamp`, `lineHeight`, `opacity`, `order`, `orphans`,\
    \ `stopOpacity`, `strokeDashoffset`, `strokeOpacity`, `strokeWidth`, `tabSize`,\
    \ `widows`, `zIndex`, and `zoom`. While I wish I could tell you that I walk around\
    \ with this information memorized, I actually just referred to this article: [https://facebook.github.io/react/tips/style-props-value-px.html](https://facebook.github.io/react/tips/style-props-value-px.html)\
