    \ `}` 这种大括号：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n    <div class=\"\
    slideIn\">\n       <p class=\"emphasis\">Gabagool!</p>\n       <Label\n             /*\
    \ 这个注释\n                跨越了\n                多行 */\n             className=\"\
    colorCard\" // 行末注释\n       />\n    </div>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\n在这个代码中，你可以看到多行注释和行末注释的示例。既然你已经了解了这些，你再也没有借口不给你的 JSX 写注释了：P\n\n###\
    \ 大写字母、HTML 元素与组件\n\n字母大小写非常重要。为了表示 HTML 元素，请确保 HTML 标签为小写：\n\n点击此处查看代码图片\n\n\
    ```javascript\nReactDOM.render(\n    <div>\n      <section>\n            <p>这里有一些内容!</p>\n\
    \      </�</section>\n    </div>,\n  document.querySelector(\"#container\")\n\
    );\n```\n\n当你想要表示组件时，组件名称必须大写，无论是在 JSX 中还是在定义它们时都是如此：\n\n点击此处查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n    <div>\n      <MyCustomComponent/>\n    </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n如果你写错了大小写，React 将无法正常渲染你的内容。组件将无法被找到。当程序运行异常时，尝试识别大小写问题可能是你最后才会考虑的事项，所以请记住这个小贴士。\n\
    \n### 你的 JSX 可以出现在任何地方\n\n在很多情况下，你的 JSX 并不会像我们目前看到的示例那样整齐地排列在 `render` 或 `return`\
    \ 函数内部。看下下面的示例：\n\n点击此处查看代码图片\n\n```javascript\nvar swatchComponent = <Swatch\
    \ color=\"#2F004F\"></Swatch>;\n\nReactDOM.render(\n    <div>\n      {swatchComponent}\n\
    \    </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n我们有一个名为 `swatchComponent`\
    \ 的变量，它被初始化为一行 JSX。当我们的 `swatchComponent` 变量被放在 `render` 函数内部时，我们的 `Swatch` 组件就会被初始化。这一切都是完全有效的，在我们未来学习生成和操作\
    \ JSX 时，我们还会做更多事情。\n\n### 结论\n\n通过这一章，我们终于把之前章节介绍的 JSX 的各个部分整合在了一起。最重要的一点是：JSX\
    \ 不是 HTML。它在许多场景下看起来像 HTML，行为也像 HTML，但它最终被设计成翻译成 JavaScript。这意味着你可以做一些使用纯 HTML\
    \ 无法想象的事情。能够评估表达式或通过编程方式操作 JSX 块仅仅是一个开始。在接下来的章节中，我们将探索 JavaScript 和 JSX 的交汇。\n\
    \n## 8. 处理状态 (State)\n\n到目前为止，我们创建的组件都是无状态的（stateless）。它们拥有从父元素传递的属性（即 props），但一旦组件运行，它们（通常）不会发生任何变化。你的属性一旦设置，就被认为是不可变的。在许多场景下，你并不希望这样。你希望根据某些交互（或从服务器获取的数据或其他数百万事情！）来改变组件的某些方面。\n\
    \n我们需要另一种在组件上存储数据的方法，而不仅仅属性。我们需要一种存储可以更改的数据的方法。我们需要被称为**状态（state）**的东西！在本章中，你将学习它以及如何使用它来创建有状态的组件。\n\
    \n### 使用状态\n\n如果你知道如何处理属性，你也就完全知道如何处理状态了……某种程度上。它们之间存在一些差异，但目前太细微了，没必要让你感到无聊。相反，让我们直接进入主题，通过在一个小示例中使用状态来观察它的运行情况。\n\
    \n我们将创建一个简单的计数器示例，如图 8-1 所示。\n\n![Figure 8-1](img/image269.jpeg)\n\n这个示例做的并没有什么疯狂。闪电每秒大约击中地球表面\
    \ 100 次（[`environment.nationalgeographic.com/natural-disasters/lightning-profile/`](http://environment.nationalgeographic.com/natural-disasters/lightning-profile/)）。我们有一个计数器，它只是根据你看到的数量相应地增加。\n\
    \n#### 起点\n\n这个示例的重点是展示我们如何处理状态。与其从头开始，不如修改现有的 HTML 文档创建以下内容：\n\n点击此处查看代码图片\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>更多状态!</title>\n  <script src=\"\
    https://unpkg.com/react@15.6/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@15.6/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/6.26/babel.min.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script type=\"\
    text/babel\">\n    var LightningCounter = React.createClass({\n      render: function()\
    \ {\n        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n\
    \n    var LightningCounterDisplay = React.createClass({\n      render: function()\
    \ {\n        var divStyle = {\n          width: 250,\n          textAlign: \"\
    center\",\n          backgroundColor: \"black\",\n          padding: 40,\n   \
    \       fontFamily: \"sans-serif\",\n          color: \"#999\",\n          borderRadius:\
    \ 10\n        };\n        return(\n          <div style={divStyle}>\n        \
    \    <LightningCounter/>\n          </div>\n        );\n      }\n    });\n\n \
    \   ReactDOM.render(\n      <LightningCounterDisplay/>,\n      document.querySelector(\"\
    #container\")\n    );\n  </script>\n</body>\n</html>\n```\n\n此时，请花点时间观察我们现在的代码。首先，我们有一个名为\
    \ `LightningCounter` 的组件：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  render: function() {\n    return (\n      <h1>Hello!</h1>\n\
    \    );\n  }\n});\n```\n\n这个组件的大部分是 `divStyle` 对象，它包含了负责酷炫背景的信息。`render` 函数返回一个包裹了\
    \ `LightningCounter` 组件的 `div` 元素。\n\n```javascript\nvar LightningCounterDisplay\
    \ = React.createClass({\n  render: function() {\n    var divStyle = {\n      width:\
    \ 250,\n      textAlign: \"center\",\n      backgroundColor: \"black\",\n    \
    \  padding: 40,\n      fontFamily: \"sans-serif\",\n      color: \"#999\",\n \
    \     borderRadius: 10\n    };\n    return(\n      <div style={divStyle}>\n  \
    \      <LightningCounter/>\n      </div>\n    );\n  }\n});\n```\n\n这个组件目前看起来没什么有趣的。它只是返回了\
    \ **Hello!** 没关系——我们稍后会修复这个组件。\n\n"
- fmt: "\nIt just pushes the `LightningCounterDisplay` component into our container\
    \ `div` element in our DOM. That’s pretty much it. The end result is that you\
    \ see the combination of markup from our `ReactDOM.render` method and the `LightningCounterDisplay`\
    \ and `LightningCounter` components.\n\n### Getting Our Counter On\n\nNow that\
    \ we have an idea of what we are starting with, it’s time to make plans for our\
    \ next steps. The way our counter works is pretty simple. We are going to be using\
    \ a `setInterval` function that calls some code every 1000 milliseconds (aka 1\
    \ second). That “some code” is going to increment a value by 100 each time it\
    \ is called. Seems pretty straightforward, right?\n\nTo make this all work, we\
    \ are going to be relying on three APIs that our React Component exposes:\n\n\
    ![Image](Images/image00226.jpeg) `getInitialState`—This method runs just before\
    \ your component gets mounted, and it allows you to modify a component’s `state`\
    \ object.\n\n![Image](Images/image00226.jpeg) `componentDidMount`—This method\
    \ gets called just after our component gets rendered (or mounted as React calls\
    \ it).\n\n![Image](Images/image00226.jpeg) `setState`—This method allows you to\
    \ update the value of the `state` object.\n\nWe’ll see these APIs in use shortly,\
    \ but I wanted to give you a preview of them so that you can spot them easily\
    \ in a lineup!\n\n### Setting the Initial State Value\n\nWe need a variable to\
    \ act as our counter, and let’s call this variable `strikes`. There are a bunch\
    \ of ways to create this variable. The most obvious one is the following:\n\n\
    ```javascript\nvar strikes = 0 // :P\n```\n\nWe don’t want to do that, though.\
    \ For our example, the `strikes` variable is part of our component’s state, and\
    \ its value is what we display on screen. What we are going to do is use the `getInitialState`\
    \ method that we briefly saw a few moments ago and take care of initializing our\
    \ variable inside it. You’ll see in a few moments what result that has on our\
    \ component’s state.\n\nInside your `LightningCounter` component, add the following\
    \ highlighted lines:\n\n[Click here to view code image](#part0034.xhtml_p093pro01)\n\
    \n```javascript\nvar LightningCounter = React.createClass({\n  getInitialState:\
    \ function() { \n    return {                          \n      strikes: 0    \
    \                \n    };                          \n  },                    \
    \        \n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\nThe `getInitialState` method automatically runs waaaay\
    \ before your component gets rendered, and what we are doing is telling React\
    \ to return an object containing our `strikes` property (initialized to 0). You\
    \ may be wondering to whom or what we are returning this object to? All of that\
    \ is magic that happens under the covers. *The object that gets returned is set\
    \ as the initial value for our component’s `state` object*.\n\nIf we inspect the\
    \ value of our `state` object after this code has run, it would look something\
    \ like the following:\n\n```javascript\nvar state = {\n  strikes: 0\n}\n```\n\n\
    Before we wrap this section up, let’s visualize our `strikes` property. In our\
    \ `render` method, make the following highlighted change:\n\n[Click here to view\
    \ code image](#part0034.xhtml_p094pro01)\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\
    \ \n    );\n  }\n});\n```\n\nWhat we’ve done is replaced our default Hello! text\
    \ with an expression that displays the value stored by the `this.state.strikes`\
    \ property. If you preview your example in the browser, you will see a value of\
    \ 0 displayed. That’s a start!\n\n### Starting Our Timer and Setting State\n\n\
    Next up is getting our timer going and incrementing our `strikes` property. Like\
    \ we mentioned, we will be using the `setInterval` function to increase the `strikes`\
    \ property by 100 every second. We are going to do all of this immediately after\
    \ our component has been rendered using the built-in `componentDidMount` method.\n\
    \nThe code for kicking off our timer looks as follows:\n\n[Click here to view\
    \ code image](#part0034.xhtml_p094pro02)\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  componentDidMount: function() {\n    setInterval(this.timerTick,\
    \ 1000);\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n\nGo ahead and add these highlighted lines to our example.\
    \ Inside our `componentDidMount` method that gets called once our component gets\
    \ rendered, we have our `setInterval` method that calls a `timerTick` function\
    \ every second (or 1000 milliseconds).\n\nWe haven’t defined our `timerTick` function,\
    \ so let’s fix that by adding the highlighted lines to our code:\n\n[Click here\
    \ to view code image](#part0034.xhtml_p095pro01)\n\n```javascript\nvar LightningCounter\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ strikes: 0\n    };\n  },\n  timerTick: function() {\n    this.setState({\n \
    \     strikes: this.state.strikes + 100\n    });\n  },\n  componentDidMount: function()\
    \ {\n    setInterval(this.timerTick, 1000);\n  },\n  render: function() {\n  \
    \  return (\n      <h1>{this.state.strikes}</h1>\n    );\n  }\n});\n```\n\nWhat\
    \ our `timerTick` function does is pretty simple. It just calls `setState`. The\
    \ `setState` method comes in various flavors, but for what we are doing here,\
    \ it just takes an object as its argument. This object contains all the properties\
    \ you want to merge into the state object. In our case, we are specifying the\
    \ `strikes` property and setting its value to be 100 more than what it is currently.\n\
    \nHow does `timerTick` maintain context?\n\nIn regular JavaScript, the `timerTick`\
    \ function won’t maintain context. You have to do extra work to support that.\
    \ The reason it works in the React world is because of something known as autobinding.\
    \ Now, aren’t you glad you know that?\n\n### Rendering the State Change\n\nIf\
    \ you preview your app now, you’ll see our `strikes` value start to increment\
    \ by 100 every second (see [Figure 8-2](#part0015.xhtml_ch08fig02)).\n\n![Image](Images/image00270.jpeg)\n\
    \nFigure 8-2 The `strikes` value increments by 100 every second.\n\nLet’s ignore\
    \ for a moment what happens with our code. That is pretty straightforward. The\
    \ interesting thing is how everything we’ve done ends up updating what you see\
    \ on the screen. That updating has to do with this React behavior: Whenever you\
    \ call `setState` and update something in the `state` object, your component’s\
    \ `render` method gets automatically called. This kicks off a cascade of `render`\
    \ calls for any component whose output is also affected. The end result of all\
    \ this is what you see in your screen in the latest representation of your app’s\
    \ UI state. Keeping your data and UI in sync is one of the hardest problems with\
    \ UI development, so it’s nice that React takes care of this for us.\n\n### Optional:\
    \ The Full Code\n\nWhat we have right now is just a counter that increments by\
    \ 100 every second. Nothing about it screams *Lightning Counter*, but it does\
    \ cover everything about states that I wanted you to learn right now. If you want\
    \ to optionally flesh out your example to look like my version that you saw at\
    \ the beginning, below is the full code for what goes inside our `script` tag:\n\
    \n[Click here to view code image](#part0034.xhtml_p096pro01)\n\n```javascript\n\
    var LightningCounter = React.createClass({\n  getInitialState: function() {\n\
    \    return {\n      strikes: 0\n    };\n  },\n  timerTick: function() {\n   \
    \ this.setState({\n      strikes: this.state.strikes + 100\n    });\n  },\n  componentDidMount:\
    \ function() {\n    setInterval(this.timerTick, 1000);\n  },\n  render: function()\
    \ {\n```\n"
