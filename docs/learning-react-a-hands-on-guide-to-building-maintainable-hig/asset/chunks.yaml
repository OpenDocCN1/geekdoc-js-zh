  trans: "\n在现实世界中，你被要求在 React 中实现的绝不会像名称列表或彩色的元音块那么简单。相反，你将得到某个复杂用户界面的视觉表示形式。这种视觉呈现可以有许多形式——涂鸦、图表、截图、视频、红线、设计稿（comp）等。让所有这些静态像素活起来取决于你，而我们将通过一些实践练习来完成这一任务。\n\
    \n我们要创建一个简单的调色板卡片（参见图 5-2）。\n\n![Image](img/image0025.jpeg)\n\n图 5-2 一个简单的调色板卡片。\n\
    \n如果你不知道这些，它们是小矩形卡片，帮助你将颜色与特定类型的油漆匹配。你经常会在家居用品商店或任何出售油漆的地方看到它们。你的设计师朋友可能在家里有一个巨大的衣柜专门用来放这些东西。总之，`我们的任务是使用\
    \ React 重现这些卡片之一`。\n\n实现这一目标有多种方法，但我将向你展示一种非常系统化的方法，这将帮助你简化并理解即使是最复杂的用户界面。这种方法涉及两个步骤：\n\
    \n1. 识别主要的视觉元素\n2. 确定组件将是什么\n\n这两个步骤听起来都非常复杂，但随着我们的不断进行，你会发现这没什么好担心的。\n\n### 识别主要的视觉元素\n\
    \n第一步是识别我们正在处理的所有视觉元素。没有哪个视觉元素是微小到可以忽略的——至少最初不是这样。识别相关部分最简单的方法是从显而易见的视觉元素开始，然后深入研究不那么显而易见的元素。\n\
    \n我们在示例中看到的第一个东西是卡片本身（参见图 5.3）。\n\n![Image](img/image00251.jpeg)\n\n图 5-3 卡片。\n\
    \n在卡片内部，你会看到有两个不同的区域。顶部区域是一个显示特定颜色的矩形区域。底部是一个显示十六进制值（hex value）的白色区域。\n\n让我们给这两个视觉元素命名，并将它们排列成一个树状结构，如图\
    \ 5-4 所示。\n\n![Image](img/image00252.jpeg)\n\n图 5-4 树状结构。\n\n将你的视觉效果排列成这种树状结构（又称为\
    \ `视觉层级结构`）是更好地感受视觉元素如何分组的良好方法。这个练习的目标是识别重要的视觉元素并将它们分解为父/子结构，直到你无法进一步划分它们。\n\n\
    ***\n\n**尝试忽略实现细节**\n\n虽然这很难，但现在先不要考虑实现细节。不要专注于根据需要什么样的 `HTML` 和 `CSS` 组合来划分你的视觉元素。以后有的是时间做这些！\n\
    \n***\n\n继续下去，我们可以看到我们彩色的矩形不是我们可以可以进一步划分的东西。但这并不意味着我们已经结束了。我们可以进一步将标签与围绕它的白色区域划分开来。现在，我们的视觉层级结构如图\
    \ 5-5 所示，我们的标签和白色区域占据了树中的独立位置。\n\n![Image](img/image00253.jpeg)\n\n图 5-5 将内容进一步划分为标签和围绕它的白色区域。\n\
    \n在这一点上，我们没有其他可以进一步划分的内容了。我们完成了视觉元素的识别和划分，因此下一步是利用我们在这里发现的，来帮助我们识别组件。\n\n### 识别组件\n\
    \n这里事情变得有点有趣了。我们需要确定已识别的视觉元素中哪些将转换为组件，哪些将不会。并不是每个视觉元素都需要转换为组件，我们显然也不想创建几个极其复杂的组件。这需要一种平衡（参见图\
    \ 5-6）。\n\n![Image](img/image00254.jpeg)\n\n图 5-6 组件既不过少也不过多。\n\n确定哪些视觉元素成为组件的一部分，哪些不是，这是一门艺术。`通用的规则是，我们的组件应该只做一件事`。如果你发现你的潜在组件最终会做太多的事情，那么你可能想将该组件拆拆分为多个组件。反之，如果你的潜在组件所做的事情太少，那么你可能想完全跳过将该视觉元素创建为组件。\n\
    \n让我们尝试确定示例中的哪些元素可以作为良好的组件。从观察我们的视觉层级结构来看，一眼就能看出，卡片和彩色矩形看起来都符合制作优秀组件的标准。卡片充当外部容器，而彩色矩形仅显示颜色。\n\
    \n但这在我们的标签以及围绕它的白色区域上打了一个问号（参见图 5-7）。\n\n![Image](img/image00255.jpeg)\n\n图 5-7\
    \ 标签及其周围空白区域的问号。\n\n这里的关键部分是标签本身。没有了它，我们就看不到十六进制值。剩下的只有白色区域。它所起的作用微乎其微。\n\n在这一点上，我们没有其他可以进一步划分的内容了。我们已经确定了组件，视觉层级结构如图\
    \ 5-8 所示。\n\n![Image](img/image0256.jpeg)\n\n图 5-8 三组件。\n\n这里重要的点是，视觉层级结构对我们定义代码的帮助比对最终产品的样子的影响要大。你会发现它与我们开始时的视觉层级结构有所不同。\n\
    \n好了，一旦我们确定了组件以及它们之间的关系，现在是时候让我们的调色板卡片活起来了。\n\n### 创建组件\n\n这部分是简单的——好吧！现在是时候开始编写代码了。我们首先需要的是一个空的\
    \ HTML 页面作为起点：\n\n点击此处查看代码\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>更多组件</title>\n\
    \  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script\
    \ src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n  <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.2/standalone.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\
    \  <script type=\"text/babel\">\n    ReactDOM.render(\n      <div></div>\n   \
    \   document.querySelector(\"#container\")\n    );\n  </script>\n</body>\n</html>\n\
    ```\n\n花点时间看看这个页面在运行什么。没什么——仅仅是让 React 将一个空的 `div` 渲染到我们的 `container` 元素中。\n\n\
    完成这些之后，是时候定义我们的三个组件了。我们将为组件使用的名称将是 `Card`、`Label` 和 `Square`。在 `ReactDOM.render`\
    \ 函数上方添加以下代码：\n\n```javascript\nvar Square = React.createClass({\n  render: function()\
    \ {\n    return(\n      <p>Nothing</p>\n    );\n  }\n});\n```\n"
