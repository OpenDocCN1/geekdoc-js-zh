    text field. This allows us to enter additional color values and submit them easily
    without having to manually keep jumping focus back and forth between the text
    field and the button. Isn’t that much nicer?


    Getting this behavior right using JSX and traditional React techniques is hard.
    We aren’t even going to bother with explaining how to go about that. Getting this
    behavior right by dealing with the JavaScript DOM API on various HTML elements
    directly is pretty easy. Guess what we are going to do? In the following sections,
    we use something known as refs that React provides to help us access the DOM API
    on HTML elements. This chapter sounds really REALLY boring, but it is going to
    be a fun one—I’m mostly sure of it.


    ### Meet Refs


    As you know very well by now, inside our various `render` methods, we’ve been
    writing HTML-like things known as JSX. Our JSX is simply a description of what
    the DOM should look like. It doesn’t represent actual HTML—despite looking a whole
    lot like it. Anyway, to provide a bridge between JSX and the final HTML elements
    in the DOM, React provides us with something funnily known as **refs** (short
    for *references*).


    The way refs work is a little odd. The easiest way to make sense of it is to look
    at an example. Let’s say we have a `render` method from our **Colorizer** example
    that looks as follows:


    [Click here to view code image](#part0038.xhtml_p138pro01)


    render: function() {


      var squareStyle = {


        backgroundColor: this.state.bgColor


      };


      return (


        <div className="colorArea">


          <div style={squareStyle} className="colorSquare"></div>


          <form onSubmit={this.setNewColor}>


            <input


              onChange={this.colorValue}


              placeholder="Enter a color value">


            </input>


            <button type="submit">go</button>


          </form>


        </div>


      );


    }


    Inside this `render` method, we are returning a big chunk of JSX representing
    (among other things) the `input` element where we enter our color value. What
    we want to do is access the `input` element’s DOM representation so that we can
    call some APIs on it using JavaScript.


    The way we do that using refs is by setting the `ref` attribute on the element
    we would like to reference the HTML of:


    [Click here to view code image](#part0038.xhtml_p138pro02)


    render: function() {


      var squareStyle = {


        backgroundColor: this.state.bgColor


      };


      return (


        <div className="colorArea">


          <div style={squareStyle} className="colorSquare"></div>


          <form onSubmit={this.setNewColor}>


            <input


                ref={} 


                onChange={this.colorValue}


                placeholder="Enter a color value">


            </input>


            <button type="submit">go</button>


          </form>


        </div>


      );


    }


    Because we are interested in the `input` element, our `ref` attribute is attached
    to it. Right now, our `ref` attribute is empty. What you typically set as the
    `ref` attribute’s value is a JavaScript callback function. This function gets
    called automatically when the component housing this render method gets mounted.
    If we set our `ref` attribute’s value to a simple JavaScript function that stores
    a reference to the referenced DOM element, it would look something like the following
    highlighted lines:


    [Click here to view code image](#part0038.xhtml_p139pro01)


     1  render: function() {


     2    var squareStyle = {


     3      backgroundColor: this.state.bgColor


     4    };


     5


     6     var self = this; 


     7


     8     return (


     9       <div className="colorArea">


    10         <div style={squareStyle} className="colorSquare"></div>


    11


    12         <form onSubmit={this.setNewColor}>


    13           <input


    14               ref={


    15                     function(el) {      


    16                       self._input = el; 


    17                     }                   


    18                   }


    19               onChange={this.colorValue}


    20               placeholder="Enter a color value">


    21           </input>


    22           <button type="submit">go</button>


    23         </form>


    24      </div>


    25    );


    26  }


    The end result of this code running once our component mounts is simple: we can
    access the HTML representing our `input` element from anywhere inside our component
    by calling `this._input`. Take a few moments to see how the highlighted lines
    of code help do that. Once you are done, we’ll walk through this code together.


    First, our callback function looks as follows:


    function(el) {


        self._input = el;


    }


    This anonymous function gets called when our component mounts, and a reference
    to the final HTML DOM element is passed in as an argument. We capture this argument
    using the `el` identifier, but you can use any name for this argument that you
    want. The body of this callback function simply sets a custom property called
    `_input` to the value of our DOM element. To ensure we create this property on
    our component, we use the `self` variable to create a closure where the `this`
    in question refers to our component as opposed to the callback function itself.
    (Autobinding doesn’t happen automatically this time around!)


    Taking a step back and looking at the bigger picture that ties everything together
    including the `render` method we just saw, let’s look at the full `Colorizer`
    component with all of the `ref`-related shenanigans highlighted:


    [Click here to view code image](#part0038.xhtml_p140pro01)


    var Colorizer = React.createClass({


        getInitialState: function() {


          return {


              color: ’’,


              bgColor: ’’


          }


        },


        colorValue: function(e) {


          this.setState({color: e.target.value});


        },


        setNewColor: function(e){


          this.setState({bgColor: this.state.color});


          this._input.value = ""; 


          this._input.focus();    


          e.preventDefault();


        },


        render: function() {


          var squareStyle = {


            backgroundColor: this.state.bgColor


          };


          var self = this; 


          return (


            <div className="colorArea">


              <div style={squareStyle} className="colorSquare"></div>


              <form onSubmit={this.setNewColor}>


                <input


                    ref={                     


                          function(el) {      


                            self._input = el; 


                          }                   


                        }                     


                    onChange={this.colorValue}


                    placeholder="Enter a color value">


                </input>


                <button type="submit">go</button>


              </form>


            </div>


          );


        }


    });


    Focusing just on what happens to our `input` element, when the form gets submitted
    and the `setNewColor` method gets called, we clear the contents of our `input`
    element by calling `this._input.value = “”`. We set focus to our `input` element
    by calling `this._input.focus()`. All of our `ref-` related work was simply to
    enable these two lines where we needed some way to have `this._input` point to
    the HTML element representing our `input` element that we define in JSX. Once
    we figured that out, we just call the `value` property and `focus` method the
    DOM API exposes on this element.


    * * *


    Simplifying Further with ES6 Arrow Functions


    Learning React is hard enough, so I have tried to shy away from forcing you to
    use ES6 techniques by default. When it comes to working with the `ref` attribute,
    using arrow functions to deal with the callback function does simplify matters
    a bit. This is one of those cases where I recommend you use an ES6 technique.


    As you saw a few moments ago, to assign a property on our component to the referenced
    HTML element, we did something like this:


    [Click here to view code image](#part0038.xhtml_p141pro01)


    <input


        ref={


              function(el) {


                self._input = el;


              }


            }


        onChange={this.colorValue}


        placeholder="Enter a color value">


    </input>'
