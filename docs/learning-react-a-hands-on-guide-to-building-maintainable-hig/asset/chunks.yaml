  trans: "\n\n为了处理作用域的各种混乱问题，我们创建了一个初始化为 `this` 的 `self` 变量，以确保我们在组件上创建了 `_input`\
    \ 属性。这看起来似乎没必要那么复杂。\n\n使用箭头函数，我们可以将这一切简化为以下内容：\n\n点击此处查看代码图片\n\n```html\n<input\n\
    \    ref={\n        (el) => this._input = el\n    }\n    onChange={this.colorValue}\n\
    \    placeholder=\"Enter a color value\">\n</input>\n```\n\n最终结果与我们之前花费大量时间查看的内容完全相同，而且由于箭头函数处理作用域的方式，你可以在函数体内部使用\
    \ `this` 并引用组件，而无需进行任何额外工作。不需要等效的外部 `self` 变量！\n\n***\n\n### 结论\n\n在本教程中，我们看到了直接访问\
    \ DOM 元素是多么的“轻而易举”。React 曾经提供过一种更简单的方法来引用元素。你可以在元素上设置 `refs` 属性并将其初始化为一个字符串值：\n\
    \n点击此处查看代码图片\n\n```html\n<button refs=\"myButton\">Click me!</button>\n```\n\n\
    然后你可以在组件挂载后通过类似 `this.refs.myButton` 的操作来访问该元素。在你对使用这种方法代替我们带有 `ref` 属性的函数回调方法感到兴奋之前，请注意，这种基于字符串的方法很可能会被弃用。在本文写作时它是有效的，但谁能知道它什么时候会停止工作呢。现在，鉴于它即将消失，你可能可能会奇我为什么还要告诉你这些。坦率地说，我真的完全不知道\
    \ :P\n\n## 13. 使用 React Router 创建单页应用\n\n现在你已经熟悉了如何使用 React 的基本知识，让我们把难度提高一个阶次。我们要的是使用\
    \ React 构建一个简单的**单页应用**（酷的人们——以及住在斯堪的纳维亚的人也称之为 **SPA**）。正如我们在很久以前的第 1 章 中讨论过的那样，单页应用与随处可见的传统多页应用不同。最大的区别在于，导航单页应用并不涉及跳转到一个全新的页面。相反，你的页面（在此语境下通常称为**视图**）通常在同一个页面内内联加载，如图图\
    \ 13-1 所示。\n\n![Image](img/image00287.jpeg)\n\n图 13-1 单页应用使用内联加载视图而不是加载新页面。\n\n\
    当你内联加载内容时，事情会变得有点具挑战性。困难的部分不是加载内容本身，那相对容易。困难的部分在于确保单页应用的行为与用户的习惯保持一致。更具体地说，当用户导航你的应用时，他们期望：\n\
    \n1. 地址栏中显示的 URL 始终反映他们正在查看的内容。\n2. 他们可以成功地使用浏览器的后退和前进按钮。\n3. 他们可以使用适当的 URL 直接导航到特定的视图（即**深层链接**）。\n\
    \n对于多页应用，这三点是免费提供的。你不需要对其中任何一点做任何额外工作。对于单页应用，因为你没有跳转到一个全新的页面，你必须付出真实的努力来处理这三件*用户期望能够正常工作*的事情。你需要确保应用内的导航能够恰当地调整\
    \ URL。你需要确保浏览器的历史记录与每次导航正确同步，以便用户可以使用后退和前进按钮。如果用户收藏了特定视图或复制/粘贴 URL 以备后访问，你需要确保你的单页应用将用户带到正确的地方。\n\
    \n为了处理这一切，你拥有一整桶通常被称为**路由**（routing）的技术。路由是你尝试将 URL 映射到非物理页面的目标，例如你单页应用中的各个视图。这听起来很复杂，但幸运的是，有很多\
    \ JavaScript 库可以帮助我们。其中一个 JavaScript 库就是本章的主角，React Router **([`github.com/reactjs/react-router`](https://github.com/reactjs/react-router))**。React\
    \ Router 为使用 React 构建的单页应用提供了路由功能，而它的优秀之处在于，它以熟悉的方式扩展了你已经对 React 的了解，带给你所有这些路由的酷炫。在本章中，你将学习关于它是如何做到的——以及希望更多！\n\
    \n### 示例\n\n在继续之前之前让我们让我们来看一个示例（参见图 13-2）。\n\n![Image](img/image00288.jpeg)\n\n\
    图 13-2 使用 React Router 的简单 React 应用。\n\n你在这里看到的是一个使用 React Router 提供所有导航和视图加载功能的简单\
    \ React 应用！虽然应用的截图看起来很不错，但这是那种你想要玩玩这个应用以查看它更多功能的情况之一。请在自己的窗口中打开这个 [`www.curiosity.com/examples/router_final.html`](https://www.curiosity.com/examples/router_final.html)，点击各种视图以查看它们。在接下来的章节中，我们将分部分构建这个应用。到最后，你不仅将重建这个应用，还将学到更多知识。\n\
    \n#### 构建应用\n首先，我们需要做的第一件事是让样板代码运行。。创建一个 HTML 文档并添加以下内容：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>React! React!</title>\n    <script src=\"\
    https://npmcdn.com/react@15.3.0/dist/react.js\"></script>\n    <script src=\"\
    https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"></script>\n    <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n    <style>\n    </style>\n</head>\n<body>\n    <div id=\"container\"\
    ></div>\n    <script type=\"text/babel\">\n        var destination = document.querySelector(\"\
    #container\");\n        ReactDOM.render(\n            <div>\n                Hello!\n\
    \            </div>,\n            destination\n        );\n    </script>\n</body>\n\
    </html>\n```\n\n这个起点与我们之前看到的所有示例几乎相同。这只是一个加载了 React 和 ReactDOM 的几乎空白的应用。如果你在浏览器中预览它，你会看到一个非常孤独的\
    \ Hello！\n\n#### 注意：保持简单\n目前，我们继续依靠浏览器来完成所有繁重工作。稍后我们将考虑通过“现代”构建过程来改变这一点，所以现在享受这种简单性吧\
    \ :P\n\n接下来，由于 React Router 不是 React 的一部分，我们需要添加它的引用。在我们的标记中，找到我们引用脚本的地方，并添加以下高亮行：\n\
    \n```html\n<script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"></script>\n\
    <script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"></script>\n\
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n<script src=\"https://npmcdn.com/react-router/umd/ReactRouter.min.js\"\
    ></script>\n```\n\n通过添加高亮行，我们确保了 React Router 库与核心 React、ReactDOM 以及 Babel 库一起加载。到此时，我们已经准备好开始构建应用，并利用\
    \ React Router 带来的所有酷炫功能。\n\n"
- fmt: "\nWhen building a single-page app, there will always be a part of your page\
    \ that will remain static. This static part, also referred to as an `app frame`,\
    \ could just be one invisible HTML element that acts as the container for all\
    \ of your content, or it could include some additional visual things like a header,\
    \ footer, navigation, etc. In our case, our app frame will involve our navigation\
    \ header and an empty area for content to load in. To display this, we are going\
    \ to create a component that is going to be responsible for this.\n\nInside your\
    \ `script` tag just above your `ReactDOM.render` call, go ahead and add the following\
    \ chunk of JSX and JavaScript:\n\n[Click here to view code image](#part0039.xhtml_p147pro02)\n\
    \n```javascript\nvar App = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h1>Simple SPA</h1>\n        <ul className=\"header\"\
    >\n          <li>Home</li>\n          <li>Stuff</li>\n          <li>Contact</li>\n\
    \        </ul>\n        <div className=\"content\">\n        </div>\n      </div>\n\
    \    )\n  }\n});\n```\n\nOnce you have pasted this, take a look at what we have\
    \ here. What we have is a component called `App` that returns some HTML. To see\
    \ what this HTML looks like, modify your `ReactDOM.render` call to reference this\
    \ component instead of displaying the word `Hello!`. Go ahead and make the following\
    \ highlighted change:\n\n```javascript\nReactDOM.render(\n  <div>\n    <App/>\
    \ \n  </div>,\n  destination\n);\n```\n\nOnce you have done this, preview your\
    \ app in the browser. You should see an unstyled version of an app title and some\
    \ list items (see [Figure 13-3](#part0020.xhtml_ch13fig03)).\n\n![Image](Images/image00289.jpeg)\n\
    \nFigure 13-3 Unstyled version.\n\nI know that this doesn’t look all fancy and\
    \ styled, but that’s OK for now. We will deal with that later. Going a bit deeper,\
    \ what we’ve done is just create a component called `App` and display it via our\
    \ `ReactDOM.render` call. The important thing to call out is that there is nothing\
    \ React Router - specific here. ABSOLUTELY NOTHING! This is straight-up React\
    \ 101\\. Let’s fix that by throwing React Router into the mix. Replace the contents\
    \ of your `ReactDOM.render` call with the following:\n\n[Click here to view code\
    \ image](#part0039.xhtml_p148pro01)\n\n```javascript\nReactDOM.render(\n  <ReactRouter.Router>\
    \                    \n    <ReactRouter.Route path=\"/\" component={App}> \n \
    \   </ReactRouter.Route>                  \n  </ReactRouter.Router>,         \
    \         \n  destination\n);\n```\n\nIgnore how strange everything looks for\
    \ a moment, and just preview your app in the browser after you’ve made this change.\
    \ If everything worked out properly, you will see your `App` component displayed\
    \ just like you saw earlier. Now, let’s figure out why that is the case by learning\
    \ more about what exactly is going on here. This is where we deviate a bit from\
    \ core React concepts and learn things specific to React Router itself.\n\nFirst,\
    \ what we did is specify our `Router` component:\n\n[Click here to view code image](#part0039.xhtml_p149pro01)\n\
    \n```javascript\nReactDOM.render(\n  <ReactRouter.Router>    \n    <ReactRouter.Route\
    \ path=\"/\" component={App}>\n    </ReactRouter.Route>\n  </ReactRouter.Router>,\
    \ \n  destination\n);\n```\n\nThe `Router` component is part of the React Router\
    \ API, and its job is to deal with all of the routing-related logic our app will\
    \ need. Inside this component, we specify what is known as the `routing configuration`.\
    \ That is a fancy term that people use to describe the mapping between URLs and\
    \ the views. The specifics of that are handled by another component called `Route`:\n\
    \n[Click here to view code image](#part0039.xhtml_p149pro02)\n\n```javascript\n\
    ReactDOM.render(\n  <ReactRouter.Router>\n    <ReactRouter.Route path=\"/\" component={App}>\n\
    \    </ReactRouter.Route>\n  </ReactRouter.Router>, \n  destination\n);\n```\n\
    \nThe `Route` component takes several props that help define what to display at\
    \ what URL. The `path` prop specifies the URL we are interested in. In this case,\
    \ it is the root `/`. The `component` prop allows you to specify the name of the\
    \ component you wish to display. For this example, it is `App`. Putting this all\
    \ together, what this `Route` says is: if the URL you are on contains the root,\
    \ go ahead and display the App component. Because this condition is true when\
    \ you preview your app, you see the result of what happens when `App` component\
    \ renders.\n\n### Displaying the Home Page\n\nAs you can sorta see, the way React\
    \ Router provides you with all of this functionality is by using concepts in React\
    \ you are already with—namely `components`, `props`, and `JSX`. What we have right\
    \ now for our app’s frame is a great example of this. Now, it’s time to go further.\
    \ What we want to do next is define the content we will display as part of our\
    \ home view. To do this, we are going to create a component called `Home` that\
    \ is going to contain the markup we want to display. Just above where you have\
    \ your `App` defined, add the following:\n\n[Click here to view code image](#part0039.xhtml_p150pro01)\n\
    \n```javascript\nvar Home = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>\n        <h2>HELLO</h2>\n        <p>Cras facilisis urna ex volutpat,\
    \ et convallis elementum. Ut aliquam, ipsum vitae suscipit, metus bibendum est,\
    \ eget rhoncus nibh nec massa. Maecenas hendrerit augue nec molestie. Cum sociis\
    \ penatibus et magnis parturient montes, ridiculus mus.</p>\n        <p>Duis a\
    \ turpis sed dapibus elementum sed lectus.</p>\n      </div>\n    );\n  }\n});\n\
    ```\n\nAs you can see, our `Home` component doesn’t do anything special. It just\
    \ returns a blob of HTML. Now, what we want to do is display the contents of our\
    \ `Home` component when the page loads. This component is the equivalent of our\
    \ app’s “home page.” The way we do this is simple. Inside our `App` component,\
    \ we have a `div` with a class value of `content`. We are going to load our `Home`\
    \ component inside there.\n\nThe obvious solution might look something like this:\n\
    \n[Click here to view code image](#part0039.xhtml_p150pro02)\n\n```javascript\n\
    var App = React.createClass({\n  render: function() {\n    return (\n      <div>\n\
    \        <h1>Simple SPA</h1>\n        <ul className=\"header\">\n          <li>Home</li>\n\
    \          <li>Stuff</li>\n          <li>Contact</li>\n        </ul>\n       \
    \ <div className=\"content\">\n          <Home/> \n        </div>\n      </div>\n\
    \    )\n  }\n});\n```\n\nNotice that we define our `Home` component inside that\
    \ content `div`. If you preview your app, things will even seem to work (see [Figure\
    \ 13-4](#part0020.xhtml_ch13fig04)).\n\n![Image](Images/image0290.jpeg)\n\nFigure\
    \ 13-4 Increased functionality.\n\nYou see your navigation header, and then you\
    \ see the contents of our `Home` component. While this approach works, it is actually\
    \ the wrong thing to do. It is wrong because it complicates our desire to load\
    \ other pieces of content as the user is navigating around our app. We’ve essentially\
    \ hard-coded our app to only display the `Home` component. That’s a problem, but\
    \ we’ll come back to that in a little bit.\n\n### Interim Cleanup Time\n\nBefore\
    \ we continue making progress on our app, let’s take a short break and make some\
    \ stylistic improvements to what we have so far.\n\n#### Adding the CSS\n\nRight\
    \ now, our app looks very plain...and like something out of the 1800s. To fix\
    \ this, we are going to rely on our dear old friend, CSS. Inside the `style` tag,\
    \ go ahead and add the following style rules:\n\n[Click here to view code image](#part0039.xhtml_p151pro01)\n\
    \n```css\nbody {\n  background-color: #FFCC00;\n  padding: 20px;\n  margin: 0;\n\
    }\n\nh1, h2, p, ul, li {\n  font-family: Helvetica, Arial, sans-serif;\n}\n\n\
    ul.header li {\n  display: inline;\n  list-style-type: none;\n  margin: 0;\n}\n\
    \nul.header {\n  background-color: #111;\n  padding: 0;\n}\n```\n"
