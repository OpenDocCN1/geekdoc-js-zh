    \ look less boring by introducing them to some CSS!\n\nInside your `style` block,\
    \ add the following:\n\n[Click here to view code image](#part0040.xhtml_p167pro1)\n\
    \n```css\nbody {\n  padding: 50px;\n  background-color: #66FF;\n  font-family:\
    \ sans-serif;\n}\n.todoListMain .header input {\n  padding: 10px;\n  font-size:\
    \ 16px;\n  border: 2px solid #FFF;\n}\n.todoListMain .header button {\n  padding:\
    \ 10px;\n  font-size: 16px;\n  margin: 10px;\n  background-color: #006FF;\n  color:\
    \ #FFF;\n  border: 2px solid #006FF;\n}\n.todoListMain .header button:hover {\n\
    \  background-color: #00339;\n  border: 2px solid #00339;\n  cursor: pointer;\n\
    }\n```\n\nOnce you’ve added all of this, preview your app now. Because our HTML\
