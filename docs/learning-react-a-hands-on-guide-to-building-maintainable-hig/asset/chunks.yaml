    \ duplicated markup. Otherwise, if we didn’t use regular CSS, we’ll end up with\
    \ a bunch of giant style objects defined for almost every element in our markup.\
    \ That would make even the most patient among us annoyed when reading the code.\n\
    \nAnyway, once you have added all of this CSS, our app will start to look much\
