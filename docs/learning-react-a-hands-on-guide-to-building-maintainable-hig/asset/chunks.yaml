    \  height: 200,\n    width: 150,\n    padding: 0,\n    backgroundColor: \"#FFF\"\
    ,\n    WebkitFilter: \"drop-shadow(0px 0px 5px #666)\",\n    filter: \"drop-shadow(0px\
