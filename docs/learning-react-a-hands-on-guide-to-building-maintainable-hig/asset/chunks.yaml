    Yes, it is just the outline of our color palette card, but that is definitely\
    \ more than what we started out with just a few moments ago!\n\n### The Square\
    \ Component\n\nIt’s time to go one level down in our component hierarchy and look\
    \ at our `Square` component. This is a pretty straightforward one, so make the\
    \ following highlighted changes:\n\n[Click here to view code image](#part0031.xhtml_p060pro01)\n\
    \n```javascript\n1 var Square = React.createClass({\n2   render: function() {\n\
    3     var squareStyle = {\n4           height: 150,\n5           backgroundColor:\
    \ \"#FF666\"\n6     };\n7     return(\n8       <div style={squareStyle}>\n9  \
    \   </div>\n10  );\n11 });\n```\n\nJust like our `Card` component, we are returning\
    \ a `div` element whose `style` attribute is set to a `style` object that defines\
    \ this component looks. To see our `Square` component in action, we need to get\
    \ it onto our DOM like we did with the `Card` component. The difference this around\
    \ is we won’t be calling the `Square` component via our `ReactDOM.render` function.\
    \ Instead, we’ll call the `Square` component from inside the `Card` component.\
    \ To see what I mean, go back to our `Card` component’s `render` function, and\
    \ make the following change:\n\n[Click here to view code image](#part0031.xhtml_p060pro02)\n\
    \n```javascript\nvar Card = React.createClass({\n  render: function() {\n    var\
    \ cardStyle = {\n      height: 200,\n      width: 150,\n      padding: 0,\n  \
    \    backgroundColor: \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px #666)\"\
    ,\n      filter: \"drop-shadow(0px 0px #666)\"\n    };\n    return (\n      <div\
    \ style={cardStyle}>\n        <Square/>\n      </div>\n    );\n  }\n});\n```\n\
    \nAt this point, if you preview our app, you’ll see a colorful square making an\
