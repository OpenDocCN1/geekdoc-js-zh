  trans: "\n在使用 CSS 之前，你首先需要感受一下 React 输出的 HTML 看起来像什么样。你可以通过查看 `render` 方法中定义的 JSX\
    \ 来轻松地弄明。父级 `render` 方法是我们基于 `ReactDOM` 的那个，它如下所示：\n\n```html\n<div>\n  <Letter>A</Letter>\n\
    \  <Letter>E</Letter>\n  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>\n\
    </div>\n```\n\n我们将各种 `Letter` 组件封装在一个 `div` 标签内部。这里没什么特别的。我们 `Letter` 组件内部的 `render`\
    \ 方法也没有太大区别：\n\n```html\n<div>\n  {this.props.children}\n</div>\n```\n\n如你所见，每个单独的元音都被包裹在自己的一组\
    \ `div` 标签中。如果你实际运行这一切（例如，在浏览器中预览我们的示例），元音的最终 DOM 结构类似于 图 4-3。\n\n![Image](img/image0024.jpeg)\n\
    \n图 4-3 浏览器内部的预览。\n\n忽略容器 `div` 上的 `data-reactroot` 属性（取决于你的 React 版本，你可能甚至看不到），但请注意你看到的其他内容。我们所看到的只是刚才在\
    \ `render` 方法中看到的各种 JSX 片的 HTML 化扩展，元音嵌套在一堆 `div` 元素中。\n\n## 直接样式化！\n\n一旦你理解了想要样式的内容的\
    \ HTML 布局，困难的部分就完成了。现在到了有趣且熟悉的部分：定义样式选择器并指定你想设置的属性。为了影响内部的 `div` 元素，在我们的 `style`\
    \ 标签中添加以下内容：\n\n```css\ndiv div div {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
    \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
    \  font-size: 32px;\n  text-align: center;\n}\n```\n\n`div div div` 选择器将确保我们样式化了正确的对象。结果是我们的元音样式看起来和我们之前看到的一一样。尽管如此，`div\
    \ div div` 样式选择器看起来有点奇怪，不是吗？它太通用了。在具有超过三个嵌套 `div` 元素的应用中（这会非常常见），你可能会样式化错误的内容。在某些时刻，你可能希望更改\
    \ React 生成的 HTML，以便我们的内容更容易被样式化。\n\n我们将解决这个问题的方法是给内部的 `div` 元素赋予一个 `letter` 的\
    \ `class` 值。这就是 JSX 与 HTML 的区别。进行以下高亮更改：\n\n点击此处查看代码图像\n\n```javascript\nvar Letter\
    \ = React.createClass({\n  render: function() {\n    return (\n        <div className=\"\
    letter\"> \n        {this.props.children}\n      </div>\n    );\n  }\n});\n```\n\
    \n注意，我们通过使用 `className` 属性而不是 `class` 属性来指定类值。这是因为 `class` 在 JavaScript 中是一个特殊关键字。如果你不理解这为什么很重要，先不用担心。我们稍后会介绍。\n\
    \n总之，一旦你给 `div` 赋予了 `letter` 的 `className` 属性值，就只有最后一件事。修改 CSS 选择器以更干净地定位我们的 `div`\
    \ 元素：\n\n```css\n.letter {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
    \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
    \  font-size: 32px;\n  text-align: center;\n}\n```\n\n如你所见，使用 CSS 是样式化基于 React\
    \ 应用中内容的完全可行的方法。在下一节中，我们将查看如何使用 React 偏好的方法来样式化内容。\n\n## 用 React 的样式化内容\n\nReact\
    \ 倾向于使用内联方法样式化不使用 CSS 的内容。虽然初看起来看起来有点奇怪，但它的设计目的是帮助让你的视觉效果更具复用性。目标是让你的组件变成小黑盒，所有与\
    \ UI 外观和工作方式相关的内容都存储在那里。让我们亲眼观察一下。\n\n继续我们之前的示例，移除 `.letter` 样式规则。一旦完成此操作，你在浏览器中预览应用时，元音将恢复到未样式的状态。为了完整起见，你应该从\
    \ `Letter` 组件的 `render` 函数中移除 `className` 声明。让我们的标记包含我们不会使用的东西是没有意义的。现在，`Letter`\
    \ 组件恢复到了原始状态：\n\n点击此处查看代码图像\n\n```javascript\nvar Letter = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        {this.props.children}\n\
    \      </div>\n    );\n  }\n});\n```\n\n你在组件内部指定样式的方式是定义一个对象，该对象包含了 CSS 属性和值。你在组件内部指定样式的方式，可以通过定义一个对象，其内容是\
    \ CSS 属性及其值。一旦你有了那个对象，通过 `style` 属性将其赋值给想要样化的 JSX 元素。执行这些步骤后，这会更有意义，所以让我们将其应用到\
    \ `Letter` 组件的输出上。\n\n### 创建样式对象\n\n让我们直接开始，定义包含我们想要应用的样式对象：\n\n点击此处查看代码图像\n\n\
    ```javascript\nvar Letter = React.createClass({\n  render: function() {\n    var\
    \ letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
    \ \"#ffde00\",\n      color: \"#333\",\n      display: \"inline-block\",\n   \
    \   fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\
    \n    };\n    return (\n      <div>\n        {this.props.children}\n      </div>\n\
    \    );\n  }\n});\n```\n\n我们有一个名为 `letterStyle` 的对象，其内部属性就是 CSS 属性名。如果你以前没有在 JavaScript\
    \ 中定义过 CSS 属性（例如通过设置 `object.style`），将它们转换为 JavaScript 好的格式非常简单：\n\n![Image](img/image0024.jpeg)\
    \ 单单词 CSS 属性（如 `padding`、`margin`、`color`）保持不变。\n\n![Image](img/image0024.jpeg)\
    \ 带有连字符的多单词 CSS 属性（如 `background-color`、`font-family`、`border-radius`）被转换为一个单词，删除连字符并将后面的单词大写。例如，使用我们的示例属性，`background-color`\
    \ 将变成 `backgroundColor`，`font-family` 将变成 `fontFamily`，`border-radius` 将变成 `borderRadius`。\n\
    \n我们的 `letterStyle` 对象及其属性几乎是刚才看到的 `.letter` 样式规则的直接 JavaScript 翻译。现在只需要将对象赋值给想要样式化的元素。\n\
    \n### 实际样式化我们的内容\n\n现在有了包含了想要应用的样式对象，剩下的非常简单。找到想要应用样式的元素并将 `style` 属性指向该对象。在我们的情况下，这将是\
    \ `Letter` 组件 `render` 函数返回的 `div` 元素。\n\n查看高亮行以了解在我们的示例中是如何做的：\n\n点击此处查看代码图像\n\
    \n```javascript\nvar Letter = React.createClass({\n  render: function() {\n  \
    \  var letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
    \ \"#ffde00\",\n      color: \"#333\",\n      display: \"inline-block\",\n   \
    \   fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign: \"center\"\
    \n    };\n    return (\n      <div style={letterStyle}> \n        {this.props.children}\n\
    \      </div>\n    );\n  }\n});\n```\n"
- fmt: "\nOur object is called `letterStyle`, so that is what we specify inside the\
    \ curly brackets to let React know to evaluate the expression. That’s all there\
    \ is to it. Go ahead and run the example in the browser to ensure everything works\
    \ properly and all of our vowels are properly styled.\n\nFor some extra validation,\
    \ if you inspect the styling applied to one of the vowels using your browser developer\
    \ tool of choice, you’ll see that the styles are infact applied inline (see [Figure\
    \ 4-4](#part0011.xhtml_ch04fig04)).\n\n![Image](Images/image00247.jpeg)\n\nFigure\
    \ 4-4 The styles are applied inline.\n\nWhile this is no surprise, it might be\
    \ difficult for those of us used to styles being inside style rules to swallow.\
    \ As they say, the Times They Are A Changin’ ([https://www.youtube.com/watch?v=e7qQ6_RV4VQ](https://www.youtube.com/watch?v=e7qQ6_RV4VQ)).\n\
    \n### You Can Omit the “px” Suffix\n\nWhen programmatically setting styles, it’s\
    \ a pain to deal with numbers that need a pixel value suffix. In order to generate\
    \ these values, you need to do some string concatenation on your number to add\
    \ a `px`. To convert from a pixel value back to a number, you need to parse out\
    \ the `px`. All of this isn’t extremely complicated or time consuming, but it\
    \ is a distraction.\n\nTo help with this, React allows you to omit the `px` suffix\
    \ for a bunch of CSS properties. If you recall, our `letterStyle` object looks\
    \ as follows:\n\n[Click here to view code image](#part0030.xhtml_p045pro01)\n\n\
    ```javascript\nvar letterStyle = {\n  padding: 10,\n  margin: 10,\n  backgroundColor:\
    \ \"#ffde00\",\n  color: \"#333\",\n  display: \"inline-block\",\n  fontFamily:\
    \ \"monospace\",\n  fontSize: \"32\",\n  textAlign: \"center\"\n};\n```\n\nNotice\
    \ that for some of the properties with a numerical value such as `padding`, `margin`,\
    \ and `fontSize`, we didn’t specify the `px` suffix at all. That is because, at\
    \ runtime, React will add the `px` suffix automatically.\n\nThe only number-related\
    \ properties React won’t add a pixel suffix to automatically are the following\
    \ properties: `animationIterationCount`, `boxFlex`, `boxFlexGroup`, `boxOrdinalGroup`,\
    \ `columnCount`, `fillOpacity`, `flex`, `flexGrow`, `flexPositive`, `flexShrink`,\
    \ `flexNegative`, `flexOrder`, `fontWeight`, `lineClamp`, `lineHeight`, `opacity`,\
    \ `order`, `orphans`, `stopOpacity`, `strokeDashoffset`, `strokeOpacity`, `strokeWidth`,\
    \ `tabSize`, `widows`, `zIndex`, and `zoom`. While I wish I could tell you that\
    \ I walk around with this information memorized, I actually just referred to this\
    \ article: [https://facebook.github.io/react/tips/style-props-value-px.html](https://facebook.github.io/react/tips/style-props-value-px.html)\
    \ Please hold your applause :P\n\nWhile pixel values are great for many things,\
    \ you may want to use percentages, ems, vh, etc. to represent your values. For\
    \ these non-pixel values, you still have to manually ensure the suffix is dealt\
    \ with. React won’t help you out there, so if you aren’t a fan of pixel values,\
    \ this nicety doesn’t gain you much.\n\n### Making the Background Color Customizable\n\
    \nThe last thing we are going to do before we wrap things up is take advantage\
    \ of how React works with styles. By having our styles defined in the same vicinity\
    \ as the JSX, we can make the various style values easily customizable by the\
    \ parent (aka the consumer of the component). Let’s see this in action.\n\nRight\
    \ now, all of our vowels have a yellow background. Wouldn’t it be cool if we could\
    \ specify the background color as part of each `Letter` declaration? To do this,\
    \ in our `ReactDOM.render` method, first add a `bgcolor` attribute and specify\
    \ some colors as shown in the following highlighted lines:\n\n[Click here to view\
    \ code image](#part0030.xhtml_p046pro01)\n\n```javascript\nReactDOM.render(\n\
    \  <<div>\n    <Letter bgcolor=\"#58B3FF\">A</Letter> \n    <Letter bgcolor=\"\
    #FF605F\">E</Letter> \n    <Letter bgcolor=\"#FFD52E\">I</Letter> \n    <Letter\
    \ bgcolor=\"#49DD8E\">O</Letter> \n    <Letter bgcolor=\"#AE99FF\">U</Letter>\
