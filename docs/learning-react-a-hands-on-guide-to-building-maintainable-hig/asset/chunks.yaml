    \nFigure 14-2 You can add tasks and have them show up.\n\nPretty simple, right?\
    \ In the following sections, we build this app from scratch and learn (in awesomely\
    \ painstaking detail) how things work along the way.\n\n### Getting Started\n\n\
    By now, you know the drill. We need a starting point, so go ahead and create a\
    \ new HTML document. Inside it, add the following content into it:\n\n[Click here\
    \ to view code image](#part0040.xhtml_p165pro01)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>React! React! React!</title>\n  <script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
    ></script>\n  <script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n  <style>\n  </style>\n</head>\n<body>\n  <div id=\"container\">\n\
    \  </div>\n  <script type=\"text/babel\">\n    var destination = document.querySelector(\"\
    #container\");\n    ReactDOM.render(\n      <div>\n        Hello!\n      </div>,\n\
    \      destination\n    );\n  </script>\n</body>\n</html>\n```\n\nIf you preview\
    \ all of this in the browser, you will see the word **Hello!** appear. If you\
    \ see that, then you are in good shape. It’s time to start building our Todo List\
    \ app!\n\n### Creating the UI\n\nRight now, our app doesn’t do a whole lot. We’ll\
    \ fix that by first getting the various UI elements up and running. That isn’t\
    \ very complicated for our app! The first thing we are going to do to is get our\
    \ input field and button to appear. This is all done by using the `div`, `form`,\
    \ `input`, and `button` elements!\n\nAll of that will live inside a component\
    \ we are going to call `TodoList`. Go ahead and add the following code above where\
    \ you have your `ReactDOM.render` method:\n\n[Click here to view code image](#part0040.xhtml_p166pro01)\n\
    \n```javascript\nvar TodoList = React.createClass({\n  render: function() {\n\
    \    return (\n      <div className=\"todoListMain\">\n        <div className=\"\
    header\">\n          <form>\n            <input placeholder=\"enter task\"></input>\n\
    \            <button type=\"submit\">add</button>\n          </form>\n       \
    \ </div>\n      </div>\n    );\n  }\n});\n```\n\nInside your `ReactDOM.render`\
    \ method, we need to call our newly added `TodoList` component to render it. Go\
    \ ahead and replace your existing JSX with the following:\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <TodoList/>\n  </div>,\n  destination\n);\n```\n\nSave your changes\
    \ and preview what you have in your browser. You’ll see something that looks like\
    \ [Figure 14-3](#part0021.xhtml_ch14fig3).\n\n![Image](Images/image00295.jpeg)\n\
    \nFigure 14-3 What you should see in the browser.\n\nIf you are surprised at what\
