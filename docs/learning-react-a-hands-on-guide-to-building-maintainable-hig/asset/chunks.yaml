  trans: "\n就像编程中的其他一切事情一样，保持内容的模块化、紧凑型和自包含也是个好主意。React 将这一成熟的理念扩展到了我们思考用户界面的方式。React\
    \ 的许多核心 API 使得创建更小的视觉组件变得更加容易，这些组件之后可以与其他视觉组件组合，形成更大、更复杂的视觉组件——就像俄罗斯套套娃（请参见 图\
    \ 1-9）。\n\n![Image](img/image00235.jpeg)\n\n图 1-9 俄罗斯套套娃，作者 Gnomz007。\n\n来源：*[`commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg`](https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg)*\n\
    \n这是 React 简化（并改变）我们构建 Web 应用视觉效果的主要方式之一。\n\n## 完全用 JavaScript 定义视觉效果\n\n虽然这听起来非常荒谬且不可理喻，但请听我道来。除了使用非常奇怪的语法外，HTML\
    \ 模板传统上还面临另一个主要问题：除了简单显示数据外，在其中可以做的事情种类非常有限。如果你想根据特定条件选择显示哪部分 UI（例如），你必须在应用的其他地方编写\
    \ JavaScript，或者使用某些奇怪的框架特定模板命令来使其工作。\n\n例如，这里是 EmberJS 模板内部条件语句的写法：\n\n点击此处查看代码图像\n\
    \n```html\n{{#if person}}\n\n  Welcome back, <b{{person.firstName}} {{person.lastName}}</b>!\n\
    \n{{else}}\n\n  Please log in.\n\n{{/if}}\n```\n\nReact 的做法非常巧妙。通过将 UI 完全完全定义在\
    \ JavaScript 中，你可以利用 JavaScript 提供的所有丰富功能来在模板内部执行各种操作（你将在接下来的几章中看到）。你受限仅限于 JavaScript\
    \ 支持的内容，而不是你的模板框架施加的任何限制。\n\n现在，当你考虑到完全用 JavaScript 定义的视觉效果时，你可能会想到某些涉及引号、转义字符和大量\
    \ `createElement` 调用的糟糕东西。别担心。React 让你可以选择使用名为 `JSX` 的类 HTML 语法来指定视觉效果，它与你的 JavaScript\
    \ 完全并存。你不需要编写代码来定义 UI，你基本上是在指定标记：\n\n```javascript\nReactDOM.render(\n\n  <div>\
    \                        \n\n          <h1>Batman</h1>        \n          <h1>Iron\
    \ Man</h1>      \n          <h1>Nicolas Cage</h1> \n          <h1>Mega Man</h1>\
    \      \n  </div>,             \n  destination\n\n);\n```\n\n这段在 JavaScript 中定义的相同代码看起来像这样：\n\
    \n点击此处查看代码图像\n\n```javascript\nReactDOM.render(React.createElement(\n  \"div\"\
    ,\n  null,\n  React.createElement(\n    \"h1\",\n    null,\n    \"Batman\"\n \
    \ ),\n  React.createElement(\n    \"h1\",\n    null,\n    \"Iron Man\"\n  ),\n\
    \  React.createElement(\n    \"h1\",\n    null,\n    \"Nicolas Cage\"\n  ),\n\
    \  React.createElement(\n    \"h1\",\n    null,\n    \"Mega Man\"\n  )\n), destination);\n\
    ```\n\n哎呀！通过使用 `JSX`，你可以使用一种非常熟悉的语法非常容易地定义视觉效果，同时获得 JavaScript 提供的所有威力和灵活性。最棒的是，在\
    \ React 中，你的视觉效果和 JavaScript 通常位于同一个位置。你不再需要在多个文件之间切换来定义一个视觉组件的外观和行为。这才是正确的模板化。\n\
    \n## MVC 架构中的 V\n\n我们快要完成了！React 并不是一个对应用中所有内容如何行为有意见的完整框架。相反，React 主要在 `View`\
    \ 层工作，它的所有关注点考虑都围绕着你的视觉元素并保持它们更新。这意味着你可以自由使用任何你想要用于 MVC 架构中的 `M` 和 `C` 部分。这种灵活性使你能够选择你熟悉的技术，这使得\
    \ React 不仅对于你创建的新 Web 应用有用，对于你想要增强的现有应用也有用，而无需删除和重构大量代码。\n\n## 结论\n\n在新的 Web 框架和库中，React\
    \ 是一次巨大的成功。它不仅解决了开发者在构建单页应用时面临的最常见问题，还提供了一些额外的技巧，让构建单页应用的视觉效果变得容易得多得多。自 2013 年发布以来，React\
    \ 稳步地进入了你可能使用的热门网站和应用。除了 Facebook 和 Instagram，一些知名的应用包括 BBC、Khan Academy、PayPal、Reddit、《纽约时报》、Yahoo\
    \ 以及更多：[`github.com/facebook/react/wiki/Sites-Using-React`](https://github.com/facebook/react/wiki/Sites-Using-React)\n\
    \n本章的意图是向你介绍 React 是什么以及为什么要这样做。在后续章节的教程中，我们将深入探讨你在这里看到的所有内容，并涵盖将帮助你在自己的项目中成功使用\
    \ React 的技术细节。请继续关注。\n\n## 2. 构建你的第一个 React 应用\n"
- fmt: "\n![Image](Images/image00226.jpeg) `Let your browser rely on a JavaScript\
    \ library to automatically convert JSX to something it understands.** You specify\
    \ your JSX directly just like you would any old piece of JavaScript, and your\
    \ browser takes care of the rest.\n\nBoth of these solutions have a place in our\
    \ world, but let’s talk about the impact of each.\n\nThe first solution, while\
    \ a bit complicated and time-consuming at first, is `the way modern web development\
    \ is done these days`. Besides compiling (transpiling to be more accurate) your\
    \ `JSX` to `JS`, this approach enables you to take advantage of modules, better\
    \ build tools, and a bunch of other features that make building complex web apps\
    \ somewhat manageable.\n\nThe second solution provides a quick and direct path\
    \ where you initially spend more time writing code and less time fiddling with\
    \ your development environment. To use this solution, all you do is reference\
    \ a script file. This script file takes care of turning the `JSX` into `JS` on\
    \ page load, and your React app comes to life without you having to do anything\
    \ special to your development environment.\n\nFor our introductory look at React,\
    \ we are going to use the second solution. You may be wondering why we don’t use\
    \ the second solution always. The reason is that your browser takes a performance\
    \ hit each time it spends time translating `JSX` into `JS`. That is totally acceptable\
    \ when learning how to use React, but that is totally not acceptable when deploying\
    \ your app for real-life use. Because of that un-acceptableness, we will revisit\
    \ all of this and look at the first solution and how to set up your development\
    \ environment later, once you’ve gotten your feet comfortably wet in React.\n\n\
    ### Getting Your React On\n\nIn the previous section, we looked at the two ways\
    \ you have for ensuring your React app ends up as something your browser understands.\
    \ In this section, we are going to put all of those words into practice. First,\
