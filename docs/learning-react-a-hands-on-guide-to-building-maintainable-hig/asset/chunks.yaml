    much anything you want inside the { and } curly brackets. That flexibility is
    really nice, because there are a lot of things you can do when your JavaScript
    lives outside of the `render` function. A LOT OF THINGS!


    ### Dealing with Arrays in the Context of JSX


    Now we are going to get to some fun stuff! When you are displaying multiple components,
    you won’t always be able to manually specify them:


    ReactDOM.render(


      <div>


        {showCircle()}


        {showCircle()}


        {showCircle()}


      </div>,


      destination


    );


    In many real-world scenarios, the number of components you display will be related
    to the number of items in an array or array-like (aka iterator) object you are
    working with. That brings along a few simple complications. For example, let’s
    say that we have an array called `colors` that looks as follows:


    [Click here to view code image](#part0035.xhtml_p103pro01)


    var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363",


                  "#85FFC7", "#297373", "#FF8552", "#A40E4C"];


    What we want to do is create a `Circle` component for each item in this array
    (and set the `bgColor` prop to the value of each array item). The way we are going
    to do this is by creating an array of `Circle` components:


    [Click here to view code image](#part0035.xhtml_p103pro02)


    var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363",


                  "#85FFC7", "#297373", "#FF8552", "#A40E4C"];


    var renderData = [];                              


    for (var i = 0; i < colors.length; i++) {         


      renderData.push(<Circle bgColor={colors[i]}/>); 


    }                                                 


    In this snippet, we populate our `renderData` array with `Circle` components just
    like we originally set out to do. So far so good. To display all of these components,
    React makes it very simple. Take a look at the highlighted line for all you have
    to do:


    [Click here to view code image](#part0035.xhtml_p104pro01)


    var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363",


                  "#85FFC7", "#297373", "#FF8552", "#A40E4C"];


    var renderData = [];


    for (var i = 0; i < colors.length; i++) {


      renderData.push(<Circle bgColor={colors[i]}/>);


    }


    ReactDOM.render(


      <div>


        {renderData} 


      </div>,


      destination


    );


    In our `render` method, all we do is specify our `renderData` array as an expression
    that we need to evaluate. We don’t need to take any other step to go from an array
    of components to seeing something that looks like [Figure 9-2](#part0016.xhtml_ch09fig02)
    when you preview in your browser.


    ![Image](Images/image00272.jpeg)


    Figure 9-2 What you should see in your browser.


    Ok, while our example seems to work, we aren’t done yet! There is actually one
    more thing we need to do, and this is a subtle one. The way React makes UI updates
    really fast is by having a good idea of what exactly is going on in your DOM.
    It does this in several ways, but one really noticeable way is by internally marking
    each element with some sort of an identifier. This “marking” happens automatically
    when you explicitly specify elements in your JSX.


    When you create elements dynamically (such as what we are doing with our array
    of `Circle` components), these identifiers are not automatically set. We need
    to do some extra work. That extra work takes the form of a `key` prop whose value
    React uses to uniquely identify each particular component.


    For our example, we can do something like this:


    [Click here to view code image](#part0035.xhtml_p105pro01)


    for (var i = 0; i < colors.length; i++) {


      var color = colors[i];                                      


      renderData.push(<Circle key={i + color} bgColor={color}/>); 


    }


    On each component, we specify our `key` prop and set its value to a combination
    of color and index position inside the `colors` array. This ensures that each
    component we dynamically create ends up getting a unique identifier that React
    can then use to optimize any future UI updates. Now, we could just use the index
    position as the identifier, but if you have multiple blocks of code where you
    are dynamically generating elements, you may get multiple elements with duplicate
    index values.


    * * *


    Check Your Console Yo!


    React is really good at telling you when you might be doing something wrong. For
    example, if you dynamically create elements or components and don’t specify a
    `key` prop on them, you will be greeted with the following warning in your console:


    ***Warning: Each child in an array or iterator should have a unique “key” prop.
    Check the top-level render call using <div>.***


    When you are working with React, it is a good idea to periodically check your
    console for any messages it may have. Even if things seem to be working just fine,
    you’ll never know what you might find :P


    * * *


    ### Conclusion


    All the tips and tricks you’ve seen in this article are made possibly because
    of one thing: *JSX is JavaScript*. This is what enables you to have your JSX live
    wherever JavaScript thrives. To us, it looks like we are doing something absolutely
    bizarre when we specify something like this:


    [Click here to view code image](#part0035.xhtml_p105pro02)


    for (var i = 0; i < colors.length; i++) {


      var color = colors[i];


      renderData.push(<Circle key={i + color} bgColor={color}/>);


    }


    Even though we are pushing pieces of JSX to an array, just like magic, everything
    works in the end when `renderData` is evaluated inside our `render` method. I
    hate to sound like a broken record, but this is because what our browser ultimately
    sees looks like this:


    [Click here to view code image](#part0035.xhtml_p106pro01)


    for (var i = 0; i < colors.length; i++) {


      var color = colors[i];


      renderData.push(React.createElement(Circle,


        {


          key: i + color,


          bgColor: color


        }));


    }


    When our JSX gets converted into pure JS, everything makes sense again. This is
    what allows us to get away with putting our JSX in all sorts of uncomfortable
    (yet photogenic!) situations with our data and still get the end result we want!
    Because, in the end, it’s all just JavaScript.


    ## 10. Working with Events


    So far, most of our examples only did their work on page load. As you probably
    guessed, that isn’t normal. In most apps, especially the kind of UI-heavy ones
    we will be building, there is going to be a ton of things the app does only as
    a reaction to something. That *something* could be triggered by a mouse click,
    a key press, window resize, or a whole bunch of other gestures and interactions.
    The glue that makes all of this possible is something known as **events**.


    Now, you probably know all about events from your experience using them in the
    DOM world. (If you don’t, then I suggest getting a quick refresher first: [https://www.kirupa.com/html5/javascript_events.htm](https://www.kirupa.com/html5/javascript_events.htm).)
    The way React deals with events is a bit different, and these differences can
    surprise you in various ways if you aren’t paying close attention. Don’t worry.
    That’s why you have this book! We start off with a few simple examples and then
    gradually look at increasingly more bizarre, complex, and (yes!) boring things.


    ### Listening and Reacting to Events


    The easiest way to learn about events in React is to actually use them, and that’s
    exactly what we are going to do! To help with this, we have a simple example made
    up of a counter that increments each time you click on a button. Initially, our
    example will look like [Figure 10-1](#part0017.xhtml_ch10fig01).


    ![Image](Images/image00273.jpeg)


    Figure 10-1 Our example.


    Each time you click on the plus button, the counter value will increase by 1\.
    After clicking the plus button a bunch of times, it will look sorta like [Figure
    10-2](#part0017.xhtml_ch10fig02).


    ![Image](Images/image00274.jpeg)


    Figure 10-2 After clicking the plus button a bunch of times (23?).'
