  trans: "\n\n我们的对象 own `letterStyle`，这就是我们在大括号内指定的内容，以便让 React 要评估该表达式。仅此而已。请继续在浏览器中运行示例，以确保一切运行正常，并且我们所有的元音都正确应用了样式。\n\
    \n为了进行额外的验证，如果你使用任的浏览器开发者工具检查应用到某个元音上的样式，你会发现这些样式实际上是内联应用的（参见图 4-4）。\n\n![Image](img/image00247.jpeg)\n\
    \n图 4-4 样式是内联应用的。\n\n虽然这并不意外，但对于我们这些习惯于样式写在样式规则内部的人来说，可能很难接受。正如人们所说，时代在变（[`www.youtube.com/watch?v=e7qQ6_RV4VQ`](https://www.youtube.com/watch?v=e7qQ6_RV4VQ)）。\n\
    \n### 你可以省略 “px” 后缀\n\n在程序化设置样式时，处理需要像素值后缀的数字非常痛苦。为了生成这些值，你需要在数字上进行一些字符串拼接以添加\
    \ `px`。要从像素值转换回数字，你需要解析出 `px`。这些操作并不极端复杂或耗费时间，但确实会分散注意力。\n\n为了帮助这个问题，React 允许在许多\
    \ CSS 属性中省略 `px` 后缀。如果你还记得，我们的 `letterStyle` 对象如下：\n\n点击此处查看代码图片\n\n```javascript\n\
    var letterStyle = {\n  padding: 10,\n  margin: 10,\n  backgroundColor: \"#ffde00\"\
    ,\n  color: \"#333\",\n  display: \"inline-block\",\n  fontFamily: \"monospace\"\
    ,\n  fontSize: \"32\",\n  textAlign: \"center\"\n};\n```\n\n请注意，对于像 `padding`、`margin`\
    \ 和 `fontSize` 某些具有数值属性的属性，我们完全没有指定 `px` 后缀。这是因为在运行时，React 会自动添加 `px` 后缀。\n\n\
    React 不会自动添加像素后缀的唯一数字相关属性是以下属性：`animationIterationCount`、`boxFlex`、`boxFlexGroup`、`boxOrdinalGroup`、`columnCount`、`fillOpacity`、`flex`、`flexGrow`、`flexPositive`、`flexShrink`、`flexNegative`、`flexOrder`、`fontWeight`、`lineClamp`、`lineHeight`、`opacity`、`order`、`orphans`、`stopOpacity`、`strokeDashoffset`、`strokeOpacity`、`strokeWidth`、`tabSize`、`widows`、`zIndex`\
    \ 和 `zoom`。虽然我希望告诉你能我背下了这些信息，但我实际上参考了这篇文章：[`facebook.github.io/react/tips/style-props-value-px.html`](https://facebook.github.io/react/tips/style-props-value-px.html)\
    \ 请收起掌声 :P\n\n虽然像素值对很多事情很有用，但你可能想使用百分比、ems、vh 等来表示你的值。对于这些非像素值，你仍然必须手动确保处理了后缀。React\
    \ 在这方面帮不了你，所以如果你不喜欢像素值，这项便利功能对你来说处不大。\n\n### 使背景颜色可定制\n\n在我们结束之前要做的最后一件事是利用 React\
    \ 处理样式的方式。通过将样式定义在 JSX 相同的区域，我们可以让父组件（即组件的消费者）轻松地自定义各种样式值。让我们来看看实际操作。\n\n现在，我们所有的元音都有黄色背景。如果我们可以在每个\
    \ `Letter` 声明中指定背景颜色不是很酷吗？为了实现这一点，在我们的 `ReactDOM.render` 方法中，首先添加 `bgcolor` 属性并像下面的高亮行所示指定一些颜色：\n\
    \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <<div>\n    <Letter bgcolor=\"\
    #58B3FF\">A</Letter> \n    <Letter bgcolor=\"#FF605F\">E</Letter> \n    <Letter\
    \ bgcolor=\"#FFD52E\">I</Letter> \n    <Letter bgcolor=\"#49DD8E\">O</Letter>\
    \ \n    <Letter bgcolor=\"#AE99FF\">U</Letter> \n  </div>,\n  destination\n);\n\
    ```\n\n接下来，我们需要使用这个属性。在我们的 `letterStyle` 对象中，将 `backgroundColor` 的值设置为 `this.props.bgColor`：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar letterStyle = {\n  padding: 10,\n  margin:\
    \ 10,\n  backgroundColor: this.props.bgColor,\n  color: \"#333\",\n  display:\
    \ \"inline-block\",\n  fontFamily: \"monospace\",\n  fontSize: \"32\",\n  textAlign:\
    \ \"center\"\n};\n```\n\n请注意，对于像 `padding`、`margin` 和 `fontSize` 某些具有数值属性的属性，我们完全没有指定\
    \ `px` 后缀。这是因为在运行时，React 会自动添加 `px` 后缀。\n\nReact 不会自动添加像素后缀的唯一数字相关属性是以下属性：`animationIterationCount`、`boxFlex`、`boxFlexGroup`、`boxOrdinalGroup`、`columnCount`、`fillOpacity`、`flex`、`flexGrow`、`flexPositive`、`flexShrink`、`flexNegative`、`flexOrder`、`fontWeight`、`lineClamp`、`lineHeight`、`opacity`、`order`、`orphans`、`stopOpacity`、`strokeDashoffset`、`strokeOpacity`、`strokeWidth`、`tabSize`、`widows`、`zIndex`\
    \ 和 `zoom`。虽然我希望告诉你能我背下了这些信息，但我实际上参考了这篇文章：[`facebook.github.io/react/tips/style-props-value-px.html`](https://facebook.github.io/react/tips/style-props-value-px.html)\
    \ 请收起掌声 :P。\n\n"
- fmt: "\nIn the real world, what you’ll be asked to implement in React will never\
    \ be so simple as a list of names or colorful blocks of vowels. Instead, you’ll\
    \ be given a visual representation of some complex user interface. That visual\
    \ can take many forms—a scribble, diagram, screenshot, video, redline, comp, etc.\
    \ It is up to you to bring all of those static pixels to life, and we are going\
    \ to get some hands-on practice in doing just that.\n\nWhat we are going to do\
    \ is build a simple color palette card (see [Figure 5-2](#part0012.xhtml_ch05fig02)).\n\
    \n![Image](Images/image0025.jpeg)\n\nFigure 5-2 A simple color palette card.\n\
    \nIf you are not sure what these are, these are small rectangular cards that help\
    \ you match a color with a particular type of paint. You’ll frequently see them\
    \ in home improvement stores or anywhere paint is sold. Your designer friend probably\
    \ has a giant closet dedicated to them in their place. Anyway, `our mission is\
    \ to recreate one of these cards using React`.\n\nThere are several ways to go\
    \ about this, but I am going to show you a very systematic approach that will\
    \ help you simplify and make sense of even the most complex user interfaces. This\
    \ approach involves two steps:\n\n1. Identify the major visual elements\n2. Figure\
    \ out what the components will be\n\nBoth of these steps sound really complex,\
    \ but as we walk through this, you’ll see that it is nothing to be worried about.\n\
    \n### Identifying the Major Visual Elements\n\nThe first step is to identify all\
    \ of the visual elements we are dealing with. No visual element is too minor to\
    \ omit—at least not initially. The easiest way to start identifying the relevant\
    \ pieces is to start with the obvious visual elements and then dive into the less\
    \ obvious ones.\n\nThe first thing you will see in our example is the card itself\
    \ (see [Figure 5.3](#part0012.xhtml_ch05fig03)).\n\n![Image](Images/image00251.jpeg)\n\
    \nFigure 5-3 The card.\n\nWithin the card, you’ll see that there are two distinct\
    \ regions. The top region is a rectangular area that displays a particular color.\
    \ The bottom region is a white area that displays a hex value.\n\nLet’s call out\
    \ these two visual elements and arrange them into a tree-like structure as shown\
    \ in [Figure 5-4](#part0012.xhtml_ch05fig04).\n\n![Image](Images/image00252.jpeg)\n\
    \nFigure 5-4 Tree-like structure.\n\nArranging your visuals into this tree-like\
    \ structure (aka a `visual hierarchy`) is a good way to get a better feel for\
    \ how your visual elements are grouped. The goal of this exercise is to identify\
    \ the important visual elements and break them into a parent/child arrangement\
    \ until you can divide them no further.\n\n***\n\n**Try to Ignore Implementation\
    \ Details**\n\nWhile it is hard, do not think of implementation details yet. Don’t\
    \ focus on dividing your visual elements based on what combination of `HTML` and\
    \ `CSS` would be required. There is plenty of time for that later!\n\n***\n\n\
    Continuing on, we can see that our colorful rectangle isn’t something that we\
    \ can divide further. That doesn’t mean we are done, though. We can further divide\
    \ the label from the white region that surrounds it. Right now, our visual hierarchy\
    \ looks as shown in [Figure 5-5](#part0012.xhtml_ch05fig05) with our label and\
    \ white region occupying a separate spot in our tree.\n\n![Image](Images/image00253.jpeg)\n\
    \nFigure 5-5 Dividing things further into the label and the white region that\
    \ surrounds it.\n\nAt this point, we have nothing else to divide any further.\
    \ We are done with identifying and dividing up our visual elements, so the next\
    \ step is to use what we’ve found here to help us identify the components.\n\n\
    ### Identifying the Components\n\nThis is where things get a little interesting.\
    \ We need to figure out which of the visual elements we’ve identified will be\
    \ turned into a component and which ones will not. Not every visual element will\
    \ need to be turned into a component, and we certainly don’t want to create only\
    \ a few extremely complex components either. There needs to be a balance (see\
    \ [Figure 5-6](#part0012.xhtml_ch05fig06)).\n\n![Image](Images/image00254.jpeg)\n\
    \nFigure 5-6 Not too few and not too many components.\n\nThere is an art to figuring\
    \ out what visual elements become part of a component and which ones don’t. `The\
    \ general rule is that our components should do just one thing`. If you find that\
    \ your potential component will end up doing too many things, you probably want\
    \ to break your component into multiple components. On the flip side, if your\
    \ potential component does too little, you probably want to skip making that visual\
    \ element a component altogether.\n\nLet’s try to figure out which elements would\
    \ make for good components in our example. From looking at our visual hierarchy,\
    \ right off the bat, both the card and the colored rectangle seem like they fit\
    \ the bill for making a great component. The card acts as the outer container,\
    \ and the colored rectangle simply displays a color.\n\nThat just puts a question\
    \ mark around our label and the white region it is surrounded by though (see [Figure\
    \ 5-7](#part0012.xhtml_ch05fig07)).\n\n![Image](Images/image00255.jpeg)\n\nFigure\
    \ 5-7 Question mark around the label and the white space around it.\n\nThe important\
    \ part here is the label itself. Without it, we can’t see the hex value. That\
    \ leaves just the white region. The purpose it serves is negligible. It is simply\
    \ empty space, and the responsibility for that can easily be handed off to our\
    \ label itself. Brace yourself for what I am about to say next. Sadly, our white\
    \ rectangular region will not be turned into a component.\n\nAt this point, we\
    \ have identified our three components, and the `component hierarchy` looks as\
    \ in [Figure 5-8](#part0012.xhtml_ch05fig08).\n\n![Image](Images/image00256.jpeg)\n\
    \nFigure 5-8 The three components.\n\nAn important thing to note is that the component\
    \ hierarchy has more to do with helping us define our code than it does with how\
    \ the finished product will look. You’ll notice that it looks a bit different\
    \ than the visual hierarchy we started off with. For visual details, you should\
    \ always refer to your source material (aka your visual comps, redlines, screenshots,\
    \ and other related items). For figuring out which components to create, you should\
    \ use the component hierarchy.\n\nOk, now that we’ve identified our components\
    \ and the relationship between all of them, it is time to start bringing our color\
    \ palette card to life.\n\n### Creating the Components\n\nThis is the easy part—sort\
    \ of! It is time for us to start writing code. The first thing we need is a mostly-empty\
    \ HTML page that will serve as our starting point:\n\n[Click here to view code](#part0031.xhtml_p05)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>More Components</title>\n\
    \  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script\
    \ src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n  <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.2/standalone.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\
    \  <script type=\"text/babel\">\n    ReactDOM.render(\n      <div></div>\n   \
    \   document.querySelector(\"#container\")\n    );\n  </script>\n</body>\n</html>\n\
    ```\n\nTake a moment to see what this page has going on. There isn’t much—just\
    \ the bare needed to have React render an empty `div` into our `container` element.\n\
    \nAfter you’ve done this, it is time to define our three components. The names\
    \ we will go with our components will be `Card`, `Label`, and `Square`. Go ahead\
    \ and add the following lines just above the `ReactDOM.render` function:\n\n```javascript\n\
    var Square = React.createClass({\n  render: function() {\n    return(\n      <p>Nothing</p>\n\
    \    );\n  }\n});\n```\n"
