    it. When the form is submitted and that event gets overheard, we will need to
    call an event handler. Let’s give that event handler a name of `addItem`.


    Putting all of this together, inside your `TodoList` component’s `render` function,
    make the following highlighted change:


    [Click here to view code image](#part0040.xhtml_p170pro01)


    render: function() {


      return (


        <div className="todoListMain">


          <div className="header">


            <form onSubmit={this.addItem}> 


              <input placeholder="enter task">


              </input>


              <button type="submit">add</button>


            </form>


          </div>


        </div>


      );


    }


    As we had hoped to do, we just linked our `form` element’s **onSubmit** event
    to the `addItem` event handler. This event handler doesn’t exist, but we are going
    to fix that by adding the following highlighted lines:


    [Click here to view code image](#part0040.xhtml_p170pro02)


    var TodoList = React.createClass({


      getInitialState: function() {


        return {


          items: []


        };


      },


      addItem: function(e) { 


      },                     


      render: function() {


        return (


          <div className="todoListMain">


            <div className="header">


              <form onSubmit={this.addItem}>


                <input placeholder="enter task">


                </input>


                <button type="submit">add</button>


              </form>


            </div>


          </div>


        );


      }


    });


    Our `addItem` event handler/function doesn’t do a whole lot right now, but the
    important thing is that it exists! Next, we’ll fix the part where it doesn’t do
    a whole lot.


    #### Populating Our State


    Right now, our `TodoList` component’s `state` object contains the `items` array.
    What we need to do is populate this array with the text that you enter into the
    input field. That means we need a way to access our `input` element from within
    React. The way we are going to do that is by setting a `ref` attribute (as you
    saw in [Chapter 12](#part0019.xhtml_ch12)) on our `input` element and storing
    the reference to the HTML element that gets generated.


    Inside our `TodoList` component’s `render` method, add the following line:


    [Click here to view code image](#part0040.xhtml_p171pro01)


    render: function() {


        return (


          <div className="todoListMain">


            <div className="header">


            <form onSubmit={this.addItem}>


                <input ref={(a) => this._inputElement = a} 


                       placeholder="enter task">           


                </input>


                <button type="submit">add</button>


              </form>


            </div>


          </div>


        );


      }


    When this highlighted code runs, which is immediately after this component mounts,
    the `_inputElement` property will store a reference to the generated `input` element.
    Now that we have done this, we can treat this element like we would any DOM element
    we might have found using `querySelector` or equivalent function in the non-React
    world. What we are going to do next is populate our `items` array!


    Go ahead and modify the `addItem` method by adding the following lines:


    [Click here to view code image](#part0040.xhtml_p171pro02)


    addItem: function(e) {


      var itemArray = this.state.items;   


      itemArray.push(                     


        {                                 


          text: this._inputElement.value, 


          key: Date.now()                 


        }                                 


      );                                  


      this.setState({                     


        items: itemArray                  


      });                                 


      e.preventDefault();                 


    }


    This looks like a lot of code you just added, but all we are doing here is putting
    into JavaScript our earlier stated goal of populating our `items` array with text
    from our input field. Let’s walk through this code in greater detail.


    The first thing we do is create an array called `itemArray` that stores a reference
    to our `state` object’s `items` property:


    [Click here to view code image](#part0040.xhtml_p172pro01)


    var itemArray = this.state.items;


    Once we have this array, we add to it our recently submitted text entry from our
    `input` element:


    [Click here to view code image](#part0040.xhtml_p172pro02)


    itemArray.push(


      {


        text: this._inputElement.value,


        key: Date.now()


      }


    );


    Notice that we aren’t ***just*** adding the text entry from our `input` element.
    We are instead adding an object made up of the `text` and `key` properties. The
    `text` property stores our `input` element’s text value. The `key` property stores
    the current time. This sounds like a bizarre thing to do, but as you recall from
    [Chapter 9](#part0016.xhtml_ch09), the goal is to have this `key` value be unique
    for every entry that gets submitted. This is important because (spoiler alert!)
    we will be using the data in this array to eventually generate some UI elements.
    This key value is what React will use to uniquely identify each generated UI element,
    so by generating the key using `Date.now()`, we ensure a certain level of uniqueness.
    Because this is an important (yet easy to overlook) detail, we will revisit all
    of this again in a few moments.


    Anyway, getting back on track, once we are done with the `itemArray`, all that
    remains is to set our `state` object’s `items` property to it:


    this.setState({


      items: itemArray


    });


    Almost done here! The last thing we do in this method is the following:


    e.preventDefault();


    The `preventDefault` method ensures we override the default **onSubmit** event.
    The reason we do this is a bit obscure, but it is to ensure the following: all
    we want to do when we submit the form is call the `addItem` method. If we didn’t
    stop the default behavior, our app will correctly call `addItem` as desired when
    we submit the form. **It will also trigger our browser’s default POST behavior**—which
    we definitely don’t want. By stopping the **onSubmit** event from performing the
    *default* behavior, we get our *desired* behavior of calling the `addItem` method
    without any of the unwanted side effects like an unnecessary POST action that
    might refresh your page.


    #### Displaying the Tasks


    We are almost done here! The last-ish thing we are going to do is visualize the
    tasks that currently live inside our `state` object’s `items` array. This is going
    to involve creating a whole new component called `TodoItems`, passing around some
    props, using the `map` function, and doing other awesome andrenaline-inducing
    things ([Figure 14-6](#part0021.xhtml_ch14fig06)).


    ![Image](Images/image00298.jpeg)


    Figure 14-6 Adrenaline!'
