  trans: "\n作为实现的一部分，可能会抛出检查异常（checked exception）的方法应当作为方法签名的一部分。这是通过 `throws` 声明来实现的。`@throws`\
    \ 标签用于在 Java 文档工具中描述这些异常\n\n以下是一个示例：\n\n```java\n/**\n * 从文件系统读取文件。\n * @throws\
    \ IOException 如果发生 I/O 错误。\n */\npublic void readFile() throws IOException {\n\
    \    // Some implementation here\n}\n```\n\n未检查异常（unchecked exceptions）不声明为方法签名的一部分。但请对它们进行记录，以便方法的调用者能够意识到可能抛出的异常（使用相同的\
    \ `@throws` 标签）。\n\n以下是一个示例：\n\n```java\n/**\n * 解析某些概念的字符串表示。\n * @param str\
    \ 要解析的字符串\n * @throws IllegalArgumentException 如果指定的字符串无法正确解析\n * @throws NullPointerException\
    \ 如果指定的字符串为 null\n */\npublic void parse(final String str) {\n    // Some implementation\
    \ here\n}\n```\n\n务必对方法可能抛出的异常进行记录。这有助于从编码开始就实现适当的异常处理和恢复（回退）逻辑，确保它们免受生产系统中故障排除问题的干扰。\n\
    \n## 异常与日志\n\n日志（[`en.wikipedia.org/wiki/Logfile`](http://en.wikipedia.org/wiki/Logfile)）是任何复杂的\
    \ Java 应用、库或框架必不可少的一部分。它是应用程序事件的日志，而异常是流程中的关键部分。必须正确记录异常并在稍后进行分析，以便发现应用程序中的问题并进行故障排除。\n\
    \n## 结论\n\n异常是 Java 语言的一重要特性。异常是 Java 错误管理的基础。异常使处理和信号错误状态变得简单；与错误码、标志和状态相反，异常一旦发生就无法被忽略。\n\
    \n这些建议将帮助你更有效地理解书中描述的 Java 编码标准和指南。在使用大多数语言进行编码或编程时也可以使用这些工具。Python、C++、CSS 和\
    \ JavaScript 等语言都使用通用格式、规则、异常和标准来确保信息易于理解、编辑和添加，从而开发程序和应用程序的改进和新版本。\n\n1. **理解标准。**\
    \ 花时间理解每种标准和指南如何提高生产力。不要仅仅因为被告知就将每个局部变量单独写一行。这样做是因为你理解到这可以提高对代码的理解。\n2. **相信它们。**\
    \ 遵循标准应该是始终如一做的事，因为它是最好的编码方式。\n3. **在编码时遵循它们，而不是事后补救。** 洁洁的代码更容易，无论是在开发还是维护期间都是如此。遵循标准将提高开发时的生产力，并使代码更易维护。如果从一开始就产生洁洁的代码，你就能在创建过程中从中受益。\n\
    4. **将它们成为你质量保证流程的一部分。** 确保源代码遵循工作对象所采纳的标准。标准应作为培训和指导开发人员变得更高效的基础。\n\nJava 是一门动态且实用的编码语言，希望这本书能帮助你更深入地理解\
    \ Java 编码的某些高级方面。\n\n感谢阅读。希望你喜欢。请留下你诚恳的反馈。\n"
