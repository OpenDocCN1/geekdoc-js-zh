    This implementation exclusively uses an external HTTP (note: NOT https, which
    is a secure server) service ([http://api.geonames.org/](http://api.geonames.org/))
    that retrieves the time zone for a queried location. But, because the contact
    is interface driven, it is not difficult to introduce another implementation using
    flat file or a database. That way interfaces greatly help to design testable code.
