    | 3 |         try  { |


    | 4 |             Files.readAllBytes( new  File( "some.txt"  ).toPath() ); |


    | 5 |         } catch( final  IOException ex ) { |


    | 6 |             throw  new  RuntimeException( "Error reading file", ex ); |


    | 7 |         } |


    | 8 |     } ); |


    | 9 | } |


    A number of functional interfaces are declared and have the ability to throw any
    Exception from its implementation, but if not, like Runnable, wrapping, or catching
    the checked exceptions within unchecked ones is what to do.


    Standard Java exceptions


    The Java standard libraries provide a wealth of information on exception classes. 
    These classes are specifically designed to cover the majority of generic errors
    that may occur in the process program execution.  The table below shows the exception
    classes that are used most often, always consider these prior to defining your
    own. 


    | Exception Class | Purpose |


    | NullPointerException | Attempts to usenull  where an object is required. |


    | IllegalArgumentException | Method passed an illegal or inappropriate argument.
    |


    | IllegalStateException | Method invoked at an illegal or inappropriate time.
    |


    | IndexOutOfBoundsException | Index (to a vector, to a string, or to an array)
    is out of range. |


    | UnsupportedOperationException | Requested operation is not supported. |


    | ArrayIndexOutOfBoundsException | An array was accessed with an illegal index.
    |


    | ClassCastException | Code attempted to cast an object to a subclass where it
    is not an instance. |


    | EnumConstantNotPresentException | Attempt to access anenum  constant by name
    and theenum  type contains no constant with the specified name. |


    | NumberFormatException | Attempts to convert a string to one of the numeric types,
    but that the string does not have the appropriate format. |


    | StringIndexOutOfBoundsException | Index is either negative or greater than the
    size of the string. |


    | IOException | I/O exception of some sort has occurred. This class is the general
    class of exceptions produced by failed or interrupted I/O operations. |


    Defining your own exceptions


    Exception classes are very easily defined in Java language.  Exception hierarchies
    that have been carefully designed for detailed, erroneous conditions management
    and reporting and to allow detailed implementation. Achieving the correct balance
    is singularly important; especially in the event that there are too many exception
    classes that might complicate the development as well as inflate the amount of
    the code needed to catch exceptions or propagate them further down the stack.


    All user-defined exceptions must be inherited from  RuntimeException class and
    be part of the class of unchecked exceptions, there are always some exclusions
    from the rule.


    Below is defined exception to dial with authentication:


    | 01 | public  class  NotAuthenticatedExceptionextends  RuntimeException { |


    | 02 |     private  static  final  long  serialVersionUID = 2079235381336055509L;
    |


    | 03 |  |


    | 04 |     public  NotAuthenticatedException() { |


    | 05 |         super(); |


    | 06 |     } |


    | 07 |  |


    | 08 |     public  NotAuthenticatedException( final  String message ) { |


    | 09 |         super( message ); |


    | 10 |     } |


    | 11 |  |


    | 12 |     public  NotAuthenticatedException( final  String message, final  Throwable
    cause ) { |


    | 13 |         super( message, cause ); |


    | 14 |     } |


    | 15 | } |


    The purpose of this exception is to signal about non-existing or invalid user
    credentials during sing-in process, for example:


    | 1 | public  void  signin( final  String username, final  String password ) {
    |


    | 2 |     if( !exists( username, password ) ) { |


    | 3 |         throw  new  NotAuthenticatedException( |


    | 4 |             "User / Password combination is not recognized"  ); |


    | 5 |     } |


    | 6 | } |


    Passing the informative message along with the exception helps to troubleshoot
    production systems. If the exception was re-thrown as the result of a different
    exceptional condition, the initial exception must be preserved using the cause
    constructor argument. This will help to source the problem.


    Documenting exceptions


    The next topic will be discussing how to make exceptions to be a part of the documentation
    as well.'
