  trans: "\n\n精心设计的异常层级结构可以减少所需的样板代码。\n\nJava 中继承自 `Error` 类的其他异常类包括 `OutOfMemoryError`\
    \ 或 `StackOverflowError`。这些异常表示致命的执行失败，会导致程序立即终止且无法恢复。\n\n### 使用 try-with-resources\n\
    \n栈回溯（Stack unwinding）通常是由抛出异常引起的。程序执行流的变化通常也以这种方式发生。例如，直接与未关闭的本地资源、网络套接字和文件句柄相关的资源泄漏，就是这些抛出异常的结果。\n\
    \n在 Java（版本 7 之前）中，一个良好的典型 I/O 操作使用强制的 `finally` 块来执行清理工作：\n\n```java\npublic\
    \ void readFile( final File file ) {\n    InputStream in = null;\n    try {\n\
    \        in = new FileInputStream( file );\n        // Some implementation here\n\
    \    } catch( IOException ex ) {\n        // Some implementation here\n    } finally\
    \ {\n        if( in != null ) {\n            try {\n                in.close();\n\
    \            } catch( final IOException ex ) {\n                /* do nothing\
    \ */\n            }\n        }\n    }\n}\n```\n\n`finally` 块的代码编写并不完美（但调用输入流的\
    \ `close` 方法也可能导致 `IOException` 异常），关闭输入流（并释放其背后的操作系统资源）的操作将被执行。异常永远不被忽略，但 `close`\
    \ 方法抛出的异常是这一规则的唯一例外。\n\nJava 7 在语言中引入了一种名为 `try-with-resources` 的新结构，使得整体资源管理变得更加简单。以下是使用\
    \ `try-with-resources` 重写的上述代码段：\n\n```java\npublic void readFile( final File\
    \ file ) {\n    try( InputStream in = new FileInputStream( file ) ) {\n      \
    \  // Some implementation here\n    } catch( final IOException ex ) {\n      \
    \  // Some implementation here\n    }\n}\n```\n\n资源需要实现 `AutoCloseable` 接口才能在\
    \ `try-with-resources` 块中使用。Java 编译器会在后台将此结构扩展为更复杂的代码，而开发者的代码看起来非常易读且简洁。在适当的情况下，这是一种非常方便的技术。\n\
    \n### 异常与 lambda\n\n未检查的异常（Unchecked exceptions）将按预期工作，但 Java Lambda 函数的语法不允许指定受检查异常（Checked\
    \ exceptions）；除非这些异常是由 `@FunctionalInterface` 本身定义的且该异常可能被抛出。\n\n下面的代码段将无法通过编译，会产生编译错误“Unhandled\
    \ exception type IOException”（该异常可能在第 03 行抛出）：\n\n```java\npublic void readFile()\
    \ {\n    run( () -> {\n        Files.readAllBytes( new File( \"some.txt\" ).toPath()\
    \ );\n    } );\n}\n\npublic void run( final Runnable runnable ) {\n    runnable.run();\n\
    }\n```\n\n解决方案是在 Lambda 体内部捕获 `IOException` 异常并重新抛出正确的 `RuntimeException`（将原始异常作为原因传递）。以下是一个示例：\n\
    \n```java\npublic void readFile() {\n    run( () -> {\n        try {\n       \
    \     Files.readAllBytes( new File( \"some.txt\" ).toPath() );\n        } catch(\
    \ IOException ex ) {\n            throw new RuntimeException( \"Error reading\
    \ file\", ex );\n        }\n    } );\n}\n```\n\n许多函数式接口已经声明，并能够从其实现中抛出任何 `Exception`，但如果不能（如\
    \ `Runnable`），则包装或在未检查异常内部捕获受检查异常是正确的做法。\n\n### 标准异常\n\nJava 标准库提供了大量关于异常类的信息。这些类被专门设计用于涵盖过程执行过程中可能发生的大多数通用错误。下表显示了经常使用的异常类，在定义自己的异常之前，请务必考虑这些。\n\
    \n| 异常 | 用途 |\n| :--- | :--- |\n| `NullPointerException` | 在需要对象的地方尝试使用 `null`。\
    \ |\n| `IllegalArgumentException` | 为方法传递了非法或不适当的参数。 |\n| `IllegalStateException`\
    \ | 在非法或不适当的时间调用了方法。 |\n| `IndexOutOfBoundsException` | 索引（针对向量、字符串或数组）超出范围。 |\n\
    | `UnsupportedOperationException` | 请求的操作不支持。 |\n| `ArrayIndexOutOfBoundsException`\
    \ | 使用非法索引访问了数组。 |\n| `ClassCastException` | 代码尝试将对象转换为其不是其实例的子类。 |\n| `EnumConstantNotPresentException`\
    \ | 尝试通过名称访问枚举常量，但该类型不包含指定名称的常量。 |\n| `FormatException` | 尝试将字符串转换为数值类型之一，但字符串没有适当的格式。\
    \ |\n| `StringIndexOutOfBoundsException` | 索引为负或大于字符串的大小。 |\n| `IOException` |\
    \ 发生了某种 I/O 异常。该类是失败或中断的 I/O 操作产生的异常的通用类。 |\n\n### 定义你自己的异常\n\n在 Java 语言中定义异常类非常容易。为了详细的错误条件管理和报告，精心设计的异常层级允许进行详细的实现。实现正确的平衡至关重要；特别是当异常类过多时，可能会使开发复杂化，并增加捕获异常或将其向下层传递的代码量。\n\
    \n所有用户定义的异常必须继承自 `RuntimeException` 类，并属于未检查异常类，但该规则总有一些例外。以下是用于处理身份验证的定义的异常：\n\
    \n```java\npublic class NotAuthenticatedException extends RuntimeException {\n\
    \    private static final long serialVersionUID = 2079235381336055509L;\n\n  \
    \  public NotAuthenticatedException() {\n        super();\n    }\n\n    public\
    \ NotAuthenticatedException( final String message ) {\n        super( message\
    \ );\n    }\n\n    public NotAuthenticatedException( final String message, final\
    \ Throwable cause ) {\n        super( message, cause );\n    }\n}\n```\n\n该异常的目的是在登录过程中对不存在或无效的用户凭据发出信号，例如：\n\
    \n```java\npublic void signin( final String username, final String password )\
    \ {\n    if( !exists( username, password ) ) {\n        throw new NotAuthenticatedException(\"\
    用户名 / 密码组合不被识别\") );\n    }\n}\n```\n\n随异常传递信息性消息有助于排查生产系统的故障。如果异常是由于另一种异常情况而重新抛出的，则必须使用原因构造函数参数保留初始异常。这将有助于追踪问题来源。\n\
    \n### 文档异常\n\n下一个主题将讨论如何让异常也成为文档的一部分。\n\n"
- fmt: "\nA method that may throw the checked exception, as part of its implementation,\
    \ should then be made apart of the method signature. This is done using `throws`\
    \ declaration. The `@throws` tag is used for describing those exceptions within\
    \ the Java documentation tool.\n\nBelow is an example:\n\n```java\n/**\n * Reads\
    \ file from the file system.\n * @throws IOException if an I/O error occurs.\n\
    \ */\npublic void readFile() throws IOException {\n    // Some implementation\
    \ here\n}\n```\n\nThe unchecked exceptions are not declared as a part of method\
    \ signature. Document them so the caller of the method is aware of possible exceptions\
    \ that may be thrown (using the same `@throws` tag).\n\nBelow is an example:\n\
    \n```java\n/**\n * Parses the string representation of some concept.\n * @param\
    \ str String to parse\n * @throws IllegalArgumentException if the specified string\
    \ cannot be parsed properly\n * @throws NullPointerException if the specified\
    \ string is null\n */\npublic void parse(final String str) {\n    // Some implementation\
    \ here\n}\n```\n\nAlways document the exceptions that the methods could throw.\
    \ It will help to implement proper exception handling and recovering (fallback)\
    \ logic from the coding start, keeping them safe from troubleshooting issues in\
    \ production systems.\n\n## Exceptions and logging\n\nLogging ([http://en.wikipedia.org/wiki/Logfile](http://en.wikipedia.org/wiki/Logfile))\
    \ is a necessary part of any complex Java application, library or framework. It\
    \ is a journal of the events in the application and exceptions that are the crucial\
    \ part of the flow. Exceptions must be correctly logged and analyzed later in\
    \ order to discover problems in the applications and troubleshoot.\n\n## Conclusion\n\
    \nExceptions are an important feature of the Java language. Exceptions are the\
    \ basis of the management of errors in Java. Exceptions make handling and signaling\
    \ erroneous conditions an easy job and, in contrast to error codes, flags and\
    \ statuses, once occurred, exceptions cannot be ignored.\n\nThese words of advice\
    \ will assist with the understanding of the Java coding standards and guidelines\
    \ described in this book more effectively. These tools may also be used when coding\
    \ or programming in most languages. Languages like Python, C++, CSS, and JavaScript\
    \ all use general formats, succession rules, exceptions and standards to ensure\
    \ that information is easily understood, edited and added to, so that improvements\
    \ and new versions of programs and apps may be developed.\n\n1. **Understand the\
    \ standards.** Take time to understand greater productivity through each standard\
    \ and guideline. Do not declare each local variable on its own line simply because\
    \ you were told to. Do it because there is an understanding that it increases\
    \ the comprehension of your code.\n2. **Believe in them.** Following standards\
    \ should be something that is always done because it is the best way to code.\n\
    3. **Follow them while you are coding, not as an afterthought.** Clean code is\
    \ easier. Both during development and maintenance. Following standards will increase\
    \ productivity, while developing, and will make the code easier to maintain. If\
    \ clean code is produced from the beginning, you can benefit from it as it is\
    \ being created.\n4. **Make them part of your quality assurance process.** Ensure\
    \ that the source code follows the standards adopted by who the work is being\
    \ done for. Standards should be used as the basis to train and mentor developers\
    \ to become more effective.\n\nJava is a dynamic and useful coding languages,\
    \ hopefully this book assisted you in your understanding some more advanced aspects\
    \ of coding in Java.\n\nThank you for reading. I hope you enjoy it. I ask you\
    \ to leave your honest feedback.\n"
  raw: 'A method that may throw the checked exception, as part of its implementation,
    should then be made  apart of the method signature.  This is done usingthrows
    declaration. The@throws tag is used for describing those exceptions within the
    Java documentation tool.


    Below is an example:


    | 1 | /** |


    | 2 |  * Reads file from the file system. |


    | 3 |  * @throws IOException if an I/O error occurs. |


    | 4 |  */ |


    | 5 | public  void  readFile() throws  IOException { |


    | 6 |     // Some implementation here |


    | 7 | } |


    The unchecked exceptions are not declared as a part of method signature. Document
    them so the caller of the method is aware of possible exceptions that may be thrown
    (using the same @throws tag).


    Below is an example:


    | 1 | /** |


    | 2 |  * Parses the string representation of some concept. |


    | 3 |  * @param str String to parse |


    | 4 |  * @throws IllegalArgumentException if the specified string cannot be parsed
    properly |


    | 5 |  * @throws NullPointerException if the specified string is null |


    | 6 |  */ |


    | 7 | public  void  parse( final  String str ) { |


    | 8 |     // Some implementation here |


    | 9 | } |


    Always document the exceptions that the methods could throw. It will help to implement
    proper exception handling and recovering (fallback) logic from the coding start,
    keeping them safe from troubleshooting issues in production systems.


    Exceptions and logging


    Logging ([http://en.wikipedia.org/wiki/Logfile](http://en.wikipedia.org/wiki/Logfile))
    is a necessary part of any complex Java application, library or framework. It
    is a journal of the events in the application and exceptions that are the crucial
    part of the flow. Exceptions must be correctly logged and analyzed later in order
    to discover problems in the applications and troubleshoot.


    Conclusion


    Exceptions are an important feature of the Java language. Exceptions are the basis
    of the management of errors in Java. Exceptions make handling and signaling erroneous
    conditions an easy job and, in contrast to error codes, flags and statuses, once
    occurred, exceptions cannot be ignored.


    # Conclusion


    These words of advice will assist with the understanding of the  Java coding standards
    and guidelines described in this book more effectively. These tools may also be
    used when coding or programming in most languages.  Languages like Python, C++,
    CSS, and JavaScript all use general formats, succession rules, exceptions and
    standards to ensure that information is easily understood, edited and added to,
    so that improvements and new versions of programs and apps may be developed. 


    1.  Understand the standards. Take time to understand greater productivity through
    each standard and guideline.  Do not declare each local variable on its own line
    simply because you were told to. Do it because there is an understanding that
    it increases the comprehension of your code.


    2.  Believe in them. Following standards should be something that is always done
    because it is the best way to code.


    3.  Follow them while you are coding, not as an afterthought. Clean code is easier.
    Both during development and maintenance. Following standards will increase productivity,
    while developing, and will make the code easier to maintain. If clean code is
    produced from the beginning, you can benefit from it as it is being created.


    4.  Make them part of your quality assurance process. Ensure that the source code
    follows the standards adopted by who the work is being done for. Standards should
    be used as the basis to train and mentor developers to become more effective.


    Java is a dynamic and useful coding languages, hopefully this book assisted you
    in your understanding some more advanced aspects of coding in Java.


    Thank you for reading. I hope you enjoy it. I ask you to leave your honest feedback.'
