    ![D:\\Физические книги\\Covers\\Python.jpg](img/00005.jpeg)\n- [SQL](http://www.amazon.com/SQL-Beginners-database-programming-Programming-ebook/dp/B019A7VQD8/ref=sr_1_25?ie=UTF8&qid=1451913155&sr=8-25&keywords=sql)\n\
    ![SQL](img/00006.jpeg)\n\n# 介绍\n最重要的是，运用常识。当找不到规则或指南时。当规则明显不适用时。当其他所有方法都失败时：请利用常识，检查\
    \ Java 和编码的基本原理。这条规则优于所有其他规则。常识是一项要求。\n\n1. 为人编写程序，而不是为机器。使用命名规范。为你的代码编写注释。分段。如果没人能看懂，那么它就没用。\n\
    2. 先设计，后编码。在开始编写代码之前，花时间考虑代码将如何编写，你绝对会花费更少编写时间。通过先考虑未来的变化，你可以减少这些变化对代码的影响。\n3.\
    \ 小步子开发。测试和修复 10 行代码比 1000 行要容易且快速得多；人们可以在一半的时间内，以每次 10 行的增量，编写、测试并修复 100 行代码，而直接写一个执行相同工作的\
    \ 100 行代码块要花费更多时间。\n4. 保持代码简单。以后需要重写的代码是不值得自豪的，所以遵循 KISS 原则：保持简单，愚蠢（Keep It Simple,\
    \ Stupid）。\n5. 学习常见的模式、反模式和惯用法。有大量的分析可以指导你提高开发生产力、设计和流程模式与反模式，以及编程惯用法。\n\n# 第\
    \ 1 章 – 通用编程指南\n我们将从本教程开始，讨论良好编程风格的通用原则，以及定义 Java 健壮设计的原则。这些原则中的大部分在《Java 编程入门》中已经过，但本章将引入许多新建议，以提高你作为\
    \ Java 开发者的技能。\n\n## 变量作用域\n在 Java 语言中，每个局部变量一旦声明，就有一个确定的作用域。该变量从声明处到它当前所在的方法或块的结束都是可见的。因此，只需要遵循一条规则：尽可能靠近使用局部变量的地方声明它。以下是一些示例：\n\
    \n```java\nfor (String locale : locales()) {\n    // 使用实现\n}\n\ntry (InputStream\
    \ in = new FileInputStream(\"file.txt\")) {\n    // 使用实现\n}\n```\n\n## 类成员字段与局部变量\n\
    Java 中的每个方法都属于某个类（在某些情况下是接口，如 Java 8 中声明为默认的方法）。局部变量与类成员之间存在命名冲突的概率，Java 编译器会选择作用域内的正确变量，但可能不是开发者想要使用的那个。许多\
    \ Java IDE 在此类冲突发生时会进行大量工作（红色高亮和警告），然而，在开发过程中主动处理更好。以下是一个示例：\n\n```java\npublic\
    \ class LocalVariableAndClassMember {\n    private long value;\n\n    public long\
    \ calculateValue(final long initial) {\n        long value = initial;\n\n    \
    \    value *= 10;\n        value += value;\n\n        return value;\n    }\n}\n\
    ```\n这个示例看起来非常简单，但有一个陷阱：`calculateValue` 方法引入了一个名为 `value` 的局部变量，并隐藏了同名的类成员。第\
    \ 8 行代码应该是类成员加上局部变量，但在应用中执行的是不同的操作。修正后的版本应该是这样的（使用 `this` 关键字）：\n\n```java\npublic\
    \ class LocalVariableAndClassMember {\n    private long value;\n\n    public long\
    \ calculateValue(final long initial) {\n        long value = initial;\n\n    \
    \    value *= 10;\n        value += this.value;\n\n        return value;\n   \
    \ }\n}\n```\n这种简单的实现凸显了一个重要问题，在某些情况下，需要花费几个小时来排故障和调试。\n\n## 方法参数与局部变量\n许多初学者经常陷入的另一种场景是将方法参数作为局部变量。Java\
    \ 允许对非 `final` 方法参数重新赋值替代值（但对原始值没有影响）。例如：\n\n```java\npublic String sanitize(String\
    \ str) {\n    if(!str.isEmpty()) {\n        str = str.trim();\n    }\n\n    str\
    \ = str.toLowerCase();\n    return str;\n}\n```\n使用 Lambda 表达式对上述 `forEach` 循环重写：\n\
    \n```java\nArrays.stream(locales()).forEach(locale -> {\n    // 实现\n});\n```\n\
    注意，局部变量变成了 `forEach` 的参数。\n\n"
- fmt: "\nThis is not the cleanest piece of coding but it does highlight the problem:\
    \ the method argument `str` has been reassigned to a different value (and used\
    \ as a local variable). In these cases (and without exception) this coding pattern\
    \ should be avoided and can be by declaring method arguments as `final`.\n\nBelow\
    \ is an example of this:\n\n```java\npublic String sanitize(final String str)\
    \ {\n    String sanitized = str;\n    if(!str.isEmpty()) {\n        sanitized\
    \ = str.trim();\n    }\n    sanitized = sanitized.toLowerCase();\n    return sanitized;\n\
    }\n```\n\nCoding that follows this simple rule is generally easier to follow and\
    \ reason with. This is done even at the expense of introducing local variables.\n\
    \n### Boxing and unboxing\n\nBoxing and unboxing are Java techniques that allow\
    \ conversion between primitive types (`int`, `long`, `double`) and respective\
    \ primitive type wrappers (`Integer`, `Long`, `Double`).\n\nEven though the Java\
    \ compiler attempts to hide those conversions by performing autoboxing, this may\
    \ make things worse and sometimes leads to random results.\n\nBelow is an example:\n\
    \n```java\npublic static void calculate(final long value) {\n    // Some implementation\
    \ here\n}\nfinal Long value = null;\ncalculate(value);\n```\n\nThis code snippet\
    \ compiles well, but it gives `NullPointerException` on line 02 as the conversion\
    \ between `Long` and `long` executes. The best point of advice here would be to\
    \ use the primitive type (but as we already know, in some cases it is not possible).\n\
    \n### Interfaces\n\nInterfaces should have preference over concrete classes where\
    \ possible. This should convince you to at least consider interfaces first by\
    \ showing these real examples.\n\nInterfaces are only tied to default methods,\
    \ not any particular implementation. They function merely as contracts, they provide\
    \ much of the freedom and flexibility in the way the contracts could be fulfilled.\
    \ Flexibility like this becomes more important if the implementation involves\
    \ external services or systems.\n\nBelow is an example of a simple interface and\
    \ its possible implementation:\n\n```java\npublic interface TimezoneService {\n\
    \    TimeZone getTimeZone(final double lat, final double lon) throws IOException;\n\
    }\n\npublic class TimezoneServiceImpl implements TimezoneService {\n    @Override\n\
    \    public TimeZone getTimeZone(final double lat, final double lon) throws IOException\
