    The above implementation may be used in each place whereTimezoneService  interfacing
    is required, this isolates the test scenario from its dependency on external components.


    Examples of appropriate interface use included inside the Java standard collection
    library.  Collection,List,Set,all those interfaces are backed by several more
    implementations that could be replaced  interchangeably and seamlessly when contracts
    may be preferred.


    Below is an example of this:


    | 1 | public  static< T > void  print( final  Collection< T > collection ) { |


    | 2 |     for( final  T element: collection ) { |


    | 3 |         System.out.println( element ); |


    | 4 |     } |


    | 5 | } |


    | 1 | print( new  HashSet< Object >( /* ... */ ) ); |


    | 2 | print( new ArrayList< Integer >( /* ... */ ) ); |


    | 3 | print( new TreeSet< String >( /* ... */ ) ); |


    | 4 | print( new Vector< Long >( /* ... */  ) ); |


    Strings


    Some of the most widely used types in Java and most of the programming languages
    are Strings. Java natively supports the concatenations and comparison through
    simplifying much of the routine operations over strings. The Java standard library
    also provides many unique classes to increase efficiency of strings operations.


    Strings are immutable objects in Java, and are represented in UTF-16 format. Each
    time the strings are concatenated (or when any operation which modifies the original
    string is performed) a new instance ofString class is created. That is why the
    concatenation operations sometimes become ineffective, initiating many intermediate
    string instances (also called: generating garbage).


    There are two very helpful classes provided in the Java standard library that
    aim to facilitate string manipulations:StringBuilder andStringBuffer (mainly different
    in thatStringBuffer is thread-safe while  StringBuilder  is not).


    Below are a few examples using one of these classes:


    | 01 | final  StringBuilder sb= new  StringBuilder(); |


    | 02 |  |


    | 03 | for( int  i = 1; i <= 10; ++i ) { |


    | 04 |     sb.append( " "  ); |


    | 05 |     sb.append( i ); |


    | 06 | } |


    | 07 |  |


    | 08 | sb.deleteCharAt( 0  ); |


    | 09 | sb.insert( 0, "["  ); |


    | 10 | sb.replace( sb.length() - 3, sb.length(), "]"  ); |


    Using  StringBuilder  /StringBuffer is recommended to manipulate strings, however
    it may look over the top when concatenating two or three strings; in this case
    the regular + operator may be used instead.


    Below is an example:


    | 1 | String userId= "user:"  + new  Random().nextInt( 100  ); |


    The use of string formatting is an alternative to straightforward concatenation
    and Java standard library provides the static helper methodString.format.It also
    supports a complete set of format specifiers, including dates/times, characters,
    numbers, etc. (see the full reference [official documentation](https://docs.oracle.com/javase/7/docs/api/java/util/Formatter.html#syntax)).


    Below explore the power of formatting by example:


    | 1 | String.format( "%04d", 1  );                      -> 0001 |


    | 2 | String.format( "%.2f", 15.643624d );             -> 15.64 |


    | 3 | String.format( "%tR", new  Date() );              -> 14:07 |


    | 4 | String.format( "%tF", new  Date() );              -> 2016-20-04 |


    | 5 | String.format( "%d%%", 22  );                     -> 22% |


    String.format method is a simple and clean way to construct strings originating
    in different data types. Some modern Java IDEs can analyze the format specification
    against the arguments passed on to the  String.format method and then warn developers
    when any mismatches are detected.


