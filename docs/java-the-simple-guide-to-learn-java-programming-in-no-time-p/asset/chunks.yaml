  trans: "\n\n这段代码并不是最整洁的，但它突出了问题：方法参数 `str` 被重新赋值了一个不同的值（并被用作局部变量）。在这些情况下（无例外地），应该避免这种编码模式，可以通过将方法参数声明为\
    \ `final` 来避免。\n\n以下是此点的示例：\n\n```java\npublic String sanitize(final String str)\
    \ {\n    String sanitized = str;\n    if(!str.isEmpty()) {\n        sanitized\
    \ = str.trim();\n    }\n    sanitized = sanitized.toLowerCase();\n    return sanitized;\n\
    }\n```\n\n遵循这一简单规则的代码通常更容易理解和推理。即使以引入局部变量为代价，这种做法也是值得的。\n\n### 装箱与拆箱（Boxing and\
    \ unboxing）\n\n装箱和拆箱是 Java 技术，允许在原始类型（`int`, `long`, `double`）与相应的原始类型包装类（`Integer`,\
    \ `Long`, `Double`）之间进行转换。\n\n尽管 Java 编译器试图图通过执行自动装箱（autoboxing）来隐藏这些转换，但这可能会让情况变得糟糕，有时会导致产生随机的结果。\n\
    \n以下是一个示例：\n\n```java\npublic static void calculate(final long value) {\n    //\
    \ Some implementation here\n}\nfinal Long value = null;\ncalculate(value);\n```\n\
    \n这段代码段可以正常编译，但在执行 `Long` 到 `long` 的转换时会在第 02 行抛出 `NullPointerException`。这里的最佳建议是使用原始类型（但我们所知，在某些情况下是不可能的）。\n\
    \n### 接口（Interfaces）\n\n在可能的情况下，接口优于具体类。这些真实的示例应该能让你至少先考虑使用接口。\n\n接口仅与默认方法绑定，而不与任何特定的实现绑定。它们仅仅作为合同，在履行合同的方式上提供了许多自由和灵活性。如果实现涉及外部服务或系统，这种灵活性会变得更加重要。\n\
    \n以下是一个简单接口及其可能的实现的示例：\n\n```java\npublic interface TimezoneService {\n    TimeZone\
    \ getTimeZone(final double lat, final double lon) throws IOException;\n}\n\npublic\
    \ class TimezoneServiceImpl implements TimezoneService {\n    @Override\n    public\
    \ TimeZone getTimeZone(final double lat, final double lon) throws IOException\
    \ {\n        final URL url = new URL(String.format(\n            \"[`api.geonames.org/timezone?lat=%.2f&lng=%.2f&username=demo`](http://api.geonames.org/timezone?lat=%25.2f&lng=%25.2f&username=demo)\"\
    ,\n            lat, lon\n        ));\n        final HttpURLConnection connection\
    \ = (HttpURLConnection)url.openConnection();\n\n        connection.setRequestMethod(\"\
    GET\");\n        connection.setConnectTimeout(1000);\n        connection.setReadTimeout(1000);\n\
    \        connection.connect();\n\n        int status = connection.getResponseCode();\n\
    \        if (status == 200) {\n            // Do something here\n        }\n\n\
    \        return TimeZone.getDefault();\n    }\n}\n```\n\n上述代码展示了一种常见的接口/实现模式。该实现专门使用一个外部\
    \ HTTP（注意：不是 https，后者是安全的服务器）服务（`http://api.geonames.org/`）来获取查询位置的时区。但是由于接触是由接口驱动的，引入另一个使用扁平文件或数据库的实现并不困难。这样，接口极大地帮助设计了可测试的代码。在每次测试运行期间调用外部服务可能并不切实际，因此提供这种备选的虚拟实现（也称为\
    \ stub 或 mock）作为替代方案是有意义的：\n\n```java\npublic class TimezoneServiceTestImpl implements\
    \ TimezoneService {\n    @Override\n    public TimeZone getTimeZone(final double\
    \ lat, final double lon) throws IOException {\n        return TimeZone.getDefault();\n\
    \    }\n}\n```\n\n上述实现可以用任何需要 `TimezoneService` 接口的地方，这使得测试场景与其对外部组件的依赖隔离离开。\n\
    \nJava 标准集合库内部包含了适当使用接口示例。`Collection`、`List`、`Set`，所有这些接口都有多个更多的实现支持，当首选使用接口时，这些实现可以互换且无缝地替换。\n\
    \n以下是此点的示例：\n\n```java\npublic static <T> void print(final Collection<T> collection)\
    \ {\n    for(final T element: collection) {\n        System.out.println(element);\n\
    \    }\n}\nprint(new HashSet<Object>(/* ... */));\nprint(new ArrayList<Integer>(/*\
    \ ... */));\nprint(new TreeSet<String>(/* ... */));\n```\n\nString 在 Java 中是不可变的。每次执行任何操作时，都会创建一个新实例。标准库提供了两个非常有帮助的类来方便字符串操作：`StringBuilder`\
    \ 和 `StringBuffer`（主要区别在于 `StringBuffer` 是线程安全的，而 `StringBuilder` 不是）。\n\n```java\n\
    final sb = new StringBuilder();\nfor(int i = 1; i <= 10; ++i) {\n    sb.append(\"\
    \ \");\n    sb.append(i);\n}\nsb.delete(0);\nsb.insert(0, \"[\");\nsb.replace(sb.length()\
    \ - 3, sb.length(), \"]\");\n```\n\n建议使用 `StringBuilder`/`StringBuffer` 来操作字符串，但在连接两个或三个字符串时可能看起来过头了；在这种情况下，可以使用普通的\
    \ `+` 运算符。\n\n以下是一个示例：\n\n```java\nString userId = \"user:\" + new Random().nextInt(100);\n\
    ```\n\n使用字符串格式化是直接拼接的替代方案，Java 标准库提供了静态辅助方法 `String.format`。它还支持完整的格式化符集，包括日期/时间、字符等（参见完整的[官方文档](https://docs.oracle.com/javase/7/docs/api/java/util/Formatter.html#syntax)）。\n\
    \n通过示例探索格式化的威力：\n\n```java\nString.format(\"%04d\", 1); // 0001\nString.format(\"\
    %.2f\", 15.643624); // 15.64\nString.format(\"%tR\", new Date()); // 14:07\nString.format(\"\
    %tF\", new Date()); // 2016-20-04\nString.format(\"%d%%\", 22); // 22%\n```\n\n\
    `String.format` 方法是一种构建来自不同数据类型的字符串的简单且整洁的方法。某些现代 Java IDE 可以分析格式规范与传递给 `String.format`\
    \ 方法的参数，并在检测到任何不匹配时警告开发者。\n\n"
- fmt: "\nThere is no reason to strictly follow any specific naming conventions in\
    \ Java, but there are a set of easy to follow rules that make Java code look uniform\
    \ across standard library or any other Java project in the wild.\n\n- local variable\
    \ and method arguments names are typed in camel case: `str`, `newLength`, `minimumCapacity`\n\
    - static final field or enumeration constant names are typed in upper case, separated\
    \ by underscore `_`: `LOG`, `MIN_RADIX`, `INSTANCE`\n- class, `enum`, `interface`\
    \ or annotation names are typed in capitalized case: `StringBuilder`, `Runnable`,\
    \ `@Override`\n- generic type parameter names are usually represented as one character\
    \ in upper case: `T`, `U`, `E`\n- method or field names(except `static final`)\
    \ are typed in camel case: `isEmpty`, `format`, `addAll`\n- package names are\
    \ typed in lower case: `org.junit`, `com.fasterxml.jackson`, `javax.json`\n\n\
    With these simple conventions the code will look concise and indistinguishable\
    \ other library or framework.\n\n### Standard Libraries\n\nthe Java standard libraries\
    \ have some rough edges and strange design decisions but 99% of it is high quality\
    \ code written by coding experts. It is worth being familiar with these resources.\n\
    \nEach new Java release includes many new features being added to existing libraries\
    \ (and possible deprecation of the older ones) and addition of new libraries.\
    \ Java 5 introduced a new concurrency library that reconciles as `java.util.concurrent`\
    \ package. Java 6 debuteda scripting support `javax.script` package and Java compiler\
    \ API `javax.tools` package. Java 7 included improvements to `java.util.concurrent`,\
    \ featured a newI/O library under `java.nio.file` package, and dynamic languages\
    \ support with `java.lang.invoke` package. Currently, Java 8 has delivered the\
    \ long-awaited date/time API hosted as `java.time` package.\n\nJava’s platform\
    \ is growing and evolving; it is extremely important to keep educated in this\
    \ evolution. Whenever a third-party library or framework is introduced into a\
    \ project, ensure the required functionality is not available in the Java standard\
    \ libraries.\n\n### Immutability\n\nPlease take immutability seriously. If a class\
    \ being designed or a method being implemented might provide the immutability\
    \ guarantee, it could be used almost universally without fearing concurrent modifications.\
    \ This will improve life as a developer and team member.\n\n### Testing\n\nTest-driven\
    \ development (TDD) practices are widely practiced in the Java community, constantly\
    \ working to raise the bar of the coding quality. TDD brings many benefits to\
    \ the table, however Java standard library does not currently include any test\
    \ framework or scaffolding.\n\nTesting is still a necessary part of modern Java\
    \ development. Here we will cover some basics using a well written `JUnit` framework.\
    \ Using `JUnit`, each test is a set of assertions regarding the expect object\
    \ state or behavior.\n\nGreat tests are short and simple, testing one thing at\
    \ a time. let us test to verify that `String.format` function from the section\
    \ Strings returns the desired results by writing a set of tests:\n\n```java\n\
    package com.javacodegeeks.advanced.generic;\n\nimport static org.junit.Assert.assertThat;\n\
    import static org.hamcrest.CoreMatchers.equalTo;\n\nimport org.junit.Test;\n\n\
    public class StringFormatTestCase {\n    @Test\n    public void testNumberFormattingWithLeadingZeros()\
    \ {\n        final String formatted = String.format(\"%04d\", 1);\n        assertThat(formatted,\
    \ equalTo(\"0001\"));\n    }\n\n    @Test\n    public void testDoubleFormattingWithTwoDecimalPoints()\
    \ {\n        final String formatted = String.format(\"%.2f\", 12.324234d);\n \
    \       assertThat(formatted, equalTo(\"12.32\"));\n    }\n}\n```\n\nThese tests\
    \ are readable and execution is instantiations. A Java project contains hundreds\
    \ of test cases, for quick feedback on regressions or features that are under\
    \ development.\n\n# Chapter 2- How & When to Use Exceptions\n\n### Introduction\n\
    \nExceptions in Java signal abnormal, or exceptional, conditions in the flow of\
    \ the program that may prevent it from making further progress. These exceptional\
    \ conditions could be fatal; where the program is not able to function anymore\
    \ and should be terminated. Or the conditions could be recoverable; where the\
    \ program continues to run but some functionality may be lost.\n\nHere we will\
    \ walk through a typical scenario utilizing exceptions in Java Explain the checked\
    \ and unchecked exceptions, and touch on some corner cases and helpful idioms.\n\
    \n### Exceptions: when to use them\n\nSimply put exceptions are events or signals\
    \ that happen while a program is executing and interrupt the normal flow of execution.\
    \ Exceptions are a replacement to error codes and status techniques used in the\
    \ early days. Now exceptions have gained acceptance as the standard in varied\
    \ languages, including Java.\n\nExceptions handling has only one important rule:\
    \ do not ignore them. Each exception should be logged but never ignored. There\
    \ are rare instances when an exception could be ignored because not much can be\
    \ done with it.\n\nManagement of exceptions in Java is unique. There are two distinct\
    \ classes of exceptions: checked exceptions and unchecked exceptions.\n\nUnchecked\
    \ exceptions signal erroneous conditions related to program logic and assumptions.\
    \ unchecked exception would be a subclass of `RuntimeException` and that is how\
    \ Java compiler sees that specific exception belongs.\n\n```java\npublic class\
    \ NullPointerException extends RuntimeException {\n    public NullPointerException()\
    \ {\n        super();\n    }\n\n    public NullPointerException(String s) {\n\
    \        super(s);\n    }\n}\n```\n\nChecked exceptions show invalid conditions\
    \ in areas outside the immediate control of the program (like memory, network,\
    \ file system). Unlike the unchecked exceptions, checked exceptions must be caught\
    \ by the caller or listed as part of the method signature. The `IOException` is\
    \ the most known in checked:\n\n```java\npublic class IOException extends Exception\
    \ {\n    public IOException() {\n        super();\n    }\n\n    public IOException(String\
    \ message) {\n        super(message);\n    }\n\n    public IOException(String\
    \ message, Throwable cause) {\n        super(message, cause);\n    }\n\n    public\
    \ IOException(Throwable cause) {\n        super(cause);\n    }\n}\n```\n\nChecked\
    \ and unchecked exceptions has introduced more boilerplate and ugly code patterns\
    \ than solved the real problems. The typical pattern that has emerged within Java\
    \ ecosystem is, to hide, or wrap, the checked exception within unchecked one.\n\
    \nBelow is an example:\n\n```java\ntry {\n    // Some I/O operation here\n}\n\
    ```\n"
  raw: 'There is no reason to strictly follow any specific naming conventions in Java,
    but there are a set of easy to follow rules that make Java code look uniform across
    standard library or any other Java project in the wild.


    *   local variable and method arguments names are typed in camel case:str,newLength,minimumCapacity


    *   static final field or enumeration constant names are typed in upper case,
    separated by underscore  ‘_’:LOG,MIN_RADIX,INSTANCE


    *   class, enum, interface or annotation names are typed in capitalized case:StringBuilder,Runnable,@Override


    *   generic type parameter names are usually represented as one character in upper
    case:  T,U,E


    *   method or field names(exceptstatic final)are typed in camel case:isEmpty,format,addAll


    *   package names are typed in lower case:org.junit,com.fasterxml.jackson,javax.json


    With these simple conventions the code will look concise and indistinguishable
    other library or framework.


    Standard Libraries


    the Java standard libraries have some rough edges and strange design decisions
    but 99% of it is high quality code written by coding experts. It is worth being
    familiar with these resources.


    Each new Java release includes many new features being added to existing libraries
    (and possible deprecation of the older ones) and addition of new libraries. Java
    5 introduced a  new concurrency library that reconciles as  java.util.concurrent
    package. Java 6 debuteda scripting supportjavax.script package and Java compiler
    API  javax.tools package.  Java 7 included improvements to  java.util.concurrent,featured
    a  newI/O library under  java.nio.file package, and dynamic languages support
    with  java.lang.invoke package. Currently, Java 8 has delivered the long-awaited
    date/time API hosted as  java.time package.


    Java’s platform is growing and evolving; it is extremely important to keep educated
    in  this evolution. Whenever a third-party library or framework is introduced
    into a project, ensure the required functionality is not available in the Java
    standard libraries.


    Immutability


    Please take immutability seriously. If a class being designed or a method being
    implemented might provide the immutability guarantee, it could be used almost
    universally without fearing concurrent modifications. This will improve life as
    a developer and team member.


    Testing


    Test-driven development (TDD) practices are widely practiced in the Java community,
    constantly working to raise the bar of the coding quality. TDD brings many benefits
    to the table, however Java standard library does not currently include any test
    framework or scaffolding.


    Testing is still a necessary part of modern Java development.  Here we will cover
    some basics using a well written JUnit framework. Using JUnit, each test is a
    set of assertions regarding the expect object state or behavior.


    Great tests are short and simple, testing one thing at a time. let us test to
    verify that  String.format  function from the section Strings  returns the desired
    results by writing a set of tests:


    | 01 | package  com.javacodegeeks.advanced.generic; |


    | 02 |  |


    | 03 | import  static  org.junit.Assert.assertThat; |


    | 04 | import  static  org.hamcrest.CoreMatchers.equalTo; |


    | 05 |  |


    | 06 | import  org.junit.Test; |


    | 07 |  |


    | 08 | public  class  StringFormatTestCase { |


    | 09 |     @Test |


    | 10 |     public  void  testNumberFormattingWithLeadingZeros() { |


    | 11 |         final  String formatted = String.format( "%04d", 1  ); |


    | 12 |         assertThat( formatted, equalTo( "0001"  ) ); |


    | 13 |     } |


    | 14 |  |


    | 15 |     @Test |


    | 16 |     public  void  testDoubleFormattingWithTwoDecimalPoints() { |


    | 17 |         final  String formatted = String.format( "%.2f", 12.324234d );
    |


    | 18 |         assertThat( formatted, equalTo( "12.32"  ) ); |


    | 19 |     } |


    | 20 | } |


    These tests are readable and execution is instantiations. A Java project contains
    hundreds of test cases, for quick feedback on regressions or features that are
    under development.


    # Chapter 2- How & When to Use Exceptions


    Introduction


    Exceptions in Java signal abnormal, or exceptional, conditions in the flow of
    the program that may prevent it from making further progress. These exceptional
    conditions could be fatal; where the program is not able to function anymore and
    should be terminated.  Or the conditions could be recoverable; where the program
    continues to run but some functionality may be lost.


    Here we will walk through a typical scenario utilizing exceptions in Java  Explain
    the checked and unchecked exceptions, and touch on some corner cases and helpful
    idioms.


    Exceptions: when to use them


    Simply put exceptions are events or signals that happen while a program is executing
    and interrupt the normal flow of execution. Exceptions are a replacement to the
    error codes and status checking techniques used in the early days of coding. Now
    exceptions have gained acceptance as the standard in dealing with error conditions
    in varied coding languages, including Java.


    Exceptions handling has only one important rule universally: do not ignore them.
     Each exception should be logged but never ignored. There are rare instances when
    an exception could be safely ignored because not much can be done with it.


    Exceptions are a crucial part of argument validation and sanity checks. Every
    public method should verify inclusion of all required preconditions prior to doing
    any real work and raise the appropriate exception if some have not been met.


    Checked and unchecked exceptions


    Management of exceptions in the Java language is unique. There are two distinct
    classes of exceptions in Java: checked exceptions and unchecked exceptions. These
    two classes are primarily artificial, imposed by Java language rules and its compiler.
     It should be noted that JVM makes no difference between them.


    Unchecked exceptions signal erroneous conditions related to program logic and
    assumptions being made (invalid arguments, null pointers, unsupported operations,
    etc). An unchecked exception would be a subclass of RuntimeException and that
    is how Java compiler sees that a specific exception belongs to the class of unchecked
    items.


    An unchecked exception is not required to be defined as caught by the caller or
    to be listed part of the method signature (this throws keyword).NullPointerException  is
    a widely known member of unchecked exceptions.


    Here is its declaration from the Java standard library:


    | 1 | public  class  NullPointerExceptionextends  RuntimeException { |


    | 2 |     public  NullPointerException() { |


    | 3 |         super(); |


    | 4 |     } |


    | 5 |  |


    | 6 |     public  NullPointerException(String s) { |


    | 7 |         super(s); |


    | 8 |     } |


    | 9 | } |


    Checked exceptions show invalid conditions in areas outside the immediate control
    of the program (like memory, network, file system, etc). A checked exception is
    a direct subclass of Exception. Unlike the unchecked exceptions, checked exceptions
    must be aughtby the caller or listed as a part of the method signature (thisthrows
    keyword). The  IOException is the most known in checked exceptions:


    | 01 | public  class  IOExceptionextends  Exception { |


    | 02 |     public  IOException() { |


    | 03 |         super(); |


    | 04 |     } |


    | 05 |  |


    | 06 |     public  IOException(String message) { |


    | 07 |         super(message); |


    | 08 |     } |


    | 09 |  |


    | 10 |     public  IOException(String message, Throwable cause) { |


    | 11 |         super(message, cause); |


    | 12 |     } |


    | 13 |  |


    | 14 |     public  IOException(Throwable cause) { |


    | 15 |         super(cause); |


    | 16 |     } |


    | 17 | } |


    Checked and unchecked exceptions has introduced more boilerplate and ugly code
    patterns than solved the real problems. The typical pattern that has emerged within
    Java ecosystem is, to hide, or wrap, the checked exception within unchecked one.


    Below is an example:


    | 1 | try  { |


    | 2 |     // Some I/O operation here |'
