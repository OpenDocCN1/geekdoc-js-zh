  trans: "\n在 Java 中没有理由严格遵守任何特定的命名规范，但有一套易于遵循的规则，使得 Java 代码在标准库或任何其他外部 Java 项目中看起来风格统一。\n\
    \n- 局部变量和方法参数名使用驼峰命名法（camel case）：`str`、`newLength`、`minimumCapacity`\n- static\
    \ final 字段或枚举常量使用大写，并用下划线 `_` 分隔：`LOG`、`MIN_RADIX`、`INSTANCE`\n- 类、`enum`、`interface`\
    \ 或注解名称使用首字母大写：`StringBuilder`、`Runnable`、`@Override`\n- 泛型类型参数名通常表示为大写的字母：`T`、`U`、`E`\n\
    - 方法或字段名（`static final` 除外）使用驼峰命名法：`isEmpty`、`format`、`addAll`\n- 包名为小写：`org.junit`、`com.fasterxml.jackson`、`javax.json`\n\
    \n通过这些简单的约定，代码看起来非常简洁，且与其他库或框架无异。\n\n### 标准库\n\nJava 标准库存在一些粗糙的边缘和奇怪的设计决策，但 99%\
    \ 是由编码专家编写的高质量代码。熟悉这些资源是非常值得。\n\n每个新的 Java 版本都包含现有库的许多新功能（并可能弃用旧版本）以及新库的添加。Java\
    \ 5 引入了一个新的并发库，位于 `java.util.concurrent` 包中。Java 6 发布了脚本支持 `javax.script` 包和 Java\
    \ 编译器 API `javax.tools` 包。Java 7 包含了对 `java.util.concurrent` 的改进，引入了 `java.nio.file`\
    \ 包下的新 I/O 库，以及通过 `java.lang.invoke` 包对动态语言的支持。目前，Java 8 提供了期待已日期时间 API，托管在 `java.time`\
    \ 包中。\n\nJava 平台正在增长和演进；保持这种演变的认知极其重要。每当项目中引入第三方库或框架时，请确保所需的功能在 Java 标准库中尚未提供。\n\
    \n### 不变性\n\n请认真对待不可变性。如果设计的类或实现的方法可以提供不可变性保证，那么它几乎可以在任何地方使用，而无需担心并发修改。这将改善开发者和团队成员的生活。\n\
    \n### 测试\n\n测试驱动开发（TDD）实践在 Java 社区被广泛采用，不断提高代码质量标准。TDD 带来了许多好处，但 Java 标准库目前不包含任何测试框架或脚手架。\n\
    \n测试仍然是现代 Java 开发不可或缺的一部分。在这里我们将使用编写良好的 `JUnit` 框架涵盖一些基础知识。使用 `JUnit`，每个测试都是关于预期对象状态或行为的断言集合。\n\
    \n优秀的测试是短小且简单的，一次测试一点。让我们通过编写一组测试来验证 Strings 章节中的 `String.format` 函数返回预期的结果：\n\
    \n```java\npackage com.javacodegeeks.advanced.generic;\n\nimport static org.junit.Assert.assertThat;\n\
    import static org.hamcrest.CoreMatchers.equalTo;\n\nimport org.junit.Test;\n\n\
    public class StringFormatTestCase {\n    @Test\n    public void testNumberFormattingWithLeadingZeros()\
    \ {\n        final String formatted = String.format(\"%04d\", 1);\n        assertThat(formatted,\
    \ equalTo(\"0001\"));\n    }\n\n    @Test\n    public void testDoubleFormattingWithTwoDecimalPoints()\
    \ {\n        final String formatted = String.format(\"%.2f\", 12.324234d);\n \
    \       assertThat(formatted, equalTo(\"12.32\"));\n    }\n}\n```\n\n这些测试具有可读性且执行速度快。一个\
    \ Java 项目包含数百个测试用例，以便对回归或开发中的功能提供快速反馈。\n\n# 第 2 章 - 何时以及如何使用异常\n\n### 引言\n\nJava\
    \ 中的异常表示程序流中的异常或特殊情况，这些情况可能会阻止程序继续运行。这些异常情况可能是致命的；程序无法继续运行并应该终止；或者这些情况是可以恢复的；程序继续运行但某些功能可能会丢失。\n\
    \n在这里我们将遍历使用 Java 异常的典型场景，解释检查异常（checked exceptions）和未检查异常（unchecked exceptions），并涉及一些边界情况和实用的用法。\n\
    \n### 异常：何时使用\n\n简单来说，异常是程序执行期间发生并中断正常执行流的事件或信号。异常是早期使用的错误代码和状态技术的替代方案。现在，异常已被接受为包括\
    \ Java 在内的多种语言的标准。\n\n异常处理只有一个重要的规则：不要忽略它们。每个异常都应该被记录但绝不能被忽略。在极少数情况下，由于对异常能做不了什么，异常可以被忽略。\n\
    \nJava 中的异常管理是独特的。异常分为两个不同的类：检查异常和未检查异常。\n\n未检查异常表示与程序逻辑和假设相关的错误状况。未检查异常将是 `RuntimeException`\
    \ 的子类，Java 编译器通过这种方式识别特定的异常所属。\n\n```java\npublic class NullPointerException extends\
    \ RuntimeException {\n    public NullPointerException() {\n        super();\n\
    \    }\n\n    public NullPointerException(String s) {\n        super(s);\n   \
    \ }\n}\n```\n\n检查异常显示程序直接控制范围之外无效状况（如内存、网络、文件系统）。与未检查异常不同，检查异常必须由调用者捕获，或者作为方法签名的一部分列出。`IOException`\
    \ 是检查异常中最著名的：\n\n```java\npublic class IOException extends Exception {\n    public\
    \ IOException() {\n        super();\n    }\n\n    public IOException(String message)\
    \ {\n        super(message);\n    }\n\n    public IOException(String message,\
    \ Throwable cause) {\n        super(message, cause);\n    }\n\n    public IOException(Throwable\
    \ cause) {\n        super(cause);\n    }\n}\n```\n\n检查异常和未检查异常引入的样板代码和丑陋的代码模式比解决实际问题的更多。在\
    \ Java 生态系统中出现的典型模式是，将检查异常隐藏或包装在未检查异常中。\n\n下面是一个示例：\n\n```java\ntry {\n    //\
    \ 一些 I/O 操作\n}\n```\n"
- fmt: "\nA careful design of the exception hierarchies may reduce the amount of boilerplate\
    \ code needed.\n\nAn Additional class of exceptions in Java that extends the `Error`\
    \ class is `OutOfMemoryError` or `StackOverflowError`. These exceptions indicate\
    \ a fatal execution failure that leads to immediate program termination with no\
    \ possible recovery.\n\n### Using try-with-resources\n\nStack unwinding is often\
    \ caused by an exception being thrown. It is common that program execution flow\
    \ mutations happen in this same manner. Resource leaks directly related to native\
    \ resources that remain unclosed, network sockets and file handles, for example,\
    \ are the result of these thrown exceptions.\n\nA well-behaved, typical I/O operation\
    \ in Java (prior to version 7) using a mandatory `finally` block to execute the\
    \ cleanup:\n\n```java\npublic void readFile( final File file ) {\n    InputStream\
    \ in = null;\n    try {\n        in = new FileInputStream( file );\n        //\
    \ Some implementation here\n    } catch( IOException ex ) {\n        // Some implementation\
    \ here\n    } finally {\n        if( in != null ) {\n            try {\n     \
    \           in.close();\n            } catch( final IOException ex ) {\n     \
    \           /* do nothing */\n            }\n        }\n    }\n}\n```\n\nThe `finally`\
    \ block is not well coded (but calling `close` method on the input stream could\
    \ also result in `IOException` exception), the attempt to close input stream (and\
    \ free up the operation system resources behind it) will be performed. Exceptions\
    \ should be never ignored, but the kind thrown by `close` method are the single\
    \ exclusion of this rule.\n\nJava 7 has had a new construct introduced into the\
    \ language named `try-with-resources` which made overall resource management easier.\
    \ Below is the code snippet from above rewritten using `try-with-resources`:\n\
    \n```java\npublic void readFile( final File file ) {\n    try( InputStream in\
    \ = new FileInputStream( file ) ) {\n        // Some implementation here\n   \
    \ } catch( final IOException ex ) {\n        // Some implementation here\n   \
    \ }\n}\n```\n\nThe resource is required to have implementation of the interface\
    \ `AutoCloseable` in order to be used in the `try-with-resources` blocks. Java\
    \ compiler expands this construct from behind the scenes to something more complex,\
    \ and developers the code looks very readable and concise. This is a very convenient\
    \ technique where appropriate.\n\n### Exceptions and lambdas\n\nUnchecked exceptions\
    \ will work as expected, but the syntax of Java’s lambda functions does not allow\
    \ specification of the checked exceptions; unless those are defined by `@FunctionalInterface`\
    \ itself, which may be thrown.\n\nThe below code snippet should not compile with\
    \ compilation error ‘Unhandled exception type IOException’ (which could be thrown\
    \ at line 03):\n\n```java\npublic void readFile() {\n    run( () -> {\n      \
    \  Files.readAllBytes( new File( \"some.txt\" ).toPath() );\n    } );\n}\n\npublic\
    \ void run( final Runnable runnable ) {\n    runnable.run();\n}\n```\n\nThe solution\
    \ is to catch the `IOException` exception within lambda body and re-throw the\
    \ correct `RuntimeException` (passing the original exception as cause). Below\
    \ is an example:\n\n```java\npublic void readFile() {\n    run( () -> {\n    \
    \    try {\n            Files.readAllBytes( new File( \"some.txt\" ).toPath()\
    \ );\n        } catch( IOException ex ) {\n            throw new RuntimeException(\
    \ \"Error reading file\", ex );\n        }\n    } );\n}\n```\n\nA number of functional\
    \ interfaces are declared and have the ability to throw any `Exception` from its\
    \ implementation, but if not, like `Runnable`, wrapping, or catching the checked\
    \ exceptions within unchecked ones is what to do.\n\n### Standard exceptions\n\
    \nThe Java standard libraries provide a wealth of information on exception classes.\
    \ These classes are specifically designed to cover the majority of generic errors\
    \ that may occur in the process execution. The table below shows the exception\
    \ classes that are used often, always consider these prior to defining your own.\n\
    \n| Exception | Purpose |\n| :--- | :--- |\n| `NullPointerException` | Attempts\
    \ to use `null` where an object is required. |\n| `IllegalArgumentException` |\
    \ Method passed an illegal or inappropriate argument. |\n| `IllegalStateException`\
    \ | Method invoked at an illegal or inappropriate time. |\n| `IndexOutOfBoundsException`\
    \ | Index (to a vector, to a string, or to an array) is out of range. |\n| `UnsupportedOperationException`\
    \ | Requested operation is not supported. |\n| `ArrayIndexOutOfBoundsException`\
    \ | An array was accessed with an illegal index. |\n| `ClassCastException` | Code\
    \ attempted to cast an object to a subclass where it is not an instance. |\n|\
    \ `EnumConstantNotPresentException` | Attempt to access enum constant by name\
    \ and the type contains no constant with the specified name. |\n| `FormatException`\
    \ | Attempts to convert a string to one of the numeric types, but the string does\
    \ not have the appropriate format. |\n| `StringIndexOutOfBoundsException` | Index\
    \ is either negative or greater than the size of the string. |\n| `IOException`\
    \ | I/O exception of some sort has occurred. This class is the general class of\
    \ exceptions produced by failed or interrupted I/O operations. |\n\n### Defining\
    \ your own exceptions\n\nException classes are very easily defined in Java language.\
    \ Exception hierarchies that have been carefully designed for detailed, erroneous\
    \ conditions management and reporting to allow detailed implementation. Achieving\
    \ the correct balance is singularly important; especially in the event that are\
    \ too many exception classes that might complicate the development as well as\
    \ inflate the amount of the code to catch exceptions or propagate them further\
    \ down the stack.\n\nAll user-defined exceptions must be inherited from `RuntimeException`\
    \ class and be part the class of unchecked exceptions, there are always some exclusions\
    \ from the rule. Below is defined exception to dial with authentication:\n\n```java\n\
    public class NotAuthenticatedException extends RuntimeException {\n    private\
    \ static final long serialVersionUID = 2079235381336055509L;\n\n    public NotAuthenticatedException()\
    \ {\n        super();\n    }\n\n    public NotAuthenticatedException( final String\
    \ message ) {\n        super( message );\n    }\n\n    public NotAuthenticatedException(\
    \ final String message, final Throwable cause ) {\n        super( message, cause\
    \ );\n    }\n}\n```\n\nThe purpose of this exception is to signal about non-existing\
    \ or invalid user credentials during sing-in process, for example:\n\n```java\n\
    public void signin( final String username, final String password ) {\n    if(\
    \ !exists( username, password ) ) {\n        throw new NotAuthenticatedException(\"\
    User / Password combination is not recognized\") );\n    }\n}\n```\n\nPassing\
    \ the informative message along with the exception helps to troubleshoot production\
    \ systems. If the exception was re-thrown as the result of a different exceptional\
    \ condition, the initial exception must be preserved using the cause constructor\
    \ argument. This will help to source the problem.\n\n### Documenting exceptions\n\
    \nThe next topic will be discussing how to make exceptions to be a part of the\
    \ documentation as well.\n"
