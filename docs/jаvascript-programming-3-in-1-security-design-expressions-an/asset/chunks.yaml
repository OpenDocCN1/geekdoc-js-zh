    the Code The impact of code injection attacks can be very severe. It depends on
    how much the attacker knows about the application and its infrastructure. One
    of the simplest attacks is denial of service. Crashing the application and removing
    its files from the disk to prevent it from restarting are all easy to do if the
    application process has sufficient privileges. Such attacks are usually quite
    easy to detect and prevent. Modification of application logic is much more difficult
    to discover and stop. A determined attacker with a knowledge of application code
    can modify application state to bypass access controls or compromise internal
    data integrity rules. Sensitive data leaks are a serious concern if an injection
    vulnerability allows for data to be returned to the attacker. Attackers do not
    always focus on the application itself. Remote code execution vulnerabilities
    are often used to establish initial access to the infrastructure. This allows
    further attacks to be launched via the compromised web application. Web shells
    allow attackers to execute arbitrary commands on the system that runs the compromised
    web application. The attacker sends a web shell payload to the application. If
    the code injection attack is successful, the compromised server starts listening
    to commands over the HTTP protocol. The attacker can use the web shell to scan
    the network or escalate access to the server. Code injection attacks against JavaScript
    applications running on Node.js make it easy to create a web shell. Injected code
    can easily use the HTTP and OS modules to listen and execute arbitrary commands.
    Let''s take a look at a simple JavaScript web shell. ![](image-sy81brxw.jpg) It
    starts an HTTP server listening on port 8000. The shell commands are sending the
    cmd query string parameter and are immediately executed using the child_process
    module. We will use the minified version of the web shell payload. We are back
    at the browser. Let''s edit our last login request and let''s paste the minified
    version of the web shell. ![](image-3g2i8w0y.jpg) Now, let''s open up a new browser
    tab. Our web shell is listening on port 8000\. Let''s pass the UNIX ls command
    in the cmd parameter, and let''s send the request. ![](image-o8z49x9y.jpg) We
    can see that the server responded with a list of files in the root folder of the
    application. Web shells are a powerful tool for attackers to gain information
    about the compromised system and to launch further attacks. There are several
    coding pattern principles that minimize the chance of introducing code injection
    attacks to your code. The first is to avoid using unsafe functions at all cost.
    If there is no way to dynamically execute JavaScript code, there is no way to
    abuse this functionality. If using eval or similar function is inevitable, we
    should validate the input data very carefully. Our initial arithmetic expression
    sample is a good example. Input validation should ensure that only digits, parentheses,
    and arithmetic operators are allowed. We should prefer allow lists that explicitly
    define what input is legitimate over block lists that only define known bad values.
    Relying on a single line of defense is a risky strategy, and input validation
    should always be supplemented with sanitization of data passed to outside interpreters
    to prevent data being treated as code. We should also plan for our defenses to
    fail. Applying the principle of least authority means that our code runs with
    the bare minimum of privileges necessary to do the job. The less our application
    is capable of doing, the smaller the impact in case attackers run a successful
    code injection attack. Let''s take one more look at the vulnerable code in the
    login.js file. ![](image-9kbq6w9g.jpg) Let''s fix the vulnerability by replacing
    the use of the eval function with a proper JSON parser. JavaScript has a JSON
