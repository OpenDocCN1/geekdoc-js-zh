    \ of Contents – Book 3\n- Introduction\n- Chapter 1 How to Get the Right Tools\n\
    - Chapter 2 How to Create Express Server\n- Chapter 3 How to Retrieve and Search\
    \ for Data Using REST API Methods\n- Chapter 4 How to Create a Module\n- Chapter\
    \ 5 How to Get a Single Piece of Data\n- Chapter 6 How to Search for Data\n- Chapter\
    \ 7 How to Create POST Endpoint to Insert Data\n- Chapter 8 How to Create DELETE\
    \ Endpoint to Delete Data\n- Chapter 9 How to Create PATCH Endpoint to Patch Data\n\
    - Chapter 10 How to Handle Exceptions in REST API Methods\n- Chapter 11 How to\
    \ Build a Reusable Error Module\n- Chapter 12 How to Call REST API from an HTML\
    \ Page\n- Conclusion\n- About Richie Miller\n\n---\n\n# BOOK 1: JAVASCRIPT SECURITY\
    \ DESIGN\n### CODE EXECUTION & VULNERABILITY EXPLOITATION\n**RICHIE MILLER**\n\
    \n## Introduction\nThe web runs on JavaScript is the dominant programming language\
    \ for writing browser applications, and thanks to the `Node.js` runtime, it is\
    \ increasingly common to see it in the back end too. The quality of JavaScript\
    \ code is crucial for security of web applications. This book, however, is not\
    \ about general web application security. We will not address problems that can\
    \ affect applications written in any programming language. We will focus on security\
    \ issues that are unique to JavaScript, and they are a result of its dynamic nature.\
    \ I will teach you how to identify such vulnerabilities, how to fix them, and\
    \ prevent those issues from creeping into your code. First, we will focus on the\
    \ fundamental role that JavaScript plays in web application security. JavaScript\
    \ can contain vulnerabilities, but in some cases it may even become an attack\
    \ vector. There are two popular environments for running JavaScript code, and\
    \ both of them have very different security properties. First, we will take a\
    \ look at how browsers run JavaScript, and then we will see how `Node.js` is different.\
    \ Then, we will look at language features that may lead to security vulnerabilities,\
    \ dynamic typing, dynamic code execution, and prototypal inheritance. We will\
    \ wrap up with an example of a simple coding mistake, literally just a missing\
    \ character, that leads to a significant leak of sensitive data. Information security\
    \ professionals are well known for specific jargon to use. We will not use it\
    \ here, but it is important to understand some basic concepts of web security.\
    \ Attacks against web applications are carried out by people. You may have an\
    \ image of a person in a black hoodie typing at their keyboard in their basement,\
    \ but the reality is much more nuanced. Attackers differ based on their capabilities\
    \ and motivations. They can be teenagers wanting to impress their friends, fired\
    \ employees seeking revenge, as well as criminals breaking into applications for\
    \ money. Attacks would not be possible without vulnerabilities. Vulnerabilities\
    \ are technical flaws in the system that allow people with malicious intent to\
    \ break into our applications and systems. They can be simple bugs in the code,\
    \ fundamental architecture flaws or configuration mistakes. All of them can lead\
    \ to data breaches. Those that usually hit the headlines are about leaking millions\
    \ of sensitive data records, such as credit card numbers. Data breaches can also\
    \ involve abusing application functionality, for example toward their goods without\
    \ paying or getting a refund for goods that were never purchased in the first\
    \ place. Most common web application architecture has three tiers: the browser,\
    \ the server, and database. JavaScript code can run both in the browser and the\
    \ user's device, such as a laptop or smartphone, or on the server using `Node.js`.\
    \ Vulnerabilities in code may allow attackers to breach access to the application.\
    \ A successful attack in database may lead to a data breach that involves many\
    \ users. Bugs in `Node.js` may allow for full server compromise, potentially leading\
    \ to a serious data breach.\n\n## Chapter 1 How Browser Execute JavaScript Code\n\
    JavaScript was created to add interactivity to HTML pages. Web browsers are the\
    \ native environment to run JavaScript. In fact, JavaScript is the dominant programming\
    \ language in this space. When the user visits a web page, the browser downloads\
    \ the HTML code as well as all other assets needed to display this page. Browsers\
    \ allow users to visit multiple pages at the same time in separate windows. If\
    \ one of those sites is infected, JavaScript code running in the browser is restricted\
    \ in what it can do. Luckily, browsers do not allow for this, and code from one\
    \ website cannot access data or functionality from another website. This is one\
    \ of the most fundamental security properties of the web. Some browsers use sophisticated\
    \ sandboxing mechanisms, like running each tab in a separate process. Downloading\
    \ code over the HTTP Protocol and using Subresource Integrity, or `SRI`, prevents\
    \ attackers from injecting their own code into benign sites. JavaScript code running\
    \ in the browser is restricted in what it can do. It has no access to local resources\
    \ such as the file system and the local network. This allows the browser to minimize\
    \ the attack surface and ask the user for explicit consent for using those resources.\n\
    \n`Node.js` is a runtime environment for JavaScript based on the V8 engine built\
    \ for Google Chrome. The unusual thing about it is that it allows JavaScript code\
    \ to run outside of the browser. It has gained a lot of popularity and has proven\
    \ to build command line programs and web applications. It is quite different from\
    \ the browser from a security perspective. Browsers download the code, and `Node.js`\
    \ loads the code from local files like other programming languages. The permissions\
    \ model is also different. Browsers treat the code as untrusted and restrict capabilities\
    \ it has access to, and `Node.js` treats the code with full trust and grants access\
    \ to all the privileges the operating system has access to, including devices,\
    \ files, and the local network. Attacks based on security in a browser may affect\
    \ one victim at a time. Bugs in `Node.js` may allow for full server compromise.\n\
    \nJavaScript is a little bit of an unusual language. Its rapid development and\
    \ massive popularity gave us several language features and coding patterns that\
    \ may easily lead to security bugs. JavaScript variables can refer to objects\
    \ of different types. In statically typed programming languages, variables can\
    \ only store or reference values of a particular type. An integer can only store\
    \ numbers, never strings or objects. In JavaScript, a variable can refer to a\
    \ number, a string or an object, depending on the flow of control. When you look\
    \ at the code, you do not always know the types of variables. It may lead to unintentional\
    \ information disclosure or other security bugs. JavaScript programs can invoke\
    \ JavaScript engine at runtime. It sounds like a really powerful feature, and\
    \ it allows for easy processing of complex data formats, such as mathematical\
    \ formulas or implementing applications that users can extend with their own code.\
    \ Unfortunately, this is also what attackers dream about, the ability to inject\
    \ their code into your application.\n\nJavaScript has a pretty unusual inheritance\
    \ mechanism. Most mainstream programming languages use classes to express static,\
    \ hierarchical relationships between types of objects. In JavaScript, the same\
    \ goal is achieved by building dynamic relationships between individual objects.\
    \ Each object has a parent object, the `prototype` it inherits properties from.\
    \ If attackers can modify the objects forming the prototype chain, they may alter\
    \ the behavior of your code in unforeseen ways. The dynamism of JavaScript is\
    \ powerful and flexible. It facilitates rapid development and unlocks programmer\
    \ productivity. If the same dynamism is abused by attackers, it can lead to security\
    \ vulnerabilities.\n\nThe ecommerce application consists of two components, server\
    \ and client. The code is implemented in JavaScript using `Node.js` and the `Express`\
    \ framework. The details of this framework are not relevant for this book, but\
    \ it allows us to easily handle serving JavaScript code, as well as CSS and HTML\
    \ assets. It also allows us to dynamically generate and serve JSON documents.\
    \ All those files are served by the server to the browser. Let's take a look at\
    \ the server code. The `app.js` file configures the `Express` framework to serve\
    \ static files, parse JSON documents, and handle HTML forms. The code in `login.js`\
    \ handles the login form. It first reads the email and password from the form\
    \ and checks if they match the users in our database. This is a sample application,\
    \ so storing user information in a flat JSON file is good enough. If the user\
    \ credentials are verified, the code sends the cookie back to the browser and\
    \ redirects the user to the return URL from the JSON object from the query string.\n\
    \n---\n\n## BOOK 2: JAVCRIPT EXPRESSIONS\n### OPERATORS, LOOPS, & SWITCH STATEMENTS\n\
    \n## Chapter 1 How the Switch Statement Works\nNow that you have an overview of\
    \ the book, let's dive into our first topic, the `switch` statement. We use the\
    \ `switch` instead of multiple `if/else` statements. It will help us simplify\
    \ our code a bit. We use `case` statements to compare to each expression in the\
    \ switch statement, we use `break` statements to exit out of each case, and the\
    \ `default` statement is used when none of the cases match. Here's an example.\
    \ So I have a switch statement here that has some expression. We're then going\
    \ to compare the value of that expression against each one of the `case` statements\
    \ that we have, and you can have one or many case statements. We typically have\
    \ quite a few.. That's the reason why you would use a `switch`. Once a statement\
    \ matches up, we'll execute a statement or a series of statements. You can have\
    \ as many statements as you wish within each `case` statement. But very important\
    \ is, you have to have a `break` statement before the next `case` because the\
    \ `break` is what will then say, continue with the line after the complete `switch`\
    \ block. If no other cases match, then we use `default`. So if none of the other\
    \ cases match up to the expression, then the default will execute. \n\n## Chapter\
    \ 2 Block-level Scope Issue with Switch Statements\nThe `switch` statement does\
    \ what's called a strict comparison. What that means is that the type and the\
    \ value must match in order for the expression to match to one of the `case` statements.\
    \ We have a new function called `strictComparison` on line 11, and the button\
    \ on line 9 actually calls that. You see on line 12 I set a new variable, `productId`,\
    \ but I set it to the value 2, but that's a string. Then within the `switch` statement,\
    \ notice lines 15, 18, and 21 are a `case` of 1, numeric, 2, numeric, and 3, numeric.\
    \ What do you think's going to happen if we were to run this?\n\n## Chapter 3\
    \ Using a for/in Loop\nThe following chapters are going to cover the difference\
    \ between `for/in` and `for/of`. The goals for this chapter is to look at `for/in`\
    \ statement and `for/of` statement. We'll also take a look at `break`, `continue`,\
    \ and labels.\n\n## Chapter 4 Break and Continue Statements\nThe following chapters\
    \ are going to cover the difference between `for/in` and `for/of`. The goals for\
    \ this chapter is to look at `for/in` statement and `for/of` statement. We'll\
    \ also take a look at `break`, `continue`, and labels.\n\n## Chapter 5 Mathematical\
    \ Operators\nThis chapter is about Using Math and Comparison Operators. The goal\
    \ for this chapter is to look at various operators such as math, assignment, and\
    \ comparison. We'll also take a look at `+`, `-`, `*`, `/`, `%`, `++`, and `--`.\
    \ These are mathematical operators. JavaScript also has a large set of mathematical\
    \ operators.\n\n## Chapter 6 Assignment and Ternary Operators\nJust like in C#,\
    \ there are assignment operators. We know the equals sign assigns one value to\
    \ another, but we also have this shorthand for doing addition, where if you wanted\
    \ to do `price = price +5`, you can do this shorthand of `+=`. And we can do that\
    \ for subtraction, multiplication, division, exponentiation, and modulus. These\
    \ make it very simple, just a nice shorthand instead of having to type so much.\n\
    \n## Chapter 7 Logical Operators\nThis chapter is about working with Logical Operators\
    \ and Short-circuit Evaluation. The goals for this chapter are to learn about\
    \ true and false values. Those are known as truthy and falsy in the JavaScript\
    \ world. We'll talk about learning the logical operators that are also available,\
    \ such as `and`, `or`, and `not`.\n\n## Chapter 8 Short Circuiting & Operator\
    \ Precedence\nShort circuiting is simply an optimization for logical expressions.\
    \ What it allows JavaScript to do is to bypass subsequent expressions in `And`\
    \ or `Or` conditions based on truthy or falsy.\n\n## Chapter 9 Utilizing JavaScript\
    \ Exception Handling\nThis chapter is about Utilizing JavaScript Exception Handling.\
    \ The goals for this chapter are to learn how to handle exceptions using the `try\
    \ catch` statements and the `finally` statement. We'll also talk about how to\
    \ throw your own custom exception and how to determine the type of error that\
    \ has been thrown.\n\n## Chapter 10 How to Detect the Error Type\nNow we saw reporting\
    \ the error type by using `error.name`. Well, let's take a look at the built-in\
    \ errors that get thrown by JavaScript. There is `ReferenceError`, `RangeError`,\
    \ `TypeError`, `URIError`, `SyntaxError`, and `EvalError`. `EvalError` is for\
    \ backwards compatibility only, it's not used anymore. But you may still see it\
    \ in some older code.\n\n## Chapter 11 How to Determine JavaScript Variable Data\
    \ Types\nThis chapter is about to Determine JavaScript Variable Data Types. The\
    \ goals for this chapter are to explore the different data types that are available,\
    \ including primitives and objects. We're going to learn how to determine data\
    \ types using the `typeof` operator and `instanceof` operator.\n\n## Chapter 12\
    \ Helper Functions for the Constructor Property\nA constructor property is nice,\
    \ but it's better to use it. We've seen some helper functions like `isArray`,\
    \ `nullOrUndefined`, etc.\n\n## Chapter 13 Understanding 'this' in JavaScript\n\
    This chapter is about the `this` in JavaScript. The goals for this chapter are\
    \ to learn how `this` changes based on the scope: global scope, function scope,\
    \ object literal, event handler, and method.\n\n## Chapter 14 Copy an Array\n\
    This chapter is about using the Powerful Spread Operator. What we're going to\
    \ do in this particular module is demonstrate the power of spread. We'll use it\
    \ to copy and concatenate arrays, we'll pass parameters to constructors, we'll\
    \ perform shallow copy on objects, and we'll call functions with multiple parameters\
    \ all using spread.\n\n## Chapter 15 Using Spread to Pass Parameters\nWe can also\
    \ use the spread to help us build objects where we pass in multiple values.\n\n\
    ## Chapter 16 Shallow Copy on Object Literals\nAnother useful feature of the spread\
    \ operator is used to perform a shallow copy on object literals. Let's take a\
    \ look at how this works.\n\n```javascript\nlet product = {\n    id: 1,\n    name:\
    \ \"Apple Pie\"\n};\nlet copy = { ...product };\n```\n\n---\n\n# BOOK 3: JAVCRIPT\
    \ WEB DEVELOPMENT\n### BUILDING REST APIS WITH NODE AND EXPRESS JS\n\n## Chapter\
    \ 1 How to Get the Right Tools\n```const fs = require('fs');\nconst FILE_NAME\
    \ = './assets/pies.json';\nconst path = require('path');\n\nconst filePath = path.join(__dirname,\
    \ FILE_NAME);\n\nfs.readFile(filePath, 'utf8', (err, data) => {\n    if (err)\
    \ {\n        console.error(err);\n        return;\n    }\n    const pies = JSON.parse(data);\n\
    \    console.log(pies);\n});\n```\n\n## Chapter 2 How to Create Express Server\n\
    ```javascript\nconst express = require('express');\nconst app = express();\nconst\
    \ router = express.Router();\n\napp.use(express.static('public'));\napp.use(express.json());\n\
    \nrouter.get('/', (req, res) => {\n    res.send('Hello World!');\n});\n\napp.use('/api',\
    \ router);\n\nconst server = app.listen(5000, () => {\n    console.log('Server\
    \ is running on http://localhost:5000');\n});\n```\n\n## Chapter 3 How to Retrieve\
    \ and Search for Data Using REST API Methods\n```javascript\nrouter.get('/pies',\
    \ (req, res) => {\n    fs.readFile(filePath, 'utf8', (err, data) => {\n      \
    \  if (err) {\n            console.error(err);\n            return;\n        }\n\
    \        const pies = JSON.parse(data);\n        res.status(200).json(pies);\n\
    \    });\n});\n```\n\n## Chapter 4 How to Create a Module\n```javascript\nmodule.exports\
    \ = {\n    get: function(resolve, reject) => {\n        // logic\n    }\n};\n\
    ```\n\n## Chapter 5 How to Get a Single Piece of Data\n```javascript\nrouter.get('/pies/:id',\
    \ (req, res) => {\n    fs.readFile(filePath, 'utf8', (err, data) => {\n      \
    \  if (err) {\n            console.error(err);\n            return;\n        }\n\
    \        const pies = JSON.parse(data);\n        const pie = pies.find(p => p.id\
    \ === parseInt(req.params.id));\n        if (pie) {\n            res.status(200).json(pie);\n\
    \        } else {\n            res.status(404).json({ error: 'Pie not found' });\n\
    \        }\n    });\n});\n```\n\n## Chapter 6 How to Search for Data\n```javascript\n\
    router.get('/pies/search', (req, res) => {\n    fs.readFile(filePath, 'utf8',\
    \ (err, data) => {\n        if (err) {\n            console.error(err);\n    \
    \        return;\n        }\n        const pies = JSON.parse(data);\n        const\
    \ query = req.query.name.toLowerCase();\n        const filtered = pies.filter(p\
    \ => p.name.toLowerCase().includes(query));\n        res.status(200).json(filtered);\n\
    \    });\n});\n```\n\n## Chapter 7 How to Create POST Endpoint to Insert Data\n\
    ```javascript\nrouter.post('/pies', (req, res) => {\n    const newPie = req.body;\n\
    \    fs.readFile(filePath, 'utf8', (err, data) => {\n        if (err) {\n    \
    \        console.error(err);\n            return;\n        }\n        const pies\
    \ = JSON.parse(data);\n        pies.push(newPie);\n        fs.writeFile(filePath,\
    \ JSON.stringify(pies, null, 2), (err) => {\n            if (err) {\n        \
    \        console.error(err);\n                return;\n            }\n       \
    \     res.status(201).json(newPie);\n        });\n    });\n});\n```\n\n## Chapter\
    \ 8 How to Create DELETE Endpoint to Delete Data\n```javascript\nrouter.delete('/pies/:id',\
    \ (req, res) => {\n    fs.readFile(filePath, 'utf8', (err, data) => {\n      \
    \  if (err) {\n            console.error(err);\n            return;\n        }\n\
    \        const pies = JSON.parse(data);\n        const index = pies.findIndex(p\
    \ => p.id === parseInt(req.params.id));\n        if (index !== -1) {\n       \
    \     pies.splice(index, 1);\n            fs.writeFile(filePath, JSON.stringify(pies,\
    \ null, 2), (err) => {\n                if (err) {\n                    console.error(err);\n\
    \                    return;\n                }\n                res.status(204).send();\n\
    \            });\n        } else {\n            res.status(404).json({ error:\
    \ 'Pie not found' });\n        }\n    });\n});\n```\n\n## Chapter 9 How to Create\
    \ PATCH Endpoint to Patch Data\n```javascript\nrouter.patch('/pies/:id', (req,\
    \ res) => {\n    fs.readFile(filePath, 'utf8', (err, data) => {\n        if (err)\
    \ {\n            console.error(err);\n            return;\n        }\n       \
    \ const pies = JSON.parse(data);\n        const index = pies.findIndex(p => p.id\
    \ === parseInt(req.params.id));\n        if (index !== -1) {\n            pies[index]\
    \ = { ...pies[index], ...req.body };\n            fs.writeFile(filePath, JSON.stringify(pies,\
    \ null, 2), (err) => {\n                if (err) {\n                    console.error(err);\n\
    \                    return;\n                }\n                res.status(200).json(pies[index]);\n\
    \            });\n        } else {\n            res.status(404).json({ error:\
    \ 'Pie not found' });\n        }\n    });\n});\n```\n\n## Chapter 10 How to Handle\
    \ Exceptions in REST API Methods\n```javascript\nrouter.get('/', (req, res, next)\
    \ => {\n    try {\n        // logic\n    } catch (error) {\n        next(error);\n\
    \    }\n});\n```\n\n## Chapter 11 How to Build a Reusable Error Module\n```javascript\n\
    const errorHandler = (err, req, res, next) => {\n    console.error(err.stack);\n\
    \    res.status(500).json({ error: err.message });\n};\nmodule.exports = errorHandler;\n\
    ```\n\n## Chapter 12 How to Call REST API from an HTML Page\n```html\n<script>\n\
    \    fetch('/api/pies')\n        .then(response => response.json())\n        .then(data\
    \ => console.log(data));\n</script>\n```\n"
