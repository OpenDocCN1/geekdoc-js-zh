    how Node.js is different. Then, we will look at language features that may lead
    to security vulnerabilities, dynamic typing, dynamic code execution, and prototypal
    inheritance. We will wrap up with an example of a simple coding mistake, literally
    just a missing character, that leads to a significant leak of sensitive data.
    Information security professionals are well known for specific jargon to use.
    We will not use it here, but it is important to understand some basic concepts
    of web security. Attacks against web applications are carried out by people. You
    may have an image of a person in a black hoodie typing at their keyboard in their
    basement, but the reality is much more nuanced. Attackers differ based on their
    capabilities and motivations. They can be teenagers wanting to impress their friends,
    fired employees seeking revenge, as well as criminals breaking into applications
    for money. Attacks would not be possible without vulnerabilities. Vulnerabilities
    are technical flaws in the system that allow people with malicious intent to break
    into our applications and systems. They can be simple bugs in the code, fundamental
    architecture flaws or configuration mistakes. All of them can lead to data breaches.
    Those that usually hit the headlines are about leaking millions of sensitive data
    records, such as credit card numbers. Data breaches can also involve abusing application
    functionality, for example toward their goods without paying or getting a refund
    for goods that were never purchased in the first place. The most common web application
    architecture has three tiers, the browser, the server, and the database JavaScript
    code can run both in the browser and the user''s device, such as a laptop or smartphone,
    or on the server using Node.js. Vulnerabilities in code may allow attackers to
    breach access to the application datastore. A successful attack in a database
    may lead to a data breach that involves many users. The impact of a vulnerability
    in code is typically limited to a single user. That sounds like good news. Unfortunately,
    bugs in JavaScript code running in a browser may allow attackers to impersonate
    the victim and to perform actions on their behalf. In this case, the vulnerable
    JavaScript code becomes an attack vector. Chapter 1 How Browser Execute JavaScript
    Code JavaScript was created to add interactivity to HTML pages. Web browsers are
    the native environment to run JavaScript code. In fact, JavaScript is the dominant
    programming language in this space. When the user visits a web page, the browser
    downloads the HTML code of that page, as well as all the other assets needed to
    display this page. This includes CSS style sheets, images, and JavaScript code.
    Browsers allow users to visit multiple pages at the same time in tabs or separate
    browser windows. This means that at any given time, JavaScript code downloaded
    from several different sites is executed in the same browser. If one of those
    sites is infected or even owned by the attacker, aren''t we at risk of malicious
    code stealing our data from legitimate sites? Luckily, browsers do not allow for
    this, and every website executes JavaScript code in its own sandbox within the
    browser. Code from one website cannot access data or functionality from another
    website. This is one of the most fundamental security properties of the web. Some
    browsers use very sophisticated sandboxing mechanisms, like running each tab in
    a separate operating system process. Downloading code over the Secure HTTP Protocol
    and using Subresource Integrity, or SRI for short, prevents attackers from injecting
    their own malicious code into benign sites. JavaScript code running in the browser
    is restricted in what it can do. It has no access to local resources in a user''s
    computer, and this applies to devices such as webcams or microphones, the file
    system, and the local network. The code can use those resources only using very
    limited browser APIs. This allows the browser to minimize the attack surface and
    ask the user for explicit consent for using those resources. Code originating
    from different sites cannot access each other''s data and functionality. This
    allows for even stronger protection of data and code execution within the browser. Node.js
    is a runtime environment for JavaScript based on the V8 engine built for the Google
    Chrome browser. The unusual thing about it is that it allows JavaScript code to
    run outside of the browser. It has gained a lot of popularity and has proven to
    be a popular tool to build command line programs and web applications. It is quite
    different from the browser from a security perspective. Browsers download the
    code, and Node.js loads the code from local files, much like other popular programming
    languages. The permissions model is also different. Browsers treat the code as
    untrusted and restrict capabilities it has access to, and Node.js treats the code
    with full trust and grants access to all the privileges the operating system user
    has access to, including devices, files, and the local network. Attacks based
    on a security vulnerability in a browser may affect one victim at a time. Bugs
    in Node.js may allow for full server compromise, potentially leading to a serious
    data breach. JavaScript is a little bit of an unusual programming language. Its
    rapid development and massive popularity gave us several language features and
    coding patterns that may easily lead to exploitable security bugs. JavaScript
    variables can refer to objects of different types. In statically typed programming
    languages, variables can only store or reference values of a particular type.
    An integer can only store numbers, never strings or objects. In JavaScript, a
    variable can refer to a number, a string or an object, depending on the flow of
    control. When you look at the code, you do not always know the types of variables.
    It may lead to unintentional information disclosure or other security bugs. JavaScript
    programs can invoke JavaScript engine at runtime. It sounds like a really powerful
    feature, and it is. It allows for easy processing of complex data formats, such
    as mathematical formulas or implementing applications that users can extend with
    their own JavaScript code. Unfortunately, this is also what attackers dream about,
    the ability to inject their code into your application. JavaScript has a pretty
    unusual inheritance mechanism. Most mainstream programming languages use classes
    to express static, hierarchical relationships between types of objects. In JavaScript,
    the same goal is achieved by building dynamic relationships between individual
    objects. Each object has a parent object, the prototype it inherits properties
    from. If attackers can modify the objects forming the prototype chain, they may
    alter the behavior of your code in unforeseen ways. The dynamism of JavaScript
    is powerful and flexible. It facilitates rapid development and unlocks programmer
    productivity. If the same dynamism is abused by attackers, it can lead to security
    vulnerabilities. The ecommerce application consists of two components, server
    and client. The code is implemented in JavaScript using Node.js and the Express
    framework. The details of this framework are not relevant for this book, but it
    allows us to easily handle serving JavaScript code, as well as CSS and HTML assets.
    It also allows us to dynamically generate and serve JSON documents. All those
    files are served by the server to the browser. Let''s take a look at the server
    code. ![](image-bv3gq70e.jpg) The app.js file configures the Express framework
    to serve static files, parse JSON documents, and handle HTML forms. The code in
    login.js handles the login form. ![](image-8i9bakm5.jpg) It first reads the email
    and password from the form and checks if they match the users in our database. ![](image-w79w9ocx.jpg) This
    is a sample application, so storing user information in a flat JSON file is good
    enough. If the user credentials are verified, the code sends the cookie back to
    the browser and redirects the user to the return URL from the JSON object from
    the query string. ![](image-wszr4g4a.jpg) If the credentials are not verified,
    the code returns an HTTP 401 code. The code in logout.js is very simple. ![](image-od1c32ig.jpg) It
    removes the cookie and redirects the user back to the home page. Profile.js has
    two functions.![](image-ticc5t6c.jpg) One of them is responsible for reading profile
    information from the JSON file based on some search criteria. The criteria are
    sent in the field and value query string parameters. Then, we filter the user
    database based on those criteria. The results are sent back to the browser in
    a JSON file. The function responsible for saving the profile information is a
    bit more complex. ![](image-5vze4qwi.jpg) First, we find a user based on the Email
    field. If the user has been found, we clone the field from the request using a
    JavaScript idiom that merges the request object with an empty object. Then, we
    assign all the fields from this copy to the user object in our user database.
    Then, we return to user profile and JSON file. I''m sure you have noticed a few
    helper functions defined in utils.js. ![](image-mmxd9ms4.jpg) The filter function
    returns those elements of the items array where a given field matches the provided
    value. The getParams function retrieves an array of values from the query string
    object. The values are retrieved by names specified in the params array. The function
    also gracefully handles missing values returning null, which is a JavaScript value
    to denote missing data. The merge function performs a deep recursive merge of
    properties of the source object with the properties of the target object. ![](image-xndd76u4.jpg) Using
    such a function with an empty object as the target is a popular JavaScript idiom
    for performing deep copies of objects. Chapter 2 Exploiting the Vulnerability JavaScript
    has a dynamic type system. It means that variables can reference values of different
    types throughout their lifetime. At one point, a variable may refer to a number,
    and it may refer to a string later on. The rules that describe how operations
    are applying to values of different types are quite complex and can lead to security
    issues. When JavaScript code attempts to perform an operation on two values of
    different types, it needs to convert them to a common type where that operation
    is well defined. For example, adding a number to a string will convert that number
    to a string, and the addition operation will become a concatenation of two strings.
    This may lead to unexpected code being called if types of variables are not properly
    tracked and controlled. JavaScript has two comparison operators, strict, also
    known as triple equals (===), and loose, known as double equals (==). The strict
    comparison operator compares both the value and type, so a string can never be
    equal to a number. The loose comparison, when applied to parameters of different
    types, automatically converts the operands to a common type to make the comparison
    possible. When using this operator, a string can, in some cases, be equal to a
    number. Comparing values such as null and undefined is another corner case. Strict
    comparison will always treat those two values as different, but the loose comparison
    will treat them as equal. This may lead to security checks being bypassed. If
    they use the loose comparison, variable types are not enforced. Another aspect
    of JavaScript dynamism is that it used to be very forgiving of programming errors.
    Over time, it became clear that certain language features, like giving any function
    an ability to define a global variable, are dangerous for security and the correctness
    of the code. Newer versions of JavaScript allow the code to run in strict mode
    that prohibits some of the problematic behaviors. Strict mode is enabled by putting
    the use strict string literal at the beginning of a script or function, and it
    should always be used when writing JavaScript code. ![](image-yg4avmim.jpg) Let''s
    quickly review all the code files for use of the loose comparison operator. If
    we find it is used in a security check that operates on untrusted input data,
    it might be a security vulnerability. It looks like the double equals operator
    is used in the filter utility function and is called from the readProfile function. ![](image-jjwpo8bx.jpg) Now
    let''s take a quick look at how to exploit this bug. We identified a potential
    vulnerability. Now we need a way to make use of this bug to either steal sensitive
    data or abuse functionality of our sample application. There are a few ways to
    make use of automatic conversions and loose comparison to invoke an unwanted or
    unexpected behavior. We can try to use numbers instead of strings, we can use
    arrays where objects are expected, we can also remove properties that get the
    JavaScript value undefined. When we have identified input that may potentially
    lead to an attack, we should work backwards from the vulnerable code to the input
    data to try to find a way to deliver it to the vulnerable piece of code. When
    we have that, we can inspect the HTTP requests and responses using browser developer
    tools or proxies such as Fiddler. The next step is to modify legitimate requests
    to include malicious data. Finally, we send such modified requests to the application.
    Let''s see how we may do this for the loose comparison we found in the filter
    function. ![](image-39qvt699.jpg) The loose comparison tries to compare a field
    of an object, provided as an input parameter, to a specific value, also provided
    as an input parameter. Both the field and the value are taken from request parameters
    in the readProfile function. ![](image-z98ku04n.jpg) If we could trick the filter
    condition to always be true, we would be able to retrieve information about all
    the users in the database. ![](image-ghstm4m3.jpg) If the field did not exist,
    the property retrieval, the bracket notation, would return undefined. If the value
    was null, the loose comparison would always be true. Luckily for the attacker,
    it will be null if it is missing from the query string thanks to the getParams
    function. ![](image-3qr322bc.jpg) Let''s see how we can do that. The first step
    is to capture the legitimate request. Let''s open the browser developer tools
    and let''s inspect the network traffic. The request has a field name and value
    in the query string. The response contains an array with a single user object
    matching the provided email value. ![](image-ffg2gr84.jpg) Now, let''s modify
    the request. Let''s remove the value from the query string, and let''s change
    the field name to an invalid value. It''s time to send such a modified request
    to the application. The response now contains information about all the users.
    Our attack has been successful. Now, let''s see how to fix it Chapter 3 Fixing
    & Preventing Code Injection Attacks There are several ways to fix security vulnerabilities
    coming from the JavaScript dynamic typed system. Using strict mode is a except
    for cases where backwards compatibility is a concern. All code should run in strict
    mode. Using loose comparison can lead to strange bugs, and when used in security
    checks it can lead to their bypass. The strict comparison operator, or triple
    equals (===), should be used instead. Object equality can also be checked using
    the Object.is method, which works almost like triple equals, except for a few
    corner cases related to numbers. Untrusted input should always be subject to data
    type verification. All data coming from outside of the application might have
    potentially been tampered with by the attacker and may cause unexpected type conversions
    and unwanted behavior. Now, let''s fix our vulnerability. The simplest way to
    fix the loose comparison vulnerability is to replace it with the triple equals
    operator. ![](image-x73ki68d.jpg) Now, let''s see if this stopped the attack.
    Let''s send the malicious request again. We need to remove the value parameter
    and change the field parameter to an invalid value. Now we get the expected result,
    an empty array. The array is empty because the comparison operator correctly distinguished
    between null and undefined. ![](image-uv45p38e.jpg) If this behavior still seems
    a little off to you, you''re right, we''re still relying on arcane rules of comparison
    of null and undefined values. The input data validation should be a lot stricter
    and reject incorrectly formed requests. Let''s add validation for the field and
    value parameters and return an HTTP 400 code to inform the caller that the request
    was malformed. We need to check if the type of both field and value variables
    is a string. If it is not, we have to return the error code and skip the rest
    of the readProfile function. ![](image-hoc6vs9t.jpg) Let''s send the malicious
    request again. Now, the server properly responds to a malicious attack. ![](image-7m3zofp0.jpg) We
    tightened our defenses by verifying that all required parameters are indeed present
    and that the types are what we expect. In summary, we covered which JavaScript
    features may lead to security bugs. We have seen how the dynamic type system may
    lead to disclosure of sensitive information. In the next few chapters, we will
    dive deep into dynamic code execution and prototypal inheritance, and we will
    see how these features might be exploited. We have also taken a look at the two
    most popular environments for running JavaScript code, and we have seen how different
    they are from a security perspective. Browsers run JavaScript in a secure sandbox,
    but bugs may be used as an attack vector. JavaScript code running on Node.js has
    all the privileges of the operating system account it runs under, and the bugs
    may lead to a full server compromise. Previously, we introduced the basic notions
    of web security and explained the role JavaScript code plays in preventing attacks.
    We also demonstrated how the JavaScript dynamic type system may lead to sensitive
    data leaks. In the following chapters, we will focus on code injection vulnerabilities.
    We will see how to find them in our code, we will demonstrate how they allow attackers
    to execute arbitrary code within our applications, and lastly, we will learn how
    to fix those types of bugs. JavaScript programs can generate and execute code
    on the fly. This capability is often called dynamic code execution. If this code
    is constructed based on input data, and if attackers can tamper with this data,
    they may find a way to get their code executed. JavaScript has several functions
    that except code as a strength parameter and then execute it. We will learn what
    those functions are and what are the differences between them. Each code injection
    attack is different. They can have a variety of negative impacts, from crashing
    the application to cause an outage, all the way up to hijacking the application,
    or even the entire server. We will also discuss coding principles and patterns
    that prevent code injection vulnerabilities from creeping into our programs and
    libraries. Let''s get back to our application. The browser sends HTTP requests
    to the server, the server reads or writes the data from the database, and sends
    the response back to the browser. Code injection attacks originate from the browser
    or other user agent. The attacker sends a malicious payload with code to be executed,
    encoded as data. The application running on the server parses this data. If there
    is a remote code execution vulnerability, the application executes the malicious
    code provided by the attacker. This may allow the attacker to steal sensitive
    data that only the application is allowed to access Chapter 4 Dynamic Code Execution
    & Unsafe Functions JavaScript engines are very versatile. They can run code loaded
    from a variety of sources. Files downloaded from the web and read from files on
    disk are the most popular, but the code may also come from user input or program
    variables. The first phase of running JavaScript is parsing. The JavaScript engine
    reads the source code, analyzes it, and builds an abstract syntax tree presentation
    of the script or module. The next phase is compilation. This phase takes the abstract
    syntax tree as input and translates it to an intermediate representation called
    bytecode. The final phase is execution. This is where the intermediate representation
    is processed by the JavaScript engine and the bytecode instructions are executed
    by the processor. The parse, compile, execute pipeline is invoked when the code
    is loaded, but it can also be invoked at runtime. This gives JavaScript code an
    ability to create new code on the fly. Let''s take a look at the short program
    that evaluates arithmetic expressions. The expression variable is a string that
    stores the expression. ![](image-184owlw1.jpg) This particular body is hard coded,
    but it could come from an HTML form or a command line parameter. The eval function
    parses, compiles, and evaluates the JavaScript expression from the variable. We
    will learn more about the eval function and its properties next. The result of
    evaluating the expression is stored in the result variable. The value of this
    variable is 4\. To calculate this value, the JavaScript engine had to parse, compile,
    and interpret the arithmetic expression as if it was JavaScript code. The type
    of the result variable is a number, the JavaScript type used to represent integer
    and floating point values. Using the eval function allowed us to leverage arithmetic
    expression evaluator built into the JavaScript engine. An alternative solution
    would be to write the parsing and evaluation code ourselves. Now, let''s take
    a look at which JavaScript constructs allow for dynamic code execution. JavaScript
    has two unsafe functions that execute code provided in a variable, eval and the
    function constructor. The use of eval is straightforward. We call the function
    and provide the code to be executed as an argument. The function constructor creates
    a new function. It is a constructor function and should be invoked with the new
    operator. It takes one or more parameters. The last argument should contain the
    body of the function, and the preceding arguments should contain names of parameters
    of the created function. In this example here, variable f refers to a function
    with one parameter named param and with the body stored in the code variable.
    This function body can use the param parameter. ![](image-9mhejvrx.jpg) To invoke
    f, we need to pass a single argument. There are two ways to invoke the eval function.
    Direct invocation is the simplest form. Indirect invocation is any other form
    that does not look like that, but has the same effect. For example, we could create
    a variable to be an alias of the eval function and call that alias. This would
    be an indirect invocation. Dynamic code execution through the function constructor
    is much simpler. We invoke it like a function through the object returned by the
    new operator. There are very subtle differences between those two mechanisms.
    Direct invocation of the eval function gives the executed code access to the current
    scope, including local variables. This may lead to leaking sensitive data and
    is not advisable. Both indirect invocation of eval and using the function constructor
    only give access to the global scope. If you have to use either of the two unsafe
    functions, make sure you''re using the form that only allows access to the global
    scope. Eval and the function constructor are not the only popular JavaScript functions
    that take code in a parameter and execute it. SetTimeout executes provided code
    with a delay. It has a safe variant where you need to provide a normal JavaScript
    function as a parameter. It also has an unsafe variant that accepts JavaScript
    code passed as a string value. In this way, it is equivalent to calling the eval
    function, but with a delay. SetInterval is very similar. It executes the provided
    code over and over with a delay between invocations. It also has a safe and unsafe
    variant, just like setTimeout. It is advised to always use the safe variants of
    both functions. Chapter 5 Finding Unsafe Code & Exploiting the Vulnerability Let''s
    take a look at the process of turning unsafe functions, such as eval, into attacks
    against web applications. After having found where unsafe functions are used in
    our source code, we need to take a look at what data can be used to deliver the
    code of our choosing to those functions. The first step is to track all input
    data from sources, such as HTML forms, cookies or HTTP requests parameters, to
    unsafe function calls. Such unsafe function calls are often called sinks. In a
    application, untrusted input will rarely be passed directly to the sink unmodified.
    The task of tracking how input data is moved throughout the code is often called
    taint analysis, or taint tracking. We also need to keep track of all the transformation
    supply to the input data along the way. Web technologies and protocols often encode
    data in multiple ways to make them suitable for use in a particular context. Examples
    of such transformations are a URL encoding and escaping special HTML characters.
    Such data transformations are often reversible, and we will need to keep that
    in mind when building malicious payloads. When we have a ready payload to inject
