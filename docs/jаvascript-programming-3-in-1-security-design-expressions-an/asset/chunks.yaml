    Mocha using the npm package manager. ![](image-ffxv3xb4.jpg) Remember to pass
    the saveDev switch to the npn install command to indicate this is a development
    dependency. As with ESLint, the package installation may take a while. The next
    step is to create a new JavaScript file for tests. There are several different
    conventions to organize test code, but we will keep it simple. Let''s create a
    single file called utils.test.js in the lib folder. Let''s import the function
    we want to test, the merge function from utils.js. We will also need to import
    the assert module to implement checks in our unit tests. Mocha test suites are
    defined using the describe function. Individual tests within them are defined
    using the it function. The first parameter of both functions is the name, the
    second parameter is a function with the body of the suite or the test. First,
    we use JSON.parse to create the object that contains the malicious payload. The
    JSON document uses the special proto property to create a new property called
    injected with a value equal to 0. Next, we called the merge function with an empty
    object as the target and the payload as the source. We are almost done. Let''s
    create an entirely new object. Now, let''s check if this new object, unrelated
    to the payload, has the inherited property called injected. If this check passes,
    the function is not vulnerable. If the check fails, it is prone to prototype pollution. ![](image-z93j8u6g.jpg) Let''s
    run the test by passing the path to the utils.test.js file to the Mocha test runner.
    We can see that the test failed, which means the merge function is vulnerable
    to prototype pollution. We were expecting own.injected expression to return value
    undefined, but we got 0 instead. ![](image-9ot7svjb.jpg) This is because the property
    is now inherited from the modified prototype chain. We managed to write a unit
    test that successfully detected prototype pollution. There are plenty of security
    testing tools. Some support JavaScript better than others. Let''s take a quick
    tour of free and popular commercial tools that can be used for JavaScript security
    testing. SAST is a very crowded market. There are both open source tools, as well
    as established commercial vendors. We have already mentioned ESLint. It is very
    popular among JavaScript programmers, and using it to analyze code for simple
    security vulnerabilities and coding antipatterns is an easy way to start. GitHub
    is a very popular development platform for both open source and commercial projects.
    It offers a static analysis scanner as a part of its advanced security offering,
    including support for JavaScript. Similar capabilities are available for free
    for open source projects through the LGTM service, also operated by GitHub. Semgrep
    is an open source, lightweight static analysis tool that can be run locally from
    the command line. It supports several different programming languages, including
    JavaScript. OWASP Zed Attack Proxy, or ZAP for short, is the most popular open
    source DAST scanner. It can be used to perform dynamic analysis of JavaScript
    applications. DAST is also a very crowded market, and there are many alternatives
    to OWASP ZAP. JavaScript has a very rich package ecosystem. Npm is the most popular
    package manager for JavaScript. Managing dependencies is an important measure
    to prevent security vulnerabilities introduced through external libraries. Npm
    audit is a tool built directly into the package manager command line interface.
    It scans project dependencies for vulnerabilities. Retire.js is a vulnerability
    database and scanner for JavaScript. It can be called from the command line, used
    as a browser extension, or as a DAST plugin. is a comprehensive software composition
    analysis tool that helps manage the use of open source components in complex systems.
    It integrates with several vulnerability databases and has good support for JavaScript
    packages from npm. is itself an open source project developed by OWASP. Another
    open source security tool is Snyk. It is a proprietary tool, but it can be used
    for free or open source projects. Let''s take a look at how we can detect a vulnerable
    library in our own code. We will analyze the dependencies of our application.
    The back end uses several open source libraries for Node.js, such as Express,
    and uses npm as the package manager. We will use npm audit to scan the list of
    dependencies of our application to detect a vulnerable Lodash version, and we
    will use npm to update the library to a safe version. Let''s start with examining
    the list of libraries that our application depends on. We can do this using the
    npm list command. You can see that our simple application uses many different
    libraries and versions. It is possible that one or more of those libraries contain
    security vulnerabilities. ![](image-tnk1yp58.png) We can check this using the
    npm audit command. You can see that the version of Lodash we use contains eight
    different security vulnerabilities. ![](image-da3xm98i.jpg) Five of them are prototype
    pollution bugs. We can use npm install to upgrade to the latest version of Lodash. ![](image-qmz48c0x.jpg) Running
    npm audit confirms that we have updated Lodash from 4.17.4 to 14.17.19 and that
    this version has no known security vulnerabilities. In summary, we learned about
    the most popular security testing techniques. SAST, or static application security
    testing, is a technique that focuses on source code analysis. SAST tools look
    for known bad patterns that can introduce security vulnerabilities. DAST, or dynamic
    application security testing, focuses on testing the running application, usually
    over the network. DAST tools send specially prepared payloads to the application
    and analyze responses to look for signs of successful attacks. IAST, or interactive
    application security testing, is a combination of the previous two approaches.
    This technique is very promising, but it is not very popular yet. We demonstrated
    how to use automated SAST and DAST tests to discover vulnerabilities explained
    previously. We demonstrated how to use ESLint to prevent a code injection vulnerability.
    We also saw how to use unit tests to detect prototype pollution in the merge utility
    function. We also learned how to use npm audit to detect vulnerabilities introduced
    through code. BOOK 2 JAVASCRIPT EXPRESSIONS OPERATORS, LOOPS, & SWITCH STATEMENTS RICHIE
    MILLER Introduction The goals for this book are to learn the basics of JavaScript
