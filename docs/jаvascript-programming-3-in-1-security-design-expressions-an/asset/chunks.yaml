    The state changes after you perform some action. What happens then is we check
    the readyState property to see what the status is. If the status isn''t done or
    the status is 200, then we know we''re ready to get the data from the response
    property that we get back. From that, we can then grab any of our properties that
    we''ve created, and we know we''ve created status, statusText, and data. We perform
    a req.open, and we tell it what kind of call we''re making, in this case, a GET,
    and we give it the URL, and then we do the send. Once we do the send, that''s
    when we''re now waiting for the onreadystatechange function to happen, and it
    happens once this state changes. I''m just going to simply create an HTML page
    to call our REST API, and we''ll write the code just like I showed you in that
    last example. I''m going to go to my Samples folder where I created the original
    Bethany''s API, and I''m going to create a new folder called HTMLPage. Inside
    of here, I''m going to create a new file. It doesn''t matter what I call it. I''m
    just going to do it index.html, and I''ll rename that. And now I''m going to open
    this one up in Visual Studio Code. Once I have this, I''m going to drop some code
    in here. This code simply has a document type, an HTML, an HTML header, and a
    body. ![](image-0tj4dnly.jpg) We have then just a little button with an onclick,
    and it''s inside of here that all of magic is going to take place. ![](image-435zw1ia.jpg) So
    if we take a look, I''ve got const URL = http://localhost:5000/api/. Now I''ve
    got a function here starting on line 18, and inside of here, what I''m going to
    do is on line 21, let req = new XMLHttpRequest. On line 22, req.onreadystatechange
    = this function, and inside of this function, any time a state changes, we''re
    going to check to see if the readyState is done and the status is 200. If that''s
    the case, then we know we''ve gotten the data. ![](image-jmjk9gmq.jpg) There could
    be other state changes that happen. We''re just not caring about those with this
    code. Once we have that, we grab the response and we turn that into a real JSON
    object so that we can then go after our property status, statusText, and data.
    We then perform the request.open, tell it we''re going to do a GET, passing in
    the URL, and then we perform the send. And that''s all there is to this page.
    Let''s go ahead and save this and then I''m going to and I''ve installed an extension
    that allows me to open up this file in a default browser. Once I have this browser
    up, I can click on the button, Get All Pies, and I''m going to bring up the F12
    tools, and I''m going to be looking at the console here, because what''s going
    to happen is we''re going to have a problem. ![](image-7tzy2z5p.jpg) We''re trying
    to get at this http://localhost:5000, but we''re over here on the file system.
    So what happens is the CORS policy, okay, so this is a cross origin resource policy,
    is not allowing this resource here to access our resource over there that''s running,
    our REST API. So what we''re going to have to do is install a little bit of a
    new package and tell it to allow this site to come in. If you ever see an error
    like this that you''re being blocked by CORS, CORS is resource sharing, and this
    policy allows you to set up what calls from other domains you''re going to allow.
    You could accept all requests, or you can restrict the calls only from certain
    domains. It''s completely configurable by you. So, but before we can do that,
    we have to add CORS and tell it how we''re going to allow things to come in. Let''s
    do that now in our project. Let''s go down, and let''s add a new terminal window
    here, and let''s type in npm install cors. So this will go out and then bring
    down this package that we can now use. In order to use it, we''re going to add
    some code up here in our index.js, the typical let cors = require (''cors'').
    Then, just below where we do our app.use, we''re going to add some additional
    code here. We''re going to Configure CORS. We''re going to do an app.use(cors). ![](image-4s2pi1r0.jpg) By
    default, if we don''t add any sort of options, what''s going to happen is it allows
    everybody in. So there are some options you can set. You could look this up at
    the expressjs.com. There''s a section just on CORS. So take a look at that. Let''s
    go ahead and save this. If we go back to our other terminal window, we should
    see that it has restarted, and then let''s go and try this out. Flip back over
    to our HTML page. I''m going to go ahead and just press F5 so it refreshes itself.
    We''ll click on the Get All Pies, and we''re getting an internal server error. ![](image-qpnu5iep.jpg) The
    reason we''re getting this, it''s a good thing because it means we did actually
    get to the server, but if this happens to you, you may know why. It''s because
    from the last module, we probably forgot to change our filename back because we
    were testing exception handling. ![](image-irijmheo.jpg) So if that happens to
    you, make sure you go back and save that change. Let''s refresh by pressing F5,
    press on Get All Pies, and we have our pies. ![](image-4viy4pwf.jpg) So now we
    are allowing any domain to come in and call our API. Again, I''ll leave it up
    to you to do some research on what else you can do with CORS. Just calling this
    from a web page and seeing it in the console window isn''t very exciting, so let''s
    create a new website into which we can insert our pie data that we get from our
    REST API. And to do that, I''m going to use the express generator. It would be
    kind of neat for you to see this application generation tool that Express gives
    us. What it does is it creates a basic website skeleton for us, and it allows
    us to choose a templating or a view engine. And we have several to choose from,
    ejs, handlebars, pug, and hogan. I''m going to use handlebars because that''s
    the one I''m most familiar with. If you''re not familiar with templating engines,
    go look it up. They''re really handy to use when you''re doing JavaScript. You
    also have the option to do no view engine if you want. I''ve already installed
    the express generator. So if you haven''t, go ahead and drop down to a command
    window or a PowerShell window and run npm install so it installs it globally,
    then you can create a new website using the generator, which is what I''m going
    to show you now. So in my Samples folder is where I''m going to create this new
    Bethany''s Pies website, so I use express BethanysPiesWebsite so this is the handlebars
    view engine. So I hit Enter. ![](image-yhtpqlaa.jpg) It doesn''t take any time
    at all. Let''s go ahead and change our directory down to where it created this,
    and we''ll load that in code. We can see what it generated. So it generated a
    few folders here. There''s a bin folder. There''s a public folder. There''s a
    routes folder. There''s a views folder. Now I''m not going to go into all the
    specifics on all of this. I wanted to at least show you using this to call into
    our REST API. Now, before we do that, we''ve got to still bring up the terminal.
    We need to do npm install so it installs everything that it needs, and we''re
    also going to go ahead and install the node monitor because that''s always a great
    thing to have as well, and then we''re going to go ahead and open up our package.json
    where this start is. Instead of node, just type in nodemon. ![](image-9og6i0vc.jpg) Locate
    your routes index.js, and instead of the title of Express, type in Bethany''s
    Pie Shop, and then we can go ahead and run this. Let''s go ahead and do an npm
    start, and we''ll go ahead and type in http://localhost, and we''re going to use
    3000 now because that''s the one that the generator starts up on. And there you
    can now see our Shop website has got a good start to it. Before we can make our
    call over to our REST API, we do need to add the request package into the website.
    That''s what helps us call the REST API because that''s where the XML HTTP request
    lives within Node. So, let''s go ahead and add the request package, create an
    API helper module, get data and display it on an HTML page. So in our website,
    let''s open up a new PowerShell window here, and let''s do an npm install on the
    request package, and let''s save that into our website. Now then, let''s create
    a new folder here, so click New Folder. We''ll call it helpers. And in that folder,
    I''m going to create a new file called apiHelper.js. And what I''m going to do
    inside of here is just put a little wrapper function so it makes it easier for
    me to make API calls. ![](image-g3wmdpqe.jpg) ![](image-0ow5va7z.jpg) ![](image-4pim87a1.jpg) So
    if we take a look at this, I''m going to create a request object, so I''m going
    to bring that in. I''m then going to create a closure, let apiHelper =, and then
    I''ve got a callApi function that accepts a URL, and we return a new promise with
    a resolve and reject. And now we use the request object. So instead of writing
    all that code that I did before in plain old JavaScript using the request package,
    I can use this simplified syntax where request, the first parameter, is url, second
    one is an object where I say, yes, I''m looking for json to be returned, and then
    the function is an err, the res, and the body. And as we can see, we either get
    an error or we resolve with the body of data that we get back. We then export
    that so that we can then use it. So where do we use it? Over in the index, routes,
    index.js up at the top, go ahead and add your apiHelper with a require to that
    apiHelper we just created, and see the router.get here on line 6\. ![](image-rvvulczb.jpg) All
    I was doing at this point was rendering the index page and passing in this title.
    I''m going to change this because what I want to do now, if we take a look, is
    within the router.get, I want to make my call to the localhost:5000/api/, and
    I want to get the data. The data gets passed in as the response variable in the
    then method. The title is still Bethany''s Pie Shop, but now I''m adding on an
    additional parameter here called data. This property data is the response.data.
    That''s the data that has our pie data, right? That''s our property. And then,
    of course, there''s a catch as well. So this is the typical promise call. Now
    what we have to do is we have to open up the index.hbs because this is where all
    of the magic happens. ![](image-e88x8nzx.jpg) Now you can see the little curly
    braces, the double curlies. This means if you have a property passed in, then
    it will replace this, so it will do search and replace. So, as you can see, I''ve
    got a title property, so we''re looking for the title property, and whatever''s
    there, we''re going to fill in. I also need to do a little bit of stuff with this
    data. I have the data property, and as we know, that is an array. So what do we
    do inside of here? We do the curly braces with a #data. That basically is like
    a for each or a for loop and says iterate over the data, and each time through,
    grab anything, which the anything, in this case, would be the name of the pie,
    and we''re going to display it within li and close li. Let''s go back to our Shop
    here in and let''s refresh. And if we''ve done everything correctly, we should
    see all of our data appear. If it, for some reason, does not refresh with this
    data, just simply come back here, go back to node, Ctrl+C to cancel out of it,
    and just restart. I''ve had that happen a few times with Express, so just a little
    tip there that sometimes you may have to do that and then come back in and refresh.
    In summary, we learned that CORS allows us to grant or restrict access to our
    API calls. We saw that we can call the XML HTTP request object to get data. The
    express generator helps us create a default website and we can add the request
    package to use the XML HTTP request from that website. In this book, we learned
    about Node.js and Express and how easy they are to get us a REST API up and going,
    and we use javascript to build our REST APIs on the server and call our REST APIs
    on the client. We use a JSON envelope around data returned from our REST APIs
    to keep our interface consistent. Be sure to handle exceptions in your REST API
    calls and be sure to log those exceptions as well. Conclusion Congratulations
    on completing this book! I am sure you have plenty on your belt, but please don’t
    forget to leave an honest review. Furthermore, if you think this information was
    helpful to you, please share anyone who you think would be interested of IT as
    well. About Richie Miller Richie Miller has always loved teaching people Technology.
    He graduated with a degree in radio production with a minor in theatre in order
    to be a better communicator. While teaching at the Miami Radio and Television
    Broadcasting Academy, Richie was able to do voiceover work at a technical training
    company specializing in live online classes in Microsoft, Cisco, and CompTia technologies.
    Over the years, he became one of the top virtual instructors at several training
    companies, while also speaking at many tech and training conferences. Richie specializes
    in Project Management and ITIL these days, while also doing his best to be a good
    husband and father.'
