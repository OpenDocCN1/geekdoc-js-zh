    must make statements a block by wrapping them in braces. ![](image-9hzreh6h.jpg) So
    the case statement can be wrapped within braces, and that would then make it a
    block. So why is that important? Well, let''s take a look, and I''ll show you
    the block-level scope problem and a resolution to that problem. On line 12 I have
    a function called blockScopeProblem. On line 13 I declare a variable, productId,
