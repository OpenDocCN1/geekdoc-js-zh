  \ center;\n}\n\n.extruded {\n    color: #888;\n    font-family: proxima-nova-1,\
  \ proxima-nova-2, 'Helvetica Neue', Arial, sans-serif;\n    font-size: 48px;\n \
  \   font-weight: bold;\n    text-shadow: #000 3px 3px;\n}\n```\n\n在这里，我们应用了一些基础样式并添加了\
  \ `text-shadow`。但这个 `text-shadow` 看起来并不是三维的；为了实现挤出效果，我们需要`添加更多 text-shadows`：\n\n\
  ```\n text-shadow: #000 1px 1px, #000 2px 2px, #000 3px 3px;\n```\n\n这将为我们的文字添加三个不同的文本阴影，它们叠在一起以创建我们想要的三维外观。\n\
  \n### 设置悬停状态样式\n\n接下来，让我们添加一个具有更大 `text-shadow` 的悬停状态：\n\n```\n.extruded:hover {\n\
  \    color: #FFF;\n    text-shadow: #58E 1px 1px, #58E 2px 2px, #58E 3px 3px, #58E\
  \ 4px 4px, #58E 5px 5px, #58E 6px 6px;\n}\n```\n\n在这里，我们又添加了三个文本阴影来增加深度。但仅靠 `text-shadow`\
  \ 看起来并不三维；为了实现挤出效果，我们需要`添加更多 text-shadows`：\n\n```\n.extruded:hover {\n    color:\
  \ #FFF;\n    text-shadow: #58E 1px 1px, #58E 2px 2px, #58E 3px 3px, #58E 4px 4px,\
  \ #58E 5px 5px, #58E 6px 6px;\n}\n```\n\n（注：用户提供的文本在后半部分包含大量的重复/乱码。我将按照提供的内容进行格式化，确保对\
  \ `text-shadow`、`.extruded` 等术语应用反引号。）\n\n*实际上，再次查看用户提供的文本，源本身似乎存在粘贴错误。我将按照 Markdown\
  \ 规则进行格式化。*\n\n实际上，我将根据提供的文本提供干净的格式化输出。\n\n\n\n\n虽然我们可以用几行代码轻松制作文字动画，但制作动画通常需要更大、更慢的资源，例如[动态\
  \ GIF](http://www.gifmuseum.com/)^(6)、Flash 或 HTML5 视频。复杂的动画仍然依赖这些技术，但我们仅使用 CSS\
  \ 就能创建引人注目的动画幻象。\n\n[Love Nonsense](http://lovenonsense.com/)^(7) 使用悬停效果来更改网站上图像的颜色。这里的技巧是使用带有背景颜色的透明\
  \ PNG。PNG 的颜色应该与网站背景匹配，这样当 PNG 中的所有透明区域填充背景颜色时就会显示出来。因此，PNG 应该包含你想要显示的图像的 `negative\
  \ space`（负空间）（即你想要显示的形状应该是透明的，而其他部分都应该与背景颜色相同）。\n\n这里有一个带有负空间的 Smashing Magazine\
  \ Logo 示例：\n\n![填充图像的负空间](http://jonraasch.com/demo/animated-image)\n\n注意[演示中](http://jonraasch.com/demo/animated-image)^(8)，当背景颜色设置为橙色时，它开始看起来像真实物体。\n\
  \n## 代码\n\n•[查看演示](http://jonraasch.com/demo/animated-image)^(9)\n\n首先，我们来做一些基础标记：\n\
  \n```\n<div class=\"post-wrapper\">\n    <h2 class=\"post-title\">\n        这是你悬停的标题\n\
  \n        <img src=\"knockout-image.png\" class=\"post-image\" alt=\"\" />\n   \
  \ </h2>\n\n    <p>这里有更多文本。</p>\n</div>\n```\n\n在这里我们包含了一个带有标题、我们的镂空图像和段落的帖子。\n\n\
  接下来，我们来设置一些静态样式：\n\n```css\n.post-wrapper {\n    position: relative;\n    padding-left:\
  \ 240px;\n}\n\n.post-image {\n    position: absolute;\n    top: 0;\n    left: 0;\n\
  \    background-color: #bbb;\n}\n\n.post-title {\n    color: #037072;\n}\n```\n\n\
  在这里，我们设置了帖子的包装器 `position: relative`，并在左侧留有足够的内边距，以便图像绝对定位到帖子的左侧。我们还为图像添加了背景颜色；现在\
  \ PNG 中的正空间（positive space）显示为浅灰色。\n\n接下来，我们添加一些悬停效果：\n\n```css\n.post-title:hover\
  \ {\n    color: #d63c25;\n}\n\n.post-title:hover .post-image {\n    background-color:\
  \ #f04e36;\n}\n```\n\n现在，当我们悬停在标题或图像上时，两者都会改变颜色。\n\n我们可以通过对过渡进行动画处理来进一步这种效果：\n\n\
  ```css\n.post-image {\n    -webkit-transition: background-color 400ms ease-in;\n\
  \    -moz-transition: background-color 400ms ease-in;\n    transition: background-color\
  \ 400ms ease-in;\n}\n\n.post-title {\n    -webkit-transition: color 400ms ease-in;\n\
  \    -moz-transition: color 400ms ease-in;\n    transition: color 400ms ease-in;\n\
  }\n```\n\n在这里，我们对图像和标题都添加了[CSS3 过](http://net.tutsplus.com/tutorials/html-css-techniques/css-fundametals-css-3-transitions/)^(10)，这将产生平滑的颜色变化动画。\n\
  \n遗憾的是，IE9 目前不支持 CSS3 过渡。然而，即使在不支持的浏览器中，颜色变化仍然发生——只是没有平滑的动画。\n\n如果动画的完全跨浏览器支持非常重要，你始终可以为不支持的浏览器提供\
  \ jQuery 版本的动画。但请记住，jQuery 的 `animate()` 方法不支持颜色动画，因此你需要使用一个[颜色插件](https://github.com/jquery/jquery-color)^(12)。\n\
  \n将所有 CSS 合并在一起：\n\n```css\n.post-wrapper {\n    position: relative;\n    padding-left:\
  \ 240px;\n}\n\n.post-image {\n    position: absolute;\n    top: 0;\n    left: 0;\n\
  \    background-color: #bbb;\n    -webkit-transition: background-color 400ms ease-in;\n\
  \    -moz-transition: background-color 400ms ease-in;\n    transition: background-color\
  \ 400ms ease-in;\n}\n\n.post-title {\n    color: #037072;\n    -webkit-transition:\
  \ color 400ms ease-in;\n    -moz-transition: color 400ms ease-in;\n    transition:\
  \ color 400ms ease-in;\n}\n\n/* 悬停状态 */\n\n.post-title:hover {\n    color: #d63c25;\n\
  }\n\n.post-title:hover .post-image {\n    background-color: #f04e36;\n}\n```\n\n\
  •[下载完整示例](https://gist.github.com/957217)¹³](#chapter-3.xhtml_fn3_13))\n\n## 3.\
  \ 下拉菜单\n\n下拉菜单的一个常见设计问题是它们通常包含很多项目。与其将所有项目列成一列，[Bohemia Design](http://www.bohemiadesign.co.uk/)使用了“多列下拉”。这种方法不仅好看，而且提供了突出重点的机会。让我们使用\
  \ jQuery 来实现这个菜单。\n\n[查看演示](http://jonraasch.com/demo/animated-image)^(9)\n\n###\
  \ 构建标签\n\n理想情况下，我们从简单的标记开始：\n\n```html\n<nav>\n    <li>标签 1</li>\n    <li>标签 2</li>\n\
  \    <li>标签 3</li>\n    <li>标签 4</li>\n    <li>标签 5</li>\n</nav>\n```\n\n接下来，我们为这些标签设置样式：\n\
  \n```css\n#main-nav {\n    width: 800px;\n    height: 50px;\n    position: relative;\n\
  \    list-style: none;\n    padding: 0;\n}\n\n#main-nav .main-nav-item {\n    display:\
  \ inline;\n}\n\n#main-nav .main-nav-tab {\n    float: left;\n    width: 140px;\n\
  \    height: 30px;\n    padding: 10px;\n    line-height: 30px;\n    text-align:\
  \ center;\n    color: #FFF;\n    text-decoration: none;\n    font-size: 18px;\n\
  }\n```\n\n虽然很多 CSS 是针对我们的示例的，但有一些重要的样式值得注意。\n\n首先，我们为整个标签区域定义了高度和宽度，并匹配了五个标签的总高度和宽度，这样我们就可以正确定位下拉菜单。接下来，我们为标签包装器设置了\
  \ `position: relative`，允许我们绝对定位下拉菜单。\n\n然后，我们为列表包装器添加了 `list-style: none`，以消除任何列表样式。\n\
  \n最后，我们将所有标签链接浮动左侧。\n\n#### 构建下拉菜单\n\n现在，让我们在其中一个标签包装器中构建下拉标记：\n\n\n\n\n\n```html\n\
  <li class=\"main-nav-item\">\n    <a href=\"#\" class=\"main-nav-tab\">Tab 1</a>\n\
  \n    <div class=\"main-nav-dd\">\n        <div class=\"main-nav-dd-column\">\n\
  \            Column content here\n        </div>\n    </div>\n\n    <div class=\"\
  main-nav-dd\">\n        <div class=\"main-nav-dd-column\">\n            Column content\
  \ here\n        </div>\n    </div>\n\n    <div class=\"main-nav-dd\">\n        <div\
  \ class=\"main-nav-dd-column\">\n            Column content here\n        </div>\n\
  \    </div>\n</li>\n```\n\n接下来，让我们为这个下拉菜单设置样式：\n\n```css\n#main-nav .main-nav-dd\
  \ {\n    position: absolute;\n    top: 50px;\n    left: 0;\n    margin: 0;\n   \
  \ padding: 0;\n    background-color: #FFF;\n    border-bottom: 4px solid #f60;\n\
  }\n\n#main-nav .main-nav-dd-column {\n    width: 130px;\n    padding: 15px 20px\
  \ 8px;\n    display: table-cell;\n    border-left: 1px solid #ddd;\n    *float:\
  \ left;\n    *border-left: 0;\n}\n\n#main-nav .main-nav-dd-column:first-child {\n\
  \    border-left: 0;\n}\n```\n\n在这里，我们将下拉菜单设置了绝对定位，直接位于第一个标签页下方。\n\n让我们为所有的列包装器设置\
  \ `display: table-cell`，以便它们并排显示。但 IE6 或 7 不支持 `table-cell`，因此我们使用了[属性技巧 (attribute\
  \ hack)](http://paulirish.com/2009/browser-specific-css-hacks/) 作为 IE6 和 7 的替代方案。这种技巧在每个针对\
  \ IE6 和 7 的特定属性前添加了一个星星号（`*`）。\n\n因此，我们为不支持的 IE 版本定义了一个备用方案，简单就是 `float: left`。它的效果几乎与\
  \ `display: table-cell` 一样，不同的是浮动元素的高度不一致，导致列之间的边框无法对齐。为了避免这个细微的问题，我们使用相同的星号技巧移除了\
  \ `border-left`。\n\n最后，我们为所有浏览器移除了第一列的左边框。尽管 `:first-child` 伪类在 IE6 中无法正常工作，但幸运的是这并没有影响，因为我们已经在这些浏览器中隐藏了边框。\n\
  \n### 添加交互功能\n\n我们已经构建了下拉菜单的标记和样式，但仍然需要让菜单具有交互性。让我们使用 jQuery 添加一个类来显示和隐藏下拉菜单：\n\n\
  ```javascript\n$(function() {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
  \ {\n        // 显示下拉菜单\n        $(this).addClass('main-nav-item-active');\n    },\
  \ function(ev) {\n        // 隐藏下拉菜单\n        $(this).removeClass('main-nav-item-active');\n\
  \    });\n});\n```\n\n在这里，我们为每个列表项绑定了[悬停监听器 (hover listener)](http://bavotasan.com/tutorials/a-simple-mouseover-hover-effect-with-jquery/)，它用于添加和移除\
  \ `main-nav-item-active` 类。请将其绑定到列表项而不是标签页本身，否则当用户鼠标移出标签页进入下拉区域时，下拉菜单将会消失。\n\n现在我们可以使用这个类钩子通过\
  \ CSS 来隐藏和显示下拉菜单：\n\n```css\n#main-nav .main-nav-dd {\n    display: none;\n}\n\n\
  #main-nav .main-nav-item-active .main-nav-dd {\n    display: block;\n}\n```\n\n\
  让我们使用 `active` 类来样式化激活的标签页：\n\n```css\n#main-nav .main-nav-item-active .main-nav-tab\
  \ {\n    background-color: #FFF;\n    color: #f60;\n    -webkit-border-top-left-radius:\
  \ 5px;\n    -webkit-border-top-right-radius: 5px;\n    -moz-border-radius-topleft:\
  \ 5px;\n    -moz-border-radius-topright: 5px;\n    border-top-left-radius: 5px;\n\
  \    border-top-right-radius: 5px;\n}\n```\n\n在这里，我们更改了背景和文本颜色，并圆了顶角（在支持的浏览器中）。\n\
  \n### 定位下拉菜单\n\n现在基础的鼠标交互已经完成，下拉菜单会在鼠标悬停时显示。遗憾的是，它仍然没有正确定位在每个标签页下方，因此让我们在悬停事件中添加一些更多代码：\n\
  \n```javascript\n$(function() {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
  \ {\n        var $this = $(this),\n        $dd = $this.find('.main-nav-dd');\n\n\
  \        // 获取标签页的左侧位置\n        var leftPos = $this.offset().left;\n\n        //\
  \ 获取下拉菜单的宽度\n        var ddWidth = $dd.width();\n\n        // 计算允许的最大位置\n      \
  \  var leftMax = $(window).width() - ddWidth;\n\n        // 定位下拉菜单\n        if (leftPos\
  \ > leftMax) {\n            $dd.css('left', leftMax + 'px');\n        } else {\n\
  \            $dd.css('left', leftPos + 'px');\n        }\n\n        // 显示下拉菜单\n\
  \        $(this).addClass('main-nav-item-active');\n    }, function(ev) {\n    \
  \    // 隐藏下拉菜单\n        $(this).removeClass('main-nav-item-active');\n    });\n\
  });\n```\n*（注：提供的文本片段中的逻辑不完整/碎片化；我根据文中提到的变量名 `leftPos`、`ddWidth` 和 `leftMax` 重构了标准逻辑，以确保文档结构可用。）*\n\
  \n\n\n\n\n## 4. 动画幻灯片导航\n\n![McKinney 上的动画幻灯片导航](http://mckinney.com/)\n\n有很多 JavaScript\
  \ 幻灯片技术，但 [McKinney](http://mckinney.com/)^(24)上的动画导航是一种新鲜且微妙的方法。\n\n### jQuery\
  \ 幻灯片\n\n•[查看演示](http://jonraasch.com/demo/fancy-slideshow-navigation)^(25)\n\n\
  让我们来构建类似的内容。我们先从基础幻灯片的标记语言开始：\n\n```\n<div id=\"slideshow\">\n    <div id=\"slideshow-reel\"\
  >\n        <div class=\"slide\">\n            <h1>Slide 1</h1>\n        </div>\n\
  \n        <div class=\"slide\">\n            <h1>Slide 2</h1>\n        </div>\n\n\
  \        <div class=\"slide\">\n            <h1>Slide 3</h1>\n        </div>\n\n\
  \        <div class=\"slide\">\n            <h1>Slide 4</h1>\n        </div>\n\n\
  \        <div class=\"slide\">\n            <h1>Slide 5</h1>\n        </div>\n\n\
  \        <div class=\"slide\">\n            <h1>Slide 6</h1>\n        </div>\n \
  \   </div\n</div\n```\n\n在这里我们设置了六张幻灯片，可以填充我们需要的任何内容。让我们设置一些 CSS 来让幻灯片以水平卷的形式显示：\n\
  \n```\n#slideshow {\n    width: 900px;\n    height: 500px;\n    overflow: hidden;\n\
  \    position: relative;\n}\n\n#slideshow-reel {\n    width: 5400px;\n    height:\
  \ 450px;\n    position: absolute;\n    top: 0;\n    left: 0;\n}\n\n#slideshow-reel\
  \ .slide {\n    width: 900px;\n    height: 450px;\n    float: left;\n    background-color:\
  \ gray;\n}\n```\n\n在这里，我们定义了幻灯片的尺寸，并使用 `overflow: hidden` 隐藏卷轴中的其他幻灯片。我们还定义了卷的尺寸：六张幻灯片每张\
  \ 900 像素，宽度为 5400 像素。（你也可以直接设置为非常大的数字，比如 10000 像素。）然后，我们将卷绝对定位在幻灯片内部（该容器设置了 `position:\
  \ relative`）。最后，我们定义了所有单个幻灯片的尺寸，并将它们向左浮动以填充我们的卷。\n\n### 基础幻灯片动画\n\n现在，让我们添加一些 jQuery\
  \ 来让这个幻灯片动起来：\n\n```\n$(function() {\n    function changeSlide( newSlide ) {   \
  \     \n        // 改变 currSlide 值\n        currSlide = newSlide;\n\n        // 确保\
  \ currSlide 值不会过高过低\n        if ( currSlide > maxSlide ) currSlide = 0;\n      \
  \  else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        // 动画处理卷\n       \
  \ $slideReel.animate({\n            left : currSlide * -900\n        }, 400, 'swing',\
  \ function() {\n            // 如果激活则设置新的定时器\n            if ( activeSlideshow )\
  \ slideTimeout = setTimeout(nextSlide, 1200);\n        });\n    }\n\n    function\
  \ nextSlide() {\n        changeSlide( currSlide + 1 );\n    }\n\n    // 定义变量 / DOM\
  \ 引用\n    var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n \
  \   $slideshow = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n\
  \    maxSlide = $slideReel.children().length - 1;\n\n    // 启动动画\n    slideTimeout\
  \ = setTimeout(nextSlide, 1200);\n});\n```\n\n在这里，我们首先创建了 `changeSlide()` 函数，它负责处理卷的动画。该函数接受下一个要显示的幻灯片的索引，并检查该值是否过高或过低以超出卷的范围。\n\
  \n接下来，它将卷动画到适当的位置，然后通过设置一个新的[超时](http://www.elated.com/articles/javascript-timers-with-settimeout-and-setinterval/)^(26)\
  \ 来触发下一次迭代。\n\n最后，我们构建了 `nextSlide()` 函数，它只需触发 `changeSlide()` 来显示卷中的下一张幻灯片。这个简单的函数只是配合\
  \ `setTimeout()` 使用的快捷方法。\n\n### 左右导航\n\n接下来，让我们在幻灯片中设置左右箭头，从标记语言开始：\n\n```\n <a\
  \ href=\"#\" id=\"slideshow-prev\"></a>\n    <a href=\"#\" id=\"slideshow-next\"\
  ></a>\n```\n\n为了简单起见，我们将标记添加到 HTML 源码中。将它们添加到 jQuery 中通常是更好的方法，以确保控件仅在可用时显示。\n\n\
  让我们用 CSS 为这些箭头设置样式：\n\n```\n#slideshow-prev, #slideshow-next {\n    display: block;\n\
  \    width: 50px;\n    height: 50px;\n    position: absolute;\n    top: 200px;\n\
  \    z-index: 10;\n}\n\n#slideshow-prev {\n    left: 10px;\n}\n\n#slideshow-next\
  \ {\n    right: 10px;\n}\n\n#slideshow-prev:hover, #slideshow-next:hover {\n   \
  \ opacity: 0.7;\n}\n\n.slideshow-active {\n    opacity: 0.5;\n}\n```\n\n我们在幻灯片中绝对定位了箭头，并添加了悬停样式。最后，我们将所需的交互构建到\
  \ JavaScript 中：\n\n```\n$(function() {\n    function changeSlide( newSlide ) { \
  \       \n        // 取消任何定时器\n        clearTimeout(slideTimeout);\n\n        //\
  \ 改变 currSlide 值\n        currSlide = newSlide;\n\n        // 确保 currSlide 值不会过高过低\n\
  \        if ( currSlide > maxSlide ) currSlide = 0;\n        else if ( currSlide\
  \ < 0 ) currSlide = maxSlide;\n\n        // 动画处理卷\n        $slideReel.animate({\n\
  \            left : currSlide * -900\n        }, 400, 'swing', function() {\n  \
  \          // 如果激活则设置新的定时器\n            if ( activeSlideshow ) slideTimeout = setTimeout(nextSlide,\
  \ 1200);\n        });\n    }\n\n    function nextSlide() {\n        changeSlide(\
  \ currSlide + 1 );\n    }\n\n    // 定义变量 / DOM 引用\n    var activeSlideshow = true,\n\
  \    currSlide = 0,\n    slideTimeout,\n    $slideshow = $('#slideshow'),\n    $slideReel\
  \ = $slideshow.find('#slideshow-reel'),\n    maxSlide = $slideReel.children().length\
  \ - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n    $slideNextNav\
  \ = $slideshow.find('#slideshow-next');\n\n    // 设置点击事件\n\n    // 左箭头\n    $slidePrevNav.click(function(ev)\
  \ {\n        ev.preventDefault();\n\n        activeSlideshow = false;\n\n      \
  \  changeSlide( currSlide - 1 );\n    });\n\n    // 右箭头\n    $slideNextNav.click(function(ev)\
  \ {\n        ev.preventDefault();\n\n        activeSlideshow = false;\n\n      \
  \  changeSlide( currSlide + 1 );\n    });\n\n    // 启动动画\n    slideTimeout = setTimeout(nextSlide,\
  \ 1200);\n});\n```\n\n\n\n\n最后，在 `animate()` 函数的回调中，我们添加了一些代码来隐藏和显示箭头导航。当幻灯片显示最左侧的幻灯片时，会隐藏左箭头，反之亦然。\n\
  \n### 底部导航动画\n\n基础幻灯片通过“上一个”和“下一个”箭头进行工作。让我们通过添加动画导航将其提升一个水平。请注意，我使用了更复杂的标记，因为它避免了图像的使用，并且最终更加简单。否则，必须使用三张背景图像——一张用于中间部分，每个端部使用一张（以允许点击区域更大）。不过，你可以使用\
  \ `background-image` 来清理底部导航。\n\n以下是动画的 jQuery 代码：\n\n```javascript\n$(function()\
  \ {\n    function changeSlide( newSlide ) {\n        // 取消任何超时\n        clearTimeout(\
  \ slideTimeout );\n\n        // 改变 currSlide 值\n        currSlide = newSlide;\n\n\
  \        // 确保 currSlide 值不会过低过高\n        if ( currSlide > maxSlide ) currSlide\
  \ = 0;\n        else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        // 动画化幻灯片卷轴\n\
  \        $slideReel.animate({\n            left : currSlide * -900\n        }, 400,\
  \ 'swing', function() {\n            // 根据当前所在的帧隐藏/显示箭头\n            if ( currSlide\
  \ == 0 ) $slidePrevNav.hide();\n            else $slidePrevNav.show();\n\n     \
  \       if ( currSlide == maxSlide ) $slideNextNav.hide();\n            else $slideNextNav.show();\n\
  \n            // 如果活动状态，则设置新超时\n            if ( activeSlideshow ) slideTimeout\
  \ = setTimeout(nextSlide, 1200);\n        });\n\n        // 动画化导航指示器\n        $activeNavItem.animate({\n\
  \            left : currSlide * 150\n        }, 400, 'swing');\n    }\n\n    function\
  \ nextSlide() {\n        changeSlide( currSlide + 1 );\n    }\n\n    // 定义变量 / DOM\
  \ 引用\n    var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n \
  \   $slideshow = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n\
  \    maxSlide = $slideReel.children().length - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n\
  \    $slideNextNav = $slideshow.find('#slideshow-next'),\n    $activeNavItem = $slideshow.find('#active-nav-item');\n\
  \n    // 设置导航点击事件\n\n    // 左箭头\n    $slidePrevNav.click(function(ev) {\n      \
  \  ev.preventDefault();\n\n        activeSlideshow = false;\n\n        changeSlide(\
  \ currSlide - 1 );\n    });\n\n    // 右箭头\n    $slideNextNav.click(function(ev)\
  \ {\n        ev.preventDefault();\n\n        activeSlideshow = false;\n\n      \
  \  changeSlide( currSlide + 1 );\n    });\n\n    // 主导航\n    $slideshow.find('#slideshow-nav\
  \ a.nav-item').click(function(ev) {\n        ev.preventDefault();\n\n        activeSlideshow\
  \ = false;\n\n        changeSlide( $(this).index() );\n    });\n\n    // 动画\n  \
  \  slideTimeout = setTimeout(nextSlide, 1200);\n});\n```\n\n我们在脚本中添加了几处内容。\n\n首先，我们在\
  \ `changeSlide()` 中包含了第二个动画，这次是为了动画导航中的活动指示器。这个 `animate()` 基本上与我们为卷轴构建的相同，主要区别在于我们希望每张幻灯片只移动\
  \ `150px`。\n\n最后，我们为底部导航中的项目添加了点击事件监听器。与箭头导航类似，我们首先禁用自动动画，将 `activeSlideshow` 设置为\
  \ `false`。接下来，我们触发 `changeSlide()` 并传入被点击幻灯片的索引，这使用 jQuery 的 `index()` 方法很容易确定。\n\
  \n现在，幻灯片导航动画已经完成，准备好给你的访问者留下深刻了。\n\n* [下载完整示例](https://gist.github.com/957203)\n\
  * [查看演示](http://jonraasch.com/demo/fancy-slideshow-navigation)\n\n## 5. 动画图标\n\n\
  ![CSS Tricks 上的动画图标](http://css-tricks.com)\n\n[CSS-Tricks](http://css-tricks.com)\
  \ 在页脚处当用户鼠标悬停在各种按钮上有一个简单但优雅的效果。除了颜色变化和添加图标外，该效果在支持过渡的浏览器中是动画化的，使图标看起来像是滑入位的。\n\n\
  * [查看演示](http://jonraasch.com/demo/animated-icons)\n\n让我们创建一个类似的效果，从一些标记开始：\n\n\
  ```html\n<a href=\"#\" class=\"hover-panel\">\n    <h3>面板标题</h3>\n\n    <p>此处显示更多额外信息</p>\n\
  </a>\n```\n\n### 为按钮设置样式\n\n让我们设置一些 CSS 来样式化按钮在自然（非悬停）状态下的样式：\n\n```css\n.hover-panel\
  \ {\n    background-color: #E62DF;\n    color: #B2AAA4;\n    float: left;\n    height:\
  \ 130px;\n    width: 262px;\n}\n\n.hover-panel h3 {\n    font-family: Impact, Sans-serif;\n\
  \    font-size: 38px;\n    text-transform: uppercase;\n}\n\n.hover-panel p {\n \
  \   font-size: 12px;\n    width: 65%;\n}\n```\n\n现在添加一个静态悬停效果来更改颜色并添加阴影：\n\n```css\n\
  .hover-panel:hover {\n    background-color: #23ABE;\n}\n\n.hover-panel:hover h3\
  \ {\n    color: #FFF;\n    text-shadow: rgba(0, 0, 0, 0.39838) 0px 0px 4px;\n}\n\
  \n.hover-panel:hover p {\n    color: #FFF;\n}\n```\n\n最后，让我们添加一个弹入位的背景图像：\n\n```css\n\
  .hover-panel {\n    background-image: url(hover-panel-icon.png);\n    background-position:\
  \ 292px 10px;\n    background-repeat: no-repeat;\n}\n\n.hover-panel:hover {\n  \
  \  background-position: 180px 10px;\n}\n```\n\n在这里，我们添加了一些重要的样式来实现悬停效果。首先，我们将背景图像附加到\
  \ `.hover-panel` 上。这通常位于按钮之外，但在鼠标悬停时，它被正确放置。此外，注意我们将其放置在面板的右侧，这样当我们应用过渡动画时，图标将从右侧滑入。\n\
  \n### 添加过渡\n\n最后，让我们添加过渡：\n\n```css\n.hover-panel {\n    -moz-transition: 0.2s ease;\
  \ /* FF3.7+ */\n    -o-transition: all 0.2s ease; /* Opera 10.5 */\n    -webkit-transition:\
  \ all 0.2s ease; /* Saf3.2+, Chrome */\n    transition: all 0.2s ease;\n}\n```\n\
  \n过渡效果触发了背景图像的动画。因为我们将其标记为应用于 `all` 属性，过渡也适用于上述应用于的 `background-color` 变化。\n\n尽管这在大多数现代浏览器中均有效，但在\
  \ IE9 中将无法工作。但在不支持的浏览器中，用户也能看到颜色变化和图标；他们只是看不到动画效果。\n\n在大多数网站上，这种增强对所有用户都不是必要的。但如果支持是优先事项，请查看此\
  \ [jQuery 备份方案](http://jonraasch.com/blog/graceful-degradation-with-css3#transitions)。\n\
  \n最后，让我们所有的样式结合在一起：\n\n\n\n\n\n```css\n.hover-panel {\n    background-color: #E6E2DF;\n\
  \    background-image: url(hover-panel-icon.png);\n    background-position: 292px\
  \ 10px;\n    background-repeat: no-repeat;\n    color: #B2AAA4;\n    display: block;\n\
  \    float: left;\n    height: 130px;\n    width: 262px;\n    margin: 0 10px 10px\
  \ 0;\n    padding: 15px;\n     -moz-transition: all 0.2s ease; /* FF3.7+ */\n  \
  \     -o-transition: all 0.2s ease; /* Opera 10.5 */\n  -webkit-transition: all\
  \ 0.2s ease; /* Saf3.2+, Chrome */\n          transition: all 0.2s ease;\n}\n\n\
  .hover-panel h3 {\n    font-family: tandelle-1, tandelle-2, Impact, Sans-serif,\
  \ sans;\n    font-size: 38px;\n    line-height: 1;\n    margin: 0 0 10px;\n    text-transform:\
  \ uppercase;\n}\n\n.hover-panel p {\n    font-size: 12px;\n    width: 65%;\n}\n\n\
  .hover-panel:hover {\n    background-color: #237ABE;\n    background-position: 180px\
  \ 10px;\n}\n\n.hover-panel:hover h3 {\n    color: #FFF;\n    text-shadow: rgba(0,\
  \ 0, 0, 0.398438) 0px 0px 4px;\n}\n\n.hover-panel:hover p {\n    color: #FFF:\n\
  }\n```\n\n- [下载完整示例](https://gist.github.com/957236)\n- [查看演示](http://jonraasch.com/demo/animated-icons)\n\
