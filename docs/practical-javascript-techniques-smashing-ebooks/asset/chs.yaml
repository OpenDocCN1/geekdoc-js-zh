  \ HTML”，是指 HTML 在经过所有插件和额外的 JavaScript 传递、消费并被“吐”出来后的样子。如果拥有整洁 HTML 和分离渐进增强层的第一步是不使用\
  \ `style` 属性，那么我必须说第二步是避免编写向你注入 `style` 属性的 JavaScript。\n\nWeb 与团队环境\n\n\n\n\n\n\
  这是一种我们在 `CSS` 和 `JavaScript` 之间建立通信渠道的方法，让我们可以在利用每种语言的优势的同时，不至于过度使用。在前端建立开发平衡是非常重要的，因为环境是如此脆弱的，我们无法像在后端使用服务器那样控制它。如果用户的浏览器既旧又慢，大多数情况下你根本无法坐下来为它升级（顺便提一下：我祖母确实在使用\
  \ `Chrome`）；你所能做的就是拥抱环境的混乱，为最好的情况做准备，并为最坏的情况做计划。\n\n过去曾有人与我争论过，这种在 `JavaScript`\
  \ 中引用 `CSS` 类的开发风格在团队开发环境中并不良好，因为通常在你深入研究 `JavaScript` 的时候，`CSS` 已经构建完成了，这会导致这些类在混杂中丢失，并在代码中产生大量的不一致性（这与\
  \ `DRY` 原则背道而驰）。对于这些人，我想说：隔着隔墙探出头，打开 `AIM`、`GTalk` 或 `Skype`，并告知团队其他成员，这些类专门是为了配合\
  \ `JavaScript` 使用的。我知道开发者在 `GIT` 提交信息之外进行沟通的想法听起来像是疯狂，但没事的，我保证。\n\n### 使用带有 JavaScript\
  \ 回退机制的行为 CSS \n\n将这些 `CSS` 对象作为 `JavaScript` 的钩子，其作用可以远超简单的内容显示和隐藏，进入行为 `CSS`、过渡、动画和变换的领域，而这些通常是通过\
  \ `JavaScript` 动画完成的。考虑到这一点，让我们来看一个点击淡出 `div` 的交互模型，看看如何使用这种开发模型进行设置，同时为可能不支持我们将使用的\
  \ `CSS` 过渡的浏览器提供适当的回退。\n\n对于这个示例，我们将使用：\n\n* [jQuery](http://jquery.com)^(3)\n*\
  \ [Modernizr](http://modernizr.com)^(4)\n\n首先，让我们设置 `body` 元素：\n\n```\n<body>\n\
  \    <button type=\"button\">Run Transition</button>\n    <div id=\"cube\"></div><!--/#cube-->\n\
  </body>\n```\n\n从那里开始，我们需要设置 CSS：\n\n```\n#cube {\n   height: 200px;\n   width:\
  \ 200px;\n   background: orange;\n   -webkit-transition: opacity linear .5s;\n \
  \     -moz-transition: opacity linear .5s;\n        -o-transition: opacity linear\
  \ .5s;\n           transition: opacity linear .5s;\n}\n\n.fade-out {\n   opacity:\
  \ 0;\n}\n```\n\n在添加 `JavaScript` 层之前，让我们花点时间谈谈将要发生的流程：\n\n* 使用 `Modernizr` 检查对 `CSS`\
  \ 过渡的支持\n* 如果是，a) 在按钮上设置点击事件以为 `#cube` 添加“fade-out”类，b) 添加另一个事件监听器来捕获过渡完成的时刻，这样我们就可以控制函数执行时间，从而从\
  \ `DOM` 中移除 `#cube`。\n* 如果否的，a) 在按钮上设置点击事件，使用 `jQuery` 的 `animate()` 方法手动淡出 `#cube`，b)\
  \ 执行回调函数以从 `DOM` 中移除 `#cube`。\n\n这个过程将引入一个名为 `transitionend` 的新事件，它将在 `CSS` 过渡结束时执行。供参考，这很神奇。还有一个名为\
  \ `animationend` 的伴随事件，它将在 `CSS` 动画结束时执行，用于更复杂的交互。\n\n我们需要做的第一件事是在 `JavaScript`\
  \ 中设置变量：\n\n```\n(function () {\n\n   // 设置你的变量\n   var elem = document.getElementById('cube'),\n\
  \       button = document.getElementById('do-it'),\n       transitionTimingFunction\
  \ = 'linear',\n       transitionDuration = 500,\n       transitionend;\n\n   //\
  \ 设置带有适当厂商前缀的 transitionend 事件语法\n   if ($.browser.webkit) {\n       transitionend\
  \ = 'webkitTransitionEnd'; // safari & chrome\n   } else if ($.browser.mozilla)\
  \ {\n       transitionend = 'transitionend'; // firefox\n   } else if ($.browser.opera)\
  \ {\n       transitionend = 'oTransitionEnd'; // opera\n   } else {\n       transitionend\
  \ = 'transitionend'; // 对默认值的最佳猜测？\n   }\n\n   //... 剩余代码写在这里。\n\n})(); // 结束包装函数\n\
  ```\n\n你可能会注意到，我们新的 `transitionend` 事件需要一个厂商前缀；我们正在进行一些浏览器检测来处理这个问题。通常你可能会检测厂商前缀并将其添加到事件名称上，但在本例中，语法的案例略有不同，因此我们需要为每个前缀获取整个事件名称。\n\
  \n在下一步中，我们将使用 `Modernizr` 检测支持情况，并为每种情况添加事件监听器（所有这些内容都添加到包装函数内部）：\n\n```\n// 使用\
  \ Modernizr 检测对 css 过渡的支持\nif(Modernizr.csstransitions) {\n\n    // 点击时添加我们的类\n\
  \    $(button).on('click', function () {\n       $(elem).addClass('fade-out');\n\
  \    });\n\n    // 使用事件监听器模拟回调函数\n    elem.addEventListener(transitionend, function\
  \ () {\n       theCallbackFunction(elem);\n    }, false);\n\n} else {\n\n   // 为不支持的浏览器设置普通的点击/动画监听\n\
  \   $(button).on('click', function () {\n\n       $(elem).animate({\n          \
  \ 'opacity' : '0'\n       }, transitionDuration, transitionTimingFunction, function\
  \ () {\n           theCallbackFunction(elem);\n       });\n\n   }); // 结束点击\n\n\
  } // 结束支持检查\n```\n\n最后，我们需要定义一个在两种操作完成后执行的共享函数（DRY），为了演示之便，我们可以直接调用 `theCallbackFunction()`（尽管它在技术上并不是回调函数）。\n\
  \n```javascript\n// 定义你的回调函数，过渡/动画完成后\nfunction theCallbackFunction (elem) {\n\n\
  \   'use strict';\n\n   // 从 DOM 中移除元素\n   $(elem).remove();\n\n   // 输出过渡完成\n \
  \  console.log('the transition is complete');\n}\n```\n\n在浏览器中，这在 `IE7`（低端）中的工作方式与在移动端\
  \ `Safari` 或 `Chrome for Mobile`（高端）相同。唯一的区别在于底层；用户的体验没有变化。\n\n### 故事的寓意\n\n你可能会问自己，我们为什么要费这些精力。我们写了大约\
  \ 60 行 `JavaScript` 来实现 8 行 `jQuery` 就能完成的设计效果。嗯，没有人说过保持代码整洁和坚持渐进式增强是容易的事。事实上，完全忽略它要容易得多。但作为负责任的开发者，我们的责任是以一种易于访问且易于扩展未来的方式构建应用程序。如果你想更进一步，像我一样创建一个无缝的用户体验，那么花费额外时间来完善项目的每一个细节，以创建一个可以优雅降级和渐进式增强的整体体验，是完全值得的。\n\
  \n\n\n使用这种模型还让我们能够充分利用 `CSS` 的其优势，例如响应式设计以及使用断点在不同的屏幕尺寸上重新定义你的交互。如果你专门针对带宽受限的设备，这非常有帮助，因为正如我们所知道的，`CSS`\
  \ 在下载和执行时间上都比 `JavaScript` 轻量得多。\n\n\n\n\n\n在生产环境中，我们目前使用 `CSS` 动画和过渡效果来实现微交互，例如悬停效果，也许可能是旋转的图形或脉动的绳结。我们已经达到了这样一个阶段：`CSS`\
  \ 是一门非常强大的语言，在浏览器中表现出色，因此更多地使用它来处理通常使用 `JavaScript` 构建的宏观交互也是完全可以的。如果你正在寻找一种轻量、一致且易于维护，同时又能让你使用最新最强浏览器特体验——那么可能是时候开始修复关系，并加强\
  \ `CSS` 与 `JavaScript` 之间的纽带了。正如一位伟人所说：“编写优秀 `JavaScript` 的关键在于知道何时改用 `CSS`。”（是我说的……我这么说的。）\n\
