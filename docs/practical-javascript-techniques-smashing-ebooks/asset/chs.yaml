  \ <a class=\"url fn\" href=\"#\"><?php echo($comment['comment_author']); ?></a>\n\
  \t\t\t\t\t</address>\n\t\t\t\t</footer>\n\n\t\t\t\t<div class=\"entry-content\"\
  >\n\t\t\t\t\t<p><?php echo($comment['comment']); ?></p>\n\t\t\t\t</div>\n\t\t\t\
  </article></li>\n\t\t\t<?php\n\t\t}\n\t?>\n```\n\n由于我们现在可以通过 PHP 访问 `post_ID`，我们应该更新评论表单的\
  \ HTML 使用此值。\n\n```html\n&lt;input type=\"hidden\" name=\"comment_post_ID\" value=\"\
  <?php echo($post_ID); ?>\" id=\"comment_post_ID\" /&gt;\n```\n\n需要注意的元素有：\n\n• `<section\
  \ id=\"content\">` – 博客文章内容\n• `<section id=\"comments\">` – 评论出现的地方。这是我们大部分工作所在地\n\
  \n```php\n\t\t\t<li>&lt;article id=\"comment_<?php echo($comment['id']); ?>\" class=\"\
  hentry\"&gt;\t\n\t\t\t\t<footer class=\"post-info\">\n\t\t\t\t\t&lt;abbr class=\"\
  published\" title=\"<?php echo($comment['date']);\"&gt;\n\t\t\t\t\t\t<?php echo(\
  \ date('d F Y', strtotime($comment['date']) ) ); ?>\n\t\t\t\t\t</abbr>\n\n\t\t\t\
  \t\t<address class=\"vcard author\">\n\t\t\t\t\t\tBy <a class=\"url fn\" href=\"\
  #\"><?php echo($comment['comment_author']); ?></a>\n\t\t\t\t\t</address>\n\t\t\t\
  \t</footer>\n\n\t\t\t\t<div class=\"entry-content\">\n\t\t\t\t\t<p><?php echo($comment['comment']);\
  \ ?></p>\n\t\t\t\t</div>\n\t\t\t</article></li>\n```\n\n你会注意到，如果 `$has_comments`\
  \ 的值为真，则会对有序列表应用一个名为 `has-comments` 的额外 CSS 类。这样我们就可以使用 CSS 在显示评论时隐藏“成为第一个评论”的列表项：\n\
  \n```css\n#posts-list.has-comments li.no-comments {\n\tdisplay: none;\n}\n```\n\n\
  现在一切都就绪，我们拥有了一个功能完整的博客评论系统。如果你想从这个基础功能评论系统开始编写代码，你也可以[下载到此为止的代码](https://github.com/pusher/realtime-commenting/zipball/basic)^(12)。\n\
  \n\n\n\n\n![运行良好的博客评论系统截图](img/functioning_comments.png)\n\n## 使用 jQuery 进行渐进增强\n\
  \n让我们的博客评论系统感觉更像一个应用程序而不仅仅是一个 Web 页面，第一步是在用户提交评论时停止页面重加载。我们可以通过使用 AJAX 请求将评论发送到服务器来实现这一点。由于\
  \ `jQuery` 可能是跨浏览器 JavaScript 功能的默认标准，我们在这里将使用它。尽管我在这里使用了 `jQuery`，但我还想强调的是，[并不总是使用\
  \ jQuery](http://www.leggetter.co.uk/2012/02/19/jquery-uk-2012-event-dont-always-use-jquery.html)^(13)\
  \ 是一个好主意。相反，请分析你的场景并做出审慎的决定，因为在[某些情况下](http://www.leggetter.co.uk/2012/02/12/considerations-when-updating-the-dom-to-display-realtime-data.html)^(14)\
  \ 最好不要使用。\n\n为了尽可能减少从 `index.php` 文件中保留脚本（PHP 和 JavaScript），我们将为 JavaScript 创建一个新文件夹，并在其中创建一个应用程序的\
  \ JavaScript 文件。该文件的路径应为 `js/app.js`。此文件应该在引入 `jQuery` 之后引入。\n\n```\n<script src=\"\
  http://code.jquery.com/jquery-1.7.1.min.js\"></script>\n<script src=\"js/app.js\"\
  ></script>\n```\n\n### 捕捉评论表单提交\n\n当页面准备就绪时，绑定表单的 `submit` 事件。\n\n```javascript\n\
  $(function() {\n\t$('#commentform').submit(handleSubmit);\n});\n```\n\n当表单提交并调用\
  \ `handleSubmit` 函数时，我们将从表单中提取想要发送到服务器的评论数据。从表单获取数据有更优雅的方法，但这种方法清晰地展示了我们从哪里获取值以及我们正在创建的\
  \ `data` 对象。\n\n```javascript\nfunction handleSubmit() {\n\tvar form = $(this);\n\
  \tvar data = {\n\t\t\"comment_author\": form.find('#comment_author').val(),\n\t\t\
  \"email\": form.find('#email').val(),\n\t\t\"comment\": form.find('#comment').val(),\n\
  \t\t\"comment_post_ID\": form.find('#comment_post_ID').val()\n\t};\n\n\tpostComment(data);\n\
  \n\treturn false;\n}\n\nfunction postComment(data) {\n\t// 将数据发送到服务器\n}\n```\n\n\
  ### 使用 AJAX POST 评论\n\n在 `postComment` 函数中，向服务器发送 `POST` 请求，并传递我们从表单获取的数据。当发送请求时，将发送一个额外的\
  \ HTTP 请求头以标识该请求为 AJAX 请求。我们这样做是为了以便如果是 AJAX 请求，我们可以返回 JSON 响应；如果不是，则保持我们的基本功能（更多信息请参阅\
  \ [在服务器上检测 AJAX 事件](http://www.learningjquery.com/2010/03/detecting-ajax-events-on-the-server)^(15)）。我们还定义了两个处理器：`postSuccess`\
  \ 用于处理成功存储，`postError` 用于处理任何失败。\n\n```javascript\nfunction postComment(data) {\n\
  \t$.ajax({\n\t\ttype: 'POST',\n\t\turl: 'post_comment.php',\n\t\tdata: data,\n\t\
  \theaders: {\n\t\t\t'X-Requested-With': 'XMLHttpRequest'\n\t\t},\n\t\tsuccess: postSuccess,\n\
  \t\terror: postError\n\t});\n}\n\nfunction postSuccess(data, textStatus, jqXHR)\
  \ {\n\t// 将评论添加到 UI\n}\n\nfunction postError(jqXHR, textStatus, errorThrown) {\n\
  \t// 显示错误\n}\n```\n\n### 通过评论动态更新用户界面\n\n此时，评论数据正在被发送到服务器并保存，但 AJAX 响应并没有提供任何有意义的响应。此外，评论区域还没有更新以显示新提交的评论，用户必须刷新页面才能看到。让我们从编写更新\
  \ UI 的代码并测试该功能开始。\n\n如果你在想“等一下！我们还没有从 Web 服务器获取显示评论所需的所有数据”，那么你是正确的。然而这并阻止阻止编写更新\
  \ UI 的代码并测试其有效性。方法如下：\n\n```javascript\nfunction postSuccess(data, textStatus, jqXHR)\
  \ {\n\t$('#commentform').get(0).reset();\n\tdisplayComment(data);\n}\n\nfunction\
  \ displayComment(data) {\n\tvar commentHtml = createComment(data);\n\tvar commentEl\
  \ = $(commentHtml);\n\tcommentEl.hide();\n\tvar postsList = $('#posts-list');\n\t\
  postsList.addClass('has-comments');\n\tpostsList.prepend(commentEl);\n\tcommentEl.slideDown();\n\
  }\n\nfunction createComment(data) {\n\tvar html = '' +\n\t'<li><article id=\"' +\
  \ data.id + '\" class=\"hentry\">' +\n\t\t'<footer class=\"post-info\">' +\n\t\t\
  \t'<abbr class=\"published\" title=\"' + data.date + '\">' +\n\t\t\t\tparseDisplayDate(data.date)\
  \ +\n\t\t\t'</abbr>' +\n\t\t\t'<address class=\"vcard\">By <a class=\"url\" href=\"\
  ' + data.url + '\">' + data.comment_author + '</a>' +\n\t\t\t'</address>' +\n\t\t\
  \t'<div class=\"entry-content\">' +\n\t\t\t\t'<p>' + data.comment + '</p>' +\n\t\
  \t\t'</div>' +\n\t\t'</footer>' +\n\t'</article></li>';\n\n\treturn html;\n}\n\n\
  function parseDisplayDate(date) {\n\tdate = Date(date);\n\treturn ['January', 'February',\
  \ 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November',\
  \ 'December'][date.getMonth()] + ' ' +\n\tdate.getDate() + ', ' + date.getFullYear();\n\
  }\n```\n\n上面的代码执行了以下操作：\n\n- 在 `postSuccess` 中我们重置表单并调用 `displayComment`。\n- `displayComment`\
  \ 首先调用 `createComment` 创建列表项的字符串。\n- 然后我们将 HTML 转换为 jQuery 对象并将其隐藏。\n- 将评论插入到评论列表（`<ol>`）中。\n\
  - 列表添加了 `has-comments` 类。\n- 最后，我们调用 `commentEl.slideDown()` 让评论显示。\n\n太棒了！我们现在知道\
  \ `displayComment` 正按照我们的预期工作。功能现在已经实现，但我们想要测试它。这可以通过两种方式实现：\n\n- `displayComment`\
  \ 是一个全局函数，因此可以在控制台中直接调用它。\n- 可以在页面上绑定一个事件来触发模拟更新，即绑定到 *\"u\"* 键。\n\n让我们选择后者并绑定到\
  \ `keyup` 事件。当触发时，我们将创建一个包含评论所需信息模拟 `data` 对象并将其传递给 `displayComment` 函数。该评论将显示在\
  \ UI 中。\n\n```javascript\n$(function() {\n\n\t$(document).keyup(function(e) {\n\t\
  \te = e || window.event;\n\t\tif(e.keyCode === 85){\n\t\t\tdisplayComment({\n\t\t\
  \t\t\"id\": \"comment_1\",\n\t\t\t\t\"comment_post_ID\": 1,\n\t\t\t\t\"date\":\"\
  Tue, 21 Feb 2012 18:33:03 +0000\",\n\t\t\t\t\"comment\": \"The realtime Web rocks!\"\
  ,\n\t\t\t\t\"comment_author\": \"Phil Leggetter\"\n\t\t\t});\n\t\t}\n\t});\n\n});\n\
  ```\n\n点击 *\"u\"* 键查看评论出现。\n\n**上线前记得移除测试函数**，否则用户每次按下 *\"u\"* 都会感到非常困惑。\n\n![一大堆假评论的截图](img/fake_comments1.png)\n\
  \n### 检测并响应 AJAX 请求\n\n最后剩下的就是更新 *post_comment.php* 文件以检测 AJAX 调用并返回新创建的评论信息。\n\n\
  检测 AJAX 请求是通过检查 `X-Requested-With` 请求头完成：\n\n```php\n$ajax = ($_SERVER['HTTP_X_REQUESTED_WITH']\
  \ === 'XMLHttpRequest');\n```\n\n一旦我们知道是 AJAX 请求，我们就可以更新代码以适当的状态码和评论数据进行响应。我们还需要确保原始功能得以维持。\n\
  \n\n\n\n\n```php\n <?php\nrequire('Persistence.php');\n\n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH'\
  \ ] === 'XMLHttpRequest');\n\n$db = new Persistence();\n$added = $db->add_comment($_POST);\n\
  \nif($ajax) {\n\tsendAjaxResponse($added);\n}\nelse {\n\tsendStandardResponse($added);\
  \ \n}\n\nfunction sendAjaxResponse($added) {\n\theader(\"Content-Type: application/x-javascript\"\
  );\n\tif($added) {\n\t\theader( 'Status: 201' );\n\t\techo( json_encode($added)\
  \ );\n\t}\n\telse {\n\t\theader( 'Status: 400' );\n\t}\n}\n\nfunction sendStandardResponse($added)\
  \ {\n\tif($added) {\n\t\theader( 'Location: index.php' );\n\t}\n\telse {\n\t\theader(\
  \ 'Location: index.php?error=Your comment was not posted due to errors in your form\
  \ submission' );\n\t}\n}\n?>\n```\n\n上述代码的关键点在于：\n\n- `$db->add_comment($_POST)`\
  \ 调用返回了所添加评论的数据，并将其赋值给变量 `$added`。\n\n- 通过将响应的 `Content-Type` 设置为“application/json”，我们告诉\
  \ jQuery 将返回的字符串转换为 JavaScript 对象。有关调用 JSON Web 服务的更多信息，请参阅[基于 jQuery 的 JSON API\
  \ 客户端入门指南](http://coding.smashingmagazine.com/2012/02/09/beginners-guide-jquery-based-json-api-clients/)^(16)。\n\
  \n- `201` 状态码表示调用成功，并且表示该调用创建了一个资源（评论）。\n\n博客评论系统现在以一种更加动态的方式运行，无需刷新页面即可立即向用户显示其评论已发布。此外，我们在页面中添加基于\
  \ JavaScript 功能的方法意味着，如果禁用了 JavaScript 或 JavaScript 文件加载失败，系统将回退到我们最初实现的标准功能。\n\n\
  ### 终于实现实时性了！\n\n正如任何“从零开始”的教程一样，让它可能需要一些时间才能到达**真正**有趣的部分，但我们终于到达这里了。然而，**我们所做的一切工作都是值得的**。因为我们是以渐增强的方式构建评论系统的，所以将\
  \ Pusher 接入其中将非常容易。\n\n#### 什么是 Pusher？\n\n在教程开始时，我们说我们将使用 Pusher 为应用程序添加实时功能。但\
  \ Pusher 是什么？\n\nPusher 是一个托管服务，用于快速方便地在 Web 和移动应用中添加实时功能。它提供了一个 RESTful API，可以从任何可以发送\
  \ HTTP 请求的应用程序轻松发布事件，以及一个用于实时双向通信的 WebSocket API。你甚至不需要直接使用 API，因为有多种技术支持[服务器](http://pusher.com/docs/rest_libraries)^(17)（PHP,\
  \ Ruby, node.js, ASP.NET, Python 等）和[客户端](http://pusher.com/docs/client_libraries)^(18)（JavaScript,\
  \ iOS, Android, .NET, ActionScript, Arduino 等）库可用，这意味着你可以在几分钟内为应用添加实时功能——我确信你会惊讶于它是有多么简单！\n\
  \n#### 注册 Pusher 并获取你的 API 凭据\n\n为了在 Web 应用中添加 Pusher 驱动的实时功能，你首先需要[注册一个免费沙盒账户](http://pusher.com/signup)^(19)。注册后，将被带到\
  \ Pusher 面板，在那里你会看到为你创建了一个“Main”应用程序。你还会看到处于该应用程序的“API Access”部分，可以在那里获取你的 API 凭据。\n\
  \n![Pusher 仪表中 API Access 部分的截图](img/pusher_main_api_access.png)\n\n为了方便访问，创建一个\
  \ `pusher_config.php` 文件并在其中 `define` 凭据，以便我们以后引用它们：\n\n```php\n<?php\ndefine('APP_ID',\
  \ 'YOUR_APP_ID');\ndefine('APP_KEY', 'YOUR_APP_KEY');\ndefine('APP_SECRET', 'YOUR_APP_SECRET');\n\
  ?>\n```\n\n在你的 `pusher_config.php` 版本中，请确保将 `‘YOUR_*` 的值替换为你真实的凭据。\n\n你还应该在 `index.php`\
  \ 文件中 `require` 它。我们还应该让 `APP_KEY` 对 JavaScript 运行时可用，因为我们需要它来连接到 Pusher。\n\n```php\n\
  <?php\nrequire('pusher_config.php);\n?>\n\n<script>\nvar APP_KEY = '<?php echo(APP_KEY);\
  \ ?>';\n</script>\n```\n\n#### 实时 JavaScript\n\n在 Web 应用中添加 Pusher 时需要完成的第一件事是包含\
  \ Pusher JavaScript 库并连接到 Pusher。连接你需要使用从 Pusher 面板获取的 `key`。下面你可以看到将前端应用连接到 Pusher\
  \ 所需的所有内容。\n\n在包含 `app.js` 之后包含 Pusher JavaScript 库：\n\n```html\n<script src=\"\
  http://js.pusher.com\"></script>\n<script src=\"app.js\"></script>\n```\n\n在 `app.js`\
  \ 中添加 Pusher 功能：\n\n```javascript\nvar pusher = new Pusher('APP_KEY', {\n  cluster:\
  \ 'YOUR_CLUSTER'\n});\n\nvar channel = pusher.subscribe('my-channel');\nchannel.bind('new-message',\
  \ function(data) {\n  console.log(data);\n});\n```\n\n这看起来可能简单得令人置信，这里是上述代码的功能：\n\
  \n- `var pusher = new Pusher(APP_KEY)` 创建了一个 `Pusher` 对象的实例，并通过此连接到 Pusher。使用了你之前设置的\
  \ `APP_KEY` 值。\n- `var channel = pusher.subscribe('comments-' + commentID);` [Channels](http://pusher.com/docs/channels)^(20)\
  \ 为组织实时数据提供了极佳的方法。在这里我们订阅了 `commentID` 隐藏输入元素的评论。\n- `channel.bind('new-message',\
  \ function(data) { ... });` [Events](http://pusher.com/docs/events)^(21) 用于进一步过滤数据，并非常适用于链接界面的变化。在这种情况下，我们想要绑定到添加新评论时触发的事件并显示它。\n\
  \n#### 使用 Event Creator 发实时事件\n\n我们也可以通过使用应用的 Event Creator 在不编写任何服务器代码的情况下测试此功能。Event\
  \ Creator 允许通过简单的用户界面在通道上发布事件。从上面的代码中可以看到我们想在 `comments-1` 通道上发布名为 `new_comment`\
  \ 的事件。从之前的测试函数中我们也有可以测试数据的示例。\n\n![Pusher 面板中 Event Creator 的截图](img/event_creator.png)\n\
  \n#### 实时 PHP\n\n再次，我们证明了我们的客户端功能不需要编写任何服务端代码。现在让我们添加所需的 PHP 代码，在评论系统中发布时立即触发新评论事件。\n\
  \nPusher 提供了许多[服务端库](http://pusher.com/docs/rest_libraries)^(22)，除了发布事件，还有助于如[私有通道](http://pusher.com/docs/private_channels)^(23)验证以及为[存在通道](http://pusher.com/docs/presence)^(24)提供用户信息的功能。我们只需要在\
  \ `post_comment.php` 文件中使用基本的事件触发功能，因此我们需要下载 [Pusher PHP 库](https://github.com/squeeks/Pusher-PHP)^(25)\
  \ ([直接 zip 文件下载](https://github.com/squeeks/Pusher-PHP/zipball/master)^(26))。\n\n\
  下载此 zip 文件后，将其解压到包含其他文件的目录中。你的文件结构现在看起来像这样：\n\n•index.php\n\n•css (dir)\n\n•images\
  \ (dir)\n\n\n\n\n\n- `post_comment.php`\n- `pusher_config.php`\n- `Persistence.php`\n\
  - `squeeks-Pusher-PHP` (目录) 包含 `lib` (目录) 以及 `Pusher.php`\n\n只需几行代码即可触发事件：\n\n```php\n\
  \ <?php\nrequire('squeeks-Pusher-PHP/lib/Pusher.php');\nrequire('pusher_config.php');\n\
  \n$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n$pusher->trigger('comments-1',\
  \ 'new_comment', array(\n\t\"comment_post_ID\" => 1,\n\t\"date\" => \"Tue, 21 Feb\
  \ 2012 18:33:03 +0000\",\n\t\"comment\" => \"The realtime Web rocks!\",\n\t\"comment_author\"\
  \ => \"Phil Leggetter\"\n));\n?>\n```\n\n然而，在触发事件之前，我们需要应用一些额外的逻辑：\n\n- 检查注释是否已添加。\n\
  - 从 `$added` 数组中提取唯一的注释标识符。\n- 构建文本以识别提交的注释的通道名称。\n- 在带有 `$added` 数据的通道上触发 `new_comment`\
  \ 事件。*注意：库会自动将 `$added` 数组变量转换为 JSON 并通过 Pusher 发送。*\n\n因此，完整的 `post_comment.php`\
  \ 文件看起来如下：\n\n```php\n <?php\nrequire('Persistence.php');\nrequire('squeeks-Pusher-PHP/lib/Pusher.php');\n\
  require('pusher_config.php');\n\n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH' ] ===\
  \ 'XMLHttpRequest');\n\n$db = new Persistence();\n$added = $db->add_comment($_POST);\n\
  \nif($added) {\n\t$channel_name = 'comments-' . $added['comment_post_ID'];\n\t$event_name\
  \ = 'new_comment';\n\n\t$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n\t$pusher->trigger($channel_name,\
  \ $event_name, $added);\n}\n\nif($ajax) {\n\tsendAjaxResponse($added);\n}\nelse\
  \ {\n\tsendStandardResponse($added); \n}\n\nfunction sendAjaxResponse($added) {\n\
  \theader(\"Content-Type: application/json\");\n\tif($added) {\n\t\theader( 'Status:\
  \ 201' );\n\t\techo( json_encode($added) );\n\t}\n\telse {\n\t\theader( 'Status:\
  \ 400' );\n\t}\n}\n\nfunction sendStandardResponse($added) {\n\tif($added) {\n\t\
  \theader( 'Location: index.php' );\n\t}\n\telse {\n\t\theader( 'Location: index.php?error=Your\
  \ comment was not posted due to errors in your form submission' );\n\t}\n}\n?> \n\
  ```\n\n如果你现在在两个不同的浏览器窗口中运行该程序，你会发现一旦在一个窗口中提交注释，该注释就会立即（“魔法般地”）出现在另一个窗口中。**我们现在拥有了一个实时评论系统！**\n\
  \n**但是……**，我们还没有完全完成。你还会看到注释在提交它的用户的窗口中显示了两次。这是因为注释既通过 AJAX 回调添加了，又通过 Pusher 事件添加了。由于这是一个非常常见的情景，特别是如果你像我们这样以渐进增强的方式构建了应用程序，Pusher\
  \ 服务器库提供了一种[排除某个连接/用户](http://pusher.com/docs/publisher_api_guide/publisher_excluding_recipients)^(27)\
  \ 避免通过 Pusher 接收事件的方法。\n\n为了实现这一点，你需要从客户端向服务器发送一个名为 `socket_id` 的唯一连接标识符。该标识符随后可以用来定义谁将被排除。\n\
  \n```javascript\nfunction handleSubmit() {\n\tvar form = $(this);\n\tvar data =\
  \ {\n\t\t\"comment_author\": form.find('#comment_author').val(),\n\t\t\"email\"\
  : form.find('#email').val(),\n\t\t\"comment\": form.find('#comment').val(),\n\t\t\
  \"comment_post_ID\": form.find('#comment_post_ID').val()\n\t};\n\n\tvar socketId\
  \ = getSocketId();\n\tif(socketId !== null) {\n\t\tdata.socket_id = socketId;\n\t\
  }\n\n\tpostComment(data);\n\n\treturn false;\n}\n\nfunction getSocketId() {\n\t\
  if(pusher && pusher.connection.state === 'connected') {\n\t\treturn pusher.connection.socket_id;\n\
  \t}\n\treturn null;\n}\n```\n\n我们所做的更改：\n\n- 添加了一个名为 `getSocketId` 的新函数来获取 `socket_id`。它封装了一个检查，以确保\
  \ `pusher` 变量已设置且客户端已连接到 Pusher。\n- 更新了 `handleSubmit` 以检查是否有可用的 `socket_id`。如果有，此信息将连同注释数据一起发送到服务器。\n\
  \n在服务器端，如果存在 `socket_id` 参数，我们需要使用它并因此排除提交注释的连接和用户，否则传入 `null`：\n\n```php\n $channel_name\
  \ = 'comments-' . $added['comment_post_ID'];\n$event_name = 'new_comment';\n$socket_id\
  \ = (isset($added['socket_id'])) ? $added['socket_id'] : null;\n\n$pusher = new\
  \ Pusher(APP_KEY, APP_SECRET, APP_ID);\n$pusher->trigger($channel_name, $event_name,\
  \ $added);\n```\n\n上面的代码检查了 `console` 和 `log` 函数是否可用（在旧版浏览器中不存在），并将带有时间戳的消息到到 控制台。这对于追踪问题非常有帮助。\n\
  \n### 实时开发\n\n当你开始编写大量的 JavaScript 时，浏览器开发者工具将成为你的朋友。我想分享一些实用的提示。所有主流浏览器厂商现在都提供了包含控制台的开发者工具：\n\
  \n字体 Firefox 的 [Firebug 插件](http://getfirebug.com/)^(30)\n- [Google Chrome 开发者工具](http://code.google.com/chrome/devtools/docs/overview.html)^(31)\n\
  - [Internet Explorer F12 开发者工具](https://msdn.microsoft.com/en-us/library/gg589507(v=VS.85).aspx)^(32)\n\
  - Opera [Dragonfly](http://www.opera.com/dragonfly/documentation/)^(33)\n- [Safari\
  \ 开发者工具](https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools)\n\
  \n### 使用浏览器开发者工具\n\nPusher JavaScript 库提供了一种挂钩日志功能的方法。你只需要将函数赋值给 [`Pusher.log`](http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log)^(35)\
  \ 静态属性。该函数将接收所有的日志消息。你可以在函数内执行任何操作，但最佳实践是将消息记录到开发者控制台。你可以像这样这样做，确保代码在包含 Pusher JavaScript\
  \ 库之后执行：\n\n```javascript\nPusher.log = function(msg) {\n\tif(window.console &&\
  \ window.console.log) {\n\t\twindow.console.log(new Date().getTime() + ': ' + msg);\n\
  \t}\n};\n```\n\n\n\n\n任何良好的实时技术都会在客户端（网页浏览器）与 Web 服务器或服务之间保持持久连接。有时客户端会丢失连接，当客户端未连接到互联网时，实时功能将无法工作。这在依赖移动网络的移动设备应用上经常发生。因此，如果你的应用程序依赖这种连接和功能，那么处理客户端未连接的情况就非常重要。这可以通过向用户显示消息告知他们离线状态来实现，或者你可能希望实现一些替代功能。\n\
  \nPusher JavaScript 库通过 `pusher.connection` 对象暴露了[连接状态](http://pusher.com/docs/connection_states)^(36)，我们之前在获取\
  \ `socket_id` 时简要见过它。绑定状态变化并实现你所需的功能非常简单，因为它遵循与在通道（channels）上绑定事件相同的机制：\n\n```\n\
  var pusher = new Pusher(APP_KEY);\npusher.connection.bind('state_change', function(states)\
  \ {\n\tPusher.log('Connection state changed from: ' + states.previous + ' to ' +\
  \ states.current);\n}); \n```\n\n### 结论\n\n我们看到实时功能出现在许多知名应用程序中：某些应用将其作为核心功能，而另一些则用得比较克制。无论如何使用，最终目标通常是相同的；增强用户体验并保持用户对应用程序的参与。通过将一个基础的博客评论系统转换为更具吸引力的通信平台，我希望我证明了这种功能和体验可以轻松地叠加在现有应用程序上。\n\
  \n这种技术的易获取性是一个较新的事物，我们刚刚触及该技术的潜在用途。实时统计、即时新闻更新、活动流、社交互动、协作和游戏只是常见用途之一，但随着越来越多的开发者意识到并熟悉这项技术，我有信心我们将看到一些真正令人惊叹的创新。“实时物联网？”？\n\
