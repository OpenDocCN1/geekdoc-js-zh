  \n# 使用 HTML、CSS 和 jQuery 创建动态条形图\n\n作者：Derek Mack\n\n全球范围内会议室里的人都喜欢优秀的图表。他们对 PowerPoint、项目符号以及诸如“挂在旗杆上”、“蓝天思维”和“触手可得”等词汇趋于痴迷，而且一切都在“向前发展”。对于那些[促进时代精神范式转移的人](http://startupista.com/corporate-bullshit-generator/)来说，后退不是一个选项。财务预测、季度销售额和市场饱和度的图表是中层管理者的梦想。\n\
  \n![screenshot](img/graph-tut-header.jpg \"使用 HTML、CSS & jQuery 创建动态条形图\")\n\n作为\
  \ Web 设计师，我们如何参与到这些热门的图表制作中呢？实际上，在 Web 上显示图表的方法有很多。我们可以简单地创建一个图像并将其固定在网页上。但那样没有可访问性，也不有趣。我们可以使用\
  \ Flash，它非常适合显示图表——但再次，可访问性不高。此外，设计师、开发者和[神灵](http://www.apple.com/hotnews/thoughts-on-flash/)们正在失去对\
  \ Flash 的喜爱。HTML5 等技术不需要插件就能完成许多相同的功能。HTML 的 `<canvas>` 元素甚至可以适用于此任务。网上有很多图表工具供我们选择。但如果我们想要更定制化的方案呢？\n\
  \n\n\n\n\n• [jQuery](http://jquery.com/)^(7)。练习安全的脚本编写并获取最新版本。保持 jQuery 网站开启，以便你随时查阅文档。\n\
  \n• 可能需要一个图像编辑器，例如[Paint](http://www.microsoft.com/resources/documentation/windows/xp/all/proddocs/en-us/mspaint_overview.mspx?mfr=true)^(8)，用来草拟你的图表可能的样子。\n\
  \n• 一个现代且体面的 Web 浏览器用于预览更改。\n\n这些足够了。请注意，本教程并非为了介绍 HTML、`CSS`、`jQuery` 或僵尸。我们假设你已经对这三项技术以及不死生物有一定的中级了解。\n\
  \n### 标记语言 (The Mark-Up)\n\n你可以通过多种方式创建图表的底层 HTML。在本教程中，我们将从 `table` 开始，因为在没有应用\
  \ `JavaScript` 或 `CSS` 的情况下，它在视觉上最符合逻辑。这在无可访问性方面是一个巨大的加分项。\n\n快！你刚刚收到了一些令人震惊的数字。预计棕色僵尸的人口在未来几年内将失控。碳虎和蓝猴正面临紧迫的威胁。然后，棕色僵尸可能会来找我们。但你只是一个设计师。你能做些什么来帮助呢？\n\
  \n我知道！你可以制作一个网页，用精美、冷静且平滑动画的图形来展示我们迫在眉睫的灭亡！\n\n首先，让我们把这些数据放入一个表中，每一年为列，不同物种为行为行。\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n   <head>\n      <meta charset=\"\
  utf-8\">\n      <meta name=\"viewport\" content=\"width=1024\">\n      <title>Example\
  \ 01: No CSS</title>\n   </head>\n\n   <body>\n      <div id=\"wrapper\">\n    \
  \     <div class=\"chart\">\n            <h3>Population of endangered species from\
  \ 2012 to 2016</h3>\n            <table id=\"data-table\" border=\"1\" cellpadding=\"\
  10\" cellspacing=\"0\"\n            summary=\"The effects of the zombie outbreak\
  \ on the populations\n            of endangered species from 2012 to 2016\">\n \
  \              <caption>Population in thousands</th>\n               <thead>\n \
  \                 <tr>\n                     <td>&nbsp;</td>\n                 \
  \    <th scope=\"col\">2012</th>\n                     <th scope=\"col\">2013</th>\n\
  \                     <th scope=\"col\">2014</th>\n                     <th scope=\"\
  col\">2015</th>\n                     <th scope=\"col\">2016</th>\n            \
  \      </tr>\n               </thead>\n               <tbody>\n                \
  \  <tr>\n                     <th scope=\"row\">Carbon Tiger</th>\n            \
  \         <td>4080</td>\n                     <td>6080</td>\n                  \
  \   <td>6240</td>\n                     <td>3520</td>\n                     <td>2240</td>\n\
  \                  </tr>\n                  <tr>\n                     <th scope=\"\
  row\">Blue Monkey</th>\n                     <td>5680</td>\n                   \
  \  <td>6880</td>\n                     <td>6240</td>\n                     <td>5120</td>\n\
  \                     <td>2640</td>\n                  </tr>\n                 \
  \ <tr>\n                     <th scope=\"row\">Tanned Zombie</th>\n            \
  \         <td>1040</td>\n                     <td>1760</td>\n                  \
  \   <td>2880</td>\n                     <td>4720</td>\n                     <td>7520</td>\n\
  \                  </tr>\n               </tbody>\n            </table>\n      \
  \   </div>\n      </div>\n   </body>\n</html>\n```\n\n查看下方的示例以了解它在没有应用 `CSS` 或 `JavaScript`\
  \ 的原始状态下的外观。此 `table` 的可访问性将使使用屏幕阅读器的人理解数据和背后的信息，即：“快去逃命吧！僵尸来了！”\n\n![screenshot\"\
  )](http://provide.smashingmagazine.com/graph_tut_files/ex_01.html)\n\n简单部分现在已经完成了。现在，让我们利用\
  \ `CSS` 和 `JavasScript`（通过 `jQuery`）的力量来真正说明这些数字告诉了我们什么。从技术上说，我们的目标是创建一个在所有现代浏览器中运行的图表，从\
  \ `IE 8` 开始。\n\n我说过所有现代浏览器了吗？`IE 8` 很幸运：它能和这些酷的孩子待在一起。支持 `CSS3` 的浏览器将获得一些额外的装饰。\n\
  \n### “合合你们的力量……”\n\n如果你想召唤[地球之神](http://en.wikipedia.org/wiki/Captain_Planet)^(9)，你[可以](http://en.wikipedia.org/wiki/Planeteer#Kwame\
  \ \"Earth!\")^(10)[拥有](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\"\
  )^(11)\n\n*(注：输入文本末尾包含了一些重复/损坏的字符串；我已经处理了文档的逻辑结构。)*\n\n**[地球之神]...**\n\n**“合合你们的力量……”**\n\
  \n如果你想召唤[地球之神](http://en.wikipedia.org/wiki/Captain_Planet)^(9)，你[可以](http://en.wikipedia.org/wiki/Planeteer#Kwame\
  \ \"Earth!\")^(10)[拥有](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\"\
  )^(11)\n\n### 获取数据\n\n除了简单显示数据之外，一个良好的柱状图还应该有一个漂亮的大标题、清晰标记的轴和颜色编码的图例。我们需要从表格中提取数据，并以一种在图表中更有意义的方式对其进行格式化。为了这一点，我们将创建一个\
  \ JavaScript 对象，将数据存储在方便的小函数中。让我们诞生我们的 `tableData{}` 对象吧：\n\n\n\n\n\n```\n// 创建表格数据对象\n\
  var tableData = {\n   // 从表格单元格获取数值数据\n   chartData: function() {\n      …\n   },\n\
  \   // 从表格标题获取标题数据\n   chartHeading: function() {\n      …\n   },\n   // 从表格主体获取图例数据\n\
  \   chartLegend: function() {\n      …\n   },\n   // 获取 y 轴比例的最大值\n   chartYMax:\
  \ function() {\n      …\n   },\n   // 从表格单元格获取 y 轴数据\n   yLegend: function() {\n\
  \      …\n   },\n   // 从表头获取 x 轴数据\n   xLegend: function() {\n      …\n   },\n \
  \  // 根据列数将数据分组\n   columnGroups: function() {\n      …\n   }\n}\n```\n\n这里有几个函数，它们在代码注释中进行了解释。它们大多数都非常相似，所以我们不需要逐一介绍。相反，让我们来详细分析其中一个，`columnGroups`：\n\
  \n```javascript\n// 根据列数将数据分组\ncolumnGroups: function() {\n   var columnGroups =\
  \ [];\n   // 从表格主体的第一行获取列数\n   var columns = data.find('tbody tr:eq(0) td').length;\n\
  \   for (var i = 0; i < columns; i++) {\n      columnGroups[i] = [];\n      data.find('tbody\
  \ tr').each(function() {\n         columnGroups[i].push($(this).find('td').eq(i).text());\n\
  \      });\n   }\n   return columnGroups;\n}\n```\n\n以下是它的逻辑拆解：\n\n- 创建 `columnGroups[]`\
  \ 数组来存储数据；\n- 通过统计第一行中的表格单元格 (`td`) 来获取列数；\n- 对于每一列，找到表格主体 (`tbody`) 中的行数，并创建另一个数组来存储该表格单元格数据；\n\
  - 然后遍历每一行，从每个表格单元格中获取数据（通过 jQuery 的 `text()` 函数），然后将其添加到单元格数据数组中。\n\n一旦我们的对象填充了这些丰富的数据，我们就可以开始创建构成图表的元素了。\n\
  \n### 使用数据\n\n使用 jQuery 的 `$.each` 函数，我们现在可以在任何时候循环遍历数据，并创建构成图表的元素。较困难的部分之一是在年度列内部插入代表每个物种的条形图。\n\
  \n以下是代码：\n\n```javascript\n// 遍历列组，在此过程中添加条形\n$.each(columnGroups, function(i) {\n\
  \   // 创建条形组容器\n   var barGroup = $('<div class=\"bar-group\"></div>');\n   // 在每列内部添加条形\n\
  \   for (var j = 0, k = columnGroups[i].length; j < k; j++) {\n      // 创建条形对象存储属性（标签、高度、代码等）并将其添加到数组\n\
  \      // 稍后在 displayGraph() 中设置高度，以便从左到右顺序顺序显示\n      var barObj = {};\n      barObj.label\
  \ = this[j];\n      barObj.height = Math.floor(barObj.label / chartYMax * 100) +\
  \ '%';\n      barObj.bar = $('<div class=\"bar fig' + j + '\"><span>' + barObj.label\
  \ + '</span></div>')\n         .appendTo(barGroup);\n      bars.push(barObj);\n\
  \   }\n   // 将条形组添加到图表\n   barGroup.appendTo(barContainer);\n});\n```\n\n排除标题，我们的表格有五列三行。对于我们的图表来说，这意味着我们创建的每一列在该列中都会出现三个条形。下面的图片显示了我们的图表是如何构建的：\n\
  \n![screenshot](img/graph-tut-image-construction.png \"graph-tut-image-construction\"\
  )\n\n拆解：\n\n- 对于每一列，创建一个容器 `div`；\n- 在每列内部循环以获取行和单元格数据；\n- 创建条形对象 (`barObj{}`) 来存储每个条形的属性，例如其标签、高度和标记；\n\
  - 将标记属性添加到列，应用 CSS 类 `'.fig' + j` 为该列中的每个条形着色，并将标签封装在 `span` 中；\n- 将对象添加到我们的 `bars[]`\
  \ 数组中，以便我们以后访问这些数据；\n- 通过将列添加到容器元素中将一切组合在一起。\n\n如果你注意到了我们没有设置条形的高度，那可以给你加分。这样做是为了让我们以后对条形的显示方式有更多的控制。\n\
  \n现在我们已经有了条形，让我们来给图表添加标签。因为显示标签的代码非常相似，没有必要向你解释全部。以下是我们显示 y 轴的方式：\n\n```javascript\n\
  // 向图表添加 y 轴\nvar yLegend   = tableData.yLegend();\nvar yAxisList   = $('<ul class=\"\
  y-axis\"></ul>');\n$.each(yLegend, function(i) {\n   var listItem = $('<li><span>'\
  \ + this + '</span></li>')\n      .appendTo(yAxisList);\n});\nyAxisList.appendTo(graphContainer);\n\
  ```\n\n其逻辑拆解如下：\n\n- 获取用于标签的相关表格数据，\n- 创建一个无序列表 (`ul`) 来包含我们的列表项；\n- 遍历标签数据，并为每个标签创建一个列表项\
  \ (`li`)，\n- `yAxisList.appendTo(graphContainer)`\n\n\n\n\n\n- 调用 `displayGraph()`\
  \ 为第一个柱状图（索引为 `0`）制作动画。\n\n最后，在 `createGraph()` 的底部调用 `resetGraph()`，在我们沉浸在辛勤工作的荣誉中，见证奇迹发生。\n\
  \n别这么急，小阳光！在继续进行之前，我们需要先穿上衣服。\n\n### CSS\n\n我们需要做的第一件事是隐藏原始数据表格。我们可以通过多种方式实现这一点，但由于我们的\
  \ CSS 加载远早于 JavaScript，所以让我们用最简单的方法来实现：\n\n```css\n#data-table {\n   display: none;\n\
  }\n```\n\n搞定。让我们创建一个精美的容器区域来放置图表。因为使用了几个无序列表来制作图表，我们还需重置这些列表的样式。为 `#figure` 和 `.graph`\
  \ 元素设置 `position: relative` 是重要的，因为这将元素精确地锚定在容器内我们想要的位置。\n\n```css\n/* 容器 */\n\n\
  #wrapper {\n   height: 420px;\n   left: 50%;\n   margin: -210px 0 0 -270px;\n  \
  \ position: absolute;\n   top: 50%;\n   width: 540px;\n}\n\n#figure {\n   height:\
  \ 380px;\n   position: relative;\n}\n\n#figure ul {\n   list-style: none;\n   margin:\
  \ 0;\n   padding: 0;\n}\n\n.graph {\n   height: 283px;\n   position: relative;\n\
  }\n```\n\n现在是图例。我们将图例放置在其容器（`#figure`）的最底部，并将项目水平对齐：\n\n```css\n/* 图例 */\n\n.legend\
  \ {\n   background: #f0f0f0;\n   border-radius: 4px;\n   bottom: 0;\n   position:\
  \ absolute;\n   text-align: left;\n   width: 100%;\n}\n\n.legend li {\n   display:\
  \ block;\n   float: left;\n   height: 20px;\n   margin: 0;\n   padding: 10px 30px;\n\
  \   width: 120px;\n}\n\n.legend span.icon {\n   background-position: 50% 0;\n  \
  \ border-radius: 2px;\n   display: block;\n   float: left;\n   height: 16px;\n \
  \  margin: 2px 10px 0 0;\n   width: 16px;\n}\n```\n\nx 轴与图例非常相似。我们将元素水平对齐，并将它们锚定在其容器（`.graph`）的底部：\n\
  \n```css\n/* x-轴 */\n\n.x-axis {\n   bottom: 0;\n   color: #555;\n   position: absolute;\n\
  \   text-align: center;\n   width: 100%;\n}\n\n.x-axis li {\n   float: left;\n \
  \  margin: 0 15px;\n   padding: 5px 0;\n   width: 76px;\n}\n```\n\ny 轴稍微复杂一些，需要一些技巧。我们给它设置\
  \ `position: absolute` 以脱离正常内容流，但将其锚定在容器上。我们将每个 `li` 扩展到图表的全宽度，并在顶部添加一条边框。这将为我们的背景提供一些漂亮的横线。\n\
  \n利用负外边距的力量，我们可以偏移 `span` 内部的数字标签，使其向上并向左移动。非常漂亮！\n\n```css\n/* y-轴 */\n\n.y-axis\
  \ {\n   color: #555;\n   position: absolute;\n   text-align: right;\n   width: 100%;\n\
  }\n\n.y-axis li {\n   border-top: 1px solid #ccc;\n   display: block;\n   height:\
  \ 62px;\n   width: 100%;\n}\n\n.y-axis li span {\n   display: block;\n   margin:\
  \ -10px 0 0 -60px;\n   padding: 0 10px;\n   width: 40px;\n}\n```\n\n现在是“濒危物种三明治”的核心：柱状图本身。让我们从柱状图和列的容器元素开始：\n\
  \n```css\n/* 图表柱体 */\n\n.bars {\n   height: 253px;\n   position: absolute;\n   width:\
  \ 100%;\n   z-index: 10;\n}\n\n.bar-group {\n   float: left;\n   height: 100%;\n\
  \   margin: 0 15px;\n   position: relative;\n   width: 76px;\n}\n```\n\n这里没有很复杂的东西。我们只是为容器设置了一些尺寸，并设置了\
  \ `z-index` 以确保它出现在 y 轴标记之前。\n\n现在处理每个单独的 `.bar`：\n\n```css\n.bar {\n   border-radius:\
  \ 3px 3px 0 0;\n   bottom: 0;\n   cursor: pointer;\n   height: 0;\n   position:\
  \ absolute;\n   text-align: center;\n   width: 24px;\n}\n\n.bar.fig0 {\n   left:\
  \ 0;\n}\n\n.bar.fig1 {\n   left: 26px;\n}\n\n.bar.fig2 {\n   left: 52px;\n}\n```\n\
  \n这里需要注意的主要样式有：\n- `position: absolute` 和 `bottom: 0`，这意味着柱状图将附在图表的底部并向上生长；\n- 每个物种的柱状图（`.fig0`、`.fig1`\
  \ 和 `.fig2`）将位于 `.bar-group` 内。\n现在，为什么不通过 `border-radius` 属性来减少每个柱状图的左上和右上角的锐角呢？`border-radius`\
  \ 并非必须，但它为支持它的浏览器增加了很好的效果。坦率地说，最流行的浏览器最新版本都支持它。\n\n由于我们在每个柱状图中都放置了值，我们可以在悬停在柱状图时添加一个整洁的弹出窗口：\n\
  \n```css\n.bar span {\n   background:#fefe url(../images/info-bg.gif) 0 100% repeat-x;\n\
  \   border-radius: 3px;\n   left: -8px;\n   display: none;\n   margin: 0;\n   position:\
  \ relative;\n   text-shadow: rgba(255, 255, 255, 0.8) 0 1px 0;\n   width: 40px;\n\
  \   z-index: 20;\n   -webkit-box-shadow: rgba(0, 0, 0.6) 0 1px 4px;\n   box-shadow:\
  \ rgba(0, 0, 0.6) 0 1px 4px;\n}\n\n.bar:hover span {\n   display: block;\n   margin-top:\
  \ -25px;\n}\n```\n\n首先，弹出窗口通过 `display: none` 隐藏。然后当悬停在 `.bar` 元素上，我们设置 `display:\
  \ block` 将其引入视野，并设置负的 `margin-top` 使它出现在每个柱状图上方。`text-shadow`、`rgba` 和 `box-shadow`\
  \ 属性目前大多数现代浏览器支持。在现代浏览器中，只有 Safari 需要前缀 (`-webkit-`) 来让 `box-shadow` 生效。注意，这些属性只是图表的增强，Internet\
  \ Explorer 8 则忽略了它们。\n\n我们将所有内容整合在一起的最后一步是为每个柱状图上色：\n\n```css\n.fig0 {\n   background:\
  \ #747474 url(../images/bar-01-bg.gif) 0 0 repeat-y;\n}\n\n.fig1 {\n   background:\
  \ #65c2e8 url(../images/bar-02-bg.gif) 0 0 repeat-y;\n}\n\n.fig2 {\n   background:\
  \ #eea151 url(../images/bar-03-bg.gif) 0 0 repeat-y;\n}\n```\n\n在这个示例中，我简单地添加了 `background-color`\
  \ 和垂直平铺的 `background-image`。这将更新柱状图以及图例中代表它们的小图标。不错。\n\n而且，难以相信，就这样！\n\n## 完成品\n\
  \n![screenshot](img/graph-tut-image-03.jpg \"示例 3：带 jQuery 的动画柱状图\")http://provide.smashingmagazine.com/graph_tut_files/ex_03.html\n\
  \n我们已经足够提醒公众数量过度数量的危险。然而，更希望你从这个教程中有所收获，并继续推向浏览器功能的边界——特别是在使用正确的 Web 标准且不使用第三方插件的情况下。如果你对如何扩展或改进这里看到的任何内容有想法，请在\
  \ Twitter 上找到我 [@derek_mack](http://twitter.com/derek_mack)。\n\n## 奖励：释放 CSS3 的力量\n\
  \n这个额外部分没有我们的主示例那么详细。它主要作为 CSS3 规范中考虑的一些功能的展示。\n\n由于目前对 CSS3 属性的支持有限，它们的使用也有限。尽管这里提到的某些功能正在进入其他\
  \ Web 浏览器，但基于 Webkit 的如 Apple Safari 和 Google Chrome 正在领先。\n\n我们实际上可以不使用任何图像创建图表，并使用\
  \ CSS 代替 jQuery 来制作柱状图动画。\n\n让我们从移除柱状图的背景图像开始，用 `-webkit-gradient` 属性替换它们：\n\n```css\n\
  .fig0 {\n   background: -webkit-gradient(linear, left top, right top, color-stop(0.0,\
  \ #747474), color-stop(0.49, #676767), color-stop(0.5, #505050), color-stop(1.0,\
  \ #414141));\n}\n\n.fig1 {\n   background: -webkit-gradient(linear, left top, right\
  \ top, color-stop(0.0, #65c2e8), color-stop(0.49, #55b3e1), color-stop(0.5, #3ba6dc),\
  \ color-stop(1.0, #2794d4));\n}\n\n.fig2 {\n   background: -webkit-gradient(linear,\
  \ left top, right top, color-stop(0.0, #eea151), color-stop(0.49, #ea8f44), color-stop(0.5,\
  \ #e67e28), color-stop(1.0, #e06818));\n}\n```\n\n\n\n\n我们可以对这些小小的数字弹出窗执行同样的操作：\n\
  \n```\n.bar span {\n   background: -webkit-gradient(linear, left top, left bottom,\
  \ color-stop(0.0, #fff), color-stop(1.0, #e5e5e5));\n   …\n}\n```\n\n关于 Webkit 渐变色的更多信息，请参阅\
  \ [Surfin' Safari](http://webkit.org/blog/175/introducing-css-gradients/)^(16) 博客。\n\
  \n继续介绍弹出窗，让我们来引入 `-webkit-transition`。CSS 过渡（transitions）非常易使用和理解。当浏览器检测到元素属性（`height`、`width`、`color`、`opacity`\
  \ 等）发生变化时，它将过渡到新属性。\n\n再次，关于 `-webkit-transition` 和 CSS3 动画的更多信息，请参考 [Surfin' Safari](http://webkit.org/blog/138/css-animation/)^(17)。\n\
  \n这是一个示例：\n\n```\n.bar span {\n   background: -webkit-gradient(linear, left top,\
  \ left bottom, color-stop(0.0, #fff), color-stop(1.0, #e5e5e5));\n   display: block;\n\
  \   opacity: 0;\n\n   -webkit-transition: all 0.2s ease-out;\n}\n\n.bar:hover span\
  \ {\n   opacity: 1;\n}\n```\n\n当你悬停在条形上时，弹出窗的边距（margin）和透明度（opacity）会发生变化。这将触发过渡效果。\n\
  \n\n\n像许多开发者一样，我经常在后端和前端开发之间愉快地穿梭，工作在 `PHP` 和 `jQuery` 同样让我感到快乐。这取决于我那天戴的是哪种“帽子”。\n\
  \n由于这一章主要关于基于 jQuery 的 JSON API 客户端，我们将关注客户端代码（即 `jQuery`）。在处理 API 时，有了 `jQuery`\
  \ 的加持，人们更有可能遇到 JSON。\n\n## 玩家 1：JSON\n\n[JSON](http://www.json.org/)^(5)（或 JavaScript\
  \ 对象表示）是一种轻量级、简单且流行的数据交换方式。jQuery 并不是处理和与 JSON 交互的唯一工具；它只是我许多人的首选方法。我们每天使用的许多服务都有基于\
  \ JSON 的 API：Twitter、Facebook 和 Flickr 都以 JSON 格式返回数据。\n\nAPI 的 JSON 响应看起来像这样：\n\
  \n```\n([{\"score\":\nnull,\"popularity\":\n3,\"translated\":true,\"adult\":\nfalse,\"\
  language\":\"en\",\"original_name\":\"The Goonies\",\"name\":\"The Goonies\",\"\
  alternative_name\":\"I Goonies\",\n\"movie_type\":\"movie\",\"id\":9340,\"imdb_id\"\
  :\"tt0089218\",\n\"url\":\"http://www.themoviedb.org/movie/9340\",\n\"votes\":16,\"\
  rating\":9.2,\"certification\":\"PG\",\"overview\":\"一个名叫 Mikey Walsh 的青少年在他父亲的阁阁楼里发现了一张旧宝藏地图。\n\
  为了拯救他们的房屋免遭拆除，Mikey 和他的朋友 Data Wang、Chunk Cohen 和 Mouth Devereaux 出发了一场伟大的冒险，寻找海盗独眼\
  \ Willie 的秘密宝藏。\",\"released\":\"1985-06-07\",\n\"posters\":[{\"image\":{\"type\"\
  :\"poster\",\"size\":\"original\",\"height\":1500,\"width\":1000,\n\"url\":\"http://cf1.imgobject.com/posters/76b/4d406d767b9aa15bb500276b/the-goonies-original.jpg\"\
  ,\n\"id\":\"4d406d767b9aa15bb500276b\"}}],\"backdrops\":[{\"image\":{\"type\":\"\
  backdrop\",\"size\":\"original\",\"height\":1080,\"width\":1920,\n\"url\":\"http://cf1.imgobject.com/backdrops/242/4d690e167b9aa13631001242/the-goonies-original.jpg\"\
  ,\n\"id\":\"4d690e167b9aa13631001242\"}}],\"version\":3174,\"last_modified_at\"\
  :\"2011-09-12 13:19:05\"}])\n```\n\n有点乱，对吧？对比一下在 Google Chrome 开发者控制中查看同一个 JSON：\n\
  \n![\n\nJSON 响应可以通过 jQuery 函数访问，允许我们按照心意对其进行操作、显示，更重要的是对其进行样式化。\n\n## 玩家 2：jQuery\n\
  \n就个人而言，我愿意在每周的任何一天选择 jQuery 而不是 JavaScript。对于那些只想让事情立即运行的初级 Web 开发者来说，jQuery 让事情变得简单得多。我每天都用它。如果我必须用原生\
  \ JavaScript 完成相同的任务，效率将会很低。在我看来，JavaScript 是为了那些想要深入理解 DOM 的人；为了简单易用，本质上，jQuery\
  \ 是一个 JavaScript 库，拥有像 `getJSON` 这样实用的函数。它把我们的 API 粘合在一起。\n\n## 目标：基于 jQuery 的 API\
  \ 客户端\n\n我最近提交了一个[事件](http://10k.anevent.com)^(6)我们要处理的。这个 Web 应用的想法是获取用户输入的电影标题，通过\
  \ [TMDb](http://www.json.org/)^(7) API 返回海报。用户随后可以分享或保存它。\n\nWeb 应用分为 HTML、CSS 和\
  \ jQuery。我们将关注 jQuery，因为魔法就发生在那里。\n\n### HTML\n\n以下是 Web 应用的基本结构。这里没什么特别的。\n\n```\n\
  <!DOCTYPE html>\n<html>\n<head>\n   <meta name=\"author\" content=\"Ben Howdle\"\
  >\n   <meta name=\"description\" content=\"响应式海报抓取器\">\n   <title>Front Row by Howdle</title>\n\
  \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \   <script src=\"https://ajax.jquery.com/jquery-1.6.2.js\"></script>\n   <link\
  \ rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n<div class=\"container\"\
  >\n   <header>\n      <h1>Front Row</h1>\n   </header>\n   <section>\n      <input\
  \ type=\"text\" placeholder=\"Enter movie title\" id=\"term\">\n      <button id=\"\
  search\">Find me</button>\n   </section>\n   <section id=\"poster\"></section>\n\
  \   <footer>\n      <p>Created by <a href=\"http://10k.anevent.com\">Ben Howdle</a></p>\n\
  \   </footer>\n</div>\n</body>\n</html>\n```\n\n### CSS\n\nJSON 响应可以通过 jQuery 函数访问，允许我们按照心意对其进行操作、显示，更重要的是对其进行样式化。\n\
  \n### jQuery\n\n$(document).ready(function(){\n   var full = $(\"#poster\").length\
  \ ? true : false;\n   if(full == false){\n      $('#poster').empty();\n   }\n  \
  \ $('#term').focus(function(){\n      //这是为了移除\n      var film = $('#term').val();\n\
  \      if(film == ''){\n         // 如果输入为空，显示一条消息\n         $('#poster').html(\"\
  <h2>哈！我们忘记验证了！请输入一些内容。</h2>\");\n      } else {\n         // 他们输入了值，继续调用 API，首先显示加载消息以通知用户正在处理\n\
  \         $('#poster').html(\"<h2 class='loading'>你的海报正在路上了！</h2>\");\n        \
  \ $.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f3186/\"\
  \ + film + \"?callback=?\", function(json) {\n               // TMDb 足够友好，在未找到时返回消息，因此我们可以根据此信息进行条件判断\n\
  \               if (json != \"Nothing found.\"){\n                  // 显示海报和宣布结果的消息\n\
  \                     $('#poster').html('<h2 class=\"loading\">哇，天哪！我们为你找到了海报，跳过！</h2>><img\
  \ id=\"thePoster\" src=' + json[0].posters[0].image.url + ' />');\n            \
  \   }\n         });\n      }\n   });\n});\n\n\n\n我们现在进入 API 客户端的核心部分。我们使用 `jQuery`\
  \ 的 [`getJSON`](http://api.jquery.com/jQuery.getJSON/) 函数，根据定义，它的作用是“使用 `GET` HTTP\
  \ 请求从服务器加载 JSON 编码数据”。\n\n接着，我们使用 API 的 URL，在本例中由 [TMDb 提供](http://api.themoviedb.org/2.1/)\
  \ 。与许多其他 API 一样，你必须注册你的应用程序以获取密钥（这个过程仅需 30 秒）。我们将 API 密钥（`23afca60ebf72f8d88cdcae2c4f31866`）插入到\
  \ URL 中，并将用户的电影标题作为搜索参数传递到 URL 中。\n\n需要提到的一点是，在 URL 末尾添加 `callback=?` 可以允许我们进行跨域\
  \ JSON 和 AJAX 调用。千万不要忘记这一点，否则数据将仅限于你自己的域内！这种方法使用了所谓的 JSONP（或带有填充的 JSON），它基本上允许脚本从不同域的另一个服务器获取数据。为了实现这一点，我们必须在\
  \ jQuery 加载数据时指定上述回调函数。它会将 `?` 替换为自定义函数的名称，从而允许我们轻松地进行跨域调用。\n\n在函数的调中，我们放置了单词 `json`（它持有我们获取的数据），但我们也可以使用\
  \ `data` 或 `message`。\n\n下一个检查是查看是否返回了任何数据。TMDb 在找不到任何内容时非常友好地我们提供了一条“Nothing found”（未找到内容）的消息。因此，我们的\
  \ `if` 语句是基于这个字符串的值的。\n\n这种检查是特定于 API 的。通常，如果没有找到结果，我们会扩展对象以寻找名为 `length` 的属性，它会告诉我们返回了多少结果。如果发生这种情况，代码看起来可能像这样：\n\
  \n```javascript\n if (json.length != 0){\n```\n\n顺带提一下，在 JSON 调用的回调函数中编写任何代码之前，我们应该熟悉\
  \ Chrome 控制台或 Firebug 中返回的结果。这会准确地告诉我们在 `if` 语句中需要检查什么，更重要的是，应该通过什么路径来获取我们想要的数据。\n\
  \n让我们像这样添加 `console.log(json);`：\n\n```javascript\n$.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f31866/\"\
  \ + film + \"?callback=?\", function(json) {\n         console.log(json);\n```\n\
  \n这将在你喜爱的浏览器控制台中输出类似以下的内容（点击图片查看全尺寸）：\n\n![\n\n这段代码的最后一行输出了我们的海报。我们向用户显示另一个消息，说明我们找到了结果，然后继续显示图像。\n\
  \n让我们花一点时间研究我们是如何通过 `json[0].posters[0].image.url` 这行代码获取海报图像的。\n\n我们使用 `json[0]`\
  \ 的原因是因为——由于我们只想显示一张海报，而且知道 TMDb 结果的相关性很高——我们可以对第一个结果进行豪赌。然后我们像这样访问 `posters` 数组：`json[0].posters[0]`。Chrome\
  \ 甚至告诉我们 `posters` 是一个数组，所以我们知道自己在处理什么。同样，我们访问数组的第一个值，相信它将是最相关的。然后它告诉我们 `image`\
  \ 是一个对象，所以我们可以这样访问它：`json[0].posters[0].image`。通过进一步扩展对象，我们看到 `image` 包含一个名为 `url`\
  \ 的属性。太棒了！这包含一个直接的图像链接，我们可以将其用于图像元素的 `src` 属性。\n\n```javascript\n} else {\n\n  \
  \ //如果没有找到任何内容，我尝试通过显示《探险队》（The Goonies）的海报来幽默一下，并确认他们的搜索没有结果。\n\n   $.getJSON(\"\
  http://api.themoviedb.org/2.1/Movie.search/en/json/\n23afca60ebf72f8d88cdcae2c4f31866/goonies?callback=?\"\
  , function(json) {\n\n      $('#poster').html('<h2 class=\"loading\">很不起，该搜索没有找到任何结果。也许你是在找《探险队》？</h2><img\
  \ id=\"thePoster\" src=' + json[0].posters[0].image.url + ' />');\n\n   });\n}\n\
  ```\n\n确定 API 为用户没有结果后，我们可以显示一条错误消息。但由于这是一个电影相关的 Web 应用，让我们给用户一个《探险队》的预设海报，并告诉他们我们没有找到任何内容。我们将对图像使用之前使用的完全相同的\
  \ `src` 属性，这次在 API 用的 URL 中硬编码了 `goonies`。\n\n```javascript\n});\n\n          }\n\
  ```\n\n\n\n\n每一个 API 都是独特的，而且每个 API 返回的结果结构也各不相同——这正是乐趣所在！所以，请习惯使用 `console.log()`，并在尝试用代码访问它或在你的应用程序中使用之前，先熟悉返回的结果集。\n\
  \n从一些实用且有趣的内容开始吧：使用 Gowalla 的 API 构建一个签到检查器；使用 Twitter 的 API 可视化趋势；或者使用 Face.com\
  \ 的 API 制作一个人脸识别应用。\n\nAPI 是很有趣的。根据定义，它们带到页面上的数据是动态的，而不是静态的。\n\n\n\n## 更多资源\n\n\
