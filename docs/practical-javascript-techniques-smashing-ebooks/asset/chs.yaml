- "# JavaScript 实用技巧\n\n\n\n\n\n## 关于本书\n\n在数百万网站网站存在并日益普及的今天，JavaScript 是所有程序员、设计师和编码爱好者的必备且实用的工具。《实用的\
  \ JavaScript 技巧》提供了适用于所有水平的专家指导和技巧。学习交互式 CSS、如何利用 JavaScript 的各种功能，甚至如何构建基于 JavaScript\
  \ 的体验。无论你是在完善 Web 设计还是编写插件，这份重要资源都是必不可少的。\n\n\n\n对于任何想要在 Web 上立足的设计师或开发者来说，作品集都是必不可少的。它应该尽可能独特，通过一些\
  \ HTML、CSS 和 JavaScript，你可以创建一个能够向潜在客户展示你的作品集。在本章中，我将向你展示如何创建我的 2D Web 作品集。\n\n\
  ![Daniel Sternlicht 作品集](img/1.png)\n\n*[Daniel Sternlicht 的 2D Web 作品集](http://danielsternlicht.com)。*\n\
  \n在进入正题之前，我们来谈谈作品集。\n\n作品集是 Web 设计师和开发者展示技能的伟大工具。和任何项目一样，花些时间开发作品集并对 Web 设计行业进行一些研究，以便作品集能够呈现出一个时尚、创新且富有灵感的形象。同时请记住，随大流并不是脱颖出的最佳方法。\n\
  \n在深入研究我的 Web 作品集的秘密之前，最后一点：我使用了 `jQuery`，它通过加速开发和保持代码简洁让我的生活变得简单得多。\n\n现在，让我们动手写代码。\n\
  \n### HTML\n\n让我们通过概述一些非常基础 HTML 代码来热身。我知道这有点长，但我们一步步来。\n\n```\n<div id=\"wrapper\"\
  >\n\n    <hgroup id=\"myInfo\">\n        <h1>DANIEL STERNLICHT</h1>\n        <h2>Web\
  \ 设计师，前端开发者</h2>\n    </hgroup>\n\n    <div id=\"startCave\" class=\"cave\"></div>\n\
  \    <div id=\"startCaveHole\" class=\"caveHole\"></div>\n\n    <div id=\"mainRoad\"\
  \ class=\"road\"></div>\n    <div id=\"leftFence\"></div>\n    <div id=\"rightFence\"\
  ></div>\n\n    <div id=\"daniel\"></div>\n\n    <div id=\"aboutRoad\" class=\"road\
  \ side\"></div>\n    <div id=\"aboutHouse\" class=\"house\">\n        <div class=\"\
  door\"></div>\n        <div class=\"lightbox\">...</div>\n    <div id=\"aboutSign\"\
  \ class=\"sign\">\n        <span>关于我</span>\n    </div>\n\n    …\n\n    …\n\n  \
  \  <div id=\"rightTrees\" class=\"trees\"></div>\n    <div id=\"leftGrass\" class=\"\
  grass\"></div>\n\n    <div id=\"endSea\" class=\"sea\"></div>         \n    <div\
  \ id=\"endBridge\" class=\"bridge\"></div>\n\n    <div id=\"boat\" class=\"isMoored\"\
  >\n        <div class=\"meSail\"></div>\n    </div>\n\n</div>\n```\n\nHTML 并不复杂，我本可以为这个游戏使用\
  \ [HTML5 canvas](http://sixrevisions.com/html/canvas-element/) 元素，但我觉得使用简单的 HTML\
  \ DOM 元素更舒服。\n\n基本上，我们有一个主 `#wrapper` div，它包含了游戏元素，其中大部分元素表示为 div 元素（我选择 div 是因为它们很容易操作）。\n\
  \n[快速查看我的游戏](http://danielsternlicht.com)。\n\n![游戏视图](img/2.png)\n\n*游戏视图*\n\n我们有道路、树、栅栏、水、房屋等等。回到\
  \ HTML。\n\n### CSS\n\n首先，请注意我们为每个元素准备的 CSS。例如，我为 `.road` 类定义的 CSS 样式如下：\n\n```css\n\
  .road {\n   position: absolute;\n   background: url(images/road.png) repeat;\n}\n\
  ```\n\n以树作为另一个例子：\n\n```\n.trees {\n   position: absolute;\n   background: url(images/tree.png)\
  \ repeat 0 0;\n}\n```\n\n注意，几乎所有的元素都是绝对定位的。为了我们的目的，相对定位是不可能的，特别是考虑到响应式最小宽度为 640\
  \ 像素。我们可以为 `#wrapper` 编写一个通用规则：\n\n```css\n#wrapper * {\n   position: absolute;\n\
  }\n```\n\n关于 CSS 的最后几句话。游戏中的动画是通过 **CSS 过渡和动画** 完成的，除了某些功能如灯箱效果和玩家传送。这样做有两个原因。\n\
  \n首先，作品集的目的之一是展示创新和现代开发，什么比使用 CSS3 更具创新呢？\n\n第二个原因是性能。在读了 Richard Bradshaw 非常精彩的文章“[CSS3\
  \ 过渡、变换和动画](http://css3.bradshawenterprises.com/)”后，得压倒性的结论：尽可能使用 CSS3。\n\n作品集中\
  \ CSS3 动画的一个很好的例子是水的运动模式。CSS 看起来是这样的：\n\n```css\n.sea {\n   left: 0;\n   width:\
  \ 100%;\n   height: 800px;\n   background: url(images/sea.png) repeat 0 0;\n   -webkit-animation:\
  \ seamove 6s linear infinite;    /* Webkit 支持 */\n   -moz-animation: seamove 6s\
  \ linear infinite;      /* Firefox 支持 */\n   animation: seamove 6s linear infinite;\
  \          /* 未来浏览器支持 */\n}\n```\n\n这里是动画本身的代码：\n\n```css\n/* Webkit 支持 */\n@-webkit-keyframes\
  \ seamove {\n   0% {\n      background-position: 0 0;\n   }\n   100% {\n      background-position:\
  \ 65px 0;\n   }\n}\n\n@-moz-keyframes seamove {…}   /* Firefox 支持 */\n@keyframes\
  \ seamove {…}       /* 未来浏览器支持 */\n```\n\n\n\n\n重复的 `sea.png` 图像宽度为 65 像素，为了给海面带来波浪效果，我们应该移动相同数量的像素。因为背景是重复的，这恰好实现了我们想要的效果。\n\
  \n另一个酷炫的 CSS3 动画示例发生在玩家登上船并驶出屏幕时。\n\n![船只出航](http://media.smashingmagazine.com/wp-content/uploads/2012/04/4.png)\n\
  \n*船驶出屏幕，显示出“联系我们”（Contact）部分。*\n\n如果玩家回到道路，你会发现船正在“反向”移动，回到原始位置。这听起来很复杂，但使用 CSS3\
  \ 过渡（transitions）你会发现极其简单。我做的只是用 JavaScript 捕获事件来判断用户是否“在船上”。如果用户在上面，我们就给船元素添加 `.sail`\
  \ 类，让它驶出；否则，我们不添加该类。同时，我们为 `#contact` 容器添加 `.show` 类，这会平滑地显示出水中的联系表单。船的 CSS 如下所示：\n\
  \n```\n#boat {\n   position: absolute;\n   bottom: 500px;\n   left: 50%;\n   margin-left:\
  \ -210px;\n   width: 420px;\n   height: 194px;\n   background: url(images/boat.png)\
  \ no-repeat center;\n   -webkit-transition: all 5s linear 1.5s;\n   -moz-transition:\
  \ all 5s linear 1.5s;\n   transition: all 5s linear 1.5s;\n}\n```\n\n当我们给它添加 `.sail`\
  \ 类时，我只是改变了它的 `left` 属性。\n\n```\n#boat.sail {\n   left: -20%;\n}\n```\n\n带有 `.show`\
  \ 类的 `#contact` 容器也是一样。在这里，我操作的是 `opacity` 属性：\n\n```\n#contact.show {\n   opacity:\
  \ 1;\n}\n```\n\n剩下的工作由 CSS3 过渡完成。\n\n## JavaScript 部分\n\n由于我们处理的是一个 2-D 游戏，我们可能想基于某个\
  \ JavaScript 游戏引擎，也许是某个现有的框架。但框架的问题在于（除了我用作基础的 jQuery），它们通常有利于快速起步，但从长远来看，它们可能并不完全符合你的需求。\n\
  \n一个很好的例子是我作品集中的灯箱效果（lightboxes），它们提供了关于我的信息，并在用户进入房屋时激活。\n\n![游戏中灯箱的示例](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)\n\
  \n*游戏中的灯箱示例。（[大图](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)^(6))*\n\
  \n这种功能在普通的 JavaScript 游戏引擎中是不存在的。你可以随时用自己的代码改进现有的框架，但研究别人的代码有时比编写自己的代码花费的时间。此外，如果你重写了别人的代码，当新版本发布时可能会变成问题。\n\
  \n在查看了如 [Crafty](http://craftyjs.com/)^(7)、[LimeJS](http://www.limejs.com/)^(8)\
  \ 和 [Impact](http://impactjs.com/)^(9) 这些确实非常棒的游戏引擎框架后，我觉得我别无选择，必须构建自己的引擎来适应我的需求。\n\
  \n让我们快速回顾一下我在游戏中运行的几个方法。\n\n为了处理键盘箭头事件，我使用了以下代码：\n\n```\n$(window).unbind('keydown').bind('keydown',\
  \ function(event) {\n    switch (event.keyCode) {\n        event.preventDefault();\n\
  \        case 37: // 向左                                                        \
  \       \n            me.moveX(me.leftPos - 5, 'left');\n        break;\n\n    \
  \    case 39: // 向右\n            me.moveX(me.leftPos + 5, 'right');\n        break;\n\
  \n        case 38: // 上\n            me.moveY(me.topPos - 5, 'up');\n        break;\n\
  \n        case 40: // 向下\n            me.moveY(me.topPos + 5, 'down');\n       \
  \ break;\n    }\n});\n```\n\n如你所示，代码非常简单。当用户按下向上或向下箭头时，我调用 `moveY()` 函数；当他们按下向右或向左时，我调用\
  \ `moveX()`。\n\n快速查看其中一个方法就能揭示所有的魔力：\n\n```\nmoveX: function(x, dir) {\n    var\
  \ player = this.player;\n    var canMove = this.canImove(x, null);           \n\
  \    if(canMove){\n        this.leftPos = x;\n        player.animate({'left': x\
  \ + 'px'}, 10);\n    }\n    if(dir == 'left') {\n        this.startMoving('left',\
  \ 2);\n    }\n    else {\n        this.startMoving('right', 3);\n    }\n}\n```\n\
  \n\n\n我不幸地通过惨痛教训中学的一项良好实践是`保持代码尽可能的动态`。编写代码时，要确保将来如果你向作品集中添加更多内容，代码能够支持它。\n\n###\
  \ 结论\n\n正如你所看到的，开发一个基于 Web 的 2D 游戏很有趣，而且任务一点也不复杂。但在急于开发自己的游戏作品集之前，请考虑它并不适合所有人。如果你的用户完全不知道\
  \ `HTML5` 是什么，或者不知道为什么 `IE 5.5` 不是“有以来最好的浏览器”，那么你的努力将是白费时间，而且这种作品集可能会疏远他们。这非常糟糕。\n\
  \n尽管如此，我从这个开发过程中中学到了很多，我强烈建议，无论你选择哪种作品集，都花几天时间开发一个你`自己的`、独一无二的作品集。\n\n—\n\n1. [`danielsternlicht.com`](http://danielsternlicht.com)\n\
