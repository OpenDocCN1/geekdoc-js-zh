  \n# 如何构建实时评论系统\n\n作者：Phil Leggetter\n\n多年来，Web 变得越来越具有交互性。这种趋势将随着实时 Web 驱动的下一代应用而继续。在应用程序中添加实时功能可以带来更具交互性、更具吸引力的用户体验。然而，设置和维护服务器端的实时组件可能会成为一种困扰的干扰。但别担心，有一个解决方案。\n\
  \n在过去的几年里，云托管的 Web 服务和 API 救了许多开发者，实时功能也不例外。例如，[Pusher](http://pusher.com)^(1) 的重点在于通过提供托管的\
  \ API，让你专注于构建实时 Web 应用，该 API 可以让你快速轻松地为 Web 和移动应用添加可扩展的实时功能。在教程中，我将展示如何将一个基础的博客评论系统转换为实时的互动式体验，你将看到在一个浏览器窗口中输入的评论“魔法般”地出现在第二个窗口中。\n\
  \n## 我们为什么应该关注实时 Web？\n\n尽管[实时 Web](http://en.wikipedia.org/wiki/Real-time_web)^(2)是一个相对较的主流术语，但实时\
  \ Web 技术已经存在了 10 多年。它们主要被构建针对金融服务领域软件的公司或 Web 聊天应用程序使用。这些最初的解决方案被归类为“临时方案（hacks）”。2006\
  \ 年，这些解决方案得到了名为 [Comet](http://en.wikipedia.org/wiki/Comet_(programming))^(3)的统称，但即使有了定义的名称，这些解决方案仍然被视为临时方案。那么，发生了什么变化？\n\
  \n### 社交媒体数据\n\n社交媒体，特别是 Twitter，意味着更多数据的可用。早期的向浏览器推送数据的解决方案被认为是“临时方案”。但这并没有消除对以标准方式实现此操作的需求。\n\
  \n### 用户期望的增长\n\n随着用户对 Web 应用的期望提高，实时技术走向了前沿。这对于具有高度互动性的 Facebook 来说尤其如此。\n\n##\
  \ WebSockets\n\n![HTML5 和 WebSockets](img/HTML5_Logo_256.png \"HTML5 Logo\")\n\n\
  之前我提到过之前的解决方案都是“临时方案”。但我们的请求得到了 [Sockets](http://pusher.com/websocket)^(5)的解答。WebSocket\
  \ 代表了一种[标准 API](http://www.w3.org/TR/websockets/)^(6)和[协议](http://tools.ietf.org/html/rfc6455)^(7)，允许服务器和客户端（浏览器浏览器）通过单个连接进行双向通信。旧解决方案通过两个连接来实现双向通信，因此\
  \ WebSocket 使用单个连接这一事实实际上是件大事。这对服务器和客户端来说都是巨大的资源节省，后者对于电量极其宝贵的移动设备尤为重要。\n\n## 实时技术是如何使用的？\n\
  \n实时 Web 技术使得构建各种互动式功能成为可能，从而提升了用户体验。以下是一些常见的用例：\n\n- **实时统计**：该技术最初用于金融领域显示股票交易所信息，因此现在比以往任何时候都更频繁并不意外。它对体育、博彩和分析非常有益。\n\
  - **通知**：当用户感兴趣的内容可用或发生变化时。\n- **活动流**：朋友或项目的活动流。这在 Twitter、Facebook、Trello、Quora\
  \ 等许多应用中很常见。\n- **聊天**：实时 Web 技术的入门（101），但仍然非常有价值的功能。它有助于朋友、同事、客户与客户服务之间的即时互动。\n\
  - **协作**：Google Docs 在其文档、表格和绘图应用中提供了这种功能，我们将在更多应用中看到类似的用例。\n- **多人游戏**：能够即时传递玩家移动、游戏状态变化和得分更新，这对于多人游戏显然至关重要。\n\
  \n\n\n\n\n在本教程的剩余部分中，我将介绍如何构建一个基础博客评论系统、如何使用 `jQuery` 对其进行渐进增强，最后我还将使用我工作的实时 Web\
  \ 服务 `Pusher` 进行再次渐进增强。这不仅演示了使用实时 Web 技术是多么简单，还展示了实时因素可以带来的价值和用户参与度的提升。\n\n### 创建通用博客评论系统\n\
  \n### 从模板开始\n\n我想重点关注为博客文章添加实时评论功能，因此**让我们从一个[模板](https://github.com/pusher/realtime-commenting/zipball/start)^(8)开始**。\n\
  \n该模板复用了在[从零开始编写 HTML5 布局](http://coding.smashingmagazine.com/2009/08/04/designing-a-html-5-layout-from-scratch/)^(9)\
  \ 文章中定义的 `HTML5` 布局，我们将开始使用的的文件结构如下（包含一些我们目前不需要担心的额外内容）：\n\n• `css`（目录）（包括 `global-forms.css`、`main.css`、`reset.css`）\n\
  • `images`（目录）\n• `index.php`\n\n### HTML\n\n位于 `index.php` 中的模板 HTML 已经根据《HTML5\
  \ 布局》文章进行了修改，将内容专注于为带有评论的博客文章。你可以[在此处]查看 HTML 源码](https://github.com/pusher/realtime-commenting/blob/start/index.php)^(10)\n\
  \n需要注意的主要元素有：\n\n• `<section id=\"content\">` – 博客文章内容\n• `<section id=\"comments\"\
  >` – 评论出现的地方。这是我们大部分工作所在地\n\n### 评论\n\n现在我们已经准备好了博客文章和显示评论的 HTML，我们还需要让读者能够提交评论的方法，因此让我们添加一个\
  \ `<form>` 元素来收集并将评论详情提交到 `post_comment.php`。我们将此添加到 `<section id=\"comments\">`\
  \ 部分的末尾，并包裹在 `<div id=\"respond\">` 中。\n\n```\n<div id=\"respond\">\n\n\t<h3>Leave\
  \ a Comment</h3>\n\n\t<form action=\"post_comment.php\" method=\"post\" id=\"commentform\"\
  >\n\n\t\t<label for=\"comment_author\" class=\"required\">Your name</label>\n\t\t\
  <input type=\"text\" name=\"comment_author\" id=\"comment_author\" value=\"\" tabindex=\"\
  1\" required=\"required\">\n\n\t\t<label for=\"email\" class=\"required\">Your email;</label>\n\
  \t\t<input type=\"email\" name=\"email\" id=\"email\" value=\"\" tabindex=\"2\"\
  \ required=\"required\">\n\n\t\t<label for=\"comment\" class=\"required\">Your message</label>\n\
  \t\t<textarea name=\"comment\" id=\"comment\" rows=\"10\" tabindex=\"4\"\t required=\"\
  required\"></textarea>\n\n\t\t<!---- comment_post_ID value hard-coded as 1 -->\n\
  \t\t<input type=\"hidden\" name=\"comment_post_ID\" value=\"1\" id=\"comment_post_ID\"\
  \ />\n\t\t<input name=\"submit\" type=\"submit\" value=\"Submit comment\" />\n\n\
  \t</form>\n\n</div\n```\n\n### 评论表单 CSS\n\n让我们在 `main.css` 中添加以下内容，应用一些 CSS 让界面看起来更好看：\n\
  \n```\n#respond {\n\tmargin-top: 40px;\n}\n\n#respond input[type='text'],\n#respond\
  \ input[type='email'], \n#respond textarea {\n\tmargin-bottom: 10px;\n\tdisplay:\
  \ block;\n\twidth: 100%;\n\n\tborder: 1px solid rgba(0, 0, 0, 0.1);\n\t-webkit-border-radius:\
  \ 5px;\n\t-moz-border-radius: 5px;\n\t-o-border-radius: 5px;\n\t-ms-border-radius:\
  \ 5px;\n\t-khtml-border-radius: 5px;\n\tborder-radius: 5px;\n\n\tline-height: 1.4em;\n\
  }\n```\n\n一旦 HTML 结构、评论表单和 CSS 都就绪，我们的博客系统就开始看起来更像体面了。\n\n![博客文章和评论系统的截图](img/blog_and_comments.png)\n\
  \n### 处理评论提交\n\n下一步是编写 PHP 表单提交处理器，用于接收请求并存储评论，即 `post_comment.php`。你应该在应用程序的根目录下创建此文件。\n\
  \n正如我之前提到的，我非常想关注实时功能，因此在你下载的模板中存在一个类，它封装了一些标准的数据检查和持久化功能。该类定义在 `Persistence.php`\
  \ 中（你可以[在此处]查看源码](https://github.com/pusher/realtime-commenting/blob/start/Persistence.php)^(11)），它并不是生产级质量，并且处理：\n\
  \n• 基础验证\n• 基础数据清洗\n• 使用用户 `$_SESSION` 进行非常简单的持久化。这意味着一个用户保存的评论对另一个用户不可用。\n\n这意味着我们不需要花时间设置数据库等所有内容……（注：原文此处存在大量重复的句子\
  \ \"This also means that we don't need to spend time setting up a database and all\
  \ that goes into\"，已按语意处理）\n\n### 使用 PHP 显示评论\n\n为了让我们的通用评论系统运行起来，我们需要做的最后一件事是更新\
  \ `index.php` 以获取并显示评论。这意味着我们同样需要更新 `index.php` 来获取并显示评论。该类定义在 `Persistence.php`\
  \ 中以获取并显示评论……（注：原文此处同样存在大量重复句子）。该类定义在 `Persistence.php` 中以获取并显示评论。\n\n```php\nforeach\
