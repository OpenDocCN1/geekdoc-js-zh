    # 构建 CSS 与 JavaScript 之间的关系


    作者 Tim Wright


    jQuery, Prototype, Node.js, Backbone.js, Mustache 以及成千上万个 JavaScript 微库共同汇成了一个不可否认的事实：**JavaScript
    非常流行**。事实上，它是如此流行，以至于我们经常发现某些地方使用它，而从长远来看，其他解决方案可能更好。


    尽管我们将 JavaScript、CSS 和 HTML 保持在不同的文件中，但渐进增强（progressive enhancement）背后的概念随着我们使用的每一个
    jQuery 插件以及出现的每一个奇技而变得混乱在一起。因为 JavaScript 是如此强大，JavaScript 与 HTML（构建文档结构）以及 JavaScript
    与 CSS（注入样式信息）之间在能力上有许多重叠。我来这里不是为了挑剔任何 JavaScript 库、引导程序或模板代码；我只是想提供一个小视角，让我们了解当前的现状，以及我们如何重新对齐目标。


    ![关系图](img/CSS-JavaScript-500.jpg)


