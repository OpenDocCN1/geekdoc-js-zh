- fmt: "\n# “I Think You Took It A Bit Too Far”\n\nThis might be overkill for some\
    \ cases. But it will definitely come in handy when you want to store a lot of\
    \ boolean values in any limited space that can only store strings. And no optimization\
    \ is overkill for things that go through the wire frequently. For example, cookies\
    \ are sent on every single request, so they should be as tiny as possible. Another\
    \ use case would be online multiplayer games, for which response times should\
    \ be lightning-fast, otherwise the games wouldn't be fun.\n\nAnd even if this\
    \ kind of optimization isn't your thing, I hope you've found the thought process\
    \ and the code involved educational.\n\n---\n\n1. [http://twitter.com/#!/codepo8](http://twitter.com/#!/codepo8)\n\
    2. [http://icant.co.uk/talks/koc2011/](http://icant.co.uk/talks/koc2011/)\n3.\
    \ [http://jsperf.com/json-vs-split-join-for-simple-arrays](http://jsperf.com/json-vs-split-join-for-simple-arrays)\n\
    4. [http://es5.github.com/#x4.3.16](http://es5.github.com/#x4.3.16)\n5. [http://en.wikipedia.org/wiki/Bit_field](http://en.wikipedia.org/wiki/Bit_field)\n\
    6. [http://en.wikipedia.org/wiki/Base_36](http://en.wikipedia.org/wiki/Base_36)\n\
    7. [http://stackoverflow.com/questions/7033639/javascript-split-large-string-in-n-size-chunks](http://stackoverflow.com/questions/7033639/javascript-split-large-string-in-n-size-chunks)\n\
    \n# Building A Relationship Between CSS & JavaScript\n\nBy Tim Wright\n\njQuery,\
    \ Prototype, Node.js, Backbone.js, Mustache and thousands of JavaScript microlibraries\
    \ all combine into a single undeniable fact: **JavaScript is popular**. It's so\
    \ popular, in fact, that we often find ourselves using it in places where another\
    \ solution might be better in the long run.\n\nEven though we keep JavaScript,\
    \ CSS and HTML in different files, the concepts behind progressive enhancement\
    \ are getting all knotted up with every jQuery plugin we use and with every weird\
    \ technique that crops up. Because JavaScript is so powerful, there are a lot\
    \ of overlaps in capability between JavaScript and HTML (building document structure)\
    \ and JavaScript and CSS (injecting style information). I'm not here to pick on\
    \ any JavaScript library, bootstrap or boilerplate; I'm just here to offer a little\
    \ perspective as to where we are and how we can realign our goals.\n\n![Relationship\
    \ Image](images/CSS-JavaScript-500.jpg)\n\n*Image Credit: [opensourceway](http://www.flickr.com/photos/opensourceway/5755219051/)^([1](#chapter-9.xhtml_fn9_1)).*\
    \ Keeping CSS Out Of Your JavaScript\n\nCSS can hook into HTML with a variety\
    \ of different selectors; this isn't anything new. By using IDs, classes or any\
    \ attribute you can think of (even custom attributes), you have easy access to\
    \ style an element. You can also do this with a slew of JavaScript methods, and\
    \ honestly, it's the same basic process with a different syntax (one of my JavaScript\
    \ ah-ha moments). Being able to natively access HTML from JavaScript and from\
    \ CSS is one of the reasons progressive enhancement has been such a successful\
    \ development model. It allows a point of reference to guide us and to serve as\
    \ a reminder as we develop a project, so we don't “[cross the streams](http://www.youtube.com/watch?v=jyaLZHiJJnE)^([2](#chapter-9.xhtml_fn9_2)).\n\
    \nBut, as you move forward with JavaScript and build applications with highly\
    \ interactive elements, it gets harder to not only keep HTML out of your JavaScript,\
    \ but also to catch yourself before injecting style information into a document.\
    \ Of course, the case for not injecting style with JavaScript certainly isn't\
    \ a binary one (yes/no, true/false, 0/1); there are plenty of cases where you\
    \ might need to apply styles progressively, for example, in a drag and drop interface\
    \ where positioning information needs to be constantly updated based on cursor\
    \ (or finger) position.\n\nBut generally speaking, **you can safely house all\
    \ the style information you need within CSS** and reference styles as reusable\
    \ classes. This is a much more flexible model than sprinkling CSS throughout a\
    \ JavaScript file, and it very closely compares to the model of adding style information\
    \ into your HTML. We follow this model when it's only HTML and CSS, but for some\
    \ reason it has a tendency to fall apart once JavaScript gets added into the mix.\
    \ It's certainly something we need to keep an eye on. A lot of front-end developers\
    \ take real pride in having clean HTML. It's easy to work with, and to certain\
    \ super-geeks it can even be artful. It's great to have clean, static HTML, but\
    \ what good is that if your generated HTML is riddled with injected style and\
    \ non-semantic markup? By “generated HTML,” I'm referencing how the HTML looks\
    \ after it's been consumed and barfed back up after being passed around all those\
    \ plugins and extra JavaScript. If step one to having clean HTML and separated\
    \ progressive enhancement layers is to not use a `style` attribute, I'd have to\
    \ say that step two is to avoid writing JavaScript that injects a `style` attribute\
    \ for you. Cleaning Up Your HTML\n\nWe can probably all agree that blindly using\
    \ a technology is a terrible idea, and I think we're at a point with jQuery where\
    \ we are, indeed, blindly using a lot of the features without fully understanding\
    \ what's going on under the hood. The example I lean on pretty heavily for keeping\
    \ CSS out of my JavaScript is the behavior of jQuery's `hide()` method. Based\
    \ on the principles of progressive enhancement, you wouldn't code something with\
    \ inline CSS like this:\n\n```\n<div class=\"content-area\" style=\"display:none;\"\
    ></</div>\n```\n\nWe don't do that because a screen reader won't pick up an element\
    \ if the style is set to `display:none`, and it also muddies up the HTML with\
    \ unnecessary presentational information. When you use a jQuery method like `hide()`,\
    \ that's exactly what it does: it will set a `style` attribute on the target area\
    \ and add a display property of `none`. It's **very easy to implement, but not\
    \ very good for accessibility**. It also violates the principles of progressive\
    \ enhancement when you inject style into the document like that (we're all sorts\
    \ of messed up, huh?). It's not uncommon for this method to be used within a tabbing\
    \ interface to hide content. The result is that the content is nonexistent to\
    \ a screen reader. Once we realize that adding style from JavaScript isn't ideal\
    \ in most cases, we can move it into the CSS and reference it as a class:\n\n\
    ```css\n.hide {\n   display: none;\n}\n```\n\n```javascript\n$('.content-area').addClass('hide');\n\
    ```\n\nWe still have to address the accessibility problem of hiding content with\
    \ `display:none`, but since we're not using a built-in jQuery method anymore,\
    \ we can control exactly how content gets hidden (whichever accessible method\
    \ you prefer is probably fine). For example we could do something like:\n\n```css\n\
    .hide {\n   position: absolute;\n   top: -9999px;\n   left: -9999px;\n}\n\n.remove\
    \ {\n   display: none;\n}\n```\n\nIn the above example, you can see that even\
    \ both classes result in content being removed from view, they function very differently\
    \ from an accessibility standpoint. Looking at the code like this makes it clear\
    \ that we really are dealing with style information that belongs in a CSS file.\
    \ Using utility classes in this way can not only help your JavaScript slim down,\
    \ but also have double usage in an Object Oriented CSS (OOCSS) development model.\
    \ This is truly **a way to not repeat yourself** (Don't Repeat Yourself, or DRY)\
    \ within CSS, but also across a whole project, creating a more holistic approach\
    \ to front-end development. Personally, I see a lot of benefit in controlling\
    \ your behaviors this way, but some people have also called me a control-freak\
    \ in the past. Web and Team Environments\n"
