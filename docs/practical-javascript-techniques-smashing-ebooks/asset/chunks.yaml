    \n# 使用 HTML、CSS 和 jQuery 创建动态条形图\n\n作者：Derek Mack\n\n全球范围内会议室里的人都喜欢优秀的图表。他们对 PowerPoint、项目符号以及诸如“挂在旗杆上”、“蓝天思维”和“触手可得”等词汇趋于痴迷，而且一切都在“向前发展”。对于那些[促进时代精神范式转移的人](http://startupista.com/corporate-bullshit-generator/)来说，后退不是一个选项。财务预测、季度销售额和市场饱和度的图表是中层管理者的梦想。\n\
    \n![screenshot](img/graph-tut-header.jpg \"使用 HTML、CSS & jQuery 创建动态条形图\")\n\n\
    作为 Web 设计师，我们如何参与到这些热门的图表制作中呢？实际上，在 Web 上显示图表的方法有很多。我们可以简单地创建一个图像并将其固定在网页上。但那样没有可访问性，也不有趣。我们可以使用\
    \ Flash，它非常适合显示图表——但再次，可访问性不高。此外，设计师、开发者和[神灵](http://www.apple.com/hotnews/thoughts-on-flash/)们正在失去对\
    \ Flash 的喜爱。HTML5 等技术不需要插件就能完成许多相同的功能。HTML 的 `<canvas>` 元素甚至可以适用于此任务。网上有很多图表工具供我们选择。但如果我们想要更定制化的方案呢？\n\
    \n"
- fmt: "\n• [jQuery](http://jquery.com/)^([7](#chapter-4.xhtml_fn4_7)). Practice safe\
    \ scripting and get the latest one. Keep the jQuery website open so that you can\
    \ look up the documentation as you go.\n\n• Possibly an image editor, such as\
    \ [Paint](http://www.microsoft.com/resources/documentation/windows/xp/all/proddocs/en-us/mspaint_overview.mspx?mfr=true)^([8](#chapter-4.xhtml_fn4_8)),\
    \ to mock up what your graph might look like.\n\n• A modern and decent Web browser\
    \ to preview changes.\n\nThat should do it. Please note that this tutorial is\
    \ not designed as an introduction to either HTML, `CSS`, `jQuery` or zombies.\
    \ Some intermediate knowledge of these three technologies and the undead is assumed.\n\
    \n### The Mark-Up\n\nYou can create the underlying HTML for a graph in a number\
    \ of ways. In this tutorial, we'll start with a `table`, because it will make\
    \ the most sense visually if `JavaScript` or `CSS` is not applied. That's a big\
    \ checkmark in the column for accessibility.\n\nQuick! You've just been given\
    \ some alarming figures. The population of tanned zombies is projected to spiral\
    \ out of control in the next few years. The carbon tigers and blue monkeys are\
    \ under immediate threat. Then the tanned zombies will probably come for us. But\
    \ you're just a designer. What could you possibly do to help?\n\nI know! You could\
    \ make a Web page that illustrates our imminent demise with nice, calming, smoothly\
    \ animated graphics!\n\nTo begin, let's put this data into a table, with columns\
    \ for each year, and rows for the different species.\n\n```html\n<!doctype html>\n\
    <html lang=\"en\">\n   <head>\n      <meta charset=\"utf-8\">\n      <meta name=\"\
    viewport\" content=\"width=1024\">\n      <title>Example 01: No CSS</title>\n\
    \   </head>\n\n   <body>\n      <div id=\"wrapper\">\n         <div class=\"chart\"\
    >\n            <h3>Population of endangered species from 2012 to 2016</h3>\n \
    \           <table id=\"data-table\" border=\"1\" cellpadding=\"10\" cellspacing=\"\
    0\"\n            summary=\"The effects of the zombie outbreak on the populations\n\
    \            of endangered species from 2012 to 2016\">\n               <caption>Population\
    \ in thousands</caption>\n               <thead>\n                  <tr>\n   \
    \                  <td>&nbsp;</td>\n                     <th scope=\"col\">2012</th>\n\
    \                     <th scope=\"col\">2013</th>\n                     <th scope=\"\
    col\">2014</th>\n                     <th scope=\"col\">2015</th>\n          \
    \           <th scope=\"col\">2016</th>\n                  </tr>\n           \
    \    </thead>\n               <tbody>\n                  <tr>\n              \
    \       <th scope=\"row\">Carbon Tiger</th>\n                     <td>4080</td>\n\
    \                     <td>6080</td>\n                     <td>6240</td>\n    \
    \                 <td>3520</td>\n                     <td>2240</td>\n        \
    \          </tr>\n                  <tr>\n                     <th scope=\"row\"\
    >Blue Monkey</th>\n                     <td>5680</td>\n                     <td>6880</td>\n\
    \                     <td>6240</td>\n                     <td>5120</td>\n    \
    \                 <td>2640</td>\n                  </tr>\n                  <tr>\n\
    \                     <th scope=\"row\">Tanned Zombie</th>\n                 \
    \    <td>1040</td>\n                     <td>1760</td>\n                     <td>2880</td>\n\
    \                     <td>4720</td>\n                     <td>7520</td>\n    \
    \              </tr>\n               </tbody>\n            </table>\n        \
    \ </div>\n      </div>\n   </body>\n</html>\n```\n\nView the example below to\
    \ see how it looks naked, with no `CSS` or `JavaScript` applied. The accessibility\
    \ of this `table` will enable people using screen readers to understand the data\
    \ and the underlying message, which is “Run for your life! The zombies are coming!”\n\
    \n[![screenshot](images/graph-tut-image-01.jpg \"Example 1: Mark-up only (no CSS\
    \ or JavaScript)\")](http://provide.smashingmagazine.com/graph_tut_files/ex_01.html)\n\
    \nThe easy part is now out of the way. Now, let's tap into the power of `CSS`\
    \ and `JavasScript` (via `jQuery`) to really illustrate what the numbers are telling\
    \ us. Technically, our aim is to create a graph that works in all modern browsers,\
    \ from `IE 8` on.\n\nDid I say all modern browsers? `IE 8` is lucky: it gets to\
    \ hang out with the cool kids. Browsers that support `CSS3` will get a few extra\
    \ sprinkles.\n\n### “By Your Powers Combined…”\n\nIf you wish to summon [Captain\
    \ Planet](http://en.wikipedia.org/wiki/Captain_Planet)^([9](#chapter-4.xhtml_fn4_9)),\
    \ you [may](http://en.wikipedia.org/wiki/Planeteer#Kwame \"Earth!\")^([10](#chapter-4.xhtml_fn4_10))\
    \ [have](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\")^([11](#chapter-4.xhtml_fn4_11))\n\
    \n### “By Your Powers Combined…”\n\nIf you wish to summon [Captain Planet](http://en.wikipedia.org/wiki/Captain_Planet)^([9](#chapter-4.xhtml_fn4_9)),\
    \ you [may](http://en.wikipedia.org/wiki/Planeteer#Kwame \"Earth!\")^([10](#chapter-4.xhtml_fn4_10))\
    \ [have](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\")^([11](#chapter-4.xhtml_fn4_11))\n\
    \n*(Note: The input text contained several repetitions/corrupted strings at the\
    \ end; I have processed the logical flow of the document structure.)*\n\n### Getting\
    \ Started\n\nThe easy part is now out of the way. Now, let's tap into the power\
    \ of `CSS` and `JavasScript` (via `jQuery`) to really illustrate what the numbers\
    \ are telling us. Technically, our aim is to create a graph that works in all\
    \ modern browsers, from `IE 8` on.\n\nDid I say all modern browsers? `IE 8` is\
    \ lucky: it gets to hang out with the cool kids. Browsers that support `CSS3`\
    \ will get a few extra sprinkles.\n\n### Getting Started In jQuery\n\nWe'll use\
    \ `jQuery` to create our graph. To do this, we need to get the data out of the\
    \ table and format it in a more usable way. Here's our basic structure:\n\n```javascript\n\
    // Wait for the DOM to load\n$(document).ready(function() {\n\n   // Create our\
    \ graph from the data and specify a container to put it in\n   createGraph('#data-table',\
    \ '.chart');\n   // Here be graphs\n   function createGraph(data, container) {\n\
    \      // Declare some variables and container elements\n      …\n\n      // Create\
    \ the table data\n      var tableData = {\n         …\n      }\n\n      // Useful\
    \ variables to access table data\n      …\n\n      // Construct the graph\n  \
    \    …\n\n      // Set the individual heights of bars\n      function displayGraph(bars)\
    \ {\n         …\n      }\n\n      // Reset the graph's settings and prepare for\
    \ display\n      function resetGraph() {\n         …\n         displayGraph(bars);\n\
    \      }\n\n      // Helper functions\n      …\n\n      // Finally, display the\
    \ graph via reset\n      resetGraph();\n   }\n});\n```\n\n### Getting The Data\n\
    \nBesides simply displaying the data, a good bar chart should have a nice big\
    \ title, clearly labelled axes and a color-coded legend. We'll need to strip the\
    \ data out of the table and format it in a way that is more meaningful in a graph.\
    \ To do that, we'll create a JavaScript object that stores our data in handy little\
    \ functions. Let's give birth to our `tableData{}` object:\n"
