- fmt: "\n![](images/cover-image.png)\n\n![Book Cover](images/cover-image.png)\n\n\
    # Imprint\n\n© 2013 Smashing Media GmbH, Freiburg, Germany\n\nISBN: 978-3-943075-59-5\
    \ (Version 1: February 2013)\n\nCover Design: Ricardo Gimenes.\n\nPR & Press:\
    \ Stephan Poppe.\n\neBook Strategy and Editing: Vitaly Friedman.\n\nTechnical\
    \ Editing: Cosima Mielke.\n\nPlanning and Quality Control: Vitaly Friedman, Iris\
    \ Lješnjanin.\n\nTools: Elja Friedman. Syntax Highlighting: Prism by Lea Verou.\n\
    \nCopywriter: Lucy Leiderman.\n\nIdea & Concept: Smashing Media GmbH.\n\n## About\
    \ This Book\n\nPresent across millions of websites and growing in popularity,\
    \ JavaScript is an essential and practical for all programmers, designers and\
    \ coding aficionados. *Practical JavaScript Techniques* offers expert instruction,\
    \ tips and methodologies relevant to all levels of knowledge. Learn interactive\
    \ CSS and jQuery techniques, how to take advantage of JavaScript's versatile capabilities\
    \ and even how to build JavaScript-based gaming experiences. Whether you're perfecting\
    \ Web design or building jQuery plugins, this vital resource is a must-have.\n\
    \n## Table Of Contents\n\n- [Imprint](#chapter-1.xhtml)\n- [Develop A One-Of-A-Kind\
    \ CSS/JS-Based Game Portfolio](#chapter-2.xhtml) — *by Daniel Sternlicht*\n- [Five\
    \ Useful Interactive CSS/jQuery Techniques Deconstructed](#chapter-3.xhtml) —\
    \ *by Jon Raasch*\n- [Create An Animated Bar Graph With HTML, CSS And jQuery](#chapter-4.xhtml)\
    \ — *by Derek Mack*\n- [A Beginner's Guide To jQuery-Based JSON API Clients](#chapter-5.xhtml)\
    \ — *by Ben Howdle*\n- [How To Build A Real-Time Commenting System](#chapter-6.xhtml)\
    \ — *by Phil Leggetter*\n- [The Developer's Guide To Conflict-Free JavaScript\
    \ And CSS In WordPress](#chapter-7.xhtml) — *by Peter Wilson*\n- [Optimizing Long\
    \ Lists Of Yes/No Values With JavaScript](#chapter-8.xhtml) — *by Lea Verou*\n\
    - [Building A Relationship Between CSS & JavaScript](#chapter-9.xhtml) — *by Tim\
    \ Wright*\n- [About The Authors](#chapter-10.xhtml)\n\n# Develop A One-Of-A-Kind\
    \ CSS/JS-Based Game Portfolio\n\nBy Daniel Sternlicht\n\nA portfolio is a must-have\
    \ for any designer or developer who wants to stake their claim on the Web. It\
    \ should be as unique as possible, and with a bit of HTML, CSS and JavaScript,\
    \ you could have a one-of-a-kind portfolio that capably represents you to potential\
    \ clients. In this chapter, I'll show you how I created my 2-D Web-based game\
    \ portfolio.\n\n![Daniel Sternlicht Portfolio.](images/1.png)\n\n*The 2-D Web-based\
    \ game portfolio of [Daniel Sternlicht](http://danielsternlicht.com)^([1](#chapter-2.xhtml_fn2_1)).*\n\
    \nBefore getting down to business, let's talk about portfolios.\n\nA portfolio\
    \ is a great tool for Web designers and developers to show off their skills. As\
    \ with any project, spend some time learning to develop a portfolio and doing\
    \ a little research on what's going on in the Web design industry, so that the\
    \ portfolio presents you as an up to date, innovative and inspiring person. All\
    \ the while, keep in mind that going with the flow isn't necessarily the best\
    \ way to stand out from the crowd.\n\nOne last thing before we dive into the mystery\
    \ of my Web-based game portfolio. I use `jQuery` which has made my life much easier\
    \ by speeding up development and keeping my code clean and simple.\n\nNow, let's\
    \ get our hands dirty with some code.\n\n### The HTML\n\nLet's warm up with a\
    \ quick overview of some very basic HTML code. It's a bit long, I know, but let's\
    \ take it step by step.\n\n```\n<div id=\"wrapper\">\n\n    <hgroup id=\"myInfo\"\
    >\n        <h1>DANIEL STERNLICHT</h1>\n        <h2>Web Designer, Front-End Developer</h2>\n\
    \    </hgroup>\n\n    <div id=\"startCave\" class=\"cave\"></div>\n    <div id=\"\
    startCaveHole\" class=\"caveHole\"></div>\n\n    <div id=\"mainRoad\" class=\"\
    road\"></div>\n    <div id=\"leftFence\"></div>\n    <div id=\"rightFence\"></div>\n\
    \n    <div id=\"daniel\"></div>\n\n    <div id=\"aboutRoad\" class=\"road side\"\
    ></div>\n    <div id=\"aboutHouse\" class=\"house\">\n        <div class=\"door\"\
    ></div>\n        <div class=\"lightbox\">...</div\n    <div id=\"aboutSign\" class=\"\
    sign\">\n        <span>About Me</span>\n    </div>\n\n    …\n\n    …\n\n    <div\
    \ id=\"rightTrees\" class=\"trees\"></div>\n    <div id=\"leftGrass\" class=\"\
    grass\"></div>\n\n    <div id=\"endSea\" class=\"sea\"></div         \n    <div\
    \ id=\"endBridge\" class=\"bridge\"></div>\n\n    <div id=\"boat\" class=\"isMoored\"\
    >\n        <div class=\"meSail\"></div>\n    </div>\n\n</</div>\n```\n\nThe HTML\
    \ is not very complicated, and I could have used an [HTML5 canvas](http://sixrevisions.com/html/canvas-element/)^([2](#chapter-2.xhtml_fn2_2))\
    \ element for this game, but I felt more comfortable using simple HTML DOM elements.\n\
    \nBasically, we have the main `#wrapper` div, which contains the game's elements,\
    \ most of which are represented as div elements (I chose divs because they are\
    \ easy to manipulate).\n\nHave a [quick look at my game](http://danielsternlicht.com)^([3](#chapter-2.xhtml_fn2_3)).\
    \ Can you detect what makes up the game view?\n\n![The game view](images/2.png)\n\
    \n*The game view*\n\nWe have roads, trees, fences, water, caves, houses and so\
    \ on.\n\nBack to our HTML. You'll find an element for each of these items, with\
    \ the relevant class and ID. Which brings us to the CSS.\n\n### The CSS\n\nFirst\
    \ of all, note that I prepared the HTML to follow the principles of [object-oriented\
    \ CSS](http://coding.smashingmagazine.com/2011/12/12/an-introduction-to-object-oriented-css-oocss/)^([4](#chapter-2.xhtml_fn2_4))\
    \ by determining global classes for styling, and not using IDs as styling hooks.\
    \ For example, I used the class `.road` on each element. The CSS for the `.road`\
    \ would be:\n\n```\n.road {\n   position: absolute;\n   background: url(images/road.png)\
    \ repeat;\n}\n```\n\nTake trees as another example:\n\n```\n.trees {\n   position:\
    \ absolute;\n   background: url(images/tree.png) repeat 0 0;\n}\n```\n\nNote that\
    \ almost all of the elements are absolutely positioned on the game. Positioning\
    \ relatively would be impossible for our purposes, especially because we want\
    \ the game to be **responsive** as possible (within limits, the minimum width\
    \ I deal with is 640 pixels). We can write a general rule giving all of the DOM\
    \ elements an absolute position:\n\n```\n#wrapper * {\n   position: absolute;\n\
    }\n```\n\nThis snippet will handle all of child elements inside the `#wrapper`\
    \ div, and it frees us from having to repeat code.\n\nOne more word about the\
    \ CSS. The animations in the game are done with **CSS3 transitions and animations**,\
    \ excluding certain features such lightboxes and player “teleporting.” There are\
    \ two reasons for this.\n\nThe first is that one of the purposes of this portfolio\
    \ is to demonstrate innovation and up-to-date development, and what's more innovative\
    \ than using the power of CSS3?\n\nThe second reason is performance. Upon reading\
    \ Richard Bradshaw's very interesting article “[CSS3 Transitions, Transforms and\
    \ Animation](http://css3.bradshawenterprises.com/)^([5](#chapter-2.xhtml_fn2_5)),”\
    \ I came to the overwhelming conclusion: **use CSS3 when you can**.\n\nA great\
    \ example of the power of CSS3 animations in my portfolio is the pattern of movement\
    \ of the water. The CSS looks like this:\n\n```\n.sea {\n   left: 0;\n   width:\
    \ 100%;\n   height: 800px;\n   background: url(images/sea.png) repeat 0 0;\n \
    \  -webkit-animation: seamove 6s linear infinite;    Webkit support */\n   -moz-animation:\
    \ seamove 6s linear infinite;      /* Firefox support */\n   animation: seamove\
    \ 6s linear infinite;          /* Future browsers support */\n}\n```\n\nAnd here\
    \ is the code for the animation itself:\n\n```\n/* Webkit support */\n@-webkit-keyframes\
    \ seamove {\n   0% {\n      background-position: 0 0;\n   }\n   100% {\n     \
    \ background-position: 65px 0;\n   }\n}\n\n@-moz-keyframes seamove {…}   /* Firefox\
    \ support */\n@-keyframes seamove {…}       /* Future browsers support */\n```\n\
    \n[![Sea.png](images/3.png)](http://media.smashingmagazine.com/wp-content/uploads/2012/04/3.png)\n\
    \n*The sea PNG is marked out.*\n"
