    \ buttons. Besides the color changing and an icon being added, the effect is animated\
    \ in browsers that support transition, making the icon appear to **slide into\
    \ place**.\n\n•[View the demo](http://jonraasch.com/demo/animated-icons)^([33](#chapter-3.xhtml_fn3_33))\n\
    \nLet's create a similar effect, starting with some mark-up:\n\n```\n<a href=\"\
    #\" class=\"hover-panel\">\n    <h3>Panel Title</h3>\n\n    <p>Additional information\
    \ about the panel goes in a paragraph here</p>\n</a>\n```\n\nOne thing to note\
    \ about this mark-up is that it has block elements nested in an `<a>` element,\
    \ which makes sense semantically, but it's valid only if you're using the HTML5\
    \ doc type.\n\n#### Styling the Buttons\n\nLet's set up some basic CSS to style\
    \ the block in its natural (non-hovered) state:\n\n```\n.hover-panel {\n    background-color:\
    \ #E6E2DF;\n    color: #B2AAA4;\n    float: left;\n    height: 130px;\n    width:\
    \ 262px;\n    margin: 0 10px 10px 0;\n    padding: 15px;\n}\n\n.hover-panel h3\
