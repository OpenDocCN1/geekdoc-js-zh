    \n22.[`pusher.com/docs/rest_libraries`](http://pusher.com/docs/rest_libraries)\n\
    \n23.[`pusher.com/docs/private_channels`](http://pusher.com/docs/private_channels)\n\
    \n24.[`pusher.com/docs/presence`](http://pusher.com/docs/presence)\n\n25.[`github.com/squeeks/Pusher-PHP`](https://github.com/squeeks/Pusher-PHP)\n\
    \n26.[`github.com/squeeks/Pusher-PHP/zipball/master`](https://github.com/squeeks/Pusher-PHP/zipball/master)\n\
    \n27.[`pusher.com/docs/client_api_guide/client_events`](http://pusher.com/docs/client_api_guide/client_events)\n\
    \n"
- fmt: "\nWordPress includes these libraries so that plugin and theme authors can\
    \ avoid this problem by using the `wp_register_script` and `wp_enqueue_script`\
    \ PHP functions to include JavaScript in the HTML.\n\nRegistering a file alone\
    \ doesn't do anything to the output of your HTML; it only adds the file to WordPress's\
    \ list of known scripts. As you'll see in the next section, we register files\
    \ early on in a theme or plugin where we can keep track of versioning information.\n\
    \nTo output the file to the HTML, you need to enqueue the file. Once you've done\
    \ this, WordPress will add the required script tag to the header or footer of\
    \ the outputted page. More details are provided later in this article.\n\nRegistering\
    \ a file requires more complex code than enqueueing the files; so, quickly parsing\
    \ the file is harder when you're reviewing your code. Enqueueing the file is far\
    \ simpler, and you can easily parse how the HTML is being affected.\n\nFor these\
    \ techniques to work, the theme's `header.php` file must include the line `<?php\
    \ wp_head(); ?>` just before the `</head>` tag, and the `footer.php` file must\
    \ include the line `<?php wp_footer(); ?>` just before the `</body>` tag.\n\n\
    ### Registering JavaScript\n\nBefore registering your JavaScript, you'll need\
    \ to decide on a few additional items:\n\n- the file's handle (i.e. the name by\
    \ which WordPress will know the file);\n- other scripts that the file depends\
    \ on (jQuery, for example);\n- the version number (optional);\n- where the file\
    \ will appear in the HTML (the header or footer).\n\nThis chapter refers to building\
    \ a theme, but the tips apply equally to building a plugin.\n\n### Examples\n\n\
    We'll use two JavaScript files to illustrate the power of the functions:\n\nThe\
    \ first is `base.js`, which is a toolkit of functions used in our example website.\n\
    \n```javascript\nfunction makeRed(selector){\n  var $ = jQuery; //enable $ alias\
    \ within this scope\n  $(function(){\n    $(selector).css('color','red');\n  });\n\
    }\n```\n\nThe `base.js` file relies on `jQuery`, so `jQuery` can be considered\
    \ a dependency.\n\nThis is the first version of the file, version 1.0.0, and there\
    \ is no reason to run this file in the HTML header.\n\nThe second file, `custom.js`,\
    \ is used to add the JavaScript goodness to our website.\n\n```javascript\nmakeRed('*');\
    \ \n```\n\nThis `custom.js` file calls a function in `base.js`, so `base.js` is\
    \ a dependency.\n\nLike `base.js`, `custom.js` is version 1.0.0 and can be run\
    \ in the HTML footer.\n\nThe `custom.js` file also indirectly relies on `jQuery`.\
    \ But in this case, `base.js` could be edited to be self-contained or to rely\
    \ on another framework. There is no need for `jQuery` to be listed as a dependency\
    \ of `custom.js`.\n\nIt's now simply a matter of registering your JavaScript using\
    \ the function `wp_register_script`. This takes the following arguments:\n\n-\
    \ `$handle`: a string\n- `$source`: a string\n- `$dependancies`: an array (optional)\n\
    - `$version`: a string (optional)\n- `$in_footer`: True/false (optional, default\
    \ is false)\n\nWhen registering scripts, it is best to use the `init` hook and\
    \ to register them all at once.\n\nTo register the scripts in our example, add\
    \ the following to the theme's `functions.php` file:\n\n```php\nfunction mytheme_register_scripts()\
    \ { \n  //base.js – dependent on jQuery \n  wp_register_script( \n    'theme-base',\
    \ //handle \n    '/wp-content/themes/my-theme/base.js', //source \n    array('jquery'),\
    \ //dependencies \n    '1.0.0', //version \n    true //run in footer \n  ); \n\
    \n  //custom.js – dependent on base.js \n  wp_register_script( \n    'theme-custom',\
    \ \n    '/wp-content/themes/my-theme/custom.js', \n    array('theme-base'), \n\
    \    '1.0.0', \n    true \n  ); \n} \nadd_action('init', 'mytheme_register_scripts');\n\
    ```\n\nThere is no need to register `jQuery`, because WordPress already has. Re-registering\
    \ it could lead to problems.\n\n### You Have Achieved Nothing!\n\nAll of this\
    \ registering JavaScript files the WordPress way has, so far, achieved nothing.\
    \ Nothing will be outputted to your HTML files.\n\nTo get WordPress to output\
    \ the relevant HTML, we need to enqueue our files. Unlike the relatively long-winded\
    \ commands required to register the functions, this is a very simple process.\n\
    \n### Outputting the JavaScript HTML\n\nAdding the `<script>` tags to your HTML\
    \ is done with the `wp_enqueue_script` function. Once a script is registered,\
    \ it takes one argument, the file's handle.\n\nAdding JavaScript to the HTML is\
    \ done in the `wp_print_scripts` hook with the following code:\n\n```php\nfunction\
    \ mytheme_enqueue_scripts(){ \n  if (!is_admin()): \n    wp_enqueue_script('theme-custom');\
    \ //custom.js \n  endif; //!is_admin \n} \nadd_action('wp_print_scripts', 'mytheme_enqueue_scripts');\n\
    ```\n\nOf our two registered JavaScript files (`base.js` and `custom.js`), only\
    \ the second adds JavaScript functionality to the HTML.\n\n### Registering Style\
    \ Sheets\n\nBoth of the functions for adding style to the HTML: `wp_register_style`\
    \ and `wp_enqueue_style`.\n\nAs with the JavaScript example, we'll use a couple\
    \ of CSS files throughout this chapter, employing the mobile-first methodology.\n\
    \nThe `mobile.css` file is for all devices. The `desktop.css` file is for big-screen\
    \ browsers.\n\nOnce you've decided on version numbers, dependencies and media\
    \ types, it's time to register your style sheets using `wp_register_style`. This\
    \ function takes the following arguments:\n\n- `$handle`: a string\n- `$source`:\
    \ a string\n- `$dependancies`: an array (optional, default is none)\n- `$version`:\
    \ a string (optional, default is the current WordPress version)\n- `$media_type`:\
    \ a string (optional, default is all)\n\nAgain, registering your style sheets\
    \ using the `init` hook is best.\n\nTo your theme's `functions.php`, you would\
    \ add this:\n\n```php\nfunction mytheme_register_styles() { \n  //mobile.css for\
    \ all devices \n  wp_register_style( \n    'theme-mobile', //handle \n    '/wp-content/themes/my-theme/mobile.css',\
    \ //source \n    null, //no dependencies \n    '1.0.0' //version \n  ); \n\n \
    \ //desktop.css for big-screen browsers \n  wp_register_style( \n    'theme-desktop',\
    \ \n    '/wp-content/themes/my-theme/desktop.css', \n    array('theme-mobile'),\
    \ \n    '1.0.0', \n    'only screen and (min-width : 960px)' //media type \n \
    \ ); \n} \nadd_action('init', 'mytheme_register_styles');\n```\n\nWe have used\
    \ CSS3 media queries to prevent mobile browsers from parsing our desktop style\
    \ sheet. But Internet Explorer versions 8 and below do not understand CSS3 media\
    \ queries\n\n### Conditional Comments\n\nWhen registering CSS using the register\
    \ and enqueue functions, conditional comments are a little more complex. WordPress\
    \ uses the object `$wp_styles` to store registered style sheets.\n\nTo wrap your\
    \ file in conditional comments, add extra information to this object.\n\nFor Internet\
    \ Explorer 8 and below, excluding mobile IE, we need to register another copy\
    \ of our desktop style sheet (using the media type `all`) and wrap it in conditional\
    \ comments.\n\nIn the code sample above, `/* *keep reading* */` would be replaced\
    \ with the following:\n"
