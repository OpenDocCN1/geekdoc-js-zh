    \ 5px;\n\tborder-radius: 5px;\n\n\tline-height: 1.4em;\n}\n```\n\nOnce the HTML\
    \ structure, the comment form and the CSS are in place our blogging system has\
    \ started to look a bit more presentable.\n\n![Screenshot of blog post and commenting\
    \ system](images/blog_and_comments.png)\n\n### Handling Comment Submission\n\n\
    The next step is to write the PHP form submission handler which accepts the request\
    \ and stores the comment, `post_comment.php`. You should create this file in the\
