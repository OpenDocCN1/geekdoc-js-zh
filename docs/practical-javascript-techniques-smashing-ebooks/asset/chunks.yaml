    \n# Five Useful Interactive CSS/jQuery Techniques Deconstructed\n\nBy Jon Raasch\n\
    \nWith the wide variety of `CSS3` and `JavaScript` techniques available today,\
    \ it's easier than ever to create unique interactive websites that delight visitors\
    \ and provide a more engaging user experience.\n\nIn this chapter, we'll walk\
    \ through five interactive techniques that you can start using right now.\n\n\
    Besides learning how to accomplish these specific tasks, you'll also master a\
    \ variety of `useful CSS and jQuery tricks` that you can leverage when creating\
    \ your own interactive techniques. The solutions presented here are certainly\
    \ not perfect, so any thoughts, ideas and suggestions on how you would solve these\
    \ design problems would be very appreciated.\n\nSo, let's dive in and start building\
    \ more exciting websites!\n\n## 1. Extruded Text Effect\n\n[![Extruded text effect\
    \ on David DeSandro's site](images/extruded-text-effect.png \"Extruded text effect\
    \ on David DeSandro's website\")](http://desandro.com/)\n\nThe footer of [David\
    \ DeSandro's website](http://desandro.com/) uses extruded text that animates on\
    \ `mouseover`. This interactive text effect is a quick and impressive way to add\
    \ some flare to your website. With only a few lines of `CSS3`, we can make the\
    \ text appear to pop out of the page in `three dimensions`.\n\n• [View the demo](http://jonraasch.com/demo/extrude-on-hover)\n\
    \nFirst let's set up some text (the code is copied from the original site):\n\n\
    ```\n<span class=\"extruded\">Extrude Me</span>\n```\n\nAnd some basic styling\
    \ (the code is copied from the original site):\n\n```\nbody {\n    background-color:\
    \ #444;\n    text-align: center;\n}\n\n.extruded {\n    color: #888;\n    font-family:\
    \ proxima-nova-1, proxima-nova-2, 'Helvetica Neue', Arial, sans-serif;\n    font-size:\
    \ 48px;\n    font-weight: bold;\n    text-shadow: #000 3px 3px;\n}\n```\n\nHere,\
    \ we've applied some basic styles and added a `text-shadow`. But this `text-shadow`\
    \ doesn't look three-dimensional; to accomplish the extruded effect, we'll need\
    \ to `add more text-shadows`:\n\n```\n text-shadow: #000 1px 1px, #000 2px 2px,\
    \ #000 3px 3px;\n```\n\nThis will add three different text-shadows to our text,\
    \ stacked on top of each other to create the three dimensional appearance we want.\n\
    \n### Styling the Hover State\n\nNext, let's add a hover state with a bigger `text-shadow`:\n\
    \n```\n.extruded:hover {\n    color: #FFF;\n    text-shadow: #58E 1px 1px, #58E\
    \ 2px 2px, #58E 3px 3px, #58E 4px 4px, #58E 5px 5px, #58E 6px 6px;\n}\n```\n\n\
    Here, we've added three more text-shadows to increase the depth. But `text-shadow`\
    \ alone doesn't look three-dimensional; to accomplish the extruded effect, we'll\
    \ need to `add more text-shadows`:\n\n```\n.extruded:hover {\n    color: #FFF;\n\
    \    text-shadow: #58E 1px 1px, #58E 2px 2px, #58E 3px 3px, #58E 4px 4px, #58E\
    \ 5px 5px, #58E 6px 6px;\n}\n```\n\n(Note: The source text provided by the user\
    \ contains significant repetition/garbled text in the latter half. I will format\
    \ it as-is, ensuring backticks are applied to the technical terms like `text-shadow`,\
    \ `.extruded`, etc.)\n\n*Wait, looking at the user's provided text again, it seems\
    \ to have a copy-paste error in the source itself. I will format the text as-is,\
    \ following the Markdown rules.*\n\nActually, I will just provide the clean formatted\
