    Jon Raasch 是书籍 [Smashing Webkit](http://www.amazon.com/Smashing-WebKit-Magazine-Book/dp/1119999138)
    的作者。他是一位自由 [front-end web developer](http://jonraasch.com/) 和 UI 设计师，对 `jQuery`、`CSS3`、`HTML5`
    和性能调优有无限的热爱。你可以在 [Twitter](http://twitter.com/jonraasch) 上关注他或 [阅读他的博客](http://jonraasch.com/blog/)。


    ### Lea Verou

    Lea 在 [W3C](http://w3.org/) 担任 `Developer Advocate`。她对开放 Web 标准有着长期的热情，通过研究使用这些标准的新方法、[博客](http://lea.verou.me/)、[演讲](http://lea.verou.me/speaking)、[写作](http://lea.verou.me/publications)以及编写流行的开源
    [projects](http://lea.verou.me/projects/) 来帮助其他开发者。她是 [CSS Working Group](http://www.w3.org/Style/CSS/members.en.php3)
    的成员。


