  trans: "\n\n```\nglobal $wp_styles; \nwp_register_style( \n  'theme-desktop-ie',\
    \ \n  '/wp-content/themes/my-theme/desktop.css', \n  array('theme-mobile'), \n\
    \  '1.0.0' \n); \n\n$wp_styles->add_data( \n  'theme-desktop-ie', //handle \n\
    \  'conditional',  //is a conditional comment \n  '!(IEMobile)(lte IE 8)' //the\
    \ conditional comment \n);\n```\n\n遗憾的是，目前没有将 JavaScript 文件封装在条件注释中的对应方法，这可能是因为后台部分对\
    \ JavaScript 进行了合并。\n\n如果你需要将 JavaScript 文件封装在条件注释中，你需要将其添加到主题的 `header.php` 或\
    \ `footer.php` 中。或者，你也可以使用 `wp_head` 或 `wp_footer` 钩。\n\n## 输出样式表 HTML\n\n输出样式表\
    \ HTML 与输出 JavaScript HTML 非常相似。我们使用 `enqueue` 函数并在 `wp_print_styles` 钩子上运行它。\n\
    \n在我们的示例中，我们可以只需告诉 WordPress 仅队列句柄为 `theme-desktop` 和 `theme-desktop-ie` 的样式表。WordPress\
    \ 随后将输出 `mobile`/`all` 媒体版本。\n\n然而，这两个样式表都在基础重置之外为网站应用了样式：`mobile.css` 为手机构建网站，而\
    \ `desktop.css` 在此基础上构建。如果它执行了某些操作并且我已经注册了它，那么我就应该将其队列化。这有助于跟踪正在发生的情况。\n\n以下是将\
    \ CSS 输出到 HTML 的代码：\n\n```\nfunction mytheme_enqueue_styles(){ \n  if (!is_admin()):\
    \ \n    wp_enqueue_style('theme-mobile'); //mobile.css \n    wp_enqueue_style('theme-desktop');\
    \ //desktop.css \n    wp_enqueue_style('theme-desktop-ie'); //desktop.css lte\
    \ ie8 \n  endif; //!is_admin \n} \nadd_action('wp_print_styles', 'mytheme_enqueue_styles');\n\
    ```\n\n## 这样做意义何？\n\n你可能会疑惑，既然我们可以直接在主题的 `header.php` 中或使用 `wp_head` 钩输出 JavaScript\
    \ 和样式表，那么费这些额外努力的意义何？\n\n对于独立主题中的 CSS 来说，这个观点是合理的。这些是额外的工作，没有太大的回报。\n\n但对于 JavaScript\
    \ 来说，这有助于防止插件和主题在使用不同版本的 JavaScript 框架时发生冲突。它还可以通过避免文件重复来使页面加载速度尽可能快。\n\n### WordPress\
    \ 框架\n\n当使用框架进行主题时，这组函数会最有帮助。在我的代理公司 [Soupgiant](http://soupgiant.com/)，我们构建了一个框架来加速网站的生产。\n\
    \n和大多数代理公司一样，我们对 JavaScript 和 CSS 文件的命名有一套内部规范。\n\n当我们为客户创建一个定制的 WordPress 主题时，我们将其开发为我们框架的[子主题](http://codex.wordpress.org/Child_Themes)。在框架本身中，我们根据我们的命名规范注册了许多\
    \ JavaScript 和 CSS 文件。\n\n在子主题中，我们只需要队列化文件以输出 HTML 即可。\n\n```\nfunction clienttheme_enqueue_css()\
    \ { \n  if (!is_admin()): \n    wp_enqueue_style('theme-mobile'); \n    wp_enqueue_style('theme-desktop');\
    \ \n    wp_enqueue_style('theme-desktop-ie'); \n  endif; //!is_admin \n} \nadd_action('wp_print_styles',\
    \ 'clienttheme_enqueue_css'); \n\nfunction clienttheme_enqueue_js() { \n  if (!is_admin()):\
    \ \n    wp_enqueue_script('theme-custom'); \n  endif; //!is_admin\n} \nadd_action('wp_print_scripts',\
    \ 'clienttheme_enqueue_js');\n```\n\n以 WordPress 的方式向主题添加 CSS 和 JavaScript，使我们能够一眼跟踪到底正在发生什么。\n\
    \n### 轻微的局限性\n\n如果你在主题或插件中使用 JavaScript 框架，那么你将受限于当前 WordPress 版本附带的框架，而这有时会比框架的最新官方发布晚一两个版本。（在技术上升级到更高版本的框架是可能的，但这可能会导致在使用\
    \ WordPress 附带版本的其他主题或插件产生问题，因此我在本章省略了这些信息。）\n\n虽然这阻止了你使用 WordPress 包含的版本之后添加的框架任何新功能，但优势是所有主题和插件作者都将预期哪个版本的框架。\n\
    \n## 单一注册点\n\n在单个代码块中注册你的样式和脚本，这样当你更新文件时，就可以轻松地返回并更新版本号。\n\n如果你在网站的不同部分使用不同的代码，可以在队列脚本周围封装逻辑。\n\
    \n例如，如果你的归档页使用的 JavaScript 与网站其他部分不同，可能会注册三个文件：\n\n- 基础 JavaScript（注册为 `theme-base`），\n\
    - 归档 JavaScript（注册为 `theme-archive`），\n- 普通 JavaScript（注册为 `theme-general`）。\n\
    \n同样，基础 JavaScript 没有为网站添加任何内容。相反，它是另外两个文件依赖的一组函数。你可以使用以下代码队列化文件：\n\n```\nfunction\
    \ mytheme_enqueue_js(){ \n  if (is_archive()) { \n    wp_enqueue_script('theme-archive');\
    \ \n  } elseif (!is_admin()) {\n    wp_enqueue_script('theme-general');\n  }\n\
    }\nadd_action('wp_print_scripts', 'mytheme_enqueue_js');\n```\n\n### 使用 Google\
    \ CDN\n\n虽然使用 WordPress 方式 JavaScript 可以避免常用库之间相互冲突的问题，但你可能更倾向于从 Google 服务器提供这些库，而不是自己的服务器。\n\
    \n使用 Jason Penny 的 [Use Google Libraries](http://wordpress.org/extend/plugins/use-google-libraries/)\
    \ 是做到这一点最简单的方法。该插件会自动保持 jQuery 处于无冲突模式（noConflict mode）。\n\n"
