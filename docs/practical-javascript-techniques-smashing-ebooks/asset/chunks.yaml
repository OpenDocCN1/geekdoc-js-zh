    \ `Number#toString()` method allows us to go up to [base 36](http://en.wikipedia.org/wiki/Base_36)^([6](#chapter-8.xhtml_fn8_6))\
    \ (throwing a `RangeError` for `>= 37`), which effectively uses *all* letters\
    \ in the alphabet, all the way up to z! This way, we can have a compression of\
    \ up to 6 characters for 32 values, which means saving up to 81.25% compared to\
    \ the plain string method! And the code is just as simple:\n\n```\nparseInt( '1001011000',\
    \ 2).toString(36); // returns 'go' (instead of '258', which would be the hex version)\n\
    parseInt('go', 36).toString(2); // returns  '1001011000'\n```\n\nFor some of you,\
    \ this will be enough. But I can almost hear the more inquisitive minds out there\
    \ shouting, “But we have capital letters, we have other symbols, we are still\
    \ not using strings to their full potential!” And you'd be right. There is a reason\
    \ why every time you open a binary file in a text editor, you get weird symbols\
    \ mixed with numbers, uppercase letters, lowercase letters and whatnot. Every\
    \ character in an UTF-16 string is a 2 bytes (16 bits), which means that if we\
    \ use the right compression algorithm, we should be able to store 16 yes/no values\
    \ in it (saving 93.75% from the string method).\n\nThe problem is that JavaScript\
    \ doesn't offer a built-in way to do that, so the code becomes a bit more complicated.\n\
    \n### Packing 16 Values Into One Character\n\nYou can use `String.fromCharCode`\
    \ to get the individual characters. It accepts a numerical value of up to 65,535\
    \ and returns a character (and for values greater than that, it returns an empty\
    \ string).\n\nSo, we have to split our string into chunks of 16 characters in\
    \ size. We can [do that through `.match(/.{1,16}/g)`](http://stackoverflow.com/questions/7033639/javascript-split-large-string-in-n-size-chunks)^([7](#chapter-8.xhtml_fn8_7)).\
    \ To sum up, the full solution would look like this:\n\n```\nfunction pack(/*\
    \ string */ values) {\n    var chunks = values.match(/.{1,16}/g), packed = '';\n\
    \    for (var i=0; i < chunks.length; i++) {\n        packed += String.fromCharCode(parseInt(chunks[i],\
    \ 2));\n    }\n    return packed;\n}\n\nfunction unpack(/* string */ packed) {\n\
    \    var values = '';\n    for (var i=0; i < packed.length; i++) {\n        values\
    \ += packed.charCodeAt(i).toString(2);\n    }\n    return values;\n}\n```\n\n\
    It wasn't that hard, was it?\n\nWith these few lines of code, you can pack the\
    \ aforementioned 512 values into — drum roll, please — **32 characters (64 bytes)**!\n\
    \nQuite an improvement over our original 2 KB (with the array method), isn't it?\n\
    \n### Limitations\n\nNumbers in JavaScript have limits. For the methods discussed\
    \ here that involve an intermediate state of converting to a number, the limit\
    \ appears to be **1023** yes/no values, because `parseInt('1111…1111', 2)` returns\
    \ `Infinity` when the number of aces is bigger than 1023\\. This limit does not\
    \ apply to the last method, because we're only converting blocks of bits instead\
    \ of the whole thing. And, of course, it doesn't apply to the first two methods\
    \ (array and string) because they don't involve packing the values into an integer."
