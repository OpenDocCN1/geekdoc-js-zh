- fmt: "\nWhile we can easily animate text with a few lines of code, animating an\
    \ image usually requires bigger and slower assets, such as [animated GIFs](http://www.gifmuseum.com/)^([6](#chapter-3.xhtml_fn3_6))\
    \ or Flash or HTML5 video. While complex animations will still depend on these\
    \ technologies, we can create a compelling illusion of animation using CSS alone.\n\
    \n[Love Nonsense](http://lovenonsense.com/)^([7](#chapter-3.xhtml_fn3_7)) uses\
    \ a hover effect to alter the color of the images on the website. The trick here\
    \ is to use a transparent PNG with a background color. The color of the PNG should\
    \ match the website's background, so that all of the transparent areas in the\
    \ PNG show up when filled with a background color. Thus, the PNG should contain\
    \ the `negative space` of the image you want to display (i.e. the shape you want\
    \ should be transparent, and everything else should be the same color as the background).\n\
    \nHere's an example of the Smashing Magazine logo with negative space:\n\n[![Coloring\
    \ the negative space of an image](images/inverse-negative-space.jpg \"Coloring\
    \ the negative space\")](http://jonraasch.com/demo/animated-image)\n\nNotice [in\
    \ the demo](http://jonraasch.com/demo/animated-image)^([8](#chapter-3.xhtml_fn3_8))\
    \ how when the background color is set to orange, it starts to look more like\
    \ the real thing.\n\n## The Code\n\n•[View the demo](http://jonraasch.com/demo/animated-image)^([9](#chapter-3.xhtml_fn3_9))\n\
    \nFirst, let's do some basic mark-up:\n\n```\n<div class=\"post-wrapper\">\n \
    \   <h2 class=\"post-title\">\n        This is the title you hover over\n\n  \
    \      <img src=\"knockout-image.png\" class=\"post-image\" alt=\"\" />\n    </h2>\n\
    \n    <p>Some more text here.</p>\n</div>\n```\n\nHere we include a post with\
    \ a title, our knock-out image and a paragraph of text.\n\nNext, let's set up\
    \ some static styles:\n\n```css\n.post-wrapper {\n    position: relative;\n  \
    \  padding-left: 240px;\n}\n\n.post-image {\n    position: absolute;\n    top:\
    \ 0;\n    left: 0;\n    background-color: #bbb;\n}\n\n.post-title {\n    color:\
    \ #037072;\n}\n```\n\nHere, we've set up the post's wrapper with `position: relative`\
    \ and with enough padding on the left side to absolutely position the image to\
    \ the left of our post. We've also added a background color to our image; so now\
    \ the positive space in our PNG shows up as light gray.\n\nNext, let's add some\
    \ hover effects:\n\n```css\n.post-title:hover {\n    color: #d63c25;\n}\n\n.post-title:hover\
    \ .post-image {\n    background-color: #f04e36;\n}\n```\n\nNow, when we hover\
    \ over the title or the image, both will change color.\n\nWe can take this effect\
    \ a step further by animating the transition:\n\n```css\n.post-image {\n    -webkit-transition:\
    \ background-color 400ms ease-in;\n    -moz-transition: background-color 400ms\
    \ ease-in;\n    transition: background-color 400ms ease-in;\n}\n\n.post-title\
    \ {\n    -webkit-transition: color 400ms ease-in;\n    -moz-transition: color\
    \ 400ms ease-in;\n    transition: color 400ms ease-in;\n}\n```\n\nHere, we've\
    \ added a [CSS3 transition](http://net.tutsplus.com/tutorials/html-css-techniques/css-fundametals-css-3-transitions/)^([10](#chapter-3.xhtml_fn3_10))\
    \ to both the image and the title, which will make for a smooth color change animation.\n\
    \nUnfortunately, CSS3 transitions are not currently supported in IE9. However,\
    \ even in unsupported browsers, the color change will still occur — it just won't\
    \ have a smooth animation.\n\nIf complete cross-browser support for the animation\
    \ is important, you could always provide a jQuery version of the animation for\
    \ unsupported browsers. Bear in mind, though, that jQuery's `animate()` method\
    \ does not support color animations, so you'll need to use a [color plug-in](https://github.com/jquery/jquery-color)^([12](#chapter-3.xhtml_fn3_12)).\n\
    \nPutting all the CSS together:\n\n```css\n.post-wrapper {\n    position: relative;\n\
    \    padding-left: 240px;\n}\n\n.post-image {\n    position: absolute;\n    top:\
    \ 0;\n    left: 0;\n    background-color: #bbb;\n    -webkit-transition: background-color\
    \ 400ms ease-in;\n    -moz-transition: background-color 400ms ease-in;\n    transition:\
    \ background-color 400ms ease-in;\n}\n\n.post-title {\n    color: #037072;\n \
    \   -webkit-transition: color 400ms ease-in;\n    -moz-transition: color 400ms\
    \ ease-in;\n    transition: color 400ms ease-in;\n}\n\n/* add the hover states\
    \ */\n\n.post-title:hover {\n    color: #d63c25;\n}\n\n.post-title:hover .post-image\
    \ {\n    background-color: #f04e36;\n}\n```\n\n•[Download the complete example](https://gist.github.com/957217)^([13](#chapter-3.xhtml_fn3_13))\n\
    \n•[View the demo](http://jonraasch.com/demo/animated-image)^([9](#chapter-3.xhtml_fn3_9))\n\
    \n## 3. Mega Dropdown\n\n[![Mega dropdown menu on Bohemia](images/mega-dropdown-menu.jpg\
    \ \"Mega dropdown menu on Bohemia\")](http://www.bohemiadesign.co.uk/)\n\nOne\
    \ common design problem with dropdown menus is that they often contain a lot of\
    \ items. Instead of presenting all of items in a long column, [Bohemia Design](http://www.bohemiadesign.co.uk/)\
    \ uses a `multi-column dropdown`. This approach not only looks great, provides\
    \ an opportunity to highlight the most important. Let's recreate this menu using\
    \ jQuery.\n\n[View the demo](http://jonraasch.com/demo/animated-image)^([9](#chapter-3.xhtml_fn3_9))\n\
    \n### Building the Tabs\n\nIdeally, we would start with a lean and simple markup:\n\
    \n```html\n<nav>\n    <li>Tab 1</li>\n    <li>Tab 2</li>\n    <li>Tab 3</li>\n\
    \    <li>Tab 4</li>\n    <li>Tab 5</li>\n</nav>\n```\n\nNext, let's style these\
    \ five tabs:\n\n```css\n#main-nav {\n    width: 800px;\n    height: 50px;\n  \
    \  position: relative;\n    list-style: none;\n    padding: 0;\n}\n\n#main-nav\
    \ .main-nav-item {\n    display: inline;\n}\n\n#main-nav .main-nav-tab {\n   \
    \ float: left;\n    width: 140px;\n    height: 30px;\n    padding: 10px;\n   \
    \ line-height: 30px;\n    text-align: center;\n    color: #FFF;\n    text-decoration:\
    \ none;\n    font-size: 18px;\n}\n```\n\nAlthough a lot of the CSS is specific\
    \ to our example, there are a few important styles to note.\n\nFirst, we've defined\
    \ a height and width for our overall tab area and matched the total height and\
    \ width of all five tabs, so that we can position the dropdown correctly. Next,\
    \ we've defined `position: relative` for the tab wrapper, which will allow us\
    \ to position the dropdown absolutely.\n\nThen, we added `list-style: none` to\
    \ the list wrapper, and `display: inline` to each list item, to eliminate any\
    \ list styling.\n\nFinally, we floated all of the tab links to the left.\n\n####\
    \ Building the Dropdown\n\nNow, let's build the dropdown mark-up in one of our\
    \ tab wrappers:\n"
