    ```\n\nOf our two registered JavaScript files (*base.js* and *custom.js*), only\
    \ the second adds JavaScript functionality to the website. Without the second\
    \ file, there is no need to add the first.\n\nHaving enqueued *custom.js* for\
    \ output to the HTML, WordPress will figure out that it depends on *base.js* being\
    \ present and that *base.js*, in turn, requires jQuery. The resulting HTML is:\n\
    \n```\n<script src=\"/wp-includes/js/jquery/jquery.js?ver=1.6.1\" type=\"text/javascript\"\
    ></script>\n<script src=\"/wp-content/themes/my-theme/base.js?ver=1.0.0\" type=\"\
    text/javascript\"></script>\n<script src=\"/wp-content/themes/my-theme/custom.js?ver=1.0.0\"\
    \ type=\"text/javascript\"></script>\n```\n\n### Registering Style Sheets\n\n\
    Both of the functions for adding JavaScript to our HTML have sister PHP functions\
    \ for adding style sheets to the HTML: `wp_register_style` and `wp_enqueue_style`.\n\
    \nAs with the JavaScript example, we'll use a couple of CSS files throughout this\
    \ chapter, employing the mobile-first methodology for responsive Web design.\n\
    \nThe *mobile.css* file is the CSS for building the mobile version of the website.\
    \ It has no dependencies.\n\nThe *desktop.css* file is the CSS that is loaded\
    \ for desktop devices only. The desktop version builds on the mobile version,\
    \ so *mobile.css* is a dependency.\n\nOnce you've decided on version numbers,\
    \ dependencies and media types, it's time to register your style sheets using\
    \ the `wp_register_style` function. This function takes the following arguments:\n\
    \n•`$handle`\n\nA string\n\n•`$source`\n\nA string\n\n•`$dependancies`\n\nAn array\
    \ (optional, default is none)\n\n•`$version`\n\nA string (optional, the default\
    \ is the current WordPress version number)\n\n•`$media_type`\n\nA string (optional,\
    \ the default is all)\n\nAgain, registering your style sheets using the `init`\
    \ action is best.\n\nTo your theme's *functions.php*, you would add this:\n\n\
    ```\nfunction mytheme_register_styles(){ \n  //mobile.css for all devices \n \
    \ wp_register_style( \n    'theme-mobile', //handle \n    '/wp-content/themes/my-theme/mobile.css',\
    \ //source \n    null, //no dependencies \n    '1.0.0' //version \n  ); \n\n \
    \ //desktop.css for big-screen browsers \n  wp_register_style( \n    'theme-desktop',\
    \ \n    '/wp-content/themes/my-theme/desktop.css', \n    array('theme-mobile'),\
    \ \n    '1.0.0', \n    'only screen and (min-width : 960px)' //media type \n \
    \ ); \n\n  /* *keep reading* */ \n} \nadd_action('init', 'mytheme_register_styles');\n\
    ```\n\nWe have used CSS3 media queries to prevent mobile browsers from parsing\
    \ our desktop style sheet. But Internet Explorer versions 8 and below do not understand\
    \ CSS3 media queries and so will not parse the desktop CSS either.\n\nIE8 is only\
    \ two years old, so we should support its users with conditional comments.\n\n\
    #### Conditional Comments\n\nWhen registering CSS using the register and enqueue\
    \ functions, conditional comments are a little more complex. WordPress uses the\
    \ object `$wp_styles` to store registered style sheets.\n\nTo wrap your file in\
    \ conditional comments, add extra information to this object.\n\nFor Internet\
    \ Explorer 8 and below, excluding mobile IE, we need to register another copy\
    \ of our desktop style sheet (using the media type `all`) and wrap it in conditional\
    \ comments.\n\nIn the code sample above, `/* *keep reading* */` would be replaced\
    \ with the following:"
