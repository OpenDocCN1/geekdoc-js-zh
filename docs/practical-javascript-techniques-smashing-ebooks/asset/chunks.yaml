    \ and the underlying message, which is “Run for your life! The zombies are coming!”\n\
    \n[![screenshot](images/graph-tut-image-01.jpg \"Example 1: Mark-up only (no CSS\
    \ or JavaScript)\")](http://provide.smashingmagazine.com/graph_tut_files/ex_01.html)\n\
    \nThe easy part is now out of the way. Now, let's tap into the power of CSS and\
    \ JavasScript (via jQuery) to really illustrate what the numbers are telling us.\
    \ Technically, our aim is to create a graph that works in all modern browsers,\
    \ from IE 8 on.\n\nDid I say all modern browsers? IE 8 is lucky: it gets to hang\
    \ out with the cool kids. Browsers that support CSS3 will get a few extra sprinkles.\n\
    \n### “By Your Powers Combined…”\n\nIf you wish to summon [Captain Planet](http://en.wikipedia.org/wiki/Captain_Planet)^([9](#chapter-4.xhtml_fn4_9)),\
    \ you [may](http://en.wikipedia.org/wiki/Planeteer#Kwame \"Earth!\")^([10](#chapter-4.xhtml_fn4_10))\
    \ [have](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\")^([11](#chapter-4.xhtml_fn4_11))\
    \ [to](http://en.wikipedia.org/wiki/Planeteer#Linka \"Wind!\")^([12](#chapter-4.xhtml_fn4_12))\
    \ [look](http://en.wikipedia.org/wiki/Planeteer#Gi \"Water!\")^([13](#chapter-4.xhtml_fn4_13))\
    \ [elsewhere](http://en.wikipedia.org/wiki/Planeteer#Ma-Ti \"Heart!\")^([14](#chapter-4.xhtml_fn4_14)).\
    \ If you want to learn how to combine CSS and jQuery to create a graph that illustrates\
    \ our impending doom at the hands of a growing army of zombies who prefer bronzer\
    \ over brains, then read on.\n\nThe first thing to do is style our table with\
    \ some basic CSS. This is a nice safety net for people who haven't enabled JavaScript\
    \ in their browser.\n\n[![screenshot](images/graph-tut-image-02.jpg \"Example\
    \ 2: Markup with CSS (no JavaScript)\")](http://provide.smashingmagazine.com/graph_tut_files/ex_02.html)\n\
    \n### Getting Started In jQuery\n\nWe'll use jQuery to create our graph on the\
    \ fly, separate from the original data table. To do this, we need to get the data\
    \ out of the table and store it in a more usable format. Then, we can add to our\
    \ document new elements that use this data in order to construct our graph.\n\n\
    Let's get started by creating our main `createGraph()` function. I've abbreviated\
    \ some of the inner workings of this function so that you get a clearer picture\
    \ of the structure. Don't forget: you can always refer to the source code that\
    \ comes with this tutorial.\n\nHere's our basic structure:\n\n```\n// Wait for\
    \ the DOM to load everything, just to be safe\n$(document).ready(function() {\n\
    \n   // Create our graph from the data table and specify a container to put the\
    \ graph in\n   createGraph('#data-table', '.chart');\n\n   // Here be graphs\n\
    \   function createGraph(data, container) {\n      // Declare some common variables\
    \ and container elements\n      …\n\n      // Create the table data object\n \
    \     var tableData = {\n         …\n      }\n\n      // Useful variables to access\
    \ table data\n      …\n\n      // Construct the graph\n      …\n\n      // Set\
    \ the individual heights of bars\n      function displayGraph(bars) {\n      \
    \   …\n      }\n\n      // Reset the graph's settings and prepare for display\n\
    \      function resetGraph() {\n         …\n         displayGraph(bars);\n   \
    \   }\n\n      // Helper functions\n      …\n\n      // Finally, display the graph\
    \ via reset function\n      resetGraph();\n   }\n});\n```\n\nWe pass two parameters\
    \ to this function:\n\n•The `data`, in the form of a `table` element;\n\n•A `container`\
    \ element, where we'd like to place our graph in the document.\n\nNext up, we'll\
    \ declare some variables to manage our data and container elements, plus some\
    \ timer variables for animation. Here's the code:\n\n```\n// Declare some common\
    \ variables and container elements\nvar bars = [];\nvar figureContainer = $('<div\
    \ id=\"figure\"></div>');\nvar graphContainer = $('<div class=\"graph\"></div>');\n\
    var barContainer = $('<div class=\"bars\"></div>');\nvar data = $(data);\nvar\
    \ container = $(container);\nvar chartData;\nvar chartYMax;\nvar columnGroups;\n\
    \n// Timer variables\nvar barTimer;\nvar graphTimer;\n```\n\nNothing too exciting\
    \ here, but these will be very useful later.\n\n### Getting The Data\n\nBesides\
    \ simply displaying the data, a good bar chart should have a nice big title, clearly\
    \ labelled axes and a color-coded legend. We'll need to strip the data out of\
    \ the table and format it in a way that is more meaningful in a graph. To do that,\
    \ we'll create a JavaScript object that stores our data in handy little functions.\
    \ Let's give birth to our `tableData{}` object:"
