    ```


    So, for 512 numbers, that would be 1023 characters or 2 KB, since [JavaScript
    uses UTF-16](http://es5.github.com/#x4.3.16)^([4](#chapter-8.xhtml_fn8_4)). If
    you go with the boolean method, it''s even worse:


    ```

