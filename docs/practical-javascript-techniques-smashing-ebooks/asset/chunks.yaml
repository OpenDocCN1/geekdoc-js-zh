    \ {\n\tdate = (date instanceof Date? date : new Date( Date.parse(date) ) );\n\t\
    var display = date.getDate() + ' ' +\n\t\t\t\t\t\t\t\t['January', 'February',\
    \ 'March',\n\t\t\t\t\t\t\t\t 'April', 'May', 'June', 'July',\n\t\t\t\t\t\t\t\t\
    \ 'August', 'September', 'October',\n\t\t\t\t\t\t\t\t 'November', 'December'][date.getMonth()]\
    \ + ' ' +\n\t\t\t\t\t\t\t\tdate.getFullYear();\n\treturn display;\n}\n```\n\n\
    The code above does the following:\n\n•Within the `postSuccess` function we clear\
    \ the form values and call `displayComment`.\n\n•`displayComment` first calls\
    \ the `createComment` function to create the list item (`<li>`) HTML as a `String`.\n\
    \n•We then convert the HTML to a jQuery object using `$(commentHtml)` and hide\
    \ the element.\n\n•The comment list item is then prepended to the comments ordered\
    \ list (`<ol>`). The list also has a class called *has-comments* added to it so\
    \ we can hide the first list item which contains the \"Be the first to comment\"\
    \ statement.\n\n•Finally, we call `commentEl.slideDown()` so that the comment\
    \ is shown in what is becoming the standard \"here's a new item\" way.\n\nThe\
    \ functionality is now implemented but we want to test it out. This can be achieved\
    \ in two ways:\n\n•The `displayComment` is a global function so we can call it\
    \ directly using the JavaScript console of the browser.\n\n•We can bind to an\
    \ event on the page that triggers a fake update which calls the `displayComment`\
    \ function\n\nLet's go with the latter and bind to the *\"u\"* key being released\
    \ by binding to the `keyup` event. When it is, we'll create a fake `data` object\
    \ containing all the information required to create a new comment and pass it\
    \ to the `displayComment` function. That comment will then be displayed in the\
    \ UI.\n\nHit the *\"u\"* key a few times and see the comments appear.\n\n```\n\
    $(function() {\n\n\t$(document).keyup(function(e) {\n\t\te = e || window.event;\n\
    \t\tif(e.keyCode === 85){\n\t\t\tdisplayComment({\n\t\t\t\t\"id\": \"comment_1\"\
    ,\n\t\t\t\t\"comment_post_ID\": 1,\n\t\t\t\t\"date\":\"Tue, 21 Feb 2012 18:33:03\
    \ +0000\",\n\t\t\t\t\"comment\": \"The realtime Web rocks!\",\n\t\t\t\t\"comment_author\"\
    : \"Phil Leggetter\"\n\t\t\t});\n\t\t}\n\t});\n\n});\n```\n\nGreat! We now know\
    \ that our `displayComment` function works exactly as we expect it to. **Remember\
    \ to remove the test function** before you go live or you'll really confuse your\
    \ user every time they press *\"u\"*.\n\n![Screenshot of a bunch of fake comments](images/fake_comments1.png)\n\
    \n#### Detect and Responding to the AJAX request\n\nAll that's left to do is update\
    \ the *post_comment.php* file to detect the AJAX call and return information about\
    \ the newly created comment.\n\nDetecting the AJAX request is done by checking\
    \ for the `X-Requested-With` header:\n\n```\n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH'\
    \ ] === 'XMLHttpRequest');\n```\n\nOnce we know the request is an AJAX request\
    \ we can update the code to respond with an appropriate status code and the data\
    \ representing the comment. We also need to ensure that the original functionality\
    \ is maintained. The *post_comment.php* code now looks as follows:"
