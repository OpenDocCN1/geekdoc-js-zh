  trans: "\n\n![](img/cover-image.png)\n\n![书籍封面](img/cover-image.png)\n\n# 版权信息\n\
    \n© 2013 Smashing Media GmbH, 德国弗兰克福\n\nISBN: 978-3-943075-5（版本 1：2013 年 2 月）\n\
    \n封面设计：Ricardo Gimenes\n\n宣传：Stephan Poppe\n\n电子书策略与编辑：Vitaly Friedman\n\n技术编辑：Cosima\
    \ Mielke\n\n规划与质量控制：Vitaly Friedman, Iris\n\n工具：Elja Friedman\n\n语法高亮：Lea Verou\n\
    \n文案：Lucy Leiderman\n\n创意与概念：Smashing Media\n\n## 关于本书\n\n在数百万网站网站存在并日益普及的今天，JavaScript\
    \ 是所有程序员、设计师和编码爱好者的必备且实用的工具。《实用的 JavaScript 技巧》提供了适用于所有水平的专家指导和技巧。学习交互式 CSS、如何利用\
    \ JavaScript 的各种功能，甚至如何构建基于 JavaScript 的体验。无论你是在完善 Web 设计还是编写插件，这份重要资源都是必不可少的。\n\
    \n## 目录\n\n- 版权信息\n- 开发独特的 CSS/JS Web 作品集 —— *Daniel Sternlicht*\n- 解构五个实用的 CSS/jQuery\
    \ 技巧 —— *Jon Raasch*\n- 使用 HTML、CSS 和 jQuery 创建动画条形图 —— *Derek Mack*\n- 初学者 jQuery\
    \ 与 API 指南 —— *Ben Howdle*\n- 如何构建实时评论系统 —— *Phil Leggetter*\n- WordPress 无冲突\
    \ JavaScript 与 CSS 指南 —— *Peter Wilson*\n- 使用 JavaScript 优化长列表 —— *Lea Verou*\n\
    - 建立 CSS 与 JavaScript 之间的关系 —— *Tim Wright*\n- 关于作者\n\n# 开发独特的 CSS/JS Web 作品集\n\
    \nDaniel Sternlicht\n\n对于任何想要在 Web 上立足的设计师或开发者来说，作品集都是必不可少的。它应该尽可能独特，通过一些 HTML、CSS\
    \ 和 JavaScript，你可以创建一个能够向潜在客户展示你的作品集。在本章中，我将向你展示如何创建我的 2D Web 作品集。\n\n![Daniel\
    \ Sternlicht 作品集](img/1.png)\n\n*[Daniel Sternlicht 的 2D Web 作品集](http://danielsternlicht.com)。*\n\
    \n在进入正题之前，我们来谈谈作品集。\n\n作品集是 Web 设计师和开发者展示技能的伟大工具。和任何项目一样，花些时间开发作品集并对 Web 设计行业进行一些研究，以便作品集能够呈现出一个时尚、创新且富有灵感的形象。同时请记住，随大流并不是脱颖出的最佳方法。\n\
    \n在深入研究我的 Web 作品集的秘密之前，最后一点：我使用了 `jQuery`，它通过加速开发和保持代码简洁让我的生活变得简单得多。\n\n现在，让我们动手写代码。\n\
    \n### HTML\n\n让我们通过概述一些非常基础 HTML 代码来热身。我知道这有点长，但我们一步步来。\n\n```\n<div id=\"wrapper\"\
    >\n\n    <hgroup id=\"myInfo\">\n        <h1>DANIEL STERNLICHT</h1>\n        <h2>Web\
    \ 设计师，前端开发者</h2>\n    </hgroup>\n\n    <div id=\"startCave\" class=\"cave\"></div>\n\
    \    <div id=\"startCaveHole\" class=\"caveHole\"></div>\n\n    <div id=\"mainRoad\"\
    \ class=\"road\"></div>\n    <div id=\"leftFence\"></div>\n    <div id=\"rightFence\"\
    ></div>\n\n    <div id=\"daniel\"></div>\n\n    <div id=\"aboutRoad\" class=\"\
    road side\"></div>\n    <div id=\"aboutHouse\" class=\"house\">\n        <div\
    \ class=\"door\"></div>\n        <div class=\"lightbox\">...</div>\n    <div id=\"\
    aboutSign\" class=\"sign\">\n        <span>关于我</span>\n    </div>\n\n    …\n\n\
    \    …\n\n    <div id=\"rightTrees\" class=\"trees\"></div>\n    <div id=\"leftGrass\"\
    \ class=\"grass\"></div>\n\n    <div id=\"endSea\" class=\"sea\"></div>      \
    \   \n    <div id=\"endBridge\" class=\"bridge\"></div>\n\n    <div id=\"boat\"\
    \ class=\"isMoored\">\n        <div class=\"meSail\"></div>\n    </div>\n\n</div>\n\
    ```\n\nHTML 并不复杂，我本可以为这个游戏使用 [HTML5 canvas](http://sixrevisions.com/html/canvas-element/)\
    \ 元素，但我觉得使用简单的 HTML DOM 元素更舒服。\n\n基本上，我们有一个主 `#wrapper` div，它包含了游戏元素，其中大部分元素表示为\
    \ div 元素（我选择 div 是因为它们很容易操作）。\n\n[快速查看我的游戏](http://danielsternlicht.com)。\n\n\
    ![游戏视图](img/2.png)\n\n*游戏视图*\n\n我们有道路、树、栅栏、水、房屋等等。回到 HTML。\n\n### CSS\n\n首先，请注意我们为每个元素准备的\
    \ CSS。例如，我为 `.road` 类定义的 CSS 样式如下：\n\n```css\n.road {\n   position: absolute;\n\
    \   background: url(images/road.png) repeat;\n}\n```\n\n以树作为另一个例子：\n\n```\n.trees\
    \ {\n   position: absolute;\n   background: url(images/tree.png) repeat 0 0;\n\
    }\n```\n\n注意，几乎所有的元素都是绝对定位的。为了我们的目的，相对定位是不可能的，特别是考虑到响应式最小宽度为 640 像素。我们可以为 `#wrapper`\
    \ 编写一个通用规则：\n\n```css\n#wrapper * {\n   position: absolute;\n}\n```\n\n关于 CSS\
    \ 的最后几句话。游戏中的动画是通过 **CSS 过渡和动画** 完成的，除了某些功能如灯箱效果和玩家传送。这样做有两个原因。\n\n首先，作品集的目的之一是展示创新和现代开发，什么比使用\
    \ CSS3 更具创新呢？\n\n第二个原因是性能。在读了 Richard Bradshaw 非常精彩的文章“[CSS3 过渡、变换和动画](http://css3.bradshawenterprises.com/)”后，得压倒性的结论：尽可能使用\
    \ CSS3。\n\n作品集中 CSS3 动画的一个很好的例子是水的运动模式。CSS 看起来是这样的：\n\n```css\n.sea {\n   left:\
    \ 0;\n   width: 100%;\n   height: 800px;\n   background: url(images/sea.png) repeat\
    \ 0 0;\n   -webkit-animation: seamove 6s linear infinite;    /* Webkit 支持 */\n\
    \   -moz-animation: seamove 6s linear infinite;      /* Firefox 支持 */\n   animation:\
    \ seamove 6s linear infinite;          /* 未来浏览器支持 */\n}\n```\n\n这里是动画本身的代码：\n\n\
    ```css\n/* Webkit 支持 */\n@-webkit-keyframes seamove {\n   0% {\n      background-position:\
    \ 0 0;\n   }\n   100% {\n      background-position: 65px 0;\n   }\n}\n\n@-moz-keyframes\
    \ seamove {…}   /* Firefox 支持 */\n@keyframes seamove {…}       /* 未来浏览器支持 */\n\
    ```\n\n"
- fmt: "\nThe repeating `sea.png` image is 65 pixels wide, so to give the sea a waving\
    \ effect, we should move it by the same number of pixels. Because the background\
    \ is repeating, it gives us the effect we want.\n\nAnother cool example of CSS3\
    \ animations happens when the player steps into the boat and sails off the screen.\n\
    \n[![Boat sails](images/4.png)](http://media.smashingmagazine.com/wp-content/uploads/2012/04/4.png)\n\
    \n*The boat sails off the screen, revealing the “Contact” section.*\n\nIf the\
    \ player gets back onto the road, you'll notice that the boat moves in “reverse,”\
    \ back to its original position. It sounds complicated, but you have no idea how\
    \ easy it is with CSS3 transitions. All I did was capture the event with JavaScript\
    \ to determine whether the user is “on board.” If the user is, then we add the\
    \ class `.sail` to the boat element, which make it sail off; otherwise, we withhold\
    \ this class. At the same time, we add a `.show` class to the `#contact` wrapper,\
    \ which smoothly reveals the contact form in the water. The CSS of the boat looks\
    \ like this:\n\n```\n#boat {\n   position: absolute;\n   bottom: 500px;\n   left:\
    \ 50%;\n   margin-left: -210px;\n   width: 420px;\n   height: 194px;\n   background:\
    \ url(images/boat.png) no-repeat center;\n   -webkit-transition: all 5s linear\
    \ 1.5s;\n   -moz-transition: all 5s linear 1.5s;\n   transition: all 5s linear\
    \ 1.5s;\n}\n```\n\nWhen we add the class `.sail` to it, all I'm doing is changing\
    \ its `left` property.\n\n```\n#boat.sail {\n   left: -20%;\n}\n```\n\nThe same\
    \ goes for the `#contact` wrapper with the class `.show`. Except here, I'm playing\
    \ with the `opacity` property:\n\n```\n#contact.show {\n   opacity: 1;\n}\n```\n\
    \nCSS3 transitions do the rest of the work.\n\n## The JavaScript\n\nBecause we\
    \ are dealing with a 2-D game, we might want to base it on a JavaScript game engine,\
    \ perhaps an existing framework. But the thing about frameworks (excluding jQuery,\
    \ which I'm using as a base) is that they are usually good for a head start, but\
    \ they probably won't fit your needs in the long run.\n\nA good example is the\
    \ lightboxes in my portfolio, which provide information about me and are activated\
    \ when the user enters a house.\n\n[![An example of a lightbox in the game](images/5.png)](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)\n\
    \n*An example of a lightbox in the game. ([Large image](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)^([6](#chapter-2.xhtml_fn2_6)))*\n\
    \nThis kind of functionality doesn't exist in a regular JavaScript game engine.\
    \ You could always improve an existing framework with your own code, but diving\
    \ into someone else's code sometimes takes longer than writing your own. Moreover,\
    \ if you rewrite someone else's code, it could become a problem when a new version\
    \ is released.\n\nAfter passing over libraries such as [Crafty](http://craftyjs.com/)^([7](#chapter-2.xhtml_fn2_7)),\
    \ [LimeJS](http://www.limejs.com/)^([8](#chapter-2.xhtml_fn2_8)) and [Impact](http://impactjs.com/)^([9](#chapter-2.xhtml_fn2_9)),\
    \ which really are great game engine frameworks, I felt I had no choice but to\
    \ build my own engine to fit my needs.\n\nLet's quickly review the main methods\
    \ that I'm running in the game.\n\nTo handle the keyboard arrow events, I use\
    \ the following code:\n\n```\n$(window).unbind('keydown').bind('keydown', function(event)\
    \ {\n    switch (event.keyCode) {\n        event.preventDefault();\n        case\
    \ 37: // Move Left                                                           \
    \    \n            me.moveX(me.leftPos - 5, 'left');\n        break;\n\n     \
    \   case 39: // Move Right\n            me.moveX(me.leftPos + 5, 'right');\n \
    \       break;\n\n        case 38: // Move Up\n            me.moveY(me.topPos\
    \ - 5, 'up');\n        break;\n\n        case 40: // Move Down\n            me.moveY(me.topPos\
    \ + 5, 'down');\n        break;\n    }\n});\n```\n\nAs you can see, the code is\
    \ very simple. When the user presses the up or down arrow, I call the `moveY()`\
    \ function, and when they press right or left, I call `moveX()`.\n\nA quick peek\
    \ at one of them reveals all the magic:\n\n```\nmoveX: function(x, dir) {\n  \
    \  var player = this.player;\n    var canMove = this.canImove(x, null);      \
    \     \n    if(canMove){\n        this.leftPos = x;\n        player.animate({'left':\
    \ x + 'px'}, 10);\n    }\n    if(dir == 'left') {\n        this.startMoving('left',\
    \ 2);\n    }\n    else {\n        this.startMoving('right', 3);\n    }\n}\n```\n\
    \nThe repeating `sea.png` image is 65 pixels wide, so to give the sea a waving\
    \ effect, we should move it by the same number of pixels. Because the background\
    \ is repeating, it gives us the effect we want.\n\nAnother cool example of CSS3\
    \ animations happens when the player steps into the boat and sails off the screen.\n\
    \nThe boat sails off the screen, revealing the “Contact” section.\n\n... (Note:\
    \ The remaining text provided in the \"以下是需要排版的文本\" section seems to be repetitive\
    \ or fragments of the logic above. I have processed the primary narrative flow\
    \ according to your rules).\n"
  raw: "The repeating `sea.png` image is 65 pixels wide, so to give the sea a waving\
    \ effect, we should move it by the same number of pixels. Because the background\
    \ is repeating, it gives us the effect we want.\n\nAnother cool example of CSS3\
    \ animations happens when the player steps into the boat and sails off the screen.\n\
    \n[![Boat sails](images/4.png)](http://media.smashingmagazine.com/wp-content/uploads/2012/04/4.png)\n\
    \n*The boat sails off the screen, revealing the “Contact” section.*\n\nIf the\
    \ player gets back onto the road, you'll notice that the boat moves in “reverse,”\
    \ back to its original position. It sounds complicated, but you have no idea how\
    \ easy it is with CSS3 transitions. All I did was capture the event with JavaScript\
    \ to determine whether the user is “on board.” If the user is, then we add the\
    \ class `.sail` to the boat element, which make it sail off; otherwise, we withhold\
    \ this class. At the same time, we add a `.show` class to the `#contact` wrapper,\
    \ which smoothly reveals the contact form in the water. The CSS of the boat looks\
    \ like this:\n\n```\n#boat {\n   position: absolute;\n   bottom: 500px;\n   left:\
    \ 50%;\n   margin-left: -210px;\n   width: 420px;\n   height: 194px;\n   background:\
    \ url(images/boat.png) no-repeat center;\n   -webkit-transition: all 5s linear\
    \ 1.5s;\n   -moz-transition: all 5s linear 1.5s;\n   transition: all 5s linear\
    \ 1.5s;\n}\n```\n\nWhen we add the class `.sail` to it, all I'm doing is changing\
    \ its `left` property.\n\n```\n#boat.sail {\n   left: -20%;\n}\n```\n\nThe same\
    \ goes for the `#contact` wrapper with the class `.show`. Except here, I'm playing\
    \ with the `opacity` property:\n\n```\n#contact.show {\n   opacity: 1;\n}\n```\n\
    \nCSS3 transitions do the rest of the work.\n\n### The JavaScript\n\nBecause we\
    \ are dealing with a **2-D game**, we might want to base it on a JavaScript game\
    \ engine, perhaps an existing framework. But the thing about frameworks (excluding\
    \ jQuery, which I'm using as a base) is that they are usually good for a head\
    \ start, but they probably won't fit your needs in the long run.\n\nA good example\
    \ is the lightboxes in my portfolio, which provide information about me and are\
    \ activated when the user enters a house.\n\n[![An example of a lightbox in the\
    \ game](images/5.png)](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)\n\
    \n*An example of a lightbox in the game. ([Large image](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)^([6](#chapter-2.xhtml_fn2_6)))*\n\
    \nThis kind of functionality doesn't exist in a regular JavaScript game engine.\
    \ You could always improve an existing framework with your own code, but diving\
    \ into someone else's code sometimes takes longer than writing your own. Moreover,\
    \ if you rewrite someone else's code, it could become a problem when a new version\
    \ is released.\n\nAfter passing over libraries such as [Crafty](http://craftyjs.com/)^([7](#chapter-2.xhtml_fn2_7)),\
    \ [LimeJS](http://www.limejs.com/)^([8](#chapter-2.xhtml_fn2_8)) and [Impact](http://impactjs.com/)^([9](#chapter-2.xhtml_fn2_9)),\
    \ which really are great game engine frameworks, I felt I had no choice but to\
    \ build my own engine to fit my needs.\n\nLet's quickly review the main methods\
    \ that I'm running in the game.\n\nTo handle the keyboard arrow events, I use\
    \ the following code:\n\n```\n$(window).unbind('keydown').bind('keydown', function(event)\
    \ {\n    switch (event.keyCode) {\n        event.preventDefault();\n        case\
    \ 37: // Move Left                                                           \
    \    \n            me.moveX(me.leftPos - 5, 'left');\n        break;\n\n     \
    \   case 39: // Move Right\n            me.moveX(me.leftPos + 5, 'right');\n \
    \       break;\n\n        case 38: // Move Up\n            me.moveY(me.topPos\
    \ - 5, 'up');\n        break;\n\n        case 40: // Move Down\n            me.moveY(me.topPos\
    \ + 5, 'down');\n        break;\n    }\n});\n```\n\nAs you can see, the code is\
    \ very simple. When the user presses the up or down arrow, I call the `moveY()`\
    \ function, and when they press right or left, I call `moveX()`.\n\nA quick peek\
    \ at one of them reveals all the magic:\n\n```\nmoveX: function(x, dir) {\n  \
    \  var player = this.player;\n    var canMove = this.canImove(x, null);      \
    \     \n    if(canMove){\n        this.leftPos = x;\n        player.animate({'left':\
    \ x + 'px'}, 10);\n    }\n    if(dir == 'left') {\n        this.startMoving('left',\
    \ 2);\n    }\n    else {\n        this.startMoving('right', 3);\n    }\n}\n```\n\
    \nAt each step the player takes, I check with a special method named `canImove()`\
    \ (i.e. “Can I move?”) to determine whether the character may move over the game\
    \ canvas. This method include screen boundaries, house positions, road limits\
    \ and so on, and it gets two variables, including the x and y coordinates of where\
    \ I want the player to move to. In our example, if I wanted the player to move\
    \ left, I'd pass to the method their current left position plus 5 pixels. If I\
    \ wanted them to move right, I'd pass its current position minus 5 pixels.\n\n\
    If the character “can move,” I return `true`, and the character keeps moving;\
    \ or else, I return `false`, and the character remains in their current position.\n\
    \nNote that in the `moveX()` method, I'm also checking the direction in which\
    \ the user wants to go, and then I call a method named `startMoving()`:\n\n```\n\
    if(dir == 'left') {\n   this.startMoving('left', 2);\n}\nelse {\n   this.startMoving('right',\
    \ 3);\n}\n```\n\nYou're probably wondering how the walking effect on the character\
    \ is achieved. You might have noticed that I'm using CSS sprites. But how do I\
    \ activate them? It's actually quite simple, with the help of a jQuery plugin\
    \ called [Spritely](http://www.spritely.net/)^([10](#chapter-2.xhtml_fn2_10)).\
    \ This amazing plugin enables you to animate CSS sprites simply by calling the\
    \ method on the relevant element and passing it your properties (such as the number\
    \ of frames).\n\nBack to our `startMoving()` method:\n\n```\nstartMoving: function(dir,\
    \ state) {\n   player.addClass(dir);\n   player.sprite({fps: 9, no_of_frames:\
    \ 3}).spState(state);\n}\n```\n\nI simply add a direction class to the player\
    \ element (which sets the relevant sprite image), and then call the `sprite()`\
    \ method from Spritely's API.\n\nBecause we are dealing with the Web, I figured\
    \ that being able to move with the keyboard arrows would not be enough. You always\
    \ have to think of the user, your client, who might not have time to hang out\
    \ in your world. That is why I added both a navigation bar and an option to “teleport”\
    \ the character to a given point in the game — again, using the `canImove()` method\
    \ to check whether the player may move to this point.\n\nNext we've got the lightboxes.\
    \ Recall what the HTML looks like for each house:\n\n```\n<div id=\"aboutHouse\"\
    \ class=\"house\">\n   <div class=\"door\"></div>\n   <div class=\"lightbox\"\
    >\n      <div class=\"inner about\">\n         Lightbox content goes here…\n \
    \     </div>\n   </div>\n</div>\n```\n\nDid you notice the `.lightbox` class in\
    \ the `house` div? We will use it later. What I basically did was define a “hot\
    \ spot” for each house. When the player gets to one of those hot spots, the JavaScript\
    \ activates the `lightboxInit(elm)` method, which also gets the relevant house's\
    \ ID. This method is very simple:\n\n```\nlightboxInit:  function(elm) {\n   //\
    \ Get the relevant content\n   var content = $(elm).find('.lightbox').html();\n\
    \n   // Create the lightbox\n   $('<div id=\"dark\"></div>').appendTo('body').fadeIn();\n\
    \   $('<div id=\"lightbox\">' + content + '<span id=\"closeLB\">x</span></div>').insertAfter(\"\
    #dark\").delay(1000).fadeIn();\n}\n```\n\nFirst, I get the relevant content by\
    \ finding the `div.lightbox` child of the house element. Then, I create and fade\
    \ in a blank div, named `dark`, which gives me the dark background. Finally, I\
    \ create another div, fill it up with the content (which I had already stored\
    \ in a variable), and insert it right after the dark background. Clicking the\
    \ “x” will call another method that fades out the lightbox and removes it from\
    \ the DOM."
