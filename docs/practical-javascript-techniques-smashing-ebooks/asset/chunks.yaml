    \ to re-write the contents of *Persistence.php*. Here's the code for *post_comment.php*.\n\
    \n```\n<?php\nrequire('Persistence.php');\n\n$db = new Persistence();\nif( $db-&gt;add_comment($_POST)\
    \ ) {\n\theader( 'Location: index.php' );\n}\nelse {\n\theader( 'Location: index.php?error=Your\
    \ comment was not posted due to errors in your form submission' );\n}\n?>\n```\n\
    \nThe above code does the following:\n\n•Includes the *Persistence.php* class\
    \ which handles saving and fetching comments.\n\n•Creates a new instances of the\
    \ `Persistence` object and assigns it to the variable `$db`.\n\n•Tries to add\
    \ the comment to the `$db`. If the comment is successfully added it redirects\
    \ back to the blog post. If it fails the redirection also occurs but some error\
    \ text is appended to an *error* query parameter.\n\n#### Displaying the Comments\
    \ with the Blog Post\n\nThe final thing we need to do to have our Generic Blog\
    \ Commenting System up and running is to update the blog page, *index.php*, to\
    \ fetch and display the comments from the `Persistence` object.\n\n•Since this\
    \ isn't a real blogging system we'll hard code the `$comment_post_ID` value to\
    \ be `1`.\n\n•Include the *Persistence.php* class and fetch the comments from\
    \ it. Comments are associated with a blog post using a unique `$comment_post_ID`.\n\
    \n```\n<?php\nrequire('Persistence.php');\n$comment_post_ID = 1;\n$db = new Persistence();\n\
    $comments = $db-&gt;get_comments($comment_post_ID);\n$has_comments = (count($comments)\
    \ &lt; 0);\n?>\n```\n\nSince we now have the `$comment_post_ID` accessible via\
    \ PHP we should update the HTML for the comment form to use this value.\n\n```\n\
    &lt;input type=\"hidden\" name=\"comment_post_ID\" value=\"<?php echo($comment_post_ID);\
    \ ?>\" id=\"comment_post_ID\" /&gt;\n```\n\nWe now have all the comments related\
    \ to the blog post referenced by the `$comments` variable we need to display them\
    \ on the page. To do this we need to update the PHP in *index.php* to iterate\
    \ through them and create the required HTML.\n\n```\n&lt;ol id=\"posts-list\"\
    \ class=\"hfeed<?php echo($has_comments?' has-comments':''); ?>\"&gt;\n\t<li class=\"\
    no-comments\">Be the first to add a comment.</li>\n\t<?php\n\t\tforeach ($comments\
    \ as $comment) {\n\t\t\t?>\n\t\t\t<li>&lt;article id=\"comment_<?php echo($comment['id']);\
