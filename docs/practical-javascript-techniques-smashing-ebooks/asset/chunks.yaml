    # How To Build A Real-Time Commenting System


    By Phil Leggetter


    The Web has become increasingly interactive over the years. This trend is set
    to continue with the next generation of applications driven by the real-time Web.
    Adding real-time functionality to an application can result in a more interactive
    and engaging user experience. However, setting up and maintaining the server-side
    real-time components can be an unwanted distraction. But don''t worry, there is
    a solution.


    Cloud hosted Web services and APIs have come to the rescue of many a developer
    over the past few years, and real-time functionality is no different. The focus
    at [Pusher](http://pusher.com)^([1](#chapter-6.xhtml_fn6_1)), for example, is
    to let you concentrate on building your real-time Web applications by offering
    a hosted API which makes it quick and easy to add scalable real-time functionality
    to Web and mobile apps. In this tutorial, I''ll show how to convert a basic blog
    commenting system into a real-time engaging experience where you''ll see a comment
    made in one browser window "magically" appear in a second window.


    ## Why Should We Care About The Real-Time Web?


    Although [the Real-Time Web](http://en.wikipedia.org/wiki/Real-time_web)^([2](#chapter-6.xhtml_fn6_2))
    is a relatively recent mainstream phrase, real-time Web technologies have been
    around for over 10 years. They were mainly used by companies building software
    targeted at the financial services sector or in Web chat applications. These initial
    solutions were classed as "hacks". In 2006 these solutions were given an umbrella
    term called [Comet](http://en.wikipedia.org/wiki/Comet_(programming))^([3](#chapter-6.xhtml_fn6_3)),
    but even with a defined name the solutions were still considered hacks. So, what
    is changed?


    ### Social Media Data


    Social media, and specifically Twitter, has meant more data becoming available.
    Earlier solutions to let servers push data to Web browsers were considered "hacks".
    But this didn''t remove the fact that there was a requirement to do this in a
    standardized way.


    ### Increased User Expectations


    As users expected more from Web applications, real-time technologies moved to
    the forefront. This is especially true for Facebook where applications could be
    highly engaging.


    ## WebSockets


    ![HTML5 and WebSockets Rock!](images/HTML5_Logo_256.png "HTML5 Logo")


    Earlier on I stated that previous solutions were "hacks". But our prayers have
    finally been answered with [Sockets](http://pusher.com/websocket)^([5](#chapter-6.xhtml_fn6_5)).
    WebSockets represent a [standardized API](http://www.w3.org/TR/websockets/)^([6](#chapter-6.xhtml_fn6_6))
    and [protocol](http://tools.ietf.org/html/rfc6455)^([7](#chapter-6.xhtml_fn6_7))
    that allows realtime server and client (web browser) two way communication over
    a single connection. Older solutions could only achieve two-way communication
    using two connections so the fact WebSockets use a single connection is actually
    a big deal. It can be a massive resource saving to the server and client, with
    the latter being particularly important for mobile devices where battery power
    is extremely valuable.


    ## How are Real-Time Technologies being used?


    Real-time Web technologies are making it possible to build all sorts of engaging
    functionality, leading to improved user experiences. Here are a handful of common
    use cases:


    - **Realtime Stats**: The technology was first used in finance to show stock exchange
    information so its is no surprise that the technology is now used more than ever.
    It''s also highly beneficial to sports, betting and analytics.

    - **Notifications**: when something a user is interested in becomes available
    or changes.

    - **Activity Streams**: streams of friend or project activity. This is commonly
    seen in apps like Twitter, Facebook, Trello, Quora and many more.

    - **Chat**: the 101 or real-time Web technology but still a very valuable function.
    It helps instant interaction between friends, work colleagues, customers and customer
    service etc.

    - **Collaboration**: Google docs offers this kind of functionality within its
    docs, spreadsheets and drawing applications and we''re going to see similar use
    cases in many more applications.

    - **Multiplayer Games**: The ability to instantly deliver player moves, game state
    changes and score updates is clearly important to multiplayer gaming.

