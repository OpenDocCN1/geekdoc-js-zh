    function theCallbackFunction (elem) {\n\n   'use strict';\n\n   // remove the\
    \ element from the DOM\n   $(elem).remove();\n\n   // log out that the transition\
    \ is done\n   console.log('the transition is complete');\n\n}\n```\n\nIn the browser,\
    \ this should work the same way in IE 7 (on the low end) as it does in mobile\
    \ Safari or Chrome for Mobile (on the high end). The only difference is under\
    \ the hood; the experience never changes for the user. This is a way you can use\
    \ cutting-edge techniques without sacrificing the degraded user experience. It\
    \ also keeps CSS out of your JavaScript, which was really our goal the whole time.\n\
    \n### The Moral Of The Story\n\nYou might be asking yourself why we should even\
    \ bother going through all this work. We wrote about 60 lines of JavaScript to\
    \ accomplish the same design aesthetic that could be created with eight lines\
    \ of jQuery. Well, no one ever said that keeping clean code and sticking to progressive\
    \ enhancement was the easiest thing to do. In fact, it's a lot easier to ignore\
    \ it entirely. But as responsible developers, it's our duty to build applications\
    \ in a way that is accessible and easily scales to the future. If you want to\
    \ go that extra mile and create a seamless user experience as I do, then it's\
    \ well worth the extra time it takes to dot all the i's and cross all the t's\
    \ in a project to create an overall experience that will gracefully degrade and\
    \ progressively enhance.\n\nUsing this model also lets us lean heavily on CSS\
    \ for its strengths, like responsive design and using breakpoints to redefine\
    \ your interaction at the various screen sizes. It also helps if you're specifically\
    \ targeting a device with a constrained bandwidth, because, as we all know, CSS\
    \ is much lighter than JavaScript in both download and execution time. **Being\
    \ able to offload some of the weight JavaScript carries onto CSS is a great benefit.**"
