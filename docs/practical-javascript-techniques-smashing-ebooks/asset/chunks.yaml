  trans: "\n\n- `post_comment.php`\n- `pusher_config.php`\n- `Persistence.php`\n-\
    \ `squeeks-Pusher-PHP` (目录) 包含 `lib` (目录) 以及 `Pusher.php`\n\n只需几行代码即可触发事件：\n\n\
    ```php\n <?php\nrequire('squeeks-Pusher-PHP/lib/Pusher.php');\nrequire('pusher_config.php');\n\
    \n$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n$pusher->trigger('comments-1',\
    \ 'new_comment', array(\n\t\"comment_post_ID\" => 1,\n\t\"date\" => \"Tue, 21\
    \ Feb 2012 18:33:03 +0000\",\n\t\"comment\" => \"The realtime Web rocks!\",\n\t\
    \"comment_author\" => \"Phil Leggetter\"\n));\n?>\n```\n\n然而，在触发事件之前，我们需要应用一些额外的逻辑：\n\
    \n- 检查注释是否已添加。\n- 从 `$added` 数组中提取唯一的注释标识符。\n- 构建文本以识别提交的注释的通道名称。\n- 在带有 `$added`\
    \ 数据的通道上触发 `new_comment` 事件。*注意：库会自动将 `$added` 数组变量转换为 JSON 并通过 Pusher 发送。*\n\n\
    因此，完整的 `post_comment.php` 文件看起来如下：\n\n```php\n <?php\nrequire('Persistence.php');\n\
    require('squeeks-Pusher-PHP/lib/Pusher.php');\nrequire('pusher_config.php');\n\
    \n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH' ] === 'XMLHttpRequest');\n\n$db =\
    \ new Persistence();\n$added = $db->add_comment($_POST);\n\nif($added) {\n\t$channel_name\
    \ = 'comments-' . $added['comment_post_ID'];\n\t$event_name = 'new_comment';\n\
    \n\t$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n\t$pusher->trigger($channel_name,\
    \ $event_name, $added);\n}\n\nif($ajax) {\n\tsendAjaxResponse($added);\n}\nelse\
    \ {\n\tsendStandardResponse($added); \n}\n\nfunction sendAjaxResponse($added)\
    \ {\n\theader(\"Content-Type: application/json\");\n\tif($added) {\n\t\theader(\
    \ 'Status: 201' );\n\t\techo( json_encode($added) );\n\t}\n\telse {\n\t\theader(\
    \ 'Status: 400' );\n\t}\n}\n\nfunction sendStandardResponse($added) {\n\tif($added)\
    \ {\n\t\theader( 'Location: index.php' );\n\t}\n\telse {\n\t\theader( 'Location:\
    \ index.php?error=Your comment was not posted due to errors in your form submission'\
    \ );\n\t}\n}\n?> \n```\n\n如果你现在在两个不同的浏览器窗口中运行该程序，你会发现一旦在一个窗口中提交注释，该注释就会立即（“魔法般地”）出现在另一个窗口中。**我们现在拥有了一个实时评论系统！**\n\
    \n**但是……**，我们还没有完全完成。你还会看到注释在提交它的用户的窗口中显示了两次。这是因为注释既通过 AJAX 回调添加了，又通过 Pusher 事件添加了。由于这是一个非常常见的情景，特别是如果你像我们这样以渐进增强的方式构建了应用程序，Pusher\
    \ 服务器库提供了一种[排除某个连接/用户](http://pusher.com/docs/publisher_api_guide/publisher_excluding_recipients)^(27)\
    \ 避免通过 Pusher 接收事件的方法。\n\n为了实现这一点，你需要从客户端向服务器发送一个名为 `socket_id` 的唯一连接标识符。该标识符随后可以用来定义谁将被排除。\n\
    \n```javascript\nfunction handleSubmit() {\n\tvar form = $(this);\n\tvar data\
    \ = {\n\t\t\"comment_author\": form.find('#comment_author').val(),\n\t\t\"email\"\
    : form.find('#email').val(),\n\t\t\"comment\": form.find('#comment').val(),\n\t\
    \t\"comment_post_ID\": form.find('#comment_post_ID').val()\n\t};\n\n\tvar socketId\
    \ = getSocketId();\n\tif(socketId !== null) {\n\t\tdata.socket_id = socketId;\n\
    \t}\n\n\tpostComment(data);\n\n\treturn false;\n}\n\nfunction getSocketId() {\n\
    \tif(pusher && pusher.connection.state === 'connected') {\n\t\treturn pusher.connection.socket_id;\n\
    \t}\n\treturn null;\n}\n```\n\n我们所做的更改：\n\n- 添加了一个名为 `getSocketId` 的新函数来获取 `socket_id`。它封装了一个检查，以确保\
    \ `pusher` 变量已设置且客户端已连接到 Pusher。\n- 更新了 `handleSubmit` 以检查是否有可用的 `socket_id`。如果有，此信息将连同注释数据一起发送到服务器。\n\
    \n在服务器端，如果存在 `socket_id` 参数，我们需要使用它并因此排除提交注释的连接和用户，否则传入 `null`：\n\n```php\n $channel_name\
    \ = 'comments-' . $added['comment_post_ID'];\n$event_name = 'new_comment';\n$socket_id\
    \ = (isset($added['socket_id'])) ? $added['socket_id'] : null;\n\n$pusher = new\
    \ Pusher(APP_KEY, APP_SECRET, APP_ID);\n$pusher->trigger($channel_name, $event_name,\
    \ $added);\n```\n\n上面的代码检查了 `console` 和 `log` 函数是否可用（在旧版浏览器中不存在），并将带有时间戳的消息到到\
    \ 控制台。这对于追踪问题非常有帮助。\n\n### 实时开发\n\n当你开始编写大量的 JavaScript 时，浏览器开发者工具将成为你的朋友。我想分享一些实用的提示。所有主流浏览器厂商现在都提供了包含控制台的开发者工具：\n\
    \n字体 Firefox 的 [Firebug 插件](http://getfirebug.com/)^(30)\n- [Google Chrome 开发者工具](http://code.google.com/chrome/devtools/docs/overview.html)^(31)\n\
    - [Internet Explorer F12 开发者工具](https://msdn.microsoft.com/en-us/library/gg589507(v=VS.85).aspx)^(32)\n\
    - Opera [Dragonfly](http://www.opera.com/dragonfly/documentation/)^(33)\n- [Safari\
    \ 开发者工具](https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools)\n\
    \n#### 使用浏览器开发者工具\n\nPusher JavaScript 库提供了一种挂钩日志功能的方法。你只需要将函数赋值给 [`Pusher.log`](http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log)^(35)\
    \ 静态属性。该函数将接收所有的日志消息。你可以在函数内执行任何操作，但最佳实践是将消息记录到开发者控制台。你可以像这样这样做，确保代码在包含 Pusher\
    \ JavaScript 库之后执行：\n\n```javascript\nPusher.log = function(msg) {\n\tif(window.console\
    \ && window.console.log) {\n\t\twindow.console.log(new Date().getTime() + ': '\
    \ + msg);\n\t}\n};\n```\n\n"
- fmt: "\nAny good real-time technology will maintain a persistent connection between\
    \ the client (web browser) and the Web server or service. Sometimes the client\
    \ will lose connectivity and when the client isn't connected to the Internet the\
    \ real-time functionality won't work. This can happen a lot with applications\
    \ running on mobile devices which rely on mobile networks. So, if your application\
    \ relies on that connectivity and functionality then it's important to deal with\
    \ scenarios where the client isn't connected. This might be by displaying a message\
    \ to tell the user they are offline or you might want to implement some alternative\
    \ functionality.\n\nThe Pusher JavaScript library exposes [connectivity state](http://pusher.com/docs/connection_states)^([36](#chapter-6.xhtml_fn6_36))\
    \ via the `pusher.connection` object, which we briefly saw earlier when fetching\
    \ the `socket_id`. Binding to state changes and implementing your required functionality\
    \ is quite simple as it follows the same mechanism as binding to events on channels:\n\
    \n```\nvar pusher = new Pusher(APP_KEY);\npusher.connection.bind('state_change',\
    \ function(states) {\n\tPusher.log('Connection state changed from: ' + states.previous\
    \ + ' to ' + states.current);\n}); \n```\n\n### Conclusion\n\nWe're seeing real-time\
    \ functionality appearing in a large number of high profile applications: some\
    \ have it at the core of what they offer whilst others use it sparingly. No matter\
    \ how it is used the end goal is generally the same; to enhance the user experience\
    \ and keep users engaged with an application. By converting a basic blog commenting\
    \ system into a more engaging communication platform I hope I've demonstrated\
    \ that the functionality and experience can easily be layered on existing application.\n\
    \nThe ease of access to this technology is a relatively new thing and we've only\
    \ just touched the potential uses for the technology. Real-time stats, instant\
    \ news updates, activity streams, social interaction, collaboration and gaming\
    \ are just a few common uses but as more developers become aware of, and comfortable\
    \ with, the technology I'm confident that we're going to see some truly amazing\
    \ innovation. An \"Internet of Real-Time Things?\"?\n\n—\n\n1.[http://pusher.com](http://pusher.com)\n\
    \n2.[http://en.wikipedia.org/wiki/Real-time_web](http://en.wikipedia.org/wiki/Real-time_web)\n\
    \n3.[http://en.wikipedia.org/wiki/Comet_(programming)](http://en.wikipedia.org/wiki/Comet_(programming))\n\
    \n4.[http://en.wikipedia.org/wiki/Publish%E2%80%93subscribe_pattern](http://en.wikipedia.org/wiki/Publish%E2%80%93subscribe_pattern)\n\
    \n5.[http://pusher.com/websocket](http://pusher.com/websocket)\n\n6.[http://www.w3.org/TR/websockets/](http://www.w3.org/TR/websockets/)\n\
    \n7.[http://tools.ietf.org/html/rfc6455](http://tools.ietf.org/html/rfc6455)\n\
    \n8.[https://github.com/pusher/realtime-commenting/zipball/start](https://github.com/pusher/realtime-commenting/zipball/start)\n\
    \n9.[http://coding.smashingmagazine.com/2009/08/04/designing-a-html-5-layout-from-scratch/](http://coding.smashingmagazine.com/2009/08/04/designing-a-html-5-layout-from-scratch/)\n\
    \n10.[https://github.com/pusher/realtime-commenting/blob/start/index.php](https://github.com/pusher/realtime-commenting/blob/start/index.php)\n\
    \n11.[https://github.com/pusher/realtime-commenting/blob/start/Persistence.php](https://github.com/pusher/realtime-commenting/blob/start/Persistence.php)\n\
    \n12.[https://github.com/pusher/realtime-commenting/zipball/basic](https://github.com/pusher/realtime-commenting/zipball/basic)\n\
    \n13.[http://www.leggetter.co.uk/2012/02/19/jquery-dont-always-use.html](http://www.leggetter.co.uk/2012/02/19/jquery-dont-always-use.html)\n\
    \n14.[http://www.leggetter.co.uk/2012/02/12/considerations-when-updating-the-dom-to-realtime-data.html](http://www.leggetter.co.uk/2012/02/12/considerations-when-updating-the-dom-to-realtime-data.html)\n\
    \n15.[http://www.learningjquery.com/2010/03/detecting-ajax-events-on-the-server](http://www.learningjquery.com/2010/03/detecting-ajax-events-on-the-server)\n\
    \n16.[http://coding.smashingmagazine.com/2012/02/09/beginners-guide-json-api-clients/](http://coding.smashingmagazine.com/2012/02/09/beginners-guide-json-api-clients/)\n\
    \n17.[http://pusher.com/docs/rest_libraries](http://pusher.com/docs/rest_libraries)\n\
    \n18.[http://pusher.com/docs/client_libraries](http://pusher.com/docs/client_libraries)\n\
    \n19.[http://pusher.com/signup](http://pusher.com/signup)\n\n20.[http://pusher.com/docs/channels](http://pusher.com/docs/channels)\n\
    \n21.[http://pusher.com/docs/client_api_guide/client_events](http://pusher.com/docs/client_api_guide/client_events)\n\
    \n22.[http://pusher.com/docs/rest_libraries](http://pusher.com/docs/rest_libraries)\n\
    \n23.[http://pusher.com/docs/private_channels](http://pusher.com/docs/private_channels)\n\
    \n24.[http://pusher.com/docs/presence](http://pusher.com/docs/presence)\n\n25.[https://github.com/squeeks/Pusher-PHP](https://github.com/squeeks/Pusher-PHP)\n\
    \n26.[https://github.com/squeeks/Pusher-PHP/zipball/master](https://github.com/squeeks/Pusher-PHP/zipball/master)\n\
    \n27.[http://pusher.com/docs/publisher_api_guide/publisher_excluding_recipients](http://pusher.com/docs/publisher_api_guide/publisher_excluding_recipients)\n\
    \n28.[http://www.leggetter.co.uk/pusher/realtime-commenting/](http://www.leggetter.co.uk/pusher/realtime-commenting/)\n\
    \n29.[https://github.com/pusher/realtime-commenting](https://github.com/pusher/realtime-commenting)\n\
    \n30.[http://getfirebug.com/](http://getfirebug.com/)\n\n31.[http://code.google.com/chrome/devtools/docs/overview.html](http://code.google.com/chrome/devtools/docs/overview.html)\n\
    \n32.[http://msdn.microsoft.com/en-us/library/gg58907(v=VS.85).aspx](http://msdn.microsoft.com/en-us/library/gg58907(v=VS.85).aspx)\n\
    \n33.[http://www.opera.com/dragonfly/documentation/](http://www.opera.com/dragonfly/documentation/)\n\
    \n34.[https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools/SafariDeveloperTools.html](https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools/SafariDeveloperTools.html)\n\
    \n35.[http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log](http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log)\n\
    \n36.[http://pusher.com/docs/connection_states](http://pusher.com/docs/connection_states)\n\
    [/content]\n\nWait, the user provided two blocks of text. The first is an example,\
    \ and the second is the \"text to be formatted\". I should only format the **second**\
    \ block (the one under \"以下是需要排版的文本\"). However, looking closely at the prompt,\
    \ the \"以下是需要排版的文本\" section contains the text starting with \"Any good real-time\
    \ technology...\".\n\nWait, let me re-read. The text provided under \"以下是需要排版的文本\"\
    \ starts with \"Any good real-time technology...\" and ends with \"Avoiding the\
    \ Problem\". No, wait, the text provided in the prompt's `[content]` block at\
    \ the very end is what I need to process.\n\nActually, looking at the prompt's\
    \ structure:\n\"## 以下是需要排版的文本\"\n[content]\nAny good real-time technology...\n"
