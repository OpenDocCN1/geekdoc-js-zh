    # “我想你可能做得有点过头了”


    对于某些情况来说，这可能大材小用。但当你想要在任何只能存储字符串的有限空间内存储大量的布尔值时，它绝对非常有用。而且对于经常在网络上传输的数据，任何优化都不算过分。例如，cookie
    在每一个请求中都会发送，因此它们应该尽可能越小。另一个用例是在线多人游戏，其响应时间应该是闪电般快速，否则游戏将变得毫无趣味。


    即使这种优化不是你的菜，我仍然希望你觉得其中涉及的思维过程和代码具有启发性。


