- fmt: "\nThis is a way we can start opening up lines of communication between `CSS`\
    \ and `JavaScript` and lean on the strengths of each language without overdoing\
    \ it. Creating a developmental balance on the front end is very important, because\
    \ the environment is so fragile and we can't control it like we can on the back\
    \ end with a server. If a user's browser is old and slow, most of the time you\
    \ can't sit down and upgrade it (aside: I do have my grandmother using `Chrome`);\
    \ all you can do is embrace the environmental chaos, build for the best and plan\
    \ for the worst.\n\nSome people have argued with me in the past that this style\
    \ of development, where you're referencing `CSS` classes in `JavaScript`, doesn't\
    \ work well in team development environments because the `CSS` is usually built\
    \ by the time you're diving into the `JavaScript`, which can cause these classes\
    \ to get lost in the mix and create a lot of inconsistency in the code (the opposite\
    \ of `DRY`). To those people I say: poke your head over the cube wall, open `AIM`,\
    \ `GTalk` or `Skype`, and communicate to the rest of the team that these classes\
    \ exist specifically to be used with `JavaScript`. I know the concept of developers\
    \ communicating outside of `GIT` commit messages seems like madness, but it'll\
    \ be okay, I promise.\n\n### Using Behavioral CSS With JavaScript Fallbacks\n\n\
    Using these `CSS` objects as hooks for `JavaScript` can go far beyond simple hiding\
    \ and showing of content into an area of behavioral `CSS`, transitions, animations\
    \ and transforms that are often done with `JavaScript` animations. With that in\
    \ mind, lets take a look at a common interaction model of fading out a `div` on\
    \ click, and see how it would be set up with this development model, while providing\
    \ the proper fallbacks for browsers that might not support the `CSS` transition\
    \ we're going to use.\n\nFor this example we'll be using:\n\n* [jQuery](http://jquery.com)^([3](#chapter-9.xhtml_fn9_3))\n\
    * [Modernizr](http://modernizr.com)^([4](#chapter-9.xhtml_fn9_4))\n\nFirst, let's\
    \ set up our `body` element:\n\n```\n<body>\n    <button type=\"button\">Run Transition</button>\n\
    \    <div id=\"cube\"></div><!--/#cube-->\n</body>\n```\n\nFrom there we'll need\
    \ to set up the CSS:\n\n```\n#cube {\n   height: 200px;\n   width: 200px;\n  \
    \ background: orange;\n   -webkit-transition: opacity linear .5s;\n      -moz-transition:\
    \ opacity linear .5s;\n        -o-transition: opacity linear .5s;\n          \
    \ transition: opacity linear .5s;\n}\n\n.fade-out {\n   opacity: 0;\n}\n```\n\n\
    Before we add on the `JavaScript` layer, lets take a moment and talk about the\
    \ flow of what's going to happen:\n\n* Use `Modernizr` to check for `CSS` Transition\
    \ support\n* If Yes, a) set up a click event on the button to add a “fade-out”\
    \ class to `#cube` and b) Add another event listener to catch when the transition\
    \ is finished so we can time the execution of a function that will remove `#cube`\
    \ from the `DOM`.\n* If No, a) Set up a click even on the button to use `jQuery`'s\
    \ `animate()` method to manually fade `#cube` out and b) Execute a callback function\
    \ to remove `#cube` from the `DOM`.\n\nThis process will introduce a new event\
    \ called `transitionend`, which will execute at the end of a `CSS` transition.\
    \ It's amazing, FYI. There is also a companion event called `animationend`, which\
    \ will execute at the end of a `CSS` animation for more complex interactions.\n\
    \nFirst thing we need to do is set up our variables in the `JavaScript`:\n\n```\n\
    (function () {\n\n   // set up your variables\n   var elem = document.getElementById('cube'),\n\
    \       button = document.getElementById('do-it'),\n       transitionTimingFunction\
    \ = 'linear',\n       transitionDuration = 500,\n       transitionend;\n\n   //\
    \ set up the syntax of the transitionend event with proper vendor prefixes\n \
    \  if ($.browser.webkit) {\n       transitionend = 'webkitTransitionEnd'; // safari\
    \ & chrome\n   } else if ($.browser.mozilla) {\n       transitionend = 'transitionend';\
    \ // firefox\n   } else if ($.browser.opera) {\n       transitionend = 'oTransitionEnd';\
    \ // opera\n   } else {\n       transitionend = 'transitionend'; // best guess\
    \ at the default?\n   }\n\n   //... rest of the code goes here.\n\n})(); // end\
    \ wrapping function\n```\n\nYou might notice that our new `transitionend` event\
    \ needs a vendor prefix; we're doing a little browser detection to take care of\
    \ that. Normally you might detect for the vendor prefix and add it onto the event\
    \ name, but in this instance the cases for the syntaxes are a little different,\
    \ so we need to get the whole name of the event for each prefix.\n\nIn the next\
    \ step we'll use `Modernizr` to detect support, and add our event listeners to\
    \ each case (all of this stuff gets added inside the wrapping function):\n\n```\n\
    // detect for css transition support with Modernizr\nif(Modernizr.csstransitions)\
    \ {\n\n    // add our class on click\n    $(button).on('click', function () {\n\
    \       $(elem).addClass('fade-out');\n    });\n\n    // simulate a callback function\
    \ with an event listener\n    elem.addEventListener(transitionend, function ()\
    \ {\n       theCallbackFunction(elem);\n    }, false);\n\n} else {\n\n   // set\
    \ up a normal click/animate listener for unsupported browsers\n   $(button).on('click',\
    \ function () {\n\n       $(elem).animate({\n           'opacity' : '0'\n    \
    \   }, transitionDuration, transitionTimingFunction, function () {\n         \
    \  theCallbackFunction(elem);\n       });\n\n   }); // end click\n\n} // end support\
    \ check\n```\n\nFinally, we need to define a shared function between the two actions\
    \ (DRY) which executes after the transition (or animation) is complete. For the\
    \ sake of this demonstration we can just call `theCallbackFunction()` (even though\
    \ it's not technically a callback function).\n\n```javascript\n// define your\
    \ callback function, what happens after the transition/animation\nfunction theCallbackFunction\
    \ (elem) {\n\n   'use strict';\n\n   // remove the element from the DOM\n   $(elem).remove();\n\
    \n   // log out that the transition is complete\n   console.log('the transition\
    \ is complete');\n}\n```\n```\n\nIn the browser, this should work the same way\
    \ in `IE7` (on the low end) as it does in mobile `Safari` or `Chrome for Mobile`\
    \ (on the high end). The only difference is under the hood; the experience never\
    \ changes for the user.\n\n### The Moral Of The Story\n\nYou might be asking yourself\
    \ why we should even bother going through all this work. We wrote about 60 lines\
    \ of `JavaScript` to accomplish the same design aesthetic that could be created\
    \ with eight lines of `jQuery`. Well, no one ever said that keeping clean code\
    \ and sticking to progressive enhancement was the easiest thing to do. In fact,\
    \ it's a lot easier to ignore it entirely. But as responsible developers, it's\
    \ our duty to build applications in a way that is accessible and easily scales\
    \ to the future. If you want to go that extra mile and create a seamless user\
    \ experience as I do, then it's well worth the extra time it takes to dot all\
    \ the i's and cross all the t's in a project to create an overall experience that\
    \ will gracefully degrade and progressively enhance.\n\nUsing this model also\
    \ lets us lean heavily on CSS for its strengths, like responsive design and using\
    \ breakpoints to redefine your interaction at the various screen sizes. It also\
    \ helps if you're specifically targeting a device with a constrained bandwidth,\
    \ because, as we all know, `CSS` is much lighter than `JavaScript` in both download\
    \ and execution time. Being able to offload some of the weight `JavaScript` carries\
    \ onto `CSS` is a great benefit.\n"
