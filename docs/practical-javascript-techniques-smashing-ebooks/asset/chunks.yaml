    \n# Five Useful Interactive CSS/jQuery Techniques Deconstructed\n\nBy Jon Raasch\n\
    \nWith the wide variety of CSS3 and JavaScript techniques available today, it's\
    \ easier than ever to create unique interactive websites that delight visitors\
    \ and provide a more engaging user experience.\n\nIn this chapter, we'll walk\
    \ through five interactive techniques that you can start using right now.\n\n\
    Besides learning how to accomplish these specific tasks, you'll also master a\
    \ variety of **useful CSS and jQuery tricks** that you can leverage when creating\
    \ your own interactive techniques. The solutions presented here are certainly\
    \ not perfect, so any thoughts, ideas and suggestions on how you would solve these\
    \ design problems would be very appreciated.\n\nSo, let's dive in and start building\
    \ more exciting websites!\n\n### 1\\. Extruded Text Effect\n\n[![Extruded text\
    \ effect on David DeSandro's site](images/extruded-text-effect.png \"Extruded\
    \ text effect on David DeSandro's website\")](http://desandro.com/)\n\nThe footer\
    \ of [David DeSandro's website](http://desandro.com/)^([1](#chapter-3.xhtml_fn3_1))\
    \ uses extruded text that animates on mouseover. This interactive text effect\
    \ is a quick and impressive way to add some flare to your website. With only a\
    \ few lines of CSS3, we can make the text appear to pop out of the page in **three\
    \ dimensions**.\n\n•[View the demo](http://jonraasch.com/demo/extrude-on-hover)^([2](#chapter-3.xhtml_fn3_2))\n\
    \nFirst let's set up some text (the code is copied from the original site):\n\n\
    ```\n<span class=\"extruded\">Extrude Me</span>\n```\n\nAnd some basic styling\
    \ (the code is copied from the original site):\n\n```\nbody {\n    background-color:\
    \ #444;\n    text-align: center;\n}\n\n.extruded {\n    color: #888;\n    font-family:\
    \ proxima-nova-1, proxima-nova-2, 'Helvetica Neue', Arial, sans-serif;\n    font-size:\
    \ 48px;\n    font-weight: bold;\n    text-shadow: #000 3px 3px;\n}\n```\n\nHere,\
    \ we've applied some basic styles and added a `text-shadow`. But this text-shadow\
    \ doesn't look three-dimensional; to accomplish the extruded effect, we'll need\
    \ to **add more text-shadows**:\n\n```\n text-shadow: #000 1px 1px, #000 2px 2px,\
    \ #000 3px 3px;\n```\n\nThis will add three different text-shadows to our text,\
    \ stacked on top of each other to create the three dimensional appearance we want.\n\
    \n#### Styling the Hover State\n\nNext, let's add a hover state with a bigger\
    \ text-shadow:\n\n```\n.extruded:hover {\n    color: #FFF;\n    text-shadow: #58E\
    \ 1px 1px, #58E 2px 2px, #58E 3px 3px, #58E 4px 4px, #58E 5px 5px, #58E 6px 6px;\n\
    }\n```\n\nHere, we've added three more text-shadows to **increase the depth**\
    \ of the extrude effect. But this effect alone is too flat; we want the text to\
    \ look like it's popping off the page. So, let's reposition the text to make it\
    \ appear to grow taller from the base of the extruded section:\n\n```\n.extruded\
    \ {\n    position: relative;\n}\n\n.extruded:hover {\n    color: #FFF;\n    text-shadow:\
    \ #58E 1px 1px, #58E 2px 2px, #58E 3px 3px, #58E 4px 4px, #58E 5px 5px, #58E 6px\
    \ 6px;\n    left: -6px;\n    top: -6px;\n}\n```\n\nNow in the hover state, the\
    \ extruded text moves up the same distance as our max `text-shadow` value. We\
    \ also added `position: relative`, which must be attached to the base state, not\
    \ just the hover state, or else it will cause problems when we animate it.\n\n\
    #### Animating the Transition\n\nNext, we can add a [CSS3 transition](http://net.tutsplus.com/tutorials/html-css-techniques/css-fundametals-css-3-transitions/)^([3](#chapter-3.xhtml_fn3_3))\
    \ to our text to animate the color change and extrude effect:\n\n```\n.extruded\
    \ {\n     -moz-transition: all 0.3s ease-out; /* FF3.7+ */\n       -o-transition:\
    \ all 0.3s ease-out; /* Opera 10.5 */\n  -webkit-transition: all 0.3s ease-out;\
    \ /* Saf3.2+, Chrome */\n          transition: all 0.3s ease-out;\n}\n```\n\n\
    This triggers a smooth animation for our different CSS changes on hover. While\
    \ it doesn't work in all browsers, it does degrade nicely to the basic hover effect.\n\
    \nBringing it all together:\n\n```\nbody {\n    background-color: #444;\n    text-align:\
    \ center;\n}\n\n.extruded {\n    color: #888;\n    font-family: proxima-nova-1,\
    \ proxima-nova-2, 'Helvetica Neue', Arial, sans-serif; /* the original site doesn't\
    \ use the @font-face attribute */\n    font-size: 48px;\n    font-weight: bold;\n\
    \    text-shadow: #000 1px 1px, #000 2px 2px, #000 3px 3px;\n    position: relative;\n\
    \    -moz-transition: all 0.3s ease-out; /* FF3.7+ */\n       -o-transition: all\
    \ 0.3s ease-out; /* Opera 10.5 */\n  -webkit-transition: all 0.3s ease-out; /*\
    \ Saf3.2+, Chrome */\n          transition: all 0.3s ease-out;\n}\n\n.extruded:hover\
    \ {\n    color: #FFF;\n    text-shadow: #58E 1px 1px, #58E 2px 2px, #58E 3px 3px,\
    \ #58E 4px 4px, #58E 5px 5px, #58E 6px 6px;\n    left: -6px;\n    top: -6px;\n\
    }\n```\n\n#### Shortcomings\n\nWhile applying several CSS3 text-shadows works\
    \ well when the text is static, it falls a bit short when used alongside the transition\
    \ animation.\n\nIn short, the biggest text-shadow animates just fine, but the\
    \ other text-shadows aren't applied until the animation completes. This causes\
    \ a quick correction: the browser stutters with a basic drop-shadow before filling\
    \ in the rest diagonally.\n\nFortunately, we can make this drawback relatively\
    \ unnoticeable, provided that we follow a few style guidelines. Basically, we\
    \ want to hide the bulk of the extruded portion with the top text. This means\
    \ that we should generally use this effect with bolder fonts, such as the Proxima\
    \ Nova family used by David DeSandro. Also, we should be careful to avoid text-shadows\
    \ that are too big for the font. Tweak your settings with this in mind until the\
    \ animated extrude looks believable.\n\nFinally, this technique **will not work\
    \ in IE**, because `text-shadow` is unsupported in all versions of IE (even IE9).\n\
    \n•[Download the complete example](https://gist.github.com/957199)^([4](#chapter-3.xhtml_fn3_4))\n\
    \n•[View the demo](http://jonraasch.com/demo/extrude-on-hover)^([2](#chapter-3.xhtml_fn3_2))\n\
    \n### 2\\. Animating A Background Image\n\n[![Animated monster image from Love\
    \ Nonsense](images/animated-images.png \"Animated monster image from Love Nonsense\"\
    )](http://lovenonsense.com/)"
