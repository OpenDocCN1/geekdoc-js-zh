    \ similar, so we don't need to go through each one. Instead, let's pick apart\
    \ one of them, `columnGroups`:\n\n```\n// Sort data into groups based on number\
    \ of columns\ncolumnGroups: function() {\n   var columnGroups = [];\n   // Get\
    \ number of columns from first row of table body\n   var columns = data.find('tbody\
    \ tr:eq(0) td').length;\n   for (var i = 0; i < columns; i++) {\n      columnGroups[i]\
    \ = [];\n      data.find('tbody tr').each(function() {\n         columnGroups[i].push($(this).find('td').eq(i).text());\n\
    \      });\n   }\n   return columnGroups;\n}\n```\n\nHere's how it breaks down:\n\
    \n•Create the `columnGroups[]` array to store the data;\n\n•Get the number of\
    \ columns by counting the table cells (`td`) in the first row;\n\n•For each column,\
    \ find the number of rows in the table body (`tbody`), and create another array\
    \ to store the table cell data;\n\n•Then loop through each row and grab the data\
    \ from each table cell (via the jQuery `text()` function), and then add it to\
    \ the table cell data array.\n\nOnce our object is full of juicy data, we can\
    \ start creating the elements that make up our graph.\n\n### Using The Data\n\n\
    Using the jQuery `$.each` function, we can now loop through our data at any point\
    \ and create the elements that make up our graph. One of the trickier bits involves\
    \ inserting the bars that represent each species inside the yearly columns.\n\n\
    Here's the code:\n\n```\n// Loop through column groups, adding bars as we go\n\
    $.each(columnGroups, function(i) {\n   // Create bar group container\n   var barGroup\
    \ = $('<div class=\"bar-group\"></div>');\n   // Add bars inside each column\n\
    \   for (var j = 0, k = columnGroups[i].length; j < k; j++) {\n      // Create\
    \ bar object to store properties (label, height, code, etc.) and add it to array\n\
    \      // Set the height later in displayGraph() to allow for left-to-right sequential\
    \ display\n      var barObj = {};\n      barObj.label = this[j];\n      barObj.height\
    \ = Math.floor(barObj.label / chartYMax * 100) + '%';\n      barObj.bar = $('<div\
    \ class=\"bar fig' + j + '\"><span>' + barObj.label + '</span></div>')\n     \
    \    .appendTo(barGroup);\n      bars.push(barObj);\n   }\n   // Add bar groups\
    \ to graph\n   barGroup.appendTo(barContainer);\n});\n```\n\nExcluding the headings,\
    \ our table has five columns with three rows. For our graph, this means that for\
    \ each column we create, three bars will appear in that column. The following\
    \ image shows how our graph will be constructed:\n\n![screenshot](images/graph-tut-image-construction.png\
    \ \"graph-tut-image-construction\")\n\nBreaking it down:\n\n•For each column,\
    \ create a container `div`;\n\n•Loop inside each column to get the row and cell\
    \ data;\n\n•Create a bar object (`barObj{}`) to store the properties for each\
    \ bar, such as its label, height and mark-up;\n\n•Add the mark-up property to\
    \ the column, applying a CSS class of `'.fig' + j` to color code each bar in the\
    \ column, wrapping the label in a `span`;\n\n•Add the object to our `bars[]` array\
    \ so that we can access the data later;\n\n•Piece it all together by adding the\
    \ columns to a container element.\n\nBonus points if you noticed that we didn't\
    \ set the height of the bars. This is so that we have more control later on over\
    \ how the bars are displayed.\n\nNow that we have our bars, let's work on labelling\
    \ our graph. Because the code to display the labels is quite similar, talking\
    \ you through all of it won't be necessary. Here's how we display the y-axis:\n\
    \n```\n// Add y-axis to graph\nvar yLegend   = tableData.yLegend();\nvar yAxisList\
    \   = $('<ul class=\"y-axis\"></ul>');\n$.each(yLegend, function(i) {\n   var\
    \ listItem = $('<li><span>' + this + '</span></li>')\n      .appendTo(yAxisList);\n\
    });\nyAxisList.appendTo(graphContainer);\n```\n\nThis breaks down as follows:\n\
    \n•Get the relevant table data for our labels,\n\n•Create an unordered list (`ul`)\
    \ to contain our list items;\n\n•Loop through the label data, and create a list\
    \ item (`li`) for each label, wrapping each label in a `span`;\n\n•Attach the\
    \ list item to our list;\n\n•Finally, attach the list to a container element.\n\
    \nBy repeating this technique, we can add the legend, x-axis labels and headings\
    \ for our graph.\n\nBefore we can display our graph, we need to make sure that\
    \ everything we've done is added to our container element.\n\n```\n// Add bars\
    \ to graph\nbarContainer.appendTo(graphContainer);      \n\n// Add graph to graph\
    \ container\ngraphContainer.appendTo(figureContainer);\n\n// Add graph container\
    \ to main container\nfigureContainer.appendTo(container);\n```\n\n### Displaying\
    \ The Data\n\nAll that's left to do in jQuery is set the height of each bar. This\
    \ is where our earlier work, storing the height property in a bar object, will\
    \ come in handy.\n\nWe're going to animate our graph sequentially, one by one,\
    \ uno por uno.\n\nOne possible solution is to use a callback function to animate\
    \ the next bar when the last animation is complete. However, the graph would take\
    \ too long to animate. Instead, our graph will use a timer function to display\
    \ each bar after a certain amount of time, regardless of how long each bar takes\
    \ to grow. Rad!\n\nHere's the `displayGraph()` function:\n\n```\n// Set the individual\
    \ height of bars\nfunction displayGraph(bars, i) {\n   // Changed the way we loop\
    \ because of issues with $.each not resetting properly\n   if (i < bars.length)\
    \ {\n      // Animate the height using the jQuery animate() function\n      $(bars[i].bar).animate({\n\
    \         height: bars[i].height\n      }, 800);\n      // Wait the specified\
    \ time, then run the displayGraph() function again for the next bar\n      barTimer\
    \ = setTimeout(function() {\n         i++;\n         displayGraph(bars, i);\n\
    \      }, 100);\n   }\n}\n```\n\nWhat's that you say? “Why aren't you using the\
    \ `$.each` function like you have everywhere else?” Good question. First, let's\
    \ discuss what the `displayGraph()` function does, then why it is the way it is.\n\
    \nThe `displayGraph()` function accepts two parameters:\n\n•The `bars` to loop\
    \ through,\n\n•An index (`i`) from which to start iterating (starting at `0`).\n\
    \nLet's break down the rest:\n\n•If the value of `i` is less than the number of\
    \ bars, then keep going;\n\n•Get the current bar from the array using the value\
    \ of `i`;\n\n•Animate the height property (calculated as a percentage and stored\
    \ in `bars[i].height`);\n\n•Wait 100 milliseconds;\n\n•Increment `i` by 1 and\
    \ repeat the process for the next bar.\n\n“So, why wouldn't you just use the `$.each`\
    \ function with a `delay()` before the animation?”\n\nYou could, and it would\
    \ work just fine… the first time. But if you tried to reset the animation via\
    \ the “Reset graph” button, then the timing events wouldn't clear properly and\
    \ the bars would animate out of sequence.\n\nMoving on, here's `resetGraph()`:\n\
    \n```\n// Reset graph settings and prepare for display\nfunction resetGraph()\
    \ {\n   // Stop all animations and set the bar's height to 0\n   $.each(bars,\
    \ function(i) {\n      $(bars[i].bar).stop().css('height', 0);\n   });\n\n   //\
    \ Clear timers\n   clearTimeout(barTimer);\n   clearTimeout(graphTimer);\n\n \
    \  // Restart timer\n   graphTimer = setTimeout(function() {\n      displayGraph(bars,\
    \ 0);\n   }, 200);\n}\n```\n\nLet's break `resetGraph()` down:\n\n•Stop all animations,\
    \ and set the height of each bar back to 0;\n\n•Clear out the timers so that there\
    \ are no stray animations;\n\n•Wait 200 milliseconds;"
