    Every API is different, and every one returns different results in a different
    structure — it''s all part of the fun! So, get used to using `console.log()`,
    and familiarize yourself with the results set before trying to access it with
    code or using it in your application.


    Start with something practical and entertaining: build a check-in checker with
    Gowalla''s API; visualize trends with Twitter''s API; or make a face-recognition
    app with Face.com''s API.


    APIs are fun. By definition, the data they bring to the page is dynamic, not static.


