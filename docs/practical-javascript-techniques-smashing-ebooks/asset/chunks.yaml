  trans: "\n\n### 4. 动画幻灯片导航\n\n![McKinney 上的动画幻灯片导航](http://mckinney.com/)\n\n有很多\
    \ JavaScript 幻灯片技术，但 [McKinney](http://mckinney.com/)^(24)上的动画导航是一种新鲜且微妙的方法。\n\
    \n####  jQuery 幻灯片\n\n•[查看演示](http://jonraasch.com/demo/fancy-slideshow-navigation)^(25)\n\
    \n让我们来构建类似的内容。我们先从基础幻灯片的标记语言开始：\n\n```\n<div id=\"slideshow\">\n    <div id=\"\
    slideshow-reel\">\n        <div class=\"slide\">\n            <h1>Slide 1</h1>\n\
    \        </div>\n\n        <div class=\"slide\">\n            <h1>Slide 2</h1>\n\
    \        </div>\n\n        <div class=\"slide\">\n            <h1>Slide 3</h1>\n\
    \        </div>\n\n        <div class=\"slide\">\n            <h1>Slide 4</h1>\n\
    \        </div>\n\n        <div class=\"slide\">\n            <h1>Slide 5</h1>\n\
    \        </div>\n\n        <div class=\"slide\">\n            <h1>Slide 6</h1>\n\
    \        </div>\n    </div\n</div\n```\n\n在这里我们设置了六张幻灯片，可以填充我们需要的任何内容。让我们设置一些\
    \ CSS 来让幻灯片以水平卷的形式显示：\n\n```\n#slideshow {\n    width: 900px;\n    height: 500px;\n\
    \    overflow: hidden;\n    position: relative;\n}\n\n#slideshow-reel {\n    width:\
    \ 5400px;\n    height: 450px;\n    position: absolute;\n    top: 0;\n    left:\
    \ 0;\n}\n\n#slideshow-reel .slide {\n    width: 900px;\n    height: 450px;\n \
    \   float: left;\n    background-color: gray;\n}\n```\n\n在这里，我们定义了幻灯片的尺寸，并使用 `overflow:\
    \ hidden` 隐藏卷轴中的其他幻灯片。我们还定义了卷的尺寸：六张幻灯片每张 900 像素，宽度为 5400 像素。（你也可以直接设置为非常大的数字，比如\
    \ 10000 像素。）然后，我们将卷绝对定位在幻灯片内部（该容器设置了 `position: relative`）。最后，我们定义了所有单个幻灯片的尺寸，并将它们向左浮动以填充我们的卷。\n\
    \n#### 基础幻灯片动画\n\n现在，让我们添加一些 jQuery 来让这个幻灯片动起来：\n\n```\n$(function() {\n    function\
    \ changeSlide( newSlide ) {        \n        // 改变 currSlide 值\n        currSlide\
    \ = newSlide;\n\n        // 确保 currSlide 值不会过高过低\n        if ( currSlide > maxSlide\
    \ ) currSlide = 0;\n        else if ( currSlide < 0 ) currSlide = maxSlide;\n\n\
    \        // 动画处理卷\n        $slideReel.animate({\n            left : currSlide\
    \ * -900\n        }, 400, 'swing', function() {\n            // 如果激活则设置新的定时器\n\
    \            if ( activeSlideshow ) slideTimeout = setTimeout(nextSlide, 1200);\n\
    \        });\n    }\n\n    function nextSlide() {\n        changeSlide( currSlide\
    \ + 1 );\n    }\n\n    // 定义变量 / DOM 引用\n    var activeSlideshow = true,\n   \
    \ currSlide = 0,\n    slideTimeout,\n    $slideshow = $('#slideshow'),\n    $slideReel\
    \ = $slideshow.find('#slideshow-reel'),\n    maxSlide = $slideReel.children().length\
    \ - 1;\n\n    // 启动动画\n    slideTimeout = setTimeout(nextSlide, 1200);\n});\n\
    ```\n\n在这里，我们首先创建了 `changeSlide()` 函数，它负责处理卷的动画。该函数接受下一个要显示的幻灯片的索引，并检查该值是否过高或过低以超出卷的范围。\n\
    \n接下来，它将卷动画到适当的位置，然后通过设置一个新的[超时](http://www.elated.com/articles/javascript-timers-with-settimeout-and-setinterval/)^(26)\
    \ 来触发下一次迭代。\n\n最后，我们构建了 `nextSlide()` 函数，它只需触发 `changeSlide()` 来显示卷中的下一张幻灯片。这个简单的函数只是配合\
    \ `setTimeout()` 使用的快捷方法。\n\n#### 左右导航\n\n接下来，让我们在幻灯片中设置左右箭头，从标记语言开始：\n\n```\n\
    \ <a href=\"#\" id=\"slideshow-prev\"></a>\n    <a href=\"#\" id=\"slideshow-next\"\
    ></a>\n```\n\n为了简单起见，我们将标记添加到 HTML 源码中。将它们添加到 jQuery 中通常是更好的方法，以确保控件仅在可用时显示。\n\
    \n让我们用 CSS 为这些箭头设置样式：\n\n```\n#slideshow-prev, #slideshow-next {\n    display:\
    \ block;\n    width: 50px;\n    height: 50px;\n    position: absolute;\n    top:\
    \ 200px;\n    z-index: 10;\n}\n\n#slideshow-prev {\n    left: 10px;\n}\n\n#slideshow-next\
    \ {\n    right: 10px;\n}\n\n#slideshow-prev:hover, #slideshow-next:hover {\n \
    \   opacity: 0.7;\n}\n\n.slideshow-active {\n    opacity: 0.5;\n}\n```\n\n我们在幻灯片中绝对定位了箭头，并添加了悬停样式。最后，我们将所需的交互构建到\
    \ JavaScript 中：\n\n```\n$(function() {\n    function changeSlide( newSlide ) {\
    \        \n        // 取消任何定时器\n        clearTimeout(slideTimeout);\n\n       \
    \ // 改变 currSlide 值\n        currSlide = newSlide;\n\n        // 确保 currSlide\
    \ 值不会过高过低\n        if ( currSlide > maxSlide ) currSlide = 0;\n        else if\
    \ ( currSlide < 0 ) currSlide = maxSlide;\n\n        // 动画处理卷\n        $slideReel.animate({\n\
    \            left : currSlide * -900\n        }, 400, 'swing', function() {\n\
    \            // 如果激活则设置新的定时器\n            if ( activeSlideshow ) slideTimeout\
    \ = setTimeout(nextSlide, 1200);\n        });\n    }\n\n    function nextSlide()\
    \ {\n        changeSlide( currSlide + 1 );\n    }\n\n    // 定义变量 / DOM 引用\n  \
    \  var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n    $slideshow\
    \ = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n \
    \   maxSlide = $slideReel.children().length - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n\
    \    $slideNextNav = $slideshow.find('#slideshow-next');\n\n    // 设置点击事件\n\n\
    \    // 左箭头\n    $slidePrevNav.click(function(ev) {\n        ev.preventDefault();\n\
    \n        activeSlideshow = false;\n\n        changeSlide( currSlide - 1 );\n\
    \    });\n\n    // 右箭头\n    $slideNextNav.click(function(ev) {\n        ev.preventDefault();\n\
    \n        activeSlideshow = false;\n\n        changeSlide( currSlide + 1 );\n\
    \    });\n\n    // 启动动画\n    slideTimeout = setTimeout(nextSlide, 1200);\n});\n\
    ```\n\n"
- fmt: "\nFinally, in the callback of the `animate()` function, we've added some code\
    \ to hide and show the arrow navigation. This hides the left arrow when the slideshow\
    \ is showing the left-most slide, and vice versa.\n\n### Animating the Bottom\
    \ Navigation\n\nThe basic slideshow works with the previous and next arrows. Let's\
    \ take it to the next level by adding the animated navigation. Please note that\
    \ I am using a more complex markup because it avoids the use of images and is\
    \ ultimately simpler. It would have to use three background images otherwise —\
    \ one for the center sections and one for each cap to allow the clickable areas\
    \ to be larger). However, you could clean up the bottom navigation with a `background-image`.\n\
    \nHere is the jQuery code for animation:\n\n```javascript\n$(function() {\n  \
    \  function changeSlide( newSlide ) {\n        // cancel any timeout\n       \
    \ clearTimeout( slideTimeout );\n\n        // change the currSlide value\n   \
    \     currSlide = newSlide;\n\n        // make sure the currSlide value is not\
    \ too low or high\n        if ( currSlide > maxSlide ) currSlide = 0;\n      \
    \  else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        // animate the slide\
    \ reel\n        $slideReel.animate({\n            left : currSlide * -900\n  \
    \      }, 400, 'swing', function() {\n            // hide / show the arrows depending\
    \ on which frame it's on\n            if ( currSlide == 0 ) $slidePrevNav.hide();\n\
    \            else $slidePrevNav.show();\n\n            if ( currSlide == maxSlide\
    \ ) $slideNextNav.hide();\n            else $slideNextNav.show();\n\n        \
    \    // set new timeout if active\n            if ( activeSlideshow ) slideTimeout\
    \ = setTimeout(nextSlide, 1200);\n        });\n\n        // animate the navigation\
    \ indicator\n        $activeNavItem.animate({\n            left : currSlide *\
    \ 150\n        }, 400, 'swing');\n    }\n\n    function nextSlide() {\n      \
    \  changeSlide( currSlide + 1 );\n    }\n\n    // define some variables / DOM\
    \ references\n    var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n\
    \    $slideshow = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n\
    \    maxSlide = $slideReel.children().length - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n\
    \    $slideNextNav = $slideshow.find('#slideshow-next'),\n    $activeNavItem =\
    \ $slideshow.find('#active-nav-item');\n\n    // set navigation click events\n\
    \n    // left arrow\n    $slidePrevNav.click(function(ev) {\n        ev.preventDefault();\n\
    \n        activeSlideshow = false;\n\n        changeSlide( currSlide - 1 );\n\
    \    });\n\n    // right arrow\n    $slideNextNav.click(function(ev) {\n     \
    \   ev.preventDefault();\n\n        activeSlideshow = false;\n\n        changeSlide(\
    \ currSlide + 1 );\n    });\n\n    // main navigation\n    $slideshow.find('#slideshow-nav\
    \ a.nav-item').click(function(ev) {\n        ev.preventDefault();\n\n        activeSlideshow\
    \ = false;\n\n        changeSlide( $(this).index() );\n    });\n\n    // start\
    \ the animation\n    slideTimeout = setTimeout(nextSlide, 1200);\n});\n```\n\n\
    We've added a couple of things to our script.\n\nFirst, we've included a second\
    \ animation in `changeSlide()`, this time to animate the active indicator in the\
    \ navigation. This `animate()` is basically the same as the one we built for the\
    \ reel, the main difference being that we want to move it only `150px` per slide.\n\
    \nFinally, we added a click event listener to the items in the bottom navigation.\
    \ Similar to the arrow navigation, we start by disabling the automatic animation,\
    \ setting `activeSlideshow` to `false`. Next, we trigger `changeSlide()`, passing\
    \ in the index of whichever slide was clicked, which is easy to determine using\
    \ jQuery's `index()` method.\n\nNow the slideshow navigation animation is complete\
    \ and ready to impress your visitors.\n\n* [Download the complete example](https://gist.github.com/957203)\n\
    * [View the demo](http://jonraasch.com/demo/fancy-slideshow-navigation)\n\n###\
    \ 5. Animated Icons\n\n[![Animated icons on CSS Tricks](images/animated-icons-on-css-tricks.png\
    \ \"Animated icons on CSS Tricks\")](http://css-tricks.com)\n\n[CSS-Tricks](http://css-tricks.com)\
    \ has a simple but elegant effect in its footer when the user mouses over various\
    \ buttons. Besides the color changing and an icon being added, the effect is animated\
    \ in browsers that support transition, making the icon appear to slide into place.\n\
    \n* [View the demo](http://jonraasch.com/demo/animated-icons)\n\nLet's create\
    \ a similar effect, starting with some mark-up:\n\n```html\n<a href=\"#\" class=\"\
    hover-panel\">\n    <h3>Panel Title</h3>\n\n    <p>Additional information goes\
    \ here</p>\n</a>\n```\n\n#### Styling the Buttons\n\nLet's set up some CSS to\
    \ style the button in its natural (non-hovered) state:\n\n```css\n.hover-panel\
    \ {\n    background-color: #E62DF;\n    color: #B2AAA4;\n    float: left;\n  \
    \  height: 130px;\n    width: 262px;\n}\n\n.hover-panel h3 {\n    font-family:\
    \ Impact, Sans-serif;\n    font-size: 38px;\n    text-transform: uppercase;\n\
    }\n\n.hover-panel p {\n    font-size: 12px;\n    width: 65%;\n}\n```\n\nNow let's\
    \ add a static hover effect to change some of the colors and add drop shadow:\n\
    \n```css\n.hover-panel:hover {\n    background-color: #237ABE;\n}\n\n.hover-panel:hover\
    \ h3 {\n    color: #FFF;\n    text-shadow: rgba(0, 0, 0, 0.39838) 0px 0px 4px;\n\
    }\n\n.hover-panel:hover p {\n    color: #FFF;\n}\n```\n\nFinally, let's add a\
    \ background image that pops into place:\n\n```css\n.hover-panel {\n    background-image:\
    \ url(hover-panel-icon.png);\n    background-position: 292px 10px;\n    background-repeat:\
    \ no-repeat;\n}\n\n.hover-panel:hover {\n    background-position: 180px 10px;\n\
    }\n```\n\nHere, we've added a few important styles to accomplish the hover effect.\
    \ First, we've attached the background image to our `.hover-panel`. This is normally\
    \ positioned outside of the button, but on mouseover, it is placed correctly.\
    \ Also, note that we've placed it off to the right side of the panel, so that\
    \ when we apply the transition animation, the icon will slide in from the right.\n\
    \n#### Animating the Transition\n\nFinally, let's add the transition:\n\n```css\n\
    .hover-panel {\n    -moz-transition: 0.2s ease; /* FF3.7+ */\n    -o-transition:\
    \ all 0.2s ease; /* Opera 10.5 */\n    -webkit-transition: all 0.2s ease; /* Saf3.2+,\
    \ Chrome */\n    transition: all 0.2s ease;\n}\n```\n\nThe transition effect triggers\
    \ the animation of the background image. Because we've flagged it to apply to\
    \ `all` attributes, the transition will also be applied to the `background-color`\
    \ change that we applied above.\n\nAlthough this works in most modern browsers,\
    \ it will not work in IE9. But even in unsupported browsers, the user will see\
    \ the color change and icon; they just won't see the animation effect.\n\nOn most\
    \ websites, this enhancement wouldn't be necessary for all users. But if support\
    \ is a priority, look into this [jQuery back-up](http://jonraasch.com/blog/graceful-degradation-with-css3#transitions).\n\
    \nFinally, let's bring all of the styles together:\n"
