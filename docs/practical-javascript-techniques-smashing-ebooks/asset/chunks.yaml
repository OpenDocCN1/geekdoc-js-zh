    # 如何构建实时评论系统


    作者：Phil Leggetter


    多年来，Web 变得越来越具有交互性。这种趋势将随着实时 Web 驱动的下一代应用而继续。在应用程序中添加实时功能可以带来更具交互性、更具吸引力的用户体验。然而，设置和维护服务器端的实时组件可能会成为一种困扰的干扰。但别担心，有一个解决方案。


    在过去的几年里，云托管的 Web 服务和 API 救了许多开发者，实时功能也不例外。例如，[Pusher](http://pusher.com)^(1) 的重点在于通过提供托管的
    API，让你专注于构建实时 Web 应用，该 API 可以让你快速轻松地为 Web 和移动应用添加可扩展的实时功能。在教程中，我将展示如何将一个基础的博客评论系统转换为实时的互动式体验，你将看到在一个浏览器窗口中输入的评论“魔法般”地出现在第二个窗口中。


    ## 我们为什么应该关注实时 Web？


    尽管[实时 Web](http://en.wikipedia.org/wiki/Real-time_web)^(2)是一个相对较的主流术语，但实时 Web
    技术已经存在了 10 多年。它们主要被构建针对金融服务领域软件的公司或 Web 聊天应用程序使用。这些最初的解决方案被归类为“临时方案（hacks）”。2006
    年，这些解决方案得到了名为 [Comet](http://en.wikipedia.org/wiki/Comet_(programming))^(3)的统称，但即使有了定义的名称，这些解决方案仍然被视为临时方案。那么，发生了什么变化？


    ### 社交媒体数据


    社交媒体，特别是 Twitter，意味着更多数据的可用。早期的向浏览器推送数据的解决方案被认为是“临时方案”。但这并没有消除对以标准方式实现此操作的需求。


    ### 用户期望的增长


    随着用户对 Web 应用的期望提高，实时技术走向了前沿。这对于具有高度互动性的 Facebook 来说尤其如此。


    ## WebSockets


    ![HTML5 和 WebSockets](img/HTML5_Logo_256.png "HTML5 Logo")


    之前我提到过之前的解决方案都是“临时方案”。但我们的请求得到了 [Sockets](http://pusher.com/websocket)^(5)的解答。WebSocket
    代表了一种[标准 API](http://www.w3.org/TR/websockets/)^(6)和[协议](http://tools.ietf.org/html/rfc6455)^(7)，允许服务器和客户端（浏览器浏览器）通过单个连接进行双向通信。旧解决方案通过两个连接来实现双向通信，因此
    WebSocket 使用单个连接这一事实实际上是件大事。这对服务器和客户端来说都是巨大的资源节省，后者对于电量极其宝贵的移动设备尤为重要。


    ## 实时技术是如何使用的？


    实时 Web 技术使得构建各种互动式功能成为可能，从而提升了用户体验。以下是一些常见的用例：


    - **实时统计**：该技术最初用于金融领域显示股票交易所信息，因此现在比以往任何时候都更频繁并不意外。它对体育、博彩和分析非常有益。

    - **通知**：当用户感兴趣的内容可用或发生变化时。

    - **活动流**：朋友或项目的活动流。这在 Twitter、Facebook、Trello、Quora 等许多应用中很常见。

    - **聊天**：实时 Web 技术的入门（101），但仍然非常有价值的功能。它有助于朋友、同事、客户与客户服务之间的即时互动。

    - **协作**：Google Docs 在其文档、表格和绘图应用中提供了这种功能，我们将在更多应用中看到类似的用例。

    - **多人游戏**：能够即时传递玩家移动、游戏状态变化和得分更新，这对于多人游戏显然至关重要。


