    \ commenting system!**\n\n**But…**, we're not done quite yet. You'll also see\
    \ that the comment is shown twice in the window of the user who submitted it.\
    \ This is because the comment has been added by the AJAX callback, and by the\
    \ Pusher event. Because this is a very common scenario, especially if you've built\
    \ an application in a progressively enhanced way as we have, the Pusher server\
    \ libraries expose a way of [excluding a connection/user](http://pusher.com/docs/publisher_api_guide/publisher_excluding_recipients)^([27](#chapter-6.xhtml_fn6_27))\
    \ from receiving the event via Pusher.\n\nIn order to do this you need to send\
    \ a unique connection identifier called a `socket_id` from the client to the server.\
    \ This identifier can then be used to define who will be excluded.\n\n```\nfunction\
    \ handleSubmit() {\n\tvar form = $(this);\n\tvar data = {\n\t\t\"comment_author\"\
    : form.find('#comment_author').val(),\n\t\t\"email\": form.find('#email').val(),\n\
    \t\t\"comment\": form.find('#comment').val(),\n\t\t\"comment_post_ID\": form.find('#comment_post_ID').val()\n\
    \t};\n\n\tvar socketId = getSocketId();\n\tif(socketId !== null) {\n\t\tdata.socket_id\
    \ = socketId;\n\t}\n\n\tpostComment(data);\n\n\treturn false;\n}\n\nfunction getSocketId()\
    \ {\n\tif(pusher && pusher.connection.state === 'connected') {\n\t\treturn pusher.connection.socket_id;\n\
    \t}\n\treturn null;\n}\n```\n\nThe changes we've made are:\n\n•A new function\
    \ called `getSocketId` has been added to get the `socket_id`. It wraps a check\
    \ to ensure that the `pusher` variable has been set and also that the client is\
    \ connected to Pusher.\n\n•The `handleSubmit` has been updated to check to see\
    \ if a `socket_id` is available. If it is, this information is posted to the server\
    \ along with the comment data.\n\nOn the server we need to use the `socket_id`\
    \ parameter if it is present and therefore exclude the connection and user who\
    \ submitted the comment, or pass in `null` if it's not:\n\n```\n $channel_name\
    \ = 'comments-' . $added['comment_post_ID'];\n$event_name = 'new_comment';\n$socket_id\
    \ = (isset($_POST['socket_id'])?$_POST['socket_id']:null);\n\n$pusher = new Pusher(APP_KEY,\
    \ APP_SECRET, APP_ID);\n$pusher-&gt;trigger($channel_name, $event_name, $added,\
    \ $socket_id);\n```\n\nAnd as simple as that we have **a fully realtime enabled\
    \ blog commenting system** and we only send messages to users who really need\
    \ to see them. As with the AJAX functionality the realtime functionality has been\
    \ added in a progressively enhancing way, to ensure it doesn't impact on any other\
    \ functionality. You can find the a demo running [here](http://www.leggetter.co.uk/pusher/realtime-commenting/)^([28](#chapter-6.xhtml_fn6_28))\
    \ and the completed solution in the [realtime commenting repository](https://github.com/pusher/realtime-commenting)^([29](#chapter-6.xhtml_fn6_29))\
    \ in github.\n\n### Good Real-Time App Development Practices\n\nReal-time application\
    \ development shares common good development practices with general Web development.\
    \ However, I thought I would share a couple of tips that can come in particularly\
    \ handy.\n\n#### Use Browser Developer Tools\n\nWhen you start doing a lot of\
    \ JavaScript development the browser developer tools becomes your best friend.\
    \ It's the same when adding realtime functionality to your Web app, not only because\
    \ you are using JavaScript, but also because the JavaScript library you are using\
    \ is likely to be doing some reasonably complex things internally. So, the best\
    \ way of understanding what is going on and if your code is using it as expect\
    \ is to enable logging which usually goes to the developer console. All major\
    \ browser vendors now offer good developer tools which include a console:\n\n\
    •[Firebug addon](http://getfirebug.com/)^([30](#chapter-6.xhtml_fn6_30)) for Firefox\n\
    \n•[Google Chrome Developer Tools](http://code.google.com/chrome/devtools/docs/overview.html)^([31](#chapter-6.xhtml_fn6_31))\n\
    \n•Internet Explorer [F12 developer tools](http://msdn.microsoft.com/en-us/library/gg589507(v=VS.85).aspx)^([32](#chapter-6.xhtml_fn6_32))\n\
    \n•[Opera Dragonfly](http://www.opera.com/dragonfly/documentation/)^([33](#chapter-6.xhtml_fn6_33))\n\
    \n•[Safari Developer Tools](https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools/SafariDeveloperTools.html)^([34](#chapter-6.xhtml_fn6_34))\n\
    \nThe Pusher JavaScript library provides a way to hook into the logging functionality.\
    \ All you need to do is assign a function to the [`Pusher.log`](http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log)^([35](#chapter-6.xhtml_fn6_35))\
    \ static property. This function will then receive all log messages. You can do\
    \ what you like within the function but best practice is to log the messages to\
    \ the developer console. You can do this as follow, ensuring the code it executed\
    \ after the Pusher JavaScript library include:\n\n```\nPusher.log = function(msg)\
    \ {\n\tif(window.console && window.console.log) {\n\t\twindow.console.log(new\
    \ Date().getTime() + ': ' + msg);\n\t}\n};\n```\n\nThe code above checks to make\
    \ sure the `console` and `log` function is available – it's not in older browsers\
    \ – and then logs the messages along with a timestamp to the JavaScript console.\
    \ This can be incredibly handy in tracking down problems.\n\n![Screenshot of Pusher\
    \ logging in the Chrome Developer Tools Console](images/javascript_console.png)\n\
    \n#### Check Connectivity"
