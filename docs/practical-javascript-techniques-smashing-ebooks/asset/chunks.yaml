    in and out of the presentation. On seeing it, I was impressed. Looking more closely,
    though, I realized that the checkbox states did not persist after the page reloaded.
    So, someone could spend a long time carefully tweaking their slides, only to accidentally
    hit F5 or crash their browser, and then — boom! — all their work would be lost.
    Christian told me that he was already working on storing the checkbox states in
    `localStorage`. Then, naturally, we endlessly debated the storage format. That
    debate inspired me to write this chapter, to explore the various approaches in
    depth.


    ## Using an Array


    We have two (reasonable) ways to model our data in an array. One is to store true/false
    values, like so:


    ```

    [false, true, true, false, false, true, true]

    ```


    The other is to store an array of 0s and 1s, like so:


    ```

    [0, 1, 1, 0, 0, 1, 1]

    ```


    Whichever solution we go with, we will ultimately have to convert it to a string,
    and then convert it back to an array when it is read. We have two ways to proceed:
    either with the old `Array#join()` (or `Array#toString()`) and `String#split()`,
    or with the fancier `JSON.stringify()` and `JSON.parse()`.


    With the JSON way, the code will be somewhat shorter, although it is the JavaScript
    equivalent of slicing bread with a chainsaw. [Not only there is a performance
    impact in most browsers](http://jsperf.com/json-vs-split-join-for-simple-arrays)^([3](#chapter-8.xhtml_fn8_3)),
    but you''re also cutting down browser support quite a bit.


    The main drawback of using array-based strings is their size in bytes. If you
    go with the number method, you would use almost 2 characters per number (or, more
    precisely, `2N − 1`, since you''d need one delimiter per number, except for the
    last one):


    ```

