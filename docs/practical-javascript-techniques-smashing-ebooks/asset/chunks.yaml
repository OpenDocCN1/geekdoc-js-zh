  trans: "\n\n![运行良好的博客评论系统截图](img/functioning_comments.png)\n\n## 使用 jQuery 进行渐进增强\n\
    \n让我们的博客评论系统感觉更像一个应用程序而不仅仅是一个 Web 页面，第一步是在用户提交评论时停止页面重加载。我们可以通过使用 AJAX 请求将评论发送到服务器来实现这一点。由于\
    \ `jQuery` 可能是跨浏览器 JavaScript 功能的默认标准，我们在这里将使用它。尽管我在这里使用了 `jQuery`，但我还想强调的是，[并不总是使用\
    \ jQuery](http://www.leggetter.co.uk/2012/02/19/jquery-uk-2012-event-dont-always-use-jquery.html)^(13)\
    \ 是一个好主意。相反，请分析你的场景并做出审慎的决定，因为在[某些情况下](http://www.leggetter.co.uk/2012/02/12/considerations-when-updating-the-dom-to-display-realtime-data.html)^(14)\
    \ 最好不要使用。\n\n为了尽可能减少从 `index.php` 文件中保留脚本（PHP 和 JavaScript），我们将为 JavaScript 创建一个新文件夹，并在其中创建一个应用程序的\
    \ JavaScript 文件。该文件的路径应为 `js/app.js`。此文件应该在引入 `jQuery` 之后引入。\n\n```\n<script src=\"\
    http://code.jquery.com/jquery-1.7.1.min.js\"></script>\n<script src=\"js/app.js\"\
    ></script>\n```\n\n### 捕捉评论表单提交\n\n当页面准备就绪时，绑定表单的 `submit` 事件。\n\n```javascript\n\
    $(function() {\n\t$('#commentform').submit(handleSubmit);\n});\n```\n\n当表单提交并调用\
    \ `handleSubmit` 函数时，我们将从表单中提取想要发送到服务器的评论数据。从表单获取数据有更优雅的方法，但这种方法清晰地展示了我们从哪里获取值以及我们正在创建的\
    \ `data` 对象。\n\n```javascript\nfunction handleSubmit() {\n\tvar form = $(this);\n\
    \tvar data = {\n\t\t\"comment_author\": form.find('#comment_author').val(),\n\t\
    \t\"email\": form.find('#email').val(),\n\t\t\"comment\": form.find('#comment').val(),\n\
    \t\t\"comment_post_ID\": form.find('#comment_post_ID').val()\n\t};\n\n\tpostComment(data);\n\
    \n\treturn false;\n}\n\nfunction postComment(data) {\n\t// 将数据发送到服务器\n}\n```\n\
    \n### 使用 AJAX POST 评论\n\n在 `postComment` 函数中，向服务器发送 `POST` 请求，并传递我们从表单获取的数据。当发送请求时，将发送一个额外的\
    \ HTTP 请求头以标识该请求为 AJAX 请求。我们这样做是为了以便如果是 AJAX 请求，我们可以返回 JSON 响应；如果不是，则保持我们的基本功能（更多信息请参阅\
    \ [在服务器上检测 AJAX 事件](http://www.learningjquery.com/2010/03/detecting-ajax-events-on-the-server)^(15)）。我们还定义了两个处理器：`postSuccess`\
    \ 用于处理成功存储，`postError` 用于处理任何失败。\n\n```javascript\nfunction postComment(data)\
    \ {\n\t$.ajax({\n\t\ttype: 'POST',\n\t\turl: 'post_comment.php',\n\t\tdata: data,\n\
    \t\theaders: {\n\t\t\t'X-Requested-With': 'XMLHttpRequest'\n\t\t},\n\t\tsuccess:\
    \ postSuccess,\n\t\terror: postError\n\t});\n}\n\nfunction postSuccess(data, textStatus,\
    \ jqXHR) {\n\t// 将评论添加到 UI\n}\n\nfunction postError(jqXHR, textStatus, errorThrown)\
    \ {\n\t// 显示错误\n}\n```\n\n### 通过评论动态更新用户界面\n\n此时，评论数据正在被发送到服务器并保存，但 AJAX 响应并没有提供任何有意义的响应。此外，评论区域还没有更新以显示新提交的评论，用户必须刷新页面才能看到。让我们从编写更新\
    \ UI 的代码并测试该功能开始。\n\n如果你在想“等一下！我们还没有从 Web 服务器获取显示评论所需的所有数据”，那么你是正确的。然而这并阻止阻止编写更新\
    \ UI 的代码并测试其有效性。方法如下：\n\n```javascript\nfunction postSuccess(data, textStatus,\
    \ jqXHR) {\n\t$('#commentform').get(0).reset();\n\tdisplayComment(data);\n}\n\n\
    function displayComment(data) {\n\tvar commentHtml = createComment(data);\n\t\
    var commentEl = $(commentHtml);\n\tcommentEl.hide();\n\tvar postsList = $('#posts-list');\n\
    \tpostsList.addClass('has-comments');\n\tpostsList.prepend(commentEl);\n\tcommentEl.slideDown();\n\
    }\n\nfunction createComment(data) {\n\tvar html = '' +\n\t'<li><article id=\"\
    ' + data.id + '\" class=\"hentry\">' +\n\t\t'<footer class=\"post-info\">' +\n\
    \t\t\t'<abbr class=\"published\" title=\"' + data.date + '\">' +\n\t\t\t\tparseDisplayDate(data.date)\
    \ +\n\t\t\t'</abbr>' +\n\t\t\t'<address class=\"vcard\">By <a class=\"url\" href=\"\
    ' + data.url + '\">' + data.comment_author + '</a>' +\n\t\t\t'</address>' +\n\t\
    \t\t'<div class=\"entry-content\">' +\n\t\t\t\t'<p>' + data.comment + '</p>' +\n\
    \t\t\t'</div>' +\n\t\t'</footer>' +\n\t'</article></li>';\n\n\treturn html;\n\
    }\n\nfunction parseDisplayDate(date) {\n\tdate = Date(date);\n\treturn ['January',\
    \ 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',\
    \ 'October', 'November', 'December'][date.getMonth()] + ' ' +\n\tdate.getDate()\
    \ + ', ' + date.getFullYear();\n}\n```\n\n上面的代码执行了以下操作：\n\n- 在 `postSuccess` 中我们重置表单并调用\
    \ `displayComment`。\n- `displayComment` 首先调用 `createComment` 创建列表项的字符串。\n- 然后我们将\
    \ HTML 转换为 jQuery 对象并将其隐藏。\n- 将评论插入到评论列表（`<ol>`）中。\n- 列表添加了 `has-comments` 类。\n\
    - 最后，我们调用 `commentEl.slideDown()` 让评论显示。\n\n太棒了！我们现在知道 `displayComment` 正按照我们的预期工作。功能现在已经实现，但我们想要测试它。这可以通过两种方式实现：\n\
    \n- `displayComment` 是一个全局函数，因此可以在控制台中直接调用它。\n- 可以在页面上绑定一个事件来触发模拟更新，即绑定到 *\"u\"\
    * 键。\n\n让我们选择后者并绑定到 `keyup` 事件。当触发时，我们将创建一个包含评论所需信息模拟 `data` 对象并将其传递给 `displayComment`\
    \ 函数。该评论将显示在 UI 中。\n\n```javascript\n$(function() {\n\n\t$(document).keyup(function(e)\
    \ {\n\t\te = e || window.event;\n\t\tif(e.keyCode === 85){\n\t\t\tdisplayComment({\n\
    \t\t\t\t\"id\": \"comment_1\",\n\t\t\t\t\"comment_post_ID\": 1,\n\t\t\t\t\"date\"\
    :\"Tue, 21 Feb 2012 18:33:03 +0000\",\n\t\t\t\t\"comment\": \"The realtime Web\
    \ rocks!\",\n\t\t\t\t\"comment_author\": \"Phil Leggetter\"\n\t\t\t});\n\t\t}\n\
    \t});\n\n});\n```\n\n点击 *\"u\"* 键查看评论出现。\n\n**上线前记得移除测试函数**，否则用户每次按下 *\"u\"* 都会感到非常困惑。\n\
    \n![一大堆假评论的截图](img/fake_comments1.png)\n\n### 检测并响应 AJAX 请求\n\n最后剩下的就是更新 *post_comment.php*\
    \ 文件以检测 AJAX 调用并返回新创建的评论信息。\n\n检测 AJAX 请求是通过检查 `X-Requested-With` 请求头完成：\n\n```php\n\
    $ajax = ($_SERVER['HTTP_X_REQUESTED_WITH'] === 'XMLHttpRequest');\n```\n\n一旦我们知道是\
    \ AJAX 请求，我们就可以更新代码以适当的状态码和评论数据进行响应。我们还需要确保原始功能得以维持。\n\n"
- fmt: "\n```php\n <?php\nrequire('Persistence.php');\n\n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH'\
    \ ] === 'XMLHttpRequest');\n\n$db = new Persistence();\n$added = $db->add_comment($_POST);\n\
    \nif($ajax) {\n\tsendAjaxResponse($added);\n}\nelse {\n\tsendStandardResponse($added);\
    \ \n}\n\nfunction sendAjaxResponse($added) {\n\theader(\"Content-Type: application/x-javascript\"\
    );\n\tif($added) {\n\t\theader( 'Status: 201' );\n\t\techo( json_encode($added)\
    \ );\n\t}\n\telse {\n\t\theader( 'Status: 400' );\n\t}\n}\n\nfunction sendStandardResponse($added)\
    \ {\n\tif($added) {\n\t\theader( 'Location: index.php' );\n\t}\n\telse {\n\t\t\
    header( 'Location: index.php?error=Your comment was not posted due to errors in\
    \ your form submission' );\n\t}\n}\n?>\n```\n\nKey points from the above code\
    \ are:\n\n- The `$db->add_comment($_POST)` call returns the data from the added\
    \ comment which is assigned to the `$added` variable.\n\n- By setting the response\
    \ `Content-Type` to “application/json” we tell jQuery to convert the returned\
    \ string into a JavaScript object. For more information on calling JSON Web services\
    \ see [A Beginner's Guide To jQuery-Based JSON API Clients](http://coding.smashingmagazine.com/2012/02/09/beginners-guide-jquery-based-json-api-clients/)^([16](#chapter-6.xhtml_fn6_16)).\n\
    \n- The `201` status code indicates a successful call and also that a resource\
    \ (the comment) was created by the call.\n\nThe blog commenting system now works\
    \ in a much more dynamic way, instantly showing the user that their comment has\
    \ been posted without refreshing the page. In addition, the way the we've added\
    \ the JavaScript based functionality to the page means that if JavaScript is disabled\
    \ or a JavaScript file fails to load that the system will fallback to the standard\
    \ functionality we first implemented.\n\n### Getting Real-Time—Finally!\n\nAs\
    \ with any \"from scratch\" tutorial it can take a bit of time to get to the **really**\
    \ interesting part, but we're finally here. However, **all the work we've up in\
    \ has been worth it**. Because we've built our commenting system up in a progressively\
    \ enhanced way, plugging Pusher into it is going to be really easy.\n\n#### What\
    \ is Pusher?\n\nAt the start of the tutorial we said that we would use Pusher\
    \ to add the realtime functionality to the application. But what is Pusher?\n\n\
    Pusher is a hosted service for quickly and easily adding realtime features into\
    \ Web and mobile applications. It offers a RESTful API that makes it really easy\
    \ to publish events from any application that can make a HTTP request and a WebSocket\
    \ API for realtime bi-directional communication. You don't even need to use the\
    \ APIs directly as there are [server](http://pusher.com/docs/rest_libraries)^([17](#chapter-6.xhtml_fn6_17))\
    \ (PHP, Ruby, node.js, ASP.NET, Python and more) and [client](http://pusher.com/docs/client_libraries)^([18](#chapter-6.xhtml_fn6_18))\
    \ (JavaScript, iOS, Android, .NET, ActionScript, Arduino and more) libraries available\
    \ in a host of technologies which means you can add realtime functionality to\
    \ an app within minutes ‐ I'm confident you'll be surprised just how easy!\n\n\
    #### Sign up for Pusher and get your API Credentials\n\nIn order to add Pusher-powered\
    \ real-time functionality to a Web application you first need to [sign up for\
    \ a free Sandbox account](http://pusher.com/signup)^([19](#chapter-6.xhtml_fn6_19)).\
    \ After you have signed up you'll be taken to the Pusher dashboard where you'll\
    \ see that a \"Main\" application has been created for you. You'll also see you\
    \ are in the \"API Access\" section for that application where you can grab your\
    \ API credentials.\n\n![Screenshot of API Access section in Pusher Dashboard](images/pusher_main_api_access.png)\n\
    \nFor ease of access create a `pusher_config.php` file and `define` the credentials\
    \ in there so we can refer to them later:\n\n```php\n<?php\ndefine('APP_ID', 'YOUR_APP_ID');\n\
    define('APP_KEY', 'YOUR_APP_KEY');\ndefine('APP_SECRET', 'YOUR_APP_SECRET');\n\
    ?>\n```\n\nIn your version of `pusher_config.php` be sure to replace the values\
    \ which being `‘YOUR_*` with your actual credentials.\n\nYou should also `require`\
    \ this in your `index.php` file. We should also make the `APP_KEY` available to\
    \ the JavaScript runtime as we are going to need it to connect to Pusher.\n\n\
    ```php\n<?php\nrequire('pusher_config.php);\n?>\n\n<script>\nvar APP_KEY = '<?php\
    \ echo(APP_KEY); ?>';\n</script>\n```\n\n#### Real-time JavaScript\n\nThe first\
    \ thing you need to do when adding Pusher to a Web application is include the\
    \ Pusher JavaScript library and connect to Pusher. To connect you'll need to use\
    \ the `key` which you grabbed from the Pusher dashboard. Below you can see all\
    \ that is required to hook up the front-end application to Pusher.\n\nInclude\
    \ the Pusher JavaScript library after the `app.js` include:\n\n```html\n<script\
    \ src=\"http://js.pusher.com/7.0.0.min.js\"></script>\n<script src=\"app.js\"\
    ></script>\n```\n\nAdd the Pusher functionality to `app.js`:\n\n```javascript\n\
    var pusher = new Pusher('APP_KEY', {\n  cluster: 'YOUR_CLUSTER'\n});\n\nvar channel\
    \ = pusher.subscribe('my-channel');\nchannel.bind('new-message', function(data)\
    \ {\n  console.log(data);\n});\n```\n\nThis probably looks too easy to true, so\
    \ here are the details about what the above code does:\n\n- `var pusher = new\
    \ Pusher(APP_KEY)` creates a new instance of a `Pusher` object and in doing so\
    \ connects you to Pusher. The `APP_KEY` value that you set up earlier.\n- `var\
    \ channel = pusher.subscribe('comments-' + commentID);` [Channels](http://pusher.com/docs/channels)^([20](#chapter-6.xhtml_fn6_20))\
    \ provide a great way of organizing streams of real-time data. Here we are subscribing\
    \ to comments for the current blog, uniquely identified by the value of the `commentID`\
    \ hidden input element.\n- `channel.bind('new-message', function(data) { ... });`\
    \ [Events](http://pusher.com/docs/events)^([21](#chapter-6.xhtml_fn6_21)) are\
    \ used to further filter data and are ideal for linking updates to changes in\
    \ the UI. In this case we want to bind to an event which is triggered whenever\
    \ a new comment is added and display it.\n\n#### Sending Real-Time Events using\
    \ the Event Creator\n\nWe can also test out this functionality without writing\
    \ any server-side code by using the Event Creator for your app which can also\
    \ be found in the Pusher dashboard. The Event Creator lets you publish events\
    \ on a channel through a simple user interface. From the code above we can see\
    \ that we want to publish an event named `new_comment` on the `comments-1` channel.\
    \ From the earlier test function we also have an example of the test data we can\
    \ publish.\n\n![Screenshot of Event Creator in Pusher Dashboard](images/event_creator.png)\n\
    \n#### Real-time PHP\n\nAgain, we've proven that our client-side functionality\
    \ works without having to write any server-side code. Now lets add the PHP code\
    \ we need to trigger the new comment event as soon as a comment is posted in our\
    \ comment system.\n\nPusher offers a number of [server-side libraries](http://pusher.com/docs/rest_libraries)^([22](#chapter-6.xhtml_fn6_22))\
    \ which make it easy to publish events in addition to helping with functionality\
    \ such as [private channel](http://pusher.com/docs/private_channels)^([23](#chapter-6.xhtml_fn6_23))\
    \ authentication and providing user information for [presence channels](http://pusher.com/docs/presence)^([24](#chapter-6.xhtml_fn6_24)).\
    \ We just want to use the basic event triggering functionality in the `post_comment.php`\
    \ file so we need to download the [Pusher PHP library](https://github.com/squeeks/Pusher-PHP)^([25](#chapter-6.xhtml_fn6_25))\
    \ ([direct zip file download](https://github.com/squeeks/Pusher-PHP/zipball/master)^([26](#chapter-6.xhtml_fn6_26))).\n\
    \nOnce you've downloaded this zip file, unzip it into the directory along with\
    \ your other files. Your file structure will now look something like this:\n\n\
    •index.php\n\n•css (dir)\n\n•images (dir)\n"
