  trans: "\n我们可以对这些小小的数字弹出窗执行同样的操作：\n\n```\n.bar span {\n   background: -webkit-gradient(linear,\
    \ left top, left bottom, color-stop(0.0, #fff), color-stop(1.0, #e5e5e5));\n \
    \  …\n}\n```\n\n关于 Webkit 渐变色的更多信息，请参阅 [Surfin' Safari](http://webkit.org/blog/175/introducing-css-gradients/)^(16)\
    \ 博客。\n\n继续介绍弹出窗，让我们来引入 `-webkit-transition`。CSS 过渡（transitions）非常易使用和理解。当浏览器检测到元素属性（`height`、`width`、`color`、`opacity`\
    \ 等）发生变化时，它将过渡到新属性。\n\n再次，关于 `-webkit-transition` 和 CSS3 动画的更多信息，请参考 [Surfin'\
    \ Safari](http://webkit.org/blog/138/css-animation/)^(17)。\n\n这是一个示例：\n\n```\n\
    .bar span {\n   background: -webkit-gradient(linear, left top, left bottom, color-stop(0.0,\
    \ #fff), color-stop(1.0, #e5e5e5));\n   display: block;\n   opacity: 0;\n\n  \
    \ -webkit-transition: all 0.2s ease-out;\n}\n\n.bar:hover span {\n   opacity:\
    \ 1;\n}\n```\n\n当你悬停在条形上时，弹出窗的边距（margin）和透明度（opacity）会发生变化。这将触发过渡效果。\n"
- fmt: "\nLike many developers, I bounce merrily between back-end and front-end development,\
    \ and I am as happy working in `PHP` as in `jQuery`. It just depends on which\
    \ hat I'm wearing that day.\n\nBecause this chapter is mainly about jQuery-based\
    \ JSON API clients, we'll focus on client-side code (i.e. `jQuery`). When dealing\
    \ with APIs, and armed with `jQuery`, one is more likely to encounter JSON.\n\n\
    ## Player 1: JSON\n\n[JSON](http://www.json.org/)^([5](#chapter-5.xhtml_fn5_5))\
    \ (or JavaScript Object Notation) is a lightweight, easy and popular way to exchange\
    \ data. jQuery is not the only tool for manipulating and interfacing with JSON;\
    \ it's just my and many others' preferred method. A lot of the services we use\
    \ everyday have JSON-based APIs: Twitter, Facebook and Flickr all send back data\
    \ in JSON format.\n\nA JSON response from an API looks like this:\n\n```\n([{\"\
    score\":\nnull,\"popularity\":\n3,\"translated\":true,\"adult\":\nfalse,\"language\"\
    :\"en\",\"original_name\":\"The Goonies\",\"name\":\"The Goonies\",\"alternative_name\"\
    :\"I Goonies\",\n\"movie_type\":\"movie\",\"id\":9340,\"imdb_id\":\"tt0089218\"\
    ,\n\"url\":\"http://www.themoviedb.org/movie/9340\",\n\"votes\":16,\"rating\"\
    :9.2,\"certification\":\"PG\",\"overview\":\"A young teenager named Mikey Walsh\
    \ finds an old treasure map in his father's attic.\nHoping to save their homes\
    \ from demolition, Mikey and his friends Data Wang, Chunk Cohen, and Mouth Devereaux\
    \ runs off on a big quest to find the secret stash of the pirate One-Eyed Willie.\"\
    ,\"released\":\"1985-06-07\",\n\"posters\":[{\"image\":{\"type\":\"poster\",\"\
    size\":\"original\",\"height\":1500,\"width\":1000,\n\"url\":\"http://cf1.imgobject.com/posters/76b/4d406d767b9aa15bb500276b/the-goonies-original.jpg\"\
    ,\n\"id\":\"4d406d767b9aa15bb500276b\"}}],\"backdrops\":[{\"image\":{\"type\"\
    :\"backdrop\",\"size\":\"original\",\"height\":1080,\"width\":1920,\n\"url\":\"\
    http://cf1.imgobject.com/backdrops/242/4d690e167b9aa13631001242/the-goonies-original.jpg\"\
    ,\n\"id\":\"4d690e167b9aa13631001242\"}}],\"version\":3174,\"last_modified_at\"\
    :\"2011-09-12 13:19:05\"}])\n```\n\nA bit of a mess, right? Compare this to the\
    \ same JSON viewed in Google Chrome's developer console:\n\n[![](images/Screen-Shot-2011-12-21-at-12.53.55.png\
    \ \"Screen Shot 2011-12-21 at 12.53.55\")](http://media.smashingmagazine.com/wp-content/uploads/2011/09/Screen-Shot-2011-09-12-at-22.21.03.png)\n\
    \nThe JSON response is accessible via a jQuery function, allowing us to manipulate,\
    \ display and, more importantly, style it however we want.\n\n## Player 2: jQuery\n\
    \nPersonally, I'd pick jQuery over JavaScript any day of the week. jQuery makes\
    \ things a lot easier for the beginner Web developer who just wants stuff to work\
    \ right off the bat. I use it every day. If I had to complete the same tasks using\
    \ native Javascript, my productivity would grind right down. In my opinion, JavaScript\
    \ is for people who want a deeper understanding of the scripting language and\
    \ the DOM itself. But for simplicity and ease of use, jQuery is where it's at.\n\
    \nIn essence, jQuery is a JavaScript library, with handy functions like `getJSON`.\
    \ This particular function will be the glue that holds our API client together.\n\
    \n## The Goal: A jQuery-Based JSON API Client\n\nI recently submitted to [An Event\
    \ Apart](http://10k.aneventapart.com/)^([6](#chapter-5.xhtml_fn5_6)) the Web app\
    \ that we're about to go through now. It's called [Front Row](http://10k.aneventapart.com/Entry/Details/550)^([7](#chapter-5.xhtml_fn5_7)).\n\
    \nThe idea of the Web app is to take a movie title inputted by the user, run it\
    \ through [TMDb](http://www.themoviedb.org/)^([8](#chapter-5.xhtml_fn5_8))'s API,\
    \ and return the relevant poster. The user could then share it or save it to their\
    \ computer.\n\nThe Web app is split into HTML, CSS and jQuery. We'll focus on\
    \ the jQuery, because that's where the magic happens.\n\n### The HTML\n\nBelow\
    \ is the basic structure of the Web app. Nothing special here.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n   <meta name=\"author\" content=\"Ben Howdle and Dan\
    \ Matthew\">\n   <meta name=\"description\" content=\"A responsive movie poster\
    \ grabber\">\n   <title>Front Row by Ben Howdle</title>\n   <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n   <script src=\"https://ajax.jquery.com/jquery-1.6.2.min.js\"\
    ></script>\n   <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n\
    <div class=\"container\">\n   <header>\n      <h1>Front Row</h1>\n   </header>\n\
    \   <section>\n      <input type=\"text\" placeholder=\"Enter movie title\" id=\"\
    term\">\n      <button id=\"search\">Find me</button>\n   </section>\n   <section\
    \ id=\"poster\"></section>\n   <footer>\n      <p>Created by <a href=\"http://10k.aneventapart.com\"\
    >Ben Howdle</a></p>\n   </footer>\n</div>\n</html>\n```\n\n### The CSS\n\nThe\
    \ JSON response is accessible via a jQuery function, allowing us to manipulate,\
    \ display and, more importantly, style it however we want.\n\n### The jQuery\n\
    \n$(document).ready(function(){\n   var full = $(\"#poster\").length ? true :\
    \ false;\n   if(full == false){\n      $('#poster').empty();\n   }\n   $('#term').focus(function(){\n\
    \      //This is to remove\n      var film = $('#term').val();\n      if(film\
    \ == ''){\n         //If the input was empty, display a message\n         $('#poster').html(\"\
    <h2>Ha! We haven't forgotten to validate! Please enter something.</h2>\");\n \
    \     } else {\n         //They must have entered a value, carry on with API call,\
    \ first display a loading message to notify the user of activity\n         $('#poster').html(\"\
    <h2 class='loading'>Your poster is on its way!</h2>\");\n         $.getJSON(\"\
    http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f3186/\"\
    \ + film + \"?callback=?\", function(json) {\n               //TMDb is nice enough\
    \ to return a message if nothing was found, so we can base our if statement on\
    \ this information\n               if (json != \"Nothing found.\"){\n        \
    \          //Display the poster and a message announcing the result\n        \
    \             $('#poster').html('<h2 class=\"loading\">Well, gee whiz! We found\
    \ you a poster, skip!</</h2>><img id=\"thePoster\" src=' + json[0].posters[0].image.url\
    \ + ' />');\n               }\n         });\n      }\n   });\n});\n"
