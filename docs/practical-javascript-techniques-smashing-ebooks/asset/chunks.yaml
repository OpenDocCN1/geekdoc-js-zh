  trans: "\n\n在本教程的剩余部分中，我将介绍如何构建一个基础博客评论系统、如何使用 `jQuery` 对其进行渐进增强，最后我还将使用我工作的实时 Web\
    \ 服务 `Pusher` 进行再次渐进增强。这不仅演示了使用实时 Web 技术是多么简单，还展示了实时因素可以带来的价值和用户参与度的提升。\n\n###\
    \ 创建通用博客评论系统\n\n### 从模板开始\n\n我想重点关注为博客文章添加实时评论功能，因此**让我们从一个[模板](https://github.com/pusher/realtime-commenting/zipball/start)^(8)开始**。\n\
    \n该模板复用了在[从零开始编写 HTML5 布局](http://coding.smashingmagazine.com/2009/08/04/designing-a-html-5-layout-from-scratch/)^(9)\
    \ 文章中定义的 `HTML5` 布局，我们将开始使用的的文件结构如下（包含一些我们目前不需要担心的额外内容）：\n\n• `css`（目录）（包括 `global-forms.css`、`main.css`、`reset.css`）\n\
    • `images`（目录）\n• `index.php`\n\n### HTML\n\n位于 `index.php` 中的模板 HTML 已经根据《HTML5\
    \ 布局》文章进行了修改，将内容专注于为带有评论的博客文章。你可以[在此处]查看 HTML 源码](https://github.com/pusher/realtime-commenting/blob/start/index.php)^(10)\n\
    \n需要注意的主要元素有：\n\n• `<section id=\"content\">` – 博客文章内容\n• `<section id=\"comments\"\
    >` – 评论出现的地方。这是我们大部分工作所在地\n\n### 评论\n\n现在我们已经准备好了博客文章和显示评论的 HTML，我们还需要让读者能够提交评论的方法，因此让我们添加一个\
    \ `<form>` 元素来收集并将评论详情提交到 `post_comment.php`。我们将此添加到 `<section id=\"comments\"\
    >` 部分的末尾，并包裹在 `<div id=\"respond\">` 中。\n\n```\n<div id=\"respond\">\n\n\t<h3>Leave\
    \ a Comment</h3>\n\n\t<form action=\"post_comment.php\" method=\"post\" id=\"\
    commentform\">\n\n\t\t<label for=\"comment_author\" class=\"required\">Your name</label>\n\
    \t\t<input type=\"text\" name=\"comment_author\" id=\"comment_author\" value=\"\
    \" tabindex=\"1\" required=\"required\">\n\n\t\t<label for=\"email\" class=\"\
    required\">Your email;</label>\n\t\t<input type=\"email\" name=\"email\" id=\"\
    email\" value=\"\" tabindex=\"2\" required=\"required\">\n\n\t\t<label for=\"\
    comment\" class=\"required\">Your message</label>\n\t\t<textarea name=\"comment\"\
    \ id=\"comment\" rows=\"10\" tabindex=\"4\"\t required=\"required\"></textarea>\n\
    \n\t\t<!---- comment_post_ID value hard-coded as 1 -->\n\t\t<input type=\"hidden\"\
    \ name=\"comment_post_ID\" value=\"1\" id=\"comment_post_ID\" />\n\t\t<input name=\"\
    submit\" type=\"submit\" value=\"Submit comment\" />\n\n\t</form>\n\n</div\n```\n\
    \n### 评论表单 CSS\n\n让我们在 `main.css` 中添加以下内容，应用一些 CSS 让界面看起来更好看：\n\n```\n#respond\
    \ {\n\tmargin-top: 40px;\n}\n\n#respond input[type='text'],\n#respond input[type='email'],\
    \ \n#respond textarea {\n\tmargin-bottom: 10px;\n\tdisplay: block;\n\twidth: 100%;\n\
    \n\tborder: 1px solid rgba(0, 0, 0, 0.1);\n\t-webkit-border-radius: 5px;\n\t-moz-border-radius:\
    \ 5px;\n\t-o-border-radius: 5px;\n\t-ms-border-radius: 5px;\n\t-khtml-border-radius:\
    \ 5px;\n\tborder-radius: 5px;\n\n\tline-height: 1.4em;\n}\n```\n\n一旦 HTML 结构、评论表单和\
    \ CSS 都就绪，我们的博客系统就开始看起来更像体面了。\n\n![博客文章和评论系统的截图](img/blog_and_comments.png)\n\n\
    ### 处理评论提交\n\n下一步是编写 PHP 表单提交处理器，用于接收请求并存储评论，即 `post_comment.php`。你应该在应用程序的根目录下创建此文件。\n\
    \n正如我之前提到的，我非常想关注实时功能，因此在你下载的模板中存在一个类，它封装了一些标准的数据检查和持久化功能。该类定义在 `Persistence.php`\
    \ 中（你可以[在此处]查看源码](https://github.com/pusher/realtime-commenting/blob/start/Persistence.php)^(11)），它并不是生产级质量，并且处理：\n\
    \n• 基础验证\n• 基础数据清洗\n• 使用用户 `$_SESSION` 进行非常简单的持久化。这意味着一个用户保存的评论对另一个用户不可用。\n\n\
    这意味着我们不需要花时间设置数据库等所有内容……（注：原文此处存在大量重复的句子 \"This also means that we don't need\
    \ to spend time setting up a database and all that goes into\"，已按语意处理）\n\n###\
    \ 使用 PHP 显示评论\n\n为了让我们的通用评论系统运行起来，我们需要做的最后一件事是更新 `index.php` 以获取并显示评论。这意味着我们同样需要更新\
    \ `index.php` 来获取并显示评论。该类定义在 `Persistence.php` 中以获取并显示评论……（注：原文此处同样存在大量重复句子）。该类定义在\
    \ `Persistence.php` 中以获取并显示评论。\n\n```php\nforeach ($comments as $comment) {\n\t\
    \t\t?>\n\t\t\t<li>&lt;article id=\"comment_<?php echo($comment['id']); ?>\" class=\"\
    hentry\"&gt;\t\n\t\t\t\t<footer class=\"post-info\">\n\t\t\t\t\t&lt;abbr class=\"\
    published\" title=\"<?php echo($comment['date']);\"&gt;\n\t\t\t\t\t\t<?php echo(\
    \ date('d F Y', strtotime($comment['date']) ) ); ?>\n\t\t\t\t\t</abbr>\n\n\t\t\
    \t\t\t<address class=\"vcard author\">\n\t\t\t\t\t\tBy <a class=\"url fn\" href=\"\
    #\"><?php echo($comment['comment_author']); ?></a>\n\t\t\t\t\t</address>\n\t\t\
    \t\t</footer>\n\n\t\t\t\t<div class=\"entry-content\">\n\t\t\t\t\t<p><?php echo($comment['comment']);\
    \ ?></p>\n\t\t\t\t</div>\n\t\t\t</article></li>\n\t\t\t<?php\n\t\t}\n\t?>\n```\n\
    \n由于我们现在可以通过 PHP 访问 `post_ID`，我们应该更新评论表单的 HTML 使用此值。\n\n```html\n&lt;input type=\"\
    hidden\" name=\"comment_post_ID\" value=\"<?php echo($post_ID); ?>\" id=\"comment_post_ID\"\
    \ /&gt;\n```\n\n需要注意的元素有：\n\n• `<section id=\"content\">` – 博客文章内容\n• `<section\
    \ id=\"comments\">` – 评论出现的地方。这是我们大部分工作所在地\n\n```php\n\t\t\t<li>&lt;article id=\"\
    comment_<?php echo($comment['id']); ?>\" class=\"hentry\"&gt;\t\n\t\t\t\t<footer\
    \ class=\"post-info\">\n\t\t\t\t\t&lt;abbr class=\"published\" title=\"<?php echo($comment['date']);\"\
    &gt;\n\t\t\t\t\t\t<?php echo( date('d F Y', strtotime($comment['date']) ) ); ?>\n\
    \t\t\t\t\t</abbr>\n\n\t\t\t\t\t<address class=\"vcard author\">\n\t\t\t\t\t\t\
    By <a class=\"url fn\" href=\"#\"><?php echo($comment['comment_author']); ?></a>\n\
    \t\t\t\t\t</address>\n\t\t\t\t</footer>\n\n\t\t\t\t<div class=\"entry-content\"\
    >\n\t\t\t\t\t<p><?php echo($comment['comment']); ?></p>\n\t\t\t\t</div>\n\t\t\t\
    </article></li>\n```\n\n你会注意到，如果 `$has_comments` 的值为真，则会对有序列表应用一个名为 `has-comments`\
    \ 的额外 CSS 类。这样我们就可以使用 CSS 在显示评论时隐藏“成为第一个评论”的列表项：\n\n```css\n#posts-list.has-comments\
    \ li.no-comments {\n\tdisplay: none;\n}\n```\n\n现在一切都就绪，我们拥有了一个功能完整的博客评论系统。如果你想从这个基础功能评论系统开始编写代码，你也可以[下载到此为止的代码](https://github.com/pusher/realtime-commenting/zipball/basic)^(12)。\n\
    \n"
- fmt: "\n![Screenshot of the functioning blog commenting system](images/functioning_comments.png)\n\
    \n## Progressive Enhancement With jQuery\n\nThe first step in making our blog\
    \ commenting system feel less like a Web page and more like an application is\
    \ to stop page reloads when a user submits a comment. We can do this by submitting\
    \ the comments to the server using an AJAX request. Since `jQuery` is probably\
    \ the defacto standard for cross browser JavaScript functionality we'll use it\
    \ here. Although I'm using `jQuery` here, I'd also like to highlight that it's\
    \ a good idea to [not always use jQuery](http://www.leggetter.co.uk/2012/02/19/jquery-uk-2012-event-dont-always-use-jquery.html)^([13](#chapter-6.xhtml_fn6_13)).\
    \ Instead, analyze your scenario and make a considered decision because there\
    \ are [some cases](http://www.leggetter.co.uk/2012/02/12/considerations-when-updating-the-dom-to-display-realtime-data.html)^([14](#chapter-6.xhtml_fn6_14))\
    \ where you are best not to.\n\nIn an attempt to try and keep as much scripting\
    \ (PHP and JavaScript) from the `index.php` file we'll create a new folder for\
    \ our JavaScript and in there a file for our application JavaScript. The path\
    \ to this fill should be `js/app.js`. This file should be included after the `jQuery`\
    \ include.\n\n```\n<script src=\"http://code.jquery.com/jquery-1.7.1.min.js\"\
    ></script>\n<script src=\"js/app.js\"></script>\n```\n\n### Capture the Comment\
    \ Form Submission\n\nWhen the page is ready bind to the `submit` event of the\
    \ form.\n\n```javascript\n$(function() {\n\t$('#commentform').submit(handleSubmit);\n\
    });\n```\n\nWhen the form is submitted and the `handleSubmit` function is called\
    \ the comment data we want to send to the server is extracted from the form. There\
    \ are more elegant ways of fetching the data from the form but this approach clearly\
    \ shows where we're getting the values from and the `data` object we are creating.\n\
    \n```javascript\nfunction handleSubmit() {\n\tvar form = $(this);\n\tvar data\
    \ = {\n\t\t\"comment_author\": form.find('#comment_author').val(),\n\t\t\"email\"\
    : form.find('#email').val(),\n\t\t\"comment\": form.find('#comment').val(),\n\t\
    \t\"comment_post_ID\": form.find('#comment_post_ID').val()\n\t};\n\n\tpostComment(data);\n\
    \n\treturn false;\n}\n\nfunction postComment(data) {\n\t// send the data to the\
    \ server\n}\n```\n\n### POST the Comment with AJAX\n\nWithin the `postComment`\
    \ function make a `POST` request to the server passing the data that we've retrieved\
    \ from the form. When the request is made an additional HTTP header will be sent\
    \ to identify the request as being an AJAX request. We want to do this so that\
    \ we can return a JSON response if it is an AJAX request and maintain our basic\
    \ functionality if it isn't (for more information on this see [Detected AJAX events\
    \ on the Server](http://www.learningjquery.com/2010/03/detecting-ajax-events-on-the-server)^([15](#chapter-6.xhtml_fn6_15))).\
    \ We also define two handlers; `postSuccess` for handling the comment being successfully\
    \ stored and `postError` to handle any failures.\n\n```javascript\nfunction postComment(data)\
    \ {\n\t$.ajax({\n\t\ttype: 'POST',\n\t\turl: 'post_comment.php',\n\t\tdata: data,\n\
    \t\theaders: {\n\t\t\t'X-Requested-With': 'XMLHttpRequest'\n\t\t},\n\t\tsuccess:\
    \ postSuccess,\n\t\terror: postError\n\t});\n}\n\nfunction postSuccess(data, textStatus,\
    \ jqXHR) {\n\t// add comment to UI\n}\n\nfunction postError(jqXHR, textStatus,\
    \ errorThrown) {\n\t// display error\n}\n```\n\n### Dynamically Updating the User\
    \ Interface with the Comment\n\nAt this point the comment data is being sent to\
    \ the server and saved, but the AJAX response isn't providing any meaningful response.\
    \ Also, the comments section isn't being updated to show the newly submitted comment\
    \ so the user would have to refresh the page to see it. Let's start by writing\
    \ the code to update the UI and test that functionality.\n\nIf you are thinking\
    \ \"Hang on a minute! We don't have all the data we need from the Web server to\
    \ display the comment\" then you are correct. However, this doesn't stop us writing\
    \ the code to update the UI and also testing that it works. Here's how:\n\n```javascript\n\
    function postSuccess(data, textStatus, jqXHR) {\n\t$('#commentform').get(0).reset();\n\
    \tdisplayComment(data);\n}\n\nfunction displayComment(data) {\n\tvar commentHtml\
    \ = createComment(data);\n\tvar commentEl = $(commentHtml);\n\tcommentEl.hide();\n\
    \tvar postsList = $('#posts-list');\n\tpostsList.addClass('has-comments');\n\t\
    postsList.prepend(commentEl);\n\tcommentEl.slideDown();\n}\n\nfunction createComment(data)\
    \ {\n\tvar html = '' +\n\t'<li><article id=\"' + data.id + '\" class=\"hentry\"\
    >' +\n\t\t'<footer class=\"post-info\">' +\n\t\t\t'<abbr class=\"published\" title=\"\
    ' + data.date + '\">' +\n\t\t\t\tparseDisplayDate(data.date) +\n\t\t\t'</abbr>'\
    \ +\n\t\t\t'<address class=\"vcard\">' +\n\t\t\t\t'By <a class=\"url\" href=\"\
    ' + data.url + '\">' + data.comment_author + '</a>' +\n\t\t\t'</address>' +\n\t\
    \t\t'<div class=\"entry-content\">' +\n\t\t\t\t'<p>' + data.comment + '</p>' +\n\
    \t\t\t'</div>' +\n\t\t'</footer>' +\n\t'</article></li>';\n\n\treturn html;\n\
    }\n\nfunction parseDisplayDate(date) {\n\tdate = Date(date);\n\treturn date.getDate()\
    \ + ' ' +\n\t['January', 'February', 'March', 'April', 'May', 'June', 'July',\
    \ 'August', 'September', 'October', 'November', 'December'][date.getMonth()] +\
    \ ' ' +\n\tdate.getFullYear();\n}\n```\n\nThe code above does the following:\n\
    \n- Within `postSuccess` we clear the form and call `displayComment`.\n- `displayComment`\
    \ first calls `createComment` to create the list item as a `String`.\n- We then\
    \ convert the HTML to a jQuery object and hide it.\n- The comment list is then\
    \ prepended to the comments list (`<ol>`).\n- The list also has a class `has-comments`\
    \ added to it.\n- Finally, we call `commentEl.slideDown()` so that the comment\
    \ is shown.\n\nGreat! We now know that our `displayComment` function works exactly\
    \ as we expect to. The functionality is now implemented but we want to test it.\
    \ This can be achieved in two ways:\n\n- `displayComment` is a global function\
    \ so we can call it directly using the console of the browser.\n- We can bind\
    \ to an event on the page that triggers a fake update by binding to the *\"u\"\
    * key.\n\nLet's go with the latter and bind to the `keyup` event. When it is,\
    \ we'll create a fake `data` object containing all the information required to\
    \ create a comment and pass it to `displayComment` function. That comment will\
    \ then be displayed in the UI.\n\nHit the *\"u\"* key a few times and see the\
    \ comments appear.\n\n```javascript\n$(function() {\n\n\t$(document).keyup(function(e)\
    \ {\n\t\te = e || window.event;\n\t\tif(e.keyCode === 85){\n\t\t\tdisplayComment({\n\
    \t\t\t\t\"id\": \"comment_1\",\n\t\t\t\t\"comment_post_ID\": 1,\n\t\t\t\t\"date\"\
    :\"Tue, 21 Feb 2012 18:33:03 +0000\",\n\t\t\t\t\"comment\": \"The realtime Web\
    \ rocks!\",\n\t\t\t\t\"comment_author\": \"Phil Leggetter\"\n\t\t\t});\n\t\t}\n\
    \t});\n\n});\n```\n\n**Remember to remove the test function** before you go live\
    \ or you'll really confuse your user every time they press *\"u\"*.\n\n![Screenshot\
    \ of a bunch of fake comments](images/fake_comments1.png)\n\n### Detect and Responding\
    \ to the AJAX request\n\nAll that's left to do is update the *post_comment.php*\
    \ file to detect the AJAX call and return information about the newly created\
    \ comment.\n\nDetecting the AJAX request is done by checking for the `X-Requested-With`\
    \ header:\n\n```php\n$ajax = ($_SERVER['HTTP_X_REQUESTED_WITH'] === 'XMLHttpRequest');\n\
    ```\n\nOnce we know the request is an AJAX request we can update the code to respond\
    \ with an appropriate status code and the data representing the comment. We also\
    \ need to ensure that the original functionality is maintained. The *post_comment.php*\
    \ code now looks as follows:\n"
