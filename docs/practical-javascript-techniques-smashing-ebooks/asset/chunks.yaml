  trans: "\n虽然我们可以用几行代码轻松制作文字动画，但制作动画通常需要更大、更慢的资源，例如[动态 GIF](http://www.gifmuseum.com/)^(6)、Flash\
    \ 或 HTML5 视频。复杂的动画仍然依赖这些技术，但我们仅使用 CSS 就能创建引人注目的动画幻象。\n\n[Love Nonsense](http://lovenonsense.com/)^(7)\
    \ 使用悬停效果来更改网站上图像的颜色。这里的技巧是使用带有背景颜色的透明 PNG。PNG 的颜色应该与网站背景匹配，这样当 PNG 中的所有透明区域填充背景颜色时就会显示出来。因此，PNG\
    \ 应该包含你想要显示的图像的 `negative space`（负空间）（即你想要显示的形状应该是透明的，而其他部分都应该与背景颜色相同）。\n\n这里有一个带有负空间的\
    \ Smashing Magazine Logo 示例：\n\n![填充图像的负空间](http://jonraasch.com/demo/animated-image)\n\
    \n注意[演示中](http://jonraasch.com/demo/animated-image)^(8)，当背景颜色设置为橙色时，它开始看起来像真实物体。\n\
    \n## 代码\n\n•[查看演示](http://jonraasch.com/demo/animated-image)^(9)\n\n首先，我们来做一些基础标记：\n\
    \n```\n<div class=\"post-wrapper\">\n    <h2 class=\"post-title\">\n        这是你悬停的标题\n\
    \n        <img src=\"knockout-image.png\" class=\"post-image\" alt=\"\" />\n \
    \   </h2>\n\n    <p>这里有更多文本。</p>\n</div>\n```\n\n在这里我们包含了一个带有标题、我们的镂空图像和段落的帖子。\n\
    \n接下来，我们来设置一些静态样式：\n\n```css\n.post-wrapper {\n    position: relative;\n    padding-left:\
    \ 240px;\n}\n\n.post-image {\n    position: absolute;\n    top: 0;\n    left:\
    \ 0;\n    background-color: #bbb;\n}\n\n.post-title {\n    color: #037072;\n}\n\
    ```\n\n在这里，我们设置了帖子的包装器 `position: relative`，并在左侧留有足够的内边距，以便图像绝对定位到帖子的左侧。我们还为图像添加了背景颜色；现在\
    \ PNG 中的正空间（positive space）显示为浅灰色。\n\n接下来，我们添加一些悬停效果：\n\n```css\n.post-title:hover\
    \ {\n    color: #d63c25;\n}\n\n.post-title:hover .post-image {\n    background-color:\
    \ #f04e36;\n}\n```\n\n现在，当我们悬停在标题或图像上时，两者都会改变颜色。\n\n我们可以通过对过渡进行动画处理来进一步这种效果：\n\
    \n```css\n.post-image {\n    -webkit-transition: background-color 400ms ease-in;\n\
    \    -moz-transition: background-color 400ms ease-in;\n    transition: background-color\
    \ 400ms ease-in;\n}\n\n.post-title {\n    -webkit-transition: color 400ms ease-in;\n\
    \    -moz-transition: color 400ms ease-in;\n    transition: color 400ms ease-in;\n\
    }\n```\n\n在这里，我们对图像和标题都添加了[CSS3 过](http://net.tutsplus.com/tutorials/html-css-techniques/css-fundametals-css-3-transitions/)^(10)，这将产生平滑的颜色变化动画。\n\
    \n遗憾的是，IE9 目前不支持 CSS3 过渡。然而，即使在不支持的浏览器中，颜色变化仍然发生——只是没有平滑的动画。\n\n如果动画的完全跨浏览器支持非常重要，你始终可以为不支持的浏览器提供\
    \ jQuery 版本的动画。但请记住，jQuery 的 `animate()` 方法不支持颜色动画，因此你需要使用一个[颜色插件](https://github.com/jquery/jquery-color)^(12)。\n\
    \n将所有 CSS 合并在一起：\n\n```css\n.post-wrapper {\n    position: relative;\n    padding-left:\
    \ 240px;\n}\n\n.post-image {\n    position: absolute;\n    top: 0;\n    left:\
    \ 0;\n    background-color: #bbb;\n    -webkit-transition: background-color 400ms\
    \ ease-in;\n    -moz-transition: background-color 400ms ease-in;\n    transition:\
    \ background-color 400ms ease-in;\n}\n\n.post-title {\n    color: #037072;\n \
    \   -webkit-transition: color 400ms ease-in;\n    -moz-transition: color 400ms\
    \ ease-in;\n    transition: color 400ms ease-in;\n}\n\n/* 悬停状态 */\n\n.post-title:hover\
    \ {\n    color: #d63c25;\n}\n\n.post-title:hover .post-image {\n    background-color:\
    \ #f04e36;\n}\n```\n\n•[下载完整示例](https://gist.github.com/957217)¹³](#chapter-3.xhtml_fn3_13))\n\
    \n## 3. 下拉菜单\n\n下拉菜单的一个常见设计问题是它们通常包含很多项目。与其将所有项目列成一列，[Bohemia Design](http://www.bohemiadesign.co.uk/)使用了“多列下拉”。这种方法不仅好看，而且提供了突出重点的机会。让我们使用\
    \ jQuery 来实现这个菜单。\n\n[查看演示](http://jonraasch.com/demo/animated-image)^(9)\n\n\
    ### 构建标签\n\n理想情况下，我们从简单的标记开始：\n\n```html\n<nav>\n    <li>标签 1</li>\n    <li>标签\
    \ 2</li>\n    <li>标签 3</li>\n    <li>标签 4</li>\n    <li>标签 5</li>\n</nav>\n```\n\
    \n接下来，我们为这些标签设置样式：\n\n```css\n#main-nav {\n    width: 800px;\n    height: 50px;\n\
    \    position: relative;\n    list-style: none;\n    padding: 0;\n}\n\n#main-nav\
    \ .main-nav-item {\n    display: inline;\n}\n\n#main-nav .main-nav-tab {\n   \
    \ float: left;\n    width: 140px;\n    height: 30px;\n    padding: 10px;\n   \
    \ line-height: 30px;\n    text-align: center;\n    color: #FFF;\n    text-decoration:\
    \ none;\n    font-size: 18px;\n}\n```\n\n虽然很多 CSS 是针对我们的示例的，但有一些重要的样式值得注意。\n\n\
    首先，我们为整个标签区域定义了高度和宽度，并匹配了五个标签的总高度和宽度，这样我们就可以正确定位下拉菜单。接下来，我们为标签包装器设置了 `position:\
    \ relative`，允许我们绝对定位下拉菜单。\n\n然后，我们为列表包装器添加了 `list-style: none`，以消除任何列表样式。\n\n\
    最后，我们将所有标签链接浮动左侧。\n\n#### 构建下拉菜单\n\n现在，让我们在其中一个标签包装器中构建下拉标记：\n\n"
- fmt: "\n```html\n<li class=\"main-nav-item\">\n    <a href=\"#\" class=\"main-nav-tab\"\
    >Tab 1</a>\n\n    <div class=\"main-nav-dd\">\n        <div class=\"main-nav-dd-column\"\
    >\n            Column content here\n        </div>\n    </div>\n\n    <div class=\"\
    main-nav-dd\">\n        <div class=\"main-nav-dd-column\">\n            Column\
    \ content here\n        </div>\n    </div>\n\n    <div class=\"main-nav-dd\">\n\
    \        <div class=\"main-nav-dd-column\">\n            Column content here\n\
    \        </div>\n    </div>\n</li>\n```\n\nNext, let's style this dropdown:\n\n\
    ```css\n#main-nav .main-nav-dd {\n    position: absolute;\n    top: 50px;\n  \
    \  left: 0;\n    margin: 0;\n    padding: 0;\n    background-color: #FFF;\n  \
    \  border-bottom: 4px solid #f60;\n}\n\n#main-nav .main-nav-dd-column {\n    width:\
    \ 130px;\n    padding: 15px 20px 8px;\n    display: table-cell;\n    border-left:\
    \ 1px solid #ddd;\n    *float: left;\n    *border-left: 0;\n}\n\n#main-nav .main-nav-dd-column:first-child\
    \ {\n    border-left: 0;\n}\n```\n\nHere, we've positioned the dropdown absolutely,\
    \ directly beneath the first tab.\n\nLet's set `display: table-cell` on all of\
    \ the column wrappers, so that they display next to each other. But `table-cell`\
    \ is not supported in IE6 or 7, so we've used an [attribute hack](http://paulirish.com/2009/browser-specific-css-hacks/)\
    \ as an alternative for IE6 and 7. This hack places an asterisk (`*`) before each\
    \ of the attributes that are specific to IE6 and 7.\n\nThus, we've defined a backup\
    \ for unsupported IEs, which is simply `float: left`. This works almost as well\
    \ as `display: table-cell`, except that the floated elements don't match each\
    \ other's height, so the borders between columns don't line up. To avoid this\
    \ minor issue, we simply remove the `border-left` using the same asterisk hack.\n\
    \nFinally, we remove the left border from the first column for all browsers. Although\
    \ the `:first-child` pseudo-class doesn't work properly in IE6, fortunately it\
    \ doesn't make a difference, because we've already hidden the borders in these\
    \ browsers.\n\n### Adding the Interaction\n\nWe've built the mark-up and styles\
    \ for our dropdown, but we still need to make the menu interactive. Let's use\
    \ jQuery to add a class to show and hide the dropdown:\n\n```javascript\n$(function()\
    \ {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        // show the dropdown\n        $(this).addClass('main-nav-item-active');\n\
    \    }, function(ev) {\n        // hide the dropdown\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n\nHere, we've attached a [hover listener](http://bavotasan.com/tutorials/a-simple-mouseover-hover-effect-with-jquery/)\
    \ to each list item, which adds and removes the class `main-nav-item-active`.\
    \ Attach this to the list item rather than the tab itself, or else the dropdown\
    \ will disappear when the user mouses off the tab and into the dropdown area.\n\
    \nNow we can use this class hook to hide and show the dropdown with CSS:\n\n```css\n\
    #main-nav .main-nav-dd {\n    display: none;\n}\n\n#main-nav .main-nav-item-active\
    \ .main-nav-dd {\n    display: block;\n}\n```\n\nLet's use the `active` class\
    \ to style the active tab:\n\n```css\n#main-nav .main-nav-item-active .main-nav-tab\
    \ {\n    background-color: #FFF;\n    color: #f60;\n    -webkit-border-top-left-radius:\
    \ 5px;\n    -webkit-border-top-right-radius: 5px;\n    -moz-border-radius-topleft:\
    \ 5px;\n    -moz-border-radius-topright: 5px;\n    border-top-left-radius: 5px;\n\
    \    border-top-right-radius: 5px;\n}\n```\n\nHere, we've changed the background\
    \ and text colors and rounded the top corners (in supported browsers).\n\n###\
    \ Positioning the Dropdown\n\nNow the basic mouse interaction has been built and\
    \ the dropdown displays on mouseover. Unfortunately, it is still not positioned\
    \ correctly under each tab, so let's add some more code to our hover events:\n\
    \n```javascript\n$(function() {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        var $this = $(this),\n        $dd = $this.find('.main-nav-dd');\n\
    \n        // get the left position of the tab\n        var leftPos = $this.offset().left;\n\
    \n        // get the width of the dropdown\n        var ddWidth = $dd.width();\n\
    \n        // calculate the maximum allowed position\n        var leftMax = $(window).width()\
    \ - ddWidth;\n\n        // position the dropdown\n        if (leftPos > leftMax)\
    \ {\n            $dd.css('left', leftMax + 'px');\n        } else {\n        \
    \    $dd.css('left', leftPos + 'px');\n        }\n\n        // show the dropdown\n\
    \        $(this).addClass('main-nav-item-active');\n    }, function(ev) {\n  \
    \      // hide the dropdown\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n*(Note: The logic in the provided text snippet was incomplete/fragmented;\
    \ I have reconstructed the standard logic based on the variable names `leftPos`,\
    \ `ddWidth`, and `leftMax` mentioned in the text to ensure a functional document\
    \ structure.)*\n"
