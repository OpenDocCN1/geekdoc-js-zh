  trans: "\nWordPress 包含了这些库，以便插件和主题作者可以通过使用 `wp_register_script` 和 `wp_enqueue_script`\
    \ PHP 函数将 JavaScript 包含在 HTML 中，从而避免此类问题。\n\n仅注册文件对你的 HTML 输出没有产生影响；它只是将该文件添加到\
    \ WordPress 的已知脚本列表中。正如你在下一节中看到的，我们会在主题或插件的早期阶段注册文件，这样我们可以跟踪版本信息。\n\n要将文件输出到 HTML\
    \ 中，你需要入队（enqueue）该文件。一旦完成此操作，WordPress 将在输出页面的头部（header）或页脚（footer）处添加所需的脚本标签。本文稍后将提供更多细节。\n\
    \n注册文件比入队文件需要更复杂的代码；因此在审查代码时，快速解析文件比较困难。入队文件要简单得多，你可以轻松分析 HTML 是如何受到影响的。\n\n为了让这些技术生效，主题的\
    \ `header.php` 文件必须在 `</head>` 标签之前包含 `<?php wp_head(); ?>` 行，且 `footer.php` 文件必须在\
    \ `</body>` 标签之前包含 `<?php wp_footer(); ?>` 行。\n\n### 注册 JavaScript\n\n在注册 JavaScript\
    \ 之前，你需要决定一些额外项目：\n\n- 文件的句柄（handle，即 WordPress 用来识别文件的名称）；\n- 该文件依赖的其他脚本（例如，jQuery）；\n\
    - 版本号（可选）；\n- 文件将出现在 HTML 的哪个位置（头部或页脚）。\n\n本章指的是构建一个主题，但这些技巧同样适用于构建插件。\n\n###\
    \ 示例\n\n我们将使用两个 JavaScript 文件来展示这些函数的威力：\n\n第一个是 `base.js`，它是我们示例网站中使用的一个函数工具包。\n\
    \n```javascript\nfunction makeRed(selector){\n  var $ = jQuery; //在此此作用域内启用 $\
    \ 别名\n  $(function(){\n    $(selector).css('color','red');\n  });\n}\n```\n\n\
    `base.js` 文件依赖 `jQuery`，因此 `jQuery` 可以被视为依赖项。\n\n这是该文件的第一个版本，版本 1.0.0，没有理由在 HTML\
    \ 头部中运行此文件。\n\n第二个文件 `custom.js` 用于为我们的网站添加 JavaScript 功能。\n\n```javascript\n\
    makeRed('*'); \n```\n\n此 `custom.js` 文件调用了 `base.js` 中的函数，因此 `base.js` 是一个依赖项。\n\
    \n与 `base.js` 一样，`custom.js` 版本为 1.0.0，可以在 HTML 页脚运行。\n\n`custom.js` 文件也间接依赖 `jQuery`。但在情况下，`base.js`\
    \ 可以被编辑为自包含或依赖另一个框架。没有必要将 `jQuery` 列为 `custom.js` 的依赖项。\n\n现在只需使用 `wp_register_script`\
    \ 函数注册你的 JavaScript 即可。它接受以下参数：\n\n- `$handle`: 字符串\n- `$source`: 字符串\n- `$dependancies`:\
    \ 数组（可选）\n- `$version`: 字符串（可选）\n- `$in_footer`: 真/假（可选，默认为假）\n\n在注册脚本时，最好使用 `init`\
    \ 钩子并一次性注册所有脚本。\n\n要注册示例中的脚本，请向主题的 `functions.php` 文件添加以下内容：\n\n```php\nfunction\
    \ mytheme_register_scripts() { \n  //base.js – 依赖 jQuery \n  wp_register_script(\
    \ \n    'theme-base', //句柄 \n    '/wp-content/themes/my-theme/base.js', //源 \n\
    \    array('jquery'), //依赖 \n    '1.0.0', //版本 \n    true //在页脚运行 \n  ); \n\n\
    \  //custom.js – 依赖 base.js \n  wp_register_script( \n    'theme-custom', \n \
    \   '/wp-content/themes/my-theme/custom.js', \n    array('theme-base'), \n   \
    \ '1.0.0', \n    true \n  ); \n} \nadd_action('init', 'mytheme_register_scripts');\n\
    ```\n\n没有必要注册 `jQuery`，因为 WordPress 已经有了。重复注册它可能会导致问题。\n\n### 你什么都没做！\n\n以上所有以\
    \ WordPress 方式注册 JavaScript 文件的方法到目前为止什么都没实现。没有任何内容会被输出到你的 HTML 文件中。\n\n要让 WordPress\
    \ 输出相关的 HTML，我们需要入队我们的文件。与注册函数所需的相对冗长的命令相比，这是一个非常非常简单的过程。\n\n### 输出 JavaScript\
    \ HTML\n\n在 HTML 中添加 `<script>` 标签是使用 `wp_enqueue_script` 函数完成的。一旦脚本被注册，它接受一个参数：文件的句柄。\n\
    \n在 HTML 中添加 JavaScript 是通过 `wp_print_scripts` 钩子使用以下代码完成的：\n\n```php\nfunction\
    \ mytheme_enqueue_scripts(){ \n  if (!is_admin()): \n    wp_enqueue_script('theme-custom');\
    \ //custom.js \n  endif; //!is_admin \n} \nadd_action('wp_print_scripts', 'mytheme_enqueue_scripts');\n\
    ```\n\n在我们注册的 JavaScript 文件（`base.js` 和 `custom.js`）中，只有第二个为 HTML 添加了 JavaScript\
    \ 功能。\n\n### 注册样式表\n\n向 HTML 添加样式的两个函数是 `wp_register_style` 和 `wp_enqueue_style`。\n\
    \n正如 JavaScript 示例一样，我们在本章中使用了两个 CSS 文件，并采用移动优先的方法。\n\n`mobile.css` 文件适用于所有设备。`desktop.css`\
    \ 文件适用于大屏幕浏览器。\n\n一旦你决定了版本号、依赖项和媒体类型，该是使用 `wp_register_style` 注册你的样式表了。该函数接受以下参数：\n\
    \n- `$handle`: 字符串\n- `$source`: 字符串\n- `$dependancies`: 数组（可选，默认为空）\n- `$version`:\
    \ 字符串（可选，默认为当前 WordPress 版本）\n- `$media_type`: 字符串（可选，默认为 all）\n\n再次，使用 `init`\
    \ 钩子注册样式表是最好的。\n\n向你主题的 `functions.php` 添加以下内容：\n\n```php\nfunction mytheme_register_styles()\
    \ { \n  //适用于所有设备的 mobile.css \n  wp_register_style( \n    'theme-mobile', //句柄\
    \ \n    '/wp-content/themes/my-theme/mobile.css', //源 \n    null, //依赖项 \n   \
    \ '1.0.0', //版本 \n  ); \n\n  //适用于大屏幕浏览器的 desktop.css \n  wp_register_style( \n\
    \    'theme-desktop', \n    '/wp-content/themes/my-theme/desktop.css', \n    array('theme-mobile'),\
    \ \n    '1.0.0', \n    'only screen and (min-width : 960px)' //媒体类型 \n  ); \n\
    } \nadd_action('init', 'mytheme_register_styles');\n```\n\n我们使用了 CSS3 媒体查询来防止移动端浏览器解析我们的桌面样式表。但\
    \ Internet Explorer 8 及以下版本不理解 CSS3 媒体查询\n\n### 条件注释\n\n当使用注册和入队函数注册 CSS 时，条件注释要复杂一些。WordPress\
    \ 使用 `$wp_styles` 对象来存储注册的样式表。\n\n要将你的文件封装在条件注释中，请向此对象添加额外信息。\n\n对于 Internet Explorer\
    \ 8 及以下版本（不包含移动版 IE），我们需要注册另一个样式表副本（使用媒体类型 `all`），并将其封装在条件注释中。\n\n在上面的代码示例中，`/*\
    \ *keep reading* */` 将被替换为以下内容：\n\n"
- fmt: "\n```\nglobal $wp_styles; \nwp_register_style( \n  'theme-desktop-ie', \n\
    \  '/wp-content/themes/my-theme/desktop.css', \n  array('theme-mobile'), \n  '1.0.0'\
    \ \n); \n\n$wp_styles->add_data( \n  'theme-desktop-ie', //handle \n  'conditional',\
    \  //is a conditional comment \n  '!(IEMobile)(lte IE 8)' //the conditional comment\
    \ \n);\n```\n\nUnfortunately, there is no equivalent for wrapping JavaScript files\
    \ in conditional comments, presumably due to the concatenation of JavaScript in\
    \ the admin section.\n\nIf you need to wrap a JavaScript file in conditional comments,\
    \ you will need to add it to `header.php` or `footer.php` in the theme. Alternatively,\
    \ you could use the `wp_head` or `wp_footer` hooks.\n\n## Outputting The Style\
    \ Sheet HTML\n\nOutputting the style sheet HTML is very similar to outputting\
    \ the JavaScript HTML. We use the `enqueue` function and run it on the `wp_print_styles`\
    \ hook.\n\nIn our example, we could get away with telling WordPress to queue only\
    \ the style sheets that have the handles `theme-desktop` and `theme-desktop-ie`.\
    \ WordPress would then output the `mobile`/`all` media version.\n\nHowever, both\
    \ style sheets apply styles to the website beyond a basic reset: `mobile.css`\
    \ builds the website for mobile phones, and `desktop.css` builds on top of that.\
    \ If it does something and I've registered it, then I should enqueue it. It helps\
    \ to keep track of what's going on.\n\nHere is the code to output the CSS to the\
    \ HTML:\n\n```\nfunction mytheme_enqueue_styles(){ \n  if (!is_admin()): \n  \
    \  wp_enqueue_style('theme-mobile'); //mobile.css \n    wp_enqueue_style('theme-desktop');\
    \ //desktop.css \n    wp_enqueue_style('theme-desktop-ie'); //desktop.css lte\
    \ ie8 \n  endif; //!is_admin \n} \nadd_action('wp_print_styles', 'mytheme_enqueue_styles');\n\
    ```\n\n## What's The Point?\n\nYou may be wondering what the point is of going\
    \ through all of this extra effort when we could just output our JavaScript and\
    \ style sheets in the theme's `header.php` or using the `wp_head` hook.\n\nIn\
    \ the case of CSS in a standalone theme, it's a valid point. It's extra work without\
    \ much of a payoff.\n\nBut with JavaScript, it helps to prevent clashes between\
    \ plugins and themes when each uses a different version of a JavaScript framework.\
    \ It also makes page-loading times as fast as possible by avoiding file duplication.\n\
    \n### WordPress Frameworks\n\nThis group of functions can be most helpful when\
    \ using a framework for theming. In my agency, [Soupgiant](http://soupgiant.com/),\
    \ we've built a framework to speed up our production of websites.\n\nAs with most\
    \ agencies, we have internal conventions for naming JavaScript and CSS files.\n\
    \nWhen we create a bespoke WordPress theme for a client, we develop it as a [child\
    \ theme](http://codex.wordpress.org/Child_Themes) of our framework. In the framework\
    \ itself, we register a number of JavaScript and CSS files in accordance with\
    \ our naming convention.\n\nIn the child theme, we then simply enqueue files to\
    \ output the HTML.\n\n```\nfunction clienttheme_enqueue_css() { \n  if (!is_admin()):\
    \ \n    wp_enqueue_style('theme-mobile'); \n    wp_enqueue_style('theme-desktop');\
    \ \n    wp_enqueue_style('theme-desktop-ie'); \n  endif; //!is_admin \n} \nadd_action('wp_print_styles',\
    \ 'clienttheme_enqueue_css'); \n\nfunction clienttheme_enqueue_js() { \n  if (!is_admin()):\
    \ \n    wp_enqueue_script('theme-custom'); \n  endif; //!is_admin\n} \nadd_action('wp_print_scripts',\
    \ 'clienttheme_enqueue_js');\n```\n\nAdding CSS and JavaScript to our themes the\
    \ WordPress way enables us to keep track of exactly what's going on at a glance.\n\
    \n### A Slight Limitation\n\nIf you use a JavaScript framework in your theme or\
    \ plugin, then you're stuck with the version that ships with the current version\
    \ of WordPress, which sometimes falls a version or two behind the latest official\
    \ release of the framework. (Upgrading to a newer version of the framework is\
    \ technically possible, but this could cause problems with other themes or plugins\
    \ that expect the version that ships with WordPress, so I've omitted this information\
    \ from this chapter.)\n\nWhile this prevents you from using any new features of\
    \ the framework that were added after the version included in WordPress, the advantage\
    \ is that all theme and plugin authors know which version of the framework to\
    \ expect.\n\n## A Single Point Of Registration\n\nRegister your styles and scripts\
    \ in a single block of code, so that when you update a file, you will be able\
    \ to go back and update the version number easily.\n\nIf you use different code\
    \ in different parts of the website, you can wrap the logic around the enqueue\
    \ scripts.\n\nIf, say, your archive pages use different JavaScript than the rest\
    \ of the website, then you might register three files:\n\n- base JavaScript (registered\
    \ as `theme-base`),\n- archive JavaScript (registered as `theme-archive`),\n-\
    \ general JavaScript (registered as `theme-general`).\n\nAgain, the base JavaScript\
    \ adds nothing to the website. Rather, it is a group of functions the other two\
    \ rely on. You could then enqueue the files using the following code:\n\n```\n\
    function mytheme_enqueue_js(){ \n  if (is_archive()) { \n    wp_enqueue_script('theme-archive');\
    \ \n  } elseif (!is_admin()) {\n    wp_enqueue_script('theme-general');\n  }\n\
    }\nadd_action('wp_print_scripts', 'mytheme_enqueue_js');\n```\n\n### Using The\
    \ Google CDN\n\nWhile using JavaScript the WordPress way will save you the problem\
    \ of common libraries conflicting with each other, you might prefer to serve these\
    \ libraries from Google's server rather than your own.\n\nUsing Jason Penny's\
    \ [Use Google Libraries](http://wordpress.org/extend/plugins/use-google-libraries/)\
    \ is the easiest way to do this. The plugin automatically keeps jQuery in noConflict\
    \ mode.\n"
