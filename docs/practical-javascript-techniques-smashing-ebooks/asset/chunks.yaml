  trans: "\n\n• [jQuery](http://jquery.com/)^(7)。练习安全的脚本编写并获取最新版本。保持 jQuery 网站开启，以便你随时查阅文档。\n\
    \n• 可能需要一个图像编辑器，例如[Paint](http://www.microsoft.com/resources/documentation/windows/xp/all/proddocs/en-us/mspaint_overview.mspx?mfr=true)^(8)，用来草拟你的图表可能的样子。\n\
    \n• 一个现代且体面的 Web 浏览器用于预览更改。\n\n这些足够了。请注意，本教程并非为了介绍 HTML、`CSS`、`jQuery` 或僵尸。我们假设你已经对这三项技术以及不死生物有一定的中级了解。\n\
    \n### 标记语言 (The Mark-Up)\n\n你可以通过多种方式创建图表的底层 HTML。在本教程中，我们将从 `table` 开始，因为在没有应用\
    \ `JavaScript` 或 `CSS` 的情况下，它在视觉上最符合逻辑。这在无可访问性方面是一个巨大的加分项。\n\n快！你刚刚收到了一些令人震惊的数字。预计棕色僵尸的人口在未来几年内将失控。碳虎和蓝猴正面临紧迫的威胁。然后，棕色僵尸可能会来找我们。但你只是一个设计师。你能做些什么来帮助呢？\n\
    \n我知道！你可以制作一个网页，用精美、冷静且平滑动画的图形来展示我们迫在眉睫的灭亡！\n\n首先，让我们把这些数据放入一个表中，每一年为列，不同物种为行为行。\n\
    \n```html\n<!doctype html>\n<html lang=\"en\">\n   <head>\n      <meta charset=\"\
    utf-8\">\n      <meta name=\"viewport\" content=\"width=1024\">\n      <title>Example\
    \ 01: No CSS</title>\n   </head>\n\n   <body>\n      <div id=\"wrapper\">\n  \
    \       <div class=\"chart\">\n            <h3>Population of endangered species\
    \ from 2012 to 2016</h3>\n            <table id=\"data-table\" border=\"1\" cellpadding=\"\
    10\" cellspacing=\"0\"\n            summary=\"The effects of the zombie outbreak\
    \ on the populations\n            of endangered species from 2012 to 2016\">\n\
    \               <caption>Population in thousands</th>\n               <thead>\n\
    \                  <tr>\n                     <td>&nbsp;</td>\n              \
    \       <th scope=\"col\">2012</th>\n                     <th scope=\"col\">2013</th>\n\
    \                     <th scope=\"col\">2014</th>\n                     <th scope=\"\
    col\">2015</th>\n                     <th scope=\"col\">2016</th>\n          \
    \        </tr>\n               </thead>\n               <tbody>\n            \
    \      <tr>\n                     <th scope=\"row\">Carbon Tiger</th>\n      \
    \               <td>4080</td>\n                     <td>6080</td>\n          \
    \           <td>6240</td>\n                     <td>3520</td>\n              \
    \       <td>2240</td>\n                  </tr>\n                  <tr>\n     \
    \                <th scope=\"row\">Blue Monkey</th>\n                     <td>5680</td>\n\
    \                     <td>6880</td>\n                     <td>6240</td>\n    \
    \                 <td>5120</td>\n                     <td>2640</td>\n        \
    \          </tr>\n                  <tr>\n                     <th scope=\"row\"\
    >Tanned Zombie</th>\n                     <td>1040</td>\n                    \
    \ <td>1760</td>\n                     <td>2880</td>\n                     <td>4720</td>\n\
    \                     <td>7520</td>\n                  </tr>\n               </tbody>\n\
    \            </table>\n         </div>\n      </div>\n   </body>\n</html>\n```\n\
    \n查看下方的示例以了解它在没有应用 `CSS` 或 `JavaScript` 的原始状态下的外观。此 `table` 的可访问性将使使用屏幕阅读器的人理解数据和背后的信息，即：“快去逃命吧！僵尸来了！”\n\
    \n![screenshot\")](http://provide.smashingmagazine.com/graph_tut_files/ex_01.html)\n\
    \n简单部分现在已经完成了。现在，让我们利用 `CSS` 和 `JavasScript`（通过 `jQuery`）的力量来真正说明这些数字告诉了我们什么。从技术上说，我们的目标是创建一个在所有现代浏览器中运行的图表，从\
    \ `IE 8` 开始。\n\n我说过所有现代浏览器了吗？`IE 8` 很幸运：它能和这些酷的孩子待在一起。支持 `CSS3` 的浏览器将获得一些额外的装饰。\n\
    \n### “合合你们的力量……”\n\n如果你想召唤[地球之神](http://en.wikipedia.org/wiki/Captain_Planet)^(9)，你[可以](http://en.wikipedia.org/wiki/Planeteer#Kwame\
    \ \"Earth!\")^(10)[拥有](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\"\
    )^(11)\n\n*(注：输入文本末尾包含了一些重复/损坏的字符串；我已经处理了文档的逻辑结构。)*\n\n**[地球之神]...**\n\n**“合合你们的力量……”**\n\
    \n如果你想召唤[地球之神](http://en.wikipedia.org/wiki/Captain_Planet)^(9)，你[可以](http://en.wikipedia.org/wiki/Planeteer#Kwame\
    \ \"Earth!\")^(10)[拥有](http://en.wikipedia.org/wiki/Planeteer#Wheeler \"Fire!\"\
    )^(11)\n\n### 获取数据\n\n除了简单显示数据之外，一个良好的柱状图还应该有一个漂亮的大标题、清晰标记的轴和颜色编码的图例。我们需要从表格中提取数据，并以一种在图表中更有意义的方式对其进行格式化。为了这一点，我们将创建一个\
    \ JavaScript 对象，将数据存储在方便的小函数中。让我们诞生我们的 `tableData{}` 对象吧：\n\n"
- fmt: "\n```\n// Create table data object\nvar tableData = {\n   // Get numerical\
    \ data from table cells\n   chartData: function() {\n      …\n   },\n   // Get\
    \ heading data from table caption\n   chartHeading: function() {\n      …\n  \
    \ },\n   // Get legend data from table body\n   chartLegend: function() {\n  \
    \    …\n   },\n   // Get highest value for y-axis scale\n   chartYMax: function()\
    \ {\n      …\n   },\n   // Get y-axis data from table cells\n   yLegend: function()\
    \ {\n      …\n   },\n   // Get x-axis data from table header\n   xLegend: function()\
    \ {\n      …\n   },\n   // Sort data into groups based on number of columns\n\
    \   columnGroups: function() {\n      …\n   }\n}\n```\n\nWe have several functions\
    \ here, and they are explained in the code's comments. Most of them are quite\
    \ similar, so we don't need to go through each one. Instead, let's pick apart\
    \ one of them, `columnGroups`:\n\n```javascript\n// Sort data into groups based\
    \ on number of columns\ncolumnGroups: function() {\n   var columnGroups = [];\n\
    \   // Get number of columns from first row of table body\n   var columns = data.find('tbody\
    \ tr:eq(0) td').length;\n   for (var i = 0; i < columns; i++) {\n      columnGroups[i]\
    \ = [];\n      data.find('tbody tr').each(function() {\n         columnGroups[i].push($(this).find('td').eq(i).text());\n\
    \      });\n   }\n   return columnGroups;\n}\n```\n\nHere's how it breaks down:\n\
    \n- Create the `columnGroups[]` array to store the data;\n- Get the number of\
    \ columns by counting the table cells (`td`) in the first row;\n- For each column,\
    \ find the number of rows in the table body (`tbody`), and create another array\
    \ to store the table cell data;\n- Then loop through each row and grab the data\
    \ from each table cell (via the jQuery `text()` function), and then add it to\
    \ the table cell data array.\n\nOnce our object is full of juicy data, we can\
    \ start creating the elements that make up our graph.\n\n### Using The Data\n\n\
    Using the jQuery `$.each` function, we can now loop through our data at any point\
    \ and create the elements that make up our graph. One of the trickier bits involves\
    \ inserting the bars that represent each species inside the yearly columns.\n\n\
    Here's the code:\n\n```javascript\n// Loop through column groups, adding bars\
    \ as we go\n$.each(columnGroups, function(i) {\n   // Create bar group container\n\
    \   var barGroup = $('<div class=\"bar-group\"></div>');\n   // Add bars inside\
    \ each column\n   for (var j = 0, k = columnGroups[i].length; j < k; j++) {\n\
    \      // Create bar object to store properties (label, height, code, etc.) and\
    \ add it to array\n      // Set the height later in displayGraph() to allow for\
    \ left-to-right sequential display\n      var barObj = {};\n      barObj.label\
    \ = this[j];\n      barObj.height = Math.floor(barObj.label / chartYMax * 100)\
    \ + '%';\n      barObj.bar = $('<div class=\"bar fig' + j + '\"><span>' + barObj.label\
    \ + '</span></div>')\n         .appendTo(barGroup);\n      bars.push(barObj);\n\
    \   }\n   // Add bar groups to graph\n   barGroup.appendTo(barContainer);\n});\n\
    ```\n\nExcluding the headings, our table has five columns with three rows. For\
    \ our graph, this means that for each column we create, three bars will appear\
    \ in that column. The following image shows how our graph will be constructed:\n\
    \n![screenshot](images/graph-tut-image-construction.png \"graph-tut-image-construction\"\
    )\n\nBreaking it down:\n\n- For each column, create a container `div`;\n- Loop\
    \ inside each column to get the row and cell data;\n- Create a bar object (`barObj{}`)\
    \ to store the properties for each bar, such as its label, height and mark-up;\n\
    - Add the mark-up property to the column, applying a CSS class of `'.fig' + j`\
    \ to color code each bar in the column, wrapping the label in a `span`;\n- Add\
    \ the object to our `bars[]` array so that we can access the data later;\n- Piece\
    \ it all together by adding the columns to a container element.\n\nBonus points\
    \ if you noticed that we didn't set the height of the bars. This is so that we\
    \ have more control later on over how the bars are displayed.\n\nNow that we have\
    \ our bars, let's work on labelling our graph. Because the code to display the\
    \ labels is quite similar, talking you through all of it won't be necessary. Here's\
    \ how we display the y-axis:\n\n```javascript\n// Add y-axis to graph\nvar yLegend\
    \   = tableData.yLegend();\nvar yAxisList   = $('<ul class=\"y-axis\"></ul>');\n\
    $.each(yLegend, function(i) {\n   var listItem = $('<li><span>' + this + '</span></li>')\n\
    \      .appendTo(yAxisList);\n});\nyAxisList.appendTo(graphContainer);\n```\n\n\
    This breaks down as follows:\n\n- Get the relevant table data for our labels,\n\
    - Create an unordered list (`ul`) to contain our list items;\n- Loop through the\
    \ label data, and create a list item (`li`) for each,\n- `yAxisList.appendTo(graphContainer)`\n\
    \n### Displaying The Data\n\nNow that we have our bars, let's work on labelling\
    \ our graph. Because the code to display the labels is quite similar, talking\
    \ you through all of it won't be necessary. Here's how we display the y-axis:\n\
    \n```javascript\n// Add y-axis to graph\nvar yLegend   = tableData.yLegend();\n\
