    &lt;abbr class=\"published\" title=\"<?php echo($comment['date']); ?>\"&gt;\n\t\
    \t\t\t\t\t<?php echo( date('d F Y', strtotime($comment['date']) ) ); ?>\n\t\t\t\
    \t\t</abbr>\n\n\t\t\t\t\t<address class=\"vcard author\">\n\t\t\t\t\t\tBy <a class=\"\
    url fn\" href=\"#\"><?php echo($comment['comment_author']); ?></a>\n\t\t\t\t\t\
    </address>\n\t\t\t\t</footer>\n\n\t\t\t\t<div class=\"entry-content\">\n\t\t\t\
    \t\t<p><?php echo($comment['comment']); ?></p>\n\t\t\t\t</div>\n\t\t\t</article></li>\n\
    \t\t\t<?php\n\t\t}\n\t?>\n&lt;/ol&gt;\n```\n\nYou'll notice that if the value\
    \ of `$has_comments` is true an additional CSS class is applied to the ordered\
    \ list called *has-comments*. This is so we can hide the list item with the \"\
