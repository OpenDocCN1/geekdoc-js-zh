    \ 38px;\n    line-height: 1;\n    margin: 0 0 10px;\n    text-transform: uppercase;\n\
    }\n\n.hover-panel p {\n    font-size: 12px;\n    width: 65%;\n}\n```\n\nNow let's\
    \ add a static hover effect to change some of the colors and add a drop shadow:\n\
    \n```\n.hover-panel:hover {\n    background-color: #237ABE;\n}\n\n.hover-panel:hover\
    \ h3 {\n    color: #FFF;\n    text-shadow: rgba(0, 0, 0, 0.398438) 0px 0px 4px;\n\
    }\n\n.hover-panel:hover p {\n    color: #FFF:\n}\n```\n\nFinally, let's add a\
    \ background image that pops into place on hover:\n\n```\n.hover-panel {\n   \
    \ background-image: url(hover-panel-icon.png);\n    background-position: 292px\
    \ 10px;\n    background-repeat: no-repeat;\n}\n\n.hover-panel:hover {\n    background-position:\
    \ 180px 10px;\n}\n```\n\nHere, we've added a few important styles to accomplish\
