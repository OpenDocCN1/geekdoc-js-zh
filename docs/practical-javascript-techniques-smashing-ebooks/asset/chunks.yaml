  trans: "\n重复的 `sea.png` 图像宽度为 65 像素，为了给海面带来波浪效果，我们应该移动相同数量的像素。因为背景是重复的，这恰好实现了我们想要的效果。\n\
    \n另一个酷炫的 CSS3 动画示例发生在玩家登上船并驶出屏幕时。\n\n![船只出航](http://media.smashingmagazine.com/wp-content/uploads/2012/04/4.png)\n\
    \n*船驶出屏幕，显示出“联系我们”（Contact）部分。*\n\n如果玩家回到道路，你会发现船正在“反向”移动，回到原始位置。这听起来很复杂，但使用 CSS3\
    \ 过渡（transitions）你会发现极其简单。我做的只是用 JavaScript 捕获事件来判断用户是否“在船上”。如果用户在上面，我们就给船元素添加\
    \ `.sail` 类，让它驶出；否则，我们不添加该类。同时，我们为 `#contact` 容器添加 `.show` 类，这会平滑地显示出水中的联系表单。船的\
    \ CSS 如下所示：\n\n```\n#boat {\n   position: absolute;\n   bottom: 500px;\n   left:\
    \ 50%;\n   margin-left: -210px;\n   width: 420px;\n   height: 194px;\n   background:\
    \ url(images/boat.png) no-repeat center;\n   -webkit-transition: all 5s linear\
    \ 1.5s;\n   -moz-transition: all 5s linear 1.5s;\n   transition: all 5s linear\
    \ 1.5s;\n}\n```\n\n当我们给它添加 `.sail` 类时，我只是改变了它的 `left` 属性。\n\n```\n#boat.sail {\n\
    \   left: -20%;\n}\n```\n\n带有 `.show` 类的 `#contact` 容器也是一样。在这里，我操作的是 `opacity`\
    \ 属性：\n\n```\n#contact.show {\n   opacity: 1;\n}\n```\n\n剩下的工作由 CSS3 过渡完成。\n\n\
    ## JavaScript 部分\n\n由于我们处理的是一个 2-D 游戏，我们可能想基于某个 JavaScript 游戏引擎，也许是某个现有的框架。但框架的问题在于（除了我用作基础的\
    \ jQuery），它们通常有利于快速起步，但从长远来看，它们可能并不完全符合你的需求。\n\n一个很好的例子是我作品集中的灯箱效果（lightboxes），它们提供了关于我的信息，并在用户进入房屋时激活。\n\
    \n![游戏中灯箱的示例](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)\n\
    \n*游戏中的灯箱示例。（[大图](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)^(6))*\n\
    \n这种功能在普通的 JavaScript 游戏引擎中是不存在的。你可以随时用自己的代码改进现有的框架，但研究别人的代码有时比编写自己的代码花费的时间。此外，如果你重写了别人的代码，当新版本发布时可能会变成问题。\n\
    \n在查看了如 [Crafty](http://craftyjs.com/)^(7)、[LimeJS](http://www.limejs.com/)^(8)\
    \ 和 [Impact](http://impactjs.com/)^(9) 这些确实非常棒的游戏引擎框架后，我觉得我别无选择，必须构建自己的引擎来适应我的需求。\n\
    \n让我们快速回顾一下我在游戏中运行的几个方法。\n\n为了处理键盘箭头事件，我使用了以下代码：\n\n```\n$(window).unbind('keydown').bind('keydown',\
    \ function(event) {\n    switch (event.keyCode) {\n        event.preventDefault();\n\
    \        case 37: // 向左                                                      \
    \         \n            me.moveX(me.leftPos - 5, 'left');\n        break;\n\n\
    \        case 39: // 向右\n            me.moveX(me.leftPos + 5, 'right');\n    \
    \    break;\n\n        case 38: // 上\n            me.moveY(me.topPos - 5, 'up');\n\
    \        break;\n\n        case 40: // 向下\n            me.moveY(me.topPos + 5,\
    \ 'down');\n        break;\n    }\n});\n```\n\n如你所示，代码非常简单。当用户按下向上或向下箭头时，我调用 `moveY()`\
    \ 函数；当他们按下向右或向左时，我调用 `moveX()`。\n\n快速查看其中一个方法就能揭示所有的魔力：\n\n```\nmoveX: function(x,\
    \ dir) {\n    var player = this.player;\n    var canMove = this.canImove(x, null);\
    \           \n    if(canMove){\n        this.leftPos = x;\n        player.animate({'left':\
    \ x + 'px'}, 10);\n    }\n    if(dir == 'left') {\n        this.startMoving('left',\
    \ 2);\n    }\n    else {\n        this.startMoving('right', 3);\n    }\n}\n```\n"
- fmt: "\nOne good practice that I unfortunately learned the hard way is to `keep\
    \ the code as dynamic as possible`. Write your code in such a way that if you\
    \ add more content to the portfolio in future, the code will support it.\n\n##\
    \ Conclusion\n\nAs you can see, developing a 2-D Web-based game is fun and not\
    \ too complicated a task at all. But before rushing to develop your own game portfolio,\
    \ consider that it doesn't suit everyone. If your users don't have any idea what\
    \ `HTML5` is or why `IE 5.5` isn't the “best browser ever,” then your effort will\
    \ be a waste of time, and perhaps this kind of portfolio would alienate them.\
    \ Which is bad.\n\nNevertheless, I learned a lot from this development process\
    \ and I highly recommend, whatever kind of portfolio you choose, that you invest\
    \ a few days in developing your `own` one of a kind portfolio.\n\n—\n\n1. [http://danielsternlicht.com](http://danielsternlicht.com)\n\
    2. [http://sixrevisions.com/html/canvas-element/](http://sixrevisions.com/html/canvas-element/)\n\
    3. [http://danielsternlicht.com](http://danielsternlicht.com)\n4. [http://coding.smashingmagazine.com/2011/12/12/an-introduction-to-object-oriented-css-oocss/](http://coding.smashingmagazine.com/2011/12/12/an-introduction-to-object-oriented-css-oocss/)\n\
    5. [http://css3.bradshawenterprises.com/](http://css3.bradshawenterprises.com/)\n\
    6. [http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png](http://media.smashingmagazine.com/wp-content/uploads/2012/04/5.png)\n\
    7. [http://craftyjs.com/](http://craftyjs.com/)\n8. [http://www.limejs.com/](http://www.limejs.com/)\n\
    9. [http://impactjs.com/](http://impactjs.com/)\n10. [http://www.spritely.net/](http://www.spritely.net/)\n\
    \n# Five Useful Interactive CSS/jQuery Techniques Deconstructed\n\nBy Jon Raasch\n\
    \nWith the wide variety of `CSS3` and `JavaScript` techniques available today,\
    \ it's easier than ever to create unique interactive websites that delight visitors\
    \ and provide a more engaging user experience.\n\nIn this chapter, we'll walk\
    \ through five interactive techniques that you can start using right now.\n\n\
    Besides learning how to accomplish these specific tasks, you'll also master a\
    \ variety of `useful CSS and jQuery tricks` that you can leverage when creating\
    \ your own interactive techniques. The solutions presented here are certainly\
    \ not perfect, so any thoughts, ideas and suggestions on how you would solve these\
    \ design problems would be very appreciated.\n\nSo, let's dive in and start building\
    \ more exciting websites!\n\n## 1. Extruded Text Effect\n\n[![Extruded text effect\
    \ on David DeSandro's site](images/extruded-text-effect.png \"Extruded text effect\
    \ on David DeSandro's website\")](http://desandro.com/)\n\nThe footer of [David\
    \ DeSandro's website](http://desandro.com/) uses extruded text that animates on\
    \ `mouseover`. This interactive text effect is a quick and impressive way to add\
    \ some flare to your website. With only a few lines of `CSS3`, we can make the\
    \ text appear to pop out of the page in `three dimensions`.\n\n• [View the demo](http://jonraasch.com/demo/extrude-on-hover)\n\
    \nFirst let's set up some text (the code is copied from the original site):\n\n\
    ```\n<span class=\"extruded\">Extrude Me</span>\n```\n\nAnd some basic styling\
    \ (the code is copied from the original site):\n\n```\nbody {\n    background-color:\
    \ #444;\n    text-align: center;\n}\n\n.extruded {\n    color: #888;\n    font-family:\
    \ proxima-nova-1, proxima-nova-2, 'Helvetica Neue', Arial, sans-serif;\n    font-size:\
    \ 48px;\n    font-weight: bold;\n    text-shadow: #000 3px 3px;\n}\n```\n\nHere,\
    \ we've applied some basic styles and added a `text-shadow`. But this `text-shadow`\
    \ doesn't look three-dimensional; to accomplish the extruded effect, we'll need\
    \ to `add more text-shadows`:\n\n```\n text-shadow: #000 1px 1px, #000 2px 2px,\
    \ #000 3px 3px;\n```\n\nThis will add three different text-shadows to our text,\
    \ stacked on top of each other to create the three dimensional appearance we want.\n\
    \n### Styling the Hover State\n\nNext, let's add a hover state with a bigger `text-shadow`:\n\
