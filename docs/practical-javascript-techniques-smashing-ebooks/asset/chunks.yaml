  trans: "\n我们现在进入 API 客户端的核心部分。我们使用 `jQuery` 的 [`getJSON`](http://api.jquery.com/jQuery.getJSON/)\
    \ 函数，根据定义，它的作用是“使用 `GET` HTTP 请求从服务器加载 JSON 编码数据”。\n\n接着，我们使用 API 的 URL，在本例中由\
    \ [TMDb 提供](http://api.themoviedb.org/2.1/) 。与许多其他 API 一样，你必须注册你的应用程序以获取密钥（这个过程仅需\
    \ 30 秒）。我们将 API 密钥（`23afca60ebf72f8d88cdcae2c4f31866`）插入到 URL 中，并将用户的电影标题作为搜索参数传递到\
    \ URL 中。\n\n需要提到的一点是，在 URL 末尾添加 `callback=?` 可以允许我们进行跨域 JSON 和 AJAX 调用。千万不要忘记这一点，否则数据将仅限于你自己的域内！这种方法使用了所谓的\
    \ JSONP（或带有填充的 JSON），它基本上允许脚本从不同域的另一个服务器获取数据。为了实现这一点，我们必须在 jQuery 加载数据时指定上述回调函数。它会将\
    \ `?` 替换为自定义函数的名称，从而允许我们轻松地进行跨域调用。\n\n在函数的调中，我们放置了单词 `json`（它持有我们获取的数据），但我们也可以使用\
    \ `data` 或 `message`。\n\n下一个检查是查看是否返回了任何数据。TMDb 在找不到任何内容时非常友好地我们提供了一条“Nothing\
    \ found”（未找到内容）的消息。因此，我们的 `if` 语句是基于这个字符串的值的。\n\n这种检查是特定于 API 的。通常，如果没有找到结果，我们会扩展对象以寻找名为\
    \ `length` 的属性，它会告诉我们返回了多少结果。如果发生这种情况，代码看起来可能像这样：\n\n```javascript\n if (json.length\
    \ != 0){\n```\n\n顺带提一下，在 JSON 调用的回调函数中编写任何代码之前，我们应该熟悉 Chrome 控制台或 Firebug 中返回的结果。这会准确地告诉我们在\
    \ `if` 语句中需要检查什么，更重要的是，应该通过什么路径来获取我们想要的数据。\n\n让我们像这样添加 `console.log(json);`：\n\
    \n```javascript\n$.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f31866/\"\
    \ + film + \"?callback=?\", function(json) {\n         console.log(json);\n```\n\
    \n这将在你喜爱的浏览器控制台中输出类似以下的内容（点击图片查看全尺寸）：\n\n![\n\n这段代码的最后一行输出了我们的海报。我们向用户显示另一个消息，说明我们找到了结果，然后继续显示图像。\n\
    \n让我们花一点时间研究我们是如何通过 `json[0].posters[0].image.url` 这行代码获取海报图像的。\n\n我们使用 `json[0]`\
    \ 的原因是因为——由于我们只想显示一张海报，而且知道 TMDb 结果的相关性很高——我们可以对第一个结果进行豪赌。然后我们像这样访问 `posters`\
    \ 数组：`json[0].posters[0]`。Chrome 甚至告诉我们 `posters` 是一个数组，所以我们知道自己在处理什么。同样，我们访问数组的第一个值，相信它将是最相关的。然后它告诉我们\
    \ `image` 是一个对象，所以我们可以这样访问它：`json[0].posters[0].image`。通过进一步扩展对象，我们看到 `image`\
    \ 包含一个名为 `url` 的属性。太棒了！这包含一个直接的图像链接，我们可以将其用于图像元素的 `src` 属性。\n\n```javascript\n\
    } else {\n\n   //如果没有找到任何内容，我尝试通过显示《探险队》（The Goonies）的海报来幽默一下，并确认他们的搜索没有结果。\n\n\
    \   $.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/\n23afca60ebf72f8d88cdcae2c4f31866/goonies?callback=?\"\
    , function(json) {\n\n      $('#poster').html('<h2 class=\"loading\">很不起，该搜索没有找到任何结果。也许你是在找《探险队》？</h2><img\
