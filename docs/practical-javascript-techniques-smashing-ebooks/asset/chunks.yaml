    \   -webkit-transition: color 400ms ease-in;\n    -moz-transition: color 400ms\
    \ ease-in;\n    transition: color 400ms ease-in;\n}\n\n/* add the hover states\
    \ */\n\n.post-title:hover {\n    color: #d63c25;\n}\n\n.post-title:hover .post-image\
    \ {\n    background-color: #f04e36;\n}\n```\n\n•[Download the complete example](https://gist.github.com/957217)^([13](#chapter-3.xhtml_fn3_13))\n\
    \n•[View the demo](http://jonraasch.com/demo/animated-image)^([9](#chapter-3.xhtml_fn3_9))\n\
    \n### 3\\. Mega Dropdown\n\n[![Mega dropdown menu on Bohemia](images/mega-dropdown-menu.jpg\
    \ \"Mega dropdown menu on Bohemia\")](http://www.bohemiadesign.co.uk/)\n\nOne\
    \ common design problem with dropdown menus is that they often contain a lot of\
    \ items. Instead of presenting all of its items in a long single column, [Bohemia\
    \ Design](http://www.bohemiadesign.co.uk/)^([15](#chapter-3.xhtml_fn3_15)) uses\
    \ a **multi-column dropdown**. This approach not only looks great, but provides\
    \ an opportunity to group the links and highlight the most important ones.\n\n\
    Let's recreate this menu using CSS and jQuery.\n\n•[View the demo](http://jonraasch.com/demo/huge-dropdown-menu)^([16](#chapter-3.xhtml_fn3_16))\n\
    \n#### Building the Tabs\n\nIdeally, we would start with a lean and simple mark-up…\n\
    \n```\n<nav>\n    <li><a href=\"#\">Tab 1</a></li>\n    <li><a href=\"#\">Tab\
    \ 2</a></li>\n    <li><a href=\"#\">Tab 3</a></li>\n    <li><a href=\"#\">Tab\
    \ 4</a></li>\n    <li><a href=\"#\">Tab 5</a></li>\n</nav>\n```\n\n…and use `nav\
    \ li a`, `nav > li` or `nav li` to style the list items in the navigation. The\
    \ child selector doesn't work in IE6 and `nav li` would cause problems since there\
    \ are additional LIs nested in the content area of the dropdown. If you absolutely\
    \ need the site to work for IE6 users as well (and that's what you sometimes will\
    \ have to do), you'll need to have markup similar to the original mark-up in this\
    \ example:\n\n```\n<ul id=\"main-nav\">\n    <li class=\"main-nav-item\">\n  \
    \      <a href=\"#\" class=\"main-nav-tab\">Tab 1</a>\n    </li>\n\n    <li class=\"\
    main-nav-item\">\n        <a href=\"#\" class=\"main-nav-tab\">Tab 2</a>\n   \
    \ </li>\n\n    <li class=\"main-nav-item\">\n        <a href=\"#\" class=\"main-nav-tab\"\
    >Tab 3</a>\n    </li>\n\n    <li class=\"main-nav-item\">\n        <a href=\"\
    #\" class=\"main-nav-tab\">Tab 4</a>\n    </li>\n\n    <li class=\"main-nav-item\"\
    >\n        <a href=\"#\" class=\"main-nav-tab\">Tab 5</a>\n    </li>\n</ul>\n\
    ```\n\nNext, let's style these five tabs:\n\n```\n#main-nav {\n    width: 800px;\n\
    \    height: 50px;\n    position: relative;\n    list-style: none;\n    padding:\
    \ 0;\n}\n\n#main-nav .main-nav-item {\n    display: inline;\n}\n\n#main-nav .main-nav-tab\
    \ {\n    float: left;\n    width: 140px;\n    height: 30px;\n    padding: 10px;\n\
    \    line-height: 30px;\n    text-align: center;\n    color: #FFF;\n    text-decoration:\
    \ none;\n    font-size: 18px;\n}\n```\n\nAlthough a lot of the CSS is specific\
    \ to our example, there are a few important styles to note.\n\nFirst, we've defined\
    \ a height and width for our overall tab area and matched the total height and\
    \ width of all five tabs, so that we can position the dropdown correctly. Next,\
    \ we've defined `position: relative` for the tab wrapper, which will allow us\
    \ to position the dropdown absolutely.\n\nThen, we added `list-style: none` to\
    \ the list wrapper, and `display: inline` to each list item, to eliminate any\
    \ list styling.\n\nFinally, we floated all of the tab links to the left.\n\n####\
    \ Building the Dropdown\n\nNow, let's build the dropdown mark-up in one of our\
    \ tab wrappers:"
