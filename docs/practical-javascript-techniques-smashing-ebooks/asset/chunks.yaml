  trans: "\n\n```php\n <?php\nrequire('Persistence.php');\n\n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH'\
    \ ] === 'XMLHttpRequest');\n\n$db = new Persistence();\n$added = $db->add_comment($_POST);\n\
    \nif($ajax) {\n\tsendAjaxResponse($added);\n}\nelse {\n\tsendStandardResponse($added);\
    \ \n}\n\nfunction sendAjaxResponse($added) {\n\theader(\"Content-Type: application/x-javascript\"\
    );\n\tif($added) {\n\t\theader( 'Status: 201' );\n\t\techo( json_encode($added)\
    \ );\n\t}\n\telse {\n\t\theader( 'Status: 400' );\n\t}\n}\n\nfunction sendStandardResponse($added)\
    \ {\n\tif($added) {\n\t\theader( 'Location: index.php' );\n\t}\n\telse {\n\t\t\
    header( 'Location: index.php?error=Your comment was not posted due to errors in\
    \ your form submission' );\n\t}\n}\n?>\n```\n\n上述代码的关键点在于：\n\n- `$db->add_comment($_POST)`\
    \ 调用返回了所添加评论的数据，并将其赋值给变量 `$added`。\n\n- 通过将响应的 `Content-Type` 设置为“application/json”，我们告诉\
    \ jQuery 将返回的字符串转换为 JavaScript 对象。有关调用 JSON Web 服务的更多信息，请参阅[基于 jQuery 的 JSON API\
    \ 客户端入门指南](http://coding.smashingmagazine.com/2012/02/09/beginners-guide-jquery-based-json-api-clients/)^(16)。\n\
    \n- `201` 状态码表示调用成功，并且表示该调用创建了一个资源（评论）。\n\n博客评论系统现在以一种更加动态的方式运行，无需刷新页面即可立即向用户显示其评论已发布。此外，我们在页面中添加基于\
    \ JavaScript 功能的方法意味着，如果禁用了 JavaScript 或 JavaScript 文件加载失败，系统将回退到我们最初实现的标准功能。\n\
    \n### 终于实现实时性了！\n\n正如任何“从零开始”的教程一样，让它可能需要一些时间才能到达**真正**有趣的部分，但我们终于到达这里了。然而，**我们所做的一切工作都是值得的**。因为我们是以渐增强的方式构建评论系统的，所以将\
    \ Pusher 接入其中将非常容易。\n\n#### 什么是 Pusher？\n\n在教程开始时，我们说我们将使用 Pusher 为应用程序添加实时功能。但\
    \ Pusher 是什么？\n\nPusher 是一个托管服务，用于快速方便地在 Web 和移动应用中添加实时功能。它提供了一个 RESTful API，可以从任何可以发送\
    \ HTTP 请求的应用程序轻松发布事件，以及一个用于实时双向通信的 WebSocket API。你甚至不需要直接使用 API，因为有多种技术支持[服务器](http://pusher.com/docs/rest_libraries)^(17)（PHP,\
    \ Ruby, node.js, ASP.NET, Python 等）和[客户端](http://pusher.com/docs/client_libraries)^(18)（JavaScript,\
    \ iOS, Android, .NET, ActionScript, Arduino 等）库可用，这意味着你可以在几分钟内为应用添加实时功能——我确信你会惊讶于它是有多么简单！\n\
    \n#### 注册 Pusher 并获取你的 API 凭据\n\n为了在 Web 应用中添加 Pusher 驱动的实时功能，你首先需要[注册一个免费沙盒账户](http://pusher.com/signup)^(19)。注册后，将被带到\
    \ Pusher 面板，在那里你会看到为你创建了一个“Main”应用程序。你还会看到处于该应用程序的“API Access”部分，可以在那里获取你的 API\
    \ 凭据。\n\n![Pusher 仪表中 API Access 部分的截图](img/pusher_main_api_access.png)\n\n为了方便访问，创建一个\
    \ `pusher_config.php` 文件并在其中 `define` 凭据，以便我们以后引用它们：\n\n```php\n<?php\ndefine('APP_ID',\
    \ 'YOUR_APP_ID');\ndefine('APP_KEY', 'YOUR_APP_KEY');\ndefine('APP_SECRET', 'YOUR_APP_SECRET');\n\
    ?>\n```\n\n在你的 `pusher_config.php` 版本中，请确保将 `‘YOUR_*` 的值替换为你真实的凭据。\n\n你还应该在 `index.php`\
    \ 文件中 `require` 它。我们还应该让 `APP_KEY` 对 JavaScript 运行时可用，因为我们需要它来连接到 Pusher。\n\n\
    ```php\n<?php\nrequire('pusher_config.php);\n?>\n\n<script>\nvar APP_KEY = '<?php\
    \ echo(APP_KEY); ?>';\n</script>\n```\n\n#### 实时 JavaScript\n\n在 Web 应用中添加 Pusher\
    \ 时需要完成的第一件事是包含 Pusher JavaScript 库并连接到 Pusher。连接你需要使用从 Pusher 面板获取的 `key`。下面你可以看到将前端应用连接到\
    \ Pusher 所需的所有内容。\n\n在包含 `app.js` 之后包含 Pusher JavaScript 库：\n\n```html\n<script\
    \ src=\"http://js.pusher.com\"></script>\n<script src=\"app.js\"></script>\n```\n\
    \n在 `app.js` 中添加 Pusher 功能：\n\n```javascript\nvar pusher = new Pusher('APP_KEY',\
    \ {\n  cluster: 'YOUR_CLUSTER'\n});\n\nvar channel = pusher.subscribe('my-channel');\n\
    channel.bind('new-message', function(data) {\n  console.log(data);\n});\n```\n\
    \n这看起来可能简单得令人置信，这里是上述代码的功能：\n\n- `var pusher = new Pusher(APP_KEY)` 创建了一个 `Pusher`\
    \ 对象的实例，并通过此连接到 Pusher。使用了你之前设置的 `APP_KEY` 值。\n- `var channel = pusher.subscribe('comments-'\
    \ + commentID);` [Channels](http://pusher.com/docs/channels)^(20) 为组织实时数据提供了极佳的方法。在这里我们订阅了\
    \ `commentID` 隐藏输入元素的评论。\n- `channel.bind('new-message', function(data) { ...\
    \ });` [Events](http://pusher.com/docs/events)^(21) 用于进一步过滤数据，并非常适用于链接界面的变化。在这种情况下，我们想要绑定到添加新评论时触发的事件并显示它。\n\
    \n#### 使用 Event Creator 发实时事件\n\n我们也可以通过使用应用的 Event Creator 在不编写任何服务器代码的情况下测试此功能。Event\
    \ Creator 允许通过简单的用户界面在通道上发布事件。从上面的代码中可以看到我们想在 `comments-1` 通道上发布名为 `new_comment`\
    \ 的事件。从之前的测试函数中我们也有可以测试数据的示例。\n\n![Pusher 面板中 Event Creator 的截图](img/event_creator.png)\n\
    \n#### 实时 PHP\n\n再次，我们证明了我们的客户端功能不需要编写任何服务端代码。现在让我们添加所需的 PHP 代码，在评论系统中发布时立即触发新评论事件。\n\
    \nPusher 提供了许多[服务端库](http://pusher.com/docs/rest_libraries)^(22)，除了发布事件，还有助于如[私有通道](http://pusher.com/docs/private_channels)^(23)验证以及为[存在通道](http://pusher.com/docs/presence)^(24)提供用户信息的功能。我们只需要在\
    \ `post_comment.php` 文件中使用基本的事件触发功能，因此我们需要下载 [Pusher PHP 库](https://github.com/squeeks/Pusher-PHP)^(25)\
    \ ([直接 zip 文件下载](https://github.com/squeeks/Pusher-PHP/zipball/master)^(26))。\n\
    \n下载此 zip 文件后，将其解压到包含其他文件的目录中。你的文件结构现在看起来像这样：\n\n•index.php\n\n•css (dir)\n\n\
    •images (dir)\n\n"
- fmt: "\n- `post_comment.php`\n- `pusher_config.php`\n- `Persistence.php`\n- `squeeks-Pusher-PHP`\
    \ (dir) including `lib` (dir) with `Pusher.php`\n\nAn event can be triggering\
    \ in just a few lines of code:\n\n```php\n <?php\nrequire('squeeks-Pusher-PHP/lib/Pusher.php');\n\
    require('pusher_config.php');\n\n$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n\
    $pusher->trigger('comments-1', 'new_comment', array(\n\t\"comment_post_ID\" =>\
    \ 1,\n\t\"date\" => \"Tue, 21 Feb 2012 18:33:03 +0000\",\n\t\"comment\" => \"\
    The realtime Web rocks!\",\n\t\"comment_author\" => \"Phil Leggetter\"\n));\n\
    ?>\n```\n\nHowever, we need to apply a some additional logic before we trigger\
    \ the event:\n\n- Check that the comment was added.\n- Extract the unique comment\
    \ identifier from the `$added` array.\n- Build the text to identify a channel\
    \ name for the submitted comment.\n- Trigger a `new_comment` event on the channel\
    \ with the `$added` data. *Note: The library automatically converts the `$added`\
    \ array variable to JSON to be sent through Pusher.*\n\nTherefore the full `post_comment.php`\
    \ file ends up looking as follows:\n\n```php\n <?php\nrequire('Persistence.php');\n\
    require('squeeks-Pusher-PHP/lib/Pusher.php');\nrequire('pusher_config.php');\n\
    \n$ajax = ($_SERVER[ 'HTTP_X_REQUESTED_WITH' ] === 'XMLHttpRequest');\n\n$db =\
    \ new Persistence();\n$added = $db->add_comment($_POST);\n\nif($added) {\n\t$channel_name\
    \ = 'comments-' . $added['comment_post_ID'];\n\t$event_name = 'new_comment';\n\
    \n\t$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n\t$pusher->trigger($channel_name,\
    \ $event_name, $added);\n}\n\nif($ajax) {\n\tsendAjaxResponse($added);\n}\nelse\
    \ {\n\tsendStandardResponse($added); \n}\n\nfunction sendAjaxResponse($added)\
    \ {\n\theader(\"Content-Type: application/json\");\n\tif($added) {\n\t\theader(\
    \ 'Status: 201' );\n\t\techo( json_encode($added) );\n\t}\n\telse {\n\t\theader(\
    \ 'Status: 400' );\n\t}\n}\n\nfunction sendStandardResponse($added) {\n\tif($added)\
    \ {\n\t\theader( 'Location: index.php' );\n\t}\n\telse {\n\t\theader( 'Location:\
    \ index.php?error=Your comment was not posted due to errors in your form submission'\
    \ );\n\t}\n}\n?> \n```\n\nIf you run the app now in two different browser windows\
    \ you'll see that as soon as you submit a comment in one window that comment will\
    \ instantly (\"magically\") appear in the second window. **We now have a real-time\
    \ commenting system!**\n\n**But…**, we're not done quite yet. You'll also see\
    \ that the comment is shown twice in the window of the user who submitted it.\
    \ This is because the comment has been added by the AJAX callback, and by the\
    \ Pusher event. Because this is a very common scenario, especially if you've built\
    \ an application in a progressively enhanced way as we have, the Pusher server\
    \ libraries expose a way of [excluding a connection/user](http://pusher.com/docs/publisher_api_guide/publisher_excluding_recipients)^([27](#chapter-6.xhtml_fn6_27))\
    \ from receiving the event via Pusher.\n\nIn order to do this you need to send\
    \ a unique connection identifier called a `socket_id` from the client to the server.\
    \ This identifier can then be used to define who will be excluded.\n\n```javascript\n\
    function handleSubmit() {\n\tvar form = $(this);\n\tvar data = {\n\t\t\"comment_author\"\
    : form.find('#comment_author').val(),\n\t\t\"email\": form.find('#email').val(),\n\
    \t\t\"comment\": form.find('#comment').val(),\n\t\t\"comment_post_ID\": form.find('#comment_post_ID').val()\n\
    \t};\n\n\tvar socketId = getSocketId();\n\tif(socketId !== null) {\n\t\tdata.socket_id\
    \ = socketId;\n\t}\n\n\tpostComment(data);\n\n\treturn false;\n}\n\nfunction getSocketId()\
    \ {\n\tif(pusher && pusher.connection.state === 'connected') {\n\t\treturn pusher.connection.socket_id;\n\
    \t}\n\treturn null;\n}\n```\n\nThe changes we've made:\n\n- A new function called\
    \ `getSocketId` has been added to get the `socket_id`. It wraps a check to ensure\
    \ that the `pusher` variable has been set and also that the client is connected\
    \ to Pusher.\n- The `handleSubmit` has been updated to check to see if a `socket_id`\
    \ is available. If it is, this information is posted to the server along with\
    \ the comment data.\n\nOn the server we need to use the `socket_id` parameter\
    \ if it is present and therefore exclude the connection and user who submitted\
    \ the comment, or pass in `null` if it's not:\n\n```php\n $channel_name = 'comments-'\
    \ . $added['comment_post_ID'];\n$event_name = 'new_comment';\n$socket_id = (isset($added['socket_id']))\
    \ ? $added['socket_id'] : null;\n\n$pusher = new Pusher(APP_KEY, APP_SECRET, APP_ID);\n\
    $pusher->trigger($channel_name, $event_name, $added);\n```\n\nThe code above checks\
    \ to make sure the `console` and `log` function is available – it's not in older\
    \ browsers - and then logs the messages along with a timestamp to the JavaScript\
    \ console. This can be incredibly handy in tracking down problems.\n\n### Good\
    \ Real-Time Development\n\nWhen you start doing a lot of JavaScript the browser\
    \ developer tools becomes your friend. I thought I would share a couple of tips\
    \ that can come in handy. All major browser vendors now offer developer tools\
    \ which include a console:\n\n- [Firebug addon](http://getfirebug.com/)^([30](#chapter-6.xhtml_fn6_30))\
    \ for Firefox\n- [Google Chrome Developer Tools](http://code.google.com/chrome/devtools/docs/overview.html)^([31](#chapter-6.xhtml_fn6_31))\n\
    - [Internet Explorer F12 developer tools](https://msdn.microsoft.com/en-us/library/gg589507(v=VS.85).aspx)^([32](#chapter-6.xhtml_fn6_32))\n\
    - [Opera Dragonfly](http://www.opera.com/dragonfly/documentation/)^([33](#chapter-6.xhtml_fn6_33))\n\
    - [Safari Developer Tools](https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools/SafariDeveloperTools.html)\n\
    \n#### Use Browser Developer Tools\n\nThe Pusher JavaScript library provides a\
    \ way to hook into the logging functionality. All you need to do is assign a function\
    \ to the [`Pusher.log`](http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log)^([35](#chapter-6.xhtml_fn6_35))\
    \ static property. This function will then receive all log messages. You can do\
    \ what you like within the function but best practice is to log the messages to\
    \ the developer console. You can do this as follow, ensuring the code it executed\
    \ after the Pusher JavaScript library include:\n\n```javascript\nPusher.log =\
    \ function(msg) {\n\tif(window.console && window.console.log) {\n\t\twindow.console.log(new\
    \ Date().getTime() + ': ' + msg);\n\t}\n};\n```\n"
