  trans: "\n\n```html\n<li class=\"main-nav-item\">\n    <a href=\"#\" class=\"main-nav-tab\"\
    >Tab 1</a>\n\n    <div class=\"main-nav-dd\">\n        <div class=\"main-nav-dd-column\"\
    >\n            Column content here\n        </div>\n    </div>\n\n    <div class=\"\
    main-nav-dd\">\n        <div class=\"main-nav-dd-column\">\n            Column\
    \ content here\n        </div>\n    </div>\n\n    <div class=\"main-nav-dd\">\n\
    \        <div class=\"main-nav-dd-column\">\n            Column content here\n\
    \        </div>\n    </div>\n</li>\n```\n\n接下来，让我们为这个下拉菜单设置样式：\n\n```css\n#main-nav\
    \ .main-nav-dd {\n    position: absolute;\n    top: 50px;\n    left: 0;\n    margin:\
    \ 0;\n    padding: 0;\n    background-color: #FFF;\n    border-bottom: 4px solid\
    \ #f60;\n}\n\n#main-nav .main-nav-dd-column {\n    width: 130px;\n    padding:\
    \ 15px 20px 8px;\n    display: table-cell;\n    border-left: 1px solid #ddd;\n\
    \    *float: left;\n    *border-left: 0;\n}\n\n#main-nav .main-nav-dd-column:first-child\
    \ {\n    border-left: 0;\n}\n```\n\n在这里，我们将下拉菜单设置了绝对定位，直接位于第一个标签页下方。\n\n让我们为所有的列包装器设置\
    \ `display: table-cell`，以便它们并排显示。但 IE6 或 7 不支持 `table-cell`，因此我们使用了[属性技巧 (attribute\
    \ hack)](http://paulirish.com/2009/browser-specific-css-hacks/) 作为 IE6 和 7 的替代方案。这种技巧在每个针对\
    \ IE6 和 7 的特定属性前添加了一个星星号（`*`）。\n\n因此，我们为不支持的 IE 版本定义了一个备用方案，简单就是 `float: left`。它的效果几乎与\
    \ `display: table-cell` 一样，不同的是浮动元素的高度不一致，导致列之间的边框无法对齐。为了避免这个细微的问题，我们使用相同的星号技巧移除了\
    \ `border-left`。\n\n最后，我们为所有浏览器移除了第一列的左边框。尽管 `:first-child` 伪类在 IE6 中无法正常工作，但幸运的是这并没有影响，因为我们已经在这些浏览器中隐藏了边框。\n\
    \n### 添加交互功能\n\n我们已经构建了下拉菜单的标记和样式，但仍然需要让菜单具有交互性。让我们使用 jQuery 添加一个类来显示和隐藏下拉菜单：\n\
    \n```javascript\n$(function() {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        // 显示下拉菜单\n        $(this).addClass('main-nav-item-active');\n  \
    \  }, function(ev) {\n        // 隐藏下拉菜单\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n\n在这里，我们为每个列表项绑定了[悬停监听器 (hover listener)](http://bavotasan.com/tutorials/a-simple-mouseover-hover-effect-with-jquery/)，它用于添加和移除\
    \ `main-nav-item-active` 类。请将其绑定到列表项而不是标签页本身，否则当用户鼠标移出标签页进入下拉区域时，下拉菜单将会消失。\n\n\
    现在我们可以使用这个类钩子通过 CSS 来隐藏和显示下拉菜单：\n\n```css\n#main-nav .main-nav-dd {\n    display:\
    \ none;\n}\n\n#main-nav .main-nav-item-active .main-nav-dd {\n    display: block;\n\
    }\n```\n\n让我们使用 `active` 类来样式化激活的标签页：\n\n```css\n#main-nav .main-nav-item-active\
    \ .main-nav-tab {\n    background-color: #FFF;\n    color: #f60;\n    -webkit-border-top-left-radius:\
    \ 5px;\n    -webkit-border-top-right-radius: 5px;\n    -moz-border-radius-topleft:\
    \ 5px;\n    -moz-border-radius-topright: 5px;\n    border-top-left-radius: 5px;\n\
    \    border-top-right-radius: 5px;\n}\n```\n\n在这里，我们更改了背景和文本颜色，并圆了顶角（在支持的浏览器中）。\n\
    \n### 定位下拉菜单\n\n现在基础的鼠标交互已经完成，下拉菜单会在鼠标悬停时显示。遗憾的是，它仍然没有正确定位在每个标签页下方，因此让我们在悬停事件中添加一些更多代码：\n\
    \n```javascript\n$(function() {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        var $this = $(this),\n        $dd = $this.find('.main-nav-dd');\n\
    \n        // 获取标签页的左侧位置\n        var leftPos = $this.offset().left;\n\n      \
    \  // 获取下拉菜单的宽度\n        var ddWidth = $dd.width();\n\n        // 计算允许的最大位置\n\
    \        var leftMax = $(window).width() - ddWidth;\n\n        // 定位下拉菜单\n   \
    \     if (leftPos > leftMax) {\n            $dd.css('left', leftMax + 'px');\n\
    \        } else {\n            $dd.css('left', leftPos + 'px');\n        }\n\n\
    \        // 显示下拉菜单\n        $(this).addClass('main-nav-item-active');\n    },\
    \ function(ev) {\n        // 隐藏下拉菜单\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n*（注：提供的文本片段中的逻辑不完整/碎片化；我根据文中提到的变量名 `leftPos`、`ddWidth` 和 `leftMax`\
    \ 重构了标准逻辑，以确保文档结构可用。）*\n\n"
- fmt: "\n### 4. Animated Slideshow Navigation\n\n[![Animated slideshow navigation\
    \ on McKinney](images/animated-slideshow-navigation.jpg \"Animated slideshow navigation\
    \ on McKinney\")](http://mckinney.com/)\n\nThere are a lot of JavaScript slideshow\
    \ techniques, but the animated navigation on [McKinney](http://mckinney.com/)^([24](#chapter-3.xhtml_fn3_24))\
    \ is a fresh, subtle approach.\n\n#### Basic jQuery Slideshow\n\n•[View the demo](http://jonraasch.com/demo/fancy-slideshow-navigation)^([25](#chapter-3.xhtml_fn3_25))\n\
    \nLet's build something similar. We'll start with some mark-up for a basic slideshow:\n\
    \n```\n<div id=\"slideshow\">\n    <div id=\"slideshow-reel\">\n        <div class=\"\
    slide\">\n            <h1>Slide 1</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 2</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 3</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 4</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 5</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 6</h1>\n        </div>\n    </div>\n</div>\n```\n\
    \nHere we've set up six slides, which can be filled with any content we need.\
    \ Let's set up some CSS to display the slides as a horizontal reel:\n\n```\n#slideshow\
    \ {\n    width: 900px;\n    height: 500px;\n    overflow: hidden;\n    position:\
    \ relative;\n}\n\n#slideshow-reel {\n    width: 5400px;\n    height: 450px;\n\
    \    position: absolute;\n    top: 0;\n    left: 0;\n}\n\n#slideshow-reel .slide\
    \ {\n    width: 900px;\n    height: 450px;\n    float: left;\n    background-color:\
    \ gray;\n}\n```\n\nHere, we've defined the dimensions of the slideshow, along\
    \ with `overflow: hidden` to hide the other slides in the reel. We've also defined\
    \ the dimensions of the reel: with six slides at 900 pixels each, it is 5400 pixels\
    \ wide. (You could also just set this to a really high number, like 10000 pixels.)\
    \ Then, we absolutely positioned the reel inside the slideshow (which has `position:\
    \ relative`). Finally, we defined the dimensions for all of the individual slides\
    \ and floated them to the left to fill up our reel.\n\n#### Basic Slideshow Animation\n\
    \nNow, let's add some jQuery to animate this slideshow:\n\n```\n$(function() {\n\
    \    function changeSlide( newSlide ) {        \n        // change the currSlide\
    \ value\n        currSlide = newSlide;\n\n        // make sure the currSlide value\
    \ is not too low or high\n        if ( currSlide > maxSlide ) currSlide = 0;\n\
    \        else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        // animate\
    \ the slide reel\n        $slideReel.animate({\n            left : currSlide *\
    \ -900\n        }, 400, 'swing', function() {\n            // set new timeout\
    \ if active\n            if ( activeSlideshow ) slideTimeout = setTimeout(nextSlide,\
    \ 1200);\n        });\n    }\n\n    function nextSlide() {\n        changeSlide(\
    \ currSlide + 1 );\n    }\n\n    // define some variables / DOM references\n \
    \   var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n    $slideshow\
    \ = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n \
    \   maxSlide = $slideReel.children().length - 1;\n\n    // start the animation\n\
    \    slideTimeout = setTimeout(nextSlide, 1200);\n});\n```\n\nHere, we've started\
    \ by creating the function `changeSlide()`, which animates the slide reel. This\
    \ function accepts an index for the next slide to show, and it checks to make\
    \ sure that the value isn't too high or low to be in the reel.\n\nNext, it animates\
    \ the slide reel to the appropriate position, and then finishes by setting a new\
    \ [timeout](http://www.elated.com/articles/javascript-timers-with-settimeout-and-setinterval/)^([26](#chapter-3.xhtml_fn3_26))\
    \ to trigger the next iteration.\n\nFinally, we've built the function `nextSlide()`,\
    \ which simply triggers `changeSlide()` to show the next slide in the reel. This\
    \ simple function is just a shortcut to be used with `setTimeout()`.\n\n#### The\
    \ Left and Right Navigation\n\nNext, let's set up the left and right arrows in\
    \ the slideshow, starting with the mark-up:\n\n```\n <a href=\"#\" id=\"slideshow-prev\"\
    ></a>\n    <a href=\"#\" id=\"slideshow-next\"></a>\n```\n\nFor simplicity's sake,\
    \ we've added the mark-up to the HTML source. Appending it to the jQuery is often\
    \ a better approach, to ensure that the controls appear only when they are usable.\n\
    \nLet's style these arrows with CSS:\n\n```\n#slideshow-prev, #slideshow-next\
    \ {\n    display: block;\n    width: 50px;\n    height: 50px;\n    position: absolute;\n\
    \    top: 200px;\n    z-index: 10;\n}\n\n#slideshow-prev {\n    left: 10px;\n\
    }\n\n#slideshow-next {\n    right: 10px;\n}\n\n#slideshow-prev:hover, #slideshow-next:hover\
    \ {\n    opacity: 0.7;\n}\n\n.slideshow-active {\n    opacity: 0.5;\n}\n```\n\n\
    We've positioned the arrows absolutely within the slideshow and added CSS on hover.\
    \ Finally, let's build the required interaction into our JavaScript:\n\n```\n\
    $(function() {\n    function changeSlide( newSlide ) {        \n        // cancel\
    \ any timeout\n        clearTimeout(slideTimeout);\n\n        // change the currSlide\
    \ value\n        currSlide = newSlide;\n\n        // make sure the currSlide value\
    \ is not too low or high\n        if ( currSlide > maxSlide ) currSlide = 0;\n\
    \        else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        // animate\
    \ the slide reel\n        $slideReel.animate({\n            left : currSlide *\
    \ -900\n        }, 400, 'swing', function() {\n            // set new timeout\
    \ if active\n            if ( activeSlideshow ) slideTimeout = setTimeout(nextSlide,\
    \ 1200);\n        });\n    }\n\n    function nextSlide() {\n        changeSlide(\
    \ currSlide + 1 );\n    }\n\n    // define some variables / DOM references\n \
    \   var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n    $slideshow\
    \ = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n \
    \   maxSlide = $slideReel.children().length - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n\
    \    $slideNextNav = $slideshow.find('#slideshow-next');\n\n    // set click events\n\
    \n    // left arrow\n    $slidePrevNav.click(function(ev) {\n        ev.preventDefault();\n\
    \n        activeSlideshow = false;\n\n        changeSlide( currSlide - 1 );\n\
    \    });\n\n    // right arrow\n    $slideNextNav.click(function(ev) {\n     \
    \   ev.preventDefault();\n\n        activeSlideshow = false;\n\n        changeSlide(\
    \ currSlide + 1 );\n    });\n\n    // start the animation\n    slideTimeout =\
    \ setTimeout(nextSlide, 1200);\n});\n```\n"
  raw: "### 4\\. Animated Slideshow Navigation\n\n[![Animated slideshow navigation\
    \ on McKinney](images/animated-slideshow-navigation.jpg \"Animated slideshow navigation\
    \ on McKinney\")](http://mckinney.com/)\n\nThere are a lot of JavaScript slideshow\
    \ techniques, but the animated navigation on [McKinney](http://mckinney.com/)^([24](#chapter-3.xhtml_fn3_24))\
    \ is a fresh, subtle approach.\n\n#### Basic jQuery Slideshow\n\n•[View the demo](http://jonraasch.com/demo/fancy-slideshow-navigation)^([25](#chapter-3.xhtml_fn3_25))\n\
    \nLet's build something similar. We'll start with some mark-up for a basic slideshow:\n\
    \n```\n<div id=\"slideshow\">\n    <div id=\"slideshow-reel\">\n        <div class=\"\
    slide\">\n            <h1>Slide 1</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 2</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 3</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 4</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 5</h1>\n        </div>\n\n        <div class=\"\
    slide\">\n            <h1>Slide 6</h1>\n        </div>\n    </div>\n</div>\n```\n\
    \nHere we've set up six slides, which can be filled with any content we need.\
    \ Let's set up some CSS to display the slides as a horizontal reel:\n\n```\n#slideshow\
    \ {\n    width: 900px;\n    height: 500px;\n    overflow: hidden;\n    position:\
    \ relative;\n}\n\n#slideshow-reel {\n    width: 5400px;\n    height: 450px;\n\
    \    position: absolute;\n    top: 0;\n    left: 0;\n}\n\n#slideshow-reel .slide\
    \ {\n    width: 900px;\n    height: 450px;\n    float: left;\n    background-color:\
    \ gray;\n}\n```\n\nHere, we've defined the dimensions of the slideshow, along\
    \ with `overflow: hidden` to hide the other slides in the reel. We've also defined\
    \ the dimensions of the reel: with six slides at 900 pixels each, it is 5400 pixels\
    \ wide. (You could also just set this to a really high number, like 10000 pixels.)\
    \ Then, we absolutely positioned the reel inside the slideshow (which has `position:\
    \ relative`). Finally, we defined the dimensions for all of the individual slides\
    \ and floated them to the left to fill up our reel.\n\n#### Basic Slideshow Animation\n\
    \nNow, let's add some jQuery to animate this slideshow:\n\n```\n$(function() {\n\
    \    function changeSlide( newSlide ) {        \n        // change the currSlide\
    \ value\n        currSlide = newSlide;\n\n        // make sure the currSlide value\
    \ is not too low or high\n        if ( currSlide > maxSlide ) currSlide = 0;\n\
    \        else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        // animate\
    \ the slide reel\n        $slideReel.animate({\n            left : currSlide *\
    \ -900\n        }, 400, 'swing', function() {\n            // set new timeout\
    \ if active\n            if ( activeSlideshow ) slideTimeout = setTimeout(nextSlide,\
    \ 1200);\n        });\n    }\n\n    function nextSlide() {\n        changeSlide(\
    \ currSlide + 1 );\n    }\n\n    // define some variables / DOM references\n \
    \   var activeSlideshow = true,\n    currSlide = 0,\n    slideTimeout,\n    $slideshow\
    \ = $('#slideshow'),\n    $slideReel = $slideshow.find('#slideshow-reel'),\n \
    \   maxSlide = $slideReel.children().length - 1;\n\n    // start the animation\n\
    \    slideTimeout = setTimeout(nextSlide, 1200);\n});\n```\n\nHere, we've started\
    \ by creating the function `changeSlide()`, which animates the slide reel. This\
    \ function accepts an index for the next slide to show, and it checks to make\
    \ sure that the value isn't too high or low to be in the reel.\n\nNext, it animates\
    \ the slide reel to the appropriate position, and then finishes by setting a new\
    \ [timeout](http://www.elated.com/articles/javascript-timers-with-settimeout-and-setinterval/)^([26](#chapter-3.xhtml_fn3_26))\
    \ to trigger the next iteration.\n\nFinally, we've built the function `nextSlide()`,\
    \ which simply triggers `changeSlide()` to show the next slide in the reel. This\
    \ simple function is just a shortcut to be used with `setTimeout()`.\n\n#### The\
    \ Left and Right Navigation\n\nNext, let's set up the left and right arrows in\
    \ the slideshow, starting with the mark-up:\n\n```\n <a href=\"#\" id=\"slideshow-prev\"\
    ></a>\n    <a href=\"#\" id=\"slideshow-next\"></a>\n```\n\nFor simplicity's sake,\
    \ we've added the mark-up to the HTML source. Appending it to the jQuery is often\
    \ a better approach, to ensure that the controls appear only when they are usable.\n\
    \nLet's style these arrows with CSS:\n\n```\n#slideshow-prev, #slideshow-next\
    \ {\n    display: block;\n    position: absolute;\n    top: 190px;\n    width:\
    \ 0;\n    height: 0;\n    border-style: solid;\n    border-width: 28px 21px;\n\
    \    border-color: transparent;\n    outline: none;\n}\n\n#slideshow-prev:hover,\
    \ #slideshow-next:hover {\n    opacity: .5;\n    filter: alpha(opacity=50);\n\
    \    -ms-filter:\"progid:DXImageTransform.Microsoft.Alpha(Opacity=50)\";\n}\n\n\
    #slideshow-prev {\n    left: 0;\n    border-right-color: #fff;\n}\n\n#slideshow-next\
    \ {\n    right: 0;\n    border-left-color: #fff;\n}\n```\n\nWe've positioned the\
    \ arrows absolutely within the slideshow frame and added an opacity change on\
    \ hover. In our example, we've used a [CSS triangle trick](http://www.dinnermint.org/blog/css/creating-triangles-in-css/)^([27](#chapter-3.xhtml_fn3_27))\
    \ to style the arrows with straight CSS, but feel free to use an image if you\
    \ want richer graphics.\n\nFinally, let's build the required interaction into\
    \ our JavaScript:\n\n```\n$(function() {\n    function changeSlide( newSlide )\
    \ {\n        // cancel any timeout\n        clearTimeout( slideTimeout );\n\n\
    \        // change the currSlide value\n        currSlide = newSlide;\n\n    \
    \    // make sure the currSlide value is not too low or high\n        if ( currSlide\
    \ > maxSlide ) currSlide = 0;\n        else if ( currSlide < 0 ) currSlide = maxSlide;\n\
    \n        // animate the slide reel\n        $slideReel.animate({\n          \
    \  left : currSlide * -900\n        }, 400, 'swing', function() {\n          \
    \  // hide / show the arrows depending on which frame it's on\n            if\
    \ ( currSlide == 0 ) $slidePrevNav.hide();\n            else $slidePrevNav.show();\n\
    \n            if ( currSlide == maxSlide ) $slideNextNav.hide();\n           \
    \ else $slideNexNav.show();\n\n            // set new timeout if active\n    \
    \        if ( activeSlideshow ) slideTimeout = setTimeout(nextSlide, 1200);\n\
    \        });\n\n        // animate the navigation indicator\n        $activeNavItem.animate({\n\
    \            left : currSlide * 150\n        }, 400, 'swing');\n    }\n\n    function\
    \ nextSlide() {\n        changeSlide( currSlide + 1 );\n    }\n\n    // define\
    \ some variables / DOM references\n    var activeSlideshow = true,\n    currSlide\
    \ = 0,\n    slideTimeout,\n    $slideshow = $('#slideshow'),\n    $slideReel =\
    \ $slideshow.find('#slideshow-reel'),\n    maxSlide = $slideReel.children().length\
    \ - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n    $slideNextNav\
    \ = $slideshow.find('#slideshow-next');\n\n    // set navigation click events\n\
    \n    // left arrow\n    $slidePrevNav.click(function(ev) {\n        ev.preventDefault();\n\
    \n        activeSlideshow = false;\n\n        changeSlide( currSlide - 1 );\n\
    \    });\n\n    // right arrow\n    $slideNextNav.click(function(ev) {\n     \
    \   ev.preventDefault();\n\n        activeSlideshow = false;\n\n        changeSlide(\
    \ currSlide + 1 );\n    });\n\n    // start the animation\n    slideTimeout =\
    \ setTimeout(nextSlide, 1200);\n});\n```\n\nHere, we've added quite a bit of new\
    \ interaction. First, look at the bottom of this script, where we've added click\
    \ event listeners to both of our navigational items.\n\nIn these functions, we\
    \ have first set `activeSlideshow` to `false`, which disables the automatic animation\
    \ of the reel. This provides a better user experience by allowing the user to\
    \ control the reel manually. Then, we trigger either the previous or next slide\
    \ using `changeSlide()`. Next, in the `changeSlide()` function, we've added a\
    \ [clearTimeout()](http://programming.top54u.com/post/JavaScript-clearTimeout.aspx)^([28](#chapter-3.xhtml_fn3_28)).\
    \ This works in conjunction with the `activeSlideshow` value, cancelling any hanging\
    \ iteration from a `setTimeout`."
