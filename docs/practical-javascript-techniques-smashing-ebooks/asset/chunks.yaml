    \ first tab.\n\nLet's set `display: table-cell` on all of the column wrappers,\
    \ so that they display next to each other. But `table-cell` is not supported in\
    \ IE6 or 7, so we've used an [attribute hack](http://paulirish.com/2009/browser-specific-css-hacks/)^([17](#chapter-3.xhtml_fn3_17))\
    \ as an alternative for IE6 and 7. This hack places an asterisk (`*`) before each\
    \ of the attributes that are specific to IE6 and 7.\n\nThus, we've defined a backup\
    \ for unsupported IEs, which is simply `float: left`. This works almost as well\
    \ as `display: table-cell`, except that the floated elements don't match each\
    \ other's height, so the borders between columns don't line up. To avoid this\
    \ minor issue, we simply remove the `border-left` using the same asterisk hack.\n\
    \nFinally, we remove the left border from the first column for all browsers. Although\
    \ the `:first-child` pseudo-class doesn't work properly in IE6, fortunately it\
    \ doesn't make a difference, because we've already hidden the borders in these\
    \ browsers.\n\n#### Adding the Interaction\n\nWe've built the mark-up and styles\
    \ for our dropdown, but we still need to make the menu interactive. Let's use\
    \ jQuery to add a class to show and hide the dropdown:\n\n```\n$(function() {\n\
    \    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        // show the dropdown\n        $(this).addClass('main-nav-item-active');\n\
    \    }, function(ev) {\n        // hide the dropdown\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n\nHere, we've attached a [hover listener](http://bavotasan.com/tutorials/a-simple-mouseover-hover-effect-with-jquery/)^([18](#chapter-3.xhtml_fn3_18))\
    \ to each list item, which adds and removes the class `main-nav-item-active`.\
    \ Attach this to the list item rather than the tab itself, or else the dropdown\
    \ will disappear when the user mouses off the tab and into the dropdown area.\n\
    \nNow we can use this class hook to hide and show the dropdown with CSS:\n\n```\n\
    #main-nav .main-nav-dd {\n    display: none;\n}\n\n#main-nav .main-nav-item-active\
    \ .main-nav-dd {\n    display: block;\n}\n```\n\nLet's use the `active` class\
    \ to style the active tab:\n\n```\n#main-nav .main-nav-item-active .main-nav-tab\
    \ {\n    background-color: #FFF;\n    color: #f60;\n    -webkit-border-top-left-radius:\
    \ 5px;\n    -webkit-border-top-right-radius: 5px;\n    -moz-border-radius-topleft:\
    \ 5px;\n    -moz-border-radius-topright: 5px;\n    border-top-left-radius: 5px;\n\
    \    border-top-right-radius: 5px;\n}\n```\n\nHere, we've changed the background\
    \ and text colors and rounded the top corners (in supported browsers).\n\n####\
    \ Positioning the Dropdown\n\nNow the basic mouse interaction has been built and\
    \ the dropdown displays on mouseover. Unfortunately, it is still not positioned\
    \ correctly under each tab, so let's add some more code to our hover events:\n\
    \n```\n$(function() {\n    var $mainNav = $('#main-nav');\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        var $this = $(this),\n        $dd = $this.find('.main-nav-dd');\n\
    \n        // get the left position of this tab\n        var leftPos = $this.find('.main-nav-tab').position().left;\n\
    \n        // position the dropdown\n\n        $dd.css('left', leftPos);\n\n  \
    \      // show the dropdown\n        $this.addClass('main-nav-item-active');\n\
    \    }, function(ev) {\n\n        // hide the dropdown\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n\nHere, we use jQuery's [`position()` method](http://api.jquery.com/position/)^([19](#chapter-3.xhtml_fn3_19))\
    \ to get the left offset from the current tab. We then use this value to position\
    \ the dropdown directly beneath the appropriate tab.\n\nHowever, with the tabs\
    \ on the right side, the dropdown menu will end up poking out of the tab area.\
    \ Besides looking bad, this could lead to **overflow issues**, with portions of\
    \ the dropdown falling outside of the browser window.\n\nLet's fix the positioning\
    \ with some JavaScript:\n\n```\n$(function() {\n    var $mainNav = $('#main-nav'),\n\
    \    navWidth = $mainNav.width();\n\n    $mainNav.children('.main-nav-item').hover(function(ev)\
    \ {\n        var $this = $(this),\n        $dd = $this.find('.main-nav-dd');\n\
    \n        // get the left position of this tab\n        var leftPos = $this.find('.main-nav-tab').position().left;\n\
    \n        // get the width of the dropdown\n        var ddWidth = $dd.width(),\n\
    \        leftMax = navWidth - ddWidth;\n\n        // position the dropdown\n \
    \       $dd.css('left', Math.min(leftPos, leftMax) );\n\n        // show the dropdown\n\
    \        $this.addClass('main-nav-item-active');\n    }, function(ev) {\n\n  \
    \      // hide the dropdown\n        $(this).removeClass('main-nav-item-active');\n\
    \    });\n});\n```\n\nHere, we start by finding the overall width of the tab area.\
    \ Because recalculating the width for each tab is not necessary, we can define\
    \ it outside of our hover listener.\n\nNext, we find the width of the dropdown\
    \ and determine the maximum left value, which is the overall tab width minus the\
    \ width of the dropdown.\n\nFinally, instead of always positioning the dropdown\
    \ directly beneath the tab, we use the [`Math.min()` method](http://www.tutorialspoint.com/javascript/math_min.htm)^([20](#chapter-3.xhtml_fn3_20))\
    \ to pick the lowest between the tab offset and the maximum left value.\n\nThus,\
    \ we confine the dropdown to the area beneath the tabs and avoid any content issues.\n\
    \n#### Other Approaches\n\nWhile this script is fully functional, we could still\
    \ improve the **user experience**. Currently, when the user mouses away from the\
    \ dropdown, the menu hides immediately. You could build a delay using `setTimeout()`\
    \ to ensure that the dropdown remains visible when the user mouses away and then\
    \ quickly mouses back. This creates a better experience, because it avoids hiding\
    \ the dropdown during accidental movements.\n\nIf you'd rather avoid `setTimeout()`,\
    \ you could also look into the [hoverIntent jQuery plug-in](http://cherne.net/brian/resources/jquery.hoverIntent.html)^([21](#chapter-3.xhtml_fn3_21)),\
    \ which makes fine-tuned control over mouse actions much easier.\n\nBesides improving\
    \ the user experience, you could also **avoid jQuery altogether** in all browsers\
    \ except IE6.\n\nInstead of using jQuery's `hover()` listener, we could use the\
    \ CSS pseudo-class `:hover` to hide and show the dropdown.\n\nOne downside with\
    \ the CSS-only solution is that you can't build a delay for the `:hover` pseudo-class.\n\
    \nAlso, you will have to position the dropdown manually under each tab to avoid\
    \ the overflow issues. Alternatively, if you aren't concerned with overflow issues,\
    \ you could attach `position: relative` to each list item and avoid setting any\
    \ positions manually.\n\nFinally, if you're supporting IE6, make sure to include\
    \ the script above as a backup for IE6 (but don't include it for other browsers).\n\
    \n•[Download the complete example](https://gist.github.com/957213)^([22](#chapter-3.xhtml_fn3_22))\n\
    \n•[View the demo](http://jonraasch.com/demo/huge-dropdown-menu)^([16](#chapter-3.xhtml_fn3_16))"
