    \ call `resetGraph()` at the bottom of `createGraph()`, and watch the magic happen\
    \ as we bask in the glory of our hard work.\n\nNot so fast, sunshine! Before we\
    \ go any further, we need to put some clothes on.\n\n### The CSS\n\nThe first\
    \ thing we need to do is hide the original data table. We could do this in a number\
    \ of ways, but because our CSS will load well before the JavaScript, let's do\
    \ this in the easiest way possible:\n\n```\n#data-table {\n   display: none;\n\
    }\n```\n\nDone. Let's create a nice container area to put our graph in. Because\
    \ a few unordered lists are being used to make our graph, we'll also reset the\
    \ styles for those. Giving the `#figure` and `.graph` elements a `position: relative`\
    \ is important because it will anchor the place elements exactly where we want\
    \ in those containers.\n\n```\n/* Containers */\n\n#wrapper {\n   height: 420px;\n\
    \   left: 50%;\n   margin: -210px 0 0 -270px;\n   position: absolute;\n   top:\
    \ 50%;\n   width: 540px;\n}\n\n#figure {\n   height: 380px;\n   position: relative;\n\
    }\n\n#figure ul {\n   list-style: none;\n   margin: 0;\n   padding: 0;\n}\n\n\
    .graph {\n   height: 283px;\n   position: relative;\n}\n```\n\nNow for the legend.\
    \ We position the legend right down to the bottom of its container (`#figure`)\
    \ and line up the items horizontally:\n\n```\n/* Legend */\n\n.legend {\n   background:\
    \ #f0f0f0;\n   border-radius: 4px;\n   bottom: 0;\n   position: absolute;\n  \
    \ text-align: left;\n   width: 100%;\n}\n\n.legend li {\n   display: block;\n\
    \   float: left;\n   height: 20px;\n   margin: 0;\n   padding: 10px 30px;\n  \
    \ width: 120px;\n}\n\n.legend span.icon {\n   background-position: 50% 0;\n  \
    \ border-radius: 2px;\n   display: block;\n   float: left;\n   height: 16px;\n\
    \   margin: 2px 10px 0 0;\n   width: 16px;\n}\n```\n\nThe x-axis is very similar\
    \ to the legend. We line up the elements horizontally and anchor them to the bottom\
    \ of its container (`.graph`):\n\n```\n/* x-axis */\n\n.x-axis {\n   bottom: 0;\n\
    \   color: #555;\n   position: absolute;\n   text-align: center;\n   width: 100%;\n\
    }\n\n.x-axis li {\n   float: left;\n   margin: 0 15px;\n   padding: 5px 0;\n \
    \  width: 76px;\n}\n```\n\nThe y-axis is a little more involved and requires a\
    \ couple of tricks. We give it a `position: absolute` to break it out of the normal\
    \ flow of content, but anchored to its container. We stretch out each `li` to\
    \ the full width of the graph and add a border across the top. This will give\
    \ us some nice horizontal lines in the background.\n\nUsing the power of negative\
    \ margins, we can offset the numerical labels inside the `span` so that they shift\
    \ up and to the left. Lovely!\n\n```\n/* y-axis */\n\n.y-axis {\n   color: #555;\n\
    \   position: absolute;\n   text-align: right;\n   width: 100%;\n}\n\n.y-axis\
    \ li {\n   border-top: 1px solid #ccc;\n   display: block;\n   height: 62px;\n\
    \   width: 100%;\n}\n\n.y-axis li span {\n   display: block;\n   margin: -10px\
    \ 0 0 -60px;\n   padding: 0 10px;\n   width: 40px;\n}\n```\n\nNow for the meat\
    \ in our endangered species sandwich: the bars themselves. Let's start with the\
    \ container element for the bars and the columns:\n\n```\n/* Graph bars */\n\n\
    .bars {\n   height: 253px;\n   position: absolute;\n   width: 100%;\n   z-index:\
    \ 10;\n}\n\n.bar-group {\n   float: left;\n   height: 100%;\n   margin: 0 15px;\n\
    \   position: relative;\n   width: 76px;\n}\n```\n\nNothing too complicated here.\
    \ We're simply setting some dimensions for the container, and setting a `z-index`\
    \ to make sure it appears in front of the y-axis markings.\n\nNow for each individual\
    \ `.bar`:\n\n```\n.bar {\n   border-radius: 3px 3px 0 0;\n   bottom: 0;\n   cursor:\
    \ pointer;\n   height: 0;\n   position: absolute;\n   text-align: center;\n  \
    \ width: 24px;\n}\n\n.bar.fig0 {\n   left: 0;\n}\n\n.bar.fig1 {\n   left: 26px;\n\
    }\n\n.bar.fig2 {\n   left: 52px;\n}\n```\n\nThe main styles to note here are:\n\
    \n•`position: absolute` and `bottom: 0`, which means that the bars will be attached\
    \ to the bottom of our graph and grow up;\n\n•the bar for each species (`.fig0`,\
    \ `.fig1` and `.fig2`), which will be positioned within `.bar-group`.\n\nNow,\
    \ why don't we minimize the number of sharp edges on any given page by using the\
    \ `border-radius` property to round the edges of the top-left and top-right corners\
    \ of each bar? OK, so `border-radius` isn't really necessary, but it adds a nice\
    \ touch for browsers that support it. Thankfully, the latest versions of the most\
    \ popular browsers do support it.\n\nBecause we've placed the values from each\
    \ table cell in each bar, we can add a neat little pop-up that appears when you\
    \ hover over a bar:\n\n```\n.bar span {\n   background:#fefefe url(../images/info-bg.gif)\
    \ 0 100% repeat-x;\n   border-radius: 3px;\n   left: -8px;\n   display: none;\n\
    \   margin: 0;\n   position: relative;\n   text-shadow: rgba(255, 255, 255, 0.8)\
    \ 0 1px 0;\n   width: 40px;\n   z-index: 20;\n\n   -webkit-box-shadow: rgba(0,\
    \ 0, 0, 0.6) 0 1px 4px;\n   box-shadow: rgba(0, 0, 0, 0.6) 0 1px 4px;\n}\n\n.bar:hover\
    \ span {\n   display: block;\n   margin-top: -25px;\n}\n```\n\nFirst, the pop-up\
    \ is hidden from view via `display: none`. Then, when a `.bar` element is hovered\
    \ over, we've set `display: block` to bring it into view, and set a negative `margin-top`\
    \ to make it appear above each bar.\n\nThe `text-shadow`, `rgba` and `box-shadow`\
    \ properties are currently supported by most modern browsers as is. Of these modern\
    \ browsers, only Safari requires a vendor prefix (`-webkit-`) to make `box-shadow`\
    \ work. Note that these properties are simply enhancements to our graph and aren't\
    \ required to understand it. Our baseline of Internet Explorer 8 simply ignores\
    \ them.\n\nOur final step in bringing everything together is to color code each\
    \ bar:\n\n```\n.fig0 {\n   background: #747474 url(../images/bar-01-bg.gif) 0\
    \ 0 repeat-y;\n}\n\n.fig1 {\n   background: #65c2e8 url(../images/bar-02-bg.gif)\
    \ 0 0 repeat-y;\n}\n\n.fig2 {\n   background: #eea151 url(../images/bar-03-bg.gif)\
    \ 0 0 repeat-y;\n}\n```\n\nIn this example, I've simply added a `background-color`\
    \ and a `background-image` that tiles vertically. This will update the styles\
    \ for the bars and the little icons that represent them in the legend. Nice.\n\
    \nAnd, believe it or not, that is it!\n\n### The Finished Product\n\n[![screenshot](images/graph-tut-image-03.jpg\
    \ \"Example 3: Animated Bar Chart with jQuery\")](http://provide.smashingmagazine.com/graph_tut_files/ex_03.html)\n\
    \nThat about wraps it up. I hope we've done enough to alert the public to the\
    \ dangers of zombie over-population. More than that, however, I hope you've gained\
    \ something useful from this tutorial and that you'll continue to push the boundaries\
    \ of what can be done in the browser — especially with proper Web standards and\
    \ without the use of third-party plug-ins. If you've got ideas on how to extend\
    \ or improve anything you've seen here, find me on Twitter [@derek_mack](http://twitter.com/derek_mack)^([15](#chapter-4.xhtml_fn4_15)).\n\
    \n### Bonus: Unleashing The Power Of CSS3\n\nThis bonus is not as detailed as\
    \ our main example. It serves mainly as a showcase of some features being considered\
    \ in the CSS3 specification.\n\nBecause support for CSS3 properties is currently\
    \ limited, so is their use. Although some of the features mentioned here are making\
    \ their way into other Web browsers, Webkit-based ones such as Apple Safari and\
    \ Google Chrome are leading the way.\n\nWe can actually create our graph using\
    \ no images at all, and even animate the bars using CSS instead of jQuery.\n\n\
    Let's start by removing the background images from our bars, replacing them with\
    \ the `-webkit-gradient` property:\n\n```\n.fig0 {\n   background: -webkit-gradient(linear,\
    \ left top, right top, color-stop(0.0, #747474), color-stop(0.49, #676767), color-stop(0.5,\
    \ #505050), color-stop(1.0, #414141));\n}\n\n.fig1 {\n   background: -webkit-gradient(linear,\
    \ left top, right top, color-stop(0.0, #65c2e8), color-stop(0.49, #55b3e1), color-stop(0.5,\
    \ #3ba6dc), color-stop(1.0, #2794d4));\n}\n\n.fig2 {\n   background: -webkit-gradient(linear,\
    \ left top, right top, color-stop(0.0, #eea151), color-stop(0.49, #ea8f44), color-stop(0.5,\
    \ #e67e28), color-stop(1.0, #e06818));\n}\n```"
