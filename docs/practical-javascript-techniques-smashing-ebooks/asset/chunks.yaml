    •general JavaScript (registered as `theme-general`).\n\nAgain, the base JavaScript\
    \ adds nothing to the website. Rather, it is a group of default functions that\
    \ the other two files rely on. You could then enqueue the files using the following\
    \ code:\n\n```\nfunction mytheme_enqueue_js(){ \n  if (is_archive()) { \n    wp_enqueue_script('theme-archive');\
    \ \n  } \n  elseif (!is_admin()) { \n    wp_enqueue_script('theme-general');\n\
    \  }\n} \nadd_action('wp_print_scripts', 'mytheme_enqueue_js');\n```\n\n### Using\
    \ The Google AJAX CDN\n\nWhile using JavaScript the WordPress way will save you\
    \ the problem of common libraries conflicting with each other, you might prefer\
    \ to serve these libraries from Google's server rather than your own.\n\nUsing\
    \ Jason Penny's [Use Google Libraries](http://wordpress.org/extend/plugins/use-google-libraries/)^([6](#chapter-7.xhtml_fn7_6))\
    \ plugin is the easiest way to do this. The plugin automatically keeps jQuery\
    \ in noConflict mode.\n\n### Putting It All Together\n\nOnce you've started registering\
    \ and outputting your scripts and styles the WordPress way, you will find that\
    \ managing these files becomes a series of logical steps:\n\n**1\\. Registration\
    \ to manage:**\n\n•version numbers,\n\n•file dependencies,\n\n•media types for\
    \ CSS,\n\n•code placement for JavaScript (header or footer);\n\n**2\\. Enqueue/output\
    \ files to HTML:**\n\n•logic targeting output to specific WordPress pages,\n\n\
    •WordPress automating dependencies.\n\nEliminating potential JavaScript conflicts\
    \ from your WordPress theme or plugin frees you to get on with more important\
    \ things, such as following up on sales leads or getting back to that hash-tag\
    \ game that was so rudely interrupted.\n\n—\n\n1.[http://api.jquery.com/jQuery.noConflict/](http://api.jquery.com/jQuery.noConflict/)\n\
    \n2.[http://codex.wordpress.org/Function_Reference/wp_enqueue_script#Default_scripts_included_with_WordPress](http://codex.wordpress.org/Function_Reference/wp_enqueue_script#Default_scripts_included_with_WordPress)\n\
    \n3.[http://codex.wordpress.org/Function_Reference/wp_enqueue_script#jQuery_noConflict_wrappers](http://codex.wordpress.org/Function_Reference/wp_enqueue_script#jQuery_noConflict_wrappers)\n\
    \n4.[http://soupgiant.com/](http://soupgiant.com/)\n\n5.[http://codex.wordpress.org/Child_Themes](http://codex.wordpress.org/Child_Themes)\n\
    \n6.[http://wordpress.org/extend/plugins/use-google-libraries/](http://wordpress.org/extend/plugins/use-google-libraries/)\n\
    \n# Optimizing Long Lists Of Yes/No Values With JavaScript\n\nBy Lea Verou\n\n\
    Very frequently in Web development (and programming in general), you need to store\
    \ a long list of boolean values (yes/no, true/false, checked/unchecked… you get\
    \ the idea) into something that accepts only strings. Maybe it's because you want\
    \ to store them in `localStorage` or in a cookie, or send them through the body\
    \ of an HTTP request. I've needed to do this countless times."
