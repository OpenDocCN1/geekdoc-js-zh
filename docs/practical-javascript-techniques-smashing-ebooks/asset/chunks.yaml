    \n•[View the demo](http://jonraasch.com/demo/fancy-slideshow-navigation)^([25](#chapter-3.xhtml_fn3_25))\n\
    \n### 5\\. Animated Icons\n\n[![Animated icons on CSS Tricks](images/animated-icons-on-css-tricks.png\
    \ \"Animated icons on CSS Tricks\")](http://css-tricks.com)\n\n[CSS-Tricks](http://css-tricks.com)^([32](#chapter-3.xhtml_fn3_32))\
