    #### Sign up for Pusher and get your API Credentials\n\nIn order to add Pusher-powered\
    \ real-time functionality to a Web application you first need to [sign up for\
    \ a free Sandbox account](http://pusher.com/signup)^([19](#chapter-6.xhtml_fn6_19)).\
    \ After you have signed up you'll be taken to the Pusher dashboard where you'll\
    \ see that a \"Main\" application has been created for you. You'll also see you\
    \ are in the \"API Access\" section for that application where you can grab your\
    \ API credentials.\n\n![Screenshot of API Access section in Pusher Dashboard](images/pusher_main_api_access.png)\n\
    \nFor ease of access create a *pusher_config.php* file and `define` the credentials\
    \ in there so we can refer to them later:\n\n```\n <?php\ndefine('APP_ID', 'YOUR_APP_ID');\n\
    define('APP_KEY', 'YOUR_APP_KEY');\ndefine('APP_SECRET', 'YOUR_APP_SECRET');\n\
    ?>\n```\n\nIn your version of *pusher_config.php* be sure to replace the values\
    \ which being *‘YOUR_* with your actual credentials.\n\nYou should also `require`\
    \ this in your *index.php* file. We should also make the `APP_KEY` available to\
    \ the JavaScript runtime as we are going to need it to connect to Pusher.\n\n\
    ```\n <?php\nrequire('pusher_config.php);\n?>\n\n<script>\nvar APP_KEY = '<?php\
    \ echo(APP_KEY); ?>';\n&lt;/script&gt;\n```\n\n#### Real-time JavaScript\n\nThe\
    \ first thing you need to do when adding Pusher to a Web application is include\
    \ the Pusher JavaScript library and connect to Pusher. To connect you'll need\
    \ to use the *key* which you grabbed from the Pusher dashboard. Below you can\
    \ see all that is required to hook up the front-end application to Pusher.\n\n\
    Include the Pusher JavaScript library after the *app.js* include:\n\n```\n<script\
    \ src=\"http://code.jquery.com/jquery-1.7.1.min.js\"></script>\n<script src=\"\
    http://js.pusher.com/1.11/pusher.min.js\"></script>\n<script src=\"js/app.js\"\
    ></script>\n```\n\nAdd the Pusher functionality to *app.js*:\n\n```\nvar pusher\
    \ = new Pusher(APP_KEY);\nvar channel = pusher.subscribe('comments-' + $('#comment_post_ID').val());\n\
    channel.bind('new_comment', displayComment); \n```\n\nThis probably looks too\
    \ easy to be true, so here are the details about what the above code does:\n\n\
    •`var pusher = new Pusher(APP_KEY);`\n\nCreates a new instance of a `Pusher` object\
    \ and in doing so connects you to Pusher. The application to use is defined by\
    \ the `APP_KEY` value that you pass in and that we set up earlier.\n\n•`var channel\
    \ = pusher.subscribe('comments-' + $('#comment_post_ID').val());`\n\n[Channels](http://pusher.com/docs/channels)^([20](#chapter-6.xhtml_fn6_20))\
    \ provide a great way of organizing streams of real-time data. Here we are subscribing\
    \ to comments for the current blog post, uniquely identified by the value of the\
    \ `comment_post_ID` hidden form input element.\n\n•`channel.bind('new_comment',\
    \ displayComment);`\n\n[Events](http://pusher.com/docs/client_api_guide/client_events)^([21](#chapter-6.xhtml_fn6_21))\
    \ are used to further filter data and are ideal for linking updates to changes\
    \ in the UI. In this case we want to bind to an event which is triggered whenever\
    \ a new comment is added and display it. Because we've already created the `displayComment`\
    \ function we can just pass in a reference to the call to `bind`.\n\n#### Sending\
    \ Real-Time Events using the Event Creator\n\nWe can also test out this functionality\
    \ without writing any server-side code by using the **Event Creator** for your\
    \ app which can also be found in the Pusher dashboard. The Event Creator lets\
    \ you publish events on a channel through a simple user interface. From the code\
    \ above we can see that we want to publish an event named *\"new_comment\"* on\
    \ the *\"comments-1\"* channel. From the earlier test function we also have an\
    \ example of the test data we can publish.\n\n![Screenshot of the Event Creator\
    \ in Pusher Dashboard](images/event_creator.png)\n\n#### Real-time PHP\n\nAgain,\
    \ we've proven that our client-side functionality works without having to write\
    \ any server-side code. Now lets add the PHP code we need to trigger the new comment\
    \ event as soon as a comment is posted in our comment system.\n\nPusher offers\
    \ a number of [server-side libraries](http://pusher.com/docs/rest_libraries)^([22](#chapter-6.xhtml_fn6_22))\
    \ which make it easy to publish events in addition to helping with functionality\
    \ such as [private channel](http://pusher.com/docs/private_channels)^([23](#chapter-6.xhtml_fn6_23))\
    \ authentication and providing user information for [presence channels](http://pusher.com/docs/presence)^([24](#chapter-6.xhtml_fn6_24)).\
    \ We just want to use the basic event triggering functionality in the *post_comment.php*\
    \ file so we need to download the [Pusher PHP library](https://github.com/squeeks/Pusher-PHP)^([25](#chapter-6.xhtml_fn6_25))\
    \ ([direct zip file download](https://github.com/squeeks/Pusher-PHP/zipball/master)^([26](#chapter-6.xhtml_fn6_26))).\n\
    \nOnce you've downloaded this zip file, unzip it into the directory along with\
    \ your other files. Your file structure will now look something like this:\n\n\
    •index.php\n\n•css (dir)\n\n•images (dir)"
