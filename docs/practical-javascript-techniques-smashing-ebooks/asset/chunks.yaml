    \n# A Beginner's Guide To jQuery-Based JSON API Clients\n\nBy Ben Howdle\n\nAre\
    \ you fascinated by dynamic data? Do you go green with envy when you see tweets\
    \ pulled magically into websites? Trust me, I've been there.\n\nThe goal of this\
    \ tutorial is to create a simple Web app for grabbing movie posters from [TMDb](http://www.themoviedb.org/)^([1](#chapter-5.xhtml_fn5_1)).\
    \ We'll use jQuery and the user's input to query a JSON-based API and deal with\
    \ the returned data appropriately.\n\nI hope to convince you that APIs aren't\
    \ scary and that most of the time they can be a developer's best friend.\n\n###\
    \ APIs Are The Future But, More Importantly, The Present\n\nJSON-based APIs are\
    \ a hot property on the Web right now. I cannot remember the last time I went\
    \ onto a blog or portfolio without seeing the owner's tweets or Facebook friends\
    \ staring back at me. This interactivity makes the Web an exciting place. The\
    \ only limit seems to be people's imagination. As demonstrated by everything from\
    \ pulled tweets to a self-aware [exchange-rates API](http://josscrowcroft.github.com/open-exchange-rates/)^([2](#chapter-5.xhtml_fn5_2)),\
    \ data is currently king, and websites are swapping it freely.\n\nDevelopers are\
    \ allowing us to get at their data much more openly now; no longer is everything\
    \ under lock and key. Websites are proud to have you access their data and, in\
    \ fact, encourage it. Websites such as [TMDb](http://www.themoviedb.org/)^([3](#chapter-5.xhtml_fn5_3))\
    \ and [LastFM](http://www.last.fm/)^([4](#chapter-5.xhtml_fn5_4)) allow you to\
    \ build entirely separate applications based on the data they've spent years accumulating.\
    \ This openness and receptiveness are fostering an intertwined network of users\
    \ and their corresponding actions.\n\n![screenshot](images/Screen-Shot-2011-09-10-at-01.24.31-copy.png\
    \ \"Front Row Home Page\")\n\nThis chapter is aimed at people who are competent\
    \ in HTML and CSS and have basic knowledge of jQuery techniques. We won't delve\
    \ deep into advanced JavaScript techniques, but will rather help the beginner\
    \ who wants to create more complex Web tools.\n\n#### APIs in a Nutshell\n\nIn\
    \ basic terms, an API enables you to access a website's data without going near\
    \ its databases. It gives us a user-friendly way to read and write data to and\
    \ from a website's databases.\n\n### Sure, Great, But What Code Do I Need?"
