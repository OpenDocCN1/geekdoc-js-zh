    \n### The Goal: A jQuery-Based JSON API Client\n\nI recently submitted to [An\
    \ Event Apart](http://10k.aneventapart.com/)^([6](#chapter-5.xhtml_fn5_6)) the\
    \ Web app that we're about to go through now. It's called [Front Row](http://10k.aneventapart.com/Entry/Details/550)^([7](#chapter-5.xhtml_fn5_7)).\n\
    \nThe idea of the Web app is to take a movie title inputted by the user, run it\
    \ through [TMDb](http://www.themoviedb.org/)^([8](#chapter-5.xhtml_fn5_8))'s API,\
    \ and return the relevant poster. The user could then share it or save it to their\
    \ computer.\n\nThe Web app is split into HTML, CSS and jQuery. We'll focus on\
    \ the jQuery, because that's where the magic happens.\n\n#### The HTML\n\nBelow\
    \ is the basic structure of the Web app. Nothing special here.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n   <meta name=\"author\" content=\"Ben Howdle and Dan\
    \ Matthew\">\n   <meta name=\"description\" content=\"A responsive movie poster\
    \ grabber\">\n   <title>Front Row by Ben Howdle</title>\n   <meta name=\"viewport\"\
    \ content=\"width=device-width, minimum-scale=1.0, maximum-scale=1.0\">\n   <script\
    \ src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.6.2.min.js\"></script>\n\
    \        <!--jQuery, linked from a CDN-->\n   <script src=\"scripts.js\"></script>\n\
    \   <script type=\"text/javascript\" src=\"http://use.typekit.com/oya4cmx.js\"\
    ></script>\n   <script type=\"text/javascript\">try{Typekit.load();}catch(e){}</script>\n\
    \   <link rel=\"stylesheet\" href=\"style.css\" />\n</head>\n<body>\n<div class=\"\
    container\">\n   <header>\n      <h1>Front Row</h1>\n   </header>\n   <section\
    \ id=\"fetch\">\n      <input type=\"text\" placeholder=\"Enter a movie title\"\
    \ id=\"term\" />\n      <button id=\"search\">Find me a poster</button>\n   </section>\n\
    \   <section id=\"poster\">\n   </section>\n   <footer>\n      <p>Created by <a\
    \ href=\"http://twostepmedia.co.uk\">Ben Howdle</a></p>\n   </footer>\n</div>\n\
    </body>\n</html>\n```\n\nAll we've got is a bit of Twitter self-indulgence, an\
    \ input field and a submission button. Done!\n\nThe CSS is a bit off topic for\
    \ this chapter, so I'll leave it to you to inspect the elements of interest on\
    \ the live website.\n\n#### The jQuery\n\n```\n$(document).ready(function(){\n\
    \n   //This is to remove the validation message if no poster image is present\n\
    \n   $('#term').focus(function(){\n      var full = $(\"#poster\").has(\"img\"\
    ).length ? true : false;\n      if(full == false){\n         $('#poster').empty();\n\
    \      }\n   });\n```\n\nI like validation messages to disappear when the user\
    \ starts retyping in an input field. The script below checks whether an image\
    \ is present (i.e. a movie poster), and if not, empties the container of the validation\
    \ message once the input field gains focus.\n\n```\n//function definition\n\n\
    \   var getPoster = function(){\n\n        //Grab the movie title and store it\
    \ in a variable\n\n        var film = $('#term').val();\n\n         //Check if\
    \ the user has entered anything\n\n         if(film == ''){\n\n            //If\
    \ the input field was empty, display a message\n\n            $('#poster').html(\"\
    <h2 class='loading'>Ha! We haven't forgotten to validate the form! Please enter\
    \ something.</h2>\");\n```\n\n![](images/Screen-Shot-2011-09-21-at-20.28.02-e1316803924908.png\
    \ \"Front Row Form Validation\")\n\nThe reason why we store the main code that\
    \ retrieves the data in a function will become clear later on (mainly, it's for\
    \ [DRY programming](http://en.wikipedia.org/wiki/Don't_repeat_yourself)^([9](#chapter-5.xhtml_fn5_9))).\n\
    \nWe then store the value of the input in a variable, so that when we use it again\
    \ in the code, the jQuery doesn't have to rescan the DOM.\n\nBasic validation\
    \ is performed on the input, checking that something has actually been entered\
    \ in the field.\n\nIn an attempt at humor on my part, I display a message warning\
    \ the user that they haven't entered anything and asking them to please do so.\n\
    \n```\n} else {\n\n            //They must have entered a value, carry on with\
    \ API call, first display a loading message to notify the user of activity\n\n\
    \            $('#poster').html(\"<h2 class='loading'>Your poster is on its way!</h2>\"\
    );\n```\n\nIf the input contains a value, we then process the user's request.\
    \ Another message is displayed, letting the user know that something is happening.\n\
    \n```\n$.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f31866/\"\
    \ + film + \"?callback=?\", function(json) {\n\n               //TMDb is nice\
    \ enough to return a message if nothing was found, so we can base our if statement\
    \ on this information\n\n               if (json != \"Nothing found.\"){\n\n \
    \                 //Display the poster and a message announcing the result\n\n\
    \                     $('#poster').html('<h2 class=\"loading\">Well, gee whiz!\
    \ We found you a poster, skip!</h2><img id=\"thePoster\" src=' + json[0].posters[0].image.url\
    \ + ' />');\n```\n\n![](images/Screen-Shot-2011-09-21-at-20.29.31-e1316804006251.png\
    \ \"Front Row Found Poster\")"
