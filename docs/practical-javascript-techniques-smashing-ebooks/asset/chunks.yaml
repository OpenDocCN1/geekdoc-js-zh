  trans: "\n最后，在 `animate()` 函数的回调中，我们添加了一些代码来隐藏和显示箭头导航。当幻灯片显示最左侧的幻灯片时，会隐藏左箭头，反之亦然。\n\
    \n### 底部导航动画\n\n基础幻灯片通过“上一个”和“下一个”箭头进行工作。让我们通过添加动画导航将其提升一个水平。请注意，我使用了更复杂的标记，因为它避免了图像的使用，并且最终更加简单。否则，必须使用三张背景图像——一张用于中间部分，每个端部使用一张（以允许点击区域更大）。不过，你可以使用\
    \ `background-image` 来清理底部导航。\n\n以下是动画的 jQuery 代码：\n\n```javascript\n$(function()\
    \ {\n    function changeSlide( newSlide ) {\n        // 取消任何超时\n        clearTimeout(\
    \ slideTimeout );\n\n        // 改变 currSlide 值\n        currSlide = newSlide;\n\
    \n        // 确保 currSlide 值不会过低过高\n        if ( currSlide > maxSlide ) currSlide\
    \ = 0;\n        else if ( currSlide < 0 ) currSlide = maxSlide;\n\n        //\
    \ 动画化幻灯片卷轴\n        $slideReel.animate({\n            left : currSlide * -900\n\
    \        }, 400, 'swing', function() {\n            // 根据当前所在的帧隐藏/显示箭头\n     \
    \       if ( currSlide == 0 ) $slidePrevNav.hide();\n            else $slidePrevNav.show();\n\
    \n            if ( currSlide == maxSlide ) $slideNextNav.hide();\n           \
    \ else $slideNextNav.show();\n\n            // 如果活动状态，则设置新超时\n            if (\
    \ activeSlideshow ) slideTimeout = setTimeout(nextSlide, 1200);\n        });\n\
    \n        // 动画化导航指示器\n        $activeNavItem.animate({\n            left : currSlide\
    \ * 150\n        }, 400, 'swing');\n    }\n\n    function nextSlide() {\n    \
    \    changeSlide( currSlide + 1 );\n    }\n\n    // 定义变量 / DOM 引用\n    var activeSlideshow\
    \ = true,\n    currSlide = 0,\n    slideTimeout,\n    $slideshow = $('#slideshow'),\n\
    \    $slideReel = $slideshow.find('#slideshow-reel'),\n    maxSlide = $slideReel.children().length\
    \ - 1,\n    $slidePrevNav = $slideshow.find('#slideshow-prev'),\n    $slideNextNav\
    \ = $slideshow.find('#slideshow-next'),\n    $activeNavItem = $slideshow.find('#active-nav-item');\n\
    \n    // 设置导航点击事件\n\n    // 左箭头\n    $slidePrevNav.click(function(ev) {\n    \
    \    ev.preventDefault();\n\n        activeSlideshow = false;\n\n        changeSlide(\
    \ currSlide - 1 );\n    });\n\n    // 右箭头\n    $slideNextNav.click(function(ev)\
    \ {\n        ev.preventDefault();\n\n        activeSlideshow = false;\n\n    \
    \    changeSlide( currSlide + 1 );\n    });\n\n    // 主导航\n    $slideshow.find('#slideshow-nav\
    \ a.nav-item').click(function(ev) {\n        ev.preventDefault();\n\n        activeSlideshow\
    \ = false;\n\n        changeSlide( $(this).index() );\n    });\n\n    // 动画\n\
    \    slideTimeout = setTimeout(nextSlide, 1200);\n});\n```\n\n我们在脚本中添加了几处内容。\n\
    \n首先，我们在 `changeSlide()` 中包含了第二个动画，这次是为了动画导航中的活动指示器。这个 `animate()` 基本上与我们为卷轴构建的相同，主要区别在于我们希望每张幻灯片只移动\
    \ `150px`。\n\n最后，我们为底部导航中的项目添加了点击事件监听器。与箭头导航类似，我们首先禁用自动动画，将 `activeSlideshow`\
    \ 设置为 `false`。接下来，我们触发 `changeSlide()` 并传入被点击幻灯片的索引，这使用 jQuery 的 `index()` 方法很容易确定。\n\
    \n现在，幻灯片导航动画已经完成，准备好给你的访问者留下深刻了。\n\n* [下载完整示例](https://gist.github.com/957203)\n\
    * [查看演示](http://jonraasch.com/demo/fancy-slideshow-navigation)\n\n### 5. 动画图标\n\
    \n![CSS Tricks 上的动画图标](http://css-tricks.com)\n\n[CSS-Tricks](http://css-tricks.com)\
    \ 在页脚处当用户鼠标悬停在各种按钮上有一个简单但优雅的效果。除了颜色变化和添加图标外，该效果在支持过渡的浏览器中是动画化的，使图标看起来像是滑入位的。\n\
    \n* [查看演示](http://jonraasch.com/demo/animated-icons)\n\n让我们创建一个类似的效果，从一些标记开始：\n\
    \n```html\n<a href=\"#\" class=\"hover-panel\">\n    <h3>面板标题</h3>\n\n    <p>此处显示更多额外信息</p>\n\
    </a>\n```\n\n#### 为按钮设置样式\n\n让我们设置一些 CSS 来样式化按钮在自然（非悬停）状态下的样式：\n\n```css\n.hover-panel\
    \ {\n    background-color: #E62DF;\n    color: #B2AAA4;\n    float: left;\n  \
    \  height: 130px;\n    width: 262px;\n}\n\n.hover-panel h3 {\n    font-family:\
    \ Impact, Sans-serif;\n    font-size: 38px;\n    text-transform: uppercase;\n\
    }\n\n.hover-panel p {\n    font-size: 12px;\n    width: 65%;\n}\n```\n\n现在添加一个静态悬停效果来更改颜色并添加阴影：\n\
    \n```css\n.hover-panel:hover {\n    background-color: #23ABE;\n}\n\n.hover-panel:hover\
    \ h3 {\n    color: #FFF;\n    text-shadow: rgba(0, 0, 0, 0.39838) 0px 0px 4px;\n\
    }\n\n.hover-panel:hover p {\n    color: #FFF;\n}\n```\n\n最后，让我们添加一个弹入位的背景图像：\n\
    \n```css\n.hover-panel {\n    background-image: url(hover-panel-icon.png);\n \
    \   background-position: 292px 10px;\n    background-repeat: no-repeat;\n}\n\n\
    .hover-panel:hover {\n    background-position: 180px 10px;\n}\n```\n\n在这里，我们添加了一些重要的样式来实现悬停效果。首先，我们将背景图像附加到\
    \ `.hover-panel` 上。这通常位于按钮之外，但在鼠标悬停时，它被正确放置。此外，注意我们将其放置在面板的右侧，这样当我们应用过渡动画时，图标将从右侧滑入。\n\
    \n#### 添加过渡\n\n最后，让我们添加过渡：\n\n```css\n.hover-panel {\n    -moz-transition: 0.2s\
    \ ease; /* FF3.7+ */\n    -o-transition: all 0.2s ease; /* Opera 10.5 */\n   \
    \ -webkit-transition: all 0.2s ease; /* Saf3.2+, Chrome */\n    transition: all\
    \ 0.2s ease;\n}\n```\n\n过渡效果触发了背景图像的动画。因为我们将其标记为应用于 `all` 属性，过渡也适用于上述应用于的 `background-color`\
    \ 变化。\n\n尽管这在大多数现代浏览器中均有效，但在 IE9 中将无法工作。但在不支持的浏览器中，用户也能看到颜色变化和图标；他们只是看不到动画效果。\n\
    \n在大多数网站上，这种增强对所有用户都不是必要的。但如果支持是优先事项，请查看此 [jQuery 备份方案](http://jonraasch.com/blog/graceful-degradation-with-css3#transitions)。\n\
    \n最后，让我们所有的样式结合在一起：\n\n"
