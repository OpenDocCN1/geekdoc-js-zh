  trans: "\n像许多开发者一样，我经常在后端和前端开发之间愉快地穿梭，工作在 `PHP` 和 `jQuery` 同样让我感到快乐。这取决于我那天戴的是哪种“帽子”。\n\
    \n由于这一章主要关于基于 jQuery 的 JSON API 客户端，我们将关注客户端代码（即 `jQuery`）。在处理 API 时，有了 `jQuery`\
    \ 的加持，人们更有可能遇到 JSON。\n\n## 玩家 1：JSON\n\n[JSON](http://www.json.org/)^(5)（或 JavaScript\
    \ 对象表示）是一种轻量级、简单且流行的数据交换方式。jQuery 并不是处理和与 JSON 交互的唯一工具；它只是我许多人的首选方法。我们每天使用的许多服务都有基于\
    \ JSON 的 API：Twitter、Facebook 和 Flickr 都以 JSON 格式返回数据。\n\nAPI 的 JSON 响应看起来像这样：\n\
    \n```\n([{\"score\":\nnull,\"popularity\":\n3,\"translated\":true,\"adult\":\n\
    false,\"language\":\"en\",\"original_name\":\"The Goonies\",\"name\":\"The Goonies\"\
    ,\"alternative_name\":\"I Goonies\",\n\"movie_type\":\"movie\",\"id\":9340,\"\
    imdb_id\":\"tt0089218\",\n\"url\":\"http://www.themoviedb.org/movie/9340\",\n\"\
    votes\":16,\"rating\":9.2,\"certification\":\"PG\",\"overview\":\"一个名叫 Mikey Walsh\
    \ 的青少年在他父亲的阁阁楼里发现了一张旧宝藏地图。\n为了拯救他们的房屋免遭拆除，Mikey 和他的朋友 Data Wang、Chunk Cohen 和\
    \ Mouth Devereaux 出发了一场伟大的冒险，寻找海盗独眼 Willie 的秘密宝藏。\",\"released\":\"1985-06-07\"\
    ,\n\"posters\":[{\"image\":{\"type\":\"poster\",\"size\":\"original\",\"height\"\
    :1500,\"width\":1000,\n\"url\":\"http://cf1.imgobject.com/posters/76b/4d406d767b9aa15bb500276b/the-goonies-original.jpg\"\
    ,\n\"id\":\"4d406d767b9aa15bb500276b\"}}],\"backdrops\":[{\"image\":{\"type\"\
    :\"backdrop\",\"size\":\"original\",\"height\":1080,\"width\":1920,\n\"url\":\"\
    http://cf1.imgobject.com/backdrops/242/4d690e167b9aa13631001242/the-goonies-original.jpg\"\
    ,\n\"id\":\"4d690e167b9aa13631001242\"}}],\"version\":3174,\"last_modified_at\"\
    :\"2011-09-12 13:19:05\"}])\n```\n\n有点乱，对吧？对比一下在 Google Chrome 开发者控制中查看同一个 JSON：\n\
    \n![\n\nJSON 响应可以通过 jQuery 函数访问，允许我们按照心意对其进行操作、显示，更重要的是对其进行样式化。\n\n## 玩家 2：jQuery\n\
    \n就个人而言，我愿意在每周的任何一天选择 jQuery 而不是 JavaScript。对于那些只想让事情立即运行的初级 Web 开发者来说，jQuery\
    \ 让事情变得简单得多。我每天都用它。如果我必须用原生 JavaScript 完成相同的任务，效率将会很低。在我看来，JavaScript 是为了那些想要深入理解\
    \ DOM 的人；为了简单易用，本质上，jQuery 是一个 JavaScript 库，拥有像 `getJSON` 这样实用的函数。它把我们的 API 粘合在一起。\n\
    \n## 目标：基于 jQuery 的 API 客户端\n\n我最近提交了一个[事件](http://10k.anevent.com)^(6)我们要处理的。这个\
    \ Web 应用的想法是获取用户输入的电影标题，通过 [TMDb](http://www.json.org/)^(7) API 返回海报。用户随后可以分享或保存它。\n\
    \nWeb 应用分为 HTML、CSS 和 jQuery。我们将关注 jQuery，因为魔法就发生在那里。\n\n### HTML\n\n以下是 Web 应用的基本结构。这里没什么特别的。\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n   <meta name=\"author\" content=\"Ben\
    \ Howdle\">\n   <meta name=\"description\" content=\"响应式海报抓取器\">\n   <title>Front\
    \ Row by Howdle</title>\n   <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n   <script src=\"https://ajax.jquery.com/jquery-1.6.2.js\"\
    ></script>\n   <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n\
    <div class=\"container\">\n   <header>\n      <h1>Front Row</h1>\n   </header>\n\
    \   <section>\n      <input type=\"text\" placeholder=\"Enter movie title\" id=\"\
    term\">\n      <button id=\"search\">Find me</button>\n   </section>\n   <section\
    \ id=\"poster\"></section>\n   <footer>\n      <p>Created by <a href=\"http://10k.anevent.com\"\
    >Ben Howdle</a></p>\n   </footer>\n</div>\n</body>\n</html>\n```\n\n### CSS\n\n\
    JSON 响应可以通过 jQuery 函数访问，允许我们按照心意对其进行操作、显示，更重要的是对其进行样式化。\n\n### jQuery\n\n$(document).ready(function(){\n\
    \   var full = $(\"#poster\").length ? true : false;\n   if(full == false){\n\
    \      $('#poster').empty();\n   }\n   $('#term').focus(function(){\n      //这是为了移除\n\
    \      var film = $('#term').val();\n      if(film == ''){\n         // 如果输入为空，显示一条消息\n\
    \         $('#poster').html(\"<h2>哈！我们忘记验证了！请输入一些内容。</h2>\");\n      } else {\n\
    \         // 他们输入了值，继续调用 API，首先显示加载消息以通知用户正在处理\n         $('#poster').html(\"\
    <h2 class='loading'>你的海报正在路上了！</h2>\");\n         $.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f3186/\"\
    \ + film + \"?callback=?\", function(json) {\n               // TMDb 足够友好，在未找到时返回消息，因此我们可以根据此信息进行条件判断\n\
    \               if (json != \"Nothing found.\"){\n                  // 显示海报和宣布结果的消息\n\
    \                     $('#poster').html('<h2 class=\"loading\">哇，天哪！我们为你找到了海报，跳过！</h2>><img\
    \ id=\"thePoster\" src=' + json[0].posters[0].image.url + ' />');\n          \
    \     }\n         });\n      }\n   });\n});\n"
- fmt: "\nHere we get to the meat of our API client. We use `jQuery`'s [`getJSON`](http://api.jquery.com/jQuery.getJSON/)\
    \ function, which, by definition, loads “JSON-encoded data from the server using\
    \ a `GET` HTTP request.” \n\nWe then use the API's URL, [suppled in this case\
    \ by TMDb](http://api.themoviedb.org/2.1/). As with many other APIs, you have\
    \ to register your application in order to receive a key (a 30-second process).\
    \ We insert the API key (`23afca60ebf72f8d88cdcae2c4f31866`) into the URL and\
    \ pass the user's movie title into the URL as a search parameter.\n\nOne thing\
    \ to mention is that appending `callback=?` to the end of the URL enables us to\
    \ make cross-domain JSON and AJAX calls. Don't forget this, otherwise the data\
    \ will be limited to your own domain! This method uses what's called JSONP (or\
    \ JSON with padding), which basically allows a script to fetch data from another\
    \ server on a different domain. To do this, we must specify the callback above\
    \ when jQuery loads the data. It replaces the `?` with our custom function's name,\
    \ thereby allowing us to make cross-domain calls with ease.\n\nIn the function's\
    \ callback, we have put the word `json` (which holds our retrieved data), but\
    \ we could have put `data` or `message`.\n\nThe next check is to see whether any\
    \ data was returned. TMDb is kind enough to supply us with a message of “Nothing\
    \ found” when it can't find anything. So, we've based our `if` statement on this\
    \ string's value.\n\nThis check is API-specific. Usually if no results are found,\
    \ we would expand the object to find a property named `length`, which would tell\
    \ us how many results were returned. If this happens, the code might look something\
    \ like this:\n\n```javascript\n if (json.length != 0){\n```\n\nAs a side note,\
    \ before writing even a line of code in the callback function of the JSON call,\
    \ we should become familiar with the results returned in Chrome's console or in\
    \ Firebug. This would tell us exactly what to check for in `if` statements and,\
    \ more importantly, what path to take to grab the data we want.\n\nLet's add `console.log(json);`,\
    \ like so:\n\n```javascript\n$.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f31866/\"\
    \ + film + \"?callback=?\", function(json) {\n         console.log(json);\n```\n\
    \nThis will output something like the following in the console of your favorite\
    \ browser (click the image to see the full size):\n\n[![](images/Screen-Shot-2011-12-21-at-12.53.55.png\
    \ \"Screen Shot 2011-12-21 at 12.53.55\"]](http://media.smashingmagazine.com/wp-content/uploads/2011/09/Screen-Shot-2011-09-12-at-22.21.03.png)\n\
    \nThe last line of this code outputs our poster. We display another message to\
    \ the user saying that we've found a result, and then proceed to show the image.\n\
    \nLet's spend a moment figuring out how we got to the poster images using the\
    \ line `json[0].posters[0].image.url`.\n\nThe reason we use `json[0]` is that\
    \ — since we want to display only one poster, and knowing how relevant TMDb's\
    \ results are — we can gamble on the first result. We then access the `posters`\
    \ array like so: `json[0].posters[0]`. Chrome even tells us that `posters` is\
    \ an array, so we know what we're dealing with. Again, we access the first value\
    \ of the array, having faith that it will be most relevant. It then tells us that\
    \ `image` is an object, so we can access it like so: `json[0].posters[0].image`.\
    \ By expanding our object further, we see that `image` contains a property named\
    \ `url`. Jackpot! This contains a direct image link, which we can use in the `src`\
    \ attribute of our image element.\n\n```javascript\n} else {\n\n   //If nothing\
    \ is found, I attempt humor by displaying a Goonies poster and confirming that\
    \ their search returned no results.\n\n   $.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/\n\
    23afca60ebf72f8d88cdcae2c4f31866/goonies?callback=?\", function(json) {\n\n  \
    \    $('#poster').html('<h2 class=\"loading\">We're afraid nothing was found for\
    \ that search. Perhaps you were looking for The Goonies?</h2><img id=\"thePoster\"\
    \ src=' + json[0].posters[0].image.url + ' />');\n\n   });\n}\n```\n\nHaving determined\
    \ that the API has no results for the user, we could display an error message.\
    \ But this being a movie-related Web app, let's give the user a preset poster\
    \ of The Goonies and let them know we couldn't find anything. We'll use the exact\
    \ same `src` attribute for the image that we used before, this time with `goonies`\
    \ hardcoded into the API call's URL.\n\n```javascript\n});\n\n          }\n\n\
    \        return false;\n   }\n\n   //Because we've wrapped the JSON code in a\
    \ function, we can call it on mouse click or on a hit of the Return button while\
    \ in the input field\n\n   $('#search').click(getPoster);\n\n   $('#term').keyup(function(event){\n\
    \n       if(event.keyCode == 13){\n\n           getPoster();\n\n       }\n\n \
    \  });\n\n});\n```\n\nIt is now clear why we wrapped our JSON call in a function:\
    \ doing so allows us to run the function when the user hits the submission button\
    \ or presses Enter while in the input field.\n\n![](images/Front-Row-by-Ben-Howdle_1316805278242-e1316805570421.png\
    \ \"Front Row Top Gun Poster\")\n\n### The Full Code\n\n#### The HTML\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n   <meta name=\"author\" content=\"Ben Howdle\"\
    >\n   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n   <title>Front Row by Howdle</title>\n   <link rel=\"stylesheet\" href=\"\
    style.css\">\n</head>\n<body>\n<div class=\"container\">\n   <header>\n      <h1>Front\
    \ Row</h1>\n   </header>\n   <section>\n      <input type=\"text\" placeholder=\"\
    Enter a movie\" id=\"term\">\n      <button id=\"search\">Find me poster</button>\n\
    \   </section>\n   <section id=\"poster\"></section>\n   <footer>\n      <p>Created\
    \ by <a href=\"http://co.uk\">Howdle</a></p>\n   </footer>\n</div>\n</html>\n\
    ```\n\n#### The jQuery\n\n```javascript\n$(document).ready(function(){\n\n   $('#term').focus(function(){\n\
    \      var full = $(\"#poster\").has(\"img\").length ? true : false;\n      if(full\
    \ == false){\n         $('#poster').empty();\n      }\n   });\n\n   var getPoster\
    \ = function(){\n\n        var film = $('#term').val();\n\n         if(film ==\
    \ ''){\n\n            $('#poster').html(\"Ha! We haven't forgotten to validate\
    \ the form! Please enter something.\");\n\n         } else {\n\n            $('#poster').html(\"\
    <h2 class='loading'>Your poster is on its way!\");\n\n\n\n            $.getJSON(\"\
    http://api.themoviedb.org/2.1/Movie.search/en/json/23afca60ebf72f8d88cdcae2c4f31866/\"\
    \ + film + \"?callback=?\", function(json) {\n               if (json != \"Nothing\
    \ found.\"){\n                     $('#poster').html('<h2 class=\"loading\">Well,\
    \ gee whiz! We found you a poster, skip!</h2><img id=\"thePoster\" src=' + json[0].posters[0].image.url\
    \ + ' />');\n                  } else {\n                     $.getJSON(\"http://api.themoviedb.org/2.1/Movie.search/en/json/\n\
    23afca60ebf72f8d88cdcae2c4f31866/goonies?callback=?\", function(json) {\n    \
    \                    console.log(json);\n                        $('#poster').html('<h2\
    \ class=\"loading\">We're afraid nothing was found for that search. Perhaps you\
    \ were looking for The Goonies?</h2><img id=\"thePoster\" src=' + json[0].posters[0].image.url\
    \ + ' />');\n                     });\n                  }\n             });\n\
    \n         }\n   });\n\n          }\n\n        return false;\n   }\n\n   $('#search').click(getPoster);\n\
    \n   $('#term').keyup(function(event){\n       if(event.keyCode == 13){\n    \
    \       getPoster();\n       }\n\n   });\n\n});\n```\n\n### Conclusion\n\nThat's\
    \ it: a handy method of reading data from a remote API with jQuery, and manipulating\
    \ the JSON output to fit our needs.\n"
