    将 CSS 留在 JavaScript 之外


    CSS 可以通过多种不同的选择器挂接到 HTML；这并不是什么新花样。通过使用 ID、类或你想到的任何属性（甚至是自定义属性），你可以轻松地访问并为元素样式。你也可以通过大量的
    JavaScript 方法来实现这一点，诚实地说，这只是相同的基本过程，语法不同（这是我 JavaScript 的“顿悟时刻”之一）。能够从 JavaScript
    和 CSS 原生访问 HTML，是渐进增强成为如此成功的开发模型的原因之一。它允许一个参考点来指导我们，并在开发项目时提醒我们，不要让“[水流交汇](http://www.youtube.com/watch?v=jyaLZHiJJnE)^(2)”。


    但当你继续使用 JavaScript 并构建具有高度交互元素的应用程序时，不仅要保持 HTML 留在 JavaScript 之外变得困难，要在你向文档注入样式信息之前阻止自己也变得困难。当然，不使用
    JavaScript 注入样式的理由绝不是黑即白的（是/否、真/假、0/1）；有很多情况你可能需要渐进地应用样式，例如在拖放界面中，位置信息需要根据光标（或手指）的位置不断更新。


