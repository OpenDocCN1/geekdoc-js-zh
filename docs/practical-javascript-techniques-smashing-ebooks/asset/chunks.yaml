    \ bullet points and phrases like “run it up the flagpole,” “blue-sky thinking”\
    \ and “low-hanging fruit,” and everything is always “moving forward.” Backwards\
    \ is not an option for people who [facilitate paradigm shifts in the zeitgeist](http://startupista.com/corporate-bullshit-generator/)^([1](#chapter-4.xhtml_fn4_1)).\
    \ Graphs of financial projections, quarterly sales figures and market saturation\
    \ are a middle-manager's dream.\n\n![screenshot](images/graph-tut-image-header.jpg\
    \ \"Creating an Animated Bar Graph with HTML, CSS & jQuery\")\n\nHow can we as\
    \ Web designers get in on all of this hot graph action? There are actually quite\
    \ a few ways to display graphs on the Web. We could simply create an image and\
    \ nail it to a Web page. But that's not very accessible or interesting. We could\
    \ use Flash, which is quite good for displaying graphs — but again, not very accessible.\
    \ Besides, designers, developers and [deities](http://www.apple.com/hotnews/thoughts-on-flash/)^([2](#chapter-4.xhtml_fn4_2))\
    \ are falling out of love with Flash. Technologies such as HTML5 can do many of\
    \ the same things without the need for a plug-in. The new HTML5 `<canvas>` element\
    \ could even be adapted to the task. Plenty of charting tools are online that\
    \ we might use. But what if we wanted something a little more tailored?\n\nThere\
    \ are pros and cons to the wide range of resources available to us, but this tutorial\
    \ will not explore them all. Instead, we'll create our graph using a [progressively\
    \ enhanced](http://coding.smashingmagazine.com/2009/04/22/progressive-enhancement-what-it-is-and-how-to-use-it/)^([3](#chapter-4.xhtml_fn4_3))\
    \ sprinkling of CSS3 and jQuery. Because we can.\n\n### What Are We Making?\n\n\
    We're making [this](http://provide.smashingmagazine.com/graph_tut_files/ex_03.html)^([4](#chapter-4.xhtml_fn4_4)).\
    \ And more! Here are some possibilities on how you can extend the techniques explored\
    \ in this tutorial:\n\n•A progress bar that indicates how long until the end of\
    \ all humanity in the event of a zombie plague;\n\n•A graph indicating the decline\
    \ in safe outdoor activities during a zombie plague;\n\n•A frighteningly similar\
    \ graph indicating the decline in manners during a zombie plague;\n\n•The increase\
    \ of people who were unaware of the zombie plague because they were sharing with\
    \ all of their now-deceased friends on Facebook what they did on [FarmVille](http://www.farmville.com/)^([5](#chapter-4.xhtml_fn4_5)).\n\
    \nOr you could create a graph or quota bar that simply illustrates something useful\
    \ and less full of dread and zombies. So, let's get on with it.\n\n#### What You'll\
    \ Need\n\n•A text or HTML editor. [Take your pick](http://en.wikipedia.org/wiki/Comparison_of_HTML_editors)^([6](#chapter-4.xhtml_fn4_6));\
    \ many are out there."
