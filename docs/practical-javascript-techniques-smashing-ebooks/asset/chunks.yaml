  trans: "\n\n- 调用 `displayGraph()` 为第一个柱状图（索引为 `0`）制作动画。\n\n最后，在 `createGraph()`\
    \ 的底部调用 `resetGraph()`，在我们沉浸在辛勤工作的荣誉中，见证奇迹发生。\n\n别这么急，小阳光！在继续进行之前，我们需要先穿上衣服。\n\
    \n## CSS\n\n我们需要做的第一件事是隐藏原始数据表格。我们可以通过多种方式实现这一点，但由于我们的 CSS 加载远早于 JavaScript，所以让我们用最简单的方法来实现：\n\
    \n```css\n#data-table {\n   display: none;\n}\n```\n\n搞定。让我们创建一个精美的容器区域来放置图表。因为使用了几个无序列表来制作图表，我们还需重置这些列表的样式。为\
    \ `#figure` 和 `.graph` 元素设置 `position: relative` 是重要的，因为这将元素精确地锚定在容器内我们想要的位置。\n\
    \n```css\n/* 容器 */\n\n#wrapper {\n   height: 420px;\n   left: 50%;\n   margin:\
    \ -210px 0 0 -270px;\n   position: absolute;\n   top: 50%;\n   width: 540px;\n\
    }\n\n#figure {\n   height: 380px;\n   position: relative;\n}\n\n#figure ul {\n\
    \   list-style: none;\n   margin: 0;\n   padding: 0;\n}\n\n.graph {\n   height:\
    \ 283px;\n   position: relative;\n}\n```\n\n现在是图例。我们将图例放置在其容器（`#figure`）的最底部，并将项目水平对齐：\n\
    \n```css\n/* 图例 */\n\n.legend {\n   background: #f0f0f0;\n   border-radius: 4px;\n\
    \   bottom: 0;\n   position: absolute;\n   text-align: left;\n   width: 100%;\n\
    }\n\n.legend li {\n   display: block;\n   float: left;\n   height: 20px;\n   margin:\
    \ 0;\n   padding: 10px 30px;\n   width: 120px;\n}\n\n.legend span.icon {\n   background-position:\
    \ 50% 0;\n   border-radius: 2px;\n   display: block;\n   float: left;\n   height:\
    \ 16px;\n   margin: 2px 10px 0 0;\n   width: 16px;\n}\n```\n\nx 轴与图例非常相似。我们将元素水平对齐，并将它们锚定在其容器（`.graph`）的底部：\n\
    \n```css\n/* x-轴 */\n\n.x-axis {\n   bottom: 0;\n   color: #555;\n   position:\
    \ absolute;\n   text-align: center;\n   width: 100%;\n}\n\n.x-axis li {\n   float:\
    \ left;\n   margin: 0 15px;\n   padding: 5px 0;\n   width: 76px;\n}\n```\n\ny\
    \ 轴稍微复杂一些，需要一些技巧。我们给它设置 `position: absolute` 以脱离正常内容流，但将其锚定在容器上。我们将每个 `li` 扩展到图表的全宽度，并在顶部添加一条边框。这将为我们的背景提供一些漂亮的横线。\n\
    \n利用负外边距的力量，我们可以偏移 `span` 内部的数字标签，使其向上并向左移动。非常漂亮！\n\n```css\n/* y-轴 */\n\n.y-axis\
    \ {\n   color: #555;\n   position: absolute;\n   text-align: right;\n   width:\
    \ 100%;\n}\n\n.y-axis li {\n   border-top: 1px solid #ccc;\n   display: block;\n\
    \   height: 62px;\n   width: 100%;\n}\n\n.y-axis li span {\n   display: block;\n\
    \   margin: -10px 0 0 -60px;\n   padding: 0 10px;\n   width: 40px;\n}\n```\n\n\
    现在是“濒危物种三明治”的核心：柱状图本身。让我们从柱状图和列的容器元素开始：\n\n```css\n/* 图表柱体 */\n\n.bars {\n   height:\
    \ 253px;\n   position: absolute;\n   width: 100%;\n   z-index: 10;\n}\n\n.bar-group\
    \ {\n   float: left;\n   height: 100%;\n   margin: 0 15px;\n   position: relative;\n\
    \   width: 76px;\n}\n```\n\n这里没有很复杂的东西。我们只是为容器设置了一些尺寸，并设置了 `z-index` 以确保它出现在 y\
    \ 轴标记之前。\n\n现在处理每个单独的 `.bar`：\n\n```css\n.bar {\n   border-radius: 3px 3px 0 0;\n\
    \   bottom: 0;\n   cursor: pointer;\n   height: 0;\n   position: absolute;\n \
    \  text-align: center;\n   width: 24px;\n}\n\n.bar.fig0 {\n   left: 0;\n}\n\n\
    .bar.fig1 {\n   left: 26px;\n}\n\n.bar.fig2 {\n   left: 52px;\n}\n```\n\n这里需要注意的主要样式有：\n\
    - `position: absolute` 和 `bottom: 0`，这意味着柱状图将附在图表的底部并向上生长；\n- 每个物种的柱状图（`.fig0`、`.fig1`\
    \ 和 `.fig2`）将位于 `.bar-group` 内。\n现在，为什么不通过 `border-radius` 属性来减少每个柱状图的左上和右上角的锐角呢？`border-radius`\
    \ 并非必须，但它为支持它的浏览器增加了很好的效果。坦率地说，最流行的浏览器最新版本都支持它。\n\n由于我们在每个柱状图中都放置了值，我们可以在悬停在柱状图时添加一个整洁的弹出窗口：\n\
    \n```css\n.bar span {\n   background:#fefe url(../images/info-bg.gif) 0 100% repeat-x;\n\
    \   border-radius: 3px;\n   left: -8px;\n   display: none;\n   margin: 0;\n  \
    \ position: relative;\n   text-shadow: rgba(255, 255, 255, 0.8) 0 1px 0;\n   width:\
    \ 40px;\n   z-index: 20;\n   -webkit-box-shadow: rgba(0, 0, 0.6) 0 1px 4px;\n\
    \   box-shadow: rgba(0, 0, 0.6) 0 1px 4px;\n}\n\n.bar:hover span {\n   display:\
    \ block;\n   margin-top: -25px;\n}\n```\n\n首先，弹出窗口通过 `display: none` 隐藏。然后当悬停在\
    \ `.bar` 元素上，我们设置 `display: block` 将其引入视野，并设置负的 `margin-top` 使它出现在每个柱状图上方。`text-shadow`、`rgba`\
    \ 和 `box-shadow` 属性目前大多数现代浏览器支持。在现代浏览器中，只有 Safari 需要前缀 (`-webkit-`) 来让 `box-shadow`\
    \ 生效。注意，这些属性只是图表的增强，Internet Explorer 8 则忽略了它们。\n\n我们将所有内容整合在一起的最后一步是为每个柱状图上色：\n\
    \n```css\n.fig0 {\n   background: #747474 url(../images/bar-01-bg.gif) 0 0 repeat-y;\n\
    }\n\n.fig1 {\n   background: #65c2e8 url(../images/bar-02-bg.gif) 0 0 repeat-y;\n\
    }\n\n.fig2 {\n   background: #eea151 url(../images/bar-03-bg.gif) 0 0 repeat-y;\n\
    }\n```\n\n在这个示例中，我简单地添加了 `background-color` 和垂直平铺的 `background-image`。这将更新柱状图以及图例中代表它们的小图标。不错。\n\
    \n而且，难以相信，就这样！\n\n## 完成品\n\n![screenshot](img/graph-tut-image-03.jpg \"示例 3：带\
    \ jQuery 的动画柱状图\")http://provide.smashingmagazine.com/graph_tut_files/ex_03.html\n\
    \n我们已经足够提醒公众数量过度数量的危险。然而，更希望你从这个教程中有所收获，并继续推向浏览器功能的边界——特别是在使用正确的 Web 标准且不使用第三方插件的情况下。如果你对如何扩展或改进这里看到的任何内容有想法，请在\
    \ Twitter 上找到我 [@derek_mack](http://twitter.com/derek_mack)。\n\n## 奖励：释放 CSS3\
    \ 的力量\n\n这个额外部分没有我们的主示例那么详细。它主要作为 CSS3 规范中考虑的一些功能的展示。\n\n由于目前对 CSS3 属性的支持有限，它们的使用也有限。尽管这里提到的某些功能正在进入其他\
    \ Web 浏览器，但基于 Webkit 的如 Apple Safari 和 Google Chrome 正在领先。\n\n我们实际上可以不使用任何图像创建图表，并使用\
    \ CSS 代替 jQuery 来制作柱状图动画。\n\n让我们从移除柱状图的背景图像开始，用 `-webkit-gradient` 属性替换它们：\n\n\
    ```css\n.fig0 {\n   background: -webkit-gradient(linear, left top, right top,\
    \ color-stop(0.0, #747474), color-stop(0.49, #676767), color-stop(0.5, #505050),\
    \ color-stop(1.0, #414141));\n}\n\n.fig1 {\n   background: -webkit-gradient(linear,\
    \ left top, right top, color-stop(0.0, #65c2e8), color-stop(0.49, #55b3e1), color-stop(0.5,\
    \ #3ba6dc), color-stop(1.0, #2794d4));\n}\n\n.fig2 {\n   background: -webkit-gradient(linear,\
    \ left top, right top, color-stop(0.0, #eea151), color-stop(0.49, #ea8f44), color-stop(0.5,\
    \ #e67e28), color-stop(1.0, #e06818));\n}\n```\n\n"
- fmt: "\nWe can do the same with our little number pop-ups:\n\n```\n.bar span {\n\
    \   background: -webkit-gradient(linear, left top, left bottom, color-stop(0.0,\
    \ #fff), color-stop(1.0, #e5e5e5));\n   …\n}\n```\n\nFor more information on Webkit\
    \ gradients, check out the [Surfin' Safari](http://webkit.org/blog/175/introducing-css-gradients/)^([16](#chapter-4.xhtml_fn4_16))\
    \ blog.\n\nContinuing with the pop-ups, let's introduce `-webkit-transition`.\
    \ CSS transitions are remarkably easy to use and understand. When the browser\
    \ detects a change in an element's property (`height`, `width`, `color`, `opacity`,\
    \ etc.), it will transition to the new property.\n\nAgain, refer to [Surfin' Safari](http://webkit.org/blog/138/css-animation/)^([17](#chapter-4.xhtml_fn4_17))\
    \ for more information on `-webkit-transition` and CSS3 animation.\n\nHere's an\
    \ example:\n\n```\n.bar span {\n   background: -webkit-gradient(linear, left top,\
    \ left bottom, color-stop(0.0, #fff), color-stop(1.0, #e5e5e5));\n   display:\
    \ block;\n   opacity: 0;\n\n   -webkit-transition: all 0.2s ease-out;\n}\n\n.bar:hover\
    \ span {\n   opacity: 1;\n}\n```\n\nWhen you hover over the bar, the margin and\
    \ opacity of the pop-up will change. This triggers a transition event according\
    \ to the properties we have set. Very cool.\n\nThanks to `-webkit-transition`,\
    \ we can simplify our JavaScript functions a bit:\n\n```javascript\n// Set individual\
    \ height of bars\nfunction displayGraph(bars, i) {\n   // Changed the way we loop\
    \ because of issues with $.each not resetting properly\n   if (i < bars.length)\
    \ {\n      // Add transition properties and set height via CSS\n      $(bars[i].bar).css({'height':\
    \ bars[i].height, '-webkit-transition': 'all 0.8s ease-out'});\n      // Wait\
    \ the specified time, then run the displayGraph() function again for the next\
    \ bar\n      barTimer = setTimeout(function() {\n         i++;\n         displayGraph(bars,\
    \ i);\n      }, 100);\n   }\n}\n// Reset graph settings and prepare for display\n\
    function resetGraph() {\n   // Set bar height to 0 and clear all transitions\n\
    \   $.each(bars, function(i) {\n      $(bars[i].bar).stop().css({'height': 0,\
    \ '-webkit-transition': 'none'});\n   });\n\n   // Clear timers\n   clearTimeout(barTimer);\n\
    \   clearTimeout(graphTimer);\n\n   // Restart timer\n   graphTimer = setTimeout(function()\
    \ {\n      displayGraph(bars, 0);\n   }, 200);\n}\n```\n\nHere are the main things\
    \ we've changed:\n\n- Set the height of the bars via the jQuery `css()` function,\
    \ and allowed CSS transitions to take care of the animation;\n- When resetting\
    \ the graph, turned transitions off so that the height of the bars is instantly\
    \ set to 0.\n\n[Check out the example](http://provide.smashingmagazine.com/graph_tut_files/ex_04.html)^([18](#chapter-4.xhtml_fn4_18))\
    \ if you have the latest version of Safari or Chrome installed.\n\n### Ultra-Mega\
    \ Webkit Bonus: Now In 3-D!\n\nFor a sneak peek of what the future holds, [check\
    \ out a little experiment](http://provide.smashingmagazine.com/graph_tut_files/ex_05.html)^([19](#chapter-4.xhtml_fn4_19))\
    \ that I put together, with a 3-D effect and CSS transforms. Again, it requires\
    \ the latest versions of Safari or Chrome:\n\nAs in our previous Webkit example,\
    \ there are **no images**, and **all animation is handled via CSS**. [Kiss my\
    \ face!](http://www.youtube.com/watch?v=bkcCBXZHfPw)^([20](#chapter-4.xhtml_fn4_20))\n\
    \nI can't tell you what to do with all this information. But I do caution you\
    \ about the potential misuse of your new powers. In the words of our friend Captain\
    \ Planet, “The power is yours!”\n\nUse it wisely.\n\n—\n\n1. [http://startupista.com/corporate-bullshit-generator/](http://startupista.com/corporate-bullshit-generator/)\n\
    2. [http://www.apple.com/hotnews/thoughts-on-flash/](http://www.apple.com/hotnews/thoughts-on-flash/)\n\
    3. [http://coding.smashingmagazine.com/2009/04/22/progressive-enhancement-what-it-is-and-how-to-use-it/](http://coding.smashingmagazine.com/2009/04/22/progressive-enhancement-what-it-is-and-how-to-use-it/)\n\
    4. [http://provide.smashingmagazine.com/graph_tut_files/ex_03.html](http://provide.smashingmagazine.com/graph_tut_files/ex_03.html)\n\
    5. [http://www.farmville.com/](http://www.farmville.com/)\n"
  raw: "We can do the same with our little number pop-ups:\n\n```\n.bar span {\n \
    \  background: -webkit-gradient(linear, left top, left bottom, color-stop(0.0,\
    \ #fff), color-stop(1.0, #e5e5e5));\n   …\n}\n```\n\nFor more information on Webkit\
    \ gradients, check out the [Surfin' Safari](http://webkit.org/blog/175/introducing-css-gradients/)^([16](#chapter-4.xhtml_fn4_16))\
    \ blog.\n\nContinuing with the pop-ups, let's introduce `-webkit-transition`.\
    \ CSS transitions are remarkably easy to use and understand. When the browser\
    \ detects a change in an element's property (height, width, color, opacity, etc.),\
    \ it will transition to the new property.\n\nAgain, refer to [Surfin' Safari](http://webkit.org/blog/138/css-animation/)^([17](#chapter-4.xhtml_fn4_17))\
    \ for more information on `-webkit-transition` and CSS3 animation.\n\nHere's an\
    \ example:\n\n```\n.bar span {\n   background: -webkit-gradient(linear, left top,\
    \ left bottom, color-stop(0.0, #fff), color-stop(1.0, #e5e5e5));\n   display:\
    \ block;\n   opacity: 0;\n\n   -webkit-transition: all 0.2s ease-out;\n}\n\n.bar:hover\
    \ span {\n   opacity: 1;\n}\n```\n\nWhen you hover over the bar, the margin and\
    \ opacity of the pop-up will change. This triggers a transition event according\
    \ to the properties we have set. Very cool.\n\nThanks to `-webkit-transition`,\
    \ we can simplify our JavaScript functions a bit:\n\n```\n// Set individual height\
    \ of bars\nfunction displayGraph(bars, i) {\n   // Changed the way we loop because\
    \ of issues with $.each not resetting properly\n   if (i < bars.length) {\n  \
    \    // Add transition properties and set height via CSS\n      $(bars[i].bar).css({'height':\
    \ bars[i].height, '-webkit-transition': 'all 0.8s ease-out'});\n      // Wait\
    \ the specified time, then run the displayGraph() function again for the next\
    \ bar\n      barTimer = setTimeout(function() {\n         i++;\n         displayGraph(bars,\
    \ i);\n      }, 100);\n   }\n}\n// Reset graph settings and prepare for display\n\
    function resetGraph() {\n   // Set bar height to 0 and clear all transitions\n\
    \   $.each(bars, function(i) {\n      $(bars[i].bar).stop().css({'height': 0,\
    \ '-webkit-transition': 'none'});\n   });\n\n   // Clear timers\n   clearTimeout(barTimer);\n\
    \   clearTimeout(graphTimer);\n\n   // Restart timer\n   graphTimer = setTimeout(function()\
    \ {\n      displayGraph(bars, 0);\n   }, 200);\n}\n```\n\nHere are the main things\
    \ we've changed:\n\n•Set the height of the bars via the jQuery `css()` function,\
    \ and allowed CSS transitions to take care of the animation;\n\n•When resetting\
    \ the graph, turned transitions off so that the height of the bars is instantly\
    \ set to 0.\n\n[Check out the example](http://provide.smashingmagazine.com/graph_tut_files/ex_04.html)^([18](#chapter-4.xhtml_fn4_18))\
    \ if you have the latest version of Safari or Chrome installed.\n\n#### Ultra-Mega\
    \ Webkit Bonus: Now In 3-D!\n\nFor a sneak peek of what the future holds, [check\
    \ out a little experiment](http://provide.smashingmagazine.com/graph_tut_files/ex_05.html)^([19](#chapter-4.xhtml_fn4_19))\
    \ that I put together, with a 3-D effect and CSS transforms. Again, it requires\
    \ the latest versions of Safari or Chrome:\n\nAs in our previous Webkit example,\
    \ there are **no images**, and **all animation is handled via CSS**. [Kiss my\
    \ face!](http://www.youtube.com/watch?v=bkcCBXZHfPw)^([20](#chapter-4.xhtml_fn4_20))\n\
    \nI can't tell you what to do with all this information. But I do caution you\
