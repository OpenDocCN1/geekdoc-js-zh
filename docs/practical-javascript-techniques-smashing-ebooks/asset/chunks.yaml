    but even with a defined name the solutions were still considered hacks. **So,
    what''s changed?**


    In my opinion there are a number of factors that have moved real-time Web technologies
    to the forefront of Web application development.


    #### Social Media Data


    Social media, and specifically Twitter, has meant that more and more data is becoming
    instantly available. Gone are the days where we have to wait an eternity for Google
    to find our data (blog posts, status updates, images). There are now platforms
    that not only make our data instantly discoverable but also instantly deliver
    it to those who have declared an interest. This idea of [Publish/Subscribe](http://en.wikipedia.org/wiki/Publish%E2%80%93subscribe_pattern)^([4](#chapter-6.xhtml_fn6_4))
    is core to the real-time Web, especially when building Web applications.


    #### Increased User Expectations


    As more users moved to using applications such as Twitter and Facebook, and the
    user experiences that they deliver, their perception of what can be expected from
    a Web application changed. Although applications had become more dynamic through
    the use of JavaScript, the experiences were seldom truly interactive. Facebook,
    with it''s real-time wall (and later other realtime features) and Twitter with
    it''s activity stream centric user interface, and focus on conversation, demonstrated
    how Web applications could be highly engaging.


    #### WebSockets


    ![HTML5 and WebSockets Rock!](images/HTML5_Logo_256.png "HTML5 Logo")


    Earlier on I stated that previous solutions to let servers instantly push data
    to Web browsers were considered "hacks". But this didn''t remove the fact that
    there was a requirement to be able to do this in a cross-browser and standardised
    way. Our prayers have finally been answered with **HTML5** [WebSockets](http://pusher.com/websocket)^([5](#chapter-6.xhtml_fn6_5)).
    WebSockets represent a [stardardized API](http://www.w3.org/TR/websockets/)^([6](#chapter-6.xhtml_fn6_6))
    and [protocol](http://tools.ietf.org/html/rfc6455)^([7](#chapter-6.xhtml_fn6_7))
    that allows realtime server and client (web browser) two way communication over
