    \n34.[https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools/SafariDeveloperTools.html](https://developer.apple.com/library/safari/#documentation/appleapplications/Conceptual/Safari_Developer_Guide/2SafariDeveloperTools/SafariDeveloperTools.html)\n\
    \n35.[http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log](http://pusher.com/docs/client_api_guide/client_global_configuration#pusher_log)\n\
    \n36.[http://pusher.com/docs/connection_states](http://pusher.com/docs/connection_states)\n\
    \n# The Developer's Guide To Conflict-Free JavaScript And CSS In WordPress\n\n\
    By Peter Wilson\n\nImagine you're playing the latest hash-tag game on Twitter\
    \ when you see this friendly tweet:\n\n> You might want to check your #WP site.\
    \ It includes two copies of jQuery. Nothing's broken, but loading time will be\
    \ slower.\n\nYou check your source code, and sure enough you see this:\n\n```\n\
    <script src=\"/wp-includes/js/jquery/jquery.js?ver=1.6.1\" type=\"text/javascript\"\
    ></script>\n<script src=\"/wp-content/plugins/some-plugin/jquery.js\"></script>\n\
    ```\n\n![sm-wp-css-js](images/sm-wp-css-js.jpg)\n\n#### What Went Wrong?\n\nThe\
    \ first copy of jQuery is included the WordPress way, while `some-plugin` includes\
    \ jQuery as you would on a static HTML page.\n\nA number of JavaScript frameworks\
    \ are included in WordPress by default, including:\n\n•Scriptaculous,\n\n•jQuery\
    \ (running in [noConflict mode](http://api.jquery.com/jQuery.noConflict/)^([1](#chapter-7.xhtml_fn7_1))),\n\
    \n•the jQuery UI core and selected widgets,\n\n•Prototype.\n\nA [complete list\
    \ can be found in the Codex](http://codex.wordpress.org/Function_Reference/wp_enqueue_script#Default_scripts_included_with_WordPress)^([2](#chapter-7.xhtml_fn7_2)).\
    \ On the same page are instructions for using [jQuery in noConflict mode](http://codex.wordpress.org/Function_Reference/wp_enqueue_script#jQuery_noConflict_wrappers)^([3](#chapter-7.xhtml_fn7_3)).\n\
    \n#### Avoiding the Problem"
