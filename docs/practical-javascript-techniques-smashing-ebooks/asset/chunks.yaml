    7 values

    ```


    That''s around 5 to 6 characters per value, so 2560 to 3072 characters for 512
    numbers (which is 5 to 6 KB). `JSON.stringify()` even wastes 2 more characters
    in each case, for the opening and closing brackets, but its advantage is that
    you get your original value types back with `JSON.parse()` instead of strings.


