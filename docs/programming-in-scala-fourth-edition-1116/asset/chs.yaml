  现在，假设你有一个非常长的序列（一系列单词），你想在该序列的前 10 万个单词中找到一个回文。你可以重用 `findPalindrome` 的定义吗？当然，你可以这样写：\n\
  \n```\nfindPalindrome(words take 1000000)\n```\n\n这很好地将“获取序列的前 10 万个单词”和“在其中寻找回文”这两个方面分离开来。但缺点是，它总是会构建一个包含一百万个单词的中间序列，即使该序列的第一个单词已经是回文。因此，可能有\
  \ 999,999 个单词被复制到中间结果中，而在之后没有经过任何检查。许多程序员会在这里放弃，并编写一个专门的版本，用于在参数序列的某些前缀中查找回文。但有了视图（views），你不需要这样做。只需写：\n\
  \n```\nfindPalindrome(words.view take 1000000)\n```\n\n这具有同样良好的关注点分离，但它构建的不是包含百万个元素的序列，而是一个单一的轻量级视图对象。这样，你就不需要在性能和模块化之间做选择了。\n\
  \n在看过了视图的这些精妙用法后，你可能会想，为什么还要严格集合（strict collections）呢？原因之一是性能对比并不总是惰性优于严格集合。对于较小的集合，在视图中创建和应用闭包所增加的开销通常大于避免中间数据结构带来的收益。另一个可能重要的原因是，如果延迟操作具有副作用，那么视图中的求值可能会非常困惑。\n\
  \n这里有一个例子，曾困扰了一些 Scala 2.8 之前的版本用户。在这些版本中，`Range` 类型是惰性的，因此它的行为实际上类似于视图。人们尝试这样创建数量的\
  \ actor：\n\n```\nval actors = for (i <- 1 to 10) yield actor { ... }\n```\n\n他们惊讶地发现，之后没有任何\
  \ actor 在执行，尽管 actor 方法本应该从紧随其后的大括号包含的代码中创建并启动一个 actor。为了解释为什么什么都没有发生，请记住上面的 `for`\
  \ 表达式等同于 `map` 方法的应用：\n\n```\nval actors = (1 to 10) map (i => actor { ... })\n\
  ```\n\n由于之前 `(1 to 10)` 产生的范围行为类似于视图，因此 `map` 的结果也是一个视图。也就是说，没有元素被计算，因此，也没有 actor\
  \ 被创建！如果强制执行整个表达式的范围，本会创建 actor，但要让 actor 发挥工作需要这样做，这并不是显而易见的。\n\n为了避免此类意外状况，Scala\
  \ 集合在 2.8 版本中获得了更规则的规定。除了惰性列表（lazy lists）和视图外，所有集合都是严格的。从严格集合变为惰性集合的唯一方法是通过 `view`\
  \ 方法。返回回去的唯一方法是通过 `to`。因此，上面的 `actors` 定义在 Scala 2.8 中行为将符合预期，它会创建并启动十个 actor。要恢复到那种令人惊讶的先前行为，你需要添加一个显式的\
  \ `view` 方法调用：\n\n```\nval actors = for (i <- (1 to 10).view) yield actor { ...\
  \ }\n```\n\n总结来说，视图是兼顾效率关注与模块化关注点的强大工具。但为了不陷于延迟求值的各个方面，你应该将视图限制在纯函数代码中，其中集合转换没有副作用。最好避免将视图与既创建新集合又具有副作用的操作混合使用。\n\
