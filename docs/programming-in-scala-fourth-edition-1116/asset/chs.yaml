  # 引言\n\n这是一本关于 Scala 编程语言的教程，由直接参与 Scala 开发的人编写。我们的目标是，通过阅读这本书，你可以学到成为 Scala 程序员所需的所有知识。书中的所有示例都可以在\
  \ `2.13` 中编译。\n\n## 谁应该读这本书\n\n这本书的主要受众是想要学习编程 Scala 的程序员。如果你想在下一个软件项目中使用 Scala，那么这本书就适合你。此外，这本书对于希望通过学习新概念来扩展视野的程序员很有吸引。例如，如果你是一个\
  \ Java 程序员，阅读这本书将让你接触许多函数式编程概念以及高级对象思想。我们相信学习 Scala 及其背后的思想有助于你成为更好的程序员。\n\n假设具备通用编程知识。虽然\
  \ Scala 是一门很好的入门编程语言，但并不是学习编程的书。\n\n另一方面，不需要特定的编程语言知识。尽管大多数人在 Java 平台上使用 Scala，但我们预计许多读者熟悉\
  \ Java，因此有时会将 Scala 与 Java 进行比较。\n\n## 如何使用这本书\n\n由于这本书的主要目的是教程，建议的阅读方式是按照章节顺序从前向后。我们努力一次只介绍一个主题，并仅用已经介绍过的主题来解释新主题。因此，如果你跳到后面去抢先看某些内容，你可能会发现它是用你尚未完全理解的概念来解释的。在能够按顺序阅读章节的范围内，我们认为你获得\
  \ Scala 能力将非常顺利。\n\n\n\n\n在你读完这本书后，它也应该能够作为语言参考手册。Scala 语言有一个正式的规范，但该规范为了追求精确性往往牺牲了可读性。虽然这本书没有涵盖每一个细节，但它非常详尽，当你对\
  \ Scala 编程变得越来越熟练时，它应该作为一份易于上手的语言参考。\n\n### 如何学习 Scala\n\n通过从头到尾阅读这本书，你就能学到很多关于\
  \ Scala 的知识。不过，如果你做一些额外的工作，学得更快更彻底。\n\n首先，你可以利用书中包含许多示例。手动输入这些示例是强迫大脑思考每一行代码的方法。尝试各种变体可以让学习变得更有趣，并确保你真正理解了它们的工作原理。\n\
  \n其次，保持关注大量的在线论坛。这样，你和其他 Scala 爱好者就可以互相帮助。花些时间找到你需要的论坛。你会在小问题上花费少得的时间，从而能将时间花在更深层次、更重要的问题上。\n\
  \n最后，一旦你读了足够的内容，就着手自己的自己的编程项目。从零开始编写小型程序，或者为一个大型程序开发一个插件。仅靠阅读的进步是有限的。\n\n### eBook\
  \ 特性\n\n这本书有纸质版和 PDF 版。eBook 并不是纸质版的电子副本。虽然内容与纸质版相同，但 eBook 经过了精心设计，并针对电脑屏幕阅读进行了优化。\n\
  \n首先注意到，eBook 中的大多数引用都是超链接。如果你选择某个章节、图表或词表条目的引用，你的 PDF 查看器将直接带到该项目，这样你就不必反复翻页查找。\n\
