  \n### 错误列表\n尽管这本书经过了大量的审查和检查，但错误不可避免地会漏。如需查看本书的（希望是简短的）错误列表，请访问 [`booksites.artima.com/programming_in_scala_4ed/errata`](http://booksites.artima.com/programming_in_scala_4ed/errata)。如果你发现错误，请在上述\
  \ URL 报告，以便我们可以在书中未来的打印或版本中进行修复。\n\n《Scala 编程》，第四版 第四版\n\n```\nprintln(\"Hello,\
  \ reader!\")\n```\n\n## 第 1 章\n## 一种可扩展语言\nScala 的名字代表“可扩展语言”（scalable language）。该语言之所以得名，是因为它的设计初衷是随着用户的需求而增长。你可以将\
  \ Scala 应用于广泛的任务，从编写小型脚本到构建大型框架不等。Scala 很容易上手，因为它运行在 Java 平台上，并与 Java 无缝互操作。\n\n\
  从技术上讲，Scala 是面向对象和函数式概念的混合。在许多方面，面向对象和函数式的风格使得它比任何广泛使用的语言都无处不在。Scala 的构造使得构建有趣的东西变得简单。本章回答了“为什么要用\
  \ Scala？”这个问题。它提供了 Scala 的高层视图及其背原理。读完本章后，你应该对 Scala 是什么以及它能完成哪些任务有一个基本的感受。虽然这本书是一本教程，但本章并不是真正教程的一部分。如果你急于开始编写\
  \ Scala 代码，应该直接跳到 第 2 章。\n\n### 1.1 一种让你越用越顺手的语言\n不同规模的程序往往需要不同的构造。例如，考虑以下小程序：\n\
  \n```\nvar capital = Map(\"US\" -> \"Washington\", \"France\" -> \"Paris\")\n\n\
  capital += (\"Japan\" -> \"Tokyo\")\n\nprintln(capital(\"France\"))\n```\n这个程序建立了一个从国家到首都的映射，通过添加新的绑定\
  \ `\"Japan\" -> \"Tokyo\"` 来修改映射，并打印与法国相关的首都。示例中的记法是高层的、直击要点的，并且没有被多余的分号或类型注释干扰。事实上，它的感觉就像\
  \ Perl、Python 或 Ruby 这样的现代“脚本”语言。关联映射（Associative maps）非常有用，因为有助于保持程序的可读性和简洁，但有时你可能不同意“一刀切”的哲学，因为你需要更细粒度地控制程序中使用映射的属性。如果你需要，Scala\
  \ 会为你提供这种细粒度的控制，因为 Scala 中的映射并不是语言语法。它们是库抽象，你可以对其进行扩展和适应。在示例程序中，你获得默认的 `Map` 实现，但你可以轻松更改它。例如，你可以指定特定的实现，如\
  \ `HashMap` 或 `TreeMap`，或者调用 `par` 方法以获取一个并行执行操作的 `ParMap`。你可以为映射指定默认值，也可以重写你创建的映射的任何其他方法。在每种情况下，你都可以可以使用示例中相同的映射访问语法。\n\
  \n\n\n\n此示例展示了 Scala 如何同时兼顾便利性和灵活性。Scala 拥有一套方便的结构，可以帮助你快速上手，并让你以一种令人愉快的简洁风格进行编程。同时，你可以放心地不会被该语言所局限。你始终可以根据自己的需求定制程序，因为一切都是基于你可以根据需要选择和适配的库模块的。\n\
  \n### 扩展新类型\n\n埃里克·雷蒙德（Eric Raymond）将“大教堂”（cathedral）和“大集市”（bazaar）作为软件开发的两种隐喻。大教堂像是一座近乎完美的建筑，需要很长时间才能建成，一旦建成，它在长时间内保持不变。相比之下，集市每天由在其中工作的人进行调整和扩展。在雷蒙德的作品中，集市是开源软件开发的隐喻。盖·斯蒂尔（Guy\
  \ Steele）在一次关于“语言增长”的演讲中提到，同样的区别也适用于语言设计。Scala 在某种意义上更像集市而不是大教堂，它的设计初衷是让编写程序的人进行扩展和适配。Scala\
  \ 并不是在一个“完美完整”的语言中提供你可能需要的所有结构，而是将构建此类结构的工具交到你手中。\n\n这是一个示例。许多应用程序需要一种整数类型，这种整数可以变得任意大而不会发生算术运算的溢出或“回绕”。Scala\
  \ 在库类 `scala.math.BigInt` 中定义了这种类型。以下是使用该类型的方法定义，用于计算传入的整数值的阶乘：\n\n```scala\n def\
  \ factorial(x: BigInt): BigInt = \n  if (x == 0) 1 else x * factorial(x - 1)\n```\n\
  \n现在，如果你调用 `factorial(30)`，将得到：\n\n```\n 265252859812191058636308480000000\n```\n\
  \n`BigInt` 看起来像是一个内置类型，因为你可以对该类型的值使用整数字面量以及 `*` 和 `-` 等运算符。然而，它只是一个恰好定义在 Scala 标准库中的类。如果缺少这个类，任何\
  \ Scala 程序员来编写一个实现都是非常简单的，例如通过封装 Java 的类 `java.math.BigInteger`（事实上，Scala 的 `BigInt`\
  \ 类就是这样实现的）。\n\n当然，你也可以直接使用 Java 的类。但结果远没有理想，因为虽然 Java 允许你创建新类型，但这些类型的感觉并不像原生的语言支持：\n\
  \n```scala\n import java.math.BigInteger\n\n  def factorial(x: BigInteger): BigInteger\
  \ =\n  if (x == BigInteger.ZERO)\n    BigInteger.ONE\n  else\n    x.multiply(factorial(x.subtract(BigInteger.ONE)))\n\
  ```\n\n`BigInt` 代表了许多其他数值类型——大精度小数、复数、有理数、置信区间、多项式等等，不此。某些编程语言原生实现了其中一些类型。例如，Lisp、Haskell\
  \ 和 Python 实现了整数；Fortran 和 Python 实现了复数。但任何试图同时实现所有这些抽象的语言都会变得过于庞大而无法管理。此外，即使存在这样的语言，某些应用程序无疑会从未提供的其他数值类型中受益。因此，试图在一种语言中提供一切的方法扩展性并不良好。相反，Scala\
  \ 允许用户通过定义类似于原生语言支持的易用库，按照他们需要的方向增长和适配语言。\n\n### 扩展新的控制结构\n\n之前的示例演示了 Scala 允许你添加新类型，这些类型可以使用像内置类型一样方便。同样的扩展原则也适用于控制结构。这种扩展性可以通过\
  \ Akka 来说，Akka 是一个用于“基于 actor”并发编程的 Scala API。\n\n随着多核处理器在未来几年中不断普及，获得可接受的可能越来越需要你在应用程序中利用更多的并行性。这通常意味着要重写代码，使计算分布在多个并发线程上。遗憾的是，在实践中创建可靠的多线程应用程序被证明是挑战性的。Java\
  \ 的线程模型围绕共享内存和锁构建，这种模型很难推理，特别是当系统规模和复杂性增加时。很难确保没有隐藏的竞态条件或死锁——这些问题在测试期间没有出现，但在生产环境中可能会出现。一个可以说更安全的替代方案是消息传递架构，例如\
  \ Erlang 编程语言使用的“actor”方法。\n\nJava 自带丰富的基于线程的并发库。Scala 程序可以像使用其他 Java API 一样使用它。然而，Akka\
  \ 是一个额外的 Scala 库，实现了类似于 Erlang 的 actor 模型。\n\nActor 是在线程之上实现的并发抽象。它们通过向彼此发送消息进行通信。一个\
  \ actor 可以执行两个基本操作：消息发送和接收。发送操作由感叹号（`!`）表示，向 actor 发送消息。这里是一个示例，actor 命名为 recipient：\n\
  \n```\n recipient ! msg\n```\n\n发送是异步的；也就是说，发送方 actor 可以立即继续，无需等待消息被接收和处理。每个 actor\
  \ 都有一个邮箱，传入的消息在其中排队。actor 通过 `receive` 块处理到达其邮箱中的消息：\n\n```scala\n def receive =\
  \ {\n  case Msg1 => ... // 处理 Msg1\n  case Msg2 => ... // 处理 Msg2\n  // ...\n  }\n\
  ```\n\n`receive` 块由若干 `case` 组成，每个 case 用消息模式查询邮箱。邮箱中匹配任何任一 case 的第一条消息会被选中，并对其执行相应的操作。一旦邮箱不再包含任何消息，actor\
  \ 就会挂起并等待进一步的传入消息。\n\n例如，这里有一个实现校验和器服务的简单 Akka actor：\n\n```scala\n class ChecksumActor\
  \ extends Actor {\n  var sum = 0\n  def receive = {\n    case Data(byte) => sum\
  \ += byte\n    case GetChecksum(requester) =>\n      val checksum = ~(sum & 0xFF)\
  \ + 1\n      requester ! checksum\n  }\n  }\n```\n\n这个 actor 首先定义了一个名为 `sum` 的局部变量，初始值为零。它定义了一个处理消息的\
  \ `receive` 块。如果它收到 `Data` 消息，它会将包含的字节添加到 `sum` 变量。如果它收到 `GetChecksum` 消息，它根据 `sum`\
  \ 的当前值计算校验和，并使用消息发送 `requester ! checksum` 将结果发回请求者。`requester` 字段在 `GetChecksum`\
  \ 消息中，通常指向发送请求的 actor。\n\n我们并不让你现在完全理解这个 actor 示例。相反，这个示例对于扩展性这个主题意义在于，`receive`\
  \ 块和消息发送（`!`）都不是 Scala 的内置操作。尽管 `receive` 块看起来和运行非常像内置控制结构，但它实际上是定义在 Akka  库中的一个方法。同样，尽管\
  \ `!` 看起来像是一个内置运算符，它也只是定义在 Akka  库中的一个方法。这两个构造完全独立于 Scala 编程语言。\n\n\n\n\n\nScala\
  \ 中的接收块（receive block）和发送（`!`）的语法看起来与 Erlang 非常相似，但在 Erlang 中，这些构造是内置在语言中的。Akka\
  \ 也实现了 Erlang 的大部分其他并发编程构造，例如监控失败的 actor 和超时处理。总之，actor 模型（actor model）证明是表达并发和分布式计算的一种非常优的手段。尽管它们必须在库中定义，但\
  \ actor 感觉就像是 Scala 语言不可或缺的一部分。\n\n这个示例说明了你可以在新的方向上“扩展”Scala 语言，即使是像并发编程这样专门的领域。诚然地说，你需要优秀的架构师和程序员来实现这一点。但关键的一点是这是可行的——你可以在\
  \ Scala 中设计并实现解决全新新应用领域的抽象，而在使用时仍然感觉像是原生语言的支持。\n\n## 1.2 是什么让 Scala 具有可扩展性？\n\n\
  可扩展性受许多因素影响，从语法细节到组件抽象构造不一。如果我们被迫只能列出 Scala 一个有助于可扩展性的方面，我们会选择它面向对象编程与函数式编程的结合（好吧，我们作弊了，那实际上是两个方面，但它们是交织的）。\n\
  \nScala 在将面向对象和函数式编程融合为统一的语言设计方面，比所有其他知名语言更进一步。例如，其他语言可能将对象和函数视为两个不同的概念，而在 Scala\
  \ 中，函数值是一个对象。函数类型（Function types）是可以被子类继承的类。这看起来似乎不仅仅是学术上的奇巧，但它对可扩展性具有深远的影响。事实上，如果没有函数和对象的这种统一，就无法实现之前所示\
  \ actor 概念。本节概述了 Scala 融合面向对象和函数式概念的方法。\n\n#### Scala 是面向对象的\n\n面向对象编程取得了巨大的成功。从\
  \ 20 世纪 60 年中期的 Simula 到 70 年代的 Smalltalk，它现在支持它的语言比不支持它的语言还要多。在某些领域，对象已经完全接管主导。虽然对“面向对象”的含义没有精确的定义，但显然对象有某些东西吸引着程序员。从原则上说，面向对象编程的动机非常简单：所有最微小的程序都需要某种结构。实现这一点最直接的方法是将数据和操作放入某种形式的容器中。面向对象编程的伟大想法是让这些容器完全通用化，以便它们既可以包含操作也可以包含数据，而且它们本身是可以存储在其他容器中的值，或作为参数传递给操作。Smalltalk\
  \ 的发明者 Alan Kay 评论道，通过这种方式，简单的对象与完整的计算机相同的结构：它将数据与操作相结合。\n\n尽管面向对象编程长期一直是主流，但只有极少数的语言像\
  \ Smalltalk 那样将这种构造推向了极致。例如，许多语言允许非对象值的存在，比如 Java 中的原始值（primitive values）。或者它们允许不属于任何对象的静态字段和方法。这些对纯面向对象编程理念的偏离初看起来是无害的，但它们有一种烦人的倾向，会使问题复杂化并限制可扩展性。\n\
  \n相比之下，Scala 是一种纯形式的面向对象语言：每个值都是对象，每个操作都是方法调用。例如，当你在 Scala 中说 `1 + 2` 时，你实际上是在调用定义在\
  \ `Int` 类中的名为 `+` 的方法。这就是 Akka 的 actor API 允许你使用如前例所示表达式的原因：`!` 是 `Actor` 类的一个方法。\n\
  \n在组合对象方面，Scala 比大多数其他语言都更先进。一个例子是 Scala 的 `traits`。Traits 类似于 Java 的接口（interfaces），但它们也可以拥有方法实现甚至字段。对象是通过混入组合（mixin\
  \ composition）构建的，这种组合获取类的成员并将许多 trait 的成员添加到它们中。通过这种方式，类的不同方面可以封装在不同的 trait 中。这看起来有点像多重继承，但在细节上有所不同。与类不同，`trait`\
  \ 可以为未指定的父类添加一些新功能。这使得 trait 比类更具“可插性”。特别是，它避免了多重继承中经典的“菱继承”问题（这种问题当同一个类通过多个不同的路径被继承时产生）。\n\
  \n#### Scala 是函数式的\n\n除了是一门纯面向对象的语言外，Scala 也是一种全函数式语言。函数式编程的思想比（电子）计算机还要悠老。它们的基础建立在\
  \ Alonzo Church 在 20 世纪 30 年代开发的 lambda 演算中。第一种函数式编程语言是 Lisp，可以追溯到 50 年代末。其他流行的函数式语言还有\
  \ Scheme、SML、Erlang、Haskell、OCaml 和 F#。长期以来，函数式编程一直处于边缘地位——在学术界流行，但在工业界并没有那么广泛使用。然而，近年来，对函数式编程语言和技术的兴趣增加了。\n\
  \n函数式编程受两个主要思想引导。第一个思想是函数是等等值（first-class values）。在函数式语言中，函数的地位与整数或字符串相同。你可以将函数作为参数传递给其他函数，将它们作为结果从函数返回，或将它们存储在变量中。你可以在另一个函数内部定义函数，就像你可以在函数内部定义一个整数值一样。你可以在不给函数命名的情况下定义函数，像写\
  \ `42` 整数字面量一样简单地在代码中编写函数字面量。\n\n等等值函数为抽象操作和创建新的控制结构提供了方便的方法。这种函数的泛化提供了极大的表达力，通常会导致非常易读且简洁的程序。它对可扩展性也起着重要作用。例如，ScalaTest\
  \ 测试库提供了一个 `eventually` 构造，它接受函数作为参数。用法如下：\n\n```\nval xs = 1 to 3\nval it = xs.iterator\n\
  eventually { it.next() shouldBe 3 }\n```\n\n`eventually` 内部的代码——断言 `it.next() shouldBe\
  \ 3`——被封装在一个函数中，并未执行地传递给 `eventually` 方法。在配置的时间范围内，`eventually` 会反复执行该函数直到断言成功。\n\
  \n相比之下，在大多数传统语言中，函数不是值。那些拥有函数值的语言通常将它们降级为二等公民。例如，`C` 和 `C++` 的函数指针与这些语言中的非函数值没有相同的地位：函数指针只能引用全局函数，它们不允许你定义引用环境中某些值的等值嵌套函数。它们也不允许你定义未命名的函数字面量。\n\
  \n\n\n\n\n函数编程的第二个核心思想是程序的操作应该将输入值映射到输出值，而不是在原地修改数据。为了理解区别，请考虑 Ruby 和 Java 中字符串的实现。在\
  \ Ruby 中，字符串是一个字符数组。字符串中的字符可以被单独修改。例如，你可以在同一个字符串对象内部将字符串中的分号字符更改为句号。而在 Java 和 Scala\
  \ 中，字符串是数学意义上的字符序列。使用像 `s.replace(';', '.')` 这样的表达式替换字符串中的字符会产生一个新的字符串对象，它与 `s`\
  \ 不同。这种说点的另一种方式是：字符串在 Java 中是不可变的，而在 Ruby 中是可变的。因此，单从字符串来看，Java 是一门函数式语言，而 Ruby\
  \ 不是。不可变数据结构是函数式编程的基石之一。Scala 库在 Java API 之上定义了更多不可变数据类型。例如， Scala 拥有不可变列表、元组、映射和集合。\n\
  \n对函数编程第二个思想的另一种表述是：方法不应该有任何副作用。它们应该只通过接收参数和返回结果与其环境进行通信。例如，Java 中 `String` 类中的\
  \ `replace` 方法就符合这一描述。它接收一个字符串和两个字符，并返回一个新的字符串，其中所有出现的一个字符都被替换为另一个字符。调用 `replace`\
  \ 没有其他影响。像 `replace` 这样的方法被称为引用透明的，这意味着对于任何给定的输入，方法调用可以用其结果来替换，而不影响程序的语义。\n\n函数式语言鼓励使用不可变数据结构和引用透明的方法。某些函数式语言甚至要求这样做。Scala\
  \ 则给了你选择权。当你想要时，可以编写命令式的代码，这就是使用可变数据和副作用进行编程的方式。但由于存在良好的函数式替代方案，Scala 通常能让你在需要时轻而地避开命令式结构。\n\
  \n### 1.3 为什么选择 Scala？\n\nScala 适合你吗？你必须亲自观察并决定。我们发现，除了扩展性之外，其实有很多喜欢 Scala 编程的理由。本节将讨论最重要的四个方面：兼容性、简洁性、高级抽象和高级静态类型系统。\n\
  \n#### Scala 具有兼容性\n\nScala 并不要求你在从 Java 语言迈进时必须跳出 Java 平台。它允许你为现有代码增加价值——基于你已有的内容进行构建——因为它设计之初就是为了与\
  \ Java 无缝互操作。[9]](#a-scalable-language.html_footnotemain1-9) Scala 程序编译为 JVM 字节码。它们的运行时通常与\
  \ Java 程序相当。Scala 代码可以调用 Java 方法、访问 Java 字段、继承 Java 类并实现 Java 接口。这些都不需要特殊的语法、显式的接口描述或胶水代码。事实上，几乎所有的\
  \ Scala 代码都大量使用了 Java 库，而且程序员往往并没有意识到这一点。\n\n完全互操作的另一个方面是 Scala 大量重用了 Java 类型。Scala\
  \ 的 `Ints` 表示为类型为 `int` 的 Java 原始整数，`Floats` 表示为 `floats`，`Booleans` 表示为 `booleans`，以此此类推。Scala\
  \ 数组映射到 Java 数组。Scala 还重用了许多 Java 标准库类型。例如，Scala 中字符串字面量 `\"abc\"` 的类型是 `java.lang.String`，而抛出的异常必须是\
  \ `java.lang.Throwable` 的子类。\n\nScala 不仅重用了 Java 的类型，还对它们进行了“装扮”使其变得更好用。例如，Scala\
  \ 的字符串支持 `toInt` 或 `toFloat` 等方法，这些方法可以将字符串转换为整数或浮点数。因此你可以写 `str.toInt` 而不是 `Integer.parseInt(str)`。如何在不破坏互操作性的情况下实现这一点呢？Java\
  \ 的 `String` 类确实没有 `toInt` 方法！事实上，Scala 有一个非常通用的解决方案来解决这种高级库设计与互操作性之间的紧张。Scala 允许你定义隐式转换，当类型通常情况下不匹配或当选择了不存在的成员时，这些转换总会被应用。在上面的例子中，当字符串上寻找\
  \ `toInt` 方法时，Scala 编译器发现 `String` 类中没有这样的成员，但它会找到一个隐式转换，可以将 Java `String` 转换为 Scala\
  \ 类 `StringOps` 的实例，而该类确实定义了该成员。然后该转换将在执行 `toInt` 操作之前隐式地应用。\n\nScala 代码也可以从 Java\
  \ 代码调用。这有时会微妙一些，因为 Scala 是比 Java 更丰富的语言，所以 Scala 的一些高级特性在映射到 Java 之前需要进行编码。第 31\
  \ 章 解释了细节。\n\n#### Scala 是简洁的\n\nScala 程序倾向于简短。Scala 程序员报告称，与 Java 相比行数减少了多达十倍。这些可能是极端情况。更保守的估计是，一个典型的\
  \ Scala 程序行数应该是用 Java 编写的相同程序行数的一半。代码行少不仅意味着打字更少，还意味着阅读和理解程序的努力减少，缺陷的可能性也减少。有几个因素导致了代码行数的减少。\n\
  \n首先，Scala 的语法避免了一些增加 Java 程序负担的样板代码。例如，分号在 Scala 中是可选的，通常会被省略。Scala 的语法在其他几个领域也不那么混乱。例如，比较在\
  \ Java 和 Scala 中编写类和构造函数的方式。\n\n```\n // 这是 Java 代码\nclass MyClass {\n\n  private\
  \ int index;\n  private String name;\n\n  public MyClass(int index, String name)\
  \ {\n    this.index = index;\n    this.name = name;\n  }\n}\n```\n\n在 Scala 中，你可能会这样写：\n\
  \n```\nclass MyClass(index: Int, name: String)\n```\n\n给定这段代码，Scala 编译器将生成一个具有两个私有实例变量（名为\
  \ `index` 的 `Int` 和名为 `name` 的 `String`）以及一个接收这些变量初始值的构造函数的类。该构造函数的代码将使用传入的参数初始化实例变量。简而言之，你获得了与更冗长的\
  \ Java 版本相同的功能。[10]](#a-scalable-language.html_footnotemain1-10) Scala 类编写得更快、更容易阅读，最重要的是比\
  \ Java 类不易出错。\n\nScala 的类型推断是导致其简洁性的另一个因素。重复的类型信息可以省略，因此程序变得不那么杂乱且易读。\n\n但代码紧凑最重要的关键可能是你不需要写的代码，因为这些工作已经在库中为你完成了。Scala\
  \ 提供了许多工具来定义强大的库，让你捕获并提取常见行为。例如，库类的不同方面可以分离到特征（traits）中，然后以灵活的方式混合在一起。或者，库方法可以用操作进行参数化，这让你能够定义出实际上是你自己的控制结构的构造。这些构造共同允许定义出既高级又易于使用的库。\n\
  \n#### Scala 是高级的\n\n\n\n\n\n程序员一直在与复杂性斗争。为了高效地进行编程，你必须理解你正在工作的代码。过度复杂的代码曾导致许多软件项目的失败。遗憾的是，重要的软件通常具有复杂的需求。这种复杂性是避免的；相反，必须对其进行管理。\n\
  \nScala 通过让你在设计和使用的接口中提高抽象层级来帮助你管理复杂性。例如，假设你有一个 `String` 变量 `name`，你想找出这个 `String`\
  \ 是否包含大写字母。在 Java 8 之前，你可能会写一个像这样的循环：\n\n```\nboolean nameHasUpperCase = false;\
  \  // this is Java\n  for (int i = 0; i < name.length(); ++i) {\n    if (Character.isUpperCase(name.charAt(i)))\
  \ {\n        nameHasUpperCase = true;\n        break;\n    }\n  }\n```\n\n而在 Scala\
  \ 中，你可以这样写：\n\n```\nval nameHasUpperCase = name.exists(_.isUpper)\n```\n\nJava 代码将字符串视为低级实体，在循环中逐个字符地遍历。Scala\
  \ 代码则将相同的字符串视为高层的字符序列，可以使用 `predicates` 进行查询。显然，Scala 代码比 Java 代码短得多，而且对于训练过的眼睛来说，比\
  \ Java 代码更容易理解。因此，Scala 代码对总复杂性预算的影响较小。它也让你出错的机会更少。\n\n谓词 `_.isUpper` 是 Scala 中函数字面量的示例。它描述了一个接受一个字符参数（由下划线字符表示）并测试该字符是否为大写字母的函数。\n\
  \nJava 8 引入了对 lambda 和流的支持，这允许你在 Java 中执行类似的操作。它看起来可能是这样的：\n\n```\nboolean nameHasUpperCase\
  \ =   // This is Java 8\n    name.chars().anyMatch(\n        (int ch) -> Character.isUpperCase((char)\
  \ ch)\n    );\n```\n\n尽管比早期的 Java 版本有了巨大改进，但 Java 8 代码仍然比等效的 Scala 代码冗长。Java 代码额外的“沉重感”以及\
  \ Java 悠久的循环传统，可能会鼓励许多需要如 `exists` 等新方法的 Java 程序员直接编写循环，并忍受代码中增加的复杂性。\n\n另一方面，Scala\
  \ 中的函数字面量非常轻量，因此它们被频繁使用。随着你对 Scala 的深入了解，你会发现越来越多的机会来定义和使用你自己的控制抽象。你会发现这有助于避免代码重复，从而使你的程序更短、更清晰。\n\
  \nScala 的函数式编程风格为编程提供了高层推理原理。核心思想是函数是引用透明的（referentially transparent）——一个函数应用仅以其结果为特征。因此，你可以自由地将函数应用替换为函数的右侧（即其函数体，位于等号后面的部分），而不必担心任何隐藏的副作用。这一原则提供了许多有用的律，你可以利用它们来更好地理解或重构你的代码。例如，再次考虑上述的\
  \ `exists` 方法。该方法应该满足以下律：对于每一个序列 `s` 和每一对谓词 `p` 和 `q`，应该始终满足：\n\n```\ns.exists(p)\
  \ || s.exists(q) == s.exists(x => p(x) || q(x))\n```\n\n也就是说，使用两个谓词 `p` 和 `q` 查询同一个序列并对结果进行逻辑或操作，与使用一个同时测试\
  \ `p` 或 `q` 的单个谓词进行查询是等价的。这样的律对于编写和重构程序显然是有用的。然而，如果 `exists` 有副作用，那么通常假设这种律是不正确的，因为左侧对每个序列元素执行了两次\
  \ `exists`，而右侧对每个元素只执行一次。所以，这是一个纯函数代码导致更多有助于理解和重构代码的有用律的示例。\n\n函数式编程风格还消除了命令式编程中遇到的别名（aliasing）问题。当多个变量引用同一个对象时，就会发生别名。这产生了一些棘手的问题和复杂性。例如，更改字段\
  \ `r.x` 也会影响 `s.x` 吗？如果 `r` 和 `s` 指向同一个对象，就会影响。在实践中，追踪此类别名通常非常困难。相反，不可变数据可以自由地共享，因为副本与共享引用是无法区分的。这种优势在编写并发代码时尤为关键。（这就是为什么\
  \ Java 有不可变字符串。）\n\n### Scala 是静态类型的\n\n静态类型系统根据它们所持有和计算的值的类型对变量和表达式进行分类。Scala 作为一种具有非常先进的静态类型系统的语言脱颖而出。从一个类似于\
  \ Java 的嵌套类系统开始，它允许使用泛型对类型进行参数化，使用交集组合类型，并使用抽象类型隐藏类型的细节。这些为构建和组合你自己的类型提供了坚实的基础，使你能够设计出在用法上既安全又灵活的接口。\n\
  \n如果你喜欢动态语言，如 Perl、Python、Ruby 或 Groovy，你可能会觉得 Scala 的静态类型系统被列为它的优点之一有一点奇怪。毕竟，静态类型系统的缺失被某些人认为是动态语言的一个主要优势。反对静态类型的最常见论点是，它们让程序变得过于冗长，阻止了程序员按照自己的意愿表达自己，并使得软件系统某些动态修改的模式变得无法实现。然而，这些论点通常并不是与静态类型这一概念本身相背，而是针对特定的类型系统，这些这些类型系统被认为过于冗长或缺乏活性。例如，Smalltalk\
  \ 语言的发明者 Alan Kay 曾评论道：“我不反对类型，但我不知道有任何一种不让人完全痛苦的类型系统，所以我仍然喜欢动态类型。”\n\n**可验证的属性。**\
  \ 静态类型系统可以证明某些运行时错误的不存在。例如，它们可以证明诸如下属性：布尔值永远不会加上整数；私有变量不会从类外部访问；函数调用的参数数量是正确的；只有字符串会被添加到字符串集合中。\n\
  \n\n\n\n\n如今的静态类型系统无法检测其他类型的错误。例如，它们通常不会检测不终止函数、数组越界或除以零错误。它们还无法检测你的程序是否符合其规范（假设确实有规范的话！）。因此，静态类型系统被一些人认为没有太大用。这种论点认为，既然这类类型系统只能检测简单的错误，而单元测试提供了更广泛的覆盖范围，为什么还要费心使用静态类型呢？我们认为这些论点偏离了重点。虽然静态类型系统确实不能\
  \ `replace` 单元测试，但它可以通过处理某些本需要测试的属性来减少所需的单元测试数量。同样，单元测试也无法取代静态类型。毕竟，正如埃德格·迪杰斯特拉（Edsger\
  \ Dijkstra）所说，测试只能证明错误的存在，而永远无法证明错误的不存在[[15]](#a-scalable-language.html_footnotemain1-15)\
  \ 。因此，静态类型所提供的保证可能是简单的，但它们是真实的保证，是任何数量测试都无法提供的形式。\n\n#### 安全重构。\n静态类型系统提供了一个安全网，让你能够以极高的信心对代码库进行更改。例如，考虑一个为方法添加额外参数的重构。在静态类型语言中，你可以进行此更改，重新编译系统，并只需修复所有导致类型错误的行。一旦你完成了这些操作，你就可以确定已经找到了所有需要更改的地方。许多其他简单的重构也是如此的，例如更改方法名或将方法从一个类移动到另一个类。在所有情况下，静态类型检查都会提供足够的保证，确保新系统的工作方式与旧系统一致。\n\
  \n#### 文档。\n静态类型是程序文档，由编译器检查其正确性。与普通注释不同，类型注解永远不会过时（至少如果包含它的源文件最近通过了编译的话）。此外，编译器和集成开发环境（IDEs）可以利用类型注解来提供更好的上下文帮助。例如，IDE\
  \ 可以通过确定所选定表达式的静态类型并查找该类型的所有成员，来显示选定内容的所有可用成员。\n\n尽管静态类型通常对程序文档很有用，但当它们弄乱程序时，有时也会令人烦恼。通常，有用的文档是程序读者无法轻易自己推导出的内容。在如下的方法定义中：\n\
  \n```scala\n def f(x: String) = ...\n```\n\n知道 `f` 的参数应该是一个 `String` 是很有用的。另一方面，在示例示例两个注解中至少有一个令人烦恼：\n\
  \n```scala\n val x: HashMap[Int, String] = new HashMap[Int, String]()\n```\n\n显然，只需说一次\
  \ `x` 是一个以 `Int` 为键、`String` 为值的 `HashMap` 就足够了；不需要重复两次相同的描述。\n\nScala 有一套非常复杂的类型推断系统，让你省略几乎所有通常认为烦恼的类型信息。在上一个示例中，以下两种不那么烦恼的方案同样有效：\n\
  \n```scala\n val x = new HashMap[Int, String]()\n val x: Map[Int, String] = new\
  \ HashMap()\n```\n\nScala 的类型推断可以进行得非常远。事实上，用户代码完全没有显式类型并不罕见。因此，Scala 程序看起来往往有点像用动态类型脚本语言编写的程序。这对于客户端应用程序代码尤为如此，这些代码将预写的库组件粘合在一起。对于库组件本身，这种说法就不那么成立，因为这些组件通常采用相当复杂的类型来允许灵活的用法模式。这是自然所然的。毕竟，构成可用组件接口的成员的类型签名应该显式给出，因为它们构成了组件与其客户端之间合同的重要组成部分。\n\
  \n### 1.4 Scala 的根源\n\nScala 的设计受到了许多编程语言和编程语言研究思想的影响。事实上，Scala 只有少数特征是真正新新的；大多数已经以某种形式应用在其他语言中。Scala\
  \ 的创新主要源于它的构造是如何组合在一起的。在本节中，我们列出了对 Scala 设计的主要影响。这个列表不是详尽的——因为编程语言设计中的明妙点子太多了，无法在这里一一列举。\n\
  \n在表层上，Scala 采纳了 `Java` 和 `C#` 的大部分语法，而这两个者反过来从 `C` 和 `C++` 借用了大部分语法约定。表达式、语句和块大部分与\
  \ `Java` 相同，类、包和导入的语法也是如此[[16]](#a-scalable-language.html_footnotemain1-16) 。除了语法之外，Scala\
  \ 还采纳了 `Java` 的其他元素，如其基本类型、类库和执行模型。\n\nScala 也非常得益于其他语言。它的统一对象模型由 `Smalltalk` 开创，随后被\
  \ `Ruby` 采纳。它的通用嵌套思想（`Scala` 中的几乎每个构造都可以嵌套在任何其他构造内部）也出现在 `Algol`、`Simula`，以及最近的\
  \ `Beta` 和 `gbeta` 中。它用于方法调用和字段选择的统一访问原则来自 `Eiffel`。它对函数式编程的方法在精神上与 `ML` 系列语言非常相似，该系列包括\
  \ `SML`、`OCaml` 和 `F#`。`Scala` 标准库中的许多高阶函数也出现在 `ML` 或 `Haskell` 中。`Scala` 的隐式参数灵感来自\
  \ `Haskell` 的类型类；它们在更经典的面向对象环境中实现了类似的结果。`Scala` 主要基于 Actor 的并发库 `Akka` 深受 `Erlang`\
  \ 的启发。\n\nScala 不是第一个强调可扩展性和扩展性的语言。跨越不同领域的可扩展语言的历史根源是彼特·兰丁（Peter Landin）1966 年的论文《The\
  \ Next 700 Programming Languages》[[17]](#a-scalable-language.html_footnotemain1-17)\
  \ （该论文中描述的语言 `Iswim` 与 `Lisp` 并列为先驱函数式语言之一。）将后缀运算符视为函数的特定想法可以追溯到 `Iswim` 和 `Smalltalk`。另一个重要的想法是允许将函数字面量（或块）作为参数，从而库能够定义控制结构。这再次回到\
  \ `Iswim` 和 `Smalltalk`。`Smalltalk` 和 `Lisp` 都具有灵活的语法，广泛应用于构建领域特定语言。`C++` 是另一种可以通过运算符重载和模板系统进行适配和扩展的可扩展语言；与\
  \ `Scala` 相比，它是构建在更底层、更面向系统的内核之上。`Scala` 也不是第一个集成函数式和面向对象编程的语言，尽管它可能在这方面走得最远。其他将函数式元素集成到面向对象编程中的语言包括\
  \ `Ruby`、`Smalltalk` 和 `Python`。在 `Java` 平台上，`Pizza`、`Nice`、`Multi-Java` 以及 `Java\
  \ 8` 本身都扩展了函数核心。以函数式为主的语言获得了对象系统；例如 `OCaml`、`F#` 和 `PLT-Scheme`。\n\n`Scala` 也为编程语言领域贡献了一些创新。例如，它的抽象类型为泛型提供了一种更面向对象的替代方案，它的特征（traits）允许灵活的组件组装，而它的提取器（extractors）为模式匹配提供了与表示无关的方法。这些创新在近年编程语言会议上发表过论文[[18]](#a-scalable-language.html_footnotemain1-18)\
  \ 。\n\n### 1.5 结论\n\n\n\n\n在本章中，我们带你初步了解了 Scala 是什么，以及它可能如何帮助你的编程。需要明确的是，Scala 并不是一种能够神奇地提高你生产力的“灵丹妙药”。要更上一层，你需要艺术地运用\
  \ Scala，这需要一些学习和实践。如果你是从 Java 迁移到 Scala 的，学习 Scala 最具挑战性的方面可能涉及 Scala 的类型系统（比 Java\
  \ 更丰富）以及它对函数式编程的支持。本书的目标是引导你稳步走上 Scala 的学习曲线，一步步来。我们认为你会发现这是一个非常有回报的智力体验，它将扩展你的视野，并让你对程序设计有不同的思考。希望你也能从用\
  \ Scala 编程中获得快乐和灵感。\n\n在下一章中，我们将开始学习编写一些 Scala 代码。\n\n***\n\n#### 第一章脚注：\n\n[1]\
