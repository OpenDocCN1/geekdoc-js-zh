  \ Java 的主要区别在于类型注解的语法：在 Scala 中是 `variable: Type`，而不是 Java 中的 `Type variable`。Scala\
  \ 的后置类型语法类似于 Pascal、Modula-2 或 Eiffel。这种差异的主要原因与类型推断有关，推断通常允许你省略变量的类型或方法的返回类型。使用\
  \ `variable: Type` 语法很容易——只需省略冒号和类型即可。但在 C 风格的 `Type variable` 语法中，你不能简单地省略类型；因为将不再有标记来开始定义。你需要一些标记。\n\
