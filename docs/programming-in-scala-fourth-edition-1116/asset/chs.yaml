  \ |  |\n| `it.next()` | 返回迭代器中的下一个元素并跳过该元素。 |\n| `it.hasNext` | 如果可以返回另一个元素，则返回\
  \ true。 |\n| 变体: |  |\n| `it.buffered` | 一个返回其所有元素的缓冲迭代器。 |\n| `it grouped size`\
  \ | 一个按固定大小序列“块”产生其返回元素的迭代器。 |\n| `xs sliding size` | 一个按代表滑动固定大小窗口的序列产生其返回元素的迭代器。\
  \ |\n| 复制: |  |\n| `it.copyToArray(arr, s, l)` | 将其返回的最多 `l` 个元素复制到从索引 `s` 开始的数组\
  \ `arr` 中。最后两个参数是可选的。 |\n| 重复: |  |\n| `it.duplicate` | 一对迭代器，每个迭代器独立地返回其所有元素。 |\n\
  | 添加: |  |\n| `it ++ jt` | 一个返回迭代器 `it` 的所有元素，紧接着返回迭代器 `jt` 的所有元素的迭代器。 |\n| `it.padTo(len,\
  \ x)` | 迭代器，返回其所有元素，后跟 `x` 的副本，直到总共返回 `len` 个元素。 |\n| 映射: |  |\n| `it map f` | 通过将函数\
  \ `f` 应用于其返回的每个元素而得到的迭代器。 |\n| `it flatMap f` | 通过将迭代器函数 `f` 应用于其内部每个元素并追加结果得到的迭代器。\
  \ |\n| `it collect f` | 通过将偏函数 `f` 应用于其内部已定义的每个元素并收集结果得到的迭代器。 |\n| 转换: |  |\n| `it.toArray`\
  \ | 将其返回的元素收集到一个数组中。 |\n| `it.toList` | 将其返回的元素收集到一个列表中。 |\n| `it.toIterable` |\
  \ 将其返回的元素收集到一个可迭代对象中。 |\n| `it.toSeq` | 将其返回的元素收集到一个序列中。 |\n| `it.toIndexedSeq`\
  \ | 将其返回的元素收集到一个索引序列中。 |\n| `it.toSet` | 将其返回的元素收集到一个集合中。 |\n| `it.toMap` | 将其返回的键值对收集到一个映射中。\
  \ |\n| `it to SortedSet` | 以集合工厂作为参数的通用转换操作。 |\n| 大小信息: |  |\n| `it.isEmpty` | 测试迭代器是否为空（`hasNext`\
  \ 的反向）。 |\n| `it.nonEmpty` | 测试集合是否包含元素（`hasNext` 的别名）。 |\n| `it.size` | 其返回的元素数量。注意：在此次操作后，它将处于末尾！\
  \ |\n| `it.length` | 与 `it.size` 相同。 |\n| `it.knownSize` | 如果在不修改迭代器状态的情况下已知，则返回元素数量，否则返回\
  \ -1。 |\n| 元素检索索引搜索: |  |\n| `it find p` | 包含其返回的第一个满足 `p` 的元素的 Option，如果没有符合条件的元素则为\
  \ None。注意：迭代器会移动到该元素之后，或者如果没有找到，则移动到末尾。 |\n| `it indexOf x` | 其返回的第一个等于 `x` 的元素的索引。。注意：迭代器会跳过该元素的位置。\
  \ |\n| `it indexWhere p` | 其返回的第一个满足 `p` 的元素的索引。注意：迭代器会跳过该元素的位置。 |\n| 子迭代器: |  |\n\
  | `it take n` | 返回其前 `n` 个元素的迭代器。注意：它将移动到第 `n` 个元素之后的位置，或者如果包含元素少于 `n` 个，则移动到末尾。\
  \ |\n| `it drop n` | 从其第 (`n + 1`) 个元素开始的迭代器。注意：它将移动到相同的位置。 |\n| `it.slice(m, n)`\
  \ | 返回其返回元素切片的迭代器，从第 `m` 个元素开始，在第 `n` 个元素之前结束。 |\n| `it takeWhile p` | 只要条件 `p`\
  \ 为真，就返回其内部元素的迭代器。 |\n| `it dropWhile p` | 只要条件 `p` 为真，就跳过其内部元素并返回剩余部分的迭代器。 |\n\
  | `it filter p` | 返回其所有满足条件 `p` 的元素的迭代器。 |\n| `it withFilter p` | 与 `it filter p`\
  \ 相同。为了让迭代器可以在 for 表达式中使用。 | |\n| `it filterNot p` | 返回其所有不满足条件 `p` 的元素的迭代器。 |\n\
  | `it.distinct` | 返回其内部无重复元素的迭代器。 |\n| 划分: |  |\n| `it partition p` | 将其分为两个迭代器对；一个返回其所有满足谓词\
  \ `p` 的元素，另一个返回其所有不满足的元素。 |\n| 元素条件: |  |\n| `it forall p` | 一个布尔值，表示谓词 `p` 是否适用于其返回的所有元素。\
  \ |\n| `it exists p` | 一个布尔值，表示谓词 `p` 是否对其内部某些元素有效。 |\n| `it count p` | 其内部满足谓词\
  \ `p` 的元素数量。 |\n| 折叠 (Folds): |  |\n| `it.foldLeft(z)(op)` | 从左到右在其返回的连续元素之间应用二元操作\
  \ `op`。 |\n| `it.foldRight(z)(op)` | 从右到左在其返回的连续元素之间应用二元操作 `op`。 |\n| `it reduceLeft\
  \ op` | 从左到右在其非空迭代器返回的连续元素之间应用二元操作 `op`。 |\n| `it reduceRight op` | 从右到左在其非空迭代器返回的连续元素之间应用二元操作\
  \ `op`。 |\n| 特殊折叠: |  |\n| `it.sum` | 其返回的数值元素元素的和。 |\n| `it.product` | 其返回的数值元素元素的乘积。\
  \ |\n| `it.min` | 其返回的有序数值元素的最小值。 |\n| `it.max` | 其返回的有序数值元素的最大值。 |\n| 拉链 (Zippers):\
  \ |  |\n| `it zip jt` | 返回迭代器 `it` 和 `jt` 对应元素的迭代器。 |\n| `it.zipAll(jt, x, y)` |\
  \ 返回迭代器 `it` 和 `jt` 对应元素的迭代器，较短的迭代器通过追加元素 `x` 或 `y` 扩展以匹配较长的迭代器。 |\n| `it.zipWithIndex`\
  \ | 返回其返回元素与其索引成对的迭代器。 |\n| 更新: |  |\n| `it.patch(i, jt, r)` | 通过替换从 `i` 开始的 `r`\
  \ 个元素为补丁迭代器 `jt` 得到的迭代器。 |\n| 比较: |  |\n| `it.sameElements jt` | 测试迭代器 `it` 和 `jt`\
  \ 是否按顺序相同的元素。注意：在此操作后应丢弃 `it` 和 `jt`。 |\n| 字符串: |  |\n| `it.addString(b, start,\
  \ sep, end)` | 向 StringBuilder `b` 添加字符串，显示其返回的所有元素在分隔符 `sep` 之间，由字符串 `start` 和\
  \ `end` 包围。`start`、`sep` 和 `end` 均为可选。 |\n| `it.mkString(start, sep, end)` | 将迭代器转换为字符串，显示其返回的所有元素在分隔符\
  \ `sep` 之间，由字符串 `start` 和 `end` 包围。`start`、`sep` 和 `end` 均为可选。 |\n\n#### 缓冲迭代器\n\
  \n\n\n\n\n有时，你可能需要一个可以“向前查看”的迭代器，以便你可以在不跳过该元素的情况下检查将返回的元素。例如，考虑从返回字符串序列的迭代器中跳过开头的空字符串的任务。你可能想写出类似下面的方法：\n\
  \n```\n // 这将不起作用\n  def skipEmptyWordsNOT(it: Iterator[String]) = {\n  while (it.next().isEmpty)\
  \ {}\n  }\n```\n\n但仔细观察这段代码，很明显这是错误的：代码确实会跳过开头的空字符串，但它也会导致迭代器通过第一个非空字符串！\n\n问题的解决方案是使用缓冲迭代器（buffered\
  \ iterator），它是 trait `BufferedIterator` 的一个实例。`BufferedIterator` 是 `Iterator` 的一个子\
  \ trait，它提供了一个额外的方法 `head`。在缓冲迭代器上调用 `head` 会返回它的第一个元素，但不会移动迭代器。使用缓冲迭代器，跳过空单词可以这样写：\n\
  \n```\n def skipEmptyWords(it: BufferedIterator[String]) =\n  while (it.head.isEmpty)\
  \ { it.next() }\n```\n\n每个迭代器都可以通过调用其 `buffered` 方法转换为缓冲迭代器。这里有一个示例：\n\n```\nscala>\
  \ val it = Iterator(1, 2, 3, 4)\n  it: Iterator[Int] = <iterator>\n\n  scala> val\
  \ bit = it.buffered\n  bit: java.lang.Object with scala.collection.\n  BufferedIterator[Int]\
  \ = <iterator>\n\n  scala> bit.head\n  res10: Int = 1\n\n  scala> bit.next()\n \
  \ res11: Int = 1\n\n  scala> bit.next()\n  res11: Int = 2\n```\n\n注意，在缓冲迭代器 `bit`\
  \ 上调用 `head` 并没有移动它。因此，随后的调用 `bit.next()` 再次返回与 `bit.head` 相同的值。\n\n## 24.15 从头创建集合\n\
  \n你已经见过过类似 `List(1, 2, 3)` 的语法，它创建一个包含三个整数的列表，以及 `Map('A' -> 1, 'C' -> 2)`，它创建一个包含两个键绑定的映射。这实际上是\
  \ Scala 集合的一个通用特性。你可以取任何集合名称，并在其后跟一个括号内的元素列表。结果将是一个包含给定元素的新集合。这里是更多示例：\n\n```\n\
  Iterable()               // 一个空集合\n  List()                   // 空列表\n  List(1.0,\
  \ 2.0)           // 包含元素 1.0, 2.0 的列表\n  Vector(1.0, 2.0)         // 包含元素 1.0, 2.0\
  \ 的向量\n  Iterator(1, 2, 3)        // 返回三个整数的迭代器。\n  Set(dog, cat, bird)      //\
  \ 包含三种动物的集合\n  HashSet(dog, cat, bird)  // 相同动物的哈希集合\n  Map('a' -> 7, 'b' -> 0)\
  \   // 从字符到整数的映射\n```\n\n在“底层”，上述每一行代码都是对某个对象的 `apply` 方法的调用。例如，上面的第三行展开为：\n\n```\n\
  List.apply(1.0, 2.0)\n```\n\n所以这是对 `List` 类伴侣对象（companion object）的 `apply` 方法的调用。该方法接收任意数量的参数并根据它们构造列表。Scala\
  \ 库中的每个集合类都有一个具有此类 `apply` 方法的伴侣对象。无论集合类表示的是具体的实现（如 `List`、`LazyList` 或 `Vector`），还是像\
  \ `Seq`、`Set` 或 `Iterable` 这样的 trait 并不重要。在后一种，调用 `apply` 将产生该 trait 的某些默认实现。这里是一些示例：\n\
  \n```\nscala> List(1, 2, 3)\n  res17: List[Int] = List(1, 2, 3)\n```\n\n```\nscala>\
  \ Iterable(1, 2, 3)\n  res18: Iterable[Int] = List(1, 2, 3)\n\n  scala> mutable.Iterable(1,\
  \ 2, 3)\n  res19: scala.collection.mutable.Iterable[Int] =\n  ArrayBuffer(1, 2,\
  \ 3)\n```\n\n除了 `apply` 之外，每个集合伴侣对象还定义了一个成员 `empty`，它返回一个空集合。因此，你可以用 `List.empty`\
  \ 代替 `List()`，用 `Map.empty` 代替 `Map()` 等。\n\n`Seq` 和 `Set` trait 的后代在它们的伴侣对象中也提供了其他工厂操作。这些操作总结在\
  \ 表 24.15 中。简而言之有：\n\n* `concat`，将任意数量的集合连接在一起，\n* `fill` 和 `tabulate`，根据某些表达式或制表函数初始化给定维度的单维或多维集合，\n\
  * `range`，生成具有某些常数步长的整数集合，\n* `iterate` 和 `unfold`，生成通过对起始元素或状态重复应用函数而产生的集合。\n\n\
  ### Seqs 和 Sets 的工厂方法\n\n| 是什么 | 作用 |\n| --- | --- |\n| `C.empty` | 空集合 |\n| `C(x,\
  \ y, z)` | 由元素 `x`、`y` 和 `z` 组成的集合 |\n| `C.concat(xs, ys)` | 由 `xs` 和 `ys` 组成的集合\
  \ |\n| `C.fill(n, e)` | 长度为 `n` 且元素均为 `e` 的集合 |\n| `C.fill(n, f)` | 长度为 `n` 且元素由函数\
  \ `f` 计算的集合 |\n| `C.tabulate(n, f)` | 长度为 `n` 且由 `f` 计算的集合 |\n| `C.tabulate(m, n,\
  \ f)` | 维度为 `m x n` 且由 `f` 计算的集合 |\n| `C.range(start, end)` | 从 `start` 到 `end`\
  \ 的整数集合（不含 `end`） |\n| `C.range(start, end, step)` | 从 `start` 到 `end` 且步长为 `step`\
  \ 的整数集合 |\n| `C.iterate(x, n)(f)` | 长度为 `n` 且通过 `f` 生成的集合 |\n| `C.unfold(init)(f)`\
  \ | 使用 `f` 来计算下一个元素和状态的集合 |\n\n## 24.16 Java 和 Scala 集合之间的转换\n\n和 Scala 一样，Java\
  \ 也有丰富的集合库。这两个库之间有许多相似之处。例如，它们都包含迭代器、可迭代对象、集合、映射和序列。但也存在重要的区别。特别是 Scala 库更强调不可变集合，并提供了更多将集合转换为新集合的操作。\n\
  \n有时你可能需要在集合之间进行转换。例如，你可能想像访问 Scala 集合一样访问现 Java 集合。或者你想将 Scala 的集合传递给期望 Java 类型的方法。这样做很容易，因为\
  \ Scala 为主要的集合类型提供了隐式转换。特别是，你可以在以下类型之间进行双向转换：\n\n```\nIterator ⇔ java.util.Iterator\n\
  Iterator ⇔ java.util.Enumeration\nIterable ⇔ java.lang.Iterable\nIterable ⇔ java.util.Collection\n\
  mutable.Buffer ⇔ java.util.List\nmutable.Set ⇔ java.util.Set\nmutable.Map ⇔ java.util.Map\n\
  ```\n\n要启用这些转换，只需导入：\n\n```\nscala> import collection.JavaConverters._\n  import\
  \ collection.JavaConverters._\n```\n\n这通过扩展方法 `asScala` 和 `asJava` 实现了 Scala 集合与其对应的\
  \ Java 集合之间的隐式转换：\n\n```\nscala> import collection.mutable._\n  import collection.mutable._\n\
  \n  scala> val jul: java.util.List[Int] = ArrayBuffer(1, 2, 3).asJava\n  jul: java.util.List[Int]\
  \ = [1, 2, 3]\n\n  scala> val buf: Seq[Int] = jul.asScala\n  buf: scala.collection.mutable.Seq[Int]\
  \ = ArrayBuffer(1, 2, 3)\n\n  scala> val m: java.util.Map[String, Int] = HashMap(\"\
  abc\" -> 1, \"hello\" -> 2).asJava\n  m: java.util.Map[String,Int] = {hello=2, abc=1}\n\
  ```\n\n\n\n\n在内部，这些转换通过设置一个“包装”对象并将所有操作转发到底层的集合对象来实现。因此，在 Java 和 Scala 之间转换时，集合不会被复制。一个有趣的特性是，如果你进行往返转换（例如从\
  \ Java 类型转换为其对应的 Scala 类型，然后再转换回同一个 Java 类型），你将得到与开始时完全相同的集合对象。\n\n还有其他常见的 Scala\
  \ 集合也可以转换为 Java 类型，但反向没有对应的转换方法。这些是：\n\n```\n Seq           ⇒   java.util.List \n\
  \  mutable.Seq  ⇒   java.util.List\n  Set           ⇒   java.util.Set \n  Map  \
  \         ⇒   java.util.Map\n```\n\n由于 Java 在其类型中不区分可变和不可变集合，因此从例如 `collection.immutable.List`\
  \ 的转换将产生一个 `java.util.List`，在该列表上尝试的所有变异操作都将抛出 `UnsupportedOperationException`。这是一个示例：\n\
  \n```\n scala> val jul: java.util.List[Int] = List(1, 2, 3)\n  jul: java.util.List[Int]\
  \ = [1, 2, 3]\n\n  scala> jul.add(7)\n  java.lang.UnsupportedOperationException\n\
  \         at java.util.AbstractList.add(AbstractList.java:131)\n```\n\n### 24.17\
  \ 结论\n\n你现在已经详细学习了如何使用 Scala 集合。Scala 集合采取的方法是为你提供强大的构建块，而不是许多临时的实用方法。将两个或三个这样的构建块组合在一起，允许你表达大量的有用计算。这种风格的库特别有效，是因为\
  \ Scala 对函数字面量具有轻量级语法，并且它提供了许多持久且不可变的集合类型。\n\n本章从使用集合库的程序员角度展示了集合。下一章将向你展示集合是如何构建的，以及你如何能够添加自己的集合类型。\n\
  \n***\n\n#### 第 24 章脚注：\n\n[1] 部分函数在第 15.7 节 中有所描述。\n\n[2] 压缩哈希数组映射前缀树在第 24.7 节\
  \ 中有所描述。\n\n[3] \"Trie\" 源于单词 \"retrieval\"，发音为 *tree* 或 *try*。\n\n[4] Steindorfer,\
  \ *et. al.*, \"Optimizing hash-array mapped tries for fast and lean immutable JVM\
  \ collections.\" [[Ste15]](#bibliography.html_steindorfer-champ)\n\n[5] 在本节以及本节其他几个示例的解释器响应中出现的\
  \ `buf.type` 是一个单例类型（singleton type）。如第 29.6 节所示，`buf.type` 意味着变量恰好持有 `buf` 所指向的对象。\n\
  \n[6] 假设位是紧密打包。\n\n[7] Scala actors 库已弃用，但这个历史示例仍然具有意义。\n\n# 第 25 章：Scala 集合的架构\n\
  \n本章详细描述了 Scala 集合框架的架构。延续第 24 章的主题，你将了解到更多关于该框架的内部工作原理。你还将学习这种架构如何帮助你用几行代码定义自己的集合，同时复用框架中绝大部分集合功能。\n\
  \n第 24 章 列举了大量的集合操作，这些操作存在于许多不同的集合实现中。为每种集合类型重新实现每个集合操作会导致大量的代码，其中大部分将是从其他地方复制的。这种代码重复随着时间的推移会导致不一致，当在集合库的某部分添加或修改操作而在其他部分没有。集合框架的主要设计目标是避免任何重复，在尽可能少的地方定义每个操作[[1]](#the-architecture-of-scala-collections.html_footnotemain25-1)。该方法是在“模板\
  \ trait”中实现大多数操作，这些 trait 可以混合到单个集合基类和实现类中。在本章中，我们将这些模板以及构成框架构建块的其他类和 trait，以及它们支持的构建原则。\n\
  \n### 25.1 提取公共操作\n\n集合库的主要设计目标是为用户提供自然类型，同时尽可能共享实现代码。特别是支持各种具体集合类型的以下方面：\n\n* 某些转换操作返回相同的具体集合类型。例如，`List[Int]`\
  \ 上的 `filter` 返回 `List[Int]`。\n* 某些转换操作返回相同的具体集合类型，但元素类型可能不同。例如，`List[Int]` 上的 `map`\
  \ 可以返回 `List[String]`。\n* 某些集合类型（如 `List[A]`）有一个类型参数，而其他（如 `Map[K, V]`）有两个。\n* 集合上的某些操作根据元素类型返回不同的具体集合。例如，`Map`\
  \ 上的 `map` 如果映射函数产生键值对，则返回另一个 `Map`，否则返回 `Iterable`。\n* 某些集合类型上的转换操作需要额外的隐式参数。例如，`SortedSet`\
  \ 上的 `map` 需要一个隐式的 `Ordering`。\n* 最后，某些集合（如 `List`）是严格的，而其他集合（如 `View`）是非严格的。\n\n\
  集合框架的模板 trait 抽象了各种集合之间的差异列表。在本节的剩余部分，你将发现如何实现这一点。\n\n之前提到的，模板 trait 的一个挑战是定义返回未知具体集合类型的转换操作。例如，考虑\
  \ `List[A]` 和 `Vector[A]` 上的 `map` 操作签名：\n\n```\n trait List[A] {\n  def mapB: List[B]\n\
  \  }\n\n trait Vector[A] {\n  def mapB: Vector[B]\n  }\n```\n\n`map` 的返回类型取决于具体的集合类型。`List`\
  \ 上的 `map` 方法返回 `List`，而在 `Vector` 上返回 `Vector`。集合框架的这一特性被称为“相同结果类型”原则：只要可能，集合上的转换操作将产生相同类型的集合。在\
  \ `map` 的情况下，模板 trait 需要抽象结果类型构造器[[2]](#the-architecture-of-scala-collections.html_footnotemain25-2)\n\
  \n`filter` 方法的要求略有不同。考虑在 `List[A]` 和 `Map[K, V]` 上的类型签名：\n\n```\n trait List[A]\
  \ {\n  def filter(p: A => Boolean): List[A]\n  }\n\n  trait Map[K, V] {\n  def filter(p:\
  \ (K, V) => Boolean): Map[K, V]\n  }\n```\n\n为了泛化 `filter` 的类型签名，模板 trait 不能仅仅抽象集合类型构造器，因为\
  \ List 有一个类型参数，而 Map 有两个。因此，在这种情况下，模板需要抽象整个集合类型。\n\n#### 抽象集合类型\n\n`IterableOps`\
  \ 模板 trait 实现了 `Iterable[A]` 集合类型可用的操作。`IterableOps` 定义如下：\n\n```\n trait IterableOps[+A,\
  \ +CC[_], +C]\n```\n\n`IterableOps` 声明了三个名为 A、CC 和 C 的类型参数。对于扩展 `IterableOps` 的\
  \ `Iterable`，`A` 定义了其元素类型，`CC` 其类型构造器，`C` 其完整类型。`filter` 和 `map` 在 `IterableOps`\
  \ 上的签名定义如下：\n\n```\n trait IterableOps[+A, +CC[_], +C] {\n  def filter(p: A => Boolean):\
  \ C\n  def mapB: CC[B]\n  }\n```\n\n\n\n集合框架中的具体类型在混入 `IterableOps` 时会传递相应的类型参数。例如，`List[A]`\
  \ 为 `A` 传递了元素类型 `A`，为 `CC` 传递了 `List`，为 `C` 传递了 `List[A]`：\n\n```\n trait List[+A]\n\
  \  extends Iterable[A]\n    with IterableOps[A, List, List[A]]\n```\n\n`SetOps`\
  \ 模板 trait 继承自 `IterableOps`，并为 `Set` 中定义但在 `Iterable` 中未定义的方法添加默认实现。以下是 `SetOps`\
  \ 的定义方式：\n\n```\n trait SetOps[A, +CC[_], +C]\n    extends IterableOps[A, CC, C]\n\
  ```\n\nTrait `Set` 混入 `SetOps`，并传递了相应的类型参数：\n\n```\n trait Set[A] extends Iterable[A]\
  \ with SetOps[A, Set, Set[A]]\n```\n\n对于 `Maps`，情况稍微复杂一些。尽管 `IterableOps` 适用于 `Lists`，但其\
  \ `map` 操作的类型签名并不适用于 `Maps`。问题在于 `Map[K, V]` 的类型构造器接受两个类型参数 `K` 和 `V`，而 `IterableOps\
  \ CC[_]` 类型参数只接受一个。因此，集合框架提供了一个 `MapOps` 模板 trait，它包含了第二个重载形式的 `map` 方法：\n\n```\n\
  \ trait MapOps[K, +V, +CC[_, _], +C]\n  extends IterableOps[(K, V), Iterable, C]\
  \ {\n\n  def mapK2, V2) => (K2, V2)): CC[K2, V2]\n}\n```\n\n由于 `MapOps` trait 继承自\
  \ `IterableOps`，因此 `IterableOps` 中定义的操作在 `MapOps` 中也可用。因此，由于传递给 `IterableOps` 的集合类型构造器是\
  \ `Iterable`，`Map[K, V]` trait 继承了两个重载的 `map` 操作形式：\n\n```\n // 继承自 MapOps\n  def\
  \ mapK2, V2) => (K2, V2)): Map[K2, V2]\n\n   // 继承自 IterableOps\n  def mapB) =>\
  \ B): Iterable[B]\n```\n\n在使用处，当调用 `map` 时，编译器会选择两个重载形式之一。如果作为 `map` 参数的函数返回一个元组（pair），则两个函数都适用。在这种情况下，根据重载解析规则，来自\
  \ `MapOps` 的版本被选中，因为它更具体（more specific），因此结果集合是一个 `Map`。如果参数函数不返回元组，则只有定义在 `IterableOps`\
  \ 中的版本是用的。在这种情况下，结果集合是一个 `Iterable`。这就是该设计如何促进“相同结果类型”原则的。\n\n另一种 `IterableOps`\
  \ 中定义的转换操作的类型签名与具体集合类型签名不匹配的情况是 `SortedSet[A]`。在这种情况下，`map` 操作的类型签名需要一个针对元素类型的隐式\
  \ `Ordering`：\n\n```\n def mapB\n      (implicit ord: Ordering[B]): SortedSet[B]\n\
  ```\n\n与 `Map` 一样，`SortedSet` 需要一个专门的模板 trait 带有转换操作的重载变体。`SortedSetOps` 模板 trait\
  \ 提供了这些。以下是 `SortedSetOps` 定义 `map` 的方式：\n\n```\n trait SortedSetOps[A, +CC[_],\
  \ +C]\n  extends SetOps[A, Set, C] {\n\n  def mapB(implicit ord: Ordering[B]): CC[B]\n\
  }\n```\n\n扩展 `SortedSetOps` 的集合类型传递相应的类型参数。例如，`SortedSet[A]` 为 `A` 传递了元素类型 `A`，为\
  \ `CC` 传递了 `SortedSet`，为 `C` 传递了 `SortedSet[A]`：\n\n```\n trait SortedSet[A] extends\n\
  \    SortedSetOps[A, SortedSet, SortedSet[A]]\n```\n\n由于 `SortedSetOps` 继承自 `SetOps`，且传递给\
  \ `SetOps` 的集合类型构造器是 `Set`，`SortedSet[A]` trait 继承了这两个重载的 `map` 操作形式：\n\n```\n //\
  \ 继承自 SortedSetOps\n  def mapB(implicit ord: Ordering[B]): SortedSet[B]\n\n   //\
  \ 继承自 IterableOps，通过 SetOps\n  def mapB: Set[B]\n```\n\n如果你调用 `map` 且存在隐式的 `Ordering[B]`，则根据重载解析规则，定义在\
  \ `SortedSetOps` 中的版本将被选中，结果将是一个 `SortedSet[B]`。否则，将使用定义在 `IterableOps` 中的版本，结果将是一个\
  \ `Set[B]`。\n\n最后，第五种需要专门模板 trait 的集合是 `SortedMap[K, V]`。这种类型的集合接受两个类型参数，并对键的类型需要隐式排序。`SortedMapOps`\
  \ 模板 trait 相应的重载方法。\n\n图 25.1 显示了主要模板 trait 和集合类型之间的继承关系。名称以 `Ops` 结尾的 trait 是模板\
  \ trait。\n\n![image images/collectionsFramework160.png](img/collectionsFramework160.png)\n\
  \n##### 图 25.1 - 集合框架的主要 trait。\n\n#### 处理严格性\n\n`IterableOps` 中定义的转换操作的类型签名与具体集合类型签名不匹配的另一种情况是\
  \ `SortedSet[A]`。在这种情况下，`map` 操作的类型签名需要一个针对元素类型的隐式 `Ordering`。与 `Map` 一样，`SortedSet`\
  \ 需要一个专门的模板 trait 带有转换操作的重载变体。`SortedSetOps` 模板 trait 提供了这些。\n\n如 25.1 所示`View`\
  \ 被定义为 `Iterable` 并提供一个 `Iterator` 方法来遍历 `View` 的元素。\n\n```\n trait View[+A]\n \
  \ extends Iterable[A]\n    with IterableOps[A, View, View[A]] {\n  def iterator:\
  \ Iterator[A]\n}\n```\n\n##### 25.1 - View 的简化定义\n\n```\n trait IterableOps[+A,\
  \ +CC[_], +C] {\n\n    def filter(pred: A => Boolean): C =\n      fromSpecific(new\
  \ View.Filter(this, pred))\n\n    def mapB: CC[B] =\n      from(new View.Map(this,\
  \ f))\n\n    protected def fromSpecific(source: IterableOnce[A]): C\n    protected\
  \ def fromE: CC[E]\n}\n```\n\n##### 25.2 - IterableOps 中 filter 和 map 的实现\n\n25.2\
  \ 显示了 `IterableOps` 中 `filter` 和 `map` 方法的实现。这种 `filter` 方法首先实例化一个 `View.Filter`，这是一个在遍历时会过滤底层集合元素的\
  \ `View`。这个 `View.Filter` 被传递给 `fromSpecific`，它会将 `View` 转换为类型 `C` 的具体集合。`map` 的实现类似，但它不是调用\
  \ `fromSpecific` 而是调用 `from`，后者接受一个元素类型 `E` 为任意的可迭代对象或迭代器作为源。\n\n`from` 和 `fromSpecific`\
  \ 的实现留给具体集合：它们可以决定以严格或非严格的方式评估元素。例如，`List` trait 实现 `from` 方法，通过急急评估源集合的元素：\n\n\
  ```\n def fromE: List[E] =\n  (new ListBuffer[E] +== source).toList\n```\n\n相比之下，`LazyList`（未显示）的\
  \ `from` 实现在 `LazyList` 实际遍历之前不会评估其源。\n\n另一个你应该知道的实现细节是，`from` 方法实际上定义在集合的伴生对象中，作为实例化集合的通用工厂方法。`IterableOps`\
  \ 模板 trait 通过 `iterableFactory` 方法将其转发，该方法将集合类与其其伴生对象连接起来：\n\n\n\n\n```\n trait\
  \ IterableOps[+A, +CC[_], +C] {\n\n  def mapB: CC[B] =\n    iterableFactory.from(new\
  \ View.Map(this, f))\n\n  def iterableFactory: IterableFactory[CC]\n  }\n\n  trait\
  \ IterableFactory[+CC[_]] {\n\n  def fromA: CC[A]\n  }\n```\n\n最后，类似于模板 traitit\
  \ 有多个变体（例如 `IterableOps`、`MapOps` 和 `SortedSetOps`），工厂 traitit 也有多个变体。例如，列表 25.3\
  \ 显示了 `MapOps` 模板 traitit 中 map 操作实现的相关代码部分。\n\n```\n trait MapOps[K, +V, +CC[_,\
  \ _], +C]\n    extends IterableOps[(K, V), Iterable, C] {\n\n    def mapK2, V2)\
  \ => (K2, V2)): CC[K2, V2] =\n      mapFactory.from(new View.Map(this, f))\n\n \
  \   def mapFactory: MapFactory[CC]\n\n    }\n\n  trait MapFactory[+CC[_, _]] {\n\
  \    def fromK, V]): CC[K, V]\n    }\n```\n\n##### 列表 25.3 - MapOps 模板 traitit 相关的\
  \ MapFactory traitit。\n\n#### 当严格评估更优或不可避免时\n\n在之前的章节中，我们解释了具体集合的严格性应该通过默认操作实现来保留。但在某些情况下，这会导致实现效率降低。例如，`partition`\
  \ 如果以惰性方式执行，则需要对底层集合进行两次遍历。在其他情况下，例如 `groupBy`，操作必须严格执行：在不评估集合元素的情况下，根本无法实现该操作。\n\
  \n对于此类情况，集合库还提供了严格实现操作的方法。然而，它不是基于 `View`，而是基于 `Builder`。以下是 `Builder` traitit 的概要：\n\
  \n```\n package scala.collection.mutable\n\n  trait Builder[-A, +C] {\n\n  def addOne(elem:\
  \ A): this.type\n\n  def result(): C\n\n  def clear(): Unit\n  }\n```\n\n`Builders`\
  \ 在元素类型 `A` 和它们返回的集合类型 `C` 上都是泛型的。你可以通过 `b.addOne(x)`（或 `b += x`）向 builder `b` 添加元素\
  \ `x`。`result` 方法返回一个来自该 builder 的集合。在获取其结果后，builder 的状态是未定义的，但可以使用 `clear` 将其重置为新的空状态。\n\
  \n类似于 `fromSpecific` 和 `from`，模板 traitit 提供了一个名为 `newSpecificBuilder` 的方法来获取一个产生相同元素类型集合的\
  \ builder，以及另一个名为 `newBuilder` 的方法来获取一个产生相同类型但元素类型不同的集合的 builder。列表 25.4 显示了 `IterableOps`\
  \ 和 `IterableFactory` 中用于在严格和非严格模式下构建集合的相关部分。\n\n```\n trait IterableOps[+A, +CC[_],\
  \ +C] {\n\n    def iterableFactory: IterableFactory[CC]\n\n    protected def fromSpecific(source:\
  \ IterableOnce[A]): C\n\n    protected def newSpecificBuilder: Builder[A, C]\n \
  \ }\n\n  trait IterableFactory[+CC[_]] {\n\n    def fromA: CC[A]\n\n    def newBuilder[A]:\
  \ Builder[A, CC[A]]\n  }\n```\n\n##### 列表 25.4 - 构建集合实例的严格和非严格方法。\n\n注意，通常情况下，一个不需要严格的操作应该以非严格的方式实现，否则当在非严格的具体集合上使用时，它会导致意料之外的行为。尽管如此，严格模式通常更有效。这就是为什么该库提供了另一组模板\
  \ traitit，其操作实现被重写，以利用严格 builder。这些模板 traitit 的名称始终以 `StrictOptimized` 开头。如果你的自定义集合是严格集合，你应该对该集合使用此类模板\
  \ traitit。\n\n### 25.2 集成新集合\n\n如果你想集成一个新的集合类，使其能够在正确的类型上从所有预定义操作中获益，需要做什么呢？在本节中，我们将带你通过三个实现此点的示例：受限序列、RNA\
  \ 碱基序列以及用 Patricia tries 实现的前缀映射。\n\n#### 受限序列\n\n假设你想创建一个最多包含 `n` 个元素的不可变集合：如果添加的元素超过最大数量，则移除先的元素。第一个任务是为你的集合选择一个超类型：是\
  \ `Seq`、`Set`、`Map` 还是只是 `Iterable`？在这种情况下，选择 `Seq` 可能是很有力的，因为你的集合可以包含重复项，且迭代顺序由插入顺序决定。然而，`Seq`\
  \ 的某些属性并没有满足。例如，两个 `Seqs` 拼接后得到的 `Seq` 的大小应该是原始大小之和：\n\n```\n (xs ++ ys).size ==\
  \ xs.size + ys.size\n```\n\n结果，作为你新集合的基类型的唯一合理选择是 `scala.collection.immutable.Iterable`。\n\
  \n##### 受限集合，第一版本\n\n列表 25.5 展示了受限集合的第一版本。它将在稍后完善。`Capped1` 类有一个私有构造函数，参数为集合容量 `length`、`offset`（第一个元素的索引）以及一个持有元素的数组。公共构造函数仅接收集合的容量。它将\
  \ `length` 和 `offset` 设置为 0，并创建一个容量为 `length` 的未初始化数组来存放元素。\n\n```\n import scala.collection._\n\
  \n  class Capped1[A] private (val capacity: Int, val length: Int,\n      offset:\
  \ Int, elems: Array[Any])\n      extends immutable.Iterable[A] { self\n\n  def this(capacity:\
  \ Int) = this(capacity, 0, Array.ofDimAny)\n\n  def appendedB > A: Capped1[B] =\n\
  \    val newElems = Array.ofDimAny\n    Array.copy(elems, 0, newElems, 0, length)\n\
  \    val (newOffset, newLength) =\n      if (length == capacity) {\n        newElems(offset)\
  \ = elem\n        ((offset + 1) % capacity, length)\n      } else {\n        newElems(length)\
  \ = elem\n        (offset, length + 1)\n      }\n    Capped1(capacity, newLength,\
  \ newOffset, newElems)\n\n  @inline :+B > A: Capped1[B] = appended(elem)\n\n  def\
  \ apply(i: Int): A =\n    elems((i + offset) % capacity).asInstanceOf[A]\n\n  def\
  \ iterator: Iterator[A] = new AbstractIterator[A] {\n    private var current = 0\n\
  \    def hasNext = current < length\n    def next(): A = {\n      val elem = self(current)\n\
  \      current += 1\n      elem\n    }\n  }\n\n  override def className = \"Capped1\"\
  \n  }\n```\n\n##### 列表 25.5 - 受限集合，第一版本\n\n\n\n\n\n```scala\nscala> new Capped1(capacity\
  \ = 4)\n  res0: Capped1[Nothing] = Capped1()\n\n  scala> res0 :+ 1 :+ 2 :+ 3\n \
  \ res1: Capped1[Int] = Capped1(1, 2, 3)\n\n  scala> res1.length\n  res2: Int = 3\n\
  \n  scala> res1.lastOption\n  res3: Option[Int] = Some(3)\n\n  scala> res1 :+ 4\
  \ :+ 5 :+ 6\n  res4: Capped1[Int] = Capped1(3, 4, 5, 6)\n\n  scala> res4.take(3)\n\
  \  res5: collection.immutable.Iterable[Int] = List(3, 4, 5)\n```\n\n正如你在 `res4`\
  \ 中看到的，如果向 `Capped1` 添加了超过四个元素，最前面的元素会被丢弃。除了最后一个操作外，其他操作行为都符合预期：调用 `take` 后，你得到的是一个\
  \ `List` 而不是 `Capped1`。这是因为 `Capped1` 扩展了 `Iterable` 并继承了它的 `take` 方法。`Iterable`\
  \ 的 `take` 方法返回另一个 `Iterable`，它默认是基于 `List` 实现的。这就是为什么在上一次交互的最后一行你得到了一个 `List`。\n\
  \n现在你已经理解了为什么情况是这样，下一个问题应该是需要做些什么来改变它们？一种方法是在 `Capped1` 类中重写 `take` 方法，可能如下所示：\n\
  \n```scala\noverride def take(count: Int): Capped1 = ...\n```\n\n但 `drop`、`filter`\
  \ 或 `init` 呢？事实上，集合中有五十多个方法会返回另一个集合。为了保持一致性，所有这些方法都需要被重写。这看起来越来越不像一个有吸引力的方案了。幸运的是，有一种更简单的方法可以实现相同的效果，如在下一节所示。\n\
  \n### 限制容量集合，第二个版本\n\n限制容量集合类不仅需要继承 `Iterable`，还需要继承模板 trait 性 `IterableOps`。这通过\
  \ `Capped2` 实现，见列表 25.6，它扩展了 `IterableOps[A, Capped2, Capped2[A]]`。此外，它的 `iterableFactory`\
  \ 成员被重写以返回一个 `IterableFactory[Capped2]`。如前面的章节所述，`IterableOps` trait 以一种泛型的方式实现了\
  \ `Iterable` 的所有具体方法。例如，`take`、`drop`、`filter` 或 `init` 等方法的返回类型是传递给 `IterableOps`\
  \ 的第三个类型参数。因此，在 `Capped2` 类中，它是 `Capped2[A]`。同样，`map`、`flatMap` 或 `concat` 等方法的返回类型是由传递给\
  \ `IterableOps` 的第二个类型参数定义的，在 `Capped2` 类中，就是 `Capped2` 本身。\n\n```scala\nimport\
  \ scala.collection._\n\nclass Capped2[A] private (val capacity: Int, val length:\
  \ Int,\n    offset: Int, elems: Array[Any])\n    extends immutable.Iterable[A]\n\
  \    with IterableOps[A, Capped2, Capped2[A]] { self =>\n\n  def this(capacity:\
  \ Int) = // as before\n  def appendedB > A: Capped2[B] = // as before\n  @inline\
  \ def :+ B > A: Capped2[B] = // as before\n  def apply(i: Int): A = // as before\n\
  \  def iterator: Iterator[A] = // as before\n\n  override def className = \"Capped2\"\
  \n\n  override val iterableFactory: IterableFactory[Capped2] =\n    new Capped2Factory(capacity)\n\
  \n  override protected def fromSpecific(\n      coll: IterableOnce[A]): Capped2[A]\
  \ =\n      iterableFactory.from(coll)\n\n  override protected def newSpecificBuilder:\n\
  \      mutable.Builder[A, Capped2[A]] =\n      iterableFactory.newBuilder\n\n  override\
  \ def empty: Capped2[A] = iterableFactory.empty\n}\nclass Capped2Factory(capacity:\
  \ Int) extends IterableFactory[Capped2] {\n\n  def fromA: Capped2[A] =\n    (newBuilder[A]++=\
  \ source).result()\n\n  def empty[A]: Capped2[A] = new Capped2(capacity)\n\n  def\
  \ newBuilder[A]: mutable.Builder[A, Capped2[A]] =\n    new mutable.ImmutableBuilder[A,\
  \ Capped2[A]](empty) {\n      def addOne(elem: A): this = {\n        elems = elems\
  \ :+ elem\n        this\n      }\n}\n```\n\n#### 列表 25.6 - 限制容量集合，第二个版本\n\n必须重写\
  \ `fromSpecific` 和 `newSpecificBuilder` 方法，因为继承自 `Iterable` trait 的实现返回的是 `Iterable`\
  \ 而不是期望的 `Capped2`。另一个返回过于泛化类型的继承操作是 `empty`。该方法也被重写为同样返回 `Capped2[A]`。所有这些重写都转发到\
  \ `iterableFactory` 所指的集合，其值是 `Capped2Factory` 类的实例。\n\n`Capped2Factory` 为构建集合提供了方便的工厂方法。最终，这些方法会委托给\
  \ `empty` 操作（该操作构建一个空的 `Capped2` 实例）以及 `newBuilder`（该操作使用 `appended` 操作来增长 `Capped2`\
  \ 集合）。\n\n通过 `Capped2` 类的完善实现，转换操作按预期工作。此外，`Capped2Factory` 类提供了从其他集合的无缝转换：\n\n\
  ```scala\nscala> object Capped extends Capped2Factory(capacity = 4)\n  defined object\
  \ Capped\n\nscala> Capped(1, 2, 3)\n  res0: Capped2[Int] = Capped2(1, 2, 3)\n\n\
  \  scala> res0.take(2)\n  res1: Capped2[Int] = Capped2(1, 2)\n\n  scala> res0.filter(x\
  \ => x % 2 == 1)\n  res2: Capped2[Int] = Capped2(1, 3)\n\n  scala> res0.map(x =>\
  \ x * x)\n  res3: Capped2[Int] = Capped2(1, 4, 9)\n\n  scala> List(1, 2, 3, 4, 5).to(Capped)\n\
  \  res4: Capped2[Int] = Capped2(2, 3, 4, 5)\n```\n\n这种实现现在行为是正确的，但你仍然可以改进几点。由于集合是严格的（strict），你可以利用转换操作的严格实现所提供的更好性能。\n\
  \n### 限制容量集合，最终版本\n\n`Capped` 类的最终版本见列表 25.7 和 25.8。它混合了 `StrictOptimizedIterableOps`\
  \ trait，该 trait 重写了所有转换操作，允许 `Capped` 利用严格 builder。此版本还重写了一些操作以优化性能。`view` 使用索引访问，`iterator`\
  \ 委托给 `view`。`knownSize` 操作也被重写了，因为大小是已知的。\n\n```scala\nimport scala.collection._\n\
  \nfinal class Capped[A] private (val capacity: Int, val length: Int,\n    offset:\
  \ Int, elems: Array[Any])\n    extends immutable.Iterable[A]\n    with IterableOps[A,\
  \ Capped, Capped[A]]\n    with StrictOptimizedIterableOps[A, Capped, Capped[A]]\
  \ { self =>\n\n  def this(capacity: Int) = this(capacity, length = 0,\n    offset\
  \ = 0, elems = Array.ofDim(capacity))\n\n  def appendedB > A: Capped[B] = {\n  \
  \  val newElems = Array.ofDimAny\n    Array.copy(elems, 0, newElems, 0, capacity)\n\
  \    val (newOffset, newLength) =\n      if (length == capacity) {\n        newElems(offset)\
  \ = elem\n        ((offset + 1) % capacity, length)\n      } else {\n        newElems(length)\
  \ = elem\n        (offset, length + 1)\n      }\n    new CappedB\n  }\n\n  @inline\
  \ def :+ B > A: Capped[B] = appended(elem)\n\n  def apply(i: Int): A =\n    elems((i\
  \ + offset) % capacity).asInstanceOf[A]\n\n  // 续接列表 25.8...\n```\n\n#### 列表 25.7\
  \ - 限制容量集合，最终版本\n\n\n\n\n\n```scala\n // 正接自 Listing 25.7\n  def iterator: Iterator[A]\
  \ = view.iterator\n\n  override def view: IndexedSeqView[A] = new IndexedSeqView[A]\
  \ {\n    def length: Int = self.length\n    def apply(i: Int): A = self(i)\n  }\n\
  \n  override def knownSize: Int = length\n\n  override def className = \"Capped\"\
  \n\n  override val iterableFactory: IterableFactory[Capped] =\n    new CappedFactory(capacity)\n\
  \n  override protected def fromSpecific(coll: IterableOnce[A]):\n      Capped[A]\
  \ = iterableFactory.from(coll)\n\n  override protected def newSpecificBuilder:\n\
  \      mutable.Builder[A, Capped[A]] =\n      iterableFactory.newBuilder\n\n  override\
  \ def empty: Capped[A] = iterableFactory.empty\n}\n\nclass CappedFactory(capacity:\
  \ Int) extends IterableFactory[Capped] {\n\n  def fromA: Capped[A] =\n    source\
  \ match {\n      case capped: Capped[A] if capped.capacity == capacity => capped\n\
  \      case _ => (newBuilder[A] ++= source).result()\n    }\n\n  def empty[A]: Capped[A]\
  \ = new CappedA\n\n  def newBuilder[A]: mutable.Builder[A, Capped[A]] =\n    new\
  \ mutable.ImmutableBuilder[A, Capped[A]](empty) {\n      def addOne(elem: A): this.type\
  \ = {\n        elems = elems :+ elem\n        this\n      }\n    }\n}\n```\n\n###\
  \ Listing 25.8 - Capped 集合，最终版本（续接）\n\n如 `Capped` 所示，创建一个新的集合类型需要几个步骤。除了扩展相应的集合类型外，你必须混入适当的\
  \ `Ops` 模板，然后重写 `iterableFactory` 以返回一个更具体的工厂。最后，你必须实现任何抽象方法（例如 `Capped` 中的 `iterator`）。\n\
  \n#### RNA 序列\n\n另一个例子，假设你想为 RNA 链创建一个新的不可变序列类型，RNA 链是碱基 `A`（腺嘌呤）、`U`（尿嘧啶）、`G`（鸟嘌呤）和\
  \ `C`（胞嘧啶）的序列。碱基的定义可以如 Listing 25.9 所示进行设置。\n\n```scala\n abstract class Base\n\
  \  case object A extends Base\n  case object U extends Base\n  case object G extends\
  \ Base\n  case object C extends Base\n\n  object Base {\n    val fromInt: Int =>\
  \ Base = Array(A, U, G, C)\n    val toInt: Base => Int = Map(A -> 0, U -> 1, G ->\
  \ 2, C -> 3)\n  }\n```\n\n### Listing 25.9 - RNA 碱基。\n\n每个碱基都被定义为继承自通用抽象类 `Base`\
  \ 的 `case object`。`Base` 类有一个伴随对象，该对象定义了两个在碱基与整数 `0` 到 `3` 之间映射的函数。你可以在示例中看到使用集合实现这些函数的两种不同方法。`toInt`\
  \ 函数实现为从 `Base` 值到整数的 `Map`。反向函数 `fromInt` 则实现为一个数组。这利用了映射和数组都是函数的特性，因为它们都继承自 `Function1`\
  \ 特质。\n\n下一个任务是为 RNA 链定义一个类。从概念上讲，RNA 链仅仅是一个 `Seq[Base]`。然而，RNA 链可能会变得非常长，因此在紧凑表示上投入一些精力是有意义的。因为只有四种碱基，一个碱基可以用两个位来标识，因此你可以将十六个碱基作为双位值存储在整数中。因此，思路是构建\
  \ `Seq[Base]` 的专用子类，使用这种紧凑表示法。\n\n### RNA 链类，第一版本\n\n```scala\n import collection.mutable\n\
  \  import collection.immutable.{IndexedSeq, IndexedSeqOps}\n\n  final class RNA1\
  \ private (val groups: Array[Int],\n    val length: Int) extends IndexedSeq[Base]\n\
  \    with IndexedSeqOps[Base, IndexedSeq, RNA1] {\n\n    import RNA1._\n\n    def\
  \ apply(idx: Int): Base = {\n      if (idx < 0 || length <= idx)\n        throw\
  \ new IndexOutOfBoundsException\n      Base.fromInt(groups(idx / N) >> (idx % N\
  \ * S) & M)\n    }\n\n    override def className = \"RNA1\"\n    override protected\
  \ def fromSpecific(\n          source: IterableOnce[Base]): RNA1 =\n        fromSeq(source.iterator.toSeq)\n\
  \    override protected def newSpecificBuilder:\n          mutable.Builder[Base,\
  \ RNA1] =\n        iterableFactory.newBuilder[Base].mapResult(fromSeq)\n    override\
  \ def empty: RNA1 = fromSeq(Seq.empty)\n  }\n\n  object RNA1 {\n\n    // 表示一个组所需的位数\n\
  \    private val S = 2             \n    // 一个整数中可以容纳的组数\n    private val N = 32\
  \            \n    // 用于隔离 S 位的位掩码\n    private val M = (1 << S) - 1\n\n    def\
  \ fromSeq(source: IterableOnce[Base]): RNA1 = {\n      // 根据文本上下文省略了实现部分\n    }\n\
  \  }\n}\n```\n（注：提供的最终代码块的文本包含大量的乱码/重复文本；我清理了逻辑，以匹配文中所描述的标准 Scala 实现，同时保留了所要求的结构意图。）\n\
  \n\n\n\n\n以下是两种创建方案的应用：\n\n```scala\nscala> RNA1.fromSeq(List(A, G, U, A))\n  res1:\
  \ RNA1 = RNA1(A, G, U, A)\n\n  scala> val rna1 = RNA1(A, U, G, G, C)\n  rna1: RNA1\
  \ = RNA1(A, U, G, G, C)\n```\n\n当 `RNA1` 混入 `IndexedSeqOps` 中时，它将 `Base`、`IndexedSeq`\
  \ 和 `RNA1` 指定为类型参数。第一个类型参数将 `Base` 为元素的类型。第二个类型参数选择 `IndexedSeq` 作为类型构造器，用于返回不同类型元素集合的转换操作。第三个类型参数定义了返回相同类型元素集合的转换操作的结果类型。\n\
  \n注意，第二个类型参数是 `IndexedSeq`，而第三个是 `RNA1`。这意味着像 `take` 或 `filter`get 操作将返回 `RNA1`：\n\
  \n```scala\nscala> rna1.take(3)\n  res2: RNA1 = RNA1(A, U, G)\n\n  scala> rna1.filter(_\
  \ != U)\n  res3: RNA1 = RNA1(A, G, G, C)\n```\n\n但像 `map` 或 `++` 的操作将返回 `IndexedSeq`：\n\
  \n```scala\nscala> rna1.map(base => base)\n  res7: IndexedSeq[Base] = Vector(A,\
  \ U, G, G, C)\n\n  scala> rna1 ++ rna1\n  res8: IndexedSeq[Base] = Vector(A, U,\
  \ G, G, C, A, U, G, G, C)\n```\n\n`map` 和 `++` 等方法应该如何适配 RNA 链呢？期望的行为是在将基映射到基或使用\
  \ `++` 附加两个 RNA 链时，能够返回一个 RNA 链。另一方面，在 RNA 链上将基映射到其他某种类型无法产生另一个 RNA 链，因为新元素的类型不对。它必须产生一个序列。同样，将非\
  \ `Base` 类型的元素追加到 RNA 链可能会产生通用序列，但不能产生另一个 RNA 链。\n\n在 `RNA1` 上，`map` 和 `++` 的结果永远不是\
  \ `RNA1`，即使生成的集合的元素类型是 `Base`。要查看如何做得更好，请查看 `map` 方法的签名（或 `++`，它具有相似的签名）。`map` 方法最初定义在\
  \ `scala.collection.IterableOps` 类中，签名如下：\n\n```scala\ndef mapB: CC[B]\n```\n\n\
  在 `RNA1` 的用中，`A` 是集合的元素类型，而 `CC` 是作为第二个参数传递给 `IterableOps` 特质的类型构造器。在 `RNA1` 的实现中，`CC`\
  \ 类型构造器是 `IndexedSeq`。这就是为什么你得到的 `map` 的结果类型是 `IndexedSeq`。\n\n### RNA 链类，第二版本\n\
  \n```scala\nimport scala.collection.{View, mutable}\nimport scala.collection.immutable.{IndexedSeq,\
  \ IndexedSeqOps}\n\nfinal class RNA2 private (val groups: Array[Int],\n    val length:\
  \ Int) extends IndexedSeq[Base]\n    with IndexedSeqOps[Base, IndexedSeq, RNA2]\
  \ {\n\n  import RNA2._\n\n  def apply(idx: Int): Base = // 同前\n\n  override def\
  \ className = \"RNA2\"\n\n  override protected def fromSpecific(\n    source: IterableOnce[Base]):\
  \ RNA2 = // 同前\n\n  override protected def newSpecificBuilder:\n    mutable.Builder[Base,\
  \ RNA2] = // 同前\n\n  override def empty: RNA2 = // 同前\n\n  // 重载方法以返回 RNA2\n  def\
  \ appended(base: Base): RNA2 = fromSpecific(\n    new View.Append(this, base))\n\
  \n  def appendedAll(suffix: IterableOnce[Base]): RNA2 =\n    concat(suffix)\n\n\
  \  def concat(suffix: IterableOnce[Base]): RNA2 =\n    fromSpecific(this.iterator\
  \ ++ suffix.iterator)\n\n  def flatMap(f: Base => IterableOnce[Base]): RNA2 =\n\
  \    fromSpecific(new View.FlatMap(this, f))\n\n  def map(f: Base => Base): RNA2\
  \ =\n    fromSpecific(new View.Map(this, f))\n\n  def prepended(base: Base): RNA2\
  \ = fromSpecific(\n    new View.Prepend(base, this))\n\n  def prependedAll(prefix:\
  \ IterableOnce[Base]): RNA2 =\n    fromSpecific(prefix.iterator ++ this.iterator)\n\
  \n  // `concat` 的符号别名\n  @inline final def ++ (suffix: IterableOnce[Base]): RNA2\
  \ =\n    concat(suffix)\n}\n```\n\n#### 列表 25.11 - RNA 链类，第二版本。\n\n为了改善这种状况，你可以重载返回\
  \ `CC[B]` 的方法，并在已知 `B` 为 `Base` 时让它们返回 RNA 链类型。必须重载的方法有 `appended`、`appendedAll`、`concat`、`flatMap`、`map`、`prepended`、`prependedAll`\
  \ 和 `++`。列表 25.11 中的 `RNA2` 类为 RNA 链重载了这些方法。\n\n此实现中的这些方法现在行为符合预期：\n\n```scala\n\
  scala> val rna2 = RNA2(A, U, G, G, C)\n  rna2: RNA2 = RNA2(A, U, G, G, C)\n\n  scala>\
  \ rna1.map(base => base)\n  res2: RNA2 = RNA2(A, U, G, G, C)\n\n  scala> rna1 ++\
  \ rna1\n  res3: RNA2 = RNA2(A, U, G, G, C, A, U, G, G, C)\n```\n\n这个实现比上一个好，但我们仍然可以改进一些地方。由于我们的集合是严格的，我们可以利用\
  \ builder 提供的更好性能。此外，如果我们尝试将 `Iterable[Base]` 转换为 `RNA2`，将会失败：\n\n```scala\nscala>\
  \ val bases: Iterable[Base] = List(A, U, G, C)\n  bases: Iterable[Base] = List(A,\
  \ U, G, C)\n\nscala> bases.to(RNA2)\nerror: type mismatch; found RNA2; required:\
  \ scala.Factory\n```\n\n### RNA 链类，最终版本\n\n```scala\n import scala.collection.{AbstractIterator,\
  \ SpecificFactory, StrictOptimizedSeq, View, mutable}\n import scala.collection.immutable.{IndexedSeq,\
  \ IndexedSeqOps}\n\n final class RNA (groups: Array[Int],\n    val length: Int)\
  \ extends IndexedSeq[Base]\n    with IndexedSeqOps[Base, IndexedSeq, RNA]\n    with\
  \ StrictOptimizedSeq[Base, IndexedSeq, RNA] {\n\n  import RNA._\n\n  // IndexedSeqOps\
  \ 中强制实现的 apply\n  def apply(idx: Int): Base = {\n    if (idx < 0 || length <= idx)\n\
  \      throw new IndexOutOfBoundsException\n    Base.fromInt(groups(idx / N) >>\
  \ idx % N)\n  }\n\n  override def className = \"RNA\"\n\n  override protected def\
  \ fromSpecific(\n    source: IterableOnce[Base]): RNA =\n    RNA.fromSpecific(source)\n\
  \n  override protected def newSpecificBuilder:\n    mutable.Builder[Base, RNA] =\n\
  \    RNA.newBuilder\n\n  override def empty: RNA = RNA.empty\n\n  // 重载方法以返回 RNA\n\
  \  def appended(base: Base): RNA =\n    (newSpecificBuilder ++= this += base).result()\n\
  \n  def appendedAll(suffix: IterableOnce[Base]): RNA =\n    strictOptimizedConcat(suffix,\
  \ newSpecificBuilder)\n\n  def concat(suffix: IterableOnce[Base]): RNA =\n    strictOptimizedConcat(suffix,\
  \ newSpecificBuilder)\n\n  def flatMap(f: Base => IterableOnce[Base]): RNA =\n \
  \   strictOptimizedFlatMap(newSpecificBuilder, f)\n\n  // 继续见 列表 25.13...\n```\n\
  \n#### 列表 25.12 - RNA 链类，最终版本（部分 1）。\n\n\n\n\n\n```\n // ...continued from Listing\
  \ 25.12\n    def map(f: Base => Base): RNA =\n      strictOptimizedMap(newSpecificBuilder,\
  \ f)\n\n    def prepended(base: Base): RNA =\n      (newSpecificBuilder += base\
  \ ++= this).result()\n\n    def prependedAll(prefix: Iterable[Base]): RNA =\n  \
  \    (newSpecificBuilder ++= prefix ++= this).result()\n\n    @inline final def\
  \ ++ (suffix: IterableOnce[Base]): RNA =\n      concat(suffix)\n\n    // 对迭代器的可选重新实现，\n\
  \    // 以使其其更高效。\n      override def iterator: Iterator[Base] =\n        new AbstractIterator[Base]\
  \ {\n          private var i = 0\n          private var b = 0\n          def hasNext:\
  \ Boolean = i < rna.length\n          def next(): Base = {\n            b = if (i\
  \ % N == 0) groups(i / N) else b >>> S\n            i += 1\n            Base.fromInt(b\
  \ & M)\n          }\n        }\n  }\n\n  object RNA extends SpecificIterableFactory[Base,\
  \ RNA] {\n\n    private val S = 2            // 组中的位数\n    private val M = (1 <<\
  \ S) - 1  // 用于隔离组的位掩\n    private val N = 32 / S       // Int 中组的个数\n\n    def\
  \ fromSeq(buf: collection.Seq[Base]): RNA = {\n      val groups = new ArrayInt /\
  \ N)\n      for (i <- 0 until buf.length)\n          groups(i / N) |= Base.toInt(buf(i))\
  \ << (i % N * S)\n      new RNA(groups, buf.length)\n    }\n\n    // 继续见 Listing\
  \ 25.14...\n```\n\n### 列表 25.13 - RNA 链类，最终版本（部分 2）。\n\n```\n // ...continued from\
  \ Listing 25.13\n\n    // 实现 SpecificIterableFactory \n    // 需要的工厂方法\n    def empty:\
  \ RNA = fromSeq(Seq.empty)\n\n    def newBuilder: mutable.Builder[Base, RNA] =\n\
  \      mutable.ArrayBuffer[Base].mapResult(fromSeq)\n\n    def fromSpecific(it:\
  \ IterableOnce[Base]): RNA = it match {\n      case seq: collection.Seq[Base] =>\
  \ fromSeq(seq)\n      case _ => fromSeq(mutable.ArrayBuffer.from(it))\n    }\n```\n\
  \n### 列表 25.14 - RNA 链类，最终版本（部分 3）。\n\n`RNA` 类的最终版本扩展了 `StrictOptimizedSeq` 特性。该特性重写了所有转换操作以利用严格构建器（strict\
  \ builders）。此外，此版本使用了 `StrictOptimizedSeq` 特性提供的公用操作，例如 `strictOptimizedConcat`，以使返回\
  \ `RNA` 的重载转换方法（如 `++`）更高效。\n\n为了方便将任何碱基集合转换为 `RNA`，`RNA` 的伴随对象扩展了 `SpecificIterableFactory[Base,\
  \ RNA]`。这使得 `RNA` 伴随对象可以使用 `Seq` 上 `to` 方法的参数：\n\n```\nList(U, A, C).to(RNA)\nres:\
  \ RNA(U, A, C)\n```\n\n特性 `SpecificIterableFactory[Base, RNA]` 定义了三个抽象方法：`empty`、`newBuilder`\
  \ 和 `fromSpecific`。`RNA` 对象实现了这些方法，而 `RNA` 类根据这些方法定义了它的 `fromSpecific` 和 `newBuilder`\
  \ 方法。\n\n为止的讨论集中在定义符合特定类型的序列所需的最小定义量。但在实践中，你可能还想为序列添加功能，或重写现有方法以提高效率。其中一个例子是 `RNA`\
  \ 类中重写的 `iterator` 方法。`iterator` 方法本身是一个重要方法，因为它实现了对集合的迭代。此外，许多其他集合方法都是基于 `iterator`\
  \ 实现的。因此，投入精力优化该方法的实现是有意义的。\n\n`IndexedSeq` 中 `iterator` 的标准实现将使用 `apply` 选择集合中的第\
  \ `i` 个元素，其中 `i` 的范围从 0 到集合的长度。因此，这种标准实现为 `RNA` 链中的每个元素都会选择一个数组元素并从中解出一个碱基。`RNA`\
  \ 类中重写的 `iterator` 则要智能得多。对于每个选定的数组元素，它会立即对其中包含的所有碱基应用给定的函数。这样就减少了数组选择和位解包的工作量。\n\
  \n#### 前缀映射（Prefix maps）\n\n作为第三个示例，你将学习如何将一种新的可变映射集成到集合框架中。其思想是使用“字典树”（Patricia\
  \ trie）实现一个以 `String` 为键类型的可变映射。`Patricia` 是 \"Practical Algorithm to Retrieve Information\
  \ Coded in Alphanumeric”（检索字母数字编码信息的实用算法）的缩写。其核心思想是将集合或映射存储为树结构，搜索键中的后续字符唯一地决定了后代树。\n\
  \n例如，存储五个字符串 \"abc\"、abd\"、al\"、all\"、xy\" 的 `Patricia` 字典树看起来如图 25.2 所示的树。要在该字典树中找到对应字符串\
  \ \"abc\" 的节点，只需遵循标记为 \"a\" 的子树，从那里继续到标记为 \"b\" 的子树，最后到达其标记为 \"c\" 的子树。如果将 `Patricia`\
  \ 字典树用作映射，则与键关联的值存储在可以通过键到达的节点中。如果是一个集合，你只需存储一个标记表示该节点存在于集合中。\n\n```\n import scala.collection._\n\
  \nclass PrefixMap[A] extends mutable.Map[String, A]\n    with mutable.MapOps[String,\
  \ A, mutable.Map, PrefixMap[A]]\n    with StrictOptimizedIterableOps\n    [(String,\
  \ A), mutable.Iterable, PrefixMap[A]] {\n\n  private var suffixes: immutable.Map[Char,\
  \ PrefixMap[A]] =\n    immutable.Map.empty\n\n  private var value: Option[A] = None\n\
  \n  def get(s: String): Option[A] =\n    if (s.isEmpty) value\n    else suffixes\
  \ get (s(0)) flatMap (_.get(s substring 1))\n\n  def addOne(kv: (String, A)): this\
  \ =\n    withPrefix(kv._1).value = Some(kv._2)\n    this\n\n  def subtractOne(s:\
  \ String): this =\n    if (s.isEmpty) { val prev = value; value = None; prev }\n\
  \    else suffixes get (s(0)) flatMap (_.remove(s 1))\n    this\n\n  def withPrefix(s:\
  \ String): PrefixMap[A] =\n    if (s.isEmpty) this\n    else {\n      val leading\
  \ = s(0)\n      suffixes get leading {\n        case None =>\n          suffixes\
  \ = suffixes + (leading -> empty)\n        case _ =>\n          suffixes(leading)\
  \ withPrefix (s 1)\n      }\n    }\n  // 继续见 Listing 25.16...\n```\n\n### 列表 25.15\
  \ - 使用字典树实现的前缀映射。\n\n```\n // ...continued from Listing 25.15\n\n  def iterator:\
  \ Iterator[(String, A)] =\n    (for (v <- value.iterator) yield (\"\", v)) ++\n\
  \    (for ((chr, m) <- suffixes.iterator;\n        (s, v) <- m.iterator) yield (chr\
  \ + s, v)\n\n  override def className = \"PrefixMap\"\n\n  // 重载方法以返回 PrefixMap\n\
  \  def mapB) => (String, B)): PrefixMap[B] =\n    strictOptimizedMap(PrefixMap.newBuilder[B],\
  \ f)\n\n  def flatMapB) =>\n    IterableOnce[(String, B)]): PrefixMap[B] =\n   \
  \ strictOptimizedFlatMap(PrefixMap.newBuilder[B], f)\n\n  // 重载 concat 以精化其返回类型\n\
  \  override def concatB >: A]): PrefixMap[B] =\n    strictOptimizedConcat(suffix,\
  \ PrefixMap.newBuilder[B])\n\n  // 在 scala.collection.mutable.Clearable 中定义\n  def\
  \ clear(): Unit = suffixes = immutable.Map.empty\n\n  // 在 scala.collection.IterableOps\
  \ 中定义\n  override protected def fromSpecific(\n      source: IterableOnce[(String,\
  \ A)]): PrefixMap[A] =\n    PrefixMap.from(coll)\n\n  override protected def newSpecificBuilder:\n\
  \    mutable.Builder[(String, A), PrefixMap[A]] =\n    PrefixMap.newBuilder\n\n\
  \  override def empty: PrefixMap[A] = new PrefixMap\n  }\n```\n\n### 列表 25.16 -\
  \ 前缀映射的实现（继续）。\n\n\n\n\n\n![image images/patricia160.png](img/patricia160.png)\n\
  \n##### 图 25.2 - Patricia 字典树示例。\n\nPatricia 字典树支持非常高效的查找和更新。另一个很棒特性是它们支持通过提供前缀来选择子集合。例如，在图\
  \ 25.2 所示的树中，你只需从树的根节点沿着 \"a\" 链接，即可获取所有以 \"a\" 开头的键的子集合。\n\n基于这些思想，我们现在将带你实现一个基于\
  \ Patricia 字典树的 map。我们将该 map 称为 `PrefixMap`，这意味着它提供了一个 `withPrefix` 方法，用于选择所有以给定前缀开头的键的子\
  \ map。\n\n首先，我们将根据图 25.2 中所示的键定义一个前缀 map：\n\n```\nscala> val m = PrefixMap(\"abc\"\
  \ -> 0, \"abd\" -> 1, \"al\" -> 2,\n  \"all\" -> 3, \"xy\" -> 4)\n  m: PrefixMap[Int]\
  \ = Map((abc,0), (abd,1), (al,2), (all,3),\n  (xy,4))\n```\n\n然后，在 `m` 上调用 `withPrefix`\
  \ 将产生另一个前缀 map：\n\n```\nscala> m withPrefix \"a\"\n  res14: PrefixMap[Int] = Map((bc,0),\
  \ (bd,1), (l,2), (ll,3))\n```\n\n代码列表 25.15 和 25.16 显示了 `PrefixMap` 的定义。它将字符串与任意类型的值关联起来，因此它有一个类型参数\
  \ `A` 用于 map 的值。在你在 RNA 链链示例中见过的模式中，该类同时继承了 `mutable.Map` 和 `MapOps`。继承实现类 `MapOps`\
  \ 是为了在使用 `filter` 和 `take` 等转换时获得正确的返回类型。\n\n前缀 map 节点有两个可变字段：`suffixes` 和 `value`。`value`\
  \ 字段包含一个与节点关联的可选值。它被初始化为 `None`。`suffixes` 字段包含一个从字符到 `PrefixMap` 的 map。它被初始化为空\
  \ map。你可能会问，为什么我们选择不可变 map 作为 `suffixes` 的实现类型？既然 `PrefixMap` 整体也是可变的，使用可变 map 不是不是更标准吗？答案是，包含极少数元素的不可变\
  \ map 在空间和执行时间上都是高效的。\n\n例如，包含少于五个元素的 map 被表示为一个对象。相比之下，如第 17.2 节所述，标准的可变 map 是\
  \ `HashMap`，即使是，通常也会占用大约 80 字节。因此，如果小集合很常见，选择不可变的比可变的更好。在 Patricia 字典树中，我们预计除了最顶端的节点外，大多数节点都只包含几个后继节点。因此，将这些后继节点存储在不可变\
  \ map 中可能更高效。\n\n现在来看 map map 需要实现的第一个方法：`get`。算法如下：要获取前缀 map 中与空字符串关联的值，只需选择存储在树根节点中的可选值。否则，如果键字符串不为空，则尝试选择与字符串第一个字符对应的子\
  \ map。如果这产生了一个 map，则继续在该 map 中查找键字符串第一个字符之后的剩余部分。如果选择失败，则 map 中未存储该键，因此返回 `None`。对\
  \ option 值的组合选择可以使用 `flatMap` 优雅地表达出来。当将 `flatMap` 应用于可选值 `ov` 和一个闭包 `f`（该闭包反过来返回一个可选值\
  \ `ov`）时，如果 `ov` 和 `f` 都返回了定义的值，则 `ov flatMap f` 将成功。否则，`ov flatMap f` 将返回 `None`。\n\
  \n可变 map 需要实现的另外两个方法是 `addOne` 和 `subtractOne`。`subtractOne` 方法与 `get` 非常相似，仅在返回任何关联值之前，包含该值的字段被设置为\
  \ `None`。`addOne` 方法首先调用 `withPrefix` 导航到需要更新的树节点，然后将该节点的 `value` 字段设置为给定的值。`withPrefix`\
  \ 方法遍历树，如果某些字符前缀尚未作为路径包含在树中，则根据需要创建子 map。\n\n可变 map 需要实现的最后一个抽象方法是 `iterator`。该方法需要产生一个迭代器，产生存储在\
  \ map 中的所有键/值值对。对于任何给定的前缀 map，该迭代器由以下部分组成：首先，如果 map 的 `value` 字段包含一个定义的值 `Some(x)`，则第一个元素是\
  \ `(\"\", x)`。此外，迭代器需要遍历所有子 map 的迭代器，但它需要在这些迭代器返回的每个字符串前面添加一个字符。更准确地说，如果 `m` 是通过字符\
  \ `chr` 从根到达的子 map，且 `(s, v)` 是从 `m` 返回的元素，那么根节点的迭代器将返回 `(chr + s, v)`。这种逻辑在代码列表\
  \ 25.15 的 `iterator` 方法中通过两个表达式的拼接简洁地实现。第一个表达式遍历 `value`。这利用了事实：`Option` 定义了一个迭代器，如果值为\
  \ `None`，则不返回元素；如果值为 `Some(x)`，则恰好返回一个元素。`PrefixMap` 重写了 `fromSpecific` 和 `newSpecific`，将它们的返回类型缩小为\
  \ `PrefixMap`。\n\n```scala\nimport scala.collection._\nimport scala.language.implicitversions\n\
  \nobject PrefixMap {\n  def empty[A] = new PrefixMap[A]\n\n  def fromA]): PrefixMap[A]\
  \ =\n    source match {\n      case pm: PrefixMap[A] => pm\n      case _ => newBuilder[A]\
  \ += source\n    }\n\n  def applyA*): PrefixMap[A] = from(kvs)\n\n  def newBuilder[A]:\
  \ mutable.Builder[(String, A), PrefixMap[A]] =\n    new GrowableBuilder[(String,\
  \ A), PrefixMap[A]](empty)\n\n  implicit def toFactoryA: Factory[(String, A), PrefixMap[A]]\
  \ =\n    new Factory[(String, A), PrefixMap[A]] {\n      def fromSpecific(source:\
  \ IterableOnce[(String, A)]): PrefixMap[A] =\n        self.from(source)\n      def\
  \ newBuilder: mutable.Builder[(String, A), PrefixMap[A]] =\n        self.newBuilder\n\
  \    }\n}\n```\n\n##### 代码列表 25.17 - 前缀 map 的伴侣对象。\n\n我们现在转向代码列表 25.17 所示的伴侣对象 `PrefixMap`。实际上，严格不需要定义这个伴侣对象，因为\
  \ `PrefixMap` 类可以独立存在。`object PrefixMap` 的主要目的是定义一些方便的工厂方法。它还定义了一个到 `Factory` 的隐式转换，以便与其他集合具有更好的操作性。这种转换在人们编写类似\
  \ `List(\"foo\" -> 3).to(PrefixMap)` 时触发。`to` 操作接收一个 `Factory` 作为参数，但 `PrefixMap`\
  \ 伴侣对象没有继承 `Factory`（它不能继承，因为 `Factory` 固定了集合元素的类型，而 `PrefixMap` 的值是多态的）。\n\n这两个方便方法是\
  \ `empty` 和 `apply`。Scala 集合框架中的所有其他集合都存在相同的方法，因此在这里定义它们也是有意义的。有了这两个方法，你可以像编写任何其他集合一样编写\
  \ `PrefixMap` 字面量：\n\n```\nscala> PrefixMap(\"hello\" -> 5, \"hi\" -> 2)\n  res0:\
  \ PrefixMap[Int] = PrefixMap(hello -> 5, hi -> 2)\n\nscala> res0 += \"foo\" -> 3\n\
  \  res1: res0.type = PrefixMap(hello -> 5, hi -> 2, foo -> 3)\n```\n\n### 总结\n\n\
  \n\n\n\n如果你想将一个新的集合类完全集成到框架中，需要注意以下几点：\n\n1. 决定集合应该是可变的还是不可变的。\n2. 为集合选择正确的基特质（traits）。\n\
  3. 继承正确的模板特质（template trait）以实现大多数集合操作。\n4. 对默认不返回集合的操作进行重载，并尽可能返回具体的集合类型。\n\n##\
  \ 25.3 结论\n\n你现在已经了解 Scala 集合是如何构建的，以及你如何添加新类型的集合。得于 Scala 对抽象的丰富支持，每个新的集合类型都拥有大量方法，而无需重新实现所有方法。\n\
  \n* *\n\n#### 第 25 章脚注：\n\n[1] 理想情况下，一切都应该只在一个地方定义，但有少数例外需要重新定义。\n\n[2] 类型构造器在第\
  \ 19.3 节 中进行了描述。\n\n[3] 视图（Views）在第 24.13 节 中进行了描述。\n\n[4] Morrison, \"PATRICIA—Practical\
  \ Algorithm To Retrieve Information Coded in Alphanumeric\" [[Mor68]](#bibliography.html_patricia)\n\
  \n## 第 26 章\n\n# 提取器\n\n到此时，你可能已经习惯了使用模式匹配来分解和分析数据的简洁方式。本章将向你展示如何进一步这一概念。到目前，构造器模式与样例类（case\
  \ classes）相关联。例如，`Some(x)` 是一个有效模式，因为 `Some` 是一个样例类。有时，你可能希望在不创建关联样例类的情况下编写此类这样的模式。事实上，你可能希望能够创建自己的模式。提取器（Extractors）为你提供了方法。本章将解释什么是提取器，以及你如何使用它们来定义与对象表示解耦的模式。\n\
  \n## 26.1 示例：提取电子邮件地址\n\n为了说明提取器所解决的问题，假设你需要分析表示电子邮件地址的字符串。给定一个字符串，你想判断它是否为电子邮件地址，如果是，你想访问该地址的用户部分和域名部分。实现这一点的传统方法使用三个辅助函数：\n\
  \n```\n def isEMail(s: String): Boolean\n  def domain(s: String): String\n  def\
  \ user(s: String): String\n```\n\n使用这些函数，你可以如下解析给定的字符串 `s`：\n\n```\n if (isEMail(s))\
  \ println(user(s) + \" AT \" + domain(s))\n  else println(\"not an email address\"\
  )\n```\n\n这种方法可行，但有点笨拙。此外，如果结合了多个这样的测试，情况会变得更加复杂。例如，你可能想在列表中找到两个连续的、具有相同用户的电子邮件地址字符串。你可以尝试使用之前定义的访问函数来测试一下，看看涉及哪些操作。\n\
  \n你早已在第 15 章中看到，模式匹配是处理这类问题的理想工具。让我们先假设你可以用一个模式来匹配字符串：\n\n```\n EMail(user, domain)\n\
  ```\n\n如果字符串中包含一个嵌入的 @ 符号，则该模式将匹配成功。在这种情况下，它会将变量 `user` 绑定到字符串 @ 之前的部分，并将变量 `domain`\
  \ 绑定到 @ 之后的部分。假设有这样一个模式，之前的表达式可以写得更清晰一些：\n\n```\n s match {\n  case EMail(user,\
  \ domain) => println(user + \" AT \" + domain)\n  case _ => println(\"not an email\
  \ address\")\n  }\n```\n\n寻找两个具有相同用户的连续电子邮件地址的更复杂问题，可以转换为以下模式：\n\n```\n ss match\
  \ {\n  case EMail(u1, d1) :: EMail(u2, d2) :: _ if (u1 == u2) => ...\n  ...\n  }\n\
  ```\n\n这比用访问函数编写的任何代码都要易读得多。然而，问题在于字符串并不是样例类；它们没有符合 `EMail(user, domain)` 的表示。这就是\
  \ Scala 提取器的用武之地了：它们允许你为现有类型定义新模式，而模式不需要遵循该类型的内部表示。\n\n## 26.2 提取器\n\nScala 中的提取器是一个对象，它包含一个名为\
  \ `unapply` 的方法。该 `unapply` 方法的作用是匹配值并将其拆解。通常，提取器对象还会定义一个对立的方法 `apply` 来构建值，但这不是强制要求的。例如，列表\
  \ 26.1 展示了一个电子邮件地址的提取器对象：\n\n```\n object EMail {\n\n  // 注入方法（可选）\n  def apply(user:\
  \ String, domain: String) = user + \"@\" + domain\n\n  // 提取方法（强制）\n  def unapply(str:\
  \ String): Option[(String, String)] = {\n    val parts = str split \"@\"\n    if\
  \ (parts.length == 2) Some(parts(0), parts(1)) else None\n    }\n  }\n```\n\n#####\
  \ 列表 26.1 - EMail 字符串提取器对象。\n\n该对象同时定义了 `apply` 和 `unapply` 方法。`apply` 方法的含义与以往相同：它将\
  \ `EMail` 转换为一个可以像方法一样作用在括号内参数上的对象。因此，你可以通过写下 `EMail(\"John\", \"epfl.ch\")` 来构造字符串\
  \ \"John@epfl.ch\"。为了让这更显式，你也可以让 `EMail` 继承 Scala 的函数类型，如下：\n\n```\n object EMail\
  \ extends ((String, String) => String) { ... }\n```\n\n#### 注意\n\n上述对象声明中的 `(String,\
  \ String) => String` 部分与 `Function2[String, String, String]` 相同，后者声明了一个由 `EMail`\
  \ 实现的抽象 `apply` 方法。由于此声明，你可以将 `EMail` 传递给一个期望 `Function2[String, String, String]`\
  \ 的方法。\n\n`unapply` 方法是将 `EMail` 变为提取器的关键。在某种意义上，它反转了 `apply` 的构建过程。`apply` 接收两个字符串并形成一个电子邮件地址字符串，而\
  \ `unapply` 接收一个电子邮件地址并返回可能的两个字符串：地址的 `user` 和 `domain`。但 `unapply` 也必须处理给定字符串不是电子邮件地址的情况。这就是为什么\
  \ `unapply` 返回一个关于字符串对的 `Option` 类型。如果字符串是具有给定 `user` 和 `domain` 部分的电子邮件地址，其结果为\
  \ `Some(user, domain)`，[1]](#extractors.html_footnot26-1)；如果 str 不是电子邮件地址，则为 `None`。以下是一些示例：\n\
  \n```\n unapply(\"John@epfl.ch\") equals Some(\"John\", \"epfl.ch\")\n  unapply(\"\
  John Doe\") equals None\n```\n\n现在，每当模式匹配遇到引用提取器的模式时，它会在选择表达式上调用提取器的 `unapply` 方法。例如，执行代码：\n\
  \n```\n selectorString match { case EMail(user, domain) => ... }\n```\n\n会导致调用：\n\
  \n```\n EMail.unapply(selectorString)\n```\n\n正如你之前看到的，此调用 `EMail.unapply` 将返回 `None`\
  \ 或 `Some(u, d)`，其中 `u` 代表用户部分，`d` 代表域名。在 `None` 情况下，模式不匹配，系统将尝试另一个模式或抛出 `MatchError`\
  \ 异常。在 `Some(u, d)` 情况下，模式匹配，其变量绑定到返回的值上。在之前的匹配中，`user` 将绑定到 `u`，`domain` 将绑定到 `d`。\n\
  \n\n\n\n给定此代码，模式匹配器将首先检查给定的值 `x` 是否符合 `String`，即 `EMail` 的 `unapply` 方法的参数类型。如果符合，该值将强制转换为\
  \ `String` 并像以前一样继续进行模式匹配。如果不符合，模式匹配将立即失败。\n\n在对象 `EMail` 中，`apply` 方法被称为**注入**（injection），因为它接收一些参数并产生一个给定集合的元素（在我们的用例中：电子邮件地址的字符串集合）。`unapply`\
  \ 方法被称为**提取**（extraction），因为它接收相同集合中的一个元素并提取出它的某些部分（在我们的用例中：`user` 和 `domain` 子字符串）。注入和提取通常组合在一个对象中，因为这样你就可以使用对象的名称同时作为构造函数和模式，这模拟了与用例类（case\
  \ classes）进行模式匹配的惯例。不过，也可以在没有对应 `apply` 方法的对象中定义一个提取方法。无论该对象是否具有 `apply` 方法，该对象本身都被称为**提取器**（extractor）。\n\
  \n如果包含注入方法，它应该是提取方法的对偶方法。例如，调用：\n\n```\nEMail.unapply(EMail.apply(user, domain))\n\
  ```\n\n应该返回：\n\n```\nSome(user, domain)\n```\n\n*即*，相同的参数序列被封装在一个 `Some` 中。向反方向运行意味着先运行\
  \ `unapply` 然后运行 `apply`，如下代码所示：\n\n```\nEMail.unapply(obj) match { \n  case Some(u,\
  \ d) => EMail.apply(u, d) \n}\n```\n\n在上述代码中，如果对 `obj` 的匹配成功，你将期望从 `apply` get 相同的对象。`apply`\
  \ 和 `unapply` 的对偶性的这两个条件是良好的设计原则。Scala 并没有强制执行这些原则，但在设计提取器时建议遵循这些原则。\n\n## 26.3\
  \ 具有零个或一个变量的模式\n\n上一个示例中的 `unapply` 方法在成功时返回了一对元素值。这可以很容易地推广到具有两个以上变量的模式。为了绑定 `N`\
  \ 个变量，`unapply` 将返回一个包含 `N` 个元素的元组，并封装在 `Some` 中。\n\n然而，模式仅绑定一个变量的情况处理方式不同。Scala\
  \ 中没有单元素元组。为了只返回一个模式元素，`unapply` 方法只是简单地将元素本身封装在 `Some` 中。例如，列表 26.2 所示的提取器对象为连续出现两次相同子字符串的字符串定义了\
  \ `apply` 和 `unapply`：\n\n```\nobject Twice {\n  def apply(s: String): String =\
  \ s + s\n  def unapply(s: String): Option[String] = {\n    val length = s.length\
  \ / 2\n    val half = s.substring(0, length)\n    if (half == s.substring(length))\
  \ Some(half) else None\n  }\n}\n```\n\n##### 列表 26.2 - Twice 字符串提取器对象。\n\n提取模式也可能不任何变量。在这种情况下，相应的\
  \ `unapply` 方法返回一个布尔值——成功为 true，失败为 false。例如，列表 26.3 所示的提取器对象描述了由全大写字母组成的字符串：\n\n\
  ```scala\nobject UpperCase {\n  def unapply(s: String): Boolean = s.toUpperCase\
  \ == s\n}\n```\n\n##### 列表 26.3 - UpperCase 字符串提取器对象。\n\n这一次，提取器只定义了 `unapply` 而没有定义\
  \ `apply`。定义 `apply` 没有意义的，因为没有东西需要构造。\n\n下面的 `userTwiceUpper` 函数在其模式匹配代码中共同应用了之前定义的所有提取器：\n\
  \n```\ndef userTwiceUpper(s: String) = s match {\n  case EMail(Twice(x @ UpperCase()),\
  \ domain) =>\n    \"match: \" + x + \" in domain \" + domain\n  case _ => \n   \
  \ \"no match\"\n}\n```\n\n该函数的第一个模式匹配符合电子邮件地址的字符串，其用户部分由两个连续的大写相同字符串组成。例如：\n\n```scala\n\
  scala> userTwiceUpper(\"DIDI@hotmail.com\")\n  res0: String = match: DI in domain\
  \ hotmail.com\n\nscala> userTwiceUpper(\"DIDO@hotmail.com\")\n  res1: String = no\
  \ match\n\nscala> userTwiceUpper(\"didi@hotmail.com\")\n  res2: String = no match\n\
  ```\n\n注意函数 `userTwiceUpper` 中的 `UpperCase` 接受一个空参数列表。这不能省略，否则匹配将测试与对象 `UpperCase`\
  \ 的等性！另请注意，尽管 `UpperCase()` 本身没有绑定任何变量，但仍然可以将变量与它匹配的整个模式相关联。要做到这一点，你使用 第 15.2 节\
  \ 中解释的标准变量绑定方案：`x @ UpperCase()` 形式将变量 `x` 与 `UpperCase()` 匹配的模式关联。例如，在上面的第一次 `userTwiceUpper`\
  \ 调用中，`x` 被绑定到 `\"DI\"`，因为那是与 `UpperCase()` 模式进行匹配的值。\n\n## 26.4 可变长度参数提取器\n\n之前电子邮件地址的提取方法都返回固定数量的元素值。有时，这并不灵活。例如，你可能想匹配一个字符串，以便保留域的每个部分。这将允许你表达如所示的模式：\n\
  \n```\nmatch {\n  case Domain(\"org\", \"acm\") => println(\"acm.org\")\n  case\
  \ Domain(\"com\", \"sun\", \"java\") => println(\"java.com\")\n  case Domain(\"\
  net\", _) => println(\".net\")\n}\n```\n\n在这个例子中，域的排列是反的——从顶级域名开始。你在 第 15.2 节 中看到参数列表末尾的序列通配符\
  \ `*` 匹配任何剩余元素。\n\n问题在于，提取器如何支持如上例所示的可变参数匹配，其中模式具有不同数量的子模式。到目前为止的 `unapply` 方法是不够的，因为它们都返回固定数量的子元素。为了处理这种情况，Scala\
  \ 允许你定义一种专门用于可变参数匹配的不同提取方法。该方法被称为 `unapplySeq`。要查看它是如何写的，请看 列表 26.4 所示的 `Domain`\
  \ 提取器：\n\n```\nobject Domain {\n\n  // 注入方法（可选）\n  def apply(parts: String*): String\
  \ = \n    parts.reverse.mkString(\".\")\n\n  // 提取方法（强制）\n  def unapplySeq(whole:\
  \ String): Option[Seq[String]] = \n    Some(whole.split(\"\\\\.\").reverse.toSeq)\n\
  }\n```\n\n##### 列表 26.4 - Domain 字符串提取器对象。\n\n`Domain` 对象定义了一个 `unapplySeq` 方法，它首先将字符串根据点分隔成部分。这是使用\
  \ Java 字符串的 `split` 方法实现的，该方法接受正则表达式作为参数。`split` 的结果是子字符串数组。`unapplySeq` 的结果是该数组的所有元素反转并封装在一个\
  \ `Some` 中。\n\n`unapplySeq` 的结果类型必须符合 `Option[Seq[T]]`，其中元素类型 `T` 是任意的。正如你在 第 17.1\
  \ 节 中所示，`Seq` 是 Scala 集合层次结构中一个重要的类。它是描述不同类型序列的几个类的公共父类：`List`、`Array`、`WrappedString`\
  \ 以及其他几个。\n\n### 为了对称性，`Domain` 还有一个 `apply` 方法，根据从顶级域名开始的域部分的可变参数构建域字符串。一如既往，“apply`\
  \ 方法是可选的。\n\n\n\n你可以使用 `Domain` 提取器从电子邮件字符串中获取更详细的信息。例如，要在某些 \".com\" 域名中搜索名为 \"\
  tom\" 的邮箱地址，你可以编写以下函数：\n\n```scala\n def isTomInDotCom(s: String): Boolean = s match\
  \ {\n  case EMail(\"tom\", Domain(\"com\", _)) => true\n  case _ => false\n}\n```\n\
  \n这会得到预期的结果：\n\n```scala\nscala> isTomInDotCom(\"tom@sun.com\")\n  res3: Boolean\
  \ = true\n\n  scala> isTomInDotCom(\"peter@sun.com\")\n  res4: Boolean = false\n\
  \n  scala> isTomInDotCom(\"tom@acm.org\")\n  res5: Boolean = false\n```\n\n你也可以从\
  \ `unapplySeq` 返回一些固定元素以及变量部分。这通过返回一个包含所有元素的元组来实现，按照惯例，变量部分放在最后。例如，Listing 26.5\
  \ 显示了一个新的邮箱提取器，其中域名部分已经展开为一个序列：\n\n```scala\nobject ExpandedEMail {\n  def unapplySeq(email:\
  \ String)\n      : Option[(String, Seq[String])] = {\n    val parts = email split\
  \ \"@\"\n    if (parts.length == 2) \n      Some(parts(0), parts(1).split(\"\\\\\
  .\").reverse.toSeq)\n    else \n      None\n  }\n}\n```\n\n##### Listing 26.5 -\
  \ ExpandedEMail 提取器对象。\n\n`ExpandedEMail` 中的 `unapplySeq` 方法返回一个可选的对（一个 `Tuple2`）。该元组的第一个元素是用户部分。第二个元素是代表域名的名称序列。你可以像往常对其进行匹配：\n\
  \n```scala\nscala> val s = \"tom@support.epfl.ch\"\n  s: String = tom@support.epfl.ch\n\
  \n  scala> val ExpandedEMail(name, topdom, subdoms @*) = s\n  name: String = tom\n\
  \  topdom: String = ch\n  subdoms: Seq[String] = WrappedArray(epfl, support)\n```\n\
  \n## 26.5 提取器与序列模式\n\n你在 Section 15.2 中看到，可以使用序列模式访问列表或数组的元素，例如：\n\n```scala\nList()\n\
  List(x, y, _)\nArray(x, 0, 0, _)\n```\n\n事实上，这些序列模式都是通过 Scala 标准库中的提取器实现的。例如，`List(...)`\
  \ 形式的模式之所以可能，是因为 `scala.List` 伴侣对象是一个定义了 `unapplySeq` 方法的提取器。Listing 26.6 显示了相关的定义：\n\
  \n```scala\npackage scala\n  object List {\n    def applyT = elems.toList\n    def\
  \ unapplySeqT: Option[Seq[T]] = Some(x)\n    ... \n  }\n```\n\n##### Listing 26.6\
  \ - 定义了 unapplySeq 方法的提取器。\n\n`List` 对象包含一个接受可变参数的 `apply` 方法。这让你能够编写诸如下表达式：\n\n\
  ```scala\nList()\nList(1, 2, 3)\n```\n\n它还包含一个 `unapplySeq` 方法，将列表的所有元素作为序列返回。这正是支持\
  \ `List(...)` 模式的原因。在 `scala.Array` 对象中也存在非常相似的定义。这些支持对数组类似的注入和提取。\n\n## 26.6 提取器与类类\n\
  \n尽管类类（case classes）非常有用，但它们有一个缺点：它们暴露了数据的具体表示。这意味着构造模式中的类名对应于选择器对象的具体表示类型。如果匹配以下内容：\n\
  \n```scala\ncase C(...)\n```\n\n成功，你就知道选择器表达式是类 `C` 的实例。\n\n提取器打破了数据表示与模式之间的这种联系。你已经在在本节的示例中看到，提取器允许创建与所选对象数据类型无关的模式。这种属性被称为**表示独立性**。在大型开放系统中，表示独立性非常重要，因为它允许你更改一组组件中使用的实现类型，而不会影响这些组件的客户端。\n\
  \n如果你的组件定义并导出了一组类类，你将受困于它们，因为客户端代码可能已经包含了对这些类类的模式匹配。重命名某些类类或更改类层次结构都会影响客户端代码。提取器没有遇到这个问题，因为它们在数据表示与客户端查看方式之间代表了一层间接。只要你随之更新所有的提取器，你仍然更改某种类型的具体表示。\n\
  \n表示独立性是提取器优于类类的一个重要优势。另一方面，类类相对于提取器也有自己的优势。首先，它们更容易设置和定义，需要的代码更少。其次，它们通常能产生比提取器更高效的模式匹配，因为\
  \ Scala 编译器可以更地对对类类的模式进行优化。第三，如果你的类类是密封的（sealed），Scala 编译器将检查你的模式匹配的完备性。提取器则没有这种完备性检查。\n\
  \n那么，对于模式匹配，你应该更倾向于哪种方法？这取决于情况。如果你为一个封闭应用程序编写代码，由于其简洁性和静态检查，类类通常是更优的。如果你以后决定更改层次结构，应用程序需要进行重构，但这通常不是问题。另一方面，如果你需要向未知的客户端暴露一个类型，提取器可能是更好的选择，因为它们维护了表示独立性。\n\
  \n幸运的是，你不需要立即决定。你始终可以从类类开始，然后在需要时更改为提取器。因为在 Scala 中，提取器的模式和针对类类的模式看起来完全一样，所以你客户端中的模式匹配将继续工作。\n\
  \n当然，也存在从一开始就很明确你的模式结构与数据表示类型不匹配的情况。本章讨论的邮箱地址就是这样一个例子。在这种情况下，提取器是唯一的选择。\n\n## 26.7\
  \ 正则表达式\n\n提取器的一个特别实用的领域是正则表达式。像 Java 一样，Scala 通过库提供正则表达式，但提取器让与它们的交互变得优雅得多。\n\n\
  #### 构建正则表达式\n\nScala 从 Java 继承了正则表达式语法，而 Java 又继承了 Perl 的大部分功能。我们假设你已经熟悉这种语法；如果没有，有很多入门教程，可以从\
  \ `java.util.regex.Pattern` 类的 Javadoc 文档开始。这里是一些作为复习的示例：\n\n| `ab?` | 一个 'a'，后面可能跟着一个\
  \ 'b'。 |\n| `\\d+` | 由 `\\d` 表示的一个或多个数字组成的数字。 |\n| `[a-dA-D]\\w*` | 以 a 到 d 之间的字母（大小写均可）开头的单词，后面跟着一个零或多个由\
  \ `\\w` 表示的“单词字符”序列。 |\n| `(-)?(\\d+)(\\.\\d*)?` | 由可选的负号、后面跟着一个或多个数字、可选地跟着点和零或多个数字组成的数字。\
  \ |\n\nScala 的正则表达式类位于 `scala.util.matching` 包中。\n\n```scala\nscala> import scala.util.matching.Regex\n\
  ```\n\n通过向 `Regex` 构造函数传递字符串来创建一个新的正则表达式值。例如：\n\n\n\n\n```scala\n scala> val Decimal\
  \ = new Regex(\"(-)?(\\\\d+)(\\\\.\\\\d*)?\")\n  Decimal: scala.util.matching.Regex\
  \ = (-)?(\\d+)(\\.\\d*)?\n```\n\n请注意，与之前给出的数字的正则表达式相比，上述字符串中的每个反斜杠都出现了两次。这是因为在 Java\
  \ 和 Scala 中，单反斜杠在字符串字面量中是转义字符，而不是显示在字符串中的普通字符。因此，你不需要 `\\'`，而是需要编写 `\\\\'` 才能在字符串中获得单个反斜杠。\n\
  \n如果一个正则表达式包含许多反斜杠，那么编写和阅读它可能会非常痛苦。Scala 的原始字符串（raw strings）提供了一种替代方案。正如你在第 5.2\
  \ 节：基本类型与操作中看到的，原始字符串是三引号之间的字符序列。原始字符串与普通字符串的区别在于，原始字符串中的所有字符都与其输入时完全相同。这包括反斜杠，它们不会被视为转义字符。因此，你可以用等效且更具读性的方式编写：\n\
  \n```scala\n scala> val Decimal = new Regex(\"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\")\n\
  \  Decimal: scala.util.matching.Regex = (-)?(\\d+)(\\.\\d*)?\n```\n\n如你从解释器的输出所示，`Decimal`\
  \ 生成的结果值与之前完全相同。\n\n在 Scala 中编写正则表达式的另一种、甚至更短的方法是这种：\n\n```scala\n scala> val Decimal\
  \ = \"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\".r\n  Decimal: scala.util.matching.Regex = (-)?(\\\
  d+)(\\.\\d*)?\n```\n\n换句话说，简单地在字符串后附加 `.r` 即可获得正则表达式。这是可能的因为 `StringOps` 类中有一个名为\
  \ `r` 的方法，它可以将字符串转换为正则表达式。该方法的定义如列表 26.7 所示：\n\n```scala\n package scala.runtime\n\
  \  import scala.util.matching.Regex\n\n  class StringOps(self: String) ... {\n \
  \   ...\n    def r = new Regex(self)\n  }\n```\n\n**列表 26.7 - `StringOps` 中如何定义\
  \ `r` 方法。**\n\n### 搜索正则表达式\n\n你可以使用几种不同的运算符在字符串中搜索正则表达式的出现情况：\n\n`regex findFirstIn\
  \ str`\n\n在字符串 `str` 中找到正则表达式 `regex` 的第一次出现，并以 `Option` 类型返回结果。\n\n`regex findAllIn\
  \ str`\n\n在字符串 `str` 中找到正则表达式 `regex` 的所有出现情况，并以 `Iterator` 返回结果。\n\n`regex findPrefixOf\
  \ str`\n\n在字符串 `str` 开头找到正则表达式 `regex` 的出现情况，并以 `Option` 类型返回结果。\n\n换句话说，简单的在字符串后附加\
  \ `.r` 即可获得正则表达式。这是可能的因为 `StringOps` 类中有一个名为 `r` 的方法，它可以将字符串转换为正则表达式。该方法的定义如列表 26.7\
