- "# Scala 编程指南（第四版）\n\n\n\n![](img/cover.jpg)\n\n![《Programming in Scala》第 4 版书籍封面](img/cover.jpg)\n\
  \n# 对《Programming in Scala》早期版本的赞誉\n\n`Programming in Scala` 也许是我读过的最好的编程书籍之一。我喜欢它的写作风格、简洁的文字以及详尽的解释。这本书似乎在我脑海中产生每一个问题时，它都能给出答案——它总是比我领先一步。作者们不仅仅是给你一些代码，并认为一切都是理所当然。他们给了你“干货”，让你真正理解底层正在发生什么。我非常喜欢这一点。\n\
  \n- Ken Egervari，首席软件架构师\n\n`Programming in Scala` 写得清晰、详尽且易于理解。书中全程贯穿了优秀的示例和实用的提示。它让我们的组织能够快速、高效地上手\
  \ `Scala` 语言。对于任何试图理解 `Scala` 语言的灵活性和优雅性的程序员来说，这本书都是都是极佳的。\n\n- Larry Morroni，Morroni\
  \ Technologies, Inc. 所有者\n\n`Programming in Scala` 一书是 `Scala` 语言的极佳教程。通过阅读这本书，逻辑非常顺畅，每一章都建立在之前章节描述的概念和示例之上。书中花心地深入解释了语言结构，并经常提供该语言与\
  \ `Java` 区别的示例。除了主语言外，还涵盖了容器（containers）和模型（actors）等库的内容。\n\n我发现这本书非常易于阅读，它可能是我最近读过的写得最好的技术书籍之一。我真的向任何想要了解更多\
  \ `Scala` 语言知识的程序员推荐这本书。\n\n- Matthew Todd\n\n`Programming in Scala` 作者们所付出的努力令我惊。这本书对于我所谓的“`Scala`\
  \ 平台”来说，是一份无价的指南：它是通往更好代码的工具，是可扩展软件设计与实现的永恒灵感。如果我在 2003 年共同设计和实现 2004 年雅典奥运会门户基础设施部分内容时，我的桌子上已经有了目前这种成熟状态的\
  \ `Scala` 和这本书该有多好！\n\n致所有读者：无论你们的编程背景如何，我觉得你们会发现在 `Scala` 中编程是解放性的，而这本书将是你们这段旅程中忠实的朋友。\n\
  \n- Christos KK Loverdos，软件顾问、研究员\n\n`Programming in Scala` 是对 `Scala` 的极佳深度介绍，同时也是一本极佳的参考书。我会说它在我书架上占据着显眼的位置，唯一的例外是我几乎去到哪里都身带着它。\n\
  \n- Brian Clapper，ArdenTex, Inc. 主席\n\n一本好书，写得很好，示例也深思熟虑。我会向资深程序员和新手都推荐这本书。\n\n\
  - Howard Lovatt\n\n`Programming in Scala` 这本书不仅关于*如何*（how），更重要的是关于*为什么*（why）要在这种新的编程语言中开发程序。书中在介绍结合面向对象编程和函数式编程的力量时，其务实的方法让读者对\
  \ `Scala` 到底是什么不再产生任何怀疑。\n\n- Dr. Ervin Varga ，EXPRO I.T. Consulting CEO/创始人\n\n\
  这是一本针对面向对象（OO）程序员的函数式编程极佳介绍。学习函数式编程（FP）是我的主要目标，但也发现了一些很棒的 `Scala` 惊喜，如案例类（case classes）和模式匹配（pattern\
  \ matching）。`Scala`是一门引人入胜的语言，这本书对其涵盖得很好。\n\n在语言介绍类书中，提供信息过多或过少总有一条微妙的界限。发现 `Programming\
  \ in Scala` 实现了完美的平衡。\n\n- Jeff Heon，程序员分析师\n\n我买了由 Odersky, Spoon 和 Venners 编写的\
  \ `Programming in Scala` 电子版，并立刻成为了粉丝。除了它包含了关于语言最全面的信息外，电子格式的几个关键特性也给我留下了深刻印象。我从未见过\
  \ PDF 中的链接用得这么好，不仅用于书签，还从目录和索引提供了活动链接。我不知道为什么更多作者不使用这个功能，因为这对读者来说真的是一种享受。另一个令我印象深刻的功能是通往论坛（“Discuss”）的链接，以及通过电子邮件向作者发送反馈（“Suggest”）的方法。反馈功能本身并不罕见，但在发送给作者的内容中简单包含页码，这对作者和读者来说都有价值。如果这个过程更繁琐，我提供的反馈就不会比现在多。\n\
  \n为了内容请阅读 `Programming in Scala`，但如果你读的是电子版，务必利用作者们用心心构建的数字功能！\n\n- Dianne Marsh，SRT\
  \ Solutions 创始人/软件顾问\n\n清晰易懂和技术完备性是任何编写良好的书籍的标志，我祝贺 Martin Odersky、Lex Spoon 和 Bill\
  \ Venners 做得非常出色！`Programming in Scala` 一书首先通过基本概念建立了坚实的基础，并将用户提升到中级水平及以上。这本书对于任何渴望学习\
  \ `Scala` 的人来说都是必买之。\n\n- Jagan Nambi，GMAC Financial Services 企业架构师\n\n`Programming\
  \ in Scala` 读起来是一种享受。这是那种写得很好的技术书籍之一，它们以极其简洁且优雅的方式对主题进行了深层且全面的覆盖。\n\n书的组织方式非常自然且符合逻辑。它既适合想要跟上当前趋势的好奇技术工作者，也适合那些寻求深度理解语言核心特征及其设计原理的专业人士。我强烈向所有对广义函数式编程感兴趣的人推荐这本书。对于\
  \ `Scala` 开发者来说，这本书是无条件的必读之。\n\n- Igor Khlystov，Greystone Inc. 软件架构师/首席程序员\n\n`Programming\
  \ in Scala` 流露出投入其中的巨大心血。这是那种以极其简洁且优雅的方式对主题进行深层且全面覆盖的、写得很好的技术书籍之一。\n\n书的组织方式非常自然且符合逻辑。它同样适合那些想要跟上当前趋势的好奇技术工作者，也适合寻求深度理解语言核心特征及其设计原理的专业人士。我强烈向所有对广义函数式编程感兴趣的人推荐这本书。对于\
  \ `Scala` 开发者来说，这本书是无条件的必读之。\n\n`Programming in Scala` 彻底流露出投入其中的巨大心血。我从未读过的任何教程类书籍能做到既入门又全面。大多数教程为了不“困惑”读者，会忽略掉对于当前讨论来说太深的方面。这留下了非常糟糕的，因为读者永远无法确定自己到底理解了哪些“魔法”部分。而这本书从未这样做，它从不认为一切都是理所当然：每个细节要么解释得充分，要么给出了后续解释的引用。事实上，书中有大量的交叉引用和索引，使得复杂的主题变得相对容易。\n\
  \n- Gerald Loeffler，Java 架构师\n\n由 Odersky, Spoon 和 Venners 编写的 `Programming in Scala`：在编程书籍稀缺的时代，这本针对中级程序员的优秀介绍脱颖而出。你可以在这里找到学习这门前景语言所需的一切。\n\
  \n- Christian Neukirchen\n\n# Programming in Scala，第四版\n\n![image images/artimaPress160.png](img/artimaPress160.png)\n\
