  \ 划分：\n| :--- | :--- |\n| `xs splitAt n` | 在指定位置拆分 `xs`，给出一个集合对 (`xs.take n, xs.drop\
  \ n`）。 |\n| `xs span p` | 根据谓词拆分 `xs`，给出一个集合对 (`xs.takeWhile p, xs.dropWhile p`）。\
