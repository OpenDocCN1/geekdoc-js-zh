  ```scala\n scala> val Decimal = new Regex(\"(-)?(\\\\d+)(\\\\.\\\\d*)?\")\n  Decimal:\
  \ scala.util.matching.Regex = (-)?(\\d+)(\\.\\d*)?\n```\n\n请注意，与之前给出的数字的正则表达式相比，上述字符串中的每个反斜杠都出现了两次。这是因为在\
  \ Java 和 Scala 中，单反斜杠在字符串字面量中是转义字符，而不是显示在字符串中的普通字符。因此，你不需要 `\\'`，而是需要编写 `\\\\'`\
  \ 才能在字符串中获得单个反斜杠。\n\n如果一个正则表达式包含许多反斜杠，那么编写和阅读它可能会非常痛苦。Scala 的原始字符串（raw strings）提供了一种替代方案。正如你在第\
  \ 5.2 节：基本类型与操作中看到的，原始字符串是三引号之间的字符序列。原始字符串与普通字符串的区别在于，原始字符串中的所有字符都与其输入时完全相同。这包括反斜杠，它们不会被视为转义字符。因此，你可以用等效且更具读性的方式编写：\n\
  \n```scala\n scala> val Decimal = new Regex(\"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\")\n\
  \  Decimal: scala.util.matching.Regex = (-)?(\\d+)(\\.\\d*)?\n```\n\n如你从解释器的输出所示，`Decimal`\
  \ 生成的结果值与之前完全相同。\n\n在 Scala 中编写正则表达式的另一种、甚至更短的方法是这种：\n\n```scala\n scala> val Decimal\
  \ = \"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\".r\n  Decimal: scala.util.matching.Regex = (-)?(\\\
  d+)(\\.\\d*)?\n```\n\n换句话说，简单的在字符串后附加 `.r` 即可获得正则表达式。这是可能的因为 `StringOps` 类中有一个名为\
  \ `r` 的方法，它可以将字符串转换为正则表达式。该方法的定义如列表 26.7 所示：\n\n```scala\n package scala.runtime\n\
  \  import scala.util.matching.Regex\n\n  class StringOps(self: String) ... {\n \
  \   ...\n    def r = new Regex(self)\n  }\n```\n\n**列表 26.7 - `StringOps` 中如何定义\
  \ `r` 方法。**\n\n### 搜索正则表达式\n\n你可以使用几种不同的运算符在字符串中搜索正则表达式的出现情况：\n\n`regex findFirstIn\
  \ str`\n\n在字符串 `str` 中找到正则表达式 `regex` 的第一次出现，并以 `Option` 类型返回结果。\n\n`regex findAllIn\
  \ str`\n\n在字符串 `str` 中找到正则表达式 `regex` 的所有出现情况，并以 `Iterator` 返回结果。\n\n`regex findPrefixOf\
  \ str`\n\n在字符串 `str` 开头找到正则表达式 `regex` 的出现情况，并以 `Option` 类型返回结果。\n\n\n\n\n在所有这些情况下，理论上编程语言都可能提供插入额外信息的方法。事实上，这些情况中的大多数在某些语言中得到了直接支持。然而，此类工具太多，一种语言无法直接支持所有这些工具。此外，所有这些信息都会被编译器忽略，因为编译器毕竟只是想让代码运行起来。\n\
  \n在这种情况下，Scala 的哲学是在核心语言中包含最少的、正交的支持，以便能够编写各种元编程工具。在这种情况下，这种最少的支持是一套注解系统。编译器只理解一种特性，即注解，但它不会给单个注解赋予任何含义。每个元编程工具都可以定义并使用它们自己的特定注解。\n\
  \n## 27.2 注解的语法\n\n注解的一个典型用法如下：\n\n```\n@deprecated_def bigMistake() = //...\n```\n\
  \n注解是 `@deprecated` 部分，它应用于整个 `bigMistake` 方法（此处未显示——这太让人尴尬了）。在这种情况下，该方法被标记为 `bigMistake`\
  \ 的作者希望你不使用的内容。也许 `bigMistake` 可能会在未来的代码版本中被完全移除。\n\n在上一个示例中，一个方法被标记为 `@deprecated`。注解也允许出现在其他地方。注解允许出现在任何类型的声明或中，包括\
  \ `vals`、`vars`、`defs`、`classes`、`objects`、`traits` 和 `types`。注解适用于随其后的整个声明或定义：\n\
  \n```\n@deprecated class QuickAndDirty {\n  //...\n}\n```\n\n注解也可以应用于表达式，例如用于模式匹配的\
  \ `@unchecked` 注解（参见第 15 章）。这样做只需在表达式后放置一个冒号（`:`），然后编写注解。在语法上，它看起来就像注解被用作一种类型一样：\n\
  \n```\n(e: @unchecked) match {\n  // 非穷尽的情况...\n}\n```\n\n最后，注解可以放在类型上。被注解的类型将在在本章稍后描述。\n\
  \n到目前为止所示的注解仅仅是一个 `@` 符号后面跟着一个注解类。这种简单的注解很常见且有用，但注解具有更丰富的通用形式：\n\n`@annot(exp[1],\
  \ exp[2], ...)`\n\n`annot` 指定注解的类。所有注解都必须包含这些。`exp` 部分是注解的参数。对于像 `@deprecated` 这样不需要参数的注解，你通常会省略括号，但如果你喜欢也可以写成\
  \ `@deprecated()`。对于带有参数的注解，将参数放在括号中，例如 `@serial(1234)`。\n\n你可以提供给注解的参数的确切形式取决于特定的注解类。大多数注解处理器只允许你提供立即常量，例如\
  \ `123` 或 `\"hello\"`。然而，编译器本身支持任意表达式，只要它们通过类型检查。某些注解类可以利用这一点，例如允许你引用作用域内的其他变量：\n\
  \n```\n@cool val normal = \"Hello\"\n@Than(normal) val fonzy = \"Heey\"\n```\n\n\
  在内部，Scala 将注解表示为构造函数调用。这意味着参数是有效的，你可以使用注解来向编译器或其他工具提供信息。\n\n## 27.3 标准注解\n\nScala\
  \ 包含了几个标准注解。它们用于广泛使用且值得独立语法的特性。\n\n#### 废弃 (Deprecation)\n\n并发编程与共享可变状态并不相处共融。因此，Scala\
  \ 并发支持的重点是 Futures 和最少的共享可变状态。详情请参见第 32 章。\n\n尽管如此，程序员有时想在并发程序中使用可变状态。`@volatile`\
  \ 注解在这种情况下很有帮助。它告诉编译器相关的变量将被多个线程使用。此类变量的实现方式使得对变量的读写较慢，但来自多个线程的访问行为更具预测性。\n\n####\
  \ volatile 字段 (Volatile fields)\n\n许多语言都包含了二进制*序列化框架。序列化框架帮助你将对象转换为字节流并*反之亦然*。如果你将对象保存到磁盘或通过网络发送它们，这非常有用。XML\
  \ 可以实现相同的目标（参见第 28 章），但它在速度、空间占用、灵活性和移植性方面有不同的权衡。\n\n\n\n\n\n首先，大多数类都是可序列化的，但并非所有都是。例如，套接字或\
  \ GUI 窗口句柄是无法序列化的。默认情况下，一个类不被认为是可序列化的。要使其可序列化，你必须混入 `scala.Serializable` 标记特征（trait），它在\
  \ `JVM` 上是 `java.io.Serializable` 的别名。\n\n`SerialVersionUID` 注解有助于处理可序列化类随时间变化的问题。你可以通过添加类似\
  \ `@SerialVersionUID(1234)` 的注解，为当前版本的类附加一个序列号，其中 `1234` 应该替换为你选择的序列号。框架应该将此数字存储在生成的字节流中。当你稍后重新加载该字节流并尝试将其转换为对象时，框架可以检查该类的当前版本号是否与字节流中的版本号相同。如果你想对类进行不兼容序列化的更改，则可以更改版本号。框架将会自动拒绝加载该类的旧实例。\n\
  \nScala 还为完全不应该被序列化的字段提供了 `@transient` 注解。如果你将一个字段标记为 `@transient`，那么即使周围的对象被序列化，框架也不应保存该字段。当对象被加载时，该字段将恢复为标记为\
  \ `@transient` 的字段对应类型的默认值。\n\n### 自动 get 和 set 方法\n\nScala 代码通常不需要为字段显式的 get 和\
  \ set 方法，因为 Scala 融合了字段访问和方法调用的语法。然而，某些特定特定的框架确实需要 get 和 set 方法。为此，Scala 提供了 `@scala.reflect.BeanProperty`\
  \ 注解。如果你在字段上添加此注解，编译器将自动为你生成 get 和 set 方法。如果你对命名为 `crazy` 的字段添加注解，则 get 方法将命名为 `getCrazy`，而\
  \ set 方法将命名为 `setCrazy`。\n\n生成的 get 和 set 方法只有在完成编译轮次完成后才可用。因此，你不能在与注解字段同时编译的代码中调用这些\
  \ get 和 set 方法。这在实践中通常不是问题，因为在 Scala 代码中你可以直接访问字段。此功能旨在支持期望常规 get 和 set 方法的框架，而且通常你不会同时编译框架和使用它的代码。\n\
  \n### Tailrec\n\n你通常会在需要尾递归的方法上添加 `@tailrec` 注解，例如是因为你预计否则它会进行非常深的递归。为了确保 Scala\
  \ 编译器确实对该方法执行第 8.9 节的尾递归优化，你可以在方法定义前添加 `@tailrec`。如果无法执行优化，你将得到一个警告以及原因的解释。\n\n\
  ### Unchecked\n\n`@unchecked` 注解由编译器在模式匹配期间解释。它告诉编译器，如果匹配表达式似乎遗漏了某些情况，请不要担心。详情参见第\
  \ 15.5 节。\n\n### Native 方法\n\n`@native` 注解告知编译器方法的实现是由运行时提供的，而不是在 Scala 代码中。编译器将在输出中切换相应的标记，由开发者负责使用如\
  \ Java Native Interface (JNI) 之类的机制提供实现。\n\n当使用 `@native` 注解时，必须提供方法体，但它不会被输出到结果。例如，这里是声明方法\
  \ `beginCountdown` 将由运行时提供的示例：\n\n```\n@native\ndef beginCountdown() = {}\n```\n\
  \n### 27.4 结论\n\n本章描述了你最可能需要了解的注解的平台无关方面。首先，它涵盖了注解的语法，因为使用注解比定义新注解常见得多。其次，它展示了如何使用标准\
  \ Scala 编译器支持的几个注解，包括 `@deprecated`、`@volatile`、`@serializable`、`@BeanProperty`、`@tailrec`\
  \ 和 `@unchecked`。\n\n第 31 章 提供了关于注解的 Java 特定信息。它涵盖了仅针对 Java 可用的注解、标准注解在针对 Java 时的额外含义、如何与基于\
  \ Java 的注解交互，以及如何使用基于 Java 的机制在 Scala 中定义和处理注解。\n\n## 第 28 章\n\n#### 使用 XML 操作\n\
  \n本章介绍了 Scala 对 XML 的支持。在讨论了通用半结构化数据后，它展示了 Scala 中操作 XML 的核心功能：如何使用 XML 字面量创建节点，如何将\
  \ XML 保存并加载到文件，以及如何使用查询方法和模式匹配拆解 XML 节点。本章仅是对 XML 性的简要介绍，但它展示了足够让你入门的内容。\n\n###\
  \ 28.1 半结构化数据\n\nXML 是一种半结构化数据。它比纯字符串更具结构化，因为它将数据内容组织成树。尽管如此，它比编程语言的对象结构化，因为它在标签之间允许自由形式的。[1]](#working-with-xml.html_footnotemain28-1)当你需要为了保存到文件或跨网络传输程序数据时，你不需要将结构化数据完全转换为字节，而是将其转换为半结构化数据。这样你就可以使用现有的库程序，留出时间来处理更重要的问题。\n\
  \n半结构化数据有很多形式，但 XML 在互联网上使用最广泛。大多数操作系统都有 XML 工具，大多数编程语言都有可用的 库。它的流行是自我加强的。针对 XML\
  \ 开发的工具和库越多，软件工程师越可能选择 XML 作为其格式的一部分。如果你编写在互联网上通信的软件，迟早需要与某些支持 XML 的服务交互。\n\n由于所有这些原因，Scala\
  \ 包含了处理 XML 的特殊支持。本章向你展示如何构造 XML、使用常规方法处理 XML 以及使用 Scala 的模式匹配处理 XML。除了这些基础知识，本章还将展示在\
  \ Scala 中使用 XML 的几种常见用法。\n\n### 28.2 XML 概述\n\nXML 由两个基本元素构建：文本和标签。[2]](#working-with-xml.html_footnotemain28-2)\
  \ 文本像通常一样是任何字符序列。标签写写如 `<pod>`，由一个小于号、一个字母数字标签和一个大于号组成。标签可以是开始标签或结束标签。结束标签看起来和开始标签完全一样，只是在标签之前有一个斜杠，例如：`</pod>`。\n\
  \n开始标签和结束标签必须匹配，就像括号一样。任何开始标签最终都必须有一个相同的结束标签。因此，以下内容是非法的：\n\n```\n// Illegal XML\n\
  One <pod>, two <pod>, three <pod> zoo\n```\n\n此外，任何两个匹配标签的内容本身必须是有效的 XML。你不能让两对匹配标签相互交叉：\n\
  \n```\n// 也是非法的\n<pod>Three <peas> in the </pod></peas>\n```\n\n然而，你可以这样写：\n\n```\n\
  <pod>Three <peas></peas> in the </pod>\n```\n\n\n\n\n\n由于标签需要以这种方式匹配，XML 被结构化为嵌套的\
  \ `elements`。每一对匹配的起始标签和结束标签形成一个元素，元素可以相互嵌套。在上面的示例中，`<pod>Three <peas></peas>` 到\
  \ `</pod>` 的整体是一个元素，而 `<peas></peas>` 是嵌套在其中的一个元素。\n\n这些都是基础知识。你还需要知道另外两点点：第一，起始标签后紧跟其匹配的结束标签有一种简写表示法。只需写一个标签，并在标签名称后加上一个斜杠即可。这样的标签统称为一个\
  \ `empty element`（空元素）。使用空元素，之前的示例也可以写成如下：\n\n```\n <pod>Three <peas/> in the </pod>\n\
  ```\n\n第二，起始标签可以附带 `attributes`（属性）。属性是一个用等号中间连接的键值对。属性名本身是纯文本、未结构化的文本，而值则被双引号（`\"\
  \"`）或单引号（`'`）包围。属性看起来如下：\n\n```\n <pod peas=\"3\" strings=\"true\"/>\n```\n\n###\
  \ 28.3 XML 字面量\n\nScala 允许你在任何表达式有效的地方以字面量的形式输入 XML。只需输入一个起始标签，然后继续编写 XML 内容。编译器将进入\
  \ XML 输入模式，并读取内容作为 XML，直到看到与你开始编写的起始标签匹配的结束标签：\n\n```\n scala> <a>\n          This\
  \ is some XML.\n          Here is a tag: <atag/>\n      </a>\n  res0: scala.xml.Elem\
  \ =\n  <a>\n  This is some XML.\n  Here is a tag: <atag/>\n  </a>\n```\n\n该表达式的结果类型为\
  \ `Elem`，意味着它是一个带有标签（`\"a\"`）和子节点（`This is some XML...,`, `etc` 等）的 XML 元素。其他一些重要的\
  \ XML 类还包括：\n\n* `Node` 类是所有 XML 节点类的抽象父类。\n* `Text` 类是仅持有文本的节点。例如，`<a>stuff</a>`\
  \ 中的 \"stuff\" 部分就是 `Text` 类。\n* `NodeSeq` 类持有节点序列。XML 库中的许多方法处理 `NodeSeqs` 的地方与你可能预期它们处理单个\
  \ `Nodes` 的地方。然而，你仍然可以在单个节点上使用此类方法，因为 `Node` 继承自 `NodeSeq`。这听起来很奇怪，但对 XML 来说效果很好。你可以将单个\
  \ `Node` 认为是一个单元素的 `NodeSeq`。\n\n你并不局限于逐字符地写出你想要的精确 XML。你可以通过使用大括号（`{}`）作为转义，在 XML\
  \ 字面量的中间评估 Scala 代码。这里有一个简单的示例：\n\n```\n scala> <a>{\"hello\" + \", world\"} </a>\n\
  \  res1: scala.xml.Elem = <a> hello, world </a>\n```\n\n大括号转义可以包含任意 Scala 内容，包括进一步的\
  \ XML 字面量。因此，随着嵌套层级的增加，你的代码可以在 XML 和普通 Scala 代码之间来回。这里有一个示例：\n\n```\n scala> val\
  \ yearMade = 1955\n  yearMade: Int = 1955\n\n  scala>   <a> { if (yearMade < 2000)\
  \ <old>{yearMade}</old>\n               else xml.NodeSeq.Empty }\n          </a>\n\
  \  res2: scala.xml.Elem =\n  <a> <old>1955</old>\n  </a>\n```\n\n如果大括号内的代码评估为 XML\
  \ 节点或 XML 节点序列，则这些节点将直接原样插入。在上面的示例中，如果 `yearMade` 小于 2000，它将被封装在 `<old>` 标签中并添加到\
  \ `<a>` 元素中。否则，什么都不添加。注意在上面的示例中，作为 XML 节点的“无物”用 `xml.NodeSeq.Empty` 表示。\n\n大括号转义内部的表达式不必评估为\
  \ XML 节点。它可以评估为任何 Scala 值。在这种情况下，结果被转换为字符串并作为文本节点插入：\n\n```\n scala> <a> {3 + 4}\
  \ </a>\n  res3: scala.xml.Elem = <a> 7 </a>\n```\n\n文本中的任何 `<`、`>` 和 `&` 字符在打印回节点时都会被转义：\n\
  \n```\n scala> <a>{\"</>potential security hole<a>\"} </a>\n  res4: scala.xml.Elem\
  \ = <a> &lt;/a&gt;potential security hole&lt;a&gt; </a>\n```\n\n相比之下，如果你使用低级字符串操作创建\
  \ XML，将会遇到如下陷阱：\n\n```\n scala> \"<a>\" + \"</</a>>potential security hole<<a>\"\
  \ + \"</a>\"\n  res5: String = <a></a>potential security hole</a>\n```\n\n这里发生的情况是，用户提供的字符串包含了了自己的\
  \ XML 标签，在本例中为 `</a>` 和 `<a>`。这种行为可能会给原始程序员带来一些意想不到的麻烦，因为它允许用户在 `<a>` 元素内部提供的空间之外影响生成的\
  \ XML 树。你可以通过始终使用 XML 字面量而不是字符串拼接来防止这一整类问题。\n\n### 28.4 序列化\n\n你现在已经足够了解 Scala 的\
  \ XML 支持，可以编写序列化器的第一部分：从内部数据结构到 XML 的转换。你需要的只是 XML 字面量和它们的大括号转义。\n\n例如，假设你正在实现一个数据库，用来跟踪你大量的复古可口可乐温度计收藏。你可能会编写以下内部类来存储目录中的条目：\n\
  \n```\nabstract class CCTherm {\n  val description: String\n  val yearMade: Int\n\
  \  val dateObtained: String\n  val bookPrice: Int      // 单位美分\n  val purchasePrice:\
  \ Int  // 单位美分\n  val condition: Int      // 1 到 10\n\n  override def toString =\
  \ description\n}\n```\n\n这是一个直接的、数据密集型的类，持有各种信息，例如温度计何时制造、你何时获得以及你支付了多少钱。\n\n要将此类的实例转换为\
  \ XML，只需添加一个使用 XML 字面量和大括号转义的 `toXML` 方法，如下所示：\n\n```\nabstract class CCTherm {\n\
  \  ...\n  def toXML =\n  <a>\n    {description}</description>\n    {yearMade}</yearMade>\n\
  \    {dateObtained}</dateObtained>\n    {bookPrice}</bookPrice>\n    {purchasePrice}</purchasePrice>\n\
  \    {condition}</condition>\n  </a>\n}\n```\n\n以下是该方法的演示：\n\n```\n scala> val therm\
  \ = new CCTherm {\n  val description = \"hot dog #5\"\n  val yearMade = 1952\n \
  \ val dateObtained = \"March 14, 2006\"\n  val bookPrice = 199\n  val purchasePrice\
  \ = 500\n  val condition = 9\n}\ntherm: CCTherm\n\nscala> therm.toXML\nres6: scala.xml.Elem\
  \ =\n<a>\n  <description>hot dog #5</description>\n  <yearMade>1952</yearMade>\n\
  \  <dateObtained>March 14, 2006</dateObtained>\n  <bookPrice>199</bookPrice>\n \
  \ <purchasePrice>500</purchasePrice>\n  <condition>9</condition>\n</a>\n```\n\n\
  #### 注意\n\n在上面的示例中 `new CCTherm` 表达式即使 `CCTherm` 是一个抽象类也有效，因为这种语法实际上实例化了 `CCTherm`\
  \ 的匿名子类。匿名类在第 20.5 节 中描述过。\n\n顺便说，如果你想将大括号（`{` 或 `}`）作为 XML 文本包含，而不是使用它们转义到 Scala\
  \ 代码，只需连续写两个大括号：\n\n```\n scala> <a>{{brace yourself!}}}} </a>\nres7: scala.xml.Elem\
  \ = <a> {{brace yourself!}} </a>\n```\n\n### 28.5 拆解 XML\n\n在 XML 类提供的许多方法中，有三个是你特别应该注意的。它们允许你拆解\
  \ XML，而无需过多考虑 XML 在 Scala 中表示的精确方式。这些方法基于用于处理 XML 的 XPath 语言。与 Scala 的常见做法，你可以直接在\
  \ Scala 代码中编写它们，而不需要调用外部工具。\n\n**提取文本**。通过在任何获取的 XML 节点上调用 `text` 方法，你可以获取该节点内的所有文本，减去任何元素标签：\n\
  \n```\n scala> <a>Sounds <tag/> good</a>.text\n  res8: String = Sounds  good\n```\n\
  \n任何编码的字符都会自动解码：\n\n\n\n\n\n```\nscala> <a> input ---> output </a>.text\n  res9:\
  \ String = \" input ---> output \"\n```\n\n### 提取子元素\n\n如果你想通过标签名查找子元素，只需带上标签名调用\
  \ `\\` 即可：\n\n```\nscala> <a><b><c>hello</c></body></a> \\ \"b\"\n  res10: scala.xml.NodeSeq\
  \ = NodeSeq(<b><c>hello</c></b>)\n```\n\n 深度搜索\n\n你可以通过使用 `\\\\` 代替 `\\` 运算符来执行“深度搜索”，并遍历子子元素，*等等等*：\n\
  \n```\nscala>  <a><b><c>hello</c></body></a> \\ \"c\"\n  res11: scala.xml.NodeSeq\
  \ = NodeSeq()\n\n  scala>  <a><b><c>hello</c></body></a> \\\\ \"c\"\n  res12: scala.xml.NodeSeq\
  \ = NodeSeq(<c>hello</c>)\n\n  scala>  <a><b><c>hello</c></body></a> \\ \"a\"\n\
  \  res13: scala.xml.NodeSeq = NodeSeq()\n\n  scala>  <a><b><c>hello</c></body></a>\
  \ \\\\ \"a\"\n  res14: scala.xml.NodeSeq = \n  NodeSeq(<a><b><c>hello</c></body></a>)\n\
  ```\n\n#### 注意事项\n\nScala 使用 `\\` 和 `\\\\` 代替 XPath 的 `/` 和 `//`。这是因为 `//` 在 Scala\
  \ 中是注释的开头！因此必须使用其他符号，而使用另一种类型的斜杠效果良好。\n\n### 提取属性\n\n你可以使用相同的 `\\` 和 `\\\\` 方法提取标签属性。只需在属性名之前加一个\
  \ @ 符号（``）即可：\n\n```\nscala> val joe = <employee\n          name=\"Joe\"\n     \
  \     rank=\"code monkey\"\n          serial=\"123\"/>\n  joe: scala.xml.Elem =\
  \ <employee name=\"Joe\" rank=\"code monkey\"\n  serial=\"123\"/>\n\n  scala>  joe\
  \ \\ \"@name\"\n  res15: scala.xml.NodeSeq = Joe\n\n  scala>  joe \\ \"@serial\"\
  \n  res16: scala.xml.NodeSeq = 123\n```\n\n### 28.6 反序列化\n\n使用之前拆解 XML 的方法，你现在可以编写序列化器的逆操作——一个将\
  \ XML 回到你内部数据结构的解析器。例如，你可以使用以下代码解析回 `CCTherm` 实例：\n\n```scala\ndef fromXML(node:\
  \ scala.xml.Node): CCTherm =\n  new CCTherm {\n    val description   = (node \\\
  \ \"description\").text\n    val yearMade      = (node \\ \"yearMade\").text.toInt\n\
  \    val dateObtained  = (node \\ \"dateObtained\").text\n    val bookPrice    \
  \  = (node \\ \"bookPrice\").text.toInt\n    val purchasePrice = (node \\ \"purchasePrice\"\
  ).text.toInt\n    val condition      = (node \\ \"condition\").text.toInt\n  }\n\
  ```\n\n此代码遍历名为 `node` 的输入 XML 节点，以找到指定 `CCTherm` 所需的六个数据。文本数据通过 `.text` 提取并保持原样。以下是该方法的实际运行示例：\n\
  \n```\nscala> val node = therm.toXML\n  node: scala.xml.Elem =\n  <cctherm>\n  \
  \                  <description>hot dog #5</description>\n                    <yearMade>1952</yearMade>\n\
  \                    <dateObtained>March 14, 2006</dateObtained>\n             \
  \       <bookPrice>2199</bookPrice>\n                    <purchasePrice>500</purchasePrice>\n\
  \                    <condition>9</condition>\n  </cctherm>\n\n  scala> fromXML(node)\n\
  \  res17: CCTherm = hot dog #5\n```\n\n### 28.7 加载与保存\n\n写入数据还有最后一部分：XML 与流之间的转换。最后一部分最简单，因为有库例程可以为你完成。要将\
  \ XML 转换为字符串，只需要 `toString`。要将 XML 转换为文件，可以使用 `XML.save(\"therm.xml\", node)`。运行命令后，生成的文件如下：\n\
  \n```xml\n<?xml version='1.0' encoding='UTF-8'?>\n<cctherm>\n  <description>hot\
  \ dog #5</description>\n  <yearMade>1952</yearMade>\n  <dateObtained>March 14, 2006</dateObtained>\n\
  \  <bookPrice>2199</bookPrice>\n  <purchasePrice>500</purchasePrice>\n  <condition>9</condition>\n\
  </cctherm>\n```\n\n\n\n\n\n```\nscala> proc(<a>a <em>red</em> apple</a>)\n  res23:\
  \ String = 'It\\'s an a: ArrayBuffer(a, <em>red</em>,  \n  apple)'\n  scala> proc(<a/>)\n\
  \  res24: String = 'It\\'s an a: WrappedArray()'\n```\n\n最后一个提示是，请注意 XML 模式与 `for`\
  \ 表达式配合得非常好，它们可以用于遍历 XML 树的部分并同时忽略其他部分。例如，假设你希望跳过以下 XML 结构中记录之间的空白：\n\n```\n val\
  \ catalog =\n  <catalog>\n    <cctherm>\n      <description>hot dog #5</description>\n\
  \      <yearMade>1952</yearMade>\n      <dateObtained>March 14, 2006</dateObtained>\n\
  \      <bookPrice>2199</bookPrice>\n      <purchasePrice>500</purchasePrice>\n \
  \     <condition>9</condition>\n    </cctherm>\n    <cctherm>\n      <description>Sprite\
  \ Boy</description>\n      <yearMade>1964</yearMade>\n      <dateObtained>April\
  \ 28, 2003</dateObtained>\n      <bookPrice>1695</bookPrice>\n      <purchasePrice>595</purchasePrice>\n\
  \      <condition>5</condition>\n    </cctherm>\n  </catalog>\n```\n\n从视觉上看，`<catalog>`\
  \ 元素内部有两个节点。但实际上，有五个。在两个元素之前、之后和之间存在空白！如果你不考虑这些空白，可能会像下面错误地处理温度计记录：\n\n```\n catalog\
  \ match {\n  case <catalog>{therms @ _*}</catalog> =>\n    for (therm <- therms)\n\
  \      println(\"processing: \" + \n             (therm \\ \"description\").text)\n\
  }\n```\n\n```\n processing: \n processing: hot dog #5\n processing: \n processing:\
  \ Sprite Boy\n processing:\n```\n\n注意所有尝试将空白当成真实的温度计记录进行处理的行。你真正想做的是忽略空白，仅处理`<cctherm>`\
  \ 元素内部的子节点。你可以使用模式 `<cctherm>{_*}</cctherm>` 来描述这个子集，并限制 `for` 表达式迭代匹配该模式的项：\n\n\
  ```\n catalog match {\n  case <catalog>{therms @ _*}</catalog> =>\n    for (therm\
  \ @ <cctherm>{_*}</cctherm> <- therms)\n      println(\"processing: \" + \n    \
  \         (therm \\ \"description\").text)\n}\n```\n\n```\n processing: hot dog\
  \ #5\n processing: Sprite Boy\n```\n\n## 28.9 结论\n\n这一章仅仅触及了使用 XML 能做的事情的一角。还有许多其他扩展、库和工具你可以学习，有些是为\
  \ Scala 定制的，有些是为 Java 设计的但在 Scala 中可以使用，还有一些与语言无关的。你从这一章中应该学到的是如何使用半结构化数据进行交换，以及如何通过\
  \ Scala 的 XML 支持访问半结构化数据。\n\n* * *\n\n#### 第 28 章脚注：\n\n[1] XML 有相应的类型系统，例如 XML\
  \ Schemas，但它们超出了本书的范围。\n\n[2] 完整的故事更复杂，但这些足够让你有效地使用 XML 了。\n\n## 第 29 章\n\n# 使用对象进行模块化编程\n\
  \n在第 1 章 中，我们声称 Scala 作为一种可扩展语言的特点是，你可以使用相同的技术来构建小型和大型程序。到目前为止，本书主要关注*小规模编程*（programming\
  \ in the small）：设计并实现较小的程序部分，通过这些部分构建出更大的程序[[1]](#modular-programming-using-objects.html_footnotemain29-1)。故事的另一面是*大规模编程*（programming\
  \ in the large）：将较小的部分组织并组合成更大的程序、应用程序或系统。我们在讨论第 13 章 中的包和访问修饰符时提到过这个主题。简而言之，包和访问修饰符允许你使用包作为*模块*（modules）来组织大型程序，其中模块是一个具有良好定义接口和隐藏实现的“较小的程序部分”。\n\
  \n虽然将程序划分为包已经很有帮助，但它有局限性，因为它没有提供抽象的方法。你无法在同一个程序内以两种不同的方式配置包，也无法在包之间进行继承。包始终包含一份精确的内容列表，该列表在你更改代码之前是固定的。\n\
  \n在本章中，我们将讨论如何使用 Scala 的面向对象特性使程序更具模块化。我们首先展示如何使用一个简单的单例对象作为模块。然后，我们将解释如何使用 trait\
  \ 和类作为模块的抽象。这些抽象可以重新配置为多个模块，甚至在同一个程序中配置多次。最后，我们将展示一种使用 trait 将一个模块拆分到多个文件的实用技术。\n\
  \n## 29.1 问题\n\n随着程序规模的增长，以模块化的方式组织它变得愈发重要。首先，能够单独编译组成系统的不同模块有助于不同的团队独立工作。此外，能够拔掉一个模块的实现并插入另一个是有用的，因为这允许在不同的场景中使用不同的系统配置，例如开发者桌面上的单元测试、集成测试、阶段（staging）和部署。\n\
  \n例如，你可能有一个使用数据库和消息服务的应用程序。在编写代码时，你可能想在桌面上运行单元测试，使用数据库和消息服务的模拟版本，这些模拟版本能够充分模拟服务以便测试，而无需跨网络与共享资源通信。在集成测试期间，你可能想使用模拟的消息服务但使用真实的开发者数据库。在阶段测试期间，特别是在部署期间，你的组织可能希望同时使用数据库和消息服务的真实版本。\n\
  \n任何旨在促进这种模块化的技术都需要提供几个要素。首先，应该有一个能够提供良好的接口与实现分离的模块构造结构。其次，应该有一种方法用具有相同接口的模块替换另一个，而无需更改或重新编译依赖于被替换模块的模块。最后，应该有一种方法将模块连接在一起。这种连接任务可以被视为对系统的*配置*（configuring）。\n\
  \n解决此问题的一种方法是*依赖注入*（dependency injection），这种技术在 Java 平台上由 Spring 和 Guice 等框架支持，这些框架在企业级\
  \ Java 社区非常流行[[2]](#modular-programming-using-objects.html_footnotemain29-2)。例如，Spring\
  \ 本质上允许你将模块的接口表示为 Java 接口，并将模块的表示为 Java 类。你可以指定模块之间的依赖关系，并通过外部 XML 配置文件“连接”整个应用程序。虽然你可以在\
  \ Scala 中使用 Spring，从而利用 Spring 的方法来实现 Scala 程序的系统级模块化，但在 Scala 中，你通过语言本身获得了一些替代方案。在本章的剩余部分中，我们将展示如何使用对象作为模块，在不使用外部框架的情况下实现所需的“大规模””模块化。\n\
  \n### 29.2 一个食谱应用程序\n\n\n\n\n想象你正在构建一个允许用户管理食谱的企业级 Web 应用。你希望将软件分为若干层，包括`domain\
  \ layer`（领域层）和`application layer`（应用层）。在领域层中，你将定义`domain objects`（领域对象），它们将捕业务概念和规则，并封装持久化到外部关系型数据库的状态。在应用层中，你将提供一个按照应用程序向客户端（包括用户界面层）提供的服务组织的\
  \ API。应用层将通过协调任务并将工作委托给领域层对象来实现这些服务。\n\n你希望能够在这些层级中插入某些对象的真实版本或模拟（mock）版本，以便更轻松地为应用程序编写单元测试。为了实现这一目标，可以将想要\
  \ mock 的对象视为模块。在 Scala 中，对象不需要是“微小”的东西，也不需要为像模块这样的“大”东西使用其他类型的构造结构。Scala 作为可扩展语言的特性之一，就是对于小型和大型结构都使用了相同的构造结构。\n\
  \n例如，由于你在领域层中想要 mock 的“东西”之一是代表关系型数据库的对象，你将其作为其中一个模块。在应用层中，你把一个“数据库浏览器”对象视为一个模块。数据库将保存一个人收集的所有食谱。浏览器将帮助搜索和浏览该数据库，例如，找到包含你手头食材的每份食谱。\n\
  \n首先要做的工作是对食物和食谱进行建模。为了保持简单，食物只需有一个名称，如列表 29.1 所示。食谱将有一个名称、一份配料列表和一些指令，如列表 29.2\
  \ 所示。\n\n```scala\n package org.stairwaybook.recipe\n\n  abstract class Food(val\
  \ name: String) {\n    override def toString = name\n  }\n```\n\n#### 列表 29.1 -\
  \ 一个简单的 Food 实体类。\n\n```scala\n package org.stairwaybook.recipe\n\n  class Recipe(\n\
  \      val name: String,\n      val ingredients: List[Food],\n      val instructions:\
  \ String\n  ) {\n    override def toString = name\n  }\n```\n\n#### 列表 29.2 - 简单的\
  \ Recipe 实体类。\n\n列表 29.1 和 29.2 显示的 `Food` 和 `Recipe` 类代表将持久化到数据库中的`entities`（实体）。列表\
  \ 29.3 显示了这些类的某些单例实例，可以在编写测试时可以使用。\n\n```scala\n package org.stairwaybook.recipe\n\
  \n  object Apple extends Food(\"Apple\")\n  object Orange extends Food(\"Orange\"\
  )\n  object Cream extends Food(\"Cream\")\n  object Sugar extends Food(\"Sugar\"\
  )\n\n  object FruitSalad extends Recipe(\n      \"fruit salad\",\n      List(Apple,\
  \ Orange, Cream, Sugar),\n      \"Stir it all together.\"\n  )\n```\n\n#### 列表 29.3\
  \ - 用于测试的 Food 和 Recipe 示例。\n\n```scala\n package org.stairwaybook.recipe\n\n  object\
  \ SimpleDatabase {\n    def allFoods = List(Apple, Orange, Cream, Sugar)\n\n   \
  \ def foodNamed(name: String): Option[Food] =\n      allFoods.find(_.name == name)\n\
  \n    def allRecipes: List[Recipe] = List(FruitSalad)\n  }\n\n  object SimpleBrowser\
  \ {\n    def recipesUsing(food: Food) =\n      SimpleDatabase.allRecipes.filter(recipe\
  \ =>\n        recipe.ingredients.contains(food))\n  }\n```\n\n#### 列表 29.4 - 数据库和浏览器模块。\n\
  \nScala 使用对象作为模块，因此你可以通过创建两个单例对象来作为测试期间数据库和浏览器模块的模拟实现，从而开始程序的模块化。由于它是 mock 的，数据库模块由简单的内存列表支持。这些对象的实现显示在列表\
  \ 29.4 中。你可以按照以下方式使用此数据库和浏览器：\n\n```scala\n scala> val apple = SimpleDatabase.foodNamed(\"\
  Apple\").get\n  apple: Food = Apple\n\n  scala> SimpleBrowser.recipesUsing(apple)\n\
  \  res0: List[Recipe] = List(fruit salad)\n```\n\n为了让事情变得更有趣一点，假设数据库将食物分类。要实现这一点，你可以添加一个\
  \ `FoodCategory` 类和数据库中所有类别的列表，如列表 29.5 所示。注意在这个示例中，`private` 关键字（对于实现类非常有用）对于实现模块也同样有用。标记为\
  \ `private` 的项是模块实现的一部分，因此在不影响其他模块的情况下，它们特别容易更改。\n\n到此为止，可以添加更多功能，但你已经理解了思路。程序可以被分为单例对象，你可以将它们视为模块。这并不是什么大新闻，但当你考虑抽象（我们将在介绍介绍）时，它会变得非常有用。\n\
  \n```scala\n package org.stairwaybook.recipe\n\n  object SimpleDatabase {\n    def\
  \ allFoods = List(Apple, Orange, Cream, Sugar)\n\n    def foodNamed(name: String):\
  \ Option[Food] =\n      allFoods.find(_.name == name)\n\n    def allRecipes: List[Recipe]\
  \ = List(FruitSalad)\n\n    case class FoodCategory(name: String, foods: List[Food])\n\
  \n    private var categories = List(\n      FoodCategory(\"fruits\", List(Apple,\
  \ Orange)),\n      FoodCategory(\"misc\", List(Cream, Sugar))\n    )\n\n    def\
  \ allCategories = categories\n  }\n\n  object SimpleBrowser {\n    def recipesUsing(food:\
  \ Food) =\n      SimpleDatabase.allRecipes.filter(recipe =>\n        recipe.ingredients.contains(food))\n\
  \n    def displayCategory(category: SimpleDatabase.FoodCategory) = {\n      println(category)\n\
  \    }\n  }\n```\n\n#### 列表 29.5 - 添加了类别的数据库和浏览器模块。\n\n### 29.3 抽象\n\n尽管目前为止的示例成功地将应用程序分为独立的数据库和浏览器模块，但该设计还不非常“模块化”。问题在于，浏览器模块到数据库模块之间本质上存在一个“硬链接”：\n\
  \n```\nSimpleDatabase.allRecipes.filter(recipe => ...)\n```\n\n由于 `SimpleBrowser`\
  \ 模块通过名称提到了 `SimpleDatabase` 模块，你无法在不修改和重新编译浏览器模块的情况下插入数据库模块的不同实现。此外，虽然 `SimpleDatabase`\
  \ 模块到 `SimpleBrowser` 模块之间没有硬链接，但没有明确的方法来启用用户界面层（例如）被配置为使用浏览器模块的不同实现。\n\n然而，在使这些模块更具插拔性时，避免代码重复是重要的，因为同一个模块的不同实现很可能共享许多代码。例如，假设你想让同一个代码库支持多个食谱数据库，并且希望为这些数据库中的每一个创建一个独立的浏览器。你希望为每个实例复用浏览器代码，因为浏览器唯一的区别在于它们引用的数据库不同。除了数据库实现外，其余代码可以逐字不差地复用。如何安排程序以减少重复代码？如何使代码具有可重新配置性，以便使用任何数据库实现对其进行配置？\n\
  \n\n\n答案是一个熟悉的答案：如果一个模块是一个对象，那么模块的模板就是一个类。就像类描述了所有实例的共同部分一样，类可以描述模块中对于所有可能的配置都共有的部分。\n\
  \n```scala\n abstract class Browser {\n    val database: Database\n\n    def recipesUsing(food:\
  \ Food) =\n      database.allRecipes.filter(recipe =>\n        recipe.ingredients.contains(food))\n\
  \n    def displayCategory(category: database.FoodCategory) = { \n      println(category)\n\
  \    }\n  }\n```\n\n#### 列表 29.6 - 一个带有抽象数据库 val 的 Browser 类。\n\n因此，浏览器的定义变成了类而不是对象，要使用的数据库被指定为该类的抽象成员，如\
  \ 列表 29.6 所示。数据库也变成了一个类，尽可能包含了所有数据库之间共有的部分，并声明了数据库必须定义的缺失部分。在这种情况下，所有数据库模块必须为 `allFoods`、`allRecipes`\
  \ 和 `allCategories` 定义方法，但由于它们可以使用任意定义，这些方法必须在 `Database` 类中留为抽象。相比之下，`foodNamed`\
  \ 方法可以在抽象的 `Database` 类中定义，如 列表 29.7 所示。\n\n```scala\n abstract class Database {\n\
  \    def allFoods: List[Food]\n    def allRecipes: List[Recipe]\n\n    def foodNamed(name:\
  \ String) =\n      allFoods.find(f => f.name == name)\n\n    case class FoodCategory(name:\
  \ String, foods: List[Food])\n    def allCategories: List[FoodCategory]\n  }\n```\n\
  \n#### 列表 29.7 - 一个带有抽象方法的 Database 类。\n\n`SimpleDatabase` 对象必须更新为继承抽象的 `Database`\
  \ 类，如 列表 29.8 所示。\n\n```scala\n object SimpleDatabase extends Database {\n    def\
  \ allFoods = List(Apple, Orange, Cream, Sugar)\n\n    def allRecipes: List[Recipe]\
  \ = List(FruitSalad)\n\n    private var categories = List(\n      FoodCategory(\"\
  fruits\", List(Apple, Orange)),\n      FoodCategory(\"misc\", List(Cream, Sugar)))\n\
  \n    def allCategories = categories\n  }\n```\n\n#### 列表 29.8 - 作为 Database 子类的\
  \ SimpleDatabase 对象。\n\n然后，通过实例化 `Browser` 类并指定要使用哪个数据库，创建一个特定的浏览器模块，如 列表 29.9 所示。\n\
  \n```scala\n object SimpleBrowser extends Browser {\n    val database = SimpleDatabase\n\
  \  }\n```\n\n#### 列表 29.9 - 作为 Browser 子类的 SimpleBrowser 对象。\n\n你可以像以前一样使用这些更具插拔性的模块：\n\
  \n```scala\nscala> val apple = SimpleDatabase.foodNamed(\"Apple\").get\n  apple:\
  \ Food = Apple\n\n  scala> SimpleBrowser.recipesUsing(apple)\n  res1: List[Recipe]\
  \ = List(fruit salad)\n```\n\n但现在，你可以创建第二个 mock 数据库，并与它使用同一个浏览器类，如 列表 29.10 所示：\n\
  \n```scala\n object StudentDatabase extends Database {\n    object FrozenFood extends\
  \ Food(\"FrozenFood\")\n\n    object HeatItUp extends Recipe(\n      \"heat it up\"\
  ,\n      List(FrozenFood),\n      \"Microwave the 'food' for 10 minutes.\")\n\n\
  \    def allFoods = List(FrozenFood)\n    def allRecipes = List(HeatItUp)\n    def\
  \ allCategories = List(\n      FoodCategory(\"edible\", List(FrozenFood)))\n  }\n\
  \n  object StudentBrowser extends Browser {\n    val database = StudentDatabase\n\
  \  }\n```\n\n#### 列表 29.10 - 一个学生数据库和浏览器。\n\n### 29.4 将模块拆分为 traits\n\n通常情况下，一个模块太大，无法舒适地放入单个文件中。当发生这种情况时，你可以使用\
  \ traits 将模块拆分到单独的文件。例如，假设你想将分类代码从主 `Database` 文件移动出来并放入它自己的文件中。你可以为这些代码创建一个 trait，如（列表\
  \ 29.11）所示。\n\n```scala\n trait FoodCategories {\n    case class FoodCategory(name:\
  \ String, foods: List[Food])\n    def allCategories: List[FoodCategory]\n  }\n```\n\
  \n#### 列表 29.11 - 一个用于食品类别的 trait。\n\n现在，`Database` 类可以混入 `FoodCategories` trait，而不是自己定义\
  \ `FoodCategory` 和 `allCategories`，如 列表 29.12 所示：\n\n```scala\n abstract class Database\
  \ extends FoodCategories {\n    def allFoods: List[Food]\n    def allRecipes: List[Recipe]\n\
  \    def foodNamed(name: String) =\n      allFoods.find(f => f.name == name)\n \
  \ }\n```\n\n#### 列表 29.12 - 一个混入 FoodCategories trait 的 Database 类。\n\n你可能会尝试将 `SimpleDatabase`\
  \ 拆分为两个 trait，一个用于食物，一个用于食谱。这将允许你如 列表 29.13 所示定义 `SimpleDatabase`：\n\n```scala\n\
  \ object SimpleDatabase extends Database\n      with SimpleFoods with SimpleRecipes\n\
  ```\n\n#### 列表 29.13 - 一个完全由 mixins 组成的 SimpleDatabase 对象。\n\n`SimpleFoods` trait\
  \ 看起来如 列表 29.14 所示：\n\n```scala\n trait SimpleFoods {\n    object Pear extends Food(\"\
  Pear\")\n    def allFoods = List(Apple, Pear)\n    def allCategories = Nil\n  }\n\
  ```\n\n#### 列表 29.14 - 一个 SimpleFoods trait。\n\n到目前为止一切顺利，但遗憾的是，如果你尝试这样定义 `SimpleRecipes`，就会出现问题：\n\
  \n```scala\n trait SimpleRecipes {\n  object FruitSalad extends Recipe(\n    \"\
  fruit salad\",\n    List(Apple, Pear),\n    \"Mix it together.\"\n  )\n  def allRecipes\
  \ = List(FruitSalad)\n}\n```\n\n问题在于 `Pear` 位于与使用它的不同的 trait 中，因此它不在作用域。编译器不知道 `SimpleRecipes`\
  \ 只会与 `SimpleFoods` 混入。\n\n然而，有一种方法可以告诉编译器。Scala 提供了 self type 来专门处理这种情况。从技术上讲，self\
  \ type 是每出现 `this` 的假设类型。从实践上讲，self type 指定了混入该 trait 的具体类的要求。如果你有一个 trait 只与另一个\
  \ trait 或多个 traits 混入，那么你可以指定假设这些其他 trait。在当前情况下，指定 `SimpleFoods` 的 self type 就足够了，如\
  \ 列表 29.15 所示：\n\n```scala\n trait SimpleRecipes {\n  this: SimpleFoods =>\n\n \
  \ object FruitSalad extends Recipe(\n    \"fruit salad\",\n    List(Apple, Pear),\n\
  \    \"Mix it together.\"\n  )\n  def allRecipes = List(FruitSalad)\n}\n```\n\n\
  #### 列表 29.15 - 一个带有 self type 的 SimpleRecipes trait。\n\n有了新的 self type，`Pear` 现在可用。隐式地，对\
  \ `Pear` 的引用被视为 `this.Pear`。这是安全的，因为任何混入 `SimpleRecipes` 的具体类都是 `SimpleFoods` 的子类，这意味着\
  \ `Pear` 将是一个成员。抽象子类和 trait 不需要遵循这一限制，但由于它们无法通过 `new` 实例化，因此不必担心 `this.Pear` 引用失败。\n\
  \n### 29.5 运行时链接\n\nScala 模块可以在运行时链接在一起，你可以根据运行时计算来决定哪些模块将链接到哪些模块。例如，列表 29.16 显示了一个小型程序，它在运行时选择一个数据库，然后打印出其中所有的苹果食谱：\n\
  \n\n\n\n\n```\n object GotApples {\n    def main(args: Array[String]) = {\n    \
  \  val db: Database =\n        if(args(0) == \"student\")\n          StudentDatabase\n\
  \        else\n          SimpleDatabase\n\n      object browser extends Browser\
  \ {\n        val database = db\n      }\n\n      val apple = SimpleDatabase.foodNamed(\"\
  Apple\").get\n\n      for(recipe <- browser.recipesUsing(apple))\n        println(recipe)\n\
  \    } \n  }\n```\n\n##### 列表 29.16 - 一个动态选择模块实现的应用程序。\n\n现在，如果你使用简单的数据库，你会发现一个水果沙拉的食谱。如果你使用学生数据库，你会发现没有任何使用苹果的食谱：\n\
  \n```\n $ scala GotApples simple\n  fruit salad\n  $ scala GotApples student\n \
  \ $\n```\n\n### 使用 Scala 代码进行配置\n\n你可能会 wonder，这是否又回到了本章原始示例中的硬链接问题，因为在列表 29.16\
  \ 中所示的 `GotApples` 对象包含了对 `StudentDatabase` 和 `SimpleDatabase` 的硬链接。区别在于，这里的硬链接被局部化在一个可以替换的文件中。\n\
  \n每个模块化应用程序都需要某种方式在特定情况下指定要使用的实际模块实现。这种“配置”应用程序的行为从定义上说涉及对具体模块实现的命名。例如，在 Spring\
  \ 应用程序中，你通过在外部 XML 文件中命名实现类来进行配置。在 Scala 中，你可以通过 Scala 代码本身进行配置。使用 Scala 源码而非 XML\
  \ 进行配置的一个优势是，在通过 Scala 编译器运行你的配置文件时，应该在实际使用之前就发现其中的任何拼写错误。\n\n### 29.6 跟踪模块实例\n\n\
  尽管使用了相同的代码，上一节中创建的不同的 `browser` 和 `database` 模块实际上是相互独立的模块。这意味着每个模块都有自己的内容，包括任何嵌套类。例如，`SimpleDatabase`\
  \ 中的 `FoodCategory` 与 `StudentDatabase` 中的 `FoodCategory` 是不同的类！\n\n```\n scala>\
  \ val category = StudentDatabase.allCategories.head\n  category: StudentDatabase.FoodCategory\
  \ = \n  FoodCategory(edible,List(FrozenFood))\n\n  scala> SimpleBrowser.displayCategory(category)\n\
  \                                       ^\n  error: type mismatch;\n  found    :\
  \ StudentDatabase.FoodCategory\n  required: SimpleBrowser.database.FoodCategory\
  \ \n```\n\n如果你倾向于让 `FoodCategory` 都是相同的，可以通过将 `FoodCategory` 的定义移动到任何类或 trait 之外来实现。选择权在于你，但按照目前的写法，每个\
  \ `Database` 都获得它自己独特的 `FoodCategory` 类。\n\n由于此示例中显示的两个 `FoodCategory` 类确实是不同的，编译器的报错是正确的。然而，有时你可能会遇到两种类型相同但编译器无法验证这一点的情况。你会看到编译器抱怨两个类型不相同，尽管你作为程序员知道它们是相同的。\n\
  \n在这些情况下，你通常可以使用单例类型（singleton types）来解决问题。例如，在 `GotApples` 程序中，类型检查器不知道 `db` 和\
  \ `browser.database` 是同一个。如果你尝试在两个对象之间传递类别，会导致类型错误：\n\n```\n object GotApples {\n\
  \  // 相同的定义相同...\n  for (category <- db.allCategories)\n    browser.displayCategory(category)\n\
  \  // ...\n  }\n  GotApples2.scala:14: error: type mismatch;\n  found    : db.FoodCategory\n\
  \  required: browser.database.FoodCategory\n          browser.displayCategory(category)\n\
  \                               ^\n  one error found\n```\n\n为了避免此错误，你需要告知类型检查器它们是同一个对象。你可以通过更改\
  \ `browser.database` 的定义来实现此，如列表 29.17 所示：\n\n```\n object browser extends Browser\
  \ {\n    val database: db.type = db\n  }\n```\n\n##### 列表 29.17 - 使用单例类型。\n\n此定义与之前相同，只是\
  \ `database` 具有了奇怪的类型 `db.type`。结尾的 `.type` 意味着这是一个单例类型。单例类型非常具体，仅包含一个对象；在这种情况下，就是\
  \ `db` 所指代的任何对象。通常，此类类型由于太具体而没有用处，这就是为什么编译器不愿自动插入它们。但在这种情况下，单例类型允许编译器知道 `db` 和 `browser.database`\
  \ 是同一个对象——足够的信息可以消除类型错误。\n\n### 29.7 结论\n\n本章展示了如何使用 Scala 对象作为模块。除了简单的静态模块外，这种方法还提供了创建抽象的、可配置模块的各种方法。实际上有比展示的更多的抽象技术，因为任何适用于类的操作也适用于用于实现模块的类。一如既往，使用多少这种力量应该取决于个人喜好。\n\
  \n模块是宏观编程的一部分，因此难以实验。你需要一个大型程序才能使其真正发挥作用。尽管如此，读完本章后，你知道在想以模块化风格进行编程时应该考虑哪些 Scala\
  \ 特性。在编写自己的大型程序时思考这些技术，并在他人的代码中看到这些编码模式时识别出它们。\n\n* *\n\n#### 第 29 章脚注：\n\n[1] 该术语由\
  \ DeRemer 等人在论文“Programming-in-the-large versus programming-in-small”引入。DeR75\n\n\
  [2] Fowler，“Inversion of control containers and the dependency injection pattern”。Fow04\n\
  \n[3] 这些命名遵循 Evans 的《领域驱动设计》。Eva03\n\n[4] 这些实体类经过了简化，以保持示例不被现实细节干扰。但要将这些类转换为可以使用\
  \ Hibernate 或 Java 持久体系持久化的实体，只需要少量的修改，例如添加私有的 Long id 字段和无参构造函数、在字段上放置 BeanProperty\
  \ 注解、通过注解或单独的 XML 文件指定相应的映射等。\n\n[5] 这是很好的，因为这些架构层中的每一层都应该只依赖于下方的层。\n\n第 30 章 对象相等性\n\
  \n比较两个值是否相等在编程中无处不在。它也比看起来要复杂得多。本章将详细研究对象相等性，并在设计自己的相等性测试时提供一些建议。\n\n### 30.1 Scala\
  \ 中的相等性\n\n正如第 11.2 节（scalas-hierarchy.html_sec-impl-primitives）所示，Scala 和 Java\
  \ 的相等性定义不同。Java 有两种相等性比较：`==` 运算符对于值类型是自然相等，对于引用类型是对象标识；`equals` 方法对于引用类型是用户定义的规范相等。这种约定是有问题的，因为更符合直觉的符号\
  \ `==` 并不总是对应于自然的相等概念。\n\n\n\n\n\nScala 也有一种表示对象恒等性的相等方法，但并不常用。这种书写为 `x eq y` 的相等性，如果\
  \ `x` 和 `y` 引用同一个对象，则为真。Scala 中将 `==` 等价性预留给每个类型的“自然”相等性。对于值类型，`==` 是值比较，就像在 Java\
  \ 中一样。对于引用类型，`==` 与 Scala 中的 `equals` 相同。你可以通过重写 `equals` 方法为新类型重新定义 `==` 的行为，该方法始终继承自类\
  \ `Any`。继承来的 `equals` 在不被重写的情况下起的是对象恒等作用，这在 Java 中也是如此。因此，`equals`（以及随之来的 `==`）默认与\
  \ `eq` 相同，但你可以通过在自定义的类中重写 `equals` 方法来改变它的行为。无法直接重写 `==`，因为在类 `Any` 中它被定义为 `final`\
  \ 方法。也就是说，Scala 处理 `==` 就像在类 `Any` 中如下定义如下：\n\n```\nfinal def == (that: Any): Boolean\
  \ = \n  if (null eq this) {null eq that} else {this equals that}\n```\n\n### 30.2\
  \ 编写相等性方法\n\n应该如何定义 `equals` 方法？事实证明，在面向对象的语言中，编写一个正确的相等性方法是异常困难的。事实上，在研究了大量的 Java\
  \ 代码后，2007 年某论文的作者得出结论：几乎所有 `equals` 方法的实现都是错误的。这是问题的，因为相等性是许多其他内容的基础。例如，对于类型 `C`\
  \ 的错误相等方法可能意味着你无法可靠地将类型为 `C` 的对象放入集合。\n\n例如，你可能有两个类型为 `C` 的元素 `elem1` 和 `elem2`，它们是相等的（即\
  \ `\"elem1 equals elem2\"` 返回 `true`）。尽管如此，由于由于 `equals` 方法中常见的错误实现，你可能仍然看到如下所示的行为：\n\
  \n```\nvar hashSet: Set[C] = new collection.immutable.HashSet\nhashSet += elem1\n\
  hashSet contains elem2    // 返回 false!\n```\n\n以下是重写 `equals` 时可能导致行为不一致的四个常见陷阱：\n\
  \n1. 使用错误的签名定义 `equals`。\n2. 在更改 `equals` 的同时没有更改 `hashCode`。\n3. 基于可变字段定义 `equals`。\n\
  4. 未能将 `equals` 定义为一种等价关系。\n\n这四个陷阱将在本节的剩余部分进行讨论。\n\n#### 陷阱 #1：使用错误的签名定义 equals\n\
  \n考虑为下面这个简单的点的类添加一个相等性方法：\n\n```\nclass Point(val x: Int, val y: Int) { ... }\n\
  ```\n\n一种看似显而易见但错误的方法是这样定义它：\n\n```\n// 一个完全错误的 equals 定义\ndef equals(other: Point):\
  \ Boolean =\n  this.x == other.x && this.y == other.y\n```\n\n这个方法有什么问题？从初看，它似乎运行正常：\n\
  \n```\nscala> val p1, p2 = new Point(1, 2)\np1: Point = Point@37d7d90f\np2: Point\
  \ = Point@3beb846d\n\nscala> val q = new Point(2, 3)\nq: Point = Point@e0cf182\n\
  \nscala> p1 equals p2\nres0: Boolean = true\n\nscala> p1 equals q\nres1: Boolean\
  \ = false\n```\n\n然而，一旦你开始将点放入集合，问题就开始了：\n\n```\nscala> import scala.collection.mutable\n\
  import scala.collection.mutable\n\nscala> val coll = mutable.HashSet(p1)\ncoll:\
  \ scala.collection.mutable.HashSet[Point] = \nSet(Point@37d7d90f)\n\nscala> coll\
  \ contains p2\nres2: Boolean = false\n```\n\n如何解释 `coll` 不包含 `p2`，尽管 `p1` 已经被添加其中，且\
  \ `p1` 和 `p2` 是相等对象？原因在接下来的交互中变得清晰，在交互中，其中一个被比较点的精确类型被掩盖了。将 `p2a` 定义为 `p2` 的别名，但类型为\
  \ `Any` 而不是 `Point`：\n\n```\nscala> val p2a: Any = p2\np2a: Any = Point@3beb846d\n\
  ```\n\n现在，如果你重复第一次比较，但使用别名 `p2a` 代替 `p2`，你会得到：\n\n```\nscala> p1 equals p2a\nres3:\
  \ Boolean = false\n```\n\n哪里出错了？之前提供的 `equals` 版本并没有重写标准方法 `equals`，因为它的类型不同。以下是在根类\
  \ `Any` 中定义的 `equals` 方法的类型签名：\n\n```\ndef equals(other: Any): Boolean\n```\n\n\
  由于 `Point` 中的 `equals` 方法接收 `Point` 而不是 `Any` 作为参数，它并没有重写 `Any` 中的 `equals`。相反，它只是一个重载变体。在\
  \ Scala 和 Java 中，重载是通过参数的静态类型 own 运行时类型来解析的。因此，只要参数的静态类型是 `Point`，就会调用 `Point` 中的\
  \ `equals` 方法。然而，一旦静态参数类型为 `Any`，就会改为调用 `Any` 中的 `equals` 方法。该方法没有被重写，因此它仍然通过比较对象恒等性来实现。\n\
  \n这就是为什么比较 `\"p1 equals p2a\"` 产生 `false`，尽管点 `p1` 和 `p2a` 具有相同的 `x` 和 `y` 值的原因。这也是为什么\
  \ `HashSet` 中的 `contains` 方法返回 `false` 的原因。由于该方法操作于泛型集合，它调用的是 `Object` 中的泛型 `equals`\
  \ 方法，而不是 `Point` 中的重载变体。这里有一个更好的 `equals` 方法：\n\n```\n// 一个较好的定义，但并非完美\noverride\
  \ def equals(other: Any) = other match {\n  case that: Point => this.x == that.x\
  \ && this.y == that.y\n  case _ => false\n}\n```\n\n现在 `equals` 有了正确的类型。它接收一个 `Any`\
  \ 类型的值作为参数，并产生一个 `Boolean` 结果。该方法的实现使用了模式匹配。它首先测试另一个对象是否也是 `Point` 类型。如果是，它会比较两个点的坐标并返回结果。否则，结果为\
  \ `false`。\n\n另一个相关的陷阱是使用错误的签名定义 `==`。通常情况下，如果你尝试使用正确的签名（接收 `Any` 类型参数）来重新定义 `==`，编译器会报错，因为你正在尝试重写一个类型为\
  \ `Any` 的最终方法。\n\n学者有时会同时犯两个错误：他们尝试重写 `==` 并且给它一个错误的签名。例如：\n\n```\ndef ...(other:\
  \ Point): Boolean // 不要这样做！\n```\n\n在这种情况下，用户定义的 `==` 方法被视为同名方法 `Any` 的重载变体，程序可以编译。然而，程序的行为就像使用错误的签名定义\
  \ `equals` 一样不稳定。\n\n#### 陷阱 #2：在更改 equals 的同时没有更改 hashCode\n\n我们将继续使用陷阱 #1 中的示例。如果你用\
  \ `Point` 的最新定义重复比较 `p1` 和 `p2`，你会得到如预期的 `true`。然而，如果你重复 `HashSet.contains` 测试，你可能仍然得到\
  \ `false`：\n\n```\nscala> val p1, p2 = new Point(1, 2)\np1: Point = Point@122c1533\n\
  p2: Point = Point@c23d097\n\nscala> collection.mutable.HashSet(p1) contains p2\n\
  res4: Boolean = false\n```\n\n但这种结果并不是 100% 确定的。你可能从实验中得到 `true`。如果是这样，你可以尝试其他坐标为\
  \ 1 和 2 的点。最终你会得到一个不包含在集合中的点。这里出现的问题是 `Point` 在重写 `equals` 的同时没有重写 `hashCode`。\n\
  \n注意示例中的集合是 `HashSet`。这意味着集合中的元素根据其哈希码放入“哈希桶”中。`contains` 测试首先确定要查找的哈希桶，然后将给定元素与该桶中的所有元素进行比较。现在，`Point`\
  \ 类的最后一个版本重写了 `equals`，但它没有同时重写 `hashCode`。因此 `hashCode` 仍然是它在 `AnyRef` 类中的版本：分配对象地址的某种转换。\n\
  \n\n\n\n`p1` 和 `p2` 的哈希值几乎肯定是不同的，尽管这两个点的字段是相同的。不同的哈希值意味着在高概率下，它们在集合中对应不同的哈希桶（hash\
  \ bucket）。`contains` 测试将在与 `p2` 哈希值对应的桶中查找匹配的元素。在大多数情况下，点 `p1` 会在另一个桶中，因此它永远不会被找到。`p1`\
  \ 和 `p2` 也可能碰巧落入同一个哈希桶中，在这种情况下，测试将返回 true。问题在于，`Point` 的最后一个实现违反了为类 `Any` 定义 `hashCode`\
  \ 契约。\n\n如果两个对象根据 `equals` 方法是相等的，那么在在这两个对象上分别调用 `hashCode` 方法必须产生相同的整数结果。\n\n事实上，Java\
  \ 中众所周知的是 `hashCode` 和 `equals` 应该始终一起重写。此外，`hashCode` 只能依赖于 `equals` 所依赖的字段。对于\
  \ `Point` 类，以下是 `hashCode` 的合适定义：\n\n```\n class Point(val x: Int, val y: Int) {\n\
  \  override def hashCode = (x, y).##\n  override def equals(other: Any) = other\
  \ match { \n    case that: Point => this.x == that.x && this.y == that.y \n    case\
  \ _ => false \n  }\n}\n```\n\n这只是 `hashCode` 的许多可能实现之一。记住，`##` 方法是计算哈希值的简写，适用于基本值、引用类型和\
  \ null。当在集合或元组上调用它时，它会计算一个混合哈希，对集合中所有元素的哈希值敏感。我们将在本章稍后部分提供关于编写 `hashCode` 的更多指导。\n\
  \n添加 `hashCode` 解决了定义像 `Point` 等类时的相等性问题；然而，还有其他需要注意的地方。\n\n### 陷阱 #3：基于可变字段定义 `equals`\n\
  \n考虑类 `Point` 的以下稍微变体：\n\n```\n class Point(var x: Int, var y: Int) { // 有问题\n \
  \ override def hashCode = (x, y).##\n  override def equals(other: Any) = other match\
  \ { \n    case that: Point => this.x == that.x && this.y == that.y \n    case _\
  \ => false \n  }\n}\n```\n\n唯一的区别是字段 `x` 和 `y` 现在是 `vars` 而不是 `vals`。`equals` 和\
  \ `hashCode` 方法现在基于这些可变字段定义，因此当字段变化时它们的结果也会随。一旦你将点放入集合，这可能会产生奇怪的影响：\n\n```\nscala>\
  \ val p = new Point(1, 2)\n  p: Point = Point@5428bd62\n\n  scala> val coll = collection.mutable.HashSet(p)\n\
  \  coll: scala.collection.mutable.HashSet[Point] = \n  Set(Point@5428bd62)\n\n \
  \ scala> coll contains p\n  res5: Boolean = true\n```\n\n现在，如果你更改了点 `p` 中的一个字段，集合还包含该点吗？我们试一下：\n\
  \n```\nscala> p.x += 1\n\n  scala> coll contains p\n  res7: Boolean = false\n```\n\
  \n这看起来很奇怪。`p` 去去哪儿了？如果你检查集合的迭代器是否包含 `p`，结果会更奇怪：\n\n```\nscala> coll.iterator contains\
  \ p\n  res8: Boolean = true\n```\n\n所以这里有一个集合不包含 `p`，但 `p` 又是集合的元素之一！发生的情况是在修改 `x`\
  \ 字段后，点 `p` 最终位于集合 `coll` 中错误的哈希桶。也就是说，它原始的哈希桶不再对应其哈希值的新值。从某种意义上说，点 `p` 虽然仍然属于元素，但在\
  \ `coll` 中“消失了”。\n\n从这个例子中得到的教训是，当 `equals` 和 `hashCode` 依赖于可变状态时，会对潜在用户造成麻烦。如果你将此类对象放入集合，你必须小心永远不要修改依赖的状态，这是很困难的。如果你需要考虑对象当前状态的比较，通常应该给它起另一个名字，而不是\
  \ `equals`。\n\n考虑到 `Point` 的最后一个定义，最好省略重定义 `hashCode`，并将比较方法命名为 `equalContents`\
  \ 或其他不同于 `equals` 的名称。这样 `Point` 将继承 `equals` 和 `hashCode` 的默认实现；即使在修改了 `x` 字段后，`p`\
  \ 在 `coll` 中仍然是可以定位的。\n\n### 陷阱 #4：未能将 `equals` 定义为等价关系\n\n`scala.Any` 中 `equals`\
  \ 方法的契约规定 `equals` 必须对非空对象实现等价关系：\n\n- 它是自反射的：对于任何非空值 `x`，表达式 `x.equals(x)` 应返回\
  \ true。\n- 它是对称的：对于任何非空值 `x` 和 `y`，当且仅当 `y.equals(x)` 返回 true 时，`x.equals(y)` 应返回\
  \ true。\n- 它是传递的：对于任何非空值 `x、y、z`，如果 `x.equals(y)` 返回 true 且 `y.equals(z)` 返回 true，那么\
  \ `x.equals(z)` 返回 true。\n- 它是一致的：对于任何非空值 `x` 和 `y`，多次调用 `x.equals(y)` 应该一致返回 true\
  \ 或一致返回 false，前提是用于 `equals` 比较的对象信息没有被修改。\n- 对于任何非空值 `x`，`x.equals(null)` 应返回 false。\n\
  \n到目前为止为 `Point` 类开发的 `equals` 定义了 `equals` 的契约。然而，一旦考虑到子类，情况就会变得复杂。假设有一个 `Point`\
  \ 的子类 `ColoredPoint`，它添加了类型为 `Color` 的字段 `color`。假设 `Color` 如第 20.9 节所示：\n\n```\n\
  \ object Color extends Enumeration {\n  val Red, Orange, Yellow, Green, Blue, Indigo,\
  \ Violet = Value\n}\n```\n\n`ColoredPoint` 重写了 `equals` 以考虑新的颜色字段：\n\n```\n class\
  \ ColoredPoint(x: Int, y: Int, val color: Color.Value) \n      extends Point(x,\
  \ y) { // 问题：equals 不对称\n\n  override def equals(other: Any) = other match {\n \
  \   case that: ColoredPoint => this.color == that.color && super.equals(that)\n\
  \    case _ => false\n  }\n}\n```\n\n这是许多程序员可能会写的代码。注意，在这种情况下，类 `ColoredPoint` 不需要重写\
  \ `hashCode`。因为 `equals` 的新定义比 `Point` 更严格（意味着它等同更少的对象对），`hashCode` 的契约仍然有效。如果两个彩色点相等等的，它们必须具有相同的坐标，因此它们的哈希值保证是相等的。\n\
  \n单看 `ColoredPoint` 类，它的 `equals` 定义看起来是好的。然而，一旦点和彩色点混合在一起，`equals` 的契约就被破坏了。考虑：\n\
  \n```\nscala> val p = new Point(1, 2)\n  p: Point = Point@5428bd62\n\n  scala> val\
  \ cp = new ColoredPoint(1, 2, Color.Red)\n  cp: ColoredPoint = ColoredPoint@5428bd62\n\
  \n  scala> p equals cp\n  res9: Boolean = true\n\n  scala> cp equals p\n  res10:\
  \ Boolean = false\n```\n\n比较 `p equals cp` 调用了 `p` 的 `equals` 方法，该方法定义在 `Point`\
  \ 类中。该方法只考虑两个点的坐标。因此，比较结果为 true。相反，比较 `cp equals p` 调用了 `cp` 的 `equals` 方法，该方法定义在\
  \ `ColoredPoint` 类中。该方法返回 false，因为 `p` 不是一个 `ColoredPoint`。所以由 `equals` 定义的关系不是对称的。\n\
  \n对称性的丢失会给集合产生意外的后果。这是一个例子：\n\n```\nscala> collection.mutable.HashSetPoint contains\
  \ cp\n  res11: Boolean = true\n\n  scala> collection.mutable.HashSetPoint contains\
  \ p\n  res12: Boolean = false\n```\n\n尽管 `p` 和 `cp` 是相等的，一个包含测试成功了，而另一个失败了。\n\n\n\
  \n\n你如何修改 `equals` 的定义使其具有对称性呢？本质上有两种方法。你可以让这种关系更通用，或者使其更严格。使其更通用意味着：如果对两个对象 `x`\
  \ 和 `y` 比较 `x` 与 `y` 或比较 `y` 与 `x` 的结果为真，则认为它们相等。以下是实现此点的代码：\n\n```\n class ColoredPoint(x:\
  \ Int, y: Int, val color: Color.Value) \n    extends Point(x, y) { // Problem: equals\
  \ not transitive\n\n  override def equals(other: Any) = other match {\n    case\
  \ that: ColoredPoint =>\n      (this.color == that.color) && super.equals(that)\n\
  \    case that: Point =>\n      that equals this\n    case _ =>\n      false\n \
  \ }\n}\n```\n\n`ColoredPoint` 中 `equals` 的新定义比旧定义多出一个：如果另一个对象是 `Point` 但不是 `ColoredPoint`，该方法将转发到\
  \ `Point` 的 `equals` 方法。这达到了让 `equals` 对称的预期效果。现在，“cp equals p”和“p equals cp”的结果均为真。然而，`equals`\
  \ 的契约仍然被破坏了。问题在于新的关系不再具有传递性了！\n\n这里有一系列语句演示了这一点。定义一个点和两个颜色不同颜色的彩色点，它们都处于相同的位置：\n\
  \n```\nscala> val redp = new ColoredPoint(1, 2, Color.Red)\n  redp: ColoredPoint\
  \ = ColoredPoint@5428bd62\n\n  scala> val bluep = new ColoredPoint(1, 2, Color.Blue)\n\
  \  bluep: ColoredPoint = ColoredPoint@5428bd62\n```\n\n单独来看，`redp` 等于 `p` 且 `p`\
  \ 等于 `bluep`：\n\n```\nscala> redp == p\n  res13: Boolean = true\n\n  scala> p ==\
  \ bluep\n  res14: Boolean = true\n```\n\n然而，比较 `redp` 和 `bluep` 的结果为假：\n\n```\n\
  scala> redp == bluep\n  res15: Boolean = false\n```\n\n因此，违反了 `equals` 契约中的传递性条款。\n\
  \n让 `equals` 关系更通用似乎导致了死胡同。我们将尝试使其更严格。让 `equals` 更严格的一种方法是始终将不同类的对象视为不同的对象。这可以通过修改\
  \ `Point` 类和 `ColoredPoint` 类中的 `equals` 方法来实现。在 `Point` 类中，你可以添加一个额外的比较，检查另一个 `Point`\
  \ 的运行时类是否与此 `Point` 的类完全相同：\n\n```\n // 一个技术上有效但不令人满意的 equals 方法\n class Point(val\
  \ x: Int, val y: Int) {\n  override def hashCode = (x, y).##\n  override def equals(other:\
  \ Any) = other match {\n    case that: Point => \n      this.x == that.x && this.y\
  \ == that.y && \n      this.getClass == that.getClass\n    case _ => false\n  }\n\
  }\n```\n\n然后你可以将 `ColoredPoint` 的实现恢复到之前违反了对称性要求的版本：\n\n```\n class ColoredPoint(x:\
  \ Int, y: Int, val color: Color.Value) \n    extends Point(x, y) {\n\n  override\
  \ def equals(other: Any) = other match {\n    case that: ColoredPoint =>\n     \
  \ (this.color == that.color) && super.equals(that)\n    case _ => false\n  }\n}\n\
  ```\n\n在这里，`Point` 类的实例被认为与同类的某个其他实例相等，仅当这些对象具有相同的坐标且具有相同的运行时类（即在任何一个对象上调用 `getClass`\
  \ 返回相同的值）。新的定义满足了对称性和传递性，因为现在不同类对象之间的每次比较结果都为假。因此，彩色点永远不会等于点。这种约定看起来很合理，但可能会认为新定义太严格了。\n\
  \n考虑以下略显迂回的方法来定义坐标为 (1, 2) 的点：\n\n```\nscala> val pAnon = new Point(1, 1) { override\
  \ val y = 2 }\n  pAnon: Point = $anon$1@5428bd62\n```\n\n`pAnon` 等于 `p` 吗？答案是否定的，因为与\
  \ `p` 和 `pAnon` 关联的 `java.lang.Class` 对象是不同的。对于 `p`，它是 `Point`，而对于 `pAnon`，它是 `Point`\
  \ 的匿名子类。但显然，`pAnon` 只是坐标为 (1, 2) 的另一个点。将其视为不同于 `p` 似乎并不合理。\n\n所以我们似乎陷入了僵局。是否存在一种合理的方法在类层次级的多个级别重新定义相等并保持其契约？事实上，有这样做的方法，但它需要一个额外的方法与\
  \ `equals` 和 `hashCode` 一起重新定义。该思想是：一旦一个类重新定义了 `equals`（以及 `hashCode`），它还应该显式声明该类的对象永远与实现不同相等方法的父类对象相等。这通过向每个重定义了\
  \ `equals` 的类添加一个 `canEqual` 方法来实现。该方法的签名如下：\n\n```\ndef canEqual(other: Any): Boolean\n\
  ```\n\n如果另一个对象是 `canEqual` 被（重）定义的类的实例，则该方法返回真，否则返回假。它从 `equals` 中被调用，以确保对象双向都是可比较的。列表\
  \ 30.1 显示了遵循此类原则的 `Point` 类的新（也是最终的）实现：\n\n```\nclass Point(val x: Int, val y: Int)\
  \ {\n  override def hashCode = (x, y).##\n  override def equals(other: Any) = other\
  \ match {\n    case that: Point =>\n      (that canEqual this) &&\n      (this.x\
  \ == that.x) && (this.y == that.y)\n    case _ =>\n      false\n  }\n  def canEqual(other:\
  \ Any): Boolean = true\n}\n```\n\n##### 列表 30.1 - 调用 canEqual 的父类方法\n\n此版本 `Point`\
  \ 中的 `equals` 方法包含了要求：另一个对象必须 `canEqual` 自己。\n\n##### 列表 30.2 - 调用 super 的子类 equals\
  \ 方法\n\n```\n class ColoredPoint(x: Int, y: Int, val color: Color.Value) \n    extends\
  \ Point(x, y) {\n\n  override def equals(other: Any) = other match {\n    case that:\
  \ ColoredPoint =>\n      (this.color == that.color) && super.equals(that)\n    case\
  \ _ => false\n  }\n  override def canEqual(other: Any): Boolean = other.isInstanceOf[ColoredPoint]\n\
  }\n```\n\n可以证明 `Point` 和 `ColoredPoint` 的新定义保持了 `equals` 的契约。相等性是对称且传递的。比较 `Point`\
  \ 和 `ColoredPoint` 始终返回假。事实上，对于任何点 `p` 和彩色点 `cp`，“p equals cp”将返回假，因为“cp canEqual\
  \ p”将返回假。反向比较“cp equals p”也会返回假，因为 `p` 不是 `ColoredPoint`，所以 `ColoredPoint` 中 `equals`\
  \ 主体中的第一个模式匹配将失败。\n\n另一方面，只要没有类重新定义了相等性方法，`Point` 的不同子类的实例就可以是相等的。例如，使用新的类定义时，`p`\
  \ 和 `pAnon` 的比较将产生真。以下是一些示例：\n\n```\nscala> val p = new Point(1, 2)\n  p: Point\
  \ = Point@5428bd62\n\n  scala> val cp = new ColoredPoint(1, 2, Color.Indigo)\n \
  \ cp: ColoredPoint = ColoredPoint@e6230d8f\n\n  scala> val pAnon = new Point(1,\
  \ 1) { override val y = 2 }\n  pAnon: Point = $anon$1@5428bd62\n\n  scala> val coll\
  \ = List(p)\n  coll: List[Point] = List(Point@5428bd62)\n\n  scala> coll contains\
  \ p\n  res16: Boolean = true\n\n  scala> coll contains cp\n  res17: Boolean = false\n\
  \n  scala> coll contains pAnon\n  res18: Boolean = true\n```\n\n\n\n\n这些示例表明，如果父类的相等性定义并调用了\
  \ `canEqual`，那么实现子类的程序员就可以决定它们的子类是否可以与父类的实例相等。例如，由于 `ColoredPoint` 重写了 `canEqual`，一个彩色的点可能永远不会与一个普通的点相等。但由于从\
  \ `pAnon` 引用的匿名子类没有重写 `canEqual`，它的实例可以与 `Point` 实例相等。\n\n对 `canEqual` 方法的一种潜在批评是，它违反了里氏夫替换原则（Liskov\
  \ Substitution Principle, LSP）。例如，通过比较运行时类来实现 `equals` 的技术（导致无法定义一个实例与父类实例相等的子类）被描述为对\
  \ LSP 的违反。LSP 规定，你应该能够在需要父类实例的地方使用（替换为）子类实例。\n\n然而，在以前的示例中，尽管 `cp` 的 `x` 和 `y` 值与集合中的点匹配，`\"\
  coll contains cp\"` 仍然返回了 `false`。因此，这看起来像是违反了 LSP，因为你无法在期望 `Point` 的地方使用 `ColoredPoint`。我们认为这是一种错误的解释，因为\
  \ LSP 并不要求子类的行为与其父类完全相同，只需其行为符合其父类的契约即可。\n\n编写一个比较运行时类的 `equals` 方法的问题不在于它违反了 LSP，而在于它没有提供一种方法创建一个实例与父类实例相等的子类。例如，如果我们在上一个示例中使用了运行时类技术，`\"\
  coll contains pAnon\"` 将返回 `false`，而这并不是我们想要的。相比之下，我们确实希望 `\"coll contains cp\"\
  ` 返回 `false`，因为通过在 `ColoredPoint` 中重写 `equals`，我们基本上是在说坐标为 (1, 2) 的靛色点与 (1, 2) 的无色点不是同一个东西。因此，在以前的示例中，我们能够将两个不同的\
  \ `Point` 子类实例传递给集合的 `contains` 方法，并得到了两个不同的答案，两者都是正确的。\n\n## 30.3 为泛型类型定义相等性\n\n\
  之前示例中的 `equals` 方法都以模式匹配开始，测试操作数的类型是否符合包含 `equals` 方法的类的类型。当类被泛型化时，这种方案需要稍微调整。\n\
  \n例如，考虑二叉树。列表 30.3 显示的类层次结构定义了一个二叉树的抽象类 `Tree`，有两个实现：`EmptyTree` 对象和表示非空树的 `Branch`\
  \ 类。非空树由某些 `elem` 以及 `left` 和 `right` 子节点组成。它的元素类型由类型参数 `T` 给出。\n\n```scala\ntrait\
  \ Tree[T] {\n  def elem: T\n  def left: Tree[T]\n  def right: Tree[T]\n}\n\nobject\
  \ EmptyTree extends Tree[Nothing] {\n  def elem = throw NoSuchElementException(\"\
  EmptyTree.elem\")\n  def left = throw NoSuchElementException(\"EmptyTree.left\"\
  )\n  def right = throw NoSuchElementException(\"EmptyTree.right\")\n}\n\nclass Branch+T\
  \ extends Tree[T]\n```\n\n###  30.3 二叉树的层次结构\n\n现在我们为这些类添加 `equals` 和 `hashCode`\
  \ 方法。对于 `Tree` 类本身，不需要做什么，因为我们假设这些方法是为抽象类的每个实现单独实现的。对于 `EmptyTree`，也不需要做什么，因为继承自\
  \ `AnyRef` 的默认 `equals` 和 `hashCode` 实现运行良好。毕竟，`EmptyTree` 只与自己相等，所以相等性应该是引用相等性，这是继承自\
  \ `AnyRef` 的。\n\n但在 `Branch` 中添加 `equals` 和 `hashCode` 需要做一些工作。一个 `Branch` 值应该只与其他\
  \ `Branch` 值相等，并且仅当两个值具有相同的 `elem`、`left` 和 `right` 字段时才相等。应用在本章之前章节中开发的 `equals`\
  \ 方案是自然做法。这将为你提供：\n\n```scala\nclass BranchT extends Tree[T] {\n\n  override def\
  \ equals(other: Any) = other match {\n    case that: Branch[T] => this.elem == that.elem\
  \ &&\n      this.left == that.left &&\n      this.right == that.right\n    case\
  \ _ => false\n  }\n}\n```\n\n然而，编译这个示例会提示“未检查”（unchecked）警告。再次使用 `-unchecked` 选项编译会显露出以下问题：\n\
  \n```\n$fsc-unchecked Tree.scala\nTree.scala:14: warning: nonexistent type-argument\
  \ T in type pattern is unchecked since it is eliminated by erasure\n  case that:\
  \ Branch[T] => this.elem == that.elem &&\n^\n```\n\n正如警告所示，有一个针对 `Branch[T]` 类型的模式匹配，但系统只能检查另一个引用是（某种）`Branch`；它无法检查树的元素类型是否为\
  \ `T`。你在第 19 章遇到过此的原因：泛型类型的元素类型会被编译器的擦除阶段消除；它们无法在运行时进行检查。\n\n所以，编写一个比较运行时类的 `equals`\
  \ 方法的问题不在于它违反了 LSP，而是因为它没有给你提供一种方法创建一个实例与父类实例相等的子类。例如，如果我们在上一个示例中使用了运行时类技术，`\"coll\
  \ contains pAnon\"` 将返回 `false`，而这并不是我们想要的。相比之下，我们确实希望 `\"coll contains cp\"` 返回\
  \ `false`，因为通过在 `ColoredPoint` 中重写 `equals`，我们基本上是在说坐标为 (1, 2) 的靛色点与 (1, 2) 的无色点不是同一个东西。因此，在以前的示例中，我们能够将两个不同的\
  \ `Point` 子类实例传递给集合的 `contains` 方法，并得到了两个不同的答案，两者都是正确的。\n\n那么该怎么做呢？幸运的是，事实证明不需要检查两个\
  \ `Branch` 是否具有相同的元素类型在比较它们时，只要它们的字段相同即可。一个简单的例子是两个由单个 `Nil` 元素和两个空子树组成的 `Branch`，无论它们的静态类型是什么：\n\
  \n```\nscala> val b1 = new BranchString\n  b1: Branch[String] =9d5fa4\n\nscala>\
  \ val b2 = new BranchInt\n  b2: Branch[Int] =56cdfc9\n\nscala> b1 == b2\nres19:\
  \ Boolean = true\n```\n\n上述比较的正结果是使用之前的 `Branch` 实现得到的。这表明元素类型没有被检查——如果检查了，结果将是\
  \ `false`。\n\n我们可以对比较的可能结果哪种更自然产生分歧。最终，这取决于对类的心理模型。在类型参数仅存在于编译时的模型中，认为 `b1` 和 `b2`\
  \ 相等是自然的。在另一种类型参数构成对象值一部分的模型中，认为它们不同也同样自然。由于 Scala 采用了类型擦除模型，类型参数在运行时不会保留，因此 `b1`\
  \ 和 `b2` 自然地被认为是相等的。\n\n要制定不产生未检查警告的 `equals` 方法，只需要极小的更改。不要使用元素类型 `T`，而是使用小字母，例如\
  \ `t`：\n\n```scala\ncase that: Branch[t] => this.elem == that.elem &&\n  this.left\
  \ == that.left &&\n  this.right == that.right\n```\n\n回想第 15.2 节，以小写字母开头的类型参数表示未知类型。现在，模式匹配：\n\
  \n```scala\ncase that: Branch[t] =>\n```\n\n对于任何类型的 `Branch` 都会成功。类型参数 `t` 代表 `Branch`\
  \ 的未知元素类型。它也可以被替换为下划线，如下面的情况，这等同于上一个：\n\n```scala\ncase that: Branch[_] =>\n```\n\
  \n\n\n\n剩下的唯一工作就是为 `Branch` 类定义另外两个方法 `hashCode` 和 `canEqual`，它们与 `equals` 配合使用。这里是\
  \ `hashCode` 的一种可能实现：\n\n```\n override def hashCode: Int = (elem, left, right).##\n\
  ```\n\n这只是许多可能实现方式之一。如前所示，原理是获取所有字段的 `hashCode` 值并将它们组合起来。这里是 `Branch` 类中 `canEqual`\
  \ 方法的实现：\n\n```\n def canEqual(other: Any) = other match {\n  case that: Branch[_]\
  \ => true\n  case _ => false\n  }\n```\n\n`canEqual` 方法的实现使用了类型模式匹配。也可以使用 `isInstanceOf`\
  \ 来编写它：\n\n```\n def canEqual(other: Any) = other.isInstanceOf[Branch[_]]\n```\n\
  \n如果你觉得可以吹吹毛求——我们非常鼓励你这样做！——你可能会好奇上述类型中下划线的出现意味着什么。毕竟，`Branch[_]` 在技术上是一个方法的类型参数，而不是一个类型模式。那么，如何可能让它的某些部分未定义呢？\n\
  \n这个问题的答案将在下一章中讨论。`Branch[_]` 是通配符类型（wildcard type）的简写，简单来说，它是一个包含某些未知部分的类型。因此，尽管技术上下划线在模式匹配和方法调用的类型参数中代表两个不同的含义，但本质上它们的意义是相同的：它允许你标记某个未知的内容。`Branch`\
  \ 的最终版本见列表 30.4。\n\n```\n class BranchT extends Tree[T] {\n\n    override def equals(other:\
  \ Any) = other match {\n      case that: Branch[_] => (that canEqual this) && \n\
  \                              this.elem == that.elem && \n                    \
  \          this.left == that.left &&\n                              this.right ==\
  \ that.right\n      case _ => false\n    }\n\n    def canEqual(other: Any) = other.isInstanceOf[Branch[_]]\n\
  \n    override def hashCode: Int = (elem, left, right).##\n  }\n```\n\n##### 列表\
  \ 30.4 - 带有 equals 和 hashCode 的参数化类型。\n\n### 30.4 equals 和 hashCode 的配方\n\n在本节中，我们将提供创建\
  \ `equals` 和 `hashCode` 方法的逐步配方，这些方法足以大多数情况。作为说明，我们将使用 `Rational` 类的方法，见列表 30.5。\n\
  \n为了创建这个类，我们从列表 6.5 此处所示的 `Rational` 类版本中删除了数学运算符方法。我们还对 `toString` 进行了微调，并修改了 `numer`\
  \ 和 `denom` 的初始化器，以使所有分数具有正分母（即将 ¹/[-2] 转换为 ^(-1)/[2]）。\n\n#### equals 配方\n\n这里是重写\
  \ `equals` 的配方：\n\n1. 在非 final 类中重写 `equals` 时，创建一个 `canEqual` 方法。如果继承的 `equals`\
  \ 定义来自 `AnyRef`（即 `equals` 未在类层次结构的更高处重新定义），则 `canEqual` 的定义应该是新的；否则，它将覆盖之前同名方法的定义。该要求的唯一例外是重定义了从\
  \ `AnyRef` 继承的 `equals` 方法的 final 类。对于这些类，不会出现第 30.2 节](#object-equality.html_sec-writing-an-equality-method)描述的子类异常；因此它们不需要定义\
  \ `canEqual`。传递给 `canEqual` 的对象类型应该是 `Any`：\n\n   ```\n    def canEqual(other: Any):\
  \ Boolean =\n   ```\n\n2. 如果参数对象是当前类的实例（即定义 `canEqual` 的类），则 `canEqual` 方法应返回 true，否则返回\
  \ false：\n\n   ```\n     other.isInstanceOf[Rational]\n   ```\n\n3. 在 `equals` 方法中，确保将传递的对象的类型声明为\
  \ `Any`：\n\n   ```\n    override def equals(other: Any): Boolean =\n   ```\n\n4.\
  \ 以单个 `match` 表达式编写 `equals` 方法体。`match` 的选择器应该是传递给 `equals` 的对象：\n\n   ```\n  \
  \   other match {\n      // ...\n     }\n   ```\n\n5. `match` 表达式应该有两个情况。第一个情况应该为你你正在定义\
  \ `equals` 方法的类类型声明一个类型模式：\n\n   ```\n    case that: Rational =>\n   ```\n\n6. 在该情况的体中，编写一个表达式，将对象相等必须为真的各个表达式进行逻辑与（and）组合。如果你要重写的\
  \ `equals` 方法不是 `AnyRef` 的方法，你可能想要包含对父类 `equals` 方法的调用：\n\n   ```\n     super.equals(that)\
  \ &&\n   ```\n\n   如果你为一个首次引入 `canEqual` 的类定义 `equals`，你应该对相等性方法的参数调用 `canEqual`，并传递此参数：\n\
  \n   ```\n     (that canEqual this) &&\n   ```\n\n   重写 `equals` 也包含 `canEqual`\
  \ 调用，除非它们包含了对 `super.equals` 的调用。后者情况下，`canEqual` 测试由父类调用完成。最后，对于与相等性相关的字段，验证该对象中的字段与传递的对象中的字段相等：\n\
  \n   ```\n     numer == that.numer &&\n      denom == that.denom\n   ```\n\n7. 对于第二个情况，使用通配符模式：\n\
  \n   ```\n    case _ => false\n   ```\n\n   如果你遵循此 `equals` 配方，则保证相等是一个等价关系，符合 `equals`\
  \ 契约。\n\n```\n class Rational(n: Int, d: Int) {\n\n  require(d != 0)\n  private\
  \ def gcd(a: Int, b: Int): Int =\n    if (b == 0) a else gcd(b, a % b)\n  val numer\
  \ = if (d < 0) -n else n\n  val denom = if (d < 0) -d else d\n\n  override def equals(other:\
  \ Any): Boolean =\n    other match {\n      case that: Rational =>\n        (that\
  \ canEqual this) &&\n        this.numer == that.numer &&\n        this.denom ==\
  \ that.denom\n      case _ => false\n    }\n\n  def canEqual(other: Any) =\n   \
  \ other.isInstanceOf[Rational]\n\n  override def hashCode: Int = (numer, denom).##\n\
  \n  override def toString =\n    if (denom == 1) numer.toString else s\"$numer/$denom\"\
  \n}\n```\n\n##### 列表 30.5 - 带有 equals 和 hashCode 的 Rational 类。\n\n#### hashCode\
  \ 配方\n\n对于 `hashCode`，如果你使用以下配方，通常可以获得满意的结果，该配方类似于《Effective Java》中为 Java 类推荐的配方[[8]](#object-equality.html_footnotemain30-8)。在计算中包含对象中每个用于\
  \ `equals` 方法确定相等性的字段（“相关”字段）。创建一个包含所有这些字段值的元组。然后，对生成的元组调用 ##。\n\n例如，要为一个具有名为 a,\
  \ b, c, d, e 的五个相关字段的对象实现哈希码，你可以写：\n\n```\n override def hashCode: Int = (a, b,\
  \ c, d, e).##\n```\n\n如果 `equals` 方法在计算过程中调用了 `super.equals(that)`，那么你的 `hashCode`\
  \ 计算应该从对 `super.hashCode` 的调用开始。例如，如果 `Rational` 的 `equals` 方法调用了 `super.equals(that)`，那么它的\
  \ `hashCode` 将是：\n\n```\n override def hashCode: Int = (super.hashCode, numer, denom).##\n\
  ```\n\n\n\n\n在使用这种方法编写 `hashCode` 方法时，需要记住的一点是：你的哈希值的好坏取决于你在此基础上构建的哈希值，即你通过调用对象相关字段的\
  \ `hashCode` 方法所获得的哈希值。有时，你可能需要在仅调用字段的 `hashCode` 之外进行额外操作，以获取该字段实用的哈希值。例如，如果其中一个字段是一个集合（collection），你可能希望该字段的哈希值基于集合中包含的所有元素。如果该字段是\
  \ `Vector`、`List`、`Set`、`Map` 或 `tuple`，你可以直接将其包含在要哈希的项列表中，因为这些类已经重写了 `equals` 和\
  \ `hashCode`，以考虑其中包含的元素。然而，`Arrays` 的情况并非如此，它在计算哈希值时不会考虑元素。因此，对于数组，你应该将数组的每个元素视为对象中的一个独立字段，显式地对每个元素调用\
  \ `hashCode`，或者将数组传递给单例对象 `java.util.Arrays` 中的任一 `hashCode` 方法。\n\n最后，如果你发现某个特定的哈希值计算计算损害了程序的性能，请考虑缓存哈希值。如果对象是不可变的，你可以在对象创建时计算哈希值并将其存储在字段中。你可以通过简单用\
  \ `val` 代替 `def` 来重写 `hashCode`，如下所示：\n\n```\noverride val hashCode: Int = (numer,\
  \ denom).hashCode\n```\n\n这种方法是用内存换取计算时间，因为该不可变类的每个实例都将多出一个字段来存储缓存的哈希值。\n\n## 30.5\
  \ 结论\n\n回想起来，定义一个正确的 `equals` 实现是出奇地微妙。你必须小心处理类型签名；你必须重写 `hashCode`；你应该避免对可变状态的依赖；如果你的类不是最终的（non-final），你应该实现并使用\
  \ `canEqual` 方法。\n\n鉴于实现一个正确的等性方法如此困难，你可能更喜欢将可比较对象的类定义为 `case classes`。这样，Scala\
  \ 编译器就会自动添加具有正确属性的 `equals` 和 `hashCode` 方法。\n\n***\n\n#### 第 30 章脚注：\n\n[1] Vaziri,\
  \ *et. al.*, \"Declarative Object Identity Using Relation Types\" [[Vaz07]](#bibliography.html_vaziri-tip-2007)\n\
  \n[2] 除了第三个陷阱外，其余都在 Joshua Bloch 编写的 *Effective Java Second Edition* 书在 Java 背景下进行了描述。[Blo08]](#bibliography.html_bloch-effective-java)\n\
  \n[3] 如果你编写大量的 Java，可能会认为此方法的参数类型是 `Object` 而不是 `Any`。不用担心；它是同一个 `equals` 方法。编译器只是让它看起来类型是\
  \ `Any`。\n\n[4] `Any` 的 `hashCode` 合约灵感来源于 `java.lang.Object` 类的 Javadoc 文档。\n\n\
  [5] 与 `hashCode` 一样，`Any` 的 `equals` 方法合约基于 `java.lang.Object` 的 `equals` 方法。\n\n\
  [6] 鉴于 `Point` 中 `equals` 的新实现，此版本的 `ColoredPoint` 不再违反对称性。\n\n[7] Bloch, *Effective\
  \ Java Second Edition*, p. 39 [[Blo08]](#bibliography.html_bloch-effective-java)\n\
  \n[8] Bloch, *Effective Java Second Edition*. [[Blo08]](#bibliography.html_bloch-effective-java)\n\
  \n## 第 31 章\n\n## 结合 Scala 和 Java\n\nScala 代码经常与大型 Java 程序和框架配合使用。由于 Scala 与 Java\
  \ 具有高度兼容性，大多数时候你可以结合这两种语言而无需过多担心。例如，标准框架如 `Swing`、`Servlets` 和 `JUnit` 经认为可以与 Scala\
  \ 完美工作。尽管如此，你偶尔仍遇到一些结合 Java 和 Scala 的问题。\n\n本章描述了结合 Java 和 Scala 的两个方面。首先，它讨论了 Scala\
  \ 如何翻译为 Java，这在你从 Java 调用 Scala 代码时尤为重要。其次，它讨论了在 Scala 中使用 Java 注解，如果你想在现有的 Java\
  \ 框架中使用 Scala，这是一项重要特性。\n\n### 31.1 从 Java 使用 Scala\n\n大多数时候，你可以从源码层面考虑 Scala。然而，如果你了解它的翻译机制，你将对系统如何工作有更深入的理解。此外，如果你从\
  \ Java 调用 Scala 代码，你需要知道从 Java 的视角看 Scala 代码是什么样的。\n\n#### 通用规则\n\nScala 的实现是翻译为标准的\
  \ Java 字节码。Scala 特性尽可能直接映射到等效 Java 特性。例如，Scala 的类、方法、字符串和异常在编译为 Java 字节码时，与其 Java\
  \ 对应项相同。\n\n为了实现这一点，Scala 的设计在偶尔需要做出艰难的选择。例如，如果在运行时（使用运行时类型）来解析重载方法，而不是在编译时，可能会很好。然而，这种设计会与\
  \ Java 的设计冲突，使得 Java 和 Scala 的融合变得更加棘手。在这种情况下，Scala 沿用了 Java 的重载解析方式，因此 Scala 方法和方法调用可以直接映射到\
  \ Java 方法和方法调用。\n\nScala 对其他特性有有设计设计。例如，`traits` 在 Java 中没有等价物。同样，虽然 Scala 和 Java\
  \ 都有泛型，但这两个系统的细节存在冲突。对于像这些这样的语言特性，Scala 代码无法直接映射到 Java 结构，因此必须使用某些组合进行编码。\n\n这些是通用规则。现在考虑一些特殊情况。\n\
  \n#### 值类型\n\n像 `Int` 这样的值类型有两种不同的方式翻译为 Java。在可能的情况下，编译器会将 Scala `Int` 翻译为 Java\
  \ `int` 以获得更好的性能。但有时这并不可能的，因为编译器不确定它是在翻译 `Int` 还是其他数据类型。例如，一个特定的 `Array[Any]` 可能只包含\
  \ `Int`，但编译器无法确定。\n\n在这些编译器不确定对象是否为值类型的情况下，编译器会使用对象并依赖包装类。例如，如 `java.lang.Integer`\
  \ 之类的包装类允许值类型被封装在 Java 对象内部，从而被需要对象的代码进行操作。[1]](#combining-scala-and-java.html_footemain31-1)\n\
  \n#### 单例对象\n\nJava 没有单例对象的精确对应物，但它有静态方法。Scala 对单例对象的翻译使用了静态实例方法的组合。对于每个 Scala 单例对象，编译器都会创建一个在末尾添加美元符号的\
  \ Java 类。对于名为 `App` 的单例对象，编译器生成一个名为 `App$` 的 Java 类。该类拥有 Scala 单例对象的所有方法和字段。\n\n\
  作为一个完整的示例，假设你编译了以下单例对象：\n\n```\nobject App {\n  def main(args: Array[String]) =\
  \ {\n    println(\"Hello, world!\")\n  }\n}\n```\n\nScala 将生成一个带有以下字段和方法的 Java `App$`\
  \ 类：\n\n```\n$ javap App$\n  Compiled from \"App.scala\"\n  public final class App$\
  \ {\n    public static final App$ MODULE$;\n    public static {};\n    public void\
  \ main(java.lang.String[]);\n  }\n```\n\n\n\n这是通用情况的翻译。一个重要的特例是，如果你有一个“独立”的单例对象，即一个不带有同名类的对象。例如，你可能有一个名为\
  \ `App` 的单例对象，但没有任何名为 `App` 的类。在这种情况下，编译器将创建一个名为 `App` 的 Java 类，该类为 Scala 单例对象的每个方法创建一个静态转发方法：\n\
  \n```\n $ javap App\n  Compiled from \"App.scala\"\n  public class App {\n    public\
  \ static void main(java.lang.String[]);\n    public App();\n  }\n```\n\n与此对比的是，如果你确实有一个名为\
  \ `App` 的类，Scala 将会创建一个对应的 Java `App` 类，用于存放你定义的 `App` 类的成员。在这种情况下，它不会为同名的单例对象添加任何转发方法，Java\
  \ 代码必须通过 `MODULE$` 字段访问该单例。\n\n### 作为接口的 Traits\n\n编译任何 trait 都会创建一个同名的 Java 接口。该接口可以作为\
  \ Java 类型使用，并允许你通过该类型的变量调用 Scala 对象上的方法。\n\n### 在 Java 中处理 trait 是另一回事。在通用情况下，这是不实用的；然而，有一个特例非常重要。如果你编写的是一个仅包含抽象方法的\
  \ Scala trait，那么该 trait 将直接翻译为 Java 接口，没有其他代码需要担心。本质上，这意味着如果你愿意，可以用 Scala 语法来编写\
  \ Java 接口。\n\n### 31.2 注解\n\nScala 的通用注解系统在 第 27 章 中进行了讨论。本节讨论了注解的 Java 特有方面。\n\n\
  #### 标准注解的额外影响\n\n某些注解会导致编译器在目标 Java 平台时产生额外信息。当编译器看到此类注解时，它首先根据通用 通规则对其进行处理，然后为\
  \ Java 执行额外的操作。\n\n**弃用 (Deprecation)**：对于任何标记为 `@deprecated` 的方法或类，编译器会在生成的代码中添加\
  \ Java 自身的弃用注解。因此，当 Java 代码访问已弃用的 Scala 方法时，Java 编译器可以发出弃用警告。\n\n**volatile 字段 (Volatile\
  \ fields)**：同样，Scala 中任何标记为 `@volatile` 的字段在生成的代码中都会赋予 Java 的 volatile 修饰符。因此，Scala\
  \ 中的 volatile 字段的行为完全符合 Java 的语义，且对 volatile 字段的访问严格按照 Java 内存模型中为 volatile 字段指定的规则排序。\n\
  \n**序列化 (Serialization)**\n\nScala 的两个标准序列化注解都翻译为 Java 等等项。`@serializable` 类会被添加\
  \ Java 的 `Serializable` 接口。`@SerialVersionUID(1234L)` 注解会被转换为 Java 字段定义：\n\n```\n\
  \ // Java serial version marker\n  private final static long SerialVersionUID =\
  \ 1234L\n```\n\n任何标记为 `@transient` 的变量都会被赋予 Java transient 修饰符。\n\n#### 抛出的异常\n\n\
  Scala 不检查抛出的异常是否被捕获。也就是说，Scala 在方法上没有等于 Java 的 `throws` 声明。所有的 Scala 方法都被翻译为不声明任何抛出异常的\
  \ Java 方法。\n\nScala 省略此功能的原因是 Java 对此的体验并非完全正面。因为使用 `throws` 子句标记方法是一项沉重的负担，太多的开发者编写吞\
  \ own 并丢弃异常的代码，以便让代码通过编译而不添加所有那些 `throws` 子句。他们可能打算以后改进异常处理，但经验表明，时间紧迫的程序员往往永远不会回来添加适当的异常处理。这种扭曲的结果是，这个本良好的功能往往导致代码变得*更不*可靠。大量的生产级\
  \ Java 代码吞并并隐藏了运行时异常，其原因是为了满足编译器。\n\n然而，有时在与 Java 接口时，你可能需要编写带有 Java 友好型注解的 Scala\
  \ 代码，以描述你的方法可能抛出的异常。例如，RMI 远程接口中的每个方法都要求在其 `throws` 子句中提到 `java.io.RemoteException`。因此，如果你想用带有抽象方法的\
  \ Scala trait 编写 RMI 远程接口，你需要在这些方法的 `throws` 子句中列出 `RemoteException`。为了实现这一点，你只需要用\
  \ `@throws` 注解标记你的方法即可。例如，列表 31.1 所示的 Scala 类有一个方法被标记为抛出 `IOException`。\n\n```\n\
  \ import java.io._\n  class Reader(fname: String) {\n    private val in =\n    \
  \  new BufferedReader(new FileReader(fname))\n\n    @throws(classOf[IOException])\n\
  \    def read() = in.read()\n  }\n```\n\n##### 列表 31.1 - 一个声明 Java throws 子句的 Scala\
  \ 方法。\n\n它在 Java 看起来是这样的：\n\n```\n $ javap Reader\n  Compiled from \"Reader.scala\"\
  \n  public class Reader {\n  public int read() throws java.io.IOException;\n  public\
  \ Reader(java.lang.String);\n  }\n```\n\n注意，`read` 方法通过 Java `throws` 子句指示它可能抛出\
  \ `IOException`。\n\n#### Java 注解\n\nJava 框架中的现有注解可以直接在 Scala 代码中使用。任何 Java 框架看到你编写的注解都就像你是在编写\
  \ Java 代码一样。\n\n许多 Java 包都使用注解。以 JUnit 4 为例，JUnit 是一个用于编写和运行自动化测试的框架。最新版本的 JUnit\
  \ 4 使用注解来指示你的代码中哪些部分是测试。其思想是为你的代码编写许多测试，然后每当你更改源代码时运行这些测试。这样，如果你的更改引入了新的 Bug，其中一个测试将会失败，你会立即发现。\n\
  \n编写测试非常简单。你只需要在顶层类中写一个方法来执行你的代码，并使用注解将该方法标记为测试。它看起来如下：\n\n```\n import org.junit.Test\n\
  \  import org.junit.Assert.assertEquals\n\n  class SetTest {\n\n    @Test\n    def\
  \ testMultiAdd = {\n      val set = Set() + 1 + 2 + 3 + 1 + 2 + 3\n      assertEquals(3,\
  \ set.size)\n    }\n  }\n```\n\n`testMultiAdd` 方法是一个测试。该测试向集合中添加多个项，并确保每个项只被添加一次。作为\
  \ JUnit API 一部分的 `assertEquals` 方法检查其两个参数是否相等。如果它们不同，则测试失败。在这种情况下，该测试验证了重复添加相同的数字不会增加集合的大小。\n\
  \n该测试使用 `org.junit.Test` 注解进行标记。注意，该注解已导入，因此可以简单地引用为 `@Test` 而不是更繁琐的 `@org.junit.Test`。\n\
  \n就这些了。可以使用任何 JUnit 测试运行器运行测试。这里它是使用命令行测试运行器运行的：\n\n```\n $ scala -cp junit-4.3.1.jar:.\
  \ org.junit.runner.JUnitCore SetTest\n  JUnit version 4.3.1\n  .\n  Time: 0.023\n\
  \n  OK (1 test)\n```\n\n#### 编写自定义注解\n\n要创建一个对 Java 反射可见的注解，必须使用 Java 符号并用 `javac`\
  \ 编译它。对于这种用例，在 Scala 中编写注解似乎没有帮助，因此标准编译器不支持它。理由是 Scala 的支持不可避免地无法达到 Java 注解的所有可能，而且\
  \ Scala 可能有一天会有它自己的反射，届时你将希望通过 Scala 反射访问 Scala 注解。\n\n这是一个示例注解：\n\n```\n import\
  \ java.lang.annotation.*; // 这是 Java\n  @Retention(RetentionPolicy.RUNTIME)\n  @Target(ElementType.METHOD)\n\
  \  public @interface Ignore { }\n```\n\n用 javac 编译上述内容后，你可以按照以下方式使用该注解：\n\n\n\n\n\
  \n```scala\n object Tests {\n  @Ignore\n  def testData = List(0, 1, -1, 5, -5)\n\
  \n  def test1 = {\n    assert(testData == (testData.head :: testData.tail))\n  }\n\
  \n  def test2 = {\n    assert(testData.contains(testData.head))\n  }\n}\n```\n\n\
  在这个示例中，`test1` 和 `test2`  intended 应该是测试方法，但 `testData` 应该被忽略，尽管它的名字以 \"test\" 开头。\n\
  \n要查看这些注解何时存在，你可以使用 Java 反射 API。这里是展示其如何工作的示例代码：\n\n```scala\n for {\n  method <-\
  \ Tests.getClass.getMethods\n  if method.getName.startsWith(\"test\")\n  if method.getAnnotation(classOf[Ignore])\
  \ == null\n} {\n  println(\"found a test method: \" + method)\n}\n```\n\n在这里，使用了反射方法\
  \ `getClass` 和 `getMethods` 来检查输入对象类的所有字段。这些是标准的反射方法。特定注解的部分是使用了方法 `getAnnotation`。许多反射对象都有一个\
  \ `getAnnotation` 方法用于搜索特定类型的注解。在这种情况下，代码在寻找我们新定义的 `Ignore` 类型的注解。由于这是一个 Java API，成功取决于结果是\
  \ `null` 还是一个实际的注解对象。\n\n以下是代码的运行情况：\n\n```bash\n $ javac Ignore.java\n $ scalac\
  \ Tests.scala\n $ scalac FindTests.scala\n $ scala FindTests\nfound a test method:\
  \ public void Tests$.test2()\nfound a test method: public void Tests$.test1()\n\
  ```\n\n顺带一提，注意当使用 Java 反射查看时，方法是在 `Tests$` 类中而不是 `Tests` 类中。正如章节开头描述的，Scala 单例对象的实现被放置在一个在名称末尾添加了美元符号（`$`）的\
  \ Java 类中。在这种情况下，`Tests` 的实现在 Java 类 `Tests$` 中。\n\n请注意，当你使用 Java 注解时，必须在它们的局限性内工作。例如，在注解的参数中你只能使用常量而不能使用表达式。你可以支持\
  \ `@serial(1234)` 但不支持 `@serial(x * 2)`，因为 `x * 2` 不是一个常量。\n\n### 31.3 通配符类型\n\n\
  所有的 Java 类型都有对应的 Scala 类型。这是必要的，以便 Scala 代码可以访问任何合法的 Java 类。大多数情况下，这种转换是直接的。Java\
  \ 中的 `Pattern` 在 Scala 中是 `Pattern`，Java 中的 `Iterator<Component>` 在 Scala 中是 `Iterator[Component]`。但在某些情况下，你到目前为止看到的\
  \ Scala 类型是不够的。对于 Java 通配符类型如 `Iterator<?>` 或 `Iterator<? extends Component>`，可以做什么？对于省略了类型参数的原始类型如\
  \ `Iterator`，可以做什么？对于 Java 通配符类型和原始类型，Scala 使用了一种额外的类型，也称为通配符类型（wildcard type）。\n\
  \n通配符类型使用`占位符语法`编写，就像[第 8.5 节]描述的简写函数字面量一样。在函数字面量的简写中，你可以使用下划线（`_`）代替表达式；例如，`(_\
  \ + 1)` 等于 `(x => x + 1)`。通配符类型使用了相同的思想，只是针对类型而不是表达式。如果你编写 `Iterator[_]`，那么下划线正在替换一个类型。这种类型代表一个元素类型未知的\
  \ Iterator。\n\n在使用这种占位符语法时，你也可以插入上界和下界。只需在下划线后添加边界，使用与类型参数相同的 `<:` 语法（[第 19.8 节]和[第\
  \ 19.5 节]）。例如，类型 `Iterator[_ <: Component]` 是一个元素类型未知的迭代，但无论是什么类型，必须是 `Component`\
  \ 的子类型。\n\n这就是编写通配符类型的方法，但如何使用它呢？在简单的情况下，你可以忽略通配符并在基类型上调用方法。例如，假设你有以下 Java 类：\n\n\
  ```java\n // 这是一个带有通配符的 Java 类\n  import java.util.*;\n  public class Wild {\n \
  \ public Collection<?> contents() {\n      Collection<String> stuff = new Vector<String>();\n\
  \      stuff.add(\"a\");\n      stuff.add(\"b\");\n      stuff.add(\"see\");\n \
  \     return stuff;\n  }\n  }\n```\n\n如果你在 Scala 代码中访问它，你会发现它有一个通配符类型：\n\n```scala\n\
  \ scala> val contents = (new Wild).contents\n  contents: java.util.Collection[_]\
  \ = [a, b, see]\n```\n\n如果你想知道这个集合中有多少元素，你可以简单地忽略通配符部分并像常一样调用 `size` 方法：\n\n```scala\n\
  \ scala> contents.size()\n  res0: Int = 3\n```\n\n在更复杂的情况下，通配符类型可能会很麻烦。假设你想知道这个集合中有多少元素，你只是简单的忽略通配符部分并正常地调用\
  \ `size` 方法。通配符类型可能会变得很奇怪。由于通配符类型没有名字，你无法写出类型：\n\n```scala\n import scala.mutable\n\
  \  val iter = (new Wild).contents.iterator\n  val set = mutable.empty[???]     \
  \ // 这里填什么类型？\n  while (iter.hasNext)\n    set += iter.next()\n```\n\n你可以看到为什么 Scala\
  \ 代码通常不使用通配符类型。为了对它们进行复杂的操作，你倾向于将它们转换为使用抽象成员。所以你从一开始可能就可以使用抽象成员。\n\n### 31.4 编译\
  \ Scala 和 Java\n\n通常当你编译依赖于 Java 代码的 Scala 代码时，首先编译 Java 代码到类文件。然后你编译 Scala 代码，并将\
  \ Java 代码的类文件放在类路径上。然而，如果 Java 代码引用了 Scala 代码，这种方法就不起通了。这种情况并不罕见；只需要在一个纯 Java 项目中将一个\
  \ Java 源文件替换为 Scala 源文件。在这种情况下，无论你以什么顺序编译代码，总会有未满足的外部引用。\n\n为了支持这种构建，Scala 允许针对\
  \ Java 源以及 Java 类文件进行编译。你只需要将 Java 源文件像 Scala 文件一样放在命令行中即可。Scala 编译器不会编译这些 Java\
  \ 文件，但它会扫描它们以查看包含的内容。要使用此功能，你首先使用 Java 源文件编译 Scala 代码，然后使用 Scala 类文件编译 Java 代码。\n\
  \n这是一个典型的命令序列：\n\n```bash\n $ scalac -d bin InventoryAnalysis.scala InventoryItem.java\
  \ \\\n  Inventory.java\n $ javac -cp bin -d bin Inventory.java InventoryItem.java\
  \ \\\n  InventoryManagement.java \n $ scala -cp bin InventoryManagement\nMost expensive\
  \ item = rocket($4.99)\n```\n\n### 31.5 Java 8 集成\n\n\n\n\n\nJava 8 对 Java 语言和字节码进行了一些改进，Scala\
  \ 从 2.12 版本开始利用这些改进[[3]](#combining-scala-and-java.html_footnotemain31-3)。通过利用 Java\
  \ 8 的新特性，Scala 编译器可以生成更小的类文件和 jar 文件，并提高 trait 的二进制兼容性。\n\n### Lambda 表达式与 \"SAM\"\
  \ 类型\n\n从 Scala 程序员的角度来看，Scala 2.12 中最可见的 Java 8 相关增强是：Scala 函数字面量可以像 Java 8 Lambda\
  \ 表达式一样使用，作为匿名类实例表达式的更简洁的形式。在 Java 8 之前，为了将行为传递给方法，Java 程序员通常会定义匿名内部类实例，如下所示：\n\n\
  ```\nJButton button = new JButton(); // 这是 Java\n  button.addActionListener(\n \
  \ new ActionListener() {\n    public void actionPerformed(ActionEvent event) {\n\
  \      System.out.println(\"pressed!\");\n    }\n  }\n  );\n```\n\n在这个示例中，创建了一个\
  \ `ActionListener` 的匿名实例并将其传递给 Swing `JButton` 的 `addActionListener` 方法。当用户点击按钮时，Swing\
  \ 将调用该实例上的 `actionPerformed` 方法，该方法会打印 \"pressed!\"。\n\n在 Java 8 中，Lambda 表达式可以用任何任何需要包含单个抽象方法（SAM，Single\
  \ Abstract Method）的类或接口实例的地方。`ActionListener` 就是这样一个接口，因为它只包含一个抽象方法 `actionPerformed`。因此，可以使用\
  \ Lambda 表达式来在 Swing 按钮上注册动作监听器。这里有一个示例：\n\n```\nJButton button = new JButton();\
  \ // 这是 Java 8\n  button.addActionListener(\n  event -> System.out.println(\"pressed!\"\
  )\n  );\n```\n\n在 Scala 中，你可以在相同的情况下使用匿名内部类实例，但你可能更倾向于使用函数字面量，如下：\n\n```scala\n\
  val button = new JButton\n  button.addActionListener( \n    _ => println(\"pressed!\"\
  )\n  )\n```\n\n正如你在第 21.1 节中看到的，你可以通过定义从 `ActionEvent => Unit` 函数类型到 `ActionListener`\
  \ 的隐式转换来支持这种编码风格。\n\nScala 即使在没有这种隐式转换的情况下也允许在这种情况下使用函数字面量。与 Java 8 一样，Scala 将在需要声明单个抽象方法（SAM）的类或\
  \ trait 实例的地方使用函数类型。这在 Scala 2.12 及更高版本中适用于任何 SAM。例如，你可以定义一个名为 `Increaser` 的 trait，它包含一个单抽象方法\
  \ `increase`：\n\n```scala\nscala> trait Increaser {\n          def increase(i: Int):\
  \ Int\n        }\ndefined trait Increaser\n```\n\n然后你可以定义一个接收 `Increaser` 的方法：\n\
  \n```scala\nscala> def increaseOne(increaser: Increaser): Int =\n          increaser.increase(1)\n\
  \  increaseOne: (increaser: Increaser)Int\n```\n\n要调用你的新方法，可以传递一个 trait `Increaser`\
  \ 的匿名实例，如下：\n\n```scala\nscala> increaseOne(\n          new Increaser {\n      \
  \      def increase(i: Int): Int = i + 7\n          }\n        )\n  res0: Int =\
  \ 8\n```\n\n但在 Scala 2.12 中，你也可以直接使用函数字面量，因为 `Increaser` 是一个 SAM 类型：\n\n```scala\n\
  scala> increaseOne(i => i + 7) // Scala 2.12\n  res1: Int = 8\n```\n\n### 在 Scala\
  \ 中使用 Java 8 Streams\n\nJava 的 `Stream` 是一个函数数据结构，提供了一个接受 `java.util.function.IntUnaryOperator`\
  \ 的 `map` 方法。从 Scala 中，你可以调用 `Stream.map` 来递增 `Array` 中的每个元素，如下：\n\n```scala\nscala>\
  \ import java.util.function.IntUnaryOperator\n  import java.util.function.IntUnaryOperator\n\
  \n  scala> import java.util.Arrays\n  import java.util.Arrays\n\n  scala> val stream\
  \ = Arrays.stream(Array(1, 2, 3))\n  stream: java.util.stream.IntStream = ...\n\n\
  \  scala> stream.map(\n            new IntUnaryOperator {\n            def applyAsInt(i:\
  \ Int): Int = i + 1\n          }\n      ).toArray\n  res3: Array[Int] = Array(2,\
  \ 3, 4)\n```\n\n由于，由于 `IntUnaryOperator` 是 SAM 类型，在 Scala 2.12 及更高版本中，你也可以用更简洁的函数字面量调用它：\n\
  \n```scala\nscala> val stream = Arrays.stream(Array(1, 2, 3))\n  stream: java.util.stream.IntStream\
  \ = ...\n\n  scala> stream.map(i => i + 1).toArray // Scala 2.12\n  res4: Array[Int]\
  \ = Array(2, 3, 4)\n```\n\n请注意，只有函数字面量会被适配为 SAM 类型，而不是具有函数类型的任意表达式。例如，考虑以下 `val`\
  \ `f`，它的类型为 `Int => Int`：\n\n```scala\nscala> val f = (i: Int) => i + 1\n  f: Int\
  \ => Int = ...\n```\n\n尽管 `f` 的类型与之前传递给 `stream.map` 的函数字面量相同，但你不能在需要 `IntUnaryOperator`\
  \ 的地方使用 `f`：\n\n```scala\nscala> val stream = Arrays.stream(Array(1, 2, 3))\n  stream:\
  \ java.util.stream.IntStream = ...\n\n  scala> stream.map(f).toArray\n  <console>:16:\
  \ error: type mismatch;\n  found   : Int => Int\n  required: java.util.function.IntUnaryOperator\n\
  \            stream.map(f).toArray\n```\n\n要使用 `f`，可以使用函数字面量显式调用它，如下：\n\n```scala\n\
  scala> stream.map(i => f(i)).toArray\n  res5: Array[Int] = Array(2, 3, 4)\n```\n\
  \n### 31.6 总结\n\n通常你可以忽略 Scala 是实现的，只需编写并运行代码。但有时查看“内部机制”很有帮助，本章探讨了 Scala 在 Java\
  \ 平台上的三个方面：转换的形式、Scala 和 Java 注解如何工作，以及 Scala 的通配类型如何让你访问 Java 通配类型。它还涵盖了从 Scala\
  \ 使用 Java 原语以及编译混合 Scala 和 Java 项目。当你混合使用 Scala 和 Java 时，这些主题非常重要。\n\n* * *\n\n\
  第 31 章脚注：\n\n[1] 值类型的实现已在第 11.2 节中详细讨论。\n\n[2] 这这一切之所以有效，是因为 Java 字节码验证器根本不检查声明！Java\
  \ 编译器会检查，但验证器不会。\n\n[3] 从 2.12 开始，Scala 需要 Java 8 以便它可以利用 Java 8 的特性。\n\n# 32 章\
  \ Future 与并发\n\n多核处理器普及的后果之一是对并发的兴趣日益增加。Java 提供了基于共享内存和锁的并发支持。虽然这种支持是足够的，但在实践中正确使用这种方法证明非常困难。Scala\
  \ 标准库提供了一种替代方案，通过关注不可变状态的异步转换来避免这些困难：`Future`。\n\n\n\n\n相比之下，你可以对 Scala `Future`\
  \ 指定转换，无论它是否已经完成。每次转换都会产生一个新的 `Future`，代表对原始 `Future` 经过函数转换后的异步结果。执行计算的线程由隐式提供的执行上下文（execution\
  \ context）决定。这允许你将异步计算描述为一系列对不可变值的转换，而无需考虑共享内存和锁的问题。\n\n#### 乐园中的烦恼\n\n在 Java 平台上，每个对象都关联一个逻辑\
  \ `monitor`（监视器），它可以被用于控制对数据的多线程访问。要使用这种模型，你需要决定哪些数据将被多个线程共享，并将访问或控制访问共享数据的代码段标记为“synchronized”（同步）区域。Java\
  \ 运行时采用锁定机制，确保同一时刻只有一个线程进入由同一锁保护的同步区域，从而允许你协调对共享数据的多线程访问。\n\n为了兼容性，Scala 提供了对 Java\
  \ 并发原语的访问方法。`wait`、`notify` 和 `notifyAll` 方法可以在 Scala 中调用，它们的含义与 Java 中相同。Scala\
  \ 在技术上没有 `synchronized` 关键字，但它包含一个预定义的 `synchronized` 方法，可以如下所示调用：\n\n```\nvar counter\
  \ = 0\nsynchronized {\n  // 一时间只有一个线程进入这里\n  counter = counter + 1\n}\n```\n\n遗憾的是，程序员发现，使用共享数据和锁模型来可靠地构建健壮的多线程应用程序非常困难，特别是当应用程序规模和复杂性增加时。问题在于，在程序的每个点，你都必须推导出你正在修改或访问哪些可能被其他线程修改或访问的数据，以及正持有哪些锁。在每次方法调用时，你都必须推导出它将尝试持有哪些锁，并说服自己它尝试获取锁时不会发生死锁。更严重的问题是，你所推理的锁在编译时并不是固定的，因为程序在运行过程中可以自由创建新锁。\n\
  \n更糟糕的是，多线程代码的测试不可靠的。由于线程是非确定性的，你可能成功地测试了程序一千次——但该程序在客户机器上首次运行时仍可能出错。使用共享数据和锁，你必须仅通过推理来确保程序的正确性。\n\
  \n此外，你无法通过过度同步来解决问题。同步所有内容可能和什么都不同步一样具有问题性。虽然新的锁操作可能会消除竞态条件的可能性，但它们同时也增加了死锁的可能性。一个正确的使用锁程序必须既没有竞态条件也没有死锁，因此你不能通过在任何一个方向上过度操作来求险。\n\
  \n`java.util.concurrent` 库为并发编程提供了更高层次的抽象。使用并发工具使得多线程编程比使用 Java 的低级同步原语自己实现抽象要容易出错得多。然而，并发工具也基于共享数据和锁模型，因此并没有解决使用该模型时的根本性困难。\n\
  \n#### 异步执行与 Try\n\n虽然 Scala `Future` 并不是万灵药，但它提供了一种处理并发的方法，这种方法可以减少并通常消除对共享数据和锁的推理需求。当你调用一个\
  \ Scala 方法时，它会在“你等待的同时”执行计算并返回结果。如果该结果是一个 `Future`，那么这个 `Future` 代表另一个将异步执行的计算，通常由完全不同的线程执行。因此，对\
  \ `Future` 的许多操作需要一个隐式的 `execution context`，该上下文提供了一个异步执行函数的策略。例如，如果你尝试通过 `Future.apply`\
  \ 工厂方法创建一个 future，但不提供隐式的执行上下文（即 `scala.concurrent.ExecutionContext` 的实例），你将得到编译错误：\n\
  \n```\nscala> import scala.concurrent.Future\nimport scala.concurrent.Future\n\n\
  scala> val fut = Future { Thread.sleep(10000); 21 + 21 }\n<console>:11: error: Cannot\
  \ find an implicit ExecutionContext.\n    You might pass an (implicit ec: ExecutionContext)\n\
  \    parameter to your method or import\n    scala.concurrent.ExecutionContext.Implicits.global.\n\
  \      val fut = Future { Thread.sleep(10000); 21 + 21 }\n                ^\n```\n\
  \n错误消息提供了一种解决问题的方法：导入 Scala 提供的全局执行上下文。在 JVM 上，全局执行上下文使用线程池。一旦你将隐式执行上下文引入作用域，你就可以创建一个\
  \ future：\n\n```\nscala> import scala.concurrent.ExecutionContext.Implicits.global\n\
  import scala.concurrent.ExecutionContext.Implicits.global\n\nscala> val fut = Future\
  \ { Thread.sleep(10000); 21 + 21 }\nfut: scala.concurrent.Future[Int] = ...\n```\n\
  \n上一个示例中创建的 future 使用全局上下文异步执行，然后带有值 42 完成。一旦它开始，该线程将睡眠几秒。`Future` 上的两个方法允许你轮询：`isCompleted`\
  \ 和 `value`。在尚未完成的 future 上调用它们时，`isCompleted` 将返回 `false`，`value` 将返回 `None`。\n\
  \n```\nscala> fut.isCompleted\nres0: Boolean = false\n\nscala> fut.value\nres1:\
  \ Option[scala.util.Try[Int]] = None\n```\n\n一旦 future 完成（在本例中是十秒之后），`isCompleted`\
  \ 将返回 `true`，`value` 将返回一个 `Some`：\n\n```\nscala> fut.isCompleted\nres2: Boolean\
  \ = true\n\nscala> fut.value\nres3: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n`value` 返回的 option 包含一个 `Try`。如图 32.1 所示，`Try` 要么 `Success`（包含一个类型为 `T` 的值），则是\
  \ `Failure`（包含一个异常，即 `java.lang.Throwable` 的实例）。`Try` 的目的是为异步计算提供类似于 `try` 表达式为同步计算提供的功能：它允许你处理计算可能因异常而异常终止的可能性。\n\
  \n对于同步计算，你可以使用 `try/catch` 来确保调用方法的线程能够捕获并处理该方法抛出的异常。然而，对于异步计算，启动计算的线程会继续执行其他任务。以后如果该异步计算因异常失败，原始线程将无法在\
  \ catch 句中处理该异常。因此，当处理代表异步活动的 `Future` 时，你使用 `Try` 来处理该活动未能产生值的情况。这里有一个示例展示了异步活动失败时会发生什么：\n\
  \n```\nscala> val fut = Future { Thread.sleep(10000); 21 / 0 }\nfut: scala.concurrent.Future[Int]\
  \ = ...\n\nscala> fut.value\nres4: Option[scala.util.Try[Int]] = None\n```\n\n然后，在十秒之后：\n\
  \n```\nscala> fut.value\nres5: Option[scala.util.Try[Int]] = Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n#### 使用 Futures\n\nScala 的 `Future` 允许你对 `Future` 结果指定转换，并获取一个代表两个异步计算组合的新\
  \ future：即原始计算和转换计算。\n\n\n\n\n\n## 使用 map 转换 Future\n\n最基础的操作之一是 `map`。你不需要阻塞后继续进行另一个计算，只需将下一次计算映射（map）到未来（future）上。结果将是一个新的\
  \ future，它代表了原始异步计算的结果，并通过传递给 `map` 的函数对该结果进行了异步转换。\n\n例如，以下 future 将在十秒后完成：\n\n\
  ```scalascala> val fut = Future { Thread.sleep(10000); 21 + 21 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n使用一个加 1 的函数对此 future 进行映射，将产生另一个 future。这个新 future 将代表一个由原始加法和随后的加法组成的计算：\n\
  \n```scala\nscala> val result = fut.map(x => x + 1)\n  result: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> result.value\n  res5: Option[scala.util.Try[Int]] = None\n```\n\
  \n一旦原始 future 完成且函数已应用于其结果，由 `map` 返回的 future 就会完成：\n\n```scala\nscala> result.value\n\
  \  res6: Option[scala.util.Try[Int]] = Some(Success(43))\n```\n\n注意，此示例中执行的操作——future\
  \ 的创建、`21 + 21` 的和计算以及 `42 + 1` 的递加——可能由三个不同的线程执行。\n\n## 使用 for 表达式转换 Future\n\n\
  由于 Scala 的 future 也声明了 `flatMap` 方法，因此你可以使用 `for` 表达式来转换 futures。例如，考虑以下两个 future，它们将在十秒后产生\
  \ 42 和 46：\n\n```scala\nscala> val fut1 = Future { Thread.sleep(10000); 21 + 21\
  \ }\n  fut1: scala.concurrent.Future[Int] = ...\n\n  scala> val fut2 = Future {\
  \ Thread.sleep(10000); 23 + 23 }\n  fut2: scala.concurrent.Future[Int] = ...\n```\n\
  \n给定这两个 futures，你可以像这样获取一个代表它们结果异步之和的新的 future：\n\n```scala\nscala> for {\n    \
  \    x <- fut1\n        y <- fut2\n      } yield x + y\n  res7: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n一旦原始 futures 完成且随后的加法完成，你就能看到结果：\n\n```scala\nscala> res7.value\n\
  \  res8: Option[scala.util.Try[Int]] = Some(Success(88))\n```\n\n由于 `for` 表达式会序列化它们的转换，如果你没有在\
  \ `for` 表达式之前创建这些 futures，它们将不会并行运行。例如，虽然之前的 `for` 表达式大约需要十秒才能完成，但接下来的 `for` 表达式至少需要二十秒：\n\
  \n```scala\nscala> for {\n        x <- Future { Thread.sleep(10000); 21 + 21 }\n\
  \        y <- Future { Thread.sleep(10000); 23 + 23 }\n      } yield x + y\n  res9:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> res9.value\n  res27: Option[scala.util.Try[Int]]\
  \ = None\n\n  scala> // 将至少需要 20 秒才能完成\n\n  scala> res9.value\n  res28: Option[scala.util.Try[Int]]\
  \ = Some(Success(88))\n```\n\n## 创建 Future: Future.failed, Future.successful, Future.fromTry\
  \ 和 Promises\n\n除了早期示例中用于创建 futures 的 `apply` 方法外，`Future` 伴随对象还包含了三个用于创建已完成 future\
  \ 的工厂方法：`successful`、`failed` 和 `fromTry`。这些工厂方法不需要 `ExecutionContext`。\n\n`successful`\
  \ 工厂方法创建一个已经成功的 future：\n\n```scala\nscala> Future.successful { 21 + 21 }\n  res2:\
  \ scala.concurrent.Future[Int] = ...\n```\n\n`failed` 方法创建一个已经失败的 future：\n\n```scala\n\
  scala> Future.failed(new Exception(\"bummer!\"))\n  res3: scala.concurrent.Future[Nothing]\
  \ = ...\n```\n\n`fromTry` 方法从一个 `Try` 创建一个已经完成的 future：\n\n```scala\nscala> import\
  \ scala.util.{Success,Failure}\n  import scala.util.{Success, Failure}\n\n  scala>\
  \ Future.fromTry(Success { 21 + 21 }) \n  res4: scala.concurrent.Future[Int] = ...\n\
  \n  scala> Future.fromTry(Failure(new Exception(\"bummer!\"))) \n  res5: scala.concurrent.Future[Nothing]\
  \ = ...\n```\n\n创建 future 最通用的方法是使用 `Promise`。给定一个 `promise`，你可以获得一个由该 `promise`\
  \ 控制的 future。当完成 promise 时，future 就会完成。这里是一个示例：\n\n```scala\nscala> val pro = Promise[Int]\n\
  \  pro: scala.concurrent.Promise[Int] = ...\n\n  scala> val fut = pro.future\n \
  \ fut: scala.concurrent.Future[Int] = ...\n\n  scala> fut.value\n  res8: Option[scala.util.Try[Int]]\
  \ = None\n```\n\n你可以使用名为 `success`、`failure` 和 `complete` 的方法来完成 promise。`Promise`\
  \ 的这些方法与之前描述的构建已完成 future 的方法类似。例如，`success` 方法将成功完成 future：\n\n```scala\nscala>\
  \ pro.success(42)\n  res9: Option[scala.util.Try[Int]] = Some(Success(42))\n\n \
  \ scala> fut.value\n  res10: Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\
  \n`failure` 方法将使 future 失败：\n\n```scala\nscala> pro.failure(new Exception(\"bummer!\"\
  ))\n```\n\n`complete` 方法可以根据 `Try` 来完成 future。`completeWith` 方法可以传入指定的 future。\n\
  \n## 过滤：filter 和 collect\n\nScala 的 future 提供了两个方法 `filter` 和 `collect`，它们允许你验证\
  \ future 的值。`filter` 方法确保未来值是有效的。这里有一个确保 int 为正数的示例：\n\n```scala\nscala> val fut\
  \ = Future { 42 }\n  fut: scala.concurrent.Future[Int] = ...\n\n  scala> val valid\
  \ = fut.filter(_ > 0)\n  valid: scala.concurrent.Future[Int] = ...\n\n  scala> valid.value\n\
  \  res0: Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n如果无效，`filter` 返回的\
  \ future 将以 `NoSuchElementException` 失败：\n\n```scala\nscala> val invalid = fut.filter(_\
  \ < 0)\n  invalid: scala.concurrent.Future[Int] = ...\n\n  scala> invalid.value\n\
  \  res1: Option[scala.util.Try[Int]] = Some(Failure(java.util.NoSuchElementException:\
  \ Future.predicate is not satisfied))\n```\n\n由于 future 还提供了 `withFilter` 方法，你可以使用\
  \ `for` 表达式执行相同的操作：\n\n```scala\nscala> val valid = for {\n        x <- fut if x\
  \ > 0\n      } yield x\n  valid: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ valid.value\n  res2: Option[scala.util.Try[Int]] = Some(Success(42))\n\n  scala>\
  \ val invalid = for {\n        x <- fut if x < 0\n      } yield x\n  invalid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> invalid.value\n  res3: Option[scala.util.Try[Int]] = Some(Failure(java.util.NoSuchElementException:\
  \ Future.predicate is not satisfied))\n```\n\n`future` 的 `collect` 方法允许你一次性验证未来值并对其转换。如果传递给\
  \ `collect` 的部分函数在 future 结果处定义，则 `collect` 返回的 future 将以函数转换后的值成功：\n\n```scala\n\
  scala> val valid = fut.collect { case res if res > 0 => res + 46 }\n  valid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> valid.value\n  res4: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n否则，future 将以 `NoSuchElementException` 失败：\n\n```scala\nscala> val invalid\
  \ = fut.collect { case res if res < 0 => res + 46 }\n  invalid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> invalid.value\n  res5: Option[scala.util.Try[Int]] = Some(Failure(java.util.NoSuchElementException:\
  \ Future.collect partial function is not defined at: 42))\n```\n\n## 处理失败：failed,\
  \ fallbackTo, recover 和 recoverWith\n\nScala 的 future 提供了处理失败 futures 的方法，包括 `failed`、`fallbackTo`、`recover`\
  \ 和 `recoverWith`。`failed` 方法将任何类型的失败 future 转换为一个成功的 `Future[Throwable]`，其中持有着导致失败的异常。这里是一个示例：\n\
  \n\n\n\n\n```scala\nscala> val failure = Future { 42 / 0 }\n  failure: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> failure.value\n  res23: Option[scala.util.Try[Int]] =\n  Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n\n  scala> val expectedFailure = failure.failed\n  expectedFailure:\
  \ scala.concurrent.Future[Throwable] = ...\n\n  scala> expectedFailure.value\n \
  \ res25: Option[scala.util.Try[Throwable]] =\n  Some(Success(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n如果调用 `failed` 方法的 future 最终成功了，那么 `failed` 返回的 future 本身将以\
  \ `NoSuchElementException` 失败。因此，`failed` 方法仅在你预期该 future 会失败时才适用。这里有一个示例：\n\n```scala\n\
  \ scala> val success = Future { 42 / 1 }\n  success: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> success.value\n  res21: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  \n  scala> val unexpectedSuccess = success.failed\n  unexpectedSuccess: scala.concurrent.Future[Throwable]\
  \ = ...\n\n  scala> unexpectedSuccess.value\n  res26: Option[scala.util.Try[Throwable]]\
  \ =\n  Some(Failure(java.util.NoSuchElementException:\n  Future.failed not completed\
  \ with a throwable))\n```\n\n`fallbackTo` 方法允许你在调用 `fallbackTo` 的 future 失败时提供一个备用的\
  \ future。这里有一个失败的 future 回退到成功 future 的示例：\n\n```scala\n scala> val fallback = failure.fallbackTo(success)\n\
  \  fallback: scala.concurrent.Future[Int] = ...\n\n  scala> fallback.value\n  res27:\
  \ Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n如果调用 `fallbackTo` 的原始\
  \ future 失败了，那么传递给 `fallbackTo` 的 future 的失败将实质上被忽略了。`fallbackTo` 返回的 future 将以初始异常失败。这里有一个示例：\n\
  \n```scala\n scala> val failedFallback = failure.fallbackTo(\n          Future {\
  \ val res = 42; require(res < 0); res }\n          )\n  failedFallback: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> failedFallback.value\n  res28: Option[scala.util.Try[Int]] =\n\
  \  Some(Failure(java.lang.ArithmeticException: / by zero))\n```\n\n`recover` 方法允许你将失败的\
  \ future 转换为成功的 future，从而让成功 future 的结果原样传递通过。例如，对于一个因 `ArithmeticException` 失败的\
  \ future，你可以使用 `recover` 方法将失败转换为成功，如下所示：\n\n```scala\n scala> val recovered = failedFallback\
  \ recover {\n          case ex: ArithmeticException => -1\n        }\n  recovered:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> recovered.value\n  res32: Option[scala.util.Try[Int]]\
  \ = Some(Success(-1))\n```\n\n如果原始 future 没有失败，`recover` 返回的 future 将以相同的值完成：\n\n\
  ```scala\n scala> val unrecovered = fallback recover {\n          case ex: ArithmeticException\
  \ => -1\n        }\n  unrecovered: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ unrecovered.value\n  res33: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n同样，如果传递给 `recover` 的部分函数在原始 future 最终失败的异常没有定义，那么原始的失败将传递通过：\n\n```scala\n\
  \ scala> val alsoUnrecovered = failedFallback recover {\n          case ex: IllegalArgumentException\
  \ => -2\n        }\n  alsoUnrecovered: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ alsoUnrecovered.value\n  res34: Option[scala.util.Try[Int]] =\n  Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n`recoverWith` 方法与 `recover` 类似，不同之处在于不是像 `recover` 那样恢复到一个值，而是\
  \ `recoverWith` 方法允许你恢复到一个 future 值。这里有一个示例：\n\n```scala\n scala> val alsoRecovered\
  \ = failedFallback recoverWith {\n          case ex: ArithmeticException => Future\
  \ { 42 + 46 }\n        }\n  alsoRecovered: scala.concurrent.Future[Int] = ...\n\n\
  \  scala> alsoRecovered.value\n  res35: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n与 `recover` 一样，如果原始 future 没有失败，或者传递给 `recoverWith` 的部分函数在原始 future 最终失败的异常没有定义，原始的成功（或失败）将传递给\
  \ `recoverWith` 返回的 future。\n\n### 映射两种可能性：transform\n\n`Future` 的 `transform` 方法接受两个函数来转换\
  \ future：一个在成功时使用，另一个在失败时使用：\n\n```scala\n scala> val first = success.transform(\n\
  \          res => res * -1,\n          ex => new Exception(\"see cause\", ex)\n\
  \        )\n  first: scala.concurrent.Future[Int] = ...\n```\n\n如果 future 成功，则使用第一个函数：\n\
  \n```scala\n scala> first.value\n  res42: Option[scala.util.Try[Int]] = Some(Success(-42))\n\
  ```\n\n如果 future 失败，则使用第二个函数：\n\n```scala\n scala> val second = failure.transform(\n\
  \          res => res * -1,\n          ex => new Exception(\"see cause\", ex)\n\
  \        )\n  second: scala.concurrent.Future[Int] = ...\n\n  scala> second.value\n\
  \  res43: Option[scala.util.Try[Int]] =\n  Some(Failure(java.lang.Exception: see\
  \ cause))\n```\n\n注意，使用前面示例中显示的 `transform` 方法，你不能将一个成功的 future 转换为失败的，也不能将失败的 future\
  \ 转换为成功的。为了方便这种操作，Scala 2.12 引入了 `transform` 的重载形式，它接受一个从 `Try` 到 `Try` 的函数。是一些示例：\n\
  \n```scala\n scala> val first = success.transform { // Scala 2.12\n          case\
  \ Success(res) => Success(res * -1)\n          case Failure(ex) => Failure(new Exception(\"\
  see cause\", ex))\n        }\n  first: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ first.value\n  res6: Option[scala.util.Try[Int]] = Some(Success(-42))\n\nscala>\
  \ val second = failure.transform { // Scala 2.12\n          case Success(res) =>\
  \ Success(res * -1)\n          case Failure(ex) => Failure(new Exception(\"see cause\"\
  , ex))\n        }\n  second: scala.concurrent.Future[Int] = ...\n\n  scala> second.value\n\
  \  res8: Option[scala.util.Try[Int]] =\n  Some(Failure(java.lang.Exception: see\
  \ cause))\n```\n\n这里有一个使用 `transform` 方法将失败转换为成功的示例：\n\n```scala\n scala> val nonNegative\
  \ = failure.transform { // Scala 2.12\n          case Success(res) => Success(res.abs\
  \ + 1)\n          case Failure(_) => Success(0)\n        }\n  nonNegative: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> nonNegative.value\n  res11: Option[scala.util.Try[Int]] = Some(Success(0))\n\
  ```\n\n### 合并 future：zip, Future.foldLeft, Future.reduceLeft, Future.sequence, and\
  \ Future.traverse\n\n`Future` 及其伴对象提供了合并多个 future 的方法。`zip` 方法将两个成功的 future 转换为包含两个值的\
  \ future 元组。这里有一个示例：\n\n```scala\nscala> val zippedSuccess = success zip recovered\n\
  \  zippedSuccess: scala.concurrent.Future[(Int, Int)] = ...\n\n  scala> zippedSuccess.value\n\
  \  res46: Option[scala.util.Try[(Int, Int)]] =\n  Some(Success((42,-1)))\n```\n\n\
  然而，如果任何一个 future 失败，`zip` 返回的 future 也以相同的异常失败：\n\n```scala\nscala> val zippedFailure\
  \ = success zip failure\n  zippedFailure: scala.concurrent.Future[(Int, Int)] =\
  \ ...\n\n  scala> zippedFailure.value\n  res48: Option[scala.util.Try[(Int, Int)]]\
  \ =\n  Some(Failure(java.lang.ArithmeticException: / by zero))\n```\n\n如果两个 都失败，产生的失败\
  \ future 将包含初始 future（即调用 `zip` 的那个）中存储的异常。\n\n\n\n\n`Future` 的伴侣对象提供了 `foldLeft`\
  \ 方法，允许你跨越 `Iterable` future 集合累积结果，并产生一个 future 结果。如果集合中的所有 future 都成功了，则生成的 future\
  \ 将带有累积后的结果成功。如果集合中的任何一个 future 失败，则生成的 future 将失败。如果有多个 future 失败，结果将以第一个失败的 future（`Iterable`\
  \ 集合中最靠前的）失败时相同的异常失败。以下是一个示例：\n\n```\nscala> val fortyTwo = Future { 21 + 21 }\n\
  \  fortyTwo: scala.concurrent.Future[Int] = ...\n\n  scala> val fortySix = Future\
  \ { 23 + 23 }\n  fortySix: scala.concurrent.Future[Int] = ...\n\n  scala> val futureNums\
  \ = List(fortyTwo, fortySix)\n  futureNums: List[scala.concurrent.Future[Int]] =\
  \ ...\n\n  scala> val folded =\n          Future.foldLeft(futureNums)(0) { (acc,\
  \ num) =>\n            acc + num\n          }\n  folded: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> folded.value\n  res53: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n`Future.reduceLeft` 方法执行不带零值的折叠（fold），使用初始 future 结果作为起始值。以下是一个示例：\n\n```\n\
  scala> val reduced =\n          Future.reduceLeft(futureNums) { (acc, num) =>\n\
  \            acc + num\n          }\n  reduced: scala.concurrent.Future[Int] = ...\n\
  \n  scala> reduced.value\n  res54: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n如果你向 `reduce` 传递一个空集合，生成的 future 将会抛出 `NoSuchElementException` 而失败。\n\n`Future.sequence`\
  \ 方法将 future 的 `TraversableOnce` 集合转换为值的 future `TraversableOnce`。例如，在下面的示例中，`sequence`\
  \ 被用于将 `List[Future[Int]]` 转换为 `Future[List[Int]]`：\n\n```\nscala> val futureList\
  \ = Future.sequence(futureNums)\n  futureList: scala.concurrent.Future[List[Int]]\
  \ = ...\n\n  scala> futureList.value\n  res55: Option[scala.util.Try[List[Int]]]\
  \ =\n  Some(Success(List(42, 46)))\n```\n\n`Future.traverse` 方法将任何任意元素类型的 `TraversableOnce`\
  \ 转换为 future 的 `TraversableOnce`，并将其“序列”为值的 future `TraversableOnce`。例如，这里 `List[Int]`\
  \ 通过 `Future.traverse` 转换为 `Future[List[Int]]`：\n\n```\nscala> val traversed =\n\
  \          Future.traverse(List(1, 2, 3)) { i => Future(i) }\n  traversed: scala.concurrent.Future[List[Int]]\
  \ = ...\n\n  scala> traversed.value\n  res58: Option[scala.util.Try[List[Int]]]\
  \ = \n  Some(Success(List(1, 2, 3)))\n```\n\n### 执行副作用：foreach, onComplete 和 andThen\n\
  \n有时你可能需要在 future 完成后执行副作用。`Future` 为此目的提供了几种方法。最基础的方法是 `foreach`，如果 future 成功完成，它将执行一个副作用。例如，在下面的示例中，如果\
  \ future 失败，`println` 不会执行，只有成功的 future 才会执行：\n\n```\nscala> failure.foreach(ex\
  \ => println(ex))\n\n  scala> success.foreach(res => println(res))\n  42\n```\n\n\
  由于不带 `yield` 的 `for` 语句会被重写为 `foreach` 的调用，你也可以使用 `for` 表达式来实现相同的效果：\n\n```\nscala>\
  \ for (res <- failure) println(res)\n\n  scala> for (res <- success) println(res)\n\
  \  42\n```\n\n`Future` 还提供了两个方法来注册“回调”函数。`onComplete` 方法无论 future 最终成功还是失败都会执行。该函数将接收一个\
  \ `Try`——如果 future 成功则为 `Success`，否则为导致 future 失败的 `Failure`。以下是一个示例：\n\n```\nscala>\
  \ import scala.util.{Success, Failure}\n  import scala.util.{Success, Failure}\n\
  \n  scala> success.onComplete {\n    case Success(res) => println(res)\n    case\
  \ Failure(ex) => println(ex)\n  }\n  2\n\n  scala> failure.onComplete {\n    case\
  \ Success(res) => println(res)\n    case Failure(ex) => println(ex)\n  }\n  java.lang.ArithmeticException:\
  \ by zero\n```\n\n`Future` 不保证通过 `onComplete` 注册的回调函数有执行顺序。如果你想强制回调函数的执行顺序，必须使用\
  \ `andThen`。`andThen` 方法返回一个新的 future，该 future 会镜像你所调用的原始 future（以相同的方式成功或失败），但在回调函数执行之前，它不会完成：\n\
  \n```scala\nscala> val newFuture = success.andThen {\n  case Success(res) => println(res)\n\
  \    case Failure(ex) => println(ex)\n  }\n  2\n  newFuture: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> newFuture.value\n  res76: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n注意，如果传递给 `andThen` 的回调函数抛出了异常，该异常将传播到后续的回调中，或者通过生成的 future 报告。\n\n### 2.12\
  \ 添加的其他方法：flatten, zipWith 和 transformWith\n\n`flatten` 方法在 2.12 中添加，用于将嵌套了另一个 future\
  \ 的 `Future` 转换为嵌套类型的 `Future`。例如，`flatten` 可以将 `Future[Future[Int]]` 转换为 `Future[Int]`：\n\
  \n```scala\nscala> val nestedFuture = Future { Future { 42 } }\n  nestedFuture:\
  \ Future[Future[Int]] = ...\n\n  scala> val flattened = nestedFuture.flatten //\
  \ Scala 2.12\n  flattened: scala.concurrent.Future[Int] = Future(Success(42))\n\
  ```\n\n`zipWith` 方法在 2.12 中添加，本质上是将两个 `Future` 压缩合在一起，然后对生成的元组执行 `map`。以下是两步过程的示例，先执行\
  \ `zip` 后执行 `map`：\n\n```scala\nscala> val futNum = Future { 21 + 21 }\n  futNum:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> val futStr = Future { \"ans\" +\
  \ \"wer\" }\n  futStr: scala.concurrent.Future[String] = ...\n\n  scala> val zipped\
  \ = futNum zip futStr\n  zipped: scala.concurrent.Future[(Int, String)] = ...\n\n\
  \  scala> val mapped = zipped map {\n    case (num, str) => s\"$num is the $str\"\
  \n  }\n  mapped: scala.concurrent.Future[String] = ...\n\n  scala> mapped.value\n\
  \  res2: Option[scala.util.Try[String]] = Some(Success(42 is the answer))\n```\n\
  \n`zipWith` 方法允许你一步到位地完成相同的操作：\n\n```scala\nscala> val fut = futNum.zipWith(futStr)\
  \ { // Scala 2.12\n    case (num, str) => s\"$num is the $str\"\n  }\n  zipWithed:\
  \ scala.concurrent.Future[String] = ...\n\n  scala> fut.value\n  res3: Option[scala.util.Try[String]]\
  \ = Some(Success(42 is the answer))\n```\n\n`Future` 在 2.12 中也获得了了一个 `transformWith`\
  \ 方法，允许你使用从 Try 到 Future 的函数来转换 future。以下是一个示例：\n\n```scala\nscala> val flipped\
  \ = success.transformWith {\n  case Success(res) =>\n    Future { throw new Exception(res.toString)\
  \ }\n  case Failure(ex) => Future { 21 + 21 }\n}\n  flipped: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> flipped.value\n  res5: Option[scala.util.Try[Int]] = Some(Failure(java.lang.Exception:\
  \ 42))\n```\n\n`transformWith` 方法与 Scala 2.12 中添加的新重载 `transform` 方法类似，区别在于它不像 `transform`\
  \ 那在传递的函数中返回一个 `Try`，而是 `transformWith` 允许你返回一个 future。\n\n### 32.4 使用 Futures 进行测试\n\
  \nScala futures 的优势之一是它们可以帮助你避免阻塞。在大多数 JVM 实现上，创建几千个线程后，线程间上下文切换的开销就会导致性能下降到不可接受的程度。通过避免阻塞，你可以让你决定的有限线程保持忙碌。尽管如此，Scala\
  \ 确实允许你在需要时阻塞等待 future 结果。Scala 的 `Await` 对象方便了等待 future 结果的阻塞。以下是一个示例：\n\n\n\n\n\
  \n```scala\nscala> import scala.concurrent.Await\n  import scala.concurrent.Await\n\
  \nscala> import scala.concurrent.duration._\n  import scala.concurrent.duration._\n\
  \nscala> val fut = Future { Thread.sleep(10000); 21 + 21 }\nfut: scala.concurrent.Future[Int]\
  \ = ...\n\nscala> val x = Await.result(fut, 15.seconds) // blocks\nx: Int = 42\n\
  ```\n\n`Await.result` 接收一个 `Future` 和一个 `Duration`。`Duration` 表示 `Await.result`\
  \ 在超时之前应该等待 `Future` 完成多长时间。在这个示例中，`Duration` 被指定为十五秒。因此，在 `Await.result` 方法在未来\
  \ 完成并获得最终值 42 之前，不应该发生超时。\n\n阻塞被广泛接受的一个场景是异步代码的测试。现在 `Await.result` 已经返回，你可以使用该结果进行计算，例如测试中的断言：\n\
  \n```scala\n scala> import org.scalatest.matchers.should.Matchers._\n  import org.scalatest.matchers.should.Matchers._\n\
  \nscala> x should be (42)\nres0: org.scalatest.Assertion = Succeeded\n```\n\n或者，你可以使用\
  \ ScalaTest 特性 `ScalaFutures` 提供的阻塞构造结构。例如，由 `ScalaFutures` 隐式添加到 `Future` 中的 `futureValue`\
  \ 方法将阻塞，直到 future 完成。如果 future 失败，`futureValue` 将抛出一个描述该问题的 `TestFailedException`。如果\
  \ future 成功，`futureValue` 将返回 future 的成功结果，你就可以对该值执行断言：\n\n```scala\n scala> import\
  \ org.scalatest.concurrent.ScalaFutures._\n  import org.scalatest.concurrent.ScalaFutures._\n\
  \nscala> val fut = Future { Thread.sleep(10000); 21 + 21 }\nfut: scala.concurrent.Future[Int]\
  \ = ...\n\nscala> fut.futureValue should be (42) // futureValue 阻塞\nres1: org.scalatest.Assertion\
  \ = Succeeded\n```\n\n虽然在测试中使用阻塞通常是可以接受的，但 ScalaTest 3.0 添加了“异步（async）”测试样式，允许你在不阻塞的情况下测试\
  \ futures。给定一个 future，与其阻塞并对结果执行断言，不如你都可以直接将断言映射到该 future 上，并将生成的 `Future[Assertion]`\
  \ 返回给 ScalaTest。示例见 Listing 32.1。当 future 断言完成后，ScalaTest 将异步地向测试报告程序分发事件（测试成功、测试失败等）。\n\
  \n```scala\n import org.scalatest.funspec.AsyncFunSpec\n  import scala.concurrent.Future\n\
  \n  class AddSpec extends AsyncFunSpec {\n\n    def addSoon(addends: Int*): Future[Int]\
  \ =\n          Future { addends.sum }\n\n    describe(\"addSoon\") {\n      it(\"\
  将最终计算出传入的 Int 整数之和\") {\n        val futureSum: Future[Int] = addSoon(1, 2)\n  \
  \      // 你可以将断言映射到 Future 上，然后将\n        // 生成的 Future[Assertion] 返回 ScalaTest:\n\
  \        futureSum map { sum => assert(sum == 3) }\n      }\n    }\n  }\n```\n\n\
  #####  32.1 - 向 ScalaTest 返回 future 断言。\n\n异步测试用用例说明了处理 futures 的通用原则：一旦进入“未来空间（future\
  \ space）”，请尽量留在未来空间内。不要在 future 上阻塞，然后使用结果继续计算。通过执行一系列变换来保持异步，每次变换都返回一个新的用于转换的 future。要从未来空间获取结果，请注册在\
  \ futures 完成后异步执行的副作用操作。这种方法将帮助你最大化地利用线程。\n\n### 32.5 结论\n\n并发编程赋予了你巨大的力量。它让你简化代码并利用多个处理器。遗憾的是，最广泛使用的并发原——线程、锁和监视器（monitors）是死锁和竞态条件的雷区。Futures\
  \ 提供了一种跳出该雷区的方法，让你在编写并发程序时不必面临如此大的死锁和竞态条件风险。本章介绍了在 Scala 中处理 futures 的几个基本构造结构，包括如何创建\
  \ futures、如何转换它们以及如何测试它们等核心要点。随后，它向你展示了如何将这些构造结构作为通用 futures 风格的一部分。\n\n***\n\n\
  #### 第 32 章的脚注：\n\n[1] 在 Scala.js 上，全局执行上下文将任务置于 JavaScript 事件队列中。\n\n[2] 注意，Java\
  \ 的 `Future` 也有一种处理异步计算可能抛出异常的方法：它的 `get` 方法将抛出封装在 `ExecutionException` 中的该异常。\n\
  \n[3] 示例所示的 `for` 表达式将被重写为对 `fut1.flatMap` 的调用，并传入一个调用 `fut2.map` 的函数：`fut1.flatMap(x\
  \ => fut2.map(y => x + y))`。\n\n## 第 33 章\n\n# 组合器解析 (Combinator Parsing)\n\n你可能需要处理一种小型的特殊语言。例如，你可能需要为软件读取配置文件，并希望它们比\
  \ XML 更容易手动修改。或者，你可能想在程序中支持一种输入语言，例如带有布尔操作符的搜索词（电脑，帮我带有 `飞船` 且没有 `爱情故事` 的电影）。无论原因何，你都需要一个*解析器（parser）*。你需要一种方法将输入语言转换为你的软件可以处理的数据结构。\n\
  \n基本上，你只有几种选择。一种选择是自己编写解析器（以及词法分析器）。如果你不是专家，这是很难的。如果你是专家，这仍然耗费时间。\n\n另一种选择是使用解析器生成器。有很多这样的生成器。其中一些比较著名的如用于\
  \ C 编写解析器的 `Yacc` 和 `Bison`，以及用于 Java 编写解析器的 `ANTLR`。你可能还需要一个扫描器生成器，如 `Lex`、`Flex`\
  \ 或 `JFlex`。这可能是最佳解决方案，尽管有一些不便之处。你需要学习新工具，包括它们有时提供的错误信息。你还需要弄如何将这些工具的输出连接到你的程序。这可能会限制语言的选择，并使你的工具链复杂化。\n\
  \n本章介绍了第三种替代方案。你将使用解析器生成器的独立领域语言，而是将使用一种内部领域语言，简称内部 DSL。内部 DSL 将由解析器组合器库组成——即在 Scala\
  \ 中定义的函数和运算符，它们将作为解析器的构建块。这些构建块将与上下文无关文法的构造一一对应，以便它们易于理解。\n\n本章只引入了一个之前没有解释过的语言特性：这种别名（aliasing），见\
  \ Section 33.6。然而，本章大量使用了在之前章节中解释过的其他特性。其中，参数化类型、抽象类型、作为对象的函数、运算符重载、按名参数和隐式转换都起着重要作用。本章展示了这些语言元素如何在设计一个非常高级的库时组合。\n\
  \n本章解释的概念比之前的章节稍微高级。如果你在编译器构造方面有良好的基础，阅读本章将让你受益，因为它将帮助你更好地审视问题。然而，理解本章的唯一先决条件是你了解文法和上下文无关文法。如果你不知道，本章的内容也可以安全地跳过。\n\
  \n### 33.1 示例：算术表达式\n\n我们将从一个示例开始。假设你想构建一个用于算术表达式的解析器，这些表达式由浮点数、括号以及二进制运算符 +, -、*\
  \ 和 / 组成。第一步总是为要解析的语言编写一个文法。这里是算术表达式的文法：\n\n| expr | ::= | term  {\"+\"  term  \
  \ |  \"-\"  term\\}. |\n\n\n\n\n\n| term | ::= | factor  `{\"*\" factor | \"/\"\
  \ factor}`. |\n| factor | ::= | floatingPointNumber  `| \"(\" expr \")\"`. |\n\n\
  在这里，`|` 表示备选产生式，`{ ... }` 表示重复（0 次或多次）。虽然在这个示例中没有用到它，但 `[ ... ]` 表示可选的出现。\n\n这个上下文无关文法正式地定义了一种算术表达式的语言。每个表达式（由\
  \ `expr` 表示）都是一个 `term`，其后面可以紧跟一系列 `+` 或 `-` 运算符以及更多的 `term`。一个 `term` 是一个 `factor`，后面可能紧跟一系列\
  \ `*` 或 `/` 运算符以及更多的 `factor`。一个 `factor` 要么是一个数字字面量，要么是括号内的表达式。注意，文法已经编码了运算符的相对优先级。例如，`*`\
  \ 的绑定得比 `+` 更紧密，因为 `*` 操作产生一个 `term`，而 `+` 操作产生一个 `expr`，且 `expr` 可以包含 `term`，但\
  \ `term` 只有在后者被包含在括号内时才能包含 `expr`。\n\n现在你已经定义了文法，下一步是什么？如果你使用 Scala 的组合器解析器，你基本上就完成了！你只需要执行一些系统性的文本替换，并将解析器封装在一个类中，如列表\
  \ 33.1 所示：\n\n```scala\n import scala.util.parsing.combinator._\n\nclass Arith extends\
  \ JavaTokenParsers {   \n  def expr: Parser[Any] = term~rep(\"+\"~term | \"-\"~term)\n\
  \  def term: Parser[Any] = factor~rep(\"*\"~factor | \"/\"~factor)\n  def factor:\
  \ Parser[Any] = floatingPointNumber | \"(\"~expr~\")\"\n}\n```\n\n##### 列表 33.1\
  \ - 一个算术表达式解析器。\n\n算术表达式解析器包含在一个继承自 `JavaTokenParsers` trait 的类中。该 trait 提供了编写解析器的基本机制，还提供了一些识别某些词类的原始解析器：标识符、字符串字面量和数字。在列表\
  \ 33.1 的示例中，你只需要继承自该 trait 的原始 `floatingPointNumber` 解析器。\n\n`Arith` 类中的三个定义代表了算术表达式的产生式。如你所见，它们紧密遵循了上下文无关文法的产生式。事实上，你可以通过执行许多简单的文本替换从上下文无关文法自动生成这部分：\n\
  \n1. 每个产生式都变成一个方法，因此你需要在前面加上 `def`。\n2. 每个方法的返回类型是 `Parser[Any]`，所以你需要将符号 `::=`\
  \ 改为 `: Parser[Any] =`。你将在章后面了解到 `Parser[Any]` 类型的含义，以及如何让它更精确。\n3. 在文法中，顺序组合是隐式的，但在程序中是通过一个显式运算符\
  \ `~` 表示的。因此，你需要在产生式的两个连续符号之间插入一个 `~`。在列表 33.1 的示例中，我们选择不在 `~` 运算符周围写任何空格。这样一来，解析器代码就能保持与文法的视觉外观一致——它只是将空格替换为\
  \ `~` 字符。\n4. 重复用 `rep( ... )` 代替 `{ ... }`。同样地（尽管示例中未显示），可选用 `opt( ... )` 代替 `[\
  \ ... ]`。\n5. 每个产生式末尾的点（`.`）被省略了——不过，如果你喜欢，也可以写分号（`;`）。\n\n就是这些了。生成的类 `Arith` 定义了三个解析器\
  \ `expr`、`term` 和 `factor`，它们可以解析算术表达式及其部分。\n\n### 33.2 运行你的解析器\n\n你可以使用以下小型程序测试你的解析器：\n\
  \n```scala\n object ParseExpr extends Arith {\n  def main(args: Array[String]) =\
  \ {\n    println(\"input : \" + args(0))\n    println(parseAll(expr, args(0)))\n\
  \  }\n}\n```\n\n`ParseExpr` 对象定义了一个 `main` 方法，用于解析传递给它的第一个命令行参数。它打印原始输入参数，然后打印解析后的版本。解析是通过以下表达式完成的：\n\
  \n```\nparseAll(expr, input)\n```\n\n该表达式将解析器 `expr` 应用于给定输入。它期望所有输入都匹配，*即*解析后的表达式后面没有多余的字符。还有一个\
  \ `parse` 方法，允许你解析输入前缀，并留下一些剩余部分未读。\n\n你可以使用以下命令运行算术解析器：\n\n```bash\n $ scala ParseExpr\
  \ \"2 * (3 + 7)\"\n  input: 2 * (3 + 7)\n  [1.12] parsed: ((2~List((*~(((~((3~List())~List((\n\
  \  ~(7~List())))))~)))))~List())\n```\n\n输出告诉你解析器成功分析了到位置 `[1.12]` 的输入字符串。这意味着第一行第十二列——换句话说，整个输入字符串都被解析了。暂时暂忽略\
  \ \"parsed:\" 之后的结果。它并不可用，你将在本章后面了解到如何获取更具体的解析结果。\n\n你也可以尝试引入一些不是合法表达式的输入字符串。例如，你可以多写一个右括号：\n\
  \n```bash\n $ scala ParseExpr \"2 * (3 + 7))\"\n  input: 2 * (3 + 7))\n  [1.12]\
  \ failure: `-` expected but `)` found\n\n  2 * (3 + 7))\n           ^\n```\n\n在这里，`expr`\
  \ 解析器解析了直到最后一个右括号的所有内容，而该括号并不是算术表达式的一部分。`parseAll` 方法随后发出错误信息，说明它在右括号处期望一个 `-` 运算符。你将在本章后面了解到为什么会产生这个特定的错误信息，以及你如何改进它。\n\
  \n### 33.3 基础正则表达式解析器\n\n算术表达式解析器使用了另一个名为 `floatingPointNumber` 的解析器。该解析器继承自 `Arith`\
  \ 的父 trait `JavaTokenParsers`，识别 Java 格式的浮点数。但如果你需要解析格式与 Java 略有不同的数字，该怎么办？在这种情况下，你可以使用*正则表达式解析器*。\n\
  \n其思路是，你可以使用任何正则表达式作为解析器。正则表达式解析所有它能匹配的字符串。其结果就是解析后的字符串。例如，列表 33.2 所示的正则表达式解析器描述了\
  \ Java 的标识符：\n\n```scala\n object MyParsers extends RegexParsers {\n    val ident:\
  \ Parser[String] = \"\"\"[a-zA-Z_]\\w*\"\"\".r\n}\n```\n\n##### 列表 33.2 - 用于 Java\
  \ 标识符的正则表达式解析器。\n\n列表 33.2 中的 `MyParsers` 对象继承自 `RegexParsers` trait，而 `Arith` 则相反。Scala\
  \ 的解析组合器以 trait 层级组织，它们都包含在 `scala.util.parsing.combinator` 包中。顶层 trait 是 `Parsers`，它为各种输入定义了一个非常通用的解析框架。底层是\
  \ `RegexParsers`，它要求输入是字符序列并提供正则表达式解析功能。更专门的是 `JavaTokenParsers`，它实现了 Java 中定义的基础词类（或标记）的解析器。\n\
  \n### 33.4 另一个示例：JSON\n\nJSON（JavaScript 对象表示法）是一种流行的数据交换格式。在本节中，我们将展示如何为它编写一个解析器。这里有一个描述\
  \ JSON 语法的文法：\n\n| value | ::= | obj | arr | stringLiteral |\n| | | floatingPointNumber\
  \ |\n| | | \"null\" | \"true\" | \"false\". |\n| obj | ::= | \"{\" [members] \"\
  }\". |\n| arr | ::= | \"[\" [values] \"]\". |\n| members | ::= | member {\",\" member}.\
  \ |\n| member | ::= | stringLiteral \":\" value. |\n| values | ::= | value {\",\"\
  \ value}. |\n\n\n\n\n\nJSON 值是一个对象、数组、字符串、数字或三个保留字 `null`、`true` 或 `false` 之一。JSON\
  \ 对象是一个由逗号分隔并用大括号括起来的成员序列（可能为空）。每个成员都是一个字符串/值键值对，其中字符串和值之间用冒号分隔。最后，JSON 数组是一个由逗号分隔并用方括号括起来的值序列。例如，列表\
  \ 33.3 包含一个格式化为 JSON 对象的地址录。\n\n```json\n {\n  \"address book\": {\n    \"name\"\
  : \"John Smith\",\n    \"address\": {\n      \"street\": \"10 Market Street\",\n\
  \      \"city\"  : \"San Francisco, CA\",\n      \"zip\"   : 94111\n    },\n   \
  \ \"phone numbers\": [\n      \"408 338-4238\",\n      \"408 111-6892\"\n    ]\n\
  \  }\n}\n```\n\n#### 列表 33.3 - JSON 格式的数据。\n\n当使用 Scala 的解析器组合器（parser combinators）时，解析此类数据是非常简单的。完整的解析器如列表\
  \ 33.4 的示例中，`repsep(member, \",\")` 解析由逗号分隔的成员项序列。否则，解析器中的产生式与语法中的产生式完全对应，正如之前算术表达式解析器的情况一样。\n\
  \n```scala\nimport scala.util.parsing.combinator._\n\nclass JSON extends JavaTokenParsers\
  \ {   \n\n  def value : Parser[Any] = obj | arr | \n                           stringLiteral\
  \ | \n                           floatingPointNumber | \n                      \
  \     \"null\" | \"true\" | \"false\"\n\n  def obj   : Parser[Any] = \"{\"~repsep(member,\
  \ \",\")~\"}\"\n\n  def arr   : Parser[Any] = \"[\"~repsep(value, \",\")~\"]\"\n\
  \n  def member: Parser[Any] = stringLiteral~\":\"~value\n}\n```\n\n#### 列表 33.4\
  \ - 一个简单的 JSON 解析器。\n\n为了尝试 JSON 解析器，我们将稍微修改框架，使解析器在文件上而不是在命令行上操作：\n\n```scala\n\
  import java.io.FileReader\n\nobject ParseJSON extends JSON {\n  def main(args: Array[String])\
  \ = {\n    val reader = new FileReader(args(0))\n    println(parseAll(value, reader))\n\
  \  }\n}\n```\n\n该程序中的 `main` 方法首先创建一个 `FileReader` 对象。然后根据 JSON 语法的 `value` 产生式解析读取器返回的字符。注意，`parseAll`\
  \ 和 `parse` 存在重载变：两者都可以接受字符序列，或者接受输入读取器作为第二个参数。\n\n如果你将列表 33.3 所示的“地址录”对象存储到名为 `address-book.json`\
  \ 的文件中并对其运行 `ParseJSON` 程序，你将得到：\n\n```bash\n $ scala ParseJSON address-book.json\n\
  \  [13.4] parsed: (({~List(((\"address book\"~:)~(({~List(((\n  \"name\"~:)~\"John\
  \ Smith\"), ((\"address\"~:)~(({~List(((\n  \"street\"~:)~\"10 Market Street\"),\
  \ ((\"city\"~:)~\"San Francisco\n  ,CA\"), ((\"zip\"~:)~94111)))~})), ((\"phone\
  \ numbers\"~:)~(([~\n  List(\"408 338-4238\", \"408 111-6892\"))~]))))~}))))~})\n\
  ```\n\n### 解析输出\n\n`ParseJSON` 程序成功解析了 JSON 地址录。然而，解析器的输出看起来很奇怪。它似乎是一个由输入片段通过列表和\
  \ `~` 组合粘合而成的序列。这种输出并不好用。对于人类来说，它比输入更不可读，但对于计算机来说它又太杂乱，难以于分析。是时候对此做些什么了。\n\n为了弄清楚做什么，你首先需要知道组合器框架中的各个解析器返回的结果（假设它们成功解析了输入）。以下是规则：\n\
  \n1. 每个以字符串形式编写解析器（例如：`\"{\"` 或 `\":\"` 或 `\"null\"`）返回解析后的字符串本身。\n2. 正则表达式解析器如\
  \ `[a-zA-Z_]\\w*` 也返回解析后的字符串本身。继承自特性 `JavaTokenParsers` 的正则表达式解析器如 `stringLiteral`\
  \ 或 `floatingPointNumber` 也是如此。\n3. 顺序组合 `P~Q` 返回 `P` 和 `Q` 的结果。这些结果封装在一个也名为 `~`\
  \ 的例类实例中。因此，如果 `P` 返回 `\"true\"` 且 `Q` 返回 `\"?\"`，那么顺序组合 `P~Q` 返回 `~(\"true\", \"\
  ?\")`，打印为 `(true~?)`。\n4. 选择组合 `P | Q` 返回 `P` 或 `Q` 的结果，以成功者为准。\n5. 重复 `rep(P)`\
  \ 或 `repsep(P, separator)` 返回所有 `P` 运行的结果列表。\n6. 选项 `opt(P)` 返回 Scala 的 `Option`\
  \ 类型实例。如果 `P` 成功并获得结果 `R` 则返回 `Some(R)`，如果 `P` 失败则返回 `None`。\n\n有了这些规则，你现在可以推导出为什么之前的示例中解析器的输出是那样。然而，输出仍然不方便。如果能将\
  \ JSON 对象映射为表示 JSON 值含义的内部 Scala 表示，那将会好得多。一种更自然的表示如下：\n\n* JSON 对象表示为类型为 `Map[String,\
  \ Any]` 的 Scala map。每个成员都表示为 map 中的一个键值绑定。\n* JSON 数组表示为类型为 `List[Any]` 的 Scala\
  \ list。\n* JSON 字符串表示为 `String`。\n* JSON 数字字面量表示为 `Double`。\n* 值 `true`、`false`\
  \ 和 `null` 表示为相同的值。\n\n为了产生这种表示，你需要使用另一种解析器组合：`^^`。`^^` 运算符转换解析器的结果。使用该运算符的表达式形式为\
  \ `P ^^ f`，其中 `P` 是解析器，`f` 是函数。每当 `P` 返回某些结果 `R` 时，`P ^^ f` 的结果就是 `f(R)`。\n\n例如，这是一个解析浮点数并将其转换为\
  \ Scala 值的解析器：\n\n```scala\nfloatingPointNumber (_.toDouble)\n```\n\n这是一个解析字符串 \"\
  true\" 并返回 Scala 布尔值的解析器：\n\n```scala\n\"true\" ^^ (x => true)\n```\n\n现在来看一些更高级的转换。这里有一个返回\
  \ `Map` 的 JSON 对象解析器的新版本：\n\n```scala\ndef obj: Parser[Map[String, Any]] = // 可以改进\n\
  \  \"{\"~repsep(member, \",\")~\"}\" ^^ { case \"{\"~ms~\"}\" => Map() ++ ms }\n\
  ```\n\n记住 `~` 运算符产生的结果是一个同名的例类实例：`~`。以下是该类的定义——它是特性 `Parsers` 的一个内部类：\n\n```scala\n\
  case class ~+A, +B {\n  override def toString = \"(\" + x + \"~\" + y + \")\"\n\
  }\n```\n\n该类的名称特意地与序列组合器方法 `~` 相同。这样，你就可以用解析器本身结构相同的模式来匹配解析器结果。例如，模式 `\"{\"~ms~\"\
  }\"` 匹配一个结果字符串 `\"{\"`，后面是一个结果变量 `ms`，随后又是一个结果字符串 `\"}\"`。这个模式完全对应于 `^^` 左侧解析器所返回的内容。在\
  \ `~` 运算符在前的去糖版本中，相同的模式读作为 `~(\"{\", ms), \"}\")`，但这可读性差得多。\n\n\n\n\n\n`\"{\"~ms~\"\
  }\"` 模式的目的是去掉大括号，以便获取由 `repsep(member, \",\")` 解析器产生的成员列表。在这些情况下，还有另一种替代方案，可以避免产生立即被模式匹配丢弃的无必要解析器结果。这种替代方案使用了\
  \ `~>` 和 `<~` 解析器组合器。两者都表示了与 `~` 相同的顺序组合，但 `~>` 只保留其右操作数的结果，而 `<~` 只保留其左操作数的结果。使用这些组合器，JSON\
  \ 对象解析器可以写得更简洁：\n\n```scala\n def obj: Parser[Map[String, Any]] =\n  \"{\"~> repsep(member,\
  \ \",\") <~\"}\" ^^ (Map() ++ _)\n```\n\nListing 33.5 显示了一个返回意义结果的完整 JSON 解析器。如果你在\
  \ `address-book.json` 文件上运行此解析器，你将得到以下结果（在添加了一些换行和缩进后）：\n\n```scala\n $ scala JSON1Test\
  \ address-book.json\n  [14.1] parsed: Map(\n  address book -> Map(\n      name ->\
  \ John Smith, \n      address -> Map(\n        street -> 10 Market Street, \n  \
  \      city -> San Francisco, CA, \n        zip -> 94111), \n      phone numbers\
  \ -> List(408 338-4238, 408 111-6892)\n    )\n  )\n```\n\n这就是你开始编写自己的解析器所需的所有知识。为了方便记忆，Table\
  \ 33.1 列出了到为止讨论过的解析器组合器。\n\n```scala\n import scala.util.parsing.combinator._\n\n\
  \  class JSON1 extends JavaTokenParsers {   \n\n    def obj: Parser[Map[String,\
  \ Any]] = \n      \"{\"~> repsep(member, \",\") <~\"}\" ^^ (Map() ++ _)\n\n    def\
  \ arr: Parser[List[Any]] =\n      \"[\"~> repsep(value, \",\") <~\"]\" \n\n    def\
  \ member: Parser[(String, Any)] = \n      stringLiteral~\":\"~value ^^ \n      \
  \  { case name~\":\"~value => (name, value) }\n\n    def value: Parser[Any] = (\n\
  \      obj\n      | arr \n      | stringLiteral\n      | floatingPointNumber ^^\
  \ (_.toDouble) \n      | \"null\"  ^^ (x => null) \n      | \"true\"  ^^ (x => true)\
  \ \n      | \"false\" ^^ (x => false)\n    )\n  }\n```\n\n##### Listing 33.5 - 一个返回意义结果的完整\
  \ JSON 解析器。\n\n##### Table 33.1 - 解析器组合器总结\n\n| Pattern | Description |\n| :---\
  \ | :--- |\n| `\"...\"` | 字面量 |\n| `\"...\".r` | 正则表达式 |\n| `P~Q` | 顺序组合 |\n| `P\
  \ <~ Q, P ~> Q` | 顺序组合；仅保留左/右 |\n| `P \\| Q` | 备选 |\n| `opt(P)` | 选项 |\n| `rep(P)`\
  \ | 重复 |\n| `repsep(P, Q)` | 交替重复 |\n| `P ^^ f` | 结果转换 |\n\n### 关闭分号推断\n\n注意，Listing\
  \ 33.5 中 value 解析器的体被包裹在括号中。这是一个禁用解析器表达式中分号推断的小技巧。你之前已在 Section 4.2 中看到过，Scala 会假设在任何两个在语法上可以作为独立语句的行之间存在分号，除非第一行以中缀运算符结尾，或者两行被包裹在括号或方括号中。现在，你可以将\
  \ `|` 运算符写在每个备选选项的末尾，而不是下一个选项的开头，如下所示：\n\n```scala\n def value: Parser[Any] = \n\
  \  obj |\n  arr |\n  stringLiteral |\n  ...\n```\n\n在这种情况下，就不需要为 value 解析器的体加括号了。然而，有些人更倾向于将\
  \ `|` 运算符放在第二个备选选项的开头，而不是第一个选项的结尾。通常情况下，这会在两行之间产生意外的分号，如下：\n\n```scala\nobj;  //\
  \ 隐插入分号\n  | arr\n```\n\n分号改变了代码的结构，导致编译失败。将整个表达式放在括号中可以避免分号并使代码正确编译。\n\n### 符号名称与字母名称\n\
  \nTable 33.1 中的许多解析器组合器使用了符号名称。这既有优点也有缺点。缺点是，符号名称需要时间学习。不熟悉 Scala 组合器解析库的用户可能无法理解\
  \ `~`、`~>` 或 `^^` 的含义。优点是，符号名称很短，并且可以选择使其具有“正确”的优先级和结合性。例如，解析器组合器 `~`、`^^` 和 `|`\
  \ 是按照优先级递减的有意选择的。一个典型的文法产生式由具有解析部分和转换部分的备选方案组成。解析部分通常包含几个由 `~` 运算符分隔开的顺序项。通过所选 `~`、`^^`\
  \ 和 `|` 的优先级，你可以编写这样的文法产生式而无需任何括号。\n\n此外，符号运算符比字母运算符占据更少的视觉空间。这对解析器来说很重要，因为它让你能够关注当前的文法，而不是组合器本身。为了看到区别，请想象一下顺序组合（`~`）被称为\
  \ `andThen`，而备选（`|`）被称为 `orElse`。Listing 33.1 此处 中的算术表达式解析器看起来将如下：\n\n```scala\n\
  class ArithHypothetical extends JavaTokenParsers {   \n  def expr: Parser[Any] \
  \  = \n    term andThen rep((\"+\" andThen term) orElse \n                     \
  \ (\"-\" andThen term))\n  def term: Parser[Any]   = \n    factor andThen rep((\"\
  *\" andThen factor) orElse \n                      (\"/\" andThen factor))\n  def\
  \ factor: Parser[Any] = \n    floatingPointNumber orElse (\" expr \")\n}\n```\n\n\
  \n\n\n\nScala 组合器解析框架的核心位于 `scala.util.parsing.combinator.Parsers` trait 中。该 trait\
  \ 定义了 `Parser` 类型以及所有基础组合器。除非另有明确说明，在以下两个子节中解释的定义都存在于该 trait 中。也就是说，它们被认为包含在如下所示所示的\
  \ trait 定义中：\n\n```scala\n package scala.util.parsing.combinator\n  trait Parsers\
  \ {\n  ... // 除非另有说明，代码在此处\n}\n```\n\n`Parser` 本质上只是从某种输入类型到解析结果的函数。作为初步近似，该类型可以写如下：\n\
  \n```\n type Parser[T] = Input => ParseResult[T]\n```\n\n## Parser 输入\n\n有时，解析器读取的是标记流（token\
  \ stream）而不是原始字符序列。这时会使用单独的词法分析器将原始字符流转换为标记流。解析器输入的类型定义如下：\n\n```\n type Input =\
  \ Reader[Elem]\n```\n\n`Reader` 类来自 `scala.util.parsing.input` 包。它类似于 `Stream`，但还会跟踪它所读取的所有元素的位置。类型\
  \ `Elem` 代表单个输入元素。它是 `Parsers` trait 的一个抽象类型成员：\n\n```\n type Elem\n```\n\n这意味着\
  \ `Parsers` 的子类和子 trait 需要实例化类 `Elem`，对应正在解析的输入元素的类型。例如，`RegexParsers` 和 `JavaTokenParsers`\
  \ 将 `Elem` 固定为等于 `Char`。但也可以将 `Elem` 设置为其他类型，例如从独立词法分析器返回的标记类型。\n\n## Parser 结果\n\
  \n解析器在给定的输入上可能会成功，也可能失败。因此，`ParseResult` 类有两个子类分别表示成功和失败：\n\n```\n sealed abstract\
  \ class ParseResult[+T] \n  case class SuccessT \n  extends ParseResult[T]\n  case\
  \ class Failure(msg: String, in: Input) \n  extends ParseResult[Nothing]\n```\n\n\
  `Success` 例在其 `result` 参数中携带了解析器返回的结果。解析结果的类型是任意的；这就是为什么 `ParseResult`、`Success`\
  \ 和 `Parser` 都带有一个类型参数 `T`。该类型参数表示给定解析器返回的结果种类。`Success` 还接受第二个参数 `in`，它指向解析器消耗部分之后的输入。这个字段对于解析器的链式是必需的，以便一个解析器可以在另一个解析器之后运行。注意，这是一种纯函数的解析方法。`Input`\
  \ 并不是作为副作用读取的，而是保留在流中。解析器分析输入流的一部分，然后在其结果中返回剩余部分。\n\n`ParseResult` 的另一个子类是 `Failure`。该类接受一个消息作为参数，描述解析失败的原因。与\
  \ `Success` 类似，`Failure` 也接受剩余输入流作为第二个参数。这并不是为了链式（解析器在失败后不会继续），而是为了将错误消息放置在输入流中的正确位置。\n\
  \n注意，解析结果被定义为类型参数 `T` 协变。也就是说，一个返回 `Strings` 作为结果的解析器与返回 `AnyRefs` 的解析器是兼容的。\n\n\
  ## Parser 类\n\n之前将解析器描述为从输入到解析结果的函数过于简单了。之前的示例显示，解析器还实现了诸许多方法，例如用于两个解析器顺序组合的 `~`\
  \ 以及用于它们备选组合的 `|`。因此 `Parser` 实际上是一个继承自函数类型 `Input => ParseResult[T]` 的类，并额外定义了这些方法：\n\
  \n```\n abstract class Parser[+T] extends (Input => ParseResult[T]) \n  { p =>\n\
  \    // 未指定的方法，用于定义\n    // 此解析器的行为。\n    def apply(in: Input): ParseResult[T]\n\
  \n    def ~ ...\n    def | ...\n    ...\n}\n```\n\n由于解析器是函数（即：继承自函数），它们需要定义一个 `apply`\
  \ 方法。你在 `Parser` 类中看到一个抽象的 `apply` 方法，但这仅仅是为了文档，因为该方法无论如何都是从父类型 `Input => ParseResult[T]`\
  \ 继承的（回该类型是 `scala.Function1[Input, ParseResult[T]]` 的缩写）。在继承自抽象 `Parser` 类的具体解析器中仍然需要实现\
  \ `apply` 方法。这些解析器将在关于此别名的后续节之后进行讨论。\n\n### 这种别名（Aliasing this）\n\n`Parser` 类的体开始于一个奇特的表达式：\n\
  \n```\n abstract class Parser[+T] extends ... { p =>\n```\n\n类模板左大括号之后紧跟的如 `id =>`\
  \ 子会将标识符 `id` 定义为类中 `this` 的别名。这就像你在类体中写了：\n\n```\n val id = this\n```\n\n区别在于 Scala\
  \ 编译器知道 `id` 是 `this` 的别名。例如，你可以使用 `id.m` 或 `this.m` 访问类的对象私有成员 `m`；两者完全等价。如果 `id`\
  \ 仅定义为以 `this` 为右手的 `val`，那么第一个表达式将无法编译，因为在这种情况下 Scala 编译器会将 `id` 视为一个普通的标识符。\n\n\
  你在 第 29.4 节 中见过这种语法，当时它被用于给 trait 提供一个自类型。当需要访问外部类的 `this` 时，别名也可以是一个很好的缩写。这里有一个例子：\n\
  \n```\n class Outer { outer =>\n  class Inner {\n    println(Outer.this eq outer)\
  \ // 输出: true\n  }\n}\n```\n\n该示例定义了两个嵌套类，`Outer` 和 `Inner`。在 `Inner` 内部，`Outer`\
  \ 类的 `this` 值被引用两次，使用了不同的表达式。第一个表达式展示了 Java 的做法：你可以在 `this` 前加上外部类名和句号；第二个表达式显示了\
  \ Scala 提供的替代方案。Scala 的方式更简洁，如果你选择了良好的别名，还可以提高清晰度。你可以在这里 和这里 看到相关示例。\n\n## 单标记解析器\n\
  \n`Parsers` trait 定义了一个通用的解析器 `elem`，用于解析任何单个标记：\n\n```scala\n def elem(kind: String,\
  \ p: Elem => Boolean) = \n  new Parser[Elem] {\n    def apply(in: Input) =\n   \
  \   if (p(in.first)) Success(in.first, in.rest)\n      else Failure(kind + \" expected\"\
  , in)\n  }\n```\n\n该解析器接受两个参数：一个描述应该解析的标记类型的 `kind` 字符串，以及一个针对 `Elems` 的谓词 `p`，指示元素符合要解析的标记类。\n\
  \n当将解析器 `elem(kind, p)` 应用于输入 `in` 时，会对流的第一个元素进行谓词测试。如果 `p` 返回 true，解析器成功。其结果是元素本身，其剩余输入是从解析元素之后开始的输入流。反之，如果\
  \ `p` 返回 false，解析器失败，并带有一个指示预期标记类型的消息。\n\n### 顺序组合\n\n`elem` 解析器只消耗单个元素。为了解析更有意义的语句，你可以使用顺序组合运算符\
  \ `~` 将解析器连接起来。正如你之前看到的，`P~Q` 是一个解析器，它首先将 `P` 解析器应用于给定的字符串。然后，如果 `P` 成功，则将 `Q` 解析器应用于\
  \ `P` 完成工作后剩余的输入。\n\n\n\n\n\n`~` 组合子被实现为 `Parser` 类中的一个方法。它的定义见 Listing 33.6。该方法是\
  \ `Parser` 类的成员。在类类内部，`p` 通过 `\"p =>\"` 部分指定为 `this` 的别名，因此 `p` 指定了 `~` 的左操作数（或：接收者）。它的右操作数由参数\
  \ `q` 表示。现在，如果在某些输入 `in` 上运行 `p~q`，首先会在 `in` 上运行 `p` 并在模式匹配中分析其结果。如果 `p` 成功，则在剩余的输入\
  \ `in1` 上运行 `q`。如果 `q` 也成功，则整个解析器即为成功。它的结果是一个 `~` 对象，其中包含了 `p` 的结果（*即*，`x`）和 `q`\
  \ 的结果（*即*，`y`）。另一方面，如果 `p` 或 `q` 中有任何一个失败，`p~q` 的结果将是 `p` 或 `q` 返回的 `Failure` 对象。\n\
  \n```\nabstract class Parser[+T] ... { p =>\n    ...\n    def ~ U = new Parser[T~U]\
  \ {\n      def apply(in: Input) = p(in) match {\n        case Success(x, in1) =>\
  \ \n          q(in1) match {\n            case Success(y, in2) => Success(new ~(x,\
  \ y), in2)\n            case failure => failure\n          }\n        case failure\
  \ => failure\n      }\n    }\n}\n```\n\n##### Listing 33.6 - ~ 组合子方法。\n\n`~` 的结果类型是一个解析器，它返回一个带有类型\
  \ `T` 和 `U` 元素的 case 类 `~` 的实例。类型表达式 `T~U` 只是参数类型 `~[T, U]` 更易读的简写。通常，Scala 总是将二元类型操作（如\
  \ `A op B`）解释为参数类型 `op[A, B]`。这与模式的情况类似，二元模式 `P op Q` 也被解释为一种应用，*即*，`op(P, Q)`。\n\
  \n另外两个顺序组合运算符 `<~` 和 `~>` 可以像 `~` 一样被定义，只是在计算结果的方式上有一些微小的调整。不过，更优雅的技术是根据 `~` 如下定义它们：\n\
  \n```\ndef <~ U: Parser[T] = \n    (p~q) ^^ { case x~y => x }\ndef ~> U: Parser[U]\
  \ = \n    (p~q) ^^ { case x~y => y }\n```\n\n#### 替代组合\n\n替代组合 `P | Q` 对给定的输入应用\
  \ `P` 或 `Q`。它首先尝试 `P`。如果 `P` 成功，整个解析器以 `P` 的结果成功。否则，如果 `P` 失败，则在与 `P` 相同的输入上尝试 `Q`。此时\
  \ `Q` 的结果就是整个解析器的结果。\n\n以下是 `|` 作为 `Parser` 类方法的定义：\n\n```\ndef | (q: => Parser[T])\
  \ = new Parser[T] {\n  def apply(in: Input) = p(in) match {\n    case s1 @ Success(_,\
  \ _) => s1\n    case failure => q(in) \n  }\n}\n```\n\n注意，如果 `P` 和 `Q` 都失败，则失败信息由\
  \ `Q` 决定。这种微妙的选择将在稍后的第 33.9 节 中讨论。\n\n#### 处理递归\n\n注意，方法 `~` 和 `|` 中的参数 `q` 是按名（by-name）的——其类型前面有\
  \ `=>`。这意味着实际的解析器参数只有在需要 `q` 时才会求值，而这应该是在 `p` 运行之后。这使得编写递归解析器成为可能，例如这个解析由任意数量括号括的数字：\n\
  \n```\ndef parens = floatingPointNumber | \"(\"~parens~\")\"\n```\n\n如果 `|` 和 `~`\
  \ 采用*按值参数 (by-value parameters)，那么这个定义将立即导致栈溢出而没有任何读取，因为 `parens` 的值出现在其右侧部分的中间。\n\
  \n#### 结果转换\n\n`Parser` 类的最后一个方法转换解析器的结果。解析器 `P ^^ f` 仅当 `P` 成功时成功。在这种情况下，它返回使用函数\
  \ `f` 转换后的 `P` 的结果。这是该方法的实现：\n\n```\ndef ^^ U: Parser[U] = new Parser[U] {\n  def\
  \ apply(in: Input) = p(in) match {\n    case Success(x, in1) => Success(f(x), in1)\n\
  \    case failure => failure\n  }\n} // end Parser\n```\n\n#### 不读取任何输入的解析器\n\n\
  还有两个不消耗任何输入的解析器：`success` 和 `failure`。解析器 `success(result)` 总是以给定的结果成功。解析器 `failure(msg)`\
  \ 总是以错误消息 `msg` 失败。两者都实现为 trait `Parsers` 中的方法，该外部 trait 同样包含了 `Parser` 类：\n\n```\n\
  def successT = new Parser[T] {\n  def apply(in: Input) = Success(v, in)\n}\ndef\
  \ failure(msg: String) = new Parser[Nothing] {\n  def apply(in: Input) = Failure(msg)\n\
  }\n```\n\n#### 选项与重复\n\n方法 `~` 和 `|` 中的参数 `q` 是按名（by-name）的——其类型前面有 `=>`。这意味着实际的解析器参数只有在需要\
  \ `q` 时才会求值，而这应该是在 `p` 运行之后。这使得编写递归解析器成为可能，例如这个解析由任意数量括号括的数字：\n\n```\ndef parens\
  \ = floatingPointNumber | \"(\"~parens~\")\"\n```\n\n如果 `|` 和 `~` 采用*按值参数 (by-value\
  \ parameters)，那么这个定义将立即导致栈溢出而没有任何读取，因为 `parens` 的值出现在其右侧部分的中间。\n\n### 3.7 字符串字面量和正则表达式\n\
  \n目前为止的解析器使用了字符串字面量和正则表达式来解析单词。这些支持来自 `RegexParsers`，它是 `Parsers` 的一个子 trait：\n\n\
  ```\ntrait RegexParsers extends Parsers {\n  type Elem = Char\n```\n\n它定义了两个方法 `literal`\
  \ 和 `regex`，签名如下：\n\n```scala\nimplicit literal(s: String): Parser[String] = ...\n\
  implicit regex(r: Regex): Parser[String] = ...\n```\n\n注意，这两个方法都有 `implicit` 修饰符，因此当给出\
  \ `String` 或 `Regex` 但期望一个 Parser 时，它们会被应用。这就是为什么你可以在语法中直接编写字符串字面量和正则表达式，而无需用这些方法进行封装。例如，解析器\
  \ `(`~\")\"` 将自动扩展为 `literal(\")`。\n\n`RegexParsers` trait 还处理空格。为了这样做，它在运行 `literal`\
  \ 或 `regex` 解析器之前会调用名为 `handleWhiteSpace` 的方法。`handleWhiteSpace` 方法跳过符合 `whiteSpace`\
  \ 正则表达式的最长输入序列，该表达式定义为：\n\n```scala\nprotected val whiteSpace = \"\"\"\\s+\"\"\"\
  .\n} // end RegexParsers\n```如果你对空格有不同的处理方式，可以重写 `whiteSpace`。例如，如果你不想完全跳过空格，可以使用空正则表达式重写\
  \ `whiteSpace`：\n\n```scala\nobject MyParsers extends RegexParsers {\n  override\
  \ val whiteSpace = \"\".r\n}\n```\n\n词法与解析\n\n语法分析的任务通常分为两个阶段。词法阶段识别输入中的单词并将其归分为某些标记类。这一阶段也被称为词法分析。随后是语法分析阶段，它分析标记序列。语法分析也被称为解析，尽管这并不准确，因为词法分析也可以被视为解析问题。\n\
  \n上一节描述的 `Parsers` trait 可以用于这两个阶段，因为它的输入元素是抽象类型 `Elem`。对于词法分析，`Elem` 将实例化为 `Char`，这意味着组成单词的字符正在被解析。语法分析器反会将\
  \ `Elem` 实例化为词法器返回的标记类型。\n\nScala 的解析组合器提供了几个用于词法和语法分析的工具类。它们包含两个子包中，每个包对应一种分析：\n\
  \n```\nscala.util.parsing.combinator.lexical\n  scala.util.parsing.combinator.syntactical\n\
  ```\n\n\n\n\n如果你想将解析器拆分为独立的词法分析器和语法分析器，你应该咨询这些包的 Scaladoc 文档。但对于简单的解析器，本章之前所示基于正则表达式的方法通常足够了。\n\
  \n### 33.9 错误报告\n\n还有一个最后一个尚未涵盖的话题：解析器如何发布错误消息？解析器的错误报告在某种程度上是一门艺术。问题在于，当解析器拒绝某些输入时，它通常遇到了许多不同的失败。每种备选解析都失败了，并且在每个选择点递归地失败。在通常有很多失败的情况下，应该将哪一个作为错误消息发布给用户？\n\
  \nScala 的解析库实现了一种简单的启发式：在所有失败中，选择发生在输入中最晚位置的一个。换句话说，解析器选取最有效的长前缀，并发布一条描述为何无法继续解析该前缀的错误消息。如果该最后位置有多个失败点，则选择最后访问的那个。\n\
  \n例如，考虑在一个错误的地址簿上运行 JSON 解析器，该地址簿开头如下：\n\n```\n { \"name\": John,\n```\n\n该短语最长的合法前缀是\
  \ `{\" \"name\": `。因此，JSON 解析器会将单词 `John` 标记为错误。JSON 解析器在此时期望一个值，但 `John` 是一个标识符，它不被视为值（可能是文档作者忘记将名称括在引号中）。解析器为该文档发布的错误消息为：\n\
  \n```\n [1.13] failure: \"false\" expected but identifier John found\n\n  { \"name\"\
  : John,\n               ^\n```\n\n期望 `\"false\"` 的部分来自于 `\"false\"` 是 JSON 语法中值（value）产生式的最后一个备选方案。因此，这是该点的最后失败。详细了解\
  \ JSON 语法的用户可以还原错误消息，但对于非专家来说，这个错误消息可能会令他们惊讶，而且可能相当误导性。\n\n通过在值产生式的最后一个备选方案中添加“全捕获”失败点，可以设计出更好的错误消息：\n\
  \n```scala\n def value: Parser[Any] =\n  obj | arr | stringLit | floatingPointNumber\
  \ | \"null\" |\n  \"true\" | \"false\" | failure(\"illegal start of value\")\n```\n\
  \n这一添加并没有改变接受为有效文档的输入集。它的改进了错误消息，因为现在将是显式添加的失败作为最后一个备选方案并被报告：\n\n```\n [1.13] failure:\
  \ illegal start of value\n\n  { \"name\": John,\n               ^\n```\n\n“最晚可能”错误报告方案的实现使用了\
  \ trait `Parsers` 中一个名为 `lastFailure` 的字段来标记发生在输入中最晚位置的失败：\n\n```scala\n var lastFailure:\
  \ Option[Failure] = None\n```\n\n该字段被初始化为 `None`。它在 `Failure` 类的构造函数中更新：\n\n```scala\n\
  \ case class Failure(msg: String, in: Input) \n  extends ParseResult[Nothing] {\n\
  \n  if (lastFailure.isDefined && \n      lastFailure.get.in.pos <= in.pos)\n   \
  \ lastFailure = Some(this)\n}\n```\n\n该字段由 `phrase` 方法读取，如果解析器失败，该方法会发布最终错误消息。以下是\
  \ `Parsers` trait 中 `phrase` 的实现：\n\n```scala\n def phraseT = new Parser[T] {\n\
  \  lastFailure = None\n  def apply(in: Input) = p(in) match {\n    case s @ Success(out,\
  \ in1) =>\n      if (in1.atEnd) s \n      else Failure(\"end of input expected\"\
  , in1)\n    case f : Failure => \n      lastFailure\n  }\n}\n```\n\n`phrase` 方法运行其参数解析器\
  \ `p`。如果 `p` 在输入完全消耗的情况下成功，则返回 `p` 的成功结果。如果 `p` 成功但输入未完全读取，则返回消息为“end of input expected”的失败。如果\
  \ `p` 失败，则返回存储在 `lastFailure` 中的失败或错误。\n\n### 33.10 回溯与 LL(1)\n\nLL(1) 解析器的优势之一可以使用更简单的输入技术。输入可以顺序读取，输入元素在读取后就可以被丢弃。这是\
  \ LL(1) 解析器通常比回溯解析器高效的另一个原因。\n\n通常可以通过修改语法来避免回溯。例如，在算术表达式的情况下，以下任一方案均有效：\n\n- `expr\
  \ ::= term [+] term`\n- `expr ::= term term`\n\n许多语言都允许所谓的“LL(1)”语法。当从这种语法形成组合器解析器时，它永远不会回溯，*即*，输入位置永远不会重置为较早的值。例如，本章较早介绍的算术表达式和\
  \ JSON 语法都是 LL(1) 的，因此解析器组合器的回溯能力从未被触发。\n\n回溯代价可能是高昂的，因为相同的输入可能会被解析多次。\n\n组合器框架允许你使用新运算符\
  \ `~! ` 显式地表达语法是 LL(1) 的期望。该运算符类似于顺序组合 `~`，但它永远不会回溯去“取消读取”已经解析的输入元素。使用此运算符，算术表达式解析器中的产生式可以改写如下：\n\
  \n```scala\n def expr: Parser[Any] =\n  term ~! rep(\"+\" ~! term | \"-\" ~! term)\n\
  \  def term: Parser[Any] =\n  factor ~! rep(\"*\" ~! factor | \"/\" ~! factor)\n\
  \  def factor: Parser[Any] =\n  \"(\" ~! expr ~! \")\") | floatingPointNumber\n\
  ```\n\n### 33.11 结论\n\n你现在已经看到了 Scala 组合器解析框架的所有核心元素。对于一个真正实用的东西，代码量少得令人惊讶。通过该框架，你可以为很大一类上下文无关语法构建解析器。该框架让你能够快速上手，但也可以针对新类型的语法和输入方法进行定制。作为一个\
  \ Scala 库，它与语言的其余部分无缝集成。因此，在较大的 Scala 程序中集成组合器解析器非常容易。\n\n\n\n\n组合器解析器（combinator\
  \ parsers）的一个缺点是它们的效率不高，至少与通过 `Yacc` 或 `Bison` 等特殊用途工具生成的解析器相比是如此。原因有两个。首先，组合器解析所使用的回溯方法本身并不高效。根据语法和解析的输入，它可能会由于重复回溯而导致指数级的速度变慢。这可以通过将语法变为\
  \ `LL(1)` 并使用提交式顺序组合操作符 `~!` 来解决。\n\n影响组合器解析器性能的第二个问题是，它们将解析器的构建和输入分析混合在同一组操作中。实际上，对于每个被解析的输入，都会重新生成一个解析器。\n\
  \n这个问题可以克服，但它需要对解析器组合器框架进行不同的实现。在一个优化框架中，解析器将不再被表示为从输入到解析结果的函数。相反，它将被表示为棵树，其中每个构建步骤都表示为一个样例类（case\
  \ class）。例如，顺序组合可以用样例类 `Seq` 表示，备选方案可以用 `Alt` 表示，以此此类推。“最外层”解析器方法 `phrase` 然后可以接收这种解析器的符号表示，并使用标准的解析器生成算法将其转换为高度高效的解析表。\n\
  \n这一切的好处在于，从用户的角度来看，与基础的组合器解析器相比没有任何变化。用户仍然使用 `ident`、`floatingPointNumber`、`~`、`|`\
  \ 等来编写解析器。他们不需要意识到这些方法生成的是解析器的符号表示，而不是解析器函数。由于 `phrase` 组合器会将这些表示转换为真实的解析器，因此一切工作都如以前一样进行。\n\
  \n这种方案在性能方面的优势是双倍的。首先，你现在可以将解析器的构建从输入分析中分离出来。如果你写道：\n\n```\nval jsonParser = phrase(value)\n\
  ```\n\n然后将 `jsonParser` 应用到几个不同的输入，那么 `jsonParser` 只会被构建一次，而不是每次读取输入时都构建。\n\n其次，解析器生成可以使用高效的解析算法，如\
  \ `LALR(1)`。这些算法通常会导致比运行回溯的解析器快得多的解析器。\n\n目前，`Scala` 还没有这样的优化解析器生成器。但这样做是完全可能的。如果有人贡献了这样的生成器，它将很容易集成到标准的\
  \ `Scala` 库中。然而，即使假设这种生成器在未来的某个时刻存在，保留目前的解析器组合器框架也有理由。它比解析器生成器更容易理解和适应，而且在实践中，速度差异通常并不重要，除非你想解析非常大的输入。\n\
  \n***\n\n#### 第 33 章脚注：\n\n[1] 即使在存在左递归的情况下，也有方法可以避免栈溢出，但这一个更精细的解析器组合器框架，该框架目前尚未实现。\n\
  \n[2] Aho, *et. al.*, *Compilers: Principles, Techniques, and Tools*.\n\n[3] Aho,\
  \ *et. al.*, *Compilers: Principles, Techniques, and Tools*.\n\n## 第 34 章\n\n# GUI\
  \ 编程\n\n在本章中，你将学习如何使用 `Scala` 开发带有图形用户界面（GUI）的应用程序。我们将开发的基于一个 `Scala` 库，该库提供了访问\
  \ Java `Swing` GUI 类框架的。概念上讲，`Scala` 库类似于底层的 `Swing` 类，但隐藏了它们的大部分复杂性。你会发现使用该框架开发\
  \ GUI 应用程序实际上非常简单。\n\n即使有了 `Scala` 的简化，像 `Swing` 这样的框架也是非常丰富的，拥有许多不同的类以及每个类中的许多方法。要在这样一个丰富的库中找到路径，使用如\
  \ `Scala` 的 Eclipse 插件之类的 IDE 会很有帮助。优势在于 IDE 可以通过命令补全交互地向你显示某个包中有哪些类，以及你引用的对象可以使用哪些方法。当你第一次探索未知的库空间时，这会大大你的学习速度。\n\
  \n| ![image images/firstSwingAppLittleGray96.png](img/firstSwingAppLittleGray96.png)\
  \ | ![image images/firstSwingAppBigGray96.png](img/firstSwingAppBigGray96.png) |\n\
  \n图 34.1 - 一个简单的 Swing 应用：初始（左）和调整大小（右）。\n\n### 34.1 第一个 Swing 应用\n\n作为第一个 Swing\
  \ 应用，我们将从一个包含单个按钮的窗口开始。要使用 `Swing` 进行编程，你需要从 `Scala` 的 `Swing` API 包中导入各种类：\n\n\
  ```\nimport scala.swing._\n```\n\n列表 34.1 显示了你在 `Scala` 中第一个 Swing 应用的代码。如果你编译并运行该文件，你应该看到如图\
  \ 34.1 左侧所示的窗口。该窗口可以调整为如图 34.1 右侧所示的大小。\n\n```\nimport scala.swing._\n\n  object\
  \ FirstSwingApp extends SimpleSwingApplication {\n    def top = new MainFrame {\n\
  \      title = \"First Swing App\"\n      contents = new Button {\n        text\
  \ = \"Click me\"\n      }\n    }\n  }\n```\n\n##### 列表 34.1 - 一个简单的 Swing 应用。\n\n\
  如果你逐行分析 34.1 中的代码，你会注意到以下元素：\n\n```\nobject FirstSwingApp extends SimpleSwingApplication\
  \ {\n```\n\n在 `import` 之后的第一行中，`FirstSwingApp` 对象继承自 `scala.swing.SimpleSwingApplication`。此应用程序与传统的命令行应用程序不同，后者可能继承自\
  \ `scala.App`。`SimpleSwingApplication` 类已经定义了一个 `main` 方法，其中包含了一些 Java Swing 框架的设置代码。`main`\
  \ 方法继续调用你提供的 `top` 方法：\n\n```\ndef top = new MainFrame {\n```\n\n下一行实现了 `top` 方法。该方法包含了定义你的顶层\
  \ GUI 组件的代码。这通常是某种 `Frame`——即一个可以包含任意数据的窗口。在 34.1 中，我们选择 `MainFrame` 作为顶层组件。`MainFrame`\
  \ 类似于普通的 `Frame`，区别在于关闭它也会关闭整个 GUI 应用程序。\n\n```\ntitle = \"First Swing App\"\n```\n\
  \nFrame 有许多属性。其中最重要的两个是框架的标题（将写入标题栏）和它的内容（将显示在窗口本身中）。在 `Scala` 的 Swing API 中，这些属性被建模为属性。你从第\
  \ 18.2 节知道，属性在 Scala 中被编码为 getter 和 setter 方法的对。例如，`Frame` 对象的 `title` 属性被建模为 getter\
  \ 方法：\n\n```\ndef title: String\n```\n\n以及一个 setter 方法：\n\n```\ndef title_=(s: String)\n\
  ```\n\n通过上述对 `title` 的赋值，被调用的正是这个 setter 方法。赋值的效果是将选定的标题显示在窗口的页头中。如果你遗漏了它，窗口将有一个空标题。\n\
  \n```\ncontents = new Button {\n  text = \"Click me\"\n}\n```\n\n\n\n顶框（top frame）是\
  \ Swing 程序的根组件。它是一个 `Container`，这意味着可以在其中定义更多的组件。每个 Swing 容器都有一个 `contents` 属性，允许你获取和设置它包含的组件。该属性的\
  \ getter `contents` 类型为 `Seq[Component]`，表示一个组件通常可以包含多个对象作为其内容。然而，帧（Frames）的内容始终只包含单个组件。该组件通过\
  \ setter `contents_` 进行设置并可能被更改。例如，在 Listing 34.1 中，单个 `Button` 构成了顶框的内容。\n\n```\n\
  \ text = \"Click me\"\n```\n\n按钮还获得了一个标题，在这种情况下为 \"Click me.\"。\n\n## 34.2 面板与布局\n\
  \n下一步，我们将为应用程序的顶框添加一些文本作为第二个内容元素。图 34.2 的左部分显示了应用程序应该有的样子。\n\n| ![image images/noClicks2Gray96.png](img/noClicks2Gray96.png)\
  \ | ![image images/sevenClicks2Gray96.png](img/sevenClicks2Gray96.png) |\n\n#####\
  \ 图 34.2 - 一个响应式 Swing 应用程序：初始（左）点击后（右）。\n\n```scala\n import scala.swing._\n\n\
  \  object SecondSwingApp extends SimpleSwingApplication {\n    def top = new MainFrame\
  \ {\n      title = \"Second Swing App\"\n      val button = new Button {\n     \
  \   text = \"Click me\"\n      }\n      val label = new Label {\n        text =\
  \ \"No button clicks registered\"\n      }\t\n      contents = new BoxPanel(Orientation.Vertical)\
  \ {\n        contents += button\n        contents += label\n        border = Swing.EmptyBorder(30,\
  \ 30, 10, 30)\n      }\n    }\n  }\n```\n\n##### Listing 34.2 - 面板上的组件组合。\n\n你在上一节中看到，帧恰好包含一个子组件。因此，要创建一个既有按钮又有标签的帧，你需要创建一个同时持有这两者的不同容器组件。这就是面板（panels）的用途。`Panel`\
  \ 是一种容器，它根据某些固定的布局规则显示其包含的所有组件。通过 `Panel` 类的各种子类实现了许多不同的可能布局，从简单到非常复杂。事实上，复杂的 GUI\
  \ 应用程序最困难的部分之一就是获得正确的布局——要设计出一个在所有类型的设备和所有窗口大小下都显示得良好的界面并不是易事的。\n\nListing 34.2\
  \ 显示了一个完整的实现。在这个类中，顶框的两个子组件被命名为 `button` 和 `label`。按钮的定义与之前一样。标签是一个可显示的文本字段，不可编辑：\n\
  \n```scala\n val label = new Label {\n  text = \"No button clicks registered\"\n\
  \ } \n```\n\nListing 34.2 中的代码采用了一种简单的垂直布局，其中组件在 `BoxPanel` 中层层堆叠在一起：\n\n```scala\n\
  \ contents = new BoxPanel(Orientation.Vertical) {\n```\n\n`BoxPanel` 的 `contents`\
  \ 属性是一个（初始为空的）缓冲区，通过 `+=` 运算符向其中添加 `button` 和 `label` ：\n\n```scala\n contents +=\
  \ button\n  contents += label\n```\n\n我们还通过给面板的 `border` 属性赋值为这两个对象添加了一个边框：\n\n\
  ```scala\n border = Swing.EmptyBorder(30, 30, 10, 30)\n```\n\n与其他 GUI 组件一样，边框是以对象表示的。`EmptyBorder`\
  \ 是 `Swing` 对象中的工厂方法，它接受四个参数，表示要绘制对象的顶、右、下、左侧的边框宽度。\n\n尽管简单，该示例已经展示了构建 GUI 应用程序的基本方法。它是由组件构建的，这些组件是\
  \ `scala.swing` 类（如 `Frame`、`Panel`、`Label` 或 `Button`）的实例。组件具有可以通过应用程序自定义的属性。`Panel`\
  \ 组件可以在其 `contents` 属性中包含多个其他组件，因此 GUI 应用程序最终由一个组件树组成。\n\n## 34.3 处理事件\n\n另一方面，应用程序仍然缺少一个基本属性。如果你运行\
  \ Listing 34.2 中的代码并点击显示的按钮，什么都不会发生。事实上，该应用程序是完全静态的；除了顶框的关闭按钮可以终止应用程序外，它对任何用户事件都没有反应。因此，作为下一步，我们将完善应用程序，使其在显示按钮的同时一个标签，指示按钮被点击的次数。图\
  \ 34.2 的右部分包含了几次点击按钮后应用程序应该有的快照。\n\n为了实现这种行为，你需要将用户输入事件（按钮被点击）与动作（更新显示的标签）连接起来。Java\
  \ 和 Scala 在事件处理方面从根本上具有相同的“发布/订阅”方法：组件可以是发布者和/或订阅者。发布者发布事件。订阅者订阅发布者以接收任何发布的事件通知。发布者也称为“事件源”，订阅者也称为“事件监听器”。例如，`Button`\
  \ 是一个事件源，它发布一个名为 `Clicked` 的事件，表示按钮被点击了。\n\n在 Scala 中，订阅事件源是通过调用 `listenTo(source)`\
  \ 完成的。另一种方法是使用 `deafTo(source)` 从事件源取消订阅。在当前的示例应用程序中，要的第一的事情是让顶框监听它的按钮，以便它能接收按钮发出的任何事件通知。要做到这一点，你需要在顶框的体内添加以下调用：\n\
  \n```scala\n listenTo(button)\n```\n\n被通知事件只是故事的一半；另一半是处理它们。这正是 Scala Swing 框架与\
  \ Java Swing API 最不同（且从根本上简单）的地方。在 Java 中，信号一个事件意味着调用必须实现某些 `Listener` 接口的对象中的 \"\
  notify\" 方法。通常，这涉及到大量的间接层和模板代码，使得事件处理类应用程序难以编写和阅读。相比之下，在 Scala 中，事件是一个真实的对象，就像发送给消息一样发送给订阅组件。例如，按下按钮将创建一个以下类类的实例：\n\
  \n```scala\n case class ButtonClicked(source: Button)\n```\n\n类类的参数引用被点击的按钮。与所有的\
  \ Scala Swing 事件一样，此事件类包含名为 `scala.swing.event` 的包中。\n\n要让组件响应传入的事件，你需要向名为 `reactions`\
  \ 的属性添加一个处理器。以下是实现此点的代码：\n\n```scala\n var nClicks = 0\n  reactions += {\n  case\
  \ ButtonClicked(b) =>\n    nClicks += 1\n    label.text = \"Number of button clicks:\
  \ \" + nClicks\n  }\n```\n\n上面的第一行定义了一个变量 `nClicks`，它保存按钮被点击的次数。其余行将括号之间的代码作为处理器添加到顶框的\
  \ `reactions` 属性中。处理器是通过模式匹配事件定义的函数，就像 Akka  Actor 器的接收方法通过模式匹配消息定义一样。上面的处理器匹配形式为\
  \ `ButtonClicked(b)` 的事件，*即*任何是 `ButtonClicked` 类实例的事件。代码中对应此事件的动作增加了 `nClicks`\
  \ 并更新了标签的文本。\n\n通常，处理器是一个 `PartialFunction`，它匹配事件并执行某些操作。你也可以通过使用多个 `case` 在单个处理器中匹配多种类型的事件。\n\
  \n\n\n\n```scala\n import scala.swing._\n  import scala.swing.event._\n\n  object\
  \ ReactiveSwingApp extends SimpleSwingApplication {\n    def top = new MainFrame\
  \ {\n      title = \"Reactive Swing App\"\n      val button = new Button {\n   \
  \     text = \"Click me\"\n      }\n      val label = new Label {\n        text\
  \ = \"No button clicks registered\"\n      }\t\n      contents = new BoxPanel(Orientation.Vertical)\
  \ {\n        contents += button\n        contents += label\n        border = Swing.EmptyBorder(30,\
  \ 30, 10, 30)\n      }\n      listenTo(button)\n      var nClicks = 0\n      reactions\
  \ += {\n        case ButtonClicked(b) =>\n          nClicks += 1\n          label.text\
  \ = \"Number of clicks: \" + nClicks\n      }\n    }\n  }\n```\n\n##### 列表 34.3\
  \ - 实现响应式应用程序\n\n`reactions` 属性实现了一个集合，就像 `contents` 属性一样。某些组件带有预定义的反应。例如，`Frame`\
  \ 有一个预定义的反应，即如果用户按下右侧的关闭按钮，它将关闭。如果你通过向 `reactions` 属性添加 `+=` 来安装你自己的反应，那么你定义的反应将在标准反应之外被考虑。从概念上讲，`reactions`\
  \ 中的处理器形成了一个栈。在当前示例中，如果顶层框架接收到一个事件，第一个尝试的处理器将是匹配 `ButtonClicked` 的那个，因为它是最后安装的。如果收到的事件是\
  \ `ButtonClicked`，则会调用与模式关联的代码。在该代码执行完成后，系统将在事件栈中搜索可能适用的处理器。如果收到的事件不是 `ButtonClicked`，则事件将立即传播到处理器栈的其他部分。可以使用\
  \ `-=` 运算符从反应属性中移除处理器。\n\n列表 34.3 显示了完整的应用程序，包括反应。该代码说明了 Scala Swing 框架中 GUI 应用程序的核心元素：应用程序由一个组件树组成，从顶层框架开始。代码中显示的组件有\
  \ `Frame`、`BoxPanel` 和 `Label`，但 Swing 库中定义了许多其他类型的组件。每个组件都通过属性进行自定义。两个重要的属性是 `contents`，它固定了树中的子节点，以及\
  \ `reactions`，它决定了组件对事件的反应。\n\n![image images/tempGray112.png](img/tempGray112.png)\n\
  \n##### 图 34.3 - 摄氏度与华华度之间的转换器\n\n```scala\n import swing._\n import event._\n\n\
  \  object TempConverter extends SimpleSwingApplication {\n    def top = new MainFrame\
  \ {\n      title = \"Celsius/Fahrenheit Converter\"\n      object celsius extends\
  \ TextField { columns = 5 }\n      object fahrenheit extends TextField { columns\
  \ = 5 }\n      contents = new FlowPanel {\n        contents += celsius\n       \
  \ contents += new Label(\" Celsius = \")\n        contents += fahrenheit\n     \
  \   contents += new Label(\" Fahrenheit\")\n        border = Swing.EmptyBorder(15,\
  \ 10, 10, 10)\n      }\n      listenTo(celsius, fahrenheit)\n      reactions +=\
  \ {\n        case EditDone(`fahrenheit`) =>\n          val f = fahrenheit.text.toInt\n\
  \          val c = (f - 32) * 5 / 9\n          celsius.text = c.toString\n     \
  \   case EditDone(`celsius`) =>\n          val c = celsius.text.toInt\n        \
  \  val f = (c * 9 / 5) + 32\n          fahrenheit.text = f.toString\n      }\n \
  \   }\n  }\n```\n\n\n\n\n\n关于原始 Java Swing 框架也有许多教程，Scala 包装器正是基于此框架。[1]](#gui-programming.html_footnotemain34-1)\
  \ Scala 包装器与底层的 Swing 类相似，但尽可能简化了概念并使它们更加统一。这种简化大量利用了 Scala 语言的特性。例如，Scala 对属性的模拟以及对运算符的重载允许使用赋值和\
  \ `+=` 操作来方便地定义属性。其“万物皆对象”的哲学使得继承 GUI 应用的主方法成为可能。因此，该方法可以从用户应用程序中隐藏，包括随之而来的设置样板代码。最后，最重要的一点是，Scala\
  \ 的一级函数和模式匹配使得将事件处理表述为响应组件属性成为可能，这极大地简化了应用程序开发者的工作。\n\n*** *\n\n### 第 34 章脚注：\n\n\
  [1] 请参考《Java 教程》(The Java Tutorials)。[[Jav]](#bibliography.html_JavaTutorials)\n\
  \n## 第 35 章\n\n# SCells 电子表格程序\n\n在之前的章节中，你看到了 Scala 编程语言的许多不同结构。在本章中，你将看到这些结构在实现一个大型应用时是如何协同运作的。任务是编写一个名为\
  \ SCells 的电子表格应用程序。\n\n这项任务之所以有趣，有几个原因。首先，大家都熟悉电子表格，因此很容易理解应用程序应该做什么。其次，电子表格是执行大量不同计算任务的程序。它有视觉方面，即电子表格被视为一个功能丰富的\
  \ GUI 应用；它有符号方面，涉及到公式以及如何解析和解释公式；它有计算方面，处理如何增量更新可能巨大的表格；它有响应方面，电子表格被视为以复杂方式对事件做出反应的程序；最后，还有组件方面，应用程序被构建为一组可重用的组件。这些方面将在本章中进行深入讨论。\n\
  \n![image images/scells1Gray96.png](img/scells1Gray96.png)\n\n##### 图 35.1 - 一个简单的电子表格单元。\n\
  \n### 35.1 视觉框架\n\n我们将从编写应用程序的基础视觉框架开始。图 35.1 显示了用户界面的第一次迭代。你可以看到电子表格是一个可滚动的表格。它有从\
  \ 0 到 99 的行和从 A 到 Z 的列。在 Swing 中，你通过将电子表格定义为包含 `Table` 的 `ScrollPane` 来体现这一点。代码列表\
  \ 35.1 显示了代码。\n\n```\n package org.stairwaybook.scells\n  import swing._\n\n  class\
  \ Spreadsheet(val height: Int, val width: Int) \n      extends ScrollPane {\n\n\
  \    val table = new Table(height, width) {\n      rowHeight = 25\n      autoResizeMode\
  \ = Table.AutoResizeMode.Off\n      showGrid = true\n      gridColor = new java.awt.Color(150,\
  \ 150, 150)\n    }\n\n    val rowHeader = \n      new ListView((0 until height)\
  \ map (_.toString)) {\n          fixedCellWidth = 30\n          fixedCellHeight\
  \ = table.rowHeight\n      }\n\n    viewportView = table\n    rowHeaderView = rowHeader\n\
  \  }\n```\n\n##### 代码列表 35.1 - 图 35.1 中电子表格的代码。\n\n代码列表 35.1 所示的电子表格组件定义在 `org.stairwaybook.scells`\
  \ 包中，该包将包含应用程序所需的所有类、特征和对象。它从 `scala.swing` 包导入了 Scala Swing 包装器的基本元素。`Spreadsheet`\
  \ 本身是一个以高度和宽度（单元格数）为参数的类。该类扩展了 `ScrollPane`，为其提供了图 35.1 中的底部和右侧滚动条。它包含了两个名为 `table`\
  \ 和 `rowHeader` 的子组件。\n\n表格组件是 `scala.swing.Table` 类匿名子类的实例。其体中的四行设置了它的部分属性：`rowHeight`\
  \ 设置表格行的高度（磅为单位），`autoResizeMode` 关闭表格的自动调整大小，`showGrid` 显示单元格之间的网格线，以及 `gridColor`\
  \ 将网格颜色设置为深灰色。\n\n`rowHeader` 组件包含了图 35.1 中电子表格左侧的行号，它是一个 `ListView`，在元素中显示从 0 到\
  \ 99 的字符串。其体中的两行将单元格宽度固定为 30 磅，高度与表格的 `rowHeight` 相同。\n\n整个电子表格通过设置 `ScrollPane`\
  \ 中的两个字段来组装。`viewportView` 字段设置为 `table`，而 `rowHeaderView` 字段设置为 `rowHeader` 列表。这两个视图的区别在于，滚动面板的视口是随着两个滚动条移动的区域，而左侧的行标题在移动水平滚动条时保持固定的。由于某种特殊机制，Swing\
  \ 默认已在表格顶部提供了一个列标题，因此不需要显式定义它。\n\n```\n package org.stairwaybook.scells\n  import\
  \ swing._\n\n  object Main extends SimpleApplication {\n    def top = new Frame\
  \ {\n      title = \"ScalaSheet\"\n      contents = new Spreadsheet(100, 26)\n \
  \   }\n  }\n```\n\n##### 代码列表 35.2 - 应用程序的主程序。\n\n要尝试代码列表 35.1 中的电子表格，你只需要定义一个创建\
  \ `Spreadsheet` 组件的主程序。此类程序在代码列表 35.2 所示。\n\n`Main` 继承自 `SimpleApplication`，它处理应用程序运行之前需要设置的所有低级细节。你只需要定义应用程序的顶层窗口。在我们的示例中，`top`\
  \ 是一个 `Frame`，具有两个元素：它的 `title`（设置为 \"ScalaSheet\"）和它的 `contents`（设置为 `Spreadsheet`\
  \ 的实例）。\n\n### 35.2 解耦数据输入与显示\n\n如果你试用一下目前编写的电子表格，你会很快发现在单元格中显示的输出与你输入的内容完全一样。真实的电子表格行为并不是这样。在真实的电子表格中，你会输入一个公式并看到它的值。因此，输入到单元格的内容与显示的内容不同的。\n\
  \n```\n package org.stairwaybook.scells\n  import swing._\n\nclass Spreadsheet(val\
  \ height: Int, val width: Int) \n    extends ScrollPane {\n\n    val cellModel =\
  \ new Model(height, width)\n    import cellModel._\n\n    val table = new Table(height,\
  \ width) {\n\n      // 设置同上文... \n\n      override def rendererComponent(isSelected:\
  \ Boolean,\n        hasFocus: Boolean, row: Int, column: Int): Component =\n   \
  \     if (hasFocus) new TextField(userData(row, column))\n        else\n       \
  \   new Label(cells(row)(column).toString) { \n            xAlignment = Alignment.Right\
  \ \n          }\n    }\n\n    def userData(row: Int, column: Int): String = {\n\
  \      val v = this(row, column)\n      if (v == null) \"\" else v.toString\n  \
  \  }\n  }\n  // 其余同上文... \n}\n```\n\n##### 代码列表 35.3 - 具有 `rendererComponent` 方法的电子表格。\n\
  \n\n\n\n\n作为实现真实电子表格应用程序的第一步，你应该专注于将数据输入和显示解耦。显示的基本机制包含在 `Table` 类的 `rendererComponent`\
  \ 方法中。默认情况下，`rendererComponent` 总是显示输入的内容。如果你想更改这一点，就需要重写 `rendererComponent` 以执行不同的操作。Listing\
  \ 35.3 显示了带有 `rendererComponent` 方法的新版本 `Spreadsheet`。\n\n`rendererComponent` 方法重写了\
  \ `Table` 类中的一个默认方法。它接受四个参数。`isSelected` 和 `hasFocus` 参数是布尔值，指示单元格是否被选中以及是否具有焦点（这意味着键盘事件将进入该单元格）。另外两个参数\
  \ `row` 和 `column` 单元格的坐标。\n\n新的 `rendererComponent` 方法检查单元格是否具有输入焦点。如果 `hasFocus`\
  \ 为 true，则该单元格用于编辑。在这种情况下，你想要显示一个可编辑的 `TextField`，其中包含用户目前为止输入的数据。这些数据由辅助方法 `userData`\
  \ 返回，该方法显示给定 `row` 和 `column` 处的表格内容。内容通过调用 `this(row, column)` 获取[[1]](#the-scells-spreadsheet.html_footnotemain35-1)。`userData`\
  \ 方法还负责将空元素显示为空字符串而不是 \"null\"。\n\n到目前为止一切进展顺利。但如果单元格没有焦点，应该显示什么呢？在真实的电子表格中，这将是单元格的值。因此，实际上有两个表在工作。第一个名为\
  \ `table` 的表包含用户输入的内容。第二个“影子”表包含单元格的内部表示以及应该显示的内容。在电子表格示例中，这个表是一个名为 `cells` 的二维数组。如果给定\
  \ `row` 和 `column` 处的单元格没有编辑焦点，`rendererComponent` 方法将显示元素 `cells(row)(column)`。该元素不可编辑，因此它应该显示在\
  \ `Label` 中而不是可编辑的 `TextField` 中。\n\n接下来需要定义单元格的内部数组。你可以直接在 `Spreadsheet` 类中定义它，但通常最好将\
  \ GUI 组件的视图与其内部模型分离开。这就是为什么在上面的示例中，`cells` 数组定义在一个名为 `Model` 的独立类中。通过定义一个类型为 `Model`\
  \ 的值 `cellModel`，模型被集成到 `Spreadsheet` 中。跟随该 `val` 定义的导入语句使得 `cellModel` 的成员在 `Spreadsheet`\
  \ 内部可用而无需加前缀。Listing 35.4 显示了 `Model`类的第一个简化版本。该类定义了一个内部类 `Cell` 以及一个 `Cell` 元素的二维数组\
  \ `cells`。每个元素都被初始化为一个新的 `Cell`。\n\n```\npackage org.stairwaybook.scells\n\nclass\
  \ Model(val height: Int, val width: Int) { \n\n  case class Cell(row: Int, column:\
  \ Int)\n\n  val cells = Array.ofDimCell \n\n  for (i <- 0 until height; j <- 0 until\
  \ width) \n    cells(i)(j) = new Cell(i, j)\n}\n```\n\n##### Listing 35.4 - Model\
  \ 类的第一个版本。\n\n![image images/scells2Gray96.png](img/scells2Gray96.png)\n\n#####\
  \ Figure 35.2 - 单元格自显示。\n\n就是这样。如果你带有 `Model` 类编译修改后的 `Spreadsheet` 类并运行 `Main`\
  \ ，你应该能看到一个如 Figure 35.2 所示的窗口。\n\n本节的目标是实现一种设计，使得单元格的显示值与输入它的字符串不同。这个目标显然已经实现，尽管方式非常粗糙。在新的电子表格中，你可以向单元格输入任何你想要的内容，但一旦它失去焦点，它将始终显示其坐标。显然，我们还没有完成。\n\
  \n### 35.3 公式\n\n在现实中，电子表格单元格持有两个东西：一个实际值和一个用于计算该值的公式。电子表格中共有三种类型的公式：\n\n1. 数值，例如\
  \ 1.22、-3 或 0。\n2. 文本标签，例如 Annual sales（年销售额）、Deprecation 或 total。\n3. 从单元格内容计算新值的公式，例如\
  \ \"=add(A1,B2)\" 或 \"=sum(mul(2, A2), C1:D16)\"。\n\n计算值的公式始终以等号开头，后面跟着一个算术表达式。`SCells`\
  \ 电子表格对算术表达式有一个特别简单且统一的规范：每个表达式都是某些函数对参数列表的应用。函数名是一个标识符，例如用于二进制加法的 `add`，或用于任意数量操作数求和的\
  \ `sum`。函数参数可以是数字、单元格引用、单元格范围引用（如 `C1:D16`）或另一个函数应用。你稍后会看到 SCells 具有开放式架构，这使得可以通过混入组合（mixin\
  \ composition）轻松安装自己的函数。\n\n处理公式的第一步是写下表示它们的类型。正如你所预期的，不同类型的公式由 case 类表示。Listing\
  \ 35.5 显示了名为 `Formulas.scala` 的文件的内容，这些 case 类就在其中定义：\n\n```\npackage org.stairwaybook.scells\n\
  \ntrait Formula  \n\ncase class Coord(row: Int, column: Int) extends Formula {\n\
  \  override def toString = ('A' + column).toChar.toString + row\n}\ncase class Range(c1:\
  \ Coord, c2: Coord) extends Formula {\n  override def toString = c1.toString + \"\
  :\" + c2.toString\n}\ncase class Number(value: Double) extends Formula {\n  override\
  \ def toString = value.toString\n}\ncase class Textual(value: String) extends Formula\
  \ {\n  override def toString = value\n}\ncase class Application(function: String,\
  \ arguments: List[Formula]) extends Formula {\n  override def toString = function\
  \ + arguments.mkString(\"(\", \")\")\n}\nobject Empty extends Textual(\"\")\n```\n\
  \n##### Listing 35.5 - 表示公式的类。\n\nListing 35.5 所示的 trait `Formula` 有五个子类 case 类：\n\
  \n- `Coord`：用于单元格坐标，如 `A3`，\n- `Range`：用于单元格范围，如 `A3:B17`，\n- `Number`：用于浮点数，如 `3.1415`，\n\
  - `Textual`：用于文本标签，如 `Deprecation`，\n- `Application`：用于函数应用，如 `sum(A1,A2)`。\n\n\
  每个 case 类都重写了 `toString` 方法，以便以上述所示的标准方式显示其类型的公式。为了方便起见，还有一个 `Empty` 对象来表示空单元格的内容。`Empty`\
  \ 对象是带有空字符串参数的 `Textual` 类的实例。\n\n### 35.4 解析公式\n\n在上一节中，你看到了不同类型的公式以及它们如何以字符串形式显示。在本节中，你将看到如何反转这个过程：将用户输入的字符串转换为\
  \ `Formula` 树。本节其余部分将逐一解释 `FormulaParsers` 类的元素，该类包含了执行转换的解析器。该类基于第 33 章中提供的组合器框架。具体来说，公式解析器是该章节中解释的\
  \ `RegexParsers` 类的实例：\n\n```\npackage org.stairwaybook.scells\nimport scala.util.parsing.combinator._\n\
  \nobject FormulaParsers extends RegexParsers {\n```\n\n`FormulaParsers` 对象的前两个元素是用于标识符和十进制数的辅助解析器：\n\
  \n```\ndef ident: Parser[String] = \"\"\"[a-zA-Z_]\\w*\"\"\".r\ndef decimal: Parser[String]\
  \ = \"\"\"-?\\d+(\\.\\d*)?\"\"\"\".r\n```\n\n\n\n\n\n如你从上面的第一个正则表达式所示，标识符以字母或下划线开头。其后是任意数量的“单词”字符，这些字符由正则表达式代码\
  \ `\\w` 表示，它识别字母、数字或下划线。第二个正则表达式描述十进制数，由一个可选的负号、一个或多个由正则表达式代码 `\\d` 表示的数字，以及一个可选的小数部分组成（小数部分由小数点加上零或多个数字组成）。\n\
  \n`FormulaParsers` 对象的下一个元素是单元格解析器（cell parser），它识别单元格的坐标，例如 `C11` 或 `B2`。它首先调用一个正则表达式解析器来确定坐标的形式：单个字母后跟一个或多个数字。该解析器返回的字符串通过分离字母和数值部分，并将这两个部分转换为单元格列和行的索引，从而被转换为单元格坐标：\n\
  \n```scala\n def cell: Parser[Coord] = \n  \"\"\"[A-Za-z]\\d+\".r ^^ { s => \n \
  \   val column = s.charAt(0).toUpper - 'A'\n    val row = s.substring(1).toInt\n\
  \    Coord(row, column)\n  }\n```\n\n注意，单元格解析器有一点局限性，因为它只允许由单个字母组成的列坐标。因此，电子表格的列数实际上被限制为最多\
  \ 26 列，因为进一步的列无法被解析。将解析器泛化以使其接受具有多个开头字母的单元格是一个好主意。这留给你你来练习。\n\n范围解析器（range parser）识别单元格范围。此类范围由两个单元格坐标以及它们之间的一个冒号组成：\n\
  \n```scala\n def range: Parser[Range] = \n  cell~\":\"~cell ^^ { \n    case c1~\"\
  :\"~c2 => Range(c1, c2) \n  }\n```\n\n数字解析器（number parser）识别十进制数，它被转换为 `Double`\
  \ 并封装在 `Number` 类的实例中：\n\n```scala\n def number: Parser[Number] =\n  decimal ^^\
  \ (d => Number(d.toDouble))\n```\n\n应用解析器（application parser）识别函数应用。此类应用由一个标识符后跟一组括号内的参数表达式列表组成：\n\
  \n```scala\n def application: Parser[Application] = \n  ident~\"(\"~repsep(expr,\
  \ \",\")~\") ^^ { \n    case f~\"(\"~ps~\")\" => Application(f, ps) \n  }\n```\n\
  \n`expr` 解析器识别公式表达式——要么是跟在 `=` 后的顶层公式，要么是函数的参数。这种公式表达式被定义为单元格、单元格范围、数字或一个应用：\n\n\
  ```scala\n def expr: Parser[Formula] =\n  range | cell | number | application\n\
  ```\n\n这个 `expr` 解析器的定义包含了一个轻微的过度简化，因为单元格范围只应该作为函数参数出现；不应允许其作为顶层公式。你可以更改公式语法，使两种表达式的使用隔离开，并在语法上从顶层公式中排除范围。在处演示的电子表格中，这种错误会在表达式求值时被检测到。\n\
  \n文本解析器（textual parser）识别任意输入字符串，只要它不以等号开头（记住以 `==` 开头的字符串被视为公式）：\n\n```scala\n\
  \ def textual: Parser[Textual] = \n  \"\"\"[^=].\"\"\".r ^^ Textual\n```\n\n公式解析器（formula\
  \ parser）识别输入单元格的所有合法输入。公式要么是数字、文本输入，要么是以等号开头的公式：\n\n```scala\n def formula: Parser[Formula]\
  \ = \n  number | textual | \"=\"~>expr\n```\n\n到此，电子表格单元格的语法结束。最终的方法 `parse` 在一个方法中使用此语法，该方法将输入字符串转换为\
  \ `Formula` ：\n\n```scala\n def parse(input: String): Formula =\n  parseAll(formula,\
  \ input) match {\n    case Success(e, _) => e\n    case f: NoSuccess => Textual(\"\
  [\" + f.msg + \"]\")\n  }\n} //end FormulaParsers\n```\n\n`parse` 方法使用 `formula`\
  \ 解析器解析所有输入。如果成功，则返回生成的公式。如果失败，则改为返回一个带有错误信息的 `Textual` 对象。\n\n```scala\npackage\
  \ org.stairwaybook.scells\n  import swing._\n  import event._\n\n  class Spreadsheet(val\
  \ height: Int, val width: Int) ... {\n    val table = new Table(height, width) {\n\
  \      ...\n      reactions += {\n        case TableUpdated(table, rows, column)\
  \ =>\n          for (row <- rows)\n            cells(row)(column).formula = \n \
  \             FormulaParsers.parse(cells(row)(column).text)\n      }\n    }\n  }\n\
  ```\n\n\n\n\n我们需要一个方法 `evaluate`，它接收一个公式并返回该公式在当前电子表格中的值，返回类型表示为 `Double`。我们将此方法放置在一个新\
  \ Trait `Evaluator` 中。该方法需要访问 `Model` 类中的 `cells` 字段，以获取公式中引用的单元格的当前值。另一方面，`Model`\
  \ 类也需要调用 `evaluate`。因此，`Model` 和 `Evaluator` 之间存在循环依赖。类与之间这种循环依赖的一种优良表达式在 第 29 节\
  \ 中展示过：你可以在一个方向上使用继承，在另一个方向上使用自类型（self types）。\n\n在电子表格示例中，`Model` 类继承自 `Evaluator`，从而获得了对其评估方法的访问权限。要实现反向操作，`Evaluator`\
  \ 类定义其自类型为 `Model`，如下所示：\n\n```\npackage org.stairwaybook.scells\n trait Evaluator\
  \ { this: Model => ... }\n```\n\n这样一来，类 `Evaluator` 内部的 `this` 值被假设为 `Model`，通过编写\
  \ `cells` 或 `this.cells` 即可访问 `cells` 数组。\n\n现在连接工作已经完成，我们将专注于定义 `Evaluator` 类的内容。代码列表\
  \ 35.7 显示了 `evaluate` 方法的实现。正如你所预期的，该方法对不同类型的公式执行了模式匹配。对于坐标 `Coord(row, column)`，它返回\
  \ `cells` 数组在该坐标处的值。对于数字 `Number(v)`，它返回值 `v`。对于文本标签 `Textual(s)`，它返回零。最后，对于一个应用\
  \ `Application(function, arguments)`，它计算所有参数的值，从操作表中检索与函数名对应的函数对象，并将该函数应用于所有参数值。\n\
  \n```\ndef evaluate(e: Formula): Double = try {\n  e match {\n    case Coord(row,\
  \ column) => \n      cells(row)(column).value\n    case Number(v) => \n      v\n\
  \    case Textual(_) => \n      0\n    case Application(function, arguments) =>\n\
  \      val argvals = arguments flatMap evalList\n      operations(function)(argvals)\n\
  \  }\n} catch {\n  case ex: Exception => Double.NaN\n}\n```\n\n##### 代码列表 35.7 -\
  \ trait Evaluator 的 evaluate 方法。\n\n操作表将函数名映射到函数对象。它的定义如下：\n\n```\ntype Op = List[Double]\
  \ => Double\nval operations = new collection.mutable.HashMap[String, Op]\n```\n\n\
  从这个定义可以看出，`operations` 被建模为从值列表到值的函数。`Op` 类型为操作类型引入了一个方便的别名。\n\n`evaluate` 中的计算被封装在\
  \ `try-catch` 块中，以防止输入错误。在评估单元格公式时，实际上有很多可能出现问题：坐标可能超出范围；函数名可能未定义；函数的参数数量可能错误；算术运算可能非法或溢出。对任何这些错误的反应都是相同的：返回一个“非数字”（not-a-number）值。返回的值\
  \ `Double.NaN` 是对没有可表示浮点值的计算结果的 IEEE 表示。这可能是由于溢出或除以零引起的，例如。代码列表 35.7 中的 `evaluate`\
  \ 方法选择对所有其他类型的错误也返回相同的值。这种方案的优点是易于理解且不需要大量代码即可实现。它的缺点是所有类型的错误都混在一起了，因此电子表格用户无法获得关于何错误的详细反馈。如果你愿意，可以尝试在\
  \ SCells 应用中使用更精细的方法来表示错误。\n\n参数的评估与顶层公式的评估不同。参数可能是列表，而顶层函数可能不是。例如，`sum(A1:A3)`\
  \ 中的参数表达式 `A1:A3` 返回单元格 `A1`、`A2`、`A3` 的值的列表。然后，该列表被传递给 `sum` 操作。在参数表达式中混合列表和单值也是可能的，例如操作\
  \ `sum(A1:A3, 1.0, C7)`，它将累加五个值。为了处理可能评估为列表的参数，还有另一个评估函数称为 `evalList`，它接收一个公式并返回一个值列表：\n\
  \n```\nprivate def evalList(e: Formula): List[Double] = e match {\n  case Range(_,\
  \ _) => references(e) map (_.value)\n  case _ => List(evaluate(e))\n}\n```\n\n如果传递\
  \ `evalList` 的公式参数是 `Range`，则返回的值是一个由该范围引用的所有单元格值组成的列表。对于其他任何公式，结果都是由该公式的单一结果值组成的列表。公式引用的单元格由第三个函数\
  \ `references` 计算。以下是它的定义：\n\n```\ndef references(e: Formula): List[Cell] = e match\
  \ {\n  case Coord(row, column) => \n    List(cells(row)(column))\n  case Range(Coord(row1,\
  \ column1), Coord(row2, column2)) => \n    for (row <- row1 to row2; column <- column1\
  \ to column2)\n    yield cells(row)(column)\n  case Application(function, arguments)\
  \ =>\n    arguments flatMap references\n  case _ =>\n    List()\n}\n```\n\n`references`\
  \ 方法现在实际上比需要的更通用，因为它计算的是任何公式的单元格列表，而不仅仅是 `Range`。该方法体是对类型进行模式匹配。对于 `Coord(row, column)`，它返回该坐标处的单个单元格。对于\
  \ `Range(Coord(row1, column1), Coord(row2, column2))`，它返回两个坐标之间的所有单元格。对于 `Application(function,\
  \ arguments)`，它返回参数。对于其他类型，它返回一个空列表。\n\n### 35.6 操作\n\n`Evaluator` 类没有定义任何可以在单元格上执行的操作：它的操作表最初是空的。这种思想是在其他\
  \ Trait 中定义此类操作，然后将它们混入 `Model` 类中。代码列表 35.8 显示了一个实现常用算术运算的示例 Trait：\n\n```\npackage\
  \ org.stairwaybook.scells\n trait Arithmetic { this: Evaluator =>\n  operations\
  \ += List(\n    \"add\" -> { case List(x, y) => x + y },\n    \"sub\" -> { case\
  \ List(x, y) => x - y },\n    \"div\" -> { case List(x, y) => x / y },\n    \"mul\"\
  \ -> { case List(x, y) => x * y },\n    \"mod\" -> { case List(x, y) => x % y },\n\
  \    \"sum\" -> { xs => xs.foldLeft(0.0)(_ + _) },\n    \"prod\" -> { xs => xs.foldLeft(1.0)(_\
  \ * _) }\n  )\n }\n```\n\n##### 代码列表 35.8 - 用于算术运算的库。\n\n有趣的是，这个 Trait 没有导出的成员。它所做的仅仅是在初始化期间填充\
  \ `operations` 表。它通过使用自类型 `Evaluator` 获取该表的访问，*即*，与 `Arithmetic` 类获取模型的方法相同。\n\n\
  在 `Arithmetic` Trait 定义的七个操作中，五个是二元操作，两个接受任意数量的参数。二元操作都遵循相同的模式。例如，加法操作 `add` 由以下表达式定义：\n\
  \n```\n { case List(x, y) => x + y }\n```\n\n\n\n也就是说，它期望一个包含两个元素 `x` 和 `y` 的参数列表，并返回\
  \ `x` 和 `y` 的和。如果参数列表中的元素数量不是两个，则会抛出 `MatchError`。这对应于 `SCell` 求模型通用的“让它崩溃”（let\
  \ it crash）哲学，即预期错误的输入会导致运行时异常，然后由评估方法内部的 `try-catch` 捕获。\n\n最后两个操作 `sum` 和 `prod`\
  \ 接受任意长度的参数列表，并在连续元素之间插入二元操作。因此它们是“左折叠”（fold left）模式的实例，该模式在 `List` 类中通过 `/` 操作表示。例如，对数字列表\
  \ `List(x, y, z)` 求和，该操作会计算 `0 + x + y + z`。第一个操作数 `0` 是列表为空时的结果。\n\n你可以通过将 `Arithmetic`\
  \ trait 混合到 `Model` 类中将此操作库集成到电子表格应用程序中，如下：\n\n```scala\n package org.stairwaybook.scells\n\
  \n  class Model(val height: Int, val width: Int) \n    extends Evaluator with Arithmetic\
  \ { \n\n  case class Cell(row: Int, column: Int) {\n    var formula: Formula = Empty\n\
  \    def value = evaluate(formula)\n\n    override def toString = formula match\
  \ {\n      case Textual(s) => s\n      case _ => value.toString\n    }\n  }\n\n\
  \    ... // 其余部分相同\n}\n```\n\n`Model` 类的另一个变化涉及单元格显示自己的的方式在新版本中，单元格的显示值取决于它的公式。如果公式是\
  \ `Textual` 字段，则字面显示该字段的内容。在所有其他情况下，公式都会被评估，并显示该评估的结果值。\n\n![image images/scells4Gray96.png](img/scells4Gray96.png)\n\
  \n##### 图 35.4 - 计算的单元格。\n\n如果你编译了更改后的 trait 和类并重新启动 `Main` 程序，你将得到一个类似于真实电子表格的东西。图\
  \ 35.4 显示了一个示例。你可以向单元格中输入公式并让它们进行自我评估。例如，一旦你关闭图 35.4 中单元格 `C5` 的编辑焦点，你应该看到 `86.0`，这是公式\
  \ `sum(C1:C4)` 的评估结果。\n\n然而，仍然缺少一个关键元素。如果你将图 35.4 中单元格 `C1` 的值从 `20` 改为 `100`，单元格\
  \ `C5` 中的和不会自动更新为 `166`。你必须手动点击 `C5` 才能看到值的变化。仍然缺少的是让单元格在更改后自动重新计算值的方法。\n\n### 35.7\
  \ 变化传播\n\n如果单元格的值发生了变化，所有依赖于该值的单元格都应该重新计算并重新显示结果。实现这一点最简单的方法是在每次更改后重新计算电子表格中每个单元格的值。然而，随着电子表格规模的增大，这种方法的扩展性并不良好。\n\
  \n更好的方法是仅重新计算那些在其公式中引用了已更改单元格的单元格。其想法是使用基于事件的发布/订阅框架进行变化传播：一旦单元格被分配了一个公式，它将订阅并接收公式所引的所有单元格的值变化通知。这些单元格中一个值的变化将触发订阅者单元格的重新评估。如果这种重新评估导致单元格值的变化，它将反过来通知所有依赖于它的单元格。该过程一直持续到所有单元格值稳定，*即*任何单元格的值不再发生变化[[3]](#the-scells-spreadsheet.html_footnotemain35-3)\n\
  \n发布/订阅框架在 `Model` 类中通过 `Scala` 的 `Swing` 框架的标准机制实现。这里是该类的新（也是最终）版本：\n\n```scala\n\
  \ package org.stairwaybook.scells\n  import swing._\n\n  class Model(val height:\
  \ Int, val width: Int) \nextends Evaluator with Arithmetic {\n```\n\n与之前的 `Model`\
  \ 版本相比，此版本增加了对 `swing._` 的导入，这使得 `Swing` 的事件抽象直接可用。\n\n`Model` 类的主要修改涉及嵌套类 `Cell`。`Cell`\
  \ 类现在继承自 `Publisher`，因此它可以发布事件。事件处理逻辑完全包含在两个属性的设置器中：`value` 和 `formula`。这里是 `Cell`\
  \ 的新版本：\n\n```scala\n case Cell(row: Int, column: Int) extends Publisher {\n  override\
  \ def toString = formula match {\n    case Textual(s) => s\n    case _ => value.toString\n\
  \  }\n```\n\n在外部看来，`value` 和 `formula` 看起来是 `Cell` 类中的两个变量。它们的实际实现基于两个私有字段，这些字段配备了公共\
  \ getter `value` 和 `formula`，以及 setter `value_` 和 `formula_`。以下是实现 `value` 属性的定义：\n\
  \n```scala\n private var v: Double = 0\n  def value: Double = v\n  def value_(w:\
  \ Double) = {\n    if (!(v == w || v.isNaN && w.isNaN)) {\n      v = w\n      publish(ValueChanged(this))\n\
  \    }\n  }\n```\n\n`value_` setter 将新值 `w` 分配给私有字段 `v`。如果新值与旧值不同，它还会发布一个以单元格本身为参数的\
  \ `Changed` 事件。注意，测试值是否发生变化有点棘，因为涉及到值 `NaN`。Java 规范说 `NaN` 与其他任何值不同，包括它自己！因此，测试两个值是否相同必须特殊处理\
  \ `NaN`：如果两个值 `v`, `w` 在 `==` 方面是等的，或者它们都是值 `NaN`，*即* `v.isNaN` 和 `w.isNaN` 都产生真，则它们相同。\n\
  \n虽然 `value_` setter 在发布/订阅框架中执行发布，而 `formula_` setter 则执行订阅：\n\n```scala\n private\
  \ var f: Formula = Empty\n  def formula: Formula = f\n  def formula_(f: Formula)\
  \ = {\n  for (c <- references(formula)) deafTo(c)\n  this.f = f\n  for (c <- references(formula))\
  \ listenTo(c)\n  value = evaluate(f)\n  }\n```\n\n如果给单元格分配一个新公式，它首先通过 `deafTo` 从之前公式值引用的所有单元格取消订阅。然后它将新公式存储在私有变量\
  \ `f` 中，并通过 `listenTo` 订阅它引用的所有单元格。最后，它使用新公式重新计算其值。\n\n修订后 `Cell` 类的最后代码指定了如何响应\
  \ `ValueChanged` 事件：\n\n```scala\n reactions += {\n  case ValueChanged(_) => value\
  \ = evaluate(formula)\n}\n  }\n```\n\n`ValueChanged` 类也包含在 `Model` 类中：\n\n```scala\n\
  \ case class ValueChanged(cell: Cell) extends event.Event\n```\n\n`Model` 类的其余部分与之前：\n\
  \n```scala\n val cells = Array.ofDimCell \n\n  for (i <- 0 until height; j <- 0\
  \ until width)\n    cells(i)(j) = new Cell(i, j)\n} // end class Model\n```\n\n\n\
  \n\n```scala\n package org.stairwaybook.scells\n  import swing._, event._\n\n  class\
  \ Spreadsheet(val height: Int, val width: Int) \n    extends ScrollPane {\n\n  \
  \  val cellModel = new Model(height, width)\n    import cellModel._\n\n    val table\
  \ = new Table(height, width) {\n      ... // settings as in Listing ???\n\n    \
  \  override def rendererComponent(\n              isSelected: Boolean, hasFocus:\
  \ Boolean, \n              row: Int, column: Int) =\n        ... // as in Listing\
  \ ???\n\n      def userData(row: Int, column: Int): String = \n        ... // as\
  \ in Listing ???\n\n      reactions += {\n        case TableUpdated(table, rows,\
  \ column) =>\n          for (row <- rows)\n            cells(row)(column).formula\
  \ = \n              FormulaParsers.parse(userData(row, column))\n      case ValueChanged(cell)\
  \ =>\n          updateCell(cell.row, cell.column)\n      }\n\n      for (row <-\
  \ cells; cell <- row) listenTo(cell)\n    }\n\n    val rowHeader = new ListView(0\
  \ until height) {\n      fixedCellWidth = 30\n      fixedCellHeight = table.rowHeight\n\
  \    }\n\n    viewportView = table\n    rowHeaderView = rowHeader\n  }\n```\n\n\
  ##### 列表 35.9 - 完成的电子表格组件。\n\n电子表格代码现在几乎完整了。最后缺失的部分是修改单元格的重新显示。到目前为止，所有的值传递仅涉及内部的\
  \ `Cell` 值；可见的表格不受影响。改变这一点的一种方法是在 `value_` 设置器中添加一个重绘命令。然而，这会破坏你目前所看到的模型与视图之间的严格分离。更模块化的解决方案是通知表格所有的\
  \ `ValueChanged` 事件，并让它自己进行重绘。列表 35.9 显示了最终的电子表格组件，它实现了这种方案。\n\n列表 35.9 中的 `Spreadsheet`\
  \ 类仅只有两个新的修订版本。首先，表格组件现在通过 `listenTo` 订阅了模型中的所有单元格。其次，表格的反应中新增了一个用例：如果它收到 `ValueChanged(cell)`\
  \ 事件，它将通过调用 `updateCell(cell.row, cell.column)` 请求对相应的单元格进行重绘。\n\n### 35.8 结论\n\n\
  在本章中开发的电子表格功能完备，尽管在某些点上它采用了简单的实现方案，而不是对用户最方便的方案。这样，它可以用不到 200 行代码完成。尽管如此，电子表格的架构使得修改和扩展变得容易。如果你想进一步实验代码，这里有一些你可以更改或添加的建议：\n\
  \n1. 你可以使电子表格可缩放，这样就可以交互地更改行和列数。\n2. 你可以添加新类型的公式，例如。\n3. 你可以考虑递归依赖。例如，如果 `cell1`\
  \ 存储了 `add(1, 2)` 而 `cell2` 存储了 `mul(cell1, 2)`。\n4. 你可以用消息增强电子表格。\n5. 你可以使电子表格可缩放，这样就可以交互地更改行和列数。\n\
  \n电子表格代码现在几乎完整了。最后缺失的部分是修改单元格的重新显示。到目前为止，所有的值传递仅涉及内部的 `Cell` 值；可见的表格不受影响。改变这一点的一种方法是在\
  \ `value_` 设置器中添加一个重绘命令。然而，这会破坏你目前所看到的模型与视图之间的严格分离。更模块化的解决方案是通知表格所有的 `ValueChanged`\
  \ 事件，并让它自己进行重绘。列表 35.9 显示了最终的电子表格组件，它实现了这种方案。\n\n列表 35.9 中的 `Spreadsheet` 类仅只有两个新的修订版本。首先，表格组件现在通过\
  \ `listenTo` 订阅了模型中的所有单元格。其次，表格的反应中新增了一个用例：如果它收到 `ValueChanged(cell)` 事件，它将通过调用\
  \ `updateCell(cell.row, cell.column)` 请求对相应的单元格进行重绘。\n\n## 附录 A\n\n# Unix 和 Windows\
  \  Scala Scripts\n\n如果你使用的是某种 Unix 系统，可以通过在开头添加一个“井号”（pound bang）来将 Scala 脚本作为 shell\
  \ 脚本运行。例如，在名为 helloarg 的文件中输入以下内容：\n\n```bash\n#!/bin/sh\nexec scala \"$0\" \"$@\"\
  \n!#\n  // 向第一个参数问好\n  println(\"Hello, \" + args(0) + \"!\")\n```\n\n初始的 `#!/bin/sh`\
  \ 必须是文件的第一行。一旦你设置了执行权限：\n\n```bash\nchmod +x helloarg\n```\n\n你可以简单通过以下命令将 Scala\
  \ 脚本作为 shell 脚本运行：\n\n```bash\n./helloarg\n```\n\n如果你在 Windows，可以将文件命名为 helloarg.bat\
  \ 并将此内容放在脚本顶部来实现相同的效果：\n\n```batch\n::#!\n  @echo off\n  call scala %0 %*\n  goto\
  \ :eof\n::!#\n```\n\n# 术语表\n\n**代数数据类型 (algebraic data type)** 一通过提供多个替代方案定义的类型，每种方案都有其自己的构造函数。它通常带有一种通过模式匹配来解构类型的方法。该概念出现在规范语言和函数式编程语言中。Scala\
  \ 中可以使用 case classes 来模拟代数数据类型。\n\n**分支 (alternative)** match 表达式中的一个分支。它的形式为 \"\
  case *pattern* => *expression*\"。\"alternative 的另一个名称是 *case*。\n\n**注解 (annotation)**\
  \ *annotation* 出现在源代码中，并附加到语法的某些部分。注解是计算机可处理的，因此你可以使用它们来有效地为 Scala 添加扩展。\n\n**匿名类\
  \ (anonymous class)** 匿名类是 Scala 编译器从新表达式生成的合成子类，在这些表达式中，类或 trait 的名称后面紧跟大括号。大括号包含匿名子类的主体，主体可以是空的。然而，如果\
  \ `new` 之后的名称指向一个包含抽象成员的 trait 或类，则这些成员必须在定义匿名子类主体的大括号内被具体化。\n\n**匿名函数 (anonymous\
  \ function)** 函数字面量（function literal）的另一个名称。\n\n\n\n\n\n### apply\n你可以将一个方法、函数或闭包\
  \ `apply`（应用）到参数上，这意味着你在这些参数上调用了它。\n\n### argument\n当函数被调用时，该函数的每个参数都会传递一个 `argument`（参数）。参数是引用该参数的变量。参数是在调用时传递的对象。此外，应用程序可以接收（命令行）参数，这些参数会出现在传递给单例对象主方法的\
  \ `Array[String]` 中。\n\n### assign\n你可以将一个对象 `assign`（赋值）给一个变量。之后，该变量将引用该对象。\n\n\
  ### auxiliary constructor\n定义在类定义大括号内部的额外构造函数，它们看起来像命名为 `this` 的方法定义，但没有结果类型。\n\n\
  ### block\n由大括号包围的一个或多个表达式和声明。当块求值时，其所有的表达式和声明都会按顺序处理，然后该块将最后一个表达式的值作为自身的值返回。块通常用作函数体、表达式、`while`\
  \ 循环以及任何你想将若干语句组合在一起的地方。更正式地说，块是一种封装构造结构，你只能看到它的副作用和结果值。因此，定义类或对象的大括号并不构成块，因为字段和方法（定义在这些括号内部）是从外部可见的。这种大括号构成一个\
  \ `template`（模板）。\n\n### bound variable\n表达式的 `bound variable`（绑定变量）是在表达式内部既被使用又定义的变量。例如，在函数字面量表达式\
  \ `(x: Int) => (x, y)` 中，变量 `x` 和 `y` 都使用了，但只有 `x` 是绑定的，因为它在表达式内部被定义为 `Int` 并是该表达式所描述函数的唯一参数。\n\
  \n### by-name parameter\n在参数类型前标记有 `=>` 的参数，例如 `(x: => Int)`。对应于 by-name（按名）参数的参数不是在方法调用之前求值，而是在方法内部每次\
  \ `by name`（按名）引用参数时求值。如果参数不是按名的，则它是 `by-value`（按值的的）。\n\n### by-value parameter\n\
  在参数类型前**没有**标记有 `=>` 的参数，例如 `(x: Int)`。对应于 by-value（按值）参数的参数在方法调用之前求值。按值参数与 `by-name`\
  \ 参数形成对比。\n\n### class\n通过 `class` 关键字定义，`class` 可以是抽象的也可以是具体的，并且在实例化时可以使用类型和值进行参数化。在\
  \ `\"new ArrayString\"` 中，实例化的类是 `Array`，结果值的类型是 `Array[String]`。接受类型参数的类被称为 `type\
  \ constructor`（类型构造器）。可以说一个类型也拥有类，例如：类型 `Array[String]` 的类是 `Array`。\n\n### closure\n\
  捕获自由变量的函数对象，并被认为在其创建时可见的变量上是闭合的”。\n\n### companion class\n与同一源文件中定义的单例对象同名的类。该类是该单例对象的\
  \ `companion class`（伴随类）。\n\n### companion object\n与同一源文件中定义的类同名的单例对象。伴随对象和类可以访问对方的私有成员。此外，伴随对象中定义的任何隐式转换在类使用的任何地方都是有效的。\n\
  \n### contravariant\n可以通过在类型参数前加一个负号（`-`），在类或 trait 的类型参数上应用 `contravariant`（逆变）注解。然后该类或\
  \ trait 以与标记参数相反的方向（即相反方向）进行逆变子类型化。例如 `Function1` 在其第一个类型参数上是逆变的，因此 `Function1[Any,\
  \ Any]` 是 `Function1[String, Any]` 的子类型。\n\n### covariant\n可以通过在类型参数前加一个加号（`+`），在类或\
  \ trait 的类型参数上应用 `covariant`（协变）注解。然后该类或 trait 以与标记参数相同的方向（即相同方向）进行协变子类型化。例如，`List`\
  \ 在其类型参数上是协变的，所以 `List[String]` 是 `List[Any]` 的子类型。\n\n### currying\n编写带有多个参数列表的方法的方法。例如\
  \ `def f(x: Int)(y: Int)` 是具有两个参数列表的柯里化函数。柯里化函数通过传递多个参数列表来应用，如：`f(3)(4)`。然而，也可以编写柯里化函数的\
  \ `partial application`（部分应用），例如 `f(3)`。\n\n### declare\n你可以 `declare`（声明）一个抽象字段、方法或类型，这为实体提供了一个名称但不提供实现。声明与定义之间的主要区别是，定义为命名实体建立了实现，而声明没有。\n\
  \n### define\n在 Scala 程序中 `define`（定义）事物是给它一个名称和实现。你可以定义类、trait、单例对象、字段、方法、局部函数、局部变量`等`。由于定义总是涉及某种实现，抽象成员是被\
  \ `declared`（声明）的而非定义的。\n\n### direct subclass\n一个类是其直接父类的 `direct subclass`（直接子类）。\n\
  \n### direct superclass\n类或 trait 直接派生出的类，是其继承层次结构中上方最近的类。如果在类 `Child` 的可选 `extends`\
  \ 子句中提到了类 `Parent`，那么 `Parent` 就是 `Child` 的直接父类。如果在 `Child` 的 `extends` 子句中提到了某个\
  \ trait，则该 trait 的直接父类就是 `Child` 的直接父类。如果 `Child` 没有 `extends` 子句，那么 `AnyRef` 是\
  \ `Child` 的直接父类。如果一个类的直接父类带有类型参数，例如 `class Child extends Parent[String]`，`Child`\
  \ 的直接父类仍然是 `Parent`，而不是 `Parent[String]`。另一方面，`Parent[String]` 是 `Child` 的直接 `supertype`（超类型）。关于类和类型区别的更多讨论，请参见\
  \ `supertype`。\n\n### equality\n在没有限定的情况下，`equality` 是通过 `==` 表达的值之间的关系。另见 `reference\
  \ equality`（引用相等）。\n\n### expression\n任何产生结果的 Scala 代码。你也可以说表达式 `evaluates to`（求值为）一个结果或\
  \ `results in`（产生）一个值。\n\n### filter\n`for` 表达式中 `if` 后面的布尔表达式。在 `for(i <- 1 to\
  \ 10; if i % 2 == 0)` 中，filter 是 `\"if i % 2 == 0\"`。`if` 右侧的值是`filter expression`过滤表达式）。\n\
  \n### filter expression\n`filter expression` 是 `for` 表达式中 `if` 之后的布尔表达式。在 `for(i\
  \ <- 1 to 10; if i % 2 == 0)` 中，过滤表达式是 `\"i % 2 == 0\"`。\n\n### first-class function\n\
  Scala 支持 `first-class functions`（类等函数），这意味着可以使用 `function literal`（函数字面量）语法表示函数，即\
  \ `(x: Int) => x + 1`，并且函数可以用对象表示，这些对象被称为 `function values`（函数值）。\n\n### for comprehension\n\
  `for expression` 的另一个名称。\n\n### free variable\n表达式的 `free variable`（自由变量）是在表达式内部使用但在表达式内部未定义的变量。例如，在函数字面量表达式\
  \ `(x: Int) => (x, y)` 中，变量 `x` 和 `y` 都使用了，但只有 `y` 是自由变量，因为它没有在表达式内部定义。\n\n### function\n\
  `function` 可以带参数列表 `invoked`（调用）以产生结果。函数具有参数列表、体和结果类型。作为类、trait 或单例对象的函数被称为 `methods`（方法）。定义在其他函数内部的函数被称为\
  \ `local functions`（局部函数）。结果类型为 `Unit` 的函数被称为 `procedures`（过程）。源代码中的匿名函数被称为 `function\
  \ literals`（函数字面量）。运行时，函数字面量被实例化为名为 `function values`（函数值）的对象。\n\n### function literal\n\
  Scala 源代码中没有的函数，通过函数字面量语法指定。例如，`(x: Int, y: Int) => x + y`。\n\n\n\n\n\n### value\
  \ (值)\n可以像任何其他函数一样被调用的函数对象。函数值的类扩展了 `scala` 包中的其中一个 `FunctionN` 特质（例如 `Function0`、`Function1`），通常在源代码中通过`函数字面量`语法表示。当函数值的\
  \ `apply` 方法被调用时，该函数值会被“调用”。捕获了自由变量的函数值是 `closure`（闭包）。\n\n### functional style\
  \ (函数式风格)\n编程`functional style`强调函数和求值结果，并弱化了操作发生的顺序。这种风格的特点是将函数值传递给循环方法、使用不可变数据以及无副作用的方法。它是\
  \ `Haskell` 和 `Erlang` 等语言的主流范式，与 `imperative style`（命令式风格）相对。\n\n### generator\
  \ (生成器)\n`generator` 定义了一个命名的 `val` 并在 `for` 表达式中为其分配了一系列值。例如，在 `for(i <- 1 to 10)`\
  \ 中，生成器是 `\"i <- 1 to 10\"`。`<-` 右侧的值是 `generator expression`（生成器表达式）。\n\n### generator\
  \ expression (生成器表达式)\n`generator expression` 在 `for` 表达式中生成一系列值。例如，在 `for(i <-\
  \ 1 to 10)` 中，生成器表达式是 `\"1 to 10\"`。\n\n### generic class (泛型类)\n接受类型参数的类。例如，由于\
  \ `scala.List` 接收一个类型参数，因此 `scala.List` 是一个泛型类。\n\n### generic trait (泛型特质)\n接受类型参数的特质。例如，由于\
  \ `trait scala.collection.Set` 接收一个类型参数，因此它是一个泛型特质。\n\n### helper function (辅助函数)\n\
  其目的是为附近的一个或多个其他函数提供服务。辅助函数通常实现为局部函数。\n\n### immutable (不可变)\n对象一旦创建，其值就无法改变，这被称为\
  \ `immutable`。\n\n### imperative style (命令式风格)\n`imperative style` 通过改变状态和执行语句来编程。这种风格的特点是使用变量、循环语句和有副作用的方法。它是\
  \ `C`、`Java` 和 `Python` 等语言的主流范式。\n\n### initialize (初始化)\n`initialize` 是在对象创建时对其设置初始值的过程。\n\
  \n### instance (实例)\n`instance` 是类的具体实现。\n\n### invariant (不变性)\n如果一个类型参数在子类中保持相同的类型，那么它就是\
  \ `invariant` 的。例如，由于 `Array` 的类型参数是不变的，`Array[String]` 既不是 `Array[Any]` 的子类也不是超类。\n\
  \n\n\n\n\n### pattern guard\n在匹配表达式的变体中，`pattern guard`（模式守）可以跟在一个`pattern`之后。例如，在\
  \ `case x if x % 2 == 0 => x + 1` 中，模式守是 `if x % 2 == 0`。当模式匹配且模式守返回真时，该分支才会被选中。\n\
  \n### predicate\n`predicate`（谓词）是一个返回布尔值类型的函数。\n\n### primary constructor\n类的主构造函数。它在必要时调用父类构造函数，将字段初始化为传递的值，并执行类大括号之间定义的任何顶层代码。仅对未传递给父类构造函数的值参数进行初始化，但类体未使用且可以被优化掉的字段除外。\n\
  \n### procedure\n`procedure`（过程）是一个结果类型为 `Unit` 的函数，因此它的执行仅是为了产生副作用。\n\n### reassignable\n\
  变量可以是 `reassignable`（可重新赋值的）。`var`是可以重新赋值的，而 `val` 则。\n\n### recursive\n如果一个函数调用自身，则它是\
  \ `recursive`（递归的）。如果函数唯一调用自身的地方是函数的最后一个表达式，那么该函数就是 `tail recursive`（尾递归的）。\n\n\
  ### reference\n`reference`（引用）是 Java 对指针的抽象，用于唯一标识位于 JVM 堆上的对象。引用类型变量持有对象的引用，因为引用类型（`AnyRef`\
  \ 的实例）被实现为存储在 JVM 堆上的 Java 对象。相比之下，值类型变量有时可能持有引用（指向装箱后的类型），有时则不（当对象被表示为原始类型值时）。广义地说，Scala\
  \ 变量 `refers`（引用）一个对象。“引用”一词比“holds a reference”（持有引用）更抽象。如果一个类型为 `scala.Int` 的变量当前被表示为\
  \ Java 的原始 int 值，那么该变量仍然引用 `Int` 对象，但不再涉及任何引用。\n\n### reference equality \n`Reference\
  \ equality`（引用相等）意味着两个引用指向完全同一个 Java 对象。仅对于引用类型，可以通过调用 `AnyRef` 中的 `eq` 来确定引用相等性。（在\
  \ Java 程序中，可以使用 Java 引用类型上的 `==` 来确定引用相等性。）\n\n### reference type\n`reference type`（引用类型）是\
  \ `AnyRef` 的子类。引用类型的实例在运行时始终位于 JVM 堆上。\n\n### referential transparency\n函数的一种属性，它独立于时间上下文且没有副作用。对于特定的输入，引用透明函数的调用可以被替换为它的结果，而不改变程序的语义。\n\
  \n### refers\n在正在运行的 Scala 程序中，一个变量总是 `refers`（引用）某个对象。即使该变量被赋值为 `null`，它在概念上也引用\
  \ `Null` 对象。在运行时，对象可能由 Java 对象或原始类型的值实现，但 Scala 允许程序员以更高层次的抽象来思考他们想象中代码运行时的状态。另请参见\
  \ `reference`。\n\n### refinement type\n通过在大括号内为基类型提供若干成员而形成的类型。大括号中的成员精炼了基类型中存在的类型。例如，“吃草的动物”的类型是\
  \ `Animal { type SuitableFood = Grass }`。\n\n### result\nScala 程序中的表达式会产生一个 `result`（结果）。Scala\
  \ 中每个表达式的结果都是对象。\n\n### result type\n方法的 `result type`（结果类型）是调用该方法产生的值的类型。（在 Java\
  \ 中，这个概念被称为返回类型。）\n\n### return\nScala 程序中的函数 `returns`（返回）一个值。你可以称这个值为函数的 `result`（结果）。你也可以说函数\
  \ `results in`（产生）该值。Scala 中每个函数的结果都是对象。\n\n### runtime\n托管运行中的 Scala 程序的 Java 虚拟机，或\
  \ `JVM`。`Runtime`（运行时）包含了由 Java 虚拟机规范定义的虚拟机本身，以及 Java API 和标准 Scala API 的运行时库。短语\
  \ `at run time`（`run` 和 `time` 之间有空格）意味着当程序运行时，与编译时形成对比。\n\n### runtime type\n对象在运行时的类型。作为对比，`static\
  \ type`（静态类型）是表达式在编译时的类型。大多数运行时类型仅仅是不带类型参数的裸类。例如，“Hi”的运行时类型是 `String`，而 `(x: Int)\
  \ => x + 1` 的运行时类型是 `Function1`。可以使用 `isInstanceOf` 测试运行时类型。\n\n### script\n包含顶层定义和语句的文件，可以直接用\
  \ `scala` 运行而无需显式编译。脚本必须以表达式结束，而不是以定义结束。\n\n### selector\n匹配表达式中被匹配的值。例如，在 `s match\
  \ { case _ => _ }` 中，selector 是 `s`。\n\n### self type\ntrait 的 `self type`（自类型）是\
  \ `this`（接收者）的假设类型，用于 trait 内部。任何混入该 trait 的具体类必须确保其类型符合该 trait 的自类型。自类型最常见的用法是将一个大类分为几个\
  \ trait，如 第 29 章 所示。\n\n### semi-structured data\nXML 数据是半结构化的。它比扁化的二进制文件或文本文件更有结构，但没有编程语言数据结构的完整结构。\n\
  \n### serialization\n你可以将对象 `serialize`（序列化）为字节流，然后将其保存到文件中或通过网络传输。你之后可以 `deserialize`（反序列化）字节流，即使在不同的计算机上，并获得与原始序列化对象相同的对象。\n\
  \n### shadow\n局部变量的新声明会 `shadow`（遮蔽）封装作用域内同名的变量。\n\n### signature\n`Signature` 是\
  \ `type signature`（类型签名）的缩写。\n\n### singleton object\n用 `object` 关键字定义的对象。每个单例对象只有一个且只有一个实例。如果一个单例对象与类同名，并且定义在该类的同一个源文件中，它是该类的\
  \ `companion object`（伴侣对象）。该类是它的 `companion class`（伴侣类）。没有伴侣类的单例对象是 `standalone\
  \ object`（独立对象）。\n\n### standalone object\n没有伴侣类的单例对象。\n\n### statement\n表达式、定义或导入，*i.e.*，可以放入\
  \ Scala 源代码的模板或块中的内容。\n\n### static type\n参见 `type`。\n\n### subclass\n类是其所有超类和超\
  \ trait（supertraits）的 `subclass`（子类）。\n\ntrait 是其所有超 trait（supertraits）的 `subtrait`（子\
  \ trait）。\n\n### subtype\nScala 编译器允许在任何需要该类型的地方使用该类型的任何 `subtypes`（子类型）作为替代。对于不接受类型参数的类和\
  \ trait，子类型关系镜像了子类关系。例如，如果 `class Cat` 是 `abstract class Animal` 的子类，且两者都不带类型参数，则\
  \ `type Cat` 是 `type Animal` 的子类型。同样，如果 `trait Apple` 是 `trait Fruit` 的子 trait，且两者都不带类型参数，则\
  \ `type Apple` 是 `type Fruit` 的子类型。然而，对于接受类型参数的类和 trait，变性发生了作用。例如，因为 `abstract\
  \ class List` 被声明在其唯一的类型参数上是协变的（*i.e.*，`List` 被声明为 `List[+A]`），所以 `List[Cat]` 是\
  \ `List[Animal]` 的子类型，`List[Apple]` 是 `List[Fruit]` 的子类型。即使这些类型的类都是 List，这些子类型关系也存在。相比之下，因为\
  \ `Set` 没有声明在其类型参数上是协变的（*i.e.*，`Set` 被声明为 `Set[A]` 而没有加号），`Set[Cat]` 不是 `Set[Animal]`\
  \ 的子类型。子类型应该正确实现其父类型的约定，以便适用里氏夫替换原则，但编译器仅在类型检查层面验证这一属性。\n\n### superclass\n类的 `superclasses`（超类）包括其直接父类、其直接父类的直接父类，依此类推，一直到\
  \ `Any`。\n\n\n\n\n### supertrait (超特性)\n一个类或 trait 的 `supertraits`（如果有的话）包含了所有所有直接混合到该类或\
  \ trait 或其任何父类中的 trait，加上这些 trait 的任何 supertraits。\n\n### supertype (超类型)\n一个类型是其所有子类型的\
  \ `supertype`。\n\n### synthetic class (合成类)\n`synthetic class` 是由编译器自动生成的，而不是由程序员手写的。\n\
  \n### tail recursive (尾递归)\n如果函数唯一调用自身的地方是该函数的最后一个操作，则该函数是 `tail recursive` 的。\n\
  \n### target typing (目标类型)\n`target typing` 是类型推断的一种，它考虑了预期的类型。例如，在 `nums.filter((x)\
  \ => x > 0)` 中，Scala 编译器推断出 `x` 的类型为 `nums` 的元素类型，因为 `filter` 方法会在 `nums` 的每个元素上调用该函数。\n\
  \n### template (模板)\n`template` 是类、trait 或单例对象定义的体。它定义了类、trait 或对象的类型签名、行为和初始状态。\n\
  \n### trait (特性)\n使用 `trait` 关键字定义的 `trait` 类似于抽象类，它不能接受任何值参数，并且可以通过被称为 `mixin composition`\
  \ 的过程“混合””类或其他 trait 中。当一个 trait 被混合到类或 trait 中时，它被称为 `mixin`。trait 可以用一个或多个类型进行参数化。当用类型参数化时，该\
  \ trait 会构造出一个类型。例如，`Set` 是一个接受单个类型参数的 trait，而 `Set[Int]` 是一个类型。此外，`Set` 被称为类型 `Set[Int]`\
  \ 的“the trait of”。\n\n### type (类型)\nScala 程序中的每个变量和表达式都有一个在编译时已知的 `type`。类型限制了变量在运行时可以引用的可能值，或表达式可以产生的可能值。在需要将其与对象的\
  \ `runtime type`（运行时类型）区分时，变量或表达式的类型也可以称为 `static type`（静态类型）。换句话说，“type”本身的意思就是静态类型。类型与类是不同的，因为接受类型参数的类可以构造许多类型。例如，`List`\
  \ 是一个类，但不是一个类型。`List[T]` 是一个带有自由类型参数的类型。`List[Int]` 和 `List[String]` 也是类型（被称为 `ground\
  \ types`，因为它们没有自由类型参数）。一个类型可以拥有一个“class”或“trait”。例如，类型 `List[Int]` 的类是 `List`。类型\
  \ `Set[String]` 的 trait 是 `Set`。\n\n### type constraint (类型约束)\n某些注解是 `type constraints`，意味着它们对类型所包含的值添加了额外的限制或约束。例如，`@positive`\
  \ 可以是类型 `Int` 的一种类型约束，将 32 位整数的类型限制为正整数。类型约束不通过标准的 Scala 编译器检查，而必须由额外的工具或编译器插件进行检查。\n\
  \n### type constructor (类型构造器)\n接受类型参数的类或 trait。\n\n### type parameter (类型参数)\n\
  泛型类或泛型方法的参数，必须由类型来填充。例如，`class List` 定义为 \"class List[T] { ...”，而对象 `Predef` 的成员方法\
  \ `identity` 定义为 \"def identityT = x\"。在这两种情况下，`T` 都是类型参数。\n\n### type signature\
  \ (类型签名)\n方法的 `type signature` 包含它的名称、参数（如果有）的数量、顺序和类型，以及结果类型。类、trait 或单例对象的类型签名包含它的名称、所有成员和构造函数的类型签名，以及它声明的继承和\
  \ mixin 关系。\n\n### uniform access principle (统一访问原则)\n`uniform access principle`\
  \ 规定变量和无参数函数应该使用相同的语法访问。Scala 通过不允许在无参数函数的调用处放置括号来支持这一原则。因此，无参数函数的定义可以更改为 `val`，或者*反之亦然*而不影响客户端代码。\n\
  \n### unreachable (不可达)\n在 Scala 级别，对象可能会变得 `unreachable`（不可达），此时它们占据的内存可能会被运行时回收。`unreachable`\
  \ 并不意味着未被引用。引用类型（`AnyRef` 的实例）被实现为位于 JVM 堆上的对象。当一个引用类型的实例变得不可达时，它确实变成了未被引用的，并且可以进行垃圾回收。值类型（`AnyVal`\
  \ 的实例）既被实现为原始类型值，也被实现为 Java 包装类型（如 `java.lang.Integer`）的实例，它们位于堆上。值类型实例在引用它们的变量的生命周期内可以被装箱（从原始值转换为包装对象）和解箱（从包装对象转换为原始值）。如果一个当前在\
  \ JVM 堆上作为包装对象表示的值类型实例变得不可达，那么它确实变成了未被引用的，并且可以进行垃圾回收。但如果一个当前作为原始值表示的值类型变得不可达，那么它并没有变成未被引用的，因为在那个时刻它并没有作为对象存在于\
  \ JVM 堆上。运行时可能会回收不可达对象占据的内存，但如果一个 `Int` 在运行时是由原始 Java `int` 实现的，它占据了正在执行的方法的栈帧中的某些内存，那么当方法完成且栈帧弹出（pop）时，该对象的内存就会被“回收”。引用类型（如\
  \ `Strings`）的内存在它们变得不可达后可能会被 JVM 垃圾回收器回收。\n\n### unreferenced (未引用)\n见 `unreachable`。\n\
  \n### value (值)\nScala 中任何计算或表达式的结果都是一个 `value`，在 Scala 中，每个值都是一个对象（位于 JVM 堆上）。\n\
  \n### value type (值类型)\n`value type` 是 `AnyVal` 的任何子类，如 `Int`、`Double` 或 `Unit`。这个术语在\
  \ Scala 源码级别具有意义。在运行时，值类型的实例可能以原始值或包装类型实例的形式实现。\n\n### variable (变量)\n引用对象的命名实体。变量要么是\
  \ `val`，要么是 `var`。所有的 `vals` 和 `vars` 在定义时必须初始化，但只有 `vars` 可以重新赋值给不同的对象。\n\n###\
  \ variance (变变性)\n类或 trait 的类型参数可以用 `variance` 注解标记，可以是 `covariant`（协变 +）或 `contravariant`（逆变\
  \ -）。此类变异注解指示了泛型类或 trait 的子类型如何工作。例如，泛型类 `List` 在类型参数上是协变的，因此 `List[String]` 是 `List[Any]`\
  \ 的子类型。默认情况下，*i.e.*，缺失 `+` 或 `-` 注解的类型参数是 `nonvariant`（不变的）。\n\n### wildcard type\
  \ (通配符类型)\n`wildcard type` 包含对未知类型的引用。例如，`Array[_]` 是一个通配符类型。它是一个元素类型完全未知的数组。\n\n\
  ### yield (产生)\n表达式可以 `yield` 一个结果。`yield` 关键字指定 `for` 表达式的结果。\n\n# Bibliography\n\
