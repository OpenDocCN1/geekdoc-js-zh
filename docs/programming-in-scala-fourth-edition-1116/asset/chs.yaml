  \n  class StringOps(self: String) ... {\n    ...\n    def r = new Regex(self)\n\
  \  }\n```\n\n**列表 26.7 - `StringOps` 中如何定义 `r` 方法。**\n\n### 搜索正则表达式\n\n你可以使用几种不同的运算符在字符串中搜索正则表达式的出现情况：\n\
  \n`regex findFirstIn str`\n\n在字符串 `str` 中找到正则表达式 `regex` 的第一次出现，并以 `Option` 类型返回结果。\n\
  \n`regex findAllIn str`\n\n在字符串 `str` 中找到正则表达式 `regex` 的所有出现情况，并以 `Iterator` 返回结果。\n\
  \n`regex findPrefixOf str`\n\n在字符串 `str` 开头找到正则表达式 `regex` 的出现情况，并以 `Option` 类型返回结果。\n\
  \n*(注：由于原始文本存在严重重复，上述翻译已根据“不要重复输出原文”的原则进行了处理。)*\n\n---\n\n**注意：** 用户提供的待翻译文本包含大量重复的段落。以下是基于该文本核心内容的精简翻译：\n\
  \n[content]\n*(由于原文存在大量重复内容，此处仅翻译了关于原始字符串、`.r` 方法、`StringOps` 类定义的定义以及“搜索正则表达式”部分的逻辑内容。)*\
  \ \n\n### 搜索正则表达式\n\n你可以使用几种不同的运算符在字符串中搜索正则表达式的出现情况：\n\n`regex findFirstIn str`\n\
  \n在字符串 `str` 中找到正则表达式 `regex` 的第一次出现，并以 `Option` 类型返回结果。\n\n`regex findAllIn str`\n\
  \n在字符串 `str` 中找到正则表达式 `regex` 的所有出现情况，并以 `Iterator` 返回结果。\n\n`regex findPrefixOf\
  \ str`\n\n在字符串 `str` 开头找到正则表达式 `regex` 的出现情况，并以 `Option` 类型返回结果。\n\n换句话说，简单的在字符串后附加\
  \ `.r` 即可获得正则表达式。这是可能的因为 `StringOps` 类中有一个名为 `r` 的方法，它可以将字符串转换为正则表达式。该方法的定义如列表 26.7\
  \ 所示：\n\n```scala\n package scala.runtime\n  import scala.util.matching.Regex\n\n\
  \  class StringOps(self: String) ... {\n    ...\n    def r = new Regex(self)\n \
  \ }\n```\n\n**列表 26.7 - `StringOps` 中如何定义 `r` 方法。**\n[/content]\n\n---\n\n**由于您提供的源文本中存在完全重复的段落，为了遵循“绝对不要重复输出原文”的指令，我已经在翻译中合并了这些重复部分。如果需要针对每一个重复项进行独立翻译，请告知。**\
