  scala> val hex = 0x5\n  hex: Int = 5\n\n  scala> val hex2 = 0x00FF\n  hex2: Int\
  \ = 255\n\n  scala> val magic = 0xcafebabe\n  magic: Int = -889275714\n```\n\n注意，Scala\
  \ shell 始终以 10 进制打印整数值，无论你使用了什么字面量形式来初始化它。因此，解释器会将你用字面量 `0x00FF` 初始变量 `hex2` 显示为十进制的\
  \ `255`。（当然，你不需要完全听我们的。开始熟悉这种语言的好方法是在你阅读本章时，在解释器中尝试这些语句。）如果数字以非零数字开头且没有其他修饰，它就是十进制（基\
  \ 10）。例如：\n\n```scala\nscala> val dec1 = 31\n  dec1: Int = 31\n\n  scala> val dec2\
  \ = 255\n  dec2: Int = 255\n\n  scala> val dec3 = 20\n  dec3: Int = 20\n```\n\n\
  如果整数字面量以 `L` 或 `l` 结尾，它是一个 `Long`；否则它是 `Int`。`Long` 整数字面量的示例有：\n\n```scala\nscala>\
  \ val prog = 0XCAFEBABEL\n  prog: Long = 3405691582\n\n  scala> val tower = 35L\n\
  \  tower: Long = 35\n\n  scala> val of = 31l\n  of: Long = 31\n```\n\n如果一个 `Int`\
  \ 字面量被赋值给类型为 `Short` 或 `Byte` 的变量，只要字面量的值在相应类型的有效范围内，该字面量就会被视为 `Short` 或 `Byte`\
  \ 类型。例如：\n\n```scala\nscala> val little: Short = 367\n  little: Short = 367\n\n\
  \  scala> val littler: Byte = 38\n  littler: Byte = 38\n```\n\n#### 浮点数字面量\n\n浮点字面量由数字组成，可选包含小数点，并可选后跟一个\
  \ `E` 或 `e` 以及指数。浮点字面量的示例有：\n\n```scala\nscala> val big = 1.2345\n  big: Double\
  \ = 1.2345\n\n  scala> val bigger = 1.2345e1\n  bigger: Double = 12.345\n\n  scala>\
  \ val biggerStill = 123E45\n  biggerStill: Double = 1.23E47\n```\n\n注意，指数部分意味着其他部分乘以\
  \ 10 的幂幂幂。因此，`1.2345e1` 是 `1.2345 * 10¹`，即 `12.345`。如果浮点字面量以 `F` 或 `f` 结尾，它是一个 `Float`；否则它是\
  \ `Double`。可选地，`Double` 浮点字面量可以以 `D` 或 `d` 结尾。`Float` 字面量的示例有：\n\n```scala\nscala>\
  \ val little = 1.2345F\n  little: Float = 1.2345\n```\n\n#### 字符字面量\n\n(注：原文从此处开始重复，以下为通用逻辑翻译)\n\
  字符字面量由单引号包裹，单引号内部可以包含任何字符或转义序列。\n\n#### 字符串字面量\n\n字符串字面量由双引号包裹。对于跨多行的字符串，可以使用三引号并配合\
  \ `stripMargin` 方法来处理缩进。\n\n#### 符号字面量\n\n符号字面量写为 `'ident`。符号是内插（interned）的。\n\n\
  #### 布尔值字面量\n\n`Boolean` 类型有两个字面量，`true` 和 `false`。\n\n\n\n\n表达式 `s\"Hello, $name!\"\
  ` 是一个处理过的字符串字面量。由于字母 `s` 紧邻左引号，Scala 将使用 `s` 字符串插值器来处理该字面量。`s` 插值器会评估每个嵌入的表达式，对每个结果调用\
  \ `toString`，并将字面量中的嵌入表达式替换为这些结果。因此，`s\"Hello, $name!\"` 生成 `\"Hello, reader!\"\
  `，这与 `\"Hello, \" + name + \"!\"` 的结果相同。\n\n你可以在处理过的字符串字面量的美元符号（`$`）之后放置任何表达式。对于单变量表达式，你通常只需要在美元符号后放置变量名即可。Scala\
  \ 会将到第一个非标识符字符之前的所有字符解释为该表达式。如果表达式包含非标识符字符，你必须将其放在大括号中，且左大括号要紧跟美元符号。这里有一个示例：\n\n\
  ```\nscala> s\"The answer is ${6 * 7}.\"\nres0: String = The answer is 42.\n```\n\
  \nScala 默认还提供两个字符串插值器：`raw` 和 `f`。`raw` 字符串插值器的行为类似于 `s`，但它不识别字符转义序列（如表 5.2 所示）。例如，以下代码会打印四个反斜杠：\n\
  \n```\nprintln(raw\"\\escape!\")\n```\n\n`f` 字符串插值器允许你为嵌入表达式附加 `printf`风格的格式化指令。你将指令放在表达式之后，以百分号（`%`）开头，使用\
  \ `java.util.Formatter`指定的语法。例如，你可以这样格式化 `pi`：\n\n```\nscala> f\"${math.Pi}%.5f\"\
  \nres1: String = 3.14159\n```\n\n如果你没有为嵌入表达式提供格式指令，`f` 插值器将默认使用 `%s`，这意味着将替换 `toString`，类似于\
  \ `s` 插值器。例如：\n\n```scala\nscala> val pi = math.Pi = \"Pi\"\nscala> f\"$pi is approximately%.8f.\"\
  \nres2: String = Pi is approximately 3.14159265\n```\n\n在 Scala 中，字符串插值是通过编译时重写代码来实现的。编译器会将任何由标识符后紧跟字符串字面量的双引号组成的表达式视为插值器。`s`、`f`\
  \ 和 `raw` 插值器都是通过这种通用机制实现的。库和用户可以根据其他目的定义其他的插值器。\n\n## 5.4 运算符是方法\n\nScala 为其基本类型提供了丰富的运算符集合。如前面的章节所述，这些运算符实际上是方法调用的一种简洁语法。例如，`1\
  \ + 2` 的含义与 `1+(2)` 相同。换句话说，类 `Int` 了一个名为 `+` 的方法，它接收一个 `Int` 并返回一个 `Int` 结果。当你相两个\
  \ `Int` 时，就会调用这个 `+` 方法：\n\n```\nscala> val sum = 1 + 2 // Scala 调用 1+(2)\nsum:\
  \ Int = 3\n```\n\n为了向自己证明这一点，你可以显式地将表达式写为方法调用：\n\n```\nscala> val sumMore = 1+(2)\n\
  sumMore: Int = 3\n```\n\n事实上，`Int` 包含了几个几个重载的 `+` 方法，接收不同的参数类型。例如，`Int` 有另一个也名为\
  \ `+` 的方法，它接收并返回一个 `Long`。如果你将一个 `Long` 加到 `Int` 上，将调用这个备用的 `+` 方法，如下：\n\n```\n\
  scala> val longSum = 1 + 2L // Scala 调用 1+(2L)\nlongSum: Long = 3\n```\n\n`+` 符号是一个运算符——具体来说是一个中缀运算符。运算符符号不仅限于其他语言中看起来像运算符的方法（如\
  \ `+`）。你可以在运算符表示法中使用任何方法。例如，类 `String` 有一个方法 `indexOf`，它接收一个 `Char` 参数。`indexOf`\
  \ 方法在字符串中搜索指定字符的首次出现，并返回其索引；如果没有找到该字符则返回 `-1`。你可以像这样将 `indexOf` 用作运算符：\n\n```\n\
  scala> val s = \"Hello, world!\"\ns: String = Hello, world!\n\nscala> s indexOf\
  \ 'o' // Scala 调用 s.indexOf('o')\nres0: Int = 4\n```\n\n此外，`String` 提供了一个接收两个参数的重载\
  \ `indexOf` 方法：要搜索的字符和起始索引。（之前显示的另一个 `indexOf` 方法从索引零，即 `String` 的开头，开始的）。尽管这个 `indexOf`\
  \ 方法接收两个参数，但你仍然可以在运算符表示法中使用它。但每当你使用运算符表示法调用接收多个参数的方法时，你必须将这些参数放在括号中。例如，这里是你如何将这种其他\
  \ `indexOf` 形式作为运算符使用的（接上一个示例）：\n\n```\nscala> s indexOf ('o', 5) // Scala 调用 s.indexOf('o',\
  \ 5)\nres1: Int = 8\n```\n\n## 任何方法都可以是运算符\n\n在 Scala 中，运算符并不是特殊的语言语法；任何方法都可以是运算符。使一个方法成为运算符的是你如何*使用*它。当你写下\
  \ `s.indexOf('o')` 时，`indexOf` 不是运算符。但当你写下 `s indexOf 'o'` 时，`indexOf` *是*一个运算符，因为你正在以运算符表示法使用它。\n\
  \n到目前为止，你已经看到了*中缀*运算符表示法的示例，这意味着要调用的方法位于操作数之间。与中缀运算符法不同（运算符接收两个操作数，一个在左一个在右）——前缀和后置运算符只需要一个操作数。在前缀表示法中，你将方法名放在操作数之前。在后置表示法中，你将方法名放在操作数之后。\n\
  \n事实上，前缀和后置运算符是*一元的*：它们只需要一个操作数。在前缀表示法中，操作数在运算符的右侧。前缀运算符的示例有 `-`、`!` 和 `~`。正如中缀运算符一样，这些前缀运算符是调用方法的快捷方式。在这种情况下，方法名被加上了\
  \ `unary_`。\n\n```\nscala> -2.0\nres2: Double = -2.0\n\nscala> (2.0).unary_-\nres3:\
  \ Double = -2.0\n```\n\n只有可以作为前缀运算符的标识符只有 `+`、`-` 和 `~`。因此，如果你定义了一个名为 `unary_!`\
  \ 的方法，你可以使用前缀表示法对相应类型的值或变量调用该方法，例如 `!p`。但如果你定义了一个名为 `unary_*` 的方法，你将无法使用前缀表示法，因为\
  \ `*` 不是可以作为前缀运算符的标识符之一。你可以正常调用该方法，例如 `p.unary_*`，但如果你尝试通过 `*p` 调用它，Scala 将其解析为仿佛你写了\
  \ `*.p`，这可能不是你想要的。\n\n后置运算符是不带参数的方法，当它们在没有点或括号的情况下调用时。在 Scala 中，你可以省略空括号。约定是，如果方法有副作用（例如\
  \ `println()`），则包含括号；但如果方法没有副作用，则可以省略，例如在 `String` 上调用的 `toLowerCase`：\n\n```\n\
  scala> val s = \"Hello, world!\"\ns: String = Hello, world!\n\nscala> s.toLowerCase\n\
  res4: String = hello, world!\n```\n\n在后一种不需要参数的方法的情况下，你也可以选择省略点并使用后置运算符表示法：\n\n\
  ```\nscala> s toLowerCase\nres5: String = hello, world!\n```\n\n在这种情况下，`toLowerCase`\
  \ 被用作操作数 `s` 的后置运算符。\n\n\n\n因此，为了查看 Scala 的基本类型可以使用哪些运算符，你只需要查看 Scala API 文档中该类型类所声明的方法即可。然而，考虑到这是一本\
  \ Scala 教程，我们将在接下来的几个节中为你快速介绍这些方法的大部分。\n\n#### Java 程序员的快速通道\n\n本章剩余部分描述的 Scala\
  \ 许多方面与 Java 相同。如果你是一个赶时间的 Java 专家，可以安全地跳转到第 5.8 节 这里，那里描述了 Scala 在对象相等性方面与 Java\
  \ 的区别。\n\n## 5.5 算术运算\n\n你可以对任何数值类型通过中置运算符表示法调用加法 (`+`)、减法 (`-`)、乘法 (`*`)、除法 (`/`)\
  \ 和取余 (`%`) 算术方法。以下是一些示例：\n\n```\nscala> 1.2 + 2.3\n  res6: Double = 3.5\n\n  scala>\
  \ 3 - 1\n  res7: Int = 2\n\n  scala> 'b' - 'a'\n  res8: Int = 1\n\n  scala> 2L *\
  \ 3L  \n  res9: Long = 6\n\n  scala> 11 / 4  \n  res10: Int = 2\n\n  scala> 11 %\
  \ 4  \n  res11: Int = 3\n\n  scala> 11.0f / 4.0f\n  res12: Float = 2.75\n\n  scala>\
  \ 11.0 % 4.0  \n  res13: Double = 3.0\n```\n\n当左右操作数都是整数类型（`Int`、`Long`、`Byte`、`Short`\
  \ 或 `Char`）时，`/` 运算符将商的整数部分，不包含任何余数。`%` 运算符表示隐含整数除法的余数。\n\n通过 `%` 得到的浮点余数不是 IEEE\
  \ 754 标准定义的余数。IEEE 754 余数在计算余数时使用的是舍入除法，而不是截断除法，因此它与整数取余运算非常不同。如果你真的想要 IEEE 754\
  \ 余数，可以调用 `scala.math` 中的 `IEEEremainder`，如下所示：\n\n```\nscala> math.IEEEremainder(11.0,\
  \ 4.0)\n  res14: Double = -1.0\n```\n\n数值类型还提供了一元前缀运算符 `+`（方法 `unary_+`）和 `-`（方法\
  \ `unary_-`），允许你指示字面量数是正还是负，例如 `-3` 或 `+4.0`。如果你不指定一元 `+` 或 `-`，字面量数将被解释为正数。一元 `+`\
  \ 仅为了与一元 `-` 保持对称，但没有作用。一元 `-` 也可以用于取变量的反。以下是一些示例：\n\n```\nscala> val neg = 1 +\
  \ -3\n  neg: Int = -2\n\n  scala> val y = +3\n  y: Int = 3\n\n  scala> -neg\n  res15:\
  \ Int = 2\n```\n\n## 5.6 关系和逻辑运算\n\n你可以使用关系方法比较数值类型，包括大于 (`>`)、小于 (`<`)、大于等于 (`>=`)\
  \ 和小于等于 (`<=`)，它们会产生布尔结果。此外，你可以使用一元 `!` 运算符（`unary_!` 方法）来反转布尔值。这里是一些示例：\n\n```\n\
  scala> 1 > 2\n  res16: Boolean = false\n\n  scala> 1 < 2\n  res17: Boolean = true\n\
  \n  scala> 1.0 <= 1.0\n  res18: Boolean = true\n\n  scala> 3.5f >= 3.6f\n  res19:\
  \ Boolean = false\n\n  scala> 'a' >= 'A'\n  res20: Boolean = true\n\n  scala> val\
  \ untrue = !true\n  untrue: Boolean = false\n```\n\n逻辑方法——逻辑与 (`&&` 和 `&`) 以及逻辑或\
  \ (`||` 和 `|`)）在中置表示法下接收布尔操作数并产生布尔结果。例如：\n\n```\nscala> val toBe = true\n  toBe:\
  \ Boolean = true\n\n  scala> val question = || true\n  question: Boolean = true\n\
  \n  scala> val paradox = && true\n  paradox: Boolean = false\n```\n\n`&&` 和 `||`\
  \ 操作像 Java 一样采用短路：由这些运算符构建的表达式只会执行到确定结果所需的程度。句话说，如果 `&&` 表达式的左侧求值为 `false`，结果将为\
  \ `false`，因此右侧不会被评估。同样，如果 `||` 表达式的左侧求值为 `true`，结果将为 `true`，因此右侧不会被评估。\n\n```\n\
  scala> def salt()={println(\"salt\"); false}\nscala> def pepper()={println(\"pepper\"\
  ); true}\nscala> pepper() && salt()\n  res21: Boolean = false\n\nscala> salt() &&\
  \ pepper()\n  res22: Boolean = false\n```\n\n在第一个表达式中，调用了 `pepper` 和 `salt`，但在第二个中只调用了\
  \ `salt`。由于 `salt` 返回 `false`，不需要调用 `pepper`。\n\n如果你想无论如何评估右侧，请改用 `&` 和 `|`。`&`\
  \ 方法执行逻辑与，`|` 执行逻辑或，但它们不会像 `&&` 和 `||` 那样短路。这里有一个示例：\n\n```\nscala> salt() & pepper()\n\
  \  res23: Boolean = false\n```\n\n#### 注意\n\n你可能会疑惑，既然运算符只是方法，短路操作是如何工作的。通常情况下，在进入方法之前，所有参数都会被评估，那么方法如何避免评估其参数呢？答案是，所有\
  \ Scala 方法都有一个延迟评估参数甚至完全拒绝评估参数的机制。这种机制被称为按名参数，并在第 9.5 节中讨论。\n\n## 5.7 位运算\n\nScala\
  \ 允许你通过几种位运算方法对整数类型的每个位进行操作。位运算方法有：位与 (`&`)、位或 (`|`) 和位异异 (`^`)。一元位取反运算符 (`~`，方法\
  \ `unary_~`）反转位。位操作数。例如：\n\n```\nscala> 1 & 2\n  res24: Int = 0\n\n  scala> 1 |\
  \ 2\n  res25: Int = 3\n\n  scala> 1 ^ 3\n  res26: Int = 2\n\n  scala> ~1\n  res27:\
  \ Int = -2\n```\n\n第一个表达式 `1 & 2` 执行位与，`1` (0001) 和 `2` (0010) 得到 `0`。第二个表达式 `1\
  \ | 2` 执行位或，`1` (0001) 和 `2` (0010) 得到 `3`。第三个表达式 `1 ^ 3` 执行位异异，`1` (0001) 和 `3`\
  \ (0011) 得到 `2`。最后一个表达式 `~1` 反转位 `1` (0001)，得到 `-2`。\n\n\n\n这些操作实际上适用于所有对象，而不仅仅是基本类型。例如，你可以使用\
  \ `==` 来比较列表：\n\n```scala\nscala> List(1, 2, 3) == List(1, 2, 3)\n  res34: Boolean\
  \ = true\n\n  scala> List(1, 2, 3) == List(4, 5, 6)\n  res35: Boolean = false\n\
  ```\n\n进一步，你可以比较两个不同类型的对象：\n\n```scala\n scala> 1 == 1.0\n  res36: Boolean = true\n\
  \n  scala> List(1, 2, 3) == \"hello\"\n  res37: Boolean = false\n```\n\n你甚至可以与 `null`\
  \ 或可能为 `null` 的值进行比较。这不会抛出异常：\n\n```scala\nscala> List(1, 2, 3) == null\n  res38:\
  \ Boolean = false\n\n  scala> null == List(1, 2, 3)\n  res39: Boolean = false\n\
  ```\n\n如你所见，`==` 经过精心设计，在大多数情况下能让你得到你想要的等性比较。这是通过一个非常简单的规则实现的：首先检查左侧是否为 `null`。如果它不是\
  \ `null`，则调用 `equals` 方法。由于 `equals` 是一个方法，你得到的精确比较取决于左侧参数的类型。由于有自动的 `null` 检查，你不需要自己进行该检查。\n\
  \n只要不同对象的内容相同，并且它们的 `equals` 方法是基于内容编写的，这种比较就会在不同对象之间产生 `true` 结果。例如，这里是两个恰好包含相同五个字母的字符串之间的比较：\n\
  \n```scala\nscala> (\"he\" + \"llo\") == \"hello\"\n  res40: Boolean = true\n```\n\
  \n### Scala 的 == 与 Java 的区别\n\n在 Java 中，你可以使用 `==` 来比较基本类型和引用类型。对于基本类型，Java 的 `==`\
  \ 比较的是值的等价性，这与 Scala 一致。然而，对于引用类型，Java 的 `==` 比较的是**引用相等性**，这意味着两个变量指向 JVM 堆上的同一个对象。Scala\
  \ 也提供了一个名为 `eq` 的机制来比较引用相等性。但是，`eq` 及其相反的 `ne` 只适用于直接映射到 Java 的对象。关于 `eq` 和 `ne`\
  \ 的完整细节见第 11.1 节和第 11.2 节。此外，参见第 30 章关于如何编写良好的 `equals` 方法。\n\n## 5.9 运算符优先级和结合性\n\
  \n运算符优先级决定了表达式的哪些部分会在其他部分之前计算。例如，表达式 `2 + 2 * 7` 的结果是 `16` 而不是 `28`，因为 `*` 运算符的优先级高于\
  \ `+` 运算符。因此，表达式中的乘法部分在加法之前计算。你可以在表达式中使用括号来明确计算顺序或覆盖优先级。例如，如果你真的想要上述表达式的结果为 `28`，你可以这样写表达式：\n\
  \n```\n(2 + 2) * 7\n```\n\n鉴于 Scala 并没有意义上的运算符，只是一种用运算符表示法使用方法的方法，你可能会疑惑运算符优先级是如何工作的。Scala\
  \ 根据运算符表示法中使用的方法的第一个字符来决定优先级（该规则有一个例外，将在后续章节中讨论）。例如，如果方法名以 `*` 开头，它的优先级将比以 `+` 开头的方法高。因此\
  \ `2 + 2 * 7` 将被求值为 `2 + (2 * 7)`。同样，`+++ b *** c`（其中 `a`, `b` 和 `c` 是变量，`+++` 和\
  \ `***` 是方法）将被求值为 `a +++ (b *** c)`，因为 `***` 方法的优先级高于 `+++` 方法。\n\n#### 表 5.3 -\
  \ 运算符优先级\n\n| （所有其他特殊字符） |\n| :--- |\n| `* / %` |\n| `+ -` |\n| `:` |\n| `= !` |\n\
  | `< >` |\n| `&` |\n| `^` |\n| `\\|` |\n| （所有字母） |\n| （所有赋值运算符） |\n\n表 5.3 显示了赋予方法第一个字符的优先级，按优先级递减排序，同一行的字符具有相同的优先级。字符在表中的位置越高，以该字符开头的方法优先级就越高。这里有一个说明优先级影响的例子：\n\
  \n```scala\nscala> 2 + 2 * 7\n  16\n```\n\n```scala\nscala> (2 + 2) * 7\n  28\n\
  ```\n\n## 5.10 Rich wrappers\n\n\n\n\n你可以在 Scala 基本类型上调用的方法比之前章节描述的要多得多。一些示例见表 5.4。这些方法可以通过*隐式转换*（implicit\
  \ conversions）来获得，这种技术将在第 21 章中。\n\n#### 表 5.4 - 一些富操作\n\n| 代码 | 结果 |\n| :--- |\
  \ :--- |\n| `0 max 5` | `5` |\n| `0 min 5` | `0` |\n| `-2.7 abs` | `2.7` |\n| `-2.7\
  \ round` | `-3L` |\n| `1.5 isInfinity` | `false` |\n| `(1.0 / 0) isInfinity` | `true`\
  \ |\n| `4 to 6` | `Range(4, 5, 6)` |\n| `\"bob\" capitalize` | `\"Bob\"` |\n| `\"\
  robert\" drop 2` | `\"bert\"` |\n\n#### 表 5.5 - 富包装器类\n\n| 基本类型 | 富包装器 |\n| :---\
  \ | :--- |\n| Byte | `scala.runtime.RichByte` |\n| Short | `scala.runtime.RichShort`\
  \ |\n| Int | `scala.runtime.RichInt` |\n| Long | `scala.runtime.RichLong` |\n| Char\
  \ | `scala.runtime.RichChar` |\n| Float | `scala.runtime.RichFloat` |\n| Double\
  \ | `scala.runtime.RichDouble` |\n| Boolean | `scala.runtime.RichBoolean` |\n| String\
  \ | `scala.collection.immutable.StringOps` |\n\n## 5.11 结论\n\n本章的主要要点是：Scala 中的运算符是方法调用，并且\
  \ Scala 基本类型存在到富变体的隐式转换，这些转换提供了更多实用的方法。在下一章中，我们将向你展示如何以函数式风格设计对象，为你在本章中看到的某些运算符提供新的实现。\n\
