  \n致 Nastaran - M.O.\n\n致 Fay - L.S.\n\n致 Siew - B.V.\n\n\n# 前言\n\n当我在 2004 年坐下时，我只有\
  \ `Java` 的先验经验，我无法如何强调 `Scala` 带给我的初印象有多么深刻。起初，`Scala` 是不同的。在之后的多年里，我一直在学习 `Scala`，直到今天仍在发现新的可能性、细微差别以及特征之间的交互。我不知道还有什么语言有如此深度，能让用户多年来痴迷于此。\n\
  \nScala 即将进入一个巨大的变革时期。下一个主版本 `Scala 3` 相对于 `Scala 2` 的升级程度，几乎相当于我十五年前从 `Java` 升级到那时的跨度。在\
  \ `Scala` 中编程的许多日常体验将保持不变，但一套跨越语言所有领域的新功能库将供我们使用。在写作此时，`Scala 3` 的广泛采用还需要几年，`Scala\
  \ 2` 在可见的未来将继续是事实上的标准版本。\n\n`Scala 2` 的最新版本 `2.13` 在本书中有详细介绍，它在标准库中引入了新的集合库，为了简单进行了重新设计，纳入了自\
  \ `Scala 2.8` 上一次重大重新设计以来的许多教训。这些新集合可以在 `Scala 2` 和 `3` 上交叉编译，因此将成为我们在未来十年中编写的大部分代码的基础。随着对\
  \ Scala 下一个版本的极大兴奋，现在是拿起《Scala 编程》并开始学习的好时机！\n\nJon Pretty\n波兰克拉科夫\n2019 年 9 月 12\
