  ### 视图 (View)：\n| :--- | :--- |\n| `xs.view` | 生成一个关于 `xs` 的视图。 |\n\n#### 可迭代对象的子类\n\
  \n在下方的继承层次结构中，`Iterable` 包含三个 trait：`Seq`、`Set` 和 `Map`。`Seq` 和 `Map` 的共同点是它们都实现了\
  \ `PartialFunction`[1，带有 `apply` 和 `isDefinedAt` 方法。然而，每个 trait 实现 `PartialFunction`\
  \ 的方式有所不同。\n\n对于序列，`apply` 是索引；因此类型为 `Seq[T]` 的序列是一个接受 `Int` 参数（索引）并产生类型 `T` 元素的部分函数。也就是说\
  \ `Seq[T]` 扩展了 `PartialFunction[Int, T]`。序列元素的索引从零开始。例如 `Seq(1, 2, 3)(1) == 2`。对于集合，`apply`\
  \ 是成员性测试。例如 `Set('a', 'b', 'c')('b') == true`，而 `Set('a') == false`。最后对于映射，`apply`\
  \ 是选择。例如 `Map('a' -> 1, 'b' -> 10, 'c' -> 100)('b') == 10`。\n\n在接下来的三个章节中，我们将详细解释这三种集合。\n\
  \n### 24.4 序列 trait Seq、IndexedSeq 和 LinearSeq\n\n`Seq` trait 表示序列。序列是一种具有长度且元素具有固定位置的可迭代对象。\n\
  \n序列上的操作如图 24.2](#collections-in-depth.html_tab-seqops）所示，分为以下几类：\n\n*   **索引和长度操作**\
  \ `apply`、`isDefinedAt`、`length`、`indices`、`lengthCompare` 和 `lengthIs`。\n\n*  \
  \ **索引搜索操作** `indexOf`、`lastIndexOf`、`indexOfSlice`、`lastIndexOfOfSlice`、`indexWhere`、`lastIndexWhere`、`segmentLength`\
  \ 和 `prefixLength`，返回等于给定值或匹配某些谓词的元素的索引。\n\n\n\n\n\n- `加法操作` `+`: (别名，前置), `++`:\
  \ (别名，全前置), `:+` (别名，后置), `:++` (别名，全后置) 以及 `padTo`，它们返回通过在序列前端或末尾添加元素而获得的新序列。\n\
  - `更新操作` `updated` 和 `patch`，它们返回通过替换原始序列中的某些元素获得的新序列。\n- `排序操作` `sorted`、`sortWith`\
  \ 和 `sortBy`，它们根据各种标准对序列元素进行排序。\n- `反转操作` `reverse` 和 `reverseIterator`，它们以反序（从最后一个到第一个）排列或产生元素。\n\
  - `比较操作` `startsWith`、`endsWith`、`contains`、`corresponds`、`containsSlice` 和 `search`，关联两个序列或在序列中搜索元素。\n\
  - `多集操作` `intersect`、`diff`、`distinct` 和 `distinctBy`，它们对两个序列的元素执行集合类的操作或去重。\n\n\
  如果序列是可变的，它还提供了一种具有副作用的更新方法，允许更新序列元素。回想 第 3 章，像 `seq(idx) = elem` 这样的语法只是 `seq.update(idx,\
  \ elem)` 的简写。注意 `update` 和 `updated` 区别。`update` 方法就地更改序列元素，仅对可变序列可用。`updated` 方法适用于所有序列，并且始终返回新序列而不是修改原始序列。\n\
  \n### trait Seq 中的操作\n\n| 别名 | 作用 |\n| --- | --- |\n| 索引和长度: |  |\n| `xs(i)` | (或完整写形式为\
  \ `xs apply i`) `xs` 索引为 `i` 处的元素。 |\n| `xs isDefinedAt i` | 测试 `i` 是否包含 `xs.indices`\
  \ 中。 |\n| `xs.length` | 序列的长度（同于 size）。 |\n| `xs lengthCompare len` | 如果 `xs` 的长度小于\
  \ `len`，则返回负整数 `Int`；如果大于 `len`，返回正整数 `Int`；如果相等则返回 0。即使 `xs` 是无限的也有效。 |\n| `xs.indices`\
  \ | `xs` 的索引范围，从 0 扩展到 `xs.length - 1`。 |\n| 索引搜索: |  |\n| `xs indexOf x` | `xs`\
  \ 中第一个等于 `x` 的元素的索引（存在多个变体）。 |\n| `xs lastIndexOf x` | `xs` 中最后一个等于 `x` 的元素的索引（存在多个变体）。\
  \ |\n| `xs indexOfSlice ys` | `xs` 的第一个索引，使得从该索引开始的连续元素构成序列 `ys`。 |\n| `xs lastIndexOfSlice\
  \ ys` | `xs` 的最后一个索引，使得从该索引开始的连续元素构成序列 `ys`。 |\n| `xs indexWhere p` | `xs` 中第一个满足\
  \ `p` 的元素的索引索引（存在多个变体）。 |\n| `xs.segmentLength(p, i)` | `xs` 中从 `xs(i)` 开始且满足谓词\
  \ `p` 的最长不连续元素段的长度。 |\n| 加法: |  |\n| `x +: xs` |  |\n| (或 `xs prepended x`) | 一个由\
  \ `x` 前置到 `xs` 组成的新序列。 |\n| `ys ++: xs` |  |\n| (或 `xs prependedAll ys`) | 一个由 `ys`\
  \ 的所有元素前置到 `xs` 组成的新序列。 |\n| `xs :+ x` |  |\n| (或 `xs appended x`) | 一个由 `x` 追加到\
  \ `xs` 组成的新序列。 |\n| `xs :++ ys` |  |\n| (或 `xs appendedAll ys`) | 一个由 `ys` 的所有元素追加到\
  \ `xs` 组成的新序列。等同于 `xs ++ ys`。 |\n| `xs.padTo(len, x)` | 向 `xs` 添加值 `x` 直到达到长度 `len`\
  \ 得到的序列。 |\n| 更新: |  |\n| `xs.patch(i, ys, r)` | 通过通过 `ys` 替换 `xs` 中从 `i` 开始的 `r`\
  \ 个元素得到的序列。 |\n| `xs.updated(i, x)` | `xs` 的副本，其中索引 `i` 处的元素被替换为 `x`。 |\n| `xs(i)\
  \ = x` | (或完整写形式为 `xs.update(i, x)`，仅适用于可变 Seqs）将 `xs` 索引为 `i` 处的元素更改为 `y`。 |\n\
  | 排序: |  |\n| `xs.sorted` | 通过使用 `xs` 元素类型的标准排序对其元素排序获得的新序列。 |\n| `xs.sortWith lessThan`\
  \ | 使用 `lessThan` 作为比较操作对 `xs` 的元素排序获得的新序列。 |\n| `xs.sortBy f` | 通过排序 `xs` 的元素获得的新序列。两个元素之间的比较通过将函数\
  \ `f` 映射到两者上并比较结果来完成。 |\n| 反转: |  |\n| `xs.reverse` | 一个按 `xs` 元素反序排列的序列。 |\n| `xs.reverseIterator`\
  \ | 一个按反序产生 `xs` 所有元素的迭代器。 |\n| 比较: |  |\n| `xs sameElements ys` | 测试 `xs` 和 `ys`\
  \ 是否具有相同的元素。 |\n| `xs startsWith ys` | 测试 `xs` 是否以 `ys` 开头。 |\n| `xs endsWith ys`\
  \ | 测试 `xs` 是否以 `ys` 结尾。 |\n| `xs contains x` | 测试 `xs` 是否包含元素 `x`。 |\n| `xs.search\
  \ x` | 在序列中搜索元素 `x`。 |\n| `xs.containsSlice ys` | 测试 `xs` 是否包含子序列 `ys`。 |\n| `xs.corresponds(p)`\
  \ | 测试两个序列对应的元素是否满足谓词 `p`。 |\n| 多集操作: |  |\n| `xs intersect` | 对两个序列的元素执行集合交集操作。\
  \ |\n| `xs diff` | 对两个序列的元素执行集合差操作。 |\n| `xs distinct` | 对序列元素执行去重操作。 |\n| `xs.distinctBy`\
  \ | 根据函数 `f` 对元素执行去重。 |\n\n如果序列是可变的，它还提供了一种具有副作用的更新方法，允许更新序列元素。回想 第 3 章，像 `seq(idx)\
  \ = elem` 这样的语法只是 `seq.update(idx, elem)` 的简写。注意 `update` 和 `updated` 区别。`update`\
  \ 方法就地更改序列元素，仅对可变序列可用。`updated` 方法适用于所有序列，并且始终返回新序列而不是修改原始序列。\n\n### trait Seq 中的操作\n\
