    When looking for a place to put one copy of something within a Perl program, use
    a scalar. Here are some examples:


    ```

    $greeting = "Welcome to Perl!";

    $score = 20;

    $score = "Goal!";

    $next = <;

    $the_answer = 42;

    $whoWantsToBeA = 1_000_000;

    ```


    Some readers may be looking at the $greeting variable and saying ''that''s not
    one of something, that''s three words'', but they would only be half right. Yes,
    it is three words, but they are contained within *one string*, and Perl refers
    to this single string with a scalar variable.


    Other readers may find it interesting (even strange) that the variable $score
    is set to two different types of values - one number (20) and other string (''Goal'').
    Assuming that these lines were in fact a Perl program, the Perl interpreter would
    complain that the second usage of $score causes an error, as $score was used initially
    within a numeric context. On the contrary, Perl does not care what value is assigned
    to a scalar; because Perl has *no notion of variable types*, at least not like
    that which readers might be used to in C, C++, Pascal, or Java. So, it is OK (with
    Perl) to assign seemingly typed values to the scalar variable.


    Note that variable names can start with and include the underscore character,
    which can also be used to make literals easier to read - simply place an underscore
    where it is usual to expect a comma. So:


    ```

    $whoWantsToBeA = 1_000_000;

    ```


    is equivalent to:


    ```

    $whoWantsToBeA = 100000;

    ```


    whereas:


    ```

    $whoWantsToBeA = 1,000,000;

