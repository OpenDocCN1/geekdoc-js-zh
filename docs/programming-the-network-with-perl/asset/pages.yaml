    # 3.4.5 getprotobyname and gethostbyaddr


    Two additional subroutines provide for the translation of Internet names into
    packed binary form, and versa.

    getprotobyname subroutine takes an Internet name as its sole parameter and, in
    scalar context, returns a packed binary address. In list context, it returns additional
    information on the Internet name (*hostname*).

    gehostbyaddr subroutine takes two parameters, a packed binary address and an *address
    family identifier*. The initial intent of the Socket API designers was to provide
    a networking API that could be adapted to any networking technology (not just
    TCP/IP), the second parameter is required, and should be set to AF_INET. Like
    getprotobyname, the behaviour of this subroutine differs in scalar and list context.
    In scalar context (the most used and useful form), gethostbyaddr returns the Internet
    name associated with an IP address.


    Some code will help to demonstrate the standard usage of these subroutines:


