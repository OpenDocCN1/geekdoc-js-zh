    # 6.5 The Agent.pm Module


    The 3.20 release of Agent.pm includes four object-oriented classes that can be
    used to build mobile agents and mobile-agent environments.

    The four classes are


    +   - Agent - used to instantiate and run a mobile agent;

    - Agent::Message - used to send code from one MAE to another;

    - Agent::Transport - used to receive code from an MAE;

    - Agent::Transport::TCP - provides a transport mechanism for mobile-agent developers
    to use. At the time of writing, Agent.pm supports only TCP, which means that when
    relocation occurs, it is rarely.


    To build a functioning agent, the programmer needs to create the following three
    programs using the Agent.pm technologies.

    ALaunching MAE - this program provides a mechanism to start (or launch) a mobile
    agent on the initiating network device. Although it is useful to think of a mobile
    agent as an MAE, it primarily exists to kick-start the execution. Note, that this
    program does not send a mobile agent to another MAE. The decision as whether or
    not to relocate is taken by the mobile agent, not the MAE. However, the Launching
    MAE provides a relocation service to the mobile agent.


    ARiving MAE - using the facilities provided by Agent::Transport, this program
    receives a mobile agent from an MAE and executes it. The Launching MAE, the Receiving
    MAE provides a relocation service to a mobile agent.


    oadable mobile agent - inheriting its functionality from the Agent class, this
    program can use the facilities of Agent::Message to relocate from one MAE to another.
    This program cannot start its execution cycle without the assistance of a Launching
    MAE³. Once relocated, this program cannot execute nor relocate without the assistance
    of a Receiving MAE.


    Later in this chapter, examples of each of these programs are developed.


    > ³So is probably inappropriate to call it a ‘program’.'
