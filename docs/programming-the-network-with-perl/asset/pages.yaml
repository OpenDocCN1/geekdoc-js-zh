  md: '# 1.2.5 Built-in variables


    The Perl interpreter defines (and uses) a large collection of built-in variables.
    The default variable ($_) has already been described. A full list of built-ins
    can be viewed in the perl manual page. Type this command at the Linux command-line
    to page through the material:


    ```

    man perl

    ```


    Here is a list of frequently used built-in variables (examples of their use -
    explanations - appear throughout Programming the Network with Perl).

    $ - contains the operating system error code after some operation has failed.

    $ - the auto-flush variable, when set to 1 switches off buffering when Perl writes
    to an output filehandle (such as standard output). With auto-flushing, the output
    buffer will not get flushed until a newline character is written.


    $1, $2, etc. - the pattern-match variables, created as the result of successful
    pattern matches and expressions.


    $a, $b - used by the inbuilt sort subroutine when doing comparisons.

    $@ - when eval is used, $0 is the return value from eval.

    @_ - the default array, used when processing parameters inside Perl subroutines.

    @ARG - contains the list of command-line parameters sent to a program, add-modules.


    %ENV - a hashing containing the current contents of the operating systems environment.

    %SIG - a hash of operating system signals and signal handlers.


    # 1.2.6 Scoping with local1, and my our


    Variable contents in Perl need not be declared prior to their first use. Perl
    will automatically create them as needed. As a direct result of this behaviour,
    all variables in Perl are global in scope.


    It is possible to localize a variable container to a block of code using the inbuilt
    local1 subroutine. When local1 is used in a block, at the end of the block the
    variable will revert to the value prior to entering the block which it appears.
    Within the block, the variable can be visible in any way. If the block of code
    invokes a subroutine, the local1 value is visible (not the global) within the
    invoked subroutine. Due to its strange behaviour, the local1 tends to be frowned
    upon nowadays. Consequently, none of the code in Programming the Network with
    Perl uses local1.'
