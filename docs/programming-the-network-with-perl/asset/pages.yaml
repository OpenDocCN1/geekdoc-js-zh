  md: "# Snooping\n\nIf offset is set to 0 and flags is set to 1, we are at the start\
    \ of a fragmented IP datagram (as more fragments are coming). This is the first\
    \ fragment.\nIf offset is greater than 0 and flags is set to 0, we are at the\
    \ end of a fragmented IP datagram. This is the last fragment. The value of offset\
    \ will be greater zero when fragmentation has occurred.\n\nIf offset is greater\
    \ than 0 and flags is set to 1, we are somewhere in the middle of a fragmented\
    \ IP datagram. The value of offset for this fragment as it relates to all the\
    \ other values of offset for all the other fragments provides a mechanism to work\
    \ out where the original IP datagram fragment belongs. This logic could not be\
    \ easily written in Perl, and in the code which follows, got_a_packet (taken from\
    \ v0.06 of Snooper) will count the number of fragmented IP datagrams, but not\
    \ process them. The count will be stored in a global scalar $num_fragments. Only\
    \ complete, non-fragmented datagrams are processed by this subroutine:\n\n```\n\
    sub a_packet {\n    my $packet = shift;\n\n    my $ip_datagram = NetPacket::->decode(\n\
    \        NetPacket::Ethernet::eth_strip($packet));\n\n    $num_datagrams++;\n\n\
    \    if ($ip_datagram->{offset} > 0) {\n        $num_fragments++;\n        exit;\n\
    \    }\n\n    $ip_type_totals{$ip_datagram->{proto}}++;\n}\n```\n\nReassembling\
    \ a fragmented IP datagram is complicated by the fact that there is no guarantee\
    \ all the fragments will arrive, they will arrive in the correct order, that will\
    \ arrive without error, and that will not be duplicated. IP is, after all, an\
    \ unreliable, best-effort technology. It was designed that way.\n\nOut-of-order\
    \ arrivals and duplicates are easily dealt with the choice of the correct data\
    \ structure. By using a Perl hash keyed on offset (with the value part containing\
    \ the fragments data), code can ensure that they are dealt with, as the keys in\
    \ hashes are automatically unique. If duplicate fragments arrive, they will simply\
    \ update the already existing hash entry, and uniqueness will be maintained. By\
