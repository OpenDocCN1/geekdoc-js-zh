    \ distribution, the IO::Socket module provides a mechanism to simplify the creation\
    \ and use of sockhandles, or socket objects to use the correct OO terminology.\
    \ When one socket is created, a set of methods can be called on the object to\
    \ effect network communi.\n\nTeam-Fly®"
