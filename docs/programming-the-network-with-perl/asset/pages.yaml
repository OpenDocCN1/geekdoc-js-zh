- img_proc: true
  md: '# It''s the Gisle and Graham Show! 179


    supports client programming of the popular non-HTTP protocols. Both modules operate
    at a higher-level of abstraction than the code seen so far in this chapter, building
    on the standard IO::Socket::INET module included with the Perl distribution.


    Of all the programmers active within the Perl community, two stand out when it
    comes to programming standard Internet protocols. They are Gisle Aas, the principal
    author of libwww-perl¹, and Graham Barr, the author of libnet⁸. In fact, both
    Gisle and Graham are highly active contributors to Perl as a whole.


    In the sections which follow, these libraries are introduced. To begin, the facilities
    of libwww-perl are used to rewrite the world''s worst Web browser.


    Of course, working with these modules, it is necessary to install each of them
    into Perl.


    # 4.5.1 Getting libwww-perl and libnet


    The libwww-perl and libnet libraries are available on CPAN (the Web Resources
    section at the end of this chapter), from where they can be downloaded. The libwww-perl
    library has a number of prerequisites, one of which is (rather conveniently) libnet.
    A list of to download from CPAN to satisfy all of the dependencies⁹.


    MIME-Base64-2.12.tar.gz provides support for encoding and decoding ''base64 strings'',
    used on the Internet when transmitting arbitrary data formats.


    URI-12.tar.gz provides support for using Uniform Resource Identifiers, used on
    the Internet to make arbitrary resources.


    Digest-MDS-2.13.tar.gz provides support for using the MD5 Message Digest as defined
    by RSA Data Security, Inc.


    HTML-Parser-3.23.tar.gz supports working with documents which have been marked-up
    with HTML formatting tags.


    These modules can be installed using the standard installation process that was
    first seen in Chapter 2. Assuming a fictitious module called PJB-3.01.tar.gz,
    use these commands at a Linux prompt to unpack, install and release 3.01 of the
    PJB module:


    ```

    gunzip PJB-3.01.tar.gz

    tar xvf PJB-3.01.tar

    ```


    > ⁷Many fine programmers also contribute to this effort,


    > ⁸And the author of the IO::Socket::* modules are now a standard part of Perl,


    > ⁹Note that the time of publication of some of these modules will have been updated,
    so the version numbers may not match exactly with those of the modules you download.
    However, they should be at least the versions shown here.'
