- img_proc: true
  md: "100 Sockets\n\nneed to concern themselves with the proper design of the applications\
    \ they build.\nConsequently, a number of design models have been developed.\n\n\
    The distributed model provides for the different parts of a custom network\napplication\
    \ to be located on a collection of geographically dispersed network\ndev. When\
    \ working within this model, programmers do not concern them-\nelves with the\
    \ physical network location of the resources they use (i.e. where\nthe various\
    \ parts are to be found). Instead, the application is developed in the\ntraditional\
    \ way, as if it were executing on a single computer. Special tools are\nemployed\
    \ to break the application into its different parts, prior to distribution\nthe\
    \ network. Examples of these include the Remote Procedure Call (RPC)\ntechnology\
    \ developed at Sun MicroSystems, and the Common Object Request Bro-\n Architecture\
    \ (CORBA) as promoted by The Object Management Group. Any\nfurther discussion\
    \ of this model is beyond the scope of this book.\n\nThe mobile-agent model provides\
