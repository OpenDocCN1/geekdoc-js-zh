  md: '# 3.15 Where To From Here?


    In this chapter, the main features of the Perl Socket API were described. Much
    can be learned from the experience of building some custom network applications.
    Start with the Exercises at the end of this chapter, then explore the documentation
    included with Perl, in particular the peripc manual page. A number of excellent
    books (by respected authors) cover the Socket API in depth - see the Web has an
    extensive collection of sites which offers many references and tutorials on programming
    sockets (mostly geared towards the C programmer, although Java is popular).


    CPAN has a small collection of add-modules to Perl that implement common network
    server behaviour. These include Jochen Wiedmann''s Net::Daemon module, Charlie
    Stross''s NetServer::Generic and the Net::Server by Paul Seamons. Each with extensive
    online documentation. Before creating a network server from scratch, take time
    to become familiar with the functionality provided by each of these modules. In
    addition, there is much to be gleaned from reviewing each module''s code.


    The techniques described in this chapter can be used to interact with any Internet
    server, as the vast majority of Internet servers (be they offering Web, email,
    news or file-transfer services) are typically built on top of the Socket API.
    However, to do this effectively can involve quite a bit of work (not to mention
    code). Thankfully, some great great Perl programmers have built add-modules that
    allow the Perl network programming to interact with these standard servers at
    a higher level of abstraction. The use of a collection of add-on Internet modules
    forms the basis of the next chapter.


    # 3.16 Print Resources


    For a general introduction to the Socket API, and computer networking in general,
    refer to Computer Networks and Internets, with Internet Applications, 3rd edn,
    by Douglas E. Comer (Prentice-Halls, 2001). Dr Comer''s work in this area is well
    known, and this book includes a brief description of RPC and CORBA, as well as
    sufficient details on the various mechanisms used by TCP to achieve reliability.
    The client and server characteristics described at the start of this chapter are
    based on material from Dr Comer''s book.


    The ultimate reference to the Socket and almost APIs (for C programmers) is UNIX
    Network Programming, Volume 1: Networking APIs: Sockets and XII, 2nd edn, by W.
    Richard Stevens (Prentice-Halls, 1999). Although written for the C programmer,
    this book is still a very useful reference, as Perl''s functional interface to
    the Socket API is very close to C''s.


    For Perl programmers, the definitive reference to the Socket API is the excellent
    and very thorough Network Programming with Perl, by Lincoln D. Stein (Addison-'
