    \nmy $pkt_descriptor = Net::PcapUtils::open;\nif (!ref $pkt_descriptor ) {\n \
    \   print \"Net::PcapUtils::open returned: $pkt_descriptor\\n\";\n    exit;\n\
    }\n\nwhile(1) # i.e. forever, or until \"killed\" ...\n{\n    Net::PcapUtils::next($pkt_descriptor);\\\
