  md: "# Working With Net::SNMP 243\n\nThe OIDs.pm module is a large collection of\
    \ Perl constant definitions. By default, nothing is exported to a program using\
    \ the module. Any single OID descriptor can be imported by name, as can collections\
    \ of descriptors by group. Here are some examples:\n\n```\nuse OIDs qw( sysptime\
    \ Forwarding udpInDatagrams);\nuse OIDs qw(: interfaces);\\nuse OIDs qw(: tcp\
    \ :udp ifNumber );\n```\n\nThe first example imports three individual OID descriptors,\
    \ one from the MIB-II system group, another from the ip group, and the last from\
    \ the udp group.\nThe second example imports the entire collection of OIDs included\
    \ in the MIB-II interfaces group.\n\nThe last example imports the ifNumber OID\
    \ from the MIB-II interfaces group, together with the entire collection of OIDs\
    \ included in the tcp and udp groups. Note that the order is important here, as\
    \ imported items must come after the group tags.\n\n# 5.10.2 The updstats source\
    \ code\n\nAnd now, all that there, here is the source code to the updstats program,\
    \ followed by a detailed description of its function:\n\n```\n#! /usr/bin/perl\
    \ -w\n\nuse strict;\nuse Socket;\nuse Net::SNMP qw(: oid_lex_sort);\nuse OIDs\
    \ qw(: udp);\n\nsub updstats_get_table {\n    my ($sess, $requestOID) = @_;\n\n\
    \    my $responsePDU = $sess->get_table($requestOID);\n    if (defined($responsePDU))\
    \ {\n        print \"updstats: OID: \", $requestOID, \": \", \"\\n\";\n      \
    \  $sess->error, \"\\n\";\n    }\n\n    foreach my $resp (oid_lex_sort keys %{$responsePDU})\
    \ {\n        print \"$resp => \", $responsePDU->{$resp}, \"\\n\";\n    }\n   \
    \ print \"\\n\";}\n```\n\nTeam-Fly®"
