  md: '# 3.4 Socket Support Subroutines


    Before considering writing custom network applications, let us look at a collec-tion
    of support subroutines provided to the network programmer, which are them-selves
    part of the Perl Socket API.


    # 3.4.1 inet_atton and inet_ntoa


    On TCP/IP networks, every device is assigned at least one unique 32 bit address,
    known as an IP Address. Although computing devices are designed to process bits,
    humans tend not to be. When referring to an IP address, humans describe the 32
    bits in dotted-decimal notation. So, instead of referring to 011111111000000000000001,
    the dotted-decimal equivalent can be used, which is 127.0.0.1. The problem this
    creates is that the relatively low-level Socket API expects IP addresses in 32
    bit format.


    To keep things convenient for humans and computers, the inet_atton subroutine
    provides the translation of any given dotted-decimal notation to the equiv-al
    binary form. The inet_ntoa translates from any binary form to dotted-decimal notation.
    The binary form is often referred to as a packed binary address. Here is how to
    use these subroutines:


    ```

    $ $ip = ''127.0.0.1'';

    $binary = inet_atton($ip);

    $dotted_decimal = inet_ntoa($binary);

    ```


    which results in the scalar $dotted_decimal having the value 127.0.0.1. These
    subroutines are often combined with another subroutine called sockaddr_in to create
    a socket address.


    # 3.4.2 Socket addresses


    A socket address is the combination of a packed binary address and a protocol
    port-number, and socket addresses are manipulated with the sockaddr_in sub-routine.
    In Perl, sockaddr_in is actually two subroutines in one. When used in scalar context,
    the subroutine creates a socket address from a combination of packed binary address
    and protocol port-number. When used in list context, the subroutine takes a socket
    address as its sole parameter, and returns the protocol port-number and packed
    binary address (which can be passed to inet_ntoa to determine the dotted-decimal
    notation). Another snippet demonstrates the standard usage of sockaddr_in:


    ```

    $ $ip = ''127.0.0.1'';

    $ $port = 80;

    ```


    > ¹Perl strangeness strikes again!'
  merge: -1
