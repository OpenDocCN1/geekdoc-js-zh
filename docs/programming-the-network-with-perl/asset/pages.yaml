  md: "# Management\n\nWhen communicating with a Managed Device, session is called\
    \ to prepare for the SNMP interaction. Note that SNMP uses UDP as its transport\
    \ protocol, so do not assume that a connection is established by the call to session.\
    \ A facility is prepared and the Net :: :SNMP object is created, providing a means\
    \ to call any of the above methods. When the SNMP interaction is over, the close\
    \ method is called to destroy the facility.\n\nIt may seem strange that SNMP uses\
    \ the unreliable, connectionless UDP to carry its data. Survey network management\
    \ data are important, requiring the use of a reliable transport protocol to get\
    \ the data through? Yes, network management data are important, but networks do\
    \ not exist to carry network traffic, do they? The SNMP architects decided that\
    \ the impact of carrying network management data on a network should be kept to\
    \ a minimum, so as the transport technology. Additionally, it was felt that a\
    \ Management Station would typically, be pressed into service when a network was\
    \ experiencing problems. If the problems were severe, the network may be unable\
    \ to establish any reliable connections using TCP. However, low-overhead UDP data\
    \ may get through, allowing some sort of diagnosis to be determined from the received\
    \ network management responses.\n\n# 5.10 With Net :: SNMP\n\nFor now, let us\
    \ with UDP as the protocol of interest to the network manager. A program (upstats)\
    \ contacts a Managed Device and requests the current values for the MIB-II UDP\
    \ group. As shown in the discussion of the UDP group earlier, four instance values\
    \ and a table of UDP listeners are maintained.\n\nAssuming the existence of the\
    \ upstats program, here is the Linux command line to use the MIB-II UDP group\
    \ from one of the routers identified in this chapter:\n\n```\n/upstats 149.153.100.253\
    \ xxxxx\n```\n\nIn this example, xxxxx is the SNMP community string required by\
    \ this router (which operates on the network running at The Institute of Technology,\
    \ Carlow)¹².\n invocation of upstats produces the following results:\n\nRequesting\
    \ 'udp' group data for 149.153.100.253, xxxxx, SNMPv2\n\nUDP instance values:\n\
    \n```\n1.3.6.1.2.1.7.1.0 => 1882109\n1.3.6.1.2.1.7.2.0 => 5030516\n1.3.6.1.2.1.7.3.0\
    \ => 1\n1.3.6.1.2.1.7.4.0 => 10495825\n```\n\n> ¹²The actual community string\
    \ is not shown in order to protect your author from the wrath of the on-campus\
    \ Computing Services Department."
