  md: '# The Net::SNMP Module 237


    # 5.8.3 SNMP communities


    Each of the SNMP versions share the notion of community. It can be useful to think
    of SNMP communities as domains. Managed Devices within organizations belong to
    a specific, named community. When requests are made to a Managed Device from a
    Management Station, the community string must be specified. When, SNMP supports
    a simple, community-based access policy. Typically, devices that are globally
    visible belonging to a community called public. If access is to be restricted
    the network administrator can assign whichever community string is deemed appropriate.


    For instance, on the network used during the writing of Programming the Network
    with Perl, a small number of devices use public as their community string. The
    private string is also used. Devices managed by the campus''s Computing Services
    Department have a different, guarded community string. The campus is connected
    to the Internet via ITNet, one of the large, third-level academic networks in
    Ireland. Devices on ITNet have another community string. It is sometimes necessary
    for a Management Station to try a number of community strings in an attempt to
    communicate with a collection of Managed Devices.


    # 5.9 The Net::SNMP Module


    As with most of computer networking, Perl programmers have been busy developing
    add-modules to make the life of protocol programmers easier. Happ, there is no
    shortage of modules to ease the programming of SNMP-based applications. In the
    sections which follow, Net::SNMP, by David M. Town, is used to develop a collection
    of Management Station utility programs.


    Net::SNMP is available on CPAN, and is installed with the usual set of commands,
    as follows:


    ```

    gunzip Net-SNMP-3.60.tar.gz

    tar xvf Net-SNMP-3.60.tar

    cd Net-SNMP-3.6

    perl Makefile.PL

    make

    make test

    su

    make install

    <ctrl-D

    man Net::SNMP

    perl -e ''use Net::SNMP''

    ```


    One of the great things about Net::SNMP is that it removes the need to understand
    all of the nitty-gritty details of programming SNMP. SNMP is the most involved
    and detailed Internet protocol. The devil is most definitely in the details. And
    this'
  merge: -1
