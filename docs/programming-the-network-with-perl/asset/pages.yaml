  md: '# Snooping


    debugger, which can be used to both analyse and test applications running on a
    TCP/IP network.


    A requirement exists to make the debugger (which will be called NetDebug) as generic
    as possible, as it would be too unwieldy to make changes to the source code every
    time we wanted to do something different. A number of command-line parameters
    will be defined to provide a simple mechanism to turn the generic to the specific,
    as follows.


    +   - c count specifies the number of packets to capture and, if specified, overrides
    any value for the -m parameter (which the -m parameter, below).


    +   - d ip-addr specifies a destination IP address to filter on, which is used
    in conjunction with the -s parameter. (The ip-addr value is specified in standard
    dotted-decimal notation.)


    +   - m specifies the number of minutes to capture for, with a default value of
    1 minute (which the -c parameter, above).


    +   - n is a Boolean that, when specified, puts the NIC into normal mode. The
    default is promiscuous mode.


    +   - p protocol port-number specifies the decimal protocol port-number to filter.
    If not specified, traffic for every protocol port-number is captured.


    +   - s ip-addr specifies a single (or source) IP address to filter on, which
    can be used on its own, or in combination with the -d parameter. If not specified,
    all IP sources are debugged. (The ip-addr value is specified in standard dotted-decimal
    notation.)


    +   - u is a Boolean that, when specified, captures UDP traffic as TCP traffic.
    When ''on'', NetDebug will log considerably more detail about each packet captured.
    The default setting for this switch is ''off''.


    For example, the following command-line runs the network debugger, capturing HTTP
    traffic (using protocol port-number 80) from the 149.153.100.67 network device/to
    the 149.153.100.23 network device:


    ```

    ./netdb -s149.153.100.67 -d149.153.100.23 -p80

    ```


    Whereas this command-line captures 250 UDP datagrams (using verbose mode) and
    from the networking segment NetDebug is running on:


    ```

    ./netdb -c250 -uv

    ```'
