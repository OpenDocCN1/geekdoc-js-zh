  md: '# 1.8.1 Modules


    When a package statement, together with whatever code goes with it, is placed
    in a separate file, it becomes a module that can be used by other programs. If
    the MyNamespace package from above was in a separate file (called MyNamespace.pm),
    the following code would import its variables and code into the current program:


