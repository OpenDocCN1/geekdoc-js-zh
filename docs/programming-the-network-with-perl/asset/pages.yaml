  md: '# 6.6 Oooh, Objects!


    As if all this talk of ''classes'' and ''inheriting'' was not a big clue, it should
    now be clear that Agent.pm is a purely object-oriented (OO) add-on module to Perl.
    Throughout Programming the Network with Perl, object-oriented technologies created
    by other Perl programmers have been used to great effect. To use Agent.pm, a greater
    understanding of Perl''s OO mechanisms is required.


    Developing classes in Perl is straightforward and allows a simple recipe.


    Declare a package - the subroutine declares a namespace, and in OO Perl, each
    class has a unique namespace (usually stored within its own module).


    Add functionality with methods - behaviour is added to an OO Perl by writing methods
    that reside within the namespace. As was the case in earlier chapters, method
    is the OO name for subroutine.


    To create an object, bless it - the bless subroutine takes a reference to something
    and turns it into an object of some named class. In Perl, the ''something'' can
    be anything at all (although hashes are very popular with OO Perl programmers).
    Blessing typically occurs when the object (of a certain class) is being instantiated
    by its constructor. Constructor is another fancy OO name for a special object
    instantiation subroutine, which is again, typically called new in Perl. When the
    word ''instantiate'' is used, think ''create''.


    In addition to satisfying this OO recipe, classes based on the Agent.pm must contain
    two specific methods:


    +   **new** - a constructor that instantiates a mobile-agent object which is inherited
    from the Agent class;

    **agent_main** - a method that belongs to the mobile agent''s class, which is
    invoked by the MAE.


    It is also recommended that the mobile agent be contained in a disk-file name
    with a ''.pa'' extension.


    Looking at some code should help to make sense of all OO speak, and in the sections
    below, a number of code samples illustrate Perl''s OO technology.


