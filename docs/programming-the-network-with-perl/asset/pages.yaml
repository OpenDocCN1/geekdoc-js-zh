    Once again, this version of the UDP client avoids deadlock. The cost is bloated
    and complex. It is also the most portable, as the use of signals and fork as illustrated
    above is tied closely to the Linux/Unix Perl implementation. With the 5.6.0 release
    of Perl, the Windows version emulates the functionality of fork; however, the
    most recent version of MacPerl does not.


    Despite all this extra, the most recent versions of the UDP client have managed
    to avoid deadlock. The remaining shortcomings of UDP can still impact the communications
    between the client and the server. Yet more code could be required to deal with
    all of these. And when it comes to improving the reliability of UDP, more code
    leads to increased complexity.


    Of course, another reason exists for dealing with the problems encountered with
    the UDP client and server, and for the use of an alternative transport service.
    Specifically, a reliable one. The UDP client has inherent complexity as a direct
    result of our attempts to counteract the inherent shortcomings of the unreliable
    UDP. However, when TCP is used, the requirement to add this additional code is
    nullified.


    In the section which follows, the UDP client and the UDP server will be redefined
    to use TCP.


    # 3.10 TCP Clients and Servers


    The fifth version of the UDP client (udp_c5) and server (udp_s5) will form the
    basis of the first TCP client and server. The TCP server will wait at a known
    IP address and protocol port to be contacted by a client, receive any amount of
    data, then send all data received back to the client. The TCP client will contact
    the server ten times, each time sending a TCP segment. The client will wait to
    receive each segment before the server sending another. As was the case with the
    UDP code, the TCP client and server both include calls to sleep to keeps things
    interesting from a flow-control point of view.


    > 10Note that Mac OS X, which includes and supports Perl 5.6.0, is a modern derivative
    of BSD-UNIX, not a modern derivative of Mac OS 9.'
