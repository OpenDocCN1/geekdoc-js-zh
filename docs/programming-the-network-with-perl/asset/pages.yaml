    </body></html>\n\n0\n\nThe Status-Line informs the client that the request was\
    \ bad. The body-part of the response contains an HTML page detailing additional\
    \ information. Note that the name/value pairings in the header-part of the response\
    \ do not include a Content-Length value. Instead, the header-part identifies the\
    \ body-part as conforming to the chunked transfer-encoding. Each 'chunk' of information\
    \ sent from the server is bracketed by two indicators (in this case 172 and 0).\
    \ Any number of chunks are sent, and the last always ends with a size indicator\
    \ of zero. Otherwise, with response, only one chunk is sent.\nThe important information\
    \ is included in the HTML page. Apache states that the client sent HTTP/1.1 request\
