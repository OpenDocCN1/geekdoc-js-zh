  md: '198 Protocols


    FTP - the File Transfer Protocol as defined in RFC 959 and implemented in the
    Net :::FTP module.


    SMTP - the Simple Mail Transfer Protocol as defined in RFC 821 and implemented
    in the Net :::SMTP module.


    Daytime/Time - as defined in RFC 867 and RFC 868 and implemented in the Net :::Time
    module.


    NNTP - the Network News Transfer Protocol as defined in RFC 977 and implemented
    in the Net :::NNTP module.


    POP3 - the Post Office Protocol, Version 3 as defined in RFC 1939 and implemented
    in the Net :::POP3 module.


    SNPP - the Simple Network Pager Protocol as defined in RFC 1861 and implemented
    in the Net :::SNPP module.


    All of these modules inherit from the Net::Cmd module, which is also part of the
    libnet library. Net::Cmd is an abstract class that cannot be used directly by
    application programmers, but can form the basis of another module that turns its
    abstract functionality into something concrete. All the other libnet modules inherit
    from Net::Cmd (which itself inherits from the standard IO::Handle module), they
    all exhibit a shared set of characteristics and a common API.


    To provide a feel for how the libnet modules work, a small Usenet reading program
    will be developed to take advantage of the API provided by the Net::NNTP module.


    # 4.0.1 Working with Usenet


    The news program provides a simple and quick method for reading Usenet articles.
    From the command-line, the user provides the Internet name of the server to contact
    (and optionally, if requested, a valid user-id and password). Once a NNTP connection
    is established with the remote server, news asks the user to specify a newsgroup
    to ''read''. If the newsgroup exists, news queries the server to provide the first
    and last article numbers currently available on the specified newsgroup. The user
    then has the option of changing these values if desired, before news retrieving
    and displaying the articles, newest first. With each article, the user has the
    option of reading the article, skipping to the next article or querying news and
    returning to the operating system''s command-line prompt.'
