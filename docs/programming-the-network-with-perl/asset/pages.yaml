  md: '# 5.12 Setting Net::MIB-II Data Management


    The Net::SNMP module supports the setting of data on a Managed Device. That is,
    assuming the following two conditions hold.


    The MIB-II data item is read/write - only a small percentage of MIB-II data items
    are classified as ''read-write'' within the standards document. It is impossible
    to set a data item that is designated ''read-only'' and any attempt to do so will
    not succeed.


    The managed device allows setting - the SNMP agent software executing on a Managed
    Device must be configured by a Systems Administrator to support the setting of
    data. Even if the standards indicate that an MIB-II data item is ''read-write'',
    any attempt to set the data item on a Managed Device has been explicitly configured
    to disallow the set_request operation will fail.


    Most SNMP agent implementations provide a mechanism to configure the community
    string to associate with ''read-only'' and ''read-write'' operations. To configure
    the desired values, a file called /usr/local/snmp/snmpd.conf on pblix.itcarlow.ie
    can be edited. Here is the contents of this file:


    ```

    ######################################################

    # snmpd.conf

    ######################################################

    ```


    ```

    syslocation "Paul Barry''s Laptop"

    sysservers 12

    scontact paul.berry@itcarlow.ie

    ```


    ```

    rwcommunity private

    rocommunity public

    ```


    Lines that start with # are comments and can be ignored. The rest of the lines
    are SNMP agent configuration directives.

    The first three define the value of three data items from the MIB-II system group,
    and are relatively self-explanatory¹. When it comes to configuring, the two remaining
    directives are of more interest.


    The rwcommunity directive configures the community string to use for ''read-write''
    access, which is the default. ''Read-only'' is configured with the rocommunity
    directive, which uses the string public. Note that the use of ''private'' and
    ''public'' as community strings is regarded by many to be merely defaults that
    should never be used within a production environment (as they are too common and
    too easy to guess). They are fine for using testing and for illustrative purposes,
    but real community strings should be chosen with the same care as any systems
    administration password.


    > ¹The reader is referred to RFC 1213 for more details.'
  merge: -1
  pgno: 273
- img_proc: true
  md: "# Setting MIB-II Data\n\nThe Net::SNMP module supports setting MIB-II data\
    \ items through the use of the set_request method. This method takes three parameters\
    \ as follows.\n\nObject identifier – a numeric object identifier.\n\nObject type\
    \ – the ASN.1 object type of the value to be set.\n\nObject value – the actual\
    \ value to set.\n\nOf the three, the middle parameter requires further explanation.\
    \ It is only reasonable to expect that each MIB-II data item has a type associated\
    \ with it. For example, the data item might be a positive integer or a zero-terminated\
    \ string. Within the SNMP Framework, the allowed types are rigidly defined in\
    \ a document known as The Structure of Management Information (SMI). The Net::SNMP\
    \ module defines a set of constants corresponding to the allowed data types. This\
    \ is a list of the most commonly used (note that the names of the types are taken\
    \ from the Net::SNMP module's constants):\n\nINTEGER and INTEGER32 – machine independent\
    \ integer types;\n\nOCTET_STRING – binary and textual data in 8 bit format;\n\n\
    OBJECT_IDENTIFIER – type for defining the position of the OID in the MIB;\n\n\
    IPADDRESS – an IP address in dotted-decimal notation;\n\nCOUNTER, COUNTER32 and\
    \ COUNTER64 – non-negative integers which wrap around when they reach their maximum\
    \ value;\n\nGAUGE and GAGE32 – non-negative integers that do not wrap, but instead\
    \ 'cap' at their maximum value (until such time as their value decreases);\n\n\
    TIMETICKS – non-negative integers in hundredths of a second since some start time.\n\
    \nThe following code snippet demonstrates the standard usage of the set_request\
    \ method:\n\n```\nmy newLocation = \"Paul Barry's Desktop\";\n\nmy $respPDU =\
    \ $snmp_session->set_request( sysLocation,\n                                 \
    \        OCTET_STRING,\n                                         newLocation );\n\
    \nif ( defined($responsePDU)) {\n\twarn \"set_request did not work: \", $snmp_session->error,\
    \ \"\\n\";\n}\n```"
  merge: -1
  pgno: 274
- img_proc: true
  md: "258 Management\n\nLocation item from the MIB-II system group is set to 'Paul\
    \ Barry's Desktop' by this code, assuming, of course, that the SNMP agent software\
    \ on the Managed Device has been configured to allow such operations. If the set_request\
    \ fails, an appropriate error message is displayed.\n\n# ## 5.13 IP Router Mapping\n\
    \nEarlier in this chapter, the traceroute program was used to determine the list\
    \ of routers between two network devices on the Internet. Another, related requirement\
    \ exists, and it is time to determine all the routes through an internet. The\
