    \ as an individual entry in the next hop list. So, using the next hop list as\
    \ the list of routers to map problems concerns some of the IP addresses on the\
    \ list refer to concatenation of connections on the router.\n\nDetermining which\
    \ of the IP addresses refer to the router itself and which refer to some other\
    \ router is accomplished by examining the list of types associated with each destination.\
    \ If the value is 4, the connection type is indirect and the destination refers\
