    # 1.8.2 Objects


    Modules form the basis of Perl''s object-oriented capabilities (as well as Perl''s
    main code reuse technology). The code for a Perl class is, by convention, placed
    in a module file. Objects in Perl are, surprisingly, no more than a special type
    of reference (in effect, a reference that has been marked as containing an object
    by an subroutine bless). This is to describe the mechanics employed in creating
    Perl classes². However, every Perl programmer needs to know how to use objects
    created from the use of object-oriented modules.


    Let us pretend some firstly programmer has created a truly useful module for use
    with Perl, and that the module uses an object-oriented interface. Here is how
    code might use the module then access its variable containers and subroutines
    (which are known as ''methods'' in OO speak):


    ```

    use ReallyDead;

    $my_cool = ReallyDead->new( First => ''Elvis'', Last => ''Presley'' );

    print "\$my_cool->{First} \$my_cool->{Last} is really dead.\n";

    ```


    The code uses the ReallyDead module, then calls the modules constructor, which
    in this case is called new (but just as have been called anything, using new is
    a convention). The constructor creates a new ReallyDead object (passing two named
    arguments), which will then be referred to by the $my_cool variable. Remember,
    objects in Perl are a type of reference, so objects are stored in scalars.


    To access the data encapsulated within the object and call any subroutines associated
    with the object, the infix dereference arrow operator is used to refer to the
    instance data and methods. The code above, assuming the ReallyDead module actually
    existed, would print the following:


    > Elvis Presley really is dead.


    ²However, we will learn about creating Perl objects in Chapter 6, Mobile Agents.'
