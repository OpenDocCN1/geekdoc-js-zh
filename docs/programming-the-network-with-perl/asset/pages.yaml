  md: "# Protocols\n\nThis code begins by assigning the required parameter to the\
    \ $http_obj scalar. Any other parameters are assigned to the %params hash. Looking\
    \ at the above invocations of the get_resource subroutine, and recalling that\
    \ the => symbol is 'syntactic sugar' for comma in Perl, these invocations send\
    \ a list of items to the subroutine. The @_ is used to initialize the hash. If\
    \ the values are defined, they are used to initialize four scalars, $http_method,\
    \ $http_page, $connect_type and $http_server. Note the use of default values for\
    \ each of these. The HTTP request is then built from the values, and sent to the\
    \ HTTP server (using a call to print). The rest of the code is as it was from\
    \ the first version of swab.\n\nUnfortunately, this version of get_resource does\
    \ not work properly. When it is executed, the program successfully receives and\
    \ displays the file called index.html, then seems to appear for a number of seconds,\
    \ returning to the command-line. The request for the apache_pb.gif resource seems\
    \ to have somehow disappeared.\n\nWhat is going on? The problem is that the client\
    \ is getting stuck inside the while loop within the get_resource subroutine. The\
    \ connection type is to Keep-Alive, so the server is keeping the connection open.\
    \ However, the client does not know when to stop reading, so it is waiting for\
    \ something to happen. Eventually, the server times out (after 15 seconds), closes\
    \ the connection and the loop ends. When the client tries to send the next request,\
    \ it is ignored\n\n# 4.3.3 A better get_resource\n\nWhat the code needs to do\
    \ within get_resource is stop reading the first resource has been received. But\
    \ how is this done? One technique is to use the Content-Length value from the\
    \ header-part. The strategy is to determine the Content-Length value while reading\
