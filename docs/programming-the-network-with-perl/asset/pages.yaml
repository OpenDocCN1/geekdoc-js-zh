  md: "# UDP Is Unreliable 117\n\nThe client code has indicated that messages 2 and\
    \ 4 could not be sent, strangely, it did not complain about messages 1, 3 and\
    \ 5! As far as the UDP client is concerned, the odd-numbered messages appear to\
    \ have been sent without error. However, sending data is not the same as receiving\
    \ it, and the client is still unsure as to the server's operational status. UDP\
    \ is, after all, unreliable.\n\n# ### 3.7.1 No flow control\n\nRather than attempting\
    \ to find a fast sender and a slow receiver, let us simulate the required behaviour\
    \ by creating another version of the UDP client and the UDP server.\n\nThe new\
    \ version of the server (udp_s3) needs to be slowed down, so after every recv,\
    \ the server will sleep for three seconds:\n\n```\nwarn \"Received from $remote_name:\
    \ $data\\n\"\nsleep(3);\n```\n\nThe changes to the client (udp_c4) involve creating\
    \ a large UDP datagram, which is then sent to the server ten times, pausing for\
    \ one second between each send. This makes the client three times faster than\
    \ the server:\n\n```\nmy $big_chunk = 'x' * 65000;\nwhile ($msg_count < 11) {\n\
    \  $data = $msg_count . ' -> ' . $big_chunk;\n  send(UDP_SOCK, $0, $destination)\n\
    \  or warn \"udp_c4: send to socket failed: $msg_count\\n\"\n  sleep(1);\n  $msg_count++;\n\
    }\n```\n\nThe $big_chunk of data is required because the operating system running\
    \ the server may employ some type of UDP buffering, which could result in small\
    \ UDP datagrams being queued prior to their delivery to a slow server. However,\
    \ when large UDP datagrams arrive, the impact of buffering has no impact, because\
    \ the UDP receiver buffer is unlikely to buffer more than 64 kb. On some systems,\
    \ the UDP implementation may restrict the size of UDP datagrams further. For example,\
    \ glnost, is running a BSD-UNIX derived system, failed to create UDP datagrams\
    \ larger than 8 kb.\n\n> ⁵No single UDP datagram can be greater than 65 536 bytes."
