    \n$Method – the value of the HTTP request method (e.g. GET or POST);\n\n$resource\
    \ – the name of the resource requested (e.g. a valid URL);\n\n$Speerhost – the\
    \ IP address of the browser making the request (e.g. dotted-decimal format).\n\
    \nThis new version of simplehttpd (which is called simplehttp2d) has code changes\
    \ in a number of places. Specifically, the code within the continue_as_child subroutine\
    \ that displays the diagnostic messages to the server's screen needs to call the\
    \ email_log subroutine, as follows:\n\n```\nelse\n{\n    $http_client->send_error(RC_NOT_FOUND);\n\
    \    print \"NOT FOUND\";\n    eval {\n        email_log($service->method,\n \
    \           $resource,\n            $http_client->peerhost);\n    }\n}\nelse\n\
    {\n    $http_client->send_error(RC_METHOD_NOT_ALLOWED);\n    print \"NOT OK\"\
    ;\n    eval {\n        email_log($service->method,\n            $request,\n  \
    \          $http_client->peerhost);\n    }\n}\nprint \"Remote addr: \", $http_client->peerhost,\
    \ \"\\n\";\n```\n\nThe calls to the email_log subroutine include the three required\
    \ parameters, and are enclosed within eval blocks. This is due to the fact that\
    \ the email_log result can result in a call to the inbuilt die subroutine, and\
    \ it is inappropriate for the simplehttp2d Web server to die whenever there is\
    \ a problem with its email subsystem. Using eval in this provides a mechanism\
    \ for simplehttp2d to recover from another outer fatal error in the email_log\
    \ subroutine.\n\nAt the top of the simplehttp2d code, the Net::SMTP module is\
