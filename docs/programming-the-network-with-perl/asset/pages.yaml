    # 5.7 Managed Data


    The data that allow a device to be managed are stored on a Managed Device. How
    these data are stored is not specified in the standards documents. For instance,
    the data may allow the implementer of the Managed Device to choose storage mechanism
    suits. What is specified in the documents is the constitution of the Managed Data,
    that is, what the items are and what they mean. These metadata* are defined in
    a Management Information Base.


    An MIB is a standardized description of the data items maintained by the Managed
    Device. A large collection of MIBs exist, and it is possible for a single Managed
    Device to maintain data items from more than one MIB. For instance, one MIB describes
    a collection of data relating to maintaining a network device running TCP/IP,
    and another describes data relating to Ethernet interface cards. It is not uncommon
    for a Managed Device to maintain the data items described within the TCP/IP MIB
    and the Ethernet MIB, and to make the values of any data item (regardless of MIB)
    available to a Management Station.


    # 5.7.1 The TCP/IP MIB


    When a device is connected to a TCP/IP network, the Managed Data must conform
    to at least the TCP/IP MIB. A number of versions of this MIB exist, with the most
    recent known as SNMPv2, which reflects a reorganisation due to the release of
    SNMPv2). MIB-II is defined in RFC 1213.


    Within MIB-II, the Managed Data is organized by category (or group), and there
    are 11 categories in all, as follows:


    +   - system - data about the network device, including its administrator-assigned
    name and the length of time it has been operational.


    +   - interfaces - data about the number and type of network interfaces attached
    to the network device.


    +   - at - data about the device''s address translation table (which is now deprecated,
    but is included in MIB-II to maintain backward compatibility).


    > *Metadata: data about data.'
