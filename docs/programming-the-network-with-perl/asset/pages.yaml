  md: '# Appendix D 331


    The module will work on the majority of Windows, UNIX and Linux platforms. Generated
    files are also compatible with the Linux/UNIX spreadsheet applications OpenOffice,
    Generic and XESS.

    The generated files are not compatible with MS Access.


    This module cannot be used to read an Excel file. Spreadsheet::ParseExcel or look
    at the main documentation for some suggestions. This module cannot be used to
    write to an existing Excel file.


