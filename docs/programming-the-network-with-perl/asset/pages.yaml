    Although no means complete, this description of SMTP provides enough details for
    any competent Sockets programmer to develop a simple Internet mailer. However,
    for the Perl programmer, the requirement to resort to directly programming the
    Socket API can be avoided by the Net::SMTP module.


    # 4.11.2 The Net::SMTP module


    Net::SMTP module provides an object-oriented client interface to the SMTP anding
    protocols. Once an object of type Net::SMTP is created (by calling its constructor),
    a collection of methods (whose names closely match those of the SMTP commands)
    are invoked to interact with the SMTP server.


    Those methods which match the SMTP commands identified as a result of the NetDebug
    packet capture are as follows.


    +   - hello uses EHLO to announce the sender''s domain name to the SMTP server.

    This method is rarely called directly, as Net::SMTP invokes hello automatically
    upon creation of the object.


    +   - mail uses the MAIL command to send the email address of the sender to the
    SMTP server.

    - recipient uses RCPT to identify the intended recipient(s) of the text message.


    +   - data uses the DATA command to initiate the start of the send of the text
    message. This method is also used to send the text message to the server. However,
    it is more common to use the datasend and dataend methods (inherited from the
    Net::Cnd module) to do this.


    +   - quit sends the QUIT command to the server, effectively closing the connection.


    Other Net::SMTP methods include banner, domain, etrn, expand, help, send, send_or_mail,
    send_and_mail, reset and verify. Refer to the Net::SMTP documentation for more
    details.'
