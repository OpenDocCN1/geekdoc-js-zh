  md: '# The Cloning Mobile-Agent ipdetermine 303


    assigns the array of created routing devices to a scalar $data. The scalar is
    sent via the client socket to the waiting UDP server on the initiating network
    device:


    ```

    my $data = join("n", @$self->{ ''Ruters'' }});

    ```


    To support the $self->{ ''Home'' } value, a small change is needed to the multilaunchma
    program. Replace the single-line assignment to the %args hash (the top of the
    program) with these lines, creating multilaunchma2:


    ```

    my $initiating = inet_ntoa( gethostbyname( hostname ) );

    ```


    ```

    my %args = ( ''Name'' =>$self_name, ''Home'' => $initiating );

    ```


    These lines ensure that the value of Home is set to the IP address of the initiating
    network device whenever the mobile agent is launched. This then allows the UDP
    client code within ipdetermineclone.pa to identify the correct network device
    to which to send results.


    The multilaunchma2.rc disk-file now has a single entry, as follows:\gaslast.itcarlow.ie:40000


    With the multihoc MAE executing on gnaslast.itcarlow.ie at protocol port-number
    40000, the cloning mobile agent can be sent on its way with the following command:


    ```

    /multilaunchma2 ipdetermineclone.pa

    ```


    After a short pause, the following results are displayed on the initiating network
    device''s screen:


    +   Determined ''ip'' next hop data:


    ```

    149.153.100.10

    ```


    Once again, these results match those of the previous implementations of this
    program. Of interest is the fact that the ipdetermineclone.pa combines the strengths
    of the mobile-agent model (mobility, low bandwidth) with the client/server model
    (simplicity, short messages). When it comes to choosing a model to work with,
    it is not an either-or decision. It is perfectly acceptable to mix/match.


    Of course, despite that this most recent version of ipdetermine uses the least
    amount of network bandwidth, we need to ask whether or not the increased complexity
    in the code was worth the effort? There is no simple answer to this question,
    as specific application requirements always dictate the design decisions made.
    In some cases, this level of complexity is tolerable, in others it is not. Choose
    wisely.'
