  md: "# Object-Oriented Sockets 153\n\nmy $child_pid = fork;\n\n```\nif ($child_pid)\
    \ \n{\n    next;\n}\\elsif (defined($child_pid)) \n{\n    close(TCP_SOCK);\n \
    \   continue_as_child(\"CLIENT_SOCK, \\$from_who);\n    exit;\n}else {\n    warn\
    \ \"tcp_s5: fork failed: \\$!\\n\";\n}\ncontinue (\n    close(CLIENT_SOCK);\n\
    ```\n\nThe close statements in the above code are interesting, and require further\
    \ explanation. When fork was introduced earlier in this chapter, it was stated\
    \ that when the call to fork succeeded, the created child process was an exact\
    \ copy of the parent. If the parent has open input/output handles, they will exist\
    \ in the child process and in the parent process. It is necessary, to close those\
    \ input/output handles that are not required in each process. Specifically, the\
    \ listening TCP_SOCK socket is not required in the child process, and the connected\
    \ clients CLIENT_SOCK socket is not required in the parent process. As they are\
    \ not needed, these sockhandles are closed.\n\nThis version of the Remote Syntax\
    \ Checker Server (tcp_s5) now supports concurrency, which allows it to better\
    \ support a greater number of clients. The parent process concentrates on accepting\
    \ connections, while the child process concentrates on serving them. This model\
    \ can be easily extended to build any number and type of network servers.\n\n\
    # 3.14 Object-Oriented Sockets\n\nIn addition to the functional interface to the\
