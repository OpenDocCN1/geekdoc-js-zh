  md: 'Where To From Here?


    # 4.13 Where To From Here?


    This chapter concentrated on programming to Internet standard protocols. In addition
    to using the Perl Socket API, two large add-module libraries to Perl, L1bwww-perl
    and L1bnet, were described. A number of simple, yet useful, client and server
    programs were written in Perl to demonstrate interactions with a number of Internet
    protocols.


    Using Net::SMTP is not the only way of generating email messages with Perl. Visit
    your local CPAN and browse the Usenet news category. There you will find a large
    and growing collection of email add-modules for Perl.


    Those readers interested in building a Web server from scratch should start with
    the code from Chapter 15 of Lincoln Stein''s book (refer to the Print Resources
    section from the last chapter). If writing a Web browser is more your thing, take
    a look at the fully functioning Web demo application (tkweb) written in the Tk
    GUI extension module and L1bwww-perl. Download Tk from a nearby CPAN.


    # 4.14 Print Resources


    A great book (if somewhat out of date) on programming the Web Client Programming
    by Clinton Wong (O''Reilly, 1997). This book provides excellent coverage of programming
    HTTP using the Perl Socket API and L1bwww-perl technologies. Unfortunately, the
    book is out of print. Fortunately, O''Reilly has included the book in its ''Open
    Projects'', which means that the text is online at http://www.oreilly11.com/openbook/
    website. It is somewhat of a shame that neither author nor O''Reilly plan a second
    edition.


    Chapter 9 of Lincoln Stein''s Network Programming with Perl is devoted to coverage
    of L1bnet and L1bwww-perl. The examples which combine L1bnet''s modules with HTML
    browsing and NNTP newsfeeds are especially instructive.


    Chapters 18 and 20 from the Perl Cookbook (see the Print Resources section at
    the end of Chapter 1) provide many examples of programming to Internet protocols
    and Web technologies, respectively. Like Stein''s book, L1bnet and L1bwww-perl
    feature heavily.


    # 4.15 Web Resources


    The latest version of the HTTP standard document is the Internet Engineering Task
    Force''s RFC 2616, and it is widely available on the Internet. Go to the home
    of Web standards, http://www.w3.org, for more information. The text of any RFC
    can be located following the link from http://www.ietf.org.'
