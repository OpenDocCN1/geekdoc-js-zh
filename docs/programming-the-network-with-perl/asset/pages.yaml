  md: '# Preface


    The network used during the development of Programming the Network with Perl is
    built from Ethernet hardware and TCP/IP software. The Ethernet network is connected
    to the global Internet via a cisco router and an ATM connection. The Network Employed
    appendix provides additional details on the network used (see the diagram on p.
    316).


    Unless otherwise stated, use of at least release 5.6.0 of the Perl programming
    language is assumed.


