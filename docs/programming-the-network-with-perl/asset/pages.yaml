    \ with HTTP/1.1, it becomes a requirement to send the Host value. To ensure the\
    \ client is 1.1 compatible, change the single line request from above to:\n\n\
    ```\n$http_request;\n```\n\n```\n$http_request = \"\\$method \\$http_page HTTP/1.1\\\
    $CRLF\" \n\"\\$Host: \\$http_server\\$CRLF\" \n\"\\$CRLF\";\n```\n\n```\nprint\
    \ \\$http_obj\\$request;\n```\n\nThe Host value specifies the name of the HTTP\
    \ server, which is available to the code in the \\$http_server scalar. As the\
    \ request spans more than one line⁴ the code introduces the \\$http_request scalar\
    \ to keep things nice and orderly.\nWith this change, the persistence is on when\
