    # 4.31 Embedded graphics


    The header-part of the response as sent by Apache is separated from the body by
    a blank line. Near the bottom of the HTTP page, an <img> tag includes the ''Powered
    by Apache'' logo, called apache_pb.gif. Note how the initial response from the
