  md: "```\nTTL: 10, frequency: 18.\nTTL: 32, frequency: 72.\nTTL: 64, frequency:\
    \ 2.\nTTL: 128, frequency: 1423.\nTTL: 255, frequency: 1.\n```\n\nAs the code\
    \ filters on the IP protocol, the non-Ethernet frames have no bearing on the statistics\
    \ gathered.\nA small or large average TTL value may indicate problems on a network.\
    \ When the TTL value reaches zero, the router processing the datagram will discard\
    \ and class it as undeliverable. Each time a router reaches an IP datagram, the\
    \ TTL value is reduced by one. In this way, an undeliverable IP datagram will\
    \ eventually be discarded.\nA large average TTL may result in IP datagrams surviving\
    \ too long on the network, which could result in wasted network resources and\
    \ (possibly) congestion. A small average TTL value may result in IP datagrams\
    \ being discarded so soon, which could result in IP datagram retransmission (assuming\
    \ some higher-level protocol is monitoring for such occurrences and performing\
    \ the retransmission - IP as a technology is unreliable and does not care when\
    \ a datagram is discarded.\n\n# 2.4.2 EtherSnooper (v0.06)\n\nHere is the code\
