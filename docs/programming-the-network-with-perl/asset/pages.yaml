  md: '# 206 Protocols


    As networking protocols go SMTP is remarkably straightforward. A sender establishes
    a reliable connection with a recipient mail system (or an intermediate relay),
    then converses with the mail system using a small set of SMTP commands. Critically,
    these commands enable the sender to identify the recipient(s) of the message,
    as well as transfer the email message as plain 7 bit ASCII text. When the message
    is transferred to the server, the reliable connection is closed.


    Rather than describing the SMTP commands in detail, let us look at extracts from
    a NetDebug packet capture of the traffic generated as a result of an user-agent
    and SMTP server communicating.


    The user-agent is running on pmac.itcarlow.ie, with an IP address of 149.153.100.65.
    The SMTP server is hosted by itcarlow.ie, which has an IP address of 149.153.100.8.


    The conversation begins with the user-agent establishing a reliable TCP connection
    with the SMTP server, to which the server replies:


    ```

    149.153.100.8 -> 149.153.100.65 (id: 57624, ttl: 128)

    ```


    ```

    TCP Source: 25 -> TCP Destination: 1128

    TCP Header Length: 5, TCP Checksum: 55369

    TCP Data:

    ```


    ```

    220 PAT Mercury 1.48 ESMTP server ready.''M

    ```


    This extract shows the server using the well-known TCP protocol port-number of
    25 for SMTP. The response includes a three-digit reply-code (220) together with
    a human-readable message (''PAT Mercury 1.48 ESMTP server ready.'')^{18}. With
    this reply, the server is indicating that it understands the extended services
    of SMTP, as defined in RFC 1869.


    The user-agent introduces itself to the server by sending its Internet domain
    name as the EHLO command:


    ```

    149.153.100.65 -> 149.153.100.8 (id: 1871, ttl: 64)

    ```


    ```

    TCP Source: 1128 -> TCP Destination: 25

    TCP Header Length: 5, TCP Checksum: 15266

    TCP Data:

    ```


    ```

    EHLO itcarlow.ie*M

    ```


    The server responds with a 250 reply-code and message, indicating it supports
    a small number of extended SMTP commands (TIME and HELP):


    > ^{18}Note that ''M corresponds to the ASCII representation of the new-line character.'
