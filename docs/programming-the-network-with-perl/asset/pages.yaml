- img_proc: true
  md: '# Mobile-Agent Advantages/Disadvantages 273


    collaborate at locations, this advantage can enable unique and elegant solutions
    to problems.


    Efficiency is another advantage, especially as it relates to network bandwidth
    utilization. As the complexity of the mobile agent increases, the bandwidth requirements
    do not necessarily.


    As an example of the efficiency advantage, consider a website indexing program.
    When developed using traditional client/server techniques, one possible strategy
    employed by the client is to request every document accessible on the website.
    Each document is retrieved from the HTTP server (with its own individual HTTP
    Request) and then stored on the client''s local storage. Only then can indexing
    occur. Even when HTTP/1.1 (with its persistent connections) is employed, the network
    traffic produced by this strategy is large, and gets larger as more documents
    are added to The resulting index might be small, but, as it is produced on the
    client, its size has no bearing on the network bandwidth used.


    When a mobile-agent is employed, the mobile agent relocates from the initiating
    device to the website and performs the indexing in situ. When the index is created,
    it is transferred back to the initiating network device. The index is small and
    the bandwidth that it consumes pales in comparison to what is generated by the
    client/server approach. Agreed, the processing burden (that is, the creation of
    the index) has shifted from the initiating network device to the website. But,
    with the method no longer has to process all HTTP Request messages, as it is assumed
    the mobile agent has access to the website''s documents in a manner which is independent
    of the HTTP access mechanisms.


    The web-indexing example also serves to highlight the major disadvantage of using
    mobile agents: security concerns. For the mobile-agent model to work, all of the
    participating network must trust each other to a high degree, or to a level of
    trust that is deemed acceptable by some local administrative policy. For instance,
    it would be foolish to allow the existence of an MAE on any network device, as
    not all of the network are trustworthy. The problems arise when one considers
    that an MAE provides a facility to execute arbitrary blocks of code from another
    remote network device. A malicious MAE could wreak havoc on the network device
    hosting the MAE if given free rein to execute any code. Another concern is the
    existence of malicious MAEs which avoid the arrival of non-malicious mobile agents.
    When they arrive, mobile agents find themselves operating in a hostile environment.


    Any further discussion of the solutions to the security disadvantage are beyond
    the scope of Programming the Network with Perl, as the intent here is to introduce
    the mobile-agent model and demonstrate examples of its use. Security in mobile
    agents is generating considerable research among academics and commercial interests.
    Refer to the Web Resources section at the end of this chapter for further details.


