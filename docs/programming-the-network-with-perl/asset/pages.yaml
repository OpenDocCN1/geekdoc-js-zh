    I awake, only to die.


    The log file shows that both messages were received as part of a single TCP segment.
    Two individual segments were expected, so why is this happening?

    An answer lies in the fact that sockethandles behave like all other input/output
    handles, and as such flushing is off by default. This means that output will not
    appear until the buffer is flushed. Usually, flushing occurs when a newline is
    sent to an input/output handle but this does not work with sockethandles as the
    above code includes the newline.

    In addition to input/output handle buffering, socket-based applications also fall
    foul of the internal buffering mechanism of TCP, which is what is happening here.
    The first message, the ''Sleeping for 10 seconds ...'' part, gets buffered on
    the outgoing sockethandle, then this version of the TCP server serves the message
    is then printed to the sockethandle and, as the connection is closed by the server,
    the buffer is flushed and causes the two messages to be sent to the client (one),
    where they get displayed. After making the initial connection the client waits
    for 10 seconds for data due to the fact that the server was having a 10 second
    nap.


    When it comes to enabling auto-flushing on sockethandles, the same technique used
    with any other input/output handle can be used, and TCP will honour the request.
    The following lines of code can be added to the server to turn flushing, and this
    allows the amended TCP server (tcp_s3) to behave in the way that it is expected:


    ```

    $prefix = select CLIENT_SOCK;

    $1 =;

    select $prefix;

    ```


    Be warned: this is a different select than the used in udp_c7. The single-argument
    version of select returns and sets the currently selected output handle. The code
    above replaces the $prefix output handle, while setting the output handle to be
    the sockethandle (CLIENT_SOCK). Flushing is switched on for CLIENT_SOCK by setting
    the built-in $ variable to a true value, then the previously selected output handle
    (which we conveniently remembered in $prefix) is made current again.


    Now, when the client contacts the server, the first message arrives immediately,
    the client then pauses for 10 seconds while the server sleeps for 10 seconds,
