    # 4.9 Building a Custom Web Server


    The libbww-perl technology is primarily known as a client-side programming library.
    This distribution includes a fully functioning HTTP server module, called HTTP::Daemon,
    which conforms to RFC 2068, the penultimate release of the HTTP/1.1 standard document.
    The HTTP::Daemon module can be put to a number of uses, such as creating a simple,
    stand-alone HTTP server or embedding an HTTP server in another application¹⁴.


    The simplehttpd program is a simple, stand-alone HTTP server written to take advantage
    of the functionality provided by HTTP::Daemon. This server - the code to which
    is loosely based on the sample code from the HTTP; :Daemon manual page - only
    supports the GET method.


