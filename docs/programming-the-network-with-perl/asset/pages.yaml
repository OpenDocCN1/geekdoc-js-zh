  md: '# Transport Snoopers 75


    Of course the solution is to use another hash keyed on the value of the fragment
    identifier, which is stored in the $ip_datagram->id field. Each fragment associated
    with a fragmented IP datagram will have the same value for id. To complete the
    solution, the value part of this hash will contain a reference to the hash which
    contains the fragments (as discussed in the last paragraph). As the program runs,
    these-ofhashes will contain any fragment of IP datagrams in the process of being
    reassembled.


    Code can be added to go_packet to update the hash-ofhashes each time the subroutine
    is invoked. The code can also check to see if the latest fragment contains the
    IP datagram and take any appropriate action.


    Of course, the program will still deal with the problem of fragments. How long
    should the code wait before determining any particular IP datagram cannot be reassembled?
    Coming up with a reasonable answer – and implementation – is suggested exercise
    (see the end of this chapter).


    With TCP traffic, the situation discussed above as to UDP is very different. TCP
    will endeavour to ensure the successful transmission of any data pertains to the
    traffic. To this end, TCP ensures that if IP fragmentation never happens to the
    TCP traffic, it generates 2.7 (on p. 76) illustrates TCP’s behaviour. The 300
    bytes of data are “Fragmented” by TCP before being handed off to IP for delivery.
    Each IP datagram is carried in its payload of a chunk of TCP data and the appropriate
    TCP header information.


    However, fragmentation will occur when TCP traffic has to travel through a network
    segment that has a smaller MTU than the sending and receiving networks MTU. For
    example, data created on a Token-Ring network and destined for a FDDI network
    can create TCP segments as large as 4352 bytes. However, if the Token-Ring and
    FDDI networks are connected by an Ethernet segment, then the large segments will
    be fragmented (by IP) in order to allow their transmission over Ethernet. So,
    it is possible to snoop TCP data and experience the same fragmentation difficulties
    associated with UDP snooping.


    Additional code is required to take this possibility into consideration when snooping
    TCP.


