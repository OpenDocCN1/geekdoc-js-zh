  md: '154 Sockets


    cation. The method names correspond to the Socket API subroutines introduced earlier
    in this chapter.


    The decision as to which interface to use, whether functional or OO, is primarily
    a personal one. The functional interface does not incur as high overhead as the
    OO interface, and it provides finer control over what is going on. However, the
    OO interface can be very convenient.


    # 3.14.1 IO::Socket


    IO::Socket module (or class to use OO speak) is a subclass of Perl''s standard
    IO::Handle class, which provides an OO interface to input/output handles. As seen
    with instance, it is possible to print and send data to any input/output handle.
    It these shared characteristics that are implemented in IO:: creating input/output
    objects, and expanded upon their derived classes, of IO::Socket is one.


    However, when coming to creating network socket objects, IO::Socket is not enough,
    as only those methods connect to any socket type are implemented in IO::Socket
    module. Two types of socket subclasses can be created, those that work over a
    network (type INET) and those that work within a single computing device (type
    UNIX), which may or may not be networked. The UNIX type will not be discussed
    here, as it is of less interest to the network programmer.


    # 3.14.2 IO::Socket::INET


    To create a socket object, invoke the new method¹² from the IO::Socket::INET class.
    This method takes a variable number of named parameters, as follows.


    **PeerAddr** — the address and (optionally) the protocol port-number of the remote
    host. The address can be specified as an IP name or a dotted-decimal address.
    The port can be specified as a decimal port-number, or as a service-name/port-number
    combination. Examples would be ''pblinux'',''ticarlow.ie'',''unix303.ticarlow.ie:80
    and the strange range looking ''149.153.203.15:mobileip-agent(434)''. Another
    name for this parameter is PeerHost.


    **PeerPort** — the decimal port-number, or a service-name/port-number combination.
    Examples are ''110'' and ''pop3(110)''.


    **LocalAddr** — specifies the address on the local network device to bind. The
    format is as PeerAddr above. Another name for this parameter is LocalHost.


    > ¹²In OO speak, ''method'' is given to ''socket''.'
