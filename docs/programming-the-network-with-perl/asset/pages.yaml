  md: '# The LPwwwb Program 181


    In addition, libwww-perl provides two other services as follows.


    **FILE** - provides a means to work with files on a local file system with a libwww-perl
    context, and these implemented in the LWP::Protocol::file module.


    **MAILTO** - provides a method of sending Internet email. Implemented in the LWP::Protocol::mailto
    module.


    # 4.6.1 The libwww-perl classes


    The libwww-perl library is entirely object oriented, and the application programming
    (API) reflects this¹⁰. A hierarchy of classes (or modules) exist within libwww-perl,
    and these provide working with the library''s Internet protocols.


    There is a lot to libwww-perl, and each library component includes excellent documentation
    manual (installed as Linux manual pages). In addition, two additional manual pages
    are included to help programmers get started with the library. They are as follows.


    +   LWP - the main libwww-perl manual page, which contain an overview of the library
    and the functionality provided.


    +   lwcook - a selection of ''cookbook recipes'' which provide common solutions
    to common requirements.


    Of all the classes (or submodules) provided, those that deal with HTTP requests
    and responses are of most interest. As expected, libwww-perl provides a class
    to work with, and another to a request with responses:


    +   **HTTP::Request** - is used to construct a request object which is sent to
    a server running above any of the libwww-perl-supported protocols;


    +   **HTTP::Response** - is created as a result of a request object being processed
    by a server.


    To enable interaction with these classes, libwww-perl provides another class,
    LWP::UserAgent, which provides a layer between the application and the network
    service being programmed. To see how this works, let us rebuild wwwb to use libwww-perl.


    # 4.7 The LPwwwb Program


    Here is the code to the world''s Web browser (LPwwwb), rewritten to use libwww-perl:


    > ¹⁰That was a tiny white line. Included with the library is a module LWP::Simple
    which provides a procedural interface to common libwww-perl functionality. Although
    useful, LWP::Simple is not discussed in Programming the Network with Perl.'
  merge: -1
