    Mon Sep 3 14:23:46 2001 - netdebug END run.


    The TELNET protocol is very chatty, and the captured results confirm this: a large
    number of small datagrams are travelling to/from the TELNET server. As TELNET
    transfers data as clear text, it is possible to determine where in the stream
    of the server prompts the user for a login-id and password, as the Password: prompts
    are clearly visible. After each prompt, a collection of dialogues carries the
    login-id (which is barry in this case) and password (which is passwordhere), in
    clear text. Note the TELNET server echoes each character by the user, resulting
    in the following data sequences: bbaarryypp and paaaswwoorrrdddhherree. Each character
    is sent and echoed in its TELNET longterm, which only adds to the chatty nature
    of this protocol.


    # NetDebug Secure Shell Traffic


    The following invocation of NetBug captures network traffic to and from the pbmac.itcarlow.ie
    (149.153.100.65) network device. The well-known protocol port-number of the Secure
    Shell Protocol is 22, and any captured traffic is filtered out by this value:


    ```

    /netdb -s 149.153.100.65 -p 22

    ```'
