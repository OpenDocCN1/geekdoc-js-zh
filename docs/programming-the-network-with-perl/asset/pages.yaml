    The next line of code is a little bit of Perl magic:


    $tmp_fn = (split /\/, $tmp_fn)[-1];


    Although this line of code does, there is a lot going on here. The first thing
    to happen is that the inbuilt split subroutine splits $tmp_fn scalar based on
    a delimiter. In this case, the delimiter is the character, which is referred to
    as a / in the above code, as split expects the delimiter to be surrounded by leading
    and trailing characters, escaping is necessary. When used in context, split returns
    a list of items resulting from the splitting operation. The patterns returned
    by the call to split force list to be in the array, and the [-1] accepts the last
    element of the array. Using the same scalar on both sides of an assignment (assignment
    happens here) is perfectly OK, as Perl evaluates the right-hand side of the assignment
    before performing the assignment.


    Now that we know what line of code does, why is it used here? The answer has to
    do with the fact that the client can send any file it wishes to the server. The
    server will create the file (with the same name) on its local storage to temporary
    the file before it calls the Perl interpreter for syntax checking. It would be
    to simply accept the client verbatim. What if the client sent this file /etc/passwd?
    If the TCP server processed to use this filename, it would try to create the file
    on its own local storage, overwriting the file if it already exists. Yikes! It
    would be Double Yikes and Groans if the TCP server had executing with superuser
    privilege (which should never be). The magic line guards against this, by stripping
    away the directory-part of the filename passed by the client and setting $tmp_fn
    to create the filename.


    A few examples further illustrate how this line of code works. On the left of
    the arrow is the original filename as sent by the client, and on the right, the
    sanitized filename produced by the server''s call to split is:


