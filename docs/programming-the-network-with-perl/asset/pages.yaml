    The remaining changes (i.e. additions of code) occur within the at_end method.

    The SNMP processing code at the ipderminema.pa program is copied ver-

    batim into this mobile agent''s at_end method. Rather than display any results
    on

    screen, at_end method sends them to the waiting UDP server that is

    established by the agent_main method on the initiating network device. Again,

    this code is borrowed from the UDP client from Chapter 3, Sockets:


    ```

    my $remote = $self->(''Home'');

    my $remote_port = SENDTO_UDP_PORT;

    my $trans_serv = getprotobyname(''udp'');

    my $remote_host = gethostbyname($remote)

    nor die "ipclonema: name lookup failed: $remote\n";nmy $destination = sockaddr_in($remote_port,
    $remote_host);

    ```


    ```

    sleep( 1 );

    ```


    ```

    socket(MASEND_UDP_SOCK, PE_INET, SOCK_DGRAM, $trans_serv)

    or die "ipclonema: socket creation failed: $!\n"

    my $data = join("\n", @{\$self->{''Ruters''}} });

    ```


    ```

    send(MASEND_UDP_SOCK, $data, 0, $destination)

    nor warn "ipclonema: send to socket failed. $!\n"

    close MASEND_UDP_SOCK

    nor die "ipclonema: close socket failed: $!\n";

    ```


    Three lines are worth noting. The first sets the remote UDP server''s network

    address to the value associated with the object''s Mem hash entry. This will neces-

    sitate a change to the multilunchma program, which will be discussed

    shortly:


    ```

    my $remote = $self->(''Home'');

    ```


    Prior to creating the socket and sending the list of routers to the

    waiting UDP server, the at_end method pauses for one second:


    ```

    sleep( 1 );

    ```


    This may seem like a strange thing to do. Unfortunately, under certain circum-

    stances (most notably testing with localhost), a situation can arise where

    the code to establish the UDP server (acting as agent_main) has not ex-

    cuted the time it takes the mobile agent to relocate, perform some processing

    and any data back to the waiting UDP server. If the send occurs with no server

    in existence, the UDP data simply disappears. The UDP server code then executes,

    he server waits, waits, and waits.


    The addition of a small, artificial delay guards against this happening. The final

    line of code worth highlighting the results from the SNMP processing


    }'
