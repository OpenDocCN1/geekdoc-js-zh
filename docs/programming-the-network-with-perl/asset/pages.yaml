  md: '# # Appendix C

    # Network

    # Employed


    The network employed during the development of Programming the Network with Perl
    resides at The Institute of Technology, Carlow in Ireland. Although the entire
    network consists of hundreds of interconnected network devices on a number of
    LAN segments, only a handful were used to test the example programs in this book.
    These devices are identified in the network diagram over the page, together with
    the LAN segments they are attached to.


    Those network devices sporting an ''R'' identify routers running proprietary ''network''
    operating systems. All of the other network devices are running some version of
    the Linux Operating System, except for elmo (Mac OS) and mossy (Windows). A square
    denotes a client (or workstation) network device, whereas a rectangle denotes
    a server-class network device.'
