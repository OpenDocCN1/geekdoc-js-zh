    A 302 code is sent from the server, informing the client that the requested resource
    (index.html) is temporarily available at some other location. The ''other location''
    is identified by the value associated with the Location header-line. The client
    should react to this Status-Line by retrieving the resource from the identified
    temporary location.


    For those that are incapable of doing this(in this case, a relatively recent version
    of Apache) sends a small page of HTML as part of response.


