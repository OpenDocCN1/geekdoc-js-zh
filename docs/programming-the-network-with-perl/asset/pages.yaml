  md: '# The Cloning Mobile-Agent ipdetermine 297


    These results, thankfully, exactly those produced by the client/server ipdetermine.
    An exercise at the end of the current chapter uses The Network Debugger to establish
    that the network traffic generated by the mobile agent ipdetermine.pa is less
