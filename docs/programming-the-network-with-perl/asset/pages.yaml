  md: '# Snooping


    This program, once started, will run forever until it is killed by the operating
    system. Every time a network packet is accepted from the NIC, the program prints
    out the words ''Got a packet!'' (followed by the newline character) to standard
    output (usually the screen). This is not too exciting, but the structure of this
    small program will form the basis of everything else built in this chapter.


    This code begins with the standard (strange) first line which identifies the underlying
    operating system can find the Perl interpreter. The -w switch tells Perl to compile
    with warnings enabled. This switch, together with the strict compiler directive,
    forces programmers to write Perl as cleanly and clearly as possible; it is probably
    overkill at this stage to be paranoid about it, but as programs get bigger, these
    restrictions will more than justify their use.


    Perl is then told the program intends to use the services provided by the Net::PcapUtils
    module. Next comes a very subroutine that, when invoked, prints words Got a packet!
    followed by the newline character. The really useful line is the next one. Here
    it is:


    ```

    $status = Net::PcapUtils::loop(\get_a_packet);

    ```


    This line calls the loop subroutine within the Net::PcapUtils module, passing
    a reference to a subroutine as the only parameter. In this case, the subroutine
    is got_a_packet. The loop will now arrange to call got_a_packet every time a packet
    is accepted by the NIC. The get_a_packet subroutine, when used in this manner,
    is referred to as a callback function. The call to Net::PcapUtils::loop is fully
    qualified name, due to the fact that we are using the strict compiler directive.


    The result of the call to Net::PcapUtils::loop is assigned to the scalar variable
    $status. If the call to Net::PcapUtils::loop is OK, the value returned will be
    the empty string. If an error occurs, an error string is returned and placed in
    $status. The code tests for this, and prints an appropriate error message if necessary.


    On its own, this program is not very useful. In the remainder of this chapter,
    the program will extend to do much more. Working upwards from the bottom of the
    TCP/IP-RM, the extensions provide for a collection of tools that can be used to
    sniff any TCP/IP Ethernet-based network.


    # 2.3.1 loop = open + next


    Before building the extensions, let us talk a little bit about the other subroutines
    the Net::PcapUtils module provides, open and next. These subroutines provide for
    the manual opening of an NIC (using open) and the manual fetching of an accepted
    packet from the NIC (using next).


    Here is the simple snooper from the previous section rewritten to use open and
    instead of loop:'
