    agent. The addition of a simple loop to the source code oneshotloc to

    support the receipt of more than one mobile agent. In effect, the program is now

    a network server that waits forever at some specified IP address/protocol port-\nnumber
    to service clients (received from other MAEs, de they of the Receiving or

    Launching kind.'
