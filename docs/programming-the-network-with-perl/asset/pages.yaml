    # 5.8 The SNMP Protocol


    When the framework is considered in its entirety, one can easily become overwhelmed
    by the details. And this is before any discussion of SNMP''s operations has taken
    place. What then makes SNMP simple?


    The answer has to do in part with the fact that SNMP views data within MIB as
    a collection of scalar data items. The refusal of the SNMP standards authors to
    allow for more complex data structures is one of the main differences between
    SNMP and CMIP (as the latter allows for very complex data structures). Scalars
    are easy to implement, implementations of the framework are kept simple. Additionally,
    SNMP supports a very small set of operations which are, again, designed to be
    easy to implement, the authors of SNMP hoped to make its adoption an automatic
    decision, which is precisely what it is. SNMP is, by far, the most widely deployed
    network management technology used in today.


    # 5.8.1 SNMP''s operational model


    SNMP supports two types of operation: get and set. In essence, this means that
    a Management Station can get an instance value from a Managed Device, or set the
    value of an instance on a Managed Device, assuming permission to do so has been
    granted. Every other operation is defined to be a side effect of either get or
    set.


    This things simple. Rather than having an operation for every conceivable thing
    a Management might want to do, all operations are defined in terms of getting
    a value from, or setting a value on, the Managed Device. As an example, this means
    that rather having to define a ''shutdown'' operation on each Managed Device,
    all that is required is a ''time to next shutdown'' instance value in the MIB,
    which can be set to an appropriate value to signal when the shutdown should occur.

    The shutdown occurs as a side effect of setting an instance value.


    # 5.8.2 A brief tour of SNMPv1, SNMPv2 and SNMPv3


    Within this operational model, SNMPv1 defines five protocol messages, three generated
    on the Management Station and two generated on the Managed Device. The Management
    Station messages are as follows.


    get-request — in its simplest form, this message requests the value of an OID
    from a Managed Device. This is typically the value of the first instance of an
    OID. Additionally, a list of OIDs can be requested by a single get-request message.
    If a single OID is requested, or a list of OID/value pairing is referred to as
    a variable binding.


    The fact that Perl is a fundamental data type scalar is purely coincidental, albeit
    pleasantly so.'
