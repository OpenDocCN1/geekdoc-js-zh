  md: '# 6


    # Mobile Agents


    And now for something completely different.

    The last three chapters concerned themselves with a discussion of programming
    the network with what can be termed traditional techniques. Specifically, the
    use of the client/server model is so common that one could be forgiven for assuming
    it is the only usable network application development model. Today, the vast majority
    of Internet-based applications conform to the client/server model. And for good
    reason: it works well, is well understood and is easy to work with. However, there
    are other models, some of which were briefly discussed at the start of Chapter
    3, Sockets. Of them all, one of the most interesting is the mobile-agent model,
    and its study forms the basis of this, the final chapter of Programming the Network
    with Perl.


    # 6.1 What is a Mobile Agent?


    The answer is: it depends on who is asked. Given the relative immaturity of this
    field, the study of mobile-agent technologies has produced a number of conflicting
    definitions. Rather than discuss the various definitions and risk confusing the
    reader, a simple ''working definition'' is presented here (with the keywords emphasized).


    A mobile agent is a network-aware software application that can, under certain
    circumstances, suspend its execution on one network device, transport to another
    network device and resume execution there.


    The mobile designation is due to the software application''s ability to relocate
    from one network device to another. The agent designation is due to the software
    application doing something on behalf of a user, that is, it acts as an agent
    for the user.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'This model is very different to the client/server model. Instead of a standard,
    formatted message being sent from one software application to another over a network,
    the entire software application is sent. In the course of its execution, a mobile
    agent may relocate to multiple network devices, that is, it can roam.


    #  6.1.1 Mobile agent = code + state


    A mobile agent has two main components: code and state.

    Obviously, in order for a software application to relocate from one network device
    to another, its code has to travel. It will depend on the mobile-agent environment
    whether or not the code is in source code form, compiled or in some intermediate
    form (such as bytecode).


    The software application''s state also has to travel. The software application
    is currently using. Do any variables exist, and what are their values? Are any
    disk-files open? Does the software application hold any other resources? Again,
    depending on the mobile-agent environment, some or all of the software application''s
    resources may travel. The entire set of resources are referred to as the software
    application''s state.


    #  6.1.2 What is a mobile-agent environment?


    A mobile-agent environment (MAE) is a set of technologies that provides a working
    space for mobile agents. The MAE has to exist on each network device that the
    mobile agent can execute on (and relocate to), and this includes the device that
    starts the mobile agent. Throughout this chapter, the device that starts the mobile
    agent is referred to as the initiating network device.


    The technologies used to provide an MAE vary widely. Some network servers operate
    on any compatible network device, while others are entire operating systems built
    from scratch to mobile agents.


    Within the literature, MAEs are referred to by a number of names, with site location
    and the most popular monikers.


    #  6.2 Mobile-Agent Examples


    In light of an understanding of what a mobile agent is, let us revisit two applications
    from earlier in this book and consider their re-implementation as mobile agents.


    #  6.2.1 Revisiting multiwho


    Chapter 4, Protocols, includes the multiwho program, which uses the TELNET protocol
    to automate the production of the list of logged-in users on a collection'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'The TELNET protocol is classically client/server, whereby the server on a remote
    network device provides a terminal emulation service to a local client program.
    The multiwho program, built to exploit TELNET, contacts a list of network devices
    (which of each runs a TELNET server) and interacts with them in order to determine
    the list of logged-in users. It is the responsibility of the multiwho program
    to monitor the entire execution process, as well as process the results of each
    interaction and produce the concatenated list of logged-in users (the master list).


    The multiwho program exhibits two identifiable characteristics as follows.


    **It is client-centric** - the client-side of the interaction does all the real
    work. In comparison, the server-side of the interaction provides a fixed set of
    services which cannot be easily changed or expanded. If additional processing
    of the results generated by the service request is required, then this processing
    *must occur* on the client (as is with multiwho).


    **It is bandwidth-intensive** - the network traffic generated by multiwho in the
    results produced is disproportionate. A small amount of output results from a
    large amount of network traffic. This is worsened by the fact that TELNET is a
    very ''chatty'' protocol.


    A mobile-agent implementation of multiwho would begin by relocating to the first
    network device on the list. Once there, multiwho would determine the list of logged-in
    users and concatenate them with the master list (which would have started out
    empty). The multiwho agent then relocates to the next network device on the list
    and iterates. This procedure repeats until the next network device on the list
    is exhausted and the master list then returns to the initiating network device
    and displays the entire list of logged-in users.


    The mobile-agent-based multiwho is no longer client-centric, nor is it bandwidth-intensive.
    Network traffic is generated when a relocation from one network to another occurs.
    Frankly, the ''chatty'' TELNET protocol is nowhere to be seen.


    # 6.2.2 Revisiting ipdetermine


    Chapter 5, *Management* includes the ipdetermine program, which uses SNMP to determine
    a list of routers from a specified routing device. The technique employed requests
    the contents of the routing table from a *Managed Device*, then processes the
    table to extract the required information. Typically, the routing table has tens
    (sometimes hundreds) of entries, which are transferred


    > ¹Note that the mobile agent is no longer executing on the initiating network
    device.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'from the SNMP server (the Managed Device) to the SNMP client (the Management

    Station) for processing.


    Like TELNET, the SNMP technologies are client/server. The ipdetermine pro-

    gram is both client-centric and bandwidth-intensive. Returning to the example

    inocation of ipdetermine from the end of the last chapter, when executed

    against the149.153.100.10 router, it produced a list of just four contactable

    routers from the entire routing table which had considerably more entries, 312

    in all).


    Now, imagine a mobile-agent-capable router exists. An ipdetermine mobile

    agent transfers itself to the router, processes the routing table to determine
    the

    list of contactable routers, returns to the initiating network device with the

    list. The entire routing table are no longer transferred across the

    network, and the reliance on SNMP is greatly reduced.


    An improvement of the ipdetermine mobile agent would involve

    ipdetermine cloning itself before its transfer to the router. The original

    mobile agent would then wait (on the initiating network device)

    to receive the results produced by its clone and sent to it from the router. The

    clone returns to the initiating host, only the results of its execution on the

    router are transmitted. In this way, the network traffic generated by the clone
    is

    kept to a minimum.


    # 6.3 Mobile-Agent Advantages/Disadvantages


    Before discussing the advantages of the mobile-agent model over others (notable

    the client/server model), it is important to point out that it is possible to
    use

    any development model to solve a problem. The client/server and mobile-agent

    versions of both multi and ipdetermine solve the problems they set out to.

    The methods used are very different, but the results are the same. The track is

    to identify when it is appropriate and advantageous to use one model over the

    other.


    It might seem obvious, but the fact that mobile agents have the ability to relocate

    h huge advantage. For if a mobile agent cannot find what it needs on

    one network device, it relocates to another and continues looking. As such, the

    mobility advantage removes some of the limitations of traditional techniques.

    The mobile agent can, therefore, make the most of its autonomy.


    Related to the mobility advantage is the ability of a mobile agent to adapt

    the job at hand, providing a potentially powerful problem-solving technology.

    Granted, this typically involving mobile-agent techniques with

    of the Artificial Intelligence community². The adaptability advantage provides
    a

    level of customization which is superior to other models. When mobile agents


    > ²A topic very much beyond the scope of Programming with the Network with Perl.'
