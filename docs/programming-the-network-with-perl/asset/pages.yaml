    # 5.11.1 Being careful


    All of the Net::SNMP programs developed to date have assumed the presence of a
    functioning SNMP agent on the Managed Device. This is too optimistic an assumption
    to make. When the session constructor is invoked, a new Net::SNMP object comes
    into existence. However, no attempt is made to contact the Managed Device and
    interact. So, when session returns normally (that is, it does not return undef),
    this only means that the object has been successfully created, not the Managed
    Device is up and running and waiting service SNMP requests.'
