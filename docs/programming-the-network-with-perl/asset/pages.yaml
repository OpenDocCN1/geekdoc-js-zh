  md: '# 1


    # # Meet Perl


    This chapter introduces Perl to the non-Perl programmer. Competent Perl programmers
    need only skim through this material.


    The main objective of this chapter is to provide sufficient Perl to allow readers
    to comfortably work through the rest of Programming the Network with Perl. Another
    is to show as strangeness as programming technology: interesting, powerful, useful
    and fun.


    Newcomers to Perl are advised to work through a good introductory Perl text. See
    the Print Resources section at the end of this chapter for suggestions.


    For the purposes of this chapter, it is assumed that the reader is already a programmer.
    Veterans of the ''C type'' languages may find much of Perl familiar. However,
    Perl may look a lot like C, its behaviour is oftentimes a little strange, and
    can consequently be quite unlike C. Fans of other programming languages will,
    initially, just find Perl to be strange. Perl does not set out to be strange,
    but it is sometimes unlike the mainstream programming languages that the differences
    are seen as strangeness in the eyes of ''traditional'' programming folk. Which
    leads into the first bit of Perl strangeness: default behaviour.


    # ## 1.1 Perl''s Default Behaviour


    Unlike other programming languages, Perl assumes a lot. It does a lot of things
    by default, and unless told otherwise, a Perl program will inherit this default
    behaviour. Think of this as Perl''s way of giving programmers something for nothing.
    This is unlike the vast majority of programming languages, which generally assume
    nothing, and where nothing is free.'
  merge: -1
  pgno: 18
- img_proc: true
  md: "# Meet Perl\n\n# 1.1.1 Our first Perl program\n\nA simple example¹ will help\
    \ to illustrate this default behaviour:\n\n```\n#! /usr/bin/perl -w\n\nwhile (<>)\
    \ {\n    print;\n}\n```\n\nThe first line (all that #!) looks a little strange,\
    \ so let us conveniently ignore it, for now. The code of this program is the while\
    \ loop, which is printing something with a print statement. Just what is getting\
    \ printed is not clear, but as the print statement is in a loop, the assumption\
    \ is that it is happening over and again (as long as the condition of the while\
    \ loop is true). But, what is getting printed?\n\nThe answer lies in the bit of\
    \ code that has not been explained yet. Not, the strange first line - is still\
    \ too strange to discuss - it is the other bit, the <> bit. If you are reading\
    \ this and saying ‘that cannot do’, welcome to the wonderful world of Perl!\n\n\
    The <> is a Perl operator, unless Perl is told otherwise, however a program to\
    \ standard input and, when it appears in code, returns a line from standard input\
    \ to the program. Magically, the line of input comes into the program the top\
    \ of the while loop, makes its way (magically, again) to the print statement and\
    \ gets printed\n\nNow, if a selection of lines is fed to this program, they will\
    \ get printed one after the other (remember: the print statement is within a loop,\
    \ so the code keeps executing while some condition is true). In this case, the\
    \ program keeps going while there are input lines to process. To get lines into\
    \ the program, pass them from the keyboard (the hard way), or from a file (the\
    \ easy way).\n\nUse the vi editor to create a file containing the Perl code as\
    \ shown above. For a better name (and a distinct lack of imagination), let us\
    \ call this program first. At the Linux command prompt, enter the following command\
    \ to test the program's functionality:\n\n```\nperl /etc/passwd\n```\n\nThe program\
    \ should print each line from the /etc/passwd system to the screen, one line at\
    \ a time, until it runs out of lines.\n\nIf something other than the content of\
    \ the file appears, check to see if the Perl code has been typed in correctly.\
    \ You can ask Perl to check code for syntax errors using the -c command line switch.\
    \ That is, typing perl -c first will check the first program for errors, but not\
    \ run it.\n\n> Borrowed shamelessly from Chapter 2 of Nigel Chapman's book: Perl:\
    \ The Programmer's Companion. See the Print Resources section at the end of this\
    \ chapter."
  merge: -1
  pgno: 19
- img_proc: true
  md: "# Perl's Default Behaviour\n\nSo, this program will run, by default, the filename\
    \ from the command-line as standard input to the program. Perl finds the file,\
    \ opens it, keeps reading from the file one line at a time until there are no\
    \ more lines to read, then closes the file when the program ends. Again, all this\
    \ behaviour happens by default.\nas if that were not enough, the program actually\
    \ does more. If it is provided with more than one filename on the command-line,\
    \ again as follows:\n\n```\nperl first /etc/passwd /etc/.bash_profile\n```\n\n\
    it not only prints the lines from /etc/passwd but, when it is done, moves onto\
    \ /etc/inittab and prints all the lines in that file, before moving onto /.bash_profile\
    \ and printing any lines contained therein. Again, this occurs by default.\nA\
    \ good question to ask at this point is: while the program is running, where does\
    \ Perl put the line that it reads with <> and then prints out with? We can answer\
    \ this question after introducing another bit of Perl strangeness: the default\
    \ variable.\n\n# 1.1.2 Perl's default variable\n\nMeet the default variable $$,\
    \ the most used and abused variable in all of Perl.\nThe rule-of-thumb is: if\
    \ a piece of Perl expects to be used and is not provided, 9 out of 10 pieces of\
    \ code will use $$.\nThis is exactly what happens with <> and print in the first\
    \ program. The code could have been written as:\n\n```\n#!/usr/bin/perl -w\n\n\
    while ($_ = <>) {\n    print $_;\n}\n```\n\nTo re-emphasize, this code is functionally\
    \ identical to the first program (somewhat more explicit).\n\n# 1.1.3 The strange\
    \ first line explained\n\nAll that remains of the first program is an explanation\
    \ of the strange # line. This line is doing two things. As the # symbol in Perl\
    \ indicates the start of a comment that extends to the end of the line, the strange\
    \ line is, first and foremost, a comment that is ignored by the Perl interpreter.\
    \ Secondly, if the very first character of a file is # followed by a !, then the\
    \ line takes special meaning on Linux (and Unix-like) systems. The #! combination\
    \ tells the command processor to run the command with the rest of the line (in\
    \ this)"
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 4 Meet Perl


    case, it is the /usr/bin/perl -w part), and then send the rest of the file to
    it

    as standard input. So, make the first program executable on Linux using

    following command:


    ```

    chmod +x first

    ```


    and then invoke the program as follows:


    ```

    ./first /etc/passwd /etc/inittab .bash_profile

    ```


    Linux will find the Perl interpreter (rather conveniently called perl1) located
    in the

    /usr/bin directory and run the contents of the first file through it. This is
    a

    col feature of Linux (and UNIX), but of lesser importance if running on Mac OS

    (prior to X) or of the Windows varieties.

    The part of Perl command is a switch asking Perl to compile the code

    with extra warnings. Until you know what you are doing, the advice is to

    always run Perl with the -w switch.

    Oh, by the way (in case you haven''t noticed), Perl statements end with the;

    character, and blocks of code are enclosed in curly braces, { and }. Note, that

