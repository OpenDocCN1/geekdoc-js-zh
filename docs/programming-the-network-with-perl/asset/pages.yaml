  md: "# What's Up? 255\n\nTo improve upon this, a small subroutine (called snmp_connect)\
    \ creates the Net::SNMP object and then attempts to retrieve one data item from\
    \ the MIB-II system group. If the request is successful, the subroutine returns\
    \ the Net ::SNMP object, otherwise undef is returned. Here is the snmp_connect\
    \ source code:\n\n```\nuse OIDs.pm qw(sysDescr);\n.\nnsub snmp_connect {\n   \
    \ return undef unless $#_ == 3;\n\n    my $try = Net::SNMP->session(\n       \
    \ -hostname => shift,\n        -community => shift,\n        -version => shift,\n\
    \        -port => shift\n    );\n    my $responsePDU = $try->get_request(sysDescr);\n\
    \    return ( !defined($responsePDU) ) ? undef : $try;\n}\n```\n\nNote this subroutine\
    \ receives four parameters: the IP address or name of the Managed Device, the\
    \ community string; the SNMP version; and the SNMP protocol port-number. If any\
    \ other than four parameters are received, the code exits early and returns undef.\
    \ After creating the Net::SNMP object, the subroutine attempts to retrieve the\
    \ value of the sysDescr OID. The inclusion of this OID in the import-list for\
    \ the OIDs.pm module at the top of the page. The last line of code in the subroutine\
    \ checks the response from the Managed Device and returns undef or the Net ::SNMP\
    \ object, based on whether or not the response was defined.\n\nAs the use of this\
    \ provides an added layer of robustness to programs it will be used for the remainder\
    \ of this chapter. Rather than invoking the session method directly, the snmp_connect\
    \ subroutine is invoked instead.\n\nAssuming the existence of scalars for the\
    \ four required parameters, the standard idiom is:\n\n```\nmy $snmp_session =\
    \ snmp_connect($snmp_host, $snmp_community, $snmp_version, $snmp_port);\n```\n\
    \n```\nif ( !defined($snmp_session) ) {\n    die \"Whoops: an error occurred:\
    \ cannot establish session.\\n\";\n}\n```"
