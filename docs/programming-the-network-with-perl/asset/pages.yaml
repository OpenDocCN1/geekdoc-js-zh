  md: "# The Concurrent Syntax Checker\n\n```\nsub zombie_reaper {\n    while ( waitpid(-1,\
    \ WNOHANG) > 0 )\n    }\n    $SIG(CHLD) = \\&zombie_reaper;\n```\n\n```\n$SIG(CHLD)\
    \ = \\&zombie_reaper;\n```\n\nAn additional subroutine, continue_as_child, is\
    \ then defined. This subroutine is called by the child process after a successful\
    \ fork. The subroutine takes two parameters: the sockethandle to communicate on\
    \ and the socket address of the connected client. The actual code is an exact\
    \ copy of the client sockethandle processing code from auto-flushing switched\
    \ on, the child process receives the filename and its contents, a command-line\
    \ is then constructed, the server calls the Perl interpreter to syntax check the\
    \ received file (using the just-built command-line). Any all messages from the\
    \ Perl interpreter are returned to the connected client. When processing is complete,\
    \ the sockethandle is closed and the local file is removed from the server's disk\
    \ storage:\n\n```\nsub continue_as_child {\n    my $handle = shift;\n    my $from_who_client\
    \ = shift;\n    my $data = '';\n    my $previous = select $handle;\n    $| = 1;\n\
    \    select $previous;\n    my $tmp_fn = <$handle>;\n    chomp($tmp_fn = (split\
    \ /\\/, $tmp_fn)[-1]);\n    while (my $chunk = <$handle>) {\n        $data = $data\
    \ . $chunk;\n    }\n    open FILECHECK, \">$tmp_fn\";\n    print FILECHECK $data;\n\
    \    close FILECHECK;\n    my $cmd = \"perl -c $tmp_fn 2>&1>/dev/null\";\n   \
    \ my ($the_port, $the_ip) = sockaddr_in($from_who_client);\n    my $remote_name\
    \ = gethostbyaddr($the_ip, AF_INET) \n    || inet_ntoa($the_ip);\n```"
