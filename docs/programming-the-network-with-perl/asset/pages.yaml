  md: '# 1.2.3 Hashes


    The third Perl variable container is the hash, more formally known as the associative
    array. Hashes are somewhat like arrays, in that they hold a collection of scalar
    somethings. However, whereas arrays are indexed using numeric values, hashes are
    indexed using string values (which are also called ''keys'' or ''names''). Each
    string value index has associated with it a scalar value. These associations are
    often referred to as name/value pairs.


    Hashes in Perl are prefixed with a % character. Here is a hash which will hold
    data on the maximum frame size for a collection of popular networking technologies:


    ```

    $net_mtus;

    ```


    To refer to the entire hash, use the % prefixed name. To refer to an individual
    element, prefix the hash name with the $ character (just when referring to individual
    array elements). Here is how to add an element (which is referred to as a ''hash
    entry'') into the newly created hash:


    ```

    $net_mtus(''Ethernet'') = 1500;

    ```


    The name (or key) is the word Ethernet and has the value 1500 associated with
    it. Lists can be used to initialize a hash:


    ```

    $net_mtus = ( ''Token-Ring'', 4464, 1500, ''PPP'', ''ATM'', 53 );

    ```


    The list (which has an even number of elements) is taken to contain a set of name/value
    pairs. Note that this line code refers to the entire hash using the % prefix.
    This is shorthand for the following functionally identical code:


    ```

    $net_mtus(''Token-Ring'') = 4464;

    $net_mtus(''PPP'') = 1500;

    $net_mtus(''ATM'') = 53;

    ```


    Another version of this code takes advantage of the Perl feature which aliases
    the => symbol with the comma. Additional (entirely optional) whitespace adds to
    the readability of this, and helps to highlight the name/value pairs:


    ```

    $net_mtus = ( ''Token-Ring'' => 4464,

    ''PPP'' => 1500,

    ''ATM'' => 53 );

    ```


    It is often useful to think of => means ''the value'' when working with hashes.


    Of note here is, like arrays, hashes grow dynamically and automatically in Perl.
    Also important is the fact that hash keys are (and must be) unique⁴.


    > ⁴The same restriction applies to array indices, although there be much less
    fuss made of this fact.'
