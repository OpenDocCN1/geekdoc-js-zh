  md: '# 2

    Snooping


    In order to program the network with any degree of certainty, a mechanism is required
    to check that the data sent is the data received. Most programmers are already
    familiar with using interactive debuggers to monitor and inspect their programs.
    What is needed is an equivalent technology for network communications.


    In this chapter, Perl is used to develop a series of network analysis tools. The
    simple, yet powerful, tools can be used to debug network communications on Ethernet
    networks.


    Such are known by a number of names: analyser, sniffer, peeker, traffic monitor
    and (of course) snooper.


    Writing a network analyzer from scratch is not easy. Luckily, Perl''s CPAN repository
    provides a series of modules that provide a high-level programming interface to
    the libpcap library, which was initially developed by the Network Research Group
    at Berkeley National Laboratory. This library is a system-independent programming
    interface (written in C) that provides for Ethernet packet capturing.


    Most Linux distributions include the libpcap library. Check to see if it is installed
    on a Linux system with the following command:


    ```

    find -name libpcap* -print 2> /dev/null

    ```


    If this command finds nothing, the library is not installed and it needs to be
    downloaded from the Internet. See the Web Resources section at the end of this
    chapter for details.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 2.1 Thank You, Tim Potter


    CPAN contains a series of modules, developed by Tim Potter1, that can be used
    to build a network analyser. These are as follows.:


    **NetPacket:**- a collection of modules that can assemble/disassemble a number
    of popular network protocols (most notably, the popular Internet protocols).


    **Net::Pcap**- a Perl interface to the libpcap library.


    **Net::PcapUtil**- a small set of utilities designed to make the Net::::Pcap module
    convenient.


    At the time of writing, the versions of these modules are 0.03 for NetPacket::*,
    0.04 for Net::Pcap and 01 for Net::PcapUtil. In addition to the ability to encode
    packets in each of the protocol types, the NetPacket modules can decode packets,
    which is the exact functionality required when writing a network analyser.

    The NetPacket::* collection includes modules for working with Ethernet frames,
    ARP packets, IP addresses (including ICMP and IGMP datagrams), UDP datagrams and
    TCP segments.


    When studying computer networking, it is useful to have the discussion structured
    around the layered reference model. The classic model is the Open Systems Interconnect
    seven-layer model from the International Standards Organization, commonly referred
    to as the OSI-RM. The model employed by the standard Internet technologies - the
    TCP/IP-RM - is replacing the OSI-RM as basis of study (with no small part to the
    fact that the majority of the world''s computer networks now run TCP/IP). The
    TCP/IP-RM is simpler than the OSI-RM, and has four layers, structured (from top
    to bottom) as:


    +   **Application** - protocols for providing application-level services to user
    programs (also referred to as ''user-agents''). An example program is a Web browser,
    which implements the Hyper-Text Transfer Protocol (HTTP).


    +   **Transport** - protocols for providing end-to-end data transportation services
    to application protocols. With TCP/IP networks, two transport protocols exist:
    the Transmission Control Protocol (TCP) for providing connection-oriented, reliable
    service, and the User Datagram Protocol (UDP) for providing connectionless, unreliable
    service.


    +   **Network** - protocols for moving data from host to host and from network
    to network. The Internet Protocol (IP) provides this service for TCP/IP networks.
    Additional protocols provide support for primitive network management (using ICMP,
    the Internet Control Message Protocol) and network multicasting (using IGMP, the
    Internet Group Management Protocol).'
  merge: -1
