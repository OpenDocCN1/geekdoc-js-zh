    \ (which are all optional). This subroutine, called get_resource, must specify\
    \ the HTTP object to send the request to (the required parameter) as well as the\
    \ following four optional parameters.\n\nMETHOD - the HTTP method to use. The\
    \ default is GET.\n\nRESOURCE - the name of the HTTP resource to request. The\
    \ default is /index html.\n\nCTYPE - the server to specify on the Host line. The\
    \ default is localhost.\n\nWith such a subroutine to the code, it is possible\
    \ to call the subroutine twice, as to request index.html and apache_pb.gif from\
    \ the Web server:\n\n```\nget_resource($http_obj, CTYPE => 'Keep-Alive');\nget_resource($http_obj,\
    \ RESOURCE => '/apache_pb.gif');\n```\n\nNote how the code explicitly asks for\
    \ persistence with the first invocation, even though this is HTTP/1.1's default.\
    \ However, it is not the default for get_resource.\nHere is a first attempt at\
    \ the get_resource_subroutine:\n\n```\nsub get_resource {\n    my $http_obj =\
    \ shift;\n    my $params = @_;\n\n    my $http_method = $params{METHOD} || 'GET';\n\
    \    my $http_page = $params{RESOURCE} || '/index.html';\n    my $connect_type\
    \ = $params{CTYPE} || 'Close';\n    my $http_server = $params{SERVER} || 'localhost';\n\
    \n    my $http_request = \"\\$http_method \\$http_page HTTP/1.1\\$CRLF\";\n  \
    \                     \"Host: \\$http_server\\$CRLF\";\n                     \
    \  \"Connection: \\$connect_type\\$CRLF\";\n                       \"\\$CRLF\"\
    ;\n```\n\n```\nprint $http_request;\nwhile ($line = <$http_obj>) {\n    $line\
