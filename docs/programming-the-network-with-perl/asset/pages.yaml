    # 6.4 Perl Agents


    The application of Perl to the development of mobile-agent technologies has, unfortunately,
    not produced a great wealth of activity (as compared with the other networking
    technologies discussed in the rest of Programming the Network with Perl). Despite
    this fact, the area has its pioneers. One such pioneer is Steve Purkis, who, as
    an undergraduate at Carleton University in Canada, developed the Agent.pm module.
    An unished, proof-of-concept technology, Agent.pm can nevertheless be used to
    develop working mobile agents in Perl.


    # 6.4.1 Preparing Perl for mobile agents


    To use Class::Tom module needs to be installed. Class::Tom, which can be used
    to transfer an object from one network to another, expects to find Crypt::MD5,
    Data::Dumper, UNIVERSAL and MIME::Base64 installed. For readers working through
    this book, these modules should already be installed, as they come as standard
    with Perl 5.6 or were needed in an earlier chapter. If this is not the case (that
    is, one or more of them is not installed), visit the nearest CPAN, then download
    and install whichever modules are missing.


    Note that there are multiple versions of Class::Tom on CPAN. To work with Agent.pm,
    version 2.04 should be installed, not the more recent version of the module (which
    is 3.02).


    After downloading version 2.04 of Class::Tom, use these commands to install the
    module into Perl and test that the installation was successful:


    ```

    gunzip Class-Tom-2.04.tar.gz

    tar xvf Class-Tom-2.04.tar

    cd Class-Tom-2.04

    perl Makefile.PL

    make

    make test

    make install

    ctrl-D

    man Class::Tom

    perl -e ''use Class::Tom''

    ```


    In addition to Class::Tom and any prerequisites it may have, Agent.pm requires
    the IO::Socket module, which is standard with the Perl 5.6 distribution.

    To install and test the most recent version of Agent.pm, download the module from
    CPAN and use these commands:


    ```

    gunzip Agent-3.20.tar.gz

    tar xvf Agent-3.20.tar

    cd Agent-3.20

    ```'
