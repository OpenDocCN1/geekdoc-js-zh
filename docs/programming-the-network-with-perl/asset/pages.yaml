    # 5.16 Web Resources


    Find the RFCs referenced in this chapter at the http://www.ietf.org website.


    The Internet Control Message Protocol is documented in the following RFCs.


    +   * RFC 792 – the official standard for ICMP.


    +   * RFC 1256 – a description of the ICMP Router Discovery Messages.


    There is a vast array of RFC documents relating to network management. What follows
