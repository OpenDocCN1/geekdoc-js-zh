  md: '# HTTP Status Codes


    The Status-Line is made up of three parts as follows.


    **Version** - the HTTP-Version understood by the responding server.


    **Code** - the HTTP Status-Code returned as a result of the server voicing (or
    attempting to service) the client''s request.


    **Text** - the HTTP Response-Phrase associated with the response code (and designed
    to be read by a human, not a machine).


    The codes, which are all three digits in length, are categorized by the following
    number ranges.


    +   **100-199** - indicates informational messages. The server is informing the
    client that the request has been received and some further action is progressing.


    +   **200-299** - indicates success. The request has been received, the required
    service has been performed, and the server is sending any results to the client.


    +   **300-399** - are redirection messages. Further activity on the part of the
    client is required to complete the request.


    +   **400-499** - indicates a client error. The server is stating that the client
    did something wrong and that request cannot be processed until the client corrects
    the problem.


    +   **500-599** - indicates a server error. What would otherwise be considered
    to be a valid request from a client has resulted in a server error.


    Only a handful of codes from each number-range are allocated in the HTTP standard.
    As HTTP/1.1 is designed to be easily extensible, the numbers are much larger than
    they need to be in order to support the addition of codes by extension techniques.
    Further invocations of the original *wwb* illustrate the use of a selection of
    these codes.


    Here is a request to retrieve the homepage from Linux Journal magazine''s website:


    ```

    /wwb GET //www.linuxjournal.com

    ```


    which results in this response from the server:


    ```

    HTTP/1.1 302 Found

    Date: Thu, 13 Apr 2001 14:58:23 GMT

    Server: Apache/1.3.14 (Unix) PHP/4.0.4pl1

    mod_ssi/2.7.1 OpenSSL/0.9.6 MySQL/2.20

    Location: http://www.linuxjournal.com/index.html

    Connection: close

    Content-Type: text/html; charset=iso-8859-1


    <!DOCTYPE PUBLIC "-//IETF//DTD HTML 2.0//EN">

    ```'
