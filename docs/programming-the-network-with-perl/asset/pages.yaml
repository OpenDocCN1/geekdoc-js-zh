    # 4.12 Other Networking Add-On Modules


    The Perl community has its fair share of talented programmers, and some of them
    have been hard at writing networking add-modules for the language. In addition
    to the add-modules already discussed in Programming the Network with Perl, CPAN
    contains a large and growing collection of interesting modules. One final example
    presents a small program written to take advantage of the Net::Telnet module developed
    by Jay Rogers.


    As the name suggests, Net::Telnet provides a mechanism to communicate with remote
    systems using the standard TELNET protocol, defined in RFC 854. Rather than requiring
    the user to interactively operate some terminal software, Net::Telnet allows the
    programmer to program (or script) the active session.


    # 4.12.1 Net::Telnet


    Download the module from CPAN then issue the following commands at the command-line
    to install and test Net::Telnet:


    ```

    gunzip Net-Telnet-3.02.tar.gz

    tar xvf Net-Telnet-3.02.tar

    cd Net-Telnet-3.02

    perl Makefile.PL

    make

    test

    ```


