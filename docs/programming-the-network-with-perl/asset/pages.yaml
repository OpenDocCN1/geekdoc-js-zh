  md: "# Transport Snoopers 71\n\n```\nuse strict;\nuse Net::PcapUtils;\nuse NetPacket::Ethernet\
    \ qw( :strip );\nuse NetPacket::IP qw( :strip );\nuse NetPacket::TCP;\n```\n\n\
    With got_a_packet, extract the TCP segment as follows:\n\n```\n$my $tcp_segment\
    \ = NetPacket::TCP->decode(\n  NetPacket::IP::ip_strip(\n    NetPacket::Ethernet::eth_strip($packet)\
    \ )) );\n```\n\nThe call to the decode subroutine returns a TCP object (which\
    \ is called $tcp_segment in this code) provides access to the instance data associated\
    \ with the TCP segment. To get the TCP segment, the code takes the Ethernet frame,\
    \ strips off the headers, leaving the IP datagram. The call to ip_strip removes\
    \ the IP headers from the datagram and passes the payload to the TCP decode subroutine.\n\
    \nWhen opening the NIC, request a filter on TCP segments:\n\n```\n$my $pkt_descriptor\
    \ = Net::PcapUtils::open(\n  FILTER => 'tcp',\n  SNAPLEN => 1500\n);\n```\n\n\
    With UDP data capturing, the code sets SNAPLEN to 1500 to ensure the entire Ethernet\
    \ frame (header and data) is captured.\n\nFigure 2.2 (on p. 60) shows EtherSnooper\
    \ 'stripping' as it relates to the layers of the network's 'stack'. Successive\
    \ calls to each layer's strip subroutine, a snooping program (running in its NIC\
    \ in promiscuous mode) can eventually determine the data created by the sending\
    \ user-agent. The program can then do with the data whatever it pleases. It is\
    \ important to realize that neither the sending nor receiving user-agent has any\
    \ knowledge that snooping has occurred. The snooper simply takes a copy of the\
    \ data transmitted on the wire.\n\n# 2.5.3 The TCP and UDP gotcha!\n\nWhen snooping\
    \ UDP and TCP traffic above, the code filtered on the protocol of interest when\
    \ invoking Net::PcapUtils::open. This has the effect of ensuring that when the\
    \ 'protocol packet' (either a UDP datagram or TCP segment) makes it as far as\
    \ the got_a_packet subroutine, the code can invoke the correct decode subroutine,\
    \ because it already knows the 'type' of packet to expect.\n\nHowever, when it\
    \ comes to UDP, this does not guarantee that an entire UDP datagram is decoded.\
    \ The reason for this is to the way UDP datagrams are created and handled by the\
    \ network."
