  md: '230 Management


    As there was a pressing need for some of standard network management technology,
    and as no one was willing to wait for the release of the first version of CMIP,
    the first version of SNMP (SNMP1) was quickly deployed. Due to its widespread
    adoption, SNMP1 became the de facto standard for network management. Later, a
    very protracted process produced SNMP2, which added much functionality to the
    protocol. This included a more efficient transfer mechanism as well as additional
    SNMP operations. With the release of SNMP2 and its widespread adoption, hopes
    of ''migrating'' SNMP1 users to the new CMIP standard were met; SNMP as an all-encompassing
    management technology had lost the battle, though in some market segments (on
    computer networks and the Internet, SNMP rules.


    SNMP3 (the most recent standard) added security features to the technology, which
    were missing or incomplete in the previous versions of the technology primarily
    - it seems - no one on the working group could agree on how security should be
    handled. The various SNMP authors fought about security ages, all rather huffy,
    then decided not to include security mechanisms in SNMP2 at all!


    # 5.6 The SNMP Management Framework


    SNMP is only one component of the four-part SNMP Management Framework. The four
    components are as follows.


    **Managed device** - a network device capable of being managed (referred to as
    a *Managed Agent* within the standards documents), and which can respond to requests
    for management information from another network device.


    **Management station** - a network device capable of sending requests for management
    information to a Managed Device and interpreting any responses. The *Management
    Station* is often referred to as a *Network Management System (NMS)*


    **Managed data** - a collection of management data items associated with a particular
    *Managed Device*, referred to as a *Management Information Base (MIB)* within
    the standards documents.


    **Communication protocol** - a standard mechanism for sending requests and responses
    to and from the *Management Station* and many *Managed Devices*. This is the role
    of SNMP.


    On closer inspection, *Managed Device* conforms to the description of a *Server*
    from Chapter 3, and that is what it is: a server capable of responding to requests


