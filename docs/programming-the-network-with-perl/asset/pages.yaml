  md: "# 2.5.1 Preparing to snoop UDP\n\nThe fields associated with the UDP datagram,\
    \ as defined in NetPacket::UDP, are shown in Figure 2.4 on p. 72. To process UDP\
    \ datagrams, start the program as follows:\n\n```\n#! /usr/bin/perl -w\n\nuse\
    \ 5.0;\n\nuse strict;\nuse Net::PcapUtils;\nuse NetPacket::Ethernet qw( strip);\n\
    use NetPacket::IP qw( strip);\nuse NetPacket::UDP;\n```\n\nWithin got_a_datagram,\
    \ extract the UDP datagram as follows:\n\n```\n$udp_datagram = NetPacket::UDP->decode(\n\
    NetPacket::IP::ip_strip(\nNetPacket::Ethernet::eth_strip($packet)\n );\n```\n\n\
    The call to the decode subroutine returns a UDP object (which is called $udp_datagram\
    \ in this code) which provides access to the instance data associated with the\
    \ UDP datagram. To get the UDP datagram, the code takes the Ethernet frame, strips\
    \ off the Ethernet header, leaving the IP datagram. The call to ip_strip removes\
    \ the IP headers from the datagram and passes the payload to it, UDP decode subroutine.\n\
    \nWhen opening the NIC, request a filter on UDP datagrams:\n\n```\n$pkt_descriptor\
    \ = Net::PcapUtils::open(\nFILTER => 'udp',\nSNAPLEN => 1500\n);\n```\n\nThe call\
    \ to Net::PcapUtils::open specifies that the SNAPLEN parameter should be set to\
    \ 1500, the maximum frame size for Ethernet. The snooper is interested in getting\
    \ the data contained in the frame, so it captures all of it, as opposed to only\
    \ capturing the first 100 bytes (which would only capture some of the header information).\n\
    \n# 2.5.2 Preparing to snoop TCP\n\nTo process TCP segments (refer Figure 2.5\
    \ on p. 72), start the program as follows:\n\n```\n#! /usr/bin/perl -w\n\nuse\
    \ 5.0.\n```"
