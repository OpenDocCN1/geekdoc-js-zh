    # 1.8.3 The joy of CPAN


    The module and object creation technology in Perl is useful. So useful, in fact,
    that a large collection of third-party add-on modules have been developed for
    use with Perl. Some are part of the Perl distribution. These are the standard
    modules. Others are not part of the standard distribution, but are instead made
    freely available on a central website to anyone with a use for them. This central
    repository¹ is the Comprehensive Perl Archive Network.


    CPAN is a truly wonderful place (if you are a Perl programmer, that is). It is
    a large software repository of reusable Perl modules, the object-oriented and
    functional kind. On CPAN, the modules are organized by category, and cover every
    conceivable programming activity, from working with database systems to processing
    digital images. Of particular interest are the modules which provide support to
    the network programmer.


    In addition to the standard networking modules (which come with Perl), a growing
    collection of third-party networking modules can be found in the following CPAN
    categories.


    +   - Networking, Device Control and Inter-process Communication.

    - Authentication, Security and Encryption.

    - World Wide Web, HTML, HTTP, CIME and MIME.

    - Server and Uset News.


    When creating modules for use with Perl, one simple rule needs to be adhered to
    *do not reinvent the wheel, check CPAN!* If the exact module does not already
    exist, take a copy of the close match, make perform the required way, resubmit
    the newly modified module back to CPAN. The entire Perl community benefits as
    a result of this practice.


    Throughout *Networking with Perl*, numerous third-party modules from CPAN are
    used. Installation instructions are supplied for each third-party module employed.
    Refer to the *Web Resources* section at the end of this chapter for more information
    on the CPAN website.


    ¹Which is actually mirrored extensively on the Internet.'
