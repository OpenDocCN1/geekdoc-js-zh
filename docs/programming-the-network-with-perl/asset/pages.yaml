    Which, admittedly looks a little complicated. However, it is relatively easy to
    decipher. The first thing to note is that the Net::SNMP module works with numeric
    OIDs (like 1.3.6.1.2.1.7-1.0), as opposed to human-friendly mnemonics (udpDatagrams).
    So, all the values to the left of the => symbol are numeric OIDs. This means that
    the ''UDP instance values'' lines of output correspond to the counts for udpDatagrams,
    udpNoPorts, and udpOutputDatagrams. It is also reasonable to assume that the device
    in question has been operating for some time. As will be seen later in this chapter,
    it is possible to ask the device how it is running in the current state.


    The ''UDP table values'' code makes the OIDs look strange, as they appear contain
    embedded OIDs, specifically 149.153.1.253, 149.153.2.253 and 149.153.100.253.
    The trailing indices add to the confusion.


    Recall from earlier that the instance specifying mechanism used with tables from
    using a single OID, appending ''. to the OID to retrieve the value, with some
    other value is appended. Typically, this is how to uniquely identify the row in
    the multi-column table. For the MIB-II group, the combination of an IP address
    and a protocol port is used, and this combination is appended to the base OID.
    With UDP, the base numeric OIDs are 1.3.6.1.2.1.7-5.1.1 for udpLocalAddress and
    1.3.6.1.2.1.7-5.1.2 for udpLocalPort. It is now possible to work out that this
    device currently has how UDP listeners listeners active, as follows:


