  md: '# # Appendix A

    Essential Linux Commands


    To learn more about a particular command, view the manual page associated with
    it - simply type man followed by the name of the command you want to learn. To
    exit from a manual page, press the q key (where ''q'' stands for ''quit''). Most
    commands have options associated with them - do not try to guess the options.
    Read the manual page!


    # ## Working with Files and Directories


    +   - cat | type a file to the screen

    - cd | change directory (or return to %HOME)

    - chmod | change the mode of a file (e.g., to make executable)

    - chown | change the owner of a file or directory

    - cp | copy a file/directory to a new location

    - find | search for a file on the system (see ''locate'')

    - ftp | transfer file from one system to another

    - grep | search for a text string in a group of files

    - gzip/gunzip | compress/uncompress a file or group of files

    - head | display the first lines of a file on the screen

    - ispell | spell-check a file using the system dictionary

    - less | type a file to the screenfull at a time

    - locate | locate a specific file on the system (see ''find'')

    - ln | create a symbolic link (alias/shortcut) to a file

    - ls | list the contents of a directory to the screen

    - mkdir | create a new directory

    - mv | move or rename a currently existing file/directory'
  merge: -1
