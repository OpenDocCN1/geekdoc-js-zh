  md: '# 3.5 Simple UDP Clients and Servers


    It is now time to build some simple custom network applications.

    The specification for the first UDP client and server is straightforward. The
    server will wait for a client to send data to it at a predetermined protocol port-number.
    When data arrives on the port, the server prints the received data on the screen,
    and returns to a waiting status. No acknowledgment of successful receipt is sent
    to the client. The server repeats this behaviour until terminated by the operating
    system (which can be accomplished interactively on Linux by pressing Ctrl-C).

    The client, when invoked, will send a string to the server at a predetermined
    protocol port-number, then exit. The client does not concern itself with whether
    or not the data arrives. Note that the client does not check if the server is
    up and operating prior to sending data. Remember, this as a transport service
    it is one shot, best effort and unreliable.


    # 3.5.1 Testing with localhost


    When developing custom network applications, it is often inappropriate to build
    and test the application on a live network, for the same reasons that it is inappropriate
    to build and test a new-networked application on a production system. Within TCP/IP
    networks, a hostname/IP combination is reserved for testing new applications.
    The IP address is 127.0.0.1 and the hostname is localhost. When used by network
    applications, either of these arrange for network-bound traffic to loopback within
    a networked device, which has the effect of keeping the traffic off the live network.
    It is therefore possible to execute the client and server parts of the custom
    network application on the same network device while they are being developed,
    then, their behaviour is deemed acceptable, move the parts to deployment hosts.

    When using Linux, it is convenient within the X Window System environment to open
    two terminal windows (called xterms), one for the client and another for the server.
    If the X Window environment is not running, use two virtual consoles to achieve
    the same result. Using the Alt key in combination with the < - or -> key moves
    from one virtual console to the next.


    # 3.5.2 The first UDP server


    The code for the server starts as follows:


    ```

    #! /usr/bin/perl -w


    use strict;

    use Socket;

    ```'
