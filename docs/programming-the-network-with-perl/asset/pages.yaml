  md: '# Management


    **get-next-request** – when requesting a collection of data items (which may be
    stored within a table), the value of the first instance of the OID is requested
    with get-request (or an error code if things went wrong). Subsequent values (that
    is, all other instances) are requested by iteration and the use of get-next-request.


    **set-request** – sends a request to a *Managed Device* to set the value associated
    with a specified OID.


    The *Managed Device* messages are as follows.


    **get-response** – is sent in response to a get-request, get-next-request and
    set-request message. For get operations, the response will contain the value requested
    (or an error code if things went wrong). For set operations, the response will
    indicate success or failure.


    **trap** – is an unsolicited message from the *Managed Device* to the *Management
    Station*. This is generated by the occurrence of some activity that the *Management
    Station* may want to know when the amount of discarded IP datagrams reaches a
    certain threshold. Rather than poll the *Managed Device* by iterating with a **get-request**
    message, a **trap** can be set to tell the *Managed Device* to monitor the trap
    and generate the trap appropriately. Of course, to receive the trap, the *Management
    Station* needs to be listening.


    The advent of SNMPv2¹ introduced two additional protocol messages and replaced
    another as follows.


    **get-bulk-request** – provides a mechanism for requesting a large amount of instance
    values within a single request. This mechanism is much improved over the get-request/get-next-request
    mechanism from SNMPv1.


    **inform-request** – allows any *Management Station* to communicate with another
    *Management Station* by way of requests and responses.


    **snMPv2-trap** – replaces the trap message from SNMPv1, and improves the trapping
    mechanism by making the format of the Protocol Data Unit (PDU) compatible with
    those of the other messages.


    Unfortunately, the development and release of SNMPv2 introduced a number of problems,
    not least of which was that the new technology standards were no compatible with
    SNMPv1. This has been addressed somewhat with the release of SNMPv3 which attempts
    to coexist with both SNMPv1 and SNMPv2, as well as for the easier integration
    of future functionality. As a technology, SNMPv3 is best known for *finally* providing
    the SNMP framework with a real security mechanism.


    > ¹referred to as SNMPv2C.'
