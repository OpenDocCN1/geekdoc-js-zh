  md: '```

    my $socketvname = inet_aton($ip );

    my $socket_addr = sockaddr_in($port, $binary);

    my ( $socket_port, $socket_binary ) = sockaddr_in($socket_addr);

    my $socket_dotted_decimal = inet_ntoa($socket_binary);

    ```


    The first invocation of sockaddr_in creates a socket address from the protocol
    port-number and the packed binary address, and places the socket address into
    the $socket_addr. The second invocation of sockaddr_in takes the socket address
    and extracts the original protocol port-number (80, the well-known port for HTTP)
    and packed binary address, which is passed to $inet_ntoa to determine the original
    IP address, 127.0.0.1.


    The use of the hard-coded value 80 in the above code is discouraged, because it
    is better practice not to rely on hard-coded numerical values.


    # 3.4.3 getservbyname and getservbyport


    The Socket API provides a subroutine that allows the programmer to look up the
    correct numeric value for a well-known application service. It is far safer to
    replace:


    ```

    my $port = 80;

    ```


    with the:


    ```

    my $port = getservbyname( ''http'', ''tcp'' );

    ```


    The two parameters passed to the getservbyname subroutine specify the application
    service to look up, as well as the transport service protocol. The second parameter
    is needed, since some applications can use both UDP and TCP (for example, DNS).
    When used in list context, getservbyname returns more port information on the
    application level service. See the per function manage for additional details.


    Another subroutine is getservbyport, which takes a protocol portnumber and returns
    the service name. Like getservbyname, the behaviour of this service depends on
    whether it is called in socket or list context.


    # 3.4.4 getprotobynname and getprotobynnumber


    The need for getservbyname and getservbyport helps explain the existence of a
    few more subroutines. Rather than litter the API (and the program code that uses
    it) with numeric constants, the designers of the Socket API decided to leave the
    choice of numeric constants as an implementation detail. For example, rather than
    dictate the use of 17 as the internal identifier for the UDP protocol, code can
    determine the correct identifier to use, as follows:


    ```

    my $trans_service_id = getprotobynname( ''udp'' );

    ```'
