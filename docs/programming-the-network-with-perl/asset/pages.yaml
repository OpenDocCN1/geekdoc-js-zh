  md: '# # Appendix D

    # Sample NetDebug Results


    In this appendix, the results generated by a number of NetDebug invocations are
    presented. A brief commentary accompanies each example. Although some of the captured
    traffic is quite voluminous, it is illustrative of the amount of data typically
    transferred for all but the simplest of network interactions. Note that for each
    capture, any datagrams larger than 1500 bytes are split over a number of Ethernet
    Frames, as the underlying network is one built from this popular LAN technology.


    # ## NetDebugging Web Traffic


    The following invocation of NetDebug captures HTTP traffic, which uses the well-known
    TCP protocol port-number 80:


    ```

    /netdb -s 149.153.100.67 -p 80

    ```


    The glassnost.itcarlow.ie (149.153.100.67) Web server services a number of requests
    from mossy.itcarlow.ie (which is identified as 149.153.100.104). The vast majority
    of the traffic captured is textual (as the Web uses the text-based HTML extensively).
    The transfer of a number of binary graphic files is also captured, and these are
    identified by the ''GIF89a'' character sequence. To conserve space, only a small
    portion of each graphic file''s capture is shown.'
