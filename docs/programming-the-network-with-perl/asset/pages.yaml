    # 5.5 Not So Simple Management with SNMP


    The process of using ICMP to learn about a network is simple, and the data gleaned
    from the results produced by programs such as ping and traceroute can be very
    useful. But, what if more data are required? How does the network manager determine
    how a network device is operating? Can a router specify the contents of its internal
    routing table? Can a network device indicate when certain things have happened?
    Perhaps the network manager would like to know when a network device is processing
    an inorder of IP packets containing errors? ICMP cannot help here, as its purpose
    is solely to report on errors and data pertaining to individual IP addresses.
    Some other technology is required and, on the Internet and TCP/IP networks, this
    technology is SNMP, the Simple Network Management Protocol.


    # 5.5.1 A little SNMP history


    The process of producing a standardized framework for network management is one
    of the Internet''s greatest sagas. Initially perceived as an interim solution
    to a problem that would be solved by an all-seeing, all-knowing, all-powerful
    technical standards the ''stop-gap technology'' developed in the short term proved
    so successful that the ''ultimate solution'' struggled in the marketplace. The
    short-term solution was, of the first version of the Simple Network Management
    Protocol (SNMP) and the ultimate solution was the Common Management Information
    Protocol (CMIP), as proposed by the International Standards Organization''s Open
    Systems Interconnect (OSI) model.'
