  md: '# 3


    # Sockets


    In this chapter a series of custom network applications are built using Perl.


    The techniques used to build custom network applications have been standardized
    for quite some time. Two types of application programmer interface (API) have
    gained favour among network programmers: the *XTI API*, initially developed by
    AT&T Bell Laboratories (where it is known as TLD), and the *Socket API*, developed
    at the University of California, Berkeley. Of the two, the Socket API has the
    largest following, and has been ported to most operating systems. Consequently,
    the Socket API is the *de facto* standard.


    On the Windows platform, the Socket API is referred to as Winsock, whereas programmers
    using Mac OS (prior to X) know it as Gust. Slight platform-specific variations
    of the API exist on these non-UNIX platforms. However, the Socket API built into
    Linux matches the original API, which was initially developed on the UNIX operating
    system.


    The Socket API is designed to provide programmers with a platform-independent
    interface to the functionality of the network. By abstracting the details of the
    physical network, the API allows programmers to concentrate on the details of
    an application, as opposed to the details of a network.


    The standard distribution of Perl provides direct support for the Socket API as
    built into the underlying operating system. Two programming interfaces to the
    API exist within Perl, a functional interface and an object-oriented one. The
    functional interface is described and used first. The latter part of this chapter
    describes the object-oriented interface.


    # 3.1 Clients and Servers


    The Socket API provides support for the mechanics of network programming. Although
    this is an important aspect of network programming, programmers also'
  merge: -1
