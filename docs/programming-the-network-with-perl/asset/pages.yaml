  md: '# Management


    149.153.2.253 using port 49;

    149.153.2.253 using port 51505;

    149.153.2.253 using port 56134;

    149.153.100.253 using port 67;

    149.153.100.253 using port 161.


    Eight listeners seems like a lot for an on-campus router. However, a review of
    the IANA protocol port-number assignments (first used in Chapter 2, Snooping),
    uncovers the purpose of these UDP listeners, as follows:


    +   496 is used by the Protocol Independent Multicasting technology;

    520 is used by the on-site local router, which is a variation on the established
    Routing Information Protocol (RIP);

    1985 is used by the Hot Standby Router Protocol;

    49 is used by the TACACS Login Host Protocol;

    67 is used by the Bootstrap Protocol Server;

    161 is used by SNMP.


    Any self-respecting network manager should be able to say why these UDP listeners
    exist on this router. As for the other listeners, 51505 and 56134, they fall within
    the range of the dynamically assigned or private protocol port-numbers. What they
    are listening for is a mystery. However, that self-same network manager should
    find their existence very interesting (if not alarming) that the Management Device
    queried appeared to have more than one IP address (149.153.1.253, 149.153.2.253
    and as expected) 149.153.100.253. When one considers that routers exist to connect
    or more networks together, this strangeness is explainable. As routers have two
    or more connections, and each connection on an IP must have its own unique IP
    address, it follows that routers have more than one assigned IP address. It is
    therefore reasonable to assume that this router (149.153.100.253) has three connections
    to three identical networks, each with their own unique IP address.


    # 5.10.1 Working with mnemonic identifiers


    The Net : SNMP module also uses numeric OIDs when specifying the MIB data to access
    when getting or setting data. This is great for the computer, but quickly becomes
    tedious for the programmer. To provide for increased convenience, a Perl module
    called OIDs.pm allows OIDs to be specified using their mnemonic, programmer-friendly
    descriptor. The entire source code for this module can be found in Appendix E.'
