  md: '# 46 Snooping


    | 48 bits | 48 bits |

    | $dest_mac | $src_mac |

    | $type | $data ... |

    | 16 bits | 46 to 1500 bytes (variable) |


    Figure 2.1 The NetPacket::Ethernet frame format.


    Within a NetPacket::Ethernet object, the instance data for Ethernet frames has
    the following fields (refer to Figure 2.1 on p. 46):


    **dest_mac** - the 48 bit address for the destination host (the network device
    destined to receive the Ethernet frame);


    **src_mac** - the 48 bit address for the source host (the network device sending
    the Ethernet frame);


    **type** - the type of data being sent in the frame;


    **data** - the actual data contained in the Ethernet frame (its payload).


    The **field** is interesting, as it is used to uniquely identify the traffic carried
    within the payload of the Ethernet frame. The NetPacket::Ethernet module provides
    a small list of frame types (as Perl constants) that can be imported into a Perl
    program, as:


    ```

    use NetPacket::Ethernet qw(: types );

    ```


    Here is the list of defined constants.


    +   - **ETH_TYPE_IP** - Internet Protocol version 4 datagrams.

    - **ETH_TYPE_ARP** - Address Resolution Protocol packets.

    - **ETH_TYPE_RARP** - Reverse Address Resolution protocols.

    - **ETH_TYPE_APPLETALK** - Apple Computer''s AppleTalk packets.

    - **ETH_TYPE_SNMP** - Simple Network Management Protocol packets.

    - **ETH_TYPE_IPV6** - Internet Protocol version 6 datagrams.

    - **ETH_TYPE_PPP** - Point-To-Point Protocol packets.


    Compared with the other list of Ethernet frame types, this is a very small subset
    (see the **Web Resources** section at the end of this chapter on how to obtain
    the complete list).


    To work with other frame types, simply define more Perl constants at the top of
    a program. As the constants are something that will be used in a number of programs,
    it is worthwhile creating a small Perl module to hold them:


    > 3Although Ethernet technology rarely cares about the type of traffic being carried.'
