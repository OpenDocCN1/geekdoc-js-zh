  md: '# 5


    # Management


    The last two chapters were concerned with programming the network. This chapter
    is concerned with another important topic: network management.


    Programming the Network with Perl has already included an entire chapter on some
    aspects of network management. Chapter 2, Snooping, described how to build a network
    debugger in Perl. The ability to capture and analyse traffic on a network is of
    critical importance to the network manager when all other techniques have failed,
    and such tools can provide the vital clue which often results in the successful
    resolution of a problem. Recall from Chapter 2 how the snooper identified a broadcast
    storm occurring as a result of a large collection of misconfigured workstations.
    As this chapter will show, there is a lot more to network management than using
    snoopers.


    The management of networks is a complex and difficult activity. One needs only
    consider the vast array of equipment connected to modern networks to develop an
    appreciation of what is involved. Typically, there is a large collection of devices:
    personal computers, workstations, repeaters, hubs, switches, routers, scanners,
    wireless base-stations, uninterrupted power supplies, and so on. It is very rare
    that every single piece of equipment on a network is built and supplied by one
    equipment manufacturer¹, relying on a single vendor''s network management technology
    is rarely a viable solution, especially when the network is a heterogeneous mix.
    Centrally managing the Internet is all impossible.


    Dealing with the diverse composition of computer networks is accomplished in general
    by the widespread adoption and adherence to standards. This is especially important
    when it comes to network management. On TCP/IP networks, two protocols provide
    support for managing networks: the Internet Control Message Protocol (ICMP) and
    the Simple Network Management Protocol (SNMP).


    ¹If you know of such a network, email the author.'
  merge: -1
  pgno: 238
