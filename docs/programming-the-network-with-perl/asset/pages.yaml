    The extra code prints out the Ethernet frame type value in HEX, then indicates
    (to the right of the) agree with IP, how many frames of type were captured. HEX
    800 is the Ethernet frame for IP, and HEX 806 corresponds to ARP, and these totals
    match. But, look at all other frame types! A quick look at the IANA Ethernet frame
    type file does not solve this puzzle, as none of these frame type values match
    an assigned type in the file.


    It turns out that the values are not Ethernet frame types at all, but are instead
    IEEE 802.3 lengths. Ethernet hardware can carry frames with different frame formats.
    When used by technology generates Ethernet II (or DIX) frames, the bytes in the
    header that follow the 48 bit destination and source addresses correspond to the
    Ethernet frame type value. When used by technology generates Ethernet frames on
    the IEEE 802.3 standards, the two bytes correspond to the length of the frame.
    It just so that the network used during the development of Programming the Network
    with Perl can carry one Ethernet frame format: Ethernet frames (which carry mostly
    TCP/IP traffic) and the IEEE 802.3 frame format (which is used by Novell NetWare.


    Having agreed to disagree on the format of Ethernet frames, the Ethernet II and
    IEEE 802.3 standards developers agreed (thankfully) that no Ethernet II frame
    type would have a value less than HEX 05DC (which is decimal 1500). So, when a
    snooper sees a frame less than 1501, it is OK to assume that the frame is formatted
    as a variation of the IEEE 802.3 format, and that the frame type value is actually
    a length value.'
