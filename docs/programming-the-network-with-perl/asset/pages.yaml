- img_proc: true
  md: '104 Sockets


    head. Connections need to be established before communication can occur, and this
    can be time consuming. Once established, the connection needs to be constantly
    monitored to ensure it is performing as required, i.e. in a reliable manner. If
    data is lost, it becomes corrupted or duplicated, TCP employs a number of techniques
    to recover from these errors. Retransmission of sent data can occur frequently,
    and TCP must maintain a considerable amount of state information about each communication.
    The custom network application can tolerate this overhead, TCP should be used
    instead. However, not all applications need this level of reliability. Returning
    to the example of the video-feed application from the discussion of UDP, it is
    clear that TCP would be a poor choice for the video-feed application. Losing one
    packet in every second is not a problem for the video-feed application when using
    UDP, but the delivery of data to their destination application is delayed while
    TCP tries to deliver the complete data stream. TCP identifies and locates the
    missing segment, retransmits the segment, and reorders the data on the receiving
    system, prior to making it available for delivery. This inevitably leads to noticeable
    delays on the receiving end-system. Quite the movie-going experience most people
    use to, nor wishing to accept.


    # 3.3 Introducing the Perl Socket API


    In this section, the Perl Socket API is introduced. Subsequent sections use the
    API to develop UDP and TCP custom network applications.

    The Perl Socket arranges for a network connection (called a socket) to appear
    to the program in the form of a standard input/output handle. When working with
    files, the input/output handle is a filehandle, where the < operator and inbuilt
    print subroutine are used to read from and write to the open disk-file. When the
    input/output handle is a sockethandle, < and print can be used to read from and
    write to the opened network connection (when TCP is used).

    Working with sockets, put the following lines of code at the top of each custom
    network application:


    ```

    #! /usr/bin/perl -w

    ```


    ```

    use strict;

    use Socket;

    ```


    As usual, the strange first line (with warnings enabled) is followed by a strict
    compiler directive which gently forces the programmer to write more structured
    Perl code. The code then uses the standard Socket module which comes with Perl.
    This module provides access to the Socket API as implemented by the underlying
    operating system. It is assumed that these lines of code appear before each of
    the code snippets in the remainder of this chapter.'
