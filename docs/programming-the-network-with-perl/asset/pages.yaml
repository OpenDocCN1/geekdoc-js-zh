    # 4.8 Doing More with LWPwwwb


    The world''s web browser renders the response due to its inability to intelligently
    process the response returned from the server (other than printing it to the screen).
    To spice things up a little, let us extend LWPwwwb to postprocess the response
    received from the server. Specifically, code will be added to parse any HTML received
    and extract hyperlinks and any associated textual description. To do this, LWPwwwb
    will take advantage of the facilities provided by the HTML::Parser module, which
    was one of the modules installed as a result of satisfying libwww-perl''s dependencies.'
