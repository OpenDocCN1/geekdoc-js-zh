  md: '# Doing More with LPwwwb


    An HTML::Parser object is created, and a reference to the object is stored in
    the $parser scalar:


    ```

    $my parser = HTML::Parser->new( api_version => 3 );

    ```


    Note that the code requests version 3 of the HTML::Parser API. This is significant.
    Version 3 of the HTML::Parser works as described in this section: event handlers
    are registered with the parser to react to events each occur. The other version
    of the API, version 2, works differently¹. With version 2, the programmer inherits
    from HTML::Parser and extends its functionality to do the parsing. This tends
    to be a bit more involved than the version 3 API, and as such, is deprecated at
    this stage.


    After displaying a brief message on screen, the code to parsewwb continues with
    a handler method associated with the $parser object to invoke the print_link subroutine
    whenever the parser encounters the start of an HTML tag. Note that a reference
    to the parser object (self), the tag encountered (tagname) and a hash reference
    containing the tag attributes (attr) are sent as parameters to the print_link
    subroutine whenever it is called by the parser:


    ```

    print "Parsing $http_server$html_page, on port: $http_port\n\n";

    ```


    ```

    $parser->handler( start => \print_link, ''self'', tagname, attr'' );

    ```


    With the event handlers, the code starts on each event occur by calling the parser
    method. Passed as a single parameter is the HTTP response retrieved earlier, and
    stored in the $Lwww_response scalar. The HTTP response is sent to the parser as
    a string, which is the entire HTTP response in textual form. The parser takes
    the content of the response (HTML) and works its way through it, calling print_link
    for each tag encountered. When the parser is done, the code calls the parser''s
    eof method to shut down the parser in an orderly manner, and the program ends:


    ```

    $parser->parse($Lwww_response->content);

    ```


    ```

    $parser->eof;

    ```


    ```

    print "\nDone.\n";

