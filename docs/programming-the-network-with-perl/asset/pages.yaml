  md: "# 44 Snooping\n\nLet us look at each of them.\n\n**SNAPLEN** – Default value:\
    \ 100. The maximum number of bytes to capture for each accepted packet. On Ethernet\
    \ networks, the maximum value of SNAPLEN cannot exceed 1500.\n\n**PROMISC** –\
    \ Default value: 1. Set to 0 to capture packets in normal mode, from 1 to capture\
    \ packets in promiscuous mode.\n\n**NUMPACKETS** – Default value: 1000. The number\
    \ of milliseconds of read timeout.\n\n**FILTER** – Default value: ''. Apply a\
    \ filter to the packets captured and accepted from the NIC. Initially, all packets\
    \ are accepted, regardless of type (i.e. there is no filter). Useful filters include:\
