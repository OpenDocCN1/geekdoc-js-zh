  md: '# Transport Snoopopers


    This code is so close to EtherSnooper (v0.02), that there is not much to say about

    it.


    The Capturing is happening at the network layer, so the code filters on

    IP protocol. Statistics are captured by got_a_packet and then processed by

    display_results.


    Here are some results produced by EtherSnooper (v0.06):


    +   2102 datagrams processed.

    IP generated no datagrams.

    ICMP generated 9 datagrams.

    UDP generated 1659 datagrams.

    IGMP generated 47 datagrams.

    IP/IP generated no datagrams.

    TCP generated 381 datagrams.


    As with EtherSnooper (v0.05), non-Ethernet frames have no bearing on the statist-ics
    gathered. The statistics gathered are quite surprising; look at all UDP traf-fic
    nearly every computer networking text describing TCP/IP short-shorts UDP as

    a protocol that is used by these applications (when compared with the number

    employing TCP). So, if applications are not using UDP to transport data, what
    is?


    Returning to the problem of the misconfigured broadcasting workstations

    erlier, it that they were broadcasting UDP datagrams. This fact alone

    accounts for the large number of UDP datagrams captured by this version of

    EtherSnooper.


    # 2.5 Transport Snoopers


    The versions of EtherSnooper have so far concerned themselves with pro-ducing
    results generated from the header fields of the analysed frames. No att-ention
    been paid to the data being carried in the frames. To get to the stage

    where the data can be analysed (''analysed'' means ''debugged''), the data

    need to be processed. In fact, it makes real sense to process the data at the

    application layer, where data have real meaning.


    In addition, the EtherSnoopers have all operated at the Host-to-Network or Net-work
    layers. Before getting to the application layer, an understanding of how applic-ation
    is handled by the Transport Layer is required.


    On TCP/IP networks, data is transported by one of two technologies. If the applic-ation
    can withstand some data loss, the lightweight, unreliable User Datagram

    Protocol (UDP) is used. If data loss is intolerable, the reliable, highly monitored

    Transport Control Protocol (TCP) is used. Support for analysing both technologies

    is available in the NetPacket::TCP and NetPacket:::UDP modules.


    The technique for interacting each module is as seen earlier: use the correct

    module, define hashes, modify got_a_packet and modify display_results.'
