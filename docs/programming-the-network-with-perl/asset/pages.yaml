  md: "# 3.7 UDP Is Unreliable\n\nThe next datagram snooped by NetBug shows the DNS\
    \ response generated as a consequence of the DNS query.\nThis short interaction\
    \ highlights an interesting characteristic of some network applications. The UDP\
    \ server is very much a server when interacting with the UDP client. However,\
    \ when necessary, the UDP server can temporarily become a client to some other\
    \ server (in this case, the DNS server), before returning to its role as server,\
    \ passively waiting for its next client.\n\nLet us extend the UDP client to send\
    \ five numbered messages to the UDP server in quick succession. Replace the last\
    \ three lines of code in udp_c2 with these:\n\n```\nmy $msg_count = 1;\nwhile\
    \ ( $msg_count < 6 ) {\n    my $data = \"This is a simple UDP message, $msg_count\"\
    ;\n    send(UDP_SOCK, $data, 0, $destination )\n    or warn \"udp_c3: send to\
    \ socket failed: $msg_count\\n\";\n    $msg_count++;\n}\nclose UDP_SOCK;\nor die\
    \ \"udp_c3: close socket failed: $!n\";\n```\n\nThis new version of the UDP client\
    \ is udp_c3. When the client is executed, the server displays the following:\n\
    \n+   Received from localhost: This is a simple UDP message, number 1\nReceived\
    \ from localhost: This is a simple UDP message, number 2\nReceived from localhost:\
    \ This is a simple UDP message, number 3\nReceived from localhost: This is a simple\
    \ UDP message, number 4\nReceived from localhost: This is a simple UDP message,\
    \ number 5\n\nRemember, the UDP client and the UDP server are running on the same\
    \ LAN, so it appears if the communication is occurring in a reliable manner. Shutdown\
    \ the server, then execute udp_c3 again. With no server to to, the UDP client\
    \ displays the following messages:\n\n```\nudp_c3: send to socket failed: 2\n\
    udp_c3: send to socket failed: 4\n```\n\n> ³The details of these DNS messages\
    \ are not shown, as the captured data contained a number of 'binary unprintables'.\n\
    ⁴The same message, in this case."
