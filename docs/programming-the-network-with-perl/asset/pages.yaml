  md: '# 4


    # Protocols


    In this chapter, Perl is used to interact with some of the Internet''s most popular
    application-level protocols. Over the last three decades, the Internet has spawned
    a large and growing collection of these protocols and Perl has a series of add-on
    modules (some of which come as standard) for interacting with them. These can
    be used to great effect when working with the standard services of the Internet.
    Of course, it is also possible to program to the Internet protocol standards using
    the Socket API. Although effective, using the Socket API in this way can often
    be a chore.


    After dispensing with a common gotcha, this chapter begins with a discussion of
    the most popular application-level protocol, HTTP, the HyperText Protocol. HTTP
    powers the World Wide Web, and a simple program is written in Perl''s Socket API
    to illustrate interactions with this protocol. This program is then replaced,
    and expanded-upon, by an ''add-on alternative'', which takes advantage of the
    most popular third-party add-on modules, like HTTP server technology is then explored.
    The remainder of the chapter is given to working with some other Internet protocols,
    and included is a brief description of the most popular add-on module library
    for non-HTTP protocol programming. A brief survey of some additional add-on modules
    rounds off this chapter.


    # 4.1 Gotcha!


    Prior to interacting with some standard Internet protocols, it is necessary to
    consider one of the biggest network programming gotchas of them all: an inadequate
    understanding of newline.'
  merge: -1
  pgno: 178
- img_proc: true
  md: "# 4.1.1 What's the deal with newline?\n\nMost programming languages have a\
    \ good understanding of what newline is. Within Perl, the \n escape sequence is\
    \ used to represent newline. Operating systems also have a good understanding\
    \ of what newline is. Unfortunately, two operating systems agree on exactly how\
    \ the newline should be represented. Personal computers running network technology\
    \ from Microsoft use a different representation for newline than those that run\
    \ Apple's Mac OS. Another value for newline is used on UNIX and Linux systems.\
    \ Strangly (this strangeness has nothing to do with Perl), under certain circumstances,\
    \ what some operating systems think of newline actually changes based on what\
    \ is going\n\nRegardless of the operating system (OS) running, Perl will tell\
    \ you the right thing, so when n is used, Perl uses the ASCII value expected by\
    \ the underlying OS. This can be very convenient for the programmer, as it is\
    \ possible to use \\n without worrying how the underlying OS interprets it. Unfortunately,\
    \ this convenience can lead to problems when data are transmitted over a network.\
    \ This is especially true when the data includes embedded newline characters and\
    \ the data are sent from a network device running a different OS to that on the\
    \ receiving device. What newline on a device running Mac OS (ASCII value 13) will\
    \ not be treated as such on a device running Linux, which uses ASCII value 10\
    \ is used to represent the single newline character. By using \\n in a custom\
    \ application and hoping for the best ideally, the meaning associated with the\
    \ OS-specific value of newline will be lost when communicating with a network\
    \ device running a different\n\nThe solution to this problem is simple: as rule,\
    \ do not use \\n to represent newline when sending data over a network connection!\
    \ This rule leads to a rather obvious question: if n is not used, what is? Well,\
    \ it depends. The correct value should be properly specified and explicitly used.\
    \ If ASCII value 13 is used, then ASCII value 13 should be specified in code.\
    \ Instead of writing of this code:\n\n```\nprint CLIENT_SOCK \"This is a line.\\\
    n\"\n```\n\nuse:\n\n```\nprint CLIENT_SOCK \"This is a line.\\015\";\n```\n\n\
    where \\015 is the octal representation of ASCII value 13. If ASCII value 10 is\
    \ used to represent newline, \\012 is used. Microsoft's idea of newline can be\
    \ specified as \\015\\012. Do not fret if this octal brings brings on a migraine.\
    \ The Socket\n\n> 1 Eagle-eyed readers will note that this rule was broken (actually,\
    \ ignored) in the previous chapter. We only got away with this due to the fact\
    \ that all communication was occurring between Linux and UNIX-derived devices,\
    \ which use the same representation for newline."
  merge: -1
  pgno: 179
- img_proc: true
  md: "# Gotcha! 163\n\nmodule provides a small collection of constants that can be\
    \ used instead, and they are imported into a custom network application with the\
    \ following statement:\n\n```\nuse Socket qw( DEFAULT :crlf );\n```\n\nIt is now\
    \ possible to use CR (or CRLF) for ASCII value 13, $LF (or LF) for ASCII value\
    \ 10, and $CRLF (or CRLF) for the ASCII value 13 followed by ASCII value 10 sequence.\
    \ The line of code from earlier can be written in a more readable way, as follows:\n\
    \n```\nprint CLIENT_SOCK \"This is a line.$CR\";\n```\n\nSo, if you use newline\
    \ on one end of a connection is known, it can be used on the other end. If the\
    \ newline value has to be converted to the newline value by the receiving devices\
    \ OS, then this becomes an added responsibility of the custom network application.\
    \ However, what happens when the value of newline is not known? It is not possible\
    \ to provide a generic mechanism for determining the value of newline by the other\
    \ end of a network connection. Consequently, a common standard emerged: the de\
    \ facto representation for newline within the majority of Internet protocols is\
    \ the ASCII value 13 followed by ASCII value 10 sequence². Within custom network\
    \ applications, the $CR constant should be used to represent newline. In order\
    \ to conform with this standard, the readable line of code from above should now\
    \ be:\n\n```\nprint CLIENT_SOCK \"This is a line.$CRLF\";\n```\n\nHowever, for\
    \ an application to be classed as robust, it is also recommended that it recognizes\
    \ an ASCII value 10 ($LF) as newline. Aren't facto standards wonderful? It is\
    \ relatively easy within Perl to reliably deal with this particular protocol quirk.\
    \ When data arrives from a connected socket, the receiving application needs only\
    \ convert the protocol's idea of newline into a form that is acceptable to the\
    \ underlying operating system, as follows:\n\n```\n$line = <TCP_SOCK>;\n```\n\n\
    ```\n$line = \\$s/CR\\$LF/\\n/;\n```\n\n```\nprint \\$line;\n```\n\nThis code\
    \ recives a newline-terminated chunk from the TCP_SOCK sockhandle. If the line\
    \ uses $CR or $LF as newline, it is replaced by the \n escape sequence. The second\
    \ line is an example of the substitution mechanism built into Perl's regular-expression\
    \ technology. The use of ? between the $CR and $LF constants tells Perl to treat\
    \ the $CR part as optional, which is exactly what is required to support the recommended\
    \ robustness. Once the substitution is complete, the substituted line is reassigned\
    \ to $line before it is printed by the inbuilt subroutine.\n\n> ²It is not just\
    \ Microsoft that is infected!\n\n![](img/7ba56e5cb69c2c76418ce14c4839c8b2_180_0.png)"
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 4.2 Working with the Web


    For most users, the Web is the Internet and the Internet is the Web. In recent
    years, the Web browser – in addition to providing its ''bread and butter'' service
    of hypertext browsing – has become the tool used for accessing other standard
    Internet services, such as electronic mail, network news and file transfer. Multimedia
    services are becoming increasingly popular, the Web browser (with optional extensions)
    now provides access to video, television, music, phone and radio services. The
    humble Web browser is on its way to becoming the universal platform.


    The protocol used by the Web browser (the client) when communicating with a website
    (the server) is the HyperText Transfer Protocol (HTTP), and three versions of
    the standard are in use: 0.9, 1.0 and 1.1. Most new technology is built to support
    the 1.1 standard which, and by large, provides backward compatibility with the
    earlier versions.


    HTTP is built on top of TCP, which means all Web communication is reliable. This
    also means that prior to any communication occurring, the HTTP client and HTTP
    server must establish a TCP connection.


    # 4.2.1 HTTP requests and responses


    Once a connection has been established, requests from an HTTP client to an HTTP
    server begin by specifying a method which governs how the server is to respond
    to the client. As of HTTP 1.1, the standard set of methods are as follows.


    +   - OPTIONS – allows a client to request details about a specific resource,
    or about the server itself.


    +   - GET – allows a client to instruct the server to locate a specific resource,
    retrieve it, and deliver it to the client. The resource has two parts: a header
    and a body. The header-part contains data about the contents of the body-part,
    which contains the something of interest, for example, a Web page or graphic.
    Data about data are often referred to as metadata. This is one of the most used
    HTTP methods.


    +   - HEAD – this is identical to the GET method, except that the body-part of
    the resource is not sent to the client, just the header-part.


    +   - POST – allows a client to send data to the server for processing. As an
    example, the data from a Web browser displaying an HTML fill-out form. When a
    user clicks on the Submit button, the client sends (or posts) the data to the
    server. Like GET, this is a heavily used method.


    +   - PUT – allows a client to send a resource to the server, updating or creating
    the resource on the server as needs be. This assumes, of course, that the client
    is authorized to write to the server.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'DELETE – allows a client to request that the server remove a specified resource
    from the server.


    TRACE – allows a client to request loopback information for a particular server
    resource, typically used during testing.


    CONNECT – is reserved for proxy servers.


    In addition to the method, the HTTP request identifies the resource it is interested
    in. This is typically the path and name of an HTML document, as HTTP was initially
    designed to support the retrieval and delivery of HTML Web pages. The request
    concludes with an indication of the version of HTTP being used on the client,
    together with any required terminating newlines. For example, to retrieve the
    index.html page an HTTP client written in Perl would send the following request
    to a Web:


    ```

    GET /index.html HTTP/1.0$CRLF$CRLF

    ```


    Note that code identifies itself as a speaker of version 1.0 of HTTP, the double
    newline at the end of the request, as well as the space character separating each
    part of the request. Within the official HTTP standard document (refer to Web
    Resources section at the end of this chapter), this request string is referred
    to as a Request-Line.


    The response generated by the Web server contains two parts: a header and a body.
    The header-part is composed of a series of newline-delimited lines of text. The
    body-part, which comes after the header (and from which it is separated by a blank
    line), contains the requested resource. Within the HTTP world, resources can be
    anything, although they are typically an HTML page or graphic file.


    Without knowing much about HTTP, let us write a simple HTTP client using the facilities
    of Perl''s Socket API to interact with any Web server.


    # The World''s Worst Web Browser


    The code for the simple HTTP client begins as expected. For convenience, the OO
    version of Perl''s Socket API is used. The code also imports the newline constants
    from the standard Socket module:


    ```

    #! /usr/bin/perl -w

    ```


    ```

    use strict;

    use Socket qw( :DEFAULT :crlf);

    use IO::Socket;

    ```


    This client is command-driven and can take up to three optional parameters: the
    HTTP request method, the name of the network device running the HTTP server, and
    the name of the resource. Three lines of code implement this behaviour, with appropriate
    defaults defined for each parameter:'
  merge: -1
  pgno: 182
- img_proc: true
  md: "166 Protocols\n\n```\n$ $http_method = shift || 'GET';\n$ $http_server = shift\
    \ || 'localhost';\n$ $html_page = shift || '/index.html';\n```\n\nNext, the code\
    \ creates a connected socket object, using TCP and protocol port-number 80 (the\
    \ well-known TCP port for Web services):\n\n```\n$ my $http_obj = IO::Socket::INET->new(PeerPort\
    \ => 80,\nProto => 'tcp')\nor die \"wwwb: could not create socket object: $!!\\\
    n\";\n```\n\nIf all is well then the client requests to the server using a simple\
    \ call to the inline print subroutine:\n\n```\nprint $http_obj \"$html_page HTTP/1.0$CRLF\"\
    ;\nloop is then entered, with each iteration, a line is received from the server.\\\
    Each line's idea of newline is converted to \\n the line being written to the\\\
    client's standard output (most likely the screen). When there are no more lines\
    \ to\be received from the server, the loop terminates, and the socket object is\
    \ closed.\nThe client terminates:\n```\n\n```\nwhile ( $line = <http_obj> )\n\
    {\n$line = s/\\CRLF/\\n;\nprint $line;\n}\n$http_obj->close();\n```\n\nAnd there\
    \ it is: the world's worst Web browser (wwwb) in 20 lines of Perl code.\nWhy 'worst'?\
    \ As browsers go, wwwb is pretty poor. It does not work\ngraphically, any so resource\
    \ is displayed as on the screen - no HTML\nis rendered, and any embedded graphics\
    \ are not displayed. It does not allow for\nt traversal of hypertext links. And\
    \ it is not exactly user-friendly, requiring the\nuser to specify the HTTP method\
    \ to use. So wwwb is not going to replace any of\ntbrand-name Web browsers any\
    \ time soon.\n\nHowever, what wwwb allows its users to interact with an HTTP server\
    \ at\nat lower level than is typically available from within a full-featured Web\
    \ browser.\nTo get an idea of its capabilities, make wwwb executable and invoke\
    \ it with the\ncommands:\n\n```\nchmod +x wwwb\n./wwwb\n```\n\nNote that the first\
    \ invocation of wwwb is equivalent to this (be warned\nthe / front of index.html\
    \ is required):\n./wwwb GET localhost /index.html\n\n> ³So we are stretching something\
    \ by calling it a browser."
