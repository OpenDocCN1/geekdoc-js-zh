    At this point, the client and the server have stopped displaying messages. The
    client has not yet received datagram 2, even though it has been received and sent
    back by the server. Client is blocking on its call to recv, and it will not continue
    until some data arrive on the socket. The datagram that was successfully sent
    by the server has (somehow) become lost. What is worse is that the server - thinking
    all is well - has called recv and is waiting for the next datagram to arrive from
    the client. The server is also blocking on its call to recv. The two sides of
    the conversation are waiting to receive data, but neither side is sending. They
    will now wait forever (or until some friendly individual kills them with Ctrl-C).
    This is a classic and catastrophic example of network deadlock.


    # 3.9 Dealing with Deadlock


    To avoid deadlock, it is necessary to somehow prevent the client to recv within
    the UDP client from blocking forever. The blocking behaviour of the client within
    the UDP server code will remain, as the server is designed to wait forever. To
    avoid deadlock, a number of strategies can be followed, and three which are regularly
    employed, in order of increasing complexity, as follows:


    Specify a time-out - the technique employed by the Network Debugger in Chapter
    2 to specify an alarm can be used to abort the call to recv after a set of time.


    > 7 Also known by the more imaginative name of Deadly Embrace.'
