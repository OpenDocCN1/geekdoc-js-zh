  md: 'Where To From Here?


    # 6.15 Where To From Here?


    Another Perl mobile code technology is Penguin by Felix Gallo. Penguin provides
    functionality not unlike that provided by Agent.pm, but in a very different manner.
    A related module is Penguin-Easy, by James Duncan, which provides a simpler API
    to the Penguin facilities. Note that the development of these modules, which are
    both available on CPAN, has not seen any activity for a number of years.


    There is a lot of ongoing research within the mobile-agent community. Refer to
    the Web Resources at the end of this chapter for more details.


    As stated at the start of this chapter, Agent.pm is an unfinished, proof-of-concept
    technology. Readers are encouraged to extend and expand the capabilities of Agent.pm,
    and share their code with the Perl programming community.


    # 6.16 Print Resources


    A good introduction to mobile-agent technology is the book Mobile Agents by William
    T. Cockayne and Michael Zyda (Manning, 1998). This includes a description of four
    (non-Perl) mobile-agent implementations: Telescript, Agent TCL (now D''Agents),
    ARA and IBM''s Agents.


    Understanding Code Mobility by Alfonso Foggetta, Gian Pietro Picco and Giovanni
    Vigna (IEEE Transactions on Software Engineering, 1998) is an excellent article
    describing a collection of mobile code technologies, design paradigms and proposed
    application areas. The inclusion of a network management case-study is highly
    relevant in light of this book''s last chapter.


    # 6.17 Web Resources


    Steve Purkis''s CPAN directory is http://www.cpan.org/authors/id/PURKIS. An old
    and out-of-date Agent.pm website can be found at http://tiamat.epn.nu/~purkis/.


    The CPAN directory to the work of James Duncan can be found at: http://www.cpan.org/authors/id/DOUNCAN.


    An excellent and very well maintained website devoted to listing online mobile-agent
    resources can be found at http://www.cetus-links.org/oo_mobile_agents.html. Refer
    to the Bibliography section of this page for a large collection of mobile-agent
    security resources.'
