    # 4.5 It''s the Gisle and Graham Shaw!


    Of all the networking add-on modules available for Perl, stand out when it comes
    to programming standard Internet protocols. They are libwww-perl (also known as
    LwP) and libnet. The libwww-perl module primarily supports the programming of
    clients using HTTP and related protocols. The libnet module'
  merge: -1
