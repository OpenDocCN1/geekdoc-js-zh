  md: '# About The Author


    Since 1997, Paul Barry has lectured in Computer Networking at the Institute of
    Technology, Carlow, in Ireland. Prior to that he held Information Technology Management
    positions in Ireland and Canada. Paul has been programming professionally and
    working with computer networks, in one form or another, since 1988. In that year,
    he graduated in Computing Science from the University of Ulster, Jordanstown,
    in Northern Ireland. A contributor to Linux Journal magazine and website, Paul
    is married, and he and his wife have three young children. His website is located
    at http://glasnost.itcarlow.ie/-barryp/index.html.'
