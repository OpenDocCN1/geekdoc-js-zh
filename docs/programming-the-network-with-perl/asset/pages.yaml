  md: '292 Mobile Agents


    Make a copy - copy the multidefault2.pa source code to a new disk-file (ensuring-

    ing, for the sake of consistency, that the name of the disk-file ends in the

    ''.pa'' extension).


    Change do_it - change the code that is executed by each Receiving MAE to

    perform the desired operation.


    Change at_end - change the code that is executed by the final Receiving MAE to

    perform any post-relocation processing (such as displaying results).


    Add hash entries - add hash entries to the mobile agent''s object whenever

    additional state information needs to be manipulated and relocated.

    objects based on the Agent class, the Agent.pm technologies ensure

    all data associated with the object relocate from one MAE to another.


    And all that there is the three ''multi'' programs provide the mobile-agent

    machinery. The do_it and at_end methods provide standard points within the

    mobile-agent source code to allow for customization of the default behaviour.

    With the mobile-agent machinery in place, it is time to develop a mobile-agent

    version of the client/server multiwo and ideterminate programs.


    # 6.11 The Mobile-Agent multiwo


    Producing the mobile-agent version of multiwo is easy, as that is required

    def of the do_it and at_end methods. Here is the code to the do_it

    method from the multihoma.pa program:


    ```

    sub_do_it {

    my ($self, @args) = @_;


    @{$self->{''Wholist''}} = (@{$self->{''Wholist''}}, ''who'');

    }",}

    ```


    Another anonymous array is stored within the object''s hash and is referred to

    the Wholist key. Each time the do_it method is invoked, the anonymous array''s

    contents are reassigned to a copy of its current contents with the

    underlying operating system executing the command. Perl''s backtick

    operator is used to execute and return any results to the mobile agent.

    Again, the addition of entries to an existing hash is exploited by this Code.

    Eventually, the mobile agent arrives at the final Receiving MAE, and the at_end

    method is invoked. This method simply displays the contents of the anonymous

    referred to by Wholist:


    ```

    sub_at_end {

    my ($self, @args) = @_;


    print @{$self->{''Wholist''}},\n";

    }

    ```'
