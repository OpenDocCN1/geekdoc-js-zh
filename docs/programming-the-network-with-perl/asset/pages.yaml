    \ anonymous array too early. Consequently, as $sto is defined, the do_it method\
    \ is invoked by the Launching MAE.\n\nOne solution to this problem employs a variation\
    \ on a strategy developed by Steve Pucks. Rather than assigning a location from\
    \ the list to the $sto before the call to do_it. It is assigned after. A trick\
    \ which exploits the behaviour of agents, hashes, and references is used to ensure\
    \ that the definiteness of $sto can be checked before a value has been assigned\
