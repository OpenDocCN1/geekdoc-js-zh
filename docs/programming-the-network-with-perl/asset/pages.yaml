    generated by the computer running multihwo. Next, configure the Network Debugger
    to capture the network traffic generated by the multihoma.pm mobile agent on the
    network device executing the Launching MAE. Compare the results with those of
    1determine program.


    +   4. Repeat the last exercise for the client/server and mobile-agent version
    of the 1determine program.


    +   5. The multdefault2.pa mobile agent halts when it cannot relocate to MAE (due
    to the MAE''s inability to accept connections). For example, when roaming to a
    list of five MAEs, if the third MAE is unavailable, will terminate at the second
    MAE (never returning to the final MAE to process results from the mobile agent''s
    computations). Develop a more robust implementation of this mobile-agent which
    handles any number of unavailable MAEs. When this new version of multdefault2.pa
    arrives at the final MAE, addition to processing the at_end results, it should
    report the list of MAEs visited.


    +   6. Research the Safe module which comes as standard with the Perl distribution.
    Once you understand the facilities provided by this module, investigate its use
    within the Agent.pm classes. Can use of Safe improve upon the security vulnerabilities
    of the oneshotloc MAE and multishloc MAEs? Change these programs to switch on
    the use of Safe. What effect does this have?'
