    \ even though it really is not. This allows a program to the use strict compiler\
    \ directive, and still use global containers when it is convenient (or necessary)\
    \ to do so.\n\n# Controlling Flow\n\nPerl has the usual collection of flow control\
    \ statements: if, while and for. Perl also has some of its own: unless, until\
    \ and foreach. In addition, two builtin subroutines (do and eval) can impact on\
    \ a program's flow of control. In this section, we will look at each of these\
    \ constructs in turn.\n\n# 1.3.1 if\n\nTo decide on one or more courses of action,\
    \ use the if statement. Assuming the $net scalar is set to an appropriate value,\
