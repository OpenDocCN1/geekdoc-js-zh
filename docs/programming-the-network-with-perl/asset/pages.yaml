  md: '# # Exercises


    +   1. Revisit the NetDebug code from the last chapter and amend it to take an
    IP address or an IP name as the value for the -s command-line parameter.


    +   2. Research the threading technology available with Perl 5.6.0 (and higher),
    then develop the child-spawning, zombie-exhuming UDP client to use threads as
    opposed to fork when creating and managing subprocesses.


    +   3. The connect subroutine is typically used with TCP, but can also be used
    with UDP. What are the advantages/disadvantages (if any) of using with UDP?

    4. The tcp_s and tcp_s5 servers work well, but they are not very robust. For example,
    if they sent a single / as the filename, the server gets into difficulty. Additionally,
    the servers should not occur a file that already exists on the server, as so would
    overwrite the file (rarely the required behaviour). This is a particularly serious
    problem on network devices executing the concurrent version of this server. Amend
    both servers to guard against these situations. (Hint: does the Flock function
    from the standard Fcntl module help?) Can you think of any other amendments that
    would improve the robustness of these servers?


    +   5. Some authors suggest that production servers should be executed with tainting
    switched on, that is, the -T command line switch should be specified on the strange
    first line of Perl servers. It is also suggested that the use sgtrap compiler
    directive be enabled. Research the impact that each of these features has on the
    status of servers. Do you agree they should be used on all servers? Should either
    feature be used on clients?


    +   6. Create a reliable server that receives any amount of text from a client,
    spell checks the text received using the spell1 program (included with most versions
    of Linux and UNIX), then returns the list of suspect words to the connected client.
    Develop the server to support concurrency using the OO socket interface. The client
    (which also needs to be developed) should use the functional interface.'
