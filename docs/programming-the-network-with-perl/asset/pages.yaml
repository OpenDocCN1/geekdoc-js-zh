  md: '```

    #! /usr/bin/perl -w


    use strict;

    use LWP::UserAgent;


    my $http_method = shift || ''GET'';

    my $http_server = shift || ''localhost'';

    my $html_page = shift || ''/index.html'';

    my $http_port = shift || 80;


    my $wwwb_useragent = new LWP::UserAgent;


    my $wwwb_url = ''http://'' . $http_server . '':'' . $http_port . $html_page;


    my $http_request = new HTTP::Request $wwwb_url;

    my $wwwb_response = $wwwb_useragent->request($http_request);


    print $wwwb_response->as_string;

    ```


    Let us go through the code in detail. It starts with the usual first line, the
    inclusion of two modules, strict and LWP::UserAgent. Although this program works
    with the HTTP::Request and HTTP::Response modules, there is no requirement to
    specify them. The fact that LWP::UserAgent is explicitly specified in the other
    classes. Remember: the LWP::UserAgent acts as a layer between the application
    and the network service being programmed.


    The LPwwb program can take up to four parameters at the command-line, and these
    are assigned to four scalars, or to set default values if not. Unlike although,
    this version of the world''s worst web browser provides a mechanism to specify
    the protocol port to establish a connection. The default value for this is 80,
    the well-known port for Web services. As will be seen in a later section, Web
    servers often operate on a protocol port-number other than 80, and LPwPwwb supports
    this behaviour.


    The next line of code creates a user-agent object, and assigns it to a scalar
    called $wwwb_useragent:


    ```

    my $wwwb_useragent = new LWP::UserAgent;

    ```


    Note the use of the object-oriented syntax for constructing an object of type
    LWP::UserAgent. Although this looks a little strange, it is nothing more than
    a call to the subroutine called new included with the LWP::UserAgent class. The
    invocation of new results in the production of a LWP::UserAgent object, which
    is then assigned to the $wwwb_useragent scalar. In Perl, objects are stored in
    scalars and are a special type of reference.'
