  md: "The inbuilt subroutine is used to give a variable container lexical scope.\
    \ The variable is not globally visible, nor is visible by any invoked subroutine.\
    \ It is only visible within the block that declares it. When the use strict compiler\
    \ directive is used at the top of a Perl program, global variables are forbidden,\
    \ and my must be used. That is, of course, assuming the variable containers have\
    \ not been declared with our.\n\nThe inbuilt subroutine is new as release 5.6.0\
