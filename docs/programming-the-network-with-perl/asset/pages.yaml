  md: '# The World’s Worst Web Browser 169


    Note that the header-part has a different collection of name/value pairings than
    those associated with the previous HTML page. With this resource, the type of
    the body-part is identified as a single image file conforming to the GIF standard.


    So, to retrieve a single HTML page containing a single embedded graphic requires
    two HTTP request/response interactions. Note that each interaction requires the
    establishment of its own TCP connection from the client network to the server
    network. Even though the HTML page and the graphic are considered to be part of
    the same page, for as HTTP is concerned, they are separate resources that must
    be retrieved separately using separate connections. If the HTML page contains
    101 connections, the HTTP client is required to establish 101 connections with
    the HTTP server in order to retrieve the entire resource, and all those connections
    and teardowns take time.


    That is, of course, if the HTTP client is using version 1.0 of HTTP. If version
    1.1 is used, the client can take advantage of *persistence*, which allows for
    a single connection to retrieve many resources. This, as can be imagined, can
    have a very positive impact on performance


    # 4.3.2 A persistent wwwb


    In order to use persistence, the client needs to tell the server that it is speaking
    version 1.1 of HTTP. This is easily accomplished by sending:


    ```

    GET /index.html HTTP/1.1

    ```


    instead of:


    ```

    GET /index.html HTTP/1.0

    ```


    to the server. This alone is not enough. Version 1.1 of HTTP is more strict in
    what it will accept as a value resource. To illustrate what happens, a small change
    to *wwwb* can be made, so that the request is sent to the server looks like this:


    ```

    print http_obj "http_method $http_path HTTP/1.1$CRLF$CRLF";

    ```


    When sent to Apache, the following response is returned:


