    # SYNOPSIS


    To write a string, a formatted string, a number and a formula to

    t first worksheet in an Excel workbook called perl.xls


    use Spreadsheet::WriteExcel;


    ```

    # Create a new Excel workbook

    my $spreadsheet = Spreadsheet::WriteExcel->new("perl.xls\n

    # Add a worksheet

    $worksheet = $spreadsheet->addworksheet();


    # Add and define a format

    $format = $spreadsheet->addformat(); # Add a format

    $format->set_color("red");

    $format->set_align("center");


    # Write a formatted and unformatted string

    $col = 0; $worksheet->write($col, "HI Excel", $format);

    $worksheet->write($col, "HI Excel!");


    # Write a number and a formula using A1 notation

    $worksheet->write(\A3", "1.2345");

    $worksheet->write(\A4", "=SIN(PI()/4)");

    ```


    # REQUIREMENTS


    This module requires Perl 5.00 (or later) and Parse::Descendant:

    http://search.cpan.org/search?dist=Parse-ReDescendant


