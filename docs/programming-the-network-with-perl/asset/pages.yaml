- img_proc: true
  md: 'is discussing Abstract Syntax Notation One (ASN.1) and the Basic Encoding-Rules
    (BERs), two technologies that SNMP relies on internally, and which are (rather
    conveniently) ignored in Programming the Network with Perl. This complexity can
    be off-putting to many. But do not worry. When Net::SNMP is used, programming
    SNMP is, well, simple.


    Net::SNMP supports SNMPv1 and SNMP2c. The API is object oriented in nature: an
    object of type Net::SNMP is created, then methods associated with the object are
    called as requested. Two distinct object-oriented interfaces are provided: *blocking*
    and *non-blocking*. When the blocking interface is used, an invocation of a method
    halts (or ''blocks'''') further program execution until the method returns. When
    the non-blocking interface is used, an invocation of a method returns immediately,
    allowing programming interface to continue. The code in the method is queued,
    and when a program requests that the methods in the queue be processed, the callback
    subroutine is associated with it. Later, when the callback are executed in response
    to the queued methods being invoked. Typically, the arguments provided to a method
    differ as to whether it is called using the *blocking* or *non-blocking* interface.


    The programs developed during the remainder of this chapter use the blocking interface.
    This keeps things as simple and understandable as possible. That said, the non-blocking
    interface is very useful, and readers are encouraged to explore the mechanism,
    starting with the example included as part of the Net::SNMP documentation¹.


    # ### 5.9.1 The Net::SNMP methods


    The methods associated with a Net:::SNMP object are as follows.


    +   - **session** - creates a new Net:::SNMP object.

    - **close** - destroys a previously created Net:::SNMP object.

    - **snmp_event_loop** - processes any queued methods (when the non-blocking interface
    is used).

    - **get_request** - sends the SNMP get-request message to a *Managed Device*,
    and waits for a response.

    - **get_next_request** - sends the SNMP get-next-request message to a *Managed
    Device*, and waits for a response.

    - **set_request** - sends the SNMP set_request message to a *Managed Device*,
    and waits for a response.

    - **trap** - sends the SNMPv1 trap message to a *Managed Device*.


    > ¹Another great thing about Net:::SNMP is that David M. Town provides excellent
    documentation, both in POD and man format.'
