  md: '# 6.14 Other Perl Agent Examples


    The release distribution of Agent .pm includes a collection of instructive example
    programs. What follows is a brief description of each.


    **dca1c.pa** - a distributed mobile-agent calculator, capable of relocating to
    a list of MAEs.


    **Eval.pa** - a mobile-agent code evaluator, which relocates to a MAE, executes
    specified code using eval1, then returns any results to a specified network location.


    **ex.pl - a Launching MAE** designed to execute the mobile agents distributed
    with Agent .pm. can also be used to launch any other mobile agent developed using
    the Agent .pm technologies.


    **FreeSpace.pa** - a mobile agent capable of relocating to a list of MAEs in order
    to determine the amount of free hard-disk storage available on each MAE. Unlike
    the multdefault2.pa mobile agent, FreeSpace.pa executes its equivalent of the
    do_it method on the final *Receiving MAE*, and well as all others.


    **HelloWorld.pa** - a simple mobile agent that relocates to a specified MAE and
    displays a ''Hello World!'' message on the MAE''s screen.


    **keepalive.pa** - a small program that uses the inbuilt subroutine (or persist)
    connections using the Agent .pm technologies and the TCP transport service.


    **Loop.pa** - this mobile agent can be started as a sender or a receiver. When
    operating either, it communicates with another Loop.pa mobile agent, sending a
    small message repeatedly (back and forth).


    **MyAgent.pa** - written by James Duncan, this small program combines the code
    for a mobile agent with that of a Launching MAE. When executed, it relocates to
    a specified *Receiving MAE* and displays the string "**** Test from James ****"
    on screen.


    **Static.pa** - the distribution MAE, which can be executed by the ex.pl program.
    Designed by Steve Perks as an ''agent server'', this program provides functionality
    similar to the multishloc program, yet a very different implementation strategy.
    It does more, but is more complex as a result.


    **Template.pa** - an empty mobile agent that can form the basis of any custom
    mobile agent. An empty shell, the Template.pa code is, nevertheless, unlike the
    ondefault.pa and multidefault2.pa programs.'
