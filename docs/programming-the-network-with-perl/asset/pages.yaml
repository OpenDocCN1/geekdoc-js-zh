  md: "# Building Low-Level Snooping Tools\n\nCalling Perl's inbuilt time subroutine\
    \ returns the number of seconds since the operating systems epoch. The value returned\
    \ is assigned to $now. Adding 180 seconds to now turns into $then. The loop iterates\
    \ as $now is less than $then, and $now is updated each time (no pun intended)\
    \ the loop iterates.\n\nIt is tempting to try and integrate this code into EtherSnooper(v0.01),\
    \ as follows:\n\n```\nmy $minute = 3;\nmy $now = time;\nmy $then = $now + (60\
    \ * $minute);\n\nwhile ($now = time) < $then) {\n    my $status = Net::PcapUtils::loop(\n\
    \        &got_packet,\n        NUMPACKETS => 1\n    );\n```\n\nThe call to Net::PcapUtils::loop\
    \ only captures a single packet each time it is called. Each time Net::PcapUtils::loop\
    \ executes opens the NIC, the NIC using the provided parameters, calls the callback\
    \ function for each packet accepted by the NIC (which is only going to be one).\
    \ As this will happen each time the loop iterates, this ends up opening and configuring\
    \ the NIC far too often. In short, the code is wasteful. It may also exhibit resource\
    \ problems when executed over long periods of time.\n\nTo overcome this problem,\
    \ rewrite EtherSnooper to use open and next to create v0.02. Here is the entire\
    \ program:\n\n```\n#! /usr/bin/perl -w\n\nuse 5.6.0;\n\nuse strict;\nuse Net::PcapUtils;\n\
    use Net::Packet::Ethernet qw (:types);\nuse XtraType;\n\nour %type_desc = (\n\
    \    0x0800 => 'IPv4',\n    0x0806 => 'ARP',\n    0x009B => 'AppleTalk',\n   \
    \ 0x814C => 'SNMP',\n    0x86DD => 'IPv6',\n    0x880B => 'PPP',\n    0x8137 =>\
    \ 'NOVELL1'\n);\n```"
