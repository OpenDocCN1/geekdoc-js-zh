    \ from one networking to\nother while they are executing. This interesting technology\
    \ is the topic of\nChapter 6.\n\nThe client/server model, by far the most common,\
    \ splits an application into two\nmajor components. Each component is in effect\
    \ a separate program, and the two\ncommunicate across the network by way of standard\
    \ messages.\n\nAs an example of the client/server model, consider how the World\
    \ Wide Web\nworks. The web browser provides for the viewing of hyperlinked, text\
    \ documents.\nThese documents are stored at a large collection of remote websites,\
    \ connected\nto the global Internet. Based on the actions of the user, the web\
    \ browser sends a\nrequest message to a website for the delivery of a particular\
    \ document. The\nwebsite finds the document, and sends a response message containing\
    \ the docu-\nment to the web browser. The web browser receives the document, and\
    \ renders\nit contents on the screen. In this example, the web browser is the\
    \ client and the\nis server.\n\nWithin the client/server model, the local client\
    \ typically requests some service\nfrom the remote server. The server responds\
    \ to the client with the results gener-\\ated as a consequence of satisfying the\
    \ service request. In addition to the World\nWide web, many of the applications\
    \ used by millions on the Internet con-\nform the client/server model, and these\
    \ include electronic mail, file transfer,\nterminal emulation and network news.\n\
    \n# 3.1.1 Client characteristics\n\nThe client application (or user-agent), regardless\
