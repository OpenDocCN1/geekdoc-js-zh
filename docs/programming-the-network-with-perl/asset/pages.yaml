    # 1.2.2 A collection of somethings: arrays and lists


    Here is an example that shows a relatively standard usage of arrays and lists
    in Perl:


    ```

    @networks = (''Ethernet'', ''Token-Relay'', ''Frame-Relay'', ''ATM'');

    ```


    On the left of the assignment operator (the = symbol), there is an array called
    @networks. Note the prefixed @ character, which indicates that this is an array
    variable. On the right, there are four network names in the form of a Perl list.
    The four names are surrounded by single quotes, enclosed in parentheses, and separated
    by commas. The elements of the list are all ''something'' scalar values (in this
    case, strings). This single line of code takes the four network names and assigns
    them to the first four elements of the @networks array.


    In Perl, arrays start from zero, and the first element is actually referred to
    as element 0. So, @networks is a four-element array with elements numbered 0,
    1, 2 and 3.


    The current size of an array can be determined in one of two ways. Add one to
    the value of the largest index (using $), or assign the array to a scalar variable:


    ```

    print "The size of the array is: \$( \$networks + 1 ), "\n";n$size = @networks;

    print "The size of the array is: \$size\n";

    ```


    will print the following:


    ```

    The size of the array is: 4

    The size of the array is: 4

    ```


    Looking at code, the $size scalar value is substituted into the part of the quoted
    string that gets printed. This process is called variable interpolation, and it
    will be returned to later in this chapter. The first print statement is actually
    printing a list, made up of a string, an expression, and another string³. Arrays
    in Perl are automatically dynamic, so it is possible to add elements to the array
    without having to reserve space for them. Here is how to add more network names
    into the array:


    ```

    @networks = (@networks, (''FDDI'', ''Arcnet'') );

    ```


