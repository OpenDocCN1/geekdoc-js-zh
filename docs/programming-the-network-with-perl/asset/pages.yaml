  md: '# Using Variables in Perl


    When a hash entry is created, a value part does not need to be initially specified.
    The special value undef can be used to set a hash entry (or any variable) to the
    undefined value:


    ```

    $net_mtus{''SMDS''} = undef;

    ```


    The above code is identical to:


    ```

    $net_mtus{SMDS} = undef;

    ```


    the only difference being that the single quotes are missing around the SMDS.
    In ‘Perl-speak’, this is referred to as a bareword. If a hash name contains no
    whitespace, the single quotes are generally not required.


    A convenient way to clear it is to set it equal to an empty list:


    ```

    $net_mtus = ();

    ```


    Hashes (and arrays, for that matter) are very useful ‘out-of-the-box’. In Programming
    the Network with Perl, these inbuilt variables are all needed. However, on occasion,
    more complicated data structures help to simplify a solution. The problem with
    arrays and hashes is that they can only store scalar values. This restriction,
    on first glance, seems limiting in that it no method exists to provide for, storing
    an array in a hash entry, or storing a hash in an array element. This restriction
    is overcome by the use of references.


    # 2.1.4 References


    A reference is a Perl scalar variable that refers to something else. The ‘something
    else’ can be one of a number of things, including another scalar, array, hash,
    subroutine, or object. In this subsection, references to scalars, arrays and hashes
    are described in later sections.


    If a scalar reference refers to an array, the scalar reference can then be, added
    to an existing hash, creating a hash entry that refers to an array. The entry
    in the hash is still a scalar value (satisfying the restriction placed on hash
    values), but as a reference, it now refers to something more complicated than
    a scalar - in this case, an array.


    Creating a reference is very easy. Simply place @ before the thing to be referenced.
    Here is code which creates a reference to an existing array, then adds the reference
    into an existing hash:


    ```

    %networks = ();

    @ethnets = qw( Ethernet-II IEEE802.3 IEEE802.3-SNAP );

    ```


    ```

    $e_ref = \@ethnets;

    ```


    $networks{''Ethernet Standards''} = $e_ref;'
