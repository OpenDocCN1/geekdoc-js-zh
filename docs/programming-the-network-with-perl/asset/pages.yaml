  md: '# The Net::SNMP Module 239


    **get_bulk_request** - sends the SNMPv2 get_bulk_request message to a Managed
    Device and waits for a response.


    **inform_request** - sends the SNMPv2 inform_request to a Management Station.


    **snmpV2_trap** - sends the SNMPv2 snmpV2-trap message to a Managed Device.


    **get_table** - uses a collection of get_next_request messages (SNMPv1) or a get_bulk_request
    message (SNMPv2) to request the retrieval of a table of data from Managed Device.


    **version** - provides a mechanism to get or set the SNMP version associated with
    the Net::SNMP object.


    **error** - returns the current error message associated with the Net::SNMP object.


    **hostname** - returns the IP name or address of the Managed Device associated
    with the Net::SNMP object.


    **error_status** - returns the current numeric error status associated with the
    Net::SNMP object.


    **error_index** - returns the current numeric error index associated with the
    Net::SNMP object.


    **var_bind_list** - returns a hash reference to the variable binding associated
    with the Net::SNMP object, and as a result of the last successfully SNMP response.


    **timeout** - gets or sets the number of seconds to wait for a request. The default
    is 5 seconds.


    **retries** - gets or sets the number of times Net::SNMP tries to send a message
    to a Managed Device. The default is one time.


    **mtu** - gets or sets the Maximum Transmission Unit associated with the Net::SNMP
    object. The default is 1500 objects¹¹.


    **translate** - gets or sets the Net::SNMP object translation methods.


    **debug** - switches on or off the Net::SNMP internal debugging messages. By default,
    debugging messages are off. It can be quite intuitive to switch them on (occasionally).


    In addition to the methods associated with a Net::SNMP object, the module provides
    three (non-OO) methods:


    **oid_context_match** - provides a mechanism to check if one OID is equal to,
    or a subtree of, another;


    **oid_lex_sort** - sorts a list of OIDs in lexicographical order;


    **ticks_to_time** - takes a raw ''timeticks'' value and converts it to a human-readable
    time string.


    > ¹¹ An octet is 8 bit byte.'
