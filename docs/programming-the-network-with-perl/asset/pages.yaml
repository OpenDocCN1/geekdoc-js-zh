    #  4.11 Email Enabling simplehttpd


    Let us extend the simplehttpd Web server to send an email message whenever an
    invalid HTTP request is received from a browser. Logging methods go, generating
    an individual message for every malformed HTTP request received by the server
    is excessive behaviour. Typically, such information would be logged to a disk-file
    for later perusal by the Web server administrator. However, this technique serves
    the user''s purpose in demonstrating how to automate email messages with Perl.


    #  4.11.1 The simple mail transfer protocol


    On the Internet, the Simple Mail Transfer Protocol (SMTP) is used to transfer
    text messages from mail system to mail system. SMTP is defined in RFC 821 and
    support for programming the protocol with Perl is provided by the Net :: SMTP
    module (which is part of the Net::inet library).


    > ¹If less is not installed on your Linux system, use the more command instead.
    If more is not installed on your Linux system, use cat. If cat is not installed
    on your Linux system, you are not using Linux!'
