  md: '# 250 Management


    meaning from network management raw data. However, it is possible to monitor a
    single data item and still perform a useful function.


    Consider a network manager who wishes to keep track of a collection of network
    devices. In addition to determining the ''uptime'' for each device, the network
    manager also wants to know which device (if any) has restarted recently.


    One strategy is to set a trap on each and every device to signal a Management
    Station whenever a restart occurs. However, this assumes a Management Station
    is operating continuously.


    Another strategy is to use the value of sysTime from the MIB-II system group,
    and note when the value returned from a Managed Device is less than some previously
    value.


    This is what the whatsup program does. Prior to issuing any SNMP requests, the
    whatsup program pre-processes a single file called whatsup.txt which contains
    the IP name or address of the device to keep track of, the community string when
    querying the device, and the most recent value of the sysUpTime in timeticks¹⁴.
    Within whatsup.txt, each of these values are delimited by a character:


    Here are the contents of whatsup.txt as it exists on pbmac.itcarlow.ie:


    ```

    149.153.100.10:public:0

    gw.itcarlow.ie:ffffff:0

    149.153.100.253:xxxxx:0

    glasnost.itcarlow.ie:public:0

    193.1.206.34:zzzzzz:0

    ```


    As before, the actual community strings have been changed to protect the network
    works used during the production of Programming the Network with Perl. When the
    whatsup program is executed, each Managed Device in the file is contacted, and
    the value of the sysUpTime OID is requested. The retrieved value is compared with
    the value in the whatsup.txt file. If the retrieved value is a larger timeticks
    value than that stored in the file, the Managed Device is assumed to be operating.
    Otherwise, the Managed Device is assumed to have restarted. At the end of each
    execution, the program updates the file with the most recently available data.
    As long as the program is executed with some reasonable frequency (perhaps once
    a day¹⁵), this strategy should produce results.


    Let us work through the source code to the whatsup program. The first five lines
    are as expected. Of note is the fact that the ticks_to_time subroutine is imported
    from Net :: SNMP and the sysUpTime OID is imported from the OIDs.pm module:


    > ¹⁴The number of hundreds of a second since the SNMP agent on the Managed Device
    started executing.


    > ¹⁵On Linux and Unix-like systems, the cron program can automate execution.'
  merge: -1
  pgno: 267
