  md: '# Transport Services


    Interactive - the client provides access to the services of the remote server
    to some interactive user, as the client is integrated into an application-level
    software program.


    Temporary - the client is started by a user needed, interacts with a remote server,
    and when finished, is shut down by the server. It is very rare indeed for a client
    to execute for an extended period of time.


    The client application temporarily becomes a client to the server, sends a request
    and waits for a response. When not interacting with the server, the client is
    interacting with the user. Clients do not necessarily contact the same server
    each time they are invoked (just think about how the World Wide Web works). They
    can run on any network device, but are typically found on user computers: PCs,
    Macs and workstations.


    # 3.1.2 Server characteristics


    The remote server application (or daemon) also conforms to a set of characteristics,
    as follows.


    Passive - the server waits passively for a client to initiate contact prior to
    performing some service.


    Non-Interactive - the server typically executes as a background process and, therefore,
    does not directly support interactions with a user of the network device it is
    executing (on other than perhaps logging error and status messages to a disk-file
    or system log).


    Permanent - once started, the server runs continuously until it is shut down by
    the operating system administrator.


    When a client contacts a server, the server springs into life and services the
    client''s request. A response message is sent to the client, after which the server
    waits, passively again, for another client to contact it. If no client ever contacts
    the server, the server does nothing but wait.


    Servers can execute on any network device. However, it is customary to find them
    installed as a privileged process on large, centralized computer systems, although
    this is not a hard-and-fast rule. For instance, it is common when testing custom
    network applications to execute the client and server on the same network device.


    # 3.2 Transport Services


    The Socket API provides the mechanics of network programming, and the client/server
    model provides a workable design. The last consideration is the selection of an
    appropriate transport service.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '102 Sockets


    A transport service arranges to send application data from one end-system network
    device to another other end-system network device. The transport service does
    not concern itself with how this is accomplished by the underlying networking
    technology. It is concerned only that the services provided by the network layer
    allow it to send its data through the network.


    Within TCP/IP networks, two transport service protocols are available to the network
    programmer, the User Datagram Protocol (UDP) and the Transmission Control Protocol
    (TCP). Based on the characteristics of the custom network application being designed,
    one or other of these transport service protocols is selected to build the application.


    # 3.2.1 Unreliable transport


    UDP, the User Datagram Protocol, is a lightweight, unreliable transport service
    protocol. It is ''lightweight'' because it provides very little additional functionality
    over and above what is provided by the TCP/IP Network Layer Protocol, the Internet
    Protocol (IP). Indeed, the provision of support for the protocol-number is required
    of UDP. It is ''unreliable'' in that it does not concern itself with ensuring
    that the application data arrives at the destination end-system that arrives without
    error, that it is not duplicated, that it arrives in the order which it was sent
    or more UDP datagrams within the data stream may have been delayed. UDP is a best-effort
    transport service.


    Another important feature of connection-oriented transport is the provision of
    flow control services. Without flow control, a faster sender can easily swamp
    a slower receiver with data. UDP provides no flow control mechanism to the network
    programmer. UDP does not check that remote system is ready to receive data or
    that it is operational. UDP sends the data to the network and, rather optimistically,
    hopes for the best.


    So, is it appropriate to use UDP, ever? When the network application can withstand
    some data loss, UDP may be appropriate, if the application does not incur large
    overhead when communicating. An application may be the provision of a video-feed
    over a wide-area network (WAN). Typically, it is more important to ensure a steady
    stream of data through the network than to ensure every single bit of data is
    delivered. If the odd packet goes astray (or becomes corrupt), it should not impact
    the viewing pleasure of the user, especially if ''works out'' every 1 packet is
    delivered. The show must go on, after all.


    Another important use of UDP occurs on the local-area network (LAN). LAN technology
    is designed to confirm for best-effort data delivery principles, and is, therefore,
    classed as unreliable. However, LANs are typically implemented in hardware, they
    tend to operate in a highly reliable manner. This contradiction in terms can be
    exploited by the unreliable UDP when operating on a LAN. By piggybacking UDP on
    top of the ''reliable'' LAN, a custom network application may'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Transport Services


    not suffer data loss, but only when operating on the LAN. Move the application
    from the LAN to a wide-area network (WAN) and the lack of any inherent reliability
    in the underlying network has UDP the potential to exhibit unreliable results.


    The classic example of UDP on LANs occurs with the Domain Name System (DNS), used
    to translate Internet names (e.g., itcare.com) into Internet numbers (149.153.100.67).
    As each Internet site maintains a DNS server on its LAN, it makes sense to configure
    the network devices attached to the LAN to use UDP to conduct the DNS, and keep
    the communication associated with this service to a minimum.


    UDP can, of course, be made more reliable by the addition of program logic to
    deal with shortcomings. However, program logic has to be added to the application
    using UDP. Adding additional program logic to handle the unreliable nature of
    UDP is rarely justified. If more reliable communications are required, TCP should
    be considered.


    # 3.2.2 Reliable transport


    TCP, the Transport Control Protocol, is a highly monitored, reliable transport
    service protocol. TCP monitors the communication between two end-systems to ensure
    that reliability is maintained. TCP will ensure that all data arrive without error,
    will not be duplicated and will maintain the order in which they were sent (if
    one or more of the TCP segments within the stream are delayed). TCP accomplishes
    this by using a variety of technologies. Any further discussion of this is beyond
    the scope of Programming the Network with Perl. Please refer to the Print Resources
    section at the end of this chapter for suggested reading.


    Flow controls will never swamp a slower receiver, as TCP will arrange to throttle
    the fast sender so that it sends data at a speed which the receiver can handle.
    This helps to ensure that TCP connections remain reliable. TCP also ensures that
    the remote system is both operational and receiving data before commencing any
    transfer.


    The majority of custom network applications on TCP/IP use TCP as their transport
    service protocol, as they cannot tolerate any level of data loss. What would a
    file transfer program be if its users could not depend on the entire file being
    transferred in an error-free manner? The same goes for terminal emulation programs
    and Web applications. From the network programmers of view, TCP is very useful
    because it provides this reliable service as a standard feature. The programmer
    specifies that TCP is the transport service protocol to use, then builds the custom
    network application confident that communication will be reliable.


    Of course, there are occasions when it is not appropriate to use TCP, since inbuilt
    reliability comes at a price. Typically, TCP carries with it considerable over-


    ![](img/7ba56e5cb69c2c76418ce14c4839c8b2_120_0.png)'
