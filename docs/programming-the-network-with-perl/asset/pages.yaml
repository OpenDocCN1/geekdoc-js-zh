  md: '# Preface


    The study of Computer Networking, long considered an adjunct to traditional third-level
    computing programmes, the Institute of Technology, Carlow, where I lecture, was
    the first third-level college in Ireland to develop an advanced four-year degree
    programme devoted entirely to the study of computing from a networking perspective,
    and are trained in traditional programming technologies such as C++ and Java.
    In addition, the established degree programmes have been periodically reviewed
    to include new mainstream technologies, with recent emphasis on including the
    technologies associated with computer networks, concentrating on a programming
    perspective, on network sockets.


    Using a traditional programming language to program network sockets (and networking
    in general) is a well-established practice. (Unfortunately, some students have
    difficulty grasping the details of these languages, and, consequently, struggle
    with the complexities of programming network sockets. However, when a higher-level
    language like Perl is used, students are more comfortable with it and enjoy greater
    programming success.


    Of course, there is more to programming the network than programming network sockets.
    The modern network programmer needs to be able to analyse the traffic patterns
    generate, interact with standard network protocols, and manage complex network
    systems.


    # What is in this book


    This book supports the study of computer networking through the medium of Perl
    programming.


    Following an introduction to Perl (in Chapter 1, Meet Perl), the focus is on debugging.
    Programmers know how to debug programs. When it comes to the network, they need
    to know how to debug communications. In Chapter 2, Snooping, some simple Perl
    programs are built to capture and analyse the traffic applications generate. In
    the absence of any custom network applications, these simple programs are used
    to analyse the traffic generated by some standard network technologies.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "xiv\tPreface\n\nWith the analysis tools in place, Chapter 3, Sockets, details\
    \ the creation of a collection of custom network applications using the Socket\
    \ application programmer interface. These are then developed to add increasing\
    \ levels of sophistication.\n\nThe experience of building networked applications\
    \ is good preparation for interaction with the standard protocols of the Internet,\
    \ the biggest computer work of all. In Chapter 4, Protocols, the standard and\
    \ add-on of Perl are used to interact with a selection of standard protocols and\
    \ applications.\n\nIt is important to build robust custom network applications.\
    \ It is also important to be able to manage the networked environment within which\
    \ these applications operate. The Internet provides the mechanism to do this,\
    \ and Perl is used to program it in Chapter 5, Management.\n\nProgramming the\
    \ Network with Perl concludes with Chapter 6, Mobile Agents, which explores an\
    \ area of computer networking that is generating considerable research. Many believe\
    \ Mobile-Agent technology to be one of the next big things’ on the Internet.\n\
    \nAt the end of each chapter, a list of Perl and Web Resources is provided to\
    \ facilitate further study. All chapters conclude with a set of programming exercises.\n\
    \n# Who should read this book?\n\nProgramming the Network with Perl evolved from\
    \ my involvement in teaching a30 week computer networking module to a group of\
    \ final-year undergraduate software engineers. The material presented here is\
    \ derived from the practical material developed for the course. Since there is\
    \ a high practical content related to the study of computer networking, Programming\
    \ the Network with Perl is highly complementary to such a course. In addition,\
    \ any course on programming Perl will benefit from the real world examples illustrated.\
    \ The professional programmer should also find the material interesting, as it\
    \ is no longer enough to program the computer – the modern programmer needs to\
    \ know how to program the network.\n\n# Platform notes\n\nThe Linux platform provides\
    \ a host for our work. Not only is Linux a modern, feature-rich operating system,\
    \ but it is also free of charge, and is, therefore, readily available. Linux provides\
    \ excellent support to the Perl programmer. All the code in Programming the Network\
    \ with Perl should run unaltered on any Linux platform, regardless of the underlying\
    \ hardware technology. Users of UNIX or BSD systems should experience no problems\
    \ running the code. When working on Windows or Mac OS (prior to release X), getting\
    \ the code in Chapter 2 to work will cause the most difficulty, although most\
    \ of the code in the other chapters should run unaltered on these non-UNIX operating\
    \ systems. For readers new to Linux, two appendices provide quick references to\
    \ the most frequently used Linux commands and to the v1 text editor."
  merge: -1
