    # 5.4 How traceroute works


    The traceroute starts by sending some data (unused UDP) to an unused protocol
    on the network device. Prior to sending any data, traceroute sets the Time-To-Live
    value in the IP header to 1. When the IP header is sent on its, the first router*
    to receive it decrements the Time-To-Live value, realizes that it is now zero
    and discards the IP datum (which is what the IP standard dictates should happen
    when the Time-To-Live value included in an IP packet reaches zero). Immediately
    prior to the discard, the router sends an ICMP message back to the network device
    that created the IP datum. The message, the Time Exceeded message, informs the
    receiver that an IP packet was discarded due to the Time-To-Live value reaching
    zero. To send the ICMP message, the router encapsulates the ICMP Time Exceeded
    message within an IP datum prior to delivery. When this arrives at the originating
    network device, it is applied to the application it is destined for, which in
    this case, is the traceroute program. Noting the arrival of a Time Exceeded message
    examines the IP header and extracts the contents of the Source IP address. This
    IP address identifies the router that sent the Time Exceeded message.


    Next, traceroute sends the original datum again, this time setting the Time-To-Live
    value to 2. The datum gets the first router (which decrements the Time-To-Live
    field giving it value 1) but, at the second router, the Time-To-Live value reaches
    zero and another ICMP Time Exceeded message is generated, which allows traceroute
    to determine the IP address of the second router. This


    > * Referred to as the first hop.'
