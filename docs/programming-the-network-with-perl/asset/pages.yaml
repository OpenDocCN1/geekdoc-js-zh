  md: '# The Network Debugger 85


    # 2.6.1 Processing command-line parameters


    The technology for processing command-line parameters in Perl is well established,
    and the standard module Getopt::Std makes things very convenient.

    The following code fragment initializes a series of scalar variables to hold the
    values of each of the command-line parameters:


    ```

    use Getopt::Std;


    our ($opt_c, $opt_d, $opt_m, $opt_n);

    our ($opt_p, $opt_s, $opt_u, $opt_v);


    getopts(''c:d:m:p:sv'');

    ```


    After using the standard module, the code declares extracts scalar variables to
    hold the value of each command-line parameter (the names of the variables must
    conform to that, namely opt_t followed by the letter associated with the parameter).
    A call to getopts extracts any command-line parameters from the operating system
    and sets the appropriate variable. The string to getopts subroutine indicates
    which parameters are Boolean switches, and which are not.

    If a is appended to the letter, the parameter is not a Boolean switch.

    The above code calls $opt_n, $opt_u and $opt_v as Boolean values, whereas $opt_c,
    $opt_d, $opt_m, $opt_p and $opt_s will have values associated with them.


    # 2.6.2 Storing captured results


    NetDebug will not display any results on the screen, for two reasons.

    Firstly, by avoiding direct I/O, NetDebug can be executed to operate as a background
    process on Linux (or UNIX-like) systems using the standard ''trailing-ampersand''
    notation. For example, this command-line will run NetDebug as a background process
    for five minutes, returning the user to the command-line immediately (to enter
    more interactive commands) as opposed to forcing the user to wait five minutes
    to issue another command:


    ```

    ./netdb -m5

    ```


    Secondly, screen I/O tends to be slow (compared with writes to memory or secondary
    storage). If NetDebug takes too long writing to the screen, a potential problem
    may arise: if NetDebug is busy writing to the screen, it may miss packets at the
    NIC. So, NetDebug tries to avoid this problem before it occurs, by not using screen
    I/O. Results will be written to secondary storage instead. This has the added
    advantage of producing a record of every execution of NetDebug.

    The results will be stored in a disk-file called netdb. Standard file handling
    code would be used to open, and to close the file:'
