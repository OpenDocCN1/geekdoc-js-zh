  md: "# 194 Protocols\n\n```\n$request = m\"[./].(*);\n$resource = $1;\n}\nprint\
    \ $resource, \" -> \";\n```\n\nThe code to strip leading dots and dashes from\
    \ the request URL requires further explanation. The stripping is accomplished\
    \ by the strange regular-expression pattern matching code in the else part of\
    \ the conditional statement. The pattern to match is delimited by the m and }\
    \ tokens. The pattern starts matching at the beginning of the line (*), and matches\
    \ zero or more leading dots and dashes [{,./*}]. If a match is made, the rest\
    \ of the line (.*) is remembered (by Perl) the $1 scalar, which then gets assigned\
    \ to $resource.\n\nThe reason for this code becomes clear when it is considered\
    \ that the server retrieves a resource (most like a disk-file) from its local\
    \ storage and returns it to the Web client. If a client was to send /etc/password\
    \ the requested URL, it is inappropriate for the HTTP server to locate the password\
    \ file from its local storage and send it to the client. So, simplehttp attempts\
    \ to sanitize the request by removing dots and dashes from the request. If the\
    \ request is for /etc/password,../etc/password///etc/password or ../etc/password,\
    \ the pattern matching code sanitizes the request to /etc/password, which forces\
    \ the server to look for the file relative to the directory it is running from.\
    \ Although not foolproof, this should thwart most crackers.\n\nThe code then checks\
