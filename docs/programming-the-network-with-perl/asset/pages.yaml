    **Figure 2.5** The NetPacket::TCP segment format.


    When a UDP datagram is created, the UDP technology handles the **entire** datagram
    to IP for delivery. If the UDP datagram is larger than the Maximum Transmission
    Unit (MTU) supported by the underlying networking technology⁴, the IP protocol
    will break the large UDP datagram into many smaller parts as are required to send
    the UDP datagram across the network. This process is referred to as IP fragmentation.
