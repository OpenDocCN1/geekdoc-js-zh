  md: 'Preparing To Snoop


    **Host To Network** - the underlying network technology (whatever that might be),
    and the protocols associated with physically moving bits of data ''across the
    wire''. On TCP/IP networks, a technology called ARP (the Address Resolution Protocol)
    helps IP to run on top of the underlying network hardware (which in Programming
    the Network with Perl is Ethernet).


    The TCP/IP-RM and the NetPacket:: protocols are an almost perfect match, except
    for the protocols at the application layer (which have no NetPacket equivalent).


    The NetPacket:: modules provide a simple interface. A method called decode takes
    a raw packet and returns a reference to a ''packet-object'' for the particular
    protocol. The packet-object returned from decode provides access to a collection
    of instance associated with the protocol being processed. Additionally, a subroutine
    strip allows a raw packet to be stripped of any protocol header information, i.e.
    the data part of the packet (its payload) is returned by each module''s subroutine.


    The Net::Pcap module provides a simple interface to the Net::Pcap library by providing
    three subroutines to the programmer: loop, open and next (discussed in section
    E.3, p. 41).


