  md: "# Doing More with LWPwwmb 185\n\n# 4.8 Parsing HTML\n\nThe HTML::Parser module\
    \ provides a framework within which documents written in HTML can be parsed by\
    \ a Perl program. Although complex, the module is very useful, and its authors\
    \ have gone to great pains to ensure it can work with the majority of HTML documents.\
    \ The module itself is event driven. By associating actions with certain occurrences\
    \ (or events), a program can allow for specific processing to specific points\
    \ within an HTML document. For example, a requirement might exist to print a message\
    \ to the screen when an anchor tag <a> is encountered. These event processors\
    \ are known as handlers and are nothing more than programmer-defined subroutines.\
    \ The HTML::Parser provides a mechanism to associate subroutines with events,\
    \ which allows to call the correct subroutine when the event occurs.\n\nRather\
    \ than describe the HTML::Parser module, let us look at a new version of LWPwwmb\
    \ code to identify hyperlinks and any textual description within a received HTML\
    \ resource. This version of the user's worst Web Browser is parsed lwpwwmb.\n\n\
    The code starts with LWPwwmb, but for the fact that the use of HTML::Parser is\
    \ specified:\n\n```\n#! /usr/bin/perl -w\n\nuse strict;\nuse LWP::UserAgent;\n\
    use HTML::Parser;\n```\n\nNext comes the definition of three subroutines (or event\
    \ handlers), to use the language of HTML::Parser). The first, print_dtext, is\
    \ invoked whenever the parser encounters some descriptive text with an HTML hyperlink.\
    \ The subroutine receives two parameters: a reference to the parser object and\
    \ any descriptive text. The text is simply printed to the screen with a short\
    \ descriptive tag. Just how the handler is set up will clear up in a moment:\n\
    \n```\nsub print_dtext {\n    my ($parser, $text) = @_;\n    print \"text -> \"\
    \ $text, \"\\n\\n\";\n}\n```\n\nThe next event handler, called end, is invoked\
    \ whenever an end-tag is encountered (for example, the </a> end-tag). The lWPwwmb\
    \ program is not interested in what the end-tag actually is, only that the default\
    \ text and end handlers are undefined when an end-tag is encountered. This code\
    \ stops the text and event handlers from over firing. To see what is meant by\
    \ this, comment out the\n\n> 11 Gisle A and Michael A. Chase."
