    associated with the IP datagram, it is not possible to determine if the IP payload
    is an entire UDP datagram or just part of one (and if it is part of one, where
    in the entire UDP datagram the part belongs).


    So, to work with UDP data within EtherSnoper, additional code is required to make
    sense of the (possibly fragmented) IP datagrams.

    The instance fields $ip_datagram->{flags} and $ip_datagram->{offreset} contained
    in the IP datagram object hold the information needed to determine if fragmentation
    has occurred.


    Possible values for the $ip_datagram->{flags} field are as follows.


    +   **000** - (decimal 0) this datagram may be fragmented, or this is the last
    and/or only fragment.

    **001** - (decimal 1) this datagram may be fragmented, and more fragments are
    coming.


    +   **010** - (decimal 2) do not fragment this datagram.


    Used in combination with the value of $ip_datagram->{offset}, these values determine
    if an IP datagram is part of a fragmented one or not, as the offset value identifies
    where in the datagram it belongs.


    Obviously, if flags is set to 2, then this is a non-fragmented IP datagram, because
    the network device that created the datagram set this flag, forbidding fragmentation
    to occur.'
