    #  5.14 Where To From Here?


    This chapter concentrated on network management, with the majority of the discussion
    given over SNMP. The Net :: SNMP add-module provides a Per API over SNMP, and
    formed the basis of a collection of Management stations. An alternative Per API
    to SNMP is provided by cmu-snmp (previously known as ucd-snmp and before). SourceForge,
    this technology provides an API for C and for programmers, which can be downloaded
    from the net-snmp website at http://www.net-snmp.org. The Per API is written and
    maintained by Giovanni Sart. In addition to the programming APIs, this technology
    provides a fully functioning SNMP agent that can be built, installed, and queried
    on most systems (including using Linux). The Per API is not unlike that provided
    by Net :: SNMP, in that there is support for providing get-request, get-request
    and so on. However, the API is somewhat more involved than provided by Net ::
    SNMP and can take some getting to. In the technology''s favor, SNMP supports all
    four versions of SNMP. The Net :: SNMP module supports only SNMPv1 and SNMPv2.


    Another CPAN module, Net by Wayne Marquette, provides a set of SNMP units that
    work in conjunction with Marz''s Per API to net-snmp. Jochen Wiedmann has created
    SNMP :: Monitor, which provides for the creation of automated monitoring mechanisms.
    Available on CPAN, the SNMP :: Monitor also is built on net-snmp.


