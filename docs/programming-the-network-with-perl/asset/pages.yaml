    ```

    Bareword("CLIENT_SOCK") not allowed while "strict subs" in use at tcp_s5 line
    86.

    tcp_s5 had compilation errors.

    ```


    This is all well good, but imagine that this version of the server was deployed
    on an Internet-accessible network device, and that remote checking was widely
    advertised. Now imagine that the server receives ten thousand hits per day. At
    certain times of the day, the server may be swamped with requests from clients
    and the SOM queue may be reached and exceeded. When this happens, connections
    are refused by the server. Connections may also be refused by the server if a
    particularly large file is being checked, resulting in the server waiting for
    the socket to complete. While the server waits, it is not calling accept, which
    may result in an excessive queuing delay for a client, or - in some cases - connection
    refusals. A number of strategies for dealing with these eventualities exist, and
    by far the most widely used is to create a concurrent TCP server, which creates
    a subprocess to handle each successful connection client.


    # 3.13 The Concurrent Syntax Checker


    In this section, code will be added to the Remote Syntax Checker to support concurrent
    operation. The technique used is not very different from that employed by the
    udp_c8 client earlier in this chapter.


    The code begins by using the appropriate modules, then defining the child subroutine
    that responds to CHLD signals:


    ```

    #! /usr/bin/perl -w

    ```


    ```

    use strict;

    use Socket;


    use POSIX ":sys_wait_h"

    ```'
