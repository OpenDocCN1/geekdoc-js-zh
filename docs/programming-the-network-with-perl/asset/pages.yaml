  md: '# Perl Operators


    In a number of the examples seen so far, various code snippets have relied on
    condition tests that have used comparison operators. They have been rather sneakily
    used, without providing any detailed description. Nobody a sneak, so here is the
    entire list of Perl operators (with brief explanations) in precedence, starting
    with the highest precedence.


    +   - the inference difference arrow operator, used when working with references
    (and objects).


    +   ** - the increment and decrement operators.


    +   ** !=, \!, + and - the logical negation (!), bit-wise negation (^), reference
    (\), numeric affirmation (+) and arithmetic negation (--) operators.


    +   = = and - the binding operators (used when working with regular expressions
    and pattern matches).


    +   *, /, % and x - multiply, divide, modulus (%) and repetition (x) operators.


    +   +, - - the addition, subtraction and concatenation (.) operators.


    +   << and >> - the left and right shifting operators.


    +   <, >, <=, >=, !=, lt, gt, le ge - the relational operators. There are two
    of each, one for working with numbers and the other for working with strings.
    Be careful to use <, <= and >= when comparing numbers, and lt, gt, le ge when
    comparing strings.


    +   !=, <=, eq, ne and cmp - the equality operators. As with the relational operators,
    different versions exist for use with numbers and strings. The <= and cmp operators
    are used for comparison, and are typically used in conjunction with the built
    sort subroutine.


    +   & - the bit-wise AND operator.


    +   | and ^ - the bit-wise OR or eExclusive OR operators.


    +   && - the logical AND operator.


    +   || - the logical OR operator.


    +   .. and ... - the range operators.


    +   ?:- the ternary conditional operator.


    +   =, +=, -=, &= and so on - the assignment operators.


    +   , and => - the comma operator (typically used to separate list items).


    +   not - a lower precedence alternative to !.


    +   and - a lower precedence alternative to &&.'
