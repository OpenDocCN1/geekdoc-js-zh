  md: "# Meet Perl\n\nblocks causes a fatal error (which would normally cause the\
    \ Perl interpreter to exit immediately from a program), eval catches the fatal\
    \ error and provides a way to recover from the error. The built-in variable $0\
    \ will be set by eval on exit from the code block. However, if the value of $0\
    \ is a non-empty string, a fatal error occurred and a description of the error\
    \ is in $0. Therefore, provides a simple, yet highly useful, exception-handling\
    \ mechanism.\n\nIn the code which follows, a inbuilt die subroutine causes the\
    \ generation of a fatal error (and message). When called outside an eval block,\
    \ the program would end immediately. When called inside an eval block, the evaluated\
    \ code ends and $0 variable is set to the message from die. Here is an eval example:\n\
    \n```\neval {\n    print \"This is Apollo 13. Mission Log.\\n\"\n    print \"\
    We are half-way to the Moon.\\n\";\n\n    die \"Houston, we have a problem!\\\
    n\"\n    if ($0) {\n        print \"Message from Apollo 13 - $0\\n\"\n       \
    \ print \"Let's bring them home safely ... \";\"\n    } else {\n        print\
    \ \"Maybe 13 is not that unlucky after-all ... \";\"\n    }\n}\n```\n\nDue to\
    \ the fact that the call die is within the eval block, the program can recover\
    \ from what would otherwise be a fatal error (and go on to save the astronauts).\
    \ The else part of the if statement will never execute in this code, but is included\
    \ here for illustration purposes.\n\n# 1.3.10 Statement modifiers\n\nIn addition\
    \ to the control flow mechanisms which enclose blocks of code, Perl also provides\
    \ support for statement modifiers. With these, individual statements can be qualified.\
    \ A series of examples 'Hello World' will help to illustrate.\n\nThis code prints\
    \ the words 'Hello World' if the value of $should_we has value (i.e. if it is\
    \ defined):\n\n```\nprint \"Hello World\" if defined($should_we);\n```\n\nThis\
    \ code prints the words 'Hello World' unless the value of $today is Saturday:\n\
    \n```\nprint \"Hello World\" unless today eq 'Saturday';\n```"
