    # 6.13 The Cloning Mobile-Agent ipdetermine


    The bandwidth utilized by the ipdetermine.pa mobile agent can be further reduced
    by arranging for just the results produced by the mobile agent back to the initiating
    network device, as opposed the entire mobile agent.

    To accomplish this, ipdetermine.pa needs to include some standard Socket API sending
    in addition to the SNMP processing code. The strategy employed borrows code from
    the UDP client and server examples from Chapter 3, Sockets. UDP is chosen as the
    transport service for the reasons it is used by SNMP; it is lightweight, incurs
    little overhead and is easy to implement.

    The mobileagent architecture is multi-launch and designed to allow a mobile agent
    to roam a collection of MAEs, performing processing at each intermediate MAE before
    processing results at the final Receiving MAE. This design worked well with the
    ipdetermine.pa program. However, with the cloned version of the program, the mobile
    agent travels to only one MAE (on the routing device), interacts with the SNMP
    software executing in the multilunch.rc disk-file, the current design would never
    execute the do_it method (as the design arranges never to execute the method on
    the final Receiving MAE). Consequently, any code that needs to execute on the
    routing device needs to be at the at_end method, not in do_it.


    A new version of the mobile agent called ipdetermine.pa implements the strategy
    outlined above, and here is the source code:


    ```

    #! /usr/bin/perl -w

    use strict;

    use 5.6.0;


    package Agent::IpDetermineCloneMa;


    use Socket;

    use Net::SNMP;

    use OIDs qw(sysDesc

    ipRouteTable ipRouteDest

    ipRouteType ipRouteNextHop);


    use constant SENDTO_UDP_PORT => 40001;

    use constant REMOTE_HOST => ''localhost'';

    use constant RESULTS_RECV_LEN => 40001;

    use constant MAX_REC_LEN => 65536;

    ```'
