  md: 'After a brief description of ICMP and two ICMP-based applications, this chapter
    examines SNMP from the perspective of the Perl programmer building programs to
    assist in the process of network management.


    # 5.1 Simple Management with ICMP


    Every implementation of the Internet Protocol, including the current IPv4 standard,
    must support for ICMP, the Internet Control Message Protocol, as defined in the
    Internet standards document RFC 792. This simple technology provides IP with a
    message of indicating when certain problems have occurred on an IP network. These
    problems include, but are not limited to, the


    **A discarded datagram** - an IP datagram was discarded and was not delivered
    to its destination network device.


    **A routing inconsistency** - a router has noticed a routing inconsistency, which
    may mean that IP datagrams are being incorrectly routed within the network (resulting
    in their discarding).


    **Destination not found** - an IP datagram could not be delivered because the
    destination network device could not be found. Alternatively, the network to which
    the destination network device is attached could not be found.


    **A busy network device** - a network device, typically a router, is busy and
    cannot accept any more datagrams (at this time).


    To keep things simple (and easily implement), ICMP does not concern itself with
    the cause of any problem, only its occurrence.


    In addition to identifying problems (or errors), ICMP also provides informational
    service. These informational messages include the following:


    +   **Timer messages** - provide a mechanism to determine the round-trip time
    lag between the local and a remote network device.


    +   **Echo messages** - provide a mechanism to determine whether or not a specified
    network device is operating and potentially willing to accept IP datagrams.


    RFC 792 documents the ICMP informational and error messages in detail.


    # 5.2 Doing the Ping Thing


