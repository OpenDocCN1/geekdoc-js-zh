    Secure JSON Requests


    **Building Secure JSON Responses**


    Securing JSON responses from hijacking on the server has two main requirements


    that need to be met as part of application architecture. These are:


    • Ensure a properly formatted JSON object


    • Use POST to retrieve sensitive data via JSON


    Another way to put this is:


    • Never return JSON arrays


    • Never use GET requests for sensitive data


    A properly formed JSON object is not executable by JavaScript. A JSON array is


    executable by JavaScript. Using POST only to return JSON objects prevents remote


    scripts from obtaining private data via a GET request and authentication cookie.


    The Anti-Pattern for Insecure JSON Implementations would be an architecture


    that has the following elements in place. CSRF attacks using JSON Hijacking


    depend on:


    • Server returning sensitive data via JSON and GET


    • Server returning JSON array


    • Remote script overwriting local JavaScript array constructor


    • Server responding to GET requests using Auth Token


    • Auth cookie accessible via JavaScript


    • JavaScript that parses responses with eval()


    *Correct and Incorrect JSON*


    Here is a properly formed JSON object, enclosed with curly braces. It has a top
    level


    object with each element double quoted and separated by a colon.


    **{**"riders" : {"rider" : "Valentino Rossi", "team" : "Yamaha"}**}**


    And here is an exploitable JSON array, enclosed with brackets.


    **[**{"rider" : "Jorge Lorenzo", "team" : "Yamaha"}**]**


    **Note****:** All JSON elements must be double quoted to be parsed with $.parseJSON().'
