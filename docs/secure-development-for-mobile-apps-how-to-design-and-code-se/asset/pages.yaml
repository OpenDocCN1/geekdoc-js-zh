    \ncompression on as well. Until flushed, no output\n\nis sent from the script,\
    \ except headers.\n\n</p>\n\n</body>\n\n<?php\n\nob_flush();\n\n?>\n\n*Cryptography\
    \ and Hashing Functions*\n\nThese are the modern, tested, and high-powered encryption\
    \ functions that should\n\nnow be used for protection of data. Many examples on\
    \ the web incorporate md5()\n\nand sha1() with rand(). These are outdated and\
    \ should no longer be used. See the\n\nsection “Deprecated Security Functions”\
    \ for more details.\n\nThere are two main encryption tasks that developers need\
    \ to perform—one-way\n\nhashing, and two-way encryption. Each is covered below.\
    \ Detailed API is covered\n\nin Chapter 11\\. Actual use is covered in Part II,\
    \ on Session Management.\n\nIn order to be effective, both hashing and encryption\
    \ need effective random\n\n­numbers for seeding. This cannot be done with rand(),\
    \ which is predictable. The more\n\nimproved methods of random number generation\
    \ are an important tool to always\n\ntry to use. These methods are known as *CSPRNG*\
    \ (Cryptographically Secure Pseudo\n\nRandom Number Generators) and are proven\
    \ to be randomly unpredictable.\n\nIn PHP, we have two choices, openssl_random_pseudo_bytes()\
    \ and\n\nmcrypt_create_iv(). The iv stands for *Initialization Vector*. This is\
    \ the new way\n\nto generate random numbers for stronger encryption. For the most\
    \ part, in the appli­\n\ncations in this book, these CSPRNG functions will generate\
    \ what is known as *salt*,\n\nwhich the hashing and encryption functions require\
    \ in order to be unpredictable.\n\n*Modern Crypto*\n\nThere are two main encryption\
    \ functions in PHP and both are applied in this\n\nbook. These are crypt() and\
    \ mcrypt_encrypt(), and they achieve slightly\n\n­different results. Both are\
    \ internationally known and tested as being effectively"
