    \ SessionManager*\n\nPerforming a secure logout is not automatic or entirely intuitive.\
    \ To completely\n\nand securely remove a session and prevent its revival, several\
    \ explicit steps must be\n\n­performed. The critical session management details\
    \ are:\n\n• Ensure each page contains a visible logout link.\n\n• Delete session\
    \ cookie(s) by correctly expiring them.\n\n• Delete session record.\n\n• Delete\
    \ all session variables.\n\n• End script immediately.\n\n• Redirect to logout\
    \ confirmation page.\n\nperformSessionLogOut() This function is very important\
    \ to protecting session\n\nintegrity. The guarantee of this function needs to\
    \ be that all elements of a session are\n\nremoved and no parts are left to revive\
    \ or disclose information. There is not a single\n\nfunction which will accomplish\
    \ this, so each element of a session must be explicitly\n\ndeleted.\n\nThe first\
    \ step is to remove the session array from memory with unset().\n\n//destroy all\
    \ the session variables.\n\n**unset**($_SESSION);\n\nThis destroys all the variables\
    \ in the session array and prevents any further access to them.\n\nThe next step,\
    \ depending on how session management is configured, is to remove\n\nthe database\
    \ record or system file. This is done with a call to session_destroy().\n\nsession_destroy();\n\
    \nThe last step for this application is to explicitly expire the cookie to force\
    \ the client\n\nbrowser to remove the session ID cookie from its cache.\n\n**setcookie**(session_name(\"\
    mobilesec\"),\n\n'',\n\n\a1, //one tick past unix epoc time for immediate\n\n\
    expiration\n\n$params[\"path\"],\n\n$params[\"domain\"],\n\n$params[\"secure\"\
    ],\n\n$params[\"httponly\"]);"
