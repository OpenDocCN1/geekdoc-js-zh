  md: '**19**


    **Web Application Attack Surface**


    One of the simplest attacks is Session Fixation. An example of this is outlined


    below. It exploits the fact that the session ID can be created by the user, and
    that the


    server code accepts this ID; therefore the attacker creates the ID himself.


    In this attack, MyBankCorp.com accepts an ID submitted in the user request. This


    means that the attacker can send an email, with a link to MyBankCorp.com with
    the


    session ID he wishes to use, like this.


    http://mybankcorp.com/?SessionID=88xx99yy88


    The recipient of the email with this link in it then clicks it. The user will
    be asked to


    log in to the site, and the new, authenticated session ID will be ‘88xx99yy88’,
    which


    the attacker knows, because he created it. Now a legitimate user has authenticated
    a


    bogus ID, making it good to use for the attacker. The attacker can now log in
    using


    that session ID as long as the legitimate user doesn’t log out with it. The cure
    for this is


    for the server code to only allow an ID that it generates itself, and to regenerate
    session


    IDs whenever a change is requested.


    **Defending Input and Output Streams: First Glance**


    This section outlines some specific issues targeting each area. These are simple
    first


    steps and do not address the actual complexity each input and output type requires


    in a real application. We address those in detail later. The purpose here is to
    begin


    to visualize in one’s mind the whole attack surface and what the beginning steps
    for


    ­coding a defense for each type of attack vector are.


    *GET Requests*


    Our first step is to determine and enforce the type of data being requested. In
    this


    case, it is an integer, so we want to filter it as such. By validating the variable
    as an


    integer, we close off all attacks via this vector.


    http://www.mobileapp.com/page.html?page=12


    $pageNumber = intval($_GET[''page'']);


    We now have either a harmless user-supplied integer or we have zero, which is
    also


    harmless.


    It is important to recognize what the ‘page’ variable is. Because its usage is
    an inte­


    ger, validation becomes easier and useful. If ‘page’ were treated as a string
    and had


    my_sql_real_escape_string() run on it, the variable would only be escaped


    as a string for input into the database and could still contain harmful JavaScript
    code


    that could end up being reflected back into HTML parsed by a browser. Integers
    do


    not alter SQL queries. Strings do. The source problem is that all input coming
    into


    PHP are strings. Without proper type validation and conversion to integer, those


    strings are sent to the database engine as part of the SQL query and misinterpreted.'
