  md: "**202**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nCookies cannot be\
    \ forcefully deleted from a client browser. There is no way to reach\n\ninto a\
    \ client browser and explicitly remove a cookie file. A call to unset($_COOKIE)\n\
    \nonly deletes that array from the server. If the client makes another request\
    \ with that\n\ncookie, the servers $_COOKIE array would again be repopulated with\
    \ that same\n\nvalue. The only way to remove the cookie is to expire it with a\
    \ time set far enough into\n\nthe past so that the client’s browser will delete\
    \ it from its cookie cache.\n\n**Encrypted Session Storage**\n\nIn these next\
    \ two parts, it is shown how to encrypt session data for storage in files, or\n\
    \nas records in a MySQL server database.\n\n*Encrypted Session Storage via MySQL*\n\
    \nThe class SecureSessionPDO is listed below in its entirety. It is a completely\
    \ con­\n\ntained drop in class for any application. Simply include the class at\
    \ the beginning of\n\nall pages needing to use the updated storage mechanism.\
    \ Storage is transparent to the\n\napplication. The complete class can be found\
    \ in the file SecureSessionPDO.php in the\n\nexample source code included with\
    \ this book. At the bottom of the class, each func­\n\ntion is explained in detail.\
    \ The source code file is heavily commented inline and each\n\noption is explained.\n\
    \nImportant points are that by default PHP uses exclusive file locking on session\
    \ files.\n\nThis ensures that no other incoming script call can read or write\
    \ to the file until the\n\ncurrent script finishes, an important consideration\
    \ in architecting AJAX applications.\n\nTo replicate this behavior in a custom\
    \ session handler class, the implementation needs\n\nto also explicitly lock the\
    \ record during the scripts execution. The code to implement\n\nrecord locking\
    \ is pointed out and fully explained.\n\n*Creating a Custom Session Handler in\
    \ MySQL*\n\nTo create a session handler which uses MySQL, two key things need\
    \ to be done, First\n\na table needs to be created to hold the session data, and\
    \ then the default PHP func­\n\ntions need to be overwritten, telling PHP to now\
    \ call the new functions which send\n\nand retrieve the data to MySQL. This is\
    \ done by calling the session_set_save_\n\nhandler() with the new function names.\n\
    \n*Creating the Session Table * The schema for the session table must include\
    \ a field for the\n\nsession ID and it must be the correct size to hold session\
    \ ID with wasting space. The\n\nsize of a session ID is determined by the ‘session.hash_bits_per_­character’\n\
    \nsetting. This application uses level 6 bit setting, which results in a session\
    \ ID string\n\nlength of 43 characters. There needs to be a variable text field\
    \ for holding the session\n\ndata itself, and a timestamp field."
