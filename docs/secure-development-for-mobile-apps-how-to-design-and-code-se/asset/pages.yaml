  md: "**78**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n“I need a ­factory,”\
    \ and it is understood what code should be written. Design patterns\n\nare not\
    \ a concrete implementation. There is no single factory code base of reusable\n\
    \nfunctions. Instead, there is general pattern idea that describes what a factory\
    \ should\n\ndo and the basic functionality it should have. When a teammate delivers\
    \ an implanted\n\nfactory to the team it is nice to know that code produces automobile\
    \ objects but is not\n\nan automobile itself.\n\nThere are 23 general design patterns\
    \ described in *Design Patterns*. Several of them\n\ncan be leveraged to achieve\
    \ better security coding practices. The Singleton pattern is\n\neasily the most\
    \ famous. The concept of a single, global application object t is easily\n\nunderstood\
    \ and incorporated. The Singleton is an important architectural element\n\nand\
    \ serves a powerful purpose in security development. This book uses this pattern\n\
    \nfrequently because it consolidates code, and is easy to use.\n\nThere are other\
    \ design patterns that are less well known, especially, it seems, in the\n\narea\
    \ of secure programming, and these patterns are demonstrated in a secure design\n\
    \nintended to simplify and enforce security procedures. The following patterns\
    \ can be\n\nvery useful, and therefore this book uses them for securing code.\
    \ They are, in no\n\nparticular order, Abstract Classes, Interfaces, Façades,\
    \ Template Functions, Strategy,\n\nFactory and Builder Patterns, and Visitors.\n\
    \nAbstract classes are important because they define functional behavior, but\
    \ not\n\nimplementation. An array might need to have a validate function, and\
    \ a user object\n\nmight need a validation function, but each will have a different\
    \ way it needs to be\n\ndone. However a caller of the object doesn’t want to know\
    \ about that difference.\n\nAbstract classes help achieve that.\n\nInterfaces\
    \ are very useful from a security perspective, as they decouple communica­\n\n\
    tion and implementation between objects. With Interfaces, different objects with\
    \ the\n\nsame interface can be passed to the same functions for processing. For\
    \ example, giv­\n\ning a group of different objects an encryption interface, IEncrypt,\
    \ means that those\n\nobjects could all be called and encrypted in simple loop\
    \ by a single function which\n\nexpects objects with an IEncrypt interface, such\
    \ as doEncrypt(IEncrypt $obj).\n\nSeparating the call for encryption from the\
    \ exact implementation of the encryption\n\nprovides secure flexibility which\
    \ we examine later.\n\nFaçades, universally known as *wrappers*, provide a much\
    \ needed way to simplify\n\nfunction calls and help reduce repletion. The isolation\
    \ they provide helps to enable\n\nseparation of duties, such as keeping PHP out\
    \ of HTML as much as possible.\n\nTemplate patterns are enforcers; they ensure\
    \ that certain steps are taken together as\n\na sequence, while at the same time\
    \ decoupling the implementation. Input filtering is a\n\ngood example of where\
    \ Templates can be very powerful for controlling validation and\n\nfiltering.\
    \ Templates in PHP are based on the keyword *final*. Here is an example as it\n\
    \ncould relate to a secure procedure.\n\nabstract class TemplateStringValidator\
    \ {\n\n///function must be overridden\n\nabstract function checkUTF8($obj);"
