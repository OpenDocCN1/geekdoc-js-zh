  md: "**324**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nEach step is critical\
    \ in preventing malicious files from harming the system. Incorrectly\n\nimplementing\
    \ one step compromises the entire process.\n\n*Authentication of File Uploads*\n\
    \nFile uploads should only be allowed by authenticated users of the site. This\
    \ does not\n\nensure the safety of the file, it only assists in tracking uploaded\
    \ origins if the need\n\narises.\n\n*Create White List of Allowable Types*\n\n\
    It is important to create a white list of the types of files that the application\
    \ will allow,\n\nsuch as PDF files, or GIF and PNG files for a photo only gallery.\
    \ It prevents users\n\nfrom uploading any kind of file they want, unless of course\
    \ the purpose of the applica­\n\ntion is to accommodate all types of file uploads.\n\
    \n*File Extensions and Types Are Meaningless*\n\nEven after creating a white list\
    \ filter, file extensions and type are meaningless. A virus\n\ncan hide anywhere.\
    \ Treat all files as a virus. Filtering by extension helps in eliminat­\n\ning\
    \ obvious garbage from being uploaded but does not ensure safety, and it does\
    \ not\n\nensure that a file is what it says it is.\n\n*Create a System-Generated\
    \ File Name*\n\nIt is very important to not use the user-supplied file name as\
    \ the file name for saving\n\nthe file on the server. An attacker must be prevented\
    \ from having a known name that\n\ncan be invoked via some process. Always create\
    \ a system-generated random file name\n\nto reference for future use.\n\n*Always\
    \ Store Uploaded Files Outside Web Root*\n\nUploaded files must be prevented from\
    \ being called directly via a web request on the\n\nweb root directory. Storing\
    \ uploaded files with a different name, outside the web root,\n\nensures attackers\
    \ are not able to retrieve the files via external requests.\n\n*Enforce File Size\
    \ Limits*\n\nA maximum file size should always be set in both the upload form\
    \ and as a server side\n\ncheck, to prevent denial of server attacks consuming\
    \ too much disk space."
