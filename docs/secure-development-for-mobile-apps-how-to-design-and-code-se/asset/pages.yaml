    *Server UTF-8 Validation*


    Even though the client browser has been told to send valid UTF-8 characters with


    **header**(''Content-Type: text/html; charset = utf-8''),


    the server still needs to verify the character set to account for any cases where
    invalid


    characters have either accidently or maliciously been sent.


    One way to validate whether incoming strings contain valid UTF-8 is:


    $utf8 = mb_detect_encoding($string, "UTF-8");


    if ($utf8 ! = ''UTF-8'')


    {


    header("Location: $LOGIN");


    exit(0;


    }


    This process only checks the data and stops processing the script if invalid characters


    are detected. It does not attempt to correct or remove invalid characters.


    An alternative but potentially unsafe method is to employ a destructive sanitiza­


    tion process. This ensures that a string contains only valid UTF-8 characters
    by using


    iconv() to filter out invalid characters with the IGNORE flag to suppress notices.


    The process is potentially unsafe if not correctly validated after conversion
    because


    silently dropping invalid characters can actually form an attack string. For example,


    ‘DE**X**LETE’ becomes ‘DELETE’.


    $string = **iconv**("UTF-8","UTF-8//IGNORE", $string);


    The $string variable now contains only valid UTF-8 characters sequences but may


    no longer be meaningful.


    Another method is to detect the encoding first.


    $utf8 = mb_detect_encoding($string, "UTF-8");


    if ($utf8 ! = ''UTF-8'')


    {


    //string is not UTF-8, forcefully convert it'
