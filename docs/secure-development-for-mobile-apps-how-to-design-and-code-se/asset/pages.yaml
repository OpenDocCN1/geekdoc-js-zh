    \nThe MySQL REPLACE INTO statement is a powerful and convenient shortcut.\n\n\
    It works like the INSERT statement with these additional rules:\n\n• If the record\
    \ to insert does not exist, REPLACE inserts a new record.\n\n• If the record to\
    \ insert already exists, REPLACE deletes the old record first\n\nand then inserts\
    \ a new record\n\nWith the record successfully updated and a new timestamp set,\
    \ the PDO transaction\n\nin progress, which was initiated in the read() function,\
    \ is committed, and the record\n\nlock released.\n\nThere is no data to return.\n\
    \ndestroy()  is called manually via session_destroy(). It is essential to\n\n\
    explicitly destroy sessions. It is the only secure way to delete session data\
    \ and remove\n\nthe possibility of account or session leaking and session ID hijacking.\
    \ The session ID\n\nis the only parameter passed to destroy(). This ­function\
    \ needs to take all action\n\nnecessary to delete all session data related to\
    \ the session ID passed in.\n\nThis implementation performs three tasks.\n\n•\
    \ Detect if PDO transaction is in process\n\n• Delete the session record\n\n•\
    \ Expire the session cookie\n\nThe first step is to detect if a PDO transaction\
    \ is in place, locking the record, which\n\nwould prevent it from being deleted.\
    \ If there is a PDO transaction, it is rolled back,\n\nwhich frees the record\
    \ for deletion.\n\nif($this->db->**inTransaction**())\n\n$this->db->**rollBack**();\n\
    \nAfter making sure the record does not have a lock on it, the record is deleted.\n\
    \n$sql = \"DELETE FROM session\n\nWHERE session_id = {$this->db->**quote**($sessionID)}\"\
    ;\n\n$this->db->**query**($sql);\n\nThis permanently deletes the record with this\
    \ $sessionID from the sessions table.\n\nNote again that prepared statements are\
    \ not used as explained in both the read()\n\nand write() function details.\n\n\
    Finally, the session cookie is expired by setting the expiration time to one tick\
    \ past\n\nUnix epoch time, avoiding any time zone issues. The session_name() function\
    \ is\n\nused to return the name of the cookie."
