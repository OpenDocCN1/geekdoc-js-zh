    11


    Modern PHP Encryption


    Modern encryption techniques have to account for the advances in computer speed


    and cost. Cheaper, faster computers allow the building of arrays of CPU power
    that


    calculate a billion plus passwords a second, which has killed MD5 and DES as encryp­


    tion methods. This attack capability will continue to improve.


    Good encryption needs to overcome the problems of randomness, strength of cipher,


    and speed of brute force cracking. To overcome the first problem, cryptographically


    secure pseudo random number generators (CSPRNG) have been developed to ensure


    very high levels of randomness. If these are not used, then any encryption will
    already


    have a weak link. The second is cipher strength. Newer ciphers employ higher levels
    of


    complication. The last problem is addressed specifically by Blowfish which contains
    an


    algorithm which actually slows itself down against faster computers, giving it
    a great


    deal of future proof ability against faster and faster computers.


    This chapter presents two methods of encrypting data, a two-way method for encrypt­


    ing and decrypting messages and a one-way hashing method for storing passwords.


    Another technique used in the example is for hashing and then encrypting passwords.


    This creates a defense in depth for password protection is several ways. The original
    clear


    text password can be deleted after hashing. The hash becomes the password and
    keeps


    the system from knowing or exposing the password. Most importantly, it does not
    limit


    user password choices. It allows the user to enter any characters, of any length.
    This


    will become increasingly more important to prevent password guessing. The hash
    func­


    tion does not care what the password is comprised of. The hash function will take
    any


    untrusted data, even if it is garbage, and return 60 characters consisting of
    a–f, 0–9\. This is


    then safely stored in a database table column 60 characters wide. Another benefit
    is that if


    the database is somehow compromised and the passwords are decrypted, only the
    hashes


    are exposed. A second decryption would need to take place to find the actual password.


    The price to be paid for stronger encryption is additional setup to properly configure
    all


    the parameters. These examples walk you through each step, explaining each parameter.


    These functions are reusable and once configured should not need to be configured
    again.


    **Using MCrypt for Two-Way Encryption**


    The following in an example of using mcrypt() correctly.


    $key = "*768whatever_YOU_want";


    $msg = "Hello Dr. Evil, Glad you can''t read this. Groovy";'
