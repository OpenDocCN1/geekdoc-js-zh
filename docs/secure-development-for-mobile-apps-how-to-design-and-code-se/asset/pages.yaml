    The file is opened with the ‘C+’ directive which tells PHP to:


    1. Create the file if it does not exist.


    2. To NOT truncate the file if it does exist.


    3. Position the file pointer to the beginning of the file.


    $this->fHandle = **fopen**($sessionPath, ''c+'');


    The returned file handle is saved in $this->fHandle.


    Next the file is exclusively locked in order to enable $_SESSION array integrity.


    **flock**($this->fHandle, LOCK_EX);


    After the file is locked, it is checked to see if there is any data in it. A file
    size of


    zero means no data.


    if(**filesize**($sessionPath))


    The file is read with fread() using the size returned from filesize() and the


    handle in fHandle member variable.


    $encryptedData = **fread**($this->fHandle, **filesize**($sessionPath));


    The returned data is encrypted, it is sent to decrypt(), and returned as a serial­


    ized string for PHP to then populate the $_SESSION array for use by the application.


    If there is no session data, then an empty string, “”, is returned.


    write() is called with two parameters: the session ID, and the session data to


    store.


    Again, as in the SecureSessionPDO class, the session ID is checked for valid char­


    acters. Because session.hash_bits_per_character was set to level 6, the


    allowed characters are (0–9, a–z, A–Z, “–”, “,”) and this is checked with a regular


