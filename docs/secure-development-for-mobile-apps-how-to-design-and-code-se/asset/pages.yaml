    \ the script exits upon redirect so that no other processing occurs.\n\nNo code\
    \ should be executed until a secure connection is made. If the request was over\n\
    \nHTTPS, then the script proceeds to process the request as an encrypted transaction.\n\
    \n*Protocol Relative Links*\n\nProtocol relative links is a technique that allows\
    \ HTML resources to be loaded accord­\n\ning to the protocol of the loaded page.\
    \ For example, if a page is loaded via HTTP,\n\nthen images, scripts, and CSS\
    \ files are loaded via HTTP. If a page is loaded over\n\nHTTPS, then the images,\
    \ scripts, and CSS files are loaded over HTTPS.\n\nThe following HTML code shows\
    \ how to achieve this.\n\n<script **src = \"//**code.jquery.com/jquery-1.10.1.js\"\
    ></script>\n\n<s\acript **src = \"//**code.jquery.com/mobile/1.3.1/jquery.mobile-\n\
    \n1.3.1.js\"></script>\n\n<l\aink rel = \"stylesheet\" **href = \"//**code.jquery.com/mobile/1.3.1/\n\
    \njquery.mobile-1.3.1.css\"/>\n\nBy not specifying either HTTP or HTTPS in the\
    \ src and href attributes, the links\n\nbecome protocol relative and will adopt\
    \ the protocol of the loaded page.\n\n**Note:**  Error messages from the browser\
    \ usually appear when a page is loaded via\n\nHTTPS, but an image or other file\
    \ is loaded via HTTP. All files should come from\n\neither a secure source, or\
    \ all files should come from an unsecured source."
