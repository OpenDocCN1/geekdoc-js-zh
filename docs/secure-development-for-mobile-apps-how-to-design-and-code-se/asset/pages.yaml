  md: "**90**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nstrong against modern\
    \ computing power, while md5() is considered roughly the\n\nequal of plain text.\n\
    \nTwo important points to know as part of a modern encryption implementation are\n\
    \ncipher and cipher block. These two encryption functions make use of two ciphers,\n\
    \nknown as *Blowfish* and *Rijndael256*. Other ciphers are available. See PHP\
    \ mcrypt()/\n\ncrypt() documentation. The cipher block used is CBC. This is seen\
    \ in the code that\n\nconfigures the encryption functions and prepares the salts.\n\
    \n**Note:**  The EBC cipher block does not use a salt. The CBC block does use\
    \ a salt,\n\nwhich greatly enhances encryption strength.\n\nA third crucial point\
    \ is true randomness. Randomness that is effective enough for\n\nmodern cryptography\
    \ depends on *CSPRNG*, or cryptographically secure pseudo ran­\n\ndom number generator.\
    \ The rand() function is no longer adequate as an ­unpredictable\n\nnumber generator.\
    \ A critical parameter that needs to become part of the cryptography\n\nfunctions\
    \ is MCRYPT_DEV_URANDOM. This parameter is a very important part of\n\nthe initialization\
    \ process for seeding random numbers. The DEV_URANDOM param­\n\neter identifies\
    \ the highest randomization source available on Linux. To ensure maxi­\n\nmum\
    \ encryption, it is very important to specify this source. Otherwise, randomness\
    \ is\n\ngreatly reduced and predictability is enhanced. Both of these endanger\
    \ the protection\n\nof encryption.\n\nBelow are brief examples that introduce\
    \ the main encryption functions and begin\n\nthe familiarization process. Both\
    \ are discussed in great detail further on with full\n\nexplanations of proper\
    \ initialization and application, both of which are important\n\nbecause it is\
    \ possible to poorly implement them and lose the high degree of protection\n\n\
    they afford.\n\nAnother point to consider is the option of hex output or raw binary\
    \ output of hashes.\n\nThis book uses hex output. The hex string output is longer\
    \ in length with lower bit\n\ncount per character, being limited to (0–9, A–F)\
    \ the raw binary output is shorter in\n\nlength, with higher bit count per character.\
    \ The choice has at least two implications.\n\nFirst, the storage medium of the\
    \ bits needs to be considered. For example, table col­\n\numn type must support\
    \ the data type of the hash. Is the hash going somewhere that\n\nraw bits might\
    \ interfere? Second, many experts prefer the increased entropy of the\n\nhigher\
    \ bit count per character of a raw byte stream.\n\ncrypt() One-way string hashing.\
    \ Using crypt() with the algorithm $2y$\n\nengages what is known as BCrypt, currently\
    \ the best hashing practice for passwords\n\nas of 2013.\n\nif(crypt($password,\
    \ $hash) = = $hash);\n\nmcrypt_encrypt()/mcrypt_decrypt() Two-way encryption.\
    \ Encrypts plain­\n\ntext with given parameters, and decrypts crypttext with given\
    \ parameters."
