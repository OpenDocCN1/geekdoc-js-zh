    the user variable from breaking out of the quoted HREF attribute. It could do
    this if


    it contained a double. If left unescaped, the variables quote could prematurely
    end the


    HREF attribute, and begin a new attribute of its own. By using ENT_QUOTES with


    htmlentities() any quotes are escaped, therefore any user input is imprisoned


