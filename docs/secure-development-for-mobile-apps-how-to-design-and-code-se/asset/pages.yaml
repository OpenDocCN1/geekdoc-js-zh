    **PHP Essential Security**


    • POST for public updates and state change requests


    • POST over SSL for private update and state change requests


    • POST for non-persistable, non-cachable URL requests


    • POST-Redirect-GET pattern for POST results


    Read only requests are static, or dynamically generated pages which are not


    changed, and can be read by anyone, anonymous or authenticated. Persistable


    URLs are URLs that can be safely saved, cached, or stored in emails and book­


    marks  because  they do not contain sensitive data embedded within the URL.


    A NONCE URL contains a one-time code that is storable in an email, for example,


    and activates a process. The URL can only be used one time, after which it becomes


    useless. A POST for private, authenticated requests should be over SSL and prevent


    sensitive data from being persisted in the URL. POST should be used for altering


    and updating data. POST should be used when it is not desirable for data to be


    embedded in a URL. The PRG pattern, explained later, prevents double submission


    of form data.


    *Architect HTTP Cookie Usage*


    It is strongly advised to use HTTP cookies for a single purpose. Use a restricted


    authentication cookie, which is only transmitted over SSL to private URL path


    requests, for accessing private documents. Use a separate public cookie, which
    can be


    transmitted over HTTP for accessing read only, public URL documents. A public


    cookie should have no connection whatsoever to an authentication cookie, and each


    is used independently.


    *Architect Input Validation*


    The first rule of thumb in security is “Don’t trust any user input. Ever.” Always
    assume


    the worst; always assume incorrect data; always assume data is attacking your
    applica­


    tion. Always validate and filter incoming data. This is a key architecture component


    in building a secure application.


    Data can only be validated by the server side PHP code. JavaScript is an assistant


    for legitimate users. It is a very important assistant for users, as it saves
    them time and


    hassle, and increases usability. It is not secure.


    *Architect Output Escaping*


    The new second rule of thumb is to not trust user output either. Output escap­


    ing needs to be thought out in order to be effective as well. Where is the data


    going, and how is the data being formatted? This affects how output escaping code


    is implemented.'
