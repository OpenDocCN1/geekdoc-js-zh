    **PHP Security Anti-Patterns**


    and over until they become de facto ­standards. This ­presents a problem for at
    least two


    reasons. First, advice given without technical verification is a poor solution.
    A ­security


    solution is something that needs to actually be tested and ­verified. Opinion
    is not


    good enough. Second, a bad habit, once formed, is ­difficult to break. Copying
    bad


    examples leads to bad habits, which is self-perpetuating.


    One important example is this. A simple Google search found several available


    instances, i.e. 1–3 pages of listings, of advice explicitly advising to “Turn
    off SSL peer


    verification via the false parameter in order to make curl SSL work,” with no
    additional


    advice on how to make it work with a secure setting of TRUE. This is troubling
    because


    SSL Verify Peer is a critical confirmation action. It is not a convenience. SSL
    is not about


    encryption and proper identity verification. *It is unwise and not secure to turn
    off verifica­*


    *tion and confirmation of whom your application is talking to*. As a result of
    this advice, the


    following line of code has been copied, reposted, and re-implemented many times:


    **curl_setopt**($curl, CURLOPT_SSL_VERIFYPEER, FALSE);


    The negative effects of this are several. First, it cancels peer verification
    altogether,


    which is a main purpose of SSL certificate verification, and second, it allows
    for


    ­man-in-the-middle interception attack. Because it is encrypted, these facts are
    easily for­


    gotten. One forgets that there is a TRUE setting that is needed. One stops seeing
    this as


    a problem. It becomes a bad habit to use this code and just switch it off without
    checking.


    *The Mantra Anti-Pattern*


    A common mantra these days is “Always use PDO prepared statements.” While there


    is some truth and some benefit to this saying, it isn’t completely helpful. Implementing


    PDO prepared statements wherever possible is undeniably a best practice. The real­


    ity is that they can’t be used in every situation. For example, PDO prepared state­


    ments cannot accommodate variable columns, and so cannot be implemented in this


    case. Legacy code cannot use PDO statements. Without understanding the problems


    solved by PDO prepared statements, or alternative defenses, security problems
    will


    persist when workarounds are required. It would be nice if security problems could
    be


    put in a box, and one “always use” solution worked, but this is not the case.
    Mantras


    simply promote complacency and work against understanding.


    Another common mantra is “Always use a framework.” This borders on useless,


    equivalent to “Build all homes the same way, with the same architect, and the
    same


    blueprints.” The magnificent freedom of development does not rest on working with


    or depending on a third-party library. Frameworks cannot be leveraged in all cases.


    Also, a current project cannot be retrofitted with a framework simply to overcome
    an


    immediate problem. Frameworks are not perfect and must be understood well and


    implemented properly to benefit from whatever protection they might provide. That


    task is not trivial. There is a significant learning curve involved. That said,
    frameworks'
