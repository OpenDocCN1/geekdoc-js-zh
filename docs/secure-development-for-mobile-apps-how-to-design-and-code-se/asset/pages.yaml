    \ to user\n\n\alogPayPalEror(\"Invalid Response from PayPal\n\nrequest($nvpRequest)\
    \ to\n\n$API_Endpoint.\");\n\nreturn false;\n\n}\n\nreturn $ppParsedResponseArray;\n\
    \n}\n\nfunction logPayPalError($ppError)\n\n{\n\n//save to error log located outside\
    \ web root\n\n**error_log**($ppError, 3, \"/usr/private/app/error.log\");\n\n\
    //if mail notificication is desired\n\nif(true === MAIL_PAYPAL_ERRORS)\n\n{\n\n\
    mail\a(\"admin@security.com\", \"Critical PayPal Error\",\n\n$ppError);\n\n} }"
