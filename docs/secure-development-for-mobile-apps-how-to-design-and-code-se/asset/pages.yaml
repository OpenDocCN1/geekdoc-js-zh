  md: "**26**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nKeeping this in mind,\
    \ there are three main processing aspects for user-supplied\n\ndata: validating\
    \ the input type, filtering for dangerous characters, and escaping the\n\noutput\
    \ for context. Each of these is described here.\n\n*Input Validation*\n\nInput\
    \ validation and input filtering are not the same thing, although the terms are\n\
    \nusually used interchangeably. Input validation is the process of ensuring that\
    \ data\n\nfor a particular variable is the type and size it explicitly needs to\
    \ be. If the variable is\n\na numeric ID used to look up a record from a database,\
    \ then ensuring it is numeric\n\nand not alphabetic is both acceptable and encouraged.\
    \ If the variable is a user name,\n\nit may need to be cut if it is too long.\
    \ If your database column is 32 characters, then\n\n33 characters is too much,\
    \ and the result is data loss. Additionally, a ‘<’ is not usually\n\npart of a\
    \ name, and can be expected to be removed. If it is an email address, then it\n\
    \nneeds to be properly formatted with no surprise characters. While this process\
    \ can\n\ndestroy user-supplied data, the intent is to ensure that certain data\
    \ is correct in both\n\ntype and format.\n\nWith other user data, like a blog\
    \ post, a different criteria is needed concerning\n\nvalidation and the destruction\
    \ of data. You’ll have to ask some questions first. What\n\ndo you want the user\
    \ to be allowed to enter? If the data in question is a blog post, do\n\nyou want\
    \ to allow embedded HTML tags? Or do you want to strip them out, thereby\n\ndestroying\
    \ at least some user intent? This scenario has caused many heated discus­\n\n\
    sions. On one hand, user input is valuable, and a developer needs to respect it.\
    \ On the\n\nother hand, user-entered HTML is dangerous, and is hard to clean.\n\
    \nAt present, in 2013, there is only one widely acknowledged HTML tags cleaner\n\
    \nthat really works, and that is htmlPurifier. It is generally acknowledged to\
    \ work well\n\nfrom a security standpoint, not because it has some magic filter,\
    \ but because it recre­\n\nates an internal DOM and then constructs legal HTML\
    \ before passing it on. The\n\ndownside is that this also requires a lot of CPU\
    \ processing and is felt to be too slow for\n\nsome users and therefore unacceptable\
    \ in high traffic situations, or where fast response\n\ntime is required. A decision\
    \ has to made by you the developer on what is acceptable\n\nfor your application\
    \ and what is an appropriate filter for what you wish to accomplish.\n\n*Input\
    \ Filtering*\n\nInput filtering usually means looking for destructive characters\
    \ inside a string, and\n\nthen stripping those characters. Escaping means keeping\
    \ characters, but making them\n\nsafe to use for the current context. One is destructive,\
    \ the other is not.\n\nThe destructive method is to use a filter like strip_tags()\
    \ which removes data.\n\nIn the following case, the string,\n\n\"<script>alert('attacked')</script>\""
