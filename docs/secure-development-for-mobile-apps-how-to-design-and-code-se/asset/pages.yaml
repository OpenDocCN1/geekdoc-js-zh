    **Secure Client Server Form Validation**


    **Preventing Double Form Submission**


    Preventing multiple submissions of a form is a requirement in just about every
    case.


    If multiple submissions are not checked for, then duplicate data, corrupt data,
    or mul­


    tiple purchases might be made. There are various ways that forms can be submitted


    more than once. The user might hit the back button, or hit the submit button more


    than once, or an attacker might insert direct POST requests to the application.


    Here are two methods for preventing multiple form submission—the Post-Redirect-


    Get pattern and tracking form tokens.


    *Post-Redirect-Get Pattern for Form Processing*


    Post/Redirect/Get (PRG) is a web development design pattern that prevents ­duplicate


    form submissions. The PRG pattern implementation accounts for bookmarks and the


    refresh button in a predictable way that does not create duplicate form ­submissions.


    It is able to do this because GET does not transmit a request body. Only POST
    does.


    Figures 16.1 and 16.2 diagram the process that enables multiple form submission.


    *Double Submit Problem * The GET request was intended as a read only request that


    does not change server state. Therefore the same GET request can be sent and resent


    to the server any number of times without causing system instability. This is
    why


    caching works so well for GET. A unique GET URL was meant to get a specific


    resource over and over. POST, on the other hand, introduces state change. Repeating


    a change is usually undesirable and a method needs to be implemented to prevent
    this


    behavior.


    ![](img/a1d8782fdf88e6a561fda104c93073e3_342_0.png)


    User clicks


    POST


