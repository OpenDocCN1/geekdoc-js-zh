  md: "**38**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Take action. Explicitly\
    \ set the character sets used by the application processes*.\n\n1. Decide what\
    \ character encoding should be used.\n\n2. Ensure *all* internal functions, filters,\
    \ and structures are configured for the\n\nchosen character encoding.\n\n3. Ensure\
    \ user-supplied data is comprised of the chosen encoding.\n\n4. Convert or drop\
    \ data that does not conform.\n\n**Not Designing with Content Security Policy\
    \ Anti-Pattern**\n\nContent Security Policy 1.0 (CSP) is a W3C Candidate Recommendation.\
    \ Most\n\nmajor browser vendors have adopted it. CSP is the new weapon against\
    \ XSS and other\n\n­client side attacks because it only allows whitelisted scripts\
    \ to execute. This gives\n\n­excellent control over security measures. The second,\
    \ very powerful feature of CSP is\n\nthat is completely disallows inline javascript\
    \ to execute. This is the only way to prevent\n\n­injection attacks. Inline scripts\
    \ and Javascript event handlers must be relocated to an\n\nexternal file and whitelisted.\
    \ This can make it difficult to retrofit an application with\n\npoor separation\
    \ of concerns (SoC).\n\nThe new best practice, with major security gains, is to\
    \ architect with CSP from the\n\nbeginning, and to use SoC effectively. There\
    \ is an online chapter, Secure Developement\n\nwith Content Security Policies\
    \ that covers building PHP/Javascript pages using CSP,\n\navailable at: http://www.projectseven.net/secdevCSP.htm\n\
    \n**One Size Fits All Anti-Pattern**\n\nEvery engineering circumstance has its\
