  md: "**33**\n\n**Web Application Attack Surface**\n\nA common **anti-pattern** one\
    \ would see:\n\n<script>\n\nvar initData = <?php = data.to_json ?>;//Do NOT do\
    \ this.\n\n</script>\n\nInstead, consider placing the JSON block on the page as\
    \ a normal element and then\n\nparsing the innerHTML to get the contents. The\
    \ JavaScript that reads the span can live in\n\nan external file, thus making\
    \ the implementation of CSP enforcement easier.\n\n<script id = \"init_data\"\
    \ type = \"application/json\">\n\nInit\a_data = <?php echo json_encode(htmlentities($data,,\
    \ ENT_QUOTES,\n\n'UTF-8'));? >\n\n<— data is HTML escaped, and json formatted\n\
    \n</script>\n\n<script>\n\nvar jsonText = document.getElementById('init_data').innerHTML;\n\
    \n<— unescapes the content of the span\n\nvar\a initData = JSON.parse(jsonText);\n\
    \n<— \asafely parse json data with no\n\nexecution\n\n</script>\n\nThe data is\
    \ added to the page and is HTML entity escaped so it won’t pop in the\n\nHTML\
    \ context. The data is then read by innerHTML, which unescapes the value. The\n\
    \nunescaped text from the page is then parsed with JSON.parse().\n\n*Rule #4—CSS\
    \ Escape and Strictly Validate before Inserting Untrusted Data into HTML*\n\n\
    *Style Property Values*\n\nRule #4 is for when you want to put untrusted data\
    \ into a stylesheet or a style tag. CSS is\n\nsurprisingly powerful, and can be\
    \ used for numerous attacks. Therefore, it’s important that\n\nyou only use untrusted\
    \ data in a property **value** and not in other places in style data. You\n\n\
    should stay away from putting untrusted data into complex properties like url,\
    \ behavior,\n\nand custom (-moz-binding). You should also not put untrusted data\
    \ into IE’s expression\n\nproperty value which allows JavaScript.\n\n<style>selector\
    \ {property :...ESCAPE UNTRUSTED DATA HERE...;} </style>\n\nproperty value\n\n\
    <style>selector {property : \"...ESCAPE UNTRUSTED DATA HERE...\";} </style>\n\n\
    property value\n\n<span style = \"property :...ESCAPE UNTRUSTED DATA HERE...\"\
    >text</span>\n\nproperty value\n\nPHP code example:\n\n<style>selector {property :\
    \ \"\n\n<?php echo $encoder-> encodeForCSS($value); ?>\n\n\";} </style>"
