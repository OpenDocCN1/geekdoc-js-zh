  md: "**49**\n\n**PHP Security Anti-Patterns**\n\n*Input Same as Output Anti-Pattern*\n\
    \nInput filtering and output escaping are two different and critical aspects of\
    \ web\n\n­application security. Each one has to be dealt with and each has to\
    \ be handled dif­\n\nferently. The anti-pattern is when these two are treated\
    \ either as the same, or simply\n\nmaking no distinction between the two. For\
    \ example, here is a real example of the\n\nonly filtering mechanism from an actual\
    \ PHP application.\n\n$_cleanArray = array();\n\nforeach($_REQUEST as $key = >\
    \ $value)\n\n{\n\n$key = addslashes(trim(strip_tags($key)));\n\n$value = addslashes\
    \ (trim(strip_tags($value)));\n\n$_cleanArray[$key] = $value;\n\n}\n\nmysql_query(\"\
    INSERT INTO users (name) VALUES($clean['key'])\");\n\necho \"<h3\"\". $_cleanArray[$key]\
    \ . \"/h3>\";\n\nec\aho \"<input type = hidden name = key value = \".\n\n$_cleanArray[$key]\
    \ .\"/>\";\n\nObviously there is a sincere effort to sanitize the data to be “clean.”\
    \ The ­assumption\n\nhere is that data is cleaned of any dangerous characters.\
    \ There are many problems\n\nwith this.\n\n• There is no differentiation between\
    \ GET, POST, and COOKIE\n\n• There is no accounting for variable type\n\n• There\
    \ is no accounting for character set encoding\n\n• There is no matching of character\
    \ set to database character set\n\n• Only HTML tags are removed\n\n• JavaScript\
    \ functions like 'onmouseover' are not filtered out\n\n• Only ', \", NULL, and\
    \ \\ characters are escaped\n\n• There is no accounting for quote variables in\
    \ usage\n\n• HTML attribute values are not quoted\n\nFirst, the SQL input is still\
    \ not correctly escaped for the environment. Second, the\n\nvariable being echoed\
    \ to HTML has both data removed and embedded slashes which\n\nalter the original\
    \ data.\n\nBy not differentiating between GET, POST, and COOKIE, the ­application\
    \ is open\n\nto GET request attack vectors when it might not need to be. Other\
    \ escaped ­characters\n\nor escape characters in different character encodings\
    \ are  missed. ­addslashes()\n\nmay or may not match the character set of the\
    \ ­database ­client ­connection. If it does\n\nnot match, it is open to encoding\
    \ attack. While strip_tags() can remove many\n\ndangerous HTML script tags, other\
    \ types of JavaScript code can pass through and\n\nbecome active via the unquoted\
    \ HTML attributes."
