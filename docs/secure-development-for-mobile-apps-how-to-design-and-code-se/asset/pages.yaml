    2


    Web Application Attack Surface


    The attack surface is the composite of all avenues of attack against your application.


    Until recently, this has usually been looked at only in terms of validating user
    input.


    Now the attack surface includes safeguarding data that is output to your client’s
    dis­


    play. Creating mashups adds the complexity of streaming data to and from other
    data


    providers. This opens up additional possibilities of what is attackable and often
    loses


    sight of where that attack might come from. AJAX requests—POST or GET, return


    data types, JSON or XML, remote connections, HTTP or HTTPS, account man­


    agement actions, authentication or authorization—create a large mix of situations.


    Each of these actions needs to be defended properly via secure code.


    **Attack Vectors**


    Attack vectors are the specific avenues of approach an attack might take. For
    example,


    including MySQL query code inside an HTTP GET request in hopes of a successful


    SQL injection is one possible attack vector that might be leveraged against your
    site.


    If you eliminated processing GET requests in your application altogether, the
    result


    would be the closing of that particular vector. It would not make the application
    com­


    pletely safe, but that particular path would be closed to attackers.


    A mobile mashup by design has many attack vectors, therefore its attack surface
    is


    large. While it may be obvious at the outset that input coming directly from the
    mobile


    client itself must be validated, it might not be apparent that data must be ­validated


    before resending it as a request to other servers, or that data requested from
    other


    servers must be validated. Since your mobile client app is the display, it represents


    the final output context and is vulnerable to attacks depending on context parsing.


    A secure application has to be aware of these possibilities and have code that
    handles


    them properly.


    There are many specific parts of the HTML page that can be attacked. Both input


    and output attack vectors are accounted for.


    Input attack vectors include:


    −


    −HTTP headers


    −


    −Form inputs via POST method


    −


    −Hidden form inputs via POST method


    −


    −URL input'
