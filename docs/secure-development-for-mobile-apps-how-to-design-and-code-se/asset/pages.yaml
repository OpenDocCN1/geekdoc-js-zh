  md: "**365**\n\n**Google Maps, YouTube, and jQuery Mobile**\n\n$query = \"DELETE\
    \ FROM map_markers\n\nWHERE lat = :lat\n\nAND lon = :lon\";\n\n**//\aprepare the\
    \ statement which compiles it without the user**\n\n**values**\n\n$stmt = $this->conn->prepare($query);\n\
    \n//escape the values for insertion into the query\n\n//depending on whether PDO\
    \ has emulation turned on or off\n\n//\athese values will be escaped and inserted\
    \ into the sql string\n\nlocally\n\n//and a database trip avoided\n\n//\aor they\
    \ will be sent in a second trip and inserted into the\n\ncompiled SQL\n\n//where\
    \ it is too late for bad values to alter the SQL\n\n$stmt->bindValue(\":lat\"\
    , $lat);\n\n$stmt->bindValue(\":lon\", $lon);\n\n//execute **statement** with\
    \ values bound in bindValues()\n\n$ret = $stmt->execute();\n\n//record any error\n\
    \n$err = $stmt->errorCode();\n\n//\aquery may successfully execute without actually\
    \ deleting a\n\nrecord\n\n//if count equals one, then a record was deleted\n\n\
    $count = $stmt->rowCount();\n\n}\n\nThis function is almost identical to removeMarker().\
    \ The INSERT\n\nstatement requires that more variables be escaped. In this case,\n\
