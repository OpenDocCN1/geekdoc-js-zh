  md: '**121**


    8


    Separation  of Concerns


    Separation of concerns is a programming discipline and another step one can take


    when organizing code. The concept involves separating different sections of code
    from


    each other so that those sections can be worked on separately without interference


    from other sections. Within the same language, this would equate to modularization


    of code. Here it is applied in order to keep the many different parts of a modern
    web


    application separate. This is also known as *loose coupling*.


    **What Is Separation of Concerns?**


    Separation of concerns in web application development means isolating PHP from


    HTML, HTML from CSS, and JavaScript from HTML. The nature of the PHP


    parser makes it easy to code all these elements together. In fact it does this
    so well that


    sub-optimal coding habits, in terms of secure development, have developed over
    the


    years that are hard to break. A large number of programming examples demonstrate


    code examples of PHP/HTML and JavaScript all combined into single functions and


    single pages that are difficult to assess for security purposes.


    An example of combined code that is difficult to visually assess and apply security


    measures to is the following.


    <? if (!empty($left)) {?>


    <div id = "columnLeft"><div class = "mainBox">


    <?php echo $contentLeft; ?>


    </div><?php echo $userName;?></div>


    <p>Today''s quote: <?php echo $quote;?></p>


    <?php} else {?>


    <style type = "text/css">


    #divContent {width: 80%; padding-top: 15px;}


    </style>


    <?php} ?>


    This code combines PHP, HTML, and CSS. It is more difficult to read and change


    than it needs to be. The four variables in this snippet, $left, $contentLeft,


    $userName, and $quote, are hard to find and apply security measures to. The code


    works, but it makes working on the code more difficult. This is the main reason
    to


    put effort into separating concerns and keeping different kinds of code separated
    from


    each other.'
