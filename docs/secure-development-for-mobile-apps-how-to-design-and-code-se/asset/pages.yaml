    Then the logging functionality is encapsulated inside a new ErrorLogger class.
    The


    error file is stored as a private member, and the function to format the Exception


    object is private as well. There is no need to access these publicly.


    The single public function, logErrror(), is also static so that it can be called


    without instantiating an ErrorLogger object.


    The catch statement can now log exceptions by calling ErrorLogger::​


    ­logError() and passing it the exception object.


    Two more mechanisms that PHP makes available for exceptions are extending the


    Exception class with the *extends* keyword, and chaining catch handlers. The next
    two


    examples look at both of these techniques. Extending the Exception class allows
    the


    class to be customized. In this example, the compiler is put to work for us again
    to


    automate logging.


    const INVALID_NAME = 200;


    const INVALID_LENGTH = 201;


    class MemberException extends Exception


    {


    public function _construct($errorCode)


    {


    parent::_construct($errorCode);


    ErrorLogger::logError($this);


    }


    }


    With this new Exception class, exceptions are logged when the class is ­instantiated.


    Two points to note in the constructor are that the parent base class constructor
    is


    called via the parent word, parent::_construct(), and is passed the error code.


    And $this is passed to the static ErrorLogger::logError() function, which,


    as declared with type hinting in its function specification, expects an Exception
    object


    as a parameter.


    Now we can use this type of exception instead of the default class.


    private static function validateName($name)


    {


    if(**is_string**($name) && **mb_strlen**($name) < 40)


    **return** $name;


    **throw**  **new** MemberException(INVALID_NAME);


    }'
