  md: "**134**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*PDO Unnamed Parameters\
    \ Example*\n\n$stmt = $pdo->**prepare**(\"INSERT INTO\n\nmembers (name, email,\
    \ id)\n\nVALUES (?, ?, ?)\";\n\n//bind variable to a parameter\n\n//unnamed parameters\
    \ are numbered by order\n\n//in this case 1, 2, 3\n\n//by binding to variable,\n\
    \n//if the variable changes, the parameter changes\n\n$stmt->**bindParam**(1,\
    \ $name, PDO::PARAM_STR);\n\n$stmt->**bindParam**(2, $email, PDO::PARAM_STR);\n\
    \n$stmt->**bindParam**(3, $id, PDO::PARAM_INT);\n\n//insert first set of variables\
    \ bound\n\n$name = \"Kam\"\n\n$email = \"chef@mobilesec.com\";\n\n$id = \"5\"\
    ;\n\n$stmt->**execute**();\n\n//change value of variables\n\n//insert new set\
    \ of values with same query\n\n$name = \"Wendy\"\n\n$email = \"beautifulness@mobilesec.com\"\
    ;\n\n$id = \"1\";\n\n$stmt->**execute**();\n\nAgain, three steps are performed.\
    \ First, the SQL statement is with three placeholders.\n\nSecond, variables are\
    \ bound to the placeholders via bindParam();. It is important\n\nto note that\
    \ numerical order is required here as indicated by the first parameter to\n\n\
    bindParam();. Since the placeholders are not named, order is important. If the\n\
    \nvariable order does not match the column order in the statement, the query will\
    \ fail.\n\nThird, once the values are bound to the query, it is executed. Steps\
    \ two and three are\n\nthen repeated ad infinitum with the same prepared statement\
    \ which only needed to\n\nbe compiled once. If repetitive calls are made via this\
    \ method, this does result in faster\n\nperformance over a non-prepared statement,\
    \ which would have to be compiled each\n\ntime the parameter values changed.\n\
    \nIn the example above, three round trips would be made—one to compile the state­\n\
    \nment and two more to execute and return two different result sets. A non-prepared\n\
    \nstatement would have resulted in two round trips, and two query compilations.\
    \ If three\n\nqueries or more queries had been run, the difference gap starts\
    \ to widen.\n\nThe usefulness of unnamed placeholders is in being able to use\
    \ an array of values as in,\n\n$user = **array**('Robert', 'photog@mobilesec.com',\
    \ '8');\n\n$stmt = $pdo->**prepare**(\"INSERT INTO members (name, email, id)\n\
    \nVALUES (?, ?, ?)\";\n\n$stmt->**execute**($user);"
