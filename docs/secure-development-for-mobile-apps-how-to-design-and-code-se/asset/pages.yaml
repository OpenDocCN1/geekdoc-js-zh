    The line if($_POST[''formTracker''] = = $_SESSION[''formTracker''])


    checks to see if this is the first-time form submission. It knows this because
    the form ID


    is a one-time nonce essentially. The form ID is thrown away in every case, whether
    it


    matches or not. A second request using the same ID will find no match in the ­session


    array.


    If the form ID matches, the form is good, and is the first time, so the variables


    are grabbed from the POST array and assigned to application variables. Then the


    global $_POST array is unset, preventing further access. The session variable,
    $_


    SESSION[''formTracker''] is also unset so that a second request is prevented from


    matching. This is how duplicate submission is prevented.


    If the form ID does not match, the request is rejected after doing some house


    cleaning. The session variable, $_SESSION[''formTracker''] must be unset and


    the form needs to be either exited or redirected to code designed to handle a
    false


    submission.


    **Note:**  The NonceTracker object can easily be used for this purpose by making
    a sepa­


    rate entry into the session array because it is already tracking a one-time only
    number.


    The class does not need to be changed, just the notation in the session array.


    *HTTP References * See Berners-Lee, Fielding, and Frystyk and Fieldings et al.


    **Controlling Form Page Caching and Page Expiration**


    An often overlooked mechanism that helps contribute to the overall security of
    an


    application is to direct user agent browsers, and intermediary proxies, to not
    cache


    pages. This is not a guaranteed measure, but security is increased by not leaving
    pages


    around that could be a source of information disclosure. This should be part of
    the


    general cleanup process. The ‘no-cache’ directive can be used on pages that might
    have


    any kind of content that should be protected in the same way that a person’s credit


    card statement should not be thrown away without being shredded.


    <?php


    header("Cache-Control: no-cache,


    no-store,


    private,


    must-revalidate,


    post-check = 0,


    pre-check = 0");'
