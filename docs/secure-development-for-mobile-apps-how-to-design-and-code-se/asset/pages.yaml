  md: "**102**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*How UTF-8 Affects\
    \ Security*\n\nThe choice of UTF-8 from a security standpoint centers on the fact\
    \ that each character\n\nboundary is known, which makes it much easier to both\
    \ ensure character validity and\n\nto detect invalid characters and reject them.\
    \ The UTF-8 specification defines only one\n\nright way to encode each character.\
    \ If it is possible to have more than one encoding,\n\nonly the shortest encoding\
    \ is the right one. This prevents security problems that occur\n\nfrom having\
    \ a string that is represented one way to a user but represented differently\n\
    \nto the CPU. UTF-8 is also the default encoding for XML documents. Since many\n\
    \nexploits take advantage of miscalculated character encodings, this is an important\n\
    \nconsideration.\n\nOWASP also recommends UTF-8\\. For more details on Unicode\
    \ security issues, see\n\nOWASP at https://www.owasp.org/index.php/Canonicalization,_locale_and_Unicode.\n\
    \nThe strength of OWASP’s UTF-8 recommendation produced a new method for\n\nsecurely\
    \ escaping output noted in *Programming PHP* (Tatroe, Macintyre, and Lerdorf,\n\
    \n2013). Here characters are forced to UTF-8 if not already, and parsed on UTF-8\n\
    \nboundaries. The new PHP Encoder class in Chapter 12 does a multi-byte inspection\n\
    \nof characters to ensure proper escaping for secure output of data. This is a\
    \ real evolu­\n\ntion of security techniques for the developer.\n\nSecurity depends\
    \ on consistency. Inconsistencies in processing data are what cre­\n\nate the\
    \ opportunity for security holes. Choosing a character set and ensuring that\n\
    \nall functions process the expected character set in the expected way are what\
    \ allows\n\nsecurity to actually work. The real importance of UTF-8 is picking\
    \ a character set\n\nthat is employed, understood, processed, and stored correctly\
    \ by the entire application,\n\nfrom beginning to end. The entire chain must be\
    \ complete. A character set other than\n\nUTF-8 could be used successfully as\
    \ long as the entire chain processes the data in the\n\nsame manner.\n\n**Complete\
    \ PHP UTF-8 Setup**\n\nThe following sections list all the steps needed to ensure\
    \ UTF-8 compliance across\n\nall aspects of an application. This includes setting\
    \ the database tables and character\n\nsorting, the database client connection\
    \ to store and pass UTF-8 unaltered, setting the\n\nPHP internal libraries to\
    \ UTF-8, so that bytes are accounted for correctly, using\n\nthe PHP multi-byte\
    \ series of string functions for correct Unicode string handling\n\nand parsing,\
    \ setting regular expression syntax for Unicode parsing, and finally mak­\n\n\
    ing sure the browser understands and displays the correct character set by setting\
    \ the\n\nHTML header and meta-tags, as well as setting the character set for HTML\
    \ forms.\n\n*UTF-8 MySQL Database and Table Creation*\n\nThe first step is to\
    \ explicitly ensure the database is able to store and retrieve UTF-8\n\ndata without\
    \ alteration. The follow MySQL database creation commands set this up."
