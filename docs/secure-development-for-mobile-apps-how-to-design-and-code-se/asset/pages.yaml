    \n**JavaScript and jQuery Escaping and Filtering**\n\nWhenever data is being retrieved\
    \ from a source that has not been filtered or escaped\n\nby you, then the possibility\
    \ exists for an XSS attack, depending on how JavaScript or\n\njQuery display the\
    \ data on the HTML page. The following snippet shows methods\n\nthat allow XSS\
    \ to execute, and methods that prevent execution.\n\n$(function() {\n\n//result\
    \ from favorite RSS feed site\n\nvar rss = \"<script>alert('attack');</script>\"\
    ;\n\n//Allow XSS to Execute\n\n$(\"#feed\").html(rss);\n\n$(\"#feed\").append(rss);\n\
    \n//Prevent XSS from Executing\n\n$(\"#feed\").html(escape(rss));\n\n$(\"#feed\"\
    ).text(rss);\n\n//text() escapes, then html() un-escapes the escape\n\n$(\"#feed\"\
    ).html($(\"#incoming\").text(rss).html());\n\n});\n\nThe first two methods, calling\
    \ html() and append() execute the script contained\n\nin the RSS feed, and will\
    \ pop up an alert box. Therefore html() and append()\n\nshould only be called\
    \ with data that was explicitly created, or explicitly escaped by\n\nyour own\
    \ code.\n\nThe next two methods, html(escape()) and text() prevent the execution\
    \ of\n\nthe script. html(escape()) prevents script execution by escaping the data.\
    \ This\n\nmethod displays the HTML entities along with the data. text() displays\
    \ the data as\n\nis, but removes any active content. It becomes just text.\n\n\
    It is important to understand that jQuery.html() extracts script tags, updates\n\
    \nthe DOM, and immediately executes the code embedded in the <script> tag.\n\n\
    The last snippet is an example of escaping the escapes, or undoing the thing you\n\
    \ndid, and reintroduces a problem that you thought had been fixed.\n\n$(\"#feed\"\
    ).html($(\"#incoming\").text(rss).html());//XSS Problem"
