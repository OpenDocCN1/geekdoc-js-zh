  md: "**56**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Common Example of\
    \ PDO Connection without Character Set*\n\n**new**  **PDO**('mysql:host = localhost;dbname\
    \ = myDB', $user, $pass);\n\nversus\n\nne\aw PDO('mysql:host = localhost;dbname\
    \ = myDB ;charset = utf8',\n\n$user, $pass);\n\nversus\n\n**new**  **PDO**('mysql:host\
    \ = local;dbname = myDB', $user, $pass,\n\narray(\n\nPDO::ATTR_ERR_MODE = > PDO::ERRMODE_EXCEPTION,\n\
    \nPDO::ATTR_DEFAULT_FETCH_MODE = > PDO::FETCH_ASSOC,\n\nPDO::MYSQL_ATTR_INIT_COMMAND\
    \ = > **'set names utf8'**) );\n\n*Common HTML Meta-Tag without Character Set*\n\
    \n<meta http-equiv = \"Content-Type\" content = \"text/html\"/>\n\nversus\n\n\
    <m\aeta http-equiv = \"Content-Type\" content = \"text/html; **charset =**\n\n\
    **UTF-8**\"/>\n\n**Note:**  Take it upon yourself to reverse this trend. Post\
    \ function examples with explicit\n\nparameter settings for the required implementation.\
    \ Doing this over time will con­\n\ntribute to the spread of more accurate knowledge,\
    \ and higher levels of secure code\n\nbeing implemented everywhere.\n\n**Design\
    \ Practices Anti-Patterns**\n\nHere we take a look at the way code is structured\
    \ that hinders security. Code that\n\noffers too much duplication, code that does\
    \ not separate logic out into different func­\n\ntions or classes, and code that\
    \ neglects to organize the data in a meaningful way are\n\ndifficult to apply\
    \ consistent security measures to.\n\n*No Clear Separation of HTML and PHP Code\
    \ Anti-Pattern*\n\nThe problem with the following code is that it becomes difficult\
    \ to track the quote.\n\nThere can end up being so many concatenated strings that\
    \ it is difficult to know if data\n\nis actually being escaped properly. There\
    \ are just too many quotes to count.\n\nif(mysql_num_rows($result))\n\n{\n\nec\a\
    ho '<table cellpadding = \"1\" cellspacing = \"1\" class =\n\n\"db-table\">';"
