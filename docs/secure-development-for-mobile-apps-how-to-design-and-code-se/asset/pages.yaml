  md: '**53**


    **PHP Security Anti-Patterns**


    addslashes() versus mysql_real_escape_string(); addslashes() does


    not negate SQL keywords such as DELETE; lack of character set recognition; and
    the


    inconsistencies of the SQL string construction. Is it escaped properly? Visual
    inspection


    is more difficult.


    When there isn’t a template of some kind, when there isn’t a base of reusable
    func­


    tions that actually get reused, not just parts copied and pasted, then lack of
    consistency


    occurs, which negatively impacts security.


    *Lack of Testing Anti-Patterns*


    “It should work.” Without testing, one just doesn’t know if it will work. If there
    is not


    a repeatable test that compares a result, it is likely that small things will
    be missed.


    Not having tested it, one should not post, or accept, “I think….” statements,
    yet the


    web is full of these kinds of statements.


    *Mistakes of Process Omission * When doing the quick, “I just want to get it working….”


    it is startling to realize how much production code results from these simple
    quick


    implementations, and once it works, no one remembers to go back and review it.


    *Mistakes of Simple Forgetfulness * Reliance on function defaults such as htmlenti­


    ties() can cause problems. By default, the function does not encode single quotes,


    which can be disastrous if used under the right circumstances, for example, as
    part of


    an HTML attributes string.


    *Parameter Omission Anti-Pattern*


    It is safe to say that a majority of function examples on the web use default
    func­


    tion parameters and omit powerful parameter examples that could make the function


    secure. In each case below, an insecure function call is shown first, and then
    is com­


    pared to a secure function call made with nondefault secure parameters.


    *Common* HTMLSpecialChars() *Default Quoting Problem*


    htmlspecialchars($name);


    versus


    htmlspecialchars ($name, ENT_QUOTES, "UTF-8");


    This is a particularly bad set of defaults because it works so well most of the
    time.


    The reasons it is a bad example are many. (1) The default usage visually reinforces


    a subtle but strong mental acceptance that all data is equal and encourages a
    seri­


    ously bad practice of data type avoidance. This kind of habit can be hard to overcome'
