  md: "**138**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nOr\n\n$stmt->**execute**(array('id'\
    \ = > $id));\n\nWhat is the difference? Why does this work without security problems?\
    \ The reason\n\nis that internally, all parameters are strings to MySQL. MySQL\
    \ converts parameters\n\nto the appropriate type when needed by the type specification\
    \ of the table column.\n\nThis is the type declared in the CREATE TABLE syntax.\
    \ If the table column type\n\nis CHAR, the string is inserted. If the table type\
    \ is INT, the string is converted to an\n\ninteger type and then inserted into\
    \ the column.\n\nAn example of this auto-type conversion by MySQL is coded below.\
    \ Assuming\n\nthat the ‘name’ column type is CHAR, and that the ‘id’ column type\
    \ is INT\n\nSELECT name, email, id FROM members WHERE id = 5 //fine\n\nSELECT\
    \ name, email, id FROM members WHERE id = \"5\" //fine\n\nSELECT name, email,\
    \ id FROM members WHERE name = \"5\"//fine\n\nSELECT name, email, id FROM members\
    \ WHERE name = 5 //error\n\nWith PDO, the first example is very specific about\
    \ type. The fact is that this does\n\nnot, outside of being pedantic (which is\
    \ always good) matter so much for MySQL.\n\nHowever, since PDO is a wrapper for\
    \ other database engines, it might matter a great\n\ndeal. PDO, internally, will\
    \ know about the binding requirements of the database\n\nengine it is working\
    \ with. Specificity helps here. If your application will only ever be\n\nMySQL,\
    \ then the second two options are just as good.\n\nThe second example, since it\
    \ is not specified, treats the :id parameter as a string\n\ntype which will automatically\
    \ be converted by MySQL upon processing once MySQL\n\nknows the actual column\
    \ type.\n\nThe third example, unlike the previous two, does not use bindValue()\
    \ at all.\n\nInstead it takes a dynamically created array as a parameter. This\
    \ array must be con­\n\nstructed to match the named parameter criteria just like\
    \ any other method.\n\nThe array elements are all treated as strings and converted\
    \ as necessary by MySQL.\n\n*PDO Manual Quoting Example*\n\nThere are times when\
    \ it is needed or desired to manually escape a SQL input variable.\n\nThis is\
    \ accomplished with\n\npdo->**quote**($userID);\n\nThe difference between PDO\
    \ quote() and mysql_real_escape_string()\n\nis that quote() escapes according\
    \ to the connection character set, and encloses\n\nthe returned variable with\
    \ quotes. Mysql_real_escape_string() does not.\n\nThis can create SQL injection\
    \ opportunities as we saw previously."
