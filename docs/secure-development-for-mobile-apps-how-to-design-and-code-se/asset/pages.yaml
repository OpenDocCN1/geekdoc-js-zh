    **Secure Client Server Form Validation**


    *Shopping Cart Example * Items in a shopping cart do not pose a resubmit problem.


    The problem arises during payment processing. Resubmits can cause multiple pay­


    ments, which is a negative result for everyone. An implementation designed to
    avoid


    this would look like this:


    • Cart is created with the unique ID to track submission.


    • Reloads via Back button or F5 refresh reloads cart data from database.


    New items not added VIA GET request.


    • User specifically adds items via POST.


    • Purchase is made via POST.


    • When cart items are purchased, 303 redirect to receipt page.


    • After purchase, cart is destroyed or invalidated.


    • Transaction ID and data is saved in database.


    • Reloads via Back button or F5 refresh after purchase load empty cart.


    Submitting the same cart twice is now impossible.


    • If browser cache or proxy cache reload expired cart to satisfy a refresh from


    the Back button or F5 refresh, the cart submission would be denied at the


    server because the cached tracking ID would no longer be valid, so the cached


    cart submission would not be processed.


    *Mobile Sec Example * The example application for this book includes an example


    of the PRG process in the registration procedure. The form is filled out on the


    ­register.php page. The form is submitted to the register.php page via POST. If


    successful, the registration is redirected to the regComplete.php page, which
    is a


    GET request.


    *Tracking Form Tokens to Prevent Double Submission*


    Using form tokens to prevent multiple page submission consists of:


    • Start a session


    • Generate a unique form token


    • Add that token and timestamp to $_SESSION


    The form token is placed in a hidden field in the HTML form. The form variable


    name used here is formTracker. The complete example would look like this:


    <?php


    **session_start**();


    $formTracker = $nonceTracker->createNONCE();


    $formTracker = **hash**(''sha256'',


    **openssl_random_pseudo_bytes**(32_BYTES));


    $formTime = **time**();'
