    **Secure File Uploading**


    *Control File Permissions*


    Uploaded files, which are owned by the web server, only need read and write


    ­permission. The execute permission is not needed for serving a file. Err on the
    side of


    caution and make sure execute permissions on untrusted user-uploaded files is
    not set.


    *Limit Number of Uploaded Files*


    Setting limits on users prevents system abuse and is a good guideline until it
    needs to


    be expanded for the benefit of the users.


    *Optional: Use CAPTCHA*


    CAPTCHA can be helpful in preventing spam and wasted resources. It can be used


    to help prevent malicious uploads but can also be very annoying to users.


    User happiness is always most important. Unhappy users leave, which sometimes


    means sites die, which then means security is no longer necessary.


    *Optional: Use Virus Scan*


    The only way to possibly know about malicious data inside a file is to scan it
    with qual­


    ity anti-virus software. This can detect many kinds of bad files. However, anti-virus


    software is always a step or two behind and cannot be fully trusted. Treat it
    as a tool


    that helps remove obvious garbage from the system.


    The rule is:


    Treat all user uploaded files as an untrusted virus and handle each file according
    to each


    file’s designated type.


    For example, treat image files as images, set the header content type to image,
    and


    do not attempt to process them in a manner that might result in content execution.


    **Secure File Uploading to Database**


    The following sample code walks through the process of uploading, storing, and


    retrieving image files from a MySQL database according to a white list of acceptable


    image types. The code validates several aspects of an untrusted file while ­following


    the accepted guidelines above. The purpose of each validation check is not to
    ­guarantee


    that the uploaded file is in any way safe. The checks only ensure that a file
    contains the


    basic characteristics of the image files allowed, so that the uploaded file can
    be treated


    as an image. If a file does not contain these basic image properties, it is rejected
    as an


    invalid image. If the file does contain these properties, it is treated as an
    image file


    which can be stored, retrieved, and sent back to a browser with the HTML content


    type set as image. Passing or failing these checks has nothing to do with security
    or


    safety. They simply eliminate obvious garbage from entering the system.'
