  md: '**181**


    13


    Secure Session Management


    **The SSL Landing Page**


    Security should begin with two important elements in place. The first is that
    the user


    should know with a high degree of confidence to whom he or she is connected, and


    the second is that the user should trust that the communication is private and
    is not


    compromised. If these two elements do not exist, trust cannot be established.
    These


    factors therefore are primary elements in the security architecture of an application,


    and a Secure Sockets Layer (SSL) certificate is a critical element in implementing
    this


    foundation.


    SSL certificates accomplish two things. They identify the business registered
    with


    the domain name, providing assurance that the user is indeed connected to the
    correct


    server, and they also provide the encryption of traffic between a user’s browser
    and the


    server. The encryption aspect of an SSL connection receives so much of the spotlight


    that the fact that an SSL certificate properly identifies the connection endpoint
    to the


    user is almost forgotten. When a person enters a bank, he has the assurance of
    the


    physical building, that the address and business license are filed with the state,
    and


    that a way to resolve disputes via the Better Business Bureau exists. Armed guards


    are also usually present to provide protection. These factors combine to give
    assurance


    and protection to customers. It is possible to spoof a physical business, but
    it is quite


    difficult. Internet business needs the same level of assurance.


    For web transactions, SSL certifications are the established method for verifying


    the business a person is connected to. Modern browsers make it clear to a user
    when


    a connection is made to a server with a validated certificate. A lock appears
    onscreen,


    identifying the certificate, and the URL address bar turns green. These visual
    clues


    assist users in trusting the connection. By the same measure, invalid certificates
    and


    non-SSL connections are not trusted and give different visual cues.


    The foundation of good site security is now a combination of two architectural


    structures. The first is a valid HTTPS/SSL connection and the second is that users


    are directed to a landing page using this valid SSL connection in order to establish


    proper server identification and trust. This guarantees the user is connected
    to the site


    he/she intends. Most popular sites now utilize mandatory SSL landing pages. SSL
    is


    no longer optional, as it used to be. Facebook, Twitter, and Gmail all redirect
    users to


    an SSL-connected landing page to ensure the user of the identity of the site,
    and pri­


    vacy. Trust is then established to carry out all other security measures, such
    as ­logging


    in and using personal data.'
