  md: "**384**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThe first task is\
    \ to initialize cURL, done simply here.\n\n$cURL = cURL_init();\n\nNow we can\
    \ build the secure cURL options for using SSL and its powerful inher­\n\nent verification\
    \ capability. Turning on SSL verification is done by setting CURLOPT_\n\nSSL_VERIFYPEER\
    \ to true.\n\n**cURL_setopt**($cURL, CURLOPT_SSL_VERIFYPEER, TRUE);\n\nNext, set\
    \ the option to verify the host, and that the specified name matches the\n\nactual\
    \ connection endpoint. This is done by setting CURLOPT_SSL_VERIFYHOST\n\nto the\
    \ value 2\\. Anything else essentially defeats the purpose.\n\n**cURL_setopt**($cURL,\
    \ CURLOPT_SSL_VERIFYHOST, 2);\n\nThe last step is the most cumbersome, and is\
    \ most likely the reason verification gets\n\nturned off and ignored. A valid\
    \ certificate authority file must be obtained and stored\n\nwhere the application\
    \ can read it. Problems with this file being out of date or not exist­\n\ning\
    \ will cause SSL verification to fail.\n\n**cURL_setopt**($cURL, CURLOPT_CAINFO,\
    \ '../../private/cacert.pem');\n\nAfter configuring cURL to make secure calls\
    \ properly, the rest of the options are\n\nbuilt up in the options array.\n\n\
    $cURLOptions = array(\n\nCURLOPT_HTTPHEADER = > $headers,\n\nCURLOPT_HEADER =\
    \ > false,\n\nCURLOPT_URL = > $url,\n\nCURLOPT_RETURNTRANSFER = > true\n\n);\n\
    \nIf an additional option is passed into the function, as is the case with getAuth­\n\
    \nToken(), which passed in the ‘grant_type’ option, it is added here.\n\nif(**is_array**($newOption))\n\
    \n$cURLOptions = $cURLOptions + $newOption;\n\n**cURL_setopt_array**($cURL, $cURLOptions);\n\
    \nNow the call to Twitter is made.\n\n$json = **cURL_exec**($cURL);\n\nThe last\
    \ two lines close cURL properly, and return the decoded JSON object.\n\ncURL_close($cURL);\n\
    \nreturn json_decode($json);"
