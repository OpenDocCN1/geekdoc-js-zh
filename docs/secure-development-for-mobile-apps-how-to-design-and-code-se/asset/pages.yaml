  md: "**388**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Example 1*\n\n\
    ![](img/a1d8782fdf88e6a561fda104c93073e3_417_0.png)\n\nIn Example 1, the text\
    \ has been made safe, while the static text links have been acti­\n\nvated as\
    \ HTML. Notice in the browser info window along the bottom of the screen\n\nshot\
    \ that the twitter mention tag ‘@msg467’ correctly shows up as a link, ‘https://\n\
    \ntwitter.com/msg467’. Also, notice that in the word ‘Hello’, that the invalid\
    \ character\n\nhas been converted into a valid UTF-8 character. The Unicode characters\
    \ were safely\n\nfiltered without being altered and appear correctly.\n\n*Example\
    \ 2*\n\n![](img/a1d8782fdf88e6a561fda104c93073e3_417_1.png)\n\nIn Example 2, notice\
    \ that the script tag correctly contains a converted, valid U+FFFD\n\ncharacter.\
    \ Because of this newly embedded valid U+FFFD, the script tag itself is invalid.\n\
    \n*Example 3—Improperly Filtered Non-URL Text with Defense in Depth*\n\n![](img/a1d8782fdf88e6a561fda104c93073e3_417_2.png)\n\
    \nExample 3 shows a non-URL text being displayed with dropped invalid characters.\n\
    \nNotice that the script tag is complete and valid after the invalid character\
    \ was dropped.\n\nThe script is safely displayed because it was escaped for output\
    \ by htmlentities(),\n\nand is an example of defense in depth.\n\nThis example\
    \ demonstrates that when processing the tweet text for URLs, there\n\nare URL\
    \ string fragments and non-URL string fragments. This is an example of what\n\n\
    could happen when the non-URL string fragments are filtered differently than the\n\
    \nURL string fragments.\n\n**Using TweetFetcher**\n\nThe following script instantiates\
    \ the TweetFetcher class and invokes it to obtain the\n\nlatest tweets. It also\
    \ keeps the PHP code separate from the HTML, and outputs the\n\nHTML directly\
    \ in a nicely formatted manner that is easily styled via CSS. In addi­\n\ntion\
    \ to being easier to read and easier to maintain, it opens the way to enable Content\n\
    \nSecurity Policies and lock down script execution."
