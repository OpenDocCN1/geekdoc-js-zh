  md: '**143**


    10


    Template Strategy Patterns


    The Template pattern is one of twenty-three design patterns outlined in the book


    *Design Patterns: Elements of Reusable Object-Oriented Software* by Erich Gamma,


    Richard Helm, and Ralph Johnson (1994). This book focuses on the first pattern


    because the intent of the Template pattern is to enforce a series of steps. Enforcing
    a


    series of steps is an essential element of providing security. This makes the
    Template


    pattern a useful tool in architecting secure software.


    **Template Pattern Enforces Process**


    The Template pattern enforces process and a basic example of where the true useful­


    ness of this would occur in real world programming is the process of registering
    a user.


    Registering a user requires a series of steps that must always be executed. Here,
    the


    logic is presented to architect this pattern in PHP. The focus is on architecting
    the


    pattern with language constructs of PHP. Chapter 15 implements an actual account


    management class that registers a user as a member.


    In the design of this system, registration is a two-step process. Step one is
    to ­register


    the user, and step two is to activate the account.


    *Account Registration Template*


    The functions to implement the steps of this process would be:


    1. validateRegistrationData()


    2. createPasswordHash()


    3. createActivationCode()


    4. storeUserDataAsInactive()


    5. sendRegistrationEmail()


    After performing these steps, the account is inactive and cannot be logged into
    until


    the account it verified by processing the account activation code is sent to the
    user.


    The process of activating the account is the design of a second Template pattern.


    These functions always need to be called in this order for every registration.
    How do


    we enforce this behavior? This is the need that created the Template pattern.
    Here is


    how it is implemented in PHP.'
