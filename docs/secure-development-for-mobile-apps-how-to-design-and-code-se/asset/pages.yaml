    \ (xhr, ajaxOptions, error){\n\nalert(error);\n\n}\n\n});\n\n}\n\n**Map Marker\
    \ Database Table**\n\nThe table columns are important. They serve as the foundation\
    \ of the security ­filter\n\nsystem. Column type and size determine the filter\
    \ specifications for ­several aspects.\n\nBy knowing that a column is a double,\
    \ then all data that is not a double can be rejected.\n\nBy knowing that a column\
    \ is 80 characters, sanitization and ­validation ­routines,\n\nsuch as mb_substr\
    \ and regular expressions can be set for specific lengths. This\n\nsaves memory,\
    \ prevents extra processing, and helps fight Denial of Service attacks by\n\n\
    rejecting extra long strings. Knowing and ­defining the ­column types makes ­filtering\n\
    \nand validation a much simpler and ­precise task.\n\nIn this case, the JavaScript\
    \ Validate function used the size of the location and desc\n\ncolumn to validate\
    \ user input. The server side PHP code uses the same specification\n\nto filter\
    \ the incoming request data as well as the lat and lon definitions to decide upon\n\
    \ngood data.\n\nCREATE TABLE IF NOT EXISTS 'map_markers' (\n\n'id'\n\nINT(11)\
    \ NOT NULL AUTO_INCREMENT,\n\n'lat'\n\nDOUBLE(10,6) NOT NULL,\n\n'lon'\n\nDOUBLE\
    \ (10,6) NOT NULL,\n\n'location'\n\nCHAR(60) NOT NULL,\n\n'desc'\n\nCHAR (80)\
    \ NOT NULL,\n\nPRIMARY KEY ('id')\n\n) ENGINE=InnoDB DEFAULT CHARSET=utf8 AUTO_INCREMENT=1;"
