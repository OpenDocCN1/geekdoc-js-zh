    **Secure Session Storage**


    Any exceptions that arise here are unrecoverable and the script should end after


    logging the critical error. If the database is unavailable, sessions are unavailable,
    and


    the user needs to be informed that the site is down and to come back later.


    The constructor calls session _ set _ save _ handler() with an instance


    of itself, binding the class object to the handler, and, importantly, sets register
    _


    shutdown _ function to call its write function on shutdown, with the ‘true’


    parameter.


    Its last task is to call startSecureSession() which contains the logic for actu­


    ally starting the session.


    open() is called first in the session life cycle. Any preliminary actions that
    need to


    occur can take place here. In order for the virtual override of SessionHandlerInterface


    to work, open() must have two parameters in the function signature. These are


    $path and $sessionName. If the session ID is needed, ­session _ id() can be


    called to obtain it.


    In this implementation, there is nothing to actually do. So the function simply


    returns true.


    close() is called at the end of the session life cycle, just after write() is
    called


    with the session data to be stored. close() takes no parameters. Since no parameters


    are passed to close(), session _ id() can be called to obtain the ID for any


    cleanup processing based on session ID.


    Again, in this implementation there is nothing to do. Simply return true and exit.


    startSecureSession() The function starts by setting the session name,


    which sets the cookie name. Then the session cookie parameters are set. These


    are very important settings. The expiration time of zero means to expire the


    cookie when the browser closes. Change this if needed. The path of / says this


    cookie should be sent to all the pages of the domain. The secure cookie setting


    of ‘true’ means that this cookie will only be sent over HTTPS connections. The


    setting of HTTP Only tells the browser not to let JavaScript have access to the


    cookie. These settings must be configured before session _ start is called


    as they are sent to the ­client browser via an HTML header. Once session _


    start is called, or HTML content is sent to the browser, then the settings are


    not effective.


    The next step is to call setSecureConfig(). This function calls an entire series


    of init_set() functions to completely configure session management. These


    ­settings should ideally already be set in php.ini, and this function can be commented


    out or optionally called. However, if you are unsure of php.ini or wish to enforce
    that


    these are the settings used, call setSecureConfig();.


    The generic request array, the PHP super global $_REQUEST, is unset, thus


    destroying it and any future access to it. This forces the application to plan
    for'
