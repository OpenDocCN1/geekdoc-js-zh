  md: "**246**\n\n**Secure Development for Mobile Apps\uFEFF**\n\ngetNonce() creates\
    \ the nonce with a call to ­createNONCE() and sets both the\n\n$_SESSION value\
    \ and the nonce’s array value at the same time to the same value.\n\n$_\aSESSION['formNonce']\
    \ = $this->nonces['current'] = $this->​\n\ncreateNONCE();\n\nreturn $this->nonces['current'];\n\
    \nThe newly created nonce becomes the current nonce. This is the nonce that goes\n\
    \ninto the hidden form field. When the form is submitted, this current value is\
    \ checked\n\nagainst what becomes the previous value.\n\ncheckNONCE() Here the\
    \ incoming nonce is checked for equality against the previ­\n\nous nonce using\
    \ the ternary operator.\n\n\areturn ($this->nonces['previous'] = = $nonce) ? true\
    \ : false;\n\nvalidateFormNonce()\n\nif(!self::checkNONCE($nonce))\n\n{\n\n//invalid\
    \ nonce\n\n//possibly log out\n\n//log error\n\n//R\aedirect the user to private\
    \ page and exit script to stop\n\nprocessing\n\nredirectIt(SECURELOGIN);\n\n//exit\
    \ script - stop processing\n\nexit();\n\n}\n\nThis function wraps the call to\
    \ checkNONCE() in order to encapsulate any error\n\nhandling. If checkNONCE()\
    \ fails, then the form should not be processed, and the\n\nuser is redirected\
    \ back to the hardcoded login URL where a new form with a new\n\nnonce is presented,\
    \ and the process can begin again.\n\nIt is important that exit() is called after\
    \ the redirect so that no other processing\n\noccurs.\n\nprocessFormNonce()  is\
    \ a wrapper that isolates the $_POST array checks. This\n\nsimply keeps any reference\
    \ to $_POST array in one location in the class. It then calls\n\nvalidateFormNonce()\
    \ with the extracted nonce.\n\nAll three of the above functions could have been\
    \ placed into a single function;\n\nhowever this keeps each task isolated."
