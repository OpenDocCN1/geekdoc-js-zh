  md: '**109**


    **UTF-8 for PHP and MySQL**


    *UTF-8 Output Functions*


    While not explicitly multi-byte, the following functions have been shown to work


    with UTF-8 only strings for the reasons stated. trim(), rtrim(), and ltrim()


    should be multi-byte safe on UTF-8 only strings because multi-byte UTF-8 charac­


    ters do not contain byte sequences that resemble white space. strip_tags() should


    also be multi-byte safe on UTF-8 only strings because multi-byte UTF-8 characters


    do not contain byte sequences that resemble less-than or greater-than symbols.


    For both sets of functions above, this is not true for UTF-16 and UTF-32 character


    encodings.


    *PHP* htmlentities($str, ENT_QUOTES, "UTF-8", false) This function,


    htmlentities(), is one of PHP’s primary defensive programming tools. It is the


    main workhorse for properly escaping output to nullify and prevent XSS attacks.


    Proper escaping is an essential to protect contexts from malicious characters.
    In order


    for escaping to function correctly the underlying character set must be understood.


    Therefore it needs to be called explicitly with the UTF-8 parameter to tell it
    how to


    escape characters. This can get cumbersome since it will most likely be called
    many


    times during script execution. A façade wrapper helps tremendously here. It is
    shorter


    and helps prevent forgetting to set the function properly.


    The second parameter, ENT_QUOTES, is critical to pay attention to. It says to


    encode double and single quotes. By default only double quotes are encoded. This
    is


    important because if a single quote is not encoded, it can be used to escape out
    of a


    context such as an HTML attribute. If an HTML attribute is single quoted and user


    data is inserted that does not have single quotes escaped, then the context could
    be


    broken out of and code could be executed.


    The fourth, and optional, parameter, which is seldom used, is the double_encode


    parameter. This is set to true by default, and tells htmlentities() to encode
    every­


    thing. This could double encode existing entities if they already are present
    in the


    string, which can make some input display incorrectly. Setting this to false,
    which we


    will do later when filtering third-party text, does not double encode existing
    entities


    and therefore the text displays correctly.


    A façade wrapper for htmlentities() to make inline calls easier and shorter:


    <?php


    function _H($output)


    {


    return htmlentities($output, ENT_QUOTES, ''UTF-8'') ;


    }


    ?>


    **Note:**If you are not calling this function *a lot*, it is an indicator that
    something could


    very well be wrong, and XSS holes most likely exist in the application.'
