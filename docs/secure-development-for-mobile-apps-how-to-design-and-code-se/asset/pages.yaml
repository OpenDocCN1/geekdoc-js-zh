  md: '**133**


    **PHP and PDO**


    **PDO Prepared Statements**


    In addition to providing escaping protection, prepared statements can be executed


    several times with new variables without recompiling the SQL statement. There
    are


    two ways to use placeholders for prepared statements, named and unnamed. Named


    placeholders are specific and are easier to read and track. Unnamed placeholders
    can


    be a little harder to debug but allow more flexibility about which variable goes
    into the


    statement. Examples of both are listed here.


    Named parameter placeholders:


    $pdo->**prepare**("INSERT INTO members (name, email, id)


    VALUES (:name, :email, :id)");


    Unnamed parameter placeholders:


    $pdo->**prepare**("INSERT INTO members (name, email, id)


    VALUES (?, ?, ?);


    *Prepared Statement Examples*


    *PDO Named Parameters Example*


    //named parameter placeholders


    $stmt = $pdo->**prepare**("INSERT INTO members (name, email, id)


    VALUES (:name, :email, :id)");


    //bind the variables using the named placeholder syntax


    $stmt->**bindValue**('':name'', "MeloDee", PDO::PARAM_STR);


    $stmt->**bindValue**('':email'', baker@mobilesec.com, PDO::PARAM_STR);


    $id = 2;


    $stmt->**bindValue**('':id'', $id, PDO::PARAM_INT);


    $stmt->execute();


    Three simple steps are performed. First, the SQL statement is prepared with named


    placeholders. Then values are bound to the named placeholders. The name of the
    first


    parameter in bindValue() is the exact name of the named placeholder. Since these


    are named, they do not need to be in order. The use of the preceding colon in
    the


    parameter name for bindValue is not necessary, but obviously the name needs to


    match. ­bindValue can bind to the value of a variable as well, as in the example


    above. The difference between bindValue() above, and bindParam(), in the


    example below is that bindValue() grabs the value at the time it was called. bind­


    Param() grabs whatever value is assigned to the variable when execute() is called.


    bindParam() is essentially a reference to a variable, so the value of the variable
    can


    change, and bindParam() is updated accordingly. bindValue() also takes a third


    parameter that explicitly identifies the parameter type. By default, the parameter
    type


    is PDO::PARAM_STR. This is what enables the use of arrays with unspecified types


    in the next examples.'
