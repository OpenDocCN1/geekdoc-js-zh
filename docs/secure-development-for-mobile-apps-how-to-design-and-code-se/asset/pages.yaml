  md: "**373**\n\n**Google Maps, YouTube, and jQuery Mobile**\n\n**Preparing Safe\
    \ JSON Data**\n\nHere we look at examples of preparing database records for output\
    \ into HTML\n\ncontext. There are a few ways this can be done. Two primary methods\
    \ are json_\n\nencode() and htmlentities().\n\nAs examples, there are two similar\
    \ but different files given to dynamically load data\n\nfrom the database and\
    \ serve a URL and a user-supplied custom message in JSON\n\nformat back to the\
    \ client. As mentioned in the JavaScript section, loadVideoURL.php\n\ndoes not\
    \ escape the data, only json_encodes() the output, which does perform\n\nsome\
    \ escaping, and loadSafeVideoURL.php, which in addition to JSON encoding the\n\
    \noutput, also escapes the data. Again, each is commented so you can trace it\
    \ through.\n\nThe URL returned is not escaped. However, it is safe because it\
    \ is both validated\n\nand sanitized, and only contains allowed characters. It\
    \ is guaranteed not to contain\n\nany harmful characters after the regular expression\
    \ validation in validateYou­\n\nTubeURL() function.\n\nAs a reminder, validation\
    \ means it complies with a known format. Sanitization\n\nmeans harmful characters\
    \ are stripped out. They are not the same thing. Both pro­\n\ncesses, one of the\
    \ processes, or none of the process can be applied to a variable.\n\nThe user-supplied\
    \ message, video _ msg, must be escaped because it cannot be\n\nsanitized the\
    \ same way that the URL can. It is not matched against an allowed char­\n\nacters\
    \ set, and needs escaping in order to neutralize harmful characters. The database\n\
    \ncontains an embedded script tag to help highlight the point. In both files,\
    \ care is taken\n\nto form a JSON object, and not just an array.\n\nA JSON object\
    \ must be surrounded by curly braces and not array brackets.\n\n{\"test\":\"Test\"\
    }\n\nNOT\n\n[\"test\":\"Test\"]\n\nAdding the following parameters to json_encode(),\
    \ such as:\n\n**json_encode**($safeJSON, JSON_HEX_TAG | JSON_HEX_QUOT | JSON_HEX_AMP)\n\
    \ndoes not prevent the unescaping and execution of the script tag on the client.\n\
    \nFirst, let’s look at validateYouTubeURL(). This is the function that uses a ­regular\n\
    \nexpression to ensure that a URL is safe to use.\n\nfunction validateYouTubeURL($url)\n\
    \n{\n\n//\aREGEX pattern for valid youtube urls such as //www.youtube.\n\ncom/v/upe_Cd08lRI\"\
