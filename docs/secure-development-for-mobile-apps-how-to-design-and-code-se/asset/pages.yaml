  md: "**57**\n\n**PHP Security Anti-Patterns**\n\necho '<tr><th>Post</th><th>Date</th><th>Info</th></tr>';\n\
    \nec\aho '<td>',$value1,'</td>'.'<td>',$value2,'</\n\ntd>'.'<td>',$value3,'</td>';\n\
    \n}\n\n*Too Many Database Function Calls*\n\nThe code below is a code pattern\
    \ to avoid. Code like this is common in tutorials.\n\nThe basic problem with this\
    \ example is that there are too many holes to plug. There are\n\ntoo many SQL\
    \ statements to protect. The output context, and data content are more\n\ndifficult\
    \ to determine. Code changes become more laborious. There are just too many\n\n\
    places that output data needs to be filtered and escaped, and so a developer loses\
    \ control\n\nof security measures.\n\n**echo** '<h2>Blog List</h2>';\n\n$result\
    \ = **mysql_query**('SELECT * FROM Blogs\");\n\nif(**mysql_num_rows**($result))\
    \ {\n\n**ec\aho** '<table cellpadding = \"0\" cellspacing = \"0\" class =\n\n\"\
    db-table\">';\n\n**echo** '<tr><th>Blog</th><th>Date</th><th>Info</th></tr>';\n\
    \n**while**($row = **mysql_fetch_row**($result))\n\n{\n\n**echo** '<tr>';\n\n\
    **foreach**($row as $key = >$value) {\n\n**echo** '<td>',$value,'</td>';\n\n}\n\
    \n**echo** '</tr>';\n\n}\n\n**echo** '</table><br/>';\n\n**echo** '<h2>Post List</h2>';\n\
    \n$result2 = **mysql_query**('SELECT * FROM Post\");\n\nif(**mysql_num_rows**($result2))\
    \ {\n\n**ec\aho** '<table cellpadding = \"1\" cellspacing = \"1\" class =\n\n\"\
    db-table\">';\n\n**echo** '<tr><th>Post</th><th>Date</th><th>Info</th></tr>';\n\
    \n**while**($row2 = **mysql_fetch_row**($result))\n\n{\n\n**echo** '<tr>';\n\n\
    **foreach**($row2 as $key = >$value) {\n\n**echo** '<td>',$value,'</td>';\n\n\
    }\n\n**echo** '</tr>';\n\n}\n\n**echo** '</table><br/>';\n\nThe solution to this\
    \ is *separation of concerns*. This topic is covered in depth in\n\nChapter 8."
