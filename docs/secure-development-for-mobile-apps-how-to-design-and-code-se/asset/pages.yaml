    \ the highest\n\namount of randomness. This function usually performs faster than\
    \ mt _ rand()\n\nas well.\n\nha\ash('sha256', openssl_random_pseudo_bytes\n\n\
    (OPEN_SSL_RANDOM_BYTES_SIZE));\n\nHere, openssl_random_pseudo_bytes() is creating\
    \ a random 32 byte\n\nblob and feeding it to the hashing function. The amount\
    \ of random bytes returned\n\nis set by the constant, OPEN_SSL_RANDOM_BYTES_SIZE,\
    \ which is defined\n\nas 32 in the globalCONST.php file. This value can be of\
    \ any size. Make it larger if\n\nrequired. SHA256 returns a 64-character string\
    \ (256 bytes/4 byte character) con­\n\nsisting of 9–0, a–f. This string is useful\
    \ as a safe string to pass via HTML as a value\n\nin forms.\n\nIf OpenSSL is not\
    \ available or for some reason performs unacceptably slowly, the\n\nfallback should\
    \ be:\n\nreturn **hash**('sha256', **uniqid**(**mt_rand**(), true));\n\nBecause\
    \ the generation of form nonces might be a highly frequent activity, perfor­\n\
    \nmance is important. The consideration between a highly secure number and a strong\n\
    \nnumber is a choice for the developer based on usage.\n\nRemember, an inherent\
    \ strength of this number is that it is a one-time, discardable\n\nnumber which\
    \ changes on every request. It does not persist like a password where it\n\ncan\
    \ be attacked over time. (The nonce could be attacked, but even when it is guessed,\n\
    \nthat particular nonce would probably already be deleted from the system and\
    \ be useless\n\nto the attacker.) These are the reasons for the design of the\
    \ nonce. While not a high\n\nquality encryption grade number, this is a fairly\
    \ strong number against brute force\n\nguessing because of the manner in which\
    \ brute force guessing would need to work\n\nin this case. Because the number\
    \ is a nonce, and because guessing it would involve\n\nrepeated requests over\
    \ the web, which is slow and obvious over time, the number\n\ndoes not necessarily\
    \ need to be of CSPRNG quality. This is a choice, and the number\n\ncertainly\
    \ could be a higher quality CSPRNG number if desired by using openssl_\n\nrandom_pseudo_bytes()\
    \ instead. Be sure to Base64 encode it before using with\n\nHTML.\n\nMost CSRF\
    \ attacks occur because there is no checking at all, not because the nonce\n\n\
    identifier itself was successfully attacked."
