  md: "**50**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*The Assumed Clean\
    \ Anti-Pattern*\n\nAnother side effect of assuming the variables are clean is\
    \ that a SQL string like the\n\nfollowing might be used.\n\nSELECT * FROM Users\
    \ WHERE id = $cleanID;\n\nThe lack of quotes around $cleanID still leaves it open\
    \ to attack. If $cleanID\n\nwere to equal \"22; DELETE FROM Users\", there is\
    \ nothing for addslashes()\n\nto do in this case, and because of the semicolon,\
    \ the query would now become two\n\nseparate queries.\n\nSELECT * FROM Users WHERE\
    \ id = 22; DELETE FROM Users;\n\n**Note:**  addslashes() missed an important control\
    \ character. In fact, neither add­\n\nslashes(), nor strip_tags() were able to\
    \ help in this case.\n\nFinally, there is no accounting for output context. Variables\
    \ are output in any fash­\n\nion because they are assumed to be clean.\n\n*Improper*\
    \ mysql_real_escape_string() *Usage*\n\nFirst, it must be said, mysql_real_escape_string()\
    \ filters strings, not integers.\n\nThere is no need to escape integers in a SQL\
    \ statement. mysql_real_escape_\n\nstring() has no effect on integers, and can\
    \ lead to exactly the same problem as\n\nabove if the escaped variable is not\
    \ quoted.\n\nSE\aLECT * FROM Users WHERE id = **mysql_real_escape_**\n\n**string**($cleanID);\n\
    \nSince the variable is neither quoted, nor converted to an integer, the SQL string\
    \ is\n\nopen to this kind of attack:\n\n$cleanID = \"22 OR 1 = 1\";\n\nSELECT\
    \ * FROM Users WHERE id = 22 OR 1 = 1;\n\nThis statement is one statement that\
    \ returns all user records. This occurred because\n\nthe lack of quotes allowed\
    \ the \"OR 1 = 1\" to become part of the SQL logic. If the\n\nvariable in the\
    \ statement had been quoted like this,\n\nSE\aLECT * FROM Users WHERE id = '{mysql_real_escape_\n\
    \nstring($cleanID)}';\n\nthen the result would have been\n\nSELECT * FROM Users\
    \ WHERE id = '22 OR 1 = 1';"
