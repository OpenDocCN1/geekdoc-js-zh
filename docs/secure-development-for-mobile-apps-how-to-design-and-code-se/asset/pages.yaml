  md: "**182**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nBecause of a certificate’s\
    \ ability to provide site identification and encryption, it\n\nis a best practice\
    \ of modern security to enforce a site’s homepage as a secured SSL\n\n­connection.\
    \ The establishment of this encrypted trust then makes secure session\n\n­management\
    \ much more meaningful. Even if the homepage contains no critical data,\n\nthe\
    \ SSL certification correctly identifies the business.\n\nIt is possible to protect\
    \ user data with other schemes, but SSL is the ­established\n\nmethod for establishing\
    \ user trust. It is not transparent to the user what is ­happening\n\nbehind the\
    \ scenes. Visual feedback provided by the browser for HTTPS/SSL\n\n­connections\
    \ is the strongest, and in most cases, the only way to inform the user that\n\n\
    the connection is trusted. SSL increases user confidence, which makes it a good\
    \ choice\n\nfor securing a connection and as a foundational element of site security\
    \ architecture.\n\n*Secure Session Overview*\n\nPHP session management is the\
    \ mechanism for identifying and tracking a user’s\n\nactivity. A secure session\
    \ provides a high degree of protection for user data. A com­\n\npromised session\
    \ endangers a user’s account data and can lead to unauthorized site and\n\naccount\
    \ access. Therefore, session management is critically important to implement\n\
    \ncorrectly.\n\nPHP provides many tools and options for configuring, securing,\
    \ and managing\n\n­sessions. Here we look at these options and ways to put them\
    \ into effective use.\n\n*Secure Session Management Checklist*\n\nAn overview\
    \ of processes that need to be implemented as part of a secure session\n\nmanagement\
    \ system is as follows.\n\n1. Begin session with SSL connection.\n\n2. Check your\
    \ session management configuration.\n\n3. Enable a highly unpredictable session\
    \ ID.\n\n4. Verify that session IDs were actually generated by your server.\n\n\
    5. Enable HTTP only and secure cookies via PHP.\n\n6. Enable secure login over\
    \ SSL.\n\n7. Always regenerate a session ID on successful authentication.\n\n\
    8. Force users to re-authenticate with password over SSL on any critical actions.\n\
    \n9. Always regenerate a session ID on privilege elevation.\n\n10. Store all session\
    \ data in server session array only.\n\n11. Make logout option available on every\
    \ page.\n\n12. Upon logging out, explicitly destroy all user session data on the\
    \ server.\n\n13. Force expiration of session cookies on the server.\n\n14. Explicitly\
    \ and immediately destroy session on suspicious activity.\n\n15. Use only cookies\
    \ for session ID transmission."
