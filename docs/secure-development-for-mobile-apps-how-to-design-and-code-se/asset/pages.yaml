- img_proc: true
  md: "**203**\n\n**Secure Session Storage**\n\nIt is important to index both the\
    \ session_id field and the access_time field.\n\nThe session_id field needs indexing\
    \ so that sessions can be found as quickly as pos­\n\nsible. Do not make MySQL\
    \ search through all the records to find the one it needs.\n\nMySQL should be\
    \ able to go directly to the record as fast as possible, and that only\n\n­happens\
    \ with an index. The access_time field needs an index so that garbage collec­\n\
    \ntion, which uses a timestamp criteria, is able to delete quickly without having\
    \ to search\n\nall records. Without an index, garbage collection would have to\
    \ search through every\n\nrecord to find all the expired records, which could\
    \ be very time consuming. A general\n\nrule on indexing is to index columns that\
    \ are commonly used in WHERE clauses. These\n\ntwo fields, session_id and access_time\
    \ meet this criteria.\n\nCREATE TABLE sessions (\n\nsession_id\n\nCHAR(43) NOT\
    \ NULL,\n\nsession_data\n\nTEXT NOT NULL,\n\nsession_access_time\n\nTI\aMESTAMP\
    \ NOT NULL DEFAULT CURRENT_\n\nTIMESTAMP,\n\nPRIMARY KEY (session_id),\n\nINDEX\
    \ (session_access_time))\n\nENGINE InnoDB DEFAULT CHARSET = utf8 COLLATE = utf8_general_ci;\n\
    \nAnother optimization is to make the session_id field Latin character set. There\n\
    \nis no need to make it UTF-8\\. The only characters that will ever be stored\
    \ in that col­\n\numn are 0–9, a–z, A–Z, “-”, and “,”. The field will always be\
    \ a fixed size. No need to\n\nuse VARCHAR. The session_data field should be UTF-8\
    \ because session data\n\nmay hold UTF-8 characters.\n\nFinally, it is critical\
    \ to make the engine InnoDB. InnoDB provides row level, or record-\n\nlevel locking,\
    \ which is desired because entire table locking, as provided by the MyISAM\n\n\
    engine would hurt performance as traffic and session activity increased. The code\
    \ for the\n\nSecureSessionPDO class specifically uses row-level locking for fastest\
    \ performance.\n\n*Overriding Session Save Handler * The function session_set_save_­handler()\n\
    \ncan be called in two ways. The older way, still valid, is to call it with the\
    \ six function\n\nnames for each of the standard functions. That would look like\
    \ this:\n\nse\assion_set_save_handler(\"open\", \"close\", \"read\", \"write\"\
    ,\n\n\"destroy\", \"gc\");\n\nThe new way, and the way used in this class, is\
    \ to inherit from SessionHandlerInterface,\n\nand make the call like this:\n\n\
    class SecureSessionPDO implements SessionHandlerInterface\n\n{\n\npubic function\
    \ _construct()\n\n{\n\nsession_set_save_handler($this, true);\n\n}"
