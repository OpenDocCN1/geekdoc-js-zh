  md: '**51**


    **PHP Security Anti-Patterns**


    where, because of the quotes surrounding the {}s, the variable ''id'' becomes
    the


    string "22 OR 1 = 1" that does not match anything, and does not become part of


    the SQL logic.


    mysql_real_escape_string() is an improvement over addslashes()


    because it escapes based on the character set encoding of the current database
    client


    connection. It is important to match character encoding sets or data will get
    parsed


    incorrectly which obviously is not good. However, the function still must be used


    correctly as in the above example. Again, mysql_real_escape_string() is for


    strings and not for integers.


    The better method in this case would be to not use mysql_real_escape_


    string() in this case, and use something like intval() instead.


    $query = "SELECT * FROM Users WHERE id = ". **intval**($cleanID);


    mysql_real_escape_string() is deprecated in favor of mysqli_real_


    escape_string() and PDO quote() and PDO prepared statements. PHP 5.2


    is also now officially deprecated and no longer being updated. Security maintenance is


    at an end. We deal with it here because legacy code will be around for a while
    and it


    is important to understand it.


    The rest of this book focuses exclusively on PDO prepared statements and PDO


    quote(). Example code uses PDO prepared statements whenever it can, In cases


    where PDO prepared statements do not accommodate the type of query needed,


    such as variable columns names, the code uses the PDO quote() function to filter


    input to be used with PDO query(), along with white listing to provide secure


    SQL logic.


    There is nothing wrong with the new MySQL library of database functions. It just


    won’t be used in the code base for this book. Use MySQL and its prepared statements


    if you prefer.


    *Filtering versus Escaping versus Encoding*


    To prevent attacks and preserve user data, it is important to understand the ­difference


    between filtering, escaping, and encoding. Filtering usually implies removing


    data from a stream. The function strip_tags() does this. Data is thrown out.


    The PDO::quote() function is not actually a filter. It is an escaper for the data­


    base context. It escapes the characters passed in. Nothing is removed. The function


    ­htmlentities() is an encoder. Data is physically altered when returned from this


    function. This can be destructive or nondestructive based on when it is used.
    If you


    save data after being HTML encoded, the data is altered. If you send HTML encoded


    data to a browser, altered data is sent but the browser decodes it back, preserving
    the


    data. If data is entity encoded, saved to the database, and then entity encoded
    again


    for output into HTML, then the data is double encoded, which looks terrible and
    is


    sometimes illegible.'
