  md: "**166**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nErrorDocument directives\
    \ in .httpaccess to map error codes to custom response pages.\n\nThis is done\
    \ by adding the following lines to .httpaccess:\n\nErrorDocument 400 /badRequest.php\n\
    \nErrorDocument 401 /badAuth.php\n\nErrorDocument 403 /forbidden.php\n\nErrorDocument\
    \ 404 /pageNotFound.php\n\nErrorDocument 500 /internalServerError.php\n\nDefault\
    \ behavior always negatively affects quality, so implementing good messages\n\n\
    for users enhances the quality of a site. A few design considerations that should\
    \ go into\n\ncustom messages are:\n\n• Use an error page design consistent with\
    \ the look and feel of the site.\n\n• Provide a message targeted for response\
    \ needed; technical errors are meaning­\n\nless to users.\n\n• Be polite.\n\n\
    • Be helpful to the users, not to the developers.\n\n• Give the user useful options.\
    \ Keep in mind what the user can do, not what\n\na developer should do.\n\n• Always\
    \ remember that users can get annoyed and leave.\n\n**Configuring PHP Error Environment**\n\
    \n*Secure php.ini and Error Log Files*\n\nTo ensure an ongoing secure environment,\
    \ it is important that configuration and log\n\nfiles not be tampered with. There\
    \ are two basic steps for protecting configuration files.\n\n• First, set file\
    \ permissions on php.ini to 600.\n\n• Second, these settings can be added to the\
