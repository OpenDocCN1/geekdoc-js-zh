    **Introduction to Mobile Security Development**


    Technically, it is safe to:


    Display a UTF-8 variable out into UTF-8 HTML using echo htmlentities (variable,


    ENT-QUOTES, “UTF-8”);


    Again, there is no other technical safety implied here. The variable under this


    ­process is not safe for a MySQL parser.


    The term *escape out into* is used specifically to describe the process by which
    the


    ­variable is going out of the PHP parser and into the MySQL parser, or out of
    the PHP


    parser and into the browser HTML parsing engine.


    **Note:**This is, despite common usage as such, why mysql_real_escape_


    string() is not a PHP variable input cleaner. It is a MySQL connection aware,


    character set knowledgeable, *input preserver* for strings.


    The reason safety is achieved in each particular case is that character sets are


    matched and correct escaping is performed based on the criteria for the appropriate


    parsing engine. Outside of these particular cases, it is not known what could
    happen,


    which opens a potential security hole. This is why a variable cannot be assumed
    to be


    safe in any other setting or condition. That is the battle of the data context.


    The next battle is the battle of the attack vector. Every input and every output
    is a


    potential attack vector. This includes, $_POST**,** $_GET**,** $_REQUEST**,**
    $_COOKIE**,**


    $_SERVER**,** $_FILES**,** $_ENV**,** and$_SERVER. It also includes any untrusted
    data


    the application obtains from database queries, and HTTP requests made to third


    ­parties. For the moment, the discussion will focus on POST and GET.


    A POST request is no safer than a GET request. Both are direct input attack


    ­vectors into an application. The difference is that they are completely different
    attack


    vectors. If one simply eliminated the processing of all GET requests from one’s
    appli­


    cation, the resulting effect is the closure of that attack vector and the elimination
    of


    that category of attack. The net security result is that total threats are reduced,
    and the


    application is less vulnerable. It does not make the application “safe.” Next,
    POST has


    to be dealt with.


    If one makes all GET requests truly a read only operation, for static HTML


    pages, that also has the effect of closing off certain attack vectors and decreases


    threats. It  does not make it completely safe. If the only data modifications
    are


    made through POST requests, defensive programming has a chance of increased


    effectiveness because the attack vectors are reduced. Fewer attack vectors reduce


    defensive programming complexity, which is helpful. If one chooses to look at
    it


    like this, there is a beneficial reason to the practice in defensive programming
    for


    disabling the use of the $_REQUEST array, and only use $_GET for read only


    requests, and $_POST for write modifications. The problem with the $_REQUEST


    array is that it merges two ­completely different attack vectors into the same,
    single


    attack vector. Source ­distinction is lost, and a developer loses some direct
    control


    over the defense strategy.'
