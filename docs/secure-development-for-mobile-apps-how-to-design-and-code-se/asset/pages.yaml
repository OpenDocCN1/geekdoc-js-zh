  md: "**421**\n\n**Common Facebook Canvas Vulnerability Points**\n\n**Reflecting\
    \ Messages**\n\nWhen content is taken from one Facebook user and sent to another\
    \ Facebook user to\n\nbe posted on their canvas from your server, use inline PHP\
    \ and escape for HTML\n\ncontext, and remember to not double encode or recode\
    \ data.\n\n<h3>\a<?php echo (htmlspecialchars($title, ENT_XHTML,\n\n'UTF-8', false));?></p>\n\
    \n<p>\a<?php echo (htmlspecialchars($msg, ENT_XHTML,\n\n'UTF-8', false));?></p>\n\
    \n**Reflecting URLs**\n\nMake sure that URL data is being properly escaped before\
    \ sending on to trusting\n\nusers, and make sure the attribute value is quoted.\n\
    \n<a href=\"http://www.yoursite.com/?url=\n\n<?php echo(**urlencode**(**$untrustedURL**));?>\"\
    >\n\n**JavaScript and JQuery Filters**\n\nThere are a few methods via JavaScript\
    \ and JQuery that help prevent attacks. Use these.\n\nAvoid $(#newMessage).**html**(untrusted);\n\
    \n*Method 1*\n\nUse JavaScript to escape untrusted data:\n\nfunction escapeHTML(untrusted)\n\
    \n{\n\nreturn untrusted\n\nreplace(/&/g, \"&amp;\")\n\nreplace(/</g, \"&lt;\"\
    )\n\nreplace(/>/g, \"&gt;\")\n\nreplace(/\"/g, \"&quot;\")\n\nreplace(/'/g, \"\
    &#039;\");\n\n}\n\n*Method 2*\n\nUse JQuery’s text() method to filter out HTML:\n\
    \nvar escaped = $('<p></p>').**text**(untrusted)"
