  md: "**131**\n\n**PHP and PDO**\n\n**PDO UTF-8 Connection**\n\nTwo basic preparations\
    \ need to be made for secure database support. These are the\n\ncreation of UTF-8\
    \ tables and a UTF-8 PDO connection. This is the correct way to\n\nopen a PDO\
    \ client connection with a UTF-8 character set.\n\n$this->conn  =  new DO(\"mysql:host  =  {$host};dbname  =   {$db};**charset  = utf8**\"\
    ,\n\n$user, $pass);\n\nIt is subtle—and many examples miss including this option.\
    \ In the first parameter,\n\nwhich is the DSN connection string, make sure to\
    \ add 'charset = utf8'. This\n\nensures that your emulated escaping mechanism\
    \ is speaking UTF-8\\. As a ­defensive\n\ncoder, the desired chain is UTF-8 data\
    \ coming in, UTF-8 escaping at the client\n\n­connection, and UTF-8 as the storage\
    \ column so that characters are not altered when\n\nplaced into the record.\n\n\
    The goal:\n\n水能載舟，亦能覆舟 into DB\n\n水能載舟，亦能覆舟 out of DB\n\n**Note:**  Chinese proverb—Not\
    \ only can water float a boat, it can sink it also.\n\nHere is the proper way\
    \ to open a PDO connection. It needs to be surrounded by a\n\ntry/catch exception\
    \ handler because PDO always throws an exception on error, and it\n\nneeds to\
    \ be handled locally.\n\nTry\n\n{\n\n$this->conn = **new** PDO(\n\n\"mysql:host\
    \ = {$host};dbname = {$db};charset = utf8\",\n\n$user, $pass);\n\n$this->conn->setAttribute(\n\
    \nPDO::ATTR_ERRMODE,\n\nPDO::ERRMODE_EXCEPTION);\n\n$this->conn->setAttribute(\n\
    \nPDO::ATTR_DEFAULT_FETCH_MODE,\n\nPDO::FETCH_ASSOC);\n\n}\n\ncatch(PDOException\
    \ $e) {\n\n$this->logErr($e->getMessage());\n\n//log specific error to file\n\n\
    header(\"Location: \"serverDown.php\"); //\aredirect user to generic\n\npage\n\
    \n}\n\nThis code opens a new PDO connection with UTF-8 character set, and sets\
    \ the error\n\nmode going forward to throw exceptions, and to return records as\
    \ an associative array."
