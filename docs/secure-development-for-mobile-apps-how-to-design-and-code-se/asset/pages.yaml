    \ (time() - $_SESSION['editWindow '] > 1200)\n\n{\n\n//session started more than\
    \ 20 minutes ago\n\n//kill old session and create new one\n\nsession_regenerate_id(true);\n\
    \n//update creation time\n\n$_SESSION['editWindow '] = time();\n\n}\n\nWhat this\
    \ code does is create a variable called *editWindow* in the $_SESSION\n\narray\
    \ and sets the time. This would be done when the user wants to edit their account\n\
    \n­information. This is checked against a constant, in this case 1200 seconds\
    \ or 20 ­minutes.\n\nUse whatever time limit is appropriate. Once the time limit\
    \ is exceeded, the session\n\nis regenerated and the time reset. This leaves the\
    \ user logged in but ­prevents potential\n\nmisuse of the account edit functionality."
