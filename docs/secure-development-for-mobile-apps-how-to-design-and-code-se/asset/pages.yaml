  md: '**25**


    **Web Application Attack Surface**


    else


    {


    die(''Unsupported Page Request.'');


    }


    ?>


    Here an array of acceptable page requests serves as a lookup table for incoming
    redi­


    rect requests. It applies indirection via a lookup value which is carried in the
    GET


    request. If the lookup succeeds, then we allow the redirect to occur using the
    value


    from the lookup table and not the direct user-supplied value. Table lookups in
    this


    manner are a valuable tool for adding security in depth.


    **Theory of Input Filtering and Output Escaping**


    Data is now processed differently than it was in the era of compiled desktop apps.


    The processing of both input and output is done via text interpreters that function
    dif­


    ferently based on context. There is the PHP parser, the MySQL parser, the Document


    Object Model parser, the HTML renderer parser, the JavaScript parser, and the
    CSS


    parser. Each of these has its own syntax and its own quirks. Each of them is process­


    ing, for the most part, the same text stream, which can be broken up and rearranged
    in


    several different orders. This why the attack surface of web applications is now
    much


    more complex.


    Scripting languages hold the promise of typeless types, meaning that the developer


    doesn’t have to take the time to determine when a variable is a string type or
    an inte­


    ger type. And sometimes this can be true. It was nice for a simple PHP application


    to take a GET request parameter, save it to a cookie, then save it to a file,
    then echo


    it back without worrying about whether it was a string or an integer. The problem


    now is that data type is very important with regard to the output of interpreted
    data.


    A ­verified, numeric only type is not susceptible to attack. A string containing
    com­


    mand sequences is, not only as the input to a SQL engine, but as the output to
    the


    HTML renderer is. These are two things to watch out for in the same string. The new


    job of the developer is to be aware of where your data is coming from, where it
    is


    going, and how it is going to be displayed.


    The new attack vectors for both input and output context attacks are usually based
    on


    the idea of using quotes, both single and double, to break out of the current
    ­interpretation


    context and begin a new one. Since most instructions to the various ­parsing engines


    use quotes or other delimiting characters to begin and end current execution logic,


    prematurely ending one context and starting a new, unintended ­context is the
    basis


    for most web technology attacks via HTTP/HTML/JavaScript/PHP/MySQL.


    Whereas previously, overrunning a memory ­buffer enabled an attacker to insert
    altered


    instructions, now the attack centers on inserting ­delimiting characters into
    data that


    misguide the interpreter.'
