    \nlat, lon)\n\nVA\aLUES (:location, :description,\n\n:lat, :lon)\";\n\n$stmt =\
    \ $this->conn->prepare($query);\n\n$stmt->bindValue(\":location\", $location);\n\
    \n$tmt->bindValue(\":description\", $description);\n\n$stmt->bindValue(\":lat\"\
    , $lat);\n\n$stmt->bindValue(\":lon\", $lon);\n\nreturn $stmt->execute();\n\n\
    }\n\nThe final major function retrieves URLs used for playing videos,and is called\
    \ from\n\nthe loadVideoURL.php file. The function takes an ID as a parameter and\
    \ retrieves the\n\nassociated URL and message."
