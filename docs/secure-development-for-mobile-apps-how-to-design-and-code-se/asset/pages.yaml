    \nsion data and/or account data is to ensure that all required input forms are\
    \ accessed\n\nover SSL. In addition to protecting the transmission of data, SSL\
    \ certificates also\n\nafford higher levels of certainty that the user is legitimately\
    \ connected to the real\n\napplication. To protect the application and the users,\
    \ session management needs a\n\nthorough and complete design that addresses all\
    \ the issues.\n\n*Protect Secret Files/Protect Included Files*\n\nOne of the first\
    \ things an application does is to determine which file(s) to call. A first\n\n\
    task then is to ensure only the correct files can be called. PHP scripts almost\
    \ always\n\ninclude other PHP files for connecting to a database or accessing\
    \ additional functions\n\nand classes. Simple white listing of files is one of\
    \ the first defenses to ensure that the\n\napplication is choosing the file, and\
    \ not untrusted user input. Always use the .php\n\nextension for included code\
    \ files so that the contents cannot be reflected back to a\n\nbrowser and read.\
    \ .inc extensions are not parsed by PHP and serve plain text to the\n\nbrowser\
    \ when called directly. If these files are not placed outside of the web root\
    \ direc­\n\ntory, then an attacker is able to read all of the application’s key\
    \ data. Always keep these\n\nconfiguration files outside of the web root directory\
    \ so that they are not accessible via\n\ndirect web requests.\n\n*Protect User\
    \ Passwords*\n\nUser passwords can be protected in several ways. First is to *not\
    \ keep/never store* the\n\nactual password at all, only a hash of it. The second\
    \ is to store these hashes with\n\nmodern levels of encryption. This means using\
    \ Blowfish, Rijndael256, or Serpent.\n\nThe third method is to ensure the secure\
    \ transmission of user passwords via SSL so\n\nthat passwords are never in the\
    \ open, and that the likelihood of being intercepted\n\nis reduced.\n\n*Protecting\
    \ User Session Data*\n\nThere are several parts that must be addressed to protect\
    \ session data. This includes\n\nwhere session data is stored, and how session\
    \ data is handled as determined by the\n\nconfiguration of the php.ini file. Options\
    \ available for better protection are moving"
