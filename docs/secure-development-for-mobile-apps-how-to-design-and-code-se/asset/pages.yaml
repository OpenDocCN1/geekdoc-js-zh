    \ sendRegistrationEmail();\n\n}\n\nThe primary elements here are the key words\
    \ *abstract* and *final*. In PHP, adding\n\nabstract to a class definition or\
    \ function declaration, means it must be implemented\n\nin the extending class.\
    \ The key word *final*, added to the ­processRegistration()\n\nfunction, means\
