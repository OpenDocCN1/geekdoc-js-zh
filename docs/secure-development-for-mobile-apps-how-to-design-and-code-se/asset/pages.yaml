    *Future Proof Encryption Strength with Blowfish Rounds*


    Blowfish has the ability to strengthen itself over time. It has two features that
    make


    this happen. The first is the ability to slow itself down as computers get faster
    and


    faster. This is a powerful weapon in the fight against attackers. Because computers
    get


    faster cheaply and so quickly, longer and longer keys get more and more impractical.


    32 bit, 64 bit, 256 bit, 512, 1024, etc…Blowfish takes a novel approach and slows


    itself down, which mires the effectiveness of the most blazing computers. This
    speed


    is determined by the ‘rounds’ parameter. Increasing the rounds variable fed into
    crypt


    causes the internal base 2 logarithm to run increasingly slower and slower no
    matter


    how fast the attacking computer is. What this means is that instead of an attacker


    being able to calculate 1 billion DES hashes per second, the attacker can only
    try one


    guess every .5 seconds, which makes brute forcing impractical in most cases. The
    sec­


    ond feature is that the rounds value is stored openly as part of the hash. This
    means it


    can be updated, and the sample application shows how to do this. By checking every


    so often, a hash can be asked to update itself to make it stronger with a higher
    rounds


    level. That is a pretty cool feature to protect your customers with.


    The following two functions implement the Blowfish rounds level check for a


    Blowfish hash sent to them. Recall that checkBlowFishPasswordHash  () is the


    function that calls these when a successful password is detected, which allows
    the pass­


    word to be conveniently re-encrypted with a higher round. The higher round increases


    the time it takes to decrypt, which increases the strength of the hash.


    checkCurrentRoundLevel() This is the main function that encapsulates updat­


    ing the Blowfish hash. It takes three parameters, $password (in this case already
    a


    hash), the stored hash, and an email address.


    if(self::isBlowFishRoundsLower($storedHash))


    {


