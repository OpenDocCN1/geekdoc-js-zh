    \ randomization\n\nsetting of php.ini for session garbage collection. This results\
    \ in gc() being invoked\n\napproximately once every several hundred session starts.\
    \ When gc() is called it has\n\none parameter, the lifetime span of a session\
    \ as specified in php.ini.\n\nThe purpose of gc() is to remove all session records\
