  md: "**60**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n//OR\n\ninclude($_GET['catalog'].'.php');\n\
    \n?>\n\nIn PHP, using URLs direct from an HTML page link to include code or redirect\n\
    \na user is a very widespread practice because it is so easy to build a navigation\
    \ system\n\nusing this method. Obviously it has security consequences: the $_GET\
    \ in the header\n\nfunction returns any URL an attacker submits, the $_GET in\
    \ the include function\n\ncauses the inclusion and execution of any file the attacker\
    \ submits.\n\nA better technique is to compare pages and URLs against a white\
    \ list of those that\n\nare acceptable.\n\n$allowedPages = array('catalog.php',\
    \ 'parts.php');\n\n$page = search_array($_GET['catalog'], $allowedPages);\n\n\
    if($page)\n\n{\n\ninclude($allowedPages[$page]);\n\n}\n\nHere, a simple white\
    \ list array has been set up which determines the selection\n\noptions. User input\
    \ is compared against the allowed pages using the search_\n\narray() function,\
    \ and if a selection matches, array input is used for the include()\n\nfunction,\
    \ and not the user-supplied data. This technique ensures a double level of\n\n\
    protection.\n\n*Poor Error Management Practices*\n\nImproper handling of error\
    \ messages creates two categories of problems. First, they\n\ncreate user satisfaction\
    \ problems. Second, they create security problems. This may\n\nseem odd in a security\
    \ book, but user satisfaction should always come first. Error mes­\n\nsages annoy\
    \ users and are useless from a user’s standpoint. Users cannot do anything\n\n\
    with error messages. Displaying them should be avoided for the user’s sake. Errors\n\
    \nshould be handled and logged internally. A best practice is to provide directions\
    \ that\n\nare meaningful to the user for the current situation and to display\
    \ those directions\n\ninstead of the actual error, as part of the error handling\
    \ process. An example might be,\n\non database connection failure, to construct\
    \ an error handler that emails the admin­\n\nistrator the error, but informs the\
    \ user that, “The site is down for maintenance, Please\n\nreturn in two hours.”\n\
    \nFrom a security standpoint, error messages leak system information that can\
