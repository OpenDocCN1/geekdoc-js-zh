  md: "**322**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nin practical terms\
    \ is that the application should be architected in such a way that\n\nconfidential\
    \ information, passwords, secret keys, account settings, private messages,\n\n\
    etc., are not sent and acted upon via GET. The reason is that GET request links\
    \ are\n\ncacheable, savable, and transportable. This causes them to live a long\
    \ time, and be\n\nexposed to people and places that were unintended. Links get\
    \ stored in caches, they\n\nget copied and pasted and emailed, placed into documents,\
    \ left in browser history and\n\nare accessible via the Back button, and so on.\
    \ There is also no control over the lifetime\n\nof a GET request. Sensitive data\
    \ can be left around in an Internet café for a long time.\n\nThe best way to use\
    \ GET request variables is as resource lookup identifiers to objects\n\nto be\
    \ retrieved or activated. Create resource IDs for your application and use GET\
    \ to\n\nretrieve those resources based on ID. Sensitive data can be fit within\
    \ the GET request\n\nsize limit and used by the server to perform updates and\
    \ edits, and it is deceptively\n\neasy. However, this is a poor practice for protecting\
    \ user accounts and information.\n\nIf GET needs to retrieve sensitive data, call\
    \ it over SSL using a lookup ID and\n\nsetting the ‘no-cache’ directive for the\
    \ resource. Even if made over SSL, if the URL\n\ncontains account information,\
    \ that URL can be saved to non-volatile storage and\n\neventually accessed at\
    \ a later date by an unauthorized person.\n\n*Think of data exposed in a URL as\
    \ information disclosure, and construct requests*\n\n*accordingly.*"
