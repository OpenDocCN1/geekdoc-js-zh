    **Secure JSON Requests**


    As a last note, it has become a common practice to immediately echo returned


    function data out to a client, or chain function output into other functions without


    first assigning this output to temporary variables. This practice avoids the overhead
    of


    additional memory copies and also produces very elegant looking code. The problem


    it can cause is that control over checking the validity of intermediary values
    and steps


    is lost. Be wary of when this practice avoids the necessary step of checking for
    error


    conditions.


    Saving memory is good. Code elegance is good. Avoidance of diligent error check­


    ing can lead to security holes. Do not save memory at the expense of error checking.


    **Parsing JSON Securely with JavaScript/jQuery**


    A primary rule for processing JSON on the client with JavaScript is to parse with


    $.parseJSON(). The JavaScript eval() function is not to be used since it also


    executes untrusted code in addition to parsing the code.


    A primary rule for fetching JSON data is to use a POST request even though


    jQuery, by default, makes GET easier to use.


    There is nothing inherently wrong with using any form of AJAX GET requests


    from JavaScript. What matters is what kind of data the server returns via GET


    requests. It is easy for code development to flow from client to server, as server
    code is


    developed in response to front end code. A frequent example is that of a new feature


    implemented on the spot during front-end development. Since jQuery .getJSON()


    is so convenient, and because the mind is focused there, the function is implemented


    and assigned with a jQuery selector to an HTML element that exists on the page


    being worked on at the moment. Then a switch is made to the PHP file to implement


    a GET request to handle the new front-end request.


    A general design rule is that GET and POST requests should be thought out in


    advance for the purposes that need to be fulfilled, and a consistent method should
    be


    implemented for coordinating front-end request development with back-end request


    fulfillment. While features cannot always be known in advance, deciding on a consis­


    tent development method for implementing features goes a long way toward prevent­


    ing the introduction of inadvertent security risks.


    Makingconsistent choices in advance about how to coordinate JavaScript requests


    and PHP response implementations should not impede agile development or test


    driven development. Instead, these decisions, made ahead of time, should increase


    both coding speed and consistency by eliminating implementation guesswork at the


    point of construction.


    As an example of some advanced design decisions, consistency rules will take the


    form of:


    1. Will use .post() and dataType:text for private information


    2. Will use .post() and dataType:text for updating information'
