    \ *email* charac­\n\nters removed. This is an important step, but not complete.\
    \ At this point, it is *not guar­*\n\n*anteed* to be safe for insertion into a\
    \ database, or echoed to HTML. It also will not\n\nbe guaranteed to be a valid\
    \ email yet. filter_var($_POST['email'], FILTER_\n\nVALIDATE_EMAIL)) will need\
    \ to check that. If valid, $email needs to be protec­\n\ntively escaped for the\
    \ database context. PDO::quote() then escapes *and* quotes the\n\nemail string\
    \ for safe insertion into the database.\n\nAll variables should be escaped according\
    \ to context. There is no harm done to the\n\ndata itself in escaping for context,\
    \ at the point of context change. This helps prevent\n\ndisastrous errors of omission,\
    \ while preserving the data. *Filter input, escape output* pro­\n\nvides security\
    \ in depth, as well as greater understanding.\n\n**Note:**  $_POST['password']\
    \ is deleted by unsetting it with unset() after hashing.\n\nThe application never\
    \ knows or needs to know the original password. This ­technique is\n\nutilized\
    \ later in example code that stores and compares only hashes of user passwords."
