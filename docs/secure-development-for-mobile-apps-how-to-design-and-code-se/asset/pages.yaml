    \n\n*UTF-8 String Functions*\n\nWorking with Unicode UTF-8 means working with\
    \ multi-byte characters, which\n\nmeans abandoning traditional string functions\
    \ and completely embracing the PHP mb\n\nfunctions. With UTF-8, strlen() will\
    \ no longer give you the correct count, so mb_\n\nstrlen() must be used. Here\
    \ is a list of common functions needing to be replaced.\n\nstrlen()\n\nmb_strlen()\n\
    \nstrpos()\n\nmb_strpos()\n\nstrrpos()\n\nmb_strrpos()\n\nsubstr()\n\nmb_substr()\n\
