    **Secure Client Server Form Validation**


    request into two. The typical return result from a POST will be redirected to
    a GET


    statement on a different page. So when a POST request comes in, if the request
    is


    successfully handled, the response will be sent, via redirection header with a
    HTTP


    code 303, immediately to a GET request with a different URL. The client browser


    loads the response page with GET request, caused by the redirect header, which
    has


    the effect of loading a different separate resource.


    The complete scenario as seen from the client browser is that there are two differ­


    ent tasks performed. First, a POST request with input data was sent to the server.


    Second, a separate GET request was made to retrieve the POST response. This pro­


    cess, because of the redirection, is transparent to the client browser.


    User experience is enhanced with this technique because browsers will no longer


    pop up any confusing alert messages about data resubmission. The Back and Forward


    buttons will work as expected. Back will reload the form. Forward will return
    the


    response page. The same happens with F5 refresh. The response page, which is a
    read-


    only GET, will reload as expected. Data will not be resubmitted.


    The resulting behavior after implementing PRG is:


    1. Back button returns user to form page.


    2. Forward button reloads the response page using read only GET.


    3. Refresh button reloads response page with read only GET.


    *The PRG Directive*


    1. Never return POST response in same page.


    2. Always load responses via GET.


    3. Use redirect to navigate from POST to GET.


    This pattern has several benefits. Accidental submits are prevented and GETs can
    be


    performed any number of times. But one problem still remains, and that is when
    the


    submit button is physically clicked multiple times. There are a few ways to deal
    with


    this problem.


    • Using JavaScript to disable submit after a submission.


    • Using a NONCE token in a form to process form only once.


    • Prevent caching.


    Using a NONCE to prevent form resubmission and setting caching to enhance pri­


    vacy are detailed in the next section. Caching needs to be avoided in dynamic
    web


    applications.


    Caching is an important technique for increasing the accessiblity of static, read-


    only resources. Caching is so important that it is implemented automatically as
    often


    as possible by the browser. For web applications and mashups that are constantly


    changing data, caching can often have a negative, unwanted effect and effort has
    to be


    taken to timestamp URLs to avoid caching.'
