    **PHP Essential Security**


    *UTF-8 in the Client Browser*


    The web browser is told to speak UTF-8 from either the HTML header, or a ­meta-tag


    embedded in the HTML page header section. The PHP server code needs to set


    the header to UTF-8 and send this ahead of the page content. A good practice is
    to


    include the meta-tag as well. This a double method of ensuring UTF-8 compliance


    on the browser, but it also makes it easy to view which character set is in use
    upon


    inspecting the page source.


    The HTML form element can also be set to UTF-8 for specifying that form data


    be submitted as UTF-8.


    **Clean Secure Data**


    Now that all the parts are speaking the same language, UTF-8, the stage is set
    to


    clean the data. Every application needs to sanitize user-supplied data. Having
    a com­


    mon routine that performs this task is critical for the consistency aspect of
    security.


    Creating a new input filter for routing every project is an anti-pattern to avoid.


    One way to go about this is to create a filter routine that cleans all input ­variables


    equally. This is identified as an anti-pattern as well because not all data can
    or should be


    treated the same. Therefore a sanitization routine needs to implement a ­non-changing


    process, but handle different data sets based on the project requirements. Design


    ­patterns can help accomplish this.


    *Input Validation: Account for Size and Type*


    Input types, ranges, and sizes should be a part of every application so that proper


    ­filtering can occur consistently. While inputs will always be different for every


    ­application, the way integers are treated and the way strings are treated are
    the same.


    There should be an object that helps you organize and classify the applications


    input so that it becomes very easy to know what to do with input variables, and
    more


    ­importantly, to easily keep track of whether variables have even been filtered.


    The goal is to enforce correct data where necessary and to preserve data where


    ­possible. Achieving this goal depends on clearly delineating input filtering
    and output


    escaping. User data can only be safely preserved in the database if it is safely
    escaped


    upon output. If not, then the user input must be destructively filtered in anticipation


    of safe rendering later. Remember a general rule of thumb: *filtering removes*,
    *escaping*


    *preserves* for a specific context.


    *Escape Output: Account for Context*


    Output context is critical. The wrong text in the right context opens a security
    hole.


    Tracking which data goes to which output context is at this point a critical part
    of


    secure development. An application needs a process for easily escaping to the
    proper'
