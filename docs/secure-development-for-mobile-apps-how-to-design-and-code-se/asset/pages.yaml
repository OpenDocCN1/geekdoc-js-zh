  md: '**407**


    **Secure AJAX Shopping Cart**


    **Making the PayPal Purchase**


    This last section demonstrates formatting multiple cart items for the PayPal API


    and storing results via PDO prepared statements. It also demonstrates properly


    ­setting up cURL so that SSL Verify Peer and SSL Verify Host are properly config­


    ured, and that a Certificate Authority file is set in order to enable the verification.


    This is an important step for confirming who is at the receiving end of a financial


    transaction.


    There are three steps, and therefore three files used in making and completing
    a


    PayPal transaction.


    1. Beginning the transaction in beginPurchase.php


    2. Communicating with PayPal using paypalPOST.php


    3. Completing the transaction with completePurchase.php


    *Beginning the PayPal Transaction*


    Initiating a purchase starts with clicking the ‘Purchase Now’ button, which calls


    beginPurchase.php. This is the first step in the process. Three major tasks are
    per­


    formed at this stage. First, all the variables have to be formatted into the correct


    string expected by the PayPal API. Second, a PayPal transaction token is obtained


    to use for the purchase, and the callback URL is set with PayPal to use for the
    actual


    transaction. Third, the user is redirected to PayPal where they log into their
    account


    and verify the purchase. The code in beginPurchase.php sends PayPal the items,
    the


    quantity, and the amount that the user sees at the PayPal confirmation page.


    *SetExpressCheckOut * This is the first step of the transaction process. SetExpressCheck​


    Out initiates the process at PayPal and returns a token that needs to be sent
    as part of


    the request for the next set of calls.


    If the token is successfully obtained, the buyer is redirected over SSL to the
    PayPal


    order summary page, where the buyer can preview the items and purchase price,
    and if


    agreeable, can log into their PayPal account and authorize the purchase. Funds
    are not


    actually transferred at this point. After payment authorization, the buyer is
    redirected


    back to the callback URL we specified—in this case, completePurchase.php with
    two


    parameters, the PayPal token and PayPal PayerID.


    *DoExpressCheckoutPayment * Once our callback page receives these values, the
    PayPal


    Token and PayPal PayerID, we call the DoExpressCheckoutPayment method.


    At this point, PayPal verifies these values. If these values are verified, then
    and only


    then, is money is actually transferred to the seller’s account.


    *GetExpressCheckoutDetails * This method, with the token obtained  from  SetExpress​


    CheckOut, is called after DoExpressCheckoutPayment to collect information'
