  md: '**211**


    **Secure Session Storage**


    **Option Two**: ENCRYPT_IV_PER_TABLE Session Data. This option encrypts


    the session data using the mcrypt Rijndael256 cipher and only one IV, initialization


    vector. This provides a strong level of encryption. Points to note about this
    option are


    that it uses single static IV salt and encryption key for encrypting all session
    data.


    Think of it as encrypting the whole table instead of individual records. This
    does not


    mean that the entire table is encrypted or decrypted at once. Each record is still
    indi­


    vidually accessed, and encrypted and decrypted. It just means that the same password


    and IV salt are applied to each record. This provides a small speed benefit in
    highly


    transactional situations by avoiding the generation of new salts with mcrypt_cre­


    ate_iv() on every session open() and write(). This may or may not be meaning­


    ful performance-wise. Since sessions are frequent and a fast user response is
    desirable


    this can be acceptable encryption technique depending on your security needs,
    and


    depending on what is being encrypted. The disadvantage of this technique is that
    if


    all the records were downloaded via a SQL UNION attack and one of the records


    is cracked, then all the session records could be cracked because the salt is
    the same.


    If the file system were compromised and the secret key found, then of course all
    is


    lost anyway. Other points for this option are that the salt was prepared using
    a one-


    time generated binary blob with mcrypt_create_iv(), then Base64 encoded and


    saved in an application secret file stored outside of the web root directory.
    Since salt is


    Base64 encoded, it must be decoded for encrypt and decrypt functions. The following


    sequence was used.


    $alg


    = MCRYPT_BLOWFISH;


    $mode


    = MCRYPT_MODE_CBC;


    $keySize = **mcrypt_get_iv_size**($alg,$mode);


    $iv


    = **mcrypt_create_iv**($keySize, MCRYPT_DEV_URANDOM);


    $iv64


    = **base64_encode**($ivBlowfish);


    $iv64 is now the static session salt saved in the secrets file and used as part
    of the


    encryption key. This routine, being performed only once, cannot change, or sessions


    in database cannot be decrypted. To reset encryption, delete all session records,
    and


    have users log back in.


    **Option Three:**  ENCRYPT_IV_PER_RECORD Session Data. This option provides


    a stronger level of protection. Each record uses a unique IV salt, and a new IV
    is cre­


    ated on every encryption call. Cracking one record will not crack all the records,
    since


    all the IV salts are different. This increases the randomness of each record.
    If the file


    system is breached and the secrets file compromised, then all is lost.


    *Critique and Decision Time*


    • Speed = enemy of cryptography


    • Slowness = friend of cryptography


    • Speed = user friendliness


    • Slowness = user annoyance'
