  md: '**239**


    15


    Secure Forms  and


    Account Registration


    HTML forms are one of the primary methods by which a client sends data to the


    server application. A foundational rule of security is that since the user source
    is


    unknown, the input from HTML form fields cannot be trusted. Proper handling of


    the data that comes through form fields is central to maintaining the security
    of the


    server. The emphasis is on proper handling, which is based on input usage. There
    is no


    single method that makes data safe in all cases. This chapter focuses on many
    tech­


    niques to properly handle form fields.


    **Secure User Registration and Login Process Overview**


    Before becoming an authorized user of the site, a user must successfully register
    an


    account and login. This section covers a multi-step process for securely registering
    an


    account. The main security measures implemented in this chapter are as follows:


    • Ensure that login and registration occurs over SSL


    • Provide login/registration forms with a nonce that is validated


    • A JavaScript password strength meter to assist users


    • Password always sent over SSL


    • Allow unlimited password length, unlimited characters


    • Original user password is converted to SHA256 hash


    • Application does not keep original password variable


    • Password hash is stored with Blowfish cipher using 12 rounds


    • Sanitize and validate the registration/login information


    • Session ID cookie only sent over SSL


    • Account management class registers the account data in database


    • Account is inactive by default


    • User email address is verified with activation code


    • Perform a secure login over SSL


    • Session ID is regenerated on login and old ID is deleted


    • User interaction continues over SSL to avoid MIM attacks


    • Re-authentication via password is required to edit account data


    • Re-authentication has a time window for expiration


    • Re-authentication regenerates session ID and old ID is deleted


    • Perform a secure logout by destroying all session record and data'
