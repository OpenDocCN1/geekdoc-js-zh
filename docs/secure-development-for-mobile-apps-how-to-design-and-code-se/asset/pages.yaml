  md: '**27**


    **Web Application Attack Surface**


    after strip_tags() is applied becomes this:


    ''alert(''attacked'')''.


    Another destructive method would be to use htmlentities() on the string and


    then save it to the database. The original string characters would be altered
    and what


    is saved in the database would become


    "&lt;script&gt;alert(''attacked'')&lt;/script&gt;".


    When you retrieve this from the database, the original is lost, unless you decode
    it


    back. If this happens, recovering the original text might not be possible.


    The non-destructive filtering method, which is output escape filtering, would
    be


    to use htmlentities() function just before output, and while what is sent to the


    browser would be


    "&lt;script&gt;alert(''attacked'')&lt;/script&gt;".


    As seen in the web page source, what gets printed in the browser after HTML render­


    ing would be the original text again,


    "<script>alert(''attacked'')</script>"


    It is not harmless because the entity encoding prevented the text from being inter­


    preted as active script and executed. Instead, it was just displayed.


    When a function like PDO quote() escapes a string, the escape helps get it past


    the parsing engine. What is stored in the database is the original string. Consider
    the


    name ‘O’Mally’. After quoting via


    pdo->quote("O''Mally");


    what is sent to the SQL parsing engine is ‘O\’Mally’ and what is saved in the
    table on


    disk is “O’Mally”, the original text, which is what you want. However, even though


    this is safely stored in the database, the single quote could be dangerous on
    output.


    The reason it represents a threat is that the single quote could be used to break
    out of


    an interpreted context, such as an HTML attribute, and trigger code execution.


    *Type and Size of Variables Are Still Important * Type and size are important.
    If a vari­


    able is an integer, you do not need to spend time accounting for it or filtering
    it the


    way you would a string. If a string should only be 50 characters, it is wasteful
    to


    send a ­4,000-word string through a filter if you don’t need to. Cut it to correct
    size


    first, then filter it. This becomes important as traffic grows and requests per
    second


    increase. At some point it could affect responsiveness. Keep variables as short
    as


    possible.'
