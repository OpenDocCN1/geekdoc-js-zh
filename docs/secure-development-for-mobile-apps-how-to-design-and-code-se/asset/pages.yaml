  md: "**34**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nPlease note there\
    \ are some CSS contexts that can never safely use untrusted data as\n\ninput—**even\
    \ if properly CSS escaped**! You will have to ensure that URLs only start with\n\
    \n“http” not “javascript” and that properties never start with “expression”.\n\
    \nFor example:\n\n{background-url : \"javascript:alert(1)\";} //and all other\
    \ URLs\n\n{text-size: \"expression(alert('XSS'))\";} //only in IE\n\nExcept for\
    \ alphanumeric characters, escape all characters with ASCII values less than\n\
    \n256 with the \\HH escaping format. DO NOT use any escaping shortcuts like \\\
    “ because\n\nthe quote character may be matched by the HTML attribute parser which\
    \ runs first.\n\nThese escaping shortcuts are also susceptible to “escape-the-escape”\
    \ attacks where the\n\nattacker sends \\” and the vulnerable code turns that into\
    \ \\\\” which enables the quote.\n\nIf attribute is quoted, breaking out requires\
    \ the corresponding quote. All attributes\n\nshould be quoted but your encoding\
    \ should be strong enough to prevent XSS when\n\nuntrusted data is placed in unquoted\
    \ contexts. Unquoted attributes can be broken out of\n\nwith many characters including\
    \ [space]% * +, -/; < = > ^ and |. Also, the </style> tag will\n\nclose the style\
    \ block even though it is inside a quoted string because the HTML parser\n\nruns\
    \ before the JavaScript parser. Please note that we recommend aggressive CSS encod­\n\
    \ning and validation to prevent XSS attacks for both quoted and unquoted attributes.\n\
    \n*Rule #5—URL Escape before Inserting Untrusted Data into HTML URL Parameter\
    \ Values*\n\nRule #5 is for when you want to put untrusted data into HTTP GET\
    \ parameter value.\n\n<a \ahref = \"http://www.somesite.com?test =...ESCAPE UNTRUSTED\
    \ DATA\n\nHERE...\">link</a >\n\nExcept for alphanumeric characters, escape all\
    \ characters with ASCII values less than\n\n256 with the %HH escaping format.\
    \ Including untrusted data in data: URLs should not\n\nbe allowed as there is\
    \ no good way to disable attacks with escaping to prevent switching\n\nout of\
    \ the URL. All attributes should be quoted. Unquoted attributes can be broken\
    \ out\n\nof with many characters including [space]% * +, -/; < = > ^ and |. Note\
    \ that entity encoding\n\nis useless in this context.\n\nWARNING: Do not encode\
    \ complete or relative URLs with URL encoding!\n\nIf untrusted input is meant\
    \ to be placed into href, src, or other URL-based attributes, it\n\nshould be\
    \ validated to make sure it does not point to an unexpected protocol, especially\n\
    \nJavaScript links. URLs should then be encoded based on the context of display\
    \ like any\n\nother piece of data. For example, user driven URLs in HREF links\
    \ should be attribute\n\nencoded. For example, a PHP implementation for multiple\
    \ ­contexts is:\n\nPHP code example:\n\n<?php\n\n$incomingURL = $_GET['url'];//IDENTIFY\
    \ url parameter as such\n\n$parsedURL = parse_url($incomingURL);//extract protocol\
    \ scheme"
