  md: "**55**\n\n**PHP Security Anti-Patterns**\n\n$safe = **json_encode(array**(**\"\
    cities\" = >**\n\n**\aarray**(array(\"city\" = > \"New York\", \"state\" = >\n\
    \n\"NY\"),\n\n\a**array**(\"city\" = > \"Chicago\", \"state\" = >\n\n\"IL\")));\n\
    \nTo create a JSON object, safe for JavaScript consumption and not a JSON array,\n\
    \nusing json_encode() with default parameters, a named array element must be\n\
    \nused when constructing the array.\n\n*Common Turn Off Cookie Protections by\
