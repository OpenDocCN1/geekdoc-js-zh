  md: "**314**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThe Double Submit\
    \ problem got its name because it describes the common ­problem\n\nof POST data\
    \ being submitted more than once, which causes any number of system\n\ninstabilities.\
    \ This can be seen in a common scenario where an HTML form is submit­\n\nted to\
    \ the server, processed, and the response is returned as the same page. The flow\n\
    \nshould be that a POST request can be resubmitted in at least three possible\
    \ ways:\n\n• Hitting the Back button, which causes page reload and resubmits request\n\
    \n• F5 reload of result page, which causes resubmit\n\n• Clicking the Submit button\
    \ more than once\n\nBrowsers will display a warning that the same POST request\
    \ is going to be re-sent.\n\nThis is usually just an annoyance and does little\
    \ to prevent the resubmission.\n\n*The PRG Pattern*\n\nThe PRG pattern, an established\
    \ pattern, is the answer to the double submit problem\n\nby using redirection\
    \ according to the expected behavior of the HTTP specification.\n\nThe PRG pattern\
    \ departs from the single page request response pattern and turns one\n\n![](img/a1d8782fdf88e6a561fda104c93073e3_343_0.png)\n\
    \nPOST\n\n3xx Redirect\n\nGET\n\n2xx Success\n\nInsert order\n\ninto the database.\n\
    \nSend conﬁrmation\n\npage.\n\nYour order\n\nwas\n\nsuccessful\n\nUser ﬁlls out\
    \ order\n\nform.\n\nUser clicks\n\nUser refreshes page.\n\nResubmits\n\nGET request\n\
    \n**Figure 16.2 ** Public Diagram from WikiPedia. (From Quilokos, Licensed under\
    \ Wikimedia Commons, a freely licensed\n\nmedia file repository.)"
