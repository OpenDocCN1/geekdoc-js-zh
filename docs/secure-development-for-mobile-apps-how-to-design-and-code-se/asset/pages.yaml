  md: "**170**\n\n**Secure Development for Mobile Apps\uFEFF**\n\npassing information\
    \ up the call stack to a handler. Here is a list of the Exception class’\n\nmembers.\n\
    \n• getCode(). The exception code.\n\n• getMessage(). The exception message.\n\
    \n• getFile().  The file name from where the exception was thrown.\n\n• getLine().\
    \ The line number where the exception was thrown.\n\n• getTrace(). An array of\
    \ call stack information.\n\n• getTraceAsString(). Call stack information as a\
    \ string.\n\n• getPrevious(). Exception thrown before the current one, if present.\n\
    \n• _  _toString(). Entire exception as a string.\n\nAn example of using exceptions\
    \ is in validating data for other objects. In this case,\n\nan AccountMember object\
    \ requires names to be strings fewer than 40 ­characters\n\nin length, and not\
    \ integers. When parameters passed to the AccountManager\n\n­constructor do not\
    \ meet this requirement, an exception is thrown with a contextual\n\nmessage.\n\
    \n**class** AccountMember\n\n{\n\nprivate $_userName;\n\npublic function **_construct**($name)\n\
    \n{ $this->_name = **self**::validateName($name); }\n\nprivate static function\
    \ validateName($name)\n\n{\n\nif(is_string($name) && mb_strlen() < 40)\n\n**return**\
    \ $name;\n\n**throw**  **new** Exception(\"Invalid name properties\").\n\n}\n\n\
    Public function getName()\n\n{ **return** $this->_name;}\n\n}\n\n$member = **new**\
    \ AccountMember(\"Mike\");\n\n**echo** $member.getName();\n\nwill correctly output\
    \ “Mike”.\n\nIf this class is instantiated with the wrong data type,\n\n$member\
    \ = **new** AccountMember(5);\n\nan exception is thrown. However, because there\
    \ was no catch handler implemented,\n\nthe exception is uncaught, so PHP catches\
    \ it, and its default behavior is to do a call\n\nstack dump in addition to dumping\
    \ the custom message we passed to the ­exception\n\nwe created. Exceptions, once\
    \ thrown, keep traveling up the call stack until some­\n\none catches them. If\
    \ no one does, PHP handles it with the default exception handler."
