  md: "**82**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*URL Encoding * Sending\
    \ a URL with embedded spaces can cause the URL to be\n\ntruncated and the intended\
    \ URL to not be reached. It is important to make sure that\n\nURLs are properly\
    \ encoded so that spaces are converted to the proper entity, preserv­\n\ning the\
    \ full URL.\n\nWith PHP, there are two choices of encoding. Spaces can be converted\
    \ to a plus\n\nsign, ‘+’, or to ‘%20’.\n\nurlencode()*/*rawurlencode() *Example*\
    \ The first example shows the effect of\n\nurlencode() to encode spaces as +.\n\
    \n$u\arl = \"https://www.security.com/index.php?file = learning\n\n­security\"\
    ;\n\n$encodedURL = **urlencode**($url);\n\necho $encodedUrl;\n\nOUTPUTS:\n\nhttps%3A%2F%2Fwww.security.com%2Findex.php%3Ffile%3Dlearning+security\n\
    \necho **urldecode**($encodedUrl);\n\nOUTPUTS:\n\nhttps://www.security.com/index.php?file\
    \ = learning security\n\nThe second example uses rawencode to encode spaces as\
    \ %20.\n\n$u\arl = \"https://www.security.com/index.php?file = learning\n\n­security\"\
    ;\n\n$encodedUrl = **rawurlencode**($url);\n\necho $encodedUrl;\n\nOUTPUTS:\n\n\
    ht\atps%3A%2F%2Fwww.security.com%2Findex.php%3Ffile%3Dlearning%20\n\nsecurity\n\
    \necho **rawurldecode**($encodedUrl);\n\nOUTPUTS:\n\nhttps://www.security.com/index.php?file\
    \ = learning security\n\nparseurl() *Example* Being able to parse URLs and examine\
    \ the individual parts\n\ncan be a very important security task. parseurl() is\
