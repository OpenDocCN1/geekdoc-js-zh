    4


    PHP Essential Security


    Every PHP/MySQL/HTML/JavaScript application has several parts that are the same


    for every application. Security issues likewise require that certain procedures
    be followed


    every time. It stands to reason that it is worthwhile to identify these parts
    and examine


    how we can organize them into a reusable template. This is not a ­template in
    the same


    category as a framework, such as the Zend Framework, but a template for laying
    out


    and recognizing reusable parts from a project perspective. Chapter 7, “Project
    Layout


    Template,” describes the specific files and code patterns common to many applications.


    **A Consistent UTF-8 Character Set**


    The first element that is the basis for a secure application is a consistent character
    set


    encoding. Not having a consistent character set across the application is the
    cause of


    both data misinterpretation, which is the root of security holes, and data destruction


    when user-entered data gets parsed or saved incorrectly. It is quite common for
    charac­


    ter set mismatches to occur in an application. Two reasons for this are lack of
    awareness


    of the issue, and the fact that there are so many places where the mismatch can
    occur.


    This book chooses to use UTF-8 as the specific character set. The reason is that


    UTF-8 is Unicode, can accommodate all languages, and works to send multi-byte


    characters to a browser without mangling them. Also, because of the way UTF-8


    characters are encoded, it cannot be tricked into parsing multi-byte characters
    in dif­


    ferent ways, so its security is increased.


    To make this happen in PHP and MySQL, the character set has to be set in several


    places and in several different ways. A complete UTF-8 project setup is outlined
    in


    Chapter 6, but here is a review of the basics.


    While this book uses UTF-8, the character set used doesn’t matter as long as it
    is


    the same throughout the book. The foundational basis of secure programming rests


    on properly parsing and examining data. This can only be done when the charac­


    ter set/encoding of the supplied data matches the character set of the filters
    used.


    Mismatched data is the root of much evil.


    *Remember*: Take action and explicitly configure the character sets used by the
    appli­


    cation processes.


    1. Decide what character encoding should be used.


    2. Ensure *all* internal functions, filters, and structures, are configured for
    the


    chosen character encoding.'
