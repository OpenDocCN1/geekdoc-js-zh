  md: "**54**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nwhen coding a solution\
    \ and is one of the leading causes of retrofitting code later in a\n\nproject\
    \ because the habitually easy thing was done first. This author confesses to still\n\
    \nbeing susceptible to this bad habit. (2) The default second parameter is ENT_COMPAT,\n\
    \nwhich does not encode single quotes. This opens a security hole that could allow\
    \ a\n\nsingle quote to break out of an HTML attribute context. (3) The third parameter\n\
    \nspecifies character set. If this is not explicitly set, then there is a potential\
    \ and likely\n\nmismatch between the incoming text to be filtered and how the\
    \ filter is going to detect\n\ncharacters, which undermines the entire security\
    \ process. Correct processing can only\n\nsucceed when the character set of the\
    \ text matches the character set the filter is using.\n\nOnce you accept seeing\
    \ things a certain way, it becomes difficult to see things any\n\nother way.\n\
    \n*Common Default JSON Construction*\n\n**son_encode**($data);\n\nversus\n\n**json_encode**($data,\
    \ JSON_FORCE_OBJECT);\n\nMost examples on the web encourage the use of json_encode()\
    \ using default\n\nsettings, without examining how the array of data passed into\
    \ json_ecode() is\n\nactually constructed. This construction method is important.\
    \ json_encode() will\n\nreturn either\n\nan exploitable, top level array\n\n[[1,2,3]]\n\
    \nor a safe, top level JSON object\n\n{\"0\":{\"0\":1,\"1\":2,\"2\":3}}\n\ndepending\
    \ on how the PHP data is assembled before encoding.\n\nSending a JSON array to\
    \ JavaScript is a known security risk. Two options remain—\n\nproperly construct\
    \ the data before passing to json_encode(), in which case the\n\nsecond parameter\
    \ is not needed, or use the JSON_FORCE_OBJECT parameter. This\n\nis discussed\
    \ in detail with more specific examples in Chapter 18\\. Also see OWASP\n\nJSON\
    \ Guidelines.\n\n$exploitable = **\ajson_encode(array**(**array**(\"city\" = >\
    \ \"New York\",\n\n\"state\" = > \"NY\"),\n\n\a**array**(\"city\" = > \"Chicago\"\
    ,\n\n\"state\" = > \"IL\")));"
