    **Strategy Pattern for Output Escaping**


    As we have seen, output context escaping is complex. A strategy is required to
    map


    an implementation to a specific output target. This makes it a prime candidate
    for the


    Strategy pattern. Based on output target, an implement needs to be created. PHP


    provides the language tools to structure a Strategy pattern.


    *Escaping Strategy Class*


    Listed here is a Strategy pattern that helps apply the correct escaping for the
    different


    display contexts.


    <?php


    //define constants to identify display contexts


    const HTMLOUT = 1;


    const URLOUT = 2;


    const BOTHOUT = 3;


    //declare the output strategy class


    class OutputStrategy {


    private $context;


    //function that instantiates the needed strategy


    public function_construct($outputContext) {


    switch ($outputContext) {


    case HTMLOUT:


    $this->context = new displayHTML();


    break;


    case URLOUT:


    $this->context = new displayURL();


    break;


    case BOTHOUT:


    $this->context = new displayBOTH();


    break;


    }}


    //implement the main interface function


    public function display($data) {


    return $this->context->display($data);


    }}'
