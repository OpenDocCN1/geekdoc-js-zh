  md: "**58**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Misleading Filtering\
    \ Anti-Pattern*\n\nAvoid code that makes misleading security claims, and/or cleans\
    \ filters incorrectly,\n\nand avoid names that imply a false sense of security.\n\
    \nfunction makeSafe($input) {\n\n$safe = **addslashes**(**strip_tags**($input));\n\
    \nreturn $safe;\n\n}\n\n$user\n\n= makeSafe($_POST['user']);\n\n$password = makeSafe($_POST['password']);\n\
    \n**mysql_query**(\"SELECT name, password\n\nFROM users\n\nWHERE name = '\".$user.\"\
    '\n\nAND password = '\".$password.\"'\");\n\n$safeName = makeSafe($row['name']);\n\
    \n**echo** \"Hello, \".$safeName;\n\nThere are a few problems here. The first\
    \ is the heavy implication that the code is safe.\n\nThe code itself says it is\
    \ safe, so one might believe it. The second problem is destruction of\n\npassword\
    \ characters from the filters. A user should be able to use whatever character\
    \ he\n\nwants within a password. This filtering method removes character choice\
    \ possibilities for\n\nno reason. The third problem is that the data is double\
    \ escaped, going in and going out\n\nwithout knowing why. The fourth problem is\
    \ that the variable destination is unknown,\n\ntherefore the escaping requirement\
    \ is unknown. addslashes() does not know about\n\nthe underlying database character\
    \ encoding set and cannot securely deal with attack char­\n\nacters. The final\
    \ problem is that original, clear text passwords should not be used at all.\n\n\
    Better techniques are to use prepared statements, and to hash the password for\
    \ stor­\n\nage. Hashing removes the need to destroy password characters.\n\n*Too\
    \ Many Quotes Anti-Pattern*\n\nThe battle over quotes is hard enough without adding\
    \ additional difficulty. Code such\n\nas that below, which mixes single and double\
    \ quotes, increases the difficulty of visually\n\ninspecting and tracking quotes\
    \ correctly. The first example below is safe, just difficult\n\nto read.\n\nCumbersome—multiple\
    \ string concatenation mixes quotes:\n\nec\aho \"<input type = 'hidden' name =\
    \ 'key' value = '\".$key.\"'/>\";\n\nThe following code samples are a visually\
    \ cleaner way of presenting the same value.\n\nCleaner—no string concatenation,\
    \ fewer quotes:\n\nec\aho \"<input type = 'hidden' ' name = 'key' value = '{$key}'/>\"\
    ;"
