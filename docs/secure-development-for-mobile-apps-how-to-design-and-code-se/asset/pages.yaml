  md: "**12**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nIn real applications,\
    \ read only requests are fully dangerous. Read only requests\n\nstill dynamically\
    \ assemble the data to be delivered based on untrusted user input.\n\nTherefore\
    \ input must be properly filtered and validated, then properly escaped out\n\n\
    into the database before lookup, and properly escaped out into the browser for\n\
    \n­viewing. This process can be simplified from a filtering standpoint when the\
    \ intent is\n\nclear from the request type. The same applies with a POST request\
    \ to modify data.\n\nRequest type makes processing intent clear. Intent makes\
    \ design and implementation\n\nclearer.\n\nThere are many heated debates about\
    \ REST (Representational State Transfer)\n\narchitecture and how to properly use\
    \ the HTTP specification when implementing\n\nGET and POST. Our purpose here is\
    \ not to end that argument but to introduce some\n\nadditional ideas that aid\
    \ the process of defensive programming.\n\nOne thing that seems to fuel the debate\
    \ is the blurred lines of certain requests.\n\nFor example, in this book, a GET\
    \ request is used with a code to activate an account.\n\nIs that a read only intent\
    \ or a write modification? You may decide for yourself; it\n\ncould be argued\
    \ either way. The choice here is not academic. It is made in this case\n\nbecause\
    \ of the email delivery requirement and how a GET request link works so\n\nwell\
    \ for this case. The only goal in any endeavor is to achieve the best result for\
    \ the\n\nconsumer.\n\nIn most cases, this book strives for a clear intent of request,\
    \ $_GET for read,\n\n$_POST for writes, and makes explicit use of each. $_REQUEST\
    \ is discarded by\n\ncompletely unsetting the array so it cannot ever be used.\n\
    \nFinally, with this new mindset is the new notion of data always in transit,\
    \ and that\n\ndata is never “Done.” Remove from your mind the concept of “clean\
    \ all input then\n\ndone.” Instead, get into the mindset of “Filter input, Escape\
    \ output” when required.\n\nThe “when required” idea is important because it is\
    \ true in any application, at any\n\ntime that data is either at rest inside a\
    \ variable, or in transit, headed to a different pars­\n\ning engine. Keep in\
    \ mind the idea that data in variables are held in stasis, frozen, until\n\nsomething\
    \ acts upon them. As long as it’s just a variable, it’s harmless.\n\nA dangerous\
    \ attack string could come in through a GET request, sit inert inside\n\nthe $_GET\
    \ array container, and if it is never accessed, it does no harm. The potential\n\
    \nfor harm is only determined by what parsing engine acts upon it. Different actions\n\
    \nhave different determinations. This is why output context is so critically important.\n\
    \nFor example, the following logic is perfectly acceptable.\n\n• To begin, filter/validate\
    \ an incoming variable according to business criteria.\n\nThis has nothing to\
    \ do with security. The process at this stage is to ensure\n\nthat there is a\
    \ user name with a max limit of 40 alphabetic UTF-8 charac­\n\nters, so that the\
    \ name fits without truncation inside the 40-character limit\n\nUTF-8 table column.\
    \ Destruction and/or rejection of user data according to\n\n­application rules\
    \ is perfectly acceptable here. The decision about what is good\n\ndata is the\
    \ choice of the designer."
