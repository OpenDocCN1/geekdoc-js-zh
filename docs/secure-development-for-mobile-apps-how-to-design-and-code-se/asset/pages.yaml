  md: "**253**\n\n**Secure Forms and Account Registration**\n\nThe second task is\
    \ to check that the expected form fields are present in the request.\n\nHere some\
    \ automation is employed to process the $ _ POST array for the expected\n\nfields.\
    \ To do this, first an array of required form fields is established.\n\n$formFields\
    \ = \a**array**('username', 'passwordOrig', 'passwordConfirm',\n\n'email');\n\n\
    So we know that the expected fields are a user name, a password, the confirmation,\n\
    \nand an email address.\n\nA foreach() loop.\n\n**foreach** ($formFields as $**index**\
    \ = > **$field**)\n\ngoes through the required fields array, $formFields[] and\
    \ uses the defined field\n\nproperty as a lookup key to check the $ _ POST array.\n\
    \nif(!**array_key_exists**($field, $_POST) || **empty**($_POST[$field]))\n\nThis\
    \ line used the array_key_exists  () functions to see if the value of index\n\n\
    at $formFields[0], which would be ‘username,’ exists in the $_POST array, or if\n\
    \nthe field contains no value. If the field is not present, the $allFileds flag\
    \ is set to\n\nfalse to let us know that some fields are missing.\n\nThe third\
    \ task is to start processing the incoming variables. This is done in two\n\n\
    steps. The first step is to sanitize the data according to what the database table\
    \ column\n\nrequires; the second step is to validate that the sanitized data is\
    \ correct.\n\nIt is expected that data is correct for a legitimate user. What\
    \ this means is that the\n\nlogic at this point is meant to keep the application\
    \ safe. It is not going to worry about\n\nwhether the data is what the user wants.\
    \ The client side validation should have taken\n\ncare of that. The client side\
    \ validation code works with the user to make sure the data\n\nis correct and\
    \ what the user intends, and helps a user correct mistakes. The server\n\nsimply\
    \ functions as an integrity enforcer.\n\nThe data submitted by the client is obviously\
    \ insecure, and able to be manipulated.\n\nThe point is that legitimate users\
    \ will work with the system, and submit correct data\n\nas assisted by the client\
    \ side code. Correct client side code should pass through all\n\nthe server validation\
    \ checks unaltered. Attackers can of course circumvent client\n\nside validation\
    \ and submit whatever raw data they like, but the server logic doesn’t\n\ncare\
    \ about correcting those kinds of submissions. The data is just rejected.\n\n\
    The first sanitization action looks at $ _ POST['username'] to check if the\n\n\
    characters are of the allowed type, which are a–z, A–Z, and 0–9.\n\nif(**ctype_alnum**($_POST['username']))\n\
    \nIf so, then username is destructively cut to the length of the table column\
    \ size and\n\nassigned as a named key in $formFields array."
