  md: "**334**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThe reason that\
    \ the JSON array is exploitable, and the JSON object in JavaScript is\n\nnot,\
    \ is that the array notation, code surrounded by []s, is executable. Code begin­\n\
    \nning with a curly brace is not. Section 12.4 of the ECMAScript v5 specifica­\n\
    \ntion, which defines JavaScript, clarifies in the rules for an Expression Statement,\n\
    \n“An Expression Statement cannot start with an opening curly brace because\n\n\
    that might make it ambiguous with a Block.” The result is that code, or a JSON\n\
    \nobject wrapped in curly braces, will not execute under JavaScript but will produce\n\
    \nan error.\n\nThis is important to be aware of when constructing JSON objects\
    \ for JavaScript\n\nclients. The server should not return executable code to JavaScript.\
    \ The server should\n\nalways return non-executable JSON objects.\n\n*Proper JSON\
    \ Construction Depends on Array Construction*\n\nHere is the way to ensure that\
    \ PHP is returning proper JSON objects to clients. The main\n\nmethod to return\
    \ JSON objects in PHP is with json_encode(). This function takes\n\nan array and\
    \ turns it into a JSON formatted UTF-8 string.\n\nThe trouble is that with default\
    \ parameter usage of json_encode, there is a poten­\n\ntial to return exploitable\
    \ code without knowing it. For example, most PHP examples\n\ndemonstrate creating\
    \ and returning a JSON object like this:\n\necho **json_encode**($riders);\n\n\
    This leaves little opportunity to know whether the returned JSON is a safely con­\n\
    \nstructed object or an exploitable array. There also is no chance to catch errors\
    \ that\n\noccur during encoding. The data echoed out might be an array or an object.\
    \ Whether\n\nor not the returned string is enclosed in brackets or curly braces\
    \ depends on how the\n\narray was constructed.\n\n*Exploitable Construction *\
    \ If the array was constructed like this,\n\n$riders = **array**(**ar\aray**(\"\
    rider\" = > \"Colin Edwards\", \"team\" = >\n\n\"Yamaha\"),\n\n**ar\aray**(\"\
    rider\" = > \"Marc Marques\", \"team\" = >\n\n\"Honda\" ),\n\n**ar\aray**( \"\
    rider\" = > \"Casey Stoner\", \"team\" = >\n\n\"Ducati\" ));\n\nthe result from\
    \ json_eoncode($riders) is an exploitable JSON array that is\n\nreturned.\n\n\
    **[**{\"rider\":\"Colin Edwards\",\"team\":\"Yamaha\"},\n\n{\"rider\":\"Marc Marques\"\
    ,\"team\":\"Honda\"},\n\n{\"rider\":\"Casey Stoner\",\"team\":\"Ducati\"}**]**"
