  md: "**30**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Rule #1—HTML Escape\
    \ before Inserting Untrusted Data into HTML Element Content*\n\nRule #1 is for\
    \ when you want to put untrusted data directly into the HTML body some­\n\nwhere.\
    \ This includes inside normal tags like div, p, b, td, etc. Most web frameworks\
    \ have\n\na method for HTML escaping for the characters detailed below. However,\
    \ this is **abso­**\n\n**lutely not sufficient for other HTML contexts**. You\
    \ need to implement the other rules\n\ndetailed here as well.\n\n<body>\n\n...ESCAPE\
    \ UNTRUSTED DATA BEFORE PUTTING HERE ...</body>\n\n<div>\n\n...ESCAPE UNTRUSTED\
    \ DATA BEFORE PUTTING HERE ...</div>\n\n<p>\n\n...ESCAPE UNTRUSTED DATA BEFORE\
    \ PUTTING HERE ...</p>\n\n<span>\n\n...ESCAPE UNTRUSTED DATA BEFORE PUTTING HERE\
    \ ...</span>\n\nAny other normal HTML elements\n\nPHP code example:\n\n<p><?php\
    \ echo $encoder->encodeForHTML($value); ?> <p>//safe for HTML\n\nEscape the following\
    \ characters with HTML entity encoding to prevent switching\n\ninto any execution\
    \ context, such as script, style, or event handlers. Using hex entities is\n\n\
    recommended in the spec. In addition to the 5 characters significant in XML (&,\
    \ <, >, “, ‘),\n\nthe forward slash is included as it helps to end an HTML entity.\n\
    \nEntity Encoding Table\n\nCHARACTER\n\nENTITY NAME\n\nENTITY CODE\n\n<\n\nLess-than\n\
    \n&lt;\n\n>\n\nGreater-than\n\n&gt;\n\n&\n\nAmpersand\n\n&amp;\n\n“\n\nDouble\
    \ quote\n\n&quot;\n\n‘\n\nSingle quote\n\n&#x27;\n\n/\n\nForward slash\n\n&#x2F;\n\
    \n*Note:* &apos; not recommended because it is\n\nnot in the HTML spec.\n\n*Rule\
    \ #2—Attribute Escape before Inserting Untrusted Data into HTML Common Attributes*\n\
    \nRule #2 is for putting untrusted data into typical attribute values like width,\
    \ name, value,\n\netc. This should not be used for complex attributes like href,\
    \ src, style, or any of the event\n\nhandlers like onmouseover. It is extremely\
    \ important that event handler attributes should\n\nfollow Rule #3 for HTML JavaScript\
    \ Data Values.\n\n<div attr =...ESCAPE UNTRUSTED DATA BEFORE PUTTING HERE...>content</div>\n\
    \ninside UNquoted attribute\n\n<div attr = '...ESCAPE UNTRUSTED DATA BEFORE PUTTING\
    \ HERE...'>content</div>\n\ninside single quoted attribute"
