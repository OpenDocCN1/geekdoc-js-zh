  md: "**185**\n\n**Secure Session Management**\n\n*Verify That Session IDs Were Actually\
    \ Generated by Your Server * Since PHP accepts user\n\ninput session ID, it is\
    \ critical that session IDs are validated as actually being generated\n\nby the\
    \ server and not from the user. The way to ensure this is to mark sessions created\n\
    \nby the server, and then check each time after session_start() is called if the\
    \ ID\n\nis a server-generated ID or not.\n\nsession_start() initiates itself to\
    \ whatever ID is presented by the browser. If no\n\nsession cookie is presented\
    \ by the browser, then a new, server-generated ID is created.\n\nHowever, if a\
    \ user creates an ID and sends it along with the request, session_start()\n\n\
    will create a session with the user-supplied ID. It then looks up the data associated\
    \ with\n\nthat ID if any exists. A user-created ID does not contain a server mark.\
    \ So if the server\n\nchecks the session data for the mark, it will fail. The\
    \ code needed is:\n\n<?php\n\n//activate session\n\nsession_start();\n\n//TEST\
    \ THAT SESSION ID WAS SERVER GENERATED\n\n//IF NOT, REJECT, DESTROY, REGENERATE\
    \ AND MARK\n\nIf(!isset**($_SESSION['SERVER_GENERATED_ID']**))\n\n{\n\n//e\axplicitly\
    \ destroy all session data and create\n\nserver session ID\n\nunset($_SESSION);\n\
    \nsession_destroy();\n\nsession_start();\n\nsession_regenerate_id(true);\n\n**$_SESSION['SERVER_GENERATED_ID']\
    \ = true;**\n\n}\n\n?>\n\nThis code, which needs to be at the top of every page\
    \ that requires session\n\n­management, first starts a session with session_start()\
    \ and then checks if asso­\n\nciated session data has a server mark. If this ID\
    \ had been previously generated by the\n\nserver, sent to the client browser,\
    \ and is now coming back to the server, the associated\n\nsession data would contain\
    \ this mark. If the ID is either brand new or user created, it\n\nwill not contain\
    \ a server mark, so the session data is destroyed and a new session ID\n\ncreated.\n\
    \nThe only way to guarantee a server-generated session ID is to generate one after\n\
    \ndestroying whatever was sent by the client to prevent session_start() from ini­\n\
    \ntializing itself to a browser-supplied ID. After destroying what came in, a\
    \ new session\n\nID is created and marked, letting the server know in the future\
    \ that this ID came\n\nfrom the server. This mark will remain for the life of\
    \ this session until it is destroyed.\n\nTampering with the ID will result in\
    \ the destruction of that session, which helps\n\nprotect all user sessions.\n\
    \nIt is still possible that a user could guess a session ID that is in use and\
    \ has\n\na server mark. In this case, other security measures need to be in place to limit"
