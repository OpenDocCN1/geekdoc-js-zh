  md: "**198**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThe duration of\
    \ a session record lifetime equates to the windows of opportunity for an\n\nattacker\
    \ to attack that ID, therefore garbage collection is another security ­consideration.\n\
    \nToo short a duration annoys users, and too long increases attack opportunity.\n\
    \nA simple but sometimes overlooked fact is that session configuration must be\
    \ set\n\nbefore a session is started with session_start(). The procedure is, configure\n\
    \nfirst, start session second.\n\nBelow is a list of important options to set.\
    \ A full explanation of each setting fol­\n\nlows the listing. Each of these increases\
    \ the strength of the session as compared to\n\nPHP default settings. The settings\
    \ can be set either directly in php.ini or through the\n\nini_set() function at\
    \ runtime. It is obviously better to statically set these in php.\n\nini. For\
    \ purposes of example, the functions here enforce the settings for the ­application\n\
    \nregardless of what is set in php.ini.\n\nMany settings can be turned off or\
    \ on by setting to ‘1’ for on, or ‘0’ for off. True\n\nor False can also be used,\
    \ True for ‘On,’ and False for ‘Off.’ Other settings require a\n\nnamed parameter,\
    \ such as the name of the encrypted hash function to use or the life­\n\ntime\
    \ duration.\n\nAnother important aspect is that many of these settings affect\
    \ the header informa­\n\ntion that is sent to the client and therefore to be effective,\
    \ session configuration must\n\nbe set as part of the overall header setting functionality\
    \ of the application before any\n\nHTML content is sent to the client browser.\n\
    \n*Configure Security before* *Session_Start()* *Is Called*\n\nCompletely configure\
    \ the session management options first:\n\n//Configure session auto start behavior\
    \ to off\n\nini_set('session.auto_start',\n\n0);\n\n//Configure session ID to\
    \ securely use cookies\n\nini_set('session.use_cookies',\n\n1);\n\nini_set('session.use_only_cookies',\n\
    \n1);\n\nini_set('session.cookie_httponly',\n\n1);\n\nini_set('session.cookie_secure',\n\
    \n1);\n\nini_set('session.use_trans_sid',\n\n0);\n\n//Configure session ID generation\
    \ options\n\nini_set('session.entropy_file',\n\n'/dev/urandom');\n\nini_set('session.entropy_length',\n\
    \n512);\n\nini_set('session.hash_function',\n\n'sha256');\n\nini_seT('session.hash_bits_per_character',\n\
    \n6);\n\n//Configure session garbage collection parameters\n\nini_set('session.gc_probability',\n\
    \n1);\n\nini_set('session.gc_divisor',\n\n100);\n\nini_set('session.gc_maxlifetime',\n\
    \n604800);"
