  md: '**383**


    **Twitter Authentication and SSL cURL**


    Per the Twitter API specification, the consumer key and the consumer secret must


    be concatenated together by a : character and then Base64 encoded, as done here.


    The member variables were set in the constructor call.


    $b64Key = **base64_encode**($this->_key. '':''. $this->_secret);


    Next, POST parameters unique to making the oAuth call need to be set. Here


    the header parameter is formed using the Base64 encoded string created in the


    previous step.


    $oauthHeaders = **array**(''Authorization: Basic ''. $b64Key);


    The POST field ‘grant_type’ with the value ‘client_credentials’ needs to be con­


    structed as an array. This will be passed to cURLData().


    $oauthOption = **array**(CURLOPT_POSTFIELDS = >


    **array**(''grant_type'' = > ''client_credentials''));


    After the specifics for an oAuth call are prepared, cURLData() is called with


    these parameters. The rest of the setup involved for making a cURL call is contained


    in cURLData() itself.


    $oauth = cURLData($this->_oauthURL, $oauthHeaders, $oauthOption);


    When cURLData returns, if successful, a JSON object with the property


    of ‘token_type’ equal to ‘bearer’ will exist. The PHP function, property_


    exists(), is used to test this. If true, then we have a valid token, and extract
    it with


    $oauth->access_token.


    **if**($oauth && **property_exists**($oauth, ''token_type''))


    {


    **if**($oauth->token_type = = = ''bearer'')


    return $oauth->access_token;


    }


    *Setting SSL Verification for cURL*


    cURLData() performs the cURL operations for getting data from Twitter.


    This function is called from getAuthToken() and from getTweets(). Each


    one has different needs. getAuthToken() is a POST request, getTweets()


    is a GET request. The parts of cURL setup that are the same are abstracted to


    cURLData().


    One aspect common to each call is the SSL URLs for each request. To keep the


    integrity of the security, verification of the Twitter service endpoint needs
    to occur


    every time for each type of call. This is the way this is done using cURL.'
