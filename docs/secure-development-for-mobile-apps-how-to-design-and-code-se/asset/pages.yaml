  md: "**395**\n\n**Secure AJAX Shopping Cart**\n\n**The Mobile Store**\n\nThe ajaxStore.php\
    \ file contains the code for presenting the store catalog inside the\n\nmobile\
    \ framework. Separation between HTML and PHP is applied so that a clean\n\ndocument\
    \ layout is viewable and the syntax highlighting of the code editor can be\n\n\
    applied. This is something that cannot be done with strings and echo statements,\
    \ and\n\ngreatly enhances all aspects of coding.\n\nThe top of the page contains\
