  md: "**288**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nsuch as escalation\
    \ checks and SSL-only cookies, should be relatively secure when\n\nweighed against\
    \ user needs. Below is a fairly strong way to implement a RememberMe\n\nfeature\
    \ that automatically logs users in when they desire it to avoid having to re-login\n\
    \nall the time.\n\nA RememberMe cookie should never contain a user password. If\
    \ it does and the\n\ncookie is stolen, then the attacker has complete control\
    \ of the account. This means\n\ncreating a cookie that is a lookup key with an\
    \ expiration time attached to it. This\n\nthen becomes an authentication key with\
    \ no direct link to the password and no way\n\nto discover or coerce additional\
    \ information from it. An authentication key should be\n\na unique, random string\
    \ that is encrypted and stored in a separate table with the user\n\nID to enable\
    \ account lookup.\n\nSince the RememberMe cookie is serving as an automatic authentication\
    \ key, steps\n\nneed to be taken to protect it from theft. The cookie should be\
    \ configured for HTTP-\n\nonly access on the client browser, and a secure flag\
    \ should be set so that the cookie\n\nonly is sent over SSL requests. The ramification\
    \ is that only HTTPS session pages\n\ncan use the RememberMe cookie. This means\
    \ the landing page and any other pages\n\nintended for session access are accessed\
    \ only over SSL. With a mobile application, this\n\nbecomes easier to architect\
    \ as usually there are fewer pages per site, and single page\n\napplication comprising\
    \ of AJAX calls are common. This scenario works very well with\n\nSSL-only RememberMe\
    \ authentication cookie implementation.\n\nA login function that allows for the\
    \ use of a RememberMe key could be imple­\n\nmented like this.\n\nfunction performLogin($userName,\
    \ $password, $rememberMe = false)\n\n{\n\n$user = $db->getUser($userName);\n\n\
    if($user)\n\n{\n\nif($rememberMe)\n\n{\n\n$authKey = **base64_encode**(**hash**('sha256',\n\
    \n**openssl_random_pseudo_bytes**(32)));\n\n$query = \"UPDATE remember\n\nSET\
    \ auth_key = :authKey\n\nWHERE username = :userName\";\n\n$params = **array**(':authKey'\
    \ = > $authKey,\n\n':\auserName' = >\n\n$userName);\n\n$db->executeQuery($query,\
    \ $params);\n\n**setcookie**(\"rememberme\", $authKey,\n\ntime() + 60 * 60 * 24\
    \ * 7,\n\n\"/\",\n\n\"mobilesec.com\",\n\ntrue, //set HTTP only flag\n\ntrue)\
    \ //set SSL only flag"
