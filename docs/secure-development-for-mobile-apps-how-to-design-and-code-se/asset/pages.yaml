  md: "**96**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Keep Strings as\
    \ Small as Possible for Filters and for SQL Tables*\n\nObviously there is a need\
    \ to keep large chunks of text for users in the database.\n\nA blog post is an\
    \ example. Limiting the size would negatively impact usefulness.\n\nMost user-related\
    \ account data, names, email, and zip codes have a fixed size. It is\n\nimportant\
    \ to keep this data as small as possible from a SQL perspective. Smaller\n\ndata\
    \ means smaller records and indexes, which means more records and indexes\n\n\
    fit into available memory, which means faster record lookups with fewer hard disk\n\
    \nseeks. This can become an issue for the application once there are a lot of\
    \ records,\n\nor on a shared server where memory is more constrained. Again, optimizing\
    \ a loop\n\nmight not gain nearly as much performance improvement as fitting more\
    \ records\n\ninto memory with fewer hard disk seeks, or spending less CPU time\
    \ filtering\n\nlarge strings.\n\n*Issues to Avoid*\n\n*Problems with Filtering/Escaping\
    \ Wrong Types * There is no single magic bullet cleaner\n\nfunction to make your\
    \ input variables clean. For example, you cannot run all variables\n\nthrough\
    \ addslashes() and mysql _ real _ escape _ string() and declare\n\nthem clean\
    \ and safe. Everything depends on type and context. Filters that work on\n\nstrings\
    \ will usually not impact integer values. If PHP is set for ISO character set,\n\
    \nand your database is set for UTF-32, you have a character type mismatch of the\
    \ sort\n\nthat security holes are made from. In this case, addslashes() doesn’t\
    \ understand\n\nthe encoding at the database, and vice versa. If addslashes()\
    \ is meant to clean the\n\ndata for the database, it is likely that it won’t be\
    \ able to because PHP and MySQL\n\nare essentially speaking different characters\
    \ sets. The function mysql _ real _\n\nescape _ string() is meant to escape control\
    \ characters from strings. It differs\n\nfrom addslashes() in that it knows the\
    \ database character set and can do the\n\nright thing for strings about to be\
    \ inserted into a SQL statement. It does not “clean”\n\nintegers.\n\nProper and\
    \ correct care of building a SQL statement consists of coordinating the\n\nPHP\
    \ character set and the MySQL character set, and knowing what exactly is going\n\
    \ninto the statement.\n\nmysql_real_escape_string() is a soon-to-be deprecated\
    \ function and is\n\nno longer a best practice. It is used as an illustration\
    \ here because it will be a part of\n\nlegacy and maintenance code for quite some\
    \ time to come, and despite its name has\n\nbeen widely misunderstood as a general\
    \ purpose cleaner.\n\n*Escaping Integers Does Not Always Work * There is a reason\
    \ mysql_real_escape_\n\nstring() has such a long and descriptive name. It escapes\
    \ strings in real time with\n\nthe real character set in use by the active database\
    \ connection. It is not meant for inte­\n\ngers. Integers, if validated as actual\
    \ integers, do not need escaping."
