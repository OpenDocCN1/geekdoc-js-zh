  md: '**129**


    9


    PHP and PDO


    The wildly popular and widely implemented legacy MySQL API, known as the


    mysql_query() series of functions, exists no more. It is depreciated as of PHP 5.5\.


    PDO, which stands for PHP Database Objects, is one of two database libraries that


    are to be used with MySQL going forward. Two reasons for moving on from the


    legacy MySQL API are an object-oriented interface to the database functions, and


    improved security. The first reason is great; the second is essential. Previously,
    it took


    a lot of manual effort to make mysql_query() secure. Even so, something could


    easily be missed, and often was. The libraries’ widespread use has enabled both
    great


    applications and widespread security holes. An automated way to assist with database


    security problems was needed. PDO is one of the answers (MySQLi being the other),


    and is the library chosen exclusively for this book.


    The primary benefit of PDO for security programming is the *prepared statement*.


    Prepared statements separate the construction of a SQL statement from the insertion


    of a query variable. Prepared statements prevent inserted user variables from
    altering


    the SQL statement, and they do this automatically, which is a great relief to
    defensive


    programming efforts, since the alteration of SQL statements is the hole that drives


    SQL injection.


    The reason that the MySQL API is so susceptible to SQL injection is because


    the original mysql_query() function makes a single round trip to the MySQL


    server to obtain data. The call sends the query string with the embedded query


    variable to the server, which parses the SQL statement, compiles the new state­


    ment, and then executes it and returns the recordset. If the query variable is
    not


    properly escaped, the original SQL statement can be altered. This is the basis
    for


    SQL injection.


    In PDO, true prepared statements are a two-step process and require two round


    trips to the MySQL server. First, the SQL statement is sent to the server, then
    parsed


    and compiled with placeholders for the variables. The statement is not executed.
    Then


    a second trip is made to the server with the user-supplied variables, which are
    then


    inserted into an already compiled query, executed, and a recordset is returned.
    This


    is a two-round-trip network call. In prepared statements, the SQL compiler never


    confuses user input as part of the compilation directions. Once prepared, the
    SQL


    statement cannot be altered.


