  md: "**95**\n\n**PHP Security Tools Overview**\n\n*Use Type Enforcement Everywhere\
    \ You Can*\n\nPHP makes it easy to declare a variable, stuff data into it, and\
    \ forget it. Keeping track of\n\nthis can be a security nightmare. Security as\
    \ a whole benefits greatly from enforcing type\n\nand naming it appropriately.\
    \ The common overuse of $var as a variable name is unhelp­\n\nful for tracking\
    \ and validating data. Here are better examples of type enforcement.\n\n//name\
    \ implies use and type, which is a simple type\n\n$userID = 500;\n\n//set up validation\
    \ ranges for this ID which must be positive\n\n//and in this case can never exceed\
    \ 600\n\n$o\aptions = array(\"options\" = >array(\"min_range\" = >0, \"max_\n\n\
    range\" = >600));\n\n//now test it\n\nfilter_var($userID, FILTER_VALIDATE_INT,\
    \ $options));\n\n//name implies use and type, which is a more complex type\n\n\
    $userEmail = \"tester@mobilesec.com\";\n\n//\anow see if it conforms to the complexities\
    \ of an email\n\naddress\n\nfilter_var($userEmail, FILTER_SANITIZE_EMAIL);\n\n\
    *Enforce String Sizes and Numeric Ranges Politely*\n\nConsider the data that needs\
    \ to be collected for the application and create appropri­\n\nate table column\
    \ sizes in the database. These table definitions determine the valida­\n\ntion\
    \ rules that need to be enforced with the application code. PHP validation logic\n\
    \nneeds to be created to enforce keeping the data within the ranges of these definitions.\n\
    \nJavaScript/jQuery code needs to be created on the client side to assist in helping\
    \ the\n\nuser enter appropriate data. Only the PHP code on the server can securely\
    \ enforce the\n\nrules, but the client side code is important for assisting legitimate\
    \ users in entering\n\ndata correctly and providing immediate visual feedback\
    \ to them if something they\n\nenter does not conform. It is very bad behavior\
    \ to simply drop data a user thinks she\n\nentered if it does not meet the validation\
    \ requirements. If something needs to be cor­\n\nrected, she needs the courtesy\
    \ of knowing it immediately. Attackers trying to violate\n\nthe application rules\
    \ by sending raw data to the application server with a network tool\n\ndo not\
    \ need any assistance, only the door slammed.\n\n*Cut Strings before Filtering*\n\
    \nChecking string length and cutting to size helps validation and application\
    \ speed.\n\nWhy filter an overly long string if it is not necessary? Micro-optimizations\
    \ sometimes\n\nhelp, but usually can’t compensate for the time it takes to filter\
    \ 30,000 words when\n\nyou only need 30\\. If an attacker wants to send junk,\
    \ cut it down first before inspection."
