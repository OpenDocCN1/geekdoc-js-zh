  md: "**135**\n\n**PHP and PDO**\n\n**Note:**  The order of the array must also match\
    \ the order of the table columns or an\n\nerror will result. This is not the case\
    \ with named parameters.\n\n*PDO Class Objects Example*\n\nclass member {\n\n\
    public $name;\n\npublic $email;\n\npublic $id;\n\nfunction _construct($name, $email,\
    \ $id) {\n\n$this->name\n\n= $name;\n\n$this->email\n\n= $email;\n\n$this->id\n\
    \n= $id;\n\n}\n\nfunction getAccountInfo(){\n\n//retrieve private data\n\n}\n\n\
    }\n\n$regUser = new member('Mark', 'engineer@mobilesec.com', '35');\n\n$stmt =\
    \ $pdo->**prepare**(\"INSERT INTO members (name, email, id)\n\nVALUES (:name,\
    \ :email, :id)\");\n\n$stmt->**execute**(**(array)**$regUser); //NOTICE the array\
    \ cast\n\nThis example shows how PDO accommodates objected-oriented programming\
    \ by\n\nallowing a living object to be placed into the query and executed. Casting\
    \ the object\n\nto an array is the mechanism that lines up the named placed holders\
    \ with the private\n\nmember variables of the live object $regUser of the class\
    \ “member.” To make use of\n\nthis capability the names and order of the object\
    \ must match the placeholder names\n\nand order of the SQL statement.\n\n**Selecting\
    \ Data and Placing into HTML and URL Context**\n\nBelow is an example of selecting\
    \ data with a PDO SELECT prepared statement and\n\nplacing the results into HTML.\n\
    \n<?php\n\n$s\atmt = $pdo->**prepare**('SELECT name, email, id FROM members WHERE\n\
    \nid = :id');\n\n$stmt->**execute**(**array**('id' = > $id));\n\nfunction _H($html)\
    \ {**echo**  **htmlspecialchars**($\ahtml, ENT_QUOTES,\n\n\"UTF-8\");}\n\nfunction\
    \ _UH($url) {**echo**  **htmlspecialchars**(u\arlencode($url),\n\nENT_QUOTES,\
    \ \"UTF-8\";}"
