- img_proc: true
  md: '**426**


    **Appendix**


    The /u parameter makes it treat $value as a unicode-encoded string. This is important


    for the position matching, so it would correctly pick up unicode characters instead
    of


    splitting them in two.


    The regex matches any *position* (but not a character) that is neither preceded
    by the


    start of the string nor followed by the end, i.e., any “in between position” will
    fit. So if


    preg_split is happy with that (splitting on positions rather than characters),
    it will fill a


    $characters array one character at a time on the correct boundary.


    Check his web site in the Web Sites section for more details on regular expression


    LookArounds.


    **Checking HTML Page Headers against the Latest Security Advisories**


    Jeff Williams of Aspect Security wrote a very useful tool for checking generated


    HTML headers against the latest advisories. It can be found in Check Your Headers


    in the Web Sites section.


