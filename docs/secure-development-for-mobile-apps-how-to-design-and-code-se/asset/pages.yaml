  md: "**139**\n\n**PHP and PDO**\n\nSee the difference in results below. The first\
    \ result is quoted; the second is not.\n\n\"24\" = pdo->**quote**($userID);\n\n\
    versus\n\n24 = **mysql_real_escape_string**($userID);\n\nTherefore, resulting\
    \ SQL statements would look like the following when manually\n\nquoted.\n\nUsing\
    \ PDO quote():\n\nSELECT name, email, id FROM members WHERE id = \"24\"\n\nUsing\
    \ mysql_real_escape_string():\n\nSELECT name, email, id FROM members WHERE id\
    \ = 24\n\nAs demonstrated elsewhere, the problem with the string returned from\
    \ mysql_\n\nreal_escape_string() is that the string representation of the number\
    \ 24 is not\n\nquoted. This essentially treats it as a number, when it is not.\
    \ It is still a string. If it was\n\nan actual integer, it would not need to be\
    \ quoted.\n\n*PDO and WHERE IN Statements*\n\nPDO does allow passing arrays as\
    \ placeholders to prepared statements. This makes a\n\ncommon SQL query such as,\n\
    \nSELECT * FROM users WHERE id IN (43, 56, 672);\n\nless intuitive to achieve\
    \ with prepared statements. In order to achieve this via a pre­\n\npared statement\
    \ in PDO, you’ll have to escape the values manually using the quote()\n\nmethod\
    \ and assemble a parameter string. Here is an example:\n\n<?php\n\n$t\ahis->conn\
    \ = new PDO(\"mysql:host = {$host};dbname = {$db};charset\n\n= utf8\",$user, $pass);\n\
    \n$fateList\n\n= \a**array**(\"Katniss\", \"Peeta\", \"Gale\", \"Katniss's\n\n\
    mom\");\n\n$escapedArray\n\n= \a**array_map(array($this->conn,' quote')**,\n\n\
    $fateList**)**;\n\n$sql\n\n= 'SELECT winner FROM players\n\nWHERE name\n\nIN ('**.join**(',',$inArray).')';\n\
    \n$result\n\n= $this->conn->**query**($sql);\n\n?>"
