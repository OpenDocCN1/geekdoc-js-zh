  md: "**140**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nResulting SQL:\n\
    \nSELECT winner\n\nFROM players\n\nWHERE name\n\nIN (\"katniss\", \"peeta\", \"\
    gale\", \"Katniss/'s mom\"):\n\nHere this code is manually escaping each entry\
    \ using array_map() in conjunc­\n\ntion with PDO quote(). The quote() function\
    \ escapes and quotes each element\n\nof the array, because array_map() walks through\
    \ each element of the array and\n\nsends it to PDO quote(). array_map() is told\
    \ how to call PDO quote() by\n\nusing array($this->conn,' quote') to get the function\
    \ location within the PDO\n\nobject. This is a powerful mechanism for mapping\
    \ object functions to array function\n\niterators like array_map();. The next\
    \ step uses join() to build a string of comma\n\nseparated, quoted, and escaped\
    \ names as the list for the IN statement.\n\n**White Listing and PDO Quoting of\
    \ Column Names**\n\nPrepared statements do not allow columns to be variable. In\
    \ order to construct a query\n\nwhere the column names are not known until runtime,\
    \ the query string has to be\n\nconstructed dynamically, which counters the automated\
    \ protection of prepared state­\n\nments. In real applications however, this is\
    \ often a business necessity. One way to\n\naccomplish the task of safely assembling\
    \ a dynamic column list is through the use of\n\nwhite listing the possible column\
    \ names. This technique was demonstrated by Bill\n\nKarwin.^*\n\nfunction buildSecureSQLColumns($userID,\
    \ $columnName) {\n\n//whitelist of hardcoded, acceptable, column names\n\n$colNames\
