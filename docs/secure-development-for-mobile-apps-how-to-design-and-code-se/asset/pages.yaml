  md: '**85**


    **PHP Security Tools Overview**


    The PHP ctype functions, ctype_alnum(), and ctype_num() are useful for


    testing a string for valid character types. These functions do not convert; they
    simply


    test. If the test is positive, then the string is ensured to contain only numbers
    0–9, or


    only number and letters, a–z, A–Z.


    Usage is


    if(ctype_alnum($userID))


    {


    $validID = $ userID;


    }


    OR


    if(ctype_num($id))


    {


    $numericID = $id;


    }


    *Filter Functions*


    The PHP filter family of functions has a great many options for validating data.


    The implementation of the functions depends on the type of flags passed in as
    the


    filter option, and there are two main flavors of filter flags, FILTER_VALIDATE
    and


    FILTER_SANITIZE. The difference is that using the FILTER_VALIDATE flag tests


    for condition, and FILTER_SANITIZE performs destructive data conversion.


    These functions can be quite verbose, so wrapper shortcuts, or façades, are very


    helpful for using these functions inline when needed.


    The benefit of the verbosity of these functions is that they are specific, which
    can be


    incredibly important. Examples of this are:


    filter_var($number,FILTER_VALIDATE_INT)


    filter_var($number,FILTER_VALIDATE_FLOAT)


    filter_var($number,FILTER_VALIDATE_BOOLEAN)


    which is more verbose that intval(). But when the specification requires it, these


    are very important distinctions.


    filter_var() *Functions*  FILTER_VALIDATE_INT: Test if string is a valid inte­


    ger value or not. Will return true or false.


    $integer = ''121212'';


    if(**filter_var**($integer,FILTER_VALIDATE_INT)) {


    echo ''Is integer'';


    }


    $integer = ''121212'' will pass.


    $integer = ''121212.12'' will fail.'
