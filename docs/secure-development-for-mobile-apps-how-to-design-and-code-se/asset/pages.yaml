  md: "**411**\n\n**Secure AJAX Shopping Cart**\n\n*Securely Posting to PayPal*\n\n\
    This file is one function which does two things. It formats the data for the PayPal\
    \ API\n\ncalls and sets up cURL for a secure transaction. The important thing\
    \ to remember is\n\nto set SSL peer verification. Just because something is encrypted\
    \ does not mean it is\n\nsecure. It is entirely possible to have an encrypted\
    \ communication with a criminal.\n\nSSL verification is the established process\
    \ for authenticating the actual host being\n\ncommunicated with.\n\nIt is important\
    \ for maintaining integrity of trust that if a user of your site is con­\n\nnected\
    \ to you over an SSL channel the backend server is not obtaining data over an\n\
    \nunsecure channel. SSL peer verification keeps the integrity of the entire three-party\n\
    \ncommunication process between the user, your server, and the PayPal server intact.\n\
    \npayPayPOST.php\n\nfu\anction PayPalPost($methodName, $payPalApiUsername,\n\n\
    $payPalApiPassword, $payPalApiSignature, $payPalMode,\n\n$ppDataString)\n\n{\n\
    \n//prepare url for PayPal Endpoint\n\n//use sandbox mode or live mode\n\n//sandbox\
    \ needs a period separator in front of it\n\n$payPalMode = ('sandbox' === $payPalMode)\
    \ ? '.sandbox' : '';\n\n$API_EndPoint = \"https://api-3t\".$payPalMode.\".paypal.com/nvp\"\
    ;\n\n//configure cURL\n\n$ch = **cURL_init**();\n\n**cURL_setopt**($ch, cURLOPT_URL,\
    \ $API_EndPoint);\n\n**cURL_setopt**($ch, cURLOPT_VERBOSE, 1);\n\n**//enable SSL\
    \ Verification of financial transaction server**\n\n**cURL_setopt**($ch, **cURLOPT_SSL_VERIFYPEER,\
    \ TRUE**);\n\n**cURL_setopt**($ch, **cURLOPT_SSL_VERIFYHOST, 2**);\n\n**//path\
    \ to CA cert file**\n\n**cURL_setopt**($ch, **cURLOPT_CAINFO, '/private/cacert.pem'**);\n\
    \n//configure cURL for POST\n\n**cURL_setopt**($ch, cURLOPT_POST, 1);\n\n**cURL_setopt**($ch,\
    \ cURLOPT_RETURNTRANSFER, 1);\n\n//configure PayPal API request string\n\n$nvpRequest\
    \ = \"METHOD=$methodName\".\n\n\"&VERSION=\".urlencode('109.0').\n\n\"&PWD=\"\
    \ .urlencode($payPalApiPassword).\n\n\"&USER=\".urlencode($payPalApiUsername).\n\
    \n\"&SIGNATURE=\" .urlencode($payPalApiSignature);"
