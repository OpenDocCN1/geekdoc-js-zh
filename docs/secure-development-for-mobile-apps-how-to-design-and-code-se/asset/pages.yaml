  md: "**385**\n\n**Twitter Authentication and SSL cURL**\n\n*Retrieve Latest Tweets\
    \ from Timeline*\n\ngetTweets() is called to fetch the tweets from Twitter. This\
    \ is a GET request.\n\nThe main job of this function is to prepare the URL parameters\
    \ needed for the call. The\n\npreparation done here is simpler than the preparation\
    \ done in getAuthToken().\n\nFirst, create the necessary Twitter timeline URL\
    \ based on user handle and count.\n\n$url = $timeLineURL. $this->_handle. '&count\
    \ = '. $count;\n\nNext, one header is created which contains a current oAuth token,\
    \ which was stored\n\nas a member in the constructor when this object was created.\n\
    \n$headers = array('Authorization: Bearer '. $this->_oauthToken);\n\nNo other\
    \ options are needed, so cURLData is called to fetch the tweets from the\n\ntimeline.\n\
    \n$tweets = cURLData($url, $headers, null);\n\nLast, the array of tweets is returned.\
    \ This array will contain simple, plain text tweet\n\nmessages. These tweets,\
    \ provided they are escaped properly will be safe to display in\n\nHTML. However,\
    \ they will lack the interactivity tweeting is known for.\n\n*Creating and Filtering\
    \ Hyperlinks from Plain Text*\n\nThis is the most involved part of the process.\
    \ processTweet() is called on every\n\nsingle message to turn the plain text message\
    \ into HTML.\n\nThere are three regular expressions defined which are used to\
    \ extract URLs, hashtags,\n\nand mentions from tweet messages. Each expression\
    \ is also Unicode enabled by adding\n\nthe /u switch at the end of the expression.\n\
    \nThe URL expression allows only http, https, ftp, and ftps protocols. This prevents\n\
    \nJavaScript from being allowed as a function link. The hashtags expression looks\
    \ for phrases\n\nbeginning with #, and the mentions expression looks for phrases\
    \ beginning with @.\n\n$reg_url\n\n= \a\"/(http|https|ftp|ftps)\\:\\/\\/[a-zA-Z0-9\\\
    -\\.]+\n\n\\.[a-zA-Z]{2,3}(\\/\\S*)?/u\";\n\n$reg_hashtags = \"/#([a-zA-Z0-9])+/u\"\
    ;\n\n$reg_mentions = \"/@([a-zA-Z0-9])+/u\";\n\nHtmlspecialchars() takes advantage\
    \ of a new feature added in PHP 5.4, the\n\nability to replace, or substitute\
    \ invalid characters with U+FFFD. This allows this one\n\nfunction to serve as\
    \ both a filter and conversion tool.\n\n$linkText = **htmlspecialchars**($linkText,\n\
    \nEN\aT_QUOTES | ENT_SUBSTITUTE | ENT_HTML5,\n\n\"UTF-8\", false);"
