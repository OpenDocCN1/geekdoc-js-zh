  md: "**196**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n**PHP Default Session\
    \ Storage Overview**\n\nBy default, session data is saved in individual files\
    \ in a single directory on the server.\n\nEach session has its own separate file,\
    \ and the name of each file is the unique session\n\nID. The session ID is also\
    \ stored inside a cookie sent to the client browser as part of\n\nthe headers\
    \ set up by PHP session management. PHP retrieves all session data in\n\nsubsequent\
    \ page requests using the session ID contained in the cookie submitted by\n\n\
    the client.\n\nWhen a request comes in, the submitted cookie, if it exists, is\
    \ stored in PHP’s\n\n$_COOKIE array. This occurs whether or not session_start()\
    \ is called. When\n\nsession_start() is called, if no cookie is present, a new\
    \ session ID is ­generated\n\nusing the ID generation settings in either php.ini,\
    \ or set through ini_set() ­function\n\ncalls. Then a new session file is created\
    \ and named with the new ID. The ID is then\n\nset as a cookie in the client browser\
    \ via an HTML header packet, and the ­session\n\nis established with this new\
    \ session ID. If a cookie with a session ID exists, PHP\n\nwill try to use the\
    \ ID from the cookie to create the session, using the user-submitted\n\ncookie\
    \ to look up an existing session file or creating a new file if needed. This is\
    \ how\n\nit is ­possible to steal a session ID. By default, there are no checks\
    \ performed to see if\n\nthe user who submitted the cookie is the actual owner\
    \ for whom the session ID was\n\ncreated. In order to increase security, a custom\
    \ session handler needs to perform these\n\nchecks and make a determination about\
    \ the validity of the session ID.\n\n*Session Storage Life Cycle*\n\nThere is\
    \ a predefined cycle that occurs for each session. When session_start()\n\nis\
    \ called, and the script ends, the following events happen:\n\n1. Open the session\
    \ file\n\n2. Read the session data from file\n\n3. Write the session data to file\n\
    \n4. Close the session file\n\n5. Destroy the session file—*optional*\n\n6. Garbage\
    \ collection determination of session files—*optional*\n\nThe implementation of\
    \ these session events can be customized, but the order in which\n\nthey are called\
    \ is left under the control of PHP, which makes it easy to implement a\n\ntransparent\
    \ session handler.\n\nThe first four events always occur in order on normal begin\
    \ and end of a session.\n\nEvents 5 and 6 happen when a session is destroyed or\
    \ garbage collection is called.\n\nSession_destroy is a function that must be\
    \ specifically called when a session is\n\nto be removed and the session ID, along\
    \ with the file or record contents, are deleted.\n\nGarbage collection is called\
    \ at random times based on the randomization parameters\n\nset in the session\
    \ garbage collections settings in php.ini, or ini_set();."
