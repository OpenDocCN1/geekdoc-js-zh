  md: "**247**\n\n**Secure Forms and Account Registration**\n\nFinally, the class\
    \ is instantiated, which kicks off the constructor, loading any\n\nincoming nonce,\
    \ and gets the class ready to use for any forms that need to be sent out.\n\n\
    $nonceTracker = new NonceTracker();\n\n**Form Input Validation Overview**\n\n\
    Now that we have a valid form submission, verified through NonceTracker, we can\n\
    \nproceed with a process for validating the form fields. Here is a quick overview\
    \ of proper\n\nform validation. This topic is covered in depth in the next chapter\
    \ but is reviewed here\n\nfor the registration and login processes.\n\nWhen validating\
    \ fields, depending on how the data is to be used, there is at least\n\none important\
    \ factor, type. When validating data for storage in a database, there are\n\n\
    at a minimum, two important factors, type and size. The reason is that type and\
    \ size\n\nmap to the column specification of the table where the data is stored.\n\
    \nTable column specifications are important as table size increases with more\
    \ and\n\nmore records. It is desirable from a performance perspective to always\
    \ be able to fit\n\nas many rows in memory as possible. Column size should match\
    \ expected application\n\ndata sizes for best performance. It is difficult for\
    \ a table to perform best if all data is\n\nVARCHAR of unknown size, or a column\
    \ is set for BIGINT when a value will never\n\nexceed 4 billion. This would waste\
    \ double the space actually used. Fixed size CHAR\n\ncolumns are usually searched\
    \ faster by MySQL, and memory fragmentation is less\n\nwith fixed size CHAR versus\
    \ VARCHAR even if there is some wasted space in the\n\nfixed CHAR column. Computer\
    \ memory likes fixed boundaries. On small tables, it\n\nhardly matters. With millions\
    \ of rows and lots of activity, it may matter a great deal.\n\nThe reason for\
    \ mentioning this is that table column specification and matching\n\nvariable\
    \ types are very important to the foundation of the application and require\n\n\
    thought and planning. Once data and column specification are decided, validation\n\
    \nbecomes clear as the type and size for a variable is now known.\n\nThe following\
    \ demonstrates this notion.\n\nCREATE TABLE products(\n\nproduct_id\n\nINT(11)\
    \ UNSIGNED NOT NULL AUTO_INCREMENT,\n\nproduct_code\n\nCHAR(10) NOT NULL CHARSET\
    \ = latin1\n\nproduct_name\n\nCHAR(50) NOT NULL,\n\nPRIMARY KEY (product_id),\n\
    \nUNIQUE KEY product_code (product_code)\n\n\a) ENGINE = InnoDB DEFAULT CHARSET\
    \ = utf8 COLLATE = utf8_general_ci\n\nThe products table specification tells us\
    \ what is needed for validation.\n\n• product_id is a positive integer with a\
    \ value between 0–4 billion.\n\n• product_code is 10 non-UTF-8 Latin alphanumeric\
    \ character.\n\n• product_name is 50 UTF-8 characters."
