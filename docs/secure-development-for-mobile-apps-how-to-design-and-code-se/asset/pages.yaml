  md: "**218**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nNotice that the\
    \ IV is prepended to the encrypted data. It will be stored together.\n\nFor decryption,\
    \ the IV will be extracted and used as the salt parameter. Remember,\n\nwith CBC\
    \ blocks, the original key and original salt must be used to decrypt the data.\n\
    \nAlso remember that salts do not need to be kept private. Only the secret key\
    \ needs to\n\nremain secret. Taking steps to try and keep the salt a secret are\
    \ not necessary. Salt was\n\nnot designed by cryptographers to be kept secret.\
    \ It was designed to increase the entropy\n\neffectives of the secret key. Keeping\
    \ the salt secret is equivalent to having two secret keys.\n\nIf that case is\
    \ desired, then design for two secret keys, and still retain the public salt.\n\
    \nWith a unique secret key/salt combination per record, if the attacker has the\n\
    \nentire table in his or her possession, the attacker must crack each record individually.\n\
    \nCracking one record reveals nothing about the other records.\n\nIf one secret\
    \ key is used with the same salt for all the records, then the entire table\n\n\
    is treated as a file, and cracking a record reveals the key for cracking the entire\
    \ table or\n\nfile. Using a single key per table with unique salts per record\
    \ increases the randomness\n\nof individuals records. However, because the salts\
    \ are public, cracking the key cracks all\n\nrecords. With the right cipher and\
    \ entropy, cracking a record should be quite difficult.\n\nDepending on the column\
    \ type declared in the sessions table, Base64 encoding\n\nmay not be necessary.\
    \ Base64 essentially makes the encrypted data transportable so\n\nthat any binary\
    \ codes contained do not get misinterpreted. Again, it does not add to\n\nthe\
    \ encryption strength and may not be needed depending on storage type.\n\ndecryptWithUniqueIV() \
    \ Again, there is only one parameter for this function,\n\nthe Base64 encoded,\
    \ encrypted data, $encryptedB64data. So first it needs to be\n\nBase64 decoded.\n\
    \n$data = **base64_decode**($encryptedB64data, true);\n\nThe next step is to obtain\
    \ the encryption key of the correct length from the secret key.\n\n$ke\ay = **mb_substr**\
    \ (**hash**('sha256', $this->sessionKey), 0, $this-\n\n>keySize);\n\nRemember\
    \ from the encryption function that the secret key was hashed\n\nwith SHA256,\
    \ so that needs to be done here are well to end up with the same\n\nresult.\n\n\
    After the Base64 decoding, there are two parts of the encrypted data, the IV,\
