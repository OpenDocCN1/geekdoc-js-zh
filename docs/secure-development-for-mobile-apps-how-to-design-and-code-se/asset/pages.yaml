  md: '**111**


    **UTF-8 for PHP and MySQL**


    **UTF-8 Configuration PHPUnit Testing**


    Below are several methods that can be used to test and confirm the UTF-8 configura­


    tion settings of an application. The points to confirm are that the database is
    set up


    ­correctly to store and retrieve UTF-8 characters, that PHP internally is set
    to ­correctly


    parse UTF-8 strings, and finally that application output is UTF-8 encoded.


    The database testing has two parts: testing the connection parameters, the reported


    database setup, and storing and retrieving Unicode characters. The purpose is
    to verify


    that input is not altered throughout the entire storage and retrieval process.
    This can


    happen if at any point the character sets specified in the connection or storage
    setup,


    either implicitly by default or explicitly, are different. For example, UTF-8
    charac­


    ters from a UTF-8 HTML form are stored in a UTF-8 database, but in a table with


    a default **ISO** 8859-1 column character set. This would ensure that incoming
    data


    would be mangled into something unintended, with the original content lost.


    *Test PHP Internal Encoding*


    The following is a simple PHPUnit assertion test to confirm PHP UTF-8 configuration.


    //retrieve PHP encoding setting and confirm UTF-8


    $this->**assertEquals**("UTF-8", mb_internal_encoding());


    *Test PHP Output Encoding*


    The first example is a PHPUnit assertion test to verify that the output our ­escaping


    function produced is correct. The assertEquals statement contains the actual


    entities that we need to verify.


    //escape string with htmlentities façade which wraps UTF-8 setting


    $result = $obj>htmlEnt($input);


    //test that result is modified with the expected entities


    $this->**assertEquals**("guest&lt;script&gt;alert(''attacked'')&lt;/


    script&gt;", $result);


    The second example here shows testing to ensure the result, and also testing to


    ensure it is not dangerous. There are two parts to testing; asserting for the
    case you


    want, and asserting for the case you do not want.


    //escape a dangerous string to prevent the space


    $result = $obj->urlSafe("http://foo bar/");


    **#1**


    **//test that the result is what we want**


    $this->**assertEquals**("http%3A%2F%2Ffoo+bar%2F", $result);


    **#2**


    **//test that the result is also not equal to what we do not want**


    $this->**assertNotEquals**("http://foo bar/", $result);'
