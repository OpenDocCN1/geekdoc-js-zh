  md: "**364**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*VideoMap URL Table*\n\
    \nThis table holds URLs for insertion into the map and to play a video. The video_msg\n\
    \ncolumn contains an embedded script tag useful for testing, as is demonstrated\
    \ in the\n\nfunctions loadDynamicVideoURL() and loadSafeDynamicVideoURL().\n\n\
    CREATE TABLE IF NOT EXISTS map_video (\n\nvideo_id INT(11) NOT NULL AUTO_INCREMENT,\n\
    \nvideo_url CHAR(80) NOT NULL,\n\nvideo_msg VARCHAR(200) NOT NULL,\n\nPRIMARY\
    \ KEY (video_id)\n\n) ENGINE=InnoDB DEFAULT CHARSET=utf8 AUTO_INCREMENT=1;\n\n\
    //script tag is purposefully inserted along with the data here\n\nINSERT INTO\
    \ map_video(video_url, video_msg)\n\nVALUES ('//www.youtube.com/v/qEYje68Br34',\n\
    \n'Hello, Virtual Reality <script>alert(1);</script>')\n\n**Data Repository Class:\
    \ GMapData**\n\nThis class encapsulates all the database access for saving and\
    \ retrieving markers. All\n\nSQL is consolidated and contained in this class.\
    \ The application calls a public function\n\nwhen it needs data. This makes it\
    \ easier to maintain the SQL, and it makes it easier\n\nto populate output cleanly.\n\
    \nThe constructor makes sure to open the connection as UTF-8.\n\n$this->conn =\
    \ new PDO(\"mysql:host={$host};\n\ndbname={$db};\n\n**charset=utf8\"**,\n\n$user,\
    \ $pass);\n\nThe main functions are getMarkers(), removeMarker(), and insert­\n\
    \nMarker(). Each uses a PDO prepared statement to safely store values into the\n\
    \ndatabase.\n\ngetMarkers() uses a static SQL string to retrieve 20 records from\
    \ the database.\n\nStatic queries, queries with constant values, or queries with\
    \ no parameters do have\n\ntheir place in applications, so this is used as an\
    \ example. In this case there are no\n\nvariables to escape.\n\nremoveMarker()\
    \ and insertMarker() are dynamic queries and do require\n\nfiltering via the prepared\
    \ statement.\n\npublic function removeMarker($lat, $lon)\n\n{\n\n//construct prepared\
    \ statement query string with placeholders\n\n//for $lat and $lon as defined by\
    \ :lat and :lon"
