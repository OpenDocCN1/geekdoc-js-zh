  md: "**32**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nIf an event handler\
    \ is properly quoted, breaking out requires the corresponding quote.\n\nHowever,\
    \ we have intentionally made this rule quite broad because event handler attri­\n\
    \nbutes are often left unquoted. Unquoted attributes can be broken out of with\
    \ many char­\n\nacters including [space]% * +, -/; < = > ^ and |. Also, a </script>\
    \ closing tag will close a\n\nscript block even though it is inside a quoted string\
    \ because the HTML parser runs before\n\nthe JavaScript parser.\n\nRule #3.1—HTML\
    \ Escape JSON Values in an HTML\n\nContext and Read the Data with JSON.parse\n\
    \nIn a Web 2.0 world, the need for having data dynamically generated by an application\
    \ in\n\na JavaScript context is common. One strategy is to make an AJAX call to\
    \ get the values,\n\nbut this isn’t always performant. Often, an initial block\
    \ of JSON is loaded into the page to\n\nact as a single place to store multiple\
    \ values. This data is tricky, though not impossible, to\n\nescape correctly without\
    \ breaking the format and content of the values.\n\n**Ensure returned *****Content-Type***** header\
    \ is application/json and not text/html**.This\n\nshall instruct the browser not\
    \ to misunderstand the context and execute injected script\n\nBad HTTP response:\n\
    \nHTTP/1.1 200\n\nDate: Wed, 06 Feb 2013 10:28:54 GMT\n\nServer: Microsoft-IIS/7.5....\n\
    \nContent-Type: text/html; charset = utf-8 <— bad\n\n....\n\nContent-Length: 373\n\
    \nKeep-Alive: timeout = 5, max = 100\n\nConnection: Keep-Alive\n\n{\"M\aessage\"\
    :\"No HTTP resource was found that matches the request URI 'dev.\n\nnet.ie/api/pay/.html?HouseNumber\
    \ = 9&AddressLine\n\n= T\ahe+Gardens<script>alert(1)</script>&AddressLine2 =\n\
    \nfoxlodge+woods&TownName = Meath'.\",\"MessageDetail\":\"No type was found\n\n\
    that matches the controller named 'pay'.\"} <— this script will pop!!\n\nGood\
    \ HTTP response:\n\nHTTP/1.1 200\n\nDate: Wed, 06 Feb 2013 10:28:54 GMT\n\nServer:\
    \ Microsoft-IIS/7.5....\n\nContent-Type: application/json; charset = utf-8 <—\
    \ good\n\nPHP code:\n\n<?php\n\nheader(\"Content-type:application/json; charset\
    \ = utf-8\");\n\n$output = htmlentities($data, ENT_QUOTES, 'UTF-8');\n\necho json_encode($output);\n\
    \n?>"
