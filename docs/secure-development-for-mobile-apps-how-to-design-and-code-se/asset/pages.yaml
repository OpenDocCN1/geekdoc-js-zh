  md: '**215**


    **Secure Session Storage**


    $this->sessionKey is the secret encryption key, and needs to be set to


    ­adequately long length, and stored in a secure, publicly inaccessible place (obviously


    outside the web root directory).


    $this->cryptCipher has been set to MCRYPT_BLOWFISH.


    $this->$cryptMode set to MCRYPT_MODE_CBC.


    $this->staticSalt was pregenerated using:


    mcrypt_create_iv(mcrypt_get_iv_size(MCRYPT_BLOWFISH,


    MCRYPT_MODE_CBC),


    MCRYPT_DEV_URANDOM))


    mcrypt_create_iv() is a Cryptographically Secure Pseudo Random


    Number Generator (CSPRNG) that creates a very strong initialization vector, or


    salt. The parameters used tell it to create an IV for Blowfish encryption using
    the


    CBC cipher block. This is important. CBC is much stronger that EBC. CBC uses


    salt. EBC does not.


    The other critical parameter is MCRYPT_DEV_URANDOM, which uses the high­


    est source of seed randomness. Random seeding is critical for encryption. MCRYPT_


    DEV_URANDOM should be used as the new best practice instead of MCRYPT_RAND


    or MCRYPT_DEV_RANDOM.


    The IV created is then Base64 encoded for storage in a file. The ­encoding is


    not for  additional security, and adds nothing in terms of security. It ­simply


    makes the  binary bits storable in a file. Because of the Base64 encoding,


    $this->staticSalt must be Base64 decoded before using as a parameter to


    mcrypt_encrypt().


    The encrypted data is also Base64 encoded for safe storage and returned with


    return **base64_encode**($encryptedData);


    It is this data that is saved to the database, and is the data that is saved in
    the


    ­session_data column in the sessions table.


    **Note:**  There are many examples posted on the web that demonstrate encrypting
    with


    EBC using newly generated IV, and then decrypting with a different, newly ­generated


    salt. This is incorrect. The reason this works is that EBC ignores the salt.


    decryptSession() also only takes one ­parameter, $encryptedData. This


    parameter is the data pulled from the ­session_data ­column in the sessions table.


    The first step is to Base64 decode the data, since it was Base64 encoded after


    encryption.


    $encryptedData = **base64_decode**($encryptedB64Data);'
