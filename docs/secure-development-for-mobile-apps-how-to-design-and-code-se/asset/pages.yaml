  md: "**8**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Battle for Output\
    \ Context*\n\nOutput context is the latest general attack vector that needs to\
    \ be defended against.\n\nThe problem of output context is created by the fact\
    \ that output is interpreted and\n\n­processed differently by different display\
    \ engines depending on how the output is\n\n­actually displayed. Is a user-supplied\
    \ URL displayed in the browser as read-only\n\nHTML or as a hyperlink? Will it\
    \ be processed by the JavaScript parser? Getting\n\n­output context correct is\
    \ a big deal. It is so important that it has been explicitly and\n\nthoroughly\
    \ dealt with in the latest O’Reilly book, *Programming PHP*, Third Edition\n\n\
    by Tatroe, MacIntyre, and Lerdorf. This is a big change from the second edition\n\
    \nwhich did not mention this issue at all. Knowing about output context and being\n\
    \naware of where you are displaying user-supplied data is now a requirement for\
    \ proper\n\nweb application security, mobile or desktop. On page 205 of *Programming\
    \ PHP*, a\n\nclass is given that encapsulates code for proper output escaping\
    \ in various contexts.\n\nThe code in this book makes use of that implementation\
    \ for three reasons. One, the\n\nauthors based the code on research and recommendations\
    \ from the collection of\n\n­security minds at OWASP (see http://www.OWASP.org).\
    \ Two, there are a lot of eyes\n\non it, which is a good thing for security. When\
    \ it comes to filtering, it’s always better\n\nto use something with a lot of\
    \ review accountability. Three, the authors made it freely\n\navailable, and encourage\
    \ its use by removing the requirement to ask for permission.\n\nThis book wants\
    \ to take that from the classroom to real application.\n\n*New Technologies HTML5*\n\
    \nHTML5 offers a lot of great new functionality. This means new contexts. The\
    \ impor­\n\ntant thing is that it is necessary to anticipate new, unexplored attack\
    \ vectors. Following a\n\nfew best practices such as implementation of interfaces\
    \ and separation of duty can make\n\nit easier to refactor code for future problems\
    \ when they arise. It’s not a question of *if*.\n\n*Bad Practices Invite Holes*\n\
    \nIt is bad practices that generally lead to security problems. While it would\
    \ be nice to\n\nsay that secure code flows from my fingers, it would not be true.\
    \ Personally, I need\n\nhelp from every tool in this book. The following section\
    \ is a brief overview of the main\n\nhuman issues that contribute to poor security\
    \ development. These are pretty obvious\n\nto most developers, but somehow still\
    \ persist as mental roadblocks to more secure\n\ncode, so they need to be reviewed.\n\
    \n*Security as Add-on*\n\nThis is something that is acknowledged by the industry\
    \ at large. Most development\n\nefforts focus on the features that customers want\
    \ to pay for. Customers usually do not"
