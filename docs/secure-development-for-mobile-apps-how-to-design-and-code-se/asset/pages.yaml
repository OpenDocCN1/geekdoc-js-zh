  md: '**7**


    **Introduction to Mobile Security Development**


    **Evolution of Security Measures**


    Security issues have grown rapidly in the past few years. Previously, when most
    code was


    binary, compiled code from C/C++, the Buffer Overflow attack was the main attack
    vec­


    tor, and developers focused on creating code that ensured data fit within the
    memory buf­


    fer allocated to it. This was basically a simple problem with a simple solution.
    Overflowing


    a buffer is always an input problem, and was, in comparison with today, easier
    to focus on.


    Today, since applications are comprised of web technologies that are interpreted,


    the attack vector has changed to escaping out of the interpreted context. This
    not only


    includes escaping the input context, such as in a SQL injection attack, but also
    escap­


    ing the output context to attack the display context, which can be different depending


    on how it is displayed and whether or not it is active content.


    Code development is notoriously slow to respond. When the Buffer Overflow was


    king, it was around for a while, and developers had more time to understand and


    implement corrections. Today, numerous questions posted on boards show that many


    developers are confused about what exactly they need to filter. Examples range
    from


    questions such as, “What is the difference between the addslashes() function


    and mysql_real_escape_string() function?” “What is the best way to filter


    data?” “Is this filter good enough?” Usually there are a large number of conflicting


    answers; sometimes they are based on opinion, and many times without a definitive


    right answer. This does not help. One example is the answer to the question: “Is
    this


    filter good enough?” The opinionated answer was to “Use a different language.”
    This is


    not a helpful answer, doesn’t answer the question, and points to the fact that
    many


    security problems arise out of lack of understanding. People just want to code.


    *SQL Injection to XSS to CSRF*


    SQL injection was the first major web security problem to surface and it is for
    the most


    part an input attack. Defending against it means escaping the input that goes
    into the


    database via SQL statements. This has led to a major focus on making sure all
    inputs


    to a database are properly filtered. Cross-Site Scripting (XSS) attacks then popped
    up


    and introduced an entirely new security paradigm, attacking the application’s
    output


    context. This is still to be completely understood as developers scramble to catch
    up.


    The problem is compounded by the fact that different output contexts are handled


    by different parsers, therefore filtering becomes more complex and ­demanding.
    The


    introduction of the Cross-Site Request Forgery (CSRF) attack attacks both the
    input


    and output context of an application and so even more consideration has to be
    paid to


    proper filtering, both what kind of filtering and when.


    This has led to the new security development terms: *input filtering*and *output
    escaping*.


    It is important to keep these two terms in mind and to conceptualize their application


    as you develop your code. This mantra is repeated several times. The code in this
    book


    is architected around these two concepts. There are objects that process and filter
    input,


    and objects that process and escape output based on output context.'
