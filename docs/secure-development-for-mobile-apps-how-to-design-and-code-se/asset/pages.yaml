  md: "**94**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nfu\anction _H($output)\
    \ {echo htmlspecialchars($output, ENT_QUOTES,\n\n\"UTF-8\");}\n\n//main PHP logic,\
    \ free from formatting distractions\n\n//\aAt the top of account page, check if\
    \ user is logged in or not\n\n$name = checkLoggedInStatus();\n\ndoStuff();\n\n\
    doMoreStuff();\n\nsaveStuffToDB();\n\n//prepare to enter HTML only…..\n\nprintHTMLHeader();\n\
    \n//End of PHP\n\n//Beginning of HTML Only\n\n?>\n\n<body>\n\n<h1>Private Session\
    \ with HTML code</h1>\n\nHello <?php **_H**($name); ?>,\n\n<br>\n\n<a href = \"\
    editAccount.php\">Edit Account</a><br/>\n\n<a href = \"logout.php\">Logout</a>\n\
    \n</body>\n\n</html>\n\nHere is almost complete PHP and HTML separation. In this\
    \ example, two tech­\n\nniques are used. The printHTMLHeader() functions uses\
    \ a heredoc for a reusable,\n\nstatic header function that should begin the output\
    \ of every page. Second, the remain­\n\ning HTML page itself is outside the PHP\
    \ tag, and so it is not being interpreted by the\n\nPHP engine, allowing clean\
    \ formatting without the clutter of echo and print()\n\nstatements. This makes\
    \ it much easier to manipulate code without interfering with\n\nHTML layout. An\
    \ interface designer can make changes to the HTML easily and\n\nwithout bother\
    \ to the developer. It is easy to spot that the user name is escaped real\n\n\
    time out into a pure HTML context and not a URL context.\n\n**Best Practices Tips**\n\
    \n*Use Integer Values as Much as Possible*\n\nTo the extent possible, make use\
    \ of integer values as data. Clearly name them so that\n\ntheir usage is clear.\
    \ Validating numbers is easy and queries run faster if you have well-\n\nindexed\
    \ columns making use of an integer ID. An example is:\n\nprepare(“SELECT name,\
    \ email FROM users WHERE id = :id”);\n\nbindValue(‘:id’, $id, PDO::PARAM_INT);\n\
    \nNot all queries can be based on IDs alone, but many can if designed well.\n\n\
    Eliminating as many string-based queries as possible helps with both the speed\
    \ and\n\nsecurity of an application."
