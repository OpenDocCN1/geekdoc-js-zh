  md: "**132**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nBy default, PDO\
    \ returns records as both an associative array and an indexed\n\narray. By only\
    \ using associative, some memory is saved. The exception handler\n\nfirst  logs\
    \ a detailed error message to the log file, and then redirects users to\n\na generic error\
    \ page informing them that the service is temporarily down. Users\n\nneed to be\
    \ informed as to what is going on with the service, just not any details\n\nabout\
    \ it.\n\n**MySQL UTF-8 Database and Table Creation Support**\n\nDesigning a database\
    \ to hold UTF-8 characters is essential. The following examples\n\nshow the MySQL\
    \ syntax for UTF-8 database and table creation.\n\nTo create a UTF-8 database:\n\
    \nCREATE DATABASE users CHARACTER SET utf8 COLLATE utf8_general_ci\n\nTo create\
    \ a UTF-8 table:\n\nCREATE TABLE 'members' (\n\n'member_id' **int**(11) UNSIGNED\
    \ NOT NULL auto_increment,\n\n'name' varchar(255) CHARACTER SET utf8 NOT NULL\
    \ default'',\n\n'email' varchar(255) CHARACTER SET utf8 NOT NULL default'',\n\n\
    'activation_dt' TIMESTAMP NOT NULL default CURRENT_TIMESTAMP,\n\nPRIMARY KEY ('member_id'),\n\
    \nUNIQUE KEY 'email' ('email'))\n\nENGINE = INNODB DEFAULT CHARSET = utf8 COLLATE\
    \ = utf8_unicode_ci;\n\nTo alter an existing table for UTF-8:\n\nALTER TABLE members\
    \ CONVERT TO CHARACTER SET utf8\n\n**Performance note:** InnoDB keeps indexes\
    \ in separate files. UTF-8 consumes\n\nmore  space because it uses more bytes.\
    \ This can affect both record size and\n\nindex size. Smaller indexes and smaller\
    \ records equal more data in memory and\n\nfewer disk seeks. If you know you have\
    \ a high performance need and that the\n\ndata (catalog data is an example) will\
    \ always only ever have Latin characters, then\n\nset the column type to Latin1\\\
    . It consumes less space and therefore consumes less\n\nmemory.\n\nBelow is an\
    \ example of dual character sets:\n\nCREATE TABLE catalog (\n\ndesc **VARCHAR**(40)\
    \ CHARACTER SET utf8,\n\ntitle **VARCHAR**(20) CHARACTER SET latin1 COLLATE latin1_general_cs,\n\
    \nPRIMARY KEY (title))\n\nENGINE = InnoDB;"
