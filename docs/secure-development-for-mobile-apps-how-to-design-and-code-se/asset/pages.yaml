  md: "**20**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*POST Requests*\n\
    \nFor this example, the $_POST request does indeed contain a string, a user name.\n\
    \nThe question then becomes what is this string for and where does it go? The\
    \ string is\n\nto be stored in the database, queried from the database, and sent\
    \ back to the client as\n\nstatic HTML, not as a hyperlink. This tells us the\
    \ steps we need to take in processing\n\nthis input variable.\n\nAssuming both\
    \ PHP character set and PDO connection character set are both\n\nUTF-8, we can\
    \ operate on our string.\n\nThe first step is to cut it. Our database column has\
    \ a limit of 25 characters for\n\nthe username.\n\n$userName = \amb_substr($_POST['name'],\
    \ 0, 25);//make required length\n\nThe second step is to ensure it is only alpha-numeric.\n\
    \nif(ctype_alnum($userName))//only allow letters and numbers\n\n{\n\nThe third\
    \ step is to prepare it for storage in the database.\n\n$userName = $db->quote($userName);//escape\
    \ for db via PDO\n\n}\n\nelse\n\n{\n\necho \"user name is invalid\";\n\n}\n\n\
    The fourth step is to echo the variable out in a manner safe for the output context\n\
    \nof static HTML.\n\nech\ao(htmlentities($userName, ENT_QUOTES, \"UTF-8\"));//safe\
    \ for HTML\n\nIn step one, we cut our string to fit our database column. One benefit\
    \ of this is that\n\nit makes other filters run as fast as possible by not sending\
    \ them potentially large\n\nstrings. If you know that a string has limits, enforce\
    \ that size limit before other\n\nfiltering.\n\nIn step two, we are ensuring that\
    \ all characters in the input variable are either\n\ncharacters or digits. If\
    \ they are, then we keep the variable, if not, we set it to null and\n\nflag an\
    \ error.\n\nIn step three, we are manually quoting a string in preparation for\
    \ sending to the\n\ndatabase. We are using the PDO method instead of mysql_real_escape_\n\
    \nstring() which, along with all the rest of the mysql() functions, has been\n\
    \nreplaced with PDO and MySQLi database libraries. The rest of this book uses\
    \ PDO\n\nexclusively for all database access."
