    \nmb_substr_count()\n\nsplit()\n\nmb_split()\n\nhtmlentities($output)\n\nhtmlspecialchars($output)\n\
    \nhtmlentities($output,ENT_QUOTES,'UTF-8')\n\nhtmlspecialchars($output,\n\nENT_QUOTES, 'UTF-8')"
