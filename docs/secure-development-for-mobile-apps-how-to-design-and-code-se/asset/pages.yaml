  md: "**88**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nDangerous—allows\
    \ HTML attribute manipulation:\n\n**strip_tags**($html, \"<strong>\");\n\nUseful\
    \ on well formed HTML:\n\nstrip_tags($html);\n\nWell formed does not mean safe.\
    \ Well formed simply means the HTML is for­\n\nmatted correctly. Even attack strings\
    \ can be formatted correctly. The danger is when\n\nattack strings are not well\
    \ formed in order to evade filtering. This is where strip_\n\ntags() can come\
    \ up short and should not counted on.\n\nThe best use of strip_tags() is for helping\
    \ remove HTML from input for a\n\nbusiness reason, not for a security reason.\n\
    \n*Mobile Functions*\n\nOutput buffering and output compression seem to be little\
    \ known capabilities of PHP.\n\nThey compress the output of a script in real time,\
    \ and send fewer bytes to the client.\n\nThis is beneficial to any web application\
    \ client, but in particular it benefits mobile ­clients\n\nwho sometimes suffer\
    \ under low bandwidth conditions, or pay for bandwidth consumed.\n\nThe benefit\
    \ is fewer bytes sent to client. Negatives are increased CPU usage on the server,\n\
    \nand possible increase in output delay time. Tests need to be performed to confirm\
    \ whether\n\noutput buffering and compression work in your particular environment.\n\
    \nzlib.output_compression The default value is Off. Turn compression on with\n\
    \nthe following setting in php.ini.\n\nzlib.output_compression = on\n\nThis causes\
    \ every web page output by PHP to now be compressed before sending to\n\nthe client.\
    \ The web browser will now have to decompress the results.\n\nThe other PHP directive\
    \ affecting compression is the compression level. To adjust\n\nthe compression\
    \ level, set the following line in php.ini. Valid values are between 1 and\n\n\
    9\\. 1 is least compression and 9 is highest compression. The default compression\
    \ level is\n\nset at 6 and provides the best compression before degrading server\
    \ performance with\n\nextra CPU demands.\n\nzlib.output_compression_level = 6\n\
    \nRestart Apache HTTPD server after the changes are made.\n\nob_start()/ob_flush()\
    \ *Functions * Turn on output buffering with ­compression,\n\nand then flush the\
    \ entire contents to be sent over the web. See example below."
