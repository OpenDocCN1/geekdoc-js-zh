    \ Here</a>\";//output dbl\n\nencoded link\n\n}\n\n?>\n\n*Rule #6—Sanitize HTML\
    \ Markup with a Library Designed for the Job*\n\nIf your application handles markup—untrusted\
    \ input that is supposed to contain\n\nHTML—it can be very difficult to validate.\
    \ Encoding is also difficult, since it would\n\nbreak all the tags that are supposed\
    \ to be in the input. Therefore, you need a library that\n\ncan parse and clean\
    \ HTML formatted text. The ones available for PHP are:\n\nPHP Encoder class from\
    \ *Programming PHP*, Third Edition, (Tatroe, MacIntyre,\n\nand Lerdorf 2013)\n\
    \nZend Framework Escaper class from Zend Framework at http://framework.zend.com.\n\
    \nhtmlPurifier\n\nBoth of these classes have functions to escape output for the\
    \ required context. The best\n\npart is that both do a very good job of specifically\
    \ naming the functions for the appropri­\n\nate output.\n\nFor straight PHP, to\
    \ escape a value for use in CSS:\n\n<?php\n\n$encoder = new Encoder;\n\n$cssValue\
    \ = $encoder-> encodeForCSS($_GET['name']);\n\n?>\n\nFor Zend Framework, to escape\
    \ an HTML attribute:\n\n<?php\n\n$escaper = new Zend\\Escaper\\Escaper('utf-8');\n\
    \n$attributeValue = $escaper->escapeHtmlAttr($_GET['name']);\n\n?>"
