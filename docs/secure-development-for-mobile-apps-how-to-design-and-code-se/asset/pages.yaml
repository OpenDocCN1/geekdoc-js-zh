  md: '**377**


    20


    Twitter Authentication


    and SSL cURL


    The purpose of this chapter is to introduce code that safely and securely retrieves
    and


    displays data from the Twitter service. There are two aspects to this process.
    One is the


    more obvious treatment of untrusted data, even when it comes from a trusted source.


    The second is to securely call the service. This is a commonly forgotten procedure,
    and


    its omission is called a *security downgrade*. This idea was addressed in *AJAX
    Security*


    (Hoffman and Sullivan 2007). This idea recognizes the fact that while a user may


    securely login, subsequent data requests are fetched insecurely using either clear
    text


    calls or non-verified encrypted calls, which compromises security, trust, and
    data integ­


    rity. A user has the reasonable expectation that security is enforced across the
    entire


    communication chain. It is the responsibility of a developer to deliver that expectation.


    Encryption by itself simply prevents the reading of the data by a party without


    the key. It does not ensure whom the encrypted data is from or guarantee that
    the


    contents are correct. SSL verification solves this problem by verifying the legitimacy


    of the service endpoint being connected to. It is critical to ensure SSL verification
    to


    avoid inadvertent security downgrade situations. In PHP, and in this case, this
    means


    ensuring the SSL verification options for cURL are set correctly.


    Familiarity with Twitter is assumed and no effort is made here to explain Twitter.


    Secure techniques for handling Twitter data safely for users is shown here. These
    tech­


    niques should still be applicable even as Twitter changes, which it will. They
    should


    also be applicable to other third-party services that use oAuth and HTML feeds.


    The basic principles will apply for using cURL securely and filtering data safely.


    **Twitter v1.1 via PHP**


    With Twitter API v1.1, oAuth authentication is mandatory for every request made


    to the Twitter service. There are two types of Twitter API authentication—account


    authentication and application authentication. This example demonstrates using
    appli­


    cation authentication to obtain tweets and is a four-step process.


    *Step 1: Create a Twitter Application*


    First, register/login to Twitter at https://dev.twitter.com/apps and create a
    new


    application. After filling out the required fields, Twitter will generate the
    required


    application key, and application secret for you. These are the credentials you
    will use'
