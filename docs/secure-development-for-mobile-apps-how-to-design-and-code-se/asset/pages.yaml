    \ Mail*\n\nTo accommodate UTF-8 in email, both the email header and subject have\
    \ to be\n\naccounted for.\n\nFirst, specify the content type of the email with:\n\
    \nContent-Type: text/plain; charset = utf-8\n\nSecond, the subject line of an\
    \ email is also a header. Headers must contain only\n\nASCII characters. RFC 1342\
    \ is the recommendation that provides a method to\n\n­represent ­non-ASCII characters\
    \ inside email headers which email servers will parse\n\ncorrectly.\n\nTo correctly\
    \ encode a header for URF-8, the following format is required.\n\n**= ?charset?encoding?encoded-text?\
    \ =**\n\nCode usage example:\n\n**= ?utf-8?Q?Hello? =**\n\nThe encoding must be\
    \ either B or Q. B means Base 64 encoding. Q means quoted-\n\nprintable. See the\
    \ RFC 1342 document for additional details.\n\nBelow is a code sample of PHP’s\
    \ mail() function to send an email using UTF-8\n\ncontent in both the subject\
    \ header and content.\n\n$to = 'user@mobilesec.com';\n\n$subject = 'Subject with\
    \ UTF-8 你好';\n\n$message = 'Message with UTF-8 你好';\n\n$headers = 'From: admin@mobilesec.com'.\"\
    \\r\\n\";\n\n$headers. = 'Content-Type: text/plain; charset = utf-8'.\"\\r\\n\"\
    ;\n\nm\aail($to, ' = ?utf-8?B?'.base64_encode($subject).'? = ',\n\n­$message,\
    \ $headers);\n\n**Note:**  mail(), set up this way, seems to work more reliably\
    \ than mb_send_mail();."
