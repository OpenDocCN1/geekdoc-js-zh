  md: '**xv**


    **Foreword**


    The Web has grown to nearly one billion websites, and according to multiple sources,


    roughly three-quarters are built using at least some amount of PHP. That’s a stag­


    gering level of success for any programming language. Even more impressive is
    who


    is using PHP. The list includes some of the most popular websites and recognizable


    brands including Yahoo, Facebook, Wikipedia, Apple, Flickr, and just about every


    blog. Here’s the problem: Nearly every one of these one billion websites, and
