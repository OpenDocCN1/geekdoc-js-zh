  md: "**386**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nAfter sending the\
    \ tweet with the ENT_SUBSTITUTE flag, all the data in the text\n\nwill be UTF-8\
    \ compliant. Invalid characters have now been replaced with a valid\n\nU+FFFD\
    \ character.\n\nNow that the individual text characters are validated, they can\
    \ be processed for\n\nlinks. The first step is to explode the text into an array\
    \ of individual words. This is done\n\nwith PHP explode().\n\n$textSplit = **explode**(\"\
    \ \", $linkText);\n\nA foreach loop is set up to iterate the entire array and\
    \ process each element as either\n\ntext or a link.\n\n**foreach**($textSplit\
    \ as $word)\n\n{\n\nThe first regular expression applied is to test for a URL\
    \ link. If it is a properly\n\nformed URL, with the allowed protocols, it is broken\
    \ up into its individual parts with\n\nparse_url().\n\nif(**preg_match**($regExUrl,\
    \ $word, $fullURL))\n\n{\n\n$paramArray = **parse_url**($fullURL[0]);\n\nHere\
    \ we break out and collect the individual URL elements so that each part is\n\n\
    known, the HTTP scheme, which will be HTTP, HTTPS, FTP, or FTPS, the host\n\n\
    name, and the path. By breaking these out, if any other processing needs to be\
    \ done,\n\nthe parts are now available.\n\n$urlSchemeSAFE = $paramArray['scheme'];\n\
    \n$urlHostSAFE\n\n= $paramArray['host'];\n\nIf GET parameters exist within the\
    \ given URL, these will be parsed out into their\n\nown array, accessed using\
    \ ['query'] index.\n\nif(**isset**($paramArray['path']))\n\n$urlPathSAFE = $paramArray['path'];\n\
    \nThe query parameters are properly sanitized using urlencode().\n\nif(isset($paramArray['path']))\n\
    \n$urlQuerySAFE = **urlencode**($paramArray['query']);\n\nThen all the URL parts\
    \ are reassembled if present.\n\n$urlSAFE = $urlSchemeSAFE.\"://\".$urlHostSAFE;\n\
    \nif($urlPathSAFE)\n\n$urlSAFE. = $urlPathSAFE;"
