    \n*Cross-Site Scripting*\n\nThe next big web application security hole is Cross-Site\
    \ Scripting (XSS). This attacks\n\nthe output of the application. It depends on\
    \ how you display your data and what\n\nengine is rendering that display. This\
    \ kind of attack represents an entire paradigm\n\nshift in security thinking,\
    \ forcing developers to realize an entirely new attack surface\n\nand to pay attention\
    \ to all the places data is displayed.\n\nXSS works by tricking the HTML parsing\
    \ engine of a browser to execute code\n\nwhen it should be simply displaying data.\
    \ A simple example is a GET request struc­\n\ntured as below,\n\nhttp:\a//www.mobileapp.com/page.html?name=\"\
    guest<script>alert('attac\n\nked')</script>\"\n\nwhere JavaScript is inserted\
    \ as part of the name variable. If the server code simply\n\noutputs the ‘name’\
    \ variable,\n\n<?php\n\necho $_GET['name'];\n\n?>\n\nthen the script is reflected\
    \ back to the user’s browser and JavaScript contained in the\n\n<script> tag is\
    \ executed inside the user’s browser."
