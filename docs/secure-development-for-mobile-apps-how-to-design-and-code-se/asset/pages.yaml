    \n<ul id = \"tweets\" class = \"tweets\">\n\n<?php\n\n//dislay tweets\n\n**foreach**($tweets\
    \ as $tweet){\n\n//format tweets with safe HTML and activated URLS\n\n$tweetHTML\
    \ = processTweet($tweet->text);\n\n?>\n\n<li class = \"tweetItem\">\n\n<?p\ahp\
