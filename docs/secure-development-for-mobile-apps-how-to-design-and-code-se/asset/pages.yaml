    **Secure Form Landing Pages Are over SSL**


    Step one in providing for secure transmission of private user data is to ensure
    that


    the connection is secured through encryption and identification. SSL provides
    both.


    This code ensures that all requests are over SSL. If the original request was
    over


    SSL, then the request proceeds. If not, then the request is redirected to an SSL


    ­connection. This ensures safe communication of all form data between the client


    browser and the server. This code is included at the top of every form that requires


    secure communication.


    if(empty($_SERVER[''HTTPS'']))


    {


    header("HTTP/1.1 301 Moved Permanently");


    header("Location: ". SECUREAPPPATH. $_SERVER[''REQUEST_URI'']);


    exit(); //exit and prevent further processing of the script


    }


    The server variable $_SERVER[HTTPS] is checked at being set, and if it is not,


    then a header is set indicating a permanent page move and a second header perform­


    ing the actual redirect to an SSL connection for the requested page.


    **Secure Form Nonce—Prevent CSRF**


    A second necessary step in protecting the server application from dangerous input
    is to


    ensure that the HTML form submission containing the incoming data actually came


    from the server over a valid session in the first place. Two questions should
    be asked


    when inspecting form data. Did this form come from this server, and was this form


    requested by a user with an active session on this site?


    Not checking whether forms were actually requested from the server is the basis


    for Cross Site Request Forgery attacks, (XSRF or CSRF). The basis of this attack
    is


    tricking users with an open session and forging form data on their behalf. The
    way'
