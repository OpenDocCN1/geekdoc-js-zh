    **UTF-8 for PHP and MySQL**


    To create a database:


    CREATE DATABASE DatabaseName (


    CHARACTER SET


    utf8


    DEFAULT CHARACTER SET


    utf8


    COLLATE


    utf8_general_ci


    DEFAULT COLLATE


    utf8_general_ci;


    To create a table:


    CREATE TABLE TableName (


    id


    INT UNSIGNED NOT NULL AUTO_INCREMENT,


    user VARCHAR(20) DEFAULT NULL


    )


    PRIMARY KEY(id))


    ENGINE = InnoDB DEFAULT CHARACTER SET = utf8 COLLATE utf8_general_ci;


    To alter an existing database:


    ALTER DATABASE DatabaseName


    CHARACTER SET


    utf8,


    DEFAULT CHARACTER SET


    utf8,


    COLLATE


    utf8_general_ci,


    DEFAULT COLLATE


    utf8_general_ci;


    To alter an existing table:


    ALTER TABLE TableName


    DEFAULT CHARACTER SET


    utf8,


    COLLATE


    utf8_general_ci;


    **Performance Note:** Creating a column as UTF-8 increases the size requirements


    needed for storing Unicode characters. This can potentially be three to four times


    the size needed for ASCII storage and can be very important if the table grows


    larger or speed becomes an issue. If a column is indexed, the amount of index


    information that can be fit into a page of memory can become important. Fewer


    records in memory mean more trips to the hard drive for lookups, slowing perfor­


    mance. This should not be an immediate concern. However, if you know that the


    data you are storing will always be ASCII, then constructing the table to accom­


    modate ASCII can result in faster indexing and lookups with a smaller footprint.


    For example, a table of product information with a quick lookup requirement that


    is guaranteed to always be in English would be a candidate as an ASCII only


    table. A comments table for global users would of course need to accommodate


    non-ASCII characters whereby we are back to why we are building a complete


    UTF-8 application. Again, because UTF-8 is transparent to the core ASCII/Latin'
