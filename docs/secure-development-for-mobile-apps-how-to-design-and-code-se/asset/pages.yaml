    Insert order


    into the database


    AND


    Send conﬁrmation


    page


    Resubmits


    POST request


    User refreshes page.


    User ﬁlls out order


    form.


    Your order


    was


    successful


    **Figure 16.1 ** Public Diagram from WikiPedia. (From Quilokos, Licensed under
    Wikimedia Commons, a freely licensed


    media file repository.)'
