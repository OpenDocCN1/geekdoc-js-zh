  md: "**189**\n\n**Secure Session Management**\n\nunset() has no effect on a browser’s\
    \ cookie. Again, there is no direct way to cause a\n\nuser’s browser to delete\
    \ data. Cookies can only be properly expired. Setting the expi­\n\nration to zero\
    \ does not guarantee when the browser closes, so the length of time the\n\nbrowser\
    \ remains open equals the length of time the cookie remains valid. Setting an\n\
    \nexpiration time an hour or two in the past does not account for time zone differences\n\
    \nand cannot guarantee expiration.\n\n*Use Only Cookies for Session ID Transmission *\
    \ Using only cookies to transmit session ID\n\nis important because when transmitted\
    \ via a URL parameter, GET requests can be\n\nstored in browser history, browser\
    \ cache, and browser bookmarks. This makes the\n\nsession ID easily viewable by\
    \ others, which should be avoided. If this occurs and ses­\n\nsions are not time\
    \ expired, then risk of theft increases.\n\n*Setting Configuration and Setup*\n\
    \nThe table below shows stronger security settings for the session management\
    \ func­\n\ntions in place of the default settings. Use this as a baseline setting.\n\
    \nDIRECTIVE\n\nLOCAL VALUE\n\nMASTER VALUE\n\nsession.cookie_domain\n\nNo value\n\
    \nNo value\n\nsession.cookie_httponly\n\nOn\n\nOn\n\nsession.cookie_lifetime\n\
    \n0\n\n0\n\nsession.cookie_path\n\n/\n\n/\n\nsession.cookie_secure\n\nOff\n\n\
    Off\n\nsession.entropy_file\n\n/dev/urandom\n\n/dev/urandom\n\nsession.entropy_length\n\
    \n1024\n\n1024\n\nsession.hash_bits_per_character\n\n6\n\n6\n\nsession.hash_function\n\
    \nsha256\n\nsha256\n\nsession.name\n\nAPPNAME\n\nAPPNAME\n\nsession.save_handler\n\
    \nfiles\n\nfiles\n\nsession.save_path\n\n/app/sessions\n\n/app/sessions\n\nsession.use_cookies\n\
    \nOn\n\nOn\n\nsession.use_only_cookies\n\nOn\n\nOn\n\nsession.use_trans_sid\n\n\
    0\n\n0\n\n*Secure Session Management * The following function configures the session\
    \ and cookie\n\nsettings for HTTP only, secure over SSL, session hash and bit\
    \ level, and cookie lifetime.\n\nfunction beginSession()\n\n{\n\n//set the hash\
    \ function.\n\nini_set('session.hash_function', sha256);\n\n//s\aet bit levels\
    \ = '4' (0-9, a-f), '5' (0-9, a-v), and '6'\n\n(0-9, a-z, A-Z, \"-\", \",\")\n\
    \n//avoid level 4, user 5 or 6\n\nini_set('session.hash_bits_per_character', 5);"
