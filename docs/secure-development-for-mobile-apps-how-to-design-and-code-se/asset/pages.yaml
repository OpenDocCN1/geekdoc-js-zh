    **PHP Essential Security**


    *Error Logging Process Pattern*


    The logging system is very important. The location of the log file is important.


    It should be outside of the web root as well. The logging system should record


    the  kind of error in a meaningful manner, the file, and line number of where


    it occurs.


    *Authentication Pattern*


    Authentication is also a part of every application that maintains user accounts.
    This


    is a critical system as well and one that should not be completely reinvented
    for every


    application. Even if the HTML interface changes the look and location of the user­


    name and password form, the essential handling of logging in, authenticating the


    password, storing the password, handling the session cookie, logging out, and
    clear­


    ing the cookie should be consistent across your applications.


    *Authorization Pattern*


    Authorization is an additional security step that has to be specifically employed.


    This step is a two-factor process that helps ensure that someone knows what


    he/she should know. It is not enough that a page request include an active,


    ­authenticated cookie. This cookie could be stolen. High-risk requests such as


    changing account ­information like a password, or making a purchase need an


    additional piece  of  ­information, for example, re-verifying the user’s password.


    Asking that this step be completed each time a high-risk request is made helps


    ensure that ­automated ­methods of impersonation are greatly reduced. Therefore,


    logic needs  to  exist  that  helps  ­distinguish and direct high-risk requests
    to the


    authorization function.


    *White Listing Acceptable Input*


    Data that is needed will vary greatly between applications, but there should be


    logic that helps consolidate, identify, and look up the application’s “acceptable”


    data. Examples of this would be acceptable colors a user could choose, or a list
    of


    table columns a user could search from. A white list of acceptable terms helps
    keep


    your internal data clean and free from injection. Using a white list is a powerful


    ­mechanism that lets users choose without being able to inject. Part of your design


    process should be identifying a list of ranges, choices to the extent possible,
    and


    presenting those choices to the user. The processing of a white list selection
    always


    occurs through a lookup table and never uses direct input. If direct input does
    not


    match the lookup, the input is discarded. Via this mechanism, injection of any
    kind


    is blocked.'
