  md: '**5**


    **Introduction to Mobile Security Development**


    *Prerequisite Technologies*


    The languages and techniques used in this book are PHP, MySQL, HTML,


    CSS, JavaScript, jQuery. Software disciplines presented are UML, Gang of Four’s


    23 Design Patterns, Object-Oriented constructs, Agile processes, and Test Driven


    Development with PHPUnit. Familiarity with these technologies is ­assumed. While


    this is not a beginner’s guide to programming, and no time is spent ­explaining
    basic


    principles, if you’ve spent at least some time developing with PHP and MySQL,
    you


    should not have trouble following along. If any ­additional background information


    is needed, please see the recommended book list in the References. The ­purpose


    of this book and the examples given are designed to be a next step from those


    books.


    *Applying Architecture Tools to Security*


    Object-oriented constructs and software design patterns offer a lot to the realm
    of


    secure development. While other books provide examples of the problems in other


    domain spaces solved with these tools, we’ll look at how to apply these tools
    to a


    secure development process. Singleton patterns and abstract inheritance are two


    powerful mechanisms to control access to data that needs to be secured. Factories


    and Builder patterns are useful for creating the correct input processing objects


    needed for an incoming request. Template patterns are a way to enforce a par­


    ticular set of steps every time. This is a tool that that can be put to good use.


    Interfaces and Façade patterns isolate functionality so that filter functionality
    can


    be ­easily updated without upsetting the rest of the application. Testing methodolo­


    gies, ­specifically Test Driven Development, since you write a test first, then
    write


    code to pass the test, help ensure that security is dealt with at the very beginning


    of a project.


    *Creating Consistent Reusable Code from Project to Project*


    Applications—mobile, desktop, or server—almost always have several parts, both
    in


    code and file structure, that are the same for each project. This book outlines
    a reus­


    able structure for the PHP, HTML, CSS, JavaScript, jQuery, and MySQL Database


    files for both the server side application and the mobile client application which
    can


    be the starting point for any project.


    **Mobile Application Using HTML5, AJAX, and jQuery Mobile**


    While the server side of the project uses PHP and MySQL, the mobile client applica­


    tion is constructed with HTML5, CSS, JavaScript, and the jQuery Mobile library.


    This gives us the ability to create a very flexible app that can run on many devices


    including Android and iPhone.'
