- img_proc: true
  md: "**117**\n\n**Project Layout Template**\n\n*Core PHP Files Outside of Web Root *\
    \ Main PHP files, like the database file which\n\n­contains the application’s\
    \ SQL statements, and the login file are also good files to place\n\noutside of\
    \ the main web root.\n\nKeep the number of files that are publicly accessible\
    \ to a minimum. Keep the core\n\nof your processing logic outside of the web root.\
    \ Use the index file as a gateway to\n\naccessing support files. This always then\
    \ gives the developer direct control over file\n\naccess. By using gateway files,\
    \ users are prevented from accessing core files directly. For\n\nexample, the\
    \ database.php located in the include directory cannot be called directly.\n\n\
    This prevents accidental misuse simply because a user has database.php as a URL\n\
    \nin their browser history. The file database.php should never be a URL. Gateway\
    \ files,\n\nsuch as index.php and login.php prevent this from happening. The only\
    \ files that users\n\nshould ever see as URLs are files like index.php, main.php,\
    \ and public.php.\n\n*A PDO DB Access Class Template * A PDO template class is\
    \ included in the project\n\nlayout files. It contains the base code to correctly\
