  md: '**187**


    **Secure Session Management**


    As long as a session is regenerated when a user authenticates with a password,
    or on


    privilege elevation, the application should be secure from session theft. Especially
    if


    session IDs are only accessed via SSL and HTTP headers. If cookies are transferred


    over HTTP and HTTPS, the more frequent regenerations are advisable since the


    cookie is transferred in the clear and susceptible to interception.


    *Always Regenerate a Session ID on Privilege Elevation * This is a very important
    check


    for an application to make. Whenever an important action is taken such as altering


    account data, steps need to be taken to have the user re-authenticate over an
    SSL


    connection, and the session ID must be regenerated, with the old one invalidated


    and destroyed. Amazon is an example of double checking a user’s credentials when


    making a purchase. Even if a user is logged in, when accessing account information,


    a request for password verification is made. This prevents an attacker who stole
    a


    cookie from accessing data, from changing data, like a person’s email or password,
    or


    from making a purchase. Once the password verification succeeds, a new session
    ID


    is created and the old session is invalided, and an attacker is either logged
    out or the


    window of opportunity for theft of the old session ID is closed.


    *Store All Session Data in Server Session Array Only * This is a heated topic.
    Some people


    believe a strongly encrypted cookie is secure, and some do not. It seems to be
    a ­matter


    of pride to build an uncrackable cookie. Resist the temptation. Store user data
    in session


    storage and let the server protect it. At the very least, this practice reduces
    the threat to a


    single vector, validating or invalidating the session ID in the cookie and not
    the contents.


    *Make Logout Option Available on Every Page * Time is the friend of an attacker.
    The lon­


    ger a session is valid, the higher the threat of theft. On the client side, it
    should be easy


    for users to log out at all times. Every page should contain a logout link. This
    is very


    critical to the protection of the account. Users may be logged into their account
    with


    a browser they do not own. In this case, leaving valid session cookies on this
    browser


    would compromise their account. They should be able to plainly log out of their
    account


    and know for certain that their data is removed and their account is protected.


    *Upon Logging Out, Explicitly Destroy All User Session Data on the Server * On
    the server


    side, logging out should explicitly and completely destroy the session and all
    data in


    order to eliminate the threat of session ID theft.


    *Force Expiration of Session Cookies on the Server * By default, cookies are set
    to expire


    when the browser is closed. Obviously, there is no way to know when that will
    hap­


    pen. Users may close a window, thinking that they have closed the app, but the
    session


    cookie remains. The only way to delete a cookie is to expire it. A common practice
    is


    to set the cookie to expire 60 minutes in the past. However, that is no guarantee
    of


    expiration. Different time zones affect expiration times. Setting a cookie to
    expire'
