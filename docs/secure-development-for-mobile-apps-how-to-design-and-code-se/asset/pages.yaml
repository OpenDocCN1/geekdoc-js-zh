  md: "**10**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n**A New Mindset for\
    \ Web Application Security**\n\nWhen it comes to thinking about defensive security\
    \ programming in PHP, it helps\n\nto first address some common misconceptions,\
    \ and then adopt some new thoughts\n\nabout the actual problem domain space of\
    \ correct PHP/MySQL/HTML/JavaScript\n\ndata processing.\n\nSome common notions\
    \ floating around the net are:\n\n• This variable is “safe” because strip_tags()\
    \ cleaned it.\n\n• This input is “clean” because mysql_real_escape_string (addslashes​\n\
    \n(strip_tags())).\n\n• This is “safe” because SQL injection was prevented.\n\n\
    These assumptions are misleading at best and deceptive at worst because they are\
    \ not\n\nadequately addressing the problems or offering the proper remediation.\
    \ This ­negatively\n\naffects design and coding decisions.\n\nSecurity does not\
    \ mean completely safe. It means steps were implemented to add\n\nprotection,\
    \ making a breach more difficult. The word *secure* does not mean *cannot be*\n\
    \n*broken into ever*. Instead, it means *not wide open*. It means that processes\
    \ have been put\n\ninto place to reduce threat levels and increase protection.\
    \ These processes don’t make\n\na program completely tamper proof.\n\nConsider\
    \ adopting a new mindset regarding this problem space. Instead of thinking\n\n\
    “clean, safe, and done,” think “reducing attack vectors,” “reduced threats,” “less ­vulnerable,”\n\
    \nand “higher degrees of protection.” These are more accurate ­descriptions of\
    \ the defense\n\ndesign process and implementations. This is more helpful to the\
    \ ­programming mind­\n\nset. Using prepared statements for database queries, not\
    \ storing passwords, but instead\n\nencrypting and then storing password hashes\
    \ greatly raises the security safety bar with\n\nmuch higher degrees of protection.\
    \ Changing the way GET is processed can usually\n\nreduce the number of attack\
    \ vectors so the app is less vulnerable.\n\nThe battle of web security centers\
    \ largely around the battle of escape characters.\n\nThe problem is that escape\
    \ character interpretation changes depending on the parsing\n\nengine currently\
    \ engaged. Every web application consists of several parsing engines,\n\nthe PHP\
    \ engine, the MySQL parser, the browser HTML parser, and the browser\n\nJavaScript\
    \ parser. The data is constantly going in and out of all of them.\n\nWeb exploits\
    \ are technical exploits, so to defend against them requires one to be\n\ntechnically\
    \ correct. PHP by nature is loose regarding type specificity, and it is not very\n\
    \npedantic. In order to be specific with regard to type, there is a need to be\
    \ very pedantic.\n\nTechnically, it is safe to:\n\nEscape a UTF-8 variable out\
    \ into a MySQL database UTF-8 column type using PDO\n\nopened with charset UTF-8\
    \ with pdo->quote(variable).\n\nThere is no other technical “safety” implied here.\
    \ This process does not make the\n\nvariable safe for an HTML parser."
