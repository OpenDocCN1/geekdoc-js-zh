    //if array_search() returns false, column name was not real\n\n//\awhen comparing\
    \ result we are checking for value and type\n\nvia = = =\n\n//zero might be returned\
    \ as a valid array index!\n\nif ($goodColumn = = = false) {\n\n//user input is\
    \ not an actual column name\n\n**return** false;\n\n}\n\n*Bill Karwin is a MySQL\
