  md: "**212**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nSessions are highly\
    \ frequent and repetitive activities; therefore speed is an important\n\nconsideration.\
    \ Sessions may hold valuable data. The decision is yours alone based on\n\nhardware,\
    \ frequency, user needs, and value of data being encrypted. It is important to\n\
    \nremember that salts were not meant to be secret. Salts increase the effectiveness\
    \ of the\n\nencryption key with more entropy. That is their function. They are\
    \ not another secret key.\n\nThe decision to be made is whether it is worth it\
    \ to have extra individual protection\n\non a record-by-record basis or just for\
    \ the session table as a whole.\n\nFor temporary session data, you need to make\
    \ the call based on the value of the\n\nsession data.\n\nRegarding storing personal\
    \ user secrets such as passwords and credit card numbers\n\nin session variables,\
    \ consider the following:\n\n1. It is not good practice to store them in $_SESSION.\n\
    \n2. They should be in a different encrypted table which MUST have a per record\
    \ IV.\n\n3. Secrets should be called on demand, then discarded immediately from\
    \ memory.\n\n**Note:**  There is absolutely no question, for personal secrets,\
    \ that each record ­absolutely\n\nneeds its own unique salt/IV/secret key for\
    \ maximum encryption protection.\n\nArchitecture questions to consider:\n\n1.\
    \ Does your application store valuable user information in the $_SESSION\n\nvariables?\
    \ (*Not recommended.*)\n\n• Then you should apply strong encryption with unique\
    \ per session salt.\n\n2. Does your application instead pass sensitive data straight\
    \ through to the data­\n\nbase and *not* store that data in the $_SESSION array?\n\
    \n• Then there might not be anything to apply extra protection to. The mobi­\n\
    \nlesec example app in this book does not store passwords at all, only hashes.\n\
    \nNor is any other critical data stored in SESSION variables.\n\nWhile unique\
    \ key/salt pairs per record are more secure, maximum encryption is not\n\nalways\
    \ required.\n\nThe following breaks out the class session handling details on\
    \ a function-by-­function\n\nbasis. There are 13 functions, each with a single\
    \ specific task to perform. The encryp­\n\ntion functions do the most work and\
    \ require the most explanation, as the PHP documen­\n\ntation is a little less\
    \ clear on how to actually implement mcrypt() in a secure fashion. In\n\norder\
    \ to get the maximum encryption strength out of mcrypt(), there are several steps\n\
    \nthat must be performed with the right settings. Otherwise the result is weaker encryption.\n\
    \n*Class Member Details*\n\n_ construct() There are three tasks this constructor\
    \ is performing. These tasks\n\nare opening the database, setting the save handler,\
