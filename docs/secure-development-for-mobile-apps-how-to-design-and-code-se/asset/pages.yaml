  md: "**100**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n**md5()**. Too weak\
    \ to provide modern protection and can no longer be trusted to\n\nkeep data safe.\
    \ Faster computers can now brute force md5 hashes so quickly\n\nas to render it\
    \ almost useless.\n\n**sha1().** Same reasons as md5\\. Again, too weak to provide\
    \ modern protection.\n\n**crypt().** If used with any of the following parameters:\
    \ CRYPT_STD_DES,\n\nCRYPT_EXT_DES, CRYPT_MD5.\n\n**EBC** cipher block.Use CBC.\n\
    \n**2a$** algorithm indicator.Use$2y$.\n\n*Modern Crypto versus Old Crypto*\n\n\
    To visualize why newer crypto algorithms are superior, why older functions are\
    \ no\n\nlonger useful for protecting data, why they should be completely abandoned\
    \ and never\n\nused again, look at the following hash output examples taken from\
    \ each function set\n\nup the following way.\n\nHash Functions\n\nDES\n\ncrypt('TestItOut',\
    \ 'mk');\n\nEXTENDED DES\n\ncrypt('TestItOut', '_mk88dtbh') ;\n\nMD5\n\ncrypt('TestItOut',\
    \ '$1$myKey84$') ;\n\nBlowfish\n\ncrypt('TestItOut', '$2y$10$krdfg678ehgrevskyws07$');\n\
    \nSHA-256\n\ncrypt('TestItOut', '$5$10$zbxclvkma7ut3davlds$');\n\nSHA-512\n\n\
    crypt('TestItOut', '$6$10$mkfpoxlvmaorqprew4e95kid2ffg$');\n\nHash Outputs\n\n\
    DES\n\nmkBy1EFZ0zhJ2\n\nEXTENDED DES\n\n_mk88dtbhxqe/2xkPb7M\n\nMD5\n\n$1$myKey84$bn12SOYWhtVH9dx4ccaWV.\n\
    \nBlowfish\n\n$2y$10$krdfg678ehgrevskyws07.\n\nMuHR2guyADgVkBXw3kRQl5t8Ft/I3EG\n\
    \nSHA-256\n\n$5$rounds = 1000$zbxclvkma7ut3dav$gyHxjzXOak76lFAQ36\n\n/8rfZ4297rsdluExBLz2NKku\n\
    \nSHA-512\n\n$6$rounds = 1000$mkfpoxlvmaorqpre$pz5NgUkYuzdpUO.\n\nRyBtkB7ArAhMkrrJwoeLAWK309zDhTxA1LrtGHT53CN/\n\
    \nwYdhctKduWpnFKlRL1LBcNfjqN0\n\nCompare the increasing lengths of the output\
    \ hashes and notice the considerable size\n\ndifference between DES and Blowfish,\
    \ which is what is now considered the new min­\n\nimum standard. DES and MD5 equals\
    \ old and busted. Blowfish and SHA-256 equals\n\nnew hotness. It is the same with\
    \ old cipher blocks and randomization sources. EBC\n\ncipher block and DEV_RAND\
    \ are retired. The CBC cipher block and DEV_URAND are\n\nthe current best practice."
