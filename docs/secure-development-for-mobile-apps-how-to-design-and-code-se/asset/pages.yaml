  md: '**195**


    14


    Secure Session Storage


    PHP provides a very simple default mechanism to manage sessions. At the beginning


    of a page, call session_start(), and add any session data to $_SESSION array,


    like $SESSION[''userName''] = $userName. Storage of session data, lookup of


    session data, and client cookie management is all handled for the developer behind


    the scenes.


    Two major security problems with default session management are insecure storage
    of


    session data and insecure session ID management. The most problematic issue is
    inse­


    cure session ID management since lack of session ID validation leads to account
    com­


    promise. Insecure file storage is also a concern, but is not as high risk as session
    cookies


    traveling across the open Internet without any process for protecting them from
    theft.


    A third issue related to default session management is scalability. File systems
    were


    not meant to track thousands of files in a single directory. This occurs in a
    heavily


    used application. As traffic increases, thousands of files will be created and
    deleted in


    the designated session directory. The old session files need to be deleted, which
    means


    searching for those files and performing file delete operations based on the timestamp.


    Properly indexed databases are better and faster for this kind of process. Nor
    does a


    file system span multiple servers. As the usage of a web application increases,
    session


    data storage using the local file system becomes a scalability issue as it is
    constrained


    to a single server. Thousands of session transactions are better handled in a
    database,


    and the database can be used in a server farm and coordinated across multiple
    web


    servers. The multi-host memory caching capability of Memched can also be lever­


    aged to increase the speed and responsiveness of an application. Increased security,


    and increased scalability benefits gained by moving session management from the
    file


    ­system to MySQL are good reasons to utilize PHP custom session management.


    The first half of this chapter provides an overview and details on PHP session
    man­


    agement. It examines how to increase session security by setting many of PHP built-in


    features with stronger values, and details the process of session management.
    The sec­


    ond half focuses on taking control of session storage by overriding all of PHP’s
    default


    behavior and providing a more secure implementation. Two complete session storage


    classes are presented. The first class stores encrypted session data to a table
    in a MySQL


    database. The second class stores encrypted session data to individual ­session
    files in


    private application session directory. Each class is a drop-in session storage
    replacement


    class. Simply include the class file in a project for all the application files
    that need session


    management and the updated session storage mechanism will occur behind the scenes.'
