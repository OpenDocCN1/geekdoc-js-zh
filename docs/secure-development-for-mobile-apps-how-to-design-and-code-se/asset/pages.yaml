    12


    Professional Exception


    and Error Handling


    The first rule of professional, modern PHP error handling is that die(error())
    is


    dead. It has no benefits to offer and works against a positive user experience
    as well


    as undermining security by revealing system details to untrusted sources. PHP
    has


    two error reporting systems in place, Errors and Exceptions. Each produces its
    own


    messages, and both need to be captured, privately logged, and never revealed as
    raw


    data to the user.


    Good error management consists of at least three actions.


    1. Capture error information


    2. Log error and file details to a private log


    3. Implement custom directions for users


    In order to capture error information, errors need to be checked for. Simple as
    that


    sounds, this process is often overlooked when data returned from one function
    is


    immediately passed into another function via function chaining, or function stuffing,


    as in die(error()) or echo json_encode(pdo->fetchall()). The extra step


    has to be taken to check results.


    Logging information requires setting up an error file outside of the public web
    root


    and making the handle available for writing during script execution.


    Implementing custom error directions for users is the most difficult by far. This


    involves planning in two areas, anticipating some of the errors that could occur,
    and


    preparing quality responses that do not annoy users. However, this is one of the
    most


    important steps in terms of creating a good experience for users. To this end,
    this sec­


    tion covers what is usually the last step first because this is what the user
    sees.


    A few conditions that could be expected are:


    • Database unavailable


    • Data not available


    • User input invalid


    • File not found


    • Image not found


    Part of PHP error management involves working with the web server to prepare


    custom responses to replace default behavior. For Apache, this involves using
    the'
