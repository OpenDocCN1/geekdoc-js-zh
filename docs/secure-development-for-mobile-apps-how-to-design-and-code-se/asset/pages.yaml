    **Secure Client Server Form Validation**


    For matching Unicode characters, the code below is a simple substitution guide
    for


    ASCII expressions.


    • \p{L} or \pL match a UTF-8 letter of any language


    • \p{N} matches a UTF-8 number


    • \p{L} and \p{N} match any character \w that matches plus underscore


    • \p{Z} matches any character that \s matches


    • \p{Nd} matches any digit that \d matches


    Other Unicode expressions supported by PHP useful for matching:


    • \p{Mn} matches any character combined with another (accents, umlauts)


    • \p{Pi} matches any opening quote


    • \p{Pf} matches any closing quote


    • \p{Ps} matches any opening bracket


    • \p{Pe} matches any closing bracket


    • \p{P} matches any punctuation character


    • \p{Pc} matches any punctuation character connecting words


    • \p{Po} matches any punctuation character that is not a dash, bracket, or quote


    • \p{C} matches any invisible control characters or unused code points


    • \p{Ll} matches lowercase letter


    • \p{Lu} matches uppercase letter


    • \p{Z} matches any kind of whitespace/invisible separator


    • \p{Zl} matches line separator character


    • \p{Zp} matches paragraph separator character


    *Sanitize Unicode Strings * The following string is a common Unicode example string


    and contains a mixture of Unicode characters, numbers, and special characters.


    In this case, we want the Unicode characters and numbers to be kept, and the special


    ­characters to be discarded.


    $unicode = "Iñtërnâtiônàlizætiøn0123456789!<>"#¤%&/";


    $unicode = **mb_convert_encoding**($unicode, ''UTF-8'', ''UTF-8'');


    **preg_replace**(''/[^\pL\d]/u'', '''', $unicode);


    produces:


    Iñtërnâtiônàlizætiøn0123456789


    The Unicode string contains accents and umlauts which need to be preserved. The


    mb_convert_encoding() function uses sanitization to verify that the string is


    UTF-8\. The preg_replace() expression, /[^\pL\d]/u, has indeed kept the full


    Unicode characters and numbers while removing the unwanted special characters.


    The key elements are ‘\pL’, which matches Unicode characters, ‘\d’, which matches


    digits, and /u, which tells preg_replace() that the string is Unicode.'
