  md: "**92**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*HTML Templating\
    \ Support*\n\nHTML templating is one of the primary ways to separate PHP from\
    \ HTML and\n\nhelp isolate output into the HTML. Two goals are achieved by this.\
    \ The first is clear\n\nseparation of concerns, which makes maintenance easier.\
    \ The second is that visual\n\ninspection from a security standpoint is greatly\
    \ improved, making it much easier to\n\nidentify both where are and what kind\
    \ of context data is being output to.\n\n*PHP Heredoc * The PHP heredoc is a built-in\
    \ language construct that can be very\n\neffective in separating PHP from HTML.\
    \ An example looks like this:\n\n$message = <<<ACTIVATIONEMAIL\n\nHello {$user},\n\
    \nThanks for creating an account with us!\n\nYour account has been created.\n\n\
    You\a can login as soon as you have activated your account by\n\nclicking the\
    \ link below.\n\nPlease click this secure link to activate your account:\n\nhttps://www.mobilesec.com/activate.php?activation_key\
    \ = {$code}\n\nEnjoy!\n\nSincerely,\n\nThe MoblieSec Team\n\nACTIVATIONEMAIL;\n\
    \necho $message:\n\nThere heredoc functionality allows all the HTML to be cleanly\
    \ organized without\n\nresorting to statements like echo, \"Hi,\", $username.,\
    \ and \",\";. It also allows the\n\nvery clean insertion of variables into the\
    \ template. This makes it very easy with the\n\nHTML, and to spot, evaluate for\
    \ security, and manipulate variables.\n\nHowever, there is a security problem.\
    \ *Is the* $user *variable secure?* We ­cannot tell\n\nby looking at it directly.\
    \ It is clearly not being escaped ‘in location’ by an output func­\n\ntion, so\
    \ one must ask if it was escaped elsewhere. This is less than ideal. Ideally,\
    \ an\n\noutput escape function would be inserted here along with the variable\
    \ to ­provide real\n\ntime, ‘in location’ output escaping. Unfortunately, heredoc\
    \ does not ­provide a way for\n\nfunction calls inside the heredoc directly. Text\
    \ to be replaced inside a heredoc must be\n\npreceded by a $. This leaves the\
    \ possibility for a workaround.\n\n*How to Inline Heredoc Functions*\n\nTo make\
    \ a heredoc do more security work on our behalf, a function variable needs\n\n\
    to be created that points to the output escaping function that needs to executed,\
    \ as\n\nshown here.\n\n$user = \"Tom\";\n\nfu\anction HTMLS($output) {return htmlspecialchars($output,\
    \ ENT_\n\nQUOTES, \"UTF-8\");}"
  merge: -1
