    **Secure Session Storage**


    Then the data can be decrypted using the same encryption key and IV that was


    used to encrypt it.


    $data = **mcrypt_decrypt**(MCRYPT_RIJNDAEL_256,


    **$key**,


    $data, MCRYPT_MODE_CBC,


    **$iv**);


    Before returning, one last step is to trim any padding characters added by mcrypt().


    return **rtrim**($data, **"\0"**);


    Again, it is important to specify the “\0” character so the rtrim does not remove


    spaces that may actually be part of the original data.


    The data returned from this function is the clear text, serialized string of ­session


    variables.


    read()  The read() function is called immediately after a session is started and


    opened. Read() needs to obtain the contents from storage and return the data in
    a


    serialized format which PHP will unserialize into the $_SESSION array. read()


    takes one argument, the session ID. The session ID must be the lookup ID for the
    ses­


    sion data. If the session has no data, read() needs to return an empty string.
    As long


    as the data is returned in the serialized format PHP expects, the custom storage
    rou­


    tine will be transparent and not different in behavior than the default session
    behavior.


    Note that read() is only called once during a session after open() is called.
    This


    means that data is not reread from storage every time a session variable is accessed.


    Data is only read one time at the beginning of the session life cycle.


    The implementation of the function performs four tasks.


    • Check Session ID for valid characters


    • Begin PDO transaction


    • Perform a SELECT FOR UPDATE query


    • Select and call encryption function


    First, the session ID, since it can be tampered with by an attacker, is checked


    for valid characters with preg_match(). The characters allowed are determined


    by the session.hash_bits_per_character setting in php.ini. In this case,


    since level 6 was specified, a session ID can contain any of the following characters


    (0–9, a–z, A–Z, “-”, “,”), so the call to preg_match() will be:


    **preg_match**(''/^[A-Za-z0-9\-,]+$/'', $sessionID)


    If characters outside of the allowed set are detected, then no processing is per­


    formed. It should be considered an attack. There is NO reason for any other characters


    to be present, EVER.'
