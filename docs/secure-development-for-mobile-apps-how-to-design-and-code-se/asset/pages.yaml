  md: "**80**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThese patterns are\
    \ described in more detail later. The implementation of these\n\n­patterns should\
    \ be easy enough to understand within the context of this book if\n\nyou already\
    \ have PHP experience. For in-depth understanding and for ­additional\n\ndesign application,\
    \ please read the original *Design Patterns* book (Gamma et al., 1994).\n\n*Variable\
    \ Variables: Power DRY*\n\nRepetition is to be avoided in programming. Repetition\
    \ easily induces mistakes, is\n\na cause of hard-to-find bugs, and increases the\
    \ difficulty and time required to make\n\nchanges. The acronym DRY stands for\
    \ Don’t Repeat Yourself and is an important ideal\n\nto cling to when designing\
    \ and writing code. The idea is that when you find yourself\n\nrepeating a statement,\
    \ it should trigger an automatic response in your thought pro­\n\ncess that refactoring\
    \ needs to occur right away in order to eliminate the duplication.\n\nPHP has\
    \ a powerful feature to help fight repetition called a *variable variable*. What\n\
    \nthis does is allow a variable to declare another variable instead of being limited\
    \ to\n\nholding only a value. This means that a variable can hold the name of\
    \ another variable\n\nand be used to reference that other variable. This mechanism\
    \ creates a powerful and\n\ndynamic variable mapper which is best demonstrated\
    \ with an example common to\n\nevery PHP web application.\n\nThe traditional method:\n\
    \n$userName\n\n= validateInput($_POST['userName']);\n\n$userPass\n\n= validateInput($_POST['userPass']);\n\
    \n$userEmail\n\n= validateInput($_POST['userEmail']);\n\n$userBlogPost\n\n= validateInput($_POST['userBlogPost']);\n\
    \nWhile this is one of the most common ways to process input, the repetition here\
    \ is\n\npainfully obvious. In order to achieve DRY status, we need a way to avoid\
    \ this repeti­\n\ntion. This can be accomplished using PHP variables variables.\n\
    \nImproved DRY method:\n\n$user = new secureUser();\n\nforeach($_POST as $key\
    \ = >$val)\n\n{\n\n//note the use of double $ for Variable Variables\n\n$user->$key\
    \ = validateInput ($val);\n\n}\n\necho htmlentities($user->userName, ENT_QUOTES,\
    \ \"UTF-8\");\n\nNotice the complete lack of repetition. In fact, every duplicated\
    \ item, the variable\n\nnames, $_POST array references, and functions calls to\
    \ validateInput  () have\n\nbeen eliminated. The magic for this occurs because\
    \ of the use of the two $ signs for\n\nthe user object. Normally, there would\
    \ be just one,\n\n$user->key\n\nwhich would refer to a specific key."
