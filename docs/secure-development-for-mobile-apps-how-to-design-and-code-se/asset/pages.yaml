    Now that all the variables have been extracted from the $ _ POST array, all the


    request globals are destroyed by unsetting them.


    **unset**($_POST);


    **unset**($_GET);


    **unset**($_REQUEST);


    This does three things. It prevents unfiltered or accidental access and usage
    of raw


    request variables. It prevents $_GET and $_REQUEST from being processed at all,


    and it forces the access to variables to occur at the top of the page. By grouping
    all


    request variables together, variables are accounted for and filtered properly.
    Security


    of variables is contained. The unset() function does not seem to be commonly used.


    One reason for this is that since scripts typically end after a short duration,
    mem­


    ory management and reclamation is not as necessary as in longer running programs.


    Besides freeing memory, unset() is useful as a security tool for enforcing and
    pre­


    venting access restrictions. By forcing variables to be destroyed at a certain
    point, a


    developer is forced to localize variable processing and is denied unplanned access
    later


    in the script. Whatever method one chooses to validate data, doing it all in one
    place


    greatly enhances the control over those variables and the ability to review those
    same


    variables for security.


    The next task is checking if all variables have a value. A foreach() loop runs


    through $formFields and checks if any fields are blank.


    foreach($formFields as $field = > $value)


    {


    if($value = "")


    //set one and only one blank fields msg


    $formErrors[0] = "Field(s) blank";


