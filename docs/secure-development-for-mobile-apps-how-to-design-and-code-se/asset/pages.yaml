  md: '**279**


    **Secure Forms and Account Registration**


    Setting the time to one second past Unix epoch time accounts for any time zone


    differences. If there are any other variables related to the session, this is
    the place to


    explicitly destroy them.


    **Privilege Elevation Protection System**


    The following two functions provide the implementation needed to enforce privi­


    lege elevation protection for the session. These functions set and monitor the
    time


    window allowed for a physically entered password to be authorized. When users


    enter their password, there is a time window in which the session has the elevated


    privilege required for changing account data. When this window expires, users
    must


    re-enter their password to continue. This process greatly enhances protection
    of


    an account from cookie theft. Cookie theft alone cannot hijack the ability to
    edit


    account data.


    checkVerifiedPasswordStatus() This function simply checks details of the


    time window. First, it checks if the


    $_SESSION[''verifiedPassword'']


    is set to true, then it gets the time that the password was verified


    $age = **time**() - $_SESSION[''verifiedPasswordTime''];


    and the current time in order to determine the time span.


    return ($age < = MAXVERIFIEDPASSWORDTIME) ? true : false;


    A ternary operator is used to determine if the time span is greater or less than
    the


    allowed time window. If greater, the user will have to re-enter their password
    and


    restart the time window.


    updateAuthorizedStatus() This function sets the details for privilege elevation


    enforcement. It must do this correctly or the process will not be affected. The
    primary


    task is to regenerate the session ID and delete the old session record after the
    user has


    successfully re-entered their password. If the session ID is not regenerated and
    the


    elevation is assigned to the current ID, then anyone who has stolen that ID also
    has


    the elevation privilege, which defeats the purpose.


    session_regenerate_id(true);


    **This function call is critical for secure session privilege elevation**. There
    must be


    a new session ID created with the new powers and the old session must be deleted
    so


    that theft is not possible.'
