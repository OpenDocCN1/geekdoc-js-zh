    **Native Function Support**


    *Encoding Functions*


    This is the group of functions that are the workhorses for escaping output into
    the


    appropriate context.


    *HTML Encoding * Explicit use of HTML encoding is used so that all environment


    conditions are accounted for. This includes specifying the character encoding
    as UTF-


    8, and that both single and double quotes are to be escaped.


    **htmlentities**($output, ENT_QUOTES, "UTF-8");


    Another useful but often overlooked example is explicitly setting the double_


    encode flag to false, which prevents existing encodings from being double encoded.


    By default, existing entities are double encoded, which is not usually desirable.
    This


    can be useful when parsing external RSS feeds that might already be encoded.


    **htmlentities**($output, ENT_QUOTES, "UTF-8", **false**);'
