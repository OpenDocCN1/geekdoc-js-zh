    $key,


    $text,


    MCRYPT_MODE_CBC,


    $iv);


    Once the message is encrypted, an option is to make an authenticated message


    digest with hash_hmac(). This provides a message signature to ensure the integrity


    of the encrypted message later.


    $hmac = **hash_hmac**(''sha256'',


