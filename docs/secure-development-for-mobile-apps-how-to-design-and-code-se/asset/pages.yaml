  md: "**200**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThe next group of\
    \ settings configures the cryptography levels for PHP sessions that\n\nare typically\
    \ not set and are ignored as powerful tools for increasing session security.\n\
    \nThe first setting, ‘session.entropy_file’, sets the source to /dev/urandom.\
    \ This\n\nis a non-blocking resource, which is faster than /dev/random, which\
    \ is a block­\n\ning resource. The use of a high-quality entropy source, such\
    \ as /dev/urandom/ is\n\ncritical for strong cryptography. Encryption strength\
    \ is directly linked to randomness\n\nand entropy. Predictability is one of the\
    \ primary methods for defeating encryption.\n\nSetting the hash cipher and the\
    \ amount of entropy to use is next. Here SHA256 is set\n\nto use 512 bits of entropy.\
    \ The last setting, 'session.hash_bits_per_char­\n\nacter', is very important.\
    \ It determines the length and characters used in the actual\n\nsession ID. The\
    \ default setting is level 4, which uses characters (0–9, a–f). Level 5\n\nincreases\
    \ this to (0–9, a–v) and it really is the minimum setting that should be used\n\
    \ndue to the increased character range. Level 6 is the setting used here, which\
    \ increases\n\nthe range to (0–9, a–z, A–Z, “–”, “,”), which is quite a bit larger\
    \ character range space.\n\nThe next group of settings affects session ID garbage\
    \ collection. This sets when ses­\n\nsion ID and the associated records or files\
    \ are marked for deletion based on time expi­\n\nration and when the garbage collector\
    \ is actually called. Garbage collection is checked\n\non each session as to whether\
    \ it is actually invoked or not. The frequency of invocation\n\nis set here. Every\
    \ hundred or every thousand calls, the collector is invoked and then\n\ndeletes\
    \ all session files, or records older than a specified time limit. It is important\
    \ to\n\nnote the records are not automatically deleted on expiration. They are\
    \ deleted when\n\ncollection is randomly invoked and the session is expired. The\
    \ consequence is that\n\nthere is a period of time between a sessions expiration\
    \ and garbage collection. The way\n\nto avoid this is to explicitly call session_destroy\
    \ on a session to delete the file or\n\nrecord and the data.\n\nAnother setting\
    \ that can be used effectively to help secure pages is telling the client\n\n\
    browser, as well as intermediary proxies, whether or not to cache pages. Pages\
    \ that are\n\nheld in a cache are essentially left around for some amount of time.\
    \ Sometimes this\n\nmatters, sometimes not. Setting\n\nsession_cache_limiter('nocache');\n\
    \ntells the client browser, and any proxies to not cache the page. Other settings\
    \ are “pub­\n\nlic,” which means caching is OK, or “private,” which means only\
    \ the client browser\n\nshould cache the page, and not any proxies. These settings\
    \ do not guarantee security,\n\nbut help control which pages are left around the\
    \ web and where, which is useful.\n\nThe last grouping is setting cookie properties.\
    \ Then the domain path for the cookie is\n\nset. This is important as it means\
    \ that the cookie will only be sent when pages within that\n\ndomain path are\
    \ requested. The last setting is for the name. This helps organize cookies\n\n\
    so that tracking, using, and deleting more than one cookie per application is\
    \ possible.\n\nOne final option that is important is setting the cookie expiration\
    \ time. Depending\n\non use, cookies may have a shorter or longer life. Naming\
    \ and setting proper expiration"
