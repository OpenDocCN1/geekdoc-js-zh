  md: "**224**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Encrypted Session\
    \ Storage via File System*\n\nThe class presented here, SecureSessionFile, overrides\
    \ the PHP default session han­\n\ndler for file system storage. It relocates the\
    \ session files to a non-shared directory, and\n\nencrypts the contents using\
    \ mcrypt() with the Rijndael256 cipher.\n\nAs noted previously, by default PHP\
    \ saves session data to local files. See above for\n\na description of the entire\
    \ process. This section addresses issues specific to file-based\n\nsession storage.\
    \ Saving to files works well and is very reliable. For many situations, file\n\
    \nstorage does the job. This section introduces how to encrypt the session contents\
    \ to\n\nprevent unauthorized reading.\n\nTo determine default file storage, there\
    \ are some quick checks that can be\n\n­performed. Where PHP saves the session\
    \ data can be determined by the func­\n\ntion session_save_path(). A call to session_save_path()\
    \ with\n\nno ­parameters gives the full path to the local directory where the\
    \ session files\n\nare stored.\n\necho session_save_path();\n\nThe location of\
    \ the session file storage can be changed by calling session_\n\nsave_path() with\
    \ a full path of the new local directory location.\n\nsession_save_path(\"/secureapp/sessions/\"\
    );\n\nThe name of the files in the directory begin with “sess_” and the session\
    \ ID.\n\nA strong session ID will look like:\n\nrlQInctlPnLJou8AkK11,3fVoxBencDza2Q-sowhsU9\n\
    \nA session file name will look like:\n\nsess_rlQInctlPnLJou8AkK11,3fVoxBencDza2Q-sowhsU9\n\
    \nThe data in the files is stored in clear text, and in a serialized string format.\
    \ For ses­\n\nsion management to work transparently, data must be read from and\
    \ written to files in\n\nthe format. Encryption of the data can work transparently,\
    \ as shown in this next class,\n\nas long as the data is serialized before encryption.\n\
    \nSetting two variables inside the $_SESSION array, like\n\n$_SESSION['quantity']\
    \ = 5;\n\n$_SESSION['price']\n\n= 25;\n\nwould result in the following session\
    \ file contents.\n\nquantity|i:5;price|i:25;\n\nThe values are separated by a\
    \ semicolon. Individual values are separated by a pipe.\n\nA colon is used to\
    \ identify the value type. The resulting format for a single value"
