  md: "**366**\n\n**Secure Development for Mobile Apps\uFEFF**\n\npublic function\
    \ getVideoURL($vidID)\n\n{\n\n$query = \"**SELECT** video_url, video_msg\n\n**FROM**\
    \ map_video\n\n**WHERE** video_id = :id **LIMIT** 1\";\n\n// Execute the query\
    \ to create the user\n\n$stmt = $this->conn->**prepare**($query);\n\n$stmt->**bindValue**(\"\
    :id\", $vidID);\n\n$result = $stmt->**execute**();\n\n$result = $stmt->**fetchAll**();\n\
    \nreturn $result;\n\n}\n\n*Processing Markers*\n\nThere are two main files that\
    \ process map data: updateMarkers.php, and generate­\n\nMarkers.php. These files\
    \ handle the bulk of the security measures as they are the\n\ngateway for sanitizing\
    \ and validating incoming data and escaping the outgoing data so\n\nthat it is\
    \ safe for consumption by the JavaScript in the jQuery Mobile client.\n\n*Generating\
    \ Markers*\n\nThe file generateMarkers.php contains the code for initially populating\
    \ the map.\n\nIt pulls markers out of the database, formats each record into an\
    \ XML document, and\n\nescapes the data to be safely displayed on the client’s\
    \ browser.\n\nThis file, since it is performing a static query, has the least\
    \ amount to do regarding\n\nvalidating incoming data, but it has the most to do\
    \ regarding safely sending untrusted\n\ndata back to the client. This section\
    \ goes step by step through the process as follows:\n\n1. Validating the POST\
    \ parameter\n\n2. Requesting map markers from the data repository\n\n3. Preparing\
    \ the XML document\n\n4. Escaping each data element for HTML context\n\n*STEP\
    \ 1*\n\n//remove unnecessary vectors\n\n//this script process idempotent read\
    \ only GET requests\n\n//data is not modified only retrieved\n\n//repeated requests\
    \ do not alter any state\n\n**unset**($_REQUEST);\n\n**unset**($_POST);\n\n*STEP\
    \ 2*\n\n//extract ALL required user variables here\n\n//filter/validate variable\
    \ for required type or range\n\n//cut user data to correct size"
