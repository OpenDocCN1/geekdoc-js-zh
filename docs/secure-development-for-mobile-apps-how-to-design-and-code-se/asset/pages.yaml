    5


    PHP Security Tools Overview


    PHP has many built-in tools that can be leveraged for secure coding. This chapter


    gives an overview of these tools and serves as an introduction to why they are
    used in


    building the secure application example code in the second part of the book. Many
    of


    the tools outlined here are viewed from a security perspective, so examples are
    given as


    to why they are important and how they can be leveraged to achieve more secure
    code.


    **Object Language Support**


    PHP is a procedural language and/or an Object-Oriented (OO) language. A ­developer


    can use the language either way, or in a mixture of ways. The languages object
    con­


    structs are a great way to encapsulate and isolate functionality. In this chapter
    we look


    at how to make use of the many OO features to enhance and enforce security.


    The class construct is the basic building block to group related functionality


    together. Objects are the classes come to life, once the script starts running,
    to get


    the work done. The way these classes are organized and the way objects interact
    have


    a great impact in security. Some thought spent during design time goes a long
    way


    toward making the application more secure, as well as simplifying the code. The
    sim­


    pler the code can be, the easier it is to make it secure and to inspect from a
    security


    standpoint. Conversely, less clear code becomes harder to access easily. The key
    here is


    *easily*. The question is how much time does one want to spend looking for problems?


    A famous quote from Brian Kernighan, who helped build Unix and was a coauthor


    of the first programming book for the C language, is “Debugging is twice as hard
    as


    writing the code in the first place. Therefore, if you write the code as cleverly
    as pos­


    sible, you are, by definition, not smart enough to debug it.”


    With that in mind, this book strives to keep things as simple as possible, in
    a clear


    style so that spotting problems becomes easier, instead of more difficult.


    *Abstract Classes, Interfaces, Façades, Templates, Strategy, Factories, and Visitors*


    *Design Patterns: Elements of Reusable Object-Oriented Software* (Gamma et al.,
    1994)


    introduced software communication to the world of developers. This book is pop­


    ularly known as the *Gang of Four* book. Design patterns are an essential tool
    for


    ­object-oriented software. The reason is that design patterns nicely abstract
    common


    interactions and functionality which allows developers to describe software. If
    design


    patterns are understood by a team, then one developer says to another team member,'
