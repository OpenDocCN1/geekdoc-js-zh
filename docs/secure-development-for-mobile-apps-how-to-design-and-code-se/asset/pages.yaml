  md: "**28**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Output Escaping*\n\
    \nProper output escaping is critical, and it depends on context. The reason is\
    \ that you\n\nneed to know how the data is going to be interpreted. This could\
    \ be the HTML\n\nrenderer, the JavaScript parser, CSS parser, both, or something\
    \ else. Will the data be\n\ndefined by the HTTP spec, the HTML spec, the ECMA\
    \ script spec?\n\n*Context Is King * *Programming PHP 3*, Third Edition (Tatroe,\
    \ MacIntyre, and Lerdorf\n\n2013), introduces a new class called Encoder that\
    \ has a specific function for a specific\n\noutput context. Each function escapes\
    \ data to make it safe for that particular output\n\ncontext. For example, to\
    \ output data:\n\nAs straight HTML:\n\necho $encoder->encodeForHTML($data);\n\n\
    As an HTML attribute value:\n\necho $encoder->encodeForHTMLAttribute($value);\n\
    \nAs JavaScript:\n\necho $encoder->encodeForJavascript($value);\n\nAs a URL:\n\
    \necho $encoder->encodeForURL($value);\n\nAs a Cascading Style Sheet:\n\necho\
    \ $encoder->encodeForCSS($value);\n\nThese convey the basic idea and make it very\
    \ clear how the data is going to be inter­\n\npreted. There are still specific\
    \ rules about where to place specific types of data, so now\n\nwe need to know\
    \ exactly where and how to use these safely. See the next section for a\n\ncomplete\
    \ guide to understanding output contexts.\n\n*You Must Know Where Your Data Is\
    \ Displayed*\n\nThe OWASP XSS Prevention Rules address this clearly. The assembled\
    \ rules are essen­\n\ntially a context map that shows exactly where it is safe\
    \ to put untrusted data if escaped\n\nfor that context. The rules also show where\
    \ untrusted data is never safe, even if escaped,\n\nso that you should never allow\
    \ user data to be placed there. The link to the source\n\ndocument, XSS (Cross\
    \ Site Scripting) Prevention Cheat Sheet, is given at the end of\n\nthe book.\
    \ This is a living document, updated as new attack vectors are discovered, and"
