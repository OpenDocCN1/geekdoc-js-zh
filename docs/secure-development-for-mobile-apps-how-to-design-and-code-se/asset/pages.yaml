    **Exception Handling**


    Exception handling is the object-oriented method for handling errors. An exception


    is an object, and is instantiated in the same way as an object. The benefit of
    having


    an error as an object is the encapsulation of an error state that an object can
    provide.


    The key words for exception handling are *try*, *throw*, and *catch*. The advantages
    are that


    code can be protected with a try statement, and an error response implementation
    is


    guaranteed to be executed with a catch statement if something goes wrong anywhere


    in the try statement. The benefit of the throw keyword is that it allows code
    some­


    where else up the call stack to catch the thrown exception and respond. Essentially,


    this puts the compiler to work for you in setting up a guaranteed error path and


    response system.


    *Introduction to Exceptions*


    In PHP an exception is an object of the Exception class. An exception is created
    and


    thrown like this.


    throw new Exception();


    The exception class has a list of member functions used for encapsulating error


    state, allowing error objects to be used in very effective ways, both for logging
    and'
