  md: "**66**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n3. Ensure user-supplied\
    \ data is comprised of the chosen encoding.\n\n4. Convert or *drop* data that\
    \ does not conform.\n\n*UTF-8 in the Database*\n\nThe database setup requires\
    \ that the database itself be declared with the UTF-8 char­\n\nacter set. It also\
    \ needs to have what is known as the *collation* set to UTF-8\\. Collation\n\n\
    is how characters are compared during a search. If the collation is different\
    \ than the\n\ncharacter set of the search characters, mismatches can result.\n\
    \nNext, the actual columns in the table can each have their own character set,\
    \ which\n\ncould be different from UTF-8, and collation. There needs to be a check\
    \ that these are\n\nUTF-8 and not something else.\n\nThe query client connection\
    \ to the database must also be set to UTF-8 in order\n\nto ensure that no translation\
    \ errors occur. If you ever save a multi-byte string to the\n\ndatabase and get\
    \ garbage characters back, it is usually because the table column, or\n\nthe client\
    \ connection, is not set to be the same.\n\n*UTF-8 in the PHP Application*\n\n\
    First, PHP must be set to process UTF-8 internally. This can be done via the php.ini\n\
    \nfile, or via the mb_internal_encoding() function.\n\nAn example of ensuring\
    \ conformance would be the following.\n\nmb_substitute_character(0xFFFD);\n\n\
    mb_convert_encoding($userdata, 'UTF-8', 'UTF-8');\n\nmb_substitute_character()\
    \ configures the replacement character for detected\n\ninvalid characters and\
    \ is an important base function. This is so ­critically important\n\nthat it is\
    \ repeated several times in this book to reinforce its use and ­application.\n\
    \nIf a ­replacement character is not specified, invalid characters are silently\
    \ dropped.\n\nThis creates a security risk because attack strings can be assembled\
    \ by ­having\n\n­characters dropped.\n\nDE**X**LETE\n\nbecomes\n\nDELETE\n\n**Note:** \
    \ See Mark Davis, Michel Suignard, Unicode.org deletion point security advisory.\n\
    \nMulti-byte functions need to be set to UTF-8 in php.ini, and strings must be\n\
    \n­processed with multi-byte string functions. Otherwise your string lengths and\
    \ other\n\ncalculations will not be correct. The PDO database connection must\
    \ be opened with\n\nthe charset UTF-8 parameter set in order to ensure that the\
    \ client connection is correct."
