    \ click the link, they are taken to a password reset\n\npage complete with a password\
    \ strength meter, and allowed to reset their password.\n\nNo one but the user\
    \ ever knows the password.\n\nA final security check is the reevaluation of encryption\
    \ strength. As ­computers get\n\nfaster, encryption brute forcing becomes easier.\
    \ A strong benefit of Blowfish is that it\n\nis designed to slow down guessing\
    \ attempts. Increasing the rounds used increasingly\n\nslows down the speed at\
    \ which a guess can be made. Twelve rounds are used as a\n\n­current strong level.\
    \ This will need to change in the future. This is done ­automatically\n\nby the\
