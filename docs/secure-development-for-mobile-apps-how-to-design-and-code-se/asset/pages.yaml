    Secure File Uploading


    **Basic Principles of Secure File Uploading**


    Allowing untrusted file uploads from anonymous users is one of the most risky
    actions


    for an application to allow; however, it is also one of the most expected features
    of an


    application. One of the most common tasks users engage in is the uploading, down­


    loading, and sharing of files. Here, security is at odds with user needs. To address
    this


    problem, there are several well-established guidelines for handling user uploaded
    files


    that can, if followed, keep the application and web server safe from malicious
    attack.


    The critical thing to remember is that none of these procedures can make an


    uploaded file safe. There is no simple way, and no single method, no matter how
    many


    checks are performed, to ensure that a file is completely harmless. It is a sad
    but true


    fact. This is the purpose of virus scanners, and they are always a step behind
    as well.


    The secret that will keep the application safe lies in how the untrusted files
    are treated,


    and *not* in whether the files test out as “safe.”


    With that in mind, here is a list of secure guidelines for properly handling the


    uploading of untrusted user files.


    • Authenticate file uploads per user


    • Generate a white list of allowable types


    • Expect that file extensions and types are meaningless


    • Create a new system generated file name


    • Store the file outside web root


    • Enforce file size limit


    • Control file permissions


    • Limit number of file uploads


    **Optional:**


    • Use CAPTCHA to prevent spam


    • Try a malware scan


    These guidelines, if followed, implement a defense in-depth structure that allows
    tight


    control over the processing and handling of user uploads. The entire process of
    han­


    dling uploaded files consists of:


    • How the files are uploaded


    • How the files are stored


    • How the files are retrieved'
