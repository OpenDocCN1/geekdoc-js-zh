  md: "**316**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Prevent Caching *\
    \ Setting headers to prevent caching\n\n**header**(\"Pragma\", \"No-cache\");\n\
    \n**header**(\"Cache-Control\", \"no-cache\");\n\n**header**(\"Expires\", 1);\n\
    \nResulting HTTP header packet:\n\n\"Pragma: No-cache\"\n\n\"Cache-Control: no-cache\"\
    \n\n\"Expires: Thu, 01 Jan 1970 00:00:00 GMT\"\n\n**Note: ** Unix epoch time\n\
    \nTo prohibit caching of application HTML pages, insert the following meta-tags\n\
    \ninto the head section of HTML pages.\n\n<meta HTTP-EQUIV = \"Pragma\" content\
    \ = \"no-cache\"> and\n\n<meta HTTP-EQUIV = \"Expires\" content = \"-1\">\n\n\
    This directive means the page would be considered expired right after it was\n\
    \nretrieved from the server.\n\n*How HTTP Redirect 303 Works * The correct way\
    \ to implement PRG is to redirect\n\nwith a 303 code. The HTTP 1.1 specification\
    \ defines the HTTP 303 (“See other”)\n\nresponse code to address the PRG pattern.\
    \ The code tells the browser to safely refresh\n\nthe server response without\
    \ resubmitting the initial HTTP POST request.\n\n**header**(\"HTTP/1.1 **303**\
    \ See Other\");\n\n**header**(\"Location: http://www.test.com/result.php\");\n\
    \nHowever, the code 302 can also work because of default behavior of browsers.\n\
    \nHTTP 1.1 defines redirect response codes in the 3xx range. These codes can require\n\
    \nbrowsers to use the same request type, to change POST to GET, or to obtain user\
    \ con­\n\nfirmation before request redirection. Not many of these HTTP specification\
    \ require­\n\nments are implemented by browsers, and a de facto standard has become\
    \ redirecting\n\nPOST to GET without confirmation upon the receipt of a 302 code.\
    \ This behavior is\n\nexploited by the PRG pattern.\n\nThe specification says\
    \ this implementation is wrong for 302 which is defined as the\n\n“Found” code.\
    \ The specification states this is correct for 303, which is defined as “See\n\
    \nOther” code. While best to use 303, as it is the specified usage, sometimes\
    \ it needs\n\nto be a 302 response code because many applications still rely on\
    \ it, so it still works.\n\nModern browsers correctly process the 303 redirect\
    \ code. Going forward, redirect\n\nusing 303 instead of 302."
