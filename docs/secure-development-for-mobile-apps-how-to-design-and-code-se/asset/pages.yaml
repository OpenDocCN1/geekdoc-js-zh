  md: "**99**\n\n**PHP Security Tools Overview**\n\nOne thing that makes PHP development\
    \ difficult are statements like the following,\n\nwhere checking if all the quoting\
    \ is correct is overly difficult to track.\n\n$qry = \"SELECT userID, email FROM\
    \ Users WHERE userID = ''\";\n\n$qry . = $userID. \"' AND hash = '\". $passHash.\
    \ \"'\";\n\nEven if $userID and $password are properly cleaned, checking to ensure\
    \ that\n\nthe values are correctly quoted is too cumbersome. PDO simply makes\
    \ the job much\n\neasier. With PDO, one is less likely to forget something, and\
    \ the statements are easier\n\nto visually examine.\n\n$pd\ao->prepare(\"SELECT\
    \ userID, email FROM users WHERE userID =\n\n­:userID\");\n\n$pdoSt>bind_param(\"\
    :userID\", $id);\n\n$pdoSt->execute();\n\nThe PDO prepared statement is clearer\
    \ to read. bind_param() must be set and\n\ncalled before execute(). If it is not,\
    \ then execute() fails, which affords protection\n\nfrom forgetfulness.\n\n**Deprecated\
    \ Security Functions**\n\nPHP 5.2 is officially at end of life. No more work is\
    \ being done on it. No more security\n\npatches will appear. This means it really\
    \ is time to move to 5.4+ and beyond. In par­\n\nticular this means switching\
    \ over to the latest security functions. Because a majority\n\nof books and sample\
    \ code still rely on the following functions as examples, they have\n\nbecome\
    \ almost traditional. However these functions are outdated for several security\n\
    \npurposes and need to be discontinued entirely from use. The following is a list\
    \ of com­\n\nmon functions that should no longer be used for security purposes.\n\
    \n**ASCII only string functions**—substr(), strtr(), etc…work incorrectly in\n\
    \nUTF-8.\n\n**ISO-8859-1** as default PHP character set for internal functions\
    \ counters UTF-8.\n\n**Safe Mode** is gone for PHP 5.4.\n\n**register_globals**\
    \ is gone for PHP 5.4.\n\n**addslashes()** is not safe because it is not character\
    \ set aware.\n\n**magic_quotes()** should be disabled on all PHP installations.\n\
    \n**mysql_query()** series of functions. Use PDO or MySQLi instead. It is officially\n\
    \ndeprecated as of PHP 5.5.\n\n**mysql_real_escape_string()**. This function is\
    \ safe, but should be replaced by\n\nPDO quote() when necessary to manually quote\
    \ a variable. Should only be\n\nused now for legacy code maintenance.\n\n**rand()**.\
    \ Insufficient randomness as a seeder for cryptography or hashing."
