  md: "**186**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nthe  damage. This \
    \ is  one  reason re-authenticate on privilege elevation is a best\n\n­practice.\
    \ Re-authentication stops an attacker before they can change user data.\n\n*Enable\
    \ HTTP Only and Secure Cookies via PHP * Two other critical settings that help\n\
    \nprevent session ID hijacking are making sure that the cookie is only sent over\
    \ SSL\n\nand that cookies are only handled by the browser and sent in HTTP headers.\n\
    \nThe first measure, ensuring that the cookie is only sent over HTTPS/SSL means\n\
    \njust that. If a user visits a public page over HTTP on the site, the session\
    \ cookie will\n\nnot be sent. This prevents the cookie from being intercepted\
    \ in the clear. This can be\n\nchecked by looking at the $_COOKIE array during\
    \ an HTTP request. The session\n\ncookie will not be present, as it was not sent\
    \ by the browser. Modern browsers follow\n\nthis instruction. Looking at the same\
    \ request over HTTPS, the $_COOKIE array\n\nwill show the cookie to be present.\
    \ This is set in php.ini or by\n\nini_set('session.cookie_secure', 1);\n\nThe\
    \ second measure is setting the cookie to be accessed only by HTTP. This pre­\n\
    \nvents JavaScript from accessing the cookie. Attack vectors that depend on ­obtaining\n\
    \nthe value of document.cookie with JavaScript no longer work. Again, most mod­\n\
    \nern browsers respect this directive and prevent JavaScript access. This is set\
    \ by\n\nini_set('session.cookie_httponly', 1);\n\n*Enable Secure Login over SSL *\
    \ SSL ensures the login credentials are being protected\n\nas they are sent to\
    \ a verified business endpoint. It is the basis of a secure communica­\n\ntion\
    \ and should be used instead of alternative methods. Even if an alternative method\n\
    \nproved to be cryptographically secure, that method will not be understood or\
    \ trusted\n\nby the end user. The only confidence would be given to the developer,\
    \ and that would\n\naccomplish nothing in terms of establishing user trust and\
    \ confidence. SSL certificates\n\nare the established method which end users understand\
    \ and trust. When considering\n\nencryption options, this is often overlooked.\n\
    \n*Always Regenerate a Session ID on Successful Authentication * Intercepting\
    \ and using a\n\n­session ID depends on the window of time that the session ID\
    \ is valid. Regenerating\n\na session ID, and invalidating the old ID after a\
    \ user authenticates with a pass­\n\nword removes the window of opportunity to\
    \ the attacker. If an attacker gains a\n\nvalid session ID, the password would\
    \ still be unknown if proper checks are put in\n\nplace. Invalidating the old\
    \ ID locks the attacker out because the password is not\n\nknown.\n\nFrequent\
    \ session ID regeneration severely limits windows of opportunity for ses­\n\n\
    sion theft and is a best practice. It is not necessary to regenerate an ID for\
    \ every page\n\nrequest. This can make it difficult to build an application, as\
    \ an invalidated session can\n\nbecome hard to track down."
