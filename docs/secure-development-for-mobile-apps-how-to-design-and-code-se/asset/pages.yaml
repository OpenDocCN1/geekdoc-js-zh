  md: "**188**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n60 minutes ago may\
    \ expire a user in the same time zone as the server, but not a user\n\nin a different\
    \ time zone. Set expiration time to be one second past Unix epoch time to\n\n\
    guarantee expiration of the cookie.\n\nset\acookie(\"CookieName\", \"CookieValue\"\
    , **1**, '/');//one second past\n\nepoch\n\n*Explicitly and Immediately Destroy\
    \ Session on Suspicious Activity * Explicitly destroying\n\nsession data requires\
    \ a few manual steps.\n\n1. The session array variables need to be destroyed before\
    \ they are saved to ses­\n\nsion storage.\n\n2. The session storage file or record\
    \ needs to be destroyed.\n\n3. The session cookie needs to be deleted via expiration.\n\
    \nThe following code demonstrates how to accomplish this.\n\n<?php\n\nfunction\
    \ logout()\n\n{\n\n//destroy the session variables via unset()\n\n**unset**($_SESSION);\n\
    \n//destroy the session file or record\n\n**session_destroy**();\n\n//expire the\
    \ session cookie in the browser\n\n//even if browser does get closed\n\n//set\
    \ time to one tick past unix epoch time\n\n//to\a force expiration regardless\
    \ of server/client time\n\nzone diff\n\n**setcookie**(\"CookieName\", 'CookieValue',\n\
    \n1, //set time to one tick past unix epoch\n\n'/');\n\n}\n\n?>\n\nIn this code,\
    \ the session variables are destroyed by calling unset() on the\n\n$_SESSION array,\
    \ which lets the PHP garbage collector reclaim the memory.\n\nThis is done before\
    \ session_destroy() which destroys the session SQL record\n\nor session file depending\
    \ on how session storage is configured. Finally, the browser\n\ncookie needs to\
    \ be expired in order to delete. There is no direct way to delete a browser\n\n\
    cookie. To avoid time zone issues, set the cookie expiration far enough back into\
    \ the\n\nfuture to ensure its expiration.\n\nA few common methods that do not\
    \ work are:\n\n• unset($_COOKIE)\n\n• setcookie(\"sid\", \"\", 0)\n\n• setcookie(\"\
    sid\", \"\", time() - 3600)"
