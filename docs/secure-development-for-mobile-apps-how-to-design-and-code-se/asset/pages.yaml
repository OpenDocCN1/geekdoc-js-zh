  md: "**254**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n$formFields['username']\
    \ = \a**mb_substr**($_POST['username'], 0, 40,\n\n\"UTF-8\");\n\nNote the use\
    \ of mb _ substr() and the setting of UTF-8 for completeness.\n\nmb _ substr()\
    \ is not exactly required for this case, but it begins the process of\n\ntreating\
    \ all strings as Unicode strings, and makes it easier if username is changed to\n\
    \nallow Unicode characters.\n\n*Double Encryption of User Passwords*\n\nThe second\
    \ sanitization action is completely destructive. Both the password, and the\n\n\
    password confirmation are hashed and then originals are destroyed.\n\n$formFields['passwordOrig']\n\
    \n= \a**hash**('sha256',\n\n$_POST['passwordOrig']);\n\n$formFields['passwordConfirm']\
    \ = \a**hash**('sha256', $_\n\nPOST['passwordConfirm']);\n\nThis accomplishes\
    \ a few goals for security. Because the hashing process is essen­\n\ntially a\
    \ sanitization process, there does not need to be any filtering for password char­\n\
    \nacters. The output of hash() will consist only of characters 0–9 and a–f. This\
    \ means\n\nthat the user can enter anything without restriction for a password.\
    \ For example, an\n\n­unrestricted user password of\n\n\"¼\\xE¯(UˆÙ\\x1A;4Ÿ€'\
    \ L^©ÜWE_¼å\\x1A…½«–£ö´ã\"\n\nafter hashing becomes\n\n\"32231332840fd50a6e650d346f1eb01e113a41440edd44510ccfe22201a48635\"\
    \n\nThe above example, before hashing, might just be the world’s safest password,\
    \ but it\n\nis binary dangerous to anything else. After hashing, it is harmless.\n\
    \nPassword length is also not a factor. Any size password is hashed into 64 characters.\n\
    \nIt also means that the clear text password is never left around to be accessed\
    \ by the\n\napplication or by hackers. It comes in over SSL, is hashed and immediately\
    \ destroyed.\n\nThe hash becomes the representation of the password for the entire\
    \ application. This\n\nhash will later be properly encrypted with Blowfish before\
    \ storage in the database, and\n\nif somehow the database is cracked, the attacker\
    \ has only gained the hashes. *This is*\n\n*double encryption of the user’s password.*\n\
    \nThe next sanitization step is cutting the email address down to 100 characters,\
    \ and\n\nrunning it through filter _ var() with the sanitization flag. Both of\
    \ these are\n\npotentially destructive processes, as they both remove data. Again,\
    \ the data coming\n\nfrom the client should already be properly prepared. This\
    \ process is simply enforcing"
