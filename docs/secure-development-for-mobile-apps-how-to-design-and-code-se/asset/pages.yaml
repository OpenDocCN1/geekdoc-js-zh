    **PHP Essential Security**


    the session data to database storage to avoid being stored in a common temp directory,


    which it is by default on most shared server setups. This can be accomplished
    by cus­


    tomizing the session handler via session_set_save_handler(); session data


    can also be encrypted.


    *Protect against CSRF Attacks*


    Forms are one of the first user elements created, and since CSRF protection


    must be included in each critical form, this is listed higher than SQL injection


    ­protection in terms of implementing first. Injection protection comes after the
    form


    has been received. It is good to validate the form request itself with a one-time


    identifier called a *nonce*, which is a newly generated identifier embedded in
    the


    form for each request. Forms with an invalid nonce should not have their request


    processed.


    *Protect against SQL Injection Attacks*


    SQL injection is currently one of the highest security risks and must be addressed
    by


    the software design. With modern PHP, 5.2 and greater, PDO prepared statements


    should be the mechanism of choice for secure database access. SQL injection alters


    SQL statements. Prepared statements are automated methods which prevent SQL


    statements from being altered, and using them exclusively should, by design, be
    the


    application’s primary defense.


    *Protect against XSS Attacks*


    Cross-Site Scripting (XSS) attack vectors are based on exploiting HTML code injec­


    tion via an application’s unescaped output stream. XSS is currently a widespread
    high-


    risk attack vector, and demands attention be paid to it from a development perspective.


    This requires knowing what kind of output is being displayed in which parts of
    the


    HTML page. Some questions that must be answered by the software design are:


    Is data going to the JavaScript Engine? Is data being displayed as links in the
    HTML?


    Are URL links being assembled via untrusted user input? And by which path is the


    untrusted user data being output to the HTML?


    *Protect against File System Attacks*


    An application needs to also take steps to protect the files system. Uploading
    files,


    ­pictures, movies, music, etc. is an essential service that many applications
    need to


    ­provide to their users. Implementing a secure file upload system, while disabling


    important system calls is an important part of the software design.'
