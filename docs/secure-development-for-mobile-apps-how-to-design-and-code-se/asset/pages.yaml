  md: "**148**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n//define the interface\
    \ to used by all strategies\n\ninterface ContextInterface {\n\npublic function\
    \ display($data);\n\n}\n\n//implement the first strategy that knows about HTML\n\
    \nclass displayHTML implements ContextInterface {\n\npublic function display($data)\
    \ {\n\necho htmlentities($data, ENT_QUOTES, \"UTF-8\");\n\necho \"\\n\";\n\n}}\n\
    \n//implement the second strategy that knows about URLs\n\nclass displayURL implements\
    \ ContextInterface {\n\npublic function display($data) {\n\necho urlencode($data);\n\
    \necho \"\\n\";\n\n}}\n\n//implement the third strategy that knows about both\
    \ HTML and URL\n\nclass displayBOTH implements ContextInterface {\n\npublic function\
    \ display($data) {\n\necho htmlentities(urlencode($data), ENT_QUOTES, \"UTF-8\"\
    );\n\necho \"\\n\";\n\n}}\n\n//implement a wrapper class for raw data\n\n//this\
    \ façade gives the strategy objects in interface to act on\n\nclass ProtectedData\
    \ {\n\nprivate $data;\n\nfunction_construct($rawData) {\n\n$this->data = $rawData;\n\
    \n}\n\nfunction getData() {\n\nreturn $this->data;\n\n}}\n\n//create data objects,\
    \ one with embedded single quote\n\n$good = new ProtectedData(\"Tim O'Reilly\"\
    );\n\n$bad = new ProtectedData(\"Tom Riddle\");\n\n//instantiate several output\
    \ strategies\n\n$_H = new OutputStrategy(HTMLOUT);\n\n$_U = new OutputStrategy(URLOUT);\n\
    \n$_B = new OutputStrategy(BOTHOUT);\n\n//output the data objects via the correct\
    \ strategy for the job\n\n$_H->display($bad->getData());\n\n$_U->display($good->getData());\n\
    \n$_B->display($good->getData());\n\n?>"
