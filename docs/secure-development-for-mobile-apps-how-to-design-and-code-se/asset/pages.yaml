    \ string\n\n**cURL_setopt**($ch, cURLOPT_POSTFIELDS, $nvpRequest);\n\n//execute\
    \ PayPal SSL Post request and save response\n\n$ppResponse **= cURL_exec**($ch);\n\
    \nif(!$ppResponse)\n\n{\n\n//log errors privately - don't return details to user\n\
    \nlog\aPayPalError(\"$methodName Failure: \".**cURL_**\n\n**error**($ch).'--\n\
    \n'.**cURL_errno**($ch));\n\nreturn false;\n\n}\n\n//parse response into array\n\
    \n$ppResponseArray = **explode**(\"&\", $ppResponse);\n\n//init array to hold\
    \ processed elements\n\n$ppParsedResponseArray = **array**();\n\n//extract elements\
    \ into array\n\n**foreach** ($ppResponseArray as $key => $value) {\n\n$temp =\
    \ **explode**(\"=\", $value);\n\nif(**sizeof**($temp) > 1) {\n\n$ppParsedResponseArray[$temp[0]]\
    \ = $temp[1];\n\n}\n\n}\n\nif((0 == sizeof($ppParsedResponseArray))\n\n|| !**array_key_exists**('ACK',\
