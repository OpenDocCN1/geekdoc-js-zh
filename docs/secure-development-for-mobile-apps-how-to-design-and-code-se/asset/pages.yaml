  md: "**184**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nAn example of using\
    \ the ini_set() function to set a session cookie for HTTP\n\nonly is:\n\nini_set('session.cookie_httponly',\
    \ 1);\n\nAnother important consideration is session storage. Is session storage\
    \ in a com­\n\nmonly shared temp directory such as/tmp or in a private application\
    \ directory? This\n\ncan be changed in php.ini.\n\nsession.save_path = '/secureapp/sessions'\n\
    \nOr, is session storage in a MySQL server table? Will session data be encrypted\n\
    \nor not?\n\n*Enable a Highly Unpredictable Session ID * PHP has very good session\
    \ ID generation\n\ncapabilities and it should be trusted to do that task. It is\
    \ not necessary for good\n\n­security to override the built-in mechanism with\
    \ a different one.\n\nPHP provides a few tools for increasing the strength of\
    \ the session ID in terms of\n\nrandomness, ID size, and character space. These\
    \ settings are:\n\n• session.entropy_file\n\n• session.entropy_length\n\n• session.hash_function\n\
    \n• session.hash_bits_per_character\n\nThe session.entropy_file setting specifies\
    \ the source of randomness.\n\nIt should be set to /dev/urandom, and not /dev/random.\
    \ /dev/urandom is\n\nUNIX’s highest source of randomness. Session.entropy_ length\
    \ should also be\n\nset high to provide more bits. Session.hash_function should\
    \ be set to SHA256\n\nor better, and not MD5 or SHA1\\. These hashes are now outdated.\
    \ Session.hash_\n\nbits_per_character should be set to at least level 5, which\
    \ uses a larger charac­\n\nter space to increase ID session strength. Using level\
    \ 6 uses even more character bits,\n\nwhile at the same time reducing the number\
    \ of actual characters. A shorter session ID\n\nlength with a higher bit density\
    \ could be beneficial in reducing session ID column size\n\nand keeping more session\
    \ records in active memory if traffic levels warrant it. It also\n\nmay not be\
    \ enough of a size difference to matter.\n\nIncreasing the randomness, the hash\
    \ strength, and the bit count of the session ID\n\ngreatly increases its resistance\
    \ to brute force guessing.\n\nA strong session ID should look like:\n\nLmEk8ixHfMwXbPJJjvMWBAW,Nedq9t-MaGioNPBGqV2\n\
    \nThe above ID is the result of setting session.hash_bits_per_­character\n\n=\
    \ 6, session.hash_function to sha256, and session.entropy_file\n\nto/dev/urand."
