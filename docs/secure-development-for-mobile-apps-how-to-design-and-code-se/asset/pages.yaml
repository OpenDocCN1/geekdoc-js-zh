  md: '**149**


    **Template Strategy Patterns**


    Raw program output:


    Tom Riddle


    Tim+O%27Reilly


    Tim+O%27Reilly


    The first name is unaltered, as there was nothing to escape for straight HTML
    context.


    The second and third names contain escape sequences for URL and HTML. The space


    in the name has been replaced with a “+”. The single quote has been replaced with
    “%27”.


    The OutputStrategy class creates a strategy implementation based on context.


    The switch statement is used to make the decision about which strategy object
    to


    ­instantiate. It then stores this strategy internally. In this case, there are
    three strategy


    classes to choose from, displayHTML, displayURL, and displayBOTH. The class


    also implements a display function whose purpose is to activate the strategy when


    needed.


    Next, an interface, ContextInterface, is declared so that all the strategy classes


    have a common interface, so they will be activated the same way regardless of
    who the


    activator is. This provides powerful decoupling of objects and functionality,
    allowing


    implementation changes to be made without breaking the code.


    Next, each strategy is declared as implementing the ContextInterface interface,


    which forces each strategy to implement the display() function. This completes


    the framework which provides the generic functionality needed to achieve a flexible


    strategy choice.


    Specific implementations are next. Each class, displayHTML, displayURL, and


    displayBOTH has a concrete implementation for its strategy. displayHTML has


    the job of securely escaping output for display in the HTML of a browser, so it
    calls


    any and all functions needed to prepare the data for this context. In this case,
    only


    ­htmlentities() is needed. displayURL needs to call urlencode() to prepare


    data and a URL parameter. displayBOTH is more complex in that it has the job of


    creating a safe link for use in an HTML page, so it needs to first call urlencode(),
    to


    escape the link, then send the output of that escaping process into ­htmlentities()


    which makes it safe for display in the HTML page. At this point data can be sent
    to


    the right strategy for safe output.


    There is room for improvement in this class. First, the data object needs to get


    its own data, which makes for a verbose call. Second, greater flexibility is needed


    for other types of data objects that need to be safely displayed. This is accomplished


    with one improvement in the next section.


    *Improved Escaping Strategy Class*


    To improve the flexibility of our strategy class and increase the number of different


    types of objects that can be output via the strategy classes, an interface needs
    to be


    created and implemented by all data objects, as shown here.'
