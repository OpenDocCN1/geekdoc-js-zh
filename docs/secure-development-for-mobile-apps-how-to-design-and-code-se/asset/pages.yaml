    **Understanding Secure Web Development**


    The popularity of mobile devices now makes programming mobile applications as


    critical as programming desktop browser applications were just yesterday. Social
    media


    goes hand in hand with being mobile and so the race is on to build better and
    better


    apps that do more and more with smaller and smaller screens. This means collecting


    data from various places in cyberspace, making it look great, and then sending
    data


    to various other places in cyberspace. What is this data? Where is it coming from?


    Where is it going? What is it doing? This is the security problem.


    Building a mobile application almost always starts first with building a service
    that


    speaks HTML to manage the majority of the processing needs, and the mobile app


    is the client who renders the layout of this newly organized stream of cool data
    chaos.


    It is the job of the developer to understand and account for this chaos, and to
    use all


    tools at his disposal to tame it into submission. It is a large task. Security
    depends on


    doing the correct thing at the right time, consistently. This book shows you how
    to


    leverage all tools available to help you, the developer, in creating reusable
    code that is


    ­consistent with security matters.


    *What This Book Is*


    The goal of this book is to bridge the gap between understanding security problems


    and creating application designs that incorporate security from the beginning.


    Many tools are available to a PHP developer in his fight against security attacks,


    some of which might not be obvious. These tools include built-in PHP language
    func­


    tions, object-oriented architecture constructs, software design patterns, and
    ­testing


    methodologies. Every one of these tools is an established method you can trust,
    and


    all can be combined in powerful ways to create reusable toolkits that make security
    an


    integrated part of the development process and not just an afterthought.


    There are many books that address security issues and do a very good job of explain­


    ing the problems and providing short example snippets. However, security is often
    one


    of the last chapters in a development book, and doesn’t address security as an
    integral


    aspect of application architecture. A byproduct of this seems to be the unfortunate'
