  md: "**68**\n\n**Secure Development for Mobile Apps\uFEFF**\n\ncontext each and\
    \ every time. This process needs to ensure that output is encoded, and\n\nquoted\
    \ correctly for each context. This includes HTML, URLs, URL parameters,\n\nJavaScript,\
    \ JSON, and CSS.\n\n*Database Access Pattern*\n\nSince SQL injection is such a\
    \ widespread problem, attention has to be paid to it.\n\nA database access pattern\
    \ is a tool for a developer to gain control over SQL. A simple\n\nform of this\
    \ pattern is a global application object, a singleton pattern that contains all\n\
    \nthe SQL statements an application needs. The first goal this achieves is the\
    \ consoli­\n\ndation of SQL statements into one location, making tracking and\
    \ refactoring a great\n\ndeal easier. The second goal this achieves is a clearer\
    \ security perspective. It is much\n\neasier to find and correct problems “correctly”\
    \ with all the statements in one place.\n\nOne is much less likely to miss something\
    \ if one doesn’t have to hunt down all the\n\nplaces a SQL statement could be\
    \ hiding.\n\n*Application Secrets Location Pattern*\n\nThe basic measure is to\
    \ include account names and passwords in a file located outside\n\nof the web\
    \ root directory. Other files should load this file via a dot dot include pattern\n\
    \nsuch as \"..\\inc\\secrets.inc\" pattern. It is wise for main classes to be\
    \ outside the\n\nweb root as well, and that the only files in the web root are\
    \ main application entry\n\npoints such as index.php and support files.\n\n*Error\
    \ Processing Pattern*\n\nThere should be a consistent pattern for handling errors\
    \ that occur. Handling errors\n\nin the same fashion helps ensure good handling.\
    \ Error messages, response logic, and\n\nlogging are part of the system. The logic\
    \ for local errors, and the logic for global\n\nerrors need to be put in place.\
    \ A good error system should handle errors in stride and\n\nkeep the system going\
    \ forward, and prevent it from falling down. If a fatal error does\n\noccur, the\
    \ details of the event definitely need to be recorded, but this is an extra step\n\
    \nthat needs to be included in the code via the register_shutdown_function()\n\
    \nfunction.\n\nThere is a choice in PHP between error functions and exception\
    \ handling. This\n\nbook employs exception handling. Part of that choice entails\
    \ mapping errors into an\n\nexception handling mechanism.\n\nThe other decisions\
    \ that need to be made regard what constitutes an error. There\n\nare errors that\
    \ are recoverable, and those that are not recoverable. Deciding what\n\nstops\
    \ the application from continuing is a very important architectural decision\n\
    \nthat affects the entire application, both from a security standpoint and a usability\n\
    \nstandpoint."
