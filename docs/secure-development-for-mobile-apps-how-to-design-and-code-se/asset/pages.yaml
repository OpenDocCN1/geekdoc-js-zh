  md: "**302**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*JavaScript Validation\
    \ via Regular Expressions*\n\nJavaScript has three main, very simple methods of\
    \ implementing regular expressions.\n\nThe first is Regular Expression objects,\
    \ which is simply an object set as an actual\n\nexpression, such as:\n\nvar usernameRegEx\
    \ =/^[\\w\\.-]+$/;\n\nHere the variable usernameRegEx is set to the expression\
    \ /^[\\w.-]+$/, which\n\nwill match any word character as well as a period or\
    \ dash character. Once set, these\n\nobjects are very easy to use; just call its\
    \ test method with the object to be tested.\n\nThe text value of this object will\
    \ be compared against the expression assigned to the\n\nexpression object and\
    \ return true or false.\n\nIf(usernameRegEx.test(input))\n\nreturn true;\n\nThe\
    \ second method is to call the match method of a variable and pass it an expres­\n\
    \nsion object containing the expression to be matched. match() will return true\
    \ or false.\n\nif(input.match(usernameRegEx))\n\nreturn true;\n\nA third method\
    \ is using the expression directly to form an expression object.\n\n/^[A-Za-z0-9!@#$%^&*()_]{8,}$/i.test(value);\n\
    \nHere, a regular expression, /^[A-Za-z0-9!@#$%^&*()_]{8,}$/I, itself is instan­\n\
    \ntiated directly as an object, with its test method immediately invoked with\
    \ the value to\n\ntest. This is one of the methods that is used next to add custom\
    \ rules to jQuery.\n\nBelow are several common examples of implementing validation\
    \ with regular\n\nexpression using both types of JavaScript methods.\n\n**Note:** \
    \ Regex credit to Rex@rexegg.com. For a complete examination of regulation\n\n\
    expression building for passwords, see http://rexegg.com/regex-lookarounds.html.\n\
    \n*Using JavaScript Regular Expression Objects*\n\nvar usernameRegEx =/^[\\w\\\
    .-]+$/;\n\nvar passwordRegEx =/^[.]{8,}$/;\n\nvar emailRegEx\n\n=\a/^[a-zA-Z0-9._-]+@([a-zA-Z0-9.-]+\\\
    .)+\n\n[a-zA-Z0-9.-]{2,4}$/;\n\nvar numRegEx\n\n=/^\\d+$/;\n\nvar phoneRegEx\n\
