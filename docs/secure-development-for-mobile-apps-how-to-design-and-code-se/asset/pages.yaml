  md: "**174**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nWith different types\
    \ of exceptions, separate catch statements can be chained to deal\n\nwith each\
    \ type separately. A catch statement will catch the type of exception declared\n\
    \nin its parameter list. This includes the base class. Since MemberException is\
    \ also an\n\nException, catch(Exception) will catch it. catch will catch objects\
    \ in order of\n\nmost derived class to least derived, so the order of multiple\
    \ catch statement matters.\n\nHere is an example.\n\ntry {\n\n$user = new Member(500);\n\
    \n}\n\ncatch(MemberException $ex) {\n\n$ex->getCode();\n\n}\n\ncatch(Exception\
    \ $ex) {\n\n$ex->getCode();\n\n}\n\nIn this case, since a MemberException was\
    \ thrown in Member::valideName(),\n\ncatch(MemberException $ex) is the one that\
    \ gets called, because it is the most\n\nderived class. If the catch order was\
    \ reversed, since MemberException is also an Exception,\n\ncatch(Exception $ex)\
    \ would get called, and catch(Member​Exception\n\n$ex) would not get called.\n\
    \n**Trapping All Errors and Exceptions**\n\nPHP has two systems of tracking and\
    \ managing errors, the Error system, and the\n\nExceptions system. There are functions\
    \ that return an error code, such as fopen(),\n\nthat need to be checked, and\
    \ there are functions that throw errors which need to be\n\ncaught via catch(),\
    \ such as pdo->prepare().\n\nPHP also has two methods for dealing with both types\
    \ of unhandled errors.\n\n• set_error_handler()\n\n• set_exception_handler()\n\
    \nset_error_handler() configures PHP to call a custom function whenever it has\n\
    \nan error, and set_exception_handler() does the same for exceptions.\n\n*Converting\
    \ Errors to Exceptions*\n\nIn an object-oriented system, standard PHP errors should\
    \ be considered obsolete.\n\nPHP has a built-in class, ErrorException, specially\
    \ for converting standard error\n\n­messages, warnings, and notices into Exception\
    \ objects. This includes all the details\n\nassociated with exceptions, like a\
    \ full call stack trace."
