  md: "**232**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n• Open the session\
    \ file based on the session ID\n\n• Exclusively lock the file from other scripts\
    \ using the same ID\n\n• Read the session data from the file\n\nAs in the SecureSessionPDO\
    \ class, the session ID is checked for valid characters.\n\nBecause session.hash_bits_per_character\
    \ was set to level 6, the allowed\n\ncharacters are (0–9, a–z, A–Z, “-”, “,”)\
    \ and this is checked with a regular expression.\n\nIf level 4 of 5 was used,\
    \ then cytpe_alnum() could have been used to check the\n\ncharacters.\n\nif(preg_match('/^[-,\\\
    da-z]{27}$/i', $sessionID)\n\nThis regular expression ensures that the session\
    \ ID is in the correct format. It says,\n\na dash ‘-’ is allowed, a comma, ‘,’\
    \ is allowed, any digit, ‘\\d’ and any character a–z. The\n\n‘i’ at the end specifies\
    \ case insensitivity, so a–z is sufficient. Finally, the ‘{27}’ specifies\n\n\
    the length of the session ID token.\n\nIf this check fails, the function does\
    \ not continue to fetch data. There is no rea­\n\nson that a session ID generated\
    \ from this server would contain any other characters.\n\nTherefore an attack\
    \ attempt at poisoning the ID is presumed.\n\n**Note:**  While the above regular\
    \ expression is very explicit and ensures that the token\n\nconforms to the token\
    \ specification, another regular expression that can be used to\n\nsimply prevent\
    \ harmful characters is:\n\nif(preg_match('/^[A-Za-z0-9\\-,]+$/', $sessionID))\n\
    \nThis regular expression rejects any string that contains characters that are\
    \ not char­\n\nacters A–Z, a–z, digits 0–9, or a dash or comma.\n\nA few additional\
    \ points about regular expression building:\n\n• Tilde ~ as a delimiter is a useful\
    \ practice because slashes / too often need to\n\nbe escaped.\n\n• No need to\
    \ escape the dash—because it is at the beginning of the character class.\n\n•\
    \ The i at the end makes it case insensitive so no need for A–Z.\n\n• We match\
    \ exactly 27 characters of that class with {}.\n\nYou can test it with this:\n\
    \n<?php\n\n$sessionIDS = **array**(\"0\",\n\n//Bad format, Benign character\n\n\
    \"1234567890abcdefghil-,ABCDE\", //Correct format\n\n\"1234567890abcdefghil-,ABCDE4\"\
