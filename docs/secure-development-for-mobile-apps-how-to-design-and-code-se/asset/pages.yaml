    **UTF-8 for PHP and MySQL**


    This tells MySQL that you are sending it UTF-8 data, but should not be needed


    when a connection is opened using the connection options above.


    *PHP UTF-8 Initialization and Installation*


    UTF-8 support in PHP requires the mbstring extension be installed.


    For Windows, that means having the php_mbstring.dll file located in the


    PHP extensions directory and setting php.ini to:


    extension = php_mbstring.dll


    For Linux, this means installing php_mbstring package via apt, yum, or ­whatever


    your Linux distro package installer is.


    php.ini In order to set up the PHP engine to process UTF-8, the following


    changes need to be made to the initialization file, php.ini.


    default_charset


    = UTF-8


    mbstring.language


    = Neutral


    mbstring.internal_encoding


    = UTF-8


    mbstring.encoding_translation


    = On


    mbstring.http_input


    = auto


    mbstring.http_output


    = UTF-8


    mbstring.detect_order


    = auto


    mbstring.substitute_character


    = "**0xFFFD**"


    In order, those settings perform the following functions internally.


    1. Set default character set for auto content type header


    2. Set default language to Neutral UTF-8


    3. Set default internal encoding to UTF-8


    4. HTTP input encoding translation is enabled


    5. Set HTTP input character set detection to auto


    6. Set HTTP output encoding to UTF-8


    7. Set default character encoding detection order to auto


    8. Set replacement character for invalid characters—**critical**


    **UTF-8 Browser Setup**


    There are three ways to set the browser up for displaying and sending UTF-8\.


    The header, which is sent from PHP before any other output is sent, is the most


    important as it is the directive most respected by modern browsers. The HTML meta-


    tag embedded in the HTML page itself in the <header> section informs both the


    browser and users as to the proper character encoding. Finally, there is the HTML


    form attribute telling the browser how to send the user input back to the server.'
