    *PDO SELECT Queries and Class Objects*


    PDO also lets you return records as full-fledged objects as this example shows.


    class member {


    public $name;


    public $email;


    public $id;


    function _construct($name, $email, $id) {


    $this->name = $name;


    $this->email = $email;


    $this->id


    = $id;


    }


    function printName(){


    return $this->name;


    }


    }


    $stmt = $pdo->**prepare**(''SELECT name, email, id


    FROM members


    WHERE id = :id'');


    $stmt->**setFetchMode**(PDO::FETCH_CLASS, "member");


    $stmt->**execute**(array(''id'' = > $id));


    while($obj = $stmt->**fetch**()) {


    echo $obj->printName(); //command line output context


    }


    **Quoting Values and Database Type Conversion**


    With PDO prepared statements, there are three ways to bind parameters to the


    MySQL query statement.


    $stmt->**bindValue**(:id, $id, PDO::PARAM_INT);


    $stmt->**execute**();


    Or


    $stmt->**bindValue**(:id, $id);


    $stmt->**execute**();'
