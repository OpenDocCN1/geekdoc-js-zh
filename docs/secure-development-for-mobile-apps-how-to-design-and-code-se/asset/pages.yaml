  md: '**285**


    **Secure Forms and Account Registration**


    a user password. This hash should match the hash that was stored as a Blowfish


    encrypted hash during registration. Recall that this is a double encrypted password.


    This completes the validation of the login credentials. The $_POST array is no
    lon­


    ger needed, and so it is destroyed along with all the other global arrays to prevent
    access.


    **unset**($_POST);


    **unset**($_GET);


    **unset**($_REQUEST);


    The third and final process after creating a secure login environment and validating


    the data is to process the credentials and create an authenticated session.


    $validUser = $am->validateCredentials($userName, $password);


    if($validUser)


    {


    $sm->createAuthenticatedSession($validUser);


    $sm->redirectIt(PRIVATEPAGE);


    }


    First, the AccountManager class is asked to perform the login request with a call


    to validateCredentials() with the username and hashed password. If this


    check is successful and returns registered user record, then SessionManager is
    called


    to build an authenticated session by invoking createAuthenticatedSession()


    and passing it the newly obtained user record. After creating the session, a redirect
    is


    performed to send the request to the user’s home page, private.php, and exit the
    script.


    The default action of the page is to present a form to the user. A nonce is added
    to the


    form with NonceTracker::getNonce(). This function could be used inline with


    the HTML, however getNonce() writes the generated nonce to the $_SESSION


    array. To make a performance enhancement and close all session locks to the database


    record, it is called before the HTML or any other processing is performed, and


    the returned nonce is assigned to the variable $nonce. Once this is done, there
    is


    no more data being written to $_SESSION, so session_write_close() can


    safely be called and free the session locks. After the session is closed for writing,
    the


    HTML form is printed out. This is not a necessary step in this case, but is done
    here


    to point out a good practice of localizing session array usage session writes
    to the top


    of the script and closing the session as quickly as possible. Session data is
    still available


    for read access. With longer running tasks that use AJAX calls with session cookie,


    this can reduce wait time significantly.


    A secure login is now complete.


    **Protect Pages via Authentication Check**


    Now that a complete user is registered and can login to enable an authenticated
    ses­


    sion, this information can be used to protect the pages that need protecting.'
