    \ Code incorporates methods to secure\n\nthese various input and output streams\
    \ as they come and go from the client to the appli­\n\ncation server to the third-party\
    \ social API servers, and back again. Finally, we look at\n\nusing the latest\
    \ Facebook purchasing API and how to securely sell virtual items.\n\n*Client Technologies*\n\
    \nHTML and JavaScript have complex parsing mechanisms which are used to render\n\
    \nthe display. Because of the many different ways code can be executed in the\
    \ browser,\n\nwe look at both good practices and things to avoid. AJAX gives the\
    \ application the\n\nability to function asynchronously. It also adds its own\
    \ set of security issues. The goal\n\nis to handle the filtering of data and the\
    \ way code is executed by our mobile client each\n\ntime so that changing display\
    \ code doesn’t create new security holes.\n\n*Client Application Layout*\n\nThe\
    \ book includes a set of files and a project layout structure which contain code\
    \ that\n\nshould be consistent in every app. This essentially forms a template\
    \ for handling the\n\ndata exchanges between the client and the server. For example,\
    \ there should be one\n\nway to consistently parse, display, and execute data\
    \ returned from the server.\n\n*Server Application*\n\nThe server side of the\
    \ applications we are building take requests, serving as a proxy for\n\nthe third-party\
    \ social APIs for Facebook, GoogleMaps, YouTube, and Twitter. It also\n\nhandles\
    \ user account creation, storage, login/logout functionality, and financial trans­\n\
    \nactions. The code is designed to respond to AJAX in a secure fashion. This includes\n\
    \nvalidating direct user-supplied data, social API data, filtering data for storage\
    \ in the\n\ndatabase, and escaping the data for the correct output context depending\
    \ on where the\n\ndata is going.\n\nAnother responsibility of the server code\
    \ is to preserve protocol integrity for remote\n\nrequests. This is an issue addressed\
    \ in *AJAX Security* from Hoffman/Sullivan. The idea\n\nis that when making an\
    \ HTTPS request to a third-party remote API, steps must\n\nbe taken to ensure\
    \ that security is not downgraded by returning data over HTTP.\n\nA responsible\
    \ server acting as a proxy on a user’s behalf needs to be aware of this\n\n­situation\
    \ and account for it.\n\nAs with the client side code, the server side code also\
    \ includes files that form a\n\n­common template of code that needs to be used\
    \ in every app."
