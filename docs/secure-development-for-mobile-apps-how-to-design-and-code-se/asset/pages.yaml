  md: "**248**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nTherefore part of\
    \ the validation code could look like:\n\n$prodID\n\n= **intval**($_POST['prodID']);\n\
    \nIf($prodID > 0 && $prodID < 4000000000);\n\nIf(**ctype_alnum**($_POST['code'])\
    \ && **mb_strlen**($_POST['code']) < = 10)\n\nIf(**mb_strlen**($_POST['code'])\
    \ < = 50)\n\nBy making the product_id column UNSIGNED INT, the column will accom­\n\
    \nmodate a number between 0 and 4 billion. If UNSIGNED had not been specified,\n\
    \nthen only 2 billion positive numbers could be used, with 2 billion number reserved\
    \ for\n\nnegative use, possibly wasting space.\n\nThe two different character\
    \ set type specifications are important, and not a mistake.\n\nIt is known that\
    \ the data in the product_code column will only ever be (0–9,\n\nA–Z), so there\
    \ is no need to double the storage size. However, the product name\n\nmight contain\
    \ wide Unicode characters. The filter function chosen to filter out either a\n\
    \nsmaller, Latin character set, or a wider selection of possible Unicode characters\
    \ is also\n\ndictated by the table column specification.\n\nThe table column specification\
    \ essentially dictates what the code validation needs\n\nto do. Once data passes\
    \ through validation, it should able to be inserted into the table\n\nwithout\
    \ data loss or error.\n\nFiltering is a destructive process. Filtering should\
    \ not allow disallowed characters\n\nor sizes. If filtering destroys or partially\
    \ alters input data, the user should be alerted\n\nand given a chance for correction.\
    \ *Valid data should pass through the validation filters*\n\n*without alteration*.\
    \ Once it does, it should not be altered by any other process, or by\n\ninsertion\
    \ into the database.\n\nOnce data passes through validation filtering it should\
    \ not suffer any alteration or\n\ndestructive process. The data should be preserved.\
    \ This is where escaping comes into\n\nplay, and why escaping for context is so\
    \ important. Escaping preserves data while\n\nmaking it safe for the context it\
    \ is being sent into, preventing it from being interpreted\n\nas commands instead\
    \ of data.\n\nFiltering alters data and escaping preserves it.\n\n*Registration\
    \ Form*\n\nThe registration page handles displaying the registration form and\
    \ processing the\n\ninput to correctly register a new account. The form variables\
    \ are validated manually\n\nso that validation is very clear and that some basic\
    \ concepts are easily visible within\n\nthe process.\n\nTake note that several\
    \ different methods are applied for filtering and testing vari­\n\nables. This\
    \ is deliberate in order to show that each method is correct, but is not\n\nthe\
    \ only way. The purpose is not to introduce a framework but to reinforce differ­\n\
    \nent validation implementations. Some code is also repeated, and not abstracted\
    \ at\n\nthe expense of the Don’t Repeat Yourself (DRY) principle. This is again\
    \ deliberate,"
