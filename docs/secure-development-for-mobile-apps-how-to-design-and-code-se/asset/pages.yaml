  md: '**183**


    **Secure Session Management**


    This checklist is ordered according to the order of events as they typically occur
    in


    a PHP application. The landing page has to be chosen; assure that it is over SSL.


    Before session_start() is called, make sure that all the configuration options


    are set. Enable stronger session protection by putting PHP’s session hashing and
    ID


    generation system to work via php.ini settings. As session_start() is called,


    make sure that the session ID comes from your own server, not the user. For the


    authentication process, ensure the session cookie will only be sent over SSL and


    only via HTTP header. When the user logs in, make sure it is over a valid SSL


    connection. Once the user has logged in, regenerate the session ID, and delete
    the


    old one so that it is no longer usable via brute force guesswork. Force users
    to re-


    authenticate whenever they need escalated privileges and that again, the session
    ID


    is regenerated with the old one destroyed. Session data should always be stored
    in


    the server $_SESSION array. Never store user data in a cookie in the client browser.


    Encrypting data and placing it inside a cookie is a highly insecure practice as
    it a


    gives an attacker an unlimited amount of time to attempt decryption. Make a log­


    out option easy and available on every page. Completely destroy all session data
    on


    logout. Do not allow a cookie to expire according to the client browser, and when
    it


    may or may not close, or by what time it might be in the client time zone. Finally,


    check for suspicious input and/or tampering and immediately destroy the session,


    and enforce a logout. All these measures combined greatly raise the protection
    level


    of a user’s account.


    *Session Checklist Details*


    *Begin Session with SSL Connection * The foundation of trust between the user
    and the


    server is the SSL certificate. Authenticated login should begin over an SSL connec­


    tion to identify the server and prevent a man-in-the-middle attack. Login credentials


    should be passed over the encryption provided by the SSL certificate. SSL provides


    very high levels of encryption which should be trusted before alternative methods.


    This can be achieved in a way transparent to the user by using the code listed
    in the


    section “Force Page Request over SSL.”


    *Check Your Session Management Configuration * Session configuration must be done


    before a session is started when session_start() is called. It is a simple step


    but is sometimes forgotten. Two ways of doing this are through setting session


    ­management options in php.ini, or via ini_set() function. ini_set() always


    overrides the php.ini settings, so if there is ever any doubt about what the settings


    are in php.ini, use ini_set() to make the correct settings for your application.


    An example of using php.ini to set a session cookie for HTTP only is:


    session.cookie_httponly = 1;'
