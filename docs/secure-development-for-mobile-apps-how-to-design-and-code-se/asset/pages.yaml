  md: "**136**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n//end PHP, Begin\
    \ straight HTML\n\n?>\n\n<table border = \"1\">\n\n<tr>\n\n<th>Name</th>\n\n<th>Email</th>\n\
    \n<th>Profile</th>\n\n</tr>\n\n<?php while($row = $stmt->fetch()) {?>\n\n<tr >\n\
    \n<td>\n\n<?php _H($row['name']); ?>\n\n</td>\n\n<td>\n\n<?php _H($row['email']);\
    \ ?>\n\n</td>\n\n<td>\n\n<\aa href = \"mobilesec/profile.php?id = <?php _UH($row['id']);\n\
    \n?>\">\n\n<?php _H($row['name']); ?> Profile</a>\n\n</td>\n\n</tr>\n\n<?php}\
    \ ?>\n\n</table>\n\nThere are several important parts of this example. First,\
    \ the SELECT ­statement is\n\nprepared and called with an associative array matching\
    \ the named placeholder in the pre­\n\npared statement. Second, output escaping\
    \ functions are set up with shorthand wrappers\n\nto ease the placement of in\
    \ location output escaping in the HTML. Third, the PHP pro­\n\ncessing is separated\
    \ from the HTML. When the PHP processing ends, straight HTML\n\nis output, making\
    \ it cleaner to format, and cleaner to examine and inspect. Fourth, the\n\nPDO\
    \ statement is looped through to grab the results and place them into the HTML\n\
    \nusing inline PHP tags and being escaped in-location via the calls to the escaping\
    \ wrap­\n\nper functions _H(), and _UH(). Notice that $row['name' and $row['email']\
    \ are\n\nbeing escaped for HTML context, and that the second reference to $row['name']\
    \ is\n\nbeing escaped for two contexts. It is escaped first as a URL parameter\
    \ context as part\n\nof the anchor tags HREF attribute, and displayed in an HTML\
    \ context. Two escaping\n\nprocesses need to occur here. URLs need a different\
    \ escaping process than HTML does,\n\ntherefore the _UH wrapper first calls urlencode()\
    \ to prepare the variable for the con­\n\ntext of a URL parameter, then htmlentities()\
    \ is called to prepared it for display in\n\nthe HTML context. Fifth, notice that\
    \ the HREF attribute is enclosed by double quotes.\n\nA rundown of the security\
    \ process occurring here is as follows. urlencode()\n\n­prevents issues like spaces\
    \ in variables from becoming a parsing problem. If for\n\nexample, the $id parameter\
    \ contained the value “John Doe”, urlencode() would\n\nturn it into “John+Doe”.\
    \ After this occurs, htmlentities() will escape any HTML\n\nentities that exist\
    \ within the variable. What is wanted in this case though is to prevent"
