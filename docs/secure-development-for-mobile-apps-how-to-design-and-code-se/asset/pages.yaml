  md: "**390**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n<?p\ahp **_H**($tweet->id);?>\"\
    \ target = \"_blank\"\n\ntitle = \"Follow Tweet\"></a>\n\n</li>\n\n<?php} ?>\n\
    \n</ul>\n\n</body>\n\n</html>\n\nUsing the TweetFetcher class is quite simple.\
    \ Include the file storing the credentials,\n\ninstantiate the class by passing\
    \ the credentials to the constructor, call getTweets(),\n\nand loop through them\
    \ to display in an HTML list.\n\nThe code first calls session_start() to start\
    \ the session and retrieve session\n\ndata, followed by instantiating the class.\n\
    \n$tf = \a**new** TweetFetcher($twitterHandle, $twitterKey, $twitterSecret,\n\n\
    $twitterOauthURL);\n\nThe Twitter oAuth token is stored in the $_SESSION array\
    \ by getAuthToken(),\n\nand if present, it will be retrieved and used. If not,\
    \ the constructor will call getAuth­\n\nToken() to get a new token, and then store\
    \ it in the $_SESSION array.\n\nsession_write_close() is called as an optimization\
    \ since no other data will\n\nbe written to the $_SESSION array in this script.\
    \ The following call to get tweets\n\ncould take a while, as well as processing\
    \ each tweet, so closing the session to release\n\nlocks as quickly as possible\
    \ is a good practice.\n\n**session_write_close**();\n\n$tweets = $tf->getTweets($twitterHandle,\
    \ 5);\n\nAfter calling getTweets(), PHP is closed so that HTML will be output\n\
    \ndirectly without using echo or print statements. This keeps PHP and HTML\n\n\
    nicely separated as well as keeping the HTML nicely formatted. Note that the\n\
    \nHTML meta-tags set the document type as HTML5, and set the character set as\n\
    \nUTF-8\\. HTML ID and Class attributes are used so that the document is easily\n\
    \nstyled via CSS.\n\nThe last step is to display each tweet as a list item. This\
    \ is done with inline PHP\n\nstatements in a foreach loop.\n\n<?php\n\n**foreach**($tweets\
    \ as $tweet){\n\n$tweetHTML = processTweet($tweet->text);\n\n?>\n\nEach tweet\
    \ from the $tweets array is sent to processTweet() to have the\n\nstatic plain\
    \ text of the tweet transformed into a safely displayable HTML message.\n\nEach\
    \ tweet is then displayed as an HTML list item inside the unordered list, tweets."
