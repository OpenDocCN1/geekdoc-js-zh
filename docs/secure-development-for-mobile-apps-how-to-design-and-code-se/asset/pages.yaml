  md: "**74**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Proper Error Handling*\n\
    \nAutomated error handling is an essential way to monitor and correct system problems.\n\
    \nWithout it, handling errors becomes very difficult. Detailed errors need to\
    \ be logged\n\nand emailed to the developer/maintainer. This includes file name,\
    \ line number, date/\n\ntime, and call stack. Error situations need to be communicated\
    \ to the user in such a way\n\nas to impart understanding or corrective action\
    \ without providing any error detail.\n\nProduction mode needs to set php.ini\
    \ to display_errors is off. display_\n\nstart_up_errors, error_reporting, and\
    \ log_errors must be set to on so\n\nthat errors are always logged behind the\
    \ scenes. Error handling needs to be providing\n\nthe users with acceptable directions.\
    \ Log errors; put users at ease. The PHP exception\n\nhandling system is the preferred\
    \ method to accomplish both these tasks.\n\n**OWASP Recommendations for PHP**\n\
    \nThe following list is in no particular order. It simply represents the order\
    \ this author\n\ntends to think things through in the software design phase. Each\
    \ element is impor­\n\ntant to the total protection of the application. Neglecting\
    \ or poorly implementing any\n\none part weakens the protection as a whole. Please\
    \ make it a habit to continually refer\n\nto the OWASP PHP Cheat Sheet (see URL\
    \ in the Reference section) to stay updated.\n\nMany experts continually contribute\
    \ the latest information as security issues evolve.\n\n*The Checklist*\n\n• Upgrade\
    \ to PHP 5.4+. Version 5.2 is now officially unsupported.\n\n• Enforce UTF-8 everywhere—PHP,\
    \ MySQL, Text, HTML, JavaScript,\n\nemail, URL.\n\n• Use PHP’s highest levels\
    \ of session ID generation and hashing.\n\n• Login over SSL.\n\n• Use modern strength\
    \ cryptography with CSPRNG quality salts (Blowfish,\n\nRijndael256, openssl_random_pseudo_bytes(),\
    \ DEV_URANDOM, etc.).\n\n• Store hashed, then encrypted passwords—not clear text\
    \ passwords.\n\n• Use cookies only via session.use_only_cookies = 1.\n\n• Use\
    \ HTTP-Only cookies via session.cookie _ httponly = 1.\n\n• Use secure cookies\
    \ over SSL for login process via session.cookie _\n\nsecure = 1.\n\n• Avoid shared\
    \ session storage. Use custom session handler for secure storage.\n\n• Avoid session\
    \ fixation by regenerating session ID on authentication/\n\nauthorization.\n\n\
    • Set and enforce session expiration on critical actions—general timeout, inac­\n\
    \ntivity periods.\n\n• Make logout button available to users at all times.\n\n\
    • Properly delete all session data/unset cookies immediately on logout."
