  md: '**9**


    **Introduction to Mobile Security Development**


    want to pay for security specifically, so this is what gets bumped to the back
    of the


    line. Security is also usually the last section of beginning programming books,
    which


    seems to convey a train of thought that security is dealt with last, and this
    seems to


    carry over in practice. It is much more difficult and costly to add security last,
    yet


    that is the most common practice in development shops around the world. The main


    goal of this book is to introduce some ideas, techniques, and tools that enforce
    secure


    development right from the start.


    *Lack of Information*


    This is a big one, as it’s always changing at a rapid pace. One example of lack
    of


    ­understanding is a question posted on the web asking if the following code was
    OK:


    function cleanVar($var)


    {


    $var = addslashes($var);


    $var = mysql_real_escape_string($var);


    return strip_tags($var);


    }


    I sympathize with this question as it conveys a real sense of, “I just want clean
    data”


    and to get on with my work. The question highlights the current problems faced
    by all


    web developers. What is the context? What data type is it? Where is it going?
    Here,


    ­addslashes() could be using the default PHP internal character encoding, and


    mysql_real_escape_string() is using the MySQL client connection char­


    acter set, and these could be both different from each other and possibly overstepping


    and undoing each other. strip_tags() may effectively remove HTML bracket tags


    from the string, but it won’t remove JavaScript. If the newly cleaned variable
    is inserted


    into HTML, unintended JavaScript could be executed. Applying numerous filters


    without answering the above questions does not help and gives a false sense of
    security.


    *Lack of Consistency*


    Simple forgetfulness is also a primary cause of problems. OWASP specifically


    addresses this in their recommendation to stop using the PHP function mysql_


    real_escape_string() because it is too hard to remember to use it in all places


    at all times. Their advice is not unfounded. However, there are times when it
    must be


    used, either in legacy code or in situations where prepared statements cannot
    be used,


    (and there are, such as when column names need to be dynamic), so other mecha­


    nisms are needed that help prevent the developer from forgetting. This book examines


    in detail several tools available for this task, including software pattern constructs


    like Facades and Templates, and Test Driven Development (TDD) techniques using


    PHPUnit.'
