  md: "**59**\n\n**PHP Security Anti-Patterns**\n\nEven cleaner—straight HTML using\
    \ only single quotes:\n\n<i\anput type = 'hidden' name = 'key' value = '<?php\
    \ _H($key); ?>'/>\n\nUsing the first *cleaner* method, enclosing the PHP variable\
    \ $key in brackets, makes\n\nit easier to see that HTML attributes are quoted\
    \ properly within the string.\n\nUsing the second, *even cleaner* method, where\
    \ HTML is output directly without\n\necho statements is very helpful. Note that\
    \ the only quotes in the entire line are the\n\nsingle quotes surrounding the\
    \ attribute values. This is why it is easier to visually exam­\n\nine this line\
    \ of code. Note also that the variable $key is output escaped inline via\n\n_H()\
    \ as it is being output into the UTF-8 HTML context.\n\nBy moving HTML out of\
    \ PHP and avoiding echo statements, HTML can be\n\nformatted, structured better,\
    \ and highlighted by the editor, which greatly improves\n\nvisual clarity.\n\n\
    **Note:  _H()** is a facade function wrapping htmlentities($data, ENT_QUOTES,\n\
    \n'UTF-8') which escapes and echoes the output.\n\n*Raw Request Variables as Application\
