    **Handle Fatal Errors with** **register_shutdown_function()**\n\nThe register_shutdown_function()\
    \ lets you specify a custom ­handler\n\nfunction for errors that are causing the\
    \ script to shutdown, and to log errors\n\nor do any cleanup. This function is\
    \ not recoverable. It means there is a fatal error\n\nwhich has ended the script,\
    \ and no back trace information is available, only error\n\nnumber, ­message,\
    \ file name, and line number. Once inside this function, record\n\ndata and exit.\n\
    \nIt is important to note that this function is called every time a script ends,\
    \ so it is\n\nimportant to ensure it always processes quickly. The way to do this\
    \ is to call error_\n\nget_last() first, and check the return value. If null,\
    \ then there were no errors, and\n\nthe shutdown is normal. Clean up and logging\
    \ can be skipped. If there is an error,\n\nthen error processing should be triggered.\
    \ This way, when there are no errors, no extra\n\nprocessing is performed, and\
    \ no time penalty introduced.\n\nIn the code for the finalShutdown() function\
    \ below, there are three conditions\n\nthat are checked for on shutdown, and the\
    \ order is important. First is a check to see if\n\nthere is an error; if so,\
    \ then second, there is a check on the global PDO handle, and if\n\nit exists,\
    \ then third, there is a check to see if a PDO Transaction is in progress. If\
    \ so,\n\nthen it needs to be rolled back. Next, the type of error returned is\
    \ checked to see if it\n\nis a system error, or a user-triggered error, with the\
    \ ­ability to ­handle or log each kind\n\nseparately. The last step is to log\
    \ error type, ­message, file name, and line number to the\n\nerror log via error_log()\
    \ to record the event.\n\nRegister_shutdown_function() then registers finalShutdown()\
    \ as the\n\nfunction to be called every time the script ends, regardless of whether\
    \ it is a clean end\n\nor a fatal error."
