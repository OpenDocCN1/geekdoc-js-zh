  md: "**191**\n\n**Secure Session Management**\n\n*Detecting Session Tampering*\n\
    \nTwo methods for detecting session tampering and whether a session ID is\n\n\
    ­coming from a legitimate user and hasn’t been stolen are to check the IP address\n\
    \nof the user and  the information coming from the user’s browser called the\n\
    \n*HTTP_USER_AGENT*.\n\nIP address checking is unreliable because it can legitimately\
    \ change without the\n\nuser knowing it because dynamic routers, proxies, and\
    \ firewalls can change it any\n\ntime. This does not constitute a theft or tampering.\
    \ User agent checking is more reli­\n\nable, as this information does not dynamically\
    \ change. Usually only a browser upgrade\n\ncauses the agent information to change.\
    \ This is the method recommended here.\n\n*User Agent Validation * Tracking user\
    \ agent information is a popular method for\n\ndetecting session tampering or\
    \ theft. The user agent identification string should never\n\nchange during a\
    \ session, and there is no legitimate reason for it to change. While an\n\nIP\
    \ address may legitimately change due to a router or firewall, user agent information\n\
    \nshould remain static over the duration of a session. If the browser closes,\
    \ the session,\n\nby default, would also close.\n\nUser agent information is supplied\
    \ by the user’s browser and can be spoofed. It\n\ncannot be trusted. The reason\
    \ it works as a validation check is not because it can be\n\ntrusted, but because\
    \ a legitimate user does not alter this information during the course\n\nof a\
    \ session, and therefore it serves as an indicator of tampering.\n\nAn example\
    \ user agent string obtained from the HTTP_USER_AGENT\n\nserver variable:\n\n\"\
    Mo\azilla/5.0 (compatible; MSIE 10.0; Windows NT 6.1; WOW64;\n\nTrident/6.0)\"\
    \n\nThe reasons user agent strings are good for monitoring are that:\n\n1. User\
    \ agent strings are make and version dependent for each browser.\n\n2. A session,\
    \ by default, is only valid for the duration of the opened browser.\n\nAgain,\
    \ this makes it highly unlikely that a legitimate reason exists for a user agent\n\
    \nstring to change—checking it gives confidence that changes indicate session\
    \ tamper­\n\ning without false positives.\n\nNext is an example of how to check\
    \ and validate a user agent string for a session.\n\n*Detect User Agent Changes—Best\
    \ Practice Tamper Protection*\n\n//set user agent when user is authenticated\n\
    \nif(authUser)\n\n{\n\nif(isset($_SERVER['HTTP_USER_AGENT'])\n\n&& !empty($_SERVER['HTTP_USER_AGENT']))"
