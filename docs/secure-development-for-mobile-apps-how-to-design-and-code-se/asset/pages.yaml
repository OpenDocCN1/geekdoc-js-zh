  md: "**141**\n\n**PHP and PDO**\n\n//\aeven if column name was real, we still DO\
    \ NOT ALLOW direct user\n\ninput\n\n//we use indirection to always insert our\
    \ values\n\n$sql = \"SELECT {$colNames[$goodColumn]} FROM members WHERE id = :id\"\
    ;\n\n$stmt = $pdo->**prepare**($sql);\n\n$stmt = $pdo->**bindValue**(:id, $id,\
    \ PDO::PARAM_INT);\n\n$stmt = $pdo->**execute**();\n\n}\n\nThis code example has\
    \ a function, buildSecureSQLColumns(), which takes\n\ntwo parameters, a column\
    \ name, and a user ID. It uses an array of hard-coded column\n\nnames to choose\
    \ from. These are the only valid choices. User input is compared to the\n\narray\
    \ to verify that a choice is valid. Invalid choices are rejected. Even when a\
    \ selection\n\nis valid, user input is not directly inserted into the SQL statement\
    \ construction; only\n\nthe developer code is inserted via the returned array\
    \ key. Only the array code is used to\n\nbuild the SQL statement. Finally, the\
    \ user ID is inserted via a named parameter, and\n\nthe data type is explicitly\
    \ declared as an integer in bindValue(). The SQL statement\n\nis dynamically constructed\
    \ and safe, and then it is executed.\n\n**Summary**\n\nIn this chapter, the topic\
    \ of securely using PDO has been covered. The reason ­prepared\n\nstatements are\
    \ important is that they automate the escaping process for the developer.\n\n\
    This helps reduce the burden and work of tracking and accounting for the problem\n\
    \nof SQL injection to the developer. Character correct quoting and escaping is\
    \ done by\n\nPDO provided the correct character set is specified by the DSN connection\
    \ string,\n\nMySQL table column type, and the character set of the user input.\
    \ All parameter\n\ninputs are strings to MySQL, which convert internally to the\
    \ correct type based on the\n\ntable column type declaration structure. Data types\
    \ can be specifically declared with\n\nbindValue() and bindParam(), such as PDO::PARAM_INT,\
    \ or PDO::PARAM_\n\nSTR. This may be important to be pedantic, or for other database\
    \ ­systems if porting\n\nis ever an issue. Data returned from PDO recordsets then\
    \ need to be escaped accord­\n\ning to output context at display time. This was\
    \ done with escape HTML functions,\n\nand a dual escape URL/HTML function. Finally,\
    \ manually ­quoting and building a\n\ndynamic SQL statement safely was examined."
