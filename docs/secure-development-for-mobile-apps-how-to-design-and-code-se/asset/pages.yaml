  md: "**104**\n\n**Secure Development for Mobile Apps\uFEFF**\n\ncharacter set, conversion\
    \ is not necessary to function with the rest of the UTF-8\n\napplication. It will\
    \ just work.\n\n*UTF-8 PDO Client Connection*\n\nFor PDO, depending on the version\
    \ of PHP you are using, there are different meth­\n\nods to enable UTF-8 on your\
    \ database connection.\n\nFor PHP 5.3.6 and higher you just need to set the DSN\
    \ connection string as below\n\nto set client and server connection for UTF-8.\n\
    \n$co\annectDSN = \"mysql:host = {$db_host};dbname = {$db_name};charset\n\n= UTF-8\"\
    ;\n\n$connectOptions = array(\n\n//SET PDO TO THROW ERRORS AS EXCEPTIONS\n\nPDO::ATTR_ERRMODE\
    \ = > PDO::ERRMODE_EXCEPTION,\n\n//FORCES TRUE STATEMENT COMPILATION ON SERVER\
    \ - Two Trips\n\nPDO::ATTR_EMULATE_PREPARES = > false);\n\ntry{$db = new PDO(\
    \ //SET PDO CLIENT FOR UTF8\n\n//if not set, utf-8 data will get stored as garbage\n\
    \n//ensure PDO quoting mechanism uses same character set as DB\n\n$connectDSN,\n\
    \n\"{$db_user}\",\n\n\"{$db_pass}\",\n\n$connectOptions);\n\n}\n\nca\atch(PDOException\
    \ $e){//new PDO object always throws exceptions on\n\nerror\n\nprint \"PDO Connection\
    \ Error: \". $e->getMessage(). \"<br/>\";\n\nhandleError();\n\n}\n\nFor PHP <\
    \ 5.3.6 the charset attribute of the DNS connection string does not work.\n\n\
    Instead you need to set UTF-8 via PDO::ATTR.\n\n$connectOptions = array(\n\n//Essential\
    \ for UTF-8 with PHP < 5.3.6\n\nPDO::MYSQL_ATTR_INIT_COMMAND = > \"SET NAMES utf8\"\
    ,\n\n//SET PDO TO THROW ERRORS AS EXCEPTIONS\n\nPDO::ATTR_ERRMODE = > PDO::ERRMODE_EXCEPTION,\n\
    \n\a//FORCES TRUE STATEMENT COMPILATION ON SERVER - Two Trips\n\nPDO::ATTR_EMULATE_PREPARES\
    \ = > false);\n\n*Manual UTF-8 PDO/MySQL Connection How To*\n\nIf the need arises\
    \ to create a UTF-8 connection to a table, the following query works.\n\n$pdo->query(\"\
    **SET NAMES utf8**;\");"
