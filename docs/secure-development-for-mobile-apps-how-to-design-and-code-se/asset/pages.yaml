    $encryptedMsg = encryptMSG($msg, $key);


    $decryptedMsg = decryptMSG($encryptedMsg, $key);


    The first thing that encryptMsg() does is to configure the cipher key size, and


    IV size. IV stands for initialization vector, which is a strong random number
    that serves


    as a salt. There are several points that need to be understood just in these first
    three


    function calls. The first is the choice of cipher, in this case MCRYPT_RIJNDAEL_256.


    It is currently a very strong cipher that has not been broken. Second, is the
    CBC


    cipher block, MCRYPT_MODE_CBC. There are other blocks to choose. EBC is out­


    dated and does not use an IV. Use MCRYPT_MODE_CBC. mcrypt_create_iv()


    is a CSPRNG, and will generate a very strong number. It is strongly advised to
    use


    either this, or openssl_pseudo_random_bytes() for number generation. Do


    not use other methods.


    MCRYPT_DEV_URANDOM is also an important parameter. It determines the


    source for randomness selection, and URANDOM is the highest source of randomness


    for Linux. It is also a non-blocking source of randomness, so access calls are
    quicker.


    These functions and the parameters chosen will enable mcrypt() to obtain the high­


    est level of encryption.


    $keySize


    = **mcrypt_get_key_size**(CIPHER, MCRYPT_MODE_CBC);


    $ivSize


    = **mcrypt_get_iv_size**(CIPHER, MCRYPT_MODE_CBC);


    $iv


    = **mcrypt_create_iv**($ivSize, MCRYPT_DEV_URANDOM);


    Next is the call to mcrypt with the chosen parameters. Again, configuration is


    the key to strength.


    $encrypted


