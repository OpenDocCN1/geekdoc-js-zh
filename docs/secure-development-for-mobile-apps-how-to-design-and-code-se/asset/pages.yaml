    **Introduction to Mobile Security Development**


    • After this validation is done, this variable is held in stasis—it doesn’t need
    to


    be “cleaned” as it is not yet known how it should be cleaned. But technically


    at this point the data is safe. It is not doing anything. It is now the job of
    the


    code to protect and preserve the data that validation accepted.


    **Note:** Remember that escaping is preserving. It is not filtering, which is


    destructive, and which is another common misconception. Escaping ­preserves


    the variable into the next context. For example, O’Reilly needs to go into the


    database and come back out as O’Reilly. Escaping is what accomplishes this.


    Filtering would be destructive since it would remove the single quote, result­


    ing in OReilly, which would be unwanted in most cases.


    • Once the decision has been made to take action, escape the output according


    to the context.


    Several possibilities exist.


    • Escape out into the database. Now it is known where the data is going, and the


    determination is made by character set, which is set by the opened database


    connection and MySQL commands and encoding. The data must be escaped


    according to these rules in order to be effective. The goal of the code here is
    to


    preserve the result of the previous business decision. Data ­destruction is not


    acceptable here.


    **Note:** This is one reason addslashes() does not equal pdo->quote() or


    mysql_real_escape_string(). addslashes() does not know about


    the database character set requirements.


    • Escape out into HTML. Now the display destination is known. Data must be


    escaped for the HTML entities and the character set declared to the browser


    in the HTML header. The target parsing engine is the browser HTML parser


    here, not a SQL parser.


    • Escape out into a URL. Data is now going to the browser URL parser, which


    is not the same as the browser HTML parser and has completely different


    control sequences. Again, data needs to be preserved.


    • Escape out into JavaScript, then into URL link. Data is going first to the


    JavaScript engine parser, then to the browser HTML parser.


    With PHP specifics applied, a typical data processing sequence could look like
    this:


    • Validate incoming $_POST string as an integer via ctype_digit ()


    Destroy/reject any data not acceptable to business rules.


    • Hold the variable.


    • Escape into database for saving, via pdo->quote(). Preserve whatever the


    variable currently is. Destruction of data is not acceptable here.


    • Retrieve data back into an inert variable and hold the variable.'
