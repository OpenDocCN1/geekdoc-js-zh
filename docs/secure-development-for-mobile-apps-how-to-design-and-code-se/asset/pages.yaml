  md: "**106**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Header Setup*\n\
    \nMake sure that each page that gets sent out includes the following header()\
    \ func­\n\ntion call. This tells the browser to explicitly display content as\
    \ UTF-8\\. The browser\n\ntakes this header command as its primary directive for\
    \ knowing how to treat content.\n\n<?php header('Content-type: text/html; **charset\
    \ = UTF-8'**); ?>\n\n*Meta-Tag Setup*\n\nAdditionally, set the HTML meta-tag in\
    \ the header section of each HTML page.\n\nThis also informs the browser what\
    \ type of content it is displaying. Second, it helps\n\nanyone looking at the\
    \ source to know what the character set is.\n\nFor HTML5, the specification has\
    \ a new, less verbose way to declare the document\n\nencoding, which is now supported\
    \ by most modern browsers. If your page is using\n\nHTML5 markup exclusively,\
    \ by declaring\n\n<!DOCTYPE html>\n\nthen use the following compact header meta-tag\
    \ declaration\n\n<meta charset = \"UTF-8\">\n\nThe pragma directive,\n\n<m\aeta\
    \ http-equiv = \"Content-type\" content = \"text/html;charset =\n\nUTF-8\">\n\n\
    can still be used, but not both on the same page. Be advised that HTML4 validators\n\
    \nwill complain about the compact meta-tag as this is an HTML5 specification.\n\
    \nFor HTML4 pages, use the following:\n\n<header>\n\n<m\aeta http-equiv = \"Content-type\"\
    \ value = \"text/html; charset =\n\nUTF-8\"/>\n\n</header>\n\n*Form Setup*\n\n\
    For HTML forms, set the form attribute accept-charset to accept UTF-8.\n\n<form\
    \ action = \"regForm.php\" accept-charset = \" UTF-8\">\n\nFirst name: <input\
    \ type = \"text\" name = \"fname\"><br>\n\nLast name: <input type = \"text\" name\
    \ = \"lname\"><br>\n\n<input type = \"submit\" value = \"Submit\">\n\n</form>"
