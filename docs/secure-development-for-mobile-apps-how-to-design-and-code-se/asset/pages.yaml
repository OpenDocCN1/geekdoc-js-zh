    \ mcrypt_decrypt(MCRYPT_RIJNDAEL_256,\n\n$secretkey,\n\n$encrypted,\n\nMCRYPT_MODE_CBC,\n\
    \n$salt);\n\n*Modern Hashing*\n\nReturns a string containing the calculated message\
    \ digest as lowercase hex unless the\n\n'raw_output' parameter is set to true\
    \ in which case the raw binary representation\n\nof the message digest is returned.\
    \ SHA256, SHA512, which return 32 byte, and\n\n64 byte length hashes, respectively,\
    \ are the current best choices.\n\n$dataHash = hash('sha256', $data. $salt);//data\
    \ combined with salt\n\n*Modern Salting and Randomization*\n\nBelow are two examples\
