    \ highest sources of cryptographic randomness and entropy that PHP/\n\nLinux has\
    \ available and are the current best practice. Other methods of generating\n\n\
    salt are obsolete.\n\nopen_ssl_random_pseudo_bytes() Generates a sequence of pseudo-random\n\
    \nbytes, with the number of bytes determined by the length parameter.\n\n$bytes\
    \ = openssl_random_pseudo_bytes(OPEN_SSL_RANDOM_BYTES_SIZE);\n\nmcrypt_create_iv()\
    \ IV stands for initialization vector, which is the same as a\n\nsalt. IV and\
    \ salt are interchangeable. This function is used in the following manner.\n\n\
    Setting the key sizes correctly for the cipher block choices is very important.\n\
    \n$ke\aySize = mcrypt_get_key_size(MCRYPT_RIJNDAEL_256, MCRYPT_MODE_\n\nCBC);\n\
    \n$ivSize = mcrypt_get_iv_size(MCRYPT_RIJNDAEL_256, MCRYPT_MODE_CBC);\n\n$iv =\
    \ mcrypt_create_iv(mcrypt_get_iv_size(MCRYPT_RIJNDAEL_256,\n\nMCRYPT_MODE_CBC),\n\
    \nMCRYPT_DEV_URANDOM);"
