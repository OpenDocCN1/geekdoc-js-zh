  md: "**70**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n**PHP Security Design\
    \ Best Practices Summary**\n\nEvery web application needs to address the following\
    \ issues in order to meet the\n\nrequirements for current web application protection.\n\
    \nArchitect application character set\n\nArchitect HTTP request patterns\n\nArchitect\
    \ HTTP cookie usage\n\nArchitect input validation\n\nArchitect output escaping\n\
    \nArchitect session management\n\nProtect secret files/protect included files\n\
    \nProtect user passwords\n\nProtect user session data\n\nProtect against CSRF\
    \ attacks\n\nProtect against SQL injection attacks\n\nProtect against XSS attacks\n\
    \nProtect against file system attacks\n\nProper error handling\n\n*Architect Application\
    \ Character Set*\n\nThe foundation of a secure process is speaking the language.\
    \ The ­character set needed\n\nto support the application requirements needs to\
    \ be chosen and ­configured across\n\nthe entire application. All data must conform\
    \ to this ­requirement, as well as all ­filter,\n\nsanitization, and storage processes.\
    \ Any time data ­characters are different from the\n\nprocessing expectation,\
    \ the possibility to exploit the ­system exists. This then becomes\n\na critical\
    \ element of application planning and execution.\n\n*Architect HTTP Request Patterns*\n\
    \nWhat kind of HTTP requests an application uses, and how those requests are used\n\
    \nhas an overall effect on the security of an application. The requests allowed\
    \ determin­\n\ning the attack vectors which will be inherent to the application,\
    \ which determine what\n\nkind of attacks can be formed against the application,\
    \ and what kind of attacks the\n\napplication could be susceptible to.\n\nSome\
    \ HTTP request design considerations that can help eliminate or control\n\nattack\
    \ vectors are:\n\n• GET for public, read only requests\n\n• GET for persistable,\
    \ cachable URL requests\n\n• GET for persistable, one-time NONCE URL requests\n\
    \n• POST over SSL for private, authenticated requests"
