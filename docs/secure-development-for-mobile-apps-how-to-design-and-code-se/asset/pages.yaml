    //Disable caching on a per AJAX call


    $.ajax({


    url: "data.php",


    data: ''feed'',


    success: function(){


    alert(''success'');


    },


    cache: false


    });


    //Disable caching of AJAX globally


    $.ajaxSetup({


    cache: false


    });


    Configuring the $.ajax function with cache: false, tells jQuery to append a current


    timestamp parameter to the URL. This time parameter makes the URL unique and


    prevents the browser from retrieving a subsequent request from cache. The first
    snippet


    sets no caching for that call; the second snippet sets no caching globally for
    all calls.


