  md: "**220**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nNext, a PDO transaction\
    \ is initiated.\n\n$this->db->beginTransaction();\n\nThis is important in order\
    \ to replicate the default behavior of PHP which locks ses­\n\nsion files for\
    \ the duration of a script’s execution. For AJAX application, and jQuery\n\nMobile\
    \ applications with AJAX, session locking is critical to avoid race conditions\n\
    \nthat depend on $_SESSION variables. Two AJAX scripts, using the same session\n\
    \nID, might be reading and writing to the $_SESSION array at the same time. Session\n\
    \nlocking avoids that race condition and must be manually implemented by custom\
    \ ses­\n\nsion storage code.\n\nNext, the query to retrieve the session data is\
    \ executed.\n\n$sql = \"SELECT session_data\n\nFROM session\n\nWHERE session_id\
    \ = {$this->db->quote($sessionID)}\n\n**FOR UPDATE**\";\n\n$result = $this->db->**query**($sql);\n\
    \n$data = $result->**fetchColumn**();\n\nThis SELECT statement makes use of the\
    \ special FOR UPDATE syntax\n\nwhich tells MySQL that this record needs to be\
    \ locked, even though this is only\n\na  SELECT statement, and that an UPDATE\
    \ might be coming. Other scripts\n\n­cannot read this record until we release\
    \ it. This preserves $_SESSION array\n\nintegrity.\n\n*Notice* that this is not\
    \ a parameterized query. PDO quote() is used to properly\n\nescape the session\
    \ ID. quote() is specifically chosen over prepared statements\n\nto avoid the\
    \ two round trips required prepared statements. It is true that PHP by\n\ndefault\
    \ emulates prepared statements and uses quote() under the hood, which\n\nmeans\
    \ only one trip to the server. However, if that behavior is changed, and emula­\n\
    \ntion turned off, the behavior of this function should not change as well by\
    \ becoming\n\na two-trip process. If prepared statements are preferable for your\
    \ implementation,\n\nthen by all means implement them. Just note that the choice\
    \ here was not a security\n\noversight. It was an intentional performance choice.\
    \ The regular expression used\n\nto validate or reject the $sessionID character\
    \ set is sufficient in this case. Prepared\n\nstatements are not used in this\
    \ class.\n\nThe SELECT statement just returns the session_data column, as that\
    \ is all\n\nthat is needed.\n\nOnce the data is retrieved with a call to fetchColumn(),\
    \ the member variable,\n\nself::ENCRYPT_LEVEL is checked to decide what encryption,\
    \ if any was applied\n\nto the data. A switch statement is used to check the possible\
    \ types, and to make the\n\ncorrect function call.\n\nThe data is returned in\
    \ serialized format to PHP, which populates the $_SESSION\n\narray."
