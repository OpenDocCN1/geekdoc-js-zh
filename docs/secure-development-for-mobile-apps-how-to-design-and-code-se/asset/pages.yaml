  md: '**347**


    19


    Google Maps, YouTube,


    and  jQuery Mobile


    This chapter demonstrates techniques for creating map markers with custom com­


    ments, storing them securely in a database, and loading YouTube videos into Google


    Maps InfoWindows for display on a map.


    The code in this chapter demonstrates how to securely use jQuery Mobile API,


    Google Maps API, and YouTube API together in a useful manner. The main focus is


    to address the areas that need filtering in order to maintain the trustworthiness
    of the


    application. The Google Maps API changes frequently and is well documented with


    regard to mapping. Security concerns are left to the user, and this void is the
    subject of


    this chapter. The code demonstrates a working example of using the map but does
    not


    attempt to explain using the Google API. All explanations are focused on where
    and


    why to apply security measures. These measures are unlikely to change even though


    the Google API will change. The result is that the ideas presented here should
    stay


    relevant for some time to come.


    **Code Setup**


    The code for this sample is in the directory, GoogleMapsYouTube. Application


    setup is fairly simple but requires a few steps that will be configured differently


    depending on your actual server setup and configuration. The following steps must


    be performed:


    1. Place the main PHP source files in the public web directory.


    2. Place CSS and JavaScript files in a subdirectory of the main source files.


    3. Place the configuration file in a private directory outside the public web


    root.


    4. Edit the source file; include directives to the correct configuration file


    location.


    5. Create a MySQL database.


    6. Execute the included SQL scripts to load the database with tables and data.


    7. Set the database connection info in the configuration file.'
