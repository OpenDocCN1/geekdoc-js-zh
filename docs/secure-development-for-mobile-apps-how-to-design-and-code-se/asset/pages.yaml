    \ and ­htmlspecialchars(),\n\nwith the UTF-8 flag, escapes it for HTML with the\
    \ proper character set.\n\nJust because a string is successfully converted to\
    \ entirely UTF-8 compliant charac­\n\nters, do not assume it is safe. Validate\
    \ the result carefully afterwards to ensure expected\n\nresults.\n\nIt is a best\
    \ practice not to silently drop characters, but to replace all invalid charac­\n\
    \nters with **0xFFFD** instead. For example,\n\nmb_substitute_character(0xFFFD);\n\
    \n$utf8NoDroppedData = mb_convert_encoding($unknownData);\n\nIn this case, a string\
    \ ‘sc**X**ript’ with invalid ‘**X’** character becomes the ineffective\n\n‘sc**?**ript’\
    \ with the valid but benign UTF-8 ‘**U+FFFD**’ character instead of the mean­\n\
    \ningful string ‘script’, as would be the case if the ‘**X**’ was silently dropped.\n\
    \n*Validating UTF-8 Names and Emails via RegEx*\n\nAs applications reach a wider\
    \ audience, users in different countries would like names\n\nand email addresses\
    \ in their own language. The following snippets show how to filter\n\nout dangerous\
    \ characters while allowing Unicode characters in different languages.\n\nIn Unicode,\
    \ “character” really means “Unicode code point.” Every single Unicode\n\ncharacter\
    \ belongs to a specific category. To match a single character from a ­category,\n\
    \nthe expression ‘\\p{}’ is used. To match a single character not belonging to\
    \ a category,\n\nthe expression ‘\\P{}’ is used. Essentially, the lower case ‘p’\
    \ includes the character, or\n\ncode point. The uppercase ‘P’ does not include\
    \ the character or code point."
