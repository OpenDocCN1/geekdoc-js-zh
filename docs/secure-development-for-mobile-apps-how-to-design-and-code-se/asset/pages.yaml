  md: "**31**\n\n**Web Application Attack Surface**\n\n<div attr = \"...ESCAPE UNTRUSTED\
    \ DATA BEFORE PUTTING HERE...\">content</div>\n\ninside double quoted attribute\n\
    \nPHP code example:\n\n<di\av attr = '<?\aphp echo $encoder->encodeForHTMLAttribute($value);\
    \ ?>\n\n'>­content</div>\n\nExcept for alphanumeric characters, escape all characters\
    \ with ASCII values less than\n\n256 with the &#xHH; format (or a named entity\
    \ if available) to prevent switching out of\n\nthe attribute. The reason this\
    \ rule is so broad is that developers frequently leave attributes\n\nunquoted.\
    \ Properly quoted attributes can only be escaped with the corresponding quote.\n\
    \nUnquoted attributes can be broken out of with many characters, including [space]%\
    \ * +,\n\n-/; < = > ^ and |.\n\n*Rule #3—JavaScript Escape before Inserting Untrusted\
    \ Data into JavaScript Data Values*\n\nRule #3 concerns dynamically generated\
    \ JavaScript code—both script blocks and event-\n\nhandler attributes. The only\
    \ safe place to put untrusted data into this code is inside a\n\nquoted “data\
    \ value.” Including untrusted data inside any other JavaScript context is quite\n\
    \ndangerous, as it is extremely easy to switch into an execution context with\
    \ characters\n\nincluding (but not limited to) semi-colon, equals, space, plus,\
    \ and many more, so use\n\nwith caution.\n\n<script>alert('...ESCAPE UNTRUSTED\
    \ DATA BEFORE PUTTING HERE...')</script>\n\ninside a quoted string\n\n<script>x\
    \ = '...ESCAPE UNTRUSTED DATA BEFORE PUTTING HERE...'</script>\n\none side of\
    \ a quoted expression\n\n<div onmouseover = \"x = '...ESCAPE UNTRUSTED DATA BEFORE\
    \ PUTTING\n\nHERE...'\"</div> inside quoted event handler\n\nPlease note there\
    \ are some JavaScript functions that can never safely use untrusted data\n\nas\
    \ input—**even if JavaScript escaped**!\n\nFor example: DO NOT DO THE FOLLOWING!!\n\
    \n<script>\n\nwin\adow.setInterval('...EVEN IF YOU ESCAPE UNTRUSTED DATA YOU ARE\
    \ XSSED\n\nHERE...');\n\n</script>\n\nExcept for alphanumeric characters, escape\
    \ all characters less than 256 with the \\xHH\n\nformat to prevent switching out\
    \ of the data value into the script ­context or into another\n\nattribute. DO\
    \ NOT use any escaping shortcuts like \\” because the quote character may be\n\
    \nmatched by the HTML attribute parser which runs first. These escaping shortcuts\
    \ are also\n\nsusceptible to “escape-the-escape” attacks where the attacker sends\
    \ \\” and the vulnerable\n\ncode turns that into \\\\” which enables the quote."
