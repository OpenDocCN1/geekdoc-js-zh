  md: '**197**


    **Secure Session Storage**


    Starting or continuing a session with session_start(), results in a session


    open call, which opens the session’s data file. Then a session read call is made
    to read


    the session data back into the $_SESSION array. Upon either of two events—the


    script finishing its execution or a call to session_write_close()—a session


    write call is made to store the data back to either the file or the MySQL record.


    PHP session data is read and saved via the serialize() and unserialize()


    functions. It is important that data be read and saved this way for storage to
    remain trans­


    parent. If PHP objects are to be saved as part of session storage they must be
    serializable.


    *Session Locking*


    Session variables are not immediately saved to storage. They are by default saved
    to


    storage when the script ends. The time it takes for the script to run is the time
    win­


    dow during which session variables may change, which is why PHP exclusively locks


    the session file upon opening until it is closed after being written to. This
    can block


    another script’s access to the session file for the duration of the script’s execution
    time.


    *AJAX and Session Locking*


    The issue of session file locking as outlined above can be an important consideration


    for AJAX calls using session IDs and that might depend on consistent session variable


    values. If the file was not locked, a race condition for values could occur.


    session_write_close() can be called anytime during script execution to


    force ­session data to be written out to storage and the file lock released. This
    can


    be used to shorten lock time and speed the execution of other scripts that might
    be


    waiting on the lock. It can be important for performance in script design that
    session


    variables are set and released as quickly as possible at the beginning of a script
    and not


    spread throughout a file execution path, which would require the lock to remain
    in


    place for the duration of the script. In jQuery, and jQuery Mobile, which calls
    scripts


    via AJAX, this can be very important.


    **Note:**  If session locking is not implemented, beware of debugging changing
    session


    values via AJAX calls.


    **Session Management Configuration**


    PHP has many session management functions that can be set to increase the secu­


    rity of sessions. These include setting how the session ID is created, the encryption


    and randomness level of the ID, whether or not session IDs are included in URLs,


    how session IDs are transmitted over the network, whether or not HTTPS/SSL is


    required for transmission, and garbage collection.


    Garbage collection is an often overlooked aspect of session security. Garbage


    ­collection controls when session IDs are invalidated and removed from the system.'
