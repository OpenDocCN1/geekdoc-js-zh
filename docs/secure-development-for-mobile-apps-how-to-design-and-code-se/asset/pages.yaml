  md: '**115**


    7


    Project Layout Template


    With security there are many factors to account for in every project. Many of
    these


    factors are the same for every project. Simple organization is a basic tool in
    the fight


    against invasion. Any elimination of disorganization is beneficial, as it eases
    the code


    review process, finding and fixing problems, refactoring code, and any number
    of


    other jobs a developer does. Consistency in repetition is a habit that is actually
    a valu­


    able tool that can be leveraged very effectively in secure development. With these
    two


    ideas in mind, a reusable layout template of basic project files is the subject
    of this


    chapter. The premise is that many files and base configurations are consistent
    and do


    not change from project to project.


    **Every App Has Some Basic Similarities**


    Every PHP/MySQL/HTML/jQuery/JavaScript application has many identical parts.


    This chapter looks at many of these and proposes a base starting point. The structure


    here is not advocated as the best, or as the only one. It is a starting point
    to iden­


    tify common, reusable parts of an application structure. The reader is encouraged
    to


    modify this to suit his or her own style and project needs.


    *Project Layout Should Be Handled Consistently*


    A basic, reusable project structure is presented here.


    **/include**


    secrets,php


    constants.php


    database.php


    sessions.php


    account.php


    error.log


    |


    **__/WEBROOT/**


    index.php.php


    login.php


    public.php


    |


    **/HTML/**


    header.html


    footer.html'
  merge: -1
  pgno: 144
- img_proc: true
  md: "**116**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nabout.html\n\ncontact.html\n\
    \n|\n\n/images/\n\nlogo.jpg\n\nloginButton.jpg\n\nlogOut.jpg\n\n|\n\n/css/\n\n\
    layout.css\n\nform.css\n\n|\n\n/javascript/\n\nscripts.js\n\njqueryscripts.js\n\
    \nThis basic layout achieves several goals.\n\n• It separates the files according\
    \ to type.\n\n• It reduces the number of PHP files with direct access.\n\n• It\
    \ locates the secret and important files outside of the web root, preventing\n\
    \ndirect access.\n\n• It isolates the static CSS, Image, and JS files which enables\
    \ relocation to\n\nanother server.\n\n*Application Secrets Include Files Outside\
    \ of Web Root * First, application secrets must be\n\nlocated up and out of the\
    \ web root directory so that they are not directly accessible\n\nvia HTTP request.\
    \ The files should be located anywhere that is accessible by URL.\n\nSecond, the\
    \ files should have the .php extension, *not* an .inc extension. .inc files are\n\
    \ndirectly viewable in a browser, .php files are not. It is simply an extra protection.\
    \ PHP\n\nfiles located in the web root directory need to access files located\
    \ outside of the web\n\ndirectory by specifying at least one level of parent directory\
    \ traversal like so,\n\n<?php\n\ninclude \"../include/secrets.php\";\n\n?>\n\n\
    This provides file level protection for the secrets file as only the PHP engine\n\
    \ncan access files outside the web root directory. Incoming URL requests cannot\n\
    \naccess files outside of the web directory. This file has double protection.\
    \ The .php\n\nextension, because it is parsed by the PHP engine, prevents direct\
    \ viewing via web\n\nrequest, and since the file is located outside the web root,\
    \ it is inaccessible via direct\n\nURL request.\n\nGlobal constants in a file\
    \ outside the web root is another good practice. Global\n\nconstants can reveal\
    \ a great deal about an application. Treating this like a secrets file\n\nhelps\
    \ prevent information leakage."
