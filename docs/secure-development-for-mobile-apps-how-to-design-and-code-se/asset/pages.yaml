  md: "**130**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nhas the additional\
    \ benefit of causing the query to fail at run time, which is better than\n\nallowing\
    \ a mistake to execute.\n\nA few points to keep in mind when coding PDO are specifying\
    \ the character set\n\nfor the connection, which should be UTF-8 as per OWASP\
    \ recommendations. It is\n\nimportant that the PDO client connection match the\
    \ UTF-8 column type, and the\n\ndata be stored as UTF-8.\n\nSecond, and this is\
    \ not very clear from the documentation, is that PDO by\n\ndefault does not actually\
    \ create true prepared statements. It emulates them by\n\ndefault. What does this\
    \ mean? It means that instead of making two round trips, it\n\nmakes only one.\
    \ It does this by design for speed purposes. PDO properly escapes\n\nall variables\
    \ before inserting into the SQL statement and then sends the escaped\n\nSQL statement\
    \ to the server for compilation and execution. Data is returned in a\n\nsingle\
    \ round trip. The power of this is that automatic escaping is achieved, as well\n\
    \nas speed. Since many PHP/MySQL applications support high traffic loads, this\
    \ is\n\nan important consideration.\n\nIs that good enough? What about true prepared\
    \ statements? First, it is\n\ngood enough. Emulated statements can be trusted\
    \ to get the job done correctly\n\nprovided the character sets of the client connection\
    \ and the data are matched.\n\nThere are no published security advisories about\
    \ unsafe emulated statements, that\n\nis, if ­character encoding is set up correctly.\
    \ If mysql_query() was ­automatically\n\nescaped, its security level would be\
    \ very high. The problem is that this is a man­\n\nual process which can be missed.\
    \ Second, true prepared statements are an option.\n\nCalling\n\npdo->setAttribute(PDO::ATTR_EMULATE_PREPARES,\
    \ false);\n\non a PDO connection turns true prepared statements on and causes\
    \ two round trips\n\nto be made for every SQL query; one to prepare the statement\
    \ and one to execute the\n\nstatement with the parameters and return the result\
    \ set.\n\nThe choice is left to the developer. As with anything, there is a compromise\
    \ between\n\nspeed and security. True prepared statements are a stronger measure\
    \ and guarantee\n\nthe separation of SQL statement compilation and execution.\
    \ The speed cost of two\n\nround trips might not matter. On a high traffic site,\
    \ with a highly frequent query, it\n\nmight matter a great deal. Manual use of\
    \ mysql_real_escape_string() is a\n\nsuccessful escaping measure. The problem\
    \ was never that the escaping function was\n\nunreliable or ineffective. It was\
    \ highly effective. The problem was the huge amount of\n\nmanual labor to implement\
    \ it consistently across an application without the problems\n\nof oversight mistakes.\
    \ PDO provides that measure of automation which is a real ben­\n\nefit, and the\
    \ reason to move on with it into the future.\n\nAs a last thought on PDO prepared\
    \ statements, remember, prepared statements\n\n­automate the process of escaping\
    \ data for database storage. The result is that SQL\n\ninjection is prevented\
    \ and data is preserved intact."
