    *Must-revalidate * This directive tells caches, proxy and private, to obey freshness


    information about an object. The HTTP specification allows caches to take liber­


    ties regarding their own optimization techniques for caching freshness of pages
    or


    objects. This directive tells the cache to strictly follow your directive, not
    theirs.


    *Max-age = [seconds] * This specifies the maximum time window that a request object


    is allowed to be considered fresh. [seconds] is the number of seconds that can
    elapse


    from the time the request is made for an object to be considered fresh.


    *S-maxage = [seconds] * This directive is the same as max-age, but applies to
    any inter­


    mediary proxy or shared caches.


    *Microsoft Internet Explorer Extension*


    *pre-check and post-check * These two directives are IE specific extension settings.
    Setting


    pre-check and post-check to 0 directs that the request content should always be


    re-fetched.


