  md: "**29**\n\n**Web Application Attack Surface**\n\nmaintained by Jeff Williams,\
    \ Jim Manico, and Eoin Keary. The authors have done a\n\nthorough job of clearly\
    \ mapping the output context locations within an HTML page.\n\nAfter understanding\
    \ the rules and visualizing exactly where contexts are located, a\n\ndeveloper\
    \ can then map the output escaping functions of the Encoder class to the appro­\n\
    \npriate positions within any HTML page being constructed and achieve much higher\n\
    \nlevels of security.\n\nThe following XSS Prevention Rules are reprinted with\
    \ the kind permission of the\n\nauthors. Check the Official OWASP CSS Prevention\
    \ Cheat Sheet for future updates\n\nand changes.\n\n**OWASP XSS P****revention**\
    \ **R****ules**\n\nThe following rules are intended to prevent all XSS in your\
    \ application. While these\n\nrules do not allow absolute freedom in putting untrusted\
    \ data into an HTML docu­\n\nment, they should cover the vast majority of common\
    \ use cases. You do not have to\n\nallow **all** the rules in your organization.\
    \ Many organizations may find that **allowing**\n\n**only Rule #1 and Rule #2\
    \ are sufficient for their needs**. Please add a note to the dis­\n\ncussion page\
    \ if there is an additional context that is often required and can be secured\n\
    \nwith escaping.\n\nDo NOT simply escape the list of example characters provided\
    \ in the various rules.\n\nIt is NOT sufficient to escape only that list. Blacklist\
    \ approaches are quite fragile. The\n\nwhite list rules here have been carefully\
    \ designed to provide protection even against future\n\nvulnerabilities introduced\
    \ by browser changes.\n\n*Rule #0—Never Insert Untrusted Data except in Allowed\
    \ Locations*\n\nThe first rule is to **deny all**—don’t put untrusted data into\
    \ your HTML document unless\n\nit is within one of the slots defined in Rule #1\
    \ through Rule #5\\. The reason for Rule #0 is\n\nthat there are so many strange\
    \ contexts within HTML that the list of escaping rules gets\n\nvery complicated.\
    \ We can’t think of any good reason to put untrusted data in these con­\n\ntexts.\
    \ This includes “nested contexts” like a URL inside a JavaScript—the encoding\
    \ rules\n\nfor those locations are tricky and dangerous. If you insist on putting\
    \ untrusted data into\n\nnested contexts, please do a lot of cross-browser testing\
    \ and let us know what you find out.\n\n<scr\aipt>...NEVER PUT UNTRUSTED DATA\
    \ HERE...</script> directly in a script\n\n<!— NEVER PUT UNTRUSTED DATA HERE —\
    \ >\n\ninside an HTML comment\n\n<div...NEVER PUT UNTRUSTED DATA HERE... = test/>\n\
    \nin an attribute name\n\n<NEVER PUT UNTRUSTED DATA HERE... href = \"/test\"/>\n\
    \nin a tag name\n\n<style>...NEVER PUT UNTRUSTED DATA HERE...</style>\n\ndirectly\
    \ in CSS\n\nMost importantly, never accept actual JavaScript code from an untrusted\
    \ source and\n\nthen run it. For example, a parameter named “callback” that contains\
    \ a JavaScript code\n\nsnippet. No amount of escaping can fix that."
