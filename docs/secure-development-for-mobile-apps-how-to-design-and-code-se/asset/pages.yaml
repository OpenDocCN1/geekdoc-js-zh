    \ the array keys; array _ walk() can.\n\n• array_map() returns an array; array_walk()\
    \ returns true/false\n\non success/failure.\n\n• array_map() can process any number\
    \ of arrays; array_walk() only one.\n\n• array_walk() can take an extra parameter\
    \ to pass to callback.\n\n*Type Enforcement Functions*\n\nType enforcement functions\
    \ are those which identify and/or convert data to required\n\ntype. If a query\
    \ requires an integer for an ID lookup, validation should ensure that ID\n\nis\
    \ an integer only.\n\nintval() *and* casting (int) *versus* ctype_alnum() *and*\
    \ ctype_num() The\n\nthree functions can be used very effectively for validation\
    \ user input. Intval() and\n\nthe cast operater, (int) actually convert strings\
    \ into actual integers that can be\n\ndepended upon to be safe afterwards.\n\n\
    Usage is:\n\n$actualInt = **intval**($stringInt);\n\n$actualInt = **(int)**$stringInt."
