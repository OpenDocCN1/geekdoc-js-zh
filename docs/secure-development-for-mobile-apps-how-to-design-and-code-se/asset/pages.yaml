  md: "**240**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThe first task is\
    \ to ensure that registration occurs over an SSL landing page. The ­second\n\n\
    is to ensure that a secure form nonce was included in the form and was validated\
    \ upon\n\nreturn, and the third is to sanitize and validate the registration data\
    \ and convert the\n\nuser’s password to a SHA256 hash. Then the AccountManager\
    \ object is called to\n\nhandle the actual registration. The registerNewAccount()\
    \ member function is\n\ninvoked. This function does the following:\n\n1. Creates\
    \ Blowfish hash of SHA256 password\n\n2. Creates new user record in user’s table\n\
    \n3. Marks account as inactive\n\n4. Generates SHA256 activation code\n\n5. Adds\
    \ activation code to pending table\n\n6. Emails the activation link to user’s\
    \ email address\n\nAfter registration is performed, the user is redirected to\
    \ the registration ­confirmation\n\npage, regComplete.php. At this point the user\
    \ needs to retrieve the email that was\n\nsent to the address he used to register\
    \ the account. Users will not be able to log in\n\nuntil this step is successfully\
    \ completed, as the account is marked as inactive in the\n\ndatabase. Once the\
    \ user clicks the activation link embedded in the email, the account\n\nis activated\
    \ and the user is allowed to successfully log in.\n\nThe login page, login.php,\
    \ is forced to occur over SSL. If the user requested the\n\npage over HTTP, this\
    \ is detected and the request redirected over HTTPS so that\n\npasswords are always\
    \ sent over SSL. Once the password is retrieved from the $_POST\n\narray, it is\
    \ converted to SHA256 hash and the original password is discarded. Only\n\nthe\
    \ hash is kept. This accomplishes a few things. The app never has the clear text\n\
    \npassword, only the hash. If for any reason the encrypted passwords are compromised,\n\
    \nthen the attacker would only have the password hashes. The hashes would have\
    \ to be\n\nbrute forced to be recovered. Most importantly, the user is able to\
    \ enter any password,\n\nof any length and any characters.\n\n*Unlimited Password\
    \ Length, Unlimited Password Characters*\n\nHashing the clear text password allows\
    \ for unlimited password lengths with\n\n­unlimited characters. The system does\
    \ not care what the password is. The user can\n\nenter ­anything. There is no\
    \ sanitization or validation performed on the incoming user\n\npassword. Hashing\
    \ takes care of that for us. The result of the hash is a 64-character\n\nstring\
    \ containing the harmless characters 0–9, a–f. Since the result of the hash is\
    \ a\n\nconstant 64 characters, this becomes the specification for the table column\
    \ that holds\n\nthe password hash.\n\nThe login process then calls the AccountManager\
    \ objects validateCreden­\n\ntials() member function with the username and hashed\
    \ password. Validate​\n\nCredentials() creates a Blowfish hash of the passed in\
    \ hashed password and looks\n\nup the user record to compare the hashes. If successful,\
    \ the SessionManager objects"
