  md: "**320**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nheader(\"Pragma:\
    \ no-cache\");\n\nheader(\"Expires: Mon, 31 Jan 1970 08:00:00 GMT\");\n\n?>\n\n\
    HTTP Cache-Control response headers allow the application to define how pages\n\
    \nshould be handled by caches. This includes a user’s client browser cache and\
    \ any pos­\n\nsible proxy cache.\n\nThe following are the general setting categories:\n\
    \n• Restrictions on which pages are cacheable (controlled by server)\n\n• Restrictions\
    \ on what may be stored by a cache (controlled by either the server\n\nor the\
    \ user agent)\n\n• Modifications of expiration (controlled server or the user\
    \ agent)\n\n• Cache revalidation and reload (controlled by user agent)\n\n• Extensions\
    \ (IE accommodation)\n\n*Main Cache-Control Settings*\n\n*Private * This setting\
    \ directs that all or part of the response message is intended for\n\na single\
    \ user and **must not be cached** by a shared cache. The server of origin can\n\
    \nalso specify that specific parts of the response are intended for one user and\
    \ one\n\nuser only. The directive says that only a private, non-shared cache may\
    \ cache this\n\nresponse.\n\n*No-cache * This directive forces caches, both proxy\
    \ and client browser, to submit the\n\nrequest anew to the server of origin for\
    \ validation and not check for a cached copy.\n\nThis is useful in two ways. It\
    \ helps to ensure that authentication data is current and\n\nit ensures that object\
    \ freshness is maintained on a request-by-request, and page-\n\nby-page basis.\
    \ Data comes from the server each time.\n\n**Note:**  Performance may go down,\
    \ but security and privacy should be enhanced.\n\n*No-store * This directive is\
    \ meant to prevent the retention of sensitive information, and\n\napplies to the\
    \ entire response page. This directive may be sent either in a request or in\n\
    \na response. If the directive is sent in as part of a request, HTTP protocol\
    \ specification\n\nsays that a cache must not store any part of either this response\
    \ or the request. “Must\n\nnot store” in this context means that a caching mechanism:\n\
    \n**Must** not intentionally store response data in non-volatile storage\n\n**Must**\
    \ remove the response data from volatile storage promptly after using/\n\nforwarding\n\
    \nThe purpose of this directive is to prevent inadvertent and unanticipated access\
    \ to\n\nresponse data meant for a single user."
