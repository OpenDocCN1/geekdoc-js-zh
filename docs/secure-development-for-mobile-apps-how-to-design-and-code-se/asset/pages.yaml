    \ type to the display() method\n\nContextInterface in this manner: display(IData\
    \ $data). This enforces type\n\nchecking and ensures that only protected data\
    \ objects are sent and received by strategy\n\nobjects. This is how the PHP language\
    \ construct provides a great deal of assistance for\n\nenforcing design procedures.\
    \ Procedure enforcement is good for security.\n\n**The Input Cleaner Class**\n\
    \nThis class makes use of variable variables to automate the process of sanitizing\
    \ all input\n\nfrom $_POST or $_GET arrays as UTF-8 compliant strings. This process\
    \ examines\n\nevery incoming string for UTF-8 compliance, and converts any invalid\
    \ characters\n\nvia replacement, with a U+FFFD character. This is a potentially\
    \ destructive process,\n\nbut for legitimate users, incoming data should already\
    \ be UTF-8 compliant, and not\n\nan issue.\n\nThen every key and value is sanitized\
    \ and validated according to a mapped member\n\nfunction array. This array tells\
    \ the Cleaner class which keys are required for this script,\n\nand maps a validation\
    \ function for that key’s variable. All other keys are eliminated,\n\nalong with\
    \ the super global array, making raw, potentially unsafe data inaccessible.\n\n\
    Variables can now only be accessed by the public function getKey(), which will\
    \ either\n\nreturn a valid, sanitized value as specified by the function mapping,\
    \ or a false value.\n\nJust the step of ensuring all data is UTF-8 goes a long\
    \ way toward increasing secu­\n\nrity. Aside from performing the critical base\
    \ step, the Cleaner class also forces early\n\nstage variable design to take place.\
    \ In order to be useful, the data, the types, and the\n\nvalidation functions\
    \ need to be planned in advance. Variables used in the script needs\n\nto be declared\
    \ in the validation array at the top of the script, which prevents arbitrary\n\
    \nvariable usage later. This promotes a more secure design."
