    The main techniques involved are:


    • Displaying a catalog of items


    • Adding and deleting items to the cart via AJAX


    • Safely storing cart values in a session variable


    • Validating and sanitizing user input


    • Preparing data for PayPal


    • Storing purchase data via PDO prepared statements'
