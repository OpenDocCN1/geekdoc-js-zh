  md: "**52**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nMisunderstanding\
    \ these results has an effect on both the preservation of user\n\ndata and the\
    \ security of your application. A developer needs to be aware of how data\n\n\
    needs to flow into and out of these transitions without being destroyed, or opening\
    \ a\n\n­security hole.\n\n*Only One Output Context Anti-Pattern*\n\n**echo** '<tr>';\n\
    \n**foreach**($row as $key = >$value)\n\n{\n\necho '<td>',$value,'</td>'; //**value\
    \ could be hyper link**\n\n}\n\n**echo** '</tr>'\n\nIt is common to treat all\
    \ output the same. This is no longer an acceptable practice. In the\n\ncase above,\
    \ the assumption is that the output is HTML, when it could have other con­\n\n\
    texts, such as a hyperlink that might need URL parameters escaped. Every effort\
    \ needs to\n\nbe made to be aware of the output context, and to filter, escape,\
    \ or encode for the context.\n\n*Lack of Planning Anti-Patterns*\n\nA few general\
    \ points here are ones that every developer knows well. Time is money,\n\nunreleased\
    \ apps do not make money, and the longer something takes, the lower the\n\nprofit\
    \ margin. One of the first things to go is time spent on security. Implementing\n\
    \nsecurity takes two factors—planning and coding. Both take time.\n\nIn practical\
    \ terms, one of the main ways to combat this is to create a reusable\n\nframework\
    \ for issues you know are going to appear and thus be ready ahead of time so\n\
    \nthat lack of planning and lack of time have as minimal a negative impact as\
    \ possible\n\nto your project.\n\nBecause security usually isn’t planned for from\
    \ the beginning of a project, it becomes\n\nan add-on process which is usually\
    \ done last if there is time. From experience, trying\n\nto review code and identify\
    \ all attack vectors, proper input filters, and proper output\n\nfilters, is neither\
    \ fun nor 100% accurate. There is too much to miss.\n\n*Lack of Consistency Anti-Patterns*\n\
    \nLine 34\n\n$id = **addslashes**($_GET['id']);\n\nLine 35\n\n$query = \"SELECT\
    \ * FROM Users WHERE id = $id\";\n\n…\n\nLine 146\n\n\a$name = **mysql_real_escape_string**($link,\
    \ (($_\n\nGET['name']);\n\nLine 147\n\n$query = \"SELECT * FROM Users WHERE name\
    \ = \". $name. \";\n\nHere, in the same application, there are two different styles\
    \ of escape operations, disguised\n\nas filtering operations, being performed.\
    \ The four problems are: the inconsistencies of"
