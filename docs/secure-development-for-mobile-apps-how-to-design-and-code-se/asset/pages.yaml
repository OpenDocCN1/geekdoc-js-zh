  md: '**425**


    **Appendix**


    **Additional Online Security Chapters**


    This book is supported by two online chapters at:


    http://www.projectseven.net/secdevCSP.htm


    http://www.projectseven.net/secdevagile.htm


    These chapters cover developing with a Content Security Policy, and Agile Development


    with TDD.


    **Understanding the Regular Expression behind Encoder**


    *Programming PHP*, Third Edition (Tatroe, MacIntyre, and Lerdorf 2013) introduces


    a library class called Encoder that can be used to properly escape output in different
    con­


    texts. The nice thing about this class is that it maps member function names to
    distinct


    output contexts so that it is easy to use correctly for the needed condition.
    For example,


    to output to HTML, call encodeForHTML(), for HTML attributes call encode­


    ForHTMLAttribute(), or JavaScript call encodeForJavaScript(), etc.


    The most important code that determines the bits to escape is the regular expres­


    sion filter in the encodeString() function,


    preg_split(‘/(?<!^)(?!$)/u’, $value)


    As part of a preg_split() function, the expression is not trying to match a char­


    acter at this point. It uses regular expression LookAround syntax to match a position,


    such as the position between letters.


    The following LookAround explanation was provided by rex@rexegg.com'
  merge: -1
