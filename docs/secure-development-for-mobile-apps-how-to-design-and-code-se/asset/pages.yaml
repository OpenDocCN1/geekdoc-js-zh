    \ manager object to check if the cookie sent by the client browser\n\nis a cookie\
    \ holding an authenticated session ID. The checkLoggedInStatus()\n\nfunctions\
    \ takes one parameter, which is the name of the file to redirect to. This is not\n\
    \na user-supplied filename. It is a hardcoded filename set as an application constant.\n\
    \nIf the check fails, the request is redirected to the login page.\n\nSessionManager\
    \ uses $_SESSION['username'] to determine if a session is\n\nauthenticated. This\
    \ value will only be present if a successful authentication is per­\n\nformed.\
    \ If it is not present, then the session is not an authenticated session. It is\n\
    \nimportant to remember that not all sessions are authenticated sessions. Once\
    \ authen­\n\nticated, a session needs to be marked as authenticated. This is done\
    \ by setting a mean­\n\ningful value in $_SESSION, which can be checked later,\
    \ as the above code does.\n\nIf the check fails, meaning that ‘username’ was not\
    \ set, the SessionManager object\n\ncalls its own redirect wrapper, redirectIT(),\
