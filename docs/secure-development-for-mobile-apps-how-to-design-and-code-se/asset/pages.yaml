    **UTF-8 for PHP and MySQL**


    **PHP UTF-8 Multi-Byte Functions**


    With multi-byte Unicode text strings comes the need for multi-byte functions able
    to


    accurately parse and count those strings. Input validation will only be able to
    occur


    if the functions used match the data being input. The following sections break
    out


    functionality by task in order to help organize the toolset needed for dealing
    with


    multi-byte data.


    *UTF-8 Input Validation Functions*


    The following functions listed here are the main functions to use for detecting
    and


    converting strings to UTF-8 encoding.


    **ini_set**(''mbstring.substitute_character'', **0xFFFD**);


    **mb_substitute_character**(**0xFFFD**);


    **mb_convert_encoding**()


    **mb_ detect_ encoding**()


    **iconv**()


    It is important to configure a substitution character per Unicode.org advisory
    on


    dropped invalid characters. Two examples of different methods for detecting whether


    a string actually is a UTF-8 encoded string are:


    function isUTF8($incoming)


    {


    return (**utf8_encode**(**utf8_decode**($incoming)) = = $ incoming);


    }


    OR


    if (@**iconv**(''utf-8'', ''utf-8//IGNORE'', $ userData) = = $ userData)


    In the above tests, a compliant UTF-8 string comprised of valid characters will


    equal the original after the check. No invalid characters have been dropped. If
    the


    strings are not equal, then invalid characters were dropped, and a decision will
    need


    to be made as to whether or not to proceed.


    Below is an example of a bad conversion practice. In this case, the string is
    not


    being tested. The converted string is assumed good, and is assigned and used.


    *Bad Practice One*


    $assumedGood = @**iconv**(''utf-8'', ''utf-8//IGNORE'', $userData);


    The reason this is a bad practice is because the above code *actually does its
    job*.


    It  ­effectively removes invalid characters and returns a compliant UTF-8 string.


    The @ sign ­preceding the iconv() function tells iconv() to ignore errors caused
    by


    invalid UTF-8 character sequences. The problem is that this allows an attacker
    to take


    advantage of this fact and place invalid characters in the string, depending on
    them to'
