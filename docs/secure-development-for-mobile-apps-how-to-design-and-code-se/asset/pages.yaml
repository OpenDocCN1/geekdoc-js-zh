    Then, after configuration of all settings is completed, begin session with call
    to:


    session_start();


    The settings are grouped according to the functionality they configure. First,
    cookie


    session functions are grouped together. This is followed by encryption functions,
    gar­


    bage collection functions, caching function, and then cookie property-related
    func­


    tions are grouped together.


    Running through the ini_set list, first auto_start is turned off. If this is on,


    then sessions are always started on every page request. This is not wanted, since
    it is


    not controlled. Manual control over when a session is started is wanted. Three
    things


    must be under control of the application: session configuration, which must occur


    first, when session_start() is called, and for which pages.


    The next grouping of settings configures how PHP uses cookies for session, secures


    the creation and usage of cookies, and disables use of URLs for session management.


    First, order PHP to use cookies for sessions. This essentially activates the $_COOKIE


    array. Next, set the session to use only cookies for session ID. This means that
    PHP


    will not look for a session ID in a URL, and closes off several attack vectors
    that try


    to hijack sessions via URLs. Cookie hijacking vectors will still exist, but one
    vector


    is removed. Setting use_trans_id to off means that PHP will not append ses­


    sion IDs to URLs if it detects that a client’s browser will not accept cookies.
    Keeping


    session ID out of URL provides protection by keeping session ID from being passed


    around in URL strings, which get saved in browser caches, sent in emails, and
    can be


    found in browser history. Anything that reduces who can see and access a session
    ID


    is helpful protection.


    Possibly the two most important settings are turning HTTP Only on and setting


    the cookie to secure. HTTP Only tells the client browser via an HTML header not


    to let JavaScript access the cookie. This prevents JavaScript from accessing the
    cookie


    through document.cookie. This stops many attacks before they start. Not every
    browser


    enforces this behavior, but most modern browser versions do. So it is an important
    pre­


    caution to take. Setting the secure option informs the browser to only send the
    cookie


    over an HTTPS/SSL connection. If the page request is over HTTP, the cookie will


    not be sent. This greatly reduces the chance of the cookie being intercepted and
    stolen,


    and should be used as a cookie option whenever possible. The MobileSec application


    demonstrates this before with AJAX calls over HTTPS and HTTP, which show


    when cookies set with this parameter are sent and not sent. These two options
    are very


    powerful defenses against JavaScript cookie and session attacks.'
