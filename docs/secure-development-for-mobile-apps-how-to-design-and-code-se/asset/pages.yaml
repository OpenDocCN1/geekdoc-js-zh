  md: "**93**\n\n**PHP Security Tools Overview**\n\n$_\aH = 'HTMLS'; //the solution\
    \ gives the escape function a string\n\ncharacteristic $\n\n$message = <<<HELLOEMAIL\n\
    \nHello {$_H($user)},\n\nThanks for creating an account with us!\n\nSincerely,\n\
    \nThe MobileSec Team\n\nHELLOEMAIL;\n\necho $message;\n\nNow we have the desired\
    \ result; nicely formatted HTML that is easy to work\n\nwith, easily identifiable,\
    \ real-time, in-location, escaped output. This was achieved by\n\ncreating the\
    \ filtering function, HTMLS()and assigning its name to a variable, $_H.\n\nFunction\
    \ names can be assigned to variables by taking the quoted string name of the\n\
    \nfunction and assigning it in the normal fashion.\n\n**Note:**  For reference,\
    \ the code in this book creates a shorthand for output escape func­\n\ntions in\
    \ the form, underscore + capital letter, such as **_H**, or **_HS**. The purpose\
    \ is to\n\ncreate a quick visual identifier within formatted HTML. Since the HTML\
    \ best prac­\n\ntice is that all HTML tags should be lowercase, the **_H** stands\
    \ out for better visual\n\ninspection. Also, it is as short as possible in order\
    \ not to hinder the HTML too much.\n\nThe reader is encouraged to create his/her\
    \ own idea of meaningful shortcuts here.\n\nA second technique is just to actually\
    \ keep the PHP out of the HTML, as in the\n\nfollowing example.\n\n<?php\n\nrequire(\"\
    ../../mobileinc/secrets.php\");\n\nfunction printHTMLHeader()\n\n{\n\n//tell browser\
    \ to user UTF8\n\nheader('Content-Type: text/html; charset = utf-8');\n\n//employ\
    \ PHP HereDoc to form a clean HTML element\n\n$header = <<<MSHEADER\n\n<!DOCTYPE\
    \ html>\n\n<head>\n\n<title>Mobile Security Site</title>\n\n<me\ata http-equiv\
    \ = \"Content-Type\" content = \"text/html; charset =\n\nutf-8\"/>\n\n<s\acript\
    \ src = \"//ajax.googleapis.com/ajax/libs/jquery/1.10.2/\n\njquery.min.js\"> </script>\n\
    \n</head>\n\nMSHEADER;\n\necho $header;\n\n}"
  merge: -1
