  md: "**310**\n\n**Secure Development for Mobile Apps\uFEFF**\n\n*Embedded HTML HyperLinks—Problems\
    \ with innerHTML*\n\nThe OWASP recommendation is to not use innerHTML for displaying\
    \ untrusted\n\ndata, because it is difficult to know what the untrusted data contains.\
    \ The difficulty\n\nin understanding this recommendation is that sometimes innerHTML\
    \ works safely\n\nand prevents some kinds of script injection, but sometimes it\
    \ allows a vulnerability\n\nthrough. innerHTML in most cases works to prevent\
    \ immediate script execution,\n\nso it seems safe. In other injections, like onmouseover,\
    \ attributes lie dormant and\n\nare triggered later. These types of injections\
    \ are more difficult to catch in testing\n\nunless specific tests are made for\
    \ them. Examine the two scenarios below. One is\n\nfairly safe, the other not.\
    \ The only sure method is to not use innerHTML at all on\n\nuntrusted data.\n\n\
    The two snippets below address what is a very practical and expected feature in\n\
    \nmobile mashup applications: the ability to send text containing embedded links.\
    \ The\n\nfirst method below, using append(), is not safe with untrusted data,\
    \ while the second\n\nmethod using innerHTML is safe and produces the correct\
    \ effect.\n\nExecutes Embedded Script Automatically\n\n$('#feed').append(\"Check\
    \ link...<script>alert(1);</script\\>\n\n<a href = 'http://www.test.com'>Test\
    \ Link</a>\");\n\nThis snippet, using append(), will execute the embedded script.\n\
    \n*Untrusted Script Tag Not Executed by innerHTML—Partially Safe*\n\ninnerHTML\
    \ Prevents Automatic Script Execution But Not Mouseover\n\n//HTML correctly presents\
    \ enabled hyperlink\n\n//for the anchor tags href attribute\n\n//script tag not\
    \ executed\n\n//script tag does not appear\n\nvar feed = document.getElementById(\"\
    feed\");\n\nfeed.innerHTML = \"Check link...<script>alert(1);</script>\n\n<a href\
    \ = 'http://www.test.com'>Test Link</a>\";\n\nUsing innerHTML here is partially\
    \ safe because it is a DOM action performed by\n\nJavaScript. The script tag actually\
    \ gets removed and placed in the DOM script section.\n\nIt does not get executed.\
    \ This is an important security consideration to remember. This\n\nmethod of using\
    \ innerHTML correctly produces the desired combination of text with\n\nembedded\
    \ hyperlink effect.\n\nCheck link... TestLink\n\nThis worked on this attack vector.\
    \ The following attack vector demonstrated in the\n\nnext example is still vulnerable."
