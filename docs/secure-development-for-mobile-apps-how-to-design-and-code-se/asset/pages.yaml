  md: "**201**\n\n**Secure Session Storage**\n\nlimits on cookies is an important\
    \ application design consideration. Shorter expiration\n\nwindows are usually\
    \ better for security. Longer expiration windows are usually better\n\nfor user\
    \ satisfaction.\n\n*Properly Destroy Session*\n\nTo properly destroy a session,\
    \ all parts of it must be destroyed. This usually includes at\n\nleast three specific\
    \ items that must be explicitly destroyed:\n\n1. The $_SESSION array variables\
    \ unset\n\n2. The session file or MySQL record deleted\n\n3. The session cookie\
    \ expired on the client browser\n\nFailure to do this leaves session data available\
    \ to be accessed, so good practice means\n\nalways performing these cleanup functions.\
    \ In particular, this means to perform this\n\ncleanup any time one of the following\
    \ events occurs:\n\n• Session logout\n\n• Session re-authentication\n\n• Tamper\
    \ detection\n\n• Session expiration\n\nA function that destroys all related session\
    \ data would perform at least the following\n\ntasks.\n\n//destroy the session\
    \ variables by unsetting the session array\n\n**unset($_SESSION);**\n\n//\adestroy\
    \ the session which deletes the session file, or session\n\nrecord\n\n**session_destroy();**\n\
    \n//delete the session cookie.\n\n//set time to one tick past unix epoc time to\
    \ force expiration\n\n//regardless of server/client time zone diff\n\n**setcookie(session_name(\"\
    mobilesec\"), '', 1);**\n\nThe call to unset($ _ SESSION) removes the array and\
    \ all the variables it held\n\nand marks it for deletion by the PHP memory garbage\
    \ collector. At this point, a call\n\nto the value of $_SESSION['GENERATED_AT_SERVER']\
    \ would fail. The data\n\nis gone. The call to session_destroy() tells PHP to\
    \ call the functions related\n\nto session removal. This at least makes the call\
    \ to delete the file or session record.\n\nIt could also result, depending on\
    \ garbage collection settings, in a call to delete other\n\nexpired sessions.\n\
    \nFinally, setcookie() expires the cookie by setting the expiration time to one\n\
    \nsecond past Unix epoch time, Jan 1, 1970, so that the client browser will delete\
    \ it\n\nfor us. Setting the time to 1970 avoids any time zone differences. Setting\
    \ a cookie for\n\nT minus 60 minutes may not always work due to time zone differences."
