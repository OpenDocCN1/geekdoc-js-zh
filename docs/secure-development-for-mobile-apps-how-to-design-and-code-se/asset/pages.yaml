  md: "**97**\n\n**PHP Security Tools Overview**\n\nThis is safe, just not a good\
    \ practice.\n\n$confirmedINT = intval($id);\n\nquery(\"SELECT * FROM accounts\
    \ WHERE id = $ confirmedINT \");\n\nNo mysql_real_escape_string() needed. Consider\
    \ the following example.\n\n$id = $_POST['accountID'];\n\n//accountID = \a45,\
    \ which\n\nis fine\n\n$safeID = mysql_real_escape_string($id); //falsely cleaned!\n\
    \nquery(\"SELECT * FROM accounts WHERE id = $safeID\");\n\nThe result is:\n\n\
    query(\"SELECT * FROM accounts WHERE id = 45\");\n\nIn this case, mysql_real_escape_string()\
    \ does nothing because accoun­\n\ntID is an integer, and there is nothing to escape.\n\
    \nHowever, if accountID is changed to “1 OR 1 = 1”, now examine what happens.\n\
    \n$id = $_POST[accountID]; //accountID = \a\"1 OR 1 = 1\", which is NOT\n\nfine\n\
    \n$safeID = mysql_real_escape_string($id);\n\nquery(\"SELECT * FROM accounts WHERE\
    \ id = $safeID\");\n\nThe new unexpected bad result of the expanded query is:\n\
    \nquery(\"SELECT * FROM accounts WHERE id = 1 OR 1 = 1\"); //bad\n\nThis is now\
    \ a problem because the SQ statement itself is now changed. Why did it\n\nhappen?\
    \ There are two reasons. First, in this attack, there were no control characters\n\
    \nto escape. “1 OR 1 = 1” is valid SQL. It contains no quotes which need to be\
    \ blocked\n\nby escaping. Second, the variable value inside the SQL statement\
    \ is not quoted, so the\n\nSQL statement is expanded into,\n\n\"WHERE id = 1 OR\
    \ 1 = 1\"\n\ninstead of\n\n\"WHERE id = '1 OR 1 = 1'\"\n\nDo you see the difference?\
    \ The first statement becomes two conditions, which\n\nreturns the technically\
    \ correct but unwanted result. The second statement, because the\n\nvariable value\
    \ is quoted is only one condition where id tries to equal the value “1 OR\n\n\
    1 = 1”, which would correctly fail. The safety or “cleanness” of this SQL is dependent\n\
    \nupon two aspects, proper escaping of type and proper quoting of values inside\
    \ the\n\nSQL statement itself."
