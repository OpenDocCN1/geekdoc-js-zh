    **Secure JSON Requests**


    OWASP JSON object examples:


    Exploitable:


    [{"object": "inside an array"}]


    Not exploitable:


    {"object": "not inside an array"}


    Also not exploitable:


    {"toplevel": [{"object": "inside an array"}]}


    **Note:**  A top level JSON object can contain an embedded array with array syntax,
    but


    a JSON object cannot begin with array syntax.


    When using json_encode(), remember, the method of array parameter con­


    struction matters. Array construction method is critical and determines the resulting


    JSON syntax, either as an array, or as an object.


    **Send and Receive JSON in PHP**


    *Send JSON from PHP*


    Sending JSON responses from PHP should include correctly constructing the array
    of


    JSON data so that json_encode() will format the output correctly, and check for


    errors. Too often, data is output directly via echo json_encode($data) without


    checking for errors. json_encode() returns false on error, and the error message


    can be retrieved with a call to json_last_error().


    The online PHP manual states, “In the event of a failure to encode, json_last_


    error()  *can be used to determine the exact nature of the error.”*


    The long form of listing and testing for JSON error messages is this.


    First, encode the data, forcing a JSON object because array construction method


    is unknown.


    $jsonObject = **json_encode**($jsonArray, JSON_FORCE_OBJECT);


    But do not return it to the client yet.


    Second, test for errors using a switch statement. If no errors are present, prepare
    the


    HTTP header response, and send the data. If errors exist, log them and prepare
    and


    send a JSON error message that simply indicates that the data is not available.


    switch (json_last_error())


    {


    case JSON_ERROR_NONE:


    {


    //data UTF-8 compliant


    //tell client to recieve JSON data and send data


    header(''Content-Type:text/json'');


    **echo** $ jsonObject;


    }


    break;


    case JSON_ERROR_DEPTH:


    logError(''Maximum stack depth exceeded'');


    break;'
