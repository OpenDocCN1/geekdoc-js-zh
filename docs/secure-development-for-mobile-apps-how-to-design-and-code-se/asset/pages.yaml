  md: "**378**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nto authenticate\
    \ via oAuth. The credentials needed are the generated consumer key\n\nand the\
    \ consumer secret. These must be kept private and stored outside of the web\n\n\
    root folder.\n\n*Step 2: Exchange Twitter Credentials for Access Token*\n\nBefore\
    \ tweets can be retrieved, an oAuth token must be obtained to use in all HTTP\n\
    \nrequests. To do this, a POST request is made to the Twitter oAuth API endpoint\n\
    \nwith the application’s credentials. Upon success, the credentials are exchanged\
    \ for an\n\noAuth access token.\n\n*Step 3: Request Tweets Using Access Token*\n\
    \nOnce the oAuth access token is obtained, requests can be made using SSL to the\n\
    \nTwitter API v1.1 endpoint to fetch tweets in JSON format.\n\n*Step 4: Activate\
    \ Tweet Links*\n\nAll JSON results are returned as plain text. None of the embedded\
    \ links contain\n\nHTML tags. To activate the links, each tweet needs to have\
    \ the links, hashtags, and\n\nmentions extracted via regular expressions, and\
    \ the contextual HTML reinserted.\n\n**TweetFetcher Class**\n\nThe TweetFetcher\
    \ class encapsulates all the functionality to obtain tweets using OAuth\n\nauthentication\
    \ and the latest v1.1 API. There are five main functions: the constructor,\n\n\
    getAuthToken(), getTweets(), processTweet(), and cURLData().\n\nThe constructor\
    \ initializes the class with the Twitter API credentials, and gets\n\nand sets\
    \ the Twitter authentication token to a session variable as an optimization\n\n\
    to avoid repeated authorization requests. getAuthToken() makes the call to get\n\
    \na Twitter v1.1 token, used in all calls to get tweets. getTweets() uses a cURL\n\
    \nGET request to get the tweets. cURLData() is a façade for making cURL calls.\n\
    \nprocessTweet() is the security function that separates all the data contained\
    \ in\n\na tweet text, converts links to HTML, and makes it contextually safe for\
    \ output\n\ninto HTML.\n\n<?php\n\n//secrets stored outside of web root\n\ninclude\
    \ \"../private/twitterCredentials.php\";\n\n**class** TweetFetcher{\n\nprivate\
    \ $_handle\n\n= \"\";\n\nprivate $_key\n\n= \"\";"
