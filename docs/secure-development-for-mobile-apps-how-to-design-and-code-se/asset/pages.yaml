  md: '**101**


    6


    UTF-8 for PHP and MySQL


    **Why UTF-8**


    A Unicode character set is now a required infrastructure element in order to support


    a global application with global languages. The traditional ANSI character set
    does


    not support the multi-byte character sets outside of the Latin languages, such
    as the


    Chinese, Russian, and Japanese languages.


    UTF-8 is used for several reasons. It is Unicode and is usually able to handle
    all known


    characters with the best storage efficiency. With proper setup, UTF-8 is well
    supported


    in PHP and MySQL. Finally, OWASP recommends it from a security standpoint.


    The UTF-8 specification has both advantages and disadvantages. These are listed
    below.


    *UTF-8 Advantages*


    • UTF-8 is defined with only one right way to encode each character.


    • The length of the character is determined by the first bit. If zero, then char­


    acter is only one byte long. Otherwise, length equals count of leading ones.


    • A byte sequence that represents an entire UTF-8 character can never occur as


    a substring of a longer character. This makes parsing UTF-8 simpler.


    • A UTF-8 parser can determine characters from anywhere in a UTF-8 string.


    The start byte for the next character will always be the first byte that does
    not


    start with 10.


    • Null bytes never occur in UTF-8 text except to encode the null character.


    • Most byte values in UTF-8 data are equivalent to ASCII. When using stan­


    dard Roman letters, number, punctuation, and control characters, UTF-8


    encoding will be bit identical to ASCII encoding.


    • UTF-8 can store a full range of Unicode characters.


    • UTF-8 saves space over UTF-16 or UTF-32 encodings of Unicode text.


    • UTF-8 is the default encoding for XML documents.


    *UTF-8 Disadvantages*


    • UTF-8 represents Japanese, Chinese, or Korean characters with 3 bytes each.


    In UTF-16 most characters consume 2 bytes. If you use those languages,


    UTF-16 may be more space efficient.


    • Variable-width characters are more complex to process.


    • Care has to be taken to check for invalid/illegal characters.'
