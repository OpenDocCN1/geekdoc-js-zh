  md: "**98**\n\n**Secure Development for Mobile Apps\uFEFF**\n\nThis attack could\
    \ have been avoided by treating an integer as an integer and\n\n­converting accountID\
    \ to the proper type before insertion into the SQL statement.\n\n$safeID = (int)$_POST[accountID];\
    \ //accountID = \"1 OR 1 = 1\";\n\nquery(\"SELECT * FROM accounts WHERE id = $safeID\"\
    ); //safe\n\nThe expected safe result is:\n\nquery(\"SELECT * FROM accounts WHERE\
    \ id = 1\");//expected\n\n**Note:**  intval() could also have been used as we\
    \ saw previously to clean the variable.\n\nThis is why it is critical to understand\
    \ what type a variable is supposed to be and\n\nenforce that type. It is also\
    \ critical not to blindly apply the wrong filter to the wrong\n\ntype in order\
    \ to “clean” it.\n\nPDO and prepared statements (as well as mysqli() prepared\
    \ statement functions)\n\nhelp do this type of enforcement for us which is why,\
    \ from a security perspective, it is\n\nreplacing the mysql_query set of functions.\n\
    \n**The Reason for PDO Prepared Statements**\n\nThe reason prepared statements\
    \ provide strong protection against SQL injection\n\nattacks are because when\
    \ used, input variables cannot alter the SQL statement itself.\n\nSQL injection\
    \ works because user input can alter the statement. With PDO prepared\n\nstatements,\
    \ the statement is compiled before user variables are input and therefore the\n\
    \nvariables will not change the statement itself. The second reason prepared statements\n\
    \nare a best practice is that one is less likely to forget to apply a filter.\
    \ It is done for you,\n\nevery time and automatically. Third, typing and quoting\
    \ is handled for you.\n\nMySQL does automatic type conversion behind the scenes.\
    \ For example, assuming\n\nid is an integer as defined in the MySQL table column\
    \ definition, both\n\nSELECT * FROM accounts WHERE id = 1\n\nand\n\nSELECT * FROM\
    \ accounts WHERE id = \"1\"\n\nare the same to MySQL and both execute correctly\
    \ without error. In the second\n\nexample, the quoted string “1” is converted\
    \ to an integer and then evaluated.\n\nSELECT * FROM accounts WHERE id = \"Tom\"\
    \n\nwill fail as the string is not an integer. The following will also fail to\
    \ even compile.\n\nSELECT * FROM accounts WHERE id = Tom\n\nMySQL won’t accept\
    \ this statement because the types are explicitly wrong."
