  md: '**87**


    **PHP Security Tools Overview**


    FILTER_SANITIZE_STRING: Removes invalid data from string.


    $untrusted = ''<script>alert(''Attack'');</script>'';


    $safe = **filter_var**($untrusted, FILTER_SANITIZE_STRING);


    The script tags are removed, and output is: alert(‘Attack’)


    FILTER_SANITIZE_ENCODED: Encodes dangerous script tags in string.


    $untrusted = ''<script>alert(''Attack'');</script>'';


    $safe = **filter_var**($untrusted, FILTER_SANITIZE_ENCODED);


    Encodes all punctuation, spaces, and angle brackets into HTML entities.


    Output is:


    %3Cscript%3Ealert%28%27ATTACK%27%29%3B%3C%2Fscript%3E


    FILTER_SANITIZE_SPECIAL_CHARS: HTML encodes special characters like


    quotes, ampersands, and angle brackets.


    $untrusted = ''<script>alert(''Attack'');</script>'';


    $encoded = **filter_var**($untrusted, FILTER_SANITIZE_SPECIAL_CHARS);


    Output is that special characters are encoded into their HTML enitities.


    &#60;script&#62;alert(&#39;ATTACK&#39;);&#60;/script&#62;


    **strip_tags()**


    strip_tags() is used to remove HTML tags from a string. It can also remove


    PHP tags. But common usage is for HTML tags. The function is marginally depend­


    able to use as long as the ‘allowable_tags’ parameter is not used, and if the
    HTML


    is well formed. Marginally dependable means not dependable for security uses.
    It can­


    not be counted on to be completely safe for sanitization purposes. **Telling**
    strip _


    tags()  **to keep some tags opens a large security hole.** The hole is that tag
    ­attributes


    are preserved in the allowed tag. They are not filtered out, which allows executable
    code


    to be set by user input. The most common example is the insertion of the attribute,


    onMouseOver event handler, to become part of the HTML, which is *very dangerous*.


    **<b onMouseOver = "document.location = ''http://evilurl.com'';"/>Hi!</b>**


    The other chief concern about strip_tags() is its behavior on malformed


    HTML, such as when a user forgets a closing tag. Strip_tags() becomes destruc­


    tive in that case and user data is lost. This may or may not be a problem depending
    on


    application design.


    • OK if used without allowable tags.


    • Destructive on malformed HTML.


    • strip_tags() very dangerous when used with allowable_tags.'
