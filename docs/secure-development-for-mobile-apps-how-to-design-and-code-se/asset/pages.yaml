    $stmnt->**execute**(array('':email'' = >$ validEmail));


    **PREG for PHP = PREG for JavaScript**


    *Server Side Regular Expressions*


    Below is a series of validation and sanitization functions. Validation functions
    check


    if a string (all data coming in from request variables are strings) conforms to
    the pat­


    tern required, but do not alter the data. It is left to the program to decide
    what to do


    with it. Sanitization functions do alter the data, removing any characters outside
    of


    what is allowed. Depending on circumstance, each type of function, validation,
    or


    sanitization is useful and/or required, but it is important to remember that they
    per­


    form two entirely separate tasks. It is a common anti-pattern to just sanitize,
    or just


    filter without thinking about the actual needs of the data being filtered.


    Another point about the functions listed below is that there are two or more ver­


    sions of each kind. One is a somewhat easier PHP filter_var() implementation,


    and a regular expression version. Regular expression filters have the added benefit
    of


    working exactly the same in PHP as in JavaScript. This means that the same RegEx


    expression can be used for JavaScript validation on the client and for PHP validation


    on the server side. For example, in JavaScript:


    var username = "Mark";


    var sanitizedName = username.replace(''**/[^a-zA-Z0-9]/**'',"");


    In PHP:


    $sanitizedName = preg_replace(''**/[^a-zA-Z0-9]/**'', '''', "Mark");'
