    **Secure Client Server Form Validation**


    The context goes from being safe via the text() call on the #incoming object.


    $("#incoming").text(rss) //FINE


    Then turned back into HTML


    $("#incoming").text(rss).html()


    Then re-executed as the reborn HTML is fed back into #feed''s.html() function.


    $("#feed").html($("#incoming").text(rss).html());//XSS


    The text() is good, then the data is unescaped when html() is called on it, and


    passed to the html() method of another object, which in a real sense revives the
    text


    content and makes it active again.


    Passing data like this from object to object is a common practice and can definitely


    reintroduce a security hole. One reason is that once the data becomes ‘safe’ because
    of


    the text() call, no further thought is given to the fact that it could become
    danger­


    ous in another context.


    The solution is to pass data always in a benign format and avoid passing it in
    and out


    of differing contexts, such as out into text, out to HTML, and out to HTML again.


    It would be much safer to hold the data in a single variable and assign multiple
    times.


    This goes against the practice of avoiding variable assignment, namespace clutter,
    and


    memory usage, which is a major purpose of taking data straight out of a function
    call


    and sending to another, but keeps variables in a clearly known state. This security


    consideration is as important as all the other architecture considerations.


    *Replace innerHTML with innerText*


    An uncommon but safe DOM property is innerText, and it can be used similarly to


    innerHTML. It will prevent XSS problems because it automatically encodes the text.


    This is one method of safely displaying text retrieved from someplace else. Wherever


    possible use it. Use innerText when untrusted data must be displayed without being


    interpreted as HTML. This is also a highly recommended OWASP practice.


    InnerText Escapes HTML To Text


    //result from favorite RSS feed site


    var rss = "<script>alert(''attack'');</script>";


    //innerText escapes the raw text


    var feed = document.getElementById("feed");


    feed.innerText = rss;


    will simply display the text:


    <script>alert(''attack'');</script>


    and no script will be executed.'
