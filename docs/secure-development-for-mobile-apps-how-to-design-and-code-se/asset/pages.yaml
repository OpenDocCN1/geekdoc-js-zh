    These last two steps are optional but make a nice-looking activation code.


    *createBlowFishPasswordHash()* This function wraps the calls to


    $salt = self::generateBlowFishSalt();


    $hash = self::generateBlowFishHash($password, $salt);


    Blowfish, in order to be used correctly and with the maximum strength possible,


    has several setup issues that have to be properly implemented. This does add to
    the


    complexity of using the function, but once understood, and wrapped with a façade,


    its complexity should not be a factor. It is too valuable a tool to let setup
    complexity


    reduce its usage protecting users.


    Five critical steps need to be followed in setting up Blowfish. These steps are
    out­


    lined and explained in the following two functions.


    generateBlowfishSalt()  The first step is to generate a very strong salt of


    CSPRNG quality. This is done with


    $bytes = **openssl_random_pseudo_bytes**(OPEN_SSL_RANDOM_BYTES_SIZE);


    This produces a 32 byte blob of binary data as defined by the constant, OPEN_


    SSL_RANDOM_BYTES_SIZE, defined at 32 in globalCONST.php


    The second step is to encode this into a usable way for Blowfish. This must be
    done


    with base64_encode(). Blowfish expects this encoding.


    The third step is to remove all ‘+’ signs and replace them with ‘.’ periods. This
    is done


    with the strtr(). Plus signs are not allowed in Blowfish, and an error will result
    if


    they are not removed.


    Steps two and three are combined here into a single line.


    $salt = **strtr(base64_encode**($bytes), ''+'', ''.'');


    The fourth step is to extract 22 characters from the newly created salt. Blowfish


    expects a salt of 22 characters, so that is what is given.


    return **mb_substr**($salt, 0, BLOWFISH_SALT_SIZE, "UTF-8");


    The constant BLOWFISH_SALT_SIZE is defined as 22 in globalsCONST.php.


    This completes the steps required to create a cryptographically secure salt for


    Blowfish to use. Step five is performed in the next function.'
