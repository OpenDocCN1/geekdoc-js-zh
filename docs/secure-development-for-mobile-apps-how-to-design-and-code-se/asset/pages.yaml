  md: '**37**


    3


    PHP Security Anti-Patterns


    This chapter looks at various contributors to insecure code. These range from
    cases of


    simple misinformation to simple forgetfulness. Many common scenarios are shown


    that can be identified and changed to better practices and habits.


    **Anti-Pattern #1**


    *Not Matching Data Character Set to Filter Character Set*


    Mismatches between the character set of the data being parsed and the functions


    performing the parsing are a systemic, root level problem. If web security, based
    in


    the scripting environment of PHP, JavaScript, MySQL, and HTML, is based on


    how characters are interpreted, then care must be taken from the start to ensure
    that


    a string of user-supplied text is comprised of the expected character encoding,
    and


    every filter and sanitizer operating on that data set should use the expected
    character


    encoding. The rules and the data have to match before anything else, or the rest
    does


    not matter.


    The practice of not specifying and not ensuring character set uniformity is wide­


    spread and largely ignored. It is a bad practice perpetuated by numerous examples


    that rely on function default parameters that do not match actual use. Because
    of


    character set differences, code that works correctly in one environment will not
    nec­


    essarily work correctly in a different environment of different data sets with
    differ­


    ent defaults. For example, when the character set of the web page does not match


    the default settings of the PHP environment as set by php.ini, or when attacker-


    supplied data specifically alters a character set to bypass filters that do not
    enforce


    character set matching.


    This book emphasizes UTF-8, but the security demand remains the same no mat­


    ter which character encoding needs to be used. If ISO 8859-1 needs to be used
    in the


    application, then ensure that the text is valid IS0 8859-1 and that all application
    data


    filters are set to internally process ISO 8859-1\. If Windows-1250 needs to be
    used,


    then likewise ensure that all text and filters conform to Windows-1250.


    The foundational basis of secure programming rests on properly parsing and exam­


    ining data. This can only be done when the character set/encoding of the supplied


    data matches the character set of the filters used. Mismatched data is the root
    of


    much evil.'
