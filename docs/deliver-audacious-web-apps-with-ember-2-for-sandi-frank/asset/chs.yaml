  \n# 引言：为什么选择 Ember？\n\n当你考虑编写一个 Web 应用时，最让你兴奋的是什么？你是期待编写框架代码，还是为用户交付功能？如果你和我一样，功能才是令人兴奋的部分，而框架的存在是为了服务功能。现在，想象一下，如果有一群开发者已经探索了创建\
  \ Web 应用前端的最佳实践，并将这些实践编纂成一个框架。想象一下，如果你不必担心编写胶水代码，而是可以把时间花在令人兴奋的事情上。你的工作会有什么不同？\n\
  \nEmber 是一个开源 JavaScript 框架，维护于 [`emberjs.com`](http://emberjs.com) 和 GitHub^([[1]](#f_0010.html_FOOTNOTE-1))，它加速了\
  \ Web 应用的开发。它提供了你所需的大部分前端基础设施，让你能够专注于打造出色的应用。使用 Ember，你将编写更少的代码，而且代码会更简洁。简洁的代码就是更好的代码。通过将面向对象的设计原则注入\
  \ JavaScript，帮助你以合理的方式组织代码，Ember 让你能够从模块化的层面思考。这使得你的应用更易于创建和维护。\n\n在本书中，你将学习如何创建大胆的\
  \ Web 应用，并通过让 Ember 承担繁重工作来高效地完成。你将使用 Ember 的路由系统构建具有丰富界面和简单、可共享 URL 的单页应用。你将创建可复用的\
  \ UI 组件和模板，并将它们组合成高度可用、复杂的应用。你将使用 Ember Data 读写 RESTful 服务。你将学习使用 Ember 插件来共享代码以及使用他人共享的代码。你还将学习使用\
  \ Ember CLI 和 QUnit 来组织、构建和测试你的应用。\n\n## 本书的内容与范围\n\n本书是对 Ember 2、Ember Data 和 Ember\
  \ CLI 核心功能的快速介绍。这些功能依赖于 Node.js、npm 和 Handlebars，但我们不会深入介绍这些依赖项。\n\n本书并非 Ember、Ember\
  \ Data 或 Ember CLI 的详尽参考。我希望你能学到足够的知识来激发你的好奇心，但我们不会涵盖每一个 Ember API。本书也不是 JavaScript\
  \ 或 Web 开发的入门指南。我假设你具备一些 JavaScript、DOM、Ajax、HTML/CSS 和 RESTful 服务的知识。\n\n## 谁应该阅读本书？\n\
  \n本书面向刚接触 Ember 的 Web 开发者。如果你使用过其他框架如 React 或 AngularJS，或者使用过 jQuery，那么 Ember 背后的一些理念对你来说应该很熟悉；但即使没有，你也能顺利阅读。\n\
  \n## 本书的组织结构\n\n在第一章中，我们将首先创建本地开发环境，然后开始一个示例项目。在这一章中，我们将简要涉及许多核心功能，同时构建一个小而完整的示例功能。\n\
  \n在接下来的三章中，我们将专注于使用 Ember 2 构建用户界面的核心方面，并了解它如何利用路由、模板和组件动态地保持界面更新，而无需大量笨重的服务器往返。在第\
  \ 5 章和第 6 章中，我们将集中使用 Ember Data 的模型来访问 RESTful 服务以获取数据，并将这些数据提供给用户界面。第 7 章讨论了在 Ember\
  \ 应用中促进代码复用的几种方法，包括工具、混入和依赖注入。最后，在第 8 章和第 9 章中，我们将学习如何使用 Ember CLI 构建、测试和部署应用，以及通过插件共享代码。\n\
  \n本书的一个不同之处在于，每一章都建立在上一章工作的基础上。我们将一起从第一页开始构建一个单一的应用，并贯穿全书。因此，建议你第一次阅读时按顺序进行。通读全书后，再将其作为参考书使用会更有效，但第一次阅读时，它最适合作为循序渐进的教程。\n\
  \n我们将一起构建一个名为 EmberNote 的应用。它是 Evernote 应用的简化克隆，Evernote 是一个基于 Web 的笔记应用。以 Evernote\
  \ 为模型，我们将利用 Evernote 的笔记本和笔记的层次结构来学习如何使用 Ember 的路由系统和 Ember Data 的数据访问库。我们将构建一个基于\
  \ Markdown 的编辑工具来帮助我们准备 HTML 格式的笔记，并在此过程中了解 Ember 的组件功能。我们将学习如何使用 Ember CLI 构建、测试、部署和分享应用中的酷炫代码。最后，在整本书中，我们将学习如何使用\
  \ Ember CLI 插件为应用添加酷炫功能，例如身份验证和组件库。\n\n## 寻求帮助的途径\n\n本书中的所有代码示例都可以在本书的网页上找到。^([[2]](#f_0010.html_FOOTNOTE-2))\
  \ 在那里你还会找到一个讨论论坛，可以提问和提供反馈。\n\n现在，让我们开始吧！\n\n#### 脚注\n\n| [[1]](#f_0006.html_FNPTR-1)\
  \ | [`github.com/emberjs/ember.js/`](https://github.com/emberjs/ember.js/) |\n\n\
  | [[2]](#f_0010.html_FNPTR-2) | [`pragprog.com/book/mwjsember`](http://pragprog.com/book/mwjsember)\
  \ |\n\n版权所有 © 2015, The Pragmatic Bookshelf.\n\n# 第 1 章\n\n使用 Ember 启动你的应用\n\n在本章中，我们将通过学习\
  \ Ember 和 Ember CLI 的一些核心功能来快速起步。首先，我们将通过安装 Ember 和 Ember CLI 来设置开发环境。接下来，我们将开始构建本书中一直使用的应用。我们将使用\
  \ Ember CLI 创建应用及其第一个功能：一个注册页面。最后，我们将通过构建一个基本的、支持数据存储的后端来为这个页面提供支持，用于测试目的。让我们从安装\
  \ Ember 和 Ember CLI 开始。\n\n## 安装 Ember 和 Ember CLI\n\nEmber CLI 是一个用于构建 Ember 应用的命令行界面，也是项目团队获取框架库的首选方式。总的来说，Ember\
  \ 非常注重 Ember 开发者所说的“开发者人体工程学”。他们希望让开发者生活更轻松。Ember CLI 正是本着这种精神创建的。正如你将在本书中看到的，Ember\
  \ CLI 可以轻松处理许多样板任务，例如构建和部署、执行测试、添加文件以创建新功能等。同样重要的是，它允许你为类使用新的基于模块的语法。这大大提高了代码的清晰度。我们将在本书中全程使用\
  \ Ember CLI，所以让我们从安装它开始。\n\nEmber CLI 有几个先决条件：Node、Bower 和 PhantomJS。Ember CLI 依赖\
  \ Node 来提供浏览器之外的 JavaScript 环境。它使用 Bower 来帮助管理依赖关系。它还使用 PhantomJS 作为测试执行环境。\n\n\n\
  \n\n值得注意的是，虽然我们将使用 `Node` 来运行 `Ember CLI` 开发工具，但 `Ember` 本身并非服务器端框架，尽管 `Node` 支持服务器端\
  \ JavaScript 开发。`Ember` 用于创建浏览器端应用。\n\n首先，让我们安装 `Node`^[[3]](#f_0014.html_FOOTNOTE-3)\
  \ 和 `npm`^[[4]](#f_0014.html_FOOTNOTE-4)，以及 `Git`^[[5]](#f_0014.html_FOOTNOTE-5)。`Node`\
  \ 自带 `npm`，但 `npm` 更新频繁，因此最好确认你拥有最新版本。请访问相应网站，为你的特定平台安装这些工具的最新版本。你的 `Node` 安装版本至少应为\
  \ 0.12，以支持 `Ember CLI` 工具。如果你已经安装了 `Node`，可能需要先卸载现有版本。\n\n后两个工具是 `Bower` 所必需的。`npm`\
  \ 是一个包管理器，用于管理在 `Node` 中运行的代码，或与在 `Node` 中运行的工具配合使用。`Git` 是一个分布式版本控制系统。请按照各自网站的安装说明安装这三个工具。\n\
  \n| 安装 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | 安装这些工具时，你需要以管理员身份运行。在\
  \ Linux/BSD/OS X 系统上，你可能需要使用 `sudo` 前缀；在 Windows 上，你需要以具有管理员权限的用户身份登录。与许多安装过程一样，可能会出现一些问题，因此如果遇到问题，请访问本书论坛\
  \ [`pragprog.com`](http://pragprog.com)，我们将一起解决。 |\n\n安装好这些工具后，你可以通过命令行获取 `Bower`：\n\
  \n```\n$ npm install -g bower\n```\n\n你会看到几行命令输出，表明 `Bower` 及其依赖项已下载到你的机器上。`-g`\
  \ 命令选项要求 `Node` 全局安装 `Bower`，使其对所有项目可用，而不仅限于特定项目。`Bower` 安装完成后（你会看到命令输出停止并返回命令提示符），你可以安装\
  \ `PhantomJS`：\n\n```\n$ npm install -g phantomjs\n```\n\n同样，你会看到一些命令输出，告诉你 `PhantomJS`\
  \ 已成功安装。有了这些工具，你就可以安装 `Ember CLI` 了：\n\n```\n$ npm install -g ember-cli\n```\n\n\
  安装 `Ember CLI` 会同时安装 `Ember` 框架库和 CLI 本身。现在你已经有了 `Ember` 和 `Ember CLI`，我们可以开始编码了。\n\
  \n## 启动你的应用\n\n`Ember CLI` 采用了一种以应用为中心的方法。你要做的第一件事就是创建应用，而你创建的每个模块都是该应用的一部分。因此，我们将遵循这一思路，在一个应用的上下文中探索\
  \ `Ember` 的所有关键概念。\n\n我们将编写一个名为 `EmberNote` 的应用，它是基于网页的笔记应用 `Evernote`^[[6]](#f_0014.html_FOOTNOTE-6)\
  \ 的精简克隆版。第一步是创建应用的仓库（之所以这样称呼，是因为 `Ember CLI` 假定你将使用 `Git` 作为版本控制系统）。\n\n### 创建应用仓库\n\
  \n打开命令提示符，导航到你存放代码的位置，然后运行以下命令：\n\n```\n$ ember new ember-note\n```\n\n这将为你的应用创建一个新目录。如果出现任何问题，请查看下面的提示。\n\
  \n| 使用 Ember CLI 创建新项目 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
  \ | 在撰写本文时，`Ember CLI` 在创建新仓库时可能会出现一个竞态条件。如果你看到类似这样的错误：`ENOENT, open ’ember/package.json’`，那么你可能遇到了这个错误。通常，第二次尝试\
  \ `ember new` 命令就会成功。在某些非 Windows 系统上，你可能还会看到一条控制台警告，提示未安装 `watchman`。`Ember CLI`\
  \ 使用 `watchman` 来监控文件系统的更改，并在你处理 `Ember` 应用时实时部署到本地服务器。安装 `watchman` 是好的做法，即使只是为了避免看到这个错误，但它并非必需。如果没有\
  \ `watchman`，`Ember CLI` 会使用一个名为 `NodeWatcher` 的工具来实现相同目的。如果你想安装 `watchman`，请访问\
  \ [`facebook.github.io/watchman/docs/install.html`](https://facebook.github.io/watchman/docs/install.html)\
  \ 查看特定平台的安装说明。 |\n\n在编写 UI 代码之前，让我们先安装一个 `Bootstrap` 样式表，这样我们就能拥有一个看起来不像 20 世纪 90\
  \ 年代初期的 UI。在新建的 `ember-note` 目录中，从命令提示符运行以下命令：\n\n```\n$ cd ember-note\n$ npm install\n\
  $ bower install\n$ bower install bootstrap --save\n```\n\n然后将以下行添加到 `ember-note/ember-cli-build.js`\
  \ 中，放在最后一行代码之前：\n\n```\napp.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
  app.import('bower_components/bootstrap/dist/css/bootstrap.css.map',{\n  destDir:\
  \ 'assets'\n});\n```\n\n运行这些命令时，`Ember CLI` 会为你创建应用的文件夹结构。在本书剩余部分，我们的任务就是利用这个结构，填充所有细节，使其成为一个应用。毫无疑问，`Ember`\
  \ 和 `Ember CLI` 是固执己见的工具。它们对如何开发 Web 应用有内置的期望，这被称为“约定优于配置”。`Ember` 团队希望将一组最佳实践整合到框架中，让开发者专注于更重要的决策。要充分利用这些工具，你需要遵循它们的引导。\n\
  \n### 运行你的应用\n\n让我们运行我们创建的应用，看看它是什么样子。在新建的 `ember-note` 目录中，从命令提示符运行以下命令：\n\n```\n\
  $ ember serve\n```\n\n你会看到一些命令输出，告诉你构建成功，并且你的应用正在本地主机的 4200 端口上运行。让我们打开浏览器检查一下。如果你将浏览器指向\
  \ `localhost:4200`，应该会看到类似下图中显示的输出。\n\n![images/welcome.png](img/welcome.png)\n\n\
  `ember serve` 命令为你做了几件事。首先，它构建了一个可部署版本的应用，并将其放在 `ember-note/dist` 目录中。然后，它在 4200\
  \ 端口启动了一个 `node` 实例，并将你的应用部署到该实例进行测试。一旦运行了这个命令，它就会检测你对源代码所做的更改。\n\n现在让我们尝试一个更改。打开\
  \ `ember-note/app/templates/application.hbs` 文件。其内容应如下所示：\n\n```\n<h2 id=\"title\"\
  >Welcome to Ember</h2>\n\n{{outlet}}\n```\n\n修改文件，使文本显示为“Welcome to EmberNote”。文件内容应如下所示：\n\
  \n```\n<h2 id=\"title\">Welcome to EmberNote</h2>\n\n{{outlet}}\n```\n\n保存更改后，立即查看你的浏览器。`Ember\
  \ CLI` 检测到了更改，重新构建了你的应用，并在你保存时进行了部署。这大大节省了时间，因为你无需手动执行重新部署应用的步骤。这一切都通过 `Ember CLI`\
  \ 开箱即用！\n\n你可以看到 `Ember CLI` 是一个很方便的工具。现在是时候进入代码部分了。如果我们要构建一个应用，我们需要让用户能够注册，对吧？让我们从这里开始。\n\
  \n### 注册用户\n\n让我们看一个简单的示例，它将演示 `Ember` 应用的许多核心功能：路由、模板和模型。我们将构建一个简化的注册页面，允许用户注册\
  \ `EmberNote` 服务。这个页面有一个文本字段，用户可以在其中输入用户名，一个触发添加操作的按钮，以及一些在添加新用户时显示的文本。\n\n\n\n\n\
  在 Ember 应用中，所有功能都按路由组织。路由本质上是一个 URL 片段，如*嵌套路由*中所述。因此，下一步是使用 Ember CLI 创建一个路由。打开一个新的命令窗口，在\
  \ `ember-note` 项目的根目录下运行以下命令：\n\n`$ ember generate route register --pod`\n\n`--pod`\
  \ 标志添加到 `generate` 命令后，会创建一个名为 `register` 的目录，其中包含添加路由所需的文件：`route.js` 和 `template.hbs`。目前它们都是空的，你需要根据需要填充它们来创建路由的功能。一般来说，当你希望按功能组织项目（即创建一个包含\
  \ `route.js` 和 `template.hbs` 文件的 `register` 目录），而不是按对象类型组织时，就会使用 pod。\n\n之前，当你使用\
  \ `ember new` 命令创建应用时，生成了以下四个文件：`index.html`、`app.js`、`router.js` 和 `application.hbs`。然后\
  \ `ember generate` 命令会编辑应用目录下的 `router.js` 文件。我们将在*使用 Router 类组织应用*中深入探讨这一点，但 `router.js`\
  \ 类用于实现应用内的路由层次结构。\n\n如果你运行 `ember generate` 命令但不加 `--pod` 标志，Ember CLI 仍然会创建相同的对象，但不会在\
  \ `register` 目录中创建名为 `route.js` 的文件，而是在 `route` 目录中创建名为 `register.js` 的文件。就我们的目的而言，最好将路由所需的每个文件放在同一个位置，因此本书将全程使用\
  \ `--pod` 标志。\n\n现在，让我们看看目前创建的各文件。\n\n#### index.html\n\n该文件是应用的起点。它是在你运行 `ember\
  \ new ember-note` 命令时创建的。让我们来看一下。\n\n[ch1/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/index.html)\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n<title>EmberNote</title>\n<meta name=\"\
  description\" content=\"\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n\n{{content-for 'head'}}\n\n<link rel=\"stylesheet\" href=\"\
  assets/vendor.css\">\n<link rel=\"stylesheet\" href=\"assets/ember-note.css\">\n\
  \n{{content-for 'head-footer'}}\n</head>\n<body>\n{{content-for 'body'}}\n\n<script\
  \ src=\"assets/vendor.js\"></script>\n<script src=\"assets/ember-note.js\"></script>\n\
  \n{{content-for 'body-footer'}}\n</body>\n</html>\n```\n\n`index.html` 的大部分内容是用于创建起始页的样板\
  \ HTML。Ember CLI 添加了两个样式表 `vendor.css` 和 `ember-note.css` 来为应用设置样式。本书不会过多涉及样式表，但你应该知道\
  \ `vendor.css` 会捕获你引入应用中的任何第三方代码所使用的样式，而 `ember-note.css` 则用于你自定义的样式。\n\n`vendor.js`\
  \ 和 `ember-note.js` 也是如此。Ember CLI 构建过程会为你在应用中使用的所有第三方代码创建一个文件，名为 `vendor.js`，并为你的应用代码创建一个文件，名为\
  \ `ember-note.js`。这些文件都包含在 `index.html` 中。\n\n你可能还会注意到 `{{content-for}}` 表达式。这些表达式允许你通过\
  \ Ember CLI 插件在页面中包含额外内容。\n\n#### app.js\n\n`app.js` 文件用于创建 Ember 环境。请看以下代码：\n\n\
  [ch1/ember-note/app/app.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/app.js)\n\
  \n```javascript\nimport Ember from 'ember';\nimport Resolver from 'ember/resolver';\n\
  import loadInitializers from 'ember/load-initializers';\nimport config from './config/environment';\n\
  \nvar App;\n\nEmber.MODEL_FACTORY_INJECTIONS = true;\n\nApp = Ember.Application.extend({\n\
  \  modulePrefix: config.modulePrefix,\n  podModulePrefix: config.podModulePrefix,\n\
  \  Resolver: Resolver\n});\n\nloadInitializers(App, config.modulePrefix);\n\nexport\
  \ default App;\n```\n\n如果你是一位资深 JavaScript 开发者但尚未接触 ECMAScript 2015，前四行可能会让你目瞪口呆。ECMAScript\
  \ 是 ECMA International 规定的 JavaScript 语言的正式名称，而 ECMAScript 2015（也称为 ECMAScript 6\
  \ 或 ES6）是该标准的最新版本。没错，这四行代码正是从其他 JavaScript 文件导入依赖项，以便在当前模块中使用它们的模块。这是使用 Ember CLI\
  \ 的一个极其重要的方面。当你开始以模块化方式编写代码时，依赖关系会变得更容易理解，并且无需将对象塞入全局作用域。它还能帮助你以合理的方式组织代码。不过，不必担心浏览器是否支持\
  \ ECMAScript 2015，Ember CLI 会将你的代码转译为浏览器可执行的格式。\n\n`app.js` 中的代码旨在设置应用级别的结构。其中之一是\
  \ Ember Resolver，用于在整个应用中查找类。`modulePrefix` 变量被设置为 `ember-note`，这与你在设置应用时定义的值一致。`podModulePrefix`\
  \ 未被设置，因为我们的项目配置（从 `config/environment.js` 读取）中尚未定义它。\n\n文件的最后一行将 `App` 类作为模块导出。如果这还不太容易理解，别担心——随着学习的深入，你会看到更多关于\
  \ Ember 模块如何工作的示例。现在，让我们看看应用设置时创建的另一个文件——`router.js`。\n\n#### router.js\n\n`router.js`\
  \ 文件是真正开始了解 Ember 工作原理的地方。Ember 最基本的功能之一就是路由的概念。简单来说，路由就是应用中的一个位置。如果你将应用视为一组相互嵌套的页面或页面片段，那么每个页面都对应一个路由。而\
  \ `Router` 类（在 `router.js` 中定义）正是你定义应用结构的地方。让我们看看代码：\n\n[ch1/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/router.js)\n\
  \n```javascript\nimport Ember from 'ember';\nimport config from './config/environment';\n\
  \nvar Router = Ember.Router.extend({\n  location: config.locationType\n});\n\nRouter.map(function()\
  \ {\n  this.route('register');\n});\n\nexport default Router;\n```\n\n在 `router.js`\
  \ 文件的顶部，你会看到必要的导入语句。在类定义中（以 `var Router = Ember.Router.extend` 开头），我们从全局配置中引入了一些配置变量，这些变量是在我们设置应用时定义的。\n\
  \n\n\n\n但 `Router.map` 才是真正发挥作用的地方。如你所见，我们已经创建了一个名为 `register` 的路由。当我们运行 `ember\
  \ generate route register --pod` 命令时，这个路由就被添加到了 `Router` 中。同时还生成了许多其他文件，稍后我们将编辑这些文件来创建注册功能。`register`\
  \ 路由看起来是一个顶级路由，但实际上它位于应用程序默认路由下的第一级子路由中。让我们通过其关联的模板来查看这个默认路由。\n\n#### application.hbs\n\
  \n每个应用程序都有一个根路由，即 `Application` 路由。此外，每个路由恰好对应一个模板。模板是用户界面的一部分。对于应用程序路由，这个模板定义在\
  \ `application.hbs` 中。现在让我们修改这个模板，使其看起来如下所示：\n\n```\n// ch1/ember-note/app/templates/application.hbs\n\
  <div class=\"container\">\n<div class=\"row\">\n<div class=\"col-md-2\">\nWelcome\
  \ to EmberNote\n</div>\n<div class=\"col-md-10\">\n{{#link-to 'register'}}register{{/link-to}}\n\
  </div>\n</div>\n<div class=\"row\">\n<div>\n{{outlet}}\n</div>\n</div>\n</div>\n\
  ```\n\n每个 Ember 模板都是 HTML 和 Handlebars 表达式语言的混合体，其中用 `{{ }}` 字符标记的代码部分就是 Handlebars\
  \ 表达式。Handlebars 是 Ember 使用的一种表达式语言，用于描述 Ember 模板中与 Ember 应用程序代码相关的那些片段。在本书中，你将看到许多\
  \ Ember 使用 Handlebars 表达式的示例，它们总是使用 `{{ }}` 字符。Ember 自带一个编译器，可以将 Handlebars 模板表达式转换为\
  \ DOM 对象，正如我们将在 *编译模板* 中看到的那样。\n\n正如我们之前所见，每个应用程序都由一个路由层次结构组成。`application.hbs`\
  \ 文件中的 `{{#link-to}}` 表达式用于生成一个超链接，点击该链接会将 `register` 路由加载到 `{{outlet}}` 中。\n\n\
  你可能想知道 `Application` 路由是在哪里定义的。在这个特定案例中，由于我们没有任何特定的动作处理或数据加载需要执行，因此我们不需要定义路由类；我们可以简单地依赖\
  \ Ember 在运行时使用默认路由行为自动创建一个路由实现。\n\n到目前为止，我们看到的代码已经搭建了应用程序的最小框架。现在，让我们通过构建 `register`\
  \ 路由来看看如何为我们的应用程序添加功能。\n\n### 构建注册路由\n\n如前所述，`register` 路由将允许用户通过选择用户名来注册 EmberNote\
  \ 应用程序。当我们使用 CLI 创建这个路由时，生成了以下文件（注意，这是 `route.js`，与 `router.js` 不同）：\n\n```\n//\
  \ ch1/ember-note/app/register/route.js\nimport Ember from 'ember';\n\nexport default\
  \ Ember.Route.extend({\n});\n```\n\n这就是定义空路由类的方式。路由存在的两个主要原因是：加载要由路由显示的数据，以及响应动作。在我们的案例中，我们没有任何数据要显示，并且需要定义一个\
  \ `addNew` 动作来向应用程序添加新用户。我们稍后会回到这个动作。首先，让我们看看用户界面会是什么样子。以下是我们的路由模板文件，其中添加了必要的 UI\
  \ 代码：\n\n```\n// ch1/ember-note/app/register/template.hbs\n<div class=\"col-md-12\"\
  >\nRegister new user: {{input value=name}}\n<button {{action 'addNew'}}>Add</button>\n\
  </div>\n<div class=\"col-md-12\">\n{{message}}\n</div>\n```\n\n`{{input}}` 字段允许我们输入一个名称，该名称将被添加到控制器的\
  \ `name` 属性中（我们稍后将创建控制器）。我们在 `<button>` 中包含的 `{{action}}` 表达式将按钮的点击动作绑定到路由中的 `addNew`\
  \ 动作。而 `{{message}}` 表达式则简单地显示控制器中 `message` 属性的内容。我们目前还没有 `register` 的子路由，但如果有的话，它会被渲染到\
  \ `{{outlet}}` 中，类似于 `register` 路由被渲染到 `application.hbs` 中的 `{{outlet}}` 那样。\n\n\
  我们需要某种方式来捕获 `name` 和 `message` 字段中包含的 UI 状态。为此，我们将依赖默认控制器。在 Ember 中，每个路由恰好映射到一个控制器，该控制器充当底层模型的代理，包括任何\
  \ UI 状态。由于我们还没有任何数据要加载到模型中，我们使用控制器的唯一目的就是为模板中的 `name` 和 `message` 字段的状态提供一个存放位置。当你只需要非常简单的功能时，可以跳过为路由创建唯一的控制器实现，直接依赖\
  \ Ember 分配给路由的默认实现即可。现在，让我们创建要放入路由中的 `addNew` 动作。\n\n> **避免使用控制器**\n> \n> ![images/aside-icons/tip.png](img/tip.png)\
  \ 不选择重度依赖控制器还有另一个原因。Ember 团队计划在 2.x 发布周期的早期弃用控制器，转而支持在路由或组件中执行类似的工作。本书的未来版本也将跟进，目前我们尽可能避免使用控制器。\n\
  \n编辑 `register` 路由，使其看起来像这样：\n\n```\n// ch1/ember-note/app/register/route.js\nimport\
  \ Ember from 'ember';\n\nexport default Ember.Route.extend({\n  actions: {\n   \
  \ addNew: function() {\n      var user = this.store.createRecord('user', {\n   \
  \     name : this.controller.get('name')\n      });\n      user.save().then(() =>\
  \ {\n        console.log('save successful');\n        this.controller.set('message','A\
  \ new user with the name \"'\n          + this.controller.get('name') + '\" was\
  \ added!');\n        this.controller.set('name',null);\n      }, function() {\n\
  \        console.log('save failed');\n      });\n    }\n  }\n});\n```\n\n我们在这里做的第一件事是向路由添加一个\
  \ `actions` 哈希。哈希是一个名称-值对的列表。在这个例子中，名称是函数的名称，值是函数的定义。我们有一个函数 `addNew`。当我们在用户界面中点击按钮时，这个函数将被调用，因为模板中就是这样定义的。\n\
  \n我们还在这里使用了一些新的 ES 2015 语法。代码 `() =>` 被称为胖箭头函数，它允许我们在 `then` 函数体内继续使用 `this`，并且\
  \ `this` 将继续指向路由对象。调用 `createRecord` 使用 Ember Data 框架创建模型对象的新实例，随后调用 `save` 将该记录保存到持久化存储中。Ember\
  \ Data 通过 RESTful 服务提供对数据的访问。在测试所有这些之前，我们需要为 Ember Data 设置一个模拟服务来调用，以及一个模型对象来使用这些数据。现在让我们来做这件事。\n\
  \n### 添加数据服务\n\n\n\n\n\nEmber 和 Ember CLI 提供了两种在开发期间为应用提供数据的方式：fixtures（固定数据）和 mock\
  \ services（模拟服务）。虽然 fixtures 更容易设置，但 mock services 要求你实现访问 RESTful 服务所需的一切，从而能够更全面地测试代码。因此，本书将使用\
  \ mock services。如果你更关注测试核心 Ember 类，而不担心数据访问层的测试，那么可以考虑使用 fixtures，它们本质上是包含硬编码数据和简单访问方法的类。\n\
  \n实际上，我们在 mock services 的基础上更进一步：我们的服务会在重启后持久化数据，这样在构建应用时，我们也能看到数据不断累积。Ember CLI\
  \ 创建的默认 mock services 不会这样做，虽然在正常情况下这种默认行为可能更适合开发应用，但我更希望我们的数据在服务重启后仍然保留，这样我们在处理示例时测试数据就能持续存在。那么，让我们看看\
  \ mock service 是如何工作的。\n\n首先，为我们的用户对象创建一个模型类。目前，我们的用户只包含一个数据属性：`name`。让我们使用 Ember\
  \ CLI 生成一个存根类。\n\n```\n$ ember generate model user\n```\n\n以下是添加了实现细节后的类：\n\n[ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)\n\
  \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
  \  name: DS.attr('string')\n});\n```\n\n这个类依赖 Ember Data 库来创建一个 Model 实例，其中包含一个名为\
  \ `name` 的属性。该属性的类型是字符串，意味着它将保存文本。仅此而已。这就是我们为用户对象建模所需的全部内容。现在，为了与我们计划创建的服务进行交互，我们需要一个\
  \ `RESTAdapter` 和一个 `RESTSerializer`。\n\n要创建 `RESTAdapter`，请运行以下命令：\n\n```\n$ ember\
  \ generate adapter application\n```\n\n这会创建一个 `RESTAdapter`，它将由整个应用程序使用，这就是我们将其命名为\
  \ `application` 的原因。现在，编辑生成的文件，使其看起来像这样：\n\n[ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)\n\
  \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
  \  namespace: 'api'\n});\n```\n\n类似地，要创建 `RESTSerializer`，请运行以下命令：\n\n```\n$ ember\
  \ generate serializer application\n```\n\n生成的类将如下所示：\n\n[ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)\n\
  \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({});\n\
  ```\n\n`RESTAdapter` 只有一个目的：定义服务器上可以找到我们 RESTful 服务的路径。`RESTSerializer` 是一个空实现，因为我们使用的是默认功能。由于我们将创建一个为每个模型对象暴露预期\
  \ API 的服务，因此我们只需要做这些。我们将在 *适应非传统 API* 和 *使用序列化器访问遗留 API* 中看到更多相关内容。\n\n通常，Ember\
  \ 开发到这里就结束了。创建服务来提供数据通常超出了 Ember 的职责范围，因为 Ember 是一个前端框架，而不是用于开发 REST 服务的。正如我之前所说，我们正在创建一个\
  \ mock service，供我们的应用测试使用，然后更进一步，让数据持久化。\n\n为了使数据持久化，我们需要做两件目前还做不到的事情。首先，我们需要一个存放数据的地方。为此，我们将使用\
  \ NEDB 项目，这是一个用于 Node 的嵌入式数据存储。这是一个非常适合开发数据存储的工具，比如我们的场景。对于生产环境的数据存储，你可能需要更健壮的方案。在你的\
  \ `ember-note` 目录中运行以下命令（`--save-dev` 标志使其成为仅开发依赖，而非生产依赖）：\n\n```\n$ npm install\
  \ nedb --save-dev\n```\n\n这使得 NEDB 项目可用。当 Ember Data 存储将新用户记录保存到注册路由时，它会通过 HTTP\
  \ 将数据 POST 到我们的 mock service。因此，我们还需要能够解析传入 HTTP 请求的正文。获取以下库来实现这一点：\n\n```\n$ npm\
  \ install body-parser --save-dev\n```\n\n现在，我们准备通过运行以下命令来创建我们的 mock service：\n\n\
  ```\n$ ember generate http-mock users\n```\n\n创建好服务后，我们只需添加几行代码，即可使用刚刚添加的库，并响应创建新记录的请求。请看以下代码，它对基本的\
  \ mock service 进行了修改，使其能够将数据存储在 NEDB 中：\n\n[ch1/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/server/mocks/users.js)\n\
  \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
  \  var usersRouter = express.Router();\n\n  // 在此服务中使用 body-parser 库\n  var bodyParser\
  \ = require('body-parser');\n  app.use(bodyParser.json());\n\n  // 如果尚不存在，则使用 NEDB\
  \ 创建一个嵌入式表\n  var nedb = require('nedb');\n  var userDB = new nedb({ filename :\
  \ 'users', autoload: true});\n\n  // POST URL 用于创建新记录\n  usersRouter.post('/', function(req,\
  \ res) {\n\n    // 查找最近创建的记录，并用它来设置传入记录的 id 字段，\n    // 这是 Ember Data 所必需的\n   \
  \ userDB.find({}).sort({id : -1}).limit(1).exec(function(err,users) {\n      if(users.length\
  \ != 0)\n        req.body.user.id = users[0].id + 1;\n      else\n        req.body.user.id\
  \ = 1;\n\n      // 将新记录插入数据存储，并将新创建的记录返回给 Ember Data\n      userDB.insert(req.body.user,\
  \ function(err,newUser) {\n        res.status(201);\n        res.send(\n       \
  \   JSON.stringify(\n            {\n              user : newUser\n            }));\n\
  \      });\n    })\n  });\n\n  // 目前，我们不会修改其余代码，这些代码由 Ember CLI 创建\n  usersRouter.get('/',\
  \ function(req, res) {\n    res.send({\n      'users': []\n    });\n  });\n\n  usersRouter.get('/:id',\
  \ function(req, res) {\n    res.send({\n      'users': {\n        id: req.params.id\n\
  \      }\n    });\n  });\n\n  usersRouter.put('/:id', function(req, res) {\n  });\n\
  \n  usersRouter.delete('/:id', function(req, res) {\n    res.status(204).end();\n\
  \  });\n\n  app.use('/api/users', usersRouter);\n};\n```\n\n至此，我们已准备好尝试注册功能。如果应用尚未运行，请打开命令行并运行以下命令启动应用（如果已运行，你可能需要按\
  \ Ctrl-C 停止它，然后重新启动）：\n\n```\n$ ember serve\n```\n\n然后导航到 `localhost:4200`，点击注册链接，输入用户名，然后点击\
  \ Add。你应该会看到一条消息，提示用户已添加，如下所示。\n\n![images/new-user.png](img/new-user.png)\n\n如果你想验证，可以查看\
  \ `ember-note` 目录中的 `users` 文件。你应该会看到类似这样的内容：\n\n\n\n\n\n```\n{\"name\":\"newuser1@pragprog.com\"\
  ,\"id\":1,\"_id\":\"8EszAw3RuDxYCIBh\"}\n```\n\n如果你看到类似这样的内容，恭喜你！你已经完成了学习 Ember\
  \ 的第一步。喝杯饮料，散散步，或者以你认为合适的方式放松一下。\n\nEmber 插件：Ember CLI Mirage\n\n你可以看到，我们费了一些周折才让后端与\
  \ Ember CLI 协同工作。Ember CLI 的 HTTP Mocks 是使用模拟服务器提供数据的好方法，但我想提一下另一个替代方案，叫做 Ember\
  \ CLI Mirage。\n\nEmber CLI Mirage 是一个 Ember 插件，它实现了与 Ember CLI 的 HTTP Mocks 许多相同的目标，但完全在客户端完成（也就是说，不需要你启动一个\
  \ Node 服务器来提供模拟数据）。Ember 插件是一段打包好的代码，由社区成员分享并发布到仓库（通常是 npm），供更广泛的社区使用。\n\nEmber\
  \ CLI Mirage 允许你创建在浏览器或持续集成环境中运行的模拟数据服务。这使你的测试类能够测试模型层，而无需现有的后端服务器，甚至不需要模拟服务器。\n\
  \n在整本书中，我会提到一些值得研究的 Ember 插件。这些插件通常代表了我们书中讨论的任务的另一种执行方式，或者是我们以简单方式执行的任务的更成熟的方式。我不对这些插件是否达到生产级别做任何声明。至少，它们应该有助于你进一步探索\
  \ Ember 生态系统，并作为额外学习的工具，因为所有插件都是开源的。我们将在第 9 章《构建和使用 Ember 插件》中专门用一章来介绍插件。\n\n关于如何使用\
  \ Ember CLI Mirage 的完整文档，请查看 [`www.ember-cli-mirage.com`](http://www.ember-cli-mirage.com)。\n\
  \n## 下一步\n\n我们在第一章中涵盖了大量概念。你已经看到了 Ember 中每个主要类的小例子，并编写了一个使用数据感知服务的示例应用程序。尽管如此，Ember\
  \ 的内容远不止我们目前所涵盖的，在完成之前你还有很多要学习。我们的下一步是开始构建用户界面，首先深入探讨路由。\n\n#### 脚注\n\n- [[3]](#f_0012.html_FNPTR-3)\
  \ [`nodejs.org`](http://nodejs.org)\n- [[4]](#f_0012.html_FNPTR-4) [`npmjs.com`](https://npmjs.com)\n\
  - [[5]](#f_0012.html_FNPTR-5) [`git-scm.com/downloads`](http://git-scm.com/downloads)\n\
  - [[6]](#f_0013.html_FNPTR-6) [`evernote.com`](https://evernote.com)\n\n版权所有 © 2015，The\
  \ Pragmatic Bookshelf。\n\n# 第 2 章\n\n用路由引导流量\n\n现在我们已经安装了 Ember 和 Ember CLI，并用它们创建了一个允许用户注册的应用程序，我们准备深入探讨\
  \ Ember 的主要特性。我们要看的第一个特性是 Ember 路由。正如我在第 1 章中提到的，路由的概念是 Ember 背后的核心原则之一。路由是应用程序功能单个单元的起点。路由的层次结构构成了应用程序的组织结构。\n\
  \n路由在 Ember 中非常重要。幸运的是，它们也是一个很好的起点。在本章中，我们将学习如何使用 Ember CLI 通过路由来组织你的应用程序。你将学习如何使用\
  \ `Router` 类来设置路由层次结构，以及如何使用 `Route` 类来定义路由。我们还将学习如何使用 Ember 的导航助手在路由之间移动。你将了解 Ember\
  \ 如何使用你的应用程序 URL 不仅指示你在应用程序中的位置，还指示加载到 UI 中的记录。为了帮助你区分 `Router` 和 `Route`，请记住每个应用程序只有一个\
  \ `Router`，在该 `Router` 中，你通过定义路由来定义应用程序的结构。`Route` 类的实现是你定义单个路由行为的方式。\n\n为了更深入地了解路由，我们将通过构建应用程序的导航结构来逐步拼凑\
  \ EmberNote 的更多功能。到本章结束时，你将完成 EmberNote 的大部分路由结构，并知道如何编写在路由之间导航的代码。\n\n## 使用 Router\
  \ 类组织你的应用程序\n\n在上一章中，我们为 EmberNote 创建了 `register` 路由。可以想象，Ember 应用程序由许多路由组成，每个路由在应用程序中都是唯一的。这些路由共同构成了应用程序中不同位置的层次结构，暴露了层次结构中每个位置特有的功能。Ember\
  \ 将这个层次结构记录在一个单独的类中，即 `Router` 类，如下图所示。\n\n![images/router-and-routes.png](img/router-and-routes.png)\n\
  \n因为我们使用 Ember CLI 来管理应用程序，所以我们不会经常直接编辑 EmberNote 的 `Router`。大多数时候，我们会让 Ember CLI\
  \ 为我们进行编辑。\n\n让我们看一个这样的例子。上次我们处理 EmberNote 时，我们的 `Router` 类是这样的：\n\n[ch2/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)\n\
  \n```\nimport Ember from 'ember';\nimport config from './config/environment';\n\n\
  var Router = Ember.Router.extend({\n  location: config.locationType\n});\n\nRouter.map(function()\
  \ {\n  this.route('register');\n});\n\nexport default Router;\n```\n\n让我们向应用程序添加几个路由，看看\
  \ `Router` 会发生什么。当用户打开 EmberNote 应用程序时，他们可以注册，或者如果已经注册，则可以登录。登录后，他们将看到他们的笔记本列表。现在让我们添加两个路由，让用户登录并查看他们的笔记本。在你的\
  \ `ember-note` 目录中，运行以下命令：\n\n```\n$ ember generate route login --pod\n$ ember generate\
  \ route notebooks --pod\n```\n\n运行这些命令后，你应该会在路由器中看到两行新内容：\n\n```\nthis.route('login');\n\
  this.route('notebooks');\n```\n\n很棒的是，Ember CLI 会在你创建新路由时自动添加它们，而不会清除路由器中已有的更改。\n\
  \n`Router` 现在包含了我们通过 Ember CLI 生成的两个新路由。我们现在可以通过构建它们的类来定义 `login` 和 `notebooks`\
  \ 路由。\n\n我们将在整本书中创建更多路由，并且会经常回顾 `Router` 类。定期回顾这个类是一个好习惯，有助于我们保持方向感并牢记整体应用程序结构。现在，让我们通过处理\
  \ `login` 路由来看看如何定义路由。\n\n## 定义你的路由\n\n如前所述，每个路由对应应用程序中的一个给定 URL。我们在应用程序中定义了四个路由，对应以下\
  \ URL：\n\n*   http://localhost:4200\n*   http://localhost:4200/register\n*   http://localhost:4200/login\n\
  *   http://localhost:4200/notebooks\n\n我们在第一章中定义了 `register`，并且刚刚生成了 `login` 和 `notebook`\
  \ 的类。这些路由的名称和路径与 `router.js` 中的定义相对应。\n\n你可能想知道我们何时定义了根 URL。答案是我们在创建应用程序时定义了它。这个路由被称为\
  \ `application` 路由，它使用了 Ember 对 `Route` 类的默认实现。我们在第一章中修改了一个名为 `application.hbs`\
  \ 的文件。这个文件包含了 `application` 路由的模板。通过简单地使用 Ember CLI 创建项目，并借助 Ember 对默认功能的依赖，我们定义了\
  \ `application` 路由。\n\n\n\n\n\n这也引出了关于默认 Ember 结构的一点：每个独立的路由都对应一个模板。对于应用路由，对应的是\
  \ `application.hbs` 模板。对于我们生成的每个路由，如果你使用了 `--pod` 标志，则对应的是该路由文件夹中定义的 `template.hbs`\
  \ 模板；否则，模板以路由命名，并位于 `templates` 文件夹中。\n\n现在我们来创建登录路由。该路由需要让用户登录 EmberNote 应用。它应该像注册路由一样，通过主页上的链接访问，并允许之前注册的用户使用用户名登录。用户登录后，应被重定向到他们的笔记本列表（即我们已生成的另一个路由）。此外，用户登录后，注册和登录链接应不再显示。\n\
  \n为此，我们将对以下文件进行修改：\n\n*   `app/template/application.hbs`：添加导航，让用户能够加载登录路由，并在用户登录后隐藏注册和登录导航\n\
  *   `app/login/route.js`：定义登录动作\n*   `app/login/template.hbs`：定义登录路由的用户界面\n\n要访问登录路由，我们首先需要通过\
  \ `application.hbs` 文件使其可用。编辑该文件，使其内容如下：\n\n```\n[ch2/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/templates/application.hbs)\n\
  \n<div class=\"container\">\n  <div class=\"row\">\n    <div class=\"col-md-2\"\
  >\n      Welcome to EmberNote\n    </div>\n    <div class=\"col-md-10\">\n     \
  \ {{#if user}}\n        Hello, {{user.name}}\n      {{/if}}\n      {{#unless user}}\n\
  \        {{#link-to 'register'}}register{{/link-to}}&nbsp;\n        {{#link-to 'login'}}login{{/link-to}}\n\
  \      {{/unless}}\n    </div>\n  </div>\n  <div class=\"row\">\n    <div>\n   \
  \   {{outlet}}\n    </div>\n  </div>\n</div>\n```\n\n你首先要对文件添加一个 `{{#if}}` 表达式。该表达式包含的文本仅在表达式求值为\
  \ true 时显示。在这里，如果应用控制器的 `user` 属性有值，则显示用户名。我们将在接下来查看登录路由时了解这个 `user` 属性是如何设置的。\n\
  \n下一部分位于 `{{#unless}}` 表达式内部，当 `user` 属性缺失时显示。它包含了注册路由的 `{{#link-to}}` 导航项，以及我们新增的登录路由。\n\
  \n当用户点击登录路由的链接时，他们会被带到 `localhost:4200/login`。登录模板会被渲染到 `{{outlet}}` 中，这意味着该模板的内容会显示在由\
  \ `{{outlet}}` 表达式定义的占位符中。定义在 `app/login/template.hbs` 中的登录模板如下所示：\n\n```\n[ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)\n\
  \n<div class=\"col-md-12\">\n  Login: {{input value=name}} <button {{action 'login'}}>Login</button>\n\
  </div>\n```\n\n这个模板是与登录路由关联的唯一模板，只包含两个元素。`{{input}}` 表达式会生成一个 HTML 文本输入字段，并从 `name`\
  \ 属性中获取值。`{{action}}` 表达式会导致在路由中执行登录动作，我们接下来会定义它。\n\n所有这些都在登录路由类中整合在一起，如下所示：\n\n\
  ```\n[ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
  \nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  actions:\
  \ {\n    login: function() {\n      this.store.query('user', {\n        name: this.controller.get('name')\n\
  \      }).then((users) => {\n        if(users.get('length') === 1) {\n         \
  \ var user = users.objectAt(0);\n          this.controllerFor('application').set('user',user);\n\
  \          this.transitionTo('notebooks');\n        }\n        else {\n        \
  \  console.log('unexpected query result');\n        }\n      });\n    }\n  }\n});\n\
  ```\n\n正如我们在第 1 章中看到的，这个路由类使用了 ES6 模块语法。类的第一行导入了 Ember 框架，随后在类声明中扩展基础路由类时使用了它。我们使用了匿名声明并导出了该路由。Ember\
  \ CLI 会根据文件路径推断出这个类（尽管是匿名声明的）代表登录路由。\n\n接下来的代码块定义了 `actions` 哈希，它是一个由动作名称和实现组成的键值对列表。我们的登录路由只需要一个动作，即恰如其名的\
  \ `login` 动作。\n\n正如本章前面所述，登录动作会验证请求的用户是否已正确注册，然后显示用户的笔记本列表。接下来的代码块：\n\n```\nthis.store.query('user',\
  \ {\n  name : this.controller.get('name')\n})\n```\n\n使用来自 `template.hbs` 的 `name`\
  \ 字段值作为查询参数，对我们的服务器 API 执行查询。我们接下来会更新 API。\n\n为了让登录路由正常工作，你需要对我们创建的模拟服务器进行一个小修改。打开\
  \ `server/mocks/users.js` 文件，并按如下方式更新 GET 端点：\n\n```\n[ch2/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/users.js)\n\
  \nusersRouter.get('/', function(req, res) {\n  userDB.find(req.query).exec(function(error,users)\
  \ {\n    res.send({\n      'users': users\n    });\n  });\n});\n```\n\nEmber CLI\
  \ 应该已经在你修改时部署了这些更改，但如果由于某种原因没有部署，你可能需要从 `ember-note` 目录运行 `ember serve` 命令来同步。完成后，访问登录路由并尝试登录\
  \ EmberNote。你应该会被重定向到笔记本路由。\n\n由于对 API 的 `store.find` 调用是异步的，它会向登录路由返回一个 Promise\
  \ 对象。Promise 可以描述为一个最终会解析为某个值的对象。根据函数成功或失败，可以执行不同的逻辑。一旦这个 Promise 成功解析，`then` 块中的函数就会被执行。首先，我们检查是否只从\
  \ API 收到了一行数据。假设确实如此，我们将第一行也是唯一一行数据加载到 `user` 对象中。然后，为了使 `{{#if}}` 和 `{{#unless}}`\
  \ 块正常工作，我们在应用控制器中设置 `user` 属性。最后一步是运行 Ember 的导航函数之一 `transitionTo`。该函数将用户重定向到笔记本路由。\n\
  \n**RSVP：Ember 的 Promise 库**\n\nPromise 是一个广泛使用的概念，但没有标准的实现。ECMAScript 2015 预计会包含一个\
  \ Promise 实现，但在此之前，Ember 依赖于 RSVP。RSVP 符合 ES 2015 的进行中规范，但现在已经可用。它由 Ember 核心团队的成员维护，并在\
  \ GitHub 上提供：[`github.com/tildeio/rsvp.js`](https://github.com/tildeio/rsvp.js)。\n\
  \n\n\n\n在本节中，我们涵盖的内容远不止路由，目的是构建一个良好的示例。现在你需要关注的关键元素是 `{{#link-to}}` 表达式、`transitionTo`\
  \ 函数以及 `actions` 哈希。正如在 `application.hbs` 模板中所使用的，当用户点击生成的链接时，`{{#link-to}}` 表达式允许用户将登录路由的\
  \ `template.hbs` 加载到 `application.hbs` 的 `{{outlet}}` 中。要实现这一点，我们需要在 `router.js`\
  \ 中定义登录路由。`{{link-to}}` 表达式是让父路由将子路由加载到其出口的一种方式。\n\n实现导航的另一种方法是使用像 `transitionTo`\
  \ 这样的函数在路由之间移动。正如在登录路由中所使用的，它获取当前加载的路由（由调用该函数的实例决定），并将其替换为函数调用中指定的路由。正如我们的示例中指出的，我们可以使用这个函数不仅指示要加载哪个路由，还指示要加载哪条记录。稍后当我们查看如何设置路由的模型时，我们将看到目标路由如何知道要加载哪条记录。\n\
  \n最后，`actions` 哈希用于定义动作及其相关函数的名称-值对。这个概念并非路由专属，我们稍后会看到更多示例，但值得注意的是，动作处理的一个选项是以这种方式将你的动作添加到路由中。\n\
  \n现在我们更深入地理解了路由是什么以及如何使用它，让我们看看如何通过路由的模型钩子来加载和显示数据。\n\n## 设置你的模型\n\n当我们处理路由时，模型钩子用于加载并提供必要的数据。正如我们所见，并非每个路由都会实现其模型钩子，但大多数都会。模型钩子是一个函数，定义在\
  \ `Route` 类的实例中，用于加载该路由要显示的数据。\n\n在 EmberNote 应用中，我们还没有构建一个使用模型钩子的路由。现在让我们来做这件事。当用户通过登录动作登录时，我们使用\
  \ `transitionTo` 函数转换到 notebooks 路由。现在让我们定义这个路由，并在此过程中了解如何使用模型钩子。\n\nnotebooks 路由有一个简单的目的：显示用户在\
  \ EmberNote 中创建的笔记本列表。笔记本是笔记的集合，因此在 notebooks 路由中点击一个笔记本将显示该笔记本的笔记列表。以下是 notebooks\
  \ 路由：\n\n[`ch2/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)\n\
  \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
  \  model: function(params) {\n    return this.store.query('notebook',{user: params.user_id});\n\
  \  },\n  actions: {\n  }\n});\n```\n\n与登录路由类似，notebooks 使用 ES6 模块格式，并以必要的 import\
  \ 语句开头。此外，我们使用 `--pod` 命令行标志定义它，因此文件名为 `route.js`，位于 `app/notebooks` 路径下，定义使用 `export\
  \ default Ember.Route.extend` 形式。\n\n模型钩子是路由主体中的第一个块。它被定义为一个函数，当路由加载时由 Ember 执行。你还会注意到一个名为\
  \ `params` 的对象被传递给这个函数。我们稍后会回到这一点。\n\n模型钩子的主体包含一些 Ember Data 代码，用于加载已登录用户的笔记本。我们将在第\
  \ 5 章建模你的数据中进一步介绍 Ember Data，所以现在让我们专注于代码中与路由相关的部分。这行代码使 Ember Data 查询属于 `params.user_id`\
  \ 用户的笔记本对象。那么，这个 `user_id` 从何而来？\n\n为了向路由提供 `params` 对象，特别是 `user_id`，我们需要在路由定义中使用路径段。让我们看看\
  \ `router.js` 文件中 notebooks 路由的定义：\n\n[`ch2/ember-note/app/router.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)\n\
  \n```javascript\nthis.route('notebooks', { path:'notebooks/:user_id'}, function()\
  \ {});\n```\n\n这就是如何使用 `Router` 类定义带有路径段的路由。在 Ember 中，路径段用于提供一个值，该值可用于在路由中加载记录。对于这个路由，我们使用登录用户的\
  \ ID 来标识要加载的笔记本。在 `Router` 类中以这种方式定义路由，然后在 `Route` 中使用 `params` 对象，可以让你提供加载笔记本所需的数据。当然，最初导航到此路由的对象需要首先将该数据添加到路径中。在我们的例子中，我们需要修改登录路由中的\
  \ `transitionTo` 函数以提供此数据：\n\n[`ch2/ember-note/app/login/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
  \n```javascript\nthis.transitionTo('notebooks', user.get('id'));\n```\n\n有了正确的数据，我们就能对\
  \ API 发起查询，以获取当前用户的笔记本数据。\n\n> **安全提示**\n> \n> ![images/aside-icons/tip.png](img/tip.png)\
  \ 使用路径段在路由之间传递数据是 Ember 的一个极其有用的特性，但很容易以不安全的方式使用。在 URL 中放置明文数据存在潜在风险，因为恶意用户可以轻松更改它，试图破坏应用程序的安全性。这被称为直接对象引用漏洞，你可以在\
  \ [`www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References`](https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References)\
  \ 了解更多信息。\n\n接下来，我们需要定义笔记本 API。为此，运行以下命令来创建模拟服务，并为我们的路由提供 REST 服务：\n\n`$ ember generate\
  \ http-mock notebooks`\n\n然后，我们用以下代码填充生成的文件（我不会详细解释发生了什么；本质上与我们在添加数据服务中为用户服务使用的代码相同）：\n\
  \n[`ch2/ember-note/server/mocks/notebooks.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/notebooks.js)\n\
  \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
  \  var notebooksRouter = express.Router();\n  var bodyParser = require('body-parser');\n\
  \  app.use(bodyParser.json());\n  var nedb = require('nedb');\n  var notebookDB\
  \ = new nedb({ filename : 'notebooks', autoload: true});\n\n  notebooksRouter.get('/',\
  \ function(req, res) {\n    notebookDB.find(req.query).exec(function(error,notebooks)\
