  \    console.log('save failed');\n  });\n}\n```\n\n这个操作使用 Ember Data 创建一条新记录。它用模板中的值填充记录，并通过从应用程序控制器加载数据来填充笔记本模型的\
  \ `user` 字段：`user: this.controllerFor('application').get('user')`。\n\n一旦记录通过 Ember\
  \ Data 保存，我们清空 UI 字段，然后使用 `this.refresh()` 刷新列表。这会从服务器重新加载模型并显示你的新记录。\n\n\n\n\n\
  在本节中，我们重点介绍了 `Route` 实现中与显示数据相关的部分。我们还不得不涉及一些其他概念，例如模板和模型，这些将在本书后面更详细地介绍。如果你现在不完全理解这些内容，不必担心。还有很多内容需要讨论。我希望你能理解如何使用路径段、模型钩子以及相关的导航函数（如\
  \ `transitionTo`）来处理数据。本章的其余部分将主要关注路由之间的导航，以及在应用程序中创建路由层次结构。我们将从添加第一个子路由开始，该路由将是我们已创建路由的子路由：笔记路由。\n\
  \n## 嵌套路由\n\n到目前为止，我们只添加了位于应用程序路由下一级的路由。让我们进一步深入，添加一个子路由的子路由，也称为嵌套路由。运行以下命令：\n\n\
  ```\n$ ember generate route notebooks/notes --pod\n```\n\n此路由将用于显示属于特定笔记本的所有笔记。正如你所料，上述命令在\
  \ `Router` 中创建了一个新条目。我在 `app/router.js` 中添加了以下路径段信息：\n\n```\nthis.route(\"notebooks\"\
  , { path:\"notebooks/:user_id\"}, function() {\n  this.route(\"notes\", { path:\"\
  notes/:notebook_id\"}, function() {});\n});\n```\n\n通过更新路由类，使其如下所示（稍后我们会用到）。\n\n\
  [ch2/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/route.js)\n\
  \n```\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model:\
  \ function(params) {\n    return this.store.query('note', {notebook:params.notebook_id});\n\
  \  },\n  actions: {\n    addNote: function() {\n      this.store.findRecord('notebook',\n\
  \        this.paramsFor('notebooks.notes').notebook_id).then(\n        (notebook)\
  \ => {\n          console.log(notebook);\n          var note = this.store.createRecord('note',\
