  >\n    {{outlet}}\n  </div>\n</div>\n```\n\n我现在不会过多讨论模板代码——我们将在下一章详细介绍。我希望你注意到的是，我们直接从模板中引用了\
  \ `model`。正如本章前面提到的，在没有直接创建控制器类的情况下，我们可以依赖基础 `Ember.Controller` 类的默认功能。这个类有一个 `model`\
  \ 变量，默认情况下它会调用路由的 `model` 钩子来填充这个变量。\n\n对于笔记本路由，Ember Data 查询返回零行或多行。在 `template.hbs`\
  \ 文件中，引用的 `model` 是默认控制器中包含的变量。为了获取变量中的数据，我们使用了 `{{#each}}` 表达式，它会遍历模型实例列表。控制器中的\
  \ `model` 变量可以包含单个模型实例或模型实例数组。\n\n我们的模板在无序列表中显示笔记本标题。稍后我们将深入探讨模板和表达式的细节。目前，你的列表可能是空的。让我们看看如何使用操作来添加列表项并重新加载模板，以便它们显示出来。将以下代码添加到笔记本路由的\
  \ `actions` 哈希中：\n\n[`ch2/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)\n\
  \n```\naddNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
  \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
  \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n  \
