  \          });\n          console.log(note);\n          note.save().then(() => {\n\
  \            console.log('save successful');\n            this.controller.set('title',null);\n\
  \            this.refresh();\n          }, function() {\n            console.log('save\
  \ failed');\n          });\n        });\n    },\n    deleteNote: function(note)\
  \ {\n      console.log('deleting note with title ' + note.get('title'));\n     \
  \ note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\n你的新笔记模板应如下所示：\n\
  \n[ch2/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/template.hbs)\n\
  \n```\n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div class=\"col-md-4\"\
  >\n    <div>\n      title: {{input value=title}} <button {{action 'addNote'}}>Add</button>\n\
  \    </div>\n    <div>\n      <ul>\n        {{#each model as |note|}}\n        \
  \  <li>\n            {{#link-to 'notebooks.notes.note' note.id}}\n             \
  \ {{note.title}}\n            {{/link-to}}\n            <button {{action 'deleteNote'\
  \ note}}>delete</button>\n          </li>\n        {{/each}}\n      </ul>\n    </div>\n\
  \  </div>\n  <div class=\"col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n```\n\n\
  这被称为嵌套路由，之所以这样称呼，是因为它作为笔记本路由的子路由存在，并且只有作为子路由才有意义。该命令还在新目录 `notebooks/notes` 下创建了路由文件\
  \ `route.js` 和 `template.hbs`。我们之前已经填写了实现。\n\n### 缺失的笔记路由\n\n> ![images/aside-icons/warning.png](img/warning.png)\
  \ 如果你仔细查看新的笔记模板，你会发现我们添加了一个指向尚不存在的子路由的链接。这就是为什么添加新笔记后你看不到它们的原因。Ember 无法渲染该链接，因为子路由缺失，并且浏览器控制台中很可能有错误。别担心！我们将在第\
  \ 4 章 *使用组件实现复用* 中定义笔记路由。\n\n你可以像定义笔记本路由一样导航到此路由并定义它，只不过你的 `{{#link-to}}` 表达式位于笔记本模板中。我们将在第\
  \ 4 章中花更多时间处理笔记路由，并为其添加子路由，届时我们将构建一个编辑笔记的功能。在结束对路由的探索之前，让我们再看几个导航选项。\n\n## 路由间转换\n\
  \n很多时候，你会希望根据某个操作从应用程序的一个部分移动到另一个部分。Ember 提供了几种实现方式。其中一种方式是 `transitionTo` 函数。我们之前已经使用它从登录路由转换到笔记本路由：\n\
  \n[ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
  \n```\nthis.transitionTo('notebooks', user.get('id'));\n```\n\n该函数的第一个参数是你要转换到的路由名称。你可以提供顶级路由（如\
  \ `notebooks`）或嵌套路由（如 `notebooks.notes`）。你还可以在第二个参数中提供其他信息，例如特定的 `model`。如果提供了模型，接收路由将在渲染时使用该模型。如果像我们这样提供字面量，接收路由将调用其\
  \ `model` 钩子，并使用该字面量作为参数来加载模型。\n\n这是从一个路由移动到另一个路由的简单方法。需要注意的是，目标路由将渲染到与调用路由当前渲染的同一个\
  \ `{{outlet}}` 中。如果你想要更高级的功能，可以使用 `render` 函数，我们接下来会介绍。\n\n## 将模板渲染到命名出口\n\n除了 `transitionTo`\
  \ 函数，Ember 还提供了一个对转换进行更精细控制的函数：`render` 函数。使用 `render` 函数，你不仅可以控制渲染哪个路由，还可以控制渲染的位置以及使用的数据和控制器。\n\
  \n到目前为止，我们只使用了默认的 `{{outlet}}` 表达式来包含模板。Ember 还允许你创建命名出口，只需为出口提供一个名称：`{{outlet 'namedOutlet'}}`。\n\
  \n如果你想使用 `render` 函数，你需要命名受影响的出口。`render` 函数接受一个名称（表示要渲染的模板名称）和一个 `options` 对象。`options`\
  \ 对象可以包含以下任何参数：\n\n| 参数 | 描述 |\n|------|------|\n| `into` | 这是你要将模板渲染到的目标模板的名称。如果省略此参数，`Ember`\
  \ 将使用之前命名的模板的父模板。 |\n| `outlet` | 这是 `into` 参数中指定的模板上的出口名称。如果省略此参数，`Ember` 将使用默认出口。\
  \ |\n| `controller` | 用于渲染新模板的控制器类。如果未定义，`Ember` 将使用默认控制器。 |\n| `model` | 用于渲染新模板的模型类实例。如果未指定，`Ember`\
  \ 将运行目标路由的 `model` 钩子。 |\n\n\n\n\n渲染函数在你想要更改位于当前路由层级之外某个出口中显示的模板时非常有用。能够明确指定模板名称和位置，让你在导航控制上拥有高度灵活性，即使是在当前路由可能并不总是需要关注的区域也是如此。\n\
  \n## 下一步\n\n正如本章开头所述，路由模式是 Ember 的一个关键特性。它为你提供了一种清晰思考应用程序如何组装的方式，并帮助你理解如何从一个应用功能移动到另一个。我们已经看到了使用\
  \ Ember 路由所获得的一些特性。还有更多特性，但我们首先需要覆盖其他许多基础内容。我们的下一站是路由的亲密兄弟。正如你所了解的，每个路由对应一个模板，Ember\
  \ 使用该模板为给定路由渲染用户界面。在下一章中，我们将探讨模板特性以及 Handlebars 和 HTMLBars 表达式语言。\n\n版权所有 © 2015,\
  \ The Pragmatic Bookshelf.\n\n# 第 3 章\n\n布局用户界面\n\n在扎实理解如何使用路由组织应用程序之后，让我们来谈谈它们的兄弟：模板。在\
  \ Ember 中，正如你所期望的，模板包含了你用户界面代码的一部分。它由 HTML、CSS 和 Handlebars 表达式组成。\n\n在本章中，你将学习\
  \ Ember 的架构如何支持模板的使用。你还将学习更多关于如何创建模板、通过路由结构将它们相互关联，以及使用 Handlebars 表达式语言与 Ember\
  \ 对象交互的知识。此外，你将学习如何使用 Ember 框架中已有的各种表达式来为你的用户界面添加控制和显示逻辑。\n\n让我们直接进入你为每个应用创建的第一个模板：恰如其名的\
  \ application 模板。\n\n## 用单页创建你的应用\n\n你使用 Ember 创建的这类应用被称为单页应用，因为应用的编写方式使得所有内容都通过一个\
  \ HTML 页面渲染，对该页面的更改通过 DOM 操作和 Ajax 完成。\n\n在 Ember 中，当使用 Ember CLI 时，该页面被称为 `index.html`。我们在第\
  \ 1 章中看过它，但让我们再次查看 EmberNote 的 `index.html`：\n\n`[ch3/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/index.html)`\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n<title>EmberNote</title>\n<meta name=\"\
  description\" content=\"\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n\n{{content-for 'head'}}\n\n<link rel=\"stylesheet\" href=\"\
  assets/vendor.css\">\n<link rel=\"stylesheet\" href=\"assets/ember-note.css\">\n\
  \n{{content-for 'head-footer'}}\n</head>\n<body>\n{{content-for 'body'}}\n\n<script\
  \ src=\"assets/vendor.js\"></script>\n<script src=\"assets/ember-note.js\"></script>\n\
  \n{{content-for 'body-footer'}}\n</body>\n</html>\n```\n\n这个文件由 Ember CLI 构建，除了我们对标题的修改外，它完全就是\
  \ Ember CLI 在创建新应用时生成的内容。你可能注意到这个文件中没有对任何模板的引用。`{{content-for}}` 钩子是为 Ember CLI\
  \ 插件准备的，但我们并没有使用它们。那么，我们的应用是如何开始渲染的呢？\n\n关键在于 `ember-note.js` 文件。这个文件由 Ember CLI\
  \ 构建过程生成，包含了你到目前为止编写的每一行代码，以及许多你尚未编写的代码。如果你好奇，可以查看这个文件。你需要知道的是，为了渲染你的用户界面，这个文件包含了根据你创建的模板和其他所有支持类动态创建\
  \ DOM 结构的逻辑。然后它将这个结构插入到页面中，你的用户界面就呈现给了用户。\n\n位于模板层级根部的第一个模板是 application 模板。它位于\
  \ `application.hbs` 中，如下所示：\n\n`[ch3/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/templates/application.hbs)`\n\
  \n```html\n<div class=\"container\">\n<div class=\"row\">\n<div class=\"col-md-2\"\
  >\nWelcome to EmberNote\n</div>\n<div class=\"col-md-10\">\n{{#if user}}\nHello,\
  \ {{user.name}}\n{{/if}}\n{{#unless user}}\n{{#link-to 'register'}}register{{/link-to}}&nbsp;\n\
  {{#link-to 'login'}}login{{/link-to}}\n{{/unless}}\n</div>\n</div>\n<div class=\"\
  row\">\n<div>\n{{outlet}}\n</div>\n</div>\n</div>\n```\n\n我们在第 1 章中已经花了不少时间在这个文件上，但让我们看看模板特性。这个文件是\
  \ HTML 和一种称为 Handlebars 的表达式语言的混合体。我们将在本章中深入探讨你在该模板中看到的各种表达式。这个模板的特殊之处在于它位于模板层级的根部。因此，它是整个应用的起点。在我们的例子中，任何我们决定渲染的子模板都将被渲染到主要的\
  \ `{{outlet}}` 容器中。\n\n![images/aside-icons/info.png](img/info.png) Handlebars 是\
  \ Ember 的一部分，你会经常使用它，尽管它集成得如此深入以至于你可能没有意识到。Ember 使用 Handlebars 的 HTMLBars 变体，通过一个名为\
  \ `ember-cli-htmlbars` 的插件提供给应用。每当你使用本章将要讨论的组件之一时，你都在依赖 Handlebars。实际上，Handlebars\
  \ 有两层含义。首先，它是一个用 JavaScript 编写、基于 Mustache 的模板框架。其次，它是一种表达式语言，正如模板框架中所规定的那样。你只需通过使用\
  \ Handlebars 就能学到大部分你需要知道的内容，但如果你好奇心强，可以访问 [`handlebarsjs.com`](http://handlebarsjs.com)\
  \ 和 [`github.com/tildeio/htmlbars`](https://github.com/tildeio/htmlbars) 了解更多。\n\
  \n正如我们在第 2 章中看到的，EmberNote 的路由层级在 application 路由之下有三个路由：register、login 和 notebooks。这些路由中的任何一个都可以被渲染到\
  \ `{{outlet}}` 中。没有什么能阻止你尝试渲染层级更深的路由，但如果没有将预期的支持数据加载到路由的模型中，它可能无法正常工作。\n\n我们的布局相当简单，因此有一些选项我们没有使用。如果你考虑一个更复杂的例子，很可能在\
  \ application 模板上有多个出口。例如，你可能有一个用于左侧菜单的出口、一个用于顶部菜单的出口、一个用于页面主要部分的出口，等等。在这种情况下，你会使用命名出口，并采用\
  \ *将模板渲染到命名出口* 中的技术将路由渲染到这些出口中。\n\n现在让我们更仔细地看看如何创建和定义模板，然后我们将看到一些可以使用 Handlebars\
  \ 添加的控件。\n\n## 将你的 UI 分割成模板\n\n\n\n\n\n每个用户界面都由不同的控件分组组成，例如菜单、表格或表单，这些分组可以自然地分离成模板（或组件，我们将在下一节介绍）。在使用\
  \ Ember 时，一个好的设计步骤是审视你规划的用户界面，并在相关的控件集合周围划定边界。一旦你定义了可以用一个数据模型表示的控件组，你就得到了一个模板！让我们看看具体如何创建模板。\n\
  \n### 创建模板\n\n当你使用 Ember CLI 创建路由时，会同时生成一个模板供该路由使用。如果你使用了 `--pod` 标志，新路由的模板会放在该路由的目录下，并命名为\
  \ `template.hbs`。否则，它会被放在 `templates` 目录下，并命名为 `myroute.hbs`，其中“myroute”是你定义的路由名称。是否使用\
  \ `--pod` 标志主要是一个组织方式的选择，你应该根据自己觉得合理的方式来决定。我更喜欢将相关的模板和路由放在同一个目录中，因此我选择使用 `--pod`\
  \ 标志。\n\n当 Ember CLI 以这种方式创建新模板时，它唯一添加到模板中的内容是一个用于子路由的 `{{outlet}}` 表达式。剩下的内容就由你来添加了！让我们看另一个更有趣的模板——笔记本模板：\n\
  \n```\n<div>\n  <div class=\"col-md-3\">\n    <div>笔记本</div>\n    <div>\n      标题：{{input\
  \ value=title}}\n      <button {{action 'addNotebook'}}>添加</button>\n    </div>\n\
  \    <div>\n      <ul>\n        {{#each model as |notebook|}}\n          {{#link-to\
  \ 'notebooks.notes' notebook.id}}\n            <li>{{notebook.title}}</li>\n   \
  \       {{/link-to}}\n        {{else}}\n          <div>未找到笔记本</div>\n        {{/each}}\n\
  \      </ul>\n    </div>\n  </div>\n  <div class=\"col-md-9\">\n    {{outlet}}\n\
  \  </div>\n</div>\n```\n\n在模板中，你会看到 HTML 和 Handlebars 表达式（即双花括号内的任何内容）的混合。这个特定的代码片段包含了一些用于结构的\
  \ HTML 标签，但最有趣的是 Handlebars 表达式。现在让我们来看一个非常重要的表达式。\n\n### 链接模板\n\n该模板中的一个 Handlebars\
  \ 表达式是 `{{#each}}` 表达式。它代表一个基本的循环结构。回想一下，每个模板只绑定到一个路由和一个控制器。路由的一个作用是为其关联的模板提供数据。在这里，路由向笔记本模板提供了一个包含零到多个笔记本对象的列表。`{{#each}}`\
  \ 表达式会针对每个笔记本对象进行计算。如果路由提供了一个空列表，则会计算 `{{else}}` 部分，页面将向用户显示“未找到笔记本”。\n\n然后，列表中的每个笔记本对象都会执行以下代码：\n\
  \n```\n<div>\n  {{#link-to 'notebooks.notes' notebook.id}}\n    {{notebook.title}}{{/link-to}}\n\
  </div>\n```\n\n这是一个 `{{link-to}}` 表达式。在运行时，这个 `{{#link-to}}` 代码片段大致会生成以下 HTML：\n\
  \n```\n<a id=\"ember100\" class=\"ember-view\" href=\"notebooks/10/notes/1\">笔记本</a>\n\
  ```\n\n我们来分解一下这个链接。`{{#link-to}}` 表达式会生成一个路由，包括所有必要的路径段。在这个例子中，我们已经在笔记本路由上，并且为 id\
  \ 值为“10”的用户加载了该路由。我们试图从那里导航到笔记子路由，其中笔记本的 id 为“1”。\n\n虽然这个 HTML 很有趣，但 Ember 如何使用这个链接才是最重要的。当你点击链接时，Ember\
  \ 会将当前 URL 更新为 `http://localhost:4200/notebooks/1/notes/1`（数字可能略有不同，但其他段应该相同）。Ember\
  \ 会将笔记本模板渲染到应用模板的 `{{outlet}}` 中，并将笔记模板渲染到笔记本模板的 `{{outlet}}` 中。然后你可以向笔记路由添加子路由，以此类推。\n\
  \n下图说明了 URL 段与嵌套模板之间的关系。\n\n![images/route-diagram-1.png](img/route-diagram-1.png)\n\
  \nURL 与应用程序中确切位置（包括加载的数据）之间的关系是 Ember 的杀手级特性之一。当以这种方式使用时，URL 完全代表了用户的当前位置（用户在应用程序中的位置）和当前加载的数据（哪个记录可见）。生成的\
  \ URL 在加载时会一致地显示相同的信息，从而便于共享。\n\n在处理实际应用程序时，你的目标是以合理的方式向用户呈现信息。这些信息几乎总是包含数据片段之间的关系，而这些关系会形成层次结构。为了显示层次结构数据，你的用户界面将具有屏幕或小部件的层次结构。在\
  \ Ember 中，这些屏幕或小部件由模板封装。因此，虽然模板几乎是一个独立的功能单元，但你还需要考虑每个模板与其相邻模板的关系。\n\n将模板排列成层次结构并使用\
  \ URL 捕获应用程序状态的能力是 Ember 最有用的两个特性。但模板对开发者来说还有更多有用的内容。接下来，让我们看看如何使用 Handlebars 表达式来渲染一些标准的\
  \ HTML 控件。\n\n## 使用表达式渲染 HTML 控件\n\n到目前为止，我们使用了一些相当普通的控件来说明 Ember 的模板系统。但 Handlebars\
  \ 表达式语言和 Ember 的助手类能够渲染出更多样化的内容。\n\n在本节中，我们将介绍 Ember 中最有用的控件。我们将从如何使用 Ember 显示静态数据开始，然后讨论条件语句和循环。接着，我们将介绍输入控件，最后通过操作和链接来结束本节。\n\
  \n### 渲染数据\n\nHandlebars 表达式最基本的用途就是简单地显示来自路由及其相关控制器的数据。控制器是一个类，用于提供通过路由的模型钩子提供的数据的访问。回想一下，每个模板只绑定到一个路由。控制器也是如此。每个控制器维护一组属性，这些属性是模板可以使用的数据。到目前为止，我们还没有需要显式定义控制器类，而是依赖框架的默认功能。然而，如果我们想显示某个控制器属性的数据，只需在模板的表达式里添加它，如下所示：\n\
  \n```\n<div>{{propertyName}}</div>\n```\n\n该属性中保存的任何数据都会作为静态文本显示在页面上。如果你的控制器如下所示：\n\
  \n```\nimport Ember from 'ember'\n\nexport default Ember.Controller.extend({\n \
  \ propertyName: \"一个值\"\n});\n```\n\n那么前面的表达式将渲染为：\n\n```\n<div>一个值</div>\n```\n\
  \n控制器可以管理单个记录的数据（称为 `ObjectController`），也可以管理多个记录的数据（称为 `ArrayController`）。在我们的示例中，支持笔记本模板的控制器是一个\
  \ `ArrayController`。如果你有一个 `ArrayController`，你可以使用 `{{each}}` 表达式来渲染它管理的记录列表中的数据，正如我们在本章前面看到的那样。现在让我们转向\
  \ Ember 的控制流表达式。\n\n\n\n\n\n### 使用循环和条件控制模板\n\nEmber 提供了多种控制模板显示内容的方式。其中一种结构是 `{{if}}`\
  \ 表达式。`{{if}}` 表达式会根据提供的属性是否为真，或者是否为假、`null`、`undefined` 或 `[]`（哦，JavaScript），来决定是否渲染模板的某一部分。\n\
  \n要使用 `{{if}}` 表达式，你需要将需要条件包含的代码块包围起来，就像这样：\n\n```\n{{#if condition}}\n  <div>HELLO</div>\n\
  {{else}}\n  <div>never mind</div>\n{{/if}}\n```\n\nEmber 将这种表达式称为块表达式，因为模板代码块被表达式包围。块表达式需要开始和结束标签（例如\
  \ `{{#if}}` 和 `{{/if}}`）。在这个例子中，如果 `condition` 为真，则渲染 \"HELLO\"；否则渲染 \"never mind\"\
  。\n\nEmber 还允许你将多个条件串联起来，而不是将它们嵌套在 `{{else}}` 块中。如果你需要串联两个、三个甚至四十七个条件，可以这样做：\n\n\
  ```\n{{#if condition}}\n  <div>HELLO</div>\n{{else if condition2}}\n  <div>never\
  \ mind</div>\n{{else if condition3}}\n  <div>WAT</div>\n{{else}}\n  <div>go away</div>\n\
  {{/if}}\n```\n\n你也可以使用内联 if 来简化标准的 `{{if}}` 语法：\n\n```\n{{if condition 'on' 'off'}}\n\
  ```\n\n内联条件的第二个和第三个参数可以包含属性或字符串，但不能包含其他内容。`{{if}}` 表达式有一个兄弟表达式叫做 `{{unless}}`。当你只有一种情况需要渲染表达式主体，并且不想通过“非”操作来混淆条件时，可以使用这个表达式，就像这样：\n\
  \n```\n{{#unless hasChrome}}\n  运行此应用需要 Chrome 浏览器。\n{{/unless}}\n```\n\n除非用户拥有\
  \ Chrome 浏览器，否则会显示仅限使用 Chrome 的警告。`hasChrome` 变量是由后端模型或路由属性提供的值，并非 Ember 的标准部分。是的，你也可以使用\
  \ `{{if}}`，但这种表达式和属性的组合读起来更清晰。你会注意到我们在 `application.hbs` 模板中使用了这些表达式。\n\n在本章前面，你已经看到了使用\
  \ `{{each}}` 循环遍历项目列表的代码，所以我就不再重复了。我要提醒你的是，`{{each}}` 要求你的控制器引用一个记录列表作为其模型。\n\n\
  ### 绑定输入字段\n\n到目前为止，我们看到的每个表达式都用于显示静态文本。Ember 的强大之处在于它能够将可编辑字段链接到控制器，因此我们也需要使用输入字段。现在让我们更新示例，使用输入字段。\n\
  \n首先，看一下笔记本模板：\n\n`[ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)`\n\
  \n```\ntitle: {{input value=title}}\n<button {{action 'addNotebook'}}>Add</button>\n\
  ```\n\n像这样最简单的 `{{input}}` 表达式会渲染出以下 HTML：\n\n```\n<input type=\"text\" value=\"\
  Notebook Title\" />\n```\n\n我们没有显式定义输入字段的类型，但 Ember 默认将其设置为 `\"text\"`。另一种选择是显式设置，就像这样：\n\
  \n```\n{{input type=\"text\" value=title}}\n```\n\n这会渲染出等效的 HTML。如果你仔细观察，会发现 `type`\
  \ 属性被设置为带引号的字符串，而 `value` 被设置为不带引号的字符串。这个区别很重要。带引号的字符串会按原样渲染到 HTML 中；不带引号的字符串会渲染给定控制器属性的值。\n\
  \n以下 HTML 属性也可以为输入字段设置：\n\n`accept`, `autocomplete`, `autofocus`, `autosave`, `disabled`,\
  \ `form`, `formaction`, `formenctype`, `formmethod`, `formnovalidate`, `formtarget`,\
  \ `height`, `inputmode`, `max`, `maxlength`, `min`, `multiple`, `name`, `pattern`,\
  \ `placeholder`, `readonly`, `required`, `selectionDirection`, `size`, `spellcheck`,\
  \ `step`, `tabindex`, `value`, `width`\n\n除了 HTML 属性，`{{input}}` 表达式还支持事件处理程序，在\
  \ Ember 中称为动作。你可以像这样从 `{{input}}` 表达式中链接一个动作：\n\n```\n{{input type=\"text\" value=name\
  \ action=\"execute\"}}\n```\n\n在前面的例子中，`value` 属性绑定到后端控制器中的一个变量。该值可以是绑定的，也可以是非绑定的。如果是绑定的，则不需要引号；如果是非绑定的，则提供你想要设置到字段值中的确切字符串，并加上引号。\n\
  \n`action` 属性绑定到回车键按下事件。当按下回车键时，会调用指定的动作。其他一些用户事件也可以通过将事件名称设置为一个动作来绑定（例如 `enter=\"\
  actionName\"`）。它们如下：\n\n- `enter`\n- `escape-press`\n- `focus-in`\n- `focus-out`\n\
  - `insert-newline`\n- `key-press`\n\n通过为每个用户事件提供动作，你可以在控制器或路由中触发动作，这些动作可用于加载数据、执行验证或写入持久化存储。在下一节中，我们将看到如何将动作分配给通用的\
  \ HTML 元素。但让我们先花更多时间了解 `{{input}}` 表达式。\n\n`{{input}}` 表达式还可以通过将 `type` 设置为 `checkbox`\
  \ 来渲染复选框。与文本类型类似，它也有许多可配置的属性：\n\n- `autofocus`\n- `checked`\n- `disabled`\n- `form`\n\
  - `indeterminate`\n- `name`\n- `tabindex`\n\n这些属性可以绑定到控制器属性，也可以不绑定。\n\n有时你需要捕获比文本字段能舒适显示的更多文本。在这种情况下，可以使用\
  \ `{{textarea}}` 表达式。`{{textarea}}` 表达式的工作方式与 `{{input}}` 表达式类似。它渲染一个类型为 `textarea`\
  \ 的控件，其值绑定到控制器模型的选定属性。\n\n```\n{{textarea value=property rows=5 cols=40}}\n```\n\
  \n你还可以看到我们设置了一些其他 HTML 属性：`rows` 和 `cols`。和之前一样，如果设置为控制器属性，它们将采用这些属性的值；否则，它们将被设置为提供的任何特定值。总的来说，以下\
  \ HTML 属性也可以在 `{{textarea}}` 表达式中使用：\n\n`autofocus`, `cols`, `disabled`, `form`,\
  \ `maxlength`, `name`, `placeholder`, `readonly`, `required`, `rows`, `selectionDirection`,\
  \ `selectionEnd`, `selectionStart`, `spellcheck`, `tabindex`, `value`, `wrap`\n\n\
  这是将属性链接到用户界面的三种最基本的方式。你可能会觉得这有限制，如果这是在 Ember 中创建可重用控件的唯一方式，那确实如此。然而，还有另一种方式，我们将在下一章中看到。现在，让我们继续学习如何在\
  \ Ember 中启用动作处理。\n\n### 将动作绑定到路由\n\n你的用户界面需要做两件事：显示数据和响应用户输入。我们已经看到了第一点；现在让我们开始第二点。\n\
  \n你的路由与模板是一一对应的，它有一个可供模板使用的函数列表，称为动作。\n\n正如你所料，Ember 有一个用于将 HTML 元素动作与路由链接起来的表达式：`{{action}}`\
  \ 表达式。让我们看一个来自登录模板的基本动作示例：\n\n`[ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)`\n\
  \n```\n<div class=\"col-md-12\">\n  Login: {{input value=name}} <button {{action\
  \ 'login'}}>Login</button>\n</div>\n```\n\n\n\n\n\n首先，我们添加了一个输入字段，这样 `{{action}}`\
  \ 就有了操作对象。在路由中，动作处理器会获取该值并与服务器校验，以确认用户是否有效。`{{action}}` 表达式绑定到了我们添加的下一个控件：一个显示“登录”文本的\
  \ HTML 按钮。以这种方式使用时，`{{action}}` 表达式将路由中的登录动作绑定到按钮的 `onclick` 事件上。`onclick` 事件是按钮的默认事件，因此\
  \ `{{action}}` 表达式绑定到了该事件。当按钮被点击时，登录动作将被触发。\n\n我们在前一章已经看到了很多关于动作的内容，所以这对你来说可能是一次复习。现在让我们来看看模板的编译。\n\
  \n## 编译模板\n\n当你在 `template.hbs` 文件中创建模板时，你添加的 HTML 和表达式语言并不会直接构建成字符串。从 Ember 1.10\
  \ 版本开始，一个新的模板编译器 `HTMLBars` 被用于渲染你的模板。使用这个编译器，会在应用程序生成的 `ember-note.js` 文件中创建一个虚拟\
  \ DOM。只要你使用 Ember CLI 构建应用程序，这些细节对你来说都是透明的。\n\n这种编译形式之所以重要，有两个原因。首先，虚拟 DOM 的生成和更新比基于字符串的模板更快，因为虚拟\
  \ DOM 可以在单个节点（例如页面上的一个控件）的层面上进行处理，而不是在控件值发生变化时重新生成整个模板。\n\n其次，正是这种编译形式使得 Ember 能够使用服务器端渲染。使用服务器端渲染可以让用户在应用程序中体验到更快的初始启动速度，而不是看到一个空的\
  \ UI 加载并等待与服务器的往返来显示应用程序的初始数据。Ember 的服务器端渲染工具 `FastBoot` 仍在开发中，但有望在发布后极大地扩展 Ember\
  \ 的能力。\n\n### Ember 插件：Ember CLI Datepicker\n\n正如你所见，Ember 提供了许多基本功能，用于使用内置模板助手渲染\
  \ HTML 字段。然而，模板助手是 Ember 插件的完美用例，而其中一个这样的插件就是 Ember CLI Datepicker。\n\n`Ember CLI\
  \ Datepicker` 是一个插件，可以用最少的逻辑为你的 Web 应用添加一个 Bootstrap 风格的日期选择器控件。你只需添加一个表达式即可将此控件添加到页面中，例如：\n\
  \n```\n{{bootstrap-datepicker placeholder=\"选择日期\"}}\n```\n\n这将在你的应用中插入一个文本字段，点击后会弹出一个日期选择器。选择日期会将你的选择添加到文本字段中，让用户能够快速输入日期。\n\
  \n`Ember CLI Datepicker` 只是你可以用来快速向应用添加控件的几个类似插件之一。网站 [`emberobserver.com`](http://emberobserver.com)\
  \ 是查找类似插件（除了这个示例之外）的一个很好的起点。我们将在本书中继续看到特定的插件，并在第 9 章 *构建和使用 Ember 插件* 中讨论如何创建你自己的插件。\n\
  \n`Ember CLI Datepicker` 的完整文档可在 [`github.com/soulim/ember-cli-bootstrap-datepicker`](https://github.com/soulim/ember-cli-bootstrap-datepicker)\
  \ 找到，同时还有一个演示如何使用该插件的链接。\n\n## 下一步\n\n现在你应该已经很好地掌握了使用 Ember 和 Handlebars 表达式语言构建用户界面的过程。我们看到了模板之间如何相互关联，并且详细讨论了模板与路由之间的紧密关系，以及如何利用这种关系来渲染控件。在下一章中，我们将探讨如何利用这些概念创建我们自己的可重用控件，在\
  \ Ember 术语中称为组件。\n\n版权所有 © 2015, The Pragmatic Bookshelf.\n\n# 第 4 章：通过组件实现重用\n\n\
  路由和模板的组合非常强大，它负责了 Ember 为你开发工作带来的大部分效率。但还有一个更强大的功能我们尚未涉及：组件。在 Ember 中，组件是一种通过创建可重用元素来扩展\
  \ HTML 的方式。与路由和模板的配对类似，它同时实现了用户界面和动作层。但组件与路由和模板的不同之处在于，界面和动作层是不可分离的，并且组件的作用域仅限于传递给组件的信息。\n\
  \n组件的一个常见用例是，当你有一个用户界面片段想要在应用程序的多个地方重用时。一些例子可能是按钮、菜单，或者我们将要使用的示例——一个具有特定逻辑的文本区域。\n\
  \n你可能已经意识到，到目前为止，EmberNote 在笔记内容方面略显单薄。现在我们将通过添加创建带有真实内容的笔记的功能来改变这一点。为此，我们将创建一个新的路由，该路由依赖一个组件来驱动笔记的编辑。这个组件将实现你期望从编辑功能中看到的内容。你将能够编辑笔记的标题和正文，并保存该笔记，或者关闭组件并放弃更改。\n\
  \n为了增加趣味性，我们将在笔记正文中包含使用 Markdown 的功能。Markdown 是一种轻量级语言，用于对纯文本应用基本的 HTML 格式。因此，我们还需要能够预览\
  \ Markdown 处理生成的 HTML，我们将通过 Ember CLI 获取一个 Ember 插件来实现这一点。\n\n让我们通过为 EmberNote 创建这个新的编辑功能来看看如何使用组件。\n\
  \n## 创建组件\n\n由于组件使用模板来定义其 UI，但本身又被添加到包含它的模板中，因此组件和模板之间的关系可能有点棘手。对我来说，将 `{{input}}`\
  \ 控件作为一个例子来思考会有所帮助。它是一个独立的控件，可以在通用的 Ember 模板中使用。你将要定义的组件也以同样的方式工作。\n\n在创建组件之前，我们需要一个地方来放置它。我们将创建一个新的路由，并从该路由的模板中引用我们的新组件。由于我们一次只编辑一个笔记，因此这个路由最合理的位置是作为\
  \ `notebooks/notes` 路由的子路由。\n\n在命令提示符下，运行以下 Ember CLI 命令：\n\n```\n$ ember generate\
  \ route notebooks/notes/note --pod\n```\n\n这将为新的笔记路由创建一个空存根。我们稍后将填充这个新类。首先，我们需要修改\
  \ `Router` 实现和笔记模板，以便能够导航到我们的新路由。\n\n当你创建新路由时，Ember CLI 修改了 `Router` 类，将该路由包含在层次结构中的适当位置。由于我们将查询\
  \ Ember Data 以获取笔记记录，因此我们需要向路由添加一个参数，以便将笔记的 ID 传递给子路由。打开 `router.js` 并更新为如下所示：\n\
  \n[ch4/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/router.js)\n\
  \n```\nimport Ember from 'ember';\nimport config from './config/environment';\n\n\
  var Router = Ember.Router.extend({\n  location: config.locationType\n});\n\nRouter.map(function()\
  \ {\n  this.route('register');\n  this.route('login');\n  this.route('notebooks',\
  \ { path:'notebooks/:user_id'}, function() {\n    this.route('notes', { path:'notes/:notebook_id'},\
  \ function(){\n      this.route('note', { path:'note/:note_id'}, function(){});\n\
  \    });\n  });\n});\n\nexport default Router;\n```\n\n\n\n\n\n你可能还记得，我们在调用 `this.route`\
  \ 时使用了 `path` 属性来向路由提供数据。路由可以按自己的方式使用 `path` 属性中的数据。我们需要传递当前笔记的 ID。让我们调整笔记模板，将 ID\
  \ 提供给路由：\n\n```\n| [ch4/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/template.hbs)\
  \ |\n| ​  | ​**<div**​ class=​*\"col-md-12\"*​​**>**​ |\n| ​  | 笔记 |\n| ​  | ​**</div>**​\
  \ |\n| ​  | ​**<div>**​ |\n| ​  | ​**<div**​ class=​*\"col-md-4\"*​​**>**​ |\n|\
  \ ​  | ​**<div>**​ |\n| ​  | 标题: {{input value=title}} ​**<button**​ {{action 'addNote'}}​**>**​添加​**</button>**​\
  \ |\n| ​  | ​**</div>**​ |\n| ​  | ​**<div>**​ |\n| ​  | ​**<ul>**​ |\n| ​  | {{#each\
  \ model as &#124;note&#124;}} |\n| ​  | ​**<li>**​ |\n| ​  | {{#link-to 'notebooks.notes.note'\
  \ note.id}} |\n| ​  | {{note.title}} |\n| ​  | {{/link-to}} |\n| ​  | ​**<button**​\
  \ {{action 'deleteNote' note}}​**>**​删除​**</button>**​ |\n| ​  | ​**</li>**​ |\n\
  | ​  | {{else}} |\n| ​  | ​**<div>**​未找到笔记​**</div>**​ |\n| ​  | {{/each}} |\n|\
  \ ​  | ​**</ul>**​ |\n| ​  | ​**</div>**​ |\n| ​  | ​**</div>**​ |\n| ​  | ​**<div**​\
  \ class=​*\"col-md-8\"*​​**>**​ |\n| ​  | {{outlet}} |\n| ​  | ​**</div>**​ |\n\
  | ​  | ​**</div>**​ |\n```\n\n这将笔记页面从静态标题列表变为可点击链接列表。将 `note.id` 值添加到 `{{link-to}}`\
  \ 表达式中，会使该值在导航到新路由时被添加到 URL 中。这让我们能够将相关的笔记记录加载到子路由中。\n\n在我们的新路由中，我们希望使用 Ember Data\
  \ 加载相关记录，并提供一个允许我们不保存就关闭路由的操作。我们很快就会看到如何利用这些新增功能。`model` 钩子查询笔记记录，而 `close` 操作通过转换到笔记路由来离开当前路由。\n\
  \n以下是我们的实现：\n\n```\n| [ch4/ember-note/app/notebooks/notes/note/route.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/route.js)\
  \ |\n| ​  | ​**import**​ Ember from ​*'ember'*​; |\n| ​  |  |\n| ​  | ​**export**​\
  \ ​**default**​ Ember.Route.extend({ |\n| ​  | model: ​**function**​(params) { |\n\
  | ​  | ​**return**​ this.store.findRecord(​*'note'*​, params.note_id); |\n| ​  |\
  \ }, |\n| ​  |  |\n| ​  | actions: { |\n| ​  | close: ​**function**​() { |\n| ​ \
  \ | this.transitionTo(​*'notebooks.notes'*​); |\n| ​  | } |\n| ​  | } |\n| ​  |\
  \ }); |\n```\n\n我们现在可以开始编写组件了。\n\n一个 Ember 组件由两个文件定义。第一个是 Handlebars 模板，用于定义组件的用户界面。第二个是扩展\
  \ `Ember.Component` 的 JavaScript 类，用于定义模板需要执行的任何操作处理代码。\n\n我们将这个组件称为 `edit-note`。与\
  \ Ember 的其他领域一样，命名约定在这里很重要。组件名称中的短横线是 Ember 将其识别为组件的方式。要使用 Ember CLI 创建必要的文件，请在命令提示符下运行以下命令：\n\
  \n```\n| ​  | $ ember generate component edit-note --pod |\n```\n\n我们再次使用命令的 `--pod`\
  \ 形式，因为它提供了清晰的项目结构。此命令会创建一个目录和两个文件。该目录以组件命名，位于以下位置：`ember-note/app/components/edit-note`。这为我们提供了一个查找组件定义的单一位置。\n\
  \n在 `edit-note` 目录中还创建了两个文件：`template.hbs` 和 `component.js`。前者用于存放我们的 Handlebars\
  \ 模板，后者用于存放组件逻辑。\n\n我们现在有了一些存根文件来容纳我们的组件。因为我们想用它来显示笔记记录，现在来看看如何向组件提供数据。\n\n## 从包含模板获取数据\n\
  \n组件与模板/路由组合的一个重要区别是，组件没有能力检索自己的模型。组件依赖调用模板来提供所需的信息。这实现了组件的复用。通过提供要显示的记录，组件可以更容易地在各种上下文中使用。只要传递给它的记录包含它需要的属性，组件就能正常工作。现在，让我们看看如何定义标准可路由模板与组件之间的关系。\n\
  \n当我们创建新的笔记路由时，Ember CLI 不仅创建了 `route.js` 文件，还创建了 `template.hbs` 文件。虽然使用 `ember\
  \ generate` 命令的 `--pod` 形式会带来直观的项目结构，但也会导致大量同名文件。因此，注意你在目录树中的位置很重要。所以，在新创建的笔记路由中，像这样修改\
  \ `template.hbs` 文件：\n\n```\n| [ch4/ember-note/app/notebooks/notes/note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/template.hbs)\
  \ |\n| ​  | {{edit-note note=model close=\"close\"}} |\n```\n\n笔记模板非常简洁，这在 Ember\
  \ 中很常见。在这种情况下，模板只需要包含一个表达式：我们新定义的 `edit-note` 组件。我们在这个组件实例上设置了两个属性。`note=model`\
  \ 赋值用于将当前模型记录从笔记路由传递到 `edit-note` 组件中。（我们将在 *处理操作* 中讨论 `close=\"close\"` 赋值。）\n\n\
  `note=model` 赋值将笔记的模型属性设置为 `edit-note` 模板中 `note` 属性的值。如前所述，Ember 组件依赖调用模板来设置其属性。在这种情况下，我们提供整个记录，因为我们希望组件能够保存记录。如果不是这样，我们也可以只传递想要显示的值，而不是整个记录。\n\
  \n现在 `edit-note` 组件已经掌握了要显示的笔记，让我们看看如何创建组件用户界面。\n\n## 定义组件用户界面\n\n构建组件用户界面的过程你应该很熟悉。大多数情况下，你使用与构建模板相同的一组表达式来构建组件界面。界面由\
  \ Handlebars 表达式和 HTML 组成，并且可以访问调用模板中组件初始化定义的任何属性。\n\n例如，让我们看看 `edit-note` 模板的界面：\n\
  \n```\n| [ch4/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/template.hbs)\
  \ |\n| ​  | ​**<div>**​ |\n| ​  | {{input value=note.title}} |\n| ​  | ​**<button**​\
  \ {{action \"saveNote\"}}​**>**​保存​**</button>**​ |\n| ​  | ​**<button**​ {{action\
  \ \"closeNote\"}}​**>**​关闭​**</button>**​ |\n| ​  | ​**</div>**​ |\n| ​  | ​**<div>**​\
  \ |\n| ​  | {{textarea rows=10 cols=60 value=note.body}} |\n| ​  | ​**</div>**​\
  \ |\n| ​  | ​**<div>**​ |\n| ​  | {{markdown-to-html markdown=note.body}} |\n| ​ \
  \ | ​**</div>**​ |\n| ​  | ​**<div>**​ |\n| ​  | {{yield}} |\n| ​  | ​**</div>**​\
  \ |\n```\n\n这个模板与关联到路由的模板几乎没有区别。我们访问了 `note` 属性，该属性是在我们将此组件添加到笔记模板时设置的。我们使用相同的 Handlebars\
  \ 表达式来显示数据：`{{input}}` 和 `textarea` 表达式。这些依赖于传递给组件的笔记记录中存储的信息。\n\nW3C 自定义元素\n\n\n\
  \n\nEmber 组件是一个绝妙的想法，Ember 团队在实现它们方面功不可没。在撰写本文时，W3C 也正在制定关于自定义元素的规范，这与 Ember 使用组件的方式非常相似。Ember\
  \ 没有等待 W3C 最终确定规范（这可能需要很长时间），而是率先推进了其实现。\n\n在 W3C 规范中，自定义元素是一种由开发者定义的 DOM 元素，浏览器能够理解并渲染它。它允许开发者像组件一样定义\
  \ DOM 元素的用户界面和动作行为。如果该规范获得批准，它最终将成为 HTML 语言的一部分，从而减少对自定义框架支持的需求。\n\nEmber 团队密切关注标准制定过程，因此只要您保持相对较新的\
  \ Ember 版本，就可以放心，您的组件将在规范发布后与之匹配。正在制定的规范在 GitHub 上编写，您可以随时通过访问 [`w3c.github.io/webcomponents/spec/custom/`](https://w3c.github.io/webcomponents/spec/custom/)\
  \ 来阅读。如果您好奇，不妨去看看！\n\n这里还演示了另外三个特性：动作处理、组件嵌套和 `{{yield}}` 标签。我们将在 *处理动作* 中介绍动作处理。接下来我们先处理另外两个。\n\
  \n### 嵌套组件\n\n使用 Ember 组件的强大之处在于，能够将应用中反复出现的 HTML 标签组合起来，创建一个可复用的表达式来封装该组合。为了使这一特性更加强大，Ember\
  \ 组件支持嵌套。也就是说，您可以在一个组件内部调用另一个组件，并且它的工作方式与您预期的一致。\n\n在我们的新编辑笔记模板中，我们已经这样做了。对 `{{markdown-to-html\
  \ markdown=note.body}}` 的引用使用了另一个组件 `markdown-to-html`。我们还没有获取这个组件，因此这个引用目前无法工作。\n\
  \n`markdown-to-html` 组件是 Ember 插件的一部分。Ember 插件是一个足够有用的库，可以在多个应用程序之间共享。它可以通过 npm\
  \ 公开提供，就像我们正在使用的这个一样，也可以保存在私有仓库中。我们将在第 9 章 *构建和使用 Ember 插件* 中详细介绍 Ember 插件。\n\n\
  要安装该插件组件，请运行以下命令：\n\n```\n$ ember install ember-cli-showdown\n```\n\n此时，如果您的服务器正在运行，您可能需要按\
  \ `Ctrl-C`，然后运行 `ember serve` 重新启动。运行此命令后，EmberNote 应用程序会更新，包含对 `ember-cli-showdown`\
  \ 插件的依赖，该插件包含了 `markdown-to-html` 组件。^([[7]](#f_0034.html_FOOTNOTE-7)) 该插件及其所有必需的依赖项都会被下载，并可供\
  \ Ember CLI 在构建和部署应用程序时使用。\n\n让我们看看如何使用这个插件。在我们的编辑笔记组件模板中，有以下一行代码：\n\n```\n{{markdown-to-html\
  \ markdown=note.body}}\n```\n\n就像使用 `{{input}}` 表达式创建文本字段，或使用 `{{edit-note}}` 表达式创建编辑笔记组件一样，我们使用\
  \ `{{markdown-to-html}}` 来引用 `markdown-to-html` 组件。唯一的区别是，我们将一个组件嵌套在另一个组件内部。因此，我们能够使用的属性数据仅限于包含组件中已有的属性数据。\n\
  \n前面表达式中的 `markdown` 属性用于捕获组件将用来渲染 HTML 的属性。给定一个笔记，其正文是用 Markdown 编写的，组件会使用该正文，对其应用\
  \ Markdown 处理器，并渲染生成的 HTML。只要您记住在构建子组件时只使用包含作用域中的属性，嵌套组件就能很好地协同工作。\n\n现在您已经了解了如何通过嵌套组合组件，接下来让我们看看组件如何允许调用模板将内容注入到组件中。\n\
  \n### 使用 Yield 表达式\n\n在编辑笔记模板中，我们包含了一个 `{{yield}}` 表达式。该表达式允许调用模板将内容包含到组件中。让我们看一个简单的例子。\n\
  \n在 `ember-note/app/notebooks/notes/note/template.hbs` 的笔记模板中，进行以下更新：\n\n```\n{{#edit-note\
  \ note=model close=\"close\"}}\n  Notebook: {{model.notebook.title}}\n{{/edit-note}}\n\
  ```\n\n我们将 `edit-note` 表达式从内联形式改为块形式，并包含了一个正文。该正文将在组件中 `{{yield}}` 标签的位置渲染。然而，它是由笔记模板执行的。\n\
  \n这一点很重要，因为它意味着您可以访问不同作用域（即调用模板的作用域）中的信息。在这个例子中，由于我们将整个笔记模型传递给了 `edit-note` 组件，它可以查看该模型中的每个字段。但是，如果我们只传递了笔记对象的正文，那么它就只能看到这些，而只有调用模板才能看到完整的模型对象。\n\
  \n在设计动作时，作用域的概念也很重要，因为它决定了动作需要在何处执行，我们稍后会看到。现在，让我们看看如何调整组件所包裹的根元素。\n\n### 更改组件的根元素\n\
  \n当您创建一个组件时，为该组件生成的 HTML 位于一个根元素内部。默认情况下，Ember 使用 `<div>` 标签作为根 HTML 元素。然而，在某些情况下，您可能希望将组件包裹在不同的根元素中。任何\
  \ HTML5 元素都是有效的选择。\n\n要将组件的根元素设置为 `<div>` 以外的元素，您需要在组件上设置 `tagName` 属性。您可以通过几种方式实现这一点。\n\
  \n首先，您可以在包含模板中初始化组件时设置该属性的值，如下所示：\n\n```\n{{edit-note note=model close=\"close\"\
  \ tagName=\"span\"}}\n```\n\n这会将组件的根元素更改为 `<span>`。您也可以在类本身中设置该属性的值，如下所示：\n\n```\n\
  import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  tagName:\
  \ \"span\"\n});\n```\n\n这与在调用模板中设置属性具有相同的效果。如果您同时使用两种机制但设置了不同的值，则以调用模板设置的值优先。\n\n\
  我们已经讨论了很多关于 Ember 组件的显示问题。组件还能够定义自包含的动作处理代码。接下来我们转向这个话题。\n\n## 处理动作\n\n与组件可以渲染自己的内容并从调用模板（或组件）接受内容类似，组件可以定义自己的动作，也可以将动作引用回调用上下文。\n\
  \n很容易理解为什么存在这个特性。在某些情况下，例如对组件 UI 的 UI 操作，您更希望不依赖调用上下文，甚至不允许调用上下文看到您在做什么。在其他情况下，例如导航，您希望调用上下文定义预期的行为。\n\
  \n还有一些用例介于两者之间，例如保存记录。如果您将整个记录传递给了组件，您可以在组件中保存它。否则，您可能需要在调用上下文中保存它。\n\n### 调用组件动作\n\
  \n当我们使用 Ember CLI 创建组件时，它会在项目中添加一个名为 `ember-note/app/components/edit-note/component.js`\
  \ 的文件。这是我们定义动作处理程序的地方。\n\n打开该文件，并添加以下代码：\n\n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\
  \n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`。\n\n在`List.of(arg0,\
  \ arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
  \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  ```js\n// ch4/ember-note/app/components/edit-note/component.js\nimport Ember from\
  \ 'ember';\n\nexport default Ember.Component.extend({\n  actions: {\n    saveNote:\
  \ function() {\n      this.get('note').save();\n    },\n    closeNote: function()\
  \ {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\n如你所见，在组件中定义动作的方式与在路由中定义动作的方式没有太大区别。`actions`\
  \ 哈希用于将函数映射到这些函数的名称，就像在路由中一样。\n\n动作函数的实现可以访问任何已传递给组件或在类级别注入到组件中的属性。我们还没有介绍注入，这里也没有使用它。目前，你只需要知道，通过在某些应用级上下文中使用注入，可以访问框架各个部分中的某些公共对象。\n\
  \n在本例中，`saveNote` 函数仅负责保存笔记记录。它依赖于笔记记录自带保存逻辑这一事实，并调用该函数。\n\n在模板中，以下代码行将 `saveNote`\
  \ 动作链接到保存按钮：\n\n```js\n// ch4/ember-note/app/components/edit-note/template.hbs\n\
  <button {{action \"saveNote\"}}>save</button>\n```\n\n与普通的模板/路由配对一样，点击此按钮会执行 `saveNote`\
  \ 动作。\n\n组件作用域内的动作（例如 `saveNote`）的使用场景比引用的动作要有限一些。它们只能操作组件作用域内的数据（即由调用模板传入的数据）或注入的对象。如果你能接受这些限制，那么尽可能让组件的逻辑保持自包含是一个好主意。\n\
  \n然而，如果你希望将实际行为的定义交由调用路由/模板来处理，你可以使用发送动作来实现。\n\n### 发送动作\n\nEmber 组件还提供了将组件的模板链接到调用路由（或路由层次结构中更上层）中某个动作的能力。发送动作就是这种能力。我们将在\
  \ `edit-note` 中定义一个发送动作。\n\n乍一看，`closeNote` 动作与 `saveNote` 动作看起来没什么不同。然而，它不是在组件上下文中执行，而是使用\
  \ `sendAction` 方法请求包含该组件的路由来处理该动作。让我们跟随这段代码，看看它如何影响各个类和模板。\n\n首先，在 `edit-note` 模板中，以下代码用于将动作映射到关闭按钮：\n\
  \n```js\n// ch4/ember-note/app/components/edit-note/template.hbs\n<button {{action\
  \ \"closeNote\"}}>close</button>\n```\n\n这会导致在组件的动作映射中调用底层的 `closeNote` 函数。该函数如下所示：\n\
  \n```js\n// ch4/ember-note/app/components/edit-note/component.js\ncloseNote: function()\
  \ {\n  this.sendAction('close');\n}\n```\n\n这就是有趣且强大的地方。`sendAction` 方法接受一个字符串参数，但这个字符串并不是将在包含路由上调用的函数名称。它实际上是组件属性的值，该属性由包含模板设置，并指向包含路由上的函数。以下是包含模板的样子：\n\
  \n```js\n// ch4/ember-note/app/notebooks/notes/note/template.hbs\n{{edit-note note=model\
  \ close=\"close\"}}\n```\n\n在 `close=\"close\"` 赋值的左侧，我们定义了用于保存动作的组件参数名称。这与 `closeNote`\
  \ 动作中传递给 `sendAction` 的字符串相匹配。在赋值的右侧，我们使用了路由中动作的名称。底层路由应如下所示：\n\n```js\n// ch4/ember-note/app/notebooks/notes/note/route.js\n\
  import Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params)\
  \ {\n    return this.store.findRecord('note', params.note_id);\n  },\n\n  actions:\
  \ {\n    close: function() {\n      this.transitionTo('notebooks.notes');\n    }\n\
  \  }\n});\n```\n\n你可以看到这里定义了 `close` 动作。在本例中，它定义了一个简单的路由转换，效果是在路由层次结构中向上移动一层，并在此过程中关闭\
  \ `edit-note` 屏幕。\n\n如前所述，这是一个非常强大的结构。本质上，`sendAction` 允许你定义一个带有占位动作的组件，其确切结果可由包含路由决定。这大大增强了组件的可复用性，因为它允许组件在不同上下文中使用，同时仍能描述部分行为，而让调用上下文来填充细节。\n\
  \n`sendAction` 方法还有一个细节。如果你调用 `sendAction` 时没有传递指示属性名称的字符串参数，该方法会假定你正在寻找一个以属性名 `action`\
  \ 定义的动作，并相应地进行处理。当组件可能只关联一个动作时，这可能很有用，但我更喜欢方法的命名属性形式，因为我认为它更清晰。\n\n正如我们所看到的，组件可以通过在组件内部显式定义行为，或者将动作引用到组件的调用上下文，来响应动作。根据你的需求，这两种方式都会用到。在结束组件讨论之前，让我们再看一种组件响应用户事件的方式。\n\
  \n### 监听事件\n\n使用动作来响应事件是将逻辑链接到组件的一种简单方式。也可以以事件驱动的方式执行代码。\n\n在 Ember 中，每个组件都基于 `Ember.View`\
  \ 类，即使是像 `{{input}}` 这样随框架一起提供的组件也是如此。我们之前没有涉及视图，因为构建 Ember 应用并不需要了解它们。它们主要在你开发\
  \ Ember 框架本身时才重要。\n\n不过，在这里了解视图是有帮助的。由于每个组件都基于一个视图，你可以响应视图能够响应的任何事件。例如，如果你正在设计一个有状态的\
  \ `<div>` 标签，你可能希望处理 `click` 事件，并在点击发生时改变 `<div>` 的状态，如下所示：\n\n```js\nimport Ember\
  \ from 'ember';\n\nexport default Ember.Component.extend({\n  click: function(event)\
  \ {\n    //在这里改变状态\n  }\n});\n```\n\n这为你提供了另一种在组件中响应用户输入的方式。通过依赖视图，你可以访问各种事件，这里无法一一列举。^([[8]](#f_0034.html_FOOTNOTE-8))\n\
  \n### Ember 插件：Ember CLI Materialize\n\n组件的核心思想是将应用中常用的 HTML 片段提取出来，封装成独立对象，并在整个应用中复用。当你将\
  \ CSS 样式表加入该模型时，就可以创建一套遵循标准化设计的一致用户界面元素。\n\n\n\n\n\n谷歌的 Material Design 规范（详见 [`www.google.com/design/spec/material-design/introduction.html`](http://www.google.com/design/spec/material-design/introduction.html)）就是这样一个标准化的设计，但如何在\
  \ Ember 中使用这套原则呢？\n\n`Ember CLI Materialize` 插件是一个试图回答这个问题的项目。它既是 Materialize CSS\
  \ 框架的 Ember CLI 封装，也是一个相关组件的库。通过在项目中引入 `Ember CLI Materialize`，你可以利用其样式表和组件来快速启动应用的设计，并根据需要进行扩展。\n\
  \n`Ember CLI Materialize` 的完整文档可以在 [`github.com/sgasser/ember-cli-materialize`](http://github.com/sgasser/ember-cli-materialize)\
  \ 找到，同时还有一个演示该插件及其组件的示例站点链接。\n\n## 下一步\n\n在 Ember 2 中，组件在框架中扮演着越来越重要的角色。通过以自包含、可复用的方式结合模板和路由背后的思想，你可以创建自己的一套控件，用于解决应用中常见的各种问题。现在我们已经了解了组件，也触及了\
  \ Ember 用户界面层的大部分主要方面。接下来，我们将转向数据层，学习 Ember 如何通过 Ember Data 与 RESTful 服务协同工作。\n\n\
  #### 脚注\n\n| [[7]](#f_0032.html_FNPTR-7) | [`github.com/gcollazo/ember-cli-showdown`](https://github.com/gcollazo/ember-cli-showdown)，在此致谢。\
  \ |\n\n| [[8]](#f_0033.html_FNPTR-8) | 查看 [`emberjs.com/api/classes/Ember.View.html#toc_event-names`](http://emberjs.com/api/classes/Ember.View.html#toc_event-names)\
  \ 获取完整的事件列表。 |\n\n版权所有 © 2015, The Pragmatic Bookshelf。\n\n# 第 5 章\n\n建模你的数据\n\n\
  Ember 作为前端 Web 框架提供了很多功能。到目前为止，我们几乎完全专注于应用的渲染和导航。但在构建应用时，你最终会需要包含数据。Ember 为此提供了一个解决方案：Ember\
  \ Data。\n\n`Ember Data` 将许多功能打包进一个小型库中。它为你的 Web 客户端提供了一种直接的建模方法，以便在应用中包含简单的记录。它从\
  \ RESTful 服务读取数据，缓存加载的数据，并将这些记录持久化回服务器。\n\n在本章中，你将学习如何使用 `Ember Data` 从 RESTful\
  \ 服务访问数据。我们将重点介绍一个经过优化设计的 RESTful 服务，该服务几乎不需要我们的应用进行任何配置。通过查看我们迄今为止在 EmberNote 中添加的所有与数据相关的代码，你将了解\
  \ `Ember Data` 的工作原理。让我们从查看目前已创建的模型类开始。\n\n## 定义你的模型\n\n`Ember Data` 模型类代表某种持久化存储中的一条记录。由于我们在\
  \ Web 上工作，这种持久化存储很可能通过 RESTful API 访问。`Ember Data` 记录是实际保存数据的模型类实例；而模型只是该记录的定义。记录最重要的方面是它维护的数据。让我们看看如何定义记录所维护的数据。\n\
  \n### 定义模型的字段\n\n与我们创建的其他类一样，我们首先运行 Ember CLI 命令来生成一个类的存根版本，从而定义模型。在 *添加数据服务* 中，我们运行了以下命令来生成\
  \ `User` 模型类。\n\n```\n$ ember generate model user\n```\n\n该类的存根版本没有字段。我们将添加它们，使类看起来像这样：\n\
  \n[ch5/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/user.js)\n\
  \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
  \  name: DS.attr('string')\n});\n```\n\n使用 `Ember Data`，你的模型定义非常简单。你的模型有一组字段，你在类中将其定义为键值对。键是你将在模板中引用数据的方式（例如\
  \ `user.name`）。\n\n定义字段时，你有几种选择来定义字段类型。如果要添加一个保存单个值的字段，可以使用 `DS.attr`。调用此函数会在模型中创建一个字段。如果不带参数调用此函数，模型将简单地接受传递给它的任何数据类型。\n\
  \n或者，你可以给它一个类型，称为 `Transform`，然后 `Ember Data` 会获取你的 API 提供的原始数据，并尝试使其符合你提供的类型。这就是我们的\
  \ `user.js` 示例所做的。`Ember Data` 提供了四种可用的默认选择：`string`、`number`、`Boolean` 和 `date`。如果需要，你可以定义自己的\
  \ `Transform` 实现，但我们现在先用这些基本类型。\n\n你还可以为字段定义默认值。例如，如果你的 `DS.attr` 调用如下所示：\n\n```javascript\n\
  name: DS.attr(\"string\", {defaultValue: \"Matt\"})\n```\n\n那么如果给定记录没有 `name` 的值，将使用\
  \ `Matt`。\n\n### 定义模型关系\n\n你的模型类可能包含包含一条记录甚至一个记录列表的字段，而不是基本数据类型。`Ember Data` 通过使用两个构造来实现这一点：`DS.hasMany`\
  \ 和 `DS.belongsTo`。为了看到示例，让我们看看 `notebook.js` 文件：\n\n[ch5/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)\n\
  \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
  \  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n\
  });\n```\n\n`hasMany` 和 `belongsTo` 函数都定义了调用类与另一个模型定义之间的关系。该函数的参数是另一个模型类的名称。在 `notebook`\
  \ 模型示例中，我们从 `belongsTo` 函数引用了 `user` 模型，从 `hasMany` 函数引用了 `note` 模型。从语义上讲，这是有道理的：一个笔记本属于一个用户，并且拥有许多笔记。\n\
  \n![images/notebook-relationships.png](img/notebook-relationships.png)\n\n通常需要双向遍历模型关系。例如，从\
  \ `note` 的角度来看，你可以包含一个指向 `notebook` 的 `belongsTo` 关系。而从 `user` 的角度来看，你可以包含一个指向 `notebook`\
  \ 的 `hasMany` 关系。\n\n当然，模型关系的基数并不总是一对多或多对一。如果你想要一对一关系，只需使用 `belongsTo` 创建两个关系。对于多对多关系，双方都应该是\
  \ `hasMany`。\n\n现在你已经更好地理解了如何定义模型类，接下来需要学习如何填充它们。让我们看看如何从服务器加载数据。\n\n## 从 RESTful\
  \ 服务加载数据\n\n在使用 Ember 构建应用时，你的数据很可能来自 RESTful 服务。RESTful 服务使用 HTTP 作为数据查询和传递机制。基于\
  \ HTTP 请求，它可以用于将数据返回给调用逻辑，或者以某种方式修改数据存储。\n\nEmber 项目非常热衷于将 Web 社区的最佳理念适配到 Ember\
  \ 框架中，而 `Ember Data` 对 RESTful 服务的使用也不例外。只需声明你的模型类，你就可以使用 `DS.Store` 对象从服务器获取数据，前提是\
  \ RESTful 服务暴露了预期的 API。\n\n虽然我们不会深入探讨 RESTful 服务的实现，但在本章的剩余部分中，我们将指出 `Ember Data`\
  \ 发出请求的 URL。在 *使用序列化器访问遗留 API* 中，我们将介绍如何使用 `Ember Data` 访问不遵循预期约定的 API。\n\nRESTful\
  \ API\n\n\n\n\n\n与编程世界中的许多概念一样，关于什么构成 RESTful API 也存在一些争论。（通常表现为“你的 API 不 RESTful！”\
  \ “不，你的 API 才不 RESTful！”）抛开这些不谈，我们来谈谈 RESTful API 应该如何与 Ember Data 一起使用。\n\n一般来说，RESTful\
  \ 服务是一种使用统一资源标识符来访问数据和执行函数的方式。RESTful 服务通常（但并非总是）使用 HTTP 作为传输协议。每个唯一的 URI 和动词组合定义了一个动作以及应用该动作时要使用的相关记录（或记录集）。例如，如果你想获取\
  \ id 为 24 的笔记记录，你可以向 `/note/24` 发起一个 GET 请求，并期望获得该记录的当前状态（如果存在的话）。\n\nRESTful API\
  \ 的实现超出了本书的范围，除了我们一直在创建的模拟服务（请不要在生产环境中使用它们）。你可以使用多种技术来实现一个 RESTful API，例如 Ruby on\
  \ Rails、Node.js、Java 或 .NET。选择权在你手中。\n\n一旦你定义了一个模型类，你就希望能够从该类的 API 端点加载数据。在此之前，你的应用需要声明一个\
  \ `DS.RESTAdapter` 类的实例。让我们看看我们为 EmberNote 项目声明的那个：\n\n```javascript\nimport DS\
  \ from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace: 'api'\n\
  });\n```\n\n这个适配器已经尽可能简洁了。这个 `RESTAdapter` 实现的唯一功能是标识 API 的根 URL。通常，适配器可以负责更多的事情，但我们先从简单的开始，并在《适配非传统\
  \ API》中更详细地介绍适配器。\n\n有了这个适配器，我们就可以开始向 API 查询记录了。\n\n## 查询 API\n\n当我们第一次开始使用 Ember\
  \ Data 时，我们用它在页面上显示登录用户拥有的笔记本列表。从我们的定义中可以看出，每条笔记本记录都属于一个用户：\n\n```javascript\nimport\
  \ DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
  \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n});\n```\n\n基于该模型，我们使用了笔记本路由的\
  \ `model` 钩子来从 API 加载数据：\n\n```javascript\nimport Ember from 'ember';\n\nexport\
  \ default Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('notebook',\
  \ {user: params.user_id});\n  },\n  actions: {\n    addNotebook: function() {\n\
  \      var notebook = this.store.createRecord('notebook', {\n        title: this.controller.get('title'),\n\
  \        user: this.controllerFor('application').get('user')\n      });\n      notebook.save().then(()\
  \ => {\n        console.log('save successful');\n        this.controller.set('title',\
  \ null);\n        this.refresh();\n      }, function() {\n        console.log('save\
  \ failed');\n      });\n    }\n  }\n});\n```\n\n正如你在《设置你的模型》中回忆的那样，`model` 钩子用于获取将在给定路由上显示的数据。我们使用\
  \ `this.store` 对象在路由中查找数据。`store` 对象是 `DS.Store` 的一个实例，它是客户端数据持久化存储。\n\n`find` 函数通常接受两个参数。第一个是\
  \ `find` 函数将返回的数据类型的类名。第二个是要查询的参数列表。如果这个列表为空，API 应返回该类型的所有记录。在我们的例子中，我们提供了当前登录用户的\
  \ ID，因此返回的所有笔记本都属于该用户。这个参数列表可以包含多个值，如果包含多个值，API 应返回与提供的每个条件都匹配的所有记录。\n\n如果你不知道要加载的记录的\
  \ ID，你可以使用其他字段的内容来编写查询。这就是我们在 `route.js` 中使用的查询形式，当我们调用 `this.store.query('notebook',\
  \ {user: params.user_id})` 来查找属于某个用户的笔记本时。用户的 ID 是关于笔记本的一个已知信息，但它并不能唯一标识笔记本。然而，如果你确实知道记录的\
  \ ID，就像上一章的编辑笔记示例那样，那么你可以使用 `find` 函数的另一种形式：\n\n```javascript\nmodel: function(params)\
  \ {\n  return this.store.findRecord(\"note\", params.id);\n}\n```\n\n最大的区别在于，在这种形式中，我们没有定义要搜索的字段。Ember\
  \ Data 假设我们正在搜索给定记录的 `id` 字段。如果你想加载所有记录，只需调用不带参数的 `findAll`，如下所示：\n\n```javascript\n\
  this.store.findAll(\"note\");\n```\n\n查询 API 的不同形式会导致向后端发送略有不同的 HTTP 请求。查询形式会向你的\
  \ API 发起一个 GET 请求，该请求使用 URL 查询参数将查询传递给后端。例如，`this.store.query(\"notebook\", { user:\
  \ 1})` 将产生这个请求：`GET \"/api/notebooks?user=1\"`。基于 ID 的形式也会发起一个 GET 请求。例如，`this.store.findRecord(\"\
  note\", 1)` 会产生 `GET \"api/note/1\"`。\n\n这些 URL 是 Ember Data 生成的默认 URL。但是，如果你的服务器\
  \ API 与 Ember Data 生成的不匹配，你不需要更改服务器。在《让适配器查询非传统 API》中，我们将看到如何使用 Ember Data 来更改它查询的\
  \ URL，以匹配现有的 API。这是 Ember Data 使消费 RESTful API 变得简单的众多方式之一。另一种方式是浏览器端缓存，我们现在就来介绍。\n\
  \n## 使用 Store\n\n如果 `DS.Store` 对象所做的只是代理对 RESTful API 的访问，那它仍然很有用。但它还提供了自用户会话开始以来加载的数据的浏览器端缓存。一旦用户通过上一节描述的\
  \ `find` 方法加载了一条记录，该记录就会驻留在缓存中，从而提供更快的访问速度。\n\n我们已经使用过 `store` 变量来查找记录，但还没有真正讨论它是什么。store\
  \ 是你与 RESTful API 交互的主要资源。除了提供 `find` 方法之外，它还缓存这些方法返回的数据，并提供用于处理缓存数据的方法。它还提供了修改记录的方法，我们将在本章后面看到。`DS.Store`\
  \ 的一个实例（由 `store` 变量表示）在每个 `Ember.Route` 实例中都是可用的。\n\nEmber Data 提供了多种方法来处理已加载到\
  \ store 中的数据。首先，如果你想获取 store 中已有的某种类型的所有记录，它提供了 `peekAll` 方法：\n\n```javascript\n\
  var allNotes = this.store.peekAll(\"note\");\n```\n\n该方法返回当前 store 中所有笔记记录的数组。每当你调用前面描述的任何一种查询方法时，结果都会被加载到\
  \ store 中，并且在整个应用中可用。\n\n\n\n\n\n在使用浏览器端缓存时，你需要留意其他用户可能修改了缓存数据的情况。存储不会随着每次变更而实时更新，因此，如果数据可能被他人修改，最好在需要使用记录时从服务器重新加载。为此，Ember\
  \ Data 为 `findRecord` 和 `findAll` 提供了 `reload` 标志。例如，如果我们希望在加载路由时确保获得共享笔记记录的最新更改，可以这样调用：\n\
  \n```\nmodel: function(params) {\n  this.store.findRecord(\"note\", params.id, {\
  \ reload: true })\n}\n```\n\n使用 `reload: true` 将始终确保你从服务器获取记录并包含最新更改。\n\n还有第二种方法可以实现这一点，前提是你已经持有该记录。如果记录已加载到缓存中，`findRecord`\
  \ 会在记录实例上调用 `reload` 方法。如果你已经拥有该记录，可以通过以下方式从服务器刷新此对象：\n\n```\nrecord.reload();\n\
  ```\n\n`DS.Store` 还包含一个方法，用于从服务器拉取指定类型的所有记录，无论缓存状态如何。为此，调用带有 `reload: true` 的 `findAll`\
  \ 方法：\n\n```\nmodel: function(params) {\n  this.store.findAll(\"note\", { reload:\
  \ true });\n}\n```\n\n你可能会认为确保获得最新数据的唯一方法是使用 `reload` 参数。这在一定程度上是正确的，因为 `findRecord`\
  \ 和 `findAll` 方法会返回存储中已缓存的记录（如果存在）。然而，`DS.Store` 提供了一种从存储中驱逐指定类型所有记录的方法：\n\n```\n\
  model: function(param) {\n  // 在查找数据之前，清空缓存\n  this.store.unloadAll(\"note\");\n\
  \  // 现在获取我的记录\n  return this.store.query(\"note\", { notebook: param.notebook_id\
  \ });\n}\n```\n\n调用 `unloadAll` 将为后续的 `query` 方法提供一个干净的状态。当你希望针对存储执行命名参数查询，同时确保返回的结果是来自服务器的最新数据时，这非常有用。\n\
  \n`DS.Store` 有许多方法用于处理服务器 API 以及将 API 调用的结果存储在浏览器端仓库中。正如你所料，它还提供了多种处理已加载记录的方式。在下一节中，我们将了解如何使用\
  \ Ember Data 来使用从 API 获取的记录。\n\n## 处理记录\n\n虽然 `DS.Store` 类中的许多方法涉及加载和缓存记录列表，但你的应用也常常直接处理记录。有时你会使用存储，有时你会直接调用记录上的方法。让我们从存储调用的方法开始，学习如何通过\
  \ Ember 应用添加数据。\n\n### 创建记录\n\n为了让用户觉得你的应用有用，他们需要能够将数据添加到持久化存储中。我们在 EmberNote 应用中已经看到了这一点，用户可以在其中添加自己的笔记本和笔记。现在让我们看看那段代码。在\
  \ notebooks 路由中，我们添加了一个让用户添加笔记本的功能：\n\n```\n// [ch5/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/route.js)\n\
  addNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
  \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
  \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n  \
  \  this.controller.set('title', null);\n    this.refresh();\n  }, function() {\n\
  \    console.log('save failed');\n  });\n}\n```\n\n新笔记本通过以下代码在存储中创建：`var notebook\
  \ = this.store.createRecord('notebook', {...});`。`createRecord` 方法接受两个参数。第一个参数是要创建的记录模型类型，这里是\
  \ `notebook` 类型。第二个参数是一个属性列表，由一组键值对组成。键应与所引用模型实现中定义的属性名称匹配。值则设置为每个属性的值。在这个例子中，我们从控制器中的字段提取值，并用它们填充新记录。\n\
  \n| 保存新记录 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png) 重要的是要认识到，调用\
  \ `createRecord` 并不会将新记录写入持久化存储。这条新记录只存在于存储中，直到调用下一段代码。要将这条新记录写入持久化存储，你必须在目标记录上调用\
  \ `save` 方法。 |\n\n`save` 方法返回一个 `Promise`，它可以解析为成功或失败。一旦 `Promise` 解析完成，就会调用结果 `Promise`\
  \ 对象上的 `then` 方法。正如日志语句所示，`then` 的第一个参数在 `Promise` 成功解析时执行，第二个参数在失败时执行。这允许你分别处理每种情况，并让用户了解进度。\n\
  \n当调用 `save` 方法时，存储会准备一个 HTTP POST 请求形式的 RESTful API 请求。请求体包含在持久化存储中创建记录所需的所有信息。例如，如果我们想创建一条标题为“new\
  \ note”、描述为“description”、属于笔记本 12 的笔记，请求将如下所示：\n\n```\nPOST /api/notes\n{note: {title:\
  \ \"new note\", body: \"description\", notebook: \"12\"}}\n```\n\n| 监控请求/响应流量 |\n\
  | --- |\n| ![images/aside-icons/tip.png](img/tip.png) 在完成这些示例时，留意请求/响应流量会很有帮助。Chrome、Firefox、Safari\
  \ 和 Internet Explorer 都内置了开发者工具，允许你观察站点生成的流量。这对于进一步研究 Ember Data 请求非常有用。 |\n\n请注意，此请求没有请求参数。我们只是向模型类型的通用\
  \ URL `/api/notes` 发送 POST 请求。此 URL 的 POST 方法专用于接收仅与创建新记录相关的请求，而不用于更新请求（更新请求使用 PUT\
  \ 方法）。\n\n现在我们已经了解了如何向 Ember 应用添加新记录，接下来看看如何修改现有记录。\n\n### 更新记录\n\n创建记录和更新记录之间没有太大区别：你只需在包含要保存数据的记录上调用\
  \ `save` 方法。主要区别在于 Ember Data 如何将操作转换为 HTTP 请求。\n\n当对持久化存储中已存在的记录调用 `save` 时，会向\
  \ API 发送一个 HTTP PUT 请求。例如，在编辑笔记路由中，我们使用以下操作来保存更改：\n\n```\n// [ch4/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/component.js)\n\
  import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
  \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
  \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\n保存笔记记录时，会生成一个类似如下的\
  \ HTTP 请求：\n\n```\nPUT \"/api/notes/12\"\n{note: {title: \"edited note\", body:\
  \ \"edited description\", notebook: \"12\"}}\n```\n\n\n\n\n这与为新建记录生成的 HTTP POST\
  \ 请求有相似之处。每个请求都包含待保存记录的 JSON 表示。每条记录使用相同的端点 `/api/notes`。然而，当保存方法识别到已有记录时，会使用 PUT\
  \ 动词，并且为了标识该记录，会在 URL 中添加一个路径段，其中包含记录的 `id` 字段值。根据此请求，API 应按照请求提供的记录保存更改。\n\n###\
  \ 删除记录\n\n当然，用户有时会犯错，或者想要释放数据。为此，你需要允许他们删除记录。Ember Data 提供了两种不同的方式来实现这一点。第一种方式与我们目前看到的方法类似。让我们稍微扩展一下\
  \ EmberNote，允许用户在 notebooks/notes 路由中删除笔记。首先，在笔记列表中添加一个删除按钮。确保模板如下所示：\n\n```\n[ch5/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/template.hbs)\n\
  \n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div class=\"col-md-4\">\n\
  \    <div>\n      title: {{input value=title}} <button {{action 'addNote'}}>Add</button>\n\
  \    </div>\n    <div>\n      <ul>\n        {{#each model as |note|}}\n        \
  \  <li>\n            {{#link-to 'notebooks.notes.note' note.id}}\n             \
  \ {{note.title}}\n            {{/link-to}}\n            <button {{action 'deleteNote'\
  \ note}}>delete</button>\n          </li>\n        {{else}}\n          <div>No notes\
  \ found</div>\n        {{/each}}\n      </ul>\n    </div>\n  </div>\n  <div class=\"\
  col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n```\n\n现在，修改路由以定义新按钮引用的操作。添加以下操作：\n\
  \n```\n[ch5/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/route.js)\n\
  \ndeleteNote: function(note) {\n  console.log('deleting note with title ' + note.get('title'));\n\
  \  note.deleteRecord();\n  note.save();\n}\n```\n\n调用 `deleteRecord` 并不会完全从后端删除记录。如你所见，你还需要调用\
  \ `save` 才能完全删除记录。\n\n与其他方法一样，`save` 会向 API 发送一个 HTTP 请求，这次是删除请求：\n\n```\nDELETE\
  \ \"/api/notes/12\"\n```\n\n由于我们正在删除记录，除了 URL 中的 ID 之外，无需提供任何其他信息。API 知道所需的一切，并返回成功或失败。\n\
  \n不过，与其他操作不同，删除操作也有一种快捷方式。`destroyRecord` 方法会直接从服务器删除记录，无需先调用 `save`。我个人倾向于强调代码的可读性和熟悉感，因此我更喜欢使用\
  \ `deleteRecord` 形式，但该选项也存在。\n\n现在，让我们看看如何确定记录的状态，这有助于你决定是否需要对其进行处理。\n\n### 获取记录的状态\n\
  \n我们一直在构建 EmberNote，使其在保存记录时以操作为驱动，但有时你可能希望将记录保存作为后台进程。在这种模式下，你需要使用记录的状态来决定保存哪些记录。要获取记录的状态，请调用以下代码：\n\
  \n```\nvar state = record.get('currentState.stateName');\n```\n\n记录的状态可以是以下值之一：\n\
  \n* `root.deleted.saved`\n* `root.deleted.uncommitted`\n* `root.deleted.inFlight`\n\
  * `root.empty`\n* `root.loaded.created.uncommitted`\n* `root.loaded.created.inFlight`\n\
  * `root.loaded.saved`\n* `root.loaded.updated.uncommitted`\n* `root.loaded.updated.inFlight`\n\
  * `root.loading`\n\n通常，这些状态的含义相当明确，但以下细微差别值得一提：`uncommitted` 表示记录尚未保存到持久存储中，`inFlight`\
  \ 表示保存正在进行中（请记住，保存是异步的），而 `saved` 表示记录已保存到持久存储中。\n\n通过获取存储中所有记录的列表，可以按时间间隔运行后台保存进程，并在无需用户操作的情况下保存数据。\n\
  \n### 从存储中清除记录\n\n有时你可能希望在不保存记录的情况下将其从存储中移除。考虑这样一种情况：用户正在离开一条记录，但未更改数据。你可以将记录保留在缓存中，以便以后需要时使用。或者，如果你希望限制缓存大小，或丢弃未保存的更改，你可能希望移除该记录。为此，请调用以下代码：\n\
  \n```\nif(record.hasDirtyAttributes()) {\n  record.rollbackAttributes();\n}\nthis.store.unloadRecord(record);\n\
  ```\n\n`unloadRecord` 方法用于从存储中移除记录。但请注意，我们在卸载之前使用 `hasDirtyAttributes` 检查了记录的状态。这用于确定记录是否有需要保存的更改。`unloadRecord`\
  \ 方法不会从缓存中移除脏对象，因此我们首先使用 `rollbackAttributes` 方法丢弃更改，然后才能从存储中删除记录。在撰写本文时，这是从缓存中丢弃记录的唯一方法；缓存本身不会根据时间老化来丢弃记录。\n\
  \n### Ember 插件：Fireplace\n\n也许你希望完全避免创建自己的后端。如果是这样，你可能会对 Firebase 以及一个名为 Fireplace\
  \ 的 Ember 插件感兴趣。\n\nFirebase 是一个 API 即服务提供商，你可以用它来托管自定义 API。该商业产品托管在 [`www.firebase.com`](https://www.firebase.com)\
  \ 上，让你能够快速搭建一个可用于 JavaScript、iOS 或 Android 应用的 API。\n\n虽然 Firebase 是一个很酷的产品，但我真正感兴趣的是\
  \ Ember 插件。这个插件维护在 [`github.com/rlivsey/fireplace`](https://github.com/rlivsey/fireplace)，文档在\
  \ [`livsey.org/fireplace/`](http://livsey.org/fireplace/)，它将 Firebase JavaScript\
  \ 客户端封装在 Ember 插件中，并通过 Ember Data 存储将 Firebase 的功能暴露给你的应用。只需在 Firebase 注册并将此插件添加到你的项目中，你就可以轻松地使用完整的后端\
  \ API 开始运行。\n\n## 下一步\n\nEmber Data 在处理 RESTful API 时非常有用。正如我们所看到的，它提供了强大的功能集来处理从这类服务器获取的数据。然而，我们只涉及了故事中简单的一部分。你可能会经常需要处理一个由于某种原因不遵循\
  \ Ember Data 期望的约定的 API。如果你发现你的 API 不符合其期望，也不必放弃 Ember Data。这就是为什么尽管主要关注前端，但理解 Ember\
  \ Data 生成的 HTTP 流量仍然很重要。在下一章中，你将学习一些 Ember Data 特性，这些特性允许你使用遵循自身规则的 API，以及如何让这类\
  \ API 按你的意愿工作。\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 6 章\n\n读取非标准\
  \ API\n\nEmber 的核心原则之一是重视约定优于配置。因此，Ember Data 非常容易与遵循 *处理记录* 中讨论的约定的 RESTful API\
  \ 一起使用。然而，在某个时候，你几乎肯定会遇到一个不遵循这些约定的 API。\n\n\n\n\n为了帮助解决这个问题，Ember Data 提供了一系列类，用于适配非标准\
  \ API，使其遵循 Ember 其余部分所期望的约定。这可以简单到将属性名称从一种命名约定转换为另一种，也可以复杂到使用 Ember Data 在传输过程中修改\
  \ JSON。\n\n在本章中，我们将探讨如何使用 Ember Data 来处理你可能遇到的任何标准或非标准 API。\n\n## 适配非传统 API\n\n\
  到目前为止，EmberNote API 一直使用 Ember Data 期望的 API 约定。在本章中，我们首先会创建一个不遵循传统约定的 EmberNote\
  \ API 的并行版本。然后，我们将使用这个新版本学习如何让 Ember Data 适配这样的 API。\n\n要开始这个过程，你需要为每个已创建的模拟服务器文件创建一个副本。取出\
  \ `ember-note/server/mocks` 目录中的每个文件，复制它，并在文件名末尾、文件扩展名之前追加 `-alt-api`，这样 `notes.js`\
  \ 就变成了 `notes-alt-api.js`。别忘了保留原始文件。在每个 `-alt-api` 文件中，我们创建 NEDB 数据文件的地方，通过追加 `-alt`\
  \ 来更改数据文件的名称，如下所示：\n\n```\nvar noteDB = new nedb({ filename : 'notes-alt', autoload:\
  \ true});\n```\n\n然后，在每个新文件的底部，更改监听器 URL，使其包含 `api` 路径段：\n\n```\napp.use('/api/alt/notes',\
  \ notesRouter);\n```\n\n运行 `ember serve` 命令，确保你的应用能够启动并连接新的 API。\n\n### 为你的 API\
  \ 添加请求头\n\n在新的 API 运行后，让我们按如下方式修改 `RESTAdapter`：\n\n```\n[ch6/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/adapters/application.js)\n\
  \nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace:\
  \ 'api/alt',\n});\n```\n\n对 `namespace` 的简单修改将使适配器将请求发送到备用的 API 端点。如果你现在在浏览器中加载\
  \ EmberNote，你会看到之前注册的用户无法登录，因为我们创建了新的底层数据存储。在生产应用中，你不需要这样做，但由于我们的模拟服务器端点都在同一个 Node\
  \ 实例中运行，我们必须创建单独的数据存储，以解决 NEDB 无法两次加载同一存储的限制。\n\n除了设置 API 端点路径之外，`RESTAdapter` 还有其他一些可用的自定义选项。例如，许多\
  \ API 需要 HTTP 请求头来标识用户。`RESTAdapter` 包含一个名为 `headers` 的属性，你可以根据需要设置它。让我们修改 EmberNote，在用户登录后，为每个请求添加一个用户令牌作为请求头。\n\
  \n为了从 `RESTAdapter` 内部填充请求头，我们需要一种向适配器提供用户数据的方法。当用户首次登录时，这些用户数据在登录路由中可用。之前，当我们想在用户路由之外获取用户数据时，我们只是使用了\
  \ `controllerFor` 方法。然而，这个方法在我们的 `RESTAdapter` 内部不可用。为了从适配器获取用户信息，我们需要使用 Ember 的高级特性之一：依赖注入。我们之前已经使用过依赖注入——实际上，每当我们在路由或控制器中调用\
  \ `this.store` 时，都在使用它。让我们看看如何创建自己的对象用于依赖注入。\n\n#### 创建并注入用户会话\n\n我们将创建一个名为 `Session`\
  \ 的类，并用它来存储我们想要在类之间共享的信息。我们将使用一个初始化器来初始化这个类并使其可用。初始化器是一个函数，当 Ember 应用在浏览器中首次启动时运行，它对于通过依赖注入使对象可用非常有用。要创建一个初始化器，请从\
  \ EmberNote 根目录运行以下 Ember CLI 命令：\n\n```\n$ ember generate initializer session\n\
  ```\n\n此命令会为你的初始化器生成一个存根。将以下代码添加到存根中以完成初始化器：\n\n```\n[ch6/ember-note/app/initializers/session.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/initializers/session.js)\n\
  \nimport Ember from 'ember';\n\nexport function initialize(container,application)\
  \ {\n  var session = Ember.Object.extend();\n  application.register('session:main',\
  \ session);\n  application.inject('adapter', 'session', 'session:main');\n  application.inject('route','session','session:main');\n\
  }\n\nexport default {\n  name: 'session',\n  initialize: initialize\n};\n```\n\n\
  第一段代码定义了该初始化器的 `initialize` 方法。该方法接收应用的容器和应用程序实例。在方法内部，我们扩展了 `Ember.Object` 并将结果赋值给一个名为\
  \ `session` 的变量。我们将使用这个匿名类，通过 `Ember.Object` 的 `get` 和 `set` 方法来保存会话信息。\n\n**Ember\
  \ 插件：Ember CLI Simple Auth**\n\n我们的示例会话对象是一个好的开始，但未来我们可能需要更复杂的身份验证和会话管理。Ember 本身不提供会话对象或内置的身份验证机制，但与其他大多数情况一样，有一个插件可以解决这个问题。让我们快速了解一下\
  \ Ember Simple Auth 和 Ember CLI Simple Auth 插件。\n\nEmber Simple Auth 项目是一个用于向 Ember\
  \ 应用添加身份验证的库。除其他功能外，它允许你针对自己的服务器或支持 OAuth 的外部服务进行身份验证。一旦通过身份验证，你可以使用 Ember Simple\
  \ Auth 授权对服务器的请求，通过阻止未授权用户访问来保护操作。\n\n然而，Ember Simple Auth 本身并不是一个插件。要将其与 Ember\
  \ CLI 一起使用，你需要 Ember CLI Simple Auth 插件，该插件打包了 Ember Simple Auth 代码，并使其能够通过 Ember\
  \ CLI 安装。这是一个很好的例子，展示了 Ember CLI 如何使分享好想法成为可能。像 Ember Simple Auth 这样的代码库，只需在项目中执行一条命令即可轻松获取。\n\
  \nEmber CLI Simple Auth 插件的完整文档位于 [`github.com/simplabs/ember-cli-simple-auth`](https://github.com/simplabs/ember-cli-simple-auth)。\n\
  \n现在我们有了一个会话对象，需要将其提供给需要它的类型。首先，我们以名称 `\"session:main\"` 在应用程序对象上注册此实例。使用 `register`\
  \ 方法会创建一个会话对象的单一实例，并在整个应用中共享。然后，我们可以使用这个单一实例在原本无法共享数据的对象之间共享数据。\n\n注册对象后，接下来的两行代码将此对象注入到适配器和路由类型的工厂中。`inject`\
  \ 函数的第一个参数是我们想要注入到的类型。第二个参数是我们希望在该类型中使对象可用的属性名称，第三个参数是我们之前注册对象时使用的名称。初始化器中的其余代码用于帮助组织执行顺序，我们将在下一章中看到。\n\
  \n现在我们已经有了一个准备好存储会话的初始化器，让我们修改登录路由以使用它：\n\n```\n[ch6/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/login/route.js)\n\
  \nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  actions:\
  \ {\n    login: function() {\n      this.store.query('user', {\n        name: this.controller.get('name')\n\
  \      }).then((users) => {\n```\n\n\n\n`if(users.get('length') === 1) {`\n`var\
  \ user = users.objectAt(0);`\n`this.session.set('user',user);`\n`this.transitionTo('notebooks',\
  \ user.get('id'));`\n`}`\n`else {`\n`console.log('unexpected query result');`\n\
  `}`\n`});`\n`}`\n`}`\n`});`\n\n因为我们把 `session` 对象注入到了路由类型中，所以应用中的每个路由现在都有一个名为 `session`\
  \ 的变量。我们将使用这个变量来存储登录用户，以便在 `RESTAdapter` 中引用它，现在我们来更新 `RESTAdapter`，如下所示：\n\n```\n\
  import DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace:\
  \ 'api/alt',\n  headers: function() {\n    if(this.get('session.user')) {\n    \
  \  return {\n        'username' : this.get('session.user').get('name')\n      };\n\
  \    }\n  }.property('session.user')\n});\n```\n\n这段新代码为 `RESTAdapter` 发出的每个 HTTP\
  \ 请求添加了一组键值对作为请求头。在这个例子中，我们只添加了一个请求头：`\"username\"`。`if` 语句确保只有在用户登录后才添加这个请求头。我们使用\
  \ Ember 的计算属性概念来设置请求头。计算属性将函数的结果赋值给属性。属性函数将所需的依赖项传递给函数——在这个例子中，我们需要 `session.user`\
  \ 对象。我们将 `\"username\"` 请求头设置为登录用户对象中的 `\"name\"` 字段。这确保了来自我们适配器的每个 HTTP 请求都会包含这个请求头，它可以用于\
  \ API 密钥、用户认证/授权等。\n\n这只是使用依赖注入的一种可能方式，我们将在第 7 章 *在 Ember 中重用代码* 中更详细地讨论这个主题。\n\n\
  ### 添加自定义 API 主机名\n\n虽然花了一些功夫，但使用初始化器、注入和 session 对象为 `RESTAdapter` 提供请求头数据，很好地展示了\
  \ Ember 的可扩展性。我们将在下一章中看到更多相关内容。\n\n除了我们已经介绍过的属性之外，`RESTAdapter` 还允许你自定义用于 API 调用的主机名，如下所示：\n\
  \n```\nexport default DS.RESTAdapter.extend({\n  hostname: 'https://embernote.example.com'\n\
  });\n```\n\n当你的 API 可能位于与 Ember 代码不同的子域时，这非常有用。\n\n现在我们已经了解了如何自定义适配器，接下来让我们看看如何利用\
  \ `RESTSerializer` 将一个特立独行的 API 转换为 Ember Data 模型类所期望的约定。\n\n## 使用序列化器访问遗留 API\n\
  \n尽管我们可能希望摆脱它们，但有时我们需要与遗留 API 一起工作。不过，我们不必抛弃整个模型层。通过使用 `RESTSerializer`，我们可以获取此\
  \ API 返回的原始数据，并将其转换为我们所期望的形式。\n\n在 Ember Data 中，序列化器是一个类，它接收一块数据并将其转换为不同的形式，以便在外部上下文中存储。例如，序列化器可用于修改属性名称以匹配你期望的格式。你可以获取原始的\
  \ JSON 负载并更改其结构以匹配你的模型层，或者删除无关信息。你还可以将模型数据序列化回服务器期望的格式并保存。\n\n**来自 Ember Data 的\
  \ RESTful 调用**\n\n![images/aside-icons/important.png](img/important.png) 重要的是要记住，虽然你可以更改来回传输的\
  \ JSON 负载的许多内容——甚至更改端点的预期名称，正如我们稍后将看到的——但你仍然使用相同的 HTTP 动词来查询你的 API。使用 `RESTAdapter`\
  \ 和 `RESTSerializer`，你可以更改很多内容，但你的 API 在这方面仍然遵循相同的约定。\n\n现在我们有了一个并行的 API，让我们进一步摆弄它，以学习如何使用这些功能。让我们从实现\
  \ `serialize` 和 `normalize` 方法开始。\n\n### 序列化数据\n\n让我们更改笔记本数据类型写入数据库的方式。我们将为笔记本类创建一个按类型划分的序列化器，这样只有这种数据类型会受到更改的影响。运行以下\
  \ Ember CLI 命令来创建这个新的序列化器：\n\n`$ ember generate serializer notebook`\n\n这个命令创建一个空的存根类。现在，假设这个备用的笔记本端点对数据属性使用了一种略有不同的大小写格式：它使用类式大小写格式。例如，字段将被称为\
  \ `\"Title\"` 而不是 `\"title\"`。\n\n扩展 `RESTSerializer` 的类用于修改从服务器获取或发送到服务器的数据。我们的备用\
  \ API 使用不同的大小写方案。在笔记本模型类中，属性是驼峰式大小写。我们的 API 期望记录以类式大小写属性存储。因此，当保存记录时，传统的模型属性名称需要从驼峰式转换为类式。看一下\
  \ `serialize` 方法：\n\n```\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({\n\
  \  normalize: function(typeClass, hash, prop) {\n    hash.title = hash.Title;\n\
  \    delete hash.Title;\n    hash.user = hash.User;\n    delete hash.User;\n   \
  \ return this._super(typeClass, hash, prop);\n  },\n  serialize: function(snapshot,\
  \ options) {\n    var json = {\n      Title: snapshot.attr('title'),\n      User:\
  \ snapshot.belongsTo('user').id\n    };\n    return json;\n  },\n});\n```\n\n`serialize`\
  \ 方法用于在记录发送到服务器之前修改它们。如果你在 `RESTSerializer` 实现中实现了这个方法，你就可以控制 HTTP 请求的 JSON 主体，以匹配你的\
  \ API 的期望。新记录和对记录的更改都将通过这个方法。`snapshot` 参数表示调用 `serialize` 方法时的模型记录。`options` 参数包含一个具有一个属性的哈希：`includeId`。这个属性将由调用适配器设置。当你创建新记录时，它将被设置为\
  \ `true`，否则为 `false`。\n\n我们的 `serialize` 方法创建了一个 JSON 哈希，但通过将驼峰式键替换为类式键来更改键。值保持不变。目前，我们的\
  \ API 端点决定了 `id` 字段的值，所以我们不需要担心它。\n\n在本章前面，我们更改了用户对象的存储方式，将其存储在 session 中。因此，我们需要对笔记本路由进行一个小修改，以使用\
  \ session 对象。将 `addNotebook` 操作更新为以下内容：\n\n```\nimport Ember from 'ember';\n\nexport\
  \ default Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('notebook',{user:\
  \ params.user_id});\n  },\n  actions: {\n    addNotebook: function() {\n      var\
  \ notebook = this.store.createRecord('notebook', {\n        title: this.controller.get('title'),\n\
  \        user: this.session.get('user') //Changed this from controllerFor\n    \
  \  });\n```\n\n\n\n\n```\nnotebook.save().then(() => {\n  console.log('save successful');\n\
  \  this.controller.set('title', null);\n  this.refresh();\n}, function() {\n  console.log('save\
  \ failed');\n});\n}\n}\n});\n```\n\n这一改动允许我们在保存新笔记本时使用存储在会话中的用户记录。\n\n如果 `serialize`\
  \ 方法从 Ember Data 预期的格式中提取数据并将其转换为 API 可消费的格式，那么 `normalize` 方法则执行相反的操作。我们在 `RESTSerializer`\
  \ 中已经用到了这一点。让我们看看具体是如何实现的。\n\n### 数据规范化\n\n`normalize` 方法定义在 `RESTSerializer` 的基础实现中。我们依赖的就是这个实现。由于我们执行的是相当直接的数据规范化操作，并且只是改变键的大小写，因此只需定义这个函数即可。让我们再看一下代码：\n\
  \n```\nnormalize: function(typeClass, hash, prop) {\n  hash.title = hash.Title;\n\
  \  delete hash.Title;\n  hash.user = hash.User;\n  delete hash.User;\n  return this._super(typeClass,\
  \ hash, prop);\n}\n```\n\n这个函数很简单：它将存储在类大小写键中的值映射到对应的驼峰大小写键上，然后删除类大小写的条目。\n\n有时你可能需要在\
  \ `normalize` 函数中执行其他操作，例如删除不必要的数据点或添加新数据。以下代码会在你的负载中添加一个带有当前时间的属性。\n\n```\nnormalize:\
  \ function(type, hash, prop) {\n  hash['currentTime'] = new Date();\n  this._super(type,\
  \ hash, prop);\n}\n```\n\n这些参数分别表示数据类型（即模型类）、要使用的哈希键名称（例如我们之前示例中的 \"notebooks\"\
  ）以及从服务器返回的负载。务必记得调用 `this._super` 并传入参数，以确保父类的 `normalize` 方法被调用，并且你定义的 `normalizeHash`\
  \ 操作得以执行。\n\n## 允许适配器查询非传统 API\n\n此时，你对序列化器所做的修改将允许你以新 API 的格式保存数据，但你将无法查询数据。在查询之前，你需要为笔记本模型创建一个新的\
  \ `RESTAdapter`。首先，运行以下命令：\n\n```\n$ ember generate adapter notebook\n```\n\n这将在\
  \ `ember-note/app/adapters/notebook.js` 中创建一个存根类。\n\n我们需要创建新适配器的原因是为了处理模型类中的属性名称与\
  \ API 中的属性名称之间的大小写差异。如果不创建这个适配器，查询参数 `{user : 1}` 将找不到任何记录，因为 API 中的属性名为 `User`。为了解决这个问题，请按如下方式实现适配器类：\n\
  \n`ch6/ember-note/app/adapters/notebook.js`\n\n```\nimport ApplicationAdapter from\
  \ './application';\nimport Ember from 'ember';\n\nexport default ApplicationAdapter.extend({\n\
  \  query: function(store, type, query) {\n    var keys = Object.keys(query);\n \
  \   for(var i = 0; i < keys.length; i++) {\n      var key = keys[i];\n      var\
  \ classifiedKey = Ember.String.classify(key);\n      query[classifiedKey] = query[key];\n\
  \      delete query[key];\n    }\n    return this._super(store, type, query);\n\
  \  }\n});\n```\n\n我们扩展了 `query` 方法，以便在查询到达服务器之前拦截它们。当我们在笔记本路由中使用参数哈希进行查询时，适配器上就会调用这个方法。我们的代码获取键值对（键为驼峰大小写），并将其替换为\
  \ API 所期望的大小写格式的键值对。然后，它将控制权传递给父类方法以执行查询。这使得我们的查询能够被 API 正确识别。如果你登录应用，应该能够添加新的笔记本，并看到新笔记本出现在列表中，就像我们更改后端\
  \ API 之前一样。\n\n## 适应路径名称变化\n\n不仅可以使用 `RESTAdapter` 更改属性名称，还可以修改路径以匹配。默认情况下，Ember\
  \ Data 会尝试将类名复数化以得到 API 路径，因此名为 notebook 的模型类将使用端点路径 notebooks。由于种种原因，这可能不准确。如果是这样，你可以使用\
  \ `pathForType` 方法来解决这个问题，如下所示：\n\n```\npathForType: function(type) {\n  if(type\
  \ === 'notebook')\n    return 'poorly-named-endpoint';\n}\n```\n\n如你所见，该方法将模型类名作为参数，并将其转换为完全不同的值，或者通过更改大小写、添加下划线等方式对名称进行某种修改。这使你能够适应端点\
  \ URL 上命名约定的变化。\n\n## 更改负载根键\n\n`RESTSerializer` 中有一个类似的方法，允许你接受来自服务器的 JSON 负载，并根据根键的名称确定正确的类型。考虑以下负载：\n\
  \n```\n{\n  \"Notebooks\" : {\n    //你的负载数据在这里！\n  }\n}\n```\n\n如果你实现了 `modelNameFromPayloadKey`\
  \ 函数，就可以更改根键的值，从而使 Ember Data 能够正确查找关联的模型类并相应地处理负载，如下所示：\n\n```\nmodelNameFromPayloadKey:\
  \ function(root) {\n  return Ember.String.camelize(root);\n}\n```\n\n这将 \"Notebooks\"\
  \ 转换为 \"notebooks\"，并允许 Ember Data 找到用于负载的适当模型类。\n\n当然，为了保存回服务器，你需要反转在 `modelNameFromPayloadKey`\
  \ 中执行的操作。你可以在 `payloadKeyFromModelName` 中实现这一点：\n\n```\npayloadKeyFromModelName:\
  \ function(modelName) {\n  return Ember.String.classify(modelName);\n}\n```\n\n\
  这将 \"notebooks\" 转换回 \"Notebooks\"，从而允许你将负载保存回具有该预期格式的服务器。\n\n## 在传输中修改负载\n\n我们已经涵盖了在使用\
  \ RESTful API 时可能遇到的大多数场景。不过，还有最后一个场景。你可能需要使用一个只能返回复合记录的 API，例如，API 响应中包含子记录作为 JSON\
  \ 负载中的子节点，而不是作为单独的节点。\n\n假设对笔记本 API 的查询返回了以下格式的数据：\n\n```\n{\n  \"notebooks\": {\n\
  \    \"id\": 1,\n    \"title\": \"notebook one\",\n    \"description\": \"description\
  \ one\",\n    \"notes\": [{\n      \"id\": 1,\n      \"title\": \"note one\",\n\
  \      \"description\": \"description one\"\n    },{\n      \"id\": 2,\n      \"\
  title\": \"note two\",\n      \"description\": \"description two\"\n    }]\n  }\n\
  }\n```\n\n请注意，\"notes\" 节点嵌套在 \"notebooks\" 对象内部。这不是 Ember Data 期望的负载格式。Ember Data\
  \ 期望相同的信息具有以下负载结构：\n\n```\n{\n  \"notebooks\": {\n    \"id\": 1,\n    \"title\"\
  : \"notebook one\",\n    \"description\": \"description one\",\n    \"notes\": [1,\
  \ 2]\n  },\n  \"notes\": [{\n    \"id\": 1,\n    \"title\": \"note one\",\n    \"\
  description\": \"description one\"\n  },{\n    \"id\": 2,\n    \"title\": \"note\
  \ two\",\n    \"description\": \"description two\"\n  }]\n}\n```\n\n\n\n\n为了进行这种转换，你需要在你的\
  \ `RESTSerializer` 实现中实现 `extractArray` 方法。该方法允许你对负载执行任何重新格式化或清理操作。以下是该方法的一个示例实现：\n\
  \n```\nextractArray: function(store, type, payload) {\n  //你可以在此处对负载进行处理，然后传递给父类\n\
  \  return this._super(store, type, payload);\n}\n```\n\n`payload` 方法参数是来自服务器的原始响应。你的实现很可能会获取这个负载，进行必要的调整以使其符合\
  \ Ember Data 预期的格式，然后将其传递给父类的方法实例。一些常见的操作可能包括更改负载的结构或删除不需要的信息，例如模型中不存在的属性。这让你能够利用即使是最非传统的\
  \ API 响应，同时仍然享受 Ember Data 的特性。\n\n当负载是对包含多行的查询（例如 `findMany`）的响应时，会使用此方法。还有一个并行方法，称为\
  \ `extractSingle`，它扮演相同的角色，但作用于仅包含一条记录的响应，例如 `find` 或 `save`。该方法签名包含一个额外的参数，如下所示：\n\
  \n```\nextractSingle: function(store, type, payload, recordId) {\n  //你可以在此处对负载进行处理，然后传递给父类\n\
  \  return this._super(store, type, payload, recordId);\n}\n```\n\n还有许多其他类似的方法，每个都支持特定的数据操作，例如\
  \ `extractCreateRecord`，但最相关的方法本质上只是 `extractSingle` 或 `extractArray` 的别名。然而，如果你的\
  \ API 要求不同的操作类型接受不同的处理，那么了解这些选项的存在是值得的。\n\n## 将适配器和序列化器绑定到你的模型类\n\n在你的应用中实现适配器/序列化器模式有两种方法。到目前为止，我们实际上已经使用了这两种方法。对于你想要在所有\
  \ REST 请求中共享的通用更改，例如添加用户令牌，你可以修改 Ember CLI 为你创建的应用程序适配器或序列化器，它们位于 `ember-note/app/adapters/application.js`\
  \ 和 `ember-note/app/serializers/application.js`。如果你想创建特定于模型的适配器或序列化器，可以运行以下命令之一：\n\
  \n```\n$ ember generate serializer mymodel\n\n或\n\n$ ember generate adapter mymodel\n\
  ```\n\n这会创建一个适配器或序列化器，它将应用于对给定类型数据的请求。然后你可以实现我们之前描述的功能，而不必担心它们会被不必要地应用于其他模型类型。\n\
  \n现在我们已经探讨了如何使用替代 API，让我们删除笔记本适配器和序列化器，并将我们的应用程序范围的 `RESTAdapter` 恢复原样。在命令行中，运行以下命令：\n\
  \n```\n$ ember destroy adapter notebook\n$ ember destroy serializer notebook\n```\n\
  \n然后修改 `ember-note/app/adapters/application.js` 文件中的 `namespace` 属性，如下所示：\n\n```\n\
  namespace: \"api\"\n```\n\n你可以保留 headers 不变；没有理由删除它们。随着我们对非标准 API 的快速浏览结束，我们已准备好进入下一步。\n\
  \n## 下一步\n\n`RESTAdapter` 和 `RESTSerializer` 类提供的功能远不止我们在这里所能涵盖的。这些类提供了一种强大的方式，可以使用\
  \ Ember Data 与几乎任何 API 配合使用，因此如果你遇到我们未涵盖的场景，我鼓励你进一步探索它们。我们现在已经看到了 Ember 和 Ember\
  \ Data 的许多核心特性，但还有更多内容等待我们。Ember 提供了多种选项来扩展这个核心，并使用框架本身将类链接在一起，以帮助你提高所创建类的实用性。在下一章中，我们将通过在整个应用中提供常用的实用程序来扩展\
  \ Ember。\n\n版权所有 © 2015, The Pragmatic Bookshelf.\n\n# 第 7 章\n\n在 Ember 中重用代码\n\n\
  我们已经花了大量时间学习 Ember 的核心特性。我们看到了如何使用这些核心特性构建 Web 应用，以及如何通过依赖 Ember 的约定式结构来快速完成。\n\n\
  这种结构不仅为你提供了一种构建应用核心的方法，还提供了在系统不同方面之间共享代码的几种方式。它提供了通过准备任何必要的对象来引导应用的能力。它还提供了将数据值从一种上下文转换到另一种上下文的能力，例如货币转换。\n\
  \n在本章中，我们将探讨如何使用 Ember 和 Ember CLI 在 Ember 的约定式结构之上分层添加特定于应用的抽象，以便你可以将合理的设计应用于 EmberNote\
  \ 的逻辑。让我们从最基本的抽象级别开始：实用工具类。\n\n## 使用实用工具抽象通用函数\n\n在对象之间共享代码的一种方法是创建一个简单的实用工具函数。Ember\
  \ CLI 包含一个用于创建实用工具函数的蓝图，该函数可以导入到其他类中。严格来说，以这种方式创建实用工具函数与其说是 Ember 核心框架的特性，不如说是 Ember\
  \ CLI 的特性。当我们探讨在第 8 章，构建、测试和部署你的 Ember 应用中构建应用时，我们将讨论 Ember CLI 如何使这一特性及其他特性成为可能。\n\
  \n创建实用工具函数的目标是为可能需要在不同、不相关的类中使用的逻辑提供一个单一的位置。我说“不相关”，是因为如果这些类是相关的，我们最好使用混入，正如我们在使用混入共享代码中看到的那样。\n\
  \n数据验证是可能存在于实用工具函数中的逻辑的一个很好的例子。你可能需要验证数据的原因有很多。你可能需要验证一个字符串是否是有效的电子邮件、电话号码或邮政编码。你可能需要验证字符串的长度，或者它是否是一个有效的日期。你可能需要验证它是否不包含某些字符。无论如何，你很可能希望在几个不相关的上下文中使用这种验证，因此验证是我们开始的一个很好的用例。\n\
  \n就我们的目的而言，假设我们想要验证 EmberNote 的笔记标题长度在 0 到 140 个字符之间。我们将创建一个实用工具函数来强制执行此操作，然后在我们的笔记路由中使用该函数。首先，从你的项目根目录运行以下命令：\n\
  \n```\n$ ember generate util is-valid-length\n```\n\n此命令创建一个空的实用工具函数，如下所示：\n\n```\n\
  export default function isValidLength() {\n  return true;\n}\n```\n\n为了添加我们的实际逻辑，进行以下更改：\n\
  \n[`ch7/ember-note/app/utils/is-valid-length.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/utils/is-valid-length.js)\n\
  \n```\nexport default function isValidLength(value, min, max) {\n  return !(value.length\
  \ <= min || value.length > max);\n}\n```\n\n这个函数的具体实现细节不如其形式重要。你会注意到命令使用了连字符形式的文本\
  \ `is-valid-length`，而函数名为 `isValidLength`。Ember CLI 在创建函数时执行了这种转换，该函数保存在名为 `is-valid-length.js`\
  \ 的文件中。那么现在我们有了一个函数，如何引用它呢？看看我们对笔记路由的以下更新：\n\n[`ch7/ember-note/app/notebooks/notes/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/notes/route.js)\n\
  \n\n\n\n\n```javascript\nimport Ember from 'ember';\nimport isValidLength from 'ember-note/utils/is-valid-length';\n\
  \nexport default Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('note',\
  \ {notebook:params.notebook_id});\n  },\n  actions: {\n    addNote: function() {\n\
  \      var title = this.controller.get('title');\n      if(!isValidLength(title,0,140))\
  \ {\n        alert('Title must be longer than 0 '\n        + 'characters and not\
  \ more than 140.');\n      }\n      else {\n        this.store.query('notebook',\n\
  \          this.paramsFor('notebooks.notes').notebook_id)\n        .then(\n    \
  \      (notebook) => {\n            console.log(notebook);\n            var note\
  \ = this.store.createRecord('note', {\n              title : this.controller.get('title'),\n\
  \              notebook: notebook\n            });\n            console.log(note);\n\
  \            note.save().then(() => {\n              console.log('save successful');\n\
  \              this.controller.set('title',null);\n              this.refresh();\n\
  \            }, function() {\n              console.log('save failed');\n      \
  \      });\n          }\n        );\n      }\n    },\n    deleteNote: function(note)\
  \ {\n      console.log('deleting note with title ' + note.get('title'));\n     \
  \ note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\n`import` 语句使得新的工具函数\
  \ `isValidLength` 在路由中可用。几行之后，我们在添加标题之前使用该函数检查其长度，如果标题未通过验证，则提醒用户我们不会保存该记录。\n\n\
  值得注意的是，新函数在 `is-valid-length.js` 中的定义以及 notes 路由中的 `import` 和调用中都被称为 `isValidLength`。一旦你在文件中定义了该函数并将其导入到另一个类中，你就可以像使用该类中定义的函数一样使用它。\n\
  \n如果你想创建一个可以在整个应用中导入和使用的单一函数，工具函数可以帮到你。然而，共享一组这样的函数通常也很有帮助。一种方法是创建一个 `mixin`，然后将其包含到需要使用它的类中。现在让我们来看看。\n\
  \n## 使用混入（Mixins）共享代码\n\n虽然工具函数是共享单个函数的有用方式，但它们并不能覆盖所有可能的需求。如果我们的验证工具函数能够以一组可在多个地方使用的函数形式存在，那将会更加有用。为此，我们可以创建一个\
  \ `mixin`。在 Ember 中，`mixin` 是一组属性和函数，可以在任何依赖它们的类中使用。这些属性和函数的定义位于 `mixin` 中，并且可以在任何使用了该\
  \ `mixin` 的类中使用。\n\n由于 `mixin` 可以包含属性和函数，它不仅可以用于抽象行为，还可以用于抽象状态。当一个类继承了这个 `mixin`\
  \ 时，该 `mixin` 的属性和函数就成为继承类定义的一部分。工具函数可用于对传递给它的数据执行操作，而 `mixin` 可用于操作和状态。\n\n现在，让我们看看如何创建我们的\
  \ `mixin`。在命令行中运行以下 Ember CLI 命令：\n\n```\n$ ember generate mixin validation-functions\n\
  ```\n\n我们将向这个库中添加两个验证例程。我们将创建一个执行与工具函数中相同的长度验证的函数。第二个函数将检查一个字符串是否表示一个有效的电子邮件地址。\n\
  \n将新创建的 mixin 类更新为以下内容：\n\n[`ch7/ember-note/app/mixins/validation-functions.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/mixins/validation-functions.js)\n\
  \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Mixin.create({\n\
  \  isValidLength: function(value, min, max) {\n    return !(value === undefined\n\
  \      || value.length <= min || value.length > max);\n  },\n  isValidEmail: function(value)\
  \ {\n    var pattern = /^\\w+([\\.-]?\\w+)*@\\w+([\\.-]?\\w+)*(\\.\\w{2,3})+$/;\n\
  \    return value.match(pattern);\n  }\n});\n```\n\n这个 `mixin` 包含两个函数：`isValidLength`\
  \ 和 `isValidEmail`。`isValidLength` 函数与定义在 `ember-note/app/utils/is-valid-length.js`\
  \ 中的版本几乎相同。唯一的实质性区别是，`mixin` 中的版本是 `Mixin` 对象的一个属性，而工具函数版本则是独立的。\n\n### 正则表达式\n\n\
  `isValidEmail` 函数使用正则表达式来判断传入的字符串是否表示一个电子邮件地址。正则表达式是一种捕获数据预期格式（称为模式）的方法，然后使用该模式来验证实际数据是否遵循该格式。\n\
  \n从 `isValidEmail` 中的 `pattern` 变量可以看出，正则表达式通常采用看起来复杂的字符串形式，并且这些模式往往会变得异常庞大。在我们之前的例子中，电子邮件验证只有\
  \ 48 个字符，但它不允许使用新的顶级域名，例如 .museum。还有一些用于验证电子邮件地址的替代模式，其长度可达数千个字符。鉴于这种复杂性，你可以认为最好直接尝试发送一封确认邮件来确保地址有效。\n\
  \n关键在于，正则表达式非常有用，但要正确使用它们却很有挑战性。如果你需要使用正则表达式，请准备好编写相当健壮的测试用例，然后在出现问题时扩展它们。我们可能可以用一整本书来讨论正则表达式，所以我的建议是谨慎使用它们。\n\
  \n需要对 notes 路由进行一些小的修改才能使用这个 `mixin`。对路由进行以下更改：\n\n```javascript\n// 替换 'is-valid-length'\
  \ 的导入\nimport ValidationFunctions from 'ember-note/mixins/validation-functions';\n\
  // ...\n// 更改路由的类声明\nexport default Ember.Route.extend(ValidationFunctions,{\n//\
  \ ...\n// 更改函数的引用方式\nif(!this.isValidLength(title,0,140)) {\n// ...\n```\n\n第一个更改是简单地将\
  \ `is-valid-length` 的 `import` 替换为 `mixin` 的 `import`。完成之后，我们将 `mixin` 的名称添加到路由的声明中，这会获取\
  \ `mixin` 的属性和函数，并使它们成为路由的一部分。\n\n一旦 `mixin` 被合并到路由类中，我们就可以通过调用 `this.isValidLength`\
  \ 来访问我们想要的函数。由于 `mixin` 成为了路由对象定义的一部分，我们使用 `this` 来获取它。使用这种形式与使用工具类之间的区别在于，`mixin`\
  \ 可以提供更复杂的功能，因为它能够提供自己的状态，这些状态可以被使用它的对象访问。\n\n现在让我们看看如何使用 `isValidEmail` 函数来修改注册路由，要求使用电子邮件地址作为用户名。按如下方式更改注册路由：\n\
  \n[`ch7/ember-note/app/register/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/register/route.js)\n\
  \n```javascript\nimport Ember from 'ember';\nimport ValidationFunctions from 'ember-note/mixins/validation-functions';\n\
  \nexport default Ember.Route.extend(ValidationFunctions,{\n  actions : {\n    addNew\
  \ : function() {\n```\n\n\n\n\n```\nvar name = this.controller.get('name');\nif(this.isValidEmail(name))\
  \ {\nvar user = this.store.createRecord('user', {\nname : name\n});\nuser.save().then(()\
  \ => {\nconsole.log('save successful');\nthis.controller.set('message',\n'A new\
  \ user with the name \"' + name + '\" was added!');\nthis.controller.set('name',null);\n\
  }, function() {\nconsole.log('save failed');\n});\n}\nelse {\nalert('Invalid email\
  \ address.');\n}\n}\n}\n}\n});\n```\n\n对注册路由所做的更改与我们之前对笔记路由所做的更改非常相似。首先，我们需要导入 `ValidationFunctions`\
  \ 混入。然后，在扩展 `Ember.Route` 时引用它，这样该混入就会成为新路由的一部分。接着，像在笔记路由中一样，我们使用 `this.isValidEmail`\
  \ 调用它，如果验证通过，则继续执行 `addNew` 动作。如果验证失败，则向用户显示一条消息。\n\n虽然我们将 `isValidLength` 和 `isValidEmail`\
  \ 定义为函数，但这些属性也可以轻松地保存一个值。如果它们保存的是值，那么包含它们的类（在本例中是笔记路由）将能够访问这些值，就像它可以访问函数一样。\n\n\
  Ember 插件：Validation\n\n我们的示例验证类非常适合说明混入背后的概念，但它远未成熟。要了解如何使用混入执行验证的更完整示例，请查看由 Dockyard\
  \ 发布的 `ember-validations` 插件。Dockyard 是 Ember 和 Ember CLI 背后的主要团队之一。\n\n要在你的应用中使用\
  \ `ember-validations`，你可以从项目根目录运行以下命令来安装它：\n\n```\n$ ember install ember-validations\n\
  ```\n\n该插件利用了通过混入向类添加属性的能力。要向类添加验证规则，你需要初始化一个名为 `validations` 的属性。该属性包含一个 JSON 对象，由键值对组成。键是你希望验证的类上的属性，值是一个包含要应用于该属性的规则的\
  \ JSON 对象。例如，请看 `ember-validations` 文档中的这段代码：\n\n```\nexport default Ember.Object.extend(EmberValidations.Mixin,{\n\
  validations: {\nfirstName: {\npresence: true,\nlength: { minimum: 5 }\n},\nage:\
  \ {\nnumericality: true\n}\n}\n});\n```\n\n像这样向对象添加 `validations` 属性，会为该对象激活此插件。你想要应用的验证规则随后包含在\
  \ `validations` 属性中。然后，包含该属性的对象将被验证，以确保 `firstName` 属性已填写且最小长度为 5。`age` 属性被验证以确保它是一个数字。还有其他几个验证选项，例如\
  \ `format`（用于测试正则表达式）和 `inclusion`（提供属性必须匹配的值列表）。\n\n每个验证都可以提供自定义消息，并且混入提供了一个名为\
  \ `isValid` 的属性，让你知道对象是否包含有效数据。每次设置属性时，该属性都会更新。可以通过引用对象上的 `errors.propertyName`\
  \ 属性来访问这些消息。然后可以将这些消息显示给用户，让他们有机会更新属性值。\n\n有关完整文档，请查看 [`github.com/dockyard/ember-validations`](https://github.com/dockyard/ember-validations)。\n\
  \n混入是共享代码的好方法，但 Ember 还有更多功能。有时，你可能希望共享对状态或服务的访问。Ember 有一种称为依赖注入的方法来实现这一点，你将在接下来学习。\n\
  \n## 使用依赖注入共享服务\n\n到目前为止，我们介绍的功能通过创建可重用的类并在对象之间共享它们，帮助你实现合理的设计。混入和工具类非常适合抽象行为，但对于更复杂的抽象，你需要创建一个服务，并使用依赖注入将其注入到整个应用中。\n\
  \n“服务”一词可能有不同的解释，因此让我们先定义我们所说的服务是什么意思。服务是一个自包含的功能单元。它以松散耦合的方式为不相关的对象提供对其功能的访问。Ember\
  \ 开箱即用地依赖几个服务。例如，应用的 `Ember.Router` 实例就是一个很好的服务示例：它在单个位置管理 URL 层次结构，并通过 `this.router`\
  \ 属性向其他对象（特别是 `Ember.Route` 的实例）提供对该层次结构的访问。另一个例子是 Ember Data，它是一个通过 `store` 属性在整个应用中用于数据访问的服务。\n\
  \n为了以松散耦合的方式提供服务，Ember 需要提供一种方法将该服务提供给需要它的对象。它通过依赖注入来实现这一点。依赖注入是一种向依赖它的对象提供服务的方式。依赖注入的目标是以客户端对服务了解最少的方式提供此服务。\n\
  \n在依赖注入模式中，服务（即依赖项）在客户端外部实例化，然后注入到客户端中。因此，Ember 需要一个地方来实例化依赖项并将其注入到客户端中。让我们来看看初始化器。\n\
  \n### 使用初始化器\n\n为了使依赖注入生效，Ember 必须在应用首次加载到浏览器时执行一些工作。这必须在应用生命周期的早期进行，因为通常使用依赖注入的服务类型在应用中的许多不同地方都会被使用。为此，你可以使用\
  \ `Ember.Application.initializer` 函数。\n\n该函数接受一个对象，其唯一要求是定义一个名为 `initialize` 的函数。该函数用于在启动时执行你需要的任何工作。\n\
  \n我们已经在*创建和注入用户会话*中使用了初始化器，但现在我们将创建第二个初始化器来集中日志记录行为。运行以下命令：\n\n```\n$ ember generate\
  \ initializer logger\n```\n\n当我们运行此命令时，Ember CLI 会创建一个空的初始化器存根：\n\n```\nexport function\
  \ initialize(/* container, application */) {\n// application.inject('route', 'foo',\
  \ 'service:foo');\n}\n\nexport default {\nname: 'logger',\ninitialize: initialize\n\
  };\n```\n\n当用户首次打开你的应用时，你创建的每个初始化器的 `initialize` 函数都会运行。当然，你可能需要控制它们的运行顺序。为此，Ember\
  \ 遵循你定义的顺序。如果你注意的话，初始化器包含一个 `name` 属性。\n\n你还可以使用名为 `before` 和 `after` 的属性。每个属性接受一个字符串或字符串数组。`before`\
  \ 和 `after` 属性使用其他初始化器的 `name` 属性来确定执行顺序。如果向这些属性传递数组，则会考虑数组中的每个初始化器。\n\n初始化器可用于任何需要在应用范围内执行的工作，但它们的主要用例之一是依赖注入。现在让我们来看看这个。\n\
  \n### 注入类\n\n当你以基于服务的方法设计应用时，你会创建旨在在整个应用中重用的对象。我们已经看到了几种分发此类对象的方法，但我最喜欢的是使用依赖注入。\n\
  \n\n\n要在 Ember 中使用依赖注入，通常需要执行两个步骤。首先，将服务注册到容器中；然后，将其注入到任何你想要访问该服务的类工厂中。\n\n以下代码演示了如何实现这些步骤来注入我们新的日志记录器初始化器：\n\
  \n`ch7/ember-note/app/initializers/logger.js` ([`media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js))\n\
  \n```javascript\nimport Ember from 'ember';\n\nexport function initialize(registry,\
  \ application) {\n  var logger = Ember.Object.extend({\n    log: function(message)\
  \ {\n      console.log(message);\n    }\n  });\n  application.register('logger:main',\
  \ logger);\n  application.inject('route', 'logger', 'logger:main');\n}\n\nexport\
  \ default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n我们首先创建了日志记录器的实现。它是\
  \ `Ember.Object` 的扩展，并围绕 JavaScript 的 `console` 对象提供了一个简单的单参数包装器。\n\n接下来，我们使用传入\
  \ `initialize` 函数的 `Ember.Application` 对象的 `register` 方法注册这个新类。`register` 方法最多接受三个参数：注册对象的名称（`logger:main`）、工厂（指向我们新类的\
  \ `logger` 变量）以及一个选项哈希。\n\n选项哈希可以包含两个属性：`instantiate` 和 `singleton`。默认情况下，除非传入值为\
  \ `false` 的选项哈希，否则会调用工厂的 `create` 方法。如果 `singleton` 为 `false`，则在查找该对象时可以创建多个实例；否则，每次查找都会返回同一个实例。\n\
  \n`inject` 方法的作用是将这个新注册的工厂在整个应用中可用。`inject` 方法接受三个参数。第一个参数是目标工厂的名称，你的新工厂将被注入到该工厂中。在我们的例子中，我们通过将\
  \ `route` 工厂传递给 `inject`，将新的日志记录器注入到每个路由实现中。你也可以通过名称指定具体的实现（例如 `route:notebooks`）。第二个参数是接收新工厂实例的属性名称。通过这个属性，你可以从客户端类中引用注入的服务。最后，第三个参数是你想要注入的工厂的注入名称，该名称应与注册时的名称一致（例如\
  \ `logger:main`）。\n\n一旦注入在应用的初始化过程中完成，它就会在注入到的每个实例中以指定的属性名称可用。以下代码演示了如何从类中使用注入的服务：\n\
  \n`ch7/ember-note/app/notebooks/route.js` ([`media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js))\n\
  \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
  \  model: function(params) {\n    return this.store.query('notebook', {user: params.user_id});\n\
  \  },\n  actions: {\n    addNotebook: function() {\n      var notebook = this.store.createRecord('notebook',\
  \ {\n        title: this.controller.get('title'),\n        user: this.session.get('user')\n\
  \      });\n      notebook.save().then(() => {\n        this.logger.log('save successful');\n\
  \        this.controller.set('title', null);\n        this.refresh();\n      },\
  \ () => {\n        this.logger.log('save failed');\n      });\n    }\n  }\n});\n\
  ```\n\n通过在初始化器中注册并注入日志记录器类，一个名为 `logger` 的属性将在你应用中所有 `Ember.Route` 的实例中可用。图 展示了这些部分如何组合在一起：\n\
  \n![images/dependency-injection.png](img/dependency-injection.png)\n\nEmber Data\
  \ 框架很好地利用了依赖注入。当你在路由实现中引用 `store` 属性时，那是因为该属性是通过 Ember Data 设置的注入初始化器来赋值的。\n\n除了将服务全局注入到对象工厂之外，还有另一种选择。如果你只想在更有限的子集对象中使用某个服务，可以使用不同的\
  \ API 仅从你想要影响的类中获取该服务。\n\n假设你有一个名为 `foo` 的服务，并且只想在单个路由中使用它。你可以像这样创建一个访问该服务的属性：\n\
  \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
  \  fooService: Ember.inject.service('foo'),\n  model: function(params) {\n    return\
  \ this.fooService.mumblyFoo(params.foobar);\n  }\n});\n```\n\n假设你已经在初始化器中注册了一个名为\
  \ `foo` 的服务，那么你可以使用 `Ember.inject.service` 来访问它。唯一的区别是，在初始化器中，你需要将 `foo` 服务注册为 `service:foo`，而不是\
  \ `foo:main`，否则容器可能无法正确查找。\n\n工具、混入和依赖注入是使代码更加模块化的三种有用方式，我鼓励你在适当的上下文中考虑使用它们。在进入下一章之前，我们还要简要探讨一下抽象。在下一节中，我将讨论如何使用\
  \ Ember Data 转换在模型中应用特定于应用的数据类型。\n\n## 使用转换来调整数据\n\n如果你使用 Ember Data 访问旧版 API，或者使用来自上游数据源的数据，你可能需要在应用中使用数据之前对数据值进行一些转换。针对这种用例，Ember\
  \ Data 提供了 `DS.Transform` 类。`DS.Transform` 封装了将数据从一种形式转换为所需形式所需的逻辑。\n\nEmber Data\
  \ 自带了一些内置的 `DS.Transform` 实现：`DS.BooleanTransform`、`DS.DateTransform` 和 `DS.NumberTransform`。每个实现负责将非规范形式的数据转换为预期形式。例如，`DS.BooleanTransform`\
  \ 能够接收值为 `\"true\"` 或 `1` 的原始 JSON，并将其转换为布尔值 `true`。\n\n让我们看看这如何用于另一种转换。想象一个用例，你的应用访问来自上游数据源的金融交易数据。更复杂的是，这些交易以美元存储。应用希望以用户的本国货币显示所有这些数据点。`DS.Transform`\
  \ 可以帮上忙。\n\n首先，执行以下 Ember CLI 命令：\n\n```bash\n$ ember generate transform native-currency\n\
  ```\n\n该命令会生成一个空的转换存根。以下示例说明了如何构建转换：\n\n```javascript\nimport DS from 'ember-data';\n\
  \nexport default DS.Transform.extend({\n  deserialize: function(serialized) {\n\n\
  \    // 在此处执行货币转换\n    var amountInNative =\n      this.currencyTranslator.translateToNative(serialized);\n\
  \    return amountInNative;\n  },\n\n  serialize: function(deserialized) {\n\n \
  \   // 从本国货币转换为美元\n    var amountInUSD = this.currencyTranslator.translateToUSD(deserialized);\n\
  \    return amountInUSD;\n  }\n});\n```\n\n\n\n\n在这个示例中，我们假设已经创建了一个用户特定的翻译对象，并将其注入到转换器中。这样我们就可以计算使用用户货币换算率的翻译结果。转换器本身的作用很简单：当模型以本地货币请求信息时，它介入处理。一个需要使用该转换器的模型类示例如下：\n\
  \n```\nimport DS from \"ember-data\";\n\nexport default DS.Model.extend({\n  toAccount:\
  \ DS.attr('string'),\n  fromAccount: DS.attr('string'),\n  amount: DS.attr('native-currency')\
  \ // 以本地货币表示金额\n});\n```\n\n同样的数据也可以不使用转换器来表示，如下所示：\n\n```\nimport DS from \"ember-data\"\
  ;\n\nexport default DS.Model.extend({\n  toAccount: DS.attr('string'),\n  fromAccount:\
  \ DS.attr('string'),\n  amount: DS.attr('number') // 以美元表示金额，存储在数据存储中\n});\n```\n\
  \n转换器既负责反序列化数据（即从存储格式转换为显示格式），也负责序列化数据。这意味着你可以用你选择的格式显示数据，但在需要保存时，序列化函数会介入并将数据转换回合适的格式，以保持与数据库预期的一致性。\n\
  \n## 下一步\n\n我们花了大部分时间学习如何构建 Ember 应用。构建应用固然很棒，但你希望把它展示给用户，对吧？在接下来的两章中，你将进一步了解 Ember\
  \ CLI，它在部署和发布过程中大有帮助。接下来，你将学习如何使用它来管理依赖关系，并从你的 Ember 代码构建一个可部署的产物。在这个过程中，我们还将探讨如何使用\
  \ Ember CLI 提供的测试钩子，以便我们对代码充满信心。\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\
  \n# 第 8 章\n\n构建、测试和部署你的 Ember 应用\n\n到目前为止，我们在构建应用功能方面做了大量工作。但在完成之前，还有一个重要的领域需要处理。我们需要花些时间思考如何让应用为生产环境做好准备。\n\
  \nEmber CLI 为我们完成了大部分工作，但作为开发者，了解幕后的一些情况会对你有所帮助。首先，我们将看看 Ember CLI 如何从你编写的代码中准备一个可用的应用版本。然后，本章的大部分内容将讨论\
  \ Ember CLI 如何帮助你测试应用。最后，我们将了解 Ember CLI 如何帮助你部署应用。\n\n让我们从 Ember CLI 如何构建你的应用代码并使其随时可以运行开始。\n\
  \n## 构建你的应用\n\n如果你长期使用 JavaScript（或任何其他软件开发工具），你可能熟悉一个常见的障碍：构建系统。就像语言一样，每个人对于给定语言的最佳构建系统都有不同的看法。与此选择密切相关的是你对依赖管理的选择。选择构建和依赖管理工具是一个挑战；配置所选工具集则是另一个挑战。幸运的是，Ember\
  \ CLI 优雅地为你解决了这个问题。\n\n### 获取依赖\n\n当你首次安装 Ember CLI 时，它会包含最新版本的 Ember。作为 Ember 2.x\
  \ 发布周期的一部分，Ember 核心和 Ember CLI 将同步发布计划。因此，如果你想升级 Ember CLI，Ember 也应随之升级。你可以通过在项目目录中以管理员身份运行以下命令来升级\
  \ Ember CLI：\n\n```\n$ npm uninstall -g ember-cli\n$ npm cache clean\n$ bower cache\
  \ clean\n$ npm install -g ember-cli\n$ npm install ember-cli --save-dev\n$ rm -rf\
  \ node_modules bower_components dist tmp\n$ npm install\n$ bower install\n$ ember\
  \ init\n```\n\n前三个命令从 npm 包管理系统中移除当前版本的 Ember CLI，并清除 npm 和 Bower 缓存中的相关文件。接下来，安装最新的\
  \ Ember CLI 并使其全局可用（由 `-g` 标志定义），同时将其安装到项目的 `package.json` 文件中（这里我们使用了 `--save-dev`\
  \ 标志）。\n\n然后，为了安全起见，我们删除应用中包含依赖和构建版本的四个目录。接下来的两个命令将 `package.json` 和 `bower.json`\
  \ 中列出的所有依赖重新安装到本地组件目录中。最后，`ember init` 会针对当前代码库重新运行所有 Ember CLI 蓝图，以检查更改。每次运行 `ember\
  \ generate` 时你都在使用这些蓝图，由于蓝图可能会发生变化，重新应用它们是个好主意。该命令会允许你批准列出的每个差异，以便你了解此命令更改了哪些内容。这里要小心——根据\
  \ Ember CLI 的变化，某些更改可能会删除你想要保留的代码，所以最好谨慎行事。你正在使用一个良好的版本控制系统，对吧？\n\n有时你可能只想更新某个依赖而不更新\
  \ Ember CLI。由于 Ember CLI 依赖于 Bower，你可以通过运行以下命令来安装更新的依赖：\n\n```\n$ bower install\
  \ my-dependency --save\n```\n\n这将更新你的 `bower.json`，使该依赖成为项目的一部分。\n\n### 在本地运行应用\n\
  \n当你编写代码或更改依赖时，假设你通过 `ember serve` 命令启动了一个运行实例，Ember CLI 会保持本地部署的最新状态。Ember CLI\
  \ 会构建一个包含模拟服务器的本地可部署版本，并启动该应用。\n\n正如我们在本书中看到的，当你运行 `ember serve` 命令时，它会启动 watchman\
  \ 服务。当 watchman 检测到应用文件发生变化时，它会触发应用的重建。此外，当你浏览应用时，本地部署的版本包含一个 WebSockets 客户端，用于监控变化并在必要时在浏览器中重新加载应用。这非常方便，尤其是当你快速编码并希望同样快速地看到变化时。快速编码时你还需要做的一件事就是编写测试用例。我们现在来看看如何做到这一点。\n\
  \n## 测试和调试你的应用\n\n我一直保守着一个小秘密。当你运行 `ember generate` 时，Ember CLI 不仅会为你生成类，还会为你生成测试框架。事实上，它们已经足够完整，可以运行（尽管在覆盖率方面提供的帮助不大）。如果你过去在将良好的测试实践应用于\
  \ JavaScript 客户端代码时遇到困难，那么你最后的借口已经消失了。\n\n### 测试执行\n\n让我们先回顾一下 Ember CLI 在我们工作过程中创建的测试的当前结果。打开命令提示符，导航到\
  \ EmberNote 项目的根目录，然后运行以下命令：\n\n```\n$ ember test\n```\n\n运行此命令后，你应该会看到控制台输出大量信息。Ember\
  \ CLI 会先构建你的应用，然后运行它在整个工作过程中生成的测试。\n\n还有第二种查看测试的方法。在同一个命令提示符下，按 `Ctrl-C`，这会暂停 `ember\
  \ test` 的输出。它应该会报告一些失败的测试，我们稍后会处理。首先，从命令行运行 `ember serve`。然后，在浏览器中访问 `localhost:4200/tests`。\n\
  \n\n\n\n在浏览器中，你会看到测试结果的显示。滚动浏览结果，你应该能看到失败的测试。在修复其中一些失败的测试之前（是的，这些测试确实需要一些调整），我们先来聊聊\
  \ Ember CLI 用于执行测试的工具。\n\n当你在命令行中运行 `ember test` 命令时，Ember CLI 会启动一个 PhantomJS 实例。PhantomJS\
  \ 是一个无头网页浏览器（没有用户界面的浏览器），完全用 JavaScript 编写。通过使用 PhantomJS，你可以将测试作为持续集成流程的一部分来执行。持续集成是一种实践，即在专用的构建机器上通过自动化流程定期编译你的软件。使用持续集成，你可以检查新更改是否引入了错误。如果你采用持续集成，测试应该在构建过程中运行。使用\
  \ PhantomJS 可以让测试在不需要在持续集成机器上安装传统浏览器的情况下进行。\n\n当你通过访问 `localhost:4200/tests` 来运行测试时，你实际上是在使用一个\
  \ Ember 应用，这个应用是 Ember CLI 在你更新应用时构建的。这个应用被构建用来运行你的测试并显示结果。它会运行每一个测试，并提供一些选项让你决定查看哪些测试结果。\n\
  \n这两种查看测试结果的方法都很有用，并且在你开发计划中各有其位置。在本章的剩余部分，我们将依赖于在 `localhost:4200` 上可查看的测试应用，因为它提供了稍好一些的用户体验。\n\
  \n有了查看测试结果的方法，让我们开始编写我们将要编写的更基础的测试：单元测试。\n\n### 编写单元测试\n\n能够使用基于模块的方法来编写 JavaScript\
  \ 的一个好处是，我们也可以以模块化的方式来思考我们的测试。Ember CLI 为我们创建的每个应用模块创建一个测试模块。现在让我们看看其中一个。当你创建 note\
  \ 模型类时，Ember CLI 在 `ember-note/tests/unit` 目录下创建了一个名为 `note-test.js` 的测试文件。生成的文件如下所示：\n\
  \n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
  import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\nmoduleForModel('notebook',\
  \ 'Unit | Model | notebook', {\n  // 指定此测试所需的其他单元。\n  needs: [];\n});\n\ntest('it\
  \ exists', function(assert) {\n  var model = this.subject();\n  // var store = this.store();\n\
  \  assert.ok(!!model);\n});\n```\n\n导入块从 `ember-qunit` 中引入了 `moduleForModel` 和 `test`\
  \ 函数。这些函数在测试类中用于加载我们要测试的类，然后分别对其执行测试。\n\n> **QUnit、ember-test-helpers 和 ember-qunit**\n\
  > \n> ![images/aside-icons/tip.png](img/tip.png) 要使用 `ember test` 命令或通过浏览器进行测试，你主要依赖三个测试框架：QUnit（[`qunitjs.com`](http://qunitjs.com)）、ember-test-helpers（[`github.com/switchfly/ember-test-helpers`](https://github.com/switchfly/ember-test-helpers)）和\
  \ ember-qunit（[`github.com/rwjblue/ember-qunit`](https://github.com/rwjblue/ember-qunit)）。每个框架都在提供你为测试用例编写的一些代码方面发挥作用。QUnit\
  \ 是一个通用的 JavaScript 测试框架，最初为 jQuery 编写；ember-test-helpers 是一组特定于 Ember 的测试工具，需要特定的测试框架（如\
  \ QUnit）才能运行；而 ember-qunit 则将这两者粘合在一起。\n\n#### 测试用例依赖关系\n\n这个生成的单元测试将确认最基本的行为：可以创建\
  \ note 模型类的实例。而现在，这个测试是失败的。如果你查看测试结果，你应该会看到一条消息，内容类似于“未找到 notebook 的模型”。为什么它报告找不到\
  \ notebook 模型？因为 note 模型类包含一个对 notebook 的 `belongsTo` 引用。让我们修复这个问题。将测试用例的 `needs`\
  \ 数组改为如下所示：\n\n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
  needs: [\n  'model:user',\n  'model:note'\n];\n```\n\n一旦你做出这个更改，失败的 notebook 模型测试应该会通过。通过浏览器重新运行测试来确认。如果你想要一组干净的测试，你也可以对\
  \ note 测试进行类似的更改，使它们也通过。\n\n你还需要对应用序列化器的测试用例进行一些更改才能通过。按如下方式更新 `moduleForModel`\
  \ 代码：\n\n```\n// [ch8/ember-note/tests/unit/serializers/application-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/serializers/application-test.js)\n\
  moduleForModel('user', 'Unit | Serializer | application', {\n  // 指定此测试所需的其他单元。\n\
  \  needs: ['model:user']\n});\n```\n\n此更改更新了序列化器测试，使其依赖于我们的一个模型类——user 模型。Ember\
  \ CLI 为序列化器测试类生成的测试蓝图会查找一个名为 application 的模型，但该模型在我们的应用中并不存在。更改为一个确实存在的类可以使此测试通过。\n\
  \n通过这些更改，我们更新了大部分测试，使其使用正确的依赖关系。你可能会注意到 edit-note 测试目前是失败的。先保持原样。我们很快就会处理它。首先，让我们看看如何为我们的模型编写单元测试。\n\
  \n#### 对模型进行单元测试\n\n在许多情况下，你可能不需要为模型类编写测试用例。如果你的模型类完全依赖于框架定义的行为（就像我们的模型一样），你甚至不需要编写测试用例。但让我们把事情变得稍微复杂一些，为我们的\
  \ notebook 模型添加一个函数，用于计算与 notebook 实例关联的笔记数量。将你的 notebook 模型更新为如下所示：\n\n```\n//\
  \ [ch8/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/models/notebook.js)\n\
  import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title : DS.attr('string'),\n\
  \  user : DS.belongsTo('user'),\n  notes : DS.hasMany('note'),\n  noteCount: function()\
  \ {\n    return this.get('notes.length');\n  }\n});\n```\n\n`noteCount` 函数获取 notes\
  \ 属性的副本，该属性指向关联笔记的数组，并返回该数组的长度。这就是它的功能。现在，让我们编写一个测试来确认这一点。将你的 `notebook-test.js`\
  \ 文件更新为如下所示：\n\n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
  import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\nimport Ember from 'ember';\n\
  \nmoduleForModel('notebook', 'Unit | Model | notebook', {\n  // 指定此测试所需的其他单元。\n\
  \  needs: [\n    'model:user',\n    'model:note'\n  ];\n});\n\ntest('it exists',\
  \ function(assert) {\n  var model = this.subject();\n  // var store = this.store();\n\
  \  assert.ok(!!model);\n});\n```\n\n\n\n```\ntest('it counts notes', function(assert)\
  \ {\n  var notebook = this.subject({ title: 'my notebook' });\n  var note;\n  var\
  \ noteCount = Math.floor(Math.random() * (10 - 1) + 1);\n\n  Ember.run(() => {\n\
  \    for(var i = 0; i < noteCount; i++) {\n      note = this.store().createRecord('note');\n\
  \      notebook.get('notes').addObject(note);\n    }\n  });\n\n  assert.equal(notebook.noteCount(),noteCount);\n\
  });\n```\n\n首先，我们需要修改导入语句，引入 `Ember` 类。（稍后我们会解释原因。）完成之后，我们在文件末尾添加一个新测试，描述为“it counts\
  \ notes”。测试运行器会使用这些描述来告知你正在运行哪个测试。\n\n接下来，我们将进行一些设置工作。调用 `this.subject` 会创建一个 notebook\
  \ 类的实例，我们将用它来进行测试。然后，我们初始化一个名为 `note` 的变量，用于填充 note 实例。接着，我们生成一个 1 到 10 之间的随机数，以测试正确数量的\
  \ note 实例是否被添加到 notebook 中。\n\n这里我们将使用之前导入的 `Ember` 实例。由于我们即将执行的工作是异步的并且会产生副作用，测试运行器要求我们在自己的运行循环内完成这项工作。在该运行循环中，我们将使用之前生成的随机数来创建预期数量的\
  \ note 实例，然后将它们添加到 notebook 中。\n\n此时，你可能会不确定何时使用 `Ember.run`，何时不使用。请放心，测试运行器会非常清楚地说明某个测试无法运行的原因，并会提供一条错误消息，指出你的代码需要\
  \ `Ember.run`。除此之外，关于 `Ember.run` 的细节主要在你从事 Ember 框架开发而非使用 Ember 开发应用时才相关。\n\n完成上述设置工作后，我们将通过断言\
  \ `noteCount` 方法返回预期的记录数（即之前声明的随机数）来运行实际测试。我们的测试应该会通过，这样我们就可以稍微安心一些，因为又少了一个需要担心的函数。\n\
  \n| 随机数生成 |\n| --- |\n| ![images/aside-icons/warning.png](img/warning.png) | 如果涉及安全性，随机数生成是一个风险领域。我们之前使用的\
  \ `Math.random` 函数对于我们的使用方式来说没问题，但你不应该将其用于任何需要安全性的场景，例如为双因素认证或验证码生成随机值，因为 `Math.random`\
  \ 的输出并非真正的随机数。在这些情况下，最好使用 `RandomSource.getRandomValues()` 函数，如 Mozilla 开发者网络文档所述：[`developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues`](https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues)。\
  \ |\n\n现在，让我们看看如何对组件进行单元测试。\n\n#### 单元测试你的组件\n\n正如我之前提到的，我们希望将单元测试的重点放在那些尚未被框架测试过的代码片段上。另一个判断某个类是否适合进行单元测试的标准是，它是否依赖于难以模拟的外部因素，例如\
  \ Ember Data 存储。我们的 `edit-note` 组件目前有两个操作：`saveNote` 和 `closeNote`。让我们快速回顾一下这个类：\n\
  \n```\n[ch8/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/component.js)\n\
  import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
  \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
  \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\n在幕后，`saveNote`\
  \ 会调用存储来保存数据，因此这个方法需要依赖验收测试。不过，我们仍然可以在一定程度上对其进行单元测试。一个更好的单元测试候选是 `closeNote` 操作，它只是将操作转发给传递给组件的一个类。这个类可以很容易地被模拟。\n\
  \n让我们对 `edit-note` 模板做一个小调整。为每个按钮添加一个 `id` 参数，如下所示：\n\n```\n[ch8/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/template.hbs)\n\
  <div>\n  {{input value=note.title}}\n  <button id=\"save\" {{action \"saveNote\"\
  }}>save</button>\n  <button id=\"close\" {{action \"closeNote\"}}>close</button>\n\
  </div>\n<div>\n  {{textarea rows=10 cols=60 value=note.body}}\n</div>\n<div>\n \
  \ {{markdown-to-html markdown=note.body}}\n</div>\n<div>\n  {{yield}}\n</div>\n\
  ```\n\n稍后你会明白我们为什么添加这些属性。让我们通过查看组件测试类（添加了一些新测试）来了解如何为组件编写测试：\n\n```\n[ch8/ember-note/tests/integration/components/edit-note/component-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/integration/components/edit-note/component-test.js)\n\
  import {\n  moduleForComponent,\n  test\n} from 'ember-qunit';\n\nimport Ember from\
  \ 'ember';\n\nmoduleForComponent('edit-note', {\n  // Specify the other units that\
  \ are required for this test\n  needs: ['component:markdown-to-html']\n});\n\ntest('it\
  \ renders', function(assert) {\n  assert.expect(2);\n\n  // Creates the component\
  \ instance\n  var component = this.subject();\n  assert.equal(component._state,\
  \ 'preRender');\n\n  // Renders the component to the page\n  this.render();\n  assert.equal(component._state,\
  \ 'inDOM');\n});\n\ntest('it saves', function(assert) {\n  var component = this.subject();\n\
  \  this.render();\n  var saveTarget = {\n    save: function() {\n      assert.ok(true,'saved\
  \ the note');\n    }\n  };\n  Ember.run(() => {\n    component.set('note',saveTarget);\n\
  \  });\n  this.$().find('#save').click();\n});\n\ntest('it closes', function(assert)\
  \ {\n  var component = this.subject();\n  this.render();\n  var closeTarget = {\n\
  \    closeAction: function() {\n      assert.ok(true,'closed the window');\n   \
  \ }\n  };\n  component.set('close','closeAction');\n  component.set('targetObject',closeTarget);\n\
  \  this.$().find('#close').click();\n});\n```\n\n我们再次添加了 `Ember` 类，因为我们需要在其中一个测试中使用运行循环。在\
  \ `moduleForComponent` 中，我们添加了对 `markdown-to-html` 插件的依赖，以便测试框架知道在渲染 `edit-note`\
  \ 组件时使用这个类。\n\n“it renders” 测试是 Ember CLI 为组件提供的测试样板。我们没有修改它。该测试用于验证组件是否按预期设置并渲染到测试容器中。\n\
  \n\n\n\n\n我们的第一个测试是“它保存”测试。正如我们在模型测试中所见，这个测试的第一步是创建待测试对象的实例。然后我们将其渲染到“屏幕”上。完成这些设置工作后，我们创建一个模拟对象来扮演笔记模型的角色。这个模拟对象只需要包含一个方法：`save`\
  \ 方法。在这种情况下，因为我们想验证组件是否正确调用了该方法，所以我们将断言放在这个方法中。如果该方法被调用，引用的消息将被打印，测试将通过。\n\n创建好模拟对象后，我们使用\
  \ `Ember.run` 方法来包装 `component.set` 动作，因为模型变化引起的重新渲染会异步发生并产生副作用（即更新 DOM）。然后，我们对指定的按钮对象强制触发点击动作。这会导致组件的\
  \ `saveNote` 动作被触发，该动作应该运行模拟对象上的 `save` 函数。由于它确实运行了，我们的测试通过了。\n\n“它关闭”测试则相当类似。我们获取一个组件实例，渲染它，并创建一个包含我们想要运行的方法的模拟对象。显著的区别在于我们如何连接测试对象。\n\
  \n因为我们的赋值没有副作用，所以我们可以不使用 `Ember.run` 循环来运行它们。我们将模板的 `close` 参数的值设置为计划从模拟对象运行的函数，并将\
  \ `targetObject` 设置为我们的模拟对象。在运行的应用中，包含此组件的路由扮演目标的角色。由于 `closeNote` 动作使用 `sendAction`\
  \ 来完成其工作，测试中的点击会调用模拟对象中的 `closeAction`，于是测试通过。\n\n当然，你的组件可能有不同的自定义代码需要测试。这两个示例对于某些组件特定的功能很有用，例如确认组件正确处理传入的模型，以及确认它正确处理引用的动作。\n\
  \n正如我之前提到的，单元测试最适合测试那些与全局代码交互不多或不需要复杂模拟的功能。我们尚未涵盖的主要对象类型是路由。我们不会花太多时间在路由的单元测试上的原因是，它们与全局代码有大量交互。因此，它们更适合进行验收测试而不是单元测试。\n\
  \n你可能会编写许多针对模型或组件之外的对象类型的单元测试。虽然具体细节会因实现而异，但思路是相同的。从 `Ember CLI` 创建的测试蓝图开始，并根据需要添加内容，以确认你在类中添加的行为。\n\
  \n单元测试非常适合在底层工作，但有时你会希望测试更完整的行为周期。为此，你可以使用验收测试，我们接下来将介绍它。\n\n### 编写验收测试\n\n验收测试用于测试应用程序中的一系列事件，以确保获得正确的结果。这是一种很好的方式，可以遍历一组屏幕并对其进行测试。因此，这需要我们在启动和运行方面做更多工作，但它们是确认功能甚至检测回归（在添加代码时）的强大方法。\n\
  \n在我们的案例中，我们将通过一个相对较小的示例来演示。我们将编写一个验收测试，以确认我们的注册路由能够正确注册有效用户。我们将创建一个测试，启动应用，导航到注册路由，填写字段并点击按钮，然后确认显示正确的消息。\n\
  \n由于验收测试与你的应用高度定制，因此 `Ember CLI` 不会在开发过程中自动生成它们。要启动验收测试，请从项目根目录运行以下命令：\n\n```\n\
  $ ember generate acceptance-test register\n```\n\n此命令为命令中指定的路由创建一个样板验收测试。让我们继续修改它，使其看起来如下所示：\n\
  \n```\n[ch8/ember-note/tests/acceptance/register-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/acceptance/register-test.js)\n\
  import Ember from 'ember';\nimport { module, test } from 'qunit';\nimport startApp\
  \ from 'ember-note/tests/helpers/start-app';\n\nvar application;\n\nmodule('Acceptance\
  \ | register', {\n  beforeEach: function() {\n    application = startApp();\n  },\n\
  \n  afterEach: function() {\n    Ember.run(application, 'destroy');\n  }\n});\n\n\
  test('visiting /register', function(assert) {\n  visit('/register');\n\n  fillIn('#name','test@pragprog.com');\n\
  \  click('#register');\n\n  andThen(function() {\n    assert.equal(find('#message').text().trim(),\n\
  \      'A new user with the name \"test@pragprog.com\" was added!');\n    assert.equal(currentURL(),\
  \ '/register');\n  });\n});\n```\n\n我们将再次依赖一些 id 属性，因此请更新注册模板，使其如下所示（为输入框、按钮和消息\
  \ div 添加 id 属性）：\n\n```\n[ch8/ember-note/app/register/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/register/template.hbs)\n\
  <div class=\"col-md-12\">\nRegister new user: {{input id='name' value=name}}\n<button\
  \ id='register' {{action 'addNew'}}>Add</button>\n</div>\n<div id='message' class=\"\
  col-md-12\">\n{{message}}\n</div>\n```\n\n这个测试看起来与我们之前编写的单元测试有些不同。你首先会注意到的区别是，我们实际上创建了完整应用的一个实例。为了测试横切特性，我们需要这样做。`beforeEach`\
  \ 创建我们的应用实例，`afterEach` 销毁它。\n\n接下来，实际测试的第一步是导航到选定的 URL。因为我们想测试能否成功注册，所以我们在名称文本字段中填入所需的值，然后点击注册按钮。\n\
  \n点击按钮后，我们将断言包装在 `andThen` 函数中，以便尊重之前可能发生的任何异步函数。当准备就绪时，`andThen` 块会验证是否显示了正确的消息，以及我们是否没有被重定向到其他路由。\n\
  \n验收测试和单元测试为你的代码提供了很好的覆盖率。通过根据需要依赖这些测试，你可以做很多事情来确保捕获错误，并且在代码更改时不会引入新错误。尽管如此，错误最终还是会出现的，这时你就需要\
  \ `Ember Inspector` 了。\n\n### 使用 Ember Inspector 进行调试\n\n尽管我们尽力而为，但有时编写良好的测试还不够。有时你需要调试应用程序，而仅仅通过查看测试中运行的代码是无法做到的。幸运的是，Ember\
  \ 为此提供了一种特殊的解决方案：`Ember Inspector`。\n\n`Ember Inspector` 是一个浏览器插件，它通过使用 Ember 术语让你深入访问应用的对象模型，从而帮助你调试\
  \ Ember 应用。你可以通过在 Chrome 网上应用店^([[9]](#f_0059.html_FOOTNOTE-9)) 或 Firefox 附加组件网站^([[10]](#f_0059.html_FOOTNOTE-10))\
  \ 搜索“ember inspector”来获取它。请继续将其安装到其中一个浏览器中，然后重新加载应用。\n\n安装 `Ember Inspector` 后，你可以通过打开浏览器的开发者工具来访问它。Inspector\
  \ 允许你可视化每个 Ember 对象的状态。如果你在代码中设置了断点，Inspector 将显示该断点处应用的状态。\n\n\n\n\n\n如果你感到好奇，不妨试试检查器（Inspector）。一个不错的起点是停留在登录页面时加载检查器。在登录之前，先切换到检查器的“数据”（Data）选项卡。一旦登录，你应该会看到用户和笔记本模型类型开始反映你已经加载了数据。\n\
  \n另一个有用的功能是“弃用”（Deprecations）选项卡。这个选项卡可以帮助你识别 Ember 框架中已过时的用法。如果你有正在迁移到 Ember 2\
  \ 的现有代码，这个功能对迁移工作会很有帮助。\n\n最后，检查器的“容器”（Container）选项卡（如下图所示）会显示你创建的每一个对象，以及 Ember\
  \ 为你创建的一些对象。这对于观察注入服务（如我们的会话对象）等对象中的数据非常有用。\n\n![images/inspector.png](img/inspector.png)\n\
  \n对于像 Ember 这样基于浏览器的深层对象模型，你需要强大的调试工具。与许多事情一样，Ember 以一种有用且直观的方式解决了这个问题。在结束本章之前，让我们看看如何使用\
  \ Ember CLI 创建可部署的 Ember 构件。\n\n## 部署你的应用\n\n走到这一步路途漫长，但终于可以部署你的应用了。也许你要把它放到开发服务器上，或者部署到生产环境。无论哪种情况，你都要把它放到某个地方让全世界看到。\n\
  \nEmber CLI 自带一个命令，用于为你的应用创建一组可部署的构件。在命令提示符下，运行以下命令：\n\n```\n$ ember build\n```\n\
  \n默认情况下，这会运行开发版本的构建。生成的构件将位于 `ember-note/dist` 目录中。这些构件包括一个以应用命名的 JavaScript 文件和一个样式表（`ember-note.js`\
  \ 和 `ember-note.css`），以及一个包含这些文件依赖项的文件（`vendor.js` 和 `vendor.css`）。此外，还包括一些支持测试应用的文件，以及\
  \ `crossdomain.xml` 和 `robots.txt`，当然还有你的根 `index.html`。\n\n不过，如果你要部署到生产环境，需求会有所不同。如果你查看\
  \ `ember-note.js`、`ember-note.css`、`vendor.js` 和 `vendor.css` 文件，它们相对易于阅读和调试。但它们也很臃肿，并且总是同名，这意味着加载速度慢，而且会被浏览器缓存。\n\
  \n要部署生产级构建，你需要运行带有 `--environment production` 标志的 `ember build` 命令。这会生成这些文件的版本，这些版本在适当的地方被压缩，并且具有唯一名称以避免被缓存。测试文件会被排除在外。这些构件可以放置在你选择的高性能\
  \ Web 服务器上，你的应用就可以供全世界访问了。这是 Ember 解决的另一个常见难题。\n\n## 下一步\n\n我们已经了解了 Ember CLI 如何帮助你构建、测试、调试和部署应用。但我们还没有完全结束。在利用\
  \ Ember 交付你的杀手级应用的过程中，你可能已经使用了一些插件，也可能创建了一些你认为对他人有用的代码。在最后一章中，我们将更详细地了解如何查找插件并将其安装到你的应用中。我们还将看到如何发布插件，无论是发布到私有仓库以便在你的应用之间共享，还是发布到公共仓库与全世界分享。\n\
  \n#### 脚注\n\n- [[9]](#f_0057.html_FNPTR-9) [`chrome.google.com/webstore/search`](https://chrome.google.com/webstore/search)\n\
  - [[10]](#f_0057.html_FNPTR-10) [`addons.mozilla.org`](https://addons.mozilla.org)\n\
  \n版权所有 © 2015，The Pragmatic Bookshelf。\n\n# 第 9 章\n\n构建和使用 Ember 插件\n\n在整本书中，我们已经看到了许多\
  \ Ember 插件的例子。插件是一种模块化的代码片段，用于在 Ember 应用程序中使用。插件可以让你的工作更轻松，而围绕创建和共享 Ember 插件的社区精神是使用\
  \ Ember 最吸引人的原因之一。\n\n在本章中，我们将更详细地了解插件的生命周期。首先，你将学习如何安装插件，我们在​*嵌套组件*​中已经简单提及，但这里会更详细地介绍。接下来，我们将讨论如何开发你自己的插件，然后将其提供给其他\
  \ Ember 开发者，以便分享你制作的酷炫内容。没有什么比回馈社区更令人满足的了（除非是制作出广泛使用的东西所带来的炫耀资本）。\n\n首先，让我们回顾一下如何将插件安装到我们的应用中。\n\
  \n## 安装 Ember 插件\n\nEmber 插件严格来说并不是 Ember 的特性，而是 Ember CLI 的特性。这个区别很重要，因为如果你决定不使用\
  \ Ember CLI 而使用 Ember，那么本章内容将不适用。如果你想要插件，就需要 Ember CLI。\n\n当你查看如何获取 Ember 插件时，这一点就变得很明显了。我们在​*嵌套组件*​中已经做过一次，当时我们引入了\
  \ `ember-cli-showdown` 插件，以便使用 Markdown 格式化文本。为了获取那个插件，我们在 `ember-note` 根目录下运行了以下命令：\n\
  \n```\n$ ember install ember-cli-showdown\n```\n\n当你运行这个命令时，Ember CLI 会在 npm 数据库中搜索请求的插件，并将其安装到项目的\
  \ `node_modules` 目录中。然后，你就可以像使用应用程序中的任何其他代码一样使用该插件。插件的文档（通常包含在其 `README.md` 文件中）应该会描述如何在你的应用中使用该插件。\n\
  \n有几种不同的方法可以发现可用的插件。我最喜欢的方法（也是我在写这本书时最常用的方法）是通过 Ember Observer。^([[11]](#f_0063.html_FOOTNOTE-11))\
  \ Ember Observer 提供了一个存储在 npm 中的插件目录，但它更进一步，对这些插件进行评分，以评估插件的健康度和成熟度。这些指标告诉你插件是否开源；代码、测试和文档的质量；插件持续集成实践的质量；插件是否得到积极维护；以及插件在\
  \ GitHub 上的流行度。一旦你找到了想要使用的插件，`README.md` 文件通常会告诉你如何使用该项目。\n\n使用插件可以大大提高生产力，但有时你会有很棒的想法想要与他人分享。为此，你可能需要开发自己的插件。开发插件并学习如何将其发布给社区是我们旅程的最后一步。\n\
  \n## 开发你自己的插件\n\n如果你使用 Ember 和 Ember CLI 足够长时间，你会发现你希望在应用之间共享代码，无论是将多个应用指向私有 Git\
  \ 仓库中的插件，还是通过 npm 公开发布你的插件。我们已经了解了如何在你的应用中获取和使用第三方插件。现在，让我们讨论如何创建一个可以在你的应用之间共享，甚至可以被他人使用的插件。\n\
  \nEmber 插件的一个自然用途是创建可重用的 Web 组件库。许多这样的库已经存在，包含可重用的 Web 控件，比如按钮或菜单栏；我们甚至在本书中讨论过一些。现在，让我们从一个简单的控件开始：一个\
  \ Bootstrap 样式的下拉列表，我们将用它来替换 EmberNote 应用中的笔记本列表，改为一个包含笔记本记录的下拉列表。当用户选择列表中的条目时，这个下拉列表会切换到所选笔记本。\n\
  \n我们将首先使用 Ember CLI 为我们的插件创建基本结构。\n\n### 创建插件\n\n\n\n\n\n当你创建一个插件时，你并不是在创建一个属于现有应用的类。实际上，你是在创建一个全新的代码库。因此，自第\
  \ 1 章以来，我们将首次离开 `ember-note` 目录树，为这个插件创建一个新的目录结构。首先，导航到 `ember-note` 目录的父目录。然后，以管理员权限运行以下命令，该命令将创建一个新目录：\n\
  \n```\n$ ember addon ember-bs-dropdown\n```\n\n就像创建 EmberNote 时一样，这个命令会为你的插件创建完整的目录结构。我们将在开发插件的过程中介绍这个结构中最重要的部分。\n\
  \n因为我们要创建一个 Bootstrap 风格的下拉菜单，所以我们的插件需要 Bootstrap 样式表。切换到新创建的插件目录并安装 Bootstrap。\n\
  \n```\n$ cd ember-bs-dropdown\n$ bower install bootstrap --save\n```\n\n由于我们之前安装过\
  \ Bootstrap，`bower install` 命令会检查本地缓存中的 Bootstrap。很可能它会在缓存中找到 Bootstrap，但我们仍然需要运行这个命令，因为它还会将\
  \ Bootstrap 作为依赖项添加到插件中。`bower install` 命令通过编辑插件的 `bower.json` 文件来包含 Bootstrap 来实现这一点。\n\
  \n现在你的项目有了 Bootstrap，我们可以生成组件了。运行以下命令：\n\n```\n$ ember generate component bs-dropdown\
  \ --pod\n```\n\n这些你应该都很熟悉。到目前为止，创建插件和应用之间最大的区别只是初始命令：应用使用 `ember new`，插件使用 `ember\
  \ addon`。\n\n如果你查看插件的目录结构，也会觉得很熟悉，但有一个例外：顶层有一个 `addon` 目录，与 `app` 目录同级。\n\n一开始这可能会让人困惑，但这是有充分理由的。当你将一个插件包含到\
  \ Ember 应用中时，插件代码会被放置在你的应用的 `node_modules` 目录中。然而，和其他任何东西一样，你可能想要扩展插件模块。`app` 目录中的文件会成为应用命名空间的一部分，并且可以被你的应用扩展，如下图所示。\n\
  \n![images/addon-app.png](img/addon-app.png)\n\n之前我们运行命令 `ember generate component\
  \ bs-dropdown --pod` 时，它生成了三个文件。其中两个是标准组件生成的 `component.js` 和 `template.hbs` 文件。让我们看看这些文件。\n\
  \n首先，生成的组件如下所示：\n\n[`ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js)\n\
  \n```\nimport Ember from 'ember';\nimport layout from './template';\n\nexport default\
  \ Ember.Component.extend({\n  layout: layout\n});\n```\n\n我们不需要对生成的代码做任何修改，因为我们不会构建一个非常复杂的组件。我们的目标只是构建一个可以用来导航到笔记路由的下拉菜单。所以这些就足够了。前面的类只是实例化了一个组件。我们的模板稍微详细一些：\n\
  \n[`ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs)\n\
  \n```\n<div class=\"dropdown\">\n<button class=\"btn btn-default dropdown-toggle\"\
  \ type=\"button\"\nid=\"dropdownMenu1\" data-toggle=\"dropdown\" aria-haspopup=\"\
  true\"\naria-expanded=\"true\">\n{{dropdownName}}\n<span class=\"caret\"></span>\n\
  </button>\n<ul class=\"dropdown-menu\" aria-labelledby=\"dropdownMenu1\">\n{{#each\
  \ model as |list|}}\n<li>{{#link-to route list.id}}{{list.title}}{{/link-to}}</li>\n\
  {{/each}}\n</ul>\n</div>\n{{yield}}\n```\n\n这些代码大部分是创建下拉菜单的 Bootstrap 样板代码。`{{dropdownName}}`\
  \ 表达式用于向组件传递一个值，该值将作为下拉菜单的默认显示值。`{{each}}` 表达式遍历传入的模型项列表进行显示。每个项成为下拉菜单中的一行。\n\n\
  下拉菜单中的每一行都由 `{{link-to}}` 表达式组成。在构建这些表达式时，我们依赖三个数据片段。首先，我们传入目标路由的名称，这样当我们选择一个笔记本时就知道要去哪里。然后，我们使用列表中当前记录的\
  \ `id` 值作为传递给目标路由的参数值，并使用记录的 `title` 作为下拉菜单中的显示值。稍后我们将看到如何在应用中使用它。\n\n现在让我们快速看一下在应用目录中创建的类。\n\
  \n[`ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js)\n\
  \n```\nexport { default } from 'ember-bs-dropdown/components/bs-dropdown/component';\n\
  ```\n\n没错——它只有一行代码。这行代码并不是最清晰的，但它所做的是有用的。这一行代码创建了插件组件类的可扩展版本，并使该版本成为应用命名空间的一部分。你的应用不会得到该文件的副本，但你可以在应用中扩展这个类，为组件添加自己的功能，例如为组件的变量提供默认值。\n\
  \n这就是开发插件所需的全部代码。我们还需要做一些事情来让它可用。首先，我们需要告诉 Ember CLI 在构建插件以供其他地方使用时使用 HTMLBars 编译器。从项目根目录运行以下命令，该命令将\
  \ `ember-cli-htmlbars` 安装为项目的依赖项：\n\n```\n$ npm install ember-cli-htmlbars --save\n\
  ```\n\n我们还需要确保插件构建时包含所需的 Bootstrap 文件副本。然而，我们不会使用 `ember-cli-build.js` 文件来完成这个任务。每个应用只有一个\
  \ `ember-cli-build.js`，所以即使我们将 Bootstrap 资源添加到插件的 `ember-cli-build.js` 中，当应用包含我们的插件时，它会忽略插件的\
  \ `ember-cli-build.js` 并使用自己的。相反，我们将这些资源添加到插件的入口点 `index.js` 中：\n\n[`ch9/ember-bs-dropdown/index.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/index.js)\n\
  \n```\n/* jshint node: true */\n'use strict';\n\nmodule.exports = {\n  name: 'ember-bs-dropdown',\n\
  \n  included: function(app) {\n    app.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
  \    app.import('bower_components/bootstrap/dist/css/bootstrap.css.map',{\n    \
  \  destDir: 'assets'\n    });\n    app.import('bower_components/bootstrap/dist/js/bootstrap.min.js');\n\
  \  }\n};\n```\n\n入口点是 npm 的一个概念。入口点是你的包（在本例中是你的 Ember 插件）包含在另一个资源中的代码。当包含该资源的应用首次在浏览器中运行时，入口点代码将被执行。如你所见，我们在这个入口点中做了与应用中的\
  \ `ember-cli-build.js` 类似的工作，只不过我们还包含了一些 Bootstrap JavaScript，以使我们的新下拉菜单正常工作。当调用应用包含这个插件时，`included`\
  \ 函数将执行，Bootstrap 资源将成为调用应用的一部分。\n\n现在我们已经了解了如何创建一个基本的插件，接下来让我们学习如何在本地应用中使用它来进行测试。\n\
  \n### 使用插件\n\n\n\n\n\n该插件现在可以在 EmberNote 应用中使用。首先，我们需要让 EmberNote 能够识别该插件。在本地环境中同时使用\
  \ `ember-bs-dropdown` 插件和 EmberNote 应用时，你可以通过一组 npm 命令让插件包在本地可用。我们将在 *发布你的插件* 中了解如何将插件发布到\
  \ npm 或私有仓库。\n\n要让本地 npm 缓存识别该插件，请在 `ember-bs-dropdown` 目录下运行以下命令：\n\n```\n$ npm\
  \ link\n```\n\n此命令会在本地 npm 缓存和你的插件项目之间创建一个符号链接。通过这个链接，你本地机器上的其他项目只需额外一步即可使用你的插件。你的本地应用还需要创建一个指向\
  \ Ember 插件的链接。因此，在 `ember-note` 目录下运行以下命令：\n\n```\n$ npm link ember-bs-dropdown\n\
  ```\n\n现在 EmberNote 应用能够找到我们创建的插件了。然而，虽然我们为应用提供了查看插件的路径，但它仍然不知道这个插件。如果你正在运行 `ember\
  \ serve` 实例，请先停止它。然后，在 EmberNote 的 `package.json` 文件（位于根目录）的 `devDependencies` 部分最底部添加以下行（请确保在前一行的末尾添加逗号）：\n\
  \n```\n\"ember-bs-dropdown\": \"*\"\n```\n\n现在，当我们下次运行 `ember serve` 时，应用将看到下拉组件。先不要尝试；我们还需要对\
  \ EmberNote 应用做一处修改。打开 notebooks 模板，并将其修改为如下所示：\n\n[ch9/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/app/notebooks/template.hbs)\n\
  \n```\n<div>\n<div class=\"col-md-3\">\n<div>Notebooks</div>\n<div>\ntitle: {{input\
  \ value=title}}\n<button {{action 'addNotebook'}}>Add</button>\n</div>\n{{bs-dropdown\
  \ model=model route='notebooks.notes'\ndropdownName='Notebooks'}}\n</div>\n<div\
  \ class=\"col-md-9\">\n{{outlet}}\n</div>\n</div>\n```\n\n我们用新的插件组件替换了大量代码。我们使用\
  \ `{{bs-dropdown}}` 表达式来引用自定义组件。表达式中的 `model=model` 部分将 notebooks 模型传递给组件。由于该模型类包含正确的属性，即\
  \ `id` 和 `title` 属性，因此它应该能正常工作。我们将 `notebooks.notes` 路由名称作为下拉菜单的目标路由，并将“Notebooks”作为默认下拉值。\n\
  \n在生效之前，我们需要对应用做最后一处修改。我们需要从 `ember-cli-build.js` 中移除 Bootstrap 资源。如果保留它们，`ember\
  \ serve` 命令会报错说我们定义了两次。因为我们现在依赖一个基于 Bootstrap 的插件来提供组件，所以让该插件来定义我们使用的版本。将 `ember-cli-build.js`\
  \ 文件修改为如下所示：\n\n[ch9/ember-note/ember-cli-build.js](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/ember-cli-build.js)\n\
  \n```\n/* global require, module */\nvar EmberApp = require('ember-cli/lib/broccoli/ember-app');\n\
  \nmodule.exports = function(defaults) {\n  var app = new EmberApp(defaults, {\n\
  \    // Add options here\n  });\n\n  // Use `app.import` to add additional libraries\
  \ to the generated\n  // output files.\n  //\n  // If you need to use different\
  \ assets in different\n  // environments, specify an object as the first parameter.\
  \ That\n  // object's keys should be the environment name and the values\n  // should\
  \ be the asset to use in that environment.\n  //\n  // If the library that you are\
  \ including contains AMD or ES6\n  // modules that you would like to import into\
  \ your application\n  // please specify an object with the list of modules as keys\n\
  \  // along with the exports of each module as its value.\n\n  return app.toTree();\n\
  };\n```\n\n这个文件现在看起来和我们开始本书时一模一样。从命令行运行 `ember serve`，你应该会看到我们的下拉菜单正在使用。你可以用它来选择要查看的笔记本，相关的笔记将被加载到\
  \ notes 路由中。\n\nEmber CLI 还提供了其他几种测试插件的方法。它在插件项目中提供了一个虚拟应用（位于 `tests/dummy` 下），以及使用\
  \ `QUnit` 编写测试用例的能力。我选择专注于使用 EmberNote 应用进行测试，但当你构建一个真正的插件时，你也应该依赖这些方法。\n\n现在你已经有了一个可以分享的插件，如何将它发布到外界呢？我们旅程的最后一站是学习如何回馈那些为我们铺平道路的人。让我们学习如何发布一个插件并与世界分享。\n\
  \n### 发布你的插件\n\n你制作了一些很酷的东西，并为此感到自豪。你非常自豪，以至于认为其他人也可能从中受益，无论是在公司内部还是在整个世界范围内。现在让我们学习如何与世界分享我们的插件代码。\n\
  \n#### 私有发布\n\n有时你制作了一些很酷的东西，但它是专有的。无论出于何种原因，你无法完全开源你的插件。但你也希望确保多个应用能够受益。幸运的是，你可以将插件发布到私有仓库。\n\
  \nEmber CLI 支持通过一条命令使用私有发布的插件。只需将你的插件代码存储在 Git 仓库中，然后你可以直接使用仓库的 URL 作为插件名称运行 `ember\
  \ install` 命令。插件将被安装到你的项目中，你可以像公开发布一样继续使用它。\n\n#### 发布到 npm\n\n当然，发布一个热门的开源 Ember\
  \ 插件所带来的名声、荣耀和财富可能太诱人而无法抗拒。如果是这样，你可以将插件发布到 npm。\n\n当你创建插件时，Ember CLI 创建了一个 `package.json`\
  \ 文件。该文件中包含发布包所需的两个属性：`name` 和 `version`。这就是你所需要的全部内容。\n\n在发布之前，你需要在 npm 上注册。如果你还没有注册，请运行\
  \ `npm adduser` 在 [`npmjs.com`](https://npmjs.com) 网站上添加一个用户。一旦你以该用户身份登录，就可以运行 `npm\
  \ publish` 来发布你的新插件，它将通过 npm 网站公开可用。\n\n当你准备发布新版本时，可以使用 `npm version` 来提升版本号，并根据更改的性质提供\
  \ `update_type`，可以是 `patch`、`minor` 或 `major`。\n\n一旦你的插件包发布，其他开发者就可以像使用任何其他插件一样，通过\
  \ `ember install` 命令访问它。你可以为自己为社区做出了一点贡献而感到高兴。\n\n## 下一步\n\n我们一起走到了路的尽头，但还有很多东西需要学习。在我们分别之前，这里有一些关于接下来可以做什么的建议，以便继续使用\
  \ Ember 并支持社区。\n\n支持 Ember 社区的方法有很多，包括为核心框架做贡献或在线撰写关于你使用 Ember 的文章。这些都非常鼓励。然而，通过\
  \ Ember 插件分享他人可能觉得有用的代码是另一种很好的回馈方式。\n\n\n\n\n\nEmber 在很多方面都是一个成熟的框架，它开箱即用地提供了许多出色的功能。然而，还有许多特性可能对大量开发者有用，却不属于核心框架。这就是为什么\
  \ Ember 生态系统中最具吸引力的特性之一就是 Ember 插件。\n\n此外，Ember 的内容远不止我们在这里所能涵盖的。Ember 团队在维护项目文档方面做得非常出色。如果你遇到了我们尚未讨论的用例，那么\
  \ Ember 很可能已经考虑到了它，或者存在相应的插件。因此，请查阅 Ember 官网或 Ember Observer 上的文档！\n\nEmber 项目一直在向前发展，任何时候都有许多优秀的特性正在开发中，这些特性无疑会对你有用。我会尽最大努力保持本书的时效性，但我也鼓励你查看以下资源以跟进项目进展：\n\
