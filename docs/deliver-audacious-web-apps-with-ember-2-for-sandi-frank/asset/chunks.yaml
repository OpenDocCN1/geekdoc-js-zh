    # 第 9 章


    构建和使用 Ember 插件


    在整本书中，我们已经看到了许多 Ember 插件的例子。插件是一种模块化的代码片段，用于在 Ember 应用程序中使用。插件可以让你的工作更轻松，而围绕创建和共享
    Ember 插件的社区精神是使用 Ember 最吸引人的原因之一。


    在本章中，我们将更详细地了解插件的生命周期。首先，你将学习如何安装插件，我们在​*嵌套组件*​中已经简单提及，但这里会更详细地介绍。接下来，我们将讨论如何开发你自己的插件，然后将其提供给其他
    Ember 开发者，以便分享你制作的酷炫内容。没有什么比回馈社区更令人满足的了（除非是制作出广泛使用的东西所带来的炫耀资本）。


    首先，让我们回顾一下如何将插件安装到我们的应用中。


    ## 安装 Ember 插件


    Ember 插件严格来说并不是 Ember 的特性，而是 Ember CLI 的特性。这个区别很重要，因为如果你决定不使用 Ember CLI 而使用 Ember，那么本章内容将不适用。如果你想要插件，就需要
    Ember CLI。


    当你查看如何获取 Ember 插件时，这一点就变得很明显了。我们在​*嵌套组件*​中已经做过一次，当时我们引入了 `ember-cli-showdown`
    插件，以便使用 Markdown 格式化文本。为了获取那个插件，我们在 `ember-note` 根目录下运行了以下命令：


    ```

    $ ember install ember-cli-showdown

    ```


    当你运行这个命令时，Ember CLI 会在 npm 数据库中搜索请求的插件，并将其安装到项目的 `node_modules` 目录中。然后，你就可以像使用应用程序中的任何其他代码一样使用该插件。插件的文档（通常包含在其
    `README.md` 文件中）应该会描述如何在你的应用中使用该插件。


    有几种不同的方法可以发现可用的插件。我最喜欢的方法（也是我在写这本书时最常用的方法）是通过 Ember Observer。^([[11]](#f_0063.html_FOOTNOTE-11))
    Ember Observer 提供了一个存储在 npm 中的插件目录，但它更进一步，对这些插件进行评分，以评估插件的健康度和成熟度。这些指标告诉你插件是否开源；代码、测试和文档的质量；插件持续集成实践的质量；插件是否得到积极维护；以及插件在
    GitHub 上的流行度。一旦你找到了想要使用的插件，`README.md` 文件通常会告诉你如何使用该项目。


    使用插件可以大大提高生产力，但有时你会有很棒的想法想要与他人分享。为此，你可能需要开发自己的插件。开发插件并学习如何将其发布给社区是我们旅程的最后一步。


    ## 开发你自己的插件


    如果你使用 Ember 和 Ember CLI 足够长时间，你会发现你希望在应用之间共享代码，无论是将多个应用指向私有 Git 仓库中的插件，还是通过 npm
    公开发布你的插件。我们已经了解了如何在你的应用中获取和使用第三方插件。现在，让我们讨论如何创建一个可以在你的应用之间共享，甚至可以被他人使用的插件。


    Ember 插件的一个自然用途是创建可重用的 Web 组件库。许多这样的库已经存在，包含可重用的 Web 控件，比如按钮或菜单栏；我们甚至在本书中讨论过一些。现在，让我们从一个简单的控件开始：一个
    Bootstrap 样式的下拉列表，我们将用它来替换 EmberNote 应用中的笔记本列表，改为一个包含笔记本记录的下拉列表。当用户选择列表中的条目时，这个下拉列表会切换到所选笔记本。


    我们将首先使用 Ember CLI 为我们的插件创建基本结构。


    ### 创建插件


