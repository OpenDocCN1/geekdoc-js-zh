    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.query(​*''notebook''*​,{user: params.user_id});
    |


    | ​  | }, |


    | ​  | actions: { |


    | ​  | } |


    | ​  | }); |


    Similar to the login route, notebooks uses the ES6 module format and begins with
    the necessary import statement. Further, we defined it using the --pod command-line
    flag, so the file is called route.js and resides in the app/notebooks path, and
    the definition uses the export default Ember.Route.extend form.


    The model hook is the first block in the body of our Route. It’s defined as a
    function, which is executed by Ember when the route is loaded. You’ll also note
    that an object, known as params, is passed to this function. We’ll come back to
    this shortly.


    The body of the model hook contains some Ember Data code to load the logged-in
    user’s notebooks. We’ll cover Ember Data further in Chapter 5, [​*Modeling Your
    Data*​](#f_0035.html_chp.models), so let’s focus on the route-specific portions
    of the code now. This line of code causes Ember Data to query for notebook objects
    that are owned by the user with params.user_id. So where does this user_id come
    from?


    To provide the params object to the route, and specifically the user_id, we need
