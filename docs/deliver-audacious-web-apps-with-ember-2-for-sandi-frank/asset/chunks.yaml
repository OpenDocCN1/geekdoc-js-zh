  trans: "\n\nEmber 和 Ember CLI 提供了两种在开发期间为应用提供数据的方式：fixtures（固定数据）和 mock services（模拟服务）。虽然\
    \ fixtures 更容易设置，但 mock services 要求你实现访问 RESTful 服务所需的一切，从而能够更全面地测试代码。因此，本书将使用\
    \ mock services。如果你更关注测试核心 Ember 类，而不担心数据访问层的测试，那么可以考虑使用 fixtures，它们本质上是包含硬编码数据和简单访问方法的类。\n\
    \n实际上，我们在 mock services 的基础上更进一步：我们的服务会在重启后持久化数据，这样在构建应用时，我们也能看到数据不断累积。Ember CLI\
    \ 创建的默认 mock services 不会这样做，虽然在正常情况下这种默认行为可能更适合开发应用，但我更希望我们的数据在服务重启后仍然保留，这样我们在处理示例时测试数据就能持续存在。那么，让我们看看\
    \ mock service 是如何工作的。\n\n首先，为我们的用户对象创建一个模型类。目前，我们的用户只包含一个数据属性：`name`。让我们使用 Ember\
    \ CLI 生成一个存根类。\n\n```\n$ ember generate model user\n```\n\n以下是添加了实现细节后的类：\n\n\
    [ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\n这个类依赖 Ember Data 库来创建一个 Model 实例，其中包含一个名为\
    \ `name` 的属性。该属性的类型是字符串，意味着它将保存文本。仅此而已。这就是我们为用户对象建模所需的全部内容。现在，为了与我们计划创建的服务进行交互，我们需要一个\
    \ `RESTAdapter` 和一个 `RESTSerializer`。\n\n要创建 `RESTAdapter`，请运行以下命令：\n\n```\n$\
    \ ember generate adapter application\n```\n\n这会创建一个 `RESTAdapter`，它将由整个应用程序使用，这就是我们将其命名为\
    \ `application` 的原因。现在，编辑生成的文件，使其看起来像这样：\n\n[ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\n类似地，要创建 `RESTSerializer`，请运行以下命令：\n\n```\n$ ember\
    \ generate serializer application\n```\n\n生成的类将如下所示：\n\n[ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({});\n\
    ```\n\n`RESTAdapter` 只有一个目的：定义服务器上可以找到我们 RESTful 服务的路径。`RESTSerializer` 是一个空实现，因为我们使用的是默认功能。由于我们将创建一个为每个模型对象暴露预期\
    \ API 的服务，因此我们只需要做这些。我们将在 *适应非传统 API* 和 *使用序列化器访问遗留 API* 中看到更多相关内容。\n\n通常，Ember\
    \ 开发到这里就结束了。创建服务来提供数据通常超出了 Ember 的职责范围，因为 Ember 是一个前端框架，而不是用于开发 REST 服务的。正如我之前所说，我们正在创建一个\
    \ mock service，供我们的应用测试使用，然后更进一步，让数据持久化。\n\n为了使数据持久化，我们需要做两件目前还做不到的事情。首先，我们需要一个存放数据的地方。为此，我们将使用\
    \ NEDB 项目，这是一个用于 Node 的嵌入式数据存储。这是一个非常适合开发数据存储的工具，比如我们的场景。对于生产环境的数据存储，你可能需要更健壮的方案。在你的\
    \ `ember-note` 目录中运行以下命令（`--save-dev` 标志使其成为仅开发依赖，而非生产依赖）：\n\n```\n$ npm install\
    \ nedb --save-dev\n```\n\n这使得 NEDB 项目可用。当 Ember Data 存储将新用户记录保存到注册路由时，它会通过 HTTP\
    \ 将数据 POST 到我们的 mock service。因此，我们还需要能够解析传入 HTTP 请求的正文。获取以下库来实现这一点：\n\n```\n$\
    \ npm install body-parser --save-dev\n```\n\n现在，我们准备通过运行以下命令来创建我们的 mock service：\n\
    \n```\n$ ember generate http-mock users\n```\n\n创建好服务后，我们只需添加几行代码，即可使用刚刚添加的库，并响应创建新记录的请求。请看以下代码，它对基本的\
    \ mock service 进行了修改，使其能够将数据存储在 NEDB 中：\n\n[ch1/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/server/mocks/users.js)\n\
    \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
    \  var usersRouter = express.Router();\n\n  // 在此服务中使用 body-parser 库\n  var bodyParser\
    \ = require('body-parser');\n  app.use(bodyParser.json());\n\n  // 如果尚不存在，则使用\
    \ NEDB 创建一个嵌入式表\n  var nedb = require('nedb');\n  var userDB = new nedb({ filename\
    \ : 'users', autoload: true});\n\n  // POST URL 用于创建新记录\n  usersRouter.post('/',\
    \ function(req, res) {\n\n    // 查找最近创建的记录，并用它来设置传入记录的 id 字段，\n    // 这是 Ember\
    \ Data 所必需的\n    userDB.find({}).sort({id : -1}).limit(1).exec(function(err,users)\
    \ {\n      if(users.length != 0)\n        req.body.user.id = users[0].id + 1;\n\
    \      else\n        req.body.user.id = 1;\n\n      // 将新记录插入数据存储，并将新创建的记录返回给\
