  trans: "\n为了进行这种转换，你需要在你的 `RESTSerializer` 实现中实现 `extractArray` 方法。该方法允许你对负载执行任何重新格式化或清理操作。以下是该方法的一个示例实现：\n\
    \n```\nextractArray: function(store, type, payload) {\n  //你可以在此处对负载进行处理，然后传递给父类\n\
    \  return this._super(store, type, payload);\n}\n```\n\n`payload` 方法参数是来自服务器的原始响应。你的实现很可能会获取这个负载，进行必要的调整以使其符合\
    \ Ember Data 预期的格式，然后将其传递给父类的方法实例。一些常见的操作可能包括更改负载的结构或删除不需要的信息，例如模型中不存在的属性。这让你能够利用即使是最非传统的\
    \ API 响应，同时仍然享受 Ember Data 的特性。\n\n当负载是对包含多行的查询（例如 `findMany`）的响应时，会使用此方法。还有一个并行方法，称为\
    \ `extractSingle`，它扮演相同的角色，但作用于仅包含一条记录的响应，例如 `find` 或 `save`。该方法签名包含一个额外的参数，如下所示：\n\
    \n```\nextractSingle: function(store, type, payload, recordId) {\n  //你可以在此处对负载进行处理，然后传递给父类\n\
    \  return this._super(store, type, payload, recordId);\n}\n```\n\n还有许多其他类似的方法，每个都支持特定的数据操作，例如\
    \ `extractCreateRecord`，但最相关的方法本质上只是 `extractSingle` 或 `extractArray` 的别名。然而，如果你的\
    \ API 要求不同的操作类型接受不同的处理，那么了解这些选项的存在是值得的。\n\n## 将适配器和序列化器绑定到你的模型类\n\n在你的应用中实现适配器/序列化器模式有两种方法。到目前为止，我们实际上已经使用了这两种方法。对于你想要在所有\
    \ REST 请求中共享的通用更改，例如添加用户令牌，你可以修改 Ember CLI 为你创建的应用程序适配器或序列化器，它们位于 `ember-note/app/adapters/application.js`\
    \ 和 `ember-note/app/serializers/application.js`。如果你想创建特定于模型的适配器或序列化器，可以运行以下命令之一：\n\
    \n```\n$ ember generate serializer mymodel\n\n或\n\n$ ember generate adapter mymodel\n\
    ```\n\n这会创建一个适配器或序列化器，它将应用于对给定类型数据的请求。然后你可以实现我们之前描述的功能，而不必担心它们会被不必要地应用于其他模型类型。\n\
    \n现在我们已经探讨了如何使用替代 API，让我们删除笔记本适配器和序列化器，并将我们的应用程序范围的 `RESTAdapter` 恢复原样。在命令行中，运行以下命令：\n\
    \n```\n$ ember destroy adapter notebook\n$ ember destroy serializer notebook\n\
    ```\n\n然后修改 `ember-note/app/adapters/application.js` 文件中的 `namespace` 属性，如下所示：\n\
    \n```\nnamespace: \"api\"\n```\n\n你可以保留 headers 不变；没有理由删除它们。随着我们对非标准 API 的快速浏览结束，我们已准备好进入下一步。\n\
    \n## 下一步\n\n`RESTAdapter` 和 `RESTSerializer` 类提供的功能远不止我们在这里所能涵盖的。这些类提供了一种强大的方式，可以使用\
    \ Ember Data 与几乎任何 API 配合使用，因此如果你遇到我们未涵盖的场景，我鼓励你进一步探索它们。我们现在已经看到了 Ember 和 Ember\
    \ Data 的许多核心特性，但还有更多内容等待我们。Ember 提供了多种选项来扩展这个核心，并使用框架本身将类链接在一起，以帮助你提高所创建类的实用性。在下一章中，我们将通过在整个应用中提供常用的实用程序来扩展\
    \ Ember。\n\n版权所有 © 2015, The Pragmatic Bookshelf.\n\n# 第 7 章\n\n在 Ember 中重用代码\n\
    \n我们已经花了大量时间学习 Ember 的核心特性。我们看到了如何使用这些核心特性构建 Web 应用，以及如何通过依赖 Ember 的约定式结构来快速完成。\n\
    \n这种结构不仅为你提供了一种构建应用核心的方法，还提供了在系统不同方面之间共享代码的几种方式。它提供了通过准备任何必要的对象来引导应用的能力。它还提供了将数据值从一种上下文转换到另一种上下文的能力，例如货币转换。\n\
    \n在本章中，我们将探讨如何使用 Ember 和 Ember CLI 在 Ember 的约定式结构之上分层添加特定于应用的抽象，以便你可以将合理的设计应用于\
    \ EmberNote 的逻辑。让我们从最基本的抽象级别开始：实用工具类。\n\n## 使用实用工具抽象通用函数\n\n在对象之间共享代码的一种方法是创建一个简单的实用工具函数。Ember\
    \ CLI 包含一个用于创建实用工具函数的蓝图，该函数可以导入到其他类中。严格来说，以这种方式创建实用工具函数与其说是 Ember 核心框架的特性，不如说是\
    \ Ember CLI 的特性。当我们探讨在第 8 章，构建、测试和部署你的 Ember 应用中构建应用时，我们将讨论 Ember CLI 如何使这一特性及其他特性成为可能。\n\
    \n创建实用工具函数的目标是为可能需要在不同、不相关的类中使用的逻辑提供一个单一的位置。我说“不相关”，是因为如果这些类是相关的，我们最好使用混入，正如我们在使用混入共享代码中看到的那样。\n\
    \n数据验证是可能存在于实用工具函数中的逻辑的一个很好的例子。你可能需要验证数据的原因有很多。你可能需要验证一个字符串是否是有效的电子邮件、电话号码或邮政编码。你可能需要验证字符串的长度，或者它是否是一个有效的日期。你可能需要验证它是否不包含某些字符。无论如何，你很可能希望在几个不相关的上下文中使用这种验证，因此验证是我们开始的一个很好的用例。\n\
    \n就我们的目的而言，假设我们想要验证 EmberNote 的笔记标题长度在 0 到 140 个字符之间。我们将创建一个实用工具函数来强制执行此操作，然后在我们的笔记路由中使用该函数。首先，从你的项目根目录运行以下命令：\n\
    \n```\n$ ember generate util is-valid-length\n```\n\n此命令创建一个空的实用工具函数，如下所示：\n\n\
    ```\nexport default function isValidLength() {\n  return true;\n}\n```\n\n为了添加我们的实际逻辑，进行以下更改：\n\
    \n[`ch7/ember-note/app/utils/is-valid-length.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/utils/is-valid-length.js)\n\
    \n```\nexport default function isValidLength(value, min, max) {\n  return !(value.length\
    \ <= min || value.length > max);\n}\n```\n\n这个函数的具体实现细节不如其形式重要。你会注意到命令使用了连字符形式的文本\
    \ `is-valid-length`，而函数名为 `isValidLength`。Ember CLI 在创建函数时执行了这种转换，该函数保存在名为 `is-valid-length.js`\
    \ 的文件中。那么现在我们有了一个函数，如何引用它呢？看看我们对笔记路由的以下更新：\n\n[`ch7/ember-note/app/notebooks/notes/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/notes/route.js)\n\
    \n"
