  trans: "\n\n每个用户界面都由不同的控件分组组成，例如菜单、表格或表单，这些分组可以自然地分离成模板（或组件，我们将在下一节介绍）。在使用 Ember\
    \ 时，一个好的设计步骤是审视你规划的用户界面，并在相关的控件集合周围划定边界。一旦你定义了可以用一个数据模型表示的控件组，你就得到了一个模板！让我们看看具体如何创建模板。\n\
    \n### 创建模板\n\n当你使用 Ember CLI 创建路由时，会同时生成一个模板供该路由使用。如果你使用了 `--pod` 标志，新路由的模板会放在该路由的目录下，并命名为\
    \ `template.hbs`。否则，它会被放在 `templates` 目录下，并命名为 `myroute.hbs`，其中“myroute”是你定义的路由名称。是否使用\
    \ `--pod` 标志主要是一个组织方式的选择，你应该根据自己觉得合理的方式来决定。我更喜欢将相关的模板和路由放在同一个目录中，因此我选择使用 `--pod`\
    \ 标志。\n\n当 Ember CLI 以这种方式创建新模板时，它唯一添加到模板中的内容是一个用于子路由的 `{{outlet}}` 表达式。剩下的内容就由你来添加了！让我们看另一个更有趣的模板——笔记本模板：\n\
    \n```\n<div>\n  <div class=\"col-md-3\">\n    <div>笔记本</div>\n    <div>\n    \
    \  标题：{{input value=title}}\n      <button {{action 'addNotebook'}}>添加</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as |notebook|}}\n  \
    \        {{#link-to 'notebooks.notes' notebook.id}}\n            <li>{{notebook.title}}</li>\n\
    \          {{/link-to}}\n        {{else}}\n          <div>未找到笔记本</div>\n     \
    \   {{/each}}\n      </ul>\n    </div>\n  </div>\n  <div class=\"col-md-9\">\n\
    \    {{outlet}}\n  </div>\n</div>\n```\n\n在模板中，你会看到 HTML 和 Handlebars 表达式（即双花括号内的任何内容）的混合。这个特定的代码片段包含了一些用于结构的\
    \ HTML 标签，但最有趣的是 Handlebars 表达式。现在让我们来看一个非常重要的表达式。\n\n### 链接模板\n\n该模板中的一个 Handlebars\
    \ 表达式是 `{{#each}}` 表达式。它代表一个基本的循环结构。回想一下，每个模板只绑定到一个路由和一个控制器。路由的一个作用是为其关联的模板提供数据。在这里，路由向笔记本模板提供了一个包含零到多个笔记本对象的列表。`{{#each}}`\
    \ 表达式会针对每个笔记本对象进行计算。如果路由提供了一个空列表，则会计算 `{{else}}` 部分，页面将向用户显示“未找到笔记本”。\n\n然后，列表中的每个笔记本对象都会执行以下代码：\n\
    \n```\n<div>\n  {{#link-to 'notebooks.notes' notebook.id}}\n    {{notebook.title}}{{/link-to}}\n\
    </div>\n```\n\n这是一个 `{{link-to}}` 表达式。在运行时，这个 `{{#link-to}}` 代码片段大致会生成以下 HTML：\n\
    \n```\n<a id=\"ember100\" class=\"ember-view\" href=\"notebooks/10/notes/1\">笔记本</a>\n\
    ```\n\n我们来分解一下这个链接。`{{#link-to}}` 表达式会生成一个路由，包括所有必要的路径段。在这个例子中，我们已经在笔记本路由上，并且为\
    \ id 值为“10”的用户加载了该路由。我们试图从那里导航到笔记子路由，其中笔记本的 id 为“1”。\n\n虽然这个 HTML 很有趣，但 Ember\
    \ 如何使用这个链接才是最重要的。当你点击链接时，Ember 会将当前 URL 更新为 `http://localhost:4200/notebooks/1/notes/1`（数字可能略有不同，但其他段应该相同）。Ember\
    \ 会将笔记本模板渲染到应用模板的 `{{outlet}}` 中，并将笔记模板渲染到笔记本模板的 `{{outlet}}` 中。然后你可以向笔记路由添加子路由，以此类推。\n\
    \n下图说明了 URL 段与嵌套模板之间的关系。\n\n![images/route-diagram-1.png](img/route-diagram-1.png)\n\
    \nURL 与应用程序中确切位置（包括加载的数据）之间的关系是 Ember 的杀手级特性之一。当以这种方式使用时，URL 完全代表了用户的当前位置（用户在应用程序中的位置）和当前加载的数据（哪个记录可见）。生成的\
    \ URL 在加载时会一致地显示相同的信息，从而便于共享。\n\n在处理实际应用程序时，你的目标是以合理的方式向用户呈现信息。这些信息几乎总是包含数据片段之间的关系，而这些关系会形成层次结构。为了显示层次结构数据，你的用户界面将具有屏幕或小部件的层次结构。在\
    \ Ember 中，这些屏幕或小部件由模板封装。因此，虽然模板几乎是一个独立的功能单元，但你还需要考虑每个模板与其相邻模板的关系。\n\n将模板排列成层次结构并使用\
    \ URL 捕获应用程序状态的能力是 Ember 最有用的两个特性。但模板对开发者来说还有更多有用的内容。接下来，让我们看看如何使用 Handlebars\
    \ 表达式来渲染一些标准的 HTML 控件。\n\n## 使用表达式渲染 HTML 控件\n\n到目前为止，我们使用了一些相当普通的控件来说明 Ember\
    \ 的模板系统。但 Handlebars 表达式语言和 Ember 的助手类能够渲染出更多样化的内容。\n\n在本节中，我们将介绍 Ember 中最有用的控件。我们将从如何使用\
    \ Ember 显示静态数据开始，然后讨论条件语句和循环。接着，我们将介绍输入控件，最后通过操作和链接来结束本节。\n\n### 渲染数据\n\nHandlebars\
    \ 表达式最基本的用途就是简单地显示来自路由及其相关控制器的数据。控制器是一个类，用于提供通过路由的模型钩子提供的数据的访问。回想一下，每个模板只绑定到一个路由。控制器也是如此。每个控制器维护一组属性，这些属性是模板可以使用的数据。到目前为止，我们还没有需要显式定义控制器类，而是依赖框架的默认功能。然而，如果我们想显示某个控制器属性的数据，只需在模板的表达式里添加它，如下所示：\n\
    \n```\n<div>{{propertyName}}</div>\n```\n\n该属性中保存的任何数据都会作为静态文本显示在页面上。如果你的控制器如下所示：\n\
    \n```\nimport Ember from 'ember'\n\nexport default Ember.Controller.extend({\n\
    \  propertyName: \"一个值\"\n});\n```\n\n那么前面的表达式将渲染为：\n\n```\n<div>一个值</div>\n```\n\
    \n控制器可以管理单个记录的数据（称为 `ObjectController`），也可以管理多个记录的数据（称为 `ArrayController`）。在我们的示例中，支持笔记本模板的控制器是一个\
    \ `ArrayController`。如果你有一个 `ArrayController`，你可以使用 `{{each}}` 表达式来渲染它管理的记录列表中的数据，正如我们在本章前面看到的那样。现在让我们转向\
    \ Ember 的控制流表达式。\n\n"
- fmt: "\n### Controlling Templates with Looping and Conditionals\n\nEmber has a number\
    \ of different means of controlling what is displayed within a template. One such\
    \ construct is the `{{if}}` expression. An `{{if}}` expression renders a section\
    \ of the template (or not) based on whether the provided property is true, or\
    \ whether it’s false, `null`, `undefined`, or `[]`. (Oh, JavaScript.)\n\nTo use\
    \ an `{{if}}` expression, you’ll surround the block you want to conditionally\
    \ include, like this:\n\n```\n{{#if condition}}\n  <div>HELLO</div>\n{{else}}\n\
    \  <div>never mind</div>\n{{/if}}\n```\n\nEmber refers to such an expression as\
    \ a block expression, because a block of template code is surrounded by the expression.\
    \ Block expressions require an opening and closing tag (for example, `{{#if}}`\
    \ and `{{/if}}`). In this case, “HELLO” will be rendered if `condition` is true;\
    \ otherwise “never mind” will be rendered.\n\nEmber also allows you to chain together\
    \ conditions, rather than nest them within your `{{else}}` block. If you have\
    \ two, three, or forty-seven conditions that you need to chain together, you can\
    \ do so like this:\n\n```\n{{#if condition}}\n  <div>HELLO</div>\n{{else if condition2}}\n\
    \  <div>never mind</div>\n{{else if condition3}}\n  <div>WAT</div>\n{{else}}\n\
    \  <div>go away</div>\n{{/if}}\n```\n\nYou can also shortcut the standard `{{if}}`\
    \ syntax by using an inline if:\n\n```\n{{if condition 'on' 'off'}}\n```\n\nThe\
    \ second and third parameters to the inline conditional can contain a property\
    \ or a string, but nothing more. The `{{if}}` expression has a sibling expression\
    \ called `{{unless}}`. Use this expression when you have one outcome in which\
    \ to render the body of the expression, and you don’t want to confuse matters\
    \ by “not”-ing the conditional, like this:\n\n```\n{{#unless hasChrome}}\n  The\
    \ Chrome web browser is required to run this app.\n{{/unless}}\n```\n\nThe admonishment\
    \ to use only Chrome is displayed unless the user has the Chrome browser. The\
    \ `hasChrome` variable is a value provided by the backing model or route attributes,\
    \ and isn’t a standard part of Ember. Yes, you could also use an `{{if}}`, but\
    \ this combination of expression and property reads a bit more clearly. You’ll\
    \ notice we used these expressions in our `application.hbs` template.\n\nYou’ve\
    \ already seen the code to loop over a list of items using `{{each}}` earlier\
    \ in this chapter, so I won’t repeat it. I will remind you that `{{each}}` requires\
    \ that your controller reference a list of records as its model.\n\n### Binding\
    \ Input Fields\n\nEvery expression we’ve seen thus far is geared toward displaying\
    \ static text. A lot of Ember’s power comes from its ability to link editable\
    \ fields to the controller, so we need to use input fields as well. Let’s update\
    \ our example to use input fields now.\n\nStart by taking a look at the notebooks\
    \ template:\n\n`[ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)`\n\
    \n```\ntitle: {{input value=title}}\n<button {{action 'addNotebook'}}>Add</button>\n\
    ```\n\nA minimal `{{input}}` expression such as this renders the following HTML:\n\
    \n```\n<input type=\"text\" value=\"Notebook Title\" />\n```\n\nWe didn’t explicitly\
    \ define a type for the input field, but Ember set it to `\"text\"` by default.\
    \ The other option is to set it explicitly, like this:\n\n```\n{{input type=\"\
    text\" value=title}}\n```\n\nThis renders the equivalent HTML. If you look closely\
    \ you’ll see that the `type` attribute is set to a quoted string, while `value`\
    \ is set to an unquoted string. This distinction is important. A quoted string\
    \ will be rendered in the HTML exactly as written; an unquoted string will render\
    \ the value of the given controller property.\n\nThe following HTML attributes\
    \ can also be set for an input field:\n\n`accept`, `autocomplete`, `autofocus`,\
    \ `autosave`, `disabled`, `form`, `formaction`, `formenctype`, `formmethod`, `formnovalidate`,\
    \ `formtarget`, `height`, `inputmode`, `max`, `maxlength`, `min`, `multiple`,\
    \ `name`, `pattern`, `placeholder`, `readonly`, `required`, `selectionDirection`,\
    \ `size`, `spellcheck`, `step`, `tabindex`, `value`, `width`\n\nIn addition to\
    \ HTML attributes, the `{{input}}` expression supports event handlers, or actions,\
    \ as they are known in Ember. You can link to an action from your `{{input}}`\
    \ expression like so:\n\n```\n{{input type=\"text\" value=name action=\"execute\"\
    }}\n```\n\nIn the previous example, the `value` attribute is bound to a variable\
    \ in the backing controller. The value may be bound or unbound. If it’s bound,\
    \ it won’t need quotes; if it’s unbound, you provide the exact string you want\
    \ to set into the value of the field, within quotes.\n\nThe `action` property\
    \ is bound to the Return key press event. When Return is pressed, the named action\
    \ is called. A number of other user events may be bound by setting the name of\
    \ the event to an action (for example, `enter=\"actionName\"`). They are as follows:\n\
    \n- `enter`\n- `escape-press`\n- `focus-in`\n- `focus-out`\n- `insert-newline`\n\
    - `key-press`\n\nBy providing an action for each of these user events, you trigger\
    \ actions within your controller or route, which can be used to load data, execute\
    \ validation, or write to persistent storage. In the next section we’ll see how\
    \ to assign an action to a generic HTML element. But let’s spend a bit more time\
    \ on the `{{input}}` expression first.\n\nThe `{{input}}` expression can also\
    \ be used to render a check box by setting the `type` to `checkbox`. Similar to\
    \ the text type, there are a number configurable properties:\n\n- `autofocus`\n\
    - `checked`\n- `disabled`\n- `form`\n- `indeterminate`\n- `name`\n- `tabindex`\n\
    \nThese properties can be bound to a controller property, or not.\n\nSometimes\
    \ you’ll want to capture more text than you can comfortably display in a text\
    \ field. In this case, the `{{textarea}}` expression is available. The `{{textarea}}`\
    \ expression works like the `{{input}}` expression. It renders a control of type\
    \ `textarea`, with the value bound to the selected property of the controller’s\
    \ model.\n\n```\n{{textarea value=property rows=5 cols=40}}\n```\n\nYou can also\
    \ see that we’ve set a few other HTML properties: `rows` and `cols`. As before,\
    \ if set to controller properties, they’ll take the value of these properties;\
    \ otherwise they’ll be set to whatever specific value is provided. In total, the\
    \ following HTML properties may also be used in the `{{textarea}}` expression:\n\
    \n`autofocus`, `cols`, `disabled`, `form`, `maxlength`, `name`, `placeholder`,\
    \ `readonly`, `required`, `rows`, `selectionDirection`, `selectionEnd`, `selectionStart`,\
    \ `spellcheck`, `tabindex`, `value`, `wrap`\n\nThese are three of the most fundamental\
    \ means of linking properties to your user interface. You may think this is limiting,\
    \ and it would be if this was the only way to create reusable controls in Ember.\
    \ However, there is another way, and we will see it in the next chapter. Now,\
    \ let’s move on and learn how to enable action handling in Ember.\n\n### Binding\
    \ Actions to Routes\n\nYour user interface needs to do two things: display data\
    \ and respond to user input. We’ve seen the first; now let’s start on the second.\n\
    \nYour Route, which has a one-to-one relationship with your template, has a list\
    \ of functions available to the template called actions.\n\nAs you might expect,\
    \ Ember has an expression for linking an HTML element action with the route: the\
    \ `{{action}}` expression. Let’s look at a basic example of an action, from the\
    \ login template:\n\n`[ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)`\n\
    \n```\n<div class=\"col-md-12\">\n  Login: {{input value=name}} <button {{action\
    \ 'login'}}>Login</button>\n</div>\n```\n"
  raw: '### Controlling Templates with Looping and Conditionals


    Ember has a number of different means of controlling what is displayed within
    a template. One such construct is the {{if}} expression. An {{if}} expression
    renders a section of the template (or not) based on whether the provided property
    is true, or whether it’s false, null, undefined, or []. (Oh, JavaScript.)


    To use an {{if}} expression, you’ll surround the block you want to conditionally
    include, like this:


    | ​  | {{#if condition}} |


    | ​  | ​**<div>**​HELLO​**</div>**​ |


    | ​  | {{else}} |


    | ​  | ​**<div>**​never mind​**</div>**​ |


    | ​  | {{/if}} |


    Ember refers to such an expression as a block expression, because a block of template
    code is surrounded by the expression. Block expressions require an opening and
    closing tag (for example, {{#if}} and {{/if}}). In this case, “HELLO” will be
    rendered if condition is true; otherwise “never mind” will be rendered.


    Ember also allows you to chain together conditions, rather than nest them within
    your {{else}} block. If you have two, three, or forty-seven conditions that you
    need to chain together, you can do so like this:


    | ​  | {{#if condition}} |


    | ​  | ​**<div>**​HELLO​**</div>**​ |


    | ​  | {{else if condition2}} |


    | ​  | ​**<div>**​never mind​**</div>**​ |


    | ​  | {{else if condition3}} |


    | ​  | ​**<div>**​WAT​**</div>**​ |


    | ​  | {{else}} |


    | ​  | ​**<div>**​go away​**</div>**​ |


    | ​  | {{/if}} |


    You can also shortcut the standard {{if}} syntax by using an inline if:


    | ​  | {{if condition ''on'' ''off''}} |


    The second and third parameters to the inline conditional can contain a property
    or a string, but nothing more. The {{if}} expression has a sibling expression
    called {{unless}}. Use this expression when you have one outcome in which to render
    the body of the expression, and you don’t want to confuse matters by “not”-ing
    the conditional, like this:


    | ​  | {{#unless hasChrome}} |


    | ​  | The Chrome web browser is required to run this app. |


    | ​  | {{/unless}} |


    The admonishment to use only Chrome is displayed unless the user has the Chrome
    browser. The hasChrome variable is a value provided by the backing model or route
    attributes, and isn’t a standard part of Ember. Yes, you could also use an {{if}},
    but this combination of expression and property reads a bit more clearly. You’ll
    notice we used these expressions in our application.hbs template.


    You’ve already seen the code to loop over a list of items using {{each}} earlier
    in this chapter, so I won’t repeat it. I will remind you that {{each}} requires
    that your controller reference a list of records as its model.


    ### Binding Input Fields


    Every expression we’ve seen thus far is geared toward displaying static text.
    A lot of Ember’s power comes from its ability to link editable fields to the controller,
    so we need to use input fields as well. Let’s update our example to use input
    fields now.


    Start by taking a look at the notebooks template:


    | [ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)
    |


    | ​  | title: {{input value=title}} |


    | ​  | ​**<button**​ {{action ''addNotebook''}}​**>**​Add​**</button>**​ |


    A minimal {{input}} expression such as this renders the following HTML:


    | ​  | ​**<input**​ type=​*"text"*​ value=​*"Notebook Title"*​ ​**/>**​ |


    We didn’t explicitly define a type for the input field, but Ember set it to "text"
    by default. The other option is to set it explicitly, like this:


    | ​  | {{input type="text" value=title}} |


    This renders the equivalent HTML. If you look closely you’ll see that the type
    attribute is set to a quoted string, while value is set to an unquoted string.
    This distinction is important. A quoted string will be rendered in the HTML exactly
    as written; an unquoted string will render the value of the given controller property.


    The following HTML attributes can also be set for an input field:


    | accept | autocomplete | autofocus | autosave | disabled |


    | form | formaction | formenctype | formmethod | formnovalidate |


    | formtarget | height | inputmode | max | maxlength |


    | min | multiple | name | pattern | placeholder |


    | readonly | required | selectionDirection | size | spellcheck |


    | step | tabindex | value | width |  |


    In addition to HTML attributes, the {{input}} expression supports event handlers,
    or actions, as they are known in Ember. You can link to an action from your {{input}}
    expression like so:


    | ​  | {{input type="text" value=name action="execute"}} |


    In the previous example, the value attribute is bound to a variable in the backing
    controller. The value may be bound or unbound. If it’s bound, it won’t need quotes;
    if it’s unbound, you provide the exact string you want to set into the value of
    the field, within quotes.


    The action property is bound to the Return key press event. When Return is pressed,
    the named action is called. A number of other user events may be bound by setting
    the name of the event to an action (for example, enter="actionName"). They are
    as follows:


    *   enter


    *   escape-press


    *   focus-in


    *   focus-out


    *   insert-newline


    *   key-press


    By providing an action for each of these user events, you trigger actions within
    your controller or route, which can be used to load data, execute validation,
    or write to persistent storage. In the next section we’ll see how to assign an
    action to a generic HTML element. But let’s spend a bit more time on the {{input}}
    expression first.


    The {{input}} expression can also be used to render a check box by setting the
    type to checkbox. Similar to the text type, there are a number configurable properties:


    *   autofocus


    *   checked


    *   disabled


    *   form


    *   indeterminate


    *   name


    *   tabindex


    These properties can be bound to a controller property, or not.


    Sometimes you’ll want to capture more text than you can comfortably display in
    a text field. In this case, the {{textarea}} expression is available. The {{textarea}}
    expression works like the {{input}} expression. It renders a control of type textarea,
    with the value bound to the selected property of the controller’s model.


    | ​  | {{textarea value=property rows=5 cols=40}} |


    You can also see that we’ve set a few other HTML properties: rows and cols. As
    before, if set to controller properties, they’ll take the value of these properties;
    otherwise they’ll be set to whatever specific value is provided. In total, the
    following HTML properties may also be used in the {{textarea}} expression:


    | autofocus | cols | disabled | form | maxlength | name |


    | placeholder | readonly | required | rows | selectionDirection | selectionEnd
    |


    | selectionStart | spellcheck | tabindex | value | wrap |   |


    These are three of the most fundamental means of linking properties to your user
    interface. You may think this is limiting, and it would be if this was the only
    way to create reusable controls in Ember. However, there is another way, and we
    will see it in the next chapter. Now, let’s move on and learn how to enable action
    handling in Ember.


    ### Binding Actions to Routes


    Your user interface needs to do two things: display data and respond to user input.
    We’ve seen the first; now let’s start on the second.


    Your Route, which has a one-to-one relationship with your template, has a list
    of functions available to the template called actions.


    As you might expect, Ember has an expression for linking an HTML element action
    with the route: the {{action}} expression. Let’s look at a basic example of an
    action, from the login template:


    | [ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Login: {{input value=name}} ​**<button**​ {{action ''login''}}​**>**​Login​**</button>**​
    |


    | ​  | ​**</div>**​ |'
