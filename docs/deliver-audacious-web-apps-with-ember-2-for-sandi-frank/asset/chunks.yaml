    \ of the method:\n\n```\nextractArray: function(store, type, payload) {\n  //You'd\
    \ perform work on the payload here, then pass on to the superclass\n  return this._super(store,\
    \ type, payload);\n}\n```\n\nThe `payload` method parameter is the original response\
    \ from the server. Your implementation is likely to take this payload, make whatever\
    \ adjustments necessary to get it into Ember Data’s expected format, and then\
    \ pass it on to the superclass instance of the method. Some common operations\
    \ that might take place include changing the structure of the payload or deleting\
    \ unneeded information, such as attributes that are not in your model. This lets\
    \ you make use of even the most unconventional API responses and still take advantage\
    \ of Ember Data’s features.\n\nThis method is used when the payload is a response\
    \ to a query containing multiple rows, such as a `findMany`. There’s a parallel\
    \ method, known as `extractSingle`, that fills the same role, but acts on responses\
    \ that include just one record, such as a `find` or a `save`. The method signature\
    \ contains one additional parameter, and looks like this:\n\n```\nextractSingle:\
    \ function(store, type, payload, recordId) {\n  //You'd perform work on the payload\
    \ here, then pass on to the superclass\n  return this._super(store, type, payload,\
    \ recordId);\n}\n```\n\nThere are many other similar methods, each of which supports\
    \ a specific data operation, such as `extractCreateRecord`, but the most relevant\
    \ ones are in essence just an alias for either `extractSingle` or `extractArray`.\
    \ However, if your API requires that different operation types receive different\
    \ treatment, it’s worth knowing that these options are out there.\n\n## Tie Adapters\
    \ and Serializers to Your Model Class\n\nThere are two ways to go about implementing\
    \ the adapter/serializer pattern in your app. We’ve actually used both so far.\
    \ For common changes that you want to share across all REST requests, such as\
    \ adding a user token, you modify the application adapter or serializer that Ember\
    \ CLI creates for you, located at `ember-note/app/adapters/application.js` and\
    \ `ember-note/app/serializers/application.js`. If you want to create a model-specific\
    \ adapter or serializer, you run one of the following commands:\n\n```\n$ ember\
    \ generate serializer mymodel\n\nor\n\n$ ember generate adapter mymodel\n```\n\
    \nThis creates an adapter or serializer that will be applied to requests for data\
    \ of the given type. You can then implement the features we described earlier,\
    \ without worrying that they will be applied unnecessarily to other model types.\n\
    \nNow that we’ve explored how to use an alternate API, let’s get rid of the notebook\
    \ adapter and serializer, and change our application-wide `RESTAdapter` back.\
    \ From a command line, run the following commands:\n\n```\n$ ember destroy adapter\
    \ notebook\n$ ember destroy serializer notebook\n```\n\nThen modify the `namespace`\
    \ property in the `ember-note/app/adapters/application.js` file as follows:\n\n\
    ```\nnamespace: \"api\"\n```\n\nYou can leave the headers in place; there’s no\
    \ reason they should be removed. With our brisk tour through nonconforming APIs\
    \ at an end, we’re ready for our next step.\n\n## Next Steps\n\nThe `RESTAdapter`\
    \ and `RESTSerializer` classes offer a lot more than we’ve been able to cover\
