    对注册路由所做的更改与我们之前对笔记路由所做的更改非常相似。首先，我们需要导入 `ValidationFunctions` 混入。然后，在扩展 `Ember.Route`
    时引用它，这样该混入就会成为新路由的一部分。接着，像在笔记路由中一样，我们使用 `this.isValidEmail` 调用它，如果验证通过，则继续执行 `addNew`
    动作。如果验证失败，则向用户显示一条消息。


    虽然我们将 `isValidLength` 和 `isValidEmail` 定义为函数，但这些属性也可以轻松地保存一个值。如果它们保存的是值，那么包含它们的类（在本例中是笔记路由）将能够访问这些值，就像它可以访问函数一样。


    Ember 插件：Validation


    我们的示例验证类非常适合说明混入背后的概念，但它远未成熟。要了解如何使用混入执行验证的更完整示例，请查看由 Dockyard 发布的 `ember-validations`
    插件。Dockyard 是 Ember 和 Ember CLI 背后的主要团队之一。


    要在你的应用中使用 `ember-validations`，你可以从项目根目录运行以下命令来安装它：


    ```

    $ ember install ember-validations

    ```


    该插件利用了通过混入向类添加属性的能力。要向类添加验证规则，你需要初始化一个名为 `validations` 的属性。该属性包含一个 JSON 对象，由键值对组成。键是你希望验证的类上的属性，值是一个包含要应用于该属性的规则的
    JSON 对象。例如，请看 `ember-validations` 文档中的这段代码：


    ```

    export default Ember.Object.extend(EmberValidations.Mixin,{

    validations: {

    firstName: {

    presence: true,

    length: { minimum: 5 }

    },

    age: {

    numericality: true

    }

    }

    });

    ```


    像这样向对象添加 `validations` 属性，会为该对象激活此插件。你想要应用的验证规则随后包含在 `validations` 属性中。然后，包含该属性的对象将被验证，以确保
    `firstName` 属性已填写且最小长度为 5。`age` 属性被验证以确保它是一个数字。还有其他几个验证选项，例如 `format`（用于测试正则表达式）和
    `inclusion`（提供属性必须匹配的值列表）。


    每个验证都可以提供自定义消息，并且混入提供了一个名为 `isValid` 的属性，让你知道对象是否包含有效数据。每次设置属性时，该属性都会更新。可以通过引用对象上的
    `errors.propertyName` 属性来访问这些消息。然后可以将这些消息显示给用户，让他们有机会更新属性值。


    有关完整文档，请查看 [`github.com/dockyard/ember-validations`](https://github.com/dockyard/ember-validations)。


    混入是共享代码的好方法，但 Ember 还有更多功能。有时，你可能希望共享对状态或服务的访问。Ember 有一种称为依赖注入的方法来实现这一点，你将在接下来学习。


    ## 使用依赖注入共享服务


    到目前为止，我们介绍的功能通过创建可重用的类并在对象之间共享它们，帮助你实现合理的设计。混入和工具类非常适合抽象行为，但对于更复杂的抽象，你需要创建一个服务，并使用依赖注入将其注入到整个应用中。


    “服务”一词可能有不同的解释，因此让我们先定义我们所说的服务是什么意思。服务是一个自包含的功能单元。它以松散耦合的方式为不相关的对象提供对其功能的访问。Ember
    开箱即用地依赖几个服务。例如，应用的 `Ember.Router` 实例就是一个很好的服务示例：它在单个位置管理 URL 层次结构，并通过 `this.router`
    属性向其他对象（特别是 `Ember.Route` 的实例）提供对该层次结构的访问。另一个例子是 Ember Data，它是一个通过 `store` 属性在整个应用中用于数据访问的服务。


    为了以松散耦合的方式提供服务，Ember 需要提供一种方法将该服务提供给需要它的对象。它通过依赖注入来实现这一点。依赖注入是一种向依赖它的对象提供服务的方式。依赖注入的目标是以客户端对服务了解最少的方式提供此服务。


    在依赖注入模式中，服务（即依赖项）在客户端外部实例化，然后注入到客户端中。因此，Ember 需要一个地方来实例化依赖项并将其注入到客户端中。让我们来看看初始化器。


    ### 使用初始化器


    为了使依赖注入生效，Ember 必须在应用首次加载到浏览器时执行一些工作。这必须在应用生命周期的早期进行，因为通常使用依赖注入的服务类型在应用中的许多不同地方都会被使用。为此，你可以使用
    `Ember.Application.initializer` 函数。


    该函数接受一个对象，其唯一要求是定义一个名为 `initialize` 的函数。该函数用于在启动时执行你需要的任何工作。


    我们已经在*创建和注入用户会话*中使用了初始化器，但现在我们将创建第二个初始化器来集中日志记录行为。运行以下命令：


    ```

    $ ember generate initializer logger

    ```


    当我们运行此命令时，Ember CLI 会创建一个空的初始化器存根：


    ```

    export function initialize(/* container, application */) {

    // application.inject(''route'', ''foo'', ''service:foo'');

    }


    export default {

    name: ''logger'',

    initialize: initialize

    };

    ```


    当用户首次打开你的应用时，你创建的每个初始化器的 `initialize` 函数都会运行。当然，你可能需要控制它们的运行顺序。为此，Ember 遵循你定义的顺序。如果你注意的话，初始化器包含一个
    `name` 属性。


    你还可以使用名为 `before` 和 `after` 的属性。每个属性接受一个字符串或字符串数组。`before` 和 `after` 属性使用其他初始化器的
    `name` 属性来确定执行顺序。如果向这些属性传递数组，则会考虑数组中的每个初始化器。


    初始化器可用于任何需要在应用范围内执行的工作，但它们的主要用例之一是依赖注入。现在让我们来看看这个。


    ### 注入类


    当你以基于服务的方法设计应用时，你会创建旨在在整个应用中重用的对象。我们已经看到了几种分发此类对象的方法，但我最喜欢的是使用依赖注入。

