  trans: "\n在本节中，我们重点介绍了 `Route` 实现中与显示数据相关的部分。我们还不得不涉及一些其他概念，例如模板和模型，这些将在本书后面更详细地介绍。如果你现在不完全理解这些内容，不必担心。还有很多内容需要讨论。我希望你能理解如何使用路径段、模型钩子以及相关的导航函数（如\
    \ `transitionTo`）来处理数据。本章的其余部分将主要关注路由之间的导航，以及在应用程序中创建路由层次结构。我们将从添加第一个子路由开始，该路由将是我们已创建路由的子路由：笔记路由。\n\
    \n## 嵌套路由\n\n到目前为止，我们只添加了位于应用程序路由下一级的路由。让我们进一步深入，添加一个子路由的子路由，也称为嵌套路由。运行以下命令：\n\
    \n```\n$ ember generate route notebooks/notes --pod\n```\n\n此路由将用于显示属于特定笔记本的所有笔记。正如你所料，上述命令在\
    \ `Router` 中创建了一个新条目。我在 `app/router.js` 中添加了以下路径段信息：\n\n```\nthis.route(\"notebooks\"\
    , { path:\"notebooks/:user_id\"}, function() {\n  this.route(\"notes\", { path:\"\
    notes/:notebook_id\"}, function() {});\n});\n```\n\n通过更新路由类，使其如下所示（稍后我们会用到）。\n\
    \n[ch2/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/route.js)\n\
    \n```\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model:\
    \ function(params) {\n    return this.store.query('note', {notebook:params.notebook_id});\n\
    \  },\n  actions: {\n    addNote: function() {\n      this.store.findRecord('notebook',\n\
    \        this.paramsFor('notebooks.notes').notebook_id).then(\n        (notebook)\
    \ => {\n          console.log(notebook);\n          var note = this.store.createRecord('note',\
    \ {\n            title : this.controller.get('title'),\n            notebook:\
    \ notebook\n          });\n          console.log(note);\n          note.save().then(()\
    \ => {\n            console.log('save successful');\n            this.controller.set('title',null);\n\
    \            this.refresh();\n          }, function() {\n            console.log('save\
    \ failed');\n          });\n        });\n    },\n    deleteNote: function(note)\
    \ {\n      console.log('deleting note with title ' + note.get('title'));\n   \
    \   note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\n你的新笔记模板应如下所示：\n\
    \n[ch2/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/template.hbs)\n\
    \n```\n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div class=\"col-md-4\"\
    >\n    <div>\n      title: {{input value=title}} <button {{action 'addNote'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as |note|}}\n      \
    \    <li>\n            {{#link-to 'notebooks.notes.note' note.id}}\n         \
    \     {{note.title}}\n            {{/link-to}}\n            <button {{action 'deleteNote'\
    \ note}}>delete</button>\n          </li>\n        {{/each}}\n      </ul>\n  \
    \  </div>\n  </div>\n  <div class=\"col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n\
    ```\n\n这被称为嵌套路由，之所以这样称呼，是因为它作为笔记本路由的子路由存在，并且只有作为子路由才有意义。该命令还在新目录 `notebooks/notes`\
    \ 下创建了路由文件 `route.js` 和 `template.hbs`。我们之前已经填写了实现。\n\n### 缺失的笔记路由\n\n> ![images/aside-icons/warning.png](img/warning.png)\
    \ 如果你仔细查看新的笔记模板，你会发现我们添加了一个指向尚不存在的子路由的链接。这就是为什么添加新笔记后你看不到它们的原因。Ember 无法渲染该链接，因为子路由缺失，并且浏览器控制台中很可能有错误。别担心！我们将在第\
    \ 4 章 *使用组件实现复用* 中定义笔记路由。\n\n你可以像定义笔记本路由一样导航到此路由并定义它，只不过你的 `{{#link-to}}` 表达式位于笔记本模板中。我们将在第\
    \ 4 章中花更多时间处理笔记路由，并为其添加子路由，届时我们将构建一个编辑笔记的功能。在结束对路由的探索之前，让我们再看几个导航选项。\n\n## 路由间转换\n\
    \n很多时候，你会希望根据某个操作从应用程序的一个部分移动到另一个部分。Ember 提供了几种实现方式。其中一种方式是 `transitionTo` 函数。我们之前已经使用它从登录路由转换到笔记本路由：\n\
    \n[ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
    \n```\nthis.transitionTo('notebooks', user.get('id'));\n```\n\n该函数的第一个参数是你要转换到的路由名称。你可以提供顶级路由（如\
    \ `notebooks`）或嵌套路由（如 `notebooks.notes`）。你还可以在第二个参数中提供其他信息，例如特定的 `model`。如果提供了模型，接收路由将在渲染时使用该模型。如果像我们这样提供字面量，接收路由将调用其\
    \ `model` 钩子，并使用该字面量作为参数来加载模型。\n\n这是从一个路由移动到另一个路由的简单方法。需要注意的是，目标路由将渲染到与调用路由当前渲染的同一个\
    \ `{{outlet}}` 中。如果你想要更高级的功能，可以使用 `render` 函数，我们接下来会介绍。\n\n## 将模板渲染到命名出口\n\n除了\
    \ `transitionTo` 函数，Ember 还提供了一个对转换进行更精细控制的函数：`render` 函数。使用 `render` 函数，你不仅可以控制渲染哪个路由，还可以控制渲染的位置以及使用的数据和控制器。\n\
    \n到目前为止，我们只使用了默认的 `{{outlet}}` 表达式来包含模板。Ember 还允许你创建命名出口，只需为出口提供一个名称：`{{outlet\
    \ 'namedOutlet'}}`。\n\n如果你想使用 `render` 函数，你需要命名受影响的出口。`render` 函数接受一个名称（表示要渲染的模板名称）和一个\
    \ `options` 对象。`options` 对象可以包含以下任何参数：\n\n| 参数 | 描述 |\n|------|------|\n| `into`\
    \ | 这是你要将模板渲染到的目标模板的名称。如果省略此参数，`Ember` 将使用之前命名的模板的父模板。 |\n| `outlet` | 这是 `into`\
    \ 参数中指定的模板上的出口名称。如果省略此参数，`Ember` 将使用默认出口。 |\n| `controller` | 用于渲染新模板的控制器类。如果未定义，`Ember`\
    \ 将使用默认控制器。 |\n| `model` | 用于渲染新模板的模型类实例。如果未指定，`Ember` 将运行目标路由的 `model` 钩子。 |\n\
    \n"
- fmt: '

    The render function is useful for cases when you might want to change the template
    displayed in an outlet that resides somewhere outside of the current route’s hierarchy.
    Being able to specifically name the template and location allows you a high level
    of navigational control, even in areas that the current route might not always
    need to be concerned with.


    ## Next Steps


    As noted at the beginning of the chapter, the route pattern is a key feature in
    Ember. It offers you a way to clearly reason about how your application is assembled,
    and help you understand how to move from one app feature to another. We’ve seen
    a few of the features that you get by using Ember routes. There are many more,
    but we have plenty of other ground to cover first. Our next stop is a close sibling
    of the route. As you’ve learned, each route corresponds to exactly one template,
    which is used by Ember to render the user interface for a given route. In the
    next chapter, we’ll look at the template feature and the Handlebars and HTMLBars
    expression languages.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 3


    Laying Out a User Interface


    With a solid understanding of how to organize your application using routes, let’s
    talk about their sibling: the template. In Ember, as you might expect, a template
    contains a chunk of your user interface code. It consists of HTML, CSS, and Handlebars
    expressions.


    In this chapter, you’ll learn how Ember’s architecture supports the use of templates.
    You’ll also learn more about how to create templates, relate them to one another
    via the route structure, and use the Handlebars expression language to work with
    Ember objects. In addition, you’ll learn how to use a variety of expressions already
    in the Ember framework to add controls and display logic to your user interface.


    Let’s jump into the first template you’ll create for each app you create: the
    aptly named application template.


    ## Make Your App with a Single Page


    The sort of application you’ll create using Ember is known as a single-page application,
    because the application is written in such a way that all of your content is rendered
    via one HTML page, and changes to that page are done via DOM manipulation and
    Ajax.


    In Ember, when using Ember CLI, that page is known as `index.html`. We looked
    at it in Chapter 1, but let’s look again at our `index.html` for EmberNote:


    `[ch3/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/index.html)`


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>EmberNote</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    {{content-for ''head''}}


    <link rel="stylesheet" href="assets/vendor.css">

    <link rel="stylesheet" href="assets/ember-note.css">


    {{content-for ''head-footer''}}

    </head>

    <body>

    {{content-for ''body''}}


    <script src="assets/vendor.js"></script>

    <script src="assets/ember-note.js"></script>


    {{content-for ''body-footer''}}

    </body>

    </html>

    ```


    This file was built by Ember CLI, and with the exception of our change to the
    title, it’s exactly what Ember CLI generated when we created our new app. You
    might notice that there’s no reference to any template in this file. The `{{content-for}}`
    hooks are there for Ember CLI addons, but we’re not using those. So how does our
    app even begin to be rendered?


    The key lies in the `ember-note.js` file. This file is generated by the Ember
    CLI build process and includes every line of code you’ve written so far, and many
    more that you haven’t. If you’re curious, you can take a look at this file. What
    you need to know is that in order to render your user interface, this file has
    the logic to create your DOM structure on the fly based on the templates you create
    and all of the other supporting classes. It then inserts this structure into the
    page, and your user interface is presented to the user.


    The first template that sits at the root of your template hierarchy is the application
    template. It resides in `application.hbs`, shown here:


    `[ch3/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/templates/application.hbs)`


    ```html

    <div class="container">

    <div class="row">

    <div class="col-md-2">

    Welcome to EmberNote

    </div>

    <div class="col-md-10">

    {{#if user}}

    Hello, {{user.name}}

    {{/if}}

    {{#unless user}}

    {{#link-to ''register''}}register{{/link-to}}&nbsp;

    {{#link-to ''login''}}login{{/link-to}}

    {{/unless}}

    </div>

    </div>

    <div class="row">

    <div>

    {{outlet}}

    </div>

    </div>

    </div>

    ```


    We’ve spent a fair amount of time in this file in Chapter 1, but let’s take a
    look at the templating features. The file is a mix of HTML and an expression language,
    which is known as Handlebars. We’ll get into the various expressions you see in
    this template throughout this chapter. What’s special about this template is that
    it sits at the root of your template hierarchy. Therefore, it is the jumping-off
    point of the entire app. In our case, any child template we decide to render will
    be rendered into the main `{{outlet}}` receptacle.


    ![images/aside-icons/info.png](images/aside-icons/info.png) Handlebars is a part
    of Ember that you’ll use quite often, even though it’s so deeply integrated you
    may not realize it. Ember uses the HTMLBars variant of Handlebars, which is made
    available to your app via an addon called `ember-cli-htmlbars`. Whenever you use
    one of the components we’ll discuss in this chapter, you’re relying on Handlebars.
    Handlebars is two things, really. First, it’s a templating framework written in
    JavaScript and based on Mustache. Second, it’s an expression language, as codified
    in the templating framework. You’ll learn most of what you need to know about
    Handlebars just by using it, but if you’re the curious sort, you can learn more
    by visiting [http://handlebarsjs.com](http://handlebarsjs.com) and [https://github.com/tildeio/htmlbars](https://github.com/tildeio/htmlbars).


    As we saw in Chapter 2, the EmberNote route hierarchy has three routes one level
    below the application route: register, login, and notebooks. Any one of these
    routes can be rendered into the `{{outlet}}`. There’s nothing to prevent you from
    trying to render a route that’s deeper in the hierarchy, but without the expected
    backing data loaded into your route’s model, it will probably not work correctly.


    Our layout is fairly simple, so there are some options we’re not using. If you
    think about a more sophisticated example, you’re likely to have multiple outlets
    available on the application template. For example, you may have an outlet for
    the left menu, an outlet for the top menu, an outlet for the main section of the
    page, and so on. In this case you would use named outlets, and use techniques
    from [*Render Templates into Named Outlets*](#f_0021.html_named-outlets) to render
    routes into those outlets.


    Let’s take a closer look now at how to create and define a template, and then
    we’ll see some of the controls you can add using Handlebars.


    ## Segment Your UI into Templates

