    \ insert a text field into your app that, when clicked, pops up a date picker.\
    \ Choosing a date will add your choice to the text field, allowing your user to\
    \ quickly enter dates.\n\n`Ember CLI Datepicker` is just one of several similar\
    \ addons that you can use to quickly add controls into your app. The site [http://emberobserver.com](http://emberobserver.com)\
