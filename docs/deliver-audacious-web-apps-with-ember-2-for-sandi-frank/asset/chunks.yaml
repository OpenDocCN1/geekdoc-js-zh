  trans: "\n\n我们的第一个测试是“它保存”测试。正如我们在模型测试中所见，这个测试的第一步是创建待测试对象的实例。然后我们将其渲染到“屏幕”上。完成这些设置工作后，我们创建一个模拟对象来扮演笔记模型的角色。这个模拟对象只需要包含一个方法：`save`\
    \ 方法。在这种情况下，因为我们想验证组件是否正确调用了该方法，所以我们将断言放在这个方法中。如果该方法被调用，引用的消息将被打印，测试将通过。\n\n创建好模拟对象后，我们使用\
    \ `Ember.run` 方法来包装 `component.set` 动作，因为模型变化引起的重新渲染会异步发生并产生副作用（即更新 DOM）。然后，我们对指定的按钮对象强制触发点击动作。这会导致组件的\
    \ `saveNote` 动作被触发，该动作应该运行模拟对象上的 `save` 函数。由于它确实运行了，我们的测试通过了。\n\n“它关闭”测试则相当类似。我们获取一个组件实例，渲染它，并创建一个包含我们想要运行的方法的模拟对象。显著的区别在于我们如何连接测试对象。\n\
    \n因为我们的赋值没有副作用，所以我们可以不使用 `Ember.run` 循环来运行它们。我们将模板的 `close` 参数的值设置为计划从模拟对象运行的函数，并将\
    \ `targetObject` 设置为我们的模拟对象。在运行的应用中，包含此组件的路由扮演目标的角色。由于 `closeNote` 动作使用 `sendAction`\
    \ 来完成其工作，测试中的点击会调用模拟对象中的 `closeAction`，于是测试通过。\n\n当然，你的组件可能有不同的自定义代码需要测试。这两个示例对于某些组件特定的功能很有用，例如确认组件正确处理传入的模型，以及确认它正确处理引用的动作。\n\
    \n正如我之前提到的，单元测试最适合测试那些与全局代码交互不多或不需要复杂模拟的功能。我们尚未涵盖的主要对象类型是路由。我们不会花太多时间在路由的单元测试上的原因是，它们与全局代码有大量交互。因此，它们更适合进行验收测试而不是单元测试。\n\
    \n你可能会编写许多针对模型或组件之外的对象类型的单元测试。虽然具体细节会因实现而异，但思路是相同的。从 `Ember CLI` 创建的测试蓝图开始，并根据需要添加内容，以确认你在类中添加的行为。\n\
    \n单元测试非常适合在底层工作，但有时你会希望测试更完整的行为周期。为此，你可以使用验收测试，我们接下来将介绍它。\n\n### 编写验收测试\n\n验收测试用于测试应用程序中的一系列事件，以确保获得正确的结果。这是一种很好的方式，可以遍历一组屏幕并对其进行测试。因此，这需要我们在启动和运行方面做更多工作，但它们是确认功能甚至检测回归（在添加代码时）的强大方法。\n\
    \n在我们的案例中，我们将通过一个相对较小的示例来演示。我们将编写一个验收测试，以确认我们的注册路由能够正确注册有效用户。我们将创建一个测试，启动应用，导航到注册路由，填写字段并点击按钮，然后确认显示正确的消息。\n\
    \n由于验收测试与你的应用高度定制，因此 `Ember CLI` 不会在开发过程中自动生成它们。要启动验收测试，请从项目根目录运行以下命令：\n\n```\n\
    $ ember generate acceptance-test register\n```\n\n此命令为命令中指定的路由创建一个样板验收测试。让我们继续修改它，使其看起来如下所示：\n\
    \n```\n[ch8/ember-note/tests/acceptance/register-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/acceptance/register-test.js)\n\
    import Ember from 'ember';\nimport { module, test } from 'qunit';\nimport startApp\
    \ from 'ember-note/tests/helpers/start-app';\n\nvar application;\n\nmodule('Acceptance\
    \ | register', {\n  beforeEach: function() {\n    application = startApp();\n\
    \  },\n\n  afterEach: function() {\n    Ember.run(application, 'destroy');\n \
    \ }\n});\n\ntest('visiting /register', function(assert) {\n  visit('/register');\n\
    \n  fillIn('#name','test@pragprog.com');\n  click('#register');\n\n  andThen(function()\
    \ {\n    assert.equal(find('#message').text().trim(),\n      'A new user with\
    \ the name \"test@pragprog.com\" was added!');\n    assert.equal(currentURL(),\
    \ '/register');\n  });\n});\n```\n\n我们将再次依赖一些 id 属性，因此请更新注册模板，使其如下所示（为输入框、按钮和消息\
    \ div 添加 id 属性）：\n\n```\n[ch8/ember-note/app/register/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/register/template.hbs)\n\
    <div class=\"col-md-12\">\nRegister new user: {{input id='name' value=name}}\n\
    <button id='register' {{action 'addNew'}}>Add</button>\n</div>\n<div id='message'\
    \ class=\"col-md-12\">\n{{message}}\n</div>\n```\n\n这个测试看起来与我们之前编写的单元测试有些不同。你首先会注意到的区别是，我们实际上创建了完整应用的一个实例。为了测试横切特性，我们需要这样做。`beforeEach`\
    \ 创建我们的应用实例，`afterEach` 销毁它。\n\n接下来，实际测试的第一步是导航到选定的 URL。因为我们想测试能否成功注册，所以我们在名称文本字段中填入所需的值，然后点击注册按钮。\n\
    \n点击按钮后，我们将断言包装在 `andThen` 函数中，以便尊重之前可能发生的任何异步函数。当准备就绪时，`andThen` 块会验证是否显示了正确的消息，以及我们是否没有被重定向到其他路由。\n\
    \n验收测试和单元测试为你的代码提供了很好的覆盖率。通过根据需要依赖这些测试，你可以做很多事情来确保捕获错误，并且在代码更改时不会引入新错误。尽管如此，错误最终还是会出现的，这时你就需要\
    \ `Ember Inspector` 了。\n\n### 使用 Ember Inspector 进行调试\n\n尽管我们尽力而为，但有时编写良好的测试还不够。有时你需要调试应用程序，而仅仅通过查看测试中运行的代码是无法做到的。幸运的是，Ember\
    \ 为此提供了一种特殊的解决方案：`Ember Inspector`。\n\n`Ember Inspector` 是一个浏览器插件，它通过使用 Ember\
    \ 术语让你深入访问应用的对象模型，从而帮助你调试 Ember 应用。你可以通过在 Chrome 网上应用店^([[9]](#f_0059.html_FOOTNOTE-9))\
    \ 或 Firefox 附加组件网站^([[10]](#f_0059.html_FOOTNOTE-10)) 搜索“ember inspector”来获取它。请继续将其安装到其中一个浏览器中，然后重新加载应用。\n\
    \n安装 `Ember Inspector` 后，你可以通过打开浏览器的开发者工具来访问它。Inspector 允许你可视化每个 Ember 对象的状态。如果你在代码中设置了断点，Inspector\
    \ 将显示该断点处应用的状态。\n\n"
- fmt: '

    If you’re curious, give the Inspector a try. A good place to begin is by loading
    the Inspector while sitting on the login page. Before you log in, move over to
    the Data tab in the Inspector. Once you log in, you should see the user and notebook
    model types begin to reflect that you’ve loaded data.


    One other useful feature is the Deprecations tab. This tab helps you to identify
    outdated use of the Ember framework. If you have existing code that you’re in
    the process of migrating to Ember 2, this can be helpful in that migration effort.


    Lastly, the Container tab of the Inspector, which is shown in the following figure,
    shows you each and every object you’ve created and some that Ember created for
    you. This can be useful in observing the data in objects like injected services,
    such as our session object.


    ![images/inspector.png](images/inspector.png)


    With a deep, browser-based object model such as Ember’s, you need rich debugging
    tools. As with many things, Ember has solved this problem in a useful and intuitive
    way. Before we wrap up this chapter, let’s take a look at how you can create deployable
    Ember artifacts using Ember CLI.


    ## Deploy Your App


    It’s been a long road to get here, but at last you’re ready to deploy your app.
    Maybe you’re putting it onto a development server, maybe to production. In either
    case, you’re going to put it out somewhere for the world to see.


    Ember CLI ships with a command to create a deployable artifact set for your application.
    From a command prompt, run the following:


    ```

    $ ember build

    ```


    This runs the development version of your build by default. The resulting artifacts
    will be located in the `ember-note/dist` directory. These include a JavaScript
    file and stylesheet named for the app (`ember-note.js` and `ember-note.css`),
    and a file containing the dependencies for those files (`vendor.js` and `vendor.css`).
    A number of other files are also included to support the test application, as
    well as `crossdomain.xml` and `robots.txt`, and of course your root `index.html`.


    If you want to deploy to production, though, you have different needs. If you
    take a look at the `ember-note.js`, `ember-note.css`, `vendor.js`, and `vendor.css`
    files, they are relatively easy to read and debug. But they are also bloated,
    and always named the same thing, which means they are slow to load and cached
    by the browser.


    To deploy a production-grade build, you’ll want to run the `ember build` command
    with the `--environment production` flag set. This generates versions of those
    files that are minified where appropriate, and uniquely named so as not to be
    cached. The test files are excluded. These artifacts can be placed on your chosen
    high-performing web server, and your app is ready for the world to see. Another
    often difficult problem solved by Ember.


    ## Next Steps


    We’ve seen how Ember CLI helps you to build, test, debug, and deploy your app.
    But we’re not quite done yet. Along the way to delivering your killer app with
    Ember, you’ve likely used some addons, and possibly created some code you think
    others would find useful. In the last chapter, we’ll take a closer look at how
    to find and install addons into your app. We’ll also see how to publish an addon,
    either to a private repository for sharing between your own apps, or to a public
    repository for sharing with the world.


    #### Footnotes


    - [[9]](#f_0057.html_FNPTR-9) [https://chrome.google.com/webstore/search](https://chrome.google.com/webstore/search)

    - [[10]](#f_0057.html_FNPTR-10) [https://addons.mozilla.org](https://addons.mozilla.org)


