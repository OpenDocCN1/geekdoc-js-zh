    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    Each Ember template is a mixture of HTML and the Handlebars expression language,
    which is the portions of code set off with “{{ }}” characters. Handlebars is an
    expression language used by Ember to describe those segments of Ember templates
    that are in some way related to the Ember application code. You’ll see many examples
    of Ember using Handlebars expressions throughout the book, always using the “{{
    }}” characters. Ember ships with a compiler that turns Handlebars template expressions
    into DOM objects, as we’ll see in [​*Compile Templates*​](#f_0027.html_precompiling).


