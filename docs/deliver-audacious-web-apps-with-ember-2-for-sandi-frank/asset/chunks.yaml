- fmt: "\nTo use dependency injection in Ember, you generally perform two steps. First,\
    \ you register the service with the container; then you inject it into any class\
    \ factory that you want to have access to it.\n\nThe following code demonstrates\
    \ how to implement these steps to inject our new logger initializer:\n\n`ch7/ember-note/app/initializers/logger.js`\
    \ ([http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js))\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport function initialize(registry,\
    \ application) {\n  var logger = Ember.Object.extend({\n    log: function(message)\
    \ {\n      console.log(message);\n    }\n  });\n  application.register('logger:main',\
    \ logger);\n  application.inject('route', 'logger', 'logger:main');\n}\n\nexport\
    \ default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\nThe first\
    \ thing we do is to create our logger implementation. It’s an extension of `Ember.Object`,\
    \ and has a simple one-parameter wrapper around the JavaScript `console` object.\n\
    \nNext, we register this new class using the `register` method of the `Ember.Application`\
    \ object passed in to the `initialize` function. The `register` method accepts\
    \ up to three parameters: the name of the object registered (`logger:main`), the\
    \ factory (the `logger` variable that points to our new class), and an options\
    \ hash.\n\nThe options hash can contain two properties: `instantiate` and `singleton`.\
    \ By default, the factory’s `create` method will be called unless an options hash\
    \ is passed with a value of `false`. If `singleton` is `false`, then multiple\
    \ instances of this object could be created when the object is looked up; otherwise\
    \ the same instance is returned from each lookup.\n\nThe `inject` method is what\
    \ takes this newly registered factory and makes it available throughout the app.\
    \ The `inject` method takes three parameters. The first is the name of the factory\
    \ into which your new factory is injected. In our case, we’re injecting our new\
    \ logger into each route implementation by passing the `route` factory into `inject`.\
    \ You can inject into specific implementations by identifying them by name (for\
    \ example, `route:notebooks`). The second parameter is the name of the property\
    \ that will receive the instance of the new factory. This property is how you\
    \ reference the injected service from the client class. And last, the third parameter\
    \ is the injection name of the factory you want to inject, which should match\
    \ the name it was registered under (for example, `logger:main`).\n\nOnce the injection\
    \ is completed during the app’s initialization process, it’s available under the\
    \ assigned property name in each instance into which it was injected. The following\
    \ code demonstrates the use of an injected service from a class:\n\n`ch7/ember-note/app/notebooks/route.js`\
    \ ([http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js))\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  model: function(params) {\n    return this.store.query('notebook', {user: params.user_id});\n\
    \  },\n  actions: {\n    addNotebook: function() {\n      var notebook = this.store.createRecord('notebook',\
    \ {\n        title: this.controller.get('title'),\n        user: this.session.get('user')\n\
    \      });\n      notebook.save().then(() => {\n        this.logger.log('save\
    \ successful');\n        this.controller.set('title', null);\n        this.refresh();\n\
    \      }, () => {\n        this.logger.log('save failed');\n      });\n    }\n\
    \  }\n});\n```\n\nWith the logging class registered and injected in the initializer,\
    \ a property called `logger` is available in all of your app’s instances of `Ember.Route`.\
    \ The [figure](#f_0052.html_fig.di) illustrates how these pieces fit together:\n\
    \n![images/dependency-injection.png](images/dependency-injection.png)\n\nThe Ember\
    \ Data framework uses dependency injection to good effect. When you reference\
    \ the `store` property in your route implementations, it’s because that property\
    \ was set via an injection initializer that Ember Data set up.\n\nThere’s an alternative\
    \ to globally injecting a service into an object factory. If you want to use a\
    \ service in a more limited subset of objects, you can use a different API to\
    \ obtain the service from within only the class you want impacted.\n\nLet’s say\
    \ you have a service called `foo` that you want to use from a single route. You\
    \ can create a property that accesses the service like this:\n\n```javascript\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n  fooService:\
    \ Ember.inject.service('foo'),\n  model: function(params) {\n    return this.fooService.mumblyFoo(params.foobar);\n\
    \  }\n});\n```\n\nAssuming that you have registered a service called `foo` in\
    \ your initializer, you can access it using `Ember.inject.service`. The one distinction\
    \ is that in the initializer, rather than register the `foo` service under `foo:main`,\
    \ you need to register it under `service:foo`, or the container may have trouble\
    \ looking it up.\n\nUtilities, mixins, and dependency injection are three helpful\
    \ ways of making your code more modular, and I encourage you to consider using\
    \ any of these in the appropriate context. Before moving on to our next chapter,\
    \ we have one more brief foray into abstraction. In the next section, I’ll discuss\
    \ how to use app-specific data types in your models with Ember Data transforms.\n\
    \n## Use Transforms to Tweak Data\n\nIf you’re using Ember Data to access a legacy\
    \ API, or even to use data from an upstream data source, you may need to perform\
    \ some transformation on a data value before using it in your app. For this use\
    \ case, Ember Data includes the `DS.Transform` class. A `DS.Transform` encapsulates\
    \ the logic needed to take data from one form into the desired form.\n\nEmber\
    \ Data comes with a few built-in `DS.Transform` implementations: `DS.BooleanTransform`,\
    \ `DS.DateTransform`, and `DS.NumberTransform`. Each of these is responsible for\
    \ taking data from a non-canonical form and translating it into the expected form.\
    \ For example, `DS.BooleanTransform` is able to take raw JSON with a value of\
    \ `\"true\"` or `1` and transform it into a Boolean `true`.\n\nLet’s see how this\
    \ could work for another transformation. Imagine a use case where your app accessed\
    \ financial transaction data that originated from an upstream data source. Complicating\
    \ matters is the fact that these transactions are stored in US dollars. The app\
    \ wants to display all such data points in the user’s native currency. A `DS.Transform`\
    \ can help.\n\nTo get started, you execute the following Ember CLI command:\n\n\
    ```bash\n$ ember generate transform native-currency\n```\n\nThis command generates\
    \ an empty transform stub. The following example illustrates how the transform\
    \ would be built:\n\n```javascript\nimport DS from 'ember-data';\n\nexport default\
    \ DS.Transform.extend({\n  deserialize: function(serialized) {\n\n    // Perform\
    \ your currency translation here\n    var amountInNative =\n      this.currencyTranslator.translateToNative(serialized);\n\
    \    return amountInNative;\n  },\n\n  serialize: function(deserialized) {\n\n\
    \    // Translate from native to USD\n    var amountInUSD = this.currencyTranslator.translateToUSD(deserialized);\n\
    \    return amountInUSD;\n  }\n});\n```\n"
  raw: 'To use dependency injection in Ember, you generally perform two steps. First,
    you register the service with the container; then you inject it into any class
    factory that you want to have access to it.


    The following code demonstrates how to implement these steps to inject our new
    logger initializer:


    | [ch7/ember-note/app/initializers/logger.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**function**​ initialize(registry, application) { |


    | ​  | ​**var**​ logger = Ember.Object.extend({ |


    | ​  | log: ​**function**​(message) { |


    | ​  | console.log(message); |


    | ​  | } |


    | ​  | }); |


    | ​  | application.register(​*''logger:main''*​, logger); |


    | ​  | application.inject(​*''route''*​,​*''logger''*​,​*''logger:main''*​); |


    | ​  | } |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ { |


    | ​  | name: ​*''logger''*​, |


    | ​  | initialize: initialize |


    | ​  | }; |


    The first thing we do is to create our logger implementation. It’s an extension
    of Ember.Object, and has a simple one-parameter wrapper around the JavaScript
    console object.


    Next, we register this new class using the register method of the Ember.Application
    object passed in to the initialize function. The register method accepts up to
    three parameters: the name of the object registered (logger:main), the factory
    (the logger variable that points to our new class), and an options hash.


    The options hash can contain two properties: instantiate and singleton. By default,
    the factory’s create method will be called unless an options hash is passed with
    a value of false. If singleton is false, then multiple instances of this object
    could be created when the object is looked up; otherwise the same instance is
    returned from each lookup.


    The inject method is what takes this newly registered factory and makes it available
    throughout the app. The inject method takes three parameters. The first is the
    name of the factory into which your new factory is injected. In our case, we’re
    injecting our new logger into each route implementation by passing the route factory
    into inject. You can inject into specific implementations by identifying them
    by name (for example, route:notebooks). The second parameter is the name of the
    property that will receive the instance of the new factory. This property is how
    you reference the injected service from the client class. And last, the third
    parameter is the injection name of the factory you want to inject, which should
    match the name it was registered under (for example, logger:main).


    Once the injection is completed during the app’s initialization process, it’s
    available under the assigned property name in each instance into which it was
    injected. The following code demonstrates the use of an injected service from
    a class:


    | [ch7/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.query(​*''notebook''*​,{user: params.user_id});
    |


    | ​  | }, |


    | ​  | actions: { |


    | ​  | addNotebook: ​**function**​() { |


    | ​  | ​**var**​ notebook = this.store.createRecord(​*''notebook''*​, { |


    | ​  | title: this.controller.get(​*''title''*​), |


    | ​  | user: this.session.get(​*''user''*​) |


    | ​  | }); |


    | ​  | notebook.save().then(() => { |


    | ​  | this.logger.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''title''*​,null); |


    | ​  | this.refresh(); |


    | ​  | }, () => { |


    | ​  | this.logger.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | } |


    | ​  | } |


    | ​  |  |


    | ​  | }); |


    With the logging class registered and injected in the initializer, a property
    called logger is available in all of your app’s instances of Ember.Route. The
    [figure](#f_0052.html_fig.di) illustrates how these pieces fit together:


    ![images/dependency-injection.png](images/dependency-injection.png)


    The Ember Data framework uses dependency injection to good effect. When you reference
    the store property in your route implementations, it’s because that property was
    set via an injection initializer that Ember Data set up.


    There’s an alternative to globally injecting a service into an object factory.
    If you want to use a service in a more limited subset of objects, you can use
    a different API to obtain the service from within only the class you want impacted.


    Let’s say you have a service called foo that you want to use from a single route.
    You can create a property that accesses the service like this:


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | fooService: Ember.inject.service(​*''foo''*​), |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.fooService.mumblyFoo(params.foobar); |


    | ​  | } |


    | ​  | }); |


    Assuming that you have registered a service called foo in your initializer, you
    can access it using Ember.inject.service. The one distinction is that in the initializer,
    rather than register the foo service under foo:main, you need to register it under
    service:foo, or the container may have trouble looking it up.


    Utilities, mixins, and dependency injection are three helpful ways of making your
    code more modular, and I encourage you to consider using any of these in the appropriate
    context. Before moving on to our next chapter, we have one more brief foray into
    abstraction. In the next section, I’ll discuss how to use app-specific data types
    in your models with Ember Data transforms.


    ## Use Transforms to Tweak Data


    If you’re using Ember Data to access a legacy API, or even to use data from an
    upstream data source, you may need to perform some transformation on a data value
    before using it in your app. For this use case, Ember Data includes the DS.Transform
    class. A DS.Transform encapsulates the logic needed to take data from one form
    into the desired form.


    Ember Data comes with a few built-in DS.Transform implementations: DS.BooleanTransform,
    DS.DateTransform, and DS.NumberTransform. Each of these is responsible for taking
    data from a non-canonical form and translating it into the expected form. For
    example, DS.BooleanTransform is able to take raw JSON with a value of "true" or
    1 and transform it into a Boolean true.


    Let’s see how this could work for another transformation. Imagine a use case where
    your app accessed financial transaction data that originated from an upstream
    data source. Complicating matters is the fact that these transactions are stored
    in US dollars. The app wants to display all such data points in the user’s native
    currency. A DS.Transform can help.


    To get started, you execute the following Ember CLI command:


    | ​  | $ ember generate transform native-currency |


    This command generates an empty transform stub. The following example illustrates
    how the transform would be built:


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Transform.extend({ |


    | ​  | deserialize: ​**function**​(serialized) { |


    | ​  |  |


    | ​  | ​*// Perform your currency translation here*​ |


    | ​  | ​**var**​ amountInNative = |


    | ​  | this.currencyTranslator.translateToNative(serialized); |


    | ​  | ​**return**​ amountInNative; |


    | ​  | }, |


    | ​  |  |


    | ​  | serialize: ​**function**​(deserialized) { |


    | ​  |  |


    | ​  | ​*// Translate from native to USD*​ |


    | ​  | ​**var**​ amountInUSD = this.currencyTranslator.translateToUSD(deserialized);
    |


    | ​  | ​**return**​ amountInUSD; |


    | ​  | } |


    | ​  | }); |'
