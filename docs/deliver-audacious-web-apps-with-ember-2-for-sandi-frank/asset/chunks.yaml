    \ from our `hasMany` function. Semantically, this makes sense: a notebook belongs\
    \ to a user and has many notes.\n\n![images/notebook-relationships.png](images/notebook-relationships.png)\n\
    \nIt is often desirable to traverse model relationships in both directions. For\
    \ example, from the perspective of the `note`, you could include a `belongsTo`\
    \ relationship back to the `notebook`. And from the `user`, you could include\
    \ a `hasMany` relationship to the `notebook`.\n\nOf course, the cardinality of\
    \ model relationships isn’t always a one-to-many or a many-to-one. If you want\
    \ a one-to-one relationship, simply create both relationships using `belongsTo`.\
    \ For a many-to-many, both sides should be a `hasMany`.\n\nNow that you have a\
    \ better understanding of how to define a model class, you’ll need to learn how\
    \ to populate them. Let’s take a look at how to load data from a server.\n\n##\
    \ Load Data from RESTful Services\n\nWhen using Ember to build your apps, it’s\
    \ very likely that your data will come from a RESTful service. A RESTful service\
    \ uses HTTP as a data query and delivery mechanism. Based on HTTP requests, it\
    \ can be used to return data to the calling logic, or to modify a data store in\
    \ some manner.\n\nThe Ember project is very keen on adapting the best ideas from\
    \ the web community into the Ember framework, and `Ember Data`’s use of RESTful\
    \ services is no exception. By simply declaring your model class, you are able\
    \ to use the `DS.Store` object to get data from your server, assuming that the\
    \ RESTful service exposes the expected API.\n\nAlthough we won’t dig too deeply\
    \ into the implementation of a RESTful service, throughout the rest of the chapter\
    \ we’ll note the URL to which `Ember Data` makes requests. In [*Use Serializers\
    \ to Access Legacy APIs*](#f_0042.html_serializers), we’ll cover how to use `Ember\
    \ Data` to access APIs that don’t follow the expected conventions.\n\nRESTful\
    \ APIs\n"
