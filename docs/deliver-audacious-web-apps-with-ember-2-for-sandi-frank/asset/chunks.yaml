    |


    | ​  | note.deleteRecord(); |


    | ​  | note.save(); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    And your new notes template should look like this:


    | [ch2/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Notes |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


