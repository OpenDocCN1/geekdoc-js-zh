    # Chapter 2


    Directing Traffic with Routes


    Now that we’ve installed Ember and Ember CLI and used them to create an app that
    lets users register, we’re ready to dig into the major features of Ember. The
    first feature we’ll look at is Ember routes. As I mentioned in Chapter 1, the
    idea of the route is one of the core principles behind Ember. A route is the starting
    point for a single unit of your app’s functionality. The hierarchy of routes makes
    up the organizational structure of your app.


    Routes are really, really important in Ember. Fortunately, they are also a really
    good place to start. In this chapter we’ll look at how to use Ember CLI to structure
    your application using routes. You’ll learn how to use the Router class to set
    up your route hierarchy, and how to use the Route class to define a route. We’ll
    also look at how to move between routes using Ember’s navigation helpers. And
    you’ll learn how Ember uses your app URL to indicate not just your location in
    the app, but the records loaded into the UI. To help you keep Router and Route
    straight, remember that each app has only one Router, and within that Router you
    define the structure of your app by defining its routes. A Route class implementation
    is how you define the behavior of a single route.


    To learn more about routes, we’ll begin to piece together more of EmberNote’s
    feature set by building the app’s navigational structure. By the end of this chapter
    you’ll have completed the majority of the route structure of EmberNote, and you’ll
    know how to write the code to navigate between routes.


    ## Use the Router Class to Organize Your App


    In the previous chapter we created the register route for EmberNote. As you can
    imagine, Ember applications are made up of many routes, each one unique within
    the application. Taken together, the routes form a hierarchy of distinct locations
    in the application, exposing each of the features unique to that place in the
    hierarchy. Ember keeps a record of this hierarchy in a single class, the Router
    class, as shown in the following figure.


    ![images/router-and-routes.png](images/router-and-routes.png)


    Because we’re using Ember CLI to manage our app, we won’t directly edit EmberNote’s
    Router all that often. Most of the time we’ll allow Ember CLI to do the editing
    for us.


    Let’s look at one such example. When we last worked on EmberNote, this is what
    our Router class looked like:


    | [ch2/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ Router = Ember.Router.extend({ |


    | ​  | location: config.locationType |


    | ​  | }); |


    | ​  |  |


    | ​  | Router.map(​**function**​() { |


    | ​  | this.route(​*''register''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Router; |


    Let’s add a couple of routes to our app to see what happens to the Router. When
    users open the EmberNote app, they can register, or if they are already registered,
    they can log in. Once they log in, they’ll see a list of their notebooks. Let’s
    add two routes now, to let users log in and to let them view their notebooks.
    From within your ember-note directory, run the following commands:


    | ​  | $ ember generate route login --pod |


    | ​  | $ ember generate route notebooks --pod |


    Having run these commands, you should see two new lines in your router:


    | ​  | this.route(​*''login''*​); |


    | ​  | this.route(​*''notebooks''*​); |


    The great thing is, Ember CLI will add in new routes as you create them, without
    wiping out existing changes to your router.


    The Router now contains the two new routes we generated via Ember CLI. We’ll now
    be able to define both the login and notebooks routes by building their classes.


    We’ll create more routes throughout the book, and we’ll often check back in on
    the Router class. It’s a good class to come back to periodically, to help us stay
    anchored and keep the overall app structure in mind. Right now, let’s take a look
    at how to define a route by working through the login route.


    ## Define Your Routes


    As noted previously, each route corresponds to a given URL in your app. We defined
    four routes in our application with the following URLs:


    *   http://localhost:4200


    *   http://localhost;4200/register


    *   http://localhost:4200/login


    *   http://localhost:4200/notebooks


    We defined register in the first chapter, and we generated the classes for login
    and notebook just now. The names and paths of these routes correspond to the definitions
    in router.js.


    You may be wondering when we defined the root URL. The answer is that we defined
    it when we created the application. This route, known as the application route,
    uses Ember’s default implementation of the Route class. We modified a file called
    application.hbs in the first chapter. This file contains the template for the
    application route. By simply creating our project with Ember CLI and through Ember’s
    reliance on default functionality, we defined the application route.'
