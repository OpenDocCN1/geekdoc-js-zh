  trans: "\n\n该插件现在可以在 EmberNote 应用中使用。首先，我们需要让 EmberNote 能够识别该插件。在本地环境中同时使用 `ember-bs-dropdown`\
    \ 插件和 EmberNote 应用时，你可以通过一组 npm 命令让插件包在本地可用。我们将在 *发布你的插件* 中了解如何将插件发布到 npm 或私有仓库。\n\
    \n要让本地 npm 缓存识别该插件，请在 `ember-bs-dropdown` 目录下运行以下命令：\n\n```\n$ npm link\n```\n\
    \n此命令会在本地 npm 缓存和你的插件项目之间创建一个符号链接。通过这个链接，你本地机器上的其他项目只需额外一步即可使用你的插件。你的本地应用还需要创建一个指向\
    \ Ember 插件的链接。因此，在 `ember-note` 目录下运行以下命令：\n\n```\n$ npm link ember-bs-dropdown\n\
    ```\n\n现在 EmberNote 应用能够找到我们创建的插件了。然而，虽然我们为应用提供了查看插件的路径，但它仍然不知道这个插件。如果你正在运行 `ember\
    \ serve` 实例，请先停止它。然后，在 EmberNote 的 `package.json` 文件（位于根目录）的 `devDependencies`\
    \ 部分最底部添加以下行（请确保在前一行的末尾添加逗号）：\n\n```\n\"ember-bs-dropdown\": \"*\"\n```\n\n现在，当我们下次运行\
    \ `ember serve` 时，应用将看到下拉组件。先不要尝试；我们还需要对 EmberNote 应用做一处修改。打开 notebooks 模板，并将其修改为如下所示：\n\
    \n[ch9/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/app/notebooks/template.hbs)\n\
    \n```\n<div>\n<div class=\"col-md-3\">\n<div>Notebooks</div>\n<div>\ntitle: {{input\
    \ value=title}}\n<button {{action 'addNotebook'}}>Add</button>\n</div>\n{{bs-dropdown\
    \ model=model route='notebooks.notes'\ndropdownName='Notebooks'}}\n</div>\n<div\
    \ class=\"col-md-9\">\n{{outlet}}\n</div>\n</div>\n```\n\n我们用新的插件组件替换了大量代码。我们使用\
    \ `{{bs-dropdown}}` 表达式来引用自定义组件。表达式中的 `model=model` 部分将 notebooks 模型传递给组件。由于该模型类包含正确的属性，即\
    \ `id` 和 `title` 属性，因此它应该能正常工作。我们将 `notebooks.notes` 路由名称作为下拉菜单的目标路由，并将“Notebooks”作为默认下拉值。\n\
    \n在生效之前，我们需要对应用做最后一处修改。我们需要从 `ember-cli-build.js` 中移除 Bootstrap 资源。如果保留它们，`ember\
    \ serve` 命令会报错说我们定义了两次。因为我们现在依赖一个基于 Bootstrap 的插件来提供组件，所以让该插件来定义我们使用的版本。将 `ember-cli-build.js`\
    \ 文件修改为如下所示：\n\n[ch9/ember-note/ember-cli-build.js](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/ember-cli-build.js)\n\
    \n```\n/* global require, module */\nvar EmberApp = require('ember-cli/lib/broccoli/ember-app');\n\
    \nmodule.exports = function(defaults) {\n  var app = new EmberApp(defaults, {\n\
    \    // Add options here\n  });\n\n  // Use `app.import` to add additional libraries\
    \ to the generated\n  // output files.\n  //\n  // If you need to use different\
    \ assets in different\n  // environments, specify an object as the first parameter.\
    \ That\n  // object's keys should be the environment name and the values\n  //\
    \ should be the asset to use in that environment.\n  //\n  // If the library that\
    \ you are including contains AMD or ES6\n  // modules that you would like to import\
    \ into your application\n  // please specify an object with the list of modules\
    \ as keys\n  // along with the exports of each module as its value.\n\n  return\
    \ app.toTree();\n};\n```\n\n这个文件现在看起来和我们开始本书时一模一样。从命令行运行 `ember serve`，你应该会看到我们的下拉菜单正在使用。你可以用它来选择要查看的笔记本，相关的笔记将被加载到\
    \ notes 路由中。\n\nEmber CLI 还提供了其他几种测试插件的方法。它在插件项目中提供了一个虚拟应用（位于 `tests/dummy` 下），以及使用\
    \ `QUnit` 编写测试用例的能力。我选择专注于使用 EmberNote 应用进行测试，但当你构建一个真正的插件时，你也应该依赖这些方法。\n\n现在你已经有了一个可以分享的插件，如何将它发布到外界呢？我们旅程的最后一站是学习如何回馈那些为我们铺平道路的人。让我们学习如何发布一个插件并与世界分享。\n\
    \n### 发布你的插件\n\n你制作了一些很酷的东西，并为此感到自豪。你非常自豪，以至于认为其他人也可能从中受益，无论是在公司内部还是在整个世界范围内。现在让我们学习如何与世界分享我们的插件代码。\n\
    \n#### 私有发布\n\n有时你制作了一些很酷的东西，但它是专有的。无论出于何种原因，你无法完全开源你的插件。但你也希望确保多个应用能够受益。幸运的是，你可以将插件发布到私有仓库。\n\
    \nEmber CLI 支持通过一条命令使用私有发布的插件。只需将你的插件代码存储在 Git 仓库中，然后你可以直接使用仓库的 URL 作为插件名称运行 `ember\
    \ install` 命令。插件将被安装到你的项目中，你可以像公开发布一样继续使用它。\n\n#### 发布到 npm\n\n当然，发布一个热门的开源 Ember\
    \ 插件所带来的名声、荣耀和财富可能太诱人而无法抗拒。如果是这样，你可以将插件发布到 npm。\n\n当你创建插件时，Ember CLI 创建了一个 `package.json`\
    \ 文件。该文件中包含发布包所需的两个属性：`name` 和 `version`。这就是你所需要的全部内容。\n\n在发布之前，你需要在 npm 上注册。如果你还没有注册，请运行\
    \ `npm adduser` 在 [`npmjs.com`](https://npmjs.com) 网站上添加一个用户。一旦你以该用户身份登录，就可以运行\
    \ `npm publish` 来发布你的新插件，它将通过 npm 网站公开可用。\n\n当你准备发布新版本时，可以使用 `npm version` 来提升版本号，并根据更改的性质提供\
    \ `update_type`，可以是 `patch`、`minor` 或 `major`。\n\n一旦你的插件包发布，其他开发者就可以像使用任何其他插件一样，通过\
    \ `ember install` 命令访问它。你可以为自己为社区做出了一点贡献而感到高兴。\n\n## 下一步\n\n我们一起走到了路的尽头，但还有很多东西需要学习。在我们分别之前，这里有一些关于接下来可以做什么的建议，以便继续使用\
    \ Ember 并支持社区。\n\n支持 Ember 社区的方法有很多，包括为核心框架做贡献或在线撰写关于你使用 Ember 的文章。这些都非常鼓励。然而，通过\
    \ Ember 插件分享他人可能觉得有用的代码是另一种很好的回馈方式。\n\n"
- fmt: '

    Ember is a mature framework in many ways, and it offers a lot of great features
    out of the box. However, there are many features that might be useful to a lot
    of developers without belonging in the core framework. That’s why one of the most
    compelling features of the Ember ecosystem is the Ember addon.


    There’s also much more to Ember than we were able to cover here. The Ember team
    does a great job of maintaining the project’s documentation. If you run across
    a use case that we haven’t discussed, there’s a good chance that Ember accounts
    for it, or there’s an addon that does. So check the docs on the Ember site or
    Ember Observer!


    The Ember project is always moving forward, and there are a number of great features
    in process at any time that will no doubt be useful to you. I’ll make every effort
    to keep this book fresh, but I encourage also you to check out the following sources
    to keep up with the project:


    *   The Ember site: [http://emberjs.com](http://emberjs.com)

    *   Ember on GitHub: [https://github.com/emberjs](https://github.com/emberjs)

    *   Ember CLI: [http://www.ember-cli.com](http://www.ember-cli.com)

    *   Ember Weekly: [http://emberweekly.com](http://emberweekly.com)

    *   Ember Observer: [http://emberobserver.com](http://emberobserver.com)


    Last, I want to thank you for taking the time to read this book. I hope you’ve
    found it helpful. If you have any comments or concerns, please share them via
    the forum at [https://forums.pragprog.com/forums/368](https://forums.pragprog.com/forums/368)
    or on the errata page at [https://pragprog.com/titles/mwjsember/errata](https://pragprog.com/titles/mwjsember/errata).
    Happy programming!


