  trans: "\n在本节中，我们涵盖的内容远不止路由，目的是构建一个良好的示例。现在你需要关注的关键元素是 `{{#link-to}}` 表达式、`transitionTo`\
    \ 函数以及 `actions` 哈希。正如在 `application.hbs` 模板中所使用的，当用户点击生成的链接时，`{{#link-to}}` 表达式允许用户将登录路由的\
    \ `template.hbs` 加载到 `application.hbs` 的 `{{outlet}}` 中。要实现这一点，我们需要在 `router.js`\
    \ 中定义登录路由。`{{link-to}}` 表达式是让父路由将子路由加载到其出口的一种方式。\n\n实现导航的另一种方法是使用像 `transitionTo`\
    \ 这样的函数在路由之间移动。正如在登录路由中所使用的，它获取当前加载的路由（由调用该函数的实例决定），并将其替换为函数调用中指定的路由。正如我们的示例中指出的，我们可以使用这个函数不仅指示要加载哪个路由，还指示要加载哪条记录。稍后当我们查看如何设置路由的模型时，我们将看到目标路由如何知道要加载哪条记录。\n\
    \n最后，`actions` 哈希用于定义动作及其相关函数的名称-值对。这个概念并非路由专属，我们稍后会看到更多示例，但值得注意的是，动作处理的一个选项是以这种方式将你的动作添加到路由中。\n\
    \n现在我们更深入地理解了路由是什么以及如何使用它，让我们看看如何通过路由的模型钩子来加载和显示数据。\n\n## 设置你的模型\n\n当我们处理路由时，模型钩子用于加载并提供必要的数据。正如我们所见，并非每个路由都会实现其模型钩子，但大多数都会。模型钩子是一个函数，定义在\
    \ `Route` 类的实例中，用于加载该路由要显示的数据。\n\n在 EmberNote 应用中，我们还没有构建一个使用模型钩子的路由。现在让我们来做这件事。当用户通过登录动作登录时，我们使用\
    \ `transitionTo` 函数转换到 notebooks 路由。现在让我们定义这个路由，并在此过程中了解如何使用模型钩子。\n\nnotebooks\
    \ 路由有一个简单的目的：显示用户在 EmberNote 中创建的笔记本列表。笔记本是笔记的集合，因此在 notebooks 路由中点击一个笔记本将显示该笔记本的笔记列表。以下是\
    \ notebooks 路由：\n\n[`ch2/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  model: function(params) {\n    return this.store.query('notebook',{user: params.user_id});\n\
    \  },\n  actions: {\n  }\n});\n```\n\n与登录路由类似，notebooks 使用 ES6 模块格式，并以必要的 import\
    \ 语句开头。此外，我们使用 `--pod` 命令行标志定义它，因此文件名为 `route.js`，位于 `app/notebooks` 路径下，定义使用\
    \ `export default Ember.Route.extend` 形式。\n\n模型钩子是路由主体中的第一个块。它被定义为一个函数，当路由加载时由\
    \ Ember 执行。你还会注意到一个名为 `params` 的对象被传递给这个函数。我们稍后会回到这一点。\n\n模型钩子的主体包含一些 Ember Data\
    \ 代码，用于加载已登录用户的笔记本。我们将在第 5 章建模你的数据中进一步介绍 Ember Data，所以现在让我们专注于代码中与路由相关的部分。这行代码使\
    \ Ember Data 查询属于 `params.user_id` 用户的笔记本对象。那么，这个 `user_id` 从何而来？\n\n为了向路由提供 `params`\
    \ 对象，特别是 `user_id`，我们需要在路由定义中使用路径段。让我们看看 `router.js` 文件中 notebooks 路由的定义：\n\n\
    [`ch2/ember-note/app/router.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)\n\
    \n```javascript\nthis.route('notebooks', { path:'notebooks/:user_id'}, function()\
    \ {});\n```\n\n这就是如何使用 `Router` 类定义带有路径段的路由。在 Ember 中，路径段用于提供一个值，该值可用于在路由中加载记录。对于这个路由，我们使用登录用户的\
    \ ID 来标识要加载的笔记本。在 `Router` 类中以这种方式定义路由，然后在 `Route` 中使用 `params` 对象，可以让你提供加载笔记本所需的数据。当然，最初导航到此路由的对象需要首先将该数据添加到路径中。在我们的例子中，我们需要修改登录路由中的\
    \ `transitionTo` 函数以提供此数据：\n\n[`ch2/ember-note/app/login/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
    \n```javascript\nthis.transitionTo('notebooks', user.get('id'));\n```\n\n有了正确的数据，我们就能对\
    \ API 发起查询，以获取当前用户的笔记本数据。\n\n> **安全提示**\n> \n> ![images/aside-icons/tip.png](img/tip.png)\
    \ 使用路径段在路由之间传递数据是 Ember 的一个极其有用的特性，但很容易以不安全的方式使用。在 URL 中放置明文数据存在潜在风险，因为恶意用户可以轻松更改它，试图破坏应用程序的安全性。这被称为直接对象引用漏洞，你可以在\
