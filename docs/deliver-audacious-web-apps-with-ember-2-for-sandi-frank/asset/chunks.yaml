    \nEmber 作为前端 Web 框架提供了很多功能。到目前为止，我们几乎完全专注于应用的渲染和导航。但在构建应用时，你最终会需要包含数据。Ember 为此提供了一个解决方案：Ember\
    \ Data。\n\n`Ember Data` 将许多功能打包进一个小型库中。它为你的 Web 客户端提供了一种直接的建模方法，以便在应用中包含简单的记录。它从\
    \ RESTful 服务读取数据，缓存加载的数据，并将这些记录持久化回服务器。\n\n在本章中，你将学习如何使用 `Ember Data` 从 RESTful\
    \ 服务访问数据。我们将重点介绍一个经过优化设计的 RESTful 服务，该服务几乎不需要我们的应用进行任何配置。通过查看我们迄今为止在 EmberNote\
    \ 中添加的所有与数据相关的代码，你将了解 `Ember Data` 的工作原理。让我们从查看目前已创建的模型类开始。\n\n## 定义你的模型\n\n`Ember\
    \ Data` 模型类代表某种持久化存储中的一条记录。由于我们在 Web 上工作，这种持久化存储很可能通过 RESTful API 访问。`Ember Data`\
    \ 记录是实际保存数据的模型类实例；而模型只是该记录的定义。记录最重要的方面是它维护的数据。让我们看看如何定义记录所维护的数据。\n\n### 定义模型的字段\n\
    \n与我们创建的其他类一样，我们首先运行 Ember CLI 命令来生成一个类的存根版本，从而定义模型。在 *添加数据服务* 中，我们运行了以下命令来生成\
    \ `User` 模型类。\n\n```\n$ ember generate model user\n```\n\n该类的存根版本没有字段。我们将添加它们，使类看起来像这样：\n\
    \n[ch5/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\n使用 `Ember Data`，你的模型定义非常简单。你的模型有一组字段，你在类中将其定义为键值对。键是你将在模板中引用数据的方式（例如\
    \ `user.name`）。\n\n定义字段时，你有几种选择来定义字段类型。如果要添加一个保存单个值的字段，可以使用 `DS.attr`。调用此函数会在模型中创建一个字段。如果不带参数调用此函数，模型将简单地接受传递给它的任何数据类型。\n\
    \n或者，你可以给它一个类型，称为 `Transform`，然后 `Ember Data` 会获取你的 API 提供的原始数据，并尝试使其符合你提供的类型。这就是我们的\
    \ `user.js` 示例所做的。`Ember Data` 提供了四种可用的默认选择：`string`、`number`、`Boolean` 和 `date`。如果需要，你可以定义自己的\
    \ `Transform` 实现，但我们现在先用这些基本类型。\n\n你还可以为字段定义默认值。例如，如果你的 `DS.attr` 调用如下所示：\n\n\
    ```javascript\nname: DS.attr(\"string\", {defaultValue: \"Matt\"})\n```\n\n那么如果给定记录没有\
    \ `name` 的值，将使用 `Matt`。\n\n### 定义模型关系\n\n你的模型类可能包含包含一条记录甚至一个记录列表的字段，而不是基本数据类型。`Ember\
    \ Data` 通过使用两个构造来实现这一点：`DS.hasMany` 和 `DS.belongsTo`。为了看到示例，让我们看看 `notebook.js`\
    \ 文件：\n\n[ch5/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n\
    });\n```\n\n`hasMany` 和 `belongsTo` 函数都定义了调用类与另一个模型定义之间的关系。该函数的参数是另一个模型类的名称。在\
    \ `notebook` 模型示例中，我们从 `belongsTo` 函数引用了 `user` 模型，从 `hasMany` 函数引用了 `note` 模型。从语义上讲，这是有道理的：一个笔记本属于一个用户，并且拥有许多笔记。\n\
    \n![images/notebook-relationships.png](img/notebook-relationships.png)\n\n通常需要双向遍历模型关系。例如，从\
    \ `note` 的角度来看，你可以包含一个指向 `notebook` 的 `belongsTo` 关系。而从 `user` 的角度来看，你可以包含一个指向\
    \ `notebook` 的 `hasMany` 关系。\n\n当然，模型关系的基数并不总是一对多或多对一。如果你想要一对一关系，只需使用 `belongsTo`\
    \ 创建两个关系。对于多对多关系，双方都应该是 `hasMany`。\n\n现在你已经更好地理解了如何定义模型类，接下来需要学习如何填充它们。让我们看看如何从服务器加载数据。\n\
    \n## 从 RESTful 服务加载数据\n\n在使用 Ember 构建应用时，你的数据很可能来自 RESTful 服务。RESTful 服务使用 HTTP\
    \ 作为数据查询和传递机制。基于 HTTP 请求，它可以用于将数据返回给调用逻辑，或者以某种方式修改数据存储。\n\nEmber 项目非常热衷于将 Web\
    \ 社区的最佳理念适配到 Ember 框架中，而 `Ember Data` 对 RESTful 服务的使用也不例外。只需声明你的模型类，你就可以使用 `DS.Store`\
    \ 对象从服务器获取数据，前提是 RESTful 服务暴露了预期的 API。\n\n虽然我们不会深入探讨 RESTful 服务的实现，但在本章的剩余部分中，我们将指出\
    \ `Ember Data` 发出请求的 URL。在 *使用序列化器访问遗留 API* 中，我们将介绍如何使用 `Ember Data` 访问不遵循预期约定的\
    \ API。\n\nRESTful API\n\n"
- fmt: "\nAs with many notions in the programming world, there’s some debate over\
    \ what constitutes a RESTful API. (Often this takes the form of “Your API isn’t\
    \ RESTful!” “No, YOUR API isn’t RESTful!”) Leaving all of that aside, let’s talk\
    \ about how RESTful APIs are meant to be used with Ember Data.\n\nGenerally speaking,\
    \ a RESTful service is a means of using a uniform resource identifier to access\
    \ data and execute functions. RESTful services often, but not always, use HTTP\
    \ as a transport protocol. Each unique URI and verb combination defines an action\
    \ and the related record (or set of records) to use when applying that action.\
    \ For example, if you want to get the note record with id 24, you can make a GET\
    \ request of `/note/24` and expect to get the current state of the record, if\
    \ it exists.\n\nThe implementation of a RESTful API is beyond the scope of this\
    \ book, with the exception of the mock services we’ve been creating (and don’t\
    \ use these in a production environment, please). You might use any number of\
    \ technologies to implement one, such as Ruby on Rails, Node.js, Java, or .NET.\
    \ The choice is yours.\n\nOnce you’ve defined a model class, you’ll want to be\
    \ able to load data from that class’s API endpoint. Before you can do that, your\
    \ app will need to declare an instance of the `DS.RESTAdapter` class. Let’s look\
    \ at the one we declared for the EmberNote project:\n\n```javascript\nimport DS\
    \ from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace: 'api'\n\
    });\n```\n\nThis adapter is as terse as it gets. The single function of this implementation\
    \ of `RESTAdapter` is to identify the API’s root URL. In general, an adapter is\
    \ able to be responsible for much more than this, but we’ll start with a simple\
    \ one for now and cover adapters in greater detail in *Adapt to a Nonconventional\
    \ API*.\n\nWith this adapter in place, we’re ready to begin querying the API for\
    \ records.\n\n## Querying the API\n\nWhen we first began working with Ember Data,\
    \ we used it to display a list of notebooks that the logged-on user owned. As\
    \ you can see from our definition, each notebook record belongs to one user:\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n\
    });\n```\n\nGiven that model, we used the `model` hook of the notebooks route\
    \ to load data from the API:\n\n```javascript\nimport Ember from 'ember';\n\n\
    export default Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('notebook',\
    \ {user: params.user_id});\n  },\n  actions: {\n    addNotebook: function() {\n\
    \      var notebook = this.store.createRecord('notebook', {\n        title: this.controller.get('title'),\n\
    \        user: this.controllerFor('application').get('user')\n      });\n    \
    \  notebook.save().then(() => {\n        console.log('save successful');\n   \
    \     this.controller.set('title', null);\n        this.refresh();\n      }, function()\
    \ {\n        console.log('save failed');\n      });\n    }\n  }\n});\n```\n\n\
    As you’ll recall from *Set Your Model*, the `model` hook is used to obtain the\
    \ data that will be displayed for a given route. We use the `this.store` object\
    \ to find data within the route. The `store` object is an instance of `DS.Store`,\
    \ which is the client-side data persistence store.\n\nThe `find` function typically\
    \ takes two parameters. The first is the class name for the data type that the\
    \ `find` function will return. The second is a list of parameters to query against.\
    \ If this list is blank, all records of that type should be returned by the API.\
    \ In our case, we provide the ID of the currently logged-in user, so all notebooks\
    \ returned will belong to that user. This list of parameters can contain multiple\
    \ values, and if it does, the API is expected to return all records that match\
    \ each of the criteria provided.\n\nIf you don’t know the ID of a record you want\
    \ to load, you can write queries using the contents of other fields. That’s the\
    \ query form we’re using in `route.js`, when we call `this.store.query('notebook',\
    \ {user: params.user_id})` to find the notebooks that belong to a certain user.\
    \ The user’s ID is a known piece of information about the notebook, but it doesn’t\
    \ uniquely identify the notebook. However, if you do know the record’s ID, like\
    \ in our edit-note example from the previous chapter, then there’s another form\
    \ of the `find` function you can use:\n\n```javascript\nmodel: function(params)\
    \ {\n  return this.store.findRecord(\"note\", params.id);\n}\n```\n\nThe biggest\
    \ difference is that in this form, we’re not defining which field to search. Ember\
    \ Data assumes that we’re searching the `id` field of the given record. If you\
    \ want to load all records, you simply call `findAll` with no parameters, like\
    \ this:\n\n```javascript\nthis.store.findAll(\"note\");\n```\n\nThe different\
    \ forms of querying your API result in slightly different HTTP requests to your\
    \ back end. The query form creates a GET request to your API that uses URL query\
    \ parameters to communicate the query to the back end. For example, `this.store.query(\"\
    notebook\", { user: 1})` will result in this request: `GET \"/api/notebooks?user=1\"\
    `. The id-based form also creates a GET request. For example, `this.store.findRecord(\"\
    note\", 1)` results in `GET \"api/note/1\"`.\n\nThese URLs are the default URLs\
    \ generated by Ember Data. However, if your server API doesn’t match what Ember\
    \ Data generates, you don’t need to change your server. In *Allow the Adapter\
    \ to Query a Nonconventional API*, we’ll see how to use Ember Data to alter the\
    \ URLs it queries against to match an existing API. This is one of the many ways\
    \ Ember Data makes it easy to consume a RESTful API. Another is browser-based\
    \ caching, which we’ll look at now.\n\n## Using the Store\n\nIf all the `DS.Store`\
    \ object did was to proxy access to a RESTful API, it would still be useful. But\
    \ it also provides a browser-based cache of the data loaded since your user’s\
    \ session began. Once a record is loaded by a user via the `find` methods described\
    \ in the previous section, that record resides in the cache, providing faster\
    \ access to it.\n\nWe’ve worked with the `store` variable already to find records,\
    \ but we haven’t really discussed what it is. The store is your primary resource\
    \ for interacting with RESTful APIs. In addition to providing the `find` methods,\
    \ it caches the data returned by those methods and provides methods for working\
    \ with the cached data. It also provides methods for modifying records, as we’ll\
    \ see later in this chapter. An instance of `DS.Store`, as represented by the\
    \ `store` variable, is available in every instance of `Ember.Route`.\n\nEmber\
    \ Data provides a variety of methods for working with data once it has been loaded\
    \ into the store. To begin with, if you want to get all records of a certain type\
    \ that are already in the store, it provides the `peekAll` method:\n\n```javascript\n\
    var allNotes = this.store.peekAll(\"note\");\n```\n\nThis method returns an array\
    \ of all note records that are currently in the store. Whenever you call a query\
    \ method of any of the varieties described earlier, the results are loaded into\
    \ the store and available throughout the app.\n"
  raw: 'As with many notions in the programming world, there’s some debate over what
    constitutes a RESTful API. (Often this takes the form of “Your API isn’t RESTful!”
    “No, YOUR API isn’t RESTful!”) Leaving all of that aside, let’s talk about how
    RESTful APIs are meant to be used with Ember Data.


    Generally speaking, a RESTful service is a means of using a uniform resource identifier
    to access data and execute functions. RESTful services often, but not always,
    use HTTP as a transport protocol. Each unique URI and verb combination defines
    an action and the related record (or set of records) to use when applying that
    action. For example, if you want to get the note record with id 24, you can make
    a GET request of /note/24 and expect to get the current state of the record, if
    it exists.


    The implementation of a RESTful API is beyond the scope of this book, with the
    exception of the mock services we’ve been creating (and don’t use these in a production
    environment, please). You might use any number of technologies to implement one,
    such as Ruby on Rails, Node.js, Java, or .NET. The choice is yours.


    Once you’ve defined a model class, you’ll want to be able to load data from that
    class’s API endpoint. Before you can do that, your app will need to declare an
    instance of the DS.RESTAdapter class. Let’s look at the one we declared for the
    EmberNote project:


    | [ch5/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/adapters/application.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.RESTAdapter.extend({ |


    | ​  | namespace: ​*''api''*​ |


    | ​  | }); |


    This adapter is as terse as it gets. The single function of this implementation
    of RESTAdapter is to identify the API’s root URL. In general, an adapter is able
    to be responsible for much more than this, but we’ll start with a simple one for
    now and cover adapters in greater detail in [​*Adapt to a Nonconventional API*​](#f_0041.html_adapters).


    With this adapter in place, we’re ready to begin querying the API for records.


    ### Querying the API


    When we first began working with Ember Data, we used it to display a list of notebooks
    that the logged-on user owned. As you can see from our definition, each notebook
    record belongs to one user:


    | [ch5/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | title: DS.attr(​*''string''*​), |


    | ​  | user: DS.belongsTo(​*''user''*​), |


    | ​  | notes: DS.hasMany(​*''note''*​) |


    | ​  | }); |


    Given that model, we used the model hook of the notebooks route to load data from
    the API:


    | [ch5/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.query(​*''notebook''*​,{user: params.user_id});
    |


    | ​  | }, |


    | ​  | actions: { |


    | ​  | addNotebook: ​**function**​() { |


    | ​  | ​**var**​ notebook = this.store.createRecord(​*''notebook''*​, { |


    | ​  | title: this.controller.get(​*''title''*​), |


    | ​  | user: this.controllerFor(​*''application''*​).get(​*''user''*​) |


    | ​  | }); |


    | ​  | notebook.save().then(() => { |


    | ​  | console.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''title''*​,null); |


    | ​  | this.refresh(); |


    | ​  | }, ​**function**​() { |


    | ​  | console.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | } |


    | ​  | } |


    | ​  |  |


    | ​  | }); |


    As you’ll recall from [​*Set Your Model*​](#f_0018.html_setting-your-model), the
    model hook is used to obtain the data that will be displayed for a given route.
    We use the this.store object to find data within the route. The store object is
    an instance of DS.Store, which is the client-side data persistence store.


    The find function typically takes two parameters. The first is the class name
    for the data type that the find function will return. The second is a list of
    parameters to query against. If this list is blank, all records of that type should
    be returned by the API. In our case, we provide the ID of the currently logged-in
    user, so all notebooks returned will belong to that user. This list of parameters
    can contain multiple values, and if it does, the API is expected to return all
    records that match each of the criteria provided.


    If you don’t know the ID of a record you want to load, you can write queries using
    the contents of other fields. That’s the query form we’re using in route.js, when
    we call this.store.query(’notebook’,{user: params.user_id}) to find the notebooks
    that belong to a certain user. The user’s ID is a known piece of information about
    the notebook, but it doesn’t uniquely identify the notebook. However, if you do
    know the record’s ID, like in our edit-note example from the previous chapter,
    then there’s another form of the find function you can use:


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.findRecord(​*"note"*​,params.id); |


    | ​  | } |


    The biggest difference is that in this form, we’re not defining which field to
    search. Ember Data assumes that we’re searching the id field of the given record.
    If you want to load all records, you simply call findAll with no parameters, like
    this:


    | ​  | this.store.findAll(​*"note"*​); |


    The different forms of querying your API result in slightly different HTTP requests
    to your back end. The query form creates a GET request to your API that uses URL
    query parameters to communicate the query to the back end. For example, this.store.query("notebook",
    { user: 1}) will result in this request: GET "/api/notebooks?user=1". The id-based
    form also creates a GET request. For example, this.store.findRecord("note",1)
    results in GET "api/note/1".


    These URLs are the default URLs generated by Ember Data. However, if your server
    API doesn’t match what Ember Data generates, you don’t need to change your server.
    In [​*Allow the Adapter to Query a Nonconventional API*​](#f_0043.html_endpoint-adapter),
    we’ll see how to use Ember Data to alter the URLs it queries against to match
    an existing API. This is one of the many ways Ember Data makes it easy to consume
    a RESTful API. Another is browser-based caching, which we’ll look at now.


    ### Using the Store


    If all the DS.Store object did was to proxy access to a RESTful API, it would
    still be useful. But it also provides a browser-based cache of the data loaded
    since your user’s session began. Once a record is loaded by a user via the find
    methods described in the previous section, that record resides in the cache, providing
    faster access to it.


    We’ve worked with the store variable already to find records, but we haven’t really
    discussed what it is. The store is your primary resource for interacting with
    RESTful APIs. In addition to providing the find methods, it caches the data returned
    by those methods and provides methods for working with the cached data. It also
    provides methods for modifying records, as we’ll see later in this chapter. An
    instance of DS.Store, as represented by the store variable, is available in every
    instance of Ember.Route.


    Ember Data provides a variety of methods for working with data once it has been
    loaded into the store. To begin with, if you want to get all records of a certain
    type that are already in the store, it provides the peekAll method:


    | ​  | ​**var**​ allNotes = this.store.peekAll(​*"note"*​); |


    This method returns an array of all note records that are currently in the store.
    Whenever you call a query method of any of the varieties described earlier, the
    results are loaded into the store and available throughout the app.'
