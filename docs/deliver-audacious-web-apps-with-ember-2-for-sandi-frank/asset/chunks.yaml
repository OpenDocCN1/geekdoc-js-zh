    \ options for extending this core and for using the framework itself to link classes\
    \ together to help increase the utility of the classes you create. In the next\
    \ chapter, we’ll extend Ember by making commonly needed utilities available throughout\
    \ your app.\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# Chapter 7\n\nReusing\
    \ Code in Ember\n\nWe’ve spent a good deal of time learning the core features\
    \ of Ember. We’ve seen how to build web apps using these core features, and how\
    \ to do so quickly, by relying on Ember’s opinionated structure.\n\nThat structure\
    \ does more than provide you with a means of building the core of your app. It\
    \ also provides several ways of sharing code between different aspects of your\
    \ system. It offers the ability to bootstrap your app by preparing any necessary\
    \ objects. And it provides the ability to translate a data value from one context\
    \ to another, such as a currency translation.\n\nIn this chapter, we’ll look at\
