    | ​  | {{#each model as &#124;list&#124;}} |


    | ​  | ​**<li>**​{{#link-to route list.id}}{{list.title}}{{/link-to}}</li> |


    | ​  | {{/each}} |


    | ​  | </ul> |


    | ​  | ​**</div>**​ |


    | ​  | {{yield}} |


    Much of this code is boilerplate Bootstrap for creating a drop-down. The {{dropdownName}}
    expression is used to pass a value to the component, which will be used as the
    default display value for the drop-down. The {{each}} expression loops along the
    passed-in model of items to display. Each item becomes a single line in the drop-down.


    Each line in the drop-down consists of the {{link-to}} expression. We rely on
    three pieces of data in building these expressions. First, we pass in the name
    of the destination route so we know where to go when we pick a notebook. Then,
    we use the id value of the current record in the list as the parameter value to
    pass to the destination route, and the title of the record to use as the display
    value in the drop-down. We’ll see how to use this from our app shortly.


    Let’s take a quick look now at the class created in our app directory.


    | [ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js)
    |


    | ​  | ​**export**​ { ​**default**​ } from ​*''ember-bs-dropdown/components/bs-dropdown/component''*​;
    |


    That’s right—it’s a single line of code. It’s not the clearest code, but what
    it does is helpful. This single line of code creates an extensible version of
    the addon’s component class, and makes that version a part of your app’s namespace.
    Your app doesn’t get a copy of the file, but you can extend this class in your
    app to add your own functionality onto the component, such as providing default
    values for a component’s variables.


    That’s all the code we need to develop the addon. We’ll need to do a few more
    things to make it usable. First, we need to tell Ember CLI to use the HTMLBars
    compiler when it builds the addon for use elsewhere. Run the following from the
    project root, which installs ember-cli-htmlbars as a dependency of the project:


    | ​  | $ npm install ember-cli-htmlbars --save |


    We also need to make sure that the addon is built with a copy of the Bootstrap
    files it needs. We’re not going to use the ember-cli-build.js file to do this,
    however. Each app has only one ember-cli-build.js, so even if we added the Bootstrap
    assets to the addon’s ember-cli-build.js, when the app includes our addon it will
    ignore the addon’s ember-cli-build.js and use its own. Instead, we add these assets
    in the addon’s entry point, index.js:


    | [ch9/ember-bs-dropdown/index.js](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/index.js)
    |


    | ​  | ​*/* jshint node: true */*​ |


    | ​  | ​*''use strict''*​; |


    | ​  |  |


    | ​  | module.exports = { |


    | ​  | name: ​*''ember-bs-dropdown''*​, |


    | ​  |  |


    | ​  | included: ​**function**​(app) { |


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/css/bootstrap.css''*​);
    |


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/css/bootstrap.css.map''*​,{
    |


    | ​  | destDir: ​*''assets''*​ |


    | ​  | }); |


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/js/bootstrap.min.js''*​);
    |


    | ​  | } |


    | ​  | }; |


    The entry point is a npm concept. An entry point is code that your package, in
    this case your Ember addon, includes in another resource. The entry point code
    will be run when the containing resource is first run in a browser. As you can
    see, we are doing much the same work with this entry point as we do in the app’s
    ember-cli-build.js, except that we also include some Bootstrap JavaScript to allow
    our new drop-down to work properly. When the calling app includes this addon,
    the included function will execute, and the Bootstrap assets will become part
    of the calling app.


    Now that we’ve seen how to create a basic addon, let’s learn how we can use it
    in a local application to test it out.


    ### Using the Addon'
  toc: []
  trans: "\n\n当你创建一个插件时，你并不是在创建一个属于现有应用的类。实际上，你是在创建一个全新的代码库。因此，自第 1 章以来，我们将首次离开 `ember-note`\
    \ 目录树，为这个插件创建一个新的目录结构。首先，导航到 `ember-note` 目录的父目录。然后，以管理员权限运行以下命令，该命令将创建一个新目录：\n\
    \n```\n$ ember addon ember-bs-dropdown\n```\n\n就像创建 EmberNote 时一样，这个命令会为你的插件创建完整的目录结构。我们将在开发插件的过程中介绍这个结构中最重要的部分。\n\
    \n因为我们要创建一个 Bootstrap 风格的下拉菜单，所以我们的插件需要 Bootstrap 样式表。切换到新创建的插件目录并安装 Bootstrap。\n\
    \n```\n$ cd ember-bs-dropdown\n$ bower install bootstrap --save\n```\n\n由于我们之前安装过\
    \ Bootstrap，`bower install` 命令会检查本地缓存中的 Bootstrap。很可能它会在缓存中找到 Bootstrap，但我们仍然需要运行这个命令，因为它还会将\
    \ Bootstrap 作为依赖项添加到插件中。`bower install` 命令通过编辑插件的 `bower.json` 文件来包含 Bootstrap\
    \ 来实现这一点。\n\n现在你的项目有了 Bootstrap，我们可以生成组件了。运行以下命令：\n\n```\n$ ember generate component\
    \ bs-dropdown --pod\n```\n\n这些你应该都很熟悉。到目前为止，创建插件和应用之间最大的区别只是初始命令：应用使用 `ember new`，插件使用\
    \ `ember addon`。\n\n如果你查看插件的目录结构，也会觉得很熟悉，但有一个例外：顶层有一个 `addon` 目录，与 `app` 目录同级。\n\
    \n一开始这可能会让人困惑，但这是有充分理由的。当你将一个插件包含到 Ember 应用中时，插件代码会被放置在你的应用的 `node_modules` 目录中。然而，和其他任何东西一样，你可能想要扩展插件模块。`app`\
    \ 目录中的文件会成为应用命名空间的一部分，并且可以被你的应用扩展，如下图所示。\n\n![images/addon-app.png](img/addon-app.png)\n\
    \n之前我们运行命令 `ember generate component bs-dropdown --pod` 时，它生成了三个文件。其中两个是标准组件生成的\
    \ `component.js` 和 `template.hbs` 文件。让我们看看这些文件。\n\n首先，生成的组件如下所示：\n\n[`ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js)\n\
    \n```\nimport Ember from 'ember';\nimport layout from './template';\n\nexport\
    \ default Ember.Component.extend({\n  layout: layout\n});\n```\n\n我们不需要对生成的代码做任何修改，因为我们不会构建一个非常复杂的组件。我们的目标只是构建一个可以用来导航到笔记路由的下拉菜单。所以这些就足够了。前面的类只是实例化了一个组件。我们的模板稍微详细一些：\n\
    \n[`ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs)\n\
    \n```\n<div class=\"dropdown\">\n<button class=\"btn btn-default dropdown-toggle\"\
    \ type=\"button\"\nid=\"dropdownMenu1\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\"\naria-expanded=\"true\">\n{{dropdownName}}\n<span class=\"caret\"></span>\n\
    </button>\n<ul class=\"dropdown-menu\" aria-labelledby=\"dropdownMenu1\">\n{{#each\
    \ model as |list|}}\n<li>{{#link-to route list.id}}{{list.title}}{{/link-to}}</li>\n\
    {{/each}}\n</ul>\n</div>\n{{yield}}\n```\n\n这些代码大部分是创建下拉菜单的 Bootstrap 样板代码。`{{dropdownName}}`\
    \ 表达式用于向组件传递一个值，该值将作为下拉菜单的默认显示值。`{{each}}` 表达式遍历传入的模型项列表进行显示。每个项成为下拉菜单中的一行。\n\n\
    下拉菜单中的每一行都由 `{{link-to}}` 表达式组成。在构建这些表达式时，我们依赖三个数据片段。首先，我们传入目标路由的名称，这样当我们选择一个笔记本时就知道要去哪里。然后，我们使用列表中当前记录的\
    \ `id` 值作为传递给目标路由的参数值，并使用记录的 `title` 作为下拉菜单中的显示值。稍后我们将看到如何在应用中使用它。\n\n现在让我们快速看一下在应用目录中创建的类。\n\
    \n[`ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js)\n\
    \n```\nexport { default } from 'ember-bs-dropdown/components/bs-dropdown/component';\n\
    ```\n\n没错——它只有一行代码。这行代码并不是最清晰的，但它所做的是有用的。这一行代码创建了插件组件类的可扩展版本，并使该版本成为应用命名空间的一部分。你的应用不会得到该文件的副本，但你可以在应用中扩展这个类，为组件添加自己的功能，例如为组件的变量提供默认值。\n\
    \n这就是开发插件所需的全部代码。我们还需要做一些事情来让它可用。首先，我们需要告诉 Ember CLI 在构建插件以供其他地方使用时使用 HTMLBars\
    \ 编译器。从项目根目录运行以下命令，该命令将 `ember-cli-htmlbars` 安装为项目的依赖项：\n\n```\n$ npm install\
    \ ember-cli-htmlbars --save\n```\n\n我们还需要确保插件构建时包含所需的 Bootstrap 文件副本。然而，我们不会使用\
    \ `ember-cli-build.js` 文件来完成这个任务。每个应用只有一个 `ember-cli-build.js`，所以即使我们将 Bootstrap\
    \ 资源添加到插件的 `ember-cli-build.js` 中，当应用包含我们的插件时，它会忽略插件的 `ember-cli-build.js` 并使用自己的。相反，我们将这些资源添加到插件的入口点\
    \ `index.js` 中：\n\n[`ch9/ember-bs-dropdown/index.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/index.js)\n\
    \n```\n/* jshint node: true */\n'use strict';\n\nmodule.exports = {\n  name: 'ember-bs-dropdown',\n\
    \n  included: function(app) {\n    app.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
    \    app.import('bower_components/bootstrap/dist/css/bootstrap.css.map',{\n  \
    \    destDir: 'assets'\n    });\n    app.import('bower_components/bootstrap/dist/js/bootstrap.min.js');\n\
    \  }\n};\n```\n\n入口点是 npm 的一个概念。入口点是你的包（在本例中是你的 Ember 插件）包含在另一个资源中的代码。当包含该资源的应用首次在浏览器中运行时，入口点代码将被执行。如你所见，我们在这个入口点中做了与应用中的\
    \ `ember-cli-build.js` 类似的工作，只不过我们还包含了一些 Bootstrap JavaScript，以使我们的新下拉菜单正常工作。当调用应用包含这个插件时，`included`\
    \ 函数将执行，Bootstrap 资源将成为调用应用的一部分。\n\n现在我们已经了解了如何创建一个基本的插件，接下来让我们学习如何在本地应用中使用它来进行测试。\n\
    \n### 使用插件\n\n"
- fmt: "\nThe addon is now ready to be used in the EmberNote app. First, we need to\
    \ make the addon visible to EmberNote. While using your local environment for\
    \ both the `ember-bs-dropdown` addon and the EmberNote app, you can use a set\
    \ of npm commands to make the addon package available locally. We’ll see how to\
    \ publish addons to npm or a private repository in [*Publishing Your Addon*](#f_0062.html_publishing-addons).\n\
    \nTo make your local npm cache aware of the addon, run the following command from\
    \ the `ember-bs-dropdown` directory:\n\n```\n$ npm link\n```\n\nThis command creates\
    \ a symbolic link from the local npm cache to your addon project. This link allows\
    \ other projects on your local machine to use your addon, with one additional\
    \ step. Your local app needs to also create a link to the Ember addon. So, from\
    \ the `ember-note` directory, run the following command:\n\n```\n$ npm link ember-bs-dropdown\n\
    ```\n\nThe EmberNote app is now able to locate the addon we’ve created. However,\
    \ while we’ve given the app a path to see the addon, it’s still not aware of it.\
    \ If you have a running instance of `ember serve`, stop it now. Then, add the\
    \ following line to the very bottom of the `devDependencies` section of the EmberNote\
    \ `package.json` file, which is in the root directory (be sure to add a comma\
    \ to the end of the preceding line):\n\n```\n\"ember-bs-dropdown\": \"*\"\n```\n\
    \nNow, when we next run `ember serve`, the app will see the drop-down component.\
    \ Don’t try it just yet; we have one more change to make to the EmberNote app\
    \ first. Open the notebooks template and modify it to look like the following:\n\
    \n[ch9/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/app/notebooks/template.hbs)\n\
    \n```\n<div>\n<div class=\"col-md-3\">\n<div>Notebooks</div>\n<div>\ntitle: {{input\
    \ value=title}}\n<button {{action 'addNotebook'}}>Add</button>\n</div>\n{{bs-dropdown\
    \ model=model route='notebooks.notes'\ndropdownName='Notebooks'}}\n</div>\n<div\
    \ class=\"col-md-9\">\n{{outlet}}\n</div>\n</div>\n```\n\nWe’ve switched out a\
    \ great deal of code for our new addon component. We use the `{{bs-dropdown}}`\
    \ expression to refer to our custom component. The `model=model` portion of the\
    \ expression passes the notebooks model into the component. Because this model\
    \ class contains the right properties, namely the `id` and `title` properties,\
    \ it should work just fine. We pass the `notebooks.notes` route name as the destination\
    \ route for the drop-down, and “Notebooks” as the default drop-down value.\n\n\
    Before this will work, we need to make one last change to the app. We need to\
    \ remove the Bootstrap assets from our `ember-cli-build.js`. If we leave them\
    \ in, the `ember serve` command complains that we’ve defined them twice. Because\
    \ we’re now relying on a Bootstrap-derived addon for our components, we’ll let\
    \ it define the version we use. Change the `ember-cli-build.js` file to look like\
    \ this:\n\n[ch9/ember-note/ember-cli-build.js](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/ember-cli-build.js)\n\
    \n```\n/* global require, module */\nvar EmberApp = require('ember-cli/lib/broccoli/ember-app');\n\
    \nmodule.exports = function(defaults) {\n  var app = new EmberApp(defaults, {\n\
    \    // Add options here\n  });\n\n  // Use `app.import` to add additional libraries\
    \ to the generated\n  // output files.\n  //\n  // If you need to use different\
    \ assets in different\n  // environments, specify an object as the first parameter.\
    \ That\n  // object's keys should be the environment name and the values\n  //\
    \ should be the asset to use in that environment.\n  //\n  // If the library that\
    \ you are including contains AMD or ES6\n  // modules that you would like to import\
    \ into your application\n  // please specify an object with the list of modules\
    \ as keys\n  // along with the exports of each module as its value.\n\n  return\
    \ app.toTree();\n};\n```\n\nThis file now looks just like it did when we started\
    \ the book. From a command line, run `ember serve` and you should see that our\
    \ drop-down is in use. You can use it to choose the notebook you wish to review,\
    \ and the related notes will be loaded into the notes route.\n\nEmber CLI offers\
    \ a number of other ways to test your addon. It provides a dummy app within the\
    \ addon project (under `tests/dummy`), as well as the ability to write test cases\
    \ with `QUnit`. I chose to focus on using the EmberNote app for testing, but when\
    \ you’re building a real addon, you’ll want to rely on those as well.\n\nNow that\
    \ you have an addon ready to share, how do you get it out into the world? The\
    \ last stop on our journey is one where we’ll learn to give back to others who\
    \ have helped pave the path for us. Let’s learn how to publish an addon and share\
    \ it with the world.\n\n### Publishing Your Addon\n\nSo you’ve made something\
    \ cool, and you’re very proud of it. So proud that you think others might benefit\
    \ from using it as well, either within your company or out in the world at large.\
    \ Let’s learn now how to share our addon code with the world.\n\n#### Publishing\
    \ Privately\n\nSometimes you make something cool, but it’s proprietary. For whatever\
    \ reason, you can’t totally open-source your addon. But you also want to make\
    \ sure that multiple apps can benefit. Luckily, you can publish an addon to a\
    \ private repository.\n\nEmber CLI supports the use of privately published addons\
    \ with a single command. Just store your addon code in a Git repository, and you\
    \ can simply run the `ember install` command using the repository’s URL as the\
    \ addon name. Your addon will be installed into your project, and you can continue\
    \ to use it just as if it were published publicly.\n\n#### Publishing to npm\n\
    \nOf course, the fame, glory, and riches of publishing a hit open source Ember\
    \ addon might be too enticing to pass up. If that’s the case, you can publish\
    \ your addon to npm.\n\nWhen you created your addon, Ember CLI created a `package.json`\
    \ file. Contained within that file are the two attributes required to publish\
    \ your package: `name` and `version`. That’s all you need.\n\nBefore you can publish\
    \ it, you need to be registered with npm. If you haven’t already done so, run\
    \ `npm adduser` to add a user to the [https://npmjs.com](https://npmjs.com) site.\
    \ Once you’ve logged in as this user, you can then run `npm publish` to publish\
    \ your new addon, and it will be publicly available via the npm site.\n\nWhen\
    \ you’re ready to release a new version, you can bump the version number using\
    \ `npm version`, and provide an `update_type` of either `patch`, `minor`, or `major`,\
    \ depending on the nature of your change.\n\nOnce your addon package is published,\
    \ other developers can access it via the `ember install` command, just like they\
    \ would any other addon. And you can be happy that you’ve given a little something\
    \ back to the community.\n\n## Next Steps\n\nWe’ve come to the end of our road\
    \ together, and there’s still plenty to be learned. Before we part ways, here\
    \ are a few suggestions on what you can do next to continue working with Ember\
    \ and supporting the community.\n\nThere are many ways to support the Ember community,\
    \ including contributing to the core framework or writing online about your use\
    \ of Ember. These are strongly encouraged. However, the ability to share code\
    \ that others might find useful via Ember addons is another great way to give\
    \ back.\n"
