    # 第 3 章


    布局用户界面


    在扎实理解如何使用路由组织应用程序之后，让我们来谈谈它们的兄弟：模板。在 Ember 中，正如你所期望的，模板包含了你用户界面代码的一部分。它由 HTML、CSS
    和 Handlebars 表达式组成。


    在本章中，你将学习 Ember 的架构如何支持模板的使用。你还将学习更多关于如何创建模板、通过路由结构将它们相互关联，以及使用 Handlebars 表达式语言与
    Ember 对象交互的知识。此外，你将学习如何使用 Ember 框架中已有的各种表达式来为你的用户界面添加控制和显示逻辑。


    让我们直接进入你为每个应用创建的第一个模板：恰如其名的 application 模板。


    ## 用单页创建你的应用


    你使用 Ember 创建的这类应用被称为单页应用，因为应用的编写方式使得所有内容都通过一个 HTML 页面渲染，对该页面的更改通过 DOM 操作和 Ajax
    完成。


    在 Ember 中，当使用 Ember CLI 时，该页面被称为 `index.html`。我们在第 1 章中看过它，但让我们再次查看 EmberNote
    的 `index.html`：


    `[ch3/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/index.html)`


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>EmberNote</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    {{content-for ''head''}}


    <link rel="stylesheet" href="assets/vendor.css">

    <link rel="stylesheet" href="assets/ember-note.css">


    {{content-for ''head-footer''}}

    </head>

    <body>

    {{content-for ''body''}}


    <script src="assets/vendor.js"></script>

    <script src="assets/ember-note.js"></script>


    {{content-for ''body-footer''}}

    </body>

    </html>

    ```


    这个文件由 Ember CLI 构建，除了我们对标题的修改外，它完全就是 Ember CLI 在创建新应用时生成的内容。你可能注意到这个文件中没有对任何模板的引用。`{{content-for}}`
    钩子是为 Ember CLI 插件准备的，但我们并没有使用它们。那么，我们的应用是如何开始渲染的呢？


    关键在于 `ember-note.js` 文件。这个文件由 Ember CLI 构建过程生成，包含了你到目前为止编写的每一行代码，以及许多你尚未编写的代码。如果你好奇，可以查看这个文件。你需要知道的是，为了渲染你的用户界面，这个文件包含了根据你创建的模板和其他所有支持类动态创建
    DOM 结构的逻辑。然后它将这个结构插入到页面中，你的用户界面就呈现给了用户。


    位于模板层级根部的第一个模板是 application 模板。它位于 `application.hbs` 中，如下所示：


    `[ch3/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/templates/application.hbs)`


    ```html

    <div class="container">

    <div class="row">

    <div class="col-md-2">

    Welcome to EmberNote

    </div>

    <div class="col-md-10">

    {{#if user}}

    Hello, {{user.name}}

    {{/if}}

    {{#unless user}}

    {{#link-to ''register''}}register{{/link-to}}&nbsp;

    {{#link-to ''login''}}login{{/link-to}}

    {{/unless}}

    </div>

    </div>

    <div class="row">

    <div>

    {{outlet}}

    </div>

    </div>

    </div>

    ```


    我们在第 1 章中已经花了不少时间在这个文件上，但让我们看看模板特性。这个文件是 HTML 和一种称为 Handlebars 的表达式语言的混合体。我们将在本章中深入探讨你在该模板中看到的各种表达式。这个模板的特殊之处在于它位于模板层级的根部。因此，它是整个应用的起点。在我们的例子中，任何我们决定渲染的子模板都将被渲染到主要的
    `{{outlet}}` 容器中。


    ![images/aside-icons/info.png](img/info.png) Handlebars 是 Ember 的一部分，你会经常使用它，尽管它集成得如此深入以至于你可能没有意识到。Ember
    使用 Handlebars 的 HTMLBars 变体，通过一个名为 `ember-cli-htmlbars` 的插件提供给应用。每当你使用本章将要讨论的组件之一时，你都在依赖
    Handlebars。实际上，Handlebars 有两层含义。首先，它是一个用 JavaScript 编写、基于 Mustache 的模板框架。其次，它是一种表达式语言，正如模板框架中所规定的那样。你只需通过使用
    Handlebars 就能学到大部分你需要知道的内容，但如果你好奇心强，可以访问 [`handlebarsjs.com`](http://handlebarsjs.com)
    和 [`github.com/tildeio/htmlbars`](https://github.com/tildeio/htmlbars) 了解更多。


    正如我们在第 2 章中看到的，EmberNote 的路由层级在 application 路由之下有三个路由：register、login 和 notebooks。这些路由中的任何一个都可以被渲染到
    `{{outlet}}` 中。没有什么能阻止你尝试渲染层级更深的路由，但如果没有将预期的支持数据加载到路由的模型中，它可能无法正常工作。


    我们的布局相当简单，因此有一些选项我们没有使用。如果你考虑一个更复杂的例子，很可能在 application 模板上有多个出口。例如，你可能有一个用于左侧菜单的出口、一个用于顶部菜单的出口、一个用于页面主要部分的出口，等等。在这种情况下，你会使用命名出口，并采用
    *将模板渲染到命名出口* 中的技术将路由渲染到这些出口中。


    现在让我们更仔细地看看如何创建和定义模板，然后我们将看到一些可以使用 Handlebars 添加的控件。


    ## 将你的 UI 分割成模板


