    # Chapter 9


    Building and Using Ember Addons


    Throughout the book we’ve seen a number of examples of Ember addons. An addon
    is a modular piece of code to be used within an Ember application. Addons can
    make your job easier, and the community spirit around creating and sharing Ember
    addons is one of the most enticing reasons to use Ember.


    In this chapter, we take a closer look at the life cycle of an addon. First, you’ll
    learn how to install an addon, which we’ve touched on already in [​*Nesting Components*​](#f_0032.html_nesting-components),
    but will cover in a bit more detail here. Next, we’ll talk about how to develop
    your own addon, and then make it available to other Ember developers so that you
    can share something cool that you’ve made. There’s nothing more satisfying than
    giving back to the community (unless it’s bragging rights from making something
    that’s widely used).


    To begin, let’s review how to get an addon installed into our app.


    ## Install an Ember Addon


    Ember addons aren’t technically a feature of Ember, but rather a feature of Ember
    CLI. This distinction is important because if you decide to use Ember without
    Ember CLI, this chapter will not apply. If you want addons, you need Ember CLI.


    This becomes apparent when you look at how to obtain an Ember addon. We’ve already
    done this once in [​*Nesting Components*​](#f_0032.html_nesting-components), when
    we pulled in the ember-cli-showdown addon to format our text using Markdown. In
    order to get that addon, we ran the following command from the ember-note root:


    | ​  | $ ember install ember-cli-showdown |


    When you run this command, Ember CLI searches the npm database for the requested
    addon and installs it into your project in the node_modules directory. You can
    then use the addon just as you would any other code that is part of your application.
    The addon’s documentation, generally contained in its README.md file, should describe
    how to use the addon in your app.


    There are a few different ways of discovering addons to use. My preference, which
    I used most in writing this book, is via Ember Observer.^([[11]](#f_0063.html_FOOTNOTE-11))
    Ember Observer provides a directory of addons stored in npm, but goes a step further
    by scoring these addons to rank the health and maturity of the addon. These metrics
    tell you whether the addon is open source; the quality of the code, tests, and
    documentation; the quality of the addon’s continuous integration practices; whether
    the addon is actively maintained; and the popularity of the addon on GitHub. Once
    you’ve found the addon you want to use, the README.md file usually tells you how
    to use the project.


    There’s a lot of productivity to be gained from using addons, but sometimes you
    have a great idea that you want to share with others. For that, you may want to
    develop your own addon. Developing an addon and learning how to release it to
    the community is the last step on our journey.


    ## Develop Your Own Addon


    If you work with Ember and Ember CLI long enough, you’ll find that you want to
    share code between apps, whether pointing multiple apps at an addon in a private
    Git repository, or publishing your addon publicly via npm. We’ve already seen
    how to obtain and use a third-party addon within your app. Now, let’s talk about
    how to create an addon to be shared between your applications, or even to be used
    by others.


    A natural use of Ember addons is to create a reusable web component library. Many
    such libraries exist that contain reusable web controls, like buttons or menu
    bars; we’ve even discussed a few in this book. Let’s start a small one right now
    with a single control: a Bootstrap-styled drop-down list, which we’ll use to replace
    the notebook list in the EmberNote app with a drop-down of notebook records. This
    drop-down will change to the chosen notebook when the user picks an entry in the
    list.


    We’ll start by creating the basic structure for our addon using Ember CLI.


    ### Creating the Addon'
