  trans: "\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`。\n\
    \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
    \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\
    \n```js\n// ch4/ember-note/app/components/edit-note/component.js\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Component.extend({\n  actions: {\n   \
    \ saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\n如你所见，在组件中定义动作的方式与在路由中定义动作的方式没有太大区别。`actions`\
    \ 哈希用于将函数映射到这些函数的名称，就像在路由中一样。\n\n动作函数的实现可以访问任何已传递给组件或在类级别注入到组件中的属性。我们还没有介绍注入，这里也没有使用它。目前，你只需要知道，通过在某些应用级上下文中使用注入，可以访问框架各个部分中的某些公共对象。\n\
    \n在本例中，`saveNote` 函数仅负责保存笔记记录。它依赖于笔记记录自带保存逻辑这一事实，并调用该函数。\n\n在模板中，以下代码行将 `saveNote`\
    \ 动作链接到保存按钮：\n\n```js\n// ch4/ember-note/app/components/edit-note/template.hbs\n\
    <button {{action \"saveNote\"}}>save</button>\n```\n\n与普通的模板/路由配对一样，点击此按钮会执行 `saveNote`\
    \ 动作。\n\n组件作用域内的动作（例如 `saveNote`）的使用场景比引用的动作要有限一些。它们只能操作组件作用域内的数据（即由调用模板传入的数据）或注入的对象。如果你能接受这些限制，那么尽可能让组件的逻辑保持自包含是一个好主意。\n\
    \n然而，如果你希望将实际行为的定义交由调用路由/模板来处理，你可以使用发送动作来实现。\n\n### 发送动作\n\nEmber 组件还提供了将组件的模板链接到调用路由（或路由层次结构中更上层）中某个动作的能力。发送动作就是这种能力。我们将在\
    \ `edit-note` 中定义一个发送动作。\n\n乍一看，`closeNote` 动作与 `saveNote` 动作看起来没什么不同。然而，它不是在组件上下文中执行，而是使用\
    \ `sendAction` 方法请求包含该组件的路由来处理该动作。让我们跟随这段代码，看看它如何影响各个类和模板。\n\n首先，在 `edit-note`\
    \ 模板中，以下代码用于将动作映射到关闭按钮：\n\n```js\n// ch4/ember-note/app/components/edit-note/template.hbs\n\
    <button {{action \"closeNote\"}}>close</button>\n```\n\n这会导致在组件的动作映射中调用底层的 `closeNote`\
    \ 函数。该函数如下所示：\n\n```js\n// ch4/ember-note/app/components/edit-note/component.js\n\
    closeNote: function() {\n  this.sendAction('close');\n}\n```\n\n这就是有趣且强大的地方。`sendAction`\
    \ 方法接受一个字符串参数，但这个字符串并不是将在包含路由上调用的函数名称。它实际上是组件属性的值，该属性由包含模板设置，并指向包含路由上的函数。以下是包含模板的样子：\n\
    \n```js\n// ch4/ember-note/app/notebooks/notes/note/template.hbs\n{{edit-note\
    \ note=model close=\"close\"}}\n```\n\n在 `close=\"close\"` 赋值的左侧，我们定义了用于保存动作的组件参数名称。这与\
    \ `closeNote` 动作中传递给 `sendAction` 的字符串相匹配。在赋值的右侧，我们使用了路由中动作的名称。底层路由应如下所示：\n\n\
    ```js\n// ch4/ember-note/app/notebooks/notes/note/route.js\nimport Ember from\
    \ 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params) {\n\
    \    return this.store.findRecord('note', params.note_id);\n  },\n\n  actions:\
    \ {\n    close: function() {\n      this.transitionTo('notebooks.notes');\n  \
    \  }\n  }\n});\n```\n\n你可以看到这里定义了 `close` 动作。在本例中，它定义了一个简单的路由转换，效果是在路由层次结构中向上移动一层，并在此过程中关闭\
    \ `edit-note` 屏幕。\n\n如前所述，这是一个非常强大的结构。本质上，`sendAction` 允许你定义一个带有占位动作的组件，其确切结果可由包含路由决定。这大大增强了组件的可复用性，因为它允许组件在不同上下文中使用，同时仍能描述部分行为，而让调用上下文来填充细节。\n\
    \n`sendAction` 方法还有一个细节。如果你调用 `sendAction` 时没有传递指示属性名称的字符串参数，该方法会假定你正在寻找一个以属性名\
    \ `action` 定义的动作，并相应地进行处理。当组件可能只关联一个动作时，这可能很有用，但我更喜欢方法的命名属性形式，因为我认为它更清晰。\n\n正如我们所看到的，组件可以通过在组件内部显式定义行为，或者将动作引用到组件的调用上下文，来响应动作。根据你的需求，这两种方式都会用到。在结束组件讨论之前，让我们再看一种组件响应用户事件的方式。\n\
    \n### 监听事件\n\n使用动作来响应事件是将逻辑链接到组件的一种简单方式。也可以以事件驱动的方式执行代码。\n\n在 Ember 中，每个组件都基于\
    \ `Ember.View` 类，即使是像 `{{input}}` 这样随框架一起提供的组件也是如此。我们之前没有涉及视图，因为构建 Ember 应用并不需要了解它们。它们主要在你开发\
    \ Ember 框架本身时才重要。\n\n不过，在这里了解视图是有帮助的。由于每个组件都基于一个视图，你可以响应视图能够响应的任何事件。例如，如果你正在设计一个有状态的\
    \ `<div>` 标签，你可能希望处理 `click` 事件，并在点击发生时改变 `<div>` 的状态，如下所示：\n\n```js\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Component.extend({\n  click: function(event)\
    \ {\n    //在这里改变状态\n  }\n});\n```\n\n这为你提供了另一种在组件中响应用户输入的方式。通过依赖视图，你可以访问各种事件，这里无法一一列举。^([[8]](#f_0034.html_FOOTNOTE-8))\n\
    \n### Ember 插件：Ember CLI Materialize\n\n组件的核心思想是将应用中常用的 HTML 片段提取出来，封装成独立对象，并在整个应用中复用。当你将\
    \ CSS 样式表加入该模型时，就可以创建一套遵循标准化设计的一致用户界面元素。\n\n"
