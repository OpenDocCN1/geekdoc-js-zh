  trans: "\n在 Ember 应用中，所有功能都按路由组织。路由本质上是一个 URL 片段，如*嵌套路由*中所述。因此，下一步是使用 Ember CLI\
    \ 创建一个路由。打开一个新的命令窗口，在 `ember-note` 项目的根目录下运行以下命令：\n\n`$ ember generate route register\
    \ --pod`\n\n`--pod` 标志添加到 `generate` 命令后，会创建一个名为 `register` 的目录，其中包含添加路由所需的文件：`route.js`\
    \ 和 `template.hbs`。目前它们都是空的，你需要根据需要填充它们来创建路由的功能。一般来说，当你希望按功能组织项目（即创建一个包含 `route.js`\
    \ 和 `template.hbs` 文件的 `register` 目录），而不是按对象类型组织时，就会使用 pod。\n\n之前，当你使用 `ember\
    \ new` 命令创建应用时，生成了以下四个文件：`index.html`、`app.js`、`router.js` 和 `application.hbs`。然后\
    \ `ember generate` 命令会编辑应用目录下的 `router.js` 文件。我们将在*使用 Router 类组织应用*中深入探讨这一点，但\
    \ `router.js` 类用于实现应用内的路由层次结构。\n\n如果你运行 `ember generate` 命令但不加 `--pod` 标志，Ember\
    \ CLI 仍然会创建相同的对象，但不会在 `register` 目录中创建名为 `route.js` 的文件，而是在 `route` 目录中创建名为 `register.js`\
    \ 的文件。就我们的目的而言，最好将路由所需的每个文件放在同一个位置，因此本书将全程使用 `--pod` 标志。\n\n现在，让我们看看目前创建的各文件。\n\
    \n#### index.html\n\n该文件是应用的起点。它是在你运行 `ember new ember-note` 命令时创建的。让我们来看一下。\n\
    \n[ch1/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/index.html)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=edge\">\n<title>EmberNote</title>\n<meta name=\"\
    description\" content=\"\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n\n{{content-for 'head'}}\n\n<link rel=\"stylesheet\" href=\"\
    assets/vendor.css\">\n<link rel=\"stylesheet\" href=\"assets/ember-note.css\"\
    >\n\n{{content-for 'head-footer'}}\n</head>\n<body>\n{{content-for 'body'}}\n\n\
    <script src=\"assets/vendor.js\"></script>\n<script src=\"assets/ember-note.js\"\
    ></script>\n\n{{content-for 'body-footer'}}\n</body>\n</html>\n```\n\n`index.html`\
    \ 的大部分内容是用于创建起始页的样板 HTML。Ember CLI 添加了两个样式表 `vendor.css` 和 `ember-note.css` 来为应用设置样式。本书不会过多涉及样式表，但你应该知道\
    \ `vendor.css` 会捕获你引入应用中的任何第三方代码所使用的样式，而 `ember-note.css` 则用于你自定义的样式。\n\n`vendor.js`\
    \ 和 `ember-note.js` 也是如此。Ember CLI 构建过程会为你在应用中使用的所有第三方代码创建一个文件，名为 `vendor.js`，并为你的应用代码创建一个文件，名为\
    \ `ember-note.js`。这些文件都包含在 `index.html` 中。\n\n你可能还会注意到 `{{content-for}}` 表达式。这些表达式允许你通过\
    \ Ember CLI 插件在页面中包含额外内容。\n\n#### app.js\n\n`app.js` 文件用于创建 Ember 环境。请看以下代码：\n\
    \n[ch1/ember-note/app/app.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/app.js)\n\
    \n```javascript\nimport Ember from 'ember';\nimport Resolver from 'ember/resolver';\n\
    import loadInitializers from 'ember/load-initializers';\nimport config from './config/environment';\n\
    \nvar App;\n\nEmber.MODEL_FACTORY_INJECTIONS = true;\n\nApp = Ember.Application.extend({\n\
    \  modulePrefix: config.modulePrefix,\n  podModulePrefix: config.podModulePrefix,\n\
    \  Resolver: Resolver\n});\n\nloadInitializers(App, config.modulePrefix);\n\n\
    export default App;\n```\n\n如果你是一位资深 JavaScript 开发者但尚未接触 ECMAScript 2015，前四行可能会让你目瞪口呆。ECMAScript\
    \ 是 ECMA International 规定的 JavaScript 语言的正式名称，而 ECMAScript 2015（也称为 ECMAScript\
    \ 6 或 ES6）是该标准的最新版本。没错，这四行代码正是从其他 JavaScript 文件导入依赖项，以便在当前模块中使用它们的模块。这是使用 Ember\
    \ CLI 的一个极其重要的方面。当你开始以模块化方式编写代码时，依赖关系会变得更容易理解，并且无需将对象塞入全局作用域。它还能帮助你以合理的方式组织代码。不过，不必担心浏览器是否支持\
    \ ECMAScript 2015，Ember CLI 会将你的代码转译为浏览器可执行的格式。\n\n`app.js` 中的代码旨在设置应用级别的结构。其中之一是\
    \ Ember Resolver，用于在整个应用中查找类。`modulePrefix` 变量被设置为 `ember-note`，这与你在设置应用时定义的值一致。`podModulePrefix`\
    \ 未被设置，因为我们的项目配置（从 `config/environment.js` 读取）中尚未定义它。\n\n文件的最后一行将 `App` 类作为模块导出。如果这还不太容易理解，别担心——随着学习的深入，你会看到更多关于\
    \ Ember 模块如何工作的示例。现在，让我们看看应用设置时创建的另一个文件——`router.js`。\n\n#### router.js\n\n`router.js`\
    \ 文件是真正开始了解 Ember 工作原理的地方。Ember 最基本的功能之一就是路由的概念。简单来说，路由就是应用中的一个位置。如果你将应用视为一组相互嵌套的页面或页面片段，那么每个页面都对应一个路由。而\
    \ `Router` 类（在 `router.js` 中定义）正是你定义应用结构的地方。让我们看看代码：\n\n[ch1/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/router.js)\n\
    \n```javascript\nimport Ember from 'ember';\nimport config from './config/environment';\n\
    \nvar Router = Ember.Router.extend({\n  location: config.locationType\n});\n\n\
    Router.map(function() {\n  this.route('register');\n});\n\nexport default Router;\n\
    ```\n\n在 `router.js` 文件的顶部，你会看到必要的导入语句。在类定义中（以 `var Router = Ember.Router.extend`\
    \ 开头），我们从全局配置中引入了一些配置变量，这些变量是在我们设置应用时定义的。\n"
- fmt: "\nBut `Router.map` is where the real action happens. As you can see, we’ve\
    \ already created a route called `register`. This route was added to the `Router`\
    \ when we ran the `ember generate route register --pod` command. A number of other\
    \ files were also generated, and we’ll edit those files to create our registration\
    \ feature in a moment. The `register` route appears to be a top-level route, but\
    \ is actually at the first level of child routes beneath a default route for the\
    \ application. Let’s look at that default route by way of its associated template.\n\
    \n#### application.hbs\n\nEach application has a root route, the `Application`\
    \ route. Further, each route corresponds to exactly one template. A template is\
    \ a chunk of your user interface. In the case of the application route, this template\
    \ is defined in `application.hbs`. Let’s modify this template now to look like\
    \ the following:\n\n```\n// ch1/ember-note/app/templates/application.hbs\n<div\
    \ class=\"container\">\n<div class=\"row\">\n<div class=\"col-md-2\">\nWelcome\
    \ to EmberNote\n</div>\n<div class=\"col-md-10\">\n{{#link-to 'register'}}register{{/link-to}}\n\
    </div>\n</div>\n<div class=\"row\">\n<div>\n{{outlet}}\n</div>\n</div>\n</div>\n\
    ```\n\nEach Ember template is a mixture of HTML and the Handlebars expression\
    \ language, which is the portions of code set off with `{{ }}` characters. Handlebars\
    \ is an expression language used by Ember to describe those segments of Ember\
    \ templates that are in some way related to the Ember application code. You’ll\
    \ see many examples of Ember using Handlebars expressions throughout the book,\
    \ always using the `{{ }}` characters. Ember ships with a compiler that turns\
    \ Handlebars template expressions into DOM objects, as we’ll see in [*Compile\
    \ Templates*](#f_0027.html_precompiling).\n\nAs we saw earlier, each app consists\
    \ of a hierarchy of routes. The `{{#link-to}}` expression in the `application.hbs`\
    \ file is used to generate a hyperlink that when clicked will load the `register`\
    \ route into the `{{outlet}}`.\n\nYou may be wondering where the `Application`\
    \ route is defined. In this particular case, because we don’t have any specific\
    \ action handling or data loading to do, we don’t need to define the route class;\
    \ we can simply rely on Ember to create a route implementation on the fly using\
    \ default route behavior.\n\nAll of the code we’ve seen thus far has set up the\
    \ bare minimum of application. Now, let’s see how to add a feature to our app\
    \ by building our `register` route.\n\n### Building the Register Route\n\nAs discussed\
    \ earlier, the `register` route will allow a user to register for the EmberNote\
    \ app by choosing a username. When we created this route using the CLI, the following\
    \ file was created (note, this is `route.js`, which is different from `router.js`):\n\
    \n```\n// ch1/ember-note/app/register/route.js\nimport Ember from 'ember';\n\n\
    export default Ember.Route.extend({\n});\n```\n\nThis is how you define an empty\
    \ route class. A route has two primary reasons to exist: loading data to be displayed\
    \ by the route and responding to actions. In our case, we don’t have any data\
    \ to display, and we need to define an `addNew` action to add new users to the\
    \ app. We’ll come back to that action shortly. First, let’s see what the user\
    \ interface will look like. Here’s our route’s template file, with the necessary\
    \ UI code added in:\n\n```\n// ch1/ember-note/app/register/template.hbs\n<div\
    \ class=\"col-md-12\">\nRegister new user: {{input value=name}}\n<button {{action\
    \ 'addNew'}}>Add</button>\n</div>\n<div class=\"col-md-12\">\n{{message}}\n</div>\n\
    ```\n\nThe `{{input}}` field allows us to key in a name, which will be added to\
    \ the `name` attribute of the controller (which we’ll create in a moment). The\
    \ `{{action}}` expression, which we included in the `<button>`, binds the button’s\
    \ click action to the `addNew` action in our route. And the `{{message}}` expression\
    \ simply displays the contents of the `message` attribute in the controller. We\
    \ don’t yet have a child route for `register`, but if we did, it would be rendered\
    \ into `{{outlet}}`, similar to how the `register` route is rendered into the\
    \ `{{outlet}}` in `application.hbs`.\n\nWe’ll need some way to capture the UI\
    \ state contained in the `name` and `message` fields. To do this, we’ll rely on\
    \ the default controller. In Ember, each route maps to exactly one controller,\
    \ and that controller acts as a proxy for the underlying model, including any\
    \ UI state. Because we don’t have any data to load into our model yet, all we\
    \ really use the controller for is to provide a place to put the state of the\
    \ `name` and `message` fields from our template. In cases when you need only very\
    \ simple functionality, you can skip creating a unique controller implementation\
    \ for your route and just rely on the default implementation that Ember assigns\
    \ to your route. Now, let’s create the `addNew` action to go in our route.\n\n\
    > **Avoiding Controllers**\n> \n> ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ There’s another reason for not choosing to rely heavily on controllers. The\
    \ Ember team plans to deprecate controllers early in the 2.x release cycle, in\
    \ favor of performing similar work in the route or in components. Future versions\
    \ of this book will follow suit, and for now, we’re avoiding using controllers\
    \ as much as possible.\n\nEdit the `register` route so it looks like this:\n\n\
    ```\n// ch1/ember-note/app/register/route.js\nimport Ember from 'ember';\n\nexport\
    \ default Ember.Route.extend({\n  actions: {\n    addNew: function() {\n     \
    \ var user = this.store.createRecord('user', {\n        name : this.controller.get('name')\n\
    \      });\n      user.save().then(() => {\n        console.log('save successful');\n\
    \        this.controller.set('message','A new user with the name \"'\n       \
    \   + this.controller.get('name') + '\" was added!');\n        this.controller.set('name',null);\n\
    \      }, function() {\n        console.log('save failed');\n      });\n    }\n\
    \  }\n});\n```\n\nThe first thing we do here is to add an `actions` hash to the\
    \ route. A hash is a list of name-value pairs. In this case, the names are names\
    \ of functions, and the values are the function definitions. We have one function,\
    \ `addNew`. This function will be called when we click the button in our user\
    \ interface, because that’s how it was defined in the template.\n\nWe’re also\
    \ relying on a bit of new ES 2015 syntax here. The code `() =>`, known as a fat\
    \ arrow function, will let us continue to use `this` within the body of the `then`\
    \ function, and `this` will continue to refer to the route object. The call to\
    \ `createRecord` uses the Ember Data framework to create a new instance of a model\
    \ object, and the subsequent call to `save` saves that record to persistent storage.\
    \ Ember Data provides access to data over RESTful services. Before we test all\
    \ of this, we’ll need to set up a mock service for Ember Data to call, and a model\
    \ object to use that data. Let’s do that now.\n\n### Adding a Data Service\n"
