    \ It’s a stand-alone control that can be used in a generic Ember template. The\
    \ components you’ll define work the same way.\n\nBefore we can create our component,\
    \ we need a place for it to live. We’ll create a new route and reference our new\
    \ component from that route’s template. Because we’re editing a single note at\
    \ a time, the most sensible place for this route to live is as a child of the\
    \ `notebooks/notes` route.\n\nFrom a command prompt, run the following Ember CLI\
    \ command:\n\n```\n$ ember generate route notebooks/notes/note --pod\n```\n\n\
    This creates an empty stub for the new note route. We’ll populate this new class\
    \ in a moment. First, we need to modify the `Router` implementation and the notes\
    \ template to be able to navigate to our new route.\n\nWhen you created the new\
    \ route, Ember CLI modified the `Router` class to include this route at the appropriate\
    \ place in the hierarchy. Because we’re going to query Ember Data for a note record,\
    \ we’ll need to add a parameter to the route to pass the ID of this note to the\
    \ child route. Open `router.js` and update it to look like this:\n\n[ch4/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/router.js)\n\
    \n```\nimport Ember from 'ember';\nimport config from './config/environment';\n\
    \nvar Router = Ember.Router.extend({\n  location: config.locationType\n});\n\n\
    Router.map(function() {\n  this.route('register');\n  this.route('login');\n \
    \ this.route('notebooks', { path:'notebooks/:user_id'}, function() {\n    this.route('notes',\
    \ { path:'notes/:notebook_id'}, function(){\n      this.route('note', { path:'note/:note_id'},\
