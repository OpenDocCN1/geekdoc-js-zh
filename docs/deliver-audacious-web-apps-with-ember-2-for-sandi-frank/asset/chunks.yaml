- fmt: "\nWhen you create an addon, you’re not creating a class that’s part of an\
    \ existing app. You’re actually creating an entirely new codebase. So, for the\
    \ first time since Chapter 1, we’re going to leave the `ember-note` directory\
    \ tree and create a new directory structure for this addon. First, navigate to\
    \ the parent of your `ember-note` directory. Then, run the following command as\
    \ a user with admin privileges, which will create a new directory:\n\n```\n$ ember\
    \ addon ember-bs-dropdown\n```\n\nJust like when you created EmberNote, this command\
    \ creates the full directory structure for your addon. We’ll go over the most\
    \ important parts of this structure as we work on the addon.\n\nBecause we’re\
    \ going to create a Bootstrap-styled drop-down, our addon needs the Bootstrap\
    \ stylesheet. Change to the newly created addon directory and install Bootstrap.\n\
    \n```\n$ cd ember-bs-dropdown\n$ bower install bootstrap --save\n```\n\nBecause\
    \ we installed Bootstrap earlier, the `bower install` command checks the local\
    \ cache for Bootstrap. Most likely it will find Bootstrap in the cache, but we\
    \ still need to run this command because it also adds Bootstrap to the addon as\
    \ a dependency. The `bower install` command does this by editing the addon’s `bower.json`\
    \ file to include Bootstrap.\n\nNow that your project has Bootstrap, we’re ready\
    \ to generate our component. Run the following command:\n\n```\n$ ember generate\
    \ component bs-dropdown --pod\n```\n\nThis should all be familiar to you. So far,\
    \ the biggest difference between creating an addon and an app is just the initial\
    \ command: `ember new` for an app; `ember addon` for an addon.\n\nIf you look\
    \ at the directory structure for the addon, it’s familiar, too, with one exception:\
    \ there’s an `addon` directory at the top level, the same level as the `app` directory.\n\
    \nThis can seem confusing at first, but there’s a good reason for it. When you\
    \ include an addon in an Ember app, the addon code is placed in your app’s `node_modules`\
    \ directory. However, like with anything else, you might want to extend the addon\
    \ module. The files in the `app` directory become part of your app’s namespace,\
    \ and can be extended by your app, as shown in the following figure.\n\n![images/addon-app.png](images/addon-app.png)\n\
    \nPreviously when we ran the command `ember generate component bs-dropdown --pod`,\
    \ it generated three files. Two of these are the `component.js` and `template.hbs`\
    \ files that are generated with a standard component. Let’s look at these files.\n\
    \nFirst, the generated component looks like this:\n\n[`ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js)\n\
    \n```\nimport Ember from 'ember';\nimport layout from './template';\n\nexport\
    \ default Ember.Component.extend({\n  layout: layout\n});\n```\n\nWe don’t need\
    \ to make any changes to the generated code because we’re not going to build a\
    \ very sophisticated component. Our goal is just to build a drop-down that we\
    \ can use to navigate to the notes route. So this is all we need. The previous\
    \ class simply instantiates a component. Our template is a bit more detailed:\n\
    \n[`ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs)\n\
    \n```\n<div class=\"dropdown\">\n<button class=\"btn btn-default dropdown-toggle\"\
    \ type=\"button\"\nid=\"dropdownMenu1\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\"\naria-expanded=\"true\">\n{{dropdownName}}\n<span class=\"caret\"></span>\n\
    </button>\n<ul class=\"dropdown-menu\" aria-labelledby=\"dropdownMenu1\">\n{{#each\
    \ model as |list|}}\n<li>{{#link-to route list.id}}{{list.title}}{{/link-to}}</li>\n\
    {{/each}}\n</ul>\n</div>\n{{yield}}\n```\n\nMuch of this code is boilerplate Bootstrap\
    \ for creating a drop-down. The `{{dropdownName}}` expression is used to pass\
    \ a value to the component, which will be used as the default display value for\
    \ the drop-down. The `{{each}}` expression loops along the passed-in model of\
    \ items to display. Each item becomes a single line in the drop-down.\n\nEach\
    \ line in the drop-down consists of the `{{link-to}}` expression. We rely on three\
    \ pieces of data in building these expressions. First, we pass in the name of\
    \ the destination route so we know where to go when we pick a notebook. Then,\
    \ we use the `id` value of the current record in the list as the parameter value\
    \ to pass to the destination route, and the `title` of the record to use as the\
    \ display value in the drop-down. We’ll see how to use this from our app shortly.\n\
    \nLet’s take a quick look now at the class created in our app directory.\n\n[`ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/app/components/bs-dropdown/component.js)\n\
    \n```\nexport { default } from 'ember-bs-dropdown/components/bs-dropdown/component';\n\
    ```\n\nThat’s right—it’s a single line of code. It’s not the clearest code, but\
    \ what it does is helpful. This single line of code creates an extensible version\
    \ of the addon’s component class, and makes that version a part of your app’s\
    \ namespace. Your app doesn’t get a copy of the file, but you can extend this\
    \ class in your app to add your own functionality onto the component, such as\
    \ providing default values for a component’s variables.\n\nThat’s all the code\
    \ we need to develop the addon. We’ll need to do a few more things to make it\
    \ usable. First, we need to tell Ember CLI to use the HTMLBars compiler when it\
    \ builds the addon for use elsewhere. Run the following from the project root,\
    \ which installs `ember-cli-htmlbars` as a dependency of the project:\n\n```\n\
    $ npm install ember-cli-htmlbars --save\n```\n\nWe also need to make sure that\
    \ the addon is built with a copy of the Bootstrap files it needs. We’re not going\
    \ to use the `ember-cli-build.js` file to do this, however. Each app has only\
    \ one `ember-cli-build.js`, so even if we added the Bootstrap assets to the addon’s\
    \ `ember-cli-build.js`, when the app includes our addon it will ignore the addon’s\
    \ `ember-cli-build.js` and use its own. Instead, we add these assets in the addon’s\
    \ entry point, `index.js`:\n\n[`ch9/ember-bs-dropdown/index.js`](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-bs-dropdown/index.js)\n\
    \n```\n/* jshint node: true */\n'use strict';\n\nmodule.exports = {\n  name: 'ember-bs-dropdown',\n\
    \n  included: function(app) {\n    app.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
    \    app.import('bower_components/bootstrap/dist/css/bootstrap.css.map',{\n  \
    \    destDir: 'assets'\n    });\n    app.import('bower_components/bootstrap/dist/js/bootstrap.min.js');\n\
    \  }\n};\n```\n\nThe entry point is a npm concept. An entry point is code that\
    \ your package, in this case your Ember addon, includes in another resource. The\
    \ entry point code will be run when the containing resource is first run in a\
    \ browser. As you can see, we are doing much the same work with this entry point\
    \ as we do in the app’s `ember-cli-build.js`, except that we also include some\
    \ Bootstrap JavaScript to allow our new drop-down to work properly. When the calling\
    \ app includes this addon, the `included` function will execute, and the Bootstrap\
    \ assets will become part of the calling app.\n\nNow that we’ve seen how to create\
    \ a basic addon, let’s learn how we can use it in a local application to test\
    \ it out.\n\n### Using the Addon\n"
