    Ember 在很多方面都是一个成熟的框架，它开箱即用地提供了许多出色的功能。然而，还有许多特性可能对大量开发者有用，却不属于核心框架。这就是为什么 Ember
    生态系统中最具吸引力的特性之一就是 Ember 插件。


    此外，Ember 的内容远不止我们在这里所能涵盖的。Ember 团队在维护项目文档方面做得非常出色。如果你遇到了我们尚未讨论的用例，那么 Ember 很可能已经考虑到了它，或者存在相应的插件。因此，请查阅
    Ember 官网或 Ember Observer 上的文档！


    Ember 项目一直在向前发展，任何时候都有许多优秀的特性正在开发中，这些特性无疑会对你有用。我会尽最大努力保持本书的时效性，但我也鼓励你查看以下资源以跟进项目进展：


    *   Ember 官网：[`emberjs.com`](http://emberjs.com)

    *   Ember 在 GitHub 上：[`github.com/emberjs`](https://github.com/emberjs)

    *   Ember CLI：[`www.ember-cli.com`](http://www.ember-cli.com)

    *   Ember 周刊：[`emberweekly.com`](http://emberweekly.com)

    *   Ember Observer：[`emberobserver.com`](http://emberobserver.com)


    最后，我想感谢你抽出时间阅读本书。希望你觉得它有所帮助。如果你有任何意见或疑问，请通过论坛 [`forums.pragprog.com/forums/368`](https://forums.pragprog.com/forums/368)
    或勘误页面 [`pragprog.com/titles/mwjsember/errata`](https://pragprog.com/titles/mwjsember/errata)
    分享。祝你编程愉快！


