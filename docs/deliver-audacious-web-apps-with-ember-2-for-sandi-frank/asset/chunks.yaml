  trans: "\n在浏览器中，你会看到测试结果的显示。滚动浏览结果，你应该能看到失败的测试。在修复其中一些失败的测试之前（是的，这些测试确实需要一些调整），我们先来聊聊\
    \ Ember CLI 用于执行测试的工具。\n\n当你在命令行中运行 `ember test` 命令时，Ember CLI 会启动一个 PhantomJS\
    \ 实例。PhantomJS 是一个无头网页浏览器（没有用户界面的浏览器），完全用 JavaScript 编写。通过使用 PhantomJS，你可以将测试作为持续集成流程的一部分来执行。持续集成是一种实践，即在专用的构建机器上通过自动化流程定期编译你的软件。使用持续集成，你可以检查新更改是否引入了错误。如果你采用持续集成，测试应该在构建过程中运行。使用\
    \ PhantomJS 可以让测试在不需要在持续集成机器上安装传统浏览器的情况下进行。\n\n当你通过访问 `localhost:4200/tests` 来运行测试时，你实际上是在使用一个\
    \ Ember 应用，这个应用是 Ember CLI 在你更新应用时构建的。这个应用被构建用来运行你的测试并显示结果。它会运行每一个测试，并提供一些选项让你决定查看哪些测试结果。\n\
    \n这两种查看测试结果的方法都很有用，并且在你开发计划中各有其位置。在本章的剩余部分，我们将依赖于在 `localhost:4200` 上可查看的测试应用，因为它提供了稍好一些的用户体验。\n\
    \n有了查看测试结果的方法，让我们开始编写我们将要编写的更基础的测试：单元测试。\n\n### 编写单元测试\n\n能够使用基于模块的方法来编写 JavaScript\
    \ 的一个好处是，我们也可以以模块化的方式来思考我们的测试。Ember CLI 为我们创建的每个应用模块创建一个测试模块。现在让我们看看其中一个。当你创建\
    \ note 模型类时，Ember CLI 在 `ember-note/tests/unit` 目录下创建了一个名为 `note-test.js` 的测试文件。生成的文件如下所示：\n\
    \n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
    import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\nmoduleForModel('notebook',\
    \ 'Unit | Model | notebook', {\n  // 指定此测试所需的其他单元。\n  needs: [];\n});\n\ntest('it\
    \ exists', function(assert) {\n  var model = this.subject();\n  // var store =\
    \ this.store();\n  assert.ok(!!model);\n});\n```\n\n导入块从 `ember-qunit` 中引入了 `moduleForModel`\
    \ 和 `test` 函数。这些函数在测试类中用于加载我们要测试的类，然后分别对其执行测试。\n\n> **QUnit、ember-test-helpers\
    \ 和 ember-qunit**\n> \n> ![images/aside-icons/tip.png](img/tip.png) 要使用 `ember\
    \ test` 命令或通过浏览器进行测试，你主要依赖三个测试框架：QUnit（[`qunitjs.com`](http://qunitjs.com)）、ember-test-helpers（[`github.com/switchfly/ember-test-helpers`](https://github.com/switchfly/ember-test-helpers)）和\
    \ ember-qunit（[`github.com/rwjblue/ember-qunit`](https://github.com/rwjblue/ember-qunit)）。每个框架都在提供你为测试用例编写的一些代码方面发挥作用。QUnit\
    \ 是一个通用的 JavaScript 测试框架，最初为 jQuery 编写；ember-test-helpers 是一组特定于 Ember 的测试工具，需要特定的测试框架（如\
    \ QUnit）才能运行；而 ember-qunit 则将这两者粘合在一起。\n\n#### 测试用例依赖关系\n\n这个生成的单元测试将确认最基本的行为：可以创建\
    \ note 模型类的实例。而现在，这个测试是失败的。如果你查看测试结果，你应该会看到一条消息，内容类似于“未找到 notebook 的模型”。为什么它报告找不到\
    \ notebook 模型？因为 note 模型类包含一个对 notebook 的 `belongsTo` 引用。让我们修复这个问题。将测试用例的 `needs`\
    \ 数组改为如下所示：\n\n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
    needs: [\n  'model:user',\n  'model:note'\n];\n```\n\n一旦你做出这个更改，失败的 notebook 模型测试应该会通过。通过浏览器重新运行测试来确认。如果你想要一组干净的测试，你也可以对\
    \ note 测试进行类似的更改，使它们也通过。\n\n你还需要对应用序列化器的测试用例进行一些更改才能通过。按如下方式更新 `moduleForModel`\
    \ 代码：\n\n```\n// [ch8/ember-note/tests/unit/serializers/application-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/serializers/application-test.js)\n\
    moduleForModel('user', 'Unit | Serializer | application', {\n  // 指定此测试所需的其他单元。\n\
    \  needs: ['model:user']\n});\n```\n\n此更改更新了序列化器测试，使其依赖于我们的一个模型类——user 模型。Ember\
    \ CLI 为序列化器测试类生成的测试蓝图会查找一个名为 application 的模型，但该模型在我们的应用中并不存在。更改为一个确实存在的类可以使此测试通过。\n\
    \n通过这些更改，我们更新了大部分测试，使其使用正确的依赖关系。你可能会注意到 edit-note 测试目前是失败的。先保持原样。我们很快就会处理它。首先，让我们看看如何为我们的模型编写单元测试。\n\
    \n#### 对模型进行单元测试\n\n在许多情况下，你可能不需要为模型类编写测试用例。如果你的模型类完全依赖于框架定义的行为（就像我们的模型一样），你甚至不需要编写测试用例。但让我们把事情变得稍微复杂一些，为我们的\
    \ notebook 模型添加一个函数，用于计算与 notebook 实例关联的笔记数量。将你的 notebook 模型更新为如下所示：\n\n```\n\
    // [ch8/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/models/notebook.js)\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title : DS.attr('string'),\n\
    \  user : DS.belongsTo('user'),\n  notes : DS.hasMany('note'),\n  noteCount: function()\
    \ {\n    return this.get('notes.length');\n  }\n});\n```\n\n`noteCount` 函数获取 notes\
    \ 属性的副本，该属性指向关联笔记的数组，并返回该数组的长度。这就是它的功能。现在，让我们编写一个测试来确认这一点。将你的 `notebook-test.js`\
    \ 文件更新为如下所示：\n\n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
    import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\nimport Ember from\
    \ 'ember';\n\nmoduleForModel('notebook', 'Unit | Model | notebook', {\n  // 指定此测试所需的其他单元。\n\
    \  needs: [\n    'model:user',\n    'model:note'\n  ];\n});\n\ntest('it exists',\
    \ function(assert) {\n  var model = this.subject();\n  // var store = this.store();\n\
    \  assert.ok(!!model);\n});\n```\n"
- fmt: "\n```\ntest('it counts notes', function(assert) {\n  var notebook = this.subject({\
    \ title: 'my notebook' });\n  var note;\n  var noteCount = Math.floor(Math.random()\
    \ * (10 - 1) + 1);\n\n  Ember.run(() => {\n    for(var i = 0; i < noteCount; i++)\
    \ {\n      note = this.store().createRecord('note');\n      notebook.get('notes').addObject(note);\n\
    \    }\n  });\n\n  assert.equal(notebook.noteCount(),noteCount);\n});\n```\n\n\
    First, we’ll need to modify our imports to include the `Ember` class. (We’ll see\
    \ why shortly.) Having done so we add a new test to the end of the file with the\
    \ description of “it counts notes.” These descriptions are used by the test runner\
    \ to tell you which test it’s running.\n\nNext, we’ll do some setup work. The\
    \ call to `this.subject` creates an instance of the notebook class that we’re\
    \ going to use to test. We’ll then initialize a variable called `note` that we’ll\
    \ populate with note instances. And we’ll create a random number between 1 and\
    \ 10, to test that the right number of note instances are added to the notebook.\n\
    \nHere’s where we’ll use the instance of `Ember` imported earlier. Because the\
    \ work we’re about to do runs asynchronously and has side effects, the test runner\
    \ requires that we do this work inside our own run loop. Within that run loop,\
    \ we’ll use the random number from earlier to generate the expected number of\
    \ note instances, and then add them to the notebook.\n\nAt this point you might\
    \ be unsure as to when to use `Ember.run` and when not to. Rest assured, the test\
    \ runner is very clear about why a given test won’t run and will provide an error\
    \ message indicating that your code requires `Ember.run`. Other than that, the\
    \ details about `Ember.run` are mostly relevant if you’re working on Ember instead\
    \ of with Ember.\n\nWith that setup work performed, we’ll run the actual test\
    \ by asserting that the `noteCount` method returns the expected number of records:\
    \ the random number declared earlier. Our test should pass, and we can sleep a\
    \ bit better knowing that we have one fewer method to worry about.\n\n| Random\
    \ Number Generation |\n| --- |\n| ![images/aside-icons/warning.png](images/aside-icons/warning.png)\
    \ | Random number generation is a risky area if security is involved. The `Math.random`\
    \ function we used earlier is fine for the way we used it, but you shouldn’t use\
    \ it for anything that requires security, such as generating a random value for\
    \ two-factor authentication or a captcha, because the output of `Math.random`\
    \ is not truly random. In these cases, you’re better off using the `RandomSource.getRandomValues()`\
    \ function, as documented on the Mozilla Developer Network at [https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues](https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues).\
    \ |\n\nNow, let’s take a look at how to unit test our components.\n\n#### Unit\
    \ Testing Your Components\n\nAs I mentioned earlier, we want to focus our unit\
    \ testing on pieces of code that are not already tested by the framework. Another\
    \ criterion to use to determine whether a class is ripe for unit testing is whether\
    \ it relies on externalities, such as the Ember Data store, that are difficult\
    \ to mock. Our `edit-note` component currently has two actions: `saveNote` and\
    \ `closeNote`. Let’s take a quick look back at the class:\n\n```\n[ch8/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/component.js)\n\
    import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
    \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\nBehind\
    \ the scenes, `saveNote` is calling out to the store to save data, so this method\
    \ will need to rely on an acceptance test. We can still unit test it, though,\
    \ to some degree. A better candidate for a unit test is the `closeNote` action,\
    \ which simply refers the action to a class that’s passed to the component. This\
    \ class can be easily mocked.\n\nLet’s make a small tweak to the `edit-note` template.\
    \ For each of the buttons, add an `id` parameter, like this:\n\n```\n[ch8/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/template.hbs)\n\
    <div>\n  {{input value=note.title}}\n  <button id=\"save\" {{action \"saveNote\"\
    }}>save</button>\n  <button id=\"close\" {{action \"closeNote\"}}>close</button>\n\
    </div>\n<div>\n  {{textarea rows=10 cols=60 value=note.body}}\n</div>\n<div>\n\
    \  {{markdown-to-html markdown=note.body}}\n</div>\n<div>\n  {{yield}}\n</div>\n\
    ```\n\nYou’ll see why we added these attributes in a moment. Let’s take a look\
    \ at how we would write tests for the component by reviewing the component test\
    \ class, with a few new tests added:\n\n```\n[ch8/ember-note/tests/integration/components/edit-note/component-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/integration/components/edit-note/component-test.js)\n\
    import {\n  moduleForComponent,\n  test\n} from 'ember-qunit';\n\nimport Ember\
    \ from 'ember';\n\nmoduleForComponent('edit-note', {\n  // Specify the other units\
    \ that are required for this test\n  needs: ['component:markdown-to-html']\n});\n\
    \ntest('it renders', function(assert) {\n  assert.expect(2);\n\n  // Creates the\
    \ component instance\n  var component = this.subject();\n  assert.equal(component._state,\
    \ 'preRender');\n\n  // Renders the component to the page\n  this.render();\n\
    \  assert.equal(component._state, 'inDOM');\n});\n\ntest('it saves', function(assert)\
    \ {\n  var component = this.subject();\n  this.render();\n  var saveTarget = {\n\
    \    save: function() {\n      assert.ok(true,'saved the note');\n    }\n  };\n\
    \  Ember.run(() => {\n    component.set('note',saveTarget);\n  });\n  this.$().find('#save').click();\n\
    });\n\ntest('it closes', function(assert) {\n  var component = this.subject();\n\
    \  this.render();\n  var closeTarget = {\n    closeAction: function() {\n    \
    \  assert.ok(true,'closed the window');\n    }\n  };\n  component.set('close','closeAction');\n\
    \  component.set('targetObject',closeTarget);\n  this.$().find('#close').click();\n\
    });\n```\n\nWe’ve added the `Ember` class again because we’ll need to use the\
    \ run loop in one of our tests. In `moduleForComponent`, we added a dependency\
    \ on the `markdown-to-html` addon so that the test framework knows to use this\
    \ class in rendering the `edit-note` component.\n\nThe “it renders” test is Ember\
    \ CLI test boilerplate for a component. We haven’t altered it. This tests whether\
    \ the component is set up and rendered as expected by the test container.\n"
  raw: '| ​  | test(​*''it counts notes''*​, ​**function**​(assert) { |


    | ​  | ​**var**​ notebook = this.subject({ title: ​*''my notebook''*​ }); |


    | ​  | ​**var**​ note; |


    | ​  | ​**var**​ noteCount = Math.floor(Math.random() * (10 - 1) + 1); |


    | ​  |  |


    | ​  | Ember.run(() => { |


    | ​  | ​**for**​(​**var**​ i = 0; i < noteCount; i++) { |


    | ​  | note = this.store().createRecord(​*''note''*​); |


    | ​  | notebook.get(​*''notes''*​).addObject(note); |


    | ​  | } |


    | ​  | }); |


    | ​  |  |


    | ​  | assert.equal(notebook.noteCount(),noteCount); |


    | ​  | }); |


    First, we’ll need to modify our imports to include the Ember class. (We’ll see
    why shortly.) Having done so we add a new test to the end of the file with the
    description of “it counts notes.” These descriptions are used by the test runner
    to tell you which test it’s running.


    Next, we’ll do some setup work. The call to this.subject creates an instance of
    the notebook class that we’re going to use to test. We’ll then initialize a variable
    called note that we’ll populate with note instances. And we’ll create a random
    number between 1 and 10, to test that the right number of note instances are added
    to the notebook.


    Here’s where we’ll use the instance of Ember imported earlier. Because the work
    we’re about to do runs asynchronously and has side effects, the test runner requires
    that we do this work inside our own run loop. Within that run loop, we’ll use
    the random number from earlier to generate the expected number of note instances,
    and then add them to the notebook.


    At this point you might be unsure as to when to use Ember.run and when not to.
    Rest assured, the test runner is very clear about why a given test won’t run and
    will provide an error message indicating that your code requires Ember.run. Other
    than that, the details about Ember.run are mostly relevant if you’re working on
    Ember instead of with Ember.


    With that setup work performed, we’ll run the actual test by asserting that the
    noteCount method returns the expected number of records: the random number declared
    earlier. Our test should pass, and we can sleep a bit better knowing that we have
    one fewer method to worry about.


    | Random Number Generation |


    | --- |


    | ![images/aside-icons/warning.png](images/aside-icons/warning.png) | Random number
    generation is a risky area if security is involved. The Math.random function we
    used earlier is fine for the way we used it, but you shouldn’t use it for anything
    that requires security, such as generating a random value for two-factor authentication
    or a captcha, because the output of Math.random is not truly random. In these
    cases, you’re better off using the RandomSource.getRandomValues() function, as
    documented on the Mozilla Developer Network at [https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues](https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues).
    |


    Now, let’s take a look at how to unit test our components.


    #### Unit Testing Your Components


    As I mentioned earlier, we want to focus our unit testing on pieces of code that
    are not already tested by the framework. Another criterion to use to determine
    whether a class is ripe for unit testing is whether it relies on externalities,
    such as the Ember Data store, that are difficult to mock. Our edit-note component
    currently has two actions: saveNote and closeNote. Let’s take a quick look back
    at the class:


    | [ch8/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/component.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Component.extend({ |


    | ​  | actions: { |


    | ​  | saveNote: ​**function**​() { |


    | ​  | this.get(​*''note''*​).save(); |


    | ​  | }, |


    | ​  | closeNote: ​**function**​() { |


    | ​  | this.sendAction(​*''close''*​); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    Behind the scenes, saveNote is calling out to the store to save data, so this
    method will need to rely on an acceptance test. We can still unit test it, though,
    to some degree. A better candidate for a unit test is the closeNote action, which
    simply refers the action to a class that’s passed to the component. This class
    can be easily mocked.


    Let’s make a small tweak to the edit-note template. For each of the buttons, add
    an id parameter, like this:


    | [ch8/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/template.hbs)
    |


    | ​  | ​**<div>**​ |


    | ​  | {{input value=note.title}} |


    | ​  | ​**<button**​ id=​*"save"*​ {{action "saveNote"}}​**>**​save​**</button>**​
    |


    | ​  | ​**<button**​ id=​*"close"*​ {{action "closeNote"}}​**>**​close​**</button>**​
    |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{textarea rows=10 cols=60 value=note.body}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{markdown-to-html markdown=note.body}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{yield}} |


    | ​  | ​**</div>**​ |


    You’ll see why we added these attributes in a moment. Let’s take a look at how
    we would write tests for the component by reviewing the component test class,
    with a few new tests added:


    | [ch8/ember-note/tests/integration/components/edit-note/component-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/integration/components/edit-note/component-test.js)
    |


    | ​  | ​**import**​ { |


    | ​  | moduleForComponent, |


    | ​  | test |


    | ​  | } from ​*''ember-qunit''*​; |


    | ​  |  |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | moduleForComponent(​*''edit-note''*​, { |


    | ​  | ​*// Specify the other units that are required for this test*​ |


    | ​  | needs: [​*''component:markdown-to-html''*​] |


    | ​  | }); |


    | ​  |  |


    | ​  | test(​*''it renders''*​, ​**function**​(assert) { |


    | ​  | assert.expect(2); |


    | ​  |  |


    | ​  | ​*// Creates the component instance*​ |


    | ​  | ​**var**​ component = this.subject(); |


    | ​  | assert.equal(component._state, ​*''preRender''*​); |


    | ​  |  |


    | ​  | ​*// Renders the component to the page*​ |


    | ​  | this.render(); |


    | ​  | assert.equal(component._state, ​*''inDOM''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | test(​*''it saves''*​, ​**function**​(assert) { |


    | ​  | ​**var**​ component = this.subject(); |


    | ​  | this.render(); |


    | ​  | ​**var**​ saveTarget = { |


    | ​  | save: ​**function**​() { |


    | ​  | assert.ok(true,​*''saved the note''*​); |


    | ​  | } |


    | ​  | }; |


    | ​  | Ember.run(() => { |


    | ​  | component.set(​*''note''*​,saveTarget); |


    | ​  | }); |


    | ​  | this.$().find(​*''#save''*​).click(); |


    | ​  | }); |


    | ​  |  |


    | ​  | test(​*''it closes''*​, ​**function**​(assert) { |


    | ​  | ​**var**​ component = this.subject(); |


    | ​  | this.render(); |


    | ​  | ​**var**​ closeTarget = { |


    | ​  | closeAction: ​**function**​() { |


    | ​  | assert.ok(true,​*''closed the window''*​); |


    | ​  | } |


    | ​  | }; |


    | ​  | component.set(​*''close''*​,​*''closeAction''*​); |


    | ​  | component.set(​*''targetObject''*​,closeTarget); |


    | ​  | this.$().find(​*''#close''*​).click(); |


    | ​  | }); |


    We’ve added the Ember class again because we’ll need to use the run loop in one
    of our tests. In moduleForComponent, we added a dependency on the markdown-to-html
    addon so that the test framework knows to use this class in rendering the edit-note
    component.


    The “it renders” test is Ember CLI test boilerplate for a component. We haven’t
    altered it. This tests whether the component is set up and rendered as expected
    by the test container.'
