  trans: "\n\n### 使用循环和条件控制模板\n\nEmber 提供了多种控制模板显示内容的方式。其中一种结构是 `{{if}}` 表达式。`{{if}}`\
    \ 表达式会根据提供的属性是否为真，或者是否为假、`null`、`undefined` 或 `[]`（哦，JavaScript），来决定是否渲染模板的某一部分。\n\
    \n要使用 `{{if}}` 表达式，你需要将需要条件包含的代码块包围起来，就像这样：\n\n```\n{{#if condition}}\n  <div>HELLO</div>\n\
    {{else}}\n  <div>never mind</div>\n{{/if}}\n```\n\nEmber 将这种表达式称为块表达式，因为模板代码块被表达式包围。块表达式需要开始和结束标签（例如\
    \ `{{#if}}` 和 `{{/if}}`）。在这个例子中，如果 `condition` 为真，则渲染 \"HELLO\"；否则渲染 \"never mind\"\
    。\n\nEmber 还允许你将多个条件串联起来，而不是将它们嵌套在 `{{else}}` 块中。如果你需要串联两个、三个甚至四十七个条件，可以这样做：\n\
    \n```\n{{#if condition}}\n  <div>HELLO</div>\n{{else if condition2}}\n  <div>never\
    \ mind</div>\n{{else if condition3}}\n  <div>WAT</div>\n{{else}}\n  <div>go away</div>\n\
    {{/if}}\n```\n\n你也可以使用内联 if 来简化标准的 `{{if}}` 语法：\n\n```\n{{if condition 'on' 'off'}}\n\
    ```\n\n内联条件的第二个和第三个参数可以包含属性或字符串，但不能包含其他内容。`{{if}}` 表达式有一个兄弟表达式叫做 `{{unless}}`。当你只有一种情况需要渲染表达式主体，并且不想通过“非”操作来混淆条件时，可以使用这个表达式，就像这样：\n\
    \n```\n{{#unless hasChrome}}\n  运行此应用需要 Chrome 浏览器。\n{{/unless}}\n```\n\n除非用户拥有\
    \ Chrome 浏览器，否则会显示仅限使用 Chrome 的警告。`hasChrome` 变量是由后端模型或路由属性提供的值，并非 Ember 的标准部分。是的，你也可以使用\
    \ `{{if}}`，但这种表达式和属性的组合读起来更清晰。你会注意到我们在 `application.hbs` 模板中使用了这些表达式。\n\n在本章前面，你已经看到了使用\
    \ `{{each}}` 循环遍历项目列表的代码，所以我就不再重复了。我要提醒你的是，`{{each}}` 要求你的控制器引用一个记录列表作为其模型。\n\n\
    ### 绑定输入字段\n\n到目前为止，我们看到的每个表达式都用于显示静态文本。Ember 的强大之处在于它能够将可编辑字段链接到控制器，因此我们也需要使用输入字段。现在让我们更新示例，使用输入字段。\n\
    \n首先，看一下笔记本模板：\n\n`[ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)`\n\
    \n```\ntitle: {{input value=title}}\n<button {{action 'addNotebook'}}>Add</button>\n\
    ```\n\n像这样最简单的 `{{input}}` 表达式会渲染出以下 HTML：\n\n```\n<input type=\"text\" value=\"\
    Notebook Title\" />\n```\n\n我们没有显式定义输入字段的类型，但 Ember 默认将其设置为 `\"text\"`。另一种选择是显式设置，就像这样：\n\
    \n```\n{{input type=\"text\" value=title}}\n```\n\n这会渲染出等效的 HTML。如果你仔细观察，会发现 `type`\
    \ 属性被设置为带引号的字符串，而 `value` 被设置为不带引号的字符串。这个区别很重要。带引号的字符串会按原样渲染到 HTML 中；不带引号的字符串会渲染给定控制器属性的值。\n\
    \n以下 HTML 属性也可以为输入字段设置：\n\n`accept`, `autocomplete`, `autofocus`, `autosave`,\
    \ `disabled`, `form`, `formaction`, `formenctype`, `formmethod`, `formnovalidate`,\
    \ `formtarget`, `height`, `inputmode`, `max`, `maxlength`, `min`, `multiple`,\
    \ `name`, `pattern`, `placeholder`, `readonly`, `required`, `selectionDirection`,\
    \ `size`, `spellcheck`, `step`, `tabindex`, `value`, `width`\n\n除了 HTML 属性，`{{input}}`\
    \ 表达式还支持事件处理程序，在 Ember 中称为动作。你可以像这样从 `{{input}}` 表达式中链接一个动作：\n\n```\n{{input type=\"\
    text\" value=name action=\"execute\"}}\n```\n\n在前面的例子中，`value` 属性绑定到后端控制器中的一个变量。该值可以是绑定的，也可以是非绑定的。如果是绑定的，则不需要引号；如果是非绑定的，则提供你想要设置到字段值中的确切字符串，并加上引号。\n\
    \n`action` 属性绑定到回车键按下事件。当按下回车键时，会调用指定的动作。其他一些用户事件也可以通过将事件名称设置为一个动作来绑定（例如 `enter=\"\
    actionName\"`）。它们如下：\n\n- `enter`\n- `escape-press`\n- `focus-in`\n- `focus-out`\n\
    - `insert-newline`\n- `key-press`\n\n通过为每个用户事件提供动作，你可以在控制器或路由中触发动作，这些动作可用于加载数据、执行验证或写入持久化存储。在下一节中，我们将看到如何将动作分配给通用的\
    \ HTML 元素。但让我们先花更多时间了解 `{{input}}` 表达式。\n\n`{{input}}` 表达式还可以通过将 `type` 设置为 `checkbox`\
    \ 来渲染复选框。与文本类型类似，它也有许多可配置的属性：\n\n- `autofocus`\n- `checked`\n- `disabled`\n- `form`\n\
    - `indeterminate`\n- `name`\n- `tabindex`\n\n这些属性可以绑定到控制器属性，也可以不绑定。\n\n有时你需要捕获比文本字段能舒适显示的更多文本。在这种情况下，可以使用\
    \ `{{textarea}}` 表达式。`{{textarea}}` 表达式的工作方式与 `{{input}}` 表达式类似。它渲染一个类型为 `textarea`\
    \ 的控件，其值绑定到控制器模型的选定属性。\n\n```\n{{textarea value=property rows=5 cols=40}}\n```\n\
    \n你还可以看到我们设置了一些其他 HTML 属性：`rows` 和 `cols`。和之前一样，如果设置为控制器属性，它们将采用这些属性的值；否则，它们将被设置为提供的任何特定值。总的来说，以下\
    \ HTML 属性也可以在 `{{textarea}}` 表达式中使用：\n\n`autofocus`, `cols`, `disabled`, `form`,\
    \ `maxlength`, `name`, `placeholder`, `readonly`, `required`, `rows`, `selectionDirection`,\
    \ `selectionEnd`, `selectionStart`, `spellcheck`, `tabindex`, `value`, `wrap`\n\
    \n这是将属性链接到用户界面的三种最基本的方式。你可能会觉得这有限制，如果这是在 Ember 中创建可重用控件的唯一方式，那确实如此。然而，还有另一种方式，我们将在下一章中看到。现在，让我们继续学习如何在\
    \ Ember 中启用动作处理。\n\n### 将动作绑定到路由\n\n你的用户界面需要做两件事：显示数据和响应用户输入。我们已经看到了第一点；现在让我们开始第二点。\n\
    \n你的路由与模板是一一对应的，它有一个可供模板使用的函数列表，称为动作。\n\n正如你所料，Ember 有一个用于将 HTML 元素动作与路由链接起来的表达式：`{{action}}`\
    \ 表达式。让我们看一个来自登录模板的基本动作示例：\n\n`[ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)`\n\
    \n```\n<div class=\"col-md-12\">\n  Login: {{input value=name}} <button {{action\
    \ 'login'}}>Login</button>\n</div>\n```\n\n"
- fmt: "\nFirst, we’ve added an input field, so the `{{action}}` will have something\
    \ to work with. In the route, the action handler takes that value and checks against\
    \ the server to see if the user is valid. The `{{action}}` expression is bound\
    \ to the next control we added: an HTML button that displays the text “Login.”\
    \ Used in this manner, the `{{action}}` expression binds the login action from\
    \ the route to the `onclick` event of the button. The `onclick` event is the default\
    \ for the button, which is why the `{{action}}` expression is bound to this event.\
    \ When the button is clicked, the login action will fire.\n\nWe’ve already seen\
    \ a lot on actions in the previous chapter, so this might be a review for you.\
    \ Let’s now take a look at compiling templates.\n\n## Compile Templates\n\nWhen\
    \ you create a template in your `template.hbs` file, the HTML and expression language\
    \ you add isn’t directly built into a string. Beginning with the 1.10 release\
    \ of Ember, a new template compiler, known as `HTMLBars`, is used to render your\
    \ templates. With this compiler, a virtual DOM is created in your application’s\
    \ generated `ember-note.js` file. So long as you’re using Ember CLI to build your\
    \ application, these details are abstracted away from you.\n\nThis form of compilation\
    \ is important for two reasons. First, a virtual DOM is faster to generate and\
    \ update than a string-based template, because a virtual DOM can be dealt with\
    \ at the level of an individual node (for example, a control on a page), versus\
    \ the entire template being regenerated when a control value changes.\n\nSecond,\
    \ it is this form of compilation that enables Ember to use server-side rendering.\
    \ Using server-side rendering allows the user to experience a faster initial boot\
    \ in the application, rather than seeing an empty UI load and waiting for a round-trip\
    \ to the server to display the app’s initial data. Ember’s server-side rendering\
    \ tool, known as `FastBoot`, is still under development, but promises to expand\
    \ Ember’s capabilities greatly when released.\n\n### Ember Addon: Ember CLI Datepicker\n\
    \nAs you’ve seen, Ember provides a number of basic features for rendering HTML\
    \ fields using built-in template helpers. However, template helpers are a perfect\
    \ use case for an Ember addon, and one such addon is Ember CLI Datepicker.\n\n\
