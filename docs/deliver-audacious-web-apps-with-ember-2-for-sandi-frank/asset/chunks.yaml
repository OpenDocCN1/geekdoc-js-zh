  trans: "\n\n在这个示例中，我们假设已经创建了一个用户特定的翻译对象，并将其注入到转换器中。这样我们就可以计算使用用户货币换算率的翻译结果。转换器本身的作用很简单：当模型以本地货币请求信息时，它介入处理。一个需要使用该转换器的模型类示例如下：\n\
    \n```\nimport DS from \"ember-data\";\n\nexport default DS.Model.extend({\n  toAccount:\
    \ DS.attr('string'),\n  fromAccount: DS.attr('string'),\n  amount: DS.attr('native-currency')\
    \ // 以本地货币表示金额\n});\n```\n\n同样的数据也可以不使用转换器来表示，如下所示：\n\n```\nimport DS from \"\
    ember-data\";\n\nexport default DS.Model.extend({\n  toAccount: DS.attr('string'),\n\
    \  fromAccount: DS.attr('string'),\n  amount: DS.attr('number') // 以美元表示金额，存储在数据存储中\n\
    });\n```\n\n转换器既负责反序列化数据（即从存储格式转换为显示格式），也负责序列化数据。这意味着你可以用你选择的格式显示数据，但在需要保存时，序列化函数会介入并将数据转换回合适的格式，以保持与数据库预期的一致性。\n\
    \n## 下一步\n\n我们花了大部分时间学习如何构建 Ember 应用。构建应用固然很棒，但你希望把它展示给用户，对吧？在接下来的两章中，你将进一步了解\
    \ Ember CLI，它在部署和发布过程中大有帮助。接下来，你将学习如何使用它来管理依赖关系，并从你的 Ember 代码构建一个可部署的产物。在这个过程中，我们还将探讨如何使用\
    \ Ember CLI 提供的测试钩子，以便我们对代码充满信心。\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\
    \n# 第 8 章\n\n构建、测试和部署你的 Ember 应用\n\n到目前为止，我们在构建应用功能方面做了大量工作。但在完成之前，还有一个重要的领域需要处理。我们需要花些时间思考如何让应用为生产环境做好准备。\n\
    \nEmber CLI 为我们完成了大部分工作，但作为开发者，了解幕后的一些情况会对你有所帮助。首先，我们将看看 Ember CLI 如何从你编写的代码中准备一个可用的应用版本。然后，本章的大部分内容将讨论\
    \ Ember CLI 如何帮助你测试应用。最后，我们将了解 Ember CLI 如何帮助你部署应用。\n\n让我们从 Ember CLI 如何构建你的应用代码并使其随时可以运行开始。\n\
    \n## 构建你的应用\n\n如果你长期使用 JavaScript（或任何其他软件开发工具），你可能熟悉一个常见的障碍：构建系统。就像语言一样，每个人对于给定语言的最佳构建系统都有不同的看法。与此选择密切相关的是你对依赖管理的选择。选择构建和依赖管理工具是一个挑战；配置所选工具集则是另一个挑战。幸运的是，Ember\
    \ CLI 优雅地为你解决了这个问题。\n\n### 获取依赖\n\n当你首次安装 Ember CLI 时，它会包含最新版本的 Ember。作为 Ember\
    \ 2.x 发布周期的一部分，Ember 核心和 Ember CLI 将同步发布计划。因此，如果你想升级 Ember CLI，Ember 也应随之升级。你可以通过在项目目录中以管理员身份运行以下命令来升级\
    \ Ember CLI：\n\n```\n$ npm uninstall -g ember-cli\n$ npm cache clean\n$ bower\
    \ cache clean\n$ npm install -g ember-cli\n$ npm install ember-cli --save-dev\n\
    $ rm -rf node_modules bower_components dist tmp\n$ npm install\n$ bower install\n\
    $ ember init\n```\n\n前三个命令从 npm 包管理系统中移除当前版本的 Ember CLI，并清除 npm 和 Bower 缓存中的相关文件。接下来，安装最新的\
    \ Ember CLI 并使其全局可用（由 `-g` 标志定义），同时将其安装到项目的 `package.json` 文件中（这里我们使用了 `--save-dev`\
    \ 标志）。\n\n然后，为了安全起见，我们删除应用中包含依赖和构建版本的四个目录。接下来的两个命令将 `package.json` 和 `bower.json`\
    \ 中列出的所有依赖重新安装到本地组件目录中。最后，`ember init` 会针对当前代码库重新运行所有 Ember CLI 蓝图，以检查更改。每次运行\
    \ `ember generate` 时你都在使用这些蓝图，由于蓝图可能会发生变化，重新应用它们是个好主意。该命令会允许你批准列出的每个差异，以便你了解此命令更改了哪些内容。这里要小心——根据\
    \ Ember CLI 的变化，某些更改可能会删除你想要保留的代码，所以最好谨慎行事。你正在使用一个良好的版本控制系统，对吧？\n\n有时你可能只想更新某个依赖而不更新\
    \ Ember CLI。由于 Ember CLI 依赖于 Bower，你可以通过运行以下命令来安装更新的依赖：\n\n```\n$ bower install\
    \ my-dependency --save\n```\n\n这将更新你的 `bower.json`，使该依赖成为项目的一部分。\n\n### 在本地运行应用\n\
    \n当你编写代码或更改依赖时，假设你通过 `ember serve` 命令启动了一个运行实例，Ember CLI 会保持本地部署的最新状态。Ember CLI\
    \ 会构建一个包含模拟服务器的本地可部署版本，并启动该应用。\n\n正如我们在本书中看到的，当你运行 `ember serve` 命令时，它会启动 watchman\
    \ 服务。当 watchman 检测到应用文件发生变化时，它会触发应用的重建。此外，当你浏览应用时，本地部署的版本包含一个 WebSockets 客户端，用于监控变化并在必要时在浏览器中重新加载应用。这非常方便，尤其是当你快速编码并希望同样快速地看到变化时。快速编码时你还需要做的一件事就是编写测试用例。我们现在来看看如何做到这一点。\n\
    \n## 测试和调试你的应用\n\n我一直保守着一个小秘密。当你运行 `ember generate` 时，Ember CLI 不仅会为你生成类，还会为你生成测试框架。事实上，它们已经足够完整，可以运行（尽管在覆盖率方面提供的帮助不大）。如果你过去在将良好的测试实践应用于\
    \ JavaScript 客户端代码时遇到困难，那么你最后的借口已经消失了。\n\n### 测试执行\n\n让我们先回顾一下 Ember CLI 在我们工作过程中创建的测试的当前结果。打开命令提示符，导航到\
    \ EmberNote 项目的根目录，然后运行以下命令：\n\n```\n$ ember test\n```\n\n运行此命令后，你应该会看到控制台输出大量信息。Ember\
    \ CLI 会先构建你的应用，然后运行它在整个工作过程中生成的测试。\n\n还有第二种查看测试的方法。在同一个命令提示符下，按 `Ctrl-C`，这会暂停\
    \ `ember test` 的输出。它应该会报告一些失败的测试，我们稍后会处理。首先，从命令行运行 `ember serve`。然后，在浏览器中访问 `localhost:4200/tests`。\n\
    \n"
- fmt: "\nIn your browser, you’ll see the results of your tests displayed. Scroll\
    \ through the results and you should see the failing tests. Before we fix a few\
    \ of these failing tests (and yes, the tests do require some tweaking), let’s\
    \ talk a little bit about the tooling Ember CLI uses to accomplish test execution.\n\
    \nWhen you run the `ember test` command from the command line, Ember CLI spins\
    \ up a PhantomJS instance. PhantomJS is a headless web browser (a browser with\
    \ no user interface), written entirely in JavaScript. By using PhantomJS, you’re\
    \ able to execute your tests as part of a continuous integration process. Continuous\
    \ integration is the practice of regularly compiling your software with an automated\
    \ process on a dedicated build machine. Using continuous integration, you can\
    \ check if errors have been introduced by new changes. If you adopt continuous\
    \ integration, your tests should be run during the build process. Using PhantomJS\
    \ allows your testing to occur without requiring a traditional browser be installed\
    \ on the continuous integration machine.\n\nWhen you run the tests by visiting\
    \ `localhost:4200/tests`, you’re actually using an Ember application that Ember\
    \ CLI builds as you update your app. This app is built to run your tests and display\
    \ the results to you. It runs every test, and offers you a few options to determine\
    \ which test results you want to see.\n\nBoth of these methods for reviewing your\
    \ test results are useful, and both have a place in your development plans. Throughout\
    \ the rest of the chapter, we’ll rely on the test app viewable at `localhost:4200`,\
    \ as it offers a slightly better user experience.\n\nWith a way to look at our\
    \ test results, let’s start by writing the more foundational of the tests we’re\
    \ going to write: unit tests.\n\n### Writing Unit Tests\n\nOne benefit of being\
    \ able to use a module-based approach to JavaScript is that we can think in a\
    \ modular fashion about our tests as well. Ember CLI creates one test module for\
    \ each app module we create. Let’s see one of those now. When you created the\
    \ note model class, Ember CLI created a test in a file called `note-test.js`,\
    \ in the `ember-note/tests/unit` directory. The generated file looks like this:\n\
    \n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
    import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\nmoduleForModel('notebook',\
    \ 'Unit | Model | notebook', {\n  // Specify the other units that are required\
    \ for this test.\n  needs: [];\n});\n\ntest('it exists', function(assert) {\n\
    \  var model = this.subject();\n  // var store = this.store();\n  assert.ok(!!model);\n\
    });\n```\n\nThe import block pulls in the `moduleForModel` and `test` functions\
    \ from `ember-qunit`. These functions are used in the test class to load the class\
    \ we want to test and then execute a test against it, respectively.\n\n> **QUnit,\
    \ ember-test-helpers, and ember-qunit**\n> \n> ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ To test using the `ember test` command or via the browser, you’ll primarily\
    \ rely on three test frameworks: QUnit ([http://qunitjs.com](http://qunitjs.com)),\
    \ ember-test-helpers ([https://github.com/switchfly/ember-test-helpers](https://github.com/switchfly/ember-test-helpers)),\
    \ and ember-qunit ([https://github.com/rwjblue/ember-qunit](https://github.com/rwjblue/ember-qunit)).\
    \ Each of these plays a role in providing some of the code you write for test\
    \ cases. QUnit is a generic JavaScript testing framework written originally for\
    \ jQuery; ember-test-helpers is an Ember-specific set of test harnesses that requires\
    \ a specific test framework, such as QUnit, to function; and ember-qunit glues\
    \ the two of these together.\n\n#### Test Case Dependencies\n\nThis generated\
    \ unit test will confirm the most fundamental behavior: that an instance of the\
    \ note model class can be created. And right now, this test is a failing test.\
    \ If you look at the test result, you should see a message that reads something\
    \ like “No model was found for notebook.” Why is it reporting that it can’t find\
    \ the notebook model? Because the note model class contains a `belongsTo` reference\
    \ to notebook. Let’s fix that. Change the `needs` array of your test case to look\
    \ like this:\n\n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
    needs: [\n  'model:user',\n  'model:note'\n];\n```\n\nOnce you make that change,\
    \ the failing notebook model tests should pass. Rerun your tests via the browser\
    \ to confirm. If you want a clean set of tests, you can also make similar changes\
    \ to the note tests to get them to pass as well.\n\nYou’ll also want to make a\
    \ few changes to the application serializer’s test case for it to pass. Update\
    \ the `moduleForModel` code as follows:\n\n```\n// [ch8/ember-note/tests/unit/serializers/application-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/serializers/application-test.js)\n\
    moduleForModel('user', 'Unit | Serializer | application', {\n  // Specify the\
    \ other units that are required for this test.\n  needs: ['model:user']\n});\n\
    ```\n\nThis change updates the serializer test to rely on one of our model classes,\
    \ the user model. The Ember CLI test blueprint for the serializer test class looks\
    \ for a model called application, which doesn’t exist in our app. Changing to\
    \ a class that does exist allows this test to pass.\n\nWith these changes, we’ve\
    \ updated most of the tests to use the proper dependencies. You may note that\
    \ the edit-note test is failing right now. Leave that one as is. We’ll come to\
    \ it soon. First, let’s look at how to write unit tests for our models.\n\n####\
    \ Unit Testing Your Models\n\nUnder many circumstances, you may not need to write\
    \ test cases for your model classes. If your model classes rely solely on framework-defined\
    \ behavior, as ours do, you won’t even need to write test cases. But let’s complicate\
    \ things for ourselves a bit, and add a function to our notebook model that counts\
    \ the number of notes associated to the notebook instance. Update your notebook\
    \ model to look like this:\n\n```\n// [ch8/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/models/notebook.js)\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title : DS.attr('string'),\n\
    \  user : DS.belongsTo('user'),\n  notes : DS.hasMany('note'),\n  noteCount: function()\
    \ {\n    return this.get('notes.length');\n  }\n});\n```\n\nThe `noteCount` function\
    \ gets a copy of the notes attribute, which points to the array of associated\
    \ notes, and returns the length of that array. That’s what it’s meant to do. Now,\
    \ let’s write a test that confirms this. Update your `notebook-test.js` file to\
    \ look like this:\n\n```\n// [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)\n\
    import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\nimport Ember from\
    \ 'ember';\n\nmoduleForModel('notebook', 'Unit | Model | notebook', {\n  // Specify\
    \ the other units that are required for this test.\n  needs: [\n    'model:user',\n\
    \    'model:note'\n  ];\n});\n\ntest('it exists', function(assert) {\n  var model\
    \ = this.subject();\n  // var store = this.store();\n  assert.ok(!!model);\n});\n\
    ```\n"
  raw: 'In your browser, you’ll see the results of your tests displayed. Scroll through
    the results and you should see the failing tests. Before we fix a few of these
    failing tests (and yes, the tests do require some tweaking), let’s talk a little
    bit about the tooling Ember CLI uses to accomplish test execution.


    When you run the ember test command from the command line, Ember CLI spins up
    a PhantomJS instance. PhantomJS is a headless web browser (a browser with no user
    interface), written entirely in JavaScript. By using PhantomJS, you’re able to
    execute your tests as part of a continuous integration process. Continuous integration
    is the practice of regularly compiling your software with an automated process
    on a dedicated build machine. Using continuous integration, you can check if errors
    have been introduced by new changes. If you adopt continuous integration, your
    tests should be run during the build process. Using PhantomJS allows your testing
    to occur without requiring a traditional browser be installed on the continuous
    integration machine.


    When you run the tests by visiting localhost:4200/tests, you’re actually using
    an Ember application that Ember CLI builds as you update your app. This app is
    built to run your tests and display the results to you. It runs every test, and
    offers you a few options to determine which test results you want to see.


    Both of these methods for reviewing your test results are useful, and both have
    a place in your development plans. Throughout the rest of the chapter, we’ll rely
    on the test app viewable at localhost:4200, as it offers a slightly better user
    experience.


    With a way to look at our test results, let’s start by writing the more foundational
    of the tests we’re going to write: unit tests.


    ### Writing Unit Tests


    One benefit of being able to use a module-based approach to JavaScript is that
    we can think in a modular fashion about our tests as well. Ember CLI creates one
    test module for each app module we create. Let’s see one of those now. When you
    created the note model class, Ember CLI created a test in a file called note-test.js,
    in the ember-note/tests/unit directory. The generated file looks like this:


    | [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)
    |


    | ​  | ​**import**​ { |


    | ​  | moduleForModel, |


    | ​  | test |


    | ​  | } from ​*''ember-qunit''*​; |


    | ​  |  |


    | ​  | moduleForModel(​*''notebook''*​, ​*''Unit &#124; Model &#124; notebook''*​,
    { |


    | ​  | ​*// Specify the other units that are required for this test.*​ |


    | ​  | needs: []; |


    | ​  | }); |


    | ​  |  |


    | ​  | test(​*''it exists''*​, ​**function**​(assert) { |


    | ​  | ​**var**​ model = this.subject(); |


    | ​  | ​*// var store = this.store();*​ |


    | ​  | assert.ok(!!model); |


    | ​  | }); |


    The import block pulls in the moduleForModel and test functions from ember-qunit.
    These functions are used in the test class to load the class we want to test and
    then execute a test against it, respectively.


    | QUnit, ember-test-helpers, and ember-qunit |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | To test using the
    ember test command or via the browser, you’ll primarily rely on three test frameworks:
    QUnit ([http://qunitjs.com](http://qunitjs.com)), ember-test-helpers ([https://github.com/switchfly/ember-test-helpers](https://github.com/switchfly/ember-test-helpers)),
    and ember-qunit ([https://github.com/rwjblue/ember-qunit](https://github.com/rwjblue/ember-qunit)).Each
    of these plays a role in providing some of the code you write for test cases.
    QUnit is a generic JavaScript testing framework written originally for jQuery;
    ember-test-helpers is an Ember-specific set of test harnesses that requires a
    specific test framework, such as QUnit, to function; and ember-qunit glues the
    two of these together. |


    #### Test Case Dependencies


    This generated unit test will confirm the most fundamental behavior: that an instance
    of the note model class can be created. And right now, this test is a failing
    test. If you look at the test result, you should see a message that reads something
    like “No model was found for notebook.” Why is it reporting that it can’t find
    the notebook model? Because the note model class contains a belongsTo reference
    to notebook. Let’s fix that. Change the needs array of your test case to look
    like this:


    | [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)
    |


    | ​  | needs: [ |


    | ​  | ​*''model:user''*​, |


    | ​  | ​*''model:note''*​ |


    | ​  | ]; |


    Once you make that change, the failing notebook model tests should pass. Rerun
    your tests via the browser to confirm. If you want a clean set of tests, you can
    also make similar changes to the note tests to get them to pass as well.


    You’ll also want to make a few changes to the application serializer’s test case
    for it to pass. Update the moduleForModel code as follows:


    | [ch8/ember-note/tests/unit/serializers/application-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/serializers/application-test.js)
    |


    | ​  | moduleForModel(​*''user''*​, ​*''Unit &#124; Serializer &#124; application''*​,
    { |


    | ​  | ​*// Specify the other units that are required for this test.*​ |


    | ​  | needs: [​*''model:user''*​] |


    | ​  | }); |


    This change updates the serializer test to rely on one of our model classes, the
    user model. The Ember CLI test blueprint for the serializer test class looks for
    a model called application, which doesn’t exist in our app. Changing to a class
    that does exist allows this test to pass.


    With these changes, we’ve updated most of the tests to use the proper dependencies.
    You may note that the edit-note test is failing right now. Leave that one as is.
    We’ll come to it soon. First, let’s look at how to write unit tests for our models.


    #### Unit Testing Your Models


    Under many circumstances, you may not need to write test cases for your model
    classes. If your model classes rely solely on framework-defined behavior, as ours
    do, you won’t even need to write test cases. But let’s complicate things for ourselves
    a bit, and add a function to our notebook model that counts the number of notes
    associated to the notebook instance. Update your notebook model to look like this:


    | [ch8/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/models/notebook.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | title : DS.attr(​*''string''*​), |


    | ​  | user : DS.belongsTo(​*''user''*​), |


    | ​  | notes : DS.hasMany(​*''note''*​), |


    | ​  | noteCount: ​**function**​() { |


    | ​  | ​**return**​ this.get(​*''notes.length''*​); |


    | ​  | } |


    | ​  | }); |


    The noteCount function gets a copy of the notes attribute, which points to the
    array of associated notes, and returns the length of that array. That’s what it’s
    meant to do. Now, let’s write a test that confirms this. Update your notebook-test.js
    file to look like this:


    | [ch8/ember-note/tests/unit/models/notebook-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/unit/models/notebook-test.js)
    |


    | ​  | ​**import**​ { |


    | ​  | moduleForModel, |


    | ​  | test |


    | ​  | } from ​*''ember-qunit''*​; |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | moduleForModel(​*''notebook''*​, ​*''Unit &#124; Model &#124; notebook''*​,
    { |


    | ​  | ​*// Specify the other units that are required for this test.*​ |


    | ​  | needs: [ |


    | ​  | ​*''model:user''*​, |


    | ​  | ​*''model:note''*​ |


    | ​  | ]; |


    | ​  | }); |


    | ​  |  |


    | ​  | test(​*''it exists''*​, ​**function**​(assert) { |


    | ​  | ​**var**​ model = this.subject(); |


    | ​  | ​*// var store = this.store();*​ |


    | ​  | assert.ok(!!model); |


    | ​  | }); |


    | ​  |  |'
