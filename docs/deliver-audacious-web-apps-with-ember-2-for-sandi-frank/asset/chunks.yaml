    # Chapter 7


    Reusing Code in Ember


    We’ve spent a good deal of time learning the core features of Ember. We’ve seen
    how to build web apps using these core features, and how to do so quickly, by
    relying on Ember’s opinionated structure.


    That structure does more than provide you with a means of building the core of
    your app. It also provides several ways of sharing code between different aspects
    of your system. It offers the ability to bootstrap your app by preparing any necessary
    objects. And it provides the ability to translate a data value from one context
    to another, such as a currency translation.


    In this chapter, we’ll look at how to use Ember and Ember CLI to layer in app-specific
    abstractions on top of Ember’s opinionated structure so that you can apply sound
    design to EmberNote’s logic. Let’s get started by looking at the most basic level
    of abstraction: the utility class.


    ## Abstract Common Functions with Utilities


    One way to share code between objects is to create a simple utility function.
    Ember CLI includes a blueprint for creating a utility function that can be imported
    into other classes. Strictly speaking, creating the utility function this way
    isn’t a feature of the Ember core framework as much as a feature of Ember CLI.
    We’ll discuss how Ember CLI makes this and other features possible when we explore
    building your app in Chapter 8, [​*Building, Testing, and Deploying Your Ember
    Apps*​](#f_0055.html_ch8).


    The goal of creating a utility function is to provide a single place for logic
    to live that might need to be used in different, unrelated classes. I say “unrelated,”
    because if the classes were related, we’d be better off using a mixin, as we’ll
    see in [​*Share Code with Mixins*​](#f_0051.html_mixins).


    Data validation is a good example of the sort of logic that might live in a utility
    function. There are many different reasons why you might need to validate data.
    You might need to validate that a string is a valid email, or phone number, or
    postal code. You might need to validate the length of a string, or that it’s a
    valid date. You might need to validate that it doesn’t contain certain characters.
    In any event, it’s possible that you’ll want to use such validation in several
    unrelated contexts, so validation is a good use case for us to start with.


    For our purposes, let’s say we want to validate that EmberNote’s note titles have
    a length between 0 and 140 characters. We’ll create a utility function to enforce
    this, and then use that function in our notes route. To begin, run the following
    command from your project root:


    | ​  | $ ember generate util is-valid-length |


    This command creates an empty utility function that looks like this:


    | ​  | ​**export**​ ​**default**​ ​**function**​ isValidLength() { |


    | ​  | ​**return**​ true; |


    | ​  | } |


    To add our actual logic, make the following changes:


    | [ch7/ember-note/app/utils/is-valid-length.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/utils/is-valid-length.js)
    |


    | ​  | ​**export**​ ​**default**​ ​**function**​ isValidLength(value, min, max)
    { |


    | ​  | ​**return**​ !(value.length <= min &#124;&#124; value.length > max); |


    | ​  | } |


    The specific implementation details of this function are less important than the
    form. You’ll notice that the command used the dasherized text is-valid-length,
    whereas the function is called isValidLength. Ember CLI performs that translation
    when creating the function, which is captured in a file called is-valid-length.js.
    So now that we have a function, how do we reference it? Take a look at the following
    updates to our notes route:


    | [ch7/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/notes/route.js)
