    \n`isValidEmail` 函数使用正则表达式来判断传入的字符串是否表示一个电子邮件地址。正则表达式是一种捕获数据预期格式（称为模式）的方法，然后使用该模式来验证实际数据是否遵循该格式。\n\
    \n从 `isValidEmail` 中的 `pattern` 变量可以看出，正则表达式通常采用看起来复杂的字符串形式，并且这些模式往往会变得异常庞大。在我们之前的例子中，电子邮件验证只有\
