  trans: "\n\n这也引出了关于默认 Ember 结构的一点：每个独立的路由都对应一个模板。对于应用路由，对应的是 `application.hbs` 模板。对于我们生成的每个路由，如果你使用了\
    \ `--pod` 标志，则对应的是该路由文件夹中定义的 `template.hbs` 模板；否则，模板以路由命名，并位于 `templates` 文件夹中。\n\
    \n现在我们来创建登录路由。该路由需要让用户登录 EmberNote 应用。它应该像注册路由一样，通过主页上的链接访问，并允许之前注册的用户使用用户名登录。用户登录后，应被重定向到他们的笔记本列表（即我们已生成的另一个路由）。此外，用户登录后，注册和登录链接应不再显示。\n\
    \n为此，我们将对以下文件进行修改：\n\n*   `app/template/application.hbs`：添加导航，让用户能够加载登录路由，并在用户登录后隐藏注册和登录导航\n\
    *   `app/login/route.js`：定义登录动作\n*   `app/login/template.hbs`：定义登录路由的用户界面\n\n\
    要访问登录路由，我们首先需要通过 `application.hbs` 文件使其可用。编辑该文件，使其内容如下：\n\n```\n[ch2/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/templates/application.hbs)\n\
    \n<div class=\"container\">\n  <div class=\"row\">\n    <div class=\"col-md-2\"\
    >\n      Welcome to EmberNote\n    </div>\n    <div class=\"col-md-10\">\n   \
    \   {{#if user}}\n        Hello, {{user.name}}\n      {{/if}}\n      {{#unless\
    \ user}}\n        {{#link-to 'register'}}register{{/link-to}}&nbsp;\n        {{#link-to\
    \ 'login'}}login{{/link-to}}\n      {{/unless}}\n    </div>\n  </div>\n  <div\
    \ class=\"row\">\n    <div>\n      {{outlet}}\n    </div>\n  </div>\n</div>\n\
    ```\n\n你首先要对文件添加一个 `{{#if}}` 表达式。该表达式包含的文本仅在表达式求值为 true 时显示。在这里，如果应用控制器的 `user`\
    \ 属性有值，则显示用户名。我们将在接下来查看登录路由时了解这个 `user` 属性是如何设置的。\n\n下一部分位于 `{{#unless}}` 表达式内部，当\
    \ `user` 属性缺失时显示。它包含了注册路由的 `{{#link-to}}` 导航项，以及我们新增的登录路由。\n\n当用户点击登录路由的链接时，他们会被带到\
    \ `localhost:4200/login`。登录模板会被渲染到 `{{outlet}}` 中，这意味着该模板的内容会显示在由 `{{outlet}}`\
    \ 表达式定义的占位符中。定义在 `app/login/template.hbs` 中的登录模板如下所示：\n\n```\n[ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)\n\
    \n<div class=\"col-md-12\">\n  Login: {{input value=name}} <button {{action 'login'}}>Login</button>\n\
    </div>\n```\n\n这个模板是与登录路由关联的唯一模板，只包含两个元素。`{{input}}` 表达式会生成一个 HTML 文本输入字段，并从 `name`\
    \ 属性中获取值。`{{action}}` 表达式会导致在路由中执行登录动作，我们接下来会定义它。\n\n所有这些都在登录路由类中整合在一起，如下所示：\n\
    \n```\n[ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
    \nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  actions:\
    \ {\n    login: function() {\n      this.store.query('user', {\n        name:\
    \ this.controller.get('name')\n      }).then((users) => {\n        if(users.get('length')\
    \ === 1) {\n          var user = users.objectAt(0);\n          this.controllerFor('application').set('user',user);\n\
    \          this.transitionTo('notebooks');\n        }\n        else {\n      \
    \    console.log('unexpected query result');\n        }\n      });\n    }\n  }\n\
    });\n```\n\n正如我们在第 1 章中看到的，这个路由类使用了 ES6 模块语法。类的第一行导入了 Ember 框架，随后在类声明中扩展基础路由类时使用了它。我们使用了匿名声明并导出了该路由。Ember\
    \ CLI 会根据文件路径推断出这个类（尽管是匿名声明的）代表登录路由。\n\n接下来的代码块定义了 `actions` 哈希，它是一个由动作名称和实现组成的键值对列表。我们的登录路由只需要一个动作，即恰如其名的\
    \ `login` 动作。\n\n正如本章前面所述，登录动作会验证请求的用户是否已正确注册，然后显示用户的笔记本列表。接下来的代码块：\n\n```\nthis.store.query('user',\
    \ {\n  name : this.controller.get('name')\n})\n```\n\n使用来自 `template.hbs` 的 `name`\
    \ 字段值作为查询参数，对我们的服务器 API 执行查询。我们接下来会更新 API。\n\n为了让登录路由正常工作，你需要对我们创建的模拟服务器进行一个小修改。打开\
    \ `server/mocks/users.js` 文件，并按如下方式更新 GET 端点：\n\n```\n[ch2/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/users.js)\n\
    \nusersRouter.get('/', function(req, res) {\n  userDB.find(req.query).exec(function(error,users)\
    \ {\n    res.send({\n      'users': users\n    });\n  });\n});\n```\n\nEmber CLI\
    \ 应该已经在你修改时部署了这些更改，但如果由于某种原因没有部署，你可能需要从 `ember-note` 目录运行 `ember serve` 命令来同步。完成后，访问登录路由并尝试登录\
    \ EmberNote。你应该会被重定向到笔记本路由。\n\n由于对 API 的 `store.find` 调用是异步的，它会向登录路由返回一个 Promise\
    \ 对象。Promise 可以描述为一个最终会解析为某个值的对象。根据函数成功或失败，可以执行不同的逻辑。一旦这个 Promise 成功解析，`then`\
    \ 块中的函数就会被执行。首先，我们检查是否只从 API 收到了一行数据。假设确实如此，我们将第一行也是唯一一行数据加载到 `user` 对象中。然后，为了使\
    \ `{{#if}}` 和 `{{#unless}}` 块正常工作，我们在应用控制器中设置 `user` 属性。最后一步是运行 Ember 的导航函数之一\
    \ `transitionTo`。该函数将用户重定向到笔记本路由。\n\n**RSVP：Ember 的 Promise 库**\n\nPromise 是一个广泛使用的概念，但没有标准的实现。ECMAScript\
    \ 2015 预计会包含一个 Promise 实现，但在此之前，Ember 依赖于 RSVP。RSVP 符合 ES 2015 的进行中规范，但现在已经可用。它由\
    \ Ember 核心团队的成员维护，并在 GitHub 上提供：[`github.com/tildeio/rsvp.js`](https://github.com/tildeio/rsvp.js)。\n\
    \n"
- fmt: "\nWe’ve covered more than just routes in this section to let us build a good\
    \ example. The key elements for you to focus on now are the `{{#link-to}}` expression,\
    \ the `transitionTo` function, and the `actions` hash. As used in the `application.hbs`\
    \ template, the `{{#link-to}}` expression allows the user to load the login route’s\
    \ `template.hbs` into the `{{outlet}}` in `application.hbs`, when the resulting\
    \ link is clicked. For this to work, we need the login route defined in `router.js`.\
    \ The `{{link-to}}` expression is one way of causing the parent route to load\
    \ a child route into its outlet.\n\nAnother way to implement navigation is by\
    \ using functions like `transitionTo` to move between routes. As used in the login\
    \ route, it takes the currently loaded route (as determined by the instance calling\
    \ the function), and replaces it with the route named in the function call. As\
    \ noted in our example, we can use this function to indicate not only which route\
    \ to load, but also which record it should load. We’ll see more on how the destination\
    \ route knows which record to load when we look at setting a route’s model shortly.\n\
    \nLast, the `actions` hash is used to define name-value pairs of actions and their\
    \ related functions. This concept isn’t route-specific, and we’ll see more examples\
    \ of this later, but it’s worth noting that one option for action handling is\
    \ to add your actions to a route in this way.\n\nNow we understand more of what\
    \ a route is and how it’s used, let’s take a look at how to use a route to load\
    \ and display data via the route’s model hook.\n\n## Set Your Model\n\nWhen we’re\
    \ working with a route, the model hook is used to load and supply the necessary\
    \ data. As we’ve seen, not every route will implement its model hook, but most\
    \ will. The model hook is a function, defined within an instance of a `Route`\
    \ class, that loads the data to be displayed by that route.\n\nIn the EmberNote\
    \ app, we haven’t yet built a route that makes use of the model hook. Let’s do\
    \ so now. When a user signs in via the login action, we use the `transitionTo`\
    \ function to transition to the notebooks route. Let’s define that route now,\
    \ and along the way we’ll see how to use the model hook.\n\nThe notebooks route\
    \ has a simple purpose: to display a list of the notebooks a user has created\
    \ in EmberNote. A notebook is a collection of notes, so clicking on a notebook\
    \ in the notebooks route will then display a list of that notebook’s notes. Here’s\
    \ the notebooks route:\n\n[`ch2/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  model: function(params) {\n    return this.store.query('notebook',{user: params.user_id});\n\
    \  },\n  actions: {\n  }\n});\n```\n\nSimilar to the login route, notebooks uses\
    \ the ES6 module format and begins with the necessary import statement. Further,\
    \ we defined it using the `--pod` command-line flag, so the file is called `route.js`\
    \ and resides in the `app/notebooks` path, and the definition uses the `export\
    \ default Ember.Route.extend` form.\n\nThe model hook is the first block in the\
    \ body of our Route. It’s defined as a function, which is executed by Ember when\
    \ the route is loaded. You’ll also note that an object, known as `params`, is\
    \ passed to this function. We’ll come back to this shortly.\n\nThe body of the\
    \ model hook contains some Ember Data code to load the logged-in user’s notebooks.\
    \ We’ll cover Ember Data further in Chapter 5, [Modeling Your Data](#f_0035.html_chp.models),\
    \ so let’s focus on the route-specific portions of the code now. This line of\
    \ code causes Ember Data to query for notebook objects that are owned by the user\
    \ with `params.user_id`. So where does this `user_id` come from?\n\nTo provide\
    \ the `params` object to the route, and specifically the `user_id`, we need to\
    \ use a path segment in our route definition. Let’s look at the definition of\
    \ the notebooks route in the `router.js` file:\n\n[`ch2/ember-note/app/router.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)\n\
    \n```javascript\nthis.route('notebooks', { path:'notebooks/:user_id'}, function()\
    \ {});\n```\n\nThis is how you use the `Router` class to define a route with a\
    \ path segment. In Ember, a path segment is used to provide a value that can be\
    \ used to load a record in the route. For this route, we’re using the id of the\
    \ logged-on user to identify the notebooks we want to load. Defining your route\
    \ this way in the `Router` class, and then using the `params` object in the `Route`,\
    \ allows you to provide the data necessary to load the notebooks. Of course, the\
    \ object that initiated the navigation to this route needs to add that data to\
    \ the path in the first place. In our case, we need to modify the `transitionTo`\
    \ function in the login route to provide this data:\n\n[`ch2/ember-note/app/login/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
    \n```javascript\nthis.transitionTo('notebooks', user.get('id'));\n```\n\nWith\
    \ the correct data, we’re able to initiate a query against our API to get the\
    \ current user’s notebook data.\n\n> **Security Note**\n> \n> ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ Using path segments to pass data between routes is an extremely useful feature\
    \ of Ember, but it’s easy to use in a way that can be insecure. Placing cleartext\
    \ data in your URL is a potential risk, given that it’s easy for a malicious user\
    \ to change in an attempt to break your application’s security. This is known\
    \ as a direct object reference vulnerability, and you can read more about it at\
    \ [https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References](https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References).\n\
    \nNext, we need to define the notebook API. To do this, run the following command\
    \ to create the mock service and provide a REST service to our route:\n\n`$ ember\
    \ generate http-mock notebooks`\n\nWe then populate the resulting file with the\
    \ following code (I won’t go through the full explanation of what’s happening;\
    \ it’s in essence the same code as we used for the users service in [Adding a\
    \ Data Service](#f_0013.html_user-data-service)):\n\n[`ch2/ember-note/server/mocks/notebooks.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/notebooks.js)\n\
    \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
    \  var notebooksRouter = express.Router();\n  var bodyParser = require('body-parser');\n\
    \  app.use(bodyParser.json());\n  var nedb = require('nedb');\n  var notebookDB\
    \ = new nedb({ filename : 'notebooks', autoload: true});\n\n  notebooksRouter.get('/',\
    \ function(req, res) {\n    notebookDB.find(req.query).exec(function(error,notebooks)\
    \ {\n      res.send({\n        'notebooks': notebooks\n      });\n    });\n  });\n\
    \n  notebooksRouter.post('/', function(req, res) {\n    notebookDB.find({}).sort({id\
    \ : -1}).limit(1).exec(\n      function(err,notebooks) {\n        if(notebooks.length\
    \ != 0)\n          req.body.notebook.id = notebooks[0].id + 1;\n        else\n\
    \          req.body.notebook.id = 1;\n        notebookDB.insert(req.body.notebook,function(err,newNotebook)\
    \ {\n          res.status(201);\n          res.send(\n            JSON.stringify(\n\
    \              {\n                notebook : newNotebook\n              }));\n\
    \        });\n      })\n  });\n\n  notebooksRouter.get('/:id', function(req, res)\
    \ {\n    res.send({\n      'notebooks': {\n        id: req.params.id\n      }\n\
    \    });\n  });\n\n  notebooksRouter.put('/:id', function(req, res) {\n    res.send({\n\
    ```\n"
  raw: 'We’ve covered more than just routes in this section to let us build a good
    example. The key elements for you to focus on now are the {{#link-to}} expression,
    the transitionTo function, and the actions hash. As used in the application.hbs
    template, the {{#link-to}} expression allows the user to load the login route’s
    template.hbs into the {{outlet}} in application.hbs, when the resulting link is
    clicked. For this to work, we need the login route defined in router.js. The {{link-to}}
    expression is one way of causing the parent route to load a child route into its
    outlet.


    Another way to implement navigation is by using functions like transitionTo to
    move between routes. As used in the login route, it takes the currently loaded
    route (as determined by the instance calling the function), and replaces it with
    the route named in the function call. As noted in our example, we can use this
    function to indicate not only which route to load, but also which record it should
    load. We’ll see more on how the destination route knows which record to load when
    we look at setting a route’s model shortly.


    Last, the actions hash is used to define name-value pairs of actions and their
    related functions. This concept isn’t route-specific, and we’ll see more examples
    of this later, but it’s worth noting that one option for action handling is to
    add your actions to a route in this way.


    Now we understand more of what a route is and how it’s used, let’s take a look
    at how to use a route to load and display data via the route’s model hook.


    ## Set Your Model


    When we’re working with a route, the model hook is used to load and supply the
    necessary data. As we’ve seen, not every route will implement its model hook,
    but most will. The model hook is a function, defined within an instance of a Route
    class, that loads the data to be displayed by that route.


    In the EmberNote app, we haven’t yet built a route that makes use of the model
    hook. Let’s do so now. When a user signs in via the login action, we use the transitionTo
    function to transition to the notebooks route. Let’s define that route now, and
    along the way we’ll see how to use the model hook.


    The notebooks route has a simple purpose: to display a list of the notebooks a
    user has created in EmberNote. A notebook is a collection of notes, so clicking
    on a notebook in the notebooks route will then display a list of that notebook’s
    notes. Here’s the notebooks route:


    | [ch2/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)
    |


