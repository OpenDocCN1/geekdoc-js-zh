    \ 2015，The Pragmatic Bookshelf。\n\n# 第 2 章\n\n用路由引导流量\n\n现在我们已经安装了 Ember 和 Ember\
    \ CLI，并用它们创建了一个允许用户注册的应用程序，我们准备深入探讨 Ember 的主要特性。我们要看的第一个特性是 Ember 路由。正如我在第 1 章中提到的，路由的概念是\
    \ Ember 背后的核心原则之一。路由是应用程序功能单个单元的起点。路由的层次结构构成了应用程序的组织结构。\n\n路由在 Ember 中非常重要。幸运的是，它们也是一个很好的起点。在本章中，我们将学习如何使用\
