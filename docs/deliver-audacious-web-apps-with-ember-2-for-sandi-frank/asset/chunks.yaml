    \ of Ember’s opinionated structure so that you can apply sound design to EmberNote’s\
    \ logic. Let’s get started by looking at the most basic level of abstraction:\
    \ the utility class.\n\n## Abstract Common Functions with Utilities\n\nOne way\
    \ to share code between objects is to create a simple utility function. Ember\
    \ CLI includes a blueprint for creating a utility function that can be imported\
