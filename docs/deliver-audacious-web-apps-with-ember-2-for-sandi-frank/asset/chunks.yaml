  trans: "\n\n值得注意的是，虽然我们将使用 `Node` 来运行 `Ember CLI` 开发工具，但 `Ember` 本身并非服务器端框架，尽管 `Node`\
    \ 支持服务器端 JavaScript 开发。`Ember` 用于创建浏览器端应用。\n\n首先，让我们安装 `Node`^[[3]](#f_0014.html_FOOTNOTE-3)\
    \ 和 `npm`^[[4]](#f_0014.html_FOOTNOTE-4)，以及 `Git`^[[5]](#f_0014.html_FOOTNOTE-5)。`Node`\
    \ 自带 `npm`，但 `npm` 更新频繁，因此最好确认你拥有最新版本。请访问相应网站，为你的特定平台安装这些工具的最新版本。你的 `Node` 安装版本至少应为\
    \ 0.12，以支持 `Ember CLI` 工具。如果你已经安装了 `Node`，可能需要先卸载现有版本。\n\n后两个工具是 `Bower` 所必需的。`npm`\
    \ 是一个包管理器，用于管理在 `Node` 中运行的代码，或与在 `Node` 中运行的工具配合使用。`Git` 是一个分布式版本控制系统。请按照各自网站的安装说明安装这三个工具。\n\
    \n| 安装 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | 安装这些工具时，你需要以管理员身份运行。在\
    \ Linux/BSD/OS X 系统上，你可能需要使用 `sudo` 前缀；在 Windows 上，你需要以具有管理员权限的用户身份登录。与许多安装过程一样，可能会出现一些问题，因此如果遇到问题，请访问本书论坛\
    \ [`pragprog.com`](http://pragprog.com)，我们将一起解决。 |\n\n安装好这些工具后，你可以通过命令行获取 `Bower`：\n\
    \n```\n$ npm install -g bower\n```\n\n你会看到几行命令输出，表明 `Bower` 及其依赖项已下载到你的机器上。`-g`\
    \ 命令选项要求 `Node` 全局安装 `Bower`，使其对所有项目可用，而不仅限于特定项目。`Bower` 安装完成后（你会看到命令输出停止并返回命令提示符），你可以安装\
    \ `PhantomJS`：\n\n```\n$ npm install -g phantomjs\n```\n\n同样，你会看到一些命令输出，告诉你 `PhantomJS`\
    \ 已成功安装。有了这些工具，你就可以安装 `Ember CLI` 了：\n\n```\n$ npm install -g ember-cli\n```\n\
    \n安装 `Ember CLI` 会同时安装 `Ember` 框架库和 CLI 本身。现在你已经有了 `Ember` 和 `Ember CLI`，我们可以开始编码了。\n\
    \n## 启动你的应用\n\n`Ember CLI` 采用了一种以应用为中心的方法。你要做的第一件事就是创建应用，而你创建的每个模块都是该应用的一部分。因此，我们将遵循这一思路，在一个应用的上下文中探索\
    \ `Ember` 的所有关键概念。\n\n我们将编写一个名为 `EmberNote` 的应用，它是基于网页的笔记应用 `Evernote`^[[6]](#f_0014.html_FOOTNOTE-6)\
    \ 的精简克隆版。第一步是创建应用的仓库（之所以这样称呼，是因为 `Ember CLI` 假定你将使用 `Git` 作为版本控制系统）。\n\n### 创建应用仓库\n\
    \n打开命令提示符，导航到你存放代码的位置，然后运行以下命令：\n\n```\n$ ember new ember-note\n```\n\n这将为你的应用创建一个新目录。如果出现任何问题，请查看下面的提示。\n\
    \n| 使用 Ember CLI 创建新项目 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ | 在撰写本文时，`Ember CLI` 在创建新仓库时可能会出现一个竞态条件。如果你看到类似这样的错误：`ENOENT, open ’ember/package.json’`，那么你可能遇到了这个错误。通常，第二次尝试\
    \ `ember new` 命令就会成功。在某些非 Windows 系统上，你可能还会看到一条控制台警告，提示未安装 `watchman`。`Ember CLI`\
    \ 使用 `watchman` 来监控文件系统的更改，并在你处理 `Ember` 应用时实时部署到本地服务器。安装 `watchman` 是好的做法，即使只是为了避免看到这个错误，但它并非必需。如果没有\
    \ `watchman`，`Ember CLI` 会使用一个名为 `NodeWatcher` 的工具来实现相同目的。如果你想安装 `watchman`，请访问\
    \ [`facebook.github.io/watchman/docs/install.html`](https://facebook.github.io/watchman/docs/install.html)\
    \ 查看特定平台的安装说明。 |\n\n在编写 UI 代码之前，让我们先安装一个 `Bootstrap` 样式表，这样我们就能拥有一个看起来不像 20 世纪\
    \ 90 年代初期的 UI。在新建的 `ember-note` 目录中，从命令提示符运行以下命令：\n\n```\n$ cd ember-note\n$ npm\
    \ install\n$ bower install\n$ bower install bootstrap --save\n```\n\n然后将以下行添加到\
    \ `ember-note/ember-cli-build.js` 中，放在最后一行代码之前：\n\n```\napp.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
    app.import('bower_components/bootstrap/dist/css/bootstrap.css.map',{\n  destDir:\
    \ 'assets'\n});\n```\n\n运行这些命令时，`Ember CLI` 会为你创建应用的文件夹结构。在本书剩余部分，我们的任务就是利用这个结构，填充所有细节，使其成为一个应用。毫无疑问，`Ember`\
    \ 和 `Ember CLI` 是固执己见的工具。它们对如何开发 Web 应用有内置的期望，这被称为“约定优于配置”。`Ember` 团队希望将一组最佳实践整合到框架中，让开发者专注于更重要的决策。要充分利用这些工具，你需要遵循它们的引导。\n\
    \n### 运行你的应用\n\n让我们运行我们创建的应用，看看它是什么样子。在新建的 `ember-note` 目录中，从命令提示符运行以下命令：\n\n\
    ```\n$ ember serve\n```\n\n你会看到一些命令输出，告诉你构建成功，并且你的应用正在本地主机的 4200 端口上运行。让我们打开浏览器检查一下。如果你将浏览器指向\
    \ `localhost:4200`，应该会看到类似下图中显示的输出。\n\n![images/welcome.png](img/welcome.png)\n\
    \n`ember serve` 命令为你做了几件事。首先，它构建了一个可部署版本的应用，并将其放在 `ember-note/dist` 目录中。然后，它在\
    \ 4200 端口启动了一个 `node` 实例，并将你的应用部署到该实例进行测试。一旦运行了这个命令，它就会检测你对源代码所做的更改。\n\n现在让我们尝试一个更改。打开\
    \ `ember-note/app/templates/application.hbs` 文件。其内容应如下所示：\n\n```\n<h2 id=\"title\"\
    >Welcome to Ember</h2>\n\n{{outlet}}\n```\n\n修改文件，使文本显示为“Welcome to EmberNote”。文件内容应如下所示：\n\
    \n```\n<h2 id=\"title\">Welcome to EmberNote</h2>\n\n{{outlet}}\n```\n\n保存更改后，立即查看你的浏览器。`Ember\
    \ CLI` 检测到了更改，重新构建了你的应用，并在你保存时进行了部署。这大大节省了时间，因为你无需手动执行重新部署应用的步骤。这一切都通过 `Ember\
    \ CLI` 开箱即用！\n\n你可以看到 `Ember CLI` 是一个很方便的工具。现在是时候进入代码部分了。如果我们要构建一个应用，我们需要让用户能够注册，对吧？让我们从这里开始。\n\
    \n### 注册用户\n\n让我们看一个简单的示例，它将演示 `Ember` 应用的许多核心功能：路由、模板和模型。我们将构建一个简化的注册页面，允许用户注册\
    \ `EmberNote` 服务。这个页面有一个文本字段，用户可以在其中输入用户名，一个触发添加操作的按钮，以及一些在添加新用户时显示的文本。\n\n"
- fmt: "\nIn an Ember app, all of your functionality is organized under routes. A\
    \ route is in essence a URL segment, as described in [*Nest Routes*](#f_0019.html_nesting-routes).\
    \ So, our next step is to use Ember CLI to create a route. Open a new command\
    \ shell, and from the root of your `ember-note` project, run the following command:\n\
    \n`$ ember generate route register --pod`\n\nThe `--pod` flag, when added to the\
    \ `generate` command, creates a directory called `register`, which includes the\
    \ files that are needed to add your route: `route.js` and `template.hbs`. They\
    \ are empty at the moment, and you’ll fill them out as needed to create the route’s\
    \ features. Generally speaking, you use a pod when you want to organize your project\
    \ by feature (that is, create a `register` directory with a `route.js` and a `template.hbs`\
    \ file), rather than by object type.\n\nEarlier, when you created the app with\
    \ the `ember new` command, the following four files were created: `index.html`,\
    \ `app.js`, `router.js`, and `application.hbs`. The `ember generate` command then\
    \ edits the `router.js` file under your app directory. We’ll dig into this more\
    \ in [*Use the Router Class to Organize Your App*](#f_0016.html_router), but the\
    \ `router.js` class is used to implement the hierarchy of routes within your application.\n\
    \nIf you run the `ember generate` command but leave off the `--pod` flag, Ember\
    \ CLI still creates the same objects, but instead of creating a file called `route.js`\
    \ in the `register` directory, it creates a file called `register.js` in the `route`\
    \ directory. For our purposes, it’s preferable to see each of the files we need\
    \ for a route in one location, so we’ll use the `--pod` flag throughout the book.\n\
    \nLet’s take a look at each of the files we’ve created so far.\n\n#### index.html\n\
    \nThis file is the starting point for your application. It was created when you\
    \ ran the `ember new ember-note` command. Let’s have a look.\n\n[ch1/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/index.html)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=edge\">\n<title>EmberNote</title>\n<meta name=\"\
    description\" content=\"\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n\n{{content-for 'head'}}\n\n<link rel=\"stylesheet\" href=\"\
    assets/vendor.css\">\n<link rel=\"stylesheet\" href=\"assets/ember-note.css\"\
    >\n\n{{content-for 'head-footer'}}\n</head>\n<body>\n{{content-for 'body'}}\n\n\
    <script src=\"assets/vendor.js\"></script>\n<script src=\"assets/ember-note.js\"\
    ></script>\n\n{{content-for 'body-footer'}}\n</body>\n</html>\n```\n\nThe majority\
    \ of `index.html` is boilerplate HTML to create a starting page. Ember CLI adds\
    \ in two stylesheets named `vendor.css` and `ember-note.css` to style the application.\
    \ We won’t be doing much with stylesheets in this book, but you should know that\
    \ `vendor.css` will capture styles used in any third-party code you bring into\
    \ the app, and `ember-note.css` is for styles that you define.\n\nThe same thing\
    \ applies to `vendor.js` and `ember-note.js`. The Ember CLI build process creates\
    \ one file for all of the third-party code you use in your app, called `vendor.js`,\
    \ and one for your application code, called `ember-note.js`. These are included\
    \ in `index.html`.\n\nYou may also notice the `{{content-for}}` expressions. These\
    \ allow you to include additional content in your page using Ember CLI addons.\n\
    \n#### app.js\n\nThe `app.js` file is used to create the Ember environment. Take\
    \ a look at the following code:\n\n[ch1/ember-note/app/app.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/app.js)\n\
    \n```javascript\nimport Ember from 'ember';\nimport Resolver from 'ember/resolver';\n\
    import loadInitializers from 'ember/load-initializers';\nimport config from './config/environment';\n\
    \nvar App;\n\nEmber.MODEL_FACTORY_INJECTIONS = true;\n\nApp = Ember.Application.extend({\n\
    \  modulePrefix: config.modulePrefix,\n  podModulePrefix: config.podModulePrefix,\n\
    \  Resolver: Resolver\n});\n\nloadInitializers(App, config.modulePrefix);\n\n\
    export default App;\n```\n\nIf you’re a veteran JavaScript developer who hasn’t\
    \ looked at ECMAScript 2015 yet, the first four lines may have your eyes popping\
    \ out of your head. ECMAScript is the formal name of the JavaScript language as\
    \ specified by ECMA International, and ECMAScript 2015 (also known as ECMAScript\
    \ 6 or ES6) is the latest release of the standard. Yes, those four lines are importing\
    \ dependencies from other JavaScript files to use their modules within the current\
    \ module. This is a hugely important aspect of using Ember CLI. When you start\
    \ writing your code in a modular fashion, your dependencies become easier to reason\
    \ about, and you eliminate the need to stuff objects into the global scope. It\
    \ also helps you to structure your code in a way that makes sense. Don’t worry\
    \ whether the browser supports ECMAScript 2015, though. Ember CLI transpiles your\
    \ code into a format that the browser can execute.\n\nThe purpose of the code\
    \ in `app.js` is to set up app-wide constructs. One of these, the Ember Resolver,\
    \ is used to look up classes throughout the app. The `modulePrefix` variable is\
    \ set to the value `ember-note`, as defined when you set up your app. The `podModulePrefix`\
    \ isn’t set, as it wasn’t defined yet for our project configuration, which was\
    \ read from `config/environment.js`.\n\nThe last line of the file makes the `App`\
    \ class available as a module. Don’t worry if this doesn’t quite make sense yet—you’ll\
    \ see many more examples of how Ember modules work as we go along. For now, let’s\
    \ look at another file that was created when the app was set up, the `router.js`\
    \ file.\n\n#### router.js\n\nThe `router.js` file is where you can really start\
    \ to see how Ember works. One of the most fundamental features of Ember is the\
    \ notion of a route. Simply put, a route is a location within your app. If you\
    \ think of your app as a collection of pages or page sections, each nested within\
    \ one another, then each of those pages corresponds to a route. And the `Router`\
    \ class, as defined in `router.js`, is where you define the structure of your\
    \ app. Let’s look at the code:\n\n[ch1/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/router.js)\n\
    \n```javascript\nimport Ember from 'ember';\nimport config from './config/environment';\n\
    \nvar Router = Ember.Router.extend({\n  location: config.locationType\n});\n\n\
    Router.map(function() {\n  this.route('register');\n});\n\nexport default Router;\n\
    ```\n\nAt the top of the `router.js` file you see the necessary imports. In the\
    \ class definition, which begins with `var Router = Ember.Router.extend`, we’re\
    \ bringing in some configuration variables from the global configuration as defined\
    \ when we set up the app.\n"
  raw: 'In an Ember app, all of your functionality is organized under routes. A route
    is in essence a URL segment, as described in [​*Nest Routes*​](#f_0019.html_nesting-routes).
    So, our next step is to use Ember CLI to create a route. Open a new command shell,
    and from the root of your ember-note project, run the following command:


    | ​  | $ ember generate route register --pod |


    The --pod flag, when added to the generate command, creates a directory called
    register, which includes the files that are needed to add your route: route.js
    and template.hbs. They are empty at the moment, and you’ll fill them out as needed
    to create the route’s features. Generally speaking, you use a pod when you want
    to organize your project by feature (that is, create a register directory with
    a route.js and a template.hbs file), rather than by object type.


    Earlier, when you created the app with the ember new command, the following four
    files were created: index.html, app.js, router.js, and application.hbs. The ember
    generate command then edits the router.js file under your app directory. We’ll
    dig into this more in [​*Use the Router Class to Organize Your App*​](#f_0016.html_router),
    but the router.js class is used to implement the hierarchy of routes within your
    application.


    If you run the ember generate command but leave off the --pod flag, Ember CLI
    still creates the same objects, but instead of creating a file called route.js
    in the register directory, it creates a file called register.js in the route directory.
    For our purposes, it’s preferable to see each of the files we need for a route
    in one location, so we’ll use the --pod flag throughout the book.


    Let’s take a look at each of the files we’ve created so far.


    #### index.html


    This file is the starting point for your application. It was created when you
    ran the ember new ember-note command. Let’s have a look.


    | [ch1/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/index.html)
    |


    | ​  | <!DOCTYPE html> |


    | ​  | ​**<html>**​ |


    | ​  | ​**<head>**​ |


    | ​  | ​**<meta**​ charset=​*"utf-8"*​​**>**​ |


    | ​  | ​**<meta**​ http-equiv=​*"X-UA-Compatible"*​ content=​*"IE=edge"*​​**>**​
    |


    | ​  | ​**<title>**​EmberNote​**</title>**​ |


    | ​  | ​**<meta**​ name=​*"description"*​ content=​*""*​​**>**​ |


    | ​  | ​**<meta**​ name=​*"viewport"*​ content=​*"width=device-width, initial-scale=1"*​​**>**​
    |


    | ​  |  |


    | ​  | {{content-for ''head''}} |


    | ​  |  |


    | ​  | ​**<link**​ rel=​*"stylesheet"*​ href=​*"assets/vendor.css"*​​**>**​ |


    | ​  | ​**<link**​ rel=​*"stylesheet"*​ href=​*"assets/ember-note.css"*​​**>**​
    |


    | ​  |  |


    | ​  | {{content-for ''head-footer''}} |


    | ​  | ​**</head>**​ |


    | ​  | ​**<body>**​ |


    | ​  | {{content-for ''body''}} |


    | ​  |  |


    | ​  | ​**<script**​ src=​*"assets/vendor.js"*​​**>**​​**</script>**​ |


    | ​  | ​**<script**​ src=​*"assets/ember-note.js"*​​**>**​​**</script>**​ |


    | ​  |  |


    | ​  | {{content-for ''body-footer''}} |


    | ​  | ​**</body>**​ |


    | ​  | ​**</html>**​ |


    The majority of index.html is boilerplate HTML to create a starting page. Ember
    CLI adds in two stylesheets named vendor.css and ember-note.css to style the application.
    We won’t be doing much with stylesheets in this book, but you should know that
    vendor.css will capture styles used in any third-party code you bring into the
    app, and ember-note.css is for styles that you define.


    The same thing applies to vendor.js and ember-note.js. The Ember CLI build process
    creates one file for all of the third-party code you use in your app, called vendor.js,
    and one for your application code, called ember-note.js. These are included in
    index.html.


    You may also notice the {{content-for}} expressions. These allow you to include
    additional content in your page using Ember CLI addons.


    #### app.js


    The app.js file is used to create the Ember environment. Take a look at the following
    code:


    | [ch1/ember-note/app/app.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/app.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ Resolver from ​*''ember/resolver''*​; |


    | ​  | ​**import**​ loadInitializers from ​*''ember/load-initializers''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ App; |


    | ​  |  |


    | ​  | Ember.MODEL_FACTORY_INJECTIONS = true; |


    | ​  |  |


    | ​  | App = Ember.Application.extend({ |


    | ​  | modulePrefix: config.modulePrefix, |


    | ​  | podModulePrefix: config.podModulePrefix, |


    | ​  | Resolver: Resolver |


    | ​  | }); |


    | ​  |  |


    | ​  | loadInitializers(App, config.modulePrefix); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ App; |


    If you’re a veteran JavaScript developer who hasn’t looked at ECMAScript 2015
    yet, the first four lines may have your eyes popping out of your head. ECMAScript
    is the formal name of the JavaScript language as specified by ECMA International,
    and ECMAScript 2015 (also known as ECMAScript 6 or ES6) is the latest release
    of the standard. Yes, those four lines are importing dependencies from other JavaScript
    files to use their modules within the current module. This is a hugely important
    aspect of using Ember CLI. When you start writing your code in a modular fashion,
    your dependencies become easier to reason about, and you eliminate the need to
    stuff objects into the global scope. It also helps you to structure your code
    in a way that makes sense. Don’t worry whether the browser supports ECMAScript
    2015, though. Ember CLI transpiles your code into a format that the browser can
    execute.


    The purpose of the code in app.js is to set up app-wide constructs. One of these,
    the Ember Resolver, is used to look up classes throughout the app. The modulePrefix
    variable is set to the value ember-note, as defined when you set up your app.
    The podModulePrefix isn’t set, as it wasn’t defined yet for our project configuration,
    which was read from config/environment.js.


    The last line of the file makes the App class available as a module. Don’t worry
    if this doesn’t quite make sense yet—you’ll see many more examples of how Ember
    modules work as we go along. For now, let’s look at another file that was created
    when the app was set up, the router.js file.


    #### router.js


    The router.js file is where you can really start to see how Ember works. One of
    the most fundamental features of Ember is the notion of a route. Simply put, a
    route is a location within your app. If you think of your app as a collection
    of pages or page sections, each nested within one another, then each of those
    pages corresponds to a route. And the Router class, as defined in router.js, is
    where you define the structure of your app. Let’s look at the code:


    | [ch1/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/router.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ Router = Ember.Router.extend({ |


    | ​  | location: config.locationType |


    | ​  | }); |


    | ​  |  |


    | ​  | Router.map(​**function**​() { |


    | ​  | this.route(​*''register''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Router; |


    At the top of the router.js file you see the necessary imports. In the class definition,
    which begins with var Router = Ember.Router.extend, we’re bringing in some configuration
    variables from the global configuration as defined when we set up the app.'
