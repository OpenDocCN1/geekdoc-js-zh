    \ 类的实现是你定义单个路由行为的方式。\n\n为了更深入地了解路由，我们将通过构建应用程序的导航结构来逐步拼凑 EmberNote 的更多功能。到本章结束时，你将完成\
    \ EmberNote 的大部分路由结构，并知道如何编写在路由之间导航的代码。\n\n## 使用 Router 类组织你的应用程序\n\n在上一章中，我们为\
    \ EmberNote 创建了 `register` 路由。可以想象，Ember 应用程序由许多路由组成，每个路由在应用程序中都是唯一的。这些路由共同构成了应用程序中不同位置的层次结构，暴露了层次结构中每个位置特有的功能。Ember\
    \ 将这个层次结构记录在一个单独的类中，即 `Router` 类，如下图所示。\n\n![images/router-and-routes.png](img/router-and-routes.png)\n\
    \n因为我们使用 Ember CLI 来管理应用程序，所以我们不会经常直接编辑 EmberNote 的 `Router`。大多数时候，我们会让 Ember\
    \ CLI 为我们进行编辑。\n\n让我们看一个这样的例子。上次我们处理 EmberNote 时，我们的 `Router` 类是这样的：\n\n[ch2/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)\n\
    \n```\nimport Ember from 'ember';\nimport config from './config/environment';\n\
    \nvar Router = Ember.Router.extend({\n  location: config.locationType\n});\n\n\
    Router.map(function() {\n  this.route('register');\n});\n\nexport default Router;\n\
    ```\n\n让我们向应用程序添加几个路由，看看 `Router` 会发生什么。当用户打开 EmberNote 应用程序时，他们可以注册，或者如果已经注册，则可以登录。登录后，他们将看到他们的笔记本列表。现在让我们添加两个路由，让用户登录并查看他们的笔记本。在你的\
    \ `ember-note` 目录中，运行以下命令：\n\n```\n$ ember generate route login --pod\n$ ember\
    \ generate route notebooks --pod\n```\n\n运行这些命令后，你应该会在路由器中看到两行新内容：\n\n```\nthis.route('login');\n\
    this.route('notebooks');\n```\n\n很棒的是，Ember CLI 会在你创建新路由时自动添加它们，而不会清除路由器中已有的更改。\n\
    \n`Router` 现在包含了我们通过 Ember CLI 生成的两个新路由。我们现在可以通过构建它们的类来定义 `login` 和 `notebooks`\
    \ 路由。\n\n我们将在整本书中创建更多路由，并且会经常回顾 `Router` 类。定期回顾这个类是一个好习惯，有助于我们保持方向感并牢记整体应用程序结构。现在，让我们通过处理\
    \ `login` 路由来看看如何定义路由。\n\n## 定义你的路由\n\n如前所述，每个路由对应应用程序中的一个给定 URL。我们在应用程序中定义了四个路由，对应以下\
    \ URL：\n\n*   http://localhost:4200\n*   http://localhost:4200/register\n*   http://localhost:4200/login\n\
    *   http://localhost:4200/notebooks\n\n我们在第一章中定义了 `register`，并且刚刚生成了 `login` 和\
    \ `notebook` 的类。这些路由的名称和路径与 `router.js` 中的定义相对应。\n\n你可能想知道我们何时定义了根 URL。答案是我们在创建应用程序时定义了它。这个路由被称为\
    \ `application` 路由，它使用了 Ember 对 `Route` 类的默认实现。我们在第一章中修改了一个名为 `application.hbs`\
    \ 的文件。这个文件包含了 `application` 路由的模板。通过简单地使用 Ember CLI 创建项目，并借助 Ember 对默认功能的依赖，我们定义了\
    \ `application` 路由。\n\n"
- fmt: "\nThis also raises one point about the default Ember structure. Each individual\
    \ route corresponds to exactly one template. For the application route, this is\
    \ the `application.hbs` template. For each of our generated routes, it’s the `template.hbs`\
    \ template as defined in the route’s folder, assuming you’ve used the `--pod`\
    \ flag; otherwise the template is named for the route, and lives in the `templates`\
    \ folder.\n\nLet’s create the login route now. This route needs to let the user\
    \ sign into the EmberNote application. It should be available from a link on the\
    \ main page, just like register was, and let previously registered users sign\
    \ in with their usernames. Once they’ve signed in, they should be taken to their\
    \ list of notebooks (the other route we’ve generated so far). Further, once they’ve\
    \ signed in, the register and login links should no longer appear.\n\nTo do this,\
    \ we’re going to make changes to the following files:\n\n*   `app/template/application.hbs`:\
    \ To add navigation to let the user load the login route, and to hide navigation\
    \ to register and login once the user has logged in\n*   `app/login/route.js`:\
    \ To define the login action\n*   `app/login/template.hbs`: To define the user\
    \ interface for the login route\n\nTo reach the login route, we need to first\
    \ make it available via the `application.hbs` file. Edit this file so it looks\
    \ like the following:\n\n```\n[ch2/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/templates/application.hbs)\n\
    \n<div class=\"container\">\n  <div class=\"row\">\n    <div class=\"col-md-2\"\
    >\n      Welcome to EmberNote\n    </div>\n    <div class=\"col-md-10\">\n   \
    \   {{#if user}}\n        Hello, {{user.name}}\n      {{/if}}\n      {{#unless\
    \ user}}\n        {{#link-to 'register'}}register{{/link-to}}&nbsp;\n        {{#link-to\
    \ 'login'}}login{{/link-to}}\n      {{/unless}}\n    </div>\n  </div>\n  <div\
    \ class=\"row\">\n    <div>\n      {{outlet}}\n    </div>\n  </div>\n</div>\n\
    ```\n\nThe first addition you’ll make to the file is an `{{#if}}` expression.\
    \ The text contained within this expression is only displayed if the expression\
    \ evaluates to true. In this case, if the application controller has a value in\
    \ the `user` attribute, the user’s name is displayed. We’ll see how this `user`\
    \ attribute is set when we look at the login route next.\n\nThe next section,\
    \ inside the `{{#unless}}` expression, is displayed if the `user` attribute is\
    \ missing. It contains the `{{#link-to}}` navigation item for the register route,\
    \ and our new login route as well.\n\nWhen users click the link to the login route,\
    \ they’re taken to `localhost:4200/login`. The login template is rendered into\
    \ the `{{outlet}}`, meaning that the content of that template is displayed in\
    \ the placeholder defined by the `{{outlet}}` expression. The login template,\
    \ defined in `app/login/template.hbs`, looks like this:\n\n```\n[ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)\n\
    \n<div class=\"col-md-12\">\n  Login: {{input value=name}} <button {{action 'login'}}>Login</button>\n\
    </div>\n```\n\nThis template, which is the single template associated to the login\
    \ route, has a mere two elements. The `{{input}}` expression results in an HTML\
    \ text input field being displayed and takes its value from the `name` attribute.\
    \ The `{{action}}` expression results in the login action being executed in the\
    \ Route, which we define next.\n\nAll of this ties together in the login route\
    \ class, like this:\n\n```\n[ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
    \nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  actions:\
    \ {\n    login: function() {\n      this.store.query('user', {\n        name:\
    \ this.controller.get('name')\n      }).then((users) => {\n        if(users.get('length')\
    \ === 1) {\n          var user = users.objectAt(0);\n          this.controllerFor('application').set('user',user);\n\
    \          this.transitionTo('notebooks');\n        }\n        else {\n      \
    \    console.log('unexpected query result');\n        }\n      });\n    }\n  }\n\
    });\n```\n\nAs we saw in Chapter 1, this Route class uses the ES6 module syntax.\
    \ The first line of the class imports the Ember framework, which is then used\
    \ when we extend the base Route class in our class declaration. We’re using an\
    \ anonymous declaration and export of the Route. Ember CLI takes the path to the\
    \ file and uses it to conclude that this class, though declared anonymously, represents\
    \ the login route.\n\nThe next block of code defines the actions hash, which is\
    \ a name-value pair listing of action names and implementations. Our login route\
    \ requires only one action, the aptly named login action.\n\nAs described earlier\
    \ in this chapter, the login action verifies that the requested user has properly\
    \ registered, and then displays the list of the user’s notebooks. The next block,\n\
    \n```\nthis.store.query('user', {\n  name : this.controller.get('name')\n})\n\
    ```\n\nexecutes a query against our server API using the value of the `name` field\
    \ from `template.hbs` as a query parameter. We’ll update the API next.\n\nFor\
    \ your login route to work, you need to make a small change to the mock server\
    \ we created. Open your `server/mocks/users.js` file and update the get endpoint\
    \ as follows:\n\n```\n[ch2/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/users.js)\n\
    \nusersRouter.get('/', function(req, res) {\n  userDB.find(req.query).exec(function(error,users)\
    \ {\n    res.send({\n      'users': users\n    });\n  });\n});\n```\n\nEmber CLI\
    \ should have deployed your changes as you made them, but if for some reason it\
    \ hasn’t, you may need to run the `ember serve` command from your `ember-note`\
    \ directory to catch up. Once you have, visit the login route and try logging\
    \ into EmberNote. You should be redirected to the notebooks route.\n\nBecause\
    \ the `store.find` call to the API is asynchronous, it returns a Promise object\
    \ to the login route. A Promise can be described as an object that will eventually\
    \ resolve to a value. Depending on whether the function is successful or fails,\
    \ different logic can be executed. Once this Promise has resolved successfully,\
    \ the function in the `then` block is executed. First, we check that we received\
    \ only one row back from the API. Assuming we have, we load the first and only\
    \ row into the `user` object. Then, in order to make the `{{#if}}` and `{{#unless}}`\
    \ blocks work properly, we set the `user` attribute in the application controller.\
    \ Our last step is to run one of Ember’s navigation functions, `transitionTo`.\
    \ This function redirects the user to the notebooks route.\n\n**RSVP: Ember's\
    \ Promise Library**\n\nPromises are a widely used idea, without a canonical implementation.\
    \ ECMAScript 2015 is expected to include a Promise implementation, but in the\
    \ meantime, Ember relies on RSVP. RSVP is compliant with the in-process specification\
    \ of ES 2015, but it’s available now. It’s maintained by members of the core Ember\
    \ team and available on GitHub at [https://github.com/tildeio/rsvp.js](https://github.com/tildeio/rsvp.js).\n"
  raw: 'This also raises one point about the default Ember structure. Each individual
    route corresponds to exactly one template. For the application route, this is
    the application.hbs template. For each of our generated routes, it’s the template.hbs
    template as defined in the route’s folder, assuming you’ve used the --pod flag;
    otherwise the template is named for the route, and lives in the templates folder.


    Let’s create the login route now. This route needs to let the user sign into the
    EmberNote application. It should be available from a link on the main page, just
    like register was, and let previously registered users sign in with their usernames.
    Once they’ve signed in, they should be taken to their list of notebooks (the other
    route we’ve generated so far). Further, once they’ve signed in, the register and
    login links should no longer appear.


    To do this, we’re going to make changes to the following files:


    *   app/template/application.hbs: To add navigation to let the user load the login
    route, and to hide navigation to register and login once the user has logged in


    *   app/login/route.js: To define the login action


    *   app/login/template.hbs: To define the user interface for the login route


    To reach the login route, we need to first make it available via the application.hbs
    file. Edit this file so it looks like the following:


    | [ch2/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/templates/application.hbs)
    |


    | ​  | ​**<div**​ class=​*"container"*​​**>**​ |


    | ​  | ​**<div**​ class=​*"row"*​​**>**​ |


    | ​  | ​**<div**​ class=​*"col-md-2"*​​**>**​ |


    | ​  | Welcome to EmberNote |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-10"*​​**>**​ |


    | ​  | {{#if user}} |


    | ​  | Hello, {{user.name}} |


    | ​  | {{/if}} |


    | ​  | {{#unless user}} |


    | ​  | {{#link-to ''register''}}register{{/link-to}}&nbsp; |


    | ​  | {{#link-to ''login''}}login{{/link-to}} |


    | ​  | {{/unless}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"row"*​​**>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    The first addition you’ll make to the file is an {{#if}} expression. The text
    contained within this expression is only displayed if the expression evaluates
    to true. In this case, if the application controller has a value in the user attribute,
    the user’s name is displayed. We’ll see how this user attribute is set when we
    look at the login route next.


    The next section, inside the {{#unless}} expression, is displayed if the user
    attribute is missing. It contains the {{#link-to}} navigation item for the register
    route, and our new login route as well.


    When users click the link to the login route, they’re taken to localhost:4200/login.
    The login template is rendered into the {{outlet}}, meaning that the content of
    that template is displayed in the placeholder defined by the {{outlet}} expression.
    The login template, defined in app/login/template.hbs, looks like this:


    | [ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Login: {{input value=name}} ​**<button**​ {{action ''login''}}​**>**​Login​**</button>**​
    |


    | ​  | ​**</div>**​ |


    This template, which is the single template associated to the login route, has
    a mere two elements. The {{input}} expression results in an HTML text input field
    being displayed and takes its value from the name attribute. The {{action}} expression
    results in the login action being executed in the Route, which we define next.


    All of this ties together in the login route class, like this:


    | [ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | actions: { |


    | ​  | login: ​**function**​() { |


    | ​  | this.store.query(​*''user''*​, { |


    | ​  | name: this.controller.get(​*''name''*​) |


    | ​  | }).then((users) => { |


    | ​  | ​**if**​(users.get(​*''length''*​) === 1) { |


    | ​  | ​**var**​ user = users.objectAt(0); |


    | ​  | this.controllerFor(​*''application''*​).set(​*''user''*​,user); |


    | ​  | this.transitionTo(​*''notebooks''*​); |


    | ​  | } |


    | ​  | ​**else**​ { |


    | ​  | console.log(​*''unexpected query result''*​); |


    | ​  | } |


    | ​  | }); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    As we saw in Chapter 1, this Route class uses the ES6 module syntax. The first
    line of the class imports the Ember framework, which is then used when we extend
    the base Route class in our class declaration. We’re using an anonymous declaration
    and export of the Route. Ember CLI takes the path to the file and uses it to conclude
    that this class, though declared anonymously, represents the login route.


    The next block of code defines the actions hash, which is a name-value pair listing
    of action names and implementations. Our login route requires only one action,
    the aptly named login action.


    As described earlier in this chapter, the login action verifies that the requested
    user has properly registered, and then displays the list of the user’s notebooks.
    The next block,


    | ​  | this.store.query(​*''user''*​, { |


    | ​  | name : this.controller.get(​*''name''*​) |


    | ​  | }) |


    executes a query against our server API using the value of the name field from
    template.hbs as a query parameter. We’ll update the API next.


    For your login route to work, you need to make a small change to the mock server
    we created. Open your server/mocks/users.js file and update the get endpoint as
    follows:


    | [ch2/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/users.js)
    |


    | ​  | usersRouter.get(​*''/''*​, ​**function**​(req, res) { |


    | ​  | userDB.find(req.query).exec(​**function**​(error,users) { |


    | ​  | res.send({ |


    | ​  | ''users'': users |


    | ​  | }); |


    | ​  | }); |


    | ​  | }); |


    Ember CLI should have deployed your changes as you made them, but if for some
    reason it hasn’t, you may need to run the ember serve command from your ember-note
    directory to catch up. Once you have, visit the login route and try logging into
    EmberNote. You should be redirected to the notebooks route.


    Because the store.find call to the API is asynchronous, it returns a Promise object
    to the login route. A Promise can be described as an object that will eventually
    resolve to a value. Depending on whether the function is successful or fails,
    different logic can be executed. Once this Promise has resolved successfully,
    the function in the then block is executed. First, we check that we received only
    one row back from the API. Assuming we have, we load the first and only row into
    the user object. Then, in order to make the {{#if}} and {{#unless}} blocks work
    properly, we set the user attribute in the application controller. Our last step
    is to run one of Ember’s navigation functions, transitionTo. This function redirects
    the user to the notebooks route.


    RSVP: Ember''s Promise Library


    Promises are a widely used idea, without a canonical implementation. ECMAScript
    2015 is expected to include a Promise implementation, but in the meantime, Ember
    relies on RSVP. RSVP is compliant with the in-process specification of ES 2015,
    but it’s available now. It’s maintained by members of the core Ember team and
    available on GitHub at [https://github.com/tildeio/rsvp.js](https://github.com/tildeio/rsvp.js).'
