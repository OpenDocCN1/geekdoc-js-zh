  trans: "\n\n与编程世界中的许多概念一样，关于什么构成 RESTful API 也存在一些争论。（通常表现为“你的 API 不 RESTful！” “不，你的\
    \ API 才不 RESTful！”）抛开这些不谈，我们来谈谈 RESTful API 应该如何与 Ember Data 一起使用。\n\n一般来说，RESTful\
    \ 服务是一种使用统一资源标识符来访问数据和执行函数的方式。RESTful 服务通常（但并非总是）使用 HTTP 作为传输协议。每个唯一的 URI 和动词组合定义了一个动作以及应用该动作时要使用的相关记录（或记录集）。例如，如果你想获取\
    \ id 为 24 的笔记记录，你可以向 `/note/24` 发起一个 GET 请求，并期望获得该记录的当前状态（如果存在的话）。\n\nRESTful\
    \ API 的实现超出了本书的范围，除了我们一直在创建的模拟服务（请不要在生产环境中使用它们）。你可以使用多种技术来实现一个 RESTful API，例如\
    \ Ruby on Rails、Node.js、Java 或 .NET。选择权在你手中。\n\n一旦你定义了一个模型类，你就希望能够从该类的 API 端点加载数据。在此之前，你的应用需要声明一个\
    \ `DS.RESTAdapter` 类的实例。让我们看看我们为 EmberNote 项目声明的那个：\n\n```javascript\nimport DS\
    \ from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace: 'api'\n\
    });\n```\n\n这个适配器已经尽可能简洁了。这个 `RESTAdapter` 实现的唯一功能是标识 API 的根 URL。通常，适配器可以负责更多的事情，但我们先从简单的开始，并在《适配非传统\
    \ API》中更详细地介绍适配器。\n\n有了这个适配器，我们就可以开始向 API 查询记录了。\n\n## 查询 API\n\n当我们第一次开始使用 Ember\
    \ Data 时，我们用它在页面上显示登录用户拥有的笔记本列表。从我们的定义中可以看出，每条笔记本记录都属于一个用户：\n\n```javascript\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n});\n```\n\n基于该模型，我们使用了笔记本路由的\
    \ `model` 钩子来从 API 加载数据：\n\n```javascript\nimport Ember from 'ember';\n\nexport\
    \ default Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('notebook',\
    \ {user: params.user_id});\n  },\n  actions: {\n    addNotebook: function() {\n\
    \      var notebook = this.store.createRecord('notebook', {\n        title: this.controller.get('title'),\n\
    \        user: this.controllerFor('application').get('user')\n      });\n    \
    \  notebook.save().then(() => {\n        console.log('save successful');\n   \
    \     this.controller.set('title', null);\n        this.refresh();\n      }, function()\
    \ {\n        console.log('save failed');\n      });\n    }\n  }\n});\n```\n\n\
    正如你在《设置你的模型》中回忆的那样，`model` 钩子用于获取将在给定路由上显示的数据。我们使用 `this.store` 对象在路由中查找数据。`store`\
    \ 对象是 `DS.Store` 的一个实例，它是客户端数据持久化存储。\n\n`find` 函数通常接受两个参数。第一个是 `find` 函数将返回的数据类型的类名。第二个是要查询的参数列表。如果这个列表为空，API\
    \ 应返回该类型的所有记录。在我们的例子中，我们提供了当前登录用户的 ID，因此返回的所有笔记本都属于该用户。这个参数列表可以包含多个值，如果包含多个值，API\
    \ 应返回与提供的每个条件都匹配的所有记录。\n\n如果你不知道要加载的记录的 ID，你可以使用其他字段的内容来编写查询。这就是我们在 `route.js`\
    \ 中使用的查询形式，当我们调用 `this.store.query('notebook', {user: params.user_id})` 来查找属于某个用户的笔记本时。用户的\
    \ ID 是关于笔记本的一个已知信息，但它并不能唯一标识笔记本。然而，如果你确实知道记录的 ID，就像上一章的编辑笔记示例那样，那么你可以使用 `find`\
    \ 函数的另一种形式：\n\n```javascript\nmodel: function(params) {\n  return this.store.findRecord(\"\
    note\", params.id);\n}\n```\n\n最大的区别在于，在这种形式中，我们没有定义要搜索的字段。Ember Data 假设我们正在搜索给定记录的\
    \ `id` 字段。如果你想加载所有记录，只需调用不带参数的 `findAll`，如下所示：\n\n```javascript\nthis.store.findAll(\"\
    note\");\n```\n\n查询 API 的不同形式会导致向后端发送略有不同的 HTTP 请求。查询形式会向你的 API 发起一个 GET 请求，该请求使用\
    \ URL 查询参数将查询传递给后端。例如，`this.store.query(\"notebook\", { user: 1})` 将产生这个请求：`GET\
    \ \"/api/notebooks?user=1\"`。基于 ID 的形式也会发起一个 GET 请求。例如，`this.store.findRecord(\"\
    note\", 1)` 会产生 `GET \"api/note/1\"`。\n\n这些 URL 是 Ember Data 生成的默认 URL。但是，如果你的服务器\
    \ API 与 Ember Data 生成的不匹配，你不需要更改服务器。在《让适配器查询非传统 API》中，我们将看到如何使用 Ember Data 来更改它查询的\
    \ URL，以匹配现有的 API。这是 Ember Data 使消费 RESTful API 变得简单的众多方式之一。另一种方式是浏览器端缓存，我们现在就来介绍。\n\
    \n## 使用 Store\n\n如果 `DS.Store` 对象所做的只是代理对 RESTful API 的访问，那它仍然很有用。但它还提供了自用户会话开始以来加载的数据的浏览器端缓存。一旦用户通过上一节描述的\
    \ `find` 方法加载了一条记录，该记录就会驻留在缓存中，从而提供更快的访问速度。\n\n我们已经使用过 `store` 变量来查找记录，但还没有真正讨论它是什么。store\
    \ 是你与 RESTful API 交互的主要资源。除了提供 `find` 方法之外，它还缓存这些方法返回的数据，并提供用于处理缓存数据的方法。它还提供了修改记录的方法，我们将在本章后面看到。`DS.Store`\
    \ 的一个实例（由 `store` 变量表示）在每个 `Ember.Route` 实例中都是可用的。\n\nEmber Data 提供了多种方法来处理已加载到\
    \ store 中的数据。首先，如果你想获取 store 中已有的某种类型的所有记录，它提供了 `peekAll` 方法：\n\n```javascript\n\
    var allNotes = this.store.peekAll(\"note\");\n```\n\n该方法返回当前 store 中所有笔记记录的数组。每当你调用前面描述的任何一种查询方法时，结果都会被加载到\
    \ store 中，并且在整个应用中可用。\n\n"
- fmt: "\nWhen working with a browser-side cache, you’ll need to be aware of scenarios\
    \ when other users may have modified cached data. The store isn’t kept up to date\
    \ with each change as it occurs, so it’s a good idea to reload records from the\
    \ server when you need to use them, if they are able to be modified by others.\
    \ To do this, Ember Data provides the `reload` flag for `findRecord` and `findAll`.\
    \ For example, if we want to make sure we have the most recent changes to a shared\
    \ note record when we load our route, we would call the following:\n\n```\nmodel:\
    \ function(params) {\n  this.store.findRecord(\"note\", params.id, { reload: true\
    \ })\n}\n```\n\nUsing `reload: true` will always ensure that you get the record\
    \ from the server and include the most recent changes.\n\nThere’s a second way\
    \ to accomplish this, assuming you have a handle on the record. If a record has\
    \ already been loaded in the cache, `findRecord` calls the `reload` method on\
    \ the record instance. If you already have the record, you can do the following\
    \ to refresh this object from the server:\n\n```\nrecord.reload();\n```\n\n`DS.Store`\
    \ also contains a method to pull all records of a given type from the server,\
    \ regardless of cache state. To do this, call the `findAll` method with `reload:\
    \ true`:\n\n```\nmodel: function(params) {\n  this.store.findAll(\"note\", { reload:\
    \ true });\n}\n```\n\nYou may be thinking that the only way to guarantee you have\
    \ the most recent data is to use the `reload` parameter. This is partially true,\
    \ because the `findRecord` and `findAll` methods will return records already cached\
    \ in the store, if any exist. However, `DS.Store` provides a way to evict all\
    \ records of a given type from the store:\n\n```\nmodel: function(param) {\n \
    \ // Before looking for my data, flush the cache\n  this.store.unloadAll(\"note\"\
    );\n  // Now get my records\n  return this.store.query(\"note\", { notebook: param.notebook_id\
    \ });\n}\n```\n\nCalling `unloadAll` will result in a clean slate for the following\
    \ `query` method to work with. This is useful when you want to be able to execute\
    \ named-parameter queries against the store, while making sure that the results\
    \ it returns are the most recent data from the server.\n\n`DS.Store` has a number\
    \ of methods for working with server APIs and for storing results of API calls\
    \ in a browser-resident repository. As you’d expect, it also provides a number\
    \ of ways of dealing with those records once they’ve been loaded. In the next\
    \ section we’ll look at how to use Ember Data to use the records we get from the\
    \ API.\n\n## Work with Records\n\nWhile many of the methods in the `DS.Store`\
    \ class deal with loading and caching lists of records, your app will also often\
    \ work with records directly. Sometimes you’ll use the store, and sometimes you’ll\
    \ call methods on the record itself. Let’s start with one that we call from the\
    \ store, and learn how we can add data with the Ember app.\n\n### Creating Records\n\
    \nFor users to find your app useful, they need to be able to add data to persistent\
    \ storage. We’ve seen this already in the EmberNote application, where users add\
    \ their own notebooks and notes. Let’s take a look at that code now. In the notebooks\
    \ route, we added a feature that let users add a notebook:\n\n```\n// [ch5/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/route.js)\n\
    addNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n\
    \    this.controller.set('title', null);\n    this.refresh();\n  }, function()\
    \ {\n    console.log('save failed');\n  });\n}\n```\n\nThe new notebook is created\
    \ in the store by the following code: `var notebook = this.store.createRecord('notebook',\
    \ {...});`. The `createRecord` method takes two parameters. The first parameter\
    \ is the model type of the record you want to create. In this case it’s a `notebook`\
    \ type. The second parameter is a properties list, consisting of a set of key-value\
    \ pairs. The keys should match the names of attributes as defined in the referenced\
    \ model implementation. The values are then set as the value of each attribute.\
    \ In this case we’re pulling the values out of fields in our controller and using\
    \ them to populate the new record.\n\n| Saving New Records |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ It’s important to realize that calling `createRecord` does not result in the\
    \ new record being written to persistent storage. This new record lives only in\
    \ the store until the next block of code is called. To write this new record to\
    \ persistent storage, you must call the `save` method on the desired record. |\n\
    \nThe `save` method returns a `Promise`, which can resolve to either success or\
    \ failure. The `then` method on the resulting `Promise` object is called once\
    \ the `Promise` has resolved. As the logging statements demonstrate, the first\
    \ argument to `then` is executed when the `Promise` resolves successfully, and\
    \ the second when it does not. This allows you to handle each case separately\
    \ and keep the user informed of your progress.\n\nWhen the `save` method is called,\
    \ the store prepares a request to the RESTful API in the form of an HTTP POST\
    \ request. The body of the request contains all of the information necessary to\
    \ create the record within persistent storage. For example, if we wanted to create\
    \ a note with a title of “new note,” a description of “description,” and belonging\
    \ to notebook 12, the request would look something like this:\n\n```\nPOST /api/notes\n\
    {note: {title: \"new note\", body: \"description\", notebook: \"12\"}}\n```\n\n\
    | Monitoring Request/Response Traffic |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ As you’re working through these examples, it can be helpful to keep an eye on\
    \ the request/response traffic. Chrome, Firefox, Safari, and Internet Explorer\
    \ all have built-in developer tools that allow you to observe the traffic a site\
    \ generates. This is very useful in investigating the Ember Data requests further.\
    \ |\n\nObserve that there are no request parameters for this request. We’re simply\
    \ POSTing to a generic URL for the model type: `/api/notes`. The POST method for\
    \ this URL is reserved for receiving requests that relate exclusively to the creation\
    \ of new records, and it’s not used for update requests, which use the PUT method.\n\
    \nNow that we’ve seen how to add new records to Ember apps, let’s look at how\
    \ to modify existing records.\n\n### Updating Records\n\nThere’s not much difference\
    \ between how you create a record and how you update one: you call the `save`\
    \ method on a record that has the data you want to save. The big difference comes\
    \ in how Ember Data translates the action into an HTTP request.\n\nWhen a `save`\
    \ is called on a record that already exists in persistent storage, this results\
    \ in an HTTP PUT request to the API. For example, in the edit-note route, we used\
    \ the following action to save changes:\n\n```\n// [ch4/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/component.js)\n\
    import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
    \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\nThe note\
    \ record, when saved, results in an HTTP request that looks something like this:\n\
    \n```\nPUT \"/api/notes/12\"\n{note: {title: \"edited note\", body: \"edited description\"\
    , notebook: \"12\"}}\n```\n"
  raw: 'When working with a browser-side cache, you’ll need to be aware of scenarios
    when other users may have modified cached data. The store isn’t kept up to date
    with each change as it occurs, so it’s a good idea to reload records from the
    server when you need to use them, if they are able to be modified by others. To
    do this, Ember Data provides the reload flag for findRecord and findAll. For example,
    if we want to make sure we have the most recent changes to a shared note record
    when we load our route, we would call the following:


    | ​  | model: ​**function**​(params) { |


    | ​  | this.store.findRecord(​*"note"*​,params.id,{ reload:true }) |


    | ​  | } |


    Using reload:true will always ensure that you get the record from the server and
    include the most recent changes.


    There’s a second way to accomplish this, assuming you have a handle on the record.
    If a record has already been loaded in the cache, findRecord calls the reload
    method on the record instance. If you already have the record, you can do the
    following to refresh this object from the server:


    | ​  | record.reload(); |


    DS.Store also contains a method to pull all records of a given type from the server,
    regardless of cache state. To do this, call the findAll method with reload:true:


    | ​  | model: ​**function**​(params) { |


    | ​  | this.store.findAll(​*"note"*​,{ reload:true }); |


    | ​  | } |


    You may be thinking that the only way to guarantee you have the most recent data
    is to use the reload parameter. This is partially true, because the findRecord
    and findAll methods will return records already cached in the store, if any exist.
    However, DS.Store provides a way to evict all records of a given type from the
    store:


    | ​  | model: ​**function**​(param) { |


    | ​  | ​*// Before looking for my data, flush the cache*​ |


    | ​  | this.store.unloadAll(​*"note"*​); |


    | ​  | ​*// Now get my records*​ |


    | ​  | ​**return**​ this.store.query(​*"note"*​,{notebook: param.notebook_id});
    |


    | ​  | } |


    Calling unloadAll will result in a clean slate for the following query method
    to work with. This is useful when you want to be able to execute named-parameter
    queries against the store, while making sure that the results it returns are the
    most recent data from the server.


    DS.Store has a number of methods for working with server APIs and for storing
    results of API calls in a browser-resident repository. As you’d expect, it also
    provides a number of ways of dealing with those records once they’ve been loaded.
    In the next section we’ll look at how to use Ember Data to use the records we
    get from the API.


    ## Work with Records


    While many of the methods in the DS.Store class deal with loading and caching
    lists of records, your app will also often work with records directly. Sometimes
    you’ll use the store, and sometimes you’ll call methods on the record itself.
    Let’s start with one that we call from the store, and learn how we can add data
    with the Ember app.


    ### Creating Records


    For users to find your app useful, they need to be able to add data to persistent
    storage. We’ve seen this already in the EmberNote application, where users add
    their own notebooks and notes. Let’s take a look at that code now. In the notebooks
    route, we added a feature that let users add a notebook:


    | [ch5/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/route.js)
    |


    | ​  | addNotebook: ​**function**​() { |


    | ​  | ​**var**​ notebook = this.store.createRecord(​*''notebook''*​, { |


    | ​  | title: this.controller.get(​*''title''*​), |


    | ​  | user: this.controllerFor(​*''application''*​).get(​*''user''*​) |


    | ​  | }); |


    | ​  | notebook.save().then(() => { |


    | ​  | console.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''title''*​,null); |


    | ​  | this.refresh(); |


    | ​  | }, ​**function**​() { |


    | ​  | console.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | } |


    The new notebook is created in the store by the following code: var notebook =
    this.store.createRecord(’notebook’, {...});. The createRecord method takes two
    parameters. The first parameter is the model type of the record you want to create.
    In this case it’s a notebook type. The second parameter is a properties list,
    consisting of a set of key-value pairs. The keys should match the names of attributes
    as defined in the referenced model implementation. The values are then set as
    the value of each attribute. In this case we’re pulling the values out of fields
    in our controller and using them to populate the new record.


    | Saving New Records |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | It’s
    important to realize that calling createRecord does not result in the new record
    being written to persistent storage. This new record lives only in the store until
    the next block of code is called. To write this new record to persistent storage,
    you must call the save method on the desired record. |


    The save method returns a Promise, which can resolve to either success or failure.
    The then method on the resulting Promise object is called once the Promise has
    resolved. As the logging statements demonstrate, the first argument to then is
    executed when the Promise resolves successfully, and the second when it does not.
    This allows you to handle each case separately and keep the user informed of your
    progress.


    When the save method is called, the store prepares a request to the RESTful API
    in the form of an HTTP POST request. The body of the request contains all of the
    information necessary to create the record within persistent storage. For example,
    if we wanted to create a note with a title of “new note,” a description of “description,”
    and belonging to notebook 12, the request would look something like this:


    | ​  | POST /api/notes |


    | ​  | {note: {title: "new note", body: "description", notebook: "12"}} |


    | Monitoring Request/Response Traffic |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | As you’re working
    through these examples, it can be helpful to keep an eye on the request/response
    traffic. Chrome, Firefox, Safari, and Internet Explorer all have built-in developer
    tools that allow you to observe the traffic a site generates. This is very useful
    in investigating the Ember Data requests further. |


    Observe that there are no request parameters for this request. We’re simply POSTing
    to a generic URL for the model type: /api/notes. The POST method for this URL
    is reserved for receiving requests that relate exclusively to the creation of
    new records, and it’s not used for update requests, which use the PUT method.


    Now that we’ve seen how to add new records to Ember apps, let’s look at how to
    modify existing records.


    ### Updating Records


    There’s not much difference between how you create a record and how you update
    one: you call the save method on a record that has the data you want to save.
    The big difference comes in how Ember Data translates the action into an HTTP
    request.


    When a save is called on a record that already exists in persistent storage, this
    results in an HTTP PUT request to the API. For example, in the edit-note route,
    we used the following action to save changes:


    | [ch4/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/component.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Component.extend({ |


    | ​  | actions: { |


    | ​  | saveNote: ​**function**​() { |


    | ​  | this.get(​*''note''*​).save(); |


    | ​  | }, |


    | ​  | closeNote: ​**function**​() { |


    | ​  | this.sendAction(​*''close''*​); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    The note record, when saved, results in an HTTP request that looks something like
    this:


    | ​  | PUT "/api/notes/12" |


    | ​  | {note: {title: "edited note", body: "edited description", notebook: "12"}}
    |'
