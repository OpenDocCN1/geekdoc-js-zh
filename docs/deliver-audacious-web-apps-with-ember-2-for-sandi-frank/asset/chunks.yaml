    \n# Early praise for *Deliver Audacious Web Apps with Ember 2*\n\nDeliver Audacious\
    \ Web Apps with Ember 2 provides a clear and thorough introduction to the powerful\
    \ and elegant Ember framework. Developers looking to learn Ember or level up their\
    \ Ember skills should read this book.\n\n| → | Nell Shamrell-Harrington |\n| \
    \ | Software development engineer, Chef |\n\nEmber brought back the fun of Rails,\
    \ this time for single-page applications with great performance.\n\n| → | Federico\
    \ Tomassetti |\n|  | Software engineer |\n\nIf you’re considering Ember for your\
    \ next JavaScript project, buy this book. I felt like I’d leveled up after every\
    \ chapter.\n\n| → | Stephen Orr |\n|  | Senior software engineer, Impact Applications\
    \ |\n\n# Acknowledgments\n\nEvery book is the result of a lot of behind-the-scenes\
    \ effort, particularly if that book was written by a first-time author. The following\
    \ people were very helpful to me in creating this book.\n\nTo the Ember core team\
    \ and the Ember community: Thank you for making a product that was fun to learn\
    \ and to write about. The web is better off because you volunteered your time.\
    \ Thank you!\n\nTo my technical reviewers, Alessandro Bahgat, Jacob Chae, Javier\
    \ Collado, Jeremy Frens, Kenneth Geisshirt, Alexander Henry, Eric Hung, Jan Nonnen,\
    \ Stephen Orr, Shreerang Patwardhan, Martijn Reuvers, Brian Schau, Nell Shamrell-Harrington,\
    \ Tibor Simic, Charley Stran, Federico Tomassetti, Paul Waring, Nick Watts, and\
    \ Stephen Wolff: Thank you for lending your time and expertise to this project.\
    \ Your comments made this a much better book than I would have written alone.\n"
