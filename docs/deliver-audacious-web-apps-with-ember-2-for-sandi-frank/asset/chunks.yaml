    渲染函数在你想要更改位于当前路由层级之外某个出口中显示的模板时非常有用。能够明确指定模板名称和位置，让你在导航控制上拥有高度灵活性，即使是在当前路由可能并不总是需要关注的区域也是如此。


    ## 下一步


    正如本章开头所述，路由模式是 Ember 的一个关键特性。它为你提供了一种清晰思考应用程序如何组装的方式，并帮助你理解如何从一个应用功能移动到另一个。我们已经看到了使用
    Ember 路由所获得的一些特性。还有更多特性，但我们首先需要覆盖其他许多基础内容。我们的下一站是路由的亲密兄弟。正如你所了解的，每个路由对应一个模板，Ember
    使用该模板为给定路由渲染用户界面。在下一章中，我们将探讨模板特性以及 Handlebars 和 HTMLBars 表达式语言。


