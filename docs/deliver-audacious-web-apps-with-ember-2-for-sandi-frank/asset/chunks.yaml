    \ DS.attr('string'),\n  body: DS.attr('string'),\n  notebook: DS.belongsTo('notebook')\n\
    });\n```\n\n如果你对模型类有疑问，不必担心。我们将在第 5 章 *建模你的数据* 中讨论。设置好笔记本 Web 服务后，我们就可以为笔记本路由创建模板了。正如你所了解的，模板用于渲染路由的用户界面。在这种情况下，我们希望创建一个界面，允许用户做两件事：（1）创建新笔记本，（2）显示现有笔记本列表。以下是你要创建的模板：\n\
    \n[`ch2/ember-note/app/notebooks/template.hbs`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/template.hbs)\n\
    \n```\n<div>\n  <div class=\"col-md-3\">\n    <div>Notebooks</div>\n    <div>\n\
    \      title: {{input value=title}}\n      <button {{action 'addNotebook'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as |notebook|}}\n  \
    \        {{#link-to 'notebooks.notes' notebook.id}}\n            <li>{{notebook.title}}</li>\n\
    \          {{/link-to}}\n        {{else}}\n          <div>No notebooks found</div>\n\
    \        {{/each}}\n      </ul>\n    </div>\n  </div>\n  <div class=\"col-md-9\"\
    >\n    {{outlet}}\n  </div>\n</div>\n```\n\n我现在不会过多讨论模板代码——我们将在下一章详细介绍。我希望你注意到的是，我们直接从模板中引用了\
    \ `model`。正如本章前面提到的，在没有直接创建控制器类的情况下，我们可以依赖基础 `Ember.Controller` 类的默认功能。这个类有一个\
    \ `model` 变量，默认情况下它会调用路由的 `model` 钩子来填充这个变量。\n\n对于笔记本路由，Ember Data 查询返回零行或多行。在\
    \ `template.hbs` 文件中，引用的 `model` 是默认控制器中包含的变量。为了获取变量中的数据，我们使用了 `{{#each}}` 表达式，它会遍历模型实例列表。控制器中的\
    \ `model` 变量可以包含单个模型实例或模型实例数组。\n\n我们的模板在无序列表中显示笔记本标题。稍后我们将深入探讨模板和表达式的细节。目前，你的列表可能是空的。让我们看看如何使用操作来添加列表项并重新加载模板，以便它们显示出来。将以下代码添加到笔记本路由的\
    \ `actions` 哈希中：\n\n[`ch2/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)\n\
    \n```\naddNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n\
    \    this.controller.set('title',null);\n    this.refresh();\n  }, function()\
    \ {\n    console.log('save failed');\n  });\n}\n```\n\n这个操作使用 Ember Data 创建一条新记录。它用模板中的值填充记录，并通过从应用程序控制器加载数据来填充笔记本模型的\
    \ `user` 字段：`user: this.controllerFor('application').get('user')`。\n\n一旦记录通过 Ember\
    \ Data 保存，我们清空 UI 字段，然后使用 `this.refresh()` 刷新列表。这会从服务器重新加载模型并显示你的新记录。\n\n"
- fmt: "\nWe’ve focused in this section on the parts of a `Route` implementation that\
    \ relate to displaying data. We’ve had to touch on a few other concepts as well,\
    \ such as templates and models, which we’ll cover in more detail later in the\
    \ book. Don’t worry if you don’t fully understand these right now. There’s a lot\
    \ more to discuss. What I hope you understand is how to use path segments, the\
    \ model hook, and the related navigation functions like `transitionTo` to work\
    \ with data. The rest of this chapter will focus largely on navigation between\
    \ routes, and on creating a hierarchy of routes in your application. We’ll start\
    \ there by adding the first route that will be a child to the routes we’ve created:\
    \ the note route.\n\n## Nest Routes\n\nSo far we’ve only added routes that sit\
    \ one level below the application route. Let’s get a bit further into the weeds\
    \ and add a child route of a child route, also known as a nested route. Run this\
    \ command:\n\n```\n$ ember generate route notebooks/notes --pod\n```\n\nThis route\
    \ will be used to display all notes that are part of a given notebook. As you\
    \ might expect, the previous command created a new entry in the `Router`. I’ve\
    \ added the following path segment information to `app/router.js`:\n\n```\nthis.route(\"\
    notebooks\", { path:\"notebooks/:user_id\"}, function() {\n  this.route(\"notes\"\
    , { path:\"notes/:notebook_id\"}, function() {});\n});\n```\n\nDefine the route\
    \ class by updating it to look like the following (we’ll need this later).\n\n\
    [ch2/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/route.js)\n\
    \n```\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model:\
    \ function(params) {\n    return this.store.query('note', {notebook:params.notebook_id});\n\
    \  },\n  actions: {\n    addNote: function() {\n      this.store.findRecord('notebook',\n\
    \        this.paramsFor('notebooks.notes').notebook_id).then(\n        (notebook)\
    \ => {\n          console.log(notebook);\n          var note = this.store.createRecord('note',\
    \ {\n            title : this.controller.get('title'),\n            notebook:\
    \ notebook\n          });\n          console.log(note);\n          note.save().then(()\
    \ => {\n            console.log('save successful');\n            this.controller.set('title',null);\n\
    \            this.refresh();\n          }, function() {\n            console.log('save\
    \ failed');\n          });\n        });\n    },\n    deleteNote: function(note)\
    \ {\n      console.log('deleting note with title ' + note.get('title'));\n   \
    \   note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\nAnd your\
    \ new notes template should look like this:\n\n[ch2/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/template.hbs)\n\
    \n```\n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div class=\"col-md-4\"\
    >\n    <div>\n      title: {{input value=title}} <button {{action 'addNote'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as |note|}}\n      \
    \    <li>\n            {{#link-to 'notebooks.notes.note' note.id}}\n         \
    \     {{note.title}}\n            {{/link-to}}\n            <button {{action 'deleteNote'\
    \ note}}>delete</button>\n          </li>\n        {{/each}}\n      </ul>\n  \
    \  </div>\n  </div>\n  <div class=\"col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n\
    ```\n\nThis is known as a nested route, so called because it resides, and only\
    \ has meaning, as a child of the notebooks route. The command also created the\
    \ route’s files, `route.js` and `template.hbs`, under `notebooks/notes`, a new\
    \ directory. We filled out the implementations earlier.\n\n### The Missing Note\
    \ Route\n\n> ![images/aside-icons/warning.png](images/aside-icons/warning.png)\
    \ If you look closely at the new notes template, you’ll notice we added a link\
    \ to a child route that doesn’t yet exist. This is why you don’t see newly added\
    \ notes if you add them. Ember isn’t able to render the link because the child\
    \ route is missing, and there’s likely an error in your browser console. Don’t\
    \ worry! We’ll get to defining the note route in Chapter 4, [*Building In Reuse\
    \ with Components*](#f_0029.html_components).\n\nYou can navigate to this route\
    \ and define it, just as you would the notebooks route, except that your `{{#link-to}}`\
    \ expression resides in the notebooks template. We’ll spend more time with the\
    \ notes route and adding a child route to it in Chapter 4, when we build a feature\
    \ to edit notes. Let’s look at a few more options for navigation before we wrap\
    \ up our exploration of routes.\n\n## Transition Between Routes\n\nMany times\
    \ you will want to move from one section of your app to another in response to\
    \ an action. Ember provides you with a few options to do this. One such option\
    \ is the `transitionTo` function. We’ve used this previously to transition from\
    \ the login route to the notebooks route:\n\n[ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)\n\
    \n```\nthis.transitionTo('notebooks', user.get('id'));\n```\n\nThe first argument\
    \ to this function is the name of the route you’re transitioning to. You can provide\
    \ either a top-level route, such as `notebooks`, or a nested route, such as `notebooks.notes`.\
    \ You can provide other information as well, such as a specific `model`, in the\
    \ second argument to the function. If you provide a model, the receiving route\
    \ will use that model when rendering. If you provide a literal, as we’ve done\
    \ here, the receiving route will call its `model` hook, and use that literal as\
    \ a parameter to load the model.\n\nThis is one simple way to move from one route\
    \ to another. It’s important to note that the target route will be rendered into\
    \ the same `{{outlet}}` as the calling route is currently rendered into. If you\
    \ want to really get fancy, the `render` function is for you, and we’ll look at\
    \ that next.\n\n## Render Templates into Named Outlets\n\nIn addition to the `transitionTo`\
    \ function, Ember provides a function with more fine-grained control over transitions:\
    \ the `render` function. Using the `render` function, you can not only control\
    \ which route you’re rendering, but also where you’re rendering it and what data\
    \ and controller to use.\n\nSo far, we’ve only used the default `{{outlet}}` expressions\
    \ to contain our templates. Ember also allows you to create named outlets, simply\
    \ by providing a name to the outlet: `{{outlet 'namedOutlet'}}`.\n\nIf you want\
    \ to use the `render` function, you’ll need to name the affected outlets. The\
    \ `render` function accepts a name, which represents the name of the template\
    \ you want to render, and an `options` object. The `options` object can have any\
    \ of the following parameters:\n\n| 参数 | 描述 |\n|------|------|\n| `into` | This\
    \ is the name of the template you want to render your template into. If you leave\
    \ this parameter out, `Ember` will use the parent template of the template that\
    \ you named earlier. |\n| `outlet` | This is the name of the outlet on the template\
    \ named in the `into` parameter. If this parameter is left out, `Ember` uses the\
    \ default outlet. |\n| `controller` | The controller class to use in rendering\
    \ the new template. If not defined, `Ember` will use the default. |\n| `model`\
    \ | An instance of the model class to use in rendering the new template. `Ember`\
    \ will run the target route’s `model` hook if not specified. |\n"
  raw: 'We’ve focused in this section on the parts of a Route implementation that
    relate to displaying data. We’ve had to touch on a few other concepts as well,
    such as templates and models, which we’ll cover in more detail later in the book.
    Don’t worry if you don’t fully understand these right now. There’s a lot more
    to discuss. What I hope you understand is how to use path segments, the model
    hook, and the related navigation functions like transitionTo to work with data.
    The rest of this chapter will focus largely on navigation between routes, and
    on creating a hierarchy of routes in your application. We’ll start there by adding
    the first route that will be a child to the routes we’ve created: the note route.


    ## Nest Routes


