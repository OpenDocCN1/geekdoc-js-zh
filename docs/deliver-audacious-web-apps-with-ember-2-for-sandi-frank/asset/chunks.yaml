    But we’re not quite done yet. Along the way to delivering your killer app with
    Ember, you’ve likely used some addons, and possibly created some code you think
    others would find useful. In the last chapter, we’ll take a closer look at how
    to find and install addons into your app. We’ll also see how to publish an addon,
    either to a private repository for sharing between your own apps, or to a public
    repository for sharing with the world.


