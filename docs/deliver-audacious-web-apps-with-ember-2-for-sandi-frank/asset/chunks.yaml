  trans: "\n\n在使用浏览器端缓存时，你需要留意其他用户可能修改了缓存数据的情况。存储不会随着每次变更而实时更新，因此，如果数据可能被他人修改，最好在需要使用记录时从服务器重新加载。为此，Ember\
    \ Data 为 `findRecord` 和 `findAll` 提供了 `reload` 标志。例如，如果我们希望在加载路由时确保获得共享笔记记录的最新更改，可以这样调用：\n\
    \n```\nmodel: function(params) {\n  this.store.findRecord(\"note\", params.id,\
    \ { reload: true })\n}\n```\n\n使用 `reload: true` 将始终确保你从服务器获取记录并包含最新更改。\n\n还有第二种方法可以实现这一点，前提是你已经持有该记录。如果记录已加载到缓存中，`findRecord`\
    \ 会在记录实例上调用 `reload` 方法。如果你已经拥有该记录，可以通过以下方式从服务器刷新此对象：\n\n```\nrecord.reload();\n\
    ```\n\n`DS.Store` 还包含一个方法，用于从服务器拉取指定类型的所有记录，无论缓存状态如何。为此，调用带有 `reload: true` 的\
    \ `findAll` 方法：\n\n```\nmodel: function(params) {\n  this.store.findAll(\"note\"\
    , { reload: true });\n}\n```\n\n你可能会认为确保获得最新数据的唯一方法是使用 `reload` 参数。这在一定程度上是正确的，因为\
    \ `findRecord` 和 `findAll` 方法会返回存储中已缓存的记录（如果存在）。然而，`DS.Store` 提供了一种从存储中驱逐指定类型所有记录的方法：\n\
    \n```\nmodel: function(param) {\n  // 在查找数据之前，清空缓存\n  this.store.unloadAll(\"\
    note\");\n  // 现在获取我的记录\n  return this.store.query(\"note\", { notebook: param.notebook_id\
    \ });\n}\n```\n\n调用 `unloadAll` 将为后续的 `query` 方法提供一个干净的状态。当你希望针对存储执行命名参数查询，同时确保返回的结果是来自服务器的最新数据时，这非常有用。\n\
    \n`DS.Store` 有许多方法用于处理服务器 API 以及将 API 调用的结果存储在浏览器端仓库中。正如你所料，它还提供了多种处理已加载记录的方式。在下一节中，我们将了解如何使用\
    \ Ember Data 来使用从 API 获取的记录。\n\n## 处理记录\n\n虽然 `DS.Store` 类中的许多方法涉及加载和缓存记录列表，但你的应用也常常直接处理记录。有时你会使用存储，有时你会直接调用记录上的方法。让我们从存储调用的方法开始，学习如何通过\
    \ Ember 应用添加数据。\n\n### 创建记录\n\n为了让用户觉得你的应用有用，他们需要能够将数据添加到持久化存储中。我们在 EmberNote\
    \ 应用中已经看到了这一点，用户可以在其中添加自己的笔记本和笔记。现在让我们看看那段代码。在 notebooks 路由中，我们添加了一个让用户添加笔记本的功能：\n\
    \n```\n// [ch5/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/route.js)\n\
    addNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n\
    \    this.controller.set('title', null);\n    this.refresh();\n  }, function()\
    \ {\n    console.log('save failed');\n  });\n}\n```\n\n新笔记本通过以下代码在存储中创建：`var notebook\
    \ = this.store.createRecord('notebook', {...});`。`createRecord` 方法接受两个参数。第一个参数是要创建的记录模型类型，这里是\
    \ `notebook` 类型。第二个参数是一个属性列表，由一组键值对组成。键应与所引用模型实现中定义的属性名称匹配。值则设置为每个属性的值。在这个例子中，我们从控制器中的字段提取值，并用它们填充新记录。\n\
    \n| 保存新记录 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ 重要的是要认识到，调用 `createRecord` 并不会将新记录写入持久化存储。这条新记录只存在于存储中，直到调用下一段代码。要将这条新记录写入持久化存储，你必须在目标记录上调用\
    \ `save` 方法。 |\n\n`save` 方法返回一个 `Promise`，它可以解析为成功或失败。一旦 `Promise` 解析完成，就会调用结果\
    \ `Promise` 对象上的 `then` 方法。正如日志语句所示，`then` 的第一个参数在 `Promise` 成功解析时执行，第二个参数在失败时执行。这允许你分别处理每种情况，并让用户了解进度。\n\
    \n当调用 `save` 方法时，存储会准备一个 HTTP POST 请求形式的 RESTful API 请求。请求体包含在持久化存储中创建记录所需的所有信息。例如，如果我们想创建一条标题为“new\
    \ note”、描述为“description”、属于笔记本 12 的笔记，请求将如下所示：\n\n```\nPOST /api/notes\n{note:\
    \ {title: \"new note\", body: \"description\", notebook: \"12\"}}\n```\n\n| 监控请求/响应流量\
    \ |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) 在完成这些示例时，留意请求/响应流量会很有帮助。Chrome、Firefox、Safari\
    \ 和 Internet Explorer 都内置了开发者工具，允许你观察站点生成的流量。这对于进一步研究 Ember Data 请求非常有用。 |\n\n\
    请注意，此请求没有请求参数。我们只是向模型类型的通用 URL `/api/notes` 发送 POST 请求。此 URL 的 POST 方法专用于接收仅与创建新记录相关的请求，而不用于更新请求（更新请求使用\
    \ PUT 方法）。\n\n现在我们已经了解了如何向 Ember 应用添加新记录，接下来看看如何修改现有记录。\n\n### 更新记录\n\n创建记录和更新记录之间没有太大区别：你只需在包含要保存数据的记录上调用\
    \ `save` 方法。主要区别在于 Ember Data 如何将操作转换为 HTTP 请求。\n\n当对持久化存储中已存在的记录调用 `save` 时，会向\
    \ API 发送一个 HTTP PUT 请求。例如，在编辑笔记路由中，我们使用以下操作来保存更改：\n\n```\n// [ch4/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/component.js)\n\
    import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
    \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\n保存笔记记录时，会生成一个类似如下的\
    \ HTTP 请求：\n\n```\nPUT \"/api/notes/12\"\n{note: {title: \"edited note\", body:\
    \ \"edited description\", notebook: \"12\"}}\n```\n\n"
- fmt: "\nThere are similarities to the HTTP POST request generated for a new record.\
    \ Each request contains a JSON representation of the record to be saved. Each\
    \ record uses the same endpoint, `/api/notes`. However, the save method uses the\
    \ PUT verb when it’s aware of an existing record, and to identify the record,\
    \ it adds a path segment to the URL that contains the value of the `id` field\
    \ from the record. From this request, the API is expected to save changes to the\
    \ record as provided by the request.\n\n### Deleting Records\n\nOf course, your\
    \ users will sometimes make mistakes, or want to let data go. For this, you’ll\
    \ want to let them delete records. Ember Data provides two different ways to accomplish\
    \ this. The first is similar to the methods we’ve seen thus far. Let’s build out\
    \ EmberNote a bit, to allow users to delete notes from within the notebooks/notes\
    \ route. Let’s start by adding a delete button to the list of notes. Make sure\
    \ the template looks like this:\n\n```\n[ch5/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/template.hbs)\n\
    \n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div class=\"col-md-4\"\
    >\n    <div>\n      title: {{input value=title}} <button {{action 'addNote'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as |note|}}\n      \
    \    <li>\n            {{#link-to 'notebooks.notes.note' note.id}}\n         \
    \     {{note.title}}\n            {{/link-to}}\n            <button {{action 'deleteNote'\
    \ note}}>delete</button>\n          </li>\n        {{else}}\n          <div>No\
    \ notes found</div>\n        {{/each}}\n      </ul>\n    </div>\n  </div>\n  <div\
    \ class=\"col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n```\n\nNow let’s alter\
    \ the route to define the action referenced from the new button. Add the following\
    \ action:\n\n```\n[ch5/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/route.js)\n\
    \ndeleteNote: function(note) {\n  console.log('deleting note with title ' + note.get('title'));\n\
    \  note.deleteRecord();\n  note.save();\n}\n```\n\nThe call to `deleteRecord`\
    \ doesn’t fully delete it from the back end. As you see, you also need to call\
    \ `save` for the record to be fully deleted.\n\nAs with the other methods, `save`\
    \ results in an HTTP request to the API, this time a delete request:\n\n```\n\
    DELETE \"/api/notes/12\"\n```\n\nBecause we’re deleting the record, we don’t need\
    \ to provide any further information beyond the ID in the URL. The API knows all\
    \ it needs to know and returns success or failure.\n\nUnlike the other operations,\
    \ though, deletion has a shortcut form as well. The `destroyRecord` method will\
    \ delete the record from the server without a need to call `save` first. My preference\
    \ is to emphasize readability and familiar-looking code, so I tend to prefer the\
    \ `deleteRecord` form, but this option is there.\n\nLet’s take a look now at how\
    \ to determine a record’s state, which can help you decide what, if anything,\
    \ needs to be done with it.\n\n### Getting a Record’s State\n\nWe’ve been building\
    \ EmberNote to be action-driven in regard to saving records, but you may occasionally\
    \ want to save records as a background process. In this pattern, you’ll want to\
    \ use the record’s state to determine which records to save. To get the state\
    \ of a record, you call the following:\n\n```\nvar state = record.get('currentState.stateName');\n\
    ```\n\nThe state of the record can take one of the following values:\n\n* `root.deleted.saved`\n\
    * `root.deleted.uncommitted`\n* `root.deleted.inFlight`\n* `root.empty`\n* `root.loaded.created.uncommitted`\n\
    * `root.loaded.created.inFlight`\n* `root.loaded.saved`\n* `root.loaded.updated.uncommitted`\n\
    * `root.loaded.updated.inFlight`\n* `root.loading`\n\nIn general, these states\
    \ are fairly self-explanatory, but the following nuances are worth mentioning:\
    \ `uncommitted` means that a record has not yet been saved to persistent storage,\
    \ `inFlight` means that a save is in process (recall that saves are asynchronous),\
    \ and `saved` means a record has been saved to persistent storage.\n\nBy getting\
    \ a list of all records in the store, it’s possible to run a background save process\
    \ on an interval basis and have data saved without requiring user action.\n\n\
    ### Purging Records From the Store\n\nThere may also be times when you want to\
    \ eject records from the store without saving them. Consider the case where a\
    \ user is navigating away from a record without having changed data. You can keep\
    \ the record loaded into the cache, and it will be there when you need it later.\
    \ Or, if you’re interested in limiting the size of your cache, or in discarding\
    \ unsaved changes, you may want to eject the record. To do this, call the following:\n\
    \n```\nif(record.hasDirtyAttributes()) {\n  record.rollbackAttributes();\n}\n\
    this.store.unloadRecord(record);\n```\n\nThe method `unloadRecord` is used to\
    \ remove records from the store. However, you’ll note that we checked the state\
    \ of the record before unloading it using `hasDirtyAttributes`. This determines\
    \ whether the record has changes that require a save. The `unloadRecord` method\
    \ will not remove a dirty object from the cache, so we use the `rollbackAttributes`\
    \ method first to discard changes, and then we can drop the record from the store.\
    \ As of this writing, this is the only way to discard records from the cache;\
    \ the cache itself does not discard records based on aging.\n\n### Ember Addon:\
    \ Fireplace\n\nPerhaps you’d like to totally avoid creating your own back end.\
    \ If that’s the case, you might be interested in Firebase, and an Ember addon\
    \ known as Fireplace.\n\nFirebase is an API-as-a-Service provider that you can\
    \ use to host a custom API that you define. Hosted at [https://www.firebase.com](https://www.firebase.com),\
    \ this commercial product lets you quickly spin up an API that you can use in\
    \ a JavaScript, iOS, or Android app.\n\nWhile Firebase is a cool product, the\
    \ Ember addon is what I find really interesting. This addon, maintained at [https://github.com/rlivsey/fireplace](https://github.com/rlivsey/fireplace)\
    \ and documented at [http://livsey.org/fireplace/](http://livsey.org/fireplace/),\
    \ wraps the Firebase JavaScript client in an Ember addon, and exposes the features\
    \ of Firebase to your app via an Ember Data store. By simply signing up at Firebase\
    \ and dropping this addon into your project, you can easily get up and running\
    \ with a full back-end API.\n\n## Next Steps\n\nEmber Data can be quite helpful\
    \ when working with RESTful APIs. As we’ve seen, it offers a robust feature set\
    \ for dealing with data that you obtain from such a server. However, we’ve only\
    \ covered the easy part of the story. You may often need to deal with an API that,\
    \ for one reason or another, doesn’t follow the conventions Ember Data expects.\
    \ There’s no need to give up on Ember Data if you find out your API doesn’t conform\
    \ to its expectations. This is why, despite being focused primarily on the front\
    \ end, it’s important to understand the HTTP traffic Ember Data generates. In\
    \ the next chapter, you’ll learn about a few Ember Data features that allow you\
    \ to work with an API that follows its own rules, and about how to make such APIs\
    \ do what you want them to do.\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\
    \n# Chapter 6\n\nReading Nonstandard APIs\n\nOne of the core principles of Ember\
    \ is to value convention over configuration. As such, Ember Data is quite easy\
    \ to use with a RESTful API that uses the conventions discussed in [*Work with\
    \ Records*](#f_0038.html_crud). However, at some point you’ll almost certainly\
    \ come into contact with an API that doesn’t follow these conventions.\n"
  raw: 'There are similarities to the HTTP POST request generated for a new record.
    Each request contains a JSON representation of the record to be saved. Each record
    uses the same endpoint, /api/notes. However, the save method uses the PUT verb
    when it’s aware of an existing record, and to identify the record, it adds a path
    segment to the URL that contains the value of the id field from the record. From
    this request, the API is expected to save changes to the record as provided by
    the request.


    ### Deleting Records


    Of course, your users will sometimes make mistakes, or want to let data go. For
    this, you’ll want to let them delete records. Ember Data provides two different
    ways to accomplish this. The first is similar to the methods we’ve seen thus far.
    Let’s build out EmberNote a bit, to allow users to delete notes from within the
    notebooks/notes route. Let’s start by adding a delete button to the list of notes.
    Make sure the template looks like this:


    | [ch5/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Notes |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-4"*​​**>**​ |


    | ​  | ​**<div>**​ |


    | ​  | title: {{input value=title}} ​**<button**​ {{action ''addNote''}}​**>**​Add​**</button>**​
    |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | ​**<ul>**​ |


    | ​  | {{#each model as &#124;note&#124;}} |


    | ​  | ​**<li>**​ |


    | ​  | {{#link-to ''notebooks.notes.note'' note.id}} |


    | ​  | {{note.title}} |


    | ​  | {{/link-to}} |


    | ​  | ​**<button**​ {{action ''deleteNote'' note}}​**>**​delete​**</button>**​
    |


    | ​  | ​**</li>**​ |


    | ​  | {{else}} |


    | ​  | ​**<div>**​No notes found​**</div>**​ |


    | ​  | {{/each}} |


    | ​  | ​**</ul>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-8"*​​**>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    Now let’s alter the route to define the action referenced from the new button.
    Add the following action:


    | [ch5/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/route.js)
    |


    | ​  | deleteNote: ​**function**​(note) { |


    | ​  | console.log(​*''deleting note with title ''*​ + note.get(​*''title''*​));
    |


    | ​  | note.deleteRecord(); |


    | ​  | note.save(); |


    | ​  | } |


    The call to deleteRecord doesn’t fully delete it from the back end. As you see,
    you also need to call save for the record to be fully deleted.


    As with the other methods, save results in an HTTP request to the API, this time
    a delete request:


    | ​  | DELETE "/api/notes/12" |


    Because we’re deleting the record, we don’t need to provide any further information
    beyond the ID in the URL. The API knows all it needs to know and returns success
    or failure.


    Unlike the other operations, though, deletion has a shortcut form as well. The
    destoryRecord method will delete the record from the server without a need to
    call save first. My preference is to emphasize readability and familiar-looking
    code, so I tend to prefer the deleteRecord form, but this option is there.


    Let’s take a look now at how to determine a record’s state, which can help you
    decide what, if anything, needs to be done with it.


    ### Getting a Record’s State


    We’ve been building EmberNote to be action-driven in regard to saving records,
    but you may occasionally want to save records as a background process. In this
    pattern, you’ll want to use the record’s state to determine which records to save.
    To get the state of a record, you call the following:


    | ​  | ​**var**​ state = record.get(​*''currentState.stateName''*​); |


    The state of the record can take one of the following values:


    *   root.deleted.saved


    *   root.deleted.uncommitted


    *   root.deleted.inFlight


    *   root.empty


    *   root.loaded.created.uncommitted


    *   root.loaded.created.inFlight


    *   root.loaded.saved


    *   root.loaded.updated.uncommitted


    *   root.loaded.updated.inFlight


    *   root.loading


    In general, these states are fairly self-explantory, but the following nuances
    are worth mentioning: uncommitted means that a record has not yet been saved to
    persistent storage, inFlight means that a save is in process (recall that saves
    are asynchronous), and saved means a record has been saved to persistent storage.


    By getting a list of all records in the store, it’s possible to run a background
    save process on an interval basis and have data saved without requiring user action.


    ### Purging Records From the Store


    There may also be times when you want to eject records from the store without
    saving them. Consider the case where a user is navigating away from a record without
    having changed data. You can keep the record loaded into the cache, and it will
    be there when you need it later. Or, if you’re interested in limiting the size
    of your cache, or in discarding unsaved changes, you may want to eject the record.
    To do this, call the following:


    | ​  | ​**if**​(record.hasDirtyAttributes()) { |


    | ​  | record.rollbackAttributes(); |


    | ​  | } |


    | ​  | this.store.unloadRecord(record); |


    The method unloadRecord is used to remove records from the store. However, you’ll
    note that we checked the state of the record before unloading it using hasDirtyAttributes.
    This determines whether the record has changes that require a save. The unloadRecord
    method will not remove a dirty object from the cache, so we use the rollbackAttributes
    method first to discard changes, and then we can drop the record from the store.
    As of this writing, this is the only way to discard records from the cache; the
    cache itself does not discard records based on aging.


    Ember Addon: Fireplace


    Perhaps you’d like to totally avoid creating your own back end. If that’s the
    case, you might be interested in Firebase, and an Ember addon known as Fireplace.


    Firebase is an API-as-a-Service provider that you can use to host a custom API
    that you define. Hosted at [https://www.firebase.com](https://www.firebase.com),
    this commercial product lets you quickly spin up an API that you can use in a
    JavaScript, iOS, or Android app.


    While Firebase is a cool product, the Ember addon is what I find really interesting.
    This addon, maintained at [https://github.com/rlivsey/fireplace](https://github.com/rlivsey/fireplace)
    and documented at [http://livsey.org/fireplace/](http://livsey.org/fireplace/),
    wraps the Firebase JavaScript client in an Ember addon, and exposes the features
    of Firebase to your app via an Ember Data store. By simply signing up at Firebase
    and dropping this addon into your project, you can easily get up and running with
    a full back-end API.


    ## Next Steps


    Ember Data can be quite helpful when working with RESTful APIs. As we’ve seen,
    it offers a robust feature set for dealing with data that you obtain from such
    a server. However, we’ve only covered the easy part of the story. You may often
    need to deal with an API that, for one reason or another, doesn’t follow the conventions
    Ember Data expects. There’s no need to give up on Ember Data if you find out your
    API doesn’t conform to its expectations. This is why, despite being focused primarily
    on the front end, it’s important to understand the HTTP traffic Ember Data generates.
    In the next chapter, you’ll learn about a few Ember Data features that allow you
    to work with an API that follows its own rules, and about how to make such APIs
    do what you want them to do.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 6


    Reading Nonstandard APIs


    One of the core principles of Ember is to value convention over configuration.
    As such, Ember Data is quite easy to use with a RESTful API that uses the conventions
    discussed in [​*Work with Records*​](#f_0038.html_crud). However, at some point
    you’ll almost certainly come into contact with an API that doesn’t follow these
    conventions.'
