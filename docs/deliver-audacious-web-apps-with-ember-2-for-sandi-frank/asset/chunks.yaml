  trans: "\n致 Pragmatic Bookshelf 的各位，包括 Andy Hunt、Dave Thomas、Susannah Davidson Pfalzer、Janet\
    \ Furlow，以及所有参与制作的人：你们帮助我将这本书塑造成一个我们都能自豪地署上名字的作品。\n\n致我的编辑 Katharine Dvorak：这本书有你一半的功劳。你的指导和远见对我帮助极大，没有它们，这本书的篇幅会是现在的两倍，而有用信息却只有一半。我已经迫不及待要开始下一本书了！\n\
    \n致我的好友兼同行作者 Sharone Williams：感谢你与我一同承受 deadline 带来的幻觉。知道你也身处“文字矿场”，这对我有着无可估量的帮助。\n\
    \n致我的父母：感谢你们为我做出的所有牺牲，并教会我努力工作、尝试新事物。希望你们和我一样为这本书感到骄傲。\n\n最重要的是，致我的妻子和儿子：你们的耐心、支持和爱对我意味着一切，没有你们，我既不会开始也不会完成这本书。感谢你们的一切！\n\
    \n马特·怀特 mailto:matt@mattwhite.co  \n2015 年 10 月  \n版权所有 © 2015, The Pragmatic\
    \ Bookshelf.\n\n# 引言：为什么选择 Ember？\n\n当你考虑编写一个 Web 应用时，最让你兴奋的是什么？你是期待编写框架代码，还是为用户交付功能？如果你和我一样，功能才是令人兴奋的部分，而框架的存在是为了服务功能。现在，想象一下，如果有一群开发者已经探索了创建\
    \ Web 应用前端的最佳实践，并将这些实践编纂成一个框架。想象一下，如果你不必担心编写胶水代码，而是可以把时间花在令人兴奋的事情上。你的工作会有什么不同？\n\
    \nEmber 是一个开源 JavaScript 框架，维护于 [`emberjs.com`](http://emberjs.com) 和 GitHub^([[1]](#f_0010.html_FOOTNOTE-1))，它加速了\
    \ Web 应用的开发。它提供了你所需的大部分前端基础设施，让你能够专注于打造出色的应用。使用 Ember，你将编写更少的代码，而且代码会更简洁。简洁的代码就是更好的代码。通过将面向对象的设计原则注入\
    \ JavaScript，帮助你以合理的方式组织代码，Ember 让你能够从模块化的层面思考。这使得你的应用更易于创建和维护。\n\n在本书中，你将学习如何创建大胆的\
    \ Web 应用，并通过让 Ember 承担繁重工作来高效地完成。你将使用 Ember 的路由系统构建具有丰富界面和简单、可共享 URL 的单页应用。你将创建可复用的\
    \ UI 组件和模板，并将它们组合成高度可用、复杂的应用。你将使用 Ember Data 读写 RESTful 服务。你将学习使用 Ember 插件来共享代码以及使用他人共享的代码。你还将学习使用\
    \ Ember CLI 和 QUnit 来组织、构建和测试你的应用。\n\n## 本书的内容与范围\n\n本书是对 Ember 2、Ember Data 和\
    \ Ember CLI 核心功能的快速介绍。这些功能依赖于 Node.js、npm 和 Handlebars，但我们不会深入介绍这些依赖项。\n\n本书并非\
    \ Ember、Ember Data 或 Ember CLI 的详尽参考。我希望你能学到足够的知识来激发你的好奇心，但我们不会涵盖每一个 Ember API。本书也不是\
    \ JavaScript 或 Web 开发的入门指南。我假设你具备一些 JavaScript、DOM、Ajax、HTML/CSS 和 RESTful 服务的知识。\n\
    \n## 谁应该阅读本书？\n\n本书面向刚接触 Ember 的 Web 开发者。如果你使用过其他框架如 React 或 AngularJS，或者使用过 jQuery，那么\
    \ Ember 背后的一些理念对你来说应该很熟悉；但即使没有，你也能顺利阅读。\n\n## 本书的组织结构\n\n在第一章中，我们将首先创建本地开发环境，然后开始一个示例项目。在这一章中，我们将简要涉及许多核心功能，同时构建一个小而完整的示例功能。\n\
    \n在接下来的三章中，我们将专注于使用 Ember 2 构建用户界面的核心方面，并了解它如何利用路由、模板和组件动态地保持界面更新，而无需大量笨重的服务器往返。在第\
    \ 5 章和第 6 章中，我们将集中使用 Ember Data 的模型来访问 RESTful 服务以获取数据，并将这些数据提供给用户界面。第 7 章讨论了在\
    \ Ember 应用中促进代码复用的几种方法，包括工具、混入和依赖注入。最后，在第 8 章和第 9 章中，我们将学习如何使用 Ember CLI 构建、测试和部署应用，以及通过插件共享代码。\n\
    \n本书的一个不同之处在于，每一章都建立在上一章工作的基础上。我们将一起从第一页开始构建一个单一的应用，并贯穿全书。因此，建议你第一次阅读时按顺序进行。通读全书后，再将其作为参考书使用会更有效，但第一次阅读时，它最适合作为循序渐进的教程。\n\
    \n我们将一起构建一个名为 EmberNote 的应用。它是 Evernote 应用的简化克隆，Evernote 是一个基于 Web 的笔记应用。以 Evernote\
    \ 为模型，我们将利用 Evernote 的笔记本和笔记的层次结构来学习如何使用 Ember 的路由系统和 Ember Data 的数据访问库。我们将构建一个基于\
    \ Markdown 的编辑工具来帮助我们准备 HTML 格式的笔记，并在此过程中了解 Ember 的组件功能。我们将学习如何使用 Ember CLI 构建、测试、部署和分享应用中的酷炫代码。最后，在整本书中，我们将学习如何使用\
    \ Ember CLI 插件为应用添加酷炫功能，例如身份验证和组件库。\n\n## 寻求帮助的途径\n\n本书中的所有代码示例都可以在本书的网页上找到。^([[2]](#f_0010.html_FOOTNOTE-2))\
    \ 在那里你还会找到一个讨论论坛，可以提问和提供反馈。\n\n现在，让我们开始吧！\n\n#### 脚注\n\n| [[1]](#f_0006.html_FNPTR-1)\
    \ | [`github.com/emberjs/ember.js/`](https://github.com/emberjs/ember.js/) |\n\
    \n| [[2]](#f_0010.html_FNPTR-2) | [`pragprog.com/book/mwjsember`](http://pragprog.com/book/mwjsember)\
    \ |\n\n版权所有 © 2015, The Pragmatic Bookshelf.\n\n# 第 1 章\n\n使用 Ember 启动你的应用\n\n\
    在本章中，我们将通过学习 Ember 和 Ember CLI 的一些核心功能来快速起步。首先，我们将通过安装 Ember 和 Ember CLI 来设置开发环境。接下来，我们将开始构建本书中一直使用的应用。我们将使用\
    \ Ember CLI 创建应用及其第一个功能：一个注册页面。最后，我们将通过构建一个基本的、支持数据存储的后端来为这个页面提供支持，用于测试目的。让我们从安装\
    \ Ember 和 Ember CLI 开始。\n\n## 安装 Ember 和 Ember CLI\n\nEmber CLI 是一个用于构建 Ember\
    \ 应用的命令行界面，也是项目团队获取框架库的首选方式。总的来说，Ember 非常注重 Ember 开发者所说的“开发者人体工程学”。他们希望让开发者生活更轻松。Ember\
    \ CLI 正是本着这种精神创建的。正如你将在本书中看到的，Ember CLI 可以轻松处理许多样板任务，例如构建和部署、执行测试、添加文件以创建新功能等。同样重要的是，它允许你为类使用新的基于模块的语法。这大大提高了代码的清晰度。我们将在本书中全程使用\
    \ Ember CLI，所以让我们从安装它开始。\n\nEmber CLI 有几个先决条件：Node、Bower 和 PhantomJS。Ember CLI\
    \ 依赖 Node 来提供浏览器之外的 JavaScript 环境。它使用 Bower 来帮助管理依赖关系。它还使用 PhantomJS 作为测试执行环境。\n"
- fmt: "\nIt’s worth noting that while we’ll use `Node` to run the `Ember CLI` development\
    \ tools, `Ember` itself isn’t a server-side framework, despite the fact that `Node`\
    \ supports server-side JavaScript development. `Ember` is used for creating browser-resident\
    \ apps.\n\nTo begin, let’s install `Node`^[[3]](#f_0014.html_FOOTNOTE-3) and `npm`,^[[4]](#f_0014.html_FOOTNOTE-4)\
    \ as well as `Git`.^[[5]](#f_0014.html_FOOTNOTE-5) `Node` comes with `npm`, but\
    \ `npm` is updated frequently, so it’s worth confirming that you have the latest.\
    \ Please visit the sites to install the most recent version of these tools for\
    \ your particular platform. Your `Node` install should be at least version 0.12\
    \ to support `Ember CLI` tooling. If you already have `Node` installed, you may\
    \ need to uninstall the existing version first.\n\nThe latter two installs are\
    \ required by `Bower`. `npm` is a package manager for code built to run within\
    \ `Node`, or to be used with a tool that runs in `Node`. `Git` is a distributed\
    \ version control system. Install all three using the installation instructions\
    \ at the respective sites.\n\n| Installation |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ | When installing each of these tools, you’ll want to be running as an administrative\
    \ user. On a Linux/BSD/OS X system, you’ll probably want to use the `sudo` prefix\
    \ to do this, and on Windows, you’ll need to be signed in as a user with admin\
    \ rights. As with many installations, there are things that can go wrong, so if\
    \ an issue arises, head to the book’s forum on [http://pragprog.com](http://pragprog.com)\
    \ and we’ll work through it together. |\n\nWith these tools installed, you can\
    \ get `Bower` from a command line:\n\n```\n$ npm install -g bower\n```\n\nYou\
    \ should see several lines of command output, indicating that `Bower` and its\
    \ dependencies have been pulled onto your machine. The `-g` command option asks\
    \ `Node` to install `Bower` and make it available globally, rather than restricting\
    \ it to a specific project. Once `Bower` has finished installing (you’ll see the\
    \ command output stop and be returned to the command prompt), you can install\
    \ `PhantomJS`:\n\n```\n$ npm install -g phantomjs\n```\n\nAgain, you should see\
    \ some command output that tells you `PhantomJS` was installed successfully. With\
    \ these tools, you’re ready to get `Ember CLI`:\n\n```\n$ npm install -g ember-cli\n\
    ```\n\nInstalling `Ember CLI` causes the `Ember` framework libraries to be installed,\
    \ along with the CLI itself. Now that you have `Ember` and `Ember CLI`, we’re\
    \ ready to start coding.\n\n## Start Your App\n\n`Ember CLI` takes a very app-centric\
    \ approach. The first thing you do is to create the app, and every module you\
    \ create is part of that app. As a result, we’re going to follow suit, and explore\
    \ all of `Ember`’s key concepts in the context of one app.\n\nWe’ll be writing\
    \ an app called `EmberNote`, a slimmed-down clone of `Evernote`,^[[6]](#f_0014.html_FOOTNOTE-6)\
    \ the web-based note-taking app. Our first step is to create the app’s repository\
    \ (so called because `Ember CLI` assumes you’ll be using `Git` as a version control\
    \ system).\n\n### Creating the App Repository\n\nOpen a command prompt, navigate\
    \ to a location where you keep your code, and run the following command:\n\n```\n\
    $ ember new ember-note\n```\n\nThis will create a new directory for your app.\
    \ Take a look at the tip that follows if any issues arise.\n\n| New Projects with\
    \ Ember CLI |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | As of this writing, there’s a probable race condition that can occur with\
    \ `Ember CLI` when creating a new repository. If you see an error that looks something\
    \ like this: `ENOENT, open ’ember/package.json’`, you may have run into this error.\
    \ Usually, the `ember new` command succeeds on the second try. On certain non-Windows\
    \ systems, you may also see a console warning about not having `watchman` installed.\
    \ `Ember CLI` uses `watchman` to monitor your filesystem for changes and live\
    \ deploys them to your local server as you’re working on your `Ember` app. It’s\
    \ good to have `watchman`, if for no other reason than to avoid seeing this error,\
    \ but it’s not necessary. Without `watchman`, `Ember CLI` uses a tool called `NodeWatcher`\
    \ for the same purpose. If you want to install `watchman`, visit [https://facebook.github.io/watchman/docs/install.html](https://facebook.github.io/watchman/docs/install.html)\
    \ for platform-specific installation instructions. |\n\nBefore we write our UI\
    \ code, let’s also install a `Bootstrap` stylesheet so we can enjoy a UI that\
    \ doesn’t look like it’s from the early 1990s. From a command prompt in the newly\
    \ created `ember-note` directory, run the following commands:\n\n```\n$ cd ember-note\n\
    $ npm install\n$ bower install\n$ bower install bootstrap --save\n```\n\nThen\
    \ add these lines to `ember-note/ember-cli-build.js`, right before the last line\
    \ of code:\n\n```\napp.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
    app.import('bower_components/bootstrap/dist/css/bootstrap.css.map',{\n  destDir:\
    \ 'assets'\n});\n```\n\nWhen you run these commands, `Ember CLI` creates your\
    \ app’s folder structure for you. Our task throughout the rest of this book is\
    \ to take that structure and fill in all of the details to make an app out of\
    \ it. Make no mistake, `Ember` and `Ember CLI` are opinionated tools. They have\
    \ built-in expectations of how to develop web apps, known as convention-over-configuration.\
    \ The `Ember` team hopes to take a set of best practices, codify them into the\
    \ framework, and allow the developer to focus on more important decisions. To\
    \ get good use from these tools, you’ll want to follow their lead.\n\n### Running\
    \ Your App\n\nLet’s run the app we made and see what that looks like. From a command\
    \ prompt in your new `ember-note` directory, run the following command:\n\n```\n\
    $ ember serve\n```\n\nYou should see some command output that tells you that your\
    \ build was successful and that your app is running on port 4200 of your localhost.\
    \ Let’s open the browser and check. You should see something similar to the output\
    \ shown in the following figure if you point your browser to `localhost:4200`.\n\
    \n![images/welcome.png](images/welcome.png)\n\nThe `ember serve` command did a\
    \ few things for you. First, it built a deployable version of your app and placed\
    \ it in the `ember-note/dist` directory. Then, it started a `node` instance at\
    \ port 4200 and deployed your app to that instance for testing. Once you’ve run\
    \ this command, it will pick up on changes you make to the source code.\n\nLet’s\
    \ try one now. Open the `ember-note/app/templates/application.hbs` file. Its contents\
    \ should look like this:\n\n```\n<h2 id=\"title\">Welcome to Ember</h2>\n\n{{outlet}}\n\
    ```\n\nMake a change to the file so the text says “Welcome to EmberNote.” The\
    \ file should then look like this:\n\n```\n<h2 id=\"title\">Welcome to EmberNote</h2>\n\
    \n{{outlet}}\n```\n\nAs soon as you save the change, look at your browser. `Ember\
    \ CLI` detected the change, rebuilt your app, and deployed it when you saved.\
    \ This is a big time-saver, because you don’t have to manually take steps to redeploy\
    \ the app yourself. It all happens out of the box with `Ember CLI`!\n\nYou can\
    \ see that `Ember CLI` is a handy tool to have around. Now it’s time to get into\
    \ some code. If we’re going to build an app, we’ll need to be able to let users\
    \ sign up, right? Let’s start there.\n\n### Registering Users\n\nLet’s look at\
    \ a straightforward example that will demonstrate many of the core features of\
    \ an `Ember` app: routes, templates, and models. We’re going to build a simplified\
    \ registration page that will allow users to sign up for the `EmberNote` service.\
    \ This page has a single text field where the user can enter his or her username,\
    \ a button to trigger the add action, and some text that will be displayed when\
    \ a new user is added.\n"
  raw: 'It’s worth noting that while we’ll use Node to run the Ember CLI development
    tools, Ember itself isn’t a server-side framework, despite the fact that Node
    supports server-side JavaScript development. Ember is used for creating browser-resident
    apps.


    To begin, let’s install Node^([[3]](#f_0014.html_FOOTNOTE-3)) and npm,^([[4]](#f_0014.html_FOOTNOTE-4))
    as well as Git.^([[5]](#f_0014.html_FOOTNOTE-5)) Node comes with npm, but npm
    is updated frequently, so it’s worth confirming that you have the latest. Please
    visit the sites to install the most recent version of these tools for your particular
    platform. Your Node install should be at least version 0.12 to support Ember CLI
    tooling. If you already have Node installed, you may need to uninstall the existing
    version first.


    The latter two installs are required by Bower. Npm is a package manager for code
    built to run within Node, or to be used with a tool that runs in Node. Git is
    a distributed version control system. Install all three using the installation
    instructions at the respective sites.


    | Installation |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | When installing
    each of these tools, you’ll want to be running as an administrative user. On a
    Linux/BSD/OS X system, you’ll probably want to use the sudo prefix to do this,
    and on Windows, you’ll need to be signed in as a user with admin rights. As with
    many installations, there are things that can go wrong, so if an issue arises,
    head to the book’s forum on [http://pragprog.com](http://pragprog.com) and we’ll
    work through it together. |


    With these tools installed, you can get Bower from a command line:


    | ​  | $ npm install -g bower |


    You should see several lines of command output, indicating that Bower and its
    dependencies have been pulled onto your machine. The -g command option asks Node
    to install Bower and make it available globally, rather than restricting it to
    a specific project. Once Bower has finished installing (you’ll see the command
    output stop and be returned to the command prompt), you can install PhantomJS:


    | ​  | $ npm install -g phantomjs |


    Again, you should see some command output that tells you PhantomJS was installed
    successfully. With these tools, you’re ready to get Ember CLI:


    | ​  | $ npm install -g ember-cli |


    Installing Ember CLI causes the Ember framework libraries to be installed, along
    with the CLI itself. Now that you have Ember and Ember CLI, we’re ready to start
    coding.


    ## Start Your App


    Ember CLI takes a very app-centric approach. The first thing you do is to create
    the app, and every module you create is part of that app. As a result, we’re going
    to follow suit, and explore all of Ember’s key concepts in the context of one
    app.


    We’ll be writing an app called EmberNote, a slimmed-down clone of Evernote,^([[6]](#f_0014.html_FOOTNOTE-6))
    the web-based note-taking app. Our first step is to create the app’s repository
    (so called because Ember CLI assumes you’ll be using Git as a version control
    system).


    ### Creating the App Repository


    Open a command prompt, navigate to a location where you keep your code, and run
    the following command:


    | ​  | $ ember new ember-note |


    This will create a new directory for your app. Take a look at the tip that follows
    if any issues arise.


    | New Projects with Ember CLI |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | As of
    this writing, there’s a probable race condition that can occur with Ember CLI
    when creating a new repository. If you see an error that looks something like
    this: ENOENT, open ’ember/package.json’, you may have run into this error. Usually,
    the ember new command succeeds on the second try.On certain non-Windows systems,
    you may also see a console warning about not having watchman installed. Ember
    CLI uses watchman to monitor your filesystem for changes and live deploys them
    to your local server as you’re working on your Ember app. It’s good to have watchman,
    if for no other reason than to avoid seeing this error, but it’s not necessary.
    Without watchman, Ember CLI uses a tool called NodeWatcher for the same purpose.
    If you want to install watchman, visit [https://facebook.github.io/watchman/docs/install.html](https://facebook.github.io/watchman/docs/install.html)
    for platform-specific installation instructions. |


    Before we write our UI code, let’s also install a Bootstrap stylesheet so we can
    enjoy a UI that doesn’t look like it’s from the early 1990s. From a command prompt
    in the newly created ember-note directory, run the following commands:


    | ​  | $ ​**cd**​ ember-note |


    | ​  | $ npm install |


    | ​  | $ bower install |


    | ​  | $ bower install bootstrap --save |


    Then add these lines to ember-note/ember-cli-build.js, right before the last line
    of code:


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/css/bootstrap.css''*​);
    |


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/css/bootstrap.css.map''*​,{
    |


    | ​  | destDir: ​*''assets''*​ |


    | ​  | }); |


    When you run these commands, Ember CLI creates your app’s folder structure for
    you. Our task throughout the rest of this book is to take that structure and fill
    in all of the details to make an app out of it. Make no mistake, Ember and Ember
    CLI are opinionated tools. They have built-in expectations of how to develop web
    apps, known as convention-over-configuration. The Ember team hopes to take a set
    of best practices, codify them into the framework, and allow the developer to
    focus on more important decisions. To get good use from these tools, you’ll want
    to follow their lead.


    ### Running Your App


    Let’s run the app we made and see what that looks like. From a command prompt
    in your new ember-note directory, run the following command:


    | ​  | $ ember serve |


    You should see some command output that tells you that your build was successful
    and that your app is running on port 4200 of your localhost. Let’s open the browser
    and check. You should see something similar to the output shown in the following
    figure if you point your browser to localhost:4200.


    ![images/welcome.png](images/welcome.png)


    The ember serve command did a few things for you. First, it built a deployable
    version of your app and placed it in the ember-note/dist directory. Then, it started
    a node instance at port 4200 and deployed your app to that instance for testing.
    Once you’ve run this command, it will pick up on changes you make to the source
    code.


    Let’s try one now. Open the ember-note/app/templates/application.hbs file. Its
    contents should look like this:


    | ​  | ​**<h2**​ id=​*"title"*​​**>**​Welcome to Ember​**</h2>**​ |


    | ​  |  |


    | ​  | {{outlet}} |


    Make a change to the file so the text says “Welcome to EmberNote.” The file should
    then look like this:


    | ​  | ​**<h2**​ id=​*"title"*​​**>**​Welcome to EmberNote​**</h2>**​ |


    | ​  |  |


    | ​  | {{outlet}} |


    As soon as you save the change, look at your browser. Ember CLI detected the change,
    rebuilt your app, and deployed it when you saved. This is a big time-saver, because
    you don’t have to manually take steps to redeploy the app yourself. It all happens
    out of the box with Ember CLI!


    You can see that Ember CLI is a handy tool to have around. Now it’s time to get
    into some code. If we’re going to build an app, we’ll need to be able to let users
    sign up, right? Let’s start there.


    ### Registering Users


    Let’s look at a straightforward example that will demonstrate many of the core
    features of an Ember app: routes, templates, and models. We’re going to build
    a simplified registration page that will allow users to sign up for the EmberNote
    service. This page has a single text field where the user can enter his or her
    username, a button to trigger the add action, and some text that will be displayed
    when a new user is added.'
