  trans: "\n为了帮助解决这个问题，Ember Data 提供了一系列类，用于适配非标准 API，使其遵循 Ember 其余部分所期望的约定。这可以简单到将属性名称从一种命名约定转换为另一种，也可以复杂到使用\
    \ Ember Data 在传输过程中修改 JSON。\n\n在本章中，我们将探讨如何使用 Ember Data 来处理你可能遇到的任何标准或非标准 API。\n\
    \n## 适配非传统 API\n\n到目前为止，EmberNote API 一直使用 Ember Data 期望的 API 约定。在本章中，我们首先会创建一个不遵循传统约定的\
    \ EmberNote API 的并行版本。然后，我们将使用这个新版本学习如何让 Ember Data 适配这样的 API。\n\n要开始这个过程，你需要为每个已创建的模拟服务器文件创建一个副本。取出\
    \ `ember-note/server/mocks` 目录中的每个文件，复制它，并在文件名末尾、文件扩展名之前追加 `-alt-api`，这样 `notes.js`\
    \ 就变成了 `notes-alt-api.js`。别忘了保留原始文件。在每个 `-alt-api` 文件中，我们创建 NEDB 数据文件的地方，通过追加\
    \ `-alt` 来更改数据文件的名称，如下所示：\n\n```\nvar noteDB = new nedb({ filename : 'notes-alt',\
    \ autoload: true});\n```\n\n然后，在每个新文件的底部，更改监听器 URL，使其包含 `api` 路径段：\n\n```\napp.use('/api/alt/notes',\
    \ notesRouter);\n```\n\n运行 `ember serve` 命令，确保你的应用能够启动并连接新的 API。\n\n### 为你的 API\
    \ 添加请求头\n\n在新的 API 运行后，让我们按如下方式修改 `RESTAdapter`：\n\n```\n[ch6/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/adapters/application.js)\n\
    \nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace:\
    \ 'api/alt',\n});\n```\n\n对 `namespace` 的简单修改将使适配器将请求发送到备用的 API 端点。如果你现在在浏览器中加载\
    \ EmberNote，你会看到之前注册的用户无法登录，因为我们创建了新的底层数据存储。在生产应用中，你不需要这样做，但由于我们的模拟服务器端点都在同一个\
    \ Node 实例中运行，我们必须创建单独的数据存储，以解决 NEDB 无法两次加载同一存储的限制。\n\n除了设置 API 端点路径之外，`RESTAdapter`\
    \ 还有其他一些可用的自定义选项。例如，许多 API 需要 HTTP 请求头来标识用户。`RESTAdapter` 包含一个名为 `headers` 的属性，你可以根据需要设置它。让我们修改\
    \ EmberNote，在用户登录后，为每个请求添加一个用户令牌作为请求头。\n\n为了从 `RESTAdapter` 内部填充请求头，我们需要一种向适配器提供用户数据的方法。当用户首次登录时，这些用户数据在登录路由中可用。之前，当我们想在用户路由之外获取用户数据时，我们只是使用了\
    \ `controllerFor` 方法。然而，这个方法在我们的 `RESTAdapter` 内部不可用。为了从适配器获取用户信息，我们需要使用 Ember\
    \ 的高级特性之一：依赖注入。我们之前已经使用过依赖注入——实际上，每当我们在路由或控制器中调用 `this.store` 时，都在使用它。让我们看看如何创建自己的对象用于依赖注入。\n\
    \n#### 创建并注入用户会话\n\n我们将创建一个名为 `Session` 的类，并用它来存储我们想要在类之间共享的信息。我们将使用一个初始化器来初始化这个类并使其可用。初始化器是一个函数，当\
    \ Ember 应用在浏览器中首次启动时运行，它对于通过依赖注入使对象可用非常有用。要创建一个初始化器，请从 EmberNote 根目录运行以下 Ember\
    \ CLI 命令：\n\n```\n$ ember generate initializer session\n```\n\n此命令会为你的初始化器生成一个存根。将以下代码添加到存根中以完成初始化器：\n\
    \n```\n[ch6/ember-note/app/initializers/session.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/initializers/session.js)\n\
    \nimport Ember from 'ember';\n\nexport function initialize(container,application)\
    \ {\n  var session = Ember.Object.extend();\n  application.register('session:main',\
    \ session);\n  application.inject('adapter', 'session', 'session:main');\n  application.inject('route','session','session:main');\n\
    }\n\nexport default {\n  name: 'session',\n  initialize: initialize\n};\n```\n\
    \n第一段代码定义了该初始化器的 `initialize` 方法。该方法接收应用的容器和应用程序实例。在方法内部，我们扩展了 `Ember.Object`\
    \ 并将结果赋值给一个名为 `session` 的变量。我们将使用这个匿名类，通过 `Ember.Object` 的 `get` 和 `set` 方法来保存会话信息。\n\
    \n**Ember 插件：Ember CLI Simple Auth**\n\n我们的示例会话对象是一个好的开始，但未来我们可能需要更复杂的身份验证和会话管理。Ember\
    \ 本身不提供会话对象或内置的身份验证机制，但与其他大多数情况一样，有一个插件可以解决这个问题。让我们快速了解一下 Ember Simple Auth 和\
    \ Ember CLI Simple Auth 插件。\n\nEmber Simple Auth 项目是一个用于向 Ember 应用添加身份验证的库。除其他功能外，它允许你针对自己的服务器或支持\
    \ OAuth 的外部服务进行身份验证。一旦通过身份验证，你可以使用 Ember Simple Auth 授权对服务器的请求，通过阻止未授权用户访问来保护操作。\n\
    \n然而，Ember Simple Auth 本身并不是一个插件。要将其与 Ember CLI 一起使用，你需要 Ember CLI Simple Auth\
    \ 插件，该插件打包了 Ember Simple Auth 代码，并使其能够通过 Ember CLI 安装。这是一个很好的例子，展示了 Ember CLI\
    \ 如何使分享好想法成为可能。像 Ember Simple Auth 这样的代码库，只需在项目中执行一条命令即可轻松获取。\n\nEmber CLI Simple\
    \ Auth 插件的完整文档位于 [`github.com/simplabs/ember-cli-simple-auth`](https://github.com/simplabs/ember-cli-simple-auth)。\n\
