    \ 的商标。\n\n本书在编写过程中已采取一切预防措施。但出版商对书中的错误、遗漏或因使用本书所含信息（包括程序清单）而导致的损害不承担任何责任。\n\n\
    我们的 Pragmatic 课程、工作坊及其他产品可帮助您和您的团队创建更好的软件并享受更多乐趣。如需了解更多信息及最新 Pragmatic 书目，请访问\
    \ [`pragprog.com`](http://pragprog.com)。\n\n本书的制作团队包括：  \nKatharine Dvorak（编辑）\
    \  \nPotomac Indexing, LLC（索引编制）  \nLiz Welch（文字编辑）  \nDave Thomas（排版）  \nJanet\
    \ Furlow（制作人）  \nEllie Callahan（支持）  \n如需国际版权事宜，请联系 rights@pragprog.com。\n\n##\
