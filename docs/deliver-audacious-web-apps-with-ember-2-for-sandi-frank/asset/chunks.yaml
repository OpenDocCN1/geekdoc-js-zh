  trans: "\n要在 Ember 中使用依赖注入，通常需要执行两个步骤。首先，将服务注册到容器中；然后，将其注入到任何你想要访问该服务的类工厂中。\n\n\
    以下代码演示了如何实现这些步骤来注入我们新的日志记录器初始化器：\n\n`ch7/ember-note/app/initializers/logger.js`\
    \ ([`media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/initializers/logger.js))\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport function initialize(registry,\
    \ application) {\n  var logger = Ember.Object.extend({\n    log: function(message)\
    \ {\n      console.log(message);\n    }\n  });\n  application.register('logger:main',\
    \ logger);\n  application.inject('route', 'logger', 'logger:main');\n}\n\nexport\
    \ default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n我们首先创建了日志记录器的实现。它是\
    \ `Ember.Object` 的扩展，并围绕 JavaScript 的 `console` 对象提供了一个简单的单参数包装器。\n\n接下来，我们使用传入\
    \ `initialize` 函数的 `Ember.Application` 对象的 `register` 方法注册这个新类。`register` 方法最多接受三个参数：注册对象的名称（`logger:main`）、工厂（指向我们新类的\
    \ `logger` 变量）以及一个选项哈希。\n\n选项哈希可以包含两个属性：`instantiate` 和 `singleton`。默认情况下，除非传入值为\
    \ `false` 的选项哈希，否则会调用工厂的 `create` 方法。如果 `singleton` 为 `false`，则在查找该对象时可以创建多个实例；否则，每次查找都会返回同一个实例。\n\
    \n`inject` 方法的作用是将这个新注册的工厂在整个应用中可用。`inject` 方法接受三个参数。第一个参数是目标工厂的名称，你的新工厂将被注入到该工厂中。在我们的例子中，我们通过将\
    \ `route` 工厂传递给 `inject`，将新的日志记录器注入到每个路由实现中。你也可以通过名称指定具体的实现（例如 `route:notebooks`）。第二个参数是接收新工厂实例的属性名称。通过这个属性，你可以从客户端类中引用注入的服务。最后，第三个参数是你想要注入的工厂的注入名称，该名称应与注册时的名称一致（例如\
    \ `logger:main`）。\n\n一旦注入在应用的初始化过程中完成，它就会在注入到的每个实例中以指定的属性名称可用。以下代码演示了如何从类中使用注入的服务：\n\
    \n`ch7/ember-note/app/notebooks/route.js` ([`media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js`](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/notebooks/route.js))\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  model: function(params) {\n    return this.store.query('notebook', {user: params.user_id});\n\
    \  },\n  actions: {\n    addNotebook: function() {\n      var notebook = this.store.createRecord('notebook',\
    \ {\n        title: this.controller.get('title'),\n        user: this.session.get('user')\n\
    \      });\n      notebook.save().then(() => {\n        this.logger.log('save\
    \ successful');\n        this.controller.set('title', null);\n        this.refresh();\n\
    \      }, () => {\n        this.logger.log('save failed');\n      });\n    }\n\
    \  }\n});\n```\n\n通过在初始化器中注册并注入日志记录器类，一个名为 `logger` 的属性将在你应用中所有 `Ember.Route`\
    \ 的实例中可用。图 展示了这些部分如何组合在一起：\n\n![images/dependency-injection.png](img/dependency-injection.png)\n\
    \nEmber Data 框架很好地利用了依赖注入。当你在路由实现中引用 `store` 属性时，那是因为该属性是通过 Ember Data 设置的注入初始化器来赋值的。\n\
    \n除了将服务全局注入到对象工厂之外，还有另一种选择。如果你只想在更有限的子集对象中使用某个服务，可以使用不同的 API 仅从你想要影响的类中获取该服务。\n\
    \n假设你有一个名为 `foo` 的服务，并且只想在单个路由中使用它。你可以像这样创建一个访问该服务的属性：\n\n```javascript\nimport\
    \ Ember from 'ember';\n\nexport default Ember.Route.extend({\n  fooService: Ember.inject.service('foo'),\n\
    \  model: function(params) {\n    return this.fooService.mumblyFoo(params.foobar);\n\
    \  }\n});\n```\n\n假设你已经在初始化器中注册了一个名为 `foo` 的服务，那么你可以使用 `Ember.inject.service`\
    \ 来访问它。唯一的区别是，在初始化器中，你需要将 `foo` 服务注册为 `service:foo`，而不是 `foo:main`，否则容器可能无法正确查找。\n\
    \n工具、混入和依赖注入是使代码更加模块化的三种有用方式，我鼓励你在适当的上下文中考虑使用它们。在进入下一章之前，我们还要简要探讨一下抽象。在下一节中，我将讨论如何使用\
    \ Ember Data 转换在模型中应用特定于应用的数据类型。\n\n## 使用转换来调整数据\n\n如果你使用 Ember Data 访问旧版 API，或者使用来自上游数据源的数据，你可能需要在应用中使用数据之前对数据值进行一些转换。针对这种用例，Ember\
    \ Data 提供了 `DS.Transform` 类。`DS.Transform` 封装了将数据从一种形式转换为所需形式所需的逻辑。\n\nEmber Data\
    \ 自带了一些内置的 `DS.Transform` 实现：`DS.BooleanTransform`、`DS.DateTransform` 和 `DS.NumberTransform`。每个实现负责将非规范形式的数据转换为预期形式。例如，`DS.BooleanTransform`\
    \ 能够接收值为 `\"true\"` 或 `1` 的原始 JSON，并将其转换为布尔值 `true`。\n\n让我们看看这如何用于另一种转换。想象一个用例，你的应用访问来自上游数据源的金融交易数据。更复杂的是，这些交易以美元存储。应用希望以用户的本国货币显示所有这些数据点。`DS.Transform`\
    \ 可以帮上忙。\n\n首先，执行以下 Ember CLI 命令：\n\n```bash\n$ ember generate transform native-currency\n\
    ```\n\n该命令会生成一个空的转换存根。以下示例说明了如何构建转换：\n\n```javascript\nimport DS from 'ember-data';\n\
    \nexport default DS.Transform.extend({\n  deserialize: function(serialized) {\n\
    \n    // 在此处执行货币转换\n    var amountInNative =\n      this.currencyTranslator.translateToNative(serialized);\n\
    \    return amountInNative;\n  },\n\n  serialize: function(deserialized) {\n\n\
    \    // 从本国货币转换为美元\n    var amountInUSD = this.currencyTranslator.translateToUSD(deserialized);\n\
    \    return amountInUSD;\n  }\n});\n```\n"
- fmt: "\nIn this example, we assume that a user-specific translation object has been\
    \ created and injected into the transform. This will allow us to compute translations\
    \ that use the user’s currency translation rate. The transform itself is simply\
    \ responsible for stepping in when a model requests information in the native\
    \ currency. An example model class that needs to use the transform would look\
    \ like this:\n\n```\nimport DS from \"ember-data\";\n\nexport default DS.Model.extend({\n\
    \  toAccount: DS.attr('string'),\n  fromAccount: DS.attr('string'),\n  amount:\
    \ DS.attr('native-currency') // Amount in native currency\n});\n```\n\nThe same\
    \ data could be represented without using the transform like this:\n\n```\nimport\
    \ DS from \"ember-data\";\n\nexport default DS.Model.extend({\n  toAccount: DS.attr('string'),\n\
    \  fromAccount: DS.attr('string'),\n  amount: DS.attr('number') // Amount in USD\
    \ as kept in the data store\n});\n```\n\nThe transform works both to deserialize\
    \ the data (that is, translate from its stored format to its displayed format),\
    \ and to serialize the data. This means that you can display in your chosen format,\
    \ but when it’s time to save, the serialize function steps in and converts the\
    \ data back into the appropriate format, to remain consistent with the database’s\
    \ expectations.\n\n## Next Steps\n\nWe spent the majority of our time together\
    \ learning how to build Ember apps. Building an app is great, but you want to\
    \ get it in front of people, right? In the next two chapters you’ll learn a bit\
    \ more about Ember CLI, which helps greatly in the deploy and release process.\
    \ Next up, you’ll learn how to use it to manage dependencies and build a deployable\
    \ artifact from your Ember code. As part of that process, we’ll also look at how\
    \ to use the test hooks Ember CLI provides so that we can be confident in our\
    \ code.\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# Chapter 8\n\nBuilding,\
    \ Testing, and Deploying Your Ember Apps\n\nWe’ve done a great deal of work so\
    \ far building our app’s features. But there’s another important area we need\
    \ to address before we’re done. We need to spend some time thinking about how\
    \ to make our app ready for production.\n\nEmber CLI does a lot of this work for\
    \ us, but it will help you as a developer to understand a little of what’s going\
    \ on behind the scenes. To begin, we’ll take a look at how Ember CLI prepares\
    \ a usable version of your application from the code you create. Then, we’ll spend\
    \ the majority of this chapter discussing how Ember CLI helps you test your app.\
    \ Last, we’ll take a look at how Ember CLI helps you deploy your application.\n\
    \nLet’s get started by looking at how Ember CLI builds your application code and\
    \ keeps it ready for you to run at a moment’s notice.\n\n## Build Your App\n\n\
    If you’ve worked in JavaScript (or any other software development tool) for long\
    \ you’re probably familiar with one common roadblock: the build system. Like with\
    \ languages, everybody has a different opinion about what is the best build system\
    \ for a given language. Closely related to this choice is your choice of dependency\
    \ management. Choosing a build and dependency management tool is one challenge;\
    \ configuring the chosen toolset is another. Thankfully, Ember CLI elegantly solves\
    \ this issue for you.\n\n### Getting Your Dependencies\n\nWhen you first install\
    \ Ember CLI, it includes the most current version of Ember. As part of the Ember\
    \ 2.x release cycle, the Ember core and Ember CLI will synchronize release schedules.\
    \ As such, if you want to upgrade Ember CLI, Ember should follow. You can upgrade\
    \ Ember CLI by running the following commands as an administrative user in your\
    \ project directory:\n\n```\n$ npm uninstall -g ember-cli\n$ npm cache clean\n\
    $ bower cache clean\n$ npm install -g ember-cli\n$ npm install ember-cli --save-dev\n\
    $ rm -rf node_modules bower_components dist tmp\n$ npm install\n$ bower install\n\
    $ ember init\n```\n\nThe first three commands remove the current version of Ember\
    \ CLI from the npm package management system and clear out related files from\
    \ both the npm and Bower caches. Next, the latest Ember CLI is installed and made\
    \ available globally (as defined by the `-g` flag), and also installed into your\
    \ project’s `package.json` file (where we use the `--save-dev` flag).\n\nThen,\
    \ to be safe, we remove the four directories in our app that contain dependencies\
    \ and built versions of our apps. The next two commands reinstall all of the dependencies\
    \ listed in `package.json` and `bower.json` into your local components directories.\
    \ Lastly, `ember init` reruns all of the Ember CLI blueprints against your current\
    \ codebase to look for changes. You’ve used these blueprints every time you’ve\
    \ run `ember generate`, and because the blueprints can change, it’s good to reapply\
    \ them. The command gives you the chance to approve each diff listed, so you’re\
    \ aware of what’s changed by this command. Be careful here—some of the changes\
    \ might remove code you want to keep, depending on what’s changed in Ember CLI,\
    \ so it’s best to be cautious. You’re using a good version control system, right?\n\
    \nThere may be times when you want to simply update one of your dependencies without\
    \ updating Ember CLI. Because Ember CLI relies on Bower, you can simply install\
    \ an updated dependency by running the following:\n\n```\n$ bower install my-dependency\
    \ --save\n```\n\nThis will update your `bower.json` so the dependency becomes\
    \ part of your project.\n\n### Running Your App Locally\n\nAs you’re coding or\
    \ changing dependencies, Ember CLI keeps the local deployment up to date, assuming\
    \ you have a running instance launched via the `ember serve` command. Ember CLI\
    \ builds a locally deployable version of the app, including your mock server,\
    \ and starts this app.\n\nAs we’ve seen throughout the book, when you run the\
    \ `ember serve` command, it launches the watchman service. When watchman detects\
    \ a change in one of your app’s files, it triggers a rebuild of the app. Further,\
    \ when you browse to the app, the locally deployed version contains a WebSockets\
    \ client that monitors for changes and reloads your app in the browser if necessary.\
    \ This is pretty handy, particularly when you’re coding fast and want to see changes\
    \ just as fast. One other thing you’ll want to do when you’re coding fast is to\
    \ write test cases. We’ll see how to do that now.\n\n## Test and Debug Your App\n\
    \nI’ve been keeping a little secret this whole time. Ember CLI doesn’t just generate\
    \ your classes for you when you run an `ember generate`. It generates test harnesses\
    \ for you as well. In fact, they are complete enough to be runnable (though they\
    \ don’t offer much in the way of coverage). If you’re among those who have had\
    \ a hard time in the past with applying good testing practices to your JavaScript\
    \ client code, your last excuse just fell away.\n\n### Test Execution\n\nLet’s\
    \ start by reviewing the current test results for the tests that Ember CLI has\
    \ created as we work. Open a command prompt, navigate to the root of the EmberNote\
    \ project, and run the following:\n\n```\n$ ember test\n```\n\nWhen you run this\
    \ command, you should see your console filling with output. Ember CLI will first\
    \ build your app, then run the tests it has been generating throughout your work.\n\
    \nThere’s a second way to view your tests. From the same command prompt, press\
    \ `Ctrl-C`, which halts the paused output of `ember test`. It should report a\
    \ few failing tests, which we’ll get to in a moment. First, run `ember serve`\
    \ from the command line. Then, point your browser at `localhost:4200/tests`.\n"
  raw: 'In this example, we assume that a user-specific translation object has been
    created and injected into the transform. This will allow us to compute translations
    that use the user’s currency translation rate. The transform itself is simply
    responsible for stepping in when a model requests information in the native currency.
    An example model class that needs to use the transform would look like this:


    | ​  | ​**import**​ DS from ​*"ember-data"*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | toAccount: DS.attr(​*''string''*​), |


    | ​  | fromAccount: DS.attr(​*''string''*​), |


    | ​  | amount: DS.attr(​*''native-currency''*​) ​*// Amount in native currency*​
    |


    | ​  | }); |


    The same data could be represented without using the transform like this:


    | ​  | ​**import**​ DS from ​*"ember-data"*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | toAccount: DS.attr(​*''string''*​), |


    | ​  | fromAccount: DS.attr(​*''string''*​), |


    | ​  | amount: DS.attr(​*''number''*​) ​*// Amount in USD as kept in the data
    store*​ |


    | ​  | }); |


    The transform works both to deserialize the data (that is, translate from its
    stored format to its displayed format), and to serialize the data. This means
    that you can display in your chosen format, but when it’s time to save, the serialize
    function steps in and converts the data back into the appropriate format, to remain
    consistent with the database’s expectations.


    ## Next Steps


    We spent the majority of our time together learning how to build Ember apps. Building
    an app is great, but you want to get it in front of people, right? In the next
    two chapters you’ll learn a bit more about Ember CLI, which helps greatly in the
    deploy and release process. Next up, you’ll learn how to use it to manage dependencies
    and build a deployable artifact from your Ember code. As part of that process,
    we’ll also look at how to use the test hooks Ember CLI provides so that we can
    be confident in our code.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 8


    Building, Testing, and Deploying Your Ember Apps


    We’ve done a great deal of work so far building our app’s features. But there’s
    another important area we need to address before we’re done. We need to spend
    some time thinking about how to make our app ready for production.


    Ember CLI does a lot of this work for us, but it will help you as a developer
    to understand a little of what’s going on behind the scenes. To begin, we’ll take
    a look at how Ember CLI prepares a usable version of your application from the
    code you create. Then, we’ll spend the majority of this chapter discussing how
    Ember CLI helps you test your app. Last, we’ll take a look at how Ember CLI helps
    you deploy your application.


    Let’s get started by looking at how Ember CLI builds your application code and
    keeps it ready for you to run at a moment’s notice.


    ## Build Your App


    If you’ve worked in JavaScript (or any other software development tool) for long
    you’re probably familiar with one common roadblock: the build system. Like with
    languages, everybody has a different opinion about what is the best build system
    for a given language. Closely related to this choice is your choice of dependency
    management. Choosing a build and dependency management tool is one challenge;
    configuring the chosen toolset is another. Thankfully, Ember CLI elegantly solves
    this issue for you.


    ### Getting Your Dependencies


    When you first install Ember CLI, it includes the most current version of Ember.
    As part of the Ember 2.x release cycle, the Ember core and Ember CLI will synchronize
    release schedules. As such, if you want to upgrade Ember CLI, Ember should follow.
    You can upgrade Ember CLI by running the following commands as an administrative
    user in your project directory:


    | ​  | $ npm uninstall -g ember-cli |


    | ​  | $ npm cache clean |


    | ​  | $ bower cache clean |


    | ​  | $ npm install -g ember-cli |


    | ​  | $ npm install ember-cli --save-dev |


    | ​  | $ ​**rm**​ -rf node_modules bower_components dist tmp |


    | ​  | $ npm install |


    | ​  | $ bower install |


    | ​  | $ ember init |


    The first three commands remove the current version of Ember CLI from the npm
    package management system and clear out related files from both the npm and Bower
    caches. Next, the latest Ember CLI is installed and made available globally (as
    defined by the -g flag), and also installed into your project’s package.json file
    (where we use the --save-dev flag).


    Then, to be safe, we remove the four directories in our app that contain dependencies
    and built versions of our apps. The next two commands reinstall all of the dependencies
    listed in package.json and bower.json into your local components directories.
    Lastly, ember init reruns all of the Ember CLI blueprints against your current
    codebase to look for changes. You’ve used these blueprints every time you’ve run
    ember generate, and because the blueprints can change, it’s good to reapply them.
    The command gives you the chance to approve each diff listed, so you’re aware
    of what’s changed by this command. Be careful here—some of the changes might remove
    code you want to keep, depending on what’s changed in Ember CLI, so it’s best
    to be cautious. You’re using a good version control system, right?


    There may be times when you want to simply update one of your dependencies without
    updating Ember CLI. Because Ember CLI relies on Bower, you can simply install
    an updated dependency by running the following:


    | ​  | $ bower install my-dependency --save |


    This will update your bower.json so the dependency becomes part of your project.


    ### Running Your App Locally


    As you’re coding or changing dependencies, Ember CLI keeps the local deployment
    up to date, assuming you have a running instance launched via the ember serve
    command. Ember CLI builds a locally deployable version of the app, including your
    mock server, and starts this app.


    As we’ve seen throughout the book, when you run the ember serve command, it launches
    the watchman service. When watchman detects a change in one of your app’s files,
    it triggers a rebuild of the app. Further, when you browse to the app, the locally
    deployed version contains a WebSockets client that monitors for changes and reloads
    your app in the browser if necessary. This is pretty handy, particularly when
    you’re coding fast and want to see changes just as fast. One other thing you’ll
    want to do when you’re coding fast is to write test cases. We’ll see how to do
    that now.


    ## Test and Debug Your App


    I’ve been keeping a little secret this whole time. Ember CLI doesn’t just generate
    your classes for you when you run an ember generate. It generates test harnesses
    for you as well. In fact, they are complete enough to be runnable (though they
    don’t offer much in the way of coverage). If you’re among those who have had a
    hard time in the past with applying good testing practices to your JavaScript
    client code, your last excuse just fell away.


    ### Test Execution


    Let’s start by reviewing the current test results for the tests that Ember CLI
    has created as we work. Open a command prompt, navigate to the root of the EmberNote
    project, and run the following:


    | ​  | $ ember test |


    When you run this command, you should see your console filling with output. Ember
    CLI will first build your app, then run the tests it has been generating throughout
    your work.


    There’s a second way to view your tests. From the same command prompt, press Ctrl-C,
    which halts the paused output of ember test. It should report a few failing tests,
    which we’ll get to in a moment. First, run ember serve from the command line.
    Then, point your browser at localhost:4200/tests.'
