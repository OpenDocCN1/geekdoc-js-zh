    \      note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\n`import`\
    \ 语句使得新的工具函数 `isValidLength` 在路由中可用。几行之后，我们在添加标题之前使用该函数检查其长度，如果标题未通过验证，则提醒用户我们不会保存该记录。\n\
    \n值得注意的是，新函数在 `is-valid-length.js` 中的定义以及 notes 路由中的 `import` 和调用中都被称为 `isValidLength`。一旦你在文件中定义了该函数并将其导入到另一个类中，你就可以像使用该类中定义的函数一样使用它。\n\
    \n如果你想创建一个可以在整个应用中导入和使用的单一函数，工具函数可以帮到你。然而，共享一组这样的函数通常也很有帮助。一种方法是创建一个 `mixin`，然后将其包含到需要使用它的类中。现在让我们来看看。\n\
    \n## 使用混入（Mixins）共享代码\n\n虽然工具函数是共享单个函数的有用方式，但它们并不能覆盖所有可能的需求。如果我们的验证工具函数能够以一组可在多个地方使用的函数形式存在，那将会更加有用。为此，我们可以创建一个\
    \ `mixin`。在 Ember 中，`mixin` 是一组属性和函数，可以在任何依赖它们的类中使用。这些属性和函数的定义位于 `mixin` 中，并且可以在任何使用了该\
