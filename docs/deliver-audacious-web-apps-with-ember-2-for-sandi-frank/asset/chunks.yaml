  trans: "\nEmber 组件是一个绝妙的想法，Ember 团队在实现它们方面功不可没。在撰写本文时，W3C 也正在制定关于自定义元素的规范，这与 Ember\
    \ 使用组件的方式非常相似。Ember 没有等待 W3C 最终确定规范（这可能需要很长时间），而是率先推进了其实现。\n\n在 W3C 规范中，自定义元素是一种由开发者定义的\
    \ DOM 元素，浏览器能够理解并渲染它。它允许开发者像组件一样定义 DOM 元素的用户界面和动作行为。如果该规范获得批准，它最终将成为 HTML 语言的一部分，从而减少对自定义框架支持的需求。\n\
    \nEmber 团队密切关注标准制定过程，因此只要您保持相对较新的 Ember 版本，就可以放心，您的组件将在规范发布后与之匹配。正在制定的规范在 GitHub\
    \ 上编写，您可以随时通过访问 [`w3c.github.io/webcomponents/spec/custom/`](https://w3c.github.io/webcomponents/spec/custom/)\
    \ 来阅读。如果您好奇，不妨去看看！\n\n这里还演示了另外三个特性：动作处理、组件嵌套和 `{{yield}}` 标签。我们将在 *处理动作* 中介绍动作处理。接下来我们先处理另外两个。\n\
    \n### 嵌套组件\n\n使用 Ember 组件的强大之处在于，能够将应用中反复出现的 HTML 标签组合起来，创建一个可复用的表达式来封装该组合。为了使这一特性更加强大，Ember\
    \ 组件支持嵌套。也就是说，您可以在一个组件内部调用另一个组件，并且它的工作方式与您预期的一致。\n\n在我们的新编辑笔记模板中，我们已经这样做了。对 `{{markdown-to-html\
    \ markdown=note.body}}` 的引用使用了另一个组件 `markdown-to-html`。我们还没有获取这个组件，因此这个引用目前无法工作。\n\
    \n`markdown-to-html` 组件是 Ember 插件的一部分。Ember 插件是一个足够有用的库，可以在多个应用程序之间共享。它可以通过 npm\
    \ 公开提供，就像我们正在使用的这个一样，也可以保存在私有仓库中。我们将在第 9 章 *构建和使用 Ember 插件* 中详细介绍 Ember 插件。\n\n\
    要安装该插件组件，请运行以下命令：\n\n```\n$ ember install ember-cli-showdown\n```\n\n此时，如果您的服务器正在运行，您可能需要按\
    \ `Ctrl-C`，然后运行 `ember serve` 重新启动。运行此命令后，EmberNote 应用程序会更新，包含对 `ember-cli-showdown`\
    \ 插件的依赖，该插件包含了 `markdown-to-html` 组件。^([[7]](#f_0034.html_FOOTNOTE-7)) 该插件及其所有必需的依赖项都会被下载，并可供\
    \ Ember CLI 在构建和部署应用程序时使用。\n\n让我们看看如何使用这个插件。在我们的编辑笔记组件模板中，有以下一行代码：\n\n```\n{{markdown-to-html\
    \ markdown=note.body}}\n```\n\n就像使用 `{{input}}` 表达式创建文本字段，或使用 `{{edit-note}}`\
    \ 表达式创建编辑笔记组件一样，我们使用 `{{markdown-to-html}}` 来引用 `markdown-to-html` 组件。唯一的区别是，我们将一个组件嵌套在另一个组件内部。因此，我们能够使用的属性数据仅限于包含组件中已有的属性数据。\n\
    \n前面表达式中的 `markdown` 属性用于捕获组件将用来渲染 HTML 的属性。给定一个笔记，其正文是用 Markdown 编写的，组件会使用该正文，对其应用\
    \ Markdown 处理器，并渲染生成的 HTML。只要您记住在构建子组件时只使用包含作用域中的属性，嵌套组件就能很好地协同工作。\n\n现在您已经了解了如何通过嵌套组合组件，接下来让我们看看组件如何允许调用模板将内容注入到组件中。\n\
    \n### 使用 Yield 表达式\n\n在编辑笔记模板中，我们包含了一个 `{{yield}}` 表达式。该表达式允许调用模板将内容包含到组件中。让我们看一个简单的例子。\n\
    \n在 `ember-note/app/notebooks/notes/note/template.hbs` 的笔记模板中，进行以下更新：\n\n```\n\
    {{#edit-note note=model close=\"close\"}}\n  Notebook: {{model.notebook.title}}\n\
    {{/edit-note}}\n```\n\n我们将 `edit-note` 表达式从内联形式改为块形式，并包含了一个正文。该正文将在组件中 `{{yield}}`\
    \ 标签的位置渲染。然而，它是由笔记模板执行的。\n\n这一点很重要，因为它意味着您可以访问不同作用域（即调用模板的作用域）中的信息。在这个例子中，由于我们将整个笔记模型传递给了\
    \ `edit-note` 组件，它可以查看该模型中的每个字段。但是，如果我们只传递了笔记对象的正文，那么它就只能看到这些，而只有调用模板才能看到完整的模型对象。\n\
    \n在设计动作时，作用域的概念也很重要，因为它决定了动作需要在何处执行，我们稍后会看到。现在，让我们看看如何调整组件所包裹的根元素。\n\n### 更改组件的根元素\n\
    \n当您创建一个组件时，为该组件生成的 HTML 位于一个根元素内部。默认情况下，Ember 使用 `<div>` 标签作为根 HTML 元素。然而，在某些情况下，您可能希望将组件包裹在不同的根元素中。任何\
    \ HTML5 元素都是有效的选择。\n\n要将组件的根元素设置为 `<div>` 以外的元素，您需要在组件上设置 `tagName` 属性。您可以通过几种方式实现这一点。\n\
    \n首先，您可以在包含模板中初始化组件时设置该属性的值，如下所示：\n\n```\n{{edit-note note=model close=\"close\"\
    \ tagName=\"span\"}}\n```\n\n这会将组件的根元素更改为 `<span>`。您也可以在类本身中设置该属性的值，如下所示：\n\n\
    ```\nimport Ember from 'ember';\n\nexport default Ember.Component.extend({\n \
    \ tagName: \"span\"\n});\n```\n\n这与在调用模板中设置属性具有相同的效果。如果您同时使用两种机制但设置了不同的值，则以调用模板设置的值优先。\n\
    \n我们已经讨论了很多关于 Ember 组件的显示问题。组件还能够定义自包含的动作处理代码。接下来我们转向这个话题。\n\n## 处理动作\n\n与组件可以渲染自己的内容并从调用模板（或组件）接受内容类似，组件可以定义自己的动作，也可以将动作引用回调用上下文。\n\
    \n很容易理解为什么存在这个特性。在某些情况下，例如对组件 UI 的 UI 操作，您更希望不依赖调用上下文，甚至不允许调用上下文看到您在做什么。在其他情况下，例如导航，您希望调用上下文定义预期的行为。\n\
    \n还有一些用例介于两者之间，例如保存记录。如果您将整个记录传递给了组件，您可以在组件中保存它。否则，您可能需要在调用上下文中保存它。\n\n### 调用组件动作\n\
    \n当我们使用 Ember CLI 创建组件时，它会在项目中添加一个名为 `ember-note/app/components/edit-note/component.js`\
    \ 的文件。这是我们定义动作处理程序的地方。\n\n打开该文件，并添加以下代码：\n\n"
- fmt: "\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`。\n\
    \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
    \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\
    \n```js\n// ch4/ember-note/app/components/edit-note/component.js\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Component.extend({\n  actions: {\n   \
    \ saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\nAs you\
    \ can see, there’s not much difference between how we define actions in a component\
    \ and how we define actions in a route. The `actions` hash is used to map functions\
    \ to the names of those functions, just like with a route.\n\nThe action function\
    \ implementations can access any properties that have been passed to the component\
    \ or injected into the component at the class level. We haven’t covered injection\
    \ yet, and we don’t use it here. For now, all you need to know is that it’s possible\
    \ to access certain common objects in various parts of the framework by using\
    \ injection in some app-wide context.\n\nIn this case, the `saveNote` function\
    \ is simply responsible for saving the note record. It relies on the fact that\
    \ the note record comes with its own save logic, and calls that function.\n\n\
    In the template, the following line of code links the `saveNote` action to the\
    \ save button:\n\n```js\n// ch4/ember-note/app/components/edit-note/template.hbs\n\
    <button {{action \"saveNote\"}}>save</button>\n```\n\nLike with a garden-variety\
    \ template/route pairing, clicking this button executes the `saveNote` action.\n\
    \nComponent-scoped actions, such as `saveNote`, have a somewhat more limited use\
    \ case than referred actions. They can only operate on data that’s in the component’s\
    \ scope (that is, data that was passed in by the calling template), or on injected\
    \ objects. If you’re okay being bound by those restrictions, then it’s a good\
    \ idea to keep as much of the component’s logic self-contained as possible.\n\n\
    However, if you’d like to defer to the calling route/template to define the actual\
    \ behavior, you can do that using a sent action.\n\n### Sending Actions\n\nEmber\
    \ components also provide the ability to link the component’s template to an action\
    \ in the calling route, or further up the route hierarchy. A sent action is this\
    \ ability. We’ll define one in `edit-note`.\n\nAt first glance, the `closeNote`\
    \ action looks no different than the `saveNote` action. However, rather than executing\
    \ in the component context, it uses the `sendAction` method to request that the\
    \ containing route handle the action. Let’s follow this code through the various\
    \ classes and templates it affects.\n\nFirst, in the `edit-note` template, the\
    \ following code is used to map the action to the close button:\n\n```js\n// ch4/ember-note/app/components/edit-note/template.hbs\n\
    <button {{action \"closeNote\"}}>close</button>\n```\n\nThis results in the underlying\
    \ `closeNote` function being called in the component’s action map. That function\
    \ looks like this:\n\n```js\n// ch4/ember-note/app/components/edit-note/component.js\n\
    closeNote: function() {\n  this.sendAction('close');\n}\n```\n\nThis is where\
    \ it gets interesting—and powerful. The `sendAction` method takes a string parameter,\
    \ but that string isn’t the name of the function that will be called on the containing\
    \ route. It’s actually the value of the component’s property, which was set by\
    \ the containing template, and which points to the function on the containing\
    \ route. Here’s what the containing template looks like:\n\n```js\n// ch4/ember-note/app/notebooks/notes/note/template.hbs\n\
    {{edit-note note=model close=\"close\"}}\n```\n\nOn the left side of the `close=\"\
    close\"` assignment, we define the name of the component parameter we’ll use to\
    \ hold the action. This matches the string passed to `sendAction` in the `closeNote`\
    \ action. On the right side of the assignment, we use the name of the action in\
    \ the route. The underlying route should look like this:\n\n```js\n// ch4/ember-note/app/notebooks/notes/note/route.js\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params)\
    \ {\n    return this.store.findRecord('note', params.note_id);\n  },\n\n  actions:\
    \ {\n    close: function() {\n      this.transitionTo('notebooks.notes');\n  \
    \  }\n  }\n});\n```\n\nYou see the `close` action defined here. In this case,\
    \ it defines a simple route transition, with the effect of moving one step upward\
    \ in the route hierarchy, and closing out the `edit-note` screen in the process.\n\
    \nAs mentioned earlier, this is a very powerful construct. In essence, `sendAction`\
    \ allows you to define a component with placeholder actions, the exact result\
    \ of which can be determined by the containing route. This adds greatly to the\
    \ reuse of components, because it allows them to be used in different contexts\
    \ but still describe part of the behavior, while allowing the calling context\
    \ to fill in the details.\n\nThe `sendAction` method has one other wrinkle. If\
    \ you call `sendAction` without passing a string parameter indicating the name\
    \ of the property, the method assumes you’re looking for an action defined with\
    \ the property name `action`, and acts accordingly. This might be useful in cases\
    \ when a component is likely to have just one associated action, but I prefer\
    \ the named property form of the method, as I think it adds clarity.\n\nAs we’ve\
    \ seen, components are able to respond to actions either by defining the behavior\
    \ explicitly within the component or by referring the action to the component’s\
    \ calling context. You’ll use both of these, depending on your needs. Before we\
    \ wrap up our discussion on components, let’s take a look at one more way for\
    \ a component to respond to user events.\n\n### Listening for Events\n\nUsing\
    \ an action to respond to events is a simple way to link logic to a component.\
    \ It’s also possible to execute code in an event-driven manner.\n\nIn Ember every\
    \ component is based on the `Ember.View` class, even the ones like `{{input}}`\
    \ that ship with the framework. We haven’t touched on views because they aren’t\
    \ a concept you need to know to build apps with Ember. They’re important mainly\
    \ if you’re developing the Ember framework.\n\nIn this case, though, knowing about\
    \ views is helpful. Because each component is based on a view, you can respond\
    \ to any event that a view can respond to. For instance, if you’re designing a\
    \ stateful `<div>` tag, you might want to handle the `click` event, and change\
    \ the state of your `<div>` when the click occurs, like this:\n\n```js\nimport\
    \ Ember from 'ember';\n\nexport default Ember.Component.extend({\n  click: function(event)\
    \ {\n    //Change the state here\n  }\n});\n```\n\nThis offers you another means\
    \ of responding to user input in your component. By relying on the view, you gain\
    \ access to a variety of events, which are too numerous to list here.^([[8]](#f_0034.html_FOOTNOTE-8))\n\
    \n### Ember Addon: Ember CLI Materialize\n\nComponents are all about taking a\
    \ commonly used snippet of HTML from your app, extracting it into a separate object,\
    \ and reusing that object throughout. When you add a CSS stylesheet to that model,\
    \ you can create a coherent set of user interface elements that follow a standardized\
    \ design.\n"
