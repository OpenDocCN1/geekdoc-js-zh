  raw: 'First, we’ve added an input field, so the {{action}} will have something to
    work with. In the route, the action handler takes that value and checks against
    the server to see if the user is valid. The {{action}} expression is bound to
    the next control we added: an HTML button that displays the text “Login.” Used
    in this manner, the {{action}} expression binds the login action from the route
    to the onclick event of the button. The onclick event is the default for the button,
    which is why the {{action}} expression is bound to this event. When the button
    is clicked, the login action will fire.


    We’ve already seen a lot on actions in the previous chapter, so this might be
    a review for you. Let’s now take a look at compiling templates.


    ## Compile Templates


    When you create a template in your template.hbs file, the HTML and expression
    language you add isn’t directly built into a string. Beginning with the 1.10 release
    of Ember, a new template compiler, known as HTMLBars, is used to render your templates.
    With this compiler, a virtual DOM is created in your application’s generated ember-note.js
    file. So long as you’re using Ember CLI to build your application, these details
    are abstracted away from you.


    This form of compilation is important for two reasons. First, a virtual DOM is
    faster to generate and update than a string-based template, because a virtual
    DOM can be dealt with at the level of an individual node (for example, a control
    on a page), versus the entire template being regenerated when a control value
    changes.


    Second, it is this form of compilation that enables Ember to use server-side rendering.
    Using server-side rendering allows the user to experience a faster initial boot
    in the application, rather than seeing an empty UI load and waiting for a round-trip
    to the server to display the app’s initial data. Ember’s server-side rendering
    tool, known as FastBoot, is still under development, but promises to expand Ember’s
    capabilities greatly when released.


    Ember Addon: Ember CLI Datepicker


    As you’ve seen, Ember provides a number of basic features for rendering HTML fields
    using built-in template helpers. However, template helpers are a perfect use case
    for an Ember addon, and one such addon is Ember CLI Datepicker.


    Ember CLI Datepicker is an addon that can be used to add a Bootstrap-styled datepicker
    control to your web app with a minimum amount of logic. You add this control to
    your page by adding a single expression, such as the following:


    | ​  | {{bootstrap-datepicker placeholder="Choose a date"}} |


    This will insert a text field into your app that, when clicked, pops up a date
    picker. Choosing a date will add your choice to the text field, allowing your
    user to quickly enter dates.


    Ember CLI Datepicker is just one of several similar addons that you can use to
    quickly add controls into your app. The site [http://emberobserver.com](http://emberobserver.com)
    is a great starting point to find similar addons beyond this single example. We’ll
    continue to see specific addons throughout the book, and discuss how to create
    your own in Chapter 9, [​*Building and Using Ember Addons*​](#f_0060.html_addons).


    The full documentation for Ember CLI Datepicker is available at [https://github.com/soulim/ember-cli-bootstrap-datepicker](https://github.com/soulim/ember-cli-bootstrap-datepicker),
    along with a link to a demo of how to use the addon.


    ## Next Steps


    You should now have a good handle on the process of building a user interface
    with Ember and the Handlebars expression language. We saw how templates relate
    to one another, and we talked quite a bit about the close relationship between
    templates and routes and using that relationship to render controls. In the next
    chapter, we’ll look at how to take these concepts and create our own reusable
    controls, known in Ember parlance as components.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 4


    Building In Reuse with Components


    The combination of routes and templates is a potent one, and it’s responsible
    for much of the efficiency Ember adds to your development work. But there’s an
    even more powerful feature that we haven’t covered yet: components. In Ember,
    a component is a way of extending HTML by creating reusable elements. Similar
    to the pairing of a route and template, it implements both the user interface
    and action layer. But components are distinct from routes and templates in that
    the interface and action layer aren’t separable, and a component’s scope is isolated
    to the information passed into the component.


    A common use case for components is when you have a segment of your user interface
    that you want to reuse in multiple places throughout your app. Some examples might
    be a button, or a menu, or the example we’re going to use, a text area with specific
    logic associated to it.


    You may have realized that so far, EmberNote is a bit light on actual notes. We’re
    going to change that now by adding the ability to create notes with real content.
    To do so, we’ll create a new route that relies on a component to drive the editing
    of the note. This component will implement what you’d expect to see from an edit
    feature. You’ll be able to edit the title and the body of a note and save that
    note, or close the component and discard your changes.


    For added fun, we’ll include the ability to use Markdown within the body of your
    note. Markdown is a lightweight language used to apply basic HTML formatting to
    plain text. As such, we’ll also need the ability to preview the HTML that results
    from the Markdown process, which we’ll do using an Ember addon that we’ll retrieve
    via Ember CLI.


    Let’s see how to make use of components by creating this new edit feature for
    EmberNote.


    ## Create Components


    Because a component makes use of a template to define its UI but is itself added
    to a containing template, the relationship between components and templates can
    be a bit tricky. It helps me to think of the {{input}} control as an example.
    It’s a stand-alone control that can be used in a generic Ember template. The components
    you’ll define work the same way.


    Before we can create our component, we need a place for it to live. We’ll create
    a new route and reference our new component from that route’s template. Because
    we’re editing a single note at a time, the most sensible place for this route
    to live is as a child of the notebooks/notes route.


    From a command prompt, run the following Ember CLI command:


    | ​  | $ ember generate route notebooks/notes/note --pod |


    This creates an empty stub for the new note route. We’ll populate this new class
    in a moment. First, we need to modify the Router implementation and the notes
    template to be able to navigate to our new route.


    When you created the new route, Ember CLI modified the Router class to include
    this route at the appropriate place in the hierarchy. Because we’re going to query
    Ember Data for a note record, we’ll need to add a parameter to the route to pass
    the ID of this note to the child route. Open router.js and update it to look like
    this:


    | [ch4/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/router.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ Router = Ember.Router.extend({ |


    | ​  | location: config.locationType |


    | ​  | }); |


    | ​  |  |


    | ​  | Router.map(​**function**​() { |


    | ​  | this.route(​*''register''*​); |


    | ​  | this.route(​*''login''*​); |


    | ​  | this.route(​*''notebooks''*​, { path:​*''notebooks/:user_id''*​}, ​**function**​()
    { |


    | ​  | this.route(​*''notes''*​, { path:​*''notes/:notebook_id''*​}, ​**function**​(){
    |


    | ​  | this.route(​*''note''*​, { path:​*''note/:note_id''*​},​**function**​(){});
    |


    | ​  | }); |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Router; |'
