  md: '# # Chapter 6


    # ## The Document Object Model


    # ### What is the DOM?


    The Document Object Model (DOM) is an API for manipulating HTML and XML documents.
    It''s a tree hierarchy of objects representing a document, and facilitates scripting
    by exposing methods and properties. Though the DOM is quite powerful today, and
    large parts of its specification are well-supported across all major browsers,
    this wasn''t always the case.


    At first there was little uniformity, let alone a specification. Back in the bad
    old days of the Browser Wars,¹ when Netscape and Microsoft were vying for supremacy
    over the Web, one-upmanship was the name of the game. This lead to conflicting
    implementations, with each manufacturer introducing non-standard features into
    its own product. As developers began using these features, competing vendors were
    forced to mimic the behavior so that web pages wouldn''t break in their own browsers.
    Features were forced into existence simply by whoever held significant market
    share with their browser. As you can imagine, it was a headache at best for web
    developers trying to make their code work in the major browsers of the day.


    ¹ http://en.wikipedia.org/wiki/Browser_wars'
  merge: -1
  pgno: 116
