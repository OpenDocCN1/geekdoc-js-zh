- md: "114 Jump Start JavaScript\n\nthe DOM's API. As its name plainly states, you\
    \ can now query the DOM for elements by their `class` values. You can use it directly\
    \ from the `document` object `document.getElementsByClassName(\"report\")`, which\
    \ will return all elements in the document with the class name `report`. Or, you\
    \ can narrow down your search by using the method from an element: `document.getElementById(\"\
    financials\").getElementsByClassName(\"report\")`.\n\n## Data Attributes\n\nAlthough\
    \ it was always possible to assign your own attributes to elements in the DOM,\
    \ HTML5 codified the practice by introducing `data-*` attributes. If your application\
    \ requires you to store data specific to an element, you can do it using a `data-*`\
    \ attribute so that the data is stored directly with the element. This is advantageous\
    \ over storing the data in an array/object because it's unnecessary to synchronize\
    \ the DOM elements to the array/object in order to retrieve the data. Instead,\
    \ you just retrieve the element from the DOM and read the `data-*` attribute's\
    \ value directly from it.\n\nA simple scenario where this could be useful is when\
    \ displaying dates:\n\n```\n<span data-iso=\"1976-05-17T17:11:22\">\nDOB: May\
    \ 17, 1976, 5:11 PM</span>\n```\n\nWith an arrangement such as this, you can easily\
    \ read the ISO format of a given date/time in the DOM without having to do any\
    \ lookups in an array or any conversion of the human-readable format. Most modern\
    \ browsers support the `dataset` accessor, which allows you to both set and get\
    \ values from `data-*` attributes. For example, here's how we'd both set and read\
    \ the value for our `<span>`:\n\n```\nvar el = document.createElement(\"span\"\
    );\n\nel.appendChild(document.createTextNode\n(\"DOB: May 17, 1976, 5:11 PM\"\
    ));\n// setting the value\nel.dataset.iso = \"1976-05-17T17:11:22\";\n// reading\
    \ the value\nel.dataset.iso; //returns \"1976-05-17T17:11:22\"\n```\n\nIn this\
    \ example, we create an element and assign a `data-iso` attribute to it. We also\
    \ add its text content to be the human-readable format of the given date. This,\
    \ of course, could just as easily have been rendered by the back end. In either\
    \ case, reading the data-iso attribute is as simple as checking .dataset.iso.\n\
    \n## The style Attribute\n\nBack in DOM2, the W3C introduced the important and\
    \ powerful style attribute (though plans for it were already being laid during\
    \ work on DOM1). The style attribute allows for the programmatic manipulation\
    \ of element styles. If you know CSS, using it is simple. Its format is simply\
    \ element.style.property = value where property is a camel-case CSS property,\
    \ and the value is the CSS value you'd assign in a regular stylesheet.\n\nFor\
    \ example, given the HTML <div id=\"hey\">Hello, world!</div>, the <div> style\
    \ can be manipulated using the following JavaScript:\n\n```\nvar myDiv = document.getElementById(\"\
    hey\");\n\nmyDiv.style.backgroundColor = \"blue\";\nmyDiv.style.border = \"solid\
    \ 5px #000\";\nmyDiv.style.color = \"#ffffff\";\nmyDiv.style.padding = \"20px\
    \ 10px\";\nmyDiv.style.margin = \"2em\";\nmyDiv.style.width = \"200px\";\n```\n\
    \nThe code will yield the style shown in Figure 6.3.\n\n![Figure 6.3. The style\
    \ attribute](img/ae490e66f6d11d20689f8bf3d738bef9_130_0.png)\n\n## Project\n\n\
    In previous chapters, we looked at creating task objects and storing them in arrays\
    \ and so on, but that's all very abstract. In order for users to be able to see\
    \ their to-do list, we need to render the contents of our array to the screen.\
    \ We've just looked at how to create DOM elements and add them to the document,\
    \ so let's go ahead and write some code to do that:\n\n```\nvar taskListForm,\
    \ taskListEl;\n\ntaskListForm = document.getElementById(\"tasks\");\ntaskListEl\
    \ = taskListForm.getElementsByTagName(\"ul\")[0];\n```\n\nFirst, we're obtaining\
    \ references to both our <form> element as well as our <ul> element, which will\
    \ contain our list of tasks. Now, let's write a function that will clear out our\
    \ task list before we try and add anything to it. That way, we'll always have\
    \ a clean slate with which to work:\n\n```\nfunction clearList() {\n    while\
    \ (taskListEl.hasChildNodes()) {\n        taskListEl.removeChild(taskListEl.lastChild);\n\
    \    }\n}\n```\n\nWe use a while loop to keep removing child nodes from our taskListEl\
    \ until it's empty (and hasChildNodes returns false). Now we need a way to generate\
    \ our task element. The HTML for it is this:\n\n```\n<li class=\"template-item\"\
    >\n    <input type=\"checkbox\" >\n    <span class=\"task-text label\"></span>\n\
    \    <input type=\"button\" class=\"btn btn-mini delete-task\"\n    value=\"Delete\"\
    \ >\n    <div class=\"btn-group\">\n        <button class=\"btn btn-mini dropdown-toggle\"\
    \n        data-toggle=\"dropdown\">\n            Priority <span class=\"caret\"\
    ></span>\n        </button>\n        <ul class=\"dropdown-menu\">\n          \
    \  <li>\n                <a href=\"#\" class=\"highpriority\" value=\"1\">High</a>\n\
    \            </li>\n            <li>\n                <a href=\"#\" class=\"normalpriority\"\
    \ value=\"2\"\n                >Normal</a>\n            </li>\n            <li>\n\
    \                <a href=\"#\" class=\"lowpriority\" value=\"3\">Low</a>\n   \
    \         </li>\n        </ul>\n    </div>\n</li>\n```\n\nAs you can see, it's\
    \ not just a matter of creating a simple <li> element. Instead of manually creating\
    \ every element, attribute, and text node required for just one task item, why\
    \ not use the DOM to our advantage and merely clone a node whenever we need it?\n\
    \nYou'll note that I've gone ahead and given the <li> a class name of \"template-item\"\
    . I'll use this to obtain the element and then clone it using the DOM's cloneNode\
    \ method. I'll then fill in values specific to our task and have the function\
    \ return the complete set of task elements so that it can be inserted into the\
    \ DOM:\n\n```\nfunction newRow(index, task) {\n    var template, newRow, textEl;\n\
    \n    template = document.getElementsByClassName\n    (\"template-item\")[0];\n\
    \    newRow = template.cloneNode(true);\n    newRow.setAttribute(\"data-idx\"\
    , index.toString());\n\n    // get task text el\n    textEl = newRow.getElementsByClassName(\"\
    task-text\")[0];\n\n    // set task priority\n    if (task.priority == HIGHPRIORITY)\
    \ {\n        textEl.className += \" label-important\";\n    } else if (task.priority\
    \ == LOWPRIORITY) {\n        textEl.className += \" label-success\";\n    }\n\n\
    \    // set task text\n    textEl.appendChild(document.createTextNode(task.text));\n\
    \n    // mark complete\n    if (task.complete) {\n        newRow.getElementsByTagName(\"\
    input\")[0].setAttribute\n    (\"checked\", \"checked\");\n        newRow.getElementsByTagName(\"\
    span\")[0].className\n        += \"complete\";\n    }\n\n    newRow.className\
    \ = \"task\";\n\n    return newRow;\n}\n```\n\nOnce we have our template, the\
    \ first task is to clone it with `cloneNode`. Note how I'm passing a value of\
    \ `true` to `cloneNode`. This tells it that I want a deep clone rather than a\
    \ shallow one. In other words, I want it to give me a copy of all the child nodes\
    \ as well. Note also that the cloned node is only in memory and not part of the\
    \ DOM. It will have to be inserted into the DOM once we're done working with it.\n\
    \nThe next task is to add a `data-*` attribute so as to be able to match the task\
    \ in the DOM with the one in our array. I do this by assigning a `data-idx` attribute\
    \ and assigning it the index of the task in the array. I then get the element\
    \ surrounding our task text and assign it a class name based on the task's priority,\
    \ as well as create and append a text node containing the task's actual text (such\
    \ as \"walk the dog\").\n\nFinally, if the task is complete, I check the checkbox\
    \ and add a \"complete\" class name. I overwrite the \"template-item\" class name\
    \ with \"task\", and then return the DOM element (with child elements) to whomever\
    \ called our function. Now all we have to do is call `clearList` and `newRow`:\n\
    \n```\nvar renderTaskList = function () {\n    var i, task, taskEl;\n\n    clearList();\n\
    \n    for (i = 0; i < tasks.length; i += 1) {\n        task = tasks[i];\n    \
    \    taskEl = newRow(i, task);\n        taskListEl.appendChild(taskEl);\n    }\n\
    };\n```\n\nHere, we've created a `renderTaskList` function that, in order, clears\
    \ the old list from the DOM by calling `clearList`, loops over our `tasks` array,\
    \ calls `newRow`, takes its return value, and appends it to the DOM."
  mdcn: "\n114 快速入门 JavaScript\n\nDOM的API。顾名思义，你现在可以根据元素的`class`值来查询DOM中的元素。你可以直接从`document`对象调用，例如`document.getElementsByClassName(\"\
    report\")`，它将返回文档中所有类名为`report`的元素。或者，你可以使用某个元素上的该方法来缩小搜索范围：`document.getElementById(\"\
    financials\").getElementsByClassName(\"report\")`。\n\n## 数据属性\n\n尽管始终可以为DOM元素分配自定义属性，但HTML5通过引入`data-*`属性将这种做法规范化了。如果你的应用程序需要存储与特定元素相关的数据，可以使用`data-*`属性来实现，这样数据就直接存储在元素上。相比于将数据存储在数组/对象中，这种方式更有优势，因为你无需为了获取数据而同步DOM元素与数组/对象。相反，你只需从DOM中获取元素，并直接读取其`data-*`属性的值即可。\n\
    \n一个简单且有用的场景是显示日期：\n\n```\n<span data-iso=\"1976-05-17T17:11:22\">\n出生日期：1976年5月17日，下午5:11</span>\n\
    ```\n\n采用这样的安排，你可以轻松地从DOM中读取给定日期/时间的ISO格式，而无需在数组中查找或进行人类可读格式的转换。大多数现代浏览器都支持`dataset`访问器，它允许你设置和获取`data-*`属性的值。例如，以下是我们如何设置和读取`<span>`值的代码：\n\
    \n```\nvar el = document.createElement(\"span\");\n\nel.appendChild(document.createTextNode\n\
    (\"DOB: May 17, 1976, 5:11 PM\"));\n// 设置值\nel.dataset.iso = \"1976-05-17T17:11:22\"\
    ;\n// 读取值\nel.dataset.iso; // 返回 \"1976-05-17T17:11:22\"\n```\n\n在这个例子中，我们创建了一个元素并为其分配了一个`data-iso`属性。我们还添加了其文本内容，显示为给定日期的人类可读格式。当然，这同样可以由后端来渲染。无论哪种情况，读取data-iso属性就像检查.dataset.iso一样简单。\n\
    \n## style 属性\n\n在DOM2时代，W3C引入了重要且强大的style属性（尽管其规划在DOM1工作期间就已开始）。style属性允许以编程方式操作元素样式。如果你了解CSS，使用它就很简单。其格式就是`element.style.property\
    \ = value`，其中`property`是驼峰式的CSS属性名，`value`是你在普通样式表中会赋给该属性的CSS值。\n\n例如，给定HTML `<div\
    \ id=\"hey\">Hello, world!</div>`，可以使用以下JavaScript来操作`<div>`的样式：\n\n```\nvar myDiv\
    \ = document.getElementById(\"hey\");\n\nmyDiv.style.backgroundColor = \"blue\"\
    ;\nmyDiv.style.border = \"solid 5px #000\";\nmyDiv.style.color = \"#ffffff\";\n\
    myDiv.style.padding = \"20px 10px\";\nmyDiv.style.margin = \"2em\";\nmyDiv.style.width\
    \ = \"200px\";\n```\n\n这段代码将产生如图6.3所示的样式。\n\n![图6.3. style属性](img/ae490e66f6d11d20689f8bf3d738bef9_130_0.png)\n\
    \n## 项目\n\n在前面的章节中，我们了解了如何创建任务对象并将它们存储在数组中等等，但那都是非常抽象的。为了让用户能够看到他们的待办事项列表，我们需要将数组的内容渲染到屏幕上。我们刚刚学习了如何创建DOM元素并将其添加到文档中，那么我们现在就来编写一些代码来实现这一点：\n\
    \n```\nvar taskListForm, taskListEl;\n\ntaskListForm = document.getElementById(\"\
    tasks\");\ntaskListEl = taskListForm.getElementsByTagName(\"ul\")[0];\n```\n\n\
    首先，我们获取对`<form>`元素和`<ul>`元素的引用，后者将包含我们的任务列表。现在，让我们编写一个函数，在尝试添加任何内容之前，先清空任务列表。这样，我们始终有一个干净的工作起点：\n\
    \n```\nfunction clearList() {\n    while (taskListEl.hasChildNodes()) {\n    \
    \    taskListEl.removeChild(taskListEl.lastChild);\n    }\n}\n```\n\n我们使用一个while循环，持续从taskListEl中移除子节点，直到它为空（并且hasChildNodes返回false）。现在我们需要一种方法来生成我们的任务元素。其HTML结构如下：\n\
    \n```\n<li class=\"template-item\">\n    <input type=\"checkbox\" >\n    <span\
    \ class=\"task-text label\"></span>\n    <input type=\"button\" class=\"btn btn-mini\
    \ delete-task\"\n    value=\"Delete\" >\n    <div class=\"btn-group\">\n     \
    \   <button class=\"btn btn-mini dropdown-toggle\"\n        data-toggle=\"dropdown\"\
    >\n            Priority <span class=\"caret\"></span>\n        </button>\n   \
    \     <ul class=\"dropdown-menu\">\n            <li>\n                <a href=\"\
    #\" class=\"highpriority\" value=\"1\">High</a>\n            </li>\n         \
    \   <li>\n                <a href=\"#\" class=\"normalpriority\" value=\"2\"\n\
    \                >Normal</a>\n            </li>\n            <li>\n          \
    \      <a href=\"#\" class=\"lowpriority\" value=\"3\">Low</a>\n            </li>\n\
    \        </ul>\n    </div>\n</li>\n```\n\n如你所见，这不仅仅是创建一个简单的`<li>`元素。与其手动创建一个任务项所需的所有元素、属性和文本节点，何不利用DOM的优势，只需在需要时克隆一个节点呢？\n\
    \n你会注意到我已经为`<li>`指定了一个类名\"template-item\"。我将使用它来获取该元素，然后使用DOM的cloneNode方法克隆它。接着，我会填入任务特有的值，并让函数返回完整的任务元素集合，以便将其插入DOM：\n\
    \n```\nfunction newRow(index, task) {\n    var template, newRow, textEl;\n\n \
    \   template = document.getElementsByClassName\n    (\"template-item\")[0];\n\
    \    newRow = template.cloneNode(true);\n    newRow.setAttribute(\"data-idx\"\
    , index.toString());\n\n    // 获取任务文本元素\n    textEl = newRow.getElementsByClassName(\"\
    task-text\")[0];\n\n    // 设置任务优先级\n    if (task.priority == HIGHPRIORITY) {\n\
    \        textEl.className += \" label-important\";\n    } else if (task.priority\
    \ == LOWPRIORITY) {\n        textEl.className += \" label-success\";\n    }\n\n\
    \    // 设置任务文本\n    textEl.appendChild(document.createTextNode(task.text));\n\n\
    \    // 标记完成状态\n    if (task.complete) {\n        newRow.getElementsByTagName(\"\
    input\")[0].setAttribute\n    (\"checked\", \"checked\");\n        newRow.getElementsByTagName(\"\
    span\")[0].className\n        += \"complete\";\n    }\n\n    newRow.className\
    \ = \"task\";\n\n    return newRow;\n}\n```\n\n一旦我们有了模板，第一步就是用`cloneNode`克隆它。注意我向`cloneNode`传递了一个`true`值。这告诉它我想要一个深克隆，而不是浅克隆。换句话说，我希望它同时复制所有子节点。还要注意，克隆的节点仅存在于内存中，并非DOM的一部分。一旦我们处理完毕，就需要将其插入DOM。\n\
    \n接下来的任务是添加一个`data-*`属性，以便将DOM中的任务与我们数组中的任务匹配起来。我通过分配一个`data-idx`属性并将其值设为任务在数组中的索引来实现这一点。然后，我获取包含任务文本的元素，并根据任务的优先级为其分配一个类名，同时创建并附加一个包含任务实际文本（例如“遛狗”）的文本节点。\n\
    \n最后，如果任务已完成，我会选中复选框并添加一个\"complete\"类名。我用\"task\"类名覆盖了\"template-item\"类名，然后将DOM元素（及其子元素）返回给调用我们函数的代码。现在，我们只需调用`clearList`和`newRow`即可：\n\
    \n```\nvar renderTaskList = function () {\n    var i, task, taskEl;\n\n    clearList();\n\
    \n    for (i = 0; i < tasks.length; i += 1) {\n        task = tasks[i];\n    \
    \    taskEl = newRow(i, task);\n        taskListEl.appendChild(taskEl);\n    }\n\
    };\n```\n\n这里，我们创建了一个`renderTaskList`函数，它依次执行以下操作：通过调用`clearList`从DOM中清除旧列表，遍历我们的`tasks`数组，调用`newRow`，获取其返回值，并将其附加到DOM中。\n"
