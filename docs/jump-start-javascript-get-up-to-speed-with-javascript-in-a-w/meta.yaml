  md: '# Comparison Operators


    Comparison operators compare two values and return either `true` or `false` based
    on how they compare. So, if we want to know whether 10 is greater than 5, we’d
    write `10 > 5` and that comparison would return `true`. However, `10 > 11` would
    return `false`.


    # Equal (==)


    Returns `true` if both values are equal. If the values being compared are not
    of the same type, JavaScript first converts them and then applies a strict comparison.
    So, if the values are a number and a Boolean, they’ll be converted to numbers
    before the comparison. If a string is involved, both values are converted to strings
    before comparing. If they’re objects, they’re equal if both values are referring
    to the same location in memory:


    ```

    1 == 1      // returns true

    "1" == 1    // returns true ("1" converts to 1)

    1 == true   // returns true

    0 == false  // returns true

    "" == 0     // returns true ("" converts to 0)

    " " == 0    // returns true (" " converts to 0)


    0 == 1      // returns false

    1 == false  // returns false

    0 == true   // returns false


    var x, y;   // declare x and y

    x = {};     // create an object and assign it to x

    y = x;      // point y to x

    x == y;     // returns true (refers to same object in memory)

    x == {};    // returns false (not the same object)

    ```


    # Not Equal (!=)


    This is the same as equal, but it works in reverse: `true` is returned if the
    values are not equal. The same conversions described above apply here as well:


    ```

    1 != 1      // returns false

    "1" != 1    // returns false ("1" converts to 1)

    1 != true   // returns false

    ```'
