  md: "# return\n\nreturn is the most commonly used jumping statement. It takes the\
    \ following general form:\n\n```\nreturn expression;\n```\n\nor less commonly:\n\
    \n```\nreturn;\n```\n\nIt can only be used within a function, and is used to delineate\
    \ the return value of a function. If the expression is omitted, the return value\
    \ is undefined. For a simple example:\n\n```\nfunction divideBy(numerator, denominator)\
    \ {\n    return numerator / denominator;\n}\n```\n\nThe more observant among you\
    \ will note that, depending on how this function is used, we have a potential\
    \ “divide by zero” problem. Syntactically, it’s possible to have any number of\
    \ return statements in a given function. As a matter of good practice, we recommend\
    \ erring toward a single return statement per function. This so-called single\
    \ point of exit makes the code more understandable and easier to debug. In a debugger,\
    \ it’s only necessary to monitor one statement instead of two or more.\n\n> On\
    \ Division by Zero\nJavaScript is unusual among programming languages in that\
    \ dividing by zero doesn’t naturally cause an exception in the language. A positive\
    \ number divided by zero yields infinity. A negative number divided by zero yields\
    \ - infinity. Zero divided by zero yields NaN. In all cases, normal execution\
    \ of the program can continue. However, we still need to deal with the \"division\
    \ by zero\" issue.\n\nFor example, suppose you wish to calculate a user’s body\
    \ mass index (BMI). This is given by the formula: weight / (height x height).\
    \ If the height comes into the function with a value of zero, there is a good\
    \ argument for raising an exception."
  merge: -1
  pgno: 104
- img_proc: true
  md: "Users may not take to it kindly if you tell them they have a BMI of infinity!\
    \ Such a number may also cause problems with downstream applications, such as\
    \ charts.\n\nThere are cases when multiple return statements will make the code\
    \ easier to read. Suppose we wish to merge two task lists. Using a single exit\
    \ point, we could write the code this way:\n\n```\nfunction mergeTasks(taskList1,\
    \ taskList2) {\n  var merged;\n\n  if (taskList1 === undefined)\n    merged =\
    \ taskList2;\n  else if (taskList2 === undefined)\n    merged = taskList1;\n \
    \ else {\n    // merge code\n    merged = ...;\n  }\n\n  return merged;\n}\n```\n\
    \nWith multiple exit points, the code can be written in a slightly cleaner manner:\n\
    \n```\nfunction mergeTasks(taskList1, taskList2) {\n  if (taskList1 === undefined)\
    \ {\n    return taskList2;\n  } else if (taskList2 === undefined) {\n    return\
    \ taskList1;\n  }\n\n  // merge code\n  var merged = ...;\n  return merged\n}\n\
    ```\n\nNote how in the second example we have 'guard' statements to check for\
    \ exception conditions, followed by a single exit at the end. As a practical guideline,\
    \ it is fine to follow this pattern of guard statements at the top followed by\
    \ a single exit. It's when we have return statements cropping up in the middle\
    \ of long functions that code potentially becomes more difficult to understand\
    \ and maintain."
