    \ all familiar with modern programming languages, you've heard of namespacing.\
    \ Essentially, it's a better way to organize code by putting it into nested buckets,\
    \ or namespaces:\n\n```\nProject.Strings.Warnings.sessionExpired =\n    \"Your\
    \ session has expired.\"\n```\n\nOf course, in order for this namespace to exist,\
