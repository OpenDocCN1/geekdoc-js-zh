    > grep 'return' jquery-1.9.1.js | wc -l\n> 646\n```\n\nSo, to summarize, across\
    \ a code base spanning nearly 10,000 lines and some 600 functions and return statements,\
    \ break is used 16 times and continue is used 7 times. I'll let you draw your\
    \ own conclusions from the data.\n\n## Loop Alternatives\n\n## On Style\n\nSyntactically,\
    \ JavaScript takes its syntax from Java, which in turn takes its syntax from C.\
