    \ or `apply` methods to execute a function, we can pass in an object for the `this`\
    \ keyword to refer to. So, if you're still with me, let's go over each of those\
    \ one by one.\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_85_0.png)\n\n### Simple\
    \ Function\n\nWhen the `this` keyword is used inside a simple function, it refers\
    \ to the global variable scope, which is the `window` object. In this context,\
    \ there's no real need to use the `this` keyword as any variable in the global\
    \ scope is accessible simply by using its name. In other words, if you declare\
    \ a variable named `foo` globally, you can just refer to it as `foo`; no need\
    \ to use `this.foo`. JavaScript is simply referring you to the global scope because\
    \ there's nothing else for it to point the `this` keyword to in this instance.\
    \ If you're running in strict mode, however, it will return undefined. This is\
    \ to prevent unintentional errors that are bound to happen in this context.\n\n\
    > ### Strict Mode\n\n**Strict mode** is a recent addition to JavaScript. By opting\
    \ into strict mode via the addition of `\"use strict\";` at the top of a function,\
    \ you force the JavaScript engine to change its behavior and essentially fix some\
    \ potentially error-prone ways of handling code. In this case, it's what `this`\
    \ refers to in a simple function.\n\n### In a Constructor\n\nWhen used in a constructor\
    \ or function intended to be instantiated via the `new` keyword, `this` refers\
    \ to the object that's to be created. So if your constructor is a bank account:\n\
    \n```javascript\nvar Account, savings;\n\nAccount = function(num) {\n  this.accountNumber\
    \ = num;\n};\n\nsavings = new Account(12345678);\nsavings.accountNumber; // returns\
    \ 12345678\n```\n\nIn this case, the `this` keyword lets you attach the `accountNumber`\
    \ property to the object that's to be instantiated. It's therefore possible to\
    \ get that value by referring to `savings.accountNumber`.\n\n### Inside an Object\
    \ Literal\n\nIf your function happens to be inside an object literal, and it's\
    \ a simple function call as in our first example, the `this` keyword now refers\
    \ to the immediate parent object surrounding your function. For example, the code\
    \ in our diagram has two arrays inside the `Project` object called `Managers`\
    \ and `Developers`. The `howMany` function adds their lengths by referring to\
    \ `this.Managers` and `this.Developers` respectively. That means that the call\
    \ to the `this` keyword points us to the `Project` object from which we can drop\
    \ down to both `Managers` and `Developers`.\n\n### Inside an Event Handler\n\n\
    We've yet to cover event handlers, so bear with me. Basically, an **event handler**\
    \ is a function that is called when an event is triggered, such as a \"click\"\
    \ event when a link is clicked on. In an event handler, the `this` keyword refers\
    \ to the element that triggered the event, which, in this case, is the anchor\
    \ on the page.\n\n### call and apply\n\nIt's possible to invoke a function using\
    \ the `call` and `apply` methods that are provided. We'll cover these in more\
    \ detail shortly, but in both cases, the first argument of these methods is an\
    \ object you can pass in for the `this` keyword to refer to.\n\n### bind\n\nFinally,\
    \ ECMAScript 5 introduced a method called `bind` that creates a new function and\
    \ permanently binds it to the object you pass it. That object gets referred to\
    \ when calling `this`. We'll also address this in more detail soon.\n\n## Properties\n\
    \n### constructor\n\nIf you're handed an object that's an instance of a function,\
    \ you may want to know what that original function was. What's more, you may wish\
    \ to instantiate another object off that original function. With the `constructor`\
    \ property, you can. It returns a reference to the original function in question,\
    \ which allows you to create new instances with the original data:\n\n```javascript\n\
    var foo, bar, baz;\n\nfunction Foo() {\n    this.ident = \"foo\";\n}\n\nfoo =\
    \ new Foo();\nfoo.ident; // returns \"foo\"\n\nbar = new Foo();\nbar.ident; //\
    \ returns \"foo\"\nbar.ident = \"bar\";\nbar.ident; // now returns \"bar\"\n\n\
    baz = new bar.constructor();\nbaz.ident; // returns \"foo\"\n```\n\nFirst, we\
    \ instantiate foo, which has an ident property value of \"foo\". Next, we instantiate\
    \ bar, whose ident is also \"foo\" since it comes from the Foo class. However,\
    \ we change its ident value to \"bar\". We then instantiate baz by using bar's\
    \ constructor property. The property points us to the original Foo function, which\
    \ gives our baz instance the same original ident value of \"foo\".\n\n### length\n\
    \nIf you ever need to know how many arguments a function is expecting, you can\
    \ check with the length property:\n\n```javascript\nfunction foo(bar, baz) {\n\
    }\n\nfoo.length; // returns 2\n```\n\nWe get the value 2 returned when checking\
    \ the length of foo because it's expecting bar and baz as arguments."
