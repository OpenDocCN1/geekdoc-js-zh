  md: '# Setting up the Canvas


    With the computations complete, we need a few lines of code to prepare the canvas
    for drawing. Continuing on, we add the following code:


    ```

    var topMargin = 25;

    var bottomMargin = 1;

    var canvas = document.getElementById("canvas");


    canvas.width = canvas.width;

    ```


    We specify, in pixels, the margin of the chart from the top and bottom of the
    canvas. This margin is unrelated to any of the built-in variables. It is a variable
    that we’re declaring, and we will use it to do some computations and canvas scaling
    later. Then, we retrieve the actual `<canvas>` element using document.getElementById.
    The following line of code may initially appear puzzling:


    ```

    canvas.width = canvas.width;

    ```


    To make sense of it, we refer to the specification,⁶ which states: “When the canvas
    element is created, and subsequently whenever the width and height attributes
    are set (whether to a new value or to the previous value), the bitmap and any
    associated contexts must be cleared back to their initial state and re-initialized
    with the newly specified coordinate space dimensions.”


    In other words, whenever the height or width is changed, the canvas is reset.
    We take advantage of this idiomatic behavior, and reset the canvas before doing
    any drawing to make sure that any old data is erased.


    > ## The Official Specification


    Astute readers may notice that we have so far referred to two different *official*
    specifications. Historically, the Web Hypertext Application Technology Working
    Group (WHATWG) began working on a new HTML specification while the World Wide
    Web Consortium (W3C) was focusing on XHTML. Ultimately, XHTML was abandoned, and
    the two groups are now working together on HTML5. This has left us with two different,
    but largely compatible, specifications. From the view'
  merge: -1
  pgno: 161
- img_proc: true
  md: "> of an application developer, both can be treated as authoritative sources.\
    \ Minor differences are likely to only come to the fore if one wished to undertake\
    \ the task of writing an HTML5 parser or similar.\n\n# The Most Basic Drawing\n\
    \nBefore we do any drawing, we check to make sure that the browser supports the\
    \ canvas object. Continuing on from our previous examples:\n\n```\nif (canvas\
    \ && canvas.getContext) {\n}\n```\n\nThis contains a subtlety that is worth exploring.\
    \ Notice how we use canvas.getContext instead of canvas.getContext(). The difference\
    \ can be illustrated with this example:\n\n```\nfunction testFunction() {\n  \
    \  return 0\n}\n\nif (testFunction()) {\n    console.log('with parentheses');\n\
    }\n\nif (testFunction) {\n    console.log('no parentheses');\n}\n```\n\nOnly 'no\
    \ parentheses' will print. The first if statement will call the function and evaluate\
    \ its return value, but this is far from our aim. The second if statement will\
    \ simply test if the function exists; this is exactly what we want to do. We want\
    \ to make sure the canvas object has a getContext function; we want to avoid calling\
    \ that function and evaluating its output!\n\nLet's begin by establishing the\
    \ context. Place the following code within the if statement:\n\n```\nvar context\
    \ = canvas.getContext(\"2d\");\n```"
