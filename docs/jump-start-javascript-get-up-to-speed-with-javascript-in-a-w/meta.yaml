  md: "# Exception Handling\n\nJavaScript provides a mechanism to handle exceptional\
    \ circumstances by transferring control to special error-handling sections of\
    \ the code. To catch exceptions, we must place the potentially offending code\
    \ within a `try` block. When an error occurs, an exception is thrown and control\
    \ is transferred to code within the `catch` block. If no exception is thrown,\
    \ the exception handler is ignored and the code continues as normal. This will\
    \ be explained in more detail shortly.\n\n# throw\n\nThe keyword `throw` is used\
    \ to signal an error condition. It takes this form:\n\n```\nthrow expression;\n\
    ```\n\nWhile it is syntactically valid to throw an exception this way:\n\n```\n\
    throw \"This is an error in the form of a string\";\n```\n\nthe preferred format\
    \ is to explicitly use an `Error` object. Continuing with the example from the\
    \ prior section:\n\n```\nfunction divideBy(numerator, denominator) {\n    if (denominator\
    \ === 0) {\n        throw new Error('Denominator must be non zero');\n    }\n\n\
    \    return numerator / denominator;\n}\n```\n\nAn `Error` object provides more\
    \ information than a string. It is possible for upstream functions to specifically\
    \ test if an object is an error by using `instanceof Error`. As to the question\
    \ of what we do once we throw an error, we'll look to the next section.\n\n# try\n\
    \nThe previously mentioned `try` statement assumes the following form:"
  merge: -1
  pgno: 106
