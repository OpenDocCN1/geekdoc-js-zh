  md: "```\nlastName: \"Kirk\",\noccupation: \"Captain\"\n};\n\nfor (key in data)\
    \ {\n  alert(key + \" is \" + data[key]);\n}\n```\n\nIn this example, we use a\
    \ `for ... in` loop. We give it a variable (in this case, `key`) that will be\
    \ used to hold the key as it steps through the object, and an object to step over\
    \ (in this case, `data`). For each key/value pair inside `data`, the loop will\
    \ assign the key to our variable named `key`. Inside the body of the loop, we\
    \ can use the key to plug into our object to access its associated value: `data[key]`.\
    \ That's the equivalent of writing `data[\"firstName\"]`, and on a subsequent\
    \ pass, `data[\"lastName\"]`, and so on.\n\nThere is one catch, though. Since\
    \ objects inherit from objects, the loop may start returning key/value pairs from\
    \ further up the prototype chain. To prevent this, we need to add something to\
    \ our loop:\n\n```\nvar data, key;\n\ndata = {\n  firstName: \"James\",\n  lastName:\
    \ \"Kirk\",\n  occupation: \"Captain\"\n};\n\nfor (key in data) {\n  if (data.hasOwnProperty(key))\
    \ {\n    alert(key + \" is \" + data[key]);\n  }\n}\n```\n\nThe `hasOwnProperty`\
    \ method makes sure that the key we're using belongs to the object in question\
    \ and not from further up the prototype chain. If it returns `true`, we can proceed\
    \ with our operation. Otherwise, we ignore it."
