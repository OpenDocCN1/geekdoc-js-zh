  md: '# Chapter 5


    # Loops and Jumps


    This chapter introduces loop and jump statements. A **loop statement** is used
    when we want to repeat some programming statements until a specified condition
    is reached. A typical example would be to iterate through a list and perform an
    operation on each member of the list. A **jump statement** allows code to exit
    loops. One example is to loop through our to-do list and then break out of the
    loop upon reaching the first incomplete item. There are various types of jump
    statements, which we''ll explain as we go along.


    Loops are generally associated with a particular style of programming known as
    **imperative programming**. Here, the programmer specifies step by step how a
    program should achieve a particular task. An alternative approach is **functional
    programming**, which states what the program should be doing without exactly specifying
    how the program should do it. JavaScript supports multiple paradigms including
    imperative and functional styles. We will spend the latter part of this chapter
    looking at some functional alternatives to working with loops. Functional programming
    can provide more elegant solutions to certain types of problems, and it can make
    your code base smaller, more understandable, and easier to maintain.'
  merge: -1
  pgno: 94
