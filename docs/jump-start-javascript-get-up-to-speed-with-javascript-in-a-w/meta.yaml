  md: '# # Arcs


    We''ve mentioned how rectangles are the only natively supported shape, but this
    does not indicate that shapes such as circles are unavailable. It just means there
    is no `fillCircle` or similar function. Let''s explore how we might draw some
    non-rectangular shapes. Replace all of `canvas.js` with the following:


    ```

    var canvas = document.getElementById("canvas");

    var context = canvas.getContext("2d");


    context.beginPath();

    context.arc(50, 50, 50, 0, Math.PI, true);

    context.stroke();

    ```


    The only unfamiliar aspect of the above is the arc function. This takes five parameters,
    where the first two parameters represent the x and y coordinate of the circle''s
    center. The third parameter is the radius of the circle, while the fourth and
    fifth parameters represent the start and end of the arc in radians. In this case,
    we start at 0, which is the same as the x-axis. By choosing `Math.PI` as the end
    angle, we are drawing a semicircle (pi radians is 180 degrees). The final task
    is to determine whether the circle is drawn clockwise or counterclockwise. This
    is specified by the last parameter, which we have set to `true`, indicating counterclockwise.


    Many of the concepts you''ve learned from drawing rectangles can be applied to
    arcs. For instance, you can replace `stroke` with `fill`. So far, we''ve just
    been dealing with toy examples; you should look at some of the breathtaking examples
    of canvas in action⁹.


