    \n# 想要继续学习吗？\n\n感谢购买本书。我们感谢你的支持。想要继续学习吗？你现在可以以低价在Learnable上无限访问课程和所有SitePoint书籍。立即注册，开始今天的学习！加入Learnable，你将始终领先于最新的技术趋势：http://www.learnable.com。\n\
    \n一旦你掌握了JavaScript的原理，可以通过我们的在线测验挑战自己。你能获得满分吗？请前往 http://quizpoint.com/#categories/JAVASCRIPT。\n\
    \n# 第1章 环境搭建\n\n作为一名JavaScript开发者，你将编写在浏览器中运行的代码。随着本书的学习，你会想尝试示例。你*可以*创建一个HTML文档并在其中添加JavaScript代码，但距离我们处理完整项目还有一段时间，而在此期间你可能想测试一下。最好的方法是直接打开浏览器的控制台，在其中输入示例代码。所有主流浏览器厂商都提供了控制台，下面有关于如何在每个浏览器中激活它的说明。一旦你打开控制台，你会发现一个提示符，点击后就可以开始输入。在大多数控制台中，它看起来像一个尖括号：>。在Internet\
    \ Explorer中，提示符是两个尖括号：>>。\n\n> **换行技巧**\n\n当你在控制台中需要新行时，不要按**Enter**（这将执行代码），而是按**Shift\
