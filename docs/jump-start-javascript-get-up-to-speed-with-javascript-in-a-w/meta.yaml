    108 Jump Start JavaScript


    Though we can use `setAttribute` to set attributes on elements, we can also use
    `createAttribute` to create attribute nodes. Attributes also derive from the Node
    object, starting in the DOM1 spec:


    ```

    var myLink, href;


    myLink = document.createElement("a");

    href = document.createAttribute("href");

    href.nodeValue = "http://www.sitepoint.com/";

    myLink.setAttributeNode(href);

    ```


    We''ve created an anchor and an `href` attribute, to which we add a URL via its
    `nodeValue` property. Bear in mind that even though the `href` attribute object
    derives from Node, you''re unable to append objects to it. Trying to do so will
    result in a `HierarchyRequestError: DOM Exception 3` error.


    Now that we''ve created an anchor with an `href` attribute, we can add some text
    to make the link clickable. For this, we use `createTextNode` to add the text
    node to our link:


    ```

    var myLink, href, linkText;


    myLink = document.createElement("a");

    href = document.createAttribute("href");

    href.nodeValue = "http://www.sitepoint.com/";

    myLink.setAttributeNode(href);

    linkText = document.createTextNode("SitePoint");

    myLink.appendChild(linkText);

    ```


    Again, text nodes are like attribute nodes in that they''re unable to have children.


    > A Note on Nodes

    Although all objects derive from Node, some are leaf nodes and others aren''t.
    Text nodes are leaf nodes and can therefore not have children. As a result, methods
    such as `childNodes` are inapplicable and cannot be used.


