  md: "# DOM Level 1\n\nIn 1998, the W3C released the DOM Level 1 specification.<sup>4</sup>\
    \ The spec took the existing hierarchy of the DOM and normalized its contents\
    \ by introducing the `Node` object, from which most objects are derived. Of the\
    \ handful of object types that the specification introduced, the most common are\
    \ `Document`, `Element`, `Attr`, and `Text`, which account for the majority of\
    \ the contents of an HTML document.\n\nIn the following HTML, the `<div>` will\
    \ become an `Element` node, its `id` attribute will become an `Attr` node, and\
    \ the \"Hello!\" will become a `Text` node:\n\n```\n<html>\n    <head>\n    </head>\n\
    \    <body>\n        <div id=\"welcome\">Hello!</div>\n    </body>\n</html>\n\
    ```\n\nThe previously mentioned `Document` node is actually an abstract node that\
    \ wraps everything, and doesn't directly represent any tags in the HTML. The `<html>`\
    \ tag is a special `Element` node, known as the document element, and can be accessed\
    \ at `document.documentElement`.\n\nThere are also less common types of nodes\
    \ such as `ProcessingInstruction` and `EntityReference`, but we'll stick to the\
    \ most common ones for our purposes. A listing of the various node types is shown\
    \ in Figure 6.2."
