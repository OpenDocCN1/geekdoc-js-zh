    \nperson = function () {\n  return this.lastName;\n};\n\nhugo = person.bind({lastName:\
    \ \"Reyes\"});\nhugo(); // returns \"Reyes\"\n\nnames = {\n  lastName: \"Cooper\"\
    ,\n  hugo: hugo,\n  person: person\n};\nnames.hugo(); // returns \"Reyes\"\nnames.person();\
    \ // returns \"Cooper\"\n```\n\nYou'll note how the person function points to\
    \ this.lastName and that before we bind it, lastName refers to a variable in the\
    \ global window space (which is undefined)."
