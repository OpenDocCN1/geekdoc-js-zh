  md: 'To draw the rectangles, we begin by looping through each value in our data
    set. In this case, there are only two values: the number of items to do and the
    number of items completed. Then we use the built-in `createLinearGradient` function,
    which takes four parameters. The first two parameters represent the x and y coordinates
    of the starting point of the gradient, while the latter two represent the gradient’s
    endpoint. We’re using this function to provide our column graph with a bit of
    texture, instead of a plain single-color column.


    The `addColorStop` function helps define the colors and position of the gradient.
    The first parameter is a float between 0.0 and 1.0 representing the start and
    end point of a gradient. It is possible to add an arbitrary number of color stops.
    We''ve just added two stops, one at the beginning and one at the end. The second
    parameter represents the color. Here we transition from light to dark blue. Remember
    how previously we used `fillStyle` to define a color? Here we use it to define
    the gradient. Finally, we call `fillRect` as we''ve done before, as shown in Figure
    8.5.


