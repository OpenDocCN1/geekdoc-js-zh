  md: '# # Preface


    JavaScript is a very powerful, versatile and ubiquitous programming language.
    From humble beginnings¹ in the mid-90s as Netscape''s foil to Microsoft''s Visual
    Basic, it''s grown to be one of the world''s most popular² programming languages.


    JavaScript is unique among programming languages because it''s the only one deployed
    on practically all personal computers around the world. All modern web browsers
    implement JavaScript. It''s the de facto scripting language for the Web. While
    it started out as a simple language used for validating forms and minimally manipulating
    some content in the page, it''s evolved to let you build rich client-side applications.
    What''s more, over the years, JavaScript has even begun to supplant Flash to some
    degree. As the web continues to grow and evolve, the need for JavaScript developers
    is increasing. Whether you''re an experienced programmer looking to pick up JavaScript,
    or a novice wanting to fill some of that demand, this book will help you. After
    reading this book you should be able to write your own JavaScript applications
    and have enough of an understanding of the language to get you started down the
    road to becoming an expert JavaScript developer.


    # # Who Should Read This Book


    Web designers and developers wanting to get up to speed with JavaScript quickly.
    Knowledge of HTML and CSS is assumed.


    # # Conventions Used


    You''ll notice that we''ve used certain typographic and layout styles throughout
    this book to signify different types of information. Look out for the following
    items.


    # ## Code Samples


    Code in this book will be displayed using a fixed-width font, like so:'
