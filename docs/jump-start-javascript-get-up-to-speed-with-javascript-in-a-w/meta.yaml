    # Summary


    In this chapter, we covered objects, including how to write to and read from objects,
    and how to nest objects to create namespacing for variables. We also looked at
    looping over objects to read data, and how we can filter the prototype chain out
    when looping over object properties. We then went on to functions, exploring the
    different ways we can create functions, as well as how we can use functions to
    write object-oriented code. We examined various properties and methods of functions,
    and finished off by adding our knowledge to the task manager project we''re building.


    In the next chapter, we''ll take a look at looping and jumping.'
