    If you''re handed an object that''s an instance of a function, you may want to
    know what that original function was. What''s more, you may wish to instantiate
    another object off that original function. With the `constructor` property, you
    can. It returns a reference to the original function in question, which allows
    you to create new instances with the original data:'
