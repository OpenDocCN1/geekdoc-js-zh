    \ntasks.pop(); // 返回 \"Walk the dog\"\n```\n\n### push\n\n`push` 会将一个项添加到数组的末尾，并返回数组的新长度：\n\
    \n```\nvar tasks = [\n    \"Pay phone bill\",\n    \"Write best-selling novel\"\
