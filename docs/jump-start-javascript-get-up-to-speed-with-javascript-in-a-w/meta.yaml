    \ takes its syntax from Java, which in turn takes its syntax from C. In both of\
    \ these languages, for and while loops feature prominently. However, the official\
    \ specification discusses how in terms of programming philosophy JavaScript actually\
    \ takes its major ideas from Self and Scheme.$^6$\n\nScheme is a functional programming\
    \ language, and if we look at some documentation on its syntax,$^7$ we observe:\
    \ \"Scheme is very odd in one sense, it has no expressions designed for looping,\
    \ repeating, or otherwise doing something more than once at a general level.\"\
    \ JavaScript takes major ideas from a language with no expressions for loops!\
    \ How can this be? Let's have a look at some of the alternatives to loops now.\n\
    \n# Higher Order Functions\n\nEarlier in the text, we briefly touched on the newer\
    \ built-in array iteration functions: forEach, every, some, filter, map, reduce,\
    \ and reduceRight. These are higher order functions because they accept functions\
    \ as their arguments. They can be used instead of loops to facilitate programming\
    \ in a more functional style. For example, suppose we have an array and we wish\
    \ to add up the even numbers:\n\n```\nvar myNums = [3, 5, 10, 4, 2, 1, 16, 7];\n\
    ```\n\nUsing a loop-based approach would yield a similar result to this:\n\n```\n\
    var sum = 0;\n\nfor (var i = 0; i < myNums.length; i++) {\n    if (myNums[i] %\
    \ 2 === 0) {\n```"
- md: "```\nsum += myNums[i];\n}\n}\n\nconsole.log(sum);\n```\n\nThere is nothing\
    \ complicated in this; we're using plain vanilla loops as has been explained throughout\
    \ the chapter. Using a functional approach would produce the following:\n\n```\n\
    var sum = myNums.filter(function(x) {\n  return x % 2 === 0\n}).reduce(function(num1,\
    \ num2) {\n  return num1 + num2;\n})\n\nconsole.log(sum);\n```\n\nHere we're using\
    \ filter to extract only the even-numbered values; then we are using reduce to\
    \ add up the list. Same result, but nary a loop in sight. Let's look at a to-do\
    \ list example, where we have a bunch of tasks with a bunch of owners; we wish\
    \ to transfer the tasks of Paul and James to poor David:\n\n```\nvar tasks = [\n\
    \  {name: 'Buy milk', owner: 'James'},\n  {name: 'Trash', owner: 'Jill'},\n  {name:\
    \ 'Bills', owner: 'Paul'},\n  {name: 'Repairs', owner: 'Jill'},\n  {name: 'Plumber',\
    \ owner: 'James'}\n];\n```\n\nHere's one way of doing this is:\n\n```\nvar numTasks\
    \ = 0;\nvar newTasks = [];\n\nfor (var i = 0; i < tasks.length; i++) {\n  var\
    \ task = tasks[i];\n\n  if (task.owner === 'Paul' || task.owner === 'James') {\n\
    \    var newTask = {name: task.name, owner: 'David'};\n    newTasks.push(newTask);\n\
    \  }\n}\n\nconsole.log(newTasks);\n```\n\nHere we are checking for the specified\
    \ names, creating a new task, and then pushing it into a new array. A more functional\
    \ style would be:\n\n```\nvar newTasks = tasks.filter(function(task) {\n  return\
    \ task.owner === 'Paul' || task.owner === 'James'\n}).map(function(t) {\n  t.owner\
    \ = 'David';\n\n  return t;\n});\n\nconsole.log(newTasks);\n```\n\nHere we use\
    \ a filter to create an array with only the specified owners; then we map the\
    \ tasks to the new owner. For our next example, we wish to count the number of\
    \ tasks that have been assigned to a particular person. Here is where the elegance\
    \ of functional programming can truly shine. The imperative way is to go through\
    \ each task and increment a counter as follows:\n\n```\nvar tasks = [\n  {name:\
    \ 'Buy milk', owner: 'James'},\n  {name: 'Trash', owner: 'Jill'},\n  {name: 'Bills',\
    \ owner: 'Paul'},\n  {name: 'Repairs', owner: 'Jill'},\n  {name: 'Plumber', owner:\
    \ 'James'}\n];\n\nfunction countByOwner(tasks, name) {\n  var count = 0;\n\n \
    \ for (var i = 0; i < tasks.length; i++) {\n    if (tasks[i].owner === name) {\n\
    \      count++;\n    }\n  }\n\n  return count;\n}\n\nconsole.log(countByOwner(tasks,\
    \ 'James'));\n```\n\nThe functional way is to filter for the owner and then check\
    \ the length of the array:\n\n```\nfunction countByOwner(tasks, name) {\n  return\
    \ tasks.filter(function(task) {\n    return task.owner === name;\n  }).length;\n\
    }\n```\n\nThe functional mindset in some ways is less intuitive than the imperative\
    \ one; however, as demonstrated, it can be used to clearly and elegantly express\
    \ a solution that would take an imperative program many more lines to accomplish.\n\
    \n## Recursion\n\nLet’s briefly touch on the concept of recursion. Many functional\
    \ approaches eschew loops in favor of recursion. The following example will illustrate.\
    \ Remember from high school calculating the factorial of a number? Without going\
    \ into the formal definition, we’ll just use this simple example: 5 factorial\
    \ is 5 x 4 x 3 x 2 x 1, which is 120. Here’s the factorial function with loops:\n\
    \n```\nfunction factorial(num) {\n  var result = 1;\n\n  for (var i = num; i >\
    \ 0; i--) {\n    result *= i;\n  }\n\n  return result;\n}\n```\n\nAlternatively,\
    \ we can implement a recursive function that calls itself:\n\n```\nfunction factorial(num)\
    \ {\n  if (1 === num) {\n    return num;\n  } else {\n    return num * factorial(num\
    \ - 1);\n  }\n}\n```\n\nMany problems lend themselves to elegant recursive solutions.\
    \ Recursion is a fairly involved computer science topic, but if you start keeping\
    \ an eye out for instances where loops can be refactored as recursions, the number\
    \ of instances where they naturally occur may surprise you.\n\nFor those of you\
    \ who wish to explore recursion in greater depth, Kirit Sælensminde's \"Recursive\
    \ Rights and Wrongs\" article will prove useful.<sup>8</sup> It touches upon important\
    \ topics, such as performance considerations, not covered here.\n\n## Project\n\
    \n### Counting Tasks\n\nSuppose we wish to count the number of tasks that have\
    \ been completed. We'll need this functionality later when we provide charts.\
    \ Using loops, one way of completing the task would be as follows:\n\n```\nfunction\
    \ countComplete(tasks) {\n  var numCompleted = 0;\n\n  for (var i = 0; i < tasks.length;\
    \ i++) {\n    if (tasks[i].complete) {\n      numCompleted++;\n    }\n  }\n\n\
    \  return numCompleted;\n}\n```\n\nAll in all, this is a reasonable approach.\
    \ The logic is simple enough, and we have a counter to track the number of tasks\
    \ completed. We then loop through our task list and every time we see a completed\
    \ item, we increment the counter. Is there a better solution? Yes. Functional\
    \ programming to the rescue! Place this code into a file named **todo.js**:\n\n\
    ```\nfunction countComplete(tasks) {\n    return tasks.filter(function(task) {\n\
    \        return task.complete;\n    }).length;\n}\n```\n\nNow all we have to do\
    \ is filter the entire list based on whether a task is complete, and then return\
    \ the length of that list.\n\n### Sorting\n\nWe want to provide our users with\
    \ the ability to sort by three criteria: low-to-high, high-to-low, and name. Thanks\
    \ to the built-in sort function, all we have to do is provide a function to rank\
    \ our tasks based on the specified criterion:\n\n```\nvar sortByLowHigh = function(tasks)\
    \ {\n    return tasks.sort(function(task1, task2) {\n        return task2.priority\
    \ - task1.priority;\n    });\n};\n\nvar sortByHighLow = function(tasks) {\n  \
    \  return tasks.sort(function(task1, task2) {\n        return task1.priority -\
    \ task2.priority;\n    });\n};\n\nvar sortByName = function(tasks) {\n    return\
    \ tasks.sort(function(task1, task2) {\n        return task1.text > task2.text;\n\
    \    });\n};\n```\n\nFor priority sorting, we compare the tasks numerically. For\
    \ name sorting, we compare lexicographically. For the curious, the built-in array-sorting\
    \ function uses an algorithm internally known as QuickSort.<sup>9</sup>\n\n<sup>9</sup>\
    \ http://www.nczonline.net/blog/2012/11/27/computer-science-in-javascript-quicksort/\n\
    \n## Summary\n\nWe have covered a lot of ground in this chapter. We started by\
    \ taking a look at loops, including `while`, `do ... while`, `for`, and `for ...\
    \ in`. We then moved onto jumps, including labeled statements, `break`, `continue`,\
    \ and `return`. We also discussed exception handling, using `throw` and `try ...\
    \ catch ... finally` before moving onto talking about higher order functions and\
    \ how they're used to implement functional programming solutions. Finally, we\
    \ took a quick look at recursion, and how it can elegantly replace loops in certain\
    \ solutions.\n\nBy now, I hope you have a firm grasp of loops and jumps, and are\
    \ beginning to gain insights into cases where functional solutions can concisely\
    \ replace their imperative counterparts.\n\n# Chapter 6\n\n## The Document Object\
    \ Model\n\n### What is the DOM?\n\nThe Document Object Model (DOM) is an API for\
    \ manipulating HTML and XML documents. It's a tree hierarchy of objects representing\
    \ a document, and facilitates scripting by exposing methods and properties. Though\
    \ the DOM is quite powerful today, and large parts of its specification are well-supported\
    \ across all major browsers, this wasn't always the case.\n\nAt first there was\
    \ little uniformity, let alone a specification. Back in the bad old days of the\
    \ Browser Wars,¹ when Netscape and Microsoft were vying for supremacy over the\
    \ Web, one-upmanship was the name of the game. This lead to conflicting implementations,\
    \ with each manufacturer introducing non-standard features into its own product.\
    \ As developers began using these features, competing vendors were forced to mimic\
    \ the behavior so that web pages wouldn't break in their own browsers. Features\
    \ were forced into existence simply by whoever held significant market share with\
    \ their browser. As you can imagine, it was a headache at best for web developers\
    \ trying to make their code work in the major browsers of the day.\n\n¹ http://en.wikipedia.org/wiki/Browser_wars"
