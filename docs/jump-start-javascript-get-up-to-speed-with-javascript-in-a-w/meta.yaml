  md: '148 Jump Start JavaScript


    As we''ve checked that the `getContext` function exists, we can now actually call
    it. This function takes a single parameter, the context type. Currently, the canvas
    contexts that are available are "2d" and "webgl". The 2d context is defined as$^{7}$:
    “The 2D context represents a flat Cartesian surface whose origin (0,0) is at the
    top-left corner, with the coordinate space having x values increasing when going
    right, and y values increasing when going down.”


    Basically, it''s a flat surface that we can use for drawing. It''s important to
    note that the origin is the top-left corner, and y values increase when going
    down. This is different from the more familiar Cartesian plane, which has y values
    increasing when moving up. Because our graph has y values increasing when going
    up in the more traditional fashion, we''ll need to apply some transformations
    further on.


    Note, also, that because of the way the default coordinate system is defined,
    negative coordinates aren''t used. They will cause no errors, but they won''t
    display on the screen. The other type of context, WebGL$^{8}$, is considered more
    experimental at this point than the 2d context, and is primarily used for rendering
    3D graphics without the need for third-party plugins. We won''t be exploring WebGL
    in this book. You''ll notice that, by default, the canvas displays with a light
    gray fill. Let''s replace it with a white background to demonstrate some simple
    concepts:


    ```

    context.fillStyle = ''#FFFFFF'';

    context.fillRect(0, 0, canvas.width, canvas.height);

    ```


    We''re specifying a `fillStyle` of #FFFFFF, which is white. The `fillStyle` attribute
    represents the color or style to use inside shapes. Here we are using it to indicate
    a color; later on, we''ll specify a gradient.


    We then call the function `fillRect` to fill in a rectangle with the expressed
    color around the specified coordinates. `fillRect` takes four parameters: the
    x coordinate of the upper-left corner, the y coordinate of the upper-left corner,
    the width of the rectangle in pixels, and the height of the rectangle in pixels.
    If you refresh the page, you''ll notice that the canvas is now completely white.
    Let''s delineate our canvas with a black border:


    7 http://www.w3.org/html/wg/drafts/2dcontext/html5_canvas/

    8 http://en.wikipedia.org/wiki/WebGL'
  merge: -1
  pgno: 163
