    \ 7.8 所示的内容。\n\n图 7.8. 记录按键\n\n现在，你对 JavaScript 事件已有足够的了解，可以在自己的应用中处理各种情况。然而，假设我们希望事件能与其他代码互操作。JavaScript\
    \ 是否提供了促进这一点的机制？答案是肯定的，我们将在下一节中讨论。\n\n## 自定义事件\n\nJavaScript 提供了创建自定义事件的简单机制。在描述实现细节之前，有必要先过一个用例示例，因为自定义事件的使用对\
    \ JavaScript 新手来说并不总是显而易见的。假设我们的待办事项应用已经完成，而其他人希望编写一个插件，每当用户向列表中添加新项目时，就向用户显示一个炫酷的通知。\n\
    \n他们应该如何着手实现？一个可能的选项是让其他程序员修改我们的脚本，并将他们的通知代码放入我们的代码中。这在多个方面都存在问题。首先，他们可能无法访问我们的源代码。虽然\
    \ JavaScript 始终可以作为纯文本查看，但在发布之前，我们可能会选择压缩代码以提高加载速度。这将使我们的源代码非常难以直接操作。\n\n但即使假设我们授予了对原始源代码的访问权限，直接修改待办事项列表的代码库仍然是一个糟糕的想法，原因有很多。首先，如果我们决定更新待办事项列表代码，可能会破坏其他程序员的修改。其次，如果多位程序员都希望创建自己的插件，原始代码库将很快变得臃肿且难以管理。\n\
    \n上述解决方案的问题在于，它涉及修改我们的待办事项列表代码以加入其本身无需知晓的功能。虽然插件代码需要了解待办事项列表，但反过来则不然。待办事项列表应用无需了解任何插件。理论上，应该可以在编写成千上万个插件的同时，让我们的原始程序在其无知的幸福中愉快地运行。这种架构的技术术语是松耦合。现在，让我们通过一个使用自定义事件的实际实现，让这个概念更具体一些。\n\
    \n可以使用以下通用构造来创建自定义事件：\n\n```\nvar event = new CustomEvent(type, eventInitDict);\n\
    ```\n\n这里，`type` 是自定义事件的名称，是我们定义的。`eventInitDict` 提供初始化参数。\n\n`eventInitDict`\
    \ 本身是一个 JavaScript 对象，接受以下三个参数：\n\n- **bubbles**：一个布尔值，指示事件是否通过 DOM 向上冒泡。冒泡阶段和捕获阶段已在本章前面介绍过。\n\
    \n- **cancelable**：一个布尔值，指示事件是否可取消。如果事件可取消，意味着它可以阻止其默认动作。\n\n- **detail**：初始化事件时传递的数据。我们将根据希望随自定义事件传输的数据来填充此对象。\n\
    \n让我们用一个例子来说明上述内容。创建一个名为 **customevent.html** 的新文件，包含以下 HTML：\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n    <title>Events</title>\n</head>\n<body>\n    <button\
    \ id=\"btnAdd\">Add Task</button>\n    <script src=\"customevent.js\"></script>\n\
    </body>\n</html>\n```\n\n这代表了我们的虚拟待办事项列表应用。接下来，创建一个名为 **customevent.js** 的文件，包含以下\
    \ JavaScript 代码：\n\n```\nvar taskEvent = new CustomEvent(\"TaskAdded\", {\n  \
    \  detail: {\n        message: \"A task has been added\",\n    },\n    bubbles:\
    \ true,\n    cancelable: true\n});\nvar btnAdd = document.getElementById(\"btnAdd\"\
    );\n\nbtnAdd.onclick = function(e) {\n    document.dispatchEvent(taskEvent);\n\
    };\n```\n\n上述代码创建了一个自定义事件。我们将名称定义为 \"TaskAdded\"，然后为事件提供初始化参数。每次点击按钮时，我们使用 **dispatchEvent**\
    \ 来触发事件。我们的事件现在可以以与按键和鼠标点击等原生事件完全相同的方式被处理。我们做一个简化的假设：每次点击按钮都会添加一个任务。在真实应用中，你很可能只在所有错误检查通过后才触发事件。因此，现在我们有了一个非常简单的应用原型。它所做的就是在按钮被点击时触发一个自定义事件。假设现在有人希望编写一个插件。将以下代码添加到一个名为\
    \ **customeventplugin.js** 的新文件中：\n\n```\nfunction handleTaskAdded(e) {\n    alert(e.detail.message);\n\
    }\n\ndocument.addEventListener(\"TaskAdded\", handleTaskAdded, false);\n```\n\n\
    在 **customevent.html** 中添加以下行：\n\n```\n<script src=\"customeventplugin.js\"></script>\n\
    ```\n\n当你刷新页面并点击按钮时，现在应该会看到类似图 7.9 所示的景象。\n\n使用自定义事件具有一些强大的意义。如果我们有一个设计良好的事件 API，这意味着其他库和代码库现在可以通过纯粹地响应事件来与我们的代码互操作。这些其他代码库永远不需要直接访问我们的源代码。自定义事件可以在任何情况下触发，它不一定非得是用户生成的事件。这种机制为通过松耦合组件的交互创建丰富的\
    \ JavaScript 生态系统开辟了可能性。现在让我们转向如何在项目中使用事件。\n\n## 项目\n\n### 添加任务\n\n我们的待办事项列表应用需要处理和响应多个用户事件。用户通过提交表单来添加任务。这在\
    \ JavaScript 中处理如下：\n\n```\naddForm.onsubmit = function(e) {\n  var val;\n\n \
    \ preventDefault(e);\n  val = newTaskField.value;\n\n  if (val === \"\") {\n \
    \   warn(\"Please enter a task\");\n  } else {\n    newTaskField.value = \"\"\
    ;\n    clearWarning();\n    addTask(val);\n  }\n};\n```\n\n首先，我们添加 `onsubmit`\
    \ 处理程序来检测用户何时提交了表单。我们使用 `preventDefault` 来阻止默认动作，因为我们不希望表单实际提交到服务器！\n\n> 阻止默认动作\n\
    >\n> 一些 HTML 元素具有默认动作。例如，表单会被提交，锚点会跟随超链接，复选框会被切换。默认情况下，JavaScript 不会抑制这些默认动作。换句话说，如果你在用户点击锚点时触发事件，你的事件处理程序会被调用，但浏览器也会继续执行标准动作，即跟随超链接。如果根据你的应用需求这是不希望的行为，那么可以使用事件的\
    \ `preventDefault` 方法来告诉浏览器停止执行默认动作。\n\n在我们的示例中，我们检查任务是否为空，此时会显示警告。如果任务有效，我们会清除所有先前的警告，然后将任务添加到列表中。\n\
    \n### 排序\n\n当我们的用户希望排序项目时，他们会点击“名称”、“优先级从低到高”或“优先级从高到低”中的一个，如图 7.10 所示。\n\n在 HTML\
    \ 中，这些文本值已定义为锚点标签。我们已经使用以下代码获取了这些标签：\n\n```\nsortByLowHighAnchor = document.getElementById(\"\
    sortByLowHigh\");\nsortByHighLowAnchor = document.getElementById(\"sortByHighLow\"\
    );\nsortByNameAnchor = document.getElementById(\"sortByName\");\n```\n\n在第 4 章中，我们编写了实际的排序代码。现在，我们可以用事件处理程序将这些部分粘合在一起，如下所示：\n\
    \n```\nsortByLowHighAnchor.onclick = function(e) {\n    preventDefault(e);\n \
    \   tasks = sortByLowHigh(tasks);\n    renderTaskList();\n};\n\nsortByHighLowAnchor.onclick\
    \ = function(e) {\n    preventDefault(e);\n    tasks = sortByHighLow(tasks);\n\
    \    renderTaskList();\n};\n\n// 按名称排序任务\nsortByNameAnchor.onclick = function(e)\
    \ {\n    preventDefault(e);\n    tasks = sortByName(tasks);\n    renderTaskList();\n\
    };\n```\n"
