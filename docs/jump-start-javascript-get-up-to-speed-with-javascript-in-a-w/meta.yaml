    \ = ...;\n  return merged\n}\n```\n\nNote how in the second example we have 'guard'\
    \ statements to check for exception conditions, followed by a single exit at the\
    \ end. As a practical guideline, it is fine to follow this pattern of guard statements\
    \ at the top followed by a single exit. It's when we have return statements cropping\
    \ up in the middle of long functions that code potentially becomes more difficult\
    \ to understand and maintain.\n\n## Exception Handling\n\nJavaScript provides\
    \ a mechanism to handle exceptional circumstances by transferring control to special\
    \ error-handling sections of the code. To catch exceptions, we must place the\
    \ potentially offending code within a `try` block. When an error occurs, an exception\
    \ is thrown and control is transferred to code within the `catch` block. If no\
    \ exception is thrown, the exception handler is ignored and the code continues\
    \ as normal. This will be explained in more detail shortly.\n\n## throw\n\nThe\
    \ keyword `throw` is used to signal an error condition. It takes this form:\n\n\
    ```\nthrow expression;\n```\n\nWhile it is syntactically valid to throw an exception\
    \ this way:\n\n```\nthrow \"This is an error in the form of a string\";\n```\n\
    \nthe preferred format is to explicitly use an `Error` object. Continuing with\
    \ the example from the prior section:\n\n```\nfunction divideBy(numerator, denominator)\
    \ {\n    if (denominator === 0) {\n        throw new Error('Denominator must be\
    \ non zero');\n    }\n\n    return numerator / denominator;\n}\n```\n\nAn `Error`\
