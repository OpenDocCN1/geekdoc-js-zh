    # Chapter 5


    # Loops and Jumps


    This chapter introduces loop and jump statements. A **loop statement** is used
    when we want to repeat some programming statements until a specified condition
    is reached. A typical example would be to iterate through a list and perform an
    operation on each member of the list. A **jump statement** allows code to exit
    loops. One example is to loop through our to-do list and then break out of the
    loop upon reaching the first incomplete item. There are various types of jump
    statements, which we''ll explain as we go along.


    Loops are generally associated with a particular style of programming known as
    **imperative programming**. Here, the programmer specifies step by step how a
    program should achieve a particular task. An alternative approach is **functional
    programming**, which states what the program should be doing without exactly specifying
    how the program should do it. JavaScript supports multiple paradigms including
    imperative and functional styles. We will spend the latter part of this chapter
    looking at some functional alternatives to working with loops. Functional programming
    can provide more elegant solutions to certain types of problems, and it can make
    your code base smaller, more understandable, and easier to maintain.'
  - "[PAGE 95]\n\n# # Loops\n\nBy way of introduction, we should note that as with\
    \ the if statement, all looping constructs can be written without the enclosing\
    \ curly braces when only a single statement is involved. For clarity, we recommend\
    \ that you always include the curly braces, even for single statements. This is\
    \ the standard that was followed by the team at id Software when they programmed\
    \ Doom 3.¹ We say only partially tongue in cheek that if it's good enough for\
    \ the legendary John Carmack and his team, it's certainly good enough for us!\n\
    \n# ## The while Loop\n\nThe while loop takes the following form:\n\n```\nwhile\
    \ (condition) {\n    statement\n}\n```\n\nThe condition can be any expression\
    \ that evaluates to true or false. The statement consists of the code that is\
    \ executed while the condition evaluates to true. Recall that in JavaScript, any\
    \ value can be converted to a Boolean. For those who need a refresher on how particular\
    \ values in JavaScript are converted to Booleans, we refer you to this excellent\
    \ article written by our technical editor, Colin Ih rig.²\n\nThe while loop can\
    \ be illustrated with this simple example:\n\n```\nvar tasksToDo = 3;\n\nwhile\
    \ (tasksToDo > 0) {\n    console.log('There are ' + tasksToDo + ' tasks to do');\n\
    \    tasksToDo--;\n}\n```\n\nThis prints the following to the console:"
- md: "There are 3 tasks to do\nThere are 2 tasks to do\nThere are 1 tasks to do\n\
    \nWhen using a while loop, it's important to make sure that the condition eventually\
    \ evaluates to false. During each iteration of the loop, some variable should\
    \ be changing that will eventually lead to the condition being false, thereby\
    \ terminating the loop. Otherwise, your program becomes stuck in the dreaded infinite\
    \ loop. For an example of a subtle bug that leads to an infinite loop, consider\
    \ this:\n\n```\nfunction getNext(num) {\n    return num++;\n}\n\nvar i = 0;\n\n\
    while (i < 3) {\n    i = getNext(i);\n}\n```\n\nAt first it may be hard to even\
    \ spot the bug. Note that num++ will return the value of num, and then increment\
    \ the value. Therefore, in the while loop, the value of i will always be zero!\
    \ Whenever you are writing a while loop, always double check that the loop will\
    \ gracefully exit. With patience and practice this will soon become second nature.\n\
    \n## The do ... while Loop\n\nThe do ... while loop is a variation of the while\
    \ loop that takes the following form:\n\n```\ndo {\n    statement\n} while(expression);\n\
    ```\n\nThe main difference between the two is that execution is guaranteed at\
    \ least once with the do ... while loop. The following example illustrates this:\n\
    \n```\ndo {\n  console.log('This will print at least once');\n}\nwhile (false);\n\
    ```\n\nWe use `while (false)` to emphasize that the while check terminates the\
    \ loop. Nonetheless, there will still be a single print to the console. With a\
    \ slight modification, our while example can be rewritten as its `do ... while`\
    \ equivalent:\n\n```\nvar tasksToDo = 3;\n\ndo {\n  console.log('There are ' +\
    \ tasksToDo + ' tasks to do');\n  tasksToDo--;\n}\nwhile (tasksToDo > 0);\n```\n\
    \nThis code will result in exactly the same console output. For many problems,\
    \ it is possible to use either a `while` or a `do ... while`, so the question\
    \ becomes which one to choose. We would recommend `while` as the default choice,\
    \ only using `do ... while` on those occasions when a statement has to be executed\
    \ at least once.\n\n## The for Loop\n\nThe `for` loop is used to run a code block\
    \ a number of times, and is often referred to as a counting loop. It takes this\
    \ general form:\n\n```\nfor (initialization; condition; end-expression ) {\n \
    \ statement\n}\n```\n\nAs a simple example, consider the following:\n\n```\nfor\
    \ (var i = 0; i < 3; i++) {\n  console.log(i);\n}\n```\n\nThe above loop will\
    \ declare the variable `i` and assign it the initial value of 0. On each iteration,\
    \ `i` will be logged to the screen and then incremented by 1. It is important\
    \ to note that the variable is both declared and initialized. It's syntactically\
    \ valid to omit the declaration:\n\n```\nfor (i = 0; i < 3; i++) {\n    console.log(i);\n\
    }\n```\n\nHowever, this will create a global variable, i, which is undesirable.\
    \ It will potentially clash with other variables of the same name, and could lead\
    \ to memory leaks as well as a host of other disagreeable phenomena. If you are\
    \ creating a new variable at the beginning of your for loop, always remember the\
    \ var! A for loop can also have multiple tests:\n\n```\nfor (var i = 0; i < 10\
    \ && i % 2 === 0; i+=4) {\n    console.log(i);\n}\n```\n\nHere we're testing that\
    \ i is less than 10 and divisible by 2, which will print:\n\n```\n0\n4\n8\n```\n\
    \nIt's also possible to have multiple initializations and end expressions:\n\n\
    ```\nfor (var i = 0, j = 0; i < 3; i++, j+=2) {\n    console.log(i, j);\n}\n```\n\
    \nBefore running the code, try to work out what it will print to the console.\
    \ Did you guess the following correctly?\n\n```\n0 0\n1 2\n2 4\n```\n\nThe loop\
    \ is running two end expressions and so, on each iteration, i is being incremented\
    \ by 1 and j is being incremented by 2. Note also that while the end expression\
    \ is generally used to increment a counter, it can take on any number of forms.\
    \ For example, we could assign i to be a random number using the built in Math.random()\
    \ function:\n\n```\nfor (var i = 0; i < 0.9; i = Math.random()) {\n    console.log(i);\n\
    }\n```\n\nHere the loop will keep on iterating until the random number generator\
    \ produces a value of 0.9 or greater. As you can see, the for loop is a powerful\
    \ and flexible construct, and is likely to be the one you'll use the most.\n\n\
    ## The for ... in Loop\n\nThe for ... in loop was covered in the last chapter.\
    \ To recap, this statement is used to loop through the properties of an object;\
    \ for example:\n\n```\nvar agents = {\n    '005': \"Michael Harp\",\n    '006':\
    \ \"John Smith\",\n    '007': \"James Bond\"\n};\n\nfor (key in agents) {\n  \
    \  if ('007' === key) {\n        console.log('Bond, ' + agents[key] + ' has been\
    \ found!');\n    } else {\n        console.log('Standard spy, ' + agents[key]\
    \ + ' has been found');\n    }\n}\n```\n\nThere are a few important points worth\
    \ keeping in mind. First, avoid using this with arrays; instead, use the standard\
    \ for loop. Second, do not rely on the loop returning objects in the same order\
    \ in which they were defined. Although most vendors do implement the loop in this\
    \ way, it's not actually part of the specification, so there's potential a standards-compliant\
    \ vendor may decide on a different implementation.\n\n## Jumps\n\nBroadly speaking,\
    \ a jump statement is used to move to another part of the script. The jump statements\
    \ in JavaScript are `break`, `continue`, labeled statements, and `return`. `return`\
    \ is used for exiting functions, while the rest are used with loops. Let’s break\
    \ this down in detail.\n\n### break\n\nThe `break` statement is used to exit from\
    \ a loop. Suppose we wish to iterate through the task list and stop once we’ve\
    \ hit the first completed a task. This could be accomplished with a `break` statement:\n\
    \n```\nbreak.html (excerpt)\n\nvar tasks = [\n  {name: 'Buy milk', complete: false},\n\
    \  {name: 'Trash', complete: false},\n  {name: 'Pay bills', complete: true},\n\
    \  {name: 'Repairs', complete: false},\n  {name: 'Plumber', complete: true}\n\
    ];\nvar firstComplete;\n\nfor (var i = 0; i < tasks.length; i++) {\n  if (tasks[i].complete)\
    \ {\n    firstComplete = tasks[i];\n    break;\n  }\n}\n\nconsole.log(firstComplete);\n\
    ```\n\nNote that `break` is only used for exiting from loops. Do not use it to\
    \ try and exit from conditionals such as `if`. The previous example can be refactored\
    \ to be written without the `break`:\n\n```\nfor (var i = 0; i < tasks.length\
    \ && firstComplete === undefined; i++) {\n    if (tasks[i].complete) {\n     \
    \   firstComplete = tasks[i];\n    }\n}\n```\n\nFrom the start, the reader can\
    \ see that the loop is meant to exit once `firstComplete` is assigned a value.\
    \ When using `break`, it is almost always possible to replace it using conditional\
    \ statements, so it's worth considering which option is cleaner and clearer before\
    \ writing your code. As a practical guideline, if your `break` statement is going\
    \ to be deeply buried within the middle of a loop, ponder ways of either bringing\
    \ it to the top or else refactoring to avoid it entirely.\n\n### continue\n\n\
    The `continue` statement is also used in the context of loops; however, instead\
    \ of breaking from the loop, it skips to the next iteration. In a `while` loop,\
    \ this means that the condition is tested again. In a `for` loop, the end expression\
    \ is run and then the loop continues. An example should clarify. Assuming the\
    \ same `tasks` variable from the previous example, let's look at the following\
    \ code:\n\n```\nfor (var i = 0; i < tasks.length; i++) {\n  if (!tasks[i].complete)\
    \ {\n    continue;\n  }\n\n  console.log(i, tasks[i].name);\n}\n```\n\nThis code\
    \ prints the tasks that are complete, yielding this:\n\n```\n2 'Pay bills'\n4\
    \ 'Plumber'\n```\n\nWe choose to print the value of the counter `i` to demonstrate\
    \ the effect of using `continue` on counter incrementation. Notice how it causes\
    \ the loop to continue, as well as running the end condition to increment the\
    \ counter. Let's revisit our simple `while` example. Suppose we wish to skip the\
    \ case when `tasksToDo` is equal to 2. Without typing in the code, consider whether\
    \ this solution would work:\n\n```\nvar tasksToDo = 3;\n\nwhile (tasksToDo > 0)\
    \ {\n    if (tasksToDo == 2) {\n        continue;\n    }\n\n    console.log('There\
    \ are ' + tasksToDo + ' tasks to do');\n    tasksToDo--;\n}\n```\n\nDid you spot\
    \ the error? By continuing, we bypass `tasksToDo`—and become stuck in an infinite\
    \ loop. We'll leave it as an exercise for you to fix the example using a conditional\
    \ and then compare the two pieces of code for clarity. It is easier for our brains\
    \ to process in a linear manner. More cognitive overhead is needed to process\
    \ jump statements, making it more likely for mistakes to creep into our code.\
    \ It's up to the programmer to decide on whether a particular method maximizes\
    \ clarity and readability, and in this sense, programming is as much an art as\
    \ it is a science.\n\n### Labeled Statements\n\nLabeled statements are used in\
    \ conjunction with `break` and `continue`. A statement can be labeled by prefixing\
    \ it with an identifier:\n\n```\nidentifier: statement\n```\n\nLet's look at an\
    \ example from the Mozilla Developer Network³, which actually comes with a warning:\
    \ “As much as possible, avoid using labels and, depending on the cases, prefer\
    \ calling functions or throwing an error.” When code comes with a warning, take\
