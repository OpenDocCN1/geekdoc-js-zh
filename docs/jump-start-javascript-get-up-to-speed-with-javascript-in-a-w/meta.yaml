  md: '# Chapter 8


    # Canvas


    This chapter introduces the `<canvas>` element, which is part of the HTML5 specification.
    We''ll be using `<canvas>` to implement a productivity chart for our example application.
    The chart will update each time the data is changed. This will show the user how
    many tasks have been completed and how many remain unfinished. We''ll also add
    some shadowing and gradient effects to give our charts a more polished look.


    # What is Canvas?


    The official specification¹ states: "The canvas element provides scripts with
    a resolution-dependent bitmap canvas, which can be used for rendering graphs,
    game graphics, art, or other visual images on the fly." Although the specification
    does not mandate an actual scripting language, JavaScript is generally the language
    used.


    ¹ http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html#the-canvas-element'
  merge: -1
  pgno: 158
- img_proc: true
  md: "# Canvas Versus SVG\n\nThe material in this chapter could have also been written\
    \ using **Scalable Vector Graphics (SVG)**. SVG is a language for describing two-dimensional\
    \ graphics in XML. Both Canvas and SVG have widespread adoption; each has its\
    \ own strengths and weaknesses². In the end, we chose Canvas for the practical\
    \ reason that it is JavaScript-based. For those curious to explore SVG, the Mozilla\
    \ Developer Network has both documentation and examples.³\n\nWe can provide a\
    \ basic canvas for our users:\n\n```\n<div align=\"center\">\n    <br /><br />\n\
    \    <h2>Productivity Chart</h2>\n    <canvas id=\"canvas\" height=\"300\" width=\"\
    400\">\n    </canvas>\n</div>\n```\n\nPlace this code in `index.html` just before\
    \ `<ul class=\"template\">`. A basic canvas can be provided by using the `<canvas>`\
    \ tag. We also specify an id, a height, and a width for the canvas. If no values\
    \ are provided, or if the values provided cannot be correctly parsed, the default\
    \ values are used: 300 for the width and 150 for the height. It is possible for\
    \ a page to have multiple `<canvas>` elements, but for this project we’ll just\
    \ be using one. Our code will provide, pardon the pun, a blank canvas, with no\
    \ content.\n\nOur first task is to cater to those browsers without support for\
    \ the `<canvas>` element. As of the time of writing, the canvas element is supported\
    \ in 85% of browsers⁴. All modern major browsers, including those on mobile devices,\
    \ support the `<canvas>` element. Although listed as unsupported, IE8 can actually\
    \ support `<canvas>` functionality if developers wish to add one additional `<script>`\
    \ tag to use a third-party library.⁵\n\n2 http://dev.opera.com/articles/view/svg-or-canvas-choosing-between-the-two/\n\
    3 https://developer.mozilla.org/en-US/docs/SVG\n4 http://caniuse.com/#feat=canvas\n\
    5 https://code.google.com/p/explorercanvas/"
