    # DOM Level 4


    In 2004, the Web Hypertext Application Technology Working Group (WHATWG) was formed
    in response to the W3C’s decision to abandon HTML in favor of XML-based technologies,
    as well as its slow development of web standards. With the participation of Apple,
    Mozilla, and Opera, WHATWG brought forth HTML5—a broad collection of technologies
    of which the updated DOM is a part. In 2007, the W3C joined the effort, forking
    a copy of the specification and publishing it on its site under copyright.


    The partnership between WHATWG and the W3C ended in 2011 when the latter wanted
    to publish a finished version of the spec (with known problems), while the WHATWG
    wanted to work on it as a “living standard,” continually maintaining it. The most
    notable additions to DOM4 are getElementsByClassName, prepend, append, before,
    after, replace, and remove. As of this writing, all but getElementsByClassName
    are yet to be implemented in major browsers.


    # getElementsByClassName


    Having native support for getElementsByClassName was a long time coming. For years,
