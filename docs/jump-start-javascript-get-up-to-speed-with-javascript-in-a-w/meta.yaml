    # Summary


    Congratulations, you have achieved quite a lot in this chapter. This chapter began
    with an introduction to the <canvas> element. Next, you learned how to draw text,
    rectangles, and lines using the canvas API. From there, we moved on to more advanced
    topics such as canvas rotation and scaling, gradients, and shadow effects. Finally,
    you learned how to save a canvas as an image file. Of course, throughout the entire
    chapter, you also learned how to create canvas based charts to work with the book''s
    example project.


    Now that you''ve read through this book, you should have a fairly good grasp of
    the JavaScript programming language. Though the scope and size of this book didn''t
    allow us to dive as deeply into the language as we could have (that''s reserved
    for books many times the size of this one) you should nonetheless have a good
    base to build on. You''re guaranteed to use the fundamentals covered in this book
    in whatever JavaScript program you end up writing, regardless of whether it''s
    simple or extremely complex. Remember, this book sped you through JavaScript at
    a fairly quick pace. You''ll undoubtedly get to a point where you''ll want to
    dive deeper into some of what we covered here, or other, more advanced topics
    that we didn''t. Stay curious, ask questions and dig. At the rate the web is evolving,
    there are practically no limits to what you can build.'
