  md: '**A Sensitive Issue**


    JavaScript is a case-sensitive language, so **task** and **Task** are treated
    as entirely different variables. Likewise, when we look at naming functions later
    on, case sensitivity will be important. Just remember to always use the same case
    when referring to a variable.


    **Terminate Each Line**


    The semicolon at the end of the line tells JavaScript that this line of code is
    complete. If you leave it out, JavaScript will attempt to insert a semicolon when
    it''s reading your code. This is known as automatic semicolon insertion. As a
    general guideline, you shouldn''t leave your program''s functionality to guesswork.
    It''s best to be sure and terminate each line with a semicolon.


    One last point about variable declaration and initialization. It''s best to keep
    the two separate. I''ve run into trouble in the past when using a debugger to
    walk through my code. When variables are declared and initialized in the same
    statement, the debugger skips over the whole line in one step. If there''s any
    trouble with one of the initializations, you won''t be able to examine each assignment
    individually. Instead, it''s better declare all your variables together and initialize
    them all separately, like so:


    ```

    // declaration

    var task, complete;


    // initialization

    task = "Write the first chapter.";

    complete = true;

    ```


    Later, we''ll see how it''s possible to perform calculations and operations during
    value assignment. We''ll also see how doing so can make debugging more difficult.


    **Saving Space**


    Some examples in this book may go against this rule, declaring and initializing
    variables in a single statement. This is usually done in order to save page space.'
  merge: -1
