    \n    if (idx) {\n        idx = Number(idx);\n        targetClass = target.getAttribute('class');\n\
    \n        if (targetClass === 'highpriority' || targetClass ===\n            'lowpriority'\
    \ || targetClass === 'normalpriority') {\n            setPriority(idx, target.getAttribute(\"\
    value\"));\n        } else if (target.className.match(\"delete-task\")) {\n  \
    \          removeTask(idx);\n        } else if (target.type === \"checkbox\")\
    \ {\n            toggleComplete(idx);\n        }\n    }\n};\n```\n\nFirstly, we\
    \ retrieve the index of the item and store it into the variable `idx`. If this\
    \ is a valid value, we take the class of the HTML element and store it in the\
    \ variable **targetClass**. We then test for three separate cases. In the first\
    \ case, **targetClass** indicates the user has clicked on priority sorting. In\
    \ this case, we retrieve the value of the HTML element and use this number to\
    \ set the priority of the task. In the second case, **targetClass** indicates\
    \ that the user has clicked on delete. In this case we can simply remove the item.\
    \ In the third and final case, the user has clicked on a checkbox, at which point\
    \ we know to toggle whether or not the task has been completed. This completes\
    \ our exploration of event handling.\n\n## Summary\n\nWe have covered the main\
    \ aspects of JavaScript event handling in this chapter. We began by describing\
    \ DOM events, specifically what constitutes an event and where to find a list\
    \ of events. We then took a technical detour to cover propagation, the path that\
    \ an event takes to get from the user to your application. Next we explored assigning\
    \ handlers. This is how HTML elements register for events and how functions are\
    \ defined to handle a given event. From within an event handler, we then learned\
    \ how to find out about HTML elements and get event object information. We also\
    \ discussed custom events which is how to get your application to fire its own\
    \ internally defined event.\n\n# Chapter 8\n## Canvas\n\nThis chapter introduces\
    \ the `<canvas>` element, which is part of the HTML5 specification. We'll be using\
    \ `<canvas>` to implement a productivity chart for our example application. The\
    \ chart will update each time the data is changed. This will show the user how\
    \ many tasks have been completed and how many remain unfinished. We'll also add\
    \ some shadowing and gradient effects to give our charts a more polished look.\n\
    \n## What is Canvas?\n\nThe official specification¹ states: \"The canvas element\
    \ provides scripts with a resolution-dependent bitmap canvas, which can be used\
    \ for rendering graphs, game graphics, art, or other visual images on the fly.\"\
    \ Although the specification does not mandate an actual scripting language, JavaScript\
    \ is generally the language used.\n\n¹ http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html#the-canvas-element\n\
