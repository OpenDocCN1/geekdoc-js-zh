    \ // returns \"Cooper\"\n```\n\n你会注意到 `person` 函数指向 `this.lastName`，而在我们绑定它之前，`lastName`\
    \ 引用的是全局 `window` 空间中的一个变量（该变量是 `undefined`）。因此，我们将其绑定到一个包含 `lastName` 属性（值为 \"\
    Reyes\"）的对象上。现在，当我们调用新创建的 `hugo` 函数时，从绑定给它的对象上返回了 \"Reyes\"。\n\n假设我们将原始的 `person`\
    \ 函数以及新创建的 `hugo` 函数放在一个包含 `lastName` 属性的对象中。我们会看到 `person` 函数内部的 `this` 动态地指向了外层对象，因此\
    \ `this.lastName` 现在返回 \"Cooper\"，而永久绑定的 `hugo` 函数继续返回 \"Reyes\"。\n\n### toString\
    \ 方法\n\n`toString` 方法返回一个表示函数代码的字符串。例如，如果我们写了一个简单的函数：\n\n```\nfunction foo() {\n\
    \  return \"foo\";\n}\n```\n\n然后调用它的 `toString` 方法：\n\n```\nfoo.toString();\n\
    ```\n\n我们会得到类似这样的响应：\n\n```\n\"function foo() {\n  return \"foo\";\n}\"\n```\n\
    \n然而，如果我们对一个 JavaScript 语言内置函数调用 `toString`：\n\n```\ndocument.getElementById.toString()\n\
    ```\n\n我们会收到如下响应：\n\n```\n\"function getElementById() { [native code] }\"\n```\n\
    \n这是因为负责 `getElementById` 的代码是编译过的，无法像 JavaScript 代码那样以人类可读的形式输出。\n\n## 项目实践\n\
    \n既然我们已经理解了函数和对象，就可以开始在我们的任务管理器项目中做一些更高级的操作了。我们可以用对象数组而不是简单的任务数组来存储更丰富的信息。我们也可以编写一些函数来为我们执行操作。让我们首先将每个任务包装在一个对象中：\n\
    \n```\nvar tasks;\n\ntasks = [\n  {\n    text: \"Pay phone bill\",\n    complete:\
    \ false,\n    priority: 1\n  },\n  {\n    text: \"Write best-selling novel\",\n\
    \    complete: false,\n    priority: 3\n  },\n  {\n    text: \"Walk the dog\"\
    ,\n    complete: false,\n    priority: 2\n  }\n];\n```\n\n现在我们有了一组更丰富的数据；每个任务都有一个\
    \ `complete` 标志和一个优先级。让我们写一个函数来向数组中添加任务：\n\n```\nvar tasks, addTask;\n\ntasks\
    \ = [];\n\naddTask = function(task) {\n  tasks.push({\n    text: task,\n    complete:\
    \ false,\n    priority: 1\n  });\n};\n```\n\n现在我们可以调用 `addTask`，传入一些文本来存储它，并在\
    \ `tasks` 数组中设置一个 `complete` 标志为 `false`。\n\n### 本章小结\n\n在本章中，我们介绍了对象，包括如何读写对象，以及如何嵌套对象来为变量创建命名空间。我们还研究了如何循环遍历对象来读取数据，以及在遍历对象属性时如何过滤掉原型链。接着我们探讨了函数，探索了创建函数的不同方式，以及如何使用函数来编写面向对象的代码。我们检查了函数的各种属性和方法，并通过将我们的知识应用到正在构建的任务管理器项目中作为结尾。\n\
    \n在下一章中，我们将看看循环和跳转。\n\n## 第五章\n\n## 循环与跳转\n\n本章介绍循环和跳转语句。**循环语句**用于我们需要重复执行一些编程语句，直到满足特定条件为止。一个典型的例子是遍历一个列表并对列表中的每个成员执行操作。**跳转语句**允许代码退出循环。一个例子是遍历我们的待办事项列表，然后在遇到第一个未完成的项目时跳出循环。跳转语句有多种类型，我们将在讲解过程中逐一解释。\n\
    \n循环通常与一种称为**命令式编程**的特定编程风格相关联。在这里，程序员逐步指定程序应如何完成特定任务。另一种方法是**函数式编程**，它声明程序应该做什么，而不具体指定程序应如何做。JavaScript\
    \ 支持多种范式，包括命令式和函数式风格。本章后半部分我们将探讨使用循环的函数式替代方法。函数式编程可以为某些类型的问题提供更优雅的解决方案，它可以使你的代码库更小、更易于理解、也更易于维护。\n\
    \n## 循环\n\n作为引入，我们应当注意，与 `if` 语句一样，当只涉及单个语句时，所有循环结构都可以不写花括号。但为了清晰起见，我们建议你即使对于单个语句也始终包含花括号。这是\
    \ id Software 团队在开发《毁灭战士3》时所遵循的标准。¹ 我们半开玩笑地说，如果这对传奇的约翰·卡马克及其团队来说都足够好，那么对我们来说当然也足够好！\n\
    \n### while 循环\n\n`while` 循环采用以下形式：\n\n```\nwhile (condition) {\n    statement\n\
    }\n```\n\n条件可以是任何计算结果为 `true` 或 `false` 的表达式。语句由当条件计算结果为 `true` 时执行的代码组成。回想一下，在\
    \ JavaScript 中，任何值都可以转换为布尔值。对于需要复习 JavaScript 中特定值如何转换为布尔值的读者，我们推荐阅读我们的技术编辑 Colin\
    \ Ihrig 撰写的这篇优秀文章。²\n\n`while` 循环可以用这个简单的例子来说明：\n\n```\nvar tasksToDo = 3;\n\n\
    while (tasksToDo > 0) {\n    console.log('There are ' + tasksToDo + ' tasks to\
    \ do');\n    tasksToDo--;\n}\n```\n\n这将在控制台打印以下内容：\n"
