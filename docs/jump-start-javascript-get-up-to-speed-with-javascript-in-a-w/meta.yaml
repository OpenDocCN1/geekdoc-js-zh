    \ `this` 关键字的指向，我们不需要为第一个参数传值，而是通过传入 `null` 来跳过它。然后我们传入一个包含价格、省税和联邦税值的数组。\n\n\
    ### call 方法\n\n`call` 方法与 `apply` 几乎完全相同，区别在于它不是传递一个参数数组，而是像调用函数本身一样传递参数（从第二个参数开始）：\n\
