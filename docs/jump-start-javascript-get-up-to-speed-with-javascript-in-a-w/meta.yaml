    \ we want to avoid calling that function and evaluating its output!\n\nLet's begin\
    \ by establishing the context. Place the following code within the if statement:\n\
    \n```javascript\nvar context = canvas.getContext(\"2d\");\n```\n\nAs we've checked\
    \ that the `getContext` function exists, we can now actually call it. This function\
    \ takes a single parameter, the context type. Currently, the canvas contexts that\
    \ are available are \"2d\" and \"webgl\". The 2d context is defined as[^7]: \"\
    The 2D context represents a flat Cartesian surface whose origin (0,0) is at the\
    \ top-left corner, with the coordinate space having x values increasing when going\
    \ right, and y values increasing when going down.\"\n\nBasically, it's a flat\
    \ surface that we can use for drawing. It's important to note that the origin\
    \ is the top-left corner, and y values increase when going down. This is different\
    \ from the more familiar Cartesian plane, which has y values increasing when moving\
    \ up. Because our graph has y values increasing when going up in the more traditional\
    \ fashion, we'll need to apply some transformations further on.\n\nNote, also,\
    \ that because of the way the default coordinate system is defined, negative coordinates\
    \ aren't used. They will cause no errors, but they won't display on the screen.\
    \ The other type of context, WebGL[^8], is considered more experimental at this\
    \ point than the 2d context, and is primarily used for rendering 3D graphics without\
    \ the need for third-party plugins. We won't be exploring WebGL in this book.\
    \ You'll notice that, by default, the canvas displays with a light gray fill.\
    \ Let's replace it with a white background to demonstrate some simple concepts:\n\
    \n```javascript\ncontext.fillStyle = '#FFFFFF';\ncontext.fillRect(0, 0, canvas.width,\
    \ canvas.height);\n```\n\nWe're specifying a `fillStyle` of #FFFFFF, which is\
    \ white. The `fillStyle` attribute represents the color or style to use inside\
    \ shapes. Here we are using it to indicate a color; later on, we'll specify a\
    \ gradient.\n\nWe then call the function `fillRect` to fill in a rectangle with\
    \ the expressed color around the specified coordinates. `fillRect` takes four\
    \ parameters: the x coordinate of the upper-left corner, the y coordinate of the\
    \ upper-left corner, the width of the rectangle in pixels, and the height of the\
    \ rectangle in pixels. If you refresh the page, you'll notice that the canvas\
    \ is now completely white. Let's delineate our canvas with a black border:\n\n\
    ```javascript\ncontext.strokeStyle = '#000000';\ncontext.strokeRect(0, 0, canvas.width,\
    \ canvas.height);\n```\n\nThe `strokeStyle` attribute represents the color or\
    \ style to use for the lines around the shapes. Here, we set the `strokeStyle`\
    \ to #000000, which is black, and then draw a line around specified coordinates.\
    \ `strokeStyle` takes the same parameters as `fillRect`. The main difference is\
    \ that it will draw the stated rectangle without actually filling it in with the\
    \ chosen color. You should now have a white canvas surrounded by a black border.\n\
    \n[^7]: http://www.w3.org/html/wg/drafts/2dcontext/html5_canvas/\n[^8]: http://en.wikipedia.org/wiki/WebGL\n\
    \n## Text and the Coordinate System\n\nLet's now draw the text for the y-axis.\
    \ This will help solidify our understanding of the canvas coordinate system. Add\
    \ the following to `todo.js`:\n\n```javascript\nvar textX = 10;\nvar textY = 190;\n\
    \ncontext.fillStyle = '#000000';\ncontext.save();\ncontext.translate(textX, textY);\n\
    context.rotate(Math.PI * -90 / 180);\ncontext.fillText('Tasks Complete', 0, 0);\n\
    context.restore();\n```\n\nOnce again, we set `fillStyle`—this time to black to\
    \ determine the text color. Let's look at `save` and `restore`. We plan to draw\
    \ some vertical text onto the canvas, running along the y-axis, much like one\
    \ would see in a traditional graph. By default, text is rendered horizontally.\
    \ In order for the text to be vertical, we'll need to transform the coordinate\
    \ system. This is where `save` and `restore` come in. `save` will save the current\
    \ state of the context. After we perform our transformation and draw the text\
    \ vertically, we can bring back the state by calling `restore`, so that text by\
    \ default will continue to render horizontally as expected, as shown in Figure\
    \ 8.1.\n\n> ### Saving and Restoring Data Stacks\n\nFor those of you with greater\
    \ familiarity with data structures, it's worth noting that `save` and `restore`\
    \ are implemented using a stack. Thus, it is possible to save multiple states.\
    \ Calling `save` actually pushes the canvas state onto the top of the stack, while\
    \ calling `restore` will \"pop\" the most recently pushed state off the top of\
    \ the stack.\n\nFor those unfamiliar with data structures, it may be helpful to\
    \ use an example from the everyday world: a pancake stack. **save** would be analogous\
    \ to putting another pancake on top of the stack; **restore** would be akin to\
    \ removing a pancake from the top. Just like with a pancake stack, in a computer\
    \ science stack, a single operation will only affect items at the top of the stack.\
    \ Inserting and removing from the middle is possible, but it requires multiple\
    \ steps.\n\nRecall that, by default, the origin of the coordinate system is (0,0).\
    \ We'd prefer to avoid drawing text at (0, 0) because this will place text in\
    \ the corner of our canvas. That's why we use `translate(x, y)`, which will make\
    \ (x, y) the new origin. We are setting (10, 190) to be the starting point for\
    \ drawing text. Because we want our text to be vertical, we call the `rotate`\
    \ function. This function takes a parameter indicating the number of radians by\
    \ which the coordinate system is rotated clockwise. You may recall from high school\
    \ that pi radians are equivalent to 180 degrees. Here we're rotating the canvas\
    \ 90 degrees counterclockwise so that our text will correctly run from bottom\
    \ to top.\n\nFinally, we can render the actual text by calling `fillText`. This\
    \ function takes three parameters. The first parameter is the text to draw, and\
    \ is followed by the x, y coordinates of the text, which we set to (0,0).\n\n\
    You may be wondering if we could have saved some work by just using `context.fillText('Tasks\
    \ Complete', textX, textY)`. We can achieve the same result if we remove `translate`\
    \ and alter `fillText` to:\n\n```javascript\ncontext.fillText('Tasks Complete',\
    \ -190, 10);\n```\n\nHowever, our slightly longer example helps us to avoid negative\
    \ coordinates, and is more intuitive. Note that in the amended example, the y-coordinate\
    \ of (-190) is actually in the spot where the x-coordinate would traditionally\
    \ be, and vice-versa with the x-coordinate. This is because we're working with\
    \ the rotated canvas, so the positions need to be swapped. A bit confusing, isn't\
    \ it? The extra line of code is worth the increased clarity.\n\n## Productivity\
    \ Chart\n\n![Productivity Chart](img/ae490e66f6d11d20689f8bf3d738bef9_166_0.png)\n\
    \n## A Further Rotation Example\n\nLet's take a short break from the main project\
    \ and look at a side example involving shapes. This is a useful exercise because\
    \ shape rotation is visually more instructive and intuitive than text rotation.\
    \ Create a new file named **canvas.html**:\n\n```html\n<!doctype html>\n<html>\n\
    <head>\n    <title>Todo</title>\n</head>\n<body>\n    <canvas id=\"canvas\" height=\"\
    300\" width=\"400\">\n    </canvas>\n```"
  mdcn: "\n> 作为应用程序开发者，两者都可被视为权威来源。只有在想要编写HTML5解析器或类似任务时，微小的差异才会显现出来。\n\n## 最基本的绘图\n\
    \n在进行任何绘图之前，我们需要检查浏览器是否支持canvas对象。延续之前的示例：\n\n```javascript\nif (canvas && canvas.getContext)\
    \ {\n}\n```\n\n这里有一个值得探讨的微妙之处。注意我们使用`canvas.getContext`而非`canvas.getContext()`。区别可以通过以下示例说明：\n\
    \n```javascript\nfunction testFunction() {\n    return 0\n}\n\nif (testFunction())\
    \ {\n    console.log('with parentheses');\n}\n\nif (testFunction) {\n    console.log('no\
    \ parentheses');\n}\n```\n\n只有 'no parentheses' 会被打印出来。第一个if语句会调用函数并评估其返回值，但这并非我们的目标。第二个if语句仅测试函数是否存在；这正是我们想要做的。我们想确保canvas对象拥有getContext函数；我们要避免调用该函数并评估其输出！\n\
    \n让我们从建立上下文开始。将以下代码放入if语句中：\n\n```javascript\nvar context = canvas.getContext(\"\
    2d\");\n```\n\n既然我们已经检查了`getContext`函数是否存在，我们现在可以实际调用它了。该函数接受一个参数，即上下文类型。目前，可用的canvas上下文有\"\
    2d\"和\"webgl\"。2d上下文定义为[^7]：\"2D上下文代表一个平坦的笛卡尔平面，其原点(0,0)位于左上角，坐标空间中的x值向右递增，y值向下递增。\"\
    \n\n基本上，这是一个可用于绘图的平坦表面。需要注意的是原点在左上角，且y值向下递增。这与更熟悉的笛卡尔平面不同，后者的y值向上递增。因为我们的图形采用更传统的y值向上递增方式，所以我们需要在后续应用一些变换。\n\
    \n另外请注意，由于默认坐标系的定义方式，负坐标不会被使用。它们不会导致错误，但不会显示在屏幕上。另一种类型的上下文WebGL[^8]，目前被认为比2d上下文更具实验性，主要用于渲染3D图形而无需第三方插件。我们将在本书中探讨WebGL。你会注意到，默认情况下canvas以浅灰色填充显示。让我们将其替换为白色背景，以演示一些简单的概念：\n\
    \n```javascript\ncontext.fillStyle = '#FFFFFF';\ncontext.fillRect(0, 0, canvas.width,\
    \ canvas.height);\n```\n\n我们指定`fillStyle`为#FFFFFF，即白色。`fillStyle`属性表示形状内部使用的颜色或样式。这里我们用它来指定颜色；稍后我们将指定渐变。\n\
    \n然后我们调用`fillRect`函数，用指定的颜色填充指定坐标周围的矩形。`fillRect`接受四个参数：左上角的x坐标、左上角的y坐标、矩形的像素宽度和矩形的像素高度。如果你刷新页面，你会注意到canvas现在完全变白了。让我们用黑色边框勾勒出canvas：\n\
    \n```javascript\ncontext.strokeStyle = '#000000';\ncontext.strokeRect(0, 0, canvas.width,\
    \ canvas.height);\n```\n\n`strokeStyle`属性表示形状周围线条使用的颜色或样式。这里，我们将`strokeStyle`设置为#000000（黑色），然后围绕指定坐标绘制线条。`strokeStyle`接受与`fillRect`相同的参数。主要区别在于它只会绘制指定的矩形，而不会用选定的颜色实际填充它。你现在应该有一个白色canvas，周围环绕着黑色边框。\n\
    \n[^7]: http://www.w3.org/html/wg/drafts/2dcontext/html5_canvas/\n[^8]: http://en.wikipedia.org/wiki/WebGL\n\
    \n## 文本与坐标系\n\n现在让我们绘制y轴的文本。这将帮助我们巩固对canvas坐标系的理解。将以下内容添加到`todo.js`中：\n\n```javascript\n\
    var textX = 10;\nvar textY = 190;\n\ncontext.fillStyle = '#000000';\ncontext.save();\n\
    context.translate(textX, textY);\ncontext.rotate(Math.PI * -90 / 180);\ncontext.fillText('Tasks\
    \ Complete', 0, 0);\ncontext.restore();\n```\n\n我们再次设置`fillStyle`——这次设为黑色以确定文本颜色。让我们看看`save`和`restore`。我们计划在canvas上绘制一些垂直文本，沿着y轴，就像在传统图表中看到的那样。默认情况下，文本是水平渲染的。为了使文本垂直，我们需要变换坐标系。这就是`save`和`restore`的用武之地。`save`会保存上下文的当前状态。在我们进行变换并垂直绘制文本之后，我们可以通过调用`restore`来恢复状态，这样默认情况下文本将继续如预期那样水平渲染，如图8.1所示。\n\
    \n> ### 保存和恢复数据栈\n\n对于那些更熟悉数据结构的人来说，值得注意的是`save`和`restore`是使用栈实现的。因此，可以保存多个状态。调用`save`实际上是将canvas状态压入栈顶，而调用`restore`会将最近压入的状态从栈顶\"\
    弹出\"。\n\n对于不熟悉数据结构的人来说，使用日常世界的例子可能更有帮助：煎饼栈。**save**类似于将另一个煎饼放在栈顶；**restore**类似于从栈顶移除一个煎饼。就像煎饼栈一样，在计算机科学的栈中，单个操作只会影响栈顶的项目。从中间插入和移除是可能的，但需要多个步骤。\n\
    \n回想一下，默认情况下坐标系的原点是(0,0)。我们最好避免在(0, 0)绘制文本，因为这会将文本放在canvas的角落。这就是为什么我们使用`translate(x,\
    \ y)`，它将(x, y)设为新的原点。我们将(10, 190)设为绘制文本的起点。因为我们希望文本是垂直的，所以我们调用`rotate`函数。该函数接受一个参数，表示坐标系顺时针旋转的弧度数。你可能还记得高中时pi弧度等于180度。这里我们将canvas逆时针旋转90度，这样我们的文本就能正确地从底部向顶部运行。\n\
    \n最后，我们可以通过调用`fillText`来渲染实际的文本。该函数接受三个参数。第一个参数是要绘制的文本，后面是文本的x、y坐标，我们将其设置为(0,0)。\n\
    \n你可能想知道，如果我们只使用`context.fillText('Tasks Complete', textX, textY)`是否可以节省一些工作。如果我们移除`translate`并将`fillText`修改为：\n\
    \n```javascript\ncontext.fillText('Tasks Complete', -190, 10);\n```\n\n我们可以达到相同的效果。\n\
    \n然而，我们这个稍长的示例有助于避免负坐标，并且更直观。注意在修改后的示例中，(-190)的y坐标实际上位于传统上x坐标的位置，而x坐标则相反。这是因为我们正在处理旋转后的canvas，所以位置需要互换。有点令人困惑，不是吗？这额外的代码行值得换取更高的清晰度。\n\
    \n## 生产力图表\n\n![生产力图表](img/ae490e66f6d11d20689f8bf3d738bef9_166_0.png)\n\n## 进一步的旋转示例\n\
    \n让我们从主项目中短暂休息一下，看一个涉及形状的侧面示例。这是一个有用的练习，因为形状旋转在视觉上比文本旋转更具指导性和直观性。创建一个名为**canvas.html**的新文件：\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n    <title>Todo</title>\n</head>\n\
    <body>\n    <canvas id=\"canvas\" height=\"300\" width=\"400\">\n    </canvas>\n\
    ```\n"
