    \ Error`. As to the question of what we do once we throw an error, we'll look\
    \ to the next section.\n\n## try\n\nThe previously mentioned `try` statement assumes\
    \ the following form:\n\n```\ntry {\n  // code which may throw an error\n} catch\
    \ (identifier) {\n  // error handling\n} finally {\n  // clean up code\n}\n```\n\
    \nThe try clause encloses a block of code in which an exception can occur, while\
    \ the catch clause provides the exception handling. The finally clause is optional;\
    \ if present, it always executes and is generally used to perform a clean up.\
    \ Making sure you're using the divideBy function from the previous section, here\
    \ is an example in which no error condition is generated:\n\n```\ntry {\n  var\
    \ result = divideBy(7, 2);\n\n  console.log(result);\n} catch (e) {\n  console.log(e.message);\n\
    } finally {\n  console.log('This will always execute');\n}\n```\n\nNote that the\
    \ code inside the finally clause executes, even though there's no error. Now for\
    \ an example that will throw an error:\n\n```\ntry {\n  divideBy(7, 0);\n  console.log(result);\n\
    } catch (e) {\n  console.log(e.message);\n} finally {\n  console.log('This will\
    \ always execute');\n}\n```\n\nNote that console.log(result); is no longer executed;\
    \ the code jumps straight to the catch clause. At this point, it prints the error\
    \ message and then moves to the finally clause as before.\n\n## An Empirical Study\n\
    \nThere is some vigorous debate in the programming community as to whether certain\
    \ jump statements constitute bad practice. For example, Douglas Crockford, author\
    \ of *JavaScript: The Good Parts*, recommends to “avoid use of the continue statement.\
    \ It tends to obscure the control flow of the function.”\n\nRather than wade into\
    \ the debate, we’ve taken the liberty of conducting an empirical study using jQuery,\
    \ one of the most well-known and popular JavaScript libraries. If your operating\
    \ system supports wget, grep, and wc, you can try it yourself; otherwise, follow\
    \ along with the text. First, download the uncompressed version of the code:\n\
    \n```\nwget http://code.jquery.com/jquery-1.9.1.js\n```\n\nUse a combination of\
    \ grep and word count to see how many times break is used:\n\n```\n> grep 'break;'\
