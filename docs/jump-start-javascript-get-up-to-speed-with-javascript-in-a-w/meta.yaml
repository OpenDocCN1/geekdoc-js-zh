    x != y;    // returns false (refers to same object in memory)

    x != {};   // returns true (not the same object)

    ```


    # Strict Equal (===)


    A strict equal comparison performs no conversion of types. Where "" == 0 would
    return true for a regular equal comparison, "" === 0 would not, since an empty
    string does not equal zero:


    ```

    1 === 1    // returns true


    "1" === 1  // returns false ("1" is not converted)

    1 === true  // returns false

    0 === false // returns false

    "" === 0    // returns false ("" is not converted)

    " " === 0   // returns false (" " is not converted)

    0 === 1    // returns false

    1 === false // returns false

    0 === true  // returns false


    var x, y;  // declare x and y

    x = {};    // create an object and assign it to x

    y = x;     // point y to x

    x === y;   // returns true (refers to same object in memory)

    x === {};  // returns false (not the same object)

    ```


    # Strict Not Equal (!==)


    Same as strict equal except that it works in reverse. It returns true if the values
    are not equal. Again, no conversions are performed prior to comparison:'
