    \n换句话说，每当高度或宽度发生更改时，canvas 就会被重置。我们利用这种惯用的行为，在绘制任何内容之前重置 canvas，以确保任何旧数据都被擦除。\n\
    \n> ### 官方规范\n\n敏锐的读者可能注意到，到目前为止我们引用了两个不同的*官方*规范。历史上，网页超文本应用技术工作组（WHATWG）在万维网联盟（W3C）专注于\
