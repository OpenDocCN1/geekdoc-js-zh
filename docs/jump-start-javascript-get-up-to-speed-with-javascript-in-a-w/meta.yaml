    the DOM''s API. As its name plainly states, you can now query the DOM for elements
    by their `class` values. You can use it directly from the `document` object `document.getElementsByClassName("report")`,
    which will return all elements in the document with the class name `report`. Or,
    you can narrow down your search by using the method from an element: `document.getElementById("financials").getElementsByClassName("report")`.


    # Data Attributes


    Although it was always possible to assign your own attributes to elements in the
    DOM, HTML5 codified the practice by introducing `data-*` attributes. If your application
    requires you to store data specific to an element, you can do it using a `data-*`
    attribute so that the data is stored directly with the element. This is advantageous
    over storing the data in an array/object because it''s unnecessary to synchronize
    the DOM elements to the array/object in order to retrieve the data. Instead, you
    just retrieve the element from the DOM and read the `data-*` attribute''s value
    directly from it.


    A simple scenario where this could be useful is when displaying dates:


    ```

    <span data-iso="1976-05-17T17:11:22">

    ➡DOB: May 17, 1976, 5:11 PM</span>

    ```


    With an arrangement such as this, you can easily read the ISO format of a given
    date/time in the DOM without having to do any lookups in an array or any conversion
    of the human-readable format. Most modern browsers support the `dataset` accessor,
    which allows you to both set and get values from `data-*` attributes. For example,
    here''s how we''d both set and read the value for our `<span>`:


    ```

    var el = document.createElement("span");


    el.appendChild(document.createTextNode

    ➡("DOB: May 17, 1976, 5:11 PM"));

    // setting the value

    el.dataset.iso = "1976-05-17T17:11:22";

    // reading the value

    el.dataset.iso; //returns "1976-05-17T17:11:22"

    ```


    In this example, we create an element and assign a `data-iso` attribute to it.
    We also add its text content to be the human-readable format of the given date.
