  md: "92 Jump Start JavaScript\n\n```\ntry {\n  // code which may throw an error\n\
    } catch (identifier) {\n  // error handling\n} finally {\n  // clean up code\n\
    }\n```\n\nThe try clause encloses a block of code in which an exception can occur,\
    \ while the catch clause provides the exception handling. The finally clause is\
    \ optional; if present, it always executes and is generally used to perform a\
    \ clean up. Making sure you're using the divideBy function from the previous section,\
    \ here is an example in which no error condition is generated:\n\n```\ntry {\n\
    \  var result = divideBy(7, 2);\n\n  console.log(result);\n} catch (e) {\n  console.log(e.message);\n\
    } finally {\n  console.log('This will always execute');\n}\n```\n\nNote that the\
    \ code inside the finally clause executes, even though there's no error. Now for\
    \ an example that will throw an error:\n\n```\ntry {\n  divideBy(7, 0);\n  console.log(result);\n\
    } catch (e) {\n  console.log(e.message);\n} finally {\n  console.log('This will\
    \ always execute');\n}\n```\n\nNote that console.log(result); is no longer executed;\
    \ the code jumps straight to the catch clause. At this point, it prints the error\
    \ message and then moves to the finally clause as before."
