- md: "## Chapter 2\n\nnumber from a string. That way, as a number, we can use comparison\
    \ operators to check the current time against our ranges. Note how we've already\
    \ used the `if...else` syntax to prepare our `hours` and `minutes` values? We\
    \ use it again to compare our time value against values we've set to determine\
    \ when morning, afternoon, evening, and night are. When one of the clauses are\
    \ met, (in the case of our example, when the 1900 falls between 1700 and 2100),\
    \ we set the value of `message` to \"Good evening!\" and then alert the user,\
    \ as seen in Figure 2.2\n\n![Figure 2.2. Logic flow output](img/ae490e66f6d11d20689f8bf3d738bef9_38_0.png)\n\
    \n### Shortening Code With The Ternary Operator\n\nSometimes, if you want to avoid\
    \ having a verbose `if...else` statement in your code, you can shorten it by using\
    \ the ternary operator. Here's the way it's structured: `condition ? expression1\
    \ : expression2`. So we could write the first `if...else` in the previous example\
    \ like this instead:\n\n`hours = (hours < 10) ? \"0\" + hours : hours.toString();`\n\
    \nSometimes, this syntax makes it easier and cleaner to read your code. Sometimes\
    \ it doesn't. Use your judgment and pick the one that's easiest to understand\
    \ what's going on.\n\n### Project\n\nIn order to tie together what we're learning,\
    \ I'm going to walk us through a project that we'll build as we go through this\
    \ book: a task manager. For now, let's populate some variables with tasks:\n\n\
    ```\nvar task1, task2, task3;\n\ntask1 = \"Pay phone bill\";\ntask2 = \"Write\
    \ best-selling novel\";\ntask3 = \"Walk the dog\";\n```\n\n### Summary\n\nIn this\
    \ chapter, we covered variables, data types, operators, and basic control flow.\
    \ These are the building blocks of all JavaScript programs. If any of this material\
    \ is still unclear to you, please go back and read the chapter again. It is absolutely\
    \ critical that you understand how these basics work before moving on to more\
    \ complex topics.\n\n## Chapter 3\n\n## Arrays\n\nWe saw in Chapter 2 how variables\
    \ store different types of data. But in the case of something like a to-do list,\
    \ where you have more than one item to deal with, you're going to need a way to\
    \ store a collection of data. This is where arrays come in.\n\n### Creating an\
    \ Array\n\nYou can create an array in a couple of ways:\n\n```\nvar myArray =\
    \ new Array();\n```\n\nOr:\n\n```\nvar myArray = [];\n```\n\nThe [] notation is\
    \ called an **array literal**, and it represents an empty array. It's less verbose\
    \ and safer to use than the new Array() syntax, because the Array constructor\
    \ can be overwritten and potentially replaced with malicious code; for example,\
    \ a function that masquerades as an array but sends any data you place in it to\
    \ a third-party server on the Internet. Using the array literal, you can easily\
    \ create a new array containing values such as the following:\n\n```\nvar myArray\
    \ = [4, 8, 15, 16, 23, 42];\n```\n\nAn array isn't limited to numbers, though.\
    \ You can also create an array with strings in it:\n\n```\nvar fruit = [\"apple\"\
    , \"orange\", \"pear\", \"grapes\"];\n```\n\nFurthermore, you can mix the types\
    \ of data stored in the array:\n\n```\nvar stuff = [1, \"apple\", undefined, 42,\
    \ \"tanks\", null, []];\n```\n\n### Adding to an Array\n\nThere's no need to pre-populate\
    \ an array with data, though. You can create an empty array and then add data\
    \ to it later in several ways. One way is by index:\n\n```\nvar myArray = [];\n\
    \nmyArray[0] = \"Hello\";\nmyArray[1] = \"World\";\n```\n\nThe contents of this\
    \ array are now: [ \"Hello\", \"World\" ]. By specifying 0 in the square brackets,\
    \ we're telling JavaScript that we want the value stored at index 0. In this example,\
    \ the string \"Hello\" is assigned to the zeroth position. Similarly, the string\
    \ \"World\" is stored at index one. Figure 3.1 shows how this looks.\n\n![Figure\
    \ 3.1](img/ae490e66f6d11d20689f8bf3d738bef9_41_0.png)\n\nSpeaking of indices,\
    \ it's important to remember that array indices are zero-based. This means that\
    \ the first item is stored at position 0, the second at position 1, the third\
    \ at position 2, and so on. It can cause confusion, however, and lead to one-off\
    \ errors. For example, you might ask for the item at index one and expect the\
    \ first array element, but, in reality, you'd be accessing the second element.\n\
    \nIt's also possible to use named indices:\n\n```\nvar myArray = [];\n\nmyArray[\"\
    fruit\"] = \"apple\";\nmyArray[\"vehicle\"] = \"tank\";\n```\n\nThis creates an\
    \ **associative array** where items are stored by a named index rather than a\
    \ numbered index. However, we'd discourage the use of associative arrays. The\
    \ preferred way to store data with named indices is by using objects, which we'll\
    \ discuss in the next chapter.\n\nAs mentioned earlier, there are a couple of\
    \ ways to add data to an array. The second approach is to use the push method.\
    \ This is useful in situations where you want to add items to the end of an array,\
    \ but want to avoid calculating the index required to access the final position.\
    \ Instead, you can do this:\n\n```\nmyArray.push(\"hello\");\n```\n\nBy using\
    \ **push**, you simply add a new item to the existing array. If it's an empty\
    \ array, the data is written to position 0. If there are ten items in the array,\
    \ the data is written to position 10 (remember, indices are zero-based).\n\n###\
    \ Reading from an Array\n\nReading from an array is fairly straightforward. All\
    \ you need to do is point to the item you want by its index number and the array\
    \ will return it to you, like so:\n\n```\nvar myValue,\n    myArray = [\"Hello\"\
    , \"World\", \"I\", \"am\", \"an\", \"array\"];\n\nmyValue = myArray[4]; // returns\
    \ \"an\"\n```\n\nHere we have an array containing six items. Since arrays are\
    \ zero-indexed, the word \"Hello\" resides at position 0, \"World\" is at 1, \"\
    I\" is at 2, and so on. By passing the index 4 to myArray, we're requesting the\
    \ fifth item in the array, which is the word \"an\".\n\n### Nested Arrays\n\n\
    Sometimes, you'll need to store an array within an array. Sometimes, you'll require\
    \ even more nesting. A quick warning: although it's possible to nest a number\
    \ of arrays, we'd advise against it, as working with many array indices can be\
    \ confusing to work with.\n\nLet's start with two simple arrays, which we'll call\
    \ them yusuf and dreamers. We'll fill dreamers with some values:\n\n```\nvar yusuf,\
    \ dreamers;\n\nyusuf = [];\ndreamers = [\"cobb\", \"arthur\", \"ariadne\", \"\
    saito\", \"fischer\"];\n```\n\nNow, reading any of the values from the dreamers\
    \ array is as simple as passing in an index, which means placing the index value\
    \ between a set of square brackets placed next to the array name. So, if I wanted\
    \ \"cobb\", I'd pass in an index of 0:\n\n```\nvar dreamer = dreamers[0]; // returns\
    \ \"cobb\"\n```\n\nBut what if dreamers wasn't a named array but merely defined\
    \ inline:\n\n```\nvar yusuf;\n\nyusuf = [[\"cobb\", \"arthur\", \"ariadne\", \"\
    saito\", \"fischer\"]];\n```\n\nHow would we now get to \"cobb\"? By using: yusuf[0][0].\
    \ In the first square brackets, you define the index of the first array you want\
    \ to read from; in the second set, you define the second index. So, reading \"\
    arthur\" would be yusuf[0][1], \"ariadne\" would be yusuf[0][2], and so on.\n\n\
    Let's take it a bit further:\n\n```\nvar reality = [\"yusuf\", [\"arthur\", [\"\
    eames\", [\"cobb\", \"ariadne\", \"saito\", \"fischer\"]]]];\n```\n\nHere, we\
    \ have an outer array called `reality`. It contains the string \"yusuf\" and a\
    \ nested array. The nested array contains the string \"arthur\" and another nested\
    \ array, and so on. Reading values from this nested set would be as follows:\n\
    \n```\nreality[0];              // returns \"yusuf\"\nreality[1][0];         \
    \   // returns \"arthur\"\nreality[1][1][0];         // returns \"eames\"\nreality[1][1][1][0];\
    \      // returns \"cobb\"\nreality[1][1][1][1];      // returns \"ariadne\"\n\
    reality[1][1][1][2];      // returns \"saito\"\nreality[1][1][1][3];      // returns\
    \ \"fischer\"\n```\n\nAs you can see, keeping track of matters can become complicated,\
    \ especially when each array contains several items—several of which are arrays\
    \ themselves.\n\n### What can you do with arrays?\n\nNow that we've covered the\
    \ basics of an array and how data is stored in them, let's look at what you can\
    \ do with them. There are seven mutator methods that let you modify the contents\
    \ of the array: `pop`, `push`, `reverse`, `shift`, `sort`, `splice`, and `unshift`.\
    \ There are also four widely supported accessor methods that don't modify the\
    \ array but allow you to access its contents in different ways: `concat`, `join`,\
    \ `slice`, and `toString`.\n\nSince JavaScript support varies from browser to\
    \ browser and from browser version to browser version, there are varying degrees\
    \ of support to contend with. For example, browsers implementing JavaScript 1.6\
    \ and higher also support the `indexOf` and `lastIndexOf` accessor methods. They'll\
    \ also support the following iteration methods: `forEach`, `every`, `some`, `filter`,\
    \ and `map`. Finally, browsers supporting JavaScript 1.8 or higher will also support\
    \ the `reduce` and `reduceRight` iteration methods.\n\nIt used to be that browser\
    \ makers released a new version of their product once every few months or even\
    \ years. Nowadays, though, they're doing it much faster—at least Google and Mozilla\
    \ are with Chrome and Firefox. To give you an"
  mdcn: "\n## 第2章\n\n从字符串中提取数字。这样一来，作为数字，我们就能使用比较运算符来检查当前时间是否在我们的范围内。注意我们是如何使用`if...else`语法来准备`hours`和`minutes`值的？我们再次使用它来将我们的时间值与设定的值进行比较，以确定早晨、下午、晚上和夜晚的时间。当满足其中一个条件时（在我们的示例中，当1900介于1700和2100之间时），我们将`message`的值设置为\"\
    Good evening!\"，然后向用户发出警报，如图2.2所示。\n\n![图2.2. 逻辑流程输出](img/ae490e66f6d11d20689f8bf3d738bef9_38_0.png)\n\
    \n### 使用三元运算符简化代码\n\n有时，如果你想避免在代码中使用冗长的`if...else`语句，可以通过使用三元运算符来简化它。其结构如下：`条件\
    \ ? 表达式1 : 表达式2`。因此，我们可以这样重写前面示例中的第一个`if...else`：\n\n`hours = (hours < 10) ? \"\
    0\" + hours : hours.toString();`\n\n有时，这种语法使代码更易于阅读和整洁。有时则不然。请根据你的判断选择最容易理解的一种。\n\
    \n### 项目\n\n为了将我们所学的内容整合起来，我将引导大家完成一个我们在本书中将逐步构建的项目：一个任务管理器。目前，让我们用一些任务来填充变量：\n\
    \n```\nvar task1, task2, task3;\n\ntask1 = \"Pay phone bill\";\ntask2 = \"Write\
    \ best-selling novel\";\ntask3 = \"Walk the dog\";\n```\n\n### 总结\n\n在本章中，我们涵盖了变量、数据类型、运算符和基本控制流。这些是所有JavaScript程序的构建块。如果这些内容中仍有不清楚的地方，请返回本章重新阅读。在进入更复杂的主题之前，理解这些基础知识的工作原理至关重要。\n\
    \n## 第3章\n\n## 数组\n\n我们在第2章中看到了变量如何存储不同类型的数据。但在处理像待办事项列表这样需要处理多个项目的情况时，你需要一种存储数据集合的方法。这就是数组的用武之地。\n\
    \n### 创建数组\n\n你可以通过几种方式创建数组：\n\n```\nvar myArray = new Array();\n```\n\n或者：\n\n\
    ```\nvar myArray = [];\n```\n\n`[]`符号称为**数组字面量**，它表示一个空数组。与`new Array()`语法相比，它更简洁且更安全，因为`Array`构造函数可能被覆盖并被恶意代码替换；例如，一个伪装成数组的函数，但会将你放入其中的任何数据发送到互联网上的第三方服务器。使用数组字面量，你可以轻松创建一个包含以下值的新数组：\n\
    \n```\nvar myArray = [4, 8, 15, 16, 23, 42];\n```\n\n然而，数组不限于数字。你也可以创建包含字符串的数组：\n\
    \n```\nvar fruit = [\"apple\", \"orange\", \"pear\", \"grapes\"];\n```\n\n此外，你还可以混合存储在数组中的数据类型：\n\
    \n```\nvar stuff = [1, \"apple\", undefined, 42, \"tanks\", null, []];\n```\n\n\
    ### 向数组添加数据\n\n不过，没有必要预先填充数组数据。你可以创建一个空数组，然后通过几种方式稍后添加数据。一种是通过索引：\n\n```\nvar\
    \ myArray = [];\n\nmyArray[0] = \"Hello\";\nmyArray[1] = \"World\";\n```\n\n现在这个数组的内容是：[\
    \ \"Hello\", \"World\" ]。通过在方括号中指定0，我们告诉JavaScript我们想要存储在索引0处的值。在这个示例中，字符串\"Hello\"\
    被赋值给第零个位置。类似地，字符串\"World\"存储在索引1处。图3.1展示了这一点。\n\n![图3.1](img/ae490e66f6d11d20689f8bf3d738bef9_41_0.png)\n\
    \n说到索引，重要的是要记住数组索引是从零开始的。这意味着第一个项目存储在位置0，第二个在位置1，第三个在位置2，依此类推。然而，这可能会引起混淆并导致差一错误。例如，你可能请求索引为1的项目并期望是第一个数组元素，但实际上，你访问的是第二个元素。\n\
    \n也可以使用命名索引：\n\n```\nvar myArray = [];\n\nmyArray[\"fruit\"] = \"apple\";\nmyArray[\"\
    vehicle\"] = \"tank\";\n```\n\n这创建了一个**关联数组**，其中项目通过命名索引而非数字索引存储。然而，我们不鼓励使用关联数组。使用命名索引存储数据的首选方式是使用对象，我们将在下一章讨论。\n\
    \n如前所述，有几种方法可以向数组添加数据。第二种方法是使用push方法。当你想向数组末尾添加项目，但又想避免计算访问最终位置所需的索引时，这很有用。你可以这样做：\n\
