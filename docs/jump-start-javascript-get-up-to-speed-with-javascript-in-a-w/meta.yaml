  md: '```

    context.strokeStyle = ''#000000'';

    context.strokeRect(0, 0, canvas.width, canvas.height);

    ```


    The `strokeStyle` attribute represents the color or style to use for the lines
    around the shapes. Here, we set the `strokeStyle` to #000000, which is black,
    and then draw a line around specified coordinates. `strokeStyle` takes the same
    parameters as `fillRect`. The main difference is that it will draw the stated
    rectangle without actually filling it in with the chosen color. You should now
    have a white canvas surrounded by a black border.


    # Text and the Coordinate System


    Let’s now draw the text for the y-axis. This will help solidify our understanding
    of the canvas coordinate system. Add the following to `todo.js`:


    ```

    var textX = 10;

    var textY = 190;


    context.fillStyle = ''#000000'';

    context.save();

    context.translate(textX, textY);

    context.rotate(Math.PI * -90 / 180);

    context.fillText(''Tasks Complete'', 0, 0);

    context.restore();

    ```


    Once again, we set `fillStyle`—this time to black to determine the text color.
    Let’s look at `save` and `restore`. We plan to draw some vertical text onto the
    canvas, running along the y-axis, much like one would see in a traditional graph.
    By default, text is rendered horizontally. In order for the text to be vertical,
    we’ll need to transform the coordinate system. This is where `save` and `restore`
    come in. `save` will save the current state of the context. After we perform our
    transformation and draw the text vertically, we can bring back the state by calling
    `restore`, so that text by default will continue to render horizontally as expected,
    as shown in Figure 8.1.


    > ### Saving and Restoring Data Stacks


    For those of you with greater familiarity with data structures, it’s worth noting
    that `save` and `restore` are implemented using a stack. Thus, it is possible
    to save multiple states. Calling `save` actually pushes the canvas state onto
    the top'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'of the stack, while calling `restore` will "pop" the most recently pushed state
    off the top of the stack.


    For those unfamiliar with data structures, it may be helpful to use an example
    from the everyday world: a pancake stack. **save** would be analogous to putting
    another pancake on top of the stack; **restore** would be akin to removing a pancake
    from the top. Just like with a pancake stack, in a computer science stack, a single
    operation will only affect items at the top of the stack. Inserting and removing
    from the middle is possible, but it requires multiple steps.


    Recall that, by default, the origin of the coordinate system is (0,0). We''d prefer
    to avoid drawing text at (0, 0) because this will place text in the corner of
    our canvas. That''s why we use `translate(x, y)`, which will make (x, y) the new
    origin. We are setting (10, 190) to be the starting point for drawing text. Because
    we want our text to be vertical, we call the `rotate` function. This function
    takes a parameter indicating the number of radians by which the coordinate system
    is rotated clockwise. You may recall from high school that pi radians are equivalent
    to 180 degrees. Here we''re rotating the canvas 90 degrees counterclockwise so
    that our text will correctly run from bottom to top.


    Finally, we can render the actual text by calling `fillText`. This function takes
    three parameters. The first parameter is the text to draw, and is followed by
    the x, y coordinates of the text, which we set to (0,0).


    You may be wondering if we could have saved some work by just using `context.fillText(''Tasks
    Complete'', textX, textY)`. We can achieve the same result if we remove `translate`
    and alter `fillText` to:


    ```

    context.fillText(''Tasks Complete'', -190, 10);

    ```


    However, our slightly longer example helps us to avoid negative coordinates, and
    is more intuitive. Note that in the amended example, the y-coordinate of (-190)
    is actually in the spot where the x-coordinate would traditionally be, and vice-versa
    with the x-coordinate. This is because we''re working with the rotated canvas,
    so the positions need to be swapped. A bit confusing, isn''t it? The extra line
    of code is worth the increased clarity.'
