  md: '# # Chapter 2


    # ## Variables


    Programming is basically the manipulation of data. In order to manipulate it,
    though, we first need to store it somewhere. In JavaScript, variables are the
    most basic form of data storage. Just like in algebra, variables are representatives
    of information we want to work with. Unlike algebra, though, there''s no restriction
    to only using letters. We can use whole words to more accurately describe what
    we''re dealing with like `name`, `tax`, `length`, or `width`. We can also use
    multiple words combined together like `firstName`, `taskList`, or `timeToLive`.
    Notice that the first word in each multi-word variable name is all lowercase,
    while the first letter of each subsequent word is capitalized. This is known as
    **camel casing**, and it is the naming convention used in the JavaScript community.


    # ## First, a Quick Comment


    You''ll be seeing a lot of comments throughout the code examples in this book,
    so it''s best to explain what they are here. **Comments** are bits of nonexecuting
    text that can be inserted into code to describe what''s going on. In JavaScript,
    comments come in two forms, single-line comments and multiline comments. Single-line
    comments are indicated by two forward slashes (`//`). Anything that follows the
    double slashes of a single-line comment is considered nonexecuting text, but only
    until the end of'
  merge: -1
  pgno: 24
- img_proc: true
  md: "that line. On the other hand, multiline (or block) comments can span multiple\
    \ lines. Multiline comments begin with a slash star combination (/*) and continue\
    \ until a star slash (*/) combination is encountered.\n\nHere are some examples\
    \ of single-line comments:\n\n```\n// I'm about to declare a variable and give\
    \ it a value\nvar myVariable = \"Hello, world.\"; // Just did it!\n```\n\nAnd\
    \ here's a multiline comment:\n\n```\n/* I just declared a variable named myVariable\
    \ and assigned\n   the value \"Hello, world.\" to it. I preceded it with a\n \
    \  comment stating that I was about to do just that, and then\n   followed it\
    \ with another comment on the same line stating\n   that I just did it. I'm now\
    \ writing a really long comment\n   that needs more than one line, so I've made\
    \ this one a\n   multiline comment.\n*/\n```\n\n# Declarations\n\nDeclaring a\
    \ variable is simple enough:\n\n```\nvar task = \"Write the first chapter.\";\n\
    ```\n\nHere, we've declared a variable named `task` using a variable declaration\
    \ statement. Using the `var` keyword, you can declare one or more variables and\
    \ optionally initialize them with a value. So, for example:\n\n```\nvar task =\
    \ \"Write the first chapter.\",\n    complete = true;\n```\n\nWe've declared two\
    \ variables (separated by a comma), and assigned a string to the first and a Boolean\
    \ value to the second (there's more on variable types, such as string and Boolean,\
    \ shortly). Note how we're only using one declaration statement to declare and\
    \ initialize both variables. You can also use multiple declaration statements—one\
    \ for each variable declaration."
