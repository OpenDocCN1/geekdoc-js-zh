- md: "## Summary\n\nIn this chapter, we took a look at the DOM—a hierarchical representation\
    \ of the HTML document loaded into the browser. We saw how we can access its contents,\
    \ as well as create new content to insert into it. We also saw how it’s possible\
    \ to manipulate the DOM’s existing content and styles. The DOM’s API is powerful\
    \ and versatile, and harnessing it will allow any programmer the ability to build\
    \ outstanding client-side applications.\n\n## Chapter 7\n\n### Events\n\nThis\
    \ chapter is about JavaScript events. In order to provide interactivity, your\
    \ application must be capable of processing input from the user. Due to the evolving\
    \ nature of technology, the definition of what constitutes an event is a constant\
    \ state of flux. JavaScript came into existence in 1995. In those days people\
    \ interacted with web pages almost exclusively using a keyboard and mouse. JavaScript\
    \ events primarily consisted of plain vanilla human computer interactions such\
    \ as: keypress, mousedown, mouseup, click, scroll and load.\n\nWith the proliferation\
    \ of smartphones, tablets and similar devices the number of events has increased\
    \ dramatically. Nowadays aside from the basic keyboard and mouse events, APIs\
    \ are available to detect orientation, zooming, and even humidity! This is functionality\
    \ that did not exist just a few short years ago.\n\nRather than trying to cover\
    \ the entire API with a broad sweeping brush, it would be more instructive to\
    \ begin with a specific use case to illustrate some general ideas and concepts.\
    \ Suppose you want to display an alert when a user clicks a button on a page.\
    \ To process this event, it is necessary to answer a number of questions:\n\n\
    - **What was the action?** In this case it was a mouse click.\n- **What part of\
    \ the page received the action?** In this case it was a button.\n- **How do we\
    \ wish to handle the action?** Here we display an alert.\n- **How do we specify\
    \ a function to handle the action?** To answer this question, we need a way to\
    \ simultaneously answer all of the previous questions.\n\nWhile the above questions\
    \ are somewhat of a simplification, they largely explain the JavaScript event\
    \ model. Each step has its own formal description and definitions. Let’s now look\
    \ at each step of the process in detail.\n\n### DOM Events\n\nTo answer the question\
    \ of “What was the action?”, we turn to DOM events. There is no central authoritative\
    \ specification available to define exactly what does and does not constitute\
    \ an event. However, the Mozilla Developer Network provides a list of events[^1].\n\
    \nThis is not actually a specification. Rather it is an amalgamation of a number\
    \ of different specifications and provides a list of events along with a reference\
    \ to the actual specification from which an event is derived. You will see that\
    \ most of the events come from DOM Level 3 or HTML5. These APIs cover some of\
    \ the more common cross platform interactions such as keystrokes, mouse clicks,\
    \ dragging, media and offline behavior. However there are also some more obscure\
    \ events such as chargingchange which comes from the Battery Status API.\n\nNot\
    \ all events are universally supported across devices and browsers. For example,\
    \ the Battery Status API is not supported in older versions of Internet Explorer.\
    \ Additionally, while it may exist in desktop browsers, it is really only relevant\
    \ in mobile devices such as laptops, tablets and smartphones. We will be covering\
    \ the main concepts and common use cases of events in this chapter. Once you have\
    \ grasped the basics, you should be able to use the above reference to implement\
    \ some of the more esoteric functionality if this is what your application requires.\n\
    \n[^1]: https://developer.mozilla.org/en-US/docs/DOM/Mozilla_event_reference\n\
    \nWe have included some common events in Appendix A. Browsing through the list,\
    \ you will notice that the `click` event is part of the DOM Level 3, and is fairly\
    \ unambiguously described as \"A pointing device button has been pressed and released\
    \ on an element.\" You'll also notice that most other common events are DOM Level\
    \ 3. Some of these events include `dblclick`, `mousedown`, `mouseup`, `keydown`,\
    \ `keyup` and `keypress`.\n\n### Event Propagation\n\nBefore turning to the question\
    \ of “What part of the page received the action?”, it is necessary to provide\
    \ a brief overview of how events propagate through a page. Suppose you have a\
    \ table and within that table you have an anchor tag. Both the table and the anchor\
    \ tag have code to handle mouse clicks. When the user clicks on the anchor tag,\
    \ which HTML element should process the event first? Should it be the table then\
    \ the anchor tag or vice versa? To answer this question we have to briefly explore\
    \ the mechanics of event propagation.\n\nIn the early days, different browsers\
    \ had different event handling orders. Some would process the event by firing\
    \ on the parent and then the child element, while others would do the opposite.\
    \ In recent times, the W3C has begun to standardize event propagation in its DOM\
    \ Level 3 document. The way an event travels through a document is captured diagrammatically\
    \ as part of the DOM Level 3 Events Specification in Figure 7.1.\n\n![Figure 7.1.\
    \ How DOM events travel through a document](img/ae490e66f6d11d20689f8bf3d738bef9_139_0.png)\n\
    \nFormally, the event path is broken into three phases. In the capture phase,\
    \ the event starts at the top of the DOM tree, and propagates through to the parent\
    \ of the target. In the target phase the event object arrives at its target. This\
    \ is generally where you will write your event handling code. In the bubble phase,\
    \ the event will move back up through the tree until it reaches the top. Bubble\
    \ phase propagation happens in reverse order compared to the capture phase, with\
    \ an event starting at the parent of the target and ending back up at the top\
    \ of the DOM tree. These days, there's a choice to register an event in either\
    \ the capture phase or the bubble phase. If you register an event in the capture\
    \ phase then the parent element will process the event before the child element.\
    \ In the above example the table would process the event before the anchor. The\
    \ opposite order will apply if bubbling is specified, in which case the child\
    \ element will process the event before the parent. In our example, the anchor\
    \ would receive the event before the table.\n\nNote that specifying bubbling or\
    \ capturing is optional and is something that often does not even need to be considered.\
    \ A conventional design would have each user action processed by only a single\
    \ element. Only in unusual circumstances would a single action need to be processed\
    \ by multiple elements concurrently. We include a brief discussion here because\
    \ many of the event APIs make reference to capturing and bubbling, and it will\
    \ be handy to understand what these terms mean. With some of the formal definitions\
    \ out of the way we can now turn to making our pages actually respond to events!\n\
    \n### Event Handlers\n\nNormally you will want specific elements on your page\
    \ to handle specific events. To indicate that a particular element on the page\
    \ should process a particular event you need to register an event handler on that\
    \ element. There are three ways to register event handlers. To prepare us for\
    \ the following sections create a new file named events.html containing the following\
    \ HTML:\n\n```html\n<!doctype html>\n<html>\n<head>\n    <title>Events</title>\n\
    </head>\n<body>\n    <button>Click Me!</button>\n</body>\n</html>\n```\n\nThis\
    \ is a bare bones page with a single button that we will use to process events.\n\
    \n### HTML Attribute\n\nIt is possible to place JavaScript inline with your HTML.\
    \ In the early days of JavaScript this was the standard way of processing events.\
    \ As an example, modify your `<button>` tag as follows:\n\n```html\n<button onclick=\"\
    alert('Old style event handling')\">\n    Click Me!</button>\n```\n\nNow when\
    \ you click on the button, you should see an alert similar to Figure 7.2.\n\n\
    ![Figure 7.2. Inline JavaScript event handling](img/ae490e66f6d11d20689f8bf3d738bef9_141_0.png)\n\
    \nThis method is not recommended. HTML should primarily be used as a presentation\
    \ layer. JavaScript events are portions of business logic which make up the behavior\
    \ layer. JavaScript code should not be mixed in with the presentation layer. Separating\
    \ these two areas of your code will lead to greater maintainability. If a JavaScript\
    \ programmer is updating code there should be no chance that he or she can accidentally\
    \ introduce bugs into the presentation layer. Similarly if an interface designer\
    \ is updating a page there should be no chance that he or she can accidentally\
    \ modify the behavior layer. By keeping JavaScript completely separate from HTML\
    \ it means that the two sections of your application can be developed independently.\n\
    \n### addEventListener\n\nThe preferred way of handling events is by registering\
    \ a handler via the function `addEventListener`. A handler can be thought of as\
    \ a function that will process a particular event. `addEventListener` will register\
    \ a single event handler on a target. Multiple event handlers can be added by\
    \ calling this function multiple times. This function takes three parameters:\n\
    \n**type** The event type we are listening for. In the case of a mouse click,\
    \ it will be `click`.\n\n**listener** The listener, or handler, is the function\
    \ that processes the event. In this case it will be our custom function that displays\
    \ the alert."
  mdcn: "\n## 总结\n\n在本章中，我们了解了DOM——即加载到浏览器中的HTML文档的层级表示。我们学习了如何访问其内容，以及如何创建新内容并插入其中。我们还了解了如何操作DOM现有内容和样式。DOM的API功能强大且用途广泛，掌握它将使任何程序员都能构建出色的客户端应用程序。\n\
    \n## 第7章\n\n### 事件\n\n本章是关于JavaScript事件的。为了提供交互性，你的应用程序必须能够处理来自用户的输入。由于技术的不断演进，构成事件的定义始终处于变化之中。JavaScript诞生于1995年。在那个年代，人们几乎完全通过键盘和鼠标与网页进行交互。JavaScript事件主要包括传统的人机交互，例如：按键、鼠标按下、鼠标释放、点击、滚动和加载。\n\
    \n随着智能手机、平板电脑及类似设备的普及，事件的数量急剧增加。如今，除了基本的键盘和鼠标事件外，还有API可用于检测方向、缩放，甚至湿度！这些都是几年前还不存在的功能。\n\
    \n与其试图用宽泛的笔触覆盖整个API，不如从一个特定的用例入手来阐述一些通用的理念和概念，这样更具指导意义。假设你想在用户点击页面上的按钮时显示一个警报。要处理这个事件，需要回答一系列问题：\n\
    \n- **动作是什么？** 在本例中，是一个鼠标点击。\n- **页面的哪一部分接收了动作？** 在本例中，是一个按钮。\n- **我们希望如何处理该动作？**\
    \ 这里我们显示一个警报。\n- **我们如何指定一个函数来处理该动作？** 为了回答这个问题，我们需要一种方法来同时回答前面所有的问题。\n\n虽然上述问题有些简化，但它们在很大程度上解释了JavaScript的事件模型。每个步骤都有其正式的描述和定义。现在让我们详细看一下这个过程的每个步骤。\n\
    \n### DOM事件\n\n为了回答“动作是什么？”这个问题，我们转向DOM事件。目前没有一个中央权威规范来确切定义什么构成事件以及什么不构成事件。然而，Mozilla开发者网络提供了一个事件列表[^1]。\n\
    \n这实际上并非一个规范。它更像是一些不同规范的汇编，提供了一个事件列表，并附有事件所源自的实际规范的参考。你会看到大多数事件来自DOM Level 3或HTML5。这些API涵盖了一些更常见的跨平台交互，如键盘敲击、鼠标点击、拖拽、媒体和离线行为。但也有一些更冷门的事件，例如来自电池状态API的`chargingchange`。\n\
    \n并非所有事件在所有设备和浏览器上都普遍支持。例如，电池状态API在旧版本的Internet Explorer中不受支持。此外，即使它存在于桌面浏览器中，它实际上只与移动设备（如笔记本电脑、平板电脑和智能手机）相关。在本章中，我们将涵盖事件的主要概念和常见用例。一旦你掌握了基础，你应该能够使用上述参考来实现一些更专业的功能（如果这是你的应用程序所需的）。\n\
    \n[^1]: https://developer.mozilla.org/en-US/docs/DOM/Mozilla_event_reference\n\
    \n我们在附录A中列出了一些常见事件。浏览列表时，你会注意到`click`事件是DOM Level 3的一部分，其描述相当明确：“在元素上按下并释放了定点设备按钮。”你还会注意到大多数其他常见事件也属于DOM\
    \ Level 3。这些事件包括`dblclick`、`mousedown`、`mouseup`、`keydown`、`keyup`和`keypress`。\n\
    \n### 事件传播\n\n在转向“页面的哪一部分接收了动作？”这个问题之前，有必要简要概述一下事件如何在页面中传播。假设你有一个表格，表格中有一个锚点标签。表格和锚点标签都有处理鼠标点击的代码。当用户点击锚点标签时，应该由哪个HTML元素首先处理事件？是应该先表格后锚点标签，还是相反？要回答这个问题，我们必须简要探讨事件传播的机制。\n\
    \n早期，不同的浏览器有不同的事件处理顺序。有些会先在父元素上触发事件，然后才是子元素，而另一些则相反。近年来，W3C在其DOM Level 3文档中开始标准化事件传播。事件在文档中的传播路径以图示方式记录在DOM\
    \ Level 3事件规范中的图7.1中。\n\n![图7.1. DOM事件如何在文档中传播](img/ae490e66f6d11d20689f8bf3d738bef9_139_0.png)\n\
    \n正式来说，事件路径分为三个阶段。在捕获阶段，事件从DOM树的顶部开始，传播到目标的父级。在目标阶段，事件对象到达其目标。这通常是你编写事件处理代码的地方。在冒泡阶段，事件将沿树向上移动，直到到达顶部。冒泡阶段的传播顺序与捕获阶段相反，事件从目标的父级开始，最终回到DOM树的顶部。如今，可以选择在捕获阶段或冒泡阶段注册事件。如果你在捕获阶段注册事件，那么父元素会在子元素之前处理事件。在上面的例子中，表格会在锚点之前处理事件。如果指定了冒泡，顺序则相反，子元素会在父元素之前处理事件。在我们的例子中，锚点会先于表格接收到事件。\n\
    \n请注意，指定冒泡或捕获是可选的，通常甚至不需要考虑。常规的设计是每个用户操作只由一个元素处理。只有在特殊情况下，一个操作才需要由多个元素同时处理。我们在此简要讨论是因为许多事件API都引用了捕获和冒泡，理解这些术语的含义会很方便。在了解了一些正式定义之后，我们现在可以开始让我们的页面实际响应事件了！\n\
    \n### 事件处理器\n\n通常，你希望页面上的特定元素处理特定事件。要指示页面上的特定元素处理特定事件，你需要在该元素上注册一个事件处理器。有三种注册事件处理器的方法。为了准备接下来的章节，请创建一个名为`events.html`的新文件，包含以下HTML：\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n    <title>Events</title>\n</head>\n\
    <body>\n    <button>Click Me!</button>\n</body>\n</html>\n```\n\n这是一个只有单个按钮的简单页面，我们将用它来处理事件。\n\
    \n### HTML属性\n\n可以在HTML中内联放置JavaScript。在JavaScript的早期，这是处理事件的标准方式。例如，将你的`<button>`标签修改如下：\n\
    \n```html\n<button onclick=\"alert('Old style event handling')\">\n    Click Me!</button>\n\
    ```\n\n现在当你点击按钮时，你应该会看到一个类似图7.2的警报。\n\n![图7.2. 内联JavaScript事件处理](img/ae490e66f6d11d20689f8bf3d738bef9_141_0.png)\n\
    \n不推荐使用此方法。HTML应主要用作表现层。JavaScript事件是构成行为层的业务逻辑部分。JavaScript代码不应与表现层混合在一起。将代码的这两个领域分开将提高可维护性。如果JavaScript程序员正在更新代码，他或她不应该有机会意外地在表现层引入错误。同样，如果界面设计师正在更新页面，他或她也不应该有机会意外地修改行为层。通过将JavaScript与HTML完全分开，意味着你应用程序的这两个部分可以独立开发。\n\
    \n### addEventListener\n\n处理事件的首选方法是通过函数`addEventListener`注册处理器。处理器可以看作是处理特定事件的函数。`addEventListener`将在目标上注册单个事件处理器。可以通过多次调用此函数来添加多个事件处理器。此函数接受三个参数：\n\
    \n**type** 我们正在监听的事件类型。在鼠标点击的情况下，它是`click`。\n\n**listener** 监听器或处理器，是处理事件的函数。在本例中，它将是显示警报的自定义函数。\n"
