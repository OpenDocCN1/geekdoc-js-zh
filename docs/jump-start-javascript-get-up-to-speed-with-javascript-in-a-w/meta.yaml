    # slice


    slice will copy a part of an array and return it. Rather than modify the original
    array, it just makes a shallow copy. You tell it where to start and, optionally,
    where to end copying. So `arr.slice(2)` will return a copy of `arr` starting at
    index 2 and going all the way to the end of the array. Conversely, `arr.slice(-2)`
    will start at the end and give you the last two items. `arr.slice(2, 4)` will
    make a copy of `arr` from index 2 to index 4.


    > Did you see we said that **slice** makes a *shallow* copy. For example, if your
    array contains an array as one of its items, it will be copied by reference. In
    other words, if the original array changes, so will the copy.


    Let''s create a task list that has a child list of cleaning-related items, then
    copy it and slice it up into smaller lists:'
