  md: "102 Jump Start JavaScript\n\nIn 1997, the World Wide Web Consortium (W3C) standardized\
    \ the DOM with the release of DOM Level 1, or DOM1.² It would continue this process\
    \ through DOM2, DOM3, and most recently DOM4, which we’ll cover in more detail\
    \ later. Once the W3C introduced DOM1, all previous incarnations of the DOM became\
    \ referred to as the Legacy DOM, DOM Level 0, or DOM0.³\n\n# The Need for Backward\
    \ Compatibility\n\nThe web is a strange animal, unlike any other software. Though\
    \ browsers continue to evolve, the pages that they interpret can date from as\
    \ far back as 1991. This means that any innovation or iteration on existing browser\
    \ technology must continue to work with older web pages. It’s because of this\
    \ phenomenon that the DOM as we know it today contains artifacts from the “bad\
    \ old days.”\n\n# The document Object\n\nThe document object is a top-level object\
    \ encompassing (and acting as an entry point into) your document. All the objects,\
    \ methods, and properties that you’ll need to work with your document hang off\
    \ the document object. For example, one of the most common methods in use today\
    \ is getElementById, which returns an element in the DOM by its id attribute:\n\
    \n```\ngetElementById.html (excerpt)\n<!doctype html>\n<html>\n<head>\n</head>\n\
    <body>\n    <div id=\"foo\">Foo, baby. Foo!</div>\n    <div id=\"bar\">Meh.</div>\n\
    \    <script>\n        // returns a reference to the first div\n        var el\
    \ = document.getElementById(\"foo\");\n    </script>\n</body>\n</html>\n```"
  merge: -1
