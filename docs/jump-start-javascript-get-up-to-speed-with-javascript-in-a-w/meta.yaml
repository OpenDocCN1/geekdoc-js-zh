    # Chapter 7


    # Events


    This chapter is about JavaScript events. In order to provide interactivity, your
    application must be capable of processing input from the user. Due to the evolving
    nature of technology, the definition of what constitutes an event is a constant
    state of flux. JavaScript came into existence in 1995. In those days people interacted
    with web pages almost exclusively using a keyboard and mouse. JavaScript events
    primarily consisted of plain vanilla human computer interactions such as: keypress,
    mousedown, mouseup, click, scroll and load.


    With the proliferation of smartphones, tablets and similar devices the number
    of events has increased dramatically. Nowadays aside from the basic keyboard and
    mouse events, APIs are available to detect orientation, zooming, and even humidity!
    This is functionality that did not exist just a few short years ago.


    Rather than trying to cover the entire API with a broad sweeping brush, it would
    be more instructive to begin with a specific use case to illustrate some general
    ideas and concepts. Suppose you want to display an alert when a user clicks a
    button on a page. To process this event, it is necessary to answer a number of
    questions:


    +   - **What was the action?** In this case it was a mouse click.'
  - '[PAGE 137]


    | What part of the page received the action? | In this case it was a button. |

    | --- | --- |

    | How do we wish to handle the action? | Here we display an alert. |

    | How do we specify a function to handle the action? | To answer this question,
    we need a way to simultaneously answer all of the previous questions. |


    While the above questions are somewhat of a simplification, they largely explain
    the JavaScript event model. Each step has its own formal description and definitions.
    Let’s now look at each step of the process in detail.


    # DOM Events


    To answer the question of “What was the action?”, we turn to DOM events. There
    is no central authoritative specification available to define exactly what does
    and does not constitute an event. However, the Mozilla Developer Network provides
    a list of events<sup>1</sup>.


    This is not actually a specification. Rather it is an amalgamation of a number
    of different specifications and provides a list of events along with a reference
    to the actual specification from which an event is derived. You will see that
    most of the events come from DOM Level 3 or HTML5. These APIs cover some of the
    more common cross platform interactions such as keystrokes, mouseclicks, dragging,
    media and offline behavior. However there are also some more obscure events such
    as chargingchange which comes from the Battery Status API.


    Not all events are universally supported across devices and browsers. For example,
    the Battery Status API is not supported in older versions of Internet Explorer.
    Additionally, while it may exist in desktop browsers, it is really only relevant
    in mobile devices such as laptops, tablets and smartphones. We will be covering
    the main concepts and common use cases of events in this chapter. Once you have
    grasped the basics, you should be able to use the above reference to implement
    some of the more esoteric functionality if this is what your application requires.


    > <sup>1</sup> https://developer.mozilla.org/en-US/docs/DOM/Mozilla_event_reference'
  - '[PAGE 138]


    We have included some common events in Appendix A. Browsing through the list,
    you will notice that the `click` event is part of the DOM Level 3, and is fairly
    unambiguously described as "A pointing device button has been pressed and released
    on an element." You''ll also notice that most other common events are DOM Level
    3. Some of these events include `dblclick`, `mousedown`, `mouseup`, `keydown`,
    `keyup` and `keypress`.


    # Event Propagation


    Before turning to the question of “What part of the page received the action?”,
    it is necessary to provide a brief overview of how events propagate through a
    page. Suppose you have a table and within that table you have an anchor tag. Both
    the table and the anchor tag have code to handle mouse clicks. When the user clicks
    on the anchor tag, which HTML element should process the event first? Should it
    be the table then the anchor tag or vice versa? To answer this question we have
    to briefly explore the mechanics of event propagation.


    In the early days, different browsers had different event handling orders. Some
    would process the event by firing on the parent and then the child element, while
    others would do the opposite. In recent times, the W3C has begun to standardize
    event propagation in its DOM Level 3 document. The way an event travels through
    a document is captured diagrammatically as part of the DOM Level 3 Events Specification
    in Figure 7.1.'
  - '[PAGE 139]


    ![](img/ae490e66f6d11d20689f8bf3d738bef9_139_0.png)


    Figure 7.1. How DOM events travel through a document


    Formally, the event path is broken into three phases. In the capture phase, the
    event starts at the top of the DOM tree, and propagates through to the parent
    of the target. In the target phase the event object arrives at its target. This
    is generally where you will write your event handling code. In the bubble phase,
    the event will move back up through the tree until it reaches the top. Bubble
    phase propagation happens in reverse order compared to the capture phase, with
    an event starting at the parent of the target and ending back up at the top of
    the DOM tree. These days, there''s a choice to register an event in either the
    capture phase or the bubble phase. If you register an event in the capture phase
    then the parent element will process the event before the child element. In the
    above example the table would process the event'
  - "[PAGE 140]\n\nbefore the anchor. The opposite order will apply if bubbling is\
    \ specified, in which\ncase the child element will process the event before the\
    \ parent. In our example, the\nanchor would receive the event before the table.\n\
    \nNote that specifying bubbling or capturing is optional and is something that\
    \ often\ndoes not even need to be considered. A conventional design would have\
    \ each user\naction processed by only a single element. Only in unusual circumstances\
    \ would\na single action need to be processed by multiple elements concurrently.\
    \ We include\na brief discussion here because many of the event APIs make reference\
    \ to capturing\nand bubbling, and it will be handy to understand what these terms\
    \ mean. With\nsome of the formal definitions out of the way we can now turn to\
    \ making our pages\nactually respond to events!\n\n# Event Handlers\n\nNormally\
    \ you will want specific elements on your page to handle specific events.\nTo\
    \ indicate that a particular element on the page should process a particular event\n\
    you need to register an event handler on that element. There are three ways to\
    \ register\nevent handlers. To prepare us for the following sections create a\
    \ new file named\nevents.html containing the following HTML:\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n    <title>Events</title>\n</head>\n<body>\n    <button>Click\
    \ Me!</button>\n</body>\n</html>\n```\n\nThis is a bare bones page with a single\
    \ button that we will use to process events.\n\n# HTML Attribute\n\nIt is possible\
    \ to place JavaScript inline with your HTML. In the early days of\nJavaScript\
    \ this was the standard way of processing events. As an example, modify\nyour\
    \ <button> tag as follows:"
  - "[PAGE 141]\n\n126 Jump Start JavaScript\n\n```\n<button onclick=\"alert('Old\
    \ style event handling')\">\n    ➜Click Me!</button>\n```\n\nNow when you click\
    \ on the button, you should see an alert similar to Figure 7.2.\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_141_0.png)\n\
    \nFigure 7.2. Inline JavaScript event handling\n\nThis method is not recommended.\
    \ HTML should primarily be used as a presentation layer. JavaScript events are\
    \ portions of business logic which make up the behavior layer. JavaScript code\
    \ should not be mixed in with the presentation layer. Separating these two areas\
    \ of your code will lead to greater maintainability. If a JavaScript programmer\
    \ is updating code there should be no chance that he or she can accidentally introduce\
    \ bugs into the presentation layer. Similarly if an interface designer is updating\
    \ a page there should be no chance that he or she can accidentally modify the\
    \ behavior layer. By keeping JavaScript completely separate from HTML it means\
    \ that the two sections of your application can be developed independently.\n\n\
    # addEventListener\n\nThe preferred way of handling events is by registering a\
    \ handler via the function addEventListener. A handler can be thought of as a\
    \ function that will process a particular event. addEventListener will register\
    \ a single event handler on a target. Multiple event handlers can be added by\
    \ calling this function multiple times. This function takes three parameters:\n\
    \n**type** The event type we are listening for. In the case of a mouse click,\
    \ it will be click.\n\n**listener** The listener, or handler, is the function\
    \ that processes the event. In this case it will be our custom function that displays\
    \ the alert."
- md: "**useCapture** 如果设为 *true*，则事件处理函数注册在捕获阶段；如果设为 *false*，则注册在冒泡阶段。默认值为 *false*。\n\
    \n修改 HTML 代码以移除内联 JavaScript。将 `<button>` 标签改为：\n\n```html\n<button id=\"btnClickMe\"\
    >Click Me!</button>\n```\n\n然后在 `</body>` 标签前添加一个 `<script>` 标签：\n\n```html\n\
