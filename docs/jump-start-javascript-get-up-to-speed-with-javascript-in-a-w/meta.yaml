    \ of the y-axis. The result will give us the appropriate spacing between each\
    \ number.\n\nNow we need to draw the numbers on the axis. You'll notice that the\
    \ for loop starts at the maximum value and then counts backwards. Recall that\
    \ under the default coordinate system, the top-left corner is (0, 0) and the Y-axis\
    \ descends downwards as y increases. Therefore, the smallest number on our Y-axis,\
    \ being 0, will correspond with the largest y-coordinate. Similarly, the largest\
