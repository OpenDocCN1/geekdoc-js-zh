    # Nested Arrays


    Sometimes, you''ll need to store an array within an array. Sometimes, you''ll
    require even more nesting. A quick warning: although it''s possible to nest a
    number of arrays, we''d advise against it, as working with many array indices
    can be confusing to work with.


    Let''s start with two simple arrays, which we''ll call them yusuf and dreamers.
    We''ll fill dreamers with some values:


    ```

    var yusuf, dreamers;


    yusuf = [];

    dreamers = ["cobb", "arthur", "ariadne", "saito", "fischer"];

    ```


    Now, reading any of the values from the dreamers array is as simple as passing
    in an index, which means placing the index value between a set of square brackets
    placed next to the array name. So, if I wanted "cobb", I''d pass in an index of
    0:


    ```

    var dreamer = dreamers[0]; // returns "cobb"

    ```


    But what if dreamers wasn''t a named array but merely defined inline:


    ```

    var yusuf;


    yusuf = [["cobb", "arthur", "ariadne", "saito", "fischer"]];

    ```


    How would we now get to "cobb"? By using: yusuf[0][0]. In the first square brackets,
    you define the index of the first array you want to read from; in the second set,
    you define the second index. So, reading "arthur" would be yusuf[0][1], "ariadne"
    would be yusuf[0][2], and so on.


