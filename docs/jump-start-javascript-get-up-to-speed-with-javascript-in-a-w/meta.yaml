  md: "# Simple Function\n\nWhen the `this` keyword is used inside a simple function,\
    \ it refers to the global variable scope, which is the `window` object. In this\
    \ context, there's no real need to use the `this` keyword as any variable in the\
    \ global scope is accessible simply by using its name. In other words, if you\
    \ declare a variable named `foo` globally, you can just refer to it as `foo`;\
    \ no need to use `this.foo`. JavaScript is simply referring you to the global\
    \ scope because there's nothing else for it to point the `this` keyword to in\
    \ this instance. If you're running in strict mode, however, it will return undefined.\
    \ This is to prevent unintentional errors that are bound to happen in this context.\n\
    \n> ### Strict Mode\n\n**Strict mode** is a recent addition to JavaScript. By\
    \ opting into strict mode via the addition of `\"use strict\"`; at the top of\
    \ a function, you force the JavaScript engine to change its behavior and essentially\
    \ fix some potentially error-prone ways of handling code. In this case, it's what\
    \ `this` refers to in a simple function.\n\n# In a Constructor\n\nWhen used in\
    \ a constructor or function intended to be instantiated via the `new` keyword,\
    \ `this` refers to the object that's to be created. So if your constructor is\
    \ a bank account:\n\n```\nvar Account, savings;\n\nAccount = function(num) {\n\
    \  this.accountNumber = num;\n};\n\nsavings = new Account(12345678);\nsavings.accountNumber;\
    \ // returns 12345678\n```\n\nIn this case, the `this` keyword lets you attach\
    \ the `accountNumber` property to the object that's to be instantiated. It's therefore\
    \ possible to get that value by referring to `savings.accountNumber`."
