  md: "# # Methods\n\n# ## apply\n\nSometimes, you need to change what a function's\
    \ `this` keyword points to. The `apply` method makes it easy by letting you pass\
    \ an object in as its first parameter that the `this` keyword will point to:\n\
    \n```\nvar person, lastName;\n\nlastName = \"Reyes\";\nperson = function() {\n\
    \  return this.lastName;\n};\n\nperson(); // returns \"Reyes\"\n\nperson.apply({lastName:\
    \ \"Cooper\"}); // returns \"Cooper\"\n```\n\nIn this example, our function refers\
    \ originally to the globally declared `lastName` since in this case, `this` refers\
    \ to `window`. But when we use `apply`, we pass in an object that the `this` keyword\
    \ now points to, and hanging off it is a new `lastName` value. Therefore, when\
    \ we use `apply` the return value is no longer \"Reyes\" but \"Cooper\".\n\nWhen\
    \ calling `apply`, you can also pass the function an array of arguments:\n\n```\n\
    var tax;\n\ntax = function(price, provincial, federal) {\n  return price * provincial\
    \ * federal;\n};\n\ntax.apply(null, [100, 1.05, 1.095]); // returns 114.975\n\
    ```\n\nHere, we have a `tax` function that takes a price, multiplies it by the\
    \ provincial and federal tax rates, and returns the value. Since we aren't trying\
    \ to change where the `this` keyword is pointing, we don't bother passing in a\
    \ value for the first argument. Instead, we skip it by passing in `null`. We then\
    \ pass in an array containing values for the price, and the provincial and federal\
    \ tax rates."
