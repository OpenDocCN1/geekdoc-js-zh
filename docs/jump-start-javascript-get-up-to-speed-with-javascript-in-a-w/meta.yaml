    # # Summary


    We have covered a lot of ground in this chapter. We started by taking a look at
    loops, including `while`, `do ... while`, `for`, and `for ... in`. We then moved
    onto jumps, including labeled statements, `break`, `continue`, and `return`. We
    also discussed exception handling, using `throw` and `try ... catch ... finally`
    before moving onto talking about higher order functions and how they''re used
    to implement functional programming solutions. Finally, we took a quick look at
    recursion, and how it can elegantly replace loops in certain solutions.


    By now, I hope you have a firm grasp of loops and jumps, and are beginning to
    gain insights into cases where functional solutions can concisely replace their
    imperative counterparts.'
