  md: "# The Dangers of Loose Typing\n\nAlthough JavaScript does its best to figure\
    \ out what you're doing with your variables, and has no requirement for strong\
    \ typing, it's important to consider the type of data your variables will be holding;\
    \ otherwise, you may run into some problems.\n\nFor example, consider:\n\n```\n\
    var johnTaskCount = 11,\n    janeTaskCount = \"42\",\n    totalTaskCount = johnTaskCount\
    \ + janeTaskCount;\n```\n\nAt a glance, John has 11 tasks and Jane has 42, which\
    \ should total 53 tasks. However, since the value of `janeTaskCount` is a string,\
    \ JavaScript sees the plus symbol on the third line as an attempted concatenation\
    \ instead of an addition. The result is \"1142\" instead of the expected number,\
    \ 53.\n\nFor the right result, we have to ensure that both variables hold actual\
    \ numbers and not strings, like this:\n\n```\nvar johnTaskCount = 11,\n    janeTaskCount\
    \ = 42,\n    totalTaskCount = johnTaskCount + janeTaskCount;\n```\n\n# Type Conversion\
    \ (aka Type Coercion)\n\nWhen JavaScript is given an operation involving conflicting\
    \ variable types, it tries to normalize them first before performing the operation.\
    \ This is the case in arithmetic or string operations (as shown) or comparisons\
    \ (which we'll cover in a moment). Because you can't add a word to a number, it\
    \ first converts the number to a string and then concatenates the two (like we\
    \ saw a moment ago). Likewise, if you attempt to add a number to a Boolean (`true`\
    \ or `false`), it will first convert the Boolean to its numeric representation—1\
    \ for `true` and 0 for `false`—and then add that to the number. This is a very\
    \ important aspect of the language to understand, as not knowing about it could\
    \ lead to unintentional errors cropping up in your programs."
  merge: -1
