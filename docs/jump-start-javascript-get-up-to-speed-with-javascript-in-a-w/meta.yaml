  md: '# # Object


    An object is a collection of properties. The properties can be any of the previously
    mentioned types, as well as other objects and functions (which we’ll cover later).


    # # Operations


    Having data is great, but doing something with it is better. You may have a couple
    of strings that you want to concatenate, or a few numbers you’d like to do some
    math with. Well, it’s fairly straightforward to perform these tasks using JavaScript.
    Concatenating strings is as easy as using the + symbol:


    ```

    var fname, lname, fullName;


    fname = "John";

    lname = "Doe";

    fullName = fname + " " + lname; // fullName is "John Doe"

    ```


    Math operations are carried out as you’d expect, using the addition (+), subtraction
    (-), multiplication (*), division (/), and modulus (%) operators:


    ```

    var widgets, gizmos, inventory;


    widgets = 1043;

    gizmos = 2279;

    inventory = widgets + gizmos; // inventory is 3322

    ```


    Similarly:


    ```

    var provincial, federal, subtotal, total;


    provincial = 0.095;

    federal = 0.05;

    subtotal = 10;

    total = subtotal + (subtotal * provincial)

    + (subtotal * federal); // total is 11.45

    ```


    Finally, you can use the remainder (%) operator to end up with just the remainder
    of a division returned to you. So, for example, 10 % 3 will return 1.'
  merge: -1
