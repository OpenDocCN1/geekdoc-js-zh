    \n这里我们使用 `filter` 创建一个只包含指定负责人的数组；然后用 `map` 将任务重新分配给新负责人。在下一个例子中，我们想统计分配给特定人员的任务数量。这正是函数式编程优雅之处得以展现的地方。命令式的方法是遍历每个任务并递增计数器，如下所示：\n\
    \n```\nvar tasks = [\n  {name: 'Buy milk', owner: 'James'},\n  {name: 'Trash',\
