  mdcn: "\n共有 3 项任务待完成\n共有 2 项任务待完成\n共有 1 项任务待完成\n\n在使用 `while` 循环时，确保条件最终会变为 false\
    \ 是至关重要的。在每次循环迭代中，某个变量应发生变化，最终导致条件为 false，从而终止循环。否则，你的程序就会陷入可怕的死循环。以下是一个导致死循环的微妙错误示例：\n\
    \n```\nfunction getNext(num) {\n    return num++;\n}\n\nvar i = 0;\n\nwhile (i\
    \ < 3) {\n    i = getNext(i);\n}\n```\n\n一开始可能很难发现这个 bug。注意 `num++` 会返回 `num`\
    \ 的当前值，然后再递增其值。因此，在 `while` 循环中，`i` 的值将始终为零！在编写 `while` 循环时，务必反复检查循环是否能正常退出。通过耐心和练习，这很快就会成为你的第二天性。\n\
    \n## do ... while 循环\n\n`do ... while` 循环是 `while` 循环的一个变体，形式如下：\n\n```\ndo {\n\
    \    statement\n} while(expression);\n```\n\n两者的主要区别在于，`do ... while` 循环保证至少执行一次循环体。以下示例说明了这一点：\n\
    \n```\ndo {\n  console.log('This will print at least once');\n}\nwhile (false);\n\
    ```\n\n我们使用 `while (false)` 来强调 while 检查会终止循环。尽管如此，控制台仍将输出一次。稍作修改，我们的 `while`\
    \ 示例就可以改写成等效的 `do ... while` 形式：\n\n```\nvar tasksToDo = 3;\n\ndo {\n  console.log('There\
    \ are ' + tasksToDo + ' tasks to do');\n  tasksToDo--;\n}\nwhile (tasksToDo >\
    \ 0);\n```\n\n这段代码将产生完全相同的控制台输出。对于许多问题，可以使用 `while` 或 `do ... while`，因此问题就变成了选择哪个。我们建议默认使用\
    \ `while`，只在那些语句必须至少执行一次的场合使用 `do ... while`。\n\n## for 循环\n\n`for` 循环用于多次运行一个代码块，常被称为计数循环。其通用形式如下：\n\
    \n```\nfor (initialization; condition; end-expression ) {\n  statement\n}\n```\n\
    \n一个简单的例子如下：\n\n```\nfor (var i = 0; i < 3; i++) {\n  console.log(i);\n}\n```\n\
    \n上述循环将声明变量 `i` 并赋予其初始值 0。每次迭代时，`i` 的值将被输出到屏幕，然后递增 1。需要注意的是，该变量既是声明的也是初始化的。省略声明在语法上是有效的：\n\
    \n```\nfor (i = 0; i < 3; i++) {\n    console.log(i);\n}\n```\n\n然而，这将创建一个全局变量\
    \ `i`，这是不可取的。它可能与其他同名变量冲突，并可能导致内存泄漏以及一系列其他不愉快的问题。如果在 `for` 循环开头创建一个新变量，请务必记得使用\
    \ `var`！`for` 循环也可以有多个测试条件：\n\n```\nfor (var i = 0; i < 10 && i % 2 === 0; i+=4)\
    \ {\n    console.log(i);\n}\n```\n\n这里我们测试 `i` 是否小于 10 且能被 2 整除，输出结果为：\n\n```\n\
    0\n4\n8\n```\n\n也可以有多个初始化语句和结束表达式：\n\n```\nfor (var i = 0, j = 0; i < 3; i++,\
    \ j+=2) {\n    console.log(i, j);\n}\n```\n\n在运行代码之前，试着推算出它将输出什么。你猜对下面的结果了吗？\n\
    \n```\n0 0\n1 2\n2 4\n```\n\n该循环运行两个结束表达式，因此在每次迭代中，`i` 递增 1，`j` 递增 2。还需注意，虽然结束表达式通常用于递增计数器，但它可以采取任何形式。例如，我们可以使用内置的\
    \ `Math.random()` 函数为 `i` 赋一个随机数：\n\n```\nfor (var i = 0; i < 0.9; i = Math.random())\
    \ {\n    console.log(i);\n}\n```\n\n此处的循环将持续迭代，直到随机数生成器产生一个大于或等于 0.9 的值。如你所见，`for`\
    \ 循环是一种强大且灵活的结构，很可能成为你使用最多的循环。\n\n## for ... in 循环\n\n`for ... in` 循环已在上一章介绍过。回顾一下，该语句用于遍历对象的属性；例如：\n\
    \n```\nvar agents = {\n    '005': \"Michael Harp\",\n    '006': \"John Smith\"\
    ,\n    '007': \"James Bond\"\n};\n\nfor (key in agents) {\n    if ('007' === key)\
    \ {\n        console.log('Bond, ' + agents[key] + ' has been found!');\n    }\
    \ else {\n        console.log('Standard spy, ' + agents[key] + ' has been found');\n\
    \    }\n}\n```\n\n有几点值得记住。首先，避免将此循环用于数组；应改用标准的 `for` 循环。其次，不要依赖循环以与定义顺序相同的顺序返回对象。尽管大多数实现确实如此，但这实际上并不是规范的一部分，因此遵循标准的实现者可能会决定采用不同的顺序。\n\
    \n## 跳转\n\n广义上讲，跳转语句用于转到脚本的另一部分。JavaScript 中的跳转语句有 `break`、`continue`、标签语句和 `return`。`return`\
    \ 用于退出函数，而其余用于循环。让我们详细分解一下。\n\n### break\n\n`break` 语句用于退出循环。假设我们希望遍历任务列表，并在遇到第一个已完成的任务时停止。这可以使用\
    \ `break` 语句实现：\n\n```\nbreak.html (摘录)\n\nvar tasks = [\n  {name: 'Buy milk',\
    \ complete: false},\n  {name: 'Trash', complete: false},\n  {name: 'Pay bills',\
    \ complete: true},\n  {name: 'Repairs', complete: false},\n  {name: 'Plumber',\
    \ complete: true}\n];\nvar firstComplete;\n\nfor (var i = 0; i < tasks.length;\
    \ i++) {\n  if (tasks[i].complete) {\n    firstComplete = tasks[i];\n    break;\n\
    \  }\n}\n\nconsole.log(firstComplete);\n```\n\n注意，`break` 仅用于退出循环。不要用它来尝试退出 `if`\
    \ 等条件语句。上面的例子可以重构为不使用 `break` 的形式：\n\n```\nfor (var i = 0; i < tasks.length &&\
    \ firstComplete === undefined; i++) {\n    if (tasks[i].complete) {\n        firstComplete\
    \ = tasks[i];\n    }\n}\n```\n\n读者从一开始就能看出，循环意在 `firstComplete` 被赋值后退出。使用 `break`\
    \ 时，几乎总能用条件语句替代它，因此在编写代码之前，值得考虑哪种方式更简洁明了。作为一个实用指南，如果你的 `break` 语句将深埋在循环中间，请考虑将其移到顶部或完全重构以避免使用它。\n\
    \n### continue\n\n`continue` 语句也用于循环；但它不是中断循环，而是跳到下一次迭代。在 `while` 循环中，这意味着将再次测试条件。在\
    \ `for` 循环中，结束表达式将运行，然后循环继续。一个示例可以阐明。假设使用与前面示例相同的 `tasks` 变量，看看以下代码：\n\n```\n\
    for (var i = 0; i < tasks.length; i++) {\n  if (!tasks[i].complete) {\n    continue;\n\
    \  }\n\n  console.log(i, tasks[i].name);\n}\n```\n\n这段代码打印已完成的任务，输出如下：\n\n```\n\
    2 'Pay bills'\n4 'Plumber'\n```\n\n我们选择打印计数器 `i` 的值，以演示使用 `continue` 对计数器递增的影响。注意它如何导致循环继续，以及运行结束条件以递增计数器。让我们重新审视简单的\
    \ `while` 示例。假设我们希望在 `tasksToDo` 等于 2 时跳过。不输入代码，考虑一下这个解决方案是否有效：\n\n```\nvar tasksToDo\
    \ = 3;\n\nwhile (tasksToDo > 0) {\n    if (tasksToDo == 2) {\n        continue;\n\
    \    }\n\n    console.log('There are ' + tasksToDo + ' tasks to do');\n    tasksToDo--;\n\
    }\n```\n\n你发现错误了吗？通过 `continue`，我们绕过了 `tasksToDo` 的递减——并陷入了无限循环。我们将把它作为练习留给你，使用条件语句修复这个示例，然后比较这两段代码的清晰度。我们的大脑更容易以线性方式处理信息。处理跳转语句需要更多的认知开销，这使得错误更容易潜入我们的代码。程序员需要决定特定方法是否最大化了清晰度和可读性，在这个意义上，编程既是一门科学，也是一门艺术。\n\
    \n### 标签语句\n\n标签语句与 `break` 和 `continue` 结合使用。可以通过在语句前加上标识符来给语句添加标签：\n\n```\n\
    identifier: statement\n```\n\n让我们看一个来自 Mozilla 开发者网络³ 的示例，它实际上附带了一个警告：“尽可能避免使用标签，并根据情况优先调用函数或抛出错误。”当代码带有警告时，请注意！他们的示例如下：\n\
    \n```\nvar i, j;\n\nloop1:\nfor (i = 0; i < 3; i++) {\n    //第一个 for 语句被标记为 \"\
    loop1\"\n    loop2:\n    for (j = 0; j < 3; j++) {\n        //第二个 for 语句被标记为 \"\
    loop2\"\n        if (i == 1 && j == 1) {\n            continue loop1;\n      \
    \  }\n        console.log('i = ' + i + ', j = ' + j);\n    }\n}\n```\n"
