    # Hoisting


    Now that we’ve covered how functions create variable scope, we’ll address a phenomenon
    called hoisting. Because JavaScript is a very permissive language, it has to do
    a lot of work under the hood. We’ve already seen this with type coercion, when
    JavaScript attempts to convert variable types in order to make operations with
    conflicting types work. **Hoisting** is another "under the hood" action by JavaScript
    does where it moves all variable declarations to the top of a function. That means
    that this:'
- md: "is the same as:\n\n```javascript\nvar name = \"Emma\";\n\nfunction nameHer()\
