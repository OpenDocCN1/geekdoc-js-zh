    ## 商标声明\n\n本书并非在每次出现商标名称时都标注，而是仅以编辑方式使用这些名称，旨在为商标所有者提供便利，并无侵犯商标的意图。\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_1_0.png)\n\
    \n由 SitePoint Pty. Ltd. 出版\n地址：48 Cambridge Street Collingwood, VIC Australia\
    \ 3066\n网站：www.sitepoint.com\n电子邮件：business@sitepoint.com\nISBN 978-0-9873321-8-9（印刷版）\n\
    ISBN 978-0-9873321-9-6（电子版）\n在美国印刷并装订\n\n## 关于 Ara Pehlivanian\n\nAra Pehlivanian\
    \ 自 1997 年起从事 Web 开发工作。最近，他在 Nurun 担任 Web 开发人员和实践负责人，参与了高端、高知名度的项目，并在 Yahoo! Mail\
    \ 担任前端工程师，目前是 HP 云服务团队的 JavaScript 开发人员。\n\n## 关于 Don Nguyen\n\n和许多程序员一样，Don 多年来一直将\
    \ JavaScript 作为第二语言进行尝试。直到他开始使用 Node.js 实现服务器端项目，JavaScript 才开始成为他工作的核心。由于深度参与了多个从后端到前端的\
    \ Web 项目，他现在能够同样熟练地在客户端和服务器端使用 JavaScript。他目前在澳大利亚悉尼的家中，致力于初创公司的建设。\n\n## 关于 SitePoint\n\
    \nSitePoint 专注于为 Web 专业人士出版有趣、实用且易于理解的内容。访问 http://www.sitepoint.com/ 可访问我们的博客、书籍、时事通讯、文章和社区论坛。您将找到大量关于\
    \ JavaScript、PHP、Ruby、移动开发、设计等方面的信息。\n\n## 关于《快速上手》系列\n\n《快速上手》系列丛书为您提供了 Web 开发语言和技术的快速实用入门指南。这些书通常约\
    \ 150 页，您可以在一个周末内读完，让您对主题有扎实的基础，并有信心自行尝试。\n\n> *献给我亲爱的妻子 Krista，没有她的优雅、耐心和支持，我无法完成这本书；也献给我们两个才华横溢的女儿。*\n\
    \n——Ara\n\n> *献给 Lorraine，感谢您用热腾腾的饭菜、温暖的心和灿烂的笑容让我保持精力充沛。*\n\n——Don\n\n## 目录\n\n\
    前言\n\n-   谁应该阅读本书\n-   使用的约定\n    -   代码示例\n    -   提示、说明和警告\n-   补充材料\n-   你想继续学习吗？\n\
    \n第 1 章 设置环境\n\n-   控制台\n    -   Chrome\n    -   Firefox\n    -   Internet Explorer\n\
    \    -   Safari\n-   在 HTML 文件中使用 JavaScript\n    -   在 HTML 文件中\n    -   在单独的文件中\n\
    \    -   `<script>` 标签的位置\n-   总结\n\n第 2 章 变量\n\n-   首先，一个快速说明\n-   声明\n-   类型\n\
    \    -   数字\n    -   字符串\n    -   布尔值\n    -   未定义\n    -   空值\n    -   对象\n-\
    \   操作\n-   松散类型的危险\n-   类型转换（也称类型强制）\n-   比较运算符\n    -   等于 (==)\n    -   不等于\
    \ (!=)\n    -   严格等于 (===)\n    -   严格不等于 (!==)\n    -   大于 (>)\n    -   大于或等于\
    \ (>=)\n    -   小于 (<)\n    -   小于或等于 (<=)\n-   逻辑流程\n-   项目\n-   总结\n\n第 3 章\
    \ 数组\n\n-   创建数组\n-   添加元素到数组\n-   从数组读取\n-   嵌套数组\n-   你能用数组做什么？\n    -   变异方法\n\
    \    -   访问器方法\n    -   迭代方法\n-   项目\n-   总结\n\n第 4 章 对象和函数\n\n-   对象\n    - \
    \  创建对象\n    -   添加属性到对象\n    -   从对象读取\n    -   嵌套对象\n    -   原型链\n    -   遍历对象\n\
    -   函数\n    -   作用域\n    -   提升\n    -   声明\n    -   参数\n    -   使用函数进行面向对象编程\n\
    \    -   `this`\n    -   属性\n    -   方法\n-   项目\n-   总结\n\n第 5 章 循环和跳转\n\n-  \
    \ 循环\n    -   while 循环\n    -   do ... while 循环\n    -   for 循环\n    -   for ...\
    \ in 循环\n-   跳转\n    -   break\n"
