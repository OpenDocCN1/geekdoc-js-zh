  md: '# # Summary


    We have covered the main aspects of JavaScript event handling in this chapter.
    We began by describing DOM events, specifically what constitutes an event and
    where to find a list of events. We then took a technical detour to cover propagation,
    the path that an event takes to get from the user to your application. Next we
    explored assigning handlers. This is how HTML elements register for events and
    how functions are defined to handle a given event. From within an event handler,
    we then learned how to find out about HTML elements and get event object information.
    We also discussed custom events which is how to get your application to fire its
    own internally defined event.'
