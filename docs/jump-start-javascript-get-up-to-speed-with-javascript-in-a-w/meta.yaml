  md: "```\nThere are 3 tasks to do\nThere are 2 tasks to do\nThere are 1 tasks to\
    \ do\n```\n\nWhen using a while loop, it's important to make sure that the condition\
    \ eventually evaluates to false. During each iteration of the loop, some variable\
    \ should be changing that will eventually lead to the condition being false, thereby\
    \ terminating the loop. Otherwise, your program becomes stuck in the dreaded infinite\
    \ loop. For an example of a subtle bug that leads to an infinite loop, consider\
    \ this:\n\n```\nfunction getNext(num) {\n    return num++;\n}\n\nvar i=0;\n\n\
    while (i < 3) {\n    i = getNext(i);\n}\n```\n\nAt first it may be hard to even\
    \ spot the bug. Note that num++ will return the value of num, and then increment\
    \ the value. Therefore, in the while loop, the value of i will always be zero!\
    \ Whenever you are writing a while loop, always double check that the loop will\
    \ gracefully exit. With patience and practice this will soon become second nature.\n\
    \n# The do ... while Loop\n\nThe do ... while loop is a variation of the while\
    \ loop that takes the following form:\n\n```\ndo {\n    statement\n} while(expression);\n\
    ```\n\nThe main difference between the two is that execution is guaranteed at\
    \ least once with the do ... while loop. The following example illustrates this:"
