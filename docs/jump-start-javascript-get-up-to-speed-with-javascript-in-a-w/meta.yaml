  md: '# Inside an Object Literal


    If your function happens to be inside an object literal, and it''s a simple function
    call as in our first example, the `this` keyword now refers to the immediate parent
    object surrounding your function. For example, the code in our diagram has two
    arrays inside the `Project` object called `Managers` and `Developers`. The `howMany`
