  md: "Speaking of indices, it's important to remember that array indices are zero-based.\
    \ This means that the first item is stored at position 0, the second at position\
    \ 1, the third at position 2, and so on. It can cause confusion, however, and\
    \ lead to one-off errors. For example, you might ask for the item at index one\
    \ and expect the first array element, but, in reality, you'd be accessing the\
    \ second element.\n\nIt's also possible to use named indices:\n\n```\nvar myArray\
    \ = [];\n\nmyArray[\"fruit\"] = \"apple\";\nmyArray[\"vehicle\"] = \"tank\";\n\
    ```\n\nThis creates an **associative array** where items are stored by a named\
    \ index rather than a numbered index. However, we'd discourage the use of associative\
    \ arrays. The preferred way to store data with named indices is by using objects,\
    \ which we'll discuss in the next chapter.\n\nAs mentioned earlier, there are\
    \ a couple of ways to add data to an array. The second approach is to use the\
    \ push method. This is useful in situations where you want to add items to the\
    \ end of an array, but want to avoid calculating the index required to access\
    \ the final position. Instead, you can do this:\n\n```\nmyArray.push(\"hello\"\
    );\n```\n\nBy using **push**, you simply add a new item to the existing array.\
    \ If it's an empty array, the data is written to position 0. If there are ten\
    \ items in the array, the data is written to position 10 (remember, indices are\
    \ zero-based).\n\n# # Reading from an Array\n\nReading from an array is fairly\
    \ straightforward. All you need to do is point to the item you want by its index\
    \ number and the array will return it to you, like so:\n\n```\nvar myValue,\n\
    \    myArray = [\"Hello\", \"World\", \"I\", \"am\", \"an\", \"array\"];\n\nmyValue\
    \ = myArray[4]; // returns \"an\"\n```"
