    # Inside an Event Handler


    We'' yet to cover event handlers, so bear with me. Basically, an **event handler**
    is a function that is called when an event is triggered, such as a "click" event
    when a link is clicked on. In an event handler, the `this` keyword refers to the
    element that triggered the event, which, in this case, is the anchor on the page.


    # call and apply


    It''s possible to invoke a function using the `call` and `apply` methods that
    are provided. We''ll cover these in more detail shortly, but in both cases, the
    first argument of these methods is an object you can pass in for the `this` keyword
    to refer to.


    # bind


    Finally, ECMAScript 5 introduced a method called `bind` that creates a new function
    and permanently binds it to the object you pass it. That object gets referred
    to when calling `this`. We''ll also address this in more detail soon.


