    \ 显示不带空格的 join 操作的警报](img/ae490e66f6d11d20689f8bf3d738bef9_52_0.png)\n\n### slice\n\
    \n`slice` 会复制数组的一部分并将其返回。它不是修改原始数组，而是制作一个浅拷贝。你告诉它从哪里开始复制，以及（可选）在哪里结束复制。因此，`arr.slice(2)`\
