  md: '# An Empirical Study


    There is some vigorous debate in the programming community as to whether certain
    jump statements constitute bad practice. For example, Douglas Crockford, author
    of *JavaScript: The Good Parts*,^4 recommends to “avoid use of the continue statement.
    It tends to obscure the control flow of the function.”^5


    Rather than wade into the debate, we’ve taken the liberty of conducting an empirical
    study using jQuery, one of the most well-known and popular JavaScript libraries.
    If your operating system supports wget, grep, and wc, you can try it yourself;
    otherwise, follow along with the text. First, download the uncompressed version
    of the code:


    ```

    wget http://code.jquery.com/jquery-1.9.1.js

    ```


    Use a combination of grep and word count to see how many times break is used:


    ```

    > grep ''break;'' jquery-1.9.1.js | wc -l

    > 16

    ```


    Similarly, we check for continue:


    ```

    > grep ''continue;'' jquery-1.9.1.js | wc -l

    > 7

    ```


    function:


    ```

    > grep ''function'' jquery-1.9.1.js | wc -l

    > 624

    ```


    and return:


    ```

    > grep ''return'' jquery-1.9.1.js | wc -l

    > 646

    ```'
