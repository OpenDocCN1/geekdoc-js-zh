    \ to figure out what you're doing with your variables, and has no requirement\
    \ for strong typing, it's important to consider the type of data your variables\
    \ will be holding; otherwise, you may run into some problems.\n\nFor example,\
    \ consider:\n\n```\nvar johnTaskCount = 11,\n    janeTaskCount = \"42\",\n   \
    \ totalTaskCount = johnTaskCount + janeTaskCount;\n```\n\nAt a glance, John has\
    \ 11 tasks and Jane has 42, which should total 53 tasks. However, since the value\
    \ of `janeTaskCount` is a string, JavaScript sees the plus symbol on the third\
    \ line as an attempted concatenation instead of an addition. The result is \"\
    1142\" instead of the expected number, 53.\n\nFor the right result, we have to\
    \ ensure that both variables hold actual numbers and not strings, like this:\n\
    \n```\nvar johnTaskCount = 11,\n    janeTaskCount = 42,\n    totalTaskCount =\
    \ johnTaskCount + janeTaskCount;\n```\n\n# Type Conversion (aka Type Coercion)\n\
    \nWhen JavaScript is given an operation involving conflicting variable types,\
    \ it tries to normalize them first before performing the operation. This is the\
    \ case in arithmetic or string operations (as shown) or comparisons (which we'll\
    \ cover in a moment). Because you can't add a word to a number, it first converts\
    \ the number to a string and then concatenates the two (like we saw a moment ago).\
    \ Likewise, if you attempt to add a number to a Boolean (`true` or `false`), it\
    \ will first convert the Boolean to its numeric representation—1 for `true` and\
    \ 0 for `false`—and then add that to the number. This is a very important aspect\
    \ of the language to understand, as not knowing about it could lead to unintentional\
    \ errors cropping up in your programs."
- md: "## Comparison Operators\n\nComparison operators compare two values and return\
    \ either `true` or `false` based on how they compare. So, if we want to know whether\
    \ 10 is greater than 5, we’d write `10 > 5` and that comparison would return `true`.\
    \ However, `10 > 11` would return `false`.\n\n## Equal (==)\n\nReturns `true`\
    \ if both values are equal. If the values being compared are not of the same type,\
    \ JavaScript first converts them and then applies a strict comparison. So, if\
    \ the values are a number and a Boolean, they’ll be converted to numbers before\
    \ the comparison. If a string is involved, both values are converted to strings\
    \ before comparing. If they’re objects, they’re equal if both values are referring\
    \ to the same location in memory:\n\n```\n1 == 1      // returns true\n\"1\" ==\
    \ 1    // returns true (\"1\" converts to 1)\n1 == true   // returns true\n0 ==\
    \ false  // returns true\n\"\" == 0     // returns true (\"\" converts to 0)\n\
    \" \" == 0    // returns true (\" \" converts to 0)\n\n0 == 1      // returns\
    \ false\n1 == false  // returns false\n0 == true   // returns false\n\nvar x,\
    \ y;   // declare x and y\nx = {};     // create an object and assign it to x\n\
    y = x;      // point y to x\nx == y;     // returns true (refers to same object\
    \ in memory)\nx == {};    // returns false (not the same object)\n```\n\n## Not\
    \ Equal (!=)\n\nThis is the same as equal, but it works in reverse: `true` is\
    \ returned if the values are not equal. The same conversions described above apply\
    \ here as well:\n\n```\n1 != 1      // returns false\n\"1\" != 1    // returns\
    \ false (\"1\" converts to 1)\n1 != true   // returns false\n0 != false  // returns\
    \ false\n\"\" != 0     // returns false (\"\" converts to 0)\n\" \" != 0    //\
    \ returns false (\" \" converts to 0)\n\n0 != 1      // returns true\n1 != false\
    \  // returns true\n0 != true   // returns true\n\nvar x, y;   // declare x and\
    \ y\nx = {};     // create an object and assign it to x\ny = x;      // point\
    \ y to x\nx != y;     // returns false (refers to same object in memory)\nx !=\
    \ {};    // returns true (not the same object)\n```\n\n## Strict Equal (===)\n\
    \nA strict equal comparison performs no conversion of types. Where `\"\" == 0`\
    \ would return true for a regular equal comparison, `\"\" === 0` would not, since\
    \ an empty string does not equal zero:\n\n```\n1 === 1     // returns true\n\n\
    \"1\" === 1   // returns false (\"1\" is not converted)\n1 === true  // returns\
    \ false\n0 === false // returns false\n\"\" === 0    // returns false (\"\" is\
    \ not converted)\n\" \" === 0   // returns false (\" \" is not converted)\n0 ===\
    \ 1     // returns false\n1 === false // returns false\n0 === true  // returns\
    \ false\n\nvar x, y;   // declare x and y\nx = {};     // create an object and\
    \ assign it to x\ny = x;      // point y to x\nx === y;    // returns true (refers\
    \ to same object in memory)\nx === {};   // returns false (not the same object)\n\
    ```\n\n## Strict Not Equal (!==)\n\nSame as strict equal except that it works\
    \ in reverse. It returns true if the values are not equal. Again, no conversions\
    \ are performed prior to comparison:\n\n```\n1 !== 1     // returns false\n\n\"\
    1\" !== 1   // returns true (\"1\" is not converted)\n1 !== true  // returns true\n\
    0 !== false // returns true\n\"\" !== 0    // returns true (\"\" is not converted)\n\
    \" \" !== 0   // returns true (\" \" is not converted)\n0 !== 1     // returns\
    \ true\n1 !== false // returns true\n0 !== true  // returns true\n\nvar x, y;\
    \   // declare x and y\nx = {};     // create an object and assign it to x\ny\
    \ = x;      // point y to x\nx !== y;    // returns false (refers to same object\
    \ in memory)\nx !== {};   // returns true (not the same object)\n```\n\n## Greater\
    \ than (>)\n\nReturns true if the value on the left of the operator is greater\
    \ than the value on the right. Note that type conversion implicitly occurs before\
    \ comparison:\n\n```\n0 > 1  // returns false\n1 > 1  // returns false\n2 > 1\
    \  // returns true\n2 > \"\" // returns true (\"\" converts to 0)\n```\n\n## Greater\
    \ than or Equal to (>=)\n\nReturns true if the value on the left is greater than\
    \ or equal to the one on the right. Note that type conversion implicitly occurs\
    \ before comparison:\n\n```\n0 >= 1   // returns false\n1 >= 1   // returns true\n\
    \"1\" >= 1 // returns true (\"1\" converts to 1)\n```\n\n## Less than (<)\n\n\
    Returns true if the value on the left of the operator is less than the value on\
    \ the right. Note that type conversion implicitly occurs before comparison:\n\n\
    ```\n0 < 1   // returns true\n1 < 1   // returns false\n2 < 1   // returns false\n\
    2 < \"\"  // returns false (\"\" converts to 0)\n```\n\n## Less than or Equal\
    \ to (<=)\n\nReturns true if the value on the left of the operator is less than\
    \ or equal to the value on the right. Note that type conversion implicitly occurs\
    \ before comparison:\n\n```\n0 <= 1   // returns true\n1 <= 1   // returns true\n\
    \"1\" <= 1 // returns true (\"1\" converts to 1)\n2 <= 1   // returns false\n\"\
    2\" <= 1 // returns false (\"2\" converts to 2)\n```\n\n## Logic Flow\n\nNow that\
    \ we've covered comparison operators, we can use them to control the logic flow\
    \ of our programs. Sometimes your program will need to execute different code\
    \ under different conditions. For example, if the time is before noon, we should\
    \ display a \"Good Morning!\" message, but if it's later in the day, \"Good Afternoon!\"\
    \ or even \"Good Evening!\" would be more appropriate. The way to do this is to\
    \ use the `if..else` statement to evaluate conditions and fork code execution.\n\
    \nFigure 2.1 shows how logic flow can be controlled through comparison statements.\
    \ If a condition is met, the code branches in a given direction. If not, it falls\
    \ to the next condition. In our flow diagram, we assume a time of 1900 hours or\
    \ 7 PM. We then check it against various time ranges to see where it falls. So,\
    \ if the time value is greater than or equal to 0000 (midnight) and less than\
    \ 1200 (noon), we set our message to \"Good morning!\". If it's greater than or\
    \ equal to 1200 and less than 1700 (5 PM), we set the message to \"Good afternoon!\"\
    . We continue this pattern until we've checked every range leading us to midnight.\n\
    \n## Jump Start JavaScript\n\n![Figure 2.1. Logic flow](img/ae490e66f6d11d20689f8bf3d738bef9_35_0.png)\n\
    \nFigure 2.1. Logic flow\n\n### && symbols\n\nYou'll notice the use of && symbols\
    \ in Figure 2.1. This is a logical AND operator. Along with it, there's also the\
    \ logical OR (||) as well as the logical NOT (!). The AND and OR operators convert\
    \ values to Boolean values and then return one of the two. The NOT operator inverses\
    \ the Boolean value of an operand. Here are a few examples of the logical AND\
    \ operator. Notice how if the first of the two values evaluates to false, it is\
    \ returned; otherwise, the second value is returned:\n\n```\ntrue && true;  //\
    \ returns true\ntrue && false; // returns false\nfalse && true; // returns false\n\
    0 && 1;        // returns 0\n0 && 2;        // returns 0\n1 && 0;        // returns\
    \ 0\n2 && 0;        // returns 0\n\"foo\" && \"bar\" // returns \"bar\"\n```\n\
    \nHere are a few examples of the logical OR operator. Note how if the first of\
    \ the two values evaluates to **true**, it is returned; otherwise, the second\
    \ value is returned:\n\n```\ntrue || true;  // returns true\ntrue || false; //\
    \ returns true\nfalse || true; // returns true\n0 || 1;        // returns 1\n\
    0 || 2;        // returns 2\n1 || 0;        // returns 1\n2 || 0;        // returns\
    \ 2\n\"foo\" || \"bar\"; // returns foo\n```\n\nHere are a few examples of the\
    \ logical NOT operator. Note how it inverts the Boolean value of the operand:\n\
    \n```\n!true;  // returns false\n!false; // returns true\n!0;     // returns true\n\
    !1;     // returns false\n!\"foo\"; // returns false\n```\n\nLet's write some\
    \ code that does what's represented in Figure 2.1:\n\n```\n**time-of-day.html\
    \ (excerpt)**\n\nvar d, hours, minutes, time, message;\n\n// Get the current time's\
    \ hour and minute components\nd = new Date();\nhours = d.getHours();\nminutes\
    \ = d.getMinutes();\n\n// Make sure the hour is a double digit string\nif (hours\
    \ < 10) {\n  hours = \"0\" + hours; // converts hours to string\n} else {\n  hours\
    \ = hours.toString();\n}\n\n// Make sure the minutes are a double digit string\n\
    if (minutes < 10) {\n  minutes = \"0\" + minutes; // converts minutes to string\n\
    } else {\n  minutes = minutes.toString();\n}\n\n// Concatenate hours and minutes\
    \ into a quadruple digit number\n// representing the time in 24 hour format\n\
    time = Number(hours + minutes);\n\nif (time >= 0000 && time < 1200) {\n  message\
    \ = \"Good morning!\";\n} else if (time >= 1200 && time < 1700) {\n  message =\
    \ \"Good afternoon!\";\n} else if (time >= 1700 && time < 2100) {\n  message =\
    \ \"Good evening!\";\n} else if (time >= 2100 && time <= 2359) {\n  message =\
    \ \"Good night!\";\n}\n\nalert(message);\n```\n\nIn this example, we establish\
    \ the current time by instantiating a new Date object and reading the hours and\
    \ minutes values from it. The Date object is set to the date and time at the moment\
    \ it was instantiated. Now, since we need a four-digit number to represent our\
    \ time of day, and since hours and minutes can be in the single digits (if it's\
    \ two minutes past the hour, the minutes will be 2, not 02), we need to pad the\
    \ values. We check to see if the values we're given are less than 10. If so, we\
    \ pad them with a zero. By doing this, we're actually accomplishing two tasks\
    \ at once. By adding a \"0\" string to our digit rather than a numeric 0 (which\
    \ would do nothing), we're triggering type coercion and turning our digit into\
    \ a string. If, however, our hours or minutes value is in the double-digits, we\
    \ only convert it to a string by calling the toString method. Once we have both\
    \ the hours and minutes values, we concatenate them to receive a nice four-digit\
    \ representation, and then we convert it back to a number."
  mdcn: "\n## 比较运算符\n\n比较运算符用于比较两个值，并根据比较结果返回 `true` 或 `false`。因此，如果我们想知道10是否大于5，可以写成\
    \ `10 > 5`，这个比较会返回 `true`。然而，`10 > 11` 则会返回 `false`。\n\n## 相等（==）\n\n如果两个值相等，则返回\
    \ `true`。如果被比较的值类型不同，JavaScript 会先进行类型转换，然后进行严格比较。所以，如果值是一个数字和一个布尔值，它们会在比较前转换为数字。如果涉及字符串，则两个值都会在比较前转换为字符串。如果它们是对象，当两个值指向内存中的同一位置时，它们被认为是相等的：\n\
    \n```\n1 == 1      // 返回 true\n\"1\" == 1    // 返回 true（\"1\" 转换为 1）\n1 == true\
    \   // 返回 true\n0 == false  // 返回 true\n\"\" == 0     // 返回 true（\"\" 转换为 0）\n\
    \" \" == 0    // 返回 true（\" \" 转换为 0）\n\n0 == 1      // 返回 false\n1 == false \
    \ // 返回 false\n0 == true   // 返回 false\n\nvar x, y;   // 声明 x 和 y\nx = {};   \
    \  // 创建一个对象并赋值给 x\ny = x;      // 将 y 指向 x\nx == y;     // 返回 true（指向内存中的同一对象）\n\
    x == {};    // 返回 false（不是同一个对象）\n```\n\n## 不相等（!=）\n\n与相等相反，当值不相等时返回 `true`。上述的类型转换规则同样适用：\n\
    \n```\n1 != 1      // 返回 false\n\"1\" != 1    // 返回 false（\"1\" 转换为 1）\n1 != true\
    \   // 返回 false\n0 != false  // 返回 false\n\"\" != 0     // 返回 false（\"\" 转换为 0）\n\
    \" \" != 0    // 返回 false（\" \" 转换为 0）\n\n0 != 1      // 返回 true\n1 != false \
    \ // 返回 true\n0 != true   // 返回 true\n\nvar x, y;   // 声明 x 和 y\nx = {};     //\
    \ 创建一个对象并赋值给 x\ny = x;      // 将 y 指向 x\nx != y;     // 返回 false（指向内存中的同一对象）\n\
    x != {};    // 返回 true（不是同一个对象）\n```\n\n## 严格相等（===）\n\n严格相等比较不进行类型转换。对于常规相等比较\
    \ `\"\" == 0` 会返回 true，但 `\"\" === 0` 则不会，因为空字符串不等于零：\n\n```\n1 === 1     // 返回\
    \ true\n\n\"1\" === 1   // 返回 false（\"1\" 未被转换）\n1 === true  // 返回 false\n0 ===\
    \ false // 返回 false\n\"\" === 0    // 返回 false（\"\" 未被转换）\n\" \" === 0   // 返回\
    \ false（\" \" 未被转换）\n0 === 1     // 返回 false\n1 === false // 返回 false\n0 === true\
    \  // 返回 false\n\nvar x, y;   // 声明 x 和 y\nx = {};     // 创建一个对象并赋值给 x\ny = x;\
    \      // 将 y 指向 x\nx === y;    // 返回 true（指向内存中的同一对象）\nx === {};   // 返回 false（不是同一个对象）\n\
    ```\n\n## 严格不相等（!==）\n\n与严格相等相反，当值不相等时返回 true。同样，比较前不进行任何类型转换：\n\n```\n1 !== 1\
    \     // 返回 false\n\n\"1\" !== 1   // 返回 true（\"1\" 未被转换）\n1 !== true  // 返回 true\n\
    0 !== false // 返回 true\n\"\" !== 0    // 返回 true（\"\" 未被转换）\n\" \" !== 0   //\
    \ 返回 true（\" \" 未被转换）\n0 !== 1     // 返回 true\n1 !== false // 返回 true\n0 !== true\
    \  // 返回 true\n\nvar x, y;   // 声明 x 和 y\nx = {};     // 创建一个对象并赋值给 x\ny = x;\
    \      // 将 y 指向 x\nx !== y;    // 返回 false（指向内存中的同一对象）\nx !== {};   // 返回 true（不是同一个对象）\n\
    ```\n\n## 大于（>）\n\n如果运算符左侧的值大于右侧的值，则返回 true。请注意，比较前会发生隐式类型转换：\n\n```\n0 > 1  //\
    \ 返回 false\n1 > 1  // 返回 false\n2 > 1  // 返回 true\n2 > \"\" // 返回 true（\"\" 转换为\
    \ 0）\n```\n\n## 大于或等于（>=）\n\n如果左侧的值大于或等于右侧的值，则返回 true。请注意，比较前会发生隐式类型转换：\n\n```\n\
    0 >= 1   // 返回 false\n1 >= 1   // 返回 true\n\"1\" >= 1 // 返回 true（\"1\" 转换为 1）\n\
    ```\n\n## 小于（<）\n\n如果运算符左侧的值小于右侧的值，则返回 true。请注意，比较前会发生隐式类型转换：\n\n```\n0 < 1  \
    \ // 返回 true\n1 < 1   // 返回 false\n2 < 1   // 返回 false\n2 < \"\"  // 返回 false（\"\
    \" 转换为 0）\n```\n\n## 小于或等于（<=）\n\n如果运算符左侧的值小于或等于右侧的值，则返回 true。请注意，比较前会发生隐式类型转换：\n\
    \n```\n0 <= 1   // 返回 true\n1 <= 1   // 返回 true\n\"1\" <= 1 // 返回 true（\"1\" 转换为\
    \ 1）\n2 <= 1   // 返回 false\n\"2\" <= 1 // 返回 false（\"2\" 转换为 2）\n```\n\n## 逻辑流程\n\
    \n现在我们已经介绍了比较运算符，就可以用它们来控制程序的逻辑流程。有时你的程序需要在不同的条件下执行不同的代码。例如，如果时间在中午之前，我们应该显示“早上好！”的消息；但如果是在一天中的晚些时候，“下午好！”甚至“晚上好！”会更合适。实现这一目标的方法是使用\
    \ `if..else` 语句来评估条件并分叉代码执行。\n\n图 2.1 展示了如何通过比较语句来控制逻辑流程。如果满足某个条件，代码会向特定方向分支。如果不满足，则进入下一个条件判断。在我们的流程图中，我们假设时间是19:00或晚上7点。然后我们将其与不同的时间范围进行检查，看它落在哪个区间。因此，如果时间值大于或等于00:00（午夜）且小于12:00（中午），我们将消息设置为“早上好！”；如果它大于或等于12:00且小于17:00（下午5点），我们将消息设置为“下午好！”；我们继续这种模式，直到检查完通往午夜的每个时间范围。\n\
    \n## 快速入门 JavaScript\n\n![图 2.1. 逻辑流程](img/ae490e66f6d11d20689f8bf3d738bef9_35_0.png)\n\
    \n图 2.1. 逻辑流程\n\n### && 符号\n\n你会注意到图 2.1 中使用了 && 符号。这是一个逻辑与（AND）运算符。此外，还有逻辑或（||）以及逻辑非（!）。与和或运算符将值转换为布尔值，然后返回其中一个值。非运算符反转操作数的布尔值。以下是逻辑与运算符的一些示例。请注意，如果两个值中的第一个计算结果为\
    \ false，则返回该值；否则返回第二个值：\n\n```\ntrue && true;  // 返回 true\ntrue && false; // 返回\
    \ false\nfalse && true; // 返回 false\n0 && 1;        // 返回 0\n0 && 2;        //\
    \ 返回 0\n1 && 0;        // 返回 0\n2 && 0;        // 返回 0\n\"foo\" && \"bar\" //\
    \ 返回 \"bar\"\n```\n\n以下是逻辑或运算符的一些示例。请注意，如果两个值中的第一个计算结果为 **true**，则返回该值；否则返回第二个值：\n\
    \n```\ntrue || true;  // 返回 true\ntrue || false; // 返回 true\nfalse || true; //\
    \ 返回 true\n0 || 1;        // 返回 1\n0 || 2;        // 返回 2\n1 || 0;        // 返回\
    \ 1\n2 || 0;        // 返回 2\n\"foo\" || \"bar\"; // 返回 foo\n```\n\n以下是逻辑非运算符的一些示例。请注意它如何反转操作数的布尔值：\n\
    \n```\n!true;  // 返回 false\n!false; // 返回 true\n!0;     // 返回 true\n!1;     //\
    \ 返回 false\n!\"foo\"; // 返回 false\n```\n\n让我们编写一些代码来实现图 2.1 所表示的功能：\n\n```\n**time-of-day.html（摘录）**\n\
    \nvar d, hours, minutes, time, message;\n\n// 获取当前时间的小时和分钟组成部分\nd = new Date();\n\
    hours = d.getHours();\nminutes = d.getMinutes();\n\n// 确保小时是双位数字符串\nif (hours\
    \ < 10) {\n  hours = \"0\" + hours; // 将小时转换为字符串\n} else {\n  hours = hours.toString();\n\
    }\n\n// 确保分钟是双位数字符串\nif (minutes < 10) {\n  minutes = \"0\" + minutes; // 将分钟转换为字符串\n\
    } else {\n  minutes = minutes.toString();\n}\n\n// 将小时和分钟连接成一个四位数\n// 表示 24 小时制的时间\n\
    time = Number(hours + minutes);\n\nif (time >= 0000 && time < 1200) {\n  message\
    \ = \"早上好！\";\n} else if (time >= 1200 && time < 1700) {\n  message = \"下午好！\"\
    ;\n} else if (time >= 1700 && time < 2100) {\n  message = \"晚上好！\";\n} else if\
    \ (time >= 2100 && time <= 2359) {\n  message = \"晚安！\";\n}\n\nalert(message);\n\
    ```\n\n在这个例子中，我们通过实例化一个新的 Date 对象并从中读取小时和分钟值来确定当前时间。Date 对象被设置为其实例化时的日期和时间。现在，由于我们需要一个四位数来表示一天中的时间，并且小时和分钟可能是一位数（如果是两点过两分，分钟数是2，而不是02），我们需要填充这些值。我们检查给定的值是否小于10。如果是，我们用零来填充。通过这样做，我们实际上同时完成了两项任务。通过将字符串\
    \ \"0\" 添加到我们的数字而不是数字 0（这没有任何作用），我们触发了类型强制转换，将我们的数字变成了字符串。然而，如果我们的小时或分钟值已经是两位数，我们只通过调用\
    \ toString 方法将其转换为字符串。一旦我们有了小时和分钟的值，我们将它们连接起来得到一个漂亮的四位数表示，然后再将其转换回数字。\n"
