    \n## 使用函数进行面向对象编程\n\n不幸的是，对**面向对象编程（OOP）**是什么进行全面深入的解释超出了这本简短书籍的范围。但其基本要点是，OOP是一种编程风格，允许你在代码中将现实世界的物品表示为对象。一个对象可以表示一个物理元素，如人或水果，或者更抽象的东西，如银行账户或网络连接。对象存储数据（称为属性）和函数（称为方法），后者对数据进行操作。因此，一个表示银行账户的对象可能具有账户号码、余额和透支限额等属性，以及存款和取款等方法。\n\
