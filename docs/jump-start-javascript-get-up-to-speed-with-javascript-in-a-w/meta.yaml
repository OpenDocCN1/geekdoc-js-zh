    \ 网格线\n\n## 矩形\n\n我们将使用矩形来表示我们的柱状图，矩形是唯一原生支持的形状。虽然可以绘制任意复杂的形状，但只有矩形有专门的函数。在绘制矩形之前，我们需要执行一些画布操作。接着\
