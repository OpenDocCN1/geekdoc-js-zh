    \ JavaScript file and load it up from the HTML file.\n\n### In the HTML File\n\
    \nHTML provides a `<script>` tag, inside of which you can write executable JavaScript\
    \ code. Here's an example of a very simple HTML document with one line of JavaScript\
    \ that pops up an alert dialog with the message, Hello, world!:\n\n```\njs-in-html.html\n\
    \n<!doctype html>\n<html>\n  <head>\n    <title>Code inside an HTML document</title>\n\
    \    <script>\n      alert(\"Hello, world!\");\n    </script>\n  </head>\n  <body>\n\
    \  </body>\n</html>\n```\n\n### In a Separate File\n\nYou can also place the code\
    \ in a separate file and link to it. So, for example, we could place our alert\
    \ statement inside a file we name hello.js (the .js file extension indicates that\
    \ this is a JavaScript source file) and then link to it using the <script> tag's\
    \ src attribute like so:\n\n```\nexternal-js.html\n\n<!doctype html>\n<html>\n\
    \  <head>\n    <title>Code inside an HTML document</title>\n    <script src=\"\
    hello.js\"></script>\n  </head>\n  <body>\n  </body>\n</html>\n```\n\nNote that\
    \ you cannot have a self-closing <script> tag. In other words, the following will\
    \ fail to work:\n\n```\n<!-- This won't work -->\n<script src=\"hello.js\" />\n\
    ```\n\nYou must include both the start and end tags, even if there is nothing\
    \ inside them, as shown below:\n\n```\n<script src=\"hello.js\"></script>\n```\n\
    \n### Location of the <script> Tag\n\nWe'll be covering the DOM in detail later,\
    \ but for now it's important to know that when the browser reads an HTML document,\
    \ it converts the tags it encounters into an internal representation called the\
    \ Document Object Model, or DOM. You can then write JavaScript that interacts\
    \ with your HTML via manipulation of the DOM. Be aware that if you try to access\
    \ the DOM before the browser has had a chance to finish building it, you'll receive\
    \ errors.\n\nWhen you include a <script> tag in the document's head, the code\
    \ within it will execute right away, even if the DOM is yet to be built. So, any\
    \ reference to DOM elements will result in an error since the HTML inside the\
    \ <body> isn't there yet. There are two ways to deal with this. You can wrap your\
    \ code in the document's onload function, which the browser executes once it's\
    \ done constructing the DOM. Alternatively, you could include your script tag(s)\
    \ at the very end of the document's body, immediately before the closing </body>\
    \ tag.\n\nThe latter is the preferred method because when the browser constructs\
    \ the DOM, it fires off requests to the server for every <img> tag it encounters.\
    \ It won't call onload until all the images have finished loading. This means\
    \ that any JavaScript you'd like to run on the page will have to wait until all\
    \ the page's images and other resources are done loading. This may be insignificant\
    \ on pages with just a bit of text and an image or two. But, on pages with lots\
    \ of images, you'll have a noticeable delay before your scripts execute. Therefore,\
    \ it's better to place your scripts at the end of the document's body.\n\nHere's\
    \ an HTML document that includes embedded JavaScript as well as a reference to\
    \ an external JavaScript file. Though the code in the document's head references\
    \ nothing in the DOM, (it's a simple alert statement), it will only execute once\
    \ the scripts have loaded at the end of the document:\n\n```\n<!doctype html>\n\
    <html>\n  <head>\n    <title>Code inside an HTML document</title>\n    <script>\n\
    \      window.onload = function () {\n        alert(\"Hello, world!\");\n    \
    \  };\n    </script>\n  </head>\n  <body>\n    <h1>An example</h1>\n    <p>Here's\
    \ an example document with loads of images.</p>\n    <ul>\n      <li><img src=\"\
    pic1.jpg\" /></li>\n      <li><img src=\"pic2.jpg\" /></li>\n      <li><img src=\"\
    pic3.jpg\" /></li>\n      <!-- lots more -->\n    </ul>\n    <script src=\"hello.js\"\
    ></script>\n    <script src=\"another.js\"></script>\n    <script src=\"and-another.js\"\
    ></script>\n  </body>\n</html>\n```\n\n## Summary\n\nAfter reading this chapter,\
    \ you should be ready to jump into the world of JavaScript development. This chapter\
    \ has shown you how to work with JavaScript in your browser of choice. You’ve\
    \ also learned the various methods for incorporating JavaScript into web pages.\
    \ Now that you’re set up, the rest of the book will focus on the fundamentals\
    \ of the JavaScript language.\n\n# Chapter 2\n\n## Variables\n\nProgramming is\
    \ basically the manipulation of data. In order to manipulate it, though, we first\
    \ need to store it somewhere. In JavaScript, variables are the most basic form\
    \ of data storage. Just like in algebra, variables are representatives of information\
    \ we want to work with. Unlike algebra, though, there's no restriction to only\
    \ using letters. We can use whole words to more accurately describe what we're\
    \ dealing with like `name`, `tax`, `length`, or `width`. We can also use multiple\
    \ words combined together like `firstName`, `taskList`, or `timeToLive`. Notice\
    \ that the first word in each multi-word variable name is all lowercase, while\
    \ the first letter of each subsequent word is capitalized. This is known as **camel\
    \ casing**, and it is the naming convention used in the JavaScript community.\n\
    \n## First, a Quick Comment\n\nYou'll be seeing a lot of comments throughout the\
    \ code examples in this book, so it's best to explain what they are here. **Comments**\
    \ are bits of nonexecuting text that can be inserted into code to describe what's\
    \ going on. In JavaScript, comments come in two forms, single-line comments and\
    \ multiline comments. Single-line comments are indicated by two forward slashes\
    \ (`//`). Anything that follows the double slashes of a single-line comment is\
    \ considered nonexecuting text, but only until the end of that line. On the other\
    \ hand, multiline (or block) comments can span multiple lines. Multiline comments\
    \ begin with a slash star combination (/*) and continue until a star slash (*/)\
    \ combination is encountered.\n\nHere are some examples of single-line comments:\n\
    \n```\n// I'm about to declare a variable and give it a value\nvar myVariable\
    \ = \"Hello, world.\"; // Just did it!\n```\n\nAnd here's a multiline comment:\n\
    \n```\n/* I just declared a variable named myVariable and assigned\n   the value\
    \ \"Hello, world.\" to it. I preceded it with a\n   comment stating that I was\
    \ about to do just that, and then\n   followed it with another comment on the\
    \ same line stating\n   that I just did it. I'm now writing a really long comment\n\
    \   that needs more than one line, so I've made this one a\n   multiline comment.\n\
    */\n```\n\n### Declarations\n\nDeclaring a variable is simple enough:\n\n```\n\
    var task = \"Write the first chapter.\";\n```\n\nHere, we've declared a variable\
    \ named `task` using a variable declaration statement. Using the `var` keyword,\
    \ you can declare one or more variables and optionally initialize them with a\
    \ value. So, for example:\n\n```\nvar task = \"Write the first chapter.\",\n \
    \   complete = true;\n```\n\nWe've declared two variables (separated by a comma),\
    \ and assigned a string to the first and a Boolean value to the second (there's\
    \ more on variable types, such as string and Boolean, shortly). Note how we're\
    \ only using one declaration statement to declare and initialize both variables.\
    \ You can also use multiple declaration statements—one for each variable declaration."
  mdcn: "\n# Safari\n\n在Safari中启用控制台比在其他浏览器中稍显复杂。首先，你需要在菜单栏中启用**开发**菜单。为此，请按下 ⌘, (**command\
    \ comma**) 进入Safari设置，切换到**高级**选项卡，并勾选**在菜单栏中显示开发菜单**复选框，如图1.4所示。\n\n完成上述操作后，关闭选项窗口，然后按下\
    \ ⌥⌘C (**option command C**) 即可调出控制台，如图1.5所示。\n\n图1.5. Safari中的控制台\n\n# 快速入门 JavaScript\n\
    \n## 在HTML文件中使用JavaScript\n\n如果你希望跳过控制台，直接在HTML文档中工作，有两种方式：你可以直接在HTML文档中编写代码，或者将其写在单独的JavaScript文件中，然后从HTML文件加载它。\n\
    \n### 在HTML文件中\n\nHTML提供了`<script>`标签，你可以在其中编写可执行的JavaScript代码。下面是一个非常简单的HTML文档示例，其中包含一行JavaScript代码，它会弹出一个显示“Hello,\
    \ world!”消息的警告对话框：\n\n```\njs-in-html.html\n\n<!doctype html>\n<html>\n  <head>\n\
    \    <title>Code inside an HTML document</title>\n    <script>\n      alert(\"\
    Hello, world!\");\n    </script>\n  </head>\n  <body>\n  </body>\n</html>\n```\n\
    \n### 在单独的文件中\n\n你也可以将代码放在单独的文件中并链接到它。例如，我们可以将alert语句放入一个名为hello.js的文件（.js文件扩展名表示这是一个JavaScript源文件），然后使用`<script>`标签的src属性将其链接到HTML中，如下所示：\n\
    \n```\nexternal-js.html\n\n<!doctype html>\n<html>\n  <head>\n    <title>Code\
    \ inside an HTML document</title>\n    <script src=\"hello.js\"></script>\n  </head>\n\
    \  <body>\n  </body>\n</html>\n```\n\n请注意，你不能使用自闭合的`<script>`标签。换句话说，以下代码将无法正常工作：\n\
    \n```\n<!-- This won't work -->\n<script src=\"hello.js\" />\n```\n\n你必须同时包含开始和结束标签，即使它们之间没有任何内容，如下所示：\n\
    \n```\n<script src=\"hello.js\"></script>\n```\n\n### `<script>` 标签的位置\n\n我们将在后面详细介绍DOM，但现在需要了解的是，当浏览器读取HTML文档时，它会将遇到的标签转换为一种称为文档对象模型（DOM）的内部表示。然后，你可以编写通过操作DOM与HTML交互的JavaScript代码。请注意，如果浏览器尚未完成DOM构建就尝试访问它，将会收到错误信息。\n\
    \n当你在文档的`<head>`中包含`<script>`标签时，其中的代码会立即执行，即使DOM尚未构建完成。因此，对DOM元素的任何引用都将导致错误，因为`<body>`中的HTML内容还不存在。有两种解决方法：你可以将代码包装在文档的`onload`函数中，浏览器会在构建完DOM后执行该函数；或者，你可以将脚本标签放在文档`<body>`的末尾，紧接在结束的`</body>`标签之前。\n\
    \n后一种方法是首选，因为当浏览器构建DOM时，它会为遇到的每个`<img>`标签向服务器发送请求。在所有图片加载完成之前，它不会调用`onload`。这意味着你想在页面上运行的任何JavaScript都必须等到页面所有图片和其他资源加载完毕。在只有少量文本和一两张图片的页面上，这可能无关紧要。但在包含大量图片的页面上，脚本执行前会有明显的延迟。因此，最好将脚本放在文档`<body>`的末尾。\n\
    \n下面是一个包含内嵌JavaScript以及外部JavaScript文件引用的HTML文档。尽管文档`<head>`中的代码没有引用DOM中的任何元素（它只是一个简单的alert语句），但它只会在文档末尾的脚本加载完成后执行：\n\
    \n```\n<!doctype html>\n<html>\n  <head>\n    <title>Code inside an HTML document</title>\n\
    \    <script>\n      window.onload = function () {\n        alert(\"Hello, world!\"\
    );\n      };\n    </script>\n  </head>\n  <body>\n    <h1>An example</h1>\n  \
    \  <p>Here's an example document with loads of images.</p>\n    <ul>\n      <li><img\
    \ src=\"pic1.jpg\" /></li>\n      <li><img src=\"pic2.jpg\" /></li>\n      <li><img\
    \ src=\"pic3.jpg\" /></li>\n      <!-- lots more -->\n    </ul>\n    <script src=\"\
    hello.js\"></script>\n    <script src=\"another.js\"></script>\n    <script src=\"\
    and-another.js\"></script>\n  </body>\n</html>\n```\n\n## 小结\n\n阅读完本章后，你应该已经准备好投身JavaScript开发的世界了。本章向你展示了如何在你选择的浏览器中使用JavaScript。你还了解了将JavaScript整合到网页中的各种方法。既然环境已经搭建好，本书的其余部分将专注于JavaScript语言的基础知识。\n\
    \n# 第2章\n\n## 变量\n\n编程本质上是数据的操纵。然而，为了操纵数据，我们首先需要将其存储在某处。在JavaScript中，变量是最基本的数据存储形式。就像代数一样，变量是我们想要处理的信息的代表。不过，与代数不同的是，没有限制只能使用字母。我们可以使用完整的单词来更准确地描述我们正在处理的内容，比如`name`、`tax`、`length`或`width`。我们也可以使用多个单词组合，如`firstName`、`taskList`或`timeToLive`。请注意，每个多词变量名的第一个单词全部小写，而后续单词的首字母大写。这被称为**驼峰命名法**，是JavaScript社区使用的命名约定。\n\
    \n## 首先，简要说一下注释\n\n在本书的代码示例中，你会看到大量的注释，所以最好在这里解释一下它们是什么。**注释**是插入到代码中用于描述代码功能的非执行文本。在JavaScript中，注释有两种形式：单行注释和多行注释。单行注释由两个斜杠（`//`）表示。在单行注释的双斜杠之后的所有内容都被视为非执行文本，但仅限于该行结束之前。另一方面，多行（或块）注释可以跨越多行。多行注释以斜杠星号组合（/*）开始，直到遇到星号斜杠（*/）组合结束。\n\
    \n以下是一些单行注释的示例：\n\n```\n// I'm about to declare a variable and give it a value\n\
    var myVariable = \"Hello, world.\"; // Just did it!\n```\n\n这是一个多行注释：\n\n```\n\
    /* I just declared a variable named myVariable and assigned\n   the value \"Hello,\
    \ world.\" to it. I preceded it with a\n   comment stating that I was about to\
    \ do just that, and then\n   followed it with another comment on the same line\
    \ stating\n   that I just did it. I'm now writing a really long comment\n   that\
    \ needs more than one line, so I've made this one a\n   multiline comment.\n*/\n\
    ```\n\n### 声明\n\n声明一个变量非常简单：\n\n```\nvar task = \"Write the first chapter.\";\n\
    ```\n\n在这里，我们使用变量声明语句声明了一个名为`task`的变量。使用`var`关键字，你可以声明一个或多个变量，并可选择用值初始化它们。例如：\n\
    \n```\nvar task = \"Write the first chapter.\",\n    complete = true;\n```\n\n\
    我们声明了两个变量（用逗号分隔），并将一个字符串赋值给第一个变量，将一个布尔值赋值给第二个变量（关于变量类型，如字符串和布尔值，稍后会详细介绍）。注意我们如何只用一个声明语句来声明和初始化两个变量。你也可以使用多个声明语句——每个变量声明一个。\n"
