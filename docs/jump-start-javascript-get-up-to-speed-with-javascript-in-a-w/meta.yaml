    > Why All The Quirks?

    JavaScript''s development as a programming language has followed a rather unique
    path. In a language such as C or Java, painstaking care is taken to ensure that
    programs behave as predictably as possible across a range of environments. In
    contrast, much of JavaScript''s development occurred during the period of the
    so-called browser wars<sup>2</sup>. During this time vendors were not particularly
    concerned about interoperability with competing products. The legacy of this is
    a rather fragmented client-side JavaScript environment. The practical implication
    of all this is that when you write your client-side application, you will need
    to make a conscious decision about which browsers you are planning to support.
    According to best practices, you should try to support as many browsers as consistently
    as possible. You will need to test your application using each and every single
    browser to make sure that your program works as desired. As mentioned above, a
    library such as jQuery may make this problem much more tractable.


