    # What can you do with arrays?


    Now that we’ve covered the basics of an array and how data is stored in them,
    let’s look at what you can do with them. There are seven mutator methods that
    let you modify the contents of the array: `pop`, `push`, `reverse`, `shift`, `sort`,
    `splice`, and `unshift`. There are also four widely supported accessor methods
    that don’t modify the array but allow you to access its contents in different
    ways: `concat`, `join`, `slice`, and `toString`.


    Since JavaScript support varies from browser to browser and from browser version
    to browser version, there are varying degrees of support to contend with. For
    example, browsers implementing JavaScript 1.6 and higher also support the `indexOf`
    and `lastIndexOf` accessor methods. They’ll also support the following iteration
    methods: `forEach`, `every`, `some`, `filter`, and `map`. Finally, browsers supporting
    JavaScript 1.8 or higher will also support the `reduce` and `reduceRight` iteration
    methods.


