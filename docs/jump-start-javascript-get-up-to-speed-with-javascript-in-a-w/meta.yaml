    **Shortening Code With The Ternary Operator**


    Sometimes, if you want to avoid having a verbose `if...else` statement in your
    code, you can shorten it by using the ternary operator. Here''s the way it''s
    structured: `condition ? expression1 : expression2`. So we could write the first
    `if...else` in the previous example like this instead:


    `hours = (hours < 10) ? "0" + hours : hours.toString();`


    Sometimes, this syntax makes it easier and cleaner to read your code. Sometimes
    it doesn''t. Use your judgment and pick the one that''s easiest to understand
