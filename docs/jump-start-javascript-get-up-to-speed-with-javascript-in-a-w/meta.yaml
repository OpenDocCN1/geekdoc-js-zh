    \ = function(e) {\n    var target, idx, targetClass;\n\n    preventDefault(e);\n\
    \    target = getTarget(e);\n    idx = getIndex(target);\n\n    if (idx) {\n \
    \       idx = Number(idx);\n        targetClass = target.getAttribute('class');\n\
    \n        if (targetClass === 'highpriority' || targetClass ===\n            'lowpriority'\
    \ || targetClass === 'normalpriority') {\n            setPriority(idx, target.getAttribute(\"\
    value\"));\n        } else if (target.className.match(\"delete-task\")) {\n  \
    \          removeTask(idx);\n        } else if (target.type === \"checkbox\")\
    \ {\n            toggleComplete(idx);\n        }\n    }\n};\n```\n\nFirstly, we\
    \ retrieve the index of the item and store it into the variable idx. If this is\
    \ a valid value, we take the class of the HTML element and store it in the variable\
    \ **targetClass**. We then test for three separate cases. In the first case, **targetClass**\
    \ indicates the user has clicked on priority sorting. In this case. we retrieve\
    \ the value of the HTML element and use this number to set the priority of the\
    \ task. In the second case, **targetClass** indicates that the user has clicked\
