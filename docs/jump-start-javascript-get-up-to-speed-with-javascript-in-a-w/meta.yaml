    button\")."
  - '[PAGE 125]


    I should point out that what `getElementsByTagName` returns is actually a `NodeList`.
    For all intents and purposes, a `NodeList` behaves much like an array in that
    it''s an ordered collection of nodes. The similarity ends there, though, as a
    `NodeList` has none of an array''s methods. In other words, it''s not possible
    to sort, join, or reverse a `NodeList`''s contents like you could an array''s.
    What''s more, a `NodeList` is live.


    As mentioned earlier about `Node`s, the contents of a `NodeList` always reflect
    the current state of the underlying DOM. If a `Node` is deleted, the `NodeList`
    reflects that without you having to go and retrieve the list again. Element nodes,
    of which the majority of a DOM''s nodes are, have a few other methods you can
    use to work with them.


    # getAttribute


    With `getAttribute`, you can read an attribute''s value. Given `<div name="foo"></div>`,
    `myDiv.getAttribute("name")` will return `"foo"`.


    # removeAttribute


    You can completely remove an attribute from an element using `removeAttribute`.
    This is done by passing in the attribute name you want removed. So, given `<div
    name="foo"></div>`, `myDiv.removeAttribute("name")` will leave the `<div>` as
    `<div></div>`. Note that `removeAttribute` returns no value.


    # setAttributeNode


    We saw this one in action earlier. After having created a new attribute node with
    `createAttribute`, we can add it to an element using `setAttributeNode`:


    ```

    var el, attr;


    el = document.createElement("div");

    attr = document.createAttribute("name");

    attr.nodeValue = "foo";

    el.setAttributeNode(attr);

    ```


    It''s important to remember the step where you assign a value to your attribute
    with the `nodeValue` property. Otherwise, instead of a `<div>` that looks like
    `<div name="foo"></div>`, you''ll end up with `<div name></div>`.'
  - '[PAGE 126]


    # removeAttributeNode


    Just as with `removeAttribute`, `removeAttributeNode` can be used to remove an
    attribute from an element. The difference with `removeAttributeNode` is that you
    need to pass in a reference to the attribute node that you want removed. In the
    case of our recent example, we’d do the following:


    ```

    var el, attr;


    el = document.createElement("div");

    attr = document.createAttribute("name");

    attr.nodeValue = "foo";

    el.setAttributeNode(attr);

    el.removeAttributeNode(attr);

    ```


    # DOM Level 2


    The second iteration of the W3C''s DOM$^5$ specification came out with a lot of
    namespace-friendly versions of existing DOM methods. This was to accommodate namespacing
    in XML documents. As mentioned at the start of this chapter, the DOM is designed
    to work with both HTML and XML, and since the W3C saw XML as the next logical
    step in HTML''s evolution, it began to augment the DOM with XML-friendly features.


    Since we''re only concerned with the HTML DOM in this book, we can ignore them.
    The only noteworthy additions to the DOM in DOM2, therefore, are `getElementById`,
    `hasAttributes`, and `hasAttribute`.


    # getElementById


    This addition to the DOM is fairly significant, as it allows the targeting of
    an element in a document with a unique `id` value. If no ids match, `null` is
    returned. Otherwise, a reference to the element with the matching `id` value is
    returned.


    > **On Uniqueness**


    The part about the `id` being unique is important. If your document contains more
    than one element with the same identifier, `getElementById` will more than'
  - '[PAGE 127]


    # hasAttributes


    If you need to know if a given element has any attributes attached to it, you
    can use `hasAttributes`. The method responds with a Boolean value, where `true`
    indicates the presence of attributes, and `false` shows otherwise.


    # hasAttribute


    If you want to check for the existence of a particular attribute, use `hasAttribute`.
    It also returns a Boolean value. `true` is returned if the attribute you''re looking
    for exists, while `false` indicates that it doesn''t. Therefore, given `<div id="foo"></div>`,
    `myDiv.hasAttribute("id")` will return `true`, while `myDiv.hasAttribute("name")`
    will return `false`.


    # DOM Level 3


    A bunch of new attributes and methods were specified in the DOM Level 3 specification,
    but none of them are particularly useful for day-to-day web development, nor are
    they broadly implemented. What''s more, a majority of them concern themselves
    with the XML DOM.


    A couple you may find interesting are the `textContent` attribute and the `isEqualNode`
    method.


    Given the HTML `<p id="greeting"></p>`, its text content can be set to the string
    "Good morning!":


    ```

    var el = document.getElementById("greeting");


    el.textContent = "Good morning!";

    ```'
