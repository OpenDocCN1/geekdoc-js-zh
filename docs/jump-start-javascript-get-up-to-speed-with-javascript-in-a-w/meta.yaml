    \ and `Task` are treated as entirely different variables. Likewise, when we look\
    \ at naming functions later on, case sensitivity will be important. Just remember\
    \ to always use the same case when referring to a variable.\n\n**Terminate Each\
    \ Line**\n\nThe semicolon at the end of the line tells JavaScript that this line\
    \ of code is complete. If you leave it out, JavaScript will attempt to insert\
    \ a semicolon when it's reading your code. This is known as automatic semicolon\
    \ insertion. As a general guideline, you shouldn't leave your program's functionality\
    \ to guesswork. It's best to be sure and terminate each line with a semicolon.\n\
    \nOne last point about variable declaration and initialization. It's best to keep\
    \ the two separate. I've run into trouble in the past when using a debugger to\
    \ walk through my code. When variables are declared and initialized in the same\
    \ statement, the debugger skips over the whole line in one step. If there's any\
    \ trouble with one of the initializations, you won't be able to examine each assignment\
    \ individually. Instead, it's better declare all your variables together and initialize\
    \ them all separately, like so:\n\n```javascript\n// declaration\nvar task, complete;\n\
    \n// initialization\ntask = \"Write the first chapter.\";\ncomplete = true;\n\
    ```\n\nLater, we'll see how it's possible to perform calculations and operations\
    \ during value assignment. We'll also see how doing so can make debugging more\
    \ difficult.\n\n**Saving Space**\n\nSome examples in this book may go against\
    \ this rule, declaring and initializing variables in a single statement. This\
    \ is usually done in order to save page space.\n\n## Types\n\nIf you've had any\
    \ exposure to programming languages like C or Java, you've likely noticed that\
    \ there was no specification that we wanted `task` to hold a string (as opposed\
    \ to a Boolean or numeric value). This is because JavaScript is a **loosely typed\
    \ language**, unlike C or Java, which are strongly typed. This means that even\
    \ though JavaScript does recognize types internally, you don't need to explicitly\
    \ declare a variable to be of a certain type. You can also change a variable's\
    \ type on the fly. JavaScript tries to figure out what you're trying to do with\
    \ your variables instead of relying on you to explicitly say it. In fact, there's\
    \ no way to tell JavaScript that you want your variable to be of a certain type,\
    \ apart from assigning a value of that type to the variable.\n\nThere are six\
    \ data types you can work with: number, string, Boolean, null, undefined, and\
    \ object.\n\n## Number\n\nUnlike in other languages, the only numeric type JavaScript\
    \ has is `Number`. According to the ECMAScript standard<sup>1</sup>, `Number`\
    \ holds a \"double-precision 64-bit binary format IEEE 754 value.\" According\
    \ to the standard, `Number` can hold a \"set of all possible Number values including\
    \ the special Not-a-Number (NaN) values, positive infinity, and negative infinity.\"\
    \n\n> ### When Is a Number Not a Number?\n\n**Not-a-Number** or `NaN` is a special\
    \ value that's returned by JavaScript when math functions fail (`Math.abs(\"foo\"\
    )`), or when a function trying to parse a number fails (`Number(\"foo\")`). `NaN`\
    \ is special because it's the only value in JavaScript that doesn't equal itself.\
    \ In other words, both `NaN == NaN` and `NaN === NaN` return `false` when logically\
    \ you'd expect them to be `true` since `NaN` is `NaN`. However, true to its meaning\
    \ `NaN` itself is \"not a number\" and therefore is not equal to itself.\n\nThere\
    \ is an `isNaN` function to verify if a returned value is actually `NaN`, but\
    \ be careful because the results can be confusing. The reason is because `isNaN`\
    \ first tries to convert the value that you pass it into a number through a process\
    \ called type conversion (which we'll cover later) and, as a result, some values\
    \ convert into numbers while others don't. For example, it will return **true**\
    \ for `isNaN(NaN)`, `undefined`, and an object literal ({})—they are all not numbers.\
    \ It will not, however, return **true** for values of `true` and `null`, which\
    \ are also not numbers.\n\nWhere it becomes even trickier is in dealing with strings.\
    \ It will return **false** for numbers in strings such as `isNaN(\"42\")`, since\
    \ \"42\" is converted to 42, which is a number. It will also return **false**\
    \ for empty strings (\"\") and strings consisting only of spaces (\" \") since\
    \ they'll convert to 0, which is also a number. But strings with text in them\
    \ that fail when parsed as a number (like `isNaN(\"foo\")`) will return `NaN`.\
    \ So, even though \"foo\" is clearly not equal to NaN, it returns **true** when\
    \ you pass it into `isNaN`.\n\nThe only truly reliable way to test for whether\
    \ a value is actually `NaN` is to compare it against itself. Since `NaN` is the\
    \ sole value that doesn't equal itself, it will return **false** and you'll know\
    \ that what you're dealing with is in fact `NaN`.\n\n<sup>1</sup> http://www.ecma-international.org/publications/standards/Ecma-262.htm\n\
    \n## String\n\nStrings holds all possible string values. Some examples include:\n\
    \n```javascript\n\"Hello, world!\"\n\"1, 2, 3, 4, 5\"\n\"!@#$%^&*()_+\"\n```\n\
    \n## Boolean\n\nBoolean variables can only hold the values `true` or `false`.\n\
    \n## Undefined\n\nUndefined is an odd data type because it represents the state\
    \ of a variable that's been declared but without a value assigned to it. By definition,\
    \ though, the fact that the variable exists means that it's defined, which is\
    \ what makes this data type unusual.\n\n## Null\n\nNull is used when you want\
    \ to declare a variable and intentionally express the absence of a value (unlike\
    \ `undefined` where the value is simply absent).\n\n## Object\n\nAn object is\
    \ a collection of properties. The properties can be any of the previously mentioned\
    \ types, as well as other objects and functions (which we’ll cover later).\n\n\
    ## Operations\n\nHaving data is great, but doing something with it is better.\
    \ You may have a couple of strings that you want to concatenate, or a few numbers\
    \ you’d like to do some math with. Well, it’s fairly straightforward to perform\
    \ these tasks using JavaScript. Concatenating strings is as easy as using the\
    \ + symbol:\n\n```javascript\nvar fname, lname, fullName;\n\nfname = \"John\"\
    ;\nlname = \"Doe\";\nfullName = fname + \" \" + lname; // fullName is \"John Doe\"\
    \n```\n\nMath operations are carried out as you’d expect, using the addition (+),\
    \ subtraction (-), multiplication (*), division (/), and modulus (%) operators:\n\
    \n```javascript\nvar widgets, gizmos, inventory;\n\nwidgets = 1043;\ngizmos =\
    \ 2279;\ninventory = widgets + gizmos; // inventory is 3322\n```\n\nSimilarly:\n\
    \n```javascript\nvar provincial, federal, subtotal, total;\n\nprovincial = 0.095;\n\
    federal = 0.05;\nsubtotal = 10;\ntotal = subtotal + (subtotal * provincial)\n\
    + (subtotal * federal); // total is 11.45\n```\n\nFinally, you can use the remainder\
    \ (%) operator to end up with just the remainder of a division returned to you.\
    \ So, for example, 10 % 3 will return 1.\n\n## The Dangers of Loose Typing\n\n\
    Although JavaScript does its best to figure out what you're doing with your variables,\
    \ and has no requirement for strong typing, it's important to consider the type\
    \ of data your variables will be holding; otherwise, you may run into some problems.\n\
    \nFor example, consider:\n\n```javascript\nvar johnTaskCount = 11,\n    janeTaskCount\
    \ = \"42\",\n    totalTaskCount = johnTaskCount + janeTaskCount;\n```\n\nAt a\
    \ glance, John has 11 tasks and Jane has 42, which should total 53 tasks. However,\
    \ since the value of `janeTaskCount` is a string, JavaScript sees the plus symbol\
    \ on the third line as an attempted concatenation instead of an addition. The\
    \ result is \"1142\" instead of the expected number, 53.\n\nFor the right result,\
    \ we have to ensure that both variables hold actual numbers and not strings, like\
    \ this:\n\n```javascript\nvar johnTaskCount = 11,\n    janeTaskCount = 42,\n \
    \   totalTaskCount = johnTaskCount + janeTaskCount;\n```\n\n## Type Conversion\
    \ (aka Type Coercion)\n\nWhen JavaScript is given an operation involving conflicting\
    \ variable types, it tries to normalize them first before performing the operation.\
    \ This is the case in arithmetic or string operations (as shown) or comparisons\
    \ (which we'll cover in a moment). Because you can't add a word to a number, it\
    \ first converts the number to a string and then concatenates the two (like we\
    \ saw a moment ago). Likewise, if you attempt to add a number to a Boolean (`true`\
    \ or `false`), it will first convert the Boolean to its numeric representation—1\
    \ for `true` and 0 for `false`—and then add that to the number. This is a very\
    \ important aspect of the language to understand, as not knowing about it could\
    \ lead to unintentional errors cropping up in your programs."
  mdcn: "\n## 大小写敏感问题\n\nJavaScript 是一种区分大小写的语言，因此 `task` 和 `Task` 会被视为完全不同的变量。同样，当我们稍后讨论函数命名时，大小写敏感性也很重要。只需记住，引用变量时始终使用相同的大小写。\n\
    \n**结束每一行**\n\n行末的分号告诉 JavaScript 该行代码已结束。如果省略分号，JavaScript 在读取代码时会尝试自动插入一个分号。这被称为**自动分号插入**。作为一般原则，你不应该让程序的功能依赖于猜测。最好在每一行末尾都加上分号以确保明确性。\n\
    \n关于变量声明和初始化，还有一点：最好将两者分开。我过去在使用调试器单步调试代码时遇到过问题。如果变量在同一语句中声明并初始化，调试器会一步跳过整个行。如果初始化有任何问题，你将无法单独检查每个赋值。因此，最好将所有变量一起声明，然后分别初始化，如下所示：\n\
    \n```javascript\n// 声明\nvar task, complete;\n\n// 初始化\ntask = \"Write the first\
    \ chapter.\";\ncomplete = true;\n```\n\n稍后，我们将看到如何在赋值时执行计算和操作。我们还将了解这样做如何使调试变得更加困难。\n\
    \n**节省空间**\n\n本书中的一些示例可能会违反此规则，在单个语句中声明和初始化变量。这样做通常是为了节省页面空间。\n\n## 类型\n\n如果你曾接触过像\
    \ C 或 Java 这样的编程语言，你可能注意到我们没有指定 `task` 要保存一个字符串（而不是布尔值或数值）。这是因为 JavaScript 是一种**动态类型语言**，不像\
    \ C 或 Java 那样是强类型语言。这意味着，尽管 JavaScript 在内部确实识别类型，但你不需要显式声明变量为特定类型。你还可以随时改变变量的类型。JavaScript\
    \ 会尝试推断你想要对变量做什么，而不是依赖你明确地说明。事实上，除了向变量赋值特定类型的值之外，没有其他方法可以告诉 JavaScript 你希望变量具有特定类型。\n\
    \n你可以使用六种数据类型：数字、字符串、布尔值、null、undefined 和对象。\n\n## 数字\n\n与其他语言不同，JavaScript 唯一的数值类型是\
    \ `Number`。根据 ECMAScript 标准<sup>1</sup>，`Number` 保存一个“双精度 64 位二进制格式 IEEE 754 值”。根据该标准，`Number`\
    \ 可以保存“所有可能数值的集合，包括特殊的非数字（NaN）值、正无穷大和负无穷大。”\n\n> ### 什么时候数字不是数字？\n\n**非数字**（`NaN`）是一个特殊值，当数学函数失败（`Math.abs(\"\
    foo\")`）或试图解析数字的函数失败（`Number(\"foo\")`）时由 JavaScript 返回。`NaN` 很特殊，因为它是 JavaScript\
    \ 中唯一不等于自身的值。换句话说，在逻辑上你期望 `NaN == NaN` 和 `NaN === NaN` 返回 `true`（因为 `NaN` 就是 `NaN`），但它们实际上都返回\
    \ `false`。然而，`NaN` 本身的含义就是“非数字”，因此它不等于自身。\n\n有一个 `isNaN` 函数可以用来验证返回的值是否确实是 `NaN`，但要小心，因为结果可能会令人困惑。原因是\
    \ `isNaN` 首先尝试将传入的值通过称为**类型转换**（我们稍后会介绍）的过程转换为数字，结果是一些值可以转换为数字，而另一些则不能。例如，对于 `isNaN(NaN)`、`undefined`\
    \ 和对象字面量（{}），它会返回 **true**——它们都不是数字。但是，对于 `true` 和 `null`（它们也不是数字），它不会返回 **true**。\n\
    \n在处理字符串时，情况会变得更加棘手。对于字符串中的数字，如 `isNaN(\"42\")`，它会返回 **false**，因为 \"42\" 被转换为\
    \ 42，这是一个数字。对于空字符串（\"\"）和仅由空格组成的字符串（\" \"），它也会返回 **false**，因为它们将被转换为 0，这也是一个数字。但是，包含文本的字符串（如\
    \ `isNaN(\"foo\")`）在解析为数字时失败，将返回 `NaN`。因此，即使 \"foo\" 明显不等于 `NaN`，当你将其传入 `isNaN`\
    \ 时，它会返回 **true**。\n\n唯一真正可靠的方法来测试一个值是否确实是 `NaN`，是将其与自身进行比较。由于 `NaN` 是唯一不等于自身的值，它会返回\
    \ **false**，你就可以知道你处理的实际上是 `NaN`。\n\n<sup>1</sup> http://www.ecma-international.org/publications/standards/Ecma-262.htm\n\
    \n## 字符串\n\n字符串保存所有可能的字符串值。一些示例包括：\n\n```javascript\n\"Hello, world!\"\n\"1, 2,\
    \ 3, 4, 5\"\n\"!@#$%^&*()_+\"\n```\n\n## 布尔值\n\n布尔变量只能保存 `true` 或 `false` 值。\n\
    \n## Undefined\n\nUndefined 是一种奇怪的数据类型，它表示一个已声明但未赋值的变量的状态。然而，根据定义，变量存在就意味着它是已定义的，这使得这种数据类型很不寻常。\n\
    \n## Null\n\n当你想要声明一个变量并有意表示值的缺失（不同于 `undefined` 那种值 simply absent 的情况）时，使用 Null。\n\
    \n## 对象\n\n对象是属性的集合。属性可以是前面提到的任何类型，也可以是其他对象和函数（我们稍后会介绍）。\n\n## 操作\n\n拥有数据很好，但能对数据做点什么更好。你可能有几个字符串想要连接，或者几个数字想要进行一些数学运算。使用\
    \ JavaScript 执行这些任务相当简单。连接字符串就像使用 + 号一样简单：\n\n```javascript\nvar fname, lname,\
    \ fullName;\n\nfname = \"John\";\nlname = \"Doe\";\nfullName = fname + \" \" +\
    \ lname; // fullName 是 \"John Doe\"\n```\n\n数学运算正如你所期望的那样进行，使用加法（+）、减法（-）、乘法（*）、除法（/）和取模（%）运算符：\n\
    \n```javascript\nvar widgets, gizmos, inventory;\n\nwidgets = 1043;\ngizmos =\
    \ 2279;\ninventory = widgets + gizmos; // inventory 是 3322\n```\n\n类似地：\n\n```javascript\n\
    var provincial, federal, subtotal, total;\n\nprovincial = 0.095;\nfederal = 0.05;\n\
    subtotal = 10;\ntotal = subtotal + (subtotal * provincial)\n+ (subtotal * federal);\
    \ // total 是 11.45\n```\n\n最后，你可以使用取模（%）运算符来只获取除法的余数。因此，例如，10 % 3 将返回 1。\n\n##\
    \ 动态类型的危险\n\n尽管 JavaScript 会尽力推断你对变量的操作，并且不需要强类型，但考虑变量将保存的数据类型仍然很重要；否则，你可能会遇到一些问题。\n\
    \n例如，考虑：\n\n```javascript\nvar johnTaskCount = 11,\n    janeTaskCount = \"42\"\
    ,\n    totalTaskCount = johnTaskCount + janeTaskCount;\n```\n\n乍一看，John 有 11 个任务，Jane\
    \ 有 42 个，总共应该是 53 个任务。然而，由于 `janeTaskCount` 的值是一个字符串，JavaScript 将第三行中的加号视为尝试连接，而不是加法。结果是\
    \ \"1142\"，而不是预期的数字 53。\n\n为了得到正确的结果，我们必须确保两个变量都保存实际的数字，而不是字符串，像这样：\n\n```javascript\n\
    var johnTaskCount = 11,\n    janeTaskCount = 42,\n    totalTaskCount = johnTaskCount\
    \ + janeTaskCount;\n```\n\n## 类型转换（又称类型强制转换）\n\n当 JavaScript 遇到涉及冲突变量类型的操作时，它会尝试先将它们规范化，然后再执行操作。这适用于算术或字符串操作（如示例所示）或比较（我们稍后会介绍）。因为不能将单词与数字相加，它会先将数字转换为字符串，然后将两者连接起来（正如我们刚才看到的）。同样，如果你尝试将数字与布尔值（`true`\
    \ 或 `false`）相加，它会先将布尔值转换为其数字表示——`true` 为 1，`false` 为 0——然后将其与数字相加。这是理解该语言的一个非常重要的方面，不了解这一点可能会导致你的程序中出现无意的错误。\n"
