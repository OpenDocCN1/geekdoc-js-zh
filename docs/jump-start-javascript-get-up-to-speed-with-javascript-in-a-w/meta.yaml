    \ on the newer built-in array iteration functions: forEach, every, some, filter,\
    \ map, reduce, and reduceRight. These are higher order functions because they\
    \ accept functions as their arguments. They can be used instead of loops to facilitate\
    \ programming in a more functional style. For example, suppose we have an array\
    \ and we wish to add up the even numbers:\n\n```\nvar myNums = [3, 5, 10, 4, 2,\
    \ 1, 16, 7];\n```\n\nUsing a loop-based approach would yield a similar result\
    \ to this:\n\n```\nvar sum = 0;\n\nfor (var i = 0; i < myNums.length; i++) {\n\
    \    if (myNums[i] % 2 === 0) {\n```"
