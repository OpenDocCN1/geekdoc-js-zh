    \ 现在是:\n// [\"Pay phone bill\",\n//    \"World domination\",\n//    \"Walk the\
    \ dog\"]\n```\n\n我们刚刚告诉 `splice` 从索引 1 开始，也就是 \"Write best-selling novel\" 的位置，移除一个项（移除了\
