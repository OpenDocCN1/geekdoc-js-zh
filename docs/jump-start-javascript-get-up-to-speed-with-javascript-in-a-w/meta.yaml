    \ \"#004CB3\");\n        context.fillStyle = gradient;\n        context.fillRect(startX,\
    \ startY, width, endY);\n    }\n}\n```\n\nTo draw the rectangles, we begin by\
    \ looping through each value in our data set. In this case, there are only two\
