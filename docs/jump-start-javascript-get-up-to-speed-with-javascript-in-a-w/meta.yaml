    \ to compute the square of each item in arr. The results are then returned and\
    \ stored in squared:\n\n```\nvar arr = [1, 2, 3, 4, 5];\nvar squared;\n\nsquared\
    \ = arr.map(function(num) {\n  return (num * num);\n}); // squared is [1, 4, 9,\
    \ 16, 25]\n```\n\n## every (JavaScript 1.6)\n\nSometimes, you need to validate\
    \ that the data in an array conforms to a set of criteria. You could, as in the\
    \ previous example, run a manual test using either a traditional for loop or the\
    \ forEach method. Or you could just use the every method that runs a callback\
    \ function against each item in the array. It will return `true` if they all conform,\
    \ or `false` if one or more fails to:\n\n```\nvar arr, isValid;\n\narr = [1, 2,\
    \ 3, 4, 5];\nisValid = arr.every(function(num) {\n    return (num < 10);\n});\
    \ // isValid is true\n```\n\nIn this example, we're using the `every` method to\
    \ check that every item in our array is less than 10. The `every` method loops\
    \ over the array, and for each item it runs the function we've included within\
    \ its parentheses. The current array item is passed in as `num`, and our expression\
    \ (`return (num < 10)`) checks to see if the number is less than ten, returning\
    \ `true` or `false`. `every` monitors the response from our code and if we ever\
    \ return `false`, it kicks out of the loop and returns `false`. We capture its\
    \ response in the variable `isValid`. In the case above, the `every` method will\
    \ return `true`. If we change our expression to check if numbers are greater than\
    \ 3, then `isValid` will be `false`:\n\n```\nvar arr, isValid;\n\narr = [1, 2,\
    \ 3, 4, 5];\nisValid = arr.every(function(num) {\n    return (num < 3);\n}); //\
    \ isValid is false\n```\n\n## some (JavaScript 1.6)\n\nYou can use `some` to check\
    \ if one or more of the items in an array conform to a test. `some` works just\
    \ like `every`, but will return `true` as long as one array item returns `true`:\n\
    \n```\nvar arr, isValid;\n\narr = [1, 2, 3, 4, 5];\nisValid = arr.some(function(num)\
    \ {\n  return (num < 2);\n}); // isValid is true\n```\n\nIn this example, even\
    \ though just the one number in the array is less than two, isValid is still true.\n\
    \n## filter (JavaScript 1.6)\n\nIt's all well and good to test an array, but what\
