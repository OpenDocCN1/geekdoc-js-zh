    \narr = [1, 2, 3, 4, 5, 6, 7, 8, 9];\nfiltered = arr.filter(function(num) {\n\
    \  return (num < 5);\n});\n// filtered now contains [1, 2, 3, 4]\n```\n\n## reduce\
    \ and reduceRight (JavaScript 1.8)\n\nAt times it's necessary to perform a mathematical\
    \ operation on the array and reduce it to a single value; for instance, if you\
