    # Less than or Equal to (<=)


    Returns true if the value on the left of the operator is less than or equal to
    the value on the right. Note that type conversion implicitly occurs before comparison:


    ```

    0 <= 1   // returns true

    1 <= 1   // returns true

    "1" <= 1 // returns true ("1" converts to 1)

    2 <= 1   // returns false

    "2" <= 1 // returns false ("2" converts to 2)

    ```


    # Logic Flow


    Now that we''ve covered comparison operators, we can use them to control the logic
    flow of our programs. Sometimes your program will need to execute different code
    under different conditions. For example, if the time is before noon, we should
    display a "Good Morning!" message, but if it''s later in the day, "Good Afternoon!"
    or even "Good Evening!" would be more appropriate. The way to do this is to use
    the `if..else` statement to evaluate conditions and fork code execution.


    Figure 2.1 shows how logic flow can be controlled through comparison statements.
    If a condition is met, the code branches in a given direction. If not, it falls
    to the next condition. In our flow diagram, we assume a time of 1900 hours or
    7 PM. We then check it against various time ranges to see where it falls. So,
    if the time value is greater than or equal to 0000 (midnight) and less than 1200
    (noon), we set our message to "Good morning!". If it''s greater than or equal
    to 1200 and less than 1700 (5 PM), we set the message to "Good afternoon!". We
    continue this pattern until we''ve checked every range leading us to midnight.'
