    \ 114.975\n```\n\n注意这个实现与 `apply` 版本的唯一区别在于我们传递价格、省税和联邦税值的方式。使用 `apply` 时，它们在一个数组中传递；而在这里，它们作为单独的参数传递。\n\
    \n### bind 方法\n\n从 ECMAScript 5 开始，可以在函数上调用 `bind` 方法，并传入一个将被引用为 `this` 的对象。`bind`\
