  md: '# Chapter 1


    # Setting Up


    As a JavaScript developer, you’ll be writing code that runs in the browser. And
    as we walk through the book, you’ll want to try out the examples. You *could*
    create an HTML document in which you’d add your JavaScript code, but it will be
    a little while yet before we tackle a full project, and you’ll want to test things
    out in the meantime. The best way is to jump right in by opening up your browser’s
    console and type the examples in there. All the major browser vendors have a console,
    and there are instructions below on how to activate it in each. Once you have
    the console open, you’ll find a prompt next to which you can click and start typing.
    In most consoles, it looks like an angle bracket: >. In Internet Explorer, the
    prompt is two angle brackets: >>.


    > **Spinning a Line**


    When you need a new line within the console, rather than pressing **Enter**, which
    will execute the code, press **Shift Enter** for a new line.'
