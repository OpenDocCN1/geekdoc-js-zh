    # this


    The this keyword can be tricky to work with, as what it refers to depends entirely
    on how it''s used. We saw one example of its use in the Account object example
    earlier. In that case, this referred to the object we instantiated. Depending
    on context, though, this points to different things, and it''s important to know
    what it''s referring to.


    For example, in Figure 4.7 it refers to the global window object when used in
    a regular function, while in a constructor it refers to the function itself. In
    a regular function inside an object literal, the this keyword refers to the immediate
    parent object, while in an event handler, it refers to the DOM element that called
    the handler. And, of course, when using either the call or apply methods to execute
    a function, we can pass in an object for the this keyword to refer to. So, if
    you''re still with me, let''s go over each of those one by one.


    ![](img/ae490e66f6d11d20689f8bf3d738bef9_85_0.png)'
  - "[PAGE 86]\n\n# Simple Function\n\nWhen the `this` keyword is used inside a simple\
    \ function, it refers to the global variable scope, which is the `window` object.\
    \ In this context, there's no real need to use the `this` keyword as any variable\
    \ in the global scope is accessible simply by using its name. In other words,\
    \ if you declare a variable named `foo` globally, you can just refer to it as\
    \ `foo`; no need to use `this.foo`. JavaScript is simply referring you to the\
    \ global scope because there's nothing else for it to point the `this` keyword\
    \ to in this instance. If you're running in strict mode, however, it will return\
    \ undefined. This is to prevent unintentional errors that are bound to happen\
    \ in this context.\n\n> ### Strict Mode\n\n**Strict mode** is a recent addition\
    \ to JavaScript. By opting into strict mode via the addition of `\"use strict\"\
    `; at the top of a function, you force the JavaScript engine to change its behavior\
    \ and essentially fix some potentially error-prone ways of handling code. In this\
    \ case, it's what `this` refers to in a simple function.\n\n# In a Constructor\n\
    \nWhen used in a constructor or function intended to be instantiated via the `new`\
    \ keyword, `this` refers to the object that's to be created. So if your constructor\
    \ is a bank account:\n\n```\nvar Account, savings;\n\nAccount = function(num)\
    \ {\n  this.accountNumber = num;\n};\n\nsavings = new Account(12345678);\nsavings.accountNumber;\
    \ // returns 12345678\n```\n\nIn this case, the `this` keyword lets you attach\
    \ the `accountNumber` property to the object that's to be instantiated. It's therefore\
    \ possible to get that value by referring to `savings.accountNumber`."
