  md: "# Functions\n\nAs you write more complex programs, you'll find the need to\
    \ achieve certain operations that JavaScript doesn't do natively. You can accomplish\
    \ the job with just a few lines of code, but it's likely you'll want to perform\
    \ that job more than once. That's where functions come in. A **function** is a\
    \ way to group a set of operations, give it a name, and then be able to call it\
    \ as often as you wish. Here's a simple function:\n\n```\nfunction sayHello()\
    \ {\n  alert(\"Hello, world!\");\n}\n```\n\nBy calling this simple function, you\
    \ can cause an alert to appear with the message, \"Hello, world!\". Once we've\
    \ defined **sayHello** (as we did above), running (or executing or calling) it\
    \ is very simple; you just write its name followed by parentheses:\n\n```\nsayHello();\n\
    ```\n\nThe reason for the parentheses is so that you can pass values as arguments\
    \ into your function. For example, rather than our function saying \"Hello, world!\"\
    , we could have it say something else:\n\n```\nfunction sayHello(msg) {\n  alert(msg);\n\
    }\n```\n\nNow when we call **sayHello**, we can pass in our own message:\n\n```\n\
    sayHello(\"Howdy, y'all!\");\n```\n\nDoing this calls the **sayHello** function\
    \ and passes in \"Howdy, y'all!\" as the first argument. If you look at our **sayHello**\
    \ function, we've specified a variable named **msg** as the first argument, so\
    \ inside **sayHello**, **msg** will contain the value that was passed into the\
    \ function; in this case, \"Howdy, y'all!\" We then hand that variable over to\
    \ **alert** and voilà!"
  merge: -1
  pgno: 71
- img_proc: true
  md: "Before we go any further with functions, I need to cover the important topics\
    \ of scope and hoisting. These can occur as a result of using functions, and if\
    \ you're unaware of them, you may run into trouble—such as code behaving strangely.\n\
    \n# Scope\n\nNot only are functions containers for groups of operations, they\
    \ also create what's called a scope for variables. Variables exist either in the\
    \ **global scope** (not declared within a function and available everywhere) or\
    \ **local scope** (declared within a function and only available within it). No\
    \ code outside the function can access a variable declared within it. Only code\
    \ inside the function can access it. Nested function declarations that are declared\
    \ at the same level or lower than the variable can also access it. So, for example:\n\
    \n```\nfunction hi() {\n    var hello = \"hello\"\n};\n\nhi();\nalert(hello);\n\
    ```\n\nIn this case, the variable named `hello` is scoped to the `hi` function.\
    \ This means that the `alert` trying to access the `hello` variable from outside\
    \ the `hi` function will be unable to. Instead, it will receive a `ReferenceError:\
    \ hello is not defined` error. The reason why is because the variable `hello`\
    \ was declared inside of `hi` and is therefore scoped to `hi`. It's unavailable\
    \ outside of the `hi` function.\n\nThat said, any function declared within another\
    \ function automatically has access to variables declared within its parent function:\n\
    \n```\nfunction fullName() {\n    var firstName = \"Hugo\";\n\n    function alertFullName()\
    \ {\n        var lastName = \"Reyes\";\n\n        alert(\"Full name: \" + firstName\
    \ + \" \" + lastName);\n    }\n}\n```"
