  md: '12 Jump Start JavaScript


    # Types


    If you''ve had any exposure to programming languages like C or Java, you''ve likely
    noticed that there was no specification that we wanted `task` to hold a string
    (as opposed to a Boolean or numeric value). This is because JavaScript is a **loosely
    typed language**, unlike C or Java, which are strongly typed. This means that
    even though JavaScript does recognize types internally, you don''t need to explicitly
    declare a variable to be of a certain type. You can also change a variable''s
    type on the fly. JavaScript tries to figure out what you''re trying to do with
    your variables instead of relying on you to explicitly say it. In fact, there''s
    no way to tell JavaScript that you want your variable to be of a certain type,
    apart from assigning a value of that type to the variable.


    There are six data types you can work with: number, string, Boolean, null, undefined,
    and object.


    # Number


    Unlike in other languages, the only numeric type JavaScript has is `Number`. According
    to the ECMAScript standard<sup>1</sup>, `Number` holds a "double-precision 64-bit
    binary format IEEE 754 value." According to the standard, `Number` can hold a
    "set of all possible Number values including the special Not-a-Number (NaN) values,
    positive infinity, and negative infinity."


    > ### When Is a Number Not a Number?


    **Not-a-Number** or `NaN` is a special value that''s returned by JavaScript when
    math functions fail (`Math.abs("foo")`), or when a function trying to parse a
    number fails (`Number("foo")`). `NaN` is special because it''s the only value
    in JavaScript that doesn''t equal itself. In other words, both `NaN == NaN` and
    `NaN === NaN` return `false` when logically you''d expect them to be `true` since
    `NaN` is `NaN`. However, true to its meaning `NaN` itself is "not a number" and
    therefore is not equal to itself.


    There is an `isNaN` function to verify if a returned value is actually `NaN`,
    but be careful because the results can be confusing. The reason is because `isNaN`
    first tries to convert the value that you pass it into a number through a process
    called


    <sup>1</sup> http://www.ecma-international.org/publications/standards/Ecma-262.htm'
