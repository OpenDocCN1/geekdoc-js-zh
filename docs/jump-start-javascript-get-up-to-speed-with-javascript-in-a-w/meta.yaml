  md: "# 136 Jump Start JavaScript\n\n+   - **cancelable** A Boolean indicating whether\
    \ the event is cancelable. If an event is cancelable it means that it can have\
    \ its default action prevented.\n- **detail** The data passed when initializing\
    \ the event. We will populate this object depending upon what data we wish to\
    \ transmit with our custom event.\n\nLet's use an example to illustrate the above.\
    \ Create a new file named **customevent.html** containing the following HTML:\n\
    \n```\n<!doctype html>\n<html>\n<head>\n    <title>Events</title>\n</head>\n<body>\n\
    \    <button id=\"btnAdd\">Add Task</button>\n    <script src=\"customevent.js\"\
    ></script>\n</body>\n</html>\n```\n\nThis represents our dummy to-do list application.\
    \ Next, create a file named **customevent.js** containing the following JavaScript\
    \ code:\n\n```\nvar taskEvent = new CustomEvent(\"TaskAdded\", {\n    detail:\
    \ {\n        message: \"A task has been added\",\n    },\n    bubbles: true,\n\
    \    cancelable: true\n});\nvar btnAdd = document.getElementById(\"btnAdd\");\n\
    \nbtnAdd.onclick = function(e) {\n    document.dispatchEvent(taskEvent);\n};\n\
    ```\n\nThe above code creates a custom event. We define the name to be \"TaskAdded\"\
    \ and then provide the event with the initialization parameters. Every time the\
    \ button is clicked, we use **dispatchEvent** to trigger the event. Our event\
    \ can now be handled in exactly the same way as native events such as keystrokes\
    \ and mouse clicks. We make the simplifying assumption that a task is added every\
    \ time the button is"
