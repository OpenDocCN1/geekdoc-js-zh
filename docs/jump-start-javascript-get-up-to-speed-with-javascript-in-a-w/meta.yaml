    \ `this` 指的是什么。\n\n### 在构造函数中\n\n当在构造函数或旨在通过 `new` 关键字实例化的函数中使用时，`this` 指的是要创建的对象。因此，如果你的构造函数是一个银行账户：\n\
    \n```javascript\nvar Account, savings;\n\nAccount = function(num) {\n  this.accountNumber\
    \ = num;\n};\n\nsavings = new Account(12345678);\nsavings.accountNumber; // 返回\
    \ 12345678\n```\n\n在这个例子中，`this` 关键字允许你将 `accountNumber` 属性附加到要实例化的对象上。因此，可以通过引用\
    \ `savings.accountNumber` 来获取该值。\n\n### 在对象字面量内部\n\n如果你的函数恰好在对象字面量内部，并且是一个如我们第一个示例中的简单函数调用，那么\
    \ `this` 现在指的是包围你函数的直接父对象。例如，我们图表中的代码在 `Project` 对象内有两个名为 `Managers` 和 `Developers`\
    \ 的数组。`howMany` 函数通过分别引用 `this.Managers` 和 `this.Developers` 来添加它们的长度。这意味着对 `this`\
    \ 关键字的调用将我们引向 `Project` 对象，从中我们可以访问到 `Managers` 和 `Developers`。\n\n### 在事件处理程序内部\n\
    \n我们还没有介绍事件处理程序，所以请稍安勿躁。基本上，**事件处理程序**是一个在事件触发时被调用的函数，例如，当链接被点击时的 \"click\" 事件。在事件处理程序中，`this`\
    \ 关键字指的是触发该事件的元素，在这种情况下，就是页面上的锚点。\n\n### call 和 apply\n\n可以使用提供的 `call` 和 `apply`\
    \ 方法来调用函数。我们很快将更详细地介绍这些方法，但在两种情况下，这些方法的第一个参数都是你可以传入供 `this` 关键字引用的对象。\n\n### bind\n\
    \n最后，ECMAScript 5 引入了一个名为 `bind` 的方法，它创建一个新函数并将其永久绑定到你传入的对象。当调用 `this` 时，该对象将被引用。我们也将很快更详细地介绍这一点。\n\
    \n## 属性\n\n### constructor\n\n如果你拿到一个作为函数实例的对象，你可能想知道那个原始函数是什么。更重要的是，你可能希望基于那个原始函数实例化另一个对象。使用\
    \ `constructor` 属性，你可以做到这一点。它返回对所讨论的原始函数的引用，这允许你使用原始数据创建新实例：\n\n```javascript\n\
    var foo, bar, baz;\n\nfunction Foo() {\n    this.ident = \"foo\";\n}\n\nfoo =\
    \ new Foo();\nfoo.ident; // 返回 \"foo\"\n\nbar = new Foo();\nbar.ident; // 返回 \"\
    foo\"\nbar.ident = \"bar\";\nbar.ident; // 现在返回 \"bar\"\n\nbaz = new bar.constructor();\n\
    baz.ident; // 返回 \"foo\"\n```\n\n首先，我们实例化 foo，它的 ident 属性值为 \"foo\"。接下来，我们实例化\
    \ bar，它的 ident 也是 \"foo\"，因为它来自 Foo 类。然而，我们将其 ident 值更改为 \"bar\"。然后我们使用 bar 的\
    \ constructor 属性来实例化 baz。该属性将我们引向原始的 Foo 函数，它为我们的 baz 实例提供了相同的原始 ident 值 \"foo\"\
    。\n\n### length\n\n如果你需要知道一个函数期望多少个参数，你可以使用 length 属性来检查：\n\n```javascript\nfunction\
    \ foo(bar, baz) {\n}\n\nfoo.length; // 返回 2\n```\n\n在检查 foo 的长度时，我们得到返回值 2，因为它期望\
    \ bar 和 baz 作为参数。\n"
