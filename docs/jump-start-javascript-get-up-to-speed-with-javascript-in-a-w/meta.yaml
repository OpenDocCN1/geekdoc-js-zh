  md: '# About Ara Pehlivanian


    Ara Pehlivanian has been working on the web since 1997. Most recently, he''s worked
    on high-end, highly visible projects as a web developer and practice lead at Nurun,
    a front-end engineer at Yahoo! Mail and is currently a JavaScript developer on
    the HP Cloud Services team.


    # About Don Nguyen


    Like many programmers, Don dabbled in JavaScript for a number years as a secondary
    language. It wasn''t until he began implementing server-side projects in Node.js
    that JavaScript began to take center stage. Having been heavily involved in a
    number of web projects from the back-end all the way to the front, he is now equally
    at home with JavaScript on the client and on the server. He currently spends his
    time working on building startups from his home base of Sydney, Australia.


    # About SitePoint


    SitePoint specializes in publishing fun, practical, and easy-to-understand content
    for web professionals. Visit http://www.sitepoint.com/ to access our blogs, books,
    newsletters, articles, and community forums. You''ll find a stack of information
    on JavaScript, PHP, Ruby, mobile development, design, and more.


    # About Jump Start


    Jump Start books provide you with a rapid and practical introduction to web development
    languages and technologies. Typically around 150 pages in length, they can be
    read in a weekend, giving you a solid grounding in the topic and the confidence
    to experiment on your own.'
