    \n```\nfunction countByOwner(tasks, name) {\n  return tasks.filter(function(task)\
    \ {\n    return task.owner === name;\n  }).length;\n}\n```\n\n从某种角度看，函数式思维不如命令式直观；然而，正如所展示的，它可以用来清晰、优雅地表达一个解决方案，而这个解决方案若用命令式程序则需要更多行代码才能完成。\n\
    \n## 递归\n\n我们简要触及一下递归的概念。许多函数式方法避免使用循环，转而采用递归。下面的例子将加以说明。还记得高中时计算一个数的阶乘吗？我们暂不讨论正式定义，直接使用这个简单的例子：5的阶乘是\
    \ 5 x 4 x 3 x 2 x 1，结果是 120。这是用循环实现的阶乘函数：\n\n```\nfunction factorial(num) {\n\
    \  var result = 1;\n\n  for (var i = num; i > 0; i--) {\n    result *= i;\n  }\n\
    \n  return result;\n}\n```\n\n或者，我们可以实现一个调用自身的递归函数：\n\n```\nfunction factorial(num)\
    \ {\n  if (1 === num) {\n    return num;\n  } else {\n    return num * factorial(num\
    \ - 1);\n  }\n}\n```\n\n许多问题非常适合用优雅的递归解决方案来处理。递归是一个相当复杂的计算机科学主题，但如果你开始留意那些可以将循环重构为递归的实例，你可能会惊讶于它们自然出现的频率。\n\
    \n对于希望更深入探索递归的读者，Kirit Sælensminde 的文章《递归的对与错》将很有用。<sup>8</sup> 它涉及一些重要的主题，如性能考量，而这些并未在本节涵盖。\n\
    \n## 项目\n\n### 统计任务\n\n假设我们想统计已完成任务的数量。稍后在提供图表功能时会需要这个功能。使用循环，完成此任务的一种方式如下：\n\n\
    ```\nfunction countComplete(tasks) {\n  var numCompleted = 0;\n\n  for (var i\
    \ = 0; i < tasks.length; i++) {\n    if (tasks[i].complete) {\n      numCompleted++;\n\
    \    }\n  }\n\n  return numCompleted;\n}\n```\n\n总的来说，这是一个合理的方案。逻辑足够简单，我们用一个计数器来跟踪已完成任务的数量。然后我们遍历任务列表，每看到一个完成的项目，就递增计数器。有更好的解决方案吗？有。函数式编程来拯救！将此代码放入名为\
    \ **todo.js** 的文件中：\n\n```\nfunction countComplete(tasks) {\n    return tasks.filter(function(task)\
    \ {\n        return task.complete;\n    }).length;\n}\n```\n\n现在我们要做的就是根据任务是否完成来过滤整个列表，然后返回该列表的长度。\n\
    \n### 排序\n\n我们希望为用户提供按三种条件排序的能力：从低到高、从高到低、按名称排序。得益于内置的 `sort` 函数，我们只需提供一个函数来根据指定条件对任务进行排序：\n\
    \n```\nvar sortByLowHigh = function(tasks) {\n    return tasks.sort(function(task1,\
    \ task2) {\n        return task2.priority - task1.priority;\n    });\n};\n\nvar\
    \ sortByHighLow = function(tasks) {\n    return tasks.sort(function(task1, task2)\
    \ {\n        return task1.priority - task2.priority;\n    });\n};\n\nvar sortByName\
    \ = function(tasks) {\n    return tasks.sort(function(task1, task2) {\n      \
    \  return task1.text > task2.text;\n    });\n};\n```\n\n对于优先级排序，我们进行数值比较。对于名称排序，我们进行字典序比较。好奇的读者可以知道，内置的数组排序函数内部使用的算法被称为快速排序。<sup>9</sup>\n\
    \n<sup>9</sup> http://www.nczonline.net/blog/2012/11/27/computer-science-in-javascript-quicksort/\n\
    \n## 总结\n\n本章涵盖了大量内容。我们首先探讨了循环，包括 `while`、`do ... while`、`for` 和 `for ... in`。然后我们转向了跳转语句，包括带标签的语句、`break`、`continue`\
    \ 和 `return`。在讨论高阶函数以及它们如何用于实现函数式编程解决方案之前，我们还讨论了异常处理，使用了 `throw` 和 `try ... catch\
    \ ... finally`。最后，我们简要地看了一下递归，以及它如何在特定解决方案中优雅地替代循环。\n\n至此，希望你已经牢固掌握了循环和跳转语句，并开始理解函数式解决方案如何能简洁地替代命令式对应方案。\n\
    \n# 第 6 章\n\n## 文档对象模型\n\n### 什么是 DOM？\n\n文档对象模型（DOM）是一个用于操作 HTML 和 XML 文档的 API。它是一个表示文档的对象树状层次结构，并通过暴露方法和属性来便于脚本编写。尽管如今\
    \ DOM 功能非常强大，其规范的大部分内容在所有主流浏览器中都得到了良好支持，但情况并非一直如此。\n\n最初几乎没有什么一致性，更不用说规范了。在浏览器大战¹\
    \ 的那个糟糕年代，Netscape 和 Microsoft 为争夺网络主导权而激烈竞争，相互攀比成了游戏规则。这导致了相互冲突的实现，每个厂商都在自己的产品中引入非标准特性。随着开发者开始使用这些特性，竞争对手被迫模仿其行为，以使网页不会在自己的浏览器中崩溃。特性仅仅因为谁在浏览器市场占有重要份额而被迫存在。可以想象，对于试图让代码在当时主流浏览器中运行的开发者来说，这充其量是一个令人头疼的问题。\n\
    \n¹ http://en.wikipedia.org/wiki/Browser_wars\n"
