    , handleClick, false);\n```\n\n刷新页面，然后点击按钮。此时你应该会在图 7.3 中看到提示框。\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_142_0.png)\n\
    \n尽管这似乎增加了额外的工作，但对于任何非平凡的项目，将表现层与业务逻辑分离将带来回报。在这种架构下，你的设计师可以专注于视觉方面，而你的 JavaScript\
