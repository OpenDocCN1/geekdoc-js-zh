    # Prototype Chain


    We''re going to discuss looping over objects shortly, but in order to do that,
    I need to first cover JavaScript''s prototype chain. You''ll see why in just a
    second. For the time being, we''ll take a quick look at prototypes because we''ll
    be covering them in more detail later in the section on functions. For now, it''s
    important to understand a little bit about them and how they affect looping over
    key/values in objects.


    All objects have a prototype. So, what''s a **prototype**? It''s an object from
    which other objects inherit properties. Figure 4.3 presents a diagram illustrating
    the concept of prototypal inheritance.'
- md: "## Looping over an Object\n\nLooping over an object isn't as simple as looping\
    \ over an array. With an array, you simply increment an index value and use that\
    \ to step through the array. With objects, there is no index value. Objects are\
    \ collections of key/value pairs, so you need to step through them differently:\n\
    \n```javascript\nvar data, key;\n\ndata = {\n    firstName: \"James\",\n    lastName:\
    \ \"Kirk\",\n    occupation: \"Captain\"\n};\n\nfor (key in data) {\n  alert(key\
    \ + \" is \" + data[key]);\n}\n```\n\nIn this example, we use a `for ... in` loop.\
    \ We give it a variable (in this case, `key`) that will be used to hold the key\
    \ as it steps through the object, and an object to step over (in this case, `data`).\
    \ For each key/value pair inside `data`, the loop will assign the key to our variable\
    \ named `key`. Inside the body of the loop, we can use the key to plug into our\
    \ object to access its associated value: `data[key]`. That's the equivalent of\
    \ writing `data[\"firstName\"]`, and on a subsequent pass, `data[\"lastName\"\
    ]`, and so on.\n\nThere is one catch, though. Since objects inherit from objects,\
    \ the loop may start returning key/value pairs from further up the prototype chain.\
    \ To prevent this, we need to add something to our loop:\n\n```javascript\nvar\
    \ data, key;\n\ndata = {\n  firstName: \"James\",\n  lastName: \"Kirk\",\n  occupation:\
    \ \"Captain\"\n};\n\nfor (key in data) {\n  if (data.hasOwnProperty(key)) {\n\
    \    alert(key + \" is \" + data[key]);\n  }\n}\n```\n\nThe `hasOwnProperty` method\
    \ makes sure that the key we're using belongs to the object in question and not\
    \ from further up the prototype chain. If it returns `true`, we can proceed with\
    \ our operation. Otherwise, we ignore it.\n\n## Functions\n\nAs you write more\
    \ complex programs, you'll find the need to achieve certain operations that JavaScript\
    \ doesn't do natively. You can accomplish the job with just a few lines of code,\
    \ but it's likely you'll want to perform that job more than once. That's where\
    \ functions come in. A **function** is a way to group a set of operations, give\
    \ it a name, and then be able to call it as often as you wish. Here's a simple\
    \ function:\n\n```javascript\nfunction sayHello() {\n  alert(\"Hello, world!\"\
    );\n}\n```\n\nBy calling this simple function, you can cause an alert to appear\
    \ with the message, \"Hello, world!\". Once we've defined **sayHello** (as we\
    \ did above), running (or executing or calling) it is very simple; you just write\
    \ its name followed by parentheses:\n\n```javascript\nsayHello();\n```\n\nThe\
    \ reason for the parentheses is so that you can pass values as arguments into\
    \ your function. For example, rather than our function saying \"Hello, world!\"\
    , we could have it say something else:\n\n```javascript\nfunction sayHello(msg)\
    \ {\n  alert(msg);\n}\n```\n\nNow when we call **sayHello**, we can pass in our\
    \ own message:\n\n```javascript\nsayHello(\"Howdy, y'all!\");\n```\n\nDoing this\
    \ calls the **sayHello** function and passes in \"Howdy, y'all!\" as the first\
    \ argument. If you look at our **sayHello** function, we've specified a variable\
    \ named **msg** as the first argument, so inside **sayHello**, **msg** will contain\
    \ the value that was passed into the function; in this case, \"Howdy, y'all!\"\
    \ We then hand that variable over to **alert** and voilà!\n\nBefore we go any\
    \ further with functions, I need to cover the important topics of scope and hoisting.\
    \ These can occur as a result of using functions, and if you're unaware of them,\
    \ you may run into trouble—such as code behaving strangely.\n\n## Scope\n\nNot\
    \ only are functions containers for groups of operations, they also create what's\
    \ called a scope for variables. Variables exist either in the **global scope**\
    \ (not declared within a function and available everywhere) or **local scope**\
    \ (declared within a function and only available within it). No code outside the\
    \ function can access a variable declared within it. Only code inside the function\
    \ can access it. Nested function declarations that are declared at the same level\
    \ or lower than the variable can also access it. So, for example:\n\n```javascript\n\
    function hi() {\n    var hello = \"hello\";\n}\n\nhi();\nalert(hello);\n```\n\n\
    In this case, the variable named `hello` is scoped to the `hi` function. This\
    \ means that the `alert` trying to access the `hello` variable from outside the\
    \ `hi` function will be unable to. Instead, it will receive a `ReferenceError:\
    \ hello is not defined` error. The reason why is because the variable `hello`\
    \ was declared inside of `hi` and is therefore scoped to `hi`. It's unavailable\
    \ outside of the `hi` function.\n\nThat said, any function declared within another\
    \ function automatically has access to variables declared within its parent function:\n\
    \n```javascript\nfunction fullName() {\n    var firstName = \"Hugo\";\n\n    function\
    \ alertFullName() {\n        var lastName = \"Reyes\";\n\n        alert(\"Full\
    \ name: \" + firstName + \" \" + lastName);\n    }\n\n    alertFullName();\n}\n\
    \nfullName();\n```\n\nThe outer function, `fullName`, creates a scope inside which\
    \ the variable `firstName` and function `alertFullName` are declared. Since they're\
    \ both declared inside `fullName`'s scope, `alertFullName` has access to `firstName`.\
    \ So when `fullName` is executed, and it in turn executes `alertFullName`, `alertFullName`\
    \ is able to access both its own `lastName` variable as well as its parent's `firstName`\
    \ to put together its alert text.\n\nIn fact, a function has access to all variables\
    \ declared above it, no matter how deeply it's nested. Let's illustrate this.\
    \ For this example, we'll use the console's `log` function to output values directly\
    \ to the browser's console. If you're yet to use the console, go to the first\
    \ chapter and quickly look up how to enable your browser's console for this next\
    \ example:\n\n```javascript\n// scope-2.html (excerpt)\n\n// Declaring a global\
    \ variable and giving it the value \"a\"\nvar a = \"a\";\n\nfunction levelb()\
    \ {\n  // Declaring a variable that levelb and children can see\n  var b = \"\
    b\";\n\n  function levelc() {\n    // Declaring a variable only levelc and leveld\
    \ can see\n    var c = \"c\";\n\n    function leveld() {\n      // Declaring a\
    \ variable only leveld can see\n      var d = \"d\";\n\n      console.log(\"leveld\"\
    , a, b, c, d);\n    }\n\n    // Running leveld() will output a, b, c and d\n \
    \   leveld();\n\n    console.log(\"levelc\", a, b, c);\n  }\n\n  // Running levelc()\
    \ will output a, b, and c\n  levelc();\n\n  console.log(\"levelb\", a, b);\n}\n\
    \n// Running levelb() will output a and b\nlevelb();\n\n// Only the variable named\
    \ \"a\" is available globally\nconsole.log(\"global\", a);\n```\n\nIf you run\
    \ this example, you'll end up with the following output in your browser's console:\n\
    \n```\nleveld a b c d\nlevelc a b c\nlevelb a b\nglobal a\n```\n\nAs you can see,\
    \ nested function declarations can access variables declared above them.\n\n##\
    \ Hoisting\n\nNow that we’ve covered how functions create variable scope, we’ll\
    \ address a phenomenon called hoisting. Because JavaScript is a very permissive\
    \ language, it has to do a lot of work under the hood. We’ve already seen this\
    \ with type coercion, when JavaScript attempts to convert variable types in order\
    \ to make operations with conflicting types work. **Hoisting** is another \"under\
    \ the hood\" action by JavaScript does where it moves all variable declarations\
    \ to the top of a function. That means that this:"
  mdcn: "\n## 遍历对象\n\n遍历对象不像遍历数组那样简单。遍历数组时，你只需递增一个索引值，然后用它来逐个访问数组元素。而对象没有索引值。对象是键/值对的集合，因此你需要采用不同的方式来遍历它们：\n\
    \n```javascript\nvar data, key;\n\ndata = {\n    firstName: \"James\",\n    lastName:\
    \ \"Kirk\",\n    occupation: \"Captain\"\n};\n\nfor (key in data) {\n  alert(key\
    \ + \" is \" + data[key]);\n}\n```\n\n在这个例子中，我们使用了 `for ... in` 循环。我们给它一个变量（本例中是\
    \ `key`），这个变量将在遍历对象时用于保存键，以及一个要遍历的对象（本例中是 `data`）。对于 `data` 内部的每个键/值对，循环会将键赋值给名为\
    \ `key` 的变量。在循环体内，我们可以使用这个键来访问对象中对应的值：`data[key]`。这相当于依次编写 `data[\"firstName\"\
    ]`，然后是 `data[\"lastName\"]`，依此类推。\n\n不过，这里有一个需要注意的地方。由于对象是从其他对象继承而来的，循环可能会开始返回原型链上更高级别的键/值对。为了防止这种情况，我们需要在循环中添加一些内容：\n\
    \n```javascript\nvar data, key;\n\ndata = {\n  firstName: \"James\",\n  lastName:\
    \ \"Kirk\",\n  occupation: \"Captain\"\n};\n\nfor (key in data) {\n  if (data.hasOwnProperty(key))\
    \ {\n    alert(key + \" is \" + data[key]);\n  }\n}\n```\n\n`hasOwnProperty` 方法确保我们使用的键属于当前对象本身，而不是来自原型链的更高级别。如果它返回\
    \ `true`，我们就可以继续执行操作。否则，我们就忽略它。\n\n## 函数\n\n随着你编写更复杂的程序，你会发现需要实现一些 JavaScript\
    \ 本身不直接支持的操作。你可以用几行代码完成这个任务，但很可能你需要多次执行该任务。这就是函数的用武之地。**函数** 是一种将一组操作打包起来、给它命名，然后你可以按需多次调用它的方式。下面是一个简单的函数：\n\
    \n```javascript\nfunction sayHello() {\n  alert(\"Hello, world!\");\n}\n```\n\n\
    调用这个简单的函数，你就能让一个显示“Hello, world!”的提示框弹出。一旦我们定义了 **sayHello**（如上所示），运行（或执行、调用）它非常简单；你只需写下它的名称，后面跟上一对圆括号：\n\
    \n```javascript\nsayHello();\n```\n\n圆括号的作用是让你能够将值作为参数传递给函数。例如，与其让我们的函数说“Hello,\
    \ world!”，我们可以说点别的：\n\n```javascript\nfunction sayHello(msg) {\n  alert(msg);\n\
    }\n```\n\n现在当我们调用 **sayHello** 时，我们可以传入我们自己的消息：\n\n```javascript\nsayHello(\"\
    Howdy, y'all!\");\n```\n\n这样做会调用 **sayHello** 函数，并将“Howdy, y'all!”作为第一个参数传入。如果你查看我们的\
    \ **sayHello** 函数，我们指定了一个名为 **msg** 的变量作为第一个参数，因此在 **sayHello** 内部，**msg** 将包含传入函数的值；本例中就是“Howdy,\
    \ y'all!”。然后我们将这个变量交给 **alert**，大功告成！\n\n在我们继续深入讨论函数之前，我需要介绍两个重要的概念：作用域和提升。它们可能是使用函数产生的结果，如果你不了解它们，可能会遇到一些麻烦——比如代码行为异常。\n\
    \n## 作用域\n\n函数不仅是操作组的容器，它们还会为变量创建所谓的 **作用域**。变量要么存在于 **全局作用域**（在函数内部未声明，任何地方都可以访问），要么存在于\
    \ **局部作用域**（在函数内部声明，仅在该函数内可访问）。函数外部的代码无法访问在其内部声明的变量。只有函数内部的代码可以访问它。在变量声明的同级或更低级别声明的嵌套函数也可以访问它。例如：\n\
    \n```javascript\nfunction hi() {\n    var hello = \"hello\";\n}\n\nhi();\nalert(hello);\n\
    ```\n\n在这个例子中，名为 `hello` 的变量的作用域限定在 `hi` 函数内。这意味着，从 `hi` 函数外部尝试访问 `hello` 变量的\
    \ `alert` 将无法成功。相反，它会收到一个 `ReferenceError: hello is not defined` 错误。原因在于变量 `hello`\
    \ 是在 `hi` 内部声明的，因此它的作用域是 `hi`。在 `hi` 函数外部，它是不可用的。\n\n话虽如此，在另一个函数内部声明的任何函数，都可以自动访问其父函数中声明的变量：\n\
    \n```javascript\nfunction fullName() {\n    var firstName = \"Hugo\";\n\n    function\
    \ alertFullName() {\n        var lastName = \"Reyes\";\n\n        alert(\"Full\
    \ name: \" + firstName + \" \" + lastName);\n    }\n\n    alertFullName();\n}\n\
    \nfullName();\n```\n\n外部函数 `fullName` 创建了一个作用域，变量 `firstName` 和函数 `alertFullName`\
    \ 都在此作用域内声明。由于它们都在 `fullName` 的作用域内声明，因此 `alertFullName` 可以访问 `firstName`。所以当\
    \ `fullName` 被执行，并且它转而执行 `alertFullName` 时，`alertFullName` 既能访问它自己的 `lastName`\
    \ 变量，也能访问其父函数的 `firstName`，从而拼接出它的提示文本。\n\n实际上，一个函数可以访问在其上方声明的所有变量，无论其嵌套有多深。让我们用一个例子来说明。在这个例子中，我们将使用控制台的\
    \ `log` 函数将值直接输出到浏览器的控制台。如果你还没有使用过控制台，请先回到第一章，快速查看如何启用浏览器的控制台，以便进行接下来的示例：\n\n\
    ```javascript\n// scope-2.html (excerpt)\n\n// Declaring a global variable and\
    \ giving it the value \"a\"\nvar a = \"a\";\n\nfunction levelb() {\n  // Declaring\
    \ a variable that levelb and children can see\n  var b = \"b\";\n\n  function\
    \ levelc() {\n    // Declaring a variable only levelc and leveld can see\n   \
    \ var c = \"c\";\n\n    function leveld() {\n      // Declaring a variable only\
    \ leveld can see\n      var d = \"d\";\n\n      console.log(\"leveld\", a, b,\
    \ c, d);\n    }\n\n    // Running leveld() will output a, b, c and d\n    leveld();\n\
    \n    console.log(\"levelc\", a, b, c);\n  }\n\n  // Running levelc() will output\
    \ a, b, and c\n  levelc();\n\n  console.log(\"levelb\", a, b);\n}\n\n// Running\
    \ levelb() will output a and b\nlevelb();\n\n// Only the variable named \"a\"\
    \ is available globally\nconsole.log(\"global\", a);\n```\n\n如果你运行这个例子，你将在浏览器的控制台中看到以下输出：\n\
    \n```\nleveld a b c d\nlevelc a b c\nlevelb a b\nglobal a\n```\n\n如你所见，嵌套的函数声明可以访问在其上方声明的变量。\n\
    \n## 提升\n\n既然我们已经介绍了函数如何创建变量作用域，接下来我们将讨论一种称为 **提升** 的现象。由于 JavaScript 是一种非常宽容的语言，它需要在底层做大量工作。我们已经通过类型强制转换见识过这一点，当时\
    \ JavaScript 尝试转换变量类型以使类型冲突的操作能够进行。**提升** 是 JavaScript 的另一个“底层”操作，它将所有变量声明移动到函数的顶部。这意味着这样的代码：\n"
