  md: "# Project\n\n# Adding Tasks\n\nOur to-do list application needs to deal with\
    \ and respond to a number of user events. Users add a task by submitting a form.\
    \ This is handled in JavaScript as follows:\n\n```\naddForm.onsubmit = function(e)\
    \ {\n  var val;\n\n  preventDefault(e);\n  val = newTaskField.value;\n\n  if (val\
    \ === \"\") {\n    warn(\"Please enter a task\");\n  } else {\n    newTaskField.value\
    \ = \"\";\n    clearWarning();\n    addTask(val);\n  }\n};\n```\n\nFirst we add\
    \ the onsubmit handler to detect when a user has submitted the form. We use preventDefault\
    \ to prevent the default action because we do not want the form to actually be\
    \ submitted to a server!\n\n> Preventing Default Actions\n\nSome HTML elements\
    \ have default actions. For example forms are submitted, anchors follow hyperlinks\
    \ and checkboxes are toggled. By default, JavaScript does not inhibit these default\
    \ actions. In other words if you fire an event when a user clicks an anchor, your\
    \ event handler will be called but the browser will also continue with the standard\
    \ action by following the hyperlink. If this is undesirable behavior based on\
    \ your application's needs, then the event's preventDefault method can be used\
    \ to tell the browser to stop the default action from occurring.\n\nIn our example,\
    \ we check for an empty task, at which point we display a warning. If the task\
    \ is valid, we clear any prior warnings and then add the task to the list."
