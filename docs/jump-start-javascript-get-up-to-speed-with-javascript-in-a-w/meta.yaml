  md: '# Chapter 3


    # Arrays


    We saw in Chapter 2 how variables store different types of data. But in the case
    of something like a to-do list, where you have more than one item to deal with,
    you''re going to need a way to store a collection of data. This is where arrays
    come in.


    # Creating an Array


    You can create an array in a couple of ways:


    ```

    var myArray = new Array();

    ```


    Or:


    ```

    var myArray = [];

    ```


    The [] notation is called an **array literal**, and it represents an empty array.
    It''s less verbose and safer to use than the new Array() syntax, because the Array
    constructor can be overwritten and potentially replaced with malicious code; for
    example, a function that masquerades as an array but sends any data you place
    in it to a third-'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'party server on the Internet. Using the array literal, you can easily create
    a new array containing values such as the following:


    ```

    var myArray = [4, 8, 15, 16, 23, 42];

    ```


    An array isn’t limited to numbers, though. You can also create an array with strings
    in it:


    ```

    var fruit = ["apple", "orange", "pear", "grapes"];

    ```


    Furthermore, you can mix the types of data stored in the array:


    ```

    var stuff = [1, "apple", undefined, 42, "tanks", null, []];

    ```


    # Adding to an Array


    There’s no need to pre-populate an array with data, though. You can create an
    empty array and then add data to it later in several ways. One way is by index:


    ```

    var myArray = [];


    myArray[0] = "Hello";

    myArray[1] = "World";

    ```


    The contents of this array are now: [ "Hello", "World" ]. By specifying 0 in the
    square brackets, we’re telling JavaScript that we want the value stored at index
    0. In this example, the string "Hello" is assigned to the zeroth position. Similarly,
    the string "World" is stored at index one. Figure 3.1 shows how this looks.


    ![](img/ae490e66f6d11d20689f8bf3d738bef9_41_0.png)'
