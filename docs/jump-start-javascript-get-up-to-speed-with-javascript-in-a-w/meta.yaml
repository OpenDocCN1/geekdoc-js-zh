- md: "## Methods\n\n### apply\n\nSometimes, you need to change what a function's\
    \ `this` keyword points to. The `apply` method makes it easy by letting you pass\
    \ an object in as its first parameter that the `this` keyword will point to:\n\
    \n```\nvar person, lastName;\n\nlastName = \"Reyes\";\nperson = function() {\n\
    \  return this.lastName;\n};\n\nperson(); // returns \"Reyes\"\n\nperson.apply({lastName:\
    \ \"Cooper\"}); // returns \"Cooper\"\n```\n\nIn this example, our function refers\
    \ originally to the globally declared `lastName` since in this case, `this` refers\
    \ to `window`. But when we use `apply`, we pass in an object that the `this` keyword\
    \ now points to, and hanging off it is a new `lastName` value. Therefore, when\
    \ we use `apply` the return value is no longer \"Reyes\" but \"Cooper\".\n\nWhen\
    \ calling `apply`, you can also pass the function an array of arguments:\n\n```\n\
    var tax;\n\ntax = function(price, provincial, federal) {\n  return price * provincial\
    \ * federal;\n};\n\ntax.apply(null, [100, 1.05, 1.095]); // returns 114.975\n\
    ```\n\nHere, we have a `tax` function that takes a price, multiplies it by the\
    \ provincial and federal tax rates, and returns the value. Since we aren't trying\
    \ to change where the `this` keyword is pointing, we don't bother passing in a\
    \ value for the first argument. Instead, we skip it by passing in `null`. We then\
    \ pass in an array containing values for the price, and the provincial and federal\
    \ tax rates.\n\n### call\n\nThe call method is almost identical to apply except\
    \ that instead of passing in an array of arguments, you only pass arguments, just\
    \ as you would when calling the function itself (starting from the second argument):\n\
    \n```\nvar tax;\n\ntax = function(price, provincial, federal) {\n  return price\
    \ * provincial * federal;\n};\n\ntax.call(null, 100, 1.05, 1.095); // returns\
    \ 114.975\n```\n\nNote how the only difference between this implementation and\
    \ the one for apply is how we pass the price, provincial, and federal values.\
    \ With apply, they're passed in an array while here, they're passed in as individual\
    \ arguments.\n\n### bind\n\nWith ECMAScript 5, it's now possible to call the bind\
    \ method off a function and pass in an object that will be referred to as this.\
    \ The bind method creates a new function with the object bound to it:\n\n```\n\
    var hugo, person, names;\n\nperson = function () {\n  return this.lastName;\n\
    };\n\nhugo = person.bind({lastName: \"Reyes\"});\nhugo(); // returns \"Reyes\"\
    \n\nnames = {\n  lastName: \"Cooper\",\n  hugo: hugo,\n  person: person\n};\n\
    names.hugo(); // returns \"Reyes\"\nnames.person(); // returns \"Cooper\"\n```\n\
    \nYou'll note how the person function points to this.lastName and that before\
    \ we bind it, lastName refers to a variable in the global window space (which\
    \ is undefined). So we go ahead and bind it to an object containing a `lastName`\
    \ property with the value of \"Reyes\". Now, when we call the newly created hugo\
    \ function, \"Reyes\" is returned to us from the object that was bound to it.\n\
    \nSay if we were to place the original `person` function as well as the newly\
    \ created `hugo` function inside an object containing a `lastName` property. We\
    \ would see how `this` inside `person` dynamically points to the outer object,\
    \ and therefore `this.lastName` now returns \"Cooper\" while the permanently bound\
    \ `hugo` function continues to return \"Reyes\".\n\n### toString\n\nThe `toString`\
    \ method returns a string representing the code of a function. So, for example,\
    \ if we wrote a simple function:\n\n```\nfunction foo() {\n  return \"foo\";\n\
    }\n```\n\nand then called `toString` on it:\n\n```\nfoo.toString();\n```\n\nwe'd\
    \ have a response such as this:\n\n```\n\"function foo() {\n  return \"foo\";\n\
    }\"\n```\n\nIf, however, we called `toString` on a function that's a part of the\
    \ JavaScript language:\n\n```\ndocument.getElementById.toString()\n```\n\nwe'd\
    \ receive a response that looked as follows:\n\n```\n\"function getElementById()\
    \ { [native code] }\"\n```\n\nThat's because the code responsible for `getElementById`\
    \ is compiled, and cannot be output in human-readable form as JavaScript can.\n\
    \n## Project\n\nNow that we have functions and objects figured out, we can start\
    \ doing some fancy stuff with our task manager project. Instead of a simple array\
    \ of tasks, we can store richer information by using an array of objects. We can\
    \ also write some functions to perform operations for us. Let's begin by wrapping\
    \ each task in an object:\n\n```\nvar tasks;\n\ntasks = [\n  {\n    text: \"Pay\
    \ phone bill\",\n    complete: false,\n    priority: 1\n  },\n  {\n    text: \"\
    Write best-selling novel\",\n    complete: false,\n    priority: 3\n  },\n  {\n\
    \    text: \"Walk the dog\",\n    complete: false,\n    priority: 2\n  }\n];\n\
    ```\n\nNow we have a richer set of data; each task now has a `complete` flag associated\
    \ with it, as well as a priority. Let's write a function to add tasks to our array:\n\
    \n```\nvar tasks, addTask;\n\ntasks = [];\n\naddTask = function(task) {\n  tasks.push({\n\
    \    text: task,\n    complete: false,\n    priority: 1\n  });\n};\n```\n\nNow\
    \ we can call `addTask`, pass it some text to store it, with a `complete` flag\
    \ set to `false` in our `tasks` array.\n\n### Summary\n\nIn this chapter, we covered\
    \ objects, including how to write to and read from objects, and how to nest objects\
    \ to create namespacing for variables. We also looked at looping over objects\
    \ to read data, and how we can filter the prototype chain out when looping over\
    \ object properties. We then went on to functions, exploring the different ways\
    \ we can create functions, as well as how we can use functions to write object-oriented\
    \ code. We examined various properties and methods of functions, and finished\
    \ off by adding our knowledge to the task manager project we're building.\n\n\
    In the next chapter, we'll take a look at looping and jumping.\n\n## Chapter 5\n\
    \n## Loops and Jumps\n\nThis chapter introduces loop and jump statements. A **loop\
    \ statement** is used when we want to repeat some programming statements until\
    \ a specified condition is reached. A typical example would be to iterate through\
    \ a list and perform an operation on each member of the list. A **jump statement**\
    \ allows code to exit loops. One example is to loop through our to-do list and\
    \ then break out of the loop upon reaching the first incomplete item. There are\
    \ various types of jump statements, which we'll explain as we go along.\n\nLoops\
    \ are generally associated with a particular style of programming known as **imperative\
    \ programming**. Here, the programmer specifies step by step how a program should\
    \ achieve a particular task. An alternative approach is **functional programming**,\
    \ which states what the program should be doing without exactly specifying how\
    \ the program should do it. JavaScript supports multiple paradigms including imperative\
    \ and functional styles. We will spend the latter part of this chapter looking\
    \ at some functional alternatives to working with loops. Functional programming\
    \ can provide more elegant solutions to certain types of problems, and it can\
    \ make your code base smaller, more understandable, and easier to maintain.\n\n\
    ## Loops\n\nBy way of introduction, we should note that as with the if statement,\
    \ all looping constructs can be written without the enclosing curly braces when\
    \ only a single statement is involved. For clarity, we recommend that you always\
    \ include the curly braces, even for single statements. This is the standard that\
    \ was followed by the team at id Software when they programmed Doom 3.¹ We say\
    \ only partially tongue in cheek that if it's good enough for the legendary John\
    \ Carmack and his team, it's certainly good enough for us!\n\n### The while Loop\n\
    \nThe while loop takes the following form:\n\n```\nwhile (condition) {\n    statement\n\
    }\n```\n\nThe condition can be any expression that evaluates to true or false.\
    \ The statement consists of the code that is executed while the condition evaluates\
    \ to true. Recall that in JavaScript, any value can be converted to a Boolean.\
    \ For those who need a refresher on how particular values in JavaScript are converted\
    \ to Booleans, we refer you to this excellent article written by our technical\
    \ editor, Colin Ih rig.²\n\nThe while loop can be illustrated with this simple\
    \ example:\n\n```\nvar tasksToDo = 3;\n\nwhile (tasksToDo > 0) {\n    console.log('There\
    \ are ' + tasksToDo + ' tasks to do');\n    tasksToDo--;\n}\n```\n\nThis prints\
    \ the following to the console:"
  mdcn: "\n## 方法\n\n### apply\n\n有时，你需要改变一个函数的 `this` 关键字所指向的对象。`apply` 方法使得这项操作变得简单，因为它允许你传递一个对象作为第一个参数，`this`\
    \ 关键字将指向这个对象：\n\n```\nvar person, lastName;\n\nlastName = \"Reyes\";\nperson =\
