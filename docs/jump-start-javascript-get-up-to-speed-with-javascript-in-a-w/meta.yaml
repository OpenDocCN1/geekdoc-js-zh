    \ can be tricky to work with, as what it refers to depends entirely on how it's\
    \ used. We saw one example of its use in the Account object example earlier. In\
    \ that case, `this` referred to the object we instantiated. Depending on context,\
    \ though, `this` points to different things, and it's important to know what it's\
    \ referring to.\n\nFor example, in Figure 4.7 it refers to the global window object\
    \ when used in a regular function, while in a constructor it refers to the function\
    \ itself. In a regular function inside an object literal, the `this` keyword refers\
    \ to the immediate parent object, while in an event handler, it refers to the\
