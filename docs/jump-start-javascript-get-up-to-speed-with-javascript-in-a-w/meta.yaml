    \ that the data in an array conforms to a set of criteria. You could, as in the\
    \ previous example, run a manual test using either a traditional for loop or the\
    \ forEach method. Or you could just use the every method that runs"
  - "[PAGE 58]\n\na callback function against each item in the array. It will return\
    \ `true` if they all conform, or `false` if one or more fails to:\n\n```\nvar\
    \ arr, isValid;\n\narr = [1, 2, 3, 4, 5];\nisValid = arr.every(function(num) {\n\
    \    return (num < 10);\n}); // isValid is true\n```\n\nIn this example, we're\
    \ using the `every` method to check that every item in our array is less than\
    \ 10. The `every` method loops over the array, and for each item it runs the function\
    \ we've included within its parentheses. The current array item is passed in as\
    \ `num`, and our expression (`return (num < 10)`) checks to see if the number\
    \ is less than ten, returning `true` or `false`. `every` monitors the response\
    \ from our code and if we ever return `false`, it kicks out of the loop and returns\
    \ `false`. We capture its response in the variable `isValid`. In the case above,\
    \ the `every` method will return `true`. If we change our expression to check\
    \ if numbers are greater than 3, then `isValid` will be `false`:\n\n```\nvar arr,\
    \ isValid;\n\narr = [1, 2, 3, 4, 5];\nisValid = arr.every(function(num) {\n  \
    \  return (num < 3);\n}); // isValid is false\n```\n\n# some (JavaScript 1.6)\n\
    \nYou can use `some` to check if one or more of the items in an array conform\
    \ to a test. `some` works just like `every`, but will return `true` as long as\
    \ one array item returns `true`:\n\n```\nvar arr, isValid;\n\narr = [1, 2, 3,\
    \ 4, 5];\n```"
  - "[PAGE 59]\n\n```\nisValid = arr.some(function(num) {\n  return (num < 2);\n});\
    \ // isValid is true\n```\n\nIn this example, even though just the one number\
    \ in the array is less than two, isValid is still true.\n\n# filter (JavaScript\
    \ 1.6)\n\nIt's all well and good to test an array, but what if you want to create\
    \ a new array with the items that met your criteria? Well, filter does just that.\
    \ It works like every and some do, except that any item that passes your criteria\
    \ is copied into a new array:\n\n```\nvar arr, filtered;\n\narr = [1, 2, 3, 4,\
    \ 5, 6, 7, 8, 9];\nfiltered = arr.filter(function(num) {\n  return (num < 5);\n\
    });\n// filtered now contains [1, 2, 3, 4]\n```\n\n# reduce and reduceRight (JavaScript\
    \ 1.8)\n\nAt times it's necessary to perform a mathematical operation on the array\
    \ and reduce it to a single value; for instance, if you want the sum of the values\
    \ in an array. This is where reduce (and reduceRight) come into play. reduce loops\
    \ over an array and passes in a previous and current value. It also passes in\
    \ the current index and a reference to the array itself, should you need them\
    \ in your calculations. For this example, however, we'll be using the previous\
    \ and current arguments only:\n\n```\nvar arr, total;\n\narr = [1, 2, 3, 4, 5];\n\
    total = arr.reduce(function(previous, current) {\n  return previous + current;\n\
    }); // total is 15\n```"
- md: "Here, `reduce` is running over the array just as the earlier methods did, but\
    \ with a couple of big differences. For one, on the first pass, since there's\
    \ no a `previous` value to pass in, the first and second items of the array are\
    \ passed in (the values 1 and 2 in this case). On subsequent passes, the `previous`\
    \ value is what your code returns, and the current value is the next item in the\
    \ array. What we're doing here is taking the current item in the array and adding\
    \ it to the previous value—the running total. The end result is that we add all\
    \ the array's values together for the total value of 15.\n\n`reduceRight` performs\
    \ the same function as `reduce` but in reverse. In other words, it starts at the\
    \ end of the array and moves towards the start.\n\n## Project\n\nOur intention\
    \ is to build a fully functional task manager (or a to-do app, if you like), but\
    \ since we've only covered variables and arrays up to this point, we've been unable\
    \ to write that much code yet. In the previous chapter, we created three separate\
    \ variables holding three distinct tasks. Let's now put those three tasks in an\
    \ array called `tasks`:\n\n```\nvar tasks;\n\ntasks = [\n    \"Pay phone bill\"\
    ,\n    \"Write best-selling novel\",\n    \"Walk the dog\"\n];\n```\n\n## Summary\n\
    \nThis chapter has introduced arrays, and a number of methods for working with\
    \ them. However, in JavaScript, arrays are actually objects, so to truly understand\
    \ arrays, you need to understand objects as well. Don't worry, though; objects\
    \ are covered in detail in the next chapter.\n\n## Chapter 4\n\n## Objects and\
    \ Functions\n\nIn the previous chapter, we looked at arrays. Now we're going to\
    \ look at objects, which are similar to arrays in that they are containers for\
    \ collections of data. Though there are similarities—arrays are actually a type\
    \ of object—there are also some significant differences.\n\n## Objects\n\n###\
    \ Creating an Object\n\nAs with arrays, there are a couple of ways to create objects,\
    \ and, just like arrays, one is preferred over the other. So even though you can\
    \ do this:\n\n```\nvar myObject = new Object();\n```\n\nIt is much better to do\
    \ this:\n\n```\nvar myObject = {};\n```\n\nThe latter is simpler, safer, and therefore\
    \ preferred. If you remember from Chapter 3, Array() can be overwritten for malicious\
    \ purposes. So can Object(), which is why it's safer to use the object literal\
    \ notation {} as it's unable to be overwritten. The object literal represents\
    \ a new, empty object.\n\nWhereas in an array, values are simply added and accessed\
    \ by index, objects use a key/value pair system. These two distinct ways of storing\
    \ values make it fairly simple when choosing between arrays or objects for your\
    \ data storage and retrieval needs. For example:\n\n```\nvar lotteryNumbers, profile;\n\
    \nlotteryNumbers = [4, 8, 15, 16, 23, 42];\nprofile = {\n    firstName: \"Hugo\"\
    ,\n    lastName: \"Reyes\",\n    flight: \"Oceanic 815\",\n    car: \"Camaro\"\
    \n};\n```\n\nNote how the lotteryNumbers array lends itself well to storing the\
    \ sequence of lottery numbers, while the profile object is perfect for storing\
    \ the key/value pairs of a person's (Hugo's) profile.\n\n### Adding to an Object\n\
    \nAs you may have already noticed in the previous section, you can declare either\
    \ an empty object, {}, or one with values in it (Hugo's profile). After you've\
    \ declared your object, however, you can still add key/value pairs to it in a\
    \ couple of ways. When looking at the chapter on arrays, we touched on named indices,\
    \ which can be used to create associative arrays, though objects are better suited\
    \ to the task. Here's an example of that:\n\n```\nvar obj = {};\n\nobj[\"firstName\"\
    ] = \"Hugo\";\nobj[\"lastName\"] = \"Reyes\";\n```\n\nThis is known as bracket\
    \ notation. The alternative and more common syntax is dot notation. Here's an\
    \ example:\n\n```\nvar obj = {};\n\nobj.firstName = \"Hugo\";\nobj.lastName =\
    \ \"Reyes\";\n```\n\nDot notation is simpler than bracket notation; however, there\
    \ are certain tasks that can only be done with bracket notation. For example,\
    \ you can use a variable inside the brackets, which can't be done using dot notation.\
    \ Bracket notation also supports strings containing spaces and other characters\
    \ that are invalid in dot notation.\n\n### Reading from an Object\n\nReading a\
    \ value from an object can also be accomplished using bracket or dot notation:\n\
    \n```\nvar obj = {};\n\nobj.firstName = \"Hugo\";\nobj.lastName = \"Reyes\";\n\
    alert(\"Hello, my name is \" + obj.firstName + \" \"\n+ obj.lastName + \".\");\n\
    ```\n\nThe result of running this code is shown in Figure 4.1.\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_64_0.png)\n\
    \nUnlike arrays, it's not possible to read the contents of an object using a numeric\
    \ index. The only type of index that can be used is a named one:\n\n```\nvar obj\
    \ = {};\n\nobj.firstName = \"Hugo\";\n\nobj[0];           // returns undefined\n\
    obj[\"firstName\"]; // returns \"Hugo\"\nobj.firstName;    // returns \"Hugo\"\
    \n```\n\n### Nested Objects\n\nNesting objects can be very helpful in organizing\
    \ your data:\n\n```\nvar person;\n\nperson = {\n  name: {\n    first: \"Hugo\"\
    ,\n    last: \"Reyes\"\n  }\n};\nperson.name.first; // returns \"Hugo\"\nperson.name.last;\
    \  // returns \"Reyes\"\n```\n\nIt's also possible to assign objects:\n\n```\n\
    var person;\n\nperson = {};\nperson.name = {};\nperson.name.first = \"Hugo\";\n\
    person.name.last = \"Reyes\";\n```\n\nNote, however, that the following will fail\
    \ to work:\n\n```\nvar person;\n\nperson = {};\nperson.name.first = \"Hugo\";\n\
    ```\n\nThis will throw the error `TypeError: Cannot set property 'first' of undefined`,\
    \ which means that it's trying to create `first` off `name`, which was never defined.\
    \ In the prior example, we assigned an object to `person.name`, but not in this\
    \ one.\n\n### Namespacing through Nested Objects\n\nIf you're at all familiar\
    \ with modern programming languages, you've heard of namespacing. Essentially,\
    \ it's a better way to organize code by putting it into nested buckets, or namespaces:\n\
    \n```\nProject.Strings.Warnings.sessionExpired =\n    \"Your session has expired.\"\
    \n```\n\nOf course, in order for this namespace to exist, we must first nest the\
    \ appropriate objects:\n\n```\nvar Project = {\n    Strings: {\n        Warnings:\
    \ {}\n    }\n};\n```\n\nThough this code sets up the required namespace, what\
    \ happens if one or all of the objects in question are already there? And what\
    \ if they already contain data?\n\nSay, for example, we had the following:\n\n\
    ```\nvar Project = {\n    Strings: {\n        Warnings: {\n            overQuota:\
    \ \"You've exceeded your quota!\",\n            outOfStock: \"We're out of stock!\"\
    \n        }\n    }\n};\n```\n\nNow say elsewhere in our program (in a different\
    \ JavaScript file) we wanted to add `Widgets` to the `Project` namespace, but\
    \ were unsure whether it was already defined:\n\n```\nvar Project = {\n    Widgets:\
    \ {}\n};\n```\n\nBy doing what we just did, we've destroyed the existing Strings\
    \ object because we've overwritten the whole Project object with a new one. What\
    \ we should be doing instead is checking to see if a Project object already exists.\
    \ If so, we add to it; otherwise, we create it and then add to it:\n\n```\nvar\
    \ Project = Project || {};\n\nProject.Widgets = {};\n```\n\nHere we use the OR\
    \ operator (||) to test whether or not Project is defined. If Project is already\
    \ defined, it assigns its value to Project and nothing is changed. If it isn't,\
    \ JavaScript assigns what's on the right-hand side of || to the Project variable,\
    \ which is shown in Figure 4.2\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_68_0.png)\n\
    \nFigure 4.2. Demonstration of || operator in action\n\n### Prototype Chain\n\n\
    We're going to discuss looping over objects shortly, but in order to do that,\
    \ I need to first cover JavaScript's prototype chain. You'll see why in just a\
    \ second. For the time being, we'll take a quick look at prototypes because we'll\
    \ be covering them in more detail later in the section on functions. For now,\
    \ it's important to understand a little bit about them and how they affect looping\
    \ over key/values in objects.\n\nAll objects have a prototype. So, what's a **prototype**?\
    \ It's an object from which other objects inherit properties. Figure 4.3 presents\
    \ a diagram illustrating the concept of prototypal inheritance."
  mdcn: "\n在这里，`reduce` 像前面的方法一样遍历数组，但有几个主要区别。首先，在第一次遍历时，由于没有 `previous` 值传入，数组的第一项和第二项会被传入（本例中是值\
    \ 1 和 2）。在后续遍历中，`previous` 值是你的代码返回的结果，而当前值则是数组中的下一项。我们这里做的事情是，将数组中的当前项与之前的值——即运行总和——相加。最终结果是将数组所有值相加得到总和\
    \ 15。\n\n`reduceRight` 执行与 `reduce` 相同的功能，但顺序相反。换句话说，它从数组的末尾开始，向开头移动。\n\n## 项目\n\
    \n我们的目标是构建一个功能完善的任务管理器（或者如果你愿意，也可以叫待办事项应用），但到目前为止我们只涵盖了变量和数组，所以还没能编写太多代码。在上一章中，我们创建了三个独立的变量来保存三个不同的任务。现在让我们将这三个任务放入一个名为\
    \ `tasks` 的数组中：\n\n```\nvar tasks;\n\ntasks = [\n    \"Pay phone bill\",\n   \
    \ \"Write best-selling novel\",\n    \"Walk the dog\"\n];\n```\n\n## 总结\n\n本章介绍了数组，以及许多用于处理数组的方法。然而，在\
    \ JavaScript 中，数组实际上是对象，所以要真正理解数组，你也需要理解对象。不过别担心；下一章会详细介绍对象。\n\n## 第 4 章\n\n##\
    \ 对象与函数\n\n在上一章中，我们看了数组。现在我们将研究对象，它们与数组相似，都是数据的容器。虽然存在相似之处——数组实际上是一种对象——但也有一些显著的区别。\n\
    \n## 对象\n\n### 创建对象\n\n与数组一样，创建对象有几种方式，而且就像数组一样，其中一种方式比另一种更受推荐。因此，尽管你可以这样做：\n\n\
    ```\nvar myObject = new Object();\n```\n\n但更好的做法是：\n\n```\nvar myObject = {};\n\
    ```\n\n后者更简单、更安全，因此是首选。如果你还记得第 3 章的内容，`Array()` 可能被恶意重写。`Object()` 同样存在这种风险，这就是为什么使用对象字面量符号\
    \ `{}` 更安全，因为它无法被重写。对象字面量表示一个新的空对象。\n\n在数组中，值只是通过索引添加和访问，而对象则使用键/值对系统。这两种不同的值存储方式使得在选择数据存储和检索需求时，数组还是对象变得相当简单。例如：\n\
    \n```\nvar lotteryNumbers, profile;\n\nlotteryNumbers = [4, 8, 15, 16, 23, 42];\n\
    profile = {\n    firstName: \"Hugo\",\n    lastName: \"Reyes\",\n    flight: \"\
    Oceanic 815\",\n    car: \"Camaro\"\n};\n```\n\n请注意 `lotteryNumbers` 数组如何很好地适合存储彩票号码序列，而\
    \ `profile` 对象则非常适合存储一个人（雨果）的个人资料的键/值对。\n\n### 向对象添加内容\n\n你可能在上一节中已经注意到，你可以声明一个空对象\
    \ `{}`，或者一个带有值的对象（雨果的个人资料）。然而，在声明对象之后，你仍然可以通过几种方式向其添加键/值对。在查看数组章节时，我们提到了命名索引，它可以用来创建关联数组，尽管对象更适合这项任务。这是一个例子：\n\
    \n```\nvar obj = {};\n\nobj[\"firstName\"] = \"Hugo\";\nobj[\"lastName\"] = \"\
    Reyes\";\n```\n\n这被称为括号表示法。另一种更常见的语法是点表示法。这是一个例子：\n\n```\nvar obj = {};\n\nobj.firstName\
    \ = \"Hugo\";\nobj.lastName = \"Reyes\";\n```\n\n点表示法比括号表示法更简单；然而，某些任务只能通过括号表示法来完成。例如，你可以在括号内使用变量，这在点表示法中是做不到的。括号表示法还支持包含空格和其他在点表示法中无效字符的字符串。\n\
    \n### 从对象读取\n\n从对象读取值也可以使用括号或点表示法来完成：\n\n```\nvar obj = {};\n\nobj.firstName =\
    \ \"Hugo\";\nobj.lastName = \"Reyes\";\nalert(\"Hello, my name is \" + obj.firstName\
    \ + \" \"\n+ obj.lastName + \".\");\n```\n\n运行此代码的结果如图 4.1 所示。\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_64_0.png)\n\
    \n与数组不同，不可能使用数字索引来读取对象的内容。唯一可以使用的索引类型是命名索引：\n\n```\nvar obj = {};\n\nobj.firstName\
    \ = \"Hugo\";\n\nobj[0];           // 返回 undefined\nobj[\"firstName\"]; // 返回\
    \ \"Hugo\"\nobj.firstName;    // 返回 \"Hugo\"\n```\n\n### 嵌套对象\n\n嵌套对象对于组织你的数据非常有帮助：\n\
    \n```\nvar person;\n\nperson = {\n  name: {\n    first: \"Hugo\",\n    last: \"\
    Reyes\"\n  }\n};\nperson.name.first; // 返回 \"Hugo\"\nperson.name.last;  // 返回\
    \ \"Reyes\"\n```\n\n也可以这样赋值对象：\n\n```\nvar person;\n\nperson = {};\nperson.name\
    \ = {};\nperson.name.first = \"Hugo\";\nperson.name.last = \"Reyes\";\n```\n\n\
    但是请注意，以下做法将无法工作：\n\n```\nvar person;\n\nperson = {};\nperson.name.first = \"Hugo\"\
    ;\n```\n\n这将抛出错误 `TypeError: Cannot set property 'first' of undefined`，这意味着它试图在未定义的\
    \ `name` 上创建 `first`。在前面的例子中，我们为 `person.name` 赋值了一个对象，但这里没有。\n\n### 通过嵌套对象实现命名空间\n\
    \n如果你对现代编程语言有所了解，你一定听说过命名空间。本质上，它是一种通过将代码放入嵌套的桶或命名空间来组织代码的更好方式：\n\n```\nProject.Strings.Warnings.sessionExpired\
    \ =\n    \"Your session has expired.\"\n```\n\n当然，为了使此命名空间存在，我们必须首先嵌套相应的对象：\n\n\
    ```\nvar Project = {\n    Strings: {\n        Warnings: {}\n    }\n};\n```\n\n\
    尽管此代码设置了所需的命名空间，但如果一个或所有相关对象已经存在怎么办？如果它们已经包含数据怎么办？\n\n例如，假设我们有以下内容：\n\n```\nvar\
    \ Project = {\n    Strings: {\n        Warnings: {\n            overQuota: \"\
    You've exceeded your quota!\",\n            outOfStock: \"We're out of stock!\"\
    \n        }\n    }\n};\n```\n\n现在假设在我们程序的其他地方（在不同的 JavaScript 文件中），我们想向 `Project`\
    \ 命名空间添加 `Widgets`，但不确定它是否已经定义：\n\n```\nvar Project = {\n    Widgets: {}\n};\n\
    ```\n\n通过我们刚才的操作，我们破坏了现有的 `Strings` 对象，因为我们用一个新的对象覆盖了整个 `Project` 对象。我们应改为检查 `Project`\
    \ 对象是否已存在。如果存在，我们就向其添加；否则，我们创建它，然后再添加：\n\n```\nvar Project = Project || {};\n\n\
    Project.Widgets = {};\n```\n\n这里我们使用 OR 运算符（`||`）来测试 `Project` 是否已定义。如果 `Project`\
    \ 已定义，它会将其值赋给 `Project`，不进行任何更改。如果未定义，JavaScript 会将 `||` 右侧的值赋给 `Project` 变量，如图\
    \ 4.2 所示。\n\n![](img/ae490e66f6d11d20689f8bf3d738bef9_68_0.png)\n\n图 4.2. `||`\
    \ 运算符演示\n\n### 原型链\n\n我们很快将讨论如何遍历对象，但为此，我需要先介绍 JavaScript 的原型链。你马上就会明白为什么。目前，我们将快速了解一下原型，因为稍后在函数部分我们会更详细地介绍它们。现在，了解一点关于它们的知识以及它们如何影响遍历对象中的键/值很重要。\n\
    \n所有对象都有一个原型。那么，什么是 **原型**？它是一个其他对象从中继承属性的对象。图 4.3 展示了一个说明原型继承概念的图表。\n"
