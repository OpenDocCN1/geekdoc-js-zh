    \ this in the next section.\n\n## Custom Events\n\nJavaScript provides a simple\
    \ mechanism for creating custom events. Before describing the details of the implementation,\
    \ it is worth going over an example use case, since the use of custom events is\
    \ not always obvious to someone new to JavaScript. Suppose our to-do application\
    \ is complete and somebody else wishes to write a plugin to display a fancy notification\
    \ to the user every time they add a new item to their list.\n\nHow should they\
    \ go about doing this? One possible option would be for the other programmer to\
    \ modify our script and place their notification code inside ours. This is problematic\
    \ on several fronts. Firstly they may not have access to our source code. Although\
    \ JavaScript will always be viewable as plain text, before shipping, we may choose\
    \ to compress our code to improve loading times. This would make our source code\
    \ very difficult to work with directly.\n\nBut even suppose that we granted access\
    \ to our original source code. Directly altering the to-do list code base is still\
    \ a bad idea for a number of reasons. Firstly, if we decide to update our to-do\
    \ list code, it may break the other programmer's modification. Secondly, if a\
    \ number of programmers all wish to create their own plugins, the original code\
    \ base will quickly become bloated and unmanageable.\n\nThe problem with the above\
    \ solution is that it involves modifying our to-do list code to incorporate functionality\
    \ that it does not need to know anything about. Whilst the plugin code needs to\
    \ know about the to-do list, the reverse is not true. The to-do list application\
    \ does not need to know about any plugins. In theory it should be possible for\
    \ thousands of plugins to be written whilst our original program happily chugs\
    \ along in ignorant bliss. The technical term for this architecture is loose coupling.\
    \ Let's now make this concept a little less abstract by providing an actual implementation\
    \ using a custom event.\n\nA custom event can be created by using the following\
    \ general construct:\n\n```\nvar event = new CustomEvent(type, eventInitDict);\n\
    ```\n\nHere, `type` is the name of the custom event, and is something we define.\
    \ `eventInitDict` provides the initialization parameters.\n\n`eventInitDict` is\
    \ itself a JavaScript object that takes the following three parameters:\n\n- **bubbles**:\
    \ A Boolean indicating whether the event bubbles up through the DOM or not. The\
    \ bubble phase and capture phase were covered earlier in this chapter.\n\n- **cancelable**:\
    \ A Boolean indicating whether the event is cancelable. If an event is cancelable\
    \ it means that it can have its default action prevented.\n\n- **detail**: The\
    \ data passed when initializing the event. We will populate this object depending\
    \ upon what data we wish to transmit with our custom event.\n\nLet's use an example\
    \ to illustrate the above. Create a new file named **customevent.html** containing\
    \ the following HTML:\n\n```\n<!doctype html>\n<html>\n<head>\n    <title>Events</title>\n\
    </head>\n<body>\n    <button id=\"btnAdd\">Add Task</button>\n    <script src=\"\
    customevent.js\"></script>\n</body>\n</html>\n```\n\nThis represents our dummy\
    \ to-do list application. Next, create a file named **customevent.js** containing\
    \ the following JavaScript code:\n\n```\nvar taskEvent = new CustomEvent(\"TaskAdded\"\
    , {\n    detail: {\n        message: \"A task has been added\",\n    },\n    bubbles:\
    \ true,\n    cancelable: true\n});\nvar btnAdd = document.getElementById(\"btnAdd\"\
    );\n\nbtnAdd.onclick = function(e) {\n    document.dispatchEvent(taskEvent);\n\
    };\n```\n\nThe above code creates a custom event. We define the name to be \"\
    TaskAdded\" and then provide the event with the initialization parameters. Every\
    \ time the button is clicked, we use **dispatchEvent** to trigger the event. Our\
    \ event can now be handled in exactly the same way as native events such as keystrokes\
    \ and mouse clicks. We make the simplifying assumption that a task is added every\
    \ time the button is clicked. In a real application you would likely only fire\
    \ the event if all the error checking passed. So now we have a mockup of a very\
    \ simple application. All it does is trigger a custom event when the button is\
    \ clicked. Suppose somebody now wishes to write a plugin. Add the following code\
    \ to a new file named **customeventplugin.js**:\n\n```\nfunction handleTaskAdded(e)\
    \ {\n    alert(e.detail.message);\n}\n\ndocument.addEventListener(\"TaskAdded\"\
    , handleTaskAdded, false);\n```\n\nAdd the following line to **customevent.html**:\n\
    \n```\n<script src=\"customeventplugin.js\"></script>\n```\n\nWhen you refresh\
    \ the page and click on the button you should now see a sight such as Figure 7.9.\n\
    \nThe use of custom events has some powerful implications. If we have a well-designed\
    \ event API, it means that other libraries and code bases can now interoperate\
    \ with our code purely by responding to events. These other code bases never directly\
    \ need to access our source code. A custom event can be triggered in any number\
    \ of situations it does not just have to be a user generated event. This mechanism\
    \ opens up the possibility of creating rich JavaScript ecosystems by way of interacting\
    \ loosely coupled components. Let’s turn to how we use events in our project.\n\
    \n## Project\n\n### Adding Tasks\n\nOur to-do list application needs to deal with\
    \ and respond to a number of user events. Users add a task by submitting a form.\
    \ This is handled in JavaScript as follows:\n\n```\naddForm.onsubmit = function(e)\
    \ {\n  var val;\n\n  preventDefault(e);\n  val = newTaskField.value;\n\n  if (val\
