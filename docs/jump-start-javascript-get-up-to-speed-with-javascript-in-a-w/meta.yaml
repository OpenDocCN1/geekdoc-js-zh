    # # Chapter 6


    # ## The Document Object Model


    # ### What is the DOM?


    The Document Object Model (DOM) is an API for manipulating HTML and XML documents.
    It''s a tree hierarchy of objects representing a document, and facilitates scripting
    by exposing methods and properties. Though the DOM is quite powerful today, and
    large parts of its specification are well-supported across all major browsers,
    this wasn''t always the case.


    At first there was little uniformity, let alone a specification. Back in the bad
    old days of the Browser Wars,¹ when Netscape and Microsoft were vying for supremacy
    over the Web, one-upmanship was the name of the game. This lead to conflicting
    implementations, with each manufacturer introducing non-standard features into
    its own product. As developers began using these features, competing vendors were
    forced to mimic the behavior so that web pages wouldn''t break in their own browsers.
    Features were forced into existence simply by whoever held significant market
    share with their browser. As you can imagine, it was a headache at best for web
    developers trying to make their code work in the major browsers of the day.


    ¹ http://en.wikipedia.org/wiki/Browser_wars'
- md: "## The Need for Backward Compatibility\n\nThe web is a strange animal, unlike\
    \ any other software. Though browsers continue to evolve, the pages that they\
    \ interpret can date from as far back as 1991. This means that any innovation\
    \ or iteration on existing browser technology must continue to work with older\
    \ web pages. It’s because of this phenomenon that the DOM as we know it today\
    \ contains artifacts from the “bad old days.”\n\n## The document Object\n\nThe\
    \ document object is a top-level object encompassing (and acting as an entry point\
    \ into) your document. All the objects, methods, and properties that you’ll need\
    \ to work with your document hang off the document object. For example, one of\
    \ the most common methods in use today is `getElementById`, which returns an element\
    \ in the DOM by its `id` attribute:\n\n```html\ngetElementById.html (excerpt)\n\
    <!doctype html>\n<html>\n<head>\n</head>\n<body>\n    <div id=\"foo\">Foo, baby.\
    \ Foo!</div>\n    <div id=\"bar\">Meh.</div>\n    <script>\n        // returns\
    \ a reference to the first div\n        var el = document.getElementById(\"foo\"\
    );\n    </script>\n</body>\n</html>\n```\n\nYou can also retrieve other information,\
    \ such as the document's title, simply by using `document.title`.\n\n## DOM Level\
    \ 0 or Legacy DOM\n\nA few throwbacks to the days of the Legacy DOM are the document's\
    \ forms, links, and images collections. This practice of providing named accessors\
    \ for specific element types was discontinued in DOM Level 1. In DOM0, however,\
    \ this was how you accessed `<form>`, `<image>`, and `<anchor>` elements. You\
    \ could do this by using either the name of the element, or passing its index\
    \ into the appropriate accessor via the document object. Let's take the following\
    \ document, for example:\n\n```html\n<html>\n<head>\n</head>\n<body>\n  <img src=\"\
    mom.jpg\" name=\"mother\">\n  <img src=\"dad.jpg\" name=\"father\">\n  <form name=\"\
    contact\">\n    <a href=\"http://www.sitepoint.com\" name=\"sitepoint\">\n   \
    \   SitePoint </a>\n  </form>\n  <a href=\"http://www.w3.org\" name=\"w3\">W3C</a>\n\
    \  <script>\n    var mom, dad, sitepoint, contact;\n\n    mom = document.images.mother;\
    \ dad = document.images[1];\n    sitepoint = document.links.sitepoint;\n    contact\
    \ = document.contact;\n  </script>\n</body>\n</html>\n```\n\nThe resulting DOM\
    \ hierarchy is seen in Figure 6.1.\n\nYou could access the form named `contact`\
    \ by using `document.contact`. You could also access it by using `document.forms[0]`,\
    \ assuming the form you wanted was the first one in the page's hierarchy (which,\
    \ in this case, it is). If it were the second of two forms, you'd use `document.forms[1]`,\
    \ and so on. In our example, we access the second image by referring to `document.images[1]`.\
    \ This syntax can be used for all three accessors. As with any array, you can\
    \ loop over the returned results:\n\n```javascript\nvar imgs, img, i;\n\nimgs\
    \ = document.images;\n\nfor (i = 0; i < imgs.length; i += 1) {\n  img = imgs[i];\
    \ // get reference to image element\n  console.log(img);\n}\n```\n\n## DOM Level\
    \ 1\n\nIn 1998, the W3C released the DOM Level 1 specification.<sup>4</sup> The\
    \ spec took the existing hierarchy of the DOM and normalized its contents by introducing\
    \ the `Node` object, from which most objects are derived. Of the handful of object\
    \ types that the specification introduced, the most common are `Document`, `Element`,\
    \ `Attr`, and `Text`, which account for the majority of the contents of an HTML\
    \ document.\n\nIn the following HTML, the `<div>` will become an `Element` node,\
    \ its `id` attribute will become an `Attr` node, and the \"Hello!\" will become\
    \ a `Text` node:\n\n```html\n<html>\n    <head>\n    </head>\n    <body>\n   \
    \     <div id=\"welcome\">Hello!</div>\n    </body>\n</html>\n```\n\nThe previously\
    \ mentioned `Document` node is actually an abstract node that wraps everything,\
    \ and doesn't directly represent any tags in the HTML. The `<html>` tag is a special\
    \ `Element` node, known as the document element, and can be accessed at `document.documentElement`.\n\
    \nThere are also less common types of nodes such as `ProcessingInstruction` and\
    \ `EntityReference`, but we'll stick to the most common ones for our purposes.\
    \ A listing of the various node types is shown in Figure 6.2.\n\n## Creating DOM\
    \ Elements and Attributes\n\nAt the root of our DOM tree is the document element,\
    \ and there can only be one per document. Since it encompasses the rest of the\
    \ document’s nodes, it has a set of methods allowing you to create all the child\
    \ nodes that it can contain. So if you wanted to create a `<div>` element, for\
    \ example, you’d use the document object’s `createElement` method in this way:\n\
    \n```javascript\nvar myDiv = document.createElement(\"div\");\n```\n\nThis returns\
    \ an empty `<div>` element. It’s important to note that the element we’ve just\
    \ created currently only exists in memory, and is not part of the document. In\
    \ order to add our `<div>` to the document, we need to append it to a node somewhere\
    \ in the DOM using the `appendChild` method.\n\nRemember when I said that all\
    \ objects derive from `Node`? Well, since `Node` exposes the `appendChild` method,\
    \ we can use that method to append our newly created `<div>` as a child of any\
    \ given object in the DOM. Let's add our `<div>` to the `contact` form in the\
    \ previous DOM0 example. We can still access our `contact` form by its name attribute,\
    \ so let's just call `appendChild` off it to add our `<div>` to the form:\n\n\
    ```javascript\nvar myDiv = document.createElement(\"div\");\n\ndocument.contact.appendChild(myDiv);\n\
    ```\n\nOur form now looks like this:\n\n```html\n<form name=\"contact\">\n  <a\
    \ href=\"http://www.sitepoint.com\" name=\"sitepoint\">\n  SitePoint </a>\n  <div></div>\n\
    </form>\n```\n\nOnce we've added our `<div>`, we can add attributes using the\
    \ `setAttribute` method. So, for example, we could give our `<div>` a `name` attribute:\n\
    \n```javascript\nvar myDiv = document.createElement(\"div\");\n\nmyDiv.setAttribute(\"\
    name\", \"foo\");\ndocument.contact.appendChild(myDiv);\n```\n\nThis will give\
    \ us a `<div>`:\n\n```html\n<div name=\"foo\"></div>\n```\n\nIt's important to\
    \ note that all DOM object references are live. Even after we've added our `<div>`\
    \ to the DOM, we can continue to work with it. In other words, it yields the same\
    \ results:\n\n```javascript\nvar myDiv = document.createElement(\"div\");\n\n\
    document.contact.appendChild(myDiv);\nmyDiv.setAttribute(\"name\", \"foo\");\n\
    ```\n\nAdditionally, if some other code were to modify our `<div>`, our reference\
    \ held in `myDiv` would still be up to date. What's more, we can immediately reference\
    \ our new `<div>` by its name, `foo`.\n\nThough we can use `setAttribute` to set\
    \ attributes on elements, we can also use `createAttribute` to create attribute\
    \ nodes. Attributes also derive from the `Node` object, starting in the DOM1 spec:\n\
    \n```javascript\nvar myLink, href;\n\nmyLink = document.createElement(\"a\");\n\
    href = document.createAttribute(\"href\");\nhref.nodeValue = \"http://www.sitepoint.com/\"\
    ;\nmyLink.setAttributeNode(href);\n```\n\nWe've created an anchor and an `href`\
    \ attribute, to which we add a URL via its `nodeValue` property. Bear in mind\
    \ that even though the `href` attribute object derives from `Node`, you're unable\
    \ to append objects to it. Trying to do so will result in a `HierarchyRequestError:\
    \ DOM Exception 3` error.\n\nNow that we've created an anchor with an `href` attribute,\
    \ we can add some text to make the link clickable. For this, we use `createTextNode`\
    \ to add the text node to our link:\n\n```javascript\nvar myLink, href, linkText;\n\
    \nmyLink = document.createElement(\"a\");\nhref = document.createAttribute(\"\
    href\");\nhref.nodeValue = \"http://www.sitepoint.com/\";\nmyLink.setAttributeNode(href);\n\
    linkText = document.createTextNode(\"SitePoint\");\nmyLink.appendChild(linkText);\n\
    ```\n\nAgain, text nodes are like attribute nodes in that they're unable to have\
    \ children.\n\n> **A Note on Nodes**\n> Although all objects derive from `Node`,\
    \ some are leaf nodes and others aren't. Text nodes are leaf nodes and can therefore\
    \ not have children. As a result, methods such as `childNodes` are inapplicable\
    \ and cannot be used.\n\n## insertBefore\n\nWe've just seen `appendChild` in action,\
    \ but sometimes we want to be more specific about where we insert an element rather\
    \ than just appending it at the end. That's"
  mdcn: "\n## 向后兼容的必要性\n\n互联网是个奇特的生物，与任何其他软件都不同。尽管浏览器在不断进化，但它们解析的页面可能追溯到 1991 年。这意味着对现有浏览器技术的任何创新或迭代都必须继续与旧的网页兼容。正是由于这个现象，我们今天所知的\
    \ DOM 包含着来自“糟糕旧时代”的遗留物。\n\n## document 对象\n\ndocument 对象是一个顶层对象，它包含（并作为进入）你的文档的入口点。所有你需要用于处理文档的对象、方法和属性都挂载在\
    \ document 对象上。例如，当今最常用的方法之一是 `getElementById`，它通过元素的 `id` 属性返回 DOM 中的一个元素：\n\n\
    ```html\ngetElementById.html (excerpt)\n<!doctype html>\n<html>\n<head>\n</head>\n\
    <body>\n    <div id=\"foo\">Foo, baby. Foo!</div>\n    <div id=\"bar\">Meh.</div>\n\
    \    <script>\n        // returns a reference to the first div\n        var el\
    \ = document.getElementById(\"foo\");\n    </script>\n</body>\n</html>\n```\n\n\
    你也可以简单地使用 `document.title` 来检索其他信息，例如文档的标题。\n\n## DOM Level 0 或 旧版 DOM\n\n旧版 DOM\
    \ 时代的一些遗留物包括 document 的 forms、links 和 images 集合。在 DOM Level 1 中，这种为特定元素类型提供命名访问器的做法被终止了。然而，在\
    \ DOM0 中，这就是你访问 `<form>`、`<image>` 和 `<anchor>` 元素的方式。你可以通过使用元素的名称，或者通过 document\
    \ 对象将其索引传递给相应的访问器来实现。让我们以下面的文档为例：\n\n```html\n<html>\n<head>\n</head>\n<body>\n\
    \  <img src=\"mom.jpg\" name=\"mother\">\n  <img src=\"dad.jpg\" name=\"father\"\
    >\n  <form name=\"contact\">\n    <a href=\"http://www.sitepoint.com\" name=\"\
    sitepoint\">\n      SitePoint </a>\n  </form>\n  <a href=\"http://www.w3.org\"\
    \ name=\"w3\">W3C</a>\n  <script>\n    var mom, dad, sitepoint, contact;\n\n \
    \   mom = document.images.mother; dad = document.images[1];\n    sitepoint = document.links.sitepoint;\n\
    \    contact = document.contact;\n  </script>\n</body>\n</html>\n```\n\n得到的 DOM\
    \ 层次结构如图 6.1 所示。\n\n你可以通过使用 `document.contact` 来访问名为 `contact` 的表单。你也可以通过使用 `document.forms[0]`\
    \ 来访问它，假设你想要的表单是页面层次结构中的第一个（在这种情况下，它确实是）。如果是两个表单中的第二个，你会使用 `document.forms[1]`，以此类推。在我们的示例中，我们通过引用\
    \ `document.images[1]` 来访问第二张图片。这种语法可以用于所有三个访问器。与任何数组一样，你可以遍历返回的结果：\n\n```javascript\n\
    var imgs, img, i;\n\nimgs = document.images;\n\nfor (i = 0; i < imgs.length; i\
    \ += 1) {\n  img = imgs[i]; // get reference to image element\n  console.log(img);\n\
    }\n```\n\n## DOM Level 1\n\n1998 年，W3C 发布了 DOM Level 1 规范。<sup>4</sup> 该规范接管了现有的\
    \ DOM 层次结构，并通过引入 `Node` 对象来规范化其内容，大多数对象都由此派生。在规范引入的少数几种对象类型中，最常见的是 `Document`、`Element`、`Attr`\
    \ 和 `Text`，它们构成了 HTML 文档的大部分内容。\n\n在以下 HTML 中，`<div>` 将成为一个 `Element` 节点，其 `id`\
    \ 属性将成为一个 `Attr` 节点，而 \"Hello!\" 将成为一个 `Text` 节点：\n\n```html\n<html>\n    <head>\n\
    \    </head>\n    <body>\n        <div id=\"welcome\">Hello!</div>\n    </body>\n\
    </html>\n```\n\n前面提到的 `Document` 节点实际上是一个抽象节点，它包裹了所有内容，并不直接表示 HTML 中的任何标签。`<html>`\
    \ 标签是一个特殊的 `Element` 节点，称为文档元素，可以通过 `document.documentElement` 访问。\n\n还有一些不太常见的节点类型，如\
    \ `ProcessingInstruction` 和 `EntityReference`，但为了我们的目的，我们将只关注最常见的类型。各种节点类型的列表如图\
    \ 6.2 所示。\n\n## 创建 DOM 元素和属性\n\n我们 DOM 树的根是文档元素，每个文档只能有一个。由于它包含了文档的其余节点，因此它提供了一组方法，允许你创建它可以包含的所有子节点。所以，如果你想创建一个\
    \ `<div>` 元素，你可以像这样使用 document 对象的 `createElement` 方法：\n\n```javascript\nvar myDiv\
    \ = document.createElement(\"div\");\n```\n\n这将返回一个空的 `<div>` 元素。需要注意的是，我们刚刚创建的元素目前只存在于内存中，并不是文档的一部分。为了将我们的\
    \ `<div>` 添加到文档中，我们需要使用 `appendChild` 方法将其附加到 DOM 中的某个节点上。\n\n还记得我说过所有对象都派生自 `Node`\
    \ 吗？由于 `Node` 公开了 `appendChild` 方法，我们可以使用该方法将我们新创建的 `<div>` 作为子节点附加到 DOM 中的任何给定对象上。让我们将我们的\
    \ `<div>` 添加到前面 DOM0 示例中的 `contact` 表单中。我们仍然可以通过其 name 属性访问我们的 `contact` 表单，所以让我们直接在它上面调用\
    \ `appendChild` 来将我们的 `<div>` 添加到表单中：\n\n```javascript\nvar myDiv = document.createElement(\"\
    div\");\n\ndocument.contact.appendChild(myDiv);\n```\n\n我们的表单现在看起来像这样：\n\n```html\n\
    <form name=\"contact\">\n  <a href=\"http://www.sitepoint.com\" name=\"sitepoint\"\
    >\n  SitePoint </a>\n  <div></div>\n</form>\n```\n\n一旦我们添加了我们的 `<div>`，我们就可以使用\
    \ `setAttribute` 方法添加属性。所以，例如，我们可以给我们的 `<div>` 一个 `name` 属性：\n\n```javascript\n\
    var myDiv = document.createElement(\"div\");\n\nmyDiv.setAttribute(\"name\", \"\
    foo\");\ndocument.contact.appendChild(myDiv);\n```\n\n这将给我们一个 `<div>`：\n\n```html\n\
    <div name=\"foo\"></div>\n```\n\n需要注意的是，所有 DOM 对象引用都是实时的。即使我们将 `<div>` 添加到 DOM\
    \ 后，我们仍然可以继续使用它。换句话说，它产生相同的结果：\n\n```javascript\nvar myDiv = document.createElement(\"\
    div\");\n\ndocument.contact.appendChild(myDiv);\nmyDiv.setAttribute(\"name\",\
    \ \"foo\");\n```\n\n此外，如果其他代码修改了我们的 `<div>`，我们在 `myDiv` 中持有的引用仍然会是最新的。更重要的是，我们可以立即通过其名称\
    \ `foo` 引用我们新的 `<div>`。\n\n虽然我们可以使用 `setAttribute` 在元素上设置属性，但也可以使用 `createAttribute`\
    \ 创建属性节点。属性也派生自 `Node` 对象，从 DOM1 规范开始：\n\n```javascript\nvar myLink, href;\n\n\
    myLink = document.createElement(\"a\");\nhref = document.createAttribute(\"href\"\
    );\nhref.nodeValue = \"http://www.sitepoint.com/\";\nmyLink.setAttributeNode(href);\n\
    ```\n\n我们创建了一个锚点和一个 `href` 属性，并通过其 `nodeValue` 属性向其添加了一个 URL。请记住，即使 `href` 属性对象派生自\
    \ `Node`，你也不能向其附加对象。尝试这样做将导致 `HierarchyRequestError: DOM Exception 3` 错误。\n\n\
    既然我们已经创建了一个带有 `href` 属性的锚点，我们可以添加一些文本使其可点击。为此，我们使用 `createTextNode` 向链接添加文本节点：\n\
    \n```javascript\nvar myLink, href, linkText;\n\nmyLink = document.createElement(\"\
    a\");\nhref = document.createAttribute(\"href\");\nhref.nodeValue = \"http://www.sitepoint.com/\"\
    ;\nmyLink.setAttributeNode(href);\nlinkText = document.createTextNode(\"SitePoint\"\
    );\nmyLink.appendChild(linkText);\n```\n\n同样，文本节点类似于属性节点，它们不能有子节点。\n\n> **关于节点的说明**\n\
    > 虽然所有对象都派生自 `Node`，但有些是叶节点，有些不是。文本节点是叶节点，因此不能有子节点。因此，诸如 `childNodes` 之类的方法不适用，无法使用。\n\
    \n## insertBefore\n\n我们刚刚看到了 `appendChild` 的作用，但有时我们想更具体地指定插入元素的位置，而不仅仅是将其附加到末尾。那就是\n"
