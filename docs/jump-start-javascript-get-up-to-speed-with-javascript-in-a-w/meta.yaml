    # The style Attribute


    Back in DOM2, the W3C introduced the important and powerful style attribute (though
    plans for it were already being laid during work on DOM1). The style attribute
    allows for the programmatic manipulation of element styles. If you know CSS, using
    it is simple. Its format is simply element.style.property = value where property
    is a camel-case CSS property, and the value is the CSS value you''d assign in
    a regular stylesheet.


    For example, given the HTML <div id="hey">Hello, world!</div>, the <div> style
    can be manipulated using the following JavaScript:


    ```

    var myDiv = document.getElementById("hey");


    myDiv.style.backgroundColor = "blue";

    myDiv.style.border = "solid 5px #000";

    myDiv.style.color = "#ffffff";

    myDiv.style.padding = "20px 10px";

    myDiv.style.margin = "2em";

    myDiv.style.width = "200px";

    ```


