  md: 'type conversion (which we''ll cover later) and, as a result, some values convert
    into numbers while others don''t. For example, it will return **true** for `isNaN(NaN)`,
    `undefined`, and an object literal ({})—they are all not numbers. It will not,
    however, return **true** for values of `true` and `null`, which are also not numbers.


    Where it becomes even trickier is in dealing with strings. It will return **false**
    for numbers in strings such as `isNaN("42")`, since "42" is converted to 42, which
    is a number. It will also return **false** for empty strings ("") and strings
    consisting only of spaces (" ") since they''ll convert to 0, which is also a number.
    But strings with text in them that fail when parsed as a number (like `isNaN("foo")`)
    will return `NaN`. So, even though "foo" is clearly not equal to NaN, it returns
    **true** when you pass it into `isNaN`.


    The only truly reliable way to test for whether a value is actually `NaN` is to
    compare it against itself. Since `NaN` is the sole value that doesn''t equal itself,
    it will return **false** and you''ll know that what you''re dealing with is in
    fact `NaN`.


    # String


    Strings holds all possible string values. Some examples include:


    ```

    "Hello, world!"

    "1, 2, 3, 4, 5"

    "!@#$%^&*()_+"

    ```


    # Boolean


    Boolean variables can only hold the values `true` or `false`.


    # Undefined


    Undefined is an odd data type because it represents the state of a variable that''s
    been declared but without a value assigned to it. By definition, though, the fact
    that the variable exists means that it''s defined, which is what makes this data
    type unusual.


    # Null


    Null is used when you want to declare a variable and intentionally express the
    absence of a value (unlike `undefined` where the value is simply absent).'
