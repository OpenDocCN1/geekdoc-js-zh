    \ The program ends with an alert stating the total amount, which is 108:\n\n```\n\
    var arr, i, num, total;\n\narr = [4, 8, 15, 16, 23, 42];\ntotal = 0;\n\nfor (i\
    \ = 0; i < arr.length; i = i + 1) {\n  num = arr[i];\n  total = total + num;\n\
    }\n\nalert(\"The total is: \" + total);\n```\n\nFigure 3.7 shows how that looks.\n\
    \n![](img/ae490e66f6d11d20689f8bf3d738bef9_56_0.png)\n\nFigure 3.7. An alert showing\
    \ the total value of the numbers in an array\n\nThough there are several ways\
    \ to create a loop, the for loop seen in this example is the most common. It consists\
    \ of three parts: the initialization (i = 0), the condition (i < arr.length),\
    \ and the final expression (i = i + 1). The loop starts with the variable i set\
    \ to zero. If the value of i is less than the length of the array, which it is,\
    \ the loop's body is executed once. After the body is executed, i is incremented\
    \ by one. This process continues until i is no longer less than arr.length. Now\
    \ that you have a basic understanding of the for loop, take a look at how forEach\
    \ can simplify the same program:\n\n```\nvar arr, total;\n\narr = [4, 8, 15, 16,\
    \ 23, 42];\ntotal = 0;\n\narr.forEach(function(num) {\n  total = total + num;\n\
    });\n\nalert(\"The total is: \" + total);\n```\n\nNotice how the loop itself is\
    \ now a call to the array's forEach method. We pass in an anonymous function (we'll\
    \ cover those in detail later) that receives a value as an argument and places\
    \ it in the variable num. In other words, each time forEach steps over a number\
    \ in the array, it passes it to this function as num. The rest is just math, and\
    \ the total displayed in the alert ends up being identical, just as it did in\
    \ the previous example.\n\n## map (JavaScript 1.6)\n\nThe map method is nearly\
    \ identical to forEach. The only difference is that map returns an array containing\
