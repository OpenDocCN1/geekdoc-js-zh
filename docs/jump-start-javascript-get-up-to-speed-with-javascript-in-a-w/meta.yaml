  md: 'since the use of custom events is not always obvious to someone new to JavaScript.
    Suppose our to-do application is complete and somebody else wishes to write a
    plugin to display a fancy notification to the user every time they add a new item
    to their list.


    How should they go about doing this? One possible option would be for the other
    programmer to modify our script and place their notification code inside ours.
    This is problematic on several fronts. Firstly they may not have access to our
    source code. Although JavaScript will always be viewable as plain text, before
    shipping, we may choose to compress our code to improve loading times. This would
    make our source code very difficult to work with directly.


    But even suppose that we granted access to our original source code. Directly
    altering the to-do list code base is still a bad idea for a number of reasons.
    Firstly, if we decide to update our to-do list code, it may break the other programmer''s
    modification. Secondly, if a number of programmers all wish to create their own
    plugins, the original code base will quickly become bloated and unmanageable.


    The problem with the above solution is that it involves modifying our to-do list
    code to incorporate functionality that it does not need to know anything about.
    Whilst the plugin code needs to know about the to-do list, the reverse is not
    true. The to-do list application does not need to know about any plugins. In theory
    it should be possible for thousands of plugins to be written whilst our original
    program happily chugs along in ignorant bliss. The technical term for this architecture
    is loose coupling. Let''s now make this concept a little less abstract by providing
    an actual implementation using a custom event.


    A custom event can be created by using the following general construct:


    ```

    var event = new CustomEvent(type, eventInitDict);

    ```


    Here, `type` is the name of the custom event, and is something we define. `eventInitDict`
    provides the initialization parameters.


    `eventInitDict` is itself a JavaScript object that takes the following three parameters:


    +   **bubbles**

    A Boolean indicating whether the event bubbles up through the DOM or not. The
    bubble phase and capture phase were covered earlier in this chapter.'
  merge: -1
