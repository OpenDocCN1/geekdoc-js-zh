  md: "With IE8 included, browser support would jump to a very healthy 95%. For those\
    \ browsers without support for `<canvas>`, it is easy to provide fallback content.\
    \ We can place fallback content between the `<canvas>` and `</canvas>` tags as\
    \ follows:\n\n```\n<canvas id=\"canvas\" height=\"300\" width=\"400\">\n  To Do:<div\
    \ id=\"numToDo\"></div>\n  Done:<div id=\"numDone\"></div>\n</canvas>\n```\n\n\
    For now, we provide some blank placeholders. When we render our chart, we'll update\
    \ the fallback content to display the actual number of tasks completed, as well\
    \ as the number of tasks to do.\n\n# Preparing the Data\n\nLet's perform some\
    \ basic computations around the number of tasks completed and the number of tasks\
    \ remaining. Add the following function to **todo.js**:\n\n```\nfunction renderChart(tasks)\
    \ {\n  var done = countComplete(tasks);\n  var todo = tasks.length - done;\n\n\
    \  document.getElementById(\"numToDo\").innerHTML = todo;\n  document.getElementById(\"\
    numDone\").innerHTML = done;\n\n  var dataValue = [todo, done];\n  var maxVal\
    \ = todo > done ? todo : done;\n}\n```\n\nFirst, we establish the number of tasks\
    \ completed by using our previously written countComplete function. By inference,\
    \ we can calculate the number of tasks to do by taking the total number of tasks\
    \ and subtracting the number of tasks completed. We then update our fallback content\
    \ with these values for browsers not supporting `<canvas>`. We then put the values\
    \ into an array, which will make it easier to use with our graph. Finally, we\
    \ compute the maximum value, which will determine the largest number for our y-axis.\
    \ This is calculated by taking the larger of the number of tasks completed and\
    \ the number of tasks to do."
