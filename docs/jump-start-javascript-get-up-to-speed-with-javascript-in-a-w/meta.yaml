    var hugo, person, names;\n\nperson = function () {\n  return this.lastName;\n\
    };\n\nhugo = person.bind({lastName: \"Reyes\"});\nhugo(); // returns \"Reyes\"\
    \n\nnames = {\n  lastName: \"Cooper\",\n  hugo: hugo,\n  person: person\n};\n\
    names.hugo(); // returns \"Reyes\"\nnames.person(); // returns \"Cooper\"\n```\n\
    \nYou'll note how the person function points to this.lastName and that before\
