    }\n```\n\nwhich is the same as:\n\n```javascript\nvar name = \"Emma\";\n\nfunction\
    \ nameHer() {\n  console.log(name); // outputs undefined\n  var name = \"Audrey\"\
    ;\n}\n```\n\nAll three examples are the same because JavaScript reads the body\
    \ of those functions, and moves all the variable declarations to the top of the\
    \ function. Note that it only moves the declaration, not the assignment. Under\
    \ the hood, all three functions end up looking like the first. That's why the\
    \ second and third examples output undefined rather than \"Emma\" as you'd expect.\
    \ Even though it looks like we're using the name variable containing \"Emma\"\
    \ before assigning \"Audrey\" to it, we're actually declaring a new and undefined\
    \ name variable at the top of each function.\n\n## Declaration\n\nSo far, we've\
    \ seen one of three possible ways to create a function. Not only can we use the\
    \ `function` statement (or declaration), we can also use the `function` operator\
    \ (or expression) and the `Function` constructor. The first is a named function\
    \ declaration, the second is a function expression, and the third is a constructor\
    \ just like Array() and Object(). As with Array() and Object(), the Function()\
    \ constructor returns a new Function object:\n\n```javascript\n// declaration\n\
    function sayHello1() {\n    alert(\"Hello\");\n}\n\n// expression\nvar sayHello2\
    \ = function() {\n    alert(\"Hello\");\n};\n\n// constructor (not recommended)\n\
    var sayHello3 = new Function(\"alert('Hello')\");\n```\n\nLet's start by taking\
    \ a look at the first two since they're the most common. They have a couple of\
    \ differences between them, the first being that a function declaration needs\
    \ to have a name (in this case, sayHello1). If the function declaration has no\
    \ name, it's considered a function expression and, since it's nameless, an anonymous\
    \ function. Why does this matter? Well, the second distinction between function\
    \ declarations and expressions is how the JavaScript engine parses them. Function\
    \ declarations are hoisted just as variables are, while only the variable declaration\
    \ of a function expression is hoisted. For example, this is possible with a function\
    \ declaration:\n\n```javascript\nalert(hi());\n\nfunction hi() {\n    return \"\
    Hi!\";\n}\n```\n\nIt's possible because the entire hi function is hoisted above\
    \ alert and is therefore available when alert uses it. Now let's look at a similar\
    \ example using a function expression, which will throw a TypeError: undefined\
    \ is not a function error:\n\n```javascript\nalert(hey());\n\nvar hey = function\
    \ () {\n    return \"Hey!\";\n};\n```\n\n## Jump Start JavaScript\n\nThe reason\
    \ the error says \"undefined is not a function\" is because at run time, the hey\
    \ variable declaration is hoisted above the alert but the assignment of the function\
    \ remains below.\n\nThe third way of writing a function is the Function constructor.\
    \ Of the three, I recommend it the least as it requires your code to be passed\
    \ in as a string, which is difficult to write and error-prone.\n\nIf you're going\
    \ to use function declarations, always declare them at the top of your code's\
    \ scope (be it the global or local scope) so as to avoid hoisting, and to make\
    \ it clear to the reader when the function is actually available for use. If you're\
    \ going to use function expressions, declare the variables you'll be assigning\
    \ to your functions at the top of your local scope for the same reason. Whatever\
    \ you do, avoid writing code where you conditionally declare functions because\
    \ you'll run into inconsistent behavior across browsers, to say nothing of it\
    \ being bad practice.\n\nAs of this writing, Google Chrome alerts \"Hello!\" while\
    \ Mozilla Firefox alerts \"Hi!\" when running this code:\n\n```javascript\nif\
    \ (true) {\n  function hello() {\n    alert(\"Hi!\");\n  }\n} else {\n  function\
    \ hello() {\n    alert(\"Hello!\");\n  }\n}\n```\n\nHowever, when written as function\
    \ expressions, both browsers will return \"Hi!\" because only the true branch\
    \ of the if statement will ever be executed and therefore parsed:\n\n```javascript\n\
    var hello;\n\nif (true) {\n  hello = function() {\n    alert(\"Hi!\");\n  }\n\
    } else {\n  hello = function() {\n    alert(\"Hello!\");\n  }\n}\n```\n\n## Arguments\n\
    \nWhen you define a function, you can define a list of arguments that it will\
    \ receive. In doing so, you’re declaring variables for use within the scope of\
    \ that function. In other words, those variables can only be used inside that\
    \ function. For example:\n\n```javascript\nfunction person(firstName, lastName,\
    \ age) {\n  alert(firstName);\n  alert(lastName);\n  alert(age);\n}\n\nperson(\"\
    John\", \"Doe\", 44);\n```\n\nOur function, named person, receives three arguments,\
    \ firstName, lastName, and age. When the function is called on the last line of\
    \ our example, three values are passed through its parentheses: \"John\", \"Doe\"\
    , and 44. Inside the function, we take those three values and alert them one after\
    \ the other.\n\nSometimes, however, it’s not possible or ideal to predefine arguments.\
    \ If we wanted to create a function that concatenated an arbitrary number of values\
    \ and returned the result, how would we define the argument list? Well, JavaScript\
    \ functions have a special array-like object called arguments that we can access\
    \ from within the function to see exactly what was passed in:\n\n```javascript\n\
    function concatenate() {\n  var i, str;\n\n  str = \"\";\n  for (i = 0; i < arguments.length;\
    \ i += 1) {\n    str += arguments[i];\n  }\n  return str;\n}\n\nconcatenate(\"\
    Super\", \"cali\", \"fragilistic\", \"expiali\",\n          \"docious\");\n//\
    \ returns Supercalifragilisticexpialidocious\n```\n\nWe have no way of knowing\
    \ how many strings will be passed into our `concatenate` function, so we're unable\
    \ to predefine a list of arguments. Instead, we loop over the special `arguments`\
    \ array and concatenate the values from there.\n\nOf course, this is a simple\
    \ example of a function in action, and a useless one at that, since we could just\
    \ call `alert` on our own without wrapping it in a function. But say we wanted\
    \ to take a string and translate it into Pig Latin? We could write a function\
    \ that receives a value and then returns another. In order to get something back,\
    \ we need to make use of the `return` statement:\n\n```javascript\nfunction pigLatin(phrase)\
    \ {\n    var words, pigged;\n\n    // Create an array with the words of the phrase\n\
    \    //   we're given by splitting the phrase on the\n    //   spaces between\
    \ the words.\n    words = phrase.split(\" \");\n\n    // Loop over the words array\
    \ and translate each word to\n    //   Pig Latin. Return the translated word so\
    \ that it\n    //   gets placed in a new array called \"pigged.\"\n    pigged\
    \ = words.map(function (word) {\n        var first, rest;\n\n        // Grab the\
    \ first letter of the word\n        first = word.substring(0, 1);\n\n        //\
    \ Grab the rest of the word\n        rest = word.substring(1);\n\n        // Start\
    \ the new word with the ending of the old word,\n        //   and add the first\
    \ letter of the old word as well as\n        //   \"ay\" to the end of it. Return\
    \ the result of the\n        //   concatenation so that the map function can add\
    \ it\n        //   to the \"pigged\" array.\n        return rest + first + \"\
    ay\";\n    });\n\n    // Rebuild the new Pig Latin phrase by rejoining the newly\n\
    \    //   \"pigged\" words with spaces in between. Return the\n    //   result\
    \ so that anyone calling our pigLatin function\n    //   can actually get the\
    \ new Pig Latin version of their\n    //   phrase.\n    return pigged.join(\"\
    \ \");\n}\n```\n\nThen, we could pass it a simple phrase and have the Pig Latin\
    \ version returned to us:\n\n```javascript\nvar pl = pigLatin(\"tonight you belong\
    \ to me\");\n\n// returns \"onighttay ouyay elongbay otay emay\" into pl\n```\n\
    \nNow, whenever we want to translate a phrase, we just need to pass it into our\
    \ pigLatin function and we have our translation. Simple!\n\n## Object-oriented\
    \ Programming with Functions\n\nUnfortunately, providing an in-depth, comprehensive\
    \ explanation of what **object-oriented programming (OOP)** is falls outside the\
    \ scope of this short book. But the basic gist of it is that OOP is a programming\
    \ style that lets you represent real-world items as objects in your code. An object\
    \ can represent a physical element such as a person or fruit, or something more\
    \ abstract such as a bank account or network connection. The object stores data\
    \ (called properties) and functions (called methods), the latter acting on the\
    \ data. So an object representing a bank account may have properties such as account\
    \ number, balance, and overdraft limit, and methods such as deposit and withdraw.\n\
    \nFor anyone familiar with traditional class-based OOP, JavaScript is a class-less\
    \ prototypal programming language where objects inherit from other objects instead\
    \ of classes. JavaScript uses functions as classes but has no class statement.\
    \ Instead, any function can act as a class and new instances of that class can\
    \ be created using the new keyword."
