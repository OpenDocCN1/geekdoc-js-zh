    \ considerations, not covered here.\n\n# Project\n\n# Counting Tasks\n\nSuppose\
    \ we wish to count the number of tasks that have been completed. We'll need this\
    \ functionality later when we provide charts. Using loops, one way of completing\
    \ the task would be as follows:\n\n```\nfunction countComplete(tasks) {\n  var\
    \ numCompleted = 0;\n\n  for (var i = 0; i < tasks.length; i++) {\n    if (tasks[i].complete)\
    \ {\n      numCompleted++;\n    }\n  }\n\n  return numCompleted;\n}\n```\n\nAll\
    \ in all, this is a reasonable approach. The logic is simple enough, and we have\
    \ a counter to track the number of tasks completed. We then loop through our task\
    \ list and every time we see a completed item, we increment the counter. Is there\
    \ a"
  - "[PAGE 114]\n\nbetter solution? Yes. Functional programming to the rescue! Place\
    \ this code into a file named **todo.js**:\n\n```\nfunction countComplete(tasks)\
    \ {\n    return tasks.filter(function(task) {\n        return task.complete;\n\
    \    }).length;\n}\n```\n\nNow all we have to do is filter the entire list based\
    \ on whether a task is complete, and then return the length of that list.\n\n\
    # Sorting\n\nWe want to provide our users with the ability to sort by three criteria:\
    \ low-to-high, high-to-low, and name. Thanks to the built-in sort function, all\
    \ we have to do is provide a function to rank our tasks based on the specified\
    \ criterion:\n\n```\nvar sortByLowHigh = function(tasks) {\n    return tasks.sort(function(task1,\
    \ task2) {\n        return task2.priority - task1.priority;\n    });\n};\n\nvar\
    \ sortByHighLow = function(tasks) {\n    return tasks.sort(function(task1, task2)\
    \ {\n        return task1.priority - task2.priority;\n    });\n};\n\nvar sortByName\
    \ = function(tasks) {\n    return tasks.sort(function(task1, task2) {\n      \
    \  return task1.text > task2.text;\n    });\n};\n```\n\nFor priority sorting,\
    \ we compare the tasks numerically. For name sorting, we compare lexicographically.\
    \ For the curious, the built-in array-sorting function uses an algorithm internally\
    \ known as QuickSort.<sup>9</sup>\n\n<sup>9</sup> http://www.nczonline.net/blog/2012/11/27/computer-science-in-javascript-quicksort/"
