    \n# 第8章\n## Canvas\n\n本章介绍 `<canvas>` 元素，它是 HTML5 规范的一部分。我们将使用 `<canvas>` 为我们的示例应用实现一个生产力图表。该图表将在每次数据更改时更新。它将向用户显示已完成的任务数量和尚未完成的任务数量。我们还将添加一些阴影和渐变效果，使图表看起来更精致。\n\
    \n## 什么是 Canvas？\n\n官方规范¹指出：“canvas 元素为脚本提供了一个分辨率相关的位图画布，可用于实时渲染图表、游戏图形、艺术作品或其他视觉图像。”虽然规范并未强制规定具体的脚本语言，但\
    \ JavaScript 通常是通用的脚本语言。\n\n¹ http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html#the-canvas-element\n\
    \n## Canvas 与 SVG\n\n本章的材料也可以使用**可缩放矢量图形（SVG）**来编写。SVG 是一种用于在 XML 中描述二维图形的语言。Canvas\
    \ 和 SVG 都得到了广泛采用；各有其优缺点²。最终，我们选择 Canvas 是出于一个实际原因：它基于 JavaScript。对于那些有兴趣探索 SVG\
    \ 的人，Mozilla 开发者网络提供了文档和示例。³\n\n我们可以为用户提供一个基本的 canvas：\n\n```html\n<div align=\"\
    center\">\n    <br /><br />\n    <h2>Productivity Chart</h2>\n    <canvas id=\"\
    canvas\" height=\"300\" width=\"400\">\n    </canvas>\n</div>\n```\n\n将此代码放在 `index.html`\
    \ 中的 `<ul class=\"template\">` 标签之前。使用 `<canvas>` 标签可以提供一个基本的 canvas。我们还为 canvas\
    \ 指定了一个 id、一个高度和一个宽度。如果未提供值，或者提供的值无法正确解析，则使用默认值：宽度 300，高度 150。一个页面可以拥有多个 `<canvas>`\
    \ 元素，但对于此项目，我们只使用一个。我们的代码将提供，恕我直言，一块空白的画布，没有任何内容。\n\n我们的首要任务是照顾那些不支持 `<canvas>`\
    \ 元素的浏览器。截至撰写本文时，canvas 元素已在 85% 的浏览器中得到支持⁴。所有现代主要浏览器，包括移动设备上的浏览器，都支持 `<canvas>`\
    \ 元素。虽然被列为不支持，但 IE8 实际上可以支持 `<canvas>` 功能，只要开发者愿意添加一个额外的 `<script>` 标签来使用第三方库。⁵\n\
    \n² http://dev.opera.com/articles/view/svg-or-canvas-choosing-between-the-two/\n\
    ³ https://developer.mozilla.org/en-US/docs/SVG\n⁴ http://caniuse.com/#feat=canvas\n\
    ⁵ https://code.google.com/p/explorercanvas/\n\n如果包括 IE8，浏览器支持率将跃升至非常健康的 95%。对于那些不支持\
    \ `<canvas>` 的浏览器，提供后备内容很容易。我们可以在 `<canvas>` 和 `</canvas>` 标签之间放置后备内容，如下所示：\n\n\
    ```html\n<canvas id=\"canvas\" height=\"300\" width=\"400\">\n  To Do:<div id=\"\
    numToDo\"></div>\n  Done:<div id=\"numDone\"></div>\n</canvas>\n```\n\n目前，我们提供一些空白占位符。当我们渲染图表时，我们将更新后备内容以显示实际完成的任务数量以及待办任务数量。\n\
    \n## 准备数据\n\n让我们对已完成的任务数量和剩余的任务数量进行一些基本计算。将以下函数添加到 **todo.js** 中：\n\n```javascript\n\
    function renderChart(tasks) {\n  var done = countComplete(tasks);\n  var todo\
    \ = tasks.length - done;\n\n  document.getElementById(\"numToDo\").innerHTML =\
    \ todo;\n  document.getElementById(\"numDone\").innerHTML = done;\n\n  var dataValue\
    \ = [todo, done];\n  var maxVal = todo > done ? todo : done;\n}\n```\n\n首先，我们使用之前编写的\
    \ `countComplete` 函数确定已完成的任务数量。由此推断，我们可以通过任务总数减去已完成的任务数量来计算待办任务数量。然后我们用这些值更新不支持\
    \ `<canvas>` 的浏览器的后备内容。接着，我们将这些值放入一个数组中，这将使我们更容易使用图形。最后，我们计算最大值，这将确定 y 轴的最大数值。这是通过取已完成的任务数量和待办任务数量中的较大者来计算的。\n\
