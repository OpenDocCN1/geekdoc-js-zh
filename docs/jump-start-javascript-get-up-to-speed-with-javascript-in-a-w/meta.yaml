  md: "# 6 Jump Start JavaScript\n\nelements will result in an error since the HTML\
    \ inside the <body> isn't there yet. There are two ways to deal with this. You\
    \ can wrap your code in the document's onload function, which the browser executes\
    \ once it's done constructing the DOM. Alternatively, you could include your script\
    \ tag(s) at the very end of the document's body, immediately before the closing\
    \ </body> tag.\n\nThe latter is the preferred method because when the browser\
    \ constructs the DOM, it fires off requests to the server for every <img> tag\
    \ it encounters. It won't call onload until all the images have finished loading.\
    \ This means that any JavaScript you'd like to run on the page will have to wait\
    \ until all the page's images and other resources are done loading. This may be\
    \ insignificant on pages with just a bit of text and an image or two. But, on\
    \ pages with lots of images, you'll have a noticeable delay before your scripts\
    \ execute. Therefore, it's better to place your scripts at the end of the document's\
    \ body.\n\nHere's an HTML document that includes embedded JavaScript as well as\
    \ a reference to an external JavaScript file. Though the code in the document's\
    \ head references nothing in the DOM, (it's a simple alert statement), it will\
    \ only execute once the scripts have loaded at the end of the document:\n\n```\n\
    <!doctype html>\n<html>\n  <head>\n    <title>Code inside an HTML document</title>\n\
    \    <script>\n      window.onload = function () {\n        alert(\"Hello, world!\"\
    );\n      };\n    </script>\n  </head>\n  <body>\n    <h1>An example</h1>\n  \
