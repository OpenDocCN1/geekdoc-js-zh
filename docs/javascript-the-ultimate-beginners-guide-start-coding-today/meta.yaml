    JavaScript 控制台将按照数学顺序 PEMDAS（括号、指数、乘法、除法、加法和减法）解决问题。因此，你可以通过将它们包含在括号内来指示 JavaScript
    你想要求解的顺序。如果你不指定，JavaScript 将先计算指数，然后是乘法，接着是除法，最后是加法。


    JavaScript 的奇妙之处在于你可以向变量添加数字，或者只添加变量，并得到一个数字。我不会详细阐述这一点，因为我假设你已经了基础数学和代数。


    在 JavaScript 中发生错误时，红色字母将显示你所犯的错误。JavaScript 不要求你将项转换为类似的项，只要变量已正确赋值和定义。对于 `6
