    \n## 第 39 章：使用 JavaScript 访问样式表\n\n当你成为 Web 开发者和程序员后，以后可能需要为网站创建新的样式表。\n\nJavaScript\
    \ 可以为你从浏览器访问样式表。\n\nCSS 或级联样式表负责使用标记语言在网站上显示 HTML 元素。HTML 和 CSS 对于构建网站至关重要。\n\n\
    ### 访问样式表\n\nJavaScript可以通过此代码访问样式表：\n\n```javascript\ndocument.styleSheets\n\
    ```\n\n你也可以使用此代码：\n\n```javascript\ndocument.createElement\n```\n\n如果你想创建新的样式表，请使用此代码：\n\
    \n```javascript\nvar sheet = document.createElement('style')\nsheet.innerHTML\
    \ = \"div{border: 3px navy blue; background color: yellow;}\"\ndocument.body.appendChild(sheet);\n\
    ```\n\n看下一图：\n\n```javascript\nvar sheet = \ndocument.createElement('style')\n\
    sheet.innerHTML = \"div{border: 3px navy blue; background color: yellow};\"\n\
    document.body.appendChild(sheet);\n\n<style>div{border: 3px navy blue; background\
    \ color: yellow;}</style>\n```\n\n## 移除样式表\n\n你可能因为某些重要原因需要移除样式表。如果你需要，可以使用代码快速移除样式表：\n\
    \n```javascript\nvar sheetRemove = document.getElementById('styleId');\nvar sheetParent\
    \ = sheetRemove.parentNode;\nsheetParent.removeChild(sheetRemove);\n```\n\n##\
    \ 修改元素样式\n\n你也可以使用此代码更改元素样式：\n\n```javascript\ndocument.styleSheets[0].addRule(elements);\n\
    document.styleSheets[0].insertRule(elements);\n```\n\n或者单独更改它们：\n\n```javascript\n\
    var title=document.getElementById(\"page-title\");\ntitle.setAttribute(\"style\"\
    , \"left: 30px\");\ntitle.style.color = \"red\";\ntitle.style.backgroundColor\
    \ = \"green\"\n```\n\nCSS 本身是一种不同的语言，所以你可能想在另一本书中学习它。\n\n重要的是，你现在知道如何使用 JavaScript\
    \ 修改、添加和删除样式表了。\n\n## 第 40 章：测试弹出拦截器\n\n通过 JavaScript，你可以测试弹出拦截器。你可以创建一个 'if –\
    \ else' 语句，并将其插入 HTML 代码的 <head> 部分。见下例：\n\n```html\n<!DOCTYPE html>\n<html\n\
    <head>\n<script>\nfunction checkPopup() {\n  var windowName = 'jsBeginner';\n\n\
    \  var winCheck = window.open('/popup-page.php, jsBeginner',height=350,width=540,left=24,top=24,menubar=no,resizable=no,scrollbars=no);\n\
    \n  if(!winCheck) {\n    alert('请禁用弹出拦截器并再次点击“打开”。');\n  } else {\n    winCheck.close();\n\
    \    alert('感谢访问。未检测到弹出拦截器。');\n  }\n}\n\nwindow.onload = checkPopup;\n</script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n看下方的图：\n\n```html\n<!DOCTYPE html>\n\
    <html\n<head>\n<script>\nfunction checkPopup() {\n  var windowName = 'jsBeginner';\n\
    \  var winCheck = window.open('/popup-page.php, jsBeginner',\n  height=350,width=540,left=24,top=24,\n\
    \  menubar=no,resizable=no,scrollbars=no');\n  if (!winCheck) {\n    alert(\"\
    Please disable the popup blocker and click \"Open\" again.\");\n  } else {\n \
    \   winCheck.close();\n    alert(\"Thanks for the visit. Popup blocker is not\
    \ detected.\");\n  }\n}\nwindow.onload = checkPopup;\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n你还可以创建其他代码来插入你的弹出拦截器检查器。正如我在所有章节中反复提到的，JavaScript 代码在你的浏览器上可能无法正常工作，因此你必须调查并学习原因。\n\
    \n错误提示将指示哪里出了问题，你可以根据那里的指令并纠正你的代码。\n\n有时，错误是由琐碎的事情引起的，例如漏掉引号；或者将双引号转换为单引号；引号匹配错误（本没有使用双引号）；\n\
    \n## 第 41 章：处理错误和异常\n\nJavaScript 错误是不可避免的。\n"
