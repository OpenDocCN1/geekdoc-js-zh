  md: '# Chapter 9: Definition and Uses of Variables


    As with other computer languages, JavaScript makes use of variables. Unlike strings,
    variables are not enclosed in quotes, and you don''t have to declare what type
    they are.


    # What are variables?


    Variables act as containers of your data. Through variables, you can easily store
    or save your data, and access them later on, when you need them. You can use your
    data by using the name of the''container''(variable) to access it. But first,
    you have to declare and name the variable before you can use or access it.


    # Uses of variables


    They act as containers of your data. They are similar to file names, with their
    corresponding contents.


    The keyword''var'' is used to declare a variable, while the equal (= ) sign is
    used to define the values of the variables.


    # Example 1:


    ```

    var x;

    x = 1;

    ```


    # Example 2:


    ```

    var carOwners;

    carOwners = "Rachel Newsome", "Luke Tell", "Sarah Colton";

    ```


