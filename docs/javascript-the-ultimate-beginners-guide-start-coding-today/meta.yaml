    # Chapter 38: Controlling Windows Using JavaScript


    Yes, JavaScript can also control your Windows size and fill it. By now, you’re
    familiar with how powerful JavaScript is in developing your webpage and making
    it interactive.


    Now, let''s skim a bit on how JavaScript can control your windows.


    # Opening a new window


    You can open a new window with JavaScript by using the code:


    ```

    window.open("foo.html", "windowName");

    ```


    From this JavaScript statement, you can do various things, such as resizing it,
    moving it, or adding removing the menu bars, or title bars.


    You can add additional codes to let this happen. Let’s say you want to call your
    new window – amazingWorld, this is how you write the JavaScript statements.


    ```

    window.open("foo.html", "amazingWorld");

    ```


    ```

    “width=350, height=350, scrollbars=yes, titlebars=no");

    ```


    # Resizing windows


    To resize your window, you can use the keywords: ‘resizeTo’ and ‘resize By’. You
    can try testing your browser by using the code below:


    ```

    window:resizeBy(100,-100);

    ```


    You may want to resize your window not less than 100 pixels, because some browsers
    will not allow this action.


    # Closing your windows


    To close your window, you can use the code:'
