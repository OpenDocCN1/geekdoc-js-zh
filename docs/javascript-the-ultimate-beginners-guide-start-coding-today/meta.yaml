    # Chapter 8: JavaScript Functions


    Before you can start coding, you will have to learn about how to create your own
    JavaScript functions. It''s because, almost always, your statements will use a
    function. You cannot write a code without using functions.


    In JavaScript, functions have properties and methods, and they are considered
    as objects of these characteristics. They must also return a value.


    The usual steps in utilizing functions are: calling it and then passing your arguments
    and waiting for the return value. The arguments can be numbers, strings, or other
    data types.


    # Function statement/declarations/definition


    This is used to declare a function. You can declare a function by using the function
    keyword ‘function’. The general formula in declaring a function is:


    ```

    function functionName(argument1, argument2, argument3...)

    {

    statement/s to be executed;

    }

    ```


    If you are to insert it in an HTML script, you can write it this way:


    ```

    <script type="text/javascript">

