    \ throughout the code.\n\n\"studentName\" is different from \"studentname\". You\
    \ would receive an error when you use a lowercase-name different from the uppercase-name\
    \ you have entered.\n\nJavaScript is usually 16 digits in length for the web browser\
    \ to be able to execute the number code properly.\n\n## Chapter 10: Basic Data\
    \ Types of Variables\n\nVariables have basic data types. These are numbers, strings,\
    \ Boolean, and objects. We'll skim through these types, because going-depth in\
    \ them will leave us not time in learning basic codes.\n\n### 1. Numbers\n\nIn\
    \ JavaScript, generally, all numbers are considered as 64-bit floating point numbers.\
    \ When there are no values after the decimal point, the number is presented as\
    \ a whole number.\n\nJavaScript and other computer languages are based on the\
    \ IEEE 754 standard for Floating-Point Arithmetic.\n\nExample of floating-point\
    \ numbers:\n\n- 4.5\n- 9.16\n- 6.0\n\nExamples of integers:\n\n- 9.000\n- 6.000\n\
    - 2\n\n### 2. Strings\n\nStrings are data types that are typically enclosed in\
    \ matching single quotes or double quotes. The elements can be numbers or texts.\
    \ Strings are discussed more on chapters 13.\n\n### 3. Boolean\n\nThese data types\
    \ represent either 'true' or 'false'. Through the use of Boolean, you can find\
    \ out whether JavaScript expression is 'true' or 'false'. The 'true' returns are\
    \ generally obtained from expressions with true values. In contrast, 'false' returns\
    \ are obtained from expressions without true values.\n\n### 4. Objects\n\nObjects\
    \ encompass all data types in the sense that numbers, Booleans, and strings can\
    \ be objects. Data such as arrays, regular expressions, and dates are objects.\
    \ Objects contain many values and have properties. Thus, they are containers of\
