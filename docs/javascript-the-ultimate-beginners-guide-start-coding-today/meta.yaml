  md: '# Chapter 1: Introduction to JavaScript


    Surely, you have heard the term''JavaScript'', from time to time, as you browsedonline.
    You''re interested to learn all about it, that was why you have obtained this
    book. Thus, we have to know first, what JavaScript is.


    # What is JavaScript?


    JavaScript is a computer language that web developers and computer programmers
    use together with HTML and CSS to create and develop interactive websites. It''s
    a''inserted or used only for web purposes, If you''re planning to open your own
    website learning about JavaScript is a wonderful place.


    Nevertheless, you can learn too how to use this essential language even if you''re
    not an expert programmer. All you need is the desire and to acquire a new language.


    Take note that JavaScript is different from Java. Java is a markup language, in
    the same category as C or C++, and is more complex than JavaScript.


    # JavaScript statements


    JavaScript commands, or language, or program instructions are called statements.
    These statements must follow the correct JavaScript syntax for them to be executed
    properly, and for the statements to display the correct output.


    JavaScript statements can be composed of keywords, values, operators, expressions
    and comments.


    # Here are other uses of JavaScript. You can:


    +   1. improve the users''experience with an easy, dynamic and responsive interface.

    2. resolve browser problems.

    3. allow users to work offline.

    4. let users promptly load content from the website.

    5. create pop-ups or alerts to maximize users''browsing experience on your website/blog.

    6. allow users to give feedbacks.

    7. inform the user of an error in his entry or request.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '+   8. allow users instant feedback in their activity. An example is when the
    user is filling up a form online. With the use of JavaScript, the user will be
    able to know whether he is filling up the form properly.


    +   9. allow users to interact with your website.


    +   10. animate an element in your website for better user experience.


    +   11. create a congruent interface with other web technologies such as, Java,
    HTML and CSS.


    +   12. use JavaScript with any browser.


    +   13. create a dynamic website by manipulating your website’s elements.


    Note: Ascertain though that the user has the option to forgo the pop-ups, because
    some users don’t want distractions while browsing.


    If you have studied other computer languages, such as Python, Java, CSS and HTML,
    you will soon discover that there are similarities between the programs. All you
    have to do is to connect these similarities, work with the other languages, and
    work through their differences.'
  merge: -1
  pgno: 5
