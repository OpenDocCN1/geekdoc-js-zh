  md: '# # Chapter 29: Creating and Accessing Arrays


    Array methods in JavaScript have significant uses that you can find essential
    when writing your codes. In this chapter, we will discuss the most commonly used
    methods. You can learn everything when you proceed with your advance lessons.
    Are you ready? Fire in the hole!


    # What is an array?


    An array is useful in storing several, or multiple values in one object or variable.


    Examples:


    ```

    var places = [''Seoul'', ''Bangkok'', ''Venice'', ''Cheyenne'', ''New York''];

    var luckyNumbers = [7, 9, 13];

    var favorites = [''ice cream'', ''chocolates'', ''cakes'', ''fruits''];

    ```


    The Mozilla ''Console'' recognized the entry immediately as an array and identified
    it as such.

