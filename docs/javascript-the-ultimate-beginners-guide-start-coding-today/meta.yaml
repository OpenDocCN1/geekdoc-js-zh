    ## 第23 章：表达式中的其他运算符


    JavaScript 中包含了你必须知道的其他数学运算符。


    - 1. 使用 `++` 符号。

    ```

    num++;

    ```

    `++` 符号表示变量上加 1。

    查看下方图片：


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_109.png)


    - 2. 使用 `--`。

    这是 `num++` 的相反操作。它从变量的值中减 1。

