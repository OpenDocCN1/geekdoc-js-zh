  md: '# # Chapter 10: Basic Data Types of Variables


    Variables have four basic data types. These are numbers, strings, Boolean, and
    objects. We''ll skim through these types, because going in-depth in discussing
    them will leave us not time in learning JavaScript basic codes.


    #  1. Numbers


    In JavaScript, generally, all numbers are considered as 64-bit floating point
    numbers. When there are no values after the decimal point, the number is presented
    as a whole number.


    Examples:


    +   * 9.000 is presented as 9

    * 6.000 is presented as 6

    * 2.00 is presented as 2


    JavaScript and other computer programming languages are based on the IEEE 754
    standard, or the Standard for Floating-Point Arithmetic.


    Number literals can be a floating-point number, an integer or a hexadecimal.


    Example of floating-point numbers:


    +   * 4.516

    * 9.134

    * 6.01

    * 4.121


    Examples of integers:


    +   * 34

    * 45'
  merge: -1
  pgno: 46
- img_proc: true
  md: '+   - 21

    - 30


    # Examples of hexadecimal numbers


    +   - OxFF

    - -OxCCFF


    # Special number values


    +   - ''NaN'' and ''Infinity'' - are JavaScript’s two ''error values''

    - NaN (Not a Number) error appears when the browser cannot parse the number, or
    when an operation failed.


    On the other hand, Infinity is an error that appears when the number cannot be
    represented because of its magnitude. The error also appears when you divide a
    number by zero (0).


    +   - -0 and +0 - the -0 rarely appears, so don''t get confused about these special
    number values. You can ignore them, for now.

    - Null - these are obtained when the browser cannot return a value.


    # 2. Strings


    Strings are data types that are typically enclosed in matching single quotes or
    double quotes. The elements can be numbers or texts.


    Strings are discussed more on chapters 13 to 21.


    # 3. Boolean


    These data types represent either ''true'' or ''false''. Through the use of Boolean,
    you can find out whether a JavaScript expression is ''true'' or ''false''.


    The ''true'' returns are generally obtained from expressions with true values,
    such as equations and similar expressions.


    In contrast, ''false'' returns are obtained from expressions without true values.'
