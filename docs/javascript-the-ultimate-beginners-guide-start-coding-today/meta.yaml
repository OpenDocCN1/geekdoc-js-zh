    \ the value or element you need from the main array, and the second bracket indicates\
    \ the index of the value in your second array that you would like to print.\n\n\
    Don't forget the default rule that all indices start at 0, 1, 2, 3, and so on.\n\
    \n# Example from our previous array:\n\n```javascript\nvar patients = [\n  ['Elsa',\
    \ 'married', 30, 'Chicago', 'idiopathic anemia'],\n  ['Ana', 'single', 18, 'Laramie',\
