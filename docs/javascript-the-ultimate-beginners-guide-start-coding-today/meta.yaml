    \ 中，输入 'alert(\"Hello, enjoy your stay here.\")'。查看上面的示例。在你按下 'enter' 后，弹出窗口或警告将显示你输入的字符串。\n\
    \n有些程序员使用关键字 'window.alert'。在本书中，我们将使用形式形式 alert。\n\n- 2. 你可以切割你的字符串并组合创建新的。\n\
