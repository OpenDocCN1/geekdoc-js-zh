  md: '# # Chapter 39: Accessing Style Sheets Using JavaScript


    You may have to create new style sheets for your website later on, when you become
    a web developer and programmer.


    JavaScript can access style sheets from the browser for you.


    CSS or Cascading Style Sheets are responsible in displaying HTML elements on a
    website using markup language. HTML and CSS are crucial in building websites.


    Accessing style sheets


    JavaScript can access style sheets by using this code:


    ```

    document.styleSheets

    ```


    You can also use the code:


    ```

    document.createElement

    ```


    If you want to create new style sheets, use this code:


    ```

    var sheet = document.createElement(''style'')

    sheet.innerHTML = "div{border: 3px navy blue; background color: yellow;}"\ocument.body.appendChild(sheet);

    ```


    See next image:'
