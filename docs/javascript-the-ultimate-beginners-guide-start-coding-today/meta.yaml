    # Chapter 26: Definition and Uses of Prompts


    On many websites prompts are significant tools for the users’ interaction with
    the website. Prompts are boxes that ask users some questions and then users can
    either answer or not.


    Prompt codes are similar to alert codes, but prompts have more interactive capabilities,
    such as being able to ask the user questions and allowing the user to give their
    own responses, or select the default response provided by the website. The alerts
    simply give a message or an alert to the user.


    Example of prompt codes:


    +   1 question = "Your highest educational attainment?";

    2 defaultAnswer = "college";

    3 educ = prompt (question, defaultAnswer);


    See image below of how the prompt appears:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_123_0.png)


    The user can delete the default answer, “college” and type in a new answer, or
    the user can click ‘OK’ to accept the default answer.'
