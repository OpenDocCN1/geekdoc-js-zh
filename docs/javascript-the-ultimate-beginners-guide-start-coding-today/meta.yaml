    注意：“表达式”仅适用于数学。表达式也可以适用于值的组合，例如数字和字符串。当你在控制台中输入数字时，它会自动响应并进行计算。如果你不想发生这种情况，请将数字转换为字符串。


    ## 赋值运算符：


    | 运算符 | 示例 | 等效于 |

    | :--- | :--- | :--- |

    | = (简单赋值) | c = a | 变量 c 分配了 a 的值 |

    | += (加赋值) | b += a | b = b + a |

    | -= (减赋值) | b -= a | b = b - a |

    | /= (除赋值) | b /= a | b = b / a |

    | *= (乘赋值) | b *= a | b = b * a |

    | % (取模/取模赋值) | b %= a | b = b % a |


    ## 类型运算符


    - 1. `instanceof` 运算符当对象是该构造的实例时返回 `true`。

    - 2. `typeof` 返回变量的类型。


    ## 比较和逻辑运算符


    - 1. == 等于

    - 2. === 值和类型相等

    - 3. > 大于

    - 4. >= 大于等于

    - 5. < 小于

    - 6. <= 小于等于

    - 7. != 不等于

    - 8. !== 不相等

    - 9. ? 三元运算符


