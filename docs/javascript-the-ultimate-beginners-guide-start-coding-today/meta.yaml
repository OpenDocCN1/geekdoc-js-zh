    \ = = = = =\n\n### 1. Numbers\n\nIn JavaScript, generally, all numbers are considered\
    \ as 64-bit floating point numbers. When there are no values after the decimal\
    \ point, the number is presented as a whole number. JavaScript and other computer\
    \ languages are based on the IEEE 754 standard for Floating-Point Arithmetic.\
    \ Number literals can be a floating-point number, integer or hexadecimal.\n\n\
    Example of floating-point numbers:\n\n- 4.5\n- 9.16\n- 6.0\n\nExamples of integers:\n\
    \n- 9.000\n- 6.000\n- 2\n\n### Special values\n\n- NaN (Not a Number) error appears\
    \ when the browser cannot parse the number, or when an operation failed.\n- Infinity\
    \ is an error that appears when the number cannot be represented because of its\
    \ magnitude. The error also appears when you divide a number by zero.\n- NaN and\
    \ Infinity rarely appear, so don't get confused about these special values.\n\
    - Null - these are obtained when the browser cannot return a value.\n\n### 2.\
    \ Strings\n\nStrings are data types that are typically enclosed in matching single\
    \ quotes or double quotes. The elements can be numbers or texts. Strings are discussed\
    \ more on chapters 13.\n\n### 3. Boolean\n\nThese data types represent either\
    \ 'true' or 'false'. Through the use of Boolean, you can find out whether JavaScript\
    \ expression is 'true' or 'false'. The 'true' returns are generally obtained from\
    \ expressions with true values. In contrast, 'false' returns are obtained from\
    \ expressions without true values.\n\n### 4. Objects\n\nObjects encompass all\
    \ data types in the sense that numbers, Booleans, and strings can be objects.\
    \ Data such as arrays, regular expressions, and dates are objects. Objects contain\
    \ many values and have properties. Thus, they are containers of named values.\
    \ This name:value pair is called property. They can be a collection of various\
    \ different data.\n\nExamples:\n\n- student: \"Johnson\"\n- country: \"Sweden\"\
    \n- street: \"Reed Avenue\"\n\nExample:\n\n```javascript\nvar students = {firstName:\
    \ \"Lena\", lastName: \"Dean\"};\n```\n"
  mdcn: "\n示例：\n\n```\nstudentsNames previousDate\nstudentName petName\npatientsName\
    \ homeAddress\nfirstName schoolID\nlastName homeViewers\nidNumber lateShow\n```\n\
    \n如果你浏览这些名称，你会发现你可以按照任何想要的方式为变量命名。\n\n然而，使用一个你容易记住的名字更好，因为名称描述了你变量的内容。\n\n如果你把汽车的数据命名为\
    \ `lastDate`，那将会很困惑，对吧？\n\n- 对于变量的赋值值，你可以使用大写字母或小写字母，取决于你的喜好。但要确保字符串被包含在匹配的引号中。\n\
    \n示例：\n\n```\nvar patientsName;\npatientsName = \"Luke Walker\";\n```\n\n- 你可以在每个变量后使用逗号，在一条语句中声明变量。\n\
    \n仅在变量名之前使用关键字。这通常用于数组变量。\n\n示例：\n\n```\nvar studentsNames;\nstudentsNames = [\"\
    Fritzgerald\", \"Walker\", \"Dixon\", \"Palmer\"];\n```\n\n查看下一张图片\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_44_0.png)\n\
    \n你可能想实验一下看看它在网页上的显示效果。你可以使用代码：\n\ndocument.write(studentsNames);\n\n## 访问变量\n\
    \n你可以通过名称来访问变量的值，而不是一个一个地输入值。\n\n查看下图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_44_1.png)\n\
    \n`document.write` 命令将在网页上写入变量 'studentsNames' 的内容。查看下图：\n\n# Fritzgerald, Walker,\
    \ Dixon, Palmer\n\n```\nvar students\nundefined\nstudentsName\n[\"Fritzger\"\n\
    ```\n\n当然，如果你愿意，可以使用多行来创建你的代码。这取决于你的喜好。\n\n关于多行代码的示例将在第 29 到 34 章中详细讨论，主题是——数组。\n\
    \n函数——可以允许你只写一次代码并使用多次。\n\n变量的基本数据类型（将在它们各自的章节中逐一讨论）。\n\n- 1. 数字 (Numbers)\n-\
    \ 2. 字符串 (Strings)\n- 3. 布尔值 (Booleans)\n- 4. 对象 (Objects)——数组属于此类\n\n提记：\n\n\
    JavaScript 的变量和函数是区分大小写的。因此，你必须在整个代码中遵守相同的大小（大写或小写）。\n\n\"studentName\" 与 \"studentname\"\
    \ 是不同的。当你使用与你输入的大写名称不同的小写名称时，你将收到一个错误。\n\nJavaScript 的数字长度通常为 16 位，以便浏览器能够正确执行数字代码。\n\
    \n## 第 10 章：变量的基本数据类型\n\n变量具有基本数据类型。这些是数字、字符串、布尔和对象。我们将简单介绍这些类型，因为深入研究它们将使我们没有足够的时间学习基础代码。\n\
    \n### 1. 数字 (Numbers)\n\n在 JavaScript 中，通常所有数字都被 true视为 64 位浮点数。当小数点后没有值时，该数字将呈现为整数。\n\
    \nJavaScript 和其他计算机语言基于 IEEE 754 浮点算术标准。\n\n浮点数的示例：\n\n- 4.5\n- 9.16\n- 6.0\n\n\
    整数的示例：\n\n- 9.000\n- 6.000\n- 2\n\n### 2. 字符串 (Strings)\n\n字符串是通常包含在匹配的单引号或双引号中的数据类型。元素可以是数字或文本。字符串将在第\
    \ 13 章进行更多讨论。\n\n### 3. 布尔值 (Boolean)\n\n这些数据类型表示 'true'（真）或 'false'（假）。通过使用布尔值，你可以发现\
    \ JavaScript 表达式是 'true' 还是 'false'。'true' 返回通常从具有真值的表达式获得。相比之下，'false' 返回从不具有真值的表达式获得。\n\
    \n### 4. 对象 (Objects)\n\n对象在意义上包含了所有数据类型，因为数字、布尔值和字符串都可以是对象。如数组、正则表达式和日期等数据都是对象。对象包含许多值并具有属性。因此，它们是命名值对容器。这种“名称:值”值对被称为属性（property）。它们可以是各种不同数据的集合。\n\
    \n示例：\n\n- student: \"Johnson\"\n- country: \"Sweden\"\n- street: \"Reed Avenue\"\
    \n\n示例：\n\n```\nvar students = {firstName: \"Lena\", lastName: \"Dean\"};\n```\n\
