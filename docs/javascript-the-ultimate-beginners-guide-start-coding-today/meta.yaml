  md: '# Chapter 12: Program Flow Controls


    JavaScript has its own organized program flow. The order in which statements are
    executed, typically starts from the top of the program/script/code going downwards.
    BUT – this is when there are no other actions/commands that the first statement
    has to execute.


    For example, with the function ''prompt'', the browser has to wait for the user
    to interact with the prompt, before it could proceed to the next command.


    Primarily the functions control the flow of the program. Some of the functions
    may divert the flow to various directions. One function can lead to another function
    that could slow down the flow.


    In this statement:


    ```

    var myString = ''12345678'';

    var length = myString.length;

    document.write(''This is the length of my string: '' + length);

    ```


    The program flow could be:


    +   * Input the new variable

    * Measure the length of the string.

    * Write return value of "This is the length of my string..." on the screen.


    The flow in this statement is organized, but you have also to consider how fast
    or slow your browser is.


    The flow controls control the flow of the JavaScript program. There are two types
    of flow controls:


    +   1. Loop types'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'These are indicated by iteration, repetition or continuity of the action or
    execution of the code. It makes use of for, for-in, while, do-while. This is discussed
    in chapter 32, on the topic about loops.


    Likewise, ''break'' and ''continue'' for loops can affect the program flow. Break
    stops the loop and terminate it, , while continue allows the loop to resume its
    action.


    # Example:


    ```

    for (number=0;number<10;number++)

    if (number==6) break; else document.write(number+''<br>'');

    ```


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_58_0.png)


    If you view the image above, the loop is broken, and the return value only showed
    numbers 0 to 5 on the screen.


    If you insert this in an HTML code, you can use this code:


    ```

    <html>

    <head>

    <script>

    for (number=0;number<10;number++)

    if (number==6) break; else document.write(number+''<br>'');

    ```'
  merge: -1
