    </script>

    </head>

    </html>

    ```


    See image below:


    | File | Edit | Format | View | Help |

    |---|---|---|---|---|

    | <html><br><head><br><title>Break</title><br><script><br>for (number=0;number<10;number++)<br>if
    (number==6) break; else document.write(number+''<br>'');<br></script><br></head><br></html>
    |


    # Decision types


    In this type, the program flows according to a condition. These statements make
    use of conditions, as ''if'', ''else-if'', for/in, while/do while, and similar
    statements.


    ''if'' statements are the simplest condition statement.


    Example:


    ```

    if (condition) {

    statement

    }

    ```


    There are examples of condition statements in chapters 27 to 28, for the decision
    type type statements.


    The difference between loops and decision type flow controls is that loops has
    a continuous action unless broken, while decision flow controls execute only the
    command once.'
