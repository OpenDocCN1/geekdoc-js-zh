    ## Chapter 23: Other Operators Use in Expressions


    There are other math operators included in JavaScript that you must know.


    - 1. Making use of ++ sign.

    ```

    num++;

    ```

    The ++ sign denotes increments of 1 added to the variable.

    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_109_0.png)


    - 2. Making use of --.

    This is the opposite of num++. It subtracts 1 from the value of the variable.

    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_110_0.png)


    Take note: ‘Expressions’ is applied only to math. ‘expressions’ can also be applied
    to a combination of values, such as numbers and strings. When you type numbers
    on your console, it will respond automatically to it, and perform computations.
    If you don’t want this to happen, convert your number to strings.


    ## Assignment operators:


    | Operators | Example | Equivalent to |

    | :--- | :--- | :--- |

    | = (simple assignment) | c = a | Variable c has assigned values of a |

    | += (add and assignment) | b += a | b = b + a |

    | -= (subtract and assignment) | b -= a | b = b - a |

    | /= (divide and assignment) | b /= a | b = b / a |

    | *= (multiply and assignment) | b *= a | b = b * a |

    | % (modules and assignment) | b %= a | b = b % a |


    ## Type operators


    - 1. instanceof operator returns true, when the object is the object’s instance.

    - 2. typeof returns variable’s type.


    ## Comparison and logical operators


    - 1. == equal to

    - 2. === equal value and type

    - 3. > greater than

    - 4. >= greater than or equal

    - 5. < lesser than

    - 6. <= lesser than or equal

    - 7. != not equal

    - 8. !== not value and type

    - 9. ? ternary operator (conditional)


    ## Chapter 24: Creating and Displaying Date and Time


    With JavaScript, you can create and display the date and time on your page. It''s
    important to remember that the web browser is responsible for executing the JavaScript
    code within the HTML.


    You can create and display the date and time per millisecond in your own website
    as you continue to learn JavaScript and other programming language. There are
    two ways that the date and time is created: string and numbers.


    For creating a date object, this is the general statement:


    ```

    var dateObjectName = new Date([parameters]);

    ```


    Example:


    ```

    var summer2022 = new Date("April 15, 2022 12:20:00");

    ```


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_112_0.png)


    If you noticed, the parameters presented above is a string on month day, year
    hours:minutes:seconds. These are all included in the image above. There are other
    ways to present the parameters, such as omitting the parameters.


    Example:


    ```

    var today = new Date();

    ```


    This will return the day of the week, month, day, year, hours, minutes and seconds.


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_113_0.png)


    You can also use integers (numbers) in your parameters, by converting the date
    to numbers. (Year, month, day, hour, minute and seconds).


    Example:


    ```

    var summer2022 = new Date(2022, 4, 12, 20, 0);

    ```


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_113_1.png)


    Another simpler method that you can utilize as parameters is simply using the
    integer values of the year, month and day.


    Example:


    ```

