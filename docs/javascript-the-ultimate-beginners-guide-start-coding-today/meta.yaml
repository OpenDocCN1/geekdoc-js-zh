    to your success.


    +   5. Review the chapters every now and then.


    You can always review the chapters whenever you have forgotten any information.
    You should not memorize, but instead, you should understand the information, so
    you won’t have to memorize them.


    +   6. Be willing to explore.


    Explore other languages and apps, such as Python, HTML, CSS and JAVA, because
    all of these are interrelated. Certainly, your knowledge would be enriched more.'
  - '[PAGE 194]


    +   7. There are several ways to skin a cat.


    If you find out that there are other ways to write a code for a certain program,
    ready to learn from it. JavaScript is a dynamic language and as developments in
    technology continue, it''s expected that JavaScript would also evolve with the
    times.


    +   8. Adjust to your browser''s capabilities.


    Your browser will help you write your statements, so befriend it. Know its capabilities
    and limitations and work around them. For JavaScript coding, I recommend Google
    Chrome and Mozilla.


    +   9. Brackets are for arrays.


    This is one important fact that you should remember. If you don''t use the brackets
    for your arrays, they won''t be recognized as such. The code may become valid
    initially but succeeding statements won''t hold water.


    +   10. Quotes are for strings.


    Quotes can be used for elements inside arrays and other uses. But the one thing
    that indicates a text or a group of text is a string is through the quotes before
    and after the words.


    +   11. Semicolons are for statements.


    If you''re done writing your statements, ALWAYS add the semicolon. If you''re
    writing arrays, double check if you have added the semicolon after your statements.
    It may be optional for some browsers, but it pays to be cautious.


    +   12. JavaScript is different from JAVA.


    JAVA has nothing to do with JavaScript. They''re different things.


    +   13. Learn more about HTML.


    Continue learning about JavaScript and proceed to HTML, if you still haven''t
    studied it. This is because HTML is the eternal host of JavaScript. Their strong
    and inevitable relationship will, span a long time. Thus, learn about HTML, as
    well.


    +   14. Continue acquiring knowledge.'
