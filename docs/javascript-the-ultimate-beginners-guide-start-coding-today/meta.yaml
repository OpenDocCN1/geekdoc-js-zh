    \nSee below: (from Mozilla)\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_160_0.png)\n\
    \nLet's say you want to access, display or print “Elsa’s” data, specifically her\
    \ illness, “idiopathic anemia”.\n\nYou can write your JavaScript this way:\n\n\
    ```javascript\ndocument.write(patients[0][4]);\n```\n\nWhere:\n\n- [0] – indicates\
    \ the first index in your patients’ array, and that index is ‘Elsa’, and the second\
    \ bracket [4], indicates index 4, which is Elsa’s illness – ‘idiopathic anemia’.\n\
    \nThis statement `document.write(patients[0][4]);` will write “idiopathic anemia”\
    \ on your web page.\n\nSee below: (from Chrome)\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_161_0.png)\n\
    \nHence the indices of your arrays are:\n\nFor the first bracket:\n\n- ‘Elsa’\
    \ = 0\n- ‘Ana’ = 1\n- ‘Lily’ = 2\n- ‘Leo’ = 3\n\nFor the second bracket:\n\n-\
    \ Name = 0\n- Civil status = 1\n- Age = 2\n- State = 3\n- Illness = 4\n\nIf you\
