    \ `<>` 之中。结束标签使用斜杠配合箭头来表示它是结束标签 `</>`。\n\n示例：\n\n```html\n<script>\n</script>\n\
    ```\n\n- 2. 基础的 HTML 代码如下：\n\n```html\n<html>\n<head></head>\n<body></body>\n\
    </html>\n```\n\n看下方的图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_171_0.png)\n\
    \n由于你可以将 JavaScript 插入到 HTML 的 `<body>` 或 `<head>` 中，你可以这样操作：\n\n### 在何处插入你的 JavaScript\
    \ 代码：\n\n```html\n<html>\n<head>\n<script>\n在此处插入 JavaScript\n</script>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n看下方的图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_172_0.png)\n\
    \n或者这种方式：\n\n```html\n<html>\n<head></head>\n<body>\n<script>在此处插入 JavaScript</script>\n\
    </body>\n</html>\n```\n\n看下方的图：\n\n```html\n<html>\n<head></head>\n<body>\n<script>\n\
    在此处插入 JavaScript\n</script>\n</body>\n</html>\n```\n\n注意，HTML 代码的所有元素都有起始标签和结束标签。\n\
    \n### 3. 插入一个‘Prompt（提示框）’。\n\n如果你决定插入一个‘Prompt’，你所做的就是将代码插入到 ‘script’ 标签所在的地方：\n\
    \n看下方的示例：\n\n```html\n<html>\n<head>\n<script>\nvar welcome = prompt(\"你叫什么名字？\"\
    );\ndocument.write(welcome);\nconsole.log(welcome);\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n看下方的图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_174_0.png)\n\
    \n- 4. 你可能也想用这种方法：\n\n```html\n<html>\n<head></head>\n<body>\n<p id=\"demo\"></p>\n\
    <script>\ndocument.getElementById(\"demo\").innerHTML=\"Hello World!\";\n</script>\n\
    </body>\n</html>\n```\n\n看下方的图：\n\n```html\n<html>\n<head></head>\n<body>\n  <p\
    \ id=\"demo\"></p>\n  <script>\n    document.getElementById(\"demo\").innerHTML=\"\
    Hello World!\";\n  </script>\n</body>\n</html>\n```\n\n将任何类型的 JavaScript 代码插入到\
    \ `<script> </script>` 标签中，你就没问题了。\n\n好了。你现在知道在何处以及如何插入 JavaScript 代码了吗？如果你愿意，可以多加练习。\n\
    \n## 第 37 章：操作和切换图片\n\n在维护你网站良好的外观的同时，你可能需要操作和切换图片。你可以通过以下方法实现：\n\n使用 getElementById();\n\
    \n你可以通过使用插入/嵌入到 HTML 代码中的 JavaScript 代码来更改或切换图片。\n\n示例：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <script type=\"text/javascript\"\
    >\n  function change() {\n    var image = document.getElementById('landscape');\n\
