  md: '# Variable initialization


    This is the process of storing a value in a variable. You can do it immediately
    after creating you variable or later when you want to store it. Indices (0, 1,
    1, 3...) will be assigned to each variable, so that you can access them without
    difficulty.Commonly, variables are initialized with the value–undefined.


    Once a variable has been declared, you''re not allowed to declare the same variable
    again.


    # Creating or declaring variables


    You can easily create or declare variables by remembering the following:


    +   - Variables can start with underscore _, a dollar sign $, or a letter (lowercase
    or uppercase), and then after these options, you can use any other symbols or
    letters.


    +   - The variables must not use keywords. This is understandable. The user will
    confuse the browser, whether it will execute the user''s command or not.


    +   - Use the variable keyword''var''. Keep in mind to use the lowercase letters.


    +   - It''s best to declare your variables before you write your statements or
    code. If you don''t do this, JavaScript will display your variables''undefined''.
    However, the console may execute the command if the variable is undefined. You
    will have to discover this from your own browser.


    +   - When assigning values to your variables, use the equal (=) sign. Your values
    can be a string, a number and other data types.


    +   - It''s important to keep in mind that the left-hand side is the variable
    name and the right-hand side is the value/s of the variable/s. Interchanging them
    would give you an error.


    Example:'
