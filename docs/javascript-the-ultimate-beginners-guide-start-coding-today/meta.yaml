    \ of various different data.\n\nExamples:\n\n- student: \"Johnson\"\n- country:\
    \ \"Sweden\"\n- street: \"Reed Avenue\"\n\nExample:\n\n```\nvar students = {firstName:\
    \ \"Lena\", lastName: \"Dean\"};\n```\n\nSee image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_50_0.png)\n\
    \nThey are typically expressed in pairs as 'name:value'. Take note of the colon\
    \ between the pair, and the commas after each pair. The property values are in\
    \ quotes, and the entire statement is in brackets. You can understand more about\
    \ objects in the next chapter, and the chapters about arrays. Since the data types\
    \ of variables are discussed in the various chapters, you'll come to understand\
    \ more about variables as you discover their vital role in JavaScript coding.\n\
    \n## Chapter 11: Using Prototypes\n\nYou will sometimes hear scripters talk about\
    \ Prototypes in JavaScript, and you may be wondering what they are. Read on.\n\
    \n### What are JavaScript Prototypes?\n\nBefore you could understand Prototypes,\
    \ you have to understand objects. In the previous chapter, you have read about\
    \ objects and how they contain properties, methods, how they work, and how they\
    \ are created.\n\nTogether with extensible attributes and class, prototypes are\
    \ one of the attributes of objects.\n\nAs mentioned, you can create objects using\
    \ the name:\"values\" pair. Let’s create an object on students:\n\nExample 1:\n\
    \n```\nvar student1 = {firstName: \"Daniel\", lastName: \"Johnson\", gender: \"\
    male\"};\n```\n\nExample 2:\n\n```\nvar student2 = Object.create(new Object());\n\
    student2.firstName = 'Daniel';\nstudent2.lastName = 'Johnson';\nstudent2.gender\
    \ = 'male';\n```\n\n```javascript\nvar student1 = {firstName: 'Daniel', lastName:\
    \ 'Johnson', gender: 'male'};\n// undefined\nvar student2 = Object.create(new\
    \ Object());\n// undefined\nstudent1.firstName = 'Daniel';\n// \"Daniel\"\nstudent2.firstName\
    \ = 'Daniel';\n// \"Daniel\"\nstudent2.lastName = 'Johnson';\n// \"Johnson\"\n\
    student2.gender = 'male';\n```\n\nNow, in the next example, the 'function student'\
