  md: '# Chapter 4: Fundamentals of JavaScript


    There are fundamental rules of JavaScript that you should remember. You can learn
    about them as we go on with the chapters, let''s establish first the most important
    fundamental tenets.


    +   1. The Unicode character set is used in creating your JavaScript programs.


    The Unicode character set contains most universal characters, punctuations and
    symbols. Hence, you can use them easily in writing your statements for your programs
    to create your JavaScript codes.


    +   2. You can add the semicolon symbol;) after each statement.


    If you''re not sure whether to add or not, the best option is to add. You can
    add the semicolon after each statement.


    In some instances, the browser recognizes the JavaScript code even without the
    semicolon, but it''s still best to add the semicolon to ascertain that the statement
    is executed properly by any browser. It''s not an a''mustbut just to be sure.


    Example:


    ```

    alert("My name is Jekyll.");

    ```


    +   3. You can use a single quote, or double quotes for strings.


    Either the single or the double quotes could be used for strings. But you must
    ascertain that if you use a single quote before the string, you must also use
    the single quote after the string. Likewise, with your double quotes. You will
    know more about strings in chapter 13 to 21.


    Example of strings:


    ''My name is Jekyll.''


    "My name is Jekyll."'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   4. There are three primitive types of data.


    These are numbers (1, 21.50, 3.4...), strings (“My name is Jekyll.”) and Boolean
    (true or false).


    +   5. All numbers are floating-point values.


    Unlike other computer languages, JavaScript doesn’t differentiate integers (whole
    numbers) from floating-point values (numbers with decimal points), because for
    JavaScript all numbers are floating-point values.


    +   6. Take note that JavaScript uses the (−) symbol, and hyphen, to subtract
    and not connect words.


    Examples: These are not recognized by JavaScript.


    ```

    student-number

    student-name

    employee-name

    patients-name

    ```


    +   7. You can use the camel case style in naming your variables.


    Camel case can be used by joining two words with the first letter of the first
    word in lowercase, and the first letter of the second word in uppercase.


    Examples:


    ```

    studentNumber

    studentName

    employeeName

    patientsName

    ```'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'You can also use an underscore to separate names, but it''s rarely used.


    # Examples:


    +   Student_Number

    Student_Name

    Employee_Name

    Patients_Name


    +   8. You may or may not add white spaces between operators.


    Although, JavaScript doesn''t pay attention to white spaces, it''s preferable
    to use white spaces for easy readability.


    # Examples:


    ```

    var number = 7;

    or var number=7;

    ```


    Notice that in the first example, there are spaces between the math operator and
    the number. In the second code, there are no spaces between the math operator
    (=) and the number.


    +   9. ''Object'' is a crucial pillar in JavaScript.


    This is due to the fact that objects include documents, arrays, and a lot of things
    that you can only find in objects. They have properties and methods. More will
    be discussed in the other chapters.


    +   10. You can add the JavaScript in the <head> or <body> sections of the HTML
    page.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'However, you have to use the <script> tags; the opening <script> and closing
    </script> tags.


    Your code must be inserted between these opening and closing script tags.


    JavaScript can also be placed in external files. This can be accessed, when needed,
    with a link from your HTML files.


    This will result in a faster loading site, and an easier method of reading, identifying,and
    maintaining the HTML and the JavaScript codes.


    Examples will be given in the succeeding chapters.


    +   11. The ideal code length of one line is 80 characters.


    This is for easy coding and reading. If you cannot avoid it, and the statement
    is more than 80 characters, then you have to choose to break the code after an
    operator.


    +   12. The first character of a JavaScript identifier must be a letter.


    It can also be a dollar sign $, and underscore _ but not a number. Identifiers
    are used to name keywords, variables, labels and functions.


    +   13. There are two types of values.


    In JavaScript syntax, there are two types of values: the''variable''and the ''fixed''.
    The''variable''values, as the name implies, have variable (inconstant) values;
    that''s precisely why they are called''variables.


    On the other hand,the''fixed values are values that remain constant and that don''t
    change. They are called''literals'', as well.


    +   14. Identifiers in JavaScript are case-sensitive.


    Be careful when using identifiers because errors can occur when you change the
    lowercase to uppercase and vice versa.


    # Examples:


    ```

    idNumber is different from idnumber

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The keyword ''var'' is interpreted, but not ''VAR'' or ''Var''. Always use
    ''var''. Check the case every time you enter or execute a code.


    +   15. **The web browser can execute a JavaScript command in an HTML.**


    As previously mentioned, JavaScript cannot stand on itself alone; it has to run
    together with an HTML or CSS. You can insert the JavaScript into the HTML, or
    create a link from the HTML to your JavaScript.


    Take note that the JavaScript statement is a command or instruction that has to
    be executed by the web browser.


    A JavaScript program can contain various statements waiting to be executed in
    the order that you wrote them.


    +   16. **You can write several statements in one line.**


    You can do this, but ascertain that each statement is separated by a semicolon.


    # Examples:


    ```

    x = 2; y = 3; z = x + y;

    ```


    These are the most fundamental rules of the JavaScript computer programming language.
    As you proceed reading the chapters, you''ll discover that there''s much more
    to JavaScript than those mentioned here.'
  merge: -1
  pgno: 21
- img_proc: true
  md: "# # Chapter 5: Important Terms in JavaScript\n\nEvery computer language has\
    \ its own important terms and keywords. JavaScript is no exception. Keywords in\
    \ JavaScript are considered reserved words.\n\nThis is because you cannot use\
    \ these keywords to name your variables. You have to know these keywords, so you\
    \ can write your codes correctly.\n\n+   1. var - it declares a variable.\n2.\
    \ debugger - it stops the execution of the JavaScript statement, and the debugging\
    \ function may be accessed.\n3. function - ends a loop or a switch.\n4. break\
    \ - it indicates a block of statement that would be executed, when the condition\
    \ is true.\n5. for - it indicates a function.\n6. continue - continues a statement\
    \ at the top, after it has exited from a loop.\n7. if...else - indicates a block\
    \ of statements that would be executed, 'if' the statement is true and -else if\
    \ the statement is untrue.\n8. try.catch - handles the correction of errors of\
    \ a block of statements.\n9. do/while - it executes and repeats a block of statements,\
    \ provided that the condition is true.\n   10. switch - it indicates the execution\
    \ of a block of statements, based on various cases.\n   11. return - it allows\
    \ you to exit a function.\n   12. loop - repetition of a function using certain\
    \ keywords.\n\nOther terms:\n\n+   1. foo -stands for foobar, bar, fubar, or qux.\
