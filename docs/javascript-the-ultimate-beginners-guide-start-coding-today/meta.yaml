- md: "\n## Chapter 8: JavaScript Functions\n\nBefore you can start coding, you will\
    \ have to learn about how to create your own JavaScript functions. It's because,\
    \ almost always, your statements will use a function. You cannot write a code\
    \ without using functions.\n\nIn JavaScript, functions have properties and methods,\
    \ and they are considered as objects of these characteristics. They must also\
    \ return a value.\n\nThe usual steps in utilizing functions are: calling it and\
    \ then passing your arguments and waiting for the return value. The arguments\
    \ can be numbers, strings, or other data types.\n\n## Function statement/declarations/definition\n\
    \nThis is used to declare a function. You can declare a function by using the\
    \ function keyword ‘function’. The general formula in declaring a function is:\n\
    \n```\nfunction functionName(argument1, argument2, argument3...)\n{\n  statement/s\
    \ to be executed;\n}\n```\n\nIf you are to insert it in an HTML script, you can\
    \ write it this way:\n\n```html\n<script type=\"text/javascript\">\n<!---\nfunction\
    \ functionName(argument1, argument2, argument3...)\n{\n  statement/s to be executed;\n\
    }\n-->\n</script>\n```\n\nSee image below:\n\n```html\n<script type=\"text/javascript\"\
    >\n<!--\n  functionName(argument1, argument2, argument3...)\n{\n  statement/s\
    \ to be executed;\n}\n-->\n</script>\n```\n\nExample 1:\n\nLet's say you want\
    \ to create a function on calculating the sum of two numbers. You will have first\
    \ to name your function. For this function, I want to name it gettingSum.\n\n\
    functionName = gettingSum\n\nSo, you can create your function (gettingSum) this\
    \ way:\n\n```javascript\nfunction gettingSum (x, y)\n{\n  return (x+y);\n}\n```\n\
    \nWhen you need to use it, just type the function name and substitute your numbers,\
    \ and it will come up with the sum.\n\nSee next image:\n\n## Example 2\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_33_0.png)\n\
    \nThis is a function that would greet visitors on your web page.\n\n```javascript\n\
    function greetings()\n{\n  document.write('Welcome to my page!');\n}\n```\n\n\
    See image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_33_1.png)\n\nThis\
    \ JavaScript code will display your greetings on your screen.\n\n## Example 3\n\
    \n```javascript\nfunction amAlert()\n{\n  prompt(\"How are you this morning?\"\
    );\n}\n```\n\nRemember to add the script tags when inserting it into an HTML code:\n\
    \n```html\n<script type=\"text/javascript\">\nfunction amAlert()\n{\n  prompt(\"\
    How are you this morning?\");\n}\n</script>\n```\n\nSee image below:\n\n| File\
    \ Edit Format View Help |\n|---|---|---|---|---|\n| <script type=\"text/javascript\"\
    >function amAlert() { prompt(\"How are you this morning?\"); }</script> | |\n\n\
    How can you insert these functions in your HTML code? This will be discussed in\
    \ chapter 36 that explains how to insert JavaScript codes into HTML codes.\n\n\
    ## Example 4\n\nYou can use functions in creating a series of alerts. For example,\
    \ you created an alert that can reflect what's in the mind of your current user.\
    \ You can create the function through this code:\n\n```javascript\nfunction knowingYou(x)\n\
    {}\n```\n\n```javascript\nalert(\"I dream of \" + x);\n}\nknowingYou(\"you\");\n\
    knowingYou(\"Paris\");\nknowingYou(\"being in love\");\n```\n\nSee image below:\n\
    \n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_35_0.png)\n\nWhen the code was executed\
    \ it displayed the knowingYou statements specified in the code.\n\nSee the series\
    \ of images below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_36_0.png)\n\nSecond\
    \ statement:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_36_1.png)\n\nThird statement:\n\
    \nYou can now call this 'knowingYou' function when you want to use it. See? how\
    \ good JavaScript is in developing interactive little surprises for us on a web\
    \ page.\n\n## Reminders:\n\n- Functions can be utilized several times, provided\
    \ that you define them first before using them. It would be quick because you\
    \ only have to define them once.\n- Functions are always followed by parentheses\
    \ and/or brackets.\n- Arguments are the same as parameters. Arguments are the\
    \ names included in the definitions of the function.\n- The values will be the\
    \ return values, after the execution of the statement.\n- Functions have Prototype\
    \ properties.\n- You first have to define a function before the browser can 'call'\
    \ (use) it and execute it.\n- You can call a function by creating buttons in the\
    \ body of your HTML code. This is done by creating a 'form' outside your JavaScript\
    \ codes to input a button.\n\n## Example:\n\n```html\n<form>\n  <input type=\"\
    button\" value=\"press me \" onclick=\"amAlert()\">\n</form>\n```\n\nThis HTML\
    \ code will provide a button that has a label \"press me\" in the web page. When\
    \ you click on it, the amAlert prompt that we have created earlier will appear.\n\
    \nYou can declare as many function as you wish. Just make sure you name them by\
    \ using variables. You have to remember their names, and know how to use these\
    \ functions to your advantage.\n\n## Chapter 9: Definition and Uses of Variables\n\
    \nAs with other computer languages, JavaScript makes use of variables. Unlike\
    \ strings, variables are not enclosed in quotes, and you don't have to declare\
    \ what type they are.\n\n## What are variables?\n\nVariables act as containers\
    \ of your data. Through variables, you can easily store or save your data, and\
    \ access them later on, when you need them. You can use your data by using the\
    \ name of the 'container' (variable) to access it. But first, you have to declare\
    \ and name the variable before you can use or access it.\n\n## Uses of variables\n\
    \nThey act as containers of your data. They are similar to file names, with their\
    \ corresponding contents.\n\nThe keyword 'var' is used to declare a variable,\
    \ while the equal (=) sign is used to define the values of the variables.\n\n\
    ## Example 1:\n\n```javascript\nvar x;\nx = 1;\n```\n\n## Example 2:\n\n```javascript\n\
    var carOwners;\ncarOwners = \"Rachel Newsome\", \"Luke Tell\", \"Sarah Colton\"\
    ;\n```\n\n## Where:\n\ncarOwners is the name of the variable\n\nThe names are\
    \ the values of the variable 'carOwners'.\n\nSee image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_40_0.png)\n\
    \nYou can now use the variable by using its name only. Let's assume you want to\
    \ print or display the names on the page; you can use the code: `document.write`\n\
    \nExample:\n\n```javascript\ndocument.write(carOwners);\n```\n\nWhen the command\
    \ was executed, the names appeared on the page:\n\nSee next image:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_40_1.png)\n\
    \n## Variable initialization\n\nThis is the process of storing a value in a variable.\
    \ You can do it immediately after creating variable or later when you want to\
    \ store it. Indices (0, 1, 3...) will be assigned to each variable, so that you\
    \ can access them without difficulty. Commonly, variables are initialized with\
    \ the value undefined.\n\nOnce a variable has been declared, you're not allowed\
    \ to declare the same variable again.\n\n## Creating or declaring variables\n\n\
    You can easily create or declare variables by remembering the following:\n\n-\
    \ Variables can start with underscore _, a dollar sign $, or a letter (lowercase\
    \ or uppercase), and then after these options you can use any other symbols or\
    \ letters.\n- Variables must not use keywords. This is understandable The user\
    \ will confuse the browser, whether it will execute the user's command or not.\n\
    - Use the keyword 'var'. Keep in mind to use the lowercase letters.\n- It's best\
    \ to declare your variables before you write your statements or code. If you don't\
    \ do this, JavaScript will display your variables undefined. However, the console\
    \ may execute the command if the variable is undefined. You will have to discover\
    \ this from your own browser.\n- When assigning values to your variables, use\
    \ the equal (=) sign. Your values can be a string, a number and other data types.\n\
    - It's important to keep in mind that the left-hand side is the variable name\
    \ and the right-hand side is the value/s of the variable/s. Interchanging them\
    \ would give you an error.\n\nExample:\n\n```javascript\nvar studentName = \"\
    Fritzgerald\";\n```\n\nThe output or return value would be: \"Fritzgerald\". See\
    \ image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_42_0.png)\n\nYou can\
    \ also do it this way:\n\n```javascript\nvar studentName;\nstudentName = \"Fritzgerald\"\
    ;\n```\n\nSee image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_42_1.png)\n\
    \n- As previously mentioned, the names of your two-word variables should follow\
    \ the camel style (first word is lowercase and the first letter of the second\
    \ word is in the uppercase.)\n"
  mdcn: "\n\n## 第 8 章：JavaScript 函数\n\n在开始编写代码之前，你必须学习如何创建你自己的 JavaScript 函数。这是因为几乎在任何情况下，你的语句都会使用函数。如果不使用函数，你就无法编写代码。\n\
    \n在 JavaScript 中，函数具有属性和方法，它们被视为具有这些特征的对象。它们还必须返回一个值。\n\n使用函数的通常步骤是：调用它，然后传递参数并等待返回值。参数可以是数字、字符串或其他数据类型。\n\
    \n## 函数语句/声明/定义\n\n这用于声明一个函数。你可以通过使用关键字 `function` 来声明一个函数。声明函数的通用公式为：\n\n```\n\
    function functionName(argument1, argument2, argument3...)\n{\n  要执行的语句/多个语句;\n\
    }\n```\n\n如果你要将其插入到 HTML 脚本中，可以这样写：\n\n```html\n<script type=\"text/javascript\"\
    >\n<!---\nfunction functionName(argument1, argument2, argument3...)\n{\n  要执行的语句/多个语句;\n\
    }\n-->\n</script>\n```\n\n查看下图：\n\n```html\n<script type=\"text/javascript\">\n\
    <!--\n  functionName(argument1, argument2, argument3...)\n{\n  要执行的语句/多个语句;\n\
    }\n-->\n</script>\n```\n\n示例 1：\n\n假设你想创建一个计算两个数字之和的函数。你首先需要给你的函数命名。对于这个函数，我想给它命名为\
    \ `gettingSum`。\n\nfunctionName = gettingSum\n\n所以，你可以这样创建你的函数 (gettingSum)：\n\
    \n```javascript\nfunction gettingSum (x, y)\n{\n  return (x+y);\n}\n```\n\n当你需要使用它时，只需输入函数名并替换你的数字，它就会算出总和。\n\
    \n查看下一图：\n\n## 示例 2\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_33_0.png)\n\n\
    这是一个在你的网页上问候访问者的函数。\n\n```javascript\nfunction greetings()\n{\n  document.write('Welcome\
    \ to my page!');\n}\n```\n\n查看下图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_33_1.png)\n\
    \n这段 JavaScript 代码将在你的屏幕上显示你的问候。\n\n## 示例 3\n\n```javascript\nfunction amAlert()\n\
    {\n  prompt(\"How are you this morning?\");\n}\n```\n\n在将其插入 HTML 代码时，记得添加 `<script>`\
    \ 标签：\n\n```html\n<script type=\"text/javascript\">\nfunction amAlert()\n{\n \
    \ prompt(\"How are you this morning?\");\n}\n</script>\n```\n\n查看下图：\n\n| 文件 编辑\
    \ 格式 视图 帮助 |\n|---|---|---|---|\n| <script type=\"text/javascript\">function amAlert()\
    \ { prompt(\"How are you this morning?\"); }</script> | | |\n\n如何将这些函数插入你的 HTML\
    \ 代码中？将在第 36 章讨论，该章节将解释如何将 JavaScript 代码插入 HTML 代码中。\n\n## 示例 4\n\n你可以使用函数创建系列\
    \ alert。例如，你创建了一个可以反映当前用户内心想法的 alert。你可以通过这段代码创建函数：\n\n```javascript\nfunction\
    \ knowingYou(x)\n{}\n```\n\n```javascript\nalert(\"I dream of \" + x);\n}\nknowingYou(\"\
    you\");\nknowingYou(\"Paris\");\nknowingYou(\"being in love\");\n```\n\n查看下图：\n\
    \n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_35_0.png)\n\n当代码执行时，它显示了代码指定的 `knowingYou`\
    \ 语句。\n\n查看下面的系列图片：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_36_0.png)\n\n\
    第二条语句：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_36_1.png)\n\n第三条语句：\n\n现在你可以在需要使用它时调用这个\
    \ `knowingYou` 函数了。看到了吗？JavaScript 在网页上为我们开发交互的小惊喜是有多棒。\n\n## 提示：\n\n- 函数可以被多次利用，只要你在使用之前先定义了它们。这会很快，因为你只需要定义一次。\n\
    - 函数后面总是跟着括号和/或大括号。\n- 参数（Arguments）与参数（parameters）相同。参数是包含在函数定义中的名称。\n- 值将在语句执行后成为返回值。\n\
    - 函数具有原型（Prototype）属性。\n- 在浏览器“调用”（使用）并执行函数之前，你必须先定义它。\n- 你可以通过在 HTML 代码的 body\
    \ 部分中创建按钮来调用函数。这是通过在 JavaScript 代码之外创建一个“表单”（form）来输入按钮来实现的。\n\n## 示例：\n\n```html\n\
    <form>\n  <input type=\"button\" value=\"press me \" onclick=\"amAlert()\">\n\
    </form>\n```\n\n这段 HTML 代码将在网页上提供一个标签为 \"press me\" 的按钮。当你点击它时，我们之前创建的 `amAlert`\
    \ 提示框就会出现。\n\n你可以根据需要声明任意数量的函数。只需确保你通过变量为它们命名即可。你必须记住它们的名字，并知道如何利用这些函数来让自己受益。\n\
    \n## 第 9 章：变量的定义与用法\n\n与其他计算机语言一样，JavaScript 使用变量。与字符串不同，变量不包含引号，你不需要声明它们是什么类型。\n\
    \n## 什么是变量？\n\n变量充当你数据的容器。通过变量，你可以轻松地存储或保存数据，并在以后需要时访问它们。你可以通过使用“容器”（变量）的名称来访问数据。但在使用或访问它之前，你必须先声明并命名变量。\n\
    \n## 变量的用途\n\n它们充当你数据的容器。它们与文件名相似，拥有相应的内容。\n\n关键字 `var` 用于声明变量，而等号 (`=`) 用于定义变量的值。\n\
    \n## 示例 1：\n\n```javascript\nvar x;\nx = 1;\n```\n\n## 示例 2：\n\n```javascript\n\
    var carOwners;\ncarOwners = \"Rachel Newsome\", \"Luke Tell\", \"Sarah Colton\"\
    ;\n```\n\n## 变量在哪里？\n\ncarOwners 是变量名。\n\ncarOwners 是变量的值。查看下图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_40_0.png)\n\
    \n现在你可以通过它的名称使用变量。假设你想使用 `document.write` 打印或显示：\n\n示例：\n\n```javascript\ndocument.write(carOwners);\n\
    ```\n\n当命令执行时，名称出现在页面上：\n\n查看下一图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_40_1.png)\n\
    \n## 变量初始化\n\n这是向变量存储值的过程。你可以在创建后进行，也可以在以后需要时进行。索引 (0, 1, 3...) 将赋值给每个变量，以便访问它们。通常，变量被初始化为\
    \ `undefined`。\n\n一旦变量被声明，就不允许再次声明同名变量。\n\n## 创建或声明变量\n\n通过记住以下点可以轻松创建或声明变量：\n\
    \n- 变量可以以下划线 `_`、美元 `$` 或字母（大小写）开头，在这些选项之后可以使用任何符号或字母。\n- 变量不能使用关键字。这会让用户困惑用户的执行命令。\n\
    - 使用关键字 `var`。记得使用小写字母。\n- 最好在编写语句或代码之前声明变量。如果不这样做，JavaScript 将显示你的变量为 `undefined`。然而，如果变量未定义，控制台可能会执行命令。你需要通过自己的浏览器发现这一点。\n\
    - 给变量赋值时，请使用等号 (`=`)。你的值可以是字符串、数字或其他数据类型。\n- 重要的是记住，左侧是变量名，右侧是变量的值。交换它们将导致错误。\n\
    \n示例：\n\n```javascript\nvar studentName = \"Fritzgerald\";\n```\n\n输出或返回值将是：\"\
    Fritzgerald\"。查看下图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_42_0.png)\n\n\
    你也可以这样做：\n\n```javascript\nvar studentName;\nstudentName = \"Fritzgerald\";\n\
    ```\n\n查看下图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_42_1.png)\n\n- 正如提到的，双单词变量的命名应遵循驼峰命名法（第一个单词小写，第二个单词的首字母大写）。\n\
    \n"
