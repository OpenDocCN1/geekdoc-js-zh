    ## Preface


    I want to thank you for buying this book, "JavaScript: The Ultimate Beginners
    Guide, Start Coding Today".


    This book will help you understand what JavaScript is, its importance, and how
    you can use this knowledge to create your own scripts for your websites.


    Unlike other programming language, JavaScript is one crucial part of a website''s
    basic elements.


    This specific type of language is made use by, even the big names in the World-Wide
    Web (WWW), such as Google, Yahoo and Bing. That''s how important JavaScript is.


    I know that as a beginner, you may have trouble understanding computer language,
    so I presented the lessons in a simple manner. I have included images too, to
    allow you to visualize the codes and remember them more.


    Also, I want you to have fun while learning this new and interesting language.


    Who knows? You might be able to design your own website in the future.


    Hence, let''s start learning.


    Thanks again for downloading this book, I hope you enjoy it!


