  md: '# Chapter 22: JavaScript and Math Operators


    There are common operators that you can use in JavaScript. Don''t worry, the most
    common, or the basic operators, are those that you''re familiar with since grade
    school.


    Basic operators


    +   + for addition of numbers, and for strings–acts as a concatenation operator

    * * for multiplication

    * for subtraction

    * / division

    * % for remainder - This is a modulus operator. It will give the remainder of
    the answer, not the answer to the division. When the number can be divided evenly
    by another number, it returns the value 0.

    * ++ increment–this increases the integer value by one, incrementally.

    * -- decrement–this decreases the integer value by one, decrementally.


    Your JavaScript console can act as your calculator too. JavaScript observes mathematical
    expressions, recognizing the symbols in the expressions. Values are the numbers
    in your expressions. You can save your expressions by referencing it using letters.


    Examples for addition:


    Type 6 + 4 on your console, when you press''Enter'', the answer, which is 10,
    will appear.


    Type 1234 + 4567 on your console, when you press''Enter'', the answer, which is
    5801, will appear.


    See image below:'
