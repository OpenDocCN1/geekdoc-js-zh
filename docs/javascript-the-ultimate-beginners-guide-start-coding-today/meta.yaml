    \ into HTML?\n\nUnderstandably, information about HTML codes is important for\
    \ you to be able to do that, but HTML codes are altogether another type of programming\
    \ language that deserves an entire book, as well well.\n\nI can't do all at the\
    \ same time because HTML alone can span hours and hours of discussions.\n\nSo,\
    \ I'll be presenting the most basic HTML code for a page, simply for the purpose\
    \ of showing where you and how to insert your JavaScript codes.\n\n- 1. In HTML,\
    \ there are opening and closing tags.\n\nWhenever you open an element, value or\
    \ data, there are tags that you open and close. Opening tags are enclosed in arrows,\
    \ or the greater than and less than symbols <>. Closing tags use a slash, together\
    \ with the arrows, to indicate it's the closing tag />\n\nExample:\n\n```html\n\
    <script>\n</script>\n```\n\n- 2. The basic HTML code is this:\n\n```html\n<html>\n\
    <head></head>\n<body></body>\n</html>\n```\n\nSee image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_171_0.png)\n\
    \nSince you can insert your JavaScript into the body, or the head of the HTML,\
    \ you can do it this way:\n\n### Where to insert your JavaScript code:\n\n```html\n\
    <html>\n<head>\n<script>\ninsert JavaScript here\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\nSee image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_172_0.png)\n\
    \nOr this way:\n\n```html\n<html>\n<head></head>\n<body>\n<script>insert JavaScript\
    \ here</script>\n</body>\n</html>\n```\n\nSee image below:\n\n```html\n<html>\n\
    <head></head>\n<body>\n<script>\ninsert JavaScript here\n</script>\n</body>\n\
    </html>\n```\n\nNotice that all of the elements of the HTML code have opening\
    \ and closing tags.\n\n### 3. Inserting a ‘Prompt’.\n\nIf you have decided to\
    \ insert a ‘Prompt’, all you have to do is to insert the code where the tags ‘script’\
    \ are:\n\nSee example below:\n\n```html\n<html>\n<head>\n<script>\nvar welcome\
    \ = prompt(\"What is your name?\");\ndocument.write(welcome);\nconsole.log(welcome);\n\
    </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nSee image below:\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_174_0.png)\n\
    \n- 4. You may also want to use this method:\n\n```html\n<html>\n<head></head>\n\
    <body>\n<p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML=\"\
    Hello World!\";\n</script>\n</body>\n</html>\n```\n\nSee image below:\n\n```html\n\
    <html>\n<head></head>\n<body>\n  <p id=\"demo\"></p>\n  <script>\n    document.getElementById(\"\
    demo\").innerHTML=\"Hello World!\";\n  </script>\n</body>\n</html>\n```\n\nInsert\
    \ any type of JavaScript codes into the <script> </script> tags, and you'll be\
    \ okay.\n\nThere you go. Do you know now, where and how to insert your Javascript\
    \ codes? You can practice more, if you're up to it.\n\n## Chapter 37: Manipulating\
    \ and Swapping Images\n\nIn maintaining the good appearance of your website, you\
    \ may need to manipulate and swap images. You can do this through the following\
    \ methods:\n\nUsing the getElementById();\n\nYou can change or swap images by\
    \ using a JavaScript code inserted/embedded into the HTML code.\n\nExample:\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <script\
    \ type=\"text/javascript\">\n  function change() {\n    var image = document.getElementById('landscape');\n\
    \  }\n</script>\n</head>\n<body>\n<img src=\"//indicate the source of the image\"\
    >\n</body>\n</html>\n```\n\nSee next image:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\"/>\n    <script type=\"text/javascript\">\n\
    \    function change() {\n        var image = document.getElementById('landscape');\n\
    \    }\n    </script>\n</head>\n<body>\n    <img src=\"//indicate the source of\
    \ the image\">\n</body>\n</html>\n```\n\nTake the note of the difference with\
    \ the previous HTML codes that we have used. You can see the:\n\n<!DOCTYPE html><html><head>\
    \ and <script type=\"text/javascript\">\n\nThis is the same as the opening of\
    \ the script tag, which is <script>\n\nThe // indicates that the text is a comment\
    \ and is not part of the HTML. Remember to add the closing tag of your JavaScript,\
    \ </script>. The HTML here is merely the basic codes, so you will see where the\
    \ JavaScript code can be inserted. In this case, when a user clicks the image,\
    \ it will change.\n\nAnother example of JavaScript to be inserted is: <script\
    \ type=\"text/javascript\">\n\n```javascript\nfunction changeImage(imageID, fileName)\
    \ {\n    var image = document.getElementById(imageID).src = fileName;\n}\n```\n\
    \nSee image below:\n\n### Using 'if-else' statement\n\nYou can swap images back\
    \ and forth images by using JavaScript’s 'if-else' statement.\n\nHowever, these\
    \ images must be of the same sizes, and they should be stored together with your\
    \ data. In addition, they must be preloaded.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\"/>\n  <script type=\"text/javascript\">\n   \
    \ var imageCloud = ['pic1.jpg', 'pic2.jpg'];\n    var pics = new Array();\n\n\
    \    for (var a in imageCloud) {\n      pics[a] = new Image();\n      pics[a].src\
    \ = imageCloud[a];\n    }\n    var onImg1 = 0;\n    function swapImage(elemID)\
    \ {\n      switch (elemID) {\n        if (onImg1 == 0) {\n          onImg1 = 1;\n\
    \        } else if (onImg1 == 1) {\n          onImg1 = 0;\n        }\n      }\n\
    \    }\n  </script>\n</head>\n<body>\n<div>\n<img src=\"//indicate the source\
    \ of the image\">\n</div>\n</body>\n</html>\n```\n\nSee next image:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"/>\n  <script type=\"\
    text/javascript\">\n    var imageCloud = ['pic1.jpg', 'pic2.jpg'];\n    var pics\
    \ = new Array();\n\n    for (var a in imageCloud) {\n      pics[a] = new Image();\n\
    \      pics[a].src = imageCloud[a];\n      var onImg1 = 0;\n      function swapImage(elemID)\
    \ {\n        switch (elemID) {\n          if (onImg1 == 0) {\n            onImg1\
    \ = 1;\n          } else if (onImg1 == 1) {\n            onImg1 = 0;\n       \
    \   }\n        }\n      }\n  </script>\n</head>\n<body>\n<div>\n<img src=\"//indicate\
    \ the source of the image\">\n</div>\n</body>\n</html>\n```\n\nThere are still\
    \ other methods to manipulate and swap your images, and I'm sure you will learn\
    \ more as you proceed to your advance lessons.\n\nThese codes may not be perfect,\
    \ so you can experiment and modify them, and find out what works with your browser.\
    \ Learning entails freedom to learn through your mistakes.\n\nWhat's important\
    \ is that you know the basic HTML code, which is:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head></head>\n<body></body>\n</html>\n```\n\nSee image below:\n\n| File\
    \ | Edit | Format | View | Help |\n| :--- | :--- | :--- | :--- | :--- |\n| <!DOCTYPE\
    \ html> | | | | |\n| <html> | | | | |\n| <head> | | | | |\n| </head> | | | | |\n\
    | <body> | | | | |\n| </body> | | | | |\n| </html> | | | | |\n\nAnd your JavaScript\
    \ code for HTML, which is:\n\n```html\n<script type=\"text/javascript\">\n//insert\
    \ JavaScript code here\n</script>\n```\n\nOr simply:\n\n```html\n<script>\n//insert\
    \ JavaScript code here\n</script>\n```\n\nAgain, you can insert the whole JavaScript\
    \ code into the <head> or <body> parts of your HTML. Have fun tweaking your JavaScript\
    \ and HTML codes and discover a new amazing world of computer languages.\n\n##\
    \ Chapter 38: Controlling Windows Using JavaScript\n\nYes, JavaScript can also\
    \ control your Windows size and fill it. By now, you’re familiar with how powerful\
    \ JavaScript is in developing your webpage and making it interactive.\n\nNow,\
    \ let's skim a bit on how JavaScript can control your windows.\n\n## Opening a\
    \ new window\n\nYou can open a new window with JavaScript by using the code:\n\
    \n```javascript\nwindow.open(\"foo.html\", \"windowName\");\n```\n\nFrom this\
    \ JavaScript statement, you can do various things, such as resizing it, moving\
    \ it, or adding removing the menu bars, or title bars.\n\nYou can add additional\
    \ codes to let this happen. Let’s say you want to call your new window – amazingWorld,\
    \ this is how you write the JavaScript statements.\n\n```javascript\nwindow.open(\"\
    foo.html\", \"amazingWorld\");\n```\n\n```javascript\n\"width=350, height=350,\
    \ scrollbars=yes, titlebars=no\");\n```\n\n## Resizing windows\n\nTo resize your\
    \ window, you can use the keywords: ‘resizeTo’ and ‘resize By’. You can try testing\
    \ your browser by using the code below:\n\n```javascript\nwindow.resizeBy(100,-100);\n\
    ```\n\nYou may want to resize your window not less than 100 pixels, because some\
    \ browsers will not allow this action.\n\n## Closing your windows\n\nTo close\
    \ your window, you can use the code:\n\n```javascript\nwindow.close();\n```\n"
