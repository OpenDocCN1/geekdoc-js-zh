  md: '# Chapter 27: Creating ‘if’ Condition Statements


    ''if''statements are used in questions that a user can respond to, and that the
    website has to react when the correct answer is verified.


    They always start with an ‘if’word. ‘if’statements, together with’else’statements
    are called conditional statements because conditions are set for them to be executed.


    Let’s say your question is: “What is the common name of sodium chloride?”


    The answer is table salt.


    If the user will be able to answer correctly, you can create a prompt congratulating
    him.


    If not, your prompt will tell him that his answer is incorrect.


    # Example:


    ```

    var x = prompt("What is the common name of sodium chloride?");

    if (x ===="table salt") {

