    Ana\", \"single\", 18, \"Laramie\", \"viral hepatitis\", [\"severe\", \"antiviral\"\
    ]\n  [\"Lily\", \"married\", 38, \"San Diego\", \"diabetes mellitus\"],\n  [\"\
    Leo\", \"married\", 45, \"San Francisco\", \"essential hypertension\"]\n];\n```\n\
    \nYou can add or insert as many arrays as you want. Simply follow the method in\
    \ accessing them so you can obtain the correct data. The key is to bear in mind\
    \ that indices always start with 0.\n\nA toast for you having gone this far. Experts\
    \ would breeze through this chapter, but for you a beginner, I know you will consider\
    \ it a victory to learn about multi-dimensional arrays. Bravo!\n\n# Chapter 34:\
    \ Changing Elements in Multi-Dimensional Arrays\n\nAlthough this is one complicated\
    \ process for you, you can still learn the basics here.\n\nWhen changing the elements\
    \ in an array, the procedure is simple to accessing your arrays - only you have\
    \ to specify what elements you need to change and what changes you want to implement.\n\
    \nLet’s use our previous array, patients, for this chapter so you can understand\
    \ more.\n\nExample:\n\n```javascript\nvar patients = [\n  ['Elsa', 'married',\
    \ 30, 'Chicago', 'idiopathic anemia', ['mild', 'iron'],\n  ['Ana', 'single', 18,\
    \ 'Laramie', 'viral hepatitis', ['severe', 'antiviral']],\n  ['Lily', 'married',\
    \ 38, 'San Diego', 'diabetes mellitus'],\n  ['Leo', 'married', 45, 'San Francisco',\
    \ 'essential hypertension']\n];\n```\n\nIf you want to change the treatment for\
    \ the disease of “Elsa”, from “iron” to “proper nutrition” you can use this code:\n\
    \n```javascript\npatients[0][5][1] = 'proper nutrition';\n```\n\nWhere:\n\n- patients\
    \ = name of array\n- [0] – index of ‘Elsa’\n- [5] – index of severity and treatment\n\
    - [1] – index of treatment\n- ‘proper nutrition’ – text to change ‘iron’\n\nWhen\
    \ you access the information using this code:\n\n```javascript\ndocument.write(patients[0][5][1]);\n\
    ```\n\nThe return value will be:\n'proper nutrition'\n\nQuite easy, huh! More\
    \ practice and you'll learn it by heart. Identifying the index was explained in\
    \ the previous chapter.\n\n# Chapter 35: Document Object Model\n\nDOM or Document\
    \ Object Model is used by all web pages. HTML and XML have this programming interface.\
    \ This model is like a lineage tree that starts from parents and then branches\
    \ out to children, grandchildren, and great, great grandchildren.\n\nThis 'tree'\
    \ has nodes, each node can branch or go deeper depending on how the web language\
    \ programmer structured it.\n\nA web page has documents, elements that have attributes\
    \ you can change with JavaScript.\n\nWhy are we discussing it here? Because JavaScript\
    \ is a powerful language that can modify, enhance and help structure the web page\
    \ to become more interactive, user-friendly and appealing to users with the help\
    \ of the DOM.\n\nJavaScript can find an element in the content of a web page and\
    \ interact with it using the DOM through the API (Application Programming Interface).\
    \ Take note that the API of all browsers is the same.\n\nObviously, JavaScript\
    \ may not be the only programming language that can do these actions, certainly,\
    \ JavaScript is the most common choice and the favorite language of web developers.\n\
    \n# Accessing the DOM\n\nYou can access the DOM through the API. Since all browsers\
    \ have the same DOM, this won't be a problem for you.\n\n# DOM methods\n\nThese\
    \ are actions that you can do to the HTML elements. Elements are contained in\
    \ paragraphs.\n\n# Example:\n\n```javascript\ndocument.getElementById(id)\n```\n\
    \nAs soon you start typing document.get... the rest of the option will appear\
    \ on a drop-down menu, and you can select from there.\n\nDon't forget to add the\
    \ parentheses at the end though, specifying what element you want to interact\
    \ with or modify, and the semicolon, indicating it's the end of the statement.\n"
