    var commonNumber + 4;

    ```


    上面的语句将给你相同的答案 10。你添加了一个变量和一个数字，并得到了答案。你也可以添加变量，不使用数字并得到相同的答案。你可以随意地操作变量。只要你按下“回车键”，JavaScript
    控制台就会给你答案。这比计算器更酷了。


