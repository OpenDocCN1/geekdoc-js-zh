  md: '# # Chapter 41: Handling JavaScript Errors and Exceptions


    JavaScript errors are inevitable. It''s good to face them head-on, and know what
    they are all about.


    Committing an error means you''re practicing in writing your codes. Therefore,
    it also indicates you''re learning more.


    Having said that, not all errors though, are caused by scripters or programmers,
    you like you.


    There are also errors caused by different factors, other than the scripter, himself.
    This could be a slight deviation from the coding set of rules, and similar incidents.


    Although, there are proters in the ''Console'' that would help you resolve the
    issue, it''s best that you become familiar with the common errors.


    # Common JavaScript errors


    In general, there are three types of JavaScript errors:


    +   1. Syntax (parsing) errors

    Syntax errors deal with the JavaScript code itself. Thus, check and parse your
    code for any missing operators or signs.


    +   2. Logical errors

    These errors occur when your ''logic'' in creating your JavaScript programs are
    not logical, resulting to errors. When this occurs, you have to perform a careful
    evaluation and analysis of the program or code you have prepared.


    +   3. Runtime (exception) errors'
  merge: -1
  pgno: 189
- img_proc: true
  md: "These errors occur when your code is correct and has been executed, but the\
    \ method you're calling no longer exists. Only the thread that has the error is\
    \ affected and not the other parts.\n\n# Resolving errors\n\n+   1. Throw method\n\
    \nYou can throw your errors to the try..catch block and allow these two blocks\
    \ to resolve the issue. The benefit of throwing your errors is that you can test\
    \ them. This makes debugging easier and quicker.\n\nThe basic JavaScript code\
    \ for this is:\n\n```\nthrow new Error(\"message\");\n```\n\n# Examples:\n\n```\n\
    throw new Date();\n```\n\n```\nthrow 3457;\n```\n\nWhen you throw an error, your\
    \ try..catch block must be able to catch it, to be able to handle the error.\n\
    \n+   2. Try..catch method\n\nThis method uses the 'try' first, and then the 'catch'\
    \ method in handling the errors. The basic code for this is:\n\n```\ntry {\n \
    \ function())\n} catch(e) {\n  alert(e)\n}\n```\n\nWhere e – exception object\
    \ or errors.\n\nA more detailed code is this is:\n\n```\ntry\n```"
  merge: -1
  pgno: 190
- img_proc: true
  md: '```

    {

    try statements;

    }

    catch(exception)

    {

    catch statements;

    }

    ```


    # 3. Try..catch..finally method


    ```

    try {

    try statements;

    } catch(exception e) {

    catch statements;

    } finally {

    finally statements;

    }

    ```


    When an exception in the code appears, the ‘try..block’ will pass it on to the
    ‘catch’ block, so it can be remedied.


    However, the ‘try..catch..finally block cannot catch syntax errors. If the error
    is not a syntax error, the ‘try block will pass the error to the ‘catch’ block’,
    and then, to the ‘finally’ block’.


    In the try block, the statements, after the exception occurred, will not be executed.
    Therefore, when an error happens in the ‘try’ block, subsequent statements in
    the block won’t be executed.


    Whether there’s an exception or not, the ‘finally’ block will execute its code.
    It cleans the script of any ‘holders’ during the execution of the code.'
  merge: -1
