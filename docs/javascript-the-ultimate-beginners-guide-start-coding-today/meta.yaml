    # Chapter 9: Definition and Uses of Variables


    As with other computer languages, JavaScript makes use of variables. Unlike strings,
    variables are not enclosed in quotes, and you don''t have to declare what type
    they are.


    # What are variables?


    Variables act as containers of your data. Through variables, you can easily store
    or save your data, and access them later on, when you need them. You can use your
    data by using the name of the''container''(variable) to access it. But first,
    you have to declare and name the variable before you can use or access it.


    # Uses of variables


    They act as containers of your data. They are similar to file names, with their
    corresponding contents.


    The keyword''var'' is used to declare a variable, while the equal (= ) sign is
    used to define the values of the variables.


    # Example 1:


    ```

    var x;

    x = 1;

    ```


    # Example 2:


    ```

    var carOwners;

    carOwners = "Rachel Newsome", "Luke Tell", "Sarah Colton";

    ```


    # Where:'
  - '[PAGE 40]


    carOwners is the name of the variable


    The names are the values of the variable''carOwners''.


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_40_0.png)


    You can now use the variable by using its name only. Let''s assume you want to
    print or display the names on the page;you can use the code:`document.write`


    Example:


    ```

    document.write(carOwners);

    ```


    When the command was executed, the names appeared on the page:


    See next image:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_40_1.png)'
  - '[PAGE 41]


    # Variable initialization


    This is the process of storing a value in a variable. You can do it immediately
    after creating you variable or later when you want to store it. Indices (0, 1,
    1, 3...) will be assigned to each variable, so that you can access them without
    difficulty.Commonly, variables are initialized with the value–undefined.


    Once a variable has been declared, you''re not allowed to declare the same variable
    again.


    # Creating or declaring variables


    You can easily create or declare variables by remembering the following:


    +   - Variables can start with underscore _, a dollar sign $, or a letter (lowercase
    or uppercase), and then after these options, you can use any other symbols or
    letters.


    +   - The variables must not use keywords. This is understandable. The user will
    confuse the browser, whether it will execute the user''s command or not.


    +   - Use the variable keyword''var''. Keep in mind to use the lowercase letters.


    +   - It''s best to declare your variables before you write your statements or
    code. If you don''t do this, JavaScript will display your variables''undefined''.
    However, the console may execute the command if the variable is undefined. You
    will have to discover this from your own browser.


    +   - When assigning values to your variables, use the equal (=) sign. Your values
    can be a string, a number and other data types.


    +   - It''s important to keep in mind that the left-hand side is the variable
    name and the right-hand side is the value/s of the variable/s. Interchanging them
    would give you an error.


    Example:'
  - '[PAGE 42]


    ```

    var studentName = "Fritzgerald";

    ```


    The output or return value would be:“Fritzgerald”. See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_42_0.png)


    You can also do it this way:


    ```

    var studentName;

    studentName = ‘Fritzgerald’

    ```


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_42_1.png)


    +   As previously mentioned, the names of your two-word variables should follow
    the camel style (first word is lowercase and the first letter of the second word
    is in the uppercase.)'
- md: "\nExamples:\n\n```\nstudentsNames previousDate\nstudentName petName\npatientsName\
