    \n# Where:\n\n- patients – name of array\n- [0] – index number of Elsa\n\nIndices:\n\
    \n- 0 ['Elsa', 'married', 30, 'Chicago', 'idiopathic anemia', ['mild', 'iron']]\n\
    - 1 ['Ana', 'single', 18, 'Laramie', 'viral hepatitis', ['severe', 'antiviral']]\n\
    - 2 ['Lily', 'married', 38, 'San Diego', 'diabetes mellitus']\n- 3 ['Leo', 'married',\
