    ## Chapter 18: Converting Strings


    Learning how to convert your data to strings is an added advantage for you. The
    secret is knowing what keywords to use and how to write the code correctly.


    **The general code for this:**

    String(object);


    ### 1. Converting numbers to strings:


    ```javascript

    var myNumber = 10;

    var myString = myNumber.toString();

    ```


