  md: '# # Chapter 36: Inserting JavaScript Codes into HTML


    You have read earlier in the lessons that JavaScript cannot stand alone to build
    a web page. You have to insert the JavaScript into the <head> or <body> of the
    HTML code, or link externally the JavaScript to the page.


    Having crucial information, now, it''s time you get some basic knowledge on inserting
    your scripts.


    For what purpose did you try hard to learn JavaScript codes, if you can''t actually
    insert them into HTML?


    Understandably, information about HTML codes is important for you to be able to
    do that, but HTML codes are altogether another type of programming language that
    deserves an entire book, as well.


    I can''t do all at the same time because HTML alone can span hours and hours of
    discussions.


    So, I''ll be presenting the most basic HTML code for a page, simply for the purpose
    of showing where you and how to insert your JavaScript codes.


    +   1. In HTML, there are opening and closing tags.


    Whenever you open an element, value or data, there are tags that you open and
    close. Opening tags are enclosed in arrows, or the greater than and less than
    symbols <>. Closing tags use a slash, together with the arrows, to indicate it''s
    the closing tag />


    Example:


    ```

    <script>

    ```'
