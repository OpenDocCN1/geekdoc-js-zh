    \n- 输入新变量\n- 测量字符串的长度\n- 在屏幕上写入“This is the length of my string...”的返回值。\n\n此条语句中的流是有组织的，但你还必须考虑你的浏览器的快慢。\n\
    \n流程控制控制 JavaScript 程序的流程。流程控制有两种类型：\n\n- 1. 循环类型\n\n这些通过动作的迭代、重复或连续性或代码执行来表示。它利用了\
    \ for, for-in, while, do-while。这将在第32章关于循环的话题中讨论。\n\n同样，循环的 'break' 和 'continue'\
    \ 可以影响程序流。Break 停止并终止循环，而 continue 允许循环继续其动作。\n\n## 示例：\n\n```javascript\nfor\
    \ (number=0;number<10;number++)\nif (number==6) break; else document.write(number+'<br>');\n\
    ```\n\n查看下方图：\n\n![](img/43ccb0e44db8b6abc2a9e33555ca4da1_58_0.png)\n\n如果你查看上面的图片，循环被中断了，返回值只在屏幕上显示\
    \ 0 到 5 的数字。\n\n如果你将此内容插入 HTML 代码中，可以使用这段代码：\n\n```html\n<html>\n<head>\n<script>\n\
    for (number=0;number<10;number++)\nif (number==6) break; else document.write(number+'<br>');\n\
    </script>\n</head>\n</html>\n```\n\n查看下方图：\n\n| 文件 | 编辑 | 格式 | 查看 | 帮助 |\n|---|---|---|---|---|\n\
    | <html><br><head><br><title>Break</title><br><script><br>for (number=0;number<10;number++)<br>if\
    \ (number==6) break; else document.write(number+'<br>');<br></script></head></html>\
    \ | | | |\n\n## 决策类型\n\n在这种类型中，程序根据条件流。这些语句使用了 'if', 'else-if', 'else' 用于 while/do-while。\n\
    \n'if' 语句是最简单的。\n\n```javascript\nif (condition) {\n  statement\n}\n```\n\n循环和决策控制的区别在于循环具有持续动作，而决策控制只执行一次。\n\
    \n## 第13 章：创建字符串\n\n字符串是什么？它们在 JavaScript 中的作用是什么？我们必须学习字符串，因为它们是代码的重要部分。\n\n\
    ### 什么是字符串？\n\n字符串是一个单词、一组单词或文本，被包含在引号 (' ') 或双引号 (\"\") 内部。你可以通过关键字 'var' 存储它们。\n\
    \n示例：这些示例以斜体显示，以便你可以立即识别它们。\n\n- > alert (\"My name is Jekyll\")\n  示例中的字符串是=\"\
