    \ the keyword 'splice'. 'Splice' means removing elements from your arrays. You\
    \ can remove elements you don't want and still maintain the integrity of the array.\n\
    \nExample:\n\nLet's use the same array from the previous chapter.\n\n```\nvar\
    \ students = [\n  'Thompson', 'male', 'passed',\n  'Lyndon', 'female', 'passed',\n\
    \  'Cruise', 'male', 'failed'\n];\n```\n\nAnd you want to splice it.\n\n```\n\
    students.splice(0,2);\n```\n\nWhere:\n\n0 – is the index you want to start from\n\
    2 – is the number of elements you want to remove\n\nHence, in the code, students.splice(0,2);\
    \ you want to start from “Thompson” and remove 2 elements.\n\nSee image below:"
