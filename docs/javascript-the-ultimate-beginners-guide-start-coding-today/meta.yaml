  md: '# Chapter 24: Creating and Displaying Date and Time


    With JavaScript, you can create and display the date and time on your page. It''s
    important to remember that the web browser is responsible for executing the JavaScript
    code within the HTML.


    You can create and display the date and time per millisecond in your own website
    as you continue to learn JavaScript and other programming language.


    There are two ways that the date and time is created: string and numbers.


    For creating a date object, this is the general statement:


    ```

    var dateObjectName = new Date([parameters]);

    ```


    Example:


    ```

    var summer2022 = new Date("April 15, 2022 12:20:00");

    ```


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_112_0.png)


    If you noticed, the parameters presented above is a string on the:


    month day, year hours:minutes:seconds.


    These are all included in the image above. There are other ways to present the
    parameters, such as omitting the parameters.


    Example:'
