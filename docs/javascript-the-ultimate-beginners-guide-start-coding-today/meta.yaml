  md: '# Chapter 35: Document Object Model


    DOM or Document Object Model is used by all web pages. HTML and XML has this programming
    interface. This model is like a lineage tree that starts from parents and then
    branches out to children, grandchildren, and great, great grandchildren.


    This ''tree'' has nodes, each node can branch or go deeper depending on how the
    web language programmer structured it.


    A web page has documents, elements that have attributes you can change with JavaScript.


    Why are we discussing it here? Because JavaScript is a powerful language that
    can modify, enhance and help structure the web page to become more interactive,
    user-friendly and appealing to users with the help of the DOM.


    JavaScript can find an element in the content of a web page and interact with
    it using the DOM, through the API (Application Programming Interface). Take note
    that the API of all browsers is the same.


    Obviously, JavaScript may not be the only programming language that can do these
    actions, certainly, JavaScript is the most common choice and the favorite language
    of web developers.


    # Accessing the DOM


    You can access the DOM through the API. Since all browsers have the same DOM,
    this won''t be a problem for you.


    # DOM methods


    These are actions that you can do to the HTML elements. Elements are contained
    in paragraphs.


    # Example:


    ```

    document.getElementById(id)

    ```


    As soon you start typing document.get... the rest of the option will appear on
    a drop-down menu, and you can select from there.


    Don''t forget to add the parentheses at the end though, specifying what element
    you want to interact with or modify, and the semicolon, indicating it''s the end
    of the statement.


    See image below:'
  merge: -1
  pgno: 168
- img_proc: true
