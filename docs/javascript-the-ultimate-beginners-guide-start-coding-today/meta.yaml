  md: '# Chapter 30: Measuring Arrays


    It''s useful to know how to measure your arrays. Programmers and web developers
    usually measure the length property of an array. You will need this later on,
    when you decide to create your own interactive website.


    How can you measure your arrays? Here''s how to do it using the statement:


    ```

    arrayName.length;

    ```


    Example 1:


    ```

    var patients = ["Elsa", "Ana", "Lily", "Leo"];npatients.length;

    ```


    The return will be = 4

    Since there are 4 elements in your array.


    See image below:


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_148_0.png)


    Example 2:'
  merge: -1
  pgno: 148
- img_proc: true
  md: '```

    var students = ["Thompson", "Lyndon", "Cruise", "Trump", "Clinton"];

    students.length;

    ```


    This will return 5.


    ![](img/43ccb0e44db8b6abc2a9e33555ca4da1_149_0.png)


    # Reminders:


    +   - You have to input or identify first your ‘patients’ array. This means you
    input first the the elements of the ‘patients’ into the ‘Console’ and press ‘Enter’,
    before you can measure the length.


    +   - If you obtain an error return/report, you can identify what the error is
    all about.


    +   - If you can''t find any error, try changing your quotes; check if your quotes
    are matching each other; check if you have closing or opening quotes; check if
    you have the semicolon at the end of the statement; check if your elements are
    separated by commas; check if your arrays are enclosed in matching brackets. There
    are times, the ‘Console’ doesn’t recognize the term ‘var’, and you have to omit
    it.


    This is part of the learning process, the more you explore, the more you will
    learn.

    Learning entitles you to commit mistakes. But don’t commit the errors over and
    over, that’s no longer learning.'
