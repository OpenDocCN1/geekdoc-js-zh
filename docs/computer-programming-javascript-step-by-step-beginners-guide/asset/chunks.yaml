    below:They are typically expressed in pairs as ‘name:value’. Take note of the
    colon in between the pair, and the commas after each pair. The property values
    are in quotes, and the entire statement is in brackets.Chapter 16.         The
    window objectWhat is the ‘window’ object?As the name suggests, this object represents
    the current window. All major parts of the BOM are the direct children of this
    object. For example, window.document (The DOM), window.history, etc. Note that
    each tab on the browser has a unique window object. They don’t share the same
    object! Some properties like window size, which is the same in all tabs, have
    the same value and technically those properties are shared. The window object
    contains references to useful properties and functions that may not strictly be
    related to the window only.Even though there is no strict standard for the ‘window’
    object, it is supported by all browsers.The default references to the ‘window’
    objectSince the ‘window’ object is present on top of hierarchy with no other object
    present at its level, all references to the window object’s methods and properties
    can be made without writing the starting of the dotted notation part, i.e., the
    ‘window. ’ part. Example:window.alert()alert()// same as abovevar x = window.length;var
    y = length;// x will be equal to y since the refer to the same propertyAll variables
    declared are actually ‘window’ object’s propertiesAs stated above, even the variables
    declared in the program are the direct child of the ‘window’ object, and are its
    properties. Example:var x = 21;console.log( window.x ); // prints ‘21’ on the
    console screenThe ‘window’ object’s method referencesHere is the list of the ‘window’
    object’s major methods and their description:●         .alert("message")This method
    is used to display a dialog box on the screen, a type of pop-up, with a message
    that is passed as the argument of this function. The dialog box this will open
    has only one button, which is “OK”Example:window.alert( " Hello from JavaScript!
    " )ORalert( " Hello from JavaScript! " )Both of the above statements are equivalent. ●
            .confirm("message")This method is used to display a dialog box on the
    screen, with a message that is passed as the argument of this function, along
    with two buttons which are “OK” and “Cancel”. This method returns a boolean value.
    It returns true if the “OK” button was clicked and false if the “Cancel” button
    was clicked.Example:var val = confirm( " Do you accept our terms and agreement?
    " );if( val == true) console.log("User pressed OK");else console.log("User pressed
    Cancel");●         .prompt("message", "default text")This method is used to display
    a dialog box on the screen, with a message and an input box where the user can
    enter a value, along with the “OK” and “Cancel” button. This method is used to
    take an input from the user. The ‘default text’ parameter is the default value
    of the input box in the dialog box. This method returns the value entered by the
    user in the input box if the user presses the “OK” button. If the user presses
    the “Cancel” button, this method returns ‘null’.Example:var val = prompt("What
    is your name?", "Enter your name here" );if( val === null) console.log("User pressed
    the cancel button");else console.log("User’s name is " + val);●         .open([URL,]
    [name,] [specs,] [replace])This method is used to open a new window. All the parameters
    in this method are optional. This method returns the window object of the newly
    created window. Here is the description of the parameters:➔        URLThis parameter
    is used to specify the URL of the page to be opened in the new window. The default
    value of this parameter is ‘about:blank’ which opens a window with a blank page.➔
           nameThis parameter is used to specify how the URL is opened in the window
    or the name of the window. The following values are used as this parameter:❖      
    ‘_blank’ : This is the default value of the ‘name’ parameter. If this value is
    used, the URL is loaded in a new window.❖       ‘_parent’ : If this value is used,
    the URL is loaded in the parent frame.❖       ‘_top’ :  If this value is used,
    the URL replaces any of the framesets that have been loaded previously.❖      
    ‘_self’ : If this value is used, the URL replaces the current page and is loaded
    in the current page.❖       Any other value : If any other value is used, it acts
    as the name of the window. Note that the name of the window is not the same as
    the title of the window.➔        specsThis parameter is a string which contains
    some attributes, separated by a comma, of the new window to be opened. You can
    specify things such as width, height etc. of the new window using this parameter.➔
           replaceThis parameter specifies whether the new URL to be opened will replace
    the current URL in the history object list or not. It takes boolean values, true
    or false. If ‘true’ is passed as the value of this parameter, the new URL replaces
    the current URL in the history object list. If ‘false’ is passed, it does not.Example:var
    newWindow = window.open("http://mySite.com", "", "height=210,width=700"); // creates
    a new window with 210px height and 700px width.●         .close()This method is
    used to close a window.Example:var newWindow = window.open("http://mySite.com");newWindow.close();
    // closes the window as soon as it opens●         .scrollTo(xCoords, yCoords)This
    method is used to set the scroll of the window to the specified coordinates in
    the document.●         .resizeTo(height, width)This method is used to resize the
    window to a specified height and width. The height and width passed as the parameters
    in this argument are in pixels(px).The ‘window’ object’s propertiesHere is the
    list of the ‘window’ object’s major properties and their description: ●        
    .pageXOffsetThis property returns the current horizontal scroll distance in pixels(px).
    It is basically the horizontal distance between the actual left corner of the
    page and the current window left corner. ●         .scrollXSame as the window.pageXOffset
    property.●         .pageYOffsetThis property returns the current vertical scroll
    distance in pixels(px). It is basically the vertical distance between the actual
    left corner of the page and the current window left corner. ●         .scrollYSame
    as the window.pageYOffset property.●         .outerHeightThis property returns
    the full height of the window, including the document, the toolbar, and the scrollbar.●
            .outerWidthThis property returns the full width of the window, including
    the document, the toolbar, and the scrollbar.●         .innerHeightThis property
    returns the height of the content area of the window where the HTML document is
    displayed. It does not include the scrollbar or toolbar height.●         .innerWidthThis
    property returns the width of the content area of the window where the HTML document
    is displayed. It does not include the scrollbar or toolbar height.●         .framesReturns
    an array of all the <iframe> element’s in the current window if any.Example:<body><iframe
    src="[https://mySite1.com](https://mysite1.com) "></iframe><iframe src="https://mySite2.com"></iframe><script>console.log(
    window.frames.length ); // prints ‘2’ on the console screen</script></body>●        
    .closedReturns a boolean value indicating whether a window has been closed or
    not. If the returned value is true, the window has been closed. If false, the
    window has not been closed.Example:var newWindow = window.open(" [http://mySite.com](http://mysite.com)
    ");function isNewWindowOpen(){if(newWindow.closed == true)return "NO";else return
    "YES";}Chapter 17.         Maps and SetsThe map class is used to hold a set of
    key value pairs. The values can be primitive types (like numbers or strings) or
    object types. The syntax for declaring the map object is shown below.


    | var mapname=new Map(); |'
