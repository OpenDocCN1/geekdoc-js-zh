    \ more complex programs, debugging becomes almost routine.\n\n### What to look\
    \ for when debugging:\n\nLooking for bugs and errors can be quite overwhelming\
    \ if you don’t know where to look. Here are some of the most common mistakes programmers\
    \ make when coding:\n\n1.  Using `=` instead of `==` to compare two values - the\
    \ `=` sign in programming is used as an assignment operator, which means that\
    \ if you use this instead of the `==` sign, you end up replacing the value of\
    \ the variable on the left hand side of the equation with the value on the right\
    \ hand side of the equation.\n\n2.  Misplacing the semicolon - just as periods\
    \ end sentences in the English language, semicolons end statements in JavaScript,\
    \ as well as other programming languages like C, Java, etc. If, for instance,\
    \ you’ve accidentally put a semicolon in the middle of a statement, JavaScript\
    \ would see the statement as incomplete and produce an error for it.\n\n3.  Misusing\
    \ the quotation marks - quotation marks tell the interpreter that you’re using\
    \ a string, so if you enclose a variable or a number in quotation marks, you’re\
    \ effectively turning them into strings. This’ll lead to anomalies when you try\
    \ to perform numerical operations onto numbers that you’ve accidentally enclosed\
    \ in quotation marks.\n\nSo far, these are only the most common mistakes newbies\
    \ tend to make, but along the way you should be able to see bugs and errors quite\
    \ easily as you get more practice making more complex codes.\n\n## Recap\n\nWe’ve\
    \ covered quite a lot of concepts so far, so let’s review what we’ve learned:\n\
    \n1.  Variables and data types\n\n    *   numbers - can be integers or numbers\
    \ that contain decimals (e.g., `3.14`, `5`, `100`)\n    *   strings - anything\
    \ you enclose in quotation marks (e.g., `\"5\"`, `\"I am a JavaScript master\"\
    `, `\"I love the number 7\"`)\n    *   booleans - `true` or `false`\n\n    In\
    \ order to declare a variable, simply type:\n\n    ```\n    var <variable name>\
    \ = <value>;\n    ```\n\n    You can also just declare the variable name without\
    \ the value if you don’t have one yet:\n\n    ```\n    var <variable name>;\n\
    \    ```\n\n    JavaScript doesn’t care what type of data you put in. If you’ve\
    \ programmed in C or Java, you might have been used to declaring the variable’s\
    \ data type (`int`, `float`, `char`, etc.), but in JavaScript, you can put anything\
    \ in a variable without any problems.\n\n2.  Pop-up boxes\n\n    *   `alert(\"\
    Hi There!\")` - you can pop-up alerts to the user.\n    *   `confirm(\"Are you\
    \ sure?\")` - you can ask for a confirmation from the user.\n    *   `prompt(\"\
    Type anything here.\")` - you can ask for input from the user\n\n3.  Flow-control\n\
    \n    *   `if-else` statement - in a nutshell, if the first condition is met,\
    \ then do whatever’s in the first bracket enclosure and skip the `else` part.\
    \ Otherwise, go to the bracket enclosure for the `else` condition and do whatever’s\
    \ inside it.\n\n# Chapter 14. Regular Expressions\n\n## What are regular expressions?\n\
    \nRegular expressions represent a pattern. In JavaScript, regular expressions\
    \ can be used to perform operations such as searching a pattern, replacing a pattern,\
    \ checking if a string matches a given pattern or breaking of a string into smaller\
    \ strings based on a specific pattern. In JavaScript, regular expressions are\
    \ objects.\n\n## Making a regular expression\n\nThere are two ways by which you\
    \ can create regular expressions in JavaScript, which are:\n\n### Using regular\
    \ expression literal\n\nIn this method, the pattern is specified within two slashes\
    \ `//` followed by the character(s) which are known as modifiers. You will learn\
    \ about what modifiers are later in this chapter; modifiers are optional.\n\n\
    Syntax: `/pattern/modifiers/`\n\nIf this method is used, then the regular expression\
    \ is compiled when the script is loaded and thus if the regular expression is\
    \ constant, this method improves the performance of the program.\n\n### Using\
