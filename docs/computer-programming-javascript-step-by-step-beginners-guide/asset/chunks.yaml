    JavaScript and other computer programming languages are based on the IEEE 754
    standard, or the Standard for Floating-Point Arithmetic.Number literals can be
    a floating-point number, an integer or a hexadecimal.Example of floating-point
    numbers:


    *   4.516


    *   9.134


    *   6.01


    *   4.121


    Examples of integers:


    *   34


    *   45


    *   21


    *   30


    Examples of hexadecimal numbers


    *   OxFF


