    ## 决策与循环


    ES6 支持以下决策与循环命令。


    - `If` 语句——用于计算表达式，然后相应地执行语句。

    - `If…else` 语句——用于计算表达式，然后相应地执行语句。如果布尔表达式计算结果为 false，则执行另一组语句。

    - `Nested if` 语句——用于测试多个条件。

    - `Switch…case` 语句——计算表达式，将表达式的值与 case 子句匹配，并执行与该 case 关联的语句。

    - `For` 循环——一组语句执行 `n` 次。

    - `While` 循环——一组语句在条件保持为 true 时持续执行。

    - `Do…while` 循环——一组语句在条件保持为 true 时持续执行。与 while 循环的区别在于，语句至少会执行一次。


    下面来看这些语句的一些示例。


    ### 示例 58：以下程序是 ES6 中循环（if else）的示例。


    ```

    var start=function(){const num=6;let num1=5;if(num<7){console.log("The value is
    less than 7");}else{console.log("The value is greater than 7");}}start();

    ```


    该程序的输出结果如下：“The value is less than 7”


    ### 示例 59：下一个程序是 ES6 中循环（for 循环）的示例。


    ```

    var start=function(){for(x=0;x<5;x++){console.log(x);}}start();

    ```


    该程序的输出结果如下：01234


    ### 示例 60：此程序是 ES6 中循环（while 循环）的示例。


    ```

    var start=function(){let x=0;while(x<5){console.log(x);x++;}}start();

    ```


    该程序的输出结果如下：01234


    ## 类


    ES6 也支持类。类的定义方式如下：


    ```

    class classname{constructor(parameters){//Assign values to the properties}// More
    methods}

    ```


    其中：`classname` 是分配给类的名称。我们有一个构造函数，在创建对象时调用。构造函数可以接受参数。这些参数可用于为类的属性赋值。然后我们可以在类中定义更多方法。下面来看一个
    ES6 中简单类的示例。


    ### 示例 61：以下程序展示了如何在 ES6 中使用类。


    ```

    var start=function(){class Rectangle{constructor(height, width) {this.height =
    height;this.width = width;}Display(){console.log(this.height);console.log(this.width);}}var
    newrect=new Rectangle(3,4);newrect.Display();}start();

    ```


    关于上述程序，需要注意以下几点：首先我们定义了一个名为 `Rectangle` 的类。它接受两个参数，即 `height` 和 `width`。这可用于定义类的
    `height` 和 `width` 属性。然后我们创建了一个 `Display` 方法，用于显示类的属性。该程序的输出结果如下：34。


    ## 集合


    ES6 也支持集合，例如 map 集合。例如，如果我们想设置 map 集合的值，可以使用 `set` 方法，如下所示：


