    > Total Paragraphs</button>\n  </body></html>\n```\n\n执行后，代码返回如下：\n点击“Total Paragraphs”按钮，看看会发生什么。\n\
    你会看到如下弹出框：\n这意味着代码能够统计出我们拥有的段落数量。\n主要逻辑在于下面这一行：\n`var pgs=document. getElementsByTagName(\
    \ \"p\" );`\n我们将标签“p”作为参数传递给方法，该标签代表一个段落。共有三个带有标签“p”的元素，因此输出应为 4 个段落。\n\n下面是另一个示例：\n\
