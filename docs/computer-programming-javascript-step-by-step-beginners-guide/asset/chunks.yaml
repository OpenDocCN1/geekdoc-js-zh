  trans: "\n\n你会得到 `\"55\"`。这是因为用引号将 `5` 括起来后，你告诉解释器要将 `5` 视为字符串，而不是数字。于是加法运算符不再将两个数字相加，而是将两个字符串拼接在一起。现在试着去掉引号，观察输出如何变为\
    \ `10`。不同的数据类型可以执行不同的操作，因此了解该使用哪种类型至关重要：\n\n1. **字符串** – 任何用引号括起来的内容都会成为字符串。它可以包含字母、空格、数字、标点符号以及其他符号的组合。没有字符串，你将无法获取用户的姓名、地址、电子邮件以及其他重要信息。\n\
    \n2. **数字** – 不言自明；数字是可以进行加、减、乘、除等数学运算的数据。记住不要加引号，否则它们会变成字符串！\n\n到目前为止，我们已经掌握了字符串和数字，但还记得你尝试确认对话框时控制台的输出吗？每当你按下“确定”，控制台返回\
    \ `true`，而按下“取消”时，控制台返回 `false`。这些输出没有被引号包围，但它们显然不是数字，那么它们到底是什么呢？\n\n3. **布尔值**\
    \ – 布尔值是只能为 `true` 或 `false` 的数据类型。它与字符串或数字不同，因为它能帮助计算机根据是否满足某些条件来做出决策。例如，如果你想阻止未成年人注册你的网站，你需要编写某种代码来区分未成年人和成年人，比如：\n\
    \n```\nvar age = 17\nage >= 18\n```\n\n然后控制台返回 `false`，因为年龄小于 18。现在尝试以下数学表达式，看看你会得到什么：\n\
    \n```\n5 > 10\n```\n\n```\n6 < 12\n```\n\n第一行应返回 `false`，而第二行应返回 `true`。\n\n##\
    \ 比较运算符\n\n到目前为止，我们已经讨论了三种数据类型（数字、字符串和布尔值），以及一些基本的数学运算符（`+`、`-`、`*`、`/`）。然而，你刚才用来测试布尔值的是比较运算符（`<`、`>`、`=`），它们在控制程序流程中极其重要。以下是完整的列表及其功能：\n\
    \n- `>` 大于\n- `<` 小于\n- `>=` 大于或等于\n- `<=` 小于或等于\n- `==` 等于\n- `!=` 不等于\n\n为了测试这些运算符，请在以下语句中将\
    \ `@` 符号替换为正确的运算符，以使控制台输出 `true`：\n\n```\nconsole.log(5 @ 1);\nconsole.log(1 @\
    \ 5);\nconsole.log(5 @ 2);\nconsole.log(1 @ 6);\nconsole.log(5 @ 5);\nconsole.log(10\
    \ @ 5);\n```\n\n## 了解解释器的思维\n\n注意 JavaScript 解释器只给出你输入命令的最新输出，因此如果你输入了三行代码，它们本应产生不同的输出：\n\
    \n```\n5 > 10\n6 < 12\n7 > 14\n```\n\n在控制台中同时执行它们，你只会得到最后一行的结果（`false`）。你可以改为逐行输入代码，以便查看每个命令的输出，但在处理较大代码块时会变得特别繁琐。当你处理更复杂的内容时，最终会遇到更多的错误和\
    \ bug。这时，你需要了解你给出的特定命令发生了什么，以便精确定位问题所在。\n\n`console.log()` 会获取你放在其中的任何代码，并将其执行结果记录到控制台。既然如此，让我们看看\
    \ `console.log()` 的实际应用：\n\n```\nconsole.log(5 > 10)\nconsole.log(6 < 12)\nconsole.log(7\
    \ > 14)\n```\n\n现在你可以看到每一行代码的输出！\n\n## 流程控制\n\n你现在已经了解了最基本的数据类型、数学运算符、比较运算符以及一些巧妙的控制台技巧。然而，为了让它们发挥作用，我们需要能够控制命令的执行流程。例如，如果你想创建一个用户注册表单，要求用户输入姓名、电子邮件地址、年龄和密码，你首先需要声明变量：\n\
    \n```\nvar name;\nvar email;\nvar age;\nvar password;\n```\n\n现在我们需要存储用户的输入。目前，我们使用\
    \ `prompt` 函数：\n\n```\nname = prompt('What’s your name?');\nemail = prompt('What’s\
    \ your email?');\nage = prompt('What’s your age?');\npassword = prompt('Please\
    \ enter your desired password: ');\n```\n\n假设你在数据字段中输入了正确类型的信息，那么 `name`、`email`、`age`\
    \ 和 `password` 变量现在拥有了可以处理和存储的正确数据类型。然而，如果用户将电子邮件字段留空，或者在年龄字段中输入了字母，该怎么办？我们不能在关键信息字段没有正确数据类型的情况下让程序继续运行，因此我们使用流程控制语句。我们将讨论的第一个语句是\
    \ `if` 语句。\n\n### If 语句\n\n如果你之前已经编程过，JavaScript 中 `if` 语句的结构应该与你熟悉的几乎相同：\n\n\
    ```\nif (<condition>){\n  <action>\n}\n```\n\n如果你之前没有编程过，`if` 语句基本上告诉计算机：如果 `if`\
    \ 条件为 `true`，则执行花括号（`{}`）内的内容。例如，如果我们想阻止用户输入空白字段，可以这样做：\n\n```\nname = prompt('What’s\
    \ your name?');\nif (name.length == 0){\n  name = prompt('You cannot leave this\
    \ empty. What’s your name?');\n}\nemail = prompt('What’s your email?');\nif (email.length\
    \ == 0){\n  email = prompt('You cannot leave this empty. What’s your email address?');\n\
    }\nage = prompt('What’s your age?');\nif (age.length == 0){\n  age = prompt('You\
    \ cannot leave this empty. What’s your age?');\n}\npassword = prompt('Please enter\
    \ your desired password: ');\nif (password.length == 0){\n  password = prompt('You\
    \ cannot leave this empty. Please enter your desired password:');\n}\n```\n\n\
    对于初次编程的人来说，这段代码可能看起来令人不知所措，但当你仔细阅读每一行时，你会发现它们遵循着相当清晰且合乎逻辑的结构：\n\n1. 首先，由于 `prompt()`\
    \ 函数会返回用户输入的任何内容，你将字符串存储在一个变量中，以便稍后在程序中使用。\n2. `if` 语句通过检查长度是否等于零来判断变量是否为空。\n\
    \   a. 如果长度等于零，则再次请求输入。\n   b. 如果长度不等于零，则不再请求输入。\n\n请注意，此示例代码仅用于说明 `if` 语句的工作原理。在任何情况下都不应持续使用\
    \ `prompt()` 函数来向用户询问信息。\n\n现在，如果你希望在第一个条件不满足时执行其他操作，该怎么办？例如，如果用户输入了有效的姓名，你想说\
    \ `\"Your name is <name>. Got it!\"` 怎么办？那么我们可以添加一个 `else` 条件，后面跟着第二对花括号，其中包含第二组命令：\n\
    \n```\nname = prompt('What’s your name?');\nif (name.length == 0){\n  name = prompt('You\
    \ cannot leave this empty. What’s your name?');\n} else {\n  alert('Your name\
    \ is ' + name + '. Got it!');\n}\nemail = prompt('What’s your email?');\nif (email.length\
    \ == 0){\n  email = prompt('You cannot leave this empty. What’s your email address?');\n\
    } else {\n  alert('Your email is ' + email + '. Got it!');\n}\nage = prompt('What’s\
    \ your age?');\nif (age.length == 0){\n  age = prompt('You cannot leave this empty.\
    \ What’s your age?');\n} else {\n  alert('Your age is ' + age + '. Got it!');\n\
    }\npassword = prompt('Please enter your desired password: ');\nif (password.length\
    \ == 0){\n  password = prompt('You cannot leave this empty. Please enter your\
    \ desired password:');\n} else {\n  alert('Your password is ' + password + '.\
    \ Got it!');\n}\n```\n\n"
- fmt: "\nNow your code sounds a little more human, as it responds better to user\
    \ input. Try messing around with the code and see how the interpreter changes\
    \ the output depending on the conditions met with the `if-else` statements.\n\n\
    ## Debugging\n\nSo far, you’ve managed to play around with variables, data types,\
    \ mathematical operators, comparison operators, user prompts, confirmation dialogues,\
    \ and alerts, and lastly, `if-else` statements. Don’t worry if you make a couple\
    \ of mistakes; computers are intrinsically literal and will not tolerate the tiniest\
    \ syntactical mistakes. That being said, here are a couple of codes that don’t\
    \ seem to work as intended. Change the following code snippets so that you can\
    \ produce the appropriate output!\n\n```\nvar name = \"Chris\";\nalert('Hi ' +\
    \ 'name' + '! It’s nice to meet you.');\n```\n\nIn this code snippet, the output\
    \ is supposed to be \"Hi Chris! It’s nice to meet you.\" What’s the current output\
    \ and what do you think is wrong with the code? Notice that the console doesn’t\
    \ complain and throw you an error message when you execute this code. This kind\
    \ of problem is called a 'bug,' because while the JavaScript interpreter sees\
    \ nothing wrong with this code, it doesn’t work as the creator intended.\n\nNow\
    \ try to correct this code snippet that contains both bugs and errors:\n\n```\n\
    var name;\nvar age;\nname = prompt('What’s your name?');\nif (name.length = 0);\n\
