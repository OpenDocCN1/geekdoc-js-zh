    ## Decision Making and Loops


    ES6 has support for the following Decision Making and Loop commands.


    - `If` statement - This is used to evaluate an expression and then execute statements
    accordingly.

    - `If…else` statement - This is used to evaluate an expression and then execute
    statements accordingly. Then execute another set of statements if the Boolean
    expression evaluates to false.

    - `Nested if` statements - This is useful to test multiple conditions.

    - `Switch…case` statement - This evaluates an expression, matches the expression’s
    value to a case clause, and executes the statements associated with that case.

    - `For` loop - Here a set of statements are executed `n` number of times.

    - `While` loop - Here a set of statements are executed until a condition remains
    true.

    - `Do…while` loop - Here a set of statements are executed until a condition remains
    true. The difference from the while loop is that one execution of the statements
    will always occur.


    Let’s look at some examples of these statements.


    ### Example 58: The following program is an example of loops (if else) in ES6.


    ```

    var start=function(){const num=6;let num1=5;if(num<7){console.log("The value is
    less than 7");}else{console.log("The value is greater than 7");}}start();

    ```


    With this program, the output is as follows: “The value is less than 7”


    ### Example 59: The next program is an example of loops (for loop) in ES6.


    ```

    var start=function(){for(x=0;x<5;x++){console.log(x);}}start();

    ```


    With this program, the output is as follows: 01234


    ### Example 60: This program is an example of loops (while loop) in ES6.


    ```

    var start=function(){let x=0;while(x<5){console.log(x);x++;}}start();

    ```


    With this program, the output is as follows: 01234


    ## Classes


    ES6 also has the support for classes. A class can be defined as follows:


    ```

    class classname{constructor(parameters){//Assign values to the properties}// More
    methods}

    ```


    Where: `classname` is the name assigned to the class. We have a constructor that
    is called when an object is created. The constructor can take in parameters. These
    parameters can be used to assign values to the properties of the class. We can
    then have more methods defined in the class. Let’s look at an example of a simple
    class in ES6.


    ### Example 61: The following program shows how to use classes in ES6.


    ```

    var start=function(){class Rectangle{constructor(height, width) {this.height =
    height;this.width = width;}Display(){console.log(this.height);console.log(this.width);}}var
    newrect=new Rectangle(3,4);newrect.Display();}start();

    ```


    The following things can be noted about the above program: First we define a class
    called `Rectangle`. It accepts 2 parameters, namely `height` and `width`. This
    can be used to define the properties of `height` and `width` for the class. We
    then create a `Display` method that can be used to display the properties of the
    class. With this program, the output is as follows: 34.


    ## Collections


    ES6 also has the support for collections, such as the map collection. As an example,
    if we want to set the value of a map collection, we would use the `set` method
    as shown below:


    ```

    mapname.set(key,value);

    ```


    Where:


    - `mapname` is the name of the map.

    - `key` is the key assigned to the element.

    - `value` is the value associated with that key.


    ### Example 62: The program below shows how to use maps in ES6.


    ```

    var start=function(){var map = new Map();map.set(''keyA'',''valueA'');map.set(''keyB'',''valueB'');map.set(''keyC'',''valueC'');console.log(map.get("keyB"));}start();

    ```

