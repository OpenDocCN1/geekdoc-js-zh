    These data types represent either `true` or `false`. Through the use of `Boolean`,
    you can find out whether a JavaScript expression is `true` or `false`. The `true`
    returns are generally obtained from expressions with true values, such as number
    equations and similar expressions. In contrast, `false` returns are obtained from
    expressions without true values. Example 1: `(3 > 9)` Of course, this is false
    because 9 is definitely greater than 3. Example 2: `(2 < 3)` Obviously, the statement
    is `true`. There’s no need for an explanation on that one. Example 3: `(4 = 9)`
    A `ReferenceError` will occur on the third example. This is because in JavaScript
    language, and most computer programming language, the equal sign (`=`) is not
    a symbol of equality. The equal sign is used in assigning the values or elements
    of variables. See next image: When the correct JavaScript syntax was utilized,
    the expression returned with a `false` value because even with the correct sign,
    4 is still not equal to 9.


    ## 4. Objects


    Objects encompass all data types in the sense that numbers, Booleans, and strings
    can be objects. Data, such as arrays, regular expressions, dates and math are
    objects, as wellObjects contain many values and have properties (name:values pair)
    and methods (process or action). Thus, they are containers of named values. This
    name:values pair is called property (name) and property values (values). They
    can be a collection of various different data. Examples:


    *   student:  “Johnson”

    *   country:  “Sweden”

    *   street:  “Reed Avenue”

