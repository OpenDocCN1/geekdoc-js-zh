    \ initialize a new object of `RegExp` which stands for Regular Expression. The\
    \ pattern is passed as the first argument to the `RegExp` constructor and the\
    \ modifier as the second argument, note that the modifier argument here is optional\
    \ too.\n\nSyntax: `new RegExp(\"pattern\", \"modifiers\");` or `new RegExp(\"\
    pattern\");`\n\nIf this method is used, then the regular expression is compiled\
    \ at runtime, this method is generally used where regular expression is not a\
    \ constant.\n\n## Modifiers\n\nA modifier is used to change the way a match of\
    \ pattern based on regular expression is done. Listed below are the modifiers\
    \ and the details on how they affect the operation.\n\n*   `i` - Makes the match\
    \ case insensitive, by default matching done is with regular expressions is case\
    \ sensitive.\n*   `m` - Makes the match of pattern extend to multiple lines one\
    \ if there are more than one lines in the string that the match is being performed\
    \ on.\n*   `g` - By default, the operation stops after finding the first match\
    \ for the pattern, but if this modifier is used the operations don’t stop at the\
    \ first match and thus performs a ‘g’lobal match.\n\n## Simple patterns\n\nIf\
    \ you want to match a sequence of character directly, then you can write it in\
    \ the place of the pattern. For example, the regular expression `/test/` will\
    \ match any string with ‘test’ in it, so there would be a match for a string like\
    \ ‘this is a test, ’ but there would not be any match for string like ‘this is\
    \ a est’ because the character ‘t’ is missing from the sequence specified.\n\n\
    Certain characters denotes something special in a regular expression like `*`\
    \ or `.`, if you want to match these characters directly then you need to escape\
    \ them, i.e., add a backslash before them. So for matching the exact string ‘te*st’,\
    \ the regular expression will be `/te\\*st/`. You will learn about all the characters\
    \ with a special significance in regular expressions in the very next section.\n\
    \n## Special character(s)\n\nHere is a list of special character(s) that can be\
    \ used for a regular expression and what they do:\n\n*   `^`\n"
