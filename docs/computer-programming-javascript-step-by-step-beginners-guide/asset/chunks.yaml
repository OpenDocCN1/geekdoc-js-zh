    This form of expression is used to match exactly x occurrences of the preceding
    expression, where x is a positive integer. For example, the regular expression
    `/te{3}st/` will match the string ‘this is a teeest’ but won’t match the string
    ‘this is a test’ or the string ‘this is a teeeeest’.


