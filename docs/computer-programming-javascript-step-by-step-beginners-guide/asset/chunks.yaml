- fmt: '

    Selecting a group of elements means that the method will return more than one
    node. This collection of nodes is known as a `NodeList` and will be stored in
    an array-like item. Each node will be given an index number, starting with 0,
    while the order of the nodes will be the same order in which they appear on the
    page. Although `NodeLists` look like arrays and behave like arrays, semantically
    they are a type of object called a collection. As an object, a collection has
    its own properties and methods which are rather useful when dealing with a `NodeList`.


    The following example will select all `<li>` elements and assign their node references
    to the `schedule` variable.


    ```

    var schedule = document.getElementsByTagName("li");

    ```


    If we want to access each element separately, we can use an array syntax. For
    example:


    ```

    var item1 = schedule[0];var item2 = schedule[1];var item3 = schedule[2];

    ```


    However, when we select a group of items we usually want to interact with the
    whole group. As an example, let us assign the class attribute with the `"finished"`
    value to all `<li>` elements. For this purpose we can use a loop to go through
    each element in the `NodeList`.


    ```

    var schedule = document.getElementsByTagName("li");for (var i = 0; i < schedule.length;
    i++) {schedule[i].className = "finished";}

    ```


    Image 29. Changing the class attribute for all `<li>` elements


    Similarly to working with arrays, when working with collections we can use the
    `length` property to determine the size of the collection. We can then use this
    information in a `for` loop in order to effectively go through every `NodeList`
    item and assign the `"finished"` class attribute.


    We can use exactly the same logic for the `getElementsByClassName()` method. We
    will get a `NodeList` stored in a collection with each node having an index number.
    Like with the `getElementByTagName()` method, we can access individual items and
    manage the collection through its object properties and methods.


    ## Traveling Through the DOM


    When we use any of the previously discussed methods to select an element node,
    we can also select other elements in relation to this elements. This type of relative
    selection is considered as an element property.


    ### previousSibling & nextSibling


    The `previousSibling` and `nextSibling` properties refer to adjacent elements
    on the same DOM level. For example, if we select the second `<li>` element with
    the id value `"phase2"`, the `"phase1"` `<li>` element would be considered a `previousSibling`,
    while the `"phase3"` `<li>` element would be `nextSibling`. In the case where
    there is no sibling, (ex. the `"phase1"` element has no `previousSibling`), the
    value of this property remains `null`.


    In the following example we select the `<li>` element which has `"phase2"` as
    a value for its `id` attribute and we change the class attribute for both the
    selected element and its previous sibling.


    ```

    var secondstop = document.getElementById("phase2");var prevstop=secondstop.previousSibling;secondstop.className
    = "current";prevstop.className = "finished";

    ```


    ### Parents & Children


    We can also travel to different levels of the DOM hierarchy using the selected
    element as a starting point. If we want to move one level up we can use the `parentNode`
    property. For example, if we have the second `<li>` element selected we can refer
    to its parent element, the `<ul>` element, with the following syntax:


    ```

    var secondstop = document.getElementById("phase2");var upperelement = secondstop.parentNode;

    ```


    Alternatively, if we want to move one level down, we can use either the `firstChild`
    or the `lastChild` property. In the following example we have selected the `<ul>`
    element with `"partyplan"` as a value for its `id` attribute. Using the `firstChild`
    property we refer to the first `<li>` element of this list, while with the `lastChild`
    property we refer to the last `<li>` element of this list.


    ```

    var plan = document.getElementById("partyplan");var child1 = plan.firstChild;var
    child2 = plan.lastChild;

    ```


    ## Adding and Managing Content


    Until this point we discussed how to find elements in the DOM. The more interesting
    aspect are the approaches to managing content within the DOM.


    ### Changing HTML


    We already talked about the `textContent` property, but this property retrieves
    only text values and ignores the subsequent HTML structure. If we want to edit
    the page HTML we have to use the `innerHTML` property. This property can be used
    on any element node and it is capable of both retrieving and editing content.


    ```

    var liContent = document.getElementById("phase1").innerHTML;

    ```


    When retrieving the HTML from the `<li>` element with `"phase1"` as a value for
    its `id` attribute, `innerHTML` captures the whole content of the element, text
    and markup, as a string variable. If we apply the same syntax for the `<ul>` element,
    the `innerHTML` property will capture all of the `<li>` items.


    We can also use the `innerHTML` property to change the content of the element.
    If this content contains additional markup, these new elements will be processed
    and added to the DOM tree. For example, let us add the `<em>` tag to the first
    `<li>` item in the party list:


    ```

    var firstStop = document.getElementById("phase1");firstStop.innerHTML = "<em>20:00
    - Home warm-up</em>";

    ```


    Image 30. Adding an `<em>` element with content to the first list item


    ### DOM Manipulation


    A more direct technique to managing document content is to use DOM manipulation.
    This is a 3-step process that uses the following methods:


    1. `createElement()` - The process begins by creating a new element node with
    the `createElement()` method. This element node is stored in a variable and it
    is not yet a part of the DOM.


    2. `createTextNode()` - The process continues by creating a new text node with
    the `createTextNode()` method. Like in the previous step, this text node is stored
    in a variable and it is not a part of the document.


    3. `appendChild()` - The final step is adding the created element to the DOM tree
    with the `appendChild()` method. The element will be added as a child to an existing
    element. The same method can be used to add the text node to the element node.

    '
