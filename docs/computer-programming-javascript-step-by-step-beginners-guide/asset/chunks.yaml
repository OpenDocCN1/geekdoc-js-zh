    # Chapter 9. Operators, Data Types and Other Priorities


    ## JavaScript Calculations


    All programming languages allow you to perform calculations. You can use JS, in
    a sense, as a replacement pocket calculator. For example, enter the following:


    ```

    "use strict";console.log(3 + 4);

    ```


    Listing 5 `accompanying_files/03/examples/calc.js`


    As expected, you get 7 as your result.


    You can see a few key JS concepts just in this very small, simple example. `3
    + 4` is an expression. Expressions are one of the most important concepts in JS.
    Expressions characteristically have a return value — in this case, the number
    7. In turn, you can use return values in different places in your code, e. g.
    as an argument to a function call. Or to put this another way, JavaScript replaces
    expressions by their (return) values.


    ![00016.jpeg](rsrc1BR.jpg)


    ### Expressions


    #### Expressions in Firefox Web Console


    You can also enter expressions directly into Firefox Web Console. Try entering
    `3 + 4` in the input line (next to the double arrow ") ().


    ![00017.jpeg](rsrc1C0.jpg)


    Entering expressions directly in console — input


    After you confirm your input with Return, the console will immediately display
    the return value ().


    ![00018.jpeg](rsrc1C7.jpg)


    Entering expressions directly in console — output


    FYI, you can also use Shift-Return to input a multi-line statement, i. e. a single
    statement which runs over multiple lines. The entire statement is executed only
    after you hit return.


    Alternatively, you can also select parts of expressions in Scratchpad and examine
    these using Inspect (Ctrl-I / Cmd-I). As you see in , Scratchpad displays the
    result of `4 * 2` as value: 8 in the side panel to the right.


    ![00019.jpeg](rsrc1CD.jpg)


    Inspect a selected (partial) expression in Scratchpad


    ### Notation


    From now on, we''ll often point out a value returned by some expression or which
    appears at the console. To do this, we''ll insert a comment in the code and show
    the value in front of a `=>` — the so-called fat arrow.


    Example


    ```

    3 + 4 // => 7

    console.log(3 + 4 * 2); //=> 11

    ```


    ### JavaScript as a Pocket Calculator: Arithmetic Operators


    In addition to multiplication and addition operators, JS has corresponding operators
    for the arithmetic operations of subtraction, division and modulus. All of these
    operators fall under the group of so-called arithmetic operators:


    | Symbol | Operation |

    |--------|-----------|

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus — remainder of an integer division |

    | ** | Exponentiation (ECMAScript 2016+) |


    Table Arithmetic operators


    Example


    * `5 + 4` returns 9

    * `5 - 4` returns 1

    * `5 * 4` returns 20

    * `5 / 4` returns 1.25

    * `10 % 3` returns 1 since `10 - 3 * 3 = 1`.

    * `5 ** 4` returns 625 since `5 * 5 * 5 * 5 = 625`.


    #### Exercise 3: 2000 Seconds


    How many minutes and remainder seconds are there in 2000 seconds? Use `console.log`
    to print out the answer.


    Tips: The easiest way to solve this exercise is to use the modulus operator. Right
    now, we haven''t taught you how to remove decimal places; we''ll come back to
    that later.


    ## Characters and Strings


    Have you noticed anything about how numbers and text are coded differently? The
    "Hello world" at the beginning of the previous lesson was written out in quotation
    marks, while numbers were not. A text element is written out within quotation
    marks, and actually involves stringing or linking individual characters together
    — giving us the programming term string to indicate such text.


    ### Two Types of Quotation Marks


    You may use both single quotes or double quotes to delimit a string, but the marks
    at the beginning and at the end of the string must be the same.


    Example


    * `"Some text string"` is allowed

    * `''Some text string''` is also allowed

    * `"Some text string''` is invalid


    Most JS developers consistently use double quotes, and only use single quotes
    in exceptional cases, e. g. when they need to use double quotes within a string
    to indicate literal wording.


    ### Coding Guidelines


    You should normally use double quotes to delimit strings.


    ### Determining Length


    Sometimes you need to know how long a string is — i. e. how many characters are
    in it. As you do more and more development, you''ll come across many situations
    where length is important.


    For example, blogs, lists of products, and similar items sometimes provide a text
    preview which only shows part of the entire text. Before generating this preview,
    the length of the entire text item must first be measured to see whether the text
    actually needs to be shortened.


    So at this point, we''d like to introduce you to the string property `length`.
    You can have a string return this property by typing `.length` after the string.


    ```

    "length matters - sometimes".length // => 26

    ```


    Then pack your statement into a `console.log` so you can see the response you
    need on the console:


    ```

    "use strict";

    console.log("length matters - sometimes".length);

    ```


    Listing 6 `accompanying_files/03/examples/length.js`


    #### Exercise 4: Lucky Numbers & Name Codes


    Do you know about lucky numbers and code names? Here''s an interesting way to
    come up with a name code:


    Multiply the length of your first name (including your middle name(s) if you want)
    by the length of your last name and print out the result in the console. (Just
    to let you know, these are the numbers we got: 40 and 30.)


    ## Literals: They Say What They Mean


    Now that you''ve been introduced to strings and numbers, there''s another important
    concept we need to tell you about: Basically, any value — whether a string or
    a number — which is specified literally in your code is known as a (you guessed
    it) literal. Literals always have a fixed value.


    Examples


    * `42`

    * `"house"`

    * `"green"`

    * `5.47`

    * `1998`

    * `"Please enter your name"`


    ## Number & String Data Types


    JavaScript literals have a so-called data type. As the term implies, a data type
    specifies what kind of data the literal represents, and in turn its possible values.


    Up to this point, we''ve used the following data types:


    | Data Type | Permissible Values / Meaning | Example of Literal |

    |-----------|------------------------------|--------------------|

    | String | Any text | `"Hello"` |

    | Number | Any positive or negative number | `246.5` |

