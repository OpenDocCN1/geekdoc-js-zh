    \   产生此输出的代码行是：\n   `document.write(operand1 + \" + \" + operand2 + \" = \" +\
    \ (operand1 + operand2));`\n7) 演示对 `operand1` 使用递增运算符，对 `operand2` 使用递减运算符。显示结果。\n\
