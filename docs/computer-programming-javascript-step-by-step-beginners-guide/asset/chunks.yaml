  trans: "\n\n2. `setInterval (method, time)` - 该方法会在 `time` 毫秒后调用指定的方法。\n\n使用 JavaScript，可以设置\
    \ DOM 对象的某些属性，例如其在屏幕上的位置。对象的位置可以通过 `top` 和 `left` 属性来设置。示例如下：\n\n```\n// 设置距离屏幕左边缘的距离。object.style.left\
    \ = 以点或像素为单位的距离；    或// 设置距离屏幕顶部边缘的距离。object.style.top = 以点或像素为单位的距离；\n```\n\n\
    ## 手动动画\n\n在以下示例中，我们将让图像向右移动：\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar image = null;\nfunction init () {\n    image = document.getElementById('myImage');\n\
    \    image.style.position = 'relative';\n    image.style.left = '0px';\n}\nfunction\
    \ moveImage () {\n    image.style.left = parseInt(image.style.left) + 10 + 'px';\n\
    }\nwindow.onload = init;\n</script>\n</head>\n<body>\n<form>\n<img id=\"myImage\"\
    \ src=\"house.jpg\" />\n<p> 点击按钮移动图像</p>\n<input type=\"button\" value=\"移动图像\"\
    \ onclick=\"moveImage();\" />\n</form>\n</body>\n</html>\n```\n\n在以下行中，你应该使用自己图像的正确名称：`<img\
    \ id=\"myImage\" src=\"house.jpg\" />`。在我的例子中，我有一张名为 house 的 .jpg 图像。运行代码后，会得到如下结果：\n\
    \n点击“移动图像”按钮。每次点击，图像都会向右移动。效果如下所示：\n\n考虑脚本中的这一行：`image = document.getElementById('myImage');`。我们通过图像的\
    \ ID 获取它，然后将其赋值给 `image` 变量。`init()` 方法帮助我们设置图像在窗口中的初始位置。该方法会在窗口加载时被调用。`moveImage()`\
    \ 函数会在每次点击后将图像向右移动 10 像素。如果要让图像向左移动，应将值设为负数。在这种情况下，动画是手动的，因为我们需要点击按钮。\n\n## 自动动画\n\
    \n要实现元素的自动动画，我们可以使用 JavaScript 提供的 `setTimeout()` 函数。\n\n示例：\n\n```html\n<script\
    \ type=\"text/javascript\">\nvar image = null;\nvar animate;\nfunction init ()\
    \ {\n    image = document.getElementById('myImage');\n    image.style.position\
    \ = 'relative';\n    image.style.left = '0px';\n}\nfunction animateImage () {\n\
    \    image.style.left = parseInt(image.style.left) + 10 + 'px';\n    animate =\
    \ setTimeout(animateImage, 20);\n}\nfunction stopAnimation () {\n    clearTimeout(animate);\n\
    \    image.style.left = '0px';\n}\nwindow.onload = init;\n</script>\n</head>\n\
    <body>\n<form>\n<img id=\"myImage\" src=\"house.jpg\" />\n<p> 点击“动画”按钮启动动画</p>\n\
    <input type=\"button\" value=\"动画\" onclick=\"animateImage();\" />\n<input type=\"\
    button\" value=\"停止\" onclick=\"stopAnimation();\" />\n</form>\n```\n\n执行代码后返回如下结果：\n\
    \n点击“动画”按钮，动画开始。当点击“停止”按钮时，动画停止。\n\n`animateImage()` 方法调用了 `setTimeout` 方法，该方法每隔\
    \ 20 毫秒设置一次图像的位置。这将导致图像产生动画效果。`stopAnimation()` 方法用于清除由 `setTimeout()` 方法设置的计时器。对象（即图像）被重置回其初始位置。\n\
    \n## 鼠标悬停效果\n\n我们可以使用鼠标图像在 JavaScript 中实现图像悬停效果。当鼠标移动到图像上时，它会变成另一张图像。\n\n示例：\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nif(document.images)\
    \ {\n    var img1 = new Image();\n    img1.src = \"ps.jpg\";\n    var img2 = new\
    \ Image();\n    img2.src = \"house.jpg\";\n}\n</script>\n</head>\n<body>\n<p>\
    \ 将鼠标移上来实现悬停效果</p>\n<a href=\"#\" onMouseOver=\"document.img.src=img2.src;\" onMouseOut=\"\
    document.img.src=img1.src;\">\n<img name=\"img\" src=\"nicsam.jpg\" />\n</a>\n\
    </body>\n</html>\n```\n\n我们使用了 `if` 语句来检查图像是否存在。我们使用了 `Image()` 构造函数来预加载一个名为 `img1`\
    \ 的新对象。同样地，也预加载了第二张图像 `img2`。`src` 被赋予外部存储的图像名称。`#` 用于禁用链接，这样点击后不会打开 URL。当鼠标光标移动到图像上时，会调用\
    \ `onMouseOver` 方法。当鼠标光标移出图像时，会调用 `onMouseOut` 方法。\n\n# 第 8 章 子句\n\n## GROUP BY\
    \ 子句\n\n`GROUP BY` 子句将指定列中具有数据的所有行收集在一起。它还会允许我们之前讨论的聚合函数在这些列上执行。最好通过一个例子来解释：\n\
    \nGROUP BY 子句语法：\n\n```\nSELECT column1,\nSUM(column2)\nFROM \"list-of-tables\"\
    \nGROUP BY \"column-list\";\n```\n\n假设你想检索每个独立部门支付的最高薪资数据。你的语句如下：\n\n```\nSELECT\
    \ max(salary), dept\nFROM employee\nGROUP BY dept;\n```\n\n该语句将按名称显示每个唯一部门中的最高薪资。简而言之，每个部门中薪资最高的人员姓名将与其薪资和所在部门一起显示。\n\
    \n## HAVING 子句\n\n`HAVING` 子句允许你为每个特定组指定行的条件，换句话说，根据你输入的具体条件选择某些行。如果使用 `HAVING`\
    \ 子句，它应始终跟在 `GROUP BY` 子句之后：\n\nHAVING 子句语法：\n\n```\nSELECT column1,\nSUM(column2)\n\
    FROM \"list-of-tables\"\nGROUP BY \"column-list\"\nHAVING \"condition\";\n```\n\
    \n最好通过一个例子来展示 `HAVING` 子句。假设你有一个表，其中包含员工姓名、所在部门、薪资和年龄。假设你想找出每个独立部门中每位员工的平均薪资，你可以输入：\n\
    \n```\nSELECT dept, avg(salary)\nFROM employee\nGROUP BY dept;\n```\n\n但现在假设你只想计算平均薪资，并且仅当薪资超过\
    \ 20,000 美元时才显示。你的语句如下：\n\n```\nSELECT dept, avg(salary)\nFROM employee\nGROUP\
    \ BY dept\nHAVING avg(salary) > 20000;\n```\n\n## ORDER BY 子句\n\n`ORDER BY` 子句是可选的，它允许你按排序顺序（升序或降序）显示查询结果，排序依据是你选择用于排序数据的列。\n\
    \nORDER BY 子句语法：\n\n```\nSELECT column1, SUM(column2) FROM \"list-of-tables\"\
    \ ORDER BY \"column-list\" [ASC | DESC];\n```\n\n* `[ ]` = 可选\n\n该语句将显示你指定的表（本例中为\
    \ `employee_info` 表）中的员工 ID、部门、姓名、年龄和薪资，其中部门等于 SALES。结果将按薪资升序排列：\n\n* `ASC` =\
    \ 升序 - 默认\n* `DESC` = 降序\n\n例如：\n\n```\nSELECT employee_id, dept, name, age, salary\
    \ FROM employee_info WHERE dept = 'Sales' ORDER BY salary;\n```\n\n如果要从多个列排序数据，每个列名必须用逗号分隔：\n\
    \n```\nSELECT employee_id, dept, name, age, salary\nFROM employee_info\nWHERE\
    \ dept = 'Sales'\nORDER BY salary, age DESC;\n```\n\n"
