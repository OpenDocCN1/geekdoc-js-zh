    # 第 10 章 文档对象模型（DOM）


    `document` 对象是浏览器为每个新 HTML 页面创建的对象。创建后，JavaScript 允许我们访问该对象的许多属性和方法，这些属性和方法可以以各种方式影响文档，例如管理或更改信息。事实上，我们一直在使用该对象的一个方法
    `document.write()` 来在网页中显示内容。不过，在探索属性和方法之前，我们首先来看一下文档对象模型（DOM）。


    ## DOM 基本概念


    我们知道，当 Web 浏览器接收到 HTML 文件时，它会将其连同所有附带文件（如图像和 CSS 样式）一起显示为屏幕上的网页。然而，浏览器还会根据其 HTML
    结构创建该 Web 文档的一个模型。这意味着所有标签、它们的属性以及它们出现的顺序都会被浏览器记住。这种表示称为文档对象模型（DOM），它用于向 JavaScript
    提供如何与网页元素通信的信息。此外，DOM 还提供了可用于导航或修改 HTML 代码的工具。


    文档对象模型是由万维网联盟（W3C）定义的标准，大多数浏览器开发者都使用该标准。为了更好地理解 DOM，我们先来看一个非常简单的网页：


    ```

    <!doctype html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Party Schedule</title>

    <style type="text/css">

    .current {color:red;}

    .finished {color:green;}

    </style>

    </head>

    <body>

    <h1 id="partytitle">Party Plan</h1>

    <ul id="partyplan">

    <li id="phase1">20:00 - Home warm-up</li>

    <li id="phase2">22:00 - Joe''s Bar</li>

    <li id="phase3">00:00 - Nightclub 54</li>

    </ul>

    </body>

    </html>

    ```


    在网页中，标签会包裹其他标签。`<html>` 标签包裹 `<head>` 和 `<body>` 标签。`<head>` 标签包裹诸如 `<title>`、`<meta>`
    和 `<script>` 等标签。`<body>` 包裹所有内容标签，如 `<p>`、`<h1>` 到 `<h6>`、`<ul>`、`<table>` 等。


    标签之间的这种关系可以用树形结构来表示，其中 `<html>` 标签充当树的根，而其他标签则根据文档中的标签层级表示不同的树分支结构。除了标签之外，Web
    浏览器还会记住标签的属性以及标签内的文本内容。在 DOM 中，这些项目（标签、属性和文本）都被视为独立的单元，称为节点。


    **图 26.** HTML 文档的树形结构


    在我们这个基本 HTML 页面的树形结构中，`<html>` 元素充当根元素，而 `<head>` 和 `<body>` 元素是节点。在定义这种关系时，我们也可以将
    `<html>` 称为父节点，将 `<head>` 和 `<body>` 元素称为子节点。反过来，`<head>` 和 `<body>` 元素也包含子节点，依此类推。当我们到达一个不包含其他子节点的项目时，我们就在该节点处终止树形结构，该节点也称为叶节点。


    ## 选择文档元素


    有了 DOM 结构，JavaScript 可以通过几种不同的方式访问文档中的元素，具体取决于我们是选择单个元素还是多个元素。在所有方法中，我们首先必须定位代表我们需要访问的元素的节点，然后使用该节点的内容、子元素和属性。


    ### 选择单个元素


    要选择单个元素，我们最常使用 `getElementById()` 方法。该方法允许我们选择其 HTML 标签上应用了特定 ID 属性的元素。如果我们遵循页面中每个元素的
    ID 属性都是唯一的这一假设，那么该方法是访问元素最有效的方式。在以下示例中，我们将访问 ID 属性值为 `''phase1''` 的元素：


    ```

    var firststop = document.getElementById("phase1");

    ```


    在 `document` 对象上使用 `getElementById()` 方法意味着我们在页面上的任何位置搜索具有此 ID 的元素。一旦访问到 `''phase1''`
    元素（在我们的例子中是第一个 `<h1>` 元素），对该节点的引用就会存储在 `firststop` 变量中，我们就可以使用 JavaScript 进行更改。例如，我们将为此元素分配一个值为
    `''current''` 的 class 属性。我们将此代码包含在文档 `<head>` 部分的 `<script>` 标签中。


    ```

    var firststop = document.getElementById("phase1");

    firststop.className = "current";

    ```


    **图 27.** 更改页面元素的样式


    **注意：** 在某些浏览器中，我们必须将 `<script>` 标签放在结束的 `</body>` 标签之前，或者放在外部的 `.js` 文件中，才能使本章中的代码正常工作。


    如果我们想从节点中获取文本，可以使用 `textContent` 属性。更重要的是，我们还可以使用 `textContent` 属性来更改节点的内容。在以下示例中，我们首先选择
    `id` 属性值为 `''partytitle''` 的元素，并将其赋值给 `title` 变量。然后，通过更改 `title` 变量的 `textContent`
    属性，我们实际上更改了该元素的文本。让我们将以下行添加到我们的 JavaScript 代码中：


    ```

    var title = document.getElementById("partytitle");

    title.textContent = "Party Schedule";

    ```


    **图 28.** 更改页面元素的内容


    ### 选择组元素


    虽然有时选择单个元素就足够了，但其他时候我们可能需要选择一组元素。例如，我们可能需要选择页面上的所有 `<li>` 标签，或者所有共享某个 class 属性的元素。在这些情况下，JavaScript
    提供了以下两种方法：


    *   `getElementsByTagName()` —— 该方法允许我们选择特定标签的每个实例。

    *   `getElementsByClassName()` —— 该方法检索所有共享特定类名的元素。


