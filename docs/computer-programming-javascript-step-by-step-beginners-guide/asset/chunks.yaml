    \ for h2 tags: \"+ h2count . length );\n  }\n  function countheader3(){\n  var\
    \ h3count=document. getElementsByTagName( \"h3\" );\n  alert( \"Total count for\
    \ h3 tags: \"+ h3count . length );\n  }\n  </script>\n  <h2> A h2 tag</h2>\n \
    \ <h2> A h2 tag</h2><h2> A h2 tag</h2><h2> A h2 tag</h2><h3> A h3 tag</h3>\n \
    \ <h3> A h3 tag</h3>\n  <h3> A h3 tag</h3><h3> A h3 tag</h3><h3> A h3 tag</h3><button\
    \ onclick=\"countheader2()\"> Total h2</button>\n  <button onclick=\"countheader3()\"\
    > Total h3</button>\n  </body></html>\n```\n\n执行后，代码返回如下输出：\n我们总共有 4 个 h2 标签和\
    \ 5 个 h3 标签。点击“Total h2”按钮，看看会发生什么。\n你应该会得到如下弹出框：\n点击“Total h3”按钮，看看会发生什么。\n你应该会得到如下弹出框：\n\
    \n## innerHTML\n\n该属性可用于向 HTML 页面添加动态内容。当需要生成动态内容（如评论表单、注册表单等）时，会在 HTML 页面上使用它。\n\
    请看以下示例：\n\n```\n<html><body><script type=\"text/javascript\">\n  function displayform()\
    \ {\n  var data = \"Username:<br><input type='text' name='name'><br>Comment:<br><textarea\
    \ rows='6' cols='45'></textarea><br><input type='submit' value='Contact us'>\"\
    ;\n    document. getElementById( 'area' ). innerHTML= data;\n  }\n  </script>\n\
    \  <form name=\"form1\">\n  <input type=\"button\" value=\"Contact us\" onclick=\"\
    displayform()\" >\n  <div id=\"area\"></div>\n  </form>\n  </body></html>\n```\n\
    \n执行后，代码返回如下按钮：\n点击按钮，看看会发生什么。你会得到如下结果：\n我们所做的是在用户点击按钮后创建一个“联系我们”表单。注意，HTML 表单是在我们创建并命名为\
    \ `area` 的 div 内部生成的。为了定位位置，我们调用了 `document.getElementById()` 方法。\n\n## innerText\n\
    \n我们可以使用该属性向 HTML 页面添加动态文本。注意，使用该属性时，你的文本会被解释为普通文本，而不是 HTML 内容。一个很好的应用场景是，当你需要根据密码长度写出密码强度、写出验证消息等时。\n\
    例如：\n\n```\n<html><body><script type=\"text/javascript\">\n  function validatePass()\
    \ {\n  var message;\n  if(document. form1. userPass. value. length> 5 ){\n  message=\
    \ \"good\" ;\n  }\n  else{\n  message= \"poor\" ;\n  }\n  document. getElementById(\
    \ 'area' ). innerText= message;\n  }\n  </script>\n  <form name=\"form1\">\n \
    \ <input type=\"password\" value=\"\" name=\"userPass\" onkeyup=\"validatePass()\"\
    \ >\n  Strength:<span id=\"area\"> Pasword strength </span>\n  </form>\n  </body></html>\n\
    ```\n\n执行后，代码返回如下：\n开始输入密码，看看输入时输入字段右侧的文本会发生什么变化。如果你输入的密码少于 5 个字符，消息将变为“poor”，如下所示：\n\
    继续输入密码，直到超过 5 个字符。你会看到消息变为“good”，如下所示：\n这就是该属性的强大之处。\n\n## 动画\n\n使用 JavaScript，我们可以对元素进行动画处理。我们可以使用\
    \ JavaScript 根据某个方程在页面上移动诸如 `<img />`、`<div>` 等元素。以下是 JavaScript 中用于动画的常用方法：\n\
    \n1.  `setTimeout(method, time)` - 该方法将在指定的毫秒数后调用指定的方法。\n\n"
- fmt: "\n2. `setInterval (method, time)` - the method will call the method after\
    \ `time` milliseconds.\n\nWith JavaScript, one can set some attributes of the\
    \ DOM object such its position on the screen. The position of the object can be\
    \ set using `top` and `left` attributes. This is demonstrated below:\n\n```\n\
    // Set the distance from the left edge of the screen.object. style. left = distance\
    \ measures in points or pixels;     or// Set the distance from the top edge of\
    \ screen.object. style.top = distance measures in points or pixels;\n```\n\n##\
    \ Manual Animation\n\nIn the following example, we will be animating the image\
    \ towards the right:\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar image = null;\nfunction init () {\n    image = document.getElementById('myImage');\n\
    \    image.style.position = 'relative';\n    image.style.left = '0px';\n}\nfunction\
    \ moveImage () {\n    image.style.left = parseInt(image.style.left) + 10 + 'px';\n\
    }\nwindow.onload = init;\n</script>\n</head>\n<body>\n<form>\n<img id=\"myImage\"\
    \ src=\"house.jpg\" />\n<p> Click the button to move the image</p>\n<input type=\"\
    button\" value=\"Move Image\" onclick=\"moveImage();\" />\n</form>\n</body>\n\
    </html>\n```\n\nYou should use the correct name of your image in the following\
    \ line: `<img id=\"myImage\" src=\"house.jpg\" />`. In my case, I have a .jpg\
    \ image named house. When I run the code, it returns the following:\n\nClick the\
    \ “Move Image” button. The image should move to the right with each click. This\
    \ is shown below:\n\nConsider the following line in the script: `image = document.getElementById('myImage');`.\
    \ We are getting the image using its ID, then it is assigned to the `image` variable.\
    \ The `init()` method helps us set the initial position of the image on the window.\
    \ The method will be called when the window is being loaded. The `moveImage()`\
    \ function will move the image towards the right by 10 pixels after every click.\
    \ To move the image towards the left, the value should be set as negative. The\
    \ animation, in this case, is manual as we have to click a button.\n\n## Automated\
    \ Animation\n\nTo automate the process of animating an element, we can use the\
    \ `setTimeout()` function provided by JavaScript.\n\nExample:\n\n```html\n<script\
    \ type=\"text/javascript\">\nvar image = null;\nvar animate;\nfunction init ()\
    \ {\n    image = document.getElementById('myImage');\n    image.style.position\
    \ = 'relative';\n    image.style.left = '0px';\n}\nfunction animateImage () {\n\
    \    image.style.left = parseInt(image.style.left) + 10 + 'px';\n    animate =\
    \ setTimeout(animateImage, 20);\n}\nfunction stopAnimation () {\n    clearTimeout(animate);\n\
    \    image.style.left = '0px';\n}\nwindow.onload = init;\n</script>\n</head>\n\
    <body>\n<form>\n<img id=\"myImage\" src=\"house.jpg\" />\n<p> Click the Animate\
    \ button to launch animation</p>\n<input type=\"button\" value=\"Animate\" onclick=\"\
    animateImage();\" />\n<input type=\"button\" value=\"Stop\" onclick=\"stopAnimation();\"\
    \ />\n</form>\n```\n\nThe code returns the following upon execution:\n\nClick\
    \ the “Animate” button. The animation should start. When you click the Stop button,\
    \ the animation will stop.\n\nThe `animateImage()` method is calling the `setTimeout`\
    \ method which sets the position of the image after every 20 milliseconds. This\
    \ will result in the animation of the image. The `stopAnimation()` method helps\
    \ in clearing the timer which is set by the `setTimeout()` method. The object,\
    \ which is the image, is set back to its initial position.\n\n## Rollover\n\n\
    We can use a mouse image to rollover an image in JavaScript. Once you move the\
    \ mouse over the image, it will change to another image.\n\nExample:\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\">\nif(document.images) {\n   \
    \ var img1 = new Image();\n    img1.src = \"ps.jpg\";\n    var img2 = new Image();\n\
    \    img2.src = \"house.jpg\";\n}\n</script>\n</head>\n<body>\n<p> Move mouse\
    \ over to rollover</p>\n<a href=\"#\" onMouseOver=\"document.img.src=img2.src;\"\
    \ onMouseOut=\"document.img.src=img1.src;\">\n<img name=\"img\" src=\"nicsam.jpg\"\
    \ />\n</a>\n</body>\n</html>\n```\n\nWe have used the `if` statement to check\
    \ whether the image exists or not. We have used the `Image()` constructor so as\
    \ to preload some new object named `img1`. The same has also been done to preload\
    \ the second image, `img2`. The `src` is given the name of the image stored externally.\
    \ The `#` helps to disable the link so that a URL is not opened once it is clicked.\
    \ The method `onMouseOver` is called once the mouse cursor is moved over the image.\
    \ The `onMouseOut` method will be called once the mouse cursor is moved out of\
    \ the image.\n\n# Chapter 8. Clauses\n\n## GROUP BY clause\n\nThe `GROUP BY` clause\
    \ gathers in all the rows that have data in the specified columns. It will also\
    \ allow the aggregate functions we talked about earlier to be performed on the\
    \ columns as well. The best way to explain this is with an example:\n\nGROUP BY\
    \ clause syntax:\n\n```\nSELECT column1,\nSUM(column2)\nFROM \"list-of-tables\"\
    \nGROUP BY \"column-list\";\n```\n\nLet’s assume that you want to retrieve data\
    \ on the maximum salaries paid for each separate department. Your statement would\
    \ look like this:\n\n```\nSELECT max(salary), dept\nFROM employee\nGROUP BY dept;\n\
    ```\n\nThis statement is going to show the highest salary in each unique department\
    \ by name. In short, the name of the person in each department who earns the most\
    \ will be displayed along with their salary and the department they work in.\n\
    \n## HAVING clause\n\nThe `HAVING` clause is the one that lets you specify conditions\
    \ on rows for each specific group, in other words, certain rows to be selected\
    \ based on the specific conditions you input. The `HAVING` clause should always\
    \ follow the `GROUP BY` clause if you are using it:\n\nHAVING clause syntax:\n\
    \n```\nSELECT column1,\nSUM(column2)\nFROM \"list-of-tables\"\nGROUP BY \"column-list\"\
    \nHAVING \"condition\";\n```\n\nThe `HAVING` clause is best shown in an example\
    \ so let’s assume that you have a table that contains the names of your employees,\
    \ the department they work in, their salary and their age. Let’s say you want\
    \ to find the average salary for each employee in each separate department, you\
    \ would enter:\n\n```\nSELECT dept, avg(salary)\nFROM employee\nGROUP BY dept;\n\
    ```\n\nBut, let’s now assume that you only want to calculate the average and display\
    \ it if their salary is more than $20,000. Your statement would look like this:\n\
    \n```\nSELECT dept, avg(salary)\nFROM employee\nGROUP BY dept\nHAVING avg(salary)\
    \ > 20000;\n```\n\n## ORDER BY clause\n\nThe `ORDER BY` clause is optional and\
    \ it lets you display your query results in an order that is sorted – either ascending\
    \ or descending – based on whichever columns you choose to order the data by.\n\
    \nORDER BY clause syntax:\n\n```\nSELECT column1, SUM(column2) FROM \"list-of-tables\"\
    \ ORDER BY \"column-list\" [ASC | DESC];\n```\n\n* `[ ]` = optional\n\nThis statement\
    \ is going to show the employee ID, department, their name, age and salary from\
    \ the table you specify – in this case, the `employee_info` table – where the\
    \ department is equal to SALES. The results will be listed in ascending order,\
    \ sorted by salary:\n\n* `ASC` = Ascending Order - default\n* `DESC` = Descending\
    \ Order\n\nFor example:\n\n```\nSELECT employee_id, dept, name, age, salary FROM\
    \ employee_info WHERE dept = 'Sales' ORDER BY salary;\n```\n\nIf you want to order\
    \ data from multiple columns, each column name must be separated with a comma:\n\
    \n```\nSELECT employee_id, dept, name, age, salary\nFROM employee_info\nWHERE\
    \ dept = 'Sales'\nORDER BY salary, age DESC;\n```\n"
