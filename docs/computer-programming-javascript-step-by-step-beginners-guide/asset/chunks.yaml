  trans: "\n请考虑以下示例：\n\n```\n<html><body><script type=\"text/javascript\">\n  function\
    \ readValue(){\n  var name=document. memberform. memberName. value;\n  alert(\
    \ \"Hi: \" + name);\n  }\n  </script>\n  <form name=\"memberform\">\n  Enter Name:<input\
    \ type=\"text\" name=\"memberName\" />\n  <input type=\"button\" onclick=\"readValue()\"\
    \ value=\"Click Here\" />\n  </form>\n  </body></html>\n```\n\n运行代码后，会得到如下简单表单：\n\
    只需在输入框中输入你的名字，然后点击“Click Here”按钮，看看会发生什么。\n你会看到一个弹出框，其中包含你的名字以及附加的一些文本：\n我们只是创建了一个带有输入文本字段的简单表单。方法\
    \ `readValue()` 帮助我们获取输入到字段中的值。请看下面这一行：\n`var name=document. memberform. memberName.\
    \ value;`\n其中 `memberName` 是表单中文本字段的名称，这些名称必须匹配，否则你将无法得到正确的结果。\n\n## getElementById()\n\
    \n除了名称，我们还可以通过元素的 id 来获取它。这可以通过 `document.getElementById()` 方法实现。不过，输入文本字段需要指定一个\
    \ id。\n例如：\n\n```\n<html><body><script type=\"text/javascript\">\n  function computeSquare(){\n\
    \  var x=document. getElementById( \"integer\" ). value;\n  alert( x * x);\n \
    \ }\n  </script>\n  <form>\n  Enter an Integer:<input type=\"text\" id=\"integer\"\
    \ name=\"myNumber\" /><br/>\n  <input type=\"button\" value=\"Compute Square\"\
    \ onclick=\"computeSquare()\" />\n  </form>\n  </body></html>\n```\n\n执行代码后，会得到如下简单表单：\n\
    在输入框中输入一个数字，然后点击“Compute Square”按钮。\n这会在弹出框中返回该数字的平方，如下所示：\n在示例中，我们定义了 `computeSquare()`\
    \ 方法，它帮助我们获取输入文本字段中数字的平方。请看下面这一行：\n`var x=document. getElementById( \"integer\"\
    \ ). value;`\n在这一行中，我们使用了 `getElementById()` 方法，该方法将输入文本字段的 id 作为参数。它帮助我们通过 id\
    \ 获取输入文本字段中键入的值。\n\n## getElementsByName()\n\n`document.getElementsByName()` 方法可以帮助我们通过名称获取元素。该方法的语法如下：\n\
    `document. getElementsByName( \"name\" )`\n名称是必需的。\n示例：\n\n```\n<html><body><script\
    \ type=\"text/javascript\">\n  function getNumber()\n  {\n  var options=document.\
    \ getElementsByName( \"option\" );\n  alert( \"Total Options:\" + options . length\
    \ );\n  }\n  </script>\n  <form>\n  Yes:<input type=\"radio\" name=\"option\"\
    \ value=\"yes\" >\n  No:<input type=\"radio\" name=\"option\" value=\"no\" >\n\
    \  <input type=\"button\" onclick=\"getNumber()\" value=\"Available Options\"\
    \ >\n  </form></body></html>\n```\n\n执行后，代码返回如下：\n点击“Available Options”按钮，看看会发生什么。会弹出一个窗口，如下所示：\n\
    我们创建了两个单选按钮，选项分别为 Yes 和 No。注意，这两个输入类型被赋予了相同的名称，即 `option`。\n请看下面这一行：\n`var options=document.\
    \ getElementsByName( \"option\" );`\n这一行帮助我们统计名称为 `option` 的元素数量。根据输出，结果应为 2。\n\
    \n## getElementsByTagName()\n\n`document.getElementsByTagName()` 属性返回具有指定标签名称的元素。其语法如下：\n\
    `document. getElementsByTagName( \"name\" )`\n例如：\n\n```\n<html><body><script\
    \ type=\"text/javascript\">\n  function allparagraphs(){\n  var pgs=document.\
    \ getElementsByTagName( \"p\" );\n  alert( \"Total paragraphs are: \"+ pgs . length\
    \ );\n  }\n  </script>\n  <p> This is a paragraph</p>\n  <p> This is a paragraph</p>\n\
