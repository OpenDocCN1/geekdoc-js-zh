  trans: "\n\n现在你的代码听起来更人性化了，因为它能更好地响应用户输入。试着摆弄一下代码，看看解释器如何根据 `if-else` 语句满足的条件来改变输出。\n\
    \n## 调试\n\n到目前为止，你已经尝试了变量、数据类型、数学运算符、比较运算符、用户提示、确认对话框和警告框，以及最后的 `if-else` 语句。如果你犯了一些错误，不用担心；计算机本质上是字面理解的，不会容忍最微小的语法错误。话虽如此，这里有一些代码似乎无法按预期工作。修改以下代码片段，以便你能产生正确的输出！\n\
    \n```\nvar name = \"Chris\";\nalert('Hi ' + 'name' + '! It’s nice to meet you.');\n\
    ```\n\n在这个代码片段中，输出应该是 \"Hi Chris! It’s nice to meet you.\"。当前的输出是什么？你认为代码有什么问题？注意，当你执行这段代码时，控制台并没有报错或抛出错误信息。这种问题被称为“bug”，因为虽然\
    \ JavaScript 解释器认为这段代码没有问题，但它并没有按创建者的意图工作。\n\n现在尝试纠正这个包含 bug 和错误的代码片段：\n\n```\n\
    var name;\nvar age;\nname = prompt('What’s your name?');\nif (name.length = 0);\n\
    {\nname = prompt('You cannot leave this empty. What’s your name?');\n}\nelse (name.length\
    \ != 0)\n{\nalert('Your name is ' + name + '. Got it!');\n}\nage = prompt('What’s\
    \ your age?');\nif (age.length = 0)\n{\nage = prompt('You cannot leave this empty.\
    \ What’s your age?');\n}\nelse (name.length != 0)\n{\nalert('Your age is ' + age\
    \ + '. Got it!');\n}\n```\n\n这段代码是之前示例代码的扭曲版本，所以你可以尝试比较代码，看看为什么这段代码不起作用。如果你感到困惑，可以查看一个叫做“linter”的程序，它是一个方便的工具，可以检查代码中的错误并告诉你哪些行有错误。现在练习调试技巧是很好的锻炼，因为当你创建更复杂的程序时，调试几乎会成为日常。\n\
    \n### 调试时要注意什么：\n\n如果你不知道从哪里开始，寻找 bug 和错误可能会让人不知所措。以下是程序员在编码时最常犯的一些错误：\n\n1. \
    \ 使用 `=` 而不是 `==` 来比较两个值——在编程中，`=` 符号用作赋值运算符，这意味着如果你使用它而不是 `==` 符号，你最终会用等式右边的值替换等式左边变量的值。\n\
    \n2.  放错分号——就像句号在英语中结束句子一样，分号在 JavaScript 以及其他编程语言（如 C、Java 等）中结束语句。例如，如果你不小心在语句中间放了一个分号，JavaScript\
    \ 会认为该语句不完整并产生错误。\n\n3.  误用引号——引号告诉解释器你在使用字符串，所以如果你将变量或数字括在引号中，你实际上是将它们变成了字符串。当你尝试对不小心括在引号中的数字进行数值运算时，这会导致异常。\n\
    \n到目前为止，这些只是新手最容易犯的错误，但随着你练习编写更复杂的代码，你应该能够很容易地发现 bug 和错误。\n\n## 回顾\n\n到目前为止，我们已经涵盖了很多概念，所以让我们回顾一下我们学到的内容：\n\
    \n1.  变量和数据类型\n\n    *   数字——可以是整数或包含小数的数字（例如，`3.14`、`5`、`100`）\n    *   字符串——你用引号括起来的任何内容（例如，`\"\
    5\"`、`\"I am a JavaScript master\"`、`\"I love the number 7\"`）\n    *   布尔值——`true`\
    \ 或 `false`\n\n    要声明一个变量，只需输入：\n\n    ```\n    var <变量名> = <值>;\n    ```\n\n\
    \    如果你还没有值，也可以只声明变量名而不赋值：\n\n    ```\n    var <变量名>;\n    ```\n\n    JavaScript\
    \ 不关心你放入什么类型的数据。如果你用 C 或 Java 编程过，你可能习惯于声明变量的数据类型（`int`、`float`、`char` 等），但在 JavaScript\
    \ 中，你可以将任何内容放入变量而不会出现问题。\n\n2.  弹出框\n\n    *   `alert(\"Hi There!\")`——你可以向用户弹出警告。\n\
    \    *   `confirm(\"Are you sure?\")`——你可以向用户请求确认。\n    *   `prompt(\"Type anything\
    \ here.\")`——你可以向用户请求输入。\n\n3.  流程控制\n\n    *   `if-else` 语句——简而言之，如果第一个条件满足，则执行第一个大括号内的内容并跳过\
    \ `else` 部分。否则，转到 `else` 条件的大括号并执行其中的内容。\n\n# 第 14 章 正则表达式\n\n## 什么是正则表达式？\n\n\
    正则表达式表示一种模式。在 JavaScript 中，正则表达式可用于执行诸如搜索模式、替换模式、检查字符串是否匹配给定模式或根据特定模式将字符串拆分为更小的字符串等操作。在\
    \ JavaScript 中，正则表达式是对象。\n\n## 创建正则表达式\n\n在 JavaScript 中，有两种方法可以创建正则表达式，分别是：\n\
    \n### 使用正则表达式字面量\n\n在这种方法中，模式在两个斜杠 `//` 内指定，后面跟着称为修饰符的字符。你将在本章后面了解什么是修饰符；修饰符是可选的。\n\
    \n语法：`/pattern/modifiers/`\n\n如果使用此方法，则正则表达式在脚本加载时编译，因此如果正则表达式是常量，此方法会提高程序的性能。\n\
    \n### 使用 `RegExp` 对象的构造函数\n\n在这种方法中，我们使用 `new` 关键字来初始化一个新的 `RegExp` 对象，`RegExp`\
    \ 代表正则表达式。模式作为第一个参数传递给 `RegExp` 构造函数，修饰符作为第二个参数，注意这里的修饰符参数也是可选的。\n\n语法：`new RegExp(\"\
    pattern\", \"modifiers\");` 或 `new RegExp(\"pattern\");`\n\n如果使用此方法，则正则表达式在运行时编译，此方法通常用于正则表达式不是常量的情况。\n\
    \n## 修饰符\n\n修饰符用于改变基于正则表达式的模式匹配方式。下面列出了修饰符及其对操作影响的详细信息。\n\n*   `i`——使匹配不区分大小写，默认情况下正则表达式匹配是区分大小写的。\n\
    *   `m`——使模式匹配扩展到多行，如果正在执行匹配的字符串中有多行的话。\n*   `g`——默认情况下，操作在找到模式的第一个匹配后停止，但如果使用此修饰符，操作不会在第一个匹配处停止，从而执行全局匹配。\n\
    \n## 简单模式\n\n如果你想直接匹配一个字符序列，你可以将其写在模式的位置。例如，正则表达式 `/test/` 将匹配任何包含 'test' 的字符串，因此像\
    \ 'this is a test' 这样的字符串会匹配，但像 'this is a est' 这样的字符串不会匹配，因为序列中缺少字符 't'。\n\n\
    某些字符在正则表达式中表示特殊含义，例如 `*` 或 `.`，如果你想直接匹配这些字符，则需要转义它们，即在它们前面加一个反斜杠。因此，要匹配确切的字符串\
    \ 'te*st'，正则表达式将是 `/te\\*st/`。你将在下一节中了解所有在正则表达式中具有特殊意义的字符。\n\n## 特殊字符\n\n以下是可用于正则表达式的特殊字符列表及其作用：\n\
    \n*   `^`\n\n"
- fmt: '

    If present at the start of the regular expression, this character signifies that
    the following pattern should be matched from the beginning of the input. If the
    `''m''` modifier is used, then the starting of each line is also tested for the
    match. For example, the regular expression `/^test/` will not match anything in
    the string ‘this is a test’ as ‘test’ is not present at the beginning of the string,
    but the same regular expression will match with the string ‘test is going on’.


    *   `$`


    If present at the end of the regular expression, this character signifies that
    the pattern should be matched with the end of the line. If the `''m''` modifier
    is used then the end of each line is tested for the match. For example, the regular
    expression `/test$/` will not match anything in the string ‘test is going on’
    as ‘test’ is not present at the end of the string, but the same regular expression
    will match the string ‘this is a test.''


    *   `*`


    This character is used to match the expression preceding this character zero or
    more times. For example, the regular expression `/te*st/` will match ‘t’ followed
    by zero or more ‘e’ and that followed by ‘st’, so the string ‘this is a teeeeeest’
    as well as the string ‘this is a tst’ will be matched but the string ‘this is
    teees’ won’t be matched since a ‘t’ is missing from the sequence to be matched.


    *   `+`


    This character is used to match the expression preceding this character one or
    more times, i.e., if the preceding expression occurs at-least once. For example,
    the regular expression `/te*st/` will match the string ‘this is a teeeeeest’ but
    won’t match the string ‘this is a tst’ or the string ‘this is a tees’.


    *   `?`


    This character is used to match the expression preceding this character zero or
    one time. For example, the regular expression `/te?st/` will match the string
    ‘this is a test’ and ‘this is a tst’ but won’t match the string ‘this is a teest’
    or the string ‘this is a tes’.


