    选择一组元素意味着该方法将返回多个节点。这些节点的集合被称为 `NodeList`，并以类数组的形式存储。每个节点会被赋予一个索引编号，从 0 开始，而节点的顺序与它们在页面上的出现顺序相同。尽管
    `NodeLists` 看起来像数组，行为也像数组，但从语义上讲，它们是一种称为集合的对象类型。作为对象，集合拥有自己的属性和方法，这些在处理 `NodeList`
    时非常有用。


    以下示例将选择所有 `<li>` 元素，并将其节点引用赋值给 `schedule` 变量。


    ```

    var schedule = document.getElementsByTagName("li");

    ```


    如果我们想分别访问每个元素，可以使用数组语法。例如：


    ```

    var item1 = schedule[0];var item2 = schedule[1];var item3 = schedule[2];

    ```


    然而，当我们选择一组元素时，通常希望与整个组进行交互。例如，让我们为所有 `<li>` 元素分配值为 `"finished"` 的 class 属性。为此，我们可以使用循环遍历
    `NodeList` 中的每个元素。


    ```

    var schedule = document.getElementsByTagName("li");for (var i = 0; i < schedule.length;
    i++) {schedule[i].className = "finished";}

    ```


    图 29. 更改所有 `<li>` 元素的 class 属性


    与处理数组类似，在处理集合时，我们可以使用 `length` 属性来确定集合的大小。然后，我们可以在 `for` 循环中使用此信息，以便有效地遍历每个 `NodeList`
    项并分配 `"finished"` 类属性。


    对于 `getElementsByClassName()` 方法，我们可以使用完全相同的逻辑。我们将获得一个存储在集合中的 `NodeList`，每个节点都有一个索引编号。与
    `getElementByTagName()` 方法一样，我们可以访问单个项，并通过其对象属性和方法管理集合。


    ## 遍历 DOM


    当我们使用前面讨论的任何方法选择一个元素节点时，我们还可以选择与该元素相关的其他元素。这种相对选择被视为元素属性。


    ### previousSibling 和 nextSibling


    `previousSibling` 和 `nextSibling` 属性指的是同一 DOM 层级上的相邻元素。例如，如果我们选择 id 值为 `"phase2"`
    的第二个 `<li>` 元素，那么 `"phase1"` 的 `<li>` 元素将被视为 `previousSibling`，而 `"phase3"` 的
    `<li>` 元素则是 `nextSibling`。如果没有兄弟元素（例如，`"phase1"` 元素没有 `previousSibling`），则该属性的值保持为
    `null`。


    在以下示例中，我们选择 id 属性值为 `"phase2"` 的 `<li>` 元素，并更改所选元素及其前一个兄弟元素的 class 属性。


    ```

    var secondstop = document.getElementById("phase2");var prevstop=secondstop.previousSibling;secondstop.className
    = "current";prevstop.className = "finished";

    ```


    ### 父元素与子元素


    我们还可以以所选元素为起点，遍历 DOM 层级的不同级别。如果想向上移动一级，可以使用 `parentNode` 属性。例如，如果我们选择了第二个 `<li>`
    元素，可以通过以下语法引用其父元素（`<ul>` 元素）：


    ```

    var secondstop = document.getElementById("phase2");var upperelement = secondstop.parentNode;

    ```


    或者，如果想向下移动一级，可以使用 `firstChild` 或 `lastChild` 属性。在以下示例中，我们选择了 id 属性值为 `"partyplan"`
    的 `<ul>` 元素。使用 `firstChild` 属性引用该列表的第一个 `<li>` 元素，而使用 `lastChild` 属性引用该列表的最后一个
    `<li>` 元素。


    ```

    var plan = document.getElementById("partyplan");var child1 = plan.firstChild;var
    child2 = plan.lastChild;

    ```


    ## 添加和管理内容


    到目前为止，我们讨论了如何在 DOM 中查找元素。更有趣的方面是在 DOM 中管理内容的方法。


    ### 更改 HTML


    我们已经讨论过 `textContent` 属性，但该属性仅检索文本值，并忽略后续的 HTML 结构。如果我们想编辑页面 HTML，必须使用 `innerHTML`
    属性。该属性可用于任何元素节点，并且既能检索内容也能编辑内容。


    ```

    var liContent = document.getElementById("phase1").innerHTML;

    ```


    当从 id 属性值为 `"phase1"` 的 `<li>` 元素中检索 HTML 时，`innerHTML` 会将元素的全部内容（文本和标记）作为字符串变量捕获。如果对
    `<ul>` 元素应用相同的语法，`innerHTML` 属性将捕获所有 `<li>` 项。


    我们还可以使用 `innerHTML` 属性更改元素的内容。如果此内容包含额外的标记，这些新元素将被处理并添加到 DOM 树中。例如，让我们在派对列表的第一个
    `<li>` 项中添加 `<em>` 标签：


    ```

    var firstStop = document.getElementById("phase1");firstStop.innerHTML = "<em>20:00
    - Home warm-up</em>";

    ```


    图 30. 向第一个列表项添加包含内容的 `<em>` 元素


    ### DOM 操作


    管理文档内容的一种更直接的技术是使用 DOM 操作。这是一个三步过程，使用以下方法：


    1. `createElement()` - 该过程首先使用 `createElement()` 方法创建一个新的元素节点。此元素节点存储在一个变量中，尚未成为
    DOM 的一部分。


    2. `createTextNode()` - 该过程继续使用 `createTextNode()` 方法创建一个新的文本节点。与上一步类似，此文本节点存储在一个变量中，尚未成为文档的一部分。


    3. `appendChild()` - 最后一步是使用 `appendChild()` 方法将创建的元素添加到 DOM 树中。该元素将作为子元素添加到现有元素中。同样的方法可用于将文本节点添加到元素节点。

