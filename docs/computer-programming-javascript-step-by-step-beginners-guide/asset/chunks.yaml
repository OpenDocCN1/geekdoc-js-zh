- fmt: "\nThis method tries to find a match of regex passed as the first argument;\
    \ if found, it replaces the match with the second argument (`replacer`). Example:\n\
    \n```\nvar original = \"this is an example\";\n//replcaes first s and a with 9\n\
    var new = original.replace(/[sa]/, '9');\n//replcaes each s and a with 9, since\
    \ the 'g' modifier is used\nvar new2 = original.replace(/[sa]/g, '9');\nconsole.log(new);\
    \ //prints 'thi9 is an example' on the console screen\nconsole.log(new2); //prints\
    \ 'thi9 i9 9n ex9mple' on the console screen\n```\n\nWe can also use capture groups\
    \ in the regular expression in this function and then use them in the replacer\
    \ string. If in the replacer string we use a `$` sign followed by a number, then\
    \ that `$` sign with the number is replaced by the capture group of that index.\
    \ For example, `$1` gets replaced by the first capture group in the regular expression\
    \ and `$2` by the second one and so on. Example:\n\n```\nvar original = \"this\
    \ is an example\";\n//places _ on both side of each s and a\nvar new = original.replace(/([sa])/g,\
    \ '_$1_');\nconsole.log(new); //prints 'thi_s_ i_s_ _a_n ex_a_mple' on the console\
    \ screen\n```\n\nIn this chapter, you have learned about regular expressions.\
    \ I hope you have got a basic idea of regular expressions in JavaScript after\
    \ reading this chapter.\n\n# Hoisting\n\n## What is hoisting?\n\nThe word hoist\
    \ means to lift or raise up by means of some mechanical device like a pulley,\
    \ but in JavaScript, hoisting means that the functions and variable declarations\
    \ are moved to the top of the scope or context they are declared in, i.e., lifted\
    \ up as in hoist, thus the word ‘hoist’ing. The declarations aren’t really moved\
    \ to the top, they are just put first into the compiled code.\n\n## Variable hoisting\n\
    \nFor example the following code:\n\n```\nx = 21;\nconsole.log( x );\nvar x;\n\
    ```\n\nReally compiles as this:\n\n```\nvar x;\nx = 21;\nconsole.log(x);\n```\n\
    \nAs you can see the declaration has moved to the top of the current context,\
    \ this is what hoisting is.\n\nLet's understand this with a more suitable example:\n\
    \n```\nconsole.log( x ); // prints 'undefined' on the console screen\nconsole.log(\
    \ y ); // throws a ReferenceError saying 'y is not defined'\nvar x;\n```\n\nThis\
    \ happens because `x` being declared in the current context, though it is below\
    \ the `console.log` line, it is moved at the top of the context and as there is\
    \ no assignment done to `x`, it is set to `undefined` by default, whereas in case\
    \ of `y` it is not available anywhere in current context, therefore, a `ReferenceError`\
    \ is thrown.\n\nNote that the assignment operation is not hoisted, only the declaration\
    \ is. Example:\n\n```\nconsole.log(x); //prints 'undefined' on the console screen\n\
    var x; // only this statement is hoisted\nx = 21; // this is not\n```\n\nYou must\
    \ be wondering about, what if we assign the value to variable while declaring\
    \ it, like `var x = 21;`, though here it seems that you are assigning value to\
    \ variable while declaring it but in fact internally the variable is first declared\
    \ and then the value is assigned to it, so it is equivalent to `var x; x = 21;`.\
    \ So if you declare a variable like this below the line where it is being used\
    \ but in the same context then only declaration part is hoisted. Example:\n\n\
    ```\nconsole.log(x); //prints 'undefined' on the console screen\nvar x = 21;\n\
    ```\n\nThis is how the above code is compiled:\n\n```\nvar x;\nconsole.log(x);\
    \ //prints 'undefined' on the console screen\nx = 21;\n```\n\n## Function hoisting\n\
    \nJust as variable hoisting, functions are also hoisted. As a result the functions\
    \ can be called even before they are declared, given that it is declared in the\
    \ current context or scope. Example:\n\n```\ntest();\nfunction test() {\n    console.log('This\
    \ is a test');\n}\n//prints 'This is a test' on the console screen\n```\n\nIt\
    \ is to be noted that function expressions, i.e., functions that are assigned\
    \ to variables through the assignment operator `=` are not hoisted. The case of\
    \ hoisting function expression is same as assigning a value a variable, which\
    \ has been discussed above. Example:\n\n```\ntest(); // throws a TypeError saying\
    \ 'test is not a function'\ntestRandom(); // throws ReferenceError saying 'testRandom\
    \ is not defined'\nvar test = function {\n    console.log('This is a test');\n\
    };\n```\n\nIn the above example, the difference in types of error is caused due\
    \ to hoisting. As visible the variable `test` is declared in the current scope\
    \ therefore its declaration is moved at top and hence it is declared, though its\
    \ value is `undefined` at the point where it is used, so a `TypeError` is thrown\
    \ which indicates that the `test` is defined but is not a function, whereas the\
    \ function `testRandom` is not declared anywhere, so a `ReferenceError` is thrown.\n\
    \n## Order of precedence of hoisting\n\nFunctions are always hoisted over variable\
    \ declaration. Example:\n\n```\nfunction test() {\n    //function code\n}\nvar\
    \ test;\nconsole.log( typeof test ); //prints 'function' on the console screen\n\
    ```\n\nEven if the position of the variable line and function line are swapped\
    \ in the above example, the output will remain the same.\n\nBut functions are\
    \ not hoisted over variable declaration, given the assignment is done above the\
    \ line where it is being used. Example:\n\n```\nfunction test() {\n    //function\
    \ code\n}\nvar test = 21; //now assignment is being done too\nconsole.log( typeof\
    \ test ); //prints 'number' on the console screen\n```\n\nEven if the position\
    \ of the variable line and function line are swapped in the above example, the\
    \ output will remain the same.\n\nAs mentioned this is valid as long as the assignment\
    \ is done above the line where it is being used, when the assignment is done below,\
    \ then the function is hoisted over the assignment. Example:\n\n```\nfunction\
    \ test() {\n    //function code\n}\nvar test;\nconsole.log(typeof test); //prints\
    \ 'function' on the console screen\ntest = 21;\nconsole.log(typeof test); //prints\
    \ 'number' on the console screen\n```\n\n## Conclusion\n\nIt is always the best\
    \ practice to declare variables or functions on the top of the scope where they\
    \ will be used to avoid any confusion, even though due to hoisting variable declaration\
    \ will be moved to the top of the scope or context automatically.\n\n# Chapter\
    \ 15. Basic Data Types of Variables\n\nVariables have four basic data types. These\
    \ are numbers, strings, Boolean, and objects. We’ll skim through these types,\
    \ because going in-depth in discussing them will leave us not time in learning\
    \ your JavaScript basic codes.\n\n## 1. Numbers\n\nIn JavaScript, generally, all\
    \ numbers are considered as 64-bit floating point numbers. When there are no values\
    \ after the decimal point, the number is presented as a whole number. Examples:\n\
    \n* `9.000` is presented as `9`\n* `6.000` is presented as `6`\n* `2.00` is presented\
    \ as `2`\n\nJavaScript and other computer programming languages are based on the\
    \ IEEE 754 standard, or the Standard for Floating-Point Arithmetic. Number literals\
    \ can be a floating-point number, an integer or a hexadecimal. Example of floating-point\
    \ numbers:\n\n* `4.516`\n* `9.134`\n* `6.01`\n* `4.121`\n\nExamples of integers:\n\
    \n* `34`\n* `45`\n* `21`\n* `30`\n\nExamples of hexadecimal numbers:\n\n* `OxFF`\n\
    * `-OxCCFF`\n\n### Special number values\n\n* `NaN` and `Infinity` – are JavaScript’s\
    \ two ‘error values’\n\nThe `NaN` (Not a Number) error appears when the browser\
    \ cannot parse the number, or when an operation failed. On the other hand, `Infinity`\
    \ is an error that appears when the number cannot be represented because of its\
    \ magnitude. The error also appears when you divide a number by zero (`0`).\n\n\
    * `-0` and `+0` – the `-0` rarely appears, so don’t get confused about these special\
    \ number values. You can ignore them, for now.\n\n* `Null` – these are obtained\
    \ when the browser cannot return a value.\n\n## 2. Strings\n\nStrings are data\
    \ types that are typically enclosed in matching single quotes or double quotes.\
    \ The elements can be numbers or texts.\n\n## 3. Boolean\n"
