    The NaN (Not a Number) error appears when the browser cannot parse the number,
    or when an operation failed.On the other hand, Infinity is an error that appears
    when the number cannot be represented because of its magnitude. The error also
    appears when you divide a number by zero (0).


    *   -0 and +0 – the -0 rarely appears, so don’t get confused about these special
    number values. You can ignore them, for now.


    *   Null – these are obtained when the browser cannot return a value.


    2.  Strings


    Strings are data types that are typically enclosed in matching single quotes or
