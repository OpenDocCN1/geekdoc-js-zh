- fmt: "\nYour event handler can then put this information to use. `target` is the\
    \ property which is of primary interest to us in our current program. `target`\
    \ contains the input field we intend to use, which we'd otherwise select by using\
    \ `$('#member_search input')`. Therefore, we could also register our event handler\
    \ as follows: `event => hightlightChatMembers(event.target.value);` Doing so gives\
    \ us a number of concrete advantages. In all cases, it's more efficient, since\
    \ your browser doesn't have to find the element object again — it's already in\
    \ `target`. But a much more important advantage is better maintainability. If\
    \ our selector for finding the input field should change (e.g. because of a change\
    \ to the HTML structure), we won't have to worry about also changing the event\
    \ handler. It always refers to the current `target`, no matter how we found the\
    \ element and registered the event on it.\n\n```\n\"use strict\";\n\nconst init\
    \ = () => $(\"#member_search input\")\n  .addEventListener(\"keyup\", event =>\n\
    \    updateHighlightingOfChatMembers(event.target.value));\n\nconst updateHighlightingOfChatMembers\
    \ = partOfMemberName => {\n  removeHighlightsFromAllChatMembers();\n  hightlightChatMembersBy(partOfMemberName);\n\
    };\n\nconst removeHighlightsFromAllChatMembers = () =>\n  chatMembers().forEach(removeHighlight);\n\
    \nconst hightlightChatMembersBy = partOfMemberName => {\n  if (partOfMemberName\
    \ === \"\") return;\n  chatMembers()\n    .filter(member =>\n      doesMemberMatch(partOfMemberName,\
    \ member))\n    .forEach(highlight);\n};\n\nconst doesMemberMatch = (partOfMemberName,\
    \ memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n    .includes(partOfMemberName.toLowerCase());\n\
    \nconst chatMembers = () => $$(\"#chat_members li\");\nconst highlight = el =>\
    \ el.classList.add(\"highlighted\");\nconst removeHighlight = el => el.classList.remove(\"\
    highlighted\");\n\nconst $ = document.querySelector.bind(document);\nconst $$\
    \ = document.querySelectorAll.bind(document);\nNodeList.prototype.__proto__ =\
    \ Array.prototype;\n\ninit();\n```\n\nFYI, we can abbreviate `event` as `e`. Normally\
    \ abbreviations are considered \"bad\" and should be avoided, but in this case\
    \ it's okay. The single letter `e` is a common abbreviation for `event` and is\
    \ acceptable as long as its scope (range over which a variable exists) is limited\
    \ to a very small function.\n\nNow we're ready! You can finally show Marty the\
    \ improved feature, and he's so happy about it he throws another party — here's\
    \ to hoping it'll be an unforgettable event!\n\n# Chapter 12. A Storing Information\
    \ in Variables\n\n## Learning to use Variables\n\nIn this chapter we are going\
    \ to discuss variables. Variables are important elements of any programming language,\
    \ and Javascript is no exception.\n\nVariables are memory allocations used to\
    \ hold values. They are called variables because their value may vary over time\
    \ throughout the execution of the program.\n\nYou can use variables to hold text\
    \ values (also known as alphabetic or string values) such as a person’s name,\
    \ company name or any other text content in your program. Variables may also hold\
    \ numerical values.\n\nTo show you how variables are used, let’s start with an\
    \ HTML document page. For this example, we will use an HTML 4.01 document. To\
    \ insert Javascript, a script tag is used with attributes set as follows:\n\n\
    `<script language=\"javascript\" type=\"text/javascript\">`\n\nAll Javascript\
    \ commands must be placed within the script element. The first Javascript element\
    \ that must be identified is the variable to be used. We need to name the variable\
    \ and declare it.\n\nWhen you declare a variable in Javascript, you use the `var`\
    \ statement followed by the name of the variable. It is ideal that the name of\
    \ the variable is something that describes what the variable represents. The variable\
    \ name can be any alphanumeric set of characters, and should be treated as case\
    \ sensitive. No punctuation marks or special characters are allowed, except for\
    \ underscore.\n\nAn example of a variable declaration is:\n\n```\nvar userName;\n\
    ```\n\nIt’s not required to use the `var` statement when declaring a variable\
    \ in Javascript, however, it is a good idea always to do so. Consistently using\
    \ `var` when declaring variables avoids difficulties with variable scope.\n\n\
    We’ll be discussing variable scope later in the course, but the short explanation\
    \ is that there are variables that are only used within a certain segment of your\
    \ program, such as a function. Variables can be declared so that their value is\
    \ only retrievable within that scope.\n\nNow that we have declared our variable,\
    \ we can assign it a value. This is called variable assignment. When we set the\
    \ initial value of the variable, it is known as initialization. Once you have\
    \ declared your variable, you no longer need to use the `var` statement. All you\
    \ need is the name of the variable followed by the equal sign and the value of\
    \ the variable. In this example, our variable initialization is:\n\n```\nuserName=\"\
    Mark Lassoff\";\n```\n\nThe value assigned in the above example is a string, also\
    \ known as text, which is why it was enclosed with quotes. If you are assigning\
    \ a numerical value to a variable, you do not need to enclose the value with quotes.\
    \ For example:\n\n```\nage = 39;\n```\n\nA shortcut method for simultaneously\
    \ declaring and initializing variables is to combine declaration and initialization\
    \ on the same line. This is a more efficient way of initializing and declaring\
    \ a variable. Declaring and initializing a variable concurrently is as follows:\n\
    \n```\nvar userName=\"Mark Lassoff\";\n```\n\nWe can now display the variable’s\
    \ value. To display the value of the variable you can use the `document.write()`\
    \ command, followed by the name of the variable in parentheses. The command syntax\
    \ is:\n\n```\ndocument.write(userName);\n```\n\nWhen you want to display the variable’s\
    \ value, you do not need to put quotes around the variable name (like you would\
    \ if you were outputting text). Instead you simply write the variable name in\
    \ the parentheses. If it is the actual string value you want to print, then surrounding\
    \ the string value with quotes is a must. For example:\n\n```\ndocument.write\
    \ (\"Austin, Texas\");\n```\n\nThis will display `Austin, Texas`.\n\nWe can also\
    \ change the value of a variable during the program’s execution. Suppose you have\
    \ displayed the first value assigned to your variable. You then assign another\
    \ value to the same variable name and then have it displayed. The second value\
    \ assigned to `userName` replaces the initial value.\n\nSo far, we have been assigning\
    \ values to our variable with the equal sign. However, the equal sign does not\
    \ mean “equal to” in the context of Javascript. In Javascript, the equal sign\
    \ is known as the assignment operator. The assignment operator merely assigns\
    \ a value to the variable.\n\nWe will discuss more operators and their functions\
    \ in greater detail later on. The way we read the variable initialization in the\
    \ previous example is that the variable `userName` was assigned the value `Mark\
    \ Lassoff`. The value being in quotes indicates it as a string value.\n\nWhen\
    \ a number is assigned as the value of a variable, it is referred to as a numeric\
    \ variable. This is an example of declaring and assigning a numeric variable:\n\
    \n```\nvar userAge= 37;\n```\n\nIn the next section, we will use numeric variables\
    \ to perform some arithmetic operations.\n\nThe complete example code listing\
    \ for the above discussion is presented here, followed by a screenshot of the\
    \ expected output when viewed in the browser.\n\nCode Listing: Declaring and Assigning\
    \ Variables\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
    \ >\n<html lang=\"en\">\n<head></head>\n<body>\n<script language=\"javascript\"\
    \ntype=\"text/javascript\">\n//var userName=\"Mark Lassoff\";\nvar userName; \
    \              //Variable Declaration\nuserName=\"Mark Lassoff\";    //Variables\
    \ Initialization\ndocument.write(userName);    //No quotes:  Output value of variables\n\
    userName=\"Brett Lassoff\"; // = Known as the assignment operator\ndocument.write(\"\
    <br/>\");\ndocument.write(userName);\ndocument.write(\"<br/>\");\nvar userAge\
    \ = 37;          //Combined initialization/declaration\ndocument.write(userAge);\n\
    </script>\n</body>\n</html>\n```\n\nThis is how the output appears in the browser.\
    \ Notice how the names and age were displayed on separate lines. This was made\
    \ possible by using the break `<br/>` tags, along with the `document.write()`\
    \ command.\n\n## Questions for Review\n\n1. In Javascript, what statement do you\
    \ use to declare a variable?\n   a. variable\n   b. declare\n   c. var\n   d.\
    \ dar\n\n2. What happens if you don’t put quotes around a variable’s string assigned\
    \ value?\n   a. The script outputs the value of the variable.\n   b. You get an\
    \ HTML error.\n   c. The script will not assign the variable correctly.\n   d.\
    \ Nothing will happen.\n\n3. Which of the following is known as the assignment\
    \ operator in Javascript?\n   a. The + sign\n   b. The = sign\n   c. The – sign\n\
    \   d. The @ sign\n\n4. Which is an example of combined initialization/declaration?\n\
    \   a. var Size\n   b. Size = 0\n   c. var Size; Size = 0;\n   d. var Size = 0;\n\
    \n5. Why is it important to use the var statement every time you declare a variable?\n\
    \   a. You will have trouble with variable scope if you don’t.\n   b. Variables\
    \ won’t work without being declared.\n   c. It’s confusing without it.\n   d.\
    \ You shouldn’t use it.\n\n## Lab Activity\n\n1) Create a Javascript code that\
    \ will display the following output:\n\n2) The program must have two variables.\
    \ The first variable will hold the values for the adult animals, `adultAnimalName`,\
    \ while the second variable will hold the values for the young animal, `youngAnimalName`.\n\
    \n3) Assign one value to each of the variables. Have these two variable values\
    \ displayed using `document.write()`.\n\n4) Use the following values for your\
    \ program:\n"
