    # Computer programming Javascript


    ## Table of Contents


    - [Computer programming Javascript](#part0001.xhtml)

    - [Description](#part0003.xhtml)

    - [Chapter 1. Use of a Global Variable as a Cache](#part0004.xhtml_a3NR)

    - [Chapter 2. The Basics of JavaScript Function and Scope](#part0005.xhtml_a3NS)

    - [Chapter 3. Loop Constructs](#part0006.xhtml_toc4_Chapter_3.Loop_Constructs)

    - [Chapter 4. An Introduction to ES6](#part0007.xhtml_a3NU)

    - [Chapter 5. Form](#part0008.xhtml_toc6_Chapter_5.Form)

    - [Chapter 6. Iframe and Multimedia](#part0009.xhtml_a3NW)

    - [Chapter 7. The Document Object Model](#part0010.xhtml_a3NX)

    - [Chapter 8. Clauses](#part0011.xhtml_a3NY)

    - [Chapter 9. Operators, Data Types and Other Priorities](#part0012.xhtml_toc10_Chapter_9.Operators__Data_Types_and_Other_Priorities)

    - [Chapter 10. Document Object Model (DOM)](#part0013.xhtml_a3P0)

    - [Chapter 11. Events (Not the Kind You Celebrate)](#part0014.xhtml_toc12_Chapter_11.Events__Not_the_Kind_You_Celebrate_)

    - [Chapter 12. A Storing Information in Variables](#part0015.xhtml_toc13_Chapter_12.A_Storing_Information_in_Variables)

    - [Chapter 13. JavaScript Essentials](#part0016.xhtml_a3P3)

    - [Chapter 14. Regular Expressions](#part0017.xhtml_toc15_Chapter_14.Regular_Expressions)

    - [Chapter 15. Basic Data Types of Variables](#part0018.xhtml_toc16_Chapter_15.Basic_Data_Types_of_Variables)

    - [Chapter 16. The window object](#part0019.xhtml_a3P6)

    - [Chapter 17. Maps and Sets](#part0020.xhtml_a3P7)

    - [Conclusion](#part0021.xhtml)


    ## Introduction


    If there is anything, I want you to hold at the end of this programming guide
    for JavaScript is the fact that:


    - JavaScript is the HTML and web language

    - It is easy to Learn


    If you can do that, then at the end, you will smile your way to programming for
    the web. However, your speed in learning JavaScript and other programming language
    is very dependent on you. If you find yourself struggling, don’t feel demoralized
    rather take a break and reread the material after you have settled down. Remember,
    this chapter gives you the basics of JavaScript as a beginner to familiarize yourself
    with the language.


    ### Variables in JavaScript


    ```

    var exam = 50;

    var test = 12;

    var score = exam * test;

    ```


    In the example above, `exam`, `test`, and `score` are variables given values with
    the value stored. We can perform various operations in JavaScript including multiplication,
    subtraction, addition, subtraction, and division. Variables and values can be
    declared as a number, string, or letter.


    ```

    var name = "insert your name";

    var number = ''45'';

    ```


    From the example, you can enclose string with a single or double quote because
    they work exactly the same way.


    ### JavaScript Identifiers


    Every variable in JavaScript must have a unique name, which is used to identify
    it. These unique names are called identifiers. Identifiers have certain rules,
    which include:


    - Every identifier must begin with a letter

    - They can contain digits (0-9), letters (a-z), dollar signs ($), and underscores
    (_)

    - Reserved words are not accepted

    - Variable names are case sensitive

    - An identifier can begin with a dollar sign or underscore.


    ### Scope of JavaScript Variable


    JavaScript allows two types of variable scope, which includes global and local
    variable scope. A variable is said to be global if it is declared outside the
    function body. With this, every statement has access to the variable within the
    same document. However, a local variable scope has its scope within the function.
    With this, the variable is only available to statements within the same function.


    ### Basic JavaScript on the Browser side


    When you hear about JavaScript on the browser side, it refers to the client-side,
    which means the code is run on the machine of the client – the browser. The browser-side
    components comprise of JavaScript, JavaScript libraries, CSS, images, HMTL, and
    whatever files downloaded to the browser.


    #### Browser-Side JavaScript Features


    JavaScript is important for the web as it is likely to use it to write programs
    that execute arbitrary computations. You have the opportunity of writing simple
    scripts such as the search for prime numbers or Fibonacci numbers. However, in
    the context of web browser and the Web, JavaScript enables programmers to program
    with the capability of computing sales tax, based on the information provided
    by the users through an HTML form.


    The truth about JavaScript language is in the document-based objects and browser
    that the language is compatible with. This may sound complex, however, I will
    explain the significant capabilities of JavaScript on the browser side along with
    the objects it supports.


    - **Controls the Browser** – There are various JavaScript objects that permit
    the control of the browser behavior. Furthermore, the `Window` object support
    means of popping up dialog boxes that display messages for the users. Additionally,
    users can also input messages. Besides this, JavaScript doesn’t provide a method
    that gives users the opportunity to directly create and manipulate frames inside
    the browser window. Notwithstanding, you can take advantage of the ability to
    make HTML animatedly by creating the particular frame layout you want.


    - **Interact with HTML Forms** – another significant part of the JavaScript on
    the browser side is its capability to work together with HTML forms. The ability
    comes because of the form element and its objects, which contains `Text`, `submit`,
    `select`, `reset`, `radio`, `hidden`, `password`, and `text area` objects. With
    these elements, you can write and read the values of the elements in the form.


    - **Interact with Users** – JavaScript has another feature, which is its ability
    to define event handlers. Most times, users initiate these events. For instance,
    when someone moves the mouse through a hyperlink, clicks the submit button, or
    enters a value. The capability to handle such events is important because programming
    with graphic interfaces requires an event-driven model.


    In addition to these aforementioned features, JavaScript on the browser side has
    other capabilities such as:


    - Changing the displayed image by using the `<img>` tag to generate an animation
    effect and image rollover

    - It has a `window.setTimeout()` method, which allows some block of random source
    code to be performed in the future within a split of a second

    - It streamlines the procedure of working and computing with times and dates


