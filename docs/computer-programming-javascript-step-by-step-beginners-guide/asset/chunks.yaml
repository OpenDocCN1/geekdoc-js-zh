    | `timeStamp` | [timestamp, i. e. when the event occurred] |

    | `target` | [element which triggered the event] |

    | `ctrlKey` | false [was the Ctrl key pressed?] |

    | `altKey` | false [was the Alt key pressed?] |


    Events have many other properties, but just the few we''ve listed above show you
    that an event object contains all the information which comes into play when an
    event occurs, e. g.:


    - What type of event is it? `keyup`

    - What key was released? `a`

    - When was the event triggered?

    - From where was the event triggered?

