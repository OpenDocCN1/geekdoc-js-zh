- fmt: "\n# JavaScript Framework\n\nTake a moment and consider creating a web application\
    \ and websites like constructing a house. In building a house, you can decide\
    \ to create every material you need to start the house from scratch before building\
    \ without any plans. This will be time-consuming and won’t make much sense. One\
    \ thing you may likely do is to buy pre-manufactured materials such as bricks,\
    \ woods, countertops, etc. before assembling them based on the blueprint you have.\n\
    \nCoding is like taking it upon yourself to build a house. When you begin coding\
    \ a website, you can code all areas of the site from scratch without. However,\
    \ there are certain website features, which gives your website more sense by applying\
    \ a template. Assuming you want to buy a wheel, it will make to look for one that\
    \ you can reinvent. This is where JavaScript Frameworks come to the scene.\n\n\
    `JavaScript Framework` is a collection of JavaScript code libraries, which gives\
    \ website developers pre-written JavaScript codes to use for their routine programming\
    \ tasks and features. You can also refer to it as an application framework, which\
    \ is written in JavaScript where the developers can manipulate the functions of\
    \ these codes and reuse them for their own convenience. They are more adaptable\
    \ for website designing, which is why many developers use them in building websites.\n\
    \n## Top JavaScript Framework\n\n### Vue.js\n\nThis is one of the JavaScript frameworks,\
    \ which was created to make the user interface development more organized. Created\
    \ by Evan You, it is the perfect JavaScript framework for beginners because it’s\
    \ quite easy to understand. Furthermore, it focuses on view layers. With `Vue.js`,\
    \ you don’t need `Babel`. A `Babel` is a transpiler with the responsibility of\
    \ converting JavaScript codes to the old version of ES5 that can run in all browsers.\
    \ All templates in the `Vue.js` framework are valid HTML, which makes their integration\
    \ easier. If you want to develop lightweight apps as a beginner, it is best to\
    \ start with `Vue.js`.\n\n### Next.js\n\nAnother important JavaScript Framework\
    \ is the `Next.js` framework, which is an additional tool for server-side rendering.\
    \ The framework allows developers to simplify the developing process similar to\
    \ the `Vue.js` framework. The features of this JavaScript Framework include page-based\
    \ client-side routing and automatic splitting of codes. The framework also comes\
    \ with a full CSS support, which makes styling of the user’s interface easier\
    \ for beginners and professionals.\n\n### Ember.js\n\nThis framework, which was\
    \ created a few years ago, is among the most sought JavaScript framework in the\
    \ web industry. Famous companies such as LinkedIn, Heroku, and Kickstarter use\
    \ the `Ember.js` framework in the design of their websites. It also comes with\
    \ regular updates and offers a complete feature for users. Unlike the `Vue.js`\
    \ framework, it is effective for developers who want to develop complex web applications.\
    \ The focus of this framework is on scalability, which allows developers to use\
    \ it for both web and mobile projects.\n\n### Angular\n\nGoogle released this\
    \ JavaScript Framework in 2010 with regular updates and improvements taking place.\
    \ It is one of the most sought after the framework for many developers because\
    \ it simplifies the development of websites and apps. For other developers, it\
    \ is because of its ability to create dynamic web apps.\n\n# Chapter 1. Use of\
    \ a Global Variable as a Cache\n\nIn cases where a small app is to be created\
    \ and in which one will incur an overhead when trying to integrate the app with\
    \ a third-party mechanism, these can easily be handled inside the `Node.js` app,\
    \ and this should be executed in the mode for a single thread.\n\nIn this mode,\
    \ that is, the single threaded mode, a single application is executed at a time,\
    \ and this is responsible for handling all of the requests sent to it. This is\
    \ similar to what happens with desktop allocations. Other web apps developed by\
    \ use of other programming languages for web development such as PHP, Ruby, and\
    \ Python do not function in this manner. A global variable can be defined in this\
    \ case, and this will become accessible to all of the requests that we make. This\
    \ needs to be considered with a lot of concern.\n\nFor this mechanism to be achieved,\
    \ one can create global variables of the necessary type and then a manipulation\
    \ mechanism should be added inside this function. This will make it persist inside\
    \ all of our requests.\n\nConsider the code given below, which shows how this\
    \ can be done effectively:\n\n```\n'use strict';\n//this should be the cache for\
    \ the js file\nvar cache = {};\nexports.someMethod = function(data){\n/*The business\
    \ logic should be added here*/\n//setting the cache\ncache[key] = val;\n//retrieving\
    \ the cache\ncVal = cache[key];\n//deleting the cache\ndelete cache[key];\n/*The\
    \ business logic should be added here*/\n```\n\n## Logging without the use of\
    \ a third-part Library\n\nWhenever we want to print temporary information, we\
    \ use the `console.log` so as to log in to the system. In the deployment stage,\
    \ there are good libraries which can be used for this purpose. Some people hate\
    \ the idea of using third-party libraries so as to log into their `node.js` app.\
    \ However, this has been solved by the provision of an alternative. With the native\
    \ support, one can be availed with a very decent mechanism for logging into their\
    \ `node.js` app.\n\nThe `Node.js`’s `console` object provides us with different\
    \ levels of logging. These need to be used in the way they were designed to be\
    \ used, otherwise, you will have trouble in using them. When you want to execute\
    \ your node app, you should specify a logfile in which you will need to have everything\
    \ written. This can be done as shown in the command given below:\n\n```\n$node\
    \ app.js > mylogfile.log\n```\n\nAfter executing the above command, you will be\
    \ set. The information about logging will be kept in the above file, and you will\
    \ be in a position to view it later when you want to gain insight into some useful\
    \ or critical information. It is also good for security purposes.\n\nWhenever\
    \ we want to print something on our console terminal, we should use the format\
    \ given below:\n\n```\nconsole.log(\"The value of my variable should be:\"+xyz);\n\
    ```\n\nThis should only work for items which are single valued. If it was a json\
    \ object, then we could have used `console.log(xyz).` This shows that the `+`\
    \ operator does not work in this case.\n\n## About the use of “*”\n\nIt is recommended\
    \ that this should not be used in a production dependency. Most people use it\
    \ in their `package.json` file so as to specify the version or to use the `*`\
    \ so that they can always have the latest package with them. One should have all\
    \ of their packages updated to the latest version, since it might have some bug\
    \ fixes, several improvements, and even new features added to it. However, this\
    \ is only good for those whose product is in the development stage but has not\
    \ reached the production stage.\n\nIn case of compatibility errors, fixing it\
    \ will be easy. This is shown in the code given below:\n\n```\n//other of this:\n\
    \"dependencies\": {\n\"clustered-node\": \"*\"\n//use the following\n\"dependencies\"\
    : {\n\"clustered-node\": \"~0.0.10\"\n```\n\nFor those who use such notations\
    \ in a production environment, this is very risky. This is because one will not\
    \ know when and which package might break and crash the application, which is\
    \ possible. This is why it should only be used in the development phase, but once\
    \ the product gets into the production environment, you should switch to dependencies\
    \ which are based on a specific version. This should be done during the deployment\
    \ phase of the product.\n\n## Asynchronous looping\n\nWhenever we use the `AsyncJS`/`underscoreJS`\
    \ in asynchronous flow looping/control, we get very useful and essential support.\
    \ For those who know more about the callback concept, they can use it in a very\
    \ native manner. If you are not interested in using this library in a simple task,\
    \ then use the mechanism given in the code below. Here is the code:\n\n```\nvar\
    \ iterate = function(items, it){\nconsole.log(\"Now handling: \"+it);\n//async\
    \ methods\nsomeAsyncMethod(parameterss, function callback(){\nif(items.length\
    \ <= it)\nreturn;\nreturn iterate(items, ++it);\n})\n};\nvar items = [5, 6, 7,\
    \ 8];\niterate(items, 0);\n```\n\n# Chapter 2. The Basics of JavaScript Function\
    \ and Scope\n\nLet’s see now, normally when we are talking about a ‘function’\
    \ what’s the first thing that comes to your mind? Obviously an activity right?\
    \ The functions in JavaScript also work in a similar manner. Functions are blocks\
    \ of codes which are required to be executed over and over again by the program.\
    \ A Function is used to perform a particular task. A Function can contain any\
    \ number of arguments and statements; they can even have none. Depending on how\
    \ the structure is coded, it may or may not return any value to the user.\n\n\
    A Function is declared in the following manner:\n\n```\nFunction name(       \
    \          ) { /*code blocks to be executed*/}\n```\n\nTo start the Function,\
    \ we start with the `function` keyword, and then we add the name, and parentheses.\
    \ To finish the function, we place the code blocks to be executed in a curvy brackets.\
    \ You can also put the function in a named variable:\n\n```\nvar jam = function()\
    \ {/* code blocks to be executed*/}\n```\n\nBelow are few examples of how you\
    \ can execute a function:\n\ni) This is the example of the most basic function\n\
    \n```\nvar sayHello = function(person, greeting) {\nvar text = greeting + ' ,\
    \ '+ person;\nconsole.log(text);\n};\nSay Hello (' Jessica' , ' Hello');\n```\n\
    \nii) This is the example of a function that returns a value\n\n```\nvar greet\
    \ = function (person, greeting) {\nvar writing = greeting + ' , ' + person ;\n\
    return function () {\nconsole.log(text);\n};\n};\nconsole.log(greet('Richard'\
    \ ,' Hello\"));\n```\n\niii) Sometimes, you might want to use a nested function.\
    \ (Note: A nested function is a function within another function.)\n\n```\nvar\
    \ sayHi = function( person, greeting) {\nvar text = greeting + ',' + person;\n\
    return function() {\nconsole.log (text);\n};\n};\nvar greeting = greet( ' Richard'\
    \ , 'Hello');\ngreeting();\n```\n\n## Self-Executing Anonymous Function\n\nProgrammers\
    \ have always been looking for the most advanced and clever methods available\
    \ to improve their programming experience and ways to make it more accessible\
    \ and easier for them. This resulted in the creation of the Self-Executing Anonymous\
    \ function. The core purpose of the self-executing anonymous function is to create\
    \ a JavaScript function and then immediately execute it upon its conception. This\
    \ makes it much easier for a programmer who is working on large scale programs.\
    \ Likewise, it will help you to code without creating a messy global namespace.\n\
    \nA basic Self-Executing Anonymous Function Would be:\n\n```\n(function() {\n\
    // code here\n})();\n```\n\nIt is very important that you understand how to use\
    \ this type of function if you plan on programming complex code in JavaScript.\
    \ Using the Self-Executing Anonymous Function can produce some great code that\
    \ is easy to use. As an example, the JQuery library is designed to make using\
    \ JavaScript on websites much easier. It does this by wrapping the entire library\
    \ in one large self-executing function.\n\n## Typeof Operator\n\nYou might run\
    \ into a situation where you need to determine the type of variable that you are\
    \ working in JavaScript. You won’t have call Sherlock Holmes to find that! Instead,\
    \ you can simply use the `typeof` operator to determine the type of any specific\
    \ value. In other words, the `typeof` operator is used to evaluate the type of\
    \ the operand.\n\nExample:\n\n```\nvar myvar = 0\nalert(typeof myvar)  //alerts\
    \ \"number\"\n```\n\nNumber isn’t the only type of operand that can be detected.\
    \ It can also be: string, Boolean, object, null, and not defined.\n\n## Scope\n\
    \nScope is the accessibility of a variable. A good understanding of Scope is necessary\
    \ when it comes to debugging because it allow you to know what variable from which\
    \ code block is causing the problem.\n\nThe simple rule here is that whenever\
    \ you declare a variable inside a scope, it will only be recognized by the statements\
    \ that are inside that scope; the statements that are outside the scope will not\
    \ acknowledge its existence and so that variable will not work.\n\nAnother way\
    \ to look at this is to imagine your entire code as a hotel with specific functions\
    \ and sections of code as hotel rooms. The hotel rooms represent the private scopes\
    \ of the code, while the common areas represent the global scope. A person in\
    \ one hotel room cannot see or use what is in another hotel room. Staff who work\
    \ in the hotel (and the global scope) also don’t have access to private hotel\
    \ rooms unless they have specific permission. Meanwhile, guests can go through\
    \ the common areas and make use of any object there.\n\nThus, you can see how\
    \ scope can affect how your code runs. If you need two different functions to\
    \ access the same variable, you need to ensure that they both have access to it.\
    \ One key way to ensure that the necessary variables have access to is to make\
    \ your variables globally accessible.\n\nThere are two possible alternatives if\
    \ you want your variables to become globally accessible. The first thing you can\
    \ do is to declare the variable outside the scope of your given piece of code,\
    \ this will allow any functions in your program to be able to call it and recognize\
    \ it. The other thing you can do is to declare the variables inside your scope\
    \ without using the word `var`. If the same variable was not defined at the beginning\
    \ of the code outside the scope of the piece of code in question, then the variable\
    \ will act similarly to a global one.\n\nExample:\n\n```\nvar foo = 'hello';\n\
    var talkHello = function() {\nconsole.log(foo);\n};\ntalkHello(); // logs 'hello'\n\
    console.log(foo); // also logs 'hello'\n```\n\nAs you can see, the variable `foo`\
    \ is declared outside of the function `talkHello`. That means that `foo` is a\
    \ global variable and any function will be able to access it, so when the function\
    \ `talkHello` calls it, it is accessible.\n\nThe following example is contradictory\
    \ to the first example. This shows that a code block that was written outside\
    \ the scope is not being able to recognize the variable.\n\n```\nvar talkHello\
    \ = function() {\nvar doo = 'hello';\nconsole.log(doo);\n};\ntalkHello(); // logs\
    \ 'hello'\nconsole.log(doo); // gives an empty log.\n```\n\nIn this example, the\
    \ variable `doo` is called inside the function `talkHello`. This creates a private\
    \ variable that is only accessible to the function, hence when the command `console.log(doo)`\
    \ attempts to access it, it returns a null value.\n\n## Some Common Mistakes to\
    \ Avoid\n\n✓ Always remember that a variable is only accessible by the functions\
    \ within a specific scope, outside of that scope the variable is invalid.\n\n\
    ## Practice\n\n➢ Explain what a scope is and how the variables are affected by\
    \ it.\n\n➢ Write a simple program to illustrate the functionalities of a:\n\n\
    a) Simple Function\n\nb) A Function with returnable value\n\nc) A function passed\
    \ as a parameter (Argument)\n\n➢ Explain the concept of a Self-Executing Anonymous\
    \ Function and give an example.\n\n# Chapter 3. Loop Constructs\n\nLooping is\
    \ another fundamental programming construct that most programming languages support.\
    \ Fundamentally, looping is used to execute the same set of statements iteratively\
    \ until a condition remains true. JavaScript supports four types of looping constructs.\n\
    \n## While Loop\n\nThe most basic loop construct is the `while` loop. This type\
    \ of a loop executes the set of statements inside the `while` loop until the expression\
    \ for the `while` is true. As soon as the expression becomes false, the `while`\
    \ loop execution terminates. The syntax for implementation of `while` is given\
    \ below:\n\n```\nwhile (expression){\n     //Statements of the while block\n}\n\
    ```\n\nSample implementation of the `while` loop is given below:\n\n```\n<html>\n\
    \     <body>\n               <script type=\"text/javascript\">\n           <!--\n\
    \              var c = 0;\n              document.write(\"Loop begins…\");\n \
    \                       while (c < 5){\n                 document.write(\"Value\
    \ of c: \" + c + \"<br />\");\n                 c++;\n              }\n      \
    \                  document.write(\"Loop Terminates!\");\n          //-->\n  \
    \      </script>\n               <p>Change the values of the looping variable\
    \ to see how things change</p>\n     </body>\n</html>\n```\n\nThe output of the\
    \ code upon execution is shown in the image given below.\n\n## Do…While Loop\n\
    \nAnother looping construct is the `do...while` loop. The condition’s validity\
    \ is checked at the end of the loop. So, this loop is that it executes at least\
    \ once. This type of a loop executes the set of statements inside the `do…while`\
    \ loop until the expression for the `while` is true. As soon as the expression\
    \ becomes false, the `while` loop execution terminates. The syntax for implementation\
    \ of `while` is given below:\n\n```\ndo{\n     //Statements of the while block\n\
    }while (expression)\n```\n\nSample implementation of the `do…while` loop is given\
    \ below:\n\n```\n<html>\n     <body>\n               <script type=\"text/javascript\"\
    >\n           <!--\n              var c = 0;\n              document.write(\"\
    Loop begins…\");\n                        do{\n                 document.write(\"\
    Value of c: \" + c + \"<br />\");\n                 c++;\n              } while\
    \ (c < 5)\n                      document.write(\"Loop Terminates!\");\n     \
    \     //-->\n        </script>\n               <p>Change the values of the looping\
    \ variable to see how things change</p>\n     </body>\n</html>\n```\n\nThe output\
    \ of the code upon execution is shown in the image given below.\n\n## For Loop\n\
    \nThe most commonly used looping construct is the `for` loop. The `for` loop integrates\
    \ the looping variable initialization, condition checking and looping variable\
    \ update in the `for` statement. The syntax for implementation of `while` is given\
    \ below:\n\n```\nfor(init; expression; update){\n     //Statements of the for\
    \ block\n}\n```\n\nHere, `init` is the initialization statement and `expression`\
    \ is the condition, which is to be tested. Lastly, the `update` is the expression\
    \ that updates the looping variable. Sample implementation of the `while` loop\
    \ is given below:\n\n```\n<html>\n     <body>\n               <script type=\"\
    text/javascript\">\n           <!--\n              var c;\n              document.write(\"\
    Loop begins…\");\n                        for(c=0; c<5; c++){\n              \
    \   document.write(\"Value of c: \" + c + \"<br />\");\n                 }\ndocument.write(\"\
    Loop Terminates!\");\n          //-->\n        </script>\n               <p>Change\
    \ the values of the looping variable to see how things change</p>\n     </body>\n\
    </html>\n```\n\nThe output of the code upon execution is shown in the image given\
    \ below.\n\n## For…In Loop\n\nThis loop is typically used with objects. The loop\
    \ uses a variable of the object and loops through until the value of the property\
    \ associated with the object variable is exhausted. In other words, this loop\
    \ works around object properties. The syntax for the implementation of the `for…in`\
    \ loop is as follows:\n\n```\nfor (variable in object){\n     //Statements inside\
    \ the for…in loop block\n}\n```\n\nSample implementation to demonstrate the working\
    \ of the `for…in` loop is given below.\n\n```\n<html>\n     <body>\n         \
    \      <script type=\"text/javascript\">\n           <!--\n              var demoObject;\n\
    \              document.write(\"Properties of the Object: <br /> \");\n      \
    \                  for (demoObject in navigation) {\n                 document.write(demoObject);\n\
    \                 document.write(\"<br />\");\n              }\n             \
    \ document.write (\"Loop Terminated!\");\n           //-->\n        </script>\n\
    \               <p>Change the object to see how the result changes</p>\n     </body>\n\
    </html>\n```\n\n## Controlling the Loop\n\nAlthough, once the loop starts, it\
    \ terminates only when the expression stated for condition holds false, there\
    \ are certain ways in which the developer can control the loop. There may be situation\
    \ where you might want to terminate the loop in between execution if a special\
    \ case occurs or you may want to start a new iteration on the occurrence of a\
    \ scenario. In order to control and implement all these conditions, JavaScript\
    \ has provided `continue` and `break` statements.\n\n### Break Statement\n\nWhenever\
    \ this keyword is encountered in a JavaScript code, the loop immediately terminates\
    \ and execution is shifted to the statement that comes right after the closing\
    \ bracket of the loop. In order to understand the working of `break` statement,\
    \ let us take an example:\n\n```\n<html>\n     <body>\n              <script type=\"\
    text/javascript\">\n           <!--\n           var a = 5;\n          document.write(\"\
    Loop Begins…<br /> \");\n                     while (a < 30)\n          {\n  \
    \            if (a == 5){\n                 break;}\n              a = a + 1;\n\
    \              document.write( a + \"<br />\");\n           }\n              \
    \       document.write(\"Loop terminates!<br /> \");\n           //-->\n     \
    \   </script>\n               <p>Change the value of a to see how the loop execution\
    \ is modified</p>\n     </body>\n</html>\n```\n\nThe output of the code is shown\
    \ in the image given below.\n\n### Continue Statement\n\nWhen this statement is\
    \ encountered in a loop, the rest of the loop statements are ignored and the control\
    \ is shifted to the next iteration of the loop. With that said, it is important\
    \ to understand that the next iteration is execution only if the loop condition\
    \ is found true. In case, the loop expression is found false, loop execution is\
    \ terminated.\n\nThe sample code given below demonstrates the use of `continue`\
    \ statement.\n\n```\n<html>\n     <body>\n              <script type=\"text/javascript\"\
    >\n           <!--\n              var a = 0;\n              document.write(\"\
    Loop begins<br /> \");\n                        while (a < 9){\n             \
    \    a = a + 1;\n                                 if (a == 4){\n             \
    \       continue; // skip rest of the loop body\n                 }\n        \
    \         document.write( a + \"<br />\");\n              }\n                \
    \        document.write(\"Loop terminates!<br /> \");\n           //-->\n    \
    \    </script>\n               <p>Change the value of a to see how the result\
    \ changes!</p>\n     </body>\n</html>\n```\n\nThe output generated after execution\
    \ of this code is illustrated in the image shown below.\n\n### Labels for Controlling\
    \ Loop Flow\n\nWhile the `break` and `continue` statements can redirect flow of\
    \ control around the boundaries of the loop construct, they cannot be used to\
    \ transfer control to precise statements. This is made possible in JavaScript\
    \ with the use of labels. A label is simply an identifier followed by colon, which\
    \ is placed before the statement or code block. The following code demonstrates\
    \ the use of labels.\n\n```\n<html>\n     <body>\n               <script type=\"\
    text/javascript\">\n           <!--\n              document.write(\"Loop begins!<br\
    \ /> \");\n              loop1: for (var i = 0; i < 3; i++) {\n              \
    \   document.write(\"Loop1: \" + i + \"<br />\");\n                 loop2: for\
    \ (var j = 0; j < 3; j++) {\n                    if (j > 3 ) break ; // Quit the\
    \ innermost loop\n                    if (i == 2) break loop1; // Do the same\
    \ thing\n                    if (i == 4) break loop2; // Quit the outer loop\n\
    \                    document.write(\"Loop2: \" + j + \" <br />\");\n        \
    \         }\n              }\n                        document.write(\"Loop terminates!<br\
    \ /> \");\n           //-->\n        </script>\n            </body>\n</html>\n\
    ```\n\nThe output of the code has been illustrated in the image given below.\n\
    \n# Chapter 4. An Introduction to ES6\n\nSome of the key features of ES6 are:\n\
    \n- **Arrows** - Arrows is a function shorthand using the `=>` syntax. It is syntactically\
    \ similar to the related feature in C#, Java 8 and CoffeeScript.\n- **Classes**\
    \ - There is support for classes, inheritance, super calls, instances and static\
    \ methods.\n- **Template strings** - Template strings are used for constructing\
    \ strings.\n- **Modules** - There is language-level support for component definition\
    \ modules.\n- **Data structures** - There is support for Maps, Sets, WeakMaps\
    \ and WeakSets.\n\nMost modern browsers have support for ES6. If you want to try\
    \ out ES6 code, there are a few online editors that can help you do so. Below\
    \ are two of my favourites. Both of them provide the next generation of JavaScript\
    \ compilers.\n\n[https://jsbin.com](https://jsbin.com)\n\n[https://babeljs.io/](https://babeljs.io/)\n\
    \nLet’s now look at some simple examples of ES6 JavaScript code. In these examples\
    \ we are going to use JS Bin to enter and run the code.\n\n## Example 55\n\nThe\
    \ following program is a simple example of ES6 scripting.\n\n```\n// ES6 code\
    \ example\nconst greeting = (name) => `Hello, ${name}!`;\nconsole.log(greeting('World'));\n\
    ```\n"
