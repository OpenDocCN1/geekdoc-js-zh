    As an example let us create a new element that we will add to the existing party
    list. We will use the `createElement()` method and add this element to the `newPlan`
    variable.


    ```

    var newPlan = document.createElement("li");

    ```


    Following, we will create a new text node and add its content as a value to the
    `newPlanText` variable.


    ```

    var newPlanText = document.createTextNode("04:00 - Back to home");

    ```


    We can now assign the content of the text node to the `newPlan` element by using
    the `appendChild()` method.


    ```

    newPlan.appendChild(newPlanText);

    ```


    Finally, we would like to add this element to the list. We will use the `getElementById()`
    method to select the list through its `"partyplan"` id, and apply the `appendChild()`
    method to attach the `newPlan` element to the list.


    ```

    document.getElementById("partyplan").appendChild(newPlan);

    ```


    The complete syntax is as follows:


    ```

    var newPlan = document.createElement("li");

    var newPlanText = document.createTextNode("04:00 - Back to home");

    newPlan.appendChild(newPlanText);

    document.getElementById("partyplan").appendChild(newPlan);

    ```


    Image 31. Adding a new `<li>` element


    Using a similar process we can also use DOM manipulation to remove an element
    from the page. As an example let us remove the `<h1>` element which acts as the
    main page heading. We will first select the element through its `id` attribute
    with `"partytitle"` as its value and store that element node in a variable.


    ```

    var removeHeading = document.getElementById("partytitle");

    ```


    Next, we will need to find the parent element which acts as a container for the
    `<h1>` element, which in this case is the `<body>` element. We can either select
    this element directly, or use the `parentNode` property of the previously selected
    element. In either case we will need to store the parent element in another variable.


    ```

    var containerForHeading = removeHeading.parentNode;

    ```


    Finally, we will use the `removeChild()` method on the parent element in order
    to discard the element that we want removed from the page.


    ```

    containerForHeading.removeChild(removeHeading);

    ```


    The complete syntax is as follows:


    ```

    var removeHeading = document.getElementById("partytitle");

    var containerForHeading = removeHeading.parentNode;

    containerForHeading.removeChild(removeHeading);

    ```


    Image 32. Removed heading


    # Chapter 11. Events (Not the Kind You Celebrate)


    If you can finish the new chat feature by tonight, we''ll throw an office party
    to celebrate its release. Nothing fancy, just some drinks, good music and a little
    something to eat …


    The chat code is now stored in a separate JavaScript file and is also a little
    cleaner. But Marty''s not completely happy, there''s still something missing...


    Of course, visitors to the website shouldn''t have to program JS to highlight
    chat members — highlighting should change automatically based on the input in
    the search box.


    In order for that to happen, the code needs to react to user input. Your browser
    provides so-called events for just that purpose (no, we don''t mean events like
    weddings or parties — unfortunately).


    ## Browser Events


    Any exertion of influence by a user, no matter how small, is considered by your
    browser to be an event. An event can be almost anything, including:


    *   clicking on a button

    *   moving your mouse over an image

    *   releasing an input key

    *   leaving an input field using your mouse or by tabbing

    *   finger gestures on a touch screen, e. g. zoom

