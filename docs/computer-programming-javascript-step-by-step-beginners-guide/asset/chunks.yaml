    a tzst’，但不会匹配字符串‘this is a tpst’或字符串‘this is a trst’。你可以使用范围，如 a-z 和 0-9，它们分别匹配从‘a’到‘z’和从‘0’到‘9’的所有字符。例如，正则表达式`/t[a-z]st/`将匹配字符串‘this
    is a test’和‘this is a tkst’，但不会匹配字符串‘this is a t9st’或字符串‘this is a t2st’，而正则表达式`/t[a-z0-9]st/`将匹配此特定示例中提到的所有字符串。


    *   `[^abc]`


    这种形式的表达式用于匹配除 [^ 和 ] 之间的字符或表达式之外的任何内容。例如，正则表达式`/t[^eyz]st/`将匹配字符串‘this is a tpst’和‘this
    is a trst’，但不会匹配字符串‘this is a test’或字符串‘this is a tyst’。你也可以像上述表达式一样使用范围。例如，正则表达式`/t[^a-z]st/`将匹配字符串‘this
    is a t9st’和‘this is a t8st’，但不会匹配字符串‘this is a test’或字符串‘this is a tast’。


    *   `(abc)`


    这种形式的表达式称为捕获组。() 之间的模式会被正常匹配，但会存储在内存中供以后使用；你将在本章后面学习如何在诸如 `.exec()` 等方法中使用此表达式。元字符
    这些是用于匹配特定字符或字符范围的特殊字符序列。一些最常用的元字符包括：


    *   `\w`


    匹配任何单词字符，即任何字母数字字符（包括下划线）。


    *   `\W`


    匹配任何非单词字符。所有不被 `\w` 匹配的字符都会被此匹配。


    *   `\d`


    匹配任何数字，即从 0 到 9 的任何字符。


    *   `\D`


    匹配任何非数字，即除 0 到 9 之外的任何字符。


    *   `\w`


    匹配任何空白字符，例如制表符、空格、行尾等。


    *   `\W`


    匹配任何非空白字符，即除制表符、空格、行尾等空白字符之外的任何字符。


    使用正则表达式 现在你已经学习了如何构建正则表达式，我们可以继续学习如何将它们付诸实践。下面列出的是可以与正则表达式一起使用的方法。


