- fmt: "\nThe increment and decrement operators function by increasing and decreasing,\
    \ respectively, the value of the variable by one. There are two ways to use the\
    \ increment and decrement operators. When the operator is placed after the variable,\
    \ it is called a postfix operator. This means that the mathematical expression\
    \ is evaluated and then the increment takes place. The following code listing\
    \ provides examples on how each variable operator is used. Code Listing: Variable\
    \ Operators\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\"\
    http://www.w3.org/TR/html4/strict.dtd\">\n<html lang=\"en\">\n<head></head>\n\
    <body>\n<script language=\"javascript\" type=\"text/javascript\">\nvar operandOne;\n\
    var operandTwo;\noperandOne = 125;       //Integer\noperandTwo = 15.371;    //Floating\
    \ Point Number\ndocument.write(operandOne);\ndocument.write(\"<br/>\");\ndocument.write(operandTwo);\n\
    document.write(\"<br/>\");\ndocument.write(\"Addition \" + (operandOne + operandTwo));\n\
    document.write(\"<br/>\");\ndocument.write(\"Subtraction \" + (operandOne - operandTwo));\n\
    document.write(\"<br/>\");\ndocument.write(\"Multiplication \" + (operandOne *\
    \ operandTwo));\ndocument.write(\"<br/>\");\ndocument.write(\"Division \" + (operandOne/operandTwo));\n\
    document.write(\"<br/>\");\ndocument.write(\"10 % 3 \" + (10 % 3));\ndocument.write(\"\
    <br/>\");\ndocument.write(\"11 % 3 \" + (11 % 3));\noperandOne++;      //Increment\
    \ Operator Add One to the variable;\noperandTwo--;      //Decrementing One from\
    \ the variable\ndocument.write(\"<br/>\");\ndocument.write(operandOne);\ndocument.write(\"\
    <br/>\");\ndocument.write(operandTwo);\n/*variable++   <--- PostFix Increment\
    \ Operator\n++variable   <--- PreFix Increment Operator\nPostFix- The rest of\
    \ the mathematical expression is evaluated and then\nthe increment takes place\n\
    PreFix-  The increment takes place and then the rest of the expression\nis evaluated*/\n\
    var teamCity;\nvar teamName;\nteamCity =\"New York\";\nteamName= \"Yankees\";\n\
