- fmt: "\nThere're also events which aren't triggered directly by users, and are triggered\
    \ instead through occurrences like network requests or files which have finished\
    \ loading. But first, we'll concentrate only on those events directly related\
    \ to user behavior.\n\n## Dealing With Events as They Come Up: Event Handlers\n\
    \n### Preliminary Measures\n\nFirst, try a small experiment in your console. The\
    \ event you're interested in is a user releasing a key while typing in an input\
    \ field. Look in the chat HTML document and you'll find the input field (`input`\
    \ element) within a `div` element with the id `member_search`:\n\n`<dividmember_search<inputtypetextplaceholder...Find\
    \ a member.../></div>`\n\nFirst, let's select the field using `$('#member_search\
    \ input')`. You'll get back the `input` element as a return value in the console.\
    \ Move your cursor over the element in the console and you'll see that it's the\
    \ right field.\n\nNow, we'll bind an event to that field. To do this, we'll use\
    \ the method `addEventListener`. That method is available on almost every HTML\
    \ element object.\n\n`$('#member_search input').addEventListener( … );`\n\n`addEventListener`\
    \ requires two arguments. The first argument is the event type, in the form of\
    \ a string. The event type we should use in this case is `'keyup'`, or releasing\
    \ a key.\n\n`$('#member_search input').addEventListener('keyup', …);`\n\n`addEventListener`'s\
    \ second argument must be a function — this will be executed by your browser when\
    \ the specified event occurs. In this case, we'll just use a simple function to\
    \ make sure the process is working:\n\n`() => alert(1)`\n\nFYI, the function you\
    \ register on an event is called an event listener or event handler, and it's\
    \ responsible for processing the event you specify.\n\nAnd now our statement is\
    \ complete — let's test it out in the console:\n\n`$('#member_search input').addEventListener('keyup',\
    \ () => alert(1));`\n\nIf you go to the member search input box and type in a\
    \ character, an alert box with the alert `1` will appear as soon as you release\
    \ the key. Of course, this function isn't very useful yet. And maybe clicking\
    \ away alert boxes is making you a little irritated — but at least now you know\
    \ how event handlers work. Mission accomplished!\n\n## Putting Everything Together\n\
    \nNow comes the tough part — you need to combine your existing code for highlighting\
    \ and for event registration into one complete program.\n\nDelete the call `hightlightChatMembers('ert');`\
    \ from your JS file. Instead, your `keyup` event should now trigger the function\
    \ call:\n\n`$('#member_search input').addEventListener('keyup', () => hightlightChatMembers('ert'));`\n\
    \nAnd actually, as soon as you type a key in the search box, the highlighting\
    \ changes. However, instead of permanently highlighting the string `'ert'`, we\
    \ want to use the actual input. But how can we do that?\n\nOnce again, we'll need\
    \ to use the `input` element object. We can retrieve it by using the selector\
    \ `$('#member_search input')`, then query it for the value input by the user.\
    \ We'll find that value in the property `value`, i. e. `$('#member_search input').value`.\
    \ You'll learn more about `value` and other properties in lesson 6.\n\nPutting\
    \ it all together, we get the following statement:\n\n`$('#member_search input').addEventListener('keyup',\
    \ () => hightlightChatMembers($('#member_search input').value));`\n\nWhich then\
    \ gives us the following overall code:\n\n```javascript\n\"use strict\";\n\nconst\
    \ highlightChatMembersBy = partOfMemberName => {\n  chatMembers()\n    .filter(member\
    \ =>\n      doesMemberMatch(partOfMemberName, member))\n    .forEach(highlight);\n\
    };\n\nconst doesMemberMatch = (partOfMemberName, memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n\
    \    .includes(partOfMemberName.toLowerCase());\n\nconst chatMembers = () => $$(\"\
    #chat_members li\");\nconst highlight = el => el.classList.add(\"highlighted\"\
    );\n\nconst $ = document.querySelector.bind(document);\nconst $$ = document.querySelectorAll.bind(document);\n\
    NodeList.prototype.__proto__ = Array.prototype;\n\n$(\"#member_search input\"\
    )\n  .addEventListener(\"keyup\", () =>\n    highlightChatMembersBy($(\"#member_search\
    \ input\").value));\n```\n\nEnter different strings and experiment a little with\
    \ your current implementation. What do you notice?\n\n## Guard Clauses: Protection\
    \ for Your Functions\n\nOops — I just found a bug. If I search for a chat member,\
    \ suddenly all of them are highlighted.\n\nCould you fix that? As it is, we can't\
    \ possibly put the highlight feature online.\n\nOkay, here's the problem — although\
    \ the program is highlighting the matching members, it's not removing that highlighting\
    \ again when the search string is updated.\n\nInstead of going through the trouble\
    \ to find out what highlighting we need to remove, it'd be a lot simpler just\
    \ to remove all highlighting, then highlight only those chat members who match\
    \ the search. To do this, we'll need some additional code which removes the corresponding\
    \ CSS class from all members:\n\n```javascript\nconst removeHighlightsFromAllChatMembers\
    \ = () =>\n  chatMembers().forEach(removeHighlight);\n\nconst removeHighlight\
    \ = el => el.classList.remove('highlighted');\n```\n\nFYI, it's not a problem\
    \ that a few `li` elements with chat members don't have the class `highlighted`\
    \ at all — in that case, nothing will be removed.\n\nOrder the two functions according\
    \ to their level of detail. In addition, we still need to add a call to the new\
    \ function `removeHighlightsFromAllChatMembers`. To do this, we recommend you\
    \ create a higher-level function called `updateHighlightingOfChatMembers`, which\
    \ first removes all highlights (`removeHighlightsFromAllChatMembers`) then marks\
    \ the matching chat members (`hightlightChatMembersBy`):\n\n```javascript\nconst\
    \ updateHighlightingOfChatMembers = partOfMemberName => {\n  removeHighlightsFromAllChatMembers();\n\
    \  hightlightChatMembersBy(partOfMemberName);\n};\n```\n\nNow we just need to\
    \ add the new function `updateHighlightingOfChatMembers` to the event handler\
    \ in place of the function `hightlightChatMembersBy`, which was only responsible\
    \ for highlighting. We then get the following code:\n\n```javascript\n\"use strict\"\
    ;\n\nconst updateHighlightingOfChatMembers = partOfMemberName => {\n  removeHighlightsFromAllChatMembers();\n\
    \  highlightChatMembersBy(partOfMemberName);\n};\n\nconst removeHighlightsFromAllChatMembers\
    \ = () =>\n  chatMembers().forEach(removeHighlight);\n\nconst highlightChatMembersBy\
    \ = partOfMemberName => {\n  chatMembers()\n    .filter(member =>\n      doesMemberMatch(partOfMemberName,\
    \ member))\n    .forEach(highlight);\n};\n\nconst doesMemberMatch = (partOfMemberName,\
    \ memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n    .includes(partOfMemberName.toLowerCase());\n\
    \nconst chatMembers = () => $$(\"#chat_members li\");\nconst highlight = el =>\
    \ el.classList.add(\"highlighted\");\nconst removeHighlight = el => el.classList.remove(\"\
    highlighted\");\n\nconst $ = document.querySelector.bind(document);\nconst $$\
    \ = document.querySelectorAll.bind(document);\nNodeList.prototype.__proto__ =\
    \ Array.prototype;\n\n$(\"#member_search input\")\n  .addEventListener(\"keyup\"\
    , () =>\n    updateHighlightingOfChatMembers($(\"#member_search input\").value));\n\
    ```\n\nThe code from listing 17 works … almost. It works except for the small\
    \ glitch that all members are selected in case of blank input. But the empty string\
    \ occurs in every string!\n\nWe can suppress this behavior just by adding code\
    \ at the beginning of the function `hightlightChatMembersBy` to check whether\
    \ `partOfMemberName` is empty. In case of an empty string, the function just needs\
    \ to refuse to work. Add a `return` to make the function exit prematurely.\n\n\
    `if (partOfMemberName === \"\") return;`\n\nCode like this, which runs before\
    \ the main body of a function is actually executed to make sure the values of\
    \ the arguments passed to the function make sense, are called [guard clauses](http://c2.com/cgi/wiki?GuardClause)\
    \ or just guards. They protect functions from invalid input values.\n\n```javascript\n\
    const hightlightChatMembersBy = partOfMemberName => {\n  if (partOfMemberName\
    \ === \"\") return;\n  chatMembers()\n    .filter(member =>\n      doesMemberMatch(partOfMemberName,\
    \ member))\n    .forEach(highlight);\n};\n```\n\nThe code from listing 18 finally\
    \ behaves like it should. But before you run to Marty to bring him the good news,\
    \ let's take a little time to add a couple of improvements. Your maintenance programmer\
    \ will thank you for that someday!\n\n## Making a Stunning Entrance Using init\n\
    \nThe event registration code is still just kind of out there, with no motivation\
    \ — it would be better to put it into its own function. This will give us a number\
    \ of advantages — the code will be reusable and it'll also have its own name,\
    \ making it easier to identify. In addition, putting the code into a separate\
    \ function will provide us advantages in terms of things we haven't yet covered\
    \ in this class — e. g. the code will be easier to test.\n\nA good function name\
    \ might be `registerEvents`, or even just `init`. If we wanted to, we could get\
    \ even more specific and name the function `registerEventsForChatMemberHighlighting`.\
    \ However, given the context (i. e. our entire file is geared for a specific task)\
    \ the generic `init` is perfectly acceptable.\n\nThe name `init` stands for initialization.\
    \ It's a function which calls all other functions, acting as an entry point into\
    \ the rest of the code in the program. We could essentially name the function\
    \ anything we wanted to, but `init` has already been established as the name for\
    \ such functions. Other programmers can read the function name and understand\
    \ immediately what we mean by it.\n\nBased on our newspaper metaphor, `init`'s\
    \ function definition belongs at the beginning of your code. However, the call\
    \ to `init()` can be made only after all other function have been defined.\n\n\
    ```javascript\n\"use strict\";\n\nconst init = () => $(\"#member_search input\"\
    )\n  .addEventListener(\"keyup\", () =>\n    updateHighlightingOfChatMembers($(\"\
    #member_search input\").value));\n\nconst updateHighlightingOfChatMembers = partOfMemberName\
    \ => {\n  removeHighlightsFromAllChatMembers();\n  hightlightChatMembersBy(partOfMemberName);\n\
    };\n\nconst removeHighlightsFromAllChatMembers = () =>\n  chatMembers().forEach(removeHighlight);\n\
    \nconst hightlightChatMembersBy = partOfMemberName => {\n  if (partOfMemberName\
    \ === \"\") return;\n  chatMembers()\n    .filter(member =>\n      doesMemberMatch(partOfMemberName,\
    \ member))\n    .forEach(highlight);\n};\n\nconst doesMemberMatch = (partOfMemberName,\
    \ memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n    .includes(partOfMemberName.toLowerCase());\n\
    \nconst chatMembers = () => $$(\"#chat_members li\");\nconst highlight = el =>\
    \ el.classList.add(\"highlighted\");\nconst removeHighlight = el => el.classList.remove(\"\
    highlighted\");\n\nconst $ = document.querySelector.bind(document);\nconst $$\
    \ = document.querySelectorAll.bind(document);\nNodeList.prototype.__proto__ =\
    \ Array.prototype;\n\ninit();\n```\n\n## Take a Look Behind the Facade With the\
    \ Event Object\n\nThe fact that our current code can use some improvements will\
    \ become clear once we take a closer look at event registration.\n\n`$('#member_search\
    \ input').addEventListener('keyup', () => hightlightChatMembers($('#member_search\
    \ input').value));`\n\nThe function we'll register as our event handler here is:\n\
    \n`() => hightlightChatMembers($('#member_search input').value);`\n\nThe interesting\
    \ thing to note here is that the function, when it's called by the event, is automatically\
    \ passed the event as an argument. So we just need to implement a parameter to\
    \ capture the event:\n\n`event => hightlightChatMembers($('#member_search input').value);`\n\
    \nWhat can we do with the `event`? One thing would be to print it out to the console\
    \ to see what it contains:\n\n```javascript\nevent => {\n  console.log(event);\n\
    \  hightlightChatMembers($('#member_search input').value);\n}\n```\n\nIf you type\
    \ the letter `a`, the console will show:\n\n`keyup { target: <input>, key: \"\
    a\", charCode: 0, keyCode: 65 }`\n\nIf you click on `keyup`, you'll see that `event`\
    \ is a JS object of \"type\" KeyboardEvent. Keyboard events have a number of very\
    \ interesting properties — the table below shows you just a few:\n\n> In reality,\
    \ JS doesn't have specific object types. It would be more correct to say that\
    \ `keyup` is a JS object which has the `KeyboardEvent` object in its prototype\
    \ chain. We're using the term type here for purposes of simplification. It's only\
    \ to show that all objects of the same \"type\" also have the same properties.\n"
