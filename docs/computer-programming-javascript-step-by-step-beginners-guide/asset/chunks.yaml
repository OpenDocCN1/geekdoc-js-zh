    ## Chapter 5. Form


    Form takes information from the web page visitors and sends it to a back-end application
    such as PHP script, CGI or ASP Script. HTML forms are used to collect data from
    visitors on a site. Forms are important for membership registration on a website,
    online shopping, or a job application form. For instance, during user registration,
    information such as email address, name, credit card, and so on would be collected.
    Then required processing would be performed on the sent data based on the specific
    logic contained in the back-end application. There are different available form
    elements such as the text area fields, radio buttons, drop-down menus, checkboxes,
    etc.


    ### Form structure


    `<form>`


    HTML form is created with the `<form>` element. This tag must carry the `action`
    attribute at all times and would occasionally have an `id` and `method` attribute
    too.


    ### Action


    An `action` attribute is required for every `<form>` element. The value of the
    `action` attribute is the URL it contains for the page on the server which retrieves
    the information contained in the submitted form.


    ### Method


    Forms go to the back-end application in two ways. They “get” or “post”.


    #### Get


    The GET method enables value from the form to return to the end of the specified
    URL in the `action` attribute. The GET method is perfect for data collection from
    the web server. The technique ensures parameter stores in the browser cache. There
    are limits of the quantity of information this method can send. Do not use the
    GET method while dealing with sensitive information such as passwords or credit
    card numbers because of the process that displays in the browser''s address bar
    is visible to everyone.


    #### Post


    The POST method sends values through the HTTP headers. The POST method is perfect
    when the form contains sensitive information such as passwords and when visitors
    need to upload files. Parameters do not get saved in web server cache or browser
    history. The POST method is safer than the GET method.


    ### Id


    This value specifies a unique identity for an HTML form from other elements on
    the page.


    ### Text input


    The `<input>` tag enables the creation of different form controls. The type of
    attribute value determines the type of input created.


    #### `type="text"`


    With the `type` attribute value of the text, it creates a single line of text.


    #### Name


    When information is entered into a form by the user, the server demands to know
    what value the control data holds. For instance, in a login form, the server wants
    to know which declares the username and the password. Each form control needs
    the `name` attribute, and the attribute value recognizes the form control which
    is sent together with the information entered into the server.


    #### Max length


    The `maxlength` attribute can be used to determine the number of characters entered
    into a text field. The value of the `maxlength` attribute is the number of characters
    that it holds.


    ### Password input


    #### `type="password"`


    The `<input>` tag of type `"password"` creates a way for users to input a password
    safely. The element presents a one-line plain text editor control replacing characters
    with a symbol such as the (`"*"`) or a dot (`" • "`) which cannot be read and
    keeps the text secured.


    #### Name


    This attribute specifies the name of the password input which is transferred to
    the server including the password visitors enter.


    ```

    <body>

    <form action="http://www.alabiansolutions.com/login.php">

    <p>Username:<input type="text" name="username" size="15" maxlength="30" /></p>

    <p>Password:<input type="password" name="password" size="15" maxlength="30" /></p>

    </form>

    </body>

    ```


    ### Textarea


    A multi-line input is created with the `<textarea>` element. The `<textarea>`
    is not an empty element compared to other input elements, therefore, it should
    contain an opening and closing tag. Texts that surface between the opening `<textarea>`
    and closing `</textarea>` elements will be displayed in the text box when the
    page is loaded.


    ```

    <form action="process.php">

    <p>What did you think of this gig? </p>

    <textarea name="comment"></textarea>

    </form>

    ```


    ### Radio Button


    The `<input type="radio">` element represents a radio button. It is used to create
    several selectable options.


    #### Name


    To be treated as a group, the value of the `name` attribute must correspond with
    the radio group because selecting any other radio button in the same group deselects
    the first selected button. A lot of radio groups can be created on a page as long
    as each has its name.


    #### Value


    The `value` attribute indicates the unique value connected with each selected
    option. Values of each button in a group should be different so the server can
    recognise the selected option.


    #### Checked


    The `checked` attribute specifies the selected value when the page loads. This
    attribute should be used by one radio button in a group.


    ```

    <body>

    Pizza Size:

    <label><input type="radio" name="size" value="small"/>Small</label>

    <label><input type="radio" name="size" value="medium"/>Medium</label>

    <label><input type="radio" name="size" value="large"/>Large</label>

    </body>

    ```


    ### Checkbox


    Checkbox is used to select and deselect one or more options.


    #### `type="checkbox"`


    Users are permitted to select or deselect one or more options in response to a
    question.


    #### Name


    This attribute is transferred to the server alongside the value of the option(s)
    selected by the user. The `name` attribute value must remain the same for all
    buttons when users have to respond to questions with options for answers in the
    checkboxes form.


    #### Value


    When a checkbox is checked, this attribute specifies the value sent to the server.


    #### Checked


    The `checked` attribute specifies the box that should be checked when the page
    is being loaded.


    ```

    <body>

    Pizza Toppings:

    <label><input type="checkbox" value="bacon" />Bacon</label>

    <label><input type="checkbox" value="extra cheese" />Extra Cheese</label>

    <label><input type="checkbox" value="extra cheese" />Onion</label>

    </body>

    ```


    ### Dropdown list box


    A select Box, also known as the Drop-down list box enables the user to choose
    one option from a drop-down list. A drop-down list box is created with the `<select>`
    tag, and it consists of two or more `<option>` tags.


    #### Name


    The `name` attribute shows the form control name, which is being sent to the server
    together with the value selected by the user.


    #### `<option>`


    This element is used to indicate the options for a visitor. The text in-between
    the opening `<option>` and closing `</option>` elements will be displayed to the
    visitor in a drop-down box.


    #### Value


    The `<option>` tag utilises the `value` attribute to specify the value sent to
    the server together with the control name when the option is selected.


    #### Selected


    This attribute is used to specify the option that should be automatically selected
    when the page loads.


    ```

    <body>

    <label>Phones:

    <select name="devices">

    <option value="techno">Sony</option>

    <option value="infinix">Infinix</option>

    <option value="samsung">Samsung</option>

    <option value="sony" selected>Choose a device</option>

    </select>

    </label>

    </body>

    ```


    ### File input box


    The file input box is used to enable users to upload a file on a web page. A file
    could be an image, audio, PDF or video.


    #### `type="file"`


    This input produces a box, a text input lookalike accompanied with a browse button.
    When the browse button is selected, a window pops up which enables users to select
    a file from their computer in order to be uploaded on the site.


    ```

    <form action=” process.php” method="post">

    <p>Upload your songs in MP3 format:</p>

    <input type="file" name="user-song" /><br />

    <input type="submit" value="Upload" />

    </form>

    ```


    #### `type="submit"`


    This attribute is used when a user needs to submit a form.


    ```

    <body>

    <form action="process.php" method="post">

    <p>Subscribe to our email list:</p>

    <input type="text" name="email" value="email" />

    <input type="submit" value="subscribe" />

    </form>

    </body>

    ```


    #### Name


    It can use a `name` attribute although it’s not necessary.


    #### Value


    The `value` attribute is used to influence the appearance of the text on a button.
    It is advisable to designate the words that appear on a button because buttons
    default value on some browsers is "Submit query" and this can be inappropriate
    for forms.


    ### Reset button


    #### `type="reset"`


    This button is used to erase all inputs by the user.


    ```

    <input type="reset" value="Reset" />

    ```


    ### Image button


    An image can be used for the submit button. The `type` attribute must be given
    the value of the image. The `src` attribute can also be provided.


    ```

    <form action="http://www.websitename.com/subscribe.php">

    <p>Subscribe to our email list:</p>

    <input type="text" name="email" />

    <input type="image" src="subscribe.png" width="100" height="20" alt="Subscribe"
    />

    </form>

    ```


    ### Button Tag


    The `<button>` tag specifies a button that can be clicked. Texts, content, or
    images can be inserted into the `<button>` element. The buttons created with the
    `<input>` element is different from buttons created with the `<button>` tag. The
    `<button>` element attribute `type` should always be specified.


    ```

    <button type="submit">Click Me! </button>

    ```


    ### Fieldset Element


    Longer forms benefit a lot from the `<fieldset>` element. It is used to group
    form controls that are related together.


    ```

    <form method="post">

    <fieldset>

    <legend>Contact Details</legend>

    <label>Address:<br><input type="text" name="text"><br></label>

    <label>Phone Number:<br><input type="number" name="number"><br></label>

    <label>Email:<br><input type="email" name="email"><br></label>

    </fieldset>

    </form>

    ```


    ### Legend element


    The `<legend>` element appears immediately after the opening `<fieldset>` tag
    and consists of a caption which identifies the motive of that form control group.


    ```

    <form method="post">

    <fieldset>

    <legend>Contact Details</legend>

    <label>Address:<br><input type="text" name="text"><br></label>

    <label>Phone Number:<br><input type="number" name="number"><br></label>

    <label>Email:<br><input type="email" name="email"><br></label>

    </fieldset>

    </form>

    ```


    ### Label element


    The label tag can be used to caption a form control so that users would know what
    should be entered into the area.


    ```

    <form >

    <label for="male">Male</label>

    <input type="radio" name="gender" id="male" value="male"><br>

    <label for="female">Female</label>

    <input type="radio" name="gender" id="female" value="female"><br>

    <label for="other">Other</label>

    <input type="radio" name="gender" id="other" value="other"><br><br>

    <input type="submit" value="Submit">

    </form>

    ```


    ## Chapter 6. Iframe and Multimedia


    ### Iframe


    The `<iframe>` element can be used to embed web pages into your web page.


    #### Iframe embeds: Google Map


    Google map can be embedded into your webpage using the iframe tag.


    ```

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3963.341775346873!2d3.3422253148425853!3d6.604381995223933!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b8d7c33eb87b3%3A0xfc23c9556f669273!2sWebsite+Name!5e0!3m2!1sen!2sng!4v1516009132030"
    width="600" height="450" frameborder="0" style="border:0" allowfullscreen></iframe>

    ```


    #### Iframe embeds: YouTube


    ```

    <body>

    <iframe width="450" height="400" src="https://www.youtube.com/embed/MhPGaOTiK0A"
    frameborder="0" allowfullscreen></iframe>

    </body>

    ```


    ### Multimedia in HTML5


    HTML5 enables users to embed video or audio using the native HTML tags. The browser
    will give users control to play the file if it supports it. Both audio and video
    tags are new features and can be used on the recent version of browsers. Popular
    video formats are `.mp4`, `.m4v`, Flash Video (`.flv`), Audio Video Interleave
    (`.avi`) etc.


    #### The video element:


    A video player can be embedded using the video element for a specific video file.
    Those attributes are used to customize the player: `preload`, `loop`, `autoplay`,
    `poster`, `auto` and `controls`.


    ##### Preload


    The `preload` attribute instructs the browser on what action to take when the
    page loads. One of these three values can occur:


    - `None`: The video should not load automatically when the page loads until the
    user clicks play.

    - `Auto`: When the page loads the browser should download the video.

    - `Metadata`: This means that information such as first frame, size, track list
    and duration should be received by the browser.


    ##### Src


    The path to the video is specified by this attribute.


    ##### Poster


    This attribute enables users to direct an image to be displayed while the video
    downloads or until the user decides to play the video.


    ##### Width, height


    The size of the player is specified with these attributes.


    ##### Controls


    This attribute specifies that the browser should provide its own controls for
    playback when used.


    ##### Autoplay


    This attribute indicates that the file should play automatically when used.


    ##### Loop


    This attribute specifies that the video should start playing again from the beginning
    the moment it ends when utilized.


    #### Multiple video formats


    HTML5 enables users state multiple sources for audio and video elements so that
    browsers can use any one that works for them.


    ```

    <video poster="images/calvin.jpg" controls preload="none" width="450" height="420">

    <source src="calvin.mp4" type="video/mp4" />

    <source src="calvin.webm" type="video/webm" />

    <source src="calvin.ogv" type="video/ogv" />

    <p>Calvin Harris music video</p>

    </video>

    ```


    #### The audio element


    Embedding an audio player into a page for a particular audio file is done using
    the audio element. Different attributes can be used to customize the player, attributes
    such as `autoplay`, `controls`, `loop` and `preload`.


    ##### Autoplay


    This is a boolean attribute. If utilized, the audio will play automatically and
    continue without stopping.


    ##### Loop


    The `loop` attribute is also a boolean attribute, and it states that the audio
    will restart over and over again every time the audio ends.


    ```

    <body>

    <audio src="avicii.mp3" controls="true" autobuffer="true"></audio>

    </body>

    ```


    #### Control


    Audio controls are inserted using the `control` attribute, and it includes controls
    like pause, play, and volume. The `<source>` element enables the user to indicate
    alternative audio files that the browser could choose from. The browser would
    recognize the first organized format. Texts between the `<audio>` and `</audio>`
    elements will be displayed in browsers that do not recognize the `<audio>` element.


    ```

    <audio src="audio/test-audio.ogg" controls autoplay>

    <p>This browser does not support our audio format. </p>

    </audio>

    ```


    #### Multiple audio formats


    ```

    <audio controls autoplay>

    <source src="audio/test-audio.ogg" />

    <source src="audio/test-audio.mp3" />

    <p>This browser does not support our audio format. </p>

    </audio>

    ```


