    document.write(fullTeamInfo);\n</script>\n</body>\n</html>\n```\n\n为了更好地理解拼接的工作原理，前面的代码中演示了一个拼接两个字符串变量并输出它们的示例。我们创建了一个名为\
    \ `fullTeamInfo` 的新变量，并将两个变量 `teamCity` 和 `teamName` 拼接起来。我们还在引号内拼接了一个空格，以便两个字符串变量之间正确留出间距。输出结果为“New\
    \ York Yankees”。\n\n这是浏览器中显示输出的截图。这里展示了所有可能的拼接用法；还演示了所有四种数学运算，包括取模运算符。\n\n## 复习问题\n\
    \n1. 当“`+`”符号放在数值变量旁边时，它表示什么？\n   - a. 将值相加。\n   - b. 将值相减。\n   - c. 将值拼接。\n \
    \  - d. 将值相除。\n2. 当“`+`”符号放在两个字符串值之间时，它表示什么？\n   - a. 将值相加。\n   - b. 将值相减。\n \
    \  - c. 将值拼接。\n   - d. 将值相除。\n3. `%` 运算符的作用是什么？\n   - a. 给出除法的和。\n   - b. 给出除法后的余数。\n\
    \   - c. 给出乘法的积。\n   - d. 给出减法的差。\n4. 哪个是递增运算符？\n   - a. `–`\n   - b. `*`\n  \
