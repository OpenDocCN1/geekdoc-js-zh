    y of the preceding expression, where x and y both are positive integers and x
    is less than or equal to y. For example, the regular expression `/te{3, 6}st/`
    will match the string ‘this is a teeest’ and ‘this is a teeeeest’ but won’t match
    the string ‘this is a test’ or the string ‘this is a teeeeeeest’.


    *   `{x, }`


    This form of expression is used to match at-least x occurrences of the preceding
    expression, where x is a positive integer. For example, the regular expression
