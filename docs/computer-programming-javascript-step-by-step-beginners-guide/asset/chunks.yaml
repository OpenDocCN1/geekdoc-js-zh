    \ + (operand1 * operand2));\ndocument.write(\"<br/>\");\ndocument.write(operand1\
    \ +\" / \"+operand2 + \"=\" + (operand1 / operand2));\ndocument.write(\"<br/>\"\
    );\ndocument.write(\"After increment, \" + operand1 + \" is now \");\noperand1++;\n\
    document.write(operand1);\ndocument.write(\"<br/>\");\ndocument.write(\"After\
    \ decrement, \" + operand2 + \" is now \");\noperand2--;\ndocument.write(operand2);\n\
    document.write(\"<br/>\");\n/* Since there were no instructions to display the\
    \ values of the first five variables that were asked to be declared and assigned,\
    \ they will not be seen in the output */\n</script>\n</body>\n</html>\n```\n\n\
    在本章中，我们学习了变量、变量的声明、初始化以及组合初始化/声明。你还学习了如何输出变量。我们还讨论了运算符，包括赋值运算符和算术运算符。你了解到加号（`+`）可以用作加法运算符或拼接运算符，并学习了如何拼接字符串和变量。\n\
    \n# 第 13 章 JavaScript 基础\n\n由于本章内容相当丰富，以下是你可以期待学习的内容概述：\n\n1. 数据类型——JavaScript\
    \ 如何对信息进行分类。这很重要，因为了解你拥有的信息类型也会告诉你可以用这些信息做什么（例如，你不能用 5 乘以苹果）。\n2. 比较运算符——让你比较某些类型的信息（例如，5\
    \ 是否小于 10？）。当你希望计算机根据特定条件是否满足来执行指令时（例如，仅当 `age` 大于或等于 18 时才允许用户注册），这非常有用。\n3.\
    \ `console.log()`——让你显示单行代码的输出——当你希望查看程序中每行代码的信息流动方式时非常有用。\n4. 流程控制——`if-else`\
    \ 语句根据满足的条件为计算机提供不同的执行指令（例如，如果 `age` 大于 18，则允许用户进入网站，否则显示错误消息）。\n5. 调试——当你的程序行为异常时（例如，拼错用户名或完全忘记用户名），你需要找出代码中哪个部分破坏了程序的行为——这个过程称为调试。当代码超过一千行时，这可能会变得相当棘手——知道从哪里查找会很有帮助。\n\
    \n到目前为止，你已经使用 JavaScript 处理过字符串和数字。在编程世界中，这些信息类别被称为数据类型。\n\n## 数据类型\n\n数据类型只是告诉计算机你的信息应该如何被读取。例如，如果你在控制台中输入以下内容：\n\
    \n```\n\"5\" + \"5\"\n```\n\n"
- fmt: "\nYou’d get `\"55\"`. This is because by enclosing `5` using quotation marks,\
    \ you’re telling the interpreter that you want `5` to be treated as a string,\
    \ not a number. The addition operator, then, instead of adding the two numbers,\
    \ combines the two strings. Now try removing the quotation marks and notice how\
    \ the output changes to `10`. There are different things you can do with different\
    \ data types, so it’s extremely important to know which one to use:\n\n1. **Strings**\
    \ – Anything you enclose in quotation marks will end up being a string. This can\
    \ be a combination of letters, spaces, numbers, punctuation marks, and other symbols.\
    \ Without strings, you wouldn’t be able to get the user’s name, address, email,\
    \ and other important details.\n\n2. **Numbers** – Self-explanatory; numbers are\
    \ the ones you can perform addition, subtraction, multiplication, and division\
    \ to, among other mathematical operations. Remember not to put quotation marks\
    \ or you’ll turn them into strings!\n\nSo far, we now have strings and numbers\
    \ at our disposal, but remember the console output when you’ve tried playing with\
    \ confirmation dialogues? Whenever you press OK, the console returns `true`, and\
    \ whenever you press CANCEL, the console returns `false`. These outputs aren’t\
    \ surrounded by quotation marks, but they surely aren’t numbers, so what in the\
    \ world are they?\n\n3. **Booleans** – Booleans are data types that can only be\
    \ either `true` or `false`. This is different from a string or a number, because\
    \ it helps the computer make decisions based on whether or not certain conditions\
    \ are met. For example, if you want to prevent minors from registering in your\
    \ site, you’d have to have some sort of code to separate minors from the adults,\
    \ like:\n\n```\nvar age = 17\nage >= 18\n```\n\nThe console, then, returns `false`\
    \ because the age is under 18. Now try the following mathematical expressions\
    \ out and see what you get:\n\n```\n5 > 10\n```\n\n```\n6 < 12\n```\n\nThe first\
    \ line should return `false`, while the second line should return `true`.\n\n\
    ## Comparison Operators\n\nSo far, we’ve talked about three data types (numbers,\
    \ strings, and booleans), as well as some basic mathematical operators (`+`, `-`,\
    \ `*`, `/`). What you’ve just used to test out booleans, however, are comparison\
    \ operators (`<`, `>`, `=`), which are extremely important in managing the flow\
    \ of your program. Here’s the complete list and what they can do:\n\n- `>` Greater\
    \ than\n- `<` Less than\n- `>=` Greater than or equal to\n- `<=` Less than or\
    \ equal to\n- `==` Equal to\n- `!=` Not equal to\n\nTo test out these operators,\
    \ replace the `@` symbol with the correct operator in the following statements\
    \ in order to make the console output `true`:\n\n```\nconsole.log(5 @ 1);\nconsole.log(1\
    \ @ 5);\nconsole.log(5 @ 2);\nconsole.log(1 @ 6);\nconsole.log(5 @ 5);\nconsole.log(10\
    \ @ 5);\n```\n\n## Knowing what the Interpreter is Thinking\n\nNotice how the\
    \ JavaScript interpreter only gives you the latest output of the commands you\
    \ type in, so if you’ve typed in three lines of code that should have different\
    \ outputs:\n\n```\n5 > 10\n6 < 12\n7 > 14\n```\n\nExecuting them all at the same\
    \ time in the console, you’d only get the result of the last line (`false`). You\
    \ can, instead, enter each line of code individually so you can see the output\
    \ of each command, but this gets especially tedious in larger bits of code. When\
    \ you get to more complicated stuff, you’ll eventually run into more errors and\
    \ bugs. When this happens, you’ll want to know what happens in specific commands\
    \ you give so that you can pinpoint exactly where things go wrong.\n\n`console.log()`\
    \ takes whatever code you put inside and logs its execution to the console. That\
    \ being said, let’s see `console.log()` in action:\n\n```\nconsole.log(5 > 10)\n\
    console.log(6 < 12)\nconsole.log(7 > 14)\n```\n\nNow you can see the output of\
    \ each line of code!\n\n## Flow Control\n\nYou now know the most basic data types,\
    \ mathematical operators, comparison operators, and a couple of neat console tricks.\
    \ In order to make them useful, however, we need to be able to manipulate the\
    \ flow of commands. For instance, if you wanted to create a user registration\
    \ form that asks for the user’s name, email address, age, and password, you’d\
    \ first declare the variables as:\n\n```\nvar name;\nvar email;\nvar age;\nvar\
    \ password;\n```\n\nNow we’d need to store the user’s input. For now, we use the\
    \ `prompt` function:\n\n```\nname = prompt('What’s your name?');\nemail = prompt('What’s\
    \ your email?');\nage = prompt('What’s your age?');\npassword = prompt('Please\
    \ enter your desired password: ');\n```\n\nAssuming you’ve entered the right kind\
    \ of information in the data fields, the `name`, `email`, `age`, and `password`\
    \ variables now have the right type of data to process and store. What if, however,\
    \ the user leaves the email field blank, or the age field with a letter? We can’t\
    \ just let the program continue if some of the vital fields of information don’t\
    \ have the right kind of data, therefore we use flow control statements. The first\
    \ one we shall discuss is the `if` statement.\n\n### If Statement\n\nIf you’ve\
    \ already programmed before, the structure of an `if` statement in JavaScript\
    \ should be almost identical to the one you’re familiar with:\n\n```\nif (<condition>){\n\
    \  <action>\n}\n```\n\nIf you haven’t already programmed before, an `if`-statement\
    \ basically tells the computer to do whatever is inside the curly brackets (`{}`)\
    \ if the `if` condition is `true`. If we want to, for instance, prevent the user\
    \ from entering a blank field, we can do the following:\n\n```\nname = prompt('What’s\
    \ your name?');\nif (name.length == 0){\n  name = prompt('You cannot leave this\
    \ empty. What’s your name?');\n}\nemail = prompt('What’s your email?');\nif (email.length\
    \ == 0){\n  email = prompt('You cannot leave this empty. What’s your email address?');\n\
    }\nage = prompt('What’s your age?');\nif (age.length == 0){\n  age = prompt('You\
    \ cannot leave this empty. What’s your age?');\n}\npassword = prompt('Please enter\
    \ your desired password: ');\nif (password.length == 0){\n  password = prompt('You\
    \ cannot leave this empty. Please enter your desired password:');\n}\n```\n\n\
    The code can seem overwhelming for the first-time programmer, but when you read\
    \ each line carefully, you’ll see that they follow quite a neat and logical structure:\n\
    \n1. First, since the `prompt()` function gives you whatever the user types in,\
    \ you store the string inside a variable so you can use it later in the program.\n\
    2. The `if` statements check if the variable is empty by checking if the length\
    \ is equal to zero or not.\n   a. If the length is equal to zero, it asks for\
    \ input again.\n   b. If the length isn’t equal to zero, it doesn’t ask for input\
    \ again.\n\nTake note that this sample code only serves to illustrate how the\
    \ `if` statement works. Under no circumstances should you keep using the `prompt()`\
    \ function to ask the user for information.\n\nNow, what if you want to do something\
    \ else in case your first condition isn’t met? For instance, what if you want\
    \ to say `\"Your name is <name>. Got it!\"` after the user types in a valid name?\
    \ Then we add an `else` condition, followed by a second pair of curly braces that\
    \ enclose the second set of commands:\n\n```\nname = prompt('What’s your name?');\n\
    if (name.length == 0){\n  name = prompt('You cannot leave this empty. What’s your\
    \ name?');\n} else {\n  alert('Your name is ' + name + '. Got it!');\n}\nemail\
    \ = prompt('What’s your email?');\nif (email.length == 0){\n  email = prompt('You\
    \ cannot leave this empty. What’s your email address?');\n} else {\n  alert('Your\
    \ email is ' + email + '. Got it!');\n}\nage = prompt('What’s your age?');\nif\
    \ (age.length == 0){\n  age = prompt('You cannot leave this empty. What’s your\
    \ age?');\n} else {\n  alert('Your age is ' + age + '. Got it!');\n}\npassword\
    \ = prompt('Please enter your desired password: ');\nif (password.length == 0){\n\
    \  password = prompt('You cannot leave this empty. Please enter your desired password:');\n\
    } else {\n  alert('Your password is ' + password + '. Got it!');\n}\n```\n"
