  toc: []
  trans: "\n\n1.  `write(\"string\")` - 它将字符串写入文档。\n2.  `writeln(\"string\")` - 它将字符串写入文档并添加换行符。\n\
    3.  `getElementById()` - 返回具有指定 id 的元素。\n4.  `getElementsByName()` - 返回所有具有指定\
    \ name 的元素。\n5.  `getElementsByTagName()` - 返回所有具有指定标签名的元素。\n6.  `getElementsByClassName()`\
    \ - 返回所有具有指定类名的元素。\n\n访问字段值  \nDOM 是获取输入字段值的好方法。很多时候你需要从用户那里获取输入。这可以通过以下属性实现：\
    \  \n`document.form_name.field_name.value`  \n\n其中：\n*   `document` - 是表示根元素的\
    \ HTML 文档。\n*   `form_name` - 是包含字段的表单的名称。\n*   `field_name` - 是输入文本的名称。\n*  \
    \ `value` - 是一个属性，返回输入文本的值。\n\n"
- fmt: "\nConsider the following example:\n\n```\n<html><body><script type=\"text/javascript\"\
    >\n  function readValue(){\n  var name=document. memberform. memberName. value;\n\
    \  alert( \"Hi: \" + name);\n  }\n  </script>\n  <form name=\"memberform\">\n\
    \  Enter Name:<input type=\"text\" name=\"memberName\" />\n  <input type=\"button\"\
    \ onclick=\"readValue()\" value=\"Click Here\" />\n  </form>\n  </body></html>\n\
    ```\n\nWhen you run the code, it will give you the following simple form:\nJust\
    \ enter your name in the input field and click the Click Here button. See what\
    \ happens.\nYou will get an alert box with your name and some text appended to\
    \ it:\nWe simply created a simple form with an input text field. The method `readValue()`\
    \ helps us get the value that we enter into the field. Consider the following\
    \ line:\n`var name=document. memberform. memberName. value;`\nThe `memberName`\
    \ is the name given to the text field in the form, and these must match, otherwise,\
    \ you will not the right results.\n\n## getElementById()\n\nOther than the name,\
    \ we can also get the element by its id. This can be done using the `document.getElementById()`\
    \ method. However, the input text field should be given an id.\nFor example:\n\
    \n```\n<html><body><script type=\"text/javascript\">\n  function computeSquare(){\n\
    \  var x=document. getElementById( \"integer\" ). value;\n  alert( x * x);\n \
    \ }\n  </script>\n  <form>\n  Enter an Integer:<input type=\"text\" id=\"integer\"\
    \ name=\"myNumber\" /><br/>\n  <input type=\"button\" value=\"Compute Square\"\
    \ onclick=\"computeSquare()\" />\n  </form>\n  </body></html>\n```\n\nThe code\
    \ should give you the following simple form upon execution:\nEnter a number in\
    \ the input field and click the Compute Square button.\nThis should return the\
    \ square of the number in a popup box as shown below:\nIn the example, we have\
    \ defined the `computeSquare()` method which helps us get the square of a number\
    \ entered in the input text field. Consider the following line:\n`var x=document.\
    \ getElementById( \"integer\" ). value;`\nIn the line, we have used the `getElementById()`\
    \ method which takes the id of the input text field as the argument. The method\
    \ helps us get the value typed in the input text field using its id.\n\n## getElementsByName()\n\
    \nThe `document.getElementsByName()` method can help us get an element by its\
    \ name. The method has the syntax given below:\n`document. getElementsByName(\
    \ \"name\" )`\nThe name is needed.\nExample:\n\n```\n<html><body><script type=\"\
    text/javascript\">\n  function getNumber()\n  {\n  var options=document. getElementsByName(\
    \ \"option\" );\n  alert( \"Total Options:\" + options . length );\n  }\n  </script>\n\
    \  <form>\n  Yes:<input type=\"radio\" name=\"option\" value=\"yes\" >\n  No:<input\
    \ type=\"radio\" name=\"option\" value=\"no\" >\n  <input type=\"button\" onclick=\"\
    getNumber()\" value=\"Available Options\" >\n  </form></body></html>\n```\n\n\
    Upon execution, the code returns the following:\nClick the Available Options button\
    \ and see what happens. A popup window will be shown as follows:\nWe have created\
    \ two radio buttons with options Yes and No. Note that these two input types have\
    \ been given the same name, that is, `option`.\nConsider the following line:\n\
    `var options=document. getElementsByName( \"option\" );`\nThe line helps us count\
    \ the number of elements with the name `option`. This should be 2 as shown in\
    \ the output.\n\n## getElementsByTagName()\n\nThe `document.getElementsByTagName()`\
    \ property returns the elements with the tag name which is specified. It takes\
    \ the syntax given below:\n`document. getElementsByTagName( \"name\" )`\nFor example:\n\
    \n```\n<html><body><script type=\"text/javascript\">\n  function allparagraphs(){\n\
    \  var pgs=document. getElementsByTagName( \"p\" );\n  alert( \"Total paragraphs\
    \ are: \"+ pgs . length );\n  }\n  </script>\n  <p> This is a paragraph</p>\n\
    \  <p> This is a paragraph</p>\n  <p> This is a paragraph</p><p> This is a paragraph</p><button\
    \ onclick=\"allparagraphs()\"> Total Paragraphs</button>\n  </body></html>\n```\n\
    \nThe code returns the following upon execution:\nClick the Total Paragraphs button\
    \ and see what happens.\nYou will see the following popup:\nThis means that the\
    \ code was able to count the number of paragraphs that we have.\nThe main logic\
    \ lies in the following line:\n`var pgs=document. getElementsByTagName( \"p\"\
    \ );`\nWe have passed the tag “p” as the argument to our method, and the tag represents\
    \ a paragraph. There are three elements with the tag “p”, so the output should\
    \ be 4 paragraphs.\n\nHere is another example:\n\n```\n<html><body><script type=\"\
    text/javascript\">\n  function countheader2(){\n  var h2count=document. getElementsByTagName(\
    \ \"h2\" );\n  alert( \"Total count for h2 tags: \"+ h2count . length );\n  }\n\
    \  function countheader3(){\n  var h3count=document. getElementsByTagName( \"\
    h3\" );\n  alert( \"Total count for h3 tags: \"+ h3count . length );\n  }\n  </script>\n\
    \  <h2> A h2 tag</h2>\n  <h2> A h2 tag</h2><h2> A h2 tag</h2><h2> A h2 tag</h2><h3>\
    \ A h3 tag</h3>\n  <h3> A h3 tag</h3>\n  <h3> A h3 tag</h3><h3> A h3 tag</h3><h3>\
    \ A h3 tag</h3><button onclick=\"countheader2()\"> Total h2</button>\n  <button\
    \ onclick=\"countheader3()\"> Total h3</button>\n  </body></html>\n```\n\nThe\
    \ code returns the following output upon execution:\nWe have a total of 4 h2 tags\
    \ and a total of 5 h3 tags. Click the Total h2 button and see what happens.\n\
    You should get the following popup box:\nClick the Total h3 button and see what\
    \ happens.\nYou should get the following popup box:\n\n## innerHTML\n\nThis property\
    \ can be used for addition of a dynamic content to an html page. It is used on\
    \ html pages when there is a need to generate a dynamic content like comment form,\
    \ registration form, etc.\nConsider the following example:\n\n```\n<html><body><script\
    \ type=\"text/javascript\">\n  function displayform() {\n  var data = \"Username:<br><input\
    \ type='text' name='name'><br>Comment:<br><textarea rows='6' cols='45'></textarea><br><input\
    \ type='submit' value='Contact us'>\";\n    document. getElementById( 'area' ).\
    \ innerHTML= data;\n  }\n  </script>\n  <form name=\"form1\">\n  <input type=\"\
    button\" value=\"Contact us\" onclick=\"displayform()\" >\n  <div id=\"area\"\
    ></div>\n  </form>\n  </body></html>\n```\n\nThe code returns the following button\
    \ upon execution:\nClick the button and see what happens. You will get the following:\n\
    What we have done is that we are creating a contact us form after the user has\
    \ clicked a button. Note that the html form has been generated within a div that\
    \ we have created and given it the name `area`. To identify the position, we have\
    \ called the `document.getElementById()` method.\n\n## innerText\n\nWe can use\
    \ this property to add a dynamic property into an HTML page. Note that when this\
    \ property is used, your text is interpreted as a normal text rather than as html\
    \ content. A good application of this is when you need to write the strength of\
    \ a password based on its length, write a validation message etc.\nFor example:\n\
    \n```\n<html><body><script type=\"text/javascript\">\n  function validatePass()\
    \ {\n  var message;\n  if(document. form1. userPass. value. length> 5 ){\n  message=\
    \ \"good\" ;\n  }\n  else{\n  message= \"poor\" ;\n  }\n  document. getElementById(\
    \ 'area' ). innerText= message;\n  }\n  </script>\n  <form name=\"form1\">\n \
    \ <input type=\"password\" value=\"\" name=\"userPass\" onkeyup=\"validatePass()\"\
    \ >\n  Strength:<span id=\"area\"> Pasword strength </span>\n  </form>\n  </body></html>\n\
    ```\n\nThe code returns the following upon execution:\nJust begin to type the\
    \ password and see what happens to the text on the right of the input field as\
    \ you type. If you type less than 5 characters for the password, the message will\
    \ change to poor as shown below:\nContinue to type the password until you have\
    \ more than 5 characters. You will see the message change to good as shown below:\n\
    That is how powerful this property is.\n\n## Animations\n\nWith JavaScript, we\
    \ can animate elements. We can use JavaScript to move elements such as `<img />`,\
    \ `<div>` etc. on a page depending on an equation. The following are the common\
    \ methods used for animations in JavaScript:\n\n1.  `setTimeout(method, time)`\
    \ - this method will call the method after some time in milliseconds.\n"
