    # String & number data types


    JavaScript encodes strings in so-called UTF-16 character format [ECMA-262]. An
    encoding format is responsible for how characters are represented digitally. UTF-16
    makes it possible for you to use a wide variety of special characters as well
    as specific letters from different languages (e. g. German umlauts, accented French
    characters, etc.).


    The value range for numbers is also limited. However, as long as you don''t carry
    out any astronomical calculations, you should be safe.


    It''s easy to find out the data type of a literal — just use the JavaScript operator
    `typeof`. `typeof` returns a string which tells you the literal''s data type.


    ## Examples


    ```

    "use strict";

    console.log(typeof 3764);           // => number

    console.log(typeof "beautiful JS"); // => string

    console.log(typeof 27.31);          // => number

    ```


    `Listing 7` `accompanying_files/03/examples/type.js`


    ## Exercise 5: Hmmm... So What are You Really?


    What is the data type of the following literal?


    `"42"`


    # Chapter 10. Document Object Model (DOM)


    The `document` object is an object that is created by the browser for each new
    HTML page. When it is created, JavaScript allow us access to a number of properties
    and methods of this object that can affect the document in various ways, such
    as managing or changing information. As a matter of fact we have been continuously
    using a method of this object, `document.write()`, in order to display content
    in a web page. Nevertheless, before exploring properties and methods we will first
    take a look at the Document Object Model (DOM).


    ## Fundamental DOM Concepts


    We are aware that when the web browser receives an HTML file it displays it as
    a web page on the screen with all of the accompanying files like images and CSS
    styles. Nevertheless, the browser also creates a model of that web document based
    on its HTML structure. This means that all the tags, their attributes and the
    order in which they appear is remembered by the browser. This representation is
    called the Document Object Model (DOM) and it is used to provide information to
    JavaScript how to communicate with the web page elements. Additionally, the DOM
    provides tools which can be used to navigate or modify the HTML code.


    The Document Object Model is a standard defined by the World Wide Web Consortium
    (W3C) that is used by most browser developers. To better understand the DOM, let
    us first take a look at a very simple web page:


    ```

    <!doctype html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Party Schedule</title>

    <style type="text/css">

    .current {color:red;}

    .finished {color:green;}

    </style>

    </head>

    <body>

    <h1 id="partytitle">Party Plan</h1>

    <ul id="partyplan">

    <li id="phase1">20:00 - Home warm-up</li>

    <li id="phase2">22:00 - Joe''s Bar</li>

    <li id="phase3">00:00 - Nightclub 54</li>

    </ul>

    </body>

    </html>

    ```


    On a web page, tags wrap around other tags. The `<html>` tag wraps around the
    `<head>` and `<body>` tags. The `<head>` tag wraps around tags such as `<title>`,
    `<meta>` and `<script>`. The `<body>` wraps around all content tags such as `<p>`,
    `<h1>` through `<h6>`, `<ul>`, `<table>` and so on.


    This relationship between tags can be represented with a tree structure where
    the `<html>` tag acts as the root of the tree, while other tags represent different
    tree branch structures dependent on the tag hierarchy within the document. In
    addition to tags, a web browser also memorizes the attributes of the tag as well
    as the textual content within the tag. In the DOM each of these items, tags, attributes
    and text, are treated as individual units which are called nodes.


    **Image 26.** Tree structure of an HTML document


    In the tree structure for our basic HTML page the `<html>` element acts as a root
    element, while the `<head>` and `<body>` elements are nodes. In defining this
    relationship we can also refer to `<html>` as the parent node, and the `<head>`
    and `<body>` elements as child notes. In turn, both the `<head>` and `<body>`
    elements contain child nodes and so on. When we reach an item that contains no
    other child node we terminate the tree structure at that node, also known as a
    leaf node.


    ## Selecting Document Elements


    With the DOM structure in place, JavaScript can access the elements within the
    document in several different ways, dependent on whether we want to select individual
    or multiple elements. In all approaches we first have to locate the node representing
    the element we need to access and subsequently use the content, child elements
    and attributes of that node.


    ### Selecting Individual Elements


    To select individual elements we most commonly use the `getElementById()` method.
    This method will let us select an element with a particular ID attribute applied
    to its HTML tag. This method is the most efficient way to access an element if
    we follow the presumption that the ID attribute is unique for every element within
    the page. In the following example we will access the element whose ID attribute
    has the value `''phase1''`:


    ```

    var firststop = document.getElementById("phase1");

    ```


    By using the `getElementById()` method on the `document` object means that we
    are searching for the element with this ID anywhere on the page. Once the `''phase1''`
    element is assessed, which in our case is the first `<h1>` element, the reference
    to this node is stored in the `firststop` variable and we can use JavaScript to
    make changes. As an example we will assign the attribute class with the value
    `''current''` to this element. We will include this code in a `<script>` tag in
    the `<head>` section of our document.


    ```

    var firststop = document.getElementById("phase1");

    firststop.className = "current";

    ```


    **Image 27.** Changing the style of a page element


    **Note:** In some browsers we have to either put the `<script>` tag before the
    closing `</body>` tag or in an external `.js` file in order for the code in this
    chapter to work.


    If we want to collect the text from a node, we can use the `textContent` property.
    More importantly, we can also use the `textContent` property to change the content
    of the node. In the following example we will first select the element that has
    the value `''partytitle''` in its `id` attribute and assign it to the `title`
    variable. Then we will effectively change the text of this element by changing
    the `textContent` property of the `title` variable. Let us add the following lines
    to our JavaScript code:


    ```

    var title = document.getElementById("partytitle");

    title.textContent = "Party Schedule";

    ```


    **Image 28.** Changing the content of a page element


    ### Selecting Group Elements


    While sometimes selecting an individual element will be sufficient, other times
    we may need to select a group of elements. For example, we might need to select
    all `<li>` tags on a page, or all elements that share a class attribute. In these
    cases JavaScript offers the following two methods:


    *   `getElementsByTagName()` – a method which will let us select every instance
    of a particular tag.

    *   `getElementsByClassName()` – a method that retrieves all elements that share
    a particular class name.

