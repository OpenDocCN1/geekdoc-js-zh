    This form of expression is used to match any character or expression that is present
    between the square brackets. For example, the regular expression `/t[eyz]st/`
    will match the string ‘this is a test’ and ‘this is a tzst’ but won’t match the
    string ‘this is a tpst’ or the string ‘this is a trst’. You can use ranges like
    a-z and 0-9 which matches all the character from ‘a’ to ‘z’ and ‘0’ to ‘9’ respectively.
