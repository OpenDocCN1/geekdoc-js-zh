    help you to code without creating a messy global namespace. A basic Self-Executing
    Anonymous Function Would be-It is very important that you understand how to use
    this type of function if you plan on programming complex code in JavaScript. Using
    the Self-Executing Anonymous Function can produce some great code that is easy
    to use. As an example, the JQuery library is designed to make using JavaScript
    on websites much easier. It does this by wrapping the entire library in one large
    self-executing function. Typeof OperatorYou might run into a situation where you
    need to determine the type of variable that you are working in JavaScript. You
    won’t have call Sherlock Holmes to find that! Instead, you can simply use the
    ‘typeof’ operator to determine the type of any specific value. In other words,
    the typeof operator is used to evaluate the type of the operand. EX-Varmyvar=0alert(typeofmyvar)  //alerts
    “number”Number isn’t the only type of operand that can be detected. It can also
    be: string, Boolean, object, null, and not defined.ScopeScope is the accessibility
    of a variable.A good understanding of Scope is necessary when it comes to debugging
    because it allow you to know what variable from which code block is causing the
    problem.The simple rule here is that whenever you declare a variable inside a
    scope, it will only be recognized by the statements that are inside that scope;
    the statements that are outside the scope will not acknowledge its existence and
    so that variable will not work.Another way to look at this is to imagine your
    entire code as a hotel with specific functions and sections of code as hotel rooms.
    The hotel rooms represent the private scopes of the code, while the common areas
    represent the global scope. A person in one hotel room cannot see or use what
    is in another hotel room. Staff who work in the hotel (and the global scope) also
    don’t have access to private hotel rooms unless they have specific permission.
    Meanwhile, guests can go through the common areas and make use of any object there. Thus,
    you can see how scope can affect how your code runs. If you need two different
    functions to access the same variable, you need to ensure that they both have
    access to it. One key way to ensure that the necessary variables have access to
    is to make your variables globally accessible.There are two possible alternatives
    if you want your variables to become globally accessible. The first thing you
    can do is to declare the variable outside the scope of your given piece of code,
    this will allow any functions in your program to be able to call it and recognize
    it.The other thing you can do is to declare the variables inside your scope without
    using the word var. If the same variable was not defined at the beginning of the
    code outside the scope of the piece of code in question, then the variable will
    act similarly to a global one.Ex-var foo = ‘hello’;var talkHello = function()
    {console.log(foo);};talkHello(); // logs ‘hello’console.log(foo); // also logs
    ‘hello’As you can see, the variable foo is declared outside of the function talkHello.
    That means that foo is a global variable and any function will be able to access
    it, so when the function talkHello calls it, it is accessible.The following example
    is contradictory to the first example. This shows that a code block that was written
    outside the scope is not being able to recognize the variable.var talkHello =
    function() {var doo = ‘hello’;console.log(doo);};talkHello(); // logs ‘hello’console.log(doo);
    // gives an empty log.In this example, the variable doo is called inside the function
    talkHello. This creates a private variable that is only accessible to the function,
    hence when the command console.log(doo) attempts to access it, it returns a null
    value.Some Common Mistakes to Avoid✓        Always remember that a variable is
    only accessible by the functions within a specific scope, outside of that scope
    the variable is invalid. Practice➢         Explain what a scope is and how the
    variables are affected by it.➢         Write a simple program to illustrate the
    functionalities of a:-a)    Simple Functionb)   A Function with returnable valuec)
      A function passed as a parameter (Argument)➢         Explain the concept of
    a Self-Executing Anonymous Function and give an example.Chapter 3.             
    Loop ConstructsLooping is another fundamental programming construct that most
    programming languages support. Fundamentally, looping is used to execute the same
    set of statements iteratively until a condition remains true. JavaScript supports
    four types of looping constructs. While LoopThe most basic loop construct is the
    while loop. This type of a loop executes the set of statements inside the while
    loop until the expression for the while is true. As soon as the expression becomes
    false, the while loop execution terminates. The syntax for implementation of while
    is given below –while (expression){     //Statements of the while block}Sample
    implementation of the while loop is given below –<html>     <body>               <script
    type="text/javascript">           <!--              var c = 0;              document.write("Loop
    begins…");                        while (c < 5){                 document.write("Value
    of c: " + c + "<br />");                 c++;              }                        document.write("Loop
    Terminates!");          //-->        </script>               <p>Change the values
    of the looping variable to see how things change</p>     </body></html>The output
    of the code upon execution is shown in the image given below. Do…While LoopAnother
    looping construct is the do...while loop. The condition’s validity is checked
    at the end of the loop. So, this loop is that it executes at least once. This
    type of a loop executes the set of statements inside the do…while loop until the
    expression for the while is true. As soon as the expression becomes false, the
    while loop execution terminates. The syntax for implementation of while is given
    below –do{     //Statements of the while block}while (expression)Sample implementation
    of the do…while loop is given below –<html>     <body>               <script type="text/javascript">           <!--              var
    c = 0;              document.write("Loop begins…");                        do{                 document.write("Value
    of c: " + c + "<br />");                 c++;              } while (c < 5)                      document.write("Loop
    Terminates!");          //-->        </script>               <p>Change the values
    of the looping variable to see how things change</p>     </body></html>The output
    of the code upon execution is shown in the image given below. For LoopThe most
    commonly used looping construct is the ‘for’ loop. The for loop integrates the
    looping variable initialization, condition checking and looping variable update
    in the for statement. The syntax for implementation of while is given below –for(init;
    expression; update){     //Statements of the for block}Here, init is the initialization
    statement and expression is the condition, which is to be tested. Lastly, the
    update is the expression that updates the looping variable. Sample implementation
    of the while loop is given below –<html>     <body>               <script type="text/javascript">           <!--              var
    c;              document.write("Loop begins…");                        for(c=0;
    c<5; c++){                 document.write("Value of c: " + c + "<br />");                 }document.write("Loop
    Terminates!");          //-->        </script>               <p>Change the values
    of the looping variable to see how things change</p>     </body></html>The output
    of the code upon execution is shown in the image given below. For…In LoopThis
    loop is typically used with objects. The loop uses a variable of the object and
    loops through until the value of the property associated with the object variable
    is exhausted. In other words, this loop works around object properties. The syntax
    for the implementation of the for…in loop is as follows –for (variable in object){     //Statements
    inside the for…in loop block}Sample implementation to demonstrate the working
    of the for…in loop is given below.<html>     <body>               <script type="text/javascript">           <!--              var
    demoObject;              document.write("Properties of the Object: <br /> ");                        for
    (demoObject in navigation) {                 document.write(demoObject);                 document.write("<br
    />");              }              document.write ("Loop Terminated!");           //-->        </script>               <p>Change
    the object to see how the result changes</p>     </body></html>Controlling the
    LoopAlthough, once the loop starts, it terminates only when the expression stated
    for condition holds false, there are certain ways in which the developer can control
    the loop. There may be situation where you might want to terminate the loop in
    between execution if a special case occurs or you may want to start a new iteration
    on the occurrence of a scenario. In order to control and implement all these conditions,
    JavaScript has provided continue and break statements. Break StatementWhenever
    this keyword is encountered in a JavaScript code, the loop immediately terminates
    and execution is shifted to the statement that comes right after the closing bracket
    of the loop. In order to understand the working of break statement, let us take
    an example,<html>     <body>              <script type="text/javascript">           <!--           var
    a = 5;          document.write("Loop Begins…<br /> ");                     while
    (a < 30)          {              if (a == 5){                 break;}              a
    = a + 1;              document.write( a + "<br />");           }                     document.write("Loop
    terminates!<br /> ");           //-->        </script>               <p>Change
    the value of a to see how the loop execution is modified</p>     </body></html>The
    output of the code is shown in the image given below. Continue StatementWhen this
    statement is encountered in a loop, the rest of the loop statements are ignored
    and the control is shifted to the next iteration of the loop. With that said,
    it is important to understand that the next iteration is execution only if the
    loop condition is found true. In case, the loop expression is found false, loop
    execution is terminated. The sample code given below demonstrates the use of continue
    statement. <html>     <body>              <script type="text/javascript">           <!--              var
    a = 0;              document.write("Loop begins<br /> ");                        while
    (a < 9){                 a = a + 1;                                 if (a == 4){                    continue;
    // skip rest of the loop body                 }                 document.write(
    a + "<br />");              }                        document.write("Loop terminates!<br
    /> ");           //-->        </script>               <p>Change the value of a
    to see how the result changes!</p>     </body></html>The output generated after
    execution of this code is illustrated in the image shown below. Labels for Controlling
    Loop FlowWhile the break and continue statements can redirect flow of control
    around the boundaries of the loop construct, they cannot be used to transfer control
    to precise statements. This is made possible in JavaScript with the use of labels.
    A label is simply an identifier followed by colon, which is placed before the
    statement or code block. The following code demonstrates the use of labels. <html>     <body>               <script
    type="text/javascript">           <!--              document.write("Loop begins!<br
    /> ");              loop1: for (var i = 0; i < 3; i++) {                 document.write("Loop1:
    " + i + "<br />");                 loop2: for (var j = 0; j < 3; j++) {                    if
    (j > 3 ) break ; // Quit the innermost loop                    if (i == 2) break
    loop1; // Do the same thing                    if (i == 4) break loop2; // Quit
    the outer loop                    document.write("Loop2: " + j + " <br />");                 }              }                        document.write("Loop
    terminates!<br /> ");           //-->        </script>            </body></html>The
    output of the code has been illustrated in the image given below. Chapter 4.             
    An Introduction to ES6Some of the key features of ES6 are:Arrows - Arrows is a
    function shorthand using the ‘=>’ syntax. It is syntactically similar to the related
    feature in C#, Java 8 and CoffeeScript.Classes - There is support for classes,
    inheritance, super calls, instances and static methods.Template strings - Template
    strings are used for constructing strings.Modules - There is language-level support
    for component definition modules.Data structures - There is support for Maps,
    Sets, WeakMaps and WeakSets.Most modern browsers have support for ES6\. If you
    want to try out ES6 code, there are a few online editors that can help you do
    so. Below are two of my favourites. Both of them provide the next generation of
    JavaScript compilers.[https://jsbin.com](https://jsbin.com)[https://babeljs.io/](https://babeljs.io/)Let’s
    now look at some simple examples of ES6 JavaScript code. In these examples we
    are going to use JS Bin to enter and run the code. Example 55: The following program
    is a simple example of ES6 scripting.'
