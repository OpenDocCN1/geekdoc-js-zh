    # 计算机编程 JavaScript


    ## 目录


    - 计算机编程 JavaScript

    - 描述

    - 第 1 章 使用全局变量作为缓存

    - 第 2 章 JavaScript 函数与作用域基础

    - 第 3 章 循环结构

    - 第 4 章 ES6 入门

    - 第 5 章 表单

    - 第 6 章 Iframe 与多媒体

    - 第 7 章 文档对象模型

    - 第 8 章 子句

    - 第 9 章 运算符、数据类型及其他优先级

    - 第 10 章 文档对象模型（DOM）

    - 第 11 章 事件（不是你想的那种庆祝）

    - 第 12 章 在变量中存储信息

    - 第 13 章 JavaScript 要点

    - 第 14 章 正则表达式

    - 第 15 章 变量的基本数据类型

    - 第 16 章 window 对象

    - 第 17 章 Map 与 Set

    - 结论


    ## 引言


    如果有什么是我希望你在读完这本 JavaScript 编程指南后牢记于心的，那就是：


    - JavaScript 是 HTML 和 Web 的语言

    - 它易于学习


    如果你能做到这一点，那么最终你将微笑着踏上 Web 编程之路。然而，你学习 JavaScript 及其他编程语言的速度完全取决于你自己。如果你发现自己遇到了困难，不要气馁，不妨休息一下，等心情平复后再重新阅读材料。请记住，本章将为你提供
    JavaScript 的基础知识，帮助你作为初学者熟悉这门语言。


    ### JavaScript 中的变量


    ```

    var exam = 50;

    var test = 12;

    var score = exam * test;

    ```


    在上面的例子中，`exam`、`test` 和 `score` 是变量，它们被赋予了存储的值。我们可以在 JavaScript 中执行各种操作，包括乘法、减法、加法、减法和除法。变量和值可以声明为数字、字符串或字母。


    ```

    var name = "insert your name";

    var number = ''45'';

    ```


    从示例中可以看出，你可以用单引号或双引号括起字符串，因为它们的作用完全相同。


    ### JavaScript 标识符


    JavaScript 中的每个变量都必须有一个唯一的名称，用于标识它。这些唯一的名称称为标识符。标识符有一定的规则，包括：


    - 每个标识符必须以字母开头

    - 可以包含数字（0-9）、字母（a-z）、美元符号（$）和下划线（_）

    - 不能使用保留字

    - 变量名区分大小写

    - 标识符可以以美元符号或下划线开头


    ### JavaScript 变量的作用域


    JavaScript 允许两种变量作用域，包括全局作用域和局部作用域。如果变量在函数体外声明，则称为全局变量。这样，同一文档中的每条语句都可以访问该变量。然而，局部变量的作用域仅限于函数内部。这样，该变量仅在同一函数内的语句可用。


    ### 浏览器端的 JavaScript 基础


    当你听到浏览器端的 JavaScript 时，它指的是客户端，即代码在客户端（浏览器）的机器上运行。浏览器端组件包括 JavaScript、JavaScript
    库、CSS、图像、HTML 以及下载到浏览器的任何文件。


    #### 浏览器端 JavaScript 特性


    JavaScript 对 Web 非常重要，因为你很可能用它来编写执行任意计算的程序。你可以编写简单的脚本，例如搜索素数或斐波那契数。然而，在 Web 浏览器和
    Web 的上下文中，JavaScript 使程序员能够根据用户通过 HTML 表单提供的信息，计算销售税等。


    JavaScript 语言的实质在于它所兼容的基于文档的对象和浏览器。这听起来可能很复杂，不过我将解释 JavaScript 在浏览器端的重要功能以及它所支持的对象。


    - **控制浏览器** – 有各种 JavaScript 对象允许控制浏览器行为。此外，`Window` 对象支持弹出对话框以向用户显示消息。用户也可以输入消息。除此之外，JavaScript
    没有提供直接创建和操作浏览器窗口内框架的方法。不过，你可以利用动态生成 HTML 的能力来创建你想要的特定框架布局。


    - **与 HTML 表单交互** – 浏览器端 JavaScript 的另一个重要部分是它与 HTML 表单协同工作的能力。这种能力源于表单元素及其对象，包括
    `Text`、`submit`、`select`、`reset`、`radio`、`hidden`、`password` 和 `text area` 对象。利用这些元素，你可以读写表单中元素的值。


    - **与用户交互** – JavaScript 还有另一个特性，即定义事件处理程序的能力。大多数情况下，这些事件由用户触发。例如，当有人将鼠标移过超链接、点击提交按钮或输入值时。处理此类事件的能力非常重要，因为使用图形界面编程需要事件驱动模型。


    除了上述特性外，浏览器端的 JavaScript 还具有其他能力，例如：


    - 通过使用 `<img>` 标签更改显示的图像，以生成动画效果和图像翻转

    - 它有一个 `window.setTimeout()` 方法，允许在未来的某一瞬间执行一段随机源代码

    - 它简化了处理时间和日期的工作与计算过程


