    This can be a combination of letters, spaces, numbers, punctuation marks, and
    other symbols. Without strings, you wouldn’t be able to get the user’s name, address,
    email, and other important details.


    2.  Numbers - Self-explanatory; numbers are the ones you can perform addition,
    subtraction, multiplication, and division to, among other mathematical operations.
    Remember not to put quotation marks or you’ll turn them into strings!


    So far, we now have strings and numbers at our disposal, but remember the console
    output when you’ve tried playing with confirmation dialogues? Whenever you press
    OK, the console returns true, and whenever you press CANCEL, the console returns
    false. These outputs aren’t surrounded by quotation marks, but they surely aren’t
    numbers, so what in the world are they? 


    3.  Booleans - booleans are data types that can only be either true or false.
    This is different from a string or a number, because it helps the computer make
    decisions based on whether or not certain conditions are met. For example, if
