    level up we can use the parentNode property. For example, if we have the second
    <li> element selected we can refer to its parent element, the <ul> element, with
    the following syntax:var secondstop = document.getElementById("phase2");var upperelement
    = secondstop.parentNode;Alternatively, if we want to move one level down, we can
    use either the firstChild or the lastChild property. In the following example
    we have selected the <ul> element with "partyplan" as a value for its id attribute.
    Using the firstChild property we refer to the first <li> element of this list,
    while with the lastChild property we refer to the last <li> element of this list.var
    plan = document.getElementById("partyplan");var child1 = plan.firstChild;var child2
    = plan.lastChild; Adding and Managing ContentUntil this point we discussed how
    to find elements in the DOM. The more interesting aspect are the approaches to
    managing content within the DOM. Changing HTMLWe already talked about the textContent
    property, but this property retrieves only text values and ignores the subsequent
    HTML structure. If we want to edit the page HTML we have to use the innerHTML
    property. This property can be used on any element node and it is capable of both
    retrieving and editing content.var liContent = document.getElementById("phase1").innerHTML;When
    retrieving the HTML from the <li> element with "phase1" as a value for its id
    attribute, innerHTML captures the whole content of the element, text and markup,
    as a string variable. If we apply the same syntax for the <ul> element, the innerHTML
    property will capture all of the <li> items.We can also use the innerHTML property
    to change the content of the element. If this content contains additional markup,
    these new elements will be processed and added to the DOM tree. For example, let
    us add the <em> tag to the first <li> item in the party list:var firstStop = document.getElementById("phase1");firstStop.innerHTML
    = "<em>20:00 - Home warm-up</em>";Image 30. Adding an <em> element with content
    to the first list itemDOM ManipulationA more direct technique to managing document
    content is to use DOM manipulation. This is a 3-step process that uses the following
    methods: 


    1.  createElement() - The process begins by creating a new element node with the
    createElement() method. This element node is stored in a variable and it is not
    yet a part of the DOM.


    2.  createTextNode() - The process continues by creating a new text node with
    the createTextNode() method. Like in the previous step, this text node is stored
    in a variable and it is not a part of the document.


    3.  appendChild() - The final step is adding the created element to the DOM tree
    with the appendChild() method. The element will be added as a child to an existing
    element. The same method can be used to add the text node to the element node. '
