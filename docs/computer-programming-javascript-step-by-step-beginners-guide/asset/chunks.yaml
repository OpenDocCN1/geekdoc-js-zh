    buttons created with the <button> tag. The <button> element attribute type should
    always be specified.<button type="submit">Click Me! </button>Fieldset ElementLonger
    forms benefit a lot from the <fieldset> element. It is used to group form controls
    that are related together.<form method="post"><fieldset><legend>Contact Details</legend><label>Address:<br><input
    type="text" name="text"><br></label><label>Phone Number:<br><input type="number"
    name="number"><br></label><label>Email:<br><input type="email" name="email"><br></label></fieldset></form>Legend
    elementThe <legend> element appears immediately after the opening <fieldset> tag
    and consists of a caption which identifies the motive of that form control group.<form
    method="post"><fieldset><legend>Contact Details</legend><label>Address:<br><input
    type="text" name="text"><br></label><label>Phone Number:<br><input type="number"
    name="number"><br></label><label>Email:<br><input type="email" name="email"><br></label></fieldset></form>Label
    elementThe label tag can be used to caption a form control so that users would
    know what should be entered into the area.<form ><label for="male">Male</label><input
    type="radio" name="gender" id="male" value="male"><br><label for="female">Female</label><input
    type="radio" name="gender" id="female" value="female"><br><label for="other">Other</label><input
    type="radio" name="gender" id="other" value="other"><br><br><input type="submit"
    value="Submit"></form>Chapter 6.              Iframe and MultimediaIframeThe <iframe>
    element can be used to embed web pages into your web page.Iframe embeds: Google
    MapGoogle map can be embedded into your webpage using the iframe tag.<iframesrc="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3963.341775346873!2d3.3422253148425853!3d6.604381995223933!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b8d7c33eb87b3%3A0xfc23c9556f669273!2sWebsite+Name!5e0!3m2!1sen!2sng!4v1516009132030"
    width="600" height="450"frameborder="0" style="border:0" allowfullscreen></iframe>Iframe
    embeds: YouTube<body><iframe width="450" height="400"src="https://www.youtube.com/embed/MhPGaOTiK0A"frameborder="0"
    allowfullscreen></iframe></body>Multimedia in HTML5HTML5 enables users to embed
    video or audio using the native HTML tags. The browser will give users control
    to play the file if it supports it. Both audio and video tags are new features
    and can be used on the recent version of browsers. Popular video formats are .mp4,
    .m4v, Flash Video {.flv}, Audio Video Interleave {.avi} etc.The video element:A
    video player can be embedded using the video element for a specific video file.
    Those attributes are used to customize the player: preload, loop, auto play, poster,
    auto and controls.PreloadThe preload attribute instructs the browser on what action
    to take when the page loads. one of these three values can occur:None: The video
    should not load automatically when the page loads until the user clicks play.Auto:
    when the page loads the browser should download the video.Metadata: this means
    that information such as first frame, size, track list and duration should be
    received by the browser.SrcThe path to the video is specified by this attribute.PosterThis
    attribute enables users to direct an image to be displayed while the video downloads
    or until the user decides to play the video.Width, heightThe size of the player
    is specified with these attributes.ControlsThis attribute specifies that the browser
    should provide its own controls for playback when used.AutoplayThis attribute
    indicates that the file should play automatically when used.LoopThis attribute
    specifies that the video should start playing again from the beginning the moment
    it ends when utilized.Multiple video formatsHTML5 enables users state multiple
