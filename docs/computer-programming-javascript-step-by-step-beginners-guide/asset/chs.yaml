- "# Javascript 编程：分步初学者指南：使用Javascript创建第一个网站 + 实用练习\n\n\n\n## 引言\n\n如果有什么是我希望你在读完这本\
  \ JavaScript 编程指南后牢记于心的，那就是：\n\n- JavaScript 是 HTML 和 Web 的语言\n- 它易于学习\n\n如果你能做到这一点，那么最终你将微笑着踏上\
  \ Web 编程之路。然而，你学习 JavaScript 及其他编程语言的速度完全取决于你自己。如果你发现自己遇到了困难，不要气馁，不妨休息一下，等心情平复后再重新阅读材料。请记住，本章将为你提供\
  \ JavaScript 的基础知识，帮助你作为初学者熟悉这门语言。\n\n### JavaScript 中的变量\n\n```\nvar exam = 50;\n\
  var test = 12;\nvar score = exam * test;\n```\n\n在上面的例子中，`exam`、`test` 和 `score`\
  \ 是变量，它们被赋予了存储的值。我们可以在 JavaScript 中执行各种操作，包括乘法、减法、加法、减法和除法。变量和值可以声明为数字、字符串或字母。\n\
  \n```\nvar name = \"insert your name\";\nvar number = '45';\n```\n\n从示例中可以看出，你可以用单引号或双引号括起字符串，因为它们的作用完全相同。\n\
  \n### JavaScript 标识符\n\nJavaScript 中的每个变量都必须有一个唯一的名称，用于标识它。这些唯一的名称称为标识符。标识符有一定的规则，包括：\n\
  \n- 每个标识符必须以字母开头\n- 可以包含数字（0-9）、字母（a-z）、美元符号（$）和下划线（_）\n- 不能使用保留字\n- 变量名区分大小写\n\
  - 标识符可以以美元符号或下划线开头\n\n### JavaScript 变量的作用域\n\nJavaScript 允许两种变量作用域，包括全局作用域和局部作用域。如果变量在函数体外声明，则称为全局变量。这样，同一文档中的每条语句都可以访问该变量。然而，局部变量的作用域仅限于函数内部。这样，该变量仅在同一函数内的语句可用。\n\
  \n### 浏览器端的 JavaScript 基础\n\n当你听到浏览器端的 JavaScript 时，它指的是客户端，即代码在客户端（浏览器）的机器上运行。浏览器端组件包括\
  \ JavaScript、JavaScript 库、CSS、图像、HTML 以及下载到浏览器的任何文件。\n\n#### 浏览器端 JavaScript 特性\n\
  \nJavaScript 对 Web 非常重要，因为你很可能用它来编写执行任意计算的程序。你可以编写简单的脚本，例如搜索素数或斐波那契数。然而，在 Web 浏览器和\
  \ Web 的上下文中，JavaScript 使程序员能够根据用户通过 HTML 表单提供的信息，计算销售税等。\n\nJavaScript 语言的实质在于它所兼容的基于文档的对象和浏览器。这听起来可能很复杂，不过我将解释\
  \ JavaScript 在浏览器端的重要功能以及它所支持的对象。\n\n- **控制浏览器** – 有各种 JavaScript 对象允许控制浏览器行为。此外，`Window`\
  \ 对象支持弹出对话框以向用户显示消息。用户也可以输入消息。除此之外，JavaScript 没有提供直接创建和操作浏览器窗口内框架的方法。不过，你可以利用动态生成\
  \ HTML 的能力来创建你想要的特定框架布局。\n\n- **与 HTML 表单交互** – 浏览器端 JavaScript 的另一个重要部分是它与 HTML\
  \ 表单协同工作的能力。这种能力源于表单元素及其对象，包括 `Text`、`submit`、`select`、`reset`、`radio`、`hidden`、`password`\
  \ 和 `text area` 对象。利用这些元素，你可以读写表单中元素的值。\n\n- **与用户交互** – JavaScript 还有另一个特性，即定义事件处理程序的能力。大多数情况下，这些事件由用户触发。例如，当有人将鼠标移过超链接、点击提交按钮或输入值时。处理此类事件的能力非常重要，因为使用图形界面编程需要事件驱动模型。\n\
  \n除了上述特性外，浏览器端的 JavaScript 还具有其他能力，例如：\n\n- 通过使用 `<img>` 标签更改显示的图像，以生成动画效果和图像翻转\n\
  - 它有一个 `window.setTimeout()` 方法，允许在未来的某一瞬间执行一段随机源代码\n- 它简化了处理时间和日期的工作与计算过程\n\n![](img/rsrc7.jpg)\n\
  ![](img/rsrc7.jpg)\n\n\n\n\n\n# JavaScript 框架\n\n花点时间思考一下，创建 Web 应用和网站就像建造一所房子。在建造房子时，你可以决定从零开始制作建造房子所需的所有材料，而不做任何计划。这会非常耗时，而且意义不大。你更可能做的是购买预制材料，如砖块、木材、台面等，然后根据你拥有的蓝图进行组装。\n\
  \n编码就像自己动手建造房子。当你开始编写一个网站时，你可以从零开始编写网站的所有部分。然而，有些网站特性通过应用模板能让你的网站更有意义。假设你想买一个轮子，那么寻找一个可以重新发明的轮子会更有意义。这就是\
  \ JavaScript 框架登场的地方。\n\n`JavaScript 框架` 是一组 JavaScript 代码库，为网站开发者提供预编写的 JavaScript\
  \ 代码，用于日常编程任务和功能。你也可以将其称为应用框架，它用 JavaScript 编写，开发者可以操作这些代码的功能，并为了方便而重用它们。它们更适合网站设计，这就是为什么许多开发者使用它们来构建网站。\n\
  \n## 顶级 JavaScript 框架\n\n### Vue.js\n\n这是 JavaScript 框架之一，旨在让用户界面开发更有条理。由 Evan You\
  \ 创建，它是初学者的理想 JavaScript 框架，因为相当容易理解。此外，它专注于视图层。使用 `Vue.js`，你不需要 `Babel`。`Babel`\
  \ 是一个转译器，负责将 JavaScript 代码转换为能在所有浏览器中运行的旧版本 ES5。`Vue.js` 框架中的所有模板都是有效的 HTML，这使得它们的集成更容易。如果你想作为初学者开发轻量级应用，最好从\
  \ `Vue.js` 开始。\n\n### Next.js\n\n另一个重要的 JavaScript 框架是 `Next.js` 框架，它是用于服务器端渲染的附加工具。该框架允许开发者简化开发过程，类似于\
  \ `Vue.js` 框架。这个 JavaScript 框架的特性包括基于页面的客户端路由和代码自动拆分。该框架还带有完整的 CSS 支持，这使得初学者和专业人士都能更轻松地设计用户界面样式。\n\
  \n### Ember.js\n\n这个框架诞生于几年前，是 Web 行业中最受欢迎的 JavaScript 框架之一。像 LinkedIn、Heroku 和\
  \ Kickstarter 这样的知名公司都在其网站设计中使用 `Ember.js` 框架。它还定期更新，并为用户提供完整的功能。与 `Vue.js` 框架不同，它对于想要开发复杂\
  \ Web 应用的开发者来说非常有效。该框架的重点是可扩展性，允许开发者将其用于 Web 和移动项目。\n\n### Angular\n\nGoogle 于 2010\
  \ 年发布了这个 JavaScript 框架，并定期进行更新和改进。它是许多开发者最追捧的框架之一，因为它简化了网站和应用的开发。对于其他开发者来说，则是因为它能够创建动态\
  \ Web 应用。\n\n# 第 1 章 使用全局变量作为缓存\n\n在需要创建小型应用，并且尝试将应用与第三方机制集成会产生开销的情况下，这些可以很容易地在\
  \ `Node.js` 应用内部处理，并且应在单线程模式下执行。\n\n在这种模式下，即单线程模式，一次只执行一个应用，该应用负责处理发送给它的所有请求。这与桌面应用的情况类似。其他使用其他\
  \ Web 开发编程语言（如 PHP、Ruby 和 Python）开发的 Web 应用并非以这种方式运行。在这种情况下，可以定义一个全局变量，该变量将对我们所做的所有请求可访问。这需要非常谨慎地考虑。\n\
  \n为了实现这种机制，可以创建所需类型的全局变量，然后在此函数内部添加一个操作机制。这将使其在我们所有的请求中持久存在。\n\n考虑下面给出的代码，它展示了如何有效地实现这一点：\n\
  \n```\n'use strict';\n//this should be the cache for the js file\nvar cache = {};\n\
  exports.someMethod = function(data){\n/*The business logic should be added here*/\n\
  //setting the cache\ncache[key] = val;\n//retrieving the cache\ncVal = cache[key];\n\
  //deleting the cache\ndelete cache[key];\n/*The business logic should be added here*/\n\
  ```\n\n## 不使用第三方库进行日志记录\n\n每当我们需要打印临时信息时，我们使用 `console.log` 来记录到系统。在部署阶段，有一些很好的库可以用于此目的。有些人讨厌使用第三方库来记录他们的\
  \ `node.js` 应用。然而，通过提供替代方案，这个问题已经得到解决。借助原生支持，我们可以获得一种非常合适的机制来记录他们的 `node.js` 应用。\n\
  \n`Node.js` 的 `console` 对象为我们提供了不同级别的日志记录。这些需要按照它们设计的方式使用，否则你会在使用中遇到麻烦。当你想要执行 node\
  \ 应用时，你应该指定一个日志文件，你需要将所有内容写入其中。这可以像下面给出的命令那样完成：\n\n```\n$node app.js > mylogfile.log\n\
  ```\n\n执行上述命令后，你就准备好了。日志信息将保存在上述文件中，稍后当你想要获取一些有用或关键信息时，你就可以查看它。这也适用于安全目的。\n\n每当我们想要在控制台终端上打印某些内容时，我们应该使用下面给出的格式：\n\
  \n```\nconsole.log(\"The value of my variable should be:\"+xyz);\n```\n\n这仅适用于单值项。如果是一个\
  \ json 对象，那么我们可以使用 `console.log(xyz)`。这表明 `+` 运算符在这种情况下不起作用。\n\n## 关于使用“*”\n\n建议不要在生产依赖中使用它。大多数人在他们的\
  \ `package.json` 文件中使用它来指定版本，或者使用 `*` 以便他们始终拥有最新的包。一个人应该将所有包更新到最新版本，因为它可能包含一些错误修复、若干改进，甚至添加了新功能。然而，这仅适用于产品处于开发阶段但尚未进入生产阶段的情况。\n\
  \n如果出现兼容性错误，修复起来会很容易。如下面的代码所示：\n\n```\n//other of this:\n\"dependencies\": {\n\"\
  clustered-node\": \"*\"\n//use the following\n\"dependencies\": {\n\"clustered-node\"\
  : \"~0.0.10\"\n```\n\n对于那些在生产环境中使用此类符号的人来说，这是非常危险的。因为你不知道何时以及哪个包可能会崩溃并导致应用崩溃，这是可能的。这就是为什么它只应在开发阶段使用，但一旦产品进入生产环境，你应该切换到基于特定版本的依赖项。这应在产品的部署阶段完成。\n\
  \n## 异步循环\n\n每当我们使用 `AsyncJS`/`underscoreJS` 进行异步流循环/控制时，我们会得到非常有用且必要的支持。对于那些更了解回调概念的人，他们可以以非常原生地方式使用它。如果你不想在简单任务中使用这个库，那么使用下面代码中给出的机制。代码如下：\n\
  \n```\nvar iterate = function(items, it){\nconsole.log(\"Now handling: \"+it);\n\
  //async methods\nsomeAsyncMethod(parameterss, function callback(){\nif(items.length\
  \ <= it)\nreturn;\nreturn iterate(items, ++it);\n})\n};\nvar items = [5, 6, 7, 8];\n\
  iterate(items, 0);\n```\n\n# 第 2 章 JavaScript 函数与作用域基础\n\n现在让我们看看，通常当我们谈论“函数”时，你首先想到的是什么？显然是一个活动，对吧？JavaScript\
  \ 中的函数也以类似的方式工作。函数是需要被程序反复执行的代码块。函数用于执行特定任务。一个函数可以包含任意数量的参数和语句；它们甚至可以没有。根据结构编码方式，它可能向用户返回值，也可能不返回值。\n\
  \n函数按以下方式声明：\n\n```\nFunction name(                 ) { /*code blocks to be executed*/}\n\
  ```\n\n要开始函数，我们从 `function` 关键字开始，然后添加名称和括号。要结束函数，我们将要执行的代码块放在花括号中。你也可以将函数放在一个命名变量中：\n\
  \n```\nvar jam = function() {/* code blocks to be executed*/}\n```\n\n下面是一些如何执行函数的示例：\n\
  \ni) 这是最基本的函数示例\n\n```\nvar sayHello = function(person, greeting) {\nvar text =\
  \ greeting + ' , '+ person;\nconsole.log(text);\n};\nSay Hello (' Jessica' , ' Hello');\n\
  ```\n\nii) 这是一个返回值的函数示例\n\n```\nvar greet = function (person, greeting) {\nvar writing\
  \ = greeting + ' , ' + person ;\nreturn function () {\nconsole.log(text);\n};\n\
  };\nconsole.log(greet('Richard' ,' Hello\"));\n```\n\niii) 有时，你可能想使用嵌套函数。（注意：嵌套函数是另一个函数内部的函数。）\n\
  \n```\nvar sayHi = function( person, greeting) {\nvar text = greeting + ',' + person;\n\
  return function() {\nconsole.log (text);\n};\n};\nvar greeting = greet( ' Richard'\
  \ , 'Hello');\ngreeting();\n```\n\n## 自执行匿名函数\n\n程序员一直在寻找最先进、最巧妙的方法来改善他们的编程体验，并使其更易于访问和更简单。这导致了自执行匿名函数的创建。自执行匿名函数的核心目的是创建一个\
  \ JavaScript 函数，并在其创建后立即执行。这使得处理大型程序的程序员更容易。同样，它将帮助你编码而不会创建混乱的全局命名空间。\n\n一个基本的自执行匿名函数如下：\n\
  \n```\n(function() {\n// code here\n})();\n```\n\n如果你计划用 JavaScript 编写复杂代码，理解如何使用这种类型的函数非常重要。使用自执行匿名函数可以生成一些易于使用的优秀代码。例如，JQuery\
  \ 库旨在使在网站上使用 JavaScript 更加容易。它通过将整个库包装在一个大型自执行函数中来实现这一点。\n\n## typeof 运算符\n\n你可能会遇到需要确定你在\
  \ JavaScript 中使用的变量类型的情况。你不需要请夏洛克·福尔摩斯来找出答案！相反，你可以简单地使用 `typeof` 运算符来确定任何特定值的类型。换句话说，`typeof`\
  \ 运算符用于评估操作数的类型。\n\n示例：\n\n```\nvar myvar = 0\nalert(typeof myvar)  //alerts \"\
  number\"\n```\n\nNumber 并不是唯一可以检测的操作数类型。它还可以是：string、Boolean、object、null 和 undefined。\n\
  \n## 作用域\n\n作用域是变量的可访问性。在调试时，对作用域的良好理解是必要的，因为它允许你了解哪个代码块中的变量导致了问题。\n\n这里简单的规则是：每当你在一个作用域内声明一个变量时，只有该作用域内的语句才能识别它；作用域外的语句不会承认它的存在，因此该变量将不起作用。\n\
  \n另一种看待这个问题的方式是将你的整个代码想象成一个酒店，特定的功能和代码部分就像酒店房间。酒店房间代表代码的私有作用域，而公共区域代表全局作用域。一个酒店房间里的人不能看到或使用另一个酒店房间里的东西。在酒店工作的人员（以及全局作用域）也无法访问私人酒店房间，除非他们有特定权限。同时，客人可以穿过公共区域并使用那里的任何物品。\n\
  \n因此，你可以看到作用域如何影响代码的运行。如果你需要两个不同的函数访问同一个变量，你需要确保它们都能访问它。确保必要变量可访问的一个关键方法是使你的变量全局可访问。\n\
  \n如果你想让变量全局可访问，有两种可能的替代方案。第一件事是在给定代码片段的作用域之外声明变量，这将允许程序中的任何函数调用并识别它。另一件事是在你的作用域内声明变量而不使用\
  \ `var` 关键字。如果同一个变量在代码开头没有在相关代码片段的作用域之外定义，那么该变量的行为将类似于全局变量。\n\n示例：\n\n```\nvar foo\
  \ = 'hello';\nvar talkHello = function() {\nconsole.log(foo);\n};\ntalkHello();\
  \ // logs 'hello'\nconsole.log(foo); // also logs 'hello'\n```\n\n如你所见，变量 `foo`\
  \ 在函数 `talkHello` 外部声明。这意味着 `foo` 是一个全局变量，任何函数都能访问它，所以当函数 `talkHello` 调用它时，它是可访问的。\n\
  \n下面的示例与第一个示例相反。这表明在作用域之外编写的代码块无法识别该变量。\n\n```\nvar talkHello = function() {\nvar\
  \ doo = 'hello';\nconsole.log(doo);\n};\ntalkHello(); // logs 'hello'\nconsole.log(doo);\
  \ // gives an empty log.\n```\n\n在这个示例中，变量 `doo` 在函数 `talkHello` 内部被调用。这创建了一个私有变量，只有该函数才能访问，因此当命令\
  \ `console.log(doo)` 尝试访问它时，它返回一个空值。\n\n## 一些需要避免的常见错误\n\n✓ 始终记住，变量只能被特定作用域内的函数访问，在该作用域之外，变量是无效的。\n\
  \n## 练习\n\n➢ 解释什么是作用域以及变量如何受其影响。\n\n➢ 编写一个简单的程序来说明以下功能：\n\na) 简单函数\n\nb) 具有返回值的函数\n\
  \nc) 作为参数传递的函数\n\n➢ 解释自执行匿名函数的概念并给出一个示例。\n\n# 第 3 章 循环结构\n\n循环是大多数编程语言支持的另一个基本编程结构。从根本上说，循环用于迭代执行同一组语句，直到条件保持为真。JavaScript\
  \ 支持四种类型的循环结构。\n\n## While 循环\n\n最基本的循环结构是 `while` 循环。这种类型的循环执行 `while` 内部的语句集，直到\
  \ `while` 的表达式为真。一旦表达式变为假，`while` 循环执行终止。`while` 的实现语法如下：\n\n```\nwhile (expression){\n\
  \     //Statements of the while block\n}\n```\n\n`while` 循环的示例实现如下：\n\n```\n<html>\n\
  \     <body>\n               <script type=\"text/javascript\">\n           <!--\n\
  \              var c = 0;\n              document.write(\"Loop begins…\");\n   \
  \                     while (c < 5){\n                 document.write(\"Value of\
  \ c: \" + c + \"<br />\");\n                 c++;\n              }\n           \
  \             document.write(\"Loop Terminates!\");\n          //-->\n        </script>\n\
  \               <p>Change the values of the looping variable to see how things change</p>\n\
  \     </body>\n</html>\n```\n\n代码执行后的输出如下图所示。\n\n## Do…While 循环\n\n另一种循环结构是 `do...while`\
  \ 循环。条件的有效性在循环结束时检查。因此，这个循环至少执行一次。这种类型的循环执行 `do…while` 内部的语句集，直到 `while` 的表达式为真。一旦表达式变为假，`while`\
  \ 循环执行终止。`while` 的实现语法如下：\n\n```\ndo{\n     //Statements of the while block\n}while\
  \ (expression)\n```\n\n`do…while` 循环的示例实现如下：\n\n```\n<html>\n     <body>\n     \
  \          <script type=\"text/javascript\">\n           <!--\n              var\
  \ c = 0;\n              document.write(\"Loop begins…\");\n                    \
  \    do{\n                 document.write(\"Value of c: \" + c + \"<br />\");\n\
  \                 c++;\n              } while (c < 5)\n                      document.write(\"\
  Loop Terminates!\");\n          //-->\n        </script>\n               <p>Change\
  \ the values of the looping variable to see how things change</p>\n     </body>\n\
  </html>\n```\n\n代码执行后的输出如下图所示。\n\n## For 循环\n\n最常用的循环结构是 `for` 循环。`for` 循环将循环变量初始化、条件检查和循环变量更新集成在\
  \ `for` 语句中。`while` 的实现语法如下：\n\n```\nfor(init; expression; update){\n     //Statements\
  \ of the for block\n}\n```\n\n这里，`init` 是初始化语句，`expression` 是要测试的条件。最后，`update`\
  \ 是更新循环变量的表达式。`while` 循环的示例实现如下：\n\n```\n<html>\n     <body>\n               <script\
  \ type=\"text/javascript\">\n           <!--\n              var c;\n           \
  \   document.write(\"Loop begins…\");\n                        for(c=0; c<5; c++){\n\
  \                 document.write(\"Value of c: \" + c + \"<br />\");\n         \
  \        }\ndocument.write(\"Loop Terminates!\");\n          //-->\n        </script>\n\
  \               <p>Change the values of the looping variable to see how things change</p>\n\
  \     </body>\n</html>\n```\n\n代码执行后的输出如下图所示。\n\n## For…In 循环\n\n这个循环通常用于对象。循环使用对象的一个变量，并循环直到与对象变量关联的属性值耗尽。换句话说，这个循环围绕对象属性工作。`for…in`\
  \ 循环的实现语法如下：\n\n```\nfor (variable in object){\n     //Statements inside the for…in\
  \ loop block\n}\n```\n\n下面给出了演示 `for…in` 循环工作的示例实现。\n\n```\n<html>\n     <body>\n\
  \               <script type=\"text/javascript\">\n           <!--\n           \
  \   var demoObject;\n              document.write(\"Properties of the Object: <br\
  \ /> \");\n                        for (demoObject in navigation) {\n          \
  \       document.write(demoObject);\n                 document.write(\"<br />\"\
  );\n              }\n              document.write (\"Loop Terminated!\");\n    \
  \       //-->\n        </script>\n               <p>Change the object to see how\
  \ the result changes</p>\n     </body>\n</html>\n```\n\n## 控制循环\n\n尽管循环一旦开始，只有在条件表达式为假时才终止，但开发者可以通过某些方式控制循环。可能会出现这样的情况：如果发生特殊情况，你可能想在执行过程中终止循环，或者当某个场景发生时，你可能想开始一个新的迭代。为了控制和实现所有这些条件，JavaScript\
  \ 提供了 `continue` 和 `break` 语句。\n\n### Break 语句\n\n每当在 JavaScript 代码中遇到这个关键字时，循环立即终止，执行转移到循环结束括号之后的语句。为了理解\
  \ `break` 语句的工作方式，让我们看一个例子：\n\n```\n<html>\n     <body>\n              <script type=\"\
  text/javascript\">\n           <!--\n           var a = 5;\n          document.write(\"\
  Loop Begins…<br /> \");\n                     while (a < 30)\n          {\n    \
  \          if (a == 5){\n                 break;}\n              a = a + 1;\n  \
  \            document.write( a + \"<br />\");\n           }\n                  \
  \   document.write(\"Loop terminates!<br /> \");\n           //-->\n        </script>\n\
  \               <p>Change the value of a to see how the loop execution is modified</p>\n\
  \     </body>\n</html>\n```\n\n代码的输出如下图所示。\n\n### Continue 语句\n\n当在循环中遇到这个语句时，循环的其余语句被忽略，控制转移到循环的下一次迭代。话虽如此，重要的是要理解，只有在循环条件为真时才会执行下一次迭代。如果循环表达式为假，则循环执行终止。\n\
  \n下面给出的示例代码演示了 `continue` 语句的使用。\n\n```\n<html>\n     <body>\n              <script\
  \ type=\"text/javascript\">\n           <!--\n              var a = 0;\n       \
  \       document.write(\"Loop begins<br /> \");\n                        while (a\
  \ < 9){\n                 a = a + 1;\n                                 if (a ==\
  \ 4){\n                    continue; // skip rest of the loop body\n           \
  \      }\n                 document.write( a + \"<br />\");\n              }\n \
  \                       document.write(\"Loop terminates!<br /> \");\n         \
  \  //-->\n        </script>\n               <p>Change the value of a to see how\
  \ the result changes!</p>\n     </body>\n</html>\n```\n\n执行此代码后生成的输出如下图所示。\n\n###\
  \ 用于控制循环流的标签\n\n虽然 `break` 和 `continue` 语句可以重定向循环结构边界内的控制流，但它们不能用于将控制转移到精确的语句。在\
  \ JavaScript 中，通过使用标签可以实现这一点。标签只是一个标识符后跟冒号，放在语句或代码块之前。以下代码演示了标签的使用。\n\n```\n<html>\n\
  \     <body>\n               <script type=\"text/javascript\">\n           <!--\n\
  \              document.write(\"Loop begins!<br /> \");\n              loop1: for\
  \ (var i = 0; i < 3; i++) {\n                 document.write(\"Loop1: \" + i + \"\
  <br />\");\n                 loop2: for (var j = 0; j < 3; j++) {\n            \
  \        if (j > 3 ) break ; // Quit the innermost loop\n                    if\
  \ (i == 2) break loop1; // Do the same thing\n                    if (i == 4) break\
  \ loop2; // Quit the outer loop\n                    document.write(\"Loop2: \"\
  \ + j + \" <br />\");\n                 }\n              }\n                   \
  \     document.write(\"Loop terminates!<br /> \");\n           //-->\n        </script>\n\
  \            </body>\n</html>\n```\n\n代码的输出如下图所示。\n\n# 第 4 章 ES6 简介\n\nES6 的一些关键特性包括：\n\
  \n- **箭头函数** - 箭头函数是使用 `=>` 语法的函数简写。它在语法上与 C#、Java 8 和 CoffeeScript 中的相关特性类似。\n\
  - **类** - 支持类、继承、super 调用、实例和静态方法。\n- **模板字符串** - 模板字符串用于构建字符串。\n- **模块** - 语言级别支持组件定义模块。\n\
  - **数据结构** - 支持 Maps、Sets、WeakMaps 和 WeakSets。\n\n大多数现代浏览器都支持 ES6。如果你想尝试 ES6 代码，有几个在线编辑器可以帮助你。下面是我最喜欢的两个。它们都提供了下一代\
  \ JavaScript 编译器。\n\n[`jsbin.com`](https://jsbin.com)\n\n[`babeljs.io/`](https://babeljs.io/)\n\
  \n现在让我们看一些 ES6 JavaScript 代码的简单示例。在这些示例中，我们将使用 JS Bin 来输入和运行代码。\n\n### 示例 55\n\n\
  以下程序是 ES6 脚本的一个简单示例。\n\n```\n// ES6 code example\nconst greeting = (name) => `Hello,\
  \ ${name}!`;\nconsole.log(greeting('World'));\n```\n\n\n\n\n\n```\nlet num1=5;console.log(num1);\n\
  ```\n\n关于上述程序，需要注意以下几点：`let` 命令用于给变量赋值。然后我们使用 `console.log` 命令输出变量的值。该程序的输出结果如下：5。我们还可以使用\
  \ `const` 关键字声明常量。下面来看一个示例。\n\n### 示例 56：下一个程序是使用常量的 ES6 脚本示例。\n\n```\nconst num=6;let\
  \ num1=5;console.log(num);console.log(num1);\n```\n\n该程序的输出结果如下：65。我们还可以在 ES6 中定义函数。下面来看一个简单示例。\n\
  \n### 示例 57：以下程序是使用函数的 ES6 脚本示例。\n\n```\nvar start=function(){const num=6;let num1=5;console.log(num);console.log(num1);}start();\n\
  ```\n\n该程序的输出结果如下：65。\n\n## 决策与循环\n\nES6 支持以下决策与循环命令。\n\n- `If` 语句——用于计算表达式，然后相应地执行语句。\n\
  - `If…else` 语句——用于计算表达式，然后相应地执行语句。如果布尔表达式计算结果为 false，则执行另一组语句。\n- `Nested if` 语句——用于测试多个条件。\n\
  - `Switch…case` 语句——计算表达式，将表达式的值与 case 子句匹配，并执行与该 case 关联的语句。\n- `For` 循环——一组语句执行\
  \ `n` 次。\n- `While` 循环——一组语句在条件保持为 true 时持续执行。\n- `Do…while` 循环——一组语句在条件保持为 true\
  \ 时持续执行。与 while 循环的区别在于，语句至少会执行一次。\n\n下面来看这些语句的一些示例。\n\n### 示例 58：以下程序是 ES6 中循环（if\
  \ else）的示例。\n\n```\nvar start=function(){const num=6;let num1=5;if(num<7){console.log(\"\
  The value is less than 7\");}else{console.log(\"The value is greater than 7\");}}start();\n\
  ```\n\n该程序的输出结果如下：“The value is less than 7”\n\n### 示例 59：下一个程序是 ES6 中循环（for 循环）的示例。\n\
  \n```\nvar start=function(){for(x=0;x<5;x++){console.log(x);}}start();\n```\n\n\
  该程序的输出结果如下：01234\n\n### 示例 60：此程序是 ES6 中循环（while 循环）的示例。\n\n```\nvar start=function(){let\
  \ x=0;while(x<5){console.log(x);x++;}}start();\n```\n\n该程序的输出结果如下：01234\n\n## 类\n\
  \nES6 也支持类。类的定义方式如下：\n\n```\nclass classname{constructor(parameters){//Assign values\
  \ to the properties}// More methods}\n```\n\n其中：`classname` 是分配给类的名称。我们有一个构造函数，在创建对象时调用。构造函数可以接受参数。这些参数可用于为类的属性赋值。然后我们可以在类中定义更多方法。下面来看一个\
  \ ES6 中简单类的示例。\n\n### 示例 61：以下程序展示了如何在 ES6 中使用类。\n\n```\nvar start=function(){class\
  \ Rectangle{constructor(height, width) {this.height = height;this.width = width;}Display(){console.log(this.height);console.log(this.width);}}var\
  \ newrect=new Rectangle(3,4);newrect.Display();}start();\n```\n\n关于上述程序，需要注意以下几点：首先我们定义了一个名为\
  \ `Rectangle` 的类。它接受两个参数，即 `height` 和 `width`。这可用于定义类的 `height` 和 `width` 属性。然后我们创建了一个\
  \ `Display` 方法，用于显示类的属性。该程序的输出结果如下：34。\n\n## 集合\n\nES6 也支持集合，例如 map 集合。例如，如果我们想设置\
  \ map 集合的值，可以使用 `set` 方法，如下所示：\n\n```\nmapname.set(key,value);\n```\n\n其中：\n\n-\
  \ `mapname` 是 map 的名称。\n- `key` 是分配给元素的键。\n- `value` 是与该键关联的值。\n\n### 示例 62：以下程序展示了如何在\
  \ ES6 中使用 map。\n\n```\nvar start=function(){var map = new Map();map.set('keyA','valueA');map.set('keyB','valueB');map.set('keyC','valueC');console.log(map.get(\"\
  keyB\"));}start();\n```\n\n\n\n\n使用此程序，输出结果如下：`valueB`\n\n# 第 5 章 表单\n\n表单从网页访问者那里获取信息，并将其发送到后端应用程序，例如\
  \ PHP 脚本、CGI 或 ASP 脚本。HTML 表单用于收集网站访问者的数据。表单对于网站上的会员注册、在线购物或求职申请非常重要。例如，在用户注册过程中，会收集电子邮件地址、姓名、信用卡等信息。然后，根据后端应用程序中包含的特定逻辑，对发送的数据进行必要的处理。可用的表单元素有多种，例如文本区域字段、单选按钮、下拉菜单、复选框等。\n\
  \n## 表单结构\n\n`<form>`\n\nHTML 表单通过 `<form>` 元素创建。此标签必须始终携带 `action` 属性，有时也会带有 `id`\
  \ 和 `method` 属性。\n\n## Action\n\n每个 `<form>` 元素都需要一个 `action` 属性。`action` 属性的值是服务器上用于检索提交表单中所含信息的页面的\
  \ URL。\n\n## Method\n\n表单通过两种方式发送到后端应用程序：它们使用“get”或“post”方法。\n\n### Get\n\nGET 方法允许表单中的值返回到\
  \ `action` 属性中指定的 URL 末尾。GET 方法非常适合从 Web 服务器收集数据。该技术确保参数存储在浏览器缓存中。此方法可发送的信息量有限。处理敏感信息（如密码或信用卡号）时，请勿使用\
  \ GET 方法，因为该过程会显示在浏览器的地址栏中，对所有人可见。\n\n### Post\n\nPOST 方法通过 HTTP 标头发送值。当表单包含敏感信息（如密码）以及访问者需要上传文件时，POST\
  \ 方法非常理想。参数不会保存在 Web 服务器缓存或浏览器历史记录中。POST 方法比 GET 方法更安全。\n\n## Id\n\n此值为 HTML 表单指定一个相对于页面上其他元素的唯一标识。\n\
  \n## 文本输入\n\n`<input>` 标签允许创建不同的表单控件。属性值的类型决定了所创建的输入类型。\n\n### `type=\"text\"`\n\
  \n当 `type` 属性值为 text 时，它会创建一个单行文本输入框。\n\n### Name\n\n当用户向表单中输入信息时，服务器需要知道控件数据所对应的值。例如，在登录表单中，服务器需要知道哪个是用户名，哪个是密码。每个表单控件都需要\
  \ `name` 属性，该属性的值用于标识表单控件，并与输入的信息一起发送到服务器。\n\n### Max length\n\n`maxlength` 属性可用于限制文本字段中可输入的字符数。`maxlength`\
  \ 属性的值即为允许输入的字符数。\n\n## 密码输入\n\n### `type=\"password\"`\n\n类型为 `\"password\"` 的\
  \ `<input>` 标签为用户提供了一种安全输入密码的方式。该元素呈现一个单行纯文本编辑器控件，将字符替换为符号（如 `\"*\"`）或点（`\" • \"\
  `），使其不可读，从而保证文本安全。\n\n### Name\n\n此属性指定密码输入的名称，该名称会与访问者输入的密码一起传输到服务器。\n\n```\n<body>\n\
  <form action=\"http://www.alabiansolutions.com/login.php\">\n<p>用户名：<input type=\"\
  text\" name=\"username\" size=\"15\" maxlength=\"30\" /></p>\n<p>密码：<input type=\"\
  password\" name=\"password\" size=\"15\" maxlength=\"30\" /></p>\n</form>\n</body>\n\
  ```\n\n## 文本区域\n\n多行输入通过 `<textarea>` 元素创建。与其他输入元素不同，`<textarea>` 不是一个空元素，因此它应包含开始和结束标签。位于开始\
  \ `<textarea>` 和结束 `</textarea>` 元素之间的文本将在页面加载时显示在文本框中。\n\n```\n<form action=\"\
  process.php\">\n<p>你对这场演出有什么看法？</p>\n<textarea name=\"comment\"></textarea>\n</form>\n\
  ```\n\n## 单选按钮\n\n`<input type=\"radio\">` 元素表示一个单选按钮。它用于创建多个可选项。\n\n### Name\n\n\
  为了被视为一个组，`name` 属性的值必须与单选组对应，因为选择同一组中的任何其他单选按钮都会取消选择第一个选中的按钮。只要每个组都有自己的名称，就可以在页面上创建多个单选组。\n\
  \n### Value\n\n`value` 属性指示与每个选中选项关联的唯一值。组中每个按钮的值应不同，以便服务器能够识别选中的选项。\n\n### Checked\n\
  \n`checked` 属性指定页面加载时默认选中的值。此属性应在组中的一个单选按钮上使用。\n\n```\n<body>\n披萨尺寸：\n<label><input\
  \ type=\"radio\" name=\"size\" value=\"small\"/>小份</label>\n<label><input type=\"\
  radio\" name=\"size\" value=\"medium\"/>中份</label>\n<label><input type=\"radio\"\
  \ name=\"size\" value=\"large\"/>大份</label>\n</body>\n```\n\n## 复选框\n\n复选框用于选择一个或多个选项，或取消选择。\n\
  \n### `type=\"checkbox\"`\n\n允许用户针对一个问题选择一个或多个选项，或取消选择。\n\n### Name\n\n此属性会与用户选择的选项值一起传输到服务器。当用户需要以复选框形式回答带有选项的问题时，所有按钮的\
  \ `name` 属性值必须保持一致。\n\n### Value\n\n当复选框被选中时，此属性指定发送到服务器的值。\n\n### Checked\n\n`checked`\
  \ 属性指定页面加载时应被选中的复选框。\n\n```\n<body>\n披萨配料：\n<label><input type=\"checkbox\" value=\"\
  bacon\" />培根</label>\n<label><input type=\"checkbox\" value=\"extra cheese\" />额外芝士</label>\n\
  <label><input type=\"checkbox\" value=\"extra cheese\" />洋葱</label>\n</body>\n```\n\
  \n## 下拉列表\n\n选择框，也称为下拉列表，允许用户从下拉列表中选择一个选项。下拉列表通过 `<select>` 标签创建，并包含两个或更多 `<option>`\
  \ 标签。\n\n### Name\n\n`name` 属性表示表单控件的名称，该名称会与用户选择的值一起发送到服务器。\n\n### `<option>`\n\
  \n此元素用于向访问者显示选项。位于开始 `<option>` 和结束 `</option>` 元素之间的文本将显示在下拉框中。\n\n### Value\n\n\
  `<option>` 标签使用 `value` 属性指定当该选项被选中时，与控件名称一起发送到服务器的值。\n\n### Selected\n\n此属性用于指定页面加载时应自动选中的选项。\n\
  \n```\n<body>\n<label>手机：\n<select name=\"devices\">\n<option value=\"techno\">索尼</option>\n\
  <option value=\"infinix\">Infinix</option>\n<option value=\"samsung\">三星</option>\n\
  <option value=\"sony\" selected>选择设备</option>\n</select>\n</label>\n</body>\n```\n\
  \n## 文件输入框\n\n文件输入框用于允许用户在网页上上传文件。文件可以是图片、音频、PDF 或视频。\n\n### `type=\"file\"`\n\n\
  此输入产生一个框，类似于文本输入，并带有一个浏览按钮。当选择浏览按钮时，会弹出一个窗口，允许用户从计算机中选择文件以上传到网站。\n\n```\n<form action=”\
  \ process.php” method=\"post\">\n<p>请以 MP3 格式上传您的歌曲：</p>\n<input type=\"file\" name=\"\
  user-song\" /><br />\n<input type=\"submit\" value=\"上传\" />\n</form>\n```\n\n###\
  \ `type=\"submit\"`\n\n当用户需要提交表单时使用此属性。\n\n```\n<body>\n<form action=\"process.php\"\
  \ method=\"post\">\n<p>订阅我们的邮件列表：</p>\n<input type=\"text\" name=\"email\" value=\"\
  email\" />\n<input type=\"submit\" value=\"订阅\" />\n</form>\n</body>\n```\n\n###\
  \ Name\n\n它可以使用 `name` 属性，但并非必需。\n\n### Value\n\n`value` 属性用于影响按钮上显示的文本。建议指定按钮上显示的文字，因为某些浏览器上按钮的默认值为“提交查询”，这可能不适用于所有表单。\n\
  \n## 重置按钮\n\n### `type=\"reset\"`\n\n此按钮用于清除用户的所有输入。\n\n```\n<input type=\"reset\"\
  \ value=\"重置\" />\n```\n\n## 图片按钮\n\n可以使用图片作为提交按钮。`type` 属性必须设置为 image。还可以提供 `src`\
  \ 属性。\n\n```\n<form action=\"http://www.websitename.com/subscribe.php\">\n<p>订阅我们的邮件列表：</p>\n\
  <input type=\"text\" name=\"email\" />\n<input type=\"image\" src=\"subscribe.png\"\
  \ width=\"100\" height=\"20\" alt=\"订阅\" />\n</form>\n```\n\n## 按钮标签\n\n`<button>`\
  \ 标签指定一个可点击的按钮。可以在 `<button>` 元素中插入文本、内容或图片。使用 `<input>` 元素创建的按钮与使用 `<button>` 标签创建的按钮不同。应始终指定\
  \ `<button>` 元素的 `type` 属性。\n\n```\n<button type=\"submit\">点击我！</button>\n```\n\
  \n## Fieldset 元素\n\n较长的表单从 `<fieldset>` 元素中获益良多。它用于将相关的表单控件分组。\n\n```\n<form method=\"\
  post\">\n<fieldset>\n<legend>联系方式</legend>\n<label>地址：<br><input type=\"text\" name=\"\
  text\"><br></label>\n<label>电话号码：<br><input type=\"number\" name=\"number\"><br></label>\n\
  <label>电子邮件：<br><input type=\"email\" name=\"email\"><br></label>\n</fieldset>\n\
  </form>\n```\n\n## Legend 元素\n\n`<legend>` 元素紧跟在开始 `<fieldset>` 标签之后，包含一个标题，用于标识该表单控件组的用途。\n\
  \n```\n<form method=\"post\">\n<fieldset>\n<legend>联系方式</legend>\n<label>地址：<br><input\
  \ type=\"text\" name=\"text\"><br></label>\n<label>电话号码：<br><input type=\"number\"\
  \ name=\"number\"><br></label>\n<label>电子邮件：<br><input type=\"email\" name=\"email\"\
  ><br></label>\n</fieldset>\n</form>\n```\n\n## Label 元素\n\nlabel 标签可用于为表单控件添加说明，以便用户知道应在该区域输入什么内容。\n\
  \n```\n<form >\n<label for=\"male\">男</label>\n<input type=\"radio\" name=\"gender\"\
  \ id=\"male\" value=\"male\"><br>\n<label for=\"female\">女</label>\n<input type=\"\
  radio\" name=\"gender\" id=\"female\" value=\"female\"><br>\n<label for=\"other\"\
  >其他</label>\n<input type=\"radio\" name=\"gender\" id=\"other\" value=\"other\"\
  ><br><br>\n<input type=\"submit\" value=\"提交\">\n</form>\n```\n\n# 第 6 章 Iframe\
  \ 与多媒体\n\n## Iframe\n\n`<iframe>` 元素可用于将网页嵌入到您的网页中。\n\n### Iframe 嵌入：谷歌地图\n\n可以使用\
  \ iframe 标签将谷歌地图嵌入到您的网页中。\n\n```\n<iframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3963.341775346873!2d3.3422253148425853!3d6.604381995223933!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b8d7c33eb87b3%3A0xfc23c9556f669273!2sWebsite+Name!5e0!3m2!1sen!2sng!4v1516009132030\"\
  \ width=\"600\" height=\"450\" frameborder=\"0\" style=\"border:0\" allowfullscreen></iframe>\n\
  ```\n\n### Iframe 嵌入：YouTube\n\n```\n<body>\n<iframe width=\"450\" height=\"400\"\
  \ src=\"https://www.youtube.com/embed/MhPGaOTiK0A\" frameborder=\"0\" allowfullscreen></iframe>\n\
  </body>\n```\n\n## HTML5 中的多媒体\n\nHTML5 允许用户使用原生 HTML 标签嵌入视频或音频。如果浏览器支持该文件格式，它将为用户提供播放控制。音频和视频标签都是新特性，可在最新版本的浏览器中使用。常见的视频格式有\
  \ `.mp4`、`.m4v`、Flash 视频（`.flv`）、音频视频交错（`.avi`）等。\n\n### 视频元素：\n\n可以使用 video 元素为特定视频文件嵌入视频播放器。以下属性用于自定义播放器：`preload`、`loop`、`autoplay`、`poster`、`auto`\
  \ 和 `controls`。\n\n#### Preload\n\n`preload` 属性指示浏览器在页面加载时应采取什么操作。可以取以下三个值之一：\n\n\
  - `None`：页面加载时视频不会自动加载，直到用户点击播放。\n- `Auto`：页面加载时浏览器应下载视频。\n- `Metadata`：表示浏览器应获取诸如第一帧、大小、轨道列表和时长等信息。\n\
  \n#### Src\n\n此属性指定视频的路径。\n\n#### Poster\n\n此属性允许用户指定一个图像，在视频下载期间或用户决定播放视频之前显示。\n\
  \n#### Width, height\n\n这些属性指定播放器的大小。\n\n#### Controls\n\n此属性指定浏览器应提供自己的播放控件。\n\n\
  #### Autoplay\n\n此属性表示文件应在使用时自动播放。\n\n#### Loop\n\n此属性指定视频在播放结束后应立即从头开始重新播放。\n\n\
  ### 多种视频格式\n\nHTML5 允许用户为音频和视频元素指定多个来源，以便浏览器可以使用其中任何一个可用的格式。\n\n```\n<video poster=\"\
  images/calvin.jpg\" controls preload=\"none\" width=\"450\" height=\"420\">\n<source\
  \ src=\"calvin.mp4\" type=\"video/mp4\" />\n<source src=\"calvin.webm\" type=\"\
  video/webm\" />\n<source src=\"calvin.ogv\" type=\"video/ogv\" />\n<p>Calvin Harris\
  \ 音乐视频</p>\n</video>\n```\n\n### 音频元素\n\n使用 audio 元素可以将音频播放器嵌入到页面中，用于播放特定的音频文件。可以使用不同的属性来自定义播放器，例如\
  \ `autoplay`、`controls`、`loop` 和 `preload`。\n\n#### Autoplay\n\n这是一个布尔属性。如果使用，音频将自动播放并持续播放，不会停止。\n\
  \n#### Loop\n\n`loop` 属性也是一个布尔属性，它表示音频每次播放结束后将重新开始，循环播放。\n\n```\n<body>\n<audio\
  \ src=\"avicii.mp3\" controls=\"true\" autobuffer=\"true\"></audio>\n</body>\n```\n\
  \n### Control\n\n使用 `control` 属性插入音频控件，包括暂停、播放和音量等控件。`<source>` 元素允许用户指定浏览器可以选择的替代音频文件。浏览器将识别第一个支持的格式。位于\
  \ `<audio>` 和 `</audio>` 元素之间的文本将在不支持 `<audio>` 元素的浏览器中显示。\n\n```\n<audio src=\"\
  audio/test-audio.ogg\" controls autoplay>\n<p>此浏览器不支持我们的音频格式。</p>\n</audio>\n```\n\
  \n### 多种音频格式\n\n```\n<audio controls autoplay>\n<source src=\"audio/test-audio.ogg\"\
  \ />\n<source src=\"audio/test-audio.mp3\" />\n<p>此浏览器不支持我们的音频格式。</p>\n</audio>\n\
  ```\n\n# 第 7 章 文档对象模型\n\n文档对象指的是您的整个 HTML 页面。当您将对象加载到 Web 浏览器中后，它立即成为一个文档对象，它是表示\
  \ HTML 文档的根元素。它同时具有属性和方法。文档对象帮助我们向网页添加内容。它是 window 的一个对象，这意味着：\n\n`window.document`\n\
  \n等同于：\n\n`document`\n\n## DOM 方法\n\nDOM 方法是您可以对 HTML 元素执行的操作。DOM 属性是 HTML 元素的值，您可以设置或更改这些值。以下是文档对象的方法：\n\
  \n\n\n\n1.  `write(\"string\")` - 它将字符串写入文档。\n2.  `writeln(\"string\")` - 它将字符串写入文档并添加换行符。\n\
  3.  `getElementById()` - 返回具有指定 id 的元素。\n4.  `getElementsByName()` - 返回所有具有指定 name\
  \ 的元素。\n5.  `getElementsByTagName()` - 返回所有具有指定标签名的元素。\n6.  `getElementsByClassName()`\
  \ - 返回所有具有指定类名的元素。\n\n访问字段值  \nDOM 是获取输入字段值的好方法。很多时候你需要从用户那里获取输入。这可以通过以下属性实现：  \n\
  `document.form_name.field_name.value`  \n\n其中：\n*   `document` - 是表示根元素的 HTML 文档。\n\
  *   `form_name` - 是包含字段的表单的名称。\n*   `field_name` - 是输入文本的名称。\n*   `value` - 是一个属性，返回输入文本的值。\n\
  \n\n\n\n请考虑以下示例：\n\n```\n<html><body><script type=\"text/javascript\">\n  function\
  \ readValue(){\n  var name=document. memberform. memberName. value;\n  alert( \"\
  Hi: \" + name);\n  }\n  </script>\n  <form name=\"memberform\">\n  Enter Name:<input\
  \ type=\"text\" name=\"memberName\" />\n  <input type=\"button\" onclick=\"readValue()\"\
  \ value=\"Click Here\" />\n  </form>\n  </body></html>\n```\n\n运行代码后，会得到如下简单表单：\n\
  只需在输入框中输入你的名字，然后点击“Click Here”按钮，看看会发生什么。\n你会看到一个弹出框，其中包含你的名字以及附加的一些文本：\n我们只是创建了一个带有输入文本字段的简单表单。方法\
  \ `readValue()` 帮助我们获取输入到字段中的值。请看下面这一行：\n`var name=document. memberform. memberName.\
  \ value;`\n其中 `memberName` 是表单中文本字段的名称，这些名称必须匹配，否则你将无法得到正确的结果。\n\n### getElementById()\n\
  \n除了名称，我们还可以通过元素的 id 来获取它。这可以通过 `document.getElementById()` 方法实现。不过，输入文本字段需要指定一个\
  \ id。\n例如：\n\n```\n<html><body><script type=\"text/javascript\">\n  function computeSquare(){\n\
  \  var x=document. getElementById( \"integer\" ). value;\n  alert( x * x);\n  }\n\
  \  </script>\n  <form>\n  Enter an Integer:<input type=\"text\" id=\"integer\" name=\"\
  myNumber\" /><br/>\n  <input type=\"button\" value=\"Compute Square\" onclick=\"\
  computeSquare()\" />\n  </form>\n  </body></html>\n```\n\n执行代码后，会得到如下简单表单：\n在输入框中输入一个数字，然后点击“Compute\
  \ Square”按钮。\n这会在弹出框中返回该数字的平方，如下所示：\n在示例中，我们定义了 `computeSquare()` 方法，它帮助我们获取输入文本字段中数字的平方。请看下面这一行：\n\
  `var x=document. getElementById( \"integer\" ). value;`\n在这一行中，我们使用了 `getElementById()`\
  \ 方法，该方法将输入文本字段的 id 作为参数。它帮助我们通过 id 获取输入文本字段中键入的值。\n\n### getElementsByName()\n\n\
  `document.getElementsByName()` 方法可以帮助我们通过名称获取元素。该方法的语法如下：\n`document. getElementsByName(\
  \ \"name\" )`\n名称是必需的。\n示例：\n\n```\n<html><body><script type=\"text/javascript\"\
  >\n  function getNumber()\n  {\n  var options=document. getElementsByName( \"option\"\
  \ );\n  alert( \"Total Options:\" + options . length );\n  }\n  </script>\n  <form>\n\
  \  Yes:<input type=\"radio\" name=\"option\" value=\"yes\" >\n  No:<input type=\"\
  radio\" name=\"option\" value=\"no\" >\n  <input type=\"button\" onclick=\"getNumber()\"\
  \ value=\"Available Options\" >\n  </form></body></html>\n```\n\n执行后，代码返回如下：\n点击“Available\
  \ Options”按钮，看看会发生什么。会弹出一个窗口，如下所示：\n我们创建了两个单选按钮，选项分别为 Yes 和 No。注意，这两个输入类型被赋予了相同的名称，即\
  \ `option`。\n请看下面这一行：\n`var options=document. getElementsByName( \"option\" );`\n\
  这一行帮助我们统计名称为 `option` 的元素数量。根据输出，结果应为 2。\n\n### getElementsByTagName()\n\n`document.getElementsByTagName()`\
  \ 属性返回具有指定标签名称的元素。其语法如下：\n`document. getElementsByTagName( \"name\" )`\n例如：\n\n\
  ```\n<html><body><script type=\"text/javascript\">\n  function allparagraphs(){\n\
  \  var pgs=document. getElementsByTagName( \"p\" );\n  alert( \"Total paragraphs\
  \ are: \"+ pgs . length );\n  }\n  </script>\n  <p> This is a paragraph</p>\n  <p>\
  \ This is a paragraph</p>\n  <p> This is a paragraph</p><p> This is a paragraph</p><button\
  \ onclick=\"allparagraphs()\"> Total Paragraphs</button>\n  </body></html>\n```\n\
  \n执行后，代码返回如下：\n点击“Total Paragraphs”按钮，看看会发生什么。\n你会看到如下弹出框：\n这意味着代码能够统计出我们拥有的段落数量。\n\
  主要逻辑在于下面这一行：\n`var pgs=document. getElementsByTagName( \"p\" );`\n我们将标签“p”作为参数传递给方法，该标签代表一个段落。共有三个带有标签“p”的元素，因此输出应为\
  \ 4 个段落。\n\n下面是另一个示例：\n\n```\n<html><body><script type=\"text/javascript\">\n  function\
  \ countheader2(){\n  var h2count=document. getElementsByTagName( \"h2\" );\n  alert(\
  \ \"Total count for h2 tags: \"+ h2count . length );\n  }\n  function countheader3(){\n\
  \  var h3count=document. getElementsByTagName( \"h3\" );\n  alert( \"Total count\
  \ for h3 tags: \"+ h3count . length );\n  }\n  </script>\n  <h2> A h2 tag</h2>\n\
  \  <h2> A h2 tag</h2><h2> A h2 tag</h2><h2> A h2 tag</h2><h3> A h3 tag</h3>\n  <h3>\
  \ A h3 tag</h3>\n  <h3> A h3 tag</h3><h3> A h3 tag</h3><h3> A h3 tag</h3><button\
  \ onclick=\"countheader2()\"> Total h2</button>\n  <button onclick=\"countheader3()\"\
  > Total h3</button>\n  </body></html>\n```\n\n执行后，代码返回如下输出：\n我们总共有 4 个 h2 标签和 5\
  \ 个 h3 标签。点击“Total h2”按钮，看看会发生什么。\n你应该会得到如下弹出框：\n点击“Total h3”按钮，看看会发生什么。\n你应该会得到如下弹出框：\n\
  \n### innerHTML\n\n该属性可用于向 HTML 页面添加动态内容。当需要生成动态内容（如评论表单、注册表单等）时，会在 HTML 页面上使用它。\n\
  请看以下示例：\n\n```\n<html><body><script type=\"text/javascript\">\n  function displayform()\
  \ {\n  var data = \"Username:<br><input type='text' name='name'><br>Comment:<br><textarea\
  \ rows='6' cols='45'></textarea><br><input type='submit' value='Contact us'>\";\n\
  \    document. getElementById( 'area' ). innerHTML= data;\n  }\n  </script>\n  <form\
  \ name=\"form1\">\n  <input type=\"button\" value=\"Contact us\" onclick=\"displayform()\"\
  \ >\n  <div id=\"area\"></div>\n  </form>\n  </body></html>\n```\n\n执行后，代码返回如下按钮：\n\
  点击按钮，看看会发生什么。你会得到如下结果：\n我们所做的是在用户点击按钮后创建一个“联系我们”表单。注意，HTML 表单是在我们创建并命名为 `area` 的\
  \ div 内部生成的。为了定位位置，我们调用了 `document.getElementById()` 方法。\n\n### innerText\n\n我们可以使用该属性向\
  \ HTML 页面添加动态文本。注意，使用该属性时，你的文本会被解释为普通文本，而不是 HTML 内容。一个很好的应用场景是，当你需要根据密码长度写出密码强度、写出验证消息等时。\n\
  例如：\n\n```\n<html><body><script type=\"text/javascript\">\n  function validatePass()\
  \ {\n  var message;\n  if(document. form1. userPass. value. length> 5 ){\n  message=\
  \ \"good\" ;\n  }\n  else{\n  message= \"poor\" ;\n  }\n  document. getElementById(\
  \ 'area' ). innerText= message;\n  }\n  </script>\n  <form name=\"form1\">\n  <input\
  \ type=\"password\" value=\"\" name=\"userPass\" onkeyup=\"validatePass()\" >\n\
  \  Strength:<span id=\"area\"> Pasword strength </span>\n  </form>\n  </body></html>\n\
  ```\n\n执行后，代码返回如下：\n开始输入密码，看看输入时输入字段右侧的文本会发生什么变化。如果你输入的密码少于 5 个字符，消息将变为“poor”，如下所示：\n\
  继续输入密码，直到超过 5 个字符。你会看到消息变为“good”，如下所示：\n这就是该属性的强大之处。\n\n## 动画\n\n使用 JavaScript，我们可以对元素进行动画处理。我们可以使用\
  \ JavaScript 根据某个方程在页面上移动诸如 `<img />`、`<div>` 等元素。以下是 JavaScript 中用于动画的常用方法：\n\n\
  1.  `setTimeout(method, time)` - 该方法将在指定的毫秒数后调用指定的方法。\n\n\n\n\n\n2. `setInterval\
  \ (method, time)` - 该方法会在 `time` 毫秒后调用指定的方法。\n\n使用 JavaScript，可以设置 DOM 对象的某些属性，例如其在屏幕上的位置。对象的位置可以通过\
  \ `top` 和 `left` 属性来设置。示例如下：\n\n```\n// 设置距离屏幕左边缘的距离。object.style.left = 以点或像素为单位的距离；\
  \    或// 设置距离屏幕顶部边缘的距离。object.style.top = 以点或像素为单位的距离；\n```\n\n### 手动动画\n\n在以下示例中，我们将让图像向右移动：\n\
  \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar image = null;\n\
  function init () {\n    image = document.getElementById('myImage');\n    image.style.position\
  \ = 'relative';\n    image.style.left = '0px';\n}\nfunction moveImage () {\n   \
  \ image.style.left = parseInt(image.style.left) + 10 + 'px';\n}\nwindow.onload =\
  \ init;\n</script>\n</head>\n<body>\n<form>\n<img id=\"myImage\" src=\"house.jpg\"\
  \ />\n<p> 点击按钮移动图像</p>\n<input type=\"button\" value=\"移动图像\" onclick=\"moveImage();\"\
  \ />\n</form>\n</body>\n</html>\n```\n\n在以下行中，你应该使用自己图像的正确名称：`<img id=\"myImage\"\
  \ src=\"house.jpg\" />`。在我的例子中，我有一张名为 house 的 .jpg 图像。运行代码后，会得到如下结果：\n\n点击“移动图像”按钮。每次点击，图像都会向右移动。效果如下所示：\n\
  \n考虑脚本中的这一行：`image = document.getElementById('myImage');`。我们通过图像的 ID 获取它，然后将其赋值给\
  \ `image` 变量。`init()` 方法帮助我们设置图像在窗口中的初始位置。该方法会在窗口加载时被调用。`moveImage()` 函数会在每次点击后将图像向右移动\
  \ 10 像素。如果要让图像向左移动，应将值设为负数。在这种情况下，动画是手动的，因为我们需要点击按钮。\n\n### 自动动画\n\n要实现元素的自动动画，我们可以使用\
  \ JavaScript 提供的 `setTimeout()` 函数。\n\n示例：\n\n```html\n<script type=\"text/javascript\"\
  >\nvar image = null;\nvar animate;\nfunction init () {\n    image = document.getElementById('myImage');\n\
  \    image.style.position = 'relative';\n    image.style.left = '0px';\n}\nfunction\
  \ animateImage () {\n    image.style.left = parseInt(image.style.left) + 10 + 'px';\n\
  \    animate = setTimeout(animateImage, 20);\n}\nfunction stopAnimation () {\n \
  \   clearTimeout(animate);\n    image.style.left = '0px';\n}\nwindow.onload = init;\n\
  </script>\n</head>\n<body>\n<form>\n<img id=\"myImage\" src=\"house.jpg\" />\n<p>\
  \ 点击“动画”按钮启动动画</p>\n<input type=\"button\" value=\"动画\" onclick=\"animateImage();\"\
  \ />\n<input type=\"button\" value=\"停止\" onclick=\"stopAnimation();\" />\n</form>\n\
  ```\n\n执行代码后返回如下结果：\n\n点击“动画”按钮，动画开始。当点击“停止”按钮时，动画停止。\n\n`animateImage()` 方法调用了\
  \ `setTimeout` 方法，该方法每隔 20 毫秒设置一次图像的位置。这将导致图像产生动画效果。`stopAnimation()` 方法用于清除由 `setTimeout()`\
  \ 方法设置的计时器。对象（即图像）被重置回其初始位置。\n\n### 鼠标悬停效果\n\n我们可以使用鼠标图像在 JavaScript 中实现图像悬停效果。当鼠标移动到图像上时，它会变成另一张图像。\n\
  \n示例：\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nif(document.images)\
  \ {\n    var img1 = new Image();\n    img1.src = \"ps.jpg\";\n    var img2 = new\
  \ Image();\n    img2.src = \"house.jpg\";\n}\n</script>\n</head>\n<body>\n<p> 将鼠标移上来实现悬停效果</p>\n\
  <a href=\"#\" onMouseOver=\"document.img.src=img2.src;\" onMouseOut=\"document.img.src=img1.src;\"\
  >\n<img name=\"img\" src=\"nicsam.jpg\" />\n</a>\n</body>\n</html>\n```\n\n我们使用了\
  \ `if` 语句来检查图像是否存在。我们使用了 `Image()` 构造函数来预加载一个名为 `img1` 的新对象。同样地，也预加载了第二张图像 `img2`。`src`\
  \ 被赋予外部存储的图像名称。`#` 用于禁用链接，这样点击后不会打开 URL。当鼠标光标移动到图像上时，会调用 `onMouseOver` 方法。当鼠标光标移出图像时，会调用\
  \ `onMouseOut` 方法。\n\n# 第 8 章 子句\n\n## GROUP BY 子句\n\n`GROUP BY` 子句将指定列中具有数据的所有行收集在一起。它还会允许我们之前讨论的聚合函数在这些列上执行。最好通过一个例子来解释：\n\
  \nGROUP BY 子句语法：\n\n```\nSELECT column1,\nSUM(column2)\nFROM \"list-of-tables\"\n\
  GROUP BY \"column-list\";\n```\n\n假设你想检索每个独立部门支付的最高薪资数据。你的语句如下：\n\n```\nSELECT max(salary),\
  \ dept\nFROM employee\nGROUP BY dept;\n```\n\n该语句将按名称显示每个唯一部门中的最高薪资。简而言之，每个部门中薪资最高的人员姓名将与其薪资和所在部门一起显示。\n\
  \n## HAVING 子句\n\n`HAVING` 子句允许你为每个特定组指定行的条件，换句话说，根据你输入的具体条件选择某些行。如果使用 `HAVING`\
  \ 子句，它应始终跟在 `GROUP BY` 子句之后：\n\nHAVING 子句语法：\n\n```\nSELECT column1,\nSUM(column2)\n\
  FROM \"list-of-tables\"\nGROUP BY \"column-list\"\nHAVING \"condition\";\n```\n\n\
  最好通过一个例子来展示 `HAVING` 子句。假设你有一个表，其中包含员工姓名、所在部门、薪资和年龄。假设你想找出每个独立部门中每位员工的平均薪资，你可以输入：\n\
  \n```\nSELECT dept, avg(salary)\nFROM employee\nGROUP BY dept;\n```\n\n但现在假设你只想计算平均薪资，并且仅当薪资超过\
  \ 20,000 美元时才显示。你的语句如下：\n\n```\nSELECT dept, avg(salary)\nFROM employee\nGROUP BY\
  \ dept\nHAVING avg(salary) > 20000;\n```\n\n## ORDER BY 子句\n\n`ORDER BY` 子句是可选的，它允许你按排序顺序（升序或降序）显示查询结果，排序依据是你选择用于排序数据的列。\n\
  \nORDER BY 子句语法：\n\n```\nSELECT column1, SUM(column2) FROM \"list-of-tables\" ORDER\
  \ BY \"column-list\" [ASC | DESC];\n```\n\n* `[ ]` = 可选\n\n该语句将显示你指定的表（本例中为 `employee_info`\
  \ 表）中的员工 ID、部门、姓名、年龄和薪资，其中部门等于 SALES。结果将按薪资升序排列：\n\n* `ASC` = 升序 - 默认\n* `DESC`\
  \ = 降序\n\n例如：\n\n```\nSELECT employee_id, dept, name, age, salary FROM employee_info\
  \ WHERE dept = 'Sales' ORDER BY salary;\n```\n\n如果要从多个列排序数据，每个列名必须用逗号分隔：\n\n```\n\
  SELECT employee_id, dept, name, age, salary\nFROM employee_info\nWHERE dept = 'Sales'\n\
  ORDER BY salary, age DESC;\n```\n\n\n\n\n\n# 第 9 章 运算符、数据类型及其他优先级\n\n## JavaScript\
  \ 计算\n\n所有编程语言都允许你进行计算。从某种意义上说，你可以把 JS 当作袖珍计算器来使用。例如，输入以下内容：\n\n```\n\"use strict\"\
  ;console.log(3 + 4);\n```\n\n清单 5 `accompanying_files/03/examples/calc.js`\n\n不出所料，你会得到结果\
  \ 7。\n\n仅从这个非常简短简单的例子中，你就能看到几个关键的 JS 概念。`3 + 4` 是一个表达式。表达式是 JS 中最重要的概念之一。表达式的特点是具有返回值——在本例中，返回值是数字\
  \ 7。反过来，你可以在代码的不同位置使用返回值，例如作为函数调用的参数。或者换句话说，JavaScript 会用表达式的（返回）值来替换表达式本身。\n\n\
  ![00016.jpeg](img/rsrc1BR.jpg)\n\n### 表达式\n\n#### Firefox Web 控制台中的表达式\n\n你也可以直接在\
  \ Firefox Web 控制台中输入表达式。尝试在输入行（双箭头 \"）旁边输入 `3 + 4`。\n\n![00017.jpeg](img/rsrc1C0.jpg)\n\
  \n直接在控制台中输入表达式——输入\n\n按回车确认输入后，控制台会立即显示返回值。\n\n![00018.jpeg](img/rsrc1C7.jpg)\n\n\
  直接在控制台中输入表达式——输出\n\n顺便提一下，你也可以使用 Shift+回车来输入多行语句，即跨越多行的单条语句。整个语句只有在按回车后才会执行。\n\n\
  或者，你也可以在 Scratchpad 中选择部分表达式，并使用“检查”（Ctrl-I / Cmd-I）来查看。如  所示，Scratchpad 会在右侧边栏中将\
  \ `4 * 2` 的结果显示为 `value: 8`。\n\n![00019.jpeg](img/rsrc1CD.jpg)\n\n在 Scratchpad 中检查选中的（部分）表达式\n\
  \n### 表示法\n\n从现在开始，我们会经常指出某个表达式返回的值，或者控制台中显示的值。为此，我们会在代码中插入注释，并在 `=>`（即所谓的胖箭头）前面显示该值。\n\
  \n示例\n\n```\n3 + 4 // => 7\nconsole.log(3 + 4 * 2); //=> 11\n```\n\n### JavaScript\
  \ 作为袖珍计算器：算术运算符\n\n除了乘法和加法运算符，JS 还有用于减法、除法和取模等算术运算的相应运算符。所有这些运算符都属于所谓的算术运算符组：\n\n\
  | 符号 | 运算 |\n|------|------|\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n|\
  \ % | 取模——整数除法的余数 |\n| ** | 乘方（ECMAScript 2016+） |\n\n表 算术运算符\n\n示例\n\n* `5 + 4`\
  \ 返回 9\n* `5 - 4` 返回 1\n* `5 * 4` 返回 20\n* `5 / 4` 返回 1.25\n* `10 % 3` 返回 1，因为 `10\
  \ - 3 * 3 = 1`。\n* `5 ** 4` 返回 625，因为 `5 * 5 * 5 * 5 = 625`。\n\n#### 练习 3：2000 秒\n\
  \n2000 秒等于多少分钟和余数秒？使用 `console.log` 打印出答案。\n\n提示：解决这个练习最简单的方法是使用取模运算符。目前我们还没有教你如何去除小数位，我们稍后会再回到这个问题。\n\
  \n## 字符与字符串\n\n你有没有注意到数字和文本的编码方式有所不同？上一课开头的 \"Hello world\" 是用引号写出来的，而数字则没有。文本元素写在引号内，实际上是将单个字符串接或链接在一起——这给了我们编程术语\
  \ **字符串** 来表示这样的文本。\n\n### 两种引号\n\n你可以使用单引号或双引号来界定字符串，但字符串开头和结尾的引号必须相同。\n\n示例\n\n\
  * `\"Some text string\"` 是允许的\n* `'Some text string'` 也是允许的\n* `\"Some text string'`\
  \ 是无效的\n\n大多数 JS 开发者一致使用双引号，仅在特殊情况下使用单引号，例如当需要在字符串内使用双引号来表示字面文字时。\n\n### 编码指南\n\n\
  通常你应该使用双引号来界定字符串。\n\n### 确定长度\n\n有时你需要知道字符串的长度——即其中包含多少个字符。随着你进行越来越多的开发，你会遇到许多长度很重要的场景。\n\
  \n例如，博客、产品列表以及类似项目有时会提供文本预览，只显示整个文本的一部分。在生成此预览之前，必须先测量整个文本项的长度，以确定文本是否真的需要缩短。\n\n\
  因此，在这一点上，我们想向你介绍字符串属性 `length`。你可以通过在字符串后面输入 `.length` 来让字符串返回此属性。\n\n```\n\"length\
  \ matters - sometimes\".length // => 26\n```\n\n然后将你的语句包装到 `console.log` 中，这样你就可以在控制台上看到所需的响应：\n\
  \n```\n\"use strict\";\nconsole.log(\"length matters - sometimes\".length);\n```\n\
  \n清单 6 `accompanying_files/03/examples/length.js`\n\n#### 练习 4：幸运数字与名字代码\n\n你知道幸运数字和代码名称吗？这里有一种有趣的方法来生成名字代码：\n\
  \n将你名字（如果你愿意，可以包括中间名）的长度乘以你姓氏的长度，并在控制台中打印出结果。（顺便告诉你，我们得到的结果是 40 和 30。）\n\n## 字面量：名副其实\n\
  \n既然你已经了解了字符串和数字，我们还需要告诉你另一个重要概念：基本上，任何在代码中直接指定的值——无论是字符串还是数字——都被称为（你猜对了）**字面量**。字面量总是具有固定的值。\n\
  \n示例\n\n* `42`\n* `\"house\"`\n* `\"green\"`\n* `5.47`\n* `1998`\n* `\"Please enter\
  \ your name\"`\n\n## 数字与字符串数据类型\n\nJavaScript 字面量具有所谓的**数据类型**。顾名思义，数据类型指定了字面量所代表的数据种类，进而指定了其可能的取值。\n\
  \n到目前为止，我们使用了以下数据类型：\n\n| 数据类型 | 允许的值/含义 | 字面量示例 |\n|----------|---------------|------------|\n\
  | 字符串 | 任何文本 | `\"Hello\"` |\n| 数字 | 任何正数或负数 | `246.5` |\n\n\n\n\n\n## 字符串与数值数据类型\n\
  \nJavaScript 以所谓的 UTF-16 字符格式 [ECMA-262] 对字符串进行编码。编码格式决定了字符在数字上的表示方式。UTF-16 让你能够使用各种特殊字符以及不同语言中的特定字母（例如德语变音符号、带重音的法语字符等）。\n\
  \n数值的取值范围也是有限的。不过，只要你不进行天文级别的计算，应该就没问题。\n\n要找出字面量的数据类型很简单——只需使用 JavaScript 运算符 `typeof`。`typeof`\
  \ 返回一个字符串，告诉你该字面量的数据类型。\n\n### 示例\n\n```\n\"use strict\";\nconsole.log(typeof 3764);\
  \           // => number\nconsole.log(typeof \"beautiful JS\"); // => string\nconsole.log(typeof\
  \ 27.31);          // => number\n```\n\n`清单 7` `accompanying_files/03/examples/type.js`\n\
  \n### 练习 5：嗯……那你到底是什么？\n\n以下字面量的数据类型是什么？\n\n`\"42\"`\n\n# 第 10 章 文档对象模型（DOM）\n\n\
  `document` 对象是浏览器为每个新 HTML 页面创建的对象。创建后，JavaScript 允许我们访问该对象的许多属性和方法，这些属性和方法可以以各种方式影响文档，例如管理或更改信息。事实上，我们一直在使用该对象的一个方法\
  \ `document.write()` 来在网页中显示内容。不过，在探索属性和方法之前，我们首先来看一下文档对象模型（DOM）。\n\n## DOM 基本概念\n\
  \n我们知道，当 Web 浏览器接收到 HTML 文件时，它会将其连同所有附带文件（如图像和 CSS 样式）一起显示为屏幕上的网页。然而，浏览器还会根据其 HTML\
  \ 结构创建该 Web 文档的一个模型。这意味着所有标签、它们的属性以及它们出现的顺序都会被浏览器记住。这种表示称为文档对象模型（DOM），它用于向 JavaScript\
  \ 提供如何与网页元素通信的信息。此外，DOM 还提供了可用于导航或修改 HTML 代码的工具。\n\n文档对象模型是由万维网联盟（W3C）定义的标准，大多数浏览器开发者都使用该标准。为了更好地理解\
  \ DOM，我们先来看一个非常简单的网页：\n\n```\n<!doctype html>\n<html>\n<head>\n<meta charset=\"\
  utf-8\">\n<title>Party Schedule</title>\n<style type=\"text/css\">\n.current {color:red;}\n\
  .finished {color:green;}\n</style>\n</head>\n<body>\n<h1 id=\"partytitle\">Party\
  \ Plan</h1>\n<ul id=\"partyplan\">\n<li id=\"phase1\">20:00 - Home warm-up</li>\n\
  <li id=\"phase2\">22:00 - Joe's Bar</li>\n<li id=\"phase3\">00:00 - Nightclub 54</li>\n\
  </ul>\n</body>\n</html>\n```\n\n在网页中，标签会包裹其他标签。`<html>` 标签包裹 `<head>` 和 `<body>`\
  \ 标签。`<head>` 标签包裹诸如 `<title>`、`<meta>` 和 `<script>` 等标签。`<body>` 包裹所有内容标签，如 `<p>`、`<h1>`\
  \ 到 `<h6>`、`<ul>`、`<table>` 等。\n\n标签之间的这种关系可以用树形结构来表示，其中 `<html>` 标签充当树的根，而其他标签则根据文档中的标签层级表示不同的树分支结构。除了标签之外，Web\
  \ 浏览器还会记住标签的属性以及标签内的文本内容。在 DOM 中，这些项目（标签、属性和文本）都被视为独立的单元，称为节点。\n\n**图 26.** HTML\
  \ 文档的树形结构\n\n在我们这个基本 HTML 页面的树形结构中，`<html>` 元素充当根元素，而 `<head>` 和 `<body>` 元素是节点。在定义这种关系时，我们也可以将\
  \ `<html>` 称为父节点，将 `<head>` 和 `<body>` 元素称为子节点。反过来，`<head>` 和 `<body>` 元素也包含子节点，依此类推。当我们到达一个不包含其他子节点的项目时，我们就在该节点处终止树形结构，该节点也称为叶节点。\n\
  \n## 选择文档元素\n\n有了 DOM 结构，JavaScript 可以通过几种不同的方式访问文档中的元素，具体取决于我们是选择单个元素还是多个元素。在所有方法中，我们首先必须定位代表我们需要访问的元素的节点，然后使用该节点的内容、子元素和属性。\n\
  \n### 选择单个元素\n\n要选择单个元素，我们最常使用 `getElementById()` 方法。该方法允许我们选择其 HTML 标签上应用了特定 ID\
  \ 属性的元素。如果我们遵循页面中每个元素的 ID 属性都是唯一的这一假设，那么该方法是访问元素最有效的方式。在以下示例中，我们将访问 ID 属性值为 `'phase1'`\
  \ 的元素：\n\n```\nvar firststop = document.getElementById(\"phase1\");\n```\n\n在 `document`\
  \ 对象上使用 `getElementById()` 方法意味着我们在页面上的任何位置搜索具有此 ID 的元素。一旦访问到 `'phase1'` 元素（在我们的例子中是第一个\
  \ `<h1>` 元素），对该节点的引用就会存储在 `firststop` 变量中，我们就可以使用 JavaScript 进行更改。例如，我们将为此元素分配一个值为\
  \ `'current'` 的 class 属性。我们将此代码包含在文档 `<head>` 部分的 `<script>` 标签中。\n\n```\nvar firststop\
  \ = document.getElementById(\"phase1\");\nfirststop.className = \"current\";\n```\n\
  \n**图 27.** 更改页面元素的样式\n\n**注意：** 在某些浏览器中，我们必须将 `<script>` 标签放在结束的 `</body>` 标签之前，或者放在外部的\
  \ `.js` 文件中，才能使本章中的代码正常工作。\n\n如果我们想从节点中获取文本，可以使用 `textContent` 属性。更重要的是，我们还可以使用\
  \ `textContent` 属性来更改节点的内容。在以下示例中，我们首先选择 `id` 属性值为 `'partytitle'` 的元素，并将其赋值给 `title`\
  \ 变量。然后，通过更改 `title` 变量的 `textContent` 属性，我们实际上更改了该元素的文本。让我们将以下行添加到我们的 JavaScript\
  \ 代码中：\n\n```\nvar title = document.getElementById(\"partytitle\");\ntitle.textContent\
  \ = \"Party Schedule\";\n```\n\n**图 28.** 更改页面元素的内容\n\n### 选择组元素\n\n虽然有时选择单个元素就足够了，但其他时候我们可能需要选择一组元素。例如，我们可能需要选择页面上的所有\
  \ `<li>` 标签，或者所有共享某个 class 属性的元素。在这些情况下，JavaScript 提供了以下两种方法：\n\n*   `getElementsByTagName()`\
  \ —— 该方法允许我们选择特定标签的每个实例。\n*   `getElementsByClassName()` —— 该方法检索所有共享特定类名的元素。\n\n\
  \n\n\n选择一组元素意味着该方法将返回多个节点。这些节点的集合被称为 `NodeList`，并以类数组的形式存储。每个节点会被赋予一个索引编号，从 0 开始，而节点的顺序与它们在页面上的出现顺序相同。尽管\
  \ `NodeLists` 看起来像数组，行为也像数组，但从语义上讲，它们是一种称为集合的对象类型。作为对象，集合拥有自己的属性和方法，这些在处理 `NodeList`\
  \ 时非常有用。\n\n以下示例将选择所有 `<li>` 元素，并将其节点引用赋值给 `schedule` 变量。\n\n```\nvar schedule =\
  \ document.getElementsByTagName(\"li\");\n```\n\n如果我们想分别访问每个元素，可以使用数组语法。例如：\n\n\
  ```\nvar item1 = schedule[0];var item2 = schedule[1];var item3 = schedule[2];\n\
  ```\n\n然而，当我们选择一组元素时，通常希望与整个组进行交互。例如，让我们为所有 `<li>` 元素分配值为 `\"finished\"` 的 class\
  \ 属性。为此，我们可以使用循环遍历 `NodeList` 中的每个元素。\n\n```\nvar schedule = document.getElementsByTagName(\"\
  li\");for (var i = 0; i < schedule.length; i++) {schedule[i].className = \"finished\"\
  ;}\n```\n\n图 29. 更改所有 `<li>` 元素的 class 属性\n\n与处理数组类似，在处理集合时，我们可以使用 `length` 属性来确定集合的大小。然后，我们可以在\
  \ `for` 循环中使用此信息，以便有效地遍历每个 `NodeList` 项并分配 `\"finished\"` 类属性。\n\n对于 `getElementsByClassName()`\
  \ 方法，我们可以使用完全相同的逻辑。我们将获得一个存储在集合中的 `NodeList`，每个节点都有一个索引编号。与 `getElementByTagName()`\
  \ 方法一样，我们可以访问单个项，并通过其对象属性和方法管理集合。\n\n## 遍历 DOM\n\n当我们使用前面讨论的任何方法选择一个元素节点时，我们还可以选择与该元素相关的其他元素。这种相对选择被视为元素属性。\n\
  \n### previousSibling 和 nextSibling\n\n`previousSibling` 和 `nextSibling` 属性指的是同一\
  \ DOM 层级上的相邻元素。例如，如果我们选择 id 值为 `\"phase2\"` 的第二个 `<li>` 元素，那么 `\"phase1\"` 的 `<li>`\
  \ 元素将被视为 `previousSibling`，而 `\"phase3\"` 的 `<li>` 元素则是 `nextSibling`。如果没有兄弟元素（例如，`\"\
  phase1\"` 元素没有 `previousSibling`），则该属性的值保持为 `null`。\n\n在以下示例中，我们选择 id 属性值为 `\"phase2\"\
  ` 的 `<li>` 元素，并更改所选元素及其前一个兄弟元素的 class 属性。\n\n```\nvar secondstop = document.getElementById(\"\
  phase2\");var prevstop=secondstop.previousSibling;secondstop.className = \"current\"\
  ;prevstop.className = \"finished\";\n```\n\n### 父元素与子元素\n\n我们还可以以所选元素为起点，遍历 DOM\
  \ 层级的不同级别。如果想向上移动一级，可以使用 `parentNode` 属性。例如，如果我们选择了第二个 `<li>` 元素，可以通过以下语法引用其父元素（`<ul>`\
  \ 元素）：\n\n```\nvar secondstop = document.getElementById(\"phase2\");var upperelement\
  \ = secondstop.parentNode;\n```\n\n或者，如果想向下移动一级，可以使用 `firstChild` 或 `lastChild`\
  \ 属性。在以下示例中，我们选择了 id 属性值为 `\"partyplan\"` 的 `<ul>` 元素。使用 `firstChild` 属性引用该列表的第一个\
  \ `<li>` 元素，而使用 `lastChild` 属性引用该列表的最后一个 `<li>` 元素。\n\n```\nvar plan = document.getElementById(\"\
  partyplan\");var child1 = plan.firstChild;var child2 = plan.lastChild;\n```\n\n\
  ## 添加和管理内容\n\n到目前为止，我们讨论了如何在 DOM 中查找元素。更有趣的方面是在 DOM 中管理内容的方法。\n\n### 更改 HTML\n\n\
  我们已经讨论过 `textContent` 属性，但该属性仅检索文本值，并忽略后续的 HTML 结构。如果我们想编辑页面 HTML，必须使用 `innerHTML`\
  \ 属性。该属性可用于任何元素节点，并且既能检索内容也能编辑内容。\n\n```\nvar liContent = document.getElementById(\"\
  phase1\").innerHTML;\n```\n\n当从 id 属性值为 `\"phase1\"` 的 `<li>` 元素中检索 HTML 时，`innerHTML`\
  \ 会将元素的全部内容（文本和标记）作为字符串变量捕获。如果对 `<ul>` 元素应用相同的语法，`innerHTML` 属性将捕获所有 `<li>` 项。\n\
  \n我们还可以使用 `innerHTML` 属性更改元素的内容。如果此内容包含额外的标记，这些新元素将被处理并添加到 DOM 树中。例如，让我们在派对列表的第一个\
  \ `<li>` 项中添加 `<em>` 标签：\n\n```\nvar firstStop = document.getElementById(\"phase1\"\
  );firstStop.innerHTML = \"<em>20:00 - Home warm-up</em>\";\n```\n\n图 30. 向第一个列表项添加包含内容的\
  \ `<em>` 元素\n\n### DOM 操作\n\n管理文档内容的一种更直接的技术是使用 DOM 操作。这是一个三步过程，使用以下方法：\n\n1. `createElement()`\
  \ - 该过程首先使用 `createElement()` 方法创建一个新的元素节点。此元素节点存储在一个变量中，尚未成为 DOM 的一部分。\n\n2. `createTextNode()`\
  \ - 该过程继续使用 `createTextNode()` 方法创建一个新的文本节点。与上一步类似，此文本节点存储在一个变量中，尚未成为文档的一部分。\n\n\
  3. `appendChild()` - 最后一步是使用 `appendChild()` 方法将创建的元素添加到 DOM 树中。该元素将作为子元素添加到现有元素中。同样的方法可用于将文本节点添加到元素节点。\n\
  \n\n\n作为示例，让我们创建一个新元素，并将其添加到现有的聚会列表中。我们将使用 `createElement()` 方法，并将该元素添加到 `newPlan`\
  \ 变量中。\n\n```\nvar newPlan = document.createElement(\"li\");\n```\n\n接下来，我们将创建一个新的文本节点，并将其内容作为值赋给\
  \ `newPlanText` 变量。\n\n```\nvar newPlanText = document.createTextNode(\"04:00 -\
  \ 回家\");\n```\n\n现在，我们可以通过使用 `appendChild()` 方法将文本节点的内容分配给 `newPlan` 元素。\n\n```\n\
  newPlan.appendChild(newPlanText);\n```\n\n最后，我们希望将这个元素添加到列表中。我们将使用 `getElementById()`\
  \ 方法通过其 `\"partyplan\"` id 选择列表，并应用 `appendChild()` 方法将 `newPlan` 元素附加到列表中。\n\n\
  ```\ndocument.getElementById(\"partyplan\").appendChild(newPlan);\n```\n\n完整的语法如下：\n\
  \n```\nvar newPlan = document.createElement(\"li\");\nvar newPlanText = document.createTextNode(\"\
  04:00 - 回家\");\nnewPlan.appendChild(newPlanText);\ndocument.getElementById(\"partyplan\"\
  ).appendChild(newPlan);\n```\n\n图 31. 添加一个新的 `<li>` 元素\n\n使用类似的过程，我们也可以利用 DOM 操作从页面中移除一个元素。作为示例，让我们移除作为页面主标题的\
  \ `<h1>` 元素。我们首先通过其 `id` 属性（值为 `\"partytitle\"`）选择该元素，并将该元素节点存储在一个变量中。\n\n```\n\
  var removeHeading = document.getElementById(\"partytitle\");\n```\n\n接下来，我们需要找到作为\
  \ `<h1>` 元素容器的父元素，在本例中是 `<body>` 元素。我们可以直接选择这个元素，或者使用之前所选元素的 `parentNode` 属性。无论哪种方式，我们都需要将父元素存储在另一个变量中。\n\
  \n```\nvar containerForHeading = removeHeading.parentNode;\n```\n\n最后，我们将在父元素上使用\
  \ `removeChild()` 方法，以丢弃我们希望从页面中移除的元素。\n\n```\ncontainerForHeading.removeChild(removeHeading);\n\
  ```\n\n完整的语法如下：\n\n```\nvar removeHeading = document.getElementById(\"partytitle\"\
  );\nvar containerForHeading = removeHeading.parentNode;\ncontainerForHeading.removeChild(removeHeading);\n\
  ```\n\n图 32. 移除标题\n\n# 第 11 章 事件（不是你想庆祝的那种）\n\n如果你能在今晚之前完成新的聊天功能，我们就举办一次办公室派对庆祝它的发布。不用太隆重，只需一些饮料、好听的音乐和一点吃的……\n\
  \n聊天代码现在存储在一个单独的 JavaScript 文件中，并且也稍微整洁了一些。但 Marty 并不完全满意，仍然缺少一些东西……\n\n当然，网站访问者不应该需要编写\
  \ JS 来高亮聊天成员——高亮应该根据搜索框中的输入自动变化。\n\n为了实现这一点，代码需要对用户输入做出反应。你的浏览器正是为此提供了所谓的事件（不，我们指的不是像婚礼或派对那样的事件——很遗憾）。\n\
  \n## 浏览器事件\n\n用户施加的任何影响，无论多么微小，都会被浏览器视为一个事件。事件几乎可以是任何东西，包括：\n\n*   点击按钮\n*   将鼠标悬停在图片上\n\
  *   松开输入键\n*   通过鼠标或 Tab 键离开输入字段\n*   触摸屏上的手指手势，例如缩放\n\n\n\n\n还有一些事件并非由用户直接触发，而是通过网络请求或文件加载完成等事件触发。但首先，我们只关注那些与用户行为直接相关的事件。\n\
  \n## 处理事件：事件处理器\n\n### 初步措施\n\n首先，在控制台中尝试一个小实验。你感兴趣的事件是用户在输入字段中键入时释放按键。查看聊天 HTML\
  \ 文档，你会发现输入字段（`input`元素）位于一个`id`为`member_search`的`div`元素内：\n\n`<dividmember_search<inputtypetextplaceholder...Find\
  \ a member.../></div>`\n\n首先，使用`$('#member_search input')`选择该字段。你会在控制台中返回`input`元素作为返回值。将鼠标悬停在控制台中的元素上，你会看到它正是正确的字段。\n\
  \n现在，我们将一个事件绑定到该字段。为此，我们将使用`addEventListener`方法。该方法几乎适用于所有 HTML 元素对象。\n\n`$('#member_search\
  \ input').addEventListener( … );`\n\n`addEventListener`需要两个参数。第一个参数是事件类型，以字符串形式提供。在这种情况下，我们应该使用的事件类型是`'keyup'`，即释放按键。\n\
  \n`$('#member_search input').addEventListener('keyup', …);`\n\n`addEventListener`的第二个参数必须是一个函数——当指定事件发生时，浏览器将执行该函数。在这种情况下，我们只需使用一个简单的函数来确保过程正常工作：\n\
  \n`() => alert(1)`\n\n顺便提一下，你在事件上注册的函数称为事件监听器或事件处理器，它负责处理你指定的事件。\n\n现在我们的语句完成了——让我们在控制台中测试一下：\n\
  \n`$('#member_search input').addEventListener('keyup', () => alert(1));`\n\n如果你进入成员搜索输入框并键入一个字符，一旦你释放按键，就会弹出一个显示`1`的警告框。当然，这个函数目前还不太有用。而且，不断点击关闭警告框可能让你有点烦躁——但至少你现在知道事件处理器是如何工作的了。任务完成！\n\
  \n## 整合所有内容\n\n现在进入难点——你需要将现有的高亮代码和事件注册代码整合成一个完整的程序。\n\n从你的 JS 文件中删除调用`hightlightChatMembers('ert');`。相反，你的`keyup`事件现在应该触发函数调用：\n\
  \n`$('#member_search input').addEventListener('keyup', () => hightlightChatMembers('ert'));`\n\
  \n实际上，一旦你在搜索框中键入一个键，高亮就会改变。然而，我们不想永久高亮字符串`'ert'`，而是想使用实际的输入。但我们该怎么做呢？\n\n再次，我们需要使用`input`元素对象。我们可以通过选择器`$('#member_search\
  \ input')`获取它，然后查询用户输入的值。我们会在`value`属性中找到该值，即`$('#member_search input').value`。你将在第\
  \ 6 课中了解更多关于`value`和其他属性的内容。\n\n综合起来，我们得到以下语句：\n\n`$('#member_search input').addEventListener('keyup',\
  \ () => hightlightChatMembers($('#member_search input').value));`\n\n这便得到了以下整体代码：\n\
  \n```javascript\n\"use strict\";\n\nconst highlightChatMembersBy = partOfMemberName\
  \ => {\n  chatMembers()\n    .filter(member =>\n      doesMemberMatch(partOfMemberName,\
  \ member))\n    .forEach(highlight);\n};\n\nconst doesMemberMatch = (partOfMemberName,\
  \ memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n    .includes(partOfMemberName.toLowerCase());\n\
  \nconst chatMembers = () => $$(\"#chat_members li\");\nconst highlight = el => el.classList.add(\"\
  highlighted\");\n\nconst $ = document.querySelector.bind(document);\nconst $$ =\
  \ document.querySelectorAll.bind(document);\nNodeList.prototype.__proto__ = Array.prototype;\n\
  \n$(\"#member_search input\")\n  .addEventListener(\"keyup\", () =>\n    highlightChatMembersBy($(\"\
  #member_search input\").value));\n```\n\n输入不同的字符串，并尝试一下你当前的实现。你注意到了什么？\n\n## 保护子句：函数的保护措施\n\
  \n哎呀——我刚刚发现了一个 bug。如果我搜索一个聊天成员，突然所有成员都被高亮了。\n\n你能修复这个问题吗？目前这样，我们不可能把高亮功能上线。\n\n\
  好吧，问题在这里——虽然程序高亮了匹配的成员，但当搜索字符串更新时，它并没有移除之前的高亮。\n\n与其费劲找出需要移除哪些高亮，更简单的方法是先移除所有高亮，然后只高亮与搜索匹配的聊天成员。为此，我们需要一些额外的代码，从所有成员中移除相应的\
  \ CSS 类：\n\n```javascript\nconst removeHighlightsFromAllChatMembers = () =>\n  chatMembers().forEach(removeHighlight);\n\
  \nconst removeHighlight = el => el.classList.remove('highlighted');\n```\n\n顺便提一下，有些包含聊天成员的`li`元素根本没有`highlighted`类，这没问题——在这种情况下，什么都不会被移除。\n\
  \n根据详细程度对这两个函数进行排序。此外，我们还需要添加对新函数`removeHighlightsFromAllChatMembers`的调用。为此，我们建议创建一个更高级别的函数`updateHighlightingOfChatMembers`，它首先移除所有高亮（`removeHighlightsFromAllChatMembers`），然后标记匹配的聊天成员（`hightlightChatMembersBy`）：\n\
  \n```javascript\nconst updateHighlightingOfChatMembers = partOfMemberName => {\n\
  \  removeHighlightsFromAllChatMembers();\n  hightlightChatMembersBy(partOfMemberName);\n\
  };\n```\n\n现在，我们只需将新函数`updateHighlightingOfChatMembers`添加到事件处理器中，替换掉仅负责高亮的函数`hightlightChatMembersBy`。然后我们得到以下代码：\n\
  \n```javascript\n\"use strict\";\n\nconst updateHighlightingOfChatMembers = partOfMemberName\
  \ => {\n  removeHighlightsFromAllChatMembers();\n  highlightChatMembersBy(partOfMemberName);\n\
  };\n\nconst removeHighlightsFromAllChatMembers = () =>\n  chatMembers().forEach(removeHighlight);\n\
  \nconst highlightChatMembersBy = partOfMemberName => {\n  chatMembers()\n    .filter(member\
  \ =>\n      doesMemberMatch(partOfMemberName, member))\n    .forEach(highlight);\n\
  };\n\nconst doesMemberMatch = (partOfMemberName, memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n\
  \    .includes(partOfMemberName.toLowerCase());\n\nconst chatMembers = () => $$(\"\
  #chat_members li\");\nconst highlight = el => el.classList.add(\"highlighted\");\n\
  const removeHighlight = el => el.classList.remove(\"highlighted\");\n\nconst $ =\
  \ document.querySelector.bind(document);\nconst $$ = document.querySelectorAll.bind(document);\n\
  NodeList.prototype.__proto__ = Array.prototype;\n\n$(\"#member_search input\")\n\
  \  .addEventListener(\"keyup\", () =>\n    updateHighlightingOfChatMembers($(\"\
  #member_search input\").value));\n```\n\n清单 17 中的代码几乎可以工作……除了一个小问题：当输入为空时，所有成员都会被选中。但空字符串出现在每个字符串中！\n\
  \n我们可以通过在函数`hightlightChatMembersBy`的开头添加代码来抑制这种行为，检查`partOfMemberName`是否为空。如果为空字符串，函数只需拒绝执行。添加一个`return`使函数提前退出。\n\
  \n`if (partOfMemberName === \"\") return;`\n\n像这样在实际执行函数主体之前运行的代码，用于确保传递给函数的参数值有意义，被称为[保护子句](http://c2.com/cgi/wiki?GuardClause)或简称守卫。它们保护函数免受无效输入值的影响。\n\
  \n```javascript\nconst hightlightChatMembersBy = partOfMemberName => {\n  if (partOfMemberName\
  \ === \"\") return;\n  chatMembers()\n    .filter(member =>\n      doesMemberMatch(partOfMemberName,\
  \ member))\n    .forEach(highlight);\n};\n```\n\n清单 18 中的代码终于按预期工作了。但在你跑去告诉 Marty\
  \ 这个好消息之前，让我们花点时间做一些改进。你的维护程序员将来会感谢你的！\n\n## 使用 init 惊艳登场\n\n事件注册代码仍然只是随意地放在那里，没有动机——最好将其放入自己的函数中。这将带来许多好处——代码将可重用，并且有自己的名称，更容易识别。此外，将代码放入单独的函数中，还能在课程尚未涉及的其他方面带来优势——例如，代码将更易于测试。\n\
  \n一个好的函数名可能是`registerEvents`，或者干脆就是`init`。如果我们愿意，还可以更具体地命名为`registerEventsForChatMemberHighlighting`。然而，考虑到上下文（即整个文件都针对特定任务），通用的`init`完全可接受。\n\
  \n`init`代表初始化。它是一个调用所有其他函数的函数，充当程序中其余代码的入口点。我们基本上可以随意命名这个函数，但`init`已经成为此类函数的既定名称。其他程序员看到这个函数名就能立即理解我们的意图。\n\
  \n根据我们的报纸比喻，`init`的函数定义应放在代码的开头。然而，对`init()`的调用只能在所有其他函数定义之后进行。\n\n```javascript\n\
  \"use strict\";\n\nconst init = () => $(\"#member_search input\")\n  .addEventListener(\"\
  keyup\", () =>\n    updateHighlightingOfChatMembers($(\"#member_search input\").value));\n\
  \nconst updateHighlightingOfChatMembers = partOfMemberName => {\n  removeHighlightsFromAllChatMembers();\n\
  \  hightlightChatMembersBy(partOfMemberName);\n};\n\nconst removeHighlightsFromAllChatMembers\
  \ = () =>\n  chatMembers().forEach(removeHighlight);\n\nconst hightlightChatMembersBy\
  \ = partOfMemberName => {\n  if (partOfMemberName === \"\") return;\n  chatMembers()\n\
  \    .filter(member =>\n      doesMemberMatch(partOfMemberName, member))\n    .forEach(highlight);\n\
  };\n\nconst doesMemberMatch = (partOfMemberName, memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n\
  \    .includes(partOfMemberName.toLowerCase());\n\nconst chatMembers = () => $$(\"\
  #chat_members li\");\nconst highlight = el => el.classList.add(\"highlighted\");\n\
  const removeHighlight = el => el.classList.remove(\"highlighted\");\n\nconst $ =\
  \ document.querySelector.bind(document);\nconst $$ = document.querySelectorAll.bind(document);\n\
  NodeList.prototype.__proto__ = Array.prototype;\n\ninit();\n```\n\n## 透过事件对象看幕后\n\
  \n我们当前代码可以改进的地方，在仔细审视事件注册时会变得清晰。\n\n`$('#member_search input').addEventListener('keyup',\
  \ () => hightlightChatMembers($('#member_search input').value));`\n\n我们在这里注册为事件处理器的函数是：\n\
  \n`() => hightlightChatMembers($('#member_search input').value);`\n\n有趣的是，当事件调用该函数时，它会自动将事件作为参数传递。所以我们只需要实现一个参数来捕获事件：\n\
  \n`event => hightlightChatMembers($('#member_search input').value);`\n\n我们可以用`event`做什么？一件事是将其打印到控制台，看看它包含什么：\n\
  \n```javascript\nevent => {\n  console.log(event);\n  hightlightChatMembers($('#member_search\
  \ input').value);\n}\n```\n\n如果你键入字母`a`，控制台将显示：\n\n`keyup { target: <input>, key:\
  \ \"a\", charCode: 0, keyCode: 65 }`\n\n如果你点击`keyup`，你会看到`event`是一个“类型”为 KeyboardEvent\
  \ 的 JS 对象。键盘事件有许多非常有趣的属性——下表仅展示其中几个：\n\n> 实际上，JS 没有特定的对象类型。更准确地说，`keyup`是一个 JS 对象，其原型链中包含`KeyboardEvent`对象。我们在这里使用“类型”一词是为了简化。这只是为了表明所有相同“类型”的对象也具有相同的属性。\n\
  \n\n\n\n\n| 属性 | 内容 |\n| --- | --- |\n| `type` | keyup |\n| `code` | KeyA |\n| `key`\
  \ | a |\n| `timeStamp` | [时间戳，即事件发生的时间] |\n| `target` | [触发事件的元素] |\n| `ctrlKey`\
  \ | false [是否按下了 Ctrl 键？] |\n| `altKey` | false [是否按下了 Alt 键？] |\n\n事件还有许多其他属性，但仅上面列出的几个就足以说明事件对象包含了事件发生时涉及的所有信息，例如：\n\
  \n- 事件类型是什么？`keyup`\n- 释放了哪个键？`a`\n- 事件何时触发？\n- 事件从何处触发？\n\n\n\n\n\n您的事件处理程序随后可以利用这些信息。`target`\
  \ 是我们当前程序中主要关注的属性。`target` 包含我们打算使用的输入字段，否则我们会通过 `$('#member_search input')` 来选择它。因此，我们也可以将事件处理程序注册为：`event\
  \ => hightlightChatMembers(event.target.value);` 这样做带来了若干具体优势。在所有情况下，它都更高效，因为浏览器无需再次查找元素对象——它已经存在于\
  \ `target` 中。但更重要的优势在于更好的可维护性。如果用于查找输入字段的选择器发生变化（例如由于 HTML 结构变更），我们无需担心同时修改事件处理程序。无论我们如何找到元素并在其上注册事件，它始终引用当前的\
  \ `target`。\n\n```\n\"use strict\";\n\nconst init = () => $(\"#member_search input\"\
  )\n  .addEventListener(\"keyup\", event =>\n    updateHighlightingOfChatMembers(event.target.value));\n\
  \nconst updateHighlightingOfChatMembers = partOfMemberName => {\n  removeHighlightsFromAllChatMembers();\n\
  \  hightlightChatMembersBy(partOfMemberName);\n};\n\nconst removeHighlightsFromAllChatMembers\
  \ = () =>\n  chatMembers().forEach(removeHighlight);\n\nconst hightlightChatMembersBy\
  \ = partOfMemberName => {\n  if (partOfMemberName === \"\") return;\n  chatMembers()\n\
  \    .filter(member =>\n      doesMemberMatch(partOfMemberName, member))\n    .forEach(highlight);\n\
  };\n\nconst doesMemberMatch = (partOfMemberName, memberElement) =>\n  memberElement.innerHTML.toLowerCase()\n\
  \    .includes(partOfMemberName.toLowerCase());\n\nconst chatMembers = () => $$(\"\
  #chat_members li\");\nconst highlight = el => el.classList.add(\"highlighted\");\n\
  const removeHighlight = el => el.classList.remove(\"highlighted\");\n\nconst $ =\
  \ document.querySelector.bind(document);\nconst $$ = document.querySelectorAll.bind(document);\n\
  NodeList.prototype.__proto__ = Array.prototype;\n\ninit();\n```\n\n顺便提一下，我们可以将 `event`\
  \ 缩写为 `e`。通常缩写被认为是“不好的”并应避免，但在这种情况下是可以的。单个字母 `e` 是 `event` 的常见缩写，只要其作用域（变量存在的范围）限制在一个非常小的函数内，就是可以接受的。\n\
  \n现在我们准备好了！你终于可以向 Marty 展示改进后的功能了，他高兴得又举办了一场派对——希望这将是一场难忘的活动！\n\n# 第 12 章 在变量中存储信息\n\
  \n## 学习使用变量\n\n在本章中，我们将讨论变量。变量是任何编程语言中的重要元素，JavaScript 也不例外。\n\n变量是用于保存值的内存分配。它们被称为变量，是因为在程序执行过程中，它们的值可能会随时间变化。\n\
  \n你可以使用变量来保存文本值（也称为字母值或字符串值），例如人名、公司名或程序中的任何其他文本内容。变量也可以保存数值。\n\n为了展示变量是如何使用的，让我们从一个\
  \ HTML 文档页面开始。在这个例子中，我们将使用一个 HTML 4.01 文档。要插入 JavaScript，需要使用带有如下属性的 script 标签：\n\
  \n`<script language=\"javascript\" type=\"text/javascript\">`\n\n所有 JavaScript 命令都必须放在\
  \ script 元素内。首先要标识的 JavaScript 元素是要使用的变量。我们需要命名变量并声明它。\n\n在 JavaScript 中声明变量时，使用\
  \ `var` 语句后跟变量名。理想情况下，变量名应能描述该变量所代表的内容。变量名可以是任何字母数字字符集，并且应区分大小写。不允许使用标点符号或特殊字符，下划线除外。\n\
  \n变量声明的示例如下：\n\n```\nvar userName;\n```\n\n在 JavaScript 中声明变量时，并不强制要求使用 `var` 语句，但始终这样做是一个好习惯。始终使用\
  \ `var` 声明变量可以避免变量作用域带来的问题。\n\n我们将在课程后面讨论变量作用域，简单来说，有些变量仅在程序的某个特定部分（如函数）中使用。可以声明变量，使其值仅在该作用域内可检索。\n\
  \n现在我们已经声明了变量，可以为其赋值了。这称为变量赋值。当我们设置变量的初始值时，称为初始化。一旦声明了变量，就不再需要使用 `var` 语句。只需要变量名后跟等号和变量值即可。在这个例子中，我们的变量初始化是：\n\
  \n```\nuserName=\"Mark Lassoff\";\n```\n\n上面例子中赋的值是一个字符串（也称为文本），因此用引号括起来。如果给变量赋数值，则不需要用引号括起来。例如：\n\
  \n```\nage = 39;\n```\n\n同时声明和初始化变量的快捷方法是将声明和初始化放在同一行。这是一种更高效的初始化和声明变量的方式。同时声明和初始化变量如下所示：\n\
  \n```\nvar userName=\"Mark Lassoff\";\n```\n\n现在我们可以显示变量的值。要显示变量的值，可以使用 `document.write()`\
  \ 命令，后跟括号中的变量名。命令语法为：\n\n```\ndocument.write(userName);\n```\n\n当你想显示变量的值时，不需要在变量名周围加引号（就像输出文本时那样）。只需在括号中写入变量名即可。如果要打印的是实际的字符串值，则必须用引号将字符串值括起来。例如：\n\
  \n```\ndocument.write (\"Austin, Texas\");\n```\n\n这将显示 `Austin, Texas`。\n\n我们还可以在程序执行过程中更改变量的值。假设你已经显示了分配给变量的第一个值。然后你给同一个变量名分配另一个值，并再次显示它。分配给\
  \ `userName` 的第二个值会替换初始值。\n\n到目前为止，我们一直使用等号给变量赋值。然而，在 JavaScript 的上下文中，等号并不表示“等于”。在\
  \ JavaScript 中，等号被称为赋值运算符。赋值运算符只是将值赋给变量。\n\n我们将在后面更详细地讨论更多运算符及其功能。在前面的例子中，我们这样理解变量初始化：变量\
  \ `userName` 被赋值为 `Mark Lassoff`。值用引号括起来表示它是一个字符串值。\n\n当数字被赋值为变量的值时，它被称为数值变量。以下是声明和赋值数值变量的示例：\n\
  \n```\nvar userAge= 37;\n```\n\n在下一节中，我们将使用数值变量执行一些算术运算。\n\n上述讨论的完整示例代码清单如下，后面是在浏览器中查看时的预期输出截图。\n\
  \n代码清单：声明和赋值变量\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  \ >\n<html lang=\"en\">\n<head></head>\n<body>\n<script language=\"javascript\"\n\
  type=\"text/javascript\">\n//var userName=\"Mark Lassoff\";\nvar userName;     \
  \          //变量声明\nuserName=\"Mark Lassoff\";    //变量初始化\ndocument.write(userName);\
  \    //无引号：输出变量的值\nuserName=\"Brett Lassoff\"; // = 称为赋值运算符\ndocument.write(\"<br/>\"\
  );\ndocument.write(userName);\ndocument.write(\"<br/>\");\nvar userAge = 37;   \
  \       //合并初始化/声明\ndocument.write(userAge);\n</script>\n</body>\n</html>\n```\n\
  \n这是浏览器中的输出效果。注意名字和年龄是如何显示在不同行上的。这是通过使用换行 `<br/>` 标签以及 `document.write()` 命令实现的。\n\
  \n## 复习题\n\n1. 在 JavaScript 中，使用什么语句来声明变量？\n   a. variable\n   b. declare\n   c.\
  \ var\n   d. dar\n\n2. 如果不在变量赋值的字符串值周围加引号，会发生什么？\n   a. 脚本输出变量的值。\n   b. 你会得到一个\
  \ HTML 错误。\n   c. 脚本将无法正确赋值变量。\n   d. 什么也不会发生。\n\n3. 以下哪个是 JavaScript 中的赋值运算符？\n\
  \   a. + 号\n   b. = 号\n   c. – 号\n   d. @ 号\n\n4. 以下哪个是合并初始化/声明的示例？\n   a. var Size\n\
  \   b. Size = 0\n   c. var Size; Size = 0;\n   d. var Size = 0;\n\n5. 为什么每次声明变量时使用\
  \ var 语句很重要？\n   a. 如果不这样做，你会遇到变量作用域问题。\n   b. 变量不声明就无法工作。\n   c. 没有它会造成混淆。\n  \
  \ d. 你不应该使用它。\n\n## 实验活动\n\n1) 创建一个 JavaScript 代码，显示以下输出：\n\n2) 程序必须有两个变量。第一个变量保存成年动物的值\
  \ `adultAnimalName`，第二个变量保存幼年动物的值 `youngAnimalName`。\n\n3) 为每个变量分配一个值。使用 `document.write()`\
  \ 显示这两个变量的值。\n\n4) 为你的程序使用以下值：\n\n\n\n\n\n| `adultAnimalName` |\n|-------------------|\n\
  | 马 |\n| 山羊 |\n| 狗 |\n\n## 实验室活动解决方案：代码清单\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.dtd\">\n<html lang=\"en\"\
  >\n<head></head>\n<body>\n<script language=\"javascript\" type=\"text/javascript\"\
  >\nvar adultAnimalName;\nvar youngAnimalName;\nadultAnimalName = \"Horse\";\nyoungAnimalName\
  \ = \"Pony\";\ndocument.write(adultAnimalName);\ndocument.write(\":\");\ndocument.write(youngAnimalName);\n\
  document.write(\"<br/>\");\nadultAnimalName = \"Goat\";\nyoungAnimalName = \"Kid\"\
  ;\ndocument.write(adultAnimalName);\ndocument.write(\":\");\ndocument.write(youngAnimalName);\n\
  document.write(\"<br/>\");\nadultAnimalName = \"Dog\";\nyoungAnimalName = \"Puppy\"\
  ;\ndocument.write(adultAnimalName);\ndocument.write(\":\");\ndocument.write(youngAnimalName);\n\
  document.write(\"<br/>\");\n</script>\n</body>\n</html>\n```\n\n### 变量运算符\n\n在本节中，我们将讨论变量运算符。再次强调，从一个\
  \ HTML 4.01 文件开始，并确保包含一个`<script>`标签，以向浏览器表明我们正在使用 JavaScript。\n\n首先，我们需要声明两个变量`operandOne`和`operandTwo`。这两个变量将分别被赋值为\
  \ 125 和 15.371。\n\n注意，它们是两种不同的值类型。变量`operandOne`保存整数 125，而变量`operandTwo`包含浮点数 15.371。浮点数能够保存带有小数点的数字。\n\
  \n```\noperandOne = 125;\noperandTwo = 15.371;\n```\n\n在其他编程语言中，通常需要声明具体的变量类型——你必须告诉程序你使用的是整数还是浮点数。然而，JavaScript\
  \ 在你赋值的那一刻会自动理解你创建的变量类型。无需显式指定你正在使用的变量类型。\n\n定义并初始化变量后，我们可以使用`document.write()`命令将它们显示为输出。由于你指示程序的输出是变量包含的内容，因此不需要引号。让我们在两行上显示这两个值。代码应编写如下：\n\
  \n```\ndocument.write (operandOne);\ndocument.write (\"<br/>\");\ndocument.write\
  \ (operandTwo);\n```\n\n我们还可以对变量执行算术运算。要将两个数相加，我们使用加法运算符`+`。如果我们希望显示两个变量的和，那么代码应为：\n\
  \n```\ndocument.write(\"The sum is \" + (operandOne + operandTwo));\n```\n\n在这个例子中，加法运算符被使用了两次。加号（`+`）在\
  \ JavaScript 中有两个用途——它可以用作字符串连接运算符，也可以用作加法运算符。当我们写`operandOne + operandTwo`时，我们用它来将两个变量相加。\n\
  \n另一方面，连接在任何编程语言中也是一项重要操作。在 JavaScript 中，连接将两个字符串或值连接在一起。在这个例子中，我们将字符串值“总和是”与两个变量的和连接（放在彼此旁边）。加法运算放在它自己的括号内，以便程序理解它是与连接分开的操作。\n\
  \n以下是你可以使用的变量运算符及其功能列表：\n\n| 运算符 | 符号 | 功能 |\n|----------|--------|----------|\n\
  | 加法 | `+` | 将变量相加，并连接字符串和其他值。 |\n| 减法 | `-` | 从一个变量中减去另一个变量的值。 |\n| 乘法 | `*` |\
  \ 将变量相乘。 |\n| 除法 | `/` | 将一个变量除以另一个变量。 |\n| 取模 | `%` | 输出除法运算的余数。 |\n| 递增 | `++`\
  \ | 将变量的值加一。 |\n| 递减 | `--` | 将变量的值减一。 |\n\n\n\n\n递增和递减运算符分别通过增加和减少变量的值来工作。使用递增和递减运算符有两种方式。当运算符放在变量之后时，称为后缀运算符。这意味着先计算数学表达式，然后执行递增。以下代码清单展示了每个变量运算符的使用方式。代码清单：变量运算符\n\
  \n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html lang=\"en\">\n<head></head>\n<body>\n<script language=\"javascript\" type=\"\
  text/javascript\">\nvar operandOne;\nvar operandTwo;\noperandOne = 125;       //Integer\n\
  operandTwo = 15.371;    //Floating Point Number\ndocument.write(operandOne);\ndocument.write(\"\
  <br/>\");\ndocument.write(operandTwo);\ndocument.write(\"<br/>\");\ndocument.write(\"\
  Addition \" + (operandOne + operandTwo));\ndocument.write(\"<br/>\");\ndocument.write(\"\
  Subtraction \" + (operandOne - operandTwo));\ndocument.write(\"<br/>\");\ndocument.write(\"\
  Multiplication \" + (operandOne * operandTwo));\ndocument.write(\"<br/>\");\ndocument.write(\"\
  Division \" + (operandOne/operandTwo));\ndocument.write(\"<br/>\");\ndocument.write(\"\
  10 % 3 \" + (10 % 3));\ndocument.write(\"<br/>\");\ndocument.write(\"11 % 3 \" +\
  \ (11 % 3));\noperandOne++;      //Increment Operator Add One to the variable;\n\
  operandTwo--;      //Decrementing One from the variable\ndocument.write(\"<br/>\"\
  );\ndocument.write(operandOne);\ndocument.write(\"<br/>\");\ndocument.write(operandTwo);\n\
  /*variable++   <--- PostFix Increment Operator\n++variable   <--- PreFix Increment\
  \ Operator\nPostFix- The rest of the mathematical expression is evaluated and then\n\
  the increment takes place\nPreFix-  The increment takes place and then the rest\
  \ of the expression\nis evaluated*/\nvar teamCity;\nvar teamName;\nteamCity =\"\
  New York\";\nteamName= \"Yankees\";\nvar fullTeamInfo = teamCity + \" \" + teamName;\n\
  document.write(\"<br/>\");\ndocument.write(fullTeamInfo);\n</script>\n</body>\n\
  </html>\n```\n\n为了更好地理解拼接的工作原理，前面的代码中演示了一个拼接两个字符串变量并输出它们的示例。我们创建了一个名为 `fullTeamInfo`\
  \ 的新变量，并将两个变量 `teamCity` 和 `teamName` 拼接起来。我们还在引号内拼接了一个空格，以便两个字符串变量之间正确留出间距。输出结果为“New\
  \ York Yankees”。\n\n这是浏览器中显示输出的截图。这里展示了所有可能的拼接用法；还演示了所有四种数学运算，包括取模运算符。\n\n### 复习问题\n\
  \n1. 当“`+`”符号放在数值变量旁边时，它表示什么？\n   - a. 将值相加。\n   - b. 将值相减。\n   - c. 将值拼接。\n   -\
  \ d. 将值相除。\n2. 当“`+`”符号放在两个字符串值之间时，它表示什么？\n   - a. 将值相加。\n   - b. 将值相减。\n   - c.\
  \ 将值拼接。\n   - d. 将值相除。\n3. `%` 运算符的作用是什么？\n   - a. 给出除法的和。\n   - b. 给出除法后的余数。\n\
  \   - c. 给出乘法的积。\n   - d. 给出减法的差。\n4. 哪个是递增运算符？\n   - a. `–`\n   - b. `*`\n   -\
  \ c. `++`\n   - d. `#`\n5. 前缀递增运算符如何工作？\n   - a. 给变量加一。\n   - b. 先计算数学表达式的其余部分，然后执行递增。\n\
  \   - c. 给变量减一。\n   - d. 先执行递增，然后计算表达式的其余部分。\n\n1) 创建一个 HTML 4.01 文档。在文档主体中，添加带有适当属性的\
  \ script 标签以包含 JavaScript 代码。\n2) 声明以下变量（但不要初始化）：firstNamelastNameagecityfavoriteFood\n\
  3) 用关于你自己的信息初始化这些变量。（你的名字、姓氏、年龄等）\n4) 创建一个名为 `operand1` 的变量，并使用组合初始化和赋值将其初始值设为 1555。\n\
  5) 创建一个名为 `operand2` 的变量，并使用组合初始化和赋值将其初始值设为 96.255。\n6) 通过对 `operand1` 和 `operand2`\
  \ 进行加、减、乘、除运算，展示你对数学运算符的掌握。按以下格式输出：\n   `1555 + 96.255 = 1651.255`\n   产生此输出的代码行是：\n\
  \   `document.write(operand1 + \" + \" + operand2 + \" = \" + (operand1 + operand2));`\n\
  7) 演示对 `operand1` 使用递增运算符，对 `operand2` 使用递减运算符。显示结果。\n\n![00012.jpeg](img/rsrc2DB.jpg)\n\
  \n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html lang=\"en\">\n<head></head>\n<body>\n<script language=\"javascript\" type=\"\
  text/javascript\">\nvar firstName;\nvar lastName;\nvar age;\nvar city;\nvar favoriteFood;\n\
  firstName = \"Bob\";\nlastName = \"Smith\";\nage = 45;\ncity = \"Boston\";\nfavoriteFood\
  \ = \"Continental\";\nvar operand1 = 1555;\nvar operand2 = 96.255;\ndocument.write(operand1\
  \ +\" + \"+operand2 + \"=\" + (operand1 + operand2));\ndocument.write(\"<br/>\"\
  );\ndocument.write(operand1 +\" - \"+operand2 + \"=\" + (operand1 - operand2));\n\
  document.write(\"<br/>\");\ndocument.write(operand1 +\" x \"+operand2 + \"=\" +\
  \ (operand1 * operand2));\ndocument.write(\"<br/>\");\ndocument.write(operand1 +\"\
  \ / \"+operand2 + \"=\" + (operand1 / operand2));\ndocument.write(\"<br/>\");\n\
  document.write(\"After increment, \" + operand1 + \" is now \");\noperand1++;\n\
  document.write(operand1);\ndocument.write(\"<br/>\");\ndocument.write(\"After decrement,\
  \ \" + operand2 + \" is now \");\noperand2--;\ndocument.write(operand2);\ndocument.write(\"\
  <br/>\");\n/* Since there were no instructions to display the values of the first\
  \ five variables that were asked to be declared and assigned, they will not be seen\
  \ in the output */\n</script>\n</body>\n</html>\n```\n\n在本章中，我们学习了变量、变量的声明、初始化以及组合初始化/声明。你还学习了如何输出变量。我们还讨论了运算符，包括赋值运算符和算术运算符。你了解到加号（`+`）可以用作加法运算符或拼接运算符，并学习了如何拼接字符串和变量。\n\
  \n# 第 13 章 JavaScript 基础\n\n由于本章内容相当丰富，以下是你可以期待学习的内容概述：\n\n1. 数据类型——JavaScript 如何对信息进行分类。这很重要，因为了解你拥有的信息类型也会告诉你可以用这些信息做什么（例如，你不能用\
  \ 5 乘以苹果）。\n2. 比较运算符——让你比较某些类型的信息（例如，5 是否小于 10？）。当你希望计算机根据特定条件是否满足来执行指令时（例如，仅当 `age`\
  \ 大于或等于 18 时才允许用户注册），这非常有用。\n3. `console.log()`——让你显示单行代码的输出——当你希望查看程序中每行代码的信息流动方式时非常有用。\n\
  4. 流程控制——`if-else` 语句根据满足的条件为计算机提供不同的执行指令（例如，如果 `age` 大于 18，则允许用户进入网站，否则显示错误消息）。\n\
  5. 调试——当你的程序行为异常时（例如，拼错用户名或完全忘记用户名），你需要找出代码中哪个部分破坏了程序的行为——这个过程称为调试。当代码超过一千行时，这可能会变得相当棘手——知道从哪里查找会很有帮助。\n\
  \n到目前为止，你已经使用 JavaScript 处理过字符串和数字。在编程世界中，这些信息类别被称为数据类型。\n\n## 数据类型\n\n数据类型只是告诉计算机你的信息应该如何被读取。例如，如果你在控制台中输入以下内容：\n\
  \n```\n\"5\" + \"5\"\n```\n\n\n\n\n\n你会得到 `\"55\"`。这是因为用引号将 `5` 括起来后，你告诉解释器要将 `5`\
  \ 视为字符串，而不是数字。于是加法运算符不再将两个数字相加，而是将两个字符串拼接在一起。现在试着去掉引号，观察输出如何变为 `10`。不同的数据类型可以执行不同的操作，因此了解该使用哪种类型至关重要：\n\
  \n1. **字符串** – 任何用引号括起来的内容都会成为字符串。它可以包含字母、空格、数字、标点符号以及其他符号的组合。没有字符串，你将无法获取用户的姓名、地址、电子邮件以及其他重要信息。\n\
  \n2. **数字** – 不言自明；数字是可以进行加、减、乘、除等数学运算的数据。记住不要加引号，否则它们会变成字符串！\n\n到目前为止，我们已经掌握了字符串和数字，但还记得你尝试确认对话框时控制台的输出吗？每当你按下“确定”，控制台返回\
  \ `true`，而按下“取消”时，控制台返回 `false`。这些输出没有被引号包围，但它们显然不是数字，那么它们到底是什么呢？\n\n3. **布尔值**\
  \ – 布尔值是只能为 `true` 或 `false` 的数据类型。它与字符串或数字不同，因为它能帮助计算机根据是否满足某些条件来做出决策。例如，如果你想阻止未成年人注册你的网站，你需要编写某种代码来区分未成年人和成年人，比如：\n\
  \n```\nvar age = 17\nage >= 18\n```\n\n然后控制台返回 `false`，因为年龄小于 18。现在尝试以下数学表达式，看看你会得到什么：\n\
  \n```\n5 > 10\n```\n\n```\n6 < 12\n```\n\n第一行应返回 `false`，而第二行应返回 `true`。\n\n## 比较运算符\n\
  \n到目前为止，我们已经讨论了三种数据类型（数字、字符串和布尔值），以及一些基本的数学运算符（`+`、`-`、`*`、`/`）。然而，你刚才用来测试布尔值的是比较运算符（`<`、`>`、`=`），它们在控制程序流程中极其重要。以下是完整的列表及其功能：\n\
  \n- `>` 大于\n- `<` 小于\n- `>=` 大于或等于\n- `<=` 小于或等于\n- `==` 等于\n- `!=` 不等于\n\n为了测试这些运算符，请在以下语句中将\
  \ `@` 符号替换为正确的运算符，以使控制台输出 `true`：\n\n```\nconsole.log(5 @ 1);\nconsole.log(1 @ 5);\n\
  console.log(5 @ 2);\nconsole.log(1 @ 6);\nconsole.log(5 @ 5);\nconsole.log(10 @\
  \ 5);\n```\n\n## 了解解释器的思维\n\n注意 JavaScript 解释器只给出你输入命令的最新输出，因此如果你输入了三行代码，它们本应产生不同的输出：\n\
  \n```\n5 > 10\n6 < 12\n7 > 14\n```\n\n在控制台中同时执行它们，你只会得到最后一行的结果（`false`）。你可以改为逐行输入代码，以便查看每个命令的输出，但在处理较大代码块时会变得特别繁琐。当你处理更复杂的内容时，最终会遇到更多的错误和\
  \ bug。这时，你需要了解你给出的特定命令发生了什么，以便精确定位问题所在。\n\n`console.log()` 会获取你放在其中的任何代码，并将其执行结果记录到控制台。既然如此，让我们看看\
  \ `console.log()` 的实际应用：\n\n```\nconsole.log(5 > 10)\nconsole.log(6 < 12)\nconsole.log(7\
  \ > 14)\n```\n\n现在你可以看到每一行代码的输出！\n\n## 流程控制\n\n你现在已经了解了最基本的数据类型、数学运算符、比较运算符以及一些巧妙的控制台技巧。然而，为了让它们发挥作用，我们需要能够控制命令的执行流程。例如，如果你想创建一个用户注册表单，要求用户输入姓名、电子邮件地址、年龄和密码，你首先需要声明变量：\n\
  \n```\nvar name;\nvar email;\nvar age;\nvar password;\n```\n\n现在我们需要存储用户的输入。目前，我们使用\
  \ `prompt` 函数：\n\n```\nname = prompt('What’s your name?');\nemail = prompt('What’s\
  \ your email?');\nage = prompt('What’s your age?');\npassword = prompt('Please enter\
  \ your desired password: ');\n```\n\n假设你在数据字段中输入了正确类型的信息，那么 `name`、`email`、`age`\
  \ 和 `password` 变量现在拥有了可以处理和存储的正确数据类型。然而，如果用户将电子邮件字段留空，或者在年龄字段中输入了字母，该怎么办？我们不能在关键信息字段没有正确数据类型的情况下让程序继续运行，因此我们使用流程控制语句。我们将讨论的第一个语句是\
  \ `if` 语句。\n\n### If 语句\n\n如果你之前已经编程过，JavaScript 中 `if` 语句的结构应该与你熟悉的几乎相同：\n\n```\n\
  if (<condition>){\n  <action>\n}\n```\n\n如果你之前没有编程过，`if` 语句基本上告诉计算机：如果 `if` 条件为\
  \ `true`，则执行花括号（`{}`）内的内容。例如，如果我们想阻止用户输入空白字段，可以这样做：\n\n```\nname = prompt('What’s\
  \ your name?');\nif (name.length == 0){\n  name = prompt('You cannot leave this\
  \ empty. What’s your name?');\n}\nemail = prompt('What’s your email?');\nif (email.length\
  \ == 0){\n  email = prompt('You cannot leave this empty. What’s your email address?');\n\
  }\nage = prompt('What’s your age?');\nif (age.length == 0){\n  age = prompt('You\
  \ cannot leave this empty. What’s your age?');\n}\npassword = prompt('Please enter\
  \ your desired password: ');\nif (password.length == 0){\n  password = prompt('You\
  \ cannot leave this empty. Please enter your desired password:');\n}\n```\n\n对于初次编程的人来说，这段代码可能看起来令人不知所措，但当你仔细阅读每一行时，你会发现它们遵循着相当清晰且合乎逻辑的结构：\n\
  \n1. 首先，由于 `prompt()` 函数会返回用户输入的任何内容，你将字符串存储在一个变量中，以便稍后在程序中使用。\n2. `if` 语句通过检查长度是否等于零来判断变量是否为空。\n\
  \   a. 如果长度等于零，则再次请求输入。\n   b. 如果长度不等于零，则不再请求输入。\n\n请注意，此示例代码仅用于说明 `if` 语句的工作原理。在任何情况下都不应持续使用\
  \ `prompt()` 函数来向用户询问信息。\n\n现在，如果你希望在第一个条件不满足时执行其他操作，该怎么办？例如，如果用户输入了有效的姓名，你想说 `\"\
  Your name is <name>. Got it!\"` 怎么办？那么我们可以添加一个 `else` 条件，后面跟着第二对花括号，其中包含第二组命令：\n\
  \n```\nname = prompt('What’s your name?');\nif (name.length == 0){\n  name = prompt('You\
  \ cannot leave this empty. What’s your name?');\n} else {\n  alert('Your name is\
  \ ' + name + '. Got it!');\n}\nemail = prompt('What’s your email?');\nif (email.length\
  \ == 0){\n  email = prompt('You cannot leave this empty. What’s your email address?');\n\
  } else {\n  alert('Your email is ' + email + '. Got it!');\n}\nage = prompt('What’s\
  \ your age?');\nif (age.length == 0){\n  age = prompt('You cannot leave this empty.\
  \ What’s your age?');\n} else {\n  alert('Your age is ' + age + '. Got it!');\n\
  }\npassword = prompt('Please enter your desired password: ');\nif (password.length\
  \ == 0){\n  password = prompt('You cannot leave this empty. Please enter your desired\
  \ password:');\n} else {\n  alert('Your password is ' + password + '. Got it!');\n\
  }\n```\n\n\n\n\n\n现在你的代码听起来更人性化了，因为它能更好地响应用户输入。试着摆弄一下代码，看看解释器如何根据 `if-else` 语句满足的条件来改变输出。\n\
  \n## 调试\n\n到目前为止，你已经尝试了变量、数据类型、数学运算符、比较运算符、用户提示、确认对话框和警告框，以及最后的 `if-else` 语句。如果你犯了一些错误，不用担心；计算机本质上是字面理解的，不会容忍最微小的语法错误。话虽如此，这里有一些代码似乎无法按预期工作。修改以下代码片段，以便你能产生正确的输出！\n\
  \n```\nvar name = \"Chris\";\nalert('Hi ' + 'name' + '! It’s nice to meet you.');\n\
  ```\n\n在这个代码片段中，输出应该是 \"Hi Chris! It’s nice to meet you.\"。当前的输出是什么？你认为代码有什么问题？注意，当你执行这段代码时，控制台并没有报错或抛出错误信息。这种问题被称为“bug”，因为虽然\
  \ JavaScript 解释器认为这段代码没有问题，但它并没有按创建者的意图工作。\n\n现在尝试纠正这个包含 bug 和错误的代码片段：\n\n```\n\
  var name;\nvar age;\nname = prompt('What’s your name?');\nif (name.length = 0);\n\
  {\nname = prompt('You cannot leave this empty. What’s your name?');\n}\nelse (name.length\
  \ != 0)\n{\nalert('Your name is ' + name + '. Got it!');\n}\nage = prompt('What’s\
  \ your age?');\nif (age.length = 0)\n{\nage = prompt('You cannot leave this empty.\
  \ What’s your age?');\n}\nelse (name.length != 0)\n{\nalert('Your age is ' + age\
  \ + '. Got it!');\n}\n```\n\n这段代码是之前示例代码的扭曲版本，所以你可以尝试比较代码，看看为什么这段代码不起作用。如果你感到困惑，可以查看一个叫做“linter”的程序，它是一个方便的工具，可以检查代码中的错误并告诉你哪些行有错误。现在练习调试技巧是很好的锻炼，因为当你创建更复杂的程序时，调试几乎会成为日常。\n\
  \n### 调试时要注意什么：\n\n如果你不知道从哪里开始，寻找 bug 和错误可能会让人不知所措。以下是程序员在编码时最常犯的一些错误：\n\n1.  使用\
  \ `=` 而不是 `==` 来比较两个值——在编程中，`=` 符号用作赋值运算符，这意味着如果你使用它而不是 `==` 符号，你最终会用等式右边的值替换等式左边变量的值。\n\
  \n2.  放错分号——就像句号在英语中结束句子一样，分号在 JavaScript 以及其他编程语言（如 C、Java 等）中结束语句。例如，如果你不小心在语句中间放了一个分号，JavaScript\
  \ 会认为该语句不完整并产生错误。\n\n3.  误用引号——引号告诉解释器你在使用字符串，所以如果你将变量或数字括在引号中，你实际上是将它们变成了字符串。当你尝试对不小心括在引号中的数字进行数值运算时，这会导致异常。\n\
  \n到目前为止，这些只是新手最容易犯的错误，但随着你练习编写更复杂的代码，你应该能够很容易地发现 bug 和错误。\n\n## 回顾\n\n到目前为止，我们已经涵盖了很多概念，所以让我们回顾一下我们学到的内容：\n\
  \n1.  变量和数据类型\n\n    *   数字——可以是整数或包含小数的数字（例如，`3.14`、`5`、`100`）\n    *   字符串——你用引号括起来的任何内容（例如，`\"\
  5\"`、`\"I am a JavaScript master\"`、`\"I love the number 7\"`）\n    *   布尔值——`true`\
  \ 或 `false`\n\n    要声明一个变量，只需输入：\n\n    ```\n    var <变量名> = <值>;\n    ```\n\n \
  \   如果你还没有值，也可以只声明变量名而不赋值：\n\n    ```\n    var <变量名>;\n    ```\n\n    JavaScript\
  \ 不关心你放入什么类型的数据。如果你用 C 或 Java 编程过，你可能习惯于声明变量的数据类型（`int`、`float`、`char` 等），但在 JavaScript\
  \ 中，你可以将任何内容放入变量而不会出现问题。\n\n2.  弹出框\n\n    *   `alert(\"Hi There!\")`——你可以向用户弹出警告。\n\
  \    *   `confirm(\"Are you sure?\")`——你可以向用户请求确认。\n    *   `prompt(\"Type anything\
  \ here.\")`——你可以向用户请求输入。\n\n3.  流程控制\n\n    *   `if-else` 语句——简而言之，如果第一个条件满足，则执行第一个大括号内的内容并跳过\
  \ `else` 部分。否则，转到 `else` 条件的大括号并执行其中的内容。\n\n# 第 14 章 正则表达式\n\n## 什么是正则表达式？\n\n正则表达式表示一种模式。在\
  \ JavaScript 中，正则表达式可用于执行诸如搜索模式、替换模式、检查字符串是否匹配给定模式或根据特定模式将字符串拆分为更小的字符串等操作。在 JavaScript\
  \ 中，正则表达式是对象。\n\n## 创建正则表达式\n\n在 JavaScript 中，有两种方法可以创建正则表达式，分别是：\n\n### 使用正则表达式字面量\n\
  \n在这种方法中，模式在两个斜杠 `//` 内指定，后面跟着称为修饰符的字符。你将在本章后面了解什么是修饰符；修饰符是可选的。\n\n语法：`/pattern/modifiers/`\n\
  \n如果使用此方法，则正则表达式在脚本加载时编译，因此如果正则表达式是常量，此方法会提高程序的性能。\n\n### 使用 `RegExp` 对象的构造函数\n\n\
  在这种方法中，我们使用 `new` 关键字来初始化一个新的 `RegExp` 对象，`RegExp` 代表正则表达式。模式作为第一个参数传递给 `RegExp`\
  \ 构造函数，修饰符作为第二个参数，注意这里的修饰符参数也是可选的。\n\n语法：`new RegExp(\"pattern\", \"modifiers\"\
  );` 或 `new RegExp(\"pattern\");`\n\n如果使用此方法，则正则表达式在运行时编译，此方法通常用于正则表达式不是常量的情况。\n\n\
  ## 修饰符\n\n修饰符用于改变基于正则表达式的模式匹配方式。下面列出了修饰符及其对操作影响的详细信息。\n\n*   `i`——使匹配不区分大小写，默认情况下正则表达式匹配是区分大小写的。\n\
  *   `m`——使模式匹配扩展到多行，如果正在执行匹配的字符串中有多行的话。\n*   `g`——默认情况下，操作在找到模式的第一个匹配后停止，但如果使用此修饰符，操作不会在第一个匹配处停止，从而执行全局匹配。\n\
  \n## 简单模式\n\n如果你想直接匹配一个字符序列，你可以将其写在模式的位置。例如，正则表达式 `/test/` 将匹配任何包含 'test' 的字符串，因此像\
  \ 'this is a test' 这样的字符串会匹配，但像 'this is a est' 这样的字符串不会匹配，因为序列中缺少字符 't'。\n\n某些字符在正则表达式中表示特殊含义，例如\
  \ `*` 或 `.`，如果你想直接匹配这些字符，则需要转义它们，即在它们前面加一个反斜杠。因此，要匹配确切的字符串 'te*st'，正则表达式将是 `/te\\\
  *st/`。你将在下一节中了解所有在正则表达式中具有特殊意义的字符。\n\n## 特殊字符\n\n以下是可用于正则表达式的特殊字符列表及其作用：\n\n*  \
  \ `^`\n\n\n\n\n如果出现在正则表达式的开头，此字符表示应从输入的开头匹配后续模式。如果使用了`'m'`修饰符，则还会测试每一行的开头是否匹配。例如，正则表达式`/^test/`不会匹配字符串‘this\
  \ is a test’中的任何内容，因为‘test’不在字符串的开头，但同样的正则表达式会匹配字符串‘test is going on’。\n\n*   `$`\n\
  \n如果出现在正则表达式的末尾，此字符表示模式应与行的末尾匹配。如果使用了`'m'`修饰符，则还会测试每一行的末尾是否匹配。例如，正则表达式`/test$/`不会匹配字符串‘test\
  \ is going on’中的任何内容，因为‘test’不在字符串的末尾，但同样的正则表达式会匹配字符串‘this is a test’。\n\n*   `*`\n\
  \n此字符用于匹配其前面的表达式零次或多次。例如，正则表达式`/te*st/`将匹配‘t’后跟零个或多个‘e’，再后跟‘st’，因此字符串‘this is a\
  \ teeeeeest’以及字符串‘this is a tst’都会被匹配，但字符串‘this is teees’不会被匹配，因为要匹配的序列中缺少‘t’。\n\
  \n*   `+`\n\n此字符用于匹配其前面的表达式一次或多次，即前面的表达式至少出现一次。例如，正则表达式`/te+st/`将匹配字符串‘this is a\
  \ teeeeeest’，但不会匹配字符串‘this is a tst’或字符串‘this is a tees’。\n\n*   `?`\n\n此字符用于匹配其前面的表达式零次或一次。例如，正则表达式`/te?st/`将匹配字符串‘this\
  \ is a test’和‘this is a tst’，但不会匹配字符串‘this is a teest’或字符串‘this is a tes’。\n\n*\
  \   `{x}`\n\n这种形式的表达式用于精确匹配前面表达式的 x 次出现，其中 x 是正整数。例如，正则表达式`/te{3}st/`将匹配字符串‘this\
  \ is a teeest’，但不会匹配字符串‘this is a test’或字符串‘this is a teeeeest’。\n\n*   `{x, y}`\n\
  \n这种形式的表达式用于匹配前面表达式出现次数在 x 到 y 之间的任意数量，其中 x 和 y 都是正整数，且 x 小于等于 y。例如，正则表达式`/te{3,\
  \ 6}st/`将匹配字符串‘this is a teeest’和‘this is a teeeeest’，但不会匹配字符串‘this is a test’或字符串‘this\
  \ is a teeeeeeest’。\n\n*   `{x, }`\n\n这种形式的表达式用于匹配前面表达式至少出现 x 次，其中 x 是正整数。例如，正则表达式`/te{3,}st/`将匹配字符串‘this\
  \ is a teeest’，但不会匹配字符串‘this is a test’或字符串‘this is a teest’。\n\n*   `.`\n\n此字符用于匹配除换行符之外的任何字符。例如，正则表达式`/te.st/`将匹配字符串‘this\
  \ is a tOst’和‘this is a tZst’，但不会匹配字符串‘this is a tst’。\n\n*   `[abc]`\n\n这种形式的表达式用于匹配方括号内出现的任何字符或表达式。例如，正则表达式`/t[eyz]st/`将匹配字符串‘this\
  \ is a test’和‘this is a tzst’，但不会匹配字符串‘this is a tpst’或字符串‘this is a trst’。你可以使用范围，如\
  \ a-z 和 0-9，它们分别匹配从‘a’到‘z’和从‘0’到‘9’的所有字符。例如，正则表达式`/t[a-z]st/`将匹配字符串‘this is a test’和‘this\
  \ is a tkst’，但不会匹配字符串‘this is a t9st’或字符串‘this is a t2st’，而正则表达式`/t[a-z0-9]st/`将匹配此特定示例中提到的所有字符串。\n\
  \n*   `[^abc]`\n\n这种形式的表达式用于匹配除 [^ 和 ] 之间的字符或表达式之外的任何内容。例如，正则表达式`/t[^eyz]st/`将匹配字符串‘this\
  \ is a tpst’和‘this is a trst’，但不会匹配字符串‘this is a test’或字符串‘this is a tyst’。你也可以像上述表达式一样使用范围。例如，正则表达式`/t[^a-z]st/`将匹配字符串‘this\
  \ is a t9st’和‘this is a t8st’，但不会匹配字符串‘this is a test’或字符串‘this is a tast’。\n\n\
  *   `(abc)`\n\n这种形式的表达式称为捕获组。() 之间的模式会被正常匹配，但会存储在内存中供以后使用；你将在本章后面学习如何在诸如 `.exec()`\
  \ 等方法中使用此表达式。元字符 这些是用于匹配特定字符或字符范围的特殊字符序列。一些最常用的元字符包括：\n\n*   `\\w`\n\n匹配任何单词字符，即任何字母数字字符（包括下划线）。\n\
  \n*   `\\W`\n\n匹配任何非单词字符。所有不被 `\\w` 匹配的字符都会被此匹配。\n\n*   `\\d`\n\n匹配任何数字，即从 0 到 9\
  \ 的任何字符。\n\n*   `\\D`\n\n匹配任何非数字，即除 0 到 9 之外的任何字符。\n\n*   `\\w`\n\n匹配任何空白字符，例如制表符、空格、行尾等。\n\
  \n*   `\\W`\n\n匹配任何非空白字符，即除制表符、空格、行尾等空白字符之外的任何字符。\n\n使用正则表达式 现在你已经学习了如何构建正则表达式，我们可以继续学习如何将它们付诸实践。下面列出的是可以与正则表达式一起使用的方法。\n\
  \n*   `regexObject.test(string)`\n\n此方法尝试将正则表达式与作为参数传递的字符串进行匹配，如果匹配，则返回 true，否则返回\
  \ false。\n\n示例：\n```\nvar result1 = /example/.test(‘this is an example’);\nvar result2\
  \ = /example/.test(‘what is this’);\nconsole.log( result1 ); //prints ‘true’ on\
  \ the console screen\ncosnole.log( result2 );//prints ‘false’ on the console screen\n\
  ```\n\n*   `regexObject.exec(string)`\n\n此方法尝试将正则表达式与作为参数传递的字符串进行匹配，如果匹配，则返回一个包含信息的数组，否则返回\
  \ null。返回的数组第一项是匹配的字符串，第二项是第一个捕获组（如果有），第三项是第二个捕获组（如果有），以此类推。\n\n示例：\n```\nvar result1\
  \ = /exam(pl)e/.test(‘this is an example’);\nvar result2 = /example/.test(‘what\
  \ is this’);\nconsole.log( result1[0] ); //prints ‘example’ on the console screen\n\
  console.log( result[1] ); //prints ‘pl’ on the console screen\ncosnole.log( result2\
  \ ); //prints ‘null’ on the console screen\n```\n\n*   `string.search(regex)`\n\n\
  此方法尝试查找作为参数传递的正则表达式的匹配项。如果找到，则返回匹配项的索引（位置），否则返回 -1。请注意，索引从 0 开始，而不是从 1 开始。因此字符串中第一个字符的索引是\
  \ 0，第二个字符的索引是 1。\n\n示例：\n```\nvar result1 = ‘an example’.search(/a.p/);\nvar result2\
  \ = ‘an example’.search(/55/);\nconsole.log( result ); //prints ‘5’ on the console\
  \ screen\ncosnole.log( result2 ); //prints ‘-1’ on the console screen\n```\n\n*\
  \   `string.replace(regex, replacer)`\n\n\n\n\n该方法尝试匹配作为第一个参数传入的正则表达式；如果找到匹配项，则将其替换为第二个参数（`replacer`）。示例：\n\
  \n```\nvar original = \"this is an example\";\n// 将第一个 s 和 a 替换为 9\nvar new = original.replace(/[sa]/,\
  \ '9');\n// 由于使用了 'g' 修饰符，将每个 s 和 a 替换为 9\nvar new2 = original.replace(/[sa]/g,\
  \ '9');\nconsole.log(new); // 在控制台输出 'thi9 is an example'\nconsole.log(new2); //\
  \ 在控制台输出 'thi9 i9 9n ex9mple'\n```\n\n我们还可以在此函数中使用正则表达式中的捕获组，然后在替换字符串中使用它们。如果在替换字符串中使用\
  \ `$` 符号后跟一个数字，那么该 `$` 符号和数字将被替换为对应索引的捕获组。例如，`$1` 被替换为正则表达式中的第一个捕获组，`$2` 被替换为第二个，以此类推。示例：\n\
  \n```\nvar original = \"this is an example\";\n// 在每个 s 和 a 的两侧添加下划线\nvar new =\
  \ original.replace(/([sa])/g, '_$1_');\nconsole.log(new); // 在控制台输出 'thi_s_ i_s_\
  \ _a_n ex_a_mple'\n```\n\n在本章中，你已经学习了正则表达式。希望阅读本章后，你对 JavaScript 中的正则表达式有了基本了解。\n\
  \n# 提升（Hoisting）\n\n## 什么是提升？\n\n“提升”一词的意思是借助某种机械装置（如滑轮）将物体举起或抬高，但在 JavaScript 中，提升是指函数和变量声明被移动到它们所声明的作用域或上下文的顶部，即像被吊起一样，因此称为“提升”。实际上，声明并非真的被移动到顶部，它们只是在编译代码时被优先处理。\n\
  \n## 变量提升\n\n例如以下代码：\n\n```\nx = 21;\nconsole.log( x );\nvar x;\n```\n\n实际编译为：\n\
  \n```\nvar x;\nx = 21;\nconsole.log(x);\n```\n\n如你所见，声明已移动到当前上下文的顶部，这就是提升。\n\n让我们通过一个更合适的例子来理解：\n\
  \n```\nconsole.log( x ); // 在控制台输出 'undefined'\nconsole.log( y ); // 抛出 ReferenceError，提示\
  \ 'y is not defined'\nvar x;\n```\n\n发生这种情况是因为 `x` 在当前上下文中被声明，尽管它位于 `console.log`\
  \ 行下方，但它被移到了上下文的顶部，并且由于没有对 `x` 进行赋值，它默认被设置为 `undefined`；而 `y` 在当前上下文中不存在，因此抛出 `ReferenceError`。\n\
  \n请注意，赋值操作不会被提升，只有声明会被提升。示例：\n\n```\nconsole.log(x); // 在控制台输出 'undefined'\nvar\
  \ x; // 只有这条语句被提升\nx = 21; // 这条语句不会被提升\n```\n\n你可能会想，如果在声明变量时同时赋值，比如 `var x = 21;`，虽然看起来是在声明时赋值，但实际上内部是先声明变量，然后再赋值，因此它等价于\
  \ `var x; x = 21;`。所以，如果你在变量被使用之后但在同一上下文中以这种方式声明变量，那么只有声明部分会被提升。示例：\n\n```\nconsole.log(x);\
  \ // 在控制台输出 'undefined'\nvar x = 21;\n```\n\n上述代码的编译方式如下：\n\n```\nvar x;\nconsole.log(x);\
  \ // 在控制台输出 'undefined'\nx = 21;\n```\n\n## 函数提升\n\n与变量提升类似，函数也会被提升。因此，只要函数在当前上下文或作用域中声明，就可以在声明之前调用它。示例：\n\
  \n```\ntest();\nfunction test() {\n    console.log('This is a test');\n}\n// 在控制台输出\
  \ 'This is a test'\n```\n\n需要注意的是，函数表达式（即通过赋值运算符 `=` 赋值给变量的函数）不会被提升。函数表达式的提升情况与变量赋值相同，这一点已在上面讨论过。示例：\n\
  \n```\ntest(); // 抛出 TypeError，提示 'test is not a function'\ntestRandom(); // 抛出\
  \ ReferenceError，提示 'testRandom is not defined'\nvar test = function {\n    console.log('This\
  \ is a test');\n};\n```\n\n在上面的例子中，错误类型的差异是由提升引起的。可见，变量 `test` 在当前作用域中被声明，因此它的声明被移到了顶部，所以它已被声明，但在使用时其值为\
  \ `undefined`，因此抛出 `TypeError`，表明 `test` 已定义但不是一个函数；而函数 `testRandom` 在任何地方都未声明，因此抛出\
  \ `ReferenceError`。\n\n## 提升的优先级顺序\n\n函数总是优先于变量声明被提升。示例：\n\n```\nfunction test()\
  \ {\n    // 函数代码\n}\nvar test;\nconsole.log( typeof test ); // 在控制台输出 'function'\n\
  ```\n\n即使在上面的例子中交换变量行和函数行的位置，输出结果仍然相同。\n\n但是，如果赋值操作发生在变量被使用的位置之上，则函数不会优先于变量声明被提升。示例：\n\
  \n```\nfunction test() {\n    // 函数代码\n}\nvar test = 21; // 现在也进行了赋值\nconsole.log(\
  \ typeof test ); // 在控制台输出 'number'\n```\n\n即使在上面的例子中交换变量行和函数行的位置，输出结果仍然相同。\n\n\
  如前所述，只要赋值操作发生在变量被使用的位置之上，这种情况就成立；当赋值操作发生在下方时，函数会优先于赋值被提升。示例：\n\n```\nfunction test()\
  \ {\n    // 函数代码\n}\nvar test;\nconsole.log(typeof test); // 在控制台输出 'function'\n\
  test = 21;\nconsole.log(typeof test); // 在控制台输出 'number'\n```\n\n## 结论\n\n最佳实践始终是将变量或函数声明在使用它们的作用域顶部，以避免任何混淆，尽管由于提升，变量声明会自动被移动到作用域或上下文的顶部。\n\
  \n# 第 15 章 变量的基本数据类型\n\n变量有四种基本数据类型：数字、字符串、布尔值和对象。我们将简要介绍这些类型，因为深入讨论它们会占用学习 JavaScript\
  \ 基础代码的时间。\n\n## 1. 数字\n\n在 JavaScript 中，通常所有数字都被视为 64 位浮点数。当小数点后没有数值时，数字以整数形式呈现。示例：\n\
  \n* `9.000` 呈现为 `9`\n* `6.000` 呈现为 `6`\n* `2.00` 呈现为 `2`\n\nJavaScript 和其他计算机编程语言基于\
  \ IEEE 754 标准，即浮点运算标准。数字字面量可以是浮点数、整数或十六进制数。浮点数示例：\n\n* `4.516`\n* `9.134`\n* `6.01`\n\
  * `4.121`\n\n整数示例：\n\n* `34`\n* `45`\n* `21`\n* `30`\n\n十六进制数示例：\n\n* `OxFF`\n*\
  \ `-OxCCFF`\n\n### 特殊数字值\n\n* `NaN` 和 `Infinity` – 是 JavaScript 的两个“错误值”\n\n当浏览器无法解析数字或操作失败时，会出现\
  \ `NaN`（非数字）错误。另一方面，`Infinity` 是一个错误，当数字因其大小而无法表示时出现。当你用零（`0`）除一个数字时，也会出现该错误。\n\n\
  * `-0` 和 `+0` – `-0` 很少出现，所以不要对这些特殊数字值感到困惑。目前可以忽略它们。\n\n* `Null` – 当浏览器无法返回值时获得。\n\
  \n## 2. 字符串\n\n字符串是通常用匹配的单引号或双引号括起来的数据类型。元素可以是数字或文本。\n\n## 3. 布尔值\n\n\n\n\n这些数据类型表示`true`或`false`。通过使用`Boolean`，你可以判断一个\
  \ JavaScript 表达式是`true`还是`false`。`true`返回值通常来自具有真值的表达式，例如数字等式和类似的表达式。相反，`false`返回值来自没有真值的表达式。示例\
  \ 1：`(3 > 9)` 当然，这是 false，因为 9 肯定大于 3。示例 2：`(2 < 3)` 显然，该语句是`true`。这个无需解释。示例 3：`(4\
  \ = 9)` 第三个示例会出现`ReferenceError`。这是因为在 JavaScript 语言以及大多数计算机编程语言中，等号（`=`）不是相等符号。等号用于给变量赋值或指定元素。请看下图：当使用正确的\
  \ JavaScript 语法时，表达式返回`false`值，因为即使使用了正确的符号，4 仍然不等于 9。\n\n## 4. 对象\n\n对象涵盖了所有数据类型，即数字、布尔值和字符串都可以是对象。数据，如数组、正则表达式、日期和数学，都是对象，同样，对象包含许多值，并具有属性（名称:值对）和方法（过程或操作）。因此，它们是命名值的容器。这种名称:值对称为属性（名称）和属性值（值）。它们可以是各种不同数据的集合。示例：\n\
  \n*   student:  “Johnson”\n*   country:  “Sweden”\n*   street:  “Reed Avenue”\n\n\
  \n\n示例：\n\n```\nvar students = {firstName: \"Lena\", lastName: \"Dean\"};\n```\n\
  \n参见下图：\n\n它们通常以“name:value”成对出现。注意每对之间的冒号以及每对之后的逗号。属性值用引号括起来，整个语句用花括号括起来。\n\n#\
  \ 第 16 章 window 对象\n\n## 什么是 `window` 对象？\n\n顾名思义，该对象代表当前窗口。BOM 的所有主要部分都是该对象的直接子对象。例如，`window.document`（DOM）、`window.history`\
  \ 等。请注意，浏览器中的每个标签页都有一个唯一的 `window` 对象，它们不共享同一个对象！某些属性（如窗口大小）在所有标签页中相同，因此具有相同的值，从技术上讲这些属性是共享的。`window`\
  \ 对象包含对有用属性和函数的引用，这些属性和函数可能并不严格与窗口相关。\n\n尽管 `window` 对象没有严格的标准，但它受到所有浏览器的支持。\n\n\
  ## 对 `window` 对象的默认引用\n\n由于 `window` 对象位于层次结构的顶部，且没有其他对象与其同级，因此所有对 `window` 对象方法和属性的引用都可以省略点号表示法的起始部分，即\
  \ `window.` 部分。例如：\n\n```\nwindow.alert()\nalert() // 同上\nvar x = window.length;\n\
  var y = length;\n// x 等于 y，因为它们引用同一个属性\n```\n\n## 所有声明的变量实际上都是 `window` 对象的属性\n\n\
  如上所述，程序中声明的变量也是 `window` 对象的直接子对象，即其属性。例如：\n\n```\nvar x = 21;\nconsole.log(window.x);\
  \ // 在控制台输出 '21'\n```\n\n## `window` 对象的方法引用\n\n以下是 `window` 对象的主要方法及其描述：\n\n- **`.alert(\"\
  message\")**  \n  该方法用于在屏幕上显示一个对话框（一种弹出窗口），其中包含作为参数传递的消息。打开的对话框只有一个按钮，即“确定”。  \n\
  \  示例：  \n  ```\n  window.alert(\"Hello from JavaScript!\")\n  ```\n  或  \n  ```\n\
  \  alert(\"Hello from JavaScript!\")\n  ```\n  以上两条语句等效。\n\n- **`.confirm(\"message\"\
  )**  \n  该方法用于在屏幕上显示一个对话框，其中包含作为参数传递的消息，以及“确定”和“取消”两个按钮。该方法返回一个布尔值：如果单击“确定”按钮则返回\
  \ `true`，如果单击“取消”按钮则返回 `false`。  \n  示例：  \n  ```\n  var val = confirm(\"Do you\
  \ accept our terms and agreement?\");\n  if (val == true) console.log(\"User pressed\
  \ OK\");\n  else console.log(\"User pressed Cancel\");\n  ```\n\n- **`.prompt(\"\
  message\", \"default text\")**  \n  该方法用于在屏幕上显示一个对话框，其中包含一条消息、一个输入框（用户可输入值）以及“确定”和“取消”按钮。该方法用于获取用户输入。`default\
  \ text` 参数是输入框的默认值。如果用户按下“确定”按钮，该方法返回用户在输入框中输入的值；如果按下“取消”按钮，则返回 `null`。  \n  示例：\
  \  \n  ```\n  var val = prompt(\"What is your name?\", \"Enter your name here\"\
  );\n  if (val === null) console.log(\"User pressed the cancel button\");\n  else\
  \ console.log(\"User's name is \" + val);\n  ```\n\n- **`.open([URL,] [name,] [specs,]\
  \ [replace])`**  \n  该方法用于打开一个新窗口。所有参数都是可选的。该方法返回新创建窗口的 `window` 对象。参数说明如下：  \n\
  \  - **URL**：指定要在新窗口中打开的页面的 URL。默认值为 `'about:blank'`，即打开一个空白页面。  \n  - **name**：指定\
  \ URL 在窗口中的打开方式或窗口的名称。可用的值如下：  \n    - `'_blank'`：默认值，URL 在新窗口中加载。  \n    - `'_parent'`：URL\
  \ 在父框架中加载。  \n    - `'_top'`：URL 替换之前加载的任何框架集。  \n    - `'_self'`：URL 替换当前页面并在当前页面中加载。\
  \  \n    - 其他任意值：作为窗口的名称。注意，窗口名称与窗口标题不同。  \n  - **specs**：一个字符串，包含新窗口的一些属性（用逗号分隔），例如宽度、高度等。\
  \  \n  - **replace**：指定新 URL 是否替换历史对象列表中的当前 URL。接受布尔值 `true` 或 `false`。如果为 `true`，新\
  \ URL 替换当前 URL；如果为 `false`，则不替换。  \n  示例：  \n  ```\n  var newWindow = window.open(\"\
  http://mySite.com\", \"\", \"height=210,width=700\");\n  // 创建一个高度 210px、宽度 700px\
  \ 的新窗口\n  ```\n\n- **`.close()`**  \n  该方法用于关闭一个窗口。  \n  示例：  \n  ```\n  var newWindow\
  \ = window.open(\"http://mySite.com\");\n  newWindow.close(); // 窗口打开后立即关闭\n  ```\n\
  \n- **`.scrollTo(xCoords, yCoords)`**  \n  该方法用于将窗口滚动到文档中指定的坐标。\n\n- **`.resizeTo(height,\
  \ width)`**  \n  该方法用于将窗口调整为指定的高度和宽度。参数的单位为像素（px）。\n\n## `window` 对象的属性\n\n以下是 `window`\
  \ 对象的主要属性及其描述：\n\n- **`.pageXOffset`**  \n  返回当前水平滚动距离（像素）。即页面实际左角与当前窗口左角之间的水平距离。\n\
  \n- **`.scrollX`**  \n  与 `window.pageXOffset` 相同。\n\n- **`.pageYOffset`**  \n \
  \ 返回当前垂直滚动距离（像素）。即页面实际顶部与当前窗口顶部之间的垂直距离。\n\n- **`.scrollY`**  \n  与 `window.pageYOffset`\
  \ 相同。\n\n- **`.outerHeight`**  \n  返回窗口的完整高度，包括文档、工具栏和滚动条。\n\n- **`.outerWidth`**\
  \  \n  返回窗口的完整宽度，包括文档、工具栏和滚动条。\n\n- **`.innerHeight`**  \n  返回窗口内容区域的高度（即显示 HTML\
  \ 文档的区域），不包括滚动条或工具栏的高度。\n\n- **`.innerWidth`**  \n  返回窗口内容区域的宽度（即显示 HTML 文档的区域），不包括滚动条或工具栏的高度。\n\
  \n- **`.frames`**  \n  返回一个数组，包含当前窗口中所有 `<iframe>` 元素（如果有）。  \n  示例：  \n  ```\n\
  \  <body>\n    <iframe src=\"https://mySite1.com\"></iframe>\n    <iframe src=\"\
  https://mySite2.com\"></iframe>\n    <script>\n      console.log(window.frames.length);\
  \ // 在控制台输出 '2'\n    </script>\n  </body>\n  ```\n\n- **`.closed`**  \n  返回一个布尔值，指示窗口是否已关闭。如果返回\
  \ `true`，则窗口已关闭；如果返回 `false`，则窗口未关闭。  \n  示例：  \n  ```\n  var newWindow = window.open(\"\
  http://mySite.com\");\n  function isNewWindowOpen() {\n    if (newWindow.closed\
  \ == true) return \"NO\";\n    else return \"YES\";\n  }\n  ```\n\n# 第 17 章 Map\
