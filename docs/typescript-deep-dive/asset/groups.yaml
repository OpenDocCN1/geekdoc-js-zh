    \   logWorld() { super.log() };\n  }\n}\n```\n\n## Classes Super\n\n## Arrow Functions\n\
    \nTip: Arrow Function Need\nTip: Arrow Function Danger\nTip: Libraries that use\
    \ this\nTip: Arrow Function inheritance\n\n**Arrow Functions**\n\nLovingly called\
    \ the *fat arrow* (because -> is a thin arrow and => is a fat arrow) and also\
    \ called a *lambda function* (because of other languages). Another commonly used\
    \ feature is the fat arrow function `()=>something`. The motivation for a *fat\
    \ arrow* is:\n\n1. You don't need to keep typing `function`\n2. It lexically captures\
    \ the meaning of `this`\n3. It lexically captures the meaning of `arguments`\n\
    \nFor a language that claims to be functional, in JavaScript you tend to be typing\
    \ `function` quite a lot. The fat arrow makes it simple for you to create a function\n\
    \n`var inc = (x)=>x+1;`\n\nthis has traditionally been a pain point in JavaScript.\
    \ As a wise man once said \"I hate JavaScript as it tends to lose the meaning\
    \ of `this` all too easily\". Fat arrows fix it by capturing the meaning of `this`\
    \ from the surrounding context. Consider this pure JavaScript class:\n\n```javascript\n\
    function Person(age) {\n  this.age = age;\n  this.growOld = function() {\n   \
    \ this.age++;\n  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld,\
    \ 1000);\nsetTimeout(function() { console.log(person.age); }, 2000);\n```\n\n\
    If you run this code in the browser `this` within the function is going to point\
    \ to `window` because `window` is going to be what executes. Fix is to use an\
    \ arrow:\n\n```javascript\nfunction Person(age) {\n  this.age = age;\n  this.growOld\
    \ = () => {\n    this.age++;\n  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld,\
    \ 1000);\nsetTimeout(function() { console.log(person.age); }, 2000);\n```\n\n\
    The reason why this works is the reference to `this` is captured by the arrow\
    \ function from the function body. This is equivalent to the following JavaScript\
    \ (which is what you would write if didn't have):\n\n```javascript\nfunction Person(age)\
    \ {\n  this.age = age;\n  var _this = this; // capture this\n  this.growOld =\
    \ function() {\n    _this.age++;\n  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld,\
    \ 1000);\nsetTimeout(function() { console.log(person.age); }, 2000);\n```\n\n\
    Note that since you are using TypeScript you can be even sweeter in syntax and\
    \ combine arrows with classes:\n\n```typescript\nclass Person {\n  constructor(public\
    \ age: number) {}\n  growOld = () => {\n    this.age++;\n  }\n}\n\nvar person\
    \ = new Person(1);\nsetTimeout(person.growOld, 1000);\nsetTimeout(function() {\
    \ console.log(person.age); }, 2000);\n```\n\n**Tip: Arrow Function Need**\n\n\
    Beyond the terse syntax, you only *need* to use fat arrow if you are going to\
    \ give to someone else to call. If you are going to call it yourself, i.e. `this`\
    \ is going to be the correct calling context (in this example `var growOld = person.growOld;`).\
    \ Then someone else calls `growOld();`.\n\n**Tip: Arrow Function Danger**\n\n\
    In fact if you want `this` to be the calling context you should *not use the arrow\
    \ function*. This is the case with callbacks used by libraries jquery, underscore\
    \ and others. Similarly if you plan to use `arguments` you should probably just\
    \ use `function` instead of fat arrow.\n\n**Tip: Arrow functions with libraries\
    \ that use this**\n\nMany libraries do this e.g. .each will use `this` to pass\
    \ you the object it is currently iterating over. In this case if you want to access\
    \ `this` as well as the surrounding context just use a temp variable like `_self`\
    \ like in the absence of arrow functions:\n\n```javascript\nlet _self = this;\n\
    something.each(function() {\n  console.log(_self); // lexically scoped value\n\
    \  console.log(this); // library passed value\n});\n```\n\n**Tip: Arrow functions\
    \ and inheritance**\n\nIf you have an instance method as an arrow function then\
    \ it goes on `this`. Such functions cannot participate in a call to `super` (super\
    \ works on prototype). You can easily get around it by creating a copy of the\
    \ method before overriding it in the child.\n\n```typescript\nclass Adder {\n\
    \  constructor(public a: number) {}\n  add = (b: number): number => {\n    return\
    \ this.a + b;\n  }\n}\n\nclass ExtendedAdder extends Adder {\n  // Create a copy\
    \ of parent before creating our own\n  private superAdd = this.add;\n  add = (b:\
    \ number): number => {\n    return this.superAdd(b);\n  }\n}\n```\n\n## Rest Parameters\n\
    \nRest parameters (denoted by `...argumentName` for the last argument) allow you\
    \ to quickly accept multiple arguments in your function and get them as an array.\
    \ This is demonstrated in the below example.\n\n```javascript\nfunction iTakeItAll(first,\
    \ second, ...allOthers) {\n  console.log(allOthers);\n}\niTakeItAll('foo', 'bar');\
    \ // []\niTakeItAll('foo', 'bar', 'bas', 'qux'); // ['bas','qux']\n```\n\nRest\
    \ parameters can be used in any function be it function / ()=> class member.\n\
    \n## let\n\nVariables in JavaScript are *function scoped*. This is different from\
    \ many other languages (C# / Java etc.) where the variables are *block scoped*.\
    \ If you bring a *block scoped* mindset to JavaScript, you would expect the following\
    \ to print 123, instead it will print 456:\n\n```javascript\nvar foo = 123;\n\
    if (true) {\n  var foo = 456;\n}\nconsole.log(foo); // 456\n```\n\nThis is because\
    \ `{}` does not create a new *variable scope*. The variable `foo` is the same\
    \ inside the if block as it is outside the if block. This is a common source of\
    \ errors in JavaScript programming. This is why TypeScript (and ES6) introduces\
    \ the `let` keyword to allow you to define variables with true *block scope*.\
    \ That is if you use `let` instead of `var` you get a true unique element disconnected\
    \ from what you might have defined outside the scope. The same example is demonstrated\
    \ with `let`:\n\n```javascript\nlet foo = 123;\nif (true) {\n  let foo = 456;\n\
    }\nconsole.log(foo); // 123\n```\n\nAnother place where `let` would save you from\
    \ errors is loops.\n\n```javascript\nvar index = 0;\nvar array = [1, 2, 3];\n\
    for (let index = 0; index < array.length; index++) {\n  console.log(array[index]);\n\
    }\nconsole.log(index); // 0\n```\n\nIn all sincerity we find it better to use\
    \ `let` whenever possible as it leads to lesser surprises for new and existing\
    \ multi-lingual developers.\n\n## Functions create a new scope\n\nSince we mentioned\
    \ it, we'd like to demonstrate that functions create a new variable scope in JavaScript.\
    \ Consider the following:\n\n```javascript\nvar foo = 123;\nfunction test() {\n\
    \  var foo = 456;\n}\ntest();\nconsole.log(foo); // 123\n```\n\nThis behaves as\
    \ you would expect. Without this it would be very difficult to write code in JavaScript.\n\
    \n## Generated JS\n\nThe JS generated by TypeScript is simple renaming of the\
    \ `let` variable if a similar name already exists in the surrounding scope. E.g.\
    \ the following is generated as is with a simple replacement of `var` with `let`:\n\
    \n```javascript\nif (true) {\n  let foo = 123;\n}\n```\n\nHowever if the variable\
    \ name is already taken by the surrounding scope then a new variable name is generated\
    \ as shown (notice `_foo`):\n\n```javascript\nvar foo = '123';\nif (true) {\n\
    \  var _foo = 123; // Renamed\n}\n```\n\n## let in closures\n\nA common programming\
    \ interview question for a JavaScript developer is what is the log of this simple\
    \ file:\n\n```javascript\nlet\n```"
