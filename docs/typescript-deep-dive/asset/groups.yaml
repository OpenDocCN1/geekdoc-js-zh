    \n}\n\ninterface Rectangle {\n\n kind: \"rectangle\";\n\n width: number;\n\n height:\
    \ number;\n\n}\n\ntype Shape = Square | Rectangle;\n\nIf you use a type guard\
    \ style check ( == ,  === ,  != ,  !== ) or  switch  on the *discriminant*\n\n\
    *property* (here  kind ) TypeScript will realize that it means that the object\
    \ must of the type\n\nthat has that literal and do a type narrowing for you :)\n\
    \nfunction area(s: Shape) {\n\n if (s.kind === \"square\") {\n\n // Now TypeScript\
    \ \\*knows\\* that \\`s\\` must be a square ;)\n\n // So you can use its members\
    \ safely :)\n\n return s.size \\* s.size;\n\n }\n\n else {\n\n // Wasn't a square?\
    \ So TypeScript will figure out that it must be a Rectangle \n\n;)\n\n // So you\
    \ can use its members safely :)\n\n return s.width \\* s.height;\n\n }\n\n}\n\n\
    **Exhaustive Checks**\n\nQuite commonly you want to make sure that all members\
    \ of a union have some code(action)\n\nagainst them.\n\nDiscriminated Unions\n\
