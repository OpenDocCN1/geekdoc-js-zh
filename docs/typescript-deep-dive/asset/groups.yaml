  - "[PAGE 191]\n\n**Discriminated Union**\n\nIf you have a class with a *literal\
    \ member* then you can use that property to discriminate\n\nbetween union members.\n\
    \nAs an example consider the union of a  Square  and  Rectangle , here we have\
