    \  }\n  Point3D.prototype.add = function (point) {\n    var point2D = _super.prototype.add.call(this,\
    \ point);\n    return new Point3D(point2D.x, point2D.y, this.z + point.z);\n \
    \ };\n  return Point3D;\n})(Point);\n```\n\n注意，IIFE 允许 TypeScript 轻松地将基类 `Point`\
    \ 捕获到 `super` 变量中，并在类体中一致地使用。\n\n**__extends__**\n\n你会发现，一旦继承一个类，TypeScript 也会生成以下函数：\n\
