  - "[PAGE 253]\n\n**Barrel**\n\nA barrel is a way to rollup exports from several\
    \ modules into a single convenient module.\n\nThe barrel itself is a module file\
    \ that re-exports selected exports of other modules.\n\nImagine the following\
    \ class structure in a library:\n\n// demo/foo.ts\n\nexport class Foo {}\n\n//\
    \ demo/bar.ts\n\nexport class Bar {}\n\n// demo/baz.ts\n\nexport class Baz {}\n\
    \nWithout a barrel, a consumer would need three import statements:\n\nimport {\
    \ Foo } from '../demo/foo';\n\nimport { Bar } from '../demo/bar';\n\nimport {\
    \ Baz } from '../demo/baz';\n\nYou can instead add a barrel  demo/index.ts  containing\
    \ the following:\n\n// demo/index.ts\n\nexport \\* from './foo'; // re-export\
    \ all of its exports\n\nexport \\* from './bar'; // re-export all of its exports\n\
    \nexport \\* from './baz'; // re-export all of its exports\n\nNow the consumer\
    \ can import what it needs from the barrel:\n\nimport { Foo, Bar, Baz } from '../demo';\
    \ // demo/index.ts is implied\n\n**Named exports**\n\nInstead of exporting \\\
    * you can chose to export the module in a name. Eg. assume that\n\n baz.ts  has\
    \ functions:\n\nBarrel\n\n254"
- md: "\n// demo/foo.ts\n\nexport class Foo {}\n\n// demo/bar.ts\n\nexport class Bar\
    \ {}\n\n// demo/baz.ts\n\nexport function getBaz() {}\n\nexport function setBaz()\
    \ {}\n\nIf you would rather not export `getBaz / setBaz` from demo you can instead\
    \ put them in a variable by importing them in a name and exporting that name as\
    \ shown below:\n\n// demo/index.ts\n\nexport * from './foo'; // re-export all\
    \ of its exports\n\nexport * from './bar'; // re-export all of its exports\n\n\
    import * as baz from './baz'; // import as a name\n\nexport { baz }; // export\
    \ the name\n\nAnd now the consumer would look like:\n\nimport { Foo, Bar, baz\
    \ } from '../demo'; // demo/index.ts is implied\n\n// usage\n\nbaz.getBaz();\n\
    \nbaz.setBaz();\n\n// etc. ...\n\n## Barrel\n\n## Creating arrays\n\nCreating\
    \ an empty array is super easy:\n\n```typescript\nconst foo:string[] = [];\n```\n\
    \nIf you want to create an array pre-filled with some content use the ES6 `Array.prototype.fill`:\n\
    \n```typescript\nconst foo:string[] = new Array(3).fill('');\nconsole.log(foo);\
    \ // ['','',''];\n```\n\n## Typesafe Event Emitter\n\nConventionally in Node.js\
    \ and traditional JavaScript you have a single event emitter. This event emitter\
    \ internally tracks listener for different event types e.g.\n\n```typescript\n\
    const emitter = new EventEmitter();\n\n// Emit: \nemitter.emit('foo', foo);\n\
    emitter.emit('bar', bar);\n\n// Listen: \nemitter.on('foo', (foo)=>console.log(foo));\n\
    emitter.on('bar', (bar)=>console.log(bar));\n```\n\nEssentially `EventEmitter`\
    \ internally stores data in the form of mapped arrays:\n\n`{foo: [fooListeners],\
    \ bar: [barListeners]}`\n\nInstead, for the sake of *event* type safety, you can\
    \ create an emitter *per* event type:\n\n```typescript\nconst onFoo = new TypedEvent<Foo>();\n\
    const onBar = new TypedEvent<Bar>();\n\n// Emit: \nonFoo.emit(foo);\nonBar.emit(bar);\n\
    \n// Listen: \nonFoo.on((foo)=>console.log(foo));\nonBar.on((bar)=>console.log(bar));\n\
    ```\n\nThis has the following advantages:\n\n- The types of events are easily\
    \ discoverable as variables.\n- The event emitter variables are easily refactored\
    \ independently.\n- Type safety for event data structures.\n\n## Reference TypedEvent\n\
    \n```typescript\nexport interface Listener<T> {\n  (event: T): any;\n}\n\nexport\
    \ interface Disposable {\n  dispose();\n}\n\n/** passes through events as they\
    \ happen. You will not get events from before you start listening */\nexport class\
    \ TypedEvent<T> {\n  private listeners: Listener<T>[] = [];\n  private listenersOncer:\
    \ Listener<T>[] = [];\n\n  on = (listener: Listener<T>): Disposable => {\n   \
    \ this.listeners.push(listener);\n    return {\n      dispose: () => this.off(listener)\n\
    \    };\n  }\n\n  once = (listener: Listener<T>): void => {\n    this.listenersOncer.push(listener);\n\
    \  }\n\n  off = (listener: Listener<T>) => {\n    var callbackIndex = this.listeners.indexOf(listener);\n\
    \    if (callbackIndex > -1) this.listeners.splice(callbackIndex, 1);\n  }\n\n\
    \  emit = (event: T) => {\n    /** Update any general listeners */\n    this.listeners.forEach((listener)\
    \ => listener(event));\n    /** Clear the `once` queue */\n    this.listenersOncer.forEach((listener)\
    \ => listener(event));\n    this.listenersOncer = [];\n  }\n\n  pipe = (te: TypedEvent<T>):\
    \ Disposable => {\n    return this.on((e) => te.emit(e));\n  }\n}\n```\n\n## TypeScript\
    \ StyleGuide and Coding\n\n### Conventions\n\nAn unofficial TypeScript StyleGuide\n\
    \nPeople have asked me for my opinions on this. Personally I don't enforce these\
    \ a lot on my teams and projects but it does help to have these mentioned as a\
    \ tie breaker when someone feels the need to have such strong consistency. There\
    \ are other things that I feel much more strongly about and those are covered\
    \ in the tips chapter (e.g. type assertion is bad, property setters are bad).\n\
    \nKey Sections:\n\n- Variable\n- Class\n- Interface\n- Type\n- Namespace\n- Enum\n\
    - null vs. undefined\n- Formatting\n- Single vs. Double Quotes\n- Tabs vs. Spaces\n\
    - Use semicolons\n- Annotate Arrays as Type[]\n- File Names\n\n### Variable and\
    \ Function\n\nUse `camelCase` for variable and function names\n\nReason: Conventional\
    \ JavaScript\n\n**Bad**\n```typescript\nvar FooVar;\nfunction BarFunc() { }\n\
    ```\n\n**Good**\n```typescript\nvar fooVar;\nfunction barFunc() { }\n```\n\n###\
    \ Class\n\nUse `PascalCase` for class names.\n\nReason: This is actually fairly\
    \ conventional in standard JavaScript.\n\n**Bad**\n```typescript\nclass foo {\
    \ }\n```\n\n**Good**\n```typescript\nclass Foo { }\n```\n\nUse `camelCase` of\
    \ class members and methods\n\nReason: Naturally follows from variable and function\
    \ naming convention.\n\n**Bad**\n```typescript\nclass Foo {\n  Bar: number;\n\
    \  Baz() { }\n}\n```\n\n**Good**\n```typescript\nclass Foo {\n  bar: number;\n\
    \  baz() { }\n}\n```\n\n### Interface\n\nUse `PascalCase` for interface names.\n\
    \nReason: Similar to classes.\n\n**Bad**\n```typescript\ninterface foo { }\n```\n\
    \n**Good**\n```typescript\ninterface Foo { }\n```\n\n### Type\n\nUse `PascalCase`\
    \ for type names.\n\nReason: Similar to classes.\n\n**Bad**\n```typescript\ntype\
    \ foo = {};\n```\n\n**Good**\n```typescript\ntype Foo = {};\n```\n\n### Namespace\n\
    \nUse `PascalCase` for namespace names.\n\nReason: Similar to classes.\n\n**Bad**\n\
    ```typescript\nnamespace foo { }\n```\n\n**Good**\n```typescript\nnamespace Foo\
    \ { }\n```\n\n### Enum\n\nUse `PascalCase` for enum names.\n\nReason: Similar\
    \ to classes.\n\n**Bad**\n```typescript\nenum color { red }\n```\n\n**Good**\n\
    ```typescript\nenum Color { Red }\n```\n\n### null vs. undefined\n\nUse `===`\
    \ and `!==` for strict equality.\n\nReason: It avoids unexpected coercion.\n\n\
    **Bad**\n```typescript\nif (x == null) { }\n```\n\n**Good**\n```typescript\nif\
    \ (x !== null) { }\n```\n\n### Formatting\n\nThe TypeScript compiler ships with\
    \ a very nice service. Whatever output it gives is good enough\n\nUse `tsfmt`\
    \ to automatically format your code. Also your IDE already has formatting built-in\n\
    \n### Single vs. Double Quotes\n\nPrefer single quotes (`'`) unless escaping.\n\
    \nReason: More JavaScript teams do this. Easier on most keyboards.\n\n**Bad**\n\
    ```typescript\nconst foo = \"hello\";\n```\n\n**Good**\n```typescript\nconst foo\
    \ = 'hello';\n```\n\n### Tabs vs. Spaces\n\nUse `2` spaces. Not tabs.\n\nReason:\
    \ More JavaScript teams do this. The TypeScript/VSCode teams use 4 spaces but\
    \ are definitely the exception in the ecosystem.\n\n### Use semicolons\n\nUse\
    \ semicolons.\n\nReason: Explicit semicolons helps language formatting tools give\
    \ consistent results. Missing ASI (automatic semicolon insertion) can trip new\
    \ devs.\n\n### Annotate Arrays as Type[]\n\nAnnotate arrays as `foos:Foo[]` instead\
    \ of `foos:Array<Foo>`.\n\nReason: Its easier to read. Its used by the TypeScript\
    \ team. Makes easier to know something is an array as the mind is trained to detect\
    \ `[]`.\n\n### File Names\n\nName files with `camelCase`. E.g. `accordian.tsx`,\
    \ `myControl.tsx`, `utils.ts`, `map.ts` etc.\n\nReason: Conventional across many\
    \ JS teams.\n"
  mdcn: "\n\n// demo/foo.ts\n\nexport class Foo {}\n\n// demo/bar.ts\n\nexport class\
    \ Bar {}\n\n// demo/baz.ts\n\nexport function getBaz() {}\n\nexport function setBaz()\
    \ {}\n\n如果你不想从 demo 中导出 `getBaz / setBaz`，你也可以通过将它们导入到一个名称中，并导出该名称来实现，如下所示：\n\n\
    // demo/index.ts\n\nexport * from './foo'; // 重新导出所有的导出\n\nexport * from './bar';\
    \ // 重新导出所有的导出\n\nimport * as baz from './baz'; // 导入为名称名称\n\nexport { baz };\
    \ // 导出名称\n\n现在消费者的写法看起来像这样：\n\nimport { Foo, Bar, baz } from '../demo'; // 隐含使用\
    \ demo/index.ts\n\n// 使用\n\nbaz.getBaz();\n\nbaz.setBaz();\n\n// 等等 ...\n\n##\
    \ 桶文件 (Barrel)\n\n## 创建数组 (Creating arrays)\n\n创建一个空数组超级简单：\n\n```typescript\n\
    const foo:string[] = [];\n```\n\n如果你想创建一个预先填充了某些内容的数组，可以使用 ES6 的 `Array.prototype.fill`：\n\
    \n```typescript\nconst foo:string[] = new Array(3).fill('');\nconsole.log(foo);\
    \ // ['','',''];\n```\n\n## 类型安全的发射器 (Typesafe Event Emitter)\n\n在 Node.js 和传统的\
    \ JavaScript 中，通常只有一个事件发射器。这个事件发射器在内部跟踪不同事件类型的监听器，例如：\n\n```typescript\nconst\
    \ emitter = new EventEmitter();\n\n// 触发 (Emit): \nemitter.emit('foo', foo);\n\
    emitter.emit('bar', bar);\n\n// 监听 (Listen): \nemitter.on('foo', (foo)=>console.log(foo));\n\
    emitter.on('bar', (bar)=>console.log(bar));\n```\n\n本质上 `EventEmitter` 在内部以映射数组的形式存储数据：\n\
    \n`{foo: [fooListeners], bar: [barListeners]}`\n\n相反，为了实现*事件*类型安全，你可以为*每个*事件类型创建一个发射器：\n\
    \n```typescript\nconst onFoo = new TypedEvent<Foo>();\nconst onBar = new TypedEvent<Bar>();\n\
    \n// 触发 (Emit): \nonFoo.emit(foo);\nonBar.emit(bar);\n\n// 监听 (Listen): \nonFoo.on((foo)=>console.log(foo));\n\
    onBar.on((bar)=>console.log(bar));\n```\n\n这种方式具有以下优势：\n\n- 事件类型可以作为变量被轻松发现。\n\
    - 事件发射器变量可以独立地进行重构。\n- 事件数据结构的类型安全。\n\n## 参考 TypedEvent (Reference TypedEvent)\n\
    \n```typescript\nexport interface Listener<T> {\n  (event: T): any;\n}\n\nexport\
    \ interface Disposable {\n  dispose();\n}\n\n/** 当事件发生时将其透传。你将无法获取在你开始监听之前的事件。\
    \ */\nexport class TypedEvent<T> {\n  private listeners: Listener<T>[] = [];\n\
    \  private listenersOncer: Listener<T>[] = [];\n\n  on = (listener: Listener<T>):\
    \ Disposable => {\n    this.listeners.push(listener);\n    return {\n      dispose:\
    \ () => this.off(listener)\n    };\n  }\n\n  once = (listener: Listener<T>): void\
    \ => {\n    this.listenersOncer.push(listener);\n  }\n\n  off = (listener: Listener<T>)\
    \ => {\n    var callbackIndex = this.listeners.indexOf(listener);\n    if (callbackIndex\
    \ > -1) this.listeners.splice(callbackIndex, 1);\n  }\n\n  emit = (event: T) =>\
    \ {\n    /** 更新任何通用监听器 */\n    this.listeners.forEach((listener) => listener(event));\n\
    \    /** 清空 `once` 队列 */\n    this.listenersOncer.forEach((listener) => listener(event));\n\
    \    this.listenersOncer = [];\n  }\n\n  pipe = (te: TypedEvent<T>): Disposable\
    \ => {\n    return this.on((e) => te.emit(e));\n  }\n}\n```\n\n## TypeScript 风格指南与编码\
    \ (TypeScript StyleGuide and Coding)\n\n### 规范 (Conventions)\n\n一份非官方的 TypeScript\
    \ 风格指南\n\n人们曾就此向我征求意见。个人我并没有在团队和项目中强制执行这些规则，但当有人认为需要如此强大的一致性时，这些规则作为决的依据是有帮助的。还有其他我更在意的事情，那些涵盖在技巧章节中（例如：类型断言是不好的，属性设置器是不好的）。\n\
    \n关键章节：\n\n- 变量 (Variable)\n- 类 (Class)\n- 接口 (Interface)\n- 类型 (Type)\n- 命名空间\
    \ (Namespace)\n- 枚举 (Enum)\n- null vs undefined (null vs. undefined)\n- 格式化 (Formatting)\n\
    - 单引号 vs 双引号 (Single vs. Double Quotes)\n- Tab vs 空格 (Tabs vs. Spaces)\n- 使用分号\
    \ (Use semicolons)\n- 将数组注解为 Type[] (Annotate Arrays as Type[])\n- 文件名 (File Names)\n\
    \n### 变量与函数 (Variable and Function)\n\n变量和函数名使用 `camelCase`\n\n原因：符合 JavaScript\
    \ JavaScript\n\n**坏写法**\n```typescript\nvar FooVar;\nfunction BarFunc() { }\n\
    ```\n\n**良好写法**\n```typescript\nvar fooVar;\nfunction barFunc() { }\n```\n\n###\
    \ 类 (Class)\n\n类名使用 `PascalCase`。\n\n原因：这在标准 JavaScript 中非常符合习惯。\n\n**坏写法**\n\
    ```typescript\nclass foo { }\n```\n\n**良好写法**\n```typescript\nclass Foo { }\n\
    ```\n\n类成员和方法使用 `camelCase`\n\n原因：自然遵循变量和函数的命名规范。\n\n**坏写法**\n```typescript\n\
    class Foo {\n  Bar: number;\n  Baz() { }\n}\n```\n\n**良好写法**\n```typescript\n\
    class Foo {\n  bar: number;\n  baz() { }\n}\n```\n\n### 接口 (Interface)\n\n接口名使用\
    \ `PascalCase`。\n\n原因：与类类似。\n\n**坏写法**\n```typescript\ninterface foo { }\n```\n\
    \n**良好写法**\n```typescript\ninterface Foo { }\n```\n\n### 类型 (Type)\n\n类型名使用 `PascalCase`。\n\
    \n原因：与类类似。\n\n**坏写法**\n```typescript\ntype foo = {};\n```\n\n**良好写法**\n```typescript\n\
    type Foo = {};\n```\n\n### 命名空间 (Namespace)\n\n命名空间名使用 `PascalCase`。\n\n原因：与类类似。\n\
    \n**坏写法**\n```typescript\nnamespace foo { }\n```\n\n**良好写法**\n```typescript\n\
    namespace Foo { }\n```\n\n### 枚举 (Enum)\n\n枚举名使用 `PascalCase`。\n\n原因：与类类似。\n\n\
    **坏写法**\n```typescript\nenum color { red }\n```\n\n**良好写法**\n```typescript\nenum\
    \ Color { Red }\n```\n\n### null vs. undefined (null vs. undefined)\n\n使用 `===`\
    \ 和 `!==` 进行严格相等。\n\n原因：避免意外的类型转换。\n\n**坏写法**\n```typescript\nif (x == null) {\
    \ }\n```\n\n**良好写法**\n```typescript\nif (x !== null) { }\n```\n\n### 格式化 (Formatting)\n\
    \nTypeScript 编译器带有一个非常好用的服务。它输出的结果足够好。\n\n使用 `tsfmt` 自动格式化你的代码。你的 IDE 也已经内置了格式化功能。\n\
    \n### 单引号 vs 双引号 (Single vs. Double Quotes)\n\n除非需要转义，否则优先使用单引号。\n\n原因：更多 JavaScript\
    \ 团队这样做。在大多数键盘上更容易输入。\n\n**坏写法**\n```typescript\nconst foo = \"hello\";\n```\n\
    \n**良好写法**\n```typescript\nconst foo = 'hello';\n```\n\n### Tab vs 空格 (Tabs vs.\
    \ Spaces)\n\n使用 `2` 个空格。不要使用 Tab。\n\n原因：更多 JavaScript 团队这样做。TypeScript/VSCode\
    \ 团队使用 4 个空格，但他们是生态系统中的例外。\n\n### 使用分号 (Use semicolons)\n\n使用分号。\n\n原因：显式分号有助于语言格式化工具产生一致的结果。缺少\
    \ ASI（自动分号插入）可能会让新手困惑。\n\n### 将数组注解为 Type[] (Annotate Arrays as Type[])\n\n将数组注解为\
    \ `foos:Foo[]` 而不是 `foos:Array<Foo>`。\n\n原因：更容易读。TypeScript 团队也是这样使用的。大脑通过检测 `[]`\
    \ 可以更容易判断某物是数组。\n\n### 文件名 (File Names)\n\n使用 `camelCase` 命名文件。例如 `accordian.tsx`、`myControl.tsx`、`utils.ts`、`map.ts`\
    \ 等。\n\n原因：在许多 JS 团队中是常规做法。\n\n"
