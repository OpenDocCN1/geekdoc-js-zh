  mdcn: "\n\nTypeScript 中的枚举（Enum）提供了某种程度的名义类型（nominal typing）。如果两个枚举类型的名称不同，它们就是不等的。我们可以利用这一事实为其他在结构上兼容的类型提供名义类型。\n\
    \n解决办法包括：\n\n-   创建一个 *brand*（品牌）枚举。\n-   将类型创建为 *brand* 枚举与实际结构的*交集* ( & )。\n\
    \n下面演示了这一方法，其中类型的结构仅为字符串：\n\n```typescript\n// FOO\nenum FooIdBrand {}\n\ntype\
    \ FooId = FooIdBrand & string;\n\n// BAR\n\nenum BarIdBrand {}\n\ntype BarId =\
    \ BarIdBrand & string;\n\n/**\n * 使用 Demo\n */\nvar fooId: FooId;\nvar barId:\
    \ BarId;\n\n// 安全检查！\nfooId = barId; // error\nbarId = fooId; // error\n\n// 实例化\n\
    fooId = 'foo' as FooId;\nbarId = 'bar' as BarId;\n\n// 两个类型与基础类型兼容\nvar str: string;\n\
    str = fooId;\nstr = barId;\n```\n\n## 使用接口 (Interfaces)\n\n由于数字与枚举是类型兼容的，因此之前的技术无法用于数字。相反，我们可以使用接口来打破结构兼容性。TypeScript\
    \ 编译器团队仍然在使用这种方法，因此值得提一下。我强烈建议使用 `_` 前缀和 `Brand` 后缀的约定（这也是 TypeScript 团队所遵循的约定）。\n\
    \n解决办法涉及以下步骤：\n\n-   在类型上添加一个未使用的属性以打破结构兼容性。\n-   在需要实例化或向下类型转换时使用类型断言。\n\n下面演示了这一方法：\n\
    \n```typescript\n// FOO\ninterface FooId extends String {\n  _fooIdBrand: string;\
    \ // 防止类型错误\n}\n\n// BAR\ninterface BarId extends String {\n  _barIdBrand: string;\
    \ // 防止类型错误\n}\n\n/**\n * 使用 Demo\n */\nvar fooId: FooId;\nvar barId: BarId;\n\
    \n// 安全检查！\nfooId = barId; // error\nbarId = fooId; // error\nfooId = <FooId>barId;\
    \ // error\nbarId = <BarId>fooId; // error\n\n// 实例化\nfooId = 'foo' as any;\n\
    barId = 'bar' as any;\n\n// 如果你需要基础字符串\nvar str: string;\nstr = fooId as any;\n\
    str = barId as any;\n```\n\n## 有状态函数 (Stateful Functions)\n\n其他编程语言中的一个常见特性是使用\
    \ `static` 关键字增加函数变量的*寿命*（而不是*作用域*），使其在函数调用之外。这里有一个实现此点的 C 示例：\n\n```c\nvoid called()\
    \ {\n  static count = 0;\n  count++;\n  printf(\"Called : %d\", count);\n}\n\n\
    int main () {\n  called(); // Called : 1\n  called(); // Called : 2\n  return\
    \ 0;\n}\n```\n\n由于 JavaScript（或 TypeScript）没有函数静态变量，你可以使用各种封装局部变量的抽象来实现相同的效果，例如使用类：\n\
    \n```javascript\nconst {called} = new class {\n  count = 0;\n  called = () =>\
    \ {\n    this.count++;\n    console.log(`Called : ${this.count}`);\n  }\n};\n\n\
