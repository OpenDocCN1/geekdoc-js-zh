    \ try and achieve this using a pattern they call functor (a class that overrides\
    \ the operator () ).\n\n## Bind is Harmful\n\nThis is the definition of bind in\
    \ lib.d.ts :\n\n`bind(thisArg: any, ...argArray: any[]): any;`\n\nAs you can see\
    \ it returns **any**! That means that calling bind on a function will cause you\
