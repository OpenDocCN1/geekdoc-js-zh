    \ an assertion in terms of type safety. That said they do provide *convenience*\
    \ to your API.\n\nAn example is a function that loads a json response. It returns\
    \ a promise of *whatever type* *you pass in*:\n\n```typescript\nconst getJSON\
    \ = <T>(config: {\n  url: string,\n  headers?: { [key: string]: string },\n}):\
    \ Promise<T> => {\n  const fetchConfig = ({\n    method: 'GET',\n    'Accept':\
    \ 'application/json',\n    'Content-Type': 'application/json',\n    ...(config.headers\
    \ || {})\n  });\n  return fetch(config.url, fetchConfig)\n    .then<T>(response\
    \ => response.json());\n}\n```\n\nNote that you still have to explicitly annotate\
    \ what you want, but the getJSON<T> signature (config) => Promise<T> saves you\
    \ a few key strokes:\n\n```typescript\ntype LoadUsersResponse = {\n  users: {\n\
    \    name: string;\n    email: string;\n  }[];\n}\n\nfunction loadUsers() {\n\
    \  return getJSON<LoadUsersResponse>({ url: 'https://example.com/users' });\n\
    }\n```\n\nAlso Promise<T> as a return value is definitely better than alternatives\
    \ like Promise<any> .\n\n## Type Inference in TypeScript\n\nTypeScript can infer\
    \ (and then check) the type of a variable based on a few simple rules. Because\
    \ these rules are simple you can train your brain to recognize safe / unsafe code\
    \ (it happened for me and my team mates quite quickly).\n\nThe types flowing is\
    \ just how I imagine in my brain the flow of type information.\n\n### Definition\n\
    \nTypes of a variable are inferred by definition.\n\n```typescript\nlet foo =\
    \ 123; // foo is a `number`\nlet bar = \"Hello\"; // bar is a `string`\nfoo =\
    \ bar; // Error: cannot assign `string` to a `number`\n```\n\nThis is an example\
    \ of types flowing from right to left.\n\n### Return\n\nThe return type is inferred\
    \ by the return statements e.g. the following function is inferred to return a\
    \ number .\n\n```typescript\nfunction add(a: number, b: number) {\n  return a\
    \ + b;\n}\n```\n\nThis is an example of types flowing bottom out.\n\n### Assignment\n\
    \nThe type of the function parameters / return can also be inferred by assignment\
    \ e.g. here we say that foo is an Adder, that makes the type of a and b to infer\
    \ as number .\n\n```typescript\ntype Adder = (a: number, b: number) => number;\n\
    let foo: Adder = (a, b) => a + b;\n```\n\nThis fact can be demonstrated by the\
    \ below code which raises an error as you would hope:\n\n```typescript\ntype Adder\
    \ = (a: number, b: number) => number;\nlet foo: Adder = (a, b) => {\n  a = \"\
    hello\"; // Error: cannot assign `string` to a `number`\n  return a + b;\n}\n\
    ```\n\nThis is an example of types flowing from left to right.\n\nThe same *assignment*\
    \ style type inference works if you create a function for a callback argument.\
    \ After all an argument -> parameter is just another form of variable assignment.\n\
    \n```typescript\ntype Adder = (a: number, b: number) => number;\nfunction iTakeAnAdder(adder:\
    \ Adder) {\n  return adder(1, 2);\n}\n\niTakeAnAdder((a, b) => {\n  // a = \"\
    hello\"; // Would Error: cannot assign `string` to a `number`\n  return a + b;\n\
    })\n```\n\n### Structuring\n\nThese simple rules also work in the presence of\
    \ structuring (object literal). For example in the following case the type of\
    \ foo is inferred to be {a:number, b:number}:\n\n```typescript\nlet foo = {\n\
    \  a: 123,\n  b: 456\n};\nfoo.a = \"hello\"; // Would Error: cannot assign `string`\
    \ to a `number`\n```\n\nSimilarly for arrays:\n\n```typescript\nconst bar = [1,\
    \ 2, 3];\nbar[0] = \"hello\"; // Would error: cannot assign `string` to a `number`\n\
    ```\n\nAnd of course nesting:\n\n```typescript\nlet foo = {\n  a: [1, 2, 4]\n\
    };\nfoo.a[0] = 'hello'; // Would error: cannot assign `string` to `number`\n```\n\
    \n### Destructuring\n\nAnd of course, they also work with destructuring, both\
    \ objects:\n\n```typescript\nlet foo = {\n  a: 123,\n  b: 456\n};\nlet {a} = foo;\n\
    a = \"hello\"; // Would Error: cannot assign `string` to a `number`\n```\n\nand\
    \ arrays:\n\n```typescript\nconst bar = [1, 2];\nlet [a, b] = bar;\na = \"hello\"\
    ; // Would Error: cannot assign `string` to a `number`\n```\n\nAnd if the function\
    \ parameter can be inferred, so can its destructured properties.\n\n```typescript\n\
    type Adder = (numbers: { a: number, b: number }) => number;\nfunction iTakeAnAdder(adder:\
    \ Adder) {\n  return adder({ a: 1, b: 2 });\n}\niTakeAnAdder(({a, b}) => { //\
    \ Types of `a` and `b` are inferred\n  return a + b;\n})\n```\n\n### Type Guards\n\
    \nWe have already seen how Type Guards help change and narrow down types (particularly\
    \ in the case of unions). Type guards are just another form of type inference\
    \ for a variable block.\n\n### Be careful around parameters\n\nTypes do not flow\
    \ into function parameters if it cannot be inferred from an assignment. e.g. in\
    \ the following case the compiler does not know the type of foo so it cannot infer\
    \ the type of a or b\n\n```typescript\nconst foo = (a,b) => { /* something */\
    \ };\n```\n\nHowever if foo was typed the function parameters type can be inferred\
    \ (a, b are both inferred to be number below).\n\n```typescript\ntype TwoNumberFunction\
    \ = (a: number, b: number) => void;\nconst foo: TwoNumberFunction = (a, b) =>\
    \ { /* something */ };\n```\n\n### Be careful around return\n\nAlthough TypeScript\
    \ can generally infer the return type of a function, it might not be what you\
    \ expect. e.g. here foo has a return type of any\n\n```typescript\nfunction foo(a:\
    \ number, b: number) {\n  return addOne(b);\n}\n// Some external function in a\
    \ library someone wrote\nfunction addOne(a) {\n  return a + 1;\n}\n```\n\nThis\
    \ is because the return type is impacted by the poor type definition for addOne\
    \ (a is any so the return of addOne is any so the return of foo is any). I find\
    \ it simplest to always be explicit about function returns. After all these annotations\
    \ are a theorem and the function body is the proof. There are other cases that\
    \ one can imagine, but the good news is that there is a compiler flag that can\
    \ help such bugs.\n\n### noImplicitAny\n\nThere is a boolean compiler flag noImplicitAny\
    \ where the compiler will actually raise an error if it cannot infer the type\
    \ of a variable (and therefore can only have it as an *implicit* any type). You\
    \ can then either say that *yes I want it to be an any* by *explicitly* adding\
    \ an any type annotation help the compiler out by adding a few more *correct*\
    \ annotations.\n\n## Type Compatibility\n\nType Compatibility (as we discuss here)\
    \ determines if one thing can be assigned to another. E.g. string and number are\
    \ not compatible:\n\n```typescript\nlet str: string = \"Hello\";\nlet num: number\
    \ = 123;\nstr = num; // ERROR: `number` is not assignable to `string`\nnum = str;\
    \ // ERROR: `string` is not assignable to `number`\n```\n\n## Soundness\n\nTypeScript's\
    \ type system is designed to be convenient and allows for *unsound* behaviours\
    \ e.g. anything can be assigned to any which essentially means you telling the\
    \ compiler to allow you to do whatever you want:\n\n```typescript\nlet foo: any\
    \ = 123;\nfoo = \"Hello\";\n// Later\nfoo.toPrecision(3); // Allowed as you typed\
    \ it as `any`\n```\n\n## Structural\n\nTypeScript objects are structurally typed.\
    \ This means the *names* don't matter as long as the structures match\n\n```typescript\n\
    interface Point {\n  x: number,\n  y: number\n}\n\nclass Point2D {\n  constructor(public\
    \ x:number, public y:number){}\n}\n\nlet p: Point;\n// OK, because of structural\
    \ typing\np = new Point2D(1,2);\n```\n\nThis allows you to create objects on the\
    \ fly (like you do in vanilla JS) and still have safety for whenever it can be\
    \ inferred. Also *more* data is considered fine:\n\n```typescript\ninterface Point2D\
    \ {\n  x: number;\n  y: number;\n}\ninterface Point3D {\n  x: number;\n  y: number;\n\
    \  z: number;\n}\n\nvar point2D: Point2D = { x: 0, y: 10 }\nvar point3D: Point3D\
    \ = { x: 0, y: 10, z: 20 }\n\nfunction iTakePoint2D(point: Point2D) { /* something\
    \ */ }\niTakePoint2D(point2D); // exact match okay\niTakePoint2D(point3D); //\
    \ extra information okay\niTakePoint2D({ x: 0 }); // Error: missing information\
    \ `y`\n```\n\n## Variance\n\nVariance is an easy to understand and important concept\
    \ for type compatibility analysis. For simple types Base and Child, if Child is\
    \ a child of Base, then instances of Child can be assigned to a variable to type\
    \ Base . This is polymorphism 101.\n"
