  - "[PAGE 9]\n\n**Why TypeScript**\n\nThere are two main goals of TypeScript:\n\n\
    Provide an *optional type system* for JavaScript.\n\nProvide planned features\
    \ from future JavaScript editions to current JavaScript engines\n\nThe desire\
    \ for these goals is motivated below.\n\n**The TypeScript type system**\n\nYou\
    \ might be wondering \"**Why add types to JavaScript?**\"\n\nTypes have proven\
    \ ability to enhance code quality and understandability. Large teams\n\n(google,microsoft,facebook)\
    \ have continually arrived at this conclusion. Specifically:\n\nTypes increase\
    \ your agility when doing refactoring. *It's better for the compiler to catch*\n\
    \n*errors than to have things fail at runtime*.\n\nTypes are one of the best forms\
    \ of documentation you can have. *The function signature*\n\n*is a theorem and\
    \ the function body is the proof*.\n\nHowever types have a way of being unnecessarily\
    \ ceremonious. TypeScript is very\n\nparticular about keeping the barrier to entry\
    \ as low as possible. Here's how:\n\n**Your JavaScript is TypeScript**\n\nTypeScript\
    \ provides compile time type safety for your JavaScript code. This is no surprise\n\
    \ngiven its name. The great thing is that the types are completely optional. Your\
    \ JavaScript\n\ncode  .js  file can be renamed to a  .ts  file and TypeScript\
    \ will still give you back valid\n\n .js  equivalent to the original JavaScript\
    \ file. TypeScript is *intentionally* and strictly a\n\nsuperset of JavaScript\
    \ with optional Type checking.\n\n**Types can be Implicit**\n\nTypeScript will\
    \ try to infer as much of the type information as it can in order to give you\
    \ type\n\nsafety with minimal cost of productivity during code development. For\
    \ example, in the\n\nfollowing example TypeScript will know that foo is of type\
    \  number  below and will give an\n\nerror on the second line as shown:\n\nWhy\
    \ TypeScript\n\n10"
- md: "\nvar foo = 123;\n\nfoo = '456'; // Error: cannot assign `string` to `number`\n\
    \n// Is foo a number or a string?\n\nThis type inference is well motivated. If\
    \ you do stuff like shown in this example, then, in the\nrest of your code, you\
    \ cannot be certain that  foo  is a  number  or a  string . Such issues\nturn\
    \ up often in large multi-file code bases. We will deep dive into the type inference\
    \ rules\nlater.\n\n## Types can be Explicit\n\nAs we've mentioned before, TypeScript\
    \ will infer as much as it can safely, however you can\nuse annotations to:\n\n\
    1. Help along the compiler, and more importantly document stuff for the next developer\n\
    who has to read your code (that might be future you!).\n\n2. Enforce that what\
    \ the compiler sees, is what you thought it should see. That is your\nunderstanding\
    \ of the code matches an algorithmic analysis of the code (done by the\ncompiler).\n\
    \nTypeScript uses postfix type annotations popular in other *optionally* annotated\
    \ languages \n(e.g. ActionScript and F#).\n\n```typescript\nvar foo: number =\
    \ 123;\n```\n\nSo if you do something wrong the compiler will error e.g.:\n\n\
    ```typescript\nvar foo: number = '123'; // Error: cannot assign a `string` to\
    \ a `number`\n```\n\nWe will discuss all the details of all the annotation syntax\
    \ supported by TypeScript in a later\nchapter.\n\n## Types are structural\n\n\
    In some languages (specifically nominally typed ones) static typing results in\
    \ unnecessary\nceremony because even though *you know* that the code will work\
    \ fine the language\nsemantics force you to copy stuff around. This is why stuff\
    \ like automapper for C# is *vital* for\nC#. In TypeScript because we really want\
    \ it to be easy for JavaScript developers with a\nminimum cognitive overload,\
    \ types are *structural*. This means that *duck typing* is a first class\nlanguage\
    \ construct. Consider the following example. The function `iTakePoint2D` will\
    \ accept\nanything that contains all the things ( x  and  y ) it expects:\n\n\
    ```typescript\ninterface Point2D {\n  x: number;\n  y: number;\n}\n\ninterface\
    \ Point3D {\n  x: number;\n  y: number;\n  z: number;\n}\n\nvar point2D: Point2D\
    \ = { x: 0, y: 10 }\nvar point3D: Point3D = { x: 0, y: 10, z: 20 }\n\nfunction\
    \ iTakePoint2D(point: Point2D) { /* do something */ }\n\niTakePoint2D(point2D);\
    \ // exact match okay\niTakePoint2D(point3D); // extra information okay\niTakePoint2D({\
    \ x: 0 }); // Error: missing information `y`\n```\n\n## Type errors do not prevent\
    \ JavaScript emit\n\nTo make it easy for you to migrate your JavaScript code to\
    \ TypeScript, even if there are\ncompilation errors, by default TypeScript *will\
    \ emit valid JavaScript* the best that it can. e.g.\n\n```javascript\nvar foo\
    \ = 123;\nfoo = '456'; // Error: cannot assign a `string` to a `number`\n```\n\
    \nwill emit the following js:\n\n```javascript\nvar foo = 123;\nfoo = '456';\n\
    ```\n\nSo you can incrementally upgrade your JavaScript code to TypeScript. This\
    \ is very different\nfrom how many other language compilers work and yet another\
    \ reason to move to\nTypeScript.\n\n## Types can be ambient\n\nA major design\
    \ goal of TypeScript was to make it possible for you to safely and easily use\n\
    existing JavaScript libraries in TypeScript. TypeScript does this by means of\
    \ *declaration*.\nTypeScript provides you with a sliding scale of how much or\
    \ how little effort you want to put\nin your declarations, the more effort you\
    \ put the more type safety + code intelligence you\nget. Note that definitions\
    \ for most of the popular JavaScript libraries have already been\nwritten for\
    \ you by the DefinitelyTyped community so for most purposes either:\n\n1. The\
    \ definition file already exists.\n2. Or at the very least, you have a vast list\
    \ of well reviewed TypeScript declaration\ntemplates already available\n\nAs a\
    \ quick example of how you would author your own declaration file, consider a\
    \ trivial\nexample of jquery. By default (as is to be expected of good JS code)\
    \ TypeScript expects\nyou to declare (i.e. use `var`  somewhere) before you use\
    \ a variable\n\n```javascript\n$('.awesome').show(); // Error: cannot find name\
    \ `$`\n```\n\nAs a quick fix *you can tell TypeScript* that there is indeed something\
    \ called  $ :\n\n```typescript\ndeclare var $:any;\n\n$('.awesome').show(); //\
    \ Okay!\n```\n\nIf you want you can build on this basic definition and provide\
    \ more information to help\nprotect you from errors:\n\n```typescript\ndeclare\
    \ var $:{\n  (selector:string): any;\n};\n\n$('.awesome').show(); // Okay!\n$(123).show();\
    \ // Error: selector needs to be a string\n```\n\nWe will discuss the details\
    \ of creating TypeScript definitions for existing JavaScript in detail\nlater\
    \ once you know more about TypeScript (e.g. stuff like `interface` and the `any`).\n\
    \n## Future JavaScript => Now\n\nTypeScript provides a number of features that\
    \ are planned in ES6 for current JavaScript\nengines (that only support ES5 etc).\
    \ The typescript team is actively adding these features\nand this list is only\
    \ going to get bigger over time and we will cover this in its own section. But\n\
    just as a specimen here is an example of a class:\n\n```typescript\nclass Point\
    \ {\n  constructor(public x: number, public y: number) {\n  }\n  add(point: Point)\
    \ {\n    this.x += point.x;\n    this.y += point.y;\n  }\n}\n```\n\n## Summary\n\
    \nIn this section we have provided the motivation and design goals of TypeScript.\
    \ We will\nup to now. We will deep dive into the type inference rules\nlater.\n"
  mdcn: "\n\nvar foo = 123;\n\nfoo = '456'; // Error: cannot assign `string` to `number`\n\
    \n// foo 是数字还是字符串？\n\n这种类型推断是有充分理据的。如果你像示例中那样进行操作，那么在代码的其余部分中，你无法确定 `foo` 是一个\
    \ `number` 还是一个 `string`。这类问题在大型多文件代码库中经常出现。稍后我们将深入探讨类型推断规则。\n\n## 类型可以是显式的\n\n\
    正如我们之前提到的，TypeScript 会尽可能安全地进行推断，但你可以\n使用注解来：\n\n1. 帮助编译器，更重要的是为必须阅读你代码的下一个开发者（那可能是未来的你！）提供文档支持。\n\
    \n2. 强制让编译器看到的正是你认为它应该看到的。也就是说，你对代码的理解与对代码的算法分析（由编译器完成）是一致的。\n\nTypeScript 使用了后缀类型注解，这在其他*可选*注解的语言中很流行\n\
    （例如 ActionScript 和 F#）。\n\n```typescript\nvar foo: number = 123;\n```\n\n所以，如果你做了错误的操作，编译器将会报错，例如：\n\
    \n```typescript\nvar foo: number = '123'; // Error: cannot assign a `string` to\
    \ a `number`\n```\n\n我们将在后面的章节中详细讨论 TypeScript 支持的所有注解语法的细节。\n\n## 类型是结构化的\n\n\
    在某些语言中（特别是命名类型类型的语言）中，静态类型会导致不必要的仪式，因为尽管*你知道*代码会运行良好，但语言语义仍迫使你到处复制内容。这就是为什么像 C#\
    \ 的 automapper 工具对 C# 来说*至关重要*。在 TypeScript 中，因为我们真的想让 JavaScript 开发者能够以最小的认知负担轻松使用，类型是*结构化的*。这意味着*鸭子类型*（duck\
    \ typing）是一种一等语言构造。考虑以下示例。函数 `iTakePoint2D` 将接受任何包含它预期所有内容（x 和 y）的对象：\n\n```typescript\n\
    interface Point2D {\n  x: number;\n  y: number;\n}\n\ninterface Point3D {\n  x:\
    \ number;\n  y: number;\n  z: number;\n}\n\nvar point2D: Point2D = { x: 0, y:\
    \ 10 }\nvar point3D: Point3D = { x: 0, y: 10, z: 20 }\n\nfunction iTakePoint2D(point:\
    \ Point2D) { /* do something */ }\n\niTakePoint2D(point2D); // 精确匹配允许\niTakePoint2D(point3D);\
    \ // 额外信息允许\niTakePoint2D({ x: 0 }); // Error: missing information `y`\n```\n\n\
    ## 类型错误不会阻止 JavaScript 的输出\n\n为了方便你将 JavaScript 代码迁移到 TypeScript，即使存在编译错误，TypeScript\
    \ 默认情况下*也会尽可能地输出有效的 JavaScript*。例如：\n\n```javascript\nvar foo = 123;\nfoo = '456';\
    \ // Error: cannot assign a `string` to a `number`\n```\n\n将输出以下 js：\n\n```javascript\n\
    var foo = 123;\nfoo = '456';\n```\n\n因此你可以渐进式地将 JavaScript 代码升级到 TypeScript。这与许多其他语言编译器的工作方式非常不同，这也是迁移到\
    \ TypeScript 的另一个原因。\n\n## 类型可以是环境的\n\nTypeScript 的一个主要设计目标是让你能够安全、方便地在 TypeScript\
    \ 中使用现有 JavaScript 库。TypeScript 通过*声明*（declaration）来实现这一点。TypeScript 为你提供了一个滑动比例，让你决定在声明中投入多少精力，你投入的精力越多，获得的类型安全\
    \ + 代码智能性就越高。请注意，大多数流行的 JavaScript 库的定义已经由 DefinitelyTyped 社区为你写好了，因此对于大多数用途：\n\
    \n1. 定义文件已经存在。\n2. 或者至少，你有一系列大量经过审核的 TypeScript 声明模板可用。\n\n作为一个关于你如何编写自己的声明文件的快速示例，考虑一个简单的\
    \ jquery 例子。默认情况下（正如良好的 JS 代码所预期的），TypeScript 期望你在使用变量之前对其声明（即在某处使用 `var`）：\n\n\
    ```javascript\n$('.awesome').show(); // Error: cannot find name `$`\n```\n\n作为一个快速修复，*你可以告诉\
    \ TypeScript* 确实存在一个名为 `$` 的东西：\n\n```typescript\ndeclare var $:any;\n\n$('.awesome').show();\
    \ // Okay!\n```\n\n如果你愿意，可以在此基础定义的基础上进行构建，并提供更多信息来防止错误：\n\n```typescript\ndeclare\
    \ var $:{\n  (selector:string): any;\n};\n\n$('.awesome').show(); // Okay!\n$(123).show();\
    \ // Error: selector needs to be a string\n```\n\n在你了解更多 TypeScript（例如关于 `interface`\
    \ 和 `any` 等内容）之后，我们将稍后详细讨论为现有 JavaScript 创建 TypeScript 定义。\n\n## 未来 JavaScript\
    \ => 现在\n\nTypeScript 提供了许多在 ES6 中计划用于当前 JavaScript 引擎（仅支持 ES5 等）的功能。TypeScript\
    \ 团队正在积极添加这些功能，这个列表会随着时间的推移变得越来越，我们将在专门的章节中涵盖这一点。但在这里可以作为一个类的类的示例：\n\n```typescript\n\
    class Point {\n  constructor(public x: number, public y: number) {\n  }\n  add(point:\
    \ Point) {\n    this.x += point.x;\n    this.y += point.y;\n  }\n}\n```\n\n##\
    \ 总结\n\n在本节中，我们提供了 TypeScript 的动机和设计目标。到目前为止。\n\n"
