  - "[PAGE 102]\n\n**Dynamic import expressions**\n\n**Dynamic import expressions**\
    \ are a new feature and part of **ECMAScript** that allows users\n\nto asynchronously\
    \ request a module at any arbitrary point in your program. **TC39** JavaScript\n\
    \ncommittee has it’s own proposal which is in stage 3, and it’s called import()\
    \ proposal for\n\nJavaScript.\n\nFrom other side, **webpack** bundler has a feature\
    \ called **Code Splitting** which allows you to\n\nsplit your bundle into chunks\
    \ which can be downloaded asynchronously at a later time. For\n\ninstance, this\
    \ allows to serve a minimal bootstrap bundle first and to asynchronously load\n\
    \nadditional features later.\n\nAt first glance, it’s natural to think (if we\
    \ are using webpack in our dev workflow) that by\n\nusing TypeScript 2.4 dynamic\
    \ import expressions, will **automatically produce** bundle\n\nchunks and automatically\
    \ code-split you JS final bundle. BUT, that is not as easy as it\n\nseems, because\
    \ it depends on the **tsconfig.json configuration** we are working with.\n\nThe\
    \ thing is that webpack code splitting supports two similar techniques to achieve\
    \ this goal:\n\nusing **import()** (preferred, ECMAScript proposal) and **require.ensure()**\
    \ (legacy, webpack\n\nspecific). And what that means is the expected TypeScript\
    \ output is **leave the import()**\n\n**statement as it is** instead of transpile\
    \ it to anything else.\n\nLet’s see and example to figure out how to configure\
    \ webpack + TypeScript 2.4.\n\nIn the following code I want to **lazy load the\
    \ library moment** but I am interested on code\n\nsplitting as well, which means,\
    \ having moment library in a separate chunk of JS (javascript\n\nfile) and that\
    \ will be loaded only when required.\n\nimport(/\\* webpackChunkName: \"momentjs\"\
    \ \\*/ \"moment\")\n\n .then((moment) => {\n\n // lazyModule has all of the proper\
    \ types, autocomplete works,\n\n // type checking works, code references work\
    \ \\\\o/\n\n const time = moment().format();\n\n console.log(\"TypeScript >= 2.4.0\
    \ Dynamic Import Expression:\");\n\n console.log(time);\n\n })\n\n .catch((err)\
    \ => {\n\n console.log(\"Failed to load moment\", err);\n\n });\n\nHere is the\
    \ tsconfig.json:\n\nDynamic Import Expressions\n\n103"
