  - "[PAGE 85]\n\n**Compilation Context**\n\nThe compilation context is basically\
    \ just a fancy term for grouping of the files that TypeScript\n\nwill parse and\
    \ analyze to determine what is valid and what isn't. Along with the information\n\
    \nabout which files, the compilation context contains information about *which\
    \ compiler options*.\n\nA great way to define this logical grouping (we also like\
    \ to use the term *project*) is using a\n\n tsconfig.json  file.\n\nCompilation\
    \ Context\n\n86"
  - "[PAGE 86]\n\n**Basic**\n\nIt is extremely easy to get started with tsconfig.json\
    \ as the basic file you need is:\n\n{}\n\ni.e. an empty JSON file at the *root*\
    \ of your project. This way TypeScript will include *all* the\n\n .ts  files in\
    \ this directory (and sub directories) as a part of the compilation context. It\
    \ will\n\nalso select a few sane default compiler options.\n\n**compilerOptions**\n\
    \nYou can customize the compiler options using  compilerOptions :\n\n{\n\n \"\
    compilerOptions\": {\n\n /\\* Basic Options \\*/ \n\n \"target\": \"es5\", /\\\
    * Specify ECMAScript target version: 'ES3'\n\n (default), 'ES5', 'ES2015', 'ES2016',\
    \ 'ES2017', or 'ESNEXT'. \\*/\n\n \"module\": \"commonjs\", /\\* Specify module\
    \ code generation: 'commonj\n\ns', 'amd', 'system', 'umd' or 'es2015'. \\*/\n\n\
    \ \"lib\": \\[\\], /\\* Specify library files to be included in \n\nthe compilation:\
    \ \\*/\n\n \"allowJs\": true, /\\* Allow javascript files to be compiled. \\*/\n\
    \n \"checkJs\": true, /\\* Report errors in .js files. \\*/\n\n \"jsx\": \"preserve\"\
    , /\\* Specify JSX code generation: 'preserve',\n\n 'react-native', or 'react'.\
    \ \\*/\n\n \"declaration\": true, /\\* Generates corresponding '.d.ts' file. \\\
    */\n\n \"sourceMap\": true, /\\* Generates corresponding '.map' file. \\*/\n\n\
    \ \"outFile\": \"./\", /\\* Concatenate and emit output to single fi\n\nle. \\\
    */\n\n \"outDir\": \"./\", /\\* Redirect output structure to the directo\n\nry.\
    \ \\*/\n\n \"rootDir\": \"./\", /\\* Specify the root directory of input file\n\
    \ns. Use to control the output directory structure with --outDir. \\*/\n\n \"\
    removeComments\": true, /\\* Do not emit comments to output. \\*/\n\n \"noEmit\"\
    : true, /\\* Do not emit outputs. \\*/\n\n \"importHelpers\": true, /\\* Import\
