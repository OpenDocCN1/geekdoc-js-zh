  - "[PAGE 221]\n\n**Nominal Typing**\n\nThe TypeScript type system is structural\
    \ and this is one of the main motivating benefits.\n\nHowever, there are real-world\
    \ use cases for a system where you want two variables to be\n\ndifferentiated\
    \ because they have a different *type name* even if they have the same structure.\n\
    \nA very common use case is *identity* structures (which are generally just strings\
    \ with\n\nsemantics associated with their *name* in languages like C#/Java).\n\
    \nThere are a few patterns that have emerged in the community. I cover them in\
    \ decreasing\n\norder of personal preference:\n\n**Using literal types**\n\nThis\
    \ pattern uses generics and literal types:\n\n/\\*\\* Generic Id type \\*/\n\n\
    type Id<T extends string\\> = {\n\n type: T,\n\n value: string,\n\n}\n\n/\\*\\\
    * Specific Id types \\*/\n\ntype FooId = Id<'foo'\\>;\n\ntype BarId = Id<'bar'\\\
    >;\n\n/\\*\\* Optional: contructors functions \\*/\n\nconst createFoo = (value:\
    \ string): FooId => ({ type: 'foo', value });\n\nconst createBar = (value: string):\
    \ BarId => ({ type: 'bar', value });\n\nlet foo = createFoo('sample')\n\nlet bar\
    \ = createBar('sample');\n\nfoo = bar; // Error\n\nfoo = foo; // Okay\n\nAdvantages\n\
    \nNo need for any type assertions\n\nDisadvantage\n\nThe structure  {type,value}\
    \  might not be desireable and need server serialization\n\nsupport\n\n**Using\
    \ Enums**\n\nNominal Typing\n\n222"
- md: "\nEnums in TypeScript offer a certain level of nominal typing. Two enum types\
    \ aren't equal if they differ by name. We can use this fact to provide nominal\
    \ typing for types that are otherwise structurally compatible.\n\nThe workaround\
    \ involves:\n\n- Creating a *brand* enum.\n- Creating the type as an *intersection*\
    \ ( & ) of the brand enum + the actual structure.\n\nThis is demonstrated below\
    \ where the structure of the types is just a string:\n\n```typescript\n// FOO\n\
    enum FooIdBrand {}\n\ntype FooId = FooIdBrand & string;\n\n// BAR\n\nenum BarIdBrand\
    \ {}\n\ntype BarId = BarIdBrand & string;\n\n/**\n * Usage Demo\n */\nvar fooId:\
    \ FooId;\nvar barId: BarId;\n\n// Safety!\nfooId = barId; // error\nbarId = fooId;\
    \ // error\n\n// Newing up\nfooId = 'foo' as FooId;\nbarId = 'bar' as BarId;\n\
    \n// Both types are compatible with the base\nvar str: string;\nstr = fooId;\n\
    str = barId;\n```\n\n## Using Interfaces\n\nBecause numbers are type compatible\
    \ with enums the previous technique cannot be used for them. Instead we can use\
    \ interfaces to break the structural compatibility. This method is still used\
    \ by the TypeScript compiler team, so worth mentioning. Using \\_ prefix and a\
    \ Brand suffix is a convention I strongly recommend (and the one followed by the\
    \ TypeScript team).\n\nThe workaround involves the following:\n\n- adding an unused\
    \ property on a type to break structural compatibility.\n- using a type assertion\
    \ when needing to new up or cast down.\n\nThis is demonstrated below:\n\n```typescript\n\
    // FOO\ninterface FooId extends String {\n  _fooIdBrand: string; // To prevent\
    \ type errors\n}\n\n// BAR\ninterface BarId extends String {\n  _barIdBrand: string;\
    \ // To prevent type errors\n}\n\n/**\n * Usage Demo\n */\nvar fooId: FooId;\n\
    var barId: BarId;\n\n// Safety!\nfooId = barId; // error\nbarId = fooId; // error\n\
    fooId = <FooId>barId; // error\nbarId = <BarId>fooId; // error\n\n// Newing up\n\
    fooId = 'foo' as any;\nbarId = 'bar' as any;\n\n// If you need the base string\n\
    var str: string;\nstr = fooId as any;\nstr = barId as any;\n```\n\n## Stateful\
    \ Functions\n\nA common feature in other programming languages is usage of the\
    \ static keyword to increase the *lifetime* (not *scope*) of a function variable\
    \ to live beyond function invocations. Here is a C sample that achieves this:\n\
    \n```c\nvoid called() {\n  static count = 0;\n  count++;\n  printf(\"Called :\
    \ %d\", count);\n}\n\nint main () {\n  called(); // Called : 1\n  called(); //\
    \ Called : 2\n  return 0;\n}\n```\n\nSince JavaScript (or TypeScript) doesn't\
    \ have function statics you can achieve the same thing using various abstractions\
    \ that wrap over a local variable e.g. using a class :\n\n```javascript\nconst\
    \ {called} = new class {\n  count = 0;\n  called = () => {\n    this.count++;\n\
    \    console.log(`Called : ${this.count}`);\n  }\n};\n\ncalled(); // Called :\
    \ 1\ncalled(); // Called : 2\n```\n\nC++ developers also try and achieve this\
    \ using a pattern they call functor (a class that overrides the operator () ).\n\
    \n## Bind is Harmful\n\nThis is the definition of bind in lib.d.ts :\n\n`bind(thisArg:\
    \ any, ...argArray: any[]): any;`\n\nAs you can see it returns **any**! That means\
    \ that calling bind on a function will cause you to completely lose any type safety\
    \ of the original function signature.\n\nFor example the following compiles:\n\
    \n```typescript\nfunction twoParams(a:number,b:number) {\n  return a + b;\n}\n\
    \nlet curryOne = twoParams.bind(null,123);\ncurryOne(456); // Okay but is not\
    \ type checked!\ncurryOne('456'); // Allowed because it wasn't type checked!\n\
    ```\n\nA better way to write it would be with a simple arrow function with an\
    \ explicit type annotation:\n\n```typescript\nfunction twoParams(a:number,b:number)\
    \ {\n  return a + b;\n}\n\nlet curryOne = (x:number)=>twoParams(123,x);\ncurryOne(456);\
    \ // Okay and type checked!\ncurryOne('456'); // Error!\n```\n\nBut if you expect\
    \ a curried function there is a better pattern for that.\n\n## Class Members\n\
    \nAnother common use is to use bind to ensure the correct value of this when passing\
    \ around class functions. Don't do that! The following demonstrates the fact that\
    \ you lose parameter type safety if you use bind :\n\n### Bind is Bad\n\n```typescript\n\
    class Adder {\n  constructor(public a: string) { }\n  add(b: string): string {\n\
    \    return this.a + b;\n  }\n}\n\nfunction useAdd(add: (x: number) => number)\
    \ {\n  return add(456);\n}\n\nlet adder = new Adder('mary had a little ');\nuseAdd(adder.add.bind(adder));\
    \ // No compile error!\n```\n\nWait, let's re-examine the OCR. The text seems\
