    提示：箭头函数的需求\n提示：箭头函数的危险性\n提示：使用此特性的库\n提示：箭头函数的继承\n\n**箭头函数**\n\n它们被亲切地称为*粗箭头*（因为\
    \ `->` 是细箭头，而 `=>` 是粗箭头），也被称为 *lambda 函数*（受其他语言影响）。JavaScript 中另一个常用的特性是粗箭头函数\
    \ `()=>something`。使用*粗箭头*的初衷是：\n\n1. 你不需要不断输入 `function`\n2. 它在词法上捕获了 `this` 的含义\n\
    3. 它在词法上捕获了 `arguments` 的含义\n\n对于一个自称是函数式的语言来说，在 JavaScript 中你往往需要写大量的 `function`。粗箭头让你轻松地创建一个函数：\n\
    \n`var inc = (x)=>x+1;`\n\n这在传统上一直是 JavaScript 的一个痛点。正如一位智者所说：“我讨厌 JavaScript，因为它太容易丢失\
    \ `this` 的含义了”。箭头函数通过从周围环境中捕获 `this` 的含义解决了这个问题。考虑这个纯 JavaScript 类：\n\n```javascript\n\
    function Person(age) {\n  this.age = age;\n  this.growOld = function() {\n   \
    \ this.age++;\n  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld,\
    \ 1000);\nsetTimeout(function() { console.log(person.age); }, 2000);\n```\n\n\
    如果你在浏览器中运行这段代码，函数内部的 `this` 将指向 `window`，因为执行它的是 `window`。修复方法是使用箭头：\n\n```javascript\n\
    function Person(age) {\n  this.age = age;\n  this.growOld = () => {\n    this.age++;\n\
    \  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld, 1000);\nsetTimeout(function()\
    \ { console.log(person.age); }, 2000);\n```\n\n这种之所以有效，是因为 `this` 的引用是被箭头函数从函数体中捕获的。这等同于以下\
    \ JavaScript（如果你没有箭头函数，你得这样写）：\n\n```javascript\nfunction Person(age) {\n  this.age\
    \ = age;\n  var _this = this; // 捕获 this\n  this.growOld = function() {\n    _this.age++;\n\
    \  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld, 1000);\nsetTimeout(function()\
    \ { console.log(person.age); }, 2000);\n```\n\n注意，由于你在使用 TypeScript，语法可以更加优雅，将箭头与类结合：\n\
    \n```typescript\nclass Person {\n  constructor(public age: number) {}\n  growOld\
    \ = () => {\n    this.age++;\n  }\n}\n\nvar person = new Person(1);\nsetTimeout(person.growOld,\
    \ 1000);\nsetTimeout(function() { console.log(person.age); }, 2000);\n```\n\n\
    **提示：箭头函数的需求**\n\n除了简洁的语法外，只有当你打算把它交给别人调用时，你才*需要*使用粗箭头。如果你自己调用它，即 `this` 将是正确的调用上下文（在本例中\
    \ `var growOld = person.growOld;`），那么其他人调用 `growOld()` 时。\n\n**提示：箭头函数的危险性**\n\
    \n事实上，如果你希望 `this` 是调用上下文，你*不应该使用箭头函数*。jquery、underscore 等其他库所使用的回调函数就是此类情况。同样，如果你计划使用\
    \ `arguments`，你可能应该使用 `function` 而不是粗箭头。\n\n**提示：在使用了 `this` 的库中使用箭头函数**\n\n许多库都会这样做，例如\
    \ `.each` 会使用 `this` 向你传递它当前正在迭代的对象。在这种情况下，如果你既想访问 `this` 又想访问周围环境，只需在没有箭头函数的情况下使用一个如\
    \ `_self` 这样的临时变量：\n\n```javascript\nlet _self = this;\nsomething.each(function()\
    \ {\n  console.log(_self); // 词法作用域值\n  console.log(this); // 库传递的值\n});\n```\n\
    \n**提示：箭头函数与继承**\n\n如果你将实例方法作为箭头函数，那么它位于 `this` 上。此类函数无法参与对 `super` 的调用（`super`\
    \ 作用于原型）。你可以通过在子类中重写之前创建一个该方法的副本来轻松绕过它。\n\n```typescript\nclass Adder {\n  constructor(public\
    \ a: number) {}\n  add = (b: number): number => {\n    return this.a + b;\n  }\n\
    }\n\nclass ExtendedAdder extends Adder {\n  // 在创建自己的之前创建一个父方法的副本\n  private superAdd\
    \ = this.add;\n  add = (b: number): number => {\n    return this.superAdd(b);\n\
    \  }\n}\n```\n\n## 剩余参数\n\n剩余参数（最后一个参数用 `...argumentName` 表示）允许你快速接受多个参数。\n\n\
    ```javascript\nfunction example(first, ...allOthers) {\n  console.log(first);\n\
    \  console.log(allOthers);\n}\n\n```\n\n## let\n\n在 JavaScript 中，变量是*函数作用域的*。这与许多语言（C#、Java\
    \ 等）不同，后者的变量是*块作用域的*。如果你将*块作用域*的思维带入 JavaScript，你会预期以下代码输出 123，但实际上会输出 456：\n\n\
    ```javascript\nvar foo = 123;\nif (true) {\n  var foo = 456;\n}\nconsole.log(foo);\
    \ // 456\n```\n\n这是因为 `{}` 没有创建新的作用域。这就是为什么 TypeScript（以及 ES6）引入了 `let` 关键字，以便定义具有块作用域的变量。如果你使用\
    \ `let` 而不是 `var`，你将获得与外部定义的不同的独立元素。使用 `let` 的示例如下：\n\n```javascript\nlet foo\
    \ = 123;\nif (true) {\n  let foo = 456;\n}\nconsole.log(foo); // 123\n```\n\n\
    另一个 `let` 可以帮你避免错误的地方是循环：\n\n```javascript\nvar index = 0;\nvar array = [1, 2,\
    \ 3];\nfor (let index = 0; index < array.length; index++) {\n  console.log(array[index]);\n\
    }\nconsole.log(index); // 0\n```\n\n诚实地说，我们认为尽可能使用 `let` 更好，因为这减少了新开发者和多语言开发者的意外。\n\
    \n## 函数创建新的作用域\n\n既然我们提到了，我们想演示函数在 JavaScript 中会创建一个新的变量作用域。考虑以下：\n\n```javascript\n\
    var foo = 123;\nfunction test() {\n  var foo = 456;\n}\ntest();\nconsole.log(foo);\
    \ // 123\n```\n\n这符合你的预期。如果没有这一点，在 JavaScript 中编写代码将非常困难。\n"
