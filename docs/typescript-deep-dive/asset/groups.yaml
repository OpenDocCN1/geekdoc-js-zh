  - "[PAGE 150]\n\n**Callable**\n\nYou can annotate callables as a part of a type\
    \ or an interface as follows\n\ninterface ReturnString {\n\n (): string\n\n}\n\
    \nAn instance of such an interface would be a function that returns a string e.g.\n\
    \ndeclare const foo: ReturnString;\n\nconst bar = foo(); // bar is inferred as\
    \ a string\n\n**Obvious examples**\n\nOf course such a *callable* annotation can\
    \ also specify any arguments / optional arguments /\n\nrest arguments as needed.\
    \ e.g. here is a complex example:\n\ninterface Complex {\n\n (foo: string, bar?:\
    \ number, ...others: boolean\\[\\]): number;\n\n}\n\nThey can even specify overloads:\n\
    \ninterface Overloaded {\n\n (foo: string): string\n\n (foo: number): number\n\
    \n}\n\n// example implementation\n\nconst overloaded: Overloaded = (foo) => foo;\n\
    \n// example usage\n\nconst str = overloaded(''); // str is inferred string\n\n\
    const number = overloaded(123); // num is inferred number\n\nOfcourse like *all*\
    \ bodies of interfaces / types you can use these as variable type annotations\n\
    \ne.g.\n\nCallable\n\n151"
  - "[PAGE 151]\n\nconst overloaded: {\n\n (foo: string): string\n\n (foo: number):\
    \ number\n\n} = (foo) => foo;\n\n**Arrow Syntax**\n\nTo make it easy to specify\
    \ callable signatures TypeScript also allows simple arrow type\n\nannotations\
    \ e.g.\n\nconst simple: (foo: number) => string\n\n = (foo) => foo.toString();\n\
    \nOnly limitation of the arrow syntax: You can't specify overloads. For overloads\
    \ you must use\n\nthe full bodied  { (someArgs): someReturn }  syntax.\n\n**Newable**\n\
    \nNewable is just a special type of *callable* type annotation with the prefix\
    \  new . It simply\n\nmeans that you need to *invoke* with  new  e.g.\n\ninterface\
    \ CallMeWithNewToGetString {\n\n new(): string\n\n}\n\n// Usage \n\ndeclare const\
    \ Foo: CallMeWithNewToGetString;\n\nconst bar = new Foo(); // bar is inferred\
    \ to be of type string\n\nCallable\n\n152"
  - "[PAGE 152]\n\n**Type Assertion**\n\nTypeScript allows you to override its inferred\
    \ and analyzed view of types in any way you\n\nwant to. This is done by a mechanism\
    \ called \"type assertion\". TypeScript's type assertion is\n\npurely you telling\
    \ the compiler that you know about the types better than it does, and that it\n\
    \nshould not second guess you.\n\nA common use case for type assertion is when\
    \ you are porting over code from JavaScript to\n\nTypeScript. For example consider\
    \ the following pattern:\n\nvar foo = {};\n\nfoo.bar = 123; // Error: property\
    \ 'bar' does not exist on \\`{}\\`\n\nfoo.bas = 'hello'; // Error: property 'bas'\
    \ does not exist on \\`{}\\`\n\nHere the code errors because the *inferred* type\
    \ of  foo  is  {}  i.e. an object with zero\n\nproperties. Therefore you are not\
    \ allowed to add  bar  or  bas  to it. You can fix this simply\n\nby a type assertion\
    \  as Foo :\n\ninterface Foo {\n\n bar: number;\n\n bas: string;\n\n}\n\nvar foo\
    \ = {} as Foo;\n\nfoo.bar = 123;\n\nfoo.bas = 'hello';\n\n** as foo **** vs. ****\
    \ <foo> **\n\nOriginally the syntax that was added was  <foo> . This is demonstrated\
    \ below:\n\nvar foo: any;\n\nvar bar = <string\\> foo; // bar is now of type \"\
    string\"\n\nHowever there is an ambiguity in the language grammar when using \
    \ <foo>  style assertions\n\nin JSX:\n\nvar foo = <string>bar;\n\n</string>\n\n\
    Therefore it is now recommended that you just use  as foo  for consistency.\n\n\
    Type Assertion\n\n153"
  - "[PAGE 153]\n\n**Type Assertion vs. Casting**\n\nThe reason why it's not called\
    \ \"type casting\" is that *casting* generally implies some sort of\n\nruntime\
    \ support. However *type assertions* are purely a compile time construct and a\
    \ way for\n\nyou to provide hints to the compiler on how you want your code to\
    \ be analyzed.\n\n**Assertion considered harmful**\n\nIn many cases assertion\
    \ will allow you to easily migrate legacy code (and even copy paste\n\nother code\
    \ samples into your codebase), however you should be careful with your use of\n\
    \nassertions. Take our original code as a sample, the compiler will not protect\
    \ you from\n\nforgetting to *actually add the properties you promised*:\n\ninterface\
    \ Foo {\n\n bar: number;\n\n bas: string;\n\n}\n\nvar foo = {} as Foo;\n\n// ahhhh\
    \ .... forget something?\n\nAlso another common thought is using an assertion\
    \ as a means of providing *autocomplete*\n\ne.g.:\n\ninterface Foo {\n\n bar:\
    \ number;\n\n bas: string;\n\n}\n\nvar foo = <Foo>{\n\n // the compiler will provide\
    \ autocomplete for properties of Foo\n\n // But it is easy for the developer to\
    \ forget adding all the properties\n\n // Also this code is likely to break if\
    \ Foo gets refactored (e.g. a new property a\n\ndded)\n\n};\n\nbut the hazard\
    \ here is the same, if you forget a property the compiler will not complain. It\
    \ is\n\nbetter if you do the following:\n\ninterface Foo {\n\n bar: number;\n\n\
    \ bas: string;\n\n}\n\nvar foo:Foo = {\n\n // the compiler will provide autocomplete\
    \ for properties of Foo\n\n};\n\nType Assertion\n\n154"
  - "[PAGE 154]\n\nIn some cases you might need to create a temporary variable, but\
    \ at least you will not be\n\nmaking (possibly false) promises and instead relying\
    \ on the type inference to do the\n\nchecking for you.\n\n**Double assertion**\n\
    \nThe type assertion despite being a bit unsafe as we've shown, is not *completely\
    \ open*\n\n*season*. E.g. the following is a very valid use case (e.g. the user\
    \ thinks the event passed in\n\nwill be a more specific case of an event) and\
    \ the type assertion works as expected:\n\nfunction handler (event: Event) {\n\
    \n let mouseEvent = event as MouseEvent;\n\n}\n\nHowever the following is most\
    \ likely an error and TypeScript will complain as shown despite\n\nthe user's\
    \ type assertion:\n\nfunction handler(event: Event) {\n\n let element = event\
    \ as HTMLElement; // Error: Neither 'Event' not type 'HTMLElemen\n\nt' is assignable\
    \ to the other\n\n}\n\nIf you *still want that Type, you can use a double assertion*,\
    \ but first asserting to  any  which is\n\ncompatible with all types and therefore\
    \ the compiler no longer complains:\n\nfunction handler(event: Event) {\n\n let\
    \ element = event as any as HTMLElement; // Okay!\n\n}\n\n**How typescript determines\
    \ if a single assertion is not**\n\n**enough**\n\nBasically it allows the assertion\
    \ from type  S  to  T  succeed if either  S  is a subtype of  T \n\nor  T  is\
    \ a subtype of  S . This is to provide extra safety when doing type assertions\
    \ ...\n\ncompletely wild assertions can be very unsafe and you need to use  any\
    \  to be that unsafe.\n\nType Assertion\n\n155"
  - "[PAGE 155]\n\nFreshness\n\nAllowing extra properties\n\nUse Case: React\n\n**Freshness**\n\
    \nTypeScript provides a concept of **Freshness** (also called *strict object literal\
    \ checking*) to\n\nmake it easier to type check object literals that would otherwise\
    \ be structurally type\n\ncompatible.\n\nStructural typing is *extremely convenient*.\
    \ Consider the following piece of code. This allows\n\nyou to *very conveniently*\
    \ upgrade your JavaScript to TypeScript while still preserving a level\n\nof type\
    \ safety:\n\nfunction logName(something: { name: string }) {\n\n console.log(something.name);\n\
    \n}\n\nvar person = { name: 'matt', job: 'being awesome' };\n\nvar animal = {\
    \ name: 'cow', diet: 'vegan, but has milk of own species' };\n\nvar random = {\
    \ note: \\`I don't have a name property\\` };\n\nlogName(person); // okay\n\n\
    logName(animal); // okay\n\nlogName(random); // Error: property \\`name\\` is\
    \ missing\n\nHowever *structural* typing has a weakness in that it allows you\
    \ to misleadingly think that\n\nsomething accepts more data than it actually does.\
    \ This is demonstrated in the following\n\ncode which TypeScript will error on\
    \ as shown:\n\nfunction logName(something: { name: string }) {\n\n console.log(something.name);\n\
    \n}\n\nlogName({ name: 'matt' }); // okay\n\nlogName({ name: 'matt', job: 'being\
    \ awesome' }); // Error: object literals must only s\n\npecify known properties.\
    \ \\`job\\` is excessive here.\n\nNote that this error *only happens on object\
    \ literals*. Without this error one might look at the\n\ncall  logName({ name:\
    \ 'matt', job: 'being awesome' })  and think that *logName* would do\n\nsomething\
    \ useful with  job  where as in reality it will completely ignore it.\n\nAnother\
    \ big use case is with interfaces that have optional members, without such object\n\
    \nliteral checking, a typo would type check just fine. This is demonstrated below:\n\
    \nFreshness\n\n156"
  - "[PAGE 156]\n\nfunction logIfHasName(something: { name?: string }) {\n\n if (something.name)\
    \ {\n\n console.log(something.name);\n\n }\n\n}\n\nvar person = { name: 'matt',\
    \ job: 'being awesome' };\n\nvar animal = { name: 'cow', diet: 'vegan, but has\
    \ milk of own species' };\n\nlogIfHasName(person); // okay\n\nlogIfHasName(animal);\
    \ // okay\n\nlogIfHasName({neme: 'I just misspelled name to neme'}); // Error:\
    \ object literals must\n\n only specify known properties. \\`neme\\` is excessive\
    \ here.\n\nThe reason why only object literals are type checked this way is because\
    \ in this case\n\nadditional properties *that aren't actually used* is almost\
    \ always a typo or a misunderstanding\n\nof the API.\n\n**Allowing extra properties**\n\
    \nA type can include an index signature to explicitly indicate that excess properties\
    \ are\n\npermitted:\n\nvar x: { foo: number, \\[x: string\\]: any };\n\nx = {\
    \ foo: 1, baz: 2 }; // Ok, \\`baz\\` matched by index signature\n\n**Use Case:\
    \ React State**\n\nFacebook ReactJS offers a nice use case for object freshness.\
    \ Quite commonly in a\n\ncomponent you call  setState  with only a few properties\
    \ instead of passing in all the\n\nproperties, i.e.:\n\n// Assuming\n\ninterface\
    \ State {\n\n foo: string;\n\n bar: string;\n\n}\n\n// You want to do: \n\nthis.setState({foo:\
    \ \"Hello\"}); // Error: missing property bar\n\n// But because state contains\
    \ both \\`foo\\` and \\`bar\\` TypeScript would force you to do: \n\nthis.setState({foo:\
    \ \"Hello\", bar: this.state.bar}};\n\nFreshness\n\n157"
- md: "\nUsing the idea of freshness you would mark all the members as optional and\
    \ *you still get to* *catch typos*!:\n\n// Assuming\n\ninterface State {\n foo?:\
    \ string;\n bar?: string;\n}\n\n// You want to do: \n\nthis.setState({foo: \"\
    Hello\"}); // Yay works fine!\n\n// Because of freshness it's protected against\
    \ typos as well!\n\nthis.setState({foos: \"Hello\"}}; // Error: Objects may only\
    \ specify known properties\n\n// And still type checked\n\nthis.setState({foo:\
    \ 123}); // Error: Cannot assign number to a string\n\nFreshness\n\n158\n\n##\
    \ Type Guard\n\n### User Defined Type Guards\n\n**Type Guard**\n\nType Guards\
    \ allow you to narrow down the type of an object within a conditional block.\n\
    \n**typeof**\n\nTypeScript is aware of the usage of the JavaScript `instanceof`\
    \ and `typeof` operators. If you use these in a conditional block, TypeScript\
    \ will understand the type of the variable to be different within that conditional\
    \ block. Here is a quick example where TypeScript realizes that a particular function\
    \ does not exist on `string` and points out what was probably a user typo:\n\n\
    ```typescript\nfunction doSomething(x: number | string) {\n  if (typeof x ===\
    \ 'string') { // Within the block TypeScript knows that `x` must be a string\n\
    \    console.log(x.subtr(1)); // Error, 'subtr' does not exist on `string`\n \
    \   console.log(x.substr(1)); // OK\n  }\n  x.substr(1); // Error: There is no\
    \ guarantee that `x` is a `string`\n}\n```\n\n**instanceof**\n\nHere is an example\
    \ with a class and `instanceof`:\n\nType Guard\n\n159\n\n```typescript\nclass\
    \ Foo {\n  foo = 123;\n  common = '123';\n}\n\nclass Bar {\n  bar = 123;\n  common\
    \ = '123';\n}\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg instanceof Foo)\
    \ {\n    console.log(arg.foo); // OK\n    console.log(arg.bar); // Error!\n  }\n\
    \  if (arg instanceof Bar) {\n    console.log(arg.foo); // Error!\n    console.log(arg.bar);\
    \ // OK\n  }\n  console.log(arg.common); // OK\n  console.log(arg.foo); // Error!\n\
    \  console.log(arg.bar); // Error!\n}\n\ndoStuff(new Foo());\ndoStuff(new Bar());\n\
    ```\n\nTypeScript even understands `else` so when an `if` narrows out one type\
    \ it knows that within the `else` *it's definitely not that type*. Here is an\
    \ example:\n\nType Guard\n\n160\n\n```typescript\nclass Foo {\n  foo = 123;\n\
    }\n\nclass Bar {\n  bar = 123;\n}\n\nfunction doStuff(arg: Foo | Bar) {\n  if\
    \ (arg instanceof Foo) {\n    console.log(arg.foo); // OK\n    console.log(arg.bar);\
    \ // Error!\n  }\n  else { // MUST BE Bar!\n    console.log(arg.foo); // Error!\n\
    \    console.log(arg.bar); // OK\n  }\n}\n\ndoStuff(new Foo());\ndoStuff(new Bar());\n\
    ```\n\n### Literal Type Guard\n\nWhen you have literal types in a union you can\
    \ check them to discriminate e.g.\n\n```typescript\ntype Foo = {\n  kind: 'foo',\
    \ // Literal type \n  foo: number\n}\n\ntype Bar = {\n  kind: 'bar', // Literal\
    \ type \n  bar: number\n}\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg.kind\
    \ === 'foo') {\n    console.log(arg.foo); // OK\n    console.log(arg.bar); //\
    \ Error!\n  }\n  else { // MUST BE Bar!\n    console.log(arg.foo); // Error!\n\
    \    console.log(arg.bar); // OK\n  }\n}\n```\n\n### User Defined Type Guards\n\
    \nType Guard\n\n161\n\nJavaScript doesn't have very rich runtime introspection\
    \ support built in. When you are using just plain JavaScript Objects (using structural\
    \ typing to your advantage), you do not even have access to `instanceof` or `typeof`.\
    \ For these cases you can create *User Defined Type* *Guard functions*. These\
    \ are just functions that return `someArgumentName is SomeType`. Here is an example:\n\
    \n```typescript\n/**\n * Just some interfaces\n */\ninterface Foo {\n  foo: number;\n\
    \  common: string;\n}\n\ninterface Bar {\n  bar: number;\n  common: string;\n\
    }\n\n/**\n * User Defined Type Guard!\n */\nfunction isFoo(arg: any): arg is Foo\
    \ {\n  return arg.foo !== undefined;\n}\n\n/**\n * Sample usage of the User Defined\
    \ Type Guard\n */\nfunction doStuff(arg: Foo | Bar) {\n  if (isFoo(arg)) {\n \
    \   console.log(arg.foo); // OK\n    console.log(arg.bar); // Error!\n  }\n  else\
    \ {\n    console.log(arg.foo); // Error!\n    console.log(arg.bar); // OK\n  }\n\
    }\n\ndoStuff({ foo: 123, common: '123' });\ndoStuff({ bar: 123, common: '123'\
    \ });\n```\n\nType Guard\n\n162\n\n### Literals\n\nLiterals are *exact* values\
    \ that are JavaScript primitives.\n\n### String Literals\n\nYou can use a string\
    \ literal as a type. For example:\n\n```typescript\nlet foo: 'Hello';\n```\n\n\
    Here we have created a variable called `foo` that *will only allow the literal\
    \ value 'Hello' to* *be assigned to it*. This is demonstrated below:\n\n```typescript\n\
    let foo: 'Hello';\nfoo = 'Bar'; // Error: \"Bar\" is not assignable to type \"\
    Hello\"\n```\n\nThey are not very useful on their own but can be combined in a\
    \ type union to create a powerful (and useful) abstraction e.g.:\n\n```typescript\n\
    type CardinalDirection =\n  \"North\"\n  | \"East\"\n  | \"South\"\n  | \"West\"\
    ;\n\nfunction move(distance: number, direction: CardinalDirection) {\n  // ...\n\
    }\nmove(1,\"North\"); // Okay\nmove(1,\"Nurth\"); // Error!\n```\n\n### Other\
    \ literal types\n\nTypeScript also supports `boolean`, `numbers` as literals,\
    \ e.g.:\n\n```typescript\ntype OneToFive = 1 | 2 | 3 | 4 | 5;\ntype Bools = true\
    \ | false;\n```\n\nInference\nLiteral Types\n\n163\n\nQuite commonly you get an\
    \ error like `Type string is not assignable to type \"foo\"`. The following example\
    \ demonstrates this.\n\n```typescript\nfunction iTakeFoo(foo: 'foo') { }\nconst\
    \ test = {\n  someProp: 'foo'\n};\n\niTakeFoo(test.someProp); // Error: Argument\
    \ of type string is not assignable to parameter of type 'foo'\n```\n\nThis is\
    \ because `test` is inferred to be of type `{someProp: string}`. The fix here\
    \ is to use a simple type assertion to tell TypeScript the literal you want it\
    \ to infer as shown below:\n\n```typescript\nfunction iTakeFoo(foo: 'foo') { }\n\
    const test = {\n  someProp: 'foo' as 'foo'\n};\n\niTakeFoo(test.someProp); //\
    \ Okay!\n```\n\n### Use cases\n\nValid use cases for string literal types are:\n\
    \n### String based enums\n\nTypeScript enums are number based. You can use string\
    \ literals with union types to mock a string based enum as we did in the `CardinalDirection`\
    \ example above. You can even generate a `Key:Value` structure using the following\
    \ function:\n\n```typescript\n/** Utility function to create a K:V from a list\
    \ of strings */\nfunction strEnum<T extends string>(o: Array<T>): {K in T]: T}\
    \ {\n  return o.reduce((res, key) => {\n    res[key] = key;\n    return res;\n\
    \  }, Object.create(null));\n}\n```\n\nAnd then generate the literal type using\
    \ `keyof typeof`. Here is a complete example:\n\nLiteral Types\n\n164\n\n```typescript\n\
    /**\n * Sample create a string enum\n */\nconst Direction = strEnum([\n  'North',\n\
    \  'South',\n  'East',\n  'West'\n]);\n\n/** Create a Type */\ntype Direction\
    \ = keyof typeof Direction;\n\n/**\n * Sample using a string enum\n */\nlet sample:\
    \ Direction;\nsample = Direction.North; // Okay\nsample = 'North'; // Okay\nsample\
    \ = 'AnythingElse'; // ERROR!\n```\n\n### Modelling existing JavaScript APIs\n\
    \nE.g. CodeMirror editor has an option `readOnly` that can either be a `boolean`\
    \ or the literal string `\"nocursor\"` (effective valid values `true,false,\"\
    nocursor\"`). It can be declared as:\n\n`readOnly: boolean | 'nocursor';`\n\n\
    ### Discriminated Unions\n\nWe will cover this later in the book.\n\nLiteral Types\n\
    \n165\n\n### Readonly\n\nTypeScript's type system allows you to mark individual\
    \ properties on an interface as readonly. This allows you to work in a functional\
    \ way (unexpected mutation is bad):\n\n```typescript\nfunction foo(config: {\n\
    \  readonly bar: number,\n  readonly bas: number\n}) {\n  // ..\n}\n\nlet config\
    \ = { bar: 123, bas: 123 };\nfoo(config);\n// You can be sure that `config` isn't\
    \ changed\n```\n\nOf course you can use `readonly` in `interface` and `type` definitions\
    \ as well e.g.:\n\n```typescript\ntype Foo = {\n  readonly bar: number;\n  readonly\
    \ bas: number;\n}\n\n// Initialization is okay\nlet foo: Foo = { bar: 123, bas:\
    \ 456 };\n\n// Mutation is not\nfoo.bar = 456; // Error: Left-hand side of assignment\
    \ expression cannot be a constant or a read-only property\n```\n\nYou can even\
    \ declare a class property as `readonly`. You can initialize them at the point\
    \ of declaration or in the constructor as shown below:\n\n```typescript\nclass\
    \ Foo {\n  readonly bar = 1; // OK\n  readonly baz: string;\n  constructor() {\n\
    \    this.baz = \"hello\"; // OK\n  }\n}\n```\n\n### Various Use Cases\n\nReadonly\n\
    \n166\n"
  mdcn: "\n\n利用“新鲜度”（freshness）的概念，你可以将所有成员标记为可选，而且*你仍然可以**捕捉拼写错误*！\n\n// 假设\n\ninterface\
    \ State {\n foo?: string;\n bar?: string;\n}\n\n// 你想做的是：\n\nthis.setState({foo:\
    \ \"Hello\"}); // 耶，运行正常！\n\n// 因为有新鲜度的特性，它也能防止拼写错误！\n\nthis.setState({foos: \"\
    Hello\"}}; // 错误：对象只能指定已知的属性\n\n// 并且仍然经过类型检查\n\nthis.setState({foo: 123}); //\
    \ 错误：无法将数字赋值给字符串\n\n新鲜度\n\n158\n\n## 类型守卫 (Type Guard)\n\n### 用户定义类型守卫\n\n**类型守卫\
    \ (Type Guard)**\n\n类型守卫允许你在条件块内收窄（narrow down）对象的类型。\n\n**typeof**\n\nTypeScript\
    \ 能够感知 JavaScript 置的 `instanceof` 和 `typeof` 算器的用法。如果你在条件块中使用它们，TypeScript 将理解该变量在该条件块内的类型是不同的。这里有一个简单的示例，TypeScript\
    \ 意识到某个特定函数在 `string` 上不存在，并指出了可能是一个用户的拼写错误：\n\n```typescript\nfunction doSomething(x:\
    \ number | string) {\n  if (typeof x === 'string') { // 在块内 TypeScript 知道 `x`\
    \ 必须是字符串\n    console.log(x.subtr(1)); // 错误，'subtr' 不存在于 `string` 上\n    console.log(x.substr(1));\
    \ // OK\n  }\n  x.substr(1); // 错误：无法保证 `x` 一是 `string`\n}\n```\n\n**instanceof**\n\
    \n这是一个使用类和 `instanceof` 的示例：\n\n类型守卫\n\n159\n\n```typescript\nclass Foo {\n  foo\
    \ = 123;\n  common = '123';\n}\n\nclass Bar {\n  bar = 123;\n  common = '123';\n\
    }\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg instanceof Foo) {\n    console.log(arg.foo);\
    \ // OK\n    console.log(arg.bar); // 错误！\n  }\n  if (arg instanceof Bar) {\n\
    \    console.log(arg.foo); // 错误！\n    console.log(arg.bar); // OK\n  }\n  console.log(arg.common);\
    \ // OK\n  console.log(arg.foo); // 错误！\n  console.log(arg.bar); // 错误！\n}\n\n\
    doStuff(new Foo());\ndoStuff(new Bar());\n```\n\nTypeScript 甚至理解 `else`，所以当一个\
    \ `if` 缩小了一个类型时，它知道在 `else` 内部*它绝对不是那个类型*。这里有一个示例：\n\n类型守卫\n\n160\n\n```typescript\n\
    class Foo {\n  foo = 123;\n}\n\nclass Bar {\n  bar = 123;\n}\n\nfunction doStuff(arg:\
    \ Foo | Bar) {\n  if (arg instanceof Foo) {\n    console.log(arg.foo); // OK\n\
    \    console.log(arg.bar); // 错误！\n  }\n  else { // 必须是 Bar!\n    console.log(arg.foo);\
    \ // 错误！\n    console.log(arg.bar); // OK\n  }\n}\n\ndoStuff(new Foo());\ndoStuff(new\
    \ Bar());\n```\n\n### 字面量类型守卫 (Literal Type Guard)\n\n当你在联合类型中有字面量类型时，你可以检查它们来区分，例如：\n\
    \n```typescript\ntype Foo = {\n  kind: 'foo', // 字面量类型 \n  foo: number\n}\n\n\
    type Bar = {\n  kind: 'bar', // 字面量类型 \n  bar: number\n}\n\nfunction doStuff(arg:\
    \ Foo | Bar) {\n  if (arg.kind === 'foo') {\n    console.log(arg.foo); // OK\n\
    \    console.log(arg.bar); // 错误！\n  }\n  else { // 必须是 Bar!\n    console.log(arg.foo);\
    \ // 错误！\n    console.log(arg.bar); // OK\n  }\n}\n```\n\n### 用户定义类型守卫\n\n类型守卫\n\
    \n161\n\nJavaScript 内置没有非常丰富的运行时内省支持。当你仅使用纯 JavaScript 对象时（利用结构化类型的优势），你甚至无法访问\
    \ `instanceof` 或 `typeof`。对于这些情况，你可以创建*用户定义类型**守卫函数*。这些只是返回 `someArgumentName\
    \ is SomeType` 的函数。这里有一个示例：\n\n```typescript\n/**\n * 仅仅是一些接口\n */\ninterface\
    \ Foo {\n  foo: number;\n  common: string;\n}\n\ninterface Bar {\n  bar: number;\n\
    \  common: string;\n}\n\n/**\n * 用户定义类型守卫！\n */\nfunction isFoo(arg: any): arg\
    \ is Foo {\n  return arg.foo !== undefined;\n}\n\n/**\n * 用户定义类型守卫的示例用法\n */\n\
    function doStuff(arg: Foo | Bar) {\n  if (isFoo(arg)) {\n    console.log(arg.foo);\
    \ // OK\n    console.log(arg.bar); // 错误！\n  }\n  else {\n    console.log(arg.foo);\
    \ // 错误！\n    console.log(arg.bar); // OK\n  }\n}\n\ndoStuff({ foo: 123, common:\
    \ '123' });\ndoStuff({ bar: 123, common: '123' });\n```\n\n类型守卫\n\n162\n\n###\
    \ 字面量 (Literals)\n\n字面量是 JavaScript 原始类型的*精确*值。\n\n字面量是 JavaScript 原始类型。\n\n你想做的是：\
    \ \n\nthis.setState({foo: \"Hello\"}); // 耶，运行正常！\n\n// 因为有新鲜度的特性，它也能防止拼写错误！\n\
    \nthis.setState({foos: \"Hello\"}}; // 错误：对象只能指定已知的属性\n\n// 并且仍然经过类型检查\n\nthis.setState({foo:\
    \ 123}); // 错误：无法将数字赋值给字符串\n\n新鲜度 158 159 160 161 162 163 164 165 166\n"
