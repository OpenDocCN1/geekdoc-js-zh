    \n314\n\n**贡献**\n\nTypeScript 是开源项目并托管在 GitHub 上，团队欢迎社区的投入。\n\n**设置**\n\n非常简单：\n\
    `git clone https://github.com/Microsoft/TypeScript.git`\n`cd TypeScript`\n`npm\
    \ install -g jake`\n\n**设置**\n\n你显然需要将 Microsoft/TypeScript 设置为上游（upstream），并将自己的\
