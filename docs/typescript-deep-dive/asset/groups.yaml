    \ `tsconfig.json` 的 types 选项之前，也不会泄露到你的代码中。\n\n@types\n\n## 环境声明\n\n正如我们在“为什么选择\
    \ TypeScript”中提到的：\n\nTypeScript 的一个主要设计目标是让你能够在 TypeScript 中安全方便地使用现有的 JavaScript\
    \ 库。TypeScript 通过*声明*来实现这一点。\n\n环境声明允许你*安全地使用现有的流行 JavaScript 库*，并*将你的 JavaScript/CoffeeScript/其他编译为\
    \ JS 的语言项目分量迁移到 TypeScript*。\n\n研究*第三方 JavaScript 代码*环境声明中的模式对于标注*你的*TypeScript\
