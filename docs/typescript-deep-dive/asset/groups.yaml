    \ as:\n\nclass Adder {\n\n constructor(public a: string) { }\n\n // This function\
    \ is now safe to pass around\n\n add = (b: string): string => {\n\n return this.a\
    \ + b;\n\n }\n\n}\n\nAnother alternative is to *manually* specify the type of\
