  - "[PAGE 256]\n\n**Typesafe Event Emitter**\n\nConventionally in Node.js and traditional\
    \ JavaScript you have a single event emitter. This\n\nevent emitter internally\
    \ tracks listener for different event types e.g.\n\nconst emitter = new EventEmitter();\n\
    \n// Emit: \n\nemitter.emit('foo', foo);\n\nemitter.emit('bar', bar);\n\n// Listen:\
    \ \n\nemitter.on('foo', (foo)=>console.log(foo));\n\nemitter.on('bar', (bar)=>console.log(bar));\n\
    \nEssentially  EventEmitter  internally stores data in the form of mapped arrays:\n\
    \n{foo: \\[fooListeners\\], bar: \\[barListeners\\]}\n\nInstead, for the sake\
    \ of *event* type safety, you can create an emitter *per* event type:\n\nconst\
    \ onFoo = new TypedEvent<Foo>();\n\nconst onBar = new TypedEvent<Bar>();\n\n//\
    \ Emit: \n\nonFoo.emit(foo);\n\nonBar.emit(bar);\n\n// Listen: \n\nonFoo.on((foo)=>console.log(foo));\n\
    \nonBar.on((bar)=>console.log(bar));\n\nThis has the following advantages:\n\n\
    The types of events are easily discoverable as variables.\n\nThe event emitter\
    \ variables are easily refactored independently.\n\nType safety for event data\
    \ structures.\n\n**Reference TypedEvent**\n\nTypesafe Event Emitter\n\n257"
  - "[PAGE 257]\n\nexport interface Listener<T> {\n\n (event: T): any;\n\n}\n\nexport\
    \ interface Disposable {\n\n dispose();\n\n}\n\n/\\*\\* passes through events\
    \ as they happen. You will not get events from before you star\n\nt listening\
    \ \\*/\n\nexport class TypedEvent<T\\> {\n\n private listeners: Listener<T>\\\
    [\\] = \\[\\];\n\n private listenersOncer: Listener<T>\\[\\] = \\[\\];\n\n on\
    \ = (listener: Listener<T>): Disposable => {\n\n this.listeners.push(listener);\n\
    \n return {\n\n dispose: () => this.off(listener)\n\n };\n\n }\n\n once = (listener:\
    \ Listener<T>): void => {\n\n this.listenersOncer.push(listener);\n\n }\n\n off\
    \ = (listener: Listener<T>) => {\n\n var callbackIndex = this.listeners.indexOf(listener);\n\
    \n if (callbackIndex > \\-1) this.listeners.splice(callbackIndex, 1);\n\n }\n\n\
    \ emit = (event: T) => {\n\n /\\*\\* Update any general listeners \\*/\n\n this.listeners.forEach((listener)\
    \ => listener(event));\n\n /\\*\\* Clear the \\`once\\` queue \\*/\n\n this.listenersOncer.forEach((listener)\
    \ => listener(event));\n\n this.listenersOncer = \\[\\];\n\n }\n\n pipe = (te:\
    \ TypedEvent<T>): Disposable => {\n\n return this.on((e) => te.emit(e));\n\n }\n\
    \n}\n\nTypesafe Event Emitter\n\n258"
  - "[PAGE 258]\n\n**TypeScript StyleGuide and Coding**\n\n**Conventions**\n\nAn unofficial\
    \ TypeScript StyleGuide\n\nPeople have asked me for my opinions on this. Personally\
    \ I don't enforce these a lot on my\n\nteams and projects but it does help to\
    \ have these mentioned as a tie breaker when someone\n\nfeels the need to have\
    \ such strong consistency. There are other things that I feel much more\n\nstrongly\
    \ about and those are covered in the tips chapter (e.g. type assertion is bad,\
    \ property\n\nsetters are bad) .\n\nKey Sections:\n\nVariable\n\nClass\n\nInterface\n\
    \nType\n\nNamespace\n\nEnum\n\n null  vs.  undefined \n\nFormatting\n\nSingle\
    \ vs. Double Quotes\n\nTabs vs. Spaces\n\nUse semicolons\n\nAnnotate Arrays as\
    \  Type\\[\\] \n\nFile Names\n\n**Variable and Function**\n\nUse  camelCase  for\
    \ variable and function names\n\nReason: Conventional JavaScript\n\n**Bad**\n\n\
    var FooVar;\n\nfunction BarFunc() { }\n\n**Good**\n\nStyleGuide\n\n259"
  - "[PAGE 259]\n\nvar fooVar;\n\nfunction barFunc() { }\n\n**Class**\n\nUse  PascalCase\
    \  for class names.\n\nReason: This is actually fairly conventional in standard\
    \ JavaScript.\n\n**Bad**\n\nclass foo { }\n\n**Good**\n\nclass Foo { }\n\nUse\
    \  camelCase  of class members and methods\n\nReason: Naturally follows from variable\
    \ and function naming convention.\n\n**Bad**\n\nclass Foo {\n\n Bar: number;\n\
    \n Baz() { }\n\n}\n\n**Good**\n\nclass Foo {\n\n bar: number;\n\n baz() { }\n\n\
    }\n\n**Interface**\n\nUse  PascalCase  for name.\n\nReason: Similar to class\n\
    \nUse  camelCase  for members.\n\nStyleGuide\n\n260"
  - "[PAGE 260]\n\nReason: Similar to class\n\n**Don't** prefix with  I \n\nReason:\
    \ Unconventional.  lib.d.ts  defines important interfaces without an  I  (e.g.\n\
    \nWindow, Document etc).\n\n**Bad**\n\ninterface IFoo {\n\n}\n\n**Good**\n\ninterface\
    \ Foo {\n\n}\n\n**Type**\n\nUse  PascalCase  for name.\n\nReason: Similar to class\n\
    \nUse  camelCase  for members.\n\nReason: Similar to class\n\n**Namespace**\n\n\
    Use  PascalCase  for names\n\nReason: Convention followed by the TypeScript team.\
    \ Namespaces are effectively just\n\na class with static members. Class names\
    \ are  PascalCase  => Namespace names are\n\n PascalCase \n\n**Bad**\n\nnamespace\
    \ foo {\n\n}\n\n**Good**\n\nStyleGuide\n\n261"
  - "[PAGE 261]\n\nnamespace Foo {\n\n}\n\n**Enum**\n\nUse  PascalCase  for enum names\n\
    \nReason: Similar to Class. Is a Type.\n\n**Bad**\n\nenum color {\n\n}\n\n**Good**\n\
    \nenum Color {\n\n}\n\nUse  PascalCase  for enum member\n\nReason: Convention\
    \ followed by TypeScript team i.e. the language creators e.g\n\n SyntaxKind.StringLiteral\
    \ . Also helps with translation (code generation) of other\n\nlanguages into TypeScript.\n\
    \n**Bad**\n\nenum Color {\n\n red\n\n}\n\n**Good**\n\nenum Color {\n\n Red\n\n\
    }\n\n**Null vs. Undefined**\n\nPrefer not to use either for explicit unavailability\n\
    \nStyleGuide\n\n262"
  - "[PAGE 262]\n\nReason: these values are commonly used to keep a consistent structure\
    \ between\n\nvalues. In TypeScript you use *types* to denote the structure\n\n\
    **Bad**\n\nlet foo = {x:123,y:undefined};\n\n**Good**\n\nlet foo:{x:number,y?:number}\
    \ = {x:123};\n\nUse  undefined  in general (do consider returning an object like\n\
    \n {valid:boolean,value?:Foo}  instead)\n\n***Bad***\n\nreturn null;\n\n***Good***\n\
    \nreturn undefined;\n\nUse  null  where its a part of the API or conventional\n\
    \nReason: It is conventional in Node.js e.g.  error  is  null  for NodeBack style\n\
    \ncallbacks.\n\n**Bad**\n\ncb(undefined)\n\n**Good**\n\ncb(null)\n\nUse *truthy*\
    \ check for **objects** being  null  or  undefined \n\n**Bad**\n\nif (error ===\
    \ null)\n\n**Good**\n\nStyleGuide\n\n263"
  - "[PAGE 263]\n\nif (error)\n\nUse  == undefined  /  != undefined  (not  ===  /\
    \  !== ) to check for  null  /  undefined \n\non primitives as it works for both\
    \  null / undefined  but not other falsy values (like\n\n '' , 0 , false ) e.g.\n\
    \n**Bad**\n\nif (error !== null)\n\n**Good**\n\nif (error != undefined)\n\nPS:\
    \ More about  null \n\n**Formatting**\n\nThe TypeScript compiler ships with a\
    \ very nice formatting language service. Whatever\n\noutput it gives by default\
    \ is good enough to reduce the cognitive overload on the team.\n\nUse  tsfmt \
    \ to automatically format your code on the command line. Also your IDE\n\n(atom/vscode/vs/sublime)\
    \ already has formatting support built-in.\n\nExamples:\n\n// Space before type\
