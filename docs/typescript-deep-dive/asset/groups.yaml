  - "[PAGE 290]\n\n**Container**\n\nAn AST node can be a container. This determines\
    \ the kinds of  SymbolTables  the Node and\n\nassociated Symbol will have. Container\
    \ is an abstract concept (i.e. has no associated data\n\nstructure). The concept\
    \ is driven by a few things, one being the  ContainerFlags  enum. The\n\nfunction\
    \  getContainerFlags  (in  binder.ts ) drives this flag and is presented below:\n\
    \nfunction getContainerFlags(node: Node): ContainerFlags {\n\n switch (node.kind)\
    \ {\n\n case SyntaxKind.ClassExpression:\n\n case SyntaxKind.ClassDeclaration:\n\
    \n case SyntaxKind.InterfaceDeclaration:\n\n case SyntaxKind.EnumDeclaration:\n\
    \n case SyntaxKind.TypeLiteral:\n\n case SyntaxKind.ObjectLiteralExpression:\n\
    \n return ContainerFlags.IsContainer;\n\n case SyntaxKind.CallSignature:\n\n case\
    \ SyntaxKind.ConstructSignature:\n\n case SyntaxKind.IndexSignature:\n\n case\
    \ SyntaxKind.MethodDeclaration:\n\n case SyntaxKind.MethodSignature:\n\n case\
    \ SyntaxKind.FunctionDeclaration:\n\n case SyntaxKind.Constructor:\n\n case SyntaxKind.GetAccessor:\n\
    \n case SyntaxKind.SetAccessor:\n\n case SyntaxKind.FunctionType:\n\n case SyntaxKind.ConstructorType:\n\
    \n case SyntaxKind.FunctionExpression:\n\n case SyntaxKind.ArrowFunction:\n\n\
    \ case SyntaxKind.ModuleDeclaration:\n\n case SyntaxKind.SourceFile:\n\n case\
    \ SyntaxKind.TypeAliasDeclaration:\n\n return ContainerFlags.IsContainerWithLocals;\n\
    \n case SyntaxKind.CatchClause:\n\n case SyntaxKind.ForStatement:\n\n case SyntaxKind.ForInStatement:\n\
    \n case SyntaxKind.ForOfStatement:\n\n case SyntaxKind.CaseBlock:\n\n return ContainerFlags.IsBlockScopedContainer;\n\
    \n case SyntaxKind.Block:\n\n // do not treat blocks directly inside a function\
    \ as a block-scoped-contai\n\nner.\n\n // Locals that reside in this block should\
    \ go to the function locals. Othe\n\nwise 'x'\n\n // would not appear to be a\
    \ redeclaration of a block scoped local in the f\n\nollowing\n\nBinder Container\n\
    \n291"
