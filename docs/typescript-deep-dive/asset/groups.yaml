- md: "\nimport fs = require('fs');\n\nfunction loadJSON(filename: string, cb: (error:\
    \ Error) => void) {\n  fs.readFile(filename, function (err, data) {\n    if (err)\
    \ return cb(err);\n    // Contain all your sync code in a try catch\n    try {\n\
    \      var parsed = JSON.parse(data);\n    }\n    catch (err) {\n      return\
    \ cb(err);\n    }\n    // except when you call the callback\n    return cb(null,\
    \ parsed);\n  });\n}\n\nAdmittedly this is not hard to follow once you've done\
    \ it a few times but nonetheless it’s a lot of boilerplate code to write simply\
    \ for good error handling. Now let's look at a better way to tackle asynchronous\
    \ JavaScript using promises.\n\n**Creating a Promise**\n\nA promise can be either\
    \ `pending` or `fulfilled` or `rejected`.\n\n![](img/416f69818aa79e3f1fe0e7869c118431_66_0.png)\n\
    \nPromise\n\nLet's look at creating a promise. It's a simple matter of calling\
    \ `new` on `Promise` (the promise constructor). The promise constructor is passed\
    \ `resolve` and `reject` functions for settling the promise state:\n\n```javascript\n\
    const promise = new Promise((resolve, reject) => {\n  // the resolve / reject\
    \ functions control the fate of the promise\n});\n```\n\n**Subscribing to the\
    \ fate of the promise**\n\nThe promise fate can be subscribed to using `.then`\
    \ (if resolved) or `.catch` (if rejected).\n\n```javascript\nconst promise = new\
    \ Promise((resolve, reject) => {\n  resolve(123);\n});\n\npromise.then((res) =>\
    \ {\n  console.log('I get called:', res === 123); // I get called: true\n});\n\
    \npromise.catch((err) => {\n  // This is never called\n});\n\nconst promise =\
    \ new Promise((resolve, reject) => {\n  reject(new Error(\"Something awful happened\"\
    ));\n});\n\npromise.then((res) => {\n  // This is never called\n});\n\npromise.catch((err)\
    \ => {\n  console.log('I get called:', err.message); // I get called: 'Something\
    \ awful happened'\n});\n```\n\nTIP: Promise Shortcuts\n\nQuickly creating an already\
    \ resolved promise: `Promise.resolve(result)`\n\nQuickly creating an already rejected\
    \ promise: `Promise.reject(error)`\n\n**Chain-ability of Promises**\n\nThe chain-ability\
    \ of promises **is the heart of the benefit that promises provide**. Once you\
    \ have a promise, from that point on, you use the `then` function to create a\
    \ chain of promises.\n\nIf you return a promise from any function in the chain,\
    \ `.then` is only called once the Promise value is resolved:\n\n```javascript\n\
    Promise.resolve(123)\n  .then((res) => {\n    console.log(res); // 123\n    return\
    \ 456;\n  })\n  .then((res) => {\n    console.log(res); // 456\n    return Promise.resolve(123);\
    \ // Notice that we are returning a Promise\n  })\n  .then((res) => {\n    console.log(res);\
    \ // 123 : Notice that this `then` is called with the resolved value\n    return\
    \ 123;\n  });\n```\n\nYou can aggregate the error handling of any preceding portion\
    \ of the chain with a single `catch`:\n\n```javascript\n// Create a rejected promise\n\
    Promise.reject(new Error('something bad happened'))\n  .then((res) => {\n    console.log(res);\
    \ // not called\n    return 456;\n  })\n  .then((res) => {\n    console.log(res);\
    \ // not called\n    return 123;\n  })\n  .then((res) => {\n    console.log(res);\
    \ // not called\n    return 123;\n  })\n  .catch((err) => {\n    console.log(err.message);\
    \ // something bad happened\n  });\n```\n\nThe `catch` actually returns a new\
    \ promise (effectively creating a new promise chain):\n\n```javascript\n// Create\
    \ a rejected promise\nPromise.reject(new Error('something bad happened'))\n  .then((res)\
    \ => {\n    console.log(res); // not called\n    return 456;\n  })\n  .catch((err)\
