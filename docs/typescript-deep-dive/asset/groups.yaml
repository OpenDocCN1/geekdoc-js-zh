  - "[PAGE 272]\n\n**Node**\n\nThe basic building block of the Abstract Syntax Tree\
    \ (AST). In general a  Node  represents\n\nnon-terminals in the language grammar;\
    \ however, some terminals are kept in the tree such\n\nas identifiers and literals.\n\
    \nTwo key things make up an AST node's documentation. The node's  SyntaxKind \
