  - "[PAGE 120]\n\n**Migrating From JavaScript**\n\nIn general the process consists\
    \ of the following steps:\n\nAdd a  tsconfig.json .\n\nChange your source code\
    \ file extensions from  .js  to  .ts . Start *suppressing* errors\n\nusing  any\
    \ .\n\nWrite new code in TypeScript and make as little use of  any  as possible.\n\
    \nGo back to the old code and start adding type annotations and fix identified\
    \ bugs.\n\nUse ambient definitions for third party JavaScript code.\n\nLet us\
    \ discuss a few of these points further.\n\nNote that all JavaScript is *valid*\
    \ TypeScript. That is to say that if you give the TypeScript\n\ncompiler some\
    \ JavaScript -> the JavaScript emitted by the TypeScript compiler will behave\n\
    \nexactly the same as the original JavaScript. This means that changing the extension\
    \ from\n\n .js  to  .ts  will not adversely affect your codebase.\n\n**Suppressing\
    \ Errors**\n\nTypeScript will immediately start TypeChecking your code and your\
    \ original JavaScript code\n\n*might not be as neat as you thought it was* and\
    \ hence you get diagnostic errors. Many of\n\nthese errors you can suppress with\
    \ using  any  e.g.:\n\nvar foo = 123;\n\nvar bar = 'hey';\n\nbar = foo; // ERROR:\
    \ cannot assign a number to a string\n\nEven though the **error is valid** (and\
    \ in most cases the inferred information will be better than\n\nwhat the original\
    \ authors of different portions of the code bases imagined), your focus will\n\
    \nprobably be writing new code in TypeScript while progressively updating the\
    \ old code base.\n\nHere you can suppress this error with a type assertion as\
    \ shown below:\n\nvar foo = 123;\n\nvar bar = 'hey';\n\nbar = foo as any; // Okay!\n\
    \nIn other places you might want to annotate something as  any  e.g.:\n\nJS Migration\
    \ Guide\n\n121"
- md: "\nfunction foo() {\n  return 1;\n}\n\nvar bar = 'hey';\n\nbar = foo(); // ERROR:\
    \ cannot assign a number to a string\n\nSuppressed:\n\nfunction foo(): any { //\
    \ Added `any`\n  return 1;\n}\n\nvar bar = 'hey';\n\nbar = foo(); // Okay!\n\n\
    Note: Suppressing errors is dangerous, but it allows you to take notice of errors\
    \ in your *new* TypeScript code. You might want to leave // TODO: comments as\
    \ you go along.**\n\n## Third Party JavaScript\n\nYou can change your JavaScript\
    \ to TypeScript, but you can't change the whole world to use TypeScript. This\
    \ is where TypeScript's ambient definition support comes in. In the beginning\
    \ we recommend you create a `vendor.d.ts` (the `.d.ts` extension specifies the\
    \ fact that this is a *declaration file*) and start adding dirty stuff to it.\
    \ Alternatively create a file specific for the library e.g. `jquery.d.ts` for\
    \ jquery.\n\nNote: Well maintained and strongly typed definitions for nearly the\
    \ top 90% of JavaScript libraries out there exists in an OSS Repository called\
    \ DefinitelyTyped. We recommend looking there before creating your own definitions\
    \ as we present here. Nevertheless this quick and dirty way is vital knowledge\
    \ to decrease your initial friction with TypeScript**.\n\nConsider the case of\
    \ `jquery`, you can create a *trivial* definition for it quite easily:\n\ndeclare\
    \ var $: any;\n\nSometimes you might want to add an explicit annotation on something\
    \ (e.g. JQuery) and you need something in *type declaration space*. You can do\
    \ that quite easily using the `type` keyword:\n\ndeclare type JQuery = any;\n\n\
    declare var $: JQuery;\n\nThis provides you an easier future update path.\n\n\
    JS Migration Guide\n\nAgain, a high quality `jquery.d.ts` exists at DefinitelyTyped.\
    \ But you now know how to overcome any JavaScript -> TypeScript friction *quickly*\
    \ when using third party JavaScript. We will look at ambient declarations in detail\
    \ next.\n\n## Third Party NPM modules\n\nSimilar to global variable declaration\
    \ you can declare a global module quite easily. E.g. for `jquery` if you want\
    \ to use it as a module (https://www.npmjs.com/package/jquery) you can write the\
    \ following yourself:\n\ndeclare module \"jquery\";\n\nAnd then you can import\
    \ it in your file as needed:\n\nimport * as $ from \"jquery\";\n\nAgain, a high\
    \ quality `jquery.d.ts` exists at DefinitelyTyped that provides a much higher\
    \ quality jquery module declaration. But it might not exist for your library,\
    \ so now you have a quick low friction way of continuing the migration\n\n## External\
    \ non js resources\n\nYou can even allow import of any file e.g. `.css` files\
    \ (if you are using something like webpack) with a simple `*` style declaration:\n\
    \ndeclare module \"*.css\";\n\nNow people can `import * as foo from \"./some/file.css\"\
    ;`\n\nJS Migration Guide\n\n## @types\n\nDefinitely Typed is definitely one of\
    \ TypeScript's greatest strengths. The community has effectively gone ahead and\
    \ **documented** the nature of nearly 90% of the top JavaScript projects out there.\n\
    \nThis means that you can use these projects in a very interactive and exploratory\
    \ manner, no need to have the docs open in a separate window and making sure you\
    \ don't make a typo.\n\n### Using @types\n\nInstallation is fairly simple as it\
    \ just works on top of `npm`. So as an example you can install type definitions\
    \ for `jquery` simply as:\n\nnpm install @types/jquery --save-dev\n\n@types supports\
    \ both *global* and *module* type definitions.\n\n### Global @types\n\nBy default\
    \ any definitions that support global consumption are included automatically.\
    \ E.g. for `jquery` you should be able to just start using `$` *globally* in your\
    \ project. However for *libraries* (like `jquery`) I generally recommend using\
    \ *modules*:\n\n### Module @types\n\nAfter installation, no special configuration\
    \ is required really. You just use it like a module e.g.:\n\nimport * as $ from\
    \ \"jquery\";\n\n// Use $ at will in this module :)\n\n## Controlling Globals\n\
    \nAs can be seen having a definition that supports global leak in automatically\
    \ can be a problem for some team so you can choose to *explicitly* only bring\
    \ in the types that make sense using the `tsconfig.json` `compilerOptions.types`\
    \ e.g.:\n\n```json\n{\n  \"compilerOptions\": {\n    \"types\" : [\n      \"jquery\"\
    \n    ]\n  }\n}\n```\n\nThe above shows a sample where only `jquery` will be allowed\
    \ to be used. Even if the person installs another definition like `npm install\
    \ @types/node` its globals (e.g. `process`) will not leak into your code until\
    \ you add them to the `tsconfig.json` types option.\n\n@types\n\n## Ambient Declarations\n\
    \nAs we mentioned in why TypeScript:\n\nA major design goal of TypeScript was\
    \ to make it possible for you to safely and easily use existing JavaScript libraries\
    \ in TypeScript. TypeScript does this by means of *declaration*.\n\nAmbient declarations\
    \ allow you to *safely use existing popular JavaScript libraries* and *incrementally\
    \ migrate your JavaScript/CoffeeScript/Other-Compile-To-Js-Language project* *to\
    \ TypeScript*.\n\nStudying patterns in ambient declarations for *third party JavaScript\
    \ code* is good practice for annotating *your* TypeScript code base as well. This\
    \ is why we present it so early on.\n\n### Declaration file\n\nYou can tell TypeScript\
    \ that you are trying to describe code that exists elsewhere (e.g. written in\
    \ JavaScript/CoffeeScript/The runtime environment like the browser or Node.js)\
    \ using the `declare` keyword. As a quick example:\n\nfoo = 123; // Error: `foo`\
    \ is not defined\n\nvs.\n\ndeclare var foo: any;\n\nfoo = 123; // allowed\n\n\
    You have the option of putting these declarations in a `.ts` file or in a `.d.ts`\
    \ file. We highly recommend that in your real world projects you use a separate\
    \ `.d.ts` (start with one called something like `globals.d.ts` or `vendor.d.ts`).\n\
    \nIf a file has the extension `.d.ts` then each root level definition must have\
    \ the `declare` keyword prefixed to it. This helps make it clear to the author\
    \ that there will be *no code* *emitted by TypeScript*. The author needs to ensure\
    \ that the declared item will exist at runtime.\n\nAmbient declarations is a promise\
    \ that you are making with the compiler. If these do not exist at runtime and\
    \ you try to use them, things will break without warning.\n\nAmbient declarations\
    \ are like docs. If the source changes the docs need to be kept updated. So you\
    \ might have new behaviours that work at runtime but no one's updated the ambient\
    \ declaration and hence you get compiler errors.\n\n### Variables\n\nFor example\
    \ to tell TypeScript about the `process` variable you *can* do:\n\ndeclare var\
    \ process: any;\n\nYou don't *need* to do this for `process` as there is already\
    \ a community maintained `node.d.ts`.\n\nThis allows you to use the `process`\
    \ variable without TypeScript complaining:\n\nprocess.exit();\n\nWe recommend\
    \ using an interface wherever possible e.g.:\n\ninterface Process {\n  exit(code?:\
    \ number): void;\n}\n\ndeclare var process: Process;\n\nThis allows other people\
    \ to *extend* the nature of these global variables while still telling TypeScript\
    \ about such modifications. E.g. consider the following case where we add an `exitWithLogging`\
    \ function to process for our amusement:\n\ninterface Process {\n  exitWithLogging(code?:\
    \ number): void;\n}\n\nprocess.exitWithLogging = function() {\n  console.log(\"\
    exiting\");\n  process.exit.apply(process, arguments);\n};\n\n### Interfaces\n\
    \nInterfaces have *zero* runtime impact. There is a lot of power in TypeScript\
    \ interfaces to declare the structure of variables.\n\nThe following two are equivalent\
    \ declarations, the first uses an *inline annotation*, the second uses an *interface*:\n\
    \n// Sample A\ndeclare var myPoint: { x: number; y: number; };\n\n// Sample B\n\
    interface Point {\n  x: number; y: number;\n}\ndeclare var myPoint: Point;\n\n\
    However the beauty of *Sample B* is that if someone authors a library that builds\
    \ on the `myPoint` library to add new members, they can easily add to the existing\
    \ declaration of `myPoint`:\n\n// Lib a.d.ts\ninterface Point {\n  x: number;\
    \ y: number;\n}\ndeclare var myPoint: Point;\n\n// Lib b.d.ts\ninterface Point\
    \ {\n  z: number;\n}\n\n// Your code\nvar myPoint.z; // Allowed!\n\nThis is because\
    \ **interfaces in TypeScript are open ended**. This is a vital tenet of TypeScript\
    \ that it allows you to mimic the extensibility of JavaScript using *interfaces*.\n\
    \nClasses can implement interfaces\n\nIf you want to use *classes* that must follow\
    \ an object structure that someone declared for you in an `interface` you can\
    \ use the `implements` keyword to ensure compatibility:\n"
  mdcn: "\n\nfunction foo() {\n  return 1;\n}\n\nvar bar = 'hey';\n\nbar = foo();\
    \ // ：无法将数字赋值给字符串\n\n已抑制：\n\nfunction foo(): any { // 添加了 `any`\n  return 1;\n\
    }\n\nvar bar = 'hey';\n\nbar = foo(); // 好的！\n\n注意：抑制错误是危险的，但它允许你注意到*新* TypeScript\
    \ 代码中的错误。**你可能想在过程中留一些 // TODO: 注释。**\n\n## 第三方 JavaScript\n\n你可以将 JavaScript\
    \ 转换为 TypeScript，但你无法让整个世界都使用 TypeScript。这就是 TypeScript 的环境定义（ambient definition）支持用用场的地方。在开始，我们建议创建一个\
    \ `vendor.d.ts`（`.d.ts` 扩展名表示这是一个*声明文件*）并开始向其中添加各种“脏”内容。或者，为特定库创建一个特定文件，例如为 jquery\
    \ 创建 `jquery.d.ts`。\n\n注意：对于市场上几乎 90% 的 JavaScript 库，已经存在维护良好且强类型的定义，位于名为 DefinitelyTyped\
    \ 的开源仓库中。我们建议在创建像这里这样的自定义定义之前先查看那里。尽管如此，这种快速而粗暴的方法对于减少你与 TypeScript 之间的初始摩擦至关重要。**\n\
    \n考虑 `jquery` 的情况，你可以很容易地为它创建一个*简单*的定义：\n\ndeclare var $: any;\n\n有时，你可能想对某些内容（例如\
    \ JQuery）添加显式注解，你需要在*类型声明空间*中某些东西。你可以使用 `type` 关键字轻松地实现这一点：\n\ndeclare type JQuery\
    \ = any;\n\ndeclare var $: JQuery;\n\n这为你提供了一个更简单的未来更新路径。\n\nJS 迁移指南\n\n再次，DefinitelyTyped\
    \ 上存在一个高质量的 `jquery.d.ts`。但你现在知道在使用第三方 JavaScript 时如何*快速*地克服任何 JavaScript 到 TypeScript\
    \ 的摩擦。接下来我们将详细介绍环境声明（ambient declarations）。\n\n## 第三方 NPM 模块\n\n与全局变量声明类似，你可以很容易地声明一个全局模块。例如，对于\
    \ `jquery`，如果你想将其作为模块使用（https://www.npmjs.com/package/jquery），你可以编写以下代码：\n\ndeclare\
    \ module \"jquery\";\n\n然后你就可以根据需要从文件中导入它：\n\nimport * as $ from \"jquery\";\n\
    \n再次，DefinitelyTyped 上存在一个高质量的 `jquery.d.ts`，它提供了质量得多的 jquery 模块声明。但对于你的库可能不存在，所以现在你有了一个快速、低摩擦的方法来继续迁移\n\
    \n## 外部非 JS 资源\n\n你甚至允许导入任何文件，例如 `.css` 文件（如果你使用类似 webpack 的工具），可以使用简单的 `*` 样式声明：\n\
    \ndeclare module \"*.css\";\n\n现在人们可以 `import * as foo from \"./some/file.css\"\
    ;` 了\n\nJS 迁移指南\n\n## @types\n\nDefinitely Typed 绝对是 TypeScript 最强大的优势之一。社区已经有效地为你**记录**了市面上几乎\
