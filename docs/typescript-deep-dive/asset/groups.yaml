- md: "\n## ReactJS\n\nOne library that loves immutability is ReactJS and it's a great\
    \ idea to mark your `Props` and `State` to be immutable e.g.:\n\n```typescript\n\
    interface Props {\n  readonly foo: number;\n}\n\ninterface State {\n  readonly\
    \ bar: number;\n}\n\nexport class Something extends React.Component<Props,State>\
    \ {\n  // You can rest assured no one is going to do\n  // this.props.foo = 123;\
    \ (props are immutable)\n  // this.state.bar = 456; (one should use this.setState)\n\
    }\n```\n\n## Seamless Immutable\n\nYou can even mark index signatures as readonly:\n\
    \n```typescript\n/**\n * Declaration\n */\ninterface Foo {\n  readonly [x: number]:\
    \ number;\n}\n\n/**\n * Usage\n */\nlet foo: Foo = { 0: 123, 2: 345 };\nconsole.log(foo[0]);\
    \ // Okay (reading)\nfoo[0] = 456; // Error (mutating): Readonly\n```\n\nThis\
    \ is great if you want to use native JavaScript arrays in an *immutable* fashion.\
    \ In fact, TypeScript ships with a `ReadonlyArray<T>` interface to allow you to\
    \ do just that:\n\n```typescript\nlet foo: ReadonlyArray<number> = [1, 2, 3];\n\
    console.log(foo[0]); // Okay\nfoo.push(4); // Error: `push` does not exist on\
    \ ReadonlyArray as it mutates the array\nfoo = foo.concat([4]); // Okay: create\
    \ a copy\n```\n\n## Automatic Inference\n\nIn some cases the compiler can automatically\
    \ infer a particular item to be readonly e.g. within a class if you have a property\
    \ that only has a getter but no setter, it is assumed readonly e.g.:\n\n```typescript\n\
    class Person {\n  firstName: string = \"John\";\n  lastName: string = \"Doe\"\
    ;\n  get fullName() {\n    return this.firstName + this.lastName;\n  }\n}\n\n\
    const person = new Person();\nconsole.log(person.fullName); // John Doe\nperson.fullName\
    \ = \"Dear Reader\"; // Error! fullName is readonly\n```\n\n## Difference from\
    \ const\n\n- `const` is for a variable reference\n1. the variable cannot be reassigned\
    \ to anything else.\n\n- `readonly` is for a property\n2. the property can be\
    \ modified because of aliasing\n\nSample explaining 1:\n```typescript\nconst foo\
    \ = 123; // variable reference\nvar bar: {\n  readonly bar: number; // for property\n\
    }\n```\n\nSample explaining 2:\n```typescript\nlet foo: {\n  readonly bar: number;\n\
    } = {\n  bar: 123\n};\n\nfunction iMutateFoo(foo: { bar: number }) {\n  foo.bar\
    \ = 456;\n}\n\niMutateFoo(foo); // The foo argument is aliased by the foo parameter\n\
    console.log(foo.bar); // 456!\n```\n\nBasically `readonly` ensures that it *cannot\
    \ be modified by me*, but if you give it to someone that doesn't have that guarantee\
    \ (allowed for type compatibility reasons) they can modify it.\n\nOf course if\
    \ `iMutateFoo` said that they do not mutate `foo.bar` the compiler would correctly\
    \ flag it as an error as shown:\n\n```typescript\ninterface Foo {\n  readonly\
    \ bar: number;\n}\n\nlet foo: Foo = {\n  bar: 123\n};\n\nfunction iTakeFoo(foo:\
    \ Foo) {\n  foo.bar = 456; // Error! bar is readonly\n}\n\niTakeFoo(foo); // The\
    \ foo argument is aliased by the foo parameter\n```\n\n## Generics\n\nThe key\
    \ motivation for generics is to provide meaningful type constraints between members.\
    \ The members can be:\n\n- Class instance members\n- Class methods\n- function\
    \ arguments\n- function return value\n\n## Motivation and samples\n\nConsider\
    \ the simple `Queue` (first in, first out) data structure implementation. A simple\
    \ one in TypeScript / JavaScript looks like:\n\n```typescript\nclass Queue {\n\
    \  private data = [];\n  push = (item) => this.data.push(item);\n  pop = () =>\
    \ this.data.shift();\n}\n```\n\nOne issue with this implementation is that it\
    \ allows people to add *anything* to the queue and when they pop it - it can be\
    \ *anything*. This is shown below, where someone can push a string onto the queue\
    \ while the usage actually assumes that only numbers where pushed in:\n\n```typescript\n\
    class Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n\nconst queue = new Queue();\nqueue.push(0);\n\
    queue.push(\"1\"); // Ops a mistake\n// a developer walks into a bar\nconsole.log(queue.pop().toPrecision(1));\n\
    console.log(queue.pop().toPrecision(1)); // RUNTIME ERROR\n```\n\nOne solution\
    \ (and in fact the only one in languages that don't support generics) is to go\
    \ ahead and create *special* classes:\n\n```typescript\nclass Queue {\n  private\
    \ data = [];\n  push = (item) => this.data.push(item);\n  pop = () => this.data.shift();\n\
    }\n\nclass Queue<T> {\n  private data: T[] = [];\n  push = (item: T) => this.data.push(item);\n\
    \  pop = (): T => this.data.shift();\n}\n\nconst queue = new Queue<number>();\n\
    queue.push(0);\n// queue.push(\"1\"); // Error\n```\n\n## Generics in TSX\n\n\
    Because `.tsx` / `.jsx` uses syntax like `<div>` to denote JSX blocks it offers\
    \ a few unique challenges for Generics.\n\n**Quick Tip**: Use `as` syntax for\
    \ type assertions as mentioned before.\n\n## Generic functions\n\nSomething like\
    \ the following works fine:\n\n```typescript\nfunction foo<T>(x: T): T { return\
    \ x; }\n```\n\nHowever using an arrow function will not:\n```typescript\nconst\
    \ foo = <T>(x: T) => x; // ERROR : unclosed `T` tag\n```\n\n**Workaround**: Use\
    \ `extends` on the generic parameter to hint the compiler that it's a generic,\
    \ e.g.:\n\n```typescript\nconst foo = <T extends {}>(x: T) => x;\n```\n\n## Generic\
    \ Components\n\nSince JSX doesn't have a syntax for providing a generic parameter\
    \ you need to specialize the component using a type assertion before creating\
    \ it, e.g.:\n\n```typescript\n/** Generic component */\ntype SelectProps<T> =\
    \ { items: T[] }\n\nclass Select<T> extends React.Component<SelectProps<T>, any>\
    \ { }\n\n/** Specialization */\ninterface StringSelect { new (): Select<string>\
    \ };\n\nconst StringSelect = Select as StringSelect;\n\n/** Usage */\nconst Form\
    \ = ()=> <StringSelect items={['a', 'b']} />;\n```\n\n## Useless Generic\n\nI've\
    \ seen people use generics just for the heck of it. The question to ask is *what\
    \ constraint are you trying to describe*. If you can't answer it easily you probably\
    \ have a useless generic. E.g. people have attempted to type the Node.js `require`\
    \ function as:\n\n```typescript\ndeclare function require<T>(name: string): T;\n\
    ```\n\nIn this case you can see that the type `T` is only used in one place. So\
    \ there is not constraint *between* members. You would be better off with a type\
    \ assertion in this case.\n"
  mdcn: "\n\n## ReactJS\n\nReactJS 是一个非常重视不可变性的库，将 `Props` 和 `State` 标记为不可变是一个很好的主意，例如：\n\
    \n```typescript\ninterface Props {\n  readonly foo: number;\n}\n\ninterface State\
    \ {\n  readonly bar: number;\n}\n\nexport class Something extends React.Component<Props,State>\
    \ {\n  // 你可以放心，没有人会执行\n  // this.props.foo = 123; (props 是不可变的)\n  // this.state.bar\
    \ = 456; (应该使用 this.setState)\n}\n```\n\n## 无缝不可变\n\n你甚至可以将索引签名标记为只读：\n\n```typescript\n\
    /**\n * 声明\n */\ninterface Foo {\n  readonly [x: number]: number;\n}\n\n/**\n\
    \ * 使用\n */\nlet foo: Foo = { 0: 123, 2: 345 };\nconsole.log(foo[0]); // OK（读取）\n\
    foo[0] = 456; // 错误（修改）：Readonly\n```\n\n如果你想以*不可变*的方式使用原生 JavaScript 数组，这非常棒。事实上，TypeScript\
    \ 自带了一个 `ReadonlyArray<T>` 接口，允许你执行这一操作：\n\n```typescript\nlet foo: ReadonlyArray<number>\
    \ = [1, 2, 3];\nconsole.log(foo[0]); // OK\nfoo.push(4); // 错误：ReadonlyArray 上不存在\
    \ `push` 方法，因为它会修改数组\nfoo = foo.concat([4]); // OK：创建一个副本\n```\n\n## 自动推断\n\n\
    在某些情况下，编译器可以自动推断特定项目为只读。例如，在类中，如果你有一个只有 getter 而没有 setter 的属性，它会被假设为只读，例如：\n\n\
    ```typescript\nclass Person {\n  firstName: string = \"John\";\n  lastName: string\
    \ = \"Doe\";\n  get fullName() {\n    return this.firstName + this.lastName;\n\
    \  }\n}\n\nconst person = new Person();\nconsole.log(person.fullName); // John\
    \ Doe\nperson.fullName = \"Dear Reader\"; // 错误！fullName 是只读的\n```\n\n## 与 const\
    \ 的\n\n- `const` 用于变量引用\n1. 变量不能重新赋值给其他任何。\n\n- `readonly` 用于属性\n2. 属性可以因为别名而被修改\n\
    \n解释 1 的示例：\n```typescript\nconst foo = 123; // 变量引用\nvar bar: {\n  readonly bar:\
    \ number; // 用于属性\n}\n```\n\n解释 2 的示例：\n```typescript\nlet foo: {\n  readonly\
    \ bar: number;\n} = {\n  bar: 123\n};\n\nfunction iMutateFoo(foo: { bar: number\
    \ }) {\n  foo.bar = 456;\n}\n\niMutateFoo(foo); // foo 参数被 foo 参数创建了别名\nconsole.log(foo.bar);\
    \ // 456!\n```\n\n基本上，`readonly` 确保了它*不能被我修改*，但如果你把它交给一个没有该保证的人（出于类型兼容性原因是允许的），他们就可以修改它。\n\
    \n当然，如果 `iMutateFoo` 声称他们不会修改 `foo.bar`，编译器会正确将其标记为错误，如所示：\n\n```typescript\n\
    interface Foo {\n  readonly bar: number;\n}\n\nlet foo: Foo = {\n  bar: 123\n\
    };\n\nfunction iTakeFoo(foo: Foo) {\n  foo.bar = 456; // 错误！bar 是只读的\n}\n\niTakeFoo(foo);\
    \ // foo 参数被 foo 参数创建了别名\n```\n\n## 泛型\n\n泛型的关键动机是在成员之间提供有意义的类型约束。成员可以是：\n\n-\
    \ 类成员\n- 类方法\n- 函数参数\n- 函数返回值\n\n## 动机与示例\n\n考虑简单的 `Queue`（先入先出）数据结构实现。在 TypeScript\
    \ / JavaScript 中一个简单的实现看起来如下：\n\n```typescript\nclass Queue {\n  private data\
    \ = [];\n  push = (item) => this.data.push(item);\n  pop = () => this.data.shift();\n\
    }\n```\n\n这种实现的一个问题是，它允许人们向队列中添加*任何内容*，而当他们弹出时——弹出的可能是*任何内容*。如下所示，有人可以向队列推入一个字符串，而实际使用中假设只推入过数字：\n\
    \n```typescript\nclass Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n\nconst queue = new Queue();\nqueue.push(0);\n\
    queue.push(\"1\"); // 这是一个失误\n// 一个开发者进入了酒吧\nconsole.log(queue.pop().toPrecision(1));\n\
    console.log(queue.pop().toPrecision(1)); // 运行时错误\n```\n\n一个解决方案（实际上在不支持泛型的语言中是唯一方案）是直接创建*特殊*类：\n\
    \n```typescript\nclass Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n\nclass Queue<T> {\n  private data: T[]\
    \ = [];\n  push = (item: T) => this.data.push(item);\n  pop = (): T => this.data.shift();\n\
    }\n\nconst queue = new Queue<number>();\nqueue.push(0);\n// queue.push(\"1\");\
    \ // 错误\n```\n\n## TSX 中的泛型\n\n由于 `.tsx` / `.jsx` 使用类似 `<div>` 的语法表示 JSX 块，它为泛型带来了独特的挑战。\n\
    \n**快速提示**：使用前面提到的 `as` 语法进行类型断言。\n\n## 泛型函数\n\n类似下面的运行良好：\n\n```typescript\n\
    function foo<T>(x: T): T { return x; }\n```\n\n然而，使用箭头函数则不行：\n```typescript\n\
    const foo = <T>(x: T) => x; // 错误：未关闭的标签\n```\n\n** {**：在泛型参数上使用 `extends` 来提示编译器这是一个泛型，例如：\n\
    \n```typescript\nconst foo = <T extends {}>(x: T) => x;\n```\n\n## 泛型组件\n\n由于\
    \ JSX 没有提供泛型参数的语法，你需要在创建组件之前使用类型断言对其进行特化，例如：\n\n```typescript\n/** 泛型组件 */\ntype\
    \ SelectProps<T> = { items: T[] }\n\nclass Select<T> extends React.Component<SelectProps<T>,\
    \ any> { }\n\n/** 特化 */\ninterface StringSelect { new (): Select<string> };\n\n\
    const StringSelect = Select as StringSelect;\n\n/** 使用 */\nconst Form = ()=> <StringSelect\
    \ items={['a', 'b']} />;\n```\n\n## 无用的泛型\n\n我见过人们仅仅为了用而用泛型。要问的问题是*你正在尝试描述什么样的约束*。如果你不能轻松回答，你可能有一个无用的泛型。例如，人们尝试对\
    \ Node.js 的 `require` 函数进行建模：\n\n```typescript\ndeclare function require<T>(name:\
    \ string): T;\n```\n\n在这种情况下，你可以看到类型 `T` 只在了一处使用。因此，成员之间*没有*约束。在这种情况下，使用类型断言会更好。\n\
    \n"
