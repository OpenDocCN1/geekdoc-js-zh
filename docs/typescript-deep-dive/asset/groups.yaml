    \ picking up tsconfig.json and the installed typescript\n\nversion,\n\nts-node\
    \ runs the output javascript through Node.js.\n\nNode.js QuickStart\n\n105"
- md: "\n## Creating TypeScript node modules\n\nA lesson on creating typescript node\
    \ modules\n\nUsing modules written in TypeScript is super fun as you get great\
    \ compile time safety and autocomplete (essentially executable documentation).\n\
    \nCreating a high quality TypeScript module is simple. Assume the following desired\
    \ folder structure for your package:\n\n```text\npackage\n├─ package.json\n├─\
    \ tsconfig.json\n├─ src\n│ ├─ All your source files\n│ ├─ index.ts\n│ ├─ foo.ts\n\
    │ └─ ...\n└─ lib\n  ├─ All your compiled files\n  ├─ index.d.ts\n  ├─ index.js\n\
    \  ├─ foo.d.ts\n  ├─ foo.js\n  └─ ...\n```\n\nIn your `tsconfig.json` \n- `compilerOptions:\
    \ {\"outDir\": \"lib\", \"declaration\": true}` < This generates declaration and\
    \ js files in the lib folder\n- `include: [\"./src/**\"]` < This includes all\
    \ the files from the src dir.\n\nIn your `package.json` have:\n- `\"main\": \"\
    lib/index\"` < This tells Node.js to load lib/index.js\n- `\"types\": \"lib/index\"\
    ` < This tells TypeScript to load lib/index.d.ts\n\nExample package: `npm install\
    \ typestyle` for TypeStyle\nUsage: `import { style } from 'typestyle';` will be\
    \ completely type safe.\n\nMORE:\nIf your package depends on other TypeScript\
    \ authored packages, put them in dependencies / devDependencies / peerDependencies\
    \ just like you would with raw JS packages.\n\nIf your package depends on other\
    \ JavaScript authored packages and you want to use it type safely in your project,\
    \ put their types e.g. `@types/foo` in `devDependencies`. JavaScript types should\
    \ be managed *out of bound* from the main NPM streams. The JavaScript ecosystem\
    \ breaks types without semantic versioning too commonly, so if your users need\
    \ types for these they should install the `@types/foo` version that works for\
    \ them.\n\n**Bonus points**\n\nSuch NPM modules work just fine with browserify\
    \ (using tsify) or webpack (using ts-loader).\n\nNode.js QuickStart\n\n## TypeScript\
    \ in the browser\n\nIf you are using TypeScript to create a web application here\
    \ are my recommendations:\n\n### General Machine Setup\nInstall Node.js\n\n###\
    \ Project Setup\nCreate a project dir:\n\n```bash\nmkdir your-project\ncd your-project\n\
    ```\n\nCreate `tsconfig.json`. We discuss modules here. Also good to have it setup\
    \ for tsx compilation out of the box:\n\n```json\n{\n  \"compilerOptions\": {\n\
    \    \"target\": \"es5\",\n    \"module\": \"commonjs\",\n    \"sourceMap\": true,\n\
    \    \"jsx\": \"react\"\n  },\n  \"exclude\": [\n    \"node_modules\"\n  ],\n\
    \  \"compileOnSave\": false\n}\n```\n\nCreate an npm project:\n`npm init -y`\n\
    \nInstall TypeScript-nightly, webpack, ts-loader, typings:\n`npm install typescript@next\
    \ webpack ts-loader typings --save-dev`\n\n### Browser QuickStart\nInit typings\
    \ (creates a `typings.json` file for you):\n`\"./node_modules/.bin/typings\" init`\n\
    \nCreate a `webpack.config.js` to bundle your modules into a single `bundle.js`\
    \ file that contains all your resources:\n\n```javascript\nconst path = require('path');\n\
    \nmodule.exports = {\n  entry: './src/app.tsx',\n  output: {\n    path: path.resolve(__dirname,\
    \ 'dist'),\n    filename: 'bundle.js',\n    publicPath: '/dist/'\n  },\n  resolve:\
    \ {\n    // Add `.ts` and `.tsx` as a resolvable extension.\n    extensions: ['.webpack.js',\
    \ '.web.js', '.ts', '.tsx', '.js']\n  },\n  module: {\n    loaders: [\n      //\
    \ all files with a `.ts` or `.tsx` extension will be handled by `ts-loader`\n\
    \      { test: /\\.tsx?$/, loader: 'ts-loader' }\n    ]\n  }\n}\n```\n\nSetup\
    \ an npm script to run a build. Also have it run `typings install` on `npm install`.\n\
    In your `package.json` add a `script` section:\n\n```json\n\"scripts\": {\n  \"\
    prepublish\": \"typings install\",\n  \"watch\": \"webpack --watch\"\n}\n```\n\
    \nNow just run the following (in the directory that contains `webpack.config.js`):\n\
    `npm run watch`\n\n(Note: The provided OCR text contains some fragmented and repetitive\
    \ sections in the later pages, but the logical flow follows the setup described\
    \ above.)\n"
  mdcn: "\n\n## 创建 TypeScript Node 模块\n\n一个关于创建 TypeScript Node 模块的教程\n\n使用 TypeScript\
    \ 编写的模块非常有趣，因为你可以获得极佳的编译安全性和自动补全（本质上是可执行的文档）。\n\n创建一个高质量的 TypeScript 模块非常简单。假设你的包期望目录结构如下：\n\
    \n```text\npackage\n├─ package.json\n├─ tsconfig.json\n├─ src\n│ ├─ 所有的源文件\n│\
    \ ├─ index.ts\n│ ├─ foo.ts\n│ └─ ...\n└─ lib\n  ├─ 所有的编译文件\n  ├─ index.d.ts\n\
    \  ├─ index.js\n  ├─ foo.d.ts\n  ├─ foo.js\n  └─ ...\n```\n\n在你的 `tsconfig.json`\
    \ 中：\n- `compilerOptions: {\"outDir\": \"lib\", \"declaration\": true}` < 这会在\
    \ lib 文件夹生成生成文件和 js 文件\n- `include: [\"./src/**\"]` < 这包含了 src 目录下的所有文件。\n\n在你的\
    \ `package.json` 中包含：\n- `\"main\": \"lib/index\"` < 这告诉 Node.js 加载 lib/index.js\n\
    - `\"types\": \"lib/index\"` < 这告诉 TypeScript 加载 lib/index.d.ts\n\n示例包：`npm install\
    \ typestyle` 用于 TypeStyle\n用法：`import { style } from 'typestyle';` 将是完全类型安全的。\n\
    \n更多：\n如果你的包依赖于其他用 TypeScript 编写的包，就像处理原生 JS 包一样将它们放入 `dependencies` / `devDependencies`\
    \ / `peerDependencies`。\n\n如果你的包依赖于其他用 JavaScript 编写的包，并且你想在项目中安全地使用它们，请将它们的类型（例如\
    \ `@types/foo`）放在 `devDependencies` 中。JavaScript 类型应该在主 NPM 流*之外*进行管理。JavaScript\
    \ 生态系统经常在没有语义化版本的情况下破坏类型，因此如果你的用户需要这些类型，他们应该安装适用于他们的 `@types/foo` 版本。\n\n**加分项**\n\
    \n此类 NPM 模块与 browserify（使用 tsify）或 webpack（使用 ts-loader）配合运行良好。\n\nNode.js 快速上手\n\
    \n## 浏览器中的 TypeScript\n\n如果你正在使用 TypeScript 创建 Web ，这里是我的建议：\n\n### 通用机器设置\n安装\
    \ Node.js\n\n### 项目设置\n创建项目目录：\n\n```bash\nmkdir your-project\ncd your-project\n\
    ```\n\n创建 `tsconfig.json`。我们在这里讨论模块。此外，配置好开箱即可用于 tsx 编译也是好的：\n\n```json\n{\n \
    \ \"compilerOptions\": {\n    \"target\": \"es5\",\n    \"module\": \"commonjs\"\
    ,\n    \"sourceMap\": true,\n    \"jsx\": \"react\"\n  },\n  \"exclude\": [\n\
    \    \"node_modules\"\n  ],\n  \"compileOnSave\": false\n}\n```\n\n创建一个 npm 项目：\n\
    `npm init -y`\n\n安装 TypeScript-nightly, webpack, ts-loader, typings：\n`npm install\
    \ typescript@next webpack ts-loader typings --save-dev`\n\n### 浏览器快速上手\n初始化 typings（为你创建一个\
    \ `typings.json` 文件）：\n`\"./node_modules/.bin/typings\" init`\n\n创建一个 `webpack.config.js`\
    \ 将你的模块打包成一个单一的 `bundle.js` 文件，该文件包含你所有的资源：\n\n```javascript\nconst path = require('path');\n\
    \nmodule.exports = {\n  entry: './src/app.tsx',\n  output: {\n    path: path.resolve(__dirname,\
    \ 'dist'),\n    filename: 'bundle.js',\n    publicPath: '/dist/'\n  },\n  resolve:\
    \ {\n    // 将 `.ts` 和 `.tsx` 作为可解析的扩展。\n    extensions: ['.webpack.js', '.web.js',\
    \ '.ts', '.tsx', '.js']\n  },\n  module: {\n    loaders: [\n      // 所有带有 `.ts`\
    \ 或 `.tsx` 扩展的文件将由 ts-loader 处理\n      { test: /\\.tsx?$/, loader: 'ts-loader'\
    \ }\n    ]\n  }\n}\n```\n\n设置一个 npm 脚本来运行构建。在 `npm install` 时运行 `typings install`。\n\
    在你的 `package.json` 中添加 `script` 部分：\n\n```json\n\"scripts\": {\n  \"prepublish\"\
    : \"typings install\",\n  \"watch\": \"webpack --watch\"\n}\n```\n\n现在只需运行以下命令（在包含\
    \ `webpack.config.js` 的目录中）：\n`npm run watch`\n\n（注：提供的 OCR 文本在后期页面包含一些碎片和重复的部分，但逻辑流遵循上述设置。）"
