  - '[PAGE 125]


    **Ambient Declarations**


    As we mentioned in why TypeScript:


    A major design goal of TypeScript was to make it possible for you to safely and
    easily


    use existing JavaScript libraries in TypeScript. TypeScript does this by means
    of


    *declaration*.


    Ambient declarations allow you to *safely use existing popular JavaScript libraries*
    and


    *incrementally migrate your JavaScript/CoffeeScript/Other-Compile-To-Js-Language
    project*


    *to TypeScript*.


    Studying patterns in ambient declarations for *third party JavaScript code* is
    good practice for


    annotating *your* TypeScript code base as well. This is why we present it so early
    on.


    Ambient Declarations


    126'
  - "[PAGE 126]\n\n**Declaration file**\n\nYou can tell TypeScript that you are trying\
    \ to describe code that exists elsewhere (e.g.\n\nwritten in JavaScript/CoffeeScript/The\
    \ runtime environment like the browser or Node.js)\n\nusing the  declare  keyword.\
    \ As a quick example:\n\nfoo = 123; // Error: \\`foo\\` is not defined\n\nvs.\n\
    \ndeclare var foo: any;\n\nfoo = 123; // allowed\n\nYou have the option of putting\
    \ these declarations in a  .ts  file or in a  .d.ts  file. We highly\n\nrecommend\
    \ that in your real world projects you use a separate  .d.ts  (start with one\
    \ called\n\nsomething like  globals.d.ts  or  vendor.d.ts ).\n\nIf a file has\
    \ the extension  .d.ts  then each root level definition must have the  declare\
    \ \n\nkeyword prefixed to it. This helps make it clear to the author that there\
    \ will be *no code*\n\n*emitted by TypeScript*. The author needs to ensure that\
    \ the declared item will exist at\n\nruntime.\n\nAmbient declarations is a promise\
    \ that you are making with the compiler. If these\n\ndo not exist at runtime and\
    \ you try to use them, things will break without warning.\n\nAmbient declarations\
    \ are like docs. If the source changes the docs need to be kept\n\nupdated. So\
    \ you might have new behaviours that work at runtime but no one's\n\nupdated the\
    \ ambient declaration and hence you get compiler errors.\n\nDeclaration Files\n\
    \n127"
  - "[PAGE 127]\n\n**Variables**\n\nFor example to tell TypeScript about the  process\
    \  variable you *can* do:\n\ndeclare var process: any;\n\nYou don't *need* to\
    \ do this for  process  as there is already a community maintained\n\n node.d.ts\
    \ .\n\nThis allows you to use the  process  variable without TypeScript complaining:\n\
    \nprocess.exit();\n\nWe recommend using an interface wherever possible e.g.:\n\
    \ninterface Process {\n\n exit(code?: number): void;\n\n}\n\ndeclare var process:\
    \ Process;\n\nThis allows other people to *extend* the nature of these global\
    \ variables while still telling\n\nTypeScript about such modifications. E.g. consider\
    \ the following case where we add an\n\n exitWithLogging  function to process\
    \ for our amusement:\n\ninterface Process {\n\n exitWithLogging(code?: number):\
    \ void;\n\n}\n\nprocess.exitWithLogging = function() {\n\n console.log(\"exiting\"\
    );\n\n process.exit.apply(process, arguments);\n\n};\n\nLet's look at interfaces\
    \ in a bit more detail next.\n\nVariables\n\n128"
  - "[PAGE 128]\n\n**Interfaces**\n\nInterfaces have *zero* runtime JS impact. There\
    \ is a lot of power in TypeScript interfaces to\n\ndeclare the structure of variables.\n\
    \nThe following two are equivalent declarations, the first uses an *inline annotation*,\
    \ the second\n\nuses an *interface*:\n\n// Sample A\n\ndeclare var myPoint: {\
    \ x: number; y: number; };\n\n// Sample B\n\ninterface Point {\n\n x: number;\
    \ y: number;\n\n}\n\ndeclare var myPoint: Point;\n\nHowever the beauty of *Sample\
    \ B* is that if someone authors a library that builds on the\n\n myPoint  library\
    \ to add new members, they can easily add to the existing declaration of\n\n myPoint\
    \ :\n\n// Lib a.d.ts\n\ninterface Point {\n\n x: number; y: number;\n\n}\n\ndeclare\
    \ var myPoint: Point;\n\n// Lib b.d.ts\n\ninterface Point {\n\n z: number;\n\n\
    }\n\n// Your code\n\nvar myPoint.z; // Allowed!\n\nThis is because **interfaces\
    \ in TypeScript are open ended**. This is a vital tenet of\n\nTypeScript that\
    \ it allows you to mimic the extensibility of JavaScript using *interfaces*.\n\
    \n**Classes can implement interfaces**\n\nIf you want to use *classes* that must\
    \ follow an object structure that someone declared for you\n\nin an  interface\
    \  you can use the  implements  keyword to ensure compatibility:\n\nInterfaces\n\
    \n129"
- md: "\ninterface Point {\n  x: number; y: number;\n}\n\nclass MyPoint implements\
    \ Point {\n  x: number; y: number; // Same as Point\n}\n\nBasically in the presence\
    \ of that `implements` any changes in that external Point interface will result\
    \ in a compile error in your code base so you can easily keep it in sync:\n\n\
    interface Point {\n  x: number; y: number;\n  z: number; // New member\n}\n\n\
    class MyPoint implements Point { // ERROR : missing member `z`\n  x: number; y:\
    \ number;\n}\n\nNote that `implements` restricts the structure of the class *instances*\
    \ i.e.:\n\nvar foo: Point = new MyPoint();\n\nAnd stuff like `foo: Point = MyPoint`\
    \ is not the same thing.\n\n**TIPs**\n\n**Not every interface is implementable\
    \ easily**\n\nInterfaces are designed to declare *any arbitrarily crazy* structure\
    \ that might be present in JavaScript.\n\nConsider the following interface where\
    \ something is callable with `new`:\n\ninterface Crazy {\n  new (): {\n    hello:\
    \ number;\n  };\n}\n\nYou would essentially have something like:\n\nclass CrazyClass\
    \ implements Crazy {\n  constructor() {\n    return { hello: 123 };\n  }\n}\n\n\
    // Because\nconst crazy = new CrazyClass(); // crazy would be {hello:123}\n\n\
    You can *declare* all the crazy JS out there with interfaces and even use them\
    \ safely from TypeScript. Doesn't mean you can use TypeScript classes to implement\
    \ them.\n\n**Enums**\n\n- Enums and numbers\n- Enums and strings\n- Changing the\
    \ number associated with an enum\n- Enums are open ended\n- Enums as flags\n-\
    \ Const enums\n- Enum with static functions\n\n**Enums**\n\nAn enum is a way to\
    \ organize a collection of related values. Many other programming languages (C/C#/Java)\
    \ have an `enum` data type but JavaScript does not. However TypeScript does. Here\
    \ is an example definition of a TypeScript enum:\n\nenum CardSuit {\n  Clubs,\n\
    \  Diamonds,\n  Hearts,\n  Spades\n}\n\n// Sample usage\nvar card = CardSuit.Clubs;\n\
    \n// Safety\ncard = \"not a member of card suit\"; // Error : string is not assignable\
    \ to type `CardSuit`\n\n**Enums and Numbers**\n\nTypeScript enums are number based.\
    \ This means that numbers can be assigned to an instance of the enum, and so can\
    \ anything else that is compatible with `number`.\n\nenum Color {\n  Red,\n  Green,\n\
    \  Blue\n}\n\nvar col = Color.Red;\ncol = 0; // Effectively same as Color.Red\n\
    \n**Enums and Strings**\n\nBefore we look further into enums let's look at the\
    \ JavaScript that it generates, here is a sample TypeScript:\n\nenum Tristate\
    \ {\n  False,\n  True,\n  Unknown\n}\n\ngenerates the following JavaScript:\n\n\
    ```javascript\nvar Tristate;\n(function (Tristate) {\n  Tristate[Tristate[\"False\"\
    ] = 0] = \"False\";\n  Tristate[Tristate[\"True\"] = 1] = \"True\";\n  Tristate[Tristate[\"\
    Unknown\"] = 2] = \"Unknown\";\n})(Tristate || (Tristate = {}));\n```\n\nLet's\
    \ focus on the line `Tristate[Tristate[\"False\"] = 0] = \"False\";`. Within it\
    \ `Tristate[\"False\"] = 0` should be self explanatory, i.e. sets \"False\" member\
    \ of `Tristate` variable to be 0. Note that in JavaScript the assignment operator\
    \ returns the assigned value (in this case 0). Therefore the next thing executed\
    \ by the JavaScript runtime is `Tristate[0] = \"False\"`. This means that you\
    \ can use the `Tristate` variable to convert a string version of the enum to a\
    \ number or a number version of the enum to a string. This is demonstrated below:\n\
    \n```typescript\nenum Tristate {\n  False,\n  True,\n  Unknown\n}\nconsole.log(Tristate[0]);\
    \ // \"False\"\nconsole.log(Tristate[\"False\"]); // 0\nconsole.log(Tristate[Tristate.False]);\
    \ // \"False\" because Tristate.False == 0\n```**Changing the number associated\
    \ with an Enum**\n\nBy default enums are 0 based and then each subsequent value\
    \ increments by 1 automatically. As an example consider the following:\n\n```typescript\n\
    enum Color {\n  Red, // 0\n  Green, // 1\n  Blue // 2\n}\n```\n\nHowever you can\
    \ change the number associated with any enum member by assigning to it specifically.\
    \ This is demonstrated below where we start at 3 and start incrementing from there:\n\
    \n```typescript\nenum Color {\n  DarkRed = 3, // 3\n  DarkGreen, // 4\n  DarkBlue\
    \ // 5\n}\n```\n\nTIP: I quite commonly initialize the first enum with `= 1` as\
    \ it allows me to do a safe truthy check on an enum value.\n\n**Enums are open\
    \ ended**\n\nHere is the generated JavaScript for an enum shown again:\n\n```javascript\n\
    var Tristate;\n(function (Tristate) {\n  Tristate[Tristate[\"False\"] = 0] = \"\
    False\";\n  Tristate[Tristate[\"True\"] = 1] = \"True\";\n  Tristate[Tristate[\"\
    Unknown\"] = 2] = \"Unknown\";\n})(Tristate || (Tristate = {}));\n```\n\nWe already\
    \ explained the `Tristate[Tristate[\"False\"] = 0] = \"False\";` portion. Now\
    \ notice the surrounding code `(function (Tristate) { /*code here */ })(Tristate\
    \ || (Tristate = {}));` specifically the `(Tristate || (Tristate = {}));` portion.\
    \ This basically captures a local variable `TriState` that will either point to\
    \ an already defined `Tristate` value or initialize it with a new empty `{}` object.\n\
    \nThis means that you can split (and extend) an enum definition across multiple\
    \ files. For example below we have split the definition for `Color` into two blocks:\n\
    \n```typescript\nenum Color {\n  Red,\n  Green,\n  Blue\n}\nenum Color {\n  DarkRed\
    \ = 3,\n  DarkGreen,\n  DarkBlue\n}\n```\n\nNote that you *should* reinitialize\
    \ the first member (here `DarkRed = 3`) in a continuation of an enum.\n\n**Enums\
    \ as flags**\n\nOne excellent use of enums is the ability to use enums as flags.\
    \ Consider the following example:\n\n```typescript\nenum Flags {\n  None = 0,\n\
    \  Claws = 1,\n  Fly = 2,\n  EatsFish = 4,\n  All = 7\n}\n\nlet myFlags: Flags\
    \ = Flags.Claws | Flags.Fly;\nif (myFlags & Flags.Claws) {\n  console.log(\"has\
    \ claws\");\n}\nif (myFlags & Flags.Fly) {\n  console.log(\"can fly\");\n}\n```\n"
  mdcn: "\n\ninterface Point {\n  x: number; y: number;\n}\n\nclass MyPoint implements\
    \ Point {\n  x: number; y: number; // 与 Point 相同\n}\n\n基本上，由于存在 `implements` 关键字，该外部\
    \ `Point` 接口的任何更改都会导致你的代码库出现编译错误，因此你可以轻松地保持它们同步：\n\ninterface Point {\n  x: number;\
    \ y: number;\n  z: number; // 新成员\n}\n\nclass MyPoint implements Point { // 错误：缺少成员\
    \ `z`\n  x: number; y: number;\n}\n\n注意 `implements` 限制了类*实例*的结构，例如：\n\nvar foo:\
    \ Point = new MyPoint();\n\n而像 `foo: Point = MyPoint` 这样的并不是一回事。\n\n**提示 (TIPs)**\n\
    \n**并不是每个接口都能轻松实现**\n\n接口的设计是为了声明 JavaScript 中可能存在的*任意疯狂的*结构。\n\n考虑以下接口，其中某些内容可以通过\
    \ `new` 进行调用：\n\ninterface Crazy {\n  new (): {\n    hello: number;\n  };\n}\n\
    \n你本质上会拥有这样的代码：\n\nclass CrazyClass implements Crazy {\n  constructor() {\n  \
    \  return { hello: 123 };\n  }\n}\n\n// 因为\nconst crazy = new CrazyClass(); //\
    \ crazy 将是 {hello:123}\n\n你可以用接口来*声明*所有那些疯狂的 JS 结构，并从 TypeScript 安全地使用它们。这并不意味着你可以使用\
    \ TypeScript 类来实现它们。\n\n**枚举 (Enums)**\n\n- 枚举与数字\n- 枚举与字符串\n- 修改与枚举关联的数字\n- 枚举是开放的\n\
    - 作为标志的枚举\n- 常量枚举\n- 带有静态函数的枚举\n\n**枚举 (Enums)**\n\n枚举是组织相关值集合的一种。许多其他编程语言（C/C#/Java）都有\
    \ `enum` 数据类型，但 JavaScript 没有。然而，TypeScript 有。这里是一个 TypeScript 枚举的定义示例：\n\nenum\
    \ CardSuit {\n  Clubs,\n  Diamonds,\n  Hearts,\n  Spades\n}\n\n// 示例\nvar card\
    \ = CardSuit.Clubs;\n\n// 安全性\ncard = \"not a member of card suit\"; // 错误：string\
    \ 赋值给类型 `CardSuit`\n\n**枚举与数字 (Enums and Numbers)**\n\nTypeScript 枚举是基于数字的。这意味着数字可以赋值给枚举的实例，任何与\
    \ `number` 兼容的内容也是如此。\n\nenum Color {\n  Red,\n  Green,\n  Blue\n}\n\nvar col\
    \ = Color.Red;\ncol = 0; // 实际上等同于 Color.Red\n\n**枚举与字符串 (Enums and Strings)**\n\
    \n在进一步研究枚举之前，让我们先看看它生成的 JavaScript，这里有一个 TypeScript 示例：\n\nenum Tristate {\n \
    \ False,\n  True,\n  Unknown\n}\n\n生成了以下 JavaScript：\n\n```javascript\nvar Tristate;\n\
    (function (Tristate) {\n  Tristate[Tristate[\"False\"] = 0] = \"False\";\n  Tristate[Tristate[\"\
    True\"] = 1] = \"True\";\n  Tristate[Tristate[\"Unknown\"] = 2] = \"Unknown\"\
    ;\n})(Tristate || (Tristate = {}));\n```\n\n让我们关注 `Tristate[Tristate[\"False\"\
    ] = 0] = \"False\";` 这一行。在其中 `Tristate[\"False\"] = 0` 应该是显而易见的，即将 `Tristate`\
    \ 变量的 \"False\" 成员设置为 0。注意在 JavaScript 中，赋值运算符返回被赋值的值（在这种情况下为 0）。因此，JavaScript\
    \ 运行时执行的下一条是 `Tristate[0] = \"False\"`。这意味着你可以使用 `Tristate` 变量将枚举的字符串版本转换为数字，或将枚举的数字版本转换为字符串。如下：\n\
    \n```typescript\nenum Tristate {\n  False,\n  True,\n  Unknown\n}\nconsole.log(Tristate[0]);\
    \ // \"False\"\nconsole.log(Tristate[\"False\"]); // 0\nconsole.log(Tristate.False);\
    \ // \"False\" 因为 Tristate.False == 0\n```\n\n**枚举是开放的 (Enums are open ended)**\n\
    \n再次显示枚举的生成的 JavaScript：\n\n```javascript\nvar Tristate;\n(function (Tristate)\
    \ {\n  Tristate[Tristate[\"False\"] = 0] = \"False\";\n  Tristate[Tristate[\"\
    True\"] = 1] = \"True\";\n  Tristate[Tristate[\"Unknown\"] = 2] = \"Unknown\"\
    ;\n})(Tristate || (Tristate = {}));\n```\n\n我们已经解释了 `Tristate[Tristate[\"False\"\
    ] = 0] = \"False\";` 部分。现在注意周围的代码 `(function (Tristate) { /*此处代码 */ })(Tristate\
    \ || (Tristate = {}));`，特别是 `(Tristate || (Tristate = {}));` 部分。这基本上捕获了一个局部变量\
    \ `TriState`，它要么指向已定义的 `Tristate` 值，要么初始化一个新的空 `{}` 对象。\n\n这意味着你可以在多个文件中拆分（并扩展）枚举定义。例如下面我们将\
    \ `Color` 的定义分成了两个块：\n\n```typescript\nenum Color {\n  Red,\n  Green,\n  Blue\n\
    }\nenum Color {\n  DarkRed = 3,\n  DarkGreen,\n  DarkBlue\n}\n```\n\n注意，在枚举的延续中你*应该*重新初始化第一个成员（这里是\
    \ `DarkRed = 3`）。\n\n**修改与枚举关联的数字 (Changing the number associated with an enum)**\n\
    \n默认情况下，枚举是从 0 开始的，随后的值会自动递增。作为一个示例，考虑：\n\n```typescript\nenum Color {\n  Red,\
    \ // 0\n  Green, // 1\n  Blue // 2\n}\n```\n\n然而，你可以通过赋值来更改任何枚举成员的数字。下面展示了我们从\
    \ 3 开始递增：\n\n```typescript\nenum Color {\n  DarkRed = 3, // 3\n  DarkGreen, //\
    \ 4\n  DarkBlue // 5\n}\n```\n\n提示：我经常初始化第一个枚举为 `= 1`因为它允许枚举枚举枚举真值检查。\n\n**作为标志的枚举\
    \ (Enums as flags)**\n\n枚举的一个极佳用途是可以将枚举作为标志使用。考虑以下示例：\n\n```typescript\nenum Flags\
    \ {\n  None = 0,\n  Claws = 1,\n  Fly = 2,\n  EatsFish = 4,\n  All = 7\n}\n\n\
    let myFlags: Flags = Flags.Claws | Flags.Fly;\nif (myFlags & Flags.Claws) {\n\
    \  console.log(\"has claws\");\n}\nif (myFlags & Flags.Fly) {\n  console.log(\"\
    can fly\");\n}\n```\n\n"
