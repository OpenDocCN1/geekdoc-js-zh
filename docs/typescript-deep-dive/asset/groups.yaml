    \n## 变异\n\n变异是一个易于理解且对兼容性分析重要的概念。对于简单类型 Base 和 Child，如果 Child 是 Base 的子类，那么 Child\
    \ 的实例就可以赋值给类型为 Base 的变量。这是多态的基础。\n\n"
