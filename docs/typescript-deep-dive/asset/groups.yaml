    \  funcs[j]();\n}\n\n人们可能会预期的结果是 0, 1, 2。惊讶的是，这三个函数的结果都将 3。原因是这三个函数都在使用外部作用域的变量\
    \ `i`，而在我们执行它们（在第二个循环中）时，`i` 的值已经是 3 了（这是第一个循环的终止条件）。\n\n修复方法是在每次循环中创建一个特定于该迭代的新变量。正如我们之前学过的，我们可以通过创建一个新函数并立即执行它来创建一个新的变量作用域（即类中的\
    \ IIFE 模式 `(function() { /* body */ })(); )`），如下所示：\n\nvar funcs = [];\n\n// 创建一组函数\n\
    \nfor (var i = 0; i < 3; i++) {\n  (function() {\n    var local = i;\n    funcs.push(function()\
    \ {\n      console.log(local);\n    })\n  })();\n}\n\n// 调用它们\n\nfor (var j =\
    \ 0; j < 3; j++) {\n  funcs[j]();\n}\n\n在这里，函数闭包了 *local* 变量（方便地命名为 local），并使用它而不是循环变量\
    \ `i`。\n\n请注意，闭包会带来性能影响（它们需要存储周围的状态）。\n\n循环中 ES6 的 `let` 关键字行为将与上一个示例相同：\n\n```javascript\n\
    var funcs = [];\n\n// 创建一组函数\n\nfor (let i = 0; i < 3; i++) { // 注意使用了 let\n \
    \ funcs.push(function() {\n    console.log(i);\n  })\n}\n\n// 调用它们\n\nfor (var\
    \ j = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\n使用 `let` 代替 `var` 会为每个循环迭代创建一个创建一个唯一的变量\
    \ `i`。\n\n**总结**\n\n对于绝大多数代码来说，`let` 是极其有用的。它可以极大地提高代码的可读性，并减少编程错误的概率。\n\n**const**\n\
    \n`const` 是 ES6 / TypeScript 提供的一个非常受欢迎的补充。它允许你使变量不可变。这从文档记录和运行的角度来看都是好的。使用 `const`\
    \ 只需将 `var` 替换为 `const`：\n\n```javascript\nconst foo = 123;\n```\n\n这种语法（在我看来）比其他语言要好得多，那些语言强制用户输入类似\
    \ `let constant foo`（即 变量 + 行为指示符）的内容。`const` 是提高可读性和可维护性的良好实践，并避免了使用*魔法字面量*，例如：\n\
    \n```javascript\n// 可读性低\nif (x > 10) {\n}\n\n// 更好！\nconst maxRows = 10;\nif\
    \ (x > maxRows) {\n}\n```\n\n**const 声明必须初始化**\n\n以下是编译错误：\n\n```javascript\n\
    const foo; // 错误：const 声明必须初始化\n```\n\n**赋值左侧不能是常量**\n\n常量在创建后是不可变的，因此如果你尝试给它们分配新值，将是编译错误：\n\
    \n```javascript\nconst foo = 123;\nfoo = 456; // 错误：赋值表达式的左侧不能是常量\n```\n\n**块作用域**\n\
    \n`const` 是块级作用域，正如我们看到的 `let` 一样：\n\n```javascript\nconst foo = 123;\nif (true)\
    \ {\n  const foo = 456; // 允许，因为它是限于此 `if` 块的新变量\n}\n```\n\n**深度不可变**\n\n`const`\
    \ 同样适用于对象字面量，只要涉及到保护变量的*引用*：\n\n```javascript\nconst foo = { bar: 123 };\nfoo\
    \ = { bar: 456 }; // 错误：赋值表达式的左侧不能是常量\n```\n\n但它仍然允许对象的子属性被修改，如下所示：\n\n```javascript\n\
    const foo = { bar: 123 };\nfoo.bar = 456; // 允许！\nconsole.log(foo); // { bar:\
    \ 456 }\n```\n\n出于这个原因，我建议对原始类型或不可变数据结构使用 `const`。\n\n![](img/416f69818aa79e3f1fe0e7869c118431_45_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_45_1.png)\n\
    \n**解构**\n\nTypeScript 支持以下形式的解构（字面意思命名为解构化，即拆分结构）：\n\n1. 对象解构\n2. 数组解构\n\n很容易将解构想为*结构化*的逆过程。JavaScript\
    \ 中的*结构化*方法是对象字面量：\n\n```javascript\nvar foo = {\n  bar: {\n    bas: 123\n  }\n\
    };\n```\n\n如果没有 JavaScript 内置的强大的*结构化*支持，动态创建新对象将非常繁琐。解构为从结构中提取数据带来了同等的便利性。\n\n\
    **对象解构**\n\n解构之所以有用，是因为它允许你在单行内完成原本需要多行才能完成。考虑以下情况：\n\n```javascript\nvar rect\
    \ = { x: 0, y: 10, width: 15, height: 20 };\n\n// 解构赋值\nvar {x, y, width} = rect;\n\
    console.log(x, y, width); // 0, 10, 15\n\n// 使用外部括号赋值给现有变量\nrect.x = 10;\nconsole.log(x,\
    \ y, width); // 10, 15, 20\n```\n\n要将提取的变量分配给新名称，你可以采取操作：\n\n```javascript\nconst\
    \ obj = {\"some property\": \"value\"};\n// 解构\nconst {someProperty} = obj;\n\
    console.log(someProperty === \"value\"); // true\n```\n\n此外，你还可以使用解构从结构中获取*深度*数据。如下例所示：\n\
    \n```javascript\nvar foo = { bar: { bas: 123 } };\nvar {bar} = foo; // 实际上是 var\
    \ = foo.bar;\n```\n\n**数组解构**\n\n一个常见问题是：如何从数组中提取元素？使用剩余参数：\n\n```javascript\n\
    var [x, y, ...rest] = [1, 2, 3, 4];\nconsole.log(x, y, rest); // 1, 2, [3, 4]\n\
    ```\n\n**数组解构（剩余参数）**\n\n这里是为了允许你在解构时轻松获取数组的剩余元素：\n\n```javascript\nvar [x, y,\
    \ ...rest] = [1, 2, 3, 4];\nconsole.log(x, y, rest); // 1, 2, [3, 4]\n```\n\n\
    **数组解构（忽略项）**\n\n你可以通过留空位置来忽略某些索引：\n\n```javascript\nvar [x, , y] = [1, 2, 3];\n\
    console.log(x, y); // 1, 3\n```\n\n**对象解构（剩余参数）**\n\n你可以使用对象解构剩余参数来获取剩余对象：\n\n\
    ```javascript\nconst {a, ...rest} = {a: 1, b: 2, c: 3};\nconsole.log(a, rest);\
    \ // 1, {b: 2, c: 3}\n```\n\n**对象解构（忽略属性）**\n\n你可以通过留空键名来忽略某些属性：\n\n```javascript\n\
    const {a, , c} = {a: 1, b: 2, c: 3};\nconsole.log(a, c); // 1, 3\n```\n\n"
