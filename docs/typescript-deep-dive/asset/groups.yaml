    \ Error Reporting\n- Emitter\n- Emitter Functions\n- Emitter SourceMaps\n- Contributing\n\
    \n## TypeScript Deep Dive\n\nI've been looking at the issues that turn up commonly\
    \ when people start using TypeScript. This is based on the lessons from StackOverflow\
    \ and general engagement with the TypeScript community. You can follow for updates\
    \ and don't forget to ★ on Github.\n\n## Getting Started with TypeScript\n\nTypeScript\
    \ compiles into JavaScript. JavaScript is what you are going to execute (either\
    \ in the browser or on the server). So you are going to need the following:\n\n\
    - TypeScript compiler (available in source and on NPM)\n- TypeScript editor (you\
    \ can use notepad if you want but I use VS. Also lots of other editors support\
    \ it as well)\n\n## TypeScript Version\n\nInstead of using the *stable* TypeScript\
    \ compiler we will be presenting a lot of new stuff in this book that may not\
    \ be associated with a version number yet. I generally recommend people to use\
    \ the nightly version because **the compiler test suite catches more bugs over\
    \ time**.\n\nYou can install it on the command line as:\n\n```bash\nnpm install\
    \ -g typescript@next\n```\n\nAnd now the command line `tsc` will be the latest\
    \ and greatest. Various IDEs support it too, e.g., VS Code always ships with the\
    \ latest TypeScript version. You can ask VS Code to use this version by creating\
    \ `.vscode/settings.json` with the following contents:\n\n```json\n{\n  \"typescript.tsdk\"\
    : \"./node_modules/typescript/lib\"\n}\n```\n\n## Getting the Source Code\n\n\
    The source for this book is available in the books github repository: https://github.com/basarat/typescript-book/tree/master/code\
    \ most of the code samples can be copied into your editor and you can play with\
    \ them as is. For code samples that need additional setup (e.g. npm modules),\
    \ we will link you to the code sample before presenting the code.\n\nExample:\n\
    \n`// This will be the code under discussion`\n\nWith a dev setup out of the way\
    \ let's jump into TypeScript syntax.\n\n## Why TypeScript\n\nThere are two main\
    \ goals of TypeScript:\n\n1. Provide an *optional type system* for JavaScript.\n\
    2. Provide planned features from future JavaScript editions to current JavaScript\
    \ engines\n\nThe desire for these goals is motivated below.\n\n## The TypeScript\
    \ type system\n\nYou might be wondering \"**Why add types to JavaScript?**\" Types\
    \ have proven ability to enhance code quality and understandability. Large teams\
    \ (google, microsoft, facebook) have continually arrived at this conclusion. Specifically:\n\
    \n- Types increase your agility when doing refactoring. *It's better for the compiler\
    \ to catch errors than to have things fail at runtime*.\n- Types are one of the\
    \ best forms of documentation you can have. *The function signature is a theorem\
    \ and the function body is the proof*.\n\nHowever types have a way of being unnecessarily\
    \ ceremonious. TypeScript is very particular about keeping the barrier to entry\
    \ as low as possible. Here's how:\n\n## Your JavaScript is TypeScript\n\nTypeScript\
    \ provides compile time type safety for your JavaScript code. This is no surprise\
    \ given its name. The great thing is that the types are completely optional. Your\
    \ JavaScript code `.js` file can be renamed to a `.ts` file and TypeScript will\
    \ still give you valid `.js` equivalent to the original JavaScript file. TypeScript\
    \ is *intentionally* and strictly a superset of JavaScript with optional Type\
    \ checking.\n\n## Types can be Implicit\n\nTypeScript will try to infer as much\
    \ of the type information as it can in order to give you type safety with minimal\
    \ cost of productivity during code development. For example, in the following\
    \ example TypeScript will know that `foo` is of type `number` below and will give\
    \ an error on the second line:\n\n## Reviews\n\n- I've been looking at the issues\
    \ that turn up commonly when people start using TypeScript. Thanks for the wonderful\
    \ book.\n- I've learned a lot from it.\n- It's probably the best book out there.\n\
    - Love how precise and clear the examples are!\n- For the low price of free, you\
    \ get pages of source code and clear, concise explanations, TypeScript Dive will\
    \ help you development.\n- Just a big thank you! This git got my project going\
    \ pronto. I recommend the online book by basarat you'll love it.\n- I've always\
    \ found this by basarat really helpful.\n- We must highlight TypeScript, an open\
    \ source book.\n- Great online resource for learning.\n- Thank you for putting\
    \ this book together, and for all your work within the community.\n- TypeScript\
    \ Deep Dive is one of the best technical texts I've read in while.\n- Help me\
    \ a lot with my first project.\n- Thanks to basarat for this great TypeScript\
    \ Deep Book.\n- Thank you for writing TypeScript Dive I have learned so much.\n\
    - I find it very insightful.\n- Deep dive to typescript is awesome in many levels.\n\
    - This is based on the lessons from StackOverflow basarat.gitbooks.io/typescript/\
    \ loaded with great recipes!\n\n## Get Started\n\nIf you are here to read the\
    \ book online:\n\n## Other Options\n\nYou can also download one of the following:\n\
    \n- EPUB for iPad, iPhone, Mac\n- PDF for Windows and others\n- MOBI for Kindle\n\
    \n## Special Thanks\n\nAll the amazing contributors are of great value. Thanks,\
    \ this is a great book.\n\n## Share\n\nURL: http://basarat.gitbooks.io/typescript/\n"
