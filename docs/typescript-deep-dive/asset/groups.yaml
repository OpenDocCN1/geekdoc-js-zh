  - "[PAGE 282]\n\n**Parser Functions**\n\nAs mentioned  parseSourceFile  sets up\
    \ the initial state and passes the work onto\n\n parseSourceFileWorker  function.\n\
    \n** parseSourceFileWorker **\n\nStarts by creating a  SourceFile  AST node. Then\
    \ it goes into parsing source code starting\n\nfrom the  parseStatements  function.\
    \ Once that returns, it then completes the  SourceFile \n\nnode with additional\
    \ information such as its  nodeCount ,  identifierCount  and such.\n\n** parseStatements\
    \ **\n\nOne of the most significant  parseFoo  style functions (a concept we cover\
    \ next). It switches\n\nby the the current  token  returned from the scanner.\
    \ E.g. if the current token is a\n\n SemicolonToken  it will call out to  parseEmptyStatement\
    \  to create an AST node for an empty\n\nstatement.\n\n**Node creation**\n\nThe\
    \ parser has a bunch of  parserFoo  functions with bodies that create  Foo  nodes.\
    \ These\n\nare generally called (from other parser functions) at a time where\
    \ a  Foo  node is expected.\n\nA typical sample of this process is the  parseEmptyStatement()\
    \  function which is used to\n\nparse out empty statements like  ;;;;;; . Here\
    \ is the function in its entirety\n\nfunction parseEmptyStatement(): Statement\
    \ {\n\n let node = <Statement>createNode(SyntaxKind.EmptyStatement);\n\n parseExpected(SyntaxKind.SemicolonToken);\n\
    \n return finishNode(node);\n\n}\n\nIt shows three critical functions  createNode\
    \ ,  parseExpected  and  finishNode .\n\n** createNode **\n\nThe parser's  createNode\
    \  function  function createNode(kind: SyntaxKind, pos?: number):\n\nNode  is\
    \ responsible for creating a Node, setting up its  SyntaxKind  as passed in, and\
    \ set the\n\ninitial position if passed in (or use the position from the current\
    \ scanner state).\n\n** parseExpected **\n\nParser Functions\n\n283"
- md: "\nThe parser's `parseExpected` function `parseExpected(kind: SyntaxKind, diagnosticMessage?:\
    \ DiagnosticMessage): boolean` will check that the current token in the parser\
    \ state matches the desired `SyntaxKind`. If not it will either report the diagnosticMessage\
    \ sent in or create a generic one of the form `foo expected`. It internally uses\
    \ the `parseErrorAtPosition` function (which uses the scanning positions) to give\
    \ good error reporting.\n\n### finishNode\nThe parser's `finishNode` function\
    \ `finishNode<T extends Node>(node: T, end?: number): T` sets up the `end` position\
    \ for the node and additional useful stuff like the parserContextFlags it it was\
    \ parsed under as well as if there were any errors before parsing this node (if\
    \ there were then we cannot reuse this AST node in incremental parsing).\n\n##\
    \ Parser Functions\n\n### Binder\nMost JavaScript transpilers out there are simpler\
    \ than TypeScript because they provide little in the way of code analysis. The\
    \ typical JavaScript transpilers only have the following flow:\n\nSourceCode ~~Scanner~~>\
    \ Tokens ~~Parser~~> AST ~~Emitter~~> JavaScript\n\nWhile the above architecture\
    \ is true as a simplified understand of TypeScript js generation, a key feature\
    \ of TypeScript is its *Semantic* system. In order to assist type checking (performed\
    \ by `checker`), the `binder` (in `binder.ts`) is used to connect the various\
    \ parts of the source code into a coherent type system that can then be used by\
    \ the `checker`. The main responsibility of the binder is to create the *Symbols*.\n\
    \n### Symbol\nSymbols connect declaration nodes in the AST to other declarations\
    \ contributing to the same entity. Symbols are the basic building block of the\
    \ Semantic system. The symbol constructor is defined in `core.ts` (and `binder`\
    \ actually uses the `objectAllocator.getSymbolConstructor` to get its hands on\
    \ it). Here is the constructor:\n\n```typescript\nfunction Symbol(flags: SymbolFlags,\
    \ name: string) {\n  this.flags = flags;\n  this.name = name;\n  this.declarations\
    \ = undefined;\n}\n```\n\n`SymbolFlags` is a flag enum and is really used to identify\
    \ additional classifications of the symbol (e.g the scope of a variable flags\
    \ `FunctionScopedVariable` or `BlockScopedVariable` or others).\n\n### Usage by\
    \ Checker\nThe `binder` is actually used internally by the type checker which\
    \ in turn is used by the program. The simplified call stack looks like:\n\nBinder\
    \ -> `program.getTypeChecker` -> `ts.createTypeChecker` (in checker) -> `initializeTypeChecker`\
    \ (in checker) -> for each SourceFile `ts.bindSourceFile` (in binder) // followed\
    \ by for each SourceFile `ts.mergeSymbolTable` (in checker)\n\nThe unit of work\
    \ for the binder is a SourceFile. The `binder.ts` is driven by `checker.ts`.\n\
    \n### Binder function\nTwo critical binder functions are `bindSourceFile` and\
    \ `mergeSymbolTable`. We will take a look at these next.\n\n### bindSourceFile\n\
    Basically checks if the `file.locals` is defined, if not it hands over to (a local\
    \ function) `bind`.\n\nNote: `locals` is defined on `Node` and is of type `SymbolTable`.\
    \ Note that `SourceFile` is also a `Node` (in fact a root node in the AST).\n\n\
    TIP: local functions are used heavily within the TypeScript compiler. A local\
    \ function very own uses variables from the parent function (captured by closure).\
    \ In the case of `bind` (a local function within `bindSourceFile`) it (or function\
    \ it calls) will setup the `symbolCount` and `classifiableNames` among others,\
    \ that are then stored on the returned `SourceFile`.\n\n### bind\nBind takes any\
    \ `Node` (not just `SourceFile`). First thing it does is assign the `node.parent`\
    \ (if parent variable has been setup ... which again is something the binder does\
    \ during its processing within the `bindChildren` function), then hands off to\
    \ `bindWorker` which does the *heavy* lifting. Finally it calls `bindChildren`\
    \ (a function that simply stores the binder state e.g. current `parent` within\
    \ its function local vars, then calls `bind` on each child, and then restores\
    \ the binder state). Now let's look at `bindWorker` which is the more interesting\
    \ function.\n\n### bindWorker\nThis function switches on `node.kind` (of type\
    \ `SyntaxKind`) and delegates work to the appropriate `bindFoo` function (also\
    \ defined within `binder.ts`). For example if the `node` is a SourceFile it calls\
    \ (eventually and only if its an external file module) `bindAnonymousDeclaration`.\n\
    \n### bindFoo* functions\nThere are few pattern common to `bindFoo` functions\
    \ as well as some utility functions that these use. One function that is almost\
    \ always used is the `createSymbol` function. It is presented in its entirety\
    \ below:\n\n```typescript\nfunction createSymbol(flags: SymbolFlags, name: string):\
    \ Symbol {\n  symbolCount++;\n  return new Symbol(flags, name);\n}\n```\n\nAs\
    \ you can see it is simply keeping the `symbolCount` (a local to `bindSourceFile`)\
    \ up to date and creating the symbol with the specified parameters.\n\n### Symbols\
    \ and Declarations\nLinking between a `node` and a `symbol` is performed by a\
    \ few functions. One function that is used to bind a `node` and a `symbol` is\
    \ the `addDeclarationToSymbol`. \n\n```typescript\nfunction addDeclarationToSymbol(symbol:\
    \ Symbol, node: Declaration, symbolFlags: any) {\n  symbol.flags |= symbolFlags;\n\
    \  node.symbol = symbol;\n  if (!symbol.declarations) {\n    symbol.declarations\
    \ = [];\n  }\n  symbol.declarations.push(node);\n  // ... other logic ...\n}\n\
    ```\n\nThe important linking portions:\nCreates a link to the Symbol from the\
    \ AST node (`node.symbol`).\nAdds the node as one of the declarations of the Symbol\
    \ (`symbol.declarations`).\n\n### Declaration\nDeclaration is just a `node` with\
    \ an optional name.\n\n```typescript\ninterface Declaration extends Node {\n \
    \ _declarationBrand: any;\n  name?: DeclarationName;\n}\n```\n\n### Container\n\
    An AST node can be a container. This determines the kinds of `SymbolTables` the\
    \ Node and associated Symbol will have. Container is an abstract concept (i.e.\
    \ has no associated data structure). The concept is driven by a few things, one\
    \ being the `ContainerFlags` enum. The function `getContainerFlags` (in `binder.ts`)\
    \ drives this flag and is presented below:\n\n```typescript\nfunction getContainerFlags(node:\
    \ Node): ContainerFlags {\n  switch (node.kind) {\n    case SyntaxKind.ClassExpression:\n\
    \    case SyntaxKind.ClassDeclaration:\n    case SyntaxKind.InterfaceDeclaration:\n\
    \    case SyntaxKind.EnumDeclaration:\n    case SyntaxKind.TypeLiteral:\n    case\
    \ SyntaxKind.ObjectLiteralExpression:\n      return ContainerFlags.IsContainer;\n\
    \    case SyntaxKind.CallSignature:\n    case SyntaxKind.ConstructSignature:\n\
    \    case SyntaxKind.IndexSignature:\n    case SyntaxKind.MethodDeclaration:\n\
    \    case SyntaxKind.MethodSignature:\n    case SyntaxKind.FunctionDeclaration:\n\
    \    case SyntaxKind.Constructor:\n    case SyntaxKind.GetAccessor:\n    case\
    \ SyntaxKind.SetAccessor:\n    case SyntaxKind.FunctionType:\n    case SyntaxKind.ConstructorType:\n\
    \    case SyntaxKind.FunctionExpression:\n    case SyntaxKind.ArrowFunction:\n\
    \    case SyntaxKind.ModuleDeclaration:\n    case SyntaxKind.SourceFile:\n   \
    \ case SyntaxKind.TypeAliasDeclaration:\n      return ContainerFlags.IsContainerWithLocals;\n\
    \    case SyntaxKind.CatchClause:\n    case SyntaxKind.ForStatement:\n    case\
    \ SyntaxKind.ForInStatement:\n    case SyntaxKind.ForOfStatement:\n    case SyntaxKind.CaseBlock:\n\
    \      return ContainerFlags.IsBlockScopedContainer;\n    case SyntaxKind.Block:\n\
    \      // do not treat blocks directly inside a function as a block-scoped-container.\n\
    \      // Locals that reside in this block should go to the function locals. Otherwise\
    \ 'x'\n      // would not appear to be a redeclaration of a block scoped local\
    \ in the following\n      break;\n  }\n}\n```\n"
  mdcn: "\n解析器的 `parseExpected` 函数 `parseExpected(kind: SyntaxKind, diagnosticMessage?:\
    \ DiagnosticMessage): boolean` 将检查解析器状态中的当前标记是否匹配所需的 `SyntaxKind`。如果不匹配，它将报告 `diagnosticMessage`\
    \ 或创建一个通用的 `foo`。它内部使用 `parseErrorAtPosition` 函数（用于扫描位置）来提供良好的错误报告。\n\n### finishNode\n\
    解析器的 `finishNode` 函数 `finishNode<T extends Node>(node: T, end?: number): T` 设置了节点的\
    \ `end` 位置以及其他有用的内容，如 `flags`，用于在解析此节点之前判断是否可以复用此 AST 节点。\n\n## Parser Functions\n\
    \n### Binder\n大多数 JavaScript 转译器比 TypeScript 要简单，因为它们在代码分析方面提供的较少。典型的转译器流程如下：\n\
    \nSourceCode ~~Scanner~~> Tokens ~~Parser~~> AST ~~Emitter~~> JavaScript\n\n上述架构\
    \ TypeScript 的一个关键特性是其*语义*系统。为了辅助类型检查（由 `checker` 执行），`binder`（在 `binder.ts` 中）被用于将代码的不同部分连接到一个连贯的系统中，以供\
    \ `checker` 使用。\n\n### Symbol\nSymbols 将 AST 中的声明节点连接到同一个实体。Symbols 是语义系统的基础区块。符号构造函数定义在\
    \ `core.ts` 中（`binder` 实际上使用 `objectAllocator.getSymbolConstructor` 来获取它）：\n\n\
    ```typescript\nfunction Symbol(flags: SymbolFlags, name: string) {\n  this.flags\
    \ = flags;\n  this.name = name;\n  this.declarations = undefined;\n}\n```\n\n\
    `SymbolFlags` 是一个标记枚举，实际上用于识别符号的分类（例如 `FunctionScopedVariable` 或 `BlockScopedVariable`）。\n\
    \n### Usage by Checker\n`binder` 实际上在类型检查器内部被 `program` 使用。简化的调用栈如下：\n\nBinder\
    \ -> `program.getTypeChecker` -> `ts.createTypeChecker` (in checker) -> `initializeTypeChecker`\
    \ (in checker) -> for each SourceFile `ts.bindSourceFile` (in binder) // 后面是 for\
    \ SourceFile `ts.mergeSymbolTable` (in checker)\n\nbinder 的工作单元是 SourceFile。`binder.ts`\
    \ 由 `checker.ts` 驱动。\n\n### Binder function\n两个关键的 binder 函数是 `bindSourceFile`\
    \ 和 `mergeSymbolTable`。我们将将查看这些。\n\n### bindSourceFile\n基本上检查 `file.locals` 是否定义，如果没有，它将交给（一个本地函数）`bind`。\n\
    \n注意：`locals` 定义在 `Node` 上且类型为 `SymbolTable`。注意 `SourceFile` 也是一个 `Node`（实际上是\
    \ AST 中的根节点）。\n\n提示：本地函数在 TypeScript 编译器中被大量使用。本地函数拥有父函数的变量（通过闭包捕获）。在 `bind`（`bindSourceFile`\
    \ 内部的本地函数）的情况下，它或它调用的函数将设置 `symbolCount` 和 `classifiableNames` 等并在返回的 `SourceFile`\
    \ 上。\n\n### bind\nBind 接收任何 `Node`（不仅仅是 `SourceFile`）。它执行的第一件事是分配 `node.parent`（如果父变量已设置……这又是\
    \ binder 在 `bindChildren` 函数处理期间执行的操作），然后交给 `bindWorker`，后者负责*重型*工作。最后，它调用 `bindChildren`（一个简单存储\
    \ binder 状态的函数，例如函数局部变量中的当前 `parent`，然后对每个孩子调用 `bind`，然后恢复 binder 状态）。现在让我们来看看更有趣函数\
    \ `bindWorker`。\n\n### bindWorker\n此函数根据 `node.kind`（类型为 `SyntaxKind`）切换并将工作委托给相应的\
    \ `bindFoo` 函数（同样定义在 `binder.ts` 中）。例如，如果 `node` 是 SourceFile，它会调用（最终且仅当它是文件模块时）`bindAnonymousDeclaration`。\n\
    \n### bindFoo* functions\n`bindFoo` 函数之间有一些共同模式，以及它们使用的一些工具函数。一个几乎总是被使用的函数是 `createSymbol`\
    \ 函数。其完整代码如下：\n\n```typescript\nfunction createSymbol(flags: SymbolFlags, name:\
    \ string): Symbol {\n  symbolCount++;\n  return new Symbol(flags, name);\n}\n\
    ```\n\n你可以看到，它仅仅是保持 `symbolCount`（`bindSourceFile` 的本地变量）更新并使用指定的参数创建符号。\n\n###\
    \ Symbols and Declarations\n`node` 与 `symbol` 之间的链接由几个函数完成。一个用于绑定 `node` 和 `symbol`\
    \ 的函数是 `addDeclarationToSymbol`。\n\n```typescript\nfunction addDeclarationToSymbol(symbol:\
    \ Symbol, node: Declaration, symbolFlags: any) {\n  symbol.flags |= symbolFlags;\n\
    \  node.symbol = symbol;\n  if (!symbol.declarations) {\n    symbol.declarations\
    \ = [];\n  }\n  symbol.declarations.push(node);\n  // ... 其他逻辑 ...\n}\n```\n\n\
    重要的链接部分：\n创建指向 Symbol 的链接（`node.symbol`）。\n将节点作为 Symbol 的声明之一（`symbol.declarations`）。\n\
    \n### Declaration\nDeclaration 只是一个带有可选名称的 `node`。\n\n```typescript\ninterface\
    \ Declaration extends Node {\n  _declarationBrand: any;\n  name?: DeclarationName;\n\
    }\n```\n\n### Container\nAST 节点可以是容器。这决定了 Node 和关联 Symbol 将拥有的 `SymbolTables`。Container\
    \ 是一个抽象概念（即没有关联的数据结构）。该概念由几个因素驱动，其中之一 `ContainerFlags` 枚举。`getContainerFlags`\
    \ 函数（在 `binder.ts` 中）驱动此标记并呈现如下：\n\n```typescript\nfunction getContainerFlags(node:\
    \ Node): ContainerFlags {\n  switch (node.kind) {\n    case SyntaxKind.ClassExpression:\n\
    \    case SyntaxKind.ClassDeclaration:\n    case SyntaxKind.InterfaceDeclaration:\n\
    \    case SyntaxKind.EnumDeclaration:\n    case SyntaxKind.TypeLiteral:\n    case\
    \ SyntaxKind.ObjectLiteralExpression:\n      return ContainerFlags.IsContainer;\n\
    \    case SyntaxKind.CallSignature:\n    case SyntaxKind.ConstructSignature:\n\
    \    case SyntaxKind.IndexSignature:\n    case SyntaxKind.MethodDeclaration:\n\
    \    case SyntaxKind.MethodSignature:\n    case SyntaxKind.FunctionDeclaration:\n\
    \    case SyntaxKind.Constructor:\n    case SyntaxKind.GetAccessor:\n    case\
    \ SyntaxKind.SetAccessor:\n    case SyntaxKind.FunctionType:\n    case SyntaxKind.ConstructorType:\n\
    \    case SyntaxKind.FunctionExpression:\n    case SyntaxKind.ArrowFunction:\n\
    \    case SyntaxKind.ModuleDeclaration:\n    case SyntaxKind.SourceFile:\n   \
    \ case SyntaxKind.TypeAliasDeclaration:\n      return ContainerFlags.IsContainerWithLocals;\n\
    \    case SyntaxKind.CatchClause:\n    case SyntaxKind.ForStatement:\n    case\
    \ SyntaxKind.ForInStatement:\n    case SyntaxKind.ForOfStatement:\n    case SyntaxKind.CaseBlock:\n\
    \      return ContainerFlags.IsBlockScopedContainer;\n    case SyntaxKind.Block:\n\
    \      // 不要将函数内部的块视为块作用域容器。\n      // 位于该块中的局部变量应该进入函数局部变量。否则 'x' 看起来是块作用域变量的重复声明。\n\
    \      break;\n  }\n}\n```\n"
