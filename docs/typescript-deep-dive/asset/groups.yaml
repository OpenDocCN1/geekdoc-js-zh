    \ system. It gives you an escape\n\nhatch from the type system to tell the compiler\
    \ to bugger off.  any  is compatible with *any*\n\n*and all* types in the type\
    \ system. This means that *anything can be assigned to it* and *it can*\n\n*be\
    \ assigned to anything*. This is demonstrated in the example below:\n\nvar power:\
    \ any;\n\n// Takes any and all types\n\npower = '123';\n\npower = 123;\n\n// Is\
    \ compatible with all types\n\nvar num: number;\n\npower = num;\n\nnum = power;\n\
    \nIf you are porting JavaScript code to TypeScript, you are going to be close\
    \ friends with  any \n\nin the beginning. However, don't take this friendship\
    \ too seriously as it means that *it is up to*\n\n*you to ensure the type safety*.\
    \ You are basically telling the compiler to *not do any meaningful*\n\n*static\
    \ analysis*.\n\n** null **** and **** undefined **\n\nThe  null  and  undefined\
    \  JavaScript literals are effectively treated by the type system the\n\nsame\
    \ as something of type  any . These literals can be assigned to any other type.\
    \ This is\n\ndemonstrated in the below example:\n\nTypeScript's Type System\n\n\
