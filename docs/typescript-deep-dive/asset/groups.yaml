  - "[PAGE 273]\n\n**AST Tip: Visit Children**\n\nThere is a utility function  ts.forEachChild\
    \  that allows you to visit all the child nodes of any\n\nNode in the AST.\n\n\
    Here is simplified snippet of the source code to demonstrate how it functions:\n\
    \nexport function forEachChild<T>(node: Node, cbNode: (node: Node) => T, cbNodeArray?:\
    \ (\n\nnodes: Node\\[\\]) => T): T {\n\n if (!node) {\n\n return;\n\n }\n\n switch\
    \ (node.kind) {\n\n case SyntaxKind.BinaryExpression:\n\n return visitNode(cbNode,\
    \ (<BinaryExpression>node).left) ||\n\n visitNode(cbNode, (<BinaryExpression>node).operatorToken)\
    \ ||\n\n visitNode(cbNode, (<BinaryExpression>node).right);\n\n case SyntaxKind.IfStatement:\n\
    \n return visitNode(cbNode, (<IfStatement>node).expression) ||\n\n visitNode(cbNode,\
    \ (<IfStatement>node).thenStatement) ||\n\n visitNode(cbNode, (<IfStatement>node).elseStatement);\n\
    \n // .... lots more\n\nBasically it checks  node.kind  and based on that assumes\
    \ an interface offered by the  node \n\nand calls the  cbNode  on the children.\
    \ Note, however that this function doesn't call\n\n visitNode  for *all* children\
    \ (e.g. SyntaxKind.SemicolonToken). If you want *all* the children of\n\na node\
    \ in the AST just call  .getChildren  member function of the  Node .\n\nE.g. here\
    \ is a function that prints the verbose  AST  of a node:\n\nfunction printAllChildren(node:\
