    \n### 使用 @types\n\n安装非常简单，因为它直接运行在 `npm` 之上。例如，你可以通过以下命令安装 `jquery` 的类型定义：\n\n\
    npm install @types/jquery --save-dev\n\n@types 同时支持*全局*和*模块*类型定义。\n\n### 全局 @types\n\
    \n默认情况下，任何支持全局消费的定义都会自动包含。例如，对于 `jquery`，你应该能够在项目中开始*全局*使用 `$`。然而，对于*库*（如 `jquery`），我通常建议使用*模块*：\n\
    \n### 模块 @types\n\n安装后，实际上不需要特殊配置。你只需要像模块一样使用它，例如：\n\nimport * as $ from \"jquery\"\
    ;\n\n// 在此模块中随心使用 $ :)\n\n## 控制全局变量\n\n所示，自动支持全局泄露的定义可能会某些团队带来问题，因此你可以选择 `tsconfig.json`\
