  - "[PAGE 34]\n\nArrow Functions\n\nTip: Arrow Function Need\n\nTip: Arrow Function\
    \ Danger\n\nTip: Libraries that use  this \n\nTip: Arrow Function inheritance\n\
    \n**Arrow Functions**\n\nLovingly called the *fat arrow* (because  ->  is a thin\
    \ arrow and  =>  is a fat arrow) and also\n\ncalled a *lambda function* (because\
    \ of other languages). Another commonly used feature is\n\nthe fat arrow function\
    \  ()=>something . The motivation for a *fat arrow* is:\n\n1\\. You don't need\
    \ to keep typing  function \n\n2\\. It lexically captures the meaning of  this\
    \ \n\n3\\. It lexically captures the meaning of  arguments \n\nFor a language\
    \ that claims to be functional, in JavaScript you tend to be typing  function\
    \ \n\nquite a lot. The fat arrow makes it simple for you to create a function\n\
    \nvar inc = (x)=>x+1;\n\n this  has traditionally been a pain point in JavaScript.\
    \ As a wise man once said \"I hate\n\nJavaScript as it tends to lose the meaning\
    \ of  this  all too easily\". Fat arrows fix it by\n\ncapturing the meaning of\
    \  this  from the surrounding context. Consider this pure JavaScript\n\nclass:\n\
    \nfunction Person(age) {\n\n this.age = age;\n\n this.growOld = function() {\n\
    \n this.age++;\n\n }\n\n}\n\nvar person = new Person(1);\n\nsetTimeout(person.growOld,1000);\n\
    \nsetTimeout(function() { console.log(person.age); },2000); // 1, should have\
    \ been 2\n\nIf you run this code in the browser  this  within the function is\
    \ going to point to  window \n\nbecause  window  is going to be what executes\
    \ the  growOld  function. Fix is to use an arrow\n\nfunction:\n\nArrow Functions\n\
    \n35"
