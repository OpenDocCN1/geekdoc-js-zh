- md: "\n## Binder Error Reporting\n\nBinding errors are added to the sourceFile's\
    \ list of `bindDiagnostics`.\n\nAn example error detected during binding is the\
    \ use of `eval` or `arguments` as a variable name in `use strict` scenario. The\
    \ relevant code is presented in its entirety below (`checkStrictModeEvalOrArguments`\
    \ is called from multiple places, call stacks originating from `bindWorker` which\
    \ calls different functions for different node `SyntaxKind`):\n\n```typescript\n\
    function checkStrictModeEvalOrArguments(contextNode: Node, name: Node) {\n  if\
    \ (name && name.kind === SyntaxKind.Identifier) {\n    let identifier = <Identifier>name;\n\
    \    if (isEvalOrArgumentsIdentifier(identifier)) {\n      // We check first if\
    \ the name is inside class declaration or class expression\n      // if so give\
    \ explicit message\n      // otherwise report generic error message.\n      let\
    \ span = getErrorSpanForNode(file, name);\n      file.bindDiagnostics.push(createFileDiagnostic(file,\
    \ span.start, span.length,\n        getStrictModeEvalOrArgumentsMessage(contextNode),\
    \ identifier.text));\n    }\n  }\n}\n\nfunction isEvalOrArgumentsIdentifier(node:\
    \ Node): boolean {\n  return node.kind === SyntaxKind.Identifier &&\n    ((<Identifier>node).text\
    \ === \"eval\" || (<Identifier>node).text === \"arguments\");\n}\n\nfunction getStrictModeEvalOrArgumentsMessage(node:\
    \ Node) {\n  // Provide specialized messages to help the user understand why we\
    \ think they're in\n  // strict mode.\n  if (getContainingClass(node)) {\n   \
    \ return Diagnostics.Invalid_use_of_Class_definitions_are_automatically_in_strict_mode;\n\
    \  }\n  if (file.externalModuleIndicator) {\n    return Diagnostics.Invalid_use_of_Modules_are_automatically_in_strict_mode;\n\
    \  }\n  return Diagnostics.Invalid_use_of_in_strict_mode;\n}\n```\n\n## Checker\n\
    \nLike we mentioned before, *checker* is the thing that makes TypeScript uniquely\
    \ more powerful than *just another JavaScript transpiler*. The checker is located\
    \ in `checker.ts` and at this moment it is 23k+ lines of TypeScript (largest part\
    \ of the compiler).\n\n### Usage by Program\n\nThe `checker` is initialized by\
    \ `program`. The following is a sampling of the call stack (we showed the same\
    \ one when looking at `binder`):\n\nprogram.getTypeChecker -> ts.createTypeChecker\
    \ (in checker) -> initializeTypeChecker (in checker) -> for each SourceFile `ts.bindSourceFile`\
    \ (in binder) // followed by for each SourceFile `ts.mergeSymbolTable` (in checker)\n\
    \n### Association with Emitter\n\nTrue type checking happens once a call is made\
    \ to `getDiagnostics`. This function is called e.g. once a request is made to\
    \ `Program.emit`, in which case the checker returns an `EmitResolver` (program\
    \ calls the checker's `getEmitResolver` function) which is just a set of functions\
    \ local to `createTypeChecker`. We will mention this again when we look at the\
    \ emitter.\n\nHere is the call stack right down to `checkSourceFile` (a function\
    \ local to `createTypeChecker`):\n\nprogram.emit -> emitWorker (program local)\
    \ -> createTypeChecker.getEmitResolver -> // First call the following functions\
    \ local to createTypeChecker call getDiagnostics -> getDiagnosticsWorker -> checkSourceFile\
    \ // then return resolver (already initialized in createTypeChecker using a call\
    \ to local createResolver())\n\n## Global Namespace Merging\n\nWithin `initializeTypeChecker`\
    \ the following code exists:\n\n```typescript\n// Initialize global symbol table\n\
    forEach(host.getSourceFiles(), file => {\n  if (!isExternalModule(file)) {\n \
    \   mergeSymbolTable(globals, file.locals);\n  }\n});\n```\n\nWhich basically\
    \ merges all the `global` symbols into the `let globals: SymbolTable = {};` (in\
    \ `createTypeChecker`) `SymbolTable.mergeSymbolTable` primarily calls `mergeSymbol`.\n\
    \n### Checker Diagnostics\n\nThe checker uses the local `error` function to report\
    \ errors. Here is the function:\n\n```typescript\nfunction error(location: Node,\
    \ message: DiagnosticMessage, arg0?: any, arg1?: any, arg2?: any): void {\n  let\
    \ diagnostic = location\n    ? createDiagnosticForNode(location, message, arg0,\
    \ arg1, arg2)\n    : createCompilerDiagnostic(message, arg0, arg1, arg2);\n  diagnostics.add(diagnostic);\n\
    }\n```\n\n## Emitter\n\nThere are two `emitters` provided with the TypeScript\
    \ compiler:\n\n- `emitter.ts`: this is the emitter you are most likely to be interested\
    \ in. It's the TS -> JavaScript emitter.\n- `declarationEmitter.ts`: this is the\
    \ emitter used to create a *declaration file* (a `.d.ts`) for a *TypeScript source\
    \ file* (a `.ts` file).\n\nWe will look at `declarationEmitter`.\n\n### Usage\
    \ by Program\n\nThe `program` provides `emit`. This function delegates to `emitFiles`\
    \ in `emitter.ts`. Here is the call stack:\n\nprogram.emit -> emitWorker (program\
    \ local) -> emitFiles(resolver, targetFile) -> emitJavaScript(targetSourceFile)\n\
    \n### emitJavaScript\n\nThere is a lot of code in this function:\n\n```typescript\n\
    function emitJavaScript(jsFilePath: string, root?: SourceFile) {\n  let writer\
    \ = createWriter(newLine);\n  let write = writer.write;\n  let writeTextOfNode\
    \ = writer.writeTextOfNode;\n  let writeLine = writer.writeLine;\n  let increaseIndent\
    \ = writer.increaseIndent;\n  let decreaseIndent = writer.decreaseIndent;\n  let\
    \ currentSourceFile: string;\n  let generatedNameSet: Map<string> = {};\n  let\
    \ nodeToGeneratedName: string[] = [];\n  let computedPropertyNamesToNames: string[]\
    \ = [];\n  let extendsEmitted = false;\n  let decorateEmitted = false;\n  let\
    \ paramEmitted = false;\n  let awaiterEmitted = false;\n  let tempFlags = 0;\n\
    \  let tempVariables: Identifier[];\n  let tempParameters: Identifier[];\n  let\
    \ externalImports: (ImportDeclaration | ImportEqualsDeclaration | ExportDeclaration)[];\n\
    \  let exportSpecifiers: Map<ExportSpecifier[]>;\n  let exportEquals: ExportAssignment;\n\
    \  let hasExportStars: boolean;\n  // ...\n}\n```\n\n### emitFiles\n\nThe `emitFiles`\
    \ signature is:\n\n```typescript\nfunction emitFiles(resolver: EmitResolver, host:\
    \ EmitHost, targetFile?: SourceFile): EmitResult {\n  // ...\n  // exporting function\
    \ in System modules looks like:\n  // System.register([...], function (<exporter>)\
    \ {\n  // ...\n  // })\n}\n```\n"
