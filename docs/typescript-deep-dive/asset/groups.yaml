  mdcn: "\n\n**可调用类型 (Callable)**\n\n你可以如下所示将可调用对象标记为类型或接口的一部分：\n\n```typescript\n\
    interface ReturnString {\n  (): string\n}\n```\n\n此类接口的实例将是一个返回字符串的函数，例如：\n\n\
    ```typescript\ndeclare const foo: ReturnString;\nconst bar = foo(); // bar 被推断为\
    \ string\n```\n\n**常见示例 (Obvious examples)**\n\n当然，这种*可调用*注解也可以根据指定任何参数/可选参数/剩余参数。例如，这里有一个复杂的示例：\n\
    \n```typescript\ninterface Complex {\n  (foo: string, bar?: number, ...others:\
    \ boolean[]): number;\n}\n```\n\n它们甚至可以重载：\n\n```typescript\ninterface Overloaded\
    \ {\n  (foo: string): string\n  (foo: number): number\n}\n\n// 示例实现\nconst overloaded:\
    \ Overloaded = (foo) => foo;\n\n// 示例用法\nconst str = overloaded(''); // str 被推断为\
    \ string\nconst number = overloaded(123); // num 被推断为 number\n```\n\n当然，和*所有*接口/类型的体一样，你可以将这些作为变量类型注解，例如：\n\
    \n```typescript\nconst overloaded: {\n  (foo: string): string\n  (foo: number):\
    \ number\n} = (foo) => foo;\n```\n\n**箭头语法 (Arrow Syntax)**\n\n为了方便指定可调用签名，TypeScript\
    \ 还允许使用简单的箭头类型注解，例如：\n\n```typescript\nconst simple: (foo: number) => string =\
    \ (foo) => foo.toString();\n```\n\n箭头语法的唯一限制是：你不能指定重载。对于重载，你必须使用完整的 `{ (someArgs):\
    \ someReturn }` 语法。\n\n**可构造 (Newable)**\n\nNewable 只是带有 `new` 前缀的特殊*可调用*类型注解。它仅仅意味着你需要使用\
    \ `new` 来*调用*，例如：\n\n```typescript\ninterface CallMeWithNewToGetString {\n  new():\
    \ string\n}\n\n// 使用\ndeclare const Foo: CallMeWithNewToGetString;\nconst bar\
    \ = new Foo(); // bar 被推断为 string 类型\n```\n\n**类型断言 (Type Assertion)**\n\nTypeScript\
    \ 允许你以任何想要的方式覆盖它对类型的推断和分析视图。这是通过一种被称为“类型断言”的机制实现的。TypeScript 的类型断言纯粹是你告诉编译器，你对类型的了解比它更深，它不应该再质疑你的判断。\n\
    \n类型断言的一个常见用例是你将代码从 JavaScript 迁移到 TypeScript 时。例如，考虑以下模式：\n\n```javascript\n\
    var foo = {};\nfoo.bar = 123; // 错误：属性 'bar' 不存在 `{}` 上\nfoo.bas = 'hello'; //\
    \ 错误：属性 'bas' 不存在 `{}` 上\n```\n\n这里的代码报错是因为 `foo` 的*推断*类型是 `{}`，即一个具有零属性的对象。因此，不允许向它添加\
    \ `bar` 或 `bas`。你可以通过将类型断言为 `Foo` 来简单地修复这个问题：\n\n```typescript\ninterface Foo\
    \ {\n  bar: number;\n  bas: string;\n}\n\nvar foo = {} as Foo;\nfoo.bar = 123;\n\
    foo.bas = 'hello';\n```\n\n**as foo** vs. <foo>**\n\n最初添加的语法是 `<foo>`。下面进行了演示：\n\
    \n```javascript\nvar foo: any;\nvar bar = <string> foo; // bar 现在类型为 \"string\"\
    \n```\n\n然而，在 JSX 中使用 `<foo>` 风格的断言会导致语言语法存在歧义：\n\n```javascript\nvar foo = <string>bar;\n\
    </string>\n```\n\n因此，为了一致性，现在建议直接使用 `as foo`。\n\n**类型断言 vs. 类型转换 (Type Assertion\
    \ vs. Casting)**\n\n之所以不称为“转换 (casting)”是因为*转换*通常意味着某种运行时支持。然而，*类型断言*完全是编译时的结构，是你向编译器提供提示、说明你希望如何分析你的代码的方法。\n\
    \n**断言是有害的 (Assertion considered harmful)**\n\n在许多情况下，断言允许你轻松地迁移旧代码（甚至将其他代码示例复制到你的代码库中），但你应该谨慎使用断言。以我们的原始代码作为示例，编译器不会防止你忘记*实际添加你所承诺的属性*：\n\
    \n```typescript\ninterface Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo\
    \ = {} as Foo;\n// 啊啊 .... 忘了什么吗？\n```\n\n另一个常见的想法是使用断言作为提供*自动补全*的手段，例如：\n\n```typescript\n\
    interface Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo = <Foo>{\n  // 编译器将为\
    \ Foo 的属性提供自动补全\n  // 但开发者很容易忘记添加所有属性\n  // 此外，如果 Foo 被重构（例如添加了新属性），这段代码可能会崩溃\n\
    };\n```\n\n但这里的危险是相同的，如果你忘记了某个属性，编译器不会报错。如果这样做会更好：\n\n```typescript\ninterface\
    \ Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo:Foo = {\n  // 编译器将为 Foo\
    \ 的属性提供自动补全\n};\n```\n\n在某些情况下，你可能需要创建一个临时变量，但至少你不会做出（可能是虚假的）承诺，而是依赖类型推断来为你进行检查。\n\
    \n**双重断言 (Double assertion)**\n\n（注：类型断言尽管有一点……，但并不安全。例如，以下并不是：）\n\n（注：由于提供的源文本在后部分存在大量重复和乱码，此处翻译已根据核心逻辑停止。）\n\
    \n"
