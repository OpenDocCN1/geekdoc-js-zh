    \n之前的 `require<T>` 示例刻意为了说明一个事实：*仅使用一次*的泛型在类型安全方面并不比类型断言更好。尽管如此，它们确实为你的 API 提供了*便利性*。\n\
    \n一个例子是加载 JSON 响应的函数。它返回一个*你传入的任何类型*的 Promise：\n\n```typescript\nconst getJSON\
