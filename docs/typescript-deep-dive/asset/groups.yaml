    \n**声明索引签名**\n\n我们一直以来使用 `any` 来告诉 TypeScript 让我们随心所欲。实际上，我们可以显式地指定一个*索引*签名。例如，假设你想确保任何使用字符串存储在对象中的内容都符合\
    \ `{message: string}` 结构。这可以通过声明 `{[index:string]: {message: string} }` 实现。演示如下：\n\
    \nlet foo:{ [index:string]: {message: string} } = {};\n\n/**\n * 必须存储符合结构的内容\n\
    \ */\n/** 妥可 */\nfoo['a'] = { message: 'some message' };\n\n/** 错误：必须包含 `message`\
    \ 或类型为 string。你的 `message` 有拼写错误 */\nfoo['a'] = { messages: 'some message' };\n\
    \n/**\n * 读取的内容也会进行类型检查\n */\n/** 妥可 */\nfoo['a'].message;\n\n/** 错误：messages\
    \ 不存在。你的 `message` 有拼写错误 */\nfoo['a'].messages;\n\n索引签名 (Index Signatures)\n\n\
    提示：索引签名的名称（例如 `{[index:string]: {message: string} }` 中的 `index`）对 TypeScript 来说没有意义，仅仅是为了可读性。例如，如果它是用户名，你可以使用\
    \ `{[username:string]: {message: string} }` 来帮助查看代码的后续开发者（那个人恰恰就是你自己）。\n\n当然，`number`\
    \ 索引也是被支持的，例如 `{[count: number]: SomeOtherTypeYouWantToStoreEgRebate }`\n\n**所有成员必须符合字符串索引签名**\n\
    \n一旦你定义了 `string` 索引签名，所有显式成员也必须符合该索引签名。如下所示：\n\n/** 好的 */\ninterface Foo {\n\
    \  [key:string]: number\n  x: number;\n  y: number;\n}\n\n/** 错误 */\ninterface\
    \ Bar {\n  [key:string]: number\n  x: number;\n  y: string; // 属性 `y` 必须是 number\
    \ 类型\n}\n\n这样做是为了安全性，以便任何字符串访问都能得到相同的结果：\n\ninterface Foo {\n  [key:string]: number;\n\
    \  x: number;\n}\n\nlet foo: Foo = {x:1,y:2};\n\n// 直接访问\nfoo['x']; // number\n\
    \n// 间接访问\nlet x = 'x'\nfoo[x]; // number\n\n**使用有限的字符串字面量集合**\n\n索引签名可以要求索引字符串成为字面量联合类型的成员，例如：\n\
    \ntype Index = 'a' | 'b' | 'c'\ntype FromIndex = { [k in Index]?: number }\nconst\
    \ good: FromIndex = {b:1, c:2}\n\n// 错误：\n// 类型 '{ b: number; c: number; d: number;\
    \ }' 不能赋值给类型 'FromIndex'。\n// 对象字面量只能指定已知属性，类型 'FromIndex' 中不存在属性 'd'。\n\nconst\
    \ bad: FromIndex = {b:1, c:2, d:3};\n\n这通常与 `keyof typeof` 一起使用来捕获词汇类型（将在下一页描述）。\n\
    \n词汇的规范可以通用地延迟：\n\ntype FromSomeIndex<K extends string> = { [key in K]: number\
    \ }\n\n**同时拥有字符串和数字索引器**\n\n这不是一个常见的用例，但 TypeScript 编译器仍然支持它。\n\n然而它有一个限制：`string`\
    \ 索引器比 `number` 索引器更严格。这是故意为之，例如允许如下类型：\n\ninterface ArrStr {\n  [key: string]:\
    \ string | number; // 必须包含所有成员\n  [index: number]: string; // 可以是字符串索引器的子集\n \
    \ // 示例成员\n  length: number;\n}\n\n**设计模式：嵌套索引签名**\n\n添加索引签名时的 API 考虑\n\n在 JS\
    \ 社区中，你经常看到滥用字符串索引器的 API。例如，CSS in JS 库中的一种常见模式：\n\ninterface NestedCSS {\n  color?:\
    \ string;\n  [selector: string]: string | NestedCSS;\n}\n\nconst example: NestedCSS\
    \ = {\n  color: 'red',\n  '.subclass': {\n    color: 'blue'\n  }\n}\n\n尽量不要这样将字符串索引器与*有效*值混合。例如，padding\
    \ 中的拼写错误将无法被捕获：\n\nconst failsSilently: NestedCSS = {\n  colour: 'red', // 没有错误，因为\
    \ `colour` 是一个有效的字符串选择器\n}\n\n相反，将嵌套分离出来：\n\nconst example: NestedCSS = {\n  color:\
    \ 'red',\n  '.subclass': {\n    color: 'blue'\n  }\n}\n\nconst failsSilently:\
    \ NestedCSS = {\n  colour: 'red', // 没有错误，因为 `colour` 是一个有效的字符串选择器\n}\n"
