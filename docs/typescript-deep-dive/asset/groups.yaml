  - "[PAGE 209]\n\n**JSX Support**\n\nTypeScript supports JSX transpilation and code\
    \ analysis. If you are unfamiliar with JSX here\n\nis an excerpt from the official\
    \ website:\n\nJSX is a XML-like syntax extension to ECMAScript without any defined\
    \ semantics. It's\n\nNOT intended to be implemented by engines or browsers. It's\
    \ NOT a proposal to\n\nincorporate JSX into the ECMAScript spec itself. It's intended\
    \ to be used by various\n\npreprocessors (transpilers) to transform these tokens\
    \ into standard ECMAScript.\n\nThe motivation behind JSX is to allow users to\
    \ write HTML like views *in JavaScript* so that\n\nyou can:\n\nHave the view Type\
    \ Checked by the same code that is going to check your JavaScript\n\nHave the\
    \ view be aware of the context it is going to operate under (i.e. strengthen the\n\
    \n*controller-view* connection in traditional MVC)\n\nThis decreases the chances\
    \ of errors and increases the maintainability of your user\n\ninterfaces. The\
    \ main consumer of JSX at this point is ReactJS from facebook. This is the\n\n\
    usage of JSX that we will discuss here.\n\n**Setup**\n\nUse files with the extension\
    \  .tsx  (instead of  .ts ).\n\nUse  \"jsx\" : \"react\"  in your  tsconfig.json\
    \ 's  compilerOptions .\n\nInstall the definitions for JSX and React into your\
    \ project : ( npm i -D @types/react\n\n@types/react-dom ).\n\nImport react into\
    \ your  .tsx  files ( import \\* as React from \"react\" ).\n\n**HTML Tags vs.\
    \ Components**\n\nReact can either render HTML tags (strings) or React components\
    \ (classes). The JavaScript\n\nemit for these elements is different ( React.createElement('div')\
    \  vs.\n\n React.createElement(MyComponent) ). The way this is determined is by\
    \ the *case* of the *first*\n\nletter.  foo  is treated as an HTML tag and  Foo\
    \  is treated as a component.\n\n**Type Checking**\n\nJSX\n\n210"
  - "[PAGE 210]\n\n**HTML Tags**\n\nAn HTML Tag  foo  is to be of the type  JSX.IntrinsicElements.foo\
    \ . These types are already\n\ndefined for all the major tags in a file  react-jsx.d.ts\
    \  which we had you install as a part of\n\nthe setup. Here is a sample of the\
    \ the contents of the file:\n\ndeclare module JSX {\n\n interface IntrinsicElements\
    \ {\n\n a: React.HTMLAttributes;\n\n abbr: React.HTMLAttributes;\n\n div: React.HTMLAttributes;\n\
    \n span: React.HTMLAttributes;\n\n /// so on ...\n\n }\n\n}\n\n**Components**\n\
    \nComponents are type checked based on the  props  property of the component.\
    \ This is\n\nmodeled after how JSX is transformed i.e. the attributes become the\
    \  props  of the\n\ncomponent.\n\nTo create React components we recommend using\
    \ ES6 classes. The  react.d.ts  file\n\ndefines the  React.Component<Props,State>\
    \  class which you should extend in your own class\n\nproviding your own  Props\
    \  and  State  interfaces. This is demonstrated below:\n\ninterface Props {\n\n\
    \ foo: string;\n\n}\n\nclass MyComponent extends React.Component<Props, {}> {\n\
    \n render() {\n\n return <span>{this.props.foo}</span>\n\n }\n\n}\n\n<MyComponent\
    \ foo=\"bar\" />\n\n**React JSX Tip: Interface for renderable**\n\nReact can render\
    \ a few things like  JSX  or  string . There are all consolidated into the type\n\
    \n React.ReactNode  so use it for when you want to accept renderables e.g.\n\n\
    JSX\n\n211"
  - "[PAGE 211]\n\n![](img/416f69818aa79e3f1fe0e7869c118431_211_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_211_1.png)\n\
    \ninterface Props {\n\n header: React.ReactNode;\n\n body: React.ReactNode;\n\n\
    }\n\nclass MyComponent extends React.Component<Props, {}> {\n\n render() {\n\n\
    \ return <div>\n\n {header}\n\n {body}\n\n </div>;\n\n }\n\n}\n\n<MyComponent\
    \ foo=\"bar\" />\n\n**React JSX Tip: Accept an instance of a Component**\n\nThe\
    \ react type definitions provide  React.ReactElement<T>  to allow you to annotate\
    \ the result\n\nof a  <T/>  component instantiation. e.g.\n\nconst foo: React.ReactElement<MyAwesomeComponent>\
    \ = <MyAwesomeComponent/>; // Okay\n\nconst bar: React.ReactElement<MyAwesomeComponent>\
    \ = <NotMyAwesomeComponent/>; // Error!\n\nOf course you can use this as a function\
    \ argument annotation and even React\n\ncomponent prop member.\n\n**React JSX\
    \ Tip: Generic components**\n\nThere's no syntax in JSX to apply generic parameters\
    \ to a generic component. You must\n\nfirst store the generic class in a variable\
    \ that removes any generic parameters with concrete\n\ntypes. As an example we\
    \ replace  T  with the concrete  string  type:\n\n/\\*\\* A generic component\
    \ \\*/\n\ntype SelectProps<T> = { items: T\\[\\] }\n\nclass Select<T> extends\
    \ React.Component<SelectProps<T>, any\\> { }\n\n/\\*\\* Specialize Select to use\
    \ with strings \\*/\n\nconst StringSelect = Select as { new (): Select<string\\\
    > };\n\n/\\*\\* Usage \\*/\n\nconst Form = () => <StringSelect items={\\['a','b'\\\
    ]} />;\n\nIf your constructor takes props you can accomodate that too:\n\nJSX\n\
    \n212"
- md: "\n/** Generic component */\n\ninterface SelectProps<T> { items: T[] }\n\nclass\
    \ Select<T> extends Component<SelectProps<T>, any> {\n  constructor(props: SelectProps<T>)\
    \ { super(props) }\n}\n\n/** Specialization */\n\nconst StringSelect = Select\
    \ as { new (props: SelectProps<string>): GenericList<string> };\n\n## Non React\
    \ JSX\n\nTypeScript provides you with the ability to use something other than\
    \ React with JSX in a type safe manner. The following lists the customizability\
    \ points, but note that this is for advanced UI framework authors:\n\nYou can\
    \ disable `react` style emit by using `\"jsx\" : \"preserve\"` option. This means\
    \ that JSX is emitted *as is* and then you can use your own custom transpiler\
    \ to transpile the JSX portions.\n\nUsing the `JSX` global module:\n\nYou can\
    \ control what HTML tags are available and how they are type checked by customizing\
    \ the `JSX.IntrinsicElements` interface members.\n\nWhen using components:\n\n\
    You can control which `class` must be inherited by components by customizing the\
    \ default `interface ElementClass extends React.Component<any, any> { }` declaration.\n\
    \nYou can control which property is used to type check the attributes (the default\
    \ is `props`) by customizing the `declare module JSX { interface ElementAttributesProperty\
    \ { props: {}; } }` declaration.\n\n## reactNamespace\n\nPassing `--reactNamespace\
    \ <JSX factoryName>` along with `--jsx react` allows for using a different JSX\
    \ factory from the default `React`.\n\nThe new factory name will be used to call\
    \ `createElement` functions.\n\n### Example\n\n```typescript\nimport {jsxFactory}\
    \ from \"jsxFactory\";\n\nvar div = <div>Hello JSX!</div>\n```\n\nCompiled with:\n\
    `tsc --jsx react --reactNamespace jsxFactory --m commonJS`\n\nResults in:\n```javascript\n\
    \"use strict\";\n\nvar jsxFactory_1 = require(\"jsxFactory\");\n\nvar div = jsxFactory_1.jsxFactory.createElement(\"\
    div\", null, \"Hello JSX!\");\n```\n\n## Convenience vs. Soundness\n\nThere are\
    \ a few things that TypeScript prevents you from doing out of the box e.g. using\
    \ a variable that *isn't ever declared* (of course you can use a *declaration\
    \ file* for external systems).\n\nThat said, traditionally programming languages\
    \ have a hard boundary between what is and isn't allowed by the type system. TypeScript\
    \ is different in that it gives you control on where you put the slider. This\
    \ is really to allow you to use the JavaScript you know and love with as much\
    \ safety as **you** want. There are lot of compiler options to control exactly\
    \ this slider so let's have a look.\n\n### Boolean Options\n\n`compilerOptions`\
    \ that are `boolean` can be specified as `compilerOptions` in `tsconfig.json`:\n\
    \n```json\n{\n  \"compilerOptions\": {\n    \"someBooleanOption\": true\n  }\n\
    }\n```\n\nor on the command line:\n`tsc --someBooleanOption`\n\nAll of these are\
    \ `false` by default.\n\nClick here to see all compiler options.\n\n## noImplicitAny\n\
    \nThere are some things that cannot be inferred or inferring them might result\
    \ in errors that might be unexpected. A fine example is function arguments. If\
    \ you don't annotate them it's unclear what should and shouldn't be valid e.g.\n\
    \n```typescript\nfunction log(someArg) {\n  sendDataToServer(someArg);\n}\n\n\
    // What arg is valid and what isn't?\nlog(123);\nlog('hello world');\n```\n\n\
    So if you don't annotate some function argument TypeScript assumes `any` and moves\
    \ on. This essentially turns off type checking for such cases which is what a\
    \ JavaScript dev would expect but can catch people that want high safety off guard.\
    \ Hence there is an option `noImplicitAny` that when switched on will flag the\
    \ cases where the type cannot be inferred e.g.\n\n```typescript\nfunction log(someArg)\
    \ { // Error : someArg has an implicit `any` type\n  sendDataToServer(someArg);\n\
    }\n```\n\nof course you can then go ahead and annotate:\n\n```typescript\nfunction\
    \ log(someArg: number) {\n  sendDataToServer(someArg);\n}\n```\n\nAnd if you truly\
    \ want *zero safety* you can mark it *explicitly* as `any`:\n\n```typescript\n\
    function log(someArg: any) {\n  sendDataToServer(someArg);\n}\n```\n\n## strictNullChecks\n\
    \nBy default `null` and `undefined` are assignable to all types in TypeScript\
    \ e.g.\n\n```typescript\nlet foo: number = 123;\nfoo = null; // Okay\nfoo = undefined;\
    \ // Okay\n```\n\nThis is modelled after how a lot of people write JavaScript.\
    \ However like all things TypeScript allows you to be *explicit* about what *can\
    \ and cannot be* assigned a `null` or `undefined`.\n\nIn strict null checking\
    \ mode, `null` and `undefined` are different:\n\n```typescript\nlet foo = undefined;\n\
    foo = null; // NOT Okay\n```\n\nLet say we have a `Member` interface:\n\n```typescript\n\
    interface Member {\n  name: string,\n  age?: number\n}\n```\n\nNot every member\
    \ will provide their age, so the `age` is an optional property. It means the value\
    \ of `age` will probably be `undefined`.\n\n`undefined` is the root of all evil.\
    \ It always lead to runtime error. We are always easy to write some code that\
    \ will probably throw Error:\n\n```typescript\ngetMember()\n  .then(member: Member\
    \ => {\n    const stringifyAge = member.age.toString() // probably throw Cannot\
    \ read property 'toString' of undefined\n  })\n```\n\nBut in strict null checking\
    \ mode, it will throw an error at compile time:\n\n```typescript\ngetMember()\n\
    \  .then(member: Member => {\n    const stringifyAge = member.age.toString() //\
    \ Object is possibly 'undefined'\n  })\n```\n\n## Non-Null Assertion Operator\n\
    \nA new `!` post-fix expression operator may be used to assert that its operand\
    \ is non-null and non-undefined in contexts where the type checker is unable to\
    \ conclude that fact. For example:\n\n```typescript\n// Compiled with --strictNullChecks\n\
    function validateEntity(e?: Entity) {\n  // Throw exception if e is null or invalid\
    \ entity\n}\n\nfunction processEntity(e?: Entity) {\n  validateEntity(e);\n  let\
    \ a = e.name; // TS ERROR: e may be null.\n  let b = e!.name; // Assert that e\
    \ is non-null. This allows you to access name\n}\n```\n\nNote that it is just\
    \ an assertion, and just like type assertions *you are responsible* for making\
    \ sure the value is not null. A null assertion is essentially you telling the\
    \ compiler \"I know its not null so let me use it as though its not null\".\n\n\
    ## TIPs\n\nIn this section we present a number of tips that we have collected\
    \ over the course of using TypeScript in the real world.\n\n## Return an object\
    \ literal\n\nSometimes you need a function that just returns a simple object literal.\
    \ However, something like\n\n```javascript\nvar foo = () => {\n  bar: 123\n};\n\
    ```\n\nis parsed as a *block* containing a *JavaScript Label* by JavaScript runtimes\
    \ (cause of the JavaScript specification). If that doesn't make sense, don't worry,\
    \ as you get a nice compiler error saying \"unused label\". You can fix it by\
    \ surrounding the object literal with `()`:\n\n```javascript\nvar foo = () =>\
    \ ({\n  bar: 123\n});\n```\n\n## String enums\n\nSometimes you need a collection\
    \ of strings under a common key. Prior to 2.4, TypeScript only supported number-based\
    \ enums. If using versions prior to 2.4, a work-around is to use string literal\
    \ types to create string based enums by combining with union types.\n\n## Nominal\
    \ Typing\n\nThe TypeScript type system is structural and this is one of the main\
    \ motivating benefits. However, there are real-world use cases for a system where\
    \ you want two variables to be differentiated because they have a different *type\
    \ name* even if they have the same structure. A very common use case is *identity*\
    \ structures (which are generally just strings with semantics associated with\
    \ their *name* in languages like C#/Java).\n\nThere are a few patterns that have\
    \ emerged in the community. I cover them in decreasing order of personal preference:\n\
    \n### Using literal types\n\nThis pattern uses generics and literal types:\n\n\
    ```typescript\n/** Generic Id type */\ntype Id<T extends string> = {\n  type:\
    \ T,\n  value: string,\n}\n\n/** Specific Id types */\ntype FooId = Id<'foo'>;\n\
    type BarId = Id<'bar'>;\n\n/** Optional: constructors functions */\nconst createFoo\
    \ = (value: string): FooId => ({ type: 'foo', value });\nconst createBar = (value:\
    \ string): BarId => ({ type: 'bar', value });\n\nlet foo = createFoo('sample')\n\
    let bar = createBar('sample');\n\nfoo = bar; // Error\nfoo = foo; // Okay\n```\n\
    \nAdvantages\n- No need for any type assertions\n\nDisadvantage\n- The structure\
    \ `{type,value}` might not be desireable and need server serialization support\n\
    \n### Using Enums\n"
  mdcn: "\n/** 通用组件 */\n\ninterface SelectProps<T> { items: T[] }\n\nclass Select<T>\
    \ extends Component<SelectProps<T>, any> {\n  constructor(props: SelectProps<T>)\
    \ { super(props) }\n}\n\n/** 特化 */\n\nconst StringSelect = Select as { new (props:\
    \ SelectProps<string>): GenericList<string> };\n\n## 非 React JSX\n\nTypeScript\
    \ 允许你以类型安全的方式使用 JSX 使用 React 之外的内容。以下列出了可定制点，但请注意这是针对高级 UI 框架作者的：\n\n你可以通过使用 `\"\
    jsx\" : \"preserve\"`选项来禁用 `react` 风格输出。这意味着 JSX 将被*原样*输出，然后你可以使用自己自定义的转译器来转译\
    \ JSX 部分。\n\n使用 `JSX` 全局模块：\n\n你可以通过自定义 `JSX.IntrinsicElements` 接口成员，来控制哪些 HTML\
    \ 标签是用的以及如何进行类型检查。\n\n在使用组件时：\n\n你可以通过自定义默认的 `interface ElementClass extends React.Component<any,\
    \ any> { }` 声明，来控制组件必须继承哪个 `class`。\n\n你可以通过自定义 `declare module JSX { interface\
    \ ElementAttributesProperty { props: {}; } }` 声明，来控制使用哪个属性对属性进行类型检查（默认是 `props`）。\n\
    \n## reactNamespace\n\n在使用 `--jsx react` 的同时传递 `--reactNamespace <JSX factoryName>`\
    \ 允许使用不同于默认 `React` 的 JSX 工厂。\n\n新的工厂名称将将用于调用 `createElement` 函数。\n\n### 示例\n\n\
    ```typescript\nimport {jsxFactory} from \"jsxFactory\";\n\nvar div = <div>Hello\
    \ JSX!</div>\n```\n\n使用以下命令编译：\n`tsc --jsx react --reactNamespace jsxFactory --m\
    \ commonJS`\n\n结果为：\n```javascript\n\"use strict\";\n\nvar jsxFactory_1 = require(\"\
    jsxFactory\");\n\nvar div = jsxFactory_1.jsxFactory.createElement(\"div\", null,\
    \ \"Hello JSX!\");\n```\n\n## 便利性 vs. 严谨性\n\nTypeScript 开箱即用会防止你做某些事情，例如使用一个*从未声明过*的变量（当然，你可以为外部系统使用*声明文件*）。\n\
    \n尽管如此，传统的编程语言在类型系统允许和不允许的操作范围之间有一个硬性边界。TypeScript 的不同之处在于，它允许你控制滑块放置的位置。这实际上是为了让你在\
    \ ways你熟悉并喜爱的 JavaScript 时，能够获得**你**想要的任何程度的安全性。有很多编译器选项可以精确控制这个滑块，让我们来看一下。\n\n\
    ### 布尔选项\n\n类型为 `boolean` 的 `compilerOptions` 可以在 `tsconfig.json` 的 `compilerOptions`\
    \ 中指定：\n\n```json\n{\n  \"compilerOptions\": {\n    \"someBooleanOption\": true\n\
    \  }\n}\n```\n\n或在命令行中：\n`tsc --someBooleanOption`\n\n所有这些选项的默认值都是 `false`。\n\n\
    点击此处查看所有编译器选项。\n\n## noImplicitAny\n\n有些事情无法被推断，或者推断它们可能会导致意外之外的错误。函数参数就是一个很好的例子。如果你不对它们进行注解，就不清楚什么是和什么不是有效的，例如：\n\
    \n```typescript\nfunction log(someArg) {\n  sendDataToServer(someArg);\n}\n\n\
    // 什么参数有效，什么无效？\nlog(123);\nlog('hello world');\n```\n\n所以，如果你不对某些函数参数进行注解，TypeScript\
    \ 会假设它是 `any` 并继续执行。这本质上关闭了此类情况的类型检查，这是 JavaScript 开发人员所预期的，但会让想要高安全性的人措手不及。因此，有一个\
    \ `noImplicitAny` 选项，开启后将标记无法推断类型的情况，例如：\n\n```typescript\nfunction log(someArg)\
    \ { // 错误：someArg 具有隐式的 `any` 类型\n  sendDataToServer(someArg);\n}\n```\n\n当然，你可以继续进行注解：\n\
    \n```typescript\nfunction log(someArg: number) {\n  sendDataToServer(someArg);\n\
    }\n```\n\n如果你真的想要*零安全性*，可以将其*显式地*标记为 `any`：\n\n```typescript\nfunction log(someArg:\
    \ any) {\n  sendDataToServer(someArg);\n}\n```\n\n## strictNullChecks\n\n默认情况下，TypeScript\
    \ 中的 `null` 和 `undefined` 可以赋值给所有类型，例如：\n\n```typescript\nlet foo: number = 123;\n\
    foo = null; // 好的\nfoo = undefined; // OK\n```\n\n这模拟了许多人编写 JavaScript 的方式。然而，正如\
    \ TypeScript 允许的所有事情一样，它允许你对*可以和不能*赋值 `null` 或 `undefined` 的进行*显式*规定。\n\n在严格空检查模式下，`null`\
    \ 和 `undefined` 是不同的：\n\n```typescript\nlet foo = undefined;\nfoo = null; // 不\
    \ OK\n```\n\n假设我们有一个 `Member` 接口：\n\n```typescript\ninterface Member {\n  name:\
    \ string,\n  age?: number\n}\n```\n\n并不是每个成员都会提供他们的年龄，所以 `age` 是一个可选属性。这意味着 `age`\
    \ 的值可能是 `undefined`。\n\n`undefined` 是万恶之源。它总是会导致运行时错误。我们总是很容易写出一些可能会抛出 Error 的代码：\n\
    \n```typescript\ngetMember()\n  .then(member: Member => {\n    const stringifyAge\
    \ = member.age.toString() // 可能抛出 Cannot read property 'toString' of undefined\n\
    \  })\n```\n\n但在严格空检查模式下，它会在编译时抛出错误：\n\n```typescript\ngetMember()\n  .then(member:\
    \ Member => {\n    const stringifyAge = member.age.toString()\n  })\n```\n\n##\
    \ 非空断言运算符\n\n`!` 后缀表达式可能用于断言操作不是空的。例如：\n\n```typescript\n// 配合 --strictNullChecks\n\
    function validateEntity(e?: Entity) {\n  // 抛出异常如果 e为空\n  let a = e!.name;\n}\n\
    ```\n\n非空断言本质上是你告诉编译器“我知道它不是空的，让我使用它”。\n\n## 技巧\n\n在本节中我们介绍了在使用 TypeScript 过程中收集的一些技巧。\n\
    \n## 返回对象字面量\n\n有时你需要一个返回简单对象字面量的函数。然而，像这样的\n\n```javascript\nvar foo = () =>\
    \ {\n  bar: 123\n};\n```\n\n会被 JavaScript 运行时解析为包含*JavaScript Label*的*块*（由于 JavaScript\
    \ 规范）。如果这看起来不对，担心，你会得到一个关于“未使用标签”的编译器错误。你可以通过给对象字面量加上 `()` 来修复它：\n\n```javascript\n\
    var foo = () => ({\n  bar: 123\n});\n```\n\n你需要一个公共键的字符串集合。在 2.4 之前，TypeScript\
    \ 只支持基于数字的枚举。如果在 2.4 之前的版本，变通方法是使用字符串字面量类型通过联合类型来创建基于字符串的枚举。\n\n## 命名类型\n\nTypeScript\
    \ 类型系统是结构性的，这是其主要的优点之一。然而，在真实世界的用例中，你可能希望两个变量即使结构相同也因为具有不同的*类型名*而被区分开。一个非常常见的用例是*身份*结构（在\
    \ C# / Java 等语言中通常是带有关联语义的字符串）。\n\n社区中出现了一些模式。我按照个人偏好从高到低进行介绍：\n\n### 使用字面量类型\n\
    \n这种模式使用了泛型和字面量类型：\n\n```typescript\n/** 通用 Id 类型 */\ntype Id<T extends string>\
    \ = {\n  type: T,\n  value: string,\n}\n\n/** 特定的 Id 类型 */\ntype FooId = Id<'foo'>;\n\
    type BarId = Id<'bar'>;\n\n/** 可选：构造函数 */\nconst createFoo = (value: string):\
    \ FooId => ({ type: 'foo', value });\nconst createBar = (value: string): BarId\
    \ => ({ type: 'bar', value });\n\nlet foo = createFoo('sample')\nlet bar = createBar('sample');\n\
    \nfoo = bar; // 错误\nfoo = foo; // OK\n```\n\n优点\n- 不需要任何类型断言\n\n缺点\n- `{type,value}`\
    \ 结构可能并不理想，并且需要服务器序列化支持\n\n### 使用枚举\n\n"
