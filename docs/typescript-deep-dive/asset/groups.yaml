- md: "\nvar funcs = [];\n\n// create a bunch of functions\n\nfor (var i = 0; i <\
    \ 3; i++) {\n  funcs.push(function() {\n    console.log(i);\n  })\n}\n\n// call\
    \ them\n\nfor (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n\nOne would have expected\
    \ it to be 0, 1, 2. Surprisingly it is going to be 3 for all three functions.\
    \ Reason is that all three functions are using the variable i from the outer scope\
    \ and at the time we execute them (in the second loop) the value of i will be\
    \ 3 (that's the termination condition for the first loop).\n\nA fix would be to\
    \ create a new variable in each loop specific to that loop iteration. As we've\
    \ learnt before we can create a new variable scope by creating a new function\
    \ and immediately executing it (i.e. the IIFE pattern from classes (function()\
    \ { /* body */ })(); ) ) as shown below:\n\nvar funcs = [];\n\n// create a bunch\
    \ of functions\n\nfor (var i = 0; i < 3; i++) {\n  (function() {\n    var local\
    \ = i;\n    funcs.push(function() {\n      console.log(local);\n    })\n  })();\n\
    }\n\n// call them\n\nfor (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n\nHere the\
    \ functions close over (hence called a closure) the *local* variable (conveniently\
    \ named local) and use that instead of the loop variable i.\n\nNote that closures\
    \ come with a performance impact (they need to store the surrounding state).\n\
    \nThe ES6 let keyword in a loop would have the same behavior as the previous example:\n\
    \n```javascript\nvar funcs = [];\n\n// create a bunch of functions\n\nfor (let\
    \ i = 0; i < 3; i++) { // Note the use of let\n  funcs.push(function() {\n   \
    \ console.log(i);\n  })\n}\n\n// call them\n\nfor (var j = 0; j < 3; j++) {\n\
    \  funcs[j]();\n}\n```\n\nUsing a let instead of var creates a variable i unique\
    \ to each loop iteration.\n\n**Summary**\n\nlet is extremely useful to have for\
    \ the vast majority of code. It can greatly enhance your code readability and\
    \ decrease the chance of a programming error.\n\n**const**\n\nconst is a very\
    \ welcomed addition offered by ES6 / TypeScript. It allows you to be immutable\
    \ with variables. This is good from a documentation as well as a runtime perspective.\
    \ To use const just replace var with const:\n\n```javascript\nconst foo = 123;\n\
    ```\n\nThe syntax is much better (IMHO) than other languages that force the user\
    \ to type something like let constant foo i.e. a variable + behavior specifier.\
    \ const is a good practice for both readability and maintainability and avoids\
    \ using *magic literals* e.g.:\n\n```javascript\n// Low readability\nif (x > 10)\
    \ {\n}\n\n// Better!\nconst maxRows = 10;\nif (x > maxRows) {\n}\n```\n\n**const\
    \ declarations must be initialized**\n\nThe following is a compiler error:\n\n\
    ```javascript\nconst foo; // ERROR: const declarations must be initialized\n```\n\
    \n**Left hand side of assignment cannot be a constant**\n\nConstants are immutable\
    \ after creation, so if you try to assign them to a new value it is a compiler\
    \ error:\n\n```javascript\nconst foo = 123;\nfoo = 456; // ERROR: Left-hand side\
    \ of an assignment expression cannot be a constant\n```\n\n**Block Scoped**\n\n\
    A const is block scoped like we saw with let:\n\n```javascript\nconst foo = 123;\n\
    if (true) {\n  const foo = 456; // Allowed as its a new variable limited to this\
    \ `if` block\n}\n```\n\n**Deep immutability**\n\nA const works with object literals\
    \ as well, as far as protecting the variable *reference* is concerned:\n\n```javascript\n\
    const foo = { bar: 123 };\nfoo = { bar: 456 }; // ERROR : Left hand side of an\
    \ assignment expression cannot be a constant\n```\n\nHowever it still allows sub\
    \ properties of objects to be mutated, as shown below:\n\n```javascript\nconst\
    \ foo = { bar: 123 };\nfoo.bar = 456; // Allowed!\nconsole.log(foo); // { bar:\
    \ 456 }\n```\n\nFor this reason I recommend using const with primitives or immutable\
    \ data structures.\n\n![](img/416f69818aa79e3f1fe0e7869c118431_45_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_45_1.png)\n\
    \n**Destructuring**\n\nTypeScript supports the following forms of Destructuring\
    \ (literally named after de-structuring i.e. breaking up the structure):\n\n1.\
    \ Object Destructuring\n2. Array Destructuring\n\nIt is easy to think of destructuring\
    \ as an inverse of *structuring*. The method of *structuring* in JavaScript is\
    \ the object literal:\n\n```javascript\nvar foo = {\n  bar: {\n    bas: 123\n\
    \  }\n};\n```\n\nWithout awesome *structuring* support built into JavaScript,\
    \ creating new objects on the fly would be cumbersome. Destructuring brings the\
    \ same level of convenience to getting data out of a structure.\n\n**Object Destructuring**\n\
    \nDestructuring is useful because it allows you to do in a single line what would\
    \ otherwise require multiple lines. Consider the following case:\n\n```javascript\n\
    var rect = { x: 0, y: 10, width: 15, height: 20 };\n\n// Destructuring assignment\n\
    var {x, y, width} = rect;\nconsole.log(x, y, width); // 0, 10, 15\n\n// assign\
    \ to existing variables using outer parentheses\nrect.x = 10;\nconsole.log(x,\
    \ y, width); // 10, 15, 20\n```\n\nTo assign an extracted variable to a new name\
    \ you can do the following:\n\n```javascript\nconst obj = {\"some property\":\
    \ \"value\"};\n// destructure\nconst {someProperty} = obj;\nconsole.log(someProperty\
    \ === \"value\"); // true\n```\n\nAdditionally you can get *deep* data out of\
    \ a structure using destructuring. This is shown in the following example:\n\n\
    ```javascript\nvar foo = { bar: { bas: 123 } };\nvar {bar} = foo; // Effectively\
    \ var = foo.bar;\n```\n\n**Array Destructuring**\n\nA common programming question:\
    \ \"How to swap variables without using a third one?\". The TypeScript solution:\n\
    \n```javascript\nvar x = 1, y = 2;\n[x, y] = [y, x];\nconsole.log(x, y); // 2,\
    \ 1\n```\n\nNote that array destructuring is effectively the compiler doing [0],\
    \ [1], ... and so on for you. There is no guarantee that these values will exist.\n\
    \n**Array Destructuring with rest**\n\nYou can pick up any number of elements\
    \ from the array and get an array of the remaining elements using array destructuring\
    \ with rest:\n\n```javascript\nvar {x, y, ...remaining} = [1, 2, 3, 4];\nconsole.log(x,\
    \ y, remaining); // 1, 2, [3, 4]\n```\n\n**Array Destructuring with ignores**\n\
    \nYou can ignore any index by simply leaving its location empty i.e. , in the\
    \ left hand side of the assignment. For example:\n\n```javascript\nvar {x, , ...remaining}\
    \ = [1, 2, 3, 4];\nconsole.log(x, remaining); // 1, [3, 4]\n```\n\n**JS Generation**\n\
    \nThe JavaScript generation for non ES6 targets simply involves creating temporary\
    \ variables, just like you would have to do yourself without native language support\
    \ for destructuring e.g.:\n\n```javascript\nvar x = 1, y = 2;\n[x, y] = [y, x];\n\
    console.log(x, y); // 2, 1\n// becomes\nvar x = 1, y = 2;\n_a = [y, x], x = _a[0],\
    \ y = _a[1];\nconsole.log(x, y);\n```\n\n**Summary**\n\nDestructuring can make\
    \ your code more readable and maintainable by reducing the line count and making\
    \ the intent clear. Array destructuring can allow you to use arrays as though\
    \ they were tuples.\n\n**Spread Operator**\n\nThe main objective of the spread\
    \ operator is to *spread* the elements of an array or object. This is best explained\
    \ with examples.\n\n**Apply**\n\nA common use case is to spread an array into\
    \ the function arguments. Previously you would need to use Function.prototype.apply:\n\
    \n```javascript\nfunction foo(x, y, z) { }\nvar args = [0, 1, 2];\nfoo.apply(null,\
    \ args);\n```\n\nNow you can do this simply by prefixing the arguments with ...\
    \ as shown below:\n\n```javascript\nfunction foo(x, y, z) { }\nvar args = [0,\
    \ 1, 2];\nfoo(...args);\n```\n\nHere we are *spreading* the args array into positional\
    \ arguments.\n\n**Destructuring**\n\nWe've already seen one usage of this in *destructuring*:\n\
    \n```javascript\nvar {x, y, ...remaining} = [1, 2, 3, 4];\nconsole.log(x, y, remaining);\
    \ // 1, 2, [3, 4]\n```\n\nThe motivation here is to simply make it easy for you\
    \ to capture the remaining elements of an array when destructuring.\n\n**Object\
    \ Destructuring with rest**\n\nYou can pick up any number of elements from an\
    \ object and get an object of the remaining elements using object destructuring\
    \ with rest:\n\n```javascript\nvar {w, x, ...remaining} = {w: 1, x: 2, y: 3, z:\
    \ 4};\nconsole.log(w, x, remaining); // 1, 2, {y: 3, z: 4}\n```\n\nA common use\
    \ case is also to ignore certain properties. For example:\n\n```javascript\n//\
    \ Example function\nfunction goto(point2D: {x: number, y: number}) {\n  // Imagine\
    \ some code that might break if you pass in an object with more items than desired\n\
    }\n\n// Some you get from somewhere\nconst point2D = {x: 1, y: 2, z: 3};\n/**\
    \ A nifty use of rest to remove extra properties */\nconst {z, ...point2D} = point2D;\n\
    goto(point2D);\n```\n\n**Array Assignment**\n\nThe spread operator allows you\
    \ to easily place an *expanded version* of an array into another array. This is\
    \ demonstrated in the example below:\n\n```javascript\nvar list = [1, 2];\nlist\
    \ = [...list, 3, 4];\nconsole.log(list); // [1, 2, 3, 4]\n```\n"
