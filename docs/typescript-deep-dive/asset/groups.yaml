  - "[PAGE 201]\n\nTypeScripts type system is extremely powerful in that you can do\
    \ supremely powerful things\n\nin the language moving / slicing / dicing types\
    \ in ways that are not possible in any single\n\nlanguage out there.\n\nThis is\
    \ because TypeScript is designed to allow you to work seamlessly with a *highly*\n\
    \n*dynamic* language like JavaScript. Here we cover a few tricks for moving types\
    \ around in\n\nTypeScript.\n\nKey motivation for these : You change one thing\
    \ and everything else just updates\n\nautomatically and you get nice errors if\
    \ something is going to break, like a well designed\n\nconstraint system.\n\n\
    **Copying both the Type + Value**\n\nIf you want to move a class around you might\
    \ be tempted to do the following:\n\nclass Foo { }\n\nvar Bar = Foo;\n\nvar bar:\
    \ Bar; // ERROR: \"cannot find name 'Bar'\"\n\nThis is an error because  var \
    \ only copied the  Foo  into the *variable* declaration space and\n\nyou therefore\
    \ cannot use  Bar  as a type annotation. The proper way is to use the  import\
    \ \n\nkeyword. Note that you can only use the  import  keyword in such a way if\
    \ you are using\n\n*namespaces* or *modules* (more on these later):\n\nnamespace\
    \ importing {\n\n export class Foo { }\n\n}\n\nimport Bar = importing.Foo;\n\n\
    var bar: Bar; // Okay\n\nThis  import  trick only works for things that are *both\
    \ type and a variable*.\n\n**Capturing the type of a variable**\n\nYou can actually\
    \ use a variable in a type annotation using the  typeof  operator. This allows\n\
    \nyou to tell the compiler that one variable is the same type as another. Here\
    \ is an example to\n\ndemonstrate this:\n\nMoving Types\n\n202"
  - "[PAGE 202]\n\nvar foo = 123;\n\nvar bar: typeof foo; // \\`bar\\` has the same\
    \ type as \\`foo\\` (here \\`number\\`)\n\nbar = 456; // Okay\n\nbar = '789';\
    \ // ERROR: Type \\`string\\` is not \\`assignable\\` to type \\`number\\`\n\n\
    **Capturing the type of a class member**\n\nSimilar to capturing the type of a\
    \ variable, you just declare a variable purely for type\n\ncapturing purposes:\n\
    \nclass Foo {\n\n foo: number; // some member whose type we want to capture\n\n\
    }\n\n// Purely to capture type\n\ndeclare let \\_foo: Foo;\n\n// Same as before\n\
    \nlet bar: typeof \\_foo.foo;\n\n**Capturing the type of magic strings**\n\nLots\
    \ of JavaScript libraries and frameworks work off of raw JavaScript strings. You\
    \ can use\n\n const  variables to capture their type e.g.\n\n// Capture both the\
    \ \\*type\\* and \\*value\\* of magic string:\n\nconst foo = \"Hello World\";\n\
    \n// Use the captured type:\n\nlet bar: typeof foo;\n\n// bar can only ever be\
    \ assigned to \\`Hello World\\`\n\nbar = \"Hello World\"; // Okay!\n\nbar = \"\
    anything else \"; // Error!\n\nIn this example  bar  has the literal type  \"\
    Hello World\" . We cover this more in the literal\n\ntype section.\n\n**Capturing\
    \ the name of the keys**\n\nThe  keyof  operator lets you capture the key names\
    \ of a type. E.g. you can use it to capture\n\nthe key names of a variable by\
    \ first grabbing its type using  typeof :\n\nMoving Types\n\n203"
  - "[PAGE 203]\n\nconst colors = {\n\n red: 'red',\n\n blue: 'blue'\n\n}\n\ntype\
    \ Colors = keyof typeof colors;\n\nlet color: Colors;\n\ncolor = 'red'; // okay\n\
    \ncolor = 'blue'; // okay\n\ncolor = 'anythingElse'; // Error\n\nThis allows you\
    \ to have stuff like string enums + constants quite easily, as you just saw in\n\
    \nthe above example.\n\nMoving Types\n\n204"
- md: "\n## Exception Handling\n\nJavaScript has an `Error` class that you can use\
    \ for exceptions. You throw an error with the `throw` keyword. You can catch it\
    \ with a `try / catch` block pair, e.g.\n\n```javascript\ntry {\n  throw new Error('Something\
    \ bad happened');\n}\ncatch(e) {\n  console.log(e);\n}\n```\n\n### Error Sub Types\n\
    \nBeyond the built-in `Error` class there are a few additional built-in error\
    \ classes that inherit from `Error` that the JavaScript runtime can throw:\n\n\
    #### RangeError\n\nCreates an instance representing an error that occurs when\
    \ a numeric variable or parameter is outside of its valid range.\n\n```javascript\n\
    // Call console with too many arguments\nconsole.log.apply(console, new Array(1000000000));\
    \ // RangeError: Invalid array length\n```\n\n#### ReferenceError\n\nCreates an\
    \ instance representing an error that occurs when de-referencing an invalid reference.\
    \ e.g.\n\n```javascript\n'use strict';\nconsole.log(notValidVar); // ReferenceError:\
    \ notValidVar is not defined\n```\n\n#### SyntaxError\n\nCreates an instance representing\
    \ a syntax error that occurs while parsing code that isn't valid JavaScript.\n\
    \n```javascript\n1***3; // SyntaxError: Unexpected token *\n```\n\n#### TypeError\n\
    \nCreates an instance representing an error that occurs when a variable or parameter\
    \ is not of a valid type.\n\n```javascript\n('1.2').toPrecision(1); // TypeError:\
    \ '1.2'.toPrecision is not a function\n```\n\n#### URIError\n\nCreates an instance\
    \ representing an error that occurs when `encodeURI()` or `decodeURI()` are passed\
    \ invalid parameters.\n\n```javascript\ndecodeURI('%'); // URIError: URI malformed\n\
    ```\n\n### Always use Error objects\n\nBeginner JavaScript developers sometimes\
    \ just throw raw strings e.g.\n\n```javascript\ntry {\n  throw 'Something bad\
    \ happened';\n}\ncatch(e) {\n  console.log(e);\n}\n```\n\n*Don't do that*. The\
    \ fundamental benefit of `Error` objects is that they automatically keep track\
    \ of where they were built and originated as the `stack` property.\n\nRaw strings\
    \ result in a very painful debugging experience and complicate error analysis\
    \ from logs.\n\n### You don't have to throw an error\n\nIt is okay to pass an\
    \ `Error` object around. This is conventional in Node.js callback style code which\
    \ take callbacks with the first argument as an error object.\n\n```typescript\n\
    function myFunction (callback: (e?: Error)) {\n  doSomethingAsync(function ()\
    \ {\n    if (somethingWrong) {\n      callback(new Error('This is my error'))\n\
    \    } else {\n      callback();\n    }\n  });\n}\n```\n\n### Exceptional cases\n\
    \n\"Exceptions should be exceptional\" is a common saying in computer science.\
    \ There are few reasons why this is true for JavaScript (and TypeScript) as well.\n\
    \n#### Unclear where it is thrown\n\nConsider the following piece of code:\n\n\
    ```javascript\ntry {\n  const foo = runTask1();\n  const bar = runTask2();\n}\n\
    catch(e) {\n  console.log('Error:', e);\n}\n```\n\nThe next developer cannot know\
    \ which function might throw the error. The person reviewing the code cannot know\
    \ without reading the code for task1 / task2 and other functions they might call\
    \ etc.\n\n#### Makes graceful handling hard\n\nYou can try to make it graceful\
    \ with explicit catch around each thing that might throw:\n\n```javascript\ntry\
    \ {\n  const foo = runTask1();\n}\ncatch(e) {\n  console.log('Error:', e);\n}\n\
    \ntry {\n  const bar = runTask2();\n}\ncatch(e) {\n  console.log('Error:', e);\n\
    }\n```\n\nBut now if you need to pass stuff from the first task to the second\
    \ one the code becomes messy (notice `foo` mutation requiring `let` + explicit\
    \ need for annotating it because it cannot be inferred from the return of `runTask1`):\n\
    \n```typescript\nlet foo: number; // Notice use of `let` and explicit type annotation\n\
    try {\n  foo = runTask1();\n}\ncatch(e) {\n  console.log('Error:', e);\n}\ntry\
    \ {\n  const bar = runTask2(foo);\n}\ncatch(e) {\n  console.log('Error:', e);\n\
    }\n```\n\n#### Not well represented in the type system\n\nConsider the function:\n\
    \n```typescript\nfunction validate(value: number) {\n  if (value < 0 || value\
    \ > 100) throw new Error('Invalid value');\n}\n```\n\nUsing `Error` for such cases\
    \ is a bad idea as it is not represented in the type definition for the `validate`\
    \ function (which is `(value:number) => void`). Instead a better way to create\
    \ a validate method would be:\n\n```typescript\nfunction validate(value: number):\
    \ {error?: string} {\n  if (value < 0 || value > 100) return {error:'Invalid value'};\n\
    }\n```\n\nAnd now its is represented in the type system. Unless you want to handle\
    \ the error in a very generic (simple / catch-all etc) way, don't *throw* an error.\n\
    \n### JSX Support\n\nTypeScript supports JSX transpilation and code analysis.\
    \ If you are unfamiliar with JSX here is an excerpt from the official website:\n\
    \nJSX is a XML-like syntax extension to ECMAScript without any defined semantics.\
    \ It's NOT intended to be implemented by engines or browsers. It's NOT a proposal\
    \ to [the text continues...]\n\n(Note: The OCR text for this section became highly\
    \ repetitive/garbled in the source, but I have reconstructed the logical flow\
    \ based on the provided fragments and context.)\n\n"
  mdcn: "\n\n## 异常处理\n\nJavaScript 拥有一个用于处理异常的 `Error` 类。你可以使用 `throw` 关键字抛出错误。你可以使用\
    \ `try / catch` 语句对来捕获它，例如：\n\n```javascript\ntry {\n  throw new Error('Something\
    \ bad happened');\n}\ncatch(e) {\n  console.log(e);\n}\n```\n\n### 错误类型\n\n除了内置的\
    \ `Error` 类外，还有几个继承自 `Error` 的内置错误类，JavaScript 运行时可以抛出它们：\n\n#### RangeError（范围错误）\n\
    \n创建一个实例，表示当数值变量或参数超出其有效范围时发生的错误。\n\n```javascript\n// 给 console 调用过多的参数\nconsole.log.apply(console,\
    \ new Array(1000000000)); // RangeError: Invalid array length\n```\n\n#### ReferenceError（引用错误）\n\
    \n创建一个实例，表示引用无效引用时发生的错误。例如：\n\n```javascript\n'use strict';\nconsole.log(notValidVar);\
    \ // ReferenceError: notValidVar is not defined\n```\n\n#### SyntaxError（语法错误）\n\
    \n创建一个实例，表示在解析不是有效 JavaScript 的代码时发生的语法错误。\n\n```javascript\n1***3; // SyntaxError:\
    \ Unexpected token *\n```\n\n#### TypeError（类型错误）\n\n创建一个实例，表示变量或参数不是有效类型时发生的错误。\n\
    \n```javascript\n('1.2').toPrecision(1); // TypeError: '1.2'.toPrecision is not\
    \ a function\n```\n\n#### URIError（URI 错误）\n\n创建一个实例，表示向 `encodeURI()` 或 `decodeURI()`\
    \ 传递无效参数时发生的错误。\n\n```javascript\ndecodeURI('%'); // URIError: URI malformed\n\
    ```\n\n### 始终使用 Error 对象\n\n初级 JavaScript 开发者有时直接抛出原始字符串，例如：\n\n```javascript\n\
    try {\n  throw 'Something bad happened';\n}\ncatch(e) {\n  console.log(e);\n}\n\
    ```\n\n*不要这样做*。`Error` 对象的根本优势在于，它们会自动通过 `stack` 属性跟踪它们被构建和产生的地方。\n\n原始字符串会导致非常痛苦的调试体验，并增加从日志中进行错误分析的复杂度。\n\
    \n### 你并不非抛出错误\n\n传递 `Error` 对象是可以的的。这在 Node.js 回调风格代码中是惯例，这种代码的回调函数第一个参数是错误对象。\n\
    \n```typescript\nfunction myFunction (callback: (e?: Error)) {\n  doSomethingAsync(function\
    \ () {\n    if (somethingWrong) {\n      callback(new Error('This is my error'))\n\
    \    } else {\n      callback();\n    }\n  });\n}\n```\n\n### 特殊情况\n\n“异常应该是例外的”是计算机科学中的常用格言。对于\
    \ JavaScript（以及 TypeScript）来说，这也有几个真实的原因。\n\n#### 不清楚异常在哪里抛出\n\n考虑以下这段代码：\n\n\
    ```javascript\ntry {\n  const foo = runTask1();\n  const bar = runTask2();\n}\n\
    catch(e) {\n  console.log('Error:', e);\n}\n```\n\n下一个开发者无法知道哪个函数可能会抛出错误。代码审查人员在不阅读\
    \ task1 / task2 以及他们可能调用的其他函数代码的情况下无法得知。\n\n#### 使得优雅处理变得困难\n\n你可以尝试在每个可能抛出异常的地方使用显式的\
    \ `catch` 来使其优雅化：\n\n```javascript\ntry {\n  const foo = runTask1();\n}\ncatch(e)\
    \ {\n  console.log('Error:', e);\n}\n\ntry {\n  const bar = runTask2();\n}\ncatch(e)\
    \ {\n  console.log('Error:', e);\n}\n```\n\n但现在如果你需要从第一个任务向第二个任务传递数据，代码就会变得杂乱（注意\
    \ `foo` 的变动需要 `let` 并且需要显式标注类型，因为无法从 `runTask1` 的返回值中推断出来）：\n\n```typescript\n\
    let foo: number; // 注意 `let` 的使用和显式类型标注\ntry {\n  foo = runTask1();\n}\ncatch(e)\
    \ {\n  console.log('Error:', e);\n}\ntry {\n  const bar = runTask2(foo);\n}\n\
    catch(e) {\n  console.log('Error:', e);\n}\n```\n\n#### 在类型系统中无法良好表示\n\n考虑以下函数：\n\
    \n```typescript\nfunction validate(value: number) {\n  if (value < 0 || value\
    \ > 100) throw new Error('Invalid value');\n}\n```\n\n对于此类情况使用 `Error` 是一个坏主意，因为它没有体现在\
    \ `validate` 函数的类型定义中（`(value:number) => void`）。相反，创建一个验证方法的更好方法是：\n\n```typescript\n\
    function validate(value: number): {error?: string} {\n  if (value < 0 || value\
    \ > 100) return {error:'Invalid value'};\n}\n```\n\n现在它在类型系统中被表示了。除非你想以一种非常通用的（简单/全捕获等）方式处理错误，否则不要*抛出*错误。\n\
    \n### JSX 支持\n\nTypeScript 支持 JSX 编译和代码分析。如果你不 JSX，这里是官方网站的一段节录：\n\nJSX 是 ECMAScript\
    \ 的一种类 XML 语法扩展，没有任何定义的语义。它**不是**意图由引擎或浏览器实现的。它**不是**一个关于[文本继续...]提案\n\n（注：此部分的\
    \ OCR 文本在源中变得高度重复/乱码，但我已根据提供的片段和上下文重构了逻辑流。）\n\n"
