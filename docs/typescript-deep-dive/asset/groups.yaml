  - "[PAGE 96]\n\n**Example 3**\n\nimport foo = require('foo');\n\nvar bar = foo;\n\
    \nwill generate the JavaScript (assuming commonjs):\n\nvar foo = require('foo');\n\
    \nvar bar = foo;\n\nThis is because  foo  is used as a variable.\n\n**Use case:\
    \ Lazy loading**\n\nType inference needs to be done *upfront*. This means that\
    \ if you want to use some type from\n\na file  foo  in a file  bar  you will have\
    \ to do:\n\nimport foo = require('foo');\n\nvar bar: foo.SomeType;\n\nHowever\
    \ you might want to only load the file  foo  at runtime under certain conditions.\
    \ For\n\nsuch cases you should use the  import ed name only in *type annotations*\
    \ and **not** as a\n\n*variable*. This removes any *upfront* runtime dependency\
    \ code being injected by TypeScript.\n\nThen *manually import* the actual module\
    \ using code that is specific to your module loader.\n\nAs an example, consider\
    \ the following  commonjs  based code where we only load a module\n\n 'foo'  on\
    \ a certain function call:\n\nimport foo = require('foo');\n\nexport function\
    \ loadFoo() {\n\n // This is lazy loading \\`foo\\` and using the original module\
    \ \\*only\\* as a type annot\n\nation\n\n var \\_foo: typeof foo = require('foo');\n\
    \n // Now use \\`\\_foo\\` as a variable instead of \\`foo\\`.\n\n}\n\nA similar\
    \ sample in  amd  (using requirejs) would be:\n\nFile Module Details\n\n97"
- md: "\nimport foo = require('foo');\n\nexport function loadFoo() {\n  // This is\
    \ lazy loading `foo` and using the original module *only* as a type annotation\n\
    \  require(['foo'], (_foo: typeof foo) => {\n    // Now use `_foo` as a variable\
    \ instead of `foo`.\n  });\n}\n\nThis pattern is commonly used:\nin web apps where\
    \ you load certain JavaScript on particular routes,\nin node applications where\
    \ you only load certain modules if needed to speed up application bootup.\n\n\
    **Use case: Breaking Circular dependencies**\n\nSimilar to the lazy loading use\
    \ case, certain module loaders (commonjs/node and amd/requirejs) don't work well\
    \ with circular dependencies. In such cases, it is useful to have *lazy loading*\
    \ code in one direction and loading the modules upfront in the other direction.\n\
    \n**Use case: Ensure Import**\n\nSometimes you want to load a file just for the\
    \ side effect (e.g. the module might register itself with some library like CodeMirror\
    \ addons etc.). However if you just do a `import/require`, the transpiled JavaScript\
    \ will not contain a dependency on the module and your module loader (e.g. webpack)\
    \ might completely ignore the import. In such cases you can use a `ensureImport`\
    \ variable to ensure that the compiled JavaScript takes a dependency on the module\
    \ e.g.:\n\n```typescript\nimport foo = require('./foo');\nimport bar = require('./bar');\n\
    import bas = require('./bas');\n\nconst ensureImport: any = foo || bar || bas;\n\
    ```\n\nThe key advantage of using `import/require` instead of just `var/require`\
    \ is that you get file path completion / checking / goto definition navigation\
    \ etc.\n\nFile Module Details\n\n## globals.d.ts\n\nWe discussed *global* vs.\
    \ *file* modules when covering projects and recommended using file based modules\
    \ and not polluting the global namespace.\n\nNevertheless, if you have beginning\
    \ TypeScript developers, you can give them a `globals.d.ts` file to put interfaces\
    \ / types in the global namespace to make it easy to have some *types* just *magically*\
    \ available for consumption in *all* your TypeScript code.\n\nFor any code that\
    \ is going to generate *JavaScript* we highly recommend using *file modules*.\n\
    \n`globals.d.ts` is great for adding extensions to `lib.d.ts` if you need to.\
    \ It's good for quick `declare module \"some-library-you-dont-care-to-get-defs-for\"\
    ;` when doing TS to JS migrations.\n\n## Namespaces\n\nNamespaces provide you\
    \ with a convenient syntax around a common pattern used in JavaScript:\n\n```javascript\n\
    (function(something) {\n  something.foo = 123;\n})(something || (something = {}))\n\
    ```\n\nBasically `something || (something = {})` allows an anonymous function\
    \ `function(something) {}` to *add stuff to an existing object* (the `something\
    \ ||` portion) or *start a new object then add stuff to that object* (the `||\
    \ (something = {})` portion). This means that you can have two such blocks split\
    \ by some execution boundary:\n\n```javascript\n(function(something) {\n  something.foo\
    \ = 123;\n})(something || (something = {}))\nconsole.log(something); // {foo:123}\n\
    \n(function(something) {\n  something.bar = 456;\n})(something || (something =\
    \ {}))\nconsole.log(something); // {foo:123, bar:456}\n```\n\nThis is commonly\
    \ used in the JavaScript land for making sure that stuff doesn't leak into the\
    \ global namespace. With file based modules you don't need to worry about this,\
    \ but the pattern is still useful for *logical grouping* of a bunch of functions.\
    \ Therefore TypeScript provides the `namespace` keyword to group these e.g.:\n\
    \n```typescript\nnamespace Utility {\n  export function log(msg) {\n    console.log(msg);\n\
    \  }\n  export function error(msg) {\n    console.error(msg);\n  }\n}\n\n// usage\n\
    Utility.log('Call me');\nUtility.error('maybe!');\n```\n\nThe `namespace` keyword\
    \ generates the same JavaScript that we saw earlier:\n\n```javascript\n(function\
    \ (Utility) {\n  // Add stuff to Utility\n})(Utility || (Utility = {}));\n```\n\
    \nOne thing to note is that namespaces can be nested so you can do stuff like\
    \ `namespace Utility.Messaging` to nest a `Messaging` namespace under `Utility`.\n\
    \nFor most projects we recommend using external modules and using `namespace`\
    \ for quick demos and porting old JavaScript code.\n\n## Dynamic import expressions\n\
    \n**Dynamic import expressions** are a new feature and part of **ECMAScript**\
    \ that allows users to asynchronously request a module at any arbitrary point\
    \ in your program. **TC39** JavaScript committee has its own proposal which is\
    \ in stage 3, and it’s called `import()` proposal for JavaScript.\n\nFrom other\
    \ side, **webpack** bundler has a feature called **Code Splitting** which allows\
    \ you to split your bundle into chunks which can be downloaded asynchronously\
    \ at a later time. For instance, this allows to serve a minimal bootstrap bundle\
    \ first and to asynchronously load additional features later.\n\nAt first glance,\
    \ it’s natural to think (if we are using webpack in our dev workflow) that by\
    \ using TypeScript 2.4 dynamic import expressions, will **automatically produce**\
    \ bundle chunks and automatically code-split you JS final bundle. BUT, that is\
    \ not as easy as it seems, because it depends on the **tsconfig.json configuration**\
    \ we are working with.\n\nThe thing is that webpack code splitting supports two\
    \ similar techniques to achieve this goal: using **import()** (preferred, ECMAScript\
    \ proposal) and **require.ensure()** (legacy, webpack specific). And what that\
    \ means is the expected TypeScript output is to **leave the import() statement\
    \ as it is** instead of transpile it to anything else.\n\nLet’s see and an example\
    \ to figure how to configure webpack + TypeScript 2.4. In the following code I\
    \ want to **lazy load the library moment** but I am interested on code splitting\
    \ as well, which means, having moment library in a separate chunk of JS (javascript\
    \ file) and that will be loaded only when required.\n\n```typescript\nimport(/\\\
    * webpackChunkName: \"momentjs\" \\*/ \"moment\")\n  .then((moment) => {\n   \
    \ // lazyModule has all of the proper types, autocomplete works,\n    // type\
    \ checking works, code references work \\o/\n    const time = moment().format();\n\
    \    console.log(\"TypeScript >= 2.4.0\", time);\n  })\n  .catch((err) => {\n\
    \    console.log(\"Failed to load moment\", err);\n  });\n```\n\nHere is the `tsconfig.json`:\n\
    \n```json\n{\n  \"compilerOptions\": {\n    \"target\": \"es5\",\n    \"module\"\
    : \"esnext\",\n    \"lib\": [\"dom\", \"es2015\", \"promise\"],\n    \"jsx\":\
    \ \"react\",\n    \"declaration\": false,\n    \"sourceMap\": true,\n    \"outDir\"\
    : \"./dist\",\n    \"strict\": true,\n    \"moduleResolution\": \"node\",\n  \
    \  \"typeRoots\": [\"./node_modules/@types\"]\n  }\n}\n```\n\n## TypeScript with\
    \ Node.js\n\nTypeScript has had *first class* support for Node.js since inception.\
    \ Here's how to setup a quick Node.js project:\n\nNote: many of these steps are\
    \ actually just common Node.js setup steps\n1. Setup a Node.js project `package.json`.\
    \ Quick one: `npm init -y`\n2. Add TypeScript: `npm install typescript --save-dev`\n\
    3. Add `node.d.ts`: `npm install @types/node --save-dev`\n4. Init a `tsconfig.json`\
    \ for TypeScript options: `node ./node_modules/typescript/lib/tsc --init`\n5.\
    \ Make sure you have `compilerOptions.module:commonjs` in your tsconfig.json\n\
    \nThat's it! Fire up your IDE (e.g. `alm -o`) and play around. Now you can use\
    \ all the built in node modules (e.g. `import fs = require('fs');`) with all the\
    \ safety and developer ergonomics of TypeScript!\n\n**Bonus: Live compile + run**\n\
    \nAdd `ts-node` which we will use for live compile + run in node: `npm install\
    \ ts-node --save-dev`\nAdd `nodemon` which will invoke `ts-node` whenever a file\
    \ is changed: `npm install nodemon --save-dev`\n\nNow just add a `script` target\
    \ to your `package.json` based on your application entry e.g. assuming its `index.ts`:\n\
    \n```json\n\"scripts\": {\n  \"start\": \"npm run build:live\",\n  \"build:live\"\
    : \"nodemon --exec ./node_modules/.bin/ts-node -- ./index.ts\"\n}\n```\n\nSo you\
    \ can now run `npm start` and as you edit `index.ts`:\nnodemon reruns its command\
    \ (ts-node)\nts-node transpiles automatically picking up tsconfig.json and the\
    \ installed typescript version,\nts-node runs the output javascript through Node.js.\n"
  mdcn: "\n\nimport foo = require('foo');\n\nexport function loadFoo() {\n  // 这里是懒性加载\
    \ `foo` 并且将原始模块*仅*作为类型注释\n  require(['foo'], (_foo: typeof foo) => {\n    // 现在将\
    \ `_foo` 作为变量代替 `foo`。\n  });\n}\n\n这种模式通常用于：\n在 Web 应用中，你会在特定路由上加载某些 JavaScript；\n\
    在 node 应用中，你只在需要时才加载某些模块，以加快应用程序的启动。\n\n**用例：打破循环依赖**\n\n与懒性加载的用例类似，某些模块加载器（commonjs/node\
    \ 和 amd/requirejs）处理循环依赖时效果并不佳。在这种情况下，在一个方向上使用*懒性加载*代码，而在另一个方向上预先加载模块是有用的。\n\n\
    **用例：确保导入（Ensure Import）**\n\n有时你可能只是为了副作用加载一个文件（例如，该模块可能会向像 CodeMirror 插件等某些库注册自身）。但是，如果你只是进行\
    \ `import/require`，编译后的 JavaScript 将不会包含对该模块的依赖关系，你的模块加载器（例如 webpack）可能会完全忽略该导入。在这种情况下，你可以使用\
    \ `ensureImport` 变量来确保编译后的 JavaScript 包含对模块的依赖，例如：\n\n```typescript\nimport foo\
    \ = require('./foo');\nimport bar = require('./bar');\nimport bas = require('./bas');\n\
    \nconst ensureImport: any = foo || bar || bas;\n```\n\n使用 `import/require` 而不是简单的\
    \ `var/require` 的优势在于你可以获得文件路径补全/检查/跳转到定义等功能。\n\n文件模块详情\n\n## globals.d.ts\n\n\
    我们在介绍项目时讨论过*全局（global）*与*文件（file）*模块的区别，并建议使用基于文件的模块，而不是污染全局命名空间。\n\n尽管如此，如果你有初水平的\
    \ TypeScript 开发者，可以给他们一个 `globals.d.ts` 文件，将接口/类型放在全局命名空间中，这样某些*类型*就可以*魔法般地*直接供你的*所有*\
    \ TypeScript 代码调用。\n\n对于任何将要生成 *JavaScript* 的代码，我们强烈建议使用*文件模块*。\n\n`globals.d.ts`\
    \ 非常适合在需要时为 `lib.d.ts` 添加扩展。在进行 TS 到 JS 的迁移时，它可以快速执行 `declare module \"some-library-you-dont-care-to-get-defs-for\"\
    ;`。\n\n## 命名空间 (Namespaces)\n\n命名空间为你提供了一种方便的语法，用于 JavaScript 中的一种常用模式：\n\n```javascript\n\
    (function(something) {\n  something.foo = 123;\n})(something || (something = {}))\n\
    ```\n\n基本上 `something || (something = {})` 允许匿名函数 `function(something) {}` 向现有对象*添加内容*（`something\
    \ ||` 部分）或*启动一个新对象然后向该对象添加内容*（`|| (something = {})` 部分）。这意味着你可以拥有两个由执行边界分隔的此类块：\n\
    \n```javascript\n(function(something) {\n  something.foo = 123;\n})(something\
    \ || (something = {}))\nconsole.log(something); // {foo:123}\n\n(function(something)\
    \ {\n  something.bar = 456;\n})(something || (something = {}))\nconsole.log(something);\
    \ // {foo:123, bar:456}\n```\n\n这在 JavaScript 世界中常用，以确保内容不会泄露到全局命名空间。使用基于文件的模块你不需要担心这个，但该模式对于一组函数的*逻辑分组*仍然有用。因此，TypeScript\
    \ 提供了 `namespace` 关键字来对这些进行分组，例如：\n\n```typescript\nnamespace Utility {\n  export\
    \ function log(msg) {\n    console.log(msg);\n  }\n  export function error(msg)\
    \ {\n    console.error(msg);\n  }\n}\n\n// 使用方法\nUtility.log('Call me');\nUtility.error('maybe!');\n\
    ```\n\n`namespace` 关键字生成的 JavaScript 与我们之前相同：\n\n```javascript\n(function (Utility)\
    \ {\n  // 向 Utility 添加内容\n})(Utility || (Utility = {}));\n```\n\n需要注意的是，命名空间是可以嵌套的，你可以执行类似\
    \ `namespace Utility.Messaging` 在 `Utility` 下嵌套一个 `Messaging` 命名空间。\n\n对于大多数项目，我们建议使用外部模块，并将\
    \ `namespace` 用于快速演示和迁移旧 JavaScript 代码。\n\n## 动态导入表达式 (Dynamic import expressions)\n\
    \n**动态导入表达式**是一项新功能，也是 **ECMAScript** 的一部分，它允许用户在程序的任何任意位置异步请求模块。**TC39** JavaScript\
    \ 委员会有一个自己的提案，目前正处于第 3 阶段，被称为 JavaScript 的 `import()` 提案。\n\n另一方面，**webpack**\
    \ 封装器有一个名为**代码分割 (Code Splitting)** 的功能，它允许你将包拆分成块，这些块可以在以后异步下载。例如，这允许先提供一个最小的引导包，稍后再异步加载额外功能。\n\
    \n乍一看，人们自然会认为（如果在开发工作流中使用 webpack），使用 TypeScript 2.4 的动态导入表达式将**自动生成**包块并自动对你的最终\
    \ JS 包进行代码分割。但是，这并没有看起来那么简单，因为它取决于我们正在使用的 **tsconfig.json 配置**。\n\n事实是，webpack\
    \ 代码分割支持两种实现此目的的类似技术：使用 **import()**（优选，ECMAScript 提案）和 **require.ensure()**（旧版，webpack\
    \ 特有）。这意味着预期的 TypeScript 输出是。\n\n"
