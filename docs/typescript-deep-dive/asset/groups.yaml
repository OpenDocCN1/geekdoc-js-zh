- md: "\nInline types are great for quickly providing a one-off type annotation for\
    \ something. It saves you the hassle of coming up with (a potentially bad) type\
    \ name. However, if you find yourself putting in the same type annotation inline\
    \ multiple times it's a good idea to consider refactoring it into an interface\
    \ (or a type alias covered later in this section).\n\n## Special Types\n\nBeyond\
    \ the primitive types that have been covered there are a few types that have special\
    \ meaning in TypeScript. These are `any`, `null`, `undefined`, `void`.\n\n###\
    \ any\n\nThe `any` type holds a special place in the TypeScript type system. It\
    \ gives you an escape hatch from the type system to tell the compiler to bugger\
    \ off. `any` is compatible with any and all types in the type system. This means\
    \ that anything can be assigned to it and it can be assigned to anything else.\
    \ This is demonstrated in the example below:\n\n```typescript\nvar power: any;\n\
    power = '123'; // Takes any\npower = 123; // Is compatible with all types\nvar\
    \ num: number;\npower = num;\n```\n\nIf you are porting JavaScript code to TypeScript,\
    \ you are going to be friends with `any` in the beginning. However, don't take\
    \ this friendship too seriously as it means you to ensure type safety. You are\
    \ basically telling the compiler to not do static analysis.\n\n### null and undefined\n\
    \n`null` and `undefined` literals are effectively treated by the type system as\
    \ something of type `any`. These literals can be assigned to any other type. This\
    \ is demonstrated-below:\n\n```typescript\nvar num: number;\nvar str: string;\n\
    num = null;\nstr = undefined;\n```\n\n### void\n\nUse `void` to signify that a\
    \ function does not have a return type:\n\n```typescript\nfunction log(message:\
    \ void) {\n    console.log(message);\n}\n```\n\n### Generics\n\nMany algorithms\
    \ and data structures in computer science do not depend on the actual type of\
    \ the object. However you still want to enforce a constraint between variables.\
    \ A simple example is a function that takes a list of items and returns a list\
    \ of items. The constraint here is between what is passed in the function and\
    \ what is returned by the function:\n\n```typescript\nfunction reverse<T>(items:\
    \ T[]): T[] {\n    var result: T[] = [];\n    for (let i = items.length - 1; i\
    \ >= 0; i--) {\n        result.push(items[i]);\n    }\n    return result;\n}\n\
    \nvar sample = [1, 2, 3];\nvar reversed = reverse(sample);\nconsole.log(reversed);\
    \ // 3,2,1\nreversed[0] = '1'; // Error!\nreversed[1] = '2'; // Error!\nreversed[0]\
    \ = 1; // Okay\nreversed[1] = 2; // Okay\n```\n\nHere you are basically saying\
    \ that the function `reverse` takes an array of some type `T` (notice the type\
    \ parameter in `reverse<T>`) and returns an array of type `T` (notice the return\
    \ type). Because the `reverse` function returns items of the same type it takes,\
    \ TypeScript knows the `reversed` variable is also of type `number[] and will\
    \ give you type safety. Similarly, if you pass in an array of `string` to the\
    \ `reverse` function the result is also an array of `string` and you get similar\
    \ type safety as shown below:\n\n```typescript\nvar strArr = ['1', '2'];\nvar\
    \ reversedStrs = reverse(strArr);\nreversedStrs = [1, 2]; // Error!\n```\n\nIn\
    \ fact JavaScript arrays already have a `.reverse` function and TypeScript does\
    \ indeed use generics to define its structure:\n\n```typescript\ninterface Array<T>\
    \ {\n    reverse(): T[];\n    // ...\n}\n```\n\nThis means that you get type safety\
    \ when calling `.reverse` on any array as shown below:\n\n```typescript\nvar numArr\
    \ = [1, 2];\nvar reversedNums = numArr.reverse();\nreversedNums = ['1', '2'];\
    \ // Error!\n```\n\nWe will discuss more about the `Array<T>` interface later\
    \ when we present `lib.d.ts` in the Ambient Declarations section.\n\n## Union\
    \ Type\n\nQuite commonly in JavaScript you want to allow a property to be one\
    \ of multiple types e.g. a `string` or a `number`. This is where the union type\
    \ (denoted by `|` in a type annotation e.g. `string|number`) comes in handy. A\
    \ common use case is a function that can take a single object or an array of the\
    \ object e.g.:\n\n```typescript\nfunction formatCommandline(command: string[]\
    \ | string) {\n    var line = '';\n    if (typeof command === 'string') {\n  \
    \      line = command.trim();\n    } else {\n        line = command.join(' ').trim();\n\
    \    }\n    // Do stuff with line: string\n}\n```\n\n## Intersection Type\n\n\
    `extend` is a very common pattern in JavaScript where you take two objects and\
    \ create a new one that has the features of both these objects. An Intersection\
    \ Type allows you to use this pattern in a safe way as demonstrated below:\n\n\
    ```typescript\nfunction extend<T, U>(first: T, second: U): T & U {\n    let result\
    \ = <T & U> {};\n    for (let id in first) {\n        result[id] = first[id];\n\
    \    }\n    for (let id in second) {\n        if (!result.hasOwnProperty(id))\
    \ {\n            result[id] = second[id];\n        }\n    }\n    return result;\n\
    }\n\nvar x = extend({ a: \"hello\" }, { b: 42 });\n// x now has both `a` and `b`\n\
    var a = x.a;\nvar b = x.b;\n```\n\n## Tuple Type\n\nJavaScript doesn't have tuple\
    \ support, but TypeScript provides it. Tuples allow you to define an array with\
    \ a fixed number of elements and specific types for each position. This is demonstrated\
    \ below:\n\n```typescript\ntype Point = [number, number];\nvar p: Point = [1,\
    \ 2];\np = [1, 2, 3]; // Error!\n```\n\n## Type Alias\n\nType aliases allow you\
    \ to give a name to a type. This is useful for complex types or to make your code\
    \ more readable. Here are a few more examples:\n\n```typescript\ntype Name = string\
    \ | number;\nvar mySomeName: Name = \"John\";\nvar myOtherName: Name = 42;\n```\n\
    \n## Summary\n\nNow that you can start annotating most of your code we can jump\
    \ into the nitty details of all the power available in TypeScript.\n\n## Migrating\
    \ From JavaScript\n\nIn general the process consists of the following steps:\n\
    \n- Add a `tsconfig.json`.\n- Change your source file extensions from `.js` to\
    \ `.ts`.\n- Start suppressing errors using `any`.\n- Write new code in TypeScript\
    \ and make as little use of `any` as possible.\n- Go back to the old code and\
    \ start adding type annotations and fix identified bugs.\n- Use ambient definitions\
    \ for third party JavaScript code.\n"
  mdcn: "\n\n内联类型非常适合为某些内容快速提供一次性的类型注解。它省去了你构思（可能糟糕的）类型名的麻烦。然而，如果你发现自己多次在内联中放置相同的类型注解，那么考虑将其重构为接口（或在本节稍后部分介绍的类型别名）是一个好主意。\n\
    \n## 特殊类型\n\n除了已经涵盖的原始类型外，TypeScript 中还有几种具有特殊含义的类型。这些是 `any`、`null`、`undefined`\
    \ 和 `void`。\n\n### any\n\n`any` 类型在 TypeScript 类型系统中占据着特殊地位。它为你提供了一个逃离类型系统的逃口，告诉编译器“滚远点”。`any`\
    \ 与类型系统中的任何及所有类型兼容。这意味着任何内容都可以赋值给它，它也可以赋值给其他任何内容。示例所示：\n\n```typescript\nvar power:\
    \ any;\npower = '123'; // 接受任何类型\npower = 123; // 兼容所有类型\nvar num: number;\npower\
    \ = num;\n```\n\n如果你正在将 JavaScript 代码迁移到 TypeScript，起初你会和 `any` 成为朋友。然而，不要太当真这种友谊，因为这意味着你放弃了确保类型安全。你基本上是在告诉编译器不要进行静态分析。\n\
    \n### null 和 undefined\n\n`null` 和 `undefined` 字面量在类型系统中实际上被处理为 `any` 类型。这些字面量可以赋值给任何其他类型。下所示：\n\
    \n```typescript\nvar num: number;\nvar str: string;\nnum = null;\nstr = undefined;\n\
    ```\n\n### void\n\n使用 `void` 表示一个函数没有返回类型：\n\n```typescript\nfunction log(message:\
    \ void) {\n    console.log(message);\n}\n```\n\n### 泛型\n\n计算机科学中的许多算法和数据结构并不取决于对象的实际类型。然而，你仍然想在变量之间强制约束。一个简单的示例是一个接收项列表并返回项列表的函数：\n\
    \n```typescript\nfunction reverse<T>(items: T[]): T[] {\n    var result: T[] =\
    \ [];\n    for (let i = items.length - 1; i >= 0; i--) {\n        result.push(items[i]);\n\
    \    }\n    return result;\n}\n\nvar sample = [1, 2, 3];\nvar reversed = reverse(sample);\n\
    console.log(reversed); // 3,2,1\nreversed[0] = '1'; // Error!\nreversed[1] = '2';\
    \ // Error!\nreversed[0] = 1; // Okay\nreversed[1] = 2; // Okay\n```\n\n在这里，你基本上是在说函数\
    \ `reverse` 接收某种类型 `T` 的数组（注意 `reverse<T>` 中的类型参数）并返回类型为 `T` 的数组（注意返回类型）。由于 `reverse`\
    \ 函数返回的项目与其接收的类型相同，TypeScript 知道 `reversed` 变量也是 `number[]` 类型，并将为你提供类型安全。同样，如果你向\
    \ `reverse` 函数传递一个 `string` 数组，结果也是 `string` 数组，你将获得如下所示类似的类型安全：\n\n```typescript\n\
    var strArr = ['1', '2'];\nvar reversedStrs = reverse(strArr);\nreversedStrs =\
    \ [1, 2]; // Error!\n```\n\n事实上，JavaScript 数组已经有一个 `.reverse` 函数，且 TypeScript\
    \ 确实使用泛型来定义其结构：\n\n```typescript\ninterface Array<T> {\n    reverse(): T[];\n\
    \    // ...\n}\n```\n\n这意味着当你在任何数组上调用 `.reverse` 时都可以获得类型安全，如下所示：\n\n```typescript\n\
    var numArr = [1, 2];\nvar reversedNums = numArr.reverse();\nreversedNums = ['1',\
    \ '2']; // Error!\n```\n\n我们稍后在“环境声明”部分介绍 `lib.d.ts` 时会更多地讨论 `Array<T>` 接口。\n\n\
    ## 联合类型\n\n在 JavaScript 中，你经常允许一个属性为多种类型中的一种，例如 `string` 或 `number`。这就是联合类型（在类型注解中用\
    \ `|` 表示，例如 `string|number`）派上用场的地方。一个常见的用例是一个可以接收单个对象或对象数组的函数，例如：\n\n```typescript\n\
    function formatCommandline(command: string[] | string) {\n    var line = '';\n\
    \    if (typeof command === 'string') {\n        line = command.trim();\n    }\
    \ else {\n        line = command.join(' ').trim();\n    }\n    // 对 line: string\
    \ 进行操作\n}\n```\n\n## 交叉类型\n\n`extend` 是 JavaScript 中一种非常常见的模式，你获取两个对象并创建一个具有这两个对象特征的新对象。交叉类型允许你以安全的方式使用这种模式，如下所示：\n\
    \n```typescript\nfunction extend<T, U>(first: T, second: U): T & U {\n    let\
    \ result = <T & U> {};\n    for (let id in first) {\n        result[id] = first[id];\n\
    \    }\n    for (let id in second) {\n        if (!result.hasOwnProperty(id))\
    \ {\n            result[id] = second[id];\n        }\n    }\n    return result;\n\
    }\n\nvar x = extend({ a: \"hello\" }, { b: 42 });\n// x 现在拥有 `a` 和 `b`\nvar a\
    \ = x.a;\nvar b = x.b;\n```\n\n## 元组类型\n\nJavaScript 没有元组支持，但 TypeScript 提供了。元组允许你定义具有固定数量元素且每个位置具有特定类型的数组。如下所示：\n\
    \n```typescript\ntype Point = [number, number];\nvar p: Point = [1, 2];\np = [1,\
    \ 2, 3]; // Error!\n```\n\n## 类型别名\n\n类型别名允许你为类型取名。这对于复杂类型或提高代码可读性非常有用。这里是更多的例子：\n\
    \n```typescript\ntype Name = string | number;\nvar mySomeName: Name = \"John\"\
    ;\nvar myOtherName: Name = 42;\n```\n\n## 总结\n\n现在你已经开始为大部分代码注解，我们可以深入探讨 TypeScript\
    \ 支持的所有强大细节。\n\n## 从 JavaScript 迁移\n\n通常情况下该过程包含以下步骤：\n\n- 添加一个 `tsconfig.json`。\n\
    - 将源文件扩展名从 `.js` 改为 `.ts`。\n- 使用 `any` 开始抑制错误。\n- 使用 TypeScript 编写新代码，并尽可能少使用\
    \ `any`。\n- 返回旧代码并添加类型注解，修复发现的错误。\n- 为第三方 JavaScript 代码使用环境定义。\n\n"
