    var name: Name;\n\nname = {\n\n first: 'John',\n\n second: 'Doe'\n\n};\n\nname\
    \ = { // Error : \\`second\\` is missing\n\n first: 'John'\n\n};\n\nname = { //\
    \ Error : \\`second\\` is the wrong type\n\n first: 'John',\n\n second: 1337\n\
    \n};\n\nHere we've composed the annotations  first: string  +  second: string\
    \  into a new\n\nannotation  Name  that enforces the type checks on individual\
    \ members. Interfaces have a lot\n\nof power in TypeScript and we will dedicate\
    \ an entire section to how you can use that to your\n\nadvantage.\n\n**Inline\
    \ Type Annotation**\n\nInstead of creating a new  interface  you can annotate\
    \ anything you want *inline* using  :{\n\n/\\*Structure\\*/ } . The previous example\
    \ presented again with an inline type:\n\nvar name: {\n\n first: string;\n\n second:\
    \ string;\n\n};\n\nname = {\n\n first: 'John',\n\n second: 'Doe'\n\n};\n\nname\
    \ = { // Error : \\`second\\` is missing\n\n first: 'John'\n\n};\n\nname = { //\
