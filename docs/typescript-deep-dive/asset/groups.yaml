    \ (x: number) => number) {\n\n return add(456);\n\n}\n\nlet adder = new Adder('mary\
    \ had a little ');\n\nuseAdd(adder.add.bind(adder)); // No compile error!\n\n\
    useAdd((x) => adder.add(x)); // Error: number is not assignable to string\n\n\
    If you have a class member function that you **expect** to pass around, use an\
