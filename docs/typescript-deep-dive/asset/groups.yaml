  - "[PAGE 181]\n\nTypeScript objects are structurally typed. This means the *names*\
    \ don't matter as long as the\n\nstructures match\n\ninterface Point {\n\n x:\
    \ number,\n\n y: number\n\n}\n\nclass Point2D {\n\n constructor(public x:number,\
    \ public y:number){}\n\n}\n\nlet p: Point;\n\n// OK, because of structural typing\n\
    \np = new Point2D(1,2);\n\nThis allows you to create objects on the fly (like\
    \ you do in vanilla JS) and still have safety for\n\nwhenever it can be inferred.\n\
    \nAlso *more* data is considered fine:\n\ninterface Point2D {\n\n x: number;\n\
    \n y: number;\n\n}\n\ninterface Point3D {\n\n x: number;\n\n y: number;\n\n z:\
    \ number;\n\n}\n\nvar point2D: Point2D = { x: 0, y: 10 }\n\nvar point3D: Point3D\
    \ = { x: 0, y: 10, z: 20 }\n\nfunction iTakePoint2D(point: Point2D) { /\\* do\
    \ something \\*/ }\n\niTakePoint2D(point2D); // exact match okay\n\niTakePoint2D(point3D);\
    \ // extra information okay\n\niTakePoint2D({ x: 0 }); // Error: missing information\
    \ \\`y\\`\n\n**Variance**\n\nVariance is an easy to understand and important concept\
    \ for type compatibility analysis.\n\nFor simple types  Base  and  Child , if\
    \  Child  is a child of  Base , then instances of  Child \n\ncan be assigned to\
    \ a variable to type  Base .\n\nThis is polymorphism 101\n\nType Compatibility\n\
    \n182"
- md: "\nIn type compatibility of complex types composed of such Base and Child depending\
    \ on where the Base and Child in similar scenarios is driven by *variance*.\n\n\
    - Covariant: (corporate) only in *same direction*\n- Contravariant: (contra aka\
    \ negative) only in *opposite direction*\n- Bivari: (bi aka both) both co and\
    \ contra.\n- Invariant: if the types aren't exact then they are incompatible.\n\
    \nNote: For a completely sound type system in the presence of mutable data like\
    \ JavaScript, invariant is the only valid option. But as mentioned *convenience*\
    \ forces us to make unsound choices.\n\n## Functions\n\nThere are a few subtle\
    \ things to consider when comparing two functions.\n\n### Return Type\n\n- covariant:\
    \ The return type must contain at least enough data.\n\n/** Type Hierarchy */\n\
    interface Point2D { x: number; y: number; }\n\ninterface Point3D { x: number;\
    \ y: number; z: number; }\n\n/** Two sample functions */\nlet iMakePoint2D = ():\
    \ Point2D => ({ x: 0, y: 0 });\n\nlet iMakePoint3D = (): Point3D => ({ x: 0, y:\
    \ 0, z: 0 });\n\n/** Assignment */\niMakePoint2D = iMakePoint3D; // Okay\n\niMakePoint3D\
    \ = iMakePoint2D; // ERROR: Point2D is not assignable to Point3D\n\n### Number\
    \ of arguments\n\nLess arguments are okay (i.e. functions can chose to ignore\
    \ additional args). After all you are guaranteed to be called with at least enough\
    \ arguments.\n\nlet iTakeSomethingAndPassItAnErr = (x: (err: Error, data: any)\
    \ => void) => { /* do something */ };\n\niTakeSomethingAndPassItAnErr(() => null)\
    \ // Okay\n\niTakeSomethingAndPassItAnErr((err) => null) // Okay\n\niTakeSomethingAndPassItAnErr((err,\
    \ data) => null) // Okay\n\n// ERROR: function may be called with `more` not being\
    \ passed in\niTakeSomethingAndPassItAnErr((err, data, more) => null); // ERROR\n\
    \n### Optional and Rest Parameters\n\nOptional (pre determined count) and Rest\
    \ parameters (any count of arguments) are compatible, again for convenience.\n\
    \nlet foo = (x:number, y: number) => { /* do something */ }\n\nlet bar = (x?:number,\
    \ y?: number) => { /* do something */ }\n\nlet bas = (...args: number[]) => {\
    \ /* do something */ }\n\nfoo = bar = bas;\n\nbas = bar = foo;\n\nNote: optional\
    \ (in our example bar) and non optional (in our example foo) are only compatible\
    \ if strictNullChecks is false.\n\n### Types of arguments\n\n- bivariant: This\
    \ is designed to support common event handling scenarios.\n\n/** Event Hierarchy\
    \ */\ninterface Event { timestamp: number; }\n\ninterface MouseEvent extends Event\
    \ { x: number; y: number }\n\ninterface KeyEvent extends Event { keyCode: number\
    \ }\n\n/** Sample event listener */\nenum EventType { Mouse, Keyboard }\n\nfunction\
    \ addEventListener(eventType: EventType, handler: (n: Event) => void) {\n  /*\
    \ ... */\n}\n\n// Unsound, but useful and common. Works as function argument comparison\
    \ is bivariant\naddEventListener(EventType.Mouse, (e: MouseEvent) => console.log(e.x\
    \ + \",\" + e.y));\n\n// Undesirable alternatives in presence of soundness\naddEventListener(EventType.Mouse,\
    \ (e: Event) => console.log((<MouseEvent>e).x + \",\" + (<MouseEvent>e).y));\n\
    addEventListener(EventType.Mouse, <(e: Event) => void>((e: MouseEvent) => console.log(e.x\
    \ + \",\" + e.y)));\n\n// Still disallowed (clear error). Type safety enforced\
    \ for wholly incompatible types\naddEventListener(EventType.Mouse, (e: number)\
    \ => console.log(e));\n\nAlso makes Array<Child> assignable to Array<Base> (covariance)\
    \ as the functions are compatible. Array covariance requires all Array<Child>\
    \ functions to be assignable to Array<Base> e.g. push(t:Child) is assignable to\
    \ push(t:Base) which is made possible by argument bivariance.\n\nThis can be confusing\
    \ for people coming from other languages who would expect the following to error\
    \ but not in TypeScript:\n\n/** Type Hierarchy */\ninterface Point2D { x: number;\
    \ y: number; }\n\ninterface Point3D { x: number; y: number; z: number; }\n\n/**\
    \ Two sample functions */\nlet iTakePoint2D = (point: Point2D) => { /* do something\
    \ */ }\n\nlet iTakePoint3D = (point: Point3D) => { /* do something */ }\n\niTakePoint3D\
    \ = iTakePoint2D; // Okay : Reasonable\niTakePoint2D = iTakePoint3D; // Okay :\
    \ WHAT\n\n### Enums\n\nEnums are compatible with numbers, and numbers are compatible\
    \ with enums.\n\nenum Status { Ready, Waiting };\nlet status = Status.Ready;\n\
    let num = 0;\nstatus = num; // OK\n\nEnum values are considered nominally (as\
    \ opposed to structurally). from different enum types are incompatible.\n\nenum\
    \ Color { Red, Blue, Green };\nlet color = Color.Red;\nstatus = color; // ERROR\n\
    \n### Classes\n\nOnly instance members and methods are compared. constructors\
    \ and statics play no part. protected members must originate from the same class.\
    \ Such members make the class nominal.\n\nclass Animal {\n  protected: number;\n\
    \  constructor(name: string) { /* do something */ }\n}\n\nclass Size {\n  protected:\
    \ number;\n  constructor(name: number) { /* do something */ }\n}\n\nlet a: Animal;\n\
    let s: Size;\na = s; // ERROR\n\n/** A hierarchy */\nclass Animal {\n  protected:\
    \ number;\n}\nclass Cat extends Animal { }\n\nlet animal: Animal;\nlet cat: Cat;\n\
    animal = cat; // OK\ncat = animal; // OK\n\n/** Looks like Animal */\nclass Size\
    \ {\n  protected: number;\n}\nlet size: Size;\nanimal = size; // ERROR\nsize =\
    \ animal; // ERROR\n\n### Generics\n\nSince TypeScript has a structural type system,\
    \ type parameters only affect compatibility when used by member. For example,\
    \ in the following T has no impact on compatibility:\n\ninterface Empty<T> {}\n\
    \nlet x: Empty<number>;\nlet y: Empty<string>;\nx = y; // okay, y matches structure\
    \ of x\n\nHowever if T is used, it will play a role in compatibility based on\
    \ its instantiation shown below:\n\ninterface NotEmpty<T> {\n  data: T;\n}\n\n\
    let x: NotEmpty<number>;\nlet y: NotEmpty<string>;\nx = y; // error, x and y are\
    \ not compatible\n\nIn cases where generic arguments haven't instantiated they\
    \ are substituted by any before checking compatibility:\n\nlet identity = function<T>(x:\
    \ T): T {\n  /* ... */\n}\n\nlet reverse = function<U>(y: U): U {\n  /* ... */\n\
    }\nidentity = reverse; // Okay because (x: any)=>any matches (y: any)=>any\n\n\
    ## FootNote: Invariance\n\nWe said invariance is the only sound option. Here is\
    \ an example where both contra and covariance are shown to be unsafe for arrays.\n\
    \n/** Hierarchy */\nclass Animal { constructor(public name: string){} }\nclass\
    \ Cat extends Animal { meow() { } }\n\n/** An item of each */\nvar animal = new\
    \ Animal(\"animal\");\nvar cat = new Cat(\"cat\");\n\n/** Demo : polymorphism\
    \ 101 Animal <= Cat */\nanimal = cat; // Okay\ncat = animal; // ERROR: cat extends\
    \ animal\n\n/** Array of each to demonstrate variance */\nlet animalArr: Animal[]\
    \ = [animal];\nlet catArr: Cat[] = [cat];\n\n/** Obviously Bad : Contravariance\
    \ Animal <= Cat Animal[] >= Cat[] */\ncatArr = animalArr; // Okay if contravariant\n\
    catArr[0].meow(); // Allowed but BANG at runtime\n\n/** Also Bad : covariance\
    \ Animal <= Cat Animal[] <= Cat[] */\nanimalArr = catArr; // Okay if covariant\n\
    animalArr.push(new Animal('another animal')); // Just pushed an animal into catArr!\n\
    catArr.forEach(c => c.meow()); // Allowed but BANG at runtime\n\n## Never\n\n\
    A video lesson on the never type\n\nProgramming language design does have a concept\
    \ of *bottom* type that is a **natural** outcome as soon as you do *code flow\
    \ analysis*. TypeScript does *code flow analysis* and so it needs to reliably\
    \ represent stuff that might never happen.\n\nThe never type is used in TypeScript\
    \ to denote this *bottom* type. Cases when it occurs naturally:\n\n- A function\
    \ never returns (e.g. if the function body has while(true){})\n- A function always\
    \ throws (e.g. in function foo(){throw new Error('Not Implemented')} the return\
    \ type of foo is never)\n\nOf course you can use this annotation yourself as well:\n\
    \nlet foo: never; // Okay\n\nHowever never *can only ever be assigned to another\
    \ never*. e.g.\nlet foo: never = 123; // Error: Type number is not assignable\
    \ to never\n\n// Okay as the function's return type is never\nlet bar: never =\
    \ (() => { throw new Error('Throw my hands in the air like I just dont care')\
    \ })();\n\nGreat. Now let's just jump into its key use case :)\n\n### Use case:\
    \ Exhaustive Checks\n\nYou can call never functions in a never context\n"
  mdcn: "\n在由此类 Base 和 Child 组成的复杂类型的类型兼容性中，取决于 Base 和 Child 在相似场景中的位置，这由*变性*（variance）驱动。\n\
    \n- 协变（Covariant）：仅在*相同方向*。\n- 逆变（Contravariant，contra 也称为 negative）：仅在*相反方向*。\n\
    - 双变（Bivari，bi 也称为 both）：同时是协变和逆变。\n- 不变（Invariant）：如果类型不精确，则它们不兼容。\n\n注意：在像 JavaScript\
    \ 等存在可变数据的完全健全类型系统中，不变性是唯一有效选项。但正如提到的，*便利性*迫使我们做出不安全的选择。\n\n## Functions\n\n在比较两个函数时，有几细微之处需要考虑。\n\
    \n### 返回类型\n\n- 协变：返回类型必须包含足够的数据。\n\n/** 类型层级 */\ninterface Point2D { x: number;\
    \ y: number; }\n\ninterface Point3D { x: number; y: number; z: number; }\n\n/**\
    \ 示例函数 */\nlet iMakePoint2D = (): Point2D => ({ x: 0, y: 0 });\n\nlet iMakePoint3D\
    \ = (): Point3D => ({ x: 0, y: 0, z: 0 });\n\n/** 赋值 */\niMakePoint2D = iMakePoint3D;\
    \ // OK\n\niMakePoint3D = iMakePoint2D; // 错误：Point2D 不能赋值给 Point3D\n\n### 参数数量\n\
    \n参数较少是可以接受的（即函数可以选择忽略额外的参数）。毕竟，你被保证在调用时至少有足够的参数。\n\nlet iTakeSomethingAndPassItAnErr\
    \ = (x: (err: Error, data: any) => void) => { /* 执行一些事情 */ };\n\niTakeSomethingAndPassItAnErr(()\
    \ => null) // OK\n\niTakeSomethingAndPassItAnErr((err) => null) // OK\n\niTakeSomethingAndPassItAnErr((err,\
    \ data) => null) // OK\n\n// 错误：调用函数时可能未传入 `more`\niTakeSomethingAndPassItAnErr((err,\
    \ data, more) => null); // 错误\n\n### 可选参数和剩余参数\n\n可选参数（预定义数量）和剩余参数（任意数量的参数）是兼容的，同样是为了便利性。\n\
    \nlet foo = (x:number, y: number) => { /* 执行一些事情 */ }\n\nlet bar = (x?:number,\
    \ y?: number) => { /* 执行一些事情 */ }\n\nlet bas = (...args: number[]) => { /* 执行一些事情\
    \ */ }\n\nfoo = bar = bas;\n\nbas = bar = foo;\n\n注意：可选参数（在示例中的 bar）和非可选参数（在示例中的\
    \ foo）只有在 strictNullChecks 为 false 时才兼容。\n\n### 参数类型\n\n- 双变：这种设计用于支持常见的事件处理场景。\n\
    \n/** 事件层级 */\ninterface Event { timestamp: number; }\n\ninterface MouseEvent\
    \ extends Event { x: number; y: number }\n\ninterface KeyEvent extends Event {\
    \ keyCode: number }\n\n/** 示例事件监听器 */\nenum EventType { Mouse, Keyboard }\n\n\
    function addEventListener(eventType: EventType, handler: (n: Event) => void) {\n\
    \  /* ... */\n}\n\n// 不健全，但有用且常见。由于函数参数比较是双变的，所以它可以工作\naddEventListener(EventType.Mouse,\
    \ (e: MouseEvent) => console.log(e.x + \",\" + e.y));\n\n// 在存在健全性的情况下不理想的方案\n\
    addEventListener(EventType.Mouse, (e: Event) => console.log((<MouseEvent>e).x\
    \ + \",\" + (<MouseEvent>e).y));\naddEventListener(EventType.Mouse, <(e: Event)\
    \ => void>((e: MouseEvent) => console.log(e.x + \",\" + e.y)));\n\n// 仍然不允许（清晰错误）。对于完全不兼容的类型强制类型安全\n\
    addEventListener(EventType.Mouse, (e: number) => console.log(e));\n\n由于函数是兼容的，因此\
    \ Array<Child> 可以赋值给 Array<Base>（协变）。\n[/content] -> \n*(抱歉，由于你提供的待翻译文本在结尾似乎截断了，我仅翻译了你提供的内容。以下是完整的翻译结果，如果你需要翻译后面截断的部分，请提供完整文本。)*\n\
