  - "[PAGE 194]\n\n \\* This is a reducer, a pure function with (state, action) =>\
    \ state signature.\n\n \\* It describes how an action transforms the state into\
    \ the next state.\n\n \\*\n\n \\* The shape of the state is up to you: it can\
    \ be a primitive, an array, an object,\n\n \\* or even an Immutable.js data structure.\
    \ The only important part is that you should\n\n \\* not mutate the state object,\
    \ but return a new object if the state changes.\n\n \\*\n\n \\* In this example,\
    \ we use a \\`switch\\` statement and strings, but you can use a helper \n\nthat\n\
    \n \\* follows a different convention (such as function maps) if it makes sense\
    \ for your\n\n \\* project.\n\n \\*/\n\nfunction counter(state = 0, action: Action)\
    \ {\n\n switch (action.type) {\n\n case 'INCREMENT':\n\n return state + 1\n\n\
    \ case 'DECREMENT':\n\n return state - 1\n\n default:\n\n return state\n\n }\n\
    \n}\n\n// Create a Redux store holding the state of your app.\n\n// Its API is\
    \ { subscribe, dispatch, getState }.\n\nlet store = createStore(counter)\n\n//\
    \ You can use subscribe() to update the UI in response to state changes.\n\n//\
    \ Normally you'd use a view binding library (e.g. React Redux) rather than subscribe(\n\
    \n) directly.\n\n// However it can also be handy to persist the current state\
    \ in the localStorage.\n\nstore.subscribe(() =>\n\n console.log(store.getState())\n\
    \n)\n\n// The only way to mutate the internal state is to dispatch an action.\n\
    \n// The actions can be serialized, logged or stored and later replayed.\n\nstore.dispatch({\
    \ type: 'INCREMENT' })\n\n// 1\n\nstore.dispatch({ type: 'INCREMENT' })\n\n//\
    \ 2\n\nstore.dispatch({ type: 'DECREMENT' })\n\n// 1\n\nUsing it with TypeScript\
    \ gives you safety against typo errors, increased refactor-ability and\n\nself\
    \ documenting code .\n\nDiscriminated Unions\n\n195"
  - "[PAGE 195]\n\n**Index Signatures**\n\nAn  Object  in JavaScript (and hence TypeScript)\
    \ can be accessed with a **string** to hold a\n\nreference to any other JavaScript\
    \ **object**.\n\nHere is a quick example:\n\nlet foo:any = {};\n\nfoo\\['Hello'\\\
    ] = 'World';\n\nconsole.log(foo\\['Hello'\\]); // World\n\nWe store a string \
    \ \"World\"  under the key  \"Hello\" . Remember we said it can store any\n\n\
    JavaScript **object**, so lets store a class instance just to show the concept:\n\
    \nclass Foo {\n\n constructor(public message: string){};\n\n log(){\n\n console.log(this.message)\n\
    \n }\n\n}\n\nlet foo:any = {};\n\nfoo\\['Hello'\\] = new Foo('World');\n\nfoo\\\
    ['Hello'\\].log(); // World\n\nAlso remember that we said that it can be accessed\
    \ with a **string**. If you pass some any\n\nother object to the index signature\
    \ the JavaScript runtime actually calls  .toString  on it\n\nbefore getting the\
    \ result. This is demonstrated below:\n\nlet obj = {\n\n toString(){\n\n console.log('toString\
    \ called')\n\n return 'Hello'\n\n }\n\n}\n\nlet foo:any = {};\n\nfoo\\[obj\\]\
    \ = 'World'; // toString called\n\nconsole.log(foo\\[obj\\]); // toString called,\
    \ World\n\nconsole.log(foo\\['Hello'\\]); // World\n\nNote that  toString  will\
    \ get called whenever the  obj  is used in an index position.\n\nIndex Signatures\n\
    \n196"
  - "[PAGE 196]\n\nArrays are slightly different. For  number  indexing JavaScript\
    \ VMs will try to optimise\n\n(depending on things like is it actually an array\
    \ and do the structures of items stored match\n\netc.). So  number  should be\
    \ considered as a valid object accessor in its own right (distinct\n\nfrom  string\
    \ ). Here is a simple array example:\n\nlet foo = \\['World'\\];\n\nconsole.log(foo\\\
    [0\\]); // World\n\nSo that's JavaScript. Now let's look at TypeScript graceful\
    \ handling of this concept.\n\n**TypeScript Index Signature**\n\nFirst off, because\
    \ JavaScript *implicitly* calls  toString  on any object index signature,\n\n\
    TypeScript will give you an error to prevent beginners from shooting themselves\
    \ in the foot (I\n\nsee users shooting themselves in their feet when using JavaScript\
    \ all the time on\n\nstackoverflow):\n\nlet obj = {\n\n toString(){\n\n return\
    \ 'Hello'\n\n }\n\n}\n\nlet foo:any = {};\n\n// ERROR: the index signature must\
    \ be string, number ...\n\nfoo\\[obj\\] = 'World';\n\n// FIX: TypeScript forces\
    \ you to be explicit\n\nfoo\\[obj.toString()\\] = 'World';\n\nThe reason for forcing\
    \ the user to be explicit is because the default  toString \n\nimplementation\
    \ on an object is pretty awful, e.g. on v8 it always returns  \\[object Object\\\
    ] :\n\nlet obj = {message:'Hello'}\n\nlet foo:any = {};\n\n// ERROR: the index\
    \ signature must be string, number ...\n\nfoo\\[obj\\] = 'World';\n\n// Here is\
    \ what you actually stored!\n\nconsole.log(foo\\[\"\\[object Object\\]\"\\]);\
    \ // World\n\nOf course  number  is supported because\n\nIndex Signatures\n\n\
    197"
- md: "\n1. its needed for excellent Array / Tuple support.\n\n2. even if you use\
    \ it for an `obj` its default `toString` implementation is nice (not [object Object]).\n\
    \nPoint 2 is shown below:\n\nconsole.log((1).toString()); // 1\n\nconsole.log((2).toString());\
    \ // 2\n\nSo lesson 1:\n\nTypeScript index signatures must be either `string`\
    \ or `number`\n\nQuick note: `symbols` are also valid and supported by TypeScript.\
    \ But let's not go there just yet. Baby steps.\n\n**Declaring an index signature**\n\
    \nSo we've been using `any` to tell TypeScript to let us do whatever we want.\
    \ We can actually specify an *index* signature explicitly. E.g. say you want to\
    \ make sure than anything that is stored in an object using a string conforms\
    \ to the structure `{message: string}`. This can be done with the declaration\
    \ `{[index:string]: {message: string} }. This is demonstrated below:\n\nlet foo:{\
    \ [index:string]: {message: string} } = {};\n\n/**\n * Must store stuff that conforms\
    \ the structure\n */\n/** Ok */\nfoo['a'] = { message: 'some message' };\n\n/**\
    \ Error: must contain a `message` or type string. You have a typo in `message`\
    \ */\nfoo['a'] = { messages: 'some message' };\n\n/**\n * Stuff that is read is\
    \ also type checked\n */\n/** Ok */\nfoo['a'].message;\n\n/** Error: messages\
    \ does not exist. You have a typo in `message` */\nfoo['a'].messages;\n\nIndex\
    \ Signatures\n\nTIP: the name of the index signature e.g. `index` in `{[index:string]:\
    \ {message: string} }` has no significance for TypeScript and really for readability.\
    \ e.g. if its usernames you can do `{[username:string]: {message: string} }` to\
    \ help the next dev who looks at the code (which just might happen to be you).\n\
    \nOf course `number` indexes are also supported e.g. `{[count: number]: SomeOtherTypeYouWantToStoreEgRebate\
    \ }`\n\n**All members must conform to the string index signature**\n\nAs soon\
    \ as you have a `string` index signature, all explicit members must also conform\
    \ to that index signature. This is shown below:\n\n/** Okay */\ninterface Foo\
    \ {\n  [key:string]: number\n  x: number;\n  y: number;\n}\n\n/** Error */\ninterface\
    \ Bar {\n  [key:string]: number\n  x: number;\n  y: string; // Property `y` must\
    \ of of type number\n}\n\nThis is to provide safety so that any string access\
    \ gives the same result:\n\ninterface Foo {\n  [key:string]: number;\n  x: number;\n\
    }\n\nlet foo: Foo = {x:1,y:2};\n\n// Directly\nfoo['x']; // number\n\n// Indirectly\n\
    let x = 'x'\nfoo[x]; // number\n\n**Using a limited set of string literals**\n\
    \nAn index signature can require that index strings be members of a union of literal\
    \ strings e.g.:\n\ntype Index = 'a' | 'b' | 'c'\ntype FromIndex = { [k in Index]?:\
    \ number }\nconst good: FromIndex = {b:1, c:2}\n\n// Error:\n// Type '{ b: number;\
    \ c: number; d: number; }' is not assignable to type 'FromIndex'.\n// Object literal\
    \ may only specify known properties, and 'd' does not exist in type 'FromIndex'.\n\
    \nconst bad: FromIndex = {b:1, c:2, d:3};\n\nThis is often used together with\
    \ `keyof typeof` to capture vocabulary types, described on the next page.\n\n\
    The specification of the vocabulary can be deferred generically:\n\ntype FromSomeIndex<K\
    \ extends string> = { [key in K]: number }\n\n**Having both string and number\
    \ indexers**\n\nThis is not a common use case, but TypeScript compiler supports\
    \ it nonetheless.\n\nHowever it has the restriction that the `string` indexer\
    \ is more strict than the `number` indexer. This is intentional e.g. to allow\
    \ typing stuff like:\n\ninterface ArrStr {\n  [key: string]: string | number;\
    \ // Must accomodate all members\n  [index: number]: string; // Can be a subset\
    \ of string indexer\n  // Just an example member\n  length: number;\n}\n\n**Design\
    \ Pattern: Nested index signature**\n\nAPI consideration when adding index signatures\n\
    \nQuite commonly in the JS community you will see APIs that abuse string indexers.\
    \ e.g. a common pattern among CSS in JS libraries:\n\ninterface NestedCSS {\n\
    \  color?: string;\n  [selector: string]: string | NestedCSS;\n}\n\nconst example:\
    \ NestedCSS = {\n  color: 'red',\n  '.subclass': {\n    color: 'blue'\n  }\n}\n\
    \nTry not to mix string indexers with *valid* values this way. e.g. a typo in\
    \ the padding will remain uncaught:\n\nconst failsSilently: NestedCSS = {\n  colour:\
    \ 'red', // No error as `colour` is a valid string selector\n}\n\nInstead seperate\
    \ out the nesting into its own:\n\nconst example: NestedCSS = {\n  color: 'red',\n\
    \  '.subclass': {\n    color: 'blue'\n  }\n}\n\nconst failsSilently: NestedCSS\
    \ = {\n  colour: 'red', // No error as `colour` is a valid string selector\n}\n"
  mdcn: "\n\n1. 这是为了获得良好的数组 / 元组（Array / Tuple）支持。\n\n2. 即使你将其用于 `obj`，它默认的 `toString`\
