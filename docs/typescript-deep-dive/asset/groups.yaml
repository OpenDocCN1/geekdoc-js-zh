- md: "\nAlso Note that TypeScript will warn you if you try to misuse super :\n\n\
    ```typescript\nmodule quz {\n  class Base {\n    log = () => { console.log('hello\
    \ world'); }\n  }\n\n  class Child extends Base {\n    // ERROR : only `public`\
