    \ add a  script  target to your  package.json  based on your application entry\
    \ e.g.\n\nassuming its  index.ts :\n\n \"scripts\": {\n\n \"start\": \"npm run\
    \ build:live\",\n\n \"build:live\": \"nodemon --exec ./node\\_modules/.bin/ts-node\
    \ -- ./index.ts\"\n\n },\n\nSo you can now run  npm start  and as you edit  index.ts\
