    \ might recall from section on binder functions : bindChildren is called from\
    \ the bind\nfunction. So we have the recursive binding setup : bind calls bindChildren\
    \ calls bind for\neach child.\n\nBinder Container\n\n![](img/416f69818aa79e3f1fe0e7869c118431_294_0.png)[](img/416f69818aa79e3f1fe0e7869c118431_294_1.png)\n\
    \n## SymbolTable\n\nSymbolTable is implemented as a simple HashMap. Here is the\
    \ interface ( types.ts ):\n\n```typescript\ninterface SymbolTable {\n    [index:\
    \ string]: Symbol;\n}\n```\n\nSymbolTables are initialized by binding. There are\
    \ a few SymbolTables used by the compiler:\n\n- On Node: locals?: SymbolTable;\
    \ // Locals associated with node\n- On Symbol: members?: SymbolTable; // Class,\
    \ interface or literal instance members; exports?: SymbolTable; // Module exports\n\
    \nNote: We saw locals getting initialized (to {}) by bindChildren based on ContainerFlags.\n\
    \n## SymbolTable population\n\nSymbolTables are populated with Symbols primarily\
    \ by a call to declareSymbol . This function is presented below in entirety:\n\
    \n```typescript\n/**\n * Declares a Symbol for the node and adds it to symbols.\
    \ Reports errors for conflicting identifier names.\n * @param symbolTable - The\
    \ symbol table which node will be added to.\n * @param parent - node's parent\
    \ declaration.\n * @param node - the declaration to be added to the symbol table\n\
    \ * @param includes - The SymbolFlags that node has in addition to its declaration\
    \ type (eg: export, ambient, etc.)\n * @param excludes - the flags which node\
    \ cannot be declared alongside in a symbol table. Used to report forbidden declarations.\n\
    \ */\nfunction declareSymbol(symbolTable: SymbolTable, parent: Symbol, node: Declaration,\
    \ includes: SymbolFlags, excludes: SymbolFlags): Symbol {\n    Debug.assert(!hasDynamicName(node));\n\
    \    // The exported symbol for default/class node is always named \"default\"\
    \n    let name = node.flags & NodeFlags.Default && parent ? \"default\" : getDeclarationName(node);\n\
    \    let symbol: Symbol;\n    if (name !== undefined) {\n        // Check and\
