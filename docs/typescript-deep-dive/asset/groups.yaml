    \ number, y: number) {\n\n this.x = x;\n\n this.y = y;\n\n }\n\n add(point: Point)\
    \ {\n\n return new Point(this.x + point.x, this.y + point.y);\n\n }\n\n}\n\nvar\
    \ p1 = new Point(0, 10);\n\nvar p2 = new Point(10, 20);\n\nvar p3 = p1.add(p2);\
    \ // {x:10,y:30}\n\nThis class generates the following JavaScript on ES5 emit:\n\
    \nvar Point = (function () {\n\n function Point(x, y) {\n\n this.x = x;\n\n this.y\
