    \n**Closure**\n\nThe best thing that JavaScript ever got was closures. A function\
    \ in JavaScript has access to\n\nany variables defined in the outer scope. Closures\
    \ are best explained with examples:\n\nfunction outerFunction(arg) {\n\n var variableInOuterFunction\
    \ = arg;\n\n function bar() {\n\n console.log(variableInOuterFunction); // Access\
    \ a variable from the outer scope\n\n }\n\n // Call the local function to demonstrate\
    \ that it has access to arg\n\n bar();\n\n}\n\nouterFunction(\"hello closure\"\
    ); // logs hello closure!\n\nYou can see that the inner function has access to\
    \ a variable (variableInOuterFunction) from\n\nthe outer scope. The variables\
    \ in the outer function have been closed by (or bound in) the\n\ninner function.\
    \ Hence the term **closure**. The concept in itself is simple enough and pretty\n\
    \nintuitive.\n\nNow the awesome part: The inner function can access the variables\
    \ from the outer scope\n\n*even after the outer function has returned*. This is\
    \ because the variables are still bound in\n\nthe inner function and not dependent\
    \ on the outer function. Again let's look at an example:\n\nfunction outerFunction(arg)\
    \ {\n\n var variableInOuterFunction = arg;\n\n return function() {\n\n console.log(variableInOuterFunction);\n\
    \n }\n\n}\n\nvar innerFunction = outerFunction(\"hello closure!\");\n\n// Note\
    \ the outerFunction has returned\n\ninnerFunction(); // logs hello closure!\n\n\
    **Reason why it's awesome**\n\nIt allows you to compose objects easily e.g. the\
    \ revealing module pattern:\n\nClosure\n\n21"
