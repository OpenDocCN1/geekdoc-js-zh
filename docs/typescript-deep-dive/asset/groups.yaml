    \ = {};\n}\naddToContainerChain(container);\n}\nelse if (containerFlags & ContainerFlags.IsBlockScopedContainer)\
    \ {\nblockScopeContainer = node;\nblockScopeContainer.locals = undefined;\n}\n\
    forEachChild(node, bind);\ncontainer = saveContainer;\nparent = saveParent;\n\
    blockScopeContainer = savedBlockScopeContainer;\n}\n\n正如你从 binder 函数章节可能回忆的：`bindChildren`\
    \ 是从 `bind` 函数调用的。因此我们有这种递归绑定设置：`bind` 调用 `bindChildren`，然后为每个孩子调用 `bind`。\n\n\
    Binder 容器\n\n![](img/416f69818aa79e3f1fe0e7869c118431_294_0.png)[](img/416f69818aa79e3f1fe0e7869c118431_294_1.png)\n\
    \n## SymbolTable\n\nSymbolTable 实现为一个简单的 HashMap。以下是接口 ( types.ts ):\n\n```typescript\n\
    interface SymbolTable {\n    [index: string]: Symbol;\n}\n```\n\nSymbolTables\
    \ 通过绑定初始化。编译器使用了几个 SymbolTables：\n\n- 在 Node 上：locals?: SymbolTable; // 与节点关联局部变量\n\
    - 在 Symbol 上：members?: SymbolTable; // 类、接口或字面量实例成员；exports?: SymbolTable; //\
    \ 模块导出\n\n注意：我们看到 `locals` 根据 `ContainerFlags` 由 `bindChildren` 初始化（为 {}）。\n\n\
    ## SymbolTable 填充\n\nSymbolTables 主要通过调用 `declareSymbol` 来填充 Symbols。该函数的完整代码如下：\n\
    \n```typescript\n/**\n * 为节点声明一个 Symbol 并将其添加到 symbols 中。对于冲突的标识符名称报告错误。\n * @param\
    \ symbolTable - 节点将要添加到符号表。\n * @param parent - 节点的父级声明。\n * @param node - 要添加到符号表中的声明。\n\
    \ * @param includes - 节点除了声明类型外所拥有的 SymbolFlags（例如：导出、环境、等）。\n * @param excludes\
    \ - 节点不能在符号表中与并排声明的标志。用于报告禁止的声明。\n */\nfunction declareSymbol(symbolTable: SymbolTable,\
    \ parent: Symbol, node: Declaration, includes: SymbolFlags, excludes: SymbolFlags):\
    \ Symbol {\n    Debug.assert(!hasDynamicName(node));\n    // 默认/类节点的导出符号始终被命名为\
    \ \"default\"\n    let name = node.flags & NodeFlags.Default && parent ? \"default\"\
    \ : getDeclarationName(node);\n    let symbol: Symbol;\n    if (name !== undefined)\
    \ {\n        // 检查符号表是否已经存在一个具有该名称的符号。\n        // 如果没有，则创建一个该名称的新符号并将其添加到表中。\n\
    \        // 如果获取了一个已存在的符号，检查它是否与我们正在创建的新符号\n        // 冲突。例如，一个 'var' 符号和一个 'class'\
    \ 符号会在同一个\n        // 符号表中冲突。在这种情况下，我们将合并到一个兼容的现有符号。\n        symbol = hasProperty(symbolTable,\
    \ name) ? symbolTable[name] : (symbolTable[name] = createSymbol(SymbolFlags.None,\
    \ name));\n        if (name && (includes & SymbolFlags.Classifiable)) {\n    \
    \        classifiableNames[name] = name;\n        }\n        if (symbol.flags\
    \ & excludes) {\n            if (node.name) {\n                node.name.parent\
    \ = node;\n            }\n            // 对每个重复声明的位置报告错误\n            // 对之前的声明报告错误\n\
    \            let message = symbol.flags & SymbolFlags.BlockScopedVariable\n  \
    \              ? Diagnostics.Cannot_redeclare_block_scoped_variable\n        \
    \        : Diagnostics.Duplicate_identifier;\n            forEach(symbol.declarations,\
    \ declaration => {\n                file.bindDiagnostics.push(createDiagnosticForNode(declaration.name\
    \ || declaration, message, getDisplayName(declaration)));\n            });\n \
    \           file.bindDiagnostics.push(createDiagnosticForNode(node.name || node,\
    \ message, getDisplayName(node)));\n            symbol = createSymbol(SymbolFlags.None,\
    \ name);\n        }\n    } else {\n        symbol = createSymbol(SymbolFlags.None,\
    \ \"__missing\");\n    }\n    addDeclarationToSymbol(symbol, node, includes);\n\
    \    symbol.parent = parent;\n    return symbol;\n}\n```\n\n填充哪个 SymbolTable 由该函数的第一个参数驱动。例如，当向类型为\
    \ SyntaxKind.ClassDeclaration 或 SyntaxKind.ClassExpression 的容器添加声明时，将调用 `declareClassMember`\
    \ 函数，其代码如下：\n\n```typescript\nfunction declareClassMember(node: Declaration, symbolFlags:\
    \ SymbolFlags, symbolExcludes: SymbolFlags) {\n    return node.flags & NodeFlags.Static\n\
    \        ? declareSymbol(container.symbol.exports, container.symbol, node, symbolFlags,\
    \ symbolExcludes)\n        : declareSymbol(container.symbol.members, container.symbol,\
    \ node, symbolFlags, symbolExcludes);\n}\n```\n\n![](img/416f69818aa79e3f1fe0e7869c118431_296_0.png)[](img/416f69818aa79e3f1fe0e7869c118431_296_1.png)\n\
    \n"
