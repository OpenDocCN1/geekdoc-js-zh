    \ to validate that the local\nname\n// used for a container is unique.\nfunction\
    \ bindChildren(node: Node) {\n// Before we recurse into a node's chilren, we first\
    \ save the existing parent, con\ntainer\n// and block-container. Then after we\
    \ pop out of processing the children, we rest\nore these saved values.\nlet saveParent\
