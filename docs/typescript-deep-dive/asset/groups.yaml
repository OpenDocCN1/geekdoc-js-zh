    \ {\n    this.x = x;\n  }\n}\n```\n\n这是一个非常常见的模式，TypeScript 提供了一了一种简写，你可以在成员前加上一个*访问修饰符*，它会自动在类上声明并从构造函数中复制它。因此，之前的示例可以重写为（注意\
    \ `public x:number` ）\n\n```typescript\nclass Foo {\n  constructor(public x:number)\
    \ {\n  }\n}\n```\n\n**属性初始化器**\n\n这是 TypeScript 支持的一个巧妙特性（实际上是从 ES7 开始）。你可以在类构造函数之外初始化类的任何成员，这有助于提供默认值（注意\
    \ `members = []`）\n\n```typescript\nclass Foo {\n  members = []; // 直接初始化\n  add(x)\
    \ {\n    this.members.push(x);\n  }\n}\n```\n\n### 类\n\n**IIFE 是怎么回事**\n\n为类生成的\
