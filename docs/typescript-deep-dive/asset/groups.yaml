    \ is a  C  sample that achieves this:\n\nvoid called() {\n\n static count = 0;\n\
    \n count++;\n\n printf(\"Called : %d\", count);\n\n}\n\nint main () {\n\n called();\
    \ // Called : 1\n\n called(); // Called : 2\n\n return 0;\n\n}\n\nSince JavaScript\
    \ (or TypeScript) doesn't have function statics you can achieve the same\n\nthing\
    \ using various abstractions that wrap over a local variable e.g. using a  class\
