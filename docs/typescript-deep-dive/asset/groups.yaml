  - "[PAGE 222]\n\nEnums in TypeScript offer a certain level of nominal typing. Two\
    \ enum types aren't equal if\n\nthey differ by name. We can use this fact to provide\
    \ nominal typing for types that are\n\notherwise structurally compatible.\n\n\
    The workaround involves:\n\nCreating a *brand* enum.\n\nCreating the type as an\
    \ *intersection* ( & ) of the brand enum + the actual structure.\n\nThis is demonstrated\
    \ below where the structure of the types is just a string:\n\n// FOO\n\nenum FooIdBrand\
    \ {}\n\ntype FooId = FooIdBrand & string;\n\n// BAR\n\nenum BarIdBrand {}\n\n\
    type BarId = BarIdBrand & string;\n\n/\\*\\*\n\n \\* Usage Demo\n\n \\*/\n\nvar\
    \ fooId: FooId;\n\nvar barId: BarId;\n\n// Safety!\n\nfooId = barId; // error\n\
    \nbarId = fooId; // error\n\n// Newing up\n\nfooId = 'foo' as FooId;\n\nbarId\
    \ = 'bar' as BarId;\n\n// Both types are compatible with the base\n\nvar str:\
    \ string;\n\nstr = fooId;\n\nstr = barId;\n\n**Using Interfaces**\n\nBecause \
    \ numbers  are type compatible with  enum s the previous technique cannot be used\n\
    \nfor them. Instead we can use interfaces to break the structural compatibility.\
    \ This method is\n\nstill used by the TypeScript compiler team, so worth mentioning.\
    \ Using  \\_  prefix and a\n\n Brand  suffix is a convention I strongly recommend\
    \ (and the one followed by the TypeScript\n\nteam).\n\nThe workaround involves\
    \ the following:\n\nNominal Typing\n\n223"
  - "[PAGE 223]\n\nadding an unused property on a type to break structural compatibility.\n\
    \nusing a type assertion when needing to new up or cast down.\n\nThis is demonstrated\
    \ below:\n\n// FOO\n\ninterface FooId extends String {\n\n \\_fooIdBrand: string;\
    \ // To prevent type errors\n\n}\n\n// BAR\n\ninterface BarId extends String {\n\
    \n \\_barIdBrand: string; // To prevent type errors\n\n}\n\n/\\*\\*\n\n \\* Usage\
    \ Demo\n\n \\*/\n\nvar fooId: FooId;\n\nvar barId: BarId;\n\n// Safety!\n\nfooId\
    \ = barId; // error\n\nbarId = fooId; // error\n\nfooId = <FooId>barId; // error\n\
    \nbarId = <BarId>fooId; // error\n\n// Newing up\n\nfooId = 'foo' as any;\n\n\
    barId = 'bar' as any;\n\n// If you need the base string\n\nvar str: string;\n\n\
    str = fooId as any;\n\nstr = barId as any;\n\nNominal Typing\n\n224"
  - "[PAGE 224]\n\n**Stateful Functions**\n\nA common feature in other programming\
