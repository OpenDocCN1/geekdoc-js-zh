    \n let result = \"\";\n\n // interleave the literals with the placeholders\n\n\
    \ for (let i = 0; i < placeholders.length; i++) {\n\n result += literals\\[i\\\
    ];\n\n result += placeholders\\[i\\]\n\n .replace(/&/g, '&amp;')\n\n .replace(/\"\
