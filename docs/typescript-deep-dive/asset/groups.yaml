  mdcn: "\n\n## 带有静态方法的枚举\n\n你可以使用 `enum + namespace` 合并声明为枚举添加静态方法。\n\n以下示例展示了我们为枚举\
    \ `Weekday` 添加一个静态成员 `isBusinessDay` 的例子：\n\n```typescript\nenum Weekday {\n \
    \ Monday,\n  Tuesday,\n  Wednesday,\n  Thursday,\n  Friday,\n  Saturday,\n  Sunday\n\
    }\n\nnamespace Weekday {\n  export function isBusinessDay(day: Weekday) {\n  \
    \  switch (day) {\n      case Weekday.Saturday:\n      case Weekday.Sunday:\n\
    \        return false;\n      default:\n        return true;\n    }\n  }\n}\n\n\
    const mon = Weekday.Monday;\nconst sun = Weekday.Sunday;\n\nconsole.log(Weekday.isBusinessDay(mon));\
    \ // true\nconsole.log(Weekday.isBusinessDay(sun)); // false\n```\n\n# 枚举\n\n\
    ## lib.d.ts\n\n### 示例用法\n- 内部查看\n- 修改原生类型\n- 使用自定义 lib.d.ts\n\n| 编译目标对 lib.d.ts\
    \ 的影响 | lib 选项 |\n| :--- | :--- |\n| **lib.d.ts** | |\n\n特殊的声明文件 `lib.d.ts` 随每个\
    \ TypeScript 安装版本附带。该文件包含了 JavaScript 运行时和 DOM 中存在的各种常见 JavaScript 构造的环境声明。\n\n\
    此文件会自动包含在 TypeScript 项目的编译上下文中。该文件的目的是让你轻松地开始编写*类型检查*的 JavaScript 代码。\n\n你可以通过指定\
    \ `--noLib` 编译器命令行标记（或在 `tsconfig.json` 中设置 `\"noLib\": true`）从编译上下文中排除此文件。\n\n\
    ### 示例用法\n\n一如既往，让我们来看看该文件实际使用的示例：\n\n```typescript\nvar foo = 123;\nvar bar =\
    \ foo.toString();\n```\n\n这段代码的类型检查是正常的，*因为* `toString` 函数在 `lib.d.ts` 中定义于所有\
    \ JavaScript 对象。\n\n如果你在启用 `noLib` 选项的情况下相同的示例代码，将得到一个类型检查错误：\n\n```typescript\n\
    var foo = 123;\nvar bar = foo.toString(); // ：类型 'number' 上不存在属性 'toString'。\n\
    ```\n\n现在你已经理解了 `lib.d.ts` 的重要性，它的内容是什么样子的？我们接下来进行检查。\n\n### lib.d.ts 内部查看\n\n\
    `lib.d.ts` 的内容主要是一组*变量*声明，例如 `window`、`document`、`math` 以及类似的*接口*声明，例如 `Window`、`Document`、`Math`。\n\
    \n发现这些是什么最简单的方法是在代码中输入*你知道可以运行的代码*，例如 `Math.floor`，然后使用你的 IDE 按 F12（跳转到定义）（atom-typescript\
    \ 对此有很好的支持）。\n\n让我们来看一个*变量*声明示例，例如 `window` 定义如下：\n\n```typescript\ndeclare var\
    \ window: Window;\n```\n\n这只是一个简单的 `declare var` 后面跟着变量名（这里是 `window`）和一个用于类型注解的接口（这里是\
    \ `Window` 接口）。这些变量通常指向某些全局*接口*，例如，这里是（实际上非常巨大的）`Window` 接口的一个小示例：\n\n```typescript\n\
    interface Window extends EventTarget, WindowTimers, WindowSessionStorage, WindowLocalStorage,\
    \ WindowConsole, GlobalEventHandlers, IDBEnvironment, WindowBase64 {\n  animationStartTime:\
    \ number;\n  applicationCache: ApplicationCache;\n  clientInformation: Navigator;\n\
    \  closed: boolean;\n  crypto: Crypto;\n  // 等等等等...\n}\n```\n\n你可以看到，这些接口中包含了*非常多*类型信息。在没有\
    \ TypeScript 的情况下，*你*需要将这些记在*你的*脑子里。现在你可以通过使用 `intellisense` 等工具轻松访问，并将这些知识交由编译器处理。\n\
    \n对这些全局变量使用*接口*是有充分理由的。它允许你向这些全局变量*添加额外的**属性*，而*不需要*更改 `lib.d.ts`。我们接下来将介绍这个概念。\n\
    \n## 修改原生类型\n\n由于 TypeScript 中的 `interface` 是开放的，这意味着你可以直接向 `lib.d.ts` 中声明的接口添加成员，TypeScript\
    \ 将会识别到这些添加。请注意，你需要在*全局模块*中进行这些更改，以便这些接口能与 `lib.d.ts` 关联。我们甚至建议为此目的创建一个名为 `globals.d.ts`\
    \ 的特殊文件。\n\n以下是几个向 `window`、`Math`、`Date` 添加内容的用例：\n\n![img/416f69818aa79e3f1fe0e7869c118431_140_0.png](img/416f69818aa79e3f1fe0e7869c118431_140_1.png)\n\
    \n### Window 示例 **\n\n直接向 `Window` 接口添加内容，例如：\n\n```typescript\ninterface Window\
    \ {\n  helloWorld(): void;\n}\n```\n\n这将允许你以*类型安全*的方式使用它：\n\n```typescript\n//\
    \ 在运行时添加\nwindow.helloWorld = () => console.log('hello world');\n\n// 调用它\nwindow.helloWorld();\n\
    \n// 误用它将得到一个错误：\n```\n\n### Math 示例 **\n\n这允许你以*类型安全*的方式执行以下操作：\n\n```typescript\n\
    var today = Date.today();\nvar today1second = today.addMilliseconds(1000);\n```\n\
    \n### Date 示例 **\n\n如果在 `lib.d.ts` 内部查看，你会发现：\n\n```typescript\ndeclare var Date:\
    \ DateConstructor;\n```\n\n`DateConstructor` 接口与我们看到的 `Math` 类似，它包含了：\n\n```typescript\n\
    interface DateConstructor {\n  /** 获取当前日期。时间设置为当天的开始（00:00 或午夜 12:00 AM） */\n\
    \  today(): Date;\n  // 等等等等等...\n}\n\ninterface Date {\n  /** 向此实例添加指定的毫秒数。 */\n\
    \  addMilliseconds(milliseconds: number): Date;\n  // 等等等等等...\n}\n```\n```\n\n\
    ### 字符串示例 **\n\n如果在 `lib.d.ts` 中查看字符串，你会发现与我们看到的 `Date` 相似的内容（String 全局变量、StringConstructor\
    \ 接口、String 接口）。但注意的是，`String` 接口也会影响*字面量*，如下方的代码示例所示：\n\n```typescript\ninterface\
    \ String {\n  endsWith(suffix: string): boolean;\n}\n\nString.prototype.endsWith\
    \ = function(suffix: string): boolean {\n  var str: string = this;\n  return str\
    \ && str.indexOf(suffix, str.length - suffix.length) !== -1;\n}\n\nconsole.log('foo\
    \ bar'.endsWith('bas')); // false\nconsole.log('foo bas'.endsWith('bas')); //\
    \ true\n```\n\n### 字符串示例 Redux\n\n出于可维护性考虑，我们建议创建一个 `global.d.ts`。然而，如果你需要，也可以从*文件模块*中进入*全局命名空间*。这是通过\
    \ `declare global { /*此处为全局命名空间*/ }` 实现的。例如之前的示例也可以这样做：\n\n"
