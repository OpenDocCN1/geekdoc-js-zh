  - "[PAGE 39]\n\n**let**\n\n var  Variables in JavaScript are *function scoped*.\
    \ This is different from many other\n\nlanguages (C# / Java etc.) where the variables\
    \ are *block scoped*. If you bring a *block scoped*\n\nmindset to JavaScript,\
    \ you would expect the following to print  123 , instead it will print  456 :\n\
    \nvar foo = 123;\n\nif (true) {\n\n var foo = 456;\n\n}\n\nconsole.log(foo); //\
    \ 456\n\nThis is because  {  does not create a new *variable scope*. The variable\
    \  foo  is the same\n\ninside the if *block* as it is outside the if block. This\
    \ is a common source of errors in\n\nJavaScript programming. This is why TypeScript\
    \ (and ES6) introduces the  let  keyword to\n\nallow you to define variables with\
    \ true *block scope*. That is if you use  let  instead of  var \n\nyou get a true\
    \ unique element disconnected from what you might have defined outside the\n\n\
    scope. The same example is demonstrated with  let :\n\nlet foo = 123;\n\nif (true)\
    \ {\n\n let foo = 456;\n\n}\n\nconsole.log(foo); // 123\n\nAnother place where\
    \  let  would save you from errors is loops.\n\nvar index = 0;\n\nvar array =\
    \ \\[1, 2, 3\\];\n\nfor (let index = 0; index < array.length; index++) {\n\n console.log(array\\\
    [index\\]);\n\n}\n\nconsole.log(index); // 0\n\nIn all sincerity we find it better\
    \ to use  let  whenever possible as it leads to lesser surprises\n\nfor new and\
    \ existing multi-lingual developers.\n\n**Functions create a new scope**\n\nSince\
    \ we mentioned it, we'd like to demonstrate that functions create a new variable\
    \ scope\n\nin JavaScript. Consider the following:\n\nlet\n\n40"
