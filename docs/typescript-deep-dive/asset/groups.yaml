    \ you can give them a\n\n globals.d.ts  file to put interfaces / types in the\
    \ global namespace to make it easy to have\n\nsome *types* just *magically* available\
    \ for consumption in *all* your TypeScript code.\n\nFor any code that is going\
    \ to generate *JavaScript* we highly recommend using *file*\n\n*modules*.\n\n\
    \ globals.d.ts  is great for adding extensions to  lib.d.ts  if you need to.\n\
    \nIt's good for quick  declare module \"some-library-you-dont-care-to-get-defs-for\"\
    ;  when\n\ndoing TS to JS migrations.\n\nglobals.d.ts\n\n100"
  - "[PAGE 100]\n\n**Namespaces**\n\nNamespaces provide you with a convenient syntax\
    \ around a common pattern used in\n\nJavaScript:\n\n(function(something) {\n\n\
    \ something.foo = 123;\n\n})(something || (something = {}))\n\nBasically  something\
    \ || (something = {})  allows an anonymous function\n\n function(something) {}\
    \  to *add stuff to an existing object* (the  something ||  portion) or *start*\n\
    \n*a new object then add stuff to that object* (the  || (something = {})  portion).\
    \ This means\n\nthat you can have two such blocks split by some execution boundary:\n\
    \n(function(something) {\n\n something.foo = 123;\n\n})(something || (something\
    \ = {}))\n\nconsole.log(something); // {foo:123}\n\n(function(something) {\n\n\
    \ something.bar = 456;\n\n})(something || (something = {}))\n\nconsole.log(something);\
    \ // {foo:123, bar:456}\n\nThis is commonly used in the JavaScript land for making\
    \ sure that stuff doesn't leak into the\n\nglobal namespace. With file based modules\
    \ you don't need to worry about this, but the\n\npattern is still useful for *logical\
    \ grouping* of a bunch of functions. Therefore TypeScript\n\nprovides the  namespace\
    \  keyword to group these e.g.:\n\nNamespaces\n\n101"
