    \ `this` 的影响\n4. `new` 对 `prototype` 的影响\n\n如果在对象上查找时未找到属性（例如 `obj.property`），则会查找\
    \ `obj.__proto__.property`。在旧版浏览器中，有时将其称为 `[[prototype]]`。这解释了为什么 JavaScript 原生支持原型继承。\n\
