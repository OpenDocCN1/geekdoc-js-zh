    \ For example, a 'var' symbol and a 'class' symbol will conflict\n        // the\
    \ same symbol table. In this case we'll be merging into a compatible existing\
    \ symbol.\n        symbol = hasProperty(symbolTable, name) ? symbolTable[name]\
    \ : (symbolTable[name] = createSymbol(SymbolFlags.None, name));\n        if (name\
    \ && (includes & SymbolFlags.Classifiable)) {\n            classifiableNames[name]\
    \ = name;\n        }\n        if (symbol.flags & excludes) {\n            if (node.name)\
    \ {\n                node.name.parent = node;\n            }\n            // Report\
    \ errors every position with duplicate declaration\n            // Report errors\
    \ on previous declarations\n            let message = symbol.flags & SymbolFlags.BlockScopedVariable\n\
    \                ? Diagnostics.Cannot_redeclare_block_scoped_variable\n      \
    \          : Diagnostics.Duplicate_identifier;\n            forEach(symbol.declarations,\
    \ declaration => {\n                file.bindDiagnostics.push(createDiagnosticForNode(declaration.name\
    \ || declaration, message, getDisplayName(declaration)));\n            });\n \
    \           file.bindDiagnostics.push(createDiagnosticForNode(node.name || node,\
    \ message, getDisplayName(node)));\n            symbol = createSymbol(SymbolFlags.None,\
    \ name);\n        }\n    } else {\n        symbol = createSymbol(SymbolFlags.None,\
    \ \"__missing\");\n    }\n    addDeclarationToSymbol(symbol, node, includes);\n\
    \    symbol.parent = parent;\n    return symbol;\n}\n\nWhich SymbolTable is populated\
    \ is driven by the first argument to this function. e.g. when adding a declaration\
    \ to a *container* of kind SyntaxKind.ClassDeclaration or SyntaxKind.ClassExpression\
    \ the function declareClassMember will get called which has the following code:\n\
    \n```typescript\nfunction declareClassMember(node: Declaration, symbolFlags: SymbolFlags,\
    \ symbolExcludes: SymbolFlags) {\n    return node.flags & NodeFlags.Static\n \
    \       ? declareSymbol(container.symbol.exports, container.symbol, node, symbolFlags,\
    \ symbolExcludes)\n        : declareSymbol(container.symbol.members, container.symbol,\
    \ node, symbolFlags, symbolExcludes);\n}\n```\n\n![](img/416f69818aa79e3f1fe0e7869c118431_296_0.png)[](img/416f69818aa79e3f1fe0e7869c118431_296_1.png)\n"
