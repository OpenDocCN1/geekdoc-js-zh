  - "[PAGE 178]\n\n**Be careful around parameters**\n\nTypes do not flow into the\
    \ function parameters if it cannot be inferred from an assignment.\n\ne.g. in\
    \ the following case the compiler does not to know the type of  foo  so it cannot\
    \ infer\n\nthe type of  a  or  b \n\nconst foo = (a,b) => { /\\* do something\
    \ \\*/ };\n\nHowever if  foo  was typed the function parameters type can be inferred\
    \ ( a , b  are both\n\ninferred to be number below).\n\ntype TwoNumberFunction\
    \ = (a: number, b: number) => void;\n\nconst foo: TwoNumberFunction = (a, b) =>\
    \ { /\\* do something \\*/ };\n\n**Be careful around return**\n\nAlthough TypeScript\
    \ can generally infer the return type of a function, it might not be what you\n\
    \nexpect. e.g. here function  foo  has a return type of  any \n\nfunction foo(a:\
    \ number, b: number) {\n\n return a + addOne(b);\n\n}\n\n// Some external function\
    \ in a library someone wrote in JavaScript\n\nfunction addOne(a) {\n\n return\
    \ a + 1;\n\n}\n\nThis is because the return type is impacted by the poor type\
    \ definition for  addOne  ( a  is\n\n any  so the return of  addOne  is  any \
    \ so the return of  foo  is  any ).\n\nI find it simplest to always be explicit\
    \ about function / returns. After all these annotations\n\nare a theorem and the\
    \ function body is the proof.\n\nThere are other cases that one can imagine, but\
    \ the good news is that there is a compiler\n\nflag that can help catch such bugs.\n\
