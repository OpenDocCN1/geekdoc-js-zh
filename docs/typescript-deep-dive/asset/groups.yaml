- md: "\nThese (and more) compiler options will be discussed later.\n\n## TypeScript\
    \ compiler\n\nGood IDEs come with built in support for on the fly ts to js compilation.\
    \ If however you want to run the TypeScript compiler manually from the command\
    \ line when using tsconfig.json you can do it in a few ways.\n\nJust run `tsc`\
    \ and it will look for `tsconfig.json` in the current as well as all parent folders\
    \ till it finds it.\n\nRun `tsc -p ./path-to-project-directory .`. Of course the\
    \ path can be a complete or relative to the current directory.\n\nYou can even\
    \ start the TypeScript compiler in *watch* mode using `tsc -w` and it will watch\
    \ your TypeScript project files for changes.\n\n### tsconfig.json\n\n### Which\
    \ files?\n\nYou can either use `files` to be explicit:\n\n```json\n{\n \"files\"\
    :[\n    \"./some/file.ts\"\n  ]\n}\n```\n\nor `include` and `exclude` to specify\
    \ files. E.g.:\n\n```json\n{\n  \"include\":[\n    \"./folder\"\n  ],\n  \"exclude\"\
    :[\n    \"./folder/**/*.spec.ts\",\n    \"./folder/someSubFolder\"\n  ]\n}\n```\n\
    \nSome notes:\n- if `files` is specified, other options are ignored\n- `**/*`\
    \ (e.g. sample usage `somefolder/**/*`) means all folder and any files (the extensions\
    \ `.ts / .tsx` will be included and even `.js / .jsx` if `allowJs` is true)\n\n\
    Declaration Spaces\n\nThere are two declaration spaces in TypeScript: the *variable*\
    \ declaration space and the *type* declaration space. These concepts are explored\
    \ below.\n\n### Type Declaration Space\n\nThe type declaration space contains\
    \ stuff that can be used as a type annotation. E.g. the following are a few type\
    \ declarations:\n\n```typescript\nclass Foo {};\ninterface Bar {};\ntype Bas =\
    \ {};\n```\n\nThis means that you can use `Foo`, `Bar`, `Bas`, etc. as a type\
    \ annotation. E.g.:\n\n```typescript\nvar foo: Foo;\nvar bar: Bar;\nvar bas: Bas;\n\
    ```\n\nNotice that even though you have `interface Bar`, *you can't use it as\
    \ a variable* because it doesn't contribute to the *variable declaration space*.\
    \ This is shown below:\n\n```typescript\ninterface Bar {};\nvar bar = Bar; //\
    \ ERROR: \"cannot find name 'Bar'\"\n```\n\nThe reason why it says `cannot find\
    \ name` is because the name `Bar` *is not defined* in the *variable* declaration\
    \ space. That brings us to the next topic \"Variable Declaration Space\".\n\n\
    ### Variable Declaration Space\n\nThe variable declaration space contains stuff\
    \ that you can use as a variable. We saw that having `class Foo` contributes a\
    \ type `Foo` to the *type* declaration space. Guess what? it also contributes\
    \ a *variable* `Foo` to the *variable* declaration space as shown below:\n\n```typescript\n\
    class Foo {};\nvar someVar = Foo;\nvar someOtherVar = 123;\n```\n\nThis is great\
    \ as sometimes you want to pass classes around as variables. Remember that: we\
    \ couldn't use something like an `interface` that is *only* in the *type* declaration\
    \ space as a variable.\n\nSimilarly something that you declare with `var`, is\
    \ *only* in the *variable* declaration space and cannot be used as a type annotation:\n\
    \n```typescript\nvar foo = 123;\nvar bar: foo; // ERROR: \"cannot find name 'foo'\"\
    \n```\n\nThe reason why it says `cannot find name` is because the name `foo` *is\
    \ not defined* in the *type* declaration space.\n\n## Modules\n\n### Global Module\n\
    \nBy default when you start typing code in a new TypeScript file your code is\
    \ in a *global* namespace. As a demo consider a file `foo.ts`:\n\n```typescript\n\
    var foo = 123;\n```\n\nIf you now create a *new* file `bar.ts` in the same project,\
    \ you will be *allowed* by the TypeScript type system to use the variable `foo`\
    \ as if it was available globally:\n\n```typescript\nvar bar = foo; // allowed\n\
    ```\n\nNeedless to say having a global namespace is dangerous as it opens your\
    \ code up for naming conflicts. We recommend using file modules which are presented\
    \ next.\n\n### File Module\n\nAlso called *external modules*. If you have an `import`\
    \ or an `export` at the root level of a TypeScript file then it creates a *local*\
    \ scope within that file. So if we were to change the previous `foo.ts` to the\
    \ following (note the `export` usage):\n\n```typescript\nexport var foo = 123;\n\
    ```\n\nWe will no longer have `foo` in the global namespace. This can be demonstrated\
    \ by creating a new file `bar.ts` as follows:\n\n```typescript\nvar bar = foo;\
    \ // ERROR: \"cannot find name 'foo'\"\n```\n\nIf you want to use stuff from `foo.ts`\
    \ in `bar.ts` *you need to explicitly import it*. This is shown in an updated\
    \ `bar.ts` below:\n\n```typescript\nimport {foo} from \"./foo\";\nvar bar = foo;\
    \ // allowed\n```\n\nUsing an `import` in `bar.ts` not only allows you to bring\
    \ in stuff from other files, but also marks the file `bar.ts` as a *module* and\
    \ therefore, declarations in `bar.ts` don't pollute the global namespace either.\n\
    \nWhat JavaScript is generated from a given TypeScript file\n\n### External modules\n\
    \nThere is a lot of power and usability packed into external modules. Here we\
    \ discuss some patterns.\n\n### File lookup\n\nThe following statement:\n\n```typescript\n\
    import foo = require('foo');\n```\n\ntells the compiler to look for a relative\
    \ path:\n\n```typescript\nimport foo = require('./foo');\n```\n\n### Compiler\
    \ Option\n\nThe following statement:\n\n```typescript\nimport foo = require('foo');\n\
    ```\n\nwill generate *different* JavaScript based on *module* option (like `commonjs`,\
    \ `amd`, `umd`, or `system`).\n\n### Type only\n\nType inference needs to be done\
    \ *upfront*. This means that if you want to use some type from a file `foo` in\
    \ a file `bar` you will have to do:\n\n```typescript\nimport foo = require('foo');\n\
    var bar: foo.SomeType;\n```\n\nThe following statement:\n\n```typescript\nimport\
    \ foo = require('foo');\n```\n\nactually does *two* things:\n- Imports the type\
    \ information of the foo module.\n- Specifies a runtime dependency on the foo\
    \ module.\n\nYou can pick and choose so that only the type information is loaded.\
    \ If you do not use the imported name in variable declaration then the import\
    \ is completely removed from the generated JavaScript.\n\n#### Example 1\n```typescript\n\
    import foo = require('foo');\n```\nwill generate the JavaScript: That's right.\
    \ An empty file as foo is not used.\n\n#### Example 2\n```typescript\nimport foo\
    \ = require('foo');\nvar bar: foo;\n```\nwill generate the JavaScript: var bar;\
    \ This is because foo (or any of its properties e.g. bas) is never used as a variable.\n\
    \n#### Example 3\n```typescript\nimport foo = require('foo');\nvar bar = foo;\n\
    ```\nwill generate the JavaScript (assuming commonjs): var foo = require('foo');\
    \ var bar = foo; This is because foo is used as a variable.\n\n### Use case: Lazy\
    \ loading\n\nHowever you might want to only load the file `foo` at runtime under\
    \ certain conditions. For such cases you should use the imported name only in\
    \ *type annotations* and **not** as a *variable*. This removes any *upfront* runtime\
    \ dependency code being injected by TypeScript. Then *manually import* the actual\
    \ module using code that is specific to your module loader. As an example, consider\
    \ the following `commonjs` based code where we only load a module 'foo' on a certain\
    \ function call:\n\n```typescript\nimport foo = require('foo');\n\nexport function\
    \ loadFoo() {\n // This is lazy loading `foo` and using the original module *only*\
    \ as a type annotation\n var _foo: typeof foo = require('foo');\n // Now use `_foo`\
    \ as a variable instead of `foo`.\n}\n```\n"
  mdcn: "\n\n这些（以及更多）编译器选项将在稍后讨论。\n\n## TypeScript 编译器\n\n良好的 IDE 内置了对 ts 实时编译为 js\
    \ 编译的支持。但是，如果你想在在使用 `tsconfig.json` 时从命令行手动运行 TypeScript 编译器，可以通过几种方式实现。\n\n只需运行\
    \ `tsc`，它将会在当前目录以及所有父文件夹中查找 `tsconfig.json` 直到找到为止。\n\n运行 `tsc -p ./path-to-project-directory\
    \ .`。当然，路径可以是完整路径或相对于当前目录的相对路径。\n\n你甚至可以使用 `tsc -w` 以*watch*模式启动 TypeScript 编译器，它将监控你的\
    \ TypeScript 项目文件的变化。\n\n### tsconfig.json\n\n### 哪些文件？\n\n你可以使用 `files` 来明确指定：\n\
    \n```json\n{\n \"files\":[\n    \"./some/file.ts\"\n  ]\n}\n```\n\n或者使用 `include`\
    \ 和 `exclude` 来指定文件。例如：\n\n```json\n{\n  \"include\":[\n    \"./folder\"\n  ],\n\
    \  \"exclude\":[\n    \"./folder/**/*.spec.ts\",\n    \"./folder/someSubFolder\"\
    \n  ]\n}\n```\n\n一些说明：\n- 如果指定了 `files`，其他选项将被忽略\n- `**/*`（例如用法用法 `somefolder/**/*`）意味着所有文件夹和任何文件（包含\
    \ `.ts / .tsx` 扩展，如果 `allowJs` 为 true，甚至会包含 `.js / .jsx`）\n\n声明空间\n\nTypeScript\
    \ 中有两个声明空间：*变量*声明空间和*类型*声明空间。这些概念在下文中将进行探讨。\n\n### 类型声明空间\n\n类型声明空间包含了可以用作类型注解的内容。例如，以下是几个类型声明：\n\
    \n```typescript\nclass Foo {};\ninterface Bar {};\ntype Bas = {};\n```\n\n这意味着你可以将\
    \ `Foo`、`Bar`、`Bas` 等作为类型注解。例如：\n\n```typescript\nvar foo: Foo;\nvar bar: Bar;\n\
    var bas: Bas;\n```\n\n注意，尽管你定义了 `interface Bar`，*你无法将其作为变量使用*，因为它没有贡献*变量声明空间*。如下所示：\n\
    \n```typescript\ninterface Bar {};\nvar bar = Bar; // ERROR: \"cannot find name\
    \ 'Bar'\"\n```\n\n之所以说 `cannot find name`，是因为 `Bar` 这个名字在*变量*声明空间中*没有定义*。这引出了我们的下一个主题“变量声明空间”。\n\
    \n### 变量声明空间\n\n变量声明空间包含了你可以作为变量使用的内容。我们看到 `class Foo` 会向*类型*声明空间贡献一个类型 `Foo`。猜猜怎么着？它也向*变量*声明空间贡献了一个*变量*\
    \ `Foo`，如下文所示：\n\n```typescript\nclass Foo {};\nvar someVar = Foo;\nvar someOtherVar\
    \ = 123;\n```\n\n这太棒了，因为有时你想将类作为变量传递。记住：我们不能将像 `interface` 这样*仅存在于**类型*声明空间的东西作为变量。\n\
    \n同样，你用 `var` 定义的东西*仅存在于*变量声明空间，且不能用作类型注解：\n\n```typescript\nvar foo = 123;\n\
    var bar: foo; // ERROR: \"cannot find name 'foo'\"\n```\n\n之所以说 `cannot find name`，是因为\
    \ `foo` 这个名字在*类型*声明空间中*没有定义*。\n\n## 模块\n\n### 全局模块\n\n默认情况下，当你在新的 TypeScript 文件中编写代码时，你的代码处于*全局*命名空间。作为一个演示，考虑一个文件\
    \ `foo.ts`：\n\n```typescript\nvar foo = 123;\n```\n\n如果你现在在同一个项目中创建一个*新*文件 `bar.ts`，TypeScript\
    \ 类型系统将*允许*你使用变量 `foo`，就像它是全局可用的一样：\n\n```typescript\nvar bar = foo; // allowed\n\
    ```\n\n不用说，拥有全局命名空间是危险的，因为它会让你的代码面临命名冲突风险。我们建议使用接下来介绍的文件模块。\n\n### 文件模块\n\n也称为*外部模块*（external\
    \ modules）。如果你在 TypeScript 文件的根层级有 `import` 或 `export`，那么它会在该文件中创建一个*局部*作用域。所以，如果我们把之前的\
    \ `foo.ts` 修改为如下内容（注意 `export` 的用法）：\n\n```typescript\nexport var foo = 123;\n\
    ```\n\n我们将不再在全局命名空间中拥有 `foo`。这可以通过如下如下新文件 `bar.ts` 来演示：\n\n```typescript\nvar\
    \ bar = foo; // ERROR: \"cannot find name 'foo'\"\n```\n\n如果你想在 `bar.ts` 中使用 `foo.ts`\
    \ 中的内容，*你需要显式地导入它*。如下更新后的 `bar.ts` 所示：\n\n```typescript\nimport {foo} from \"\
    ./foo\";\nvar bar = foo; // allowed\n```\n\n在 `bar.ts` 中使用 `import` 不仅允许你从其他文件引入内容，还将文件\
    \ `bar.ts` 标记为*模块*，因此，`bar.ts` 中的声明也不会污染全局命名空间。\n\n从给定的 TypeScript 文件生成什么 JavaScript\n\
    \n### 外部模块\n\n外部模块包含了大量的强大和易用性。在这里我们讨论一些模式。\n\n### 文件查找\n\n以下语句：\n\n```typescript\n\
    import foo = require('foo');\n```\n\n告诉编译器去查找相对路径：\n\n```typescript\nimport foo\
    \ = require('./foo');\n```\n\n### 编译器选项\n\n以下语句：\n\n```typescript\nimport foo\
    \ = require('foo');\n```\n\n根据*module*选项（如 `commonjs`、`amd`、`umd` 或 `system`）生成*不同的*\
    \ JavaScript。\n\n### 仅类型\n\n类型推断需要*预先*完成。这意味着如果你想在文件 `bar` 中使用文件 `foo` 中的某些类型，你必须：\n\
    \n```typescript\nimport foo = require('foo');\nvar bar: foo.SomeType;\n```\n\n\
    以下语句：\n\n```typescript\nimport foo = require('foo');\n```\n\n实际上做了*两件事*：\n- 导入模块的类型信息。\n\
    - 指定了该模块的运行时依赖。\n\n你可以选择使得只加载类型信息。如果你不在变量声明中使用导入的名字，则该导入将完全从生成的 JavaScript 中移除。\n\
    \n#### 示例 1\n```typescript\nimport foo = require('foo');\n```\n生成的 JavaScript\
    \ 是：没错。一个空文件，因为 foo 没有被使用。\n\n#### 示例 2\n```typescript\nimport foo = require('foo');\n\
    var bar: foo;\n```\n生成的 JavaScript 是：var bar; 这是因为 foo（或其任何属性，例如 bas）从未被当作变量使用。\n\
    \n#### 示例 3\n```typescript\nimport foo = require('foo');\nvar bar = foo;\n```\n\
    生成的 JavaScript（假设为 commonjs）：var foo = require('foo'); var bar = foo; 这是因为 foo\
    \ 被当作变量使用了。\n\n### 用例：懒加载\n\n然而，你可能只想在某些条件下运行时加载文件 `foo`。对于此类情况，你应该仅将导入的名字用于*类型注解*，而**不要**作为*变量*。这消除了\
    \ TypeScript 注入的任何预先运行时依赖代码。然后使用特定于你的模块加载器的代码*手动导入*实际模块。例如，考虑以下基于 `commonjs` 的代码，我们在特定的函数调用时才加载模块\
    \ 'foo'：\n\n```typescript\nimport foo = require('foo');\n\nexport function loadFoo()\
    \ {\n // 这是懒加载 `foo`，并将原始模块*仅*作为类型注解\n var _foo: typeof foo = require('foo');\n\
    \ // 现在使用 `_foo` 作为变量而不是 `foo`。\n}\n```\n"
