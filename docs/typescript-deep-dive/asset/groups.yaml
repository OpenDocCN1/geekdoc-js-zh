    \ can break at runtime.**\n\nConsider  foo.ts :\n\nclass Foo {\n\n}\n\nand a \
    \ bar.ts :\n\nclass Bar extends Foo {\n\n}\n\nIf you fail to compile it in correct\
    \ order e.g. perhaps alphabetically  tsc bar.ts foo.ts  the\n\ncode will compile\
