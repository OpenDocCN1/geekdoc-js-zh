  - "[PAGE 15]\n\n![](img/416f69818aa79e3f1fe0e7869c118431_15_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_15_1.png)\n\
    \n**Making JavaScript Better**\n\nTypeScript will try to protect you from portions\
    \ of JavaScript that never worked (so you don't\n\nneed to remember this stuff):\n\
    \n\\[\\] + \\[\\]; // JavaScript will give you \"\" (which makes little sense),\
    \ TypeScript will er\n\nror\n\n//\n\n// other things that are nonsensical in JavaScript\n\
    \n// - don't give a runtime error (making debugging hard)\n\n// - but TypeScript\
    \ will give a compile time error (making debugging unnecessary)\n\n//\n\n{} +\
    \ \\[\\]; // JS : 0, TS Error\n\n\\[\\] + {}; // JS : \"\\[object Object\\]\"\
    , TS Error\n\n{} + {}; // JS : NaN or \\[object Object\\]\\[object Object\\] depending\
    \ upon browser, TS Error\n\n\"hello\" - 1; // JS : NaN, TS Error\n\nfunction add(a,b)\
    \ {\n\n return\n\n a + b; // JS : undefined, TS Error 'unreachable code detected'\n\
    \n}\n\nEssentially TypeScript is linting JavaScript. Just doing a better job at\
    \ it than other linters that\n\ndon't have *type information*.\n\n**You still\
    \ need to learn JavaScript**\n\nThat said TypeScript is very pragmatic about the\
    \ fact that *you do write JavaScript* so there\n\nare some things about JavaScript\
    \ that you still need to know in order to not be caught off-\n\nguard. Let's discuss\
    \ them next.\n\nNote: TypeScript is a superset of JavaScript. Just with documentation\
    \ that can actually\n\nbe used by compilers / IDEs ;)\n\nJavaScript\n\n16"
  - "[PAGE 16]\n\n**Equality**\n\nOne thing to be careful about in JavaScript is the\
    \ difference between  ==  and  === . As\n\nJavaScript tries to be resilient against\
    \ programming errors  ==  tries to do type coercion\n\nbetween two variables e.g.\
    \ converts a string to a number so that you can compare with a\n\nnumber as shown\
    \ below:\n\nconsole.log(5 == \"5\"); // true , TS Error\n\nconsole.log(5 === \"\
    5\"); // false , TS Error\n\nHowever the choices JavaScript makes are not always\
    \ ideal. For example in the below\n\nexample the first statement is false because\
    \  \"\"  and  \"0\"  are both strings and are clearly\n\nnot equal. However in\
    \ the second case both  0  and the empty string ( \"\" ) are falsy (i.e.\n\nbehave\
    \ like  false ) and are therefore equal with respect to  == . Both statements\
    \ are false\n\nwhen you use  === .\n\nconsole.log(\"\" == \"0\"); // false\n\n\
    console.log(0 == \"\"); // true\n\nconsole.log(\"\" === \"0\"); // false\n\nconsole.log(0\
    \ === \"\"); // false\n\nNote that  string == number  and  string === number \
    \ are both compile time errors in\n\nTypeScript, so you don't normally need to\
    \ worry about this.\n\nSimilar to  ==  vs.  === , there is  !=  vs.  !== \n\n\
    So ProTip: Always use  ===  and  !==  except for null checks, which we cover later.\n\
    \nEquality\n\n17"
- md: "\n## References\n\nBeyond literals, any Object in JavaScript (including functions,\
    \ arrays, regexp etc) are references. This means the following\n\n**Mutations\
    \ are across all references**\n\nvar foo = {};\n\nvar bar = foo; // bar is a reference\
    \ to the same object\n\nfoo.baz = 123;\n\nconsole.log(bar.baz); // 123\n\n**Equality\
    \ is for references**\n\nvar foo = {};\n\nvar bar = foo; // bar is a reference\n\
    \nvar baz = {}; // baz is a *new object* distinct from `foo`\n\nconsole.log(foo\
    \ === bar); // true\n\nconsole.log(foo === baz); // false\n\n## Null and Undefined\n\
    \nFact is you will need to deal with both. Just check for either with `==` check.\n\
    \n/// Imagine you are doing `foo.bar == undefined` where bar can be one of:\n\n\
    console.log(undefined == undefined); // true\nconsole.log(null == undefined);\
    \ // true\nconsole.log(0 == undefined); // false\nconsole.log('' == undefined);\
    \ // false\nconsole.log(false == undefined); // false\n\nRecommend `== null` to\
    \ check for both `undefined` or `null`. You generally don't want to make a distinction\
    \ between the two.\n\n**undefined**\n\nRemember how I said you should use `==\
    \ null`. Of course you do (cause I just said it ^).\n\nDon't use it for root level\
    \ things. In strict mode if you use `foo` and `foo` is undefined you get a `ReferenceError`\
    \ **exception** and the whole call stack unwinds.\n\nYou should use strict mode\
    \ ... and in fact the TS compiler will insert it for you if you use modules ...\
    \ more on those later in the book so you don't have to be explicit about it :)\n\
    \nSo to check if a variable is defined or not at a *global* level you normally\
    \ use `typeof`:\n\n```javascript\nif (typeof someglobal !== 'undefined') {\n \
    \ // someglobal is now safe to use\n  console.log(someglobal);\n}\n```\n\n## this\n\
    \nAny access to `this` keyword within a function is actually controlled by how\
    \ the function is actually called. It is commonly referred to as the *calling\
    \ context*.\n\nHere is an example:\n\n```javascript\nfunction foo() {\n  console.log(this);\n\
    }\nfoo(); // logs out the global e.g. `window` in browsers\n\nlet bar = {\n  foo\n\
    }\nbar.foo(); // Logs out `bar` as `foo` was called on `bar`\n```\n\nSo be mindful\
    \ of your usage of `this`. If you want to disconnect `this` in a class from the\
    \ calling context use an arrow function, more on that later.\n\n![](img/416f69818aa79e3f1fe0e7869c118431_20_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_20_1.png)\n\
    \n## Closure\n\nThe best thing that JavaScript ever got was closures. A function\
    \ in JavaScript has access to any variables defined in the outer scope. Closures\
    \ are best explained with examples:\n\n```javascript\nfunction outerFunction(arg)\
    \ {\n  var variableInOuterFunction = arg;\n  function bar() {\n    console.log(variableInOuterFunction);\
    \ // Access a variable from the outer scope\n  }\n  // Call the local function\
    \ to demonstrate that it has access to arg\n  bar();\n}\nouterFunction(\"hello\
    \ closure\"); // logs hello closure!\n```\n\nYou can see that the inner function\
    \ has access to a variable (variableInOuterFunction) from the outer scope. The\
    \ variables in the outer function have been closed by (or bound in) the inner\
    \ function. Hence the term **closure**. The concept in itself is simple enough\
    \ and pretty intuitive.\n\nNow the awesome part: the inner function can access\
    \ the variables from the outer scope *even after the outer function has returned*.\
    \ This is because the variables are still bound in the inner function and not\
    \ dependent on the outer function. Again let's look at an example:\n\n```javascript\n\
    function outerFunction(arg) {\n  var variableInOuterFunction = arg;\n  return\
    \ function() {\n    console.log(variableInOuterFunction);\n  }\n}\nvar innerFunction\
    \ = outerFunction(\"hello closure!\");\n// Note the outerFunction has returned\n\
    innerFunction(); // logs hello closure!\n```\n\n**Reason why it's awesome**\n\n\
    It allows you to compose objects easily e.g. the revealing module pattern:\n\n\
    ```javascript\nfunction createCounter() {\n  let val = 0;\n  return {\n    increment()\
    \ { val++ },\n    getVal() { return val }\n  }\n}\nlet counter = createCounter();\n\
    counter.increment();\nconsole.log(counter.getVal()); // 1\ncounter.increment();\n\
    console.log(counter.getVal()); // 2\n```\n\nAt a high level it is also what makes\
    \ something like Node.js possible (don't worry if it doesn't click in your brain\
    \ right now. It will eventually ):\n\n```javascript\n// Pseudo code to explain\
    \ the concept\nserver.on(function handler(req, res) {\n  loadData(req.id).then(function(data)\
    \ {\n    // the `res` has been closed over and is available\n    res.send(data);\n\
    \  })\n});\n```\n\n## Future JavaScript: Now\n\nOne of the main selling points\
    \ of TypeScript is that it allows you to use a bunch of features from ES6 and\
    \ beyond in current (ES3 and ES5 level) JavaScript engines (like current browsers\
    \ and Node.js). Here we deep dive into why these features are useful followed\
    \ by how these features are implemented in TypeScript.\n\nNote: Not all of these\
    \ features are slated for immediate addition to JavaScript but provide great utility\
    \ to your code organization and maintenance. Also note that you are free to ignore\
    \ any of the constructs that don't make sense for your project, although you will\
    \ end up using most of them eventually ;)\n\n## Classes\n\nThe reason why it's\
    \ important to have classes in JavaScript as a first class item is that:\n\n1.\
    \ Classes offer a useful structural abstraction\n2. Provides a consistent way\
    \ for developers to use classes instead of every framework (emberjs,reactjs etc)\
    \ coming up with their own version.\n3. Object Oriented Developers already understand\
    \ classes.\n\nFinally JavaScript developers can *have **class *. Here we have\
    \ a basic class called Point:\n\n```typescript\nclass Point {\n  x: number;\n\
    \  y: number;\n  constructor(x: number, y: number) {\n    this.x = x;\n    this.y\
    \ = y;\n  }\n  add(point: Point) {\n    return new Point(this.x + point.x, this.y\
    \ + point.y);\n  }\n}\nvar p1 = new Point(0, 10);\nvar p2 = new Point(10, 20);\n\
    var p3 = p1.add(p2); // {x:10,y:30}\n```\n\nThis class generates the following\
    \ JavaScript on ES5 emit:\n\n```javascript\nvar Point = (function () {\n  function\
    \ Point(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n  Point.prototype.add\
    \ = function (point) {\n    return new Point(this.x + point.x, this.y + point.y);\n\
    \  };\n  return Point;\n})();\n```\n\nThis is a fairly idiomatic traditional JavaScript\
    \ class pattern now as a first class language construct.\n\n## Inheritance\n\n\
    Classes in TypeScript (like other languages) support *single* inheritance using\
    \ the `extends` keyword as shown below:\n\n```typescript\nclass Point3D extends\
    \ Point {\n  z: number;\n  constructor(x: number, y: number, z: number) {\n  \
    \  super(x, y);\n    this.z = z;\n  }\n  add(point: Point3D) {\n    return new\
    \ Point3D(this.x + point.x, this.y + point.y, this.z);\n  }\n}\n```\n\n## Statics\n\
    \nTypeScript classes support `static` properties that are shared by all instances\
    \ of the class. A natural place to put (and access) them is on the class itself:\n\
    \n```javascript\nclass Something {\n  static instances = 0;\n  constructor() {\n\
    \    Something.instances++;\n  }\n}\nvar s1 = new Something();\nvar s2 = new Something();\n\
    console.log(Something.instances); // 2\n```\n\nYou can have static members as\
    \ well as static functions.\n\n## Access Modifiers\n\nTypeScript supports access\
    \ modifiers `public`, `private` and `protected` which determine the accessibility\
    \ of a `class` member as shown below:\n\n| accessible on | public | protected\
    \ | private |\n| :--- | :---: | :---: | :---: |\n| class | yes | yes | yes |\n\
    | children | yes | yes | no |\n| class instances | yes | no | no |\n\nIf an access\
    \ modifier is not specified it is implicitly `public` as that matches the *convenient*\
    \ nature of JavaScript.\n\nNote that at runtime (in the generated JS) these have\
    \ no significance but will give you compile time errors if you use them incorrectly.\
    \ An example of each is shown below:\n\n```typescript\nclass FooBase {\n  public\
    \ x: number;\n  private y: number;\n  protected z: number;\n}\n\n// EFFECT ON\
    \ INSTANCES\nvar foo = new FooBase();\nfoo.x; // okay\nfoo.y; // ERROR: private\n\
    foo.z; // ERROR: protected\n\n// EFFECT ON CHILD CLASSES\nclass FooChild extends\
    \ FooBase {\n  constructor() {\n    super();\n    this.x; // okay\n    this.y;\
    \ // ERROR: private\n    this.z; // okay\n  }\n}\n```\n\n## Abstract\n\n`abstract`\
    \ can be thought of as an access modifier. We present it separately because opposed\
    \ to the previously mentioned modifiers it can be on a `class` as well as any\
    \ member of the class. Having an `abstract` modifier primarily means that such\
    \ functionality *cannot be directly invoked* and a child class must provide the\
    \ functionality.\n\n`abstract` **classes** cannot be directly instantiated. Instead\
    \ the user must create some.\n"
  mdcn: "\n\n## 引用\n\n除了字面量外，JavaScript 中的任何对象（包括函数、数组、正则表达式等）都是引用。这意味着：\n\n**修改会影响到所有引用**\n\
    \nvar foo = {};\n\nvar bar = foo; // bar 是指向同一个对象的引用\n\nfoo.baz = 123;\n\nconsole.log(bar.baz);\
    \ // 123\n\n**相等性比较针对引用**\n\nvar foo = {};\n\nvar bar = foo; // bar 是一个引用\n\n\
    var baz = {}; // baz 是一个与 `foo` 不同的*新对象*\n\nconsole.log(foo === bar); // true\n\
    \nconsole.log(foo === baz); // false\n\n## Null 和 Undefined\n\n事实上，你需要同时处理这两者。只需用\
    \ `==` 检查其中任意一个即可。\n\n/// 假设你正在执行 `foo.bar == undefined`，其中 bar 可能是以下值之一：\n\n\
    console.log(undefined == undefined); // true\nconsole.log(null == undefined);\
    \ // true\nconsole.log(0 == undefined); // false\nconsole.log('' == undefined);\
    \ // false\nconsole.log(false == undefined); // false\n\n推荐使用 `== null` 来同时检查\
    \ `undefined` 或 `null`。你通常不需要对这两者进行区分。\n\n**undefined**\n\n记得我说过你应该使用 `== null`\
    \ 吗？当然你会用（因为我刚说了 ^）。\n\n不要将它用于根层级的内容。在严格模式下，如果你使用 `foo` 而 `foo` 是 undefined，你会得到一个\
    \ `ReferenceError` **异常**，并且整个调用栈都会回溯。\n\n你应该使用严格模式……事实上，如果你使用模块，TS 编译器会为你插入……关于这些内容在书中后面会有更多介绍，所以你不需要显式指定\
    \ :)\n\n所以，要检查一个变量在*全局*级别上是否定义，通常使用 `typeof`：\n\n```javascript\nif (typeof someglobal\
    \ !== 'undefined') {\n  // someglobal 现在可以安全使用了\n  console.log(someglobal);\n\
    }\n```\n\n## this\n\n函数内部对 `this` 关键字的任何访问实际上都由函数的调用方式控制。这通常被称为*调用上下文*。\n\n这里有一个示例：\n\
    \n```javascript\nfunction foo() {\n  console.log(this);\n}\nfoo(); // 记录全局对象，例如浏览器中的\
    \ `window`\n\nlet bar = {\n  foo\n}\nbar.foo(); // 输出 `bar`，因为 `foo`是在 `bar` 上被调用的\n\
    ```\n\n所以要注意你对 `this` 的使用。如果你想将类中的 `this` 与调用上下文断开，请使用箭头函数，更多内容稍后介绍。\n\n![](img/416f69818aa79e3f1fe0e7869c118431_20_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_20_1.png)\n\
    \n## 闭包\n\nJavaScript 最 greatest特性就是闭包。JavaScript 中的函数可以访问定义在外部作用域的任何变量。通过示例解释闭包是最好的：\n\
    \n```javascript\nfunction outerFunction(arg) {\n  var variableInOuterFunction\
    \ = arg;\n  function bar() {\n    console.log(variableInOuterFunction); // 访问外部作用域的变量\n\
    \  }\n  // 调用本地函数以证明它有访问 arg 的权限\n  bar();\n}\nouterFunction(\"hello closure\"\
    ); // 输出 hello closure!\n```\n\n你可以看到内部函数可以访问外部作用域的变量（variableInOuterFunction）。外部函数中的变量被闭包在（或绑定在）内部函数中。因此有了**闭包**这个术语。这个概念本身足够简单且直观。\n\
    \n现在是很棒的部分：即使在外部函数返回之后，内部函数仍然可以访问外部作用域的变量。这是因为这些变量仍然绑定在内部函数中，而不是依赖于外部函数。再次看一个例子：\n\
    \n```javascript\nfunction outerFunction(arg) {\n  var variableInOuterFunction\
    \ = arg;\n  return function() {\n    console.log(variableInOuterFunction);\n \
    \ }\n}\nvar innerFunction = outerFunction(\"hello closure!\"); // 注意 outerFunction\
    \ 已返回\ninnerFunction(); // 输出 hello closure!\n```\n\n**闭包很棒的原因**\n\n它允许你轻松组合对象，例如模块模式：\n\
    \n```javascript\nfunction createCounter() {\n  let val = 0;\n  return {\n    increment()\
    \ { val++ },\n    getVal() { return val }\n  }\n}\nlet counter = createCounter();\n\
    counter.increment(); // 输出 1\ncounter.getVal(); // 输出 2\n```\n\n在高级层面上，这让像 Node.js\
    \ 这样的东西变得可能（如果这现在不听你的话）。它演变为：\n\n```javascript\n// 解释概念的伪代码\nserver.on(function(req,\
    \ res) {\n  // `res` 被闭包了并且可用\n  loadData(req).then(function(data) {\n    res.send(data);\n\
    \  })\n});\n```\n\n## 未来 JavaScript\n\nTypeScript 的主要卖点之一是允许你使用 ES6 及之后的许多特性，即使在当前的\
    \ JavaScript 引擎中可能还不支持。\n\nTypeScript 支持 `public`、`private` 和 `protected` 访问修符，它们决定了\
    \ `class` 成员的访问权限，如下所示：\n\n| 访问范围 | public | protected | private |\n| :--- | :---:\
    \ | :---: | :---: |\n| 类 | 是 | 是 | 是 |\n| 子类 | 是 | 是 | 否 |\n| 类实例 | 是 | 否 | 否\
    \ |\n\n如果未指定访问修符，它隐式为 `public`，因为这符合 JavaScript 的*便利*特性。\n\n注意，在运行时（在生成的 JS 中）这些没有意义，但如果你错误地使用它们，将会给你编译错误。下面是各者的示例：\n\
    \n```typescript\nclass FooBase {\n  public x: number;\n  private y: number;\n\
    \  protected z: number;\n}\n\n// 对实例的影响\nvar foo = new FooBase();\nfoo.x; // 正常\n\
    foo.y; // 错误: private\nfoo.z; // 错误: protected\n\n// 对子类的影响\nclass FooChild extends\
    \ FooBase {\n  constructor() {\n    super();\n    this.x; // 正常\n    this.y; //\
    \ 错误: private\n    this.z; // 正常\n  }\n}\n```\n\n## 类\n\n在 JavaScript 中作为类语言构造引入类的原因是：\n\
    \n1. 类提供了实用的结构抽象。\n2. 为开发者（如 emberjs, reactjs 等）提供了一种统一的使用类的方式。\n3. 面向对象的开发者已经理解了类。\n\
    \n最后，JavaScript 开发者可以*拥有*一个基础类。这里有一个基础 Point 类：\n\n```typescript\nclass Point\
    \ {\n  x: number;\n  y: number;\n  constructor(x: number, y: number) {\n    this.x\
    \ = x;\n    this.y = y;\n  }\n  add(point: Point) {\n    return new Point(this.x\
    \ + point.x, this.y + point.y);\n  }\n}\nvar p1 = new Point(0, 10);\nvar p2 =\
    \ new Point(10, 20);\nvar p3 = p1.add(p2); // {x:10,y:30}\n```\n\n该类在 ES5 中生成以下\
    \ JavaScript：\n\n```javascript\nvar Point = (function () {\n  function Point(x,\
    \ y) {\n    this.x = x;\n    this.y = y;\n  }\n  Point.prototype.add = function\
    \ (point) {\n    return new Point(this.x + point.x, this.y + point.y);\n  };\n\
    \  return Point;\n})();\n```\n\n作为第一类语言构造，这是一种非常符合传统的传统的 JavaScript 类模式。\n\n##\
    \ 继承\n\nTypeScript 中的类（与其他语言一样）使用 `extends` 关键字支持*单*继承，如下：\n\n```typescript\n\
    class Point3D extends Point {\n  z: number;\n  constructor(x: number, y: number,\
    \ z: number) {\n    super(x, y);\n    this.z = z;\n  }\n  add(point: Point3D)\
    \ {\n    return new Point3D(this.x + point.x, this.y + point.y, this.z);\n  }\n\
    }\n```\n\n## 静态\n\nTypeScript 类支持 `static` 属性，这些属性由类的所有实例共享。放置（以及访问）它们的自然地方是类本身：\n\
    \n```javascript\nclass Something {\n  static instances = 0;\n  constructor() {\n\
    \    Something.instances++;\n  }\n}\nvar s1 = new Something();\nvar s2 = new Something();\n\
    console.log(Something.instances); // 2\n```\n\n你可以拥有静态成员，也可以有静态函数。\n\n## 访问修符\n\
    \nTypeScript 支持 `public`、`private` 和 `protected` 访问修符，它们如下所示决定了 `class` 成员的可见性：\n\
    \n## 抽象\n\n`abstract` 可以被视为一种访问修符。我们单独介绍它，是因为与之前提到的修符相反，它不仅可以用于类，还可以用于类的任何成员。拥有\
    \ `abstract` 修符主要意味着该功能*无法被直接调用*，并且子类必须提供该功能。\n\n"
