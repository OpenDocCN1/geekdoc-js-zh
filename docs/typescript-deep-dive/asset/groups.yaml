- md: "\n## StyleGuide\n\n266\n\n## Common Errors\n\nIn this section we explain a\
    \ number of common error codes that users experience in the real world.\n\n###\
    \ TS2304\nSamples:\n```typescript\nCannot find name ga\n```\nYou are probably\
    \ using a third party library (e.g. google analytics) and don't have it declared\
    \ d. TypeScript tries to save you from *spelling mistakes* and *using variables\
    \ without* *declaring them* so you need to be explicit on anything that is *available\
    \ at runtime* because of you including some external library (more on how to fix\
    \ it).\n\n### TS2307\nSamples:\n```typescript\nCannot find module 'underscore'\n\
    ```\nYou are probably using a third party library (e.g. underscore) as a *module*\
    \ (more on modules) and don't have the ambient declaration file for it (more on\
    \ ambient declarations).\n\n### TS1148\nSample:\n```typescript\nCannot compile\
    \ modules unless the '--module' flag is provided\n```\nCheckout the section on\
    \ modules.\n\n### For search indexing\nYou can ignore reading this. This section\
    \ is for search engine indexing.\n\nCommon Errors\n\n267\n\nOther modules that\
    \ people tend to use and get errors:\n```typescript\nCannot find name $\nCannot\
    \ find module jquery\n```\n\nCommon Errors\n\n268\n\n## Compiler\n\nThe typescript\
    \ compiler source is located under the `src/compiler` folder. It is split into\
    \ the follow key parts:\n\n- Scanner (scanner.ts)\n- Parser (parser.ts)\n- Binder\
    \ (binder.ts)\n- Checker (checker.ts)\n- Emitter (emitter.ts)\n\nEach of these\
    \ get their own unique files in the source. These parts will be explained later\
    \ on in this chapter.\n\n## BYOTS\nWe have a project called Bring Your Own TypeScript\
    \ (BYOTS) which makes it easier to play around with the compiler API e.g. by exposing\
    \ internal APIs. You can use it to expose your local app's version of TypeScript\
    \ globally.\n\n## Syntax vs. Semantics\nJust because something is *syntactically*\
    \ correct doesn't mean it is *semantically* correct. Consider the following piece\
    \ of TypeScript code which although *syntactically* valid is *semantically* wrong:\n\
    \n```typescript\nvar foo: number = \"not a number\";\n```\nSemantic means \"meaning\"\
    \ in English. This concept is useful to have in your head.\n\n## Processing Overview\n\
    The following is a quick review of how these key parts of the TypeScript compiler\
    \ compose:\n\nSourceCode ~~ scanner ~~> Token Stream\nToken Stream ~~ parser ~~>\
    \ AST\nAST ~~ binder ~~> Symbols\n\nSymbol is the primary building block of the\
    \ TypeScript *semantic* system. As shown the symbols are created as a result of\
    \ binding. Symbols connect declaration nodes in the AST to other declarations\
    \ contributing to the same entity.\n\nSymbols + AST are what is used by the checker\
    \ to *semantically* validate the source code AST\nAST + Symbols ~~ checker ~~>\
    \ Type Validation\n\nFinally When a JS output is requested:\nAST + Checker ~~\
    \ emitter ~~> JS\n\nThere are a few additional files in the TypeScript compiler\
    \ that provide utilities to many of these key portions which we cover next.\n\n\
    ## File: Utilities\n`core.ts`: core utilities used by the TypeScript compiler.\
    \ A few important ones:\n- `let objectAllocator: ObjectAllocator` : is a variable\
    \ defined as a singleton global. It provides the definitions for `getNodeConstructor`\
    \ (Nodes are covered when we look at parser / AST ), `getSymbolConstructor` (Symbols\
    \ are covered in binder ), `getTypeConstructor` (Types are covered in checker\
    \ ), `getSignatureConstructor` (Signatures are the index, call and construct signatures).\n\
    \n## File: Key Data Structures\n`types.ts` contains key data structures and interfaces\
    \ uses throughout the compiler. Here is a sampling of a few key ones:\n\n| Name\
    \ | Description |\n| :--- | :--- |\n| SyntaxKind | The AST node type is identified\
    \ by the `SyntaxKind` enum. |\n| TypeChecker | This is the interface provided\
    \ by the TypeChecker. |\n| CompilerHost | This is used by the `Program` to interact\
    \ with the `System`. |\n| Node | An AST node. |\n\n## File: System\n`system.ts`.\
    \ All interaction of the TypeScript compiler with the operating system goes through\
    \ a `System` interface. Both the interface and its implementations (WScript and\
    \ Node ) are defined in `system.ts` . You can think of it as the *Operating Environment*\
    \ (OE).\n\nNow that you have an overview of the major files, we can look at the\
    \ concept of `Program`.\n\n## Program\nDefined in `program.ts`. The compilation\
    \ context (a concept we covered previously) is represented within the TypeScript\
    \ compiler as a `Program`. It consists of `SourceFile`s and compiler options.\n\
    \n### Usage of CompilerHost\nIts interaction mechanism with the OE:\n`Program\
    \ -uses-> CompilerHost -uses-> System`\n\nThe reason for having a `CompilerHost`\
    \ as a point of indirection is that it allows its interface to be more finely\
    \ tuned for `Program` needs and not bother with OE needs (e.g. the `Program` doesn't\
    \ care about `fileExists` a function provided by `System` ).\n\nThere are other\
    \ users of `System` as well (e.g. tests).\n\n## SourceFile\nThe program provides\
    \ an API to get the Source Files `getSourceFiles(): SourceFile[]` . Each is represented\
    \ as a root-level node for an AST (called `SourceFile`).\n\n## Node\nThe basic\
    \ building block of the Abstract Syntax Tree (AST). In general a `Node` represents\
    \ the language. Here are a few things make up a node:\n- `kind`: the type of node.\n\
    - `parent`: the parent node in the AST.\n- `pos`: the start position of the node.\n\
    - `end`: the end position of the node.\n- `flags`: bitflags for the node.\n- `modifiers`:\
    \ modifiers applied to the node.\n- `file`: the source file the node belongs to.\n\
    - `symbol`: the symbol associated with the node.\n- `type`: the type of the node.\n\
    - `expression`: the expression if the node is an expression.\n- `statement`: the\
    \ statement if the node is a statement.\n- `declaration`: the declaration if the\
    \ node is a declaration.\n- `children`: the list of child nodes.\n\n## SourceFile\n\
    Each `SourceFile` is a top-level node for an AST.\n\n## AST Tip: Visit Children\n\
    There is a utility function `ts.forEachChild` that allows you to visit all the\
    \ children of any node. Here is simplified snippet of the source to demonstrate\
    \ how it functions:\n\n```typescript\nexport function eachChild<T>(node: ts.Node,\
    \ cbNode: (node: ts.Node) => T, cbNodeArray?: (nodes: ts.Node[]) => T): T {\n\
    \  if (!node) return;\n  switch (node.kind) {\n    case ts.SyntaxKind.BinaryExpression:\n\
    \      return cbNode((node as ts.BinaryExpression).left) ||\n             cbNode((node\
    \ as ts.BinaryExpression).operatorToken) ||\n             cbNode((node as ts.BinaryExpression).right);\n\
    \    case ts.SyntaxKind.IfStatement:\n      return cbNode((node as ts.IfStatement).expression)\
    \ ||\n             cbNode((node as ts.IfStatement).thenStatement) ||\n       \
    \      cbNode((node as ts.IfStatement).elseStatement);\n    // .... lots more\n\
    \  }\n}\n```\n\nHere is a function that prints the verbose AST of a node:\n```typescript\n\
    function printAllChildren(node: ts.Node, depth = 0) {\n  console.log(new Array(depth+1).join('----'),\
    \ ts.syntaxKindToName(node.kind), node.pos, node.end);\n  depth++;\n  node.getChildren().forEach(c=>\
    \ printAllChildren(c, depth));\n}\n```\n\n## AST Tip: SyntaxKind\n`SyntaxKind`\
    \ is defined as a `const enum`, here is a sample:\n\n```typescript\nexport const\
    \ enum SyntaxKind {\n  Unknown,\n  EndOfToken,\n  SingleLineCommentTrivia,\n \
    \ // ... LOTS more\n}\n```\nIt's a `const enum` (a concept we covered previously)\
    \ so that it gets *inlined* (e.g. `ts.SyntaxKind.EndOfToken` becomes `1`) and\
    \ we don't get a dereferencing cost when working with the AST. However the compiler\
    \ is compiled with `--preserveConstEnums` compiler flag so that the enum *is still\
    \ available at runtime*. So in JavaScript you can use `ts.SyntaxKind.EndOfToken`\
    \ if you want. Additionally you can convert these enum members to display strings\
    \ using the following function:\n\n```typescript\nexport function syntaxKindToName(kind:\
    \ ts.SyntaxKind) {\n  return (<any>ts).SyntaxKind[kind];\n}\n```\n"
  mdcn: "\n\n## 风格指南\n\n266\n\n## 常见错误\n\n在本节中，我们将解释用户在现实世界中会遇到的许多常见错误代码。\n\n### TS2304\n\
    示例：\n```typescript\nCannot find name ga\n```\n你可能在使用某个第三方库（例如 google analytics），但没有对其进行声明。TypeScript\
    \ 试图防止你出现*拼写错误*以及在*未声明变量的情况下使用变量*，因此对于任何由于你包含了某些外部库而*在运行时可用*的变量，你都需要进行显式说明（关于如何修复它请见后文）。\n\
    \n### TS2307\n示例：\n```typescript\nCannot find module 'underscore'\n```\n你可能作为*模块*在使用某个第三方库（例如\
    \ underscore）（关于模块请见后文），但没有它的它的环境声明文件（关于环境声明请见后文）。\n\n### TS1148\n示例：\n```typescript\n\
    Cannot compile modules unless the '--module' flag is provided\n```\n请查看关于模块的章节。\n\
    \n### 用于搜索索引\n你可以忽略此部分。本节专门用于搜索引擎索引。\n\n常见错误\n\n267\n\n人们倾向于使用并遇到错误的其他模块：\n```typescript\n\
    Cannot find name $\nCannot find module jquery\n```\n\n常见错误\n\n268\n\n## 编译器\n\n\
    TypeScript 编译源码位于 `src/compiler` 文件夹下。它分为以下几个关键部分：\n\n- 扫描器 (scanner.ts)\n- 解析器\
    \ (parser.ts)\n- 绑定器 (binder.ts)\n- 检查器 (checker.ts)\n- 发射器 (emitter.ts)\n\n这些部分在源码中都有各自独立的文件。这些部分将在本章后面介绍。\n\
    \n## BYOTS\n我们有一个名为“自带你的 TypeScript”（BYOTS）的项目，它可以让你更容易玩转编译器 API，例如通过暴露内部 API。你可以使用它将你本地应用的\
    \ TypeScript 版本全局暴露。\n\n## 语法 vs 语义\n仅仅因为某内容在*语法上*正确并不意味着它在*语义上*也是正确的。考虑以下这段 TypeScript\
    \ 代码，它虽然*语法上*有效，但在*语义上*是错误的：\n\n```typescript\nvar foo: number = \"not a number\"\
    ;\n```\nSemantic 在英语中是“意义”的意思。在脑中记住这个概念是有用的。\n\n## 处理概述\n以下是 TypeScript 编译器这些关键部分如何组合的快速回顾：\n\
    \n源代码 ~~ 扫描 ~~> 令牌流\n令牌流 ~~ 解析 ~~> AST\nAST ~~ 绑定 ~~> 符号 (Symbols)\n\n符号是 TypeScript*语义*系统的主要构建块。所示，符号是绑定的结果。符号将\
    \ AST 中的声明节点与其他认为构成了同一实体的声明连接起来。\n\n符号 + AST 是检查器用于*语义化*验证源码 AST 的依据\nAST + 符号\
    \ ~~ 检查器 ~~> 类型验证\n\n最后，当请求 JS 输出时：\nAST + 检查器 ~~ 发射器 ~~> JS\n\nTypeScript 编译器中还有几个文件为这些关键部分提供了工具，我们接下来将介绍。\n\
    \n## 文件：工具类\n`core.ts`：TypeScript 编译器使用的核心工具。其中一些重要的：\n- `let objectAllocator:\
    \ ObjectAllocator`：一个定义为全局单例的变量。它提供了 `getNodeConstructor` 的定义（当我们在查看解析器 / AST\
    \ 时会涵盖节点）、`getSymbolConstructor` 的定义（符号在绑定器中涵盖）、`getTypeConstructor` 的定义（类型在检查器中涵盖）、`getSignatureConstructor`\
    \ 的定义（签名是索引、调用和构造签名）。\n\n## 文件：关键数据结构\n`types.ts` 包含了整个编译器使用的关键数据结构和接口。以下是其中几个关键部分的示例：\n\
    \n| 名称 |  |\n| :--- | :--- |\n| SyntaxKind | AST 节点类型通过 `SyntaxKind` 枚举标识。 |\n\
    | TypeChecker | 这是 TypeChecker 提供的接口。 |\n| CompilerHost | `Program` 用于与 `System`\
    \ 交互。 |\n| Node | 一个 AST 节点。 |\n\n## 文件：系统\n`system.ts`。TypeScript 编译器与操作系统的所有交互都通过\
    \ `System` 接口进行。该接口及其实现（WScript 和 Node）都定义在 `system.ts` 中。你可以将其认为是*运行环境* (OE)。\n\
    \n现在你已经对主要文件有了概述，我们可以查看 `Program` 的概念。\n\n## Program\n定义在 `program.ts` 中。编译上下文（我们之前涵盖过的概念）在\
    \ TypeScript 编译器中表示为 `Program`。它由 `SourceFile` 和编译器选项组成。\n\n### CompilerHost 的使用\n\
    它与 OE 的交互机制：\n`Program -uses-> CompilerHost -uses-> System`\n\n设置 `CompilerHost`\
    \ 作为间接层的原因是它允许接口针对 `Program` 的需求进行更精细的调整，而不必担心 OE 的需求（例如，`Program` 不关心由 `System`\
    \ 提供的 `fileExists` 函数）。\n\n`System` 也有其他用户（例如测试）。\n\n## SourceFile\n程序提供了一个 API\
    \ 来获取源文件 `getSourceFiles(): SourceFile[]`。每个源文件都被表示为 AST 的根节点节点（称为 `SourceFile`）。\n\
    \n## Node\n抽象语法树 (AST) 的基本构建块。通常，一个 `Node` 代表语言。以下是构成一个节点的几个要素：\n- `kind`：节点的类型。\n\
    - `parent`：AST 中的父节点。\n- `pos`：节点的起始位置。\n- `end`：节点的结束位置。\n- `flags`：节点的标记位。\n\
    - `modifiers`：修饰符。\n- `file`：所属的文件。\n- `symbol`：关联的符号。\n- `type`：节点的类型。\n- `expression`：如果节点是表达式。\n\
    - `statement`：如果节点是语句。\n- `declaration`：如果节点是声明。\n- `children`：子节点列表。\n\n## SourceFile\n\
    每个 `SourceFile` 是 AST 的顶层节点。\n\n## AST Tip：访问节点\n有一个工具函数 `ts.forEachChild` 可以让你访问任何节点的所有子节点。这里是演示其功能的简化片段：\n\
    \n```typescript\nexport function eachChild<T>(node: ts.Node, cbNode: (node: ts.Node)\
    \ => T, cbNodeArray?: (nodes: ts.Node[]) => T): T {\n  if (!node) return;\n  switch\
    \ (node.kind) {\n    case ts.SyntaxKind.BinaryExpression:\n      return cbNode((node\
    \ as ts.BinaryExpression).left) ||\n             cbNode((node as ts.BinaryExpression).operatorToken)\
    \ ||\n             cbNode((node as ts.BinaryExpression).right);\n    case ts.SyntaxKind.IfStatement:\n\
    \      return cbNode((node as ts.IfStatement).expression) ||\n             cbNode((node\
    \ as ts.IfStatement).thenStatement) ||\n             cbNode((node as ts.IfStatement).elseStatement);\n\
    \    // .... 更多\n  }\n}\n```\n\n这里有一个打印节点详细 AST 的函数：\n```typescript\nfunction\
    \ printAllChildren(node: ts.Node, depth = 0) {\n  console.log(new Array(depth+1).join('----'),\
    \ ts.syntaxKindToName(node.kind), node.pos, node.end);\n  depth++;\n  node.getChildren().forEach(c=>\
    \ printAllChildren(c, depth));\n}\n```\n\n## AST Tip：SyntaxKind\n`SyntaxKind`\
    \ 定义为 `const enum`，这是一个示例：\n\n```typescript\nexport const enum SyntaxKind {\n\
    \  Unknown,\n  EndOfToken,\n  SingleLineCommentTrivia,\n  // ... 非常多\n}\n```\n\
    它是一个 `const enum`（我们之前涵盖过的概念），因此它会被*内联*（例如 `ts.SyntaxKind.EndOfToken` 变为 `1`），我们在处理\
    \ AST 时不会产生解引用开销。但是编译器使用 `--preserveConstEnums` 标志进行编译，因此该枚举*在运行时仍然可用*。因此在 JavaScript\
    \ 中，如果你需要，可以使用 `ts.SyntaxKind.EndOfToken`。此外，你可以使用以下函数将这些枚举成员转换为显示字符串：\n\n```typescript\n\
    export function syntaxKindToName(kind: ts.SyntaxKind) {\n  return (<any>ts).SyntaxKind[kind];\n\
    }\n```\n\n"
