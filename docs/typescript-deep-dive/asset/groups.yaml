    // Destructuring assignment\n\nvar {x, y, width, height} = rect;\n\nconsole.log(x,\
    \ y, width, height); // 0,10,15,20\n\nrect.x = 10;\n\n({x, y, width, height} =\
    \ rect); // assign to existing variables using outer parentheses\n\nconsole.log(x,\
    \ y, width, height); // 10,10,15,20\n\nHere in the absence of destructuring you\
    \ would have to pick off  x,y,width,height  one by\n\none from  rect .\n\nTo assign\
    \ an extracted variable to a new variable name you can do the following:\n\nDestructuring\n\
