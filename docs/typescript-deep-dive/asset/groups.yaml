    \ is of type  SymbolTable . Note that  SourceFile  is also\n\na  Node  (in fact\
    \ a root node in the AST).\n\nTIP: local functions are used heavily within the\
    \ TypeScript compiler. A local function very\n\nlikely uses variables from the\
    \ parent function (captured by closure). In the case of  bind  (a\n\nlocal function\
    \ within  bindSourceFile ) it (or function it calls) will setup the  symbolCount\
    \  and\n\n classifiableNames  among others, that are then stored on the returned\
    \  SourceFile .\n\n** bind **\n\nBind takes any  Node  (not just  SourceFile ).\
    \ First thing it does is assign the  node.parent  (if\n\n parent  variable has\
    \ been setup ... which again is something the binder does during its\n\nprocessing\
    \ within the  bindChildren  function), then hands off to  bindWorker  which does\
    \ the\n\n*heavy* lifting. Finally it calls  bindChildren  (a function that simply\
    \ stores the binder state e.g.\n\ncurrent  parent  within its function local vars,\
    \ then calls  bind  on each child, and then\n\nrestores the binder state). Now\
    \ let's look at  bindWorker  which is the more interesting\n\nfunction.\n\n**\
    \ bindWorker **\n\nThis function switches on  node.kind  (of type  SyntaxKind\
    \ ) and delegates work to the\n\nappropriate  bindFoo  function (also defined\
