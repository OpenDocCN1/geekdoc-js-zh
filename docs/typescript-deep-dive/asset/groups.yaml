  - "[PAGE 241]\n\nmodule App {\n\n export var foo = 123;\n\n}\n\nAnd  bar.ts :\n\n\
    module App {\n\n export var bar = foo + 456;\n\n}\n\nIf you fail to compile it\
    \ in correct order e.g. perhaps alphabetically  tsc bar.ts foo.ts  the\n\ncode\
    \ will compile fine but *silently* fail at runtime with  bar  set to  NaN .\n\n\
    **Fast compile**\n\nIf you use  --out  then single  .ts  files cannot be codegened\
    \ into single  .js  files in\n\nisolation without unnecessary hacks.  --out  essentially\
    \ forces a slower incremental build.\n\nAlso source maps are positionally sensitive\
    \ and run-length encoded so most of the map has\n\nto be rebuilt on a recompile\
    \ if you use source maps (which you should!). At high-10s to 100s\n\nkloc combined\
    \ it’s going to get slow.\n\n**Global Scope**\n\nSure you can use name spaces\
    \ but its still on  window  if you run it in the browser.\n\nNamespaces are just\
    \ an unnecessary workaround. Also  /// <reference  comments\n\nintroduce an global\
    \ context in *your code* that can get hard to maintain.\n\nAlso if your company\
    \ has several teams working independently and then someone decides\n\nto try integrating\
    \ two independently written apps there is a high likelihood of a name conflict.\n\
    \n**Hard to analyze**\n\nWe wish to provide more code analysis tools. These will\
    \ be easier if you provide us with the\n\ndependency chain (implicitly there on\
    \ a silver platter using external modules).\n\nAlso its not just the *dev tools*\
    \ that have a hard time making sense of the code. The next\n\nhuman needs to understand\
    \ a lot of the code base before they start to understand where\n\nstuff is actually\
    \ imported from. Using internal modules also makes code difficult to review in\n\
    \nisolation e.g. on github.\n\noutFile caution\n\n242"
- md: "\n## Hard to scale\n\nReally just a result of random runtime errors + slower\
    \ and slower compile times + difficulty in understanding someone else's code.\n\
    \n** _references.ts **\n\nIsn't supported by `tsconfig.json`:\n\nhttps://github.com/Microsoft/TypeScript/issues/2472#issuecomment-85330803\
    \ You'll have to manually sort the `files` array.\n\n## Code reuse\n\nIf you want\
    \ to reuse a portion of your code in another project, with all that *implicit*\
    \ dependency management, it will be difficult to port it over without potential\
    \ runtime errors.\n\n## Multiple Targets\n\nAlso if you decide to reuse your browser\
    \ code in something like nodejs (e.g. for *testing* APIs) you are going to need\
    \ to port it over to a module system or come up with ugly hacks to make the nodejs\
    \ `global` your new global scope (i.e. `window`).\n\n## Isolated Compile\n\nFiles\
    \ cannot be compiled in isolation. E.g. consider `a.ts`:\n\n```typescript\nmodule\
    \ M {\n  var s = t;\n}\n```\n\nWill have different output depending upon whether\
    \ there is a `b.ts` of the form:\n\n```typescript\nmodule M {\n  export var t\
    \ = 5;\n}\n```\n\noutFile caution\n\n```typescript\nvar t = 5;\n```\n\nSo `a.ts`\
    \ cannot be compiled in isolation.\n\n## Summary\n\n`--out` is really the job\
    \ of some build tool. And even such a build tool can benefit from the dependency\
    \ mentions provided by external modules. So we recommend you use external modules\
    \ and then let the build tool create a single `.js` for you if you so desire.\n\
    \nhttps://twitter.com/nycdotnet/status/613705850574778368\n\n![](img/416f69818aa79e3f1fe0e7869c118431_243_0.png)\n\
    \n## JQuery Tips\n\nNote: you need to install the `jquery.d.ts` file for these\
    \ tips\n\n## Quickly define a new plugin\n\nJust create `jquery-foo.d.ts` with:\n\
    \n```typescript\ninterface JQuery {\n  foo: any;\n}\n```\n\nAnd now you can use\
    \ `$('something').foo({whateverYouWant:'hello jquery plugin'})`\n\n## JQuery tips\n\
    \n## Static Constructors in TypeScript\n\nTypeScript `class` cannot have a static\
    \ constructor. However you can get the same effect easily by calling it yourself:\n\
    \n```typescript\nclass MyClass {\n  static initialize() {}\n}\n```\n\nMyClass.initialize();\n\
    \n## Singleton Pattern\n\nThe conventional singleton pattern is really something\
    \ that is used to overcome the fact that all code must be in a `class`.\n\n```typescript\n\
    class Singleton {\n  private static instance: Singleton;\n  private constructor()\
    \ {}\n  static getInstance() {\n    if (!Singleton.instance) {\n      Singleton.instance\
    \ = new Singleton();\n    }\n    return Singleton.instance;\n  }\n  someMethod()\
    \ {}\n}\n```\n\n`let instance = new Singleton()` // Error: constructor of 'Singleton'\
    \ is private\n`let instance = Singleton.getInstance()` // do something with the\
    \ instance\n\nHowever if you don't want lazy initialization you can instead use\
    \ a *namespace*.\n\n```typescript\nnamespace Singleton {\n  export function someMethod()\
    \ {}\n}\n```\n\nUsage\n\n`Singleton.someMethod();`\n\nSingleton is just a fancy\
    \ name for *module*.\n\n```typescript\n// someFile.ts\nexport function someMethod()\
    \ {}\n```\n\nUsage\n\n`import {someMethod} from \"./someFile\";`\n\n## Function\
    \ Parameters\n\nIf you have a function that takes too many parameters, or parameters\
    \ of the same type, then you might want to consider changing the function to take\
    \ an object instead. Consider the following function:\n\n```typescript\nfunction\
    \ foo(flagA: boolean, flagB: boolean) {}\n```\n\nWith such a function definition\
    \ it's quite easy to invoke incorrectly e.g. `foo(flagB, flagA)` and you would\
    \ get no help from the compiler. Instead, convert the function to take an object:\n\
    \n```typescript\nfunction foo(config: {flagA: boolean, flagB: boolean}) {\n  const\
    \ {flagA, flagB} = config;\n}\n```\n\nNow the function calls will look like `foo({flagA,\
    \ flagB})` which makes it easier to spot mistakes and code review. Note: If your\
    \ function is simple enough, and you don't expect much churn, then free to ignore\
    \ this advice.\n\n## Truthy\n\nJavaScript has a concept of `truthy` i.e. things\
    \ that evaluate like `true` in certain positions (e.g. `if` conditions and the\
    \ boolean `&&` `||` operators). The following things are truthy in JavaScript.\
    \ An example is any number other than `0` e.g.\n\n```javascript\nif (123) {\n\
    \  console.log('Any number other than 0 is truthy');\n}\n```\n\nSomething that\
    \ isn't truthy is called `falsy`. Here's a handy table for your reference.\n\n\
    | Variable Type | When it is falsy | When it is truthy |\n| :--- | :--- | :---\
    \ |\n| boolean | false | true |\n| string | '' (empty string) | any other string\
    \ |\n| number | 0, NaN | any other number |\n| null | always | never |\n| undefined\
    \ | always | never |\n| Object including empty ones like {}, [] | never | always\
    \ |\n\n## Being explicit\n\nThe `!!` pattern commonly helps to be explicit that\
    \ the intent is to treat the value as a `boolean` and convert it into a *true\
    \ boolean* (one of `true` | `false`). You can easily convert values to a true\
    \ boolean by prefixing it with `!!` e.g. `!!foo`. Its just `!` used *twice*. The\
    \ first `!` converts the variable (in this case `foo`) to a boolean but inverts\
    \ the logic (`truthy` -> `false`, `falsy` -> `true`). The second one toggles it\
    \ again to match the nature of the original object (e.g. *truthy* -> `false` ->\
    \ `true`). \n\nIt is common to use this pattern in lots of places e.g.\n\n// Direct\
    \ variables\n`const hasName = !!name;`\n\n// As members of objects\n```typescript\n\
    const someObj = {\n  hasName: !!name\n}\n```\n\n// e.g. ReactJS\n`{!!someName\
    \ && <div>{someName}</div>}`\n\n## Build Toggles\n\nIt is common to switch in\
    \ JavaScript projects based on where they are being run. You can do this quite\
    \ easily with webpack as its supports *dead code elimination* based on environment\
    \ variables.\n\nAdd different targets in your `package.json` scripts:\n\n```json\n\
    \"build:test\": \"webpack -p --config ./src/webpack.config.js\",\n\"build:prod\"\
    : \"webpack -p --define process.env.NODE_ENV='production' --config ./src/webpack.config.js\"\
    \n```\n\nOf course I am assuming you have `npm install webpack --save-dev`. Now\
    \ you can run `npm run build-test` etc.\n\nUsing this variable is super easy as\
    \ well:\n\n```typescript\n/**\n * This interface makes sure we don't miss adding\
    \ a property to both `prod` and `test`\n */\ninterface Config {\n  someItem: string;\n\
    }\n\n/**\n * We only export a single thing. The config.\n */\nexport let config:\
    \ Config;\n\n/**\n * `process.env.NODE_ENV` definition is driven from webpack\n\
    \ * The whole `else` block will be removed in emitted JavaScript\n * for a production\
    \ build\n */\nif (process.env.NODE_ENV === 'production') {\n  config = {\n   \
    \ someItem: 'prod'\n  }\n  console.log('Running in prod');\n} else {\n  config\
    \ = {\n    someItem: 'test'\n  }\n  console.log('Running in test');\n}\n```\n\n\
    ## Barrel\n\nA barrel is a way to rollup exports from several modules into a single\
    \ convenient module. The barrel itself is a module file that re-exports selected\
    \ exports of other modules.\n\nImagine the following class structure in a library:\n\
    \n```typescript\n// demo/foo.ts\nexport class Foo {}\n\n// demo/bar.ts\nexport\
    \ class Bar {}\n\n// demo/baz.ts\nexport class Baz {}\n```\n\nWithout a barrel,\
    \ a consumer would need three import statements:\n\n```typescript\nimport { Foo\
    \ } from '../demo/foo';\nimport { Bar } from '../demo/bar';\nimport { Baz } from\
    \ '../demo/baz';\n```\n\nYou can instead add a barrel `demo/index.ts` containing\
    \ the following:\n\n```typescript\n// demo/index.ts\nexport * from './foo'; //\
    \ re-export all of its exports\nexport * from './bar'; // re-export all of its\
    \ exports\nexport * from './baz'; // re-export all of its exports\n```\n\nNow\
    \ the consumer can import what it needs from the barrel:\n\n`import { Foo, Bar,\
    \ Baz } from '../demo'; // demo/index.ts is implied`\n\n**Named exports**\n\n\
    Instead of exporting * you can choose to export the module in a name. Eg. assume\
    \ that `baz.ts` has functions:\n"
  mdcn: "\n\n## 难以扩展\n\n这实际上是随机运行时错误 + 编译时间越来越慢 + 理解他人代码困难的共同结果。\n\n** _references.ts\
    \ **\n\n`tsconfig.json` 不支持它：\n\nhttps://github.com/Microsoft/TypeScript/issues/2472#issuecomment-85330803\
    \ 你必须手动对 `files` 数组进行排序。\n\n## 代码复用\n\n如果你想在另一个项目中复用部分代码，由于所有这些*隐式*依赖管理，在不产生潜在运行时错误的情况下将其迁移过去将非常困难。\n\
    \n## 多目标支持\n\n此外，如果你决定在类似 nodejs 的环境中复用你的浏览器代码（例如用于*测试* API），你将需要将其迁移到模块系统，或者想出拙劣的黑科技（hacks）让\
    \ nodejs 的 `global` 成为你的新全局作用域（即 `window`）。\n\n## 隔离编译\n\n文件无法孤立地编译。例如，考虑 `a.ts`：\n\
    \n```typescript\nmodule M {\n  var s = t;\n}\n```\n\n其输出将取决于是否存在形式如下的 `b.ts`：\n\
    \n```typescript\nmodule M {\n  export var t = 5;\n}\n```\n\noutFile 警告\n\n```typescript\n\
    var t = 5;\n```\n\n因此 `a.ts` 无法孤立地编译。\n\n## 总结\n\n`--out` 实际上是某些构建工具的工作。即使是这样的构建工具也可以从外部模块提供的依赖关系中获益。因此，我们建议你使用外部模块，如果你有需要，让构建工具为你创建一个单一的\
    \ `.js` 文件。\n\nhttps://twitter.com/nycdotnet/status/613705850574778368\n\n![](img/416f69818aa79e3f1fe0e7869c118431_243_0.png)\n\
    \n## JQuery 提示\n\n注意：你需要安装 `jquery.d.ts` 文件才能使用这些提示\n\n## 快速定义新插件\n\n只需创建 `jquery-foo.d.ts`\
    \ 并写入：\n\n```typescript\ninterface JQuery {\n  foo: any;\n}\n```\n\n现在你就可以使用 `$('something').foo({whateverYouWant:'hello\
    \ jquery plugin'})` 了\n\n## JQuery 提示\n\n## TypeScript 中的静态构造函数\n\nTypeScript\
    \ `class` 不能有静态构造函数。但你可以通过手动调用它来轻松获得相同的效果：\n\n```typescript\nclass MyClass {\n\
    \  static initialize() {}\n}\n```\n\nMyClass.initialize();\n\n## 单例模式\n\n传统的单例模式实际上是为了解决所有代码都必须放在\
    \ `class` 中的这一事实。\n\n```typescript\nclass Singleton {\n  private static instance:\
    \ Singleton;\n  private constructor() {}\n  static getInstance() {\n    if (!Singleton.instance)\
    \ {\n      Singleton.instance = new Singleton();\n    }\n    return Singleton.instance;\n\
    \  }\n  someMethod() {}\n}\n```\n\n`let instance = new Singleton()` // Error：'Singleton'\
    \ 的构造函数是私有的\n`let instance = Singleton.getInstance()` // 对实例进行操作\n\n然而，如果你不想懒性初始化，可以使用*namespace*（命名空间）。\n\
    \n```typescript\nnamespace Singleton {\n  export function someMethod() {}\n}\n\
    ```\n\n用法\n\n`Singleton.someMethod();`\n\nSingleton 只是*module*（模块）的一个花丽名称。\n\n\
    ```typescript\n// someFile.ts\nexport function someMethod() {}\n```\n\n用法\n\n\
    `import {someMethod} from \"./someFile\";`\n\n## 函数参数\n\n如果你有一个接收参数过多的函数，或者具有相同类型的参数，那么你可能考虑将函数更改为接收一个对象。考虑以下函数：\n\
    \n```typescript\nfunction foo(flagA: boolean, flagB: boolean) {}\n```\n\n使用这样的函数定义，很容易出现错误的调用。考虑将函数更改为接收一个对象：\n\
    \n```typescript\nfunction foo({flagA, flagB}: {flagA: boolean, flagB: boolean})\
    \ {}\n```\n\n这样你就可以很清晰地调用：`foo({flagA: true, flagB: false})`\n\n## 真值判断 (Truthy)\n\
    \nJavaScript 有一个真值（truthy）概念，某些值在布尔上下文中被评估为真。\n\n| 表达式 | 真值 |\n| :--- | :--- |\n\
    | `false` | 假 |\n| `0` | 假 |\n| `\"\"` | 假 |\n| `null` | 假 |\n| `undefined` |\
    \ 假 |\n| `NaN` | 假 |\n| `[]` | 真 |\n| `{}` | 真 |\n| `1` | 真 |\n| `\"hello\"` |\
    \ 真 |\n\n以下值不为真值（falsy）：\n\n| 表达式 | 假 |\n| :--- | :--- |\n| `false` | 是 |\n| `0`\
    \ | 是 |\n| `\"\"` | 是 |\n| `null` | 是 |\n| `undefined` | 是 |\n| `NaN` | 是 |\n\n"
