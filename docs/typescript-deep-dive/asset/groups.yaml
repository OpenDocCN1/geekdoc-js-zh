  - "[PAGE 136]\n\n**Const Enums**\n\nIf you have an enum definition like the following:\n\
    \nenum Tristate {\n\n False,\n\n True,\n\n Unknown\n\n}\n\nvar lie = Tristate.False;\n\
    \nThe line  var lie = Tristate.False  is compiled to the JavaScript  var lie =\
    \ Tristate.False \n\n(yes, output is same as input). This means that at execution\
    \ the runtime will need to lookup\n\n Tristate  and then  Tristate.False . To\
    \ get a performance boost here you can mark the\n\n enum  as a  const enum . This\
    \ is demonstrated below:\n\nconst enum Tristate {\n\n False,\n\n True,\n\n Unknown\n\
    \n}\n\nvar lie = Tristate.False;\n\ngenerates the JavaScript:\n\nvar lie = 0;\n\
    \ni.e. the compiler:\n\n1\\. *Inlines* any usages of the enum ( 0  instead of\
    \  Tristate.False ).\n\n2\\. Does not generate any JavaScript for the enum definition\
    \ (there is no  Tristate \n\nvariable at runtime) as its usages are inlined.\n\
    \n**Const enum preserveConstEnums**\n\nInlining has obvious performance benefits.\
    \ The fact that there is no  Tristate  variable at\n\nruntime is simply the compiler\
    \ helping you out by not generating JavaScript that is not\n\nactually used at\
    \ runtime. However you might want the compiler to still generate the\n\nJavaScript\
    \ version of the enum definition for stuff like *number to string* or *string\
    \ to number*\n\nlookups as we saw. In this case you can use the compiler flag\
    \  --preserveConstEnums  and it\n\nwill still generate the  var Tristate  definition\
    \ so that you can use  Tristate\\[\"False\"\\]  or\n\n Tristate\\[0\\]  manually\
    \ at runtime if you want. This does not impact *inlining* in any way.\n\nEnums\n\
    \n137"
- md: "\n## Enum with static functions\n\nYou can use the declaration `enum + namespace`\
    \ merging to add static methods to an enum.\n\nThe following demonstrates an example\
    \ where we add a static member `isBusinessDay` to an enum `Weekday`:\n\n```typescript\n\
    enum Weekday {\n  Monday,\n  Tuesday,\n  Wednesday,\n  Thursday,\n  Friday,\n\
    \  Saturday,\n  Sunday\n}\n\nnamespace Weekday {\n  export function isBusinessDay(day:\
    \ Weekday) {\n    switch (day) {\n      case Weekday.Saturday:\n      case Weekday.Sunday:\n\
    \        return false;\n      default:\n        return true;\n    }\n  }\n}\n\n\
    const mon = Weekday.Monday;\nconst sun = Weekday.Sunday;\n\nconsole.log(Weekday.isBusinessDay(mon));\
    \ // true\nconsole.log(Weekday.isBusinessDay(sun)); // false\n```\n\n# Enums\n\
    \n## lib.d.ts\n\n### Example Usage\n- Inside look\n- Modifying Native types\n\
    - Using custom lib.d.ts\n\n| Compiler target effect on lib.d.ts | lib option |\n\
    | :--- | :--- |\n| **lib.d.ts** | |\n\nA special declaration file `lib.d.ts` ships\
    \ with every installation of TypeScript. This file contains the ambient declarations\
    \ for various common JavaScript constructs present in JavaScript runtimes and\
    \ the DOM.\n\nThis file is automatically included in the compilation context of\
    \ a TypeScript project. The objective of this file is to make it easy for you\
    \ to start writing *type checked* JavaScript code.\n\nYou can exclude this file\
    \ from the compilation context by specifying the `--noLib` compiler command line\
    \ flag (or `\"noLib\": true` in `tsconfig.json`).\n\n### Example Usage\n\nAs always\
    \ let's look at examples of this file being used in action:\n\n```typescript\n\
    var foo = 123;\nvar bar = foo.toString();\n```\n\nThis code type checks fine *because*\
    \ the `toString` function is defined in `lib.d.ts` for all JavaScript objects.\n\
    \nIf you use the same sample code with the `noLib` option you get a type check\
    \ error:\n\n```typescript\nvar foo = 123;\nvar bar = foo.toString(); // ERROR:\
    \ Property 'toString' does not exist on type 'number'.\n```\n\nSo now that you\
    \ understand the importance of `lib.d.ts` what does its contents look like? We\
    \ examine that next.\n\n### lib.d.ts inside look\n\nThe contents of `lib.d.ts`\
    \ are primarily a bunch of *variable* declarations e.g. `window`, `document`,\
    \ `math` and a bunch of similar *interface* declarations e.g. `Window`, `Document`,\
    \ `Math`.\n\nThe simplest way to discover what is what is to type in code *that\
    \ you know works* e.g. `Math.floor` and then F12 (go to definition) using your\
    \ IDE (atom-typescript has great support for this).\n\nLet's look at a sample\
    \ *variable* declaration, e.g. `window` is defined as:\n\n```typescript\ndeclare\
    \ var window: Window;\n```\n\nThat is just a simple `declare var` followed by\
    \ the variable name (here `window`) and an interface for a type annotation (here\
    \ the `Window` interface). These variables generally point to some global *interface*\
    \ e.g. here is a small sample of the (actually quite massive) `Window` interface:\n\
    \n```typescript\ninterface Window extends EventTarget, WindowTimers, WindowSessionStorage,\
    \ WindowLocalStorage, WindowConsole, GlobalEventHandlers, IDBEnvironment, WindowBase64\
    \ {\n  animationStartTime: number;\n  applicationCache: ApplicationCache;\n  clientInformation:\
    \ Navigator;\n  closed: boolean;\n  crypto: Crypto;\n  // so on and so forth...\n\
    }\n```\n\nYou can see that here is a *lot* of type information in these interfaces.\
    \ In the absence of TypeScript *you* would need to keep this in *your* head. Now\
    \ you can offload that knowledge on the compiler with easy access to it using\
    \ things like `intellisense`.\n\nThere is a good reason for using *interfaces*\
    \ for these globals. It allows you to *add additional* *properties* to these globals\
    \ *without* a need to change `lib.d.ts`. We will cover this concept next.\n\n\
    ## Modifying native types\n\nSince an `interface` in TypeScript is open ended\
    \ this means that you can just add members to the interfaces declared in `lib.d.ts`\
    \ and TypeScript will pick up on the additions. Note that you need to make these\
    \ changes in a *global module* for these interfaces to get associated with `lib.d.ts`.\
    \ We even recommend creating a special file called `globals.d.ts` for this purpose.\n\
    \nHere are a few example cases where we add stuff to `window`, `Math`, `Date`:\n\
    \n![img/416f69818aa79e3f1fe0e7869c118431_140_0.png](img/416f69818aa79e3f1fe0e7869c118431_140_1.png)\n\
    \n### Example window **\n\nJust add stuff to the `Window` interface e.g.:\n\n\
    ```typescript\ninterface Window {\n  helloWorld(): void;\n}\n```\n\nThis will\
    \ allow you to use it in a *type safe* manner:\n\n```typescript\n// Add it at\
    \ runtime\nwindow.helloWorld = () => console.log('hello world');\n\n// Call it\n\
    window.helloWorld();\n\n// Misuse it and you get an error:\n```\n\n### Example\
    \ Math **\n\nThis allows you to do stuff like the following in a *type safe* manner:\n\
    \n```typescript\nvar today = Date.today();\nvar todayAfter1second = today.addMilliseconds(1000);\n\
    ```\n\n### Example Date **\n\nIf you look inside `lib.d.ts` you will find:\n\n\
    ```typescript\ndeclare var Date: DateConstructor;\n```\n\nThe interface `DateConstructor`\
    \ is similar to what we saw for `Math` it contains:\n\n```typescript\ninterface\
    \ DateConstructor {\n  /** Gets a date that is the current date. The time is set\
    \ to the start of the day (00:00 or 12:00 AM) */\n  today(): Date;\n  // ... so\
    \ on and so forth\n}\n\ninterface Date {\n  /** Adds the specified number of milliseconds\
    \ to this instance. */\n  addMilliseconds(milliseconds: number): Date;\n  // ...\
    \ so on and so forth\n}\n```\n```\n\n### Example string **\n\nIf you look inside\
    \ `lib.d.ts` for string you will find stuff similar to what we saw for `Date`\
    \ (String global variable, StringConstructor interface, String interface). One\
    \ thing of note though is that the `String` interface impacts *literals* as well\
