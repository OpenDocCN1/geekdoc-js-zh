    \ + point.x, this.y + point.y);\n\n };\n\n return Point;\n\n})();\n\nThis is a\
    \ fairly idiomatic traditional JavaScript class pattern now as a first class language\n\
    \nconstruct.\n\n**Inheritance**\n\nClasses\n\n24"
