  - "[PAGE 275]\n\n**Trivia**\n\nTrivia (called that because it's  trivial ) represent\
    \ the parts of the source text that are\n\nlargely insignificant for normal understanding\
    \ of the code. For example; whitespace,\n\ncomments, and even conflict markers.\
    \ Trivia is *not stored* in the AST (to keep it lightweight).\n\nHowever it can\
    \ be fetched *on demand* using a few  ts.\\*  APIs.\n\nBefore we show them you\
    \ need to understand the following:\n\n**Trivia Ownership**\n\nIn General:\n\n\
    A token owns any trivia after it on the *same* line *upto* the next token.\n\n\
    Any comment *after that line* is associated with the following token.\n\nFor leading\
    \ and ending comments in a file:\n\nThe first token in the source file gets all\
    \ the initial trivia.\n\nThe last sequence of trivia in the file is tacked onto\
    \ the end-of-file token, which\n\notherwise has zero width.\n\n**Trivia APIs**\n\
    \nFor most basic uses, comments are the \"interesting\" trivia. The comments that\
    \ belong to a\n\nNode can be fetched through the following functions:\n\n**Function**\n\
    \n**Description**\n\n ts.getLeadingCommentRanges \n\nGiven the source text and\
    \ position within that text,\n\nreturns ranges of comments between the first line\n\
    \nbreak following the given position and the token itself\n\n(probably most useful\
    \ with  ts.Node.getFullStart ).\n\n ts.getTrailingCommentRanges \n\nGiven the\
    \ source text and position within that text,\n\nreturns ranges of comments until\
    \ the first line break\n\nfollowing the given position (probably most useful with\n\
    \n ts.Node.getEnd ).\n\nAs an example, imagine this portion of a source file:\n\
    \ndebugger;/\\*hello\\*/\n\n //bye\n\n /\\*hi\\*/ function\n\nTrivia\n\n276"
