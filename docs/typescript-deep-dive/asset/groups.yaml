  - "[PAGE 97]\n\nimport foo = require('foo');\n\nexport function loadFoo() {\n\n\
    \ // This is lazy loading \\`foo\\` and using the original module \\*only\\* as\
    \ a type annot\n\nation\n\n require(\\['foo'\\], (\\_foo: typeof foo) => {\n\n\
    \ // Now use \\`\\_foo\\` as a variable instead of \\`foo\\`.\n\n });\n\n}\n\n\
    This pattern is commonly used:\n\nin web apps where you load certain JavaScript\
    \ on particular routes,\n\nin node applications where you only load certain modules\
    \ if needed to speed up\n\napplication bootup.\n\n**Use case: Breaking Circular\
    \ dependencies**\n\nSimilar to the lazy loading use case certain module loaders\
    \ (commonjs/node and\n\namd/requirejs) don't work well with circular dependencies.\
    \ In such cases it is useful to have\n\n*lazy loading* code in one direction and\
    \ loading the modules upfront in the other direction.\n\n**Use case: Ensure Import**\n\
    \nSometimes you want to load a file just for the side effect (e.g. the module\
    \ might register itself\n\nwith some library like CodeMirror addons etc.). However\
    \ if you just do a  import/require  the\n\ntranspiled JavaScript will not contain\
    \ a dependency on the module and your module loader\n\n(e.g. webpack) might completely\
    \ ignore the import. In such cases you can use a\n\n ensureImport  variable to\
    \ ensure that the compiled JavaScript takes a dependency on the\n\nmodule e.g.:\n\
    \nimport foo = require('./foo');\n\nimport bar = require('./bar');\n\nimport bas\
    \ = require('./bas');\n\nconst ensureImport: any =\n\n foo\n\n || bar\n\n || bas;\n\
    \nThe key advantage of using  import/require  instead of just  var/require  is\
    \ that you get file\n\npath completion / checking / goto definition navigation\
    \ etc.\n\nFile Module Details\n\n98"
