  - "[PAGE 268]\n\n**Compiler**\n\nThe typescript compiler source is located under\
    \ the  src/compiler  folder.\n\nIt is split into the follow key parts:\n\nScanner\
    \ ( scanner.ts )\n\nParser ( parser.ts )\n\nBinder ( binder.ts )\n\nChecker (\
    \ checker.ts )\n\nEmitter ( emitter.ts )\n\nEach of these get their own unique\
    \ files in the source. These parts will be explained later on\n\nin this chapter.\n\
    \n**BYOTS**\n\nWe have a project called Bring Your Own TypeScript (BYOTS) which\
    \ makes it easier to play\n\naround with the compiler API e.g. by exposing internal\
    \ APIs. You can use it to expose your\n\nlocal app's version of TypeScript globally.\n\
    \n**Syntax vs. Semantics**\n\nJust because something is *syntactically* correct\
    \ doesn't mean it is *semantically* correct.\n\nConsider the following piece of\
    \ TypeScript code which although *syntactically* valid is\n\n*semantically* wrong\n\
    \nvar foo: number = \"not a number\";\n\n Semantic  means \"meaning\" in English.\
    \ This concept is useful to have in your head.\n\n**Processing Overview**\n\n\
    The following is a quick review of how these key parts of the TypeScript compiler\
    \ compose:\n\nSourceCode ~~ scanner ~~> Token Stream\n\nTypeScript Compiler Internals\n\
    \n269"
