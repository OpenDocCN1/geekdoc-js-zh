    \ => Promise<T>` 为你节省了几个击键：\n\n```typescript\ntype LoadUsersResponse = {\n  users:\
    \ {\n    name: string;\n    email: string;\n  }[];\n}\n\nfunction loadUsers()\
    \ {\n  return getJSON<LoadUsersResponse>({ url: 'https://example.com/users' });\n\
    }\n```\n\n此外，将 `Promise<T>` 作为返回值绝对比 `Promise<any>` 等替代方案好。\n\n## TypeScript 中的类型推断\n\
    \nTypeScript 可以根据一些简单的规则推断（然后检查）变量的类型。因为这些规则很简单，你可以训练你的大脑来识别安全/不安全的代码（这和我同事们发生得很快）。\n\
    \n“类型流动”只是我脑海中想象的类型信息流动方式。\n\n### 定义\n\n变量的类型是通过定义推断的。\n\n```typescript\nlet foo\
    \ = 123; // foo 是一个 `number`\nlet bar = \"Hello\"; // bar 是一个 `string`\nfoo =\
    \ bar; // 错误：不能将 `string` 赋值给 `number`\n```\n\n这是一个类型从右向左流动的示例。\n\n### 返回\n\n\
    返回类型通过返回语句推断，例如下面的函数被推断为返回一个数字。\n\n```typescript\nfunction add(a: number, b: number)\
    \ {\n  return a + b;\n}\n```\n\n这是一个类型从底部流出的示例。\n\n### 赋值\n\n函数的参数/返回类型也可以通过赋值推断，例如在这里我们说\
    \ `foo` 是一个 `Adder`，这使得 `a` 和 `b` 的类型推断为 `number`。\n\n```typescript\ntype Adder\
    \ = (a: number, b: number) => number;\nlet foo: Adder = (a, b) => a + b;\n```\n\
    \n这一事实可以通过下面的代码证明，它会像你预期的那样抛出错误：\n\n```typescript\ntype Adder = (a: number, b:\
    \ number) => number;\nlet foo: Adder = (a, b) => {\n  a = \"hello\"; // 错误：不能将\
    \ `string` 赋值给 `number`\n  return a + b;\n}\n```\n\n这是一个类型从左向右流动的示例。\n\n如果你为回调参数创建一个函数，同样的*赋值*风格类型推断也有效。毕竟，参数\
    \ -> 参数只是另一种形式的变量赋值。\n\n```typescript\ntype Adder = (a: number, b: number) =>\
    \ number;\nfunction iTakeAnAdder(adder: Adder) {\n  return adder(1, 2);\n}\n\n\
    iTakeAnAdder((a, b) => {\n  // a = \"hello\"; // 会报错：不能将 `string` 赋值给 `number`\n\
    \  return a + b;\n})\n```\n\n### 结构化\n\n这些简单的规则在存在结构化（对象字面量）时也有效。例如，在下面的情况下，`foo`\
    \ 的类型被推断为 `{a:number, b:number}`：\n\n```typescript\nlet foo = {\n  a: 123,\n \
    \ b: 456\n};\nfoo.a = \"hello\"; // 会报错：不能将 `string` 赋值给 `number`\n```\n\n数组也是如此：\n\
    \n```typescript\nconst bar = [1, 2, 3];\nbar[0] = \"hello\"; // 会报错：不能将 `string`\
    \ 赋值给 `number`\n```\n\n当然还有嵌套：\n\n```typescript\nlet foo = {\n  a: [1, 2, 4]\n\
    };\nfoo.a[0] = 'hello'; // 会报错：不能将 `string` 赋值给 `number`\n```\n\n### 解构\n\n当然，它们也适用于解构，包括对象：\n\
    \n```typescript\nlet foo = {\n  a: 123,\n  b: 456\n};\nlet {a} = foo;\na = \"\
    hello\"; // 会报错：不能将 `string` 赋值给 `number`\n```\n\n以及数组：\n\n```typescript\nconst\
    \ bar = [1, 2];\nlet [a, b] = bar;\na = \"hello\"; // 会报错：不能将 `string` 赋值给 `number`\n\
    ```\n\n如果函数参数可以被推断，那么它的解构属性也可以被推断。\n\n```typescript\ntype Adder = (numbers: {\
    \ a: number, b: number }) => number;\nfunction iTakeAnAdder(adder: Adder) {\n\
    \  return adder({ a: 1, b: 2 });\n}\niTakeAnAdder(({a, b}) => { // `a` 和 `b` 的类型被推断\n\
    \  return a + b;\n})\n```\n\n### 类型守卫\n\n我们已经看到类型守卫如何帮助更改和缩小类型（特别是）。\n\n### 这里的参数\n\
