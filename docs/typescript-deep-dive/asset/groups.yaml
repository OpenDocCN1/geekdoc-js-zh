- md: "\nCode examples above require ES6 target, however it could work with ES5 target\
    \ as well if\n\ntarget JS engine supports Symbol.iterator . This can be achieved\
    \ by using ES6 lib with\n\nES5 target (add es6.d.ts to your project) to make it\
    \ compile. Compiled code should work in\n\nnode 4+, Google Chrome and in some\
    \ other browsers.\n\nIterators\n\n## Template Strings\n\nSyntactically these are\
    \ strings that use backticks ( i.e. \\` ) instead of single (') or double (\"\
    )\n\nquotes. The motivation of Template Strings is three fold:\n\n- String Interpolation\n\
    - Multiline Strings\n- Tagged Templates\n\n### String Interpolation\n\nAnother\
    \ common use case is when you want to generate some string out of some static\n\
    \nstrings + some variables. For this you would need some *templating logic* and\
    \ this is where\n\n*template strings* get their name from. Here's how you would\
    \ potentially generate an html\n\nstring previously:\n\n```javascript\nvar lyrics\
    \ = 'Never gonna give you up';\nvar html = '<div>' + lyrics + '</</div>>';\n```\n\
    \nNow with template strings you can just do:\n\n```javascript\nvar lyrics = 'Never\
    \ gonna give you up';\nvar html = `<div>${lyrics}</div>\\`;\n```\n\nNote that\
    \ any placeholder inside the interpolation ( ${  and  } ) is treated as a JavaScript\n\
    \nexpression and evaluated as such e.g. you can do fancy math.\n\n```javascript\n\
    console.log(`1 and 1 make ${1 + 1}`);\n```\n\n### Multiline Strings\n\nEver wanted\
    \ to put a newline in a JavaScript string? Perhaps you wanted to embed some\n\n\
    lyrics? You would have needed to *escape the literal newline* using our favorite\
    \ escape\n\ncharacter \\\\ , and then put a new line into the string manually\
    \ \\\\n  at the next line. This is\n\nshown below:\n\n```javascript\nvar lyrics\
    \ = \"Never gonna give you up \\\\\n\\\\nNever gonna let you down\";\n```\n\n\
    With TypeScript you can just use a template string:\n\n```javascript\nvar lyrics\
    \ = `Never gonna give you up\nNever gonna let you down\\`;\n```\n\n### Tagged\
    \ Templates\n\nYou can place a function (called a  tag ) before the template string\
    \ and it gets the\n\nopportunity to pre process the template string literals plus\
    \ the values of all the placeholder\n\nexpressions and return a result. A few\
    \ notes:\n\n- All the static literals are passed in as an array for the first\
    \ argument.\n- All the values of the placeholders expressions are passed in as\
    \ the remaining\n\narguments. Most commonly you would just use rest parameters\
    \ to convert these into an\n\narray as well.\n\nHere is an example where we have\
    \ a tag function (named htmlEscape ) that escapes the\n\nhtml from all the placeholders:\n\
    \n```javascript\nvar say = \"a bird in hand > two in the bush\";\nvar html = htmlEscape\
    \ `<div> I would just like to say : ${say}</div>\\`;\n\n// a sample tag function\n\
    function htmlEscape(literals, ...placeholders) {\n  let result = \"\";\n  // interleave\
    \ the literals with the placeholders\n  for (let i = 0; i < placeholders.length;\
    \ i++) {\n    result += literals[i];\n    result += placeholders[i]\n      .replace(/&/g,\
    \ '&amp;')\n      .replace(/\"/g, '&quot;')\n      .replace(/'/g, '&#39;')\n \
    \     .replace(/</g, '&lt;')\n      .replace(/>/g, '&gt;');\n  }\n  // add the\
    \ last literal\n  result += literals[literals.length - 1];\n  return result;\n\
    }\n```\n\n### Generated JS\n\nFor pre ES6 compile targets the code is fairly simple.\
    \ Multiline strings become escaped\n\nstrings. String interpolation becomes *string\
    \ concatenation*. Tagged Templates become\n\nfunction calls.\n\n## Summary\n\n\
    Multiline strings and string interpolation are just great things to have in any\
    \ language. It's\n\ngreat that you can now use them in your JavaScript (thanks\
    \ TypeScript!). Tagged templates\n\nallow you to create powerful string utilities.\n\
    \n![](img/416f69818aa79e3f1fe0e7869c118431_62_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_62_1.png)\n\
    \n## Promise\n\nThe Promise class is something that exists in many modern JavaScript\
    \ engines and can be\n\neasily polyfilled. The main motivation for promises is\
    \ to bring synchronous style error\n\nhandling to Async / Callback style code.\n\
    \n### Callback style code\n\nIn order to fully appreciate promises let's present\
    \ a simple sample that proves the difficulty of\n\ncreating reliable Async code\
    \ with just callbacks. Consider the simple case of authoring an\n\nasync version\
    \ of loading JSON from a file. A synchronous version of this can be quite\n\n\
    simple:\n\n```javascript\nimport fs = require('fs');\n\nfunction loadJSONSync(filename:\
    \ string) {\n  return JSON.parse(fs.readFileSync(filename));\n}\n\n// good json\
    \ file\nconsole.log(loadJSONSync('good.json'));\n\n// non-existent file, so fs.readFileSync\
    \ fails\ntry {\n  console.log(loadJSONSync('absent.json'));\n}\ncatch (err) {\n\
    \  console.log('absent.json error', err.message);\n}\n\n// invalid json file i.e.\
    \ the file exists but contains invalid JSON so JSON.parse fails\ntry {\n  console.log(loadJSONSync('invalid.json'));\n\
    }\ncatch (err) {\n  console.log('invalid.json error', err.message);\n}\n```\n\n\
    There are three behaviors of this simple loadJSONSync function, a valid return\
    \ value, a file\n\nsystem error or a JSON.parse error. We handle the errors with\
    \ a simple try/catch as you are\n\nused to when doing synchronous programming\
    \ in other languages. Now let's make a good\n\nPromise\n\nasync version of such\
    \ a function. A decent initial attempt with a trivial error checking logic\n\n\
    would be as follows:\n\n```javascript\nimport fs = require('fs');\n\n// A decent\
    \ initial attempt .... but not correct. We explain the reasons below\nfunction\
    \ loadJSON(filename: string, cb: (error: Error, data: any) => void) {\n  fs.readFile(filename,\
    \ function (err, data) {\n    if (err) cb(err);\n    else cb(null, JSON.parse(data));\n\
    \  });\n}\n```\n\nSimple enough, it takes a callback, passes any file system errors\
    \ to the callback. If no file\n\nsystem errors, it returns the JSON.parse result.\
    \ A few points to keep in mind when working\n\nwith async functions based on callbacks\
    \ are:\n\n1. Never call the callback twice.\n2. Never throw an error.\n\nThis\
    \ simple function however fails to accommodate point two. In fact JSON.parse\n\
    \nthrows an error the callback never gets and the application\n\ncrashes. This\
    \ is demonstrated in the example below:\n\n```javascript\nimport fs = require('fs');\n\
    // A decent initial attempt .... but not correct\nfunction loadJSON(filename:\
    \ string, cb: (error: Error, data: any) => void) {\n  fs.readFile(filename, function\
    \ (err, data) {\n    if (err) cb(err);\n    else cb(null, JSON.parse(data));\n\
    \  });\n}\n```\n\nA naive attempt at fixing this would be to wrap JSON.parse in\
    \ a try catch as shown in the\n\nbelow example:\n\n```javascript\nimport fs =\
    \ require('fs');\n\n// A better attempt ... still not correct\nfunction loadJSON(filename:\
    \ string, cb: (error: Error) => void) {\n  fs.readFile(filename, function (err,\
    \ data) {\n    if (err) {\n      cb(err);\n    } else {\n      try {\n       \
    \ cb(null, JSON.parse(data));\n      } catch (err) {\n        cb(err);\n     \
    \ }\n    }\n  });\n}\n```\n\nHowever there is a subtle bug in this code. If the\
    \ callback ( cb ), and not JSON.parse ,\n\nthrows an error, since we wrapped it\
    \ in a try catch , the catch executes and we call the\n\ncallback again i.e. the\
    \ callback gets twice! This is demonstrated in the example below:\n\n```javascript\n\
    import fs = require('fs');\n\nfunction loadJSON(filename: string, cb: (error:\
    \ Error) => void) {\n  fs.readFile(filename, function (err, data) {\n    if (err)\
    \ {\n      cb(err);\n    } else {\n      try {\n        cb(null, JSON.parse(data));\n\
    \      } catch (err) {\n        cb(err);\n      }\n    }\n  });\n}\n\n// a good\
    \ file but a bad callback ... gets called again!\nloadJSON('good.json', function\
    \ (err, data) {\n  console.log('our callback called');\n  if (err) {\n    console.log('Error:',\
    \ err.message);\n  } else {\n    // let's simulate an error by trying to access\
    \ a property on an undefined\n\nvariable\n    var foo;\n    // The following code\
    \ throws `Error: Cannot read property 'bar' of undefined`\n\n    console.log(foo.bar);\n\
    \  }\n});\n```\n\n$ node asyncbadcatchdemo.js\n\nour callback called\nour callback\
    \ called\n\nError: Cannot read property 'bar' of undefined\n\nThis is because\
    \ our loadJSON function wrongfully wrapped the callback in a try block. There\
    \ is a simple lesson to remember here.\n\nSimple lesson: Contain all your sync\
    \ code in a try catch, except when you call the\n\ncallback.\n\nFollowing this\
    \ simple lesson, we have a fully functional async version of loadJSON as shown\n\
    \nbelow:\n"
  mdcn: "\n上面的代码示例需要 ES6 目标，但如果目标 JS 引擎支持 `Symbol.iterator`，它也可以适用于 ES5 目标。这可以通过在\
    \ ES5 目标上使用 ES6 库（向你的项目添加 `es6.d.ts`）来实现编译。编译后的代码应该可以在 node 4+、Google Chrome 以及其他浏览器中运行。\n\
    \n迭代器\n\n## 模板字符串\n\n在语法上，这些字符串使用反引号（即 \\` ）而不是单引号（'）或双引号（\"）。模板字符串的初衷有三点：\n\n\
    - 字符串插值（String Interpolation）\n- 多行字符串（Multiline Strings）\n- 标签模板（Tagged Templates）\n\
    \n### 字符串插值\n\n另一个常见的用例是当你想根据某些静态字符串 + 某些变量生成一些字符串时。为此，你需要一些*模板逻辑*，而*模板字符串*正是由此得名的。以下是你以前可能是如何生成\
    \ html 字符串的：\n\n```javascript\nvar lyrics = 'Never gonna give you up';\nvar html\
    \ = '<div>' + lyrics + '</</div>>';\n```\n\n现在使用模板字符串，你只需要这样做：\n\n```javascript\n\
    var lyrics = 'Never gonna give you up';\nvar html = `<div>${lyrics}</div>\\`;\n\
    ```\n\n注意，插值内部的任何占位符（ ${ 和 } ）都会被视为 JavaScript 表达式并进行求值，例如，你可以进行复杂的数学运算。\n\n```javascript\n\
    console.log(`1 and 1 make ${1 + 1}`);\n```\n\n### 多行字符串\n\n有没有想过在 JavaScript 字符串中放入换行符？也许你想嵌入一些歌词？你可能需要使用我们喜爱的转义字符\
    \ \\\\ 来*转义字面量换行*，然后在下一行手动在字符串中放入新行 \\\\n。所示：\n\n```javascript\nvar lyrics = \"\
    Never gonna give you up \\\\\n\\\\nNever gonna let you down\";\n```\n\n在 TypeScript\
    \ 中，你可以直接使用模板字符串：\n\n```javascript\nvar lyrics = `Never gonna give you up\nNever\
    \ gonna let you down\\`;\n```\n\n### 标签模板\n\n你可以在模板字符串之前放置一个函数（称为标签 tag），它将获得机会预处理模板字符串字面量加上所有占位符表达式的值，并返回一个结果。几点说明：\n\
    \n- 所有的静态字面量都作为第一个参数的数组传入。\n- 所有的占位符表达式的值都作为剩余参数传入。通常情况下你只需要使用剩余参数（rest parameters）将它们也转换为数组。\n\
    \n这是一个示例，我们有一个标签函数（命名为 `htmlEscape`），它可以转义所有占位符中的 html：\n\n```javascript\nvar\
    \ say = \"a bird in hand > two in the bush\";\nvar html = htmlEscape `<div> I\
    \ would just like to say : ${say}</div>\\`;\n\n// 示例标签函数\nfunction htmlEscape(literals,\
    \ ...placeholders) {\n  let result = \"\";\n  // 将字面量与占位符交替\n  for (let i = 0;\
    \ i < placeholders.length; i++) {\n    result += literals[i];\n    result += placeholders[i]\n\
    \      .replace(/&/g, '&amp;')\n      .replace(/\"/g, '&quot;')\n      .replace(/'/g,\
    \ '&#39;')\n      .replace(/</g, '&lt;')\n      .replace(/>/g, '&gt;');\n  }\n\
    \  // 添加最后一个字面量\n  result += literals[literals.length - 1];\n  return result;\n\
    }\n```\n\n### 生成的 JS\n\n对于预 ES6 编译目标，代码相当简单。多行字符串变为转义字符串。字符串插值变为*字符串拼接*。标签模板变为函数调用。\n\
    \n## 总结\n\n多行字符串和字符串插值在任何语言中都是非常棒特性。很棒你现在可以在 JavaScript 中使用它们（感谢 TypeScript！）。标签模板允许你创建强大的字符串工具。\n\
    \n![](img/416f69818aa79e3f1fe0e7869c118431_62_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_62_1.png)\n\
    \n## Promise\n\nPromise 类是存在于许多现代 JavaScript 引擎中的，并且可以很容易进行 polyfill（填充）。Promise\
    \ 的主要动机是将同步风格的错误处理引入异步 / 回调风格的代码中。\n\n### 回调风格代码\n\n为了充分理解 Promise，让我们展示一个简单的示例，证明了仅用回调创建可靠异步代码的困难性。考虑编写从文件加载\
    \ JSON 的异步版本的简单情况。它的同步版本可以非常简单：\n\n```javascript\nimport fs = require('fs');\n\
    \nfunction loadJSONSync(filename: string) {\n  return JSON.parse(fs.readFileSync(filename));\n\
    }\n\n// 良好的 json 文件\nconsole.log(loadJSONSync('good.json'));\n\n// 文件不存在，所以 fs.readFileSync\
    \ 失败\ntry {\n  console.log(loadJSONSync('absent.json'));\n}\ncatch (err) {\n \
    \ console.log('absent.json error', err.message);\n}\n\n// 无效的 json 文件，即文件存在但包含无效的\
    \ JSON，所以 JSON.parse 失败\ntry {\n  console.log(loadJSONSync('invalid.json'));\n\
    }\ncatch (err) {\n  console.log('invalid.json error', err.message);\n}\n```\n\n\
    这个简单的 `loadJSONSync` 函数有三种行为：返回值、文件系统错误或 JSON.parse 错误。我们使用简单的 try/catch 来处理错误，就像你在其他语言中进行同步编程时习惯的那样。现在让我们为这样的函数制作一个良好的\
    \ Promise 异步版本。一个带有简易错误检查逻辑的不错的初始尝试如下：\n\n```javascript\nimport fs = require('fs');\n\
    \n// 一个不错的初始尝试 .... 但是不正确的。我们将在下方解释原因。\nfunction loadJSON(filename: string, cb:\
    \ (error: Error, data: any) => void) {\n  fs.readFile(filename, function (err,\
    \ data) {\n    if (err) cb(err);\n    else cb(null, JSON.parse(data));\n  });\n\
    }\n```\n\n非常简单，它接收一个回调，并将任何文件系统错误传递给回调。如果没有文件系统错误，它返回 JSON.parse 的结果。在处理基于回调的异步函数时，需要记住以下几点：\n\
    \n1. 永远不要调用两次回调。\n2. 永远不要抛出错误。\n\n然而，这个简单的函数未能考虑到第二点。事实上，JSON.parse 会抛出一个错误，回调永远不会执行且应用程序会崩溃。如下所示：\n\
    \n```javascript\nimport fs = require('fs');\n// 一个不错的初始尝试 .... 但是不正确的。我们将在下方解释原因\n\
    function loadJSON(filename: string, cb: (error: Error, data: any) => void) {\n\
    \  fs.readFile(filename, function (err, data) {\n    if (err) cb(err);\n    else\
    \ cb(null, JSON.parse(data));\n  });\n}\n```\n\n解决此问题的幼稚尝试是将 JSON.parse 包装在 try/catch\
    \ 中，如下例所示：\n\n```javascript\nimport fs = require('fs');\n\n// 一个更好的尝试 ... 仍然不正确\n\
    function loadJSON(filename: string, cb: (error: Error) => void) {\n  fs.readFile(filename,\
    \ function (err, data) {\n    if (err) {\n      cb(err);\n    } else {\n     \
    \ try {\n        cb(null, JSON.parse(data));\n      } catch (err) {\n        cb(err);\n\
    \      }\n    }\n  });\n}\n```\n\n然而，这段代码中存在一个微妙的 bug。如果回调 ( cb ) 而不是 JSON.parse\
    \ 抛出了错误，由于我们将其包装在 try catch 中，catch 块会执行，我们再次调用了回调，即回调被调用了两次！如下例所示：\n\n```javascript\n\
    import fs = require('fs');\n\nfunction loadJSON(filename: string, cb: (error:\
    \ Error) => void) {\n  fs.readFile(filename, function (err, data) {\n    if (err)\
    \ {\n      cb(err);\n    } else {\n      try {\n        cb(null, JSON.parse(data));\n\
    \      } catch (err) {\n        cb(err);\n      }\n    }\n  });\n}\n\n// 良好的文件但糟糕的回调\
    \ ... 被再次调用了！\nloadJSON('good.json', function (err, data) {\n  console.log('our\
    \ callback called');\n  if (err) {\n    console.log('Error:', err.message);\n\
    \  } else {\n    // 让我们通过访问未定义变量属性来模拟错误\n    var foo;\n    // 下面代码将抛出 `Error:\
    \ Cannot read property 'bar' of undefined`\n    console.log(foo.bar);\n  }\n});\n\
    ```\n\n$ node asyncbadcatchdemo.js\n\nour callback called\nour callback called\n\
    \nError: Cannot read property 'bar' of undefined\n\n这是因为我们的 loadJSON 函数错误地将回调包装在\
    \ try 块中。这里有一个简单的教训需要记住。\n\n简单的教训：将所有的同步代码包含在 try catch 中，调用回调除外。\n\n遵循这个简单的教训，我们得到了功能完整的\
    \ loadJSON 异步版本，如下：\n\n"
