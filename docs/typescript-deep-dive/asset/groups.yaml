  - "[PAGE 72]\n\n**Revisiting the JSON example**\n\nNow let's revisit our  loadJSON\
    \  example and rewrite an async version that uses promises. All\n\nthat we need\
    \ to do is read the file contents as a promise, then parse them as JSON and we\n\
    \nare done. This is illustrated in the below example:\n\nfunction loadJSONAsync(filename:\
    \ string): Promise<any\\> {\n\n return readFileAsync(filename) // Use the function\
    \ we just wrote\n\n .then(function (res) {\n\n return JSON.parse(res);\n\n });\n\
    \n}\n\nUsage (notice how similar it is to the original  sync  version introduced\
    \ at the start of this\n\nsection ):\n\n// good json file\n\nloadJSONAsync('good.json')\n\
    \n .then(function (val) { console.log(val); })\n\n .catch(function (err) {\n\n\
    \ console.log('good.json error', err.message); // never called\n\n })\n\n// non-existent\
    \ json file\n\n .then(function () {\n\n return loadJSONAsync('absent.json');\n\
    \n })\n\n .then(function (val) { console.log(val); }) // never called\n\n .catch(function\
    \ (err) {\n\n console.log('absent.json error', err.message);\n\n })\n\n// invalid\
    \ json file\n\n .then(function () {\n\n return loadJSONAsync('invalid.json');\n\
    \n })\n\n .then(function (val) { console.log(val); }) // never called\n\n .catch(function\
    \ (err) {\n\n console.log('bad.json error', err.message);\n\n });\n\nThe reason\
    \ why this function was simpler is because the \" loadFile (async) +  JSON.parse\
    \ \n\n(sync) =>  catch \" consolidation was done by the promise chain. Also the\
    \ callback was not\n\ncalled by *us* but called by the promise chain so we didn't\
    \ have the chance of making the\n\nmistake of wrapping it in a  try/catch .\n\n\
    **Parallel control flow**\n\nPromise\n\n73"
  - "[PAGE 73]\n\nWe have seen how trivial doing a serial sequence of async tasks\
    \ is with promises. It is\n\nsimply a matter of chaining  then  calls.\n\nHowever\
    \ you might potentially want to run a series of async tasks and then do something\n\
    \nwith the results of all of these tasks.  Promise  provides a static  Promise.all\
    \  function that\n\nyou can use to wait for  n  number of promises to complete.\
    \ You provide it with an array of\n\n n  promises and it gives you an array of\
    \  n  resolved values. Below we show Chaining as\n\nwell as Parallel:\n\n// an\
    \ async function to simulate loading an item from some server\n\nfunction loadItem(id:\
    \ number): Promise<{ id: number }> {\n\n return new Promise((resolve) => {\n\n\
    \ console.log('loading item', id);\n\n setTimeout(() => { // simulate a server\
    \ delay\n\n resolve({ id: id });\n\n }, 1000);\n\n });\n\n}\n\n// Chaining\n\n\
    let item1, item2;\n\nloadItem(1)\n\n .then((res) => {\n\n item1 = res;\n\n return\
    \ loadItem(2);\n\n })\n\n .then((res) => {\n\n item2 = res;\n\n console.log('done');\n\
    \n }); // overall time will be around 2s\n\n// Parallel\n\nPromise.all(\\[loadItem(1),\
    \ loadItem(2)\\])\n\n .then((res) => {\n\n \\[item1, item2\\] = res;\n\n console.log('done');\n\
    \n }); // overall time will be around 1s\n\nSometimes, you want to run a series\
    \ of async tasks, but you get all you need as long as any\n\none of these tasks\
    \ is settled.  Promise  provides a static  Promise.race  function for this\n\n\
    scenario:\n\nPromise\n\n74"
- md: "\n```javascript\nvar task1 = new Promise(function(resolve, reject) {\n  setTimeout(resolve,\
    \ 1000, 'one');\n});\n\nvar task2 = new Promise(function(resolve, reject) {\n\
    \  setTimeout(resolve, 2000, 'two');\n});\n\nPromise.race([task1, task2]).then(function(value)\
    \ {\n  console.log(value); // \"one\"\n  // Both resolve, but task1 resolves faster\n\
    });\n```\n\n## Converting callback functions to promise\n\nThe most reliable way\
    \ to do this is to hand write it. e.g. converting `setTimeout` into a promisified\
    \ delay function is super easy:\n\n```javascript\nconst delay = (ms: number) =>\
    \ new Promise(res => setTimeout(res, ms));\n```\n\nNote that there is a handy\
    \ function in NodeJS that does this: node style function => promise returning\
    \ function magic for you:\n\n```javascript\n/** Sample usage */\nimport fs = require('fs');\n\
    import util = require('util');\nconst readFile = util.promisify1(fs.readFile);\n\
    ```\n\n## Generators\n\nNOTE: You cannot use generators in TypeScript in a meaningful\
    \ way (the ES5 emitter is in progress). However that will change soon so we still\
    \ have this chapter.\n\n`*` is the syntax used to create a *generator function*.\
    \ Calling a generator function returns a *generator object*. The generator object\
    \ just follows the iterator interface (i.e. the `next`, `return` and `throw` functions).\n\
    \nThere are two key motivations behind generator functions:\n\n### Lazy Iterators\n\
    \nGenerator functions can be used to create lazy iterators e.g. the following\
    \ function returns an **infinite** list of integers on demand:\n\n```javascript\n\
    function* infiniteSequence() {\n  var i = 0;\n  while(true) {\n    yield i++;\n\
    \  }\n}\n\nvar iterator = infiniteSequence();\nwhile (true) {\n  console.log(iterator.next());\
    \ // { value: xxxx, done: false } forever and ever\n}\n```\n\nOf course if the\
    \ iterator does end, you get the result of `{ done: true }` as demonstrated below:\n\
    \n```javascript\nfunction* idMaker(){\n  let index = 0;\n  while(index < 3)\n\
    \    yield index++;\n}\n\nlet gen = idMaker();\nconsole.log(gen.next()); // {\
    \ value: 0, done: false }\nconsole.log(gen.next()); // { value: 1, done: false\
    \ }\nconsole.log(gen.next()); // { value: 2, done: false }\nconsole.log(gen.next());\
    \ // { done: true }\n```\n\n## Externally Controlled Execution\n\nThis is the\
    \ part of generators that is truly exciting. It essentially allows a function\
    \ to pause its execution and pass control (fate) of the remainder of the function\
    \ execution to the caller.\n\nA generator function does not execute when you call\
    \ it. It just creates a generator object. Consider the following example along\
    \ with a sample execution:\n\n```javascript\nfunction* generator(){\n  console.log('Execution\
    \ started');\n  yield 0;\n  console.log('Execution resumed');\n  yield 1;\n  console.log('Execution\
    \ resumed');\n}\n\nvar iterator = generator();\nconsole.log('Starting iteration');\
    \ // This will execute before anything in the generator function body executes\n\
    console.log(iterator.next()); // { value: 0, done: false }\nconsole.log(iterator.next());\
    \ // { value: 1, done: false }\nconsole.log(iterator.next()); // { done: true\
    \ }\n```\n\nIf you run this you get the following output:\n\n```\n$ node.js\n\
    Starting iteration\nExecution started\n{ value: 0, done: false }\nExecution resumed\n\
    { value: 1, done: false }\nExecution resumed\n{ value: undefined, done: true }\n\
    ```\n\nThe function only starts execution once `next` is called on the generator\
    \ object. The function *pauses* as soon as a `yield` statement is encountered.\
    \ The function *resumes* when `next` is called. So essentially the execution of\
    \ the generator function is controllable by the generator object. Our communication\
    \ using the generator has been mostly one way returning values for the iterator.\
    \ One extremely powerful feature of generators is that they allow two way communications!\n\
    \nYou can control the resulting value of the `yield` expression using `iterator.next(value)`\
    \ and you can throw an exception at the point of `yield` expression using `iterator.throw(error)`.\n\
    \nThe following example demonstrates `iterator.next(value)`:\n\n```javascript\n\
    function* generator() {\n  var bar = yield 'foo';\n  console.log(bar); // bar!\n\
    }\n\nconst iterator = generator();\n// Start execution till we get yield value\n\
    const foo = iterator.next();\nconsole.log(foo.value); // foo\n// Resume execution\
    \ injecting 'bar'\nvar nextThing = iterator.next('bar');\n```\n\nThe following\
    \ example demonstrates `iterator.throw(error)`:\n\n```javascript\nfunction* generator()\
    \ {\n  try {\n    yield 'foo';\n  } catch(err) {\n    console.log(err.message);\
    \ // bar!\n  }\n}\n\nvar iterator = generator();\n// Start execution till we get\
    \ yield value\nvar foo = iterator.next();\nconsole.log(foo.value); // foo\n//\
    \ Resume execution throwing exception 'bar'\nvar nextThing = iterator.throw(new\
    \ Error('bar'));\n```\n\nSo here is the summary:\n- `yield` allows a generator\
    \ function to pause its communication and pass control to the external system\n\
    - the external system can push a value into the generator function body\n- the\
    \ external system can throw an exception into the generator function body\n\n\
    How is this useful? Jump to the next section **async/await** and find out.\n\n\
    ## Async Await\n\nAs a thought experiment imagine the following: a way to tell\
    \ the JavaScript runtime to pause the executing of code on the `await` keyword\
    \ when used on a promise and resume *only* (and if) the promise returned from\
    \ the function is settled:\n\n```javascript\n// Not actual code. A thought experiment\n\
    async function foo() {\n  try {\n    var val = await getMeAPise();\n    console.log(val);\n\
    \  } catch(err) {\n    console.log('Error: ', err.message);\n  }\n}\n```\n\nWhen\
    \ the promise settles execution continues, if it was fulfilled then `await` will\
    \ return the value, if it's rejected an error will be thrown synchronously which\
    \ we can catch. This suddenly (and magically) makes asynchronous programming as\
    \ easy as synchronous programming. Three things needed for this thought experiment\
    \ are:\n- Ability to *pause function* execution.\n- Ability to *put a value inside*\
    \ the function.\n- Ability to *throw an exception inside* the function.\n\nThis\
    \ is exactly what generators allowed us to do! The thought experiment *is actually\
    \ real* and so is the `async / await` implementation in TypeScript / JavaScript.\
    \ Under the covers it just uses generators.\n\n## Generated JavaScript\n\nYou\
    \ don't have to understand this, but it's fairly simple if you've read up on generators.\
    \ The function `foo` can be simply wrapped up as follows:\n\n```javascript\nconst\
    \ foo = wrapToReturnPromise(function* () {\n  try {\n    var val = yield getMeAPrise();\n\
    \    console.log(val);\n  } catch(err) {\n    console.log('Error: ', err.message);\n\
    \  }\n});\n```\n\nwhere the `wrapToReturnPromise` just executes the generator\
    \ function to get the generator and then use `generator.next()`, if the value\
    \ is a promise it would then catch the promise and depending upon the result call\
    \ `generator.next(result)` or `generator.throw(error)`. That's it!\n\n## Async\
    \ Await Support in TypeScript\n\n**Async - Await** has been supported by TypeScript\
    \ since version 1.7. Asynchronous functions are prefixed with the `async` keyword;\
    \ `await` suspends the execution until an asynchronous function return promise\
    \ is fulfilled and unwraps the value from the *Promise* returned. It was only\
    \ supported for **target es6** transpiling directly to **ES6 generators**.\n\n\
    **TypeScript 2.1** added the capability to ES3 and ES5 run-times, meaning you’ll\
    \ be free to take advantage of it no matter what environment you’re using. It's\
    \ important to notice that we can use async / await with TypeScript 2.1 and many\
    \ browsers are supported, of course, having globally added a **polyfill for Promise**.\n\
    \nLet's see this **example** and take a look at this code to figure out how TypeScript\
    \ async / await **notation** works:\n\n```javascript\nfunction delay(milliseconds:\
    \ number, count: number): Promise<number> {\n  return new Promise<number>(resolve\
    \ => {\n    setTimeout(() => {\n      resolve(count);\n    }, milliseconds);\n\
    \  });\n}\n\n// async function always return a Promise\nasync function dramaticWelcome():\
    \ Promise<void> {\n  console.log(\"Hello\");\n  for (let i = 0; i < 5; i++) {\n\
    \    // await is converting Promise<number> into number\n    const count:number\
    \ = await delay(500, i);\n    console.log(count);\n  }\n  console.log(\"World!\"\
    );\n}\n\ndramaticWelcome();\n```\n"
  mdcn: "\n\n```javascript\nvar task1 = new Promise(function(resolve, reject) {\n\
    \  setTimeout(resolve, 1000, 'one');\n});\n\nvar task2 = new Promise(function(resolve,\
    \ reject) {\n  setTimeout(resolve, 2000, 'two');\n});\n\nPromise.race([task1,\
    \ task2]).then(function(value) {\n  console.log(value); // \"one\"\n  // 都会 resolve，但\
    \ task1 解析更快\n});\n```\n\n## 将回调函数转换为 promise\n\n最可靠的方法是手动编写。例如，将 `setTimeout`\
    \ 转换为一个 promise 化的延迟函数非常简单：\n\n```javascript\nconst delay = (ms: number) => new\
    \ Promise(res => setTimeout(res, ms));\n```\n\n注意， NodeJS 中有一个方便的函数可以实现这一点：node\
    \ 风格函数 => 返回 promise 的函数，它会为你完成这些工作：\n\n```javascript\n/** 示例用法 */\nimport fs\
    \ = require('fs');\nimport util = require('util');\nconst readFile = util.promisify1(fs.readFile);\n\
    ```\n\n## 生成器 (Generators)\n\n注意：在 TypeScript 中无法以意义的方式使用生成器（ES5 编译器正在开发中）。但这很快就会改变，所以我们仍然保留这一章。\n\
    \n`*` 是创建*生成器函数*的语法。调用生成器函数会返回一个*生成器对象*。生成器对象遵循迭代器接口（即 `next`、`return` 和 `throw`\
    \ 函数）。\n\n生成器背后有两个核心动机：\n\n### 懒性迭代器 (Lazy Iterators)\n\n生成器函数可以用于创建懒性迭代器，例如，以下函数按需返回一个**无限**的整数列表：\n\
    \n```javascript\nfunction* infiniteSequence() {\n  var i = 0;\n  while(true) {\n\
    \    yield i++;\n  }\n}\n\nvar iterator = infiniteSequence();\nwhile (true) {\n\
    \  console.log(iterator.next()); // 永远返回 { value: xxxx, done: false }\n}\n```\n\
    \n当然，如果迭代器结束了，你将像下面所示那样得到 `{ done: true }` 的结果：\n\n```javascript\nfunction* idMaker(){\n\
    \  let index = 0;\n  while(index < 3)\n    yield index++;\n}\n\nlet gen = idMaker();\n\
    console.log(gen.next()); // { value: 0, done: false }\nconsole.log(gen.next());\
    \ // { value: 1, done: false }\nconsole.log(gen.next()); // { value: 2, done:\
    \ false }\nconsole.log(gen.next()); // { done: true }\n```\n\n## 外部控制执行 (Externally\
    \ Controlled Execution)\n\n这是生成器中最真正令人兴奋的部分。它本质上允许函数暂停执行，并将函数剩余执行的控制权（命运）交给调用者。\n\
    \n当你调用生成器函数时，它并不会执行。它只是创建了一个生成器对象。考虑以下示例以及示例执行：\n\n```javascript\nfunction* generator(){\n\
    \  console.log('Execution started');\n  yield 0;\n  console.log('Execution resumed');\n\
    \  yield 1;\n  console.log('Execution resumed');\n}\n\nvar iterator = generator();\n\
    console.log('Starting iteration'); // 这将在生成器函数体内的任何代码之前执行\nconsole.log(iterator.next());\
    \ // { value: 0, done: false }\nconsole.log(iterator.next()); // { value: 1, done:\
    \ false }\nconsole.log(iterator.next()); // { done: true }\n```\n\n如果你运行它，将得到以下输出：\n\
    \n```\n$ node.js\nStarting iteration\nExecution started\n{ value: 0, done: false\
    \ }\nExecution resumed\n{ value: 1, done: false }\nExecution resumed\n{ value:\
    \ undefined, done: true }\n```\n\n只有在生成器对象上调用 `next` 时，函数才会开始执行。一旦遇到 `yield` 语句，函数就会*暂停*。当调用\
    \ `next` 时，函数会*恢复*。因此，本质上，生成器函数的执行是可以受生成器对象控制的。我们使用生成器进行的通信大部分是单向的，即为迭代器返回值。生成器的一个极其强大的特性是，它们允许双向通信！\n\
    \n你可以使用 `iterator.next(value)` 来控制 `yield` 表达式的返回值，并可以使用 `iterator.throw(error)`\
    \ 在 `yield` 表达式处抛出异常。\n\n以下示例演示了 `iterator.next(value)`：\n\n```javascript\nfunction*\
    \ generator() {\n  var bar = yield 'foo';\n  console.log(bar); // bar!\n}\n\n\
    const iterator = generator();\n// 开始执行直到我们获得 yield 值\nconst foo = iterator.next();\n\
    console.log(foo.value); // foo\n// 恢复执行并注入 'bar'\nvar nextThing = iterator.next('bar');\n\
    ```\n\n以下示例演示了 `iterator.throw(error)`：\n\n```javascript\nfunction* generator()\
    \ {\n  try {\n    yield 'foo';\n  } catch(err) {\n    console.log(err.message);\
    \ // bar!\n  }\n}\n\nvar iterator = generator();\n// 开始执行直到我们获得 yield 值\nvar foo\
    \ = iterator.next();\nconsole.log(foo.value); // foo\n// 恢复执行并抛出异常 'bar'\nvar\
    \ nextThing = iterator.throw(new Error('bar'));\n```\n\n这里是总结：\n- `yield` 允许生成器函数暂停通信并将控制权交给外部系统\n\
    - 外部系统可以将一个值推入生成器函数体中\n- 外部系统可以向生成器函数体抛出一个异常\n\n## Async/Await\n\n"
