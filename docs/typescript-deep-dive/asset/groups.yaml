  - "[PAGE 94]\n\n**External modules**\n\nThere is a lot of power and usability packed\
    \ into the TypeScript external module pattern.\n\nHere we discuss its power and\
    \ some patterns needed to reflect real world usages.\n\n**File lookup**\n\nThe\
    \ following statement:\n\nimport foo = require('foo');\n\ntells the TypeScript\
    \ compiler to look for an external module declaration of the form:\n\ndeclare\
    \ module \"foo\" {\n\n // Some variable declarations\n\n export var bar: number;\
    \ /\\*sample\\*/\n\n}\n\nAn import with a relative path e.g.:\n\nimport foo =\
    \ require('./foo');\n\ntells the TypeScript compiler to look for a TypeScript\
    \ file at the relative location  ./foo.ts  or\n\n ./foo.d.ts  with respect to\
    \ the current file.\n\nThis is not the complete specification but it's a decent\
    \ mental model to have and use. We will\n\ncover the gritty details later.\n\n\
    **Compiler Module Option**\n\nThe following statement:\n\nimport foo = require('foo');\n\
    \nwill generate *different* JavaScript based on the compiler *module* option (\
    \ --module commonjs \n\nor  --module amd  or  --module umd  or  --module system\
    \ ).\n\nPersonal recommendation: use  --module commonjs  and then your code will\
    \ work as it is for\n\nNode.js and for frontend you can use something like  webpack\
    \ .\n\nFile Module Details\n\n95"
