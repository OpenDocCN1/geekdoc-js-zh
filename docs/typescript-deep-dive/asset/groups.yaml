- md: "\n## Trivia\n\nTrivia (called that because it's trivial ) represent the parts\
    \ of the source text that are\n\nlargely insignificant for normal understanding\
    \ of the code. For example; whitespace,\n\ncomments, and even conflict markers.\
    \ Trivia is *not stored* in the AST (to keep it lightweight).\n\nHowever it can\
    \ be fetched *on demand* using a few ts.* APIs.\n\nBefore we show them you need\
    \ to understand the following:\n\n### Trivia Ownership\n\nIn General:\n\nA token\
    \ owns any trivia after it on the *same* line *upto* the next token.\n\nAny comment\
    \ *after that line* is associated with the following token.\n\nFor leading and\
    \ ending comments in a file:\n\nThe first token in the source file gets all the\
    \ initial trivia.\n\nThe last sequence of trivia in the file is tacked onto the\
    \ end-of-file token, which\n\notherwise has zero width.\n\n### Trivia APIs\n\n\
    For most basic uses, comments are the \"interesting\" trivia. The comments that\
    \ belong to a\n\nNode can be fetched through the following functions:\n\n| Function\
    \ | Description |\n| :--- | :--- |\n| ts.getLeadingCommentRanges | Given the source\
    \ text and position within that text, returns ranges of comments between the first\
    \ line break following the given position and the token itself (probably most\
    \ useful with ts.Node.getFullStart ). |\n| ts.getTrailingCommentRanges | Given\
    \ the source text and position within that text, returns ranges of comments until\
    \ the first line break following the given position (probably most useful with\
    \ ts.Node.getEnd ). |\n\nAs an example, imagine this portion of a source file:\n\
    \n```typescript\ndebugger;/*hello*/\n //bye\n /*hi*/ function\n```\n\nTrivia\n\
    \n`getLeadingCommentRanges` for the `function` will only return the last 2 comments\
    \ `//bye` and `/*hi*/`.\n\nAppropriately, calling `getTrailingCommentRanges` on\
    \ the end of the debugger statement will\n\nextract the `/*hello*/` comment.\n\
    \n### Token Start/Full Start\n\nNodes have what is called a \"token start\" and\
    \ a \"full start\".\n\nToken Start: the more natural version, which is the position\
    \ in file where the text of a\n\ntoken begins\n\nFull Start: the point at which\
    \ the scanner began scanning since the last significant token\n\nAST nodes have\
    \ an API for `getStart` and `getFullStart`. In the following example:\n\n```typescript\n\
    debugger;/*hello*/\n //bye\n /*hi*/ function\n```\n\nfor `function` the token\
    \ start is at `function` whereas *full* start is at `/*hello*/`. Note that full\n\
    \nstart even includes the trivia that would otherwise be owned by the previous\
    \ node.\n\nTrivia\n\n### Scanner\n\nThe source code for the TypeScript scanner\
    \ is located entirely in `scanner.ts`. Scanner is\n\n*controlled* internally by\
    \ the `Parser` to convert the source code to an AST. Here is what the\n\ndesired\
    \ outcome is.\n\nSourceCode ~~ scanner ~~> Token Stream ~~ parser ~~> AST\n\n\
    ### Usage by Parser\n\nThere is a *singleton* `scanner` created in `parser.ts`\
    \ to avoid the cost of creating scanners\n\nover and over again. This scanner\
    \ is then *primed* by the parser on demand using the\n\n`initializeState` function.\n\
    \nHere is a *simplied* version of the actual code in the parser that you can run\
    \ demonstrating\n\nthis concept:\n\n`code/compiler/scanner/runScanner.ts`\n\n\
    ```typescript\nimport * as ts from \"typescript\";\n\n// TypeScript has a singleton\
    \ scanner\nconst scanner = ts.createScanner(ts.ScriptTarget.Latest, /\\*skipTrivia\\\
    */ true);\n\n// That is initialized using a function `initializeState` similar\
    \ to\nfunction initializeState(text: string) {\n  scanner.setText(text);\n  scanner.setOnError((message:\
    \ ts.DiagnosticMessage, length: number) => {\n    console.error(message);\n  });\n\
    \  scanner.setScriptTarget(ts.ScriptTarget.ES5);\n  scanner.setLanguageVariant(ts.LanguageVariant.Standard);\n\
    }\n\n// Sample usage\ninitializeState(`\nvar foo = 123;\n`.trim());\n\n// Start\
    \ the scanning\nvar token = scanner.scan();\nwhile (token != ts.SyntaxKind.EndOfFileToken)\
    \ {\n  console.log(ts.syntaxKindToName(token));\n  token = scanner.scan();\n}\n\
    ```\n\nScanner\n\nThis will print out the following :\n\nVarKeyword\nIdentifier\n\
    FirstAssignment\nFirstLiteralToken\nSemicolonToken\n\n### Scanner State\n\nAfter\
    \ you call `scan` the scanner updates its local state (position in the scan, current\
    \ token\n\ndetails etc). The scanner provides a bunch of utility functions to\
    \ get the current scanner\n\nstate. In the below sample we create a scanner and\
    \ then use it to identify the tokens as well\n\nas their positions in the code.\n\
    \n`code/compiler/scanner/runScannerWithPosition.ts`\n\n```typescript\n// Sample\
    \ usage\ninitializeState(`\nvar foo = 123;\n`.trim());\n\n// Start the scanning\n\
    var token = scanner.scan();\nwhile (token != ts.SyntaxKind.EndOfFileToken) {\n\
    \  let currentToken = ts.syntaxKindToName(token);\n  let tokenStart = scanner.getStartPos();\n\
    \  token = scanner.scan();\n  let tokenEnd = scanner.getStartPos();\n  console.log(currentToken,\
    \ tokenStart, tokenEnd);\n}\n```\n\nThis will print out the following:\n\nVarKeyword\
    \ 0 3\nIdentifier 3 7\nFirstAssignment 7 9\nFirstLiteralToken 9 13\nSemicolonToken\
    \ 13 14\n\n### Standalone\n\nEven though the parser has a singleton you can create\
    \ a standalone\n\nscanner using `setText` to scan different points in a file.\n\
    \nScanner\n"
  mdcn: "\n\n## 杂项 (Trivia)\n\n杂项（之所以被称为 Trivia是因为它们是微不足道的）代表源码中对理解代码而言大部分不重要的部分。例如：空白符、注释，甚至是冲突标记。杂项*不会被存储*在\
    \ AST 中（以保持其轻量化）。然而，可以使用几个 `ts.*` API*按需*获取它们。\n\n在展示它们之前，你需要理解以下内容：\n\n### 杂项所有权\n\
    \n通常情况下：\n\n一个 token 拥有它在*同一行*上、*直到*下一个 token 之前的所有杂项。\n\n*该行之后*的任何注释都与后续的 token\
    \ 关联。\n\n对于文件开头和结尾的注释：\n\n源文件中的第一个 token 获取所有的初始杂项。\n\n文件中最后的杂项序列会被附加到文件末尾标记（end-of-file\
    \ token），该标记在其他宽度为零。\n\n### 杂项 API\n\n对于大多数基本用途，注释是“有趣”的杂项。属于某个 Node 的注释可以通过以下函数获取：\n\
    \n| Function | Description |\n| :--- | :--- |\n| ts.getLeadingCommentRanges |\
    \ 给定源码和该文本中的位置，返回从给定位置后的第一个换行符到 token 之间的注释范围（可能配合 `ts.Node.getFullStart` 使用最有效）。\
    \ |\n| ts.getTrailingCommentRanges | 给定源码和该文本中的位置，返回直到给定位置后的第一个换行符的注释范围（可能配合 `ts.Node.getEnd`\
    \ 使用最有效）。 |\n\n例如，想象源文件中的这部分：\n\n```typescript\ndebugger;/*hello*/\n //bye\n /*hi*/\
    \ function\n```\n\n针对 `function` 的 `getLeadingCommentRanges` 将只会返回最后两个注释 `//bye`\
    \ 和 `/*hi*/`。\n\n相应地，在 debugger 语句末尾调用 `getTrailingCommentRanges` 将提取出 `/*hello*/`\
    \ 注释。\n\n### Token 开始/完整起始 (Token Start/Full Start)\n\nNode 有所谓的“token start”（token\
    \ 开始）和“full start”（完整起始）。\n\nToken Start：这是更自然的版本，即 token 文本在文件中开始的位置。\n\nFull\
    \ Start：指扫描器自上一个有效 token 以来开始扫描的点。\n\nAST 节点拥有 `getStart` 和 `getFullStart` 的 API。在以下示例中：\n\
    \n```typescript\ndebugger;/*hello*/\n //bye\n /*hi*/ function\n```\n\n对于 `function`\
    \ 来说，token start 在 `function` 处，而*full* start 在 `/*hello*/`。注意，full start 甚至包含了原本属于上一个\
    \ node 的杂项。\n\n杂项\n\n### 扫描器 (Scanner)\n\nTypeScript 扫描器的源码完全位于 `scanner.ts` 中。扫描器内部由\
    \ `Parser`*控制*，用于将源码转换为 AST。这是预期的结果。\n\nSourceCode ~~ scanner ~~> Token Stream\
    \ ~~ parser ~~> AST\n\n### 解析器的用法\n\n`parser.ts` 中创建了一个*单例* `scanner`，以避免重复创建扫描器的开销。该扫描器由解析器使用\
    \ `initializeState` 函数按需*初始化*。\n\n以下是解析器中实际代码的*简化*版本，你可以运行它来演示这一概念：\n\n`code/compiler/scanner/runScanner.ts`\n\
    \n```typescript\nimport * as ts from \"typescript\";\n\n// TypeScript 有一个单例扫描器\n\
    const scanner = ts.createScanner(ts.ScriptTarget.Latest, /\\*skipTrivia\\*/ true);\n\
    \n// 它使用类似于 `initializeState` 的函数进行初始化\nfunction initializeState(text: string)\
    \ {\n  scanner.setText(text);\n  scanner.setOnError((message: ts.DiagnosticMessage,\
    \ length: number) => {\n    console.error(message);\n  });\n  scanner.setScriptTarget(ts.ScriptTarget.ES5);\n\
    \  scanner.setLanguageVariant(ts.LanguageVariant.Standard);\n}\n\n// 使用示例\ninitializeState(`\n\
    var foo = 123;\n`.trim());\n\n// 开始扫描\nvar token = scanner.scan();\nwhile (token\
    \ != ts.SyntaxKind.EndOfFileToken) {\n  console.log(ts.syntaxKindToName(token));\n\
    \  token = scanner.scan();\n}\n```\n\n扫描器\n\n这将打印如下：\n\nVarKeyword\nIdentifier\n\
