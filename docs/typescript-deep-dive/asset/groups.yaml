    \ninterface Foo {\n\n bar: number\n\n bas: string\n\n}\n\nlet foo = {} as Foo;\n\
    \nfoo.bar = 123;\n\nfoo.bas = \"Hello World\";\n\n// later in the codebase:\n\n\
    foo.bar = 'Hello Stranger'; // Error: You probably misspelled \\`bas\\` as \\\
    `bar\\`, cannot a\n\nssign string to number\n\n}\n\nLazy Object Literal Initialization\n\
    \n232"
- md: "\n## Classes Are Useful\n\nIt is very common to have the following structure:\n\
    \n```javascript\nfunction foo() {\n  let someProperty;\n  // Some other initialization\
    \ code\n  function someMethod() {\n    // Do some stuff with `someProperty`\n\
    \    // And potentially other things\n  }\n  // Maybe some other methods\n  return\
    \ {\n    someMethod,\n    // Maybe some other methods\n  };\n}\n```\n\nThis is\
    \ known as the *revealing module pattern* and quite common in JavaScript (taking\
    \ advantage of JavaScript closure).\n\nIf you use *file modules* (which you really\
    \ should as global scope is bad) then *your file is* *effectively the same*. However\
    \ there are too many cases where people will write code like the following:\n\n\
    ```javascript\nlet someProperty;\n\nfunction foo() {\n  // Some initialization\
    \ code\n}\n\nfoo(); // some initialization code\nsomeProperty = 123; // some more\
    \ initialization\n// Some utility function not exported\n// later\nexport function\
    \ someMethod() {\n}\n```\n\nEven though I am not a big fan of inheritance *I do\
    \ find that letting people use classes helps them organize their code better*.\
    \ The same developer would intuitively write the following:\n\n```typescript\n\
    class Foo {\n  public someProperty;\n  constructor() {\n    // some initialization\n\
    \  }\n  public someMethod() {\n    // some code\n  }\n  private someUtility()\
    \ {\n    // some code\n  }\n}\n\nexport = new Foo();\n```\n\nAnd its not just\
    \ developers, creating dev tools that provide great visualizations over classes\
    \ are much more common, and there is one less pattern your team needs to understand\
    \ and maintain. \n\nPS: There is nothing wrong in my opinion with *shallow* class\
    \ hierarchies if they provide significant reuse and reduction in boilerplate.\n\
    \n## **export default can lead to problems**\n\nLet's go with an example. Consider\
    \ you have a file `foo.ts` with the following contents:\n\n```typescript\nclass\
    \ Foo {\n}\nexport default Foo;\n```\n\nYou would import it (in `bar.ts`) using\
    \ ES6 syntax as follows:\n\n```typescript\nimport Foo from \"./foo\";\n```\n\n\
    There are a few maintainability concerns here:\n\n- If you refactor `Foo` in `foo.ts`\
    \ it will not rename it in `bar.ts`\n- If you end up needing to export more stuff\
    \ from `foo.ts` (which is what many of your files will have) then you have to\
    \ juggle the import syntax.\n\nFor this reason I recommend simple exports + destructured\
    \ import. E.g. `foo.ts`:\n\n```typescript\nexport class Foo {\n}\n```\n\nAnd then:\n\
    \n```typescript\nimport {Foo} from \"./foo\";\n```\n\n## Avoid Export Default\n\
    \n**Bonus points**: You even get autocomplete at this `import {/*here*/} from\
    \ \"./foo\";` cursor location. Gives your developers a bit of wrist relief.\n\n\
    **Bonus points**: Better commonJs experience. With `default` there is horrible\
    \ experience for commonjs users who have to `const {default} = require('module/foo');`\
    \ instead of `const {Foo} = require('module/foo')`.\n\n**Bonus points**: You don't\
    \ get typos like one doing `import Foo from \"./foo\";` and another doing `import\
    \ foo from \"./foo\";`.\n\n**Bonus points**: Auto import works better. You use\
    \ `import { Foo } from \"./foo\";` and auto import will write down.\n\n**Bonus\
    \ points**: Reexporting is unnecessarily hard. Reexporting is common for root\
    \ index in npm packages e.g. `import Foo from \"./foo\"; export { Foo }` (with\
    \ default) vs. `export * from \"./foo\"` (with named exports).\n\n## Limit usage\
    \ of property setters\n\nPrefer explicit set/get functions (e.g. `bar(value:{a:number,b:number})`)\
    \ over setters/getters. Consider the following code:\n\n```typescript\nclass Foo\
    \ {\n  a: number;\n  b: number;\n  bar(value:{a:number,b:number}) {\n    this.a\
    \ = value.a;\n    this.b = value.b;\n  }\n}\nlet foo = new Foo();\n```\n\nThis\
    \ is not *good* use of property setters. The person reading the first code has\
    \ no context about all the things that will change. Whereas someone calling `foo.bar(value)`\
    \ might have an idea that something might change on `foo`. Bonus points: Find\
    \ references works better if you have different functions whereas with a setter\
    \ you only get references to the relevant function.\n\n## Null is Bad\n\nJavaScript\
    \ (and by extension TypeScript) has two bottom types: `null` and `undefined`.\
    \ They are *intended* to mean different things:\n\n- Something hasn't been initialized:\
    \ `undefined`\n- Something is currently unavailable: `null`\n\nMost other languages\
    \ only have one (commonly called `null`). Since by default JavaScript will evaluate\
    \ uninitialized variable / property to `undefined` recommend you just use that\
    \ for your own status. TypeScript coding guidelines and it hasn't caused any problems.\
    \ Douglas Crockford thinks `null` is a bad idea and we should all use `undefined`.\n\
    \n## Dealing with null style bases\n\nIf your code base interacts with other APIs\
    \ that might give you `null` you check with `== undefined` (instead of `===`).\
    \ Using this is safe even for potentially *falsy* values. Imagine you are doing\
    \ `foo == undefined` where foo can be one of:\n\n```javascript\nconsole.log(undefined\
    \ == undefined); // true\nconsole.log(null == undefined); // true\nconsole.log(0\
    \ == undefined); // false\nconsole.log('' == undefined); // false\nconsole.log(false\
    \ == undefined); // false\n```\n\n## Limit explicit use of undefined\n\nAlso because\
    \ TypeScript gives you the opportunity to *document* your structures separately\
    \ from values instead of stuff like:\n\n```typescript\nfunction foo(){\n  // if\
    \ Something\n  return {a:1,b:2};\n  // else\n  return {a:1,b:undefined};\n}\n\
    ```\n\nyou should use a type annotation:\n\n```typescript\nfunction foo():{a:number,b?:number}{\n\
    \  // if Something\n  return {a:1,b:2};\n  // else\n  return {a:1};\n}\n```\n\n\
    ## Node style callbacks\n\nNode style callback functions (e.g. `(err,somethingElse)=>{\
    \ something */ }`) are generally called with `err` set to `null` if there isn't\
    \ an error. You generally just use a truthy check for this anyways:\n\n```javascript\n\
    fs.readFile('someFile', 'utf8', (err,data) => {\n  if (err) {\n    // do something\n\
    \  }\n  // no error\n});\n```\n\nWhen creating your own APIs's *okay* to use `null`\
    \ in this case for consistency. In all sincerity for your own APIs you should\
    \ look at promises, in that case you actually don't need to bother with absent\
    \ error values (you handle them with `.then` vs. `.catch`).\n\n## Don't use undefined\
    \ as a means of denoting validity\n\nFor example an awful function like this:\n\
    \n```typescript\nfunction toInt(str:string) {\n  return str ? parseInt(str) :\
    \ undefined;\n}\n```\n\ncan be much better written like this:\n\n```typescript\n\
    function toInt(str: string): { valid: boolean, int?: number } {\n  const int =\
    \ parseInt(str);\n  if (isNaN(int)) {\n    return { valid: false };\n  }\n  else\
    \ {\n    return { valid: true, int };\n  }\n}\n```\n\n## **--outFile is BAD**\n\
    \nIts a bad idea for you to use because because of the following reasons:\n\n\
    - Runtime Errors\n- Fast compile\n- Global scope\n- Hard to analyze\n- Hard to\
    \ scale\n- references\n- Code reuse\n- Multiple Targets\n- Isolated Compile\n\n\
    ### **Runtime Errors**\n\nIf your code depends on any form of js ordering you\
    \ will get random errors.\n\n### **class inheritance can break at runtime.**\n\
    \nConsider `foo.ts`:\n\n```typescript\nclass Foo {\n}\n```\n\nAnd `bar.ts`:\n\n\
    ```typescript\nclass Bar extends Foo {\n}\n```\n\n### **module splitting can fail\
    \ at runtime.**\n\nConsider `foo.ts`:\n\n```typescript\nmodule App {\n  export\
    \ var foo = 123;\n}\n```\n\nAnd `bar.ts`:\n\n```typescript\nmodule App {\n  export\
    \ var bar = foo + 456;\n}\n```\n\n**Fast compile**\n\nIf you use `--outFile` then\
    \ single `.ts` files cannot be codened into single `.js` files in isolation without\
    \ unnecessary hacks. ... etc.\n\n**Global Scope**\n\nSure you can use name spaces\
    \ but its still on `window` if you run it in the browser. Namespaces are just\
    \ an unnecessary workaround. Also `/// <reference` comments introduce an global\
    \ context in *your code* that can get hard to maintain. Also if your company has\
    \ several teams working independently and then someone decides to try integrating\
    \ two independently written apps there is a high likelihood of a name conflict.\n"
  mdcn: "\n\n## 类非常有用\n\n通常会有如下结构：\n\n```javascript\nfunction foo() {\n  let someProperty;\n\
    \  // 其他其他初始化代码\n  function someMethod() {\n    // 对 `someProperty` 执行一些事情\n \
    \   // 可能还有其他事情\n  }\n  // 也许还有其他方法\n  return {\n    someMethod,\n    // 可能还有其他方法\n\
    \  };\n}\n```\n\n这被称为*暴露式模块模式* (revealing module pattern)，在 JavaScript 中非常常见（利用了\
    \ JavaScript 的闭包）。\n\n如果你使用*文件模块*（你真的应该这样做，因为全局作用域是糟糕的），那么*你的文件在效果上是相同的的*。但是，在很多情况下，人们会编写像所示的代码：\n\
    \n```javascript\nlet someProperty;\n\nfunction foo() {\n  // 一些初始化代码\n}\n\nfoo();\
    \ // 一些初始化代码\nsomeProperty = 123; // 更多初始化\n// 未导出的工具函数\n// 之后\nexport function\
    \ someMethod() {\n}\n```\n\n虽然我不是继承的忠实粉丝，*但我发现让人们使用类有助于他们更好地组织代码*。同一个开发者会直觉地写出如下：\n\
    \n```typescript\nclass Foo {\n  public someProperty;\n  constructor() {\n    //\
    \ 一些初始化\n  }\n  public someMethod() {\n    // 一些代码\n  }\n  private someUtility()\
    \ {\n    // 一些代码\n  }\n}\n\nexport = new Foo();\n```\n\n不仅是开发者，创建为类提供良好可视化的开发工具要得多，而且你的团队少了一个需要理解和维护的模式。\n\
    \nPS：在我看来，如果*浅层*类层次结构提供显著的重用并减少样板代码，并没有问题。\n\n## **export default 会导致问题**\n\n\
    让我们来看一个例子。假设你有一个文件 `foo.ts`，其内容如下：\n\n```typescript\nclass Foo {\n}\nexport default\
    \ Foo;\n```\n\n你将使用 ES6 语法如下导入它：\n\n```typescript\nimport Foo from \"./foo\";\n\
    ```\n\n这里有几个维护性方面的问题：\n\n- 如果你在 `foo.ts` 中重构 `Foo`，它不会重命名 `bar.ts` 中的它\n- 如果你最终需要从\
    \ `foo.ts` 导出更多内容（你的许多文件都会这样），那么你必须权衡导入语法。\n\n出于这个原因，我建议使用简单的导出 + 解构赋值导入。例如 `foo.ts`：\n\
    \n```typescript\nexport class Foo {\n}\n```\n\n然后：\n\n```typescript\nimport {Foo}\
    \ from \"./foo\";\n```\n\n## 避免 Export Default\n\n**加分项**：你甚至可以在 `import {/*here*/}\
    \ from \"./foo\";` 标标位置获得自动补全。这让你的开发者手腕轻松一点。\n\n**加分项**：更好的 CommonJS 体验。使用 `default`，对于\
    \ CommonJS 用户来说体验很糟糕，他们必须使用 `const {default} = require('module/foo');` 而不是 `const\
    \ {Foo} = require('module/foo')`。\n\n**加分项**：你不会遇到拼写错误，比如一个人写 `import Foo from\
    \ \"./foo\";` 而另一个人写了 `import foo from \"./foo\";`。\n\n**加分项**：自动导入工作更好。你使用 `import\
    \ { Foo } from \"./foo\";`，自动导入就会写入。\n\n**加分项**：重新导出变得不必要的困难。重新导出在 npm 包的根索引中很常见，例如\
    \ `import Foo from \"./foo\"; export { Foo }`（带默认导出）对比 `export * from \"./foo\"\
    `（带具名导出）。\n\n## 限制属性 setter 的使用\n\n优先使用显式的 set/get 函数（例如 `bar(value:{a:number,b:number})`）而不是\
    \ setters/getters。考虑以下代码：\n\n```typescript\nclass Foo {\n  a: number;\n  b: number;\n\
    \  bar(value:{a:number,b:number}) {\n    this.a = value.a;\n    this.b = value.b;\n\
    \  }\n}\nlet foo = new Foo();\n```\n\n这不是对属性 setter的*良好*使用。阅读第一段代码的人对所有将改变的内容没有上下文。而调用\
    \ `foo.bar(value)` 的人可能意识到 `foo` 上可能发生某些变化。加分项：如果你有不同的函数，“查找引用”效果更好，而使用 setter\
    \ 时，你只能得到相关函数的引用。\n\n## Null 是糟糕的\n\nJavaScript（以及衍生的 TypeScript）有两个底类型：`null`\
    \ 和 `undefined`。它们*旨在*表示不同的含义：\n\n- 某些东西尚未初始化：`undefined`\n- 某些东西当前不可用：`null`\n\
    \n大多数其他语言只有一种（通常称为 `null`）。由于 JavaScript 默认会将未初始化的变量/属性求值为 `undefined`，建议你直接用它表示自己的状态。TypeScript\
    \ 代码规范如此如此也没有导致任何问题。Douglas Crockford 认为 `null` 是一个糟糕的主意，我们都应该使用 `undefined`。\n\
    \n## 处理 null 风格的基\n\n如果你的代码库与可能给你返回 `null` 的其他 API 交互，使用 `== undefined` 进行检查（而不是\
    \ `===`）。即使对于可能是*虚假*的值，使用它也是安全的。假设你正在执行 `foo == undefined`，其中 foo 可以是之一：\n\n```javascript\n\
    console.log(undefined == undefined); // true\nconsole.log(null == undefined);\
    \ // true\nconsole.log(0 == undefined); // false\nconsole.log('' == undefined);\
    \ // false\nconsole.log(false == undefined); // false\n```\n\n## 限制 undefined\
    \ 的显式使用\n\n此外因为 TypeScript 给了你*记录*你的机会，在你的代码中**使用结构而不是如下：\n\n```typescript\nfunction\
    \ foo(){\n  // 某些\n  return {a:1};\n}\n```\n\n你应该使用类型注解：\n\n```typescript\nfunction\
    \ foo():{a:number}{\n}\n```\n\n## Node 风格回调\n\nNode 风格的回调通常使用真值检查来处理：\n\n```javascript\n\
    fs.readFile('someFile', 'utf8', (err,data) => {\n  if (err) {\n    // 做事情\n  }\n\
    \  // 没有错误\n});\n```\n\n在创建你自己的 API 时，为了一致性，在这种情况下可以使用 `null`。由于诚实地说，对于你自己的 API，你应该查看\
    \ promises，在这种情况下你不需要担心缺失的值（你通过 `.then` 处理）。\n\n## **outFile 是坏的**\n\n由于以下原因，你使用它是一个糟糕的主意：\n\
    \n- 运行时错误\n- 快速编译\n- 全局作用域\n- 难以分析\n- 难以扩展\n- 引用\n- 代码重用\n- 多目标支持\n- 隔离编译\n\n\
    ### **运行时错误**\n\n如果你的代码依赖于任何形式的 JS 排序，你会得到随机错误。\n\n### **类继承会在运行时崩溃。**\n\n考虑 `foo.ts`：\n\
    \n```typescript\nclass Foo {\n}\n```\n\n以及 `bar.ts`：\n\n```typescript\nclass Bar\
    \ extends Foo {\n}\n```\n\n### **模块分割会在运行时失败。**\n\n考虑 `foo.ts`：\n\n```typescript\n\
    module App {\n  export var foo = 123;\n}\n```\n\n以及 `bar.ts`：\n\n```typescript\n\
    module App {\n  export var bar = foo + 456;\n}\n```\n\n**快速编译**\n\n如果你使用 `--outFile`，那么单个\
    \ `.ts` 文件无法在不进行不黑操作的情况下隔离编译为单个 `.js` 文件\n\n**全局作用域**\n\n确实可以使用命名空间，但如果你在浏览器中运行，它仍在\
    \ `window` 上。命名空间只是一个不必要的变通方法。此外 `/// <reference` 注释会在*你的代码*中引入难以维护的全局上下文。如果你的公司有多个独立工作的团队，然后有人尝试整合两个独立编写的应用程序，极有可能发生命名冲突。\n\
    \n"
