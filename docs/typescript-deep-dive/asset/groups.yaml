    \ = b.prototype`\n\n人们很少在理解第 1 点遇到困难，但许多人对第 2 点感到困惑。因此有必要解释一下。\n\n**d.prototype.__proto__\
    \ = b.prototype**\n\n在指导了许多人关于这一点后，我发现以下解释是最简单的：\n\n在指导了许多人关于这一点后，我发现以下解释是最简单的：\n\
    \n首先，我们将解释 `__extends` 代码等同于 `obj.__proto__ = prototype` 的重要性。JavaScript 中的所有对象都包含一个\
