- md: "\n**Callable**\n\nYou can annotate callables as a part of a type or an interface\
    \ as follows\n\n```typescript\ninterface ReturnString {\n  (): string\n}\n```\n\
    \nAn instance of such an interface would be a function that returns a string e.g.\n\
    \n```typescript\ndeclare const foo: ReturnString;\nconst bar = foo(); // bar is\
    \ inferred as a string\n```\n\n**Obvious examples**\n\nOf course such a *callable*\
    \ annotation can also specify any arguments / optional arguments / rest arguments\
    \ as needed. e.g. here is a complex example:\n\n```typescript\ninterface Complex\
    \ {\n  (foo: string, bar?: number, ...others: boolean[]): number;\n}\n```\n\n\
    They can even specify overloads:\n\n```typescript\ninterface Overloaded {\n  (foo:\
    \ string): string\n  (foo: number): number\n}\n\n// example implementation\nconst\
    \ overloaded: Overloaded = (foo) => foo;\n\n// example usage\nconst str = overloaded('');\
    \ // str is inferred string\nconst number = overloaded(123); // num is inferred\
    \ number\n```\n\nOfcourse like *all* bodies of interfaces / types you can use\
    \ these as variable type annotations e.g.\n\n```typescript\nconst overloaded:\
    \ {\n  (foo: string): string\n  (foo: number): number\n} = (foo) => foo;\n```\n\
    \n**Arrow Syntax**\n\nTo make it easy to specify callable signatures TypeScript\
    \ also allows simple arrow type annotations e.g.\n\n```typescript\nconst simple:\
    \ (foo: number) => string = (foo) => foo.toString();\n```\n\nOnly limitation of\
    \ the arrow syntax: You can't specify overloads. For overloads you must use the\
    \ full bodied `{ (someArgs): someReturn }` syntax.\n\n**Newable**\n\nNewable is\
    \ just a special type of *callable* type annotation with the prefix `new`. It\
    \ simply means that you need to *invoke* with `new` e.g.\n\n```typescript\ninterface\
    \ CallMeWithNewToGetString {\n  new(): string\n}\n\n// Usage \ndeclare const Foo:\
    \ CallMeWithNewToGetString;\nconst bar = new Foo(); // bar is inferred to be of\
    \ type string\n```\n\n**Type Assertion**\n\nTypeScript allows you to override\
    \ its inferred and analyzed view of types in any way you want to. This is done\
    \ by a mechanism called \"type assertion\". TypeScript's type assertion is purely\
    \ you telling the compiler that you know about the types better than it does,\
    \ and that it should not second guess you.\n\nA common use case for type assertion\
    \ is when you are porting over code from JavaScript to TypeScript. For example\
    \ consider the following pattern:\n\n```javascript\nvar foo = {};\nfoo.bar = 123;\
    \ // Error: property 'bar' does not exist on `{}`\nfoo.bas = 'hello'; // Error:\
    \ property 'bas' does not exist on `{}`\n```\n\nHere the code errors because the\
    \ *inferred* type of `foo` is `{}` i.e. an object with zero properties. Therefore\
    \ you are not allowed to add `bar` or `bas` to it. You can fix this simply by\
    \ a type assertion as `Foo`:\n\n```typescript\ninterface Foo {\n  bar: number;\n\
    \  bas: string;\n}\n\nvar foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas = 'hello';\n\
    ```\n\n**as foo** vs. **<foo>**\n\nOriginally the syntax that was added was `<foo>`.\
    \ This is demonstrated below:\n\n```javascript\nvar foo: any;\nvar bar = <string>\
    \ foo; // bar is now of type \"string\"\n```\n\nHowever there is an ambiguity\
    \ in the language grammar when using `<foo>` style assertions in JSX:\n\n```javascript\n\
    var foo = <string>bar;\n</string>\n```\n\nTherefore it is now recommended that\
    \ you just use `as foo` for consistency.\n\n**Type Assertion vs. Casting**\n\n\
    The reason why it's not called \"type casting\" is that *casting* generally implies\
    \ some sort of runtime support. However *type assertions* are purely a compile\
    \ time construct and a way for you to provide hints to the compiler on how you\
    \ want your code to be analyzed.\n\n**Assertion considered harmful**\n\nIn many\
    \ cases assertion will allow you to easily migrate legacy code (and even copy\
    \ paste other code samples into your codebase), however you should be careful\
    \ with your use of assertions. Take our original code as a sample, the compiler\
    \ will not protect you from forgetting to *actually add the properties you promised*:\n\
    \n```typescript\ninterface Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo\
    \ = {} as Foo;\n// ahhhh .... forget something?\n```\n\nAlso another common thought\
    \ is using an assertion as a means of providing *autocomplete* e.g.:\n\n```typescript\n\
    interface Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo = <Foo>{\n  // the\
    \ compiler will provide autocomplete for properties of Foo\n  // But it is easy\
    \ for the developer to forget adding all the properties\n  // Also this code is\
    \ likely to break if Foo gets refactored (e.g. a new property added)\n};\n```\n\
    \nbut the hazard here is the same, if you forget a property the compiler will\
    \ not complain. It is better if you do the following:\n\n```typescript\ninterface\
    \ Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo:Foo = {\n  // the compiler\
    \ will provide autocomplete for properties of Foo\n};\n```\n\nIn some cases you\
    \ might need to create a temporary variable, but at least you will not be making\
    \ (possibly false) promises and instead relying on the type inference to do the\
    \ checking for you.\n\n**Double assertion**\n\nThe type assertion despite being\
    \ a bit of, is not unsafe. e.g. the following is not:\n\n```typescript\ninterface\
    \ Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo:Foo = {\n  // the compiler\
    \ will provide autocomplete for properties of Foo\n};\n```\n\nIn some cases you\
    \ might need to create a temporary variable, but at least you will not be making\
    \ (possibly false) promises and instead relying on the type inference to do the\
    \ checking for you.\n\n**Double assertion**\n\nThe type assertion despite being\
    \ a bit of, is not unsafe. e.g. the following is not:\n\n```typescript\ninterface\
    \ Foo {\n  bar: number;\n  bas: string;\n}\n\nvar foo:Foo = {\n  // the compiler\
