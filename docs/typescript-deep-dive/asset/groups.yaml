    \nJavaScript is the object literal:\n\nvar foo = {\n\n bar: {\n\n bas: 123\n\n\
    \ }\n\n};\n\nWithout the awesome *structuring* support built into JavaScript,\
    \ creating new objects on the\n\nfly would indeed be very cumbersome. Destructuring\
    \ brings the same level of convenience\n\nto getting data out of a structure.\n\
    \n**Object Destructuring**\n\nDestructuring is useful because it allows you to\
