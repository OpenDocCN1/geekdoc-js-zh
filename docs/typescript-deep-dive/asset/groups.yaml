  - "[PAGE 189]\n\n**Never**\n\nA video lesson on the never type\n\nProgramming language\
    \ design does have a concept of *bottom* type that is a **natural**\n\noutcome\
    \ as soon as you do *code flow analysis*. TypeScript does *code flow analysis*\
    \ (ᚕ) and\n\nso it needs to reliably represent stuff that might never happen.\n\
    \nThe  never  type is used in TypeScript to denote this *bottom* type. Cases when\
    \ it occurs\n\nnaturally:\n\nA function never returns (e.g. if the function body\
    \ has  while(true){} )\n\nA function always throws (e.g. in  function foo(){throw\
    \ new Error('Not Implemented')} \n\nthe return type of  foo  is  never )\n\nOf\
    \ course you can use this annotation your self as well\n\nlet foo: never; // Okay\n\
    \nHowever  never  *can only ever be assigned to another never*. e.g.\n\nlet foo:\
    \ never = 123; // Error: Type number is not assignable to never\n\n// Okay as\
    \ the function's return type is \\`never\\`\n\nlet bar: never = (() => { throw\
    \ new Error('Throw my hands in the air like I just dont \n\ncare') })();\n\nGreat.\
    \ Now let's just jump into its key use case :)\n\n**Use case: Exhaustive Checks**\n\
    \nYou can call never functions in a never context\n\nNever Type\n\n190"
- md: "\nfunction foo(x: string | number): boolean {\n  if (typeof x === \"string\"\
    ) {\n    return true;\n  } else if (typeof x === \"number\") {\n    return false;\n\
    \  }\n  // Without a never type we would error :\n  // - Not all code paths return\
    \ a value (strict null checks)\n  // - Or Unreachable code detected\n  // But\
    \ because typescript understands that `fail` function returns `never`\n  // It\
    \ can allow you to call it as you might be using it for runtime safety / exhaustive\
    \ checks.\n  fail(\"Unexhaustive!\");\n}\n\nfunction fail(message: string) { throw\
    \ new Error(message); }\n\nAnd because `never` is only assignable to another `never`\
    \ you can use it for *compile time* exhaustive checks as well. This is covered\
    \ in the *discriminated union* section.\n\n## Confusion with `void`\n\nAs soon\
    \ as someone tells you that `never` is returned when a function never exits gracefully\
    \ you intuitively want to think of it as the same as `void`. However `void` is\
    \ a Unit. `never` is a falsum.\n\nA function that *returns* nothing returns a\
    \ Unit `void`. However a function *that never returns* (or always throws) returns\
    \ `never`. `void` is something that can be assigned (without strictNullChecking)\
    \ but `never` can *never* be assigned to anything other than `never`.\n\n## Never\
    \ Type\n\n## Discriminated Union\n\nIf you have a class with a *literal member*\
    \ then you can use that property to discriminate between union members.\n\nAs\
    \ an example consider the union of a `Square` and `Rectangle`, here we have a\
    \ member `kind` that exists on both union members and is of a particular *literal\
    \ type*:\n\n```typescript\ninterface Square {\n  kind: \"square\";\n  size: number;\n\
    }\n\ninterface Rectangle {\n  kind: \"rectangle\";\n  width: number;\n  height:\
    \ number;\n}\n\ntype Shape = Square | Rectangle;\n```\n\nIf you use a type guard\
    \ check (`==`, `===`, `!=`, `!==`) on the *discriminant* *property* (here `kind`)\
    \ TypeScript will realize that means the object has that literal and do a type\
    \ narrowing for you:\n\n```typescript\nfunction area(s: Shape) {\n  if (s.kind\
    \ === \"square\") {\n    // Now TypeScript knows that s must be a square\n   \
    \ // So you can use its members safely\n    return s.size;\n  } else {\n    //\
    \ Wasn't a square? So TypeScript will figure out it must be Rectangle\n    //\
    \ So you can use its members safely\n    return s.width;\n  }\n}\n```\n\n## Exhaustive\
    \ Checks\n\nQuite commonly you want to make sure that all members of a union have\
    \ code against them.\n\n```typescript\ninterface Square {\n  kind: \"square\"\
    ;\n  size: number;\n}\n\ninterface Rectangle {\n  kind: \"rectangle\";\n  width:\
    \ number;\n  height: number;\n}\n\n// Someone just added this\ninterface Circle\
    \ {\n  kind: \"circle\";\n  radius: number;\n}\n\ntype Shape = Square | Rectangle\
    \ | Circle;\n```\n\nAs an example of where stuff goes:\n\n```typescript\nfunction\
    \ area(s: Shape) {\n  if (s.kind === \"square\") {\n    return s.size;\n  } else\
    \ if (s.kind === \"rectangle\") {\n    return s.width;\n  } else {\n    // ERROR:\
    \ `Circle` is not assignable to `never`\n    // Would it be great if you could\
    \ get TypeScript to give you an error?\n    // You can do that by simply adding\
    \ a fallthrough and making sure that\n    // the inferred type in that block is\
    \ compatible with the `never` type.\n    const exhaustiveCheck: never = s;\n \
    \ }\n}\n```\n\n## Switch\n\nTIP: of course you can also do it in a `switch` statement:\n\
    \n```typescript\nfunction area(s: Shape) {\n  switch (s.kind) {\n    case \"square\"\
    : return s.size;\n    case \"rectangle\": return s.width;\n    case \"circle\"\
    : return Math.radius;\n    default: const exhaustiveCheck: never = s;\n  }\n}\n\
    ```\n\nIf using strictNullChecks and doing exhaustive checks, you should return\
    \ the `exhaustiveCheck` variable (of type `never`) as well, otherwise TypeScript\
    \ infers a possible return of `undefined`. So:\n\n```typescript\nfunction area(s:\
    \ Shape) {\n  switch (s.kind) {\n    case \"square\": return s.size;\n    case\
    \ \"rectangle\": return s.width;\n    case \"circle\": return Math.radius;\n \
    \   default:\n      const exhaustiveCheck: never = s;\n      return exhaustiveCheck;\n\
    \  }\n}\n```\n\n## Redux\n\nA popular library that makes use of this is redux.\
    \ Here is the *gist of redux* with TypeScript type annotations added:\n\n```typescript\n\
    import { createStore } from 'redux'\n\ntype Action = {\n  type: 'INCREMENT'\n\
    } | {\n  type: 'DECREMENT'\n}\n\n/**\n * This is a reducer, a pure function with\
    \ (state, action) => state signature.\n * It describes how an action transforms\
    \ the state into the next state.\n *\n * The shape of the state is up to you:\
    \ it can be a primitive, an array, an object,\n * or even an Immutable.js data\
    \ structure. The only important part is that you should\n * not mutate the state\
    \ object, but return a new object if the state changes.\n *\n * In this example,\
    \ we use a `switch` statement and strings, but you can use a helper\n * that follows\
    \ a different convention (such as function maps) if it makes sense for your\n\
    \ * project.\n */\nfunction counter(state = 0, action: Action) {\n  switch (action.type)\
    \ {\n    case 'INCREMENT':\n      return state + 1;\n    case 'DECREMENT':\n \
    \     return state - 1\n    default:\n      return state\n  }\n}\n\n// Create\
    \ a Redux store holding the state of your app.\n// Its API is { subscribe, dispatch,\
    \ getState }.\nlet store = createStore(counter)\n\n// You can use subscribe()\
    \ to update the UI in response to state changes.\n// Normally you'd use a view\
    \ binding library (e.g. React Redux) rather than subscribe() directly.\n// However\
    \ it can also be handy to persist the current state in the localStorage.\nstore.subscribe(()\
    \ =>\n  console.log(store.getState())\n)\n// The only way to mutate the internal\
    \ state is to dispatch an action.\n// The actions can be serialized, logged or\
    \ stored and later replayed.\nstore.dispatch({ type: 'INCREMENT' });\nstore.dispatch({\
    \ type: 'DECREMENT' });\n```\n\n## Index Signatures\n\nFirst off, because JavaScript\
    \ *implicitly* calls `toString` on any object index signature, TypeScript will\
    \ give you an error to prevent beginners from shooting themselves in the foot\
    \ (I see users shooting themselves in their feet when using JavaScript all the\
    \ time on stackflow):\n\n```typescript\nlet obj = {\n  toString(){\n    return\
    \ 'Hello'\n  }\n}\n\nlet foo:any = {};\n// ERROR: the index signature must be\
    \ string, number ...\nfoo[obj] = 'World';\n\n// FIX: TypeScript forces you to\
    \ be explicit\nfoo[obj.toString()] = 'World';\n```\n\nThe reason for forcing the\
    \ user to be explicit is because the default `toString` implementation on an object\
    \ is pretty awful, e.g. on v8 it always returns `[object Object]`:\n\n```typescript\n\
    let obj = {message:'Hello'}\nlet foo:any = {};\n// ERROR: the index signature\
    \ must be string, number ...\nfoo[obj] = 'World';\n// Here is what you actually\
    \ stored!\n```typescript\n\nArrays are slightly different. For `number` indexing\
    \ JavaScript VMs will try to optimise (depending on things like it actually an\
    \ array and do the structures of items match etc.). So `number` should be considered\
    \ as a valid object accessor in its own right (distinct from `string`). Here is\
    \ a simple array example:\n\n```typescript\nlet foo = ['World'];\nconsole.log(foo[0]);\
    \ // World\n```\n"
  mdcn: "\n\nfunction foo(x: string | number): boolean {\n  if (typeof x === \"string\"\
    ) {\n    return true;\n  } else if (typeof x === \"number\") {\n    return false;\n\
    \  }\n  // 如果没有 never 类型，将会报错：\n  // - 并非所有代码路径都返回了（严格空检查）\n  // - 或者检测到不可达代码\n\
    \  // 但因为 TypeScript 知道 `fail` 函数返回 `never`\n  // 它可以允许你调用它，因为你可能将其用于运行时安全检查/穷尽检查。\n\
    \  fail(\"Unexhaustive!\");\n}\n\nfunction fail(message: string) { throw new Error(message);\
    \ }\n\n由于 `never` 只能赋值给另一个 `never`，你也可以将它用于*编译时*的穷尽检查。这在*判别联合类型*章节中有介绍。\n\n##\
    \ 与 `void` 的混淆\n\n当有人告诉你当函数永远不会正常退出时会返回 `never`，你直觉上会认为它等同于 `void`。然而 `void` 是一个单元类型（Unit）。`never`\
    \ 是一个假值（falsum）。\n\n一个*返回*没有任何内容的函数返回单元类型 `void`。但一个*从不返回*（或始终抛异常）的函数返回 `never`。`void`\
    \ 是可以被赋值的（在不开启严格空检查的情况下），但 `never` *永远*不能赋值给 `never`以外的任何内容。\n\n## Never 类型\n\n\
    ## 判别联合类型\n\n如果你有一个带有*字面量成员*的类，可以使用该属性来区分联合类型的成员。\n\n例如，考虑 `Square` 和 `Rectangle`\
    \ 的联合类型，这里我们有一个存在于两个联合成员中的成员 `kind`，它的类型是特定的*字面量类型*：\n\n```typescript\ninterface\
    \ Square {\n  kind: \"square\";\n  size: number;\n}\n\ninterface Rectangle {\n\
    \  kind: \"rectangle\";\n  width: number;\n  height: number;\n}\n\ntype Shape\
    \ = Square | Rectangle;\n```\n\n如果你对*判别*属性*（此处为 `kind`）使用类型守卫检查（`==`, `===`, `!=`,\
    \ `!==`），TypeScript 将意识到这意味着该对象拥有该字面量，并为你进行类型收窄：\n\n```typescript\nfunction area(s:\
    \ Shape) {\n  if (s.kind === \"square\") {\n    // 现在 TypeScript 知道 s 必须是一个 square\n\
    \    // 所以你可以安全地使用它的成员\n    return s.size;\n  } else {\n    // 不是 square？那么 TypeScript\
    \ 会判断它必须是 Rectangle\n    // 所以你可以安全地使用它的成员\n    return s.width;\n  }\n}\n```\n\
    \n## 穷尽检查\n\n通常情况下，你想确保联合类型中的所有成员都有对应的代码处理。\n\n```typescript\ninterface Square\
    \ {\n  kind: \"square\";\n  size: number;\n}\n\ninterface Rectangle {\n  kind:\
    \ \"rectangle\";\n  width: number;\n  height: number;\n}\n\n// 有人新添加了这个\ninterface\
    \ Circle {\n  kind: \"circle\";\n  radius: number;\n}\n\ntype Shape = Square |\
    \ Rectangle | Circle;\n```\n\n关于代码放置位置的示例：\n\n```typescript\nfunction area(s:\
    \ Shape) {\n  if (s.kind === \"square\") {\n    return s.size;\n  } else if (s.kind\
    \ === \"rectangle\") {\n    return s.width;\n  } else {\n    // 错误：`Circle` 不可赋值给\
    \ `never`\n    // 如果能让 TypeScript 给你一个错误那不是很好吗？\n    // 你只需添加一个贯穿（fallthrough）并确保\n\
    \    // 该代码块中推断出的类型与 `never` 类型兼容即可实现。\n    const exhaustiveCheck: never = s;\n\
    \  }\n}\n```\n\n## Switch\n\n提示：当然你也可以在 `switch` 语句这样做：\n\n```typescript\nfunction\
    \ area(s: Shape) {\n  switch (s.kind) {\n    case \"square\": return s.size;\n\
    \    case \"rectangle\": return s.width;\n    case \"circle\": return Math.radius;\n\
    \    default: const exhaustiveCheck: never = s;\n  }\n}\n```\n\n如果使用了严格空检查并进行穷尽检查，你也应该返回\
    \ `exhaustiveCheck` 变量（类型为 `never`），否则 TypeScript 会推断可能返回 `undefined`。因此：\n\n\
    ```typescript\nfunction area(s: Shape) {\n  switch (s.kind) {\n    case \"square\"\
    : return s.size;\n    case \"rectangle\": return s.width;\n    case \"circle\"\
    : return Math.radius;\n    default:\n      const exhaustiveCheck: never = s;\n\
    \      return exhaustiveCheck;\n  }\n}\n```\n\n## Redux\n\n使用此特点的流行库是 redux。这里是添加了\
    \ TypeScript 类型注解的*redux 核心*：\n\n```typescript\nimport { createStore } from 'redux'\n\
    \ntype Action = {\n  type: 'INCREMENT'\n} | {\n  type: 'DECREMENT'\n}\n\n/**\n\
    \ * 这是一个 reducer，一个签名名为 (state, action) => state 的纯函数。\n * 它描述了 action 如何将状态转换为下一个状态。\n\
    \ *\n * 状态的形状由你决定：它可以是原始类型、数组、对象，\n * 甚至是 Immutable.js 数据结构。唯一重要的部分是你不应该\n * 变异状态对象，而是在状态变化时返回一个新对象。\n\
    \ *\n * 在此示例中，我们使用了 `switch` 语句和字符串，但你可以使用辅助\n * 函数，如果这对你的项目有不同的约定（例如函数映射）。\n\
    \ */\nfunction counter(state = 0, action: Action) {\n  switch (action.type) {\n\
    \    case 'INCREMENT':\n      return state + 1\n    case 'DECREMENT':\n      return\
    \ state - 1\n    default:\n      return state\n  }\n}\n\n// 创建一个持有应用状态的 redux\
    \ store。\n// 它的 API 是 { subscribe, dispatch, getState }。\nlet store = createStore(counter)\n\
    \n// 你可以使用 subscribe 根据状态变化更新 UI。\n// 通常你会使用绑定库（例如 React Redux）而不是直接使用 subscribe()。\n\
    // 但将当前状态持久化到 localStorage 很有用。\nstore.subscribe(() =>\n  console.log(store.getState())\n\
    )\n// 修改内部状态的方法是 dispatch action。\n// action 可以序列化、记录或存储并在以后重放。\nstore.dispatch({\
    \ type: 'INCREMENT' });\nstore.dispatch({ type: 'DECREMENT' });\n```\n\n## 索引签名\n\
    \n首先，由于 JavaScript 会隐式的对任何对象索引签名调用 `toString`，TypeScript 会给你一个错误，以防止初学者自讨苦吃（我经常看到用户在\
    \ stackflow 上使用 JavaScript 时这样做）：\n\n```typescript\nlet obj = {\n  toString(){\n\
    \    return 'Hello'\n  }\n}\n\nlet foo:any = {};\n// 错误：索引签名必须是 string 或 number\
    \ ...\nfoo[obj] = 'World';\n\n// 修复：TypeScript 强制你显式处理\nfoo[obj.toString()] =\
    \ 'World';\n```\n\n强制用户显式的原因是因为对象默认的 `toString` 实现非常糟糕，例如在 v8 上它总是返回 `[object\
    \ Object]`：\n\n```typescript\nlet obj = {message:'Hello'}\nlet foo:any = {};\n\
    // 错误：索引签名必须是 string 或 number ...\nfoo[obj] = 'World';\n// 这里就是你实际存储的内容！\n```typescript\n\
    \n数组略有不同。对于 `number` 索引，JavaScript 虚拟机会尝试进行优化（取决于它是否真的是数组以及项的结构是否匹配等）。因此，`number`\
    \ 应该被视为一个独立的对象访问器（区别于 `string`）。这里有一个简单的数组示例：\n\n```typescript\nlet foo = ['World'];\n\
    console.log(foo[0]); // World\n```\n\n"
