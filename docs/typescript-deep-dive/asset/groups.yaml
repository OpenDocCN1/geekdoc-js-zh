  - "[PAGE 146]\n\nParameter Annotations\n\nReturn Type Annotation\n\nOptional Parameters\n\
    \nOverloading\n\n**Functions**\n\nThe TypeScript type system pays a lot of love\
    \ to functions, after all they are the core building\n\nblock of a composable\
    \ system.\n\n**Parameter annotations**\n\nOf course you can annotate function\
    \ parameters just like you can annotate other variables:\n\n// variable annotation\n\
    \nvar sampleVariable: { bar: number }\n\n// function parameter\n\nfunction foo(sampleParameter:\
    \ { bar: number }) { }\n\nHere I used inline type annotations. Of course you can\
    \ use interfaces etc.\n\n**Return type annotation**\n\nYou can annotate the return\
    \ type after the function parameter list with the same style as you\n\nuse for\
    \ a variable, e.g.  : Foo  in the below example:\n\ninterface Foo {\n\n foo: string;\n\
    \n}\n\n// Return type annotated as \\`: Foo\\`\n\nfunction foo(sample: Foo): Foo\
    \ {\n\n return sample;\n\n}\n\nOf course I used an  interface  here, but you are\
    \ free to use other annotations e.g. inline\n\nannotations.\n\nQuite commonly\
    \ you don't *need* to annotate the return type of a function as it can generally\n\
    \nbe inferred by the compiler.\n\nFunctions\n\n147"
