- md: "\nclass that inherits from the abstract class .\n\nabstract **members** cannot\
    \ be directly accessed and a child class must provide the functionality.\n\n**Constructor\
    \ is optional**\n\nThe class does not need to have a constructor. e.g. the following\
    \ is perfectly fine.\n\n```typescript\nclass Foo {}\n\nvar foo = new Foo();\n\
    ```\n\n**Define using constructor**\n\nHaving a member in a class and initializing\
    \ it like below:\n\n```typescript\nclass Foo {\n  x: number;\n  constructor(x:number)\
    \ {\n    this.x = x;\n  }\n}\n```\n\nis such a common pattern that TypeScript\
    \ provides a shorthand where you can prefix the member with an *access modifier*\
    \ and it is automatically declared on the class and copied from the constructor.\
    \ So the previous example can be re-written as (notice public x:number ):\n\n\
    ```typescript\nclass Foo {\n  constructor(public x:number) {\n  }\n}\n```\n\n\
    **Property initializer**\n\nThis is a nifty feature supported by TypeScript (from\
    \ ES7 actually). You can initialize any member of the class outside the class\
    \ constructor, useful to provide default (notice members = [])\n\n```typescript\n\
    class Foo {\n  members = []; // Initialize directly\n  add(x) {\n    this.members.push(x);\n\
    \  }\n}\n```\n\nClasses\n\n**What's up with the IIFE**\n\nThe js generated for\
    \ the class could have been:\n\n```javascript\nfunction Point(x, y) {\n  this.x\
    \ = x;\n  this.y = y;\n}\n\nPoint.prototype.add = function (point) {\n  return\
    \ new Point(this.x + point.x, this.y + point.y);\n};\n```\n\nThe reason its wrapped\
    \ in an Immediately-Invoked Function Expression (IIFE) i.e.\n\n(function () {\n\
    \  // BODY\n  return Point;\n})();()\n\nhas to do with inheritance. It allows\
    \ TypeScript to capture the base class as a variable _super e.g.\n\n```javascript\n\
    var Point3D = (function (_super) {\n  __extends(Point3D, _super);\n  function\
    \ Point3D(x, y, z) {\n    _super.call(this, x, y);\n    this.z = z;\n  }\n  Point3D.prototype.add\
    \ = function (point) {\n    var point2D = _super.prototype.add.call(this, point);\n\
    \    return new Point3D(point2D.x, point2D.y, this.z + point.z);\n  };\n  return\
    \ Point3D;\n})(Point);\n```\n\nNotice that the IIFE allows TypeScript to easily\
    \ capture the base class Point in a _super variable and that is used consistently\
    \ in the class body.\n\n**__extends__**\n\nYou will notice that as soon as you\
    \ inherit a class TypeScript also generates the following function:\n\n```javascript\n\
    var __extends = this.__extends || function (d, b) {\n  for (var p in b) if (b.hasOwnProperty(p))\
    \ d[p] = b[p];\n  function __() { this.constructor = d; }\n  ___.prototype = b.prototype;\n\
    \  d.prototype = new ____();\n};\n```\n\nHere `d` refers to the derived class\
    \ and `b` refers to the base class. This function does two things:\n\n1. copies\
    \ the static members of the base class onto the child class i.e. `for (var p in\
    \ b) if (b.hasOwnProperty(p)) d[p] = b[p];`\n2. sets up the child class function's\
    \ prototype to optionally lookup members on the parent's proto i.e. effectively\
    \ `d.prototype.__proto__ = b.prototype`\n\nPeople rarely have trouble understanding\
    \ 1, but many people struggle with 2. So an explanation is in order.\n\n**d.prototype.__proto__\
    \ = b.prototype**\n\nAfter having tutored many people about this I find the following\
    \ explanation to be simplest.\n\nFirst we will explain how the code from `__extends__`\
    \ is equivalent to the simple `d.prototype.__proto__ = b.prototype`, and then\
    \ why this line in itself is significant. To understand all this you need to know\
    \ these things:\n\n1. `__proto__`\n2. prototype\n3. effect of `new` on `this`\
    \ inside the called function\n4. effect of `new` on `prototype` and `__proto__`\n\
    \nAll objects in JavaScript contain a `__proto__` member. This member is often\
    \ not accessible in older browsers (sometimes documentation refers to this magical\
    \ property as `[[prototype]]`). It has one objective: If a property is not found\
    \ on an object during lookup (e.g. `obj.property`) then it is looked up at `obj.__proto__.property`.\
    \ If it is still not found then `obj.__proto__.__proto__.property` till either:\
    \ *it is found* or *the latest **.__proto__ ** itself is* *null*. This explains\
    \ why JavaScript is said to support *prototypal inheritance* out of the box.\n\
    \nThis is shown in the following example, which you can run in the chrome console\
    \ or Node.js:\n\n```javascript\nvar foo = {}\n// setup on foo as well as foo.__proto__\n\
    foo.bar = 123;\nfoo.__proto__.bar = 456;\nconsole.log(foo.bar); // 123\ndelete\
    \ foo.bar; // remove from object\nconsole.log(foo.bar); // 456\ndelete foo.__proto__.bar;\
    \ // remove from foo.__proto__\nconsole.log(foo.bar); // undefined\n```\n\nCool\
    \ so you understand `__proto__`. Another useful information is that all functions\
    \ in JavaScript have a property called `prototype` and that it has a member `constructor`\
    \ pointing back to the function. This is shown below:\n\n```javascript\nfunction\
    \ Foo() { }\nconsole.log(Foo.prototype); // {} i.e. it exists and is not undefined\n\
    console.log(Foo.prototype.constructor === Foo); // Has a member called `constructor`\
    \ pointing back to the function\n```\n\nNow let's look at *effect of **new** on\
    \ **this** inside the called function*. Basically `this` inside the called function\
    \ is going to point to the newly created object that will be returned from the\
    \ function. It's simple to see if you mutate a property on `this` inside the function:\n\
    \n```javascript\nfunction Foo() {\n  this.bar = 123;\n}\nvar foo = new Foo();\n\
    console.log(foo.bar); // 123\n```\n\nThe only other thing you need to know is\
    \ that `new` sets the `__proto__` of the new object to the function's `prototype`.\
    \ This is shown by code:\n\n```javascript\nfunction Foo() { }\nconsole.log(foo.__proto__\
    \ === Foo.prototype); // True\n```\n\nWait, the OCR text seems a bit jumbled at\
    \ the end, but the logic follows that `new` creates an object, sets `this` to\
    \ that object, and sets `__proto__` to the constructor's `prototype`.\n"
  mdcn: "\n继承自抽象类的类。\n\n抽象**成员**不能被直接访问，子类必须提供这些功能。\n\n**构造函数是可选的**\n\n类不需要有构造函数。例如，以下代码完全可以。\n\
    \n```typescript\nclass Foo {}\n\nvar foo = new Foo();\n```\n\n**使用构造函数定义**\n\n\
