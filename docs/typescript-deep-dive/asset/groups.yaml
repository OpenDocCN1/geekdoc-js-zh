- md: "\n## Object spread\n\nYou can also spread an object into another object. A\
    \ common use case is to simply add a property to an object without mutating the\
    \ original:\n\n```javascript\nconst point2d = {x: 1, y: 2};\n\n/** Create a new\
    \ object by using all the point2D props along with z */\nconst point3D = {...point2D,\
    \ z: 3};\n```\n\nAnother common use case is a simple shallow extend:\n\n```javascript\n\
    const foo = {a: 1, b: 2};\nconst bar = {c: 1, d: 2};\n\n/** Merge foo and bar\
    \ */\nconst fooBar = {...foo, ...bar};\n```\n\n### Summary\n\nSpread is something\
    \ that you would inevitably do in JavaScript, so it's good to have a better syntax\
    \ where you don't have that ugly `null` for the `this` argument. Also having a\
    \ dedicated syntax for moving arrays out of (destructuring) or into (assignment)\
    \ other arrays provides neat syntax for when you are doing array processing on\
    \ partial arrays.\n\n## for...of\n\nA common error experienced by beginning JavaScript\
    \ developers is that `for...in` for an array does not iterate over the array items.\
    \ Instead it iterates over the *keys* of the object passed in. This is demonstrated\
    \ in the below example. Here you would expect 9, 2, 5 but you get the indexes\
    \ 0, 1, 2:\n\n```javascript\nvar someArray = [9, 2, 5];\n\nfor (var item in someArray)\
    \ {\n  console.log(item); // 0,1,2\n}\n```\n\nThis is one of the reasons why `for...of`\
    \ exists in TypeScript (and ES6). The following iterates over the array correctly\
    \ logging out the members as expected:\n\n```javascript\nvar someArray = [9, 2,\
    \ 5];\n\nfor (var item of someArray) {\n  console.log(item); // 9,2,5\n}\n```\n\
    \nSimilarly TypeScript has no trouble going through a string character by character\
    \ using `for...of`:\n\n```javascript\nvar hello = \"is it me you're looking for?\"\
    ;\n\nfor (var char of hello) {\n  console.log(char); // is it me you're looking\
    \ for?\n}\n```\n\n### JS Generation\n\nFor pre ES6 targets TypeScript will generate\
    \ the standard `for (var i = 0; i < list.length; i++)` kind of loop. For example\
    \ here's what gets generated for our previous example:\n\n```javascript\nvar someArray\
    \ = [9, 2, 5];\n\nfor (var item of someArray) {\n  console.log(item);\n}\n\n//\
    \ becomes //\nfor (var _i = 0; _i < someArray.length; _i++) {\n  var item = someArray[_i];\n\
    \  console.log(item);\n}\n```\n\nYou can see that using `for...of` makes *intent*\
    \ clearer and also decreases the amount of code you have to write (and variable\
    \ names you need to come up with).\n\n### Limitations\n\nIf you are not targeting\
    \ ES6 or above, the generated code assumes the property `length` exists on the\
    \ object and that the object can be indexed via numbers e.g. `obj[2]`. So it is\
    \ only supported on `string` and `array` for these legacy JS engines.\n\nIf TypeScript\
    \ can see that you are not using an array or a string it will give you a clear\
    \ error *\"is not an array type or a string type\"*:\n\n```javascript\nlet articleParagraphs\
    \ = document.querySelectorAll(\"article > p\");\n\n// Error: Nodelist is not an\
    \ array type or a string type\nfor (let paragraph of articleParagraphs) {\n  paragraph.classList.add(\"\
    read\");\n}\n```\n\nUse `for...of` only for stuff that *you know* to be an array\
    \ or a string. Note that this limitation might be removed in a future version\
    \ of TypeScript.\n\n### Summary\n\nYou would be surprised at how many times you\
    \ will be iterating over the elements of an array. The next time you find yourself\
    \ doing that, give `for...of` a go. You might just make the next person who reviews\
    \ your code happy.\n\n## Iterators\n\nIterator itself is not a TypeScript or ES6\
    \ feature, Iterator is a Behavioral Design Pattern common for Object oriented\
    \ programming languages. It is, generally, an object which implements the following\
    \ interface:\n\n```typescript\ninterface Iterator<T> {\n  next(value?: any): IteratorResult<T>;\n\
    \  return?(value?: any): IteratorResult<T>;\n  throw?(e?: any): IteratorResult<T>;\n\
    }\n```\n\nThis interface allows to retrieve a value from some collection or sequence\
    \ which belongs to the object.\n\nThe `IteratorResult` is simply a `value + done`\
    \ pair:\n\n```typescript\ninterface IteratorResult<T> {\n  done: boolean;\n  value:\
    \ T;\n}\n```\n\nImagine that there's an object of some frame, which includes the\
    \ list of components of which this frame consists. With Iterator interface it\
    \ is possible to retrieve components from this frame object like below:\n\n![img/416f69818aa79e3f1fe0e7869c118431_54_0.png](img/416f69818aa79e3f1fe0e7869c118431_54_1.png)\n\
    \n```javascript\n'use strict';\n\nclass Component {\n  constructor (public name:\
    \ string) {}\n}\n\nclass Frame {\n  public components = [];\n  constructor(public\
    \ name: string) {}\n\n  [Symbol.iterator]() {\n    let pointer = 0;\n    return\
    \ {\n      next() {\n        if (pointer < this.components.length) {\n       \
    \   return {\n            done: false,\n            value: this.components[pointer++]\n\
    \          };\n        } else {\n          return {\n            done: true,\n\
    \            value: null\n          };\n        }\n      }\n    };\n  }\n}\n\n\
    let frame = new Frame(\"main\");\nframe.components.push(new Component(\"header\"\
    ));\nframe.components.push(new Component(\"body\"));\nframe.components.push(new\
    \ Component(\"footer\"));\n\nfor (let component of frame) {\n  console.log(component.name);\n\
    }\n```"
  mdcn: "\n\n## 对象展开 (Object spread)\n\n你也可以将对象展开到另一个对象中。一个常见的用例是仅向对象添加属性而不修改原始对象：\n\
    \n```javascript\nconst point2d = {x: 1, y: 2};\n\n/** 使用所有的 point2D 属性并加上 z 创建新对象\
    \ */\nconst point3D = {...point2D, z: 3};\n```\n\n另一个常见的用例是简单的浅扩展：\n\n```javascript\n\
    const foo = {a: 1, b: 2};\nconst bar = {c: 1, d: 2};\n\n/** 合并 foo 和 bar */\n\
    const fooBar = {...foo, ...bar};\n```\n\n### 总结\n\n展开（Spread）是你在 JavaScript 中不可避免的操作，因此拥有更好的语法是很好的，这样你就不需要为\
    \ `this` 参数使用那个丑陋的 `null`。此外，用于将数组从其他数组移出（解构）或移入其他数组（赋值）的专用语法，为你对部分数组进行处理时提供了整洁的语法。\n\
    \n## for...of\n\n初级 JavaScript 经常遇到的一个错误是，对数组使用 `for...in` 并不会遍历数组项。相反，它遍历的是传入对象的*键\
    \ (keys)*。下面的示例演示了这一点。在这里你预期得到 9, 2, 5，但得到的是索引 0, 1, 2：\n\n```javascript\nvar\
    \ someArray = [9, 2, 5];\n\nfor (var item in someArray) {\n  console.log(item);\
    \ // 0,1,2\n}\n```\n\n这就是为什么 `for...of` 存在于 TypeScript（以及 ES6）中的原因之一。下面的代码可以正确遍历数组，并按预期打印成员：\n\
    \n```javascript\nvar someArray = [9, 2, 5];\n\nfor (var item of someArray) {\n\
    \  console.log(item); // 9,2,5\n}\n```\n\n同样，TypeScript 也可以轻松使用 `for...of` 逐字符遍历字符串：\n\
    \n```javascript\nvar hello = \"is it me you're looking for?\";\n\nfor (var char\
    \ of hello) {\n  console.log(char); // is it me you're looking for?\n}\n```\n\n\
    ### JS 生成\n\n对于预 ES6 目标，TypeScript 将生成标准的 `for (var i = 0; i < list.length; i++)`\
    \ 类型的循环。例如，对于我们之前的示例，生成的代码如下：\n\n```javascript\nvar someArray = [9, 2, 5];\n\n\
    for (var item of someArray) {\n  console.log(item);\n}\n\n// 变为 //\nfor (var _i\
    \ = 0; _i < someArray.length; _i++) {\n  var item = someArray[_i];\n  console.log(item);\n\
    }\n```\n\n你可以看到，使用 `for...of` 让*意图*更加清晰，并且减少了你需要编写的代码量（以及需要构思的变量名）。\n\n### 局限性\n\
    \n如果你的目标不是 ES6 或更高版本，生成的代码假设对象上存在 `length` 属性，并且该对象可以通过数字进行索引（例如 `obj[2]`）。因此，在这些遗留\
    \ JS 引擎中，它仅支持 `string` 和 `array`。\n\n如果 TypeScript 发现你没有在使用数组或字符串，它会给你一个清晰的错误提示：*\"\
    is not an array type or a string type\"*：\n\n```javascript\nlet articleParagraphs\
    \ = document.querySelectorAll(\"article > p\");\n\n// 错误: Nodelist is not an array\
    \ type or a string type\nfor (let paragraph of articleParagraphs) {\n  paragraph.classList.add(\"\
    read\");\n}\n```\n\n仅对你*确定*是数组或字符串的内容使用 `for...of`。请注意，此局限性可能会在 TypeScript 的未来版本中被移除。\n\
    \n### 总结\n\n你会惊讶于自己遍历数组元素的次数有多高。下一次发现自己在做这种操作时，尝试一下 `for...of` 吧。你可能会让下一个审查你代码的人感到高兴。\n\
    \n## 迭代器 (Iterators)\n\n迭代器本身并不是 TypeScript 或 ES6 的特性，迭代器是面向对象编程语言中常见的行为设计模式。它通常是一个实现了以下接口的对象：\n\
    \n```typescript\ninterface Iterator<T> {\n  next(value?: any): IteratorResult<T>;\n\
    \  return?(value?: any): IteratorResult<T>;\n  throw?(e?: any): IteratorResult<T>;\n\
    }\n```\n\n此接口允许从属于对象的某个集合或序列中检索值。\n\n`IteratorResult` 仅仅是一个 `value + done` 组合：\n\
    \n```typescript\ninterface IteratorResult<T> {\n  done: boolean;\n  value: T;\n\
    }\n```\n\n假设有一个某个帧（frame）的对象，包含了该帧包含的组件列表。通过 Iterator 接口，可以像下面从该帧对象中检索组件：\n\n\
    ![img/416f69818aa79e3f1fe0e7869c118431_54_0.png](img/416f69818aa79e3f1fe0e7869c118431_54_1.png)\n\
    \n```javascript\n'use strict';\n\nclass Component {\n  constructor (public name:\
    \ string) {}\n}\n\nclass Frame {\n  public components = [];\n  constructor(public\
    \ name: string) {}\n\n  [Symbol.iterator]() {\n    let pointer = 0;\n    return\
    \ {\n      next() {\n        if (pointer < this.components.length) {\n       \
    \   return {\n            done: false,\n            value: this.components[pointer++]\n\
    \          };\n        } else {\n          return {\n            done: true,\n\
    \            value: null\n          };\n        }\n      }\n    };\n  }\n}\n\n\
    let frame = new Frame(\"main\");\nframe.components.push(new Component(\"header\"\
    ));\nframe.components.push(new Component(\"body\"));\nframe.components.push(new\
    \ Component(\"footer\"));\n\nfor (let component of frame) {\n  console.log(component.name);\n\
    }\n```\n"
