    \n在调用 `scan` 后，扫描器会更新其本地状态（扫描中的位置、当前 token 详情等）。扫描器提供了一系列实用函数来获取当前的扫描器状态。在下面的示例中，我们创建了一个扫描器，并使用它来识别\
