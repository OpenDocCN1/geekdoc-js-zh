    \ **gitignore** 中）\n\n贡献\n\n315\n\n如果这些文件夹之间存在差异，测试将失败。你可以使用 BeyondCompare 或 KDiff3\
    \ 等工具对比这两个文件夹。\n\n如果你认为这些生成的更改是有效的，则使用 `jake baseline-accept` 接受基线。引用基线的更改现在将显示可以提交的\
    \ git diff。\n\n注意，如果你没有运行所有测试，请使用 `jake baseline-accept[soft]`，它只会复制新文件而删除引用目录。\n\
    \n**测试分类**\n\n不同的场景有不同的分类，甚至有不同的测试架构。以下是对其中一些解释。\n\n**编译器测试**\n\n这些测试确保编译文件：\n\
    - 生成预期的错误\n- 生成预期的 JS\n- 识别预期的类型\n- 识别预期的符号\n\n这些预期使用 baselines 架构进行验证。\n\n**创建编译器测试**\n\
    \n可以通过向 `tests/cases/compiler` 中添加新文件 `yourtest.ts` 来创建测试。一旦你这样做并运行测试，应该会得到基线失败。接受这些基线（以便它们显示在\
    \ git 中），并调整它们以符合你的预期……现在让测试通过。\n\n使用 `jake runtests tests=compiler` 隔离运行所有这些测试，或使用\
    \ `jake runtests tests=compiler/yourtest` 仅运行你的新文件。\n\n**调试测试**\n\n`jake runtests-browser\
    \ tests=theNameOfYourTest` 并在浏览器中调试通常工作得良好。\n"
