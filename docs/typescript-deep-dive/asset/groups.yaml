- md: "\n// Ensure this is treated as a module.\n\nexport {};\n\ndeclare global {\n\
    \  interface String {\n    endsWith(suffix: string): boolean;\n  }\n}\n\nString.prototype.endsWith\
    \ = function(suffix: string): boolean {\n  var str: string = this;\n  return str\
    \ && str.indexOf(suffix, str.length - suffix.length) !== -1;\n}\n\nconsole.log('foo\
    \ bar'.endsWith('bas')); // false\nconsole.log('foo bas'.endsWith('bas')); //\
    \ true\n\n## Using your own custom lib.d.ts\n\nAs we mentioned earlier using the\
    \ `noLib` boolean compiler flag causes TypeScript to exclude the automatic inclusion\
    \ of `lib.d.ts`. There are various reasons why this is a useful feature. Here\
    \ are a few of the common ones:\n\n- You are running in a custom JavaScript environment\
    \ that differs *significantly* from the standard browser based runtime environment.\n\
    - You like to have *strict* control over the *globals* available in your code.\
    \ E.g. `lib.d.ts` defines `item` as a global variable and you don't want this\
    \ to leak into your code.\n\nOnce you have excluded the default `lib.d.ts` you\
    \ can include a similarly named file into your compilation context and TypeScript\
    \ will pick it up for type checking.\n\nNote: be careful with `--noLib`. Once\
    \ you are in noLib land, if you chose to share your project with others, they\
    \ will be *forced* into noLib land (or rather *your lib* land). Even worse, if\
    \ you bring *their* code into your project you might need to port it to *your\
    \ lib* based code.\n\n## Compiler target effect on **** lib.d.ts\n\nSetting the\
    \ compiler target to be `es6` causes the `lib.d.ts` to include *additional* ambient\
    \ declarations for more modern (es6) stuff like `Promise`. This magical effect\
    \ of the compiler target changing the *ambience* of the code is desirable for\
    \ some people and for others it's problematic as it conflates *code generation*\
    \ with *code ambience*.\n\nHowever if you want finer grained control of your environment\
    \ you should use the `--lib` option which we discuss next.\n\n## lib.d.ts\n\n\
    ## lib option\n\nSometimes (many times) you want to decouple the relationship\
    \ between the compile target (the generated JavaScript version) and the ambient\
    \ library support. A common example is `Promise`, e.g. today (in June 2016) you\
    \ most likely want to `--target es5` but still use latest stuff like `Promise`.\
    \ To support this you can take explicit control of `lib` using the `lib` compiler\
    \ option.\n\nNote: using `--lib` decouples any lib magic from `--target` giving\
    \ you better control. You can provide this option on the command line or in `tsconfig.json`\
    \ (recommended):\n\n**Command line**:\n`tsc --target es5 --lib dom,es6`\n\n**tsconfig.json**:\n\
    ```json\n\"compilerOptions\": {\n \"lib\": [\"dom\", \"es6\"]\n}\n```\n\nThe libs\
    \ can be categorized into categories:\n\n| Category | Items |\n| :--- | :--- |\n\
    | JavaScript Bulk Feature | es5, es6, es2015, es7, es2016, es2017, esnext |\n\
    | Runtime Environment | dom, dom.iterable, webworker, scripthost |\n| ESNext By-feature\
    \ options | es2015.core, es2015.collection, es2015.generator, es2015.iterable,\
    \ es2015.promise, es2015.proxy, es2015.reflect, es2015.symbol, es2015.symbol.wellknown,\
    \ es2016.array.include, es2017.object, es2017.sharedmemory, esnext.asynciterable\
    \ |\n\nNOTE: the `--lib` option provides extremely fine tuned control. So you\
    \ most likey want to pick an item from the bulk + enviroment categories. If --lib\
    \ is not specified a default library is injected:\n\n- For --target es5 => es5,\
    \ dom, scripthost\n- For --target es6 => es6, dom, dom.iterable, scripthost\n\n\
    My Personal Recommentation:\n```json\n\"compilerOptions\": {\n \"target\": \"\
    es5\",\n \"lib\": [\"es6\", \"dom\"]\n}\n```\n\nExample Including Symbol with\
    \ ES5 Symbol API is not included when target is es5. In fact, we receive an error\
    \ like: `[ts] Cannot find name 'Symbol'`. We can use `\"target\": \"es5\"` in\
    \ combination with \"lib\" to provide Symbol API in TypeScript:\n```json\n\"compilerOptions\"\
    : {\n \"target\": \"es5\",\n \"lib\": [\"es5\", \"dom\", \"scripthost\", \"es2015.symbol\"\
    ]\n}\n```\n\n## Parameter Annotations\n\n## Return Type Annotation\n\n## Optional\
    \ Parameters\n\n## Overloading\n\n## Functions\n\nThe TypeScript type system pays\
    \ a lot of love to functions, after all they are the core building block of a\
    \ composable system.\n\n### Parameter annotations\n\nOf course you can annotate\
    \ function parameters just like you can annotate other variables:\n\n```typescript\n\
    // variable annotation\nvar sampleVariable: { bar: number }\n\n// function parameter\n\
    function foo(sampleParameter: { bar: number }) { }\n```\n\nHere I used inline\
    \ type annotations. Of course you can use interfaces etc.\n\n### Return type annotation\n\
    \nYou can annotate the return type after the function parameter list with the\
    \ same style as you use for a variable, e.g. `: Foo` in the below example:\n\n\
    ```typescript\ninterface Foo {\n  foo: string;\n}\n\n// Return type annotated\
    \ as `: Foo`\nfunction foo(sample: Foo): Foo {\n  return sample;\n}\n```\n\nOf\
    \ course I used an `interface` here, but you are free to use other annotations\
    \ e.g. inline annotations. Quite commonly you don't *need* to annotate the return\
    \ type of a function as it can generally be inferred by the compiler.\n\n```typescript\n\
    interface Foo {\n  foo: string;\n}\n\nfunction foo(sample: Foo) {\n  return sample;\
    \ // inferred return type 'Foo'\n}\n```\n\nHowever it is generally a good idea\
    \ to add these annotation to help with errors e.g.:\n```typescript\nfunction foo()\
    \ {\n  return { fou: 'John Doe' }; // You might not find this misspelling `foo`\
    \ till it's too late\n}\nsendAsJSON(foo());\n```\n\nIf you don't plan to return\
    \ anything from a function to you can annotate it as `:void`. You can generally\
    \ drop `:void` and leave it to the inference engine though.\n\n### Optional Parameters\n\
    \nYou can mark a parameter as optional:\n```typescript\nfunction foo(bar: number,\
    \ bas?: string): void {\n  // ..\n}\nfoo(123);\nfoo(123, 'hello');\n```\n\nAlternatively\
    \ you can even provide a default value (using `= someValue` after the parameter\
    \ declaration) which will get injected for you if the caller doesn't provide that\
    \ argument:\n```typescript\nfunction foo(bar: number, bas: string = 'hello') {\n\
    \  console.log(bar, bas);\n}\nfoo(123); // 123, hello\nfoo(123, 'world'); // 123,\
    \ world\n```\n\n### Overloading\n\nTypeScript allows you to *declare* function\
    \ overloads. This is useful for documentation + type safety purpose. Consider\
    \ the following code:\n\n```typescript\nfunction padding(a: number, b?: number,\
    \ c?: number, d?: any) {\n  if (b === undefined && c === undefined && d === undefined)\
    \ {\n    b = c = d = a;\n  }\n  else if (c === undefined && d === undefined) {\n\
    \    c = a;\n    d = b;\n  }\n  return {\n    top: a,\n    right: b,\n    bottom:\
    \ c,\n    left: d\n  };\n}\n```\n\nIf you look at the code carefully you realize\
    \ the meaning of `a , b , c , d` change based on how many arguments are passed.\
    \ Also the function only expects `1 , 2 or 4` arguments. These constraints can\
    \ be *enforced* and *documented* using function overloading. You just: declare\
    \ the function header multiple times, the last function header is the one that\
    \ is actually active *within* the function but is not available to the world.\
    \ This is shown below:\n\n```typescript\n// Overloads\nfunction padding(all: number);\n\
    function padding(topAndBottom: number, leftAndRight: number);\nfunction padding(top:\
    \ number, right: number, bottom: number, left: number);\n\n// Actual implementation\
    \ that is a true representation of all the cases the function body needs to handle\n\
    function padding(a: number, b?: number, c?: number, d?: number) {\n  if (b ===\
    \ undefined && c === undefined && d === undefined) {\n    b = c = d = a;\n  }\n\
    \  else if (c === undefined && d === undefined) {\n    c = a;\n    d = b;\n  }\n\
    \  return {\n    top: a,\n    right: b,\n    bottom: c,\n    left: d\n  };\n}\n\
    ```\n\nHere the first three function signatures are what is available as valid\
    \ calls to `padding`:\n`padding(1); // Okay: all\n`padding(1,1); // Okay: topAndBottom,\
    \ leftAndRight`\n`padding(1,1,1,1); // Okay: top, right, bottom, left`\n`padding(1,1,1);\
    \ // Error: Not a part of the available overloads\n\nOf course it's important\
    \ for the final declaration (the true declaration as seen from inside the function)\
    \ to be compatible with all the overloads. This is because that is the true nature\
    \ of the function calls that the function body needs to account for.\n\nFunction\
    \ overloading in TypeScript doesn't come with any runtime overhead. It just allows\
    \ you to document the manner you expect the function to be called in and the compiler\
    \ holds the rest of your code in check.\n"
  mdcn: "\n\n// 确保此被视为模块。\n\nexport {};\n\ndeclare global {\n  interface String {\n\
    \    endsWith(suffix: string): boolean;\n  }\n}\n\nString.prototype.endsWith =\
    \ function(suffix: string): boolean {\n  var str: string = this;\n  return str\
    \ && str.indexOf(suffix, str.length - suffix.length) !== -1;\n}\n\nconsole.log('foo\
    \ bar'.endsWith('bas')); // false\nconsole.log('foo bas'.endsWith('bas')); //\
    \ true\n\n## 使用你自定义的 lib.d.ts\n\n正如我们之前提到的，使用 `noLib` 布尔编译器标志会导致 TypeScript 排除自动包含的\
    \ `lib.d.ts`。这个功能非常有用的，有很多原因。以下是其中常见的几种：\n\n- 你正在运行在一个自定义的 JavaScript 环境中，该环境与标准的浏览器运行时环境有*显著*的差异。\n\
    - 你喜欢对代码中可用的*全局变量* 有*严格*的控制。例如，`lib.d.ts` 将 `item` 定义为全局变量，而你不希望它泄露到你的代码中。\n\n\
    一旦你排除了默认的 `lib.d.ts`，你就可以在编译上下文中包含一个名称相似的文件，TypeScript 将读取它并进行类型检查。\n\n注意：谨慎使用\
    \ `--noLib`。一旦进入了 noLib 领域，如果你选择将项目与他人共享，他们将被*强制*进入 noLib 领域（或者说进入了*你的 lib* 领域）。更糟糕的是，如果你将*他们的*代码引入你的项目，你可能需要将其迁移到基于*你的\
    \ lib* 的代码上。\n\n## 编译器目标对 **** lib.d.ts 的影响\n\n将编译器目标设置为 `es6` 会导致 `lib.d.ts`\
    \ 包含针对更现代（es6）特性（如 `Promise`）的*额外*环境声明。这种通过编译器目标改变代码*环境*的魔法效果对某些人是有利的，但对另一些人是有问题的，因为它将*代码生成*与*代码环境*混淆在了一起。\n\
    \n然而，如果你想对环境进行更细粒度的控制，应该使用我们接下来讨论的 `--lib` 选项。\n\n## lib.d.ts\n\n## lib 选项\n\n\
    有时（很多时候）你想解耦编译目标（生成的 JavaScript 版本）与环境库支持之间的关系。一个常见的例子是 `Promise`，例如在今天（2016年6月），你很可能想使用\
    \ `--target es5` 但仍然使用像 `Promise` 这样的新技术。为了支持这一点，你可以使用 `lib` 编译器选项对 `lib` 进行显式控制。\n\
    \n注意：使用 `--lib` 将任何库的魔法与 `--target` 解耦，从而为你提供更好的控制。你可以在命令行或在 `tsconfig.json` 中提供此选项（推荐）：\n\
    \n**命令行**：\n`tsc --target es5 --lib dom,es6`\n\n**tsconfig.json**：\n```json\n\"\
    compilerOptions\": {\n \"lib\": [\"dom\", \"es6\"]\n}\n```\n\n库可以分为以下几类：\n\n|\
    \ 类别 | 项目 |\n| :--- | :--- |\n| JavaScript 批量功能 | es5, es6, es2015, es7, es2016,\
    \ es2017, esnext |\n| 运行时环境 | dom, dom.iterable, webworker, scripthost |\n| ESNext\
    \ 按功能选项 | es2015.core, es2015.collection, es2015.generator, es2015.iterable, es2015.promise,\
    \ es2015.proxy, es2015.reflect, es2015.symbol, es2015.symbol.wellknown, es2016.array.include,\
    \ es2017.object, es2017.sharedmemory, esnext.asynciterable |\n\n注意：`--lib` 选项提供了极其精细的控制。因此你很可能想从批量\
    \ + 环境类别中选择一个项目。如果未指定 --lib，则注入一个默认库：\n\n- 对于 --target es5 => es5, dom, scripthost\n\
    - 对于 --target es6 => es6, dom, dom.iterable, scripthost\n\n我的个人建议：\n```json\n\"\
    compilerOptions\": {\n \"target\": \"es5\",\n \"lib\": [\"es6\", \"dom\"]\n}\n\
    ```\n\n示例：当目标为 es5 时，带有 ES5 Symbol API 的 Symbol 不会被包含在。事实上，我们收到了类似错误：`[ts] Cannot\
    \ find name 'Symbol'`。我们可以结合 `\"target\": \"es5\"` 和 \"lib\" 在 TypeScript 中提供\
    \ Symbol API：\n```json\n\"compilerOptions\": {\n \"target\": \"es5\",\n \"lib\"\
    : [\"es5\", \"dom\", \"scripthost\", \"es2015.symbol\"]\n}\n```\n\n## 参数注解\n\n\
    ## 返回类型注解\n\n## 可选参数\n\n## 重载\n\n## 函数\n\nTypeScript 类型系统为函数倾注了大量精力，毕竟它们是可组合系统的核心构建块。\n\
    \n"
