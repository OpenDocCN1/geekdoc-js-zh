  - "[PAGE 204]\n\n**Exception Handling**\n\nJavaScript has an  Error  class that\
    \ you can use for exceptions. You throw an error with the\n\n throw  keyword.\
    \ You can catch it with a  try  /  catch  block pair e.g.\n\ntry {\n\n throw new\
    \ Error('Something bad happened');\n\n}\n\ncatch(e) {\n\n console.log(e);\n\n\
    }\n\n**Error Sub Types**\n\nBeyond the built in  Error  class there are a few\
    \ additional built-in error classes that inherit\n\nfrom  Error  that the JavaScript\
    \ runtime can throw:\n\n**RangeError**\n\nCreates an instance representing an\
    \ error that occurs when a numeric variable or parameter\n\nis outside of its\
    \ valid range.\n\n// Call console with too many arguments\n\nconsole.log.apply(console,\
    \ new Array(1000000000)); // RangeError: Invalid array length\n\n**ReferenceError**\n\
    \nCreates an instance representing an error that occurs when de-referencing an\
    \ invalid\n\nreference. e.g.\n\n'use strict';\n\nconsole.log(notValidVar); //\
    \ ReferenceError: notValidVar is not defined\n\n**SyntaxError**\n\nCreates an\
    \ instance representing a syntax error that occurs while parsing code that isn't\n\
    \nvalid JavaScript.\n\nException Handling\n\n205"
  - "[PAGE 205]\n\n1\\*\\*\\*3; // SyntaxError: Unexpectd token \\*\n\n**TypeError**\n\
    \nCreates an instance representing an error that occurs when a variable or parameter\
    \ is not of\n\na valid type.\n\n('1.2').toPrecision(1); // TypeError: '1.2'.toPrecision\
    \ is not a function\n\n**URIError**\n\nCreates an instance representing an error\
    \ that occurs when  encodeURI()  or  decodeURI() \n\nare passed invalid parameters.\n\
    \ndecodeURI('%'); // URIError: URI malformed\n\n**Always use **** Error **\n\n\
    Beginner JavaScript developers sometimes just throw raw strings e.g.\n\ntry {\n\
    \n throw 'Something bad happened';\n\n}\n\ncatch(e) {\n\n console.log(e);\n\n\
    }\n\n*Don't do that*. The fundamental benefit of  Error  objects is that they\
    \ automatically keep\n\ntrack of where they were built and originated as the \
    \ stack  property.\n\nRaw strings result in a very painful debugging experience\
    \ and complicate error analysis from\n\nlogs.\n\n**You don't have to **** throw\
    \ **** an error**\n\nIt is okay to pass an  Error  object around. This is conventional\
    \ in Node.js callback style\n\ncode which take callbacks with the first argument\
    \ as an error object.\n\nException Handling\n\n206"
  - "[PAGE 206]\n\nfunction myFunction (callback: (e?: Error)) {\n\n doSomethingAsync(function\
    \ () {\n\n if (somethingWrong) {\n\n callback(new Error('This is my error'))\n\
    \n } else {\n\n callback();\n\n }\n\n });\n\n}\n\n**Exceptional cases**\n\n Exceptions\
    \ should be exceptional  is a common saying in computer science. There are few\n\
    \nresons why this is true for JavaScript (and TypeScript) as well.\n\n**Unclear\
    \ where it is thrown**\n\nConsider the following piece of code:\n\ntry {\n\n const\
    \ foo = runTask1();\n\n const bar = runTask2();\n\n}\n\ncatch(e) {\n\n console.log('Error:',\
    \ e);\n\n}\n\nThe next developer cannot know which funtion might throw the error.\
    \ The person reviewing\n\nthe code cannot know without reading the code for task1\
    \ / task2 and other functions they\n\nmight call etc.\n\n**Makes graceful handling\
    \ hard**\n\nYou can try to make it graceful with explicit catch around each thing\
    \ that might throw:\n\nException Handling\n\n207"
