    \ )\n\n5\\. Make sure you have  compilerOptions.module:commonjs  in your tsconfig.json\n\
    \nThat's it! Fire up your IDE (e.g.  alm -o ) and play around. Now you can use\
    \ all the built in\n\nnode modules (e.g.  import fs = require('fs'); ) with all\
    \ the safety and developer\n\nergonomics of TypeScript!\n\n**Bonus: Live compile\
