    ```javascript\nfunction Foo() { }\nconsole.log(Foo.prototype); // {} 即它存在且不是 undefined\n\
    console.log(Foo.prototype.constructor === Foo); // 有一个指向函数的 constructor 成员\n```\n\
    \n现在我们理解了 `__proto__`。让我们来看 *new* 在调用函数内部对 *this* 的影响。基本上，调用函数内部的 `this` 将指向从函数返回的新创建的对象。如果你在函数内部修改\
