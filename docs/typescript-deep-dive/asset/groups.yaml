    \ from a documentation as well as a runtime\n\nperspective. To use const just\
    \ replace  var  with  const :\n\nconst foo = 123;\n\nThe syntax is much better\
    \ (IMHO) than other languages that force the user to type\n\nsomething like  let\
    \ constant foo  i.e. a variable + behavior specifier.\n\n const  is a good practice\
    \ for both readability and maintainability and avoids using *magic*\n\n*literals*\
    \ e.g.\n\n// Low readability\n\nif (x > 10) {\n\n}\n\n// Better!\n\nconst maxRows\
    \ = 10;\n\nif (x > maxRows) {\n\n}\n\n**const declarations must be initialized**\n\
    \nThe following is a compiler error:\n\nconst foo; // ERROR: const declarations\
    \ must be initialized\n\n**Left hand side of assignment cannot be a constant**\n\
    \nConstants are immutable after creation, so if you try to assign them to a new\
    \ value it is a\n\ncompiler error:\n\nconst foo = 123;\n\nfoo = 456; // ERROR:\
    \ Left-hand side of an assignment expression cannot be a constant\n\n**Block Scoped**\n\
    \nA  const  is block scoped like we saw with  let :\n\nconst\n\n44"
