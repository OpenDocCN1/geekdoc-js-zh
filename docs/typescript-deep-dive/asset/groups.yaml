  - "[PAGE 228]\n\n**Type Instantiation for Generics**\n\nSay you have something that\
    \ has a generic parameter e.g. a class  Foo :\n\nclass Foo<T>{\n\n foo: T;\n\n\
    }\n\nYou want to create a specialized version for it for a particular type. The\
    \ pattern is to copy the\n\nitem into a new variable and give it the type annotation\
    \ with the generics replaced with\n\nconcrete types. E.g if you want a class \
    \ Foo<number> :\n\nclass Foo<T>{\n\n foo: T;\n\n}\n\nlet FooNumber = Foo as {\
    \ new ():Foo<number\\> }; // ref 1\n\nIn  ref 1  you are saying that  FooNumber\
    \  is the same as  Foo  but just treat it as something\n\nthat when called with\
    \ the  new  operator gives an instance of  Foo<Number> .\n\n**Inheritance**\n\n\
    The Type assertion pattern is unsafe in that it trusts you to do the right thing.\
    \ A common\n\npattern in other languages *for classes* is to just use inheritance\
    \ :\n\nclass FooNumber extends Foo<number\\>{}\n\nOne word of caution here: if\
    \ you use decorators on the base class then the inherited class\n\nmight not have\
    \ the same behavior as the base class (it is no longer wrapped by the\n\ndecorator).\n\
    \nOf course if you are not specializing classes you still have to come up with\
    \ a coercion /\n\nassertion pattern that works and hence we showed the general\
    \ assertion pattern first, e.g.:\n\nfunction id<T\\>(x: T) { return x; }\n\nconst\
    \ idNum = id as {(x:number):number};\n\nInspired by this stackoverflow question\n\
    \nType Instantiation\n\n229"
