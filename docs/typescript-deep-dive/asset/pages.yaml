  md: "Type Guard\n\nUser Defined Type Guards\n\n**Type Guard**\n\nType Guards allow\
    \ you to narrow down the type of an object within a conditional block.\n\n**typeof**\n\
    \nTypeScript is aware of the usage of the JavaScript  instanceof  and  typeof\
    \  operators. If\n\nyou use these in a conditional block, TypeScript will understand\
    \ the type of the variable to be\n\ndifferent within that conditional block. Here\
    \ is a quick example where TypeScript realizes that\n\na particular function does\
    \ not exist on  string  and points out what was probably a user\n\ntypo:\n\nfunction\
    \ doSomething(x: number | string) {\n\n if (typeof x === 'string') { // Within\
    \ the block TypeScript knows that \\`x\\` must be\n\n a string\n\n console.log(x.subtr(1));\
    \ // Error, 'subtr' does not exist on \\`string\\`\n\n console.log(x.substr(1));\
    \ // OK\n\n }\n\n x.substr(1); // Error: There is no guarantee that \\`x\\` is\
    \ a \\`string\\`\n\n}\n\n**instanceof**\n\nHere is an example with a class and\
    \  instanceof :\n\nType Guard\n\n159"
  merge: -1
  pgno: 158
- img_proc: true
  md: "class Foo {\n\n foo = 123;\n\n common = '123';\n\n}\n\nclass Bar {\n\n bar\
    \ = 123;\n\n common = '123';\n\n}\n\nfunction doStuff(arg: Foo | Bar) {\n\n if\
    \ (arg instanceof Foo) {\n\n console.log(arg.foo); // OK\n\n console.log(arg.bar);\
    \ // Error!\n\n }\n\n if (arg instanceof Bar) {\n\n console.log(arg.foo); // Error!\n\
    \n console.log(arg.bar); // OK\n\n }\n\n console.log(arg.common); // OK\n\n console.log(arg.foo);\
    \ // Error!\n\n console.log(arg.bar); // Error!\n\n}\n\ndoStuff(new Foo());\n\n\
    doStuff(new Bar());\n\nTypeScript even understands  else  so when an  if  narrows\
    \ out one type it knows that\n\nwithin the else *it's definitely not that type*.\
    \ Here is an example:\n\nType Guard\n\n160"
