  md: "Arrays are slightly different. For  number  indexing JavaScript VMs will try\
    \ to optimise\n\n(depending on things like is it actually an array and do the\
    \ structures of items stored match\n\netc.). So  number  should be considered\
    \ as a valid object accessor in its own right (distinct\n\nfrom  string ). Here\
    \ is a simple array example:\n\nlet foo = \\['World'\\];\n\nconsole.log(foo\\\
    [0\\]); // World\n\nSo that's JavaScript. Now let's look at TypeScript graceful\
    \ handling of this concept.\n\n**TypeScript Index Signature**\n\nFirst off, because\
    \ JavaScript *implicitly* calls  toString  on any object index signature,\n\n\
    TypeScript will give you an error to prevent beginners from shooting themselves\
    \ in the foot (I\n\nsee users shooting themselves in their feet when using JavaScript\
    \ all the time on\n\nstackoverflow):\n\nlet obj = {\n\n toString(){\n\n return\
    \ 'Hello'\n\n }\n\n}\n\nlet foo:any = {};\n\n// ERROR: the index signature must\
    \ be string, number ...\n\nfoo\\[obj\\] = 'World';\n\n// FIX: TypeScript forces\
    \ you to be explicit\n\nfoo\\[obj.toString()\\] = 'World';\n\nThe reason for forcing\
    \ the user to be explicit is because the default  toString \n\nimplementation\
    \ on an object is pretty awful, e.g. on v8 it always returns  \\[object Object\\\
    ] :\n\nlet obj = {message:'Hello'}\n\nlet foo:any = {};\n\n// ERROR: the index\
    \ signature must be string, number ...\n\nfoo\\[obj\\] = 'World';\n\n// Here is\
    \ what you actually stored!\n\nconsole.log(foo\\[\"\\[object Object\\]\"\\]);\
    \ // World\n\nOf course  number  is supported because\n\nIndex Signatures\n\n\
    197"
  merge: -1
  pgno: 196
- img_proc: true
  md: "1\\. its needed for excellent Array / Tuple support.\n\n2\\. even if you use\
    \ it for an  obj  its default  toString  implementation is nice (not  \\[object\n\
    \nObject\\] ).\n\nPoint 2 is shown below:\n\nconsole.log((1).toString()); // 1\n\
    \nconsole.log((2).toString()); // 2\n\nSo lesson 1:\n\nTypeScript index signatures\
    \ must be either  string  or  number \n\nQuick note:  symbols  are also valid\
    \ and supported by TypeScript. But let's not go there just\n\nyet. Baby steps.\n\
    \n**Declaring an index signature**\n\nSo we've been using  any  to tell TypeScript\
    \ to let us do whatever we want. We can actually\n\nspecify an *index* signature\
    \ explicitly. E.g. say you want to make sure than anything that is\n\nstored in\
    \ an object using a string conforms to the structure  {message: string} . This\
    \ can be\n\ndone with the declaration  { \\[index:string\\] : {message: string}\
    \ } . This is demonstrated\n\nbelow:\n\nlet foo:{ \\[index:string\\] : {message:\
    \ string} } = {};\n\n/\\*\\*\n\n \\* Must store stuff that conforms the structure\n\
    \n \\*/\n\n/\\*\\* Ok \\*/\n\nfoo\\['a'\\] = { message: 'some message' };\n\n\
    /\\*\\* Error: must contain a \\`message\\` or type string. You have a typo in\
    \ \\`message\\` \\*/\n\nfoo\\['a'\\] = { messages: 'some message' };\n\n/\\*\\\
    *\n\n \\* Stuff that is read is also type checked\n\n \\*/\n\n/\\*\\* Ok \\*/\n\
    \nfoo\\['a'\\].message;\n\n/\\*\\* Error: messages does not exist. You have a\
    \ typo in \\`message\\` \\*/\n\nfoo\\['a'\\].messages;\n\nIndex Signatures\n\n\
    198"
