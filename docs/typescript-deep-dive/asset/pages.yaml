  md: '**Generic functions**


    Something like the following works fine:


    function foo<T\>(x: T): T { return x; }


    However using an arrow generic function will not:


    const foo = <T>(x: T) => x; // ERROR : unclosed \`T\` tag


    **Workaround**: Use  extends  on the generic parameter to hint the compiler that
    it''s a generic,


    e.g.:


    const foo = <T extends {}>(x: T) => x;


    **Generic Components**


    Since JSX doesn''t have a syntax for providing a generic parameter you need to
    specialize


    the component using a type assertion before creating it, e.g.:


    /\*\* Generic component \*/


    type SelectProps<T> = { items: T\[\] }


    class Select<T> extends React.Component<SelectProps<T>, any\> { }


    /\*\* Specialization \*/


    interface StringSelect { new (): Select<string\> };


    const StringSelect = Select as StringSelect;


    /\*\* Usage \*/


    const Form = ()=> <StringSelect items={\[''a'', ''b''\]} />;


    **Useless Generic**


    I''ve seen people use generics just for the heck of it. The question to ask is
    *what constraint*


    *are you trying to describe*. If you can''t answer it easily you probably have
    a useless generic.


    E.g. people have attempted to type the Node.js  require  function as:


    declare function require<T\>(name: string): T;


    In this case you can see that the type  T  is only used in one place. So there
    is not


    constraint *between* members. You would be better off with a type assertion in
    this case:


    Generics


    173'
