  md: "**Iterators**\n\nIterator itself is not a TypeScript or ES6 feature, Iterator\
    \ is a Behavioral Design Pattern\n\ncommon for Object oriented programming languages.\
    \ It is, generally, an object which\n\nimplements the following interface:\n\n\
    interface Iterator<T> {\n\n next(value?: any): IteratorResult<T>;\n\n return?(value?:\
    \ any): IteratorResult<T>;\n\n throw?(e?: any): IteratorResult<T>;\n\n}\n\nThis\
    \ interface allows to retrieve a value from some collection or sequence which\
    \ belongs to\n\nthe object.\n\nThe  IteratorResult  is simply a  value + done\
    \  pair:\n\ninterface IteratorResult<T> {\n\n done: boolean;\n\n value: T;\n\n\
    }\n\nImagine that there's an object of some frame, which includes the list of\
    \ components of which\n\nthis frame consists. With Iterator interface it is possible\
    \ to retrieve components from this\n\nframe object like below:\n\nIterators\n\n\
