    \nIsolated Compile\n\n**Runtime Errors**\n\nIf your code depends on any form of\
    \ js ordering you will get random errors at runtime.\n\n**class inheritance can\
    \ break at runtime.**\n\nConsider  foo.ts :\n\nclass Foo {\n\n}\n\nand a  bar.ts\
    \ :\n\nclass Bar extends Foo {\n\n}\n\nIf you fail to compile it in correct order\
    \ e.g. perhaps alphabetically  tsc bar.ts foo.ts  the\n\ncode will compile fine\
    \ but error at runtime with  ReferenceError .\n\n**module splitting can fail at\
    \ runtime.**\n\nConsider  foo.ts :\n\noutFile caution\n\n241"
