  md: "**Type Assertion**\n\nTypeScript allows you to override its inferred and analyzed\
    \ view of types in any way you\n\nwant to. This is done by a mechanism called\
    \ \"type assertion\". TypeScript's type assertion is\n\npurely you telling the\
    \ compiler that you know about the types better than it does, and that it\n\n\
    should not second guess you.\n\nA common use case for type assertion is when you\
    \ are porting over code from JavaScript to\n\nTypeScript. For example consider\
    \ the following pattern:\n\nvar foo = {};\n\nfoo.bar = 123; // Error: property\
    \ 'bar' does not exist on \\`{}\\`\n\nfoo.bas = 'hello'; // Error: property 'bas'\
    \ does not exist on \\`{}\\`\n\nHere the code errors because the *inferred* type\
    \ of  foo  is  {}  i.e. an object with zero\n\nproperties. Therefore you are not\
    \ allowed to add  bar  or  bas  to it. You can fix this simply\n\nby a type assertion\
    \  as Foo :\n\ninterface Foo {\n\n bar: number;\n\n bas: string;\n\n}\n\nvar foo\
    \ = {} as Foo;\n\nfoo.bar = 123;\n\nfoo.bas = 'hello';\n\n** as foo **** vs. ****\
    \ <foo> **\n\nOriginally the syntax that was added was  <foo> . This is demonstrated\
    \ below:\n\nvar foo: any;\n\nvar bar = <string\\> foo; // bar is now of type \"\
    string\"\n\nHowever there is an ambiguity in the language grammar when using \
    \ <foo>  style assertions\n\nin JSX:\n\nvar foo = <string>bar;\n\n</string>\n\n\
    Therefore it is now recommended that you just use  as foo  for consistency.\n\n\
    Type Assertion\n\n153"
  merge: -1
  pgno: 152
- img_proc: true
  md: "**Type Assertion vs. Casting**\n\nThe reason why it's not called \"type casting\"\
    \ is that *casting* generally implies some sort of\n\nruntime support. However\
    \ *type assertions* are purely a compile time construct and a way for\n\nyou to\
    \ provide hints to the compiler on how you want your code to be analyzed.\n\n\
    **Assertion considered harmful**\n\nIn many cases assertion will allow you to\
    \ easily migrate legacy code (and even copy paste\n\nother code samples into your\
    \ codebase), however you should be careful with your use of\n\nassertions. Take\
    \ our original code as a sample, the compiler will not protect you from\n\nforgetting\
    \ to *actually add the properties you promised*:\n\ninterface Foo {\n\n bar: number;\n\
    \n bas: string;\n\n}\n\nvar foo = {} as Foo;\n\n// ahhhh .... forget something?\n\
    \nAlso another common thought is using an assertion as a means of providing *autocomplete*\n\
    \ne.g.:\n\ninterface Foo {\n\n bar: number;\n\n bas: string;\n\n}\n\nvar foo =\
    \ <Foo>{\n\n // the compiler will provide autocomplete for properties of Foo\n\
    \n // But it is easy for the developer to forget adding all the properties\n\n\
    \ // Also this code is likely to break if Foo gets refactored (e.g. a new property\
    \ a\n\ndded)\n\n};\n\nbut the hazard here is the same, if you forget a property\
    \ the compiler will not complain. It is\n\nbetter if you do the following:\n\n\
    interface Foo {\n\n bar: number;\n\n bas: string;\n\n}\n\nvar foo:Foo = {\n\n\
    \ // the compiler will provide autocomplete for properties of Foo\n\n};\n\nType\
    \ Assertion\n\n154"
  merge: -1
  pgno: 153
- img_proc: true
  md: "In some cases you might need to create a temporary variable, but at least you\
    \ will not be\n\nmaking (possibly false) promises and instead relying on the type\
    \ inference to do the\n\nchecking for you.\n\n**Double assertion**\n\nThe type\
    \ assertion despite being a bit unsafe as we've shown, is not *completely open*\n\
    \n*season*. E.g. the following is a very valid use case (e.g. the user thinks\
    \ the event passed in\n\nwill be a more specific case of an event) and the type\
    \ assertion works as expected:\n\nfunction handler (event: Event) {\n\n let mouseEvent\
    \ = event as MouseEvent;\n\n}\n\nHowever the following is most likely an error\
    \ and TypeScript will complain as shown despite\n\nthe user's type assertion:\n\
    \nfunction handler(event: Event) {\n\n let element = event as HTMLElement; //\
    \ Error: Neither 'Event' not type 'HTMLElemen\n\nt' is assignable to the other\n\
    \n}\n\nIf you *still want that Type, you can use a double assertion*, but first\
    \ asserting to  any  which is\n\ncompatible with all types and therefore the compiler\
    \ no longer complains:\n\nfunction handler(event: Event) {\n\n let element = event\
    \ as any as HTMLElement; // Okay!\n\n}\n\n**How typescript determines if a single\
    \ assertion is not**\n\n**enough**\n\nBasically it allows the assertion from type\
    \  S  to  T  succeed if either  S  is a subtype of  T \n\nor  T  is a subtype\
    \ of  S . This is to provide extra safety when doing type assertions ...\n\ncompletely\
    \ wild assertions can be very unsafe and you need to use  any  to be that unsafe.\n\
    \nType Assertion\n\n155"
  merge: -1
  pgno: 154
