  md: "**Nominal Typing**\n\nThe TypeScript type system is structural and this is\
    \ one of the main motivating benefits.\n\nHowever, there are real-world use cases\
    \ for a system where you want two variables to be\n\ndifferentiated because they\
    \ have a different *type name* even if they have the same structure.\n\nA very\
    \ common use case is *identity* structures (which are generally just strings with\n\
    \nsemantics associated with their *name* in languages like C#/Java).\n\nThere\
    \ are a few patterns that have emerged in the community. I cover them in decreasing\n\
    \norder of personal preference:\n\n**Using literal types**\n\nThis pattern uses\
    \ generics and literal types:\n\n/\\*\\* Generic Id type \\*/\n\ntype Id<T extends\
    \ string\\> = {\n\n type: T,\n\n value: string,\n\n}\n\n/\\*\\* Specific Id types\
    \ \\*/\n\ntype FooId = Id<'foo'\\>;\n\ntype BarId = Id<'bar'\\>;\n\n/\\*\\* Optional:\
    \ contructors functions \\*/\n\nconst createFoo = (value: string): FooId => ({\
    \ type: 'foo', value });\n\nconst createBar = (value: string): BarId => ({ type:\
    \ 'bar', value });\n\nlet foo = createFoo('sample')\n\nlet bar = createBar('sample');\n\
    \nfoo = bar; // Error\n\nfoo = foo; // Okay\n\nAdvantages\n\nNo need for any type\
    \ assertions\n\nDisadvantage\n\nThe structure  {type,value}  might not be desireable\
    \ and need server serialization\n\nsupport\n\n**Using Enums**\n\nNominal Typing\n\
    \n222"
  merge: -1
  pgno: 221
