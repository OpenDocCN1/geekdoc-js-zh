  md: "Reason: these values are commonly used to keep a consistent structure between\n\
    \nvalues. In TypeScript you use *types* to denote the structure\n\n**Bad**\n\n\
    let foo = {x:123,y:undefined};\n\n**Good**\n\nlet foo:{x:number,y?:number} = {x:123};\n\
    \nUse  undefined  in general (do consider returning an object like\n\n {valid:boolean,value?:Foo}\
    \  instead)\n\n***Bad***\n\nreturn null;\n\n***Good***\n\nreturn undefined;\n\n\
    Use  null  where its a part of the API or conventional\n\nReason: It is conventional\
    \ in Node.js e.g.  error  is  null  for NodeBack style\n\ncallbacks.\n\n**Bad**\n\
    \ncb(undefined)\n\n**Good**\n\ncb(null)\n\nUse *truthy* check for **objects**\
    \ being  null  or  undefined \n\n**Bad**\n\nif (error === null)\n\n**Good**\n\n\
    StyleGuide\n\n263"
