  md: "TypeScript allows you to *declare* function overloads. This is useful for documentation\
    \ + type\n\nsafety purpose. Consider the following code:\n\nfunction padding(a:\
    \ number, b?: number, c?: number, d?: any) {\n\n if (b === undefined && c ===\
    \ undefined && d === undefined) {\n\n b = c = d = a;\n\n }\n\n else if (c ===\
    \ undefined && d === undefined) {\n\n c = a;\n\n d = b;\n\n }\n\n return {\n\n\
    \ top: a,\n\n right: b,\n\n bottom: c,\n\n left: d\n\n };\n\n}\n\nIf you look\
    \ at the code carefully you realize the meaning of  a , b , c , d  change based\
    \ on\n\nhow many arguments are passed in. Also the function only expects  1 ,\
    \  2  or  4 \n\narguments. These constraints can be *enforced* and *documented*\
    \ using function overloading.\n\nYou just:\n\ndeclare the function header multiple\
    \ times,\n\nthe last function header is the one that is actually active *within*\
    \ the function body but is\n\nnot available to the outside world.\n\nThis is shown\
    \ below:\n\nFunctions\n\n149"
  merge: -1
  pgno: 148
- img_proc: true
  md: "// Overloads\n\nfunction padding(all: number);\n\nfunction padding(topAndBottom:\
    \ number, leftAndRight: number);\n\nfunction padding(top: number, right: number,\
    \ bottom: number, left: number);\n\n// Actual implementation that is a true representation\
    \ of all the cases the function b\n\nody needs to handle\n\nfunction padding(a:\
    \ number, b?: number, c?: number, d?: number) {\n\n if (b === undefined && c ===\
    \ undefined && d === undefined) {\n\n b = c = d = a;\n\n }\n\n else if (c ===\
    \ undefined && d === undefined) {\n\n c = a;\n\n d = b;\n\n }\n\n return {\n\n\
    \ top: a,\n\n right: b,\n\n bottom: c,\n\n left: d\n\n };\n\n}\n\nHere the first\
    \ three function signatures are what is available as valid calls to  padding :\n\
    \npadding(1); // Okay: all\n\npadding(1,1); // Okay: topAndBottom, leftAndRight\n\
    \npadding(1,1,1,1); // Okay: top, right, bottom, left\n\npadding(1,1,1); // Error:\
    \ Not a part of the available overloads\n\nOf course it's important for the final\
    \ declaration (the true declaration as seen from inside the\n\nfunction) to be\
    \ compatible with all the overloads. This is because that is the true nature of\n\
    \nthe function calls that the function body needs to account for.\n\nFunction\
    \ overloading in TypeScript doesn't come with any runtime overhead. It just\n\n\
    allows you to document the manner you expect the function to be called in and\
    \ the\n\ncompiler holds the rest of your code in check.\n\nFunctions\n\n150"
  merge: -1
  pgno: 149
