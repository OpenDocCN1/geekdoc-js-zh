  md: "export interface Listener<T> {\n\n (event: T): any;\n\n}\n\nexport interface\
    \ Disposable {\n\n dispose();\n\n}\n\n/\\*\\* passes through events as they happen.\
    \ You will not get events from before you star\n\nt listening \\*/\n\nexport class\
    \ TypedEvent<T\\> {\n\n private listeners: Listener<T>\\[\\] = \\[\\];\n\n private\
    \ listenersOncer: Listener<T>\\[\\] = \\[\\];\n\n on = (listener: Listener<T>):\
    \ Disposable => {\n\n this.listeners.push(listener);\n\n return {\n\n dispose:\
    \ () => this.off(listener)\n\n };\n\n }\n\n once = (listener: Listener<T>): void\
    \ => {\n\n this.listenersOncer.push(listener);\n\n }\n\n off = (listener: Listener<T>)\
    \ => {\n\n var callbackIndex = this.listeners.indexOf(listener);\n\n if (callbackIndex\
    \ > \\-1) this.listeners.splice(callbackIndex, 1);\n\n }\n\n emit = (event: T)\
    \ => {\n\n /\\*\\* Update any general listeners \\*/\n\n this.listeners.forEach((listener)\
    \ => listener(event));\n\n /\\*\\* Clear the \\`once\\` queue \\*/\n\n this.listenersOncer.forEach((listener)\
    \ => listener(event));\n\n this.listenersOncer = \\[\\];\n\n }\n\n pipe = (te:\
    \ TypedEvent<T>): Disposable => {\n\n return this.on((e) => te.emit(e));\n\n }\n\
    \n}\n\nTypesafe Event Emitter\n\n258"
