  md: 'Getting Started with TypeScript


    TypeScript Version


    **Getting Started With TypeScript**


    TypeScript compiles into JavaScript. JavaScript is what you are actually going
    to execute


    (either in the browser or on the server). So you are going to need the following:


    TypeScript compiler (OSS available in source and on NPM)


    A TypeScript editor (you can use notepad if you want but I use alm . Also lots
    of other


    IDES support it as well)


    ![](img/416f69818aa79e3f1fe0e7869c118431_7_0.png)


    **TypeScript Version**


    Instead of using the *stable* TypeScript compiler we will be presenting a lot
    of new stuff in this


    book that may not be associated with a version number yet. I generally recommend
    people


    to use the nightly version because **the compiler test suite only catches more
    bugs over**


    **time**.


    You can install it on the command line as


    npm install -g typescript@next


    Getting Started


