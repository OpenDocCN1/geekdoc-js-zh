  md: "class Foo {\n\n foo = 123;\n\n}\n\nclass Bar {\n\n bar = 123;\n\n}\n\nfunction\
    \ doStuff(arg: Foo | Bar) {\n\n if (arg instanceof Foo) {\n\n console.log(arg.foo);\
    \ // OK\n\n console.log(arg.bar); // Error!\n\n }\n\n else { // MUST BE Bar!\n\
    \n console.log(arg.foo); // Error!\n\n console.log(arg.bar); // OK\n\n }\n\n}\n\
    \ndoStuff(new Foo());\n\ndoStuff(new Bar());\n\n**Literal Type Guard**\n\nWhen\
    \ you have literal types in a union you can check them to discriminate e.g.\n\n\
    type Foo = {\n\n kind: 'foo', // Literal type \n\n foo: number\n\n}\n\ntype Bar\
    \ = {\n\n kind: 'bar', // Literal type \n\n bar: number\n\n}\n\nfunction doStuff(arg:\
    \ Foo | Bar) {\n\n if (arg.kind === 'foo') {\n\n console.log(arg.foo); // OK\n\
    \n console.log(arg.bar); // Error!\n\n }\n\n else { // MUST BE Bar!\n\n console.log(arg.foo);\
    \ // Error!\n\n console.log(arg.bar); // OK\n\n }\n\n}\n\n**User Defined Type\
    \ Guards**\n\nType Guard\n\n161"
