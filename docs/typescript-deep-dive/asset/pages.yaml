  md: "**Generics**\n\nThe key motivation for generics is to provide meaningful type\
    \ constraints between members.\n\nThe members can be:\n\nClass instance members\n\
    \nClass methods\n\nfunction arguments\n\nfunction return value\n\n**Motivation\
    \ and samples**\n\nConsider the simple  Queue  (first in, first out) data structure\
    \ implementation. A simple one in\n\nTypeScript / JavaScript looks like:\n\nclass\
    \ Queue {\n\n private data = \\[\\];\n\n push = (item) => this.data.push(item);\n\
    \n pop = () => this.data.shift();\n\n}\n\nOne issue with this implementation is\
    \ that it allows people to add *anything* to the queue and\n\nwhen they pop it\
    \ - it can be *anything*. This is shown below, where someone can push a\n\n string\
    \  onto the queue while the usage actually assumes that only  numbers  where pushed\n\
    \nin:\n\nclass Queue {\n\n private data = \\[\\];\n\n push = (item) => this.data.push(item);\n\
    \n pop = () => this.data.shift();\n\n}\n\nconst queue = new Queue();\n\nqueue.push(0);\n\
    \nqueue.push(\"1\"); // Ops a mistake\n\n// a developer walks into a bar\n\nconsole.log(queue.pop().toPrecision(1));\n\
    \nconsole.log(queue.pop().toPrecision(1)); // RUNTIME ERROR\n\nGenerics\n\n170"
  merge: -1
  pgno: 169
- img_proc: true
  md: "One solution (and in fact the only one in languages that don't support generics)\
    \ is to go\n\nahead and create *special* classes just for these contraints. E.g.\
    \ a quick and dirty number\n\nqueue:\n\nclass QueueNumber {\n\n private data =\
    \ \\[\\];\n\n push = (item: number) => this.data.push(item);\n\n pop = (): number\
    \ => this.data.shift();\n\n}\n\nconst queue = new QueueNumber();\n\nqueue.push(0);\n\
    \nqueue.push(\"1\"); // ERROR : cannot push a string. Only numbers allowed\n\n\
    // ^ if that error is fixed the rest would be fine too\n\nOf course this can quickly\
    \ become painful e.g. if you want a string queue you have to go\n\nthrough all\
    \ that effort again. What you really want is a way to say that whatever the type\
    \ is of\n\nthe stuff getting *pushed* it should be the same for whatever gets\
    \ *popped*. This is done easily\n\nwith a *generic* parameter (in this case, at\
    \ the class level):\n\n/\\*\\* A class definition with a generic parameter \\\
    */\n\nclass Queue<T> {\n\n private data = \\[\\];\n\n push = (item: T) => this.data.push(item);\n\
    \n pop = (): T => this.data.shift();\n\n}\n\n/\\*\\* Again sample usage \\*/\n\
    \nconst queue = new Queue<number\\>();\n\nqueue.push(0);\n\nqueue.push(\"1\");\
    \ // ERROR : cannot push a string. Only numbers allowed\n\n// ^ if that error\
    \ is fixed the rest would be fine too\n\nAnother example that we have already\
    \ seen is that of a *reverse* function, here the constraint\n\nis between what\
    \ gets passed into the function and what the function returns:\n\nGenerics\n\n\
    171"
  merge: -1
  pgno: 170
- img_proc: true
  md: "function reverse<T>(items: T\\[\\]): T\\[\\] {\n\n var toreturn = \\[\\];\n\
    \n for (let i = items.length - 1; i >= 0; i--) {\n\n toreturn.push(items\\[i\\\
    ]);\n\n }\n\n return toreturn;\n\n}\n\nvar sample = \\[1, 2, 3\\];\n\nvar reversed\
    \ = reverse(sample);\n\nconsole.log(reversed); // 3,2,1\n\n// Safety!\n\nreversed\\\
    [0\\] = '1'; // Error!\n\nreversed = \\['1', '2'\\]; // Error!\n\nreversed\\[0\\\
    ] = 1; // Okay\n\nreversed = \\[1, 2\\]; // Okay\n\nIn this section you have seen\
    \ examples of generics being defined *at class level* and at\n\n*function level*.\
    \ One minor addition worth mentioning is that you can have generics created\n\n\
    just for a member function. As a toy example consider the following where we move\
    \ the\n\n reverse  function into a  Utility  class:\n\nclass Utility {\n\n reverse<T>(items:\
    \ T\\[\\]): T\\[\\] {\n\n var toreturn = \\[\\];\n\n for (let i = items.length\
    \ - 1; i >= 0; i--) {\n\n toreturn.push(items\\[i\\]);\n\n }\n\n return toreturn;\n\
    \n }\n\n}\n\nTIP: You can call the generic parameter whatever you want. It is\
    \ conventional to use\n\n T ,  U ,  V  when you have simple generics. If you have\
    \ more than one generic\n\nargument try to use meaningful names e.g.  TKey  and\
    \  TValue  (conventional to prefix\n\nwith  T  as generics are also called *templates*\
    \ in other languages e.g. C++).\n\n**Generics in TSX**\n\nBecause  .tsx  /  .jsx\
    \  uses syntax like  <div>  to denote JSX blocks it offers a few unique\n\nchallenges\
    \ for Generics.\n\nQuick Tip: Use  as Foo  syntax for type assertions as we mentioned\
    \ before.\n\nGenerics\n\n172"
