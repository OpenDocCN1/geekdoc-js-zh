  md: "** super **\n\nNote that if you call  super  on a child class it is redirected\
    \ to the  prototype  as shown\n\nbelow:\n\nclass Base {\n\n log() { console.log('hello\
    \ world'); }\n\n}\n\nclass Child extends Base {\n\n log() { super.log() };\n\n\
    }\n\ngenerates:\n\nvar Base = (function () {\n\n function Base() {\n\n }\n\n Base.prototype.log\
    \ = function () { console.log('hello world'); };\n\n return Base;\n\n})();\n\n\
    var Child = (function (\\_super) {\n\n \\_\\_extends(Child, \\_super);\n\n function\
    \ Child() {\n\n \\_super.apply(this, arguments);\n\n }\n\n Child.prototype.log\
    \ = function () { \\_super.prototype.log.call(this); };\n\n return Child;\n\n\
    })(Base);\n\nNotice  \\_super.prototype.log.call(this) .\n\nThis means that you\
    \ cannot use  super  on member properties. Instead you should just use\n\n this\
    \ .\n\nclass Base {\n\n log = () => { console.log('hello world'); }\n\n}\n\nclass\
    \ Child extends Base {\n\n logWorld() { this.log() };\n\n}\n\nNotice since there\
    \ is only one  this  shared between the  Base  and the  Child  class you\n\nneed\
    \ to use *different* names (here  log  and  logWorld ).\n\nClasses Super\n\n33"
