  md: "**Truthy**\n\nJavaScript has a concept of  truthy  i.e. things that evaluate\
    \ like  true  would in certain\n\npositions (e.g.  if  conditions and the boolean\
    \  &&   ||  operators). The following things are\n\ntruthy in JavaScript. An example\
    \ is any number other than  0  e.g.\n\nif (123) { // Will be treated like \\`true\\\
    `\n\n console.log('Any number other than 0 is truthy');\n\n}\n\nSomething that\
    \ isn't truthy is called  falsy .\n\nHere's a handy table for your reference.\n\
    \n**Variable Type**\n\n**When it is *****falsy***\n\n**When it is**\n\n***truthy***\n\
    \n boolean \n\n false \n\n true \n\n string \n\n ''  (empty\n\nstring)\n\nany\
    \ other string\n\n number \n\n 0   NaN \n\nany other\n\nnumber\n\n null \n\nalways\n\
    \nnever\n\n undefined \n\nalways\n\nnever\n\nAny other Object including empty\
    \ ones like\n\n {} , \\[\\] \n\nnever\n\nalways\n\n**Being explicit**\n\nThe \
    \ !!  pattern\n\nQuite commonly it helps to be explicit that the intent is to\
    \ treat the value as a  boolean  and\n\nconvert it into a *true boolean* (one\
    \ of  true | false ). You can easily convert values to a true\n\nboolean by prefixing\
    \ it with  !!  e.g.  !!foo . Its just  !  used *twice*. The first  !  converts\
    \ the\n\nvariable (in this case  foo ) to a boolean but inverts the logic (*truthy*\
    \ - ! \\>  false , *falsy* - ! \\>\n\n true ). The second one toggles it again\
    \ to match the nature of the original object (e.g. *truthy*\n\n\\- ! \\>  false\
    \  - ! \\>  true ).\n\nIt is common to use this pattern in lots of places e.g.\n\
    \nTruthy\n\n250"
  merge: -1
