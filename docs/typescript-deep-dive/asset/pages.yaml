  md: "**TypeScript with Node.js**\n\nTypeScript has had *first class* support for\
    \ Node.js since inception. Here's how to setup a\n\nquick Node.js project:\n\n\
    Note: many of these steps are actually just common practice Node.js setup steps\n\
    \n1\\. Setup a Node.js project  package.json . Quick one :  npm init -y \n\n2\\\
    . Add TypeScript ( npm install typescript --save-dev )\n\n3\\. Add  node.d.ts\
    \  ( npm install @types/node --save-dev )\n\n4\\. Init a  tsconfig.json  for TypeScript\
    \ options ( node ./node\\_modules/typescript/lib/tsc --\n\ninit )\n\n5\\. Make\
    \ sure you have  compilerOptions.module:commonjs  in your tsconfig.json\n\nThat's\
    \ it! Fire up your IDE (e.g.  alm -o ) and play around. Now you can use all the\
    \ built in\n\nnode modules (e.g.  import fs = require('fs'); ) with all the safety\
    \ and developer\n\nergonomics of TypeScript!\n\n**Bonus: Live compile + run**\n\
    \nAdd  ts-node  which we will use for live compile + run in node ( npm install\
    \ ts-node --\n\nsave-dev )\n\nAdd  nodemon  which will invoke  ts-node  whenever\
    \ a file is changed ( npm install\n\nnodemon --save-dev )\n\nNow just add a  script\
    \  target to your  package.json  based on your application entry e.g.\n\nassuming\
    \ its  index.ts :\n\n \"scripts\": {\n\n \"start\": \"npm run build:live\",\n\n\
    \ \"build:live\": \"nodemon --exec ./node\\_modules/.bin/ts-node -- ./index.ts\"\
    \n\n },\n\nSo you can now run  npm start  and as you edit  index.ts :\n\nnodemon\
    \ reruns its command (ts-node)\n\nts-node transpiles automatically picking up\
    \ tsconfig.json and the installed typescript\n\nversion,\n\nts-node runs the output\
    \ javascript through Node.js.\n\nNode.js QuickStart\n\n105"
