  md: "**Limit usage of property setters**\n\nPrefer explicit set/get functions (e.g.\
    \  setBar  and  getBar  functions) over setters/getters.\n\nConsider the following\
    \ code:\n\nfoo.bar = {\n\n a: 123,\n\n b: 456\n\n};\n\nIn the presence of setter/getters:\n\
    \nclass Foo {\n\n a: number;\n\n b: number;\n\n set bar(value:{a:number,b:number})\
    \ {\n\n this.a = value.a;\n\n this.b = value.b;\n\n }\n\n}\n\nlet foo = new Foo();\n\
    \nThis is not a *good* use of property setters. The person reading the first code\
    \ sample has no\n\ncontext about all the things that will change. Where as someone\
    \ calling  foo.setBar(value) \n\nmight have an idea that something might change\
    \ on  foo .\n\nBonus points: Find references works better if you have different\
    \ functions. In TypeScript\n\ntools if you find references for a getter or a setter\
    \ you get *both* whereas with explicit\n\nfunction calls you only get references\
    \ to the relevant function.\n\nLimit Property Setters\n\n237"
