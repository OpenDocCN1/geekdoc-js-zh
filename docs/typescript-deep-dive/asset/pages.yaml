  md: "**JSX Support**\n\nTypeScript supports JSX transpilation and code analysis.\
    \ If you are unfamiliar with JSX here\n\nis an excerpt from the official website:\n\
    \nJSX is a XML-like syntax extension to ECMAScript without any defined semantics.\
    \ It's\n\nNOT intended to be implemented by engines or browsers. It's NOT a proposal\
    \ to\n\nincorporate JSX into the ECMAScript spec itself. It's intended to be used\
    \ by various\n\npreprocessors (transpilers) to transform these tokens into standard\
    \ ECMAScript.\n\nThe motivation behind JSX is to allow users to write HTML like\
    \ views *in JavaScript* so that\n\nyou can:\n\nHave the view Type Checked by the\
    \ same code that is going to check your JavaScript\n\nHave the view be aware of\
    \ the context it is going to operate under (i.e. strengthen the\n\n*controller-view*\
    \ connection in traditional MVC)\n\nThis decreases the chances of errors and increases\
    \ the maintainability of your user\n\ninterfaces. The main consumer of JSX at\
    \ this point is ReactJS from facebook. This is the\n\nusage of JSX that we will\
    \ discuss here.\n\n**Setup**\n\nUse files with the extension  .tsx  (instead of\
    \  .ts ).\n\nUse  \"jsx\" : \"react\"  in your  tsconfig.json 's  compilerOptions\
    \ .\n\nInstall the definitions for JSX and React into your project : ( npm i -D\
    \ @types/react\n\n@types/react-dom ).\n\nImport react into your  .tsx  files (\
    \ import \\* as React from \"react\" ).\n\n**HTML Tags vs. Components**\n\nReact\
    \ can either render HTML tags (strings) or React components (classes). The JavaScript\n\
    \nemit for these elements is different ( React.createElement('div')  vs.\n\n React.createElement(MyComponent)\
    \ ). The way this is determined is by the *case* of the *first*\n\nletter.  foo\
    \  is treated as an HTML tag and  Foo  is treated as a component.\n\n**Type Checking**\n\
    \nJSX\n\n210"
  merge: -1
  pgno: 209
- img_proc: true
  md: "**HTML Tags**\n\nAn HTML Tag  foo  is to be of the type  JSX.IntrinsicElements.foo\
    \ . These types are already\n\ndefined for all the major tags in a file  react-jsx.d.ts\
    \  which we had you install as a part of\n\nthe setup. Here is a sample of the\
    \ the contents of the file:\n\ndeclare module JSX {\n\n interface IntrinsicElements\
    \ {\n\n a: React.HTMLAttributes;\n\n abbr: React.HTMLAttributes;\n\n div: React.HTMLAttributes;\n\
    \n span: React.HTMLAttributes;\n\n /// so on ...\n\n }\n\n}\n\n**Components**\n\
    \nComponents are type checked based on the  props  property of the component.\
    \ This is\n\nmodeled after how JSX is transformed i.e. the attributes become the\
    \  props  of the\n\ncomponent.\n\nTo create React components we recommend using\
    \ ES6 classes. The  react.d.ts  file\n\ndefines the  React.Component<Props,State>\
    \  class which you should extend in your own class\n\nproviding your own  Props\
    \  and  State  interfaces. This is demonstrated below:\n\ninterface Props {\n\n\
    \ foo: string;\n\n}\n\nclass MyComponent extends React.Component<Props, {}> {\n\
    \n render() {\n\n return <span>{this.props.foo}</span>\n\n }\n\n}\n\n<MyComponent\
    \ foo=\"bar\" />\n\n**React JSX Tip: Interface for renderable**\n\nReact can render\
