    \ }\n\nconst good: FromIndex = {b:1, c:2}\n\n// Error:\n\n// Type '{ b: number;\
    \ c: number; d: number; }' is not assignable to type 'FromIndex'.\n\n// Object\
    \ literal may only specify known properties, and 'd' does not exist in type '\n\
    \nFromIndex'.\n\nconst bad: FromIndex = {b:1, c:2, d:3};\n\nThis is often used\
    \ together with  keyof typeof  to capture vocabulary types, described on the\n\
    \nnext page.\n\nThe specification of the vocabulary can be deferred generically:\n\
    \ntype FromSomeIndex<K extends string\\> = { \\[key in K\\]: number }\n\n**Having\
    \ both **** string **** and **** number **** indexers**\n\nThis is not a common\
    \ use case, but TypeScript compiler supports it nonetheless.\n\nHowever it has\
    \ the restriction that the  string  indexer is more strict than the  number \n\
    \nindexer. This is intentional e.g. to allow typing stuff like:\n\ninterface ArrStr\
    \ {\n\n \\[key: string\\]: string | number; // Must accomodate all members\n\n\
    \ \\[index: number\\]: string; // Can be a subset of string indexer\n\n // Just\
    \ an example member\n\n length: number;\n\n}\n\n**Design Pattern: Nested index\
    \ signature**\n\nAPI consideration when adding index signatures\n\nQuite commonly\
    \ in the JS community you will see APIs that abuse string indexers. e.g. a\n\n\
    common pattern among CSS in JS libraries:\n\nIndex Signatures\n\n200"
