  md: "JavaScript doesn't have very rich runtime introspection support built in. When\
    \ you are using\n\njust plain JavaScript Objects (using structural typing to your\
    \ advantage), you do not even\n\nhave access to  instanceof  or  typeof . For\
    \ these cases you can create *User Defined Type*\n\n*Guard functions*. These are\
    \ just functions that return  someArgumentName is SomeType . Here is\n\nan example:\n\
    \n/\\*\\*\n\n \\* Just some interfaces\n\n \\*/\n\ninterface Foo {\n\n foo: number;\n\
    \n common: string;\n\n}\n\ninterface Bar {\n\n bar: number;\n\n common: string;\n\
    \n}\n\n/\\*\\*\n\n \\* User Defined Type Guard!\n\n \\*/\n\nfunction isFoo(arg:\
    \ any): arg is Foo {\n\n return arg.foo !== undefined;\n\n}\n\n/\\*\\*\n\n \\\
    * Sample usage of the User Defined Type Guard\n\n \\*/\n\nfunction doStuff(arg:\
    \ Foo | Bar) {\n\n if (isFoo(arg)) {\n\n console.log(arg.foo); // OK\n\n console.log(arg.bar);\
    \ // Error!\n\n }\n\n else {\n\n console.log(arg.foo); // Error!\n\n console.log(arg.bar);\
    \ // OK\n\n }\n\n}\n\ndoStuff({ foo: 123, common: '123' });\n\ndoStuff({ bar:\
    \ 123, common: '123' });\n\nType Guard\n\n162"
  merge: -1
