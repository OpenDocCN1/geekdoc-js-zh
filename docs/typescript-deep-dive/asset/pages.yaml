  md: "**Null and Undefined**\n\nFact is you will need to deal with both. Just check\
    \ for either with  ==  check.\n\n/// Imagine you are doing \\`foo.bar == undefined\\\
    ` where bar can be one of:\n\nconsole.log(undefined == undefined); // true\n\n\
    console.log(null == undefined); // true\n\nconsole.log(0 == undefined); // false\n\
    \nconsole.log('' == undefined); // false\n\nconsole.log(false == undefined); //\
    \ false\n\nRecommend  == null  to check for both  undefined  or  null . You generally\
    \ don't want to\n\nmake a distinction between the two.\n\n**undefined**\n\nRemember\
    \ how I said you should use  == null . Of course you do (cause I just said it\
    \ ^).\n\nDon't use it for root level things. In strict mode if you use  foo  and\
    \  foo  is undefined you\n\nget a  ReferenceError  **exception** and the whole\
    \ call stack unwinds.\n\nYou should use strict mode ... and in fact the TS compiler\
    \ will insert it for you if you use\n\nmodules ... more on those later in the\
    \ book so you don't have to be explicit about it :)\n\nSo to check if a variable\
    \ is defined or not at a *global* level you normally use  typeof :\n\nif (typeof\
    \ someglobal !== 'undefined') {\n\n // someglobal is now safe to use\n\n console.log(someglobal);\n\
    \n}\n\nNull vs. Undefined\n\n19"
