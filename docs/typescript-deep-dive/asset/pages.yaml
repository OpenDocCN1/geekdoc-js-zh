  md: "![](img/416f69818aa79e3f1fe0e7869c118431_140_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_140_1.png)\n\
    \n**Example **** window **\n\nJust add stuff to the  Window  interface e.g.:\n\
    \ninterface Window {\n\n helloWorld(): void;\n\n}\n\nThis will allow you to use\
    \ it in a *type safe* manner:\n\n// Add it at runtime\n\nwindow.helloWorld = ()\
    \ => console.log('hello world');\n\n// Call it\n\nwindow.helloWorld();\n\n// Misuse\
    \ it and you get an error:\n\nwindow.helloWorld('gracius'); // Error: Supplied\
    \ parameters do not match the signature\n\n of the call target\n\n**Example ****\
    \ Math **\n\nThe global variable  Math  is defined in  lib.d.ts  as (again, use\
    \ your dev tools to navigate\n\nto definition):\n\n/\\*\\* An intrinsic object\
    \ that provides basic mathematics functionality and constants. \\*/\n\ndeclare\
    \ var Math: Math;\n\ni.e. the variable  Math  is an instance of the  Math  interface.\
    \ The  Math  interface is defined\n\nas:\n\ninterface Math {\n\n E: number;\n\n\
    \ LN10: number;\n\n // others ...\n\n}\n\nThis means that if you want to add stuff\
    \ to the  Math  global variable you just need to add it\n\nto the  Math  global\
    \ interface, e.g. consider the  seedrandom  project which adds a\n\n seedrandom\
    \  function to the global  Math  object. This can be declared quite easily:\n\n\
    interface Math {\n\n seedrandom(seed?: string);\n\n}\n\nlib.d.ts\n\n141"
  merge: -1
  pgno: 140
- img_proc: true
  md: "And then you can just use it:\n\nMath.seedrandom();\n\n// or\n\nMath.seedrandom(\"\
    Any string you want!\");\n\n**Example **** Date **\n\nIf you will look on the\
    \ definition of the  Date  *variable* in  lib.d.ts  you will find:\n\ndeclare\
    \ var Date: DateConstructor;\n\nThe interface  DateConstructor  is similar to\
    \ what you have seen before with  Math  and\n\n Window  in that it contains members\
    \ you can use off of the  Date  global variable e.g.\n\n Date.now() . In addition\
    \ to these members it contains *construct* signatures which allow you\n\nto create\
    \  Date  instances (e.g.  new Date() ). A snippet of the  DateConstructor  interface\
    \ is\n\nshown below:\n\ninterface DateConstructor {\n\n new (): Date;\n\n // ...\
    \ other construct signatures\n\n now(): number;\n\n // ... other member functions\n\
    \n}\n\nConsider the project  datejs . DateJS adds members to both the  Date  global\
    \ variable and\n\n Date  instances. Therefore a TypeScript definition for this\
    \ library would look like (BTW the\n\ncommunity has already written this for you\
    \ in this case):\n\n/\\*\\* DateJS Public Static Methods \\*/\n\ninterface DateConstructor\
    \ {\n\n /\\*\\* Gets a date that is set to the current date. The time is set to\
    \ the start of t\n\nhe day (00:00 or 12:00 AM) \\*/\n\n today(): Date;\n\n //\
    \ ... so on and so forth\n\n}\n\n/\\*\\* DateJS Public Instance Methods \\*/\n\
    \ninterface Date {\n\n /\\*\\* Adds the specified number of milliseconds to this\
    \ instance. \\*/\n\n addMilliseconds(milliseconds: number): Date;\n\n // ... so\
    \ on and so forth\n\n}\n\nlib.d.ts\n\n142"
