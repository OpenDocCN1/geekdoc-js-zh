  md: "**Bind is Harmful**\n\nThis is the definition of  bind  in  lib.d.ts :\n\n\
    bind(thisArg: any, ...argArray: any\\[\\]): any;\n\nAs you can see it returns\
    \ **any**! That means that calling  bind  on a function will cause you to\n\n\
    completely lose any type safety of the original function signature.\n\nFor example\
    \ the following compiles:\n\nfunction twoParams(a:number,b:number) {\n\n return\
    \ a + b;\n\n}\n\nlet curryOne = twoParams.bind(null,123);\n\ncurryOne(456); //\
    \ Okay but is not type checked!\n\ncurryOne('456'); // Allowed because it wasn't\
    \ type checked!\n\nA better way to write it would be with a simple arrow function\
    \ with an explicit type annotation:\n\nfunction twoParams(a:number,b:number) {\n\
    \n return a + b;\n\n}\n\nlet curryOne = (x:number)=>twoParams(123,x);\n\ncurryOne(456);\
    \ // Okay and type checked!\n\ncurryOne('456'); // Error!\n\nBut if you expect\
    \ a curried function there is a better pattern for that.\n\n**Class Members**\n\
    \nAnother common use is to use  bind  to ensure the correct value of  this  when\
    \ passing\n\naround class functions. Don't do that!\n\nThe following demonstrates\
    \ the fact that you lose parameter type safety if you use  bind :\n\nBind is Bad\n\
    \n226"
