- img_proc: true
  md: "TIP: the name of the index signature e.g.  index  in  { \\[index:string\\]\
    \ : {message:\n\nstring} }  has no significance for TypeScript and really for\
    \ readability. e.g. if its user\n\nnames you can do  { \\[username:string\\] :\
    \ {message: string} }  to help the next dev\n\nwho looks at the code (which just\
    \ might happen to be you).\n\nOf course  number  indexes are also supported e.g.\
    \  { \\[count: number\\] :\n\nSomeOtherTypeYouWantToStoreEgRebate } \n\n**All\
    \ members must conform to the **** string **** index**\n\n**signature**\n\nAs\
    \ soon as you have a  string  index signature, all explicit members must also\
    \ conform to\n\nthat index signature. This is shown below:\n\n/\\*\\* Okay \\\
    */\n\ninterface Foo {\n\n \\[key:string\\]: number\n\n x: number;\n\n y: number;\n\
    \n}\n\n/\\*\\* Error \\*/\n\ninterface Bar {\n\n \\[key:string\\]: number\n\n\
    \ x: number;\n\n y: string; // Property \\`y\\` must of of type number\n\n}\n\n\
    This is to provide safety so that any string access gives the same result:\n\n\
    interface Foo {\n\n \\[key:string\\]: number\n\n x: number;\n\n}\n\nlet foo: Foo\
    \ = {x:1,y:2};\n\n// Directly\n\nfoo\\['x'\\]; // number\n\n// Indirectly\n\n\
    let x = 'x'\n\nfoo\\[x\\]; // number\n\n**Using a limited set of string literals**\n\
    \nAn index signature can require that index strings be members of a union of literal\
    \ strings\n\ne.g.:\n\nIndex Signatures\n\n199"
  merge: -1
  pgno: 198
