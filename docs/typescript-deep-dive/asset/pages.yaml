    \nsetTimeout(person.growOld,1000);\n\nsetTimeout(function() { console.log(person.age);\
    \ },2000); // 2\n\nA sweet video about this pattern \n\n**Tip: Arrow Function\
    \ Need**\n\nArrow Functions\n\n36"
