  md: "let foo: {\n\n readonly bar: number;\n\n} = {\n\n bar: 123\n\n };\n\nfunction\
    \ iMutateFoo(foo: { bar: number }) {\n\n foo.bar = 456;\n\n}\n\niMutateFoo(foo);\
    \ // The foo argument is aliased by the foo parameter\n\nconsole.log(foo.bar);\
    \ // 456!\n\nBasically  readonly  ensures that *cannot be modified by me*, but\
    \ if you give it to someone\n\nthat doesn't have that guarantee (allowed for type\
    \ compatibility reasons) they can modify it.\n\nOf course if  iMutateFoo  said\
    \ that they do not mutate  foo.bar  the compiler would correctly\n\nflag it as\
    \ an error as shown:\n\ninterface Foo {\n\n readonly bar: number;\n\n}\n\nlet\
    \ foo: Foo = {\n\n bar: 123\n\n};\n\nfunction iTakeFoo(foo: Foo) {\n\n foo.bar\
    \ = 456; // Error! bar is readonly\n\n}\n\niTakeFoo(foo); // The foo argument\
