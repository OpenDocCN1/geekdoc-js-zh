  md: "**Function Parameters**\n\nIf you have a function that takes too many parameters,\
    \ or parameters of the same type, then\n\nyou might want to consider changing\
    \ the function to take an object instead.\n\nConsider the following function:\n\
    \nfunction foo(flagA: boolean, flagB: boolean) {\n\n // your awesome function\
    \ body \n\n}\n\nWith such a function definition it's quite easy to invoke it incorrectly\
    \ e.g.  foo(flagB, flagA) \n\nand you would get no help from the compiler.\n\n\
    Instead, convert the function to take an object:\n\nfunction foo(config: {flagA:\
    \ boolean, flagB: boolean}) {\n\n const {flagA, flagB} = config;\n\n // your awesome\
    \ function body \n\n}\n\nNow the function calls will look like  foo({flagA, flagB})\
    \  which makes it much easier to spot\n\nmistakes and code review.\n\nNote : If\
    \ your function is simple enough, and you don't expect much churn, then feel\n\
    \nfree to ignore this advice .\n\nFunction parameters\n\n249"
