  md: " \\* This is a reducer, a pure function with (state, action) => state signature.\n\
    \n \\* It describes how an action transforms the state into the next state.\n\n\
    \ \\*\n\n \\* The shape of the state is up to you: it can be a primitive, an array,\
    \ an object,\n\n \\* or even an Immutable.js data structure. The only important\
    \ part is that you should\n\n \\* not mutate the state object, but return a new\
    \ object if the state changes.\n\n \\*\n\n \\* In this example, we use a \\`switch\\\
    ` statement and strings, but you can use a helper \n\nthat\n\n \\* follows a different\
    \ convention (such as function maps) if it makes sense for your\n\n \\* project.\n\
    \n \\*/\n\nfunction counter(state = 0, action: Action) {\n\n switch (action.type)\
    \ {\n\n case 'INCREMENT':\n\n return state + 1\n\n case 'DECREMENT':\n\n return\
    \ state - 1\n\n default:\n\n return state\n\n }\n\n}\n\n// Create a Redux store\
    \ holding the state of your app.\n\n// Its API is { subscribe, dispatch, getState\
    \ }.\n\nlet store = createStore(counter)\n\n// You can use subscribe() to update\
    \ the UI in response to state changes.\n\n// Normally you'd use a view binding\
    \ library (e.g. React Redux) rather than subscribe(\n\n) directly.\n\n// However\
    \ it can also be handy to persist the current state in the localStorage.\n\nstore.subscribe(()\
    \ =>\n\n console.log(store.getState())\n\n)\n\n// The only way to mutate the internal\
    \ state is to dispatch an action.\n\n// The actions can be serialized, logged\
    \ or stored and later replayed.\n\nstore.dispatch({ type: 'INCREMENT' })\n\n//\
    \ 1\n\nstore.dispatch({ type: 'INCREMENT' })\n\n// 2\n\nstore.dispatch({ type:\
    \ 'DECREMENT' })\n\n// 1\n\nUsing it with TypeScript gives you safety against\
    \ typo errors, increased refactor-ability and\n\nself documenting code .\n\nDiscriminated\
    \ Unions\n\n195"
  merge: -1
  pgno: 194
