  md: "** strictNullChecks **\n\nBy default  null  and  undefined  are assignable\
    \ to all types in TypeScript e.g.\n\nlet foo: number = 123;\n\nfoo = null; //\
    \ Okay\n\nfoo = undefined; // Okay\n\nThis is modelled after how a lot of people\
    \ write JavaScript. However like all things\n\nTypeScript allows you to be *explicit*\
    \ about what *can and cannot be* assigned a  null  or\n\n undefined .\n\nIn strict\
    \ null checking mode,  null  and  undefined  are different:\n\nlet foo = undefined;\n\
    \nfoo = null; // NOT Okay\n\nLet say we have a  Member  interface:\n\ninterface\
    \ Member {\n\n name: string,\n\n age?: number\n\n}\n\nNot every member will provide\
    \ their age, so the  age  is an optional property. It means the\n\nvalue of  age\
    \  will probably be  undefined .\n\n undefined  is the root of all evil. It always\
    \ lead to runtime error. We are always easy to write\n\nsome code that will probably\
    \ throw  Error :\n\ngetMember()\n\n .then(member: Member => {\n\n const stringifyAge\
    \ = member.age.toString() // probably throw Cannot read property \n\n'toString'\
    \ of undefined\n\n })\n\nBut in strict null checking mode, it will throw an error\
    \ at compile time:\n\ngetMember()\n\n .then(member: Member => {\n\n const stringifyAge\
    \ = member.age.toString() // Object is possibly 'undefined'\n\n })\n\nstrictNullChecks\n\
    \n217"
  merge: -1
  pgno: 216
- img_proc: true
  md: "**Non-Null Assertion Operator**\n\nA new  !  post-fix expression operator may\
    \ be used to assert that its operand is non-null\n\nand non-undefined in contexts\
    \ where the type checker is unable to conclude that fact. For\n\nexample:\n\n\
    // Compiled with --strictNullChecks\n\nfunction validateEntity(e?: Entity) {\n\
    \n // Throw exception if e is null or invalid entity\n\n}\n\nfunction processEntity(e?:\
    \ Entity) {\n\n validateEntity(e);\n\n let a = e.name; // TS ERROR: e may be null.\n\
    \n let b = e!.name; // Assert that e is non-null. This allows you to access name\n\
    \n}\n\nNote that it is just an assertion, and just like type assertions *you are\
    \ responsible* for\n\nmaking sure the value is not null. A null assertion is essentially\
    \ you telling the compiler\n\n\"I know its not null so let me use it as though\
    \ its not null\".\n\nstrictNullChecks\n\n218"
