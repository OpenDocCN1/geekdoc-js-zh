  md: "**Variables**\n\nFor example to tell TypeScript about the  process  variable\
    \ you *can* do:\n\ndeclare var process: any;\n\nYou don't *need* to do this for\
    \  process  as there is already a community maintained\n\n node.d.ts .\n\nThis\
    \ allows you to use the  process  variable without TypeScript complaining:\n\n\
    process.exit();\n\nWe recommend using an interface wherever possible e.g.:\n\n\
    interface Process {\n\n exit(code?: number): void;\n\n}\n\ndeclare var process:\
    \ Process;\n\nThis allows other people to *extend* the nature of these global\
    \ variables while still telling\n\nTypeScript about such modifications. E.g. consider\
    \ the following case where we add an\n\n exitWithLogging  function to process\
    \ for our amusement:\n\ninterface Process {\n\n exitWithLogging(code?: number):\
    \ void;\n\n}\n\nprocess.exitWithLogging = function() {\n\n console.log(\"exiting\"\
    );\n\n process.exit.apply(process, arguments);\n\n};\n\nLet's look at interfaces\
    \ in a bit more detail next.\n\nVariables\n\n128"
  merge: -1
