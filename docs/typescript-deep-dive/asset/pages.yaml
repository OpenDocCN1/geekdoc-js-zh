    \ make sense, don't worry, as you get a nice compiler\n\nerror from TypeScript\
    \ saying \"unused label\" anyways. You can fix it by surrounding the\n\nobject\
    \ literal with  () :\n\nvar foo = () => ({\n\n bar: 123\n\n});\n\nQuick Object\
