  md: "**Stateful Functions**\n\nA common feature in other programming languages is\
    \ usage of the  static  keyword to\n\nincrease the *lifetime* (not *scope*) of\
    \ a function variable to live beyond function invocations.\n\nHere is a  C  sample\
    \ that achieves this:\n\nvoid called() {\n\n static count = 0;\n\n count++;\n\n\
    \ printf(\"Called : %d\", count);\n\n}\n\nint main () {\n\n called(); // Called\
    \ : 1\n\n called(); // Called : 2\n\n return 0;\n\n}\n\nSince JavaScript (or TypeScript)\
    \ doesn't have function statics you can achieve the same\n\nthing using various\
    \ abstractions that wrap over a local variable e.g. using a  class  :\n\nconst\
    \ {called} = new class {\n\n count = 0;\n\n called = () => {\n\n this.count++;\n\
    \n console.log(\\`Called : ${this.count}\\`);\n\n }\n\n};\n\ncalled(); // Called\
    \ : 1\n\ncalled(); // Called : 2\n\nC++ developers also try and achieve this using\
    \ a pattern they call  functor  (a class\n\nthat overrides the operator  () ).\n\
    \nStateful Functions\n\n225"
  merge: -1
