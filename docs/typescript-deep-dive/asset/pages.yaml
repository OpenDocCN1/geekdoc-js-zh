  md: "**Never**\n\nA video lesson on the never type\n\nProgramming language design\
    \ does have a concept of *bottom* type that is a **natural**\n\noutcome as soon\
    \ as you do *code flow analysis*. TypeScript does *code flow analysis* (ᚕ) and\n\
    \nso it needs to reliably represent stuff that might never happen.\n\nThe  never\
    \  type is used in TypeScript to denote this *bottom* type. Cases when it occurs\n\
    \nnaturally:\n\nA function never returns (e.g. if the function body has  while(true){}\
    \ )\n\nA function always throws (e.g. in  function foo(){throw new Error('Not\
    \ Implemented')} \n\nthe return type of  foo  is  never )\n\nOf course you can\
    \ use this annotation your self as well\n\nlet foo: never; // Okay\n\nHowever\
    \  never  *can only ever be assigned to another never*. e.g.\n\nlet foo: never\
    \ = 123; // Error: Type number is not assignable to never\n\n// Okay as the function's\
    \ return type is \\`never\\`\n\nlet bar: never = (() => { throw new Error('Throw\
    \ my hands in the air like I just dont \n\ncare') })();\n\nGreat. Now let's just\
    \ jump into its key use case :)\n\n**Use case: Exhaustive Checks**\n\nYou can\
    \ call never functions in a never context\n\nNever Type\n\n190"
  merge: -1
