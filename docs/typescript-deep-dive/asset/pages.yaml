  md: "**Singleton Pattern**\n\nThe conventional singleton pattern is really something\
    \ that is used to overcome the fact that\n\nall code must be in a  class .\n\n\
    class Singleton {\n\n private static instance: Singleton;\n\n private constructor()\
    \ {\n\n // do something construct...\n\n }\n\n static getInstance() {\n\n if (!Singleton.instance)\
    \ {\n\n Singleton.instance = new Singleton();\n\n // ... any one time initialization\
    \ goes here ...\n\n }\n\n return Singleton.instance;\n\n }\n\n someMethod() {\
    \ }\n\n}\n\nlet something = new Singleton() // Error: constructor of 'Singleton'\
    \ is private.\n\nlet instance = Singleton.getInstance() // do something with the\
    \ instance...\n\nHowever if you don't want lazy initialization you can instead\
    \ just use a  namespace :\n\nnamespace Singleton {\n\n // ... any one time initialization\
    \ goes here ...\n\n export function someMethod() { }\n\n}\n\n// Usage\n\nSingleton.someMethod();\n\
    \nWarning : Singleton is just a fancy name for global\n\nFor most projects  namespace\
    \  can additionally be replaced by a *module*.\n\n// someFile.ts\n\n// ... any\
    \ one time initialization goes here ...\n\nexport function someMethod() { }\n\n\
    // Usage\n\nimport {someMethod} from \"./someFile\";\n\nsingleton pattern\n\n\
    247"
