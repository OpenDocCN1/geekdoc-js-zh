  md: "**Literals**\n\nLiterals are *exact* values that are JavaScript primitives.\n\
    \n**String Literals**\n\nYou can use a string literal as a type. For example:\n\
    \nlet foo: 'Hello';\n\nHere we have created a variable called  foo  that *will\
    \ only allow the literal value ** 'Hello' ** to*\n\n*be assigned to it*. This\
    \ is demonstrated below:\n\nlet foo: 'Hello';\n\nfoo = 'Bar'; // Error: \"Bar\"\
    \ is not assignable to type \"Hello\"\n\nThey are not very useful on their own\
    \ but can be combined in a type union to create a\n\npowerful (and useful) abstraction\
    \ e.g.:\n\ntype CardinalDirection =\n\n \"North\"\n\n | \"East\"\n\n | \"South\"\
    \n\n | \"West\";\n\nfunction move(distance: number, direction: CardinalDirection)\
    \ {\n\n // ...\n\n}\n\nmove(1,\"North\"); // Okay\n\nmove(1,\"Nurth\"); // Error!\n\
    \n**Other literal types**\n\nTypeScript also supports  boolean ,  numbers  as\
    \ literals, e.g.:\n\ntype OneToFive = 1 | 2 | 3 | 4 | 5;\n\ntype Bools = true\
    \ | false;\n\n**Inference**\n\nLiteral Types\n\n163"
  merge: -1
  pgno: 162
- img_proc: true
  md: "Quite commonly you get an error like  Type string is not assignable to type\
    \ \"foo\" . The\n\nfollowing example demonstrates this.\n\nfunction iTakeFoo(foo:\
    \ 'foo') { }\n\nconst test = {\n\n someProp: 'foo'\n\n};\n\niTakeFoo(test.someProp);\
    \ // Error: Argument of type string is not assignable to parame\n\nter of type\
    \ 'foo'\n\nThis is because  test  is inferred to be of type  {someProp: string}\
    \ . The fix here is to use a\n\nsimple type assertion to tell TypeScript the literal\
    \ you want it to infer as shown below:\n\nfunction iTakeFoo(foo: 'foo') { }\n\n\
    const test = {\n\n someProp: 'foo' as 'foo'\n\n};\n\niTakeFoo(test.someProp);\
    \ // Okay!\n\n**Use cases**\n\nValid use cases for string literal types are:\n\
    \n**String based enums**\n\nTypeScript enums are number based. You can use string\
    \ literals with union types to mock a\n\nstring based enum as we did in the  CardinalDirection\
    \  example above. You can even\n\ngenerate a  Key:Value  structure using the following\
    \ function:\n\n/\\*\\* Utility function to create a K:V from a list of strings\
    \ \\*/\n\nfunction strEnum<T extends string\\>(o: Array<T>): {\\[K in T\\]: K}\
    \ {\n\n return o.reduce((res, key) => {\n\n res\\[key\\] = key;\n\n return res;\n\
    \n }, Object.create(null));\n\n}\n\nAnd then generate the literal type union using\
    \  keyof typeof . Here is a complete example:\n\nLiteral Types\n\n164"
