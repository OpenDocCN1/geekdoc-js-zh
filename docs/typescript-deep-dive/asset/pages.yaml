    \ console.log('good.json error', err.message); // never called\n\n })\n\n// non-existent\
    \ json file\n\n .then(function () {\n\n return loadJSONAsync('absent.json');\n\
    \n })\n\n .then(function (val) { console.log(val); }) // never called\n\n .catch(function\
    \ (err) {\n\n console.log('absent.json error', err.message);\n\n })\n\n// invalid\
    \ json file\n\n .then(function () {\n\n return loadJSONAsync('invalid.json');\n\
    \n })\n\n .then(function (val) { console.log(val); }) // never called\n\n .catch(function\
    \ (err) {\n\n console.log('bad.json error', err.message);\n\n });\n\nThe reason\
    \ why this function was simpler is because the \" loadFile (async) +  JSON.parse\
    \ \n\n(sync) =>  catch \" consolidation was done by the promise chain. Also the\
    \ callback was not\n\ncalled by *us* but called by the promise chain so we didn't\
