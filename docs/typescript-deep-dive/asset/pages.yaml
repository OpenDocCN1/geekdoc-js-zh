    A major design goal of TypeScript was to make it possible for you to safely and
    easily


    use existing JavaScript libraries in TypeScript. TypeScript does this by means
    of


    *declaration*.


    Ambient declarations allow you to *safely use existing popular JavaScript libraries*
    and


