  md: "**Convenience vs. Soundness**\n\nThere are a few things that TypeScript prevents\
    \ you from doing out of the box e.g using a\n\nvariable that *isn't ever declared*\
    \ (of course you can use a *declaration file* for external\n\nsystems).\n\nThat\
    \ said, traditionally programming languages have a hard boundary between what\
    \ is and\n\nisn't allowed by the type system. TypeScript is different in that\
    \ it gives you control on where\n\nyou put the slider. This is really to allow\
    \ you to use the JavaScript you know and love with as\n\nmuch safety as **you**\
    \ want. There are lot of compiler options to control exactly this slider so\n\n\
    let's have a look.\n\n**Boolean Options**\n\n compilerOptions  that are  boolean\
    \  can be specified as  compilerOptions  in  tsconfig.json :\n\n{\n\n \"compilerOptions\"\
    : {\n\n \"someBooleanOption\": true\n\n }\n\n}\n\nor on the command line\n\ntsc\
    \ --someBooleanOption\n\nAll of these are  false  by default.\n\nClick here to\
    \ see all compiler options.\n\nOptions\n\n215"
