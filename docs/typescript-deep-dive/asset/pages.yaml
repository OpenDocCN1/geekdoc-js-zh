  md: "**Contributing**\n\nTypeScript is OSS and on GitHub and the team welcomes community\
    \ input.\n\n**Setup**\n\nSuper easy:\n\ngit clone https://github.com/Microsoft/TypeScript.git\n\
    \ncd TypeScript\n\nnpm install -g jake\n\nnpm install\n\n**Setup Fork**\n\nYou\
    \ would obviously need to setup Microsoft/TypeScript as an  upstream  remote and\
    \ your\n\nown *fork* (use the GitHub *fork* button) as  origin :\n\ngit remote\
    \ rm origin\n\ngit remote rm upstream\n\ngit remote add upstream https://github.com/Microsoft/TypeScript.git\n\
    \ngit remote add origin https://github.com/basarat/TypeScript.git\n\nAdditionally\
    \ I like to work off branches like  bas/  to have it show up cleaner in the branch\n\
    \nlistings.\n\n**Running Tests**\n\nThere are lots of  test  and  build  options\
    \ in their JakeFile. You can run *all* tests with  jake\n\nruntests \n\n**Baselines**\n\
    \nBaselines are used to manage if there are any changes in the *expected* output\
    \ of the\n\nTypeScript compiler. Baselines are located in  tests/baselines .\n\
    \nReference (*expected*) baselines:  tests/baselines/reference \n\nGenerated (*in\
    \ this test run*) baselines :  tests/baselines/local  (this folder is in\n\n**.gitignore**)\n\
    \nContributing\n\n315"
  merge: -1
  pgno: 314
- img_proc: true
  md: "If there are any differences between these folders tests will fail. You can\
    \ diff the two\n\nfolders with tools like BeyondCompare or KDiff3.\n\nIf you think\
    \ these changes in generated files are valid then accept baselines using  jake\n\
    \nbaseline-accept . The changes to  reference  baselines will now show as a git\
    \ diff you can\n\ncommit.\n\nNote that if you don't run *all* tests then use \
    \ jake baseline-accept\\[soft\\]  which will only\n\ncopy over the new files and\
    \ not delete the whole  reference  directory.\n\n**Test Categories**\n\nThere\
    \ are different categories for different scenarios and even different test infrastructures.\n\
    \nHere are a few of these explained.\n\n**Compiler Tests**\n\nThese ensure that\
    \ compiling a file :\n\ngenerates errors as expected\n\ngenerated JS as expected\n\
    \ntypes are identified as expected\n\nsymbols are identified as expected\n\nThese\
    \ expectations are validated using the baselines infrastructure.\n\n**Creating\
    \ a Compiler Test**\n\nTest can be created by adding a new file  yourtest.ts \
    \ to  tests/cases/compiler . As soon as\n\nyou do so and run the tests you should\
    \ get baseline failure. Accept these baselines (to get\n\nthem to show up in git),\
    \ and tweak them to be what you *expect* them to be ... now get the\n\ntests to\
    \ pass.\n\nRun all of these in isolation using  jake runtests tests=compiler ,\
    \ or just your new file using\n\n jake runtests tests=compiler/yourtest \n\nI\
    \ will even often do  jake runtests tests=compiler/yourtest || jake baseline-accept\\\
    [soft\\] \n\nand get the diff in  git .\n\n**Debugging Tests**\n\n jake runtests-browser\
    \ tests=theNameOfYourTest  and debugging in-browser usually works\n\npretty well.\n\
    \nContributing\n\n316"
