  md: "var funcs = \\[\\];\n\n// create a bunch of functions\n\nfor (var i = 0; i\
    \ < 3; i++) {\n\n funcs.push(function() {\n\n console.log(i);\n\n })\n\n}\n\n\
    // call them\n\nfor (var j = 0; j < 3; j++) {\n\n funcs\\[j\\]();\n\n}\n\nOne\
    \ would have expected it to be  0,1,2 . Surprisingly it is going to be  3  for\
    \ all three\n\nfunctions. Reason is that all three functions are using the variable\
    \  i  from the outer scope\n\nand at the time we execute them (in the second loop)\
    \ the value of  i  will be  3  (that's the\n\ntermination condition for the first\
    \ loop).\n\nA fix would be to create a new variable in each loop specific to that\
    \ loop iteration. As we've\n\nlearnt before we can create a new variable scope\
    \ by creating a new function and\n\nimmediately executing it (i.e. the IIFE pattern\
    \ from classes  (function() { /\\* body \\*/ })(); )\n\nas shown below:\n\nvar\
    \ funcs = \\[\\];\n\n// create a bunch of functions\n\nfor (var i = 0; i < 3;\
    \ i++) {\n\n (function() {\n\n var local = i;\n\n funcs.push(function() {\n\n\
    \ console.log(local);\n\n })\n\n })();\n\n}\n\n// call them\n\nfor (var j = 0;\
    \ j < 3; j++) {\n\n funcs\\[j\\]();\n\n}\n\nHere the functions close over (hence\
    \ called a  closure ) the *local* variable (conveniently\n\nnamed  local ) and\
    \ use that instead of the loop variable  i .\n\nNote that closures come with a\
    \ performance impact (they need to store the surrounding\n\nstate).\n\nThe ES6\
    \  let  keyword in a loop would have the same behavior as the previous example:\n\
    \nlet\n\n42"
