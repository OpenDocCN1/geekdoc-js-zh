  md: "**Checker**\n\nLike we mentioned before *checker* is the thing that makes TypeScript\
    \ uniquely more\n\npowerful than *just another JavaScript transpiler*. The checker\
    \ is located in  checker.ts  and\n\nat this moment it is 23k+ lines of TypeScript\
    \ (largest part of the compiler).\n\n**Usage by Program**\n\nThe  checker  is\
    \ initialized by  program . The following is a sampling of the call stack (we\n\
    \nshowed the same one when looking at  binder ):\n\nprogram.getTypeChecker ->\n\
    \n ts.createTypeChecker (in checker)->\n\n initializeTypeChecker (in checker)\
    \ ->\n\n for each SourceFile \\`ts.bindSourceFile\\` (in binder)\n\n // followed\
    \ by\n\n for each SourceFile \\`ts.mergeSymbolTable\\` (in checker)\n\n**Association\
    \ with Emitter**\n\nTrue type checking happens once a call is made to  getDiagnostics\
    \ . This function is called\n\ne.g. once a request is made to  Program.emit ,\
    \ in which case the checker returns an\n\n EmitResolver  (progarm calls the checkers\
    \  getEmitResolver  function) which is just a set of\n\nfunctions local to  createTypeChecker\
    \ . We will mention this again when we look at the\n\nemitter.\n\nHere is the\
    \ call stack right down to  checkSourceFile  (a function local to  createTypeChecker\
    \ ).\n\nprogram.emit ->\n\n emitWorker (program local) ->\n\n createTypeChecker.getEmitResolver\
    \ ->\n\n // First call the following functions local to createTypeChecker\n\n\
    \ call getDiagnostics ->\n\n getDiagnosticsWorker ->\n\n checkSourceFile\n\n //\
    \ then\n\n return resolver\n\n (already initialized in createTypeChecker using\
    \ a call to local createReso\n\nlver())\n\nChecker\n\n300"
