  md: "**Migrating From JavaScript**\n\nIn general the process consists of the following\
    \ steps:\n\nAdd a  tsconfig.json .\n\nChange your source code file extensions\
    \ from  .js  to  .ts . Start *suppressing* errors\n\nusing  any .\n\nWrite new\
    \ code in TypeScript and make as little use of  any  as possible.\n\nGo back to\
    \ the old code and start adding type annotations and fix identified bugs.\n\n\
    Use ambient definitions for third party JavaScript code.\n\nLet us discuss a few\
    \ of these points further.\n\nNote that all JavaScript is *valid* TypeScript.\
    \ That is to say that if you give the TypeScript\n\ncompiler some JavaScript ->\
    \ the JavaScript emitted by the TypeScript compiler will behave\n\nexactly the\
    \ same as the original JavaScript. This means that changing the extension from\n\
    \n .js  to  .ts  will not adversely affect your codebase.\n\n**Suppressing Errors**\n\
    \nTypeScript will immediately start TypeChecking your code and your original JavaScript\
    \ code\n\n*might not be as neat as you thought it was* and hence you get diagnostic\
    \ errors. Many of\n\nthese errors you can suppress with using  any  e.g.:\n\n\
    var foo = 123;\n\nvar bar = 'hey';\n\nbar = foo; // ERROR: cannot assign a number\
    \ to a string\n\nEven though the **error is valid** (and in most cases the inferred\
    \ information will be better than\n\nwhat the original authors of different portions\
    \ of the code bases imagined), your focus will\n\nprobably be writing new code\
    \ in TypeScript while progressively updating the old code base.\n\nHere you can\
    \ suppress this error with a type assertion as shown below:\n\nvar foo = 123;\n\
    \nvar bar = 'hey';\n\nbar = foo as any; // Okay!\n\nIn other places you might\
    \ want to annotate something as  any  e.g.:\n\nJS Migration Guide\n\n121"
  merge: -1
  pgno: 120
