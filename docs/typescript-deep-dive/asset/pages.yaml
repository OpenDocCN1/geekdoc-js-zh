  md: "**TypeScript StyleGuide and Coding**\n\n**Conventions**\n\nAn unofficial TypeScript\
    \ StyleGuide\n\nPeople have asked me for my opinions on this. Personally I don't\
    \ enforce these a lot on my\n\nteams and projects but it does help to have these\
    \ mentioned as a tie breaker when someone\n\nfeels the need to have such strong\
    \ consistency. There are other things that I feel much more\n\nstrongly about\
    \ and those are covered in the tips chapter (e.g. type assertion is bad, property\n\
    \nsetters are bad) .\n\nKey Sections:\n\nVariable\n\nClass\n\nInterface\n\nType\n\
    \nNamespace\n\nEnum\n\n null  vs.  undefined \n\nFormatting\n\nSingle vs. Double\
    \ Quotes\n\nTabs vs. Spaces\n\nUse semicolons\n\nAnnotate Arrays as  Type\\[\\\
    ] \n\nFile Names\n\n**Variable and Function**\n\nUse  camelCase  for variable\
    \ and function names\n\nReason: Conventional JavaScript\n\n**Bad**\n\nvar FooVar;\n\
    \nfunction BarFunc() { }\n\n**Good**\n\nStyleGuide\n\n259"
  merge: -1
  pgno: 258
- img_proc: true
  md: "var fooVar;\n\nfunction barFunc() { }\n\n**Class**\n\nUse  PascalCase  for\
    \ class names.\n\nReason: This is actually fairly conventional in standard JavaScript.\n\
    \n**Bad**\n\nclass foo { }\n\n**Good**\n\nclass Foo { }\n\nUse  camelCase  of\
    \ class members and methods\n\nReason: Naturally follows from variable and function\
    \ naming convention.\n\n**Bad**\n\nclass Foo {\n\n Bar: number;\n\n Baz() { }\n\
    \n}\n\n**Good**\n\nclass Foo {\n\n bar: number;\n\n baz() { }\n\n}\n\n**Interface**\n\
    \nUse  PascalCase  for name.\n\nReason: Similar to class\n\nUse  camelCase  for\
    \ members.\n\nStyleGuide\n\n260"
  merge: -1
