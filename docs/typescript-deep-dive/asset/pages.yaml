- img_proc: true
  md: "enum Color {\n\n Red, // 0\n\n Green, // 1\n\n Blue // 2\n\n}\n\nHowever you\
    \ can change the number associated with any enum member by assigning to it\n\n\
    specifically. This is demonstrated below where we start at 3 and start incrementing\
    \ from\n\nthere:\n\nenum Color {\n\n DarkRed = 3, // 3\n\n DarkGreen, // 4\n\n\
    \ DarkBlue // 5\n\n}\n\nTIP: I quite commonly initialize the first enum with \
    \ = 1  as it allows me to do a safe\n\ntruthy check on an enum value.\n\n**Enums\
    \ are open ended**\n\nHere is the generated JavaScript for an enum shown again:\n\
    \nvar Tristate;\n\n(function (Tristate) {\n\n Tristate\\[Tristate\\[\"False\"\\\
    ] = 0\\] = \"False\";\n\n Tristate\\[Tristate\\[\"True\"\\] = 1\\] = \"True\"\
    ;\n\n Tristate\\[Tristate\\[\"Unknown\"\\] = 2\\] = \"Unknown\";\n\n})(Tristate\
    \ || (Tristate = {}));\n\nWe already explained the  Tristate\\[Tristate\\[\"False\"\
    \\] = 0\\] = \"False\";  portion. Now notice\n\nthe surrounding code  (function\
    \ (Tristate) { /\\*code here \\*/ })(Tristate || (Tristate =\n\n{}));  specifically\
    \ the  (Tristate || (Tristate = {}));  portion. This basically captures a\n\n\
    local variable  TriState  that will either point to an already defined  Tristate\
    \  value or\n\ninitialize it with a new empty  {}  object.\n\nThis means that\
    \ you can split (and extend) an enum definition across multiple files. For\n\n\
    example below we have split the definition for  Color  into two blocks\n\nEnums\n\
    \n134"
