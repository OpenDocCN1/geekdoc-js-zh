    \ number of elements from the an object and get *an object* of the\n\nremaining\
    \ elements using object destructuring with rest.\n\nvar {w, x, ...remaining} =\
    \ {w: 1, x: 2, y: 3, z: 4};\n\nconsole.log(w, x, remaining); // 1, 2, {y:3,z:4}\n\
    \nA common use case is also to ignore certain properties. For example:\n\n// Example\
