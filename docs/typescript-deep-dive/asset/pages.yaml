    \ annotation\n\ntry {\n\n foo = runTask1();\n\n}\n\ncatch(e) {\n\n console.log('Error:',\
    \ e);\n\n}\n\ntry {\n\n const bar = runTask2(foo);\n\n}\n\ncatch(e) {\n\n console.log('Error:',\
