    \nSourceCode ~~ scanner ~~> Token Stream ~~ parser ~~> AST\n\nThe parser is implemented\
    \ as a singleton (similar reasons to  scanner , don't want to\n\nrecreate it if\
    \ we can reinit it). It is actually implemented as  namespace Parser  which contains\n\
    \n*state* variables for the Parser as well as a singleton  scanner . As mentioned\
    \ before it\n\ncontains a  const scanner . The parser functions manage this scanner.\n\
    \n**Usage by program**\n\nParser is driven indirectly by Program (indirectly as\
    \ its actually by  CompilerHost  which we\n\nmentioned previously). Basically\
