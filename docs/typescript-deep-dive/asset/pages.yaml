    \ is generated as is with a simple\n\nreplacement of  var  with  let :\n\nif (true)\
    \ {\n\n let foo = 123;\n\n}\n\n// becomes //\n\nif (true) {\n\n var foo = 123;\n\
    \n}\n\nHowever if the variable name is already taken by the surrounding scope\
    \ then a new variable\n\nname is generated as shown (notice  \\_foo ):\n\nvar\
    \ foo = '123';\n\nif (true) {\n\n let foo = 123;\n\n}\n\n// becomes //\n\nvar\
    \ foo = '123';\n\nif (true) {\n\n var \\_foo = 123; // Renamed\n\n}\n\n**let in\
