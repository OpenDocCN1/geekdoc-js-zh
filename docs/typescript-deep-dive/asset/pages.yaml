  md: "**Parser Functions**\n\nAs mentioned  parseSourceFile  sets up the initial\
    \ state and passes the work onto\n\n parseSourceFileWorker  function.\n\n** parseSourceFileWorker\
    \ **\n\nStarts by creating a  SourceFile  AST node. Then it goes into parsing\
    \ source code starting\n\nfrom the  parseStatements  function. Once that returns,\
    \ it then completes the  SourceFile \n\nnode with additional information such\
    \ as its  nodeCount ,  identifierCount  and such.\n\n** parseStatements **\n\n\
    One of the most significant  parseFoo  style functions (a concept we cover next).\
    \ It switches\n\nby the the current  token  returned from the scanner. E.g. if\
    \ the current token is a\n\n SemicolonToken  it will call out to  parseEmptyStatement\
    \  to create an AST node for an empty\n\nstatement.\n\n**Node creation**\n\nThe\
    \ parser has a bunch of  parserFoo  functions with bodies that create  Foo  nodes.\
    \ These\n\nare generally called (from other parser functions) at a time where\
    \ a  Foo  node is expected.\n\nA typical sample of this process is the  parseEmptyStatement()\
    \  function which is used to\n\nparse out empty statements like  ;;;;;; . Here\
    \ is the function in its entirety\n\nfunction parseEmptyStatement(): Statement\
    \ {\n\n let node = <Statement>createNode(SyntaxKind.EmptyStatement);\n\n parseExpected(SyntaxKind.SemicolonToken);\n\
    \n return finishNode(node);\n\n}\n\nIt shows three critical functions  createNode\
    \ ,  parseExpected  and  finishNode .\n\n** createNode **\n\nThe parser's  createNode\
    \  function  function createNode(kind: SyntaxKind, pos?: number):\n\nNode  is\
    \ responsible for creating a Node, setting up its  SyntaxKind  as passed in, and\
    \ set the\n\ninitial position if passed in (or use the position from the current\
    \ scanner state).\n\n** parseExpected **\n\nParser Functions\n\n283"
