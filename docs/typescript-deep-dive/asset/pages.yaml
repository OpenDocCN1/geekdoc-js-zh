  md: "**Build Toggles**\n\nIt is common to switch in JavaScript projects based on\
    \ where they are being run. You can do\n\nthis quite easily with webpack as its\
    \ supports *dead code elimination* based on environment\n\nvariables.\n\nAdd different\
    \ targets in your  package.json   scripts :\n\n\"build:test\": \"webpack -p --config\
    \ ./src/webpack.config.js\",\n\n\"build:prod\": \"webpack -p --define process.env.NODE\\\
    _ENV='\\\\\"production\\\\\"' --config ./sr\n\nc/webpack.config.js\",\n\nOf course\
    \ I am assuming you have  npm install webpack --save-dev . Now you can run  npm\n\
    \nrun build:test  etc.\n\nUsing this variable is super easy as well:\n\n/\\*\\\
    *\n\n \\* This interface makes sure we don't miss adding a property to both \\\
    `prod\\` and \\`test\\`\n\n \\*/\n\ninterface Config {\n\n someItem: string;\n\
    \n}\n\n/\\*\\*\n\n \\* We only export a single thing. The config.\n\n \\*/\n\n\
    export let config: Config;\n\n/\\*\\*\n\n \\* \\`process.env.NODE\\_ENV\\` definition\
    \ is driven from webpack\n\n \\*\n\n \\* The whole \\`else\\` block will be removed\
    \ in the emitted JavaScript\n\n \\* for a production build\n\n \\*/\n\nif (process.env.NODE\\\
    _ENV === 'production') {\n\n config = {\n\n someItem: 'prod'\n\n }\n\n console.log('Running\
