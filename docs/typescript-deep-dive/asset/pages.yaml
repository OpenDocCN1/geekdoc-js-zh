  md: "**Example 3**\n\nimport foo = require('foo');\n\nvar bar = foo;\n\nwill generate\
    \ the JavaScript (assuming commonjs):\n\nvar foo = require('foo');\n\nvar bar\
    \ = foo;\n\nThis is because  foo  is used as a variable.\n\n**Use case: Lazy loading**\n\
    \nType inference needs to be done *upfront*. This means that if you want to use\
    \ some type from\n\na file  foo  in a file  bar  you will have to do:\n\nimport\
    \ foo = require('foo');\n\nvar bar: foo.SomeType;\n\nHowever you might want to\
    \ only load the file  foo  at runtime under certain conditions. For\n\nsuch cases\
    \ you should use the  import ed name only in *type annotations* and **not** as\
    \ a\n\n*variable*. This removes any *upfront* runtime dependency code being injected\
    \ by TypeScript.\n\nThen *manually import* the actual module using code that is\
    \ specific to your module loader.\n\nAs an example, consider the following  commonjs\
    \  based code where we only load a module\n\n 'foo'  on a certain function call:\n\
    \nimport foo = require('foo');\n\nexport function loadFoo() {\n\n // This is lazy\
    \ loading \\`foo\\` and using the original module \\*only\\* as a type annot\n\
    \nation\n\n var \\_foo: typeof foo = require('foo');\n\n // Now use \\`\\_foo\\\
    ` as a variable instead of \\`foo\\`.\n\n}\n\nA similar sample in  amd  (using\
    \ requirejs) would be:\n\nFile Module Details\n\n97"
