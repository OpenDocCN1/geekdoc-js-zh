    \n**Promise**\n\nThe  Promise  class is something that exists in many modern JavaScript\
    \ engines and can be\n\neasily polyfilled. The main motivation for promises is\
    \ to bring synchronous style error\n\nhandling to Async / Callback style code.\n\
    \n**Callback style code**\n\nIn order to fully appreciate promises let's present\
    \ a simple sample that proves the difficulty of\n\ncreating reliable Async code\
    \ with just callbacks. Consider the simple case of authoring an\n\nasync version\
    \ of loading JSON from a file. A synchronous version of this can be quite\n\n\
    simple:\n\nimport fs = require('fs');\n\nfunction loadJSONSync(filename: string)\
    \ {\n\n return JSON.parse(fs.readFileSync(filename));\n\n}\n\n// good json file\n\
    \nconsole.log(loadJSONSync('good.json'));\n\n// non-existent file, so fs.readFileSync\
    \ fails\n\ntry {\n\n console.log(loadJSONSync('absent.json'));\n\n}\n\ncatch (err)\
    \ {\n\n console.log('absent.json error', err.message);\n\n}\n\n// invalid json\
    \ file i.e. the file exists but contains invalid JSON so JSON.parse fails\n\n\
    try {\n\n console.log(loadJSONSync('invalid.json'));\n\n}\n\ncatch (err) {\n\n\
    \ console.log('invalid.json error', err.message);\n\n}\n\nThere are three behaviors\
    \ of this simple  loadJSONSync  function, a valid return value, a file\n\nsystem\
    \ error or a JSON.parse error. We handle the errors with a simple try/catch as\
    \ you are\n\nused to when doing synchronous programming in other languages. Now\
    \ let's make a good\n\nPromise\n\n63"
