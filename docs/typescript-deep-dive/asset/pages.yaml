  md: "Freshness\n\nAllowing extra properties\n\nUse Case: React\n\n**Freshness**\n\
    \nTypeScript provides a concept of **Freshness** (also called *strict object literal\
    \ checking*) to\n\nmake it easier to type check object literals that would otherwise\
    \ be structurally type\n\ncompatible.\n\nStructural typing is *extremely convenient*.\
    \ Consider the following piece of code. This allows\n\nyou to *very conveniently*\
    \ upgrade your JavaScript to TypeScript while still preserving a level\n\nof type\
    \ safety:\n\nfunction logName(something: { name: string }) {\n\n console.log(something.name);\n\
    \n}\n\nvar person = { name: 'matt', job: 'being awesome' };\n\nvar animal = {\
    \ name: 'cow', diet: 'vegan, but has milk of own species' };\n\nvar random = {\
    \ note: \\`I don't have a name property\\` };\n\nlogName(person); // okay\n\n\
    logName(animal); // okay\n\nlogName(random); // Error: property \\`name\\` is\
    \ missing\n\nHowever *structural* typing has a weakness in that it allows you\
    \ to misleadingly think that\n\nsomething accepts more data than it actually does.\
    \ This is demonstrated in the following\n\ncode which TypeScript will error on\
    \ as shown:\n\nfunction logName(something: { name: string }) {\n\n console.log(something.name);\n\
    \n}\n\nlogName({ name: 'matt' }); // okay\n\nlogName({ name: 'matt', job: 'being\
    \ awesome' }); // Error: object literals must only s\n\npecify known properties.\
    \ \\`job\\` is excessive here.\n\nNote that this error *only happens on object\
    \ literals*. Without this error one might look at the\n\ncall  logName({ name:\
    \ 'matt', job: 'being awesome' })  and think that *logName* would do\n\nsomething\
    \ useful with  job  where as in reality it will completely ignore it.\n\nAnother\
    \ big use case is with interfaces that have optional members, without such object\n\
    \nliteral checking, a typo would type check just fine. This is demonstrated below:\n\
    \nFreshness\n\n156"
  merge: -1
  pgno: 155
- img_proc: true
  md: "function logIfHasName(something: { name?: string }) {\n\n if (something.name)\
    \ {\n\n console.log(something.name);\n\n }\n\n}\n\nvar person = { name: 'matt',\
    \ job: 'being awesome' };\n\nvar animal = { name: 'cow', diet: 'vegan, but has\
    \ milk of own species' };\n\nlogIfHasName(person); // okay\n\nlogIfHasName(animal);\
    \ // okay\n\nlogIfHasName({neme: 'I just misspelled name to neme'}); // Error:\
    \ object literals must\n\n only specify known properties. \\`neme\\` is excessive\
    \ here.\n\nThe reason why only object literals are type checked this way is because\
    \ in this case\n\nadditional properties *that aren't actually used* is almost\
    \ always a typo or a misunderstanding\n\nof the API.\n\n**Allowing extra properties**\n\
    \nA type can include an index signature to explicitly indicate that excess properties\
    \ are\n\npermitted:\n\nvar x: { foo: number, \\[x: string\\]: any };\n\nx = {\
    \ foo: 1, baz: 2 }; // Ok, \\`baz\\` matched by index signature\n\n**Use Case:\
    \ React State**\n\nFacebook ReactJS offers a nice use case for object freshness.\
    \ Quite commonly in a\n\ncomponent you call  setState  with only a few properties\
    \ instead of passing in all the\n\nproperties, i.e.:\n\n// Assuming\n\ninterface\
    \ State {\n\n foo: string;\n\n bar: string;\n\n}\n\n// You want to do: \n\nthis.setState({foo:\
    \ \"Hello\"}); // Error: missing property bar\n\n// But because state contains\
    \ both \\`foo\\` and \\`bar\\` TypeScript would force you to do: \n\nthis.setState({foo:\
    \ \"Hello\", bar: this.state.bar}};\n\nFreshness\n\n157"
