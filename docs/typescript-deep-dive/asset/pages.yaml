  md: "![](img/416f69818aa79e3f1fe0e7869c118431_45_0.png)![](img/416f69818aa79e3f1fe0e7869c118431_45_1.png)\n\
    \n**Destructuring**\n\nTypeScript supports the following forms of Destructuring\
    \ (literally named after de-structuring\n\ni.e. breaking up the structure):\n\n\
    1\\. Object Destructuring\n\n2\\. Array Destructuring\n\nIt is easy to think of\
    \ destructuring as an inverse of *structuring*. The method of *structuring* in\n\
    \nJavaScript is the object literal:\n\nvar foo = {\n\n bar: {\n\n bas: 123\n\n\
    \ }\n\n};\n\nWithout the awesome *structuring* support built into JavaScript,\
    \ creating new objects on the\n\nfly would indeed be very cumbersome. Destructuring\
    \ brings the same level of convenience\n\nto getting data out of a structure.\n\
    \n**Object Destructuring**\n\nDestructuring is useful because it allows you to\
    \ do in a single line, what would otherwise\n\nrequire multiple lines. Consider\
    \ the following case:\n\nvar rect = { x: 0, y: 10, width: 15, height: 20 };\n\n\
    // Destructuring assignment\n\nvar {x, y, width, height} = rect;\n\nconsole.log(x,\
    \ y, width, height); // 0,10,15,20\n\nrect.x = 10;\n\n({x, y, width, height} =\
    \ rect); // assign to existing variables using outer parentheses\n\nconsole.log(x,\
    \ y, width, height); // 10,10,15,20\n\nHere in the absence of destructuring you\
    \ would have to pick off  x,y,width,height  one by\n\none from  rect .\n\nTo assign\
    \ an extracted variable to a new variable name you can do the following:\n\nDestructuring\n\
    \n46"
