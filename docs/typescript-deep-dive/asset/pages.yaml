  md: "**Binder**\n\nMost JavaScript transpilers out there are simpler than TypeScript\
    \ because they provide little\n\nin the way of code analysis. The typical JavaScript\
    \ transpilers only have the following flow:\n\nSourceCode ~~Scanner~~> Tokens\
    \ ~~Parser~~> AST ~~Emitter~~> JavaScript\n\nWhile the above architecture is true\
    \ as a simplified understand of TypeScript js generation, a\n\nkey feature of\
    \ TypeScript is its *Semantic* system. In order to assist type checking (performed\n\
    \nby  checker ), the  binder  (in  binder.ts ) is used to connect the various\
    \ parts of the source\n\ncode into a coherent type system that can then be used\
    \ by the  checker . The main\n\nresponsibility of the binder is to create the\
    \ *Symbols*.\n\n**Symbol**\n\nSymbols connect declaration nodes in the AST to\
    \ other declarations contributing to the\n\nsame entity. Symbols are the basic\
    \ building block of the Semantic system. The symbol\n\nconstructor is defined\
    \ in  core.ts  (and  binder  actually uses the\n\n objectAllocator.getSymbolConstructor\
    \  to get its hands on it). Here is the constructor:\n\nfunction Symbol(flags:\
    \ SymbolFlags, name: string) {\n\n this.flags = flags;\n\n this.name = name;\n\
    \n this.declarations = undefined;\n\n}\n\n SymbolFlags  is a flag enum and is\
    \ really used to identify additional classifications of the\n\nsymbol (e.g the\
    \ scope of a variable flags  FunctionScopedVariable  or  BlockScopedVariable \n\
    \nor others)\n\n**Usage by Checker**\n\nThe  binder  is actually used internally\
    \ by the type  checker  which in turn is used by the\n\n program . The simplified\
    \ call stack looks like:\n\nBinder\n\n285"
