  md: "**Readonly**\n\nTypeScript's type system allows you to mark individual properties\
    \ on an interface as\n\n readonly . This allows you to work in a functional way\
    \ (unexpected mutation is bad):\n\nfunction foo(config: {\n\n readonly bar: number,\n\
    \n readonly bas: number\n\n}) {\n\n // ..\n\n}\n\nlet config = { bar: 123, bas:\
    \ 123 };\n\nfoo(config);\n\n// You can be sure that \\`config\\` isn't changed\
    \ \n\nOf course you can use  readonly  in  interface  and  type  definitions as\
    \ well e.g.:\n\ntype Foo = {\n\n readonly bar: number;\n\n readonly bas: number;\n\
    \n}\n\n// Initialization is okay\n\nlet foo: Foo = { bar: 123, bas: 456 };\n\n\
    // Mutation is not\n\nfoo.bar = 456; // Error: Left-hand side of assignment expression\
    \ cannot be a constant \n\nor a read-only property\n\nYou can even declare a class\
    \ property as  readonly . You can initialize them at the point of\n\ndeclaration\
    \ or in the constructor as shown below:\n\nclass Foo {\n\n readonly bar = 1; //\
    \ OK\n\n readonly baz: string;\n\n constructor() {\n\n this.baz = \"hello\"; //\
    \ OK\n\n }\n\n}\n\n**Various Use Cases**\n\nReadonly\n\n166"
  merge: -1
  pgno: 165
- img_proc: true
  md: "**ReactJS**\n\nOne library that loves immutability is ReactJS and it's a great\
    \ idea to mark your  Props  and\n\n State  to be immutable e.g.:\n\ninterface\
    \ Props {\n\n readonly foo: number;\n\n}\n\ninterface State {\n\n readonly bar:\
    \ number;\n\n}\n\nexport class Something extends React.Component<Props,State>\
    \ {\n\n // You can rest assured no one is going to do\n\n // this.props.foo =\
    \ 123; (props are immutable)\n\n // this.state.bar = 456; (one should use this.setState)\n\
    \n}\n\n**Seamless Immutable**\n\nYou can even mark index signatures as readonly:\n\
    \n/\\*\\*\n\n \\* Declaration\n\n \\*/\n\ninterface Foo {\n\n readonly\\[x: number\\\
    ]: number;\n\n}\n\n/\\*\\*\n\n \\* Usage\n\n \\*/\n\nlet foo: Foo = { 0: 123,\
    \ 2: 345 };\n\nconsole.log(foo\\[0\\]); // Okay (reading)\n\nfoo\\[0\\] = 456;\
    \ // Error (mutating): Readonly\n\nThis is great if you want to use native JavaScript\
    \ arrays in an *immutable* fashion. In fact\n\nTypeScript ships with a  ReadonlyArray<T>\
    \  interface to allow you to do just that:\n\nlet foo: ReadonlyArray<number\\\
    > = \\[1, 2, 3\\];\n\nconsole.log(foo\\[0\\]); // Okay\n\nfoo.push(4); // Error:\
    \ \\`push\\` does not exist on ReadonlyArray as it mutates \n\nthe array\n\nfoo\
    \ = foo.concat(\\[4\\]); // Okay: create a copy\n\n**Automatic Inference**\n\n\
    Readonly\n\n167"
  merge: -1
  pgno: 166
- img_proc: true
  md: "In some cases the compiler can automatically infer a particular item to be\
    \ readonly e.g.\n\nwithin a class if you have a property that only has a getter\
    \ but no setter, it is assumed\n\nreadonly e.g.:\n\nclass Person {\n\n firstName:\
    \ string = \"John\";\n\n lastName: string = \"Doe\";\n\n get fullName() {\n\n\
    \ return this.firstName + this.lastName;\n\n }\n\n}\n\nconst person = new Person();\n\
    \nconsole.log(person.fullName); // John Doe\n\nperson.fullName = \"Dear Reader\"\
    ; // Error! fullName is readonly\n\n**Difference from **** const **\n\n const\
    \ \n\n1\\. is for a variable reference\n\n2\\. the variable cannot be reassigned\
    \ to anything else.\n\n readonly  is\n\n1\\. for a property\n\n2\\. the property\
    \ can be modified because of aliasing\n\nSample explaining 1:\n\nconst foo = 123;\
    \ // variable reference\n\nvar bar: {\n\n readonly bar: number; // for property\n\
    \n}\n\nSample explaining 2:\n\nReadonly\n\n168"
