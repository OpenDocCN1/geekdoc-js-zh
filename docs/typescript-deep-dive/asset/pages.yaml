    \ order e.g. perhaps alphabetically  tsc bar.ts foo.ts  the\n\ncode will compile\
    \ fine but *silently* fail at runtime with  bar  set to  NaN .\n\n**Fast compile**\n\
    \nIf you use  --out  then single  .ts  files cannot be codegened into single \
