  md: 'Reason: More JavaScript teams do this (e.g. airbnb, standard, npm, node,


    google/angular, facebook/react). Its easier to type (no shift needed on most keyboards).


    Prettier team recommends single quotes as well


    Double quotes are not without merit: Allows easier copy paste of objects into
    JSON.


    Allows people to use other languages to work without changing their quote character.


    Allows you to use apostrophes e.g.  He''s not going. . But I''d rather not deviate
    from


    where the JS Community is fairly decided.


    When you can''t use double quotes, try using back ticks (\`).


    Reason: These generally represent the intent of complex enough strings.


    **Spaces**


    Use  2  spaces. Not tabs.


    Reason: More JavaScript teams do this (e.g. airbnb, idiomatic, standard, npm,
    node,


    google/angular, facebook/react). The TypeScript/VSCode teams use 4 spaces but
    are


    definitely the exception in the ecosystem.


    **Semicolons**


    Use semicolons.


    Reasons: Explicit semicolons helps language formatting tools give consistent results.


    Missing ASI (automatic semicolon insertion) can trip new devs e.g.  foo() \\n


    (function(){})  will be a single statement (not two).


    **Array**


    Annotate arrays as  foos:Foo\[\]  instead of  foos:Array<Foo> .


    Reasons: Its easier to read. Its used by the TypeScript team. Makes easier to
    know


    something is an array as the mind is trained to detect  \[\] .


    **Filename**


    Name files with  camelCase . E.g.  accordian.tsx ,  myControl.tsx ,  utils.ts
    ,  map.ts  etc.


    Reason: Conventional across many JS teams.


    StyleGuide


    265'
