  md: "**Compiler**\n\nThe typescript compiler source is located under the  src/compiler\
    \  folder.\n\nIt is split into the follow key parts:\n\nScanner ( scanner.ts )\n\
    \nParser ( parser.ts )\n\nBinder ( binder.ts )\n\nChecker ( checker.ts )\n\nEmitter\
    \ ( emitter.ts )\n\nEach of these get their own unique files in the source. These\
    \ parts will be explained later on\n\nin this chapter.\n\n**BYOTS**\n\nWe have\
    \ a project called Bring Your Own TypeScript (BYOTS) which makes it easier to\
    \ play\n\naround with the compiler API e.g. by exposing internal APIs. You can\
    \ use it to expose your\n\nlocal app's version of TypeScript globally.\n\n**Syntax\
    \ vs. Semantics**\n\nJust because something is *syntactically* correct doesn't\
    \ mean it is *semantically* correct.\n\nConsider the following piece of TypeScript\
    \ code which although *syntactically* valid is\n\n*semantically* wrong\n\nvar\
    \ foo: number = \"not a number\";\n\n Semantic  means \"meaning\" in English.\
    \ This concept is useful to have in your head.\n\n**Processing Overview**\n\n\
    The following is a quick review of how these key parts of the TypeScript compiler\
    \ compose:\n\nSourceCode ~~ scanner ~~> Token Stream\n\nTypeScript Compiler Internals\n\
    \n269"
  merge: -1
  pgno: 268
- img_proc: true
  md: "Token Stream ~~ parser ~~> AST\n\nAST ~~ binder ~~> Symbols\n\n Symbol  is\
    \ the primary building block of the TypeScript *semantic* system. As shown the\n\
    \nsymbols are created as a result of binding. Symbols connect declaration nodes\
    \ in the AST to\n\nother declarations contributing to the same entity.\n\nSymbols\
    \ + AST are what is used by the checker to *semantically* validate the source\
    \ code\n\nAST + Symbols ~~ checker ~~> Type Validation\n\nFinally When a JS output\
    \ is requested:\n\nAST + Checker ~~ emitter ~~> JS\n\nThere are a few additional\
    \ files in the TypeScript compiler that provide utilities to many of\n\nthese\
    \ key portions which we cover next.\n\n**File: Utilities**\n\n core.ts  : core\
    \ utilities used by the TypeScript compiler. A few important ones:\n\n let objectAllocator:\
    \ ObjectAllocator  : is a variable defined as a singleton global. It\n\nprovides\
    \ the definitions for  getNodeConstructor  (Nodes are covered when we look at\n\
    \n parser  /  AST ),  getSymbolConstructor  (Symbols are covered in  binder ),\n\
    \n getTypeConstructor  (Types are covered in  checker ),  getSignatureConstructor\
    \ \n\n(Signatures are the index, call and construct signatures).\n\n**File: Key\
    \ Data Structures**\n\n types.ts  contains key data structures and interfaces\
    \ uses throughout the compiler. Here is\n\na sampling of a few key ones:\n\n SyntaxKind\
    \  The AST node type is identified by the  SyntaxKind  enum.\n\n TypeChecker \
    \ This is the interface provided by the TypeChecker.\n\n CompilerHost  This is\
    \ used by the  Program  to interact with the  System .\n\n Node  An AST node.\n\
    \nTypeScript Compiler Internals\n\n270"
  merge: -1
  pgno: 269
- img_proc: true
  md: "**File: System**\n\n system.ts . All interaction of the TypeScript compiler\
    \ with the operating system goes\n\nthrough a  System  interface. Both the interface\
    \ and its implementations ( WScript  and\n\n Node ) are defined in  system.ts\
    \ . You can think of it as the *Operating Environment* (OE).\n\nNow that you have\
    \ an overview of the major files, we can look at the concept of  Program \n\n\
    TypeScript Compiler Internals\n\n271"
  merge: -1
  pgno: 270
- img_proc: true
  md: "**Program**\n\nDefined in  program.ts . The compilation context (a concept\
    \ we covered previously) is\n\nrepresented within the TypeScript compiler as a\
    \  Program . It consists of  SourceFile s and\n\ncompiler options.\n\n**Usage\
    \ of **** CompilerHost **\n\nIts interaction mechanism with the OE:\n\n Program\
    \  *\\-uses->*  CompilerHost  *\\-uses->*  System \n\nThe reason for having a\
    \  CompilerHost  as a point of indirection is that it allows its interface to\n\
    \nbe more finely tuned for  Program  needs and not bother with OE needs (e.g.\
    \ the  Program \n\ndoesn't care about  fileExists  a function provided by  System\
    \ ).\n\nThere are other users of  System  as well (e.g. tests).\n\n**SourceFile**\n\
    \nThe program provides an API to get the Source Files  getSourceFiles(): SourceFile\\\
    [\\]; .\n\nEach is represented as a root-level node for an AST (called  SourceFile\
    \ ).\n\nProgram\n\n272"
  merge: -1
  pgno: 271
- img_proc: true
  md: "**Node**\n\nThe basic building block of the Abstract Syntax Tree (AST). In\
    \ general a  Node  represents\n\nnon-terminals in the language grammar; however,\
    \ some terminals are kept in the tree such\n\nas identifiers and literals.\n\n\
    Two key things make up an AST node's documentation. The node's  SyntaxKind  which\n\
    \nidentifies its type within the AST, and its  interface , the API the node provides\
    \ when\n\ninstantiated into the AST.\n\nHere are a few key  interface Node  members:\n\
    \n TextRange  members that identify the node's  start  and  end  in the source\
    \ file.\n\n parent?: Node  the parent of the node in the AST.\n\nThere are other\
    \ additional members for  Node  flags and modifiers etc. that you can lookup\n\
    \nby searching  interface Node  in the source code but the ones we mentioned are\
    \ vital for\n\nnode traversal.\n\n**SourceFile**\n\n SyntaxKind.SourceFile \n\n\
    \ interface SourceFile .\n\nEach  SourceFile  is a top-level AST node that is\
    \ contained in the  Program .\n\nAST\n\n273"
  merge: -1
  pgno: 272
- img_proc: true
  md: "**AST Tip: Visit Children**\n\nThere is a utility function  ts.forEachChild\
    \  that allows you to visit all the child nodes of any\n\nNode in the AST.\n\n\
    Here is simplified snippet of the source code to demonstrate how it functions:\n\
    \nexport function forEachChild<T>(node: Node, cbNode: (node: Node) => T, cbNodeArray?:\
    \ (\n\nnodes: Node\\[\\]) => T): T {\n\n if (!node) {\n\n return;\n\n }\n\n switch\
    \ (node.kind) {\n\n case SyntaxKind.BinaryExpression:\n\n return visitNode(cbNode,\
    \ (<BinaryExpression>node).left) ||\n\n visitNode(cbNode, (<BinaryExpression>node).operatorToken)\
    \ ||\n\n visitNode(cbNode, (<BinaryExpression>node).right);\n\n case SyntaxKind.IfStatement:\n\
    \n return visitNode(cbNode, (<IfStatement>node).expression) ||\n\n visitNode(cbNode,\
    \ (<IfStatement>node).thenStatement) ||\n\n visitNode(cbNode, (<IfStatement>node).elseStatement);\n\
    \n // .... lots more\n\nBasically it checks  node.kind  and based on that assumes\
    \ an interface offered by the  node \n\nand calls the  cbNode  on the children.\
    \ Note, however that this function doesn't call\n\n visitNode  for *all* children\
    \ (e.g. SyntaxKind.SemicolonToken). If you want *all* the children of\n\na node\
    \ in the AST just call  .getChildren  member function of the  Node .\n\nE.g. here\
    \ is a function that prints the verbose  AST  of a node:\n\nfunction printAllChildren(node:\
    \ ts.Node, depth = 0) {\n\n console.log(new Array(depth+1).join('----'), ts.syntaxKindToName(node.kind),\
    \ node.\n\npos, node.end);\n\n depth++;\n\n node.getChildren().forEach(c=> printAllChildren(c,\
    \ depth));\n\n}\n\nWe will see a sample usage of this function when we discuss\
    \ the parser further.\n\nTIP: Visit Children\n\n274"
  merge: -1
  pgno: 273
- img_proc: true
  md: "**AST Tip: SyntaxKind**\n\n SyntaxKind  is defined as a  const enum , here\
    \ is a sample:\n\nexport const enum SyntaxKind {\n\n Unknown,\n\n EndOfFileToken,\n\
    \n SingleLineCommentTrivia,\n\n // ... LOTS more\n\nIt's a  const enum  (a concept\
    \ we covered previously) so that it gets *inlined* (e.g.\n\n ts.SyntaxKind.EndOfFileToken\
    \  becomes  1 ) and we don't get a dereferencing cost when\n\nworking with the\
    \ AST. However the compiler is compiled with  --preserveConstEnums \n\ncompiler\
    \ flag so that the enum *is still available at runtime*. So in JavaScript you\
    \ can use\n\n ts.SyntaxKind.EndOfFileToken  if you want. Additionally you can\
    \ convert these enum\n\nmembers to display strings using the following function:\n\
    \nexport function syntaxKindToName(kind: ts.SyntaxKind) {\n\n return (<any\\>ts).SyntaxKind\\\
    [kind\\];\n\n}\n\nTIP: SyntaxKind enum\n\n275"
  merge: -1
  pgno: 274
