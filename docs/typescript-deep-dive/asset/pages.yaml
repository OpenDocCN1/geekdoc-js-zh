  md: "// Ensure this is treated as a module.\n\nexport {};\n\ndeclare global {\n\n\
    \ interface String {\n\n endsWith(suffix: string): boolean;\n\n }\n\n}\n\nString.prototype.endsWith\
    \ = function(suffix: string): boolean {\n\n var str: string = this;\n\n return\
    \ str && str.indexOf(suffix, str.length - suffix.length) !== \\-1;\n\n}\n\nconsole.log('foo\
    \ bar'.endsWith('bas')); // false\n\nconsole.log('foo bas'.endsWith('bas')); //\
    \ true\n\n**Using your own custom lib.d.ts**\n\nAs we mentioned earlier using\
    \ the  noLib  boolean compiler flag causes TypeScript to\n\nexclude the automatic\
    \ inclusion of  lib.d.ts . There are various reasons why this is a useful\n\n\
    feature. Here are a few of the common ones:\n\nYou are running in a custom JavaScript\
    \ environment that differs *significantly* from the\n\nstandard browser based\
    \ runtime environment.\n\nYou like to have *strict* control over the *globals*\
    \ available in your code. E.g. lib.d.ts\n\ndefines  item  as a global variable\
    \ and you don't want this to leak into your code.\n\nOnce you have excluded the\
    \ default  lib.d.ts  you can include a similarly named file into\n\nyour compilation\
    \ context and TypeScript will pick it up for type checking.\n\nNote: be careful\
    \ with  --noLib . Once you are in noLib land, if you chose to share your\n\nproject\
    \ with others, they will be *forced* into noLib land (or rather *your lib* land).\
    \ Even\n\nworse, if you bring *their* code into your project you might need to\
    \ port it to *your lib* based\n\ncode.\n\n**Compiler target effect on **** lib.d.ts\
    \ **\n\nSetting the compiler target to be  es6  causes the  lib.d.ts  to include\
    \ *additional* ambient\n\ndeclarations for more modern (es6) stuff like  Promise\
    \ . This magical effect of the compiler\n\ntarget changing the *ambience* of the\
    \ code is desirable for some people and for others it's\n\nproblematic as it conflates\
    \ *code generation* with *code ambience*.\n\nHowever if you want finer grained\
    \ control of your environment you should use the  --lib \n\noption which we discuss\
    \ next.\n\nlib.d.ts\n\n144"
