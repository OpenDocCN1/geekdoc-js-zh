  md: "**for...of**\n\nA common error experienced by beginning JavaScript developers\
    \ is that  for...in  for an\n\narray does not iterate over the array items. Instead\
    \ it iterates over the *keys* of the object\n\npassed in. This is demonstrated\
    \ in the below example. Here you would expect  9,2,5  but\n\nyou get the indexes\
    \  0,1,2 :\n\nvar someArray = \\[9, 2, 5\\];\n\nfor (var item in someArray) {\n\
    \n console.log(item); // 0,1,2\n\n}\n\nThis is one of the reasons why  for...of\
    \  exists in TypeScript (and ES6). The following\n\niterates over the array correctly\
    \ logging out the members as expected:\n\nvar someArray = \\[9, 2, 5\\];\n\nfor\
    \ (var item of someArray) {\n\n console.log(item); // 9,2,5\n\n}\n\nSimilarly\
    \ TypeScript has no trouble going through a string character by character using\n\
    \n for...of :\n\nvar hello = \"is it me you're looking for?\";\n\nfor (var char\
    \ of hello) {\n\n console.log(char); // is it me you're looking for?\n\n}\n\n\
    **JS Generation**\n\nFor pre ES6 targets TypeScript will generate the standard\
    \  for (var i = 0; i < list.length;\n\ni++)  kind of loop. For example here's\
    \ what gets generated for our previous example:\n\nfor...of\n\n52"
