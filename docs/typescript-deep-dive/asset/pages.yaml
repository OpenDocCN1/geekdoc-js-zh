  md: "**Common Errors**\n\nIn this section we explain a number of common error codes\
    \ that users experience in the real\n\nworld.\n\n**TS2304**\n\nSamples:\n\n Cannot\
    \ find name ga \n\nYou are probably using a third party library (e.g. google analytics)\
    \ and don't have it\n\n declare d. TypeScript tries to save you from *spelling\
    \ mistakes* and *using variables without*\n\n*declaring them* so you need to be\
    \ explicit on anything that is *available at runtime* because of\n\nyou including\
    \ some external library (more on how to fix it).\n\n**TS2307**\n\nSamples:\n\n\
    \ Cannot find module 'underscore' \n\nYou are probably using a third party library\
    \ (e.g. underscore) as a *module* (more on\n\nmodules) and don't have the ambient\
    \ declaration file for it (more on ambient declarations).\n\n**TS1148**\n\nSample:\n\
    \nCannot compile modules unless the '--module' flag is provided\n\nCheckout the\
    \ section on modules.\n\n**For search indexing**\n\nYou can ignore reading this.\
    \ This section is for search engine indexing.\n\nCommon Errors\n\n267"
