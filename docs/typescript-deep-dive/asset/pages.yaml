  md: '**Import type only**


    The following statement:


    import foo = require(''foo'');


    actually does *two* things:


    Imports the type information of the foo module.


    Specifies a runtime dependency on the foo module.


    You can pick and choose so that only *the type information* is loaded and no runtime


    dependency occurs. Before continuing you might want to recap the *declaration
    spaces*


    section of the book.


    If you do not use the imported name in the variable declaration space then the
    import is


    completely removed from the generated JavaScript. This is best explained with
    examples.


    Once you understand this we will present you with use cases.


    **Example 1**


    import foo = require(''foo'');


    will generate the JavaScript:


    That''s right. An *empty* file as foo is not used.


    **Example 2**


    import foo = require(''foo'');


    var bar: foo;


    will generate the JavaScript:


    var bar;


    This is because  foo  (or any of its properties e.g.  foo.bas ) is never used
    as a variable.


    File Module Details


