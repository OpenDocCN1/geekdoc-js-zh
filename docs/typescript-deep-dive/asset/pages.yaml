  md: "Classes in TypeScript (like other languages) support *single* inheritance using\
    \ the  extends \n\nkeyword as shown below:\n\nclass Point3D extends Point {\n\n\
    \ z: number;\n\n constructor(x: number, y: number, z: number) {\n\n super(x, y);\n\
    \n this.z = z;\n\n }\n\n add(point: Point3D) {\n\n var point2D = super.add(point);\n\
    \n return new Point3D(point2D.x, point2D.y, this.z + point.z);\n\n }\n\n}\n\n\
    If you have a constructor in your class then you *must* call the parent constructor\
    \ from your\n\nconstructor (TypeScript will point this out to you). This ensures\
    \ that the stuff that it needs to\n\nset on  this  gets set. Followed by the call\
    \ to  super  you can add any additional stuff you\n\nwant to do in your constructor\
    \ (here we add another member  z ).\n\nNote that you override parent member functions\
    \ easily (here we override  add ) and still use\n\nthe functionality of the super\
    \ class in your members (using  super.  syntax).\n\n**Statics**\n\nTypeScript\
    \ classes support  static  properties that are shared by all instances of the\
    \ class.\n\nA natural place to put (and access) them is on the class itself and\
    \ that is what TypeScript\n\ndoes:\n\nclass Something {\n\n static instances =\
    \ 0;\n\n constructor() {\n\n Something.instances++;\n\n }\n\n}\n\nvar s1 = new\
    \ Something();\n\nvar s2 = new Something();\n\nconsole.log(Something.instances);\
    \ // 2\n\nYou can have static members as well as static functions.\n\n**Access\
    \ Modifiers**\n\nClasses\n\n25"
