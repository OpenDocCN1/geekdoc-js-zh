  md: "Parameter Annotations\n\nReturn Type Annotation\n\nOptional Parameters\n\n\
    Overloading\n\n**Functions**\n\nThe TypeScript type system pays a lot of love\
    \ to functions, after all they are the core building\n\nblock of a composable\
    \ system.\n\n**Parameter annotations**\n\nOf course you can annotate function\
    \ parameters just like you can annotate other variables:\n\n// variable annotation\n\
    \nvar sampleVariable: { bar: number }\n\n// function parameter\n\nfunction foo(sampleParameter:\
    \ { bar: number }) { }\n\nHere I used inline type annotations. Of course you can\
    \ use interfaces etc.\n\n**Return type annotation**\n\nYou can annotate the return\
    \ type after the function parameter list with the same style as you\n\nuse for\
    \ a variable, e.g.  : Foo  in the below example:\n\ninterface Foo {\n\n foo: string;\n\
    \n}\n\n// Return type annotated as \\`: Foo\\`\n\nfunction foo(sample: Foo): Foo\
    \ {\n\n return sample;\n\n}\n\nOf course I used an  interface  here, but you are\
    \ free to use other annotations e.g. inline\n\nannotations.\n\nQuite commonly\
    \ you don't *need* to annotate the return type of a function as it can generally\n\
    \nbe inferred by the compiler.\n\nFunctions\n\n147"
  merge: -1
  pgno: 146
- img_proc: true
  md: "interface Foo {\n\n foo: string;\n\n}\n\nfunction foo(sample: Foo) {\n\n return\
    \ sample; // inferred return type 'Foo'\n\n}\n\nHowever it is generally a good\
    \ idea to add these annotation to help with errors e.g.:\n\nfunction foo() {\n\
    \n return { fou: 'John Doe' }; // You might not find this misspelling \\`foo\\\
    ` till it's\n\n too late\n\n}\n\nsendAsJSON(foo());\n\nIf you don't plan to return\
    \ anything from a function to you can annotate it as  :void . You can\n\ngenerally\
    \ drop  :void  and leave it to the inference engine though.\n\n**Optional Parameters**\n\
    \nYou can mark a parameter as optional:\n\nfunction foo(bar: number, bas?: string):\
    \ void {\n\n // ..\n\n}\n\nfoo(123);\n\nfoo(123, 'hello');\n\nAlternatively you\
    \ can even provide a default value (using  = someValue  after the parameter\n\n\
    declaration) which will get injected for you if the caller doesn't provide that\
    \ argument:\n\nfunction foo(bar: number, bas: string = 'hello') {\n\n console.log(bar,\
    \ bas);\n\n}\n\nfoo(123); // 123, hello\n\nfoo(123, 'world'); // 123, world\n\n\
    **Overloading**\n\nFunctions\n\n148"
