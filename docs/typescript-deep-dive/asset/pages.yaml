  md: "Enums in TypeScript offer a certain level of nominal typing. Two enum types\
    \ aren't equal if\n\nthey differ by name. We can use this fact to provide nominal\
    \ typing for types that are\n\notherwise structurally compatible.\n\nThe workaround\
    \ involves:\n\nCreating a *brand* enum.\n\nCreating the type as an *intersection*\
    \ ( & ) of the brand enum + the actual structure.\n\nThis is demonstrated below\
    \ where the structure of the types is just a string:\n\n// FOO\n\nenum FooIdBrand\
    \ {}\n\ntype FooId = FooIdBrand & string;\n\n// BAR\n\nenum BarIdBrand {}\n\n\
    type BarId = BarIdBrand & string;\n\n/\\*\\*\n\n \\* Usage Demo\n\n \\*/\n\nvar\
    \ fooId: FooId;\n\nvar barId: BarId;\n\n// Safety!\n\nfooId = barId; // error\n\
    \nbarId = fooId; // error\n\n// Newing up\n\nfooId = 'foo' as FooId;\n\nbarId\
    \ = 'bar' as BarId;\n\n// Both types are compatible with the base\n\nvar str:\
    \ string;\n\nstr = fooId;\n\nstr = barId;\n\n**Using Interfaces**\n\nBecause \
    \ numbers  are type compatible with  enum s the previous technique cannot be used\n\
    \nfor them. Instead we can use interfaces to break the structural compatibility.\
    \ This method is\n\nstill used by the TypeScript compiler team, so worth mentioning.\
    \ Using  \\_  prefix and a\n\n Brand  suffix is a convention I strongly recommend\
    \ (and the one followed by the TypeScript\n\nteam).\n\nThe workaround involves\
    \ the following:\n\nNominal Typing\n\n223"
  merge: -1
