    ]\n\n }\n\n } else {\n\n return {\n\n done: true\n\n }\n\n }\n\n }\n\n}\n\nlet\
    \ frame = new Frame(\"Door\", \\[new Component(\"top\"), new Component(\"bottom\"\
    ), new Comp\n\nonent(\"left\"), new Component(\"right\")\\]);\n\nlet iteratorResult1\
