    \n};\n\nThe reason its wrapped in an Immediately-Invoked Function Expression (IIFE)\
    \ i.e.\n\n(function () {\n\n // BODY\n\n return Point;\n\n})();\n\nhas to do with\
    \ inheritance. It allows TypeScript to capture the base class as a variable\n\n\
    \ \\_super  e.g.\n\nvar Point3D = (function (\\_super) {\n\n \\_\\_extends(Point3D,\
    \ \\_super);\n\n function Point3D(x, y, z) {\n\n \\_super.call(this, x, y);\n\n\
    \ this.z = z;\n\n }\n\n Point3D.prototype.add = function (point) {\n\n var point2D\
    \ = \\_super.prototype.add.call(this, point);\n\n return new Point3D(point2D.x,\
    \ point2D.y, this.z + point.z);\n\n };\n\n return Point3D;\n\n})(Point);\n\nNotice\
    \ that the IIFE allows TypeScript to easily capture the base class  Point  in\
