  md: "function foo() {\n\n return 1;\n\n}\n\nvar bar = 'hey';\n\nbar = foo(); //\
    \ ERROR: cannot assign a number to a string\n\nSuppressed:\n\nfunction foo():\
    \ any { // Added \\`any\\`\n\n return 1;\n\n}\n\nvar bar = 'hey';\n\nbar = foo();\
    \ // Okay!\n\nNote: Suppressing errors is dangerous, but it allows you to take\
    \ notice of errors in your\n\n*new* TypeScript code. You might want to leave \
    \ // TODO:  comments as you go along.\\*\\*\n\n**Third Party JavaScript**\n\n\
    You can change your JavaScript to TypeScript, but you can't change the whole world\
    \ to use\n\nTypeScript. This is where TypeScript's ambient definition support\
    \ comes in. In the beginning\n\nwe recommend you create a  vendor.d.ts  (the \
    \ .d.ts  extension specifies the fact that this\n\nis a *declaration file*) and\
    \ start adding dirty stuff to it. Alternatively create a file specific for the\n\
    \nlibrary e.g.  jquery.d.ts  for jquery.\n\nNote: Well maintained and strongly\
    \ typed definitions for nearly the top 90% JavaScript\n\nlibraries out there exists\
    \ in an OSS Repository called DefinitelyTyped. We recommend\n\nlooking there before\
    \ creating your own definitions as we present here. Nevertheless this\n\nquick\
    \ and dirty way is vital knowledge to decrease your initial friction with TypeScript\\\
    *\\*.\n\nConsider the case of  jquery , you can create a *trivial* definition\
    \ for it quite easily:\n\ndeclare var $: any;\n\nSometimes you might want to add\
    \ an explicit annotation on something (e.g.  JQuery ) and\n\nyou need something\
    \ in *type declaration space*. You can do that quite easily using the  type \n\
    \nkeyword:\n\ndeclare type JQuery = any;\n\ndeclare var $: JQuery;\n\nThis provides\
    \ you an easier future update path.\n\nJS Migration Guide\n\n122"
  merge: -1
