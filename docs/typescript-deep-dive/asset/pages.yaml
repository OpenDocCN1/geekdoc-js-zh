  md: "**Generators**\n\nNOTE: You cannot use generators in TypeScript in a meaningful\
    \ way (the ES5 emitter\n\nis in progress). However that will change soon so we\
    \ still have this chapter.\n\n function \\*  is the syntax used to create a *generator\
    \ function*. Calling a generator function\n\nreturns a *generator object*. The\
    \ generator object just follows the iterator interface (i.e. the\n\n next ,  return\
    \  and  throw  functions).\n\nThere are two key motivations behind generator functions:\n\
    \n**Lazy Iterators**\n\nGenerator functions can be used to create lazy iterators\
    \ e.g. the following function returns an\n\n**infinite** list of integers on demand:\n\
    \nfunction\\* infiniteSequence() {\n\n var i = 0;\n\n while(true) {\n\n yield\
    \ i++;\n\n }\n\n}\n\nvar iterator = infiniteSequence();\n\nwhile (true) {\n\n\
    \ console.log(iterator.next()); // { value: xxxx, done: false } forever and ever\n\
    \n}\n\nOf course if the iterator does end, you get the result of  { done: true\
    \ }  as demonstrated\n\nbelow:\n\nfunction\\* idMaker(){\n\n let index = 0;\n\n\
    \ while(index < 3)\n\n yield index++;\n\n}\n\nlet gen = idMaker();\n\nconsole.log(gen.next());\
    \ // { value: 0, done: false }\n\nconsole.log(gen.next()); // { value: 1, done:\
    \ false }\n\nconsole.log(gen.next()); // { value: 2, done: false }\n\nconsole.log(gen.next());\
    \ // { done: true }\n\nGenerators\n\n76"
  merge: -1
  pgno: 75
- img_proc: true
  md: "**Externally Controlled Execution**\n\nThis is the part of generators that\
    \ is truly exciting. It essentially allows a function to pause its\n\nexecution\
    \ and pass control (fate) of the remainder of the function execution to the caller.\n\
    \nA generator function does not execute when you call it. It just creates a generator\
    \ object.\n\nConsider the following example along with a sample execution:\n\n\
    function\\* generator(){\n\n console.log('Execution started');\n\n yield 0;\n\n\
    \ console.log('Execution resumed');\n\n yield 1;\n\n console.log('Execution resumed');\n\
    \n}\n\nvar iterator = generator();\n\nconsole.log('Starting iteration'); // This\
    \ will execute before anything in the generat\n\nor function body executes\n\n\
    console.log(iterator.next()); // { value: 0, done: false }\n\nconsole.log(iterator.next());\
    \ // { value: 1, done: false }\n\nconsole.log(iterator.next()); // { value: undefined,\
    \ done: true }\n\nIf you run this you get the following output:\n\n$ node outside.js\n\
    \nStarting iteration\n\nExecution started\n\n{ value: 0, done: false }\n\nExecution\
    \ resumed\n\n{ value: 1, done: false }\n\nExecution resumed\n\n{ value: undefined,\
    \ done: true }\n\nThe function only starts execution once  next  is called on\
    \ the generator object.\n\nThe function *pauses* as soon as a  yield  statement\
    \ is encountered.\n\nThe function *resumes* when  next  is called.\n\nSo essentially\
    \ the execution of the generator function is controllable by the generator\n\n\
    object.\n\nOur communication using the generator has been mostly one way with\
    \ the generator\n\nreturning values for the iterator. One extremely powerful feature\
    \ of generators in JavaScript\n\nis that they allow two way communications!\n\n\
    you can control the resulting value of the  yield  expression using\n\n iterator.next(valueToInject)\
    \ \n\nGenerators\n\n77"
  merge: -1
  pgno: 76
- img_proc: true
  md: "you can throw an exception at the point of the  yield  expression using\n\n\
    \ iterator.throw(error) \n\nThe following example demonstrates  iterator.next(valueToInject)\
    \ :\n\nfunction\\* generator() {\n\n var bar = yield 'foo';\n\n console.log(bar);\
    \ // bar!\n\n}\n\nconst iterator = generator();\n\n// Start execution till we\
    \ get first yield value\n\nconst foo = iterator.next();\n\nconsole.log(foo.value);\
    \ // foo\n\n// Resume execution injecting bar\n\nconst nextThing = iterator.next('bar');\n\
    \nThe following example demonstrates  iterator.throw(error) :\n\nfunction\\* generator()\
    \ {\n\n try {\n\n yield 'foo';\n\n }\n\n catch(err) {\n\n console.log(err.message);\
    \ // bar!\n\n }\n\n}\n\nvar iterator = generator();\n\n// Start execution till\
    \ we get first yield value\n\nvar foo = iterator.next();\n\nconsole.log(foo.value);\
    \ // foo\n\n// Resume execution throwing an exception 'bar'\n\nvar nextThing =\
    \ iterator.throw(new Error('bar'));\n\nSo here is the summary:\n\n yield  allows\
    \ a generator function to pause its communication and pass control to an\n\nexternal\
    \ system\n\nthe external system can push a value into the generator function body\n\
    \nthe external system can throw an exception into the generator function body\n\
    \nHow is this useful? Jump to the next section **async/await** and find out.\n\
    \nGenerators\n\n78"
  merge: -1
  pgno: 77
- img_proc: true
  md: "**Async Await**\n\nAs a thought experiment imagine the following: a way to\
    \ tell the JavaScript runtime to pause\n\nthe executing of code on the  await\
    \  keyword when used on a promise and resume *only*\n\nonce (and if) the promise\
    \ returned from the function is settled:\n\n// Not actual code. A thought experiment\n\
    \nasync function foo() {\n\n try {\n\n var val = await getMeAPromise();\n\n console.log(val);\n\
    \n }\n\n catch(err) {\n\n console.log('Error: ', err.message);\n\n }\n\n}\n\n\
    When the promise settles execution continues,\n\nif it was fulfilled then await\
    \ will return the value,\n\nif it's rejected an error will be thrown synchronously\
    \ which we can catch.\n\nThis suddenly (and magically) makes asynchronous programming\
    \ as easy as synchronous\n\nprogramming. Three things needed for this thought\
    \ experiment are:\n\nAbility to *pause function* execution.\n\nAbility to *put\
    \ a value inside* the function.\n\nAbility to *throw an exception inside* the\
    \ function.\n\nThis is exactly what generators allowed us to do! The thought experiment\
    \ *is actually real* and\n\nso is the  async / await  implementation in TypeScript\
    \ / JavaScript. Under the covers it just\n\nuses generators.\n\n**Generated JavaScript**\n\
    \nYou don't have to understand this, but it's fairly simple if you've read up\
    \ on generators. The\n\nfunction  foo  can be simply wrapped up as follows:\n\n\
    Async Await\n\n79"
  merge: -1
  pgno: 78
- img_proc: true
  md: "const foo = wrapToReturnPromise(function\\* () {\n\n try {\n\n var val = yield\
    \ getMeAPromise();\n\n console.log(val);\n\n }\n\n catch(err) {\n\n console.log('Error:\
    \ ', err.message);\n\n }\n\n});\n\nwhere the  wrapToReturnPromise  just executes\
    \ the generator function to get the  generator \n\nand then use  generator.next()\
    \ , if the value is a  promise  it would  then + catch  the\n\npromise and depending\
    \ upon the result call  generator.next(result)  or\n\n generator.throw(error)\
    \ . That's it!\n\n**Async Await Support in TypeScript**\n\n**Async - Await** has\
    \ been supported by TypeScript since version 1.7. Asynchronous functions\n\nare\
    \ prefixed with the *async* keyword; *await* suspends the execution until an asynchronous\n\
    \nfunction return promise is fulfilled and unwraps the value from the *Promise*\
    \ returned. It was\n\nonly supported for **target es6** transpiling directly to\
    \ **ES6 generators**.\n\n**TypeScript 2.1** added the capability to ES3 and ES5\
    \ run-times, meaning you’ll be free to\n\ntake advantage of it no matter what\
    \ environment you’re using. It's important to notice that we\n\ncan use async\
    \ / await with TypeScript 2.1 and many browsers are supported, of course,\n\n\
    having globally added a **polyfill for Promise**.\n\nLet's see this **example**\
    \ and take a look at this code to figure out how TypeScript async /\n\nawait **notation**\
    \ works:\n\nAsync Await\n\n80"
