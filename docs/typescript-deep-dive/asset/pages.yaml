  md: "**this**\n\nAny access to  this  keyword within a function is actually controlled\
    \ by how the function is\n\nactually called. It is commonly referred to as the\
    \  calling context .\n\nHere is an example:\n\nfunction foo() {\n\n console.log(this);\n\
    \n}\n\nfoo(); // logs out the global e.g. \\`window\\` in browsers\n\nlet bar\
    \ = {\n\n foo\n\n}\n\nbar.foo(); // Logs out \\`bar\\` as \\`foo\\` was called\
    \ on \\`bar\\`\n\nSo be mindful of your usage of  this . If you want to disconnect\
    \  this  in a class from the\n\ncalling context use an arrow function, more on\
    \ that later.\n\nthis\n\n20"
