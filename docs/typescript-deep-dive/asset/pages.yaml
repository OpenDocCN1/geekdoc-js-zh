    **Type Compatibility**


    Type Compatibility (as we discuss here) determines if one thing can be assigned
    to another.


    E.g.  string  and  number  are not compatible:


    let str: string = "Hello";


    let num: number = 123;


    str = num; // ERROR: \`number\` is not assignable to \`string\`


    num = str; // ERROR: \`string\` is not assignable to \`number\`


    **Soundness**


    TypeScript''s type system is designed to be convenient and allows for *unsound*
    behaviours


    e.g. anything can be assigned to  any  which essentially means you telling the
    compiler to


    allow you to do whatever you want:


    let foo: any = 123;


    foo = "Hello";


    // Later


    foo.toPrecision(3); // Allowed as you typed it as \`any\`


