    \ the fate of the promise\n\n});\n\n**Subscribing to the fate of the promise**\n\
    \nThe promise fate can be subscribed to using  .then  (if resolved) or  .catch\
    \  (if rejected).\n\nconst promise = new Promise((resolve, reject) => {\n\n resolve(123);\n\
    \n});\n\npromise.then((res) => {\n\n console.log('I get called:', res === 123);\
    \ // I get called: true\n\n});\n\npromise.catch((err) => {\n\n // This is never\
    \ called\n\n});\n\nconst promise = new Promise((resolve, reject) => {\n\n reject(new\
    \ Error(\"Something awful happened\"));\n\n});\n\npromise.then((res) => {\n\n\
    \ // This is never called\n\n});\n\npromise.catch((err) => {\n\n console.log('I\
    \ get called:', err.message); // I get called: 'Something awful happe\n\nned'\n\
    \n});\n\nTIP: Promise Shortcuts\n\nQuickly creating an already resolved promise:\
    \  Promise.resolve(result) \n\nQuickly creating an already rejected promise: \
    \ Promise.reject(error) \n\n**Chain-ability of Promises**\n\nThe chain-ability\
    \ of promises **is the heart of the benefit that promises provide**. Once you\n\
