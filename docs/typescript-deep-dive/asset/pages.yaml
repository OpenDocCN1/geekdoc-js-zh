  md: "**Declaration file**\n\nYou can tell TypeScript that you are trying to describe\
    \ code that exists elsewhere (e.g.\n\nwritten in JavaScript/CoffeeScript/The runtime\
    \ environment like the browser or Node.js)\n\nusing the  declare  keyword. As\
    \ a quick example:\n\nfoo = 123; // Error: \\`foo\\` is not defined\n\nvs.\n\n\
    declare var foo: any;\n\nfoo = 123; // allowed\n\nYou have the option of putting\
    \ these declarations in a  .ts  file or in a  .d.ts  file. We highly\n\nrecommend\
    \ that in your real world projects you use a separate  .d.ts  (start with one\
    \ called\n\nsomething like  globals.d.ts  or  vendor.d.ts ).\n\nIf a file has\
    \ the extension  .d.ts  then each root level definition must have the  declare\
    \ \n\nkeyword prefixed to it. This helps make it clear to the author that there\
    \ will be *no code*\n\n*emitted by TypeScript*. The author needs to ensure that\
    \ the declared item will exist at\n\nruntime.\n\nAmbient declarations is a promise\
    \ that you are making with the compiler. If these\n\ndo not exist at runtime and\
    \ you try to use them, things will break without warning.\n\nAmbient declarations\
    \ are like docs. If the source changes the docs need to be kept\n\nupdated. So\
    \ you might have new behaviours that work at runtime but no one's\n\nupdated the\
    \ ambient declaration and hence you get compiler errors.\n\nDeclaration Files\n\
    \n127"
