  md: "**TypeScript Type System**\n\nWe covered the main features of the TypeScript\
    \ Type System back when we discussed Why\n\nTypeScript?. The following are a few\
    \ key takeaways from that discussion which don't need\n\nfurther explanation:\n\
    \nThe type system in typescript is designed to be *optional* so that *your javascript\
    \ is*\n\n*typescript*.\n\nTypeScript does not block *JavaScript emit* in the presence\
    \ of Type Errors, allowing you\n\nto *progressively update your JS to TS*.\n\n\
    Now let's start with the *syntax* of the TypeScript type system. This way you\
    \ can start using\n\nthese annotations in your code immediately and see the benefit.\
    \ This will prepare you for a\n\ndeeper dive later.\n\n**Basic Annotations**\n\
    \nAs mentioned before Types are annotated using  :TypeAnnotation  syntax. Anything\
    \ that is\n\navailable in the type declaration space can be used as a Type Annotation.\n\
    \nThe following example demonstrates type annotations can be used for variables,\
    \ function\n\nparameters and function return values:\n\nvar num: number = 123;\n\
    \nfunction identity(num: number): number {\n\n return num;\n\n}\n\n**Primitive\
    \ Types**\n\nThe JavaScript primitive types are well represented in the TypeScript\
    \ type system. This\n\nmeans  string ,  number ,  boolean  as demonstrated below:\n\
    \nTypeScript's Type System\n\n112"
  merge: -1
  pgno: 111
