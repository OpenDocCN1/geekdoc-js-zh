  md: "TypeScripts type system is extremely powerful in that you can do supremely\
    \ powerful things\n\nin the language moving / slicing / dicing types in ways that\
    \ are not possible in any single\n\nlanguage out there.\n\nThis is because TypeScript\
    \ is designed to allow you to work seamlessly with a *highly*\n\n*dynamic* language\
    \ like JavaScript. Here we cover a few tricks for moving types around in\n\nTypeScript.\n\
    \nKey motivation for these : You change one thing and everything else just updates\n\
    \nautomatically and you get nice errors if something is going to break, like a\
    \ well designed\n\nconstraint system.\n\n**Copying both the Type + Value**\n\n\
    If you want to move a class around you might be tempted to do the following:\n\
    \nclass Foo { }\n\nvar Bar = Foo;\n\nvar bar: Bar; // ERROR: \"cannot find name\
    \ 'Bar'\"\n\nThis is an error because  var  only copied the  Foo  into the *variable*\
    \ declaration space and\n\nyou therefore cannot use  Bar  as a type annotation.\
    \ The proper way is to use the  import \n\nkeyword. Note that you can only use\
    \ the  import  keyword in such a way if you are using\n\n*namespaces* or *modules*\
    \ (more on these later):\n\nnamespace importing {\n\n export class Foo { }\n\n\
    }\n\nimport Bar = importing.Foo;\n\nvar bar: Bar; // Okay\n\nThis  import  trick\
    \ only works for things that are *both type and a variable*.\n\n**Capturing the\
    \ type of a variable**\n\nYou can actually use a variable in a type annotation\
    \ using the  typeof  operator. This allows\n\nyou to tell the compiler that one\
    \ variable is the same type as another. Here is an example to\n\ndemonstrate this:\n\
    \nMoving Types\n\n202"
  merge: -1
  pgno: 201
- img_proc: true
  md: "var foo = 123;\n\nvar bar: typeof foo; // \\`bar\\` has the same type as \\\
    `foo\\` (here \\`number\\`)\n\nbar = 456; // Okay\n\nbar = '789'; // ERROR: Type\
    \ \\`string\\` is not \\`assignable\\` to type \\`number\\`\n\n**Capturing the\
    \ type of a class member**\n\nSimilar to capturing the type of a variable, you\
    \ just declare a variable purely for type\n\ncapturing purposes:\n\nclass Foo\
    \ {\n\n foo: number; // some member whose type we want to capture\n\n}\n\n// Purely\
    \ to capture type\n\ndeclare let \\_foo: Foo;\n\n// Same as before\n\nlet bar:\
    \ typeof \\_foo.foo;\n\n**Capturing the type of magic strings**\n\nLots of JavaScript\
    \ libraries and frameworks work off of raw JavaScript strings. You can use\n\n\
    \ const  variables to capture their type e.g.\n\n// Capture both the \\*type\\\
    * and \\*value\\* of magic string:\n\nconst foo = \"Hello World\";\n\n// Use the\
    \ captured type:\n\nlet bar: typeof foo;\n\n// bar can only ever be assigned to\
    \ \\`Hello World\\`\n\nbar = \"Hello World\"; // Okay!\n\nbar = \"anything else\
    \ \"; // Error!\n\nIn this example  bar  has the literal type  \"Hello World\"\
    \ . We cover this more in the literal\n\ntype section.\n\n**Capturing the name\
    \ of the keys**\n\nThe  keyof  operator lets you capture the key names of a type.\
    \ E.g. you can use it to capture\n\nthe key names of a variable by first grabbing\
    \ its type using  typeof :\n\nMoving Types\n\n203"
  merge: -1
  pgno: 202
- img_proc: true
  md: "const colors = {\n\n red: 'red',\n\n blue: 'blue'\n\n}\n\ntype Colors = keyof\
    \ typeof colors;\n\nlet color: Colors;\n\ncolor = 'red'; // okay\n\ncolor = 'blue';\
    \ // okay\n\ncolor = 'anythingElse'; // Error\n\nThis allows you to have stuff\
    \ like string enums + constants quite easily, as you just saw in\n\nthe above\
    \ example.\n\nMoving Types\n\n204"
