  md: "** @types **\n\nDefinitely Typed is definitely one of TypeScript's greatest\
    \ strengths. The community has\n\neffectively gone ahead and **documented** the\
    \ nature of nearly 90% of the top JavaScript\n\nprojects out there.\n\nThis means\
    \ that you can use these projects in a very interactive and exploratory manner,\
    \ no\n\nneed to have the docs open in a seperate window and making sure you don't\
    \ make a typo.\n\n**Using **** @types **\n\nInstallation is fairly simple as it\
    \ just works on top of  npm . So as an example you can install\n\ntype definitions\
    \ for  jquery  simply as:\n\nnpm install @types/jquery --save-dev\n\n @types \
    \ supports both *global* and *module* type definitions.\n\n**Global **** @types\
    \ **\n\nBy default any definitions that support global consumption are included\
    \ automatically. E.g.\n\nfor  jquery  you should be able to just start using \
    \ $  *globally* in your project.\n\nHowever for *libraries* (like  jquery ) I\
    \ generally recommend using *modules*:\n\n**Module **** @types **\n\nAfter installation,\
    \ no special configuration is required really. You just use it like a module e.g.:\n\
    \nimport \\* as $ from \"jquery\";\n\n// Use $ at will in this module :)\n\n**Controlling\
    \ Globals**\n\nAs can be seen having a definition that supports global leak in\
    \ automatically can be a\n\nproblem for some team so you can chose to *explicitly*\
    \ only bring in the types that make\n\nsense using the  tsconfig.json   compilerOptions.types\
    \  e.g.:\n\n@types\n\n124"
  merge: -1
