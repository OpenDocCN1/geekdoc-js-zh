  md: "lib.d.ts\n\nExample Usage\n\nInside look\n\nModifying Native types\n\nUsing\
    \ custom lib.d.ts\n\nCompiler  target  effect on lib.d.ts\n\n lib  option\n\n\
    ** lib.d.ts **\n\nA special declaration file  lib.d.ts  ships with every installation\
    \ of TypeScript. This file\n\ncontains the ambient declarations for various common\
    \ JavaScript constructs present in\n\nJavaScript runtimes and the DOM.\n\nThis\
    \ file is automatically included in the compilation context of a TypeScript project.\n\
    \nThe objective of this file is to make it easy for you to start writing *type\
    \ checked*\n\nJavaScript code.\n\nYou can exclude this file from the compilation\
    \ context by specifying the  --noLib  compiler\n\ncommand line flag (or  \"noLib\"\
    \ : true  in  tsconfig.json ).\n\n**Example Usage**\n\nAs always let's look at\
    \ examples of this file being used in action:\n\nvar foo = 123;\n\nvar bar = foo.toString();\n\
    \nThis code type checks fine *because* the  toString  function is defined in \
    \ lib.d.ts  for all\n\nJavaScript objects.\n\nIf you use the same sample code\
    \ with the  noLib  option you get a type check error:\n\nvar foo = 123;\n\nvar\
    \ bar = foo.toString(); // ERROR: Property 'toString' does not exist on type 'number\n\
    \n'.\n\nSo now that you understand the importance of  lib.d.ts  what does its\
    \ contents look like?\n\nWe examine that next.\n\n** lib.d.ts **** inside look**\n\
    \nlib.d.ts\n\n139"
  merge: -1
  pgno: 138
- img_proc: true
  md: "The contents of  lib.d.ts  are primarily a bunch of *variable* declarations\
    \ e.g.  window ,\n\n document ,  math  and a bunch of similar *interface* declarations\
    \ e.g.  Window  ,  Document ,\n\n Math .\n\nThe simplest way to discover what\
    \ is what is to type in code *that you know works* e.g.\n\n Math.floor  and then\
    \ F12 (go to definition) using your IDE (atom-typescript has great\n\nsupport\
    \ for this).\n\nLet's look at a sample *variable* declaration, e.g.  window  is\
    \ defined as:\n\ndeclare var window: Window;\n\nThat is just a simple  declare\
    \ var  followed by the variable name (here  window ) and an\n\ninterface for a\
    \ type annotation (here the  Window  interface). These variables generally point\n\
    \nto some global *interface* e.g. here is a small sample of the (actually quite\
    \ massive)  Window \n\ninterface:\n\ninterface Window extends EventTarget, WindowTimers,\
    \ WindowSessionStorage, WindowLocalS\n\ntorage, WindowConsole, GlobalEventHandlers,\
    \ IDBEnvironment, WindowBase64 {\n\n animationStartTime: number;\n\n applicationCache:\
    \ ApplicationCache;\n\n clientInformation: Navigator;\n\n closed: boolean;\n\n\
    \ crypto: Crypto;\n\n // so on and so forth...\n\n}\n\nYou can see that here is\
    \ a *lot* of type information in these interfaces. In the absence of\n\nTypeScript\
    \ *you* would need to keep this in *your* head. Now you can offload that knowledge\n\
    \non the compiler with easy access to it using things like  intellisense .\n\n\
    There is a good reason for using *interfaces* for these globals. It allows you\
    \ to *add additional*\n\n*properties* to these globals *without* a need to change\
    \  lib.d.ts . We will cover this concept\n\nnext.\n\n**Modifying native types**\n\
    \nSince an  interface  in TypeScript is open ended this means that you can just\
    \ add members\n\nto the interfaces declared in  lib.d.ts  and TypeScript will\
    \ pick up on the additions. Note\n\nthat you need to make these changes in a *global\
    \ module* for these interfaces to get\n\nassociated with  lib.d.ts . We even recommend\
    \ creating a special file called  globals.d.ts \n\nfor this purpose.\n\nHere are\
    \ a few example cases where we add stuff to  window ,  Math ,  Date :\n\nlib.d.ts\n\
    \n140"
  merge: -1
  pgno: 139
