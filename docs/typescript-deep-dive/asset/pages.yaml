  md: '**Your JavaScript is TypeScript**


    There were (and will continue to be) a lot of competitors in *Some syntax* to
    *JavaScript*


    compilers. TypeScript is different from them in that *Your JavaScript is TypeScript*.
    Here''s a


    diagram:


    ![](img/416f69818aa79e3f1fe0e7869c118431_14_0.png)


    However it does mean that *you need to learn JavaScript* (the good news is *you
    ****only**** need to*


    *learn JavaScript*). TypeScript is just standardizing all the ways you provide
    *good*


    *documentation* on JavaScript.


    Just giving you a new syntax doesn''t help fix bugs (looking at you CoffeeScript).


    Creating a new language abstracts you too far from your runtimes, communities


    (looking at you Dart).


    TypeScript is just JavaScript with docs.


