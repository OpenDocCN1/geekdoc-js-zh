  md: "**Creating TypeScript node modules**\n\nA lesson on creating typescript node\
    \ modules\n\nUsing modules written in TypeScript is super fun as you get great\
    \ compile time safety and\n\nautocomplete (essentially executable documentation).\n\
    \nCreating a high quality TypeScript module is simple. Assume the following desired\
    \ folder\n\nstructure for your package:\n\npackage\n\n├─ package.json\n\n├─ tsconfig.json\n\
    \n├─ src\n\n│ ├─ All your source files\n\n│ ├─ index.ts\n\n│ ├─ foo.ts\n\n│ └─\
    \ ...\n\n└─ lib\n\n ├─ All your compiled files\n\n ├─ index.d.ts\n\n ├─ index.js\n\
    \n ├─ foo.d.ts\n\n ├─ foo.js\n\n └─ ...\n\nIn your  tsconfig.json \n\nhave  compilerOptions\
    \ :  \"outDir\": \"lib\"  and  \"declaration\": true  < This\n\ngenerates declaration\
    \ and js files in the lib folder\n\nhave  include: \\[\"./src/\\*\\*/\\*\\]\"\
    \  < This includes all the files from the  src  dir.\n\nIn your  package.json\
    \  have\n\n \"main\": \"lib/index\"  < This tells Node.js to load  lib/index.js\
    \ \n\n \"types\": \"lib/index\"  < This tells TypeScript to load  lib/index.d.ts\
    \ \n\nExample package:\n\n npm install typestyle  for TypeStyle\n\nUsage:  import\
    \ { style } from 'typestyle';  will be completely type safe.\n\nMORE:\n\nIf you\
    \ package depends on other TypeScript authored packages, put them in\n\n dependencies\
    \ / devDependencies / peerDependencies  just like you would with raw JS\n\npackages.\n\
    \nIf you package depends on other JavaScript authored packages and you want to\
    \ use it\n\nNode.js QuickStart\n\n106"
