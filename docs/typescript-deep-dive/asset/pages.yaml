  md: "**noImplicitAny**\n\nThere are some things that cannot be inferred or inferring\
    \ them might result in errors that\n\nmight be unexpected. A fine example is function\
    \ arguments. If you don't annotate them its\n\nunclear what should and shouldn't\
    \ be valid e.g.\n\nfunction log(someArg) {\n\n sendDataToServer(someArg);\n\n\
    }\n\n// What arg is valid and what isn't?\n\nlog(123);\n\nlog('hello world');\n\
    \nSo if you don't annotate some function argument TypeScript assumes  any  and\
    \ moves on.\n\nThis essentially turns off type checking for such cases which is\
    \ what a JavaScript dev would\n\nexpect but can catch people that want high safety\
    \ off guard. Hence there is an option\n\n noImplicitAny  that when switched on\
    \ will flag the cases where the type cannot be inferred\n\ne.g.\n\nfunction log(someArg)\
    \ { // Error : someArg has an implicit \\`any\\` type\n\n sendDataToServer(someArg);\n\
    \n}\n\nof course you can then go ahead an annotate:\n\nfunction log(someArg: number)\
    \ {\n\n sendDataToServer(someArg);\n\n}\n\nAnd if you truly want *zero safety*\
    \ you can mark it *explicitly* as  any :\n\nfunction log(someArg: any) {\n\n sendDataToServer(someArg);\n\
    \n}\n\nnoImplicitAny\n\n216"
