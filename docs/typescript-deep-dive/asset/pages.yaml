    \ that matches the *convenient*\n\nnature of JavaScript .\n\nNote that at runtime\
    \ (in the generated JS) these have no significance but will give you\n\ncompile\
    \ time errors if you use them incorrectly. An example of each is shown below:\n\
    \nclass FooBase {\n\n public x: number;\n\n private y: number;\n\n protected z:\
    \ number;\n\n}\n\n// EFFECT ON INSTANCES\n\nvar foo = new FooBase();\n\nfoo.x;\
    \ // okay\n\nfoo.y; // ERROR : private\n\nfoo.z; // ERROR : protected\n\n// EFFECT\
    \ ON CHILD CLASSES\n\nclass FooChild extends FooBase {\n\n constructor() {\n\n\
    \ super();\n\n this.x; // okay\n\n this.y; // ERROR: private\n\n this.z; // okay\n\
    \n }\n\n}\n\nAs always these modifiers work for both member properties and member\
    \ functions.\n\n**Abstract**\n\n abstract  can be thought of as an access modifier.\
    \ We present it separately because\n\nopposed to the previously mentioned modifiers\
    \ it can be on a  class  as well as any member\n\nof the class. Having an  abstract\
    \  modifier primarily means that such functionality *cannot be*\n\n*directly invoked*\
    \ and a child class must provide the functionality.\n\n abstract  **classes**\
    \ cannot be directly instantiated. Instead the user must create some\n\nClasses\n\
