  md: "We have seen how trivial doing a serial sequence of async tasks is with promises.\
    \ It is\n\nsimply a matter of chaining  then  calls.\n\nHowever you might potentially\
    \ want to run a series of async tasks and then do something\n\nwith the results\
    \ of all of these tasks.  Promise  provides a static  Promise.all  function that\n\
    \nyou can use to wait for  n  number of promises to complete. You provide it with\
    \ an array of\n\n n  promises and it gives you an array of  n  resolved values.\
    \ Below we show Chaining as\n\nwell as Parallel:\n\n// an async function to simulate\
    \ loading an item from some server\n\nfunction loadItem(id: number): Promise<{\
    \ id: number }> {\n\n return new Promise((resolve) => {\n\n console.log('loading\
    \ item', id);\n\n setTimeout(() => { // simulate a server delay\n\n resolve({\
    \ id: id });\n\n }, 1000);\n\n });\n\n}\n\n// Chaining\n\nlet item1, item2;\n\n\
    loadItem(1)\n\n .then((res) => {\n\n item1 = res;\n\n return loadItem(2);\n\n\
    \ })\n\n .then((res) => {\n\n item2 = res;\n\n console.log('done');\n\n }); //\
    \ overall time will be around 2s\n\n// Parallel\n\nPromise.all(\\[loadItem(1),\
    \ loadItem(2)\\])\n\n .then((res) => {\n\n \\[item1, item2\\] = res;\n\n console.log('done');\n\
    \n }); // overall time will be around 1s\n\nSometimes, you want to run a series\
    \ of async tasks, but you get all you need as long as any\n\none of these tasks\
    \ is settled.  Promise  provides a static  Promise.race  function for this\n\n\
    scenario:\n\nPromise\n\n74"
  merge: -1
  pgno: 73
