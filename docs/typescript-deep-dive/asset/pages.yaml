  md: "in your declarations, the more effort you put the more type safety + code intelligence\
    \ you\n\nget. Note that definitions for most of the popular JavaScript libraries\
    \ have already been\n\nwritten for you by the DefinitelyTyped community so for\
    \ most purposes either:\n\n1\\. The definition file already exists.\n\n2\\. Or\
    \ at the very least, you have a vast list of well reviewed TypeScript declaration\n\
    \ntemplates already available\n\nAs a quick example of how you would author your\
    \ own declaration file, consider a trivial\n\nexample of jquery. By default (as\
    \ is to be expected of good JS code) TypeScript expects you\n\nto declare (i.e.\
    \ use  var  somewhere) before you use a variable\n\n$('.awesome').show(); // Error:\
    \ cannot find name \\`$\\`\n\nAs a quick fix *you can tell TypeScript* that there\
    \ is indeed something called  $ :\n\ndeclare var $:any;\n\n$('.awesome').show();\
    \ // Okay!\n\nIf you want you can build on this basic definition and provide more\
    \ information to help\n\nprotect you from errors:\n\ndeclare var $:{\n\n (selector:string):\
    \ any;\n\n};\n\n$('.awesome').show(); // Okay!\n\n$(123).show(); // Error: selector\
    \ needs to be a string\n\nWe will discuss the details of creating TypeScript definitions\
    \ for existing JavaScript in detail\n\nlater once you know more about TypeScript\
    \ (e.g. stuff like  interface  and the  any ).\n\n**Future JavaScript => Now**\n\
    \nTypeScript provides a number of features that are planned in ES6 for current\
    \ JavaScript\n\nengines (that only support ES5 etc). The typescript team is actively\
    \ adding these features\n\nand this list is only going to get bigger over time\
    \ and we will cover this in its own section. But\n\njust as a specimen here is\
    \ an example of a class:\n\nWhy TypeScript\n\n13"
