  md: "**Equality**\n\nOne thing to be careful about in JavaScript is the difference\
    \ between  ==  and  === . As\n\nJavaScript tries to be resilient against programming\
    \ errors  ==  tries to do type coercion\n\nbetween two variables e.g. converts\
    \ a string to a number so that you can compare with a\n\nnumber as shown below:\n\
    \nconsole.log(5 == \"5\"); // true , TS Error\n\nconsole.log(5 === \"5\"); //\
    \ false , TS Error\n\nHowever the choices JavaScript makes are not always ideal.\
    \ For example in the below\n\nexample the first statement is false because  \"\
    \"  and  \"0\"  are both strings and are clearly\n\nnot equal. However in the\
    \ second case both  0  and the empty string ( \"\" ) are falsy (i.e.\n\nbehave\
    \ like  false ) and are therefore equal with respect to  == . Both statements\
    \ are false\n\nwhen you use  === .\n\nconsole.log(\"\" == \"0\"); // false\n\n\
    console.log(0 == \"\"); // true\n\nconsole.log(\"\" === \"0\"); // false\n\nconsole.log(0\
    \ === \"\"); // false\n\nNote that  string == number  and  string === number \
    \ are both compile time errors in\n\nTypeScript, so you don't normally need to\
    \ worry about this.\n\nSimilar to  ==  vs.  === , there is  !=  vs.  !== \n\n\
    So ProTip: Always use  ===  and  !==  except for null checks, which we cover later.\n\
    \nEquality\n\n17"
  merge: -1
  pgno: 16
