  md: "minimum cognitive overload, types are *structural*. This means that *duck typing*\
    \ is a first class\n\nlanguage construct. Consider the following example. The\
    \ function  iTakePoint2D  will accept\n\nanything that contains all the things\
    \ ( x  and  y ) it expects:\n\ninterface Point2D {\n\n x: number;\n\n y: number;\n\
    \n}\n\ninterface Point3D {\n\n x: number;\n\n y: number;\n\n z: number;\n\n}\n\
    \nvar point2D: Point2D = { x: 0, y: 10 }\n\nvar point3D: Point3D = { x: 0, y:\
    \ 10, z: 20 }\n\nfunction iTakePoint2D(point: Point2D) { /\\* do something \\\
    */ }\n\niTakePoint2D(point2D); // exact match okay\n\niTakePoint2D(point3D); //\
    \ extra information okay\n\niTakePoint2D({ x: 0 }); // Error: missing information\
    \ \\`y\\`\n\n**Type errors do not prevent JavaScript emit**\n\nTo make it easy\
    \ for you to migrate your JavaScript code to TypeScript, even if there are\n\n\
    compilation errors, by default TypeScript *will emit valid JavaScript* the best\
    \ that it can. e.g.\n\nvar foo = 123;\n\nfoo = '456'; // Error: cannot assign\
    \ a \\`string\\` to a \\`number\\`\n\nwill emit the following js:\n\nvar foo =\
    \ 123;\n\nfoo = '456';\n\nSo you can incrementally upgrade your JavaScript code\
    \ to TypeScript. This is very different\n\nfrom how many other language compilers\
    \ work and yet another reason to move to\n\nTypeScript.\n\n**Types can be ambient**\n\
    \nA major design goal of TypeScript was to make it possible for you to safely\
    \ and easily use\n\nexisting JavaScript libraries in TypeScript. TypeScript does\
    \ this by means of *declaration*.\n\nTypeScript provides you with a sliding scale\
    \ of how much or how little effort you want to put\n\nWhy TypeScript\n\n12"
