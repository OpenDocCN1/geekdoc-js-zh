  md: "**Null is Bad**\n\nJavaScript (and by extension TypeScript) has two bottom\
    \ types :  null  and  undefined .\n\nThey are *intended* to mean different things:\n\
    \nSomething hasn't been initialized :  undefined \n\nSomething is currently unavailable:\
    \  null \n\nMost other languages only have one (commonly called  null ). Since\
    \ by default JavaScript\n\nwill evaluate an uninitialized variable / parameter\
    \ / property to  undefined  (you don't get a\n\nchoice) we recommend you just\
    \ use that for your own *unavailable* status and don't bother\n\nwith  null .\n\
    \n**Real world discussions**\n\nTypeScript team doesn't use  null  : TypeScript\
    \ coding guidelines and it hasn't caused any\n\nproblems. Douglas Crockford thinks\
    \  null  is a bad idea and we should all just use\n\n undefined \n\n**Dealing\
    \ with **** null **** style code bases**\n\nIf your code base interacts with other\
    \ APIs that might give you a  null  you check with  ==\n\nundefined  (instead\
    \ of  === ). Using this is safe even for other potentially *falsy* values.\n\n\
    /// Image you are doing \\`foo == undefined\\` where foo can be one of:\n\nconsole.log(undefined\
    \ == undefined); // true\n\nconsole.log(null == undefined); // true\n\nconsole.log(0\
    \ == undefined); // false\n\nconsole.log('' == undefined); // false\n\nconsole.log(false\
    \ == undefined); // false\n\n**Additional tips**\n\n**Limit explicit use of ****\
    \ undefined **\n\nAlso because TypeScript gives you the opportunity to *document*\
    \ your structures separately\n\nfrom values instead of stuff like:\n\nnull is\
    \ bad\n\n238"
