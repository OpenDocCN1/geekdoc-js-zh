  md: "if (error)\n\nUse  == undefined  /  != undefined  (not  ===  /  !== ) to check\
    \ for  null  /  undefined \n\non primitives as it works for both  null / undefined\
    \  but not other falsy values (like\n\n '' , 0 , false ) e.g.\n\n**Bad**\n\nif\
    \ (error !== null)\n\n**Good**\n\nif (error != undefined)\n\nPS: More about  null\
    \ \n\n**Formatting**\n\nThe TypeScript compiler ships with a very nice formatting\
    \ language service. Whatever\n\noutput it gives by default is good enough to reduce\
    \ the cognitive overload on the team.\n\nUse  tsfmt  to automatically format your\
    \ code on the command line. Also your IDE\n\n(atom/vscode/vs/sublime) already\
    \ has formatting support built-in.\n\nExamples:\n\n// Space before type i.e. foo:<space>string\n\
    \nconst foo: string = \"hello\";\n\n**Quotes**\n\nPrefer single quotes ( ' ) unless\
    \ escaping.\n\nStyleGuide\n\n264"
