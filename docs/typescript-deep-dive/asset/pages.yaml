- img_proc: true
  md: "Again, a high quality  jquery.d.ts  exists at DefinitelyTyped. But you now\
    \ know how to\n\novercome any JavaScript -> TypeScript friction *quickly* when\
    \ using third party JavaScript.\n\nWe will look at ambient declarations in detail\
    \ next.\n\n**Third Party NPM modules**\n\nSimilar to global variable declaration\
    \ you can declare a global module quite easily. E.g. for\n\n jquery  if you want\
    \ to use it as a module (https://www.npmjs.com/package/jquery) you can\n\nwrite\
    \ the following yourself:\n\ndeclare module \"jquery\";\n\nAnd then you can import\
    \ it in your file as needed:\n\nimport \\* as $ from \"jquery\";\n\nAgain, a high\
    \ quality  jquery.d.ts  exists at DefinitelyTyped that provides a much higher\n\
    \nquality jquery module declaration. But it might not exist for your library,\
    \ so now you have\n\na quick low friction way of continuing the migration \n\n\
    **External non js resources**\n\nYou can even allow import of any file e.g.  .css\
    \  files (if you are using something like\n\nwebpack) with a simple  \\*  style\
    \ declaration:\n\ndeclare module \"\\*.css\";\n\nNow people can  import \\* as\
    \ foo from \"./some/file.css\"; \n\nJS Migration Guide\n\n123"
