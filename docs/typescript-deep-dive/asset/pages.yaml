  md: "TypeScript supports access modifiers  public , private  and  protected  which\
    \ determine\n\nthe accessibility of a  class  member as shown below:\n\n**accessible\
    \ on**\n\n** public **\n\n** protected **\n\n** private **\n\nclass\n\nyes\n\n\
    yes\n\nyes\n\nclass children\n\nyes\n\nyes\n\nno\n\nclass instances\n\nyes\n\n\
