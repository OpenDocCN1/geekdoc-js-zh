  md: '**Template Strings**


    Syntactically these are strings that use backticks ( i.e. \` ) instead of single
    ('') or double (")


    quotes. The motivation of Template Strings is three fold:


    String Interpolation


    Multiline Strings


    Tagged Templates


    **String Interpolation**


    Another common use case is when you want to generate some string out of some static


    strings + some variables. For this you would need some *templating logic* and
    this is where


    *template strings* get their name from. Here''s how you would potentially generate
    an html


    string previously:


    var lyrics = ''Never gonna give you up'';


    var html = ''<div>'' + lyrics + ''</div>'';


    Now with template strings you can just do:


    var lyrics = ''Never gonna give you up'';


    var html = \`<div>${lyrics}</div>\`;


    Note that any placeholder inside the interpolation ( ${  and  } ) is treated as
    a JavaScript


    expression and evaluated as such e.g. you can do fancy math.


    console.log(\`1 and 1 make ${1 + 1}\`);


    **Multiline Strings**


    Ever wanted to put a newline in a JavaScript string? Perhaps you wanted to embed
    some


    lyrics? You would have needed to *escape the literal newline* using our favorite
    escape


    character  \\ , and then put a new line into the string manually  \\n  at the
    next line. This is


    shown below:


    var lyrics = "Never gonna give you up \\


    \\nNever gonna let you down";


    With TypeScript you can just use a template string:


    Template Strings


    60'
