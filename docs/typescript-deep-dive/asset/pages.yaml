  md: "**lib option**\n\nSometimes (many times) you want to decouple the relationship\
    \ between the compile target\n\n(the generated JavaScript version) and the ambient\
    \ library support. A common example is\n\n Promise , e.g. today (in June 2016)\
    \ you most likely want to  --target es5  but still use latest\n\nstuff like  Promise\
    \ . To support this you can take explicit control of  lib  using the  lib \n\n\
    compiler option.\n\nNote: using  --lib  decouples any lib magic from  --target\
    \  giving you better control.\n\nYou can provide this option on the command line\
    \ or in  tsconfig.json  (recommended):\n\n**Command line**:\n\ntsc --target es5\
    \ --lib dom,es6\n\n**tsconfig.json**:\n\n\"compilerOptions\": {\n\n \"lib\": \\\
    [\"dom\", \"es6\"\\]\n\n}\n\nThe libs can be categorized into categories:\n\n\
    JavaScript Bulk Feature:\n\nes5\n\nes6\n\nes2015\n\nes7\n\nes2016\n\nes2017\n\n\
    esnext\n\nRuntime Environment\n\ndom\n\ndom.iterable\n\nwebworker\n\nscripthost\n\
    \nESNext By-feature options (even smaller than bulk feature)\n\nes2015.core\n\n\
    es2015.collection\n\nes2015.generator\n\nes2015.iterable\n\nlib.d.ts\n\n145"
