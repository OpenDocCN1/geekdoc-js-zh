  md: "var num: number;\n\nvar str: string;\n\n// These literals can be assigned to\
    \ anything\n\nnum = null;\n\nstr = undefined;\n\n** :void **\n\nUse  :void  to\
    \ signify that a function does not have a return type:\n\nfunction log(message):\
    \ void {\n\n console.log(message);\n\n}\n\n**Generics**\n\nMany algorithms and\
    \ data structures in computer science do not depend on the *actual type*\n\nof\
    \ the object. However you still want to enforce a constraint between various variables.\
    \ A\n\nsimple toy example is a function that takes a list of items and returns\
    \ a reversed list of items.\n\nThe constraint here is between what is passed in\
    \ to the function and what is returned by the\n\nfunction:\n\nfunction reverse<T>(items:\
    \ T\\[\\]): T\\[\\] {\n\n var toreturn = \\[\\];\n\n for (let i = items.length\
    \ - 1; i >= 0; i--) {\n\n toreturn.push(items\\[i\\]);\n\n }\n\n return toreturn;\n\
    \n}\n\nvar sample = \\[1, 2, 3\\];\n\nvar reversed = reverse(sample);\n\nconsole.log(reversed);\
    \ // 3,2,1\n\n// Safety!\n\nreversed\\[0\\] = '1'; // Error!\n\nreversed = \\\
    ['1', '2'\\]; // Error!\n\nreversed\\[0\\] = 1; // Okay\n\nreversed = \\[1, 2\\\
    ]; // Okay\n\nTypeScript's Type System\n\n116"
  merge: -1
  pgno: 115
- img_proc: true
  md: "Here you are basically saying that the function  reverse  takes an array (\
    \ items: T\\[\\] ) of\n\n*some* type  T  (notice the type parameter in  reverse<T>\
    \ ) and returns an array of type  T \n\n(notice  : T\\[\\] ). Because the  reverse\
    \  function returns items of the same type as it takes,\n\nTypeScript knows the\
    \  reversed  variable is also of type  number\\[\\]  and will give you Type\n\n\
    safety. Similarly if you pass in an array of  string\\[\\]  to the reverse function\
    \ the returned\n\nresult is also an array of  string\\[\\]  and you get similar\
    \ type safety as shown below:\n\nvar strArr = \\['1', '2'\\];\n\nvar reversedStrs\
    \ = reverse(strArr);\n\nreversedStrs = \\[1, 2\\]; // Error!\n\nIn fact JavaScript\
    \ arrays already have a  .reverse  function and TypeScript does indeed use\n\n\
    generics to define its structure:\n\ninterface Array<T> {\n\n reverse(): T\\[\\\
    ];\n\n // ...\n\n}\n\nThis means that you get type safety when calling  .reverse\
    \  on any array as shown below:\n\nvar numArr = \\[1, 2\\];\n\nvar reversedNums\
    \ = numArr.reverse();\n\nreversedNums = \\['1', '2'\\]; // Error!\n\nWe will discuss\
    \ more about the  Array<T>  interface later when we present  lib.d.ts  in the\n\
    \nsection **Ambient Declarations**.\n\n**Union Type**\n\nQuite commonly in JavaScript\
    \ you want to allow a property to be one of multiple types e.g. *a*\n\n* string\
    \ ** or a ** number *. This is where the *union type* (denoted by  |  in a type\
    \ annotation e.g.\n\n string|number ) comes in handy. A common use case is a function\
    \ that can take a single\n\nobject or an array of the object e.g.:\n\nTypeScript's\
    \ Type System\n\n117"
