  md: "**Lazy Object Literal Initialization**\n\nQuite commonly in JavaScript code\
    \ bases you would initialize and object literals in the\n\nfollowing manner:\n\
    \nlet foo = {};\n\nfoo.bar = 123;\n\nfoo.bas = \"Hello World\";\n\nAs soon as\
    \ you move the code to TypeScript you will start to get Errors like the following:\n\
    \nlet foo = {};\n\nfoo.bar = 123; // Error: Property 'bar' does not exist on type\
    \ '{}'\n\nfoo.bas = \"Hello World\"; // Error: Property 'bas' does not exist on\
    \ type '{}'\n\nThis is because from the state  let foo = {} , TypeScript *infers*\
    \ the type of  foo  (left hand\n\nside of initializing assignment) to be the type\
    \ of the right hand side  {}  (i.e. an object with\n\nno properties). So, it error\
    \ if you try to assign to a property it doesn't know about.\n\n**Ideal Fix**\n\
    \nThe *proper* way to initialize an object in TypeScript is to do it in the assignment:\n\
    \nlet foo = {\n\n bar: 123,\n\n bas: \"Hello World\",\n\n};\n\nThis is also great\
    \ for code review and code maintainability purposes.\n\n**Quick Fix**\n\nIf you\
    \ have a large JavaScript code base that you are migrating to TypeScript the ideal\
    \ fix\n\nmight not be a viable solution for you. In that case you can carefully\
    \ use a *type assertion* to\n\nsilence the compiler:\n\nlet foo = {} as any;\n\
    \nfoo.bar = 123;\n\nfoo.bas = \"Hello World\";\n\nLazy Object Literal Initialization\n\
    \n231"
  merge: -1
  pgno: 230
- img_proc: true
  md: "**Middle Ground**\n\nOf course using the  any  assertion can be very bad as\
    \ it sort of defeats the safety of\n\nTypeScript. The middle ground fix is to\
    \ create an  interface  to ensure\n\nGood Docs\n\nSafe assignment\n\nThis is shown\
    \ below:\n\ninterface Foo {\n\n bar: number\n\n bas: string\n\n}\n\nlet foo =\
    \ {} as Foo;\n\nfoo.bar = 123;\n\nfoo.bas = \"Hello World\";\n\nHere is a quick\
    \ example that shows the fact that using the interface can save you:\n\ninterface\
    \ Foo {\n\n bar: number\n\n bas: string\n\n}\n\nlet foo = {} as Foo;\n\nfoo.bar\
    \ = 123;\n\nfoo.bas = \"Hello World\";\n\n// later in the codebase:\n\nfoo.bar\
    \ = 'Hello Stranger'; // Error: You probably misspelled \\`bas\\` as \\`bar\\\
    `, cannot a\n\nssign string to number\n\n}\n\nLazy Object Literal Initialization\n\
    \n232"
