  md: "enum Color {\n\n Red,\n\n Green,\n\n Blue\n\n}\n\nenum Color {\n\n DarkRed\
    \ = 3,\n\n DarkGreen,\n\n DarkBlue\n\n}\n\nNote that you *should* reinitialize\
    \ the first member (here  DarkRed = 3 ) in a continuation of an\n\nenum to get\
    \ the generated code not clobber values from a previous definition (i.e. the \
    \ 0 ,\n\n 1 , ... so on values). TypeScript will warn you if you don't anyways\
    \ (error message  In an\n\nenum with multiple declarations, only one declaration\
    \ can omit an initializer for its first\n\nenum element. ).\n\n**Enums as flags**\n\
    \nOne excellent use of enums is the ability to use enums as  Flags . Flags allow\
    \ you to check\n\nif a certain condition from a set of conditions is true. Consider\
    \ the following example where\n\nwe have a set of properties about animals:\n\n\
    enum AnimalFlags {\n\n None = 0,\n\n HasClaws = 1 << 0,\n\n CanFly = 1 << 1,\n\
    \n EatsFish = 1 << 2,\n\n Endangered = 1 << 3\n\n}\n\nHere we are using the left\
    \ shift operator to move  1  around a certain level of bits to come\n\nup with\
    \ bitwise disjoint numbers  0001 ,  0010 ,  0100  and  1000  (these are decimals\n\
    \n 1 , 2 , 4 , 8  if you are curious). The bitwise operators  |  (or) /  &  (and)\
    \ /  ~  (not) are\n\nyour best friends when working with flags and are demonstrated\
    \ below:\n\nEnums\n\n135"
  merge: -1
  pgno: 134
- img_proc: true
  md: "enum AnimalFlags {\n\n None = 0,\n\n HasClaws = 1 << 0,\n\n CanFly = 1 << 1,\n\
    \n}\n\nfunction printAnimalAbilities(animal) {\n\n var animalFlags = animal.flags;\n\
    \n if (animalFlags & AnimalFlags.HasClaws) {\n\n console.log('animal has claws');\n\
    \n }\n\n if (animalFlags & AnimalFlags.CanFly) {\n\n console.log('animal can fly');\n\
    \n }\n\n if (animalFlags == AnimalFlags.None) {\n\n console.log('nothing');\n\n\
    \ }\n\n}\n\nvar animal = { flags: AnimalFlags.None };\n\nprintAnimalAbilities(animal);\
    \ // nothing\n\nanimal.flags |= AnimalFlags.HasClaws;\n\nprintAnimalAbilities(animal);\
    \ // animal has claws\n\nanimal.flags &= ~AnimalFlags.HasClaws;\n\nprintAnimalAbilities(animal);\
    \ // nothing\n\nanimal.flags |= AnimalFlags.HasClaws | AnimalFlags.CanFly;\n\n\
    printAnimalAbilities(animal); // animal has claws, animal can fly\n\nHere:\n\n\
    we used  |=  to add flags\n\na combination of  &=  and  ~  to clear a flag\n\n\
    \ |  to combine flags\n\nNote: you can combine flags to create convenient shortcuts\
    \ within the enum definition\n\ne.g.  EndangeredFlyingClawedFishEating  below:\n\
    \nenum AnimalFlags {\n\n None = 0,\n\n HasClaws = 1 << 0,\n\n CanFly = 1 << 1,\n\
    \n EatsFish = 1 << 2,\n\n Endangered = 1 << 3,\n\n EndangeredFlyingClawedFishEating\
    \ = HasClaws | CanFly | EatsFish | Endangered,\n\n}\n\nEnums\n\n136"
