  md: "Enums\n\nEnums and numbers\n\nEnums and strings\n\nChanging the number associated\
    \ with an enum\n\nEnums are open ended\n\nEnums as flags\n\nConst enums\n\nEnum\
    \ with static functions\n\n**Enums**\n\nAn enum is a way to organize a collection\
    \ of related values. Many other programming\n\nlanguages (C/C#/Java) have an \
    \ enum  data type but JavaScript does not. However\n\nTypeScript does. Here is\
    \ an example definition of a TypeScript enum:\n\nenum CardSuit {\n\n Clubs,\n\n\
    \ Diamonds,\n\n Hearts,\n\n Spades\n\n}\n\n// Sample usage\n\nvar card = CardSuit.Clubs;\n\
    \n// Safety\n\ncard = \"not a member of card suit\"; // Error : string is not\
    \ assignable to type \\`CardS\n\nuit\\`\n\n**Enums and Numbers**\n\nTypeScript\
    \ enums are number based. This means that numbers can be assigned to an\n\ninstance\
    \ of the enum, and so can anything else that is compatible with  number .\n\n\
    enum Color {\n\n Red,\n\n Green,\n\n Blue\n\n}\n\nvar col = Color.Red;\n\ncol\
    \ = 0; // Effectively same as Color.Red\n\n**Enums and Strings**\n\nEnums\n\n\
    132"
  merge: -1
  pgno: 131
- img_proc: true
  md: "Before we look further into enums let's look at the JavaScript that it generates,\
    \ here is a\n\nsample TypeScript:\n\nenum Tristate {\n\n False,\n\n True,\n\n\
    \ Unknown\n\n}\n\ngenerates the following JavaScript:\n\nvar Tristate;\n\n(function\
    \ (Tristate) {\n\n Tristate\\[Tristate\\[\"False\"\\] = 0\\] = \"False\";\n\n\
    \ Tristate\\[Tristate\\[\"True\"\\] = 1\\] = \"True\";\n\n Tristate\\[Tristate\\\
    [\"Unknown\"\\] = 2\\] = \"Unknown\";\n\n})(Tristate || (Tristate = {}));\n\n\
    let's focus on the line  Tristate\\[Tristate\\[\"False\"\\] = 0\\] = \"False\"\
    ; . Within it\n\n Tristate\\[\"False\"\\] = 0  should be self explanatory, i.e.\
    \ sets  \"False\"  member of  Tristate \n\nvariable to be  0 . Note that in JavaScript\
    \ the assignment operator returns the assigned\n\nvalue (in this case  0 ). Therefore\
    \ the next thing executed by the JavaScript runtime is\n\n Tristate\\[0\\] = \"\
    False\" . This means that you can use the  Tristate  variable to convert a\n\n\
    string version of the enum to a number or a number version of the enum to a string.\
    \ This is\n\ndemonstrated below:\n\nenum Tristate {\n\n False,\n\n True,\n\n Unknown\n\
    \n}\n\nconsole.log(Tristate\\[0\\]); // \"False\"\n\nconsole.log(Tristate\\[\"\
    False\"\\]); // 0\n\nconsole.log(Tristate\\[Tristate.False\\]); // \"False\" because\
    \ \\`Tristate.False == 0\\`\n\n**Changing the number associated with an Enum**\n\
    \nBy default enums are  0  based and then each subsequent value increments by\
    \ 1\n\nautomatically. As an example consider the following:\n\nEnums\n\n133"
