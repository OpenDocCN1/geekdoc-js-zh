  md: "const foo = 123;\n\nif (true) {\n\n const foo = 456; // Allowed as its a new\
    \ variable limited to this \\`if\\` block\n\n}\n\n**Deep immutability**\n\nA \
    \ const  works with object literals as well, as far as protecting the variable\
    \ *reference* is\n\nconcerned:\n\nconst foo = { bar: 123 };\n\nfoo = { bar: 456\
    \ }; // ERROR : Left hand side of an assignment expression cannot be a \n\nconstant\n\
    \nHowever it still allows sub properties of objects to be mutated, as shown below:\n\
    \nconst foo = { bar: 123 };\n\nfoo.bar = 456; // Allowed!\n\nconsole.log(foo);\
    \ // { bar: 456 }\n\nFor this reason I recommend using  const  with primitives\
    \ or immutable data structures.\n\nconst\n\n45"
