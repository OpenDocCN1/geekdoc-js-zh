    \ {\n\n}\n\nexport default Foo;\n\nYou would import it (in  bar.ts ) using ES6\
    \ syntax as follows:\n\nimport Foo from \"./foo\";\n\nThere are a few maintainability\
    \ concerns here:\n\nIf you refactor  Foo  in  foo.ts  it will not rename it in\
    \  bar.ts \n\nIf you end up needing to export more stuff from  foo.ts  (which\
    \ is what many of your\n\nfiles will have) then you have to juggle the import\
    \ syntax.\n\nFor this reason I recommend simple exports + destructured import.\
    \ E.g.  foo.ts :\n\nexport class Foo {\n\n}\n\nAnd then:\n\nimport {Foo} from\
    \ \"./foo\";\n\nAvoid Export Default\n\n235"
