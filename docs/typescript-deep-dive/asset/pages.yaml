  md: "interface NestedCSS {\n\n color?: string;\n\n \\[selector: string\\]: string\
    \ | NestedCSS;\n\n}\n\nconst example: NestedCSS = {\n\n color: 'red',\n\n '.subclass':\
    \ {\n\n color: 'blue'\n\n }\n\n}\n\nTry not to mix string indexers with *valid*\
    \ values this way. E.g. a typo in the padding will\n\nremain uncaught:\n\nconst\
    \ failsSilently: NestedCSS = {\n\n colour: 'red', // No error as \\`colour\\`\
    \ is a valid string selector\n\n}\n\nInstead seperate out the nesting into its\
    \ own property e.g. in a name like  nest  (or\n\n children  or  subnodes  etc.):\n\
    \ninterface NestedCSS {\n\n color?: string;\n\n nest?: {\n\n \\[selector: string\\\
    ]: NestedCSS;\n\n }\n\n}\n\nconst example: NestedCSS = {\n\n color: 'red',\n\n\
    \ nest: {\n\n '.subclass': {\n\n color: 'blue'\n\n }\n\n }\n\n}\n\nconst failsSilently:\
    \ NestedCSS = {\n\n colour: 'red', // TS Error: unknown property \\`colour\\`\n\
    \n}\n\nIndex Signatures\n\n201"
