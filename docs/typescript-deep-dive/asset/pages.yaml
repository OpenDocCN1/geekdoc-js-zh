  md: "This allows you to do stuff like the following in a TypeSafe manner:\n\nvar\
    \ today = Date.today();\n\nvar todayAfter1second = today.addMilliseconds(1000);\n\
    \n**Example **** string **\n\nIf you look inside  lib.d.ts  for string you will\
    \ find stuff similar to what we saw for  Date \n\n( String  global variable, \
    \ StringConstructor  interface,  String  interface). One thing of note\n\nthough\
    \ is that the  String  interface impacts string *literals* as well as demonstrated\
    \ in the\n\nbelow code sample:\n\ninterface String {\n\n endsWith(suffix: string):\
    \ boolean;\n\n}\n\nString.prototype.endsWith = function(suffix: string): boolean\
    \ {\n\n var str: string = this;\n\n return str && str.indexOf(suffix, str.length\
    \ - suffix.length) !== \\-1;\n\n}\n\nconsole.log('foo bar'.endsWith('bas')); //\
    \ false\n\nconsole.log('foo bas'.endsWith('bas')); // true\n\nSimilar variable\
    \ / interfaces exist for other things that have both static and instance member\n\
    \nlike  Number ,  Boolean ,  RegExp , etc. and these interfaces affect literal\
    \ instances of these\n\ntypes as well.\n\n**Example **** string **** redux**\n\
    \nWe recommended creating a  global.d.ts  for maintainability reasons. However\
