    \n if (typeof command === 'string') {\n\n line = command.trim();\n\n } else {\n\
    \n line = command.join(' ').trim();\n\n }\n\n // Do stuff with line: string\n\n\
    }\n\n**Intersection Type**\n\n extend  is a very common pattern in JavaScript\
    \ where you take two objects and create a\n\nnew one that has the features of\
    \ both these objects. An **Intersection Type** allows you to use\n\nthis pattern\
    \ in a safe way as demonstrated below:\n\nfunction extend<T, U\\>(first: T, second:\
    \ U): T & U {\n\n let result = <T & U> {};\n\n for (let id in first) {\n\n result\\\
    [id\\] = first\\[id\\];\n\n }\n\n for (let id in second) {\n\n if (!result.hasOwnProperty(id))\
    \ {\n\n result\\[id\\] = second\\[id\\];\n\n }\n\n }\n\n return result;\n\n}\n\
    \nvar x = extend({ a: \"hello\" }, { b: 42 });\n\n// x now has both \\`a\\` and\
    \ \\`b\\`\n\nvar a = x.a;\n\nvar b = x.b;\n\n**Tuple Type**\n\nJavaScript doesn't\
    \ have first class tuple support. People generally just use an array as a\n\n\
    tuple. This is exactly what the TypeScript type system supports. Tuples can be\
    \ annotated\n\nusing  :\\[typeofmember1, typeofmember2\\]  etc. A tuple can have\
    \ any number of members.\n\nTuples are demonstrated in the below example:\n\n\
    TypeScript's Type System\n\n118"
