  md: "Beyond the terse syntax, you only *need* to use the fat arrow if you are going\
    \ to give the\n\nfunction to someone else to call. Effectively:\n\nvar growOld\
    \ = person.growOld;\n\n// Then later someone else calls it:\n\ngrowOld();\n\n\
    If you are going to call it yourself, i.e.\n\nperson.growOld();\n\nthen  this\
    \  is going to be the correct calling context (in this example  person ).\n\n\
    **Tip: Arrow Function Danger**\n\nIn fact if you want  this  *to be the calling\
    \ context* you should *not use the arrow function*. This\n\nis the case with callbacks\
    \ used by libraries like jquery, underscore, mocha and others. If the\n\ndocumentation\
    \ mentions functions on  this  then you should probably just use a  function \n\
    \ninstead of a fat arrow. Similarly if you plan to use  arguments  don't use an\
    \ arrow function.\n\n**Tip: Arrow functions with libraries that use **** this\
    \ **\n\nMany libraries do this e.g.  jQuery  iterables (one example http://api.jquery.com/jquery.each/)\n\
    \nwill use  this  to pass you the object that it is currently iterating over.\
    \ In this case if you want\n\nto access the library passed  this  as well as the\
    \ surrounding context just use a temp\n\nvariable like  \\_self  like you would\
    \ in the absence of arrow functions.\n\nlet \\_self = this;\n\nsomething.each(function()\
    \ {\n\n console.log(\\_self); // the lexically scoped value\n\n console.log(this);\
    \ // the library passed value\n\n});\n\n**Tip: Arrow functions and inheritance**\n\
    \nIf you have an instance method as an arrow function then it goes on  this .\
    \ Since there is\n\nonly one  this  such functions cannot participate in a call\
    \ to  super  ( super  only works on\n\nprototype members). You can easily get\
    \ around it by creating a copy of the method before\n\noverriding it in the child.\n\
    \nArrow Functions\n\n37"
