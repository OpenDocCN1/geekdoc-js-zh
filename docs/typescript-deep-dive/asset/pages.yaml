  md: "**Namespaces**\n\nNamespaces provide you with a convenient syntax around a\
    \ common pattern used in\n\nJavaScript:\n\n(function(something) {\n\n something.foo\
    \ = 123;\n\n})(something || (something = {}))\n\nBasically  something || (something\
    \ = {})  allows an anonymous function\n\n function(something) {}  to *add stuff\
    \ to an existing object* (the  something ||  portion) or *start*\n\n*a new object\
    \ then add stuff to that object* (the  || (something = {})  portion). This means\n\
    \nthat you can have two such blocks split by some execution boundary:\n\n(function(something)\
    \ {\n\n something.foo = 123;\n\n})(something || (something = {}))\n\nconsole.log(something);\
    \ // {foo:123}\n\n(function(something) {\n\n something.bar = 456;\n\n})(something\
    \ || (something = {}))\n\nconsole.log(something); // {foo:123, bar:456}\n\nThis\
    \ is commonly used in the JavaScript land for making sure that stuff doesn't leak\
    \ into the\n\nglobal namespace. With file based modules you don't need to worry\
    \ about this, but the\n\npattern is still useful for *logical grouping* of a bunch\
    \ of functions. Therefore TypeScript\n\nprovides the  namespace  keyword to group\
    \ these e.g.:\n\nNamespaces\n\n101"
