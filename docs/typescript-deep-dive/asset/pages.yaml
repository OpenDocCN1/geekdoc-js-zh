  md: "**Classes**\n\nThe reason why it's important to have classes in JavaScript\
    \ as a first class item is that:\n\n1\\. Classes offer a useful structural abstraction\n\
    \n2\\. Provides a consistent way for developers to use classes instead of every\
    \ framework\n\n(emberjs,reactjs etc) coming up with their own version.\n\n3\\\
    . Object Oriented Developers already understand classes.\n\nFinally JavaScript\
    \ developers can *have ** class *. Here we have a basic class called Point:\n\n\
    class Point {\n\n x: number;\n\n y: number;\n\n constructor(x: number, y: number)\
    \ {\n\n this.x = x;\n\n this.y = y;\n\n }\n\n add(point: Point) {\n\n return new\
    \ Point(this.x + point.x, this.y + point.y);\n\n }\n\n}\n\nvar p1 = new Point(0,\
    \ 10);\n\nvar p2 = new Point(10, 20);\n\nvar p3 = p1.add(p2); // {x:10,y:30}\n\
    \nThis class generates the following JavaScript on ES5 emit:\n\nvar Point = (function\
    \ () {\n\n function Point(x, y) {\n\n this.x = x;\n\n this.y = y;\n\n }\n\n Point.prototype.add\
    \ = function (point) {\n\n return new Point(this.x + point.x, this.y + point.y);\n\
    \n };\n\n return Point;\n\n})();\n\nThis is a fairly idiomatic traditional JavaScript\
    \ class pattern now as a first class language\n\nconstruct.\n\n**Inheritance**\n\
    \nClasses\n\n24"
