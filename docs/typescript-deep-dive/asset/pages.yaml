  md: "namespace Foo {\n\n}\n\n**Enum**\n\nUse  PascalCase  for enum names\n\nReason:\
    \ Similar to Class. Is a Type.\n\n**Bad**\n\nenum color {\n\n}\n\n**Good**\n\n\
    enum Color {\n\n}\n\nUse  PascalCase  for enum member\n\nReason: Convention followed\
    \ by TypeScript team i.e. the language creators e.g\n\n SyntaxKind.StringLiteral\
    \ . Also helps with translation (code generation) of other\n\nlanguages into TypeScript.\n\
    \n**Bad**\n\nenum Color {\n\n red\n\n}\n\n**Good**\n\nenum Color {\n\n Red\n\n\
    }\n\n**Null vs. Undefined**\n\nPrefer not to use either for explicit unavailability\n\
    \nStyleGuide\n\n262"
