  md: "**Scanner**\n\nThe source code for the TypeScript scanner is located entirely\
    \ in  scanner.ts . Scanner is\n\n*controlled* internally by the  Parser  to convert\
    \ the source code to an AST. Here is what the\n\ndesired outcome is.\n\nSourceCode\
    \ ~~ scanner ~~> Token Stream ~~ parser ~~> AST\n\n**Usage by Parser**\n\nThere\
    \ is a *singleton*  scanner  created in  parser.ts  to avoid the cost of creating\
    \ scanners\n\nover and over again. This scanner is then *primed* by the parser\
    \ on demand using the\n\n initializeState  function.\n\nHere is a *simplied* version\
    \ of the actual code in the parser that you can run demonstrating\n\nthis concept:\n\
    \n code/compiler/scanner/runScanner.ts \n\nimport \\* as ts from \"ntypescript\"\
    ;\n\n// TypeScript has a singelton scanner\n\nconst scanner = ts.createScanner(ts.ScriptTarget.Latest,\
    \ /\\*skipTrivia\\*/ true);\n\n// That is initialized using a function \\`initializeState\\\
    ` similar to\n\nfunction initializeState(text: string) {\n\n scanner.setText(text);\n\
    \n scanner.setOnError((message: ts.DiagnosticMessage, length: number) => {\n\n\
    \ console.error(message);\n\n });\n\n scanner.setScriptTarget(ts.ScriptTarget.ES5);\n\
    \n scanner.setLanguageVariant(ts.LanguageVariant.Standard);\n\n}\n\n// Sample\
    \ usage\n\ninitializeState(\\`\n\nvar foo = 123;\n\n\\`.trim());\n\n// Start the\
    \ scanning\n\nvar token = scanner.scan();\n\nwhile (token != ts.SyntaxKind.EndOfFileToken)\
    \ {\n\n console.log(ts.syntaxKindToName(token));\n\n token = scanner.scan();\n\
    \n}\n\nScanner\n\n278"
  merge: -1
  pgno: 277
- img_proc: true
  md: "This will print out the following :\n\nVarKeyword\n\nIdentifier\n\nFirstAssignment\n\
    \nFirstLiteralToken\n\nSemicolonToken\n\n**Scanner State**\n\nAfter you call \
    \ scan  the scanner updates its local state (position in the scan, current token\n\
    \ndetails etc). The scanner provides a bunch of utility functions to get the current\
    \ scanner\n\nstate. In the below sample we create a scanner and then use it to\
    \ identify the tokens as well\n\nas their positions in the code.\n\n code/compiler/scanner/runScannerWithPosition.ts\
    \ \n\n// Sample usage\n\ninitializeState(\\`\n\nvar foo = 123;\n\n\\`.trim());\n\
    \n// Start the scanning\n\nvar token = scanner.scan();\n\nwhile (token != ts.SyntaxKind.EndOfFileToken)\
