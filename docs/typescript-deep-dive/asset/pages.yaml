  md: '**Spread Operator**


    The main objective of the spread operator is to *spread* the elements of an array
    or object.


    This is best explained with examples.


    **Apply**


    A common use case is to spread an array into the function arguments. Previously
    you would


    need to use  Function.prototype.apply :


    function foo(x, y, z) { }


    var args = \[0, 1, 2\];


    foo.apply(null, args);


    Now you can do this simply by prefixing the arguments with  ...  as shown below:


    function foo(x, y, z) { }


    var args = \[0, 1, 2\];


    foo(...args);


    Here we are *spreading* the  args  array into positional  arguments .


    **Destructuring**


    We''ve already seen one usage of this in *destructuring*:


    var \[x, y, ...remaining\] = \[1, 2, 3, 4\];


    console.log(x, y, remaining); // 1, 2, \[3,4\]


    The motivation here is to simply make it easy for you to capture the remaining
    elements of


    an array when destructuring.


    **Array Assignment**


    The spread operator allows you to easily place an *expanded version* of an array
    into another


    array. This is demonstrated in the example below:


    var list = \[1, 2\];


    list = \[...list, 3, 4\];


    console.log(list); // \[1,2,3,4\]


    Spread Operator


    50'
