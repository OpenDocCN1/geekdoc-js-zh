  md: "Reason: Similar to class\n\n**Don't** prefix with  I \n\nReason: Unconventional.\
    \  lib.d.ts  defines important interfaces without an  I  (e.g.\n\nWindow, Document\
    \ etc).\n\n**Bad**\n\ninterface IFoo {\n\n}\n\n**Good**\n\ninterface Foo {\n\n\
    }\n\n**Type**\n\nUse  PascalCase  for name.\n\nReason: Similar to class\n\nUse\
    \  camelCase  for members.\n\nReason: Similar to class\n\n**Namespace**\n\nUse\
    \  PascalCase  for names\n\nReason: Convention followed by the TypeScript team.\
    \ Namespaces are effectively just\n\na class with static members. Class names\
    \ are  PascalCase  => Namespace names are\n\n PascalCase \n\n**Bad**\n\nnamespace\
    \ foo {\n\n}\n\n**Good**\n\nStyleGuide\n\n261"
