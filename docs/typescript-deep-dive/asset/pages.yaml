  md: "**Type Inference in TypeScript**\n\nTypeScript can infer (and then check) the\
    \ type of a variable based on a few simple rules.\n\nBecause these rules are simple\
    \ you can train your brain to recognize safe / unsafe code (it\n\nhappened for\
    \ me and my team mates quite quickly).\n\nThe types flowing is just how I imagine\
    \ in my brain the flow of type information.\n\n**Definition**\n\nTypes of a variable\
    \ are inferred by definition.\n\nlet foo = 123; // foo is a \\`number\\`\n\nlet\
    \ bar = \"Hello\"; // bar is a \\`string\\`\n\nfoo = bar; // Error: cannot assign\
    \ \\`string\\` to a \\`number\\`\n\nThis is an example of types flowing from right\
    \ to left.\n\n**Return**\n\nThe return type is inferred by the return statements\
    \ e.g. the following function is inferred to\n\nreturn a  number .\n\nfunction\
    \ add(a: number, b: number) {\n\n return a + b;\n\n}\n\nThis is an example of\
    \ types flowing bottom out.\n\n**Assignment**\n\nThe type of the function parameters\
    \ / return can also be inferred by assignment e.g. here we\n\nsay that  foo  is\
    \ an  Adder , that makes the type of  a  and  b  to infer as  number .\n\ntype\
    \ Adder = (a: number, b: number) => number;\n\nlet foo: Adder = (a, b) => a +\
    \ b;\n\nType Inference\n\n176"
  merge: -1
  pgno: 175
- img_proc: true
  md: "This fact can be demonstrated by the below code which raises an error as you\
    \ would hope:\n\ntype Adder = (a: number, b: number) => number;\n\nlet foo: Adder\
    \ = (a, b) => {\n\n a = \"hello\"; // Error: cannot assign \\`string\\` to a \\\
    `number\\`\n\n return a + b;\n\n}\n\nThis is an example of types flowing from\
    \ left to right.\n\nThe same *assignment* style type inference works if you create\
    \ a function for a callback\n\nargument. After all an  argument -> parameter is\
    \ just another form of variable assignment.\n\ntype Adder = (a: number, b: number)\
    \ => number;\n\nfunction iTakeAnAdder(adder: Adder) {\n\n return adder(1, 2);\n\
    \n}\n\niTakeAnAdder((a, b) => {\n\n // a = \"hello\"; // Would Error: cannot assign\
    \ \\`string\\` to a \\`number\\`\n\n return a + b;\n\n})\n\n**Structuring**\n\n\
    These simple rules also work in the presence of **structuring** (object literal\
    \ creation). For\n\nexample in the following case the type of  foo  is inferred\
    \ to be  {a:number, b:number} \n\nlet foo = {\n\n a: 123,\n\n b: 456\n\n};\n\n\
