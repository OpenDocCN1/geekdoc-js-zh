  md: "**Symbols and Declarations**\n\nLinking between a  node  and a  symbol  is\
    \ performed by a few functions. One function that\n\nis used to bind the  SourceFile\
    \  node to the source file Symbol (in case of an external\n\nmodule) is the  addDeclarationToSymbol\
    \  function\n\nNote : the  Symbol  for an external module source file is setup\
    \ as  flags :\n\nSymbolFlags.ValueModule  and  name: '\"' + removeFileExtension(file.fileName)\
    \ + '\"' ).\n\nfunction addDeclarationToSymbol(symbol: Symbol, node: Declaration,\
    \ symbolFlags: Symbol\n\nFlags) {\n\n symbol.flags |= symbolFlags;\n\n node.symbol\
    \ = symbol;\n\n if (!symbol.declarations) {\n\n symbol.declarations = \\[\\];\n\
    \n }\n\n symbol.declarations.push(node);\n\n if (symbolFlags & SymbolFlags.HasExports\
    \ && !symbol.exports) {\n\n symbol.exports = {};\n\n }\n\n if (symbolFlags & SymbolFlags.HasMembers\
    \ && !symbol.members) {\n\n symbol.members = {};\n\n }\n\n if (symbolFlags & SymbolFlags.Value\
    \ && !symbol.valueDeclaration) {\n\n symbol.valueDeclaration = node;\n\n }\n\n\
    }\n\nThe important linking portions:\n\nCreates a link to the Symbol from the\
    \ AST node ( node.symbol ).\n\nAdds the node as *one of* the declarations of the\
    \ Symbol ( symbol.declarations ).\n\n**Declaration**\n\nDeclaration is just a\
    \  node  with an optional name. In  types.ts \n\ninterface Declaration extends\
    \ Node {\n\n \\_declarationBrand: any;\n\n name?: DeclarationName;\n\n}\n\nBinder\
