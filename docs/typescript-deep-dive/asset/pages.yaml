  md: "**Interfaces**\n\nInterfaces have *zero* runtime JS impact. There is a lot\
    \ of power in TypeScript interfaces to\n\ndeclare the structure of variables.\n\
    \nThe following two are equivalent declarations, the first uses an *inline annotation*,\
    \ the second\n\nuses an *interface*:\n\n// Sample A\n\ndeclare var myPoint: {\
    \ x: number; y: number; };\n\n// Sample B\n\ninterface Point {\n\n x: number;\
    \ y: number;\n\n}\n\ndeclare var myPoint: Point;\n\nHowever the beauty of *Sample\
    \ B* is that if someone authors a library that builds on the\n\n myPoint  library\
    \ to add new members, they can easily add to the existing declaration of\n\n myPoint\
    \ :\n\n// Lib a.d.ts\n\ninterface Point {\n\n x: number; y: number;\n\n}\n\ndeclare\
    \ var myPoint: Point;\n\n// Lib b.d.ts\n\ninterface Point {\n\n z: number;\n\n\
    }\n\n// Your code\n\nvar myPoint.z; // Allowed!\n\nThis is because **interfaces\
    \ in TypeScript are open ended**. This is a vital tenet of\n\nTypeScript that\
    \ it allows you to mimic the extensibility of JavaScript using *interfaces*.\n\
    \n**Classes can implement interfaces**\n\nIf you want to use *classes* that must\
    \ follow an object structure that someone declared for you\n\nin an  interface\
    \  you can use the  implements  keyword to ensure compatibility:\n\nInterfaces\n\
    \n129"
  merge: -1
  pgno: 128
- img_proc: true
  md: "interface Point {\n\n x: number; y: number;\n\n}\n\nclass MyPoint implements\
    \ Point {\n\n x: number; y: number; // Same as Point\n\n}\n\nBasically in the\
    \ presence of that implements any changes in that external  Point  interface\n\
    \nwill result in a compile error in your code base so you can easily keep it in\
    \ sync:\n\ninterface Point {\n\n x: number; y: number;\n\n z: number; // New member\n\
    \n}\n\nclass MyPoint implements Point { // ERROR : missing member \\`z\\`\n\n\
    \ x: number; y: number;\n\n}\n\nNote that  implements  restricts the structure\
    \ of the class *instances* i.e.:\n\nvar foo: Point = new MyPoint();\n\nAnd stuff\
    \ like  foo: Point = MyPoint  is not the same thing.\n\n**TIPs**\n\n**Not every\
    \ interface is implementable easily**\n\nInterfaces are designed to declare *any\
    \ arbitrarily crazy* structure that might be present in\n\nJavaScript.\n\nConsider\
    \ the following interface where something is callable with  new :\n\ninterface\
    \ Crazy {\n\n new (): {\n\n hello: number\n\n };\n\n}\n\nYou would essentially\
    \ have something like:\n\nInterfaces\n\n130"
  merge: -1
  pgno: 129
- img_proc: true
  md: "class CrazyClass implements Crazy {\n\n constructor() {\n\n return { hello:\
    \ 123 };\n\n }\n\n}\n\n// Because\n\nconst crazy = new CrazyClass(); // crazy\
    \ would be {hello:123}\n\nYou can *declare* all the crazy JS out there with interfaces\
    \ and even use them safely from\n\nTypeScript. Doesn't mean you can use TypeScript\
    \ classes to implement them.\n\nInterfaces\n\n131"
