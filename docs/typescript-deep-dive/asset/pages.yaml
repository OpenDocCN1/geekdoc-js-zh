    \n }\n\n}\n\nvar person = new Person(1);\n\nsetTimeout(person.growOld,1000);\n\
    \nsetTimeout(function() { console.log(person.age); },2000); // 2\n\nThe reason\
    \ why this works is the reference to  this  is captured by the arrow function\
