  md: "**Barrel**\n\nA barrel is a way to rollup exports from several modules into\
    \ a single convenient module.\n\nThe barrel itself is a module file that re-exports\
    \ selected exports of other modules.\n\nImagine the following class structure\
    \ in a library:\n\n// demo/foo.ts\n\nexport class Foo {}\n\n// demo/bar.ts\n\n\
    export class Bar {}\n\n// demo/baz.ts\n\nexport class Baz {}\n\nWithout a barrel,\
    \ a consumer would need three import statements:\n\nimport { Foo } from '../demo/foo';\n\
    \nimport { Bar } from '../demo/bar';\n\nimport { Baz } from '../demo/baz';\n\n\
    You can instead add a barrel  demo/index.ts  containing the following:\n\n// demo/index.ts\n\
    \nexport \\* from './foo'; // re-export all of its exports\n\nexport \\* from\
    \ './bar'; // re-export all of its exports\n\nexport \\* from './baz'; // re-export\
    \ all of its exports\n\nNow the consumer can import what it needs from the barrel:\n\
    \nimport { Foo, Bar, Baz } from '../demo'; // demo/index.ts is implied\n\n**Named\
    \ exports**\n\nInstead of exporting \\* you can chose to export the module in\
    \ a name. Eg. assume that\n\n baz.ts  has functions:\n\nBarrel\n\n254"
