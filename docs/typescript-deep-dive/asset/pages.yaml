  md: "**Callable**\n\nYou can annotate callables as a part of a type or an interface\
    \ as follows\n\ninterface ReturnString {\n\n (): string\n\n}\n\nAn instance of\
    \ such an interface would be a function that returns a string e.g.\n\ndeclare\
    \ const foo: ReturnString;\n\nconst bar = foo(); // bar is inferred as a string\n\
    \n**Obvious examples**\n\nOf course such a *callable* annotation can also specify\
    \ any arguments / optional arguments /\n\nrest arguments as needed. e.g. here\
    \ is a complex example:\n\ninterface Complex {\n\n (foo: string, bar?: number,\
    \ ...others: boolean\\[\\]): number;\n\n}\n\nThey can even specify overloads:\n\
    \ninterface Overloaded {\n\n (foo: string): string\n\n (foo: number): number\n\
    \n}\n\n// example implementation\n\nconst overloaded: Overloaded = (foo) => foo;\n\
    \n// example usage\n\nconst str = overloaded(''); // str is inferred string\n\n\
    const number = overloaded(123); // num is inferred number\n\nOfcourse like *all*\
    \ bodies of interfaces / types you can use these as variable type annotations\n\
    \ne.g.\n\nCallable\n\n151"
  merge: -1
  pgno: 150
- img_proc: true
  md: "const overloaded: {\n\n (foo: string): string\n\n (foo: number): number\n\n\
    } = (foo) => foo;\n\n**Arrow Syntax**\n\nTo make it easy to specify callable signatures\
    \ TypeScript also allows simple arrow type\n\nannotations e.g.\n\nconst simple:\
    \ (foo: number) => string\n\n = (foo) => foo.toString();\n\nOnly limitation of\
    \ the arrow syntax: You can't specify overloads. For overloads you must use\n\n\
    the full bodied  { (someArgs): someReturn }  syntax.\n\n**Newable**\n\nNewable\
    \ is just a special type of *callable* type annotation with the prefix  new .\
    \ It simply\n\nmeans that you need to *invoke* with  new  e.g.\n\ninterface CallMeWithNewToGetString\
    \ {\n\n new(): string\n\n}\n\n// Usage \n\ndeclare const Foo: CallMeWithNewToGetString;\n\
    \nconst bar = new Foo(); // bar is inferred to be of type string\n\nCallable\n\
    \n152"
