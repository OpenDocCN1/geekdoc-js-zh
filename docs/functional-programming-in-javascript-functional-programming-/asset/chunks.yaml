  trans: "\n\n```\n.filter(startsWith('a'))\n.forEach(console.log);\n```\n\n`startsWith`\
    \ 是一个柯里化函数。它不接收两个参数，而是只接收一个参数，并返回一个接受第二个参数的函数。另外请注意，与接收两个参数的原始版本相比，柯里化版本的参数顺序是相反的。当使用箭头语法编写柯里化版本时，你可能会觉得更清晰。\n\
    \n```\nconst startsWith = term => word => {\n  return word.startsWith(term);\n\
    }\n```\n\n另一种选择是使用自动柯里化工具函数来创建函数的柯里化版本。下面是一个使用 [lodash](https://lodash.com/) 中的\
    \ `curry` 工具的示例。\n\n```\nimport { curry } from 'lodash/fp';\n\nconst startsWith\
    \ = curry(function(term, word) {\n  return word.startsWith(term);\n});\n```\n\n\
    ## 归约管道\n\n`reduce` 方法也使用了管道。让我们再次查看代码并分析数据流。\n\n```\nconst numbers = [1, 3, 5];\n\
    \nfunction add(total, n) {\n  return total + n;\n}\n\nconst total = numbers.reduce(add,\
    \ 0);\n\nconsole.log(total);\n//9\n```\n\n每一步，归约器将前一次归约器调用的结果作为聚合值输入。下面是管道示意图。\n\
    \n![](img/Image00009.jpg)\n\n第一步的聚合值是 0。调用归约器后，这次转换的输出 1 作为下一个归约器调用的输入。再次调用归约器后，输出\
    \ 4 作为下一个归约器调用的输入，以此类推。`reduce` 创建了一个管道，其中每一步我们都会得到前一次归约器调用的结果和当前元素作为输入。\n\n##\
    \ 总结\n\n管道定义了一系列数据转换，其中一个转换函数的输出是下一个转换函数的输入。柯里化是一种将接收多个参数的函数分解为一系列只接收一个参数的函数的技术。\n\
    \n# 第 09 章：函子\n\n接下来，我们将探索函子。让我们从一组数据转换开始。考虑下面的例子：\n\n```\nfunction toCelsius(kelvin){\n\
    \  const celsius = (kelvin - 273.15);\n  return Math.round(celsius * 100) / 100;\n\
    }\n\nfunction describeTemperature(temperature){\n  return temperature < 0\n  \
    \  ? \"Freezing\"\n    : temperature < 15\n    ? \"Cold\"\n    : temperature <\
    \ 28\n    ? \"Warm\"\n    : \"Hot\";\n}\n\nconst kelvin = 300;\nconst celsius\
    \ = toCelsius(kelvin);\nconst description = describeTemperature(celsius);\n\n\
    console.log(celsius);\n//26.85\nconsole.log(description)\n//\"Warm\"\n```\n\n\
    如你所见，这段代码的重点是对单个值应用两次变换。它从开尔文温度开始，应用 `toCelsius` 变换，然后对结果应用 `describeTemperature`\
    \ 函数。如果能将这些变换链式应用到初始值上并创建一个管道，那就更好了。下面是一种可能的实现方式：\n\n```\nMappable(300)\n  .map(toCelsius)\n\
    \  .map(describeTemperature)\n```\n\n这就是函子发挥作用的情况。\n\n## 函子\n\n函子是一个带有 `map` 操作的对象，该操作满足函子定律。我们可以简单地将函子创建为一个带有\
    \ `map` 方法的对象。考虑以下函数：\n\n```\nfunction F(value){\n  function map(f){\n    const\
    \ newValue = f(value);\n    return F(newValue);\n  }\n  return {\n    map\n  }\n\
    }\n```\n\n`F` 创建了一个带有 `map` 方法的对象，该方法包装了一个值。`map` 接收一个变换函数，将其应用于包装的值，并返回一个包装了新值的新对象。`F`\
    \ 被称为工厂函数。`F` 返回一个包含闭包 `map` 的对象，该闭包从其父作用域访问 `value` 变量。`F` 工厂函数创建了一个函子。\n\n###\
    \ 函子定律\n\n函子必须遵守同一律和组合律。\n\n#### 同一律\n\n将同一函数传递给函子的 `map` 操作，应该得到相同的函子，即存储相同值的函子。考虑同一函数。\n\
    \n```\nfunction identity(n){\n  return n;\n}\n\nfunctor.map(identiy) = functor\n\
    ```\n\n让我们验证一下我们函子的同一律。\n\n```\nconst functor = F(1);\nconst newFunctor = functor.map(identity);\n\
    //F(1)\n```\n\n#### 组合律\n\n函数组合是一种操作，它接收两个函数 `f` 和 `g`，并产生一个新函数 `h`，其中 `h(x) =\
    \ g(f(x))`。在此操作中，函数 `g` 应用于将函数 `f` 应用于 `x` 的结果。我们可以说函数组合是将一个函数应用于另一个函数结果的操作。函子必须遵守组合律，即：\n\
    \n```\nfunctor.map(f).map(g) === functor.map(x => g(f(x)))\n```\n\n让我们验证组合律。\n\
    \n```\nfunction increment(n){\n  return n + 1;\n}\n\nfunction double(n){\n  return\
    \ n * 2\n}\n\nF(1)\n  .map(increment)\n  .map(double)\n//F(4)\n\nF(1)\n  .map(n\
    \ => double(increment(n)))\n//F(4)\n```\n\n### 范畴论\n\n范畴是由箭头连接的值集合。一个[范畴](https://en.wikipedia.org/wiki/Category_(mathematics))有两个主要性质：能够[结合地](https://en.wikipedia.org/wiki/Associativity)[组合](https://en.wikipedia.org/wiki/Function_composition)箭头，以及每个值都存在一个[同一](https://en.wikipedia.org/wiki/Identity_function)箭头。箭头，也称为态射，是映射范畴中值之间的函数。下面是一个包含三个值的范畴的表示。\n\
    \n![](img/Image00010.jpg)\n\n这个例子中的范畴有三个值：1、2、3，以及三个映射这些值之间的函数。`f` 函数将 1 映射到 2。`g`\
    \ 函数将 2 映射到 3。函数 `h` 从 1 映射到 3，等于 `g(f(1))`。对于每个值，应用同一函数会得到相同的值。\n\n## 实践中的函子\n\
    \n在实践中，函子有助于链式操作。从开发的角度来看，对我们重要的是知道什么时候某个东西是函子。如果是，我们可以用同一函数检查它的值，并且我们可以使用函数组合。我们创建的函子称为同一函子。考虑我们最初的一组数据转换。下面是我们如何使用同一函子将两个变换链式应用到值上。\n\
    \n```\nF(300)\n  .map(toCelsius)\n  .map(describeTemperature)\n```\n\n我们可以使用同一函数的不纯变体来检查内部的值，该变体会在控制台中记录该值。\n\
    \n```\nfunction logIdentity(value){\n  console.log(value);\n  return value;\n\
    }\n\nF(300)\n  .map(toCelsius)\n  .map(logIdentity) //26.85\n  .map(describeTemperature)\n\
    \  .map(logIdentity) //\"Warm\"\n```\n\n应用函数组合时，我们也会得到相同的结果。\n\n```\nF(300)\n\
    \  .map(x => describeTemperature(toCelsius(x)))\n  .map(logIdentity)\n//\"Warm\"\
    \n```\n\n下面是一个使用函数式库（如 [lodash](https://lodash.com/)）中的 `compose` 工具应用函数组合的示例。\n\
    \n```\nimport { compose } from 'lodash/fp'\n\nF(300)\n  .map(compose(describeTemperature,\
    \ toCelsius))\n  .map(logIdentity)\n//\"Warm\"\n```\n\n## 数组\n\n数组是可映射的。`map`\
    \ 方法遍历集合，并将映射函数应用于数组中的每个值。让我们验证数组上的函子定律。对数组应用同一函数会创建它的一个副本。\n\n```\n[1, 2, 3]\n\
    \  .map(identity)\n  .map(logIdentity);\n//1\n//2\n//3\n```\n\n接下来，检查组合律。\n\n\
    ```\n[1, 2, 3]\n  .map(increment)\n  .map(double)\n  .map(logIdentity);\n//4\n\
    //6\n//8\n\n[1, 2, 3]\n  .map(x => double(increment(x)))\n  .map(logIdentity);\n\
    //4\n//6\n//8\n```\n\n一个简单的包装单个值的函子可以通过使用只有一个值的数组即时创建。\n\n```\n[300]\n  .map(toCelsius)\n\
    \  .map(describeTemperature)\n  .map(logIdentity);\n//\"Warm\"\n\n[300]\n  .map(x\
    \ => describeTemperature(toCelsius(x)))\n  .map(logIdentity);\n```\n\n"
- fmt: "\n### Recap\nA category is a collection of values, with arrows between these\
    \ values. Arrows represent mapping functions. Applying the identity function on\
    \ any value returns that value. Functors are mappable objects that respect identity\
    \ and composition. Functors offer us a helpful way of creating pipelines of data\
    \ transformations over the wrapped value.\n\n# Chapter 10: Monads\nA functor is\
    \ an object that wraps a value and enables mapping. A monad is an object that\
    \ wraps a value and enables mapping and flat mapping.\n\n## Flat Mapping\nLet’s\
    \ look again at the `map` method available on the array functor. Applying a mapping\
    \ function that returns a value results in a new array wrapping the transformed\
    \ values.\n\n```javascript\nfunction toUpperCase(text){\n  return text.toUpperCase();\n\
    }\n\nconst arr = [\"raspberry strawberry\", \"blueberry\"]\n  .map(toUpperCase);\n\
    \nconsole.log(arr);\n//[ 'RASPBERRY STRAWBERRY', 'BLUEBERRY' ]\n```\n\nThe initial\
    \ array has two text values. After applying the transformation we get an array\
    \ containing two text values with uppercase letters.\n\nCheck what happens when\
    \ we apply a mapping function that returns an array.\n\n```javascript\nfunction\
    \ split(text){\n  return text.split(' ');\n}\n\nconst arr = [\"raspberry strawberry\"\
    , \"blueberry\"]\n  .map(split)\n\nconsole.log(arr);\n//[ [ 'raspberry', 'strawberry'\
    \ ], [ 'blueberry' ] ]\n```\n\nThe `split` function splits a string into an array\
    \ of substrings using a separator. Each substring represents a word in the original\
    \ text.\n\nApplying the `split` mapping function results in an array containing\
    \ two other arrays. Each sub-array is a collection of strings.\n\nFlat mapping\
    \ is similar to mapping, but it unwraps the return type.\n\nNext, take a look\
    \ at applying the same mapping function using the `flatMap` method available on\
    \ arrays.\n\n```javascript\nconst arr = [\"raspberry strawberry\", \"blueberry\"\
    ]\n  .flatMap(split)\n\nconsole.log(arr);\n//[ 'raspberry', 'strawberry', 'blueberry'\
    \ ]\n```\n\nThe `flatMap` method first maps each element in the arrays using the\
    \ mapping function, then flattens the result into a new array. The same outcome\
    \ can be achieved by first using `map` and then flatten the result using `flat`\
    \ with depth `1`.\n\n```javascript\nconst arr = [\"raspberry strawberry\", \"\
    blueberry\"]\n  .map(split)\n  .flat();\n\nconsole.log(arr);\n//[ 'raspberry',\
    \ 'strawberry', 'blueberry' ]\n```\n\n`flat` creates a new array with all sub-array\
    \ values concatenated into it. It uses recursion to concatenate values up to the\
    \ specified depth.\n\n```javascript\nconst arr = [1, [2, 3]];\nconsole.log(arr.flat());\n\
    //[ 1, 2, 3 ]\n```\n\n## Monads\nWe can simply create a monad as an object with\
    \ the `map` and `flatMap` methods. Consider the following `M` function:\n\n```javascript\n\
    function M(value){\n  function map(f){\n    const newValue = f(value);\n    return\
    \ M(newValue);\n  }\n  function flatMap(f){\n    const newValue = f(value);\n\
    \    return newValue;\n  }\n  return {\n    map,\n    flatMap\n  }\n}\n```\n\n\
    `M` is a factory function that creates an object wrapping a value and having two\
    \ methods to modify it, `map` and `flatMap`. `map` takes a transformation function\
    \ and uses it to create a new value then uses the `M` factory function to create\
    \ an object wrapping that new value. `flatMap` uses the transformation function\
    \ to compute a new value and returns it.\n\n`M` is the monad constructor. It takes\
    \ a value and returns a monad wrapping the value. `M` is called the identity monad.\n\
    \n## Monad Laws\nThere are three laws monads should respect.\n\n### Left Identity\n\
    Consider `f` as a mapping function returning a monad. Passing the `f` function\
    \ into the `flatMap` operation of a monad wrapping the value `x` should result\
    \ in the same monad as invoking the function `f(x)`.\n\n```\nM(x).flatMap(f) ===\
    \ f(x)\n```\n\nLet’s verify the left identity law on our monad.\n\n```javascript\n\
    function f(){\n  return M(2)\n}\n\nM(1)\n  .flatMap(f);\n//M(2)\n\nf(1);\n//M(2)\n\
    ```\n\n### Right Identity\nPassing the `M` function into the `flatMap` operation\
    \ of a monad wrapping a value should result in monad wrapping the same value.\n\
    \n```\nmonad.flatMap(M) === monad\n```\n\nCheck the law using the `M` custom monad.\n\
    \n```javascript\nM(1)\n  .flatMap(M)\n//M(1)\n```\n\n### Associativity\nMonads\
    \ must respect the associativity law, meaning that:\n\n```\nmonad.flatMap(f).flatMap(g)\n\
    \  === monad.flatMap(x => f(x).flatMap(g))\n```\n\nLet’s test the law.\n\n```javascript\n\
    function f(){\n  return M(2)\n}\nfunction g(){\n  return M(3)\n}\n\nM(1)\n  .flatMap(f)\n\
    \  .flatMap(g);\n//M(3)\n\nM(1)\n  .flatMap(n => f(n).flatMap(g));\n//M(3)\n```\n\
    \n## Alternative Creation and Naming\nThe flat mapping method comes with different\
    \ names like `bind`, `chain`, or just `flatMap`. There is also the practice to\
    \ create the monad with a different method called `unit`. `unit` does the same\
    \ thing as the `M` factory function does, it creates a new monad.\n\nBelow is\
    \ an example of defining a monad using this alternative naming.\n\n```javascript\n\
    export default (function defineMonad(){\n  function M(value){\n    function map(f){\n\
    \      const newValue = f(value);\n      return M(newValue);\n    }\n    function\
    \ bind(f){\n      const newValue = f(value);\n      return newValue;\n    }\n\
    \    return {\n      map,\n      bind\n    }\n  }\n  function unit(value){\n \
    \   return M(value);\n  }\n  return {\n    unit\n  }\n})();\n```\n\n`unit` creates\
    \ a new monad wrapping a value. `bind` defines the flat map operation.\n\nHere\
    \ is how the monad can be created and used.\n\n```javascript\nimport M from './M';\n\
    \nfunction f(){\n  return M.unit(2)\n}\n\nM.unit(1).bind(f)\n//M 2\n```\n\nBelow\
    \ you can review how the monad rules can be written in this case.\n\n**Left identity**\n\
    ```\nM.unit(1).bind(f)\n//M 2\n```\n\n**Right identity**\n```\nM.unit(1).bind(M.unit)\n\
    //M 1\n```\n\n**Associativity**\n```\nM.unit(1).bind(f).bind(g)\n//M 3\n\nM.unit(1).bind(x\
    \ => f(x).bind(g))\n//M 3\n```\n\n[You may also find](https://gist.github.com/newswim/4668aef8a1f1bc0dabe8#file-m-dlecture-txt-LC109)\
    \ `bind` described as a separate function and not as a method on the monad object:\
    \ `bind(monad, f)`. This translates to `monad.bind(f)` when `bind` is a method\
    \ on the monad object.\n\nIt is more helpful to describe `bind` as a method.\n\
    \nLet’s take a look at how we can translate the monad laws from the function form\
    \ to the method form.\n\nThe following three ways of describing the monad laws\
    \ are equivalent.\n\n**Left identity**\n```\nbind(unit(x), f) === f(x)\nM.unit(x).bind(f)\
    \ === f(x)\nM(x).flatMap(f) === f(x)\n```\n\nNote that in the last line, `M` is\
    \ used as the constructor function. `M(x)` is equivalent to `M.unit(x)` and is\
    \ also equivalent to `unit(x)`.\n\n**Right identity**\n```\nbind(monad, unit)\
    \  === monad\nmonad.bind(M.unit) === monad\nmonad.flatMap(M)   === monad\n```\n\
    \n**Associativity**\n```\nbind(bind(monad, f), g)\n  === bind(monad, x => bind(f(x),\
    \ g))\n\nmonad.bind(f).bind(g)\n  === monad.bind(x => f(x).bind(g))\n\nmonad.flatMap(f).flatMap(g)\n\
    \  === monad.flatMap(x => f(x).flatMap(g)))\n```\n\nThis being said, I consider\
    \ that the first implementation of the identity monad as an object with `map`\
    \ and `flatMap` method is easier to work with.\n\n## Arrays\nArrays have both\
    \ the `map` and `flatMap` methods. Let’s check the monad laws on them.\n\nFirst,\
    \ we need a function that can create the array from a value.\n\n```javascript\n\
    function M(value){\n  return [value];\n}\n```\n\nWe don’t need to define such\
    \ a function because there is already one that does that. It is called `Array.of()`.\n\
    \n```javascript\nfunction duplicate(word){\n  return [word, word]\n}\n\nfunction\
    \ split(text){\n  return text.split(\" \");\n}\n```\n\nNext check the three laws.\n\
    \n**Left identity**\n```\n//M(x).flatMap(f) === f(x)\nArray.of('mango')\n  .flatMap(duplicate)\n\
    //['mango', 'mango']\n\nduplicate('mango');\n//['mango', 'mango']\n```\n\nAs you\
    \ noticed, when creating an array with `Array.of`, `M(x)` translates to `Array.of(x)`.\n\
    \n**Right identity**\n```\n//monad.flatMap(M) === monad\nArray.of('lemon')\n \
    \ .flatMap(Array.of)\n//['lemon']\n```\n\n**Associativity**\n```\n//monad.flatMap(f).flatMap(g)\n\
    //  === monad.flatMap(x => f(x).flatMap(g)))\n\nArray.of('orange kiwi')\n  .flatMap(split)\n\
    \  .flatMap(duplicate);\n//[ 'orange', 'orange', 'kiwi', 'kiwi' ]\n\nArray.of('orange\
    \ kiwi')\n  .flatMap(s => split(s).flatMap(duplicate))\n```\n"
