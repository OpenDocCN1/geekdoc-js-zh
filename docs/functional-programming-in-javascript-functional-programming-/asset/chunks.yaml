- fmt: "\n`.filter(isPrime)`\n\n`.forEach(log);`\n\n```\nfunction isPrime(number){\
    \ }\n```\n\n```\nfunction log(number) {\n  console.log(number);\n}\n```\n\n`Range(0,\
    \ 10)` generates all numbers from 0 to 9 and then uses `filter` to select all\
    \ the prime numbers and returns a new sequence containing only those numbers.\
    \ Then we use `forEach` to display those numbers.\n\nBelow we can see how to refactor\
    \ the loop detecting the prime numbers using the `Range` sequence.\n\n```\nimport\
    \ { Range } from 'immutable';\n\nRange(0, 10)\n  .filter(isPrime)\n  .forEach(log);\n\
    \nfunction isPrime(number) {\n  if (number > 2) {\n    const firstDivisor = findFirstDivisor(number);\n\
    \    return !firstDivisor;\n  } else {\n    return (number === 2)\n      ? true\n\
    \      : false;\n  }\n}\n\nfunction findFirstDivisor(number) {\n  return Range(2,\
    \ (number / 2) + 1)\n    .find(isDivisorOf(number));\n}\n\nfunction isDivisorOf(number)\
    \ {\n  return function(divisor) {\n    return (number > 1)\n      ? number % divisor\
    \ === 0\n      : false\n  };\n}\n\nfunction log(number) { }\n```\n\n`isDivisorOf`\
    \ is a curried function that gets a number and returns a predicate function taking\
    \ a possible divisor and returning a boolean value.\n\n`findFirstDivisor` returns\
    \ the first divisor of a number. It checks all numbers from 2 to its half for\
    \ that.\n\n`isPrime` decides if a number is a prime based on the result of `findFirstDivisor`.\
    \ If the number has no divisors then it is a prime number.\n\n## Recap\n\nTransducers\
    \ are functions taking a reducer and returning a new reducer.\n\nLazy sequences\
    \ like `Seq` allow us to efficiently chain transformation methods without creating\
    \ intermediate collections.\n\n`Range` provides sequences of numbers.\n\n## Chapter\
    \ 13: Generators\n\nA generator is a function that returns the next value from\
    \ a sequence each time it is called.\n\nWe will start with a simple generator\
    \ function that gives the next integer each time it is called. It starts from\
    \ 0.\n\n```\nfunction range() {\n  let count = 0;\n  return function() {\n   \
    \ const result = count;\n    count += 1;\n    return result;\n  }\n}\n\nconst\
    \ nextNumber = range()\nconsole.log(nextNumber()); //0\nconsole.log(nextNumber());\
    \ //1\nconsole.log(nextNumber()); //2\n```\n\n`nextNumber` is an infinite generator.\
    \ `nextNumber` is a closure with an internal private state.\n\n### Finite Generators\n\
    \nGenerators can be finite. Check the next example where `range` creates a generator\
    \ that returns consecutive numbers from a specific interval. At the end of the\
    \ sequence, it returns `undefined`.\n\n```\nfunction range(from, to) {\n  let\
    \ count = from;\n  return function() {\n    if (count < to) {\n      const result\
    \ = count;\n      count += 1;\n      return result;\n    } else {\n      return\
    \ undefined;\n    }\n  }\n}\n\nconst nextNumber = range(0, 3)\nconsole.log(nextNumber());\
    \ //0\nconsole.log(nextNumber()); //1\nconsole.log(nextNumber()); //2\nconsole.log(nextNumber());\
    \ //undefined\n```\n\n### `toArray`\n\nWhen working with generators, we may want\
    \ to create an array with all the values from the sequence. For this situation,\
    \ we need a utility function like `toArray` taking a generator and returning all\
    \ the values from the sequence as an array. The sequence should be finite.\n\n\
    ```\nfunction toArray(generate) {\n  let arr = [];\n  let value = generate();\n\
    \  while (value !== undefined) {\n    arr = [...arr, value];\n    value = generate();\n\
    \  }\n  return arr;\n}\n```\n\nLet’s use it with the previous generator.\n\n```\n\
    const numbers = toArray(range(1, 5));\nconsole.log(numbers);\n//[1, 2, 3, 4]\n\
    ```\n\n### `forEach`\n\nWe may also need to run a callback for each element in\
    \ the sequence. The `forEach` utility function does just that. It gets a generator\
    \ and a callback and runs the callback until the generator returns `undefined`.\n\
    \n```\nfunction forEach(callback) {\n  return function(generate) {\n    let value\
    \ = generate();\n    while (value !== undefined) {\n      callback(value);\n \
    \     value = generate();\n    }\n  }\n}\n```\n\nThis is a curried function that\
    \ first takes the callbacks and then the generator.\n\nIn the next example, the\
    \ `log` function is called for all numbers returned by the generator.\n\n```\n\
    function log(x) {\n  console.log(x);\n}\n\nconst nextNumber = range(1, 4);\nforEach(log)(nextNumber);\n\
    //1\n//2\n//3\n```\n\n### `take`\n\nAnother common scenario is to take only the\
    \ first `n` elements from a sequence. In this case, we need a new utility function\
    \ like `take` that receives a generator and creates a new generator returning\
    \ only the first `n` elements from the sequence.\n\n```\nfunction take(n) {\n\
    \  return function(generate) {\n    let count = 0;\n    return function() {\n\
    \      if (count < n) {\n        count += 1;\n        return generate();\n   \
    \   }\n    };\n  };\n}\n```\n\nAgain `take` is a curried function and should be\
    \ called like this: `take(n)(sequence)`.\n\nHere is how you can use `take` and\
    \ `forEach` in a pipeline to get and log to console the first three values from\
    \ an infinite sequence of numbers.\n\n```\nimport { pipe } from 'lodash/fp';\n\
    \nconst nextNumber = range();\npipe(\n  take(3),\n  forEach(console.log)\n)(nextNumber);\n\
    //0\n//1\n//2\n```\n\n### Custom Generators\n\nWe can create any custom generator\
    \ and use it with the previous utility functions. Let’s create the [Fibonacci](https://en.wikipedia.org/wiki/Fibonacci_number)\
    \ custom generator:\n\n```\nfunction fibonacci() {\n  let a = 0;\n  let b = 1;\n\
    \  return function() {\n    const aResult = a;\n    a = b;\n    b = aResult +\
    \ b;\n    return aResult;\n  };\n}\n```\n\nWe can use the Fibonacci generator\
    \ with the utility functions already created to display the first 5 numbers in\
    \ the sequence.\n\n```\nimport { pipe } from 'lodash/fp';\n\nconst generateFibonacci\
    \ = fibonacci();\npipe(\n  take(5),\n  forEach(console.log)\n)(generateFibonacci);\n\
    //0\n//1\n//1\n//2\n//3\n```\n\n### Recap\n\nA generator is a function that returns\
    \ a new value from a sequence, each time it is called.\n\nFunctional generators\
    \ can return elements from finite or infinite sequences of values.\n\n## Chapter\
    \ 14: Promises\n\nA promise is an object containing a future result.\n\nA promise\
    \ has three states: pending, fulfilled, and rejected.\n\n*   Pending is the initial\
    \ state of a promise. The result is not available at this stage.\n*   Fulfilled\
    \ is the state marking a successful operation. The result is available at this\
    \ point.\n*   Rejected is the state marking a failed operation. The result is\
    \ not available, instead, we have access to the error object giving the details\
    \ of why the operation failed.\n\nInitially, the promise starts with the pending\
    \ state. Then it can go to fulfilled or rejected states. Once a promise is fulfilled\
    \ or rejected, it stays in that state.\n\nHere is a representation of the flow\
    \ a promise can go through.\n\n![](Image00011.jpg)\n\n### Creating Promises\n\n\
    Let’s start by creating a simple promise.\n\n```\nfunction delay(interval) {\n\
    \  return new Promise(function(resolve) {\n    return setTimeout(resolve, interval);\n\
    \  });\n}\n\nfunction logDone() {\n  console.log('Done');\n}\n\ndelay(1000)\n\
    \  .then(logDone);\n```\n\n`delay` creates a promise that will resolve in a specific\
    \ amount of time. We can use it to delay the execution of a task.\n\nCreating\
    \ a promise with `new Promise` requires passing in a function called the executor\
    \ function. This function takes two callbacks, `resolve` and `reject`, that can\
    \ be called later to change the state of the promise. The executor function runs\
    \ automatically when the promise is created.\n\n`Promise` has two utility static\
    \ methods, `resolve` and `reject`, to quickly create a resolved or rejected promise.\n\
    \n`Promise.resolve(value)` creates a resolved promise wrapping a `value`.\n\n\
    `Promise.reject(error)` creates a rejected promise.\n\n### Success Handling\n\n\
    #### Mapping\n\n`then` acts as a map. It takes a mapping function and returns\
    \ a promise containing the transformed value.\n\nWe can use a `Promise.resolve`\
    \ to create a simple mappable object wrapping a value. Then we can transform and\
    \ inspect the wrapped value.\n\n```\nfunction toUpperCase(text) {\n  return text.toUpperCase();\n\
    }\n\nfunction logIdentity(value) {\n  console.log(value);\n  return value;\n}\n\
    \nPromise.resolve('sTudY')\n  .then(logIdentity)  //\"sTudY\"\n  .then(toUpperCase)\n\
    ```\n"
