    }\n\nconst number = 0;\nconst newNumber = doAction(number, 'increment');\nconsole.log(number);\n\
    ```\n\n# Loop Statements\n\nThere are three looping statements `for`, `while`\
    \ and `do-while` in the language.\n\n## `for` Statement\n\nThe `for` loop statement\
    \ encourages mutations and side-effects. We are going to replace the `for` loops\
    \ with array methods like `filter`, `map` and `reduce`. When the algorithm requires\
    \ more flexibility, we can fallback to `forEach`.\n\nThe `for-in` loop iterates\
    \ over the keys of an object.\n\n```\nconst book = {\n  title : \"How JavaScript\
    \ Works\",\n  author : \"Douglas Crockford\"\n};\n\nfor (const propName in book)\
    \ {\n  console.log(book[propName])\n}\n```\n\nWe can implement the same logic\
    \ using `Object.keys` and the array methods.\n\n```\nObject.keys(book).forEach(propName\
    \ => {\n  console.log(book[propName])\n});\n```\n\nThe `for-of` statement loops\
    \ over [iterable objects](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols#The_iterable_protocol)\
    \ like arrays or strings.\n\n```\nconst arr = [1, 2, 3];\nfor (const element of\
    \ arr) {\n  console.log(element);\n}\n```\n\nIt can be replaced with the `forEach`\
    \ method.\n\n```\narr.forEach(element => {\n  console.log(element);\n});\n```\n\
    \nThe `while` statement loops as long as the condition is true.\n\nThe `do-while`\
    \ statement is a variant of the `while` loop that executes the code once, before\
    \ checking the condition, then it loops as long as the condition is true.\n\n\
    The following lint rule disallows all loop statements, including `for`, `for-of`,\
    \ `for-in`, `while`, and `do-while`.\n\n`\"no-loop-statement\": \"error\"`\n\n\
    Disabling all loop statements is problematic. We still need at least one loop\
    \ statement to rarely use for specific algorithms until the [tail-call optimization](https://en.wikipedia.org/wiki/Tail_call)\
    \ is available. Here is how you can deactivate the previous loop rule on a particular\
    \ line.\n\n```\nlet i = 1;\n// eslint-disable-next-line functional/no-loop-statement\n\
    while(i < 10){\n  console.log(i);\n  i = i + 1;\n}\n```\n\n# Disruptive Statements\n\
    \nThere are four disruptive statements: `break`, `continue`, `throw`, and `return`.\
    \ We are going to keep only the last one.\n\n## `break` and `continue`\n\nThe\
    \ `break` statement “jumps out” of a loop.\n\nThe `continue` statement “jumps\
    \ over” one iteration in the loop.\n\nBoth `break` and `continue` are similar\
    \ to the `goto` statement and we are not going to use them. Instead, we will use\
    \ array methods like `find`, `every`, or `some`.\n\nConsider the next example\
    \ breaking the loop when the searched element is found.\n\n```\nconst products\
    \ = [\n  {id:1, name: 'apple'},\n  {id:2, name:'mango'}\n]\nconst id = 1;\nlet\
    \ product;\nfor(let i=0; i<products.length; i++){\n  if(products[i].id === id){\n\
    \    product = products[i];\n    break;\n  }\n}\nconsole.log(product);\n//{id:1,\
    \ name: 'apple'}\n```\n\nWe can implement the same logic using `find`.\n\n```\n\
    const id = 1;\nconst product = products.find(p => p.id === id);\nconsole.log(product)\n\
    ```\n\nNow, look at an example iterating over a list of words and stopping when\
    \ a specific word is found.\n\n```\nconst words = [\n  'ability',\n  'calculate',\n\
    \  'calendar',\n  'double',\n  'door'\n];\nconst stopTo = 'double';\nfor(let word\
    \ of words){\n  if(word === stopTo){\n    break;\n  }\n  console.log(word);\n\
    }\n```\n\nThe same logic can be implemented using `every`.\n\n```\nwords.every(w\
    \ => {\n  if(w.startsWith(stopTo)){\n    return false;\n  } else {\n    console.log(w);\n\
    \    return true;\n  }\n});\n```\n\n`break` and `continue` are usually used in\
    \ loops. Once we disable the loops we also disable the usage of `break` and `continue`.\n\
    \n`break` cannot be used in `switch` statements as they require to return on all\
    \ branches.\n\n## `throw`\n\nThe `throw` statement raises an exception. Below\
    \ is an example.\n\n```\nthrow new Error('The errors details');\n```\n\nExceptions\
    \ are not used in functional programming, which means we need to find other alternatives\
    \ for those scenarios.\n\nFor asynchronous code, the best way is to return a rejected\
    \ promise when the operation fails. We will look at this scenario when discussing\
    \ promises. For synchronous code, we need to return a different result when an\
    \ error happens.\n\nHere is the lint rule for disabling the throw statement:\n\
    \n`\"functional/no-throw-statement\": \"error\"`\n\n## Recap\n\nConditional statements\
    \ should return a value on all branches.\n\nThe better alternative for the `if`\
    \ statement is the conditional operator.\n\nSwitches can be replaced with a map.\n\
    \nWe should use the array methods instead of the loop statements.\n\nWe are going\
    \ to use only one disruptive statement `return`.\n\n# Chapter 07: Recursion\n\n\
    Recursion implies that a function calls itself. The recursion needs a termination.\
    \ This happens when a certain condition is met and the recursive algorithm stops\
    \ calling itself and returns a value.\n\nRecursion is a method of solving a problem\
    \ where the solution is found by solving smaller instances of the same problem.\n\
    \n## Recursive `factorial`\n\nLet’s start by looking at the algorithm for computing\
    \ the factorial of a number in an iterative style. As you remember `n`! = `n`\
    \ * (`n`-1)! .\n\n```\nfunction factorial(n) {\n  let result = 1;\n  let i = 2;\n\
    \  while(i <= n){\n    result = result * i;\n    i = i + 1;\n  }\n  return result;\n\
    }\nconsole.log(factorial(5));\n//i=2, result=2\n//i=3, result=6\n//i=4, result=24\n\
    //i=5, result=120\n//120\n```\n\nHere is how we can implement the same algorithm\
    \ using recursion.\n\n```\nfunction factorial(n) {\n  if (n === 0) { \n    return\
    \ 1;  \n  }\n  else {  \n    return n * factorial(n - 1);  \n  }\n}\n//n=5 ->\
    \ 5*f(4)\n//n=4 -> 4*f(3)\n//n=3 -> 3*f(2)\n//n=2 -> 2*f(1)\n//n=1 -> 1*f(0)\n\
    //n=0 -> 1 Stops!\n//n=1 -> 1*f(0) = 1*1 = 1\n//n=2 -> 2*f(1) = 2*1 = 2\n//n=3\
    \ -> 3*f(2) = 3*2 = 6\n//n=4 -> 4*f(3) = 4*6 = 24\n//n=5 -> 5*f(4) = 5*24= 120\n\
    console.log(factorial(5));\n//120\n```\n\nThe `factorial` function calls itself\
    \ until it has the result for `n` being 0. Then it resumes the execution and computes\
    \ the result for `n` equal to 1, 2, 3, 4 and finally 5.\n\nBelow is the same recursive\
    \ function refactored using the conditional operator.\n\n```\nfunction factorial(n)\
    \ {\n  return (n === 0) \n    ? 1\n    : n * factorial(n - 1);  \n}\nconsole.log(factorial(5));\n\
    //120\n```\n\n## Tail-Call Optimization\n\nHere is another way of writing the\
    \ factorial function.\n\n```\nfunction factorial(n, result = 1) {\n  //console.log(`n=${n},\
    \ result=${result}`);\n  return (n === 0) \n    ? result\n    : factorial(n -\
    \ 1, n * result);  \n}\nconsole.log(factorial(5));\n//n=5, result=1\n//n=4, result=5\n\
    //n=3, result=20\n//n=2, result=60\n//n=1, result=120\n//n=0, result=120\n//120\n\
    ```\n\nNotice that this time, once the function arrives at the stopping condition\
    \ it returns the result. It does not need to go back and resume the previous calls\
    \ to return the end result. It returns when the ending condition is met because\
    \ it has all the necessary data.\n\nA recursive function is tail-recursive when\
    \ the recursive call is the last thing the function does.\n\nThe tail-recursive\
    \ functions should be optimized by the compiler and should perform better.\n\n\
    At the moment of writing the tail-call optimization is not implemented by the\
    \ major browsers.\n\n## Stack Overflow Error\n\nConsider the following function\
    \ that computes the sum of all values from 0 to 10000 in an iterative style\n\n\
    ```\nfunction sumAll(n) {        \n  let total = 0;\n  let i = 1;\n  while(i <=\
    \ n){\n    total = total + i;\n    i = i + 1;\n  }\n  return total;\n}\nconsole.log(sumAll(10000));\n\
    //50005000\n```\n\nBelow is the equivalent code written with the tail-call optimization.\n\
    \n```\nfunction sumAll(n, i = 0, result = 0) {\n  return (i > n) \n    ? result\n\
    \    : sumAll(n, i + 1, i + result);  \n}\nconsole.log(sumAll(5));\n//15\n```\n\
    \nCalling the recursive function with a larger number leads to the stack overflow\
    \ error.\n\n```\nconsole.log(sumAll(10000));\n```\n"
