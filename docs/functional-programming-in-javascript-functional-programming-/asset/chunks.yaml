  trans: "\n\n## 扁平映射\n\n`.then(logIdentity); //\"STUDY\"`\n\n`then` 也起到了扁平映射的作用。当映射函数返回一个值时，`then`\
    \ 返回一个包含转换后值的 Promise。更准确地说，我们应该说映射函数返回的是一个非 Promise 的值。当映射函数返回一个包装了值的 Promise\
    \ 时，`then` 不会将其包装到另一个 Promise 中。它只是返回包含转换后值的新 Promise。将 Promise 包装到另一个 Promise\
    \ 中意味着创建一个包含 Promise 的 Promise，而该 Promise 又包装了一个值。\n\n来看一个函数，它用于两个数字相除，并作为 Promise\
    \ 上的映射函数使用。\n\n```javascript\nfunction devideBy(n, divisor){\n  return n / divisor;\n\
    }\n\nfunction logIdentity(value){}\n\nPromise.resolve(9)\n  .then(logIdentity)\
    \  //9\n  .then(n => devideB(n, 3))\n  .then(logIdentity); //3\n```\n\n我们可以将 `devideBy`\
    \ 实现为柯里化函数，并与 `then` 更优雅地配合使用。\n\n```javascript\nfunction devideBy(divisor){\n\
    \  return function(n){\n    return n / divisor;\n  }\n}\n\nPromise.resolve(9)\n\
    \  .then(logIdentity)  //9\n  .then(devideBy(3))\n  .then(logIdentity); //3\n\
    ```\n\n当 `devideBy` 返回一个 Promise 而不是数字时，`then` 会等待该 Promise 完成，并返回一个包装了转换后值的 Promise。\n\
    \n```javascript\nfunction devideBy(divisor){\n  return function(number){\n   \
    \ const result = number / divisor;\n    return Promise.resolve(result);\n  }\n\
    }\n\nPromise.resolve(9)\n  .then(logIdentity)  //9\n  .then(devideBy(3))\n  .then(logIdentity);\
    \ //3\n```\n\n## 错误处理\n\n`catch` 用于处理 Promise 链中的错误。下面是一个使用 `catch` 进行错误处理的示例。\n\
    \n```javascript\nfunction devideBy(divisor){\n  return function(number){\n   \
    \ const result = number / divisor;\n    return (divisor !== 0)\n      ? Promise.resolve(result)\n\
    \      : Promise.reject(\"Can't divide by 0\")\n  }\n}\n\nfunction logError(error){\n\
    \  console.error(error);\n}\n\nPromise.resolve(9)\n  .then(logIdentity) //9\n\
    \  .then(devideBy(0))\n  .then(logIdentity)\n  .catch(logError) //\"Can't divide\
    \ by 0\"\n```\n\n如果任何转换步骤中出现错误，流程会跳转到最近的错误处理程序。\n\n## 链式调用\n\n正如你所注意到的，我们可以对包装后的值进行多次链式转换。已解决\
    \ Promise 上的 `then` 方法会返回一个新的 Promise。同样，被拒绝 Promise 上的 `catch` 方法也会返回一个新的 Promise。这就创建了一个转换管道，其中每个转换函数都将前一个转换的结果作为输入。\n\
    \n```javascript\nfunction toCelsius(kelvin){\n  const celsius = (kelvin - 273.15);\n\
    \  return Math.round(celsius * 100) / 100;\n}\n\nfunction toChangeAction(temperature){\n\
    \  return {\n    type : 'CHANGE_TEMPERATURE',\n    temperature\n  }\n}\n\nfunction\
    \ logIdentity(value){}\n\nPromise.resolve(280)\n  .then(logIdentity)\n  .then(toCelsius)\n\
    \  .then(logIdentity)\n  .then(toChangeAction)\n  .then(logIdentity);\n\n//280\n\
    //6.85\n//{ type: 'CHANGE_TEMPERATURE', temperature: 6.85 }\n```\n\n`toCelsius`\
    \ 接收 280 开尔文的温度作为输入，返回 6.85。`toChangeAction` 接收 6.85 摄氏度的温度作为输入，返回一个包含新摄氏温度值的\
    \ action 对象。\n\n## 异步操作\n\n到目前为止编写的代码都是同步的。这意味着我们立即得到了函数执行的结果。考虑以下代码。\n\n```javascript\n\
    const result = Math.pow(2, 3);\nconsole.log(result);\n//8\n```\n\n一旦我们执行 `Math.pow`，我们就得到了结果。现在思考一下，调用\
    \ Web API 并将返回的数据存入变量意味着什么。\n\n```javascript\nconst result = fetch('/todos')\n\
    ```\n\n为了将 Web API 返回的数据存入 `result` 变量，我们需要等待 `fetch` 调用完成。等待意味着阻塞 UI，这是我们不希望看到的。Promise\
    \ 为这种情况提供了解决方案。`fetch` 调用不直接返回结果，而是返回一个 Promise，该 Promise 会在结果可用时提供对结果的访问。\n\n\
    ## Parcel\n\n我们可以通过启动开发服务器来测试网络请求。我们可以使用 [Parcel](https://parceljs.org/getting_started.html)\
    \ Web 应用来创建一个，它无需任何配置。\n\n首先，安装 Parcel。\n\n```\nnpm install parcel-bundler --save-dev\n\
    ```\n\n接下来，创建一个 `index.html` 文件，并引用你想要检查的 JS 文件。\n\n```html\n<html>\n<body>\n\
    <script src=\"./ajax.js\"></script>\n</body>\n</html>\n```\n\n然后，在 `package.json`\
    \ 中添加开发任务脚本。\n\n```json\n{\n  \"scripts\": {\n    \"dev\": \"parcel index.html\"\
    \n  }\n}\n```\n\n现在，你可以启动开发服务器并访问 `index.html` 页面。\n\n## Fetch\n\n[Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API)\
    \ 提供了获取资源的接口。`fetch` 函数接收一个 URL 作为输入，并返回一个 Promise，该 Promise 会解析为请求的 Response。如果请求失败，它也会失败。\n\
    \n下面是一个发起 fetch 调用并在返回的 Promise 中访问结果的示例。\n\n```javascript\nfunction toJson(response){\n\
    \  return response.json();\n}\n\nfunction logIdentity(value){}\n\nfunction logError(error){\n\
    \  console.error(error);\n}\n\nfetch('https://api.github.com/gists/public')\n\
    \  .then(toJson)\n  .then(logIdentity)\n  .catch(logError);\n```\n\n`json()` 方法将响应转换为\
    \ JavaScript 对象。它返回一个 Promise，该 Promise 包装了将响应体文本解析为 JSON 的结果。\n\n## Promise.race\n\
    \n[Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)\
    \ 接收一个 Promise 数组，并返回第一个兑现或拒绝的 Promise。\n\n```javascript\nconst dictionariesPromise\
    \ = fetch('/dictionaries').then(toJson);\nconst todosPromise = fetch('/todos').then(toJson);\n\
    \nPromise.race([\n  dictionariesPromise,\n  todosPromise\n]).then(logIdentity);\n\
    ```\n\n## Promise.all\n\n[Promise.all](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all)\
    \ 接收一个 Promise 数组，并返回一个新的 Promise，该 Promise 在所有输入的 Promise 都兑现时兑现。如果其中一个输入的 Promise\
    \ 被拒绝，它会立即拒绝。`Promise.all` 可用于确保所有输入的 Promise 都已成功完成。\n\n```javascript\nPromise.all([\n\
    \  dictionariesPromise,\n  todosPromise\n]).then(logIdentity);\n```\n\n## Promise.allSettled\n\
    \n[Promise.allSettled](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/allSettled)\
    \ 接收一个 Promise 数组，并返回一个 Promise，该 Promise 在所有输入的 Promise 要么兑现要么拒绝后兑现。它会兑现为一个描述每个\
    \ Promise 结果的对象数组。\n\n```javascript\nconst dictionariesPromise = fetch('/dictionaries').then(toJson);\n\
    const todosPromise = fetch('/todos').then(toJson);\nconst rejectedPromise = Promise.reject('Error');\n\
    \nPromise.allSettled([\n  dictionariesPromise,\n  todosPromise,\n  rejectedPromise\n\
    ])\n.then(logIdentity)\n\n//[\n//{status: \"fulfilled\", value: Array(1)},\n//{status:\
    \ \"fulfilled\", value: Array(1)},\n//{status: \"rejected\", reason: \"Error\"\
    }\n//]\n```\n\n## 函子定律\n\n当转换函数返回一个非 Promise 的对象时，Promise 上的 `then` 方法充当映射的作用。恒等律得到遵守。\n\
    \n```javascript\nfunction identity(n){\n  return n;\n}\n\nPromise.resolve(1)\n\
    \  .then(identity)\n//Promise 1\n```\n\n当映射函数不返回 Promise 时，组合律得到遵守。在这种情况下，`promise.then(f).then(g)`\
    \ 与 `promise.then(x => g(f(x)))` 的结果相同。\n\n```javascript\nfunction f(x){\n  return\
    \ x + 1;\n}\n\nfunction g(x){\n  return x * 2;\n}\n\nfunction logIdentity(value){}\n\
    \nPromise.resolve(1)\n  .then(f)\n  .then(g)\n  .then(logIdentity)\n\nPromise.resolve(1)\n\
    \  .then(x => g(f(x)))\n  .then(logIdentity)\n```\n\n当一个转换函数返回 Promise 而另一个不返回时，函子组合律被破坏。示例如下。\n\
    \n```javascript\nfunction f(x){\n  return Promise.resolve(x + 1);\n}\n\nfunction\
    \ g(x){\n  return x * 2;\n}\n\nPromise.resolve(1)\n  .then(f)\n  .then(g)\n  .then(logIdentity);\n\
    //4\n\nPromise.resolve(1)\n  .then(x => g(f(x)))\n  .then(logIdentity);\n//NaN\n\
    ```\n\n在这种情况下，Promise 不能作为函子工作，因为它不遵守组合律。在实际应用中，我们不应该将 `promise.then(f).then(g)`\
    \ 重构为 `promise.then(x => g(f(x)))`。\n\n"
- fmt: "\n`.then(x => g(f(x))`\n\n## Monad Laws\n\nThe `then` method on a promise\
    \ acts like `flatMap` when the transformation function returns a promise. Calling\
    \ `then` with a transformation function creating a promise, returns a new promise\
    \ wrapping a value. It does not return a promise, containing a promise, wrapping\
    \ a value. Promises behave like monads when working only with mapping functions\
    \ that return promises.\n\nThe left identity is respected.\n\n```\nfunction f(x){\n\
    \  return Promise.resolve(x + 1);\n}\n\nPromise.resolve(1)\n  .then(f)\n  //Promise\
    \ 2\n\nf(1)\n  //Promise 2\n```\n\nThe right identity is also confirmed.\n\n```\n\
    function unit(value){\n  return Promise.resolve(value)\n}\n\nPromise.resolve(1)\n\
    \  .then(unit)\n  //Promise 1\n```\n\n`promise.flatMap(f).flatMap(g)` gives the\
    \ same result as `promise.flatMap(x => f(x).flatMap(g))`.\n\n```\nfunction g(x){\n\
    \  return Promise.resolve(x * 2);\n}\n\nfunction logIdentity(value){}\n\nPromise.resolve(1)\n\
    \  .then(f)\n  .then(g)\n  .then(logIdentity);\n\nPromise.resolve(1)\n  .then(x\
    \ => f(x).then(g))\n  .then(logIdentity);\n```\n\nSumming-up, when both mapping\
    \ functions return a value that is not a promise, `then` acts as `map` and composition\
    \ is respected. When both mapping functions return a promise, `then` acts as `flatMap`\
    \ and associativity is respected.\n\n## Recap\n\nPromises are objects wrapping\
    \ a future result. When the transformation function returns a value, `then` acts\
    \ as a `map` operation. When it returns another promise, `then` acts like a `flatMap`\
    \ operation. Strictly speaking promises are not monads but they behave similarly\
    \ to monads in many situations.\n\n# Chapter 15: Observables\n\nAn observable\
    \ is a stream of data that can arrive over time. Observables are objects emitting\
    \ values to listeners as these values become available. Observables [may become\
    \ part of the JavaScript](https://github.com/tc39/proposal-observable) language\
    \ in the future, but for the time being, we are going to use the implementation\
    \ of observables from the [RxJS](https://www.npmjs.com/package/rxjs) library.\n\
    \n```\nnpm install rxjs --save\n```\n\nOperators are a powerful feature available\
    \ on observables.\n\n## Creation Operators\n\nCreation operators are functions\
    \ used to construct new observables. Observables are commonly created using creation\
    \ functions, like `of`, `from`, `interval` or `ajax`.\n\n### `create()`\n\nThe\
    \ following example creates an observable that emits the values `1`, `2`, `3`\
    \ to subscribers and then completes.\n\n```\nimport { Observable } from 'rxjs';\n\
    \nconst observable = Observable.create(observer => {\n  observer.next(1);\n  observer.next(2);\n\
    \  observer.next(3);\n  observer.complete();\n});\n```\n\nThe `create` operator\
    \ takes a callback function defining how to emit values. There are three methods\
    \ describing what an observable can do.\n\n* `next()` sends a value to listeners.\n\
    * `error()` sends an error to listeners.\n* `complete()` marks the end of the\
    \ sequence of values. After calling `complete`, further calls to `next()` have\
    \ no effect.\n\n`next` defines the actual data being delivered to a subscriber.\
    \ The data flow may either complete with success using `complete` or fail marked\
    \ using `error`.\n\nWe can listen to the observable source using the `subscribe`\
    \ method.\n\n```\nobservable\n  .subscribe(console.log);\n//1\n//2\n//3\n```\n\
    \nIf we subscribe again later to the source of data we receive again all the emitted\
    \ values.\n\n```\nsetTimeout(()=>{\n  observable.subscribe(console.log);\n  //1\n\
    \  //2\n  //3\n}, 3000);\n```\n\n### `of()`\n\n`of` creates observables from a\
    \ set of values. Here is an example of an observable that emits `1`, `2`, `3`\
    \ in order.\n\n```\nimport { of } from 'rxjs';\n\nconst source = of(1, 2, 3);\n\
    source\n  .subscribe(console.log);\n// 1\n// 2\n// 3\n```\n\n### `from()`\n\n\
    `from` can create observables from an array-like object, a promise, or an observable-like\
    \ object. Here is an example of building an observable from an array.\n\n```\n\
    import { from } from 'rxjs';\n\nconst observable = from([1, 2, 3]);\nobservable.subscribe(console.log);\n\
    // 1\n// 2\n// 3\n```\n\n### `interval()`\n\nThe `interval` function takes the\
    \ `n` number of milliseconds as input and returns an observable emitting a new\
    \ integer in order every `n` milliseconds.\n\n```\nimport { interval } from 'rxjs';\n\
    \nconst observable = interval(1000);\nobservable.subscribe(console.log);\n//0\
    \ -> after 1s\n//1 -> after 2s\n//2 -> after 3s\n//3 -> after 4s\n//4 -> after\
    \ 5s\n//5 -> after 6s\n```\n\n### `ajax()`\n\n`ajax` creates an observable getting\
    \ the result from a network request. It takes as input either a request object\
    \ with the URL, method, data, etc, or a just an URL string. Here is an example.\n\
    \n```\nimport { ajax } from 'rxjs/ajax';\n\najax('https://api.github.com/gists/public')\n\
    \  .subscribe(console.log);\n```\n\nThe observable stream created with the `ajax`\
    \ function emits the response object returned from the request. Below the same\
    \ request is done with the `ajax.getJSON` function creating an observable that\
    \ emits only the JSON key of the response object returned from the request.\n\n\
    ```\najax.getJSON('https://api.github.com/gists/public')\n  .subscribe(console.log);\n\
    ```\n\n## Pipeable Operators\n\nObservables have the `pipe` method that allows\
    \ pipelining multiple operators. Pipeable operators are those operators that can\
    \ be piped to observables using the `pipe` syntax. These include operators like\
    \ `filter`, `map`, or `take`. A pipeable operator is a function that takes an\
    \ observable as input and returns another observable. Subscribing to the output\
    \ observable will also subscribe to the input observable. Operators transform\
    \ the values from the stream of data. They return an observable of the transformed\
    \ values.\n\n`map` transforms values from an observable source using a mapping\
    \ function.\n\n```\nimport { of } from 'rxjs';\nimport { map } from 'rxjs/operators';\n\
    \nconst dataSource = of(1, 2, 3);\nfunction double(n){\n  return n * 2;\n}\ndataSource\n\
    \  .pipe(\n    map(double)\n  )\n  .subscribe(console.log);\n//2\n//4\n//6\n```\n\
    \n`filter` filters the stream values using a predicate function.\n\n```\nimport\
    \ { of } from 'rxjs';\nimport { map, filter } from 'rxjs/operators';\n\nconst\
    \ dataSource = of(1, 2, 3, 4, 5);\nfunction isEven(n){\n  return n % 2 === 0;\n\
    }\ndataSource\n  .pipe(\n    filter(isEven)\n  )\n  .subscribe(console.log);\n\
    //2\n//4\n```\n\nThe `take` operator allows selecting only the first `n` emitted\
    \ values from an observable source. Below is an example of selecting the first\
    \ three values from the source.\n\n```\nimport { of } from 'rxjs';\nimport { take\
    \ } from 'rxjs/operators';\n\nconst source = of(1, 2, 3, 4, 5);\nsource\n  .pipe(\n\
    \    take(3)\n  )\n  .subscribe(console.log);\n//1\n//2\n//3\n```\n\nThe `pipe`\
    \ method creates a pipeline on the observable source. It allows us to pass the\
    \ data through a pipeline of operators transforming it.\n\n```\nimport { of }\
    \ from 'rxjs';\nimport { map, filter } from 'rxjs/operators';\n\nconst dataSource\
    \ = of(1, 2, 3, 4, 5);\nfunction isEven(n){\n  return n % 2 === 0;\n}\nfunction\
    \ double(n){\n  return n * 2;\n}\ndataSource\n  .pipe(\n    filter(isEven),\n\
    \    map(double)\n  )\n  .subscribe(console.log);\n//4\n//8\n```\n\n## Observers\n\
    \nObservers are objects having three callbacks, one for each type of notification\
    \ delivered by the observable. Observers are the consumer of values delivered\
    \ by observables. Here is a simple observer object handling all types of notifications.\n\
    \n```\nconst observer = {\n  next(value){\n    console.log(`Next: ${value}`)\n\
    \  },\n  error(msg){\n    console.error(`Error: ${msg}`)\n  },\n  complete(value){\n\
    \    console.error(`Complete`)\n  }\n};\n```\n\nThe observer is used as an argument\
    \ to the `subscribe` method of an observable.\n\n```\nconst observable = Observable.create(observer\
    \ => {\n  observer.next(1);\n  observer.next(2);\n  observer.complete('Done');\n\
    });\n\nobservable.subscribe(observer);\n//Next: 1\n//Next: 2\n//Complete\n```\n\
    \nBelow is an example of subscribing to an observable that emits two values and\
    \ then fails.\n\n```\nconst observable = Observable.create(observer => {\n  observer.next(1);\n\
    \  observer.next(2);\n  observer.error('Failed');\n});\n\nobservable.subscribe(observer);\n\
    //Next: 1\n//Next: 2\n```\n"
