    to a new folder and create the Elm project by running:elm initThe command creates
    an elm.json file and a src folder for all Elm files.elm reactor opens the development
    server. It starts a server at http://localhost:8000 . From there we can navigate
    to any Elm file.Elm ArchitectureThe Elm Architecture defines the data flow inside
    an Elm application. It breaks the application into the following core parts:


    *   Model — defines all the state of the application.


    *   View — is a pure function that transforms the state data into HTML. The HTML
    sends back messages.


    *   Messages — expresses the user interaction.


    *   Update — is a pure function returning a new state based on the current message
    and the actual state.


    ![](Image00012.jpg)In the next examples, we are going to use this architectural
    pattern to create a few functionalities.Counter with ElmLet’s implement a simple
    counter page and discuss the Elm Architecture.ModelThe model stores all the application
    data that can change. In our case, we just need to store a number to reflect the
    current count.The initial value of this counter is 0 .type alias Model = {


    number : Int


    }


    initialModel : Model


    initialModel = { number = 0 }MessagesMessages define user interaction. The user
    can increase or decrease the count so we need two messages to express those actions.type
    Msg = Increment | DecrementView FunctionThe view function takes in the Model as
    an argument and displays it on the screen. The view function creates the HTML.The
    HTML contains a decrement button that generates the Decrement message, and an
    increment button that generates the Increment message and the current count. The
    count number is read from the model, converted to a string, and then rendered
    as text inside a div element.Messages are generated by handling the onClick event
    for each button.view : Model -> Html Msg


    view model =


    div []


    [


    div [] [ text (String.fromInt model.number) ]


    , button [ onClick Decrement ] [ text "-" ]


    , button [ onClick Increment ] [ text "+" ]


    ]Update FunctionThe update function describes how to change the model when receiving
    a new message.When it gets the Increment message, it returns a new model with
    the number incremented. When it gets the Decrement message, it returns a new model
    with the number decremented.update : Msg -> Model -> Model


    update msg model =


    case msg of


    Increment ->


    { model | number = model.number + 1 }


    Decrement ->


    { model | number = model.number - 1 }The initial number is zero and it increases
    and decreases when the user presses different buttons.Wiring-UpThe main value
    describes what it is shown on the screen. It needs the initial model, the view
    function to generate the HTML, and update function to change the model.import
    Browser


    import Html exposing (Html, button, div, text)


    import Html.Events exposing (onClick)


    //Code


    main =


    Browser.sandbox {


    init = initialModel,


    update = update,


    view = view


    }The view function takes the initial model and displays on the screen. The user
    actions generate messages. The update handles those action and updates the model.
    When the model is changed the view function is called to render the new model
    on screen. This flow repeats endlessly.Counter with React and ReduxNow let’s implement
    the same counter page in JavaScript with React and Redux.ModelThe model defines
    all the application data. We can define the counter as the number property on
    the application state object.const initialModel = {


    number: 0


    };MessagesThe two messages for increasing and decreasing the count can be expressed
    as functions creating plain data object having the type property.function Increment(){


    return {


    type : Increment.name


    }


    }


    function Decrement(){


    return {


    type : Decrement.name


    }


    }


    export { Increment, Decrement };View FunctionThe view function can be implemented
    using [React functional components](https://reactjs.org/docs/components-and-props.html)
    . These components return an HTML-like syntax called [JSX](https://reactjs.org/docs/introducing-jsx.html)
    .import React from ''react'';


    import { connect } from ''react-redux'';


    import { Increment, Decrement } from ''./store'';


    function Counter({number, Increment, Decrement}){


    return(


    <div>


    <div>{number}</div>


    <button


    type="button"


    onClick={Decrement}>-</button>


    <button


    type="button"


    onClick={Increment}>+</button>


    </div>


    )


    }


    export default connect(


    state => state,


    {Increment, Decrement}


    )(Counter);Update FunctionThe update function takes the current model and message
    and returns the new model.function reducer(model = initialModel, action){


    switch(action.type){


    case Increment.name:


    return { ...model, number: model.number + 1 };


    case Decrement.name:


    return { ...model, number: model.number - 1 };


    default:


    return model;


    }


    }


    export { reducer };Wiring-UpWe can wire up all these in the application entry
    point file index.js . Here we specify the initial state, the view, and the update
    functions.import React from ''react'';


    import ReactDOM from ''react-dom'';


    import { createStore } from ''redux'';


    import { Provider } from ''react-redux'';


    import Counter from ''./Counter'';


    import { reducer } from ''./store'';


    const store = createStore(reducer);


    ReactDOM.render(


    <React.StrictMode>


    <Provider store={store}>


    <Counter />


    </Provider>


    </React.StrictMode>,


    document.getElementById(''root'')


    );Random Number with ElmNext, we will create another page that displays a random
    number. This may look simpler than previous functionality but it is actually harder
    to do because generating random numbers cannot be done with a pure function.Pure
    functions are deterministic functions. Called with the same input they always
    return the same output. Elm is a purely functional language. That means it allows
    us to write only pure functions. How is possible then to generate random numbers
    and write only pure functions?Let’s find out.ModelAgain we need a model to store
    our application data that can change. The model contains just a number.type alias
    Model = {


    number : Int


    }


    initModel : () -> (Model, Cmd Msg)


    initModel _ =


    ( Model 0


    , Cmd.none


    )MessagesThe user can press the generate button so we need a message to express
    that interaction, GenerateNumber .type Msg = GenerateNumberViewThe view function
    takes the model and renders the UI. It displays the current number stored in the
    model inside a div element. It also shows the button for generating a new number.
    When the button is pressed the GenerateNumber message is created.view : Model
