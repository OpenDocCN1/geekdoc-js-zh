  trans: "\n\n`//Maximum call stack size exceeded`递归可能导致“Maximum call stack size exceeded”错误信息。JavaScript\
    \ 为每个函数调用保留一个调用栈，这是一块固定大小的内存，用于存储调用的相关信息。信息以栈的方式（后进先出）添加到调用栈中。每次递归调用都会向调用栈添加一个新的栈帧。如果递归调用创建了过多的栈帧，就会抛出栈溢出错误。尾递归函数不应为每个函数调用创建新的栈帧，而应使用单个栈帧。理论上，任何循环都可以用递归实现。但由于缺少尾调用优化的实现，用递归替换所有类型的循环并不实际。在撰写本文时，循环的尾递归实现可能会带来性能损失，或导致栈溢出错误。\n\
    \n## 蹦床（Trampoline）\n\n蹦床是一种技术，允许我们在没有尾调用优化的语言中使用尾递归函数。首先，需要将原始的尾调用函数重写为返回 thunk\
    \ 而不是实际值。在我们的示例中，这意味着不直接返回 `sumAll(n, i + 1, i + result)` 的结果，而是返回一个返回该结果的无参函数。\n\
    \n```\nfunction sumAll(n, i = 0, result = 0) {\n\nreturn (i > n) \n\n? () => result\n\
    \n: () => sumAll(n, i + 1, i + result);\n\n}\n```\n\n[thunk](https://en.wikipedia.org/wiki/Thunk_(functional_programming))\
    \ 是一个不接受参数的函数，它调用另一个函数并传入所有必要参数，然后返回结果。例如，以下函数就是一个 thunk。\n\n```\nconst sum100Thunk\
    \ = () => sumAll(100);\n```\n\n`sum100Thunk` 函数不接受参数，并返回以特定参数调用 `sumAll` 的结果。将原始函数转换为返回\
    \ thunk 后，我们需要一个 `trampoline` 工具函数，它以迭代方式循环并调用 thunk 函数。只要 thunk 返回其他 thunk 函数，循环就会继续。\n\
    \n```\nfunction trampoline(f) {\n\nreturn function(...args){\n\nlet result = f(...args);\n\
    \nwhile (typeof(result) === 'function'){\n\nresult = result();\n\n}\n\nreturn\
    \ result;\n\n}\n\n}\n\nconst _sumAll = trampoline(sumAll);\n\nconsole.log(_sumAll(10000));\n\
    \n//50005000\n```\n\n蹦床技术解决了一个本不应存在的问题，并且它本身也带来了额外的开销。它本质上允许我们将递归函数转换为迭代循环。\n\n\
    ## 遍历树\n\n递归可用于实现某些更容易用此方式解决的特定算法。在下一个示例中，递归用于遍历树并创建一个包含顶层选中节点值的数组。我们首先定义树，从包含其他节点对象的根节点对象开始。每个节点都有\
    \ `value` 和 `checked` 属性。\n\n```\nconst tree = {\n\nvalue: 0,\n\nchecked: false,\n\
    \nchildren: [{\n\nvalue: 1,\n\nchecked: true,\n\nchildren: [{\n\nvalue: 11,\n\n\
    checked: true,\n\nchildren: null\n\n}]\n\n}, {\n\nvalue: 2,\n\nchecked: false,\n\
    \nchildren: [{\n\nvalue: 22,\n\nchecked: true,\n\nchildren: null\n\n},{\n\nvalue:\
    \ 23,\n\nchecked: true,\n\nchildren: null\n\n}]\n\n}]\n\n}\n```\n\n以下是该树的直观表示。\n\
    \n![](img/Image00006.jpg)\n\n我们希望获取顶层选中节点的值。这意味着我们不需要树中所有被选中的值。如果父节点已被选中，则无需获取其子节点的选中值。\n\
    \n```\nfunction toChildTopSelection(selection, childNode){\n\nreturn selection.concat(getTopSelection(childNode));\n\
    \n}\n\nfunction getTopSelection(node){\n\nreturn node.checked\n\n?   [node.value]\n\
    \n:   node.children !== null\n\n? node.children.reduce(toChildTopSelection, [])\n\
    \n: []\n\n}\n\ngetTopSelection(tree);\n\n//[1, 22, 23]\n```\n\n`getTopSelection`\
    \ 接收一个树对象，并返回一个包含顶层选中值的数组。如果节点被选中，则返回该节点的值作为单元素数组。当节点未被选中且有子节点时，它返回这些子节点的顶层选中值。`getTopSelection`\
    \ 会为树中的每个子节点调用，直到递归在选中的节点处停止。找到被选中的节点就是终止条件。对于已选中节点的子节点，不会调用 `getTopSelection`。\n\
    \n## 回顾\n\n递归函数是一种在满足条件之前不断调用自身的函数。递归为某些问题（如遍历树）提供了更简单的解决方案。任何迭代循环都可以用递归实现，但在主流浏览器支持尾调用优化之前，这并不实用。\n\
    \n# 第 08 章：管道与柯里化\n\n管道是函数式编程的典型用例。柯里化常用于创建管道，因为定义转换流程的函数期望接收一个参数。\n\n## 管道\n\n\
    管道是一系列数据转换，其中一个转换的输出是下一个转换的输入。管道使我们能够以更具表现力的方式编写数据转换。考虑以下代码：\n\n```\nfunction\
    \ capitalize(text) {\n\nreturn text.charAt(0).toUpperCase() + text.slice(1);\n\
    \n}\n\nfunction shortenText(text) {\n\nreturn text.substring(0, 8).trim();\n\n\
    }\n\nconst shortText =\n\nshortenText(capitalize(\"this is a long text\"));\n\n\
    console.log(shortText);\n\n//\"This is\"\n```\n\n我们可以使用函数式库（如 [lodash](https://lodash.com/)\
    \ 或 [ramda](https://ramdajs.com/) ）中的 `pipe` 工具，以更具表现力的方式编写这些转换。`npm i lodash\
    \ --save`\n\n以下是在管道中这些转换的样子。\n\n```\nimport { pipe } from 'lodash/fp';\n\nconst\
    \ shortText = pipe(\n\ncapitalize,\n\nshortenText\n\n)(\"this is a long text\"\
    );\n\nconsole.log(shortText);\n\n//\"This is\"\n```\n\n初始文本是管道的输入。`capitalize`\
    \ 是第一个处理文本的函数。然后该转换的输出作为下一个函数 `shortenText` 的输入。接着管道结束，我们得到结果。\n\n![](img/Image00007.jpg)\n\
    \n## 链式调用\n\n链式调用是定义管道的一种更常见的形式。它需要操作一个对象。考虑以下债务列表。\n\n```\nconst debts = [\n\n\
    {\n\ncontractNo : 1,\n\ndaysSinceLastPayment: 91,\n\ncurrency : 'EUR'\n\n},\n\n\
    {\n\ncontractNo : 2,\n\ndaysSinceLastPayment: 35,\n\ncurrency : 'USD'\n\n},\n\n\
    {\n\ncontractNo : 3,\n\ndaysSinceLastPayment: 45,\n\ncurrency : 'USD'\n\n}   \n\
    \n];\n```\n\n以下是如何使用链式调用定义转换管道。\n\n```\nconst newDebts = debts\n\n.filter(isEur)\n\
    \n.map(toDebtView);\n\nfunction isEur(debt){\n\nreturn debt.currency === \"EUR\"\
    ;\n\n}\n\nfunction toDebtView(debt){\n\nreturn {\n\n...debt,\n\npriority : getPriority(debt)\n\
    \n}\n\n}\n\nfunction getPriority(debt){\n\nconst days = debt.daysSinceLastPayment;\n\
    \nreturn days > 90\n\n? 1\n\n: days > 60\n\n? 2\n\n: 3;\n\n}\n```\n\n首先，使用 `isEur`\
    \ 谓词函数过滤债务列表。然后，使用 `toDebtView` 映射函数转换此操作的结果。\n\n![](img/Image00008.jpg)\n\n##\
    \ 恒等函数\n\n恒等函数是一个一元函数，它返回作为参数传入的值。在数学中，它定义为 f(x) = x。\n\n```\nfunction identity(value){\n\
    \nreturn value;\n\n}\n```\n\n如果我们将此转换放入之前的管道中，它只会创建数组的一个副本。`logIdentity` 函数提供了一种在不影响流程的情况下检查管道中数据的方法。它返回接收到的参数，同时将其记录到控制台。\n\
    \n```\nfunction logIdentity(value){\n\nconsole.log(value);\n\nreturn value;\n\n\
    }\n\ndebts\n\n.filter(isEur)\n\n.map(logIdentity)\n\n.map(toDebtView)\n\n.map(logIdentity);\n\
    ```\n\n## 柯里化\n\n柯里化是一种技术，用于将期望 n 个参数的函数转换为一系列 n 个函数，每个函数期望一个参数。考虑过滤单词列表的情况。\n\
    \n```\nconst words = [\n\n'ability',\n\n'calculate',\n\n'calendar',\n\n'double',\n\
    \n'door'\n\n];\n\nfunction startsWith(word, term){\n\nreturn word.startsWith(term);\n\
    \n}\n\nwords\n\n.filter(w => startsWith(w, 'a'))\n\n.forEach(console.log);\n```\n\
    \n现在，看看使用柯里化重构后的相同代码。\n\n```\nfunction startsWith(term){\n\nreturn function(word){\n\
    \nreturn word.startsWith(term);\n\n}\n\n}\n\nwords\n```\n\n"
- fmt: "\n```\n.filter(startsWith('a'))\n.forEach(console.log);\n```\n\n`startsWith`\
    \ is a curried function. Instead of taking two parameters, it takes only one and\
    \ returns a function accepting the second parameter. Notice also that the curried\
    \ version has the parameters in the reverse order compared to the initial version\
    \ taking two parameters. You may find it clearer when the curried version is written\
    \ using the arrow syntax.\n\n```\nconst startsWith = term => word => {\n  return\
    \ word.startsWith(term);\n}\n```\n\nAnother option is to create the curried version\
    \ of a function using an auto-curry utility function. Here is an example using\
    \ the `curry` utility from [lodash](https://lodash.com/).\n\n```\nimport { curry\
    \ } from 'lodash/fp';\n\nconst startsWith = curry(function(term, word) {\n  return\
    \ word.startsWith(term);\n});\n```\n\n## Reduce Pipeline\n\nThe `reduce` method\
    \ uses also a pipeline. Let’s look again at the code and analyze the data flow.\n\
    \n```\nconst numbers = [1, 3, 5];\n\nfunction add(total, n) {\n  return total\
    \ + n;\n}\n\nconst total = numbers.reduce(add, 0);\n\nconsole.log(total);\n//9\n\
    ```\n\nAt each step, the reducer takes as input the result of the previous reducer\
    \ call as the aggregation value. Here is the pipeline.\n\n![](Image00009.jpg)\n\
    \nThe aggregation value at the first step is 0. After invoking the reducer the\
    \ output of this transformation 1 goes as input to the next reducer call. Again\
    \ after invoking the reducer, the output 4 goes as input to the next reducer call\
    \ and so on. `reduce` creates a pipeline where at each step we get as input the\
    \ result of the previous reducer call and the current element.\n\n## Recap\n\n\
    A pipeline defines a series of data transformations where the output of one transformation\
    \ function is the input for the next one. Currying is a technique for breaking\
    \ down a function that takes multiple arguments into a series of functions each\
    \ taking only one argument.\n\n# Chapter 09: Functors\n\nNext, we are going to\
    \ explore functors. Let’s start with a set of data transformations. Consider the\
    \ next example:\n\n```\nfunction toCelsius(kelvin){\n  const celsius = (kelvin\
    \ - 273.15);\n  return Math.round(celsius * 100) / 100;\n}\n\nfunction describeTemperature(temperature){\n\
    \  return temperature < 0\n    ? \"Freezing\"\n    : temperature < 15\n    ? \"\
    Cold\"\n    : temperature < 28\n    ? \"Warm\"\n    : \"Hot\";\n}\n\nconst kelvin\
    \ = 300;\nconst celsius = toCelsius(kelvin);\nconst description = describeTemperature(celsius);\n\
    \nconsole.log(celsius);\n//26.85\nconsole.log(description)\n//\"Warm\"\n```\n\n\
    As you can see, the point of this piece of code is to apply two changes to a single\
    \ value. It starts with the Kelvin temperature and applies the `toCelsius` transformation,\
    \ then on the result, it applies the `describeTemperature` function. It will be\
    \ nicer to be able to chain these transformations on the initial value and create\
    \ a pipeline. Here is how it may look like:\n\n```\nMappable(300)\n  .map(toCelsius)\n\
    \  .map(describeTemperature)\n```\n\nThis is the kind of situation where functors\
    \ are helpful.\n\n## Functors\n\nA functor is an object with a `map` operation\
    \ that satisfies the functor’s laws. We can simply create a functor as an object\
    \ with a `map` method. Consider the following function:\n\n```\nfunction F(value){\n\
    \  function map(f){\n    const newValue = f(value);\n    return F(newValue);\n\
    \  }\n  return {\n    map\n  }\n}\n```\n\n`F` creates an object with the `map`\
    \ method wrapping a value. `map` takes a transformation function, applies it to\
    \ the wrapped value, and returns a new object wrapping the new value. `F` is called\
    \ a factory function. `F` returns an object containing a closure, `map`, accessing\
    \ the `value` variable from its parent. The `F` factory function creates a functor.\n\
    \n### Functor Laws\n\nFunctors must respect identity and composition laws.\n\n\
    #### Identity Law\n\nPassing the identity function into the `map` operation of\
    \ a functor should result in the same functor, meaning a functor storing the same\
    \ value. Consider the identity function.\n\n```\nfunction identity(n){\n  return\
    \ n;\n}\n\nfunctor.map(identiy) = functor\n```\n\nLet’s verify the identity law\
    \ on our functor.\n\n```\nconst functor = F(1);\nconst newFunctor = functor.map(identity);\n\
    //F(1)\n```\n\n#### Composition Law\n\nFunction composition is an operation that\
    \ takes two functions `f` and `g` and produces a new function `h` where `h(x)\
    \ = g(f(x))`. In this operation, the function `g` is applied to the result of\
    \ applying the function `f` to `x`. We can say that function composition is the\
    \ operation of applying a function to the result of another function. Functors\
    \ must respect the composition law, meaning that:\n\n```\nfunctor.map(f).map(g)\
    \ === functor.map(x => g(f(x)))\n```\n\nLet’s verify the composition law.\n\n\
    ```\nfunction increment(n){\n  return n + 1;\n}\n\nfunction double(n){\n  return\
    \ n * 2\n}\n\nF(1)\n  .map(increment)\n  .map(double)\n//F(4)\n\nF(1)\n  .map(n\
    \ => double(increment(n)))\n//F(4)\n```\n\n### Category Theory\n\nA category is\
    \ a collection of values that are linked by arrows. A [category](https://en.wikipedia.org/wiki/Category_(mathematics))\
    \ has two main properties, the ability to [compose](https://en.wikipedia.org/wiki/Function_composition)\
    \ the arrows [associatively](https://en.wikipedia.org/wiki/Associativity), and\
    \ the existence of an [identity](https://en.wikipedia.org/wiki/Identity_function)\
    \ arrow for each value. The arrows, also known as morphisms, are functions mapping\
    \ between the values in the category. Here is a representation of a category with\
    \ three values.\n\n![](Image00010.jpg)\n\nThe category in this example has three\
    \ values: 1, 2, 3, and three functions mapping between these values. The `f` function\
    \ maps 1 to 2. The `g` function maps 2 to 3. The function `h` mapping from 1 to\
    \ 3 is equal to `g(f(1))`. For each value applying the identity function results\
    \ in the same value.\n\n## Functors in Practice\n\nIn practice, functors are helpful\
    \ at chaining operations. What is important for us from the development perspective\
    \ is to know when something is a functor. If it is, we can inspect its value with\
    \ the identity function and we use function composition. The functor we have created\
    \ is called the identity functor. Take into consideration our initial set of data\
    \ transformations. Here is how we can chain the two transformations on a value\
    \ using the identity functor.\n\n```\nF(300)\n  .map(toCelsius)\n  .map(describeTemperature)\n\
    ```\n\nWe can inspect the value inside using the impure variation of the identity\
    \ function that logs the value in the console.\n\n```\nfunction logIdentity(value){\n\
    \  console.log(value);\n  return value;\n}\n\nF(300)\n  .map(toCelsius)\n  .map(logIdentity)\
    \ //26.85\n  .map(describeTemperature)\n  .map(logIdentity) //\"Warm\"\n```\n\n\
    We get the same result also when applying function composition.\n\n```\nF(300)\n\
    \  .map(x => describeTemperature(toCelsius(x)))\n  .map(logIdentity)\n//\"Warm\"\
    \n```\n\nBelow is an example of applying function composition using the `compose`\
    \ utility from a functional library like [lodash](https://lodash.com/).\n\n```\n\
    import { compose } from 'lodash/fp'\n\nF(300)\n  .map(compose(describeTemperature,\
    \ toCelsius))\n  .map(logIdentity)\n//\"Warm\"\n```\n\n## Arrays\n\nArrays are\
    \ mappable. The `map` method iterates over the collection and applies the map\
    \ function to each value in the array. Let’s verify the functor laws on the array.\
    \ Applying the identity function on an array creates a copy of it.\n\n```\n[1,\
    \ 2, 3]\n  .map(identity)\n  .map(logIdentity);\n//1\n//2\n//3\n```\n\nNext, check\
    \ the composition law.\n\n```\n[1, 2, 3]\n  .map(increment)\n  .map(double)\n\
    \  .map(logIdentity);\n//4\n//6\n//8\n\n[1, 2, 3]\n  .map(x => double(increment(x)))\n\
    \  .map(logIdentity);\n//4\n//6\n//8\n```\n\nA simple functor wrapping a single\
    \ value can be created on the fly using an array with a one value\n\n```\n[300]\n\
    \  .map(toCelsius)\n  .map(describeTemperature)\n  .map(logIdentity);\n//\"Warm\"\
    \n\n[300]\n  .map(x => describeTemperature(toCelsius(x)))\n  .map(logIdentity);\n\
    ```\n"
