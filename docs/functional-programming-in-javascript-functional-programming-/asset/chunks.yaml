    is added to the call-stack like in any other stack last-in, first-out. Each recursive
    call adds a new stack-frame to the call-stack. If the recursive calls create too
    many stack-frames the stack overflow error is thrown.The tail-recursive functions
    should not create a new stack frame for each function call, but rather use a single
    stack frame.In theory, any loop can be implemented with recursion. Because of
    the missing implementation of the tail-call optimization, it is not practical
    to replace any kind of loop with recursion. At the time of writing, the tail-call
    recursive implementation of a loop may have a performance penalty or may lead
    to stack-overflow error.TrampolineTrampolining is a technique that allows us to
    work with tail-recursive functions in a language that does not have the tail-call
    optimization.First, it requires to rewrite the original tail-call function to
    return thunks instead of returning the actual values. In our example, it means
    that instead of returning the result of sumAll(n, i + 1, i + result) we return
    a nullary function returning that result.function sumAll(n, i = 0, result = 0)
    {


    return (i > n) 


    ? () => result


    : () => sumAll(n, i + 1, i + result);


    }A [thunk](https://en.wikipedia.org/wiki/Thunk_(functional_programming)) is a
    function taking no arguments that invokes another function with all the necessary
    arguments and returns the result.For example, the following function is a thunk.const
    sum100Thunk = () => sumAll(100);The sum100Thunk function takes no arguments and
    returns the result of invoking sumAll with the specific arguments.After converting
    the original function to return thunks we need the trampoline utility function
    that loops in an iterative way and invokes the thunk functions. The loop continues
    as long as the thunks return other thunk functions.function trampoline(f) {


    return function(...args){


    let result = f(...args);


    while (typeof(result) === ''function''){


    result = result();


    }


    return result;


    }


    }


    const _sumAll = trampoline(sumAll);


    console.log(_sumAll(10000));


    //50005000Trampolining is a solution to a problem we should not have and also
    comes with its own overhead. It basically allows us to convert the recursive function
    to an iterative loop.Traversing a TreeRecursion can be used to implement specific
    algorithms that are easier to solve this way.In the next example, recursion is
    used to traverse a tree and create an array with the top selected node values.We
    start by defining the tree, beginning with the root node object containing other
    node objects. Each node has the value and checked properties.const tree = {


    value: 0,


    checked: false,


    children: [{


    value: 1,


    checked: true,


    children: [{


    value: 11,


    checked: true,


    children: null


    }]


    }, {


    value: 2,


    checked: false,


    children: [{


    value: 22,


    checked: true,


    children: null


    },{


    value: 23,


    checked: true,


    children: null


    }]


    }]


    }Here is a visual representation of this tree.![](Image00006.jpg)We want to get
    the values of the top selected nodes. That means we don’t need all the checked
    values from the tree. If the parent node is checked we don’t have to take the
    checked values from its children.function toChildTopSelection(selection, childNode){


    return selection.concat(getTopSelection(childNode));


    }


    function getTopSelection(node){


    return node.checked


    ?   [node.value]


    :   node.children !== null


    ? node.children.reduce(toChildTopSelection, [])


    : []


    }


    getTopSelection(tree);


    //[1, 22, 23]getTopSelection takes a tree object and returns an array with the
    top selected values. If the node is checked it returns the value of that node
    as an array with a single element. When the node is not checked and has child
    nodes it returns the top selection of those child nodes. getTopSelection is called
    for each child node inside the tree until the recursive calls stop at the nodes
    being checked. Finding a node that is checked is the ending condition. getTopSelection
    is not called for the child nodes of a node that is checked.RecapA recursive function
    is a function that calls itself until a condition is met.Recursion offers a simpler
    solution to a set of problems like traversing trees.Any iterative loop can be
    implemented with recursion but this is not practical until the tail-call optimization
    is supported by major browsers.Chapter 08: Pipelines and CurryingPipelines are
    the typical use case for functional programming.Currying is commonly used when
    creating pipelines because the functions defining the flow of transformations
    expect one argument.PipelinesA pipeline is a series of data transformations where
    the output of one transformation is the input of the next one.Pipelines enable
    us to write data transformations in a more expressive way. Consider the next code:function
    capitalize(text) {


    return text.charAt(0).toUpperCase() + text.slice(1);


    }


    function shortenText(text) {


    return text.substring(0, 8).trim();


    }


    const shortText =


    shortenText(capitalize("this is a long text"));


    console.log(shortText);


    //"This is"We can write these transformations in a more expressive way using the
    pipe utility from a functional library like [lodash](https://lodash.com/) or [ramda](https://ramdajs.com/)
    .npm i lodash --saveHere is how the transformations look like in a pipeline.import
    { pipe } from ''lodash/fp'';


    const shortText = pipe(


    capitalize,


    shortenText


    )("this is a long text");


    console.log(shortText);


    //"This is"The initial text is the input in the pipeline. capitalize is the first
    function to process the text. Then the output of this transformation goes as input
    to the next one shortenText . Then the pipeline finishes and we get the result.![](Image00007.jpg)ChainingChaining
    is a more common form of defining a pipeline. It requires to work with an object.Consider
    the following list of debts.const debts = [


    {


    contractNo : 1,


    daysSinceLastPayment: 91,


    currency : ''EUR''


    },


    {


    contractNo : 2,


    daysSinceLastPayment: 35,


    currency : ''USD''


    },


    {


    contractNo : 3,


    daysSinceLastPayment: 45,


    currency : ''USD''


    }  


    ];Here is how we can define a pipeline of transformations using chaining.const
    newDebts = debts


    .filter(isEur)


    .map(toDebtView);


    function isEur(debt){


    return debt.currency === "EUR";


    }


    function toDebtView(debt){


    return {


    ...debt,


    priority : getPriority(debt)


    }


    }


    function getPriority(debt){


    const days = debt.daysSinceLastPayment;


    return days > 90


    ? 1


    : days > 60


    ? 2


    : 3;


    }First, the debt list is filtered using isEur predicate function. Then the result
    of this operation is transformed using the toDebtView mapping function.![](Image00008.jpg)The
    Identity FunctionThe identity function is a unary function that returns the value
    it gets as its argument.In mathematics, it is defined as f(x) = x .function identity(value){


    return value;


    }If we put this transformation in the previous pipeline it will just create a
    copy of the array.The logIdentity function gives a way to inspect the data in
    the pipeline without affecting the flow. It returns the argument it gets but also
    logs it to the console.function logIdentity(value){


    console.log(value);


    return value;


    }


    debts


    .filter(isEur)


    .map(logIdentity)


    .map(toDebtView)


    .map(logIdentity);CurryingCurrying is a technique for changing a function expecting
    n arguments into a series of n functions each expecting one argument.Consider
    the case of filtering a list of words.const words = [


    ''ability'',


    ''calculate'',


    ''calendar'',


    ''double'',


    ''door''


    ];


    function startsWith(word, term){


    return word.startsWith(term);


    }


    words


    .filter(w => startsWith(w, ''a''))


    .forEach(console.log);Now, look at the same code refactored using currying.function
    startsWith(term){


    return function(word){


    return word.startsWith(term);


    }


    }


    words'
