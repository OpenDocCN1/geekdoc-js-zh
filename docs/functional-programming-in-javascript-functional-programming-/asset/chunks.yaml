  trans: "\n\n# 更新\n\n更新函数接收当前消息并生成新模型。更新函数是纯函数，不能生成随机数。相反，它创建一条命令，告诉 Elm 框架生成随机数，然后将结果放入新消息中。我们将这条新消息命名为\
    \ `SetNumber`。此时我们意识到消息可以接受参数，消息可以是函数。\n\n```\ntype Msg = GenerateNumber | SetNumber\
    \ Int\n```\n\n为了使用 `Random.generate` 命令，我们需要安装一个额外的包：`elm install elm/random`\n\
    \n以下是处理两条消息的更新函数。\n\n```\nupdate : Msg -> Model -> (Model, Cmd Msg)\n\nupdate\
    \ msg model =\n  case msg of\n    GenerateNumber ->\n      ( model\n      , Random.generate\
    \ SetNumber (Random.int 1 100)\n      )\n    SetNumber number ->\n      ( Model\
    \ number\n      , Cmd.none\n      )\n```\n\n当更新函数收到 `GenerateNumber` 消息时，它使用 `Random.generate`\
    \ 函数创建一条命令。Elm 框架执行该命令，生成随机数，并构建一条包含该随机数的新消息 `SetNumber`。在这种情况下，更新函数不修改模型，它返回相同的模型。\n\
    \n当更新函数收到带有随机数的 `SetNumber` 消息时，它返回一个包含新生成数字的新模型。在这种情况下，更新函数不生成任何命令，它返回 `Cmd.none`。\n\
    \n正如所见，为了处理不纯逻辑，更新函数为每条消息返回两样东西：新模型和 Elm 框架需要执行的新命令。\n\n以下是在 JavaScript 中编写返回两个值的函数的方法。我们只需返回一个包含这两个值的数组。然后在赋值语句的左侧使用[解构赋值](https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment)语法来解包返回的值。\n\
    \n```\nfunction update(model, action){\n  switch(action.type){\n    case 'GenerateNumber'\
    \ : {\n      const command = {\n        name: 'Random.generate',\n        resultMessage\
    \ : 'SetNumber'\n      };\n      return [model, command];\n    }\n    case 'SetNumber'\
    \ : {\n      const newModel = { ...model, number: action.payload };\n      const\
    \ command = { name: 'Cmd.none' };\n      return [newModel, command];\n    }\n\
    \    default : {\n      const command = { name: 'Cmd.none' };\n      return [model,\
    \ command];\n    }\n  }\n}\n\nconst [model, command] = update({}, 'GenerateNumber');\n\
    console.log(model);\nconsole.log(command);\n//{}\n//{name: \"Cmd.none\"}\n```\n\
    \n注意，命令是一个描述要执行命令的普通对象。另外，请注意我们在 switch 分支内部使用花括号来为每个子句定义块作用域，并允许在不同分支中声明同名变量。\n\
    \n下面是使用命令处理不纯逻辑时的数据流示意图。\n\n![](img/Image00013.jpg)\n\n# 使用 React 和 Redux 生成随机数\n\
    \n现在让我们在 JavaScript 中实现相同的功能。\n\n## 模型\n\n我们首先将模型定义为一个对象，其 number 属性设置为 0。\n\n\
    ```\nconst initialModel = {\n  number: 0\n};\n```\n\n## 命令\n\n这就是我们在生成随机数时遇到问题的地方，同时还要使用纯函数。Redux\
    \ 允许我们定义一个放置此类不纯逻辑的地方，但没有完全避免它的解决方案。\n\n我们将遵循 Redux 模式，将 `GenerateNumber` 定义为一个返回另一个函数的函数。返回的函数称为\
    \ thunk，包含不纯逻辑。这个不纯逻辑的结果将作为参数传递给 `SetNumber` 消息。\n\n```\nfunction GenerateNumber(){\n\
    \  return function(dispatch){\n    const number = Math.floor(Math.random() * 100);\n\
    \    dispatch(SetNumber(number));\n  }\n}\n```\n\n## 消息\n\n`GenerateNumber` 命令需要\
    \ `SetNumber` 消息来发送新生成的数字。\n\n```\nfunction SetNumber(number){\n  return {\n \
    \   type : SetNumber.name,\n    number\n  }\n}\n```\n\n## 视图\n\n视图函数接收模型并为其创建\
    \ HTML。当点击生成按钮时，它会分发 `GenerateNumber` 命令。\n\n```\nimport React from 'react';\n\
    import { connect } from 'react-redux';\nimport { GenerateNumber } from './store';\n\
    \nfunction Counter({number, GenerateNumber}){\n  return(\n    <div>\n      <div>{number}</div>\n\
    \      <button\n        type=\"button\"\n        onClick={GenerateNumber}>生成</button>\n\
    \    </div>\n  )\n}\n\nexport default connect(\n  state => state,\n  { GenerateNumber\
    \ }\n)(Counter)\n```\n\n## 更新\n\n更新函数处理应用程序消息。当收到 `SetNumber` 消息时，它返回一个带有新数字值的模型。\n\
    \n```\nfunction reducer(model = initialModel, action){\n  switch(action.type){\n\
    \    case SetNumber.name:\n      return { ...model, number: action.number };\n\
    \    default:\n      return model;\n  }\n}\n```\n\n# 总结\n\nElm 架构定义了数据流，使我们能够以函数式风格编写实用的应用程序。\n\
    \n模型是一个不可变对象，代表所有应用程序状态。\n\n视图函数是一个纯函数，用于构建 HTML 并创建消息。视图函数不负责在屏幕上渲染 HTML。它接收模型并返回\
    \ HTML。Elm 框架使用视图函数将此 HTML 渲染到屏幕上。\n\n消息是修改应用程序模型的请求。\n\n更新函数是一个纯函数，接收当前模型和一条消息，并返回新模型。当处理副作用时，它还会返回一条新命令。更新函数实际上并不改变模型。Elm\
    \ 框架使用更新函数来改变模型。Elm 框架执行更新函数返回的命令，并用结果创建一条新消息。\n\n# 第 17 章：函数式范式\n\n现在我们将回顾以函数式风格编程意味着什么。\n\
    \n函数式编程的主要思想是将应用程序拆分为小的纯函数，这些函数使用不可变数据进行通信，然后组合这些函数以实现所需功能。\n\n理想情况下，应用程序中的所有函数都应该是纯函数。\n\
    \n## 纯度\n\n正如多次重复的那样，函数式编程的重点是编写纯函数。这些函数只是转换值。\n\n当纯函数返回时，应用程序的状态与调用该函数时相同。当我们不必跟踪变量值的变化时，应用程序更容易理解。纯函数通过让我们将注意力集中在一处，使代码更易于跟踪。\n\
    \n当然，挑战在于仅使用纯函数进行转换来创建实用的应用程序。这甚至可能吗？\n\n我们看到，如果我们有合适的框架使用这些纯函数并执行实用应用程序所需的不纯逻辑，这是可以实现的。Elm\
    \ 实现了这样的架构。\n\n以下是在 Elm 中执行不纯逻辑的流程：\n\n*   纯更新函数创建一条描述不纯逻辑的命令\n*   Elm 框架获取该命令，执行不纯逻辑，并生成一条包含结果的消息\n\
    *   纯更新函数通过创建一个包含先前结果的新更新模型来处理这条消息\n\n这种方法需要为任何类型的不纯逻辑创建命令的函数，并使用能够理解这些命令的框架。\n\
    \n接下来，我们将研究一种类似的方法，用于使用 React 和 Redux 仅使用纯函数进行 fetch 调用。fetch 调用本身是一个副作用，因此在函数中调用它会使该函数变得不纯。\n\
    \n幸运的是，有一个 [Redux 中间件](https://redux.js.org/advanced/middleware)，称为 [Axios 中间件](https://github.com/svrcekmichal/redux-axios-middleware)，它可以拦截\
    \ fetch 消息，执行 fetch 调用，然后将结果放入一条新的成功消息中。\n\n让我们看看实现此功能所需的各个部分。\n\n模型最初只存储一个空的待办事项列表。\n\
    \n```\nconst initialModel = {\n  todos: []\n};\n```\n\n描述 fetch 请求的消息对象是使用 `LoadTodos`\
    \ 纯函数创建的。\n\n```\nfunction LoadTodos(){\n  return {\n    type: LoadTodos.name,\n\
    ```\n\n"
- fmt: "\n`payload: { request:{ url:'/todos' } } } }`\n\nThe `List` view function\
    \ is pure. It takes the list of todos and creates an HTML. It creates a refresh\
    \ button that sends `LoadTodos` messages on clicks.\n\n```jsx\nimport React from\
    \ 'react';\nimport { connect } from 'react-redux';\nimport { LoadTodos } from\
    \ './store';\n\nfunction List({todos, LoadTodos}){\n  return(\n    <div>\n   \
    \   <button type=\"button\" onClick={LoadTodos}>Refresh</button>\n      { todos.map(todo\
    \ => <div>{todo.title}</div>) }\n    </div>\n  )\n}\n\nexport default connect(\n\
    \  state => state,\n  { LoadTodos }\n)(List);\n```\n\nThe `update` function is\
    \ pure. It takes the current model and action and returns the new model. When\
    \ receiving the success message it returns a new model with the new list of to-dos.\n\
    \n```jsx\nfunction reducer(model = initialModel, action){\n  switch(action.type){\n\
    \    case `${LoadTodos.name}_SUCCESS`:\n      return {\n        ...model,\n  \
    \      todos: action.payload.data\n      };\n    default:\n      return model;\n\
    \  }\n}\n```\n\nThat’s it. We manage to make a fetch call and display the results\
    \ on the screen using only pure functions. We can do it because we have at our\
    \ disposal a set of libraries that handle the impure logic.\n\nNote the data flow\
    \ in this application:\n\n*   clicking on the refresh button creates a message\
    \ describing a fetch request\n*   the Axios middleware intercepts the message,\
    \ makes the fetch call and creates a new success message with the result\n*  \
    \ the update function handles the success message by creating a new model with\
    \ the previous result\n\n![](Image00014.jpg)\n\nWhen you think about, this logic\
    \ for retrieving data has three impure parts:\n\n*   fetching the data from a\
    \ Web API\n*   updating the model object\n*   rendering the data on the screen\n\
    \nThe Redux-Axios middleware enabled us to make fetch requests using pure functions\
    \ creating fetch commands. Redux offers a solution to update the model using pure\
    \ functions. React gives a solution to update the UI using pure view functions.\
    \ It helps but these are not the only kinds of impure logic we can write. There\
    \ are many more like coordinating several network requests, creating timer events,\
    \ generating random numbers, getting the current time, writing to the console\
    \ or to the local storage, and so on. We call them side-effects.\n\nIn JavaScript\
    \ at the moment of writing the best libraries for writing applications in a functional\
    \ style, React and Redux, still require to write impure logic. In this case, we\
    \ need to aim for a high percentage of pure functions. 80% is much better than\
    \ 20%.\n\n## Immutability\n\nIt turns out that immutability is much easier to\
    \ achieve. We can simply freeze objects at creation and they become immutable.\
    \ Another simple solution is to use a linter to make sure no mutations are done\
    \ in the application.\n\nImmutable data structures are available in libraries\
    \ like `Immutable.JS`. They offer optimization improvements and a nicer public\
    \ interface.\n\nWe should not be concerned about creating intermediate collections\
    \ when processing a list. When the list is small, less than a thousand records\
    \ the difference is indistinguishable. When working with collections of thousands\
    \ of objects we can start using sequences that do not create intermediate collections.\n\
    \n## Pipelines\n\nWe saw different ways of creating pipelines of data transformations\
    \ from the `pipe` utility to the chaining transformations on arrays, immutable\
    \ lists, sequences, promises, or observables.\n\nAll these data structures wrap\
    \ one or more values and allow us the create pipelines of pure functions transforming\
    \ the wrapped data. Usually, there are a set of common transformations like `filter`,\
    \ `map`, `reduce`, or `sort` that all these data structures support.\n\nThe currying\
    \ technique is useful in this case to pass additional arguments to the functions\
    \ in the pipeline.\n\nFunctional programming starts to be about transforming data\
    \ with pipelines of pure functions. In a sense, functional programming promotes\
    \ a data-flow programming style.\n\n## Loops\n\nPurely functional languages do\
    \ not have loops. Such functionalities are implemented using the array methods\
    \ and falling back to recursion for specific algorithms.\n\nAt the moment of writing\
    \ it is not possible to disable all loop statements in JavaScript because it lacks\
    \ the [tail-call](https://en.wikipedia.org/wiki/Tail_call) implementation.\n\n\
    ## Naming\n\nSplitting the application into pure functions is not enough. We need\
    \ to give intention revealing names to those functions. So take your time to do\
    \ that. If you failed the application will still be harder to understand.\n\n\
    ## Folder Structure\n\nAs the application grows more and more functions will be\
    \ created. You will need to find a way to structure these functions in modules.\
    \ That means creating files with a clear name containing those functions. Then\
    \ you need a way to structure those files in folders. There will be common functions\
    \ and there will be functions used only in a specific module.\n\n## Final Thoughts\n\
    \nAn application written in a functional style consists of numerous pure functions,\
    \ organized into modules. We use these functions into pipelines and compose them\
    \ to implement the required functionalities.\n\nFunctional programing makes code\
    \ easier to read. Programs that are not easily understood may lead to bugs and\
    \ are most often remade.\n\nThe essence of functional programming is transforming\
    \ immutable data using pure functions. These transformations become more expressive\
    \ in pipelines.\n\n## What’s next?\n\nIf you want to put in practice what you\
    \ learned and build modern React applications using functional components and\
    \ functional programming principles consider reading [Functional React, 2nd Edition](https://www.amazon.com/dp/B088FZQ1XN).\n\
    \nContinue your learning path with [Functional Architecture with React and Redux](https://www.amazon.com/dp/B0846NRJYR/ref=cm_sw_em_r_mt_dp_U_pztUEbV10W9GY)\
    \ and use React and Redux to build several applications with an incremental level\
    \ of complexity.\n\nThe functional architecture implies getting the initial state,\
    \ showing it to the user using the view functions, listening for actions, updating\
    \ the state based on those actions, and rendering the updated state back to the\
    \ user again.\n\n![](Image00015.jpg)\n\nEnjoy the Functional Programming with\
    \ JavaScript and React book series!\n\n## Table of Contents\n\n[Chapter 01: Primitives](#text00005.html_a3DX)\
    \  \n[Chapter 02: Immutable Data Objects](#text00006.html_a3DY)  \n[Chapter 03:\
    \ Functions](#text00007.html_a3DZ)  \n[Chapter 04: Arrays](#text00008.html_a3E0)\
    \  \n[Chapter 05: First-Class Functions](#text00009.html_a3E1)  \n[Chapter 06:\
    \ Statements](#text00010.html_a3E2)  \n[Chapter 07: Recursion](#text00011.html_a3E3)\
    \  \n[Chapter 08: Pipelines and Currying](#text00012.html_a3E4)  \n[Chapter 09:\
