  trans: "\n\n`payload: { request:{ url:'/todos' } } } }`\n\n`List` 视图函数是纯函数。它接收待办事项列表并生成\
    \ HTML。它创建了一个刷新按钮，点击时会发送 `LoadTodos` 消息。\n\n```jsx\nimport React from 'react';\n\
    import { connect } from 'react-redux';\nimport { LoadTodos } from './store';\n\
    \nfunction List({todos, LoadTodos}){\n  return(\n    <div>\n      <button type=\"\
    button\" onClick={LoadTodos}>Refresh</button>\n      { todos.map(todo => <div>{todo.title}</div>)\
    \ }\n    </div>\n  )\n}\n\nexport default connect(\n  state => state,\n  { LoadTodos\
    \ }\n)(List);\n```\n\n`update` 函数是纯函数。它接收当前模型和动作，并返回新模型。当接收到成功消息时，它会返回一个包含新待办事项列表的新模型。\n\
    \n```jsx\nfunction reducer(model = initialModel, action){\n  switch(action.type){\n\
    \    case `${LoadTodos.name}_SUCCESS`:\n      return {\n        ...model,\n  \
    \      todos: action.payload.data\n      };\n    default:\n      return model;\n\
    \  }\n}\n```\n\n就是这样。我们仅使用纯函数就实现了 fetch 调用并在屏幕上显示结果。之所以能做到，是因为我们拥有一套处理非纯逻辑的库。\n\
    \n请注意此应用中的数据流：\n\n*   点击刷新按钮会创建一条描述 fetch 请求的消息\n*   Axios 中间件拦截该消息，执行 fetch 调用，并创建一条包含结果的新成功消息\n\
    *   update 函数处理成功消息，通过之前的结果创建新模型\n\n![](img/Image00014.jpg)\n\n仔细想想，这种获取数据的逻辑包含三个非纯部分：\n\
    \n*   从 Web API 获取数据\n*   更新模型对象\n*   在屏幕上渲染数据\n\nRedux-Axios 中间件使我们能够通过创建 fetch\
    \ 命令的纯函数来发起 fetch 请求。Redux 提供了使用纯函数更新模型的解决方案。React 提供了使用纯视图函数更新 UI 的解决方案。这很有帮助，但这并不是我们所能编写的唯一非纯逻辑。还有很多其他情况，比如协调多个网络请求、创建定时器事件、生成随机数、获取当前时间、写入控制台或本地存储等等。我们称这些为副作用。\n\
    \n在撰写本文时，JavaScript 中用于以函数式风格编写应用的最佳库（React 和 Redux）仍然需要编写非纯逻辑。在这种情况下，我们需要追求高比例的纯函数。80%\
    \ 远比 20% 好。\n\n## 不可变性\n\n事实证明，实现不可变性要容易得多。我们可以在创建对象时直接冻结它们，它们就变得不可变了。另一个简单的解决方案是使用\
    \ linter 来确保应用中不发生任何变更。\n\n像 `Immutable.JS` 这样的库提供了不可变数据结构。它们提供了优化改进和更友好的公共接口。\n\
    \n在处理列表时，我们不必担心创建中间集合。当列表很小（少于一千条记录）时，差异几乎无法察觉。当处理包含数千个对象的集合时，我们可以开始使用不会创建中间集合的序列。\n\
    \n## 管道\n\n我们看到了创建数据转换管道的不同方式，从 `pipe` 工具到数组、不可变列表、序列、Promise 或 Observable 上的链式转换。\n\
    \n所有这些数据结构都包装了一个或多个值，并允许我们创建纯函数管道来转换包装的数据。通常，这些数据结构都支持一组常见的转换，如 `filter`、`map`、`reduce`\
    \ 或 `sort`。\n\n在这种情况下，柯里化技术对于向管道中的函数传递额外参数非常有用。\n\n函数式编程开始涉及使用纯函数管道转换数据。从某种意义上说，函数式编程提倡一种数据流编程风格。\n\
    \n## 循环\n\n纯函数式语言没有循环。这类功能是通过数组方法实现的，对于特定算法则退而使用递归。\n\n在撰写本文时，JavaScript 中无法禁用所有循环语句，因为它缺少[尾调用](https://en.wikipedia.org/wiki/Tail_call)实现。\n\
    \n## 命名\n\n将应用拆分为纯函数还不够。我们需要为这些函数赋予能揭示意图的名称。所以请花时间做好这一点。如果命名失败，应用仍然会难以理解。\n\n\
    ## 文件夹结构\n\n随着应用的增长，会创建越来越多的函数。你需要找到一种方法将这些函数组织成模块。这意味着创建具有清晰名称的文件来包含这些函数。然后你需要一种方法将这些文件组织到文件夹中。会有通用函数，也会有仅在特定模块中使用的函数。\n\
    \n## 最终思考\n\n以函数式风格编写的应用由大量纯函数组成，这些函数被组织成模块。我们将这些函数用于管道中，并组合它们以实现所需的功能。\n\n函数式编程使代码更易于阅读。不易理解的程序可能导致错误，并且通常会被重写。\n\
    \n函数式编程的本质是使用纯函数转换不可变数据。这些转换在管道中更具表现力。\n\n## 下一步是什么？\n\n如果你想将所学付诸实践，并使用函数式组件和函数式编程原则构建现代\
    \ React 应用，请考虑阅读 [Functional React, 2nd Edition](https://www.amazon.com/dp/B088FZQ1XN)。\n\
    \n继续你的学习之路，阅读 [Functional Architecture with React and Redux](https://www.amazon.com/dp/B0846NRJYR/ref=cm_sw_em_r_mt_dp_U_pztUEbV10W9GY)，并使用\
    \ React 和 Redux 构建多个具有递增复杂度的应用。\n\n函数式架构意味着获取初始状态，使用视图函数将其展示给用户，监听动作，基于这些动作更新状态，然后将更新后的状态再次渲染给用户。\n\
    \n![](img/Image00015.jpg)\n\n享受《JavaScript 与 React 函数式编程》系列书籍！\n\n## 目录\n\n第 01\
    \ 章：基本类型  \n第 02 章：不可变数据对象  \n第 03 章：函数  \n第 04 章：数组  \n第 05 章：一等函数  \n第 06 章：语句\
    \  \n第 07 章：递归  \n第 08 章：管道与柯里化  \n第 09 章：函子  \n第 10 章：单子  \n第 11 章：不可变集合  \n\
    第 12 章：惰性转换  \n第 13 章：生成器  \n第 14 章：Promise  \n第 15 章：Observable  \n第 16 章：Elm\
    \ 架构  \n第 17 章：函数式范式\n\n"
