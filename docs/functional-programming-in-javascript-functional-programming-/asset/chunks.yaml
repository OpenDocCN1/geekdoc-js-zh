  trans: "\n\n`JavaScript without this` 看起来像是一种更好的函数式编程语言。\n\n## 源代码\n\n本书的项目文件可在\
    \ [`github.com/cristi-salcescu/functional-programming-in-javascript`](https://github.com/cristi-salcescu/functional-programming-in-javascript)\
    \ 获取。\n\n## 反馈\n\n我很乐意听取您的反馈。如有关于本书的评论、问题或建议，请发送电子邮件至 cristisalcescu@gmail.com。提前感谢您考虑为本书撰写评论。\n\
    \n## 环境搭建\n\n首先，我们需要搭建开发环境以使用最新的 JavaScript 特性。\n\n### 包管理器\n\n包管理器是一种用于以简单方式跟踪项目依赖关系的工具。在撰写本文时，Node.js\
    \ 包管理器（简称 `npm`）是最流行的。让我们从安装 [Node.js](https://nodejs.org/en/download/) 开始。\n\n\
    然后可以在命令提示符中使用以下命令检查 Node.js 和 `npm` 的版本：\n\n```\nnode --version\nnpm --v\n```\n\
    \n### NPM 包\n\n使用 `npm` 我们可以安装额外的包。这些包就是应用程序的依赖项。\n\n`package.json` 文件存储了项目中使用的所有\
    \ node 包。这些包就是应用程序的依赖项。应用程序可以与其他开发者共享，而无需共享所有 node 包。使用 `npm install` 命令可以安装 `package.json`\
    \ 文件中定义的所有包。\n\n首先使用 `npm` 创建一个 `package.json` 文件。\n\n```\nnpm init\n```\n\n我们需要一个工具，将我们的\
    \ JavaScript 代码转换为向后兼容的版本，并支持 [模块](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules)。我们需要\
    \ [Babel](https://babeljs.io/)。去安装必要的包。\n\n```\nnpm install @babel/core @babel/node\
    \ @babel/preset-env --save\n```\n\n安装的包可以在 `node_modules` 文件夹中找到。`--save` 标志告诉\
    \ `npm` 将包依赖关系存储在 `package.json` 文件中。\n\n为了使用最新的 JavaScript，我们需要启用一个预设。创建 `.babelrc`\
    \ 文件并启用 `@babel/preset-env` 预设。\n\n```json\n{\n  \"presets\": [\"@babel/preset-env\"\
    ]\n}\n```\n\n### 代码检查\n\n代码检查是分析代码以发现潜在错误和风格问题的过程。检查器是一种运行并报告这些问题的工具。检查器对于代码格式化和使用最佳实践也很有用。\n\
    \n我们将使用 [ES Lint](https://eslint.org/)。首先安装它。\n\n```\nnpm install eslint --save-dev\n\
    ```\n\n检查规则可以在名为 `.eslintrc.*` 的配置文件中定义。\n\n接下来，设置一个配置文件。\n\n```\nnpx eslint --init\n\
    ```\n\n我们将使用的一个插件是 `eslint-plugin-functional`，所以让我们安装它。\n\n```\nnpm install eslint-plugin-functional\
    \ --save-dev\n```\n\n现在转到 `.eslintrc.json` 配置文件，编写禁止使用 `this` 关键字的检查规则。\n\n```json\n\
    {\n  \"plugins\": [\n    \"functional\"\n  ],\n  \"rules\": {\n    \"functional/no-this-expression\"\
    : \"error\"\n  }\n}\n```\n\n以下是如何对 `src` 文件夹中的所有文件运行代码检查。\n\n```\nnpx eslint src\n\
    ```\n\n在使用 [Create React App](https://reactjs.org/docs/create-a-new-react-app.html)\
    \ 创建的应用程序中，我们可以通过在启动开发服务器之前添加 `npx eslint src` 命令后跟 `&&` 来强制进行代码检查。\n\n```json\n\
    \"scripts\": {\n  \"start\": \"npx eslint src && react-scripts start\"\n}\n```\n\
    \n使用 `&&` 意味着 `&&` 两侧的内容都必须求值为 `true`。如果左侧命令失败，右侧命令将不会执行，因此在我们的情况下，开发服务器将不会启动。\n\
    \n### 集成开发环境\n\n对于代码编辑，我们需要一个集成开发环境，简称 IDE。\n\n我将使用 [Visual Studio Code](https://code.visualstudio.com/)，但您也可以使用任何您喜欢的编辑器。\n\
    \n为了编写命令，请在 Visual Studio Code 中打开应用程序文件夹。然后从 `终端 -> 新建终端` 打开终端并执行命令。\n\n例如，要运行\
    \ `filter.js` 文件中的代码并检查结果，我们可以使用以下命令。\n\n```\nnpx babel-node filter.js\n```\n\n\
    为了获得即时代码检查反馈，我们可以安装 [ESLint 扩展 for VSCode](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint)。代码检查使我们能够在更好的\
    \ JavaScript 子集中工作。\n\n## 第 01 章：原始类型\n\n我们通过查看语言中可用的第一种值类型来开始学习之旅。\n\n### 原始类型\n\
    \n原始值包括数字、字符串、布尔值、`null` 和 `undefined`。在控制台中输出一些原始值。\n\n```javascript\nconsole.log(1);\n\
    console.log('text');\nconsole.log(true);\n```\n\n所有这些原始值都有一个类型。我们可以使用 `typeof`\
    \ 运算符找到值的类型。检查其中一些。\n\n```javascript\nconsole.log(typeof(1));\n//\"number\"\n\
    console.log(typeof(''));\n//\"string\"\nconsole.log(typeof(true));\n//\"boolean\"\
    \n```\n\n有两种数字类型：`Number` 和 `BigInt`。我们主要使用第一种，它存储双精度浮点数。重要的是要知道浮点运算是不精确的。\n\n\
    ```javascript\nconsole.log(0.1+0.2);\n//0.30000000000000004\nconsole.log(0.1 +\
    \ 0.2 === 0.3);\n//false\n```\n\n整数运算精确到 15 位。我们可以通过先乘后除来解决上述问题。\n\n```javascript\n\
    console.log(1 + 2 === 3);\n//true\nconsole.log(0.1 * 10 + 0.2 * 10) / 10 === 3);\n\
    //true\n```\n\n`BigInt` 用于表示更大的数字。我们可以通过在整数文字末尾附加 `n` 来创建这样的数字。\n\n```javascript\n\
    console.log(12345678987654321n);\n```\n\n字符串是文本。有三种定义字符串值的方式：单引号、双引号和反引号。\n\n\
    ```javascript\n\"text\"\n'text'\n`text`\n```\n\n`Undefined` 是一种只有一个值 `undefined`\
    \ 的类型。`Null` 是一种只有一个值 `null` 的类型。`Boolean` 是一种有两个值 `true` 和 `false` 的类型。\n\n###\
    \ 原始类型上的方法\n\n原始类型不是对象，但它们似乎表现得像对象，因为它们有方法。例如，我们可以在字符串原始类型上调用 `toLowerCase` 方法。如果字符串不是对象，这怎么可能？JavaScript\
    \ 会创建一个包装对象并在运行 `toLowerCase` 方法后销毁它。\n\n```javascript\n'TEXT'.toLowerCase();\n\
    //\"text\"\n```\n\n我们可以访问原始类型上的现有属性，但不能更改它们或创建新属性。例如，`length` 属性返回字符串的长度。\n\n\
    ```javascript\n'ABCDEFG'.length\n//7\n'ABCDEFG'.type = 'letters';\n//Cannot create\
    \ property 'type' on string 'ABCDEFG'\n```\n\n唯一不被视为对象的原始类型是 `null` 和 `undefined`。尝试对它们调用方法会抛出错误。\n\
    \n```javascript\nnull.toString();\n//Cannot read property 'toString' of null\n\
    ```\n\n### 不可变性\n\n不可变值是一旦创建就不能更改的值。\n\n原始类型是不可变的。例如，在字符串上使用方法时，我们会创建新值。以下是使用\
    \ `trim` 方法的示例，该方法会删除字符串两端的空白。\n\n```javascript\n' 123 '.trim();\n//'123';\n```\n\
    \n`trim` 方法不会修改现有字符串。它会创建一个新字符串。\n\n### 变量\n\n我们需要区分变量和值。变量不是值。变量存储值。\n\n我们可以将值赋给变量。此时，变量持有这些值。变量有一个名称，我们可以使用变量名来引用该值。\n\
    \n我们使用赋值 `=` 关键字将值存储在变量中。变量可以使用 `let`、`var` 或 `const` 语句声明。当我们声明一个变量而不给它赋值时，它的默认值是\
    \ `undefined`。\n\n```javascript\nlet x;\nconsole.log(x);\n//undefined\n```\n\n\
    变量存储对值的引用。值不包含变量。值可能包含其他值。\n\n![Image](img/Image00002.jpg)\n\n值有类型。变量具有其所存储值的类型。变量不绑定到特定类型。一个值总是具有相同的类型。`1`\
    \ 始终是一个数字，但下面的变量 `x` 可以先是数字类型，然后是字符串类型。\n\n```javascript\nlet x;\nx = 1;\n```\n\
    \n"
- fmt: "\n`x = '';` When the value stored by the variable changes, the type of the\
    \ variable may change. Dynamic typing means that the type of the variable can\
    \ change at run-time. This happens only for variables declared with `let` or `var`.\
    \ `const` declares variables that cannot be reassigned so they cannot change their\
    \ type.\n\n## Recap\nNumbers, strings, booleans, `null`, and `undefined` are primitive\
    \ values. Primitive values are immutable. Values can be stored in variables. Variables\
    \ infer the type of the value they store.\n\n## Chapter 02: Immutable Data Objects\n\
    Next, we will look at what objects are and how to create and work with immutable\
    \ objects. In functional programming, we are going to use objects as data structures.\
    \ They will store data and have no behavior.\n\n### Objects\nObjects are a collection\
    \ of properties. Each property has a key and a value. Take a look at an object\
    \ in the console.\n\n```javascript\nconst book = {\n  title : 'JavaScript Allongé',\n\
    \  author: 'Reginald Braithwaite',\n  category: 'JavaScript'\n};\nconsole.log(book);\n\
    ```\n\nThe key is a string that is unique in the collection. It is case sensitive.\
    \ We can access a property using the dot notation or the bracket notation.\n\n\
    ```javascript\nconsole.log(book.title);\n//\"JavaScript Allongé\"\nconsole.log(book[\"\
    title\"]);\n```\n\n### Immutability\nImmutability is one of the core principles\
    \ of functional programming. Mutation means change. Saying that we changed an\
    \ object’s property is the same as saying we mutated that object. An immutable\
    \ object once created cannot be changed. JavaScript objects are nothing like that.\
    \ They can be modified. They are not immutable. Consider the next example:\n\n\
    ```javascript\nlet fruit = {\n  name: 'Apple'\n};\nfruit.name = 'Orange'\n//{name\
    \ : 'Orange'}\n```\n\nAs you notice, we can change the existing `fruit` object.\
    \ The same thing happens even when we use the `const` keyword declaration.\n\n\
    ```javascript\nconst fruit = {\n  name: 'Apple'\n};\nfruit.name = 'Orange'\n//\
    \ {name : 'Orange'}\n```\n\nThe `const` keyword refers to the variable, not to\
    \ the value it stores. It means the variable cannot be reassigned. It truly becomes\
    \ a constant when the value it stores is immutable.\n\n### Freezing\nIn order\
    \ to create an immutable object we can freeze it at creation.\n\n```javascript\n\
    const fruit = Object.freeze({\n  name: 'Apple'\n});\nfruit.name = 'Orange'\n//\
    \ Cannot assign to read only property 'name' of object\n```\n\nThe only limitation\
    \ is that `Object.freeze` does shallow freezing. It affects the immediate properties\
    \ of the object, the ones at the first level in the tree. If for example one of\
    \ these properties contains another object, that object will not be affected.\
    \ Look at the next example.\n\n```javascript\nconst book = Object.freeze({\n \
    \ name: \"How JavaScript Works\",\n  author: {\n    firstName: 'Douglas',\n  \
    \  lastName: 'Crockford'\n  }\n});\nbook.author.firstName = '';\n```\n\nThe `book`\
    \ object was changed. We can’t reassign a new object to the `author`’s property,\
    \ but we can modify its properties. For objects containing other objects, we should\
    \ use a [deepFreeze()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze)\
    \ utility function. It will freeze all the properties of all objects inside a\
    \ given object.\n\n### Linting\nThe other option for enabling immutability is\
    \ to use a linter such as [ESLint](https://eslint.org/). There are several plugins\
    \ for it that can help us enforcing immutable objects. Such plugins are [eslint-plugin-functional](https://www.npmjs.com/package/eslint-plugin-functional),\
    \ [eslint-plugin-fp](https://www.npmjs.com/package/eslint-plugin-fp), or [eslint-plugin-immutable](https://www.npmjs.com/package/eslint-plugin-immutable).\
    \ We are going to use [eslint-plugin-functional](https://www.npmjs.com/package/eslint-plugin-functional).\n\
    \n```bash\nnpm install eslint-plugin-functional --save-dev\n```\n\nAfter installing\
    \ the plugin, change the lint config file `.eslintrc.json` to enable immutable\
    \ data.\n\n```json\n\"plugins\": [\n  \"functional\"\n],\n\"rules\": {\n  \"functional/immutable-data\"\
    : \"error\"\n}\n```\n\nAt this point, trying to change, delete, or add a property\
    \ to an object will result in an error.\n\n```javascript\nconst counter = {\n\
    \  value: 1\n};\ncounter.value = 2;\ndelete counter.value;\nObject.assign(counter,\
    \ { value: 2 });\n//Modifying properties of existing object not allowed.\n```\n\
    \n### Working with Immutable Objects\nNext, let’s look at how to ‘change’ immutable\
    \ objects. Changing an immutable object means creating a changed copy. For this\
    \ is very useful to use the [spread operator syntax](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax).\n\
    \n#### Changing Properties\nHere is an example of modifying an existing property:\n\
    \n```javascript\nconst product = {\n  name: 'Apple',\n  quantity: 1\n};\nconst\
    \ newProduct = {\n  ...product,\n  quantity: 2\n};\n```\n\nBy using the spread\
    \ syntax we first copied all the properties from the `product` object and then\
    \ added the property that should be changed with the new value.\n\n#### Adding\
    \ Properties\nAdding new properties can be done in a similar way. We clone the\
    \ object and then add the additional properties to it. In the next example, the\
    \ `product` object is cloned and the `type` property is added.\n\n```javascript\n\
    const product = {\n  name: 'Apple',\n  quantity: 1\n};\nconst newProduct = {\n\
    \  ...product,\n  type: 'fruit'\n};\n```\n\n#### Deleting Properties\nProperties\
    \ can be removed using the rest operator in the [destructuring syntax](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment#Rest_in_Object_Destructuring).\
    \ In the next example, the `quantity` property is removed from the new product\
    \ object by being destructured out and ignored.\n\n```javascript\nconst product\
    \ = {\n  name: 'Apple',\n  quantity: 1\n};\nconst {\n  quantity,\n  ...newProduct\n\
    } = product;\nconsole.log(newProduct);\n//{name: \"Apple\"}\n```\n\nFrom now on,\
    \ in the following examples immutability is considered to be enabled using a linter\
    \ tool.\n\n### Recap\nAn immutable object cannot be changed after creation. We\
    \ can enable immutable objects by freezing them or using a linter. The spread\
    \ operator is handy for creating changed copies of existing objects.\n\n## Chapter\
    \ 03: Functions\nFunctions are our primary way to define and encapsulate logic.\
    \ Functions have a list of parameters and a body of statements. Depending on how\
    \ the function was created, it may have a name. I will aim for having named functions\
    \ most of the time. Let’s look at the main ways to define a function.\n\n### Function\
    \ Declarations\nA function can be created using the `function` keyword declaration,\
    \ followed by the name of the function and the list of parameters. The body of\
    \ the function stays inside curly braces.\n\n```javascript\nfunction sum(x, y){\n\
    \  return x + y;\n}\n```\n\nFunctions can be invoked using the function name followed\
    \ by the list of arguments enclosed in parentheses.\n\n```javascript\nsum(1,2)\n\
    //3\n```\n\nFunction parameters can be initialized with default values if no value\
    \ or `undefined` is passed. In the following example, if no value is given for\
    \ the `step` parameter when invoking the `increment` function, it will default\
    \ to `1`.\n\n```javascript\nfunction increment(n, step = 1){\n  return n + step\n\
    }\nconst n = 1;\nconsole.log(increment(n));\n//2\nconsole.log(increment(n, 2));\n\
    //3\n```\n\nFunctions created this way are hoisted to the top of their scope and\
    \ so they can be used before declaration. The scope of a function can be a module\
    \ or an outer function in which the current function is defined.\n\n```javascript\n\
    sum(1,2);\n//3\nfunction sum(x, y){\n  return x + y;\n}\n```\n\nFunctions return\
    \ values. The `return` statement specifies the returned value. It also stops the\
    \ execution of the function.\n\n### Function Expressions\nThe `function` keyword\
    \ can be used to define a function inside an expression. In the function declaration,\
    \ the function is the first keyword on the line. When that is not the case we\
    \ are dealing with function expressions. For a function expression, the name is\
    \ optional, but it can be handy to have it when implementing recursive functions.\
    \ Here is a function expression.\n\n```javascript\nconst sum = function(x, y){\n\
    \  return x + y;\n}\n```\n\nThe following is also a function expression.\n\n```javascript\n\
    !function start(){\n  console.log('start')\n}\n```\n\nOnce `function` is not the\
    \ first keyword on the line it becomes a function expression. The function name\
    \ can be omitted and it can auto-execute.\n\n```javascript\n!function(){\n  console.log('start')\n\
    }();\n```\n"
