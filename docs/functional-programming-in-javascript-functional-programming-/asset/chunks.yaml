  trans: "\n\n//错误：失败\n\n观察者对象中不需要为所有通知类型都提供回调。某些通知可以被忽略。我们可以仅提供一个回调作为参数来订阅可观察对象，而不需要提供完整的观察者对象。这等同于创建一个只包含\
    \ `next` 处理器的观察者。\n\n```javascript\nobservable.subscribe(value => console.log(`Next:\
    \ ${value}`));\n```\n\n所有三种类型的回调都可以作为参数传递给 `subscribe` 方法。这等同于创建一个包含所有三个处理器的观察者。\n\
    \n```javascript\nobservable.subscribe(\n  value => console.log(`Next: ${value}`),\n\
    \  msg => console.error(`Error: ${msg}`),\n  () => console.error(`Complete`)\n\
    );\n```\n\n## 订阅\n\n订阅（Subscription）是在订阅可观察对象时创建的对象。它允许我们取消对该可观察对象的订阅。\n\n```javascript\n\
    import { interval } from 'rxjs';\n\nconst observable = interval(1000);\nconst\
    \ subscription = observable.subscribe(console.log);\n\n//稍后\nsetTimeout(() =>\
    \ {\n  subscription.unsubscribe();\n}, 3500);\n\n//0 -> 1 秒后\n//1 -> 2 秒后\n//2\
    \ -> 3 秒后\n```\n\n订阅对象只有一个 `unsubscribe` 方法。当所有订阅者都取消订阅某个可观察对象时，该可观察对象就会停止执行。可观察对象在至少有一个订阅者时开始执行。\n\
    \n## 高阶可观察对象\n\n大多数情况下，可观察对象会发出原始值或数据对象，但有时它们也可能发出其他可观察对象。这种情况下，它们被称为高阶可观察对象。\n\
    \n例如，考虑一个发出 URL 字符串的可观察对象。我们可能有一个映射函数，它接收 URL 并返回一个新的可观察对象。\n\n```javascript\n\
    import { from } from 'rxjs';\nimport { ajax } from 'rxjs/ajax';\nimport { map\
    \ } from 'rxjs/operators';\n\nconst observable = from([\n  '/dictionaries',\n\
    \  '/todos'\n]);\n\nobservable.pipe(\n  map(ajax.getJSON)\n).subscribe(console.log);\n\
    \n//Observable {}\n//Observable {}\n```\n\n`ajax.getJSON` 就是映射函数。它接收 URL 并返回一个可观察对象，该对象会发出每个\
    \ URL 的网络请求响应。经过这种转换后，我们得到了一个可观察对象的可观察对象，即高阶可观察对象。\n\n处理高阶可观察对象是一个挑战。在这种情况下，我们需要一个扁平化操作，即将高阶可观察对象转换为普通可观察对象。\n\
    \n## 扁平化操作符\n\n我们不想处理一个发出可观察对象（这些可观察对象包装了从服务器获取的数据）的可观察对象，而是希望处理一个直接发出从服务器获取的数据的可观察对象。\n\
    \n### concatAll()\n\n`concatAll` 操作符会订阅“外层”可观察对象内部的每个可观察对象，并复制所有发出的值，直到该内部可观察对象完成。然后它继续处理下一个。它创建一个新的可观察对象，发出所有这些串联后的值。\n\
    \n下面是我们如何使用它来扁平化高阶可观察对象，并得到一个发出所有网络请求结果的可观察对象。\n\n```javascript\nimport { from\
    \ } from 'rxjs';\nimport { ajax } from 'rxjs/ajax';\nimport { map, concatAll }\
    \ from 'rxjs/operators';\n\nconst observable = from([\n  '/dictionaries',\n  '/todos'\n\
    ]);\n\nobservable.pipe(\n  map(ajax.getJSON),\n  concatAll()\n).subscribe(console.log);\n\
    \n//[{name: 'Dictionary'}]\n//[{title: 'To Do'}]\n```\n\n### mergeAll()\n\n另一个有用的扁平化操作是\
    \ `mergeAll`。它会在每个内部可观察对象到达时立即订阅，然后发出每个到达的值。\n\n在前面的例子中使用 `mergeAll` 代替 `concatAll`\
    \ 没有区别，因为每个内部 AJAX 可观察对象只发出一个值。当内部可观察对象随时间发出多个值时，才能看出区别。\n\n### mergeMap()\n\n\
    考虑一个映射函数，它接收一个值并返回一个可观察对象，该对象发出序列中的前三个数字。数字序列使用输入值作为常数 `c`，并应用 `n*c + 1` 公式定义。\n\
    \n当 `c = 2` 时，序列公式为 `2n + 1`，前三个值为 `3`、`5` 和 `7`。  \n当 `c = 4` 时，序列公式为 `4n + 1`，前三个值为\
    \ `5`、`9` 和 `13`。\n\n下面是创建可观察对象的 `toSequence` 映射函数。\n\n```javascript\nfunction\
    \ toSequence(x) {\n  const getNTerm = createGetNTerm(x);\n  return of(1, 2, 3).pipe(\n\
    \    map(getNTerm)\n  )\n}\n\nfunction createGetNTerm(c){\n  return function(n){\n\
    \    return n * c + 1\n  }\n}\n```\n\n当用值 `2` 调用时，`toSequence` 返回一个发出 `3`、`5`\
    \ 和 `7` 的可观察对象。\n\n```javascript\ntoSequence(2)\n//Observable 3 5 7\n\ntoSequence(4)\n\
    //Observable 5 9 13\n```\n\n接下来，让我们将 `toSequence` 映射函数应用到一个包含多个值的可观察对象上，这些值将用作新创建序列中的常数。\n\
    \n```javascript\nimport { from } from 'rxjs';\nimport { map, mergeAll } from 'rxjs/operators';\n\
    \nfrom([2, 4]).pipe(\n  map(toSequence)\n)\n.subscribe(console.log);\n\n//Observable\
    \ 3 5 7\n//Observable 5 9 13\n```\n\n此时，我们有一个发出可观察对象的可观察对象，这些内部可观察对象包含序列的前三个数字。\n\
    \n使用 `mergeAll` 将创建一个新的可观察对象，发出所有生成序列中的数字。首先，它发出第一个序列中的所有数字，然后是第二个，依此类推。\n\n```javascript\n\
    from([2, 4]).pipe(\n  map(toSequence),\n  mergeAll()\n)\n//.subscribe(console.log);\n\
    //3\n//5\n//7\n//5\n//9\n//13\n```\n\n`mergeMap` 的作用等同于先应用 `map` 再调用 `mergeAll`。\n\
    \n```javascript\nfrom([2, 4]).pipe(\n  mergeMap(toSequence)\n)\n.subscribe(console.log);\n\
    \n//3\n//5\n//7\n//5\n//9\n//13\n```\n\n## 组合可观察对象\n\n接下来，我们将介绍用于将多个可观察对象组合成一个可观察对象的操作符。\n\
    \n### forkJoin()\n\n假设有两个可观察对象发出网络请求的结果。我们希望在两个网络请求都完成时执行逻辑。\n\n```javascript\n\
    import { ajax } from 'rxjs/ajax';\nimport { forkJoin } from 'rxjs';\n\nconst dictionariesObservable\
    \ = ajax.getJSON('/dictionaries');\nconst todosObservable = ajax.getJSON('/todos');\n\
    \nforkJoin({\n  dictionaries: dictionariesObservable,\n  todos: todosObservable\n\
    }).subscribe(console.log);\n\n//{dictionaries: Array(), todos: Array()}\n```\n\
    \n`forkJoin` 从其他可观察对象创建一个可观察对象。当所有内部可观察对象完成时，它会以字典形式提供每个可观察对象最后发出的值。\n\n`forkJoin`\
    \ 操作符允许我们在页面加载时发出多个请求，并在收到所有响应后采取行动。它类似于 `Promise.all`。\n\n### race()\n\n`race`\
    \ 接收多个可观察对象，并返回最先发出值的那个可观察对象。它类似于 `Promise.race`。\n\n```javascript\nimport { ajax\
    \ } from 'rxjs/ajax';\nimport { race } from 'rxjs';\n\nconst dictionariesObservable\
    \ = ajax.getJSON('/dictionaries');\nconst todosObservable = ajax.getJSON('/todos');\n\
    \nconst observable = race(\n  dictionariesObservable,\n  todosObservable\n);\n\
    \nobservable.subscribe(console.log);\n```\n\n## 函子定律\n\n可观察对象具有 `map` 操作，该操作遵循两个函子定律。\n\
    \n### 同一律\n\n```javascript\nimport { of } from 'rxjs';\nimport { map } from 'rxjs/operators';\n\
    \nfunction identity(n){\n  return n;\n}\n\nof(1, 2, 3)\n  .pipe(\n    map(identity)\n\
    \  )\n//Observable 1,2,3\n```\n\n### 组合律\n\n```javascript\nimport { of } from\
    \ 'rxjs';\nimport { map } from 'rxjs/operators';\n\nfunction increment(n){\n \
    \ return n + 1;\n}\n\nfunction double(n){\n  return n * 2\n}\n\nof(1, 2, 3)\n\
    \  .pipe(\n    map(increment),\n    map(double)\n  )\n//Observable 4,6,8\n\nof(1,\
    \ 2, 3)\n  .pipe(\n    map(x => double(increment(x)))\n  )\n//Observable 4,6,8\n\
    ```\n\n可观察对象是函子。\n\n## 单子定律\n\n可观察对象有一个名为 `mergeMap` 的扁平映射操作，该操作遵循单子定律。\n\n###\
    \ 左同一律\n\n`M.unit(x).flatMap(f) === f(x)`\n\n我们可以将 `of` 视为创建可观察对象的 unit 函数。\n\n\
    ```javascript\nimport { of } from 'rxjs';\nimport { mergeMap } from 'rxjs/operators';\n\
    \nfunction f(n){\n  return of(n + 1);\n}\n\nof(1)\n  .pipe(\n    mergeMap(f)\n\
    \  )\n//Observable 2\n\nf(1)\n//Observable 2\n```\n\n### 右同一律\n\n将 unit 函数应用于可观察对象会得到一个发出相同值的可观察对象。\n\
    \n```javascript\nfunction unit(value){\n  return of(value)\n}\n\nof(1)\n  .pipe(\n\
    \    mergeMap(unit)\n  )\n  .subscribe(console.log);\n//Observable 1\n```\n\n\
    ### 结合律\n\n`monad.flatMap(f).flatMap(g) === monad.flatMap(x => f(x).flatMap(g))`\n\
    \n下面是我们如何为可观察对象翻译这个定律。\n\n```javascript\nfunction g(n){\n  return of(n * 2);\n\
    }\n\nof(1)\n  .pipe(\n    mergeMap(f),\n    mergeMap(g)\n  )\n//Observable 4\n\
    \nof(1)\n```\n\n"
- fmt: "\n# Chapter 16: Elm Architecture\n\n`.pipe(\n  mergeMap(x => f(x).pipe(mergeMap(g)))\n\
    )`\n\n`//Observable 4Observables are monads.`  \n`RecapObservables` are streams\
    \ of data. The consumers of these observables are the observers subscribing to\
    \ those streams. Creation functions like `of`, `from`, `interval` or `ajax` make\
    \ new observables.  \nObservables offer a solution for doing asynchronous tasks,\
    \ plus they have a set of powerful operators for processing the results. Pipeable\
    \ operators like `filter`, `map`, or `take` get an observable as input and return\
    \ another observable emitting the transformed values.  \nObservables emitting\
    \ other observables are called higher-order observables. Flattening operations\
    \ like `concatAll`, `mergeAll`, `mergeMap` allow us to convert higher-order observables\
    \ into ordinary observables.\n\nNext, we are going to learn how to create a simple\
    \ application in a functional style by building one using the [Elm](https://guide.elm-lang.org/)\
    \ purely functional language. Then we will implement the same functionality with\
    \ [React](https://reactjs.org/) and [Redux](https://redux.js.org/). The point\
    \ is to understand the architecture that supports this style of programming.\n\
    \nStart by creating the Elm project. Navigate to a new folder and create the Elm\
    \ project by running:\n\n```\nelm init\n```\n\nThe command creates an `elm.json`\
    \ file and a `src` folder for all Elm files.  \n`elm reactor` opens the development\
    \ server. It starts a server at `http://localhost:8000`. From there we can navigate\
    \ to any Elm file.\n\n## Elm Architecture\n\nThe Elm Architecture defines the\
    \ data flow inside an Elm application. It breaks the application into the following\
    \ core parts:\n\n* **Model** — defines all the state of the application.\n* **View**\
    \ — is a pure function that transforms the state data into HTML. The HTML sends\
    \ back messages.\n* **Messages** — expresses the user interaction.\n* **Update**\
    \ — is a pure function returning a new state based on the current message and\
    \ the actual state.\n\n![](Image00012.jpg)\n\nIn the next examples, we are going\
    \ to use this architectural pattern to create a few functionalities.\n\n## Counter\
    \ with Elm\n\nLet’s implement a simple counter page and discuss the Elm Architecture.\n\
    \n### Model\n\nThe model stores all the application data that can change. In our\
    \ case, we just need to store a number to reflect the current count.  \nThe initial\
    \ value of this counter is `0`.\n\n```\ntype alias Model = {\n  number : Int\n\
    }\n\ninitialModel : Model\ninitialModel = { number = 0 }\n```\n\n### Messages\n\
    \nMessages define user interaction. The user can increase or decrease the count\
    \ so we need two messages to express those actions.\n\n```\ntype Msg = Increment\
    \ | Decrement\n```\n\n### View Function\n\nThe view function takes in the `Model`\
    \ as an argument and displays it on the screen. The view function creates the\
    \ HTML.  \nThe HTML contains a decrement button that generates the `Decrement`\
    \ message, and an increment button that generates the `Increment` message and\
    \ the current count. The count number is read from the model, converted to a string,\
    \ and then rendered as text inside a `div` element.  \nMessages are generated\
    \ by handling the `onClick` event for each button.\n\n```\nview : Model -> Html\
    \ Msg\nview model =\n  div []\n    [\n      div [] [ text (String.fromInt model.number)\
    \ ]\n    , button [ onClick Decrement ] [ text \"-\" ]\n    , button [ onClick\
    \ Increment ] [ text \"+\" ]\n    ]\n```\n\n### Update Function\n\nThe update\
    \ function describes how to change the model when receiving a new message.  \n\
    When it gets the `Increment` message, it returns a new model with the number incremented.\
    \ When it gets the `Decrement` message, it returns a new model with the number\
    \ decremented.\n\n```\nupdate : Msg -> Model -> Model\nupdate msg model =\n  case\
    \ msg of\n    Increment ->\n      { model | number = model.number + 1 }\n    Decrement\
    \ ->\n      { model | number = model.number - 1 }\n```\n\nThe initial number is\
    \ zero and it increases and decreases when the user presses different buttons.\n\
    \n### Wiring-Up\n\nThe `main` value describes what is shown on the screen. It\
    \ needs the initial model, the view function to generate the HTML, and update\
    \ function to change the model.\n\n```\nimport Browser\nimport Html exposing (Html,\
    \ button, div, text)\nimport Html.Events exposing (onClick)\n\n//Code\nmain =\n\
    \  Browser.sandbox {\n    init = initialModel,\n    update = update,\n    view\
    \ = view\n  }\n```\n\nThe view function takes the initial model and displays on\
    \ the screen. The user actions generate messages. The update handles those actions\
    \ and updates the model. When the model is changed the view function is called\
    \ to render the new model on screen. This flow repeats endlessly.\n\n## Counter\
    \ with React and Redux\n\nNow let’s implement the same counter page in JavaScript\
    \ with React and Redux.\n\n### Model\n\nThe model defines all the application\
    \ data. We can define the counter as the `number` property on the application\
    \ state object.\n\n```\nconst initialModel = {\n  number: 0\n};\n```\n\n### Messages\n\
    \nThe two messages for increasing and decreasing the count can be expressed as\
    \ functions creating plain data objects having the `type` property.\n\n```\nfunction\
    \ Increment(){\n  return {\n    type : Increment.name\n  }\n}\n\nfunction Decrement(){\n\
    \  return {\n    type : Decrement.name\n  }\n}\n\nexport { Increment, Decrement\
    \ };\n```\n\n### View Function\n\nThe view function can be implemented using [React\
    \ functional components](https://reactjs.org/docs/components-and-props.html).\
    \ These components return an HTML-like syntax called [JSX](https://reactjs.org/docs/introducing-jsx.html).\n\
    \n```\nimport React from 'react';\nimport { connect } from 'react-redux';\nimport\
    \ { Increment, Decrement } from './store';\n\nfunction Counter({number, Increment,\
    \ Decrement}){\n  return(\n    <div>\n      <div>{number}</div>\n      <button\n\
    \        type=\"button\"\n        onClick={Decrement}>-</button>\n      <button\n\
    \        type=\"button\"\n        onClick={Increment}>+</button>\n    </div>\n\
    \  )\n}\n\nexport default connect(\n  state => state,\n  {Increment, Decrement}\n\
    )(Counter);\n```\n\n### Update Function\n\nThe update function takes the current\
    \ model and message and returns the new model.\n\n```\nfunction reducer(model\
    \ = initialModel, action){\n  switch(action.type){\n    case Increment.name:\n\
    \      return { ...model, number: model.number + 1 };\n    case Decrement.name:\n\
    \      return { ...model, number: model.number - 1 };\n    default:\n      return\
    \ model;\n  }\n}\n\nexport { reducer };\n```\n\n### Wiring-Up\n\nWe can wire up\
    \ all these in the application entry point file `index.js`. Here we specify the\
    \ initial state, the view, and the update functions.\n\n```\nimport React from\
    \ 'react';\nimport ReactDOM from 'react-dom';\nimport { createStore } from 'redux';\n\
    import { Provider } from 'react-redux';\nimport Counter from './Counter';\nimport\
    \ { reducer } from './store';\n\nconst store = createStore(reducer);\n\nReactDOM.render(\n\
    \  <React.StrictMode>\n    <Provider store={store}>\n      <Counter />\n    </Provider>\n\
    \  </React.StrictMode>,\n  document.getElementById('root')\n);\n```\n\n## Random\
    \ Number with Elm\n\nNext, we will create another page that displays a random\
    \ number. This may look simpler than previous functionality but it is actually\
    \ harder to do because generating random numbers cannot be done with a pure function.\
    \  \nPure functions are deterministic functions. Called with the same input they\
    \ always return the same output. Elm is a purely functional language. That means\
    \ it allows us to write only pure functions. How is it possible then to generate\
    \ random numbers and write only pure functions? Let’s find out.\n\n### Model\n\
    \nAgain we need a model to store our application data that can change. The model\
    \ contains just a number.\n\n```\ntype alias Model = {\n  number : Int\n}\n\n\
    initModel : () -> (Model, Cmd Msg)\ninitModel _ =\n  ( Model 0\n  , Cmd.none\n\
    \  )\n```\n\n### Messages\n\nThe user can press the generate button so we need\
    \ a message to express that interaction, `GenerateNumber`.\n\n```\ntype Msg =\
    \ GenerateNumber\n```\n\n### View\n\nThe view function takes the model and renders\
    \ the UI. It displays the current number stored in the model inside a `div` element.\
    \ It also shows the button for generating a new number. When the button is pressed\
    \ the `GenerateNumber` message is created.\n\n```\nview : Model -> Html Msg\n\
    view model =\n  div []\n    [\n      div [] [ text (String.fromInt model.number)\
    \ ]\n    , button [ onClick GenerateNumber ] [ text \"Generate\" ]\n    ]\n```\n"
