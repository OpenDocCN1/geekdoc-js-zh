  trans: "\n\n```\nincrement,\ndecrement\n}\n\nfunction doAction(x, actionName){\n\
    \  const action = actionMap[actionName];\n  return action\n    ? action(x)\n \
    \   : x;\n}\n\nconst number = 0;\nconst newNumber = doAction(number, 'increment');\n\
    console.log(number);\n```\n\n# 循环语句\n\n该语言中有三种循环语句：`for`、`while` 和 `do-while`。\n\
    \n## `for` 语句\n\n`for` 循环语句鼓励突变和副作用。我们将用数组方法（如 `filter`、`map` 和 `reduce`）替换 `for`\
    \ 循环。当算法需要更多灵活性时，我们可以回退到 `forEach`。\n\n`for-in` 循环遍历对象的键。\n\n```\nconst book =\
    \ {\n  title : \"How JavaScript Works\",\n  author : \"Douglas Crockford\"\n};\n\
    \nfor (const propName in book) {\n  console.log(book[propName])\n}\n```\n\n我们可以使用\
    \ `Object.keys` 和数组方法实现相同的逻辑。\n\n```\nObject.keys(book).forEach(propName => {\n\
    \  console.log(book[propName])\n});\n```\n\n`for-of` 语句遍历[可迭代对象](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols#The_iterable_protocol)，如数组或字符串。\n\
    \n```\nconst arr = [1, 2, 3];\nfor (const element of arr) {\n  console.log(element);\n\
    }\n```\n\n它可以被 `forEach` 方法替代。\n\n```\narr.forEach(element => {\n  console.log(element);\n\
    });\n```\n\n`while` 语句在条件为真时持续循环。\n\n`do-while` 语句是 `while` 循环的一种变体，它先执行一次代码，然后检查条件，之后在条件为真时持续循环。\n\
    \n以下 lint 规则禁止所有循环语句，包括 `for`、`for-of`、`for-in`、`while` 和 `do-while`。\n\n`\"no-loop-statement\"\
    : \"error\"`\n\n禁用所有循环语句是有问题的。在[尾调用优化](https://en.wikipedia.org/wiki/Tail_call)可用之前，我们仍然至少需要一个循环语句，以便在特定算法中偶尔使用。以下是如何在特定行上停用上述循环规则的方法。\n\
    \n```\nlet i = 1;\n// eslint-disable-next-line functional/no-loop-statement\n\
    while(i < 10){\n  console.log(i);\n  i = i + 1;\n}\n```\n\n# 破坏性语句\n\n有四种破坏性语句：`break`、`continue`、`throw`\
    \ 和 `return`。我们将只保留最后一种。\n\n## `break` 和 `continue`\n\n`break` 语句“跳出”循环。\n\n`continue`\
    \ 语句“跳过”循环中的一次迭代。\n\n`break` 和 `continue` 都与 `goto` 语句类似，我们不会使用它们。相反，我们将使用数组方法，如\
    \ `find`、`every` 或 `some`。\n\n考虑以下示例，当找到搜索的元素时跳出循环。\n\n```\nconst products = [\n\
    \  {id:1, name: 'apple'},\n  {id:2, name:'mango'}\n]\nconst id = 1;\nlet product;\n\
    for(let i=0; i<products.length; i++){\n  if(products[i].id === id){\n    product\
    \ = products[i];\n    break;\n  }\n}\nconsole.log(product);\n//{id:1, name: 'apple'}\n\
    ```\n\n我们可以使用 `find` 实现相同的逻辑。\n\n```\nconst id = 1;\nconst product = products.find(p\
    \ => p.id === id);\nconsole.log(product)\n```\n\n现在，看一个遍历单词列表并在找到特定单词时停止的示例。\n\
    \n```\nconst words = [\n  'ability',\n  'calculate',\n  'calendar',\n  'double',\n\
    \  'door'\n];\nconst stopTo = 'double';\nfor(let word of words){\n  if(word ===\
    \ stopTo){\n    break;\n  }\n  console.log(word);\n}\n```\n\n相同的逻辑可以使用 `every`\
    \ 实现。\n\n```\nwords.every(w => {\n  if(w.startsWith(stopTo)){\n    return false;\n\
    \  } else {\n    console.log(w);\n    return true;\n  }\n});\n```\n\n`break` 和\
    \ `continue` 通常用于循环中。一旦我们禁用循环，也就禁用了 `break` 和 `continue` 的使用。\n\n`break` 不能在 `switch`\
    \ 语句中使用，因为 `switch` 要求所有分支都有返回。\n\n## `throw`\n\n`throw` 语句引发异常。下面是一个示例。\n\n```\n\
    throw new Error('The errors details');\n```\n\n函数式编程中不使用异常，这意味着我们需要为这些场景寻找其他替代方案。\n\
    \n对于异步代码，最好的方法是在操作失败时返回一个被拒绝的 promise。我们将在讨论 promise 时查看这个场景。对于同步代码，当发生错误时，我们需要返回一个不同的结果。\n\
    \n以下是禁用 `throw` 语句的 lint 规则：\n\n`\"functional/no-throw-statement\": \"error\"\
    `\n\n## 总结\n\n条件语句应在所有分支上返回值。\n\n`if` 语句的更好替代方案是条件运算符。\n\n`switch` 可以用映射（map）替代。\n\
    \n我们应该使用数组方法而不是循环语句。\n\n我们将只使用一种破坏性语句：`return`。\n\n# 第 07 章：递归\n\n递归意味着函数调用自身。递归需要终止条件。当满足某个条件时，递归算法停止调用自身并返回一个值。\n\
    \n递归是一种解决问题的方法，其中通过解决同一问题的更小实例来找到解决方案。\n\n## 递归阶乘\n\n让我们先看看以迭代方式计算一个数的阶乘的算法。如你所知，`n`!\
    \ = `n` * (`n`-1)!。\n\n```\nfunction factorial(n) {\n  let result = 1;\n  let\
    \ i = 2;\n  while(i <= n){\n    result = result * i;\n    i = i + 1;\n  }\n  return\
    \ result;\n}\nconsole.log(factorial(5));\n//i=2, result=2\n//i=3, result=6\n//i=4,\
    \ result=24\n//i=5, result=120\n//120\n```\n\n以下是使用递归实现相同算法的方法。\n\n```\nfunction\
    \ factorial(n) {\n  if (n === 0) { \n    return 1;  \n  }\n  else {  \n    return\
    \ n * factorial(n - 1);  \n  }\n}\n//n=5 -> 5*f(4)\n//n=4 -> 4*f(3)\n//n=3 ->\
    \ 3*f(2)\n//n=2 -> 2*f(1)\n//n=1 -> 1*f(0)\n//n=0 -> 1 停止！\n//n=1 -> 1*f(0) =\
    \ 1*1 = 1\n//n=2 -> 2*f(1) = 2*1 = 2\n//n=3 -> 3*f(2) = 3*2 = 6\n//n=4 -> 4*f(3)\
    \ = 4*6 = 24\n//n=5 -> 5*f(4) = 5*24= 120\nconsole.log(factorial(5));\n//120\n\
    ```\n\n`factorial` 函数不断调用自身，直到得到 `n` 为 0 的结果。然后它恢复执行，并计算 `n` 等于 1、2、3、4 和最终 5\
    \ 的结果。\n\n下面是使用条件运算符重构的相同递归函数。\n\n```\nfunction factorial(n) {\n  return (n ===\
    \ 0) \n    ? 1\n    : n * factorial(n - 1);  \n}\nconsole.log(factorial(5));\n\
    //120\n```\n\n## 尾调用优化\n\n这是编写阶乘函数的另一种方式。\n\n```\nfunction factorial(n, result\
    \ = 1) {\n  //console.log(`n=${n}, result=${result}`);\n  return (n === 0) \n\
    \    ? result\n    : factorial(n - 1, n * result);  \n}\nconsole.log(factorial(5));\n\
    //n=5, result=1\n//n=4, result=5\n//n=3, result=20\n//n=2, result=60\n//n=1, result=120\n\
    //n=0, result=120\n//120\n```\n\n注意，这次一旦函数到达停止条件，它就返回结果。它不需要返回并恢复之前的调用来返回最终结果。当满足结束条件时，它直接返回，因为它已经拥有了所有必要的数据。\n\
    \n当递归调用是函数执行的最后一步时，该递归函数就是尾递归的。\n\n尾递归函数应该由编译器优化，并且性能应该更好。\n\n在撰写本文时，主流浏览器尚未实现尾调用优化。\n\
    \n## 栈溢出错误\n\n考虑以下函数，它以迭代方式计算从 0 到 10000 的所有值的和。\n\n```\nfunction sumAll(n) {\
    \        \n  let total = 0;\n  let i = 1;\n  while(i <= n){\n    total = total\
    \ + i;\n    i = i + 1;\n  }\n  return total;\n}\nconsole.log(sumAll(10000));\n\
    //50005000\n```\n\n下面是使用尾调用优化编写的等效代码。\n\n```\nfunction sumAll(n, i = 0, result\
    \ = 0) {\n  return (i > n) \n    ? result\n    : sumAll(n, i + 1, i + result);\
    \  \n}\nconsole.log(sumAll(5));\n//15\n```\n\n用较大的数字调用递归函数会导致栈溢出错误。\n\n```\nconsole.log(sumAll(10000));\n\
    ```\n\n"
- fmt: "\n`//Maximum call stack size exceeded`Recursion can lead to the “Maximum call\
    \ stack size exceeded” error message. JavaScript reserves for each function call\
    \ a call-stack, a fixed amount of memory to keep information about the call. Information\
    \ is added to the call-stack like in any other stack last-in, first-out. Each\
    \ recursive call adds a new stack-frame to the call-stack. If the recursive calls\
    \ create too many stack-frames the stack overflow error is thrown. The tail-recursive\
    \ functions should not create a new stack frame for each function call, but rather\
    \ use a single stack frame. In theory, any loop can be implemented with recursion.\
    \ Because of the missing implementation of the tail-call optimization, it is not\
    \ practical to replace any kind of loop with recursion. At the time of writing,\
    \ the tail-call recursive implementation of a loop may have a performance penalty\
    \ or may lead to stack-overflow error.\n\n## Trampoline\n\nTrampolining is a technique\
    \ that allows us to work with tail-recursive functions in a language that does\
    \ not have the tail-call optimization. First, it requires to rewrite the original\
    \ tail-call function to return thunks instead of returning the actual values.\
    \ In our example, it means that instead of returning the result of `sumAll(n,\
    \ i + 1, i + result)` we return a nullary function returning that result.\n\n\
    ```\nfunction sumAll(n, i = 0, result = 0) {\n\nreturn (i > n) \n\n? () => result\n\
    \n: () => sumAll(n, i + 1, i + result);\n\n}\n```\n\nA [thunk](https://en.wikipedia.org/wiki/Thunk_(functional_programming))\
    \ is a function taking no arguments that invokes another function with all the\
    \ necessary arguments and returns the result. For example, the following function\
    \ is a thunk.\n\n```\nconst sum100Thunk = () => sumAll(100);\n```\n\nThe `sum100Thunk`\
    \ function takes no arguments and returns the result of invoking `sumAll` with\
    \ the specific arguments. After converting the original function to return thunks\
    \ we need the `trampoline` utility function that loops in an iterative way and\
    \ invokes the thunk functions. The loop continues as long as the thunks return\
    \ other thunk functions.\n\n```\nfunction trampoline(f) {\n\nreturn function(...args){\n\
    \nlet result = f(...args);\n\nwhile (typeof(result) === 'function'){\n\nresult\
    \ = result();\n\n}\n\nreturn result;\n\n}\n\n}\n\nconst _sumAll = trampoline(sumAll);\n\
    \nconsole.log(_sumAll(10000));\n\n//50005000\n```\n\nTrampolining is a solution\
    \ to a problem we should not have and also comes with its own overhead. It basically\
    \ allows us to convert the recursive function to an iterative loop.\n\n## Traversing\
    \ a Tree\n\nRecursion can be used to implement specific algorithms that are easier\
    \ to solve this way. In the next example, recursion is used to traverse a tree\
    \ and create an array with the top selected node values. We start by defining\
    \ the tree, beginning with the root node object containing other node objects.\
    \ Each node has the value and checked properties.\n\n```\nconst tree = {\n\nvalue:\
    \ 0,\n\nchecked: false,\n\nchildren: [{\n\nvalue: 1,\n\nchecked: true,\n\nchildren:\
    \ [{\n\nvalue: 11,\n\nchecked: true,\n\nchildren: null\n\n}]\n\n}, {\n\nvalue:\
    \ 2,\n\nchecked: false,\n\nchildren: [{\n\nvalue: 22,\n\nchecked: true,\n\nchildren:\
    \ null\n\n},{\n\nvalue: 23,\n\nchecked: true,\n\nchildren: null\n\n}]\n\n}]\n\n\
    }\n```\n\nHere is a visual representation of this tree.\n\n![](Image00006.jpg)\n\
    \nWe want to get the values of the top selected nodes. That means we don’t need\
    \ all the checked values from the tree. If the parent node is checked we don’t\
    \ have to take the checked values from its children.\n\n```\nfunction toChildTopSelection(selection,\
    \ childNode){\n\nreturn selection.concat(getTopSelection(childNode));\n\n}\n\n\
    function getTopSelection(node){\n\nreturn node.checked\n\n?   [node.value]\n\n\
    :   node.children !== null\n\n? node.children.reduce(toChildTopSelection, [])\n\
    \n: []\n\n}\n\ngetTopSelection(tree);\n\n//[1, 22, 23]\n```\n\n`getTopSelection`\
    \ takes a tree object and returns an array with the top selected values. If the\
    \ node is checked it returns the value of that node as an array with a single\
    \ element. When the node is not checked and has child nodes it returns the top\
    \ selection of those child nodes. `getTopSelection` is called for each child node\
    \ inside the tree until the recursive calls stop at the nodes being checked. Finding\
    \ a node that is checked is the ending condition. `getTopSelection` is not called\
    \ for the child nodes of a node that is checked.\n\n## Recap\n\nA recursive function\
    \ is a function that calls itself until a condition is met. Recursion offers a\
    \ simpler solution to a set of problems like traversing trees. Any iterative loop\
    \ can be implemented with recursion but this is not practical until the tail-call\
    \ optimization is supported by major browsers.\n\n# Chapter 08: Pipelines and\
    \ Currying\n\nPipelines are the typical use case for functional programming. Currying\
    \ is commonly used when creating pipelines because the functions defining the\
    \ flow of transformations expect one argument.\n\n## Pipelines\n\nA pipeline is\
    \ a series of data transformations where the output of one transformation is the\
    \ input of the next one. Pipelines enable us to write data transformations in\
    \ a more expressive way. Consider the next code:\n\n```\nfunction capitalize(text)\
    \ {\n\nreturn text.charAt(0).toUpperCase() + text.slice(1);\n\n}\n\nfunction shortenText(text)\
    \ {\n\nreturn text.substring(0, 8).trim();\n\n}\n\nconst shortText =\n\nshortenText(capitalize(\"\
    this is a long text\"));\n\nconsole.log(shortText);\n\n//\"This is\"\n```\n\n\
    We can write these transformations in a more expressive way using the pipe utility\
    \ from a functional library like [lodash](https://lodash.com/) or [ramda](https://ramdajs.com/)\
    \ . `npm i lodash --save`\n\nHere is how the transformations look like in a pipeline.\n\
    \n```\nimport { pipe } from 'lodash/fp';\n\nconst shortText = pipe(\n\ncapitalize,\n\
    \nshortenText\n\n)(\"this is a long text\");\n\nconsole.log(shortText);\n\n//\"\
    This is\"\n```\n\nThe initial text is the input in the pipeline. `capitalize`\
    \ is the first function to process the text. Then the output of this transformation\
    \ goes as input to the next one `shortenText`. Then the pipeline finishes and\
    \ we get the result.\n\n![](Image00007.jpg)\n\n## Chaining\n\nChaining is a more\
    \ common form of defining a pipeline. It requires to work with an object. Consider\
    \ the following list of debts.\n\n```\nconst debts = [\n\n{\n\ncontractNo : 1,\n\
    \ndaysSinceLastPayment: 91,\n\ncurrency : 'EUR'\n\n},\n\n{\n\ncontractNo : 2,\n\
    \ndaysSinceLastPayment: 35,\n\ncurrency : 'USD'\n\n},\n\n{\n\ncontractNo : 3,\n\
    \ndaysSinceLastPayment: 45,\n\ncurrency : 'USD'\n\n}   \n\n];\n```\n\nHere is\
    \ how we can define a pipeline of transformations using chaining.\n\n```\nconst\
    \ newDebts = debts\n\n.filter(isEur)\n\n.map(toDebtView);\n\nfunction isEur(debt){\n\
    \nreturn debt.currency === \"EUR\";\n\n}\n\nfunction toDebtView(debt){\n\nreturn\
    \ {\n\n...debt,\n\npriority : getPriority(debt)\n\n}\n\n}\n\nfunction getPriority(debt){\n\
    \nconst days = debt.daysSinceLastPayment;\n\nreturn days > 90\n\n? 1\n\n: days\
    \ > 60\n\n? 2\n\n: 3;\n\n}\n```\n\nFirst, the debt list is filtered using `isEur`\
    \ predicate function. Then the result of this operation is transformed using the\
    \ `toDebtView` mapping function.\n\n![](Image00008.jpg)\n\n## The Identity Function\n\
    \nThe identity function is a unary function that returns the value it gets as\
    \ its argument. In mathematics, it is defined as f(x) = x .\n\n```\nfunction identity(value){\n\
    \nreturn value;\n\n}\n```\n\nIf we put this transformation in the previous pipeline\
    \ it will just create a copy of the array. The `logIdentity` function gives a\
    \ way to inspect the data in the pipeline without affecting the flow. It returns\
    \ the argument it gets but also logs it to the console.\n\n```\nfunction logIdentity(value){\n\
    \nconsole.log(value);\n\nreturn value;\n\n}\n\ndebts\n\n.filter(isEur)\n\n.map(logIdentity)\n\
    \n.map(toDebtView)\n\n.map(logIdentity);\n```\n\n## Currying\n\nCurrying is a\
    \ technique for changing a function expecting n arguments into a series of n functions\
    \ each expecting one argument. Consider the case of filtering a list of words.\n\
    \n```\nconst words = [\n\n'ability',\n\n'calculate',\n\n'calendar',\n\n'double',\n\
    \n'door'\n\n];\n\nfunction startsWith(word, term){\n\nreturn word.startsWith(term);\n\
    \n}\n\nwords\n\n.filter(w => startsWith(w, 'a'))\n\n.forEach(console.log);\n```\n\
    \nNow, look at the same code refactored using currying.\n\n```\nfunction startsWith(term){\n\
    \nreturn function(word){\n\nreturn word.startsWith(term);\n\n}\n\n}\n\nwords\n\
    ```\n"
