    ## Data Transformation


    `Map`s support both the `filter` and `map` operations. [map(mapper)](https://immutable-js.github.io/immutable-js/docs/#/Map/map)
    returns a new `Map` on which the mapper function was applied to all values. [filter(predicate)](https://immutable-js.github.io/immutable-js/docs/#/Map/filter)
    returns a new `Map` containing only the key-value pairs for which the predicate
    function returns `true`. The predicate function is applied to the value.


    ## Recap


    Both `List` and `Map` offer a nicer public interface for working with immutable
    collections. `List`s have the `filter`, `map`, `reduce`, and `sort` methods working
    similar to the ones available in arrays. These immutable data structures are highly
    optimized. `List`s have efficient addition and removal from both the end and the
    beginning of the list of O(1) complexity.


    ## Chapter 12: Lazy Transformations


    Array operations like `filter`, `map`, `reduce` make transformations a lot easier
    to read and understand, but as you noticed these transformations create a new
    array at each step. This may create performance penalties for large arrays of
    thousands of records. Next, we are going to explore solutions to these cases.


    ### Transducers


    The fact is that all transformations can be expressed using the reducer function.
    We can do filtering using the reducer function, mapping can be done using the
    reducer function, and so on.


    Here is an implementation of the mapping transformation using `reduce`.


    ```

    function map(transform) {


    return function reducer(arr, value) {


    const newValue = transform(value);


    return [...arr, newValue];


    }


    }


    function double(n){


    return n * 2;


    }


    const numbers = [1, 2, 3];


    const newNumbers = numbers.reduce(map(double), []);


    //[2, 4, 6]

    ```


    Below is the filtering transformation implemented using `reduce`.


    ```

    function filter(test) {


    return function reducer(arr, value) {


    if (test(value)) {


    return [...arr, value]


    } else {


    return arr;


    }


    }


    }


    function isEven(n){


    return n % 2 === 0;


    }


    const numbers = [1, 2, 3, 4];


    const newNumbers = numbers.reduce(filter(isEven), []);


    //[2, 4]

    ```


    Note that `reduce` does not stop and processes all the values in the array. The
    `find` method stops when it finds the value. The equivalent implementation of
    `find` using the `reduce` method performs worse because it loops through all the
    elements.


    ```

    function find(test) {


    return function reducer(foundValue, value) {


    if (test(value) && !foundValue) {


    return value


    } else {


    return foundValue;


    }


    }


    }


    function isEven(n){


    return n % 2 === 0;


    }


    const numbers = [1, 2, 3, 4];


    const element = numbers.reduce(find(isEven), undefined);


    //2

    ```


    Knowing all these, when doing transformations instead of building a new array
    at each step we can build a new reducer function.


    Consider the next example creating an array at each step.


    ```

    function isEven(n){


    return n % 2 === 0;


    }


    function double(n){


    return n * 2;


    }


    const numbers = [1, 2, 3, 4];


    const newNumbers =


    numbers


    .filter(isEven) //[2, 4]


    .map(double); //[4, 8]

    ```


    The first `filter` created an intermediate array `[2, 4]` that is then used by
    the `map` method.


    Let’s see what it means to arrive at the same result by building a reducer that
    does all the transformations instead of building intermediate arrays.


    This means that `filter` creates a new reducer applying filtering, and `map` takes
    this reducer and creates a new one applying the mapping transformation.


    Here is the implementation of a `filter` function that takes a reducer and creates
    a new one that applies the predicate test.


    ```

    function filter(test) {


    return function(reducer){


    return function filterReducer(arr, value){


    if(test(value)){


    return reducer(arr, value);


    } else {


    return arr;


    }


    }


    }


    }

    ```


    It may look better if we use the arrow function and the conditional operator to
    defined this curried function.


    ```

    const filter = test => reducer => {


    return function filterReducer(arr, value){


    return test(value)


    ? reducer(arr, value)


    : arr


    }


    }

    ```


    Here is the `map` function taking a reducer and returning a new reducer that applies
    the mapping transformation to all values.


    ```

    const map = transform => reducer => {


    return function mapReducer(arr, value){


    const newValue = transform(value);


    return reducer(arr, newValue);


    }


    }

    ```


    All these functions work on reducers, so we need an initial reducer to work on.
    This will be a function that just makes a copy of the existing array.


    ```

    const toArrayReducer = (arr, value) => {


    return [...arr, value]


    };

    ```


    Let’s use these functions to refactor the previous transformations.


    ```

    function isEven(n){}


    function double(n){}


    const numbers = [1, 2, 3, 4];


    const filterTransducer = filter(isEven);


    const mapTransducer = map(double);


    const newNumbers = numbers


    .reduce(


    filterTransducer(


    mapTransducer(toArrayReducer)


    ),


    []);


    //[4, 8]

    ```


    The functions created by `filter` and `map` are called transducers. A transducer
    takes a reducer and returns a new reducer. In other words, a transducer is a function
    that takes a reducer function as input and returns a new reducer function. A transducer
    is a higher-order function.


    The transformation may look better if we use the `compose` utility. Below is an
    example where the `filter` and `map` transducers are applied to the `toArrayReducer`
    reducer. We end up with one reducer doing all the necessary transformations.


    ```

    import { compose } from ''lodash/fp'';


    const newReducer = compose(


    filter(isEven),


    map(double)


    )(toArrayReducer);

    ```


    We can then apply this reducer to the original array.


    ```

    const newNumbers = numbers.reduce(newReducer, []);

    ```


    Transducers come with their overhead. They need to iterate through all the items
    at each transformation because the `reduce` method does not stop. They need to
    work on a primary reducer, so an initial transformation that was not required
    before is needed now. Nevertheless, they give us an insight on how to chain transformations
    without creating additional collections.


    ### Sequence


    Lazy sequences allow us to efficiently chain transformation methods like `map`
    and `filter` without creating intermediate collections. We are going to look at
    the lazy sequence provided by Immutable.js called `Seq`.


    The `Seq` collection is immutable. Once created, it cannot be modified. Any “change”
    operation returns a new `Seq`.


    Here is an example where an array is converted to a sequence and then transform
    without creating other intermediate arrays.


    ```

    import { Seq } from ''immutable'';


    function isEven(n){


    return n % 2 === 0;


    }


    function double(n){


    return n * 2;


    }


    const sequence = Seq([ 1, 2, 3, 4])


    .filter(isEven)


    .map(double);

    ```


    Then we can convert back to an array data structure using the [toArray()](https://immutable-js.github.io/immutable-js/docs/#/Seq/toArray)
    method.


    ```

    const newArray = sequence.toArray();


    //[4, 8]

    ```


    Note that these conversions to the native array using `toArray` can be slow so
    once we created a sequence and made the transformations we should stick with it
    and use it.


    ### Range


    [Range](https://immutable-js.github.io/immutable-js/docs/#/Range) returns a sequence
    of numbers from start to the end. When called with no arguments it starts from
    `0`. When no end argument is provided it creates an infinite sequence. It also
    accepts a third argument, a `step`, defining the increment.


    `Range` is a lazy sequence that generates integer numbers in order. Here is an
    example of a `Range` generating the numbers `1`, `2`, `3`.


    ```

    import { Range } from ''immutable'';


    function logIdentity(n){


    console.log(n);


    return n;


    }


    Range(1, 4)


    .forEach(logIdentity);


    //1


    //2


    //3

    ```


    Now, look at an example of generating prime numbers. Check how we can refactor
    the `for` loop out using the `Range` sequence.


    ```

    for(let i=0; i<10; i++){


    if(isPrime(i)){


    console.log(i)


    }


    }


    //2


    //3


    //5


    //7


    function isPrime(number){


    if (number <= 1){


    return false;


    }


    for (let i=2; i<=number/2; i++){


    if (number % i === 0 ){


    return false;


    }


    }


    return true;


    }

    ```


    We can start by replacing the first loop printing the numbers to the console.


    ```

    import { Range } from "immutable";


    Range(0, 10)

    ```

