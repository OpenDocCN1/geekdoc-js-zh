    return model;


    }


    }That’s it. We manage to make make a fetch call and display the results on the
    screen using only pure functions. We can do it because we have at our disposal
    a set of libraries that handle the impure logic.Note the data flow in this application:


    *   clicking on the refresh button creates a message describing a fetch request


    *   the Axios middleware intercepts the message, makes the fetch call and creates
    a new success message with the result


    *   the update function handles the success message by creating a new model with
    the previous result


    ![](Image00014.jpg)When you think about, this logic for retrieving data has three
    impure parts:


    *   fetching the data from a Web API


    *   updating the model object


    *   rendering the data on the screen


    The Redux-Axios middleware enabled us to make fetch requests using pure functions
    creating fetch commands. Redux offers a solution to update the model using pure
    functions. React gives a solution to update the UI using pure view functions.
    It helps but these are not the only kinds of impure logic we can write. There
    are many more like coordinating several network requests, creating timer events,
    generating random numbers, getting the current time, writing to the console or
    to the local storage, and so on. We call them side-effects.In JavaScript at the
    moment of writing the best libraries for writing applications in a functional
    style, React and Redux, still require to write impure logic. In this case, we
    need to aim for a high percentage of pure functions. 80% is much better than 20%
    .ImmutabilityIt turns out that immutability is much easier to achieve. We can
    simply freeze objects at creation and they become immutable. Another simple solution
    is to use a linter to make sure no mutations are done in the application.Immutable
    data structures are available in libraries like Immutable.JS. They offer optimization
    improvements and a nicer public interface.We should not be concerned about creating
    intermediate collections when processing a list. When the list is small, less
    than a thousand records the difference is indistinguishable. When working with
    collections of thousands of objects we can start using sequences that do not create
    intermediate collections.PipelinesWe saw different ways of creating pipelines
    of data transformations from the pipe utility to the chaining transformations
    on arrays, immutable lists, sequences, promises, or observables.All these data
    structures wrap one or more values and allow us the create pipelines of pure functions
    transforming the wrapped data. Usually, there are a set of common transformations
    like filter , map , reduce , or sort that all these data structures support.The
    currying technique is useful in this case to pass additional arguments to the
    functions in the pipeline.Functional programming starts to be about transforming
    data with pipelines of pure functions. In a sense, functional programming promotes
    a data-flow programming style.LoopsPurely functional languages do not have loops.
    Such functionalities are implemented using the array methods and falling back
    to recursion for specific algorithms.At the moment of writing it is not possible
    to disable all loop statements in JavaScript because it lacks the [tail-call](https://en.wikipedia.org/wiki/Tail_call)
    implementation.NamingSplitting the application into pure functions is not enough.
    We need to give intention revealing names to those functions. So take your time
    to do that. If you failed the application will still be harder to understand.Folder
    StructureAs the application grows more and more functions will be created. You
    will need to find a way to structure these functions in modules. That means creating
    files with a clear name containing those functions. Then you need a way to structure
    those files in folders. There will be common functions and there will be functions
    used only in a specific module.Final ThoughtsAn application written in a functional
    style consists of numerous pure functions, organized into modules. We use these
    functions into pipelines and compose them to implement the required functionalitiesFunctional
    programing makes code easier to read. Programs that are not easily understood
    may lead to bugs and are most often remade.The essence of functional programming
    is transforming immutable data using pure functions. These transformations become
    more expressive in pipelines.What’s next?If you want to put in practice what you
    learned and build modern React applications using functional components and functional
    programming principles consider reading [Functional React, 2nd Edition](https://www.amazon.com/dp/B088FZQ1XN)
    .Continue your learning path with [Functional Architecture with React and Redux](https://www.amazon.com/dp/B0846NRJYR/ref=cm_sw_em_r_mt_dp_U_pztUEbV10W9GY)
    and use React and Redux to build several applications with an incremental level
    of complexity.The functional architecture implies getting the initial state, showing
    it to the user using the view functions, listening for actions, updating the state
    based on those actions, and rendering the updated state back to the user again.![](Image00015.jpg)Enjoy
    the Functional Programming with JavaScript and React book series!Table of Contents[Chapter
    01: Primitives](#text00005.html_a3DX)[Chapter 02: Immutable Data Objects](#text00006.html_a3DY)[Chapter
    03: Functions](#text00007.html_a3DZ)[Chapter 04: Arrays](#text00008.html_a3E0)[Chapter
    05: First-Class Functions](#text00009.html_a3E1)[Chapter 06: Statements](#text00010.html_a3E2)[Chapter
    07: Recursion](#text00011.html_a3E3)[Chapter 08: Pipelines and Currying](#text00012.html_a3E4)[Chapter
    09: Functors](#text00013.html_a3E5)[Chapter 10: Monads](#text00014.html_a3E6)[Chapter
    11: Immutable Collections](#text00015.html_a3E7)[Chapter 12: Lazy Transformations](#text00016.html_a3E8)[Chapter
    13: Generators](#text00017.html_a3E9)[Chapter 14: Promises](#text00018.html_a3EA)[Chapter
    15: Observables](#text00019.html_a3EB)[Chapter 16: Elm Architecture](#text00020.html_a3EC)[Chapter
    17: Functional Paradigm](#text00021.html_a3ED)'
