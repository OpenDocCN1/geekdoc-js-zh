  trans: "\n\n# 第 16 章：Elm 架构\n\n`.pipe(\n  mergeMap(x => f(x).pipe(mergeMap(g)))\n\
    )`\n\n`//Observable 4Observables are monads.`  \n`RecapObservables` 是数据流。这些 observable\
    \ 的消费者是订阅这些流的观察者。像 `of`、`from`、`interval` 或 `ajax` 这样的创建函数会生成新的 observable。  \n\
    Observable 为执行异步任务提供了解决方案，同时还拥有一组强大的操作符来处理结果。像 `filter`、`map` 或 `take` 这样的可管道操作符接收一个\
    \ observable 作为输入，并返回另一个发出转换后值的 observable。  \n发出其他 observable 的 observable 被称为高阶\
    \ observable。像 `concatAll`、`mergeAll`、`mergeMap` 这样的扁平化操作允许我们将高阶 observable 转换为普通\
    \ observable。\n\n接下来，我们将学习如何通过构建一个使用 [Elm](https://guide.elm-lang.org/) 纯函数式语言的简单应用，来以函数式风格创建应用。然后，我们将使用\
    \ [React](https://reactjs.org/) 和 [Redux](https://redux.js.org/) 实现相同的功能。关键在于理解支持这种编程风格的架构。\n\
    \n首先创建 Elm 项目。导航到一个新文件夹，并通过运行以下命令创建 Elm 项目：\n\n```\nelm init\n```\n\n该命令会创建一个\
    \ `elm.json` 文件和一个用于存放所有 Elm 文件的 `src` 文件夹。  \n`elm reactor` 会启动开发服务器。它在 `http://localhost:8000`\
    \ 启动一个服务器。从那里我们可以导航到任何 Elm 文件。\n\n## Elm 架构\n\nElm 架构定义了 Elm 应用内部的数据流。它将应用分解为以下核心部分：\n\
    \n* **模型（Model）**——定义应用的所有状态。\n* **视图（View）**——是一个纯函数，将状态数据转换为 HTML。HTML 会发送回消息。\n\
    * **消息（Messages）**——表达用户交互。\n* **更新（Update）**——是一个纯函数，根据当前消息和实际状态返回新状态。\n\n![](img/Image00012.jpg)\n\
    \n在接下来的示例中，我们将使用这种架构模式来创建一些功能。\n\n## 使用 Elm 实现计数器\n\n让我们实现一个简单的计数器页面，并讨论 Elm 架构。\n\
    \n### 模型\n\n模型存储所有可以改变的应用数据。在我们的例子中，我们只需要存储一个数字来反映当前计数。  \n该计数器的初始值为 `0`。\n\n\
    ```\ntype alias Model = {\n  number : Int\n}\n\ninitialModel : Model\ninitialModel\
    \ = { number = 0 }\n```\n\n### 消息\n\n消息定义用户交互。用户可以增加或减少计数，因此我们需要两个消息来表达这些操作。\n\
    \n```\ntype Msg = Increment | Decrement\n```\n\n### 视图函数\n\n视图函数接收 `Model` 作为参数，并将其显示在屏幕上。视图函数创建\
    \ HTML。  \nHTML 包含一个生成 `Decrement` 消息的减号按钮，一个生成 `Increment` 消息的加号按钮，以及当前计数。计数数字从模型中读取，转换为字符串，然后作为文本渲染在\
    \ `div` 元素内。  \n消息通过处理每个按钮的 `onClick` 事件来生成。\n\n```\nview : Model -> Html Msg\n\
    view model =\n  div []\n    [\n      div [] [ text (String.fromInt model.number)\
    \ ]\n    , button [ onClick Decrement ] [ text \"-\" ]\n    , button [ onClick\
    \ Increment ] [ text \"+\" ]\n    ]\n```\n\n### 更新函数\n\n更新函数描述了在收到新消息时如何改变模型。\
    \  \n当收到 `Increment` 消息时，它返回一个数字递增的新模型。当收到 `Decrement` 消息时，它返回一个数字递减的新模型。\n\n\
    ```\nupdate : Msg -> Model -> Model\nupdate msg model =\n  case msg of\n    Increment\
    \ ->\n      { model | number = model.number + 1 }\n    Decrement ->\n      { model\
    \ | number = model.number - 1 }\n```\n\n初始数字为零，当用户按下不同按钮时，它会增加或减少。\n\n### 连接\n\
    \n`main` 值描述了屏幕上显示的内容。它需要初始模型、生成 HTML 的视图函数以及改变模型的更新函数。\n\n```\nimport Browser\n\
    import Html exposing (Html, button, div, text)\nimport Html.Events exposing (onClick)\n\
    \n//Code\nmain =\n  Browser.sandbox {\n    init = initialModel,\n    update =\
    \ update,\n    view = view\n  }\n```\n\n视图函数接收初始模型并显示在屏幕上。用户操作生成消息。更新函数处理这些操作并更新模型。当模型改变时，视图函数被调用来在屏幕上渲染新模型。这个流程无限循环。\n\
    \n## 使用 React 和 Redux 实现计数器\n\n现在让我们用 JavaScript 结合 React 和 Redux 实现相同的计数器页面。\n\
    \n### 模型\n\n模型定义所有应用数据。我们可以将计数器定义为应用状态对象上的 `number` 属性。\n\n```\nconst initialModel\
    \ = {\n  number: 0\n};\n```\n\n### 消息\n\n用于增加和减少计数的两个消息可以表示为创建具有 `type` 属性的普通数据对象的函数。\n\
    \n```\nfunction Increment(){\n  return {\n    type : Increment.name\n  }\n}\n\n\
    function Decrement(){\n  return {\n    type : Decrement.name\n  }\n}\n\nexport\
    \ { Increment, Decrement };\n```\n\n### 视图函数\n\n视图函数可以使用 [React 函数组件](https://reactjs.org/docs/components-and-props.html)\
    \ 来实现。这些组件返回一种类似 HTML 的语法，称为 [JSX](https://reactjs.org/docs/introducing-jsx.html)。\n\
    \n```\nimport React from 'react';\nimport { connect } from 'react-redux';\nimport\
    \ { Increment, Decrement } from './store';\n\nfunction Counter({number, Increment,\
    \ Decrement}){\n  return(\n    <div>\n      <div>{number}</div>\n      <button\n\
    \        type=\"button\"\n        onClick={Decrement}>-</button>\n      <button\n\
    \        type=\"button\"\n        onClick={Increment}>+</button>\n    </div>\n\
    \  )\n}\n\nexport default connect(\n  state => state,\n  {Increment, Decrement}\n\
    )(Counter);\n```\n\n### 更新函数\n\n更新函数接收当前模型和消息，并返回新模型。\n\n```\nfunction reducer(model\
    \ = initialModel, action){\n  switch(action.type){\n    case Increment.name:\n\
    \      return { ...model, number: model.number + 1 };\n    case Decrement.name:\n\
    \      return { ...model, number: model.number - 1 };\n    default:\n      return\
    \ model;\n  }\n}\n\nexport { reducer };\n```\n\n### 连接\n\n我们可以在应用入口文件 `index.js`\
    \ 中连接所有这些部分。在这里我们指定初始状态、视图和更新函数。\n\n```\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport { createStore } from 'redux';\nimport { Provider }\
    \ from 'react-redux';\nimport Counter from './Counter';\nimport { reducer } from\
    \ './store';\n\nconst store = createStore(reducer);\n\nReactDOM.render(\n  <React.StrictMode>\n\
    \    <Provider store={store}>\n      <Counter />\n    </Provider>\n  </React.StrictMode>,\n\
    \  document.getElementById('root')\n);\n```\n\n## 使用 Elm 生成随机数\n\n接下来，我们将创建另一个显示随机数的页面。这可能看起来比之前的功能更简单，但实际上更难实现，因为生成随机数无法通过纯函数完成。\
    \  \n纯函数是确定性函数。使用相同的输入调用时，它们总是返回相同的输出。Elm 是一种纯函数式语言。这意味着它只允许我们编写纯函数。那么，如何既能生成随机数又能只编写纯函数呢？让我们一探究竟。\n\
    \n### 模型\n\n同样，我们需要一个模型来存储可以改变的应用数据。该模型只包含一个数字。\n\n```\ntype alias Model = {\n\
    \  number : Int\n}\n\ninitModel : () -> (Model, Cmd Msg)\ninitModel _ =\n  ( Model\
    \ 0\n  , Cmd.none\n  )\n```\n\n### 消息\n\n用户可以按下生成按钮，因此我们需要一个消息来表达该交互，即 `GenerateNumber`。\n\
    \n```\ntype Msg = GenerateNumber\n```\n\n### 视图\n\n视图函数接收模型并渲染 UI。它在 `div` 元素内显示模型中存储的当前数字。它还显示用于生成新数字的按钮。当按下按钮时，会创建\
    \ `GenerateNumber` 消息。\n\n```\nview : Model -> Html Msg\nview model =\n  div []\n\
    \    [\n      div [] [ text (String.fromInt model.number) ]\n    , button [ onClick\
    \ GenerateNumber ] [ text \"Generate\" ]\n    ]\n```\n\n"
- fmt: "\n# Update\n\nThe update function takes the current messages and generates\
    \ the new model. The update function is pure. It cannot generate a random number.\
    \ Instead what it does is to create a command telling the Elm framework to generate\
    \ the random number and then put the result inside a new message. We are going\
    \ to call this new message `SetNumber`. At this point we realize that messages\
    \ can take arguments, messages can be functions.\n\n```\ntype Msg = GenerateNumber\
    \ | SetNumber Int\n```\n\nIn order to use the `Random.generate` command we need\
    \ to install an additional package. `elm install elm/random`\n\nHere is the update\
    \ function handling both messages.\n\n```\nupdate : Msg -> Model -> (Model, Cmd\
    \ Msg)\n\nupdate msg model =\n  case msg of\n    GenerateNumber ->\n      ( model\n\
    \      , Random.generate SetNumber (Random.int 1 100)\n      )\n    SetNumber\
    \ number ->\n      ( Model number\n      , Cmd.none\n      )\n```\n\nWhen the\
    \ update function receives the `GenerateNumber` message, it creates a command\
    \ using the `Random.generate` function. The Elm framework runs the command, generates\
    \ the random number, and builds a new message `SetNumber` containing this random\
    \ number. The update function does not modify the model in this case, it returns\
    \ the same model.\n\nWhen the update function receives the `SetNumber` messages\
    \ with the random number it returns a new model containing the newly generated\
    \ number. The update function does not generate any command in this case, it returns\
    \ `Cmd.none`.\n\nAs noticed in order to work with impure logic the update function\
    \ returns two things for each message, the new model and a new command that the\
    \ Elm framework has to execute.\n\nHere is how we can write a function that returns\
    \ two values in JavaScript. We simply return an array containing the two values.\
    \ Then we use the [destructuring assignment](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment)\
    \ syntax on the left-hand side of the assignment to unpack the returned values.\n\
    \n```\nfunction update(model, action){\n  switch(action.type){\n    case 'GenerateNumber'\
    \ : {\n      const command = {\n        name: 'Random.generate',\n        resultMessage\
    \ : 'SetNumber'\n      };\n      return [model, command];\n    }\n    case 'SetNumber'\
    \ : {\n      const newModel = { ...model, number: action.payload };\n      const\
    \ command = { name: 'Cmd.none' };\n      return [newModel, command];\n    }\n\
    \    default : {\n      const command = { name: 'Cmd.none' };\n      return [model,\
    \ command];\n    }\n  }\n}\n\nconst [model, command] = update({}, 'GenerateNumber');\n\
    console.log(model);\nconsole.log(command);\n//{}\n//{name: \"Cmd.none\"}\n```\n\
    \nNote that a command is a plain object describing the command to execute. Also,\
    \ remark that we use curly brackets inside the switch branches to define a block\
    \ scope for each clause and allow declaring variables with the same name in different\
    \ branches.\n\nBelow is how the data flow looks like when using commands for handling\
    \ impure logic.\n\n![](Image00013.jpg)\n\n# Random Number with React and Redux\n\
    \nNow let’s implement the same functionality in JavaScript.\n\n## Model\n\nWe\
    \ start by defining the model as an object with the number property set to 0.\n\
    \n```\nconst initialModel = {\n  number: 0\n};\n```\n\n## Commands\n\nThis is\
    \ the point where we have problems generating random numbers and still using pure\
    \ functions. Redux allows us to define a place where to put such impure logic\
    \ but has no solution to avoid it altogether.\n\nWe are going to follow the Redux\
    \ pattern and define `GenerateNumber` as function returning another function.\
    \ The returned function is called a thunk and contains the impure logic. The result\
    \ of this impure logic will be passed as an argument to the `SetNumber` message.\n\
    \n```\nfunction GenerateNumber(){\n  return function(dispatch){\n    const number\
    \ = Math.floor(Math.random() * 100);\n    dispatch(SetNumber(number));\n  }\n\
    }\n```\n\n## Messages\n\nThe `SetNumber` message is needed by the `GenerateNumber`\
    \ command to send the newly generated number.\n\n```\nfunction SetNumber(number){\n\
    \  return {\n    type : SetNumber.name,\n    number\n  }\n}\n```\n\n## View\n\n\
    The view function takes the model and creates the HTML for it. When the generate\
    \ button is pressed it dispatches the `GenerateNumber` command.\n\n```\nimport\
    \ React from 'react';\nimport { connect } from 'react-redux';\nimport { GenerateNumber\
    \ } from './store';\n\nfunction Counter({number, GenerateNumber}){\n  return(\n\
    \    <div>\n      <div>{number}</div>\n      <button\n        type=\"button\"\n\
    \        onClick={GenerateNumber}>Generate</button>\n    </div>\n  )\n}\n\nexport\
    \ default connect(\n  state => state,\n  { GenerateNumber }\n)(Counter)\n```\n\
    \n## Update\n\nThe update function handles the application messages. When the\
    \ `SetNumber` message is received it returns a model with the new number value.\n\
    \n```\nfunction reducer(model = initialModel, action){\n  switch(action.type){\n\
    \    case SetNumber.name:\n      return { ...model, number: action.number };\n\
    \    default:\n      return model;\n  }\n}\n```\n\n# Recap\n\nThe Elm architecture\
    \ defines the flow that allows us to write a practical application in a functional\
    \ style.\n\nThe model is an immutable object representing all the application\
    \ state.\n\nThe view function is a pure function building the HTML and creating\
    \ messages. The view function is not responsible for rendering HTML on a screen.\
    \ It takes a model and returns HTML. The Elm framework uses the view function\
    \ to render this HTML on the screen.\n\nMessages are requests to modify the application’s\
    \ model.\n\nThe update function is a pure function taking in the current model\
    \ and a message and returning the new model. When dealing with side-effects it\
    \ also returns a new command. The update function doesn’t effectively change the\
    \ model. The Elm framework uses the update function to change the model. The Elm\
    \ framework executes the command returned by the update function and creates a\
    \ new message with the result.\n\n# Chapter 17: Functional Paradigm\n\nNow we\
    \ are going to look back at what it means to program in a functional style.\n\n\
    The main idea in functional programming is to split the application into small\
    \ pure functions that communicate using immutable data and then compose these\
    \ functions to implement the required functionality.\n\nIdeally, all the functions\
    \ in the application should be pure functions.\n\n## Purity\n\nAs repeated many\
    \ times, the point of functional programming is to write pure functions. These\
    \ are functions that just transform values.\n\nWhen a pure function returns the\
    \ application has the same state as when the function was called. An application\
    \ is much easier to understand when we don’t have to track variables changing\
    \ their values. Pure functions make code easier to follow by allowing us to focus\
    \ our attention in one place.\n\nThe challenge is, of course, to create a practical\
    \ application doing only transformations with pure functions. Is that even possible?\n\
    \nWe saw that it is achievable if we have the right framework using these pure\
    \ functions and doing the impure logic necessary for a practical application.\
    \ Such architecture was implemented in Elm.\n\nHere is the flow of executing impure\
    \ logic in Elm:\n\n*   The pure update function creates a command describing the\
    \ impure logic\n*   The Elm framework takes the command, runs the impure logic\
    \ and generates a message containing the result\n*   The pure update function\
    \ handles this message by creating a new updated model holding the previous result\n\
    \nThis kind of approach requires having functions to create commands for any kind\
    \ of impure logic and using a framework able to understand those commands.\n\n\
    Next, we are going to look at a similar approach for making a fetch call with\
    \ React and Redux using only pure functions. The fetch call itself is a side-effect,\
    \ so invoking it in a function makes that function impure.\n\nLuckily for us,\
    \ there is a [Redux middleware](https://redux.js.org/advanced/middleware), called\
    \ [Axios middleware](https://github.com/svrcekmichal/redux-axios-middleware) that\
    \ can intercept fetch messages, do the fetch call, and then put the result in\
    \ a new success message.\n\nLet’s look at the parts required to implement this\
    \ functionality.\n\nThe model initially stores just an empty list of to-dos.\n\
    \n```\nconst initialModel = {\n  todos: []\n};\n```\n\nThe message object describing\
    \ the fetch request is created using the `LoadTodos` pure function.\n\n```\nfunction\
    \ LoadTodos(){\n  return {\n    type: LoadTodos.name,\n```\n"
