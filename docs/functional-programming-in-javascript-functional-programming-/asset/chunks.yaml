  trans: "\n\n`x = '';` 当变量存储的值发生变化时，变量的类型也可能随之改变。动态类型意味着变量的类型可以在运行时改变。这种情况只发生在使用\
    \ `let` 或 `var` 声明的变量上。`const` 声明的变量无法重新赋值，因此其类型也不能改变。\n\n## 回顾\n数字、字符串、布尔值、`null`\
    \ 和 `undefined` 是原始值。原始值是不可变的。值可以存储在变量中。变量会推断其所存储值的类型。\n\n## 第 02 章：不可变数据对象\n\
    接下来，我们将了解什么是对象，以及如何创建和使用不可变对象。在函数式编程中，我们将对象用作数据结构。它们存储数据，并且没有行为。\n\n### 对象\n对象是属性的集合。每个属性都有一个键和一个值。在控制台中查看一个对象。\n\
    \n```javascript\nconst book = {\n  title : 'JavaScript Allongé',\n  author: 'Reginald\
    \ Braithwaite',\n  category: 'JavaScript'\n};\nconsole.log(book);\n```\n\n键是一个字符串，在集合中是唯一的。它区分大小写。我们可以使用点号表示法或方括号表示法来访问属性。\n\
    \n```javascript\nconsole.log(book.title);\n//\"JavaScript Allongé\"\nconsole.log(book[\"\
    title\"]);\n```\n\n### 不可变性\n不可变性是函数式编程的核心原则之一。变异意味着改变。说我们更改了对象的属性，等同于说我们变异了该对象。一个不可变对象一旦创建就不能被更改。JavaScript\
    \ 对象并非如此。它们可以被修改。它们不是不可变的。请看下面的例子：\n\n```javascript\nlet fruit = {\n  name: 'Apple'\n\
    };\nfruit.name = 'Orange'\n//{name : 'Orange'}\n```\n\n如你所见，我们可以更改现有的 `fruit`\
    \ 对象。即使使用 `const` 关键字声明，也会发生同样的情况。\n\n```javascript\nconst fruit = {\n  name:\
    \ 'Apple'\n};\nfruit.name = 'Orange'\n// {name : 'Orange'}\n```\n\n`const` 关键字指的是变量，而不是它存储的值。这意味着该变量不能被重新赋值。当它存储的值是不可变时，它才真正成为常量。\n\
    \n### 冻结\n为了创建不可变对象，我们可以在创建时将其冻结。\n\n```javascript\nconst fruit = Object.freeze({\n\
    \  name: 'Apple'\n});\nfruit.name = 'Orange'\n// Cannot assign to read only property\
    \ 'name' of object\n```\n\n唯一的限制是 `Object.freeze` 执行的是浅冻结。它只影响对象的直接属性，即树中第一层的属性。例如，如果这些属性中的某一个包含另一个对象，则该对象不会受到影响。请看下面的例子。\n\
    \n```javascript\nconst book = Object.freeze({\n  name: \"How JavaScript Works\"\
    ,\n  author: {\n    firstName: 'Douglas',\n    lastName: 'Crockford'\n  }\n});\n\
    book.author.firstName = '';\n```\n\n`book` 对象被更改了。我们不能给 `author` 属性重新赋值一个新对象，但可以修改它的属性。对于包含其他对象的对象，我们应该使用\
    \ [deepFreeze()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze)\
    \ 工具函数。它会冻结给定对象内部所有对象的所有属性。\n\n### 代码检查\n启用不可变性的另一种方法是使用代码检查工具，例如 [ESLint](https://eslint.org/)。有几个插件可以帮助我们强制实现不可变对象。这些插件包括\
    \ [eslint-plugin-functional](https://www.npmjs.com/package/eslint-plugin-functional)、[eslint-plugin-fp](https://www.npmjs.com/package/eslint-plugin-fp)\
    \ 或 [eslint-plugin-immutable](https://www.npmjs.com/package/eslint-plugin-immutable)。我们将使用\
    \ [eslint-plugin-functional](https://www.npmjs.com/package/eslint-plugin-functional)。\n\
    \n```bash\nnpm install eslint-plugin-functional --save-dev\n```\n\n安装插件后，修改 lint\
    \ 配置文件 `.eslintrc.json` 以启用不可变数据。\n\n```json\n\"plugins\": [\n  \"functional\"\
    \n],\n\"rules\": {\n  \"functional/immutable-data\": \"error\"\n}\n```\n\n此时，尝试更改、删除或向对象添加属性将导致错误。\n\
    \n```javascript\nconst counter = {\n  value: 1\n};\ncounter.value = 2;\ndelete\
    \ counter.value;\nObject.assign(counter, { value: 2 });\n//Modifying properties\
    \ of existing object not allowed.\n```\n\n### 使用不可变对象\n接下来，让我们看看如何“更改”不可变对象。更改不可变对象意味着创建一个更改后的副本。为此，使用[展开运算符语法](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax)非常有用。\n\
    \n#### 更改属性\n以下是修改现有属性的示例：\n\n```javascript\nconst product = {\n  name: 'Apple',\n\
    \  quantity: 1\n};\nconst newProduct = {\n  ...product,\n  quantity: 2\n};\n```\n\
    \n通过使用展开语法，我们首先复制了 `product` 对象的所有属性，然后添加了需要更改的属性及其新值。\n\n#### 添加属性\n添加新属性可以用类似的方式完成。我们克隆对象，然后向其添加额外的属性。在下一个示例中，`product`\
    \ 对象被克隆，并添加了 `type` 属性。\n\n```javascript\nconst product = {\n  name: 'Apple',\n\
    \  quantity: 1\n};\nconst newProduct = {\n  ...product,\n  type: 'fruit'\n};\n\
    ```\n\n#### 删除属性\n可以使用[解构语法](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment#Rest_in_Object_Destructuring)中的剩余运算符来删除属性。在下一个示例中，通过解构并忽略\
    \ `quantity` 属性，将其从新 product 对象中移除。\n\n```javascript\nconst product = {\n  name:\
    \ 'Apple',\n  quantity: 1\n};\nconst {\n  quantity,\n  ...newProduct\n} = product;\n\
    console.log(newProduct);\n//{name: \"Apple\"}\n```\n\n从现在开始，在接下来的示例中，默认已通过代码检查工具启用了不可变性。\n\
    \n### 回顾\n不可变对象在创建后不能被更改。我们可以通过冻结对象或使用代码检查工具来启用不可变对象。展开运算符对于创建现有对象的更改副本非常方便。\n\
    \n## 第 03 章：函数\n函数是我们定义和封装逻辑的主要方式。函数有一个参数列表和一个语句体。根据函数的创建方式，它可能有一个名称。大多数情况下，我会尽量使用命名函数。让我们看看定义函数的主要方式。\n\
    \n### 函数声明\n可以使用 `function` 关键字声明来创建函数，后面跟着函数名称和参数列表。函数体放在花括号内。\n\n```javascript\n\
    function sum(x, y){\n  return x + y;\n}\n```\n\n函数可以通过函数名后跟括号内的参数列表来调用。\n\n```javascript\n\
    sum(1,2)\n//3\n```\n\n如果没有传入值或传入 `undefined`，函数参数可以使用默认值进行初始化。在下面的示例中，如果在调用 `increment`\
    \ 函数时没有为 `step` 参数提供值，它将默认为 `1`。\n\n```javascript\nfunction increment(n, step\
    \ = 1){\n  return n + step\n}\nconst n = 1;\nconsole.log(increment(n));\n//2\n\
    console.log(increment(n, 2));\n//3\n```\n\n以这种方式创建的函数会被提升到其作用域的顶部，因此可以在声明之前使用它们。函数的作用域可以是一个模块，也可以是定义当前函数的外部函数。\n\
    \n```javascript\nsum(1,2);\n//3\nfunction sum(x, y){\n  return x + y;\n}\n```\n\
    \n函数返回值。`return` 语句指定返回的值。它也会停止函数的执行。\n\n### 函数表达式\n`function` 关键字可用于在表达式内部定义函数。在函数声明中，`function`\
    \ 是行中的第一个关键字。如果不是这种情况，我们处理的就是函数表达式。对于函数表达式，名称是可选的，但在实现递归函数时，拥有名称会很方便。这是一个函数表达式。\n\
    \n```javascript\nconst sum = function(x, y){\n  return x + y;\n}\n```\n\n以下也是一个函数表达式。\n\
    \n```javascript\n!function start(){\n  console.log('start')\n}\n```\n\n一旦 `function`\
    \ 不是行中的第一个关键字，它就变成了函数表达式。函数名可以省略，并且可以自动执行。\n\n```javascript\n!function(){\n  console.log('start')\n\
    }();\n```\n\n"
- fmt: "\n# Arrow Function Expressions\n\nArrow function expressions are a compact\
    \ alternative to regular function expressions. The arrow function syntax consists\
    \ of a list of parameters followed by the `=>` symbol and then the body of the\
    \ function optionally enclosed within curly braces.\n\n```\nconst sum = (x, y)\
    \ => x + y;\nsum(1,2);\n```\n\nThere is no `function` keyword this time and no\
    \ `return` statement. The `=>` symbol points to what is returned.\n\nWhen the\
    \ logic inside the arrow function contains multiple statements we use curly braces.\
    \ This time the `return` statement is needed to return the result.\n\n```\nconst\
    \ sum = (x, y) => {\n  return x + y;\n}\n```\n\nBoth function expressions are\
    \ not hoisted to the top of their scope. They cannot be used before declaration.\n\
    \n## Arity\n\nThe arity of a function describes how many parameters the function\
    \ has.\n\n- A unary function has one parameter.\n- A binary function has two parameters.\n\
    - A n-ary function has n parameters.\n- A nullary function has no parameters.\n\
    \n## Pure Functions\n\nIn functional programming, functions are like mathematical\
    \ functions. They do computations. These kinds of functions are called pure functions.\n\
    \nPure functions calculate a new value based on the input parameters. They are\
    \ deterministic functions. That means they return the same result when called\
    \ with the same input. `Math.random` and `Date.now` are not deterministic functions\
    \ as they return a different result each time they are called. They cannot be\
    \ used inside pure functions.\n\nPure functions do not modify the external environment\
    \ in which the function was executed, so they do no write into the outer environment\
    \ or read data that can change from the outside.\n\nHere is an example of a pure\
    \ function.\n\n```\nconst number = 1.7654321;\nfunction roundNumber(n, precision\
    \ = 2) {\n  const noAsString = n.toFixed(precision);\n  return Number.parseFloat(noAsString);\n\
    }\nconsole.log(roundNumber(number));\n//1.77\n```\n\n`roundNumber` is a pure function\
    \ using other pure functions `toFixed` and `parseFloat`, to rounds a number to\
    \ n decimals.\n\nChanging data outside the local scope, reading data that can\
    \ change from the outside, or any alteration of the external environment is a\
    \ side-effect.\n\nFor the simple fact that they do only computations based on\
    \ their inputs and have no side-effects they are easier to understand, test, or\
    \ debug.\n\n`Math.min`, `Math.max`, `Math.sqrt` are pure functions. In fact, all\
    \ static methods from the `Math` object, with the `Math.random` exception, are\
    \ pure functions.\n\n## Recap\n\nFunctions can be created using the function declarations,\
    \ the function expressions, or the arrow function expressions. In functional programming,\
    \ functions should be like mathematical functions doing only computations without\
    \ changing the external environment.\n\n# Chapter 04: Arrays\n\nArrays are indexed\
    \ collections of values. Both arrays and objects are collections of values. In\
    \ fact, arrays are emulated using objects.\n\nWe simply create an array using\
    \ the array literal. Here is an example.\n\n```\nconst arr = [1, 2, 3];\n```\n\
    \nDetecting if a value is an array can be done with `Array.isArray`.\n\n```\n\
    Array.isArray(arr);\n//true\n```\n\nArrays have a set of methods for data transformations.\
    \ Data transformation is one of those tasks where functional programming really\
    \ shines. It makes these transformations easier to manage and understand. It does\
    \ that by identifying a core set of operations all transformations do like filtering,\
    \ mapping, sorting, and aggregating.\n\n## Filtering\n\nConsider the next example\
    \ selecting only the even numbers from an array.\n\n```\nconst numbers = [1, 2,\
    \ 3, 4];\nfunction isEven(n) {\n  return n % 2 == 0;\n}\nconst evenNumbers = numbers.filter(isEven);\n\
    console.log(evenNumbers);\n//[2, 4]\n```\n\nThe `filter` method loops throw all\
    \ the elements in the array and applies the `isEven` function. It creates a new\
    \ array containing only those elements for which the `isEven` function returns\
    \ `true`.\n\n![](Image00003.jpg)\n\n`isEven` is a predicate function. A predicate\
    \ function is a function taking an element and returning a boolean value. The\
    \ predicate is a unary function.\n\nNext, consider a list of game objects.\n\n\
    ```\nconst games = [\n  { title: 'Starcraft', genre: 'RTS' },\n  { title: 'Command\
    \ and Conquer',  genre: 'RTS' },\n  { title: 'Heroes of Might and Magic', genre:\
    \ 'TBS' },\n  { title: 'World of Warcraft', genre : 'MMORPG'}\n]\n```\n\nWe are\
    \ going to select only strategy games. For this, we will build a predicate function\
    \ taking a game object and deciding if it is a strategy game based on its `genre`\
    \ property.\n\n```\nfunction isStrategy(game) {\n  const strategyGenres = ['RTS',\
    \ 'RTT', 'TBS', 'TBT'];\n  return strategyGenres.includes(game.genre);\n}\n```\n\
    \nThe `includes` method checks if a value is in the array and returns `true` or\
    \ `false`.\n\nNow we can use `filter` with the predicate function to select only\
    \ the strategy games.\n\n```\nconst strategyGames = games.filter(isStrategy);\n\
    console.log(strategyGames);\n//[ { title: 'Starcraft', genre: 'RTS' },\n//  {\
    \ title: 'Command and Conquer', genre: 'RTS' },\n//  { title: 'Heroes of Might\
    \ and Magic', genre: 'TBS' } ]\n```\n\n## Mapping\n\nNext, we are going to apply\
    \ the mapping transformation on a list of numbers.\n\n```\nconst numbers = [1,\
    \ 2, 3, 4];\nfunction triple(n) {\n  return n * 3;\n}\nconst newNumbers = numbers.map(triple);\n\
    console.log(newNumbers);\n//[3, 6, 9, 12]\n```\n\nThe `map` method applies the\
    \ mapping function on all elements in the array and creates a new array with the\
    \ result.\n\n![](Image00004.jpg)\n\n`triple` is a mapping function. A mapping\
    \ function is a function that takes an element and transforms it into a new value.\
    \ It is a unary function.\n\nNext, let’s apply a mapping function on the list\
    \ of game objects.\n\n```\nconst games = [\n  { title: 'Starcraft', genre: 'RTS'\
    \ },\n  { title: 'Command and Conquer',  genre: 'RTS' },\n  { title: 'Heroes of\
    \ Might and Magic', genre: 'TBS' },\n  { title: 'World of Warcraft', genre : 'MMORPG'}\n\
    ]\n```\n\nThe following `toGameHtml` function takes a game object and creates\
    \ the HTML string for it.\n\n```\nfunction toGameHtml(game) {\n  return `<div>${game.title}</div>`;\n\
    }\n```\n\nTemplate strings allow us to insert variables into strings. They are\
    \ a better alternative to string concatenation. Variables inserted in template\
    \ strings are surrounded by `${}`. Template strings allow the text to span multiples\
    \ lines. This allows creating easier to read HTML strings.\n\n```\nfunction toGameHtml(game)\
    \ {\n  return `\n<div>\n  ${game.title}\n</div>`;\n}\n```\n\nWe can now use the\
    \ mapping function to transform all game objects into HTML strings.\n\n```\nconst\
    \ htmlRows = games.map(toGameHtml);\nconsole.log(htmlRows);\n//   [ '<div>Starcraft</div>',\n\
    //   '<div>Command and Conquer</div>',\n//   '<div>Heroes of Might and Magic</div>',\n\
    //   '<div>World of Warcraft</div>' ]\n```\n\nThe `join` method combines all elements\
    \ of an array into one string. It takes a separator as a parameter. If no argument\
    \ is provided it combines all elements without any separator.\n\n```\nconsole.log(htmlRows.join());\n\
    //\"<div>Starcraft</div>,<div>Command and Conquer</div>,\n//<div>Heroes of Might\
    \ and Magic</div>,\n//<div>World of Warcraft</div>\"\n```\n\n## Aggregating\n\n\
    Aggregation is about grouping multiple values into a single summary value.\n\n\
    Consider the following code.\n\n```\nconst numbers = [1, 3, 5, 7];\nfunction add(total,\
    \ n) {\n  return total + n;\n}\nconst total = numbers.reduce(add, 0);\nconsole.log(total);\n\
    //16\n```\n\nThe `reduce` method reduces a list to a single value. The `reduce`\
    \ method applies the reducer function for each element in the array to compute\
    \ the aggregate value. It can take a second parameter as the initial aggregate\
    \ value.\n\n`add` is the reducer function. The reducer function takes the current\
    \ aggregate value and the current element and returns the new aggregate value.\
    \ The reducer is a binary function.\n\n![](Image00005.jpg)\n\nIn the first iteration,\
    \ the aggregate value is `0` and the current element is `1`. Applying the reducer\
    \ results in a new aggregate value of `1`. In the fourth iteration, the current\
    \ aggregate value is `9` and the current element is `7`. Applying the reducer\
    \ results in the new aggregate value of `16`.\n\nLet’s get back to the game objects\
    \ array and compute the numbers of games for each genre.\n\n```\nconst games =\
    \ [\n  { title: 'Starcraft', genre: 'RTS' },\n```\n"
