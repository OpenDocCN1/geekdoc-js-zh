    { title: ''Command and Conquer'',  genre: ''RTS'' },

    { title: ''Heroes of Might and Magic'', genre: ''TBS'' },

    { title: ''World of Warcraft'', genre : ''MMORPG''}

    ];

    function countByGenre(countMap, game){

    const count = countMap[game.genre] || 0;

    return {

    ...countMap,

    [game.genre]: count + 1

    }

    }

    const gamesByGenreCounts = games

    .reduce(countByGenre, {});

    console.log(gamesByGenreCounts);

    //{ RTS: 2, TBS: 1, MMORPG: 1 }

    ```


    `countByGenre` is the reducer function. It starts with an empty object as the
    aggregate value and at each step increments the number of games for the genre
    of the current game. Changing the count on the aggregate object means creating
    an object with the new count.


    ## Sorting


    The `sort` method allows sorting an array.


    ```

    const numbers = [4, 2, 3, 1];

    function asc(a, b) {

    if(a === b){

    return 0

    } else {

    if (a < b){

    return -1;

    } else {

    return 1;

    }

    }

    }

    const sortedNumbers = numbers.slice().sort(asc);

    console.log(sortedNumbers);

    //[1, 2, 3, 4]

    ```


    The `sort` method does the sort using the compare function. The `asc` function
    is the compare function. It is a binary function. It takes two values and returns
    -1, 0, and 1. Consider the compare function taking two values `a` and `b`.


    * It returns 0 if the values are equal

    * It returns -1 if value `a` comes before value `b`

    * returns 1 if value `a` comes after value `b`


    `sort` is an impure method. It modifies the input array. This is why it gives
    a lint error. In order to do sorting, we need to clone the array first.


    ```

    const sortedNumbers = numbers.sort(asc);

    //Modifying an array is not allowed  functional/immutable-data

    const sortedNumbers = numbers.slice().sort(asc);

    const sortedNumbers = [...numbers].sort(asc);

    ```


    `slice` makes a copy of the array or a copy of a part of the array. Calling `slice`
    with no arguments makes a copy of the array. The first parameter is the start
    index. The second parameter is the ending index.


    ## Searching


    `find` returns the first element that matches the predicate function. `find` returns
    the first match and stops. `filter` never stops and returns an array with all
    matches. `find` is faster than `filter`.


    `findIndex` returns the index of the first match.


    `every` returns true if all elements match the predicate function. It stops at
    the first element that doesn’t match and returns false.


    `some` returns true if at least one element matches the predicate function. It
    stops at the first match.


    All these four methods use a predicate function and stop based on the returned
    value.


    ```

    const games = [

    { title: ''Starcraft 2'', genre: ''RTS'' },

    { title: ''Desperados 3'', genre : ''RTT''},

    { title: ''Candy Crush Saga '', genre : ''Tile-matching''}

    ];

    function isStrategy(game){

    const strategyGenres = [''RTS'', ''RTT'', ''TBS'', ''TBT''];

    return strategyGenres.includes(game.genre);

    }

    const first = games.find(isStrategy);

    console.log(first);

    //{ title: ''Starcraft 2'', genre: ''RTS'' }

    const firstIndex = games.findIndex(isStrategy);

    console.log(firstIndex);

    //0

    const areAll = games.every(isStrategy);

    console.log(areAll);

    //false

    const hasOne = games.some(isStrategy);

    console.log(hasOne);

    //true

    ```


    ## forEach


    `forEach` takes a function and calls it with each element in the array. It calls
    the function with the current element as the first argument and with the current
    index as the second argument. `forEach` never stops and processes the whole list.
    It ignores the returned value.


    ```

    const numbers = [1, 2, 3]

    function log(value){

    console.log(value);

    }

    numbers

    .forEach(log);

    //1

    //2

    //3

    ```


    ## Impure Operations


    When enabling the immutable data lint rule for objects we also force arrays to
    act as immutable structures.


    ```

    "functional/immutable-data": "error"

    ```


    It means that all the impure methods trying to modify the array like `push`, `pop`,
    `unshift`, or `shift` will result in lint errors.


    `push` adds elements to the end of an array and returns the new length of the
    array. `pop` removes and returns the last element from an array. `unshift` adds
    elements to the beginning of an array and returns the new length of the array.
    `shift` removes and returns the first element from an array.


    ```

    const arr = [1, 2, 3];

    arr.push(4);

    arr.pop();

    arr.unshift(0);

    arr.shift();

    //Modifying an array is not allowed

    ```


    ## Changing Arrays


    Next, look at how we can do the basic add, edit, and remove operations on an immutable
    array. Consider the array of game objects.


    ```

    const games = [

    {id: 1, title: ''WarCraft''},

    {id: 2, title: ''X-COM: UFO Defense'' }

    ]

    ```


    ### Adding


    `concat` takes one or more arrays and concatenates them together. It can be used
    for adding. It creates a new array with the new value.


    ```

    const newValue = {id: 3, title: ''The Settlers''};

    const newGames = games.concat([newValue]);

    console.log(newGames);

    console.log(newGames);

    //[ { id: 1, title: ''WarCraft'' },

    //  { id: 2, title: ''X-COM: UFO Defense'' },

    //  { id: 3, title: ''The Settlers'' } ]

    ```


    The other option for adding a value to an array is to use the spread operator.
    Here is an example.


    ```

    const newGames = [...games, newValue];

    ```


    ### Editing


    Changing means creating a new array containing the new value at the designated
    index position. We can use `map` for this. The mapping function returns the new
    value for the specified index otherwise it returns the existing value. Below is
    an example of changing the game object at index 1.


    ```

    const id = 1;

    const newValue = { id, title: ''WarCraft 2'' };

    const newGames = games.map(game =>

    (game.id === id)

    ? newValue

    : game

    );

    console.log(newGames);

    //[ { id: 1, title: ''WarCraft 2'' },

    //  { id: 2, title: ''X-COM: UFO Defense'' } ]

    ```


    ### Removing


    We can remove an element from an array using `filter`. It returns a new array
    excluding the element at the specified index.


    ```

    const id = 1;

    const newGames = games.filter(game => game.id !== id);

    console.log(newGames);

    //[ { id: 2, title: ''X-COM: UFO Defense'' } ]

    ```


    ## Recap


    `filter` selects the elements from the array that pass the predicate function.
    `map` transform all elements in the array using a mapping function and creates
    a new array with the results. `reduce` reduces the array to a single value using
    a reducer function. `sort` sorts the elements of an array using a compare function.


    ## Chapter 05: First-Class Functions


    A language has first-class functions when it treats functions as any other values.
    In JavaScript, functions can be used like other values. In fact, functions are
    objects and thus values.


    ### First-Class Functions


    Functions can be stored in variables. We already saw such a case before.


    ```

    const square = x => {

    return x * x;

    }

    ```


    Here, we define a function using the arrow function expression and then store
    the function in the `square` variable. The function infers the name of the variable.
    Then we can use the variable to invoke the function by adding parentheses `()`
    at the end.


    ```

    square(3);

    //9

    ```


    Functions can be put in data structures like arrays. Look at the next example.


    ```

    function toUpperCase(text){

    return text.toUpperCase();

    }

    function toLowerCase(text){

    return text.toLowerCase();

    }

    function trim(text){

    return text.trim();

    }

    const functions = [

    toUpperCase,

    toLowerCase,

    trim

    ];

    const text = ''  StARt!'';

    functions.forEach(f => {

    const newText = f(text);

    console.log(newText);

    });

    //"START!"

    //"start!"

    //"StARt!"

    ```


    In this example, we define three functions and then put them into an array called
    `functions`. We then iterate through the array and call each function with a `text`
    argument. The result is displayed in the console.


    When we use the function name without parentheses we refer to the function itself.
    When we put parentheses after the function name we refer to the result of calling
    the function.


    Functions can be passed as arguments to other functions. In the next example,
    we define two functions `sum` and `multiply` and send them as an argument to another
    function called `doOperation`.


    ```

    function sum(a, b){

    return a + b;

    }

    function multiply(a, b){

    return a * b;

    }

    function doOperation(operation, a, b){

    return operation(a,b)

    }

    doOperation(sum, 2, 3);

    //5

    doOperation(multiply, 2, 3);

    ```

