  trans: "\n\n`.filter(isPrime)`\n\n`.forEach(log);`\n\n```\nfunction isPrime(number){\
    \ }\n```\n\n```\nfunction log(number) {\n  console.log(number);\n}\n```\n\n`Range(0,\
    \ 10)` 生成从 0 到 9 的所有数字，然后使用 `filter` 筛选出所有质数，并返回一个仅包含这些数字的新序列。接着我们使用 `forEach`\
    \ 来显示这些数字。\n\n下面我们来看如何利用 `Range` 序列重构检测质数的循环。\n\n```\nimport { Range } from 'immutable';\n\
    \nRange(0, 10)\n  .filter(isPrime)\n  .forEach(log);\n\nfunction isPrime(number)\
    \ {\n  if (number > 2) {\n    const firstDivisor = findFirstDivisor(number);\n\
    \    return !firstDivisor;\n  } else {\n    return (number === 2)\n      ? true\n\
    \      : false;\n  }\n}\n\nfunction findFirstDivisor(number) {\n  return Range(2,\
    \ (number / 2) + 1)\n    .find(isDivisorOf(number));\n}\n\nfunction isDivisorOf(number)\
    \ {\n  return function(divisor) {\n    return (number > 1)\n      ? number % divisor\
    \ === 0\n      : false\n  };\n}\n\nfunction log(number) { }\n```\n\n`isDivisorOf`\
    \ 是一个柯里化函数，它接收一个数字，并返回一个谓词函数，该谓词函数接收一个可能的除数并返回一个布尔值。\n\n`findFirstDivisor` 返回一个数字的第一个除数。它检查从\
    \ 2 到该数字一半的所有数字。\n\n`isPrime` 根据 `findFirstDivisor` 的结果判断一个数字是否为质数。如果该数字没有除数，那么它就是质数。\n\
    \n## 回顾\n\n变换器（Transducers）是接收一个归约器并返回一个新归约器的函数。\n\n惰性序列（如 `Seq`）允许我们高效地链式调用转换方法，而无需创建中间集合。\n\
    \n`Range` 提供数字序列。\n\n## 第 13 章：生成器\n\n生成器是一个函数，每次调用时都会从序列中返回下一个值。\n\n我们将从一个简单的生成器函数开始，它每次调用时返回下一个整数。它从\
    \ 0 开始。\n\n```\nfunction range() {\n  let count = 0;\n  return function() {\n\
    \    const result = count;\n    count += 1;\n    return result;\n  }\n}\n\nconst\
    \ nextNumber = range()\nconsole.log(nextNumber()); //0\nconsole.log(nextNumber());\
    \ //1\nconsole.log(nextNumber()); //2\n```\n\n`nextNumber` 是一个无限生成器。`nextNumber`\
    \ 是一个闭包，拥有内部私有状态。\n\n### 有限生成器\n\n生成器可以是有限的。请看下一个示例，其中 `range` 创建了一个生成器，它从特定区间返回连续的数字。在序列末尾，它返回\
    \ `undefined`。\n\n```\nfunction range(from, to) {\n  let count = from;\n  return\
    \ function() {\n    if (count < to) {\n      const result = count;\n      count\
    \ += 1;\n      return result;\n    } else {\n      return undefined;\n    }\n\
    \  }\n}\n\nconst nextNumber = range(0, 3)\nconsole.log(nextNumber()); //0\nconsole.log(nextNumber());\
    \ //1\nconsole.log(nextNumber()); //2\nconsole.log(nextNumber()); //undefined\n\
    ```\n\n### `toArray`\n\n在使用生成器时，我们可能希望创建一个包含序列中所有值的数组。针对这种情况，我们需要一个像 `toArray`\
    \ 这样的工具函数，它接收一个生成器，并将序列中的所有值作为数组返回。该序列应该是有限的。\n\n```\nfunction toArray(generate)\
    \ {\n  let arr = [];\n  let value = generate();\n  while (value !== undefined)\
    \ {\n    arr = [...arr, value];\n    value = generate();\n  }\n  return arr;\n\
    }\n```\n\n让我们将它与之前的生成器一起使用。\n\n```\nconst numbers = toArray(range(1, 5));\nconsole.log(numbers);\n\
    //[1, 2, 3, 4]\n```\n\n### `forEach`\n\n我们可能还需要对序列中的每个元素运行一个回调函数。`forEach` 工具函数正是为此而设计的。它接收一个生成器和一个回调函数，并运行该回调函数，直到生成器返回\
    \ `undefined`。\n\n```\nfunction forEach(callback) {\n  return function(generate)\
    \ {\n    let value = generate();\n    while (value !== undefined) {\n      callback(value);\n\
    \      value = generate();\n    }\n  }\n}\n```\n\n这是一个柯里化函数，首先接收回调函数，然后接收生成器。\n\
    \n在下一个示例中，`log` 函数会被生成器返回的所有数字调用。\n\n```\nfunction log(x) {\n  console.log(x);\n\
    }\n\nconst nextNumber = range(1, 4);\nforEach(log)(nextNumber);\n//1\n//2\n//3\n\
    ```\n\n### `take`\n\n另一种常见场景是只取序列中的前 `n` 个元素。在这种情况下，我们需要一个新的工具函数，比如 `take`，它接收一个生成器并创建一个新的生成器，只返回序列中的前\
    \ `n` 个元素。\n\n```\nfunction take(n) {\n  return function(generate) {\n    let\
    \ count = 0;\n    return function() {\n      if (count < n) {\n        count +=\
    \ 1;\n        return generate();\n      }\n    };\n  };\n}\n```\n\n同样，`take` 是一个柯里化函数，应该这样调用：`take(n)(sequence)`。\n\
    \n下面展示了如何在管道中使用 `take` 和 `forEach`，从无限数字序列中获取前三个值并将其记录到控制台。\n\n```\nimport { pipe\
    \ } from 'lodash/fp';\n\nconst nextNumber = range();\npipe(\n  take(3),\n  forEach(console.log)\n\
    )(nextNumber);\n//0\n//1\n//2\n```\n\n### 自定义生成器\n\n我们可以创建任何自定义生成器，并将其与之前的工具函数一起使用。让我们创建\
    \ [斐波那契](https://en.wikipedia.org/wiki/Fibonacci_number) 自定义生成器：\n\n```\nfunction\
    \ fibonacci() {\n  let a = 0;\n  let b = 1;\n  return function() {\n    const\
    \ aResult = a;\n    a = b;\n    b = aResult + b;\n    return aResult;\n  };\n\
    }\n```\n\n我们可以将斐波那契生成器与已创建的工具函数一起使用，以显示序列中的前 5 个数字。\n\n```\nimport { pipe } from\
    \ 'lodash/fp';\n\nconst generateFibonacci = fibonacci();\npipe(\n  take(5),\n\
    \  forEach(console.log)\n)(generateFibonacci);\n//0\n//1\n//1\n//2\n//3\n```\n\
    \n### 回顾\n\n生成器是一个函数，每次调用时都会从序列中返回一个新值。\n\n函数式生成器可以从有限或无限的值序列中返回元素。\n\n## 第 14\
    \ 章：Promise\n\nPromise 是一个包含未来结果的对象。\n\nPromise 有三种状态：待定（pending）、已完成（fulfilled）和已拒绝（rejected）。\n\
    \n*   待定是 Promise 的初始状态。此时结果不可用。\n*   已完成表示操作成功。此时结果可用。\n*   已拒绝表示操作失败。结果不可用，但我们可以访问错误对象，其中包含操作失败原因的详细信息。\n\
    \n最初，Promise 以待定状态开始。然后它可以进入已完成或已拒绝状态。一旦 Promise 被完成或拒绝，它将保持该状态。\n\n下面是 Promise\
    \ 可能经历的状态流转图。\n\n![](img/Image00011.jpg)\n\n### 创建 Promise\n\n让我们从创建一个简单的 Promise\
    \ 开始。\n\n```\nfunction delay(interval) {\n  return new Promise(function(resolve)\
    \ {\n    return setTimeout(resolve, interval);\n  });\n}\n\nfunction logDone()\
    \ {\n  console.log('Done');\n}\n\ndelay(1000)\n  .then(logDone);\n```\n\n`delay`\
    \ 创建一个将在特定时间后解决的 Promise。我们可以用它来延迟任务的执行。\n\n使用 `new Promise` 创建 Promise 需要传入一个名为执行器（executor）的函数。该函数接收两个回调函数\
    \ `resolve` 和 `reject`，可以在稍后调用以改变 Promise 的状态。执行器函数在 Promise 创建时自动运行。\n\n`Promise`\
    \ 有两个实用的静态方法 `resolve` 和 `reject`，用于快速创建已解决或已拒绝的 Promise。\n\n`Promise.resolve(value)`\
    \ 创建一个包装了 `value` 的已解决 Promise。\n\n`Promise.reject(error)` 创建一个已拒绝的 Promise。\n\
    \n### 成功处理\n\n#### 映射\n\n`then` 充当映射器。它接收一个映射函数，并返回一个包含转换后值的 Promise。\n\n我们可以使用\
    \ `Promise.resolve` 创建一个简单的可映射对象，包装一个值。然后我们可以转换并检查包装后的值。\n\n```\nfunction toUpperCase(text)\
    \ {\n  return text.toUpperCase();\n}\n\nfunction logIdentity(value) {\n  console.log(value);\n\
    \  return value;\n}\n\nPromise.resolve('sTudY')\n  .then(logIdentity)  //\"sTudY\"\
    \n  .then(toUpperCase)\n```\n\n"
- fmt: "\n## Flat Mapping\n\n`.then(logIdentity); //\"STUDY\"`\n\n`then` acts also\
    \ like a flat map. When the mapping function returns a value, `then` returns a\
    \ promise containing the transformed value. To be more precise, we should say\
    \ that the mapping function returns a value that is not a promise. When the mapping\
    \ function returns a promise wrapping a value, `then` does not wrap it into another\
    \ promise. It just returns the new promise containing the transformed value. Wrapping\
    \ a promise into another promise would have meant to create a promise which contains\
    \ a promise which wraps a value.\n\nTake a look at a function, dividing two numbers,\
    \ that is used as a mapping function on a promise.\n\n```javascript\nfunction\
    \ devideBy(n, divisor){\n  return n / divisor;\n}\n\nfunction logIdentity(value){}\n\
    \nPromise.resolve(9)\n  .then(logIdentity)  //9\n  .then(n => devideB(n, 3))\n\
    \  .then(logIdentity); //3\n```\n\nWe can implement `devideBy` as a curried function\
    \ and used it more nicely with `then`.\n\n```javascript\nfunction devideBy(divisor){\n\
    \  return function(n){\n    return n / divisor;\n  }\n}\n\nPromise.resolve(9)\n\
    \  .then(logIdentity)  //9\n  .then(devideBy(3))\n  .then(logIdentity); //3\n\
    ```\n\nWhen `devideBy` returns a promise instead of number, `then` waits for that\
    \ promise to complete and returns a promise wrapping the transformed value.\n\n\
    ```javascript\nfunction devideBy(divisor){\n  return function(number){\n    const\
    \ result = number / divisor;\n    return Promise.resolve(result);\n  }\n}\n\n\
    Promise.resolve(9)\n  .then(logIdentity)  //9\n  .then(devideBy(3))\n  .then(logIdentity);\
    \ //3\n```\n\n## Error Handling\n\n`catch` handles errors in a promise chain.\
    \ Below is an example of error handling using `catch`.\n\n```javascript\nfunction\
    \ devideBy(divisor){\n  return function(number){\n    const result = number /\
    \ divisor;\n    return (divisor !== 0)\n      ? Promise.resolve(result)\n    \
    \  : Promise.reject(\"Can't divide by 0\")\n  }\n}\n\nfunction logError(error){\n\
    \  console.error(error);\n}\n\nPromise.resolve(9)\n  .then(logIdentity) //9\n\
    \  .then(devideBy(0))\n  .then(logIdentity)\n  .catch(logError) //\"Can't divide\
    \ by 0\"\n```\n\nIf there is an error in any transformation step the flow jumps\
    \ down the closest error handler.\n\n## Chaining\n\nAs you noticed, we can chain\
    \ several transformations on the wrapped value. The `then` method on a resolved\
    \ promise will return a new promise. Likewise, the `catch` method of a rejected\
    \ promise will return a new promise. This creates a pipeline of transformations\
    \ where each transform function takes as input the result of the previous one.\n\
    \n```javascript\nfunction toCelsius(kelvin){\n  const celsius = (kelvin - 273.15);\n\
    \  return Math.round(celsius * 100) / 100;\n}\n\nfunction toChangeAction(temperature){\n\
    \  return {\n    type : 'CHANGE_TEMPERATURE',\n    temperature\n  }\n}\n\nfunction\
    \ logIdentity(value){}\n\nPromise.resolve(280)\n  .then(logIdentity)\n  .then(toCelsius)\n\
    \  .then(logIdentity)\n  .then(toChangeAction)\n  .then(logIdentity);\n\n//280\n\
    //6.85\n//{ type: 'CHANGE_TEMPERATURE', temperature: 6.85 }\n```\n\n`toCelsius`\
    \ takes the 280-kelvin temperature as input and returns 6.85. `toChangeAction`\
    \ takes as input the 6.85-celsius temperature and returns an action object containing\
    \ the new celsius value.\n\n## Asynchronous Operations\n\nThe code written so\
    \ far was synchronous. That means we had the result of executing a function immediately.\
    \ Consider the next code.\n\n```javascript\nconst result = Math.pow(2, 3);\nconsole.log(result);\n\
    //8\n```\n\nOnce we execute `Math.pow` we have the result. Now think about what\
    \ it means to make a call to a Web API and have the returned data in a variable.\n\
    \n```javascript\nconst result = fetch('/todos')\n```\n\nIn order to have the data\
    \ returned by the Web API inside the `result` variable, we need to wait for the\
    \ `fetch` call to finish. Waiting means blocking the UI and we don’t want that.\
    \ Promises offer a solution to this scenario. Instead of returning the result,\
    \ the `fetch` call returns a promise that will later give access to the result\
    \ when it is available.\n\n## Parcel\n\nWe can test the network call by starting\
    \ a development server. We can create one using the [Parcel](https://parceljs.org/getting_started.html)\
    \ web application which requires zero configuration.\n\nFirst, install Parcel.\n\
    \n```\nnpm install parcel-bundler --save-dev\n```\n\nNext, create an `index.html`\
    \ and reference the js files you want to check.\n\n```html\n<html>\n<body>\n<script\
    \ src=\"./ajax.js\"></script>\n</body>\n</html>\n```\n\nThen, add the dev task\
    \ scripts in the `package.json`.\n\n```json\n{\n  \"scripts\": {\n    \"dev\"\
    : \"parcel index.html\"\n  }\n}\n```\n\nNow, you can start the development server\
    \ and access the `index.html` page.\n\n## Fetch\n\n[The Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API)\
    \ provides an interface for fetching resources. The `fetch` function takes as\
    \ input an URL and returns a promise that resolves to the Response of the request.\
    \ It fails when the request fails.\n\nHere is an example of making a fetch call\
    \ and accessing the result in the returned promise.\n\n```javascript\nfunction\
    \ toJson(response){\n  return response.json();\n}\n\nfunction logIdentity(value){}\n\
    \nfunction logError(error){\n  console.error(error);\n}\n\nfetch('https://api.github.com/gists/public')\n\
    \  .then(toJson)\n  .then(logIdentity)\n  .catch(logError);\n```\n\nThe `json()`\
    \ method converts the response to a JavaScript object. It returns a promise wrapping\
    \ the result of parsing the response body text as JSON.\n\n## Promise.race\n\n\
    [Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)\
    \ takes an array of promises and returns the first one that fulfills or rejects.\n\
    \n```javascript\nconst dictionariesPromise = fetch('/dictionaries').then(toJson);\n\
    const todosPromise = fetch('/todos').then(toJson);\n\nPromise.race([\n  dictionariesPromise,\n\
    \  todosPromise\n]).then(logIdentity);\n```\n\n## Promise.all\n\n[Promise.all](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all)\
    \ takes an array of promises and returns a new promise that resolves when all\
    \ of the input’s promises have resolved. If one of the input promises is rejected\
    \ it rejects immediately. `Promise.all` can be used to make sure that all input\
    \ promises have completed successfully.\n\n```javascript\nPromise.all([\n  dictionariesPromise,\n\
    \  todosPromise\n]).then(logIdentity);\n```\n\n## Promise.allSettled\n\n[Promise.allSettled](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/allSettled)\
    \ takes an array of promises and returns a promise that resolves after all of\
    \ the input’s promises have either fulfilled or rejected. It resolves with an\
    \ array of objects describing the outcome of each promise.\n\n```javascript\n\
    const dictionariesPromise = fetch('/dictionaries').then(toJson);\nconst todosPromise\
    \ = fetch('/todos').then(toJson);\nconst rejectedPromise = Promise.reject('Error');\n\
    \nPromise.allSettled([\n  dictionariesPromise,\n  todosPromise,\n  rejectedPromise\n\
    ])\n.then(logIdentity)\n\n//[\n//{status: \"fulfilled\", value: Array(1)},\n//{status:\
    \ \"fulfilled\", value: Array(1)},\n//{status: \"rejected\", reason: \"Error\"\
    }\n//]\n```\n\n## Functor Laws\n\nThe `then` method on a promise acts as a map\
    \ when the transformation function returns an object that is not a promise. Identity\
    \ law is respected.\n\n```javascript\nfunction identity(n){\n  return n;\n}\n\n\
    Promise.resolve(1)\n  .then(identity)\n//Promise 1\n```\n\nThe composition law\
    \ is respected when mapping functions don’t return promises. In this case, `promise.then(f).then(g)`\
    \ gives the same result as `promise.then(x => g(f(x)))`.\n\n```javascript\nfunction\
    \ f(x){\n  return x + 1;\n}\n\nfunction g(x){\n  return x * 2;\n}\n\nfunction\
    \ logIdentity(value){}\n\nPromise.resolve(1)\n  .then(f)\n  .then(g)\n  .then(logIdentity)\n\
    \nPromise.resolve(1)\n  .then(x => g(f(x)))\n  .then(logIdentity)\n```\n\nThe\
    \ functor composition law is broken when one transformation function returns a\
    \ promise and the other doesn’t. Here is an example.\n\n```javascript\nfunction\
    \ f(x){\n  return Promise.resolve(x + 1);\n}\n\nfunction g(x){\n  return x * 2;\n\
    }\n\nPromise.resolve(1)\n  .then(f)\n  .then(g)\n  .then(logIdentity);\n//4\n\n\
    Promise.resolve(1)\n  .then(x => g(f(x)))\n  .then(logIdentity);\n//NaN\n```\n\
    \nIn this case, the promise does not work as a functor because it doesn’t respect\
    \ the composition law. In practical terms, we should not refactor `promise.then(f).then(g)`\
    \ to `promise.then(x => g(f(x)))`.\n"
