    \ `count` survives the invocation of the outer function. `count` is a closure.\n\
    \n## Recap\n\n- Functions are values.\n- Functions can operate on other functions.\
    \ Functions can take other functions as input or return functions.\n- Inner functions\
    \ can access variables from the outer functions even after the outer functions\
    \ have executed.\n\n## Chapter 06: Statements\n\nAn expression is a combination\
