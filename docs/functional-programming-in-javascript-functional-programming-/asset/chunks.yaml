    \    * 最后思考\n* 下一步是什么？\n\n# 引言\n\n函数式编程正变得越来越流行，本书旨在阐明如何将 JavaScript 用作函数式语言。\n\
    \n事实证明，JavaScript 拥有作为函数式语言所需的一切。我们只需要从语言中移除某些特性即可。\n\n本质上，我们将从代码中移除 `this` 关键字。这意味着我们不会使用类或带有\
    \ `this` 关键字的方法。这也意味着不使用自定义原型。\n\n移除 `this` 还有其他好处。`this` 是 JavaScript 中许多困惑的根源，主要是因为它的值取决于函数的调用方式，而不是函数的定义位置。在许多情况下，`this`\
    \ 指向了意想不到的函数上下文，从而导致错误。通过移除 `this`，所有相关问题都消失了。\n\nJavaScript 既是一种函数式编程语言，也是一种基于原型的语言。如果我们去掉\
    \ `this`，剩下的 JavaScript 就是一门函数式编程语言。这甚至更好。\n\n话虽如此，我们可以通过启用代码检查来从代码中移除 `this`。\n\
    \n以下是一个 lint 配置文件的示例，它禁用了使用 [Create React App](https://reactjs.org/docs/create-a-new-react-app.html)\
    \ 构建的应用程序中的 `this` 关键字。\n\n```json\n{\n  \"extends\": [\"react-app\"],\n  \"plugins\"\
    : [\n    \"immutable\"\n  ],\n  \"rules\": {\n    \"immutable/no-this\": \"error\"\
    \n  }\n}\n```\n\n"
- fmt: "\n`JavaScript without this` looks like a better functional programming language.\n\
    \n## Source Code\n\nThe project files from this book are available at [https://github.com/cristi-salcescu/functional-programming-in-javascript](https://github.com/cristi-salcescu/functional-programming-in-javascript).\n\
    \n## Feedback\n\nI will be glad to hear your feedback. For comments, questions,\
    \ or suggestions regarding this book send me an email to [cristisalcescu@gmail.com](mailto:cristisalcescu@gmail.com).\
    \ Thanks in advance for considering to write a review of the book.\n\n## Setup\n\
    \nFirst, we need to setup our development environment to use the latest JavaScript\
    \ features.\n\n### Package Manager\n\nA package manager is a tool used to track\
    \ project dependencies in an easy to use manner. At the time of writing, Node.js\
    \ package manager, in short `npm`, is the most popular. Let’s start by installing\
    \ [Node.js](https://nodejs.org/en/download/).\n\nThe following commands can then\
    \ be used in command prompt to check the Node.js and `npm` versions:\n\n```\n\
    node --version\nnpm --v\n```\n\n### NPM Packages\n\nWith `npm` we can install\
    \ additional packages. These packages are the application dependencies.\n\nThe\
    \ `package.json` file stores all the node packages used in the project. These\
    \ packages are the application dependencies. The application can be shared with\
    \ other developers without sharing all the node packages. Installing all the packages\
    \ defined in the `package.json` file can be done using the `npm install` command.\n\
    \nStart by creating a `package.json` file using `npm`.\n\n```\nnpm init\n```\n\
    \nWe need a tool that converts our JavaScript code into a backward-compatible\
    \ version and has support for [modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules).\
    \ We need [Babel](https://babeljs.io/). Go and install the necessary packages.\n\
    \n```\nnpm install @babel/core @babel/node @babel/preset-env --save\n```\n\nThe\
    \ installed packages can be found in the `node_modules` folder. The `--save` flag\
    \ tells `npm` to store the package requirement in the `package.json` file.\n\n\
    In order to use the latest JavaScript, we need to enable a preset. Create the\
    \ `.babelrc` file and enable the `@babel/preset-env` preset.\n\n```json\n{\n \
    \ \"presets\": [\"@babel/preset-env\"]\n}\n```\n\n### Linting\n\nLinting is the\
    \ process of analyzing the code for potential errors and stylistic problems. A\
    \ linter is a tool that runs and reports these problems. Linters are also useful\
    \ for code formatting and for using best practices.\n\nWe are going to use [ES\
    \ Lint](https://eslint.org/). Start by installing it.\n\n```\nnpm install eslint\
    \ --save-dev\n```\n\nLint rules can be defined in a configuration file named `.eslintrc.*`.\n\
    \nNext, set up a configuration file.\n\n```\nnpx eslint --init\n```\n\nOne plugin\
    \ we are going to use is `eslint-plugin-functional` so let’s install it.\n\n```\n\
    npm install eslint-plugin-functional --save-dev\n```\n\nNow go to the `.eslintrc.json`\
    \ config file and write the lint rule that forbids the usage of `this` keyword.\n\
    \n```json\n{\n  \"plugins\": [\n    \"functional\"\n  ],\n  \"rules\": {\n   \
    \ \"functional/no-this-expression\": \"error\"\n  }\n}\n```\n\nHere is how you\
    \ can run linting on all files inside the `src` folder.\n\n```\nnpx eslint src\n\
    ```\n\nIn an application created with [Create React App](https://reactjs.org/docs/create-a-new-react-app.html)\
    \ we can force linting before starting the development server by prepending the\
    \ `npx eslint src` command followed by `&&`.\n\n```json\n\"scripts\": {\n  \"\
    start\": \"npx eslint src && react-scripts start\"\n}\n```\n\nUsing `&&` means\
    \ that things on both sides of the `&&` must evaluate to `true`. If the command\
    \ on the left side fails the command on the right side will not execute, so in\
    \ our case, the development server won’t start.\n\n### IDE\n\nFor code editing,\
    \ we need an Integrated Development Environment, IDE in short.\n\nI am going to\
    \ use [Visual Studio Code](https://code.visualstudio.com/) but feel free to use\
    \ any editor you prefer.\n\nIn order to write commands open the application folder\
    \ in Visual Studio Code. Then open the terminal from `Terminal -> New Terminal`\
    \ and execute the command.\n\nTo run the code inside the `filter.js` file for\
    \ example, and check the results, we can just use the following command.\n\n```\n\
    npx babel-node filter.js\n```\n\nFor instant linting feedback we can install the\
    \ [ESLint extension for VSCode](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint).\
    \ Linting allows us to work in a better subset of JavaScript.\n\n## Chapter 01:\
    \ Primitives\n\nWe start our learning journey by looking at the first kind of\
    \ values available in the language.\n\n### Primitives\n\nThe primitive values\
    \ include numbers, strings, booleans, `null`, and `undefined`. Log some of these\
    \ primitive values in the console.\n\n```javascript\nconsole.log(1);\nconsole.log('text');\n\
    console.log(true);\n```\n\nAll these primitive values have a type. We can find\
    \ the type of a value using the `typeof` operator. Check some of them.\n\n```javascript\n\
    console.log(typeof(1));\n//\"number\"\nconsole.log(typeof(''));\n//\"string\"\n\
    console.log(typeof(true));\n//\"boolean\"\n```\n\nThere are two number types `Number`\
    \ and `BigInt`. Mainly we are going to use the first one which stores double-precision\
    \ floating-point numbers. It is important to know that floating-point arithmetic\
    \ is not accurate.\n\n```javascript\nconsole.log(0.1+0.2);\n//0.30000000000000004\n\
    console.log(0.1 + 0.2 === 0.3);\n//false\n```\n\nThe integer arithmetic is accurate\
    \ up to 15 digits. We can solve the problem above by first multiplying and then\
    \ dividing.\n\n```javascript\nconsole.log(1 + 2 === 3);\n//true\nconsole.log(0.1\
    \ * 10 + 0.2 * 10) / 10 === 3);\n//true\n```\n\n`BigInt` is used to represent\
    \ larger numbers. We can create such numbers by appending `n` to the end of an\
    \ integer literal.\n\n```javascript\nconsole.log(12345678987654321n);\n```\n\n\
    Strings are texts. There are three ways to define a string value, single quotes,\
    \ double quotes and backticks.\n\n```javascript\n\"text\"\n'text'\n`text`\n```\n\
    \n`Undefined` is a type with one value `undefined`. `Null` is a type with one\
    \ value `null`. `Boolean` is a type with two values `true` and `false`.\n\n###\
    \ Methods on Primitives\n\nPrimitives are not objects but they seem to behave\
    \ like objects because they have methods. For example, we can call the `toLowerCase`\
    \ method on a string primitive. How is that possible if a string is not an object?\
    \ JavaScript creates a wrapper object and destroys it in order to run the `toLowerCase`\
    \ method.\n\n```javascript\n'TEXT'.toLowerCase();\n//\"text\"\n```\n\nWe can access\
    \ existing properties on primitives but we cannot change them or create new ones.\
    \ For example, the `length` property returns the size of a string.\n\n```javascript\n\
    'ABCDEFG'.length\n//7\n'ABCDEFG'.type = 'letters';\n//Cannot create property 'type'\
    \ on string 'ABCDEFG'\n```\n\nThe only primitives that are not treated as objects\
    \ are `null` and `undefined`. Trying to call a method on them will throw an error.\n\
    \n```javascript\nnull.toString();\n//Cannot read property 'toString' of null\n\
    ```\n\n### Immutability\n\nAn immutable value is a value that once created cannot\
    \ be changed.\n\nPrimitives are immutable. For example, when using a method on\
    \ a string we create new value. Here is an example of using the `trim` method\
    \ that removes whitespace from both sides of a string.\n\n```javascript\n' 123\
    \ '.trim();\n//'123';\n```\n\nThe `trim` method does not modify the existing string.\
    \ It creates a new one.\n\n### Variables\n\nWe need to make a distinction between\
    \ variables and values. Variables are not values. Variables store values.\n\n\
    We can assign values to variables. At this point, variables hold those values.\
    \ Variables have a name and we can refer the value using the name of the variable.\n\
    \nWe store a value in a variable using the assignment `=` keyword. Variables can\
    \ be declared with `let`, `var`, or `const` statements. When we declare a variable\
    \ without assigning it a value, it has the default value of `undefined`.\n\n```javascript\n\
    let x;\nconsole.log(x);\n//undefined\n```\n\nVariables store references to values.\
    \ Values don’t contain variables. Values may contain other values.\n\n![Image](Image00002.jpg)\n\
    \nValues have a type. Variables have the type of the value they store. Variables\
    \ are not tied to a type. A value always has the same type. `1` is always a number,\
    \ but the following variable `x` can first be of type number and then of type\
    \ string.\n\n```javascript\nlet x;\nx = 1;\n```\n"
