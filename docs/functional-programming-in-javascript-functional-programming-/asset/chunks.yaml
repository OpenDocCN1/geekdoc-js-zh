  trans: "\n\n### 回顾\n范畴是值的集合，以及这些值之间的箭头。箭头代表映射函数。对任何值应用恒等函数都会返回该值。函子是尊重恒等性和组合性的可映射对象。函子为我们提供了一种有用的方式，可以在包装值上创建数据转换管道。\n\
    \n# 第 10 章：单子\n函子是包装一个值并支持映射的对象。单子是包装一个值并支持映射和扁平映射的对象。\n\n## 扁平映射\n让我们再次看看数组函子上可用的\
    \ `map` 方法。应用一个返回值类型的映射函数，会得到一个新的数组，其中包含转换后的值。\n\n```javascript\nfunction toUpperCase(text){\n\
    \  return text.toUpperCase();\n}\n\nconst arr = [\"raspberry strawberry\", \"\
    blueberry\"]\n  .map(toUpperCase);\n\nconsole.log(arr);\n//[ 'RASPBERRY STRAWBERRY',\
    \ 'BLUEBERRY' ]\n```\n\n初始数组有两个文本值。应用转换后，我们得到一个包含两个大写字母文本值的数组。\n\n看看当我们应用一个返回数组的映射函数时会发生什么。\n\
    \n```javascript\nfunction split(text){\n  return text.split(' ');\n}\n\nconst\
    \ arr = [\"raspberry strawberry\", \"blueberry\"]\n  .map(split)\n\nconsole.log(arr);\n\
    //[ [ 'raspberry', 'strawberry' ], [ 'blueberry' ] ]\n```\n\n`split` 函数使用分隔符将字符串拆分为子字符串数组。每个子字符串代表原始文本中的一个单词。\n\
    \n应用 `split` 映射函数会得到一个包含两个其他数组的数组。每个子数组是一个字符串集合。\n\n扁平映射类似于映射，但它会展开返回类型。\n\n接下来，看看使用数组上可用的\
    \ `flatMap` 方法应用相同的映射函数。\n\n```javascript\nconst arr = [\"raspberry strawberry\"\
    , \"blueberry\"]\n  .flatMap(split)\n\nconsole.log(arr);\n//[ 'raspberry', 'strawberry',\
    \ 'blueberry' ]\n```\n\n`flatMap` 方法首先使用映射函数映射数组中的每个元素，然后将结果展平为一个新数组。通过先使用 `map`，然后使用深度为\
    \ `1` 的 `flat` 展平结果，可以达到相同的效果。\n\n```javascript\nconst arr = [\"raspberry strawberry\"\
    , \"blueberry\"]\n  .map(split)\n  .flat();\n\nconsole.log(arr);\n//[ 'raspberry',\
    \ 'strawberry', 'blueberry' ]\n```\n\n`flat` 创建一个新数组，其中所有子数组的值都被连接起来。它使用递归将值连接到指定的深度。\n\
    \n```javascript\nconst arr = [1, [2, 3]];\nconsole.log(arr.flat());\n//[ 1, 2,\
    \ 3 ]\n```\n\n## 单子\n我们可以简单地将单子创建为一个具有 `map` 和 `flatMap` 方法的对象。考虑以下 `M` 函数：\n\n\
    ```javascript\nfunction M(value){\n  function map(f){\n    const newValue = f(value);\n\
    \    return M(newValue);\n  }\n  function flatMap(f){\n    const newValue = f(value);\n\
    \    return newValue;\n  }\n  return {\n    map,\n    flatMap\n  }\n}\n```\n\n\
    `M` 是一个工厂函数，它创建一个包装一个值的对象，并具有两个修改它的方法：`map` 和 `flatMap`。`map` 接受一个转换函数，用它创建一个新值，然后使用\
    \ `M` 工厂函数创建一个包装该新值的对象。`flatMap` 使用转换函数计算一个新值并返回它。\n\n`M` 是单子构造函数。它接受一个值并返回一个包装该值的单子。`M`\
    \ 被称为恒等单子。\n\n## 单子定律\n单子应遵守三条定律。\n\n### 左恒等\n将 `f` 视为一个返回单子的映射函数。将 `f` 函数传递给包装值\
    \ `x` 的单子的 `flatMap` 操作，应该得到与调用函数 `f(x)` 相同的单子。\n\n```\nM(x).flatMap(f) === f(x)\n\
    ```\n\n让我们在我们的单子上验证左恒等定律。\n\n```javascript\nfunction f(){\n  return M(2)\n}\n\n\
    M(1)\n  .flatMap(f);\n//M(2)\n\nf(1);\n//M(2)\n```\n\n### 右恒等\n将 `M` 函数传递给包装一个值的单子的\
    \ `flatMap` 操作，应该得到包装相同值的单子。\n\n```\nmonad.flatMap(M) === monad\n```\n\n使用 `M`\
    \ 自定义单子检查该定律。\n\n```javascript\nM(1)\n  .flatMap(M)\n//M(1)\n```\n\n### 结合律\n\
    单子必须遵守结合律，即：\n\n```\nmonad.flatMap(f).flatMap(g)\n  === monad.flatMap(x => f(x).flatMap(g))\n\
    ```\n\n让我们测试该定律。\n\n```javascript\nfunction f(){\n  return M(2)\n}\nfunction g(){\n\
    \  return M(3)\n}\n\nM(1)\n  .flatMap(f)\n  .flatMap(g);\n//M(3)\n\nM(1)\n  .flatMap(n\
    \ => f(n).flatMap(g));\n//M(3)\n```\n\n## 替代创建与命名\n扁平映射方法有不同的名称，如 `bind`、`chain`\
    \ 或仅 `flatMap`。还有一种做法是使用一个名为 `unit` 的不同方法来创建单子。`unit` 与 `M` 工厂函数的作用相同，它创建一个新的单子。\n\
    \n下面是使用这种替代命名定义单子的示例。\n\n```javascript\nexport default (function defineMonad(){\n\
    \  function M(value){\n    function map(f){\n      const newValue = f(value);\n\
    \      return M(newValue);\n    }\n    function bind(f){\n      const newValue\
    \ = f(value);\n      return newValue;\n    }\n    return {\n      map,\n     \
    \ bind\n    }\n  }\n  function unit(value){\n    return M(value);\n  }\n  return\
    \ {\n    unit\n  }\n})();\n```\n\n`unit` 创建一个包装值的新单子。`bind` 定义了扁平映射操作。\n\n以下是单子如何被创建和使用的示例。\n\
    \n```javascript\nimport M from './M';\n\nfunction f(){\n  return M.unit(2)\n}\n\
    \nM.unit(1).bind(f)\n//M 2\n```\n\n下面你可以回顾在这种情况下单子规则如何书写。\n\n**左恒等**\n```\nM.unit(1).bind(f)\n\
    //M 2\n```\n\n**右恒等**\n```\nM.unit(1).bind(M.unit)\n//M 1\n```\n\n**结合律**\n```\n\
    M.unit(1).bind(f).bind(g)\n//M 3\n\nM.unit(1).bind(x => f(x).bind(g))\n//M 3\n\
    ```\n\n[你可能还会发现](https://gist.github.com/newswim/4668aef8a1f1bc0dabe8#file-m-dlecture-txt-LC109)\
    \ `bind` 被描述为一个独立的函数，而不是单子对象上的方法：`bind(monad, f)`。当 `bind` 是单子对象上的方法时，这等价于 `monad.bind(f)`。\n\
    \n将 `bind` 描述为方法更有帮助。\n\n让我们看看如何将单子定律从函数形式转换为方法形式。\n\n以下三种描述单子定律的方式是等价的。\n\n**左恒等**\n\
    ```\nbind(unit(x), f) === f(x)\nM.unit(x).bind(f) === f(x)\nM(x).flatMap(f) ===\
    \ f(x)\n```\n\n注意，在最后一行中，`M` 被用作构造函数。`M(x)` 等价于 `M.unit(x)`，也等价于 `unit(x)`。\n\n\
    **右恒等**\n```\nbind(monad, unit)  === monad\nmonad.bind(M.unit) === monad\nmonad.flatMap(M)\
    \   === monad\n```\n\n**结合律**\n```\nbind(bind(monad, f), g)\n  === bind(monad,\
    \ x => bind(f(x), g))\n\nmonad.bind(f).bind(g)\n  === monad.bind(x => f(x).bind(g))\n\
    \nmonad.flatMap(f).flatMap(g)\n  === monad.flatMap(x => f(x).flatMap(g)))\n```\n\
    \n话虽如此，我认为将恒等单子实现为具有 `map` 和 `flatMap` 方法的对象更容易使用。\n\n## 数组\n数组同时具有 `map` 和 `flatMap`\
    \ 方法。让我们检查它们上的单子定律。\n\n首先，我们需要一个可以从值创建数组的函数。\n\n```javascript\nfunction M(value){\n\
    \  return [value];\n}\n```\n\n我们不需要定义这样的函数，因为已经有一个函数可以做到这一点。它叫做 `Array.of()`。\n\
    \n```javascript\nfunction duplicate(word){\n  return [word, word]\n}\n\nfunction\
    \ split(text){\n  return text.split(\" \");\n}\n```\n\n接下来检查三条定律。\n\n**左恒等**\n\
    ```\n//M(x).flatMap(f) === f(x)\nArray.of('mango')\n  .flatMap(duplicate)\n//['mango',\
    \ 'mango']\n\nduplicate('mango');\n//['mango', 'mango']\n```\n\n正如你所注意到的，当使用 `Array.of`\
    \ 创建数组时，`M(x)` 转换为 `Array.of(x)`。\n\n**右恒等**\n```\n//monad.flatMap(M) === monad\n\
    Array.of('lemon')\n  .flatMap(Array.of)\n//['lemon']\n```\n\n**结合律**\n```\n//monad.flatMap(f).flatMap(g)\n\
    //  === monad.flatMap(x => f(x).flatMap(g)))\n\nArray.of('orange kiwi')\n  .flatMap(split)\n\
    \  .flatMap(duplicate);\n//[ 'orange', 'orange', 'kiwi', 'kiwi' ]\n\nArray.of('orange\
    \ kiwi')\n  .flatMap(s => split(s).flatMap(duplicate))\n```\n\n"
- fmt: "\n//[ 'orange', 'orange', 'kiwi', 'kiwi' ]\n\nRecap A functor is an object\
    \ with a `map` operation. A monad is an object with `map` and `flatMap` operations.\
    \ Functors apply a function to a wrapped value. Monads apply a function that returns\
    \ a wrapped value to a wrapped value. In essence, a monad is simply a wrapper\
    \ around a value. We can create it with an object that stores a single value and\
    \ offers support for mapping and flat mapping. In the next chapters, we are going\
    \ to explore practical monads like immutable lists, promises, and observables.\n\
    \n# Chapter 11: Immutable Collections\n\nA collection is anything that can be\
    \ iterated over. Immutable collections return a new collection on “change” operations.\
    \ We are going to look at such collections available in the [Immutable.JS](https://immutable-js.github.io/immutable-js/)\
    \ library. Install it first.\n\n```\nnpm install immutable --save\n```\n\n## List\n\
    \nLists are indexed collections, similar to arrays. In fact, they can be created\
    \ from arrays.\n\n```\nimport { List } from 'immutable';\n\nconst emptyList =\
    \ List();\n\n// List []\n\nconst list = List([\n  { name: 'Rhodes' },\n  { name:\
    \ 'Malaga' }\n]);\n\n// List [\n//   { name: 'Rhodes' },\n//   { name: 'Malaga'\
    \ }]\n```\n\n[`List()`](https://immutable-js.github.io/immutable-js/docs/#/List/List)\
    \ creates a new immutable `List` containing the values provided as the argument.\
    \ `List` is a factory function and does not use the `new` keyword.\n\n### Editing\
    \ an element\n\n[`set(index, value)`](https://immutable-js.github.io/immutable-js/docs/#/List/set)\
    \ allows us to edit an element at a specific index in the collection. It returns\
    \ a new `List` containing the modification. The element at the specified index\
    \ position will be replaced.\n\n```\nconst newList = list.set(0, { name: 'Riomaggiore'\
    \ });\n\n// List [\n//   { name: 'Riomaggiore' },\n//   { name: 'Malaga' }]\n\n\
    console.log(list === newList);\n//false\n```\n\n### Adding an element\n\n[`push(…values)`](https://immutable-js.github.io/immutable-js/docs/#/List/push)\
    \ returns a new `List` with the provided values appended. It can be used to add\
    \ a new value to the list. Below is an example.\n\n```\nconst newList = list.push({name:\
    \ 'Funchal'});\n\n// List [\n//   { name: 'Rhodes' },\n//   { name: 'Malaga' },\n\
    //   { name: 'Funchal'}]\n```\n\nAdding can also be done with [`concat(…values)`](https://immutable-js.github.io/immutable-js/docs/#/List/concat).\
    \ It concatenates a new collection to the existing one. To add a single value\
    \ we call it with an array containing one value.\n\n```\nconst newList = list.concat([{name:\
    \ 'Funchal'}]);\n\n// List [\n//   { name: 'Rhodes' },\n//   { name: 'Malaga'\
    \ },\n//   { name: 'Funchal'}]\n```\n\n[`unshift(…values)`](https://immutable-js.github.io/immutable-js/docs/#/List/unshift)\
    \ returns a new `List` with the provided values prepended.\n\n### Deleting an\
    \ element\n\n[`delete(index)`](https://immutable-js.github.io/immutable-js/docs/#/List/delete)\
    \ deletes the element at the specified index and returns a new `List` containing\
    \ the modification.\n\n```\nconst newList = list.delete(0);\n\n// List [{ name:\
    \ 'Malaga' }]\n```\n\n`delete` has the `remove` alias.\n\n[`pop()`](https://immutable-js.github.io/immutable-js/docs/#/List/pop)\
    \ returns a new `List` with the last element removed.\n\n[`shift()`](https://immutable-js.github.io/immutable-js/docs/#/List/shift)\
    \ returns a new `List` with the first element removed.\n\n### Clearing the list\n\
    \n[`clear()`](https://immutable-js.github.io/immutable-js/docs/#/List/clear) returns\
    \ a new `List` with no values.\n\n```\nconst newList = list.clear();\n\nconsole.log(newList)\n\
    // List []\n```\n\n### Data Transformation\n\nWe can work with lists similar to\
    \ arrays. Lists have the `filter`, `map`, `flatMap`, `reduce`, and `sort` methods\
    \ working like in arrays. The `sort` method this time is a pure method returning\
    \ a new collection.\n\nHere is an example of using the `filter` method to select\
    \ only the destinations to a specific country from a list of destination objects.\n\
    \n```\nimport { List } from 'immutable';\n\nconst list = List([\n  { name: 'Cascais',\
    \ country: 'Portugal'},\n  { name: 'Sintra', country: 'Portugal' },\n  { name:\
    \ 'Nerja', country: 'Spain' },\n]);\n\nfunction inCountry(country){\n  return\
    \ function(destination){\n    return destination.country === country;\n  }\n}\n\
    \nlist\n  .filter(inCountry('Portugal'))\n\n//List [\n//  {name:'Cascais',country:'Portugal'},\n\
    //  {name:'Sintra',country:'Portugal'}]\n```\n\nNote that `inCountry` is a curried\
    \ function.\n\nLists are monads as they support both mapping and flat mapping.\n\
    \n### Finding Elements\n\nLists have methods for retrieving data.\n\n[`get(index)`](https://immutable-js.github.io/immutable-js/docs/#/List/get)\
    \ returns the element associated with the provided index.\n\n[`first()`](https://immutable-js.github.io/immutable-js/docs/#/List/first)\
    \ returns the first element in the collection. In case the collection is empty,\
    \ it returns `undefined`. In a similar way, [`last()`](https://immutable-js.github.io/immutable-js/docs/#/List/last)\
    \ returns the last element in the collection.\n\n[`find()`](https://immutable-js.github.io/immutable-js/docs/#/List/find)\
    \ returns the first element for which the predicate function returns `true`. [`findLast()`](https://immutable-js.github.io/immutable-js/docs/#/List/findLast)\
    \ returns the last element for which the predicate function returns `true`. Below\
    \ is an example of using these two methods on the previous list.\n\n```\nimport\
    \ { List } from 'immutable';\n\nconst list = List([\n  { name: 'Cascais', country:\
    \ 'Portugal'},\n  { name: 'Sintra ', country: 'Portugal' },\n  { name: 'Nerja\
    \ ', country: 'Spain' },\n]);\n\nconst destination = list.find(inCountry('Portugal'));\n\
    //{ name: 'Cascais', country: 'Portugal' }\n\nconst otherDestionation = list.findLast(inCountry('Portugal'));\n\
    //{ name: 'Sintra ', country: 'Portugal' }\n```\n\n## Map\n\nA map is a collection\
    \ of key-value pairs. Immutable maps accept keys of any type.\n\nHere is an example\
    \ of creating a map of country objects by id.\n\n```\nimport { Map } from 'immutable';\n\
    \nconst countryMap = Map({\n  \"1\": { name: 'Italy'},\n  \"2\": { name: 'Portugal'},\n\
    \  \"3\": { name: 'UK'}\n});\n```\n\n[`get(key)`](https://immutable-js.github.io/immutable-js/docs/#/Map/get)\
    \ returns the value associated with the given key.\n\n```\nconsole.log(countryMap.get(\"\
    3\"));\n//{ name: 'UK' }\n```\n\n[`set(key, value)`](https://immutable-js.github.io/immutable-js/docs/#/Map/set)\
    \ returns a new `Map` containing the key-value pair. If the key already exists,\
    \ its value is replaced. If the key does not exist, it will be added. `set` can\
    \ be used for adding and editing a key-value pair.\n\n```\nconst newMap = countryMap.set(\"\
    2\", { name: 'Spain'});\nconsole.log(newMap.get(\"2\"));\n//{ name: 'Spain' }\n\
    ```\n\n[`has(key)`](https://immutable-js.github.io/immutable-js/docs/#/Map/has)\
    \ returns `true` if the given key exists within the map, otherwise, it returns\
    \ `false`.\n\n[`delete(key)`](https://immutable-js.github.io/immutable-js/docs/#/Map/delete)\
    \ returns a new `Map` with the specified key removed.\n\n```\nconst newMap = countryMap.delete(\"\
    3\");\nconsole.log(newMap.has(\"3\"));\n//false\n\nconsole.log(newMap.get(\"3\"\
    ));\n```\n"
