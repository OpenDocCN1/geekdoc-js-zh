    \n```\nfunction f(x){\n  return Promise.resolve(x + 1);\n}\n\nPromise.resolve(1)\n\
    \  .then(f)\n  //Promise 2\n\nf(1)\n  //Promise 2\n```\n\n右单位元也成立。\n\n```\nfunction\
    \ unit(value){\n  return Promise.resolve(value)\n}\n\nPromise.resolve(1)\n  .then(unit)\n\
    \  //Promise 1\n```\n\n`promise.flatMap(f).flatMap(g)` 与 `promise.flatMap(x =>\
    \ f(x).flatMap(g))` 结果相同。\n\n```\nfunction g(x){\n  return Promise.resolve(x *\
    \ 2);\n}\n\nfunction logIdentity(value){}\n\nPromise.resolve(1)\n  .then(f)\n\
    \  .then(g)\n  .then(logIdentity);\n\nPromise.resolve(1)\n  .then(x => f(x).then(g))\n\
    \  .then(logIdentity);\n```\n\n总结来说，当两个映射函数都返回非 promise 的值时，`then` 充当 `map`，组合性成立。当两个映射函数都返回\
    \ promise 时，`then` 充当 `flatMap`，结合性成立。\n\n## 回顾\n\nPromise 是包装未来结果的对象。当转换函数返回一个值时，`then`\
    \ 充当 `map` 操作。当它返回另一个 promise 时，`then` 类似于 `flatMap` 操作。严格来说，promise 不是 monad，但在许多情况下它们的行为与\
    \ monad 相似。\n\n# 第 15 章：可观察对象\n\n可观察对象是一种可以随时间到达的数据流。可观察对象是当值可用时向监听器发出这些值的对象。可观察对象未来[可能成为\
    \ JavaScript 语言的一部分](https://github.com/tc39/proposal-observable)，但目前我们将使用 [RxJS](https://www.npmjs.com/package/rxjs)\
    \ 库中的可观察对象实现。\n\n```\nnpm install rxjs --save\n```\n\n操作符是可观察对象上一个强大的特性。\n\n##\
    \ 创建操作符\n\n创建操作符是用于构造新可观察对象的函数。可观察对象通常使用创建函数来创建，例如 `of`、`from`、`interval` 或 `ajax`。\n\
    \n### `create()`\n\n以下示例创建了一个可观察对象，它向订阅者发出值 `1`、`2`、`3`，然后完成。\n\n```\nimport {\
    \ Observable } from 'rxjs';\n\nconst observable = Observable.create(observer =>\
    \ {\n  observer.next(1);\n  observer.next(2);\n  observer.next(3);\n  observer.complete();\n\
    });\n```\n\n`create` 操作符接受一个回调函数，该函数定义了如何发出值。有三个方法描述了可观察对象可以做什么。\n\n* `next()`\
    \ 向监听器发送一个值。\n* `error()` 向监听器发送一个错误。\n* `complete()` 标记值序列的结束。调用 `complete` 后，进一步调用\
    \ `next()` 将无效。\n\n`next` 定义了实际传递给订阅者的数据。数据流可以通过 `complete` 成功完成，或者通过 `error`\
    \ 标记失败。\n\n我们可以使用 `subscribe` 方法监听可观察对象源。\n\n```\nobservable\n  .subscribe(console.log);\n\
    //1\n//2\n//3\n```\n\n如果我们稍后再次订阅该数据源，我们将再次收到所有发出的值。\n\n```\nsetTimeout(()=>{\n\
    \  observable.subscribe(console.log);\n  //1\n  //2\n  //3\n}, 3000);\n```\n\n\
    ### `of()`\n\n`of` 从一组值创建可观察对象。以下是一个按顺序发出 `1`、`2`、`3` 的可观察对象示例。\n\n```\nimport\
    \ { of } from 'rxjs';\n\nconst source = of(1, 2, 3);\nsource\n  .subscribe(console.log);\n\
    // 1\n// 2\n// 3\n```\n\n### `from()`\n\n`from` 可以从类数组对象、promise 或类可观察对象创建可观察对象。以下是从数组构建可观察对象的示例。\n\
    \n```\nimport { from } from 'rxjs';\n\nconst observable = from([1, 2, 3]);\nobservable.subscribe(console.log);\n\
    // 1\n// 2\n// 3\n```\n\n### `interval()`\n\n`interval` 函数接受毫秒数 `n` 作为输入，并返回一个可观察对象，该对象每隔\
    \ `n` 毫秒按顺序发出一个新的整数。\n\n```\nimport { interval } from 'rxjs';\n\nconst observable\
    \ = interval(1000);\nobservable.subscribe(console.log);\n//0 -> 1 秒后\n//1 -> 2\
    \ 秒后\n//2 -> 3 秒后\n//3 -> 4 秒后\n//4 -> 5 秒后\n//5 -> 6 秒后\n```\n\n### `ajax()`\n\
    \n`ajax` 创建一个可观察对象，从网络请求中获取结果。它接受一个包含 URL、方法、数据等的请求对象，或者仅接受一个 URL 字符串作为输入。以下是一个示例。\n\
    \n```\nimport { ajax } from 'rxjs/ajax';\n\najax('https://api.github.com/gists/public')\n\
    \  .subscribe(console.log);\n```\n\n使用 `ajax` 函数创建的可观察对象流会发出从请求返回的响应对象。下面使用 `ajax.getJSON`\
    \ 函数执行相同的请求，该函数创建一个仅发出从请求返回的响应对象中 JSON 键的可观察对象。\n\n```\najax.getJSON('https://api.github.com/gists/public')\n\
    \  .subscribe(console.log);\n```\n\n## 可管道操作符\n\n可观察对象具有 `pipe` 方法，允许将多个操作符串联起来。可管道操作符是那些可以使用\
    \ `pipe` 语法连接到可观察对象的操作符。这些操作符包括 `filter`、`map` 或 `take`。可管道操作符是一个函数，它接受一个可观察对象作为输入，并返回另一个可观察对象。订阅输出可观察对象也会订阅输入可观察对象。操作符转换数据流中的值。它们返回一个包含转换后值的可观察对象。\n\
    \n`map` 使用映射函数转换可观察对象源中的值。\n\n```\nimport { of } from 'rxjs';\nimport { map }\
    \ from 'rxjs/operators';\n\nconst dataSource = of(1, 2, 3);\nfunction double(n){\n\
    \  return n * 2;\n}\ndataSource\n  .pipe(\n    map(double)\n  )\n  .subscribe(console.log);\n\
    //2\n//4\n//6\n```\n\n`filter` 使用谓词函数过滤流中的值。\n\n```\nimport { of } from 'rxjs';\n\
    import { map, filter } from 'rxjs/operators';\n\nconst dataSource = of(1, 2, 3,\
    \ 4, 5);\nfunction isEven(n){\n  return n % 2 === 0;\n}\ndataSource\n  .pipe(\n\
    \    filter(isEven)\n  )\n  .subscribe(console.log);\n//2\n//4\n```\n\n`take`\
    \ 操作符允许只选择可观察对象源中前 `n` 个发出的值。以下是从源中选择前三个值的示例。\n\n```\nimport { of } from 'rxjs';\n\
    import { take } from 'rxjs/operators';\n\nconst source = of(1, 2, 3, 4, 5);\n\
    source\n  .pipe(\n    take(3)\n  )\n  .subscribe(console.log);\n//1\n//2\n//3\n\
    ```\n\n`pipe` 方法在可观察对象源上创建了一个管道。它允许我们将数据通过一个操作符管道进行转换。\n\n```\nimport { of } from\
    \ 'rxjs';\nimport { map, filter } from 'rxjs/operators';\n\nconst dataSource =\
    \ of(1, 2, 3, 4, 5);\nfunction isEven(n){\n  return n % 2 === 0;\n}\nfunction\
    \ double(n){\n  return n * 2;\n}\ndataSource\n  .pipe(\n    filter(isEven),\n\
    \    map(double)\n  )\n  .subscribe(console.log);\n//4\n//8\n```\n\n## 观察者\n\n\
    观察者是具有三个回调函数的对象，每个回调对应可观察对象传递的一种通知类型。观察者是可观察对象传递的值的消费者。以下是一个处理所有类型通知的简单观察者对象。\n\
    \n```\nconst observer = {\n  next(value){\n    console.log(`Next: ${value}`)\n\
    \  },\n  error(msg){\n    console.error(`Error: ${msg}`)\n  },\n  complete(value){\n\
    \    console.error(`Complete`)\n  }\n};\n```\n\n观察者被用作可观察对象 `subscribe` 方法的参数。\n\
    \n```\nconst observable = Observable.create(observer => {\n  observer.next(1);\n\
    \  observer.next(2);\n  observer.complete('Done');\n});\n\nobservable.subscribe(observer);\n\
    //Next: 1\n//Next: 2\n//Complete\n```\n\n以下是一个订阅可观察对象的示例，该对象发出两个值然后失败。\n\n```\n\
    const observable = Observable.create(observer => {\n  observer.next(1);\n  observer.next(2);\n\
    \  observer.error('Failed');\n});\n\nobservable.subscribe(observer);\n//Next:\
    \ 1\n//Next: 2\n```\n\n"
- fmt: "\n//Error: Failed\n\nThere is no need to have a callback in the observer object\
    \ for all notification types. Some notifications can be ignored. We can subscribe\
    \ to an observable by just providing a callback as an argument and not an observer\
    \ object. This is equivalent to creating an observer with just the `next` handler.\n\
    \n```javascript\nobservable.subscribe(value => console.log(`Next: ${value}`));\n\
    ```\n\nAll three types of callbacks can be provided as arguments to the `subscribe`\
    \ method. This is equivalent to creating an observer with all three handlers.\n\
    \n```javascript\nobservable.subscribe(\n  value => console.log(`Next: ${value}`),\n\
    \  msg => console.error(`Error: ${msg}`),\n  () => console.error(`Complete`)\n\
    );\n```\n\n## Subscriptions\n\nA subscription is an object created when subscribing\
    \ to an observable. It allows us to unsubscribe from that observable.\n\n```javascript\n\
    import { interval } from 'rxjs';\n\nconst observable = interval(1000);\nconst\
    \ subscription = observable.subscribe(console.log);\n\n//later\nsetTimeout(()\
    \ => {\n  subscription.unsubscribe();\n}, 3500);\n\n//0 -> after 1s\n//1 -> after\
    \ 2s\n//2 -> after 3s\n```\n\nThe subscription object has just the `unsubscribe`\
    \ method. When all subscribers unsubscribe from an observable, that observable\
    \ stops its execution. An observable starts its execution when it has at least\
    \ one subscriber.\n\n## Higher-Order Observables\n\nIn most cases, observables\
    \ emit primitives or data objects but sometimes they may emit other observables.\
    \ In this case, they are called higher-order observables.\n\nConsider for example\
    \ an observable emitting URL strings. We may have a mapping function taking the\
    \ URL and returning a new observable.\n\n```javascript\nimport { from } from 'rxjs';\n\
    import { ajax } from 'rxjs/ajax';\nimport { map } from 'rxjs/operators';\n\nconst\
    \ observable = from([\n  '/dictionaries',\n  '/todos'\n]);\n\nobservable.pipe(\n\
    \  map(ajax.getJSON)\n).subscribe(console.log);\n\n//Observable {}\n//Observable\
    \ {}\n```\n\n`ajax.getJSON` is the mapping function. It takes the URL and returns\
    \ an observable emitting the response from the network request for each URL. After\
    \ this transformation, we have an observable of observables, a higher-order observable.\n\
    \nThe challenge is to work with a higher-order observable. In this case, we need\
    \ a flattening operation, meaning we need to convert the higher-order observable\
    \ into an ordinary observable.\n\n## Flattening Operators\n\nInstead of working\
    \ with an observable that emits observables wrapping the data got from the server,\
    \ we want to work with an observable emitting the data got from the server.\n\n\
    ### concatAll()\n\nThe `concatAll` operator subscribes to each observable inside\
    \ the “outer” observable and copies all the emitted values until that inner observable\
    \ completes. Then it goes to the next one. It creates a new observable emitting\
    \ all these concatenated values.\n\nHere is how we can use it to flatten the higher-order\
    \ observable and get an observable emitting the results of all network requests.\n\
    \n```javascript\nimport { from } from 'rxjs';\nimport { ajax } from 'rxjs/ajax';\n\
    import { map, concatAll } from 'rxjs/operators';\n\nconst observable = from([\n\
    \  '/dictionaries',\n  '/todos'\n]);\n\nobservable.pipe(\n  map(ajax.getJSON),\n\
    \  concatAll()\n).subscribe(console.log);\n\n//[{name: 'Dictionary'}]\n//[{title:\
    \ 'To Do'}]\n```\n\n### mergeAll()\n\nAnother useful flattening is `mergeAll`.\
    \ It subscribes to each inner observable as it arrives, then emits each value\
    \ as it arrives.\n\nUsing `mergeAll` instead of `concatAll` in the previous example\
    \ makes no difference because each of the inner AJAX observable emits just a single\
    \ value. The difference can be seen when the inner observables emit several values\
    \ over time.\n\n### mergeMap()\n\nConsider a mapping function that takes a value\
    \ and returns an observable emitting the first three numbers from a sequence.\
    \ The sequence of numbers is defined using the input value as the constant `c`\
    \ and applying the `n*c + 1` formula.\n\nWhen `c = 2` the sequence formula is\
    \ `2n + 1` and the first three values are `3`, `5` and `7`.  \nWhen `c = 4` the\
    \ sequence formula is `4n + 1` and the first three values are `5`, `9` and `13`.\n\
    \nHere is the `toSequence` mapping function creating an observable.\n\n```javascript\n\
    function toSequence(x) {\n  const getNTerm = createGetNTerm(x);\n  return of(1,\
    \ 2, 3).pipe(\n    map(getNTerm)\n  )\n}\n\nfunction createGetNTerm(c){\n  return\
    \ function(n){\n    return n * c + 1\n  }\n}\n```\n\nWhen invoked with the value\
    \ `2`, `toSequence` returns an observable emitting `3`, `5` and `7`.\n\n```javascript\n\
    toSequence(2)\n//Observable 3 5 7\n\ntoSequence(4)\n//Observable 5 9 13\n```\n\
    \nNext, let’s apply the `toSequence` mapping function to an observable containing\
    \ several values that are to be used as constants in the newly created sequences.\n\
    \n```javascript\nimport { from } from 'rxjs';\nimport { map, mergeAll } from 'rxjs/operators';\n\
    \nfrom([2, 4]).pipe(\n  map(toSequence)\n)\n.subscribe(console.log);\n\n//Observable\
    \ 3 5 7\n//Observable 5 9 13\n```\n\nAt this point, we have an observable emitting\
    \ observables containing the first three numbers from the sequence.\n\nUsing `mergeAll`\
    \ will create a new observable emitting the numbers from all generated sequences.\
    \ First, it emits all the numbers from the first sequence, then from the second\
    \ and so on.\n\n```javascript\nfrom([2, 4]).pipe(\n  map(toSequence),\n  mergeAll()\n\
    )\n//.subscribe(console.log);\n//3\n//5\n//7\n//5\n//9\n//13\n```\n\n`mergeMap`\
    \ does the same thing as applying `map` and then calling `mergeAll`.\n\n```javascript\n\
    from([2, 4]).pipe(\n  mergeMap(toSequence)\n)\n.subscribe(console.log);\n\n//3\n\
    //5\n//7\n//5\n//9\n//13\n```\n\n## Combining Observables\n\nNext, we are going\
    \ to look at operators for combining multiple observables into a single one.\n\
    \n### forkJoin()\n\nLet’s take the situation of two observables emitting results\
    \ from network requests. We want to execute logic when both network requests have\
    \ completed.\n\n```javascript\nimport { ajax } from 'rxjs/ajax';\nimport { forkJoin\
    \ } from 'rxjs';\n\nconst dictionariesObservable = ajax.getJSON('/dictionaries');\n\
    const todosObservable = ajax.getJSON('/todos');\n\nforkJoin({\n  dictionaries:\
    \ dictionariesObservable,\n  todos: todosObservable\n}).subscribe(console.log);\n\
    \n//{dictionaries: Array(), todos: Array()}\n```\n\n`forkJoin` creates an observable\
    \ from other observables. When all inner observables complete, it provides the\
    \ last emitted value from each as a dictionary.\n\nThe `forkJoin` operator allows\
    \ us to issue multiple requests on the page loaded and take action when a response\
    \ has been received from all. It is similar to `Promise.all`.\n\n### race()\n\n\
    `race` takes several observables and returns the observable that emits first.\
    \ It is similar to `Promise.race`.\n\n```javascript\nimport { ajax } from 'rxjs/ajax';\n\
    import { race } from 'rxjs';\n\nconst dictionariesObservable = ajax.getJSON('/dictionaries');\n\
    const todosObservable = ajax.getJSON('/todos');\n\nconst observable = race(\n\
    \  dictionariesObservable,\n  todosObservable\n);\n\nobservable.subscribe(console.log);\n\
    ```\n\n## Functor Laws\n\nObservables have a `map` operation that respects both\
    \ functor laws.\n\n### Identity Law\n\n```javascript\nimport { of } from 'rxjs';\n\
    import { map } from 'rxjs/operators';\n\nfunction identity(n){\n  return n;\n\
    }\n\nof(1, 2, 3)\n  .pipe(\n    map(identity)\n  )\n//Observable 1,2,3\n```\n\n\
    ### Composition Law\n\n```javascript\nimport { of } from 'rxjs';\nimport { map\
    \ } from 'rxjs/operators';\n\nfunction increment(n){\n  return n + 1;\n}\n\nfunction\
    \ double(n){\n  return n * 2\n}\n\nof(1, 2, 3)\n  .pipe(\n    map(increment),\n\
    \    map(double)\n  )\n//Observable 4,6,8\n\nof(1, 2, 3)\n  .pipe(\n    map(x\
    \ => double(increment(x)))\n  )\n//Observable 4,6,8\n```\n\nObservables are functors.\n\
    \n## Monad Laws\n\nObservables have a flat mapping operation called `mergeMap`\
    \ that respects the monad laws.\n\n### Left Identity\n\n`M.unit(x).flatMap(f)\
    \ === f(x)`\n\nWe can consider `of` as the unit function creating an observable.\n\
    \n```javascript\nimport { of } from 'rxjs';\nimport { mergeMap } from 'rxjs/operators';\n\
    \nfunction f(n){\n  return of(n + 1);\n}\n\nof(1)\n  .pipe(\n    mergeMap(f)\n\
    \  )\n//Observable 2\n\nf(1)\n//Observable 2\n```\n\n### Right Identity\n\nApplying\
    \ the unit function to an observable results in an observable emitting the same\
    \ values.\n\n```javascript\nfunction unit(value){\n  return of(value)\n}\n\nof(1)\n\
    \  .pipe(\n    mergeMap(unit)\n  )\n  .subscribe(console.log);\n//Observable 1\n\
    ```\n\n### Associativity\n\n`monad.flatMap(f).flatMap(g) === monad.flatMap(x =>\
    \ f(x).flatMap(g))`\n\nHere is how we can translate the law for observables.\n\
    \n```javascript\nfunction g(n){\n  return of(n * 2);\n}\n\nof(1)\n  .pipe(\n \
    \   mergeMap(f),\n    mergeMap(g)\n  )\n//Observable 4\n\nof(1)\n```\n"
