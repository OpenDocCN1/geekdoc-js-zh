  trans: "\n\n//[ 'orange', 'orange', 'kiwi', 'kiwi' ]\n\n回顾：函子是一个具有 `map` 操作的对象。单子是一个具有\
    \ `map` 和 `flatMap` 操作的对象。函子将一个函数应用于包装的值。单子将一个返回包装值的函数应用于包装的值。本质上，单子只是值的包装器。我们可以通过一个存储单个值并支持映射和扁平映射的对象来创建它。在接下来的章节中，我们将探讨实用的单子，如不可变列表、Promise\
    \ 和 Observable。\n\n# 第 11 章：不可变集合\n\n集合是可以迭代的任何东西。不可变集合在“更改”操作时返回一个新集合。我们将研究 [Immutable.JS](https://immutable-js.github.io/immutable-js/)\
    \ 库中提供的此类集合。首先安装它。\n\n```\nnpm install immutable --save\n```\n\n## List\n\nList\
    \ 是索引集合，类似于数组。实际上，它们可以从数组创建。\n\n```\nimport { List } from 'immutable';\n\nconst\
    \ emptyList = List();\n\n// List []\n\nconst list = List([\n  { name: 'Rhodes'\
    \ },\n  { name: 'Malaga' }\n]);\n\n// List [\n//   { name: 'Rhodes' },\n//   {\
    \ name: 'Malaga' }]\n```\n\n[`List()`](https://immutable-js.github.io/immutable-js/docs/#/List/List)\
    \ 创建一个新的不可变 `List`，包含作为参数提供的值。`List` 是一个工厂函数，不使用 `new` 关键字。\n\n### 编辑元素\n\n[`set(index,\
    \ value)`](https://immutable-js.github.io/immutable-js/docs/#/List/set) 允许我们编辑集合中指定索引处的元素。它返回一个包含修改的新\
    \ `List`。指定索引位置的元素将被替换。\n\n```\nconst newList = list.set(0, { name: 'Riomaggiore'\
    \ });\n\n// List [\n//   { name: 'Riomaggiore' },\n//   { name: 'Malaga' }]\n\n\
    console.log(list === newList);\n//false\n```\n\n### 添加元素\n\n[`push(…values)`](https://immutable-js.github.io/immutable-js/docs/#/List/push)\
    \ 返回一个新 `List`，其中追加了提供的值。它可以用于向列表添加新值。示例如下。\n\n```\nconst newList = list.push({name:\
    \ 'Funchal'});\n\n// List [\n//   { name: 'Rhodes' },\n//   { name: 'Malaga' },\n\
    //   { name: 'Funchal'}]\n```\n\n添加也可以使用 [`concat(…values)`](https://immutable-js.github.io/immutable-js/docs/#/List/concat)\
    \ 完成。它将一个新集合连接到现有集合。要添加单个值，我们使用包含一个值的数组调用它。\n\n```\nconst newList = list.concat([{name:\
    \ 'Funchal'}]);\n\n// List [\n//   { name: 'Rhodes' },\n//   { name: 'Malaga'\
    \ },\n//   { name: 'Funchal'}]\n```\n\n[`unshift(…values)`](https://immutable-js.github.io/immutable-js/docs/#/List/unshift)\
    \ 返回一个新 `List`，其中前置了提供的值。\n\n### 删除元素\n\n[`delete(index)`](https://immutable-js.github.io/immutable-js/docs/#/List/delete)\
    \ 删除指定索引处的元素，并返回包含修改的新 `List`。\n\n```\nconst newList = list.delete(0);\n\n// List\
    \ [{ name: 'Malaga' }]\n```\n\n`delete` 有别名 `remove`。\n\n[`pop()`](https://immutable-js.github.io/immutable-js/docs/#/List/pop)\
    \ 返回一个新 `List`，其中移除了最后一个元素。\n\n[`shift()`](https://immutable-js.github.io/immutable-js/docs/#/List/shift)\
    \ 返回一个新 `List`，其中移除了第一个元素。\n\n### 清空列表\n\n[`clear()`](https://immutable-js.github.io/immutable-js/docs/#/List/clear)\
    \ 返回一个没有值的新 `List`。\n\n```\nconst newList = list.clear();\n\nconsole.log(newList)\n\
    // List []\n```\n\n### 数据转换\n\n我们可以像处理数组一样处理列表。List 具有 `filter`、`map`、`flatMap`、`reduce`\
    \ 和 `sort` 方法，其工作方式与数组相同。这次 `sort` 方法是一个纯方法，返回一个新集合。\n\n以下是一个使用 `filter` 方法从目标对象列表中选择特定国家目的地的示例。\n\
    \n```\nimport { List } from 'immutable';\n\nconst list = List([\n  { name: 'Cascais',\
    \ country: 'Portugal'},\n  { name: 'Sintra', country: 'Portugal' },\n  { name:\
    \ 'Nerja', country: 'Spain' },\n]);\n\nfunction inCountry(country){\n  return\
    \ function(destination){\n    return destination.country === country;\n  }\n}\n\
    \nlist\n  .filter(inCountry('Portugal'))\n\n//List [\n//  {name:'Cascais',country:'Portugal'},\n\
    //  {name:'Sintra',country:'Portugal'}]\n```\n\n注意 `inCountry` 是一个柯里化函数。\n\nList\
    \ 是单子，因为它们同时支持映射和扁平映射。\n\n### 查找元素\n\nList 具有用于检索数据的方法。\n\n[`get(index)`](https://immutable-js.github.io/immutable-js/docs/#/List/get)\
    \ 返回与提供的索引关联的元素。\n\n[`first()`](https://immutable-js.github.io/immutable-js/docs/#/List/first)\
    \ 返回集合中的第一个元素。如果集合为空，则返回 `undefined`。类似地，[`last()`](https://immutable-js.github.io/immutable-js/docs/#/List/last)\
    \ 返回集合中的最后一个元素。\n\n[`find()`](https://immutable-js.github.io/immutable-js/docs/#/List/find)\
    \ 返回谓词函数返回 `true` 的第一个元素。[`findLast()`](https://immutable-js.github.io/immutable-js/docs/#/List/findLast)\
    \ 返回谓词函数返回 `true` 的最后一个元素。以下是在之前列表上使用这两个方法的示例。\n\n```\nimport { List } from 'immutable';\n\
    \nconst list = List([\n  { name: 'Cascais', country: 'Portugal'},\n  { name: 'Sintra\
    \ ', country: 'Portugal' },\n  { name: 'Nerja ', country: 'Spain' },\n]);\n\n\
    const destination = list.find(inCountry('Portugal'));\n//{ name: 'Cascais', country:\
    \ 'Portugal' }\n\nconst otherDestionation = list.findLast(inCountry('Portugal'));\n\
    //{ name: 'Sintra ', country: 'Portugal' }\n```\n\n## Map\n\nMap 是键值对的集合。不可变 Map\
    \ 接受任何类型的键。\n\n以下是一个按 id 创建国家对象 Map 的示例。\n\n```\nimport { Map } from 'immutable';\n\
    \nconst countryMap = Map({\n  \"1\": { name: 'Italy'},\n  \"2\": { name: 'Portugal'},\n\
    \  \"3\": { name: 'UK'}\n});\n```\n\n[`get(key)`](https://immutable-js.github.io/immutable-js/docs/#/Map/get)\
    \ 返回与给定键关联的值。\n\n```\nconsole.log(countryMap.get(\"3\"));\n//{ name: 'UK' }\n\
    ```\n\n[`set(key, value)`](https://immutable-js.github.io/immutable-js/docs/#/Map/set)\
    \ 返回一个包含该键值对的新 `Map`。如果键已存在，则替换其值。如果键不存在，则添加它。`set` 可用于添加和编辑键值对。\n\n```\nconst\
    \ newMap = countryMap.set(\"2\", { name: 'Spain'});\nconsole.log(newMap.get(\"\
    2\"));\n//{ name: 'Spain' }\n```\n\n[`has(key)`](https://immutable-js.github.io/immutable-js/docs/#/Map/has)\
    \ 如果给定键存在于 Map 中，则返回 `true`，否则返回 `false`。\n\n[`delete(key)`](https://immutable-js.github.io/immutable-js/docs/#/Map/delete)\
    \ 返回一个移除了指定键的新 `Map`。\n\n```\nconst newMap = countryMap.delete(\"3\");\nconsole.log(newMap.has(\"\
    3\"));\n//false\n\nconsole.log(newMap.get(\"3\"));\n```\n\n"
