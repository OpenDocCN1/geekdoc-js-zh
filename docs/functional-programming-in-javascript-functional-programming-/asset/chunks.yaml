    Below is an example.throw new Error(''The errors details'');Exceptions are not
    used in functional programming, which means we need to find other alternatives
    for those scenarios.For asynchronous code, the best way is to return a rejected
    promise when the operation fails. We will look at this scenario when discussing
    promises. For synchronous code, we need to return a different result when an error
    happens.Here is the lint rule for disabling the throw statement:"functional/no-throw-statement":
    "error"RecapConditional statements should return a value on all branches.The better
    alternative for the if statement is the conditional operator.Switches can be replaced
    with a map.We should use the array methods instead of the loop statements.We are
    going to use only one disruptive statement return .Chapter 07: RecursionRecursion
    implies that a function calls itself. The recursion needs a termination. This
    happens when a certain condition is met and the recursive algorithm stops calling
    itself and returns a value.Recursion is a method of solving a problem where the
    solution is found by solving smaller instances of the same problem.Recursive FactorialLet’s
    start by looking at the algorithm for computing the factorial of a number in an
    iterative style. As you remember n! = n * (n-1)! .function factorial(n) {


    let result = 1;


    let i = 2;


    while(i <= n){


    result = result * i;


    i = i + 1;


    }


    return result;


    }


    console.log(factorial(5));


    //i=2, result=2


    //i=3, result=6


    //i=4, result=24


    //i=5, result=120


    //120Here is how we can implement the same algorithm using recursion.function
    factorial(n) {


    if (n === 0) { 


    return 1;  


    }


    else {  


    return n * factorial(n - 1);  


    }


    }


    //n=5 -> 5*f(4)


    //n=4 -> 4*f(3)


    //n=3 -> 3*f(2)


    //n=2 -> 2*f(1)


    //n=1 -> 1*f(0)


    //n=0 -> 1 Stops!


    //n=1 -> 1*f(0) = 1*1 = 1


    //n=2 -> 2*f(1) = 2*1 = 2


    //n=3 -> 3*f(2) = 3*2 = 6


    //n=4 -> 4*f(3) = 4*6 = 24


    //n=5 -> 5*f(4) = 5*24= 120


    console.log(factorial(5));


    //120The factorial function calls itself until it has the result for n being 0
    . Then it resumes the execution and computes the result for n equal to 1 , 2 ,
    3 , 4 and finally 5 .Below is the same recursive function refactored using the
    conditional operator.function factorial(n) {


    return (n === 0) 


    ? 1


    : n * factorial(n - 1);  


    }


    console.log(factorial(5));


    //120Tail-Call OptimizationHere is another way of writing the factorial function.function
    factorial(n, result = 1) {


    //console.log(`n=${n}, result=${result}`);


    return (n === 0) 


    ? result


    : factorial(n - 1, n * result);  


    }


    console.log(factorial(5));


    //n=5, result=1


    //n=4, result=5


    //n=3, result=20


    //n=2, result=60


    //n=1, result=120


    //n=0, result=120


    //120Notice that this time, once the function arrives at the stopping condition
    it returns the result. It does not need to go back and resume the previous calls
    to return the end result. It returns when the ending condition is met because
    it has all the necessary data.A recursive function is tail-recursive when the
    recursive call is the last thing the function does.The tail-recursive functions
    should be optimized by the compiler and should perform better.At the moment of
    writing the tail-call optimization is not implemented by the major browsers.Stack
    Overflow ErrorConsider the following function that computes the sum of all values
    from 0 to 10000 in an iterative stylefunction sumAll(n) {       


    let total = 0;


    let i = 1;


    while(i <= n){


    total = total + i;


    i = i + 1;


    }


    return total;


    }


    console.log(sumAll(10000));


    //50005000Below is the equivalent code written with the tail-call optimization.function
    sumAll(n, i = 0, result = 0) {


    return (i > n) 


    ? result


    : sumAll(n, i + 1, i + result);  


    }


    console.log(sumAll(5));


    //15Calling the recursive function with a larger number leads to the stack overflow
    error.console.log(sumAll(10000));'
