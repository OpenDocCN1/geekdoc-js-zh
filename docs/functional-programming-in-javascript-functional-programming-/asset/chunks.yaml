    \n# Introduction\n\nFunctional programming is becoming more popular and this book\
    \ aims to bring clarity on how to use JavaScript as a functional language.\n\n\
    It turns out that JavaScript has everything it needs to be used as a functional\
    \ language. We just need to remove features from the language.\n\nIn essence,\
    \ we are going to remove the `this` keyword from our code. That means we are not\
    \ going to use classes or methods using the `this` keyword. It also implies not\
    \ using custom prototypes.\n\nRemoving `this` has other benefits. `this` is the\
    \ source of much confusion in JavaScript, mainly because it depends on how the\
    \ function is invoked, not where the function is defined. There are many situations\
    \ where `this` points to an unexpected function context and that leads to bugs.\
    \ By removing `this` all the related problems are gone.\n\nJavaScript is both\
    \ a functional programming language and a prototype-based language. If we get\
    \ rid of `this`, we are left with JavaScript as a functional programming language.\
    \ That is even better.\n\nThat being said, we can remove `this` from our code\
    \ by enabling linting.\n\nHere is an example of a lint configuration file disabling\
    \ the `this` keyword from an application built with [Create React App](https://reactjs.org/docs/create-a-new-react-app.html).\n\
    \n```json\n{\n  \"extends\": [\"react-app\"],\n  \"plugins\": [\n    \"immutable\"\
    \n  ],\n  \"rules\": {\n    \"immutable/no-this\": \"error\"\n  }\n}\n```\n"
