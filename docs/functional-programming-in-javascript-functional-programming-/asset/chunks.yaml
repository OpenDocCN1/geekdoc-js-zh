    }\n\nmultiply.call(null, 2, 3);\n```\n\n## 高阶函数\n\n高阶函数是操作其他函数的函数。高阶函数将其他函数作为参数、返回函数，或两者兼有。所有以函数作为输入的数组方法，如\
    \ `filter`、`map`、`reduce`、`sort`，都是高阶函数。之前自定义的 `doOperation` 函数就是一个高阶函数，因为它将另一个函数作为输入。考虑下面返回函数的高阶函数。\n\
    \n```\nconst objects = [\n  { id: 1 },\n  { id: 2 }\n];\n\nfunction hasId(id){\n\
    \  return function(element){\n    return element.id === id;\n  }\n}\n\nconsole.log(objects.find(hasId(1)));\n\
    //{ id: 1 }\n```\n\n`hasId` 返回一个函数。`hasId` 是一个高阶函数。下面是一个高阶函数创建 `sort` 方法所需的比较函数的例子。\n\
    \n```\nconst courses = [\n  {\n    title: 'Course 2',\n    author: 'Author 2'\n\
    \  },\n  {\n    title: 'Course 3',\n    author: 'Author 3'\n  },\n  {\n    title:\
    \ 'Course 1',\n    author: 'Author 1'\n  }  \n];\n\nfunction by(name){\n  return\
    \ function(a, b){\n    return a[name].localeCompare(b[name]);\n  }\n}\n\ncourses\n\
    \  .slice().sort(by('author'))\n```\n\n`by` 是一个高阶函数。它允许我们使用对象中任意字符串类型的属性对列表进行排序。\n\
    \n## 闭包\n\n函数可以在其他函数内部定义。内部函数除了可以访问自己的参数和变量外，还可以访问外部函数的参数和变量。闭包是指内部函数能够访问外部函数变量的能力。让我们从一个基本例子开始。\n\
    \n```\nfunction run(){\n  const value = 1;\n  function logValue(){\n    console.log(value);\n\
    \  }\n  logValue();\n}\n\nrun();\n//1\n```\n\n在函数内部定义的所有变量仅在该函数内部可见。`logValue`\
    \ 函数定义在 `run` 函数内部，并且可以访问 `value` 变量。当内部函数在外部函数调用结束后仍然存在时，闭包就变得非常重要。考虑下一个例子。\n\
    \n```\nfunction createCount(){\n  let counter = 0;\n  return function count(){\n\
    \    counter = counter + 1;\n    return counter;\n  }\n}\n\nconst count = createCount();\n\
    \nconsole.log(count());\n//1\n\nconsole.log(count());\n//2\n\nconsole.log(count());\n\
    //3\n```\n\n`count` 可以访问外部函数中的 `counter` 变量。`count` 在外部函数调用结束后仍然存在。`count` 就是一个闭包。\n\
    \n## 回顾\n\n- 函数是值。\n- 函数可以操作其他函数。函数可以将其他函数作为输入，或者返回函数。\n- 内部函数可以访问外部函数的变量，即使外部函数已经执行完毕。\n\
    \n## 第 06 章：语句\n\n表达式是由一个或多个值、变量、运算符和函数组合而成，能够产生一个新值。简而言之，表达式是产生值的代码单元。语句是执行某个动作的指令。在函数式编程中，所有内容都应该是产生值的表达式。为了实现这一点，我们将审查并移除那些不产生值的语句。\n\
    \n### 表达式\n\n例如，`1 + 2` 是一个表达式。当函数返回一个值时，函数调用也是一个表达式。考虑 `multiply` 函数。\n\n```\n\
    function multiply(a, b){\n  return a * b;\n}\n```\n\n`multiply(2, 3)` 是一个表达式。一个表达式可以包含其他表达式。例如，表达式\
    \ `multiply(2, 3+7)` 包含了表达式 `3+7`。算术表达式求值为数字。字符串表达式求值为字符串。示例如下：\n\n```\n\"This\
    \ \" + \"IS A texT\".toLowerCase();\n//\"This is a text\"\n```\n\n逻辑表达式求值为 `true`\
    \ 或 `false`。这些表达式通常使用像 `&&`、`||`、`!` 或 `===` 这样的[逻辑运算符](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Expressions_and_Operators#Logical)。\n\
    \n```\n1 === 2;\n//false\n```\n\n表达式是一段返回值的代码。\n\n### 声明语句\n\n有三种声明变量的语句：`var`、`let`\
    \ 和 `const`。`var` 语句声明的变量具有函数作用域，但没有块作用域。这可能会造成混淆。`var` 声明已经过时，因此我们可以通过 lint 规则禁用它的使用。\n\
    \n```\n\"no-var\": \"error\"\n```\n\n我建议将 `const` 作为默认声明，并将 `let` 作为备选方案。`const`\
    \ 声明禁止重新赋值变量，并且由于我们所有的值都是不可变的，我们创建了真正的常量，既不能重新赋值也不能更改。使用 `const` 声明意味着每次更改时都要创建一个新变量。这促进了函数的纯度。\n\
    \n### 条件语句\n\n#### `if` 语句\n\n`if` 语句不一定返回值，因此在函数式风格中，我们应该要么始终包含 `else` 分支并返回一个值，要么完全禁用\
    \ `if` 语句。我们将禁用以下 `if` 语句的使用方式。\n\n```\nconst n = 3;\nlet isEven;\n\nif(n % 2\
    \ === 0){\n  isEven = true;\n} else {\n  isEven = false;\n}\n\nconsole.log(isEven);\n\
    ```\n\n只有当 `if` 语句包含 `else` 分支且所有分支都有 `return` 语句时，才允许使用。以下是相应的 lint 规则。\n\n```\n\
    \"functional/no-conditional-statement\": [\"error\", {\n  \"allowReturningBranches\"\
    : \"ifExhaustive\"\n}]\n```\n\n下面是一个带有 `else` 分支且始终返回值的 `if` 语句示例。\n\n```\nfunction\
    \ isEven(n){\n  if(n % 2 === 0){\n    return true;\n  } else {\n    return false;\n\
    \  }\n}\n\nconsole.log(isEven(3));\n```\n\n#### 条件运算符\n\n更好的选择是使用[条件运算符](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Conditional_Operator)，它是一个返回值的表达式。\n\
    \n```\nconst n = 3;\nconst isEven = (n % 2 === 0)\n  ? true\n  : false\n\nconsole.log(isEven);\n\
    //false\n```\n\n下面是一个函数示例，当没有提供产品对象时返回 `null`，当价格可用时返回价格，否则返回 `lastPrice`。\n\n\
    ```\nfunction getPrice(product){\n  return product\n    ? product.price\n    \
    \  ? product.price\n      : product.lastPrice\n    : null       \n}\n\nconsole.log(getPrice(null));\n\
    //null\n\nconsole.log(getPrice({lastPrice: 10}));\n//10\n\nconsole.log(getPrice({price:5,\
    \ lastPrice: 10}));\n//5\n```\n\n#### `switch` 语句\n\n与 `if` 语句类似，`switch` 语句允许编写不返回值的代码。应禁用以下\
    \ `switch` 语句的使用方式。\n\n```\nfunction increment(x){\n  return x + 1;\n}\n\nfunction\
    \ decrement(x){\n  return x - 1;\n}\n\nfunction doAction(actionName){\n  switch(actionName){\n\
    \    case \"increment\":\n      number = increment(number);\n      break;\n  \
    \  case \"decrement\":\n      number = decrement(number);\n      break;\n  }\n\
    }\n\nlet number = 0;\ndoAction('increment')\nconsole.log(number);\n//1\n```\n\n\
    只有当 `switch` 语句包含 `default` 分支且所有分支都返回值时，才允许使用。请看下一个示例。\n\n```\nfunction doAction(x,\
    \ actionName){\n  switch(actionName){\n    case 'increment':\n      return increment(x);\n\
    \    case 'decrement':\n      return decrement(x);\n    default:\n      return\
    \ x;\n  }\n}\n\nconst number = 0;\nconst newNumber = doAction(number, 'increment');\n\
    console.log(newNumber);\n//1\n```\n\n更好的选择是使用映射（map）。它有助于将 switch 分解为更小的部分。以下是使用对象字面量作为映射重写相同逻辑的方式。\n\
    \n```\nfunction increment(x){\n  return x + 1;\n}\n\nfunction decrement(x){\n\
    \  return x - 1;\n}\n\nconst actionMap = {\n```\n\n"
