  \n| ![tip](img/leanpub_key.png) | 为方法获取正确的上下文至关重要。常用的术语是我们想要绑定方法而不是未绑定方法。当前的 JavaScript\
  \ 版本提供了 `.bind` 方法来帮助，像 Underscore 这样的框架也提供了方便绑定方法的辅助方法。 |\n\n### 部分应用、绑定和柯里\n\n\
  现在我们已经了解了函数上下文是如何工作的，可以重新回顾部分应用的主题。回顾我们通用的左部分应用配方：\n\n```\n1 var callLeft = variadic(\
  \ function (fn, args) {\n2   return variadic( function (remainingArgs) {\n3    \
  \ return fn.apply(this, args.concat(remainingArgs))\n4   })\n5 })\n```\n\n`Function.prototype.bind`\
  \ 有时可以完成相同的工作，但速度会快得多。例如，而不是使用：\n\n```\n1 function add (verb, a, b) { \n2   return\
  \ \"The \" + verb + \" of \" + a + ' and ' + b + ' is ' + (a + b) \n3 }\n4 \n5 var\
  \ sumFive = callLeft(add, 'sum', 5);\n6 \n7 sumFive(6)\n8   //=> 'The sum of 5 and\
  \ 6 is 11'\n```\n\n\n\n\n你可以这样写：\n\n```\n1 var totalSix = add.bind(null, 'total',\
  \ 6);\n2 \n3 totalSix(5)\n4   //=> 'The total of 6 and 5 is 11'\n```\n\n陷阱在于 `.bind`\
  \ 的第一个参数：它设置了上下文（context）。如果你编写的函数没有上下文（例如我们的 `.add`），你可以使用 `.bind` 来实现左偏应用（left\
  \ partial application）。但如果你想对必须保留上下文的方法或其他函数进行部分偏应用，就不能使用 `.bind`。你可以使用 *JavaScript\
  \ Allongé* 中提供的方案，因为它们能正确地保留上下文。\n\n通常，当你想要对方法执行部分偏应用时，上下文是非常关重要的。因此对于一个极其简单的例子，我们经常使用\
  \ `Array.prototype.slice` 将 `arguments` 转换为数组。所以与其：\n\n```\n1 var __slice = Array.prototype.slice;\n\
  2 \n3 var array = __slice.call(arguments, 0);\n```\n\n我们可以这样写：\n\n```\n1 var __copy\
  \ = callFirst(Array.prototype.slice, 0);\n2 \n3 var array = __copy.call(arguments)\n\
  ```\n\n另一个陷阱是 `.bind` 只执行左偏求值。如果你想执行右偏应用，你需要 `callLast` 或 `callRight`。\n\n### 柯里化\
  \ (Currying)\n\n“部分偏应用”（partial application）和“柯里化”（currying）术术密切相关但并不等同。柯里化是将一个接受多个参数的函数转换为接受单个参数的等价函数。这种函数是如何等价？只要它返回一个部分应用的函数，它就能工作。\n\
  \n代码通常比文字清晰得多。回顾：\n\n```\n1 function add (verb, a, b) { \n2   return \"The \" +\
  \ verb + \" of \" + a + ' and ' + b + ' is ' + (a + b) \n3 }\n4 \n5 add('sum', 5,\
  \ '6')\n6   //=> 'The sum of 5 and 6 is 11'\n```\n\n这里是柯里化的版本：\n\n```\n 1 function\
  \ addCurried (verb) {\n 2   return function (a) {\n 3     return function (b) {\n\
  \ 4       return \"The \" + verb + \" of \" + a + ' and ' + b + ' is ' + (a + b)\
  \ \n 5     }\n 6   }\n 7 }\n 8 \n 9 addCurried('total')(6)(5)\n10   //=> 'The total\
  \ of 6 and 5 is 11'\n```\n\n手动柯里化是一项巨大的工程，但它与部分偏应用的紧密关系意味着，如果你有左偏应用，就可以推导出柯里化；或者，如果你有柯里化，就可以推导出左偏应用。让我们从\
  \ `callFirst` 推导出柯里化。回溯：\n\n```\n1 var __slice = Array.prototype.slice;\n2 \n3 function\
  \ callFirst (fn, larg) {\n4   return function () {\n5     var args = __slice.call(arguments,\
  \ 0);\n6     \n7     return fn.apply(this, [larg].concat(args))\n8   }\n9 }\n```\n\
  \n这是一个可以对任何接受两个参数的函数进行柯里化的函数：\n\n```\n 1 function curryTwo (fn) {\n 2   return function\
  \ (x) {\n 3     return callFirst(fn, x)\n4   }\n5 }\n6 \n7 function add2 (a, b)\
  \ { return a + b }\n8 \n9 curryTwo(add)(5)(6)\n10   //=> 11\n```\n\n从那里，我们可以对一个接受三个参数的函数进行柯里化：\n\
  \n```\n 1 function curryThree (fn) {\n 2   return function (x) {\n 3     return\
  \ curryTwo(callFirst(fn, x))\n 4   }\n5 }\n6 \n7 function add3 (verb, a, b) { \n\
  8   return \"The \" + verb + \" of \" + a + ' and ' + b + ' is ' + (a + b) \n9 }\n\
  10 \n11 curryThree(add3)('sum')(5)(6)\n12   //=> 'The sum of 5 and 6 is 11'\n```\n\
  \n我们将在方案中开发一个通用的柯里化函数。但为了总结柯里化和部分偏应用的区别，柯里化是一种将接受两个或多个参数的函数转换为接受单个参数的函数的操作，并将其部分应用到该函数，然后对剩余参数进行柯里化。\n\
  \n## 任何其他名称的类\n\nJavaScript 拥有“类”（classes），基于对“类”的某种定义。你已经见过它们了，它们是设计为配合 `new` 关键字工作的构造函数，并在它们的\
  \ `.prototype` 元素具有行为。你可以随心随时创建一个：\n\n1. 编写构造函数，使其对 `this` 执行任何初始化，并且：\n2. 将所有的方法定义放在它的原型中。\n\
  \n让我们再看一遍：这是一个待办事项的类：\n\n```\n 1 function Todo (name) {\n 2   this.name = name ||\
  \ 'Untitled';\n 3   this.done = false;\n 4 };\n 5 \n6 Todo.prototype.do = function\
  \ () {\n 7   this.done = true;\n 8 };\n 9 \n10 Todo.prototype.undo = function ()\
  \ {\n11   this.done = false;\n12 };\n```\n\n\n\n\n```javascript\nvar stack = (function\
  \ () {\n  var obj = {\n    array: [],\n    index: -1,\n    push: function (value)\
  \ {\n      return obj.array[obj.index += 1] = value\n    },\n    pop: function ()\
  \ {\n      var value = obj.array[obj.index];\n      obj.array[obj.index] = void\
  \ 0;\n      if (obj.index >= 0) { \n        obj.index -= 1 \n      }\n      return\
  \ value\n    },\n    isEmpty: function () {\n      return obj.index < 0\n    }\n\
  \  };\n  return obj;\n})();\n```\n\n虽然它们没有引用对象，但 `push`、`pop` 和 `isEmpty` 在语义上与对象所表示的不透明数据结构交互，因此它们也是对象方法。\n\
  \n### 实例中的对象方法\n\n构造函数的实例也可以拥有对象方法。通常，对象方法是在构造函数中添加的。这里是一个示例，一个具有只读 `id` 的组件模型：\n\
  \n```javascript\nvar WidgetModel = function (id, attrs) {\n  extend(this, attrs\
  \ || {});\n  this.id = function () { return id }\n}\n\nextend(WidgetModel.prototype,\
  \ {\n  set: function (attr, value) {\n    this[attr] = value;\n    return this;\n\
  \  },\n  get: function (attr) {\n    return this[attr]\n  }\n});\n```\n\n`set` 和\
  \ `get` 是实例方法，但 `id` 是对象方法：每个对象都有自己的 `id` 闭包，其中 `id` 通过构造函数中的参数 `id` 绑定到组件的 id 上。这种方法的优点是实例可以拥有不同的对象方法，或者拥有具有独立闭包的对象方法（如本例所示）。缺点是每个对象都有自己的方法，这比所有实例共享的实例方法消耗多多的内存。\n\
  \n> 对象方法定义在对象内部。因此，如果你有同一个对象的多个不同“实例”，那么每个对象都将有一个对象方法。对象方法可以与任何对象关联，而不只是使用 `new`\
  \ 关键字创建的对象。实例方法适用于实例（即使用 `new` 关键字创建的对象）。实例方法定义在原型中，并被所有实例共享。\n\n### 使用继承扩展类\n\n\
  你可能从组合与扩展中记得，我们扩展了一个普通的 JavaScript 队列（Queue）来创建一个普通的 JavaScript 双队列（Deque）。但如果我们决定使用\
  \ JavaScript 的原型和 `new` 关键字，而不是普通的 JavaScript 对象呢？我们如何将队列扩展为双队列呢？\n\n这是我们的 `Queue`：\n\
  \n```javascript\nvar Queue = function () {\n  extend(this, {\n    array: [],\n \
