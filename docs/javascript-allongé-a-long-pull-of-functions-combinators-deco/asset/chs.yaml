  \n– Knox, [mattknox.com](http://mattknox.com)\n\n### 为什么选择 JavaScript Allongé？\n\
  \n`JavaScript Allongé` 是一本关于函数编程的书，因为 [JavaScript](https://developer.mozilla.org/en-US/docs/JavaScript)\
  \ 是一种基于灵活强大函数的编程语言。`JavaScript Allongé` 从基础开始，从值和表达式开始，并在此基础上讨论类型、标识、函数、闭包、作用域等，一直到类和实例。在每种情况下，`JavaScript\
  \ Allongé` 都会解释事物是如何运作的，这样当你遇到问题时，就会知道发生了什么以及如何修复。\n\n其次，`JavaScript Allongé` 提供了使用函数编写软件的配方，比以对象或以代码为中心的方法更简单、简洁且不复杂。函数组合器和装饰器等\
  \ JavaScript 特性利用了 JavaScript 的力量，使代码更容易阅读、修改、调试和重构，从而在问题发生前避免它们。\n\n`JavaScript\
  \ Allongé` 教你如何处理复杂代码，它也教你如何简化代码。因此，`JavaScript Allongé` 是一本内容丰富的读物，释放了 JavaScript\
  \ 的许多微妙之处，就像深受咖啡爱好者爱的 Café Allongé 一样。\n\n#### 书的结构\n\n`JavaScript Allongé` 每一章介绍函数编程的新方面，详细解释\
  \ JavaScript 的工作原理。每一章中的代码示例都很小，侧重于解释而非作为日常使用的模式。\n\n每一章之后是一系列配方，旨在以实用形式展示章节思想的应用。虽然每一章的内容自然地建立在前一章讨论内容的基础上，但配方可能会调用\
  \ JavaScript 编程语言的任何方面。\n\n### 关于配方的个人心里话\n\n正如前面提到的，`JavaScript Allongé` 交替出现描述\
  \ JavaScript 函数语义的章节和包含用函数编写程序的配方章节。你可以按顺序读这本书，也可以先读解释 JavaScript 的章节，然后再回来读配方。\n\
  \n这些配方有一个共同的主题：它们源于一种受创建相互组合的小函数的编程风格。通过这些配方，你将学会何时适合编写：\n\n\n\n\n\n```\n1 return\
  \ mapWith(maybe(getWith('name')))(customerList);\n```\n\n而不是：\n\n```\n1 return customerList.map(function\
  \ (customer) {\n2   if (customer) {\n3     return customer.name\n4   }\n5 });\n\
  ```\n\n以及它是如何工作的，以及在你需要时如何重构它。这种编程风格在 JavaScript 中可能不是人们最常用的做法，因此有人可能会认为，提供更“实用”或“常见”的配方会有帮助。如果你从不读过任何其他关于\
  \ JavaScript 的书，如果你避开了关于 JavaScript 的博客文章和屏幕演示，如果你不参加关于 JavaScript 的研讨会或演讲，那么我同意这并不是一本“统治一切之书”。\n\
  \n但考虑到市面上还有其他资源，而且程序员是对比个人成长有着永不满足渴求的好奇生物，我们选择提供你可能在其他任何地方都找不到的、如此集中的这类配方。这些配方强化了书中关于\
  \ JavaScript 函数的教课程。\n\n你可以在 [`allong.es`](http://allong.es) 在线找到所有的配方。它们在 MIT 许可证下免费共享。\n\
  \n[Reginald Braithwaite](http://braythwayt.com)\n\n`reg@braythwayt.com`\n\n@raganwald`\n\
  \n## 图例 (Legend)\n\n文本中等宽字体的内容（如文本中的 `this`）表示正在讨论的代码。单独成行的等宽字体代码也表示正在讨论的代码：\n\n\
  ```\n1 this.async = do (async = undefined) ->\n2 \n3   async = (fn) ->\n4     (argv...,\
  \ callback) ->\n5       callback(fn.apply(this, argv))\n```\n\n有时它会包含一些让你自己输入的代码。当这样做时，输入内容的结果通常会使用\
  \ `//=>` 显示，如下：\n\n```\n1 2 + 2\n2   //=> 4\n```\n\n| ![tip](img/leanpub_key.png)\
