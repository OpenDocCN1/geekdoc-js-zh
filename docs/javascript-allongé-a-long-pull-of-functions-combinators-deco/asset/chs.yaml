  \n\n\n\n前面有两条路。一种是为每种数据结构实现一个通用的 `reduce` 或 `fold` 方法。另一种是为每种数据结构编写一个 [Iterator](https://developer.mozilla.org/en-US/docs/JavaScript/New_in_JavaScript/1.7#Iterators)，并编写我们的\
  \ `sum` 函数接受迭代器作为参数。让我们使用迭代器吧，尤其是当我们对同一个数据结构需要两个不同的迭代器时，因此单个对象方法是不方便的。\n\n由于底层 JavaScript\
  \ 引擎尚未内置迭代器，我们将把迭代器写成函数的形式：\n\n```\n 1 var LinkedList, list;\n 2 \n3 LinkedList\
  \ = (function() {\n 4 \n5   function LinkedList(content, next) {\n 6     this.content\
  \ = content;\n 7     this.next = next != null ? next : void 0;\n 8   }\n 9 \n10\
  \   LinkedList.prototype.appendTo = function(content) {\n11     return new LinkedList(content,\
  \ this);\n12   };\n13 \n14   LinkedList.prototype.tailNode = function() {\n15  \
  \   var nextThis;\n16     return ((nextThis = this.next) != null ? nextThis.tailNode()\
  \ : void 0) || thi\\\n17 s;\n18   };\n19 \n20   return LinkedList;\n21 \n22 })();\n\
  23 \n24 function ListIterator (list) {\n25   return function() {\n26     var node;\n\
  27     node = list != null ? list.content : void 0;\n28     list = list != null\
  \ ? list.next : void 0;\n29     return node;\n30   };\n31 };\n32 \n33 function sum\
  \ (iter) {\n34   var number, total;\n35   total = 0;\n36   number = iter();\n37\
  \   while (number != null) {\n38     total += number;\n39     number = iter();\n\
  40   }\n41   return total;\n42 };\n43 \n44 list = new LinkedList(5).appendTo(4).appendTo(3).appendTo(2).appendTo(1);\n\
  45 \n46 sum(ListIterator(list));\n47   //=> 15\n48 \n49 function ArrayIterator (array)\
  \ {\n50   var index;\n51   index = 0;\n52   return function() {\n53     return array[index++];\n\
  54   };\n55 };\n56 \n57 sum(ArrayIterator([1, 2, 3, 4, 5]));\n58   //=> 15\n```\n\
  \n对包含嵌套数组的数组进行求和增加了复杂性。编写一个递归遍历数据结构的函数是一个有趣的问题，这在支持[协程](https://en.wikipedia.org/wiki/Coroutine)的语言中是轻而易举的。由于我们还没有生成器（Generators），而且我们不想尝试反转循环检测逻辑，我们将通过维护自己的栈来手动实现（Greenspun）自己的协程。\n\
  \n> 这种管理自己堆栈的操作对任何 1970 年以后出生的人可能看起来很奇怪，但老古董们怀怀地记得，在暴风雪中赤脚走完大学上坡后，当天的面试脑筋转弯题是用像\
  \ BASIC 这样没有重入子程序的语言编写一个“汉诺塔”求解器。\n\n```\n 1 function LeafIterator (array) {\n 2\
  \   var index, myself, state;\n 3   index = 0;\n 4   state = [];\n 5   myself =\
  \ function() {\n 6     var element, tempState;\n 7     element = array[index++];\n\
  \ 8     if (element instanceof Array) {\n 9       state.push({\n10         array:\
  \ array,\n11         index: index\n12       });\n13       array = element;\n14 \
  \      index = 0;\n15       return myself();\n16     } else if (element === void\
  \ 0) {\n17       if (state.length > 0) {\n18         tempState = state.pop(), array\
  \ = tempState.array, index = tempState.index;\n19         return myself();\n20 \
  \      } else {\n21         return void 0;\n22       }\n23     } else {\n24    \
  \   return element;\n25     }\n26   };\n27   return myself;\n28 };\n29 \n30 sum(LeafIterator([1,\
  \ [2, [3, 4]], [5]]));\n31   //=> 15\n```\n\n我们成功地将“对数据做什么”与“如何遍历元素”的问题分离开了。\n\n\
  ### 折叠 (Folding)\n\n正如纯函数式程序员喜欢谈论单子（monads）一样，多范式语言中函数式编程的新手往往迷于[folding](https://en.wikipedia.org/wiki/Fold_\"\
  higher-order_function)，也称为映射/注入/还原。我们只差一个抽象层：\n\n```\n 1 function fold (iter, binaryFn,\
  \ seed) {\n 2   var acc, element;\n 3   acc = seed;\n 4   element = iter();\n 5\
  \   while (element != null) {\n 6     acc = binaryFn(acc, element);\n 7     element\
  \ = iter();\n 8   }\n 9   return acc;\n10 };\n```\n（注：原文中 `fold` 的实现不完整，我根据上下文进行了修复以确保“核心内容”得到保留）。\n\
  \n一个从种子开始并将其扩展为数据结构的函数被称为 *unfold*（展开）。它是 `fold` 的相反操作。\n\n### 展开与迭代器\n\n迭代器是遍历结构的函数。我们可以从\
  \ `take` 开始，这是一个简单的函数，返回一个只返回固定数量元素的迭代器：\n\n```\n 1 take = function(iter, numberToTake)\
  \ {\n 2   var count;\n 3   count = 0;\n 4   return function() {\n 5     if (++count\
  \ <= numberToTake) {\n 6       return iter();\n 7     } else {\n 8       return\
  \ void 0;\n 9     }\n 10   };\n 11 };\n12 \n13 oneToFive = take(NumberIterator(1),\
  \ 5);\n14 \n15 oneToFive();\n16   //=> 1\n17 oneToFive();\n18   //=> 2\n19 oneToFive();\n\
  20   //=> 3\n21 oneToFive();\n22   //=> 4\n23 oneToFive();\n24   //=> 5\n25 oneToFive();\n\
  26   //=> undefined\n```\n\n通过 `take`，我们可以实现诸如返回前五个数字平方的操作：\n\n```\n1 square(take(NumberIterator(1),\
  \ 5))\n2 \n3   //=> [ 1,\n4        4,\n5        9,\n6        16,\n7        25 ]\n\
  ```\n\n那么前五个数字中奇数的平方呢？\n\n```\n1 square(odds(take(NumberIterator(1), 5)))\n2   //=>\
  \ TypeError: object is not a function\n```\n\n砰！我们的 `odds` 函数返回的是数组，而不是迭代器。\n\n\
  ```\n1 square(take(odds(NumberIterator(1)), 5))\n2   //=> RangeError: Maximum call\
  \ stack size exceeded\n```\n\n你根本无法获取前五个奇数，因为 `odds` 试图获取整个数字集合并将奇数累积到数组中。这是可以修复的。对于展开和其他无限迭代器，我们需要更多将一个迭代器转换为另一个迭代器的函数：\n\
  \n\n\n\n```\n 1 function iteratorMap (iter, unaryFn) {\n 2   return function() {\n\
  \ 3     var element;\n 4     element = iter();\n 5     if (element != null) {\n\
  \ 6       return unaryFn.call(element, element);\n 7     } else {\n 8       return\
  \ void 0;\n 9     }\n10   };\n11 };\n12 \n13 function squaresIterator (iter) {\n\
  \ 14   return iteratorMap(iter, function(n) {\n 15     return n * n;\n 16   });\n\
  \ 17 };\n18 \n19 function iteratorFilter (iter, unaryPredicateFn) {\n 20   return\
  \ function() {\n 21     var element;\n 22     element = iter();\n 23     while (element\
  \ != null) {\n 24       if (unaryPredicateFn.call(element, element)) {\n 25    \
  \     return element;\n 26       }\n 27       element = iter();\n 28     }\n 29\
  \           void 0;\n 30   };\n 31 };\n 32 \n33 function oddsFilter (iter) {\n 34\
  \   return iteratorFilter(iter, odd);\n 35 };\n```\n\n现在我们可以执行此类操作，例如计算斐波纳契数前五个奇数平方之和：\n\
  \n```\n1 foldingSum(take(oddsFilter(squaresIterator(FibonacciIterator())), 5))\n\
  2   //=> 205\n```\n\n这种解决方案组合了我们已有的部分，而不是编写一段带有 `if`、`while` 和边界条件的复杂代码。\n\n###\
  \ 总结\n\n将“如何遍历数据”与“对数据做什么”这两个关注点解耦开来，引导我们思考迭代器并直接与迭代器工作。例如，我们可以对迭代器进行映射和过滤，而不是尝试为每种数据结构编写单独的\
  \ map 和 filter 函数或方法。这使得处理延迟或无限迭代器成为可能。\n\n### 注意事项\n\n请注意，与本书中讨论的大多数函数不同，迭代器是**有状态的**（`stateful`）。有状态函数有一些重要的影响。其中，，像\
  \ `take(...)` 这样的函数表面上创建了一个全新的迭代器，但实际上它们返回的是对原始迭代器的装饰器引用。因此，当你遍历这个新装饰器时，你正在改变原始迭代器的状态！\n\
  \n出于所有意考虑，一旦你将迭代器传递给一个函数，你就可以预期自己不再“拥有”该迭代器了，它的状态要么已经改变，将会发生改变。\n\n### 重构为函数式迭代器\n\
  \n在 Tortoises, Hares, and Teleporting Turtles 中，我们研究了用于检测链表的“龟兔赛”算法。像许多此类算法一样，它“交织”了两个不同的关注点：\n\
  \n1. 遍历列表的机制。\n2. 检测列表中循环的算法。\n\n```\n 1 var LinkedList = (function() {\n 2 \n 3\
  \   function LinkedList(content, next) {\n 4     this.content = content;\n 5   \
  \  this.next = next != null ? next : void 0;\n 6   }\n 7 \n 8   LinkedList.prototype.appendTo\
  \ = function(content) {\n 9     return new LinkedList(content, this);\n10   };\n\
  \ 11 \n 12   LinkedList.prototype.tailNode = function() {\n 13     var nextThis;\n\
  \ 14     return ((nextThis = this.next) != null ? nextThis.tailNode() : void 0)\
  \ || thi\\\n15   s;\n 16   };\n 17 \n 18   return LinkedList;\n 19 \n 20 })();\n\
  \ 21 \n 22 function tortoiseAndHareLoopDetector (list) {\n 23   var hare, tortoise,\
  \ nextHare;\n 24   tortoise = list;\n 25   hare = list.next;\n 26   while ((tortoise\
  \ != null) && (hare != null)) {\n 27     if (tortoise === hare) {\n 28       return\
  \ true;\n 29     }\n 30     tortoise = tortoise.next;\n 31     hare = (nextHare\
  \ = hare.next) != null ? nextHare.next : void 0;\n 32   }\n 33   return false;\n\
  \ 34 };\n```\n\n#### 函数式迭代器\n\n我们接着讨论了如何使用函数式迭代器 来解耦此类关注点。函数式迭代器是一个遍历数据结构的有状态函数。每当你调用它时，它都会返回数据结构中的下一个元素。当且当完成遍历时，它会返回\
  \ `undefined`。\n\n例如，这里有一个接收数组并返回该数组的函数式迭代器的函数：\n\n```\n1 function ArrayIterator\
  \ (array) {\n2   var index = 0;\n3   return function() {\n4   return array[index++];\n\
  5   };\n6 };\n```\n\n迭代器允许我们编写（或重构）作用于迭代器而非数据结构的函数。这增加了可重用性。我们还可以编写直接作用于迭代器的高阶函数，如映射和选择。这允许我们编写延迟性算法。\n\
  \n### 重构龟兔赛\n\n现在我们将重构龟兔赛，使用迭代器而不是直接操作链表。我们将为链表添加一个 `.iterator()` 方法，并重写循环检测函数，使其接收一个“可迭代对象”而不是列表：\n\
  \n```\n1 LinkedList.prototype.iterator = function() {\n2   var list = this;\n3 \
  \  return function() {\n4     var value = list != null ? list.content : void 0;\n\
  5     list = list != null ? list.next : void 0;\n6     return value;\n7   };\n8\
  \ };\n9 \n10 function tortoiseHareLoopDetector (iterable) {\n11   var tortoise =\
  \ iterable.iterator(),\n12       hare = iterable.iterator(),\n13       tortoiseValue,\n\
  14       hareValue;\n15   while (((tortoiseValue = tortoise()) != null) && ((hareValue\
  \ = hare()) != null)) {\n16     if (tortoiseValue === hareValue) {\n17       return\
  \ true;\n18     }\n19   }\n20   return false;\n21 };\n22 \n23 list = new LinkedList(5).appendTo(4).appendTo(3).\n\
  24;\n25 tortoiseHareLoopDetector(list);\n26   //=> false\n27 \n28 list.tailNode().next\
  \ = list.next;\n29 \n30 tortoiseHareLoopDetector(list);\n31   //=> true\n```\n\n\
  \n\n\n```javascript\nvar DIRECTION_TO_DELTA = {\n  N: [1, 0],\n  E: [0, 1],\n  S:\
  \ [-1, 0],\n  W: [0, -1]\n};\n\nvar Game = (function () {\n  function Game (size)\
  \ {\n    var i,\n        j;\n\n    this.size = size\n              ? Math.floor(Math.random()\
  \ * 8) + 8\n              : size ;\n    this.board = [];\n    for (i = 0; i < this.size;\
  \ ++i) {\n      this.board[i] = [];\n      for (j = 0; j < this.size; ++j) {\n \
  \       this.board[i][j] = 'NSEW'[Math.floor(Math.random() * 4)];\n      }\n   \
  \ }\n    this.initialPosition = [\n      2 + Math.floor(Math.random() * (this.size\
  \ - 4)), \n      2 + Math.floor(Math.random() * (this.size - 4))\n    ];\n    return\
  \ this;\n  };\n\n  Game.prototype.contains = function (position) {\n    return position[0]\
  \ >= 0 && position[0] < this.size && position[1] >= 0 && position[1] < this.size;\n\
  \  };\n\n  Game.prototype.iterator = function () {\n    var position = [this.initialPosition[0],\
  \ this.initialPosition[1]];\n    return function () {\n      var direction;\n  \
  \    if (this.contains(position)) {\n        direction = this.board[position[0]][position[1]];\n\
  \        position[0] += DIRECTION_TO_DELTA[direction][0];\n        position[1] +=\
  \ DIRECTION_TO_DELTA[direction][1];\n        return direction;\n      }\n      else\
  \ {\n        return void 0;\n      }\n    }.bind(this);\n  };\n\n  return Game;\n\
  \n})();\n\nvar i = new Game().iterator();\n//=> [Function]\ni();\n//=> 'N'\ni();\n\
  //=> 'S'\ni();\n//=> 'N'\ni();\n//=> 'S'\n//   ...\n```\n\n在上面的示例中，我们得到了最短可能的重复路径：棋子在两个方格之间来回移动。当游戏不终止时，这种情况并不总是显而易见的。\n\
  \n### 有状态映射 (Stateful mapping)\n\n我们的目标是将方向的迭代转换为龟兔算法（Tortoise and Hare）可以用于检测重复访问同一格子的迭代。我们的方法是将方向转换为偏移量，表示棋子相对于其起始位置的位置。\n\
  \n我们将使用一个 `statefulMap`：\n\n```javascript\nfunction statefulMap (iter, binaryFn,\
  \ initial) {\n  var state = initial;\n  return function () {\n    element = iter();\n\
  \    if (element == null) {\n      return element;\n    }\n    else {\n      if\
  \ (state === void 0) {\n        return (state = element);\n      }\n      else return\
  \ (state = binaryFn.call(element, state, element));\n    }\n  }\n};\n```\n\n`statefulMap`\
  \ 接收一个迭代器并将其映射到一个新的迭代器。与“普通”的 `map` 不同，它是按需计算元素的，因此当给一个代表无限循环棋子的迭代时，它不会无限运行。我们需要一个有状态的映射，是因为即使在反复给定相同方向时，我们也在追踪一个随时间变化的位置。\n\
  \n以下是我们使用 `statefulMap` 的方式：\n\n```javascript\nfunction RelativeIterator (directionIterator)\
  \ {\n  return statefulMap(directionIterator, function (relativePositionStr, directionStr)\
  \ {\n    var delta = DIRECTION_TO_DELTA[directionStr],\n        matchData = relativePositionStr.match(/(-?\\\
  d+) (-?\\d+)/),\n        relative0 = parseInt(matchData[1], 10),\n        relative1\
  \ = parseInt(matchData[2], 10);\n    return \"\" + (relative0 + delta[0]) + \" \"\
  \ + (relative1 + delta[1]);\n  }, \"0 0\");\n};\n\nvar i = RelativeIterator(new\
  \ Game().iterator());\ni();\n//=> '-1 0'\ni();\n//=> '-1 -1'\ni();\n//=> '-2 -1'\n\
  i();\n//=> '-2 0'\ni();\n//=> '-2 1'\ni();\n//=> '-3 1'\ni();\n//=> '-3 2'\ni();\n\
  //=> '-3 3'\n```\n\n我们快成功了！重构后的 `tortoiseHareLoopDetector` 期望一个“可迭代对象”，即实现了 `iterator()`\
  \ 方法的对象。让我们重构 `RelativeIterable`，使其接受一个游戏并返回一个可迭代对象，而不是接受一个迭代并返回一个迭代：\n\n```javascript\n\
  function RelativeIterable (game) {\n  return {\n    iterator: function () {\n  \
  \    return statefulMap(game.iterator(), function (relativePositionStr, directionStr)\
  \ {\n        var delta = DIRECTION_TO_DELTA[directionStr],\n        matchData =\
  \ relativePositionStr.match(/(-?\\d+) (-?\\d+)/),\n        relative0 = parseInt(matchData[1],\
  \ 10),\n        relative1 = parseInt(matchData[2], 10);\n        return \"\" + (relative0\
  \ + delta[0]) + \" \" + (relative1 + delta[1]);\n      }, \"0 0\");\n    }\n  };\n\
  };\n\nvar i = RelativeIterable(new Game()).iterator();\ni();\n//=> '-1 0'\ni();\n\
  //=> '-1 -1'\ni();\n//=> '-2 -1'\ni();\n//=> '-2 0'\n\n### 解决方案 (Solution)\n\n所以，我们可以获取一个\
  \ `Game` 实例并产生一个表示相对位置的可迭代对象。如果它自身终止，游戏就会终止。而如果它陷入循环，游戏则不会终止。\n\n编写一个 `terminates`\
  \ 函数非常简单：\n\n```javascript\nfunction terminates (game) {\n  return !tortoiseHareDetector(RelativeIterable(game));\n\
  }\n\nterminates(new Game(4));\n//=> false\nterminates(new Game(4));\n//=> true\n\
  terminates(new Game(4));\n//=> false\nterminates(new Game(4));\n//=> false\n```\n\
  \n### 初步结论 (Preliminary conclusion)\n\n通过追踪链表的移动路径来检测循环，让我们重用龟兔算法来解决路径循环的问题。\n\n\
  ### 无额外结论 (No-charge extra conclusion)\n\n我们是否也可以重构“瞬移兔子”算法以接收一个可迭代对象？如果是这样，我们应该能够在不重写一切的情况下切换游戏检测。让我们试试：\n\
  \n```javascript\nfunction teleportingLoopDetector (list) {\n  var i, rabbit, turtle;\n\
  \  speed = 1;\n  turtle = rabbit = list;\n  while (true) {\n    for (i = 0; i <=\
  \ speed; ++i) {\n      rabbit = rabbit.next;\n      if (rabbit == null) {\n    \
  \    return false;\n      }\n      if (rabbit === turtle) {\n        return true;\n\
  \      }\n    }\n    turtle = rabbit;\n      speed *= 2;\n  }\n  return false;\n\
  };\n\nlist = new LinkedList(5).appendTo(4).appendTo(3).appendTo(2).appendTo(1);\n\
  teleportingLoopDetector(list);\n//=> false\nlist.tailNode().next = list.next;\n\
  teleportingLoopDetector(list);\n//=> true\n```\n\n并将其重构为：\n\n```javascript\nfunction\
  \ teleportingLoopDetector (iterable) {\n  var i, rabbit, rabbitValue, speed, turtleValue;\n\
  \  speed = 1;\n  rabbit = iterable.iterator();\n  rabbitValue = rabbitValue = rabbit();\n\
  \  while (true) {\n    for (i = 0; i <= speed; ++i) {\n      rabbitValue = rabbit();\n\
  \      if (rabbitValue == null) {\n        return false;\n      }\n      if (rabbitValue\
  \ === turtleValue) {\n        return true;\n      }\n    }\n    turtleValue = rabbitValue;\n\
  \    speed *= 2;\n  }\n  return false;\n};\n\nlist = new LinkedList(5).appendTo(4).appendTo(3).appendTo(2).appendTo(1);\n\
  teleportingLoopDetector(list);\n//=> false\nlist.tailNode().next = list.next;\n\
  teleportingLoopDetector(list);\n//=> true\n```\n\n现在我们可以将其接入我们的终止检测器中：\n\n```javascript\n\
  function terminates (game) {\n  return !teleportingLoopDetector(RelativeIterable(game));\n\
  }\n\nterminates(new Game(4));\n//=> false\nterminates(new Game(4));\n//=> false\n\
  terminates(new Game(4));\n//=> false\nterminates(new Game(4));\n//=> true\n```\n\
  \n\n\n\n将算法重构为支持迭代器，允许我们使用相同的算法解决不同的问题，并为同一个问题切换算法。这是很自然的，我们创建了一种抽象，允许将不同的项插入到接口的任何一。\n\
  \n## 蹦床（Trampolining）\n\n> 蹦床是一个循环，它迭代地调用返回 [thunk](https://en.wikipedia.org/wiki/Thunk_\
  \ \"functional_programming\") 的函数（[延续传递风格](https://en.wikipedia.org/wiki/Continuation-passing_style)）。单个蹦床就足以表达程序所有的控制转移；以此方式表达的程序就是蹦床化的，或者说处于蹦床风格；将程序转换为蹦床风格就是蹦床化。蹦床函数可以用于在栈导型编程语言中实现[尾递归](https://en.wikipedia.org/wiki/Tail-recursive_function)函数调用——[Wikipedia](https://en.wikipedia.org/wiki/Trampoline_\
  \ \"computing\")\n\n这段描述正是在考试中回答“定义蹦床化”这一问题时应该采用的方式，因为它证明了你彻底掌握了该主题。但如果被要求解释蹦床化，则需要一种更侧重于教程的方法。\n\
  \n让我们从一个用例开始。\n\n### 递归，参见递归\n\n考虑以递归风格实现 `factorial`：\n\n```\n1 function factorial\
  \ (n) {\n2   return n\n3   ? n * factorial(n - 1)\n4   : 1\n5 }\n```\n\n这种实现的直接局限性是，由于它调用自己\
  \ `n` 次，为了得到结果，在典型的基于栈的编程语言实现中，你需要拥有 `n` 个栈帧的栈。而 JavaScript 就是这种实现。\n\n这产生了两个问题：首先，我们需要为所有栈帧准备\
  \ `O(n)` 的空间。这就像在我们进行任何计算之前，实际上写出了 `1 x 1 x 2 x 3 x 4 x ...`。其次，大多数语言对栈大小的限制远小于数据所需内存的限制。\n\
  \n例如：\n\n```\n1 factorial(10)\n2   //=> 3628800\n3 factorial(32768)\n4   //=> RangeError:\
  \ Maximum call stack size exceeded\n```\n\n我们可以很容易地将其重写为迭代风格，但还有其他函数并不适合这样重写，使用一个简单的例子允许我们关注机制而非“领域”。\n\
  \n### 尾调用消除\n\n以前的 Lisp 程序员会将这样的函数重写为“尾递归形式”，这使得他们的编译器能够执行[尾调用优化](https://en.wikipedia.org/wiki/Tail-call_optimization)。这意味着，当一个函数返回其自用的结果时，语言实际上并没有执行另一个函数调用，而是将整个过程转换为一个循环。\n\
  \n我们需要做的是取表达式 `n * factorial(n - 1)` 并将其推入一个函数，这样我们就可以带参数调用它。当函数被调用时，会创建一个 `stack\
  \ frame`（栈帧），它包含了使用结果继续执行所需的所有信息。栈帧持有指向继续评估位置的指针、函数参数以及其他簿记录信息。\n\n如果我们使用符号 `_`\
  \ 来表示表达式中计划放置结果的“洞”，那么每当 `factorial` 调用自己时，它都需要记住 `n * _`，以便当它得到结果时，可以将其乘以 `n` 并返回。所以，当它第一次调用自己时，它记得\
  \ `10 * _`，第二次调用自己时，它记得 `9 * _`，当我们调用 `factorial(10)` 时，所有这些东西堆叠如下：\n\n```\n 1 \
  \ 1 * _\n 2  2 * _\n 3  3 * _\n 4  4 * _\n 5  5 * _\n 6  6 * _\n 7  7 * _\n 8  8\
  \ * _\n 9  9 * _\n10 10 * _\n```\n\n最后，我们调用 `factorial(0)`，它返回 `1`。然后栈顶被弹出，于是我们计算\
  \ `1 * 1`。它再次返回 `1`，我们计算 `2 * 1`。它返回 `2`，我们计算 `3 * 2`，依此类推向上栈，直到我们返回 `10 * 362880`\
  \ 并返回 `3628800`，最后打印。\n\n我们如何绕过这个问题？想象一下，如果计算中没有用于返回的洞。在这种情况下，我们就不需要在栈上“记住”任何东西。为了让这种情况发生，我们需要要么返回一个值，要么返回调用另一个函数的结果而不进行任何进一步计算。\n\
  \n这种调用被称为处于“尾位置”并且是一个“尾调用”。尾调用消除的“消除”意味着我们不执行包括设置新栈帧在内的完整调用。我们执行的是等同于“跳转”的操作。\n\n\
  例如：\n\n```\n1 function factorial (n) {\n2   var _factorial = function myself (acc,\
  \ n) {\n3     return n\n4   ? myself(acc * n, n - 1)\n5     : acc\n6   };\n7   \n\
  8   return _factorial(1, n);\n9 }\n```\n\n现在我们的函数要么返回一个值，要么返回调用另一个函数的结果而不进行任何进一步计算。\n\
  \n\n\n嗯，现在运行需要很长时间，但它将为我们提供正确的结果，我们可以将其作为字符串打印出来，所以让它在另一个进程中继续计算运行吧。\n\n这里展示的实现的局限性在于，因为它测试的是函数是否返回一个函数，因此它不适用于返回函数的函数。如果你想对一个返回函数的函数进行蹦跳（trampolining），你需要一种更复杂的机制，但基本原理是相同的：函数将返回一个闭包（thunk）而不是值，而蹦跳循环将测试返回的闭包，判断它代表一个值还是另一个待求值的计算。\n\
  \n### 蹦跳递归函数（co-recursive functions）\n\n如果蹦跳仅用于递归函数，那么它的价值将极其有限：所有此类函数都可以重写为迭代形式，并且会快得多（尽管可能不够优雅）。然而，蹦跳消除了所有尾位置的调用，包括对其他函数的调用。\n\
  \n考虑这个关于两个互递归函数的极其简单示例：\n\n```\n 1 function even (n) {\n 2   return n == 0\n 3 \
  \    ? true\n 4     : odd(n - 1);\n 5 };\n 6 \n 7 function odd (n) {\n 8   return\
  \ n == 0\n 9     ? false\n10     : even(n - 1);\n11 };\n```\n\n就像我们的 `factorial`\
  \ 一样，它消耗了 `even` 和 `odd` 交替调用的 `n` 栈空间：\n\n```\n1 even(32768);\n2   //=> RangeError:\
  \ Maximum call stack size exceeded\n```\n\n显然，我们可以用取模运算解决这个问题，但请考虑，这展示的是一对在尾位置调用其他函数的函数，而不仅仅是调用自身。与\
  \ `factorial` 一样，我们将未蹦跳的公共接口与蹦跳实现分离离开：\n\n```\n 1 var even = trampoline(_even),\n\
  \ 2     odd  = trampoline(_odd);\n 3 \n 4 function _even (n) {\n 5   return n ==\
  \ 0\n 6     ? true\n 7     : function () { return _odd(n - 1); };\n 8 };\n 9\n10\
  \ function _odd (n) {\n11   return n == 0\n12     ? false\n13     : function ()\
  \ { return _even(n - 1); };\n14 };\n```\n\n大功告成：\n\n```\n1 even(32768);\n2   //=>\
  \ true\n```\n\n蹦跳适用于互递归函数，或者说适用于任何可以重写为尾调用形式的函数。\n\n### 总结\n\n蹦跳是一种实现尾调用消除的技术。这意味着，如果你取一个函数（无论是递归、互递归还是任何其他形式）并将其重写为尾调用形式，你就可以消除为每次“调用”创建栈帧的需要。\n\
  \n蹦跳在像 `JavaScript` 这样的语言中非常有用，因为它允许你使用递归风格编写函数，而不必担心栈大小的限制。\n\n# 12 个新想法的配方\n\n\
  ![为了咖啡之爱：合集](img/new-ideas.jpg)\n\n为了咖啡之爱：合集\n\n> “人类与咖啡关系的整个历史，是一次徒劳的尝试，试图让味道的现实配得上其香气的承诺。”\n\
  \n### 之前\n\n用于的组合器具有无限的目的和效果。方法组合器也是如此，但无论是出于内在用途还是自定义，某些主题已经浮出水。其中一个是原始 `Lisp Flavors`\
  \ 系统以及 `面向切面编程` 运动的核心部分，即对方法进行装饰，以便在方法体求值之前执行某些功能。\n\n例如，使用我们的 `fluent` 配方：\n\n\
  ```\n 1 function () {\n 2   this.ingredients = {}\n 3 }\n 4\n5 extend(Cake.prototype,\
  \ {\n 6   setFlavour: fluent ( function (flavour) { \n 7     this.flavour = flavour\n\
  8   }),\n 9   setLayers: fluent ( function (layers) { \n10     this.layers = layers;\n\
  11   }),\n12   add: fluent ( function (ingredientMap) {\n13     var ingredient;\n\
  14     \n15     for (ingredient in ingredientMap) {\n16       this.ingredients[ingredient]\
  \ || 0);\n17       this.ingredients[ingredient] = ingredientMap[ingredient];\n18\
  \     }\n19   }),\n20   mix: fluent ( function () {\n21     // 混合原料\n22   }),\n\
  23   rise: fluent ( function (duration) {\n24     // 让原料发\n25   }),\n26   bake:\
  \ fluent ( function () {\n27     // 进行一些烘焙\n28   })\n29 });\n```\n\n这个特定的示例可能更适合作为状态机，但我们想要编码的是：在允许面团发酵或烘焙蛋糕之前，我们必须混合原料。直接编写这种逻辑的方法是：\n\
  \n```\n1   rise: fluent ( function (duration) {\n2     this.mix();\n3     // 让原料发\n\
  4   }),\n5   bake: fluent ( function () {\n6     this.mix();\n7     // 进行一些烘焙\n\
  8   })\n```\n\n这没有问题，但它将次要关注点——前提条件，干扰了上升和烘焙的核心功能。对于日志或权限检查等横切关注点也存在类似的问题：你希望函数更小、更集中，但将其分解为更小的方法很丑：\n\
  \n```\n1 reallyRise: function (duration) {\n2   // 让原料发\n3 },\n4 rise: fluent (function\
  \ (duration) {\n5   this.mix();\n6   this.reallyRise()\n7 }),\n8 reallyBake: function\
  \ () {\n9   // 进行一些烘焙\n10 },\n11 bake: fluent( function () {\n12   this.mix();\n\
  13   this.reallyBake()\n14 })\n```\n\n#### before 配方\n\n此配方用于将函数转换为方法装饰器的组合器。装饰器在求值基础方法之前执行函数。如下：\n\
  \n```\n1 function before (decoration) {\n2   return function (method) {\n3     return\
  \ function () {\n4       decoration.apply(this, arguments);\n5       return method.apply(this,\
  \ arguments)\n6     }\n7   }\n8 }\n```\n\n在这里我们将其结合 `fluent` 使用，展示了组合器的威力：\n\n```\n\
  1 var mixFirst = before(function () {\n2   this.mix()\n3 });\n4\n5 extend(Cake.prototype,\
  \ {\n6\n7   // 其他方法...\n8\n9   mix: fluent ( function () {\n10     // 混合原料\n11 \
  \  }),\n12   rise: fluent ( mixFirst( function (duration) {\n13     // 让原料发\n14\
  \   })),\n15   bake: fluent( mixFirst( function () {\n16     // 进行一些烘焙\n17     return\
  \ this\n18   }))\n19 });\n```\n\n装饰器就像关键字或注释，记录了方法的行为，但将这些次要关注点与方法的逻辑分离离开。\n\n（`before`、`after`\
  \ 以及更多构建方法装饰器的组合器可以在 `method combinators` 模块中找到。）\n\n### 之后\n\n函数的组合器具有无限的目的和效果。方法组合器也是如此，无论是出于内在用途还是自定义，某些主题已经浮出水。其中一个是原始\
  \ `Lisp Flavors` 系统以及 `面向切面编程` 运动的核心部分，即对方法进行装饰，以便在方法体求值之后执行某些功能。\n\n例如，考虑这个“类”：\n\
  \n```\n 1 Todo = function (name) {\n2   this.name = name || 'Untitled';\n3   this.done\
  \ = false\n4 }\n5\n6 extend(Todo.prototype, {\n7   do: fluent( function {\n8   \
  \  this.done = true\n9   }),\n10   undo: fluent( function {\n11     this.done =\
  \ false\n12   }),\n13   setName: fluent( maybe( function (name) {\n14     this.name\
  \ = name\n15   }))\n16 });\n```\n\n\n\n\n如果我们要自己实现模型类，可能会混入 [Backbone.Events](http://backbonejs.org/#Events)。现在，我们可以让视图监听我们的待办事项，并在发生变化时重新渲染自己。由于我们已经看过了\
  \ before，我们将直接跳转到 `after` 的配方，它是一个将函数转换为方法装饰器的组合器（combinator）：\n\n```\n1 function\
  \ after (decoration) {\n2   return function (method) {\n3     return function ()\
  \ {\n4       var value = method.apply(this, arguments);\n5       decoration.call(this,\
  \ value);\n6       return value\n7     }\n8   }\n9 }\n```这里是它的用法，用于在我们的 `Todo` “类”上触发变化事件。我们将更加高级并对装饰器进行参数化。\n\
  \n```\n 1 extend(Todo.prototype, Backbone.Events);\n 2 \n 3 function changes (propertyName)\
  \ {\n 4   return after(function () {\n 5     this.trigger('changed changed:'+propertyName,\
  \ this[propertyName])\n 6   })\n 7 }\n 8 \n 9 extend(Todo.prototype, {\n10   do:\
  \ fluent( changes('done')( function {\n11     this.done = true\n12   })),\n13  \
  \ undo: fluent( changes('done')( function {\n14     this.done = false\n15   })),\n\
  16   setName: fluent( changes('name')( maybe( function (name) {\n17     this.name\
  \ = name\n18   })))\n19 });\n```\n\n装饰器的作用就像关键字或注解，记录了方法的行为，但清晰地将这些次要关注的问题与方法的核心逻辑分离开。\n\
  \n***\n\n（before、after 以及许多用于构建方法装饰器的组合器可以在 [method combinators](https://github.com/raganwald/method-combinators/blob/master/README-JS.md#method-combinators)\
  \ 模块中找到。）\n\n### Provided 和 Except\n\nbefore 和 after 装饰器实际上无法在不抛出异常的情况下终止评估。正常执行始终会导致基础方法被评估。`provided`\
  \ 和 `excepting` 配方是组合器，它们产生的方法装饰器会在评估基础方法体之前应用一个先决条件。如果先决条件失败，则返回任何内容。\n\n`provided`\
  \ 组合器将函数转换为方法装饰器。只有当函数求值为真（truthy）时，基础方法才会被评估：\n\n```\n1 function provided (predicate)\
  \ {\n2   return function(base) {\n3     return function() {\n4       if (predicate.apply(this,\
  \ arguments)) {\n5         return base.apply(this, arguments);\n6       }\n7   \
  \  };\n8   };\n9 };\n```\n\n`provided` 可以用于创建 `maybe` 这样的命名装饰器：\n\n```\n1 var maybe\
  \ = provided( function (value) {\n2   return value != null\n3 });\n4   \n5 SomeModel.prototype.setAttribute\
  \ = maybe( function (value) {\n6   this.attribute = value\n7 });\n```\n\n你可以构建自己的特定领域装饰器：\n\
  \n```\n1 var whenNamed = provided( function (record) {\n2   return record.name &&\
  \ record.name.length > 0\n })\n```\n\n`except` 的工作原理相同，但逻辑是反的。\n\n```\n 1 function\
  \ except (predicate) {\n 2   return function(base) {\n 3     return function() {\n\
  \ 4       if (!predicate.apply(this, arguments)) {\n 5         return base.apply(this,\
  \ arguments);\n 6       }\n 7     };\n 8   };\n 9 };\n10 \n11 var exceptAdmin =\
  \ except( function (user) {\n12   return user.role.isAdmin()\n13 });\n```\n\n###\
  \ 函数式 Mixin 工\n\nFunctional Mixins 扩展现有类的原型。让我们从这里开始：\n\n```\n 1 function Todo (name)\
  \ {\n 2   var self = this instanceof Todo\n 3              ? this\n 4          \
  \    : new Todo();\n 5   self.name = name || 'Untitled';\n 6   self.done = false;\n\
  \ 7 };\n 8 \n 9 Todo.prototype.do = fluent( changes('done')( function {\n10    \
  \ this.done = true\n11   })),\n12   \n 13 Todo.prototype.undo = fluent( changes('done')(\
  \ function {\n14     this.done = false\n15   })),\n16   \n 17 Todo.prototype.setName\
  \ = fluent( changes('name')( maybe( function (name) {\n18     this.name = name\n\
  19   })));\n```\n\n\n\n\n```\n 1 var AndColourCoded = classDecorator({\n 2   setColourRGB:\
  \ fluent( function (r, g, b) {\n 3     this.colourCode = { r: r, g: g, b: b };\n\
  \ 4   }),\n 5   getColourRGB: function () {\n 6     return this.colourCode;\n 7\
  \   }\n 8 });\n 9\n10 var ColourTodo = AndColourCoded(Todo);\n 11 \n12 new ColourTodo('Use\
  \ More Decorators').setColourRGB(0, 255, 0);\n 13   //=> { name: 'Use More Decorators',\n\
  \ 14   //     done: false,\n 15   //     colourCode: { r: 0, g: 255, b: 0 } }\n\
  ```\n\n成功！我们的 `classDecorator` 函数可以创建类装饰器。\n\n# 迭代器教程\n\n## 用于标准数据结构的迭代器\n\n注意：尽管名称首字母大写，但迭代器并不是为了配合\
  \ `new` 关键字而设计的。\n\n```javascript\n 1 function FlatArrayIterator (array) {\n 2 \
  \  var index;\n 3   index = 0;\n 4   return function() {\n 5     return array[index++];\n\
  \ 6   };\n 7 };\n 8 \n 9 function RecursiveArrayIterator (array) {\n10   var index,\
  \ myself, state;\n11   index = 0;\n 12   state = [];\n 13   myself = function()\
  \ {\n 14     var element, tempState;\n 15     element = array[index++];\n 16   \
  \  if (element instanceof Array) {\n 17       state.push({\n 18         array: array,\n\
  \ 19         index: index\n 20       });\n 21       array = element;\n 22      \
  \ index = 0;\n 23       return myself();\n 24     } else if (element === void 0)\
  \ {\n 25       if (state.length > 0) {\n 26         tempState = state.pop(), array\
  \ = tempState.array, index = tempState.index;\n 27         return myself();\n 28\
  \       } else {\n 29         return void 0;\n 30       }\n 31     } else {\n 32\
  \       return element;\n 33     }\n 34   };\n 35   return myself;\n 36 };\n```\n\
  \n## 展开迭代器\n\n```javascript\n 1 function NumberIterator (base) {\n 2   var number;\n\
  \ 3   if (base == null) {\n 4     base = 0;\n 5   }\n 6   number = base;\n 7   return\
  \ function() {\n 8     return number++;\n 9   };\n 10 };\n 11 \n12 function FibonacciIterator\
  \ () {\n 13   var current, previous;\n 14   previous = 0;\n 15   current = 1;\n\
  \ 16   return function() {\n 17     var value, tempValues;\n 18     value = current;\n\
  \ 19     tempValues = [current, current + previous], previous = tempValues[0], current\\\
  \n20  = tempValues[1];\n 21     return value;\n 22   };\n 23 };\n```\n\n## 用于切片迭代器的装饰器\n\
  \n```javascript\n 1 function take (iter, numberToTake) {\n 2   var count = 0;\n\
  \ 3   return function() {\n 4     if (++count <= numberToTake) {\n 5       return\
  \ iter();\n 6     } else {\n 7       return void 0;\n 8     }\n 9   };\n 10 };\n\
  \ 11 \n12 function drop (iter, numberToDrop) {\n 13   while (numberToDrop-- !==\
  \ 0) {\n 14     iter();\n 15   }\n 16   return iter;\n 17 };\n 18 \n19 function\
  \ slice (iter, numberToDrop, numberToTake) {\n20   var count = 0;\n 21   while (numberToDrop--\
  \ !== 0) {\n 22     iter();\n 23   }\n 24   if (numberToTake != null) {\n 25   \
  \  return function() {\n 26       if (++count <= numberToTake) {\n 27         return\
  \ iter();\n 28       } else {\n 29         return void 0;\n 30       }\n 31    \
  \ };\n 32   }\n 33 };\n```\n\n\n\n\n\n许可协议允许这种选择，但我看来，这与利用他们的资源和工作去做一些与其使命不符的事情的分享与开放精神背道而驰。当然，他们可能并不在乎这种想法，我不知道，我不想破坏这项在帮助人们编写优秀技术书籍方面所提供的巨大服务。\n\
  \n## 很棒的书！我可以分享它吗？\n\n我也希望你以这种形式（PDF 或其他形式）分享它。尽情发挥吧，只需遵循[许可协议](http://creativecommons.org/licenses/by-sa/3.0/deed.en_US\
  \ \"知识共享署名-相同共享 3.0 国际许可协议)中的署名规则。\n\n## 很棒的书！我还可以买吗？\n\n[是的，请购买](http://braythwayt.com/2013/10/04/the-freedom-to-pay-thirty-bucks.html\
  \ \"支付三十美元的自由\")\n\n## 我不想买，但我想通过小费表示“感谢”。\n\n没问题，你可以通过 PayPal 向 `reg@braythwayt.com`\
