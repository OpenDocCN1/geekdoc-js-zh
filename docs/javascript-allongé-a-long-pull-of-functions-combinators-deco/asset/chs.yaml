  \ {\n    var i;\n    if (this.head === 0) {\n      for (i = this.tail; i >= this.head;\
  \ --i) {\n        this.array[i + INCREMENT] = this.array[i]\n      }\n      this.tail\
  \ += this.constructor.INCREMENT;\n      this.head += this.constructor.INCREMENT\n\
  \    }\n    this.array[this.head -= 1] = value\n  }\n});\n```\n\n我们显然想要完成 `Queue`\
  \ 的所有初始化，因此……（此处省略中间逻辑描述，保留核心结构）\n\n让我们将该机制转换为函数：\n\n\n\n\n```javascript\nvar child\
  \ = function (parent, child) {\n  var proxy = function () {\n    this.constructor\
  \ = child\n  }\n  proxy.prototype = parent.prototype;\n  child.prototype = new proxy();\n\
  \  return child;\n}\n```\n\n并在 `Dequeue` 中使用它：\n\n```javascript\nvar Dequeue = child(Queue,\
  \ function () {\n  Queue.prototype.constructor.call(this)\n});\n\nDequeue.INCREMENT\
  \ = 4;\n\nextend(Dequeue.prototype, {\n  size: function () {\n    return this.tail\
  \ - this.head + 1\n  },\n  pullTail: function () {\n    var value;\n\n    if (!this.isEmpty())\
  \ {\n      value = this.array[this.tail];\n      this.array[this.tail] = void 0;\n\
  \      this.tail -= 1;\n      return value\n    }\n  },\n  pushHead: function (value)\
  \ {\n    var i;\n\n    if (this.head === 0) {\n      for (i = this.tail; i >= this.head;\
  \ --i) {\n        this.array[i + INCREMENT] = this.array[i]\n      }\n      this.tail\
  \ += this.constructor.INCREMENT;\n      this.head += this.constructor.INCREMENT\n\
  \    }\n    this.array[this.head -= 1] = value\n  }\n});\n```\n\n## 未来方向\n\n有些人就是喜欢构建属于自己的机制。当一切顺利时，他们会作为框架创建者和开源思想领袖而闻名；当一切不顺利时，他们会创建内部专有的一次性方案，到处都是抽象，模糊了应用与框架之间的界限。\n\
  \n如果你热于学习，可以尝试改进上述代码以处理扩展构造函数属性、自动调用父构造函数等。或者你也可以认为手动这样做并不难，那么为什么要费劲给它包上一层薄薄的封装呢？\n\
  \n这取决于你。虽然 JavaScript 不是最简洁的语言，但它并不繁琐到构建继承本体论时需要数百行晦涩难懂的代码。\n\n### 总结\n\n| ![tip](img/leanpub_key.png)\
  \ | |\n\n### 实例与类\n\n* `new` 关键字将任何函数转换为创建 `instances`（实例）的 `constructor`（构造函数）。\n\
  * 所有函数都有一个 `prototype`（原型）元素。\n* 实例的行为就像其构造函数原型上的元素是自身的元素一样。\n* 实例可以在不改变其构造函数原型的情况下覆盖它。\n\
  * 实例与其构造函数原型之间的关系是动态的。\n* `this` 与在原型中定义的方法无缝工作。\n* 一切行为都像一个对象一样。\n* JavaScript\
  \ 可以将原始类型转换为实例，并转换回原始类型。\n* 对象方法通常在构造函数中创建，并且对每个对象私有。\n* 原型可以链式调用以允许扩展实例。\n\n最重要的一：\n\
  \n* JavaScript 拥有类和方法，只是在语言语法中没有正式地称为类和方法。\n\n## 9 个关于实例与类的配谱\n\n![这些配谱正在被烤至完美。](img/diedrich-roaster.jpg)\n\
  \n这些配谱正在被烤至完美。\n\n### 免责声明\n\n这些配谱是为了实用性而编写的，它们的实现可能会引入到为止尚未讨论过的 JavaScript 特性，例如方法和/或原型。每个配谱的整体\
  \ `use`（使用）将符合目前为止讨论的语言精神，即使实现可能并不符合。\n\n### 柯里化 (Currying)\n\n我们在闭包 和部分应用、绑定与柯里化\
  \ 中过柯里化。这里是一个对参数函数进行柯里化的高阶函数的食。它适用于任何固定长度的函数，并允许提供任意数量的参数。\n\n```javascript\n 1\
  \ var __slice = Array.prototype.slice;\n 2 \n 3 function curry (fn) {\n 4   var\
  \ arity = fn.length;\n 5   \n 6   return given([]);\n 7   \n 8   function given\
  \ (argsSoFar) {\n 9     return function helper () {\n10       var updatedArgsSoFar\
  \ = argsSoFar.concat(__slice.call(arguments, 0));\n11       \n12       if (updatedArgsSoFar.length\
  \ >= arity) {\n13         return fn.apply(this, updatedArgsSoFar)\n14       }\n\
  15       else return given(updatedArgsSoFar)\n16     }\n17   }\n18   }\n19 }\n20\
  \ \n21 function sumOfFour (a, b, c, d) { return a + b + c + d }\n22 \n23 var curried\
  \ = curry(sumOfFour);\n24 \n25 curried(1)(2)(3)(4)\n26   //=> 10\n27 \n28 curried(1,2)(3,4)\n\
  29   //=> 10\n30 \n31 curried(1,2,3,4)\n32   //=> 10\n```\n\n等等，让我们重新检查提供的文本。似乎在提供的“柯里化”源文本中存在严重的去重和重叠问题。（*注：输入文本包含大量重复和碎片化的块，我已根据输入格式化了核心部分。）\n\
  \n\n\n\n\n```\n 1 InventoryRecord.prototype.add = function (item, amount) {\n 2\
  \   this.record[item] || (this.record[item] = 0);\n 3   this.record[item] += amount;\n\
  \ 4   return this;\n 5 }\n 6 \n 7 mapWith(bound('add', 'eggs', 12))(inventories).map(\n\
  \ 8   function (boundmethod) { \n 9     return boundmethod() \n10   }\n11 )\n 12\
  \   //=> [ { record: \n 13   //       { apples: 0,\n 14   //         oranges: 144,\n\
  \ 15   //         eggs: 48 } },\n 16   //     { record: \n 17   //       { apples:\
  \ 240,\n 18   //         oranges: 54,\n 19   //         eggs: 24 } },\n 20   //\
  \     { record: \n 21   //       { apples: 24,\n 22   //         oranges: 12,\n\
  \ 23   //         eggs: 54 } } ]\n```\n\n### 解绑 (Unbinding)\n\n`Function.prototype.bind`\
  \ 的规范之一是，它会创建一个无法被覆盖的绑定。换句话说：\n\n```\n 1 function myName () { return this.name }\n\
  \ 2 \n 3 var harpo   = { name: 'Harpo' },\n 4     chico   = { name: 'Chico' },\n\
  \ 5     groucho = { name: 'Groucho' };\n 6     \n 7 var fh = myName.bind(harpo);\n\
  \ 8 fh()\n 9   //=> 'Harpo'\n 10 \n 11 var fc = myName.bind(chico);\n 12 fc()\n\
  \ 13   //=> 'Chico'\n```\n\n这看起来很棒。但如果我们尝试用 `bind` 或 `.call` 重新绑定一个已绑定的函数会发生什么呢？\n\
  \n```\n1 var fhg = fh.bind(groucho);\n2 fhg()\n3   //=> 'Harpo'\n4   \n5 fc.call(groucho)\n\
  6   //=> 'Chico'\n7   \n8 fh.apply(groucho, [])\n9   //=> 'Harpo'\n```\n\n哔！你无法覆盖一个已经绑定的函数的上下文，即使你通过\
  \ `.bind` 创建了一个新函数也是如此。你也不想自己实现一个允许重新绑定的 `bind` 函数，否则会被某些期望该绑定函数无法重新绑定的代码所反噬。（其中一种情况是绑定的函数——例如回调函数——被存储在数组中。评估\
  \ `callbacks[index]()` 将用数组覆盖绑定的上下文，除非该上下文不可被覆盖。）\n\n#### 食方 (Recipe)\n\n我们版本的 `bind`\
  \ 对原始函数进行了备忘处理，这样你稍后就可以调用 `unbind` 来恢复它以便重新绑定。\n\n```\n 1 var unbind = function\
  \ unbind (fn) {\n 2   return fn.unbound ? unbind(fn.unbound()) : fn\n 3 };\n 4 \
  \  \n 5 function bind (fn, context, force) {\n 6   var unbound, bound;\n 7   \n\
  \ 8   if (force) {\n 9     fn = unbind(fn)\n 10   }\n 11   bound = function () {\n\
  \ 12     return fn.apply(context, arguments)\n 13   };\n 14   bound.unbound = function\
  \ () {\n 15     return fn;\n 16   };\n 17   \n 18   return bound;\n 19 }\n 20 \n\
  \ 21 function myName () { return this.name }\n 22 \n 23 var harpo   = { name: 'Harpo'\
  \ },\n 24     chico   = { name: 'Chico' },\n 25     groucho = { name: 'Groucho'\
  \ };\n 26     \n 27 var fh = bind(myName, harpo);\n 28 fh()\n 29   //=> 'Harpo'\n\
  \ 30   \n 31 var fc = bind(myName, chico);\n 32 fc()\n 33   //=> 'Chico'\n 34  \
  \ \n 35 var fhg = bind(fh, groucho);\n 36 fhg()\n 37   //=> 'Harpo'\n 38   \n 39\
  \ var fhug = bind(fh, groucho, true);\n 40 fhug()\n 41   //=> 'cho'\n 42   \n 43\
  \ var fhug2 = bind(unbind(fh), groucho);\n 44 fhug()\n 45   //=> 'cho'\n 46   \n\
  \ 47 fc.unbound().call(groucho)\n 48   //=> 'cho'\n 49   \n 50 unbind(fh).apply(groucho,\
  \ [])\n 51   //=> 'cho'\n```\n\n### 发送 (Send)\n\n之前，我们看到 `bound` 食方可以用于从实例中获取一个绑定的方法。遗憾的是，调用这样的方法有点杂乱：\n\
  \n```\n1 mapWith(bound('eggs'))(inventories).map(\n2   function (boundmethod) {\
  \ \n3     return boundmethod() \n4   }\n5 )\n6   //=> [ 36, 12, 42 ]\n```\n\n正如我们所指出的，写这种代码很难看：\n\
  \n```\n1 function (boundmethod) { \n2   return boundmethod() \n3 }\n```\n\n因此，我们写了一个新的写法：\n\
  \n```\n1 var send = variadic( function (args) {\n2   var fn = bound.apply(this,\
  \ args);\n3   \n4   return function (instance) {\n5     return fn(instance)();\n\
  6   }\n7 })\n8 \n9 mapWith(send('apples'))(inventories)\n10 //=> [ 0, 240, 24 ]\n\
  ```\n\n`send('apples')` 的工作非常类似于 Ruby 编程语言中的 `&:apples`。你可能会问，为什么要保留 `bound`？嗯，有时我们需要这个函数但不想立即执行它，例如创建回调函数。`bound`\
  \ 很好地做到了。\n\n这是一个不依赖 `bound` 的健壮版本：\n\n```\n1 var send = variadic( function (methodName,\
  \ leftArguments) {\n2   return variadic( function (receiver, rightArguments) {\n\
  3     return receiver[methodName].apply(receiver, rightArguments)\n4   })\n5 });\n\
  ```\n\n### 调用 (Invoke)\n\n之前，我们看到 `bound` 食方可以从实例中获取一个绑定的方法。遗憾的是，调用这样的方法有点杂乱：Ruby\
  \ 编程语言中有一个叫做 [`instance_exec`](https://www.ruby-doc.org/core-2.7/Object.html#method-instance_exec)\
  \ 的方便功能。我们有时我们需要这个函数但不想立即执行它，例如创建回调函数。`bound` 很好地做到了。\n\n这里有一个不依赖 `bound` 的健壮版本：\n\
  \n```\n1 var slice = Array.prototype.slice;\n2\n3 function invoke (fn) {\n4   var\
  \ args = slice.call(arguments);\n5   \n6   return function (instance) {\n7     return\
  \ fn.apply(instance, args)\n8   }\n9 }\n```\n\n`Send` 有用在调用一个对象的成员函数，但它并不完全像数组。例如：\n\
  \n```\n1 var data = [\n2   { 0: 'zero', \n3     1: 'one',\n3     2: 'two',\n4  \
  \   foo: 'foo',\n5     length: 3 },\n6   // ...\n7 ];\n```\n\n我们可以使用部分应用、绑定和柯里化的模式创建一个依赖上下文的拷贝函数：\n\
  \n```\n1 var __copy = callFirst(Array.prototype.slice, 0);\n```\n\n假设某人的代码给了你一组像数组但并不完全是数组的对象。比如：\n\
  \n```\n[\n  { 0: 'zero', \n    1: 'one',\n    2: 'two',\n    foo: 'foo',\n    length:\
  \ 3 },\n  // ...\n]\n```\n\n现在我们可以将 `mapWith` 与 `invoke` 组合，将数据转换为数组：\n\n```\n1\
  \ mapWith(invoke(__copy))(data)\n2   //=> ['zero', 'one', 'two'], // ... ]\n```\n\
  \n### 流式 (Fluent)\n\n对象和实例方法可以分为两类：查询某些内容的方法和更新某些内容的方法。大多数设计哲学让更新方法返回被更新的值。例如：\n\
  \n```\n1 function Cake () {}\n2 \n3 extend(Cake.prototype, {\n4   setFlavour: function\
  \ (flavour) { \n5     return this.flavour = flavour \n6   },\n7   setLayers: function\
  \ (layers) { \n8     return this.layers = layers \n9   },\n10   bake: function ()\
  \ {\n11     // do some baking\n12   }\n13 });\n14 \n15 var cake = new Cake();\n\
  16 cake.setFlavour('chocolate');\n17 cake.setLayers(3);\n18 cake.bake();\n```\n\n\
  让 `setFlavour` 等方法返回被设置的值模仿了赋值的行为，其中 `cake.flavour = 'chocolate'` 是一个在设置属性的同时也会求值为\
  \ `'chocolate'` 的表达式。\n\n[流式] 风格假设大多数时候当你执行更新时，你对对接收者的其他操作比对作为参数传递的值感兴趣，因此规则是返回接收者，除非该方法是查询。\n\
  \n\n\n\n\n```javascript\nfunction Cake () {}\n\nextend(Cake.prototype, {\n  setFlavour:\
  \ function (flavour) { \n    this.flavour = flavour;\n    return this\n  },\n  setLayers:\
  \ function (layers) { \n    this.layers = layers;\n    return this\n  },\n  bake:\
  \ function () {\n    // do some baking\n    return this\n  }\n});\n```\n\n现在处理蛋糕的代码变得更易读且重复性更低：\n\
  \n```javascript\nvar cake = new Cake().\n  setFlavour('chocolate').\n  setLayers(3).\n\
  \  bake();\n```\n\n对于像设置属性这样的单行代码，这样做是可以的。但有些函数很长，我们希望在方法顶部就表明方法的意图，而不是将其埋在底部。通常这是通过方法名称来实现的，但链式接口很少编写包含像\
  \ `setLayersAndReturnThis` 这样的方法。\n\n`fluent` 方法装饰器解决了了这个问题：\n\n```javascript\n\
  function fluent (methodBody) {\n  return function () {\n    methodBody.apply(this,\
  \ arguments);\n    return this\n  }\n}\n```\n\n现在你可以像这样写方法：\n\n```javascript\nCake.prototype.bake\
  \ = fluent( function () {\n  // do some baking\n  // 使用许多行代码\n  // 并且可能有多个返回\n});\n\
  ```\n\n一眼就能看出这个方法是“链式的（fluent）”。\n\n### 再次强调\n\n正如我们在查看执行一次配方时注意到的，你必须小心是否多次调用了\
  \ `once` 返回的函数。如果你一直调用 `once`，你会得到一个只执行一次的新函数，因此你会不断地调用你的函数：\n\n```javascript\n\
  once(function () {\n  return 'sure, why not?'\n})()\n  //=> 'sure, why not?'\n\n\
  once(function () {\n  return 'sure, why not?'\n})()\n  //=> 'sure, why not?'\n```\n\
  \n这是预期的结果，但有时并不是我们想要的。与其使用简单的实现，我们可以使用命名的 `once`：\n\n```javascript\nfunction once\
  \ (fn) {\n  var done = false,\n      testAndSet;\n      \n  if (!!fn.name) {\n \
  \   testAndSet = function () {\n      this[\"__once__\"] || (this[\"__once__\"]\
  \ = {})\n      if (this[\"__once__\"][fn.name]) return true;\n      this[\"__once__\"\
  ][fn.name] = true;\n      return false\n    }\n  }\n  else  {\n    testAndSet =\
  \ function (fn) {\n      if (done) return true;\n      done = true;\n      return\
  \ false\n    }\n  }\n  \n  return function () {\n    return testAndSet.call(this)\
  \ ? void 0 : fn.apply(this, arguments)\n  }\n}\n```\n\n如果你只传入一个函数调用它，它的行为与我们的第一个配方完全一致。但如果你提供一个命名的函数，就会得到不同的行为：\n\
  \n```javascript\nonce(function askedOnDate () {\n  return 'sure, why not?'\n})()\n\
  \  //=> 'sure, why not?'  \n    \nonce(function askedOnDate () {\n  return 'sure,\
  \ why not?'\n})()\n  //=> undefined\n```\n\n命名的 `once` 会在调用函数的上下文中添加一个属性 `__once__`，并用它来跟踪哪些命名函数已经运行，哪些还没有运行。一个非常强大的用途是定义应该只求值一次的对象方法，例如初始化方法。通常这是在构造函数中完成的，但你可以编写一个“链式”对象，允许你调用各种\
  \ setter：\n\n```javascript\nfunction Widget () {};\n\nWidget.prototype.setVolume\
  \ = function setVolume (volume) {\n  this.volume = volume;\n  return this\n}\n\n\
  Widget.prototype.setDensity = function setDensity (density) {\n  this.density =\
  \ density;\n  return this\n}\n\nWidget.prototype.setLength = function setLength\
  \ (length) {\n  this.length = length;\n  return this\n}\n\nWidget.prototype.initialize\
  \ = once(function initialize() {\n  // 执行一些初始化\n  return this;\n});\n\nvar w = new\
  \ Widget()\n  .setVolume(...)\n  .setDensity)(...)\n  .setLength(...)\n  .initialize();\n\
  ```\n\n如果你稍后调用 `w.initialize()`，它不会再次被初始化。你需要一个命名的 `once`，因为普通的 `once` 会为每个共享相同原型的实例调用一次，而命名的\
  \ `once` 会跟踪它是否已为每个实例单独运行过。\n\n注意：每个实例都将有一个 `__once__`。\n\n\n\n\n\n在上一节中，我们提到 JavaScript\
  \ 拥有“类”（classes）以符合“类”一词的定义，并展示了 JavaScript 如何提供在其他“面向对象语言”中常见的许多特性。对于那些希望获得更全面解释的人，本节将详细介绍\
  \ JavaScript 的“原型”（prototypes）与 Ruby 等语言中的类之间有何不同。理解 JavaScript 编程并不非要阅读本节，但在与那些更习惯于讨论“类”的程序员讨论\
  \ JavaScript 时，这可能会有所帮助。\n\n***\n\n尽管每种“面向对象”编程语言都有自己特定的语义集，但大多数流行的语言都拥有“类”。类是一个负责创建对象和定义对象行为的实体。类本身也可以是对象，但如果是的话，它们与其它类型的对象不同。例如，Ruby\
  \ 中的 `String` 类本身并不是一个字符串，而是一个类为 `Class` 的对象。在“经典”系统中，所有对象都有一个类，而它们的类就是“类”。\n\n\
  这听起来像是同义反复，直到我们看到 JavaScript 为止。但让我们先从快速回顾一种流行的基于类的语言——Ruby 开始。\n\n### Ruby\n\n\
  在 Ruby 中，类是对象，但它们是特殊的对象。例如，这里与 Ruby 类 `String` 关联的一些方法：\n\n```\n 1 String.methods\n\
  \ 2   #=> [:try_convert, :allocate, :new, :superclass, :freeze, :===, :==,\n 3 \
  \       :<=>, :<, :<=, :>, :>=, :to_s, :included_modules, :include?, :name, \n 4\
  \        :ancestors, :instance_methods, :public_instance_methods, \n 5        :protected_instance_methods,\
  \ :private_instance_methods, :constants, \n 6        :const_get, :const_set, :const_defined?,\
  \ :const_missing, \n 7        :class_variables, :remove_class_variable, :class_variable_get,\
  \ \n 8        :class_variable_set, :class_variable_defined?, :public_constant, \n\
  \ 9        :private_constant, :module_exec, :class_exec, :module_eval, :class_eval,\
  \ \n10        :method_defined?, :public_method_defined?, :private_method_defined?,\
  \ \n11        :protected_method_defined?, :public_class_method, :private_class_method,\
  \ \n12        # ...\n13        :!=, :instance_eval, :instance_exec, :__send__, :__id__]\
  \ \n```\n\n这里是与字符串实例关联的一些方法：\n\n```\n 1 String.new.methods\n 2   #=> [:<=>, :==,\
  \ :===, :eql?, :hash, :casecmp, :+, :*, :%, :[],\n 3        :[]=, :insert, :length,\
  \ :size, :bytesize, :empty?, :=~,\n 4        :match, :succ, :succ!, :next, :next!,\
  \ :upto, :index, :rindex,\n 5        :replace, :clear, :chr, :getbyte, :setbyte,\
  \ :byteslice,\n 6        :to_i, :to_f, :to_s, :to_str, :inspect, :dump, :upcase,\n\
  \ 7        :downcase, :capitalize, :swapcase, :upcase!, :downcase!,\n 8        :capitalize!,\
  \ :swapcase!, :hex, :oct, :split, :lines, :bytes,\n 9        :chars, :codepoints,\
  \ :reverse, :reverse!, :concat, :<<,\n10        :prepend, :crypt, :intern, :to_sym,\
  \ :ord, :include?,\n 11        :start_with?, :end_with?, :scan, :ljust, :rjust,\
  \ :center,\n 12        # ...\n13        :instance_eval, :instance_exec, :__send__,\
  \ :__id__]\n```\n\n如你所见，Ruby 中的“类”与“该类的实例”非常不同。类的方法与该类实例的方法的方法也非常不同。\n\n以下是在 Ruby\
  \ 中定义 `Queue` 的方式：\n\n```ruby\n 1 class Queue\n 2   def initialize\n 3     @array,\
  \ @head, @tail = [], 0, -1\n 4   end\n 5   \n 6   def pushTail value\n 7     @array[@tail\
  \ += 1] = value\n 8   end\n 9   \n10   def pullHead\n 11     if !@isEmpty\n 12 \
  \      @array[@head]).tap { |value|\n 13         @array[@head] = null\n 14     \
  \    @head += 1\n 15       }\n 16     end\n 17   end\n 18   \n 19   def isEmpty\n\
  \ 20     !!(@tail < @head)\n 21   end\n 22 end\n```\n\n定义类有特殊的语法，定义实例的行为也有特殊的语法。在基于类的语言中，定义创建新实例的方式有。Ruby\
  \ 使用一个名为 `initialize` 的“魔法方法”。现在让我们来看看 JavaScript。\n\n### JavaScript 有构造函数和原型\n\n\
  JavaScript 对象没有正式的类，因此没有特殊的语法来定义如何创建实例或定义其行为。\n\nJavaScript 实例通过 `constructor` 创建。实例的构造函数是一个用\
  \ `new` 调用的函数。\n\n```javascript\n1 function Queue() {\n2   this.array = [];\n3 \
  \  this.head = 0;\n4   this.tail = -1;\n5 }\n6 \n7 Queue.prototype.pushTail = function(value)\
  \ {\n8   this.array[this.tail += 1] = value;\n9 };\n10 \n11 Queue.prototype.pullHead\
  \ = function() {\n12   var value;\n13   \n14   if (!this.isEmpty()) {\n15     value\
  \ = this.array[this.head];\n16     this.array[this.head] = null;\n17     this.head\
  \ += 1;\n18   }\n19   return value;\n20 };\n21 \n22 Queue.prototype.isEmpty = function()\
  \ {\n23   return this.tail < this.head;\n24 };\n```\n\nJavaScript 原型与 Ruby 类不同的第一个点是原型是一个普通对象，恰恰包含了我们预期在实例中找到的属性：方法\
  \ `pushTail`、`pullHead` 和 `isEmpty`。\n\n第二个点是，*任何*对象都可以是原型。它可以拥有函数（充当方法），它可以拥有其他值（如数字、布尔值、对象或字符串）。它可以是你正用于其他用途的对象：账户、视图、如果你在浏览器中则是\
  \ DOM 对象，任何东西都可以。\n\n在大多数“经典”语言中，“类”是对象，但它们是特殊的对象。在 JavaScript 中，原型不是一种特殊的对象，它们只是对象。\n\
  \n#### 类与原型区别的总结\n\n在正式的基于类的语言中，类可以是对象，但它是一个具有特殊属性和方法的特殊对象。它负责创建新实例以及定义实例的行为。\n\n\
  在基于类的语言中，实例的行为用特殊语法定义。如果允许动态更改，则是通过特殊语法和/或在类上调用的特殊方法完成的。\n\nJavaScript 将实例的责任分为构造函数和原型。JavaScript\
  \ 中的构造函数可以是任何函数。构造函数负责创建新实例。\n\nJavaScript 中的原型可以是任何对象。原型负责定义实例的行为。原型没有特殊的方法或属性。\n\
  \n\n\n\nJavaScript 中的实例行为是通过直接修改原型（prototype）来定义的，例如通过向其添加属性来添加函数。定义类或修改类没有特殊的语法。\n\
  \n## 那么为什么这本书说 JavaScript 在某种对“类”的定义下拥有“类”呢？\n\n因为，如果（`if`）：\n\n1. 你将函数作为构造函数，并且；\n\
  2. 你使用原型来定义实例方法，并且；\n3. 原型被严格用于定义实例方法，不做其他任何事情；\n\n那么（`Then`）：\n\n你将拥有一个工作起来就像简单的基于类的系统，其中构造函数和它的原型充当了“类”。\n\
  \n但如果你想要更多，你拥有一个灵活的系统，它允许你做[很多很多更多](https://github.com/raganwald/homoiconic/blob/master/2013/01/function_and_method_decorators.md#function-and-method-decorators\
  \ \"函数和方法装饰器\")。这取决于你。\n\n## 与 new 无关的构造函数 (New-Agnostic Constructors)\n\nJavaScript\
  \ 在某些事情上是不灵活的。其中之一就是在构造函数上调用 `new`。在我们的许多配方中，我们可以编写可以处理可数量参数的函数，并使用 `.apply` 来调用函数。例如：\n\
  \n```\n1 function fluent (methodBody) {\n2   return function () {\n3     methodBody.apply(this,\
  \ arguments);\n4     return this\n5   }\n6 }\n```\n\n你不能通过调用构造函数来实现相同的事情。这样做是不可行的：\n\
  \n```\n 1 function User (name, password) {\n 2   this.name = name || 'Untitled';\n\
  \ 3   this.password = password\n 4 };\n 5 \n6 function withDefaultPassword () {\n\
  \ 7   var args = Array.prototype.slice.call(arguments, 0);\n 8   args[1] = 'swordfish';\n\
  \ 9   return new User.apply(this, args);\n10 } \n11 \n12 withDefaultPassword('James')\n\
  13   //=> TypeError: function apply() { [native code] } is not a constructor\n```\n\
  \n构造函数的另一个缺点是，如果你不使用 `new` 调用它们，通常会得到乱八糟的结果：\n\n```\n1 User('James', 'swordfish')\n\
  2   //=> undefined\n```\n\n在 David Herman 的 [Effective JavaScript](http://www.amazon.com/gp/product/B00AC1RP14/ref=as_li_ss_tl?ie=UTF8&camp=1789&creative=390957&creativeASIN=B00AC1RP14&linkCode=as2&tag=raganwald001-2\
  \ \"Effective JavaScript: 68 Specific Ways to Harness the Power of JavaScript\"\
  ) 中，他描述了“与 new 无关的构造函数模式”。他提供了几种变体，但简单的是：\n\n```\n1 function User (name, password)\
  \ {\n2   if (!(this instanceof User)) {\n3     return new User(name, password);\n\
  4   }\n5   this.name = name || 'Untitled';\n6   this.password = password\n7 };\n\
  ```\n\n现在你可以在不使用 `new` 关键字的情况下调用构造函数：\n\n```\n1 User('James', 'swordfish')\n2  \
  \ //=> { name: 'James', password: 'swordfish' }\n```\n\n这反过来开启了对构造函数进行动态操作的可能性，而这些操作在你被强制使用\
  \ `new` 时是无法实现的：\n\n```\n1 function withDefaultPassword () {\n2   var args = Array.prototype.slice.call(arguments,\
  \ 0);\n3   args[1] = 'swordfish';\n4   return User.apply(this, args);\n5 } \n6 \n\
  7 withDefaultPassword('James')\n8   //=> { name: 'James', password: 'swordfish'\
  \ }\n```\n\n（上面的模式有一个权衡：它在所有情况下都有效，但当你想要设置继承层级时除外。）\n\n## 另一种一种与 new 无关的构造函数模式\n\
  \n这里是另一种编写与 new 无关构造函数的方法：\n\n```\n1 function User (name, password) {\n2   var self\
  \ = this instanceof User ? this : new User();\n3   if (name != null) {\n4     self.name\
  \ = name;\n5     self.password = password;\n6   }\n7   return self;\n8 };\n```\n\
  \n其原理是构造函数初始化一个赋值给变量 `self` 的对象并返回它。当你用 `new` 调用构造函数时，`self` 将被赋值为当前上下文。但如果你作为标准函数调用此构造函数，它将不带参数地调用自己并将新创建的\
  \ User 赋值给 `self`。\n\n## 混合 (Mixins)\n\n在任何其他名字类 中，我们看到可以使用我们的 `extend` 函数模拟“混合（mixins）”。现在我们重新回到这个主题，花更多时间研究如何将功能混合到类中。\n\
  \n首先快速回顾一下：在 JavaScript 中，“类”是通过构造函数及其原型实现的。类的实例是通过通过使用 `new` 调用构造函数来创建的。它们从构造函数的\
  \ `prototype` 属性中“继承”共享行为。共享分散在多个类中的行为，或者通过将其从沉重的原型中提取出来来解耦行为的一种方法，是使用混合（mixin）来扩展原型。\n\
  \n这是我们之前看到的的一个进化的待办事项类：\n\n```\n 1 function Todo (name) {\n 2   var self = this\
  \ instanceof Todo\n 3              ? this\n 4              : new Todo();\n 5   self.name\
  \ = name || 'Untitled';\n 6   self.done = false;\n 7 };\n```\n\n### 什么是“混合（mixin）”？\n\
  \n就像“类”一样，“混合”这个词对不同的人有不同的含义。Ruby 用户会谈论模块（modules）。而 JavaScript 用户可能会说一切都是对象，我们只是在扩展其中一个（它恰好是原型）。一个适用于大多数用途的简单定义是：将混合器定义为可以添加到类中的行为的集合。上面的\
  \ `Colouroded` 就是这样一个混合器。\n\n### 函数式混合 (Functional Mixins)\n\n我们上面的混合器可以正常工作，但我们的小配方有两个不同的步骤：定义混合器，然后扩展类。Angus\
  \ Croll 指出，将混合器定义为函数比对象优雅得多。他将其称为[函数式混合](https://javascriptweblog.com/2011/05/31/a-fresh-look-at-javascript-mixins/\
  \ \"对 JavaScript 混合的重新审视\")。这是我们用函数形式重塑的 `Colouroded`：\n\n```\n1 function becomeCoded\
  \ (target) {\n2   target.setColourRGB = fluent( function (r, g, b) {\n3     this.colourCode\
  \ = { r: r, g: g, b: b };\n4   });\n5   \n6   target.getColourRGB = function ()\
  \ {\n7     return this.colourCode;\n8   };\n9   \n10   return target;\n11 };\n12\
  \ \n13 becomeCoded(Todo.prototype);\n14 \n15 Todo.prototype;\n16   //=> { do: [Function],\n\
  17     undo: [Function],\n18        setColourRGB: [Function],\n19        getColourRGB:\
  \ [Function] }\n```\n\n注意我们将功能混合到了原型。这使得我们的混合保持灵活：如果你愿意，也可以将功能直接混合到对象中。Twitter 的\
  \ [Flight](https://twitter.github.com/flight) 框架使用了这种技术的变体，目标是混合函数的上下文：\n\n```\n\
  1 function asColourCoded () {\n2   this.setColourRGB = fluent( function (r, g, b)\
  \ {\n3     this.colourCode = { r: r, g: g, b: b };\n4   });\n5   \n6   this.getColourRGB\
  \ = function () {\n7     return this.colourCode;\n8   };\n9   \n10   return this;\n\
  11 };\n12 \n13 asColourCoded.call(Todo.prototype);\n```\n\n这种方法有一些细微的处：例如，你可以将混合器作为方法使用。可以编写与上下文无关的函数式混合：\n\
  \n\n\n\n\n```\n 1 function colourCoded () {\n 2   if (arguments[0] !== void 0) {\n\
  \ 3     return colourCoded.call(arguments[0]);\n 4   }\n 5   this.setColourRGB =\
  \ fluent( function (r, g, b) {\n 6     this.colourCode = { r: r, g: g, b: b };\n\
  \ 7   });\n 8   \n 9   this.getColourRGB = function () {\n10     return this.colourCode;\n\
  11   };\n12   \n13   return this;\n14 };\n```\n\n好极！\n\n## 类装饰器\n\n函数混入 看起来和我们见过的函数和方法装饰器相似。主要的区别在于，混入会修改它的主体，而函数装饰器返回一个包装了旧函数的新函数。如果我们希望某些\
  \ `Todo` 对象不进行颜色编码，且不希望有复杂的继承层级结构，或者我们希望动态地向类中混入功能，这种方法就会非常有用。\n\n> 有一个非常重要的警告：此时，JavaScript\
  \ 在动态参数化对构造函数的调用方面并不灵活。因此，这里讨论的函数装饰器模式仅适用于与 new 关键字字无关^(35)且能够创建“空对象”的构造函数。\n\n\
  再次回到我们的 `Todo` 类：\n\n```\n 1 function Todo (name) {\n 2   var self = this instanceof\
  \ Todo\n 3              ? this\n 4              : new Todo();\n 5   self.name =\
  \ name || 'Untitled';\n 6   self.done = false;\n 7 };\n 8 \n 9 Todo.prototype.do\
  \ = fluent( function () {\n10   this.done = true;\n11 });\n12 \n13 Todo.prototype.undo\
  \ = fluent( function () {\n14   this.done = false;\n15 });\n16 \n17 Todo.prototype;\n\
  18   //=> { do: [Function], undo: [Function] }\n```\n\n这是我们作为类装饰器使用的 `ColourCoded`：它返回一个新类而不是修改\
  \ `ToDo`：\n\n```\n 1 function AndColourCoded (clazz) {\n 2   function Decorated\
  \  () {\n 3     var self = this instanceof Decorated\n 4                ? this\n\
  \ 5                : new Decorated();\n 6     \n 7     return clazz.apply(self,\
  \ arguments);\n 8   };\n 9   Decorated.prototype = new clazz();\n10   \n11   Decorated.prototype.setColourRGB\
  \ = fluent( function (r, g, b) {\n12     this.colourCode = { r: r, g: g, b: b };\n\
  13   });\n14   \n15   Decorated.prototype.getColourRGB = function () {\n16     return\
  \ this.colourCode;\n17   };\n18   \n19   return Decorated;\n20 };\n21 \n22 var ColourTodo\
  \ = AndColourCoded(Todo);\n23 \n24 Todo.prototype;\n25   //=> { do: [Function],\
  \ undo: [Function] }\n26 \n27 var colourTodo = new ColourTodo('Write more JavaScript');\n\
  28 colourTodo.setColourRGB(255, 255, 0);\n29   //=> { name: 'Write more JavaScript',\n\
  30   //     done: false,\n31   //     colourCode: { r: 255, g: 255, b: 0 } }\n32\
  \   \n33 colourTodo instanceof Todo\n34   //=> true\n35   \n36 colourTodo instanceof\
  \ ColourTodo\n37   //=> true\n```\n\n尽管实现方式更为微妙，但当你希望避免破坏性地修改现有的原型时，类装饰器可以作为函数混入的改进方案。\n\
  \n## 间歇：乌龟、兔子与会传送的乌龟\n\n在很久以前（互联网初创公司的第一个时代），有人问我一个经典的算法面试题。问题是：“写一个算法，在常数空间内检测链表中的环。”\n\
  \n我并不特别惊讶自己当时在几分钟内没有想出答案。考虑到面试官的表现，他没有在现场终止面试，而是让我描述我脑海中在想的事情。\n\n我想我告诉他，我正在尝试看是否可以采用一种哈希算法，例如将所有内容进行异或运算。这是解决从列表中寻找缺失整数问题的“技巧性答案”，所以我在尝试那个旧的元算法——“将此转换为[你已经解决的问题](http://www-users.cs.york.ac.uk/susan/joke/3.htm#boil)”。之后我们继续聊了别的，他并没有揭晓那个“解决方案”。\n\
  \n我回到家里思考了这个问题。我想解决它。最后，我想出了一个办法并在家里的电脑上进行了尝试（使用 Java 语言！）。给他发了一封邮件分享我的结果，以证明我有坚持到底的能力。然后我忘记了它段时间。过了一会儿，我被正确答案是：\n\
  \n```\n 1 var LinkedList, list, tortoiseAndHareLoopDetector;\n 2 \n 3 LinkedList\
  \ = (function() {\n 4   function LinkedList(content, next) {\n 5     this.content\
  \ = content;\n 6     this.next = next ? next : 0;\n 7   }\n 8   LinkedList.prototype.appendTo\
  \ = function(content) {\n 9     this.next = new LinkedList(content, this);\n10 \
  \   return this.next;\n11   };\n12   LinkedList.prototype.tailNode = function()\
  \ {\n13     var nextThis;\n14     return nextThis = this.next ? nextThis : 0;\n\
  15   };\n16   return LinkedList;\n17 })();\n18 tortoiseAndHareLoopDetector = function(list)\
  \ {\n19   var hare, tortoise, nextHare;\n20   tortoise = list;\n21   hare = list.next;\n\
  22   while (tortoise != null && hare != null) {\n23     if (tortoise === hare) {\n\
  24       return true;\n25     }\n26     tortoise = tortoise.next;\n27     hare =\
  \ hare.next ? hare : 0;\n28   }\n29   return false;\n30 };\n```\n等等，让我根据规则重新格式化提供的代码块：\n\
  \n```\n 1 var LinkedList, list, tortoiseAndHareLoopDetector;\n 2 \n 3 LinkedList\
  \ = (function() {\n 4   function LinkedList(content, next) {\n 5     this.content\
  \ = content;\n 6     this.next = next ? next : 0;\n 7   }\n 8   LinkedList.prototype.appendTo\
  \ = function(content) {\n 9     this.next = new LinkedList(content, this);\n10 \
  \   return this.next;\n11   };\n12   LinkedList.prototype.tailNode = function()\
  \ {\n13     var nextThis;\n14     return nextThis = this.next ? nextThis : 0;\n\
  15   };\n16   return LinkedList;\n17 })();\n18 tortoiseAndHareLoopDetector = function(list)\
  \ {\n19   var hare, tortoise, nextHare;\n20   tortoise = list;\n21   hare = list.next;\n\
  22   while (tortoise != null && hare != null) {\n23     if (tortoise === hare) {\n\
  24       return true;\n25     }\n26     tortoise = tortoise.next;\n27     hare =\
  \ hare.next ? hare : 0;\n28   }\n29   return false;\n30 };\n```\n*修正：代码块的输入是乱码/损坏的。我将按照提示呈现原始文本。*\n\
  \n```\n 1 var LinkedList, list, tortoiseAndHareLoopDetector;\n 2 \n 3 LinkedList\
  \ = (function() {\n 4   function LinkedList(content, next) {\n 5     this.content\
