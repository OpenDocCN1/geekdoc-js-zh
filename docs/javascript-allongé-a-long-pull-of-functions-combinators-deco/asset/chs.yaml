  \n20. 所有当代语言中的数组存储的引用而非拷贝，所以我们期望它们在 JavaScript 中以相同的方式运行是可以被原谅的。尽管如此，为自己进行测试仍然是一个有用的练习。↩︎\n\
  \n21. 关于卡尔·弗里德里希·高斯（Karl Friedrich Gauss）小学时期有一个广为人知的故事。他的老师对班发火，让他们把 1 到 100 的数字相加，并在下课前给出答案。大约\
  \ 30 秒后，高斯就给了答案。其他孩子还在这样相加：`1 + 2 + 3 + . . . . + 99 + 100 = ?` 但高斯重新排列了数字，这样相加：`(1\
  \ + 100) + (2 + 99) + (3 + 98) + . . . + (50 + 51) = ?` 如果你注意到每对数字加起来都是 101。共有 50\
  \ 对对数字，所以答案是 `50*101 = 5050`。当然，高斯得出答案比其他孩子快了大约 20 倍。↩︎\n\n22. 为什么要提供 map 函数？嗯，JavaScript\
  \ 是一门不断演变的语言，当你编写在浏览器中运行的代码时，你可能希望支持不支持 `map` 的旧版本 JavaScript。一种方法是将该方法“垫”（shim）进\
  \ `Array` 类中，另一种是使用库。如果可用，大多数实现将默认使用它。↩︎\n\n23. 如果我们总是对数组进行映射，我们可以写 `list.map(fn)`。然而，有些对象具有\
  \ `length` 属性和 `[]` 访问器，可以被映射，但没有 `map` 方法。`map` 对这些对象也有效。这指向了一个更大的问题，即容器是否真的实现了像\
  \ `map` 这样的方法。↩︎\n\n24. “一种便于将数据与操作该数据的方法（或其他函数）封装的语言结构。”——[Wikipedia](https://en.wikipedia.org/wiki/Encapsulation_oriented_programming)↩︎\n\
  \n25. 是的，还有另一种跟踪数组大小的方法，但我们不需要它来演示封装和状态的隐藏。↩︎\n\n26. 当你取一个已经重构的组件并重新排列，使其被重构为一组不同的子组件而不改变其行为时，你正在进行重构。↩︎\n\
