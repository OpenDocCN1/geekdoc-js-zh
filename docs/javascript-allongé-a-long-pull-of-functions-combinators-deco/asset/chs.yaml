  \n\n\n\n# 引用与对象\n\nJavaScript 也提供了对象。“对象（object）”一词在编程界非常流行，这是因为“面向对象编程”这一术语被广泛使用。该术语由\
  \ Alan Kay 创造，但从以来对不同的人来说有许多不同的含义。\n\n在 JavaScript 中，一个 `object[^pojo]` 是从名称到值的映射，非常像环境。创建对象的常用语法非常简单：\n\
  \n通过这种方式创建的对象具有不同的身份，就像数组一样：\n\n```\n1 { year: 2012, month: 6, day: 14 } === { year:\
  \ 2012, month: 6, day: 14 }\n2   //=> false\n```\n\n使用 `[]` 配合字符串通过名称访问值：\n\n```\n\
  1 { year: 2012, month: 6, day: 14 }['day']\n2   //=> 14\n```\n\n对象中包含的值的工作方式与数组中包含的值完全相同：\n\
  \n```\n 1 var unique = function () {\n 2                 return function () {}\n\
  \ 3               },\n 4     x = unique(),\n 5     y = unique(),\n 6     z = unique(),\n\
  \ 7     o = { a: x, b: y, c: z };\n 8 \n 9 o['a'] === x && o['b'] === y && o['c']\
  \ === z\n10   //=> true\n```\n\n名称不需要是字母数字字符串。对于其他任何情况，用引号括标签：\n\n```\n1 { 'first\
  \ name': 'reginald', 'last name': 'lewis' }['first name']\n2   //=> 'reginald'\n\
  ```\n\n如果名称是符合变量名规则的字母数字字符串，则有访问值的简化语法：\n\n```\n1 { year: 2012, month: 6, day: 14\
  \ }['day'] ===\n2     { year: 2012, month: 6, day: 14 }.day\n3   //=> true\n```\n\
  \n所有容器都可以包含任何值，包括函数或其他容器：\n\n```\n1 var Mathematics = {\n2   abs: function (a) {\n\
  3          return a < 0 ? -a : a\n4        }\n5 };\n6 \n7 Mathematics.abs(-5)\n\
  8   //=> 5\n```\n\n提一下 `Mathematics` 挺奇的。如果你还记得，JavaScript 提供了一个全局环境，其中包含一些现有对象，带有你可以使用的方便函数。其中一个被称为\
  \ `Math`，它包含了 `abs`、`max`、`min` 以及许多其他函数。由于它是始终可用的，只要你不遮蔽 `Math`，你可以在任何环境中使用它。\n\
  \n```\n1 Math.abs(-5)\n2   //=> 5\n```\n\n# 重新赋值与变更\n\n和大多数命令式编程语言一样，JavaScript\
  \ 允许你重新为变量赋值。这种语法对于大多数流行语言的用户来说是熟悉的：\n\n```\n1 var age = 49;\n2 age = 50;\n3 age\n\
  4   //=> 50\n```\n\n花时间仔细研究环境中的绑定发生了什么。让我们花时间探索对变量重新赋值会发生什么。关键在于理解，我们正在相同环境中向相同的名称重新绑定一个不同的值。\n\
  \n所以让我们考虑一下被遮蔽变量会发生什么：\n\n```\n1 (function () {\n2   var age = 49;\n3   (function\
  \ () {\n4     var age = 50;\n5   })();\n6   return age;\n7 })()\n8   //=> 49\n```\n\
  \n在内部环境中为 age 绑定 `50` 不会改变外部环境中的 `age`，因为内部环境中 `age` 的绑定遮蔽了外部环境中对 `age` 的绑定。我们从：\n\
  \n```\n1 {age: 49, '..': global-environment}\n```\n\n变为：\n\n```\n1 {age: 50, '..':\
  \ {age: 49, '..': global-environment}}\n```\n\n然后回到：\n\n```\n1 {age: 49, '..': global-environment}\n\
  ```\n\n然而，如果我们没有通过显式使用 `var` 来遮蔽 `age`，在嵌套环境中对其进行重新赋值会改变原始值：\n\n```\n1 (function\
  \ () {\n2   var age = 49;\n3   (function () {\n4     age = 50;\n5   })();\n6   return\
  \ age;\n7 })()\n8   //=> 50\n```\n\n就像评估变量标签一样，当绑定被重新绑定时，JavaScript 会在当前环境中查找绑定，然后逐个查找祖先环境，直到找到一个。它会在该环境中重新绑定名称。\n\
  \n![Cupping Grinds](img/cupping.jpg)\n\n杯测研磨\n\n## 变更与别名\n\n现在我们可以重新赋值东西了，还有另一个需要考虑的因素因素：某些值可以*变更*。它们的身份保持不变，但结构不是。具体来说，数组和对象可以发生变更。记得你可以使用\
  \ `[]` 从数组或对象内部访问值。你也可以使用 `[]` 重新赋值值：\n\n```\n1 var oneTwoThree = [1, 2, 3];\n2\
  \ oneTwoThree[0] = 'one';\n3 oneTwoThree\n4   //=> [ 'one', 2, 3 ]\n```\n\n你甚至可以添加一个值：\n\
  \n```\n1 var oneTwoThree = [1, 2, 3];\n2 oneTwoThree[0] = 'one';\n3 oneTwoThree\n\
  4   //=> [ 'one', 2, 3 ]\n```\n\n你甚至可以添加一个值：\n\n```\n1 var oneTwoThree = [1, 2,\
  \ 3];\n2 oneTwoThree[0] = 'one';\n3 oneTwoThree\n4   //=> [ 'one', 2, 3 ]\n```\n\
  \n# 如何用 var 射自己脚\n\n正如我们所见，JavaScript 的环境和绑定是非常强大的：你可以使用函数参数或用 `var` 的变量来绑定并重新绑定名称。结论是，在使用得当的情况下，`var`\
  \ 关键字是一个很好的工具。\n\n在使用得当的情况下。让我们看看一些*不恰当*的使用方法。\n\n### 松散使用\n\n`var` 关键字的作用域是包裹它的函数。这是合理的，因为绑定是在环境中进行的，而环境与函数调用相关联。所以如果你写：\n\
  \n```\n1 function foo (bar) {\n2   var baz = bar * 2;\n3   \n4   if (bar > 1) {\n\
  5     var blitz = baz - 100;\n6     \n7     // ...\n8   }\n9 }\n```\n\n名称 `blitz`\
  \ 实际上的作用域是函数 `foo`，而不是 `if` 语句的后续代码块。大约有两种流派。一种思路是这样的：既然 `blitz` 的作用域是函数 `foo`，你应该这样写代码：\n\
  \n```\n 1 function foo (bar) {\n 2   var baz = bar * 2,\n 3       blitz;\n 4   \n\
  \ 5   if (bar > 1) {\n 6     blitz = baz - 100;\n 7     \n 8     // ...\n 9   }\n\
  10 }\n```\n\n\n\n\n我们将“声明”与“赋值”分离开来，并明确了 `blitz` 的作用域是整个函数。另一种观点是，程序员有责任理解工具是如何工作的，而且即使你用第一种方式编写代码，阅读这段代码的其他程序员也应该知道它是如何运行的。\n\
  \n所以这里有一个问题：这两种编写代码的方式等价的吗？让我们建立一个用例来区分它们。我们将尝试一些别名操作：\n\n```\n 1 var questionable\
  \ = 'outer';\n 2 \n 3 (function () {\n 4   alert(questionable);\n 5   \n 6   if\
  \ (true) {\n 7     var questionable = 'inner';\n 8     alert(questionable)\n 9 \
  \  }\n10 })()\n```\n\n如果我们把这段代码输入浏览器控制台，会发生什么？一种理论认为它会先弹出 `outer` 然后是 `inner`，因为在评估第一个\
  \ `alert` 时，`questionable` 还没有绑定到函数的环境中，所以它将在闭包环境中进行查找。然后一个别名被绑定，遮蔽了外部绑定，接着它会弹出\
  \ `inner`。\n\n这个理论是错的！它实际上会弹出 `undefined` 然后是 `inner`。尽管我们在代码后部写了 `var` 语句，但 JavaScript\
  \ 的行为就像是在我们在函数顶部声明了它一样。即使我们从未执行过 `var` 语句，也是如此：\n\n```\n1 var questionable = 'outer';\n\
  2 \n3 (function () {\n4   return questionable;\n5   \n6   var questionable = 'inner'\n\
  7 })()\n8 \n9   //=> undefined\n```\n\n所以，是的，这两种编写代码的方式效果是一样的，但只有一种方式直接且直观地代表了它的工作原理。由于这个原因，我们总是将\
  \ `var` 声明放在每个函数的顶部。\n\n### 为了 pete 的 sake\n\nJavaScript 提供了一个 `for` 循环供你迭代的乐趣和便利。它看起来非常像\
  \ C 语言中的 `for` 循环：\n\n```\n1 var sum = 0;\n2 for (var i = 1; i <= 100; i++) {\n\
  3   sum = sum + i\n4 }\n5 sum\n6   #=> 5050\n```\n\n希望你能想到一种更快的办法来计算这个和。也许你已经注意到\
  \ `var i = 1` 被收了起来，而不是像我们喜欢的那样放在顶部。但这会成为问题吗？\n\n是的。考虑这个变体：\n\n```\n 1 var introductions\
  \ = [],\n 2     names = ['Karl', 'Friedrich', 'Gauss'];\n 3   \n 4 for (var i =\
  \ 0; i < 3; i++) {\n 5   introductions[i] = \"Hello, my name is \" + names[i]\n\
  \ 6 }\n 7 introductions\n 8   //=> [ 'Hello, my name is Karl',\n 9   //     Hello,\
  \ my name is Friedrich',\n10   //     'Hello, my name is Gauss' ]\n```\n\n到为止还好。嘿，记得\
  \ JavaScript 中的函数是值吗？让我们来点花样吧！\n\n```\n 1 var introductions = [],\n 2     names\
  \ = ['Karl', 'Friedrich', 'Gauss'];\n 3   \n 4 for (var i = 0; i < 3; i++) {\n 5\
  \   introductions[i] = function (soAndSo {\n 6     return \"Hello, \" + soAndSo\
  \ + \", my name is \" + names[i]\n 7   }\n 8 introductions\n 9   //=> [Function],\n\
  10   //     [Function],\n11   //     [Function] ]\n```\n\n到为止还好。让我们尝试一下其中一个函数：\n\
  \n```\n1 introductions('Raganwald')\n2   //=> 'Hello, Raganwald, my name is undefined'\n\
  ```\n\n哪里出错了？为什么它没有给我们返回‘Hello, Raganwald, my name is Friedrich’？答案是那个讨厌的 `var i`。记得\
  \ `i` 是绑定在周围环境中，所以就像是我们写了这样的代码：\n\n```\n1 var introductions = [],\n2     names =\
  \ ['Karl', 'Friedrich', 'Gauss'],\n3     i;\n4   \n5 for (i = 0; i < 3; i++) {\n\
  6   introductions[i] = function (soAndSo) {\n7     return \"Hello, \" + soAndSo\
  \ + \", my name is \" + names[i]\n8   }\n9 introductions\n```\n\n现在，在我们创建每个函数时，`i`\
  \ 有一个合理的值，比如 `0`、`1` 或 `2`。但在我们调用其中一个时，`i` 的值是 `3`，这就是循环终止的原因。所以当函数被调用时，JavaScript\
  \ 在它的周围环境（闭包）中查找 `i`，得到了值 `3`。这完全不是我们想要的。\n\n这是修复方法，再次以 `let` 作为我们的指南：\n\n```\n\
  1 var introductions = [],\n2     names = ['Karl', 'Friedrich', 'Gauss'];\n3   \n\
  4 for (var i = 0; i < 3; i++) {\n5   (function (i) {\n6     introductions[i] = function\
  \ (soAndSo) {\n7       return \"Hello, \" + soAndSo + \", my name is \" + names[i]\n\
  8     }\n9   )(i)\n10 }\n11 introductions('Raganwald')\n12   //=> 'Hello, Raganwald,\
  \ my name is Friedrich'\n```\n\n这里我们做了什么？通过将 `i` 传递到立即执行函数（IIFE），我们为每次迭代创建了新的作用域，从而保护了\
  \ `i` 的值。\n\n```\n1 var introductions = [],\n2     names = ['Karl', 'Friedrich',\
  \ 'Gauss'];\n3   \n4 for (var i = 0; i < 3; i++) {\n5   (function (i) {\n6     introductions[i]\
  \ = function (soAndSo) {\n7       return \"Hello, \" + soAndSo + \", my name is\
  \ \" + names[i]\n8     }\n9   )(i)\n10 }\n11 introductions('Raganwald')\n12   //=>\
  \ 'Hello, Raganwald, my name is Friedrich'\n```\n\n等等，我们其实可以使用 `let` 来解决这个问题，这会更简单：\n\
  \n```javascript\nvar introductions = [],\n    names = ['Karl', 'Friedrich', 'Gauss'];\n\
  \   \nfor (let i = 0; i < 3; i++) {\n  introductions[i] = function (soAndSo) {\n\
  \    return \"Hello, \" + soAndSo + \", my name is \" + names[i]\n  }\n}\nintroductions('Raganwald')\n\
  //=> 'Hello, Raganwald, my name is Friedrich'\n```\n\n（注：此处抱歉，上面的 `let` 示例在原文中似乎漏掉了，但根据逻辑，该处应该是展示如何使用\
  \ `let` 的块级作用域来解决问题。我将遵循你提供的原文文本翻译。）\n\n\n\n你可能记得在命名函数表达式中，我们看到当你创建一个命名函数表达式时，你将函数名称绑定到它的体内部，而不是绑定到函数表达式的环境中，这意味着你可以写：\n\
  \n```\n 1 var even = function myself (num) {\n 2   return (num === 0) || !(myself(num\
  \ - 1))\n 3 }\n 4 \n 5 divisibleByTwo = even;\n 6 even = void 0;\n 7 \n 8 divisibleByTwo(0)\n\
  \ 9   //=> true\n10   \n 11 divisibleByTwo(1)\n 12   //=> false\n13   \n 14 divisibleByTwo(42)\n\
  \ 15   //=> true\n```\n\n这种情况不同，因为函数没有引用闭包环境中绑定的名称，而是引用它自身内部绑定的名称。它现在是一个纯函数。事实上，你甚至可以将其绑定到闭包环境中完全相同的名称上，它仍然可以工作：\n\
  \n```\n 1 var even = function even (num) {\n 2   return (num === 0) || !(even(num\
  \ - 1))\n 3 }\n 4 \n 5 divisibleByTwo = even;\n 6 even = void 0;\n 7 \n 8 divisibleByTwo(0)\n\
  \ 9   //=> true\n10   \n 11 divisibleByTwo(1)\n 12   //=> false\n13   \n 14 divisibleByTwo(42)\n\
  \ 15   //=> true\n```\n\n函数内部的 `even` 指的是通过命名函数表达式在函数内部绑定的名称。它的名称可能与闭包环境中绑定的 `even`\
  \ 相同，但它们是两个不同环境两个不同绑定。因此，在闭包环境中重新绑定该名称不会破坏函数。\n\n你可能会问，如果我们在函数内部重新绑定 `even` 会怎样？现在它会崩溃吗？\n\
  \n```\n 1 var even = function even (num) {\n 2   even = void 0;\n 3   return (num\
  \ === 0) || !(even(num - 1))\n 4 }\n 5 \n 6 divisibleByTwo = even;\n 7 even = void\
  \ 0;\n 8 \n 9 divisibleByTwo(0)\n 10   //=> true\n11   \n 12 divisibleByTwo(1)\n\
  \ 13   //=> false\n14   \n 15 divisibleByTwo(42)\n 16   //=> true\n```\n\n奇怪的是，它不会崩溃。由命名函数表达式绑定的名称是只读的。为什么我们说“奇怪”呢？因为其他像函数声明那样的准声明，其行为*不是*这样的。\n\
  \n所以，当我们想要创建一个递归函数时，最安全的做法是使用命名函数表达式。\n\n### 局限性\n\n命名函数表达式是有限制的。这里是一个限制：你可以进行简单的递归，但不能进行相互递归。例如：\n\
  \n```\n 1 var even = function (num) even { return (num === 0) || odd( num - 1) };\n\
  \ 2 var odd  = function (num) odd  { return (num  >  0) && even(num - 1) };\n 3\
  \ \n 4 odd = 'unusual';\n 5 \n 6 even(0)\n 7   //=> true\n 8 \n 9 even(1)\n10  \
  \ //=> TypeError\n```\n\n使用命名函数表达式对我们这里没有帮助，因为 `even` 和 `odd` 需要被绑定在一个彼此可以访问的环境中，而不仅仅是它们自身。你必须避免重新绑定这些函数的名称，或者使用闭包来构建一个模块：\n\
  \n```\n 1 var operations = (function () {\n 2       var even = function (num) {\
  \ return (num === 0) || odd( num - 1) };\n 3       var odd  = function (num) { return\
  \ (num  >  0) && even(num - 1) };\n 4       return {\n 5         even: even,\n 6\
  \         odd:  odd\n 7       }\n 8     })(),\n 9     even = operations.even,\n\
  10     odd = operations.odd;\n```\n\n现在你可以重新绑定其中一个而不影响另一个，因为闭包外部的重新赋值对闭包内部的绑定没有影响：\n\
  \n```\n 1 odd = 'unusual;\n 2 \n 3 even(0)\n 4   //=> true\n 5   \n 6 even(1)\n\
  \ 7   //=> false\n 8   \n 9 even(42)\n10   //=> true\n```\n\n| ![tip](img/leanpub_key.png)\
  \ | 正如人们经常提到的，重构*为*某种模式比*使用*某种模式进行设计更为重要。所以，不要急急于用这种方式编写所有的递归函数，但要熟悉这项技术，以便在当以及当你遇到微妙的\
  \ bug 时，能够识别问题并知道如何修复它。 |\n\n### 从 let 到模块\n\n### 瞬态 let\n\n在 let 和 Var 章节中，我们学习了通过将函数定义与函数调用相结合，随时随地创建一个新环境，如下：\n\
  \n```\n1 (function () {\n2   //\n3 })();\n```\n\n因为这个函数被调用了，如果它包含语句，它将求值为：\n\n\n\
  \n每当我们调用 `formatDate` 时，JavaScript 都会创建一个全新的 `unformattedDate` 函数。这是没有必要的，因为它是一个纯函数。从理论上说，足够智能的解释器会注意到并只创建一个函数。在实践中，我们可以重写它，使用私有闭包并仅只创建一个辅助函数：\n\
  \n```\n 1 var formatDate = (function () {\n 2   return function (time) {\n 3   \
  \  var date;\n 4 \n 5     if (time) {\n 6       date = unformattedDate(time);\n\
  \ 7       //必须处理日期，因为我们无法根据服务器提供的 GMT\n 8       // 创建日期\n 9 \n10       if (!(/-\\\
  d\\d:\\d\\d/.test(time))) {\n 11         date.setHours(date.getHours() - date.getTimezoneOffset()/60);\n\
  \ 12       }\n 13 \n14       var diff = ((new Date()).getTime() - date.getTime())\
  \ / 1000;\n 15       day_diff = Math.floor(diff / 86400);\n 16 \n 17       if (\
  \ isNaN(day_diff) || day_diff < 0  )\n 18         return;\n 19 \n 20       return\
  \ '<span title=\"' + date.toUTCString() + '\">' + (day_diff == 0 && (\n 21     \
  \      diff < 60 && \"just now\" ||\n 22           diff < 120 && \"1 minute ago\"\
  \ ||\n 23           diff < 3600 && Math.floor( diff / 60 ) + \" minutes ago\" ||\n\
  \ 24           diff < 7200 && \"1 hour ago\" ||\n 25           diff < 86400 && Math.floor(\
  \ diff / 3600 ) + \" hours ago\") ||\n 26         day_diff == 1 && \"Yesterday\"\
  \ ||\n 27         day_diff < 7 && day_diff + \" days ago\" ||\n 28         day_diff\
  \ < 31 && Math.ceil( day_diff / 7 ) + \" weeks ago\" ||\n 29         (day_diff <\
  \ 360 && day_diff >= 31) && Math.ceil(day_diff / 31) +\n 30           ' month' +\
  \ (day_diff == 31 ? '' : 's') + ' ago' ||\n 31           day_diff > 360 && Math.floor(\
  \ day_diff / 360) + \n 32           \" years \" + Math.floor(day_diff%360/32) +\
  \ \" months ago\") + '</span>';\n 33     }\n 34     else return '-'\n 35   }\n 36\
  \   \n 37   function unformattedDate (time) {\n 38     return new Date((time ||\
  \ \"\").replace(/[-+]/g,\"/\").replace(/[TZ]/g,\" \").replac\\\n 39 e(/\\/\\d\\\
  d:\\d\\d/, ''));\n 40   }\n 41 })();\n```\n\n`unformattedDate` 函数对 `formatDate`\
  \ 仍然私有的，但现在我们不再需要在每次调用 `formatDate` 时都构建一个全新的函数了。\n\n## 模块\n\n一旦体验过通过 let（或“立即调用函数表达式”）创建新环境的魔威力，很快你就会发现自己开始使用\
  \ let 来构建模块了。模块是任何具有某些私有元素和某些公开元素的函数集合。\n\n考虑一个设计在虚拟屏幕上绘制某些位点的模块。公共 API 由一系列绘制函数组成。私有\
  \ API 包含一系列辅助函数。这与私有闭包完全一样，唯一的区别在于我们想要返回多个公共函数，而不仅仅是一个。\n\n它看起来像这样：\n\n```\n 1 var\
  \ DrawModule = (function () {\n 2   \n 3   return {\n 4     drawLine: drawLine,\n\
  \ 5     drawRect: drawRect,\n 6     drawCircle: drawCircle\n 7   }\n 8   \n 9  \
  \ // 公共方法\n10   var drawLine = function (screen, leftPoint, rightPoint) { ... }\n\
  \ 11   var drawRect = function (screen, topLeft, bottomRight) { ... }\n 12   var\
  \ drawCircle = function (screen, center, radius) { ... }\n 13   \n 14   // 私有辅助\n\
  \ 15   function bitBlt (screen, ...) { ... }\n 16   function resize (screen, ...)\
  \ { ... }\n 17   \n 18 })();\n```\n\n然后你可以使用 `DrawModule.drawCircle(...)` 调用公共函数。这个概念可以扩展到包含状态的概念（例如设置默认线条样式），但当你观察它时，它实际上只是私有闭包，只是以返回一个包含多个函数的对象的形式稍微复杂了一点。\n\
  \n### 总结\n\n| ![tip](img/leanpub_key.png) |  |\n\n### 重新绑定\n\n- JavaScript 允许变量重新赋值/重新绑定。\n\
  - 数组和对象是可变的。\n- 引用允许引用类型的别名。\n- 我们可能需要特别注意，以防止意外破坏递归函数。\n- for 循环非常方便，但需要小心以避免作用域\
  \ bug。\n\n## 带有重绑定和引用的 5 个配方\n\n![Café Diplomatico in Toronto's Little Italy](img/diplomatico.jpg)\n\
  \n多伦多小意大利的 Diplomatico 咖啡馆\n\n\n\n\n让我们考虑一种情况：假设我们有一个自己的 `map` 函数，它可能来自 [allong.es](http://allong.es)\
  \ 库，也可能来自 [Underscore](http://underscorejs.org)。我们可以写出类似这样的函数：\n\n```\n1 function\
  \ mapWith (fn) {\n2   return function (list) {\n3     return map.call(list, fn);\n\
  4   };\n5 };\n```\n\n观察这段代码，我们发现自己将两个不同的转换混淆了。首先，我们反转了参数的顺序。你可以看到，如果我们对它进行简化：\n\n\
  ```\n1 function mapWith (fn, list) {\n2   return map.call(list, fn);\n3 };\n```\n\
  \n其次，我们对函数进行了“柯里化”（currying），使其不再定义一个接受两个参数的函数，而是返回一个接受第一个参数的函数，然后再返回一个接受第二个参数并应用这两个者的函数，如下：\n\
  \n```\n1 function mapCurried (list) {\n2   return function (fn) {\n3     return\
  \ map(list, fn);\n4   };\n5 };\n```\n\n让我们回到那个同时实现了这两者的实现：\n\n```\n1 function mapWith\
  \ (fn) {\n2   return function (list) {\n3     return map.call(list, fn);\n4   };\n\
  5 };\n```\n\n现在我们给它包上一个包装：\n\n```\n1 function wrapper () {\n2   return function\
  \ (fn) {\n3     return function (list) {\n4       return map.call(list, fn);\n5\
  \     };\n6   };\n7 };\n```\n\n抽象化参数名：\n\n```\n1 function wrapper () {\n2   return\
  \ function (first) {\n3     return function (second) {\n4       return map.call(second,\
  \ first);\n5     };\n6   };\n7 };\n```\n\n最后，将函数提取为参数：\n\n```\n1 function wrapper\
  \ (fn) {\n2   return function (first) {\n3     return function (second) {\n4   \
  \    return fn.call(second, first);\n5     };\n6   };\n7 };\n```\n\n我们现在拥有了一个接收一个函数并“翻转”其参数顺序，然后对其进行柯里化的函数：\n\
  \n```\n1 function flip (fn) {\n2   return function (first) {\n3     return function\
  \ (second) {\n4       return fn.call(this, second, first);\n5     };\n6   };\n7\
  \ };\n```\n\n这太棒了。现在考虑我们如何定义 mapWith ：\n\n```\n1 var mapWith = flip(map);\n```\n\
  \n漂亮得多！\n\n还有一个最后的装饰。有时我们可能想要翻转一个函数，但保留同时使用两个参数调用它的的灵活性。没问题：\n\n```\n 1 function\
  \ flip (fn) {\n2   return function (first, second) {\n3     if (arguments.length\
  \ === 2) {\n4       return fn.call(this, second, first);\n5     }\n6     else {\n\
  7       return function (second) {\n8         return fn.call(this, second, first);\n\
  9       };\n10     };\n11   };\n12 };\n```\n\n现在你可以调用 `mapWith(fn, list)` 或 `mapWith(fn)(list)`，随你喜欢。\n\
  \n### 扩展\n\n通过向对象添加属性来“扩展”一个对象是非常常见的：\n\n```\n1 var inventory = {\n2   apples: 12,\n\
  3   oranges: 12\n4 };\n5\n6 inventory.bananas = 54;\n7 inventory.pears = 24;\n```\n\
  \n将一个对象的属性添加到另一个对象的[浅拷贝](https://en.wikipedia.org/wiki/Object_copy#Shallow_copy)\
  \ 也是常见的：\n\n```\n1   for (var fruit in shipment) {\n2     inventory[fruit] = shipment[fruit]\n\
  3   }\n```\n\n这两个需求都可以通过这个 `extend` 的配方满足：\n\n```\n 1 var extend = variadic( function\
  \ (consumer, providers) {\n2   var key,\n3       i,\n4       provider;\n5   \n6\
  \   for (i = 0; i < providers.length; ++i) {\n7     provider = providers[i];\n8\
  \     for (key in provider) {\n9       if (provider.hasOwnProperty(key)) {\n10 \
  \        consumer[key] = provider[key]\n11       }\n12     }\n13   }\n14   return\
  \ consumer\n15 });\n```\n\n你可以通过扩展一个空对象来拷贝对象：\n\n```\n1 extend({}, {\n2   apples:\
  \ 12,\n3   oranges: 12\n4 })\n   //=> { apples: 12, oranges: 12 }\n```\n\n你可以用一个对象扩展另一个对象：\n\
