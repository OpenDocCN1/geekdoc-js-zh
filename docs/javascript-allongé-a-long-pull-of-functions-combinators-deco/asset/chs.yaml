- "# JavaScript Allongé：深入函数、组合子和装饰器\n\n\n\n![](img/title_page.jpg)\n\n![JavaScript\
  \ Allongé](img/title_page.jpg)\n\n\n\n\n\n\n\n\n\n本书献给我的女儿 Clara Maude Braithwaite。\n\
  \n\n> “Café Allongé，也称为 Espresso Lungo，是一种浓度介于意式浓缩和美式之间的饮料。它有两种不同的制作方法。第一种，也是我喜欢的，是在双份或四份的意式浓缩咖啡（Ristretto）中加入少量热水。就像向威士忌中加一点水一样，少量的稀释能释放出口中更复杂的层次。”\n\
  \n> “第二种方法是萃取一份超长双份浓缩。这种方法实现的油水比例与稀释法大致相同，但由于萃取时间更长，会释放出不同的风味组合。有些人抱怨长萃取会让味道更苦，损害咖啡最佳的特性；另一些人则认为它释放了更多的复杂性。”\n\
  \n> “重要的是，无论哪种准备方法都不应该使用过多的水导致咖啡变成像病态、苍白的浓缩幽灵。凡事适度。”\n\n### Michael Fogus 序言\n\n\
  作为一个终身书迷和 Reg 在线作品的长期关注，当他开始写书时，我非常兴奋。然而，我对书籍非常保守——可以说，如果有一种闻起来像“旧书店”精髓的须后水，我会是第一个排队买的人。所以正如你想象的，对于将\
  \ *JavaScript Allongé* 作为一种持续更新的、随心付费模式的电子书发布，我持“怀疑”态度。然而，Reg 给我寄了一本书，我深受感动。这不仅是一本好书，也是一种编写和分发书籍的极佳方式。我自己写过书，我知道征求和接收反馈的痛苦。\n\
  \n写作是一个迭代过程，（非常经常）具有紧密的修订循环。然而，征求反馈、收集响应、发送副本、等待人们真正阅读（如果他们真的读的话）、接收反馈并最终理解如何使用它的过程需要几周，有时是几个月的时间。在多次情况下，我发现自己正试图用已经不存在或已改变得无法辨认的内容来实现反馈。。然而，通过\
  \ Leanpub 模式，“阅读-反馈-修改”的过程极其高效，留下的是本高质量的书籍，并随着他人无限的阅读和评论，这本书不断变得更好。\n\n在 *JavaScript\
  \ Allongé* 的案例中，你会发现 Leanpub 模式是高效的典范。Reg 不仅从鉴赏家的角度创作（并持续创作）了一本有趣的书，还对他艺术中一些最有趣的方面进行了趣味性的探索。无论你认为自己有多么专家，*JavaScript\
  \ Allongé* 都有东西可以教给你……关于咖啡。我开个玩笑的。\n\n作为函数式编程的坚定支持者，Reg 写的很多内容对我来说是非常深刻的。虽然这并不是一本专门关于函数式编程的书，但\
  \ *JavaScript Allongé* 将为函数技术提供坚实的基础。然而，你不会被教条打得头晕脑胀。相反，每一章节都由相关的对话驱动，并以有说服力的源码示例进行强化。作为一名编程书籍的作者，我佩服\
  \ Reg 所取得的成就，并对通过互联网扩张丛林中的某个阴暗通道发现 *JavaScript Allongé* 并第一次阅读它的优秀读者感到羡慕。\n\n祝阅读愉快。\n\
