  \ 21             fnLength - numberOfArgs - 1, 0),\n 22           argPadding = new\
  \ Array(numberOfMissingNamedArgs),\n 23           variadicArgs = __slice.call(\n\
  \ 24             arguments, fn.length - 1);\n 25 \n 26       return fn.apply(\n\
  \ 27         this, namedArgs\n 28               .concat(argPadding)\n 29       \
  \        .concat([variadicArgs]));\n 30     }\n 31   }\n 32 };\n 33 \n 34 function\
  \ unary (first) {\n 35   return first\n 36 }\n 37 \n 38 unary('why', 'hello', 'there')\n\
  \ 39   //=> 'why'\n 40   \n 41 variadic(unary)('why', 'hello', 'there')\n 42   //=>\
