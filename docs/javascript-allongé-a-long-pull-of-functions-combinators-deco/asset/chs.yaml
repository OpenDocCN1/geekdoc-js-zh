  \ (fn, larg) {\n 4   return function () {\n 5     var args = __slice.call(arguments,\
  \ 0);\n 6     \n 7     return fn.apply(this, [larg].concat(args))\n 8   }\n 9 }\n\
  10 \n11 function callLast (fn, rarg) {\n 12   return function () {\n 13     var\
  \ args = __slice.call(arguments, 0);\n 14     \n 15     return fn.apply(this, args.concat([rarg]))\n\
  \ 16   }\n 17 }\n18 \n19 function greet (me, you) {\n 20   return \"Hello, \" +\
  \ you + \", my name is \" + me\n 21 }\n 22 \n23 var heliosSaysHello = callFirst(greet,\
  \ 'Helios');\n 24 \n 25 heliosSaysHello('Eartha')\n 26   //=> 'Hello, Eartha, my\
  \ name is Helios'\n 27   \n 28 var sayHelloToCeline = callLast(greet, 'Celine');\n\
  \ 29 \n30 sayHelloToCeline('Eartha')\n 31   //=> 'Hello, Celine, my name is Eartha'\n\
  ```\n\n如上所述，我们的部分配方允许我们创建感知上下文函数的部分应用。如果我们想创建对象方法的部分应用，我们需要不同的配方。\n\n### 省略号和改进的部分应用\n\
  \nCoffeeScript 编程语言有一个非常有用的特性：如果方法的参数以尾随省略号编写，它会将一个参数列表收集到一个数组中。它可以以多种方式使用，CoffeeScript\
  \ 译器会进行一些模式匹配来处理这些内容，但 80% 的用法是在不使用 `arguments` 伪变量的情况下收集可数量的参数，而 19% 的用法是收集尾随参数列表。\n\
  \n以下是收集可数量参数和尾随参数的写法：\n\n```javascript\n1 callLeft = (fn, args...) ->\n2   (remainingArgs...)\
  \ ->\n3     fn.apply(this, args.concat(remainingArgs))\n```\n\n这些是非常实用的特性。这里是我们尝试编写自己的\
  \ mapper 函数的拙劣尝试：\n\n```javascript\n 1 mapper = (fn, elements...) ->\n 2   elements.map(fn)\n\
  \ 3 \n 4 mapper ((x) -> x*x), 1, 2, 3\n 5   #=> [1, 4, 9]\n 6 \n 7 squarer = callLeft\
  \ mapper, (x) -> x*x\n 8 \n 9 squarer 1, 2, 3\n10   #=> [1, 4, 9]\n```\n\nJavaScript\
  \ 不支持省略号（即 CoffeeScript 用于将参数收集到数组中的尾随点）。JavaScript 是一种函数式语言，因此这里有一个将尾随参数收集到数组中的函数配方：\n\
  \n```javascript\n 1 var __slice = Array.prototype.slice;\n 2 \n 3 function variadic\
  \ (fn) {\n 4   var fnLength = fn.length;\n 5 \n 6   if (fnLength < 1) {\n 7    \
  \ return fn;\n 8   }\n 9   else if (fnLength === 1)  {\n10     return function ()\
  \ {\n 11       return fn.call(\n 12         this, __slice.call(arguments, 0))\n\
  \ 13     }\n 14   }\n 15   else {\n 16     return function () {\n 17       var numberOfArgs\
  \ = arguments.length,\n 18           namedArgs = __slice.call(\n 19            \
  \ arguments, 0, fnLength - 1),\n 20           numberOfMissingNamedArgs = Math.max(\n\
  \ 21             fnLength - numberOfArgs - 1, 0),\n 22           argPadding = new\
  \ Array(numberOfMissingNamedArgs),\n 23           variadicArgs = __slice.call(\n\
  \ 24             arguments, fn.length - 1);\n 25 \n 26       return fn.apply(\n\
  \ 27         this, namedArgs\n 28               .concat(argPadding)\n 29       \
  \        .concat([variadicArgs]));\n 30     }\n 31   }\n 32 };\n 33 \n 34 unary\
  \ (first) {\n 35   return first\n 36 }\n 37 \n 38 unary('why', 'hello', 'there')\n\
  \ 39   //=> 'why'\n 40   \n 41 variadic(unary)('why', 'hello', 'there')\n 42   //=>\
  \ [ 'why', 'hello', 'there' ]\n 43   \n 44 function binary (first, rest) {\n 45\
  \   return [first, rest]\n 46 }\n 47 \n 48 binary('why', 'hello', 'there')\n*(注：由于用户提供的文本在此处结束了，我仅翻译到最后可见的函数)*\n\
  \n\n\n\n`tap` 是一个借自各种 Unix shell 命令的传统名称。它接收一个值并返回一个始终返回该值的函数，但如果你向它传递一个函数，它执行该函数以产生副作用。让我们来看看它如何作为一个“简易调试器”来工作：\n\
  \n```\n1 var drink = tap('espresso')(function (it) {\n2   console.log(\"Our drink\
  \ is\", it) \n3 });\n4 \n5 // 控制台输出 \"Our drink is 'espresso'\"\n```\n\n它可以很容易关闭：\n\
  \n```\n1 var drink = tap('espresso')();\n2 \n3 // 控制台不输出任何内容\n```\n\n像 [Underscore](http://underscorejs.org)\
  \ 这样的库使用了“未柯里化”版本的 `tap`：\n\n```\n1 var drink = _.tap('espresso', function () {\
  \ \n2   console.log(\"Our drink is\", this) \n3 });\n```\n\n让我们增强这个配方，使其双向工作：\n\n\
  ```\n 1 function tap (value, fn) {\n 2   if (fn === void 0) {\n 3     return curried\n\
  \ 4   }\n 5   else return curried(fn);\n 6   \n 7   function curried (fn) {\n 8\
  \     if (typeof(fn) === 'function') {\n 9       fn(value)\n10     }\n11     return\
  \ value\n12   }\n13 }\n```\n\n现在你可以这样写：\n\n```\n1 var drink = tap('espresso')(function\
  \ (it) { \n2   console.log(\"Our drink is\", it) \n3 });\n```\n\n或者：\n\n```\n1 var\
  \ drink = tap('espresso', function (it) { \n2   console.log(\"Our drink is\", it)\
  \ \n3 });\n```\n\n如果你希望它完全什么都不做，你可以写下面任意一种形式：\n\n```\n1 var drink = tap('espresso')();\n\
  ```\n\n或者：\n\n```\n1 var drink = tap('espresso', null);\n```\n\n`tap` 的作用不仅仅是作为调试辅助工具。它在处理对象和实例方法\
  \ 时也很有用。\n\n### 也许\n\n编程中的一个常见问题是检查 `null` 或 `undefined`（下文称为“无”，而包括 `0`、`[]` 和\
  \ `false` 在内的其他值称为“有”）。JavaScript 等语言并不强制要求特定变量或特定属性必须为“有”，因此编写程序时经常考虑可能为“无”的值。\n\
  \n这个配方涉及一种非常常见的模式：函数 `fn` 接收一个值作为参数，其设计行为如果参数为“无”，则什么都不做：\n\n```\n1 function isSomething\
  \ (value) {\n2   return value !== null && value !== void 0;\n3 }\n4 \n5 function\
  \ checksForSomething (value) {\n6   if (isSomething(value)) {\n7     // 函数的真实逻辑\n\
  8   }\n9 }\n```\n\n或者，该函数可能旨在处理任何值，但调用该函数的代码希望在给定“无”时模拟设计上什么都不做的行为：\n\n```\n1 var\
  \ something = isSomething(value) ? \n2   doesntCheckForSomething(value) : value;\n\
  ```\n\n自然，这有一个对应的配方，它是借自了 Haskell 的 [maybe monad](https://en.wikipedia.org/wiki/Monad_(functional_programming)#The_Maybe_monad)、Ruby\
  \ 的 [andand](https://github.com/raganwald/andand) 以及 CoffeeScript 的存在性方法调用：\n\n\
  ```\n 1 function maybe (fn) {\n 2   return function () {\n 3     var i;\n 4    \
  \ \n 5     if (arguments.length === 0) {\n 6       return\n 7     }\n 8     else\
  \ {\n 9       for (i = 0; i < arguments.length; ++i) {\n10         if (arguments[i]\
  \ == null) return\n11       }\n12       return fn.apply(this, arguments)\n13   \
  \  }\n14   }\n15 }\n```\n\n`maybe` 将检查“无”的逻辑简化为一个函数调用，如下：\n\n```\n1 var checksForSomething\
  \ = maybe(function (value) {\n2   // 函数的真实逻辑\n3 });\n```\n\n或者：\n\n```\n1 var something\
  \ = maybe(doesntCheckForSomething)(value);\n```\n\n作为额外，`maybe` 与实例方法配合得非常好，我们将在稍后讨论它们：\n\
  \n```\n1 function Model () {};\n2 \n3 Model.prototype.setSomething = maybe(function\
  \ (value) {\n4   this.something = value;\n5 });\n```\n\n如果某些代码尝试用“无”调用 `model.setSomething`，该操作将被跳过。\n\
  \n## 4 焕发生机的暂停：重新绑定与引用\n\n![咖啡好喝是不够的。它的制作和消费的每一个都应该反映咖啡的美感。](img/bezzera.jpg)\n\n\
  咖啡好喝是不够的。它的制作和消费的每一个都应该反映咖啡的美感。\n\n### 一个简单的问题\n\n考虑这段代码：\n\n```\n1 var x = 'June\
  \ 14, 1962',\n2     y = x;\n3     \n4 x === y\n5   //=> true\n```\n\n这显而易见。\n\n\
  这显而易见，是因为 `x` 是字符串 `June 14, 1962`，且 `y` 被赋值为相同的字符串。因此 `x === y` 求值结果为 `true`。\n\
  \n这显而易见，是因为 `x` 是字符串 `June 14, 1962`，且 `y` 被赋值为相同的字符串。\n\n```\n1 var x = 'June 14,\
  \ 1962',\n2     y = x;\n3     \n4 x === y\n5   //=> true\n```\n\n### 参数与数组\n\n在\
  \ JavaScript 中，数组是对象。这意味着你可以向它们添加属性，但这通常不是一个好主意。\n\n```javascript\n1 var a = [1,\
  \ 2, 3];\n2 a.foo = 'bar';\n3 console.log(a.length); // 3\n```\n\n`length` 属性不会自动更新。\n\
  \nJavaScript 中的数组是特殊类型的对象。它们有一个 `length` 属性，可以自动跟踪元素的数量。\n\n```javascript\nvar a\
  \ = [1, 2, 3];\na.push(4);\nconsole.log(a.length); // 4\n```\n\n（注：此处原文似乎存在大量重复或未翻译的段落，已根据指令“不要重复输出原文”对逻辑进行了整理，确保翻译通顺）\n\
  \n`length` 属性不会自动更新。\n\nJavaScript 中的数组是特殊类型的对象。它们有一个 `length` 属性，可以自动跟踪元素的数量。\n\
  \n```javascript\nvar a = [1, 2, 3];\na.push(4);\nconsole.log(a.length); // 4\n```\n\
