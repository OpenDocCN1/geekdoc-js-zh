  \n## 嘿，我有一个利用这个赚钱的好办法……\n\n去干吧，你可以自由对作品进行商业用途。例如，你可以在你的网站上托管它并通过广告盈利，或者编写一个 JS 工具并将书籍作为帮助内容的一部分。\n\
  \n这些都没问题，只需遵循[许可条款](http://creativecommons.org/licenses/by-sa/3.0/deed.en_US \"\
  知识共享署名-相同共享 3.0 国际许可协议)。在技术上，在 LeanPub 上创建一个完全相同的书籍副本是可能的。我不禁止这种活动，但我从个人角度请求你，问问自己是否可以做得更好，例如通过添加你自己的注释、扩展和评论来增加价值。我很想看到一个“注释版\
  \ JavaScript Allongé”。\n\n我也很想看到译本、大字版或任何能为世界带来新事物的东西。很多人要求纸质版。谁会是第一个在 `lulu.com`\
  \ 上开店的人？\n\n## 我发现了一个拼写错误！如何告诉你？\n\n我的邮箱收件箱是个灾难区，所以让我们把书当作开源一样对待。按照我的偏好顺序，你应该：\n\
  \n1. 创建一个 [issue](https://github.com/raganwald/javascript-allonge/issues)，fork [该仓库](https://github.com/raganwald/javascript-allonge/)，修复问题，然后向我发送一个\
  \ [pull request](https://github.com/raganwald/javascript-allonge/pulls)。（最好！）\n\n\
  2. fork [该仓库](https://github.com/raganwald/javascript-allonge/)，修复到你满意，然后向我发送一个\
  \ [pull request](https://github.com/raganwald/javascript-allonge/pulls)。（更好！）\n\n\
  3. 创建一个 [issue](https://github.com/raganwald/javascript-allonge/issues)。（可以。）\n\n\
  谢谢！\n\n## 如何运行示例\n\n如果你按照 [nodejs.org](http://nodejs.org/) 说明安装 NodeJS 和 JavaScript，你只需在命令行中输入\
  \ `node` 即可运行一个交互式的 JavaScript [REPL](https://en.wikipedia.org/wiki/REPL \"读取-求值-打印循环\"\
  )。这就是书中示例的测试方式，也是许多程序员将会做的。\n\n在 OS X 上，你可以选择从命令行运行 Safaris 的 JavaScript 引擎，或者安装\
  \ TextMate 扩展包。我们没有使用这种方法来测试示例，[请自担风险](http://metaskills.net/2010/07/09/interactive-javascript-console-with-textmate/)。但玩得开心！\n\
  \n几乎所有的浏览器都有作为 JavaScript [REPL](https://en.wikipedia.org/wiki/REPL \"读取-求值-打印循环\"\
  ) 的机制，允许你将 JavaScript 表达式输入调试控制台。\n\n## 谢谢！\n\n### Daniel Friedman 和 Matthias Felleisen\n\
