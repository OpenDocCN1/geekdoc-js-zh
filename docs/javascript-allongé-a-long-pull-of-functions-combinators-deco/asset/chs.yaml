  \ `this` 而不是 `context`！↩︎\n\n30. 足够令人沮丧，坦率地说！↩︎\n\n31. 由于我们目前为止展示的 JavaScript 是计算完备的（https://en.wikipedia.org/wiki/Turing_completeness\
  \ “通用性与图灵完备”可以使用现有功能执行任何计算。因此，理论上不需要任何语言特性；如果我们需要宏、延续、泛型函数、静态类型或其他任何功能，我们可以自己实现（https://en.wikipedia.org/wiki/Greenspun's）。但在实践中，这样做是有\
  \ bug 的、低效，并给我们的开发者带来了巨大的挑战。↩︎\n\n32. 对于许多程序员来说，动态关系和拷贝机制之间的区别细微到不必担心。然而，它使得许多动态修改成为可能。↩︎\n\
