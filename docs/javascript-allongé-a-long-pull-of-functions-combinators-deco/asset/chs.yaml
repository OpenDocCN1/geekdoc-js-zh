  \nJavaScript 有一个严格维护的属性：当一个值——任何值——被作为参数传递给函数时，绑定在环境中的值必须与原始值相同。\n\n我们说过 JavaScript\
  \ 将名称绑定到值，但我们没有说将名称绑定到值意味着什么。现在我们可以详细说明：当 JavaScript 将一个值类型绑定到一个名称上时，它会创建该值的副本并将副本放在环境中。正如你所记得的，字符串和数字等值类型如果内容相同，它们彼此就是相等的。因此\
  \ JavaScript 可以根据需要创建任意数量的字符串、数字或布尔值的副本。\n\n引用类型呢？JavaScript 不会在任何环境中放置引用值的副本。JavaScript\
  \ 将引用类型的 `references`（引用）放在环境中，当需要使用该值时，JavaScript 使用引用来获取原始值。\n\n由于许多引用可以共享同一个值，而且\
  \ JavaScript 将引用作为参数传递，可以说 JavaScript 实现了“共享传递”（call by sharing）语义。共享传递通常被理解为值传递（call\
  \ by value）的一种特化，它解释了为什么某些值被称为值类型，而其他值被称为引用类型。\n\n到此，我们准备好查看 `closures`（闭包）了。当我们把值类型、引用类型、参数和闭包的知识结合起来，我们将理解为什么无论你应用什么参数，这个函数始终求值为\
  \ `true`：\n\n```\n1 function (value) {\n2   return (function (copy) {\n3     return\
  \ copy === value\n4   })(value)\n5 }\n```\n\n### 闭包与作用域\n\n是时候看看函数内部的函数是如何工作的了：\n\
  \n```\n1 (function (x) {\n2   return function (y) {\n3     return x\n4   }\n5 })(1)(2)\n\
  6   //=> 1\n```\n\n首先，让我们使用上面学到的知识。给定 `(some function)(some argument)`，我们知道我们将函数应用于参数，创建一个环境，将参数的值绑定到名称上，并求值函数的表达式。所以我们先对这段代码进行操作：\n\
  \n```\n1 (function (x) {\n2   return function (y) {\n3     return x\n4   }\n5 })(1)\n\
  6   //=> [Function]\n```\n\n签名为 `function (x) ...` 的函数的环境变为 `{x: 1, ...}`，结果是一个函数。这个函数：\n\
  \n```\n1 (function (x) {\n2   return function (y) {\n3     return x\n4   }\n5 })(1)\n\
  ```\n\n（由于之前的生成出现了异常，此处不再重复后续的段落，以确保原文已完整翻译。）\n\n\n\n\n从这里我们学到了一点：纯函数可以包含闭包。\n\n\
  | ![exercise](img/leanpub_pencil.png) | 如果纯函数可以包含闭包，那么闭包可以包含纯函数吗？仅使用我们目前所学的知识，尝试组合出一个包含纯函数的闭包。如果你无法做，，请给出你认为这不可行的理由。\
  \ |\n\n纯函数始终意味着相同的结果，因为它们所有的“输入”都由其参数完全定义。闭包并非如此。如果向你展示这个纯函数 `function (x, y) {\
  \ return x + y }`，我们确切知道它对 `(2, 2)` 做了什么。但这个闭包呢：`function (y) { return x + y }`？在不理解求值自由变量\
  \ `x` 的魔法机制的情况下，我们无法判断它对参数 `(2)` 会做什么。\n\n### 它始终是环境\n\n为了理解闭包是如何被求值的，我们需要重新回顾环境（environments）。正如我们之前所说，所有函数都与一个环境相关。我们在描述环境时还进行了一些模糊化处理。还记得我们说过\
  \ `(function (x) { return (function (y) { return x }) })(1)` 的环境是 `{x: 1, ...}`，而\
  \ `(function (y) { return x })(2)` 的环境是 `{y: 2, ...}` 吗？让我们填补空白吧！\n\n`(function\
  \ (y) { return x })(2)` 的环境*实际上*是 `{y: 2, '..': {x: 1, ...}}`。`'..'` 意味着类似于“父级”、“包围”或“超环境”。它是\
  \ `function (x) ...` 的环境，因为函数 `function (y) { return x }` 位于 `function (x) ...`\
  \ 的体内部。因此，每当函数被应用参数时，它的环境始终包含对其父级环境的引用。\n\n现在你可以猜到我们如何在环境 `{y: 2, '..': {x: 1, ...}}`\
  \ 中求值 `(function (y) { return x })(2)` 了。变量 `x` 不在 `function (y) ...` 的直接环境中，但它在其父级环境中，所以它的求值为\
  \ `1`，这就是 `(function (y) { return x })(2)` 返回的结果，尽管它最终忽略了自己的自己的参数。\n\n`function\
  \ (x) { return x }` 被称为 I 组合子或恒等函数。`function (x) { return (function (y) { return\
  \ x }) }` 被称为 K 组合子或 Kestrel（隼）。有些人对此非常兴奋，甚至为它们写了整本书，有些非常[优秀](http://www.amzn.com/0192801422?tag=raganwald001-2)，有些——我该怎么说呢——如果你使用\
  \ Ruby，它们就很有[趣](https://leanpub.com/combinators \"Kestrels, Quirky Birds, and Hopeless\
  \ Egocentricity\")。\n\n函数也可以有祖父级：\n\n```\n1 function (x) {\n2   return function\
  \ (y) {\n3     return function (z) {\n4       return x + y + z\n5     }\n6   }\n\
  7 }\n```\n\n这个函数的作用与下面的代码非常相同：\n\n```\n1 function (x, y, z) {\n2   return x + y\
  \ + z\n3 }\n```\n\n只是你调用它时用的是 `(1)(2)(3)` 而不是 `(1, 2, 3)`。另一个大区别是，你可以用 `(1)` 调用它并返回一个函数，稍后可以用\
  \ `(2)(3)` 调用它。\n\n第一个函数是对第二个函数进行[柯里化](https://en.wikipedia.org/wiki/Currying) 后的结果。用部分参数调用柯里化函数有时被称为[部分应用](https://en.wikipedia.org/wiki/Partial_application)。某些编程语言会自动对函数进行柯里化和部分求值，而不需要手动嵌套。\n\
  \n### 来自影子星球的变量\n\n当变量与祖先环境的变量同名时，会发生有趣的事情。考虑：\n\n```\n1 function (x) {\n2   return\
  \ function (x, y) {\n3     return x + y\n4   }\n5 }\n```\n\n函数 `function (x, y)\
  \ { return x + y }` 是一个纯函数，因为它的 `x` 定义在自己的环境中。尽管它的父级也定义了一个 `x`，但在求值 `x + y` 时它被忽略了。JavaScript\
  \ 总是从函数的自己的环境开始查找，然后逐个查找父级环境，直到找到为止。同样的情况也适用于：\n\n```\n1 function (x) {\n2   return\
  \ function (x, y) {\n3     return function (w, z) {\n4       return function (w)\
  \ {\n5         return x + y + z\n6       }\n7     }\n8   }\n9 }\n```\n\n求值 `x +\
  \ y + z` 时，JavaScript 在祖父作用域找到 `x` 和 `y`，在父作用域找到 `z`。曾祖父作用域中的 `x` 被忽略，两个 `w` 也同样被忽略。当变量与祖先环境的绑定同名时，被称为它*遮蔽*（shadow）了祖先。\n\
  \n这通常是一件好事。\n\n先有鸡还是先有蛋？\n\n纯函数和闭包的这种行为产生了许多后果，可以被利用来编写软件。\n\n\n\n\nJavaScript 程序员经常使用编写一个表示函数的表达式，并立即将其应用于参数的思路。为了解释这种模式，Ben\
  \ Alman 将其命名为[立即调用函数表达式](http://www.benalman.com/news/2010/11/immediately-invoked-function-expression/)，通常缩写为“IIFE”。正如我们等将看到的，IIFE\
  \ 并不一定需要参数：\n\n```\n1 (function () {\n2   // ... 在此处执行某些操作...\n3 })();\n```\n\n\
  当一个 IIFE 将值绑定到名称上时（就像我们上面使用 `Pi` 那样），老派的（retro-grouch）程序员通常称之为“let”。令人混淆的是，JavaScript\
  \ 的后续版本也支持一个 `let` 关键字，它具有类似的绑定行为。\n\n## var\n\n使用 IIFE 来绑定名称非常有效，但只有受虐狂才会在 JavaScript\
  \ 中以这种方式编写程序。除了多余的字符外，它还存在一个根本性的语义问题：名称 `Pi` 与我们绑定到它的值 `3.14159265` 之间存在着巨大的视觉距离。它们应该更近一些。还有其他方法吗？\n\
  \n是的。\n\n编写我们的“周长”函数的另一种方法是将 `Pi` 与直径参数一起传递，如下所示：\n\n```\n1 function (diameter,\
  \ Pi) {\n2   return diameter * Pi\n3 }\n```\n\n你可以像这样使用它：\n\n```\n1 (function (diameter,\
  \ Pi) {\n2   return diameter * Pi\n3 })(2, 3.14159265)\n4   //=> 6.2831853\n```\n\
  \n这与我们上面的示例不同之处在于它只有一个环境，而不是两个。我们在环境中有一个表示普通参数的绑定，另一个是表示我们的“常量”。这样效率更高，而且这几乎就是我们一直以来想要的：一种将\
  \ `3.14159265` 绑定到可读名称的方法。\n\nJavaScript 给了我们一种实现该点的方法，即 `var` 关键字。我们将在未来的章节中学习更多关于\
  \ `var` 的知识，但这里有你可以使用 `var` 执行的最重要的事情：\n\n```\n1 function (diameter) {\n2   var\
  \ Pi = 3.14159265;\n3 \n4   return diameter * Pi\n5 }\n```\n\n`var` 关键字在当前函数的环境中引入了一个或多个绑定。它的工作方式正如我们所希望的那样：\n\
  \n```\n1 (function (diameter) {\n2   var Pi = 3.14159265;\n3 \n4   return diameter\
  \ * Pi\n5 })(2)\n6   //=> 6.2831853\n```\n\n你可以绑定任何表达式。函数是表达式，所以你可以绑定辅助函数：\n\n```\n\
  1 function (d) {\n2   var calc = function (diameter) {\n3     var Pi = 3.14159265;\n\
  4 \n5     return diameter * Pi\n6   };\n7 \n8   return \"The circumference is \"\
  \ + calc(d)\n9 }\n```\n\n注意 `calc(d)` 吗？这强调了我们所说的：如果你有一个求值结果为函数的表达式，你就用 `()` 来调用它。绑定到函数的名称是一个求值结果为函数的有效表达式。如此重要的思想——为函数命名——竟然可以用寥几句话解释解释。这强调了\
  \ JavaScript 真正正确的一点：函数是“一等公民”。函数是值，可以像任何其他值一样绑定到名称上、作为参数传递、从其他函数返回，反之亦然。\n\n你可以通过逗号隔开它们来绑定多个名称-值对。为了可读性，大多数人每行放置一个绑定：\n\
  \n```\n1 function (d) {\n2   var Pi   = 3.14119265,\n3       calc = function (diameter)\
  \ {\n4         return diameter * Pi\n5       };\n6   return \"The circumference\
  \ is \" + calc(d)\n7 }\n```\n\n这些示例使用 `var` 关键字在与我们的函数相同的环境中绑定名称。如果我们想在函数的一部分绑定某些名称，也可以使用\
  \ IIFE 创建一个新的作用域：\n\n```\n1 function foobar () {\n2 \n3   // 在没有 foo 或 bar 的情况下执行某些操作\n\
  4 \n5   (function () {\n6     var foo = 'foo',\n7         bar = 'bar';\n8 \n9  \
  \   // ... 使用 foo 和 bar 执行某些操作\n10   })();\n11 \n12   // 在没有 foo 或 bar 的情况下执行其他操作\n\
  13 }\n```\n\n## 命名函数\n\n让我们直接进入正题。这段代码没有命名函数：\n\n```\n1 var repeat = function (str)\
  \ {\n2   return str + str\n3 };\n```\n\n它没有将函数命名为“repeat”，原因与 `var answer = 42`\
  \ 没有命名数字 `42` 相同。那段代码将一个匿名函数绑定到环境中的一个名称上，但函数本身仍然是匿名的。\n\nJavaScript 确实有命名函数的语法，它看起来如下：\n\
  \n```\n1 var bindingName = function actualName () {\n2   //...\n };\n```\n\n在这个表达式中，`bindingName`\
  \ 是环境中的名称，但 `actualName` 是函数的实际名称。这是一个具名函数表达式。这看起来可能很困惑，但请将绑定名称视为环境的属性，而不是函数本身。事实上，名称确实是一个属性：\n\
  \n```\n1 actualName.name\n2   => 'actualName'\n```\n\n在调试器中，当你查看调用堆栈时，如果函数是命名的，你就能看到它的名称；如果函数是匿名的，你就会看到\
  \ `anonymous`。这就是为什么为函数命名如此重要。这强调了 JavaScript 真正正确的一点：函数是“一等公民”。函数是值，可以像任何其他值一样绑定到名称上、作为参数传递、从其他函数返回，反之亦然。\n\
  \n\n\n\n```\n1 // function declarations should not happen inside of \n2 // a block\
  \ and/or be conditionally executed\n3 if (frobbishes.arePizzled()) {\n4   function\
  \ complainToFactory () {\n5     // ...\n6   }\n7 }\n```\n\n这种表达式最大的问题在于，它们在你的测试环境中可能运行良好，但在生产环境中的行为却不同。或者它们在今天运行方式正常，当\
  \ JavaScript 引擎更新（例如引入新的优化）时就会以另一种方式运行。\n\n另一个注意事项是，函数声明不能存在于`any`表达式内部，否则它就变成了函数表达式。所以这是一个函数声明：\n\
  \n```\n1 function trueDat () { return true }\n```\n\n但这个不是：\n\n```\n1 (function\
  \ trueDat () { return true })\n```\n\n括号使得它变成了一个表达式。\n\n# 组合器与函数装饰器\n\n## 高阶函数\n\
  \n正如我们所见，JavaScript 函数接受值作为参数并返回值。JavaScript 函数是值，因此 JavaScript 函数可以接受函数作为参数、返回函数，或者两者兼顾。泛而言之，一个接受函数作为参数或返回函数（或两者兼顾）的函数被称为“高阶”函数。\n\
  \n这里有一个非常简单的高阶函数，接受一个函数作为参数：\n\n```\n 1 function repeat (num, fn) {\n2   var i,\
  \ value;\n3   \n4   for (i = 1; i <= num; ++i)\n5     value = fn(i);\n6   \n7  \
  \ return value;\n8 }\n9 \n10 repeat(3, function () { \n11   console.log('Hello')\
  \ \n12 })\n13   //=>\n14     'Hello'\n15     'Hello'\n16     'Hello'\n17     undefined\n\
  ```\n\n高阶函数在*JavaScript Allongé*中占据主地位。但在继续之前，我们将讨论一些特定类型的高阶函数。\n\n## 组合器 (Combinators)\n\
  \n“combinator”（组合器）一词在数学中有一个精确的技术含义：\n\n> “组合器是一种高阶函数，它仅通过函数应用和早期定义的组合器从其参数定义结果。”–[Wikipedia](https://en.wikipedia.org/wiki/Combinatory_logic\
  \ \"组合逻辑\")\n\n如果我们在学习组合逻辑（Combinatorial Logic），我们将从最基础的组合器如 `S`、`K` 和 `I` 开始，逐步进到实用的组合器。我们将了解到基础组合器是以鸟命名的，这遵循了\
  \ Raymond Smullyan 的名著[嘲弄一只鸣鸣鸟](http://www.amazon.com/gp/product/B00A1P096Y/ref=as_li_ss_tl?ie=UTF8&camp=1789&creative=390957&creativeASIN=B00A1P096Y&linkCode=as2&tag=raganwald001-20)。\n\
  \n在本书中，我们将使用一个较宽松的“组合器”定义：仅接受函数作为参数并返回函数的高阶纯函数。我们不会严格限制在构建这些组合器时仅使用之前定义的组合器。\n\n\
  让我们从一个实用的组合器开始：大多数程序员称之为 `Compose`（组合），尽管逻辑学家称之为 `B` 组合器或“Bluebird”（蓝松鸟）。以下是典型的^(16)编程实现：\n\
  \n```\n1 function compose (a, b) {\n2   return function (c) {\n3     return a(b(c))\n\
  4   }\n5 }\n```\n\n假设我们有：\n\n```\n1 function addOne (number) {\n2   return number\
  \ + 1\n3 }\n4 \n5 function doubleOf (number) {\n6   return number * 2\n7 }\n```\n\
  \n使用 `compose`，在任何你需要写下\n\n```\n1 function doubleOfAddOne (number) {\n2   return\
  \ doubleOf(addOne(number))\n3 }\n```\n\n你也可以写成：\n\n```\n1 var doubleOfAddOne = compose(doubleOf,\
  \ addOne);\n```\n\n这当然只是许多示例中的一个。你将在阅读本书中的食谱时发现更多。虽然有些程序员认为“应该只有一种实现方式”，但在谨慎使用时，提供组合器以及使用大量的符号和关键字显式地写出内容具有某些优势。\n\
  \n## 关于组合器的平衡论述\n\n使用大量组合器的代码倾向于命名动词和副词（如 `doubleOf`、`addOne` 和 `compose`），同时避免语言关键字和名词名称（如\
  \ `number`）。因此，一种观点是：当你想要强调你在做什么以及它们是如何结合在一起的时，组合器是有用的；而当你想要强调你正在处理什么时，更显式的代码是有用的。\n\
  \n## 函数装饰器\n\n*函数装饰器*（function decorator）是一种高阶函数，它接受一个函数作为参数，返回另一个函数，且返回的函数是参数函数的变体。这里有一个装饰器的荒谬示例：\n\
  \n```\n1 function not (fn) {\n2   return function (argument) {\n3     return !fn(argument)\n\
  4   }\n5 }\n```\n\n所以，与其写 `!someFunction(42)`，你可以写 `not(someFunction)(42)`。几乎没有进展。但像\
  \ `compose` 一样，你可以写任何一种：\n\n```\n1 function something (x) {\n2   return x\n3 }\n\
  ```\n\n# 构建块\n\n当你观察函数时，JavaScript 的强大之处在于你可以做任何事。弱点在于你会这样做。\n\n## 组合 (Composition)\n\
  \n这些构建块中最基础的之一是*组合*：\n\n```\n1 function cookAndEat (food) {\n2   return eat(food))\n\
  3 }\n```\n\n就如此简单。当你将两个或多个函数链在一起时，你就在进行组合。你可以像我们在组合器与装饰器 中看到的那样通过显式代码来组合它们：\n\n\
  ```\n1 function compose (a, b) {\n2   return function (c) {\n3     return a(b(c))\n\
  4   }\n5 }\n6 \n7 var cookAndEat = compose(eat, cook);\n```\n\n如果只有这样组合就没有意义了。但正如许多模式一样，在适用的地方使用它只有\
  \ 20%的收益来自于组织代码以便能够各种方式组合。\n\n在食谱中，我们将查看一个名为 once 的装饰器：它确保函数只被执行一次。之后，它什么都不做。这对于确保某些副作用不会发生很有用。我们还将查看\
  \ maybe：它确保如果函数没有收到任何参数（如 `null` 或 `undefined`），它将什么都不做。\n\n当然，你不需要使用组合器来实现这些想法，你可以使用\
  \ `if` 语句。但 `once` 和 `maybe` 是组合的，所以你可以根据需要将它们链在一起：\n\n```\n1 function actuallyTransfer(from,\
  \ to, amount) {\n2   // do something\n3 }\n4 \n5 invokeTransfer = once(maybe(actuallyTransfer)));\n\
  ```\n\n## 部分应用 (Partial Application)\n\n另一个基础构建块是*部分应用*。当一个函数接受多个参数时，我们通过对所有参数求值来“应用”函数，产生一个值。但如果我们只提供部分参数呢？在这种情况下，我们无法获得最终值，但可以获得一个代表我们应用一部分的函数。\n\
  \n用代码表示比用语言更容易。[Underscore](http://underscorejs.org) 库提供了一个名为 *map* 的高阶函数。^(17)\
  \ 它将另一个函数应用到数组的每个元素，如下：\n\n\n\n\n\n```\n1 _.map([1, 2, 3], function (n) { return\
  \ n * n })\n2   //=> [1, 4, 9]\n```\n\n这段代码通过将函数 `function (n) { return n * n }`\
  \ 作为第二个参数，实现了对 `map` 函数的部分应用（partial application）：\n\n```\n1 function squareAll\
  \ (array) {\n2   return _.map(array, function (n) { return n * n })\n3 }\n```\n\n\
  生成的函数——`squareAll`——仍然是 `map` 函数，只是我们已经应用了它的两个参数中的一个。`squareAll` 很好用，但为什么我们每次想对一个\
  \ `map` 函数进行部分应用时，都要手写一个函数呢？我们可以再往上抽象一层层。`mapWith` 接收任何函数作为参数，并返回一个部分应用的 `map` 函数。\n\
  \n```\n 1 function mapWith (fn) {\n 2   return function (array) {\n 3     return\
  \ _.map(array, fn)\n 4   }\n 5 }\n 6\n 7 var squareAll = mapWith(function (n) {\
  \ return n * n });\n 8\n \n 9 squareAll([1, 2, 3])\n110   //=> [1, 4, 9]\n```\n\n\
  我们将在食谱 中再次讨论 `mapWith`。重要的是看到部分应用与组合（composition）是正交的，它们可以很好地结合：\n\n```\n1 var safeSquareAll\
  \ = mapWith(maybe(function (n) { return n * n }));\n2\n3 safeSquareAll([1, null,\
  \ 2, 3])\n4   //=> [1, null, 4, 9]\n```\n\n我们通过 `compose` 组合器泛化了组合。部分应用也有一个组合器，我们将在\
  \ partial 食谱中看到。\n\n### 我还想要一些参数。再次。\n\n正如我们所讨论过的，当函数被应用于参数上（或被“调用”）时，JavaScript\
  \ 会将参数的值绑定到为函数执行时创建的环境中的函数参数名上。我们没有讨论的是，JavaScript 除了你放入参数列表的任何名称外，还会绑定一些“魔法”名称。\n\
  \n你永远不要尝试针对这些名称定义你自己的绑定。请始终将它们视为只读的。第一个被称为 `this`，它被绑定到被称为函数上下文的东西上。我们将在开始讨论对象和类时探索它。第二个非常有趣，它被称为\
  \ `arguments`，它最有趣的地方在于它包含一个传递给函数的参数列表：\n\n```\n1 function plus (a, b) {\n2   return\
  \ arguments[0] + arguments[1]\n3 }\n4\n5 plus(2,3)\n6   //=> 5\n```\n\n尽管 `arguments`\
  \ 看起来像一个数组，但它并不是数组：^(18)它更像是一个对象[^pojo]，恰好将某些值绑定到看起来像从零开始的整数的属性上：\n\n```\n1 function\
  \ args (a, b) {\n2   return arguments\n3 }\n4\n5 args(2,3)\n6   //=> { '0': 2, '1':\
  \ 3 }\n```\n\n`arguments` 总是包含传递给函数的所有参数，无论声明了多少个。因此，我们可以这样写 `plus`：\n\n```\n1 function\
  \ plus () {\n2   return arguments[0] + arguments[1]\n3 }\n4\n5 plus(2,3)\n6   //=>\
  \ 5\n```\n\n在讨论对象时，我们将深入讨论属性。这里关于 `arguments` 的一点说明：\n\n```\n1 function howMany\
  \ () {\n2   return arguments.length\n3 }\n4\n5 howMany()\n6   //=> 0\n7\n8 howMany('hello',\
  \ 'predators')\n10   //=> 2\n```\n\n`arguments` 绑定最常见的用途是构建可以接受可数量参数的函数。我们将在许多食谱中看到它的用法，从部分应用和省略号开始。\n\
  \n### 总结\n\n| 函数 |\n| :--- |\n| 函数是值，可以作为其他函数的一部分，以此此类推。 |\n| 函数是引用值。 |\n| 参数是通过共享传递的，这被称为“按值传递”（pass\
  \ by value）。 |\n| 函数体包含零或多个表达式。 |\n| 函数应用会评估 `return` 关键字返回的内容，或 `undefined`。 |\n\
  | 函数应用会创建一个作用域。作用域是嵌套且自由引用的（free over）。 |\n| `let` 是一种惯用法，我们创建一个函数并立即调用它，以便将值绑定到名称。\
  \ |\n| JavaScript 使用 `var` 在函数作用域内绑定变量。 |\n\n## 2 快速查表\n\n在食谱中，你可能会看到这里使用了一个或多个以下\
  \ JavaScript 结构，这里是一些简短的解释帮助你过关：\n\n#### apply and call\n\n函数通过 `()` 应用。但它们也有方法可以将它们应用于参数。在讨论函数上下文中时，我们会解释\
  \ `.call` 和 `.apply`，这里是一些例子：\n\n```\n1 function plus (a, b) {\n2   return a + b\n\
  3 }\n4\n5 plus(2, 3)\n6   //=> 5\n7\n8 plus.call(this, 2, 3)\n9   //=> 5\n10\n11\
  \ plus.apply(this, [2, 3])\n12   //=> 5\n```\n\n#### slice\n\n数组有一个 `.slice` 方法。`slice`\
  \ 返回一个通过接收者与其参数连接创建的数组。`arguments` 伪变量不是数组，但你可以这样使用 `.slice` 来获取全部或部分参数：\n\n```\n\
  1 Array.prototype.slice.call(arguments, 0)\n2   //=> 返回数组形式的参数。\n3\n4 function butFirst\
  \ () {\n5   return Array.prototype.slice.call(arguments, 1)\n6 }\n7\n8 butFirst('a',\
  \ 'b', 'c', 'd')\n9   //=> ['b', 'c', 'd']\n```\n\n为了简单和提高速度，`slice` 通常绑定到一个局部变量：\n\
  \n```\n1 var __slice = Array.prototype.slice;\n2\n3 function butFirst () {\n4  \
  \ return __slice.call(arguments, 1)\n5 }\n```\n\n甚至：\n\n```javascript\n1 var __slice\
  \ = Array.prototype.slice;\n2\n3 function slice (list, from, to) {\n4   return __slice.call(list,\
  \ from, to)\n5 }\n6\n7 function butFirst () {\n8   return __slice.call(arguments,\
  \ 1)\n9 }\n```\n\n#### concat\n\n数组有另一个有用的方法 `.concat`。`concat` 返回一个通过接收者与其参数连接的数组：\n\
  \n```\n1 [1, 2, 3].concat([2, 1])\n2   //=> [1, 2, 3, 2, 1]\n```\n\n#### function\
  \ lengths\n\n函数有一个 `.length` 属性，计算声明的参数个数：\n\n```\n1 function (a, b, c) { return\
  \ a + b + c }.length\n2   //=> 3\n```\n\n## 3 基础函数的食谱\n\n![在组合食材之前，从那些如此纯净的实现开始。](img/mirage.jpg)\n\
  \n在组合食材之前，从那些如此纯净的实现开始。\n\n在看了基础纯函数和闭包之后，我们将看到一些以以返回函数的函数为前提的实用食谱。\n\n### 免责声明\n\
  \n食谱是为了实用性而编写的，它们的实现可能会引入在此为止未讨论过的 JavaScript 特性，例如方法和/或原型。每个食谱的整体*用法*将符合到目前讨论的语言精神，即使实现可能不符合。\n\
  \n### 部分应用\n\n在构建块 中，我们讨论了部分应用，但我们没有为它编写通用的食谱。这是一个常见的工具，许多库都提供了某种形式的部分应用工具。你可以在这里找到示例。\n\
  \n\n\n\n这两个配方用于快速、简单地应用单个参数，即最左侧或最右侧的参数。如果你想绑定多个参数，或者想在参数列表中留一个“空隙”，将需要使用泛化部分配方，或者反复应用参数。它是上下文无关的。\n\
  \n```javascript\n 1 var __slice = Array.prototype.slice;\n 2 \n 3 function callFirst\
  \ (fn, larg) {\n 4   return function () {\n 5     var args = __slice.call(arguments,\
  \ 0);\n 6     \n 7     return fn.apply(this, [larg].concat(args))\n 8   }\n 9 }\n\
  10 \n11 function callLast (fn, rarg) {\n 12   return function () {\n 13     var\
  \ args = __slice.call(arguments, 0);\n 14     \n 15     return fn.apply(this, args.concat([rarg]))\n\
  \ 16   }\n 17 }\n18 \n19 function greet (me, you) {\n 20   return \"Hello, \" +\
  \ you + \", my name is \" + me\n 21 }\n 22 \n23 var heliosSaysHello = callFirst(greet,\
  \ 'Helios');\n 24 \n 25 heliosSaysHello('Eartha')\n 26   //=> 'Hello, Eartha, my\
  \ name is Helios'\n 27   \n 28 var sayHelloToCeline = callLast(greet, 'Celine');\n\
  \ 29 \n30 sayHelloToCeline('Eartha')\n 31   //=> 'Hello, Celine, my name is Eartha'\n\
  ```\n\n如上所述，我们的部分配方允许我们创建感知函数的部分应用。如果我们想创建对象方法的部分应用，我们需要不同的配方。\n\n### 省略号和改进的部分应用\n\
  \nCoffeeScript 编程语言有一个非常有用的特性：如果方法的参数以尾随省略号编写，它会将参数列表收集到一个数组中。它可以以多种方式使用，CoffeeScript\
  \ 译器会进行一些模式匹配来处理这些，但 80% 的用法是在不使用 `arguments` 伪变量的情况下收集数量数量的参数，而 19% 的用法是收集尾随参数列表。\n\
  \n以下是收集可数量参数和尾随参数的写法：\n\n```javascript\n1 callLeft = (fn, args...) ->\n2   (remainingArgs...)\
  \ ->\n3     fn.apply(this, args.concat(remainingArgs))\n```\n\n这些是非常实用的特性。这里是我们尝试编写自己的\
  \ mapper 函数的拙劣尝试：\n\n```javascript\n 1 mapper = (fn, elements...) ->\n 2   elements.map(fn)\n\
  \ 3 \n 4 mapper ((x) -> x*x), 1, 2, 3\n 5   #=> [1, 4, 9]\n 6 \n 7 squarer = callLeft\
  \ mapper, (x) -> x*x\n 8 \n 9 squarer 1, 2, 3\n10   #=> [1, 4, 9]\n```\n\nJavaScript\
