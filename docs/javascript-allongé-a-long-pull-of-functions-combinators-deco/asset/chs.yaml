  \ (value) {\n    return this.array[this.tail += 1] = value\n  },\n  pullHead: function\
  \ () {\n    var value;\n    if (!this.isEmpty()) {\n      value = this.array[this.head]\n\
  \      this.array[this.head] = void 0;\n      this.head += 1;\n      return value\n\
  \    }\n  },\n  isEmpty: function () {\n    return this.tail < this.head\n  }\n\
  });\n```\n\n在我们把这些部分连接起来之前，我们的 `Deque` 看起来是这样的：\n\n```javascript\nvar Dequeue =\
