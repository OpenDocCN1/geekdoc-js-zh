  \        .concat([variadicArgs]));\n 30     }\n 31   }\n 32 };\n 33 \n 34 unary\
  \ (first) {\n 35   return first\n 36 }\n 37 \n 38 unary('why', 'hello', 'there')\n\
  \ 39   //=> 'why'\n 40   \n 41 variadic(unary)('why', 'hello', 'there')\n 42   //=>\
