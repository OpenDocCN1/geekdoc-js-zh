  \   }\n6     else {\n7       return function (second) {\n8         return fn.call(this,\
  \ second, first);\n9       };\n10     };\n11   };\n12 };\n```\n\n现在你可以调用 `mapWith(fn,\
  \ list)` 或 `mapWith(fn)(list)`，随你喜欢。\n\n### 扩展\n\n通过向对象添加属性来“扩展”一个对象是非常常见的：\n\n\
  ```\n1 var inventory = {\n2   apples: 12,\n3   oranges: 12\n4 };\n5\n6 inventory.bananas\
  \ = 54;\n7 inventory.pears = 24;\n```\n\n将一个对象的属性添加到另一个对象的[浅拷贝] 也是常见的：\n\n```\n\
  1   for (var fruit in shipment) {\n2     inventory[fruit] = shipment[fruit]\n3 \
  \  }\n```\n\n这两个需求都可以通过这个 `extend` 的配方满足：\n\n```\n 1 var extend = variadic( function\
  \ (consumer, providers) {\n2   var key,\n3       i,\n4       provider;\n5   \n6\
  \   for (i = 0; i < providers.length; ++i) {\n7     provider = providers[i];\n8\
  \     for (key in provider) {\n9       if (provider.hasOwnProperty(key)) {\n10 \
  \        consumer[key] = provider[key]\n11       }\n12     }\n13   }\n14   return\
  \ consumer\n15 });\n```\n\n你可以通过扩展一个空对象来拷贝对象：\n\n```\n1 extend({}, {\n2   apples:\
  \ 12,\n3   oranges: 12\n4 })\n   //=> { apples: 12, oranges: 12 }\n```\n\n你可以用一个对象扩展另一个对象：\n\
  \n```\n 1 var inventory = {\n2   apples: 12,\n3   oranges: 12\n4 };\n5\n6 var shipment\
  \ = {\n7   bananas: 54,\n8   pears: 24\n9 }\n10 \n11 extend(inventory, shipment)\n\
  12   //=> { apples: 12,\n13   oranges: 12,\n14   bananas: 54,\n15   pears: 24 }\n\
  ```\n\n当我们讨论原型时，我们将使用 `extend` 来处理这个：\n\n```\n1 var Queue = () {\n2   array = [];\n\
  3   head = 0;\n4   tail = -1\n5 };\n6\n7 extend(Queue.prototype, {\n8   pushTail:\
  \ function (value) {\n9     array[tail] = value\n10    tail++\n11   },\n12   pullHead:\
  \ function () {\n13     if (isEmpty()) return null\n14     var value = array[head]\n\
  15     head++\n16     return value\n17   },\n18   isEmpty: function () {\n19   \
  \  return tail === -1\n20   }\n21 });\n```\n\n（注：由于原文文本在 `extend` 处存在明显的重复和截断，此处已根据逻辑进行了最齐和翻译对齐。）\n\
  \n\n\n\n\n> 在计算机科学中，信息隐藏（information hiding）是将计算机程序中最可能改变的设计决策进行隔离的原则，从而在设计决策发生变化时，保护程序的其他部分免受大量修改。这种保护通过提供一个稳定的接口来实现，保护程序的其余部分不受实现（最可能改变的细节）的影响。\n\
  \n> 换句话说法，信息隐藏是能够使用编程语言特性（如私有变量）或显式导出策略，防止类或软件组件的某些方面被其客户端访问的能力。\n\n> –[维基百科](https://en.wikipedia.org/wiki/Information_hiding\
  \ \"信息隐藏\")\n\n考虑一个[栈](https://en.wikipedia.org/wiki/Stack_ \"data_structure)数据结构。它有三个基本操作：向栈顶压入值（`push`）、从栈顶弹出一个值（`pop`）以及测试栈是否为空（`isEmpty`）。这三个操作就是稳定的接口。\n\
  \n许多栈使用一个数组来存储栈的内容。这是相对稳定的。你可以替换为链表，但在 JavaScript 中，数组是非常高效的。你可能需要一个索引，也可能不需要。你可以增大或缩小数组，也可以分配固定大小并使用索引来跟踪数组已使用量。跟踪列表头部的设计选择通常是由性能考虑驱动的。\n\
  \n如果你暴露了实现细节，例如是否存在索引，早晚会有某个程序员发现直接使用索引的用处。例如，她可能需要知道栈的大小。理想的选择是添加一个 `size` 函数来继续隐藏实现。但她急着使用，所以她直接读取了\
  \ `index`。现在她的代码与索引的存在耦合在了一起，因此如果我们想更改实现以动态增大或缩小数组，就会破坏她的代码。\n\n避免这种情况的方法是将数组和索引从其他代码中隐藏起来，只暴露我们认为是稳定的操作。当且当某人需要知道栈的大小时，我们会添加一个\
  \ `size` 函数并也将其暴露出来。\n\n隐藏信息（或“状态”）是允许我们限制软件组件之间耦合性的设计原则。\n\n#### 我们如何使用 JavaScript\
  \ 隐藏状态？\n\n我们已经接触了 JavaScript 的对象，并且很容易看出，对象可以用来模拟其他编程语言中（以不同称呼的）的记录（records）、结构体（structs）、帧（frames）或各类的东西。鉴于它们的元素是可变的，它们显然可以模拟状态。\n\
  \n给定一个持有我们状态（一个数组和一个索引）的对象，我们可以很容易地将这三个操作实现为函数。将函数与状态打包不需要任何特殊的“魔法”特性。JavaScript\
  \ 对象可以拥有任何类型的元素，包括函数：\n\n```\n 1 var stack = (function () {\n 2   var obj = {\n\
  \ 3     array: [],\n 4     index: -1,\n 5     push: function (value) {\n 6     \
  \  return obj.array[obj.index += 1] = value\n 7     },\n 8     pop: function ()\
  \ {\n 9       var value = obj.array[obj.index];\n10       obj.array[obj.index] =\
  \ void 0;\n11       if (obj.index >= 0) { \n12         obj.index -= 1 \n13     \
  \  }\n14       return value\n15     },\n16     isEmpty: function () {\n17      \
  \ return obj.index < 0\n18     }\n19   };\n20   \n21   return obj;\n22 })();\n23\
  \ \n24 stack.isEmpty()\n25   //=> true\n26 stack.push('hello')\n27   //=> 'hello'\n\
  28 stack.push('JavaScript')\n29  //=> 'JavaScript'\n30 stack.isEmpty()\n31   //=>\
  \ false\n32 stack.pop()\n33  //=> 'JavaScript'\n34 stack.pop()\n35   //=> 'hello'\n\
  36 stack.isEmpty()\n37   //=> true\n```\n\n#### 方法论\n\n在本文中，从“属于对象的函数”转向了“方法”。其他语言严格区分方法和函数，但在\
  \ JavaScript 中每个方法都是函数，但并非所有函数都是方法。\n\n本书的观点是，如果一个函数属于一个对象并某种方式与该对象交互，它就是该对象的方法。实现栈的操作函数都是栈的方法。\n\
  \n但这两个不是方法。尽管它们“属于”一个对象，但它们没有交互：\n\n```\n 1 {\n 2   min: function (x, y) {\n 3 \
  \    if (x < y) {\n 4       return x\n 5     }\n 6     else {\n 7       return y\n\
  \ 8     }\n 9   }\n10   max: function (x, y) {\n11     if (x > y) {\n12       return\
  \ x\n13     }\n14     else {\n15       return y\n16     }\n 17   }\n```\n\n####\
  \ 隐藏状态\n\n我们的栈将函数封装在一起，但它没有隐藏状态。“外部”代码可能会干扰它的数组或索引。那么我们如何隐藏这些呢？我们已经有了闭包，用用它吧：\n\n\
  ```\n 1 var stack = (function () {\n 2   var array = [],\n 3       index = -1;\n\
  \ 4       \n 5   return {\n 6     push: function (value) {\n 7       array[index\
  \ += 1] = value\n 8     },\n 9     pop: function () {\n10       var value = array[index];\n\
  11       if (index >= 0) {\n12         index -= 1\n13       }\n14       return value\n\
  15     },\n16     isEmpty: function () {\n17       return index < 0\n18     }\n\
  19   }\n20 })();\n21 \n22 stack.isEmpty()\n23   //=> true\n24 stack.push('hello')\n\
  25   //=> 'hello'\n26 stack.push('JavaScript')\n27   //=> 'JavaScript'\n28 stack.isEmpty()\n\
  29   //=> false\n30 stack.pop()\n31  //=> 'JavaScript'\n32 stack.pop()\n33  //=>\
  \ 'hello'\n34 stack.isEmpty()\n35   //=> true\n```\n\n隐藏信息（或“状态”）是允许我们限制软件组件之间耦合性的设计原则。\n\
  \n![咖啡生长](img/coffee-trees-1000)\n\n咖啡生长\n\n我们不想在每次需要栈时都重复这段代码，所以让我们自己做一个“栈制造器”。诱是将是将内容封装在一个函数里：\n\
  \n```\n 1 var StackMaker = (function () {\n 2   return (function () {\n 3     var\
  \ array = [],\n 4         index = -1;\n 5       \n 6     return {\n 7       push:\
  \ function (value) {\n 8         array[index += 1] = value\n 9     },\n10     pop:\
  \ function () {\n11       var value = array[index];\n12       if (index >= 0) {\n\
  13         index -= 1\n14       }\n15       return value\n16     },\n17     isEmpty:\
  \ function () {\n18       return index < 0\n19     }\n20   }\n21   })()\n22 };\n\
  ```\n\n但有一种更简单的方法 :-)\n\n```\n 1 var StackMaker = (function () {\n 2   var array\
  \ = [],\n 3       index = -1;\n 4       \n 5   return {\n 6     push: function (value)\
  \ {\n 7       array[index += 1] = value\n 8     },\n 9     pop: function () {\n\
  10       var value = array[index];\n11       if (index >= 0) {\n12         index\
  \ -= 1\n13       }\n14       return value\n15     },\n16     isEmpty: function ()\
  \ {\n17       return index < 0\n18     }\n19   }\n20 })();\n21 \n22 stack = StackMaker()\n\
  ```\n\n现在我们可以自由地创建栈，并且隐藏了它们的内部数据元素。我们有了方法和封装，并且我们是用 JavaScript 的基础函数和对象构建了它们。在实例与类中，我们将查看\
  \ JavaScript 对类对象编程的支持以及函数为这里带来的一些用法。\n\n#### 封装是“面向对象”的吗？\n\n我们构建了具有隐藏内部状态和“方法”的东西，完全不需要特殊的\
  \ `def` 或 `private` 关键字。请注意，我们还没有包含各种复杂的机制来支持继承、混入（mixins）以及其他讨论互联网上“唯一真实的面向对象风格”本质的机会。\n\
  \n尽管如此，经验丰富的程序员重复的关键教训（尽管这往往充耳不闻）是[组合优于继承](http://www.c2.com/cgi/wiki?CompositionInsteadOfInheritance)。所以也许我们并没有错过什么。\n\
  \n### 组合与扩展\n\n#### 组合\n\n\n\n\n一种非常基础的做法是由更小的组件来构建组件。将一个组件拆分为更小组件的选择被称为`重构`([chap14.xhtml_refactoring])。\n\
  \n在 JavaScript 中构建更小组件最简单且容易的方法是：每个组件是一个值，可以将它们放入单个对象中，或者通过闭包封装。\n\n这是一个由两个栈（见封装）支持撤销和重做什么的抽象“模型”，使用了普通的\
  \ JavaScript 对象（Plain Old Object）：\n\n```javascript\n1 // 辅助函数\n2 //\n3 // 在生产环境中，考虑如何处理\n\
  4 // 深度拷贝和键\n5 var shallowCopy = function (source) {\n6   var dest = {},\n7    \
  \   key;\n8       \n9   for (key in source) {\n10     dest[key] = source[key]\n\
  11   }\n12   return dest\n13 };\n14 \n15 // 模型构造器\n16 var ModelMaker = function\
  \ (initialAttributes) {\n17   var attributes = shallowCopy(initialAttributes ||\
  \ {}), \n18       undoStack = StackMaker(), \n19       redoStack = StackMaker(),\n\
  20       obj = {\n21         set: function (attrsToSet) {\n22           var key;\n\
  23           \n24           undoStack.push(shallowCopy(attributes));\n25       \
  \    if (!redoStack.isEmpty()) {\n26             redoStack = StackMaker()\n27  \
  \         }\n28           for (key in (attrsToSet || {})) {\n29             attributes[key]\
  \ = attrsToSet[key]\n30           }\n31           return obj\n32         },\n33\
  \         undo: function () {\n34           if (!undoStack.isEmpty()) {\n35    \
  \         redoStack.push(shallowCopy(attributes));\n36             attributes =\
  \ undoStack.pop()\n37           }\n38           return obj\n39         },\n40  \
  \       redo: function () {\n41           if (!redoStack.isEmpty()) {\n42      \
  \       undoStack.push(shallowCopy(attributes));\n43             attributes = redoStack.pop()\n\
  44           }\n45           return obj\n46         },\n47         get: function\
  \ (key) {\n48           return attributes(key)\n49         },\n50         has: function\
  \ (key) {\n51           return attributes.hasOwnProperty(key)\n52         },\n53\
  \         attributes: function () {\n54           shallowCopy(attributes)\n55  \
  \       }\n56       };\n57     return obj\n58   };\n```\n\n用于封装的技术与组合配合得很好。在这种情况下，我们有一个隐藏了其属性存储以及由撤销栈和重做栈组成的实现。\n\
  \n### 扩展\n\n许多人认为的基础做法是`扩展`一个实现。这意味着他们希望通过向现有的数据结构添加新的操作和语义来定义一个新的数据结构。\n\n考虑一个[队列](http://duckduckgo.com/Queue_data_structure)：\n\
  \n```javascript\n1 var QueueMaker = function () {\n2   var array = [], \n3     \
  \  head = 0, \n4       tail = -1;\n5   return {\n6     pushTail: function (value)\
  \ {\n7       return array[tail += 1] = value\n8     },\n9     pullHead: function\
  \ () {\n10       var value;\n11       \n12       if (tail >= head) {\n13       \
  \  value = array[head];\n14         array[head] = void 0;\n15         head += 1;\n\
  16         return value\n17       }\n18     },\n19     isEmpty: function () {\n\
  20       return tail < head\n21     }\n22   }\n23 };\n```\n\n现在，我们希望通过向我们的队列添加 `pullTail`\
  \ 和 `pushHead` 操作来创建一个[双端队列](https://en.wikipedia.org/wiki/Double-ended_queue_Double-ended_queue)([chap14.xhtml_fn-wasa])不幸的是，封装阻止了我们添加与隐藏数据结构交互的操作。\n\
  \n这并不令人意外：封装的整个目的在于创建一个不透明的数据结构，只能通过其公共接口进行操作。封装与扩展的设计目标之间始终存在紧张关系。\n\n让我们“取消封装”我们的队列：\n\
  \n```javascript\n1 var QueueMaker = function () {\n2   var queue = {\n3     array:\
  \ [], \n4     head = 0, \n5     tail = -1;\n6   return {\n7     pushTail: function\
  \ (value) {\n8       return array[tail += 1] = value\n9     },\n10     pullHead:\
  \ function () {\n11       var value;\n12       \n13       if (tail >= head) {\n\
  14         value = array[head];\n15         array[head] = void 0;\n16         head\
  \ += 1;\n17         return value\n18       }\n19     },\n20     isEmpty: function\
  \ () {\n21       return tail < head\n22     }\n23   }\n24 };\n```\n\n\n\n```javascript\n\
  var AmnesiacQueueMaker = function () {\n  return {\n    array: [], \n    head: 0,\
  \ \n    tail: -1,\n    pushTail: function (myself, value) {\n      return myself.array[myself.tail\
  \ += 1] = value\n    },\n    pullHead: function (myself) {\n      var value;\n \
  \     if (myself.tail >= myself.head) {\n        value = myself.array[myself.head];\n\
  \        myself.array[myself.head] = void 0;\n        myself.head += 1;\n      \
  \  return value\n      }\n    },\n    isEmpty: function (myself) {\n      return\
  \ myself.tail < myself.head\n    }\n  }\n};\n\nvarqueueWithAmnesia = AmnesiacQueueMaker();\n\
  queueWithAmnesia.pushTail(queueWithAmnesia, 'Hello');\nqueueWithAmnesia.pushTail(queueWithAmnesia,\
  \ 'JavaScript')\n```\n\n`AmnesiacQueueMaker` 创建了具有“失忆”的队列：它们不知道自己是谁，所以每当我们调用它们的其中任何一个函数时，都必须告诉它们它们是谁。你可以通过一个思想实验来推导出复制队列的含义：我们不需要担心环境，因为每个函数都是在你传递进去的队列上操作的。\n\
  \n当然，致命的缺点是，必须确保在每次调用函数时都传递了正确的队列。该怎么办？\n\n## `this` 到底是什么？\n\n每当我们必须反复又一次地做同一件事情时，我们工业化的人类就会尝试建造一台机器来为我们完成。JavaScript\
  \ 就是其中一种机器：\n\n```javascript\nvar BanksQueueMaker = function () {\n  return {\n\
  \    array: [], \n    head: 0, \n    tail: -1,\n    pushTail: function (value) {\n\
  \      return this.array[this.tail += 1] = value\n    },\n    pullHead: function\
  \ () {\n      var value;\n      if (this.tail >= this.head) {\n        value = this.array[this.head];\n\
  \        this.array[this.head] = void 0;\n        this.head += 1;\n        return\
  \ value\n      }\n    },\n    isEmpty: function () {\n      return this.tail < this.head\n\
  \    }\n  }\n};\n\nvar banksQueue = BanksQueueMaker();\nbanksQueue.pushTail('Hello');\n\
  banksQueue.pushTail('JavaScript') \n```\n\n每当你调用一个对象的成员函数时，JavaScript 都会将该对象绑定到函数环境中的\
  \ `this` 名称上，就像它是一个参数一样。现在我们可以轻松地进行复制：\n\n```javascript\nvar copyOfQueue = extend({},\
  \ banksQueue)\ncopyOfQueue.array = []\nfor (var i = 0; i < 2; ++i) {\n  copyOfQueue.array[i]\
  \ = banksQueue.array[i]\n}\n\nbanksQueue.pullHead()\n//=> 'Hello'\n\ncopyOfQueue.pullHead()\n\
  //=> 'Hello'\n```\n\n太棒，我们现在有了复制数组的方法。通过消除闭包并利用 `this`，我们让函数在对象之间变得更容易迁移，代码也更加简单。\n\
  \n关于 `this` 的内容比我们在这里讨论的要多。我们稍后将在[当我们调用函数时适用何种上下文？]中进行更详细的探讨。\n\n![tip](img/leanpub_key.png)\
  \ | 闭包将函数与其创建的环境紧密耦合，限制了它们的灵活性。使用 `this` 缓解了这种耦合。复制对象只是这种灵活性所需的一个例子。 |\n\n### 当我们调用函数时适用何种上下文？\n\
  \n在[这个与那个]中，我们学习到，当函数作为对象方法被调用时，`this` 名称在它的环境中绑定到充当“接收者”的对象上。例如：\n\n```javascript\n\
  var someObject = {\n  returnMyThis: function () {\n    return this;\n  }\n};\n\n\
  someObject.returnMyThis() === someObject\n//=> true\n```\n\n我们构造了一个方法，它在被调用时返回绑定到\
  \ `this` 的任何值。正如所述，它在被调用时返回了该对象。\n\n#### 这取决于函数被调用的方式\n\nJavaScript 程序员谈论函数在被调用时具有“上下文”。`this`\
  \ 绑定到该上下文。需要理解的关键点是：被调用的函数的上下文是由函数的调用方式决定的，而不是由函数本身。\n\n这是一个重要的区别。考虑闭包：被调用的函数的上下文是由函数的调用方式决定的，而不是由函数本身。\n\
  \n\n\n但现在我们彻底理解了 `a.b()` 的真正含义：它等同于 `a.b.call(a)`。而在浏览器中，`c()` 等同于 `c.call(window)`。\n\
  \n## apply, arguments 与上下文化\n\nJavaScript 在每个函数的环境中都有另一个“自动魔法”的绑定。`arguments` 是一个特殊的对象，它的行为有点像数组。\n\
  \n例如：\n\n```\n1 var third = function () {\n2   return arguments[2]\n3 }\n4 \n5 third(77,\
  \ 76, 75, 74, 73)\n6   //=> 75\n```\n\n先等一下这个念头。JavaScript 还提供了第四种为函数设置上下文的方法。`apply`\
  \ 是每个函数都实现的方法，它接收一个上下文作为第一个参数，并接收一个数组或类数组的参数列表作为第二个参数。这听起来有点绕口，让我们来看个例子：\n\n```\n\
  1 third.call(this, 1,2,3,4,5)\n2   //=> 3\n3 \n4 third.apply(this, [1,2,3,4,5])\n\
  5   //=> 3\n```\n\n现在让我们把两者结合起来。这里有另一个悲剧：\n\n```\n1 var a = [1,2,3],\n2     accrete\
  \ = a.concat;\n3     \n4 accrete([4,5])\n5   //=> 乱七八糟！\n```\n\n我们得到了将 `[4,5]` 拼接到包含全局环境的数组上的结果。这并不是我们想要的！看：\n\
  \n```\n1 var contextualize = function (fn, context) {\n2   return function () {\n\
  3     return fn.apply(context, arguments);\n4   }\n5 }\n6 \n7 accrete = contextualize(a.concat,\
  \ a);\n8 accrete([4,5]);\n9   //=> [ 1, 2, 3, 4, 5 ]\n```\n\n我们的 `contextualize`\
  \ 函数返回一个新函数，该函数以固定的上下文调用另一个函数。它可以修复我们在上面遇到的一些意外结果。考虑一下：\n\n```\n 1 var aFourthObject\
  \ = {},\n 2     returnThis = function () { return this; };\n 3     \n 4 aFourthObject.uncontextualized\
  \ = returnThis;\n 5 aFourthObject.contextualized = contextualize(returnThis, aFourthObject);\n\
  \ 6 \n 7 aFourthObject.uncontextualized() === aFourthObject\n 8   //=> true\n 9\
  \ aFourthObject.contextualized() === aFourthObject\n10   //=> true\n```\n\n两者都是\
  \ `true`，因为我们通过 `aFourthObject.` 访问了它们。现在我们写：\n\n```\n1 var uncontextualized = aFourthObject.uncontextualized,\n\
  2     contextualized = aFourthObject.contextualized;\n3     \n4 uncontextualized()\
  \ === aFourthObject;\n5   //=> false\n6 contextualized() === aFourthObject\n7  \
  \ //=> true\n```\n\n当我们在不使用 `aFourthObject.` 的调用这些函数时，只有上下文化的版本保持了 `aFourthObject`\
  \ 的上下文。\n\n我们稍后会在“绑定（Binding）”章节重新回到上下文化方法。但在深入研究方法的特殊处理之前，我们需要再花一点时间研究函数和方法的工作原理。\n\
  \n### 方法装饰器\n\n在函数装饰器中，我们学习到装饰器接收一个函数作为参数，返回一个函数，并且两者之间存在语义关系。如果函数是一个动词，那么装饰器就是一个副词。\n\
  \n装饰器可以用于装饰方法，前提是它们必须仔细地保留函数的上下文。例如，这里有一个针对单个参数的 `maybe` 的简单版本：\n\n```\n1 function\
  \ maybe (fn) {\n2   return function (argument) {\n3     if (argument != null) {\n\
  4       return fn(argument)\n5     }\n6   }\n7 }\n```\n\n这个版本没有保留上下文，因此它不能作为方法装饰器。相反，我们必须写：\n\
  \n```\n1 function maybe (fn) {\n2   return function (argument) {\n3     if (argument\
  \ != null) {\n4       return fn.call(this, argument)\n5     }\n6   }\n7 }\n```\n\
  \n现在我们可以写类似这样的代码：\n\n```\n1 someObject = {\n2   setSize: maybe(function (size) {\n\
  3     this.size = size;\n4     return this\n5   })\n6 }\n```\n\n并且 `this` 被正确设置了：\n\
  \n```\n1 someObject.setSize(5)\n2   //=> { setSize: [Function], size: 5 }\n```\n\
  \n使用 `.call` 或 `.apply` 以及 `arguments` 实际上比编写不设置上下文的函数装饰器要慢得多，因此有时编写不能作为方法装饰器的函数装饰器可能是正确的。然而，在实践中，未能通过装饰器传递上下文而引入缺陷的概率远比引入性能退化的概率要大，因此默认选择应该是以此方式编写所有函数装饰器，使它们是“上下文无关（context\
  \ agnostic）”。\n\n在某些情况下，编写方法装饰器还有其他考虑。如果装饰器引入了任何类型的状态（如 `once` 和 `memoize` 所做的那样），当多个对象通过原型机制或共享同一个函数的引用来共享相同方法时，必须仔细管理这种情况。\n\
  \n### 总结\n\n#### 对象、变异与状态\n\n- 状态可以使用闭包封装。\n- 状态可以被组合聚合。\n- 状态可以被扩展。\n- `this` 绑定可以很方便。\n\
  - 函数可以被命名。\n\n#### 对象、变异与状态\n\n- 状态可以使用闭包封装。\n- 状态可以被组合聚合。\n- 状态可以被扩展。\n- `this`\
  \ 绑定可以很方便。\n- 函数可以被命名。\n\n#### 对象、变异与状态\n\n- 状态可以使用闭包封装。\n- 状态可以被组合聚合。\n- 状态可以被扩展。\n\
  - `this` 绑定可以很方便。\n- 函数可以被命名。\n\n#### 对象、变异与状态\n\n- 状态可以使用闭包封装。\n- 状态可以被组合聚合。\n\
  - 状态可以被扩展。\n- `this` 绑定可以很方便。\n- 函数可以被命名。\n\n#### 递归函数的记忆化\n\n#### 记忆化（memoize）\n\
  \n我们可以将 `memoized` 应用于函数，并返回一个新函数，该函数会对其结果进行缓存（memoize）”，这样它永远不需要重复计算相同的值。你可以将 `memoize`\
  \ 应用于各种类型的“等幂”纯函数，即给定相同参数总是返回相同结果的函数。例如 `fibonacci`：\n\n让我们试一下：\n\n```\n 1 var fastFibonacci\
  \ = memoized( function (n) {\n2   if (n < 2) {\n3     return n\n4   }\n5   else\
  \ {\n6     return fastFibonacci(n-2) + fastFibonacci(n-1)\n7   }\n8 });\n9 \n10\
  \ fastFibonacci(45)\n11   //=> 1134903170\n```\n\n我们立即得到了结果。它有效了！你可以对所有的“等幂”纯函数使用\
  \ `memoize`。默认情况下，它适用于任何接受可以通过 JavaScript 标准库函数转换为 JSON 的参数的函数。如果你有另一种策略将参数转换为字符串键，可以将其作为第二个参数提供。\n\
  \n#### 为什么那么慢？嗯，它有反复计算相同结果的坏习惯。我们可以调整计算以避免这一点，但让我们空间换时间。我们想要做的是使用查找表。当我们需要结果时，进行查找。如果没有，我们就计算并将结果写入表中供以后使用。如果有了，我们就返回结果。\n\
  \n这是我们的配方：\n\n```\n1 function memoized (fn, keymaker) {\n2   var lookupTable = {},\
  \ \n3       key;\n4     \n5   keymaker || (keymaker = function (args) {\n6     return\
  \ JSON.stringify(args)\n7   });\n8     \n9   return function () {\n10     var key\
  \ = keymaker.call(this, arguments);\n11     \n12     return lookupTable[key] ||\
  \ (\n13       lookupTable[key] = fn.apply(this, arguments)\n14     )\n15   }\n16\
  \ }\n```\n\n我们可以将 `memoized` 应用于一个函数，并返回一个新函数，该函数会对其结果进行缓存，这样它永远不需要重复计算相同的值。它只适用于“等幂”纯函数，即给定相同参数总是返回相同结果的函数。比如\
  \ `fibonacci`：\n\n这是一个没有使用命名的实现：\n\n```\n1 fibonacci = function (n) {\n2   if (n\
  \ < 2) {\n3     return n\n4   }\n5   else {\n6     return fibonacci(n-2) + fibonacci(n-1)\n\
  7   }\n8 }\n```\n\n我们测试一下：\n\n```\n1 s = (new Date()).getTime()\n2 fibonacci(45)\n\
  3 (new Date()).getTime() - s / 1000\n4   //=> 28.565\n```\n\n\n\n\n我们特意选择了一个递归函数来演示记忆化（memoize），因为它展示了将装饰器与具命名函数表达式结合时的一个陷阱。考虑这个使用具命名函数表达式实现：\n\
  \n```\n1 var fibonacci = function fibonacci (n) {\n2   if (n < 2) {\n3     return\
  \ n\n4   }\n5   else\n6     return fibonacci(n-2) + fibonacci(n-1)\n7   }\n8 }\n\
  ```\n\n如果我们尝试对它进行记忆化，并不会获得预期的加速：\n\n```\n1 var fibonacci = memoized( function fibonacci\
  \ (n) {\n2   if (n < 2) {\n3     return n\n4   }\n5   else\n6     return fibonacci(n-2)\
  \ + fibonacci(n-1)\n7   }\n8 });\n```\n\n这是因为在外部环境中绑定到名称 `fibonacci` 的函数已经被记忆化了，但具命名函数表达式在未记忆化的函数内部绑定了名称\
  \ `fibonacci`，因此对 `fibonacci` 的任何递归调用都从未被记忆化。因此，我们必须这样写：\n\n```\n1 var fibonacci\
  \ = memoized( function (n) {\n2   if (n < 2) {\n3     return n\n4   }\n5   else\n\
  6     return fibonacci(n-2) + fibonacci(n-1)\n7   }\n8 });\n```\n\n如果我们需要防止重新绑定破坏函数，将需要使用模块模式。\n\
  \n### getWith\n\n`getWith` 是一个非常简单的函数。它接收属性的名称并返回一个函数，该函数从对象中提取该属性的值：\n\n```\n1\
  \ function getWith (attr) {\n2   return function (object) { return object[attr];\
  \ }\n3 }\n```\n\n你可以这样使用它：\n\n```\n1 var inventory = {\n2   apples: 0,\n3   oranges:\
  \ 144,\n4   eggs: 36\n5 };\n6\n7 getWith('oranges')(inventory)\n8   //=> 144\n```\n\
  \n这还不上是一个配方。但让我们把它和 mapWith 结合起来：\n\n```\n1 var inventories = [\n2   { apples: 0,\
  \ oranges: 144, eggs: 36 },\n3   { apples: 240, oranges: 54, eggs: 12 },\n4   {\
  \ apples: 24, oranges: 12, eggs: 42 }\n5 ];\n6\n7 mapWith(getWith('oranges'))(inventories)\n\
  8   //=> [ 144, 54, 12 ]\n```\n\n这比“手写”出来要漂亮得多：\n\n```\n1 mapWith(function (inventory)\
  \ { return inventory.oranges })(inventories)\n2   //=> [ 144, 54, 12 ]\n```\n\n\
  `getWith` 与 maybe 也配合得很好。考虑一个稀疏数组。你可以使用：\n\n```\n1 mapWith(maybe(getWith('oranges')))\n\
  ```\n\n从列表中所有非空库存中获取橙子数量。\n\n#### 名字代表什么？\n\n为什么这叫 `getWith`？考虑这个函数，它在拥有函数和字典但没有方法的语言中很常见：\n\
  \n```\n1 function get (object, attr) {\n2   return object[attr];\n3 };\n```\n\n\
  你可能会问：“为什么要用函数而不是直接用 `[]`？”答案是，我们可以以无法操作语法的方式来操作函数。例如，你还记得 flip 中提到我们可以从 `map` 定义出\
  \ `mapWith` 吗？\n\n```\n1 var mapWith = flip(map);\n```\n\n我们可以用 `getWith` 做同样的事，这就是它这样命名：\n\
  \n```\n1 var getWith = flip(get)\n```\n\n### pluckWith\n\n这种 mapWith 和 getWith 结合的模式在\
  \ JavaScript 中非常频繁，以至于我们可以向上抽象：\n\n```\n1 function pluckWith (attr) {\n2   return\
  \ mapWith(getWith(attr))\n3 }\n```\n\n或者更好的：\n\n```\n1 var pluckWith = compose(mapWith,\
  \ getWith);\n```\n\n现在我们可以写：\n\n```\n1 pluckWith('eggs')(inventories)\n2   //=>\
  \ [ 36, 12, 42 ]\n```\n\n像 [Underscore](http://underscorejs.org) 这样的库提供了 `pluck`，它是\
  \ `pluckWith` 的反转版本：\n\n```\n1 var pluckWith = flip(pluck);\n```\n\n当你想要给一个函数命名时，我们的配方更简洁：\n\
  \n```\n1 eggsByStore = pluck('eggs');\n```\n\n对比：\n\n```\n1 function eggsByStore\
  \ (inventories) {\n2   return pluck(inventories, 'eggs')\n3 }\n```\n\n### Deep Mapping\n\
  \nmapWith](#chap06.xhtml_mapWith) 是一个极佳的工具，但有时你会发现自己在处理数组而不是列表。例如，这里有一个从报告提取的部分列表。它是以某种方式分组的，我们需要对报告中的每项进行操作。\n\
  \n```\n1 var report =\n2   [ { price: 1.99, id: 1 },\n3     { price: 4.99, id: 2\
  \ },\n4     { price: 7.99, id: 3 },\n5     { price: 1.99, id: 4 },\n6     { price:\
  \ 2.99, id: 5 },\n7     { price: 6.99, id: 6 } ],\n8   [ { price: 5.99, id: 21 },\n\
  9     { price: 1.99, id: 22 },\n10     { price: 7.99, id: 23 },\n11     { price:\
  \ 10.99, id: 24 },\n12     { price: 9.99, id: 25 },\n13     { price: 9.99, id: 226\
  \ } ],\n14   // ...\n15   [ { price: 7.99, id: 221 },\n16     { price: 4.99, id:\
  \ 222 },\n17     { price: 7.99, id: 223 },\n18     { price: 10.99, id: 224 },\n\
  19     { price: 9.99, id: 225 },\n20     { price: 9.99, id: 226 } ] ];\n```\n\n\
  我们可以嵌套一些 `mapWith`，但人类是工具使用者。如果我们可以用木子从洞里取出美味的蚂来吃，我们就可以自动化处理数组：\n\n```\n1 function\
  \ deepMapWith (fn) {\n2   return function innerMapWith (tree) {\n3     return Array.prototype.map.call(tree,\
  \ function (element) {\n4       if (Array.isArray(element)) {\n5         return\
  \ innerMapWith(element);\n6       }\n7       else return fn(element);\n8     });\n\
  9   };\n10 };\n```\n\n现在我们可以像对扁数组使用 `mapWith` 一样对对树使用 `deepMapWith`：\n\n```\n1 deepMapWith(getWith('price'))(report)\n\
  2   //=> [ [ 1.99,\n             4.99,\n             7.99,\n             1.99,\n\
  \             2.99,\n             6.99 ],\n8           [ 5.99,\n             1.99,\n\
  \             1.99,\n             1.99,\n             5.99 ],\n13\n14          \
  \ // ...\n15                      [ 7.99,\n16             4.99,\n17            \
  \ 7.99,\n18             10.99,\n19             9.99,\n20             9.99 ] ]\n\
  ```\n\n## 8 完成杯子：实例与类\n\n![其他语言将它们的对象称为“豆子”，但为了满足所有人的而提供极淡的咖啡](img/beans1.jpg)\n\
  \n其他语言将它们的对象称为“豆子”，但为了满足所有人的而提供极淡的咖啡\n\n正如在重新绑定和引用 中讨论的，以及在封装状态 中再次讨论的，JavaScript\
  \ 对象非常简单，但对象、函数和闭包的组合可以创建强大的数据结构。尽管如此，某些语言功能是无法通过普通 JavaScript 对象、函数和闭包实现的。\n\n\
  之一就是继承。在 JavaScript 中，继承为扩展数据结构、领域模型以及任何你表示为状态和操作组合提供了一种更清晰、更简单的机制。\n\n### 原型很简单，困难的是解释\n\
  \n正如你在我们在使对象可扩展](#chap07.xhtml_extensible) 代码中所见的，我们写了一个返回普通 JavaScript 对象的函数。这种函数的通俗术是“工厂函数”。\n\
  \n让我们把函数简化到最核心：\n\n```\n1 var Ur = function () {};\n```\n\n这看起来不像一个工厂函数：它在被调用时没有产生普通\
  \ JavaScript 对象的表达式。然而，有一种方法从它创建一个对象。看 `new` 关键字的力量：\n\n```\n1 new Ur()\n2   //=>\
  \ {}\n```\n\n我们得到了一个对象！我们可以关于这个对象发现什么？\n\n```\n1 new Ur() === new Ur()\n2   //=>\
  \ false\n```\n\n每当我们使用 `new` 调用函数并返回一个对象时，我们得到一个独特的对象。我们可以把这些称为“使用 new 关键字创建的对象”，但这样太繁琐了。\n\
  \n\n\n\n由于我们在讨论完原型之后才会解释原因，我们还会说 `Ur` 是 `i` 的 `constructor`，并且 `Ur` 是一个 `constructor\
  \ function`。因此，实例是通过使用 `new` 关键字作用于构造函数创建的对象，而该函数就是实例的构造函数。\n\n### 原型 (Prototypes)\n\
  \n远不止于此。这里有一些关于函数你可能不知道的事实：\n\n```\n1 Ur.prototype\n2   //=> {}\n```\n\n这个原型是什么？让我们运行一下标准测试：\n\
  \n```\n1 (function () {}).prototype === (function () {}).prototype\n2   //=> false\n\
  ```\n\n每个函数都初始化了自己独有的 `prototype`。它有什么用呢？让我们尝试一下：\n\n```\n1 Ur.prototype.language\
  \ = 'JavaScript';\n2 \n3 var continent = new Ur();\n4   //=> {}\n5 continent.language\n\
  6   //=> 'JavaScript'\n```\n\n这非常有趣！实例的行为似乎就像它们拥有与其构造函数原型相同的元素一样。让我们尝试几件事：\n\n```\n\
  1 continent.language = 'CoffeeScript';\n2 continent\n3   //=> {language: 'CoffeeScript'}\n\
  4 continent.language\n5   //=> 'CoffeeScript'\n6 Ur.prototype.language\n7   'JavaScript'\n\
  ```\n\n你可以设置实例的元素，它们会“覆盖”构造函数的原型，但实际上并不会改变构造函数的原型。让我们再创建一个实例并尝试一些其他操作。\n\n```\n\
  1 var another = new Ur();\n2   //=> {}\n3 another.language\n4   //=> 'JavaScript'\n\
  ```\n\n新实例不会获得对其他实例所做的任何更改。这很合理。而且：\n\n```\n1 Ur.prototype.language = 'Sumerian'\n\
  2 another.language\n3   //=> 'Sumerian'\n```\n\n更有趣的是：改变构造函数的原型会改变其所有实例的行为。这强烈暗示了实例与其构造函数之间存在一种动态关系，而不是某种通过复制来创建对象的机制。\n\
  \n提到原型，还有另一非常有趣的事：\n\n```\n1 continent.constructor\n2   //=> [Function]\n3   \n\
  4 continent.constructor === Ur\n5   //=> true\n```\n\n每个实例都会获得一个 `constructor` 元素，该元素被初始化为它们的构造函数。即使对于我们自己在代码中没有用\
  \ `new` 创建的对象也是如此：\n\n```\n1 {}.constructor\n2   //=> [Function: Object]\n```\n\n\
  如果这是真的，那么原型呢？它们有构造函数吗？\n\n```\n1 Ur.prototype.constructor\n2   //=> [Function]\n\
  3 Ur.prototype.constructor === Ur\n4   //=> true\n```\n\n非常有趣！我们将在讨论类扩展时再次查看 `constructor`\
  \ 元素。\n\n### 回顾队列的 `this` 概念\n\n让我们使用 `new` 和 `.prototype` 来重写我们的 `Queue`，并使用 `this`\
  \ 以及我们在《组合与扩展》中用过的 `extends` 辅助函数：\n\n```\n 1 var Queue = function () {\n 2   extend(this,\
  \ {\n3     array: [],\n4     head: 0,\n5     tail: -1\n6   })\n 7 };\n8   \n 9 extend(Queue.prototype,\
  \ {\n10   pushTail: function (value) {\n11     return this.array[this.tail += 1]\
  \ = value\n12   },\n13   pullHead: function () {\n14     var value;\n15     \n16\
  \     if (!this.isEmpty()) {\n17       value = this.array[this.head]\n18       this.array[this.head]\
  \ = void 0;\n19       this.head += 1;\n20       return value\n21     }\n22   },\n\
  23   isEmpty: function () {\n24     return this.tail < this.head\n25   }      \n\
  26 })\n```\n\n你记得当我们第一次看 `this` 时，只涵盖了属于对象的被调用这种情况。现在我们看到了另一种情况：当函数被 `new` 运算符调用时，`this`\
  \ 会被设置为正在创建的新对象。因此，我们的 `Queue` 代码初始化了队列。\n\n你可以看出为什么 `this` 在 JavaScript 中如此好用：如果\
  \ JavaScript 不给我们提供一种简单的方法来引用实例本身，我们就无法在原型中定义作用于实例的函数了。\n\n### 处处都是对象？\n\n现在你已经了解了原型，是时候承认一些连小孩子都知道的事情了：JavaScript\
  \ 中的一切行为都像一个对象，JavaScript 中的一切行为都像一个函数的实例，因此，JavaScript 中的一切行为都像是从其构造函数的原型中继承了一些方法，和/或拥有自己的一些元素。\n\
  \n例如：\n\n```\n 1 3.14159265.toPrecision(5)\n 2   //=> '3.14159'\n 3   \n 4 'FORTRAN,\
  \ SNOBOL, LISP, BASIC'.split(', ')\n 5   //=> [ 'FORTRAN',\n 6   #     'SNOBOL',\n\
  \ 7   #     'LISP',\n 8   #     'BASIC' ]\n 9   \n10 ['FORTRAN',\n11   'SNOBOL',\n\
  12   'LISP',\n13   'BASIC' ].length\n14 //=> 4\n```\n\n函数拥有方法。当你对值进行类似对象的操作时，JavaScript\
  \ 会检查该值是否实际上是一个对象。如果该值是一个原始类型，JavaScript 会临时创建一个该原始类型的副本，该副本拥有方法，你会被误认为 `\"Spence\
  \ Olham\"` 有 `.split` 方法。\n\n这些副本被称为 `String` 实例，而不是 `String` 原始类型。实例拥有方法，而原始类型没有。JavaScript\
  \ 如何从原始类型创建实例？当然是使用 `new`。让我们尝试：\n\n```\n1 new String(\"Spence Olham\")\n2   //=>\
  \ \"Spence Olham\"\n```\n\n字符串实例看起来和我们的字符串原始类型一样。但它的行为像字符串原始类型吗？完全不像：\n\n```\n1\
  \ new String(\"Spence Olham\") === \"Spence Olham\"\n2   //=> false\n```\n\n哈！它是一个拥有独立身份的对象，而字符串原始类型的行为则像是有一个规范表示法。如果我们不在乎它们的身份，那就不是问题。但如果我们认为自己在认为拥有字符串原始类型的地方粗地使用了字符串实例，我们可能会遇到一个微妙的\
  \ bug：\n\n```\n1 if (userName === \"Spence Olham\") {\n2   getMarried();\n3   goCamping()\n\
  4 }\n```\n\n如果我们不小心将 `new String(\"Spence Olham\")` 绑定到 `userName` 而不是原始值 `\"Spence\
  \ Olham\"`，那么这段代码将无法按照预期工作。\n\n这种基本问题——实例具有唯一身份，但内容相同的原始类型具有相同的身份——适用于所有原始类型，包括数字和布尔值：如果你用\
  \ `new` 创建任何东西的实例，它都会获得自己的身份。\n\n还有更多陷阱需要注意。考虑字符串、数字和布尔值原始类型的真值性（truthiness）：\n\n\
  \n\n\n\n```\n1 '' ? 'truthy' : 'falsy'\n2   //=> 'falsy'\n3 0 ? 'truthy' : 'falsy'\n\
  4   //=> 'falsy'\n5 false ? 'truthy' : 'falsy'\n6   //=> 'falsy'\n```\n\n将此与其对应的实例进行对比：\n\
  \n```\n1 new String('') ? 'truthy' : 'falsy'\n2   //=> 'truthy'\n3 new Number(0)\
  \ ? 'truthy' : 'falsy'\n4   //=> 'truthy'\n5 new Boolean(false) ? 'truthy' : 'falsy'\n\
  6   //=> 'truthy'\n```\n\n我们对“真值”（truthiness）和“假值”（falsiness）的理解是：所有实例都是真值，即使是对应于假值原始类型的字符串、数字和布尔实例也是如此。\n\
  \n解决“JavaScript 冒充者综合征”有一个确切的治疗方法。正如 `new PrimitiveType(...)` 创建的实例是原始类型的冒充者一样，`PrimitiveType(...)`\
  \ 则会从原始类型或原始对象的实例创建一个原始的、规范化的原始类型。\n\n例如：\n\n```\n1 String(new String(\"Spence Olham\"\
  )) === \"Spence Olham\"\n2   //=> true\n```\n\n通过巧妙的设计，我们可以这样写：\n\n```\n1 var original\
  \ = function (unknown) {\n2   return unknown.constructor(unknown)\n3 }\n4     \n\
  5 original(true) === true\n6   //=> true\n7 original(new Boolean(true)) === true\n\
  8   //=> true\n```\n\n当然，除非你非常仔细地模拟相同的行为，否则 `original` 对你自己的创建的内容将不起作用。但它对于字符串、数字和布尔值是有效的。\n\
  \n### 将函数绑定到上下文\n\n回想在当我们调用函数时应用了什么上下文？ 中，我们推迟了对设置函数上下文的探讨，而是看了一个 `contextualize`\
  \ 辅助函数：\n\n```\n 1 var contextualize = function (fn, context) {\n2   return function\
  \ () {\n3     return fn.apply(context, arguments)\n4   }\n 5 },\n6 a = [1,2,3],\n\
  7 accrete = contextualize(a.concat, a);\n8     \n9 accrete([4,5])\n10   //=> [ 1,\
  \ 2, 3, 4, 5 ]\n```\n\n这在实践中如何帮助我们呢？考虑构建一个事件驱动的应用程序。例如，一个 MVC 应用会在模型发生变化时将某些视图绑定到更新事件。[Backbone](http://backbonejs.org)\
  \ 框架就是这样使用事件的：\n\n```\n1 var someView = ...,\n2     someModel = ...;\n3 \n4 someModel.on('change',\
  \ function () {\n5   someView.render()\n6 });\n```\n\n这告诉 `someModel`，当它触发 `change`\
  \ 事件时，应该调用匿名函数，而该函数反过来调用 `someView` 的 `.render` 方法。直接写成这样难道不是更简单吗：\n\n```\n1 someModel.on('change',\
  \ someView.render);\n```\n\n这样写会更好，但 `.on` 和类似的框架方法的实现看起来如下：\n\n```\n1 Model.prototype.on\
  \ = function (eventName, callback) { ... callback() ... }\n```\n\n虽然 `someView.render()`\
  \ 正确地将方法的上下文设置为 `someView`，但 `callback()` 则不会。在不像我们上面那样将 `someView.render()` 封装在函数调用中的情况下，我们可以做什么？\n\
  \n#### 绑定方法\n\n在列举方法之前，让我们描述一下我们正在尝试做什么。我们要获取一个方法调用并将其视为函数。现在，方法在 JavaScript 中确实是函数，但正如我们通过观察上下文学到的，方法调用涉及调用函数*以及*将函数调用的上下文设置为方法调用的接收者。\n\
  \n当我们写类似下面的代码时：\n\n```\n1 var unbound = someObject.someMethod;\n```\n\n我们正在将名称 `unbound`\
