  \n所以，我们真正想要做的是获取一个*已绑定*的方法，即与特定接收者关联的方法。我们在上面看到了实现这一点的一种显而易见的方法，将方法调用封装在另一个函数中。当然，我们负责复制被绑定的方法的*参数个数*（arity）。例如：\n\
