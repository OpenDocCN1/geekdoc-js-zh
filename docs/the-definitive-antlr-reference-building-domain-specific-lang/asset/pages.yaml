  md: '# Running Edge Rails


    If you are like me, you enjoy keeping up with the latest changes in the Rails
    trunk or Edge Rails. Get the latest and greatest features right as they are added
    using svn:externals.


    You get Edge Rails to automatically update when you update your working copy by
    setting the vendor directory''s svn:externals property by running this command:


    ```

    $ svn propedit svn:externals vendor

    ```


    When your editor opens you to set the svn:externals property, add this line:


    ```

    rails http://dev.rubyonrails.org/svn/rails/trunk/

    ```


    The next time you update,⁴ Subversion will download the Edge Rails trunk directory
    to vendor/rails for you.


    If you want to negate that option, you can use the following as of Subversion
    1.2:⁵


    ```

    $ svn update --ignore-externals

    ```


    Edge Rails has all the greatest features but is sometimes unstable. Make sure
    you have a fairly wide set of unit, functional, and integration tests to catch
    any bugs Edge Rails might introduce. Don''t forget to report any breakage on the
    Rails-core mailing list and/or to create a ticket on the Rails Trac (http://dev.rubyonrails.org/).
    When reporting a bug, you should always report which revision of Rails you were
    using at the time:


    ```

    $ svnversion vendor/rails

    4077

    ```


    # Checking in Generated Code


    During normal Rails development, you will use generators to create many new files.
    Some generated files should not go into the repository. As a general rule, if
    Rails generates a file from scratch at run time, you will not want to check it
    in. If you edit a generated file, you''ll want to check it in.


    +   4. If you set svn:externals before the first commit, the update will not fetch
    the external source code.


    +   5. http://subversion.tigris.org/svn_1.2_releasenotes.html'
