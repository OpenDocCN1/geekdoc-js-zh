  md: "After you've set that up, you are ready to configure Monit. I like to create\
    \ a separate configuration for each Mongrel model. You'll add the following configuration\
    \ for mongrel.monitc, which will keep in Monit's directory, in our case, /etc/monit.d/\n\
    \n```\ncheck process mongrel_deployid_5000\nwith pidfile /data/deploy/log/mongrel.5000.pid\n\
    start program = \"/usr/bin/mongrel_rails cluster::start -C \\\n  /data/deploy/current/config/mongrel_cluster.yml\
    \ \\\n  clean --only 5000\"\nstop program = \"/usr/bin/mongrel_rails cluster::stop\
    \ -C \\\n  /data/deploy/current/config/mongrel_cluster.yml \\\n  --only 5000\"\
    \nif totalmem is greater than 110.0 MB for 4 cycles then restart\nif cpu is greater\
    \ than 80% for 4 cycles then restart\nif 20 restarts within 20 cycles then timeout\n\
    group deploy\n```\n\nNotice that you will need a block for each process that you\
    \ want Monit to monitor. The previous configuration is for one Mongrel model.\
    \ The first directive, check_process, identifies a process to monitor. I have\
    \ skipped that directive in favor of the alternative with pidfile option that\
    \ tells Monit which process to monitor. Recall that each Mongrel instance has\
    \ a file stored in the log/mongrel.port.pid file. The next two directives tell\
    \ Monit how to start and stop Mongrel. The last three directives tell Monit what\
    \ to do when certain pathological conditions exist. This configuration will restart\
    \ Mongrel instances if the memory exceeds a threshold (110.MB in the previous\
    \ configuration) or the CPU is too busy for a process. These directives also take\
    \ care timing out and notifying administrators. Keep in mind that all this is\
    \ fully automated and requires notification in extreme circumstances.\n\nKeep\
    \ in mind that Monit will start your Mongrels with a completely clean environment.\
    \ This means your $PATH will not be set up. You will need to use the fully qualified\
    \ path to your mongrel_rails command. In the previous config I used /usr/bin/mongrel_rails,\
    \ but you may need to adjust this path depending on where your system installed\
    \ the command. You can figure out where the command was installed this:\n\n```\n\
    ezra$ which mongrel_rails\n/usr/bin/mongrel_rails\n```\n\nA final configuration\
    \ provides the general setup for Monit, including the configuration for the mail\
    \ server and alerts. This file is located at /etc/monit/monitrc."
