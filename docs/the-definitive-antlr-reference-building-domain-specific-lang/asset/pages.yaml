- img_proc: true
  md: 'Normally, your hosting provider will require that you share your database with
    other users. They will likely give you a user ID and password to access your own
    database namespace. Whichever name you choose, make sure to keep the database
    name, combined with an admin-level username and password, in a safe place for
    later. Here’s an example on MySQL that creates a database ezra and grants all
    the appropriate privileges. Your may vary.


    ```

    mysql> GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,DROP, ALTER, INDEX

    mysql> ON ezra.* TO ''ezra''@''hostname'' IDENTIFIED BY ''password'';

    mysql> FLUSH PRIVILEGES;

    mysql> CREATE DATABASE ezra;

    ```


    If you want to peek ahead, the production section of the Rails application''s
    config/database.yml file will look like this:


    ```

    production:

    adapter: mysql

    database: ezra

    username: ezra

    password: password

    host: brainspl.at # provided by your shared host provider

    ```


    At this point, you’ll want to make sure your database is running and you can access
    it. Just using the database and showing the list of tables is enough for now:


    ```

    mysql> use ezra;

    Database changed

    mysql> show tables;

    Empty set (0.00 rows)

    mysql>

    ```


    Now, you should have a working domain that’s pointed to your hosting provider,
    you should be able to reach your server through SSH, and you have created and
    accessed a database on the server. With all that background work out of the way,
    it’s time to configure your web server.


    # 3.6 Installing Your Application


    Even before I knew how to write a single line of PHP, I could copy a basic PHP
    script to a server and run it. Deploying Rails is not that easy. You need to have
    at least a basic idea of what files and folders are used by Rails when it runs.'
