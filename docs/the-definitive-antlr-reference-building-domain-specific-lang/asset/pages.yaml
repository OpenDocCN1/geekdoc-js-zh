  md: '# Import Your App into Subversion


    In Chapter 5, Capistrano, on page 92, you learned how to place your code under
    source control, or if you were not already doing so. Capistrano works with several
    source code control systems, but Subversion is the most common. Many shared hosts
    offer Subversion hosting, or you can Install the Subversion server on your own
    dedicated or VPS server (see Chapter 4, Virtual and Dedicated Hosts, on page 72).


    You will save configuration time by creating a repository for your deployment
    domain. For example, the brainspl.at repository stores the Rails app that powers
    the brainspl.at site. To import the project for the first time, issue the following
    command:


    ```

    local svn import brainspl.at http://brainspl.at/svn/brainspl.at

    ```


    brainspl.at is the local directory containing the application. The source control
    server is brainspl.at. The repository on the server is also named brainspl.at.


    After importing a project for the first time, you must check out a new copy. The
    new copy will have all the extra files Capistrano needs to keep everything synchronized.
    To edit the code for development, you can issue this command:


    ```

    local svn checkout http://brainspl.at/svn/brainspl.at

    ```


    To prevent confusion, it''s a good idea to use a separate password for checking
    out code on your server instead of the one you use for your local workstation.
    From this point, you can make changes to the server and synchronize it with the
    server using the svn commit command:


    ```

    local svn commit --message "Bugs have been fixed!"

    ```


    # Setting Your Public Document Root


