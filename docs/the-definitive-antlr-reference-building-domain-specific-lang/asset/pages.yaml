  md: '# Chapter 8


    # Deploying on Windows


    If you asked for a show of hands of how many people had ever deployed Rails on
    Windows at a Ruby conference, you would get almost no one to admit to that crime.
    The truth is something very different. Microsoft has sold a bunch of copies of
    Windows to someone, and many companies and educational institutions simply don''t
    have access to other platforms for deployment. For many companies, bringing in
    a Linux-based server isn''t an option because of politics, a lack of experience,
    or the perceptions of management. If you are deploying some departmental applications
    in such a company, Windows may be your best bet.


    This chapter explores a few strategies that you can use to get a Rails application
    deployed within a Windows server environment. I''ve used each one of these methods
    at various times to vary our audiences. I''ll cover using single instances of
    Mongrel, load balancing with Pen or Apache, and finally, a strategy to integrate
    Rails apps into an existing IIS web server using a special ISAPI filter and custom
    Rails-plug.


    # 8.1 Setting Up the Server


    To serve on Rails applications in our Windows environment, you need to do a few
    things to get your machine ready. You have to install Ruby, Gems, and Rails, as
    well as Subversion. I''ll also demonstrate how to get your Rails application talking
    to a Microsoft SQL Server.


    # Installing Ruby on Rails


    Getting Ruby, Gems, and Rails on a Windows server is extremely easy thanks to
    the work done by Curt Hibbs. His One-Click Ruby Installer makes installing Ruby
    and Gems painless.'
  merge: -1
