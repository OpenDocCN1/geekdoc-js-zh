    # 3.10 Troubleshooting Checklist


    Rails deployment means more than dropping in a JAR file or a PHP file. Even if
    you follow the previous instructions precisely, your installation may not run
    smoothly. Here are some common problems and ways to easily fix them.


    # Look at the Web Server Error Logs (In Addition to Rails)


    One of the best places to start troubleshooting is the web server''s error logs,
    especially when you are initially debugging your configuration. Rails can''t start
    writing to production.log until it has launched, so Rails logging can''t help
    you if your initial setup has critical problems. File permission problems and
    other errors will show up in the web server''s access_log and may give you clues
    about what is going wrong.


    The tail command is the most useful way to view your logs. Normally, tail shows
    the last ten lines of a file. You can ask for more lines with the -n argument
    (for example, tail -n 50 access_log). For real-time output, the -f argument will
    continue to print new lines as the web server writes them. On Unix-based systems,
    you see this kind of output when you run the Rails script/server command during
    development.


    With some versions of the tail command, you can even tail several logs simultaneously.
    If your operating system doesn''t include a capable version of tail, you can download
    a version written in Perl by Jason Fesler.


