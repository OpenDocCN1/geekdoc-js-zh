  md: '# IIS INTEGRATION


    configured to load balance between two back-end Mongrel processes.

    You can test this configuration by opening a browser and navigating to http://localhost:8080/.
    Your Rails application will appear.


    Now you can go a step further and hide your Apache server behind IIS.

    Taking this step may seem strange to you, but read on.


    # 8.5 IIS Integration


    IIS is a popular web server in Windows-based organizations. Despite its reputation,
    it can be a very good static server. In this section, I''ll show you how to use
    IIS to forward requests to your Rails applications. This configuration will allow
    you to seamlessly integrate a Rails application into an IIS website.


    Using IIS has a couple of benefits. First, you can use the SSL certificate for
    all your Rails applications. Second, you have the flexibility to move the back-end
    applications to another server at any time. If you find that Windows isn''t going
    to work for you as a deployment method, you can easily move your Rails applications
    to a Linux-based server and still have requests come through your main web server.


    Before you begin, you will need to get an additional piece of software. I am also
    going to assume that you will be performing all of this on a server where IIS
    is running on the default port (80) and that your Rails applications reside on
    the same machine.


    # Install ISAPI Rewrite


    ISAPI Rewrite is a URL-rewriting filter that provides some simple for proxy support.
    Though it is not free, it is well worth the nominal fee its developers charge,
    and you have access to an unrestricted trial version, which will get you through
    this chapter.


    Visit the ISAPI Rewrite site,¹¹ and download the trial version of ISAPI Rewrite
    3.0. Launch the installation program, and accept all the default settings. The
    installation will restart your IIS service, because it needs to install an ISAPI
    filter on your server.


    11. http://www.isapirewrite.com/'
