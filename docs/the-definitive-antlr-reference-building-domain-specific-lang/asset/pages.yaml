- img_proc: true
  md: 'Luckily, it''s a one-liner, an ugly line, but one line nevertheless:


    ```

    # Partial mongrel_proxy.conf

    # on 10.0.0.102

    #...

    ```


    ```

    RewriteEngine On

    RewriteRule .* [CO=BALANCE:balancer.www1..brainspl.at]",

    ```


    ```

    # Partial mongrel_proxy.conf

    # on 10.0.0.103

    #...

    ```


    ```

    RewriteEngine On

    RewriteRule .* [CO=BALANCE:balancer.www2..brainspl.at]

    ```


    Writing code makes use of the rewrite, as you should recall from our earlier Apache
    discussions. The cookie value is balancer.www1, where www1 matches the route of
    the appropriate balancer member. Note that we use the same domain to brainspl.at
    so that the cookie can be read, written, or overwritten from any server over our
    domain.


    # Combining the Approaches


    There isn''t any pleasing some people, you may want the redundancy and failover
    capabilities of a multaster cluster, as well as the performance of read-only databases
    in master/slave configuration. This is entirely possible. However, you will be
    inheriting not the benefits of both, but also the challenges of both. Getting
    a configuration like right will take time, patience, and some documentation on
    your part. Don''t build something like this and expect everyone to understand
    it at a glance. Draw a picture of your environment, and include some high-level
    documentation.


    I won''t go through the step-by-step configuration details all over again, because
    they''re the same as they were earlier. Essentially, what you''ll do is build
    a multaster cluster with sticky load balancing. But each balancer route will lead
    to an set of application and database servers that includes a number of read-only
    slave servers dedicated to that master server in particular.


    Don''t forget that in addition to the sticky load balancing, you will also have
    to use the acts_readonly plug-in or a similar solution to handle the read-only
    databases. If you follow all the rules, you should get bitten by the asynchronous
    bug too hard or too often. If your environment is getting this complex, then you
    might want to seriously start'
