  md: 'back ends. Out of the box, you have several back ends available. The most useful
    are these two:


    +   - File system. The simplest and most convenient choice is the file system.
    This back-end choice works well with single-server deployments. The choice doesn''t
    cluster as well because of depiration, you would have to delete files across all
    nodes in a cluster.


    +   - Memcached: The MemCachedStore option allows you to use the memcached networked
    object cache.


    If you''ll be spending much time working caching issues in development, you can
    add a new Rails environment. Typically would I copy my test.rb environment to
    a new one called staging.rb, in which I enable more production-like configurations
    such as caching. Keep in mind that a typical testing setup will not keep caching
    enabled!


    When you set up the file system cache, you''ll just need to make sure the root
    directory exists, and then you are off the races. Memcached is a little more difficult.
    You''ll typically need to set memcached up on every developer''s local machine,
    on your production setup, and additionally on any staging machine you have. Testing
    will not usually use memcached at.


    To set up memcached locally on your development machine, you can use one of the
    following methods:


    +   - On Windows, use the convient installer found at http://jeiah.cz/projects/memcached-win32/.


    +   - There are two ways for Mac OS X. First, you can try the script at http://topfunky.net/svn/shovel/memcached/install-memcached.sh.


    +   - The second approach for OS is more involved:


    +    - Download libevent from http://monkey.org/-provos/libevent/, configure,
    make, and make install it.'
