    # 5.3 Local and Remote Setup for Rails


    Capistrano configuration isn''t too difficult, but you will need to do a few steps
    on your development machine and the remote server. I''ll list the steps and then
    go through each in detail. First, on your machine you''ll need to do the following:


    +   - Install the Capistrano gem.

    - Tell Capistrano about your application so it can add the necessary files to
    it.

    - Customize config/deploy.rb with your server''s information.

    - Import your application into Subversion.


    Those local changes prepare your development machine to deploy your code base
    from Subversion. Next, you''ll need to make the following changes on your server:


    +   - Set your web server''s document root to current/public.

    - Do a checkout of your app so Subversion will cache your login information.'
