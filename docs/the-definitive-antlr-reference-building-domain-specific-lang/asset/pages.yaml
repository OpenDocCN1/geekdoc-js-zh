  md: '# CONFIGURING YOUR WEB SERVER


    by editing the public/.htaccess file in your Rails project to look like the following:


    +   # Make sure the line that specifies normal CGI

    # is commented out

    # RewriteRule ^(.*)$ dispatch.cgi [QSA,L]

    # Make sure this line is uncommented for FastCGI

    RewriteRule ^(.*)$ dispatch.fcgi [QSA,L]


    You can include all other directives in the .htaccess file. I will walk through
    all of them right now, but one important one is specifying a custom error pages.
    (Application error Rails.)


    Even though it is not turned on by default, Rails provides a 404.html file that
    you can customize to inform the visitor that a page could not be found. By using
    these static directives, make sure you remove any default directives and use the
    following:


    ```

    ErrorDocument 404 /404.html

    ErrorDocument 500 /500.html

    ```


    You can write a custom Rails controller that handles 404 (Page Not Found) and
    provides a search box or a list of popular pages:


    ```

    ErrorDocument 404 /search/not_found

    ```


    You will need to verify that you have the correct path to the Ruby interpreter
    for your host''s servers in your dispatch.fcgi file. The path to Ruby in your
    dispatch.fcgi file will be set to the location of Ruby on the machine you used
    to generate your Rails application. The easy way around this problem is to use
    the following line:


    ```

    #!/usr/bin/env ruby

    ```


    That line will load the environment to set the $PATH variable and then find the
    Ruby binary by looking at the path. This makes it portable across Unix-like operating
    systems.


    All in, Apache + FastCGI is a pretty decent general-purpose Rails platform, but
    you''ll need to watch for few quirks. You''ll need to make sure that Apache creates
    no rogue FastCGI processes. I''ll walk you through that in Chapter 6, Managing
    Your Mongrels, on page 124. I''ll walk through these items and others in the sections
    to follow.


    That''s pretty much the story for configuring your Rails application with Apache
    and FastCGI. If you don''t need lighttpd, you can skip the next section.'
