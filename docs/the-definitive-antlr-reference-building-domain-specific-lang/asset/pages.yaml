  md: "# Check Permissions\n\nRails gives developers plenty of help when it comes\
    \ to building pretty URLs. The bad news is that others who would attack Rails\
    \ also know this. Consider the following action, which is commonly created through\
    \ scaffolding.\n\n```\ndef destroy\n  Person.find(params[:id]).destroy\n  redirect_to\
    \ :action => 'list'\nend\n```\n\nTo secure the command, you need to add before_filter\
    \ :login_required to the top of your controller, meaning people need to log in\
    \ before accessing the destroy() method. For an application where only admins\
    \ delete, protection is enough. If any user can create an account and log in,\
    \ start deleting records by sequentially typing ID numbers into the browser:\n\
    \n+   /people/destroy/1\n/people/destroy/2\n/people/destroy/3\n/people/destroy/4\n\
    /people/destroy/5\n/people/destroy/6\n/people/destroy/7\n\n...\nWorse yet, a bot\
    \ could log in and delete all your records. You need to check that the logged-in\
    \ user has permission to delete the file within the controller action. Assume\
    \ that each Person object is associated with the User who created it. Also, assume\
    \ current_user returns the current logged-in user. Then, you could protect destroy()\
    \ this:\n\n```\ndef destroy\n  person = Person.find(params[:id])\n  person.destroy\
    \ if current_user == person.user\n  redirect_to :action => 'list'\nend\n```\n\n\
    Logging is not enough. You must secure individual destructive actions to one user.\
    \ There are others, such as exposing your svn directories to the Web. The easiest\
    \ way to get around this is to do an svn export instead of an svn check-out when\
    \ deploying your code to production. This will export your code without the Subversion\
    \ metadata and keep prying eyes away."
