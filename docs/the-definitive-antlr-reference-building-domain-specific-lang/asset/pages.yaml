  md: '# Use the cap Shortcut for Custom Tasks


    The easiest way to run custom tasks is to use the cap command-line tool. Capistrano
    will automatically discover the config/deploy.rb recipe file and run actions that
    are passed as arguments. It does this by looking for a Capfile in the current
    working directory that tells it which deploy to load.


    ```

    # With cap command and arguments

    local$ cap -f config/deploy.rb my_custom_task


    # The same command, but even simpler!

    local$ cap my_custom_task

    ```


    for a before and after task and call each one at the appropriate time if it exists.
    This was how you would write callbacks in Capistrano 1.x. In Capistrano 2, there
    is a more event-driven callback mechanism with methods called before() and after().


    I mentioned earlier that the deploy task calls three other tasks. It gives you
    a total of four tasks that you can hook in. If you write a task named before_deploy,
    Capistrano will execute it in advance of the rest of the deployment process. Similarly,
    after_deploy will run after the deployment task.


    Here is a short bit of pseudocode that illustrates how this works:


    ```

    --> before_deploy

    deploy do

    --> before_update_code

    update_code

    --> after_update_code

    --> before_symlink

    symlink

    --> after_symlink

    --> before_restart

    restart

    --> after_restart

    end

    --> after_deploy

    ```


    In addition, Capistrano automatically creates callbacks for each of your own tasks,
    opening a world of possibilities.'
