- img_proc: true
  md: 'is colocated in one database, and data for other users or functions is stored
    in another database. For example, you might choose to store all the users whose
    names start with A-L in one database and M-Z in another. Or, you may choose to
    keep records based on geography, so you could store Japanese records in a database
    in Japan and Canadian records in a database located in Canada. Perhaps you can
    easily organize your database by data and time: a news site may store the most
    recent articles on one server and archived files on another. Sharding is highly
    application dependent, so I can''t really do a good job of discussing approaches
    in a generic way within the scope of this book. You can imagine how complex this
    may make your application, though.


    # Challenge 4: The Official MySQL Cluster Is Limited


    So far I''ve been using the term cluster in a pretty generic sense and will continue
    to do so because it''s the best word to use for this situation. However, MySQL
    distinguish between replication and clustering, and they''re right to do so. In
    this book, the way that we implement the cluster is through MySQL replication
    features. Recall that the replication features are asynchronous and are not really
    meant to be used to create a cluster. Unfortunately, the fact is that the MySQL
    cluster will not satisfy the requirements for most projects because of a number
    of limitations. As we will see soon, MySQL replication simply works better to
    create a "poor man''s cluster"


    The official MySQL cluster feature uses a different data store called NDB. Like
    ISAM and InnoDB, NDB changes the way MySQL works and has its own advantages and
    disadvantages. Unfortunately for most people, the disadvantages and limitations
    will significantly outweigh the advantages. In my opinion, NDB borderlines on
    useless for most applications. If one of the replication approaches presented
    here doesn''t work for you, then you''re far off seeking a synchronous clustering/replication
    technology for MySQL. It is possible you might need to seek out a different NDB
    data store, http://dev.mysql.com/doc/refman/4.1/en/mysql-cluster-limitations.html.


    As you may be thinking by now, a scale-up approach for the database may be an
    easier solution. After all, you can build a monstrous database server with sixteen
    cores, 16GB of RAM, four independent network interfaces, sixteen SCSI disks, and
    a RAID controller with battery backup and 64MB of cache RAM. But that sounds expensive,
    and'
