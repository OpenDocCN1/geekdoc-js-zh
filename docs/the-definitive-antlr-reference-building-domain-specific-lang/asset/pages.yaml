    up the balancer members with your Rails application! The cool thing is that it''s
    really no different from what you''ve seen so far. It''s just another proxy balancer
    on another server. You already know most of what you need, let''s step through
    it together.


    # Apache as a Mongrel Proxy


    As you recall, Mongrel is a cool little web server''s custom-tailored to serve
    a single request through the Rails share-nothing architecture. Therefore, you
    need to run multiple Mongrels to allow multiple users of our application to use
    your site concurrently. Otherwise, your users would all be waiting in line for
    a single Mongrel server. You''ve just learned in the previous section that Apache
    can balance requests across multiple servers, so let''s do that for Mongrel now.


    First remember that you''re no longer on the same virtual machine as before. You''re
    done with the software load balancer and are now working on one of the balancer
    members.'
