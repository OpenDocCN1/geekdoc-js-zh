  md: "slave will read from when replicating data. The second line, server-id, is\
    \ a unique identifier for the server, in this case, 1. Restart the master server\
    \ using this:\n\n```\n# Restart MySQL -- My conservative nature leads\n# to avoid\
    \ restart scripts for major changes.\n/etc/init.d/mysqld stop\n/etc/init.d/mysqld\
    \ start\n```\n\nNext, you should start the slave, which is easier. You don't need\
    \ to use the binary logging on the slave. Add the server ID to the slave, choosing\
    \ a different ID, of course, and then restart the slave as you did the master:\n\
    \n```\n# /etc/my.cnf on SLAVE\n# Following line added below the [mysqld] section\n\
    server-id=2\n```\n\nYou should now log the master as slave and query the replication\
