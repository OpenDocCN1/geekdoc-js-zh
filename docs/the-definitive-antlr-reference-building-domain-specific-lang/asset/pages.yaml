    # 2.1 The Lay of the Land


    The first enhancement to the basic deployment map is shown in Figure 2. The following
    list explains what you''ll need to accomplish in this chapter:


    +   - Set up source control. If you haven''t already done so, setting up source
    control will make the rest of your deployment picture much simpler and will improve
    your development experience as well.

    - Prepare your application configuration and performance. You will make some simple
    changes to your application or, better yet, build it right the first time.


    The three Rails environments—development, test, and production—will make it easy
    for you to isolate configuration for deployment. The rest is just common sense.
    It all starts with source control.'
