  md: '# COMMON BOTTLENECKS


    +   * Includes: When you have associations that know you will use from the results
    of a find, you can use the :include option. With the include option, you''ll generate
    one SQL query instead of many.


    +   * Piggybacked attributes: Active Record dynamically builds objects from the
    objects in the result set for any given find. You can often add attributes to
    a result set with SQL. I''ll show you more in a moment.


    +   * Custom SQL: You can build custom SQL to return exactly what you need.


    +   * Selects: If you don''t need all of the columns of a database, you can eliminate
    the additional overhead by simply using the select option. Select specifies which
    columns you want to retrieve from the model''s database table. By default, ActiveRecord
    Returns all of them.


    # include and the N+1 Problem


    By default, Active Record relationships are lazy. That means the framework will
    wait to access a relationship until you actually use it. Take, for example, a
    member with an address. You can open the console and type this command: member
    = Member.find 1. You''ll see the following appended to your log, as follows:


    ```

