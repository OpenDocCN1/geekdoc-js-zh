  md: '# 3.11 Conclusion


    When possible, I can run applications on a VPS or dedicated server. However, I
    still have several shared-hosted applications that run with an acceptable degree
    of reliability. By following the steps mentioned here, you can also run small
    applications reliably on an inexpensive, affordable shared host.


    In this chapter, you learned to set up a typical shared hosting Rails environment.
    You also learned that you can''t push shared hosts too hard, and you can''t rely
    on them for perfect service. In the next chapter, you''ll see the alternative:
    virtual and dedicated hosting. If you''re bursting at the seams and hearing your
    neighbor through paper-thin walls, it''s time to move up. Read on.'
