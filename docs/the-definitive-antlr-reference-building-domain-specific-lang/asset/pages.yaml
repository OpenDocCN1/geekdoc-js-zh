  md: "because my page caches of my most active pages depend on a relatively narrow\
    \ list of model objects:\n\n```\nclass GiftSweeper < ActionController::Caching::Sweeper\n\
    observe Gift\n```\n\n```\ndef after_save(record)\n  self.class::sweep\n  end\n\
