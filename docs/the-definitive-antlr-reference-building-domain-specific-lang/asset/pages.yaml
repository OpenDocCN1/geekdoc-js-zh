  md: "# Setup Apache:web:enable tasks to Use the Maintenance Page\n\nThe deploy:web:enable\
    \ tasks your server will serve the public/system/maintenance.html page instead\
    \ of the real site, if the maintenance page exists. Add the following Rewrite\
    \ directive to your Apache config or your .htaccess in order to make deploy:web:disable\
    \ work correctly:\n\n```\nRewriteCond %{DOCUMENT_ROOT}/system/maintenance.html\
    \ -f\nRewriteCond %{SCRIPT_FILENAME} !maintenance.html\nRewriteRule ^.*$ /system/maintenance.html\
    \ [L]\n```\n\nThis rewrite rule says that if there is a file called %DOCUMENT_ROOT%/system/maintenance.html,\
    \ rewrite all requests to /system/maintenance.html. With that rewrite rule in\
    \ place, if the maintenance page exists, the web server will deliver it to satisfy\
    \ any requests to this application regardless of what URL they requested.\n\n\
    In the following code, I use a script called the reaper that does the trick:\n\
    \n```\nset :use_sudo, false\nset :run_method, :run\n\nnamespace(:deploy) do\n\
    \  desc \"Restart with shared-host reaper\"\n  task :restart do\n    run \"#{current_path}/script/process/reaper\
    \ --dispatcher=dispatch.fcgi\"\n  end\n```\n\nNotice that the :restart is defined\
    \ inside the namespace(:deploy) block. Capistrano 2 namespaces let you collect\
    \ related concepts into a central grouping of names. The method namespace takes\
    \ a single parameter, defining the namespace, and a code block. All of the Capistrano\
    \ tasks in the code block will be part of that namespace. In this case, I am adding\
    \ the :restart task to the default namespace. I'll create all the deploy-related\
    \ tasks inside that namespace. To call this restart task in the deploy namespace,\
    \ you need to specify the namespace, like this:\n\n```\nlocal$ cap deploy:restart\n\
    ```"
  merge: -1
