  md: '# Packing Up


    # Chapter 2


    # Refining Applications for Production


    Before you can move into your new house, you need to pack up. With Rails, you
    need to do the same thing: prepare your Rails application for deployment.


    You''ll need to organize your code and prepare it for production. Specifically,
    you''ll need to think about a few things:


    +   * Making your source code repository work smoothly with your production setup
    to make your deployments go smoother and more secure

    * Strengthening your brittle migrations to save you from models that change and
    developers collide

    * Locking down Ruby, Rails, and Gems to a single, stable version


    Fundamentally, you want to build every application with deployment in mind. The
    earlier you think about deployment issues, the better off you''ll be.


    I''m not saying you need to make early deployment decisions at demand time. You
    just need to make sure you build intelligent code that is less likely to break
    in production situations. Your first order of business is to simplify your Subversion
    setup.'
  merge: -1
