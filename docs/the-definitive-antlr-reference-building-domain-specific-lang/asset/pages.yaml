    database entirely.


    # 7.9 Summary


    If I haven''t exhausted the subject of scaling out, then at the very least I must
    have exhausted you. In this chapter, I gave you a number of tools to build convincingly-performance
    infrastructure for Ruby on Rails. You learned to configure A records and CNAMEs
    for a cluster. Then, you learned to dabble in virtualized servers with VMware
    and Parallels. You also learned to deploy to those virtual servers with Capistrano.


    Next, you learned to build both Apache and nginx servers to serve as load balancers,
    secured servers, and static proxies. Apache demonstrated its flexibility and modularity
    as a Mongrel proxy and load balancer. For those interested in simplicity and performance,
    and a few more battles, nginx shines brightly. With some better documentation
    it could become a popular alternative to Apache and possibly the new kind of lightweight
    web servers.


    Finally, I tackled one of the more daunting tasks of Rails deployments: clustering
    a MySQL database. Although there are more powerful databases for clustering, MySQL
    ultimately handles the job effectively, if not gracefully. I''m happy to have
    MySQL despite its shortcomings, because it makes up for its spikes in other areas,
    including community and Rails support. And you can''t beat the price.


    Before I move on, I should warn you that you can find books most of the topics
    in this chapter. If you''re a developer, I encourage you to explore each one more
    deeply if you re serious about deploying a massively scalable website. Stepping
    out of your developer shoes and dealing with operational tasks will grow you as
    a person and developer. Or at the very least, you''ll be a little nicer to your
    system administrator because of your new appreciation for the role. And if you''re
    an admin, you can better understand the foundations of your deployment. I''ve
    just scratched the surface.


    In the next chapter, I''ll dive into some basic performance topics. You''ll learn
    how to benchmark and profile systems for performance. You''ll also see some solutions
    to Rails bottlenecks such as caching and eager loading.'
