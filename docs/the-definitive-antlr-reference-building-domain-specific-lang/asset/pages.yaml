  md: '# SCALING OUT WITH CLUSTERING


    # Joe Asks...

    Why Bother with Virtualization for Scaling Out?


    Virtualization has many advantages for scaling out. Primarily, you can configure
    your application to scale out sooner. You can probably get at least two or more
    private servers for the same price as a single dedicated server. You gain most
    of the advantages of redundancy and increased performance sooner, you can always
    switch to a dedicated box later, with a reduced impact to your configuration and
    less down-time. Personally, I choose to run virtualized environments on a dedicated
    server. I find them easier to manage and configure. Advances in hardware and software
    have made virtualization technology fast, and the benefits far outweigh any marginal
    performance.


    You will need two virtual machine instances. With most of the software technologies
    mentioned earlier, you can build and simply copy the virtual machine files, changing
    only some identification information such as the IP address and the hostname.


    Once you have your virtual machines up and running, create the database and deploy
    your application with Capistrano to one of them using the techniques you learned
    in the earlier chapters. You can deploy your application in its simplest form
    so you can start up with Mongrel and access your application via a web browser
    by hitting the Mongrel server.


    Any application will do, but it should be more than an empty Rails app. If you
    need an application to work with, try using the example from *Agile Web Development
    with Rails* found at http://www.pragprog.com/titles/rails2/source_code.


    You can find entire books about the administration of Linux, Apache, and MySQL.
    I may skip some steps here and there to keep your focus on topics specific to
    Rails deployment. When I do, I''ll try to direct you to other resources when necessary
    to further tighten security or tweak performance.'
