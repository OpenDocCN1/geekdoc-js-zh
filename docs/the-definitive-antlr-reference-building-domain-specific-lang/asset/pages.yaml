    So Do I Use An Record or a CNAME?


    When I requested the A record, CNAME issue for myself, I remember coming across
    debates over various uses and abuses of CNAME records and advantages and disadvantages
    of different configurations. My conservative nature led me to avoiding different
    playing games, so I generally follow the rules:


    +   - Use A records for mappings of names to IP addresses.

    - Use CNAME records to alias records.


    domain (brainpl.at) is an A, or address, record in DNS terms. This record maps
    brainpl.at directly to your IP and is the lowest-level mapping.


    **CNAME records** CNAME records are like aliases, be it one of your or someone
    else''s aliases. Aliases usually indicate the kind of service that a server provides.
    For example, www.brainpl.at is an alias to brainpl.at that indicates interest
    in the HTTP server, and ftp.brainpl.at indicates interest in the File Transfer
    Protocol. Keep in mind that longstanding conventions exist, and you should follow
    whatever you can.¹


