    # Prerequisites


    If you don''t have access to a hosted virtual private server (VPS), you can set
    a couple of virtual machines up on your desktop. For Windows users, both VMware
    and Microsoft Virtual PC are free for commercial use. Linux users have commercial
    and free options including VMware, Xen, or OpenVZ. Mac users can use Parallels
    or VMware, neither of which is free. Check for free trials if you''re not sure
    which to buy. I prefer VMware, but any one of them will work.


    These virtual machine technologies work in a similar way to what a VPS host will.
    They will allow you to install an entirely separate operating system in a contained
    environment that acts like a computer within your computer. In fact, if you''re
    considering a VPS hosting service and aren''t sure how memory or disk space you
    need, you can test various configurations with these “home versions” to artificially
    constrain system resources. Try running your application in a 256MB VMware virtual
    machine before committing to 12 months of a 256MB managed Xen VPS.'
