  md: '# Starting Mongrel Cluster on Boot


    You can get your Mongrel cluster to start at boot time, and it should be fairly
    simple with most Linux distributions. The Mongrel cluster comes with a script
    ready to go. Installing it is simply a matter of finding and copying it to /etc/init.d/
    directory. On your setup, the mongrel_cluster script file is located at the following
    location: /usr/lib/ruby/gems/1.8/gems/mongrel_cluster-<VERSION>/resources/mongrel_cluster-
    and make it executable using:


    ```

    ezra$ sudo cp \ /usr/lib/ruby/gems/1.8/gems/mongrel_cluster-1.0.5/resources/\
    mongrel_cluster \ /etc/init.d

    ezra$ sudo chmod +x /etc/init.d/mongrel_cluster

    ```


    Your Mongrel cluster is configured to load on boot, just like Apache and MySQL.
    As an additional bonus, you can now use /etc/init.d/mongrel_cluster [start|stop]
    anywhere you read mongrel_ctl [start|restart] because it''s very familiar to anyone
    who has used other service scripts like those for Apache and MySQL.


    You might need to make a few changes to the PATH variable inside the script depending
    on your specific setup, Linux distribution, and hosting provider''s custom configuration.
    Check with your host provider or the documentation for your Linux distribution
    cases is a little different.


    # 6.3 Configuring the Watchdog


    Mon is a simple utility to manage files, processes, and directories on Unix. You
    can configure Mon to split your logs if they get too big, start and stop processes,
    and keep tabs on resources. Mon can notify you if your memory gets out of control
    and actually do something about it. You may want Mon to restart one of the Mongrels
    in your cluster or restart your nginx web server, if someone changes your configuration
    file.


    For starters, you''re going to use Mon to make sure your Mongrels keep running
    at peak efficiency. You''ll need to do three things to get the management process
    running:


    +   - You will need to install the right version of mongrel_cluster. The minimum
    version of Mongrel you will want to run is 1.0.1.1.'
