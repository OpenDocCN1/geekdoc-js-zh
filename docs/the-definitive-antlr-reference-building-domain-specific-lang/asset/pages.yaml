  md: 'Even if you get your initial memory size wrong, VPS system is very easy to
    upgrade. If you need more RAM, disk space, or other resources, usually all you
    have to do is request these from your host and reboot your VPS. When it comes
    back online, you will have the new resources available without the need to change
    anything in your settings to take advantage of them. Another benefit of the virtual
    server approach is the ability to easily migrate your entire server to another
    physical box or host when the time comes. If you choose the right provider, upgrading
    with your traffic should happen smoothly.


    # Using Lightweight Web Servers


    Mongrel is emerging as the facto method of deploying a Rails application on a
    VPS. You can run a blog or smaller apps on one Mongol own. Should you need another
    web server in front of Mongrel for static content, using nginx or httpd can be
    a huge win. These servers use fewer resources than Apache and are very fast. If
    you want an alternative to Mongrel, nginx and httpd have FastCGI support that
    is top-notch and stable.


    Most hosting providers offer a number of Linux distributions to choose from. Primarily,
    you want a distribution with a minimal footprint. When you run on a smaller memory
    system, make sure to install only what you need and no more. From there, you should
    build only what you need. In the end, you will come out with a leaner, faster
    server.


    The instructions for setting up a VPS are basically the same as setting up a dedicated
    server. You''ll need to know a little more about dedicated hosting before I move
    into the setup tutorial.


    # 4.3 Dedicated Servers


    Say you have written the latest Rails web 2.0 application and a shared host is
    no longer enough. Your shared host admin is screaming at you not responding to
    your requests for support quickly enough, and you''ve decided to either challenge
    him to a duel or switch to a higher plan. It''s time to move. You''re ready for
    root, and your customers are ready to see your fabulous content without the dreaded
    spinning globe, or whatever icon your browser is showing these days.


    With a dedicated server, you don''t have to worry about memory constraints or
    disk space as much. A good starting system would have a'
