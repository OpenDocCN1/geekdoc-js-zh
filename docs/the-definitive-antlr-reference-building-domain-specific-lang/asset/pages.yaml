  md: '# The Well-Behaved Application


    # 3.9 The Well-Behaved Application


    The shared hosting environment is a jungle of constantly changing elements. One
    of the other peaceful cohabitants of your server may momentarily take the lion''s
    share of resources. Your host may upgrade software or hardware for maintenance
    or out of necessity. Your host may enforce resource limits and kill your application
    if it b down the CPU for too long. By following a few simple guidelines, you can
    make your application behave as well as possible and also protect yourself from
    other poorly behaved applications.


    # One Rails App per User


    Some shared hosts allow you to create several user accounts, and each user account
    has its own memory allowance. So, you will benefit if you run one Rails application
    per user account. If you need to run another application, you should create a
    new user account and run the app under that user.


    # Be Miserely with Memory


    A Bare Rails application with no other libraries will use 30MB to 50MB of memory.
    Adding the RMagick image manipulation libraries can easily push to more than 100MB.
    Unlike VPS servers, shared servers don''t usually sell plans where a fixed amount
    of memory is guaranteed to your application. However, there is a fixed amount
    of total memory available to all applications on the server, and some shared hosts
    will kill processes that use more than their share, usually 100MB.


    This practice of killing processes is especially problematic if you are trying
    to run the lightpd web server. If the host''s maintenance kills your lightpd daemon,
    lightpd will not restart automatically. To make matters worse, some hosts restrict
    the use of automated scripts that restart dead or zombified FastCGI processes.
    Even though the Apache server can leak memory when running FastCGI, it will automatically
    restart them if they have been killed. The bottom line is that you need to conserve
    memory and make sure you don''t have any leaks. Rails doesn''t have any silver
    bullets for dealing with memory leaks, but I''ll tell you what I know throughout
    the chapters that follow.


    The cruel reality is that a Rails app can outgrow the shared environment. I wrote
    an application for a client that used several large libraries including RMagick
    and PDF::Writer. The overall memory'
