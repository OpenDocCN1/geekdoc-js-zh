  md: '# Securing SSH


    Most experienced *nix admins tend to run sshd on high port numbers. Here''s why.
    Crackers commonly create automated attacking programs bots that crawl the Net,
    visiting one machine after the next to find machines with a running SSH daemon.
    Then, the use an automated script with a dictionary to try many combinations of
    usernames and passwords. The attacks are so prevalent that these days most servers
    on the Internet will experience this kind of attack with some frequency. If you
    have a login/password combination on a live SSH port, you''re toast, especially
    if sshd is on the standard port 22. Since most of these attack bots will not scan
    ports higher than 1024, you should always assign sshd to a free port above 1024.


    Modify the port for sshd by editing /etc/ssh/sshd_config. Edit the line that looks
    like this:


    ```

    Port 22

    ```


    Change it to:


    ```

    Port 8888 # or any unused port above 1024

    ```


    Then save the file and quit the editor. And don''t forget to restart the SSH server
    daemon.


    Now press the Escape key, and type :wq. This means file and quit.

    For security''s sake, you don''t want to allow SSH root logins because an unauthorized
    login would be disastrous. Edit /etc/ssh/sshd_config, replacing this line:


    ```

    PermitRootLogin yes

    ```


    with this one:


    ```

    PermitRootLogin no

    ```


    Now reload it /etc/ssh/sshd_config to pick up the new settings:


    ```

    root /etc/init.d/sshd reload

    * Reloading OpenBSD Secure server''s configuration sshd [ ok ]

    ```


    For security and make things easy on yourself, using SSH keys instead of public/private
    keys and get them installed on our new server: the key generation is done on your
    local machine:


    ```

    local$ ssh-keygen -t dsa

    ```'
  merge: -1
