    You can use the technique whenever you now use relationships in a given query.
    include does have limitations. If you need to reporting, you''re almost always
    better off simply grabbing the database connection and bypassing Active Record
    all together with ActiveRecord::Base.execute("SELECT * FROM...") to save the overhead
    related to marshaling Active Record objects. Generally, eager associations will
    be more than enough.


    # Other Active Record Options


    Controlling your associations with :include and defining exactly which columns
    you want with :select will give you most of the performance you need. Occasionally,
    you will need a few extras to get you all the way home.


    Nested sets: Rails provides a convenient tree for dealing with hierarchies of
    data. If you''re not careful, you can easily build an application that does a
    query for each node in the tree. When you need to find all nodes in one section
    of the tree, such as with catalogs, you will be better off using a nested set.
    You can read more about the Rails documentation.


    Smart inheritance: The Rails model of inheritance is single-table inheritance.
    That means every Active Record model that participates in an inheritance hierarchy
    goes into the same table. If you need to build models that inherit too deeply,
    you will cram too much into a single table. You can use polymorphic associations
    instead of inheritance to represent concepts such as an address or a common base
    class.


