  md: 'Once it''s installed, you can configure additional read-only databases in your
    database.yml file:


    ```

    production:

    database: my_app_master

    host: master_host

    ```


    ```

    read_only_a:

    database: my_app_slave

    host: slave-a

    ```


    ```

    read_only_b:

    database: my_app_slave

    host: slave-b

    ```


    Applying the plug-in to your model classes is straightforward, and when you do
    so, your finders will behave differently. They will use the read-only databases
    specified in the parameter of the declaration. So, for example:


    ```

    class Product < ActiveRecord::Base

    acts_as_readonly [:read_only_a,:read_only_b]

    end

    ```


    Here I''ve chosen to use two read-only databases. However, I think we can do bit
    better. We can use this approach to achieve a sort of "poor man''sharding," by
    simply being selective about which read-only database is used by each model. For
    example:


    ```

    # partial database.yml

    ...

    read_only_products:

    database: my_app_slave

    host: slave-products

    read_only_articles:

    database: my_app_slave

    host: slave-articles

    ```


    ```

    # product.rb

    ...

    class Product < ActiveRecord::Base

    acts_as_readonly [:read_only_products]

    end

    ```


    ```

    # article.rb

    ...

    class Article < ActiveRecord::Base

    acts_as_readonly [:read_only_article]

    end

    ```'
