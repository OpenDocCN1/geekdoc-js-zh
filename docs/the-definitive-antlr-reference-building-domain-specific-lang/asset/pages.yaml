    # 5.7 Troubleshooting


    Since Capistrano executes remotely on the target server via SSH, debugging can
    be difficult. These tips can help you troubleshoot your scripts when things goes
    wrong.


    # The current Directory Can''t Exist as An Actual Folder


    Capistrano is a tremendously convenient tool, but it''s part of your infrastructure.
    As with Rake or other Rails scripts, you might find debugging Capistrano recipes
    a little intimidating. Take heart, though. It''s all Ruby code.


    Shared hosts often give you a directory called current as part of the overall
    setup process. The recipes that I''ve shown you will create that directory for
    you. You''ll want to delete the host''s version.


    # Migrations Out of Sync with Code Bose


    Capistrano usually makes it easy to deal with migrations if you follow the precautions
    I laid out in Chapter 2, Refining Applications for Production, on page 20. That
    chapter laid out what you should do to keep your migrations well behaved. If you''ve
    got yourself into trouble, keep these tricks up your sleeve to get you back out.


    One problem can occur with partially completed migrations. If a migration has
    a bug in the up() or down() method, your migration might leave your database in
    an inconsistent state, or you may be lucky and need only to set the version number
    correctly. If your version number is wrong, you need to reset it with a SQL query.
    You can easily do so in the console or from the Rails script runner. Rails crashes
    in44 before setting the version in the schema information, so your migrations
    are always crashing on number 43. You can set the version


    > 5. Alternatively, you can use the transactional_migration plug-in at http://www.redhillionrails.org/#transactional_migrations.'
