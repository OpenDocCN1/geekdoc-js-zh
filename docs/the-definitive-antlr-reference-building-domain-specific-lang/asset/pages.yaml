    # Lazy Evaluation of Variables


    Sometimes you want to define a variable that uses other variables that haven''t
    been defined yet. No problem. You can enclose your variable within {}, and Capistrano
    will use lazy evaluation. For example:


    ```

    set(:released_stylesheets_dir, "#{#{release_path}/public/stylesheets")

    ```


    In the previous example, Capistrano will evaluate #(release_path) when it uses
    the string. Lazy evaluation lets you wait until a bind variable takes value, increasing
    your flexibility.


    # Standard Variables and Their Default Values


    Capistrano has many different predefined variables. You can set them to configure
    different tasks in different ways. Capistrano creates them for use with your tasks
    or within other custom variables that you set. These are some of the predefined
    variables and their associated uses:


    +   * application has no default. This variable has the name of your application.
    Other variables such as deploy_to use this variable. You will probably want to
    set this to the domain name of the application or to the preferred nickname for
    your application.


    +   * repository has no default. This variable defines the address of your Subversion
    repository containing the code you want to deploy.


    +   * user defaults to the currently logged-in user. This variable defines the
    SSH user Capistrano will use to deploy the application. If your username on your
    deployment machine is the same as your SSH username, then you can use the default
    value. This user account will also be used to check out code from the repository
    and perform sudo commands during the deployment process.


    +   * deploy_to defaults to /u/apps/#{application}. This variable defines the
    target deployment directory.


    +   * use_sudo defaults to true. Capistrano often needs to run commands under
    the root user. You can suppress this behavior by setting use_sudo to false.'
