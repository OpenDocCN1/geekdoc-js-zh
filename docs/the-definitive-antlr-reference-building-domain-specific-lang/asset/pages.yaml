  md: '# DEVELOPING ON WINDOWS AND DEPLOYING SOMEWHERE ELSE 221


    You can figure out what path you should use by connecting to your remote host
    and typing which ruby.


    This is a problem if your hosting platform is using FastCGI because the FastCGI
    server will be unable to locate the Ruby interpreter. If you''re using Mongrel,
    it''s not really a concern.


    # Line Breaks


    Linux uses different line breaks than Windows. This can sometimes be a problem
    because the extra character that Windows uses can interfere with how scripts are
    processed. Many Linux distributions have a program called dos2unix you use to
    convert the line breaks in your files.


    The best solution is to find yourself a good editor for Windows that allows you
    to specify what type of line breaks are used. Eclipse, NetBeans IDE, Notepad++,
    and Crimson Editor are just a few examples of editors that are known to work correctly.
    Windows Notepad should be avoided at all costs, as well as WordPad, because they
    are meant for Windows-formatted files.


    # Permissions


    When you deploy your application to a Linux server, you need to check permissions.
    If your server uses FastCGI, then you need to make sure that you allow the web
    server''s user and group the right to execute public/dispatch.fcgi, or your application
    is not going to work. If your application uses page caching, ensure that the public/
    folder is writable by the web server''s user, or Rails will be unable to write
    the static versions of the pages.


    # Preventing Problems When Deploying


    Follow these tips to make deploying an application to production from Windows
    to Linux:


    +   - Create the application on the Linux machine using the rails command. This
    will put all the files in the right locations and make that the paths are correct.


    +   - If your production server or web host uses Apache and FastCGI for Rails
    application hosting, be sure to modify your copy of public/.htaccess on your server
    so that dispatch.fcgi is called instead of dispatch.fcgi.'
