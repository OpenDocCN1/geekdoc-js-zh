  md: 'You may be asking yourself “Who monitors Monit?” That is a great question.
    Monit is usually very stable, but certain conditions such as “out of memory” can
    cause Monit itself to crash. If you want to prevent this from happening, you can
    put Monit under the control of init. On a Linux system, init is responsible for
    running all the scripts in /etc/init.d and can also spawn daemons if they die.
    The first step is to remove Monit from the /etc/init.d scripts. Consult the documentation
    for your system for information on how to remove a start-up script from the default
    run level. On Gentoo, you can do it by running rc-update monit. The next step
    is to edit /etc/init.d and add the following lines near the bottom of the file:


    ```

    mo:45:respawn:/usr/bin/monit -Ic /etc/monitrc

