    +   - sudo /etc/init.d/apache2 start

    - sudo /etc/init.d/apache2 restart

    - sudo /etc/init.d/apache2 stop

    - sudo /etc/init.d/apache2 configftest


    The configtest option will often give some insight into any problems if the server
    is failing to start.


    To test the cluster and see how it behaves, you should put something interesting
    and uniquely identifiable in the /var/www/html/index.html file of your balancer
    members. That way, you can watch how your balancer distributes requests between
    them by refreshing the balancer URL. Everything is working properly, you should
    see the page alternating between the two balancer members.


