- img_proc: true
  md: '# RUBINIUS 255


    garbage collector, that were not available when Matz’s Ruby Interpreter (MRI)
    was created. The team proclaims the goal that “anything can be written in Ruby
    will be easier to extend. The pure Ruby core makes it easier. The compiler (also
    written in Ruby) generates bytecode, making the resulting programs more efficient
    than the current strategy uses. The virtual machine will come with a packaging
    and deploying strategy for Ruby bytecode in the form of .roo files (Ruby Application
    Archive). This structure will allow you to package all of your code for a project
    into one file for fast deployment.


    Rubinius is creating a test suite using RSpec-like syntax. There is no official
    spec for Ruby, this suite of tests will serve as a specification of the language.
    This test suite is making it easier for platforms such as JRuby and Iron Ruby
    to provide compatibility with the core language implementation. Having all the
    new Ruby implementations share a common suite of specs will help keep Ruby language
    from fragmenting as these implementations evolve.


    Rubinius is worth watching as a deployment platform for reasons. For a good understanding
    of the impact of bytecode on a deployment platform, look no further than Java.
    The bytecode architecture for the Java virtual machine is an extremely successful
    deployment platform that will lead to the following advantages:


    +   * Rubinius-compiled bytecode will be very efficient.

    * Rubinius bytecode will be easier to package and deploy.

    * The Rubinius virtual machines can insulate the programmer from the operating
    system, making Ruby code much more portable.

    * Virtual machines can have configurable security policies, making Rubinius applications
    potentially more secure.


    The work on mod_rubinius aims to replace the multiple parts of a typical Mongrel
    deployment strategy with a simple-to-configure, true-Ruby application server that
    can sit behind Apache server or nginx.


    Rubinius is rapidly picking up momentum. Engine Yard has six fulltime people working
    on the project to make it the de facto Ruby VM. It has already improved libraries
    for concurrency and a better strategy for providing operating systems without
    the need for a binding layer. Engine Yard’s commercial support will lead to a
    stronger, supported project. For more information, visit the site at http://rubini.us/.'
  merge: -1
