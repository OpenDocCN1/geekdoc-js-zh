  md: '# What Doesn''t Work?


    Before I walk you through the game plan for improving application performance,
    let me walk you through a few examples of approaches that we know don''t work:


    +   **Premature optimization:** Focusing on performance above all may produce
    the fastest, slickest application whether you actually need the performance or
    not. However, you may find that this comes at the cost of code that is complex,
    hard to read, and even harder to maintain. Optimization also takes time, so you
    may also risk your project schedule and miss deadlines due to features taking
    too long to implement because of the additional performance enhancements. Instead,
    performance test your application often throughout the project. Ensure that it
    meet an acceptable level of performance for your needs, and optimize only the
    critical bottlenecks as required.


    +   **Guessing:** When you find that your application is too slow, you may be
    tempted to guess where the problem might be. You may hack through various performance
    optimizations in an attempt try fix it. You may guess right or twice, but you''ll
    eventually spend hours on the right solutions to the wrong problems. Instead,
    use profiling tools, load-testing, and monitoring tools to pinpoint the problem
    areas before implementing any performance patches.


    +   **Caching everything:** Rails makes caching fairly easy, so you might just
    think that caching will save you at the last minute. But caching is always harder
    than it looks on the surface. This enigmatic performance enhancement creates opportunities
    for bugs to creep into production where they weren''t seen in testing, because
    cached features can be hard to test. It''s especially dangerous to enable caching
    at the last minute and hope that it will work. Instead, try to identify potential
    hot spots early, as your home page or latest news feed. Then, design those features
    with caching in mind, and use a staging environment where caching is enabled so
    that you can test the application as it will be in production.'
