  md: '# Appendix A


    # # An Example nginx Configuration


    In Chapter 7, Scaling Out, on page 144, I based Apache and nginx configurations
    on existing configurations. I used the base configurations that came with Apache
    as a foundation for web server, but nginx has no consensus base configuration
    for Rails. The following configuration, complete with comments, serves as the
    foundation for the nginx configurations in this book:


    ```

    Download: nginx/nginx.conf

    # user and group to run as

    user ezra ezra;


    # Nginx uses a master -> worker configuration.

    # number of nginx workers, 4 is a good minimum default

    # when you have multiple CPU cores I have found 2-4 workers

    # per core to be a sane default.

    worker_processes 4;


    # pid of nginx master process

    pid /var/run/nginx.pid;


    # Number of worker connections. 8192 is a good default

    # Nginx can use epoll on linux or kqueue on bsd

    events {

    worker_connections 8192;

    use epoll; # linux only!

    }


    # start the http module where we configure http access.

    http {

    # pull in mime-types. You can break out your config

    # into as many include''s as you want to make it cleaner

    include /etc/nginx/mime.types;

    ```'
