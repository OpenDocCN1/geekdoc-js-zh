  md: 'The signals that Mongrel understands include the following:


    TERM Stops Mongrel and deletes the PID file.


    USR2 Restarts Mongrel (new process) and deletes the PID file.


    INT Same as USR2. This command is a convenience because `Ctrl+C` generates an
    interrupt signal and `Ctrl+C` is used in debug mode.


    HUP Internal reload. This command might not work well because sometimes an internal
    reload will not reload all code in the system. You are safer if you do a real
    USR2 restart.


    You can see these signals with the `kill` command:


    ```

    ezra$ kill -HUP 27333

    ```


