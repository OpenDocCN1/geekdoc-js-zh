  md: "# LOCAL AND REMOTE SETUP FOR RAILS\n\nGenerate your deployment file now by\
    \ typing the following command:\n\nlocal$ cd my_rails_app\nlocal$ capify .\n[add]\
    \ writing ./Capfile'\n[add] writing ./config/deploy.rb'\n[done] capified!\n\n\
    Let's break down what just happened.\n\ncapify is the Capistrano script. The dot\
    \ tells it to install in the current directory. Alternatively, you can provide\
    \ the full or relative path to your Rails app. The command creates a config/deploy.rb\
    \ file, which contains the deployment hosts, and Capfile, which tells Capistrano\
    \ to load its default deploy recipes and where to look for your deploy.rb when\
    \ you run cap deploy from inside your Rails application.\n\n# Customize config/deploy.rb\n\
    \nHere is a first glance at the default deploy recipe file that the capify created\
    \ for you:\n\nset :application, \"set your application name here\"\nset :repository,\
    \ \"set your repository location here\"\n\n```\n# If you aren't deploying to /u/apps/#{application}\
    \ on the target\n# servers (which is the default), you can specify the actual\
    \ location\n# via the :deploy_to variable:\n# set :deploy_to, \"/var/www/#{application}\"\
    \ \n```\n\n```\n# If you aren't using Subversion to manage your source code, specify\n\
    # your scm below:\n# set :scm, :subversion\n\n\n\n\nnrole :app, \"your app-server\
    \ here\"\nrole :web, \"your web-server here\"\nrole :db, \"your db-server here\"\
    , :primary => true\n```\n\nThere's no rocket science in deploy.rb. The :application\
    \ symbol defines the deployment target application name. The :repository symbol\
    \ defines the Subversion repository for the application. The next three roles\
    \ define the machines that serve as the app, web, and database servers for your\
    \ application. Most applications will need to set a few variables depending on\
    \ the installed location of the application, the user deploying the app, and the\
    \ web servers involved."
