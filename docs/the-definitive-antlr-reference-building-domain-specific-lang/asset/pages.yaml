    can give Pen a quick test, but first make sure your Rails is running with Mongrel
    as described previously. Open a command window, and navigate to C:\pen. Execute
    the following command to start Pen:


    ```

    pen -f 80 localhost:4001

    ```


    This tells Pen to listen on port 80 and forward all requests to localhost:4001.
    If your Mongrel service is still running, this command will make your application
    active on port 80.


    Now open http://localhost in your browser, and you should see your Rails app.
    The -f switch keeps Pen from going into the background. If you forget this switch,
    you''ll have to kill Pen using the Windows Task Manager.


    Use Ctrl+C to stop Pen and return to the command prompt.


    # # Load Balancing with Pen


    Load balancing with Pen is as easy as adding each remote and port to the command
    line. If you two Mongrel instances running, one on port 4001 and the other on
    port 4002, you would use the following command:


