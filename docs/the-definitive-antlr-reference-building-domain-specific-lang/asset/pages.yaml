- img_proc: true
  md: '# REVERSE PROXY AND URLS


    > A Note About relative_url_root

    At first glance, it looks like most problems with the URLs could be solved simply
    by applying the following code to the environment.rb file:

    `ActionController::AbstractRequest.relative_url_root = ''/mytest''`

    That change fixes most of the issues, but it doesn''t fix any links written using
    url_for :only_path= false. The reverse_proxy_fix plug-in that I addresses these
    issues as well.


    I developed a simple Rails plug-in that modifies the way Rails creates URLs in
    order to address this issue. The plug-in tells Rails to prepend your external
    URL to any URLs it creates through the system. This plug-in will force all user
    requests to come back through the IIS proxy. The URLs are altered when you run
    the application in production mode, so you don''t have to worry about changing
    routes or configuration files when you deploy your application. It''s also safe
    to keep the plug-in with your application during development.


    # Installing the Proxy Plug-In


    Execute the following command (but all on one line):

    `ruby script/plugin install http://svn.napcsweb.com/public/reverse_proxy_fix`

    from your application''s root folder. Once the plug-in is installed, it asks you
    for the base URL. `http://localhost/mytest`, and press Enter. If all goes well,
    the plug-in will write the configuration file. If the configuration file cannot
    be modified, you can configure it yourself by editing the file `vendor/plugins/reverse_proxy_fix/lib/config.rb`.


    # Using the Proxy Plug-In


    Once you''ve installed the plug-in, you''ll need to restart your Rails application.
    If you''re using multiple instances of Mongrel, you''ll need to restart all instances
    before the plug-in will work. The applications restart, any internal links in
    your application will not be automatically corrected, and your users will be routed
    back through the proxy.¹13


    13. This assumes you used link_to and friends to generate your links and images.
    Hardcoded paths are not changed by this plug-in.'
  merge: -1
