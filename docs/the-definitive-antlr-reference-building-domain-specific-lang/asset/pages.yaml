  md: 'One of my favorite web application patterns is the Redirect-After-Post pattern.
    Posting is annoying because when the user hits the Back-button in their browser,
    they get prompted to resend the data. However, if you redirect them after they
    post data, their Back button behaves nicely, and their overall experience is improved.
    However, this pattern results in a very quick update to the database in one request
    and then a subsequent read within a second or two from the redirected request.
    Often, the very next request will query for the data that you just wrote.


    In the case of a multimaster cluster, if the user posts to one server and is then
    redirected to a query for the same data on another server, data may not have been
    written yet! This inconsistency could cause random instability in your site that''s
    hard to track down. When you use a multimaster cluster, use sticky load balancing
    to ensure that a given member remains on the same server for the duration of their
    browser session. Sticky balancing is not the best performing solution, but I''ll
    always choose stability over performance.


    Most web servers and hardware load balancers offer support for sticky load balancing.
    With Apache, the configuration is simple. Recall the Apache cluster definition
    from our software load balancer solution in this chapter. It looked like the following,
    but we''ve made some changes:


    ```

    # cluster.conf

    <Proxy balancer://cluster lmethod=byrequests stickysession=BALANCEID

    BalancerMember http://10.0.0.102:80 route=www1

    BalancerMember http://10.0.0.103:80 route=www2

    </Proxy>

    ```


    Did you spot the changes? In the first line I added lbmethod to the balancer to
    load balance every request, alternating the members between them. However, stickysession
    option overrides the default behavior if it finds a cookie named BALANCED with
    a valid route. If the value of BALANCE matches any of the route values of any
    balancer members, then it will ensure to balance only among members with the same
    value. It basically locks a user''s browser session into a specific balancer member
    or group of balancer members (yes, multiple balancer members can have the same
    route).


    You''re not quite done yet, though. Your software balancer itself does not set
    the cookie, so you need to ask your web servers to do that for you.'
