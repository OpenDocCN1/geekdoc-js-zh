  md: '# 7.3 Mirror Images


    Your server farm will have a number of servers across many roles. Try hard to
    keep servers in the same role configured identically. Your life will be easier,
    you will experience few surprises, and you''ll have less documentation to write.
    If identical configurations sound like too much work, you''re going to love virtualization.


    Virtual servers are like files that sit on your hard drive. You can move them,
    copy them, delete them, and back them up. When it comes to keep configurations
    the same, the easiest thing to do is just make a copy. Here are a few strategies
    for ensuring configuration consistency across your VMs, depending on the size
    and timing of the change.


    # Cold Copy It


    When you''re first setting up your environment, just configure one virtual server.
    Get that server to the point where all the software, patches, dependencies, and
    configurations are in place so you can run a single instance of your app. Then,
    make one copy for each server role, including application servers, web servers,
    and database servers.


    # Automate It


    You can often automate a change in configuration with Capistrano. You have seen
    that Capistrano scripts do a good job, use Ruby code, and can distinguish between
    server roles for different configurations.


    # Hot Copy It


    Larger, more serious configuration changes may require you to shut down the server.
    The cool thing about VMs in this case is that you can use the copy strategy. Simply
    pull one server out of your cluster, make your changes to it, and then copy it
    to replicate all the other servers in the farm. This hot copy approach lets you
    to introduce a new server into the farm to handle additional load. Be careful.
    You will want to be able to uniquely identify each server. Whenever you make a
    copy, you have to be sure to set the IP address, hostname, and any other unique
    information for each server. If possible, automate such a thing with a script
    common to each of the servers. Remember to document the process!'
