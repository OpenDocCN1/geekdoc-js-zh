  md: 'digits is hard, most of your users will refer to your site by its domain name
    instead. You will buy your domain name from a domain name service as GoDaddy,
    Network Solutions, or Enom, and you''ll get your IP address from your hosting
    service. Under the covers, Domain Name System (DNS) will associate your name with
    your IP. The Internet has several public domain name registries that associate
    IP addresses with domain names. To establish your address, you will need to do
    the following:


    +   1. Buy a domain name. They will give you a name and a way to configure the
    IP address.

    2. Pick a shared host. They will give you your IP address.

    3. Associate your name with your IP address.


    You can easily buy a domain name for as little as US$10, which means the hardest
    part is picking a name to remember and easy to spell. (I hope your name is simpler
    than EzraZygmuntowicz.com!) You can use a site such as Instant Domain Search³
    to find a name that''s not already in use.


    Most domain name registrars will also give you a web page to configure your DNS
    settings. If you cannot easily find any place to make DNS changes, contact your
    providers system to ask about DNS settings. You will want to point to your shared
    hosting company’s servers so the domain name server will forward requests for
    your domain name to your specific server.


    DNS stands for Domain Name System. It is responsible for resolving a domain name
    and returning an IP address where the service lives. Your shared hosting provider
    will give you its own name servers. When you sign up, ask the provider to give
    you DNS server addresses. They will be something like ns1.foobar.com and ns2.foobar.com.
    Take note of these addresses, go to your domain name registrar where you registered
    foobar.com, and click the section for DNS or name servers for your domain. Most
    hosts will give you two servers, but they may have more. Once you enter these
    details and save the results, it will take twelve to seventy hours for the servers
    across the world to propagate your new records. Once DNS is propagated, you can
    type foobar.com in your browser, and the domain name service will find the server’s
    IP address and route your request to your domain.


