  md: "# Cache Your Password on the Remote Server\n\nSubversion clients cache login\
    \ credentials for convenience and performance. But remember, Capistrano runs commands\
    \ in a shell on the server, not your local host. To make things work smoothly,\
    \ you need to log in to Subversion at once from the remote server so the remote\
    \ server's Subversion client caches your username and password. When you deploy,\
    \ the server will use the cached information to checkouts from the repository.\
    \ An easy way to invoke Subversion is to request a listing from your repository\
    \ from any directory on the remote server, like so:\n\n```\nezra svn list http://brainpl.at/svn/brainpl.at\n\
    Password: ******\nRakefile\napp/\nconfig/\nd/\ndoc/\nlib/\nlog/\npublic/\nscript/\n\
    test/\nvendor/\n```\n\nAfter you type the command, Subversion will prompt you\
    \ for your password and then show a list of the folders in the repository. More\
    \ important, the remote server will be able to cache your username and password\
    \ for subsequent Capistrano commands.\n\n# Run the setup and deploy Tasks\n\n\
    You are nearly done! Capistrano needs to create a few directories on the remote\
    \ server for organization, so run the setup task:\n\n```\nlocal$ cap deploy:setup\n\
    * executing 'deploy:setup'\n* executing 'umask 02 && mkdir -p /home/ezra/brainpl.at/releases\n\
    /home/ezra/brainpl.at/shared /home/ezra/brainpl.at/shared/system\n/home/ezra/brainpl.at/shared/log\
    \ /home/ezra/brainpl.at/shared/pids'\nservers: \"brainpl.at\"\nPassword: ******\n\
    \  [brainpl.at] executing command\ncommand finished\n```"
