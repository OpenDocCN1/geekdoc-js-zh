  md: '# CACHING 242


    When that fails, you can take advantage of Ruby''s duck typing instead of inheritance.
    Think of a website that uses little bits of content in many different forms across
    the whole application. Every piece of content may have a name and a description.
    If you tried to let every type of class inherit from Content, your whole application
    would be in one table. The way to solve this problem is to just add the name and
    description columns to each table that needs them. Ruby''s duck typing will let
    you treat all kinds of content the same, referring to both the name and description
    columns.


    Both polymorphic associations and duck typing can lead to better performance but
    also to much cleaner code.


    Indexes and normalization: Though Active Record hides some of the concepts from
    you, underneath you''re still dealing with a god, old relational databases. Your
    larger tables will still need indexes on the fields that you''ll access often.
    The same database normalization³ techniques will still apply.


    # 9.5 Caching


    When you need to stretch Rails for high performance, your first impression will
    be usually to cache. Before you go down the caching path, take a deep breath.
    Caching is not a silver bullet. Even in the best of circumstances, caching is
    difficult to get right, nearly impossible to test well, and unpredictable. If
    you''re not convinced, read the last sentence twice more and also the following:


    +   * *Caching is ugly.* You''ll polluting parts of your application with code
    that has nothing to do with the business problem you''re trying to solve. Rails
    can protect you from some of the ugly syntax, but not all.

    * *Caching is tough to debug.* You will add a new classification of bugs to your
    system, including stale data, inconsistent data, timing-based bugs, and many more.
    Keep in mind that it''s not just the impact of a model on one page but the interaction
    between many cached pages that give your user a strange experience.

    * *Caching is complicated.* You''ll need to consider all the pages and fragments
    that a given model can change, how to expire those


