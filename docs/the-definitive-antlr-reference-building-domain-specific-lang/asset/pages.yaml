  md: 'The master process PID is 6850, as you can see in the Parent Process ID (PPID)
    column of the output. nginx is architected as a single process with any number
    of worker processes. We are running four workers in our configuration. You can
    stop the master process with kill 15 (kill -15 6850), which will also kill the
    worker processes. If you change a configuration file, you can reload it without
    restarting:


    ```

    ezra# The -c option is only needed if your .conf file is in a custom location.

    ezra$ sudo /usr/local/nginx/sbin/nginx -c /etc/nginx/nginx.conf

    ezra$ sudo kill -HUP 614

    ```


    The first command sets up the new configuration file. The second sends a kill
    signal with HUP. The HUP signal is a configuration reload signal. If the configuration
    is successful, nginx will load the new configuration into new worker processes
    and kill the old ones. Now you know enough to run the server, stop the server,
    and configure the server. The next step is building a configuration file.


    # Configuring nginx


    nginx has a master configuration file that includes a number of other files, including
    our virtual host configurations. The master configuration file is stored at /usr/local/nginx/conf/nginx.conf.
    We''re going to add a line to the end of that file to include our virtual host
    configurations. You''re going to add only one line, but it''s important to put
    it in the right spot. You want it in the http block:


    ```

    # Partial nginx.conf

    #...

    http {

    #...

    # Include the following line at the end of the http block

    include /etc/nginx/vhosts/.conf;

    }

    ```


    Be sure to create the vhosts directory for yourself. This should seem familiar,
    because it is very much the approach you saw when setting up Apache. However,
    the nginx configuration file is not well documented with inline comments, I''ve
    done that for you in Appendix A, on page 258. Please take this time to refer to
    the nginx.conf file on your server, using Appendix A as a guide.


    There is a default virtual host built into the master configuration file that
    you should remove. As you''ll see in the next section, you''ll be'
