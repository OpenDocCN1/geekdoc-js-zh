- img_proc: true
  md: 'tells MySQL to increment autoincrement fields by each time, essentially dividing
    the total number of possible keys a server can generate by ten. The auto_increment_offset
    command is basically added to the increment. By making this offset different for
    each server, you will avoid key collisions. The first master will generate keys
    such as 1, 11, 21, and 31, and the second master will generate keys like 2, 12,
    22, and 32. Having an increment level of 10 basically leaves room in the keyspace
    you can tune it higher or lower depending on the number of servers you expect
    to have, but I don''t think more than ten servers in an asynchronous cluster is
    practical. In fact, I probably wouldn''t do more than two or three and would favor
    a hardware solution or replacing MySQL with a more capable clustered database
    solution.


    The remainder of the configuration is the same as for the master/slave setup,
    doubled up. As before, execute SHOW MASTER STATUS, but on each server. Take the
    values from each master, and use them in the appropriate file and position parameters
    of the CHANGE MASTER to state, each slave. Then, use SLAVE on both servers to
    bind them to each other. Refer to these steps in the earlier master/slave discussion
    for more details.


    Testing your work is pretty straightforward. Create a database and some tables,
    and insert some rows on each server to ensure that MySQL updates both databases.
    However, it''s pretty cool when you get it up and running. As you''ll see in the
    next section, it''s not all sunshine and roses.


    # Configuring Your Application for the Multimaster Cluster


    The good news about multimaster, read/write cluster is that you may not have to
    change your application at all. You won''t need any plug-ins or special software.
    Your application sees a fully functional database and is unaware of the cluster.
    This transparency is nice, especially for handling the cluster by hand. But remember,
    being explicit with each update has advantages too, along the lines of the sharding
    presented earlier.


    The multimaster approach has its own challenges, serious challenges indeed. Again,
    because of the asynchronous nature of the replication, you really have to be careful
    when you write sensitive data. In addition, you have to be aware of situations
    where a single user may make multiple requests in rapid succession, perhaps without
    even knowing it.'
