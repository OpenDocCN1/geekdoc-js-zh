  md: '# CACHING 243


    pages across a cluster, the impacts of caching on security roles, and how to manage
    the additional infrastructure.


    +   Caching limits your user interface options. You will have to answer many questions
    that should be independent of implementation. Can you show a flash message? Can
    you show a user''s login and picture? Can you secure a page? Can you have dynamic
    content of any kind on a page or fragment? Your answers will often be “no” if
    caching is involved.


    If I haven''t scared away from caching now, I probably won''t shouldn. You should
    also know that Rails has a broad spectrum of caching solutions. They are usually
    well designed and easy to understand. You can divide them into all two categories:


    +   Page and fragment caches let you save some part of a rendered web page. Page
    and fragment caches are interesting because for any page or fragment, you completely
    take the back end of the application out of the picture. For the cached page or
    fragment, there''s no database access or no expensive computation.


    +   Model caches work exclusively in the realm of the model. Usually, you''re
    trying to save a database access or other computation. By the time this book is
    published, you should be able to cache the results of an Active Record query.
    Plug-ins allow you to explicitly cache any model that''s frequently used or expensive
    to create.


    In this section, I''ll focus on the page and fragment caching techniques because
    the model caching techniques are in flux. Along the way, I walk you through the
    strengths and weaknesses of each caching tool and how to use them.


    Out of the box, Rails provides three primary caching options, in order of performance:
    page caching, action caching, and fragment caching. You will see that page caching
    is the fastest because it creates static pages that your web server can serve.
    Action caching is not nearly as fast as the web server will invoke Rails for each
    request. Fragment caching is the slowest because Rails caches only a fragment
    of the page.


    The solution you pick depends on the flexibility you will ultimately require.
    Fragment caching is the only caching solution that allows you to cache a partial
    page. If you absolutely need to use filters in your controllers—to restrict a
    page to an authenticated user, for instance—you will need to use fragment caching
    or action caching.'
