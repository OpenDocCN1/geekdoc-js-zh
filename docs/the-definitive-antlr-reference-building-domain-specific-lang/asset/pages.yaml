  md: '# # Rewrite index to check for static

    RewriteRule ^$ /index.html [QSA]


    # # Rewrite to check for Rails cached page

    RewriteRule ^([^/]+)$ $1.html [QSA]


    # # Redirect all non-static requests to cluster

    RewriteCond %{DOCUMENT_ROOT}/%{REQUEST_FILENAME} !-f

    RewriteRule ^/(.*)$ $balancer://mongrel_cluster%{REQUEST_URI} [P,QSA,L]


    # # Deflate

    OutputFilterByType DEFLATE text/html text/plain text/xml

    BrowserMatch %Mozilla/4 gzip-only-text/html

    BrowserMatch %Mozilla/4.0,[678] no-gzip

    BrowserMatch \bMSIE no-gzip !gzip-only-text/html


    # # Uncomment for deflate debugging

    #DeflateFilterInput input_info

    #DeflateFilterOutput output_info

    #DeflateFilterName ratio_info

    #LogFormat "%r" %+output_info}n%{input_info}n%{ratio_info}%'' deflate

    #CustomLog logs/your_app_deflate_log deflate

    ErrorLog logs/your_app_error_log

    CustomLog logs/your_access_log combined

    </VirtualHost>


    Save the file, and double-check to make sure it''s in the same folder as httppd.conf.


    # Explaining the Proxy


    The important part of this section is:


    ```

    # Configure mongrel_cluster

    <Proxy balancer://mongrel_cluster>

    BalancerMember http://127.0.0.1:4001

    BalancerMember http://127.0.0.1:4001

    </Proxy>

    ```


    This section is the load balancer configuration. Each BalanceMember points to
    one of your back-end instances of Mongrel. This configuration supports only two
    back ends, but you can easily add more. Keep in mind changing this configuration
    file requires a restart of Apache.


    When a request comes in, Apache checks for a static page. If no static page is
    found, the system will forward the request to the Rails applic-tion, just like
    a stand.'
