  md: 'Also remember that in /etc/mongrel_cluster/myapp.conf file, there was a line
    restricting the IP address allowed to access the Mongrel servers:


    ```

    # Partial /etc/mongrel_cluster/myapp.conf

    # ...

    address: 0.0.0.0

    # ...

    ```


    If you''re running both on the same server, you can use the IP address 0.0.0.0
    or 127.0.0.1. If you''ve separated the web and app roles, this address line will
    have to match the server/Mongrel proxy—the server you''re working with now (for
    example, 10.0.0.101). Note that these are all internal IP addresses we''re using
    here, not public IP addresses exposed to the Internet.


    Also recall the following two lines from /etc/mongrel_cluster/myapp.conf:


    ```

    # Partial /etc/mongrel_cluster/myapp.conf

    # ...

    servers: 4

    port: "8000"

    # ...

    ```


    These two values determine how many balancer members you will have and what their
    port numbers will be. In this example, there would be four servers running from
    port 8000 to 8003. This, that''s our balancer configuration.


    The second file that you need on each member, and the final Apache configuration
    file we will deal with, is mongrel_proxy.conf. If you''re keen, you are probably
    thinking you already know the answer here, because you can just add a virtual
    host that routes all requests to the balancer. That does work, and the configuration
    would look nearly identical to the virtual hosts we defined on the load balancer:


    ```

    # A very simple mongrel_proxy.conf

    <VirtualHost *:80>

    ServerName www.brain1.al

    ServerAlias 10.0.0.10 # if you don''t have a hostname name

    RequestHeader set X_FORWARDED_HOST ''www.brain1.al''


    ProxyPass / balancer://mongrel_cluster/

    ProxyPass Reverse / balancer://mongrel_cluster/


    ErrorLog logs/mongrel_proxy_error_log

    TransferLog logs/mongrel_proxy_access_log

    LogLevel warn

    </VirtualHost>

    ```'
