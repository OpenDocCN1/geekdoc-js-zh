  md: '# Moving Up


    # Chapter 4


    # Virtual and Dedicated Hosts


    Most shared host plans are roughly equivalent to a 7-by-7 apartment with a shared
    bathroom and no kitchen. After a little time on that shared host, it may start
    to feel cramped. When you come to a point where you are pushing the limits of
    your shared host, it''s time for your own private server or dedicated server.
    You will be able to stretch out and take over the whole environment without worrying
    about others for your CPU time and memory. You''re probably thinking to yourself.
    “Ah, the good life.”


    Not so. With your newly found space and flexibility comes great responsibility.
    No one will hold your hand and watch over your server, unless you''re willing
    to pay big bucks for a fully managed server. You will have to decide whether that
    extra cost of disk redundancy through RAID is worth it; you will be responsible
    for backing up your system and restoring the data should something go wrong. For
    better or worse, you are living the great American dream: full ownership. This
    chapter will walk you through the move-in.


    # 4.1 The Lay of the Land


    In this chapter, I''ll show you how to build a server from scratch. You''ll first
    build and install your operating system. Then, you''ll build some of the tools
    that you will need to build the Ruby stack. You will move on to build the Ruby
    stack, including Ruby, Rails, RMagick, and Mongrel. You will also install a database
    and your web server, though you won''t integrate your web server until Chapter
    7. *Scaling Out*, on page 144. You''ll have a working Rails installation like
    the one in Figure 4.1, on the next page.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '![](img/a2b912fcaa70ea563309a38603eb4e7d_72_0.png)


    Figure 4.1: Dedicated server map


    In practice, the setup will not work much differently from the one you saw in
    Chapter 3, Shared Hosts, on page 44. You will serve each request with a single
    Mongrel. That architecture will not scale, but your emphasis is on building a
    workable foundation that you can use as a foundation. In later chapters, you''ll
    cluster your Mongrels, and if your application requires it, you''ll scale out
    using one of the options in Chapter 7, Scaling Out, on page 144. For now, focus
    on building all the pieces that you''ll need through the rest of the book.


    # Introducing Your Own Host and Administrator


    As if deploying a Rails application to someone else''s server wasn''t enough fun,
    now you''re ready to build your own machine. Whether you want the role or not,
    you''re an administrator. You earned that rank the moment you built your own environment.
    I recommend you take your new role seriously. As an administrator, you have many'
  merge: -1
