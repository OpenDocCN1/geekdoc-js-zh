  md: '# Taking It to the Next Level


    You can get more life out of your web tier by first introducing hardware load
    balancing to replace the Apache-based load balancer you built earlier. Hardware
    load balancers offer many of the same features plus, including enhanced security,
    proxying HTTPS/SSL requests, and server affinity (sticky load balancing).


    Another excellent enhancement is offload serving of large static content from
    your own servers and instead employ a content delivery service. These services
    will cache images, videos, music, PDF files, and any other large files that you
    need not bother your own servers with. It doesn''t make your application faster,
    of course, but it certainly will reduce the load on your web server''s network,
    memory, and disks.


    # 7.8 Clustering MySQL


    I''ve shown how you could cluster multiple web and application servers behind
    a software load balancer, but a single database on the back end can take you so
    far. The database would be thrashed severely if you had ten servers vying for
    its time and resources, so you need some solution to allow for multiple databases
    in your application infrastructure. I should warn you that you must customize
    clustering solutions to fit the application that you are building, considering
    carefully the balance of performance against data integrity concerns.


    # Challenges with MySQL Clustering


    In this book, I''ve chosen MySQL because it is by far the most common and best
    supported database for Rails applications. Truth be told, for the most extreme
    scalability problems, there are better databases on the market that offer more
    clustering features. As it turns out, MySQL is actually not a very good candidate
    for clustering at all, because of some challenges.


    # Challenge 1: The Relational Database


    MySQL is a relational database. Relational databases do not scale well to super-high
    loads like those experienced by Google and Facebook. Instead, such sites will
    often use simpler, faster systems such as the Oracle Berkeley DB, which is an
    in-process nonrelational data storage that offers better performance and stability,
    even in a distributed environment. Others may use in-memory object-oriented databases
    or even flat files! Each of these has their pros and cons, but'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'the relational database can actually be among the slower options, often favoring
    features over performance.2


    # Challenge 2: Asynchronous vs. Synchronous Replication


    MySQL supports only asynchronous replication. Under this scaling model, you will
    have a lag between the time a transaction completes on one of the databases and
    when MySQL replicates row to all the others in the cluster. This lag time can
    cause pain when you are dealing with unique indexes such as the primary key. It''s
    especially challenging with other unique indexes. That given a given user must
    have a unique login. If two users use the same name at the same time, you will
    have inconsistent data. The only solution is your own custom algorithm for guaranteeing
    uniqueness. A few ambitious developers have formed projects to implement a synchronous
    clustering solution for MySQL, one that would eliminate the time-lag problem.
    One such project called google-mysql-tools includes a feature called SemiSyncReplication.
    Another is solidDB for MySQL, by Solid Information Technology. It offers synchronous
    replication and other high-availability features. If you''re serious about clustering
    MySQL, you should watch these projects.


    # Challenge 3: Clustering vs. Sharding


    Clustering in general doesn''t perform well for the most extreme database loads.
    Even if you do manage to get a synchronous cluster set up, certain kinds of transactions
    must update all the databases before completing. This limitation means that if
    you have ten database servers in your synchronous cluster and update a number
    of records that are centrally dependent on your system, your transaction will
    need to write to all ten servers! more hindrance than a help. Furthermore, it''s
    hard to cluster in a geographically diverse way, so it becomes difficult to put
    one server in Japan and another in Canada and have them belong to a cluster. The
    performance implications of synchronizing a database across a wide network is
    not at all practical, regardless of the other benefits. So as an alternative to
    clustering, many modern high-load websites use an approach called sharding.


    Sharding means splitting your database into groupings of cohesive data, such that
    all the data that a certain user or function requires


    +   2. See http://www.oracle.com/database/berkeley-db/index.html for more.'
  merge: -1
