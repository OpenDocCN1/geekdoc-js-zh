    AddOutputFilterByType DEFLATE text/html text/xml

    BrowserMatch ^Mozilla/.* gzip-only-text

    BrowserMatch ^Mozilla/4\.[0-9][678] no-gzip

    BrowserMatch ^MSIE no-gzip !gzip-only-text


    ```

