  md: '![](img/a2b912fcaa70ea563309a38603eb4e7d_199_0.png)


    Adding the port number to the service name is a really helpful to keep track of
    the ports you''ve used. As you add services, the port number becomes even more
    useful. It''s not a requirement, but it''s a good convention to follow.


    # Creating a Second Instance of Mongrel for Your Application


    Your application is not hosted by Mongrel, running as a service. Now, it''s time
    to kick up your feet and pop a tall frosty one, right? Be careful, though. One
    Mongrel is not likely enough. Rails is not always the fastest available framework,
    and a single instance of Mongrel can handle one request at a time. As load increases,
    you need to add more instances of Mongrel and then balance the requests.


    Those lucky *nix guys get to use a tool called mongrel_cluster, which can start
    and stop multiple instances of Mongrel with ease. Windows doesn''t have mongrel_cluster
    yet, so you''ll need to improvise. You can just create another instance of Mongrel
    as a service that points to the same Rails application. You can then use a load
    balancer to distribute traffic to each instance.


    Creating your custom cluster manually is not as hard as it sounds. You''ll create
    another service that points to the same application, but you use this port 4002
    by running the following commands:


    ```

    mongrel_rails service::install -N MyTestApp_4002 -p 4002 -e production

    mongrel_rails service:start -N MyTestApp_4002

    ```


    If you look in the Control Panel under Services, you will see both services running.
    Adding the port number to the service name makes it easier to remember which port
    each service uses. If you look at Figure 8.2, on the next page, you will see an
    example of both services installed.'
  merge: -1
