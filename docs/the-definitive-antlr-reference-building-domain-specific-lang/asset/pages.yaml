- img_proc: true
  md: 'you should ask your host provider first. Since most virtual servers will run
    on high-end hardware, you can get very good performance. Of course, the VPSs that
    your host tries to squeeze into one physical box, the less resources there are
    to go around. It is a good practice to ask the provider about the hardware setup
    and exactly many virtual machines it runs per box. Generally speaking, bigger
    slices on bigger boxes are better. If you need help interpreting the numbers,
    ask an expert, you might pay one if you have a lot of money riding on the answer,
    or you might simply post the question on one of the excellent Ruby on Rails forums.


    # Memory


    Usually, your performance bottleneck will not be processing power but memory.
    Some shared hosting providers oversell their hardware in the hopes that not everyone
    will be running full blast at once. When many customers need too much, your VPS
    can easily run out of memory and start swapping pages to disk. To understand the
    impact on performance, imagine an Olympic sprinter running full speed in perfect
    conditions and plunging him into water up to chest to finish the race. But with
    Xen-based VMs, the memory allocation you get for your server is your memory only.
    A Xen-based architecture will not allow a hosting provider to oversell the memory
    of the physical box, and your application can run in the clean air of memory instead
    of the quagmire of disk swapping. Products like Virtuozzo and OpenVZ are a few
    to investigate.


    Depending on what you''re doing, I''d recommend a minimum of 160MB to 256MB of
    RAM on your VPS. This amount of memory will allow you to run one or two Small
    sites, depending on the application''s resource usage. But you can be more precise.
    Rather than a blind guess, estimate how much you will need based on one critical
    question: how many Mongrels or FastCGI listeners will you need?


    One or two back-end processes is plenty for many Rails applications. A typo or
    Mephisto blog that gets a medium amount of traffic usually be fine on one process.
    A typical Rails process can take anywhere from 35MB to 120MB, but some Rails application
    may take more. Keep in mind there are always exceptions to the rule, and you should
    test locally to see what your memory consumption is before you order your VPS.
    I''ll show you how in Chapter 9. Performance, on page 224.'
