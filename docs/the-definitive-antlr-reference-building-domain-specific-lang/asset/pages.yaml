  md: '# The Core Rails Libraries


    If you were paying attention, you saw that an installation of the core Rails libraries
    was missing from both lists! In fact, you will experience more stability if you
    use the built-in Rails freeze:gems command to save a specific version of Rails
    to your vendor directory. You can find more about this in Section 2.4. Freeze
    the Rails Gems, if your head decides to upgrade to a blazingly fast new version
    of Rails in the middle of the night—one that might break your application—you
    will still run with the older version residing in your vendor directory. When
    you have tested your app against the newer version of Rails, you can again call
    `rake freeze:gems` to upgrade.


    The adventurous can use `rake rails:edge` to use a copy of the development version
    of Rails (commonly called the trunk version or *Edge Rails*). Even though Rails
    is almost three years old, development continues at a rapid pace. Edge users get
    to use newer Rails features before the general public. Early use is a double-edged
    sword. The benefits you get with the early use of new features comes the potential
    for API change and bugs. Both problems are inherent in early software.


    You can also tie your application to the newest trunk branch of Rails so is updated,
    but I don''t recommend doing so because that strategy adds another unknown element
    into your deployment process. The Rails core team is very active, and updates
    to the Rails trunk are made several times a day. Your application might work at
    8:05, but an update made at 8:06 could break your app when it is deployed on the
    server at 8:07. Keeping a consistent version of Rails will let you decide when
    to upgrade, your schedule.


    If you have installed other third-party libraries or plug-ins, they may have undocumented
    features of Rails that could change without notice. Well-behaved plug-ins will
    be more stable, but no authorized group of developers certifies plug-ins. By using
    a consistent release (or edge) version of Rails in conjunction with a thorough
    test suite, you can guarantee that the combination of code libraries in your application
    passes all your tests.


    Whether you choose to live on the edge or use an older version of Rails, freezing
    the libraries within your application will help you simplify your deployment and
    maintenance in the long run. Next, I''ll walk'
