    # Apache + FastCGI


    All kidding aside, Apache is a general-purpose web server. In a Rails environment,
    Apache works best for serving static content. Serving your Rails application will
    take a little more time to configure. To use Apache, you''ll have to configure
    Rails to run using FastCGI. Then you''ll tell the server to forward your request
    to these Rails FastCGI processes. For security''s sake, shared hosts control the
    majority of the configuration options for the Apache web server. However, you
    can specify some directives that will make your Rails application run more smoothly.


    By default, Rails provides an .htaccess file for Apache in the public directory
    of Rails apps. By default, this will run your application in normal, spur-slow
    CGI mode. If you choose a quality shared host with FastCGI support, you should
    turn on FastCGI in .htaccess. You''ll do so'
