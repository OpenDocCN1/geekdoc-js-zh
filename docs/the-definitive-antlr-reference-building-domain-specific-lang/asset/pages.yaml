  md: "if you have one project per repository.^1 You don't have to create the top-level\
    \ folders for Subversion to work, I suggest you do so. The better Subversion repositories\
    \ I have adhere to this convention, and if you have only one project in your repository,\
    \ this approach will let you tag and branch at will. These commands will build\
    \ your initial directories:\n\n```\n$ svn mkdir --message=\"Initial project layout\"\
    \ \nfile://home/ezra/svn/trunk file://home/ezra/svn/tags \nfile://home/ezra/svn/branches\n\
    ```\n\nCommitted revision 1.\n\n# Importing a Simple Rails Application\n\nI suggest\
    \ you practice with an empty Rails first. Create the Rails application as usual:2\n\
    \n```\n$ rails ~~/deploy\ncreate\ncreate app/controllers\n...\n```\n\nAt this\
    \ point, you could do an svn import and put the whole directory tree in the repository.\
    \ I recommend against doing so. If you use the “in-place import” procedure instead,\
    \ you can selectively commit the pieces you want, not the whole tree. See Subversion’s\
    \ “How can I do an in-place import” FAQ for the full details.\n\nStart your in-place\
    \ import by checking out trunk into the folder to import:\n\n```\n$ svn checkout\
    \ file:///home/ezra/svn/trunk ~/deploy\nChecked out revision 1.\n$ cd -~/deploy\n\
    ```\n\nNext, add the whole tree to the working copy. The results are different\
    \ from svn import initially, except changes are local to the working copy and\
    \ you can selectively revert the files and folders if you do not want in the repository\
    \ before committing. The end result is more convenient control over what actually\
    \ becomes part of the repository. We use svn import with --force option because\
    \ otherwise Subversion will fail with an error indicating that the current directory\
    \ is already under version control.\n\n+   1. This is explained in more detail\
    \ in “Choosing a Repository Layout” in the Subversion book.\n2. If you have an\
    \ existing project you want to import in Subversion, simply skip this step. All\
    \ other steps are identical."
