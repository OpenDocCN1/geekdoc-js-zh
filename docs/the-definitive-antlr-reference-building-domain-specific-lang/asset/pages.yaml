  md: 'For the most security, you shouldn''t keep this file from source code control.
    A common technique is to copy this file to a safe place on your server and add
    an after_update_code() task to Capistrano that copies it into the live application
    after it is deployed. (See Chapter 5, Capistrano, on page 92 for more details.)


    # RAILS_ENV


    Rails was intelligently designed to run with different settings for development,
    test, production, or any other environment you define. It will use the “development”
    environment unless told otherwise. When running on your shared server, you will
    want “production” mode to be in effect.


    There are at least three ways to set the RAILS_ENV for your application, each
    with different repercussions. The goal is to set it in a way that will take effect
    on the server, but not on your local development machine.


    # Option 1: Set the Environment in Your .bashLogin on the Server


    The best way is to set the actual RAILS_ENV environment variable. Rails and Capistrano
    work best with the bash shell.


    ```

    ezra5 ~/.bashrc

    export RAILS_ENV="production"

