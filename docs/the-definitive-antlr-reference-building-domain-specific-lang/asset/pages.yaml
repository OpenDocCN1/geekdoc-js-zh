  md: 'responsibilities—topics other books will do a better job of exhaust-ing. You
    can group your responsibilities into these categories:


    +   * Security and stability

    * Configuration and upgrades

    * Documentation


    Keeping your server secure and stable is a tough business and is a subject I won''t
    attempt to tackle in this book. Managing configuration and upgrades can be a weekly
    occurrence, and patching the system is an important security practice. But the
    one that I really want to drive home is documentation. Developers have a bad habit
    of avoiding documentation. Programmers I know insanely creative rationalizations.
    Here are some of the best:


    +   * You may not think you have the time to pull it off, but you''ll pay with
    your time now or later.

    * You might not think that documentation is out-of-date and unable to keep up
    with changes in code, but I''m not talking about code.

    * "The configuration won''t change as fast as code, and even if it does, that''s
    all the more to document it."


    None of the old arguments against documentation work for infrastructure. As system
    administrators, we have to document our configurations. The following tips will
    help with managing documentation:


    +   * Keep a server next to the machine or in a common place if there are multiple
    administrators or remote servers. Treat it like the conch from Lord of the Flies:
    only the person with the journal can modify the server configuration. In the journal,
    record and date changes were made and why.

    * Keep a directory containing dated session logs in a well-known directory. If
    at all possible, comment the logs with “why?” questions. It''s easy to see what
    someone did with the logs, but the "why?” needs to be filled in to communicate
    with others.

    * Update formal documentation once per week or any major change is made. Formal
    documentation includes simple diagrams and organized sections of documentation
    for key infrastructure components.'
