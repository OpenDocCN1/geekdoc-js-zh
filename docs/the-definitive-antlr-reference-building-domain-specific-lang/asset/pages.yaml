  md: '# Chapter 1


    # Introduction


    Building Rails apps brings the joy back into development. But I, Ezra, have a
    confession to make. There was a brief moment that I didn''t like Rails at all.


    I''d just graduated from the five-minute tutorial to developing my first real
    Rails application. The helpers, plug-ins, and generators reduced the amount of
    code I needed to write. The logical organization and layout of the files let me
    painfully find what I needed, and the domain-specific languages in Active Record
    let me express my ideas with simplicity and power. The framework bowed to my will,
    and aside from a few trivial mistakes, I finished the app. Pure joy washed over
    me.


    But then, it was time to deploy. Deployment means moving your application from
    a development environment into a home that your customers can visit. For a web
    application, that process involves choosing a host, setting up a web server and
    database, and moving all your files to the right places with the right permissions.


    I quickly discovered that after the joy of development, deployment was a real
    drag. All those waves of euphoria completely disintegrated against the endless
    stream of crash logs. Rails error pages, and futile install scripts. I spent hours
    wading through the Rails wikis, blogs, and books for answers, but each one gave
    me a fragment of what I needed. Much of the information I found was contradictory
    or flat-out wrong.


    Deployment also involves making the best possible environment for your customers,
    once you''ve settled into your new home. There, too, I failed miserably. When
    I finally made my site work, it was too slow. Stumbling through page caching seemed
    to make no difference, and'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# CHAPTER 1. INTRODUCTION


    my end users watched the spinning (lack of) progress indicator for frustration.
    I struggled to fix memory leaks, broken database migrations, and worthless server
    configurations until eventually my site purged in appreciation. Then came success,
    which means more visitors, followed by more failure. I screamed some words that
    would make a sailor''s dead parrot blush. No, at that moment, I really didn''t
    like Rails.


    I''m not going to sugarcoat it. If you don''t know what you''re doing, Rails deployment
    can stretch the limits of your patience, even endurance. What''s worse, Rails
    deployment suffers especially in areas Rails development is easy:


    +   - You can find plenty of Rails development documentation, but when it''s time
    to deploy, you can find only a fraction of what you need. People just seem to
    write about development than deployment.


    +   - You can choose your development platform, but you can''t always choose your
    development platform. Most hosts with Rails support some variant of Linux; others
    FreeBSD or Solaris. The software stack for different hosts can vary wildly, as
    application requirements.


    +   - When your development application breaks, you can find mountains of information
    through breakpoint, rich development logs, and the console. In production, when
    things go south, there are fewer sources of information, more users, and more
    variables. You might encounter a problem with the operating system, your application
    server, system resources, plug-ins, your database server, or any one of dozens
    of other areas. And your caching environment works differently than your development
    environment.


    +   - Rails is an integrated platform that narrows the choices. You''ll probably
    use Active Record for persistence and Action Pack for your controllers and Use
    Prototype for Ajax. But your deployment environment will require many choices
    that are not dictated by Rails, including the most basic choice of your web server.


    But I''m living proof that you can learn to master this beast. Over time, I''ve
    come to understand that my approach to deployment was rushed, as well as a little
    haphazard. I found that I needed to approach development in the same way that
    I approached development. I had to learn how to do it, effectively plan each step,
    and automate as much as possible so I left little to chance. I needed to plan
    for problems so'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'I could anticipate them and get automatic notification at the first sign of
    trouble. At my company, Engine Yard, I support some of the largest and most popular
    Rails sites in the world. I want to help you learn to do the same.


    Because Rails is so new, some people question whether anyone can deploy a sophisticated,
    scalable, and stable Rails application. Based on my experience at Engine Yard,
    I''d like to debunk a few myths:


    > Myth: The Ruby on Rails development framework is much more advanced than the
    deployment framework.


    That''s false. Deployment tools for Rails get much less attention, but they are
    also growing in form and function. If you know where to look, you can find deployment
    tools that are proven, effective, and free to use. These use techniques that are
    bit as advanced and functional as those used by the most mature Java or C# development
    shops. Ruby admins can deploy a typical Rails application with one command and
    move back to a previous release that deployment fail, with any command. You can
    deploy Rails to simple multiserver sets with very few changes. And if you cannot
    copy PHP files to your server by hand or Perl scripts to manage machines, life
    is about to become a lot easier (and yes, you can use some of these tools as well).
    I''ll show you how to do these things in Chapter 5, Capistrano, on page 92.


    > Myth: Rails is too new to have any large, sophisticated deployments.


    That, to is, false. Ruby on Rails is used on very large sites that some those
    applications require many full servers to serve their full feature to their community.
    And the list of Rails sites grows daily. Twitter, Basecamp, and 43 Things are
    all multiserver Rails sites. Many more enter production every month.


    > Myth: The Ruby language is inherently unstructured and purely suited for web
    applications.


    That''s mostly false. Ruby is an interpreted, dynamically typed language that
    presents real challenges in high-volume production settings, but the Rails framework
    has features and strategies that can mitigate risks associated with these challenges.
    The Rails caching model and performance benchmarking tools help developers to
    build high-performance sites. The Rails testing frameworks, sometimes in combination'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'with other Ruby testing frameworks, help developers catch errors that a compiler
    might catch in a statically typed language. And the Rails shared-nothing architecture,
    like many of the highest-volume Internet sites in existence, allows Rails to scale
    by adding additional hardware. And you''ll learn how to cluster in Chapter 7,
    Scaling Out, on page 144.


    Myth: Rails can get you into trouble, if you want to stay out of serious trouble,
    you need know how to wield your chosen tools. No development deployment strategy
    will burn you immune to bad design. You must always arm yourself with knowledge
    to protect yourself. In this book, I hope to help you do exactly that.


    Rest assured that the Rails deployment strategy is a good one. You can learn to
    predictably and reliably deploy your applications. You can use repeatable techniques
    to understand the performance characteristics of your system are likely to be.
    And you can improve the stability and scalability of your system given knowledge,
    time, and patience. I''m going to start quickly. I want to walk you through the
    deployment road map that every Internet application will need to use.


    # 1.1 The Lay of the Land


    Web 2.0, the new buzzword that describes a new class of web applications, sounds
    like a daunting mix of new technologies that radically change the way you think
    about the Internet. But when you think it, from a deployment perspective, Web
    2.0 doesn''t change much at all:


    +   - The Internet still uses the same communication protocols and the same type
    of web servers.

    - You still scale Internet applications the same way, by clustering.

    - You can even use some of the servers, and the new ones work mostly like the
    old ones.

    - You still keep your source code in source control.

    - The operating system is usually Unix-based.


    For all the talk about the way your applications may change, deployment remains
    precisely the same. Think of the Internet as a road map.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# THE LAY OF THE LAND 12


    ![](img/a2b912fcaa70ea563309a38603eb4e7d_11_0.png)


    Figure 1.1: Basic deployment map


    The buildings and places are servers, browsers on clients, routers, firewalls,
    and balancers. The roads are the networks between them and the various communication
    protocols those networks use. I like the map analogy because when all is said
    and done, the Internet is all about moving data from one place to another.


    When you deploy, you use the Internet to move your application from one place
    to another. You can think of every deployment story as a map. In fact, every deployment
    story in this book will come with a map. A generic version of the simplest possible
    deployment story is shown in Figure 1.1.


    Look at the components of that figure. First, you have a host with an environment.
    I will spend much of this book showing you how to build the environment that will
    host your application. The environment, in this case, includes all the different
    components that an Internet application needs. You''ll learn to build each of
    these pieces yourself or rely on another vendor to build those pieces for you.
    Those pieces will include the operating system, the Ruby language, the Rails framework,
    and the various pieces that will tie them together. The host represents your customers
    will go to find your application. As you can well imagine, that host image will
    get much richer as I take you through the various pieces of this book.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'You also see a development client. My machine is my trusty MacBook Pro, but
    I''ve also developed on the Windows platform. You might think that book is about
    the road that goes from the application to the client to the server. And I''ll
    start that way by. The basic deployment map (shown in Figure 1.1, on the previous
    page) will use plain old FTP to move your application from the client to the server.


    Deployments are rarely as simple as the one you see in Figure 1.1, on the preceding
    page. You''re going to find that shared hosting is a little limited. And you probably
    know that plain old FTP may be simple, but it will not handle the demands of effectively
    managing the site. You will need better deployment tools. You will want to throw
    a source control repository into the mix. If you''re lucky, one web server may
    not be enough. You will wind up with a more sophisticated map, like the one in
    Figure 7.1, on page 147.


    In the complete map, you see a vastly different story. What may appear as one
    site to the user has all environments. The first change is the website. You can
    no longer assume a single host. Those environments might be virtual environments
    that all reside on a single machine, or each individual environment could have
    its own hardware. Your deployment strategy will have to install your application
    into each Rails environment. You will need to configure the pieces to work together.
    And that''s the subject of this book.


    In the first few chapters, you might think that we''re oversimplifying a little
    bit. Don''t worry. You''re not going to be using FTP or shared hosting by the
    time you finish this book. I''ll get to the second map. I''ll just build it slowly,
    one piece at a time. We''ll keep extending the map throughout the book until you
    get to your eventual goal. In the next section, I''ll walk you through what to
    expect in the chapters to follow.


    # 1.2 Finding a Home


    You''ve seen that our maps have one goal in mind. They want your development code
    to to its eventual home in the best possible way. By now, you also know that the
    type of map you need depends on where your application is going to live. You can''t
    adequately understand deployment unless you understand where you''re going to
    put your code, but finding a platform for your Rails code is hard. The process
    feels like finding a home without a real estate agent, the,'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# FINDING A HOME


    or any consolidated home buyer guides. Over the course of this book, I''d like
    to take you into that hidden universe. You will learn how to:


    +   - develop Rails applications with painless deployment in mind;

    - choose between shared hosts, virtual private servers, or dedicated servers;

    - understand the software stack that the pros use to deploy Rails for high performance;

    - build and configure your web servers and other services;

    - stress your application before your users do; and

    - streamline your application in production using advanced strategies such as
    caching or your site scale.


    Throughout this book, I''ll treat deployment like buying a new home for your application.
    Through each of the chapters, you''ll learn to pick and prepare your home, streamline
    your stuff for everyday living, and even up into wealthier neighborhoods, should
    you ever need to do so. Let me take you on a guided tour of the book:


    **Packing up: tending to your application.** Before you move, you need to pack
    up. If you want a good experience, you need to organize your stuff to prepare
    for your home. On Rails, that meansing your application. You will need to prepare
    source control. You will also need to make some decisions that will have a tremendous
    impact on your production application, such as the structure of your migrations
    and your attention to security. This chapter will add source control to your map.


    **Finding a starter home: shared hosting.** Not everyone can afford a house. When
    we leave home, we first move into an apartment building or a dorm. Similarly,
    most Rails developers will choose some kind of shared hosting to house that first
    application: a blog or a simple photo log. Shared hosting is the first and cheapest
    of the hosting alternatives. Setting up shared hosting involves many of the steps
    as moving into your first apartment: a home that meets your requirements, set
    up your address so that others can find you, and customize your home as much as
    possible. Like apartment living, shared hosting has its own set of advantages
    and disadvantages. Shared hosting is cheap, but you need to learn to be a good
    citizen, and you''ll likely encounter those who aren''t. In this chapter, you''ll
    learn to find and make the'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'best use of your first home. The deployment will be simple. You''ll need a
    shared host, a simple application, and a simple mechanism such as FTP to ship
    your code up there.


    # Moving up: virtual and dedicated hosting. After you''ve lived in an apartment
    for a while, you might decide to move up to your own home or condo. Your virtual
    world is the same. When shared hosting isn''t enough, you can move up to virtual
    and dedicated hosts. Moving up to home carries a new set of benefits and responsibilities:
    you get more freedom to add that extra closet you''ve always wanted, but you also
    have to fix the toilet and mow the lawn. Dedicated and virtual hosts are like
    your home or condo. These plans are more robust than shared hosts, but they also
    require much more knowledge and responsibility. When you set up your own host,
    you also as landlord. You need to know how to build and configure your basic software
    stack from your web server to the Rails environment. This chapter will walk you
    through building your hosting platform. Your map will get a little more complicated
    than you''ll have to build your environment, but otherwise, it will be the same.


    # Moving in: Capistrano. After you''ve chosen and prepared a place, you can move
    in. Unlike moving in your furnishings, with Rails you will probably move in more
    than once. You''ll want to make move-in process as painless as possible, automating
    everything you possibly can. Capistrano is the Rails deployment tool of choice.
    In this chapter, you''ll learn to deploy your application with Capistrano using
    existing recipes with a single command. You''ll also learn to roll back the deployment
    to the previous version if you fail. You''ll also see many of Capistrano''s customization
    tools. This tool will change your map by building a better road between your application
    and the deployment environment.


    # Adding on: proxies and load balancing. When your place is no longer enough,
    you need to add on or move up. Since we have already covered moving up, this chapter
    will cover adding on through clustering. One of the most common and effective
    ways to remodel a Rails deployment without buying a bigger plan is to separate
    the service of static content and application-backed dynamic content. In this
    chapter, you''ll learn to configure your production environments to handle more
    load. I''ll show you setups with Apache and nginx serving static content and dynamic
    content'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# FINDING A HOME


    with Mongrel. You''ll also learn how to distribute your applications across multiple
    servers with a rudimentary load-balanced cluster. I''ll also walk you through
    potential database deployments. The host side of your deployment map will get
    much more sophisticated because you''ll be deploying to a cluster instead of single
    host, with Capistrano already in the bag, you won''t have to change the client
    side at.


    **Planning for the future: benchmarking.** As you grow older, your family may
    grow. Without a plan, your house may not be able to accommodate your needs a few
    years from now. In Rails or any other Internet environment, capacity planning
    becomes a much larger problem, because your home may need to serve hundreds of
    times the number of users it does today. To get the answers you need, you''ve
    chosen your stack and deployed your application, you''ll want to find out just
    far you can push it. In this chapter, you''ll learn to use the Ruby tools, to
    understand what your environment can handle. You''ll also learn a few techniques
    to break through any bottlenecks you find. The deployment map won''t change at
    all.


    **Managing things: monitoring.** As you live in your new home, you''ll often find
    that you need help managing your household. You might turn to a watchdog to monitor
    comings and doings, or you might want to hire a service to do it for you. With
    the many Rails configuration options, you''ll be able to manage some of your installation
    yourself. You can also use an application Monit to automatically tell you when
    a part of your system has failed or is about to fail. You will make only subtle
    adjustments to your map to allow for the additional monitoring of the system.


    **Doing windows: deploying on Windows.** Homeowners hate windows. Rails developers
    often do, too. But Sometimes, you don''t have a choice. When you have to de deploy
    on Windows, this chapter will walk you through the process. We''ll keep it as
    simple and painless as possible. This chapter will focus on the host side of the
    map to offer the Windows alternative as you build out your environment on Windows.


    When you''ve finished the book, you''ll know how to pick the best platform for
    you. You''ll understand how to make Capistrano finesse your application from your
    development box to your target environment. And'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'you''ll be able to configure a variety of deployment scenarios from the inside
    out. If you''ve built up any resentment for Rails because of deploy-ment problems
    in the past, this book should get you back on the path to enjoying Rails development
    again.


    # 1.3 Conventions


    Throughout this book, you''ll see several command-line terminal sessions that
    show various deployment, setup, and configuration tasks. You''ll need to make
    sure you type the right command in the right place. You wouldn''t want to accidentally
    clobber your local code or accidentally load your fixtures to your production
    database (destroying your data in the process!). To be as safe as possible, I
    will follow a few conventions with the command-line prompts to make it easier
    to follow along.


    On most Unix-systems, when the command-line prompt is the number sign (#), it
    is letting you know that you are logged in as root. When the prompt is the dollar
    sign ($), you are logged in as a regular user system. These are the conventions
    for the Bourne Again Shell (bash). If you are running another shell, you might
    have differently indicators in your prompt, and you should adjust accordingly.
    On the Ubuntu system we are about to set up, the default shell is bash.


    The following prompts show how you should log in to run the various shell commands
    we use in the book. When you should be logged in as root, the prompt will look
    like this:


    ```

    root#

    ```


    When you should be logged in with your regular user account, the prompt will look
    like this:


    ```

    ezra$

    ```


    When you should be running a command from your local computer and not the server,
    the prompt will look like this:


    ```

    local$

    ```


