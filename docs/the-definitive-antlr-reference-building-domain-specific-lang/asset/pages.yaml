    \ the previous step.\n\n```\nmysql> # ON SLAVE;\nmysql> CHANGE MASTER TO\n  ->\
    \ MASTER_HOST='10.0.0.3',\n  -> MASTER_USER='deploy',\n  -> MASTER_PASSWORD='deploypassword',\n\
    \  -> MASTER_LOG_FILE='mysql-bin.000001',\n  -> MASTER_LOG_POS=98;\nQuery OK,\
    \ 0 rows affected (0.04 sec)\n```\n\nYou can now start the slave by using the\
