- img_proc: true
  md: '# Testing Tips


    +   - Run your tests from a different machine than the one hosting the application.
    Testing the throughput on the same machine can lead to unrealistic and inaccurate
    results.


    +   - Run the stress test against a baseline such as your public home page. This
    will give you a good idea of how your application compares to your existing services.


    +   - Run the tests from inside and outside of your network. If you can, try running
    the test from a cable or DSL connection to see what kind of impact it has.


    +   - Stress your app on the production server. Some sysadmins may cringe at this,
    but you should test the application where you plan to deploy it wherever. Do some
    testing during some downtime or during off-peak times when your server use is
    low. If you can''t do this, you should at least consider having a staging server
    that mirrors your production machine so you will be able to see accurate results
    and plan for the future.


    +   - Use more than one tool and compare the results.


    # 8.10 Developing on Windows and Deploying Somewhere Else


    If you develop on Windows but plan to deploy on a Linux server such as a virtual
    private host, a shared host, or a new shiny Linux server that your wonderful bosses
    purchased especially for you, you should be aware of some issues.


    # Dispatch.fcgi Ruby Interpreter


    When you deploy an application that you created on Windows to a Linux server,
    the first line in your `dispatch.fcgi` file will be wrong.


    On Windows, it usually reads as follows:


    ```

    #!c:/ruby/bin/ruby

    ```


    On Linux, it often reads as follows:


    ```

    #!/usr/bin/ruby

    ```'
