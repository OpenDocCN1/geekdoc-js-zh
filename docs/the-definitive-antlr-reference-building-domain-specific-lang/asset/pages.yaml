  md: '# Planning Ahead


    # Chapter 10


    # Frontiers


    Both the Ruby programming language and Ruby on Rails are fairly well established,
    but the various Ruby deployment platforms are very much in their infancy. It is
    the hope of this team of authors that this book is the state of the art in Ruby
    deployment for a very short time. For that to happen, a better deployment platform
    must emerge that radically changes the whole Ruby stack. There are already three
    good alternatives.


    # 10.1 Yarv


    The next version of Ruby, 1.9, will formally have a virtual machine at its core.
    The goal of Yarv is to build the fastest virtual machine for Ruby in the world.
    So far, they seem to have succeeded.¹This implementation is much faster than the
    current implementation of Ruby. The bytecode support will lead to a more portable,
    faster base code. This implementation will be the first step in moving Ruby to
    a first-class virtual machine. But all eyes will be on Rubinius and Ruby 2.0.


    # 10.2 Rubinius


    Rubinius is a next-generation virtual machine written primarily in Ruby and loosely
    based on the Smalltalk-80 Blue Book. The current target version of Ruby is version
    1.8.6, but once Rubinius is 1.8.6 compatible, work will begin on 1.9 and 2.0 compatibility.
    The virtual machine called shotgun is a tiny core in C, with the rest of the runtime
    written almost entirely in Ruby. It uses newer techniques, as such a better


    +   1. http://www.aftdot.net/yarv/bench_20041002.txt'
  merge: -1
