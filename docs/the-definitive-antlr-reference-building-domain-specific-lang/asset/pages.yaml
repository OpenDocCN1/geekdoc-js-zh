  md: "If you take heed of these various issues, then your Rails application should\
    \ be nice and secure. Do make sure you keep up with the main Rails blog: see http://weblog.rubyonrails.org/\
    \ for any security updates or warnings.\n\n# Database Performance Problems\n\n\
    Active Record belongs to a family of database frameworks called wrapping frameworks.\
    \ A wrapping framework starts with a single table and a wrapper around it to allow\
    \ object-oriented applications to conveniently access rows in the table. The performance\
    \ of wrapping systems like Active Record is highly dependent on you, the programmer.\
    \ The biggest thing you can do is benchmark your application. We'll discuss benchmarking\
    \ in Chapter 9, Performance, on page 224. In the meantime, I will show you the\
    \ most common problem you're likely to see.\n\n# The N + 1 Problem\n\nActive Record\
    \ makes it easy to retrieve a given object and access its attributes. Bad things\
    \ happen when those attributes are lists of other Active Record objects. Let's\
    \ say you're building the next great social networking site. You have a Person\
    \ who has_many :friends. To populate a list of friends, use some harmless code\
    \ that looks like this:\n\n```\nfriends = Person.find(:all, :conditions => some_friend_conditions)\n\
    @friend_addresses = person.friends.collect {|friend| friend.address.street}\n\
    ```\n\nTo be sure that code will work, but it's also horribly inefficient and\
    \ will get worse as the list of friends grows. You're actually running an Active\
    \ Record query for the list of friends and another for every address you need\
    \ to fetch. You can fix that problem by using eager associations, meaning you'll\
    \ tell Active Record what to load in advance with the include option:\n\n```\n\
    friends = Person.find(:all, :conditions => some_friend_conditions,\n  :include\
    \ => :address)\n@friend_addresses = person.friends.collect {|friend| friend.address.street}\n\
    ```\n\nThis code works in the same way to you, but the performance will improve\
    \ dramatically. Active Record will load all people and their addresses instead\
    \ of just loading people in the first query and addresses as you touch them first\
    \ time."
