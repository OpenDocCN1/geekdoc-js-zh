- img_proc: true
  md: '# What About Just Serving Rails Through IIS?


    Different groups of people have tried to serve Rails directly through IIS. Some
    tried to use the FastCGI API filter, but that configuration requires registry
    hacks and leads to instability. When I tried the FastCGI approach on three machines,
    I was able to make it work successfully on only one, and it wasn''t very reliable.
    This option may become more viable soon, but now Windows developers are going
    with the approaches outlined in this chapter.


    Microsoft has actually taken some great steps to make FastCGI better in IIS 7.0,
    but it has made no specific commitment to serving Rails applications with IIS
    at the time this book is being written. This miss seems pretty fast, though it''s
    definitely something you should keep an eye on.


    Using a proxied approach provides better for long-term scalability, because it
    is much easier to move your Rails applications to one or more separate physical
    machines. If you plan to host several Rails applications from one server, FastCGI
    is probably not a good option for you at all.


    If you experience trouble with the installation, you will need to refer to the
    developers of this product. The support forum¹¹² is an excellent resource.


    # Forwarding Requests to Your Application


    Say you want to forward all requests from http://localhost/mytest/ to your Rails
    application. You need to ensure that one of the following is true:


    +   - You allow script execution from your site root.


    +   - You allow script execution from the folder or virtual directory mytest.


    Failing to allow script execution from one of those places will result in a 403.1
    error message from IIS.


    The file C:\Program Files\Helicon\ISAPI_Rewrite3\httpd.conf contains the write
    rules that IIS uses to forward requests.


    12. http://www.helicontech.com/forum/'
