  md: '# CONFIGURING THE WATCHDOG


    ```

    set daemon 30

    set logfile syslog facility log_daemon

    set mailserver smtp@example.com

    set mail-format {from:monit@example.com}

    set alert sysadmin@example.com on timeout, nonexistent

    set http port 9111

    allow localhost

    include /etc/monit.d/*

    ```


    This config is fairly straightforward, but there are a few things to note.

    set daemon 30 tells Monit how to check processes, in this case every 30 seconds.
    I have found that 30 seconds is perfect for this setting. You need to use your
    SMTP server and email addresses for alerts. The last directives turn on Monit''s
    built-in HTTP server on port 9111, making it viewable only from the localhost,
    and sets /etc/monit.d to be the directory from which to include config files.


    When you''re down, you can try a couple of commands. You can actually start and
    stop Mongol instances through Monit. First you need to make sure Monit has your
    latest configuration loaded:


    ```

    ezra$ sudo /etc/init.d/monit restart

    ```


    When Monit starts, it will automatically boot the Mongols. Then you can restart
    the Mongols by their groups through Monit:


    ```

    $ sudo monit restart all -g deploy

    ```


    Or restart one Mongol by its name:


    ```

    $ sudo monit restart mongrel_deployit_5000

    ```


    To see the current status of your Mongols, use the status command:


    ```

    $ sudo monit status

