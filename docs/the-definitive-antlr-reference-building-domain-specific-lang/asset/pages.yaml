  pgno: 247
- img_proc: true
  md: 'The sweeper would be the same as the sweeper you''d use for either of the other
    caching strategies. Using a sweeper, you can expire fragments based on changes
    in the model.


    Fragment caching has one critical weakness. The Rails programming model strongly
    suggests that you place any code that accesses your models in the controller.
    That means the controller will initiate most of your queries. The fragment caching
    strategy does not help at all on the controller side. You can do only one of two
    things: you can run your queries in your views and suffer the consequences of
    poor application design, or you can extend the fragment caching with a plug-in
    or custom code.


    ```

    when_fragment_expired ''fragment_name'', 20.minutes_from_now do

    comments = Comment.find_favorite_comments

    end

    ```


    One plug-in called timed_cache lets you expire fragments on some time interval.
    Better still, the plug-in lets you bracket your controller code with caching directives.
    Say you wanted to expire a partial that the most popular blog comments every twenty
    minutes. In the controller, you would have this code:


    ```

    <% cache ''blog_favorites'', 20.minutes_from_now do %>

    <%= render partial => ''favorite_comments'' %>

    <% end %>

    ```


    And in the view, you''d use the cache directive with a name and an expiration
    time:


    ```

    <% cache ''blog_favorites'', 20.minutes_from_now do %>

    <%= render partial => ''something_expensive'' %>

    <% end %>

    ```


    You can immediately see the benefits. Sure, you''re saving the time it Rails takes
    to render the view. More important, you''re saving the time it takes to retrieve
    the fragment cache, possibly from a remote database server. The implementation
    is clean, convenient, and easy to cluster based on the configurable back end.
    The expiration is also dead simple. Every twenty minutes, Rails expires the fragment
    and computes a new one.


    # Caching Back Ends


    Page caching caches content as files in the public directory. This arrangement
    is easy to implement but harder to cluster. As you''ve seen, both action caching
    and fragment caching use the same configurable'
