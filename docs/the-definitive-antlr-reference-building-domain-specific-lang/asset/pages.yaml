  md: "# 6.6 Heartbeat\n\nThe exception_notification plug-in is a great way to understand,\
    \ when your application has, whether the errors are consistent or intermittent.\
    \ It's not a complete management solution, though, for larger or more critical\
    \ production systems, you also need to verify that the system is running at all.\n\
    \nA heartbeat service will tell you when your application fails. I find that a\
    \ simple script running on a separate host works better than custom solutions\
    \ because it's easy, infinitely customizable, and deployable on any host with\
    \ your scripting language. The following script detects when one of four pages\
    \ is at ChangingThePresent:\n\n```\nDownload managing_things/heartbeat.rb\n!/usr/local/bin/ruby\n\
    \nrequire 'net/smtp'\nrequire 'net/http'\nrequire 'net/https'\nrequire 'uri'\n\
    ```\n\n```\nurls = %w{\nhttp://www.changingthepresent.org/\nhttp://www.changingthepresent.org/nonprofits/show/23/\n\
    http://www.changingthepresent.org/causes/list/\nhttps://www.changingthepresent.org/\n\
    }\n\nfrom = 'system@importantgifts.org'\n\nrecipients = %w{development@changingthepresent.org}\n\
    \nerrors = each do |url|\nbegin\n  uri = URI.parse(url)\n  http = Net::HTTP.new(uri.host,\
    \ uri.scheme == \"https\" ? 443 : nil)\n  http.use_ssl = (uri.scheme == \"https\"\
    \ ? true : false)\n  http.start do |http|\n    request = Net::HTTP.Get(uri.path)\n\
    \    response = http.request(request)\n    case response\n    when Net::HTTPSccess,\
    \ Net::HTTPRedirection\n    else\n      raise \"requesting #{url} returned code\
    \ #{response.code}\"\n  end\nend\n```"
