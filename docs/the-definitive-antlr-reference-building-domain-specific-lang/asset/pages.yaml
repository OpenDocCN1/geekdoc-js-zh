  md: '# LOCAL AND REMOTE SETUP FOR RAILS 101


    Here is a slightly more customized deploy.rb file:


    # # Customized deploy.rb


    ```

    set :application, "brainspl.at"

    set :repository, "http://brainspl.at/svn/#{application}"

    set :scm_username, "ezra"

    set :scm_password, proc{Capitstrano::CLI.password_prompt(''SVN pass:'')}

    set :web, "web1.brainspl.at", "web2.brainspl.at"

    set :app, "app1.brainspl.at", "app2.brainspl.at"

    set :db, "db.brainspl.at", :primary => true

    set :user, "ezra"

    set :deploy_to, "/home/#{user}/#{application}"

    set :deploy_via, :export

    ```


    The most obvious differences in the default file and the customized file are the
    roles and the few lines below them. Roles are groupings of machines that handle
    different tasks for your application. The key roles are the web server (Apache),
    application server (Mongrel), and database server (MySQL). Now, look at the next
    few lines below the roles.


    Capistrano lets you customize many different elements related to your servers,
    your application, authentication, and Subversion. The previous script customizes
    the deployment directory, the system user, the :scm_username command, the :scm_password
    command, and the command used to access Subversion.


    Capistrano 2.0, Subversion is the default SCM module. The user and password used
    to connect to your Subversion repository are defined as :scm_username and :scm_password.
    If you use a different source code repository, then you can set the :scm_variable
    in your deploy recipe. For example, if you use Darcs instead of Subversion, it
    would look like this:


    ```

    set :scm_username, "ezra"

    set :scm_password, proc{Capitstrano::CLI.password_prompt(''Darcs pass:'')}

    set :scm, "darcs"

    ```


    You will notice that we have something different going on for the :scm_password
    variable. Since we don''t want to hard-code the password in our deploy recipe,
    we have asked Capistrano to prompt us for the password every time we run a deploy.


    If you''re running a shared host, you can''t run with root access, so you''ll
    need to handle restarts a little differently.'
