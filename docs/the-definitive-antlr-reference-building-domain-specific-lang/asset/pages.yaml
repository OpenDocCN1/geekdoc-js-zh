  md: '# Joe Asks...

    What About InstantRails, Apache, and FastCGI?


    I won''t discuss InstantRails, a popular and easy way to get started with Rails
    development on Windows, in this chapter it''s not really meant to be a production
    deployment solution. Some people claim to have deployed applications with it to
    varying degrees of success, but the lack of load balancing and the inability to
    run as a service disqualifies it as good solution.


    I also won''t discuss the setup of Apache and FastCGI in this chapter. There are
    many issues with using this method on Windows including random server errors,
    poor performance, and really long start-up times for Apache.


    I''ll stick to the deployment options that will give you the best possible chance
    of success.


    +   1. Download the latest stable version of Ruby-DBI.³ Look for a file with the
    name dbi-0.1.0.tar.gz or something similar. Extract this file to a temporary location
    C:\TEMP.

    2. Grab one file from that archive called ADO.rb. If you have extracted the files
    to C:\TEMP, you can find the file in the folder C:\TEMP\lib\dbd.

    3. Copy this file to C:\ruby\lib\site_ruby\1.8\DBD\ADO. You will need to create
    the ADO folder, because it won''t exist.

    4. See the Rails wiki⁴ for more information on using SQL Server with your Rails
    applications.⁵


    While Microsoft SQL Server is a common database for the Microsoft platform, it''s
    not the only popular choice. You can also use several of the popular open source
    databases with Rails, using MySQL, SQLite, and Oracle.


    +   3. http://rubyforge.org/projects/ruby-dbi/

    4. http://wiki.rubyonails.org/pages/HowToConnectToMicrosoftSQLServer

    5. You can also use ODBC DSNs to connect to SQL Server from Rails, but there are
    some tricky permissions issues with ODBC and Mongrel as a service, so I don''t
    typically recommend going that route.'
