  md: '# Stabilizing Your Applications


    # Freeze the Rails Gems


    Even new versions of Rails can break backward compatibility. Bruce''s shared host
    once upgraded to Rails 1.1 while he was in Spain to give a Ruby talk at a Java
    conference. The new version immediately broke his blog, which was bad enough.
    As you can imagine, the broken blog made it nearly impossible to extol the virtues
    of Rails.


    After several decades of intense therapy, he has finally recovered from this incident
    and is a better person because of it. You can protect yourself against this by
    freezing a copy of the Rails libraries to your app''s vendor directory. Your application
    will use the exact version of Rails that you:


    +   * considered when you designed your application. Some versions of Rails have
    philosophical differences between other versions, as the new forms model introduced
    in 1.2, not to mention significant changes in Rails 2.0.


    +   * used to test your application. If you don''t freeze your gems, you''re fundamentally
    saying that you don''t need to test how thousands of lines of code will work with
    your application. If you make such a choice, I wouldn''t recommend any long trips
    to London.


    +   * understand. Rails is an active framework. You need to have a good grasp
    on changes in the framework before you deploy.


    When you upgrade to a newer version of Rails, you can integrate your application,
    test, and then freeze it to the vendor directory:


    ```

    $ rake rails:freeze:gems

    ```


    If you''ve come from a C, Java, or C# platform, you may be surprised the Ruby
    gems often break backward compatibility. In truth, decision is a double-edged
    sword. If you don''t respect backward compatibility, your applications can break,
    but there''s a benefit. Breaking backward compatibility allows your framework
    to evolve much more quickly and cleanly, without the risk of framework bloat.
    (See Enterprise JavaBeans or XML for two examples). Ruby and especially Rails
    develop a cleaner code base more than backward compatibility. As more enterprise
    developers use Rails, you may see a change, but don''t ever rely on a future that
    lets your application run safely without your own version of Rails. With versioned
    code and gems in hand, you can move on to organizing your migrations.'
  merge: -1
