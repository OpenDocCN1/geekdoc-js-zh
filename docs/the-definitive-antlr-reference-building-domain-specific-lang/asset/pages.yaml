  md: '# Virtualization to the Rescue...Again?


    If you have worked with Ruby on Windows before, even just for development, you
    know that It''s slow. Very, very slow. Windows Vista, based on my own personal
    (daily) experience, It is even slower. Simply running unit tests can be orders
    of slower than running the same tests on Linux. Believe it or not, it''s so slow
    that it might be faster to run your Rails applications in a virtual Linux machine
    on Windows using VMware Server or similar multicore CPUs. Modern virtualization
    software combined has made virtualization extremely fast. Thus, Rails on Linux,
    on VMware, and on Windows would actually perform quite well. The only way to know
    for sure is to try it for yourself. Build a simple Rails-capable Linux server
    with VMware, and run your unit tests (see Chapter 7, Scaling Out, on page 144).
    Compare it against the time it takes to run the tests on Windows natively. If
    you see a huge difference, then performing some load tests (see Chapter 9, Performance,
    on page 224) against your application to see whether it''s truly faster running
    on a virtual machine.


    Performance isn''t the only benefit of running in a virtual machine. Recall our
    discussions from Chapter 7, Scaling Out, on page 144, about how virtualization
    simplifies a great number of deployment issues and can help scale out faster.


    I can think of only one reason why virtualization may not be a practical choice
    for your Rails application: integration. If your Rails application needs to integrate
    with native Windows services or other applications that would not be accessible
    within a virtual machine, then the rest of this chapter will become very important
    to you.'
  merge: -1
