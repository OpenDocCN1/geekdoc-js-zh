  md: '# Configuring Mongrel


    Your shared host likely has Mongrel already installed. You''ll be amazed at how
    simple configuration, startup, and shutdown can be. Mongrel is a web server written
    by Zed Shaw in 2,500 lines of Ruby and C. Mongrel is custom-tailored to running
    Ruby applications like Rails. Since Mongrel is an HTTP server in its own right,
    you gain the ability to use it with a wide variety of preexisting tools to build
    with HTTP. Here is what Zed has to say about it the project''s home page: "Mongrel
    is a fast HTTP library and server for Ruby that is intended for hosting Ruby web
    applications of any kind using plain HTTP over FastCGI or SCGI."


    Mongrel is truly one of the best weapons in your arsenal when it comes time to
    deploy your application. It also makes for a great development server environment.
    Mongrel uses the best of both the Ruby and C worlds. Internal HTTP parsing is
    done in C, and the API for configuration and application interface is done with
    Ruby. This C foundation gives it very good speed, and the clean Ruby wrapper provides
    a familiar Ruby interface for configuration and extension.


    Mongrel offers huge deployment advantages because it breaks away from opaque protocols
    like FastCGI or SCGI and uses plain HTTP for its transfer mechanism. HTTP is a
    proven, well-tested, transparent protocol that sysadmins know well. Because of
    the affinity to HTTP, you will have a lot of options for integrating Mongrel into
    your production environment. With Mongrel, you can interrogate individual Rails
    processes with simple command-line tools like curl or by using a browser and adding
    the individual Mongrel port number to the URL. By contrast, Apache and lightttp
    use FastCGI, so there is no way to communicate with your Rails process without
    going through your front-end web server.


    If your hosting has already installed Mongrel for you, you can take your new dog
    for a walk. Navigate to your project directory, and type the following:


    ```

    ezra$ cd ~/webroot/current/

    ez$ mongrel_start -d

    ```


    That command will start a Mongrel daemon running in the background on port 3000.
    That port is fine for your development machine, but your


