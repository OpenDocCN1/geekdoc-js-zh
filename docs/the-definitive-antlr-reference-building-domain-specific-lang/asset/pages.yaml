    # 4.2 Virtual Private Servers


    Even after you''ve decided that shared hosting is not enough, one size does not
    fit all. Before you decide to spring for that dedicated host package, take a deep
    breath and look at another attractive alternative. The virtual private server,
    or VPS for host, is the first logical step up to a shared server. Some hosts might
    call these virtual dedicated servers (VDSS). These type of servers run in a virtual
    machine. Multiple VM instances run on one physical hardware server. Before you
    run away shrieking in horror, you need to know that a VPS is not a shared server
    package. You will get complete root access to your VPS, and often you''ll pick
    your operating system from some Linux distribution or FreeBSD.


    Your host may run one of a few different server virtualization software packages.
    Out of all of these I have tried, Xen is my favorite. Xen is a relative newcomer
    to the virtualization scene, but the open source package is built right into Linux
    kernels, the virtualization server processes run a little closer to the metal.
    Xen also offers superior disk I/O, which is a big issue for anything that deals
    with many files. And guess what? The majority of the time, a web application Xen-based
    virtual servers available for hosting clients, so it shouldn''t be hard to find
    one.


    Once you acquire your own VPS, it acts like a dedicated box. You have full access
    to install or remove whatever you need. On a Xen-based VPS, you could even recompile
    your own kernel if you wanted to to'
  merge: -1
