    \ one, even if it is actually else. The reason for this is that all of this proxying\
    \ and indirection, the original hostname will be lost in the shuffle. This trick\
    \ makes it easier for Rails to do things like redirect to its own server, without\
    \ having to worry about unintentionally getting an internal hostname instead of\
    \ the public address.\n\nThe disadvantage is performance. This configuration would\
    \ have Mongrel serving up static content and images, as well as cached Rails pages.\
    \ You didn't go through all this work just to be as slow as Mongrel! You want\
    \ to leverage the Apache web server and have serve the static stuff. The unfortunate\
    \ solution is yet another configuration that will turning up your nose a bit.\
    \ It is not a trivial or easily digestible approach. Luckily, once again, you\
    \ can pretty much take it for line and use it in your applications.\n\nThere is\
    \ another approach that goes away with the ProxyPass and ProxyReverse configurations\
    \ and replaces them with a number of URL rewriting statements. The advantage is\
    \ that Apache will serve content directly, which is faster and leaves Mongrel\
    \ available for more important work that actually requires application code to\
    \ run. The following listing contains the mongrel_proxy.conf file in its entirety.\
    \ I've numbered the sections for later discussion and in capital letters where\
