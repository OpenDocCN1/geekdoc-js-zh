  md: 'Fortunately, Ruby has excellent tools that let you deploy your application
    easier than PHP. The main one is Capistrano, which you''ll see in Chapter 5, *Capistrano*,
    on page 92. When we''re done, the Capistrano script will check your application
    directly out of your Subversion repository and put it exactly where it needs to
    be. But you need to walk before you can run.


    I''m going to take you through the installation process manually. That way, you''ll
    see where everything goes, and you''ll have a greater appreciation of what Capistrano
    is doing for you. Don''t worry, though. I''ll walk you through automating the
    works soon enough.


    Your first job is to put your Rails application on your shared host. You should
    name your root project directory current. (As we mentioned earlier, that''s the
    name Capistrano will use when you automate your deployment.) Since you have SVN
    installed, you can use `svn export` to copy your application url, like this:


    ```

    $ svn export your_repository_url ~/webroot/current/

    ```


    You''ve already done some work to prepare your application for deployment. Even
    so, you''ll often want to build a tiny working application to figure out your
    deployment story before your full application enters the picture.


    If you decide to take this approach, you can build a tiny Rails app in a couple
    of minutes. You''ll create a Rails project, generate a model, create your migration,
    and configure your database. I''ll walk you through that process quickly so you''ll
    have a starter application. If you already have a starter application, skip the
    next section.


    # Creating a Starter Application


    When you are testing a deployment configuration, you''ll often want an application
    simple enough for your grandmother to build. You''ll want this simple application
    to do enough with Rails so you can see whether your production environment setup
    works. You don''t want to debug your deployment environment and your application
    at the same time.


    With Rails, you can take five or ten minutes and build a dead-simple starter application.
    Once you have that working, you can move on to your real application.'
