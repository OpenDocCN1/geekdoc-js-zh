  md: 'Make sure that you use the class_name feature of has_many(_), has_one(_), belongs_to(_),
    and has_and_belongs_to_many()() because Rails uses the top-level namespace by
    default, instead of the current scope, to find the associated class. If you do
    not use class_name, Rails will raise an AssociationTypeMismatch when you try to
    use the association.


    The solution is not perfect. You’re introducing replication, and some features
    such as single-inheritance become troublesome, because you need to declare each
    and every subclass in the migration. and good developers can hear the word DRY—“don’t
    repeat yourself”—in their sleep. Still, your goal is not to keep the two versions
    of your model classes synchronized. You are merely capturing a snapshot of the
    important features of the class, as they exist today. You do not essentially have
    to copy the whole class. You need to copy only the features you intend to use.⁶


    #  Migrations Tips


    You should keep a few things in mind as you deal with migrations. These tips should
    improve your experience with them:


    +   - Keep migrations short. You shouldn’t group together many operations, because
    if half of your migration succeeds, it will be too hard to unwind. Alternatively,
    you can include your migrations in a transaction if your database engine supports
    DDL statements like CREATE and ALTER TABLE in a transaction. PostgreSQL; doesn’t.


    +   - Make sure you correctly identify nullable columns. Columns are nullable
    by default. That’s probably not behavior you want for all columns. Rails migrations
    probably have the wrong default.


    This list of tips is by no means an exhaustive list, but it give you a good start.
    Now, it’s time to shift to looking at improving the rest of your application.


