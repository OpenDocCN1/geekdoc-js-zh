    ```


    Member has an address to an address which was defined with the macro_one :address,as=:addressable,dependent=:destroy.
    Notice that you don''t see an address field in the log when ActiveRecord Loaded
    Member. If you type member.address in the console, you''ll see the following contents
    in development.log:


    ```

    ./plugins/paginating/paginating_find.rb:paginating.rb:98:in=''find''

    Address Load (0.252084) SELECT + FROM addresses

    WHERE addresses.addressable_type = ''Member'') LIMIT 1

    /plugins/paginating/paginating_find.rb:paginating.rb:98:in=''find''

    ```


    So, ActiveRecord does not execute the query for the address relationship until
