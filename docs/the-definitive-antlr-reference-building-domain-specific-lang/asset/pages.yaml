  md: '# Moving In


    # Chapter 5


    # Capistrano


    If you''ve ever rented an apartment or bought a house, you know that the financial
    transaction is only the first tiny step. Moving in comes next, and the process
    can be be, well, overwhelming. In the previous chapters, you used FTP, SFTP, or
    Subversion to install your application onto the shared host. You simply found
    the files you needed to copy, and you used Subversion or FTP to push the Rails
    project directory up to your sever, wholesale. But this limited approach presents
    several important problems:


    +   * It''s not scalable. Once you move beyond a single server, your deployment
    will get more complicated.

    * You need to schedule downtime. While you''re copying your application, the app
    is in an inconsistent state, with some of the files from your old application
    and some from the new.

    * If something goes wrong, it''s hard to backtrack. You would need to put the
    old version of your application back. Doing so means more manual work or guesswork.

    * For FTP, you need to handle source control manually. Unless''re living in the
    dark ages, you''re keeping your code base in a source control system. Most Rails
    developers use Subversion.

    * The deployment process is not automated. You have to do it by hand, which leaves
    room for error. Laziness may be one of the programmer''s greatest virtues, but
    it doesn''t make for perfect execution when many steps are involved.


    +   1. If you''re not using some form of source control, put this book down and
    run, don''t walk, to pick up Pragmatic Version Control [Mas05]. Running without
    version control these days is madness.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'You might decide to use an existing tool, such as rsync. The rsync open source
    utility provides fast, incremental file transfer, meaning it copies only those
    files that change between one invocation and the next.


    This method works a little better than plain old FTP because it still has most
    of the same problems, rsync is usually faster than plain FTP, works better with
    multi-

    servers, and works without any additional modifications to your

    server''s configuration. If you are in a situation where you have little control
    over the rest of the server, this might be an acceptable solution.

    But as a programmer who aspires to do great things, you want more than just the
    acceptable solution, don''t you?


    # 5.1 The Lay of the Land


    So far, you have an application that''s ready for deployment and served

    from a common repository and a host. To move in style, you need some

    software to manage your work. That''s Capistrano. As you see in

    Figure 5.1, on the next page, the Capistrano sits on the developer''s

    client. Think of Capistrano as the moving company that orchestrates

    your move to make your application makes it to the server in an

    orderly and repeatable manner. You just call them up from any phone,

    give the command, and they do the work. Capistrano works the same

    way. You can direct any deployment from the comfort of your develop-

    ment client, without needing to log onto the deployment servers at all.


    For the same reason the company wrote Rails, 37signals created

    Capistrano to solve actual business problems. As its Rails deployments

    ame more regular and more complex, the growing company needed

    an automated solution to handle complex application deployments.

    This typically entailed deploying code updates to at least two web ser-

    vers and one database server. Any solution would need to do at least

    the following:


    +   - Secure update mobile web and database servers from a central

    s code control repository.

    - Be sensitive to errors, and roll back any changes if necessary.

    - Work with the Rails file layout and allow logging to happen without

    interruption.

    - Operate quickly and reduce the need for downtime.

    - Work well with Ruby on Rails.'
  merge: -1
