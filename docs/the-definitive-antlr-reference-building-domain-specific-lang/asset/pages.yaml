  md: '# Using Hosting Company Subdomains


    Some shared hosts also provide you with a subdomain to use while you are setting
    up your site. This might be something like http://ezmobius.myhost.com. I strongly
    recommend against this approach because it looks less professional and requires
    that you use a third-party service for your email.


    Also, if you switch to a different host, you will have to inform all your visitors
    that your address has changed. When using your own domain name, you can switch
    from one host to another with fewer consequences, and your customers never need
    to know.


    You may be able to see your new application before the bulk of your customers,
    depending on where you live and the DNS services near you. Propagation time can
    range from less than an hour to a couple of days, so plan in advance. While you''re
    waiting for the DNS changes you can switch gears and focus on configuring the
    shared host.


    # 3.4 Configuring Your Server


    Configuring your server is surprisingly easy when you follow a simple plan. It
    really amounts to providing access to your server through SSH and your document
    root and creating your application''s database. If you do these steps correctly,
    you''ll have a good foundation for the easy deployment of your web server and
    Rails app.


    First, you will need to determine your application''s root directory. You don''t
    know exactly where to put your application, ask Most host accounts will create
    this directory for you and set permissions appropriately. In the rest of this
    chapter, I''ll refer to that directory as the application root. Your document
    root is the root directory for your web server and will hold your static files.
    Usually, you''ll put your Rails in a directory called current, meaning your document
    root will be current/public. From here on, I''ll refer to that directory as the
    relative root (/current).'
