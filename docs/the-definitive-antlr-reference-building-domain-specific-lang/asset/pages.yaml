  md: 'On each balancer member, you''re going to create two files, only to keep the
    concerns separated as before. These files will also reside in /etc/apache2/conf/applications/,
    and you''ll need to remember to add the Include conf/conf/*. to /etc/apache2/apache2.conf.
    These are the files you''ll need:


    +   - mongrel_cluster.conf will define a load balancer that will distribute requests
    across two or more Mongrel servers.

    - mongrel_proxy.conf will define a virtual host that will proxy typical HTTP requests
    on port 80 to the Mongrel cluster.


    Note the lack of a secure SSL configuration. The reason for omission is that our
    software load balancer configured in the previous section will take care of that
    for us. Hardware load balancer would do the same. Secure requests are proxied
    to a basic HTTP service on port 80 of our balancer members, which are inside our
    firewall. This keeps the configuration of the balancer members cleaner. The exception
    is if you want to export your balancer members directly (for example, www.brainspi.at),
    then you may need additional configuration in the load balancer to support SSL
    for each one.


    The Mongrel cluster configuration in mongrel_cluster.conf will look very familiar:


    ```

    # mongrel_cluster.conf

    <Proxy balancerMember://mongrelcluster>

    BalancerMember http://0.0.0.0:8000

    BalancerMember http://0.0.0.0:8001

    BalancerMember http://0.0.0.0:8002

    BalancerMember http://0.0.0.0:8003

    </Proxy>

    ```


    This time, you''ll notice that we''re not balancing to a different server. Recall
    our Capistrano roles. In this case, it''s clear that one server is filling both
    the web and app roles. If we wanted to separate the web and app roles, we would
    run the Mongrel on a different server, and the IP addresses in the cluster would
    be a remote server. For example:


    ```

    # Alternative mongrel_cluster.conf

    # with separated web and app roles

    <Proxy balancer://mongrelcluster>

    BalancerMember http://10.0.0.104:8000

    BalancerMember http://10.0.0.104:8001

    BalancerMember http://10.0.0.104:8002

    BalancerMember http://10.0.0.104:8003

    </Proxy>

    ```'
