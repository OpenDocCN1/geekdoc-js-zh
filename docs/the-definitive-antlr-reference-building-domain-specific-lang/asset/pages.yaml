  md: '![](img/a2b912fcaa70ea563309a38603eb4e7d_93_0.png)


    Figure 5.1: Capistano map


    In the early stages of Rails development, Jamis Buck wrote an application named
    Capistano to solve this problem. Like Rails, Capistano is opinionated software
    and assumes that you do the following:


    +   * Deploy to a dedicated server.

    * Use a Unix-like operating system and file system on the server.

    * Have SSH access to that server.

    * Use Subversion or some other form of source code control.

    * Have the ability to run commands as root with the sudo command.

    * Deploy to a web server, an application server, and a database server (on one
    or more machines).


    Fortunately, you can still configure Capistano if these assumptions don''t hold
    in your particular situation. Shared hosting is such a situation, and I will show
    you how to set up a rock-solid recipe for Capistano later in this chapter.'
