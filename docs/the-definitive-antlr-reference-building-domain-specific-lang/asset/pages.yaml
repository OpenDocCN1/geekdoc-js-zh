  md: 'You''ll need to ensure that you have the mongrel_cluster gem installed first.
    Once it is, you simply need to create a file at /etc/mongrel_cluster/myapp.conf.
    I recommend replace myapp with the name of your application, but you can use anything
    you like. If you''re running multiple applications on one server, you can have
    multiple Mongrel cluster configuration files. In the file, you configure Mongrel
    cluster with a few simple options. They are documented with inline comments in
    the following configuration file:


    ```

    # /etc/mongrel_cluster/myapp.conf


    # The user and group with which to run Mongrel

    user: deploy

    group: deploy


    # The location of your Rails application

    # and the environment to run within

    cwd: /home/deploy/apps/myapp/current

    environment: production


    # The number of servers in the cluster

    servers: 2


    # The starting port

    # e.g. with 3 mongrels would bind ports 8000-8002

    port: "8000"


    # The IP Addresses allowed to connect to Mongrel

    # If your web server proxy is separate from your app server,

    # put its IP address instead of the localhost IP address

    address: 0.0.0.0


    # The location of the process ID files relative to the rails app

    pid_file: log/mongrel.pid

    ```


    With that configuration file in place, you can now start, restart, or stop Mongrel
    using the following command from any current working directory:


    +   - mongrel_cluster_ctstart will start a Mongrel cluster from scratch.

    - mongrel_cluster_restart will restart a running Mongrel cluster.

    - mongrel_cluster_ctstop will stop a Mongrel cluster.


    Now that you have your cluster of Mongrels happily running as a service, you can
    turn your attention to managing the Mongrel server. The Monit tool will help you
    handle scenarios where your Mongrels might run out of memory or experience any
    other problems.'
