  md: 'You''ve spent a little time getting your deployment right, by you should already
    be seeing the benefits. You now have a deploy command that is also secure, integrated
    with source control, informative to your users, and completely automated. True,
    I''ve shown you only the most basic setup so far, but in the rest of the chapter
