  md: "# 5.2 How It Works\n\nYou will need to install the Capistrano gem 2.0, so its\
    \ dependencies. The recipes in this chapter use Capistrano so it is install now.\
    \ Remember, local$ is the prompt on your local development machine, and ezra#$\
    \ is the prompt on your development server:\n\n```\nlocal$ sudo gem install capistrano\n\
    ```\n\nAlways keep in mind that Capistrano runs on your local machine. We use\
    \ Net::SSH and Net::SFTP to connect to your remote servers and run shell commands\
    \ on them. This means you do not need to install Capistrano on your remote server,\
    \ only on the machines you want to use to trigger a deploy.\n\nOnce you've configured\
    \ Capistrano with a few variables, called a recipe, you can deploy with the following\
    \ simple command (some initial setup is required, I'll cover next):\n\n```\nlocal$\
    \ cap deploy\n```\n\nThis unarming command does everything you need to reliably\
    \ deploy your application. Rather than tell what you's happening in English, you\
    \ can just look at the Ruby deploy task:\n\n```\ntask :deploy do\n  transaction\
    \ do\n    update_code\n    symlink\n  end\n\n  restart\nend\n```\n\nThat's a pretty\
    \ simple block of Ruby code. Capistrano uses a Rake-like syntax for defining tasks\
    \ that will execute on the server. Each task has a name, followed by a code block.\
    \ This task, named deploy, does the following:\n\n+   1. Before either of these\
    \ lines is executed, Capistrano connects to your server via SSH.\n2. The code\
    \ begins a transaction. That means that all the code will happen in the scope\
    \ of the transaction. If any part of the transaction fails, the whole transaction\
    \ will fail, triggering a rollback. I'll cover rollbacks later in this chapter."
  merge: -1
  pgno: 94
- img_proc: true
  md: '# HOW IT WORKS


    +   3. The first step in the transaction, update_code, does a Subversion checkout
    to load a full copy of your Rails application into a dated release directory on
    the remote server. For example, a cap deploy might create a directory called releases/200704161901111.
    The number 200704161901111 is actually a time for 7:01:11 p.m. on April 16, 2007.


    +   4. The next step in the transaction, symlink, links the log directory for
    your Rails application to a shared log directory. symlink then links your application''s
    folder to the current directory so the web server can find it.


    +   5. The task finally restarts any active Mongrel or FastCGI processes.


    Each of these steps is a critical component to a secure, successful deployment.
    Using Subversion ensures that Capistrano will always get the right code base.
    SSH provides the necessary security so your files cannot be compromised in transit,
    and the symlinks also lets you revert to an older version of the code if your
    code is bad or Capistrano encounters an error. Finally, Capistrano restarts any
    active Mongrels or FastCGI processes, and the new code goes live.


    The Capistrano deploy task is certainly better than rsync, but the automation
    comes at a cost. You''ll need to do a little setup, but not too much. Before I
    walk you through the gory details, let''s take a look at Capistrano''s file organization.


    # Capistrano''s File Organization


    37signals built Capistrano specifically to deploy Rails applications, but you
    can configure it to work with other types of applications too. The default release
    assumes you have a log directory for log files and a public directory for the
    web server''s files.


    Every time you deploy, Capistrano creates a new folder named with the current
    date and checks out your entire Rails app into that folder. It writes the whole
    thing with several symbolic links. The directory structure is shown in Figure
    5.2, on the following page. Notice the current directory doesn''t have the physical
    file structure underneath it. current directory is only a link to a specified
    folder in the releases directory. The result is that current will always hold
    the current active version of your application. For your convenience, Capistrano
    also creates a public/system folder and links it to the shared/system directory,
    helping you retain cache files or uploads between deployments.'
