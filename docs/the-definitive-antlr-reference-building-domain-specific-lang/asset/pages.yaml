  md: '# 2.2 Source Code Management


    Good deployment strategies always start with a good foundation. I want to be able
    to deploy the same application to my servers with identical results every time.
    That means I need to be able to pull a given version of the application from a
    central source. Anything won''t give me a dependable, repeatable results. Frankly,
    Rails will automate a whole lot of the deployment strategies, but only if you
    use the common infrastructure that other Rails developers do.


    Unless you have a strong reason to use something else, you''ll want to use Subversion
    for your application''s source control. The majority of Rails developers use it,
    the Rails teams use it for Rails, and the Rails plug-in system also uses it. Version
    Control with Subversion [PCSCF04] is a great book about Subversion. You should
    also check out Pragmatic Version Control [Mas05] for a pragmatic view of source
    code in any language. For this chapter, I''m going to assume you already have
    Subversion installed and running.


    # Subversion on Rails


    The keys to using Subversion with Rails are maintaining the right structure. You
    want to keep the right stuff under source control and keep the wrong stuff out.
    Setting up your application''s repository right the first time will save you time
    and frustration. A number of items in a Rails application do not belong in source
    control. Many new Rails developer have clobbered their team''s database.yml file
    or checked in a 5MB log file. Both of these problems are with the Subversion setup,
    not Rails or even the Rails developer. In an optimal setup, each developer would
    have their own database.yml file and log files. Each development or production
    instance of your application will have its own version of these files, so they
    need to stay out of the code repository. You might already have a Subversion repository
    already, but I''ll assume you don''t and walk through the entire process from
    scratch.


    # Repository Creation


    Start by creating a new Subversion repository for your Rails project. Log in to
    the server that will have your Subversion repository. Create a directory for your
    repository, and let Subversion know about it:


    ```

    $ svadmin create /home/ezra/svn

    ```


    The authors of Subversion recommend creating all repositories with three folders
    at the root: trunk, logs, and branches. This setup works best'
