  md: '# Building the Latest Ruby from Source


    Ubuntu and Debian releases often do some strange things with Ruby. A given release
    may break Ruby up into tiny pieces or install some earlier release of Ruby. If
    you want Ruby-1.8.6, you will need to build from source.


    The first step is getting the latest stable release of Ruby. In your web browser,
    go to the Ruby home," and download the desired release. I''m going to install
    Ruby-1.8.6.


    ```

    ezra$ get ftp://ftp.ruby-lang.org/pub/ruby/ruby-1.8.6.tar.gz

    ```


    Now, unpack, build, and install Ruby:


    ```

    ezra$ tar -xvf ruby-1.8.6.tar.gz

    ...

    ezra$ cd ruby-1.8.6.tar.gz

    ezra$ ./configure && make && sudo make install

    ```


    You will need to make sure your PATH includes /usr/local/bin in it:


    ```

    ezra$ echo $PATH

    /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    ```


    If you don''t have /usr/local/sbin/local/bin in your PATH, you will need to add
    to it. Open /etc/profile with your editor, and add the following line:


    ```

    export PATH=$PATH:/usr/local/sbin:/local/bin

    ```


    Those are the basic steps required to build Ruby from source. Please note that
    if you choose to build your own Ruby, it will not work with the Ruby packages
    in Ubuntu. You will have to install the mysql and magick gems through Ruby Gems
    and not through apt-get.


