    Just below the basic HTTP configuration, you''ll see the first rewrite rule. You''re
    all familiar with rewrite rules from the Apache configuration; however, I think
    you''ll agree that these are cleaner and easier to read. That first rewrite rule
    checks for the existence of a main.html file and displays (and only it) if it
    exists. This rule allows you to gracefully respond to your visitors while you
    are making changes requiring an application shutdown.


    The location block allows nginx to set custom configuration options for different
    URLs. In this default configuration, I''m setting configuration options for the
    root (/). The index directive tells nginx which file to load for requests like
    /or/. Here I''ll use the standbys index.htm and index.html.


    Next you''ll see a group of proxy_ directives that forward forward information
    about the client and spoof information about the host to help hide the nginx proxy
    from the Rails application. This way, Rails has all the information it would normally
    have if it were serving requests directly to the user from one of the Mongol servers.
    The forwarded information includes the IP of the client and the hostname we want
    to see (for example, brainsplatat instead of the internal address of our Mongol
    server). This is important for the request objects to work properly.


    The sections immediately after the proxy_ directives are the meat of the URL rewriting.
    The Expires directive sets the Expires header for any URLs that match images,
    JavaScript, or style sheets. This rule will make the client download these respective
    assets only once and use their local cached versions for years from the first
    download. When Capistrano deploys Rails apps, Capistrano appends a timestamp to
    the URL so that clients will think they are new assets and download again. This
    allows you to push changes to the same filename and properly invalidate the cache.'
