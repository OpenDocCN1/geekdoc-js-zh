    # 6.1 The Lay of the Land


    clustering Mongrel is the first step to achieving better scalability with Ruby
    on Rails. You''ll find the process amazingly easy to do. First, you''ll build
    a customized configuration file that will let you predictably and reliably restart
    Mongrel with an automated script. Then, you''ll use a Mongrel cluster to launch
    more than one Mongrel so that your installation can share many simultaneous requests.


    After you have a working cluster, you will place that cluster under a monitoring
    process that calls Monit. This watchdog process will take action when rogue Mongrel
    processes take too much memory, stop responding, or misbehave in other ways. The
    Mongrel cluster under management from Monit is shown in Figure 6.1, on page 126.


