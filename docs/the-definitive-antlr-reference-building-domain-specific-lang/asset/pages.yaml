    So, Pen works great for small apps that need a bit of load balancing

    help, but what do you do when you have to handle a lot more requests?

    You''re going to have to use some Windows system administrators

    refer to as "the A word."


    # 8.4 Using Apache 2.2 and Mongol


    If you need to handle load, there''s no better solution on Windows that

    Apache 2.2. Not only can you load balance with relative ease, but you

    also make Apache serve all the static content such as cached pages,

    CSS, JavaScript, and images. If you''re taking advantage of proxy caching

    (and if you''re doing a public site), then Apache is going to

    be your best for high performance.


    Another great advantage of using this approach is that you can "bor-

    row" a lot of configuration files from the *n guys.


    # Install Apache


    Download the Apache 2.2 Windows binary from Apache. 10 Be sure to

    grab the latest release.


    Install Apache 2.2 using the installer you downloaded.


    The wizard will be pretty easy to handle. I''ll walk you through

    a few of the highlights. Most important, be careful when you pick a

    port. I usually choose to install Apache for a single user on port 8080

    to prevent conflicts with IIS on port 80. I''ll install the Windows ser-

    vice manually later. Also, make sure you don''t install Apache as a web

    service, as shown in Figure 8.4, on the next page.


    Install Apache to c:\apache or some other directory you can easily find

    later. The Apache configuration should complete without any problems.


    > 10. http://httpd.apache.org/download.cgi'
