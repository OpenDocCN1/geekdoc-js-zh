    I left home the first time, I wanted to move right into a castle, but real life
    doesn''t work out that way. Most people first move into an apartment or dorm room.
    True, apartments don''t come with their own throne room and servants'' quarters,
    but they do have their advantages. You''re sharing common resources and infrastructure
    with many others, so you wind up paying less. You don''t have to move the lawn
    or paint the fence. For most people, the first Rails apps runs in modest quarters
    for many of the same reasons: shared infrastructure, lower costs, and help with
    the maintenance. In this chapter, you''ll learn how to pick and prepare a shared
    host.


    # 3.1 The Lay of the Land


    Many Rails apps start on a shared server, as shown in Figure 3.1, on the next
    page. You''ll buy one slice of a larger server that will have the ability to serve
    your Rails application and static content. You''ll use Subversion to install your
    application while you set up your initial infrastructure, until you''re ready
    to automate with Capistrano. For a few dollars a month, you''ll have your own
    domain name, access to a database server, several email accounts, and maybe even
    a Subversion repository. For many people, this setup is enough for a blog, a site
    prototype, or even a bug-tracking system.


    If you can cache your application, and sometimes if you can''t, you can serve
    hundreds of users without needing to pay US$100 per month for a dedicated server.
    Your hosting company will fix intermittent problems, occasionally upgrade your
    machine, and keep things running'
