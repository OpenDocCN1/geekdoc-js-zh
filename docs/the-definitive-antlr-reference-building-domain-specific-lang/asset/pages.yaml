  md: 'So far, all I''ve done is set up an ideal expectation for performance. The
    next step is to eliminate bottlenecks. Many experts have explored Rails performance.
    One of the best is Stefan Kaes. The noted Rails performance identified several
    Rails bottlenecks in his often-quoted talk at RailsConf.¹ The items are still
    as relevant today as they were when the list was first revealed:


    +   - Slow helpers. Since views often call helpers inside tight loops, it''s easy
    to build helpers that take much too long to calculate. For such common helpers,
    make sure you keep them lean.


    +   - Complicated routes. Each time the web server invokes Rails, the routes in
    your routes.rb file. You don''t want to have any complex calculations in there.


    +   - Associations. Active Record makes it easy to build database-backed code—almost
    too easy. When associations get loaded often, performance will suffer. I will
    walk you through the most critical performance cases in the section that follows.


    +   - Retrieving much from the database. Active Record retrieves the whole database
    by default, and sometimes, you just''t need all that data. If you''re retrieving
    a row with a 4KB description just to get a foreign key, you may want to trim down
    that query with `select`.


    +   - Slow session storage. Sessions across many users can add up. Since sessions
    represent shared memory that Rails holds for definite periods of time, you need
    to pay them special attention.


    In the sections that follow, I will walk you through a couple of the most common
    performance problems. I''ll start with Active Record bottlenecks. Active Record
    is one of the most powerful frameworks built. You can find Rails developers mocking
    their Java counterparts with a few lines of code that set up the database, process
    five relationships, process six custom validations, and even solve world peace—all
    with a dozen lines of code. Unfortunately, all that convenience and flexibility
    comes at a cost. A few months later, those same Java counterpoints are often the
    ones doing the mocking. Active Record, out of the box, is *slow*. Luckily, you
    have a few tools at your disposal to speed things up:


    > ¹ http://railsxpress.de/blog/files/slides/railsconf2006.pdf'
