  md: "# Building Monit on RHEL or CentOS\n\nYou need to install a few dependencies\
    \ before you can get Monit to build on Red Hat or CentOS distributions. Use rpm\
    \ or yum to search for and install the following packages: flex, bison, and byacc.\
    \ Once you have these prerequisites installed, you can build Monit with the same\
    \ instructions shown for other systems.\n\nEarlier versions do not support the\
    \ --clean option. It is important because Mongrel 1.0+ will not start if there\
    \ is a process identification (PID) file sitting on disk. So if your server crashes\
    \ and has to be rebooted, Mongrel tries to start up and fails because there was\
    \ a leftover PID file. The --clean option deletes leftover files if they exit.\n\
    \n+   * You need a good mongrel_cluster.yml file. You've already built one earlier\
    \ in this chapter, and that one work fine.\n* You need a Monit configuration file,\
    \ called mongrel.monitrc. This configuration file will tell Monit what to do for\
    \ each Mongrel on your system.\n\nThe first order of business is to install Monit.\
    \ Most Linux distributions will have a Monit package available in their package\
    \ managers. On Debian/Ubuntu you can run sudo apt-get install monit, and on Generic\
    \ you can run sudo emerge monit. If you cannot locate a package for your preferred\
    \ Linux, don't sweat it, because you can build Monit from your source, like this.\n\
    \n```\nezra$ wget http://www.tildash.com/monit/dist/monit-4.9.tar.gz\nezra$ tar\
    \ xvzf monit-4.9.tar.gz\nezra$ cd monit-4.9\nezra$ ./configure & make && sudo\
    \ make install\n..\n```\n\nNext up you need to install the correct version of\
    \ mongrel_cluster. You will want the latest version from RubyForge. It is important\
    \ to clean up older versions of mongrel_cluster if you had installed:\n\n+   $\
    \ sudo gem install mongrel_cluster \n&& sudo gem cleanup mongrel_cluster"
  merge: -1
