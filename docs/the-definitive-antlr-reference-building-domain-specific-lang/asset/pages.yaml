    Before moving on, you should know that a single instance of Pen is

    working for only one Rails application. If you are trying to serve

    multiple Rails applications with Pen, you''ll need to copy pen.exe

    to another file like my_app_name_pen.exe and then set up the service with

    a new name. You could end up with a few services if you''re serving

