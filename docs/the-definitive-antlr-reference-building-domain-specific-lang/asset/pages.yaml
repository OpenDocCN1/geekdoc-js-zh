    Keep in mind that these services aren''t set to automatically start when you reboot
    the server, your app isn''t going to be available after a restart. Let''s remedy
    that: Configure each service to start up automatically by right-clicking each
    service and setting the start-up type to Automatic.


    Test each address to make sure the requests you work and the services are in fact
    serving your web application. http://localhost:4001 and http://localhost:4002
    should both be serving the same application.


    So, you have two instances of your application running on different ports. That''s
    better than one, but the setup is not useful yet; you need to load balance them,
    and you make that happen by using Pen or Apache.


    # 8.3 Mongrel and Pen


    Pen is a nice, simple way to load balance an application without doing too much
    setup. Pen is great for small sites without a huge number of expected connections,
    and it''s great because you don''t have to spend a lot of time learning how to
    configure it. Pen handles reverseing and balancing very well, but it isn''t a
    web server, which means you can''t serve static content with it. Your static content
    will be served by your back-end Mongrel services. For small apps with more than
    a couple of users, this setup should work just fine.


    You can download a Windows binary of Pen from ftp://siag.nu/pub/pen/pen-0.17.1.exe.


    Pen supports SSL, but its support is very experimental, if you need it to host
    a secure site, you''ll have to use some sort of proxy server in front of this
    setup.'
