  md: 'I won''t recommend any single provider, but you should look for several

    critical features in a shared host.


    # Basic Requirements


    At minimum, the host you choose must have the following features:


    +   * Ruby 1.8.6 or Rails 1.2.6 or Rails 2.0.


    +   * Mongrel support. Some shared hosts don''t yet support Mongrel,

    but there are plenty that do, and Mongrel is rapidly emerging as

    t de facto standard within the Rails community.


    +   * The ability to specify the web server''s document directory.

    There are ways to get this, but it is much easier if the host

    provides an interface where you can point the web server to

    preferred directory, perhaps one like /home/ezra/brainpl.at/current/

    public.


    +   * SSH access. This is crucial for troubleshooting your installation

    and is required for deploying with Capistrano. Some very inxpen-

    sive you to transfer files only by FTP, so choose one

    that has SSH as an option.


    +   * A database server and the required Ruby gems to connect to it.

    MySQL and PostgreSQL are popular, but you can use file-based

    dabase managers such as SQLite just as easily.


    For the optimal Rails setup, I recommend these features:


