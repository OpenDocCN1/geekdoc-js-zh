  md: 'It can be frustrating if you make a mistake, which is another reason why I
    start with a fresh server. If you make a mistake and somehow the servers get out
    of sync and become deadlocked, you can start over. Simply use RESET MASTER and
    RESET SLAVE. The slave should be stopped, before resetting them. You should requery
    the master status with SHOW MASTER STATUS and rerun CHANGE MASTER to reconfigure
    the slave before restarting. It''s a worthwhile exercise to tinker with this on
    a couple of test database instances and make mistakes on purpose to see how to
    get out of them. If you have data to import, you can simply run your dump script
    after the master once it is set up correctly. The slave should replicate all the
    imported data, assuming''s all set up.


    You can also set up read-only databases. If your application is far heavier on
    writes than reads, then you may want more than one read-only database. The cool
    thing is that adding more read-only slaves can be a simple matter of stopping
    the slave temporarily, copying the slave virtual machine, and of course configuring
    the machine''s identity. Recall that this includes the hostname, the IP address,
    and also the MySQL server ID! Don''t forget that. You can start up the slaves,
    and the new one will pick up as if it had been there.


    To test your configuration, connect to the master server, create a database, create
    a table, and write a row or two to it. Then log onto the slave server to see whether
    the changes were replicated.


    # Configuring Your Rails Application


    Now that you have two databases, one for writing and one for reading, you need
    to tell Rails how to use them. Unfortunately Rails does not support this out of
    the box. So, you can write yourself to override the finds and which database they
    can connect to, or you can search for something someone else has already built.


    I did, and I found something really like acts_as_readonly (yes, that''s the name).
    You can find it at the latest URL I ever had to put in a book (Google works too:
    http://revolutionrails.blogspot.com/2007/04/plugin-release-actsasreadonly.html)


    Names aside, acts_as_readonly uses a very clean syntax and simple configuration
    for dealing with read and write databases. Follow the instructions on the website
    for installation. At the time of this writing, it was simply a script/plugin install
    with their most current release tag in their Subversion repository.'
