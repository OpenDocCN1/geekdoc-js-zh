- img_proc: true
  md: '# 8.7 Strategies for Hosting Multiple Applications


    You can use several strategies to host several applications, and the one you choose
    depends mostly on the number of users who will use your system. When you have
    many users and long HTTP requests such as file uploads, you will have to address
    scaling through adding more back-end processes. That was traditionally done by
    increasing the number of FastCGI processes, but now you can add another instance
    of Mongrel to our cluster.


    The next few sections will cover various strategies you can use to deploy several
    applications in production.


    # Serve Several Small Applications Using IIS and Mongrel


    Serving many small applications is a simple approach. Each application is installed
    as a Windows service with Mongrel running on a different port. You can then use
    IIS with API_Rewrite, and the reverse_proxy_fix plug-in to attach each application
    to its own URL within IIS as in Fig-ure 8.6, on page 215:


    ```

    http://www.yourdomain.com/app1 ⇒ http://localhost:4001

    http://www.yourdomain.com/app2 ⇒ http://localhost:4002

    http://www.yourdomain.com/app3 ⇒ http://localhost:4003

    ```


    The ISAPI_Rewrite rules for this are simply as follows:


    ```

    RewriteProxy /app1(.*) http://localhost:4001[I,U]

    RewriteProxy /app2(.*) http://localhost:4002[I,U]

    RewriteProxy /app3(.*) http://localhost:4003[I,U]

    ```


    You would then need to apply the Reverse_Proxy_Fix plug-in to each of your applications,
    setting the BASE_URL parameter for each originating URL.


    I don''t recommend doing this for production. There''s no support for page caching
    here, and there''s just no way to scale up to. However, it is a really great approach
    to demo a site to your stakeholders quickly without going through a lot of complex
    setup.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Applications, Users, and Requests


    How do you measure the size of an application, and how do you choose the method
    of deployment? People tend to think about application size by thinking about how
    many users the app will have. There''s a slight problem with that, though.


    I could have an application with hundreds of models. The application could be
    very complex, but if there are only 100 people using the application, it''s not
    going to be problematic to just throw up one instance of Mongrel and let it do
    the work, provided that there aren''t any simultaneous requests.


    I could also have an application with five models and three controllers, and this
    application gets 100,000 times a day by students who are registering for a summer
    orientation session at a university. A single instance of Mongrel would probably
    work, but there would be a lot of waiting going on.


    The number of users an application can support is really not a good measure, though.
    With Ajax becoming more popular and with Rails'' support of REST, you may see
    more hits to your application than you expect, whether it be from a user''s browser
    or another web service.


    Requests per second is a much better measure for your site. How many requests
    do your app need to support per second? Six? Twenty? A hundred? This is something
    you need to figure out by benchmarking existing applications and doing some forecasting.
    An application that supports five requests per second can serve 144,000 requests
    in an eighthour period. That''s not too bad. The problem is that a Rails application
    is single-threaded. A single instance of Mongrel can serve only one request at
    a time. If you have an Ajax-based search on your site, the live updating that
    the search does cause other requests to get stuck in a queue.


    So, test your apps, and determine the requests per second. If you determine that
    your small internal application can run on a single instance of Mongrel, that
    makes life easier. You can easily scale up using the techniques in this book.


    Keep in mind that on Windows, your app will typically perform much slower than
    on another platform, so you may require more balanced back ends to process the
    same number of requests.'
  merge: -1
  pgno: 213
