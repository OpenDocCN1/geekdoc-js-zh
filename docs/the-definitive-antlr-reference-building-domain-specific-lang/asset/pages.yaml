    \ featured mongrel_proxy.conf\n<VirtualHost www1.brainslpl.at>\nServerAlias 10.0.0.102\
    \ # if you don't have a hostname\nRequestHeader set X_FORWARDED_HOST 'www.brainslpl.at'\n\
    \n###### New configuration elements begin here. ###\n\n# 1. Document root specified\
    \ to provide access to static files directly\nDocumentRoot /home/deploy/applications/myapp/current/public\n\
    <Directory /home/deploy/applications/myapp/current/public>\n  Options FollowSymLinks\n\
    \  AllowOverride None\n  Order allow,deny\n  Allow from all\n</Directory>\nRewriteEngine\
    \ On\n```"
