    # Intangible Factors


    Shared hosts have variable reputations. You''ll want a shared host with a good
    reputation for support and one that runs a tight ship. You may not like nasty
    email from the overzealous, pimple-ridden admin that threatens the life of your
    firstborn because your application is taking more than its share of resources,
    he is exactly what you need running your server. He will keep all the other apps
    on shared host in line too. You''ll also want a company with enough experience
    to give you a little grace if traffic spikes once in a while and won''t kill your
    Mongrels without any notification when they step out of the common parameters.
    System maintenance such as regular backups and cycling log files is a plus because
    you''ll not have to do them yourself.


    The best way to measure intangibles is to ask around. Good Rails programmers will
    know who the good vendors are. I won''t list any here because I am such a vendor,
    but be warned. The best shop today—one with good deals and good admins—could experience
    unmanageable growth, could lose that admin who made everything run like a Swiss
    watch, or could get just lazy. Ask around and keep up. You''ll be glad you did.
    You can start with the excellent Ruby on Rails wiki¹ or by chatting with Rails
    developers on IRC.²


    After you''ve done your homework and picked your host, you''ll want to start things
    up. But first things first. You''ll need to tell the world where your application
    lives. That means you''ll need a domain name, and you''ll need to configure DNS.


