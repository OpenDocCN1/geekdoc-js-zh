  md: "# Page Caching\n\nPage caching is by far the simplest and most effective caching\
    \ option if your pages and application are static enough. Getting the basics right\
    \ is simple. Nails down all the details can be unbearably difficult. I'll cover\
    \ the basics first.\n\nSay you have a controller with an index action. The index\
    \ action creates a catalog page that is relatively complicated, but it rarely\
    \ changes. Your current setup is not fast enough anymore, so after carefully considering\
    \ your options, you decide to cache. Since your page is completely the same for\
    \ each user and changes infrequently, you correctly decide that you should use\
    \ page caching.\n\nYou will need to change your controller to cache the page.\
    \ You'll also need some strategy for deleting the static page when you want Rails\
    \ to generate an updated version of your page. You could easily cache the page\
    \ like:\n\n```\nclass CatalogController\n  caches_page :index\n```\n\n```\ndef\
    \ index\n  # do something complicated\nend\n```\n\nWhen you run this application\
    \ in development mode, you'll see no difference. Caching is turned off by default\
    \ in development mode as you would expect. When you're developing, you want to\
    \ immediately see code changes reflected in your web page. You can turn caching\
    \ on by editing config/environments/development.rb changing false to true in the\
    \ following line:\n\n```\nconfig.action_controller.perform_caching = true\n```\n\
    \nNow, when you point your browser to localhost:3000/catalog for the first time,\
    \ Rails will create a static HTML page by the name of public/catalog/index.html.\
    \ Caching is very effective when you use it because Rails never ever gets involved.\
    \ Your web server can just serve the static page, which can improve your throughput\
    \ by a factor of 100 or more. Your web server will serve that static page until\
    \ you physically delete it, which brings us to the next topic."
  merge: -1
