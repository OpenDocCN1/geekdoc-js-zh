  md: '# STABILIZING YOUR APPLICATIONS


    Gems all reside in a lib folder. To move your gem to version control, you just
    need to copy the contents of that lib folder to vendor, like this:


    ```

    $ cp -R money-1.5.9/lib/*

    $ cp money-1.5.9/MIT-LICENSE LICENSE-money

    $ rm -Rf money-1.5.9/

    $ ls

    LICENSE-money bank money.rb plugins rails support

    ```


    Make sure you abide by your license agreements, for example, to comply with the
    previous gem''s license, you also need to copy the license with the code. Next,
    add and check in the new files:


    ```

    $ svn add --force *

    LICENSE-money

    ...\message=cattr_accessor.rb

    ```


    ```

    $ svn commit --message="Imported Money library 1.5.9"

    Adding LICENSE-money

    ...\Transmitting file data ......

    Committed revision 4.

    ```


    # Upgrading an Unpacked Gem


    When you are ready to integrate a new version of the gem into your application,
    you essentially follow the same procedure:


    ```

    $ gem unpack money

    Unpacked gem: ''money-1.7.1''

    $ cp -Rf money-1.7.1/lib/*

    $ cp -f money-1.7.1/MIT-LICENSE LICENSE-money

    $ rm -Rf money-1.7.1

    $ svn status

    money/core_extensions.rb

    money/money.rb

    rails

    $ svn commit --message="Upgraded Money to 1.7.1"

    Sending money/core_extensions.rb

    Sending money/money.rb

    Transmitting file data ..

    Committed revision 5.

    ```


    If the library provider deleted or moved files, you would need to do the same
    thing too. Check the library''s release notes to learn about any requirements
    for backward compatibility. A great tool that automates importing new releases
    of a library is svn_load_dirs (http://svn.collab.net/repos/svn/trunk/contrib/client-side/).'
