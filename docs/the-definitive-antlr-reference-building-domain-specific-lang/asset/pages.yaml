  md: 'is not a hardware book! So, pretend that you''re a start-up with a Rails application
    experiencing medium to high load and that you have made an informed decision to
    cluster your MySQL database despite these challenges.


    # Separating Reads and Writes


    The first approach to scaling out your database would be to separate the reads
    from the writes. MySQL has decent support for this model through its master/slave
    replication. The idea here is that all data is written to one of the single databases,
    the master, while all data reads occur on the slave. This strategy lets you optimize
    the databases specifically for read or write performance and split the database
    up on separate servers.


    # Configuring MySQL Master/Slave Replication


    I have kind of a conservative nature, so I don''t like to mess around existing
    data too much. Regardless of whether I have an existing database, I take the same
    approach to introducing the master/slave configuration to my environment. I will
    take the time to build a new master and slave virtual server from scratch. I find
    it less risky because I work offline and less problematic because I am not balancing
    between old and new configurations. Once I''ve prepared the new master/slave servers,
    it''s simply a task of dumping your data from the old database and uploading to
    the new one. Then, I can shut down the old server and introduce the new one into
    the environment. This approach may sound like you would have a lot of downtime,
    but really, you need to be down only for long as it takes to dump the old data
    and import it into the new database. You won''t have to rebuild your database
    infrastructure very often.


    To set this up, you''ll need two MySQL 5.0+ database servers, on virtual machines.
    The first thing you''ll need to do is give each of yours an identity. On the master
    machine, open /etc/my.cnf, and add the following lines to the [mysqld] section:


    ```

    # /etc/my.cnf on MASTER

    # These lines added below the [mysqld] section

    log-bin=mysql-bin

    server-id=1

    ```


    The first line, log-bin, tells MySQL to log activity in a binary format file using
    the prefix specified on the right side of the assignment. Binary logging needs
    to be done only on the master, and it''s what the'
