  md: '# Joe Asks...


    # Why Not Just “Scale Up” the Database?


    You absolutely “scale up” the database. The database server is a good candidate
    for scaling upward, because it is often a bottleneck and can benefit from ultra-fast
    disks and lots of memory. You can also put redundant disks in a RAID-1, RAID-5,
    or RAID-10 configuration that would offer a similar level of redundancy as a software
    cluster and would probably perform better. Do not underestimate the costs of such
    hardware, and remember the limitations and consequences of a scale-up approach.
    They still apply!


    Isolate the web server: The second option is to isolate the web server so it can
    concentrate on caching and serving static pages with lots of memory and a fast
    network connection. If your application is heavy on static content and wants a
    chance at surviving the Digg effect, you might want to choose a dedicated web
    server. The application and database are isolated on a second internal server.
    Conveniently, you still have the security advantage of keeping the database away
    from the web server. However, deploying the web server and application to a server
    loses the benefit of directly serving cached pages that Rails creates. Clustered
    or shared file systems, or another web server on the app server, may solve the
    problem. In any case, the isolated web server looks like this in a Capistrano
    configuration:


    ```

    # Relevant lines of deploy.rb

    #...

    role :app, "www1.brainspl.at"

    role :db, "internal.brainspl.at"

    role :db, "internal.brainspl.at", :primary =>

