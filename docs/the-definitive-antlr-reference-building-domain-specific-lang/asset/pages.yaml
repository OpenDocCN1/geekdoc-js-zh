  md: '# PROFILING AND BOTTLENECKS


    There are two profilers I''ll use. The first will test performance of the full
    request—from the controller, all the way through to the database. The second will
    drill a little deeper and focus strictly on the Active Record-based models.


    # ruby-prof


    The Fast Ruby Profiler (ruby-prof) gem lets you profile Ruby in a fairly detailed
    way. It comes with a convenient Rails Plug-in that will let you profile your application
    including the full stack of your application code. To get started, simply install
    the gem with `gem install ruby-prof`. Now navigate to the ruby-prof gem directory
    located under your Ruby installation''s /lib directory.


    Mine was located in `<home>/lib/ruby/gems/1.8/gems/ruby-prof-0.5.2/rails_plugin`.
    In that, you''ll find a subdirectory called ruby-prof. Copy that subordi to `<your_rails_app>/vendor/plugins/.
    Make sure not to move it, you will need a copy of it for any other Rails apps
    you want to profile. Finally, there''s only one configuration change you need
    to make to your application.


    In each of your environment configurations in `/config/environments`, including
    development.rb, test.rb, and production.rb, you''ll see a line that reads something
    like `config.cache_classes = [true|false]`. In the test and production configurations,
    it is set to false. This parameter needs to be set to true so that your profiling
    metrics aren''t skewed by the unnecessary reloading of classes. Rather than using
    profiling for modifying or development, you should create a new environment specifically
    for profiling.


    Simply copy the `development.rb` file to `profiling.rb`, and set the line `config.cache_classes
    = true`. Don''t forget to add a configuration to `config/database.yml`. You will
    use the production database instead of creating a new one. Feel free to create
    one one if you want a fully independent environment for profiling. You can also
    tinker with other settings in the file as you profile. I tend to disable caching
    when profiling because I am more interested in how I can improve my code when
    it isn''t run at all. If you want, you can easily create two environments for
    profiling, one with caching and one without.'
