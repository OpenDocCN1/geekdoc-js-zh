  md: '# CACHING


    page caching to work. You must also beware of URL encoding.

    Special encoded characters in your URLs can defeat page caching.


    +   - **Security:** If your content varies for each logged-in user, you will not
    want to use page caching. Even if you have special filters before enforce security,
    Rails will happily show private content to all users because the router never
    invokes your controller for page caching.


    +   - **Multiple paths:** If you have multiple routes for a given page, you will
    find page caching more difficult. You will need to make sure you clear the cache
    for every route that presents one piece of custom content.


    A comprehensive page caching treatment of page caching is well beyond the scope
    of this book, but you should have enough to get started. It''s time to move on
    to action caching.


    # Action Caching


    Action caching works like page caching. You enable this kind of caching with a
    filter, just as you do with page caching. Action caching has two major differences
    from page caching:


    +   - **Controller execution:** When you use action caching, Rails will invoke
    the controller for each action, even if the action is in the cache.


    +   - **Back end:** Page caching always uses the file system as the file store,
    but action caching uses a configurable back end.


    Syntactically, action caching looks almost identical to page caching. Action caching
    index the index and shows actions on the catalog controller, you''d use the following
    code:


    ```

    class CatalogController

    caches_action :index

    ```


    ```

    def index

    # do something complicated

    end

    ```


    The previous caching code will use the back end that you specify in your configuration,
    which is the file system by default. To expire them, you can use Rails directives
    like this:


    ```

    expire_action(:controller => ''catalog'', :action => ''index'')

    ```'
