    # Do a Push Deploy Instead of Pull with a Custom Deployment Strategy


    Capistrano is a great system by default. But some people rather push a tarball
    of their application code base to the servers rather than let the servers pull
    the application from Subversion. Luckily, Capistrano 2.0 has different deployment
    strategy, and it''s easy to change the deploy work via push instead of:


    ```

    set :deploy_via, :copy

