  md: 'modern processor. 512MB to 1024MB RAM minimum, and a spacious hard drive. A
    system like this will let your application service a lot of traffic and concurrent
    users. I''m not going to bore you with statistics here there are too many variable
    factors to weigh, but once you''re on a dedicated box, if your application keeps
