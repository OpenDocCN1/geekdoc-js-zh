  md: "column of schema_info to 44 with this command: ruby script/runner 'Active Record:Base.connection.execute“update\
    \ schema_info set version=44”'\n\nYou may also have a situation where Rails is\
    \ breaking because the version of your migration needs inconsistent with an earlier\
    \ migration. (If you put your models in your migrations, this problem\n't occur.)\
    \ You can solve the problem by deploying an earlier version\by running your migrations\
    \ (on the server) to a specific version like\nthis: rake db:migrate VERSION=42.\n\
    \nThen, you can simply run cap deploy:migrations to deploy your current\ncode\
    \ base with the rest of your migrations.\n\n# Only the Contents of log and public/system\
    \ Will Be Kept Between Deployments\n\nEach time you deploy, Capistrano makes a\
    \ time-stamped release directory. If you have user-generated files that end up\
    \ in public, they will\ndisappear the next time you deploy. This is because Capistrano\n\
    made a new release directory and symlinked to it. My favorite way to\nfix this\
    \ is to make an after `deploy:update_code()` hook to symlink\nyour folds into\
    \ public from the Capistrano shared directory.\n\nAssume you have a public/avatars\
    \ directory where you store uploaded\navatars. You want this directory to persist\
