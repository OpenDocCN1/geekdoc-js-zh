  md: '# 2.5 Active Record Migrations


    Migrations, a Rails feature that lets you express your database tables in Ruby
    instead of SQL, are a great way to manage your database schema throughout your
    development process. You can quickly create, change, or delete tables and indexes.
    If you''re already using migrations, I''ll show you how to whip them into shape
    for your production environment. If you''re deciding whether to use them, you
    should know the strengths and weaknesses of the approach.


    # Migration Strengths and Weaknesses


    On the plus side, migrations generally provide a more comfortable environment
    and the process of keeping your production schema up-to-date. More specifically:


    +   * Migrations let you express database-independent code in Ruby instead of
    SQL. Because you''re working in Ruby, you can often express your ideas in a cleaner,
    simpler way.

    * Migrations integrate with Rake (and Capistrano to a lesser extent). You can
    call Rake commands to move your migrations up to a precise level or move your
    schema back to a point in time. You can also Capistrano to run your migrations
    automatically when you deploy.

    * Migrations deal with data. Some database schema changes require changes in data.
    Migrations can handle both, since they are Ruby scripts. Setting the data for
    new columns, selectively adding or deleting rows, or defining lookup tables are
    all examples of dealing with data in migrations.

    * Migrations simplify backing up. Rails developers make just as many mistakes
    as others. If your latest build is a stinker that also changes the schema, migrations
    allow you to back up quickly.

    * Migrations make it easy to change schemas without losing data. Since migrations
    use the ALTER TABLE command rather than CREATE and DROP table, you can easily
    make changes to the schema without worrying losing production data. Also, you
    can use the same tools to manage your development and production schemes.


    Keep in mind that migrations are not a silver bullet. Some teams can make them
    work, and others can''t. In general, small teams with a simple deployment strategy
    will work great with migrations.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Large teams, teams that manage multiple releases, or teams that refactor code
    on a regular basis and simultaneously use migrations will struggle. These are
    some of the disadvantages of migrations:


    +   - Migrations do not integrate with Subversion. If an older migration depends
    on a particular model and that no longer exists, it will break. The source code
    history in Subversion has no effective link to the database schema that lives
    in your latest Subversion version.


    +   - Migrations have some curious defaults. By default, columns allow null. My
    experience shows that most developers don''t think about null columns until it''s
    too late, leading to database integrity problems later.


    +   - All developers depend on a unified numbering scheme but have no tools to
    manage them. If you create a migration and your friend creates one at the same
    time, they will both have the same number, and they will fail.


    +   - Branches are tough to manage. If you want to add a major branch, perhaps
    to develop a major feature without deploying it to the public until it is stable,
    you will effectively have to write your own support to do so, because each part
    of the application will need its own migrations.


    +   - Components have a tough time depending on migrations. Try to integrate an
    existing blog to an existing application, and you''ll see what I mean. Migrations
    don''t provide a good default to deal with this problem.


    For the most part, I like migrations. They are quick and convenient most of the
    time, and if you can make them work with your team''s model, you''ll be glad you
    did. If you''ve already committed to migrations, make sure you look at the disadvantages
    and understand them. You will want to solve the problems you''re likely to face
    before a migration blows up in production.


    # First Look at Migrations


    Regardless of whether you have a schema defined already or you are starting a
    new project, you can easily start using migrations. If you already have a schema
    in place, you''ll find Rails has some good tools that will help you convert them.'
