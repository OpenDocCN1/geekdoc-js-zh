  md: '# Joe Asks...


    What If I''m Using Rails Engines?


    Rails Engines copies some files to public on startup. Since you do not want to
    see those files on svn status, you should ignore them:


    ```

    $ svn propset svn:ignore "engine_files" public

    property ''svn:ignore'' set on ''public''

    ```


    *nix, you will have to name each file on the command line:


    ```

    $ svn propset svn:executable "*"

    `find script -type f | grep -v ''*.svn'' public/dispatch.*''

    property ''svn:executable'' set on ''script/performance/benchmarker''

    ```


    ```

    property ''svn:executable'' set on ''public/dispatch.cgi''

    ```


    On Windows systems, do this instead:


    ```

    C:\deploy> svn propset svn:executable script\performance\* ←

    script\process\about script\breakpointer ←

    script\console script\destroy generate script\plugin ←

    script\runner script server public\dispatch.*

    ```


    ```

    property ''svn:executable'' set on ''script/performance/benchmarker''

    ```


    ```

    property ''svn:executable'' set on ''public/dispatch.cgi''

    ```


    Since I will deploy on Unix/Linux machines, it makes sense to have the dispatchers
    use a proper line ending. To do so, use svn:eol-style to native Subversion manage
    the line ending according to local conventions:


    ```

    $ svn propset svn:eol-style native public/dispatch.*

    property ''svn:eol-style'' set on ''public/dispatch.cgi''

    ```


    ...


    Last but least, projects usually have a default home page served by a Rails action.
    This means building a route and removing public/index.html:


    ```

    $ svn revert public/index.html

    Reverted ''public/index.html''

    ```


    ```

    $ rm public/index.html

    ```'
