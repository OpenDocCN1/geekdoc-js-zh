    # Using Roles


    By default, Capistrano executes tasks in parallel on all the servers defined with
    the role command. You can limit the scope of the command by explicitly specifying
    the roles for that task. It is also important to note that Capistrano also runs
    tasks in parallel, but not concurrently. Imagine three tasks and three servers:


    ```

    role :web, [''one'', ''two'', ''three'']

