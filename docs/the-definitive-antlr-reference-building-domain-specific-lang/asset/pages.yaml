  md: "This will prompt you for a secret passphrase. If this is your primary identity\
    \ key, make sure to use a good passphrase. When this is done, you will get two\
    \ files called id_dsa and id_dsa.pub in ~/. directory. Note that it is possible\
    \ to just press the Enter key when prompted for a passphrase, which will make\
    \ a key with no passphrase. This is a Bad Idea™ for an identity key, so don't\
    \ do it! You will learn how to achieve passwordless logins in a secure manner\
    \ shortly.\n\nNow we need to place your public key on the server. Here is a nice\
    \ bash function that will do this for you: place this in ~/.bashrc or ~/.bash_profile\
    \ depending on the type of computer you are using locally. (The function assumes\
    \ you've already created the .ssh directory, so if you haven't done so, create\
    \ it first.)\n\n```\nfunction authme {\n  ssh $1 'cat >> ~/.ssh/authorized_keys\
    \ < ~/.ssh/id_dsa.pub'\n}\n```\n\nOnce that is in your shell file, you will need\
    \ to start a new shell or source the file:\n\n```\nlocal$ . ~/.bashrc\n```\n\n\
    With all in place, we can now use the authme command to place your new keys on\
