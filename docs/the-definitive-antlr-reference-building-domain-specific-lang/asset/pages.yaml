    # Under the Hood


    By now you should understand the basics of Capistrano. Before you start to customize
    it, I should provide a little more detail about how Capistrano executes tasks.
    Take a look under the hood.


    # Capistrano Runs Locally


    Some developers get a little confused with where and how Capistrano works. In
    principle, Capistrano is a client-side tool that issues remote commands via SSH.
    From that point, the commands run within the bash shell just as if you had logged
    in to the server and typed them manually. So, the remote server doesn''t need
    to know anything about Capistrano, and you don''t even need to install the Capistrano
    gem there, but you need the bash shell.


    # Code Synchronization Happens from Subversion


    Local changes to your copy of the source don''t affect the code on the remote
    server! Capistrano synchronizes the remote server from the remote repository,
    so you must commit any code changes that you want deployed.


    I just lied a little, but only a little. One piece of code does not come from
    Subversion: `deploy.rb`. All changes to `deploy.rb` will take effect during deployment
    whether those changes have been checked in or not. You already know why: that''s
    the script that runs Capistrano, including the code that exports the current version
    of your app. It''s still a good idea to keep your deploy script under source code
    control with the rest of your project.


    Now, you''ve seen the basic Capistrano deploy script in action, but only in the
    default configuration with few customizations. In the sections that follow, I''ll
    show you how to create your own Capistrano tasks and customize your existing tasks
    to handle more demanding scenarios. First, you''ll see some tasks, called recipes,
    that handle some common tasks.'
