  md: "When you are ready to merge a set of changes to the stable branch, check the\
    \ last commit message on the branch to know which revisions you need to merge:\n\
    \n```\n$ svn log --revision HEAD:1 --limit 1 \nfile:///home/ezra/deploy/branches/stable\n\
    -------------------------------------------------\nr422 | ezra | 2007-05-30 21:30:27-0500\
    \ (30 may 2007) | 1 line\n```\n\nMerged r406:421 from trunk/\n\nUsing the information\
    \ in the log message, you can now merge all the changes to the branch:\n\n```\n\
    $ svn merge --revision 422:436 \nfile:///home/ezra/deploy/trunk /\nA app/models/category.rb\n\
    M app/models/forum.rb\nA db/migrate/009_create_category.rb\n...\n```\n\nFinally,\
    \ commit and deploy:\n\n```\n$ svn commit --message \"Merged r422:436 from trunk/\"\
    \nA app/models/category.rb\n...\nTransmitting file data ...\nmitted revision 437.\n\
    ```\n\n```\n$ cap deploy_with_migrations\n...\n```\n\nYou now have a good Subversion\
