- img_proc: true
  md: '# Server Setup: Document Root and SSH


    To prepare your shared host for your application, you''re going to need a way
    to talk to it securely (SSH). You will also need a new user account on the shared
    server. Many shared hosts provide one SSH user per account, and your hosting company
    may have created one for you already. If not, each hosting company has a different
    web interface, and the process is usually simple. Just read the documentation
    here.


    After you''ve created an account, try it. If you''re running Windows, you''ll
    need to set up your SSH client. PuTTY is a good one. There are several free clients,
    and you''ll find plenty of documentation for them. If you''re running a Unix,
    you''ll have a much easier time. Usually, you won''t even need to install anything.
    Open a terminal, and type ssh username@hostname, using the information from your
    hosting provider. If you have any trouble, ask your hosting provider. Make sure
    you get your SSH connection working, because it''s your secure window into the
    system for your deployment, maintenance, and debugging.


    While you are logged in, you will want to change the site''s document root, also
    called the web root, to /current/public. Check the control panel for your site
    for the right place to configure your document root. The tool to change it will
    vary based on your provider. Shortly, you''ll upload your Rails application to
    the current directory. The public directory hosts static resources for your application.
    Capistrano, the Rails utility for deployment, will use the current directory to
    always hold the most recent version of your site.


    # 3.5 Server Setup: Create a Database


    The final task to do on the server is to create a database. Again, the means for
    this depends on your hosting provider. As you know, when you created your Rails
    application, you gave it a name, for example, rails. Rails will use three databases
    for each of the test, development, and production environments. The default name
    for each environment is the name of the Rails project, followed by an underscore,
    followed by the name of the environment. For example, for an application called
    ezra, Rails would generate ezra_development for the development database. In practice,
    many developers omit _production for their production database.'
  merge: -1
