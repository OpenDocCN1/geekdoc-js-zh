  md: "# Sweeping a Page Cache\n\nWhen you need to clear a cached page, you are actually\
    \ deleting the HTML file. You can delete pages with file commands or Rails directives.\
    \ For simplicity, most people start with the Rails directives. Sooner or later,\
    \ more complex applications will wind up moving to file-based commands.\n\nI'll\
    \ start simple. View your catalog gifts on the page. You want to expire the index\
    \ page whenever you create, delete, or update a gift. First, I'll create a method\
    \ to expire the page I need when your controller changes a gift.\n\n```\nclass\
    \ ApplicationController < ActionController::Base\n  expire_all_pages\n  expire_page(:controller\
    \ => 'catalog', :action => 'index')\\end\n```\n\nI'll keep this method in application.rb\
    \ so any controller that changes the model can call the method, but if gifts to\
    \ change are isolated to your controller, method could easily be a private method\
    \ on your controller. Next, I can create a simple filter after that action that\
    \ changes gifts:\n\n```\nclass GiftsController < ActionController::Base\n  after_filter\
    \ :expire_all_pages, :only => [:create, :update, :destroy])\n```\n\nKeep in mind\
    \ that the expire_all_gifts() method deletes only a single file on a single machine.\
    \ If you cluster, you'll have to do something to synchronize your cache across\
    \ all your nodes. Otherwise, users on different nodes could be seeing different\
    \ versions of your catalogs! To keep things synchronized, you might consider a\
    \ shared or clustered file system or building a simple web service that explicitly\
    \ connects to each node in your cluster and expires the page.\n\nThe second way\
    \ that you can expire a page is with a file-based command. Usually, you'll use\
    \ a class structure called a sweeper. Often, you'll find sweeping individual pages\
    \ with Rails is a messy process because you don't know exactly which pages are\
    \ cached. Many applications don't change very often, so it's a perfectly valid\
    \ approach to sweeping your entire page cache is to observe a model object and\
    \ delete a whole controller's cache when any instance changes. I'll use a slightly\
    \ different variation of the referenced algorithm\n\n+   4. http://www.frngtps.com/2006/01/lazy-sweeping-the-rails-page-cache"
