  md: '# StabilIZING YOUR APPLICATIONS


    Whenever you build a scaffold, you''ll want to add the generated files

    to Subversion. You can save time by adding them as they are created.

    Rails makes it easy when you use the script/generate command to

    create new files. Just add the --svn flag. Rails will generate the files and

    ent automatically them for you, like this:


    ```

    $ script/generate scaffold --svn Post

    exists app/controllers/

    exists app/helpers/

    create app/views/posts

    exists app/views/posts

    exists test/functional/

    dependency model

    exists app/models/

    exists test/unit/

    exists test/fixtures/

    create app/models/post.rb

    app/models/post.rb

    ...

    ```


    # Stabilizing Your Applications


    Rails is a fairly forgiving application framework in development mode,

    to one. When you push your application up to a production

    server, it becomes real production software, whether it''s ready or not.

    This section will walk you through a few things you can do to stabilize

    your application.


    # Locking Down Plugins-ins and Gems


    You probably install third-party gems once on your local machine and

    forget about them. You don''t need to do anything unless you want a

    l gem that fixes a bug or you features of a new gem.


    Shared hosts are a different story, because they upgrade gems

    without your knowledge, which could house your application at the most

    embarrassing moment conceivable. To prevent this unfortunate cir-

    cumstance from happening to you, copy each dependency to vendor.

    Unpack each gem to vendor like this:


    ```

    $ cd vendor

    $ gem unpack money

    Unpacked gem: ''money-1.5.9''

    $ ls

    money-1.5.9 plugins rails

    ```'
