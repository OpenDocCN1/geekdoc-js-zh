    A    README

    ```


    The Rails command helps creates most of the tree. Since I will

    later use migrations in all my Rails projects, I immediately create the

    d/migrate folder. Rails also creates a tmp folder when it needs it. For

    teness sake, I will create both folders immediately:


    ```

    $ svn mkdir db/migrate tmp

    A db/migrate tmp

    ```


    # Removing the Log Files from Version Control


    At this point, Subversion would help track all changes to the log

    files. Then some following Friday at 6:30 p.m., some poor, harried devel-\oper
    would unintentionally accidentally check in an obscenely large log file, and

    t rest of the developers would complain that the checkout was taking

    way too long. To ease your burden, the easiest thing is to tell Subversion

    to ignore any log files:


    ```

    $ svn revert log/*

    Reverted ''log/development.log''

    Reverted ''log/production.log''

    Reverted ''log/server.log''

    Reverted ''log/test.log''

    ```


    ```

    $ svn propset ignore:"*.log" log

    property ''svn:ignore'' set on ''log''

    ```


    That''s all there is to it. Next step: database.yml.


    # Managing the Database Configuration


    Since database.yml file might be different for each developer, you do not

    want to create havoc by accidentally committing database.yml. Instead,

    You''ll have a sample of the file in the repository so each developer

    have their own safely ignored database.yml file. These commands do the

    magic:


    ```

    $ svn revert config/database.yml

    Reverted ''config/database.yml''

    ```


    ```

    $ mv config/database.yml config/database.yml.sample

    $ svn add config/database.yml.sample

    A config/database.yml.sample

    ```'
