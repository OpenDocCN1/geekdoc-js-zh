  md: 'nently, scaling out lets the complexity scale with you. In the beginnig, designing
    to scale outward costs little, but your preparations will position you for bigger
    challenges to come. You can deal with new-performance demands later by doing a
    little prep work today. To get ready, you''ll prepare a few key elements of infrastructure.
    The trick is to keep your scaling right early so you can avoid surprises.


    Keep in mind that you''ll still have to get your performance right. Even if you
    plan to scale by throwing money and hardware at the problem, you''ll want to save
    enough time to address performance. I''ll tell you about performance in Chapter
    9. Performance, on page 224.


    From a deployment perspective, you''re looking at something like Figure 7.1, on
    the next page. You will have two or three different virtual hosts that may or
    not reside on the same servers. Each Mongrol cluster is a static city center.
    One will use Apache or nginx as a static proxy and load balancer. The other two
    will serve Rails applications through Mongrol. You''ll use Capistrano to deploy
    each of them. The next few sections will help you set up a simple architecture
    that can grow from a single dedicated server to five servers with minimal changes
    to your application. In the sections that follow, I''ll walk you through the following:


    +   - Adding multiple virtual machines to your environment

    - Setting up subdomains for your cluster using CNAMEs with your DNS provider

    - Ensuring your Mongrol servers are deployed as clusters and as services

    - Setting up a load-balancing proxy web server with Apache or nginx

    - Configuring multipaster master/slave MySQL clusters


    I''ll start with the simplest Rails deployment and grow the server into a scaled-out
    model to handle your angry mob of Web 2.0 users. When I''m done, you''ll have
    a server that serves as a static proxy and a load balancer that serves content
    to one or more Mongrol clusters. This system will serve a typical request as shown
    in Figure 7.2, on page 148. The user makes a request to a gateway server. If it''s
    a static request, the gateway server simply serves the static content, and you''re
    done. If not, the gateway server will forward the request to one of several Mongrol
    clusters. The Mongrol clusters forward the request to an individual Mongrol server.'
