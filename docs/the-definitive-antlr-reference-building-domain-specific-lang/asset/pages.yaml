  md: '# Like Rake, Not Exactly


    Earlier I told you that Capistrano was almost exactly like Rake. I''m sure you
    noticed the *almost*. I''ll point those differences out now.


    # Tasks Are Methods


    Unlike Rake, other tasks can call Capistrano tasks directly, just as if they were
    methods. Rake tasks can call other Rake tasks only as tasks, but not as methods.
    Capistrano uses this feature internally, and you can use it in your tasks, too.
    For example, here is a simple task:


    ```

    desc "Play a war game"

    task :play_global_thermonuclear_war do

    ...

    end

    ```


    play_global_thermonuclear_war is a Capistrano task, but you can call it from another
    task like a normal method:


    ```

    desc "Play several games"

    task :play_games do

    play_global_thermonuclear_war

    play_llor_dot_nu

    end

    ```


    This strategy lets you run a task alone or together with other tasks. For example,
    you could call `:rotate_logs` from a task called `:weekly` or alone.


    # You Can''t List Other Tasks as Dependencies of a Capistrano Task


    With Rake, you can pass the name of a task as a hash where the key is the task
    name and the values are the other tasks that must be run before the current task.
    Capistrano doesn''t use this syntax. Instead, you must call tasks as methods or
    write *before* and *after* callbacks, as mentioned previously.


    # You Can Override Capistrano Tasks


    Rake lets you define tasks in stages, so it is not possible to override an existing
    Rake task. Capistrano gives you the ability to override tasks. If you don''t like
    the behavior of a built-in task, you can redefine it. For example, if you are
    deploying to a shared host, you might need to send a special argument to the `reaper`
    script in order to restart FastCGI processes.'
