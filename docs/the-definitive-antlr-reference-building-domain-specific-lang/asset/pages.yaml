    # Configuring the Asynchronous Multimaster MySQL Cluster


    The configuration doesn''t look much harder, but it can definitely be frustrating
    initially. If so you''re going to try this, definitely bring a bag of patience.
    Since you''re already familiar with the my.cnf file, I''ll spare you time and
    tackle both master configurations in one. The following configuration files have
    comments identifying each server:


    ```

    # /etc/my.cnf

    # Lines added below the [mysqld] section

    server-id=1

    log-bin=mysql-bin

    log-slave-updates

    replicate-same-server-id=0

    auto_increment_increment=10

    auto_increment_offset=1

    ```


    ```

    # /etc/my.cnf on SECOND MASTER

    # Lines added below the [mysqld] section

    server-id=2

    log-bin=mysql-bin

    log-slave-updates

    replicate-same-server-id=0

    auto_increment_increment=10

    auto_increment_offset=2

    ```


    The differences noticed for the master/slave configuration discussed before. Of
    course, you will still need the server-id to identify each server. The first difference,
    though, is that both servers now use log-bin to enable logging. Each server will
    produce its own binary log and read the binary log from the other server. The
    log files allow each server to pick up the writes from the other server. It''s
    the same concept as master/slave, but done twice. You''re using the same server
    prefix for the binary log files, but you can use whatever you like. The server
    name works perfectly.


    The log-slave-updates option ensures that if you chain more than one slave in
    a circular arrangement, MySQL will forward along all updates received from other
    servers. Since you don''t want to send the same update around in an infinite loop,
    the next option, replicate-same-server-id, tells a server to ignore its own updates.


    Finally, the last two lines of each file help MySQL deal with asynchronous autoincrement
    key generation. The first, auto_increment_increment,'
  merge: -1
