    namespace(:deploy) do\n  task :link_images do\n    run <<CMD\n      cd #{release_path}\n\
    \      ln -nfs #{shared_path}/avatars #{release_path}/public/avatars\n    CMD\n\
    \  end\nend\n```\n\n# User Permissions\n\nThe user performing the SSH deployment\
    \ will own all your files. You\nneed to remember that the web server user must\
    \ be able to read and\nwrite all of the appropriate files. Most Rails use a single\
    \ deployment ID to deploy. If you must change permissions as part of a Capistrano\
    \ script, use an after task to change permissions if necessary."
