    ```


    The script/server command will start Mongrel instead of WEBrick. If the

    server starts OK, point your browser at http://tracklayer:3000. Remember

    to replace tracklayer with the IP or domain of your server.


    You should see the "Congratulations, you''ve put Ruby on Rails! page,

    so we are done with the basics for our Rails server stack! You''re

