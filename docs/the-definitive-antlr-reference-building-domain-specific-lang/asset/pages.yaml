    # 6.4 Keeping FastCGI Under Control


    Our primary focus has been on Mongrel. I''m going to dedicate the rest of the
    chapter to FastCGI. If you find yourself deploying with FastCGI, you''ll want
    to read the next few sections. Otherwise, feel free to skip ahead to Section 6.5,
    Building in Error Notification, on page 138.


    # Zombie FastCGI Processes


    During the dog days of summer in 2005, I noticed that one of my Rails apps was
    running a little slower than expected. Confident in my debugging abilities, I
    fired up my SSH client and logged into my shared server. Almost immediately, the
    server kicked me out with an odd "resource unavailable" error.


    After three tries with the same result, I emailed the customer support team. It
    turns out that I had fifty processes running, the maximum allowed for any single
    user! One of those processes was a zombie, occupying my process allocation but
    unable to do anything useful. Like a horror sequel, one of my Rails apps on a
    completely different host had the same problem a few days later.


    The Apache server is famous for producing these zombies when running with FastCGI,
    causing many developers to favor Mongrels or nginx instead. The good news is that
    a simple cron task can keep zombies from getting out of hand, making the difference
    between a smoothly running site and one that dies daily. I''ll discuss them in
    The Reaper below.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'The conclusion to the story is that the sysadmin at the shared host killed
    the zombie processes, and things began working again. I learned to start a daily
    cron task that cleans out zombies and gives me a fresh start. Some people restart
    their dispatch processes every single hour. You will have to experiment with your
    specific situation and see what works best.


    # The Reaper


    The reaper is not a black-hooded messenger of doom; he is your best friend. The
    reaper reliably prunes FastCGI processes. Capitano uses it to restart your Rails
    app after a fresh deployment. You can also use it to restart processes on a regular
    schedule.


    The reaper is a script you run on the command line. By default it restarts FastCGI
    dispatch processes for your application only, so you won''t disrupt other applications
    running under the same user account. You can fire off other actions with the reaper
    as:


    +   - restart: Restarts the application by reloading application and framework
    code (the default). Send the US2 signal to each dispatch-patch.cgi process belonging
    to the current application.

    - reload: Reloads only the application, not the framework (like the development
    environment). Reload sends the HUP signal.

    - graceful: Marks all the processes for exit after the next request. Graceful
    sends the TERM signal.

    - kill: Forcefully exits all processes regardless of whether they''re currently
    requesting a request. kill sends the -9 signal. Use this only if none of the other
    signals is successful.


    You can run the reaper without any arguments or request of the previous actions
    as the following:


    ```

    $ezra$ ./script/process/reaper --action-graceful

    ```


    In my experience, the defaults don''t work on most shared hosts because their
    output doesn''t match the reaper''s expectations. The good news is that you can
    send an extra argument to match the specific output of your host.


    Let me show how I fine-tuned this on one of my shared hosting accounts. First,
    I tried to run the dispatcher normally. Even though I knew there were several
    dispatch.fcgi processes running at that very moment, the reaper couldn''t find
    them.'
