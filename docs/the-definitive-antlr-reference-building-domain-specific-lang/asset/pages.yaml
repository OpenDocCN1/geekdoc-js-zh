  md: "# Joe Asks...\n\n# What About the Deployed database.yml File?\n\nUsing the\
    \ template file means the database.yml file is not under version control on your\
    \ production server. Here are some solutions to this problem:\n\n+   - Use a branch\
    \ to deploy, and keep database.yml under version control in the branch. See Section\
    \ 2.2, Using a Stable Branch for Deployment, on page 28 for how to do that.\n\n\
    +   - Have Capistrano copy the file forward on every deployment. I discuss this\
    \ solution in Section 5.5, Using the Built-in Callbacks, on page 112, and I discuss\
    \ Capistrano in Chapter 5, Capistrano, on page 92.\n\n+   - You can leave the\
    \ database.yml file on the server in the shared directory. You can then create\
    \ a symlink to that file. It's best to create this symlink in an after_update_code\
    \ Capistrano task. We'll talk more about Capistrano later, but for now, we have\
    \ a quick look at the following Capistrano task just to satisfy your curiosity:\n\
    \n```\ntask :after_update_code, :roles => :app,\n  :except => {:no_symlink} =>\
    \ true} do\n    cd #{release_path} &&\n    ln -nfs #{shared_path}/config/database.yml\
    \ leftarrow\n    #{release_path}/config/database.yml &&\n    ln -nfs #{shared_path}/config/mongrel_cluster.yml\
    \ leftarrow\n    #{release_path}/config/mongrel_cluster.yml\nend\n```"
