    control. If you use this approach, you''ll need to be sure you communicate.


    Since you''ve made any changes to database.yml.sample, other developers might
    not notice them. Most of though, the sample file will not change, and leaving
    it “as is” is OK. Alternatively, you can call the sample file database.sample.yml
    so your editor can pick up syntax highlighting.


    # Database Structure Dumps During Testing


    When you run the tests, Rails will dump the development database’s structure to
    db/schema.rb.³3


    # Managing tmp, documentation, scripts, and public


    Rails 1.1 and above now have a tmp folder. This folder will hold only temporary
    files such socket, session, and cache files. Ignore anything in it:


    ```

    $ svn propset svn:ignore "*" tmp

    property ''svn:ignore'' set on ''tmp''

    ```


    The doc folder holds many subfolders: appdoc and apdoc among others. To keep things
    simple, just ignore any “doc” suffix:


    ```

    $ svn propset svn:ignore "doc*"

    property ''svn:ignore'' set on ''doc''

    ```


    Subversion also has a property to identify executable files. Set the property
    on all files you might run from the command line.


    +   3. If the Active Record configuration variable named config_active_record_schema_format
    is set to sqli, the file will be named development_structure.sql instead. Simply
    replace schema.rb with development_structure.sql in the commands.'
