  md: '# APPLICATION ISSUES FOR DEPLOYMENT


    That code would work just fine as long as the user cooperated with you and picked
    “first_name” or “email” from a selection box. If a Rails developer wanted to exploit
    your system, he could send data to your counselor by opening a curl session and
    posting his own data. Or, if you don''t verify that the command is a post, he
    could simply key the following into a URL:


    ```

    your_url.com/update/4?attribute=destroy_all

    ```


    Assume all user input is tainted. Not all metaprogramming is good. Don''t evaluate
    any data that comes from a user unless you''ve scrubbed it first.


    # Don''t Evaluate SQL


    You can make a similar mistake with SQL. Say you want to look up a user with a
    user ID and a password. You could issue the following Active Record command:


    ```

    # Don''t do this!

    condition = "users.password = #{params[:password]} and  users.login = #{params[:login]}"

    @user = find(:conditions => condition)

    ```


    And all is well. At least, it is well until someone types the following of a password:


    ```

    up yours''; drop database deploy_production;

    ```


    The first semicolon ends the SQL statement. Then, the cracker launches some mischief
    of his own, dropping the database. An alternative would be to create a user with
    enhanced permissions. This type of attack, called *SQL injection*, is growing
    in prominence. You can prevent the attack by coding your condition line like this:


    ```

    conditions = ["users.login = ? and users.password = ?", params[:login], params[:password]]

    @user = find(:conditions => conditions)

    ```


    This form of a finder with conditions allows Rails to do the right thing: properly
    escape all parameters and input that Active Record will pass through to the database.'
