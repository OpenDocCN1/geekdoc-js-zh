    To stop memcached, kill memcached. Otherwise, flushing cached can be done only
    via the API, which you can find more information at http://www.danga.com/memcached/.
    You might want to stop and start your memcached server with your Capistrano deploy
    scripts. Similarly, you may want to create a couple of custom Rake tasks to flush
    the cache when you need to in development and production.


    # 9.6 Conclusion


    Are good Rails projects and bad ones. Good projects benefit from good planning
    and discipline. Getting good performance out of Rails definitely takes discipline.
    In this chapter, I laid out a disciplined approach to get you the strongest performance
    quickly.


    The first step in the process was to establish a baseline. I used Apache bench
    or hitprof to measure the smallest application that I could create with Rails.
    This best-case scenario told me the high-end expectation for my Rails application
    given the hardware and resources. I used the same technique to run an application
    baseline to show me the application performance, without optimizations.


    If I detected a performance problem, I decide to start making arbitrary changes
    to improve performance, but I would probably guess wrong. I profile to find exactly
    which pieces of my code are breaking. Various Rails tools include the ruby-prof
    gem and the basic profiling.rb script. Using these commands with various options,
    I could find bottlenecks.


    After locating a bottleneck, I could solve the bottleneck using several techniques
    in the chapter. Caching helped me sidestep a few lines of Ruby code or bypass
    Rails entirely, trading flexibility and power for speed. I also showed how to
    improve Active Record performance.'
