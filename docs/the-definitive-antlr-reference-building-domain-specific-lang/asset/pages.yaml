  md: 'Forwarding a requested URL to a back-end server is really easy. To forward
    requests to /mytest to a Mongrel instance on the same machine running on port
    4001, you use this rule:


    ```

    RewriteProxy /mytest(.*) http://localhost:4001$ [I,U]

    ```


    If you''re using Apache on port 8080, you just forward requests to that port instead:


    ```

    RewriteProxy /mytest(.*) http://localhost:8080$ [I,U]

    ```


    You can even go to a different server:


    ```

    RewriteProxy /mytest(.*) http://backend.mydomain.com:4001$ [I,U]

    ```


    On some systems, especially those that have tightened security, this file is marked
    as read-only. You''ll need to remove the read-only attribute before you change
    the file. Also, ensure that the SYSTEM user can read that file.


    # Testing II


    Configure the filter to forward requests to your Mongrel instance on port 4001:


    ```

    RewriteProxy /mytest(.*) http://localhost:4001$ [I,U]

    ```


    You can pull up your Rails application via IIS by navigating to http://localhost/mytest/.
    Unfortunately, it''s not going to look very good. Read on find out why.


    # 8.6 Reverse Proxy and URLs


    The big problem we''re faced with is that the URLs that Rails creates internally,
    as style sheet links, and other links, don''t work as you expect.


    For example, if you pull the URL http://localhost/mytest/ in your browser, you
    should see that the application comes up just fine, but with the style sheets.
    You will also notice that when you click a link, you''re transferred to http://localhost/,
    and in some cases your proxy will be exposed. This situation could be especially
    bad for users if your application server happens to be behind a firewall that
    can''t be accessed from the Internet.


    Neither IIS nor ISAPI_Rewrite has a method to handle reverse proxy. A reverse
    proxy rewrites the content served from the back end to mask the fact that the
    request was filtered through a proxy.'
