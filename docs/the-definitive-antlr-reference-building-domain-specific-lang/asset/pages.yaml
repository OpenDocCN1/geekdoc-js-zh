    By testing in a methodical fashion, you can begin to get an overall view of the
    performance you can expect from your app. Without a good best-baseline, it would
    be hard to know when to keep optimizing code and when to add more hardware. Rails
    applications tend to vary widely in the way they are coded and the way they utilize
    resources, so any generalizations about the performance of an app are very hard
    to make. Being scientific about your process and measuring heavily after change
    to any part of the equation will let you know what has helped and what has hurt
    your performance.


