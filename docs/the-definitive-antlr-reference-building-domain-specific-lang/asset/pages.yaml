- img_proc: true
  md: '# 10.3 JRuby


    JRuby is a Ruby implementation written entirely in Java. The implementation has
    many advantages associated with the Java virtual machine. While Ruby applications
    run a separate native process instance, the JRuby implementation can use a separate
    native thread per instance. This implementation should eventually let a Rails
    application run with a fraction of the resources of a typical application running
    with a pack of Mongrels. Currently, though, most JRuby deployments still use a
    pack of Mongrels_cluster and consume more resources than a typical Mongrel deployment
    on MRI.


    If you have significant investment in Java applications, you can access those
    Java classes directly from JRuby applications. Testing, scripting, Rails development,
    and user interface development are only a few places that developers are actively
    using JRuby today.


    The key inroads of the JRuby platform in my opinion is political. The two core
    developers, Charles O. Nutter and Thomas Enebo, are now working for Sun Microsystems.
    This move has completely changed the JRuby project. Since Sun is committed to
    moving the technology forward, the team has better access to resources that will
    advance the platform. Most important, these two key developers have much more
    time to build and evangelize JRuby since they can work on it full-time.


    # 10.4 IronRuby


    IronRuby is a Ruby implementation on Microsoft''s .NET platform. IronRuby, based
    on Ruby version 1.8.x, boasts seamless integration with .NET infrastructure and
    libraries. To date, most of the implementation is written in C#. The shared source
    project has been around since April 2007. The project is released under the BSD-like
    Microsoft permissive license.


    Unlike the Java virtual machine, .NET has some target features, called the Dynamic
    Language Runtime (DLR), that target dynamically typed languages like Ruby. This
    foundation provides a core set of services that permit fast and safe dynamic language
    code.


    IronRuby has not been around as long as JRuby, but the parallels should be obvious.
    The managed .NET environment has important advantages for any team considering
    deploying a .NET application.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# 10.5 Wrapping Up


    I hope you''ve enjoyed this pass through the Rails deployment scene. With the
    information in this book, you should be able to handle simple deployments on shared
    hosts, as well as complex deployments spanning several application and web servers.
    With the examples in the Capistrano chapter, you should have a good understanding
    of how to build custom deployment scripts. You can also take a reasonable shot
    at tuning your deployment for performance and managing the result.


    I do urge you to listen closely to the state of the art. You''ve seen in this
    chapter that the Ruby deployment picture will move quickly. I''ve presented a
    few important frontiers in deployment. Others will emerge too. With any luck,
    the emergence of the new alternatives will be as exciting as the emergence of
    the current frontier—the Mongrel, Monit, and Capistrano foundations—that form
    the heart of the Rails deployment today.'
  merge: -1
