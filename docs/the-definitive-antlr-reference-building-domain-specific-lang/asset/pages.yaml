- img_proc: true
  md: '# Performance on Windows


    Ruby does not perform as well as Windows as it does on Linux. Applications that
    routinely handle 60 requests per second on a Linux box with one instance of Mongrel
    can handle only six to nine requests per second on Windows. More than that, and
    your users start seeing delays as each request is processed.


    If you have a really powerful server, like the fastest thing available with lots
    of RAM and very little running, then you might see around thirty-five requests
    per second with a single instance. Linux servers tend to provide much greater
    throughput with much less expensive hardware.


    You can improve performance slightly by looking over the applications you plan
    to deploy and checking the following areas:


    +   Change how you use sessions. How sessions are managed in your application?
    The P-Store, or file-based store, can often be slow. Consider moving your session
    into your database, or investigate session-storing mechanisms.


    +   Go through your development logs, and make sure you''re not making unnecessary
    calls to your database. Simply adding include to a finder can really help an application''s
    performance, and it is often missed.


    +   Use fragment, action, and page caching as much as you can. Since Ruby is slow
    on Windows, you want to make as much use of page caching as much as possibly so
    that Rails is never invoked.


    +   Ensure that nothing is interfering with the process. Certain security auditing
    software, quota managers, and virus scanners can drastically reduce the amount
    of requests you can handle. Watch your performance monitor for any spikes when
    testing your application.


    # 8.8 Load-Testing Your Applications


    There are few good choices for load-testing your applications on Windows. If at
    all possible, get a Linux machine or a Mac, and use http to test your application.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# FINAL THOUGHTS


    If that''s just not going to work for you, try one of these alternatives:


    +   * Microsoft Web Application Stress Tool: This tool, available online.¹⁴ is
    a free tool that records your steps through a web application and then play them
    back and generate loads. It can be used to control remote clients so you can generate
    more realistic loads against your application. It has quite a few bugs, but it
    is still a very useful program. I have found its accuracy to be relatively good.

    * WAPT: WAPT is a commercial tool that performs load and stress testing of web
    applications. Like the Microsoft offering, WAPT allows you to record your browsing
    session so it can be played back. Interpreting the reports can be trickier, but
    it''s worth it because WAPT has the ability to connect to secure sites. Apache
    Benchmark (ab): Apache Benchmark is a command-line tool that can be used to hit
    a URL repeatedly, and it is known to produce extremely misleading results. I use
    this tool only to generate loads against an application.


    # 8.9 Final Thoughts


    I believe that Windows is a good platform for developing Rails applications and
    does an adequate job of serving Rails applications that have a more user base.
    However, as you begin to develop more applications and gain more users, your needs
    may change.


    I also believe Linux is the better choice right now. I have a 1GHz desktop machine
    running Ubuntu and serving a single Rails application from one instance of Mongrel
    serves three times as many requests per second than a server with two Xeons at
    2GHz.


    In recent months, Windows machines are getting much faster, but they are not quite
    as performant. If your applications aren''t performing at an acceptable level
    and you''ve done everything you can optimize, then you should consider deploying
    some applications to a Linux server. The information and strategies I have shared
    with you can be used to help you migrate some or all of your Rails applications
    to Linux servers transparently. You could still use IIS or Apache on Windows and
    only move the Rails applications to Linux, which is a great transition solution
    that I''ve employed number of times with great success.


    ¹⁴. http://www.microsoft.com/downloads/details.aspx?fileID=E2C0585A-062A-467D-75A89AA36495'
  merge: -1
