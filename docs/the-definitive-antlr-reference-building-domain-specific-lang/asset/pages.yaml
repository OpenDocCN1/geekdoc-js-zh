    # Keep Offline Master Copies


    A master copy is an offline configuration that has never been deployed or exposed
    to the public Internet. You will use it the first time for your cold copy. After
    you build your initial VM, you can use that as an online master copy. Whenever
    you need to make configuration changes, you can change this master copy. Most
    important, this is the copy you can safely deploy should servers become promised
