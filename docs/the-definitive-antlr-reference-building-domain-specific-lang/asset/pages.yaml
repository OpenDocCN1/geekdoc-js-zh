    You''ve seen how to configure a single Mongrel instance. Your next step is to
    build a more flexible configuration for a cluster. First, you need to generate
    your `mongrel_cluster.yml` file. Let''s configure a cluster of three Mongrels
    by running the following command from the root of the Rails application directory:


    ```

    ezra$ mongrel_rails cluster::configure -p 8000 ~

    - production -a 127.0.0.1 -N 3

    Writing configuration file to config/mongrel_cluster.yml.

    ezra$ cat config/mongrel_cluster.yml

    ```


    ```

    port: "8000"

    environment: production

    address: 127.0.0.1

    pid_file: log/mongrel.pid

    servers: 3

    ```


    You just built a minimal, but working, `mongrel_cluster.yml` file to run a cluster.
    The `port` option is a little different from the `port` option used when you configured
    a single Mongrel instance. For a cluster, `port` specifies the port number for
    your first Mongrel. Each subsequent Mongrel starts on the next port. These will
    start on ports 8000, 8001, and 8002. Normally, you''ll run a single Mongrel in
    development mode for your Rails application and for a cluster. Mongrel will listen
    on the hostname or IP address specified by the `address` option. The `pid_file`
    option specifies the location of Mongrel''s PID files, and `servers` specifies
    the number of Mongrels you want in the cluster. The previous file config three'
