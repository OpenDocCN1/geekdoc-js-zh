  md: 'These are huge performance advantages for high-traffic sites. Not only is Apache
    faster at serving static content, but it keeps unnecessary load off the Mongrels
    they can efficiently handle only Rails requests.


    You can now start Apache and the Mongrel cluster on your balancer members. Better
    yet, have Capistrano do it! After all, that''s what it is for. Also, you have
    only one database so far, and therefore you have to configure it to accept connections
    from remote servers. This database configuration is usually a simple matter of
    granting permissions to remote users (for example, `deploy@10.0.0.102`) on your
    database. I''ll cover more advanced MySQL topics later in this chapter.


    Congratulations! You have now configured a highly flexible and highperformance
    clustered server architecture. If you look back and consider some of your options,
    you can scale out to six servers easily: the software load balancer, two web proxy
    servers, and a database server. You can play around with your local virtual machines
    to try adding another server or to try separating the web and app roles onto other
    hosts. Otherwise, if you''ve found all this to be a little overwhelming, with
    too much unneeded flexibility and indirection, or if your server is strictly limited
    to low resources, you might need an alternative to Apache. In that case, there''s


    # 7.7 nginx, from Russia with Love


    nginx (pronounced "engine-x") is a fast, lightweight web server written by Igor
    Sysoev. It is extremely well suited as a front-end server for Mongrel clusters.
    Out of the box, find that nginx serves static files faster under heavier load
    than Apache, often using a fraction of the resources under similar work loads.
    While Apache clearly focuses on modularity and flexibility, nginx focuses on simplicity
    and performance. That''s not to say nginx isn''t feature rich, because it has
    nice built-in reverse and proxy modules and a clean configuration file syntax
    that makes it a pleasure to use.


    The proxy module has similar capabilities to `mod_proxy_balancer` in Apache, so
    it works great for front clusters of Mongrels. Conditional if statements and regular
    expressions matching allow precise control over which requests get served as static
    content and which dynamic requests nginx will proxy to a Mongrel back end.


    nginx is surprisingly full-featured considering how fast and efficient it is.
    It has support for SSL, HTTP AUTH, FastCGI, gzip compression, FLV'
