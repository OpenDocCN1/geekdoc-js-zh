    \ important bits to note are the file and the position. You'll need those to configure\
    \ the slave.\n\n```\nmysql> # ON MASTER;\nmysql> SHOW MASTER STATUS;G;\n****************************************\n\
    File: mysql-bin.000001\nPosition: 98\nBinlog_Do_DB:\nBinlog_ignore_DB:\n1 row\
    \ in set (0.00 sec)\n```\n\nNow log into the slave and set the master using CHANGE\
    \ MASTER TO. I usually use the same user as your Rails app, because it would normally\
