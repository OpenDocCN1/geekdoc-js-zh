  md: "# Capistano and Stable Branch Deployment\n\nWe'll be dealing with Capistrano\
    \ in detail later in the book. But for now, know that Capistrano can indeed deploy\
    \ from the trunk or any branch. For example, this is what the repository line\
    \ of deploy.rb would look like with a stable branch deployment:\n\n```\nset :repository,\n\
    \  \"http://yoursvnserver.com/deploy/branches/stable\"\n```\n\n# Saving Your Work\n\
    \nAfter all these changes, commit your work to the repository:\n\n```\n$ svn commit\
    \ --message=\"Initial project checkin\"\nAdding README\nAdding vendor/plugins\n\
    Transmitting file data...................\nCommitted revision 2.\n```\n\n# Using\
    \ a Stable Branch for Deployment\n\nMany simple applications run off the trunk.\
    \ Others will feel more comfortable deploying from a stable branch. Several great\
    \ books address this topic better than I possibly could, but I want to get a feel\
    \ for what it involves. Detailed information on this topic, you should read Pragmatic\
    \ Version Control [Mao05].\n\nThe changes you do on trunk might be fully tested,\
    \ or you could be in the middle of a major refactoring when an urgent bug report\
    \ comes in. You need the ability to deploy a fixed version of the application\
    \ without having deploy the full set of changes since the last deployment. In\
    \ Subversion, you can copy a branch of development to another name, and you can\
    \ set up Capistrano to deploy from your stable branch instead of your development\
    \ branch. Developers call this technique stable branch deployment.\n\nLet's create\
    \ the stable branch, which will be a copy of trunk:\n\n```\n$ svn copy --message=\"\
    Create the stable branch\" →\nfile:///home/ezra/deployit/trunk ←\nfile:///home/ezra/deployit/branches/stable\n\
    Committed revision 234.\n```"
