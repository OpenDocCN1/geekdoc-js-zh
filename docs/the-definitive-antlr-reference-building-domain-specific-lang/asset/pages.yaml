  md: 'You can also use a regular-expression style of expiration, like this: expire_action(%r{catalog/gifts/.*})


    Of course, most complicated applications use sweepers. The syntax of sweeper remains
    the same regardless of the type of caching you use. Though the programming interface
    is similar, the strengths and weaknesses are much different. On the plus side,
    the action caching model allows greater flexibility. Since Rails Router invokes
    the controller for each hit, you have full access to before and after filters
    you can enable features like security. Also, the back end is configurable, you
    can use caching strategies that are friendlier to clustering. I''ll tell more
    about the available caching back ends in Section 9.5, *Caching Back Ends*, on
    the next page.


    You know by now there''s no such thing as a free lunch. The added flexibility
    of filters and a configurable back end comes at a price: performance. Page caching
    has a huge benefit. Each page service bypasses the Rails infrastructure and all
    of its overhead.


    # Fragment Caching


    Fragment caching works exactly like action caching, but for partial pages instead
    of full pages. Fragment caching uses directives in the views to mark the content
    you want to cache. You can use the out-of-the-box directives, or you use some
    add-ons that support time-based expiration.


    With out-of-the-box fragment caching, you use the `cache` helper within your view
    templates to cache content. Your cached code goes to a configurable back end (see
    Section 9.5, *Caching Back Ends*, on the following page) that you later expire
    with `expire_fragment` directives. In your view, you''d have something like this:


    ```

    <% cache %>

    <%= render partial => ''something_expensive'' %>

    <% end %>

    ```


    Say you invoked an action called `expensive/action` for the first time, and that
    action rendered the view with the previous code fragment. The code helper would
    cache the code to the configured back end and name the cache fragment `expensive/action`.
    The second time you invoked `expensive/action` action, Rails would retrieve that
    action from the cache.'
