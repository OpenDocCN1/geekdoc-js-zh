    The first thing you''ll notice is a fairly typical-looking web server document
    stanza (#1). This allows static content to be served. However, if it attempts
    to serve any file. Apache must execute a number of rewrite rules. These rules
    are based on regular expressions that check for some condition and then the rewrite
    to modify the resulting behavior. For example, the first rewrite (#2) blocks access
    to svn directories that Capistrano leaves behind. The next group of rules forms
    a maintenance (#3) rule that lets you gracefully respond to visitors while your
    site is not available. But the next rules (#4) demonstrate the overall goal: better
    performance. For static index pages when no file is specified in the URL and also
    cached Rails pages if they exist. If Apache can''t find a static file matching
    the request, Rails handles the request through the last pair of rewrite rules
    (#5). Finally, to speed up network transfers at the expense of some processing
    power, you can optionally enable the mod_deflate output filter (#6) to compress
    outbound text data.'
