  md: '# Adding On


    # Chapter 7


    # Scaling Out


    You will often want your website to grow. When you can''t fit into your existing
    home anymore, you have to find some way to move up or to add on. The Rails model
    for scaling will take you beyond the single home owner and into the realm of a
    real estate developer or community planner. This chapter will examine scaling
    out.


    # 7.1 The Lay of the Land


    I''m going to put down my real estate agent hat for a while and put on the hat
    of a community planner. If you own a house near a congested city and work in its
    busy downtown core, you''re all too familiar with multilane highway traffic that
    travels at times as fast as a cheetah and other times as slow as a statue of a
    cheetah. Presented with this problem, you might start with one of the following
    solutions to the problem:


    +   - Increase the speed limit.

    - Increase the number of lanes.


    These solutions sound obvious and you have probably heard similar analogies before,
    but there''s a lot more to it. Natural and political laws place a limit on how
    fast cars can travel safely, and you can add only so many lanes to a highway.
    These constraints effectively limit how either solution can ultimately be.


    Sometimes, these solutions are not even attacking the right problem. The obstacles
    to effectively moving people aren''t always speed limits or lanes. You need to
    consider interfaces—on-ramps and merges—that can slow traffic down. Entrances
    force lane changes and slowdowns,'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'exits double the problem, accidents or construction projects lane closures.
    The biggest bottleneck of all, though—and the one''s responsible for the others—not
    only are all the cars on the same road, but they''re all heading to the same place.
    The problem is the city center itself. You can only hope that there are enough
    parking spaces and office space available once you finally reach it!


    Your computer infrastructure isn''t much different. Each lane of the highway is
    a network connection to some service provided by the application. The city center
    is the resource pool. Every ramp is a client node. Each car is a user request
    headed downtown to some business. The idea of adding lanes and increasing speed
    limits is effectively a way of "scaling up." You can scale up by upgrading hardware
    such as CPUs, memory, disks, and network bandwidth. That strategy works sometimes,
    but upward scaling has its limits. There are only so many CPUs, so much memory,
    so many disks, and so much bandwidth that you can jam into a single box. These
    limits will likely never allow your application to meet the demands of the global
    crowd.


    The low ceiling isn''t the only problem with scaling up. As your business grows,
    the cost of failure becomes greater too. You''ll need redundant systems and hot
    backups to handle failure and even the occasional hardware upgrade. Ultimately,
    scaling up is harder, with a lower ceiling.


    Most successful web businesses scale up, not by chance or even necessity but by
    preference. I won''t completely write scaling up. I''ll touch upon it when I address
    the database because scaling up has some real advantages in that space.


    # 7.2 Scaling Out with Clustering


    Scaling out means adding servers, complete with their own dedicated CPUs, disks,
    memory, and network bandwidth. Think back to the traffic analogy for a moment.
    The ultimate problem was that everyone was heading to the same city center. Scaling
    out adds a second city center half the travelers that would suddenly be on a different
    road and heading toward a different city center. Imagine what your daily commute
    would be like tomorrow if half the city''s population were simply not on your
    road! Scaling out certainly yields rewards. But what about cost, complexity, and
    maintainability?


    Scaling out to hundreds of servers can cost you plenty in dollars and complexity,
    but you don''t have to pay all the price at once. Conve-'
