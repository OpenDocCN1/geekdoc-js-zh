- img_proc: true
  md: "However, it's important to consider the bigger picture. And that's what \n\n\
    truly matters, doesn't it? In reality, we don't just build \"Hello World\" \n\n\
    projects. We undertake more substantial projects that demand the \n\nutilization\
    \ of various frameworks and tools to achieve the desired \n\nfunctionality and\
    \ scalability.\n\nWe could have talked about the “big picture” of using React\
    \ or even \n\nAngular over vanilla code, but that is not the primary focus of\
    \ this \n\neBook. However, it is worth mentioning a few foundational reasons why\
    \ \n\nthese new tools make development more efficient:\n\nArchitecture — React\
    \ and Angular follow a Component-Based \n\nArchitecture, encouraging code reusability.\
    \ For instance, if you create a \n\ncomponent like a Button, you can use it anywhere\
    \ in the application as \n\noften as needed. This reusability enhances the maintainability\
    \ and \n\nscalability of the application.\n\nVirtual DOM — The Virtual DOM is\
    \ a lightweight representation of the \n\nactual DOM. It facilitates efficient\
    \ and optimized updates to the user \n\ninterface, resulting in improved performance.\
    \ Simply put, it tracks \n\nchanges within the application and performs a \"diffing\"\
    \ process by \n\ncomparing the previous version of the virtual DOM with the new\
    \ version. \n\nIt identifies the differences and updates the real DOM accordingly.\n\
    \nEcosystem & Community — Modern libraries like React.js have vibrant \n\nand\
    \ active communities. This provides developers with abundant \n\nresources, extensive\
    \ documentation, reusable code packages, bug \n\nfixes, and support.\n\nBirth\n\
    \n04"
  merge: -1
  pgno: 6
- img_proc: true
  md: "… and many other libraries or framework-specific reasons that you can \n\n\
    explore. To truly appreciate the impact, I would once again recommend \n\nvisiting\
    \ the YouTube videos we created, where you can experience \n\nfirsthand what it\
    \ takes to build a simple landing page using two \n\ndifferent tools to measure\
    \ the efficiency of these tools:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_7_0.png)\n\
    \nBuild and Deploy a Sushi \n\nWebsite using HTML & CSS\n\nWatch and Code Now\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_7_1.png)\n\nBuild and Deploy a Bank\
    \ \n\nWebsite using React.js\n\nWatch and Code Now\n\nBut hey, where does Next.js\
    \ come in the picture?\n\nAs mentioned earlier, as we continue to progress, technology\
    \ also \n\nadvances. jQuery addressed the limitations of vanilla JavaScript, and\
    \ \n\nthen React.js emerged to overcome the shortcomings and loopholes of \n\n\
    jQuery. However, even React.js has its own challenges, which have now \n\nbeen\
    \ addressed by another tool called Next.js.\n\nIt’s a big misconception that Next.js\
    \ is a new language or library. No!\n\nBirth\n\n05"
  merge: -1
  pgno: 7
- img_proc: true
  md: "Vercel, the team behind Next.js, embarked on a unique approach to \n\ndevelop\
    \ a framework encompassing client-side (frontend) and server-\n\nside (backend)\
    \ functionalities within a single application. Guillermo \n\nRauch, the original\
    \ creator of Next.js and the mastermind behind \n\nSocket.IO, began working on\
    \ this idea in 2016.\n\nOver the course of a year, they continuously added new\
    \ features such \n\nas file-based routing, automatic code splitting, hybrid rendering,\
    \ \n\ninternationalization, image and font optimization, and many more.\n\nThe\
    \ relentless dedication of the Vercel developers, coupled with their \n\nability\
    \ to transform diverse ideas into reality, has caught the attention \n\nof Meta\
    \ (previously known as Facebook) — the creators of React.js. Meta \n\nnow explicitly\
    \ recommends that developers use Next.js as their primary \n\ntool instead of\
    \ relying solely on React.js. It's an extraordinary \n\nachievement!\n\nAnd that’s\
    \ how we developers now need to shift our focus to the latest \n\nand greatest\
    \ version, Next.js 13, to build highly capable and production-\n\nready applications.\
    \ This exciting evolution opens up new possibilities \n\nand opportunities for\
    \ creating advanced web applications.\n\nOnto the next chapter…\n\nBirth\n\n06"
  merge: -1
  pgno: 8
- img_proc: true
  md: "Chapter 2\n\nIntroduction\n\nIn this chapter, we'll dive into Next.js, a flexible\
    \ React framework. We'll \n\nexplore its advantages over React.js, including simplified\
    \ frontend \n\ndevelopment, reduced tooling time, and an easy learning curve.\
    \ We'll \n\nalso discuss how Next.js improves performance, enhances SEO, and \n\
    \nkeeps advancing with new features. \n\nBy the end, you'll grasp the importance\
    \ of mastering Next.js and be \n\nprepared to embark on an exciting journey with\
    \ this framework."
  merge: -1
  pgno: 9
- img_proc: true
  md: "Introduction\n\nNext.js — A flexible React Framework. But what does that mean?\n\
    \nIn software development, a framework serves as a tool equipped with \n\npredefined\
    \ rules and conventions that offer a structured approach to \n\nconstructing an\
    \ application. It provides an environment that outlines \n\nthe overall architecture,\
    \ design patterns, and workflows, allowing \n\ndevelopers to focus on implementing\
    \ specific application logic rather \n\nthan dealing with low-level design.\n\n\
    Simply put, a framework provides pre-built solutions for common \n\nfunctionalities\
    \ such as integrating databases, managing routing, \n\nhandling authentication,\
    \ and more.\n\nSo what sets Next.js apart from React.js? — Next.js introduces\
    \ plenty of \n\nfeatures and capabilities that we will dive into in the upcoming\
    \ chapter \n\nin detail.\n\nBut what you need to understand is Next.js is essentially\
    \ an extension of \n\nReact.js, incorporating pre-built solutions, ready-to-use\
    \ features, and \n\nsome additional functionalities. In other words, Next.js is\
    \ built on top of \n\nReact, expanding its capabilities.\n\nIf you’re already\
    \ a React.js developer, the Next.js journey will be silky \n\nsmooth. If you don’t\
    \ know React.js, you should familiarize yourself with \n\nsome of the main foundations\
    \ of React.js, i.e., How to create a \n\ncomponent, state management, code structure,\
    \ etc.\n\nIntroduction\n\n07"
  merge: -1
  pgno: 10
- img_proc: true
  md: "To help you learn faster, we have a crash course on React.js that covers \n\
    \nall the important things and includes a project for you to practice and \n\n\
    test your skills:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_11_0.png)\n\nReact.js\
    \ Crash Course\n\nWatch and Code Now\n\nBut Why should you use a React Framework\
    \ — Next.js?\n\nReact is constantly evolving and revolutionizing the way websites\
    \ are \n\nbuilt. It completely transforms your approach to designing and \n\n\
    developing applications. \n\nIt begins by encouraging you to think about components,\
    \ breaking \n\ndown the user interface into small pieces of code. You describe\
    \ states \n\nto introduce interactivity and establish connections between these\
    \ \n\nvarious components, shaping the flow of your application.\n\nImplementing\
    \ the great React architecture requires deep integration \n\nbetween all parts\
    \ of your application, and this is where frameworks \n\ncome in:\n\nLess tooling\
    \ time\n\nEvery aspect of frontend development has seen innovation, from \n\n\
    compiling, bundling, minifying, formatting, etc., to deploying and more. \n\n\
    Introduction\n\n08"
  merge: -1
  pgno: 11
- img_proc: true
  md: "With Next.js, we won’t have to worry about configuring these tools, thus \n\
    \ninvesting more time in writing React code.\n\nWe can focus more on business\
    \ logic using open-source solutions for \n\nrouting, data fetching, rendering,\
    \ authentication, and more.\n\nEasy Learning Curve\n\nIf you are familiar with\
    \ React.js, you will discover Next.js is considerably \n\nsimpler.\n\nNext.js,\
    \ built on the foundation of React.js, offers exceptional \n\ndocumentation that\
    \ provides comprehensive and detailed information \n\non the why and how of using\
    \ Next.js. The \"\n\n\" \n\nguide developed by the Vercel team is regarded as\
    \ one of the best \n\nresources for the learning experience.\n\nIntroduction |\
    \ Learn Next.js\n\nThe constant updates and help from the community make the \n\
    \ndevelopment process even easier.\n\nOne of the key aspects of Next.js is that\
    \ it is not just a Frontend React \n\nFramework but a Full Stack React Framework\
    \ enabling you to write \n\nbackend code alongside your frontend code.\n\nHow\
    \ does it contribute to an \"Easy Learning Curve\"? Wouldn't it be \n\nanother\
    \ thing to learn?\n\nAbsolutely not.\n\nThe backend aspect of the code you'll\
    \ be working with is much simpler \n\nthan you might anticipate. There's no need\
    \ to set up anything or \n\nconfigure any routes as we have to do for any traditional\
    \ backend app.\n\nIntroduction\n\n09"
  merge: -1
  pgno: 12
- img_proc: true
  md: "In fact, the Vice President of Vercel, Lee Robinson, expressed the \n\nfollowing\
    \ viewpoint:\n\nMoving from React + Express + Webpack to a framework \n\nresulted\
    \ in removing \n\n and \n\n – while improving HMR (Hot Module \n\nReloading) from\
    \ \n\n.\n\n20,000+ lines of code\n\n30+ \n\ndependencies\n\n1.3s to 131ms\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_13_0.png)\n\nIf the backend and tooling\
    \ aspects discussed here seem confusing, \n\nthere's no need to worry. In the\
    \ upcoming chapters, we will dive into a \n\npractical comparison of how things\
    \ are done with React.js and \n\nExpress.js, as well as how both can be accomplished\
    \ within Next.js.\n\nImproved Performance\n\nNext.js offers built-in features\
    \ like server-side rendering, static site \n\ngeneration, and automatic code splitting,\
    \ which optimize application \n\nperformance by enabling faster initial page loads,\
    \ improving SEO, and \n\nenhancing the user experience.\n\nHowever, it doesn't\
    \ mean server-side capabilities are limited to Next.js \n\nalone. React has introduced\
    \ a new concept called React Server \n\nComponents, which allows rendering components\
    \ on the server side.\n\nSo, why choose Next.js over using React alone?\n\nThe\
    \ advantage lies in the convenience and productivity provided by \n\nNext.js.\
    \ By utilizing Next.js, you can leverage the existing features of \n\nReact without\
    \ the need for extensive setup and configuration. \n\nIntroduction\n\n10"
  merge: -1
  pgno: 13
- img_proc: true
  md: "Next.js automates many aspects, allowing you to focus more on utilizing \n\n\
    the features rather than dealing with infrastructure & boilerplate code.\n\nThis\
    \ approach follows the principle of \"Convention over Configuration,\" \n\nstreamlining\
    \ the development process and reducing the amount of \n\ncode you need to write\
    \ compared to implementing React Server \n\nComponents independently.\n\nSEO -\
    \ Search Engine Optimization\n\nPerhaps the most ignored and must topic in an\
    \ application’s life, and \n\nthe only drawback of React.js.\n\nThe key difference\
    \ lies in the rendering approach between Next.js and \n\nReact.js.\n\nSearch engine\
    \ crawlers are like busy visitors to websites. They come \n\nand ask for the content\
    \ of pages. They explore the links on those pages, \n\ncarefully examining and\
    \ organizing them for ranking purposes. This is \n\nwhat they do every day. To\
    \ do their job well, they need to be able to \n\naccess the content of the website\
    \ pages.\n\nReact.js renders everything on the client side, sending a minimal\
    \ initial \n\nHTML response from the server. The server sends a minimal HTML file\
    \ \n\ncode and a JavaScript file that the browser executes to generate the \n\n\
    HTML. This poses a challenge for search engine crawlers to access and \n\nunderstand\
    \ the complete content of the page.\n\nOn the other hand, Next.js provides the\
    \ option of Static Site Generation \n\n(SSG) or Server Side Rendering (SSR). \n\
    \nIntroduction\n\n11"
  merge: -1
  pgno: 14
- img_proc: true
  md: "With SSG or SSR, the server sends the complete HTML file and minimal \n\nJavaScript\
    \ code to render only the content requiring client-side \n\ninteraction. This\
    \ enables search engine crawlers to access easily and \n\nindex every page of\
    \ the Next.js website accurately.\n\nBut, now you might wonder, \"Why should I\
    \ prioritize SEO?\"\n\nSEO is essential for making your website visible and highly\
    \ ranked in \n\nsearch engine (browser) results. When you focus on SEO, you get\
    \ \n\nseveral benefits, like more people visiting your website, better user \n\
    \nexperience, increased trust and credibility, and an advantage over your \n\n\
    competitors because your website shows up higher in search results. \n\nGiving\
    \ priority to SEO can greatly impact how well your website does \n\nand how many\
    \ people find it online.\n\nAlways Advancing\n\nNext.js, the ever-evolving framework,\
    \ consistently introduces new \n\nfeatures to simplify developers' lives. With\
    \ over 7+ versions released last \n\nyear, Next.js focuses on innovation and improvement\
    \ for a better user \n\nexperience. This is precisely what frameworks like Next.js\
    \ aim to achieve, \n\nmaking development easier and more efficient.\n\nOn top\
    \ of that, other technologies like Expo, used for building React \n\nNative projects,\
    \ are also adopting Next.js's groundbreaking features. \n\nInspired by Next.js's\
    \ file-based routing system, Expo developers have \n\nimplemented a similar feature\
    \ — Expo Router to improve the decade-\n\nold routing system in React Native.\n\
    \nIntroduction\n\n11"
  merge: -1
  pgno: 15
- img_proc: true
  md: "Isn’t that great? Master one feature and effortlessly utilize it across \n\n\
    multiple platforms\n\nHowever, the list of features provided by Next.js goes beyond\
    \ what has \n\nbeen mentioned so far. \n\nIt offers a wide range of capabilities,\
    \ including seamless file-based \n\nrouting, efficient code splitting, image &\
    \ font optimization, HMR(Hot \n\nModule Replacement), API Routes(backend), built-in\
    \ support for Sass, \n\nCSS modules, data fetching choice (SSG, SSR, ISR), error\
    \ handling, \n\nMetadata API (For SEO), Internationalization(support for any spoken\
    \ \n\nlanguage), etc.\n\nIt is best to try these features firsthand through practical\
    \ \n\nimplementation to truly appreciate its potential. That's precisely what\
    \ \n\nwe will do in the upcoming lessons – dive into the coding aspect!\n\n\"\
