  md: "Both of them, why?\n\nThis is because Next.js performs pre-rendering certain\
    \ content before \n\nsending it back to the client.\n\nSo basically, two things\
    \ happen:\n\nP Server Components are guaranteed to be only rendered on the \n\n\
    serveL\n\nP On the other hand, client components are primarily rendered on the\
    \ \n\nclient side.\n\nHowever, Next.js also pre-renders them on the server to\
    \ ensure a \n\nsmooth user experience and improve search engine optimization (SEO).\n\
    \nNext.js, by default, performs static rendering, which means it pre-\n\nrenders\
    \ the necessary content on the server before sending it to the \n\nclient. This\
    \ pre-rendering process includes server and client \n\ncomponents that can be\
    \ pre-rendered without compromising \n\nfunctionality.\n\nThe server Component\
    \ is the latest React.js Feature. Next.js has \n\nsimply used it over what they\
    \ had, making the setup easy.\n\nLet’s play around with these components a little\
    \ more. Now, import the \n\nExampleServer component inside the app/page.js file\n\
    \nClient Vs. Server\n\n79"
