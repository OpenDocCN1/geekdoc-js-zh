- img_proc: true
  md: "For example, if we install Axios, a folder named axios will be created \n\n\
    within the node\\_modules folder. If you've been following closely, you \n\nmay\
    \ have noticed that Next.js is built on top of React. Therefore, you can \n\n\
    explore the node\\_modules folder to find the react folder, which contains \n\n\
    the code for React itself.\n\nIn addition to React, you'll come across several\
    \ other folders such as \n\nnext (which enables Next.js-specific features), react-dom,\
    \ postcss, \n\nstyled-jsx, and more. Each of these folders contains numerous files\
    \ \n\nand lines of code essential for running our Next.js application.\n\nNo need\
    \ to worry, though. You don't have to interact with or visit this \n\ndirectory\
    \ in the future (unless something terrible happens). npm \n\nautomatically manages\
    \ the node\\_modules folder when we install or \n\nuninstall node packages.\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_64_0.png)\n\nPublic\n\nIt’s a special\
    \ folder allowing us to include static assets like images or \n\nfiles like fonts,\
    \ videos, etc.\n\nThe content inside this folder is automatically optimized and\
    \ available \n\nthroughout the application. Thus it’s advisable to put any PNGs,\
    \ JPEGs, \n\nor SVGs we need inside this folder.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_64_1.png)\n\
    \n.gitignore\n\nThe .gitignore is a special text file that tells Git, the version\
    \ control \n\nsystem, to exclude certain files and directories from being tracked.\n\
    \nOne common entry in the .gitignore file is node\\_modules.\n\nCreate a Next.js\
    \ Application\n\n57"
  merge: -1
  pgno: 64
- img_proc: true
  md: "This is because the node\\_modules directory contains many files and \n\nfolders\
    \ generated when installing dependencies for a Node.js project. \n\nIncluding\
    \ these files in version control would create unnecessary clutter \n\nand increase\
    \ the size of the repository.\n\nAs said by the Creator of Node.js — Ryan Dahl\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_65_0.png)\n\nWe would certainly not\
    \ want to track the “Heaviest Object” in the \n\nuniverse!\n\n![](img/76188a8f748fc585400eeef7e6351b2a_65_1.png)\n\
    \njsconfig.json\n\nRemember the prompt that appeared when we ran the Next.js CLI\
    \ tool? \n\nIt asked us if we wanted to customize the default import alias, and\
    \ we \n\nchose \"No\".\n\nCreate a Next.js Application\n\n58"
