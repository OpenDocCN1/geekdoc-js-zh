  md: "Chapter 6\n\nClient Vs. Server\n\nIn this chapter, you'll dive into the concepts\
    \ of client-side rendering \n\n(CSR) and server-side rendering (SSR) in Next.js.\
    \ You'll explore how \n\nNext.js handles rendering on the client and server, understand\
    \ the \n\nbenefits and trade-offs of each approach, and learn how to implement\
    \ \n\nCSR and SSR in your Next.js applications."
  merge: -1
  pgno: 75
- img_proc: true
  md: "Client Vs. Server\n\nSo far, we understand that Next.js does a mix of server-side\
    \ and client-\n\nside rendering to get the best of both worlds. But we need to\
    \ find out \n\nwhich parts of the application are rendered on the server side.\
    \ Can we \n\nchoose what to render in each environment? \n\nAnd if so, how can\
    \ we do that?\n\nBefore we answer these questions, let's go back and remind ourselves\
    \ \n\nwhat we mean by client and server. What do these terms actually \n\nmean?\n\
    \nClient\n\nThe client refers to the device you are currently using, such as your\
    \ \n\nsmartphone or computer. The device sends requests to the server and \n\n\
    displays the interface that we can interact with.\n\nServer\n\nThe server is essentially\
    \ just a computer device, but it is equipped with \n\nstrong configurations and\
    \ remains operational continuously. It is where \n\nall the code for our application\
    \ is stored. When the client, our device, \n\nsends a request, the server performs\
    \ the necessary computations and \n\nsends back the required outcome.\n\nIn previous\
    \ versions of Next.js, specifically versions before 13, we faced a \n\nlimitation\
    \ where server-side rendering was restricted to individual \n\npages. This meant\
    \ that only the route pages like \"/\", \"/about\", \"/projects\", \n\nand so\
    \ on could be rendered on the server side. \n\nClient Vs. Server\n\n68"
  merge: -1
  pgno: 76
- img_proc: true
  md: "This limitation led to challenges such as prop drilling and duplication of\
    \ \n\nAPI calls when passing data to lower-level components.\n\nI recommend reading\
    \ this article to gain a deeper understanding of the \n\ndifferences between the\
    \ pages directory and the app directory in Next.js \n\nand how they address these\
    \ limitations. It provides detailed insights \n\ninto the topic:\n\nLess code,\
    \ better UX: \n\nFetching data faster with \n\nthe Next.js 13 App Router\n\nLink\
    \ to blog\n\n![](img/76188a8f748fc585400eeef7e6351b2a_77_0.png)\n\nAnd that, my\
    \ friends, is where the app directory comes into action. It not \n\nonly introduced\
    \ many features but also brought about a revolutionary \n\nchange, i.e., — Component\
    \ level Server Side Rendering.\n\nWhat does that mean?\n\nIt means that now we\
    \ have the ability to choose where we want to \n\nrender specific components or\
    \ a section of code.\n\nFor instance, let's consider a component called Navbar.jsx.\
    \ With this \n\nnew capability, we can decide whether we want to render it on\
    \ the \n\nserver side or the client side (in the user's browser).\n\nAnd that's\
    \ how we end up with two types of components: Client \n\nComponents and Server\
    \ Components.\n\nClient Vs. Server\n\n69"
  merge: -1
  pgno: 77
- img_proc: true
  md: "What are these?\n\nSimply put, both are React components, but the difference\
    \ lies in where \n\nthey are rendered.\n\nClient Component - A react component\
    \ that runs/renders on the user’s \n\ndevice, such as a web browser or mobile\
    \ app.\n\nServer Component - A react component that runs/renders on the \n\nserver,\
    \ i.e., the infra or place where we’ll deploy our application\n\nBut why would\
    \ we want to render such a small component on the \n\nserver side?\n\nWell, think\
    \ about it!\n\nBy strategically deciding to render certain components on the server\
    \ \n\nside, we save users' browsers from doing extra work with JavaScript to \n\
    \nshow those components. Instead, we get the initial HTML code for those \n\n\
    components, which the browser can display immediately. This reduces \n\nthe size\
    \ of the JavaScript bundle, making the initial page load faster.\n\nAnd as discussed\
    \ above, we’ll overcome our limitations with the pages \n\ndirectory. Rather than\
    \ fetching and passing data to components \n\nseparately, we can fetch the data\
    \ directly within the component, \n\nturning it into a server component.\n\nOverall,\
    \ we’ll have these benefits if we choose to do server-side \n\nrendering:\n\n\
    Smaller JavaScript bundle size: The size of the JavaScript code that \n\nneeds\
    \ to be downloaded by the browser is reduced.\n\nClient Vs. Server\n\n70"
  merge: -1
  pgno: 78
- img_proc: true
  md: "Enhanced SEO (Search Engine Optimization: Server-side rendering \n\nhelps improve\
    \ search engine visibility and indexing of your website's \n\ncontent. (remember?)\n\
    \nFaster initial page load for better accessibility and user experience: \n\n\
    Users can see the content more quickly, leading to a smoother \n\nbrowsing experience.\n\
    \nEfficient utilization of server resources: By fetching data closer to the \n\
    \nserver, the time required to retrieve data is reduced, resulting in \n\nimproved\
    \ performance.\n\nOkay, but when to decide what to render where?\n\nAs their name\
    \ suggests, where to render each component depends on \n\nwhat the component does.\n\
    \nIf a component needs the user to interact with it, such as clicking \n\nbuttons,\
    \ entering information in input fields, triggering events, or using \n\nreact\
    \ hooks, then it should be a client component. These interactions \n\nrely on\
    \ the capabilities of the user's web browser, so they need to be \n\nrendered\
    \ on the client side.\n\nOn the other hand, if a component doesn't require any\
    \ user interaction \n\nor involves tasks like fetching data from a server, displaying\
    \ static \n\ncontent, or performing server-side computations, it can be a server\
    \ \n\ncomponent. These components can be rendered on the server without \n\nspecific\
    \ browser features.\n\nClient Vs. Server\n\n71"
  merge: -1
  pgno: 79
- img_proc: true
  md: "Ask yourself:\n\nDoes the component require user interactivity?\n\nYes — Client\
    \ Component\n\nNo — Server Component\n\nTo simplify things, the Next.js documentation\
    \ provides a helpful table \n\nthat guides you on where to render each component.\n\
    \nWhat do you need to do?\n\nServer \n\nComponent\n\nClient \n\nComponent\n\n\
    Fetch data.\n\nAccess backend resources (directly)\n\nKeep sensitive information\
    \ on the server (access \n\ntokens, API keys, etc)\n\nKeep large dependencies\
    \ on the server / Reduce \n\nclient-side JavaScript\n\nAdd interactivity and event\
    \ listeners (onClick(), \n\nonChange(), etc)\n\nUse State and Lifecycle Effects\
    \ (useState(),  \n\nuseReducer(),  useEffect(), etc)\n\nUse browser-only APIs\n\
    \nUse custom hooks that depend on state, effects, or \n\nbrowser-only APIs\n\n\
    Use React Class components\n\n![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)\n\
    \nClient Vs. Server\n\n72"
