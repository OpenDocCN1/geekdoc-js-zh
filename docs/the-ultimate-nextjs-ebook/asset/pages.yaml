- img_proc: true
  md: "√ Would you like to customize the default import alias? No\n\nWell, the jsconfig.json\
    \ file is related to that question. It act as a \n\nconfiguration file where we\
    \ can set various options and settings for our \n\nproject. One of the things\
    \ we can configure is the import behavior.\n\nBy default, when we want to import\
    \ code from one file into another, we \n\nuse relative paths like this:\n\nimport\n\
    \nfrom '\n\n something \n\n ../../components\\`\n\nThis is the correct, but sometimes\
    \ long and complex, relative path.\n\nIn larger projects or projects with complex\
    \ directory structures, \n\nmanually specifying relative paths for each import\
    \ can become tedious \n\nand prone to errors.\n\nHowever, by configuring the compilerOptions\
    \ in the jsconfig.json \n\nfile, we can inform the compiler about a specific import\
    \ path structure \n\nthat we want to use.\n\nIf we take a look at the content\
    \ of the jsconfig.json file, we have:\n\n{ \n\n \"\n\n\"\n\n{ \n\n \"\n\n\": {\
    \ \n\n \"\n\n\":\n\n\"\n\n\"\n\n } \n\n } \n\n}\n\ncompilerOptions\n\n./\\*\n\n\
    : \n\npaths\n\n \n\n@/\\*\n\n \\[\n\n\\] \n\nCreate a Next.js Application\n\n\
    59"
  merge: -1
  pgno: 66
- img_proc: true
  md: "In this configuration, we have defined path aliases using \n\n. This \n\nmeans\
    \ that now we can do the following:\n\n@/\\*\n\nimport\n\nfrom '\n\n something\
    \ \n\n @/components\\`\n\ni.e., using @/\\* for any files and folders located\
    \ in this location ./\\* i.e., the \n\nroot!\n\n![](img/76188a8f748fc585400eeef7e6351b2a_67_0.png)\n\
    \nFeel free to customize the alias to your preference. You can change @/\\* \n\
    \nto @\\* or even #/\\* — the choice is yours! \n\n![](img/76188a8f748fc585400eeef7e6351b2a_67_1.png)\n\
    \npackage-lock.json\n\nHave you ever think of this as an unwanted file?\n\nWell,\
    \ let me tell you, it's actually quite important. This file, called \n\npackage-lock.json,\
    \ is automatically created when we install or make \n\nchanges to packages. It\
    \ serves as a lock file, carefully keeping track of \n\nthe specific versions\
    \ of all the installed packages and their \n\ndependencies.\n\nLet's imagine a\
    \ scenario: You're working on a Next.js project. After \n\ncompleting your work,\
    \ you share the project code with your manager, \n\nbut you omit the package-lock.json\
    \ file, thinking it's not essential.\n\nNow, your manager starts downloading the\
    \ packages listed in the \n\npackage.json file. The package manager, npm, installs\
    \ the specified \n\npackages and their dependencies (i.e., the folder and files\
    \ we have \n\nseen inside the node\\_modules folder).\n\nCreate a Next.js Application\n\
    \n60"
  merge: -1
  pgno: 67
- img_proc: true
  md: "However, if any dependencies release a new version, the package \n\nmanager\
    \ will eagerly download it. And unfortunately, if this new version \n\nmay contain\
    \ unresolved bugs or compatibility issues, it can cause your \n\napplication to\
    \ misbehave.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_68_1.png)\n\
    \nAs a result, your manager may become frustrated, saying, \"It doesn't \n\nwork\
    \ on my machine \n\n,\" while you feel helpless, responding with a \n\ndisheartened\
    \ \"It works on my machine \n\n.\"\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_2.png)\n\
    \nKnow the importance and always share your package-lock.json file \n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_3.png)\n\
    \npackage.json\n\nThink of this as an info card that tells about you — who you\
    \ are, where \n\nyou are from, etc. but with more complete details.\n\nAlong with\
    \ containing the information regarding the name of the \n\nproject, and its version,\
    \ it tells us the dependencies and dev \n\ndependencies required to run this project\n\
    \ndependencies\n\nList of the packages that are necessary for the project to run\
    \ the \n\nproduction environment\n\ndevDependencies\n\nList of packages that are\
    \ only needed during the development process. \n\nFor example, linting packages\
    \ like eslint.\n\nWhenever we install a package, whether a dependency or a dev\
    \ \n\ndependency, npm automatically records the package name and its \n\ncorresponding\
    \ version in the respective section of the package.json file.\n\nCreate a Next.js\
    \ Application\n\n61"
