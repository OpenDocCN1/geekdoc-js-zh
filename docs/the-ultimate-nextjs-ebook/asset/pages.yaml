- img_proc: true
  md: "Following these steps, you can view your \"NextEbook\" folder in VSCode.\n\n\
    VSCode provides its own built-in terminal, eliminating the need for \n\ndevelopers\
    \ to open the OS Terminal or Command Prompt separately. \n\nWith the inline terminal\
    \ in VSCode, we can perform all necessary tasks \n\nwithin the application.\n\n\
    To open the terminal, press ctrl + \\`(backtick) or click on the \n\n\"Terminal\"\
    \ option in the top menu bar. From the dropdown menu, select \n\n\"New Terminal.\"\
    \ The terminal window will appear as follows:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_57_0.png)\n\
    \nFor the final, let’s now create our Next.js application. There are two \n\n\
    options:\n\n\x91 Automatic Installatio\x83\n\n\x91 Manual Installation\n\nCreate\
    \ a Next.js Application\n\n50"
  merge: -1
  pgno: 57
- img_proc: true
  md: "As the name implies, manual installation involves obtaining and \n\nconfiguring\
    \ packages individually and organizing the initial file and \n\nfolder structure\
    \ along with some code. We’ll have to do everything on \n\nour own.\n\nOn the\
    \ other hand, the alternative approach aims to accelerate the \n\ndevelopment\
    \ process by allowing us to create the application with our \n\npreferred choices.\
    \ Depending on our preferences, such as using \n\nTypeScript or not, incorporating\
    \ styling libraries like Tailwind CSS, or \n\nopting for other options, we can\
    \ set up the complete project with just \n\none click.\n\nBeing widely used and\
    \ an easy installation choice, we can create a \n\nnext.js project by running\
    \ a Zero Dependency CLI (Command Line \n\nInterface) tool — create-next-app. You\
    \ can visit \n\n link if you want to \n\nknow about this in detail. Inside, you’ll\
    \ see how the create-next-app has \n\nbeen created with the templates, including\
    \ with/without JavaScript, \n\nTailwind CSS, etc.\n\nthis\n\nDon’t worry; you\
    \ don’t need to download create-next-app as another \n\nglobal package. Thanks\
    \ to npx!\n\nWhen you installed Node.js, you also got two other useful tools:\
    \ \n\nNPM\n\nNPX\n\nNPM, which stands for Node Package Manager, allows us to manage\
    \ \n\nand download various packages (collections of code) that we need to \n\n\
    run our application. For example, packages like Axios for making HTTP \n\nrequests\
    \ or Redux Toolkit for state management.\n\nCreate a Next.js Application\n\n51"
  merge: -1
  pgno: 58
- img_proc: true
  md: "On the other hand, NPX, short for Node Package Runner, is a command-\n\nline\
    \ tool. It lets us execute packages without installing them globally on \n\nour\
    \ system. It's important to note that npx is used to run command-line \n\ntools\
    \ and execute commands from packages, but it doesn't handle the \n\ninstallation\
    \ of packages. That responsibility falls to npm, which takes \n\ncare of package\
    \ installation.\n\nLet's move on from the theoretical discussion and proceed with\
    \ the \n\ncommand that will automatically install the necessary packages for \n\
    \nrunning a Next.js application.\n\nnpx create-next-app@latest\n\nAs soon as you\
    \ press enter, it will prompt you to confirm whether it can \n\ndownload the required\
    \ packages. Please select \"yes\" to proceed with \n\nthe installation.\n\nDuring\
    \ the installation process, we will encounter a series of prompts \n\nindividually.\
    \ These prompts allow you to choose the specific features \n\nand configurations\
    \ we desire for our Next.js application.\n\n√\n\n√\n\n√\n\n√\n\n√\n\n√\n\n√\n\n\
    \ What is your project named? \n\n Would you like to use TypeScript with this\
    \ project? \n\n Would you like to use ESLint with this project? \n\n Would you\
    \ like to use Tailwind CSS with this project? \n\n Would you like to use src/\
    \ directory with this project? \n\n Use App Router (recommended)? \n\n Would you\
    \ like to customize the default import alias? \n\nintroduction \n\nNo \n\nNo \n\
    \nNo \n\nNo \n\nYes \n\nNo\n\nLet's choose not to include TypeScript, ESLint,\
    \ and Tailwind CSS. In the \n\nupcoming chapters, we will explore these options\
    \ in detail.\n\nCreate a Next.js Application\n\n52"
  merge: -1
  pgno: 59
