  md: "page.js\n\nIt’s an alias of the home route i.e., “/”. It's important not to\
    \ confuse this \n\nfile with layout.js. Whatever you write inside page.js will\
    \ be displayed \n\nonly on the \"/\" route, while anything inside layout.js will\
    \ appear across all \n\nroutes, including the home route i.e., “/”.\n\nIn short,\
    \ layout.js is the parent of page.js, providing a common layout for \n\nall pages.\n\
    \npage.module.css\n\nThis CSS file is specifically designed to style a particular\
    \ page \n\ncomponent or module. The naming convention .module.css indicates \n\
    \nthat the CSS rules in this file are scoped to a specific component. In this\
    \ \n\ncase, it corresponds to the page.js component.\n\nIf you closely examine\
    \ the code, you will notice the presence of the \n\nfollowing:\n\nimport\n\nfrom\
    \ '\n\n styles \n\n ./page.module.css\\`\n\ninside the page.js file.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_63_0.png)\n\
    \nNode Modules\n\nWell, it’s the backbone!\n\nThe node\\_modules directory is\
    \ a storage location for all the \n\ndependencies or packages required to run\
    \ a project. Whenever we \n\ninstall packages using npm, the corresponding code\
    \ for those \n\npackages is placed inside this directory.\n\nCreate a Next.js\
    \ Application\n\n56"
  merge: -1
