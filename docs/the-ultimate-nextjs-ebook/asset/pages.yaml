  md: "Chapter 1\n\nBirth\n\nIn the first chapter, we explore the evolution of JavaScript\
    \ and web \n\ndevelopment frameworks. We discuss the significance of embracing\
    \ \n\nnew technologies and compare code snippets in different frameworks \n\n\
    to highlight their benefits. We introduce Next.js as a framework built on \n\n\
    React.js, addressing limitations and incorporating new features. \n\nThe chapter\
    \ concludes with the recommendation to shift focus to \n\nNext.js for building\
    \ modern web applications."
  merge: -1
  pgno: 2
- img_proc: true
  md: "Birth\n\nNot too long ago, in 2015, React.js entered the scene. However, even\
    \ the \n\njourney of JavaScript in the IT industry hasn't been exceptionally long.\
    \ \n\nOriginally developed by Brenden Eich at Netscape in 1995, JavaScript \n\n\
    gained significant popularity during the 2000s. \n\nThis was largely due to Google's\
    \ ingenious utilization of JavaScript to \n\nintroduce interactive and dynamic\
    \ features for map exploration. \n\nSubsequently, developers were introduced to\
    \ frameworks and libraries, \n\nincluding jQuery, Angular, Node.js, React.js,\
    \ and, most recently, Next.js. \n\nThese technologies have revolutionized the\
    \ web development \n\nlandscape, offering developers various capabilities and\
    \ possibilities.\n\nYou might wonder why this information is relevant in the context.\
    \ The \n\nsignificance lies in the fact that it highlights the timeless truth\
    \ that \n\n\"change is constant.\" As we continue to advance and evolve as a \n\
    \nsociety, our tools and technologies will naturally progress alongside us. \n\
    \nWe have no other option but to embrace and adapt to these changes. It \n\nserves\
    \ as a reminder that our willingness to embrace new ideas and \n\ntechnologies\
    \ is essential for growth and success in the ever-changing \n\nIT industry landscape.\n\
    \nThese technologies and tools share a common purpose: to enhance \n\nwork efficiency\
    \ and improve performance. In this era, we can still use \n\nvanilla JavaScript\
    \ or create websites using HTML and CSS without a \n\ndoubt. \n\nBirth\n\n01"
  merge: -1
  pgno: 3
- img_proc: true
