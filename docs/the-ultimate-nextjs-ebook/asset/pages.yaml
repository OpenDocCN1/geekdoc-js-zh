  md: "Chapter 4\n\nHow it works\n\nIn this chapter, we lay the foundation by understanding\
    \ how the web \n\nworks before diving into Next.js code. We explore the traditional\
    \ \n\napproach of HTML, CSS, and JavaScript websites, where the server \n\nsends\
    \ complete files to the client for each page request. \n\nWe also introduce the\
    \ React way, where the server sends a minimal \n\nHTML file and a bundled JavaScript\
    \ file, and React manipulates the \n\nvirtual DOM for efficient rendering. Finally,\
    \ we discuss the Next.js way."
  merge: -1
  pgno: 45
- img_proc: true
  md: "How it works\n\nYou might be itching to start with Next.js code, right?\n\n\
    Although writing code is important, we must first build our foundations. \n\n\
    It’ll not just help you in clearing interviews but will also help in making \n\
    \nsound decisions in your application.\n\nIf your why isn’t clear, you’ll have\
    \ no idea what you’re doing, and you’ll \n\nblame it on Next.js by saying that\
    \ it’s an overrated piece of technology. \n\nThat will only showcase your lack\
    \ of knowledge. It's a foolproof recipe to \n\namaze everyone with your impressive\
    \ ignorance.\n\nSo, perfect your why and your how will come naturally.\n\nLet’s\
    \ time-travel a bit to see how things were used to work with \n\ndifferent technologies.\n\
    \nThe vanilla — HTML, CSS, \n\nand JavaScript\n\nWebsites built using the web's\
    \ fundamental elements, namely HTML, \n\nCSS, and JavaScript, function differently\
    \ compared to the latest \n\ntechnologies.\n\nWhen a user visits such a website,\
    \ their browser (the client) sends a \n\nrequest to the server (another computer\
    \ where the site is hosted) \n\nasking for the content to be displayed.\n\nHow\
    \ it works\n\n40"
  merge: -1
  pgno: 46
- img_proc: true
  md: "![](img/76188a8f748fc585400eeef7e6351b2a_47_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_1.png)\n\
    \nRequest\n\n![](img/76188a8f748fc585400eeef7e6351b2a_47_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_3.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_5.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_6.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_7.png)![](img/76188a8f748fc585400eeef7e6351b2a_47_8.png)\n\
    \nAnalyzing the HTML file\n\nApplies the styles\n\nImplements any user interaction\n\
    \nTraditionally, for each of these requests, the server responds by sending \n\
    \nthree files i.e., the HTML, CSS, and JavaScript (only if any JavaScript code\
    \ \n\nis involved). The client's browser receives these files and begins by \n\
    \nanalyzing the HTML file. Then, it applies the styles from the CSS file and \n\
    \nimplements any user interaction, such as event handlers or dynamic \n\nbehavior,\
    \ specified in the JavaScript file on the webpage.\n\nThe client will send additional\
    \ requests to the server if the website has \n\nmultiple pages. In response, the\
    \ server will send the three files \n\ncontaining the respective content needed\
    \ to render each page.\n\nHow it works\n\n41"
  merge: -1
  pgno: 47
- img_proc: true
  md: "What’s the catch?\n\nProcessing\n\nMost processing occurs on the client side,\
    \ meaning the user's web \n\nbrowser is responsible for rendering the HTML page\
    \ and executing any \n\nJavaScript code present.\n\nHowever, if the website is\
    \ complex and the user's device needs more \n\ncapabilities, it can strain the\
    \ browser and create a burden for it to \n\nhandle.\n\nBandwidth\n\nAs the server\
    \ sends complete files to the client for each page request, it \n\nincreases bandwidth\
    \ usage. This becomes particularly significant when \n\ndealing with complex websites\
    \ containing numerous pages and video \n\nand audio clips scattered throughout\
    \ the site.\n\nLoad Time\n\nThe initial page load time may be longer when compared\
    \ to the latest \n\ntechnologies. This is due to the complete transfer of files\
    \ for each \n\nrequest. Only after the server has sent all the necessary files\
    \ and the \n\nbrowser has finished parsing everything will we be able to view\
    \ the \n\nwebsite's content.\n\nHow it works\n\n42"
  merge: -1
  pgno: 48
- img_proc: true
  md: "The React way\n\nThis is where React comes in. It improved the development\
    \ lifecycle by \n\nintroducing components, virtual DOM concepts, and the client-server\
    \ \n\nmechanism.\n\nWhen you access a React website, the client's browser sends\
    \ a request \n\nto the server for the webpage content. In response, the server\
    \ sends a \n\nminimal HTML file, which serves as the entry point for the entire\
    \ \n\napplication, along with a bundled JavaScript file.\n\nReact initiates client-side\
    \ rendering using this JavaScript file, \n\nmanipulating the virtual DOM. Instead\
    \ of directly modifying the actual \n\nDOM, React updates the virtual DOM and\
    \ then applies only the \n\nnecessary changes to the real DOM, resulting in the\
    \ desired page \n\ndisplay.\n\nReact utilizes its client-side routing library,\
    \ React Router, to navigate to \n\ndifferent pages within the React application.\
    \ This library enables \n\nchanging the route without a full server request, preventing\
    \ page \n\nrefreshes.\n\nReact Router re-renders the relevant components based\
    \ on the new \n\nURL when a new route is triggered. If the new page requires fetching\
    \ \n\ndata from the server, the corresponding components initiate requests \n\n\
    to retrieve the necessary data.\n\nHow it works\n\n43"
  merge: -1
  pgno: 49
- img_proc: true
  md: "What’s the catch?\n\nComplexity\n\nBuilding a React application can present\
    \ greater complexity than \n\ntraditional HTML, CSS, and JavaScript websites.\
    \ It involves thinking in \n\ncomponents, managing state and props, and working\
    \ with the virtual \n\nDOM, which may require a learning curve for developers\
    \ new to React.js.\n\nProcessing\n\nSimilar to the traditional approach, react\
    \ primarily performs client-side \n\nrendering. It heavily relies on JavaScript\
    \ for initial rendering and \n\nsubsequent requests to update the user interface,\
    \ which are all handled \n\non the client’s browser.\n\nHowever, this reliance\
    \ on client-side rendering can delay rendering and \n\ninteractivity, particularly\
    \ on devices with slower processors and limited \n\nresources.\n\nSEO\n\nYes,\
    \ if you recall, we previously touched upon a notable drawback of \n\nReact compared\
    \ to Next.js in the Introduction chapter.\n\nThe issue is that search engine crawlers\
    \ might need help fully \n\naccessing the website's content since everything is\
    \ handled through \n\nJavaScript and only rendered on the client side. As a result,\
    \ it impacts \n\nthe website’s visibility in search engine results\n\nHow it works\n\
    \n44"
  merge: -1
  pgno: 50
- img_proc: true
  md: "![](img/76188a8f748fc585400eeef7e6351b2a_51_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_3.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_5.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_6.png)\n\
    \nThe Next.js Way - A blend of both\n\nKnowing the benefits and limitations of\
    \ both techniques, Vercel \n\ndevelopers allowed us to choose where to render\
    \ the content, on the \n\nclient or server.\n\nTypically, when a user visits a\
    \ Next.js site, the client sends the request to \n\nthe server, which starts executing\
    \ the React Components, generates \n\nHTML, CSS, and JavaScript files, and sends\
    \ back the fully rendered HTML \n\nto the client as a response. This file includes\
    \ initial content, fetched \n\ndata, and React component markup, making the client\
    \ render it \n\nimmediately without waiting for JavaScript to download and execute.\n\
    \nBut it doesn’t mean we don’t receive any JavaScript files. The server will \n\
    \nstill send the JavaScript code as needed for the user interaction. From \n\n\
    here, Next.js takes over and performs client-side hydration\n\nHave you ever encountered\
    \ the issue of a hydration error where the \n\nuser interface doesn't match what\
    \ was originally rendered on the \n\nserver?\n\nWell, this is what it is about.\
    \ Hydration is attaching JavaScript event \n\nhandlers and interactivity to the\
    \ pre-rendered HTML. And when the \n\nplaceholders of React components i.e., div,\
    \ form, span, don’t match \n\nwhat’s being rendered on the client side, you see\
    \ that error.\n\nThis is what it is — The hot topic of web development i.e., SSR.\
    \ \L\n\nServer Side Rendering!\n\nHow it works\n\n45"
  merge: -1
  pgno: 51
- img_proc: true
  md: "For subsequent requests, you have full control over where to render \n\nyour\
    \ page content i.e., either on the server side (SSR) or the client side \n\n(CSR).\n\
    \nIn the following chapters, we’ll talk in-depth about different types of \n\n\
    server-side rendering along with client-side rendering and when and \n\nwhere\
    \ to render what.\n\nHow it works\n\n46"
  merge: -1
  pgno: 52
- img_proc: true
  md: "Chapter 5\n\nCreate a Next.js \n\nApplication\n\nIn this chapter, you will\
    \ learn how to create a Next.js application. You'll \n\nstart by setting up the\
    \ necessary tools like Node.js and Visual Studio \n\nCode. Then, you'll create\
    \ a new Next.js project using the create-next-\n\napp command. \n\nYou'll explore\
    \ the project structure and understand the purpose of \n\nimportant files and\
    \ folders. Finally, you'll learn about the jsconfig.json \n\nand package-lock.json\
    \ files and their significance in managing \n\ndependencies."
  merge: -1
  pgno: 53
- img_proc: true
  md: "Create a Next.js Application\n\nBy now, you should fully understand how the\
    \ websites load. Now it’s \n\ntime to learn how to create websites using Next.js.\n\
    \nSetting up a Next.js application can be done in various ways. However, \n\n\
    before we dive into that, there are a few things we need to have in place \n\n\
    to get started with Next.js. The first requirement is having Node.js 16.8 or \n\
    \na more recent version. It's worth noting that there is a common \n\nmisconception\
    \ that Node.js is a new programming language.\n\nIn reality, it’s a JavaScript\
    \ runtime that enables the execution of \n\nJavaScript code outside of a web browser.\n\
    \nIf you haven't installed Node.js before, you can visit this link and start \n\
    \ndownloading it. The website will give you two options based on your \n\noperating\
    \ system: LTS and Current. The LTS (Long Term Support) version \n\nis the most\
    \ stable, while the Current version is like a \"Work in Progress\" \n\nthat adds\
    \ new features but may have some bugs.\n\nSo, did you download it?\n\nTo determine\
    \ the version you're using and check if you've downloaded \n\nNode.js, you can\
    \ execute this command in your terminal or Command \n\nPrompt to verify:\n\nnode\
    \ - v\n\nCreate a Next.js Application\n\n47"
  merge: -1
  pgno: 54
- img_proc: true
  md: "node -v\n\n18.16.1\n\nNext, we require a Code Editor. Considering that Visual\
    \ Studio Code \n\n(VSCode) is an exceptional editor, we suggest using it. You\
    \ can visit \n\n \n\nlink, and depending on your operating system (OS), you will\
    \ find the \n\nappropriate download link. The download process and installation\
    \ \n\nprocess is as straightforward as it gets.\n\nthis\n\n![](img/76188a8f748fc585400eeef7e6351b2a_55_0.png)\n\
    \nCreate a Next.js Application\n\n48"
  merge: -1
  pgno: 55
- img_proc: true
  md: "After downloading Node.js and VSCode, let's set up your first Next.js \n\n\
    application.\n\nGo to the desired location where you want to create your project.\
    \ It can \n\nbe any location, but it's advisable to maintain an organized structure.\
    \ \n\nCreate a new folder inside that location and name it \"NextEbook.\" If you\
    \ \n\nprefer a different name, feel free to choose one. This folder will hold\
    \ all \n\nthe code we will cover in this ebook.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_56_0.png)\n\
    \nNow, let's proceed with the following steps to open the folder we just \n\n\
    created in our chosen code editor, which is VSCode:\n\n\x83} Launch VSCode}\n\n\
    c} Click on the \"File\" option in the top menu bar}\n\nb} From the dropdown menu,\
    \ choose \"Open Folder.f\n\n\\_} Browse to the location where you created the\
    \ \"NextEbook\" folder}\n\ne} Select the \"NextEbook\" folder}\n\nZ} Click on\
    \ the \"Open\" button.\n\nCreate a Next.js Application\n\n49"
