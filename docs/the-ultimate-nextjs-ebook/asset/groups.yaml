  - "[PAGE 49]\n\nThe React way\n\nThis is where React comes in. It improved the development\
    \ lifecycle by \n\nintroducing components, virtual DOM concepts, and the client-server\
    \ \n\nmechanism.\n\nWhen you access a React website, the client's browser sends\
    \ a request \n\nto the server for the webpage content. In response, the server\
    \ sends a \n\nminimal HTML file, which serves as the entry point for the entire\
    \ \n\napplication, along with a bundled JavaScript file.\n\nReact initiates client-side\
    \ rendering using this JavaScript file, \n\nmanipulating the virtual DOM. Instead\
    \ of directly modifying the actual \n\nDOM, React updates the virtual DOM and\
    \ then applies only the \n\nnecessary changes to the real DOM, resulting in the\
    \ desired page \n\ndisplay.\n\nReact utilizes its client-side routing library,\
    \ React Router, to navigate to \n\ndifferent pages within the React application.\
    \ This library enables \n\nchanging the route without a full server request, preventing\
    \ page \n\nrefreshes.\n\nReact Router re-renders the relevant components based\
    \ on the new \n\nURL when a new route is triggered. If the new page requires fetching\
    \ \n\ndata from the server, the corresponding components initiate requests \n\n\
    to retrieve the necessary data.\n\nHow it works\n\n43"
  - "[PAGE 50]\n\nWhat’s the catch?\n\nComplexity\n\nBuilding a React application\
    \ can present greater complexity than \n\ntraditional HTML, CSS, and JavaScript\
