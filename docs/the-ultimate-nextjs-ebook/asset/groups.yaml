  - "[PAGE 75]\n\nChapter 6\n\nClient Vs. Server\n\nIn this chapter, you'll dive into\
    \ the concepts of client-side rendering \n\n(CSR) and server-side rendering (SSR)\
    \ in Next.js. You'll explore how \n\nNext.js handles rendering on the client and\
    \ server, understand the \n\nbenefits and trade-offs of each approach, and learn\
    \ how to implement \n\nCSR and SSR in your Next.js applications."
  - "[PAGE 76]\n\nClient Vs. Server\n\nSo far, we understand that Next.js does a mix\
    \ of server-side and client-\n\nside rendering to get the best of both worlds.\
    \ But we need to find out \n\nwhich parts of the application are rendered on the\
    \ server side. Can we \n\nchoose what to render in each environment? \n\nAnd if\
    \ so, how can we do that?\n\nBefore we answer these questions, let's go back and\
    \ remind ourselves \n\nwhat we mean by client and server. What do these terms\
    \ actually \n\nmean?\n\nClient\n\nThe client refers to the device you are currently\
    \ using, such as your \n\nsmartphone or computer. The device sends requests to\
    \ the server and \n\ndisplays the interface that we can interact with.\n\nServer\n\
    \nThe server is essentially just a computer device, but it is equipped with \n\
    \nstrong configurations and remains operational continuously. It is where \n\n\
    all the code for our application is stored. When the client, our device, \n\n\
    sends a request, the server performs the necessary computations and \n\nsends\
    \ back the required outcome.\n\nIn previous versions of Next.js, specifically\
    \ versions before 13, we faced a \n\nlimitation where server-side rendering was\
    \ restricted to individual \n\npages. This meant that only the route pages like\
    \ \"/\", \"/about\", \"/projects\", \n\nand so on could be rendered on the server\
    \ side. \n\nClient Vs. Server\n\n68"
  - "[PAGE 77]\n\nThis limitation led to challenges such as prop drilling and duplication\
    \ of \n\nAPI calls when passing data to lower-level components.\n\nI recommend\
    \ reading this article to gain a deeper understanding of the \n\ndifferences between\
    \ the pages directory and the app directory in Next.js \n\nand how they address\
    \ these limitations. It provides detailed insights \n\ninto the topic:\n\nLess\
    \ code, better UX: \n\nFetching data faster with \n\nthe Next.js 13 App Router\n\
    \nLink to blog\n\n![](img/76188a8f748fc585400eeef7e6351b2a_77_0.png)\n\nAnd that,\
    \ my friends, is where the app directory comes into action. It not \n\nonly introduced\
    \ many features but also brought about a revolutionary \n\nchange, i.e., — Component\
    \ level Server Side Rendering.\n\nWhat does that mean?\n\nIt means that now we\
    \ have the ability to choose where we want to \n\nrender specific components or\
    \ a section of code.\n\nFor instance, let's consider a component called Navbar.jsx.\
    \ With this \n\nnew capability, we can decide whether we want to render it on\
    \ the \n\nserver side or the client side (in the user's browser).\n\nAnd that's\
    \ how we end up with two types of components: Client \n\nComponents and Server\
    \ Components.\n\nClient Vs. Server\n\n69"
  - "[PAGE 78]\n\nWhat are these?\n\nSimply put, both are React components, but the\
    \ difference lies in where \n\nthey are rendered.\n\nClient Component - A react\
    \ component that runs/renders on the user’s \n\ndevice, such as a web browser\
    \ or mobile app.\n\nServer Component - A react component that runs/renders on\
    \ the \n\nserver, i.e., the infra or place where we’ll deploy our application\n\
    \nBut why would we want to render such a small component on the \n\nserver side?\n\
    \nWell, think about it!\n\nBy strategically deciding to render certain components\
    \ on the server \n\nside, we save users' browsers from doing extra work with JavaScript\
    \ to \n\nshow those components. Instead, we get the initial HTML code for those\
    \ \n\ncomponents, which the browser can display immediately. This reduces \n\n\
    the size of the JavaScript bundle, making the initial page load faster.\n\nAnd\
    \ as discussed above, we’ll overcome our limitations with the pages \n\ndirectory.\
    \ Rather than fetching and passing data to components \n\nseparately, we can fetch\
    \ the data directly within the component, \n\nturning it into a server component.\n\
    \nOverall, we’ll have these benefits if we choose to do server-side \n\nrendering:\n\
    \nSmaller JavaScript bundle size: The size of the JavaScript code that \n\nneeds\
    \ to be downloaded by the browser is reduced.\n\nClient Vs. Server\n\n70"
  - "[PAGE 79]\n\nEnhanced SEO (Search Engine Optimization: Server-side rendering\
    \ \n\nhelps improve search engine visibility and indexing of your website's \n\
    \ncontent. (remember?)\n\nFaster initial page load for better accessibility and\
    \ user experience: \n\nUsers can see the content more quickly, leading to a smoother\
    \ \n\nbrowsing experience.\n\nEfficient utilization of server resources: By fetching\
    \ data closer to the \n\nserver, the time required to retrieve data is reduced,\
    \ resulting in \n\nimproved performance.\n\nOkay, but when to decide what to render\
    \ where?\n\nAs their name suggests, where to render each component depends on\
    \ \n\nwhat the component does.\n\nIf a component needs the user to interact with\
    \ it, such as clicking \n\nbuttons, entering information in input fields, triggering\
    \ events, or using \n\nreact hooks, then it should be a client component. These\
    \ interactions \n\nrely on the capabilities of the user's web browser, so they\
    \ need to be \n\nrendered on the client side.\n\nOn the other hand, if a component\
    \ doesn't require any user interaction \n\nor involves tasks like fetching data\
    \ from a server, displaying static \n\ncontent, or performing server-side computations,\
    \ it can be a server \n\ncomponent. These components can be rendered on the server\
    \ without \n\nspecific browser features.\n\nClient Vs. Server\n\n71"
- md: "\nAsk yourself:\n\nDoes the component require user interactivity?\n\nYes —\
    \ Client Component\n\nNo — Server Component\n\nTo simplify things, the Next.js\
    \ documentation provides a helpful table that guides you on where to render each\
    \ component.\n\nWhat do you need to do?\n\n| Server Component | Client Component\
    \ |\n| :--- | :--- |\n| Fetch data. | Add interactivity and event listeners (onClick(),\
    \ onChange(), etc) |\n| Access backend resources (directly) | Use State and Lifecycle\
    \ Effects (useState(), useReducer(), useEffect(), etc) |\n| Keep sensitive information\
    \ on the server (access tokens, API keys, etc) | Use browser-only APIs |\n| Keep\
    \ large dependencies on the server / Reduce client-side JavaScript | Use custom\
    \ hooks that depend on state, effects, or browser-only APIs |\n| | Use React Class\
    \ components |\n\n![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)\n\
    \nClient Vs. Server\n\nImpressive! You've just discovered one of the most significant\
    \ features of the modern era. Take a well-deserved break!\n\nReady for more?\n\
    \nAnother groundbreaking aspect of Next.js 13's app directory is that all components\
    \ are automatically considered server components by default. That's right; every\
    \ component is treated as a server component unless specified otherwise.\n\nSo\
    \ how do we differentiate it from the client components?\n\nWell, it's as simple\
    \ as writing \"use client\" at the top of the component file. It's a straightforward\
    \ and slick way to indicate that the component should be treated as a client component.\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_81_0.png)\n\nThat's enough theory for\
    \ now. Let's dive into coding. To get started, follow the steps outlined in the\
    \ previous section to quickly set up a new Next.js project within the same NextEbook\
    \ folder.\n\nBefore proceeding, ensure that the terminal's path points to the\
    \ NextEbook folder and not the previously created introduction folder. To navigate\
    \ out of the introduction folder, you can run the following command:\n\n`cd ..`\n\
    \nNow, execute the create-next-app command. In this example, I'll be using the\
    \ name client-server for the new folder, but feel free to choose any name you\
    \ prefer.\n\nClient Vs. Server\n\nOnce the installation is complete, use the cd\
    \ command to navigate into the client-server folder and start the application.\
    \ Now go to app folder, then to page.js file, and delete all other except for\
    \ the main and h2 tags:\n\napp/page.js\n```javascript\nimport styles from './page.module'\n\
    \nexport default function Home() {\n  return (\n    <main className={styles.main}>\n\
    \      <h2>Welcome</h2>\n      <h2>Where do I render?</h2>\n    </main>\n  )\n\
    }\n```\napp/page.module.css\n```css\n/* styles here */\n```\n![](img/76188a8f748fc585400eeef7e6351b2a_82_0.png)\n\
    \nIf you prefer, you can delete everything from page.module.css file and keep\
    \ the styles only for the main tag:\n\napp/page.module.css\n```css\n.main {\n\
    \  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding:\
    \ 6rem;\n  min-height: 100vh;\n}\n```\n\nAfter adding a console log in our page.js\
    \ file, let's open our browser to see if it appears there:\n\nClient Vs. Server\n\
    \nOnce the installation is complete, use the cd command to navigate into the client-server\
    \ folder and start the application.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_83_0.png)\n\
    Create Next App\nhttp://localhost:3000\n\n![](img/76188a8f748fc585400eeef7e6351b2a_83_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_83_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_83_3.png)\n\
    \nHmm, “Where do I render?” is not there. How on Earth? Indeed, you are correct.\
    \ As previously discussed, all these components will be Server Components by default!\n\
    \nSo where do we see console statements if not in the browser? You know that,\
    \ right? The terminal! Let's return to our terminal and check if the mentioned\
    \ log text is present there:\n\nClient Vs. Server\n\nTerminal\n```bash\nnpm run\
    \ dev\n- next dev\n- wait compiling /page (client and server)...\n- event client\
    \ and server successfully in 390 ms (413 modules)\n```\nWhere do I render?\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_84_0.png)\n\nAnd there we go, the log\
    \ is there. Now let’s create two components for each Client and Server. Inside\
    \ the root of the folder, i.e., outside of the app folder, create a new folder\
    \ and name it components. Create two new files inside it, ExampleClient.jsx and\
    \ ExampleServer.jsx.\n\ncomponents/ExampleClient.jsx\n```javascript\n\"use client\"\
    \nexport default function ExampleClient() {\n  console.log(\"I'm Client Component\
    \ :)\")\n  return (\n    <div>\n      <p>This example client component</p>\n \
    \   </div>\n  )\n}\n```\nClient Vs. Server\n\nAnd the small ExampleServer component\
    \ as:\n\ncomponents/ExampleServer.jsx\n```javascript\nexport default function\
    \ ExampleServer() {\n  console.log(\"I'm Server Component :)\")\n  return (\n\
    \    <div>\n      <p>This an example server component</p>\n    </div>\n  )\n}\n\
    ```\n\nNow, first import & use the ExampleClient component inside the app/page.js\
    \ file:\n\napp/page.js\n```javascript\nimport styles from './page.module'\nimport\
    \ ExampleClient from '../components/ExampleClient'\n\nexport default function\
    \ Home() {\n  return (\n    <main className={styles.main}>\n      <h2>Welcome</h2>\n\
    \      <ExampleClient />\n    </main>\n  )\n}\n```\n![](img/76188a8f748fc585400eeef7e6351b2a_85_0.png)\n\
    \nPerfect. Let’s check where we see console log first browser,\n\n![](img/76188a8f748fc585400eeef7e6351b2a_86_0.png)\n\
    Create Next App\nhttp://localhost:3000\n\n![](img/76188a8f748fc585400eeef7e6351b2a_86_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_86_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_86_2.png)\n\
    \nOkay, that’s right, right? We explicitly said Next.js to render ExampleClient.jsx\
    \ as Client Component. Fair enough!\n\nBoth of them, why? This is because Next.js\
    \ performs pre-rendering certain content before sending it back to the client.\
    \ So basically, two things happen:\n\n- Server Components are guaranteed to be\
    \ only rendered on the server\n- On the other hand, client components are primarily\
    \ rendered on the client side.\n\nHowever, Next.js also pre-renders them on the\
    \ server to ensure a smooth user experience and improve search engine optimization\
    \ (SEO).\n\nNext.js, by default, performs static rendering, which means it pre-renders\
    \ the necessary content on the server before sending it to the client. This pre-rendering\
    \ process includes server and client components that can be pre-rendered without\
    \ compromising functionality.\n\nThe server Component is the latest React.js Feature.\
    \ Next.js has simply used it over what they had, making the setup easy.\n\nLet’s\
    \ play around with these components a little more. Now, import the ExampleServer\
    \ component inside the app/page.js file:\n"
  mdcn: "\n\n问自己：\n\n该组件需要用户交互吗？\n\n是 — 客户端组件 (Client Component)\n\n否 — 服务器组件 (Server\
    \ Component)\n\n为了简化问题，Next.js 文档提供了一个非常有用的表格，指导你在哪里渲染每个组件。\n\n你需要做什么？\n\n| 服务器组件\
    \ (Server Component) | 客户端组件 (Client Component) |\n| :--- | :--- |\n| 获取数据。 |\
    \ 添加交互和事件监听 (onClick(), onChange(), 等) |\n| 访问后端资源（直接） | 使用状态和生命周期副作用 (useState(),\
