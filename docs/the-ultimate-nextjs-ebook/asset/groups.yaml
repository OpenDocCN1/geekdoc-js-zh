  - "[PAGE 87]\n\nBoth of them, why?\n\nThis is because Next.js performs pre-rendering\
    \ certain content before \n\nsending it back to the client.\n\nSo basically, two\
    \ things happen:\n\nP Server Components are guaranteed to be only rendered on\
    \ the \n\nserveL\n\nP On the other hand, client components are primarily rendered\
    \ on the \n\nclient side.\n\nHowever, Next.js also pre-renders them on the server\
    \ to ensure a \n\nsmooth user experience and improve search engine optimization\
    \ (SEO).\n\nNext.js, by default, performs static rendering, which means it pre-\n\
    \nrenders the necessary content on the server before sending it to the \n\nclient.\
    \ This pre-rendering process includes server and client \n\ncomponents that can\
    \ be pre-rendered without compromising \n\nfunctionality.\n\nThe server Component\
    \ is the latest React.js Feature. Next.js has \n\nsimply used it over what they\
    \ had, making the setup easy.\n\nLet’s play around with these components a little\
    \ more. Now, import the \n\nExampleServer component inside the app/page.js file\n\
    \nClient Vs. Server\n\n79"
- md: "\napp/page.js\n\n![](img/76188a8f748fc585400eeef7e6351b2a_88_0.png)\n\n```javascript\n\
    import React from 'react';\nimport ExampleClient from '@/components/ExampleClient';\n\
    import ExampleServer from '@/components/ExampleServer';\nimport styles from './page.module.css';\n\
    \nexport default function Home() {\n  console.log(\"Where do I render?\");\n\n\
    \  return (\n    <main className={styles.main}>\n      <h2>Welcome</h2>\n    \
    \  <ExampleClient />\n      <ExampleServer />\n    </main>\n  );\n}\n```\n\n##\
    \ Where do I render?\n\nconsole.log(\"Where do I render?\");\n\n- ExampleClient\n\
    - ExampleServer\n\nAnd now, if we visit the browser, along with showing both client-server\
    \ \ncomponent text on the website, it’ll only show the “I'm Client Component \n\
    :)” log inside the browser’s console:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_88_1.png)\n\
    \nCreate Next App\nhttp://localhost:3000\n\n![](img/76188a8f748fc585400eeef7e6351b2a_88_2.png)[](img/76188a8f748fc585400eeef7e6351b2a_88_2.png)\n\
    \n## Client Vs. Server\n80\n\nWhereas the terminal will show all the three console\
    \ logs:\n\nTerminal\nnpm run dev\n- next dev\n- wait compiling /page (client and\
    \ server)...\n- event compiled client and server successfully in 588 ms (548 modules)\n\
    \nWhere do I render?\n- I'm Server Component :)\n- I'm Client Component :)\n\n\
    All good!\n\nFor the final play, let’s remove the ExampleServer from app/page.js\
    \ \nand add it inside the components/ExampleClient.js.\n\napp/page.js\n\n![](img/76188a8f748fc585400eeef7e6351b2a_89_0.png)\n\
    \n```javascript\nimport React from 'react';\nimport ExampleClient from '@/components/ExampleClient';\n\
    import styles from './page.module.css';\n\nexport default function Home() {\n\
    \  console.log(\"Where do I render?\");\n\n  return (\n    <main className={styles.main}>\n\
    \      <h2>Welcome</h2>\n      <ExampleClient />\n    </main>\n  );\n}\n```\n\n\
    Where do I render?\n- ExampleClient\n\n## Client Vs. Server\n81\n\nAnd the ExampleClient\
    \ will look like this:\n\ncomponents/ExampleClient.jsx\n\n```javascript\n\"use\
    \ client\";\nimport React from \"react\";\nimport ExampleServer from \"./ExampleServer\"\
    ;\n\nconst ExampleClient = () => {\n  console.log(\"Where do I render?\");\n\n\
    \  return (\n    <>\n      <h2>ExampleClient</h2>\n      <ExampleServer />\n \
    \   </>\n  );\n};\n\nexport default ExampleClient;\n```\n\nThis is an example\
    \ client component.\n\n- ExampleClient\nconst ExampleServer = () => (\n  <div>\n\
    \    <p>I'm Server Component :)</p>\n  </div>\n);\nconsole.log(\"ExampleServer\"\
    );\n\nHit save and see the result in both the Terminal and Browser console.\n\n\
    First, let’s see what the terminal shows:\n\nTerminal\nnpm run dev\n- next dev\n\
    - wait compiling /page (client and server)...\n- event compiled client and server\
    \ successfully in 429 ms (549 modules)\n\nWhere do I render?\n- I'm Client Component\
    \ :)\n- I'm Server Component :)\n\n## Client Vs. Server\n82\n\nAs expected, we\
    \ see all three console logs due to the pre-rendering of \nNext.js and the server\
    \ feature.\n\nBut something doesn’t look good in the Browser console…\n\n![](img/76188a8f748fc585400eeef7e6351b2a_91_0.png)\n\
    \nCreate Next App\nhttp://localhost:3000\n\n![](img/76188a8f748fc585400eeef7e6351b2a_91_1.png)[](img/76188a8f748fc585400eeef7e6351b2a_91_1.png)[](img/76188a8f748fc585400eeef7e6351b2a_91_1.png)\n\
    \nWhy is the server component log appearing here? Wasn’t it supposed \nto be on\
    \ the server side only?\n\nWell, in Next.js, there is a pattern at play. When\
    \ we use \"use client\" in a \nfile, all the other modules imported into that\
    \ file, including child server \ncomponents, are treated as part of the client\
    \ module.\n\nConsider \"use client\" as a dividing line between the server and\
    \ client \ncode. Once you set this boundary, everything inside it becomes client\
    \ \ncode.\n\nUnderstood? If not, there is no need to worry.\n\n## Client Vs. Server\n\
    83\n\nJust remember: Do not include server components inside the client \ncomponents.\n\
    \nAnd in case you encounter such a scenario, we have a solution. We'll \ndiscuss\
    \ it in detail in its dedicated section, where we'll dive into the \nrendering\
    \ process of client and server components. Additionally, we will \nshare some\
    \ valuable tips and tricks on creating different types of \ncomponents depending\
    \ on real-world examples.\n\nBefore we dive into yet another feature of Next.js,\
    \ take some time out to \nwork on the below tasks to solidify your learning:\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_92_0.png)\n\n## Tasks\n![](img/76188a8f748fc585400eeef7e6351b2a_92_1.png)\n\
    \nAdd “use client” inside the app/page.js and see where the \nconsole logs are\
    \ appearing:\n\napp/page.js\n\n![](img/76188a8f748fc585400eeef7e6351b2a_92_2.png)\n\
    \n```javascript\n\"use client\";\nimport React from 'react';\nimport ExampleClient\
    \ from '@/components/ExampleClient';\nimport styles from './page.module.css';\n\
    \nexport default function Home() {\n  console.log(\"Where do I render?\");\n\n\
    \  return (\n    <main className={styles.main}>\n      <h2>Welcome</h2>\n    \
    \  <ExampleClient />\n    </main>\n  );\n}\n```\n\nWhere do I render?\n- ExampleClient\n\
    \n## Client Vs. Server\n84\n\n![](img/76188a8f748fc585400eeef7e6351b2a_93_0.png)\n\
    \n- What are the latest features of the app directory regarding the \nclient/server\
    \ rendering?\n\n![](img/76188a8f748fc585400eeef7e6351b2a_93_0.png)\n\n- What are\
    \ the different types of components in Next.js, and explain their difference?\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_93_0.png)\n\n- What are the benefits\
    \ of server-side rendering?\n\n## Client Vs. Server\n85\n\n![](img/76188a8f748fc585400eeef7e6351b2a_94_0.png)\n\
    \nIs this the END? Absolutely not!\n\nWe have an abundance of additional chapters\
    \ awaiting you. Starting \nfrom routing, rendering, data fetching, backend API\
    \ routes, database, \ntypescript, and even extending to testing, best practices,\
    \ and Next.js tips \nand tricks. The ebook covers it all.\n\nWe labeled it a \"\
    must-have\" book for a reason \nWe're just scratching the surface. Stay tuned\
    \ for the next update as we \nrelease more chapters that unlock the full potential\
    \ of Next.js 13.\n\nGive yourself a pat on the back for completing all the chapters\
    \ thus far. \nWe would greatly appreciate hearing your suggestions or feedback.\
    \ \n\nFeel free to provide your honest input through this \n.link\n\nWith your\
    \ feedback and collaboration, we will bring you the best version \nof Next.js\
    \ in the coming weeks. Thank you!\n\n## Client Vs. Server\n86\n"
