  - "[PAGE 63]\n\npage.js\n\nIt’s an alias of the home route i.e., “/”. It's important\
    \ not to confuse this \n\nfile with layout.js. Whatever you write inside page.js\
    \ will be displayed \n\nonly on the \"/\" route, while anything inside layout.js\
    \ will appear across all \n\nroutes, including the home route i.e., “/”.\n\nIn\
    \ short, layout.js is the parent of page.js, providing a common layout for \n\n\
    all pages.\n\npage.module.css\n\nThis CSS file is specifically designed to style\
    \ a particular page \n\ncomponent or module. The naming convention .module.css\
    \ indicates \n\nthat the CSS rules in this file are scoped to a specific component.\
    \ In this \n\ncase, it corresponds to the page.js component.\n\nIf you closely\
    \ examine the code, you will notice the presence of the \n\nfollowing:\n\nimport\n\
    \nfrom '\n\n styles \n\n ./page.module.css\\`\n\ninside the page.js file.\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_63_0.png)\n\nNode Modules\n\nWell, it’s\
    \ the backbone!\n\nThe node\\_modules directory is a storage location for all\
    \ the \n\ndependencies or packages required to run a project. Whenever we \n\n\
    install packages using npm, the corresponding code for those \n\npackages is placed\
    \ inside this directory.\n\nCreate a Next.js Application\n\n56"
  - "[PAGE 64]\n\nFor example, if we install Axios, a folder named axios will be created\
    \ \n\nwithin the node\\_modules folder. If you've been following closely, you\
    \ \n\nmay have noticed that Next.js is built on top of React. Therefore, you can\
    \ \n\nexplore the node\\_modules folder to find the react folder, which contains\
    \ \n\nthe code for React itself.\n\nIn addition to React, you'll come across several\
    \ other folders such as \n\nnext (which enables Next.js-specific features), react-dom,\
    \ postcss, \n\nstyled-jsx, and more. Each of these folders contains numerous files\
    \ \n\nand lines of code essential for running our Next.js application.\n\nNo need\
    \ to worry, though. You don't have to interact with or visit this \n\ndirectory\
    \ in the future (unless something terrible happens). npm \n\nautomatically manages\
    \ the node\\_modules folder when we install or \n\nuninstall node packages.\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_64_0.png)\n\nPublic\n\nIt’s a special\
    \ folder allowing us to include static assets like images or \n\nfiles like fonts,\
    \ videos, etc.\n\nThe content inside this folder is automatically optimized and\
    \ available \n\nthroughout the application. Thus it’s advisable to put any PNGs,\
    \ JPEGs, \n\nor SVGs we need inside this folder.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_64_1.png)\n\
    \n.gitignore\n\nThe .gitignore is a special text file that tells Git, the version\
    \ control \n\nsystem, to exclude certain files and directories from being tracked.\n\
    \nOne common entry in the .gitignore file is node\\_modules.\n\nCreate a Next.js\
    \ Application\n\n57"
- md: "\nThis is because the node_modules directory contains many files and folders\
    \ generated when installing dependencies for a Node.js project. Including these\
    \ files in version control would create unnecessary clutter and increase the size\
    \ of the repository.\n\nAs said by the Creator of Node.js — Ryan Dahl\n\n![](img/76188a8f748fc585400eeef7e6351b2a_65_0.png)\n\
    \nWe would certainly not want to track the “Heaviest Object” in the universe!\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_65_1.png)\n\n## jsconfig.json\n\nRemember\
    \ the prompt that appeared when we ran the Next.js CLI tool? It asked us if we\
    \ wanted to customize the default import alias, and we chose \"No\".\n\nCreate\
    \ a Next.js Application\n\n√ Would you like to customize the default import alias?\
    \ No\n\nWell, the jsconfig.json file is related to that question. It acts as a\
    \ configuration file where we can set various options and settings for our project.\
    \ One of the things we can configure is the import behavior.\n\nBy default, when\
    \ we want to import code from one file into another, we use relative paths like\
    \ this:\n\n```javascript\nimport { something } from '../../components'\n```\n\n\
    This is the correct, but sometimes long and complex, relative path. In larger\
    \ projects or projects with complex directory structures, manually specifying\
    \ relative paths for each import can become tedious and prone to errors.\n\nHowever,\
    \ by configuring the `compilerOptions` in the jsconfig.json file, we can inform\
    \ the compiler about a specific import path structure that we want to use.\n\n\
    If we take a look at the content of the jsconfig.json file, we have:\n\n```json\n\
    {\n  \"compilerOptions\": {\n    \"paths\": {\n      \"@/*\": [\"./*\"]\n    }\n\
    \  }\n}\n```\n\nCreate a Next.js Application\n\nIn this configuration, we have\
    \ defined path aliases using `baseUrl`. This means that now we can do the following:\n\
    \n```javascript\nimport { something } from '@/components'\n```\n\ni.e., using\
    \ `@/*` for any files and folders located in this location `./*` i.e., the root!\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_67_0.png)\n\nFeel free to customize\
    \ the alias to your preference. You can change `@/*` to `@/*` or even `#/*` —\
    \ the choice is yours!\n\n![](img/76188a8f748fc585400eeef7e6351b2a_67_1.png)\n\
    \n## package-lock.json\n\nHave you ever think of this as an unwanted file? Well,\
    \ let me tell you, it's actually quite important. This file, called package-lock.json,\
    \ is automatically created when we install or make changes to packages. It serves\
    \ as a lock file, carefully keeping track of the specific versions of all the\
    \ installed packages and their dependencies.\n\nLet's imagine a scenario: You're\
    \ working on a Next.js project. After completing your work, you share the project\
    \ code with your manager, but you omit the package-lock.json file, thinking it's\
    \ not essential.\n\nNow, your manager starts downloading the packages listed in\
    \ the package.json file. The package manager, npm, installs the specified packages\
    \ and their dependencies (i.e., the folder and files we have seen inside the node_modules\
    \ folder).\n\nCreate a Next.js Application\n\nHowever, if any dependencies release\
    \ a new version, the package manager will eagerly download it. And unfortunately,\
    \ if this new version may contain unresolved bugs or compatibility issues, it\
    \ can cause your application to misbehave.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_0.png)[](img/76188a8f748fc585400eeef7e6351b2a_68_1.png)\n\
    \nAs a result, your manager may become frustrated, saying, \"It doesn't work on\
    \ my machine,\" while you feel helpless, responding with a disheartened \"It works\
    \ on my machine.\"\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_2.png)\n\nKnow\
    \ the importance and always share your package-lock.json file\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_3.png)\n\
    \n## package.json\n\nThink of this as an info card that tells about you — who\
    \ you are, where you are from, etc. but with more complete details. Along with\
    \ containing the information regarding the name of the project, and its version,\
    \ it tells us the dependencies and dev dependencies required to run this project.\n\
    \n- **dependencies**: List of the packages that are necessary for the project\
    \ to run the production environment.\n- **devDependencies**: List of packages\
    \ that are only needed during the development process. For example, linting packages\
    \ like eslint.\n\nWhenever we install a package, whether a dependency or a dev\
    \ dependency, npm automatically records the package name and its corresponding\
    \ version in the respective section of the package.json file.\n\nCreate a Next.js\
    \ Application\n\nThis way, the package.json file records all the packages required\
    \ for the project, making it easier to manage and reproduce the development and\
    \ production environments accurately.\n\nOther than that, we can see another part\
    \ i.e., “scripts”. It contains executable commands or scripts using npm. We can\
    \ completely customize it. Through these commands/scripts, we run tests, build\
    \ a project, start a development server, or deploy the application.\n\nLast but\
    \ not least,\n\n![](img/76188a8f748fc585400eeef7e6351b2a_69_0.png)\n\n## README.md\n\
    \nIt’s like a manual or guidebook for your project — a text file where we can\
    \ write down important information about our project, such as how to install it,\
    \ what it does, and how others can contribute to it.\n\nHaving a good README helps\
    \ people understand what our project is all about and how they can use it or get\
    \ involved. It's like giving them directions or instructions on how to make the\
    \ most of our project.\n\nNow, let's finally run our application. We need to execute\
    \ one of the commands from the \"scripts\" section we just mentioned, specifically\
    \ the \"dev\" command.\n\nBefore proceeding, ensure the terminal's path is set\
    \ to the correct location. Since we created a subfolder called \"introduction\"\
    \ inside the \"NextEbook\" folder, we need to navigate into it. To do that, enter\
    \ the following command in the open terminal:\n\n```bash\ncd introduction\n```\n\
    \nCreate a Next.js Application\n\nThe \"cd\" command, which stands for \"change\
    \ directory,\" will navigate us inside the \"introduction\" folder.\n\nNow run,\n\
    \n```bash\nnpm run dev\n```\n\nThis command will start a local machine's development\
    \ server on port 3000. To see the application in action, open your preferred browser\
    \ and type the URL: If you have followed all previous steps correctly, you should\
    \ be able to see the application running as expected: http://localhost:3000\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_70_0.png)\n\nimg/76188a8f748fc585400eeef7e6351b2a_70_1.png\n\
    \nPhew, a lot of explaining just to cover the initial file and folder structure.\
    \ But it’s no use if we don’t take any actions. Let’s change few things from the\
    \ repo to see how it works.\n\nCreate a Next.js Application\n\n## page.js\n\n\
    Open the page.js file and delete all the existing code. We'll start fresh by creating\
    \ the Home component.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_71_0.png)\n\n\
    ```javascript\nexport default function Home() {\n  return (\n    <>\n      Hello\
    \ World\n    </>\n  )\n}\n```\n\nAfter making the changes, save the file and return\
    \ to your browser. If you visit the localhost again, you should see the updated\
    \ content of \"Hello World\" without manually refreshing the page. This is possible\
    \ because of the Fast Refresh feature of Next.js, which automatically reflects\
    \ the changes in real time as we edit the code.\n\n## layout.js\n\nNow, open the\
    \ layout.js file and add text inside the body tag:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_71_1.png)\n\
    \n```javascript\nimport './globals.css';\nimport { Inter } from 'next/font/google';\n\
    \nconst inter = Inter({ subsets: ['latin'] });\n\nexport const metadata = {\n\
    \  title: 'Create Next App',\n  description: 'Generated by create next app',\n\
    };\n\nexport default function RootLayout({ children }) {\n  return (\n    <html\
    \ lang=\"en\">\n      <body className={inter.className}>\n        Hello, I'm Groot\n\
    \        {children}\n      </body>\n    </html>\n  );\n}\n```\n\n![](img/76188a8f748fc585400eeef7e6351b2a_71_2.png)\n"
  mdcn: "\n\n这是因为 `node_modules` 目录包含了在为 Node.js 项目安装依赖时生成的许多文件和文件夹。将这些文件包含在版本控制中会导致不必要的混乱，并增加仓库的大小。\n\
    \n正如 Node.js 的创始人 Ryan Dahl 所说：\n\n![](img/76188a8f748fc585400eeef7e6351b2a_65_0.png)\n\
    \n我们绝不想想要追踪宇宙中“最重的物体”！\n\n![](img/76188a8f748fc585400eeef7e6351b2a_65_1.png)\n\
    \n## jsconfig.json\n\n还记得我们运行 Next.js CLI 工具时出现的提示吗？它询问我们是否想要自定义默认的导入别名（import\
    \ alias），而我们选择了“No”。\n\n创建一个 Next.js 应用\n\n√ Would you like to customize the default\
    \ import alias? No\n\n嗯，`jsconfig.json` 文件与该问题有关。它是一个配置文件，我们可以在其中为项目设置各种选项和配置。我们可以配置的内容之一就是导入行为。\n\
    \n默认情况下，当我们要从一个文件导入代码到另一个文件时，我们使用如下相对路径：\n\n```javascript\nimport { something\
    \ } from '../../components'\n```\n\n这是正确的，但有时相对路径很长且复杂。在较大的项目或具有复杂目录结构的项目中，手动为每个导入指定相对路径会变得繁琐且容易出错。\n\
    \n然而，通过配置 `jsconfig.json` 文件中的 `compilerOptions`，我们可以告诉编译器我们想要使用的特定导入路径结构。\n\n\
    如果我们查看 `jsconfig.json` 文件的内容，会有：\n\n```json\n{\n  \"compilerOptions\": {\n   \
    \ \"paths\": {\n      \"@/*\": [\"./*\"]\n    }\n  }\n}\n```\n\n创建一个 Next.js 应用\n\
    \n在此配置中，我们使用 `baseUrl` 定义了路径别名。这意味着现在我们可以执行以下操作：\n\n```javascript\nimport { something\
    \ } from '@/components'\n```\n\n即：使用 `@/*` 来代表位于此位置 `./*`（即根目录！）的任何文件和文件夹！\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_67_0.png)\n\n根据你的喜好自定义别名。你可以将 `@/*` 更改为\
    \ `@/*` 甚至 `#/*` —— 选择权在于你！\n\n![](img/76188a8f748fc585400eeef7e6351b2a_67_1.png)\n\
    \n## package-lock.json\n\n你是否想过把它看作一个不需要的文件？嗯，让我告诉你，它实际上非常重要。这个名为 `package-lock.json`\
    \ 的文件在我们安装或更改包时自动创建。它作为一个锁文件，仔细地记录所有已安装包及其依赖的特定版本。\n\n想象一个场景：你正在开发一个 Next.js 项目。完成工作后，你将项目代码分享给经理，但你忽略了\
    \ `package-lock.json` 文件，认为它不是必需的。\n\n现在，你的经理开始下载 `package.json` 文件中列出的包。包管理器\
    \ npm 会安装指定的包及其依赖项（即我们在 `node_modules` 文件夹内部看到的文件夹和文件）。\n\n创建一个 Next.js 应用\n\n\
    然而，如果任何依赖项发布了新版本，包管理器会急于下载它。不幸的是，如果这个新版本可能包含未解决的 bug 或兼容性问题，可能会导致你的应用程序运行异常。\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_68_0.png)[](img/76188a8f748fc585400eeef7e6351b2a_68_1.png)\n\
    \n结果是，经理可能会感到沮丧并说“在我的机器上无法运行”，而你感到无助并回答道“在我的机器上可以运行”。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_2.png)\n\
    \n了解重要性并始终分享你的 `package-lock.json` 文件\n\n![](img/76188a8f748fc585400eeef7e6351b2a_68_3.png)\n\
    \n## package.json\n\n把它看作一张关于你的信息卡——你是谁，你来自哪里等，但带有更完整的细节。它包含了项目名称及其版本，并告诉我们运行此项目所需的依赖和开发依赖。\n\
    \n- **dependencies**：运行项目生产环境所需的包。\n- **devDependencies**：仅在开发过程中需要的包。例如 `eslint`。\n\
    \n每当我们安装一个包（无论是依赖还是开发依赖），npm 都会在 `package.json` 文件的相应部分记录包名称及其对应的版本。\n\n创建一个 Next.js\
    \ 应用\n\n这种方式，`package.json` 文件记录了项目所需的所有包，更容易管理开发和生产环境。\n\n此外，我们可以看到另一个部分，即“scripts”。它包含了使用\
    \ npm 的可执行命令或脚本。我们可以完全自定义它。通过这些命令/脚本，我们可以运行测试、构建项目、启动服务器或部署应用程序。\n\n最后，\n\n![](img/76188a8f748fc585400eeef7e6351b2a_69_0.png)\n\
    \n## README.md\n\n它就像是项目的手册或指南——一个可以在其中写下关于项目信息的文件，例如如何安装它、它是做什么的，以及其他人如何为其贡献。\n\
    \n一个良好的 README 有助于人们理解我们的项目以及他们如何使用或参与其中。这就像给他们提供了关于如何利用我们项目的说明。\n\n现在，让我们最后运行应用程序。我们需要执行刚才提到的“scripts”部分的命令之一，特别是“dev”命令。\n\
    \n在继续之前，确保终端路径设置为正确的位置。由于我们在文件夹内部创建了一个名为“introduction”的子文件夹，我们需要进入它。这样做请在打开的终端中输入以下命令：\n\
    \n```bash\ncd introduction\n```\n\n创建一个 Next.js 应用\n\n“cd” 命令代表“切换目录”，将我们引导进入“introduction”文件夹。\n\
    \n现在运行，\n\n```bash\nnpm run dev\n```\n\n此命令将在端口 3000 启动本地开发服务器。要查看应用程序运行情况，打开你的浏览器并输入\
    \ URL：如果你正确遵循了所有步骤，你应该能看到应用程序按预期运行：http://localhost:3000\n\n![](img/76188a8f748fc585400eeef7e6351b2a_70_0.png)\n\
    \nimg/76188a8f748fc585400eeef7e6351b2a_70_1.png\n\n呼，为了涵盖初始文件和文件夹结构做了这么多解释。但如果我们不采取行动，一切徒用。让我们从仓库中更改一些东西来看看它是如何工作的。\n\
    \n创建一个 Next.js 应用\n\n## page.js\n\n打开 `page.js` 文件并删除所有现有代码。我们将通过创建 Home 组件来重新开始。\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_71_0.png)\n\n```javascript\nexport\
    \ default function Home() {\n  return (\n    <>\n      Hello World\n    </>\n\
    \  )\n}\n```\n\n进行更改后，保存文件并返回浏览器。如果你再次访问 localhost，你应该在不需要手动刷新页面的看到“Hello World”的更新内容。这是因为\
    \ Next.js 的快速刷新（Fast Refresh）功能，我们在编辑代码时实时反映更改。\n\n## layout.js\n\n现在，打开 `layout.js`\
    \ 文件并在 `body` 标签内添加文本：\n\n![](img/76188a8f748fc585400eeef7e6351b2a_71_1.png)\n\
    \n```javascript\nimport './globals.css';\nimport { Inter } from 'next/font/google';\n\
    \nconst inter = Inter({ subsets: ['latin'] });\n\nexport const metadata = {\n\
    \  title: 'Create Next App',\n  description: 'Generated by create next app',\n\
    };\n\nexport default function RootLayout({ children }) {\n  return (\n    <html\
    \ lang=\"en\">\n      <body className={inter.className}>\n        Hello, I'm Groot\n\
    \        {children}\n      </body>\n    </html>\n  );\n}\n```\n\n![](img/76188a8f748fc585400eeef7e6351b2a_71_2.png)\n\
    \n"
