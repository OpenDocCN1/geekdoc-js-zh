- md: "\n## Spread Syntax\n\n### Template Literals\n\n### Modules\n\nAllows to expand\
    \ elements of an array or object into individual elements.\n\nOne of the widely\
    \ used. Using the backticks, we can interpolate strings with placeholders & expressions:\
    \ \\` \\`.\n\nLearn how to import export code between files to organize the code.\n\
    \n## Asynchronous Programming\n\n### Promises\n\n### Async/Await\n\nGain an understanding\
    \ of the concept of promises and why they are necessary. Learn about resolving\
    \ and rejecting promises and utilizing `then` and `catch` for handling asynchronous\
    \ operations.\n\nExplore the usage of `async/await` to write asynchronous code\
    \ in a more synchronous way. This convention is widely adopted as an alternative\
    \ to using `then` and `catch` for handling promises.\n\n### Fetch API\n\nDiscover\
    \ how to use the Fetch API in the browser to send HTTP requests and handle the\
    \ resulting responses.\n\nRoadmap: 22\n\n### Axios (Plus)\n\nExplore the popular\
    \ third-party library, Axios, which simplifies the process of making HTTP requests\
    \ compared to the standard Fetch API.\n\n## Additional JavaScript Concepts\n\n\
    ### Array Methods\n\n### Error Handling\n\nFamiliarize yourself with different\
    \ widely used array methods to simplify the development process. For example:\n\
    \n- map\n- filter\n- reduce\n- slice\n- splice\n- forEach\n- includes\n- join\n\
    - reverse\n- and few others.\n\nTherefore, it is essential for every developer\
    \ to cultivate the skill of error handling. Familiarize yourself with the try-catch-finally\
    \ block, which enables you to capture errors and present them on the user interface\
    \ using user-friendly and easily understandable language.\n\nRoadmap: 23\n\n##\
    \ Foundations\n\n### Bundlers and Compilers\n\nA javascript runtime environment\
    \ that allows us to run JavaScript code outside of the browser.\n\nA tool that\
    \ manages third party packages. Using it, you can download different packages\
    \ needed inside your project like Axios.\n\nBundlers like webpack or Parcel help\
    \ combine our JavaScript files and other assets into a single bundle.\n\nIt’s\
    \ needed to work with React or Next.js. Make sure you download it.\n\nBefore we\
    \ proceed learning the libraries and frameworks like React.js and Next.js, we’ll\
    \ need some kind of config to setup these projects:\n\n3\n\n![](img/76188a8f748fc585400eeef7e6351b2a_29_0.png)\n\
    \n3\n\nThe Ecosystem\n\n### Node.js\n\n![](img/76188a8f748fc585400eeef7e6351b2a_29_1.png)\n\
    \n### NPM — Node Package Manager\n\n### Webpack\n\nTranspilers like Babel convert\
    \ modern JavaScript code to a version that works in all browsers.\n\n### Babel\n\
    \nRoadmap: 24\n\n## Version Control (Plus)\n\nLearning a version control system\
    \ like Git is highly valuable for anyone on the path to becoming a developer.\n\
