    \ a similar feature — Expo Router to improve the decade-\n\nold routing system\
    \ in React Native.\n\nIntroduction\n\n11"
- md: "\nIsn’t that great? Master one feature and effortlessly utilize it across multiple\
    \ platforms\n\nHowever, the list of features provided by Next.js goes beyond what\
    \ has been mentioned so far. \n\nIt offers a wide range of capabilities, including\
    \ seamless file-based routing, efficient code splitting, image & font optimization,\
    \ HMR(Hot Module Replacement), API Routes(backend), built-in support for Sass,\
    \ CSS modules, data fetching choice (SSG, SSR, ISR), error handling, Metadata\
    \ API (For SEO), Internationalization(support for any spoken language), etc.\n\
    \nIt is best to try these features firsthand through practical implementation\
    \ to truly appreciate its potential. That's precisely what we will do in the upcoming\
    \ lessons – dive into the coding aspect!\n\n\"Hmm, alright. I'm willing to trust\
    \ your insights on the new features of Next.js and such. However, is it actually\
    \ being used by people? Are companies actively seeking professionals with Next.js\
    \ expertise? Is there a high demand for it in the industry?\" — Are you wondering\
    \ the same?\n\nLet the data speak for itself:\n\n## Introduction\n\n12\n\n![](img/76188a8f748fc585400eeef7e6351b2a_17_0.png)\n\
    \nIn the past 30 days, Next.js has received significantly higher search interest\
    \ worldwide than React.js.\n\nBut hey, that’s just a Google trend. What about\
    \ the industry? Are people even creating websites using Next.js?\n\nSure, let’s\
    \ take a look at “The Next.js Showcase” which shows different companies using\
    \ Next.js:\n\n- Notion\n- Hulu\n- Netflix Jobs\n- Nike\n- HBO Max\n- Airbnb\n\
    - Typeform\n- TikTok\n- Auth0\n- Product Hunt\n- Hyundai\n- Porsche\n- repl.it\n\
    - Marvel\n- Futurist\n- Material-UI\n- Coco Colab\n- Ferrari\n- Hashnode\n- Verge\n\
    \nIntroduction\n\n13\n\nAnd many more renowned names. This demonstrates the genuine\
    \ excitement and widespread adoption of Next.js!\n\nConsidering the rapid rate\
    \ at which companies embrace Next.js, it would be no surprise to witness a huge\
    \ surge in demand for Next.js jobs in the coming months, if not years.\n\nNow\
    \ is the perfect time to seize the opportunity and prepare for the future job\
    \ market by mastering Next.js.\n\nWith this book and the courses we have done\
    \ and will continue to do, you can be the next Next.js developer. \n\n![](img/76188a8f748fc585400eeef7e6351b2a_18_0.png)\n\
    \nSo, grab a cup of coffee, and let's get started on this exciting journey! \n\
    \nIntroduction\n\n14\n\n## Chapter 3\n\n### Roadmap\n\nThe Roadmap is a concise\
    \ guide to web development essentials. It covers HTML for structuring web content,\
    \ CSS for styling and layout, and JavaScript for interactivity. Learners will\
    \ grasp important concepts like semantic tags, visual effects, variables, control\
    \ flow, functions, and manipulating the DOM.\n\nThis chapter equips beginners\
    \ with the skills needed to create dynamic and interactive web applications.\n\
    \nRoadmap\n\nBefore we start exploring Next.js, reviewing or relearning some basic\
    \ concepts is a good idea to make learning easier. It all begins with building\
    \ a solid foundation through fundamentals.\n\nThink of this roadmap as a summary\
    \ of what you should know as a foundation for learning Next.js. It's alright if\
    \ you're unfamiliar with advanced topics like integrating databases or implementing\
    \ authentication.\n\nThese points help you understand the main concepts without\
    \ focusing on specific coding details.\n\nIn Next.js, there are various approaches\
    \ to implementing these concepts. You have options like utilizing NextAuth (one\
    \ of the coolest features), exploring popular market solutions like Clerk, or\
    \ even building everything from scratch.\n\nSimilarly, when it comes to databases,\
    \ you can choose between different options such as SQL databases like Postgres,\
    \ NoSQL databases like MongoDB, or even consider using Prisma as an ORM (Object-Relational\
    \ Mapping) manager.\n\nWhether or not you have coding experience is not the most\
    \ important factor here. What truly matters is understanding the underlying concepts.\
    \ The roadmap is designed to introduce you to these concepts and familiarize you\
    \ with the beneficial knowledge when aspiring to become a Next.js Developer.\n\
    \nRoadmap\n\n15\n\nLater in the next chapters, and with our branded courses, you’ll\
    \ learn how to do all the code stuff in Next.js. So don’t worry; you have our\
    \ back!\n\nPresenting the Roadmap,\n\nThese points help you understand the main\
    \ concepts without focusing on specific coding details.\n\n1\n\n![](img/76188a8f748fc585400eeef7e6351b2a_21_0.png)\n\
    \n1\n\n### Web Development Fundamentals\n\n#### HTML - HyperText Markup Language\n\
    \n##### Basics\n\nUnderstand the structure, elements, and attributes of HTML documents\n\
    \n- Structure\n- Elements\n  - `<!DOCTYPE>`\n  - `<html>`\n  - `<head>`\n  - `<body>`\n\
    \  - Heading: `<h1>` to `<h6>`\n  - Paragraph: `<p>`\n  - Lists: `<ul>`, `<ol>`,\
    \ `<li>`\n  - Link: `<a>`\n  - Image: `<img>`\n  - Input: `<input>`, `<textarea>`\n\
    \  - Button: `<button>`\n  - Group Elements: `<div>`\n\nRoadmap\n\n16\n\n- Semantics:\
    \ Use elements like `<header>`, `<nav>`, `<main>`, `<section>`, `<aside>`, `<footer>`\n\
    - Forms: Learn to create forms, handling user input, perform form validations\
    \ by using form element and `onSubmit` event listener etc. to enhance document\
    \ structure of accessibility.\n\n#### CSS — Cascading Style Sheets\n\n##### Fundamentals\n\
    \nUnderstand the structure, elements, and attributes of HTML documents\n\n- Structure\n\
    \  - Box Model\n  - Selectors: Understand how elements are styled using `padding`,\
    \ `margin`, `border`\n- Learn about different types of selectors to target and\
    \ style specific HTML elements. For example:\n  - Type\n  - Class\n  - Id\n  -\
    \ Child\n  - Sibling\n\nRoadmap\n\n17\n\n- Typography\n- Colors and Backgrounds:\
    \ Explore text-related properties like `font-size`, `weight`, `alignment`\n- Understand\
    \ how to set different `colors`, `gradients`, `background images`\n- Learn the\
    \ various display values like: `block`, `inline`, `inline-block`\n- Explore how\
    \ to position an element in different ways such as `relative`, `absolute`, `sticky`,\
    \ `fixed`\n- Master the flexbox layout to create responsive website layouts\n\
    - Dive into CSS grid layout for advanced two-dimensional layouts\n\n#### Layout\
    \ and Positioning\n\n- Display\n- Position\n- Flexbox\n- Grid\n\nRoadmap\n\n18\n\
    \n- Learn to create smooth transitions using different CSS properties like `delay`,\
    \ `timing`, `duration`, `property`, `timing-function`\n- Explore 2D and 3D transformations\
    \ like `scaling`, `rotating`, `translating` elements\n- Learn how to create animations\
    \ using keyframes\n- Explore with box shadows and linear or radial gradients\n\
    \n#### Effects\n\n- Transitions\n\n#### Advanced (Plus)\n\n- Learn how to use\
    \ CSS processors like Sass or frameworks like Tailwind CSS for more powerful and\
    \ efficient styling\n- Transformations\n- Animations\n- Shadows and Gradients\n\
    \nRoadmap\n\n19\n\n### JavaScript\n\n- Variables and Data Types\n- Operators\n\
    - Control Flow\n- Functions\n- DOM Manipulation\n\n- Declaring variables and understanding\
    \ different data types such as string, `number`, `boolean`, `null`, `undefined`,\
    \ `object`, `array`, etc.\n- Learn to use different operators such as arithmetic,\
    \ comparison, logical, and assignment to perform operations on data\n- Try & test\
    \ conditional statements such as `if-else`, `switch` and loops such as `for`,\
    \ `while` to control flow\n- Define and learn to create different functions, understand\
    \ scope, and work with different parameters and return values\n- Knowing how to\
    \ use JavaScript to change and interact with HTML elements on a webpage is an\
    \ important skill. It's like a building block that we use in different ways with\
    \ tools like React or Next.js.\n\nRemember when we showed you different \"Hello\
    \ World\" examples in vanilla JavaScript and React.js? The basic idea is the same,\
    \ but the code structure is a bit different in React.\n\nRoadmap\n\n20\n\nIf you're\
    \ uncertain about how to learn & create a website using HTML, CSS, and JavaScript,\
    \ you can immediately build an attractive Sushi Website by simply following the\
    \ right free course:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_26_0.png)\n\n\
    Build and Deploy a Sushi Website using HTML & CSS\nWatch and Code Now\n\n2\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_26_1.png)\n\n2\n\n### Modern JavaScript\n\
    \n- Arrow Functions\n- Destructuring\n\nIn JavaScript, there are different kinds\
    \ of functions. One type that you'll often come across is called the Arrow function.\
    \ Many prefer using arrow functions because they are shorter and easier to write.\n\
    \nA helpful concept that will come in handy when we have to extract values from\
    \ arrays and objects\n\n#### ES6 Features\n\nRoadmap\n\n21\n"
  mdcn: "\n这不是很棒吗？精通一个功能就能在多个平台上轻松地使用。\n\n然而，Next.js 提供的功能列表远超我们目前提到的内容。\n\n它提供了广泛的能力，包括无缝基于文件的路由、高效的代码分割、图像与字体优化、HMR（热模块替换）、API\
    \ 路由（后端）、对 Sass 和 CSS 模块内置支持、数据获取选择（SSG、SSR、ISR）、错误处理、Metadata API（用于 SEO）、国际化（支持任何语言语言）等。\n\
    \n最好的方法是通过实际实现来首次尝试这些功能，以真正体会它的潜力。这正是我们将在接下来的课程中要做的——深入编码层面！\n\n“嗯，好吧。我愿意信任你对\
    \ Next.js 等新功能的见解。但是，真的有人在使用它吗？公司是否在积极寻找具有 Next.js 专业的专家？行业内对它的需求高吗？” —— 你也有同样的疑问吗？\n\
    \n让数据来说话：\n\n## 前言\n\n12\n\n![](img/76188a8f748fc585400eeef7e6351b2a_17_0.png)\n\
    \n在过去的 30 天内，Next.js 在全球范围内的搜索关注度高于 React.js。\n\n但嘿，这只是 Google 趋势。行业情况如何？人们真的在使用\
    \ Next.js 创建网站吗？\n\n当然，让我们来看看“Next.js 秀”，它展示了不同的公司如何使用 Next.js：\n\n- Notion\n\
    - Hulu\n- Netflix Jobs\n- Nike\n- HBO Max\n- Airbnb\n- Typeform\n- TikTok\n- Auth0\n\
    - Product Hunt\n- 现代\n- Porsche\n- repl.it\n- Marvel\n- Futurist\n- Material-UI\n\
    - Coco Colab\n- Ferrari\n- Hashnode\n- Verge\n\n前言\n\n13\n\n还有许多知名名称。这证明了人们对 Next.js\
    \ 的热情和广泛采用！\n\n考虑到公司采用 Next.js 的速度之快，如果我们在未来几个月、甚至几年内见证 Next.js 职位需求的巨大激增，也并不意外。\n\
    \n现在是抓住机会并通过掌握 Next.js 为未来的职场做好准备的完美时机。\n\n通过这本书以及我们已经做过并将继续制作的课程，你可以成为下一个 Next.js\
    \ 开发者。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_18_0.png)\n\n所以，拿起杯咖啡，让我们开始这段令人兴奋的旅程吧！\n\
    \n前言\n\n14\n\n## 第 3 章\n\n### 路线图\n\n路线图是 Web 开发要素的简明指南。它涵盖了用于构建网页内容的 HTML、用于样式和布局的\
    \ CSS 以及用于交互的 JavaScript。学习者将掌握语义化标签、视觉效果、变量、控制流、函数和操作 DOM 等重要概念。\n\n本章为初学者提供了创建动态和交互式\
    \ Web 应用所需的技能。\n\n路线图\n\n在我们开始探索 Next.js 之前，复习或重学一些基础概念会让学习变得更容易。这切都从通过基础知识建立坚实的基础开始。\n\
    \n将此路线图看作学习 Next.js 所应该掌握的基础知识总结。如果你不熟悉集成数据库或实现身份验证等高级主题，也没关系。\n\n这些点可以帮助你理解核心概念，而不必关注具体的编码细节。\n\
    \n在 Next.js 中，实现这些概念有多种方法。你有多种选择，比如利用 NextAuth（最酷的功能之一）、探索像 Clerk 这样流行的市场解决方案，甚至从头开始构建。\n\
    \n同样，涉及到数据库时，你可以在不同的选项之间选择，例如 Postgres 等 SQL 数据库、MongoDB 等 NoSQL 数据库，甚至可以使用 Prisma\
    \ 作为 ORM（对象关系映射）管理器。\n\n你是否有编码经验在这里并不是最重要的因素。真正重要的是理解底层概念。路线图的设计旨在向你介绍这些概念，并让你在渴望成为\
    \ Next.js 开发者时熟悉这些有益的知识。\n\n路线图\n\n15\n\n在接后的章节中，通过我们的品牌课程，你将学习如何在 Next.js 中完成所有代码工作。所以不要担心；我们会是你的后盾！\n\
    \n路线图展示如下，\n\n这些点可以帮助你理解核心概念，而不必关注具体的编码细节。\n\n1\n\n![](img/76188a8f748fc585400eeef7e6351b2a_21_0.png)\n\
    \n1\n\n### Web 开发基础\n\n#### HTML - 超文本标记语言\n\n##### 基础\n\n理解 HTML 文档的结构、元素和属性\n\
    \n- 结构\n- 元素\n  - `<!DOCTYPE>`\n  - `<html>`\n  - `<head>`\n  - `<body>`\n  -\
    \ 标题：`<h1>` 到 `<h6>`\n  - 段落：`<p>`\n  - 列表：`<ul>`, `<ol>`, `<li>`\n  - 链接：`<a>`\n\
    \  - 图像：`<img>`\n  - 输入：`<input>`, `<textarea>`\n  - 按钮：`<button>`\n  - 分组元素：`<div>`\n\
    \n路线图\n\n16\n\n- 语义化：使用 `<header>`, `<nav>`, `<main>`, `<section>`, `<aside>`,\
    \ `<footer>` 等元素\n- 表单：学习创建表单、处理用户输入、通过使用表单元素和 `onSubmit` 事件监听器执行表单验证等以增强文档结构的访问性。\n\
    \n#### CSS — 层级样式表\n\n##### 基础\n\n理解 HTML 文档的结构、元素和属性\n\n- 结构\n  - 盒模型\n  - 选择器：理解使用\
    \ `padding`, `margin`, `border` 样式化\n    - 类型\n    - 类\n    - ID\n    - 子元素\n\
    \    - 兄弟元素\n\n路线图\n\n17\n\n- 字体学\n- 颜色与背景：探索 `font-size`, `weight`, `alignment`\
    \ 等文本属性\n- 理解如何设置不同的 `colors`, `gradients`, 背景图像\n- 学习不同的显示值如 `block`, `inline`,\
    \ `inline-block`\n- 探索如何以不同方式定位元素 `relative`, `absolute`, `sticky`, `fixed`\n\
    - 掌握 flexbox 布局以创建响应式布局\n- 深入研究用于 用于网格布局\n\n#### 布局与定位\n\n- 显示\n- 位置\n- Flexbox\n\
    - Grid\n\n路线图\n\n18\n\n- 学习使用 `delay`, `timing`, `duration`, `property`, `timing-function`\
    \ 创建流畅过渡\n- 探索 2D 和 3D 变换如 `scaling`, `rotating`, `translating`\n- 学习如何使用 keyframes\
    \ 创建动画\n- 探索盒投影和线性渐变\n\n#### 效果\n\n- 过渡\n\n#### 高级（+）\n\n- 学习如何使用 Sass 等 CSS 处理器或\
    \ Tailwind CSS 等框架进行更强大的样式处理\n- 变换\n- 动画\n- 阴影与渐变\n\n路线图\n\n19\n\n### JavaScript\n\
    \n- 变量与数据类型\n- 运算符\n- 控制流\n- 函数\n- DOM 操作\n\n- 声明变量并理解不同的数据类型如 `string`, `number`,\
    \ `boolean`, `null`, `undefined`, `object`, `array` 等\n- 学习使用不同的算术、比较、逻辑和赋值运算符对数据进行操作\n\
    - 尝试并测试条件语句 `if-else`, `switch` 以及循环 `for`, `while` 来控制流\n- 定义并学习创建不同的函数，理解作用域并处理参数和返回值\n\
    - 了解如何使用 JavaScript 修改网页上的 HTML 元素是一项重要技能。它就像我们在 React 或 Next.js 中以不同方式使用的构建块。\n\
    \n记得我们在原生 JavaScript 和 React 中展示的各种“Hello World”示例吗？代码结构在 React 中有点不同。\n\n路线图\n\
    \n20\n\n如果你不确定如何使用 HTML、CSS 和 JavaScript 学习并创建网站，你可以通过正确的免费课程立即创建一个精美的寿司网站：\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_26_0.png)\n\n使用 HTML & CSS 构建并部署寿司网站\n\
    立即观看并代码\n\n2\n\n![](img/76188a8f748fc585400eeef7e6351b2a_26_1.png)\n\n2\n\n###\
    \ 现代 JavaScript\n\n- 箭头函数\n- 解构\n\n在 JavaScript 中，有各种函数。你经常遇到的一种类型被称为箭头函数。很多人更喜欢使用箭头函数，因为它们更短更容易编写。\n\
    \n当我们从数组和对象中提取值时，这是一个非常有用的概念。\n\nES6 特性\n\n路线图\n\n21\n"
