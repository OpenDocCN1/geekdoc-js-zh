    \ Ultimate Ebook\n\nNext.js\n\n![](img/76188a8f748fc585400eeef7e6351b2a_0_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_3.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_5.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_6.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_0_8.png)\n\
    \nTable Of Contents\n\nChapter 1 Birth - 01\nChapter 2 Introduction - 07\nChapter\
    \ 3 Roadmap - 15\nChapter 4 How it works - 40\nChapter 5 Create a Next.js Application\
    \ - 47\nChapter 6 Client Vs. Server - 68\n\n![](img/76188a8f748fc585400eeef7e6351b2a_1_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_3.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_6.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_7.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_8.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_9.png)![](img/76188a8f748fc585400eeef7e6351b2a_1_10.png)\n\
    \nIndex - 00\n\n## Chapter 1\n### Birth\n\nIn the first chapter, we explore the\
    \ evolution of JavaScript and web development frameworks. We discuss the significance\
    \ of embracing new technologies and compare code snippets in different frameworks\
    \ to highlight their benefits. We introduce Next.js as a framework built on React.js,\
    \ addressing limitations and incorporating new features. The chapter concludes\
    \ with the recommendation to shift focus to Next.js for building modern web applications.\n\
    \nBirth\n\nNot too long ago, in 2015, React.js entered the scene. However, even\
    \ the journey of JavaScript in the IT industry hasn't been exceptionally long.\
    \ Originally developed by Brenden Eich at Netscape in 1995, JavaScript gained\
    \ significant popularity during the 2000s.\n\nThis was largely due to Google's\
    \ ingenious utilization of JavaScript to introduce interactive and dynamic features\
    \ for map exploration. Subsequently, developers were introduced to frameworks\
    \ and libraries, including jQuery, Angular, Node.js, React.js, and, most recently,\
    \ Next.js. These technologies have revolutionized the web development landscape,\
    \ offering developers various capabilities and possibilities.\n\nYou might wonder\
    \ why this information is relevant in the context. The significance lies in the\
    \ fact that it highlights the timeless truth that \"change is constant.\" As we\
    \ continue to advance and evolve as a society, our tools and technologies will\
    \ naturally progress alongside us. We have no other option but to embrace and\
    \ adapt to these changes. It serves as a reminder that our willingness to embrace\
    \ new ideas and technologies is essential for growth and success in the ever-changing\
    \ IT industry landscape.\n\nThese technologies and tools share a common purpose:\
    \ to enhance work efficiency and improve performance. In this era, we can still\
    \ use vanilla JavaScript or create websites using HTML and CSS without doubt.\n\
    \n01\n\nHowever, when it comes to developing applications on a large scale, the\
    \ efficiency of using the latest technologies surpasses that of traditional approaches.\
    \ To showcase and experiment with this concept, we have created a video on our\
    \ YouTube channel. You can personally analyze the amount of code and the level\
    \ of efficiency demonstrated in the video.\n\nTo provide a brief glimpse of the\
    \ evolution in JavaScript practices, here is a well-known code snippet starting\
    \ from the core language itself:\n\n**Vanilla JavaScript:**\n```html\n<!-- HTML\
    \ -->\n<button id=\"btn\">Click Me</button>\n\n<script>\nconst btn = document.getElementById('btn');\n\
    btn.addEventListener('click', () => {\n  alert('Hello World!');\n});\n</script>\n\
    ```\n\n**jQuery:**\n```html\n<!-- HTML -->\n<button id=\"btn\">Click Me</button>\n\
    \n<script>\n$('#btn').click(function() {\n  alert('Hello World!');\n});\n</script>\n\
    ```\n\n02\n\n**Angular:**\n```html\n<!-- HTML -->\n<button (click)=\"showMessage()\"\
    >Click Me</button>\n\n<script>\nimport { Component } from '@angular/core';\n\n\
    @Component({\n  selector: 'app-example',\n  template: `<button (click)=\"showMessage()\"\
    >Click Me</button>`\n})\nexport class ExampleComponent {\n  showMessage() {\n\
    \    alert('Hello World!');\n  }\n}\n</script>\n```\n\n**React.js:**\n```jsx\n\
    <!-- HTML/JSX -->\nimport React from 'react';\n\nclass ExampleComponent extends\
    \ React.Component {\n  showMessage = () => {\n    alert('Hello World!');\n  }\n\
    \n  render() {\n    return (\n      <button onClick={this.showMessage}>Click Me</button>\n\
    \    );\n  }\n}\n\nexport default ExampleComponent;\n```\n\nAh? From what I see,\
    \ there's an increase in the amount of code being written. It appears to be in\
    \ complete opposition to what was mentioned earlier — Are you thinking the same?\
    \ If we look at it solely from this perspective, one would certainly feel that\
    \ the original language and framework require less code.\n\n03\n\nHowever, it's\
    \ important to consider the bigger picture. And that's what truly matters, doesn't\
    \ it? In reality, we don't just build \"Hello World\" projects. We undertake more\
    \ substantial projects that demand the utilization of various frameworks and tools\
    \ to achieve the desired functionality and scalability.\n\nWe could have talked\
    \ about the “big picture” of using React or even Angular over vanilla code, but\
    \ that is not the primary focus of this eBook. However, it is worth mentioning\
    \ a few foundational reasons why these new tools make development more efficient:\n\
    \n- Architecture: React and Angular follow a Component-Based Architecture, encouraging\
    \ code reusability. For instance, if you create a component like a Button, you\
    \ can use it anywhere in the application as often as needed. This reusability\
    \ enhances the maintainability and scalability of the application.\n- Virtual\
    \ DOM: The Virtual DOM is a lightweight representation of the actual DOM. It facilitates\
    \ efficient and optimized updates to the user interface, resulting in improved\
    \ performance. Simply put, it tracks changes within the application and performs\
    \ a \"diffing\" process by comparing the previous version of the virtual DOM with\
    \ the new version. It identifies the differences and updates the real DOM accordingly.\n\
    - Ecosystem & Community: Modern libraries like React.js have vibrant and active\
    \ communities. This provides developers with abundant resources, extensive documentation,\
    \ reusable code packages, bug fixes, and support.\n\n04\n\n… and many other libraries\
    \ or framework-specific reasons that you can explore. To truly appreciate the\
    \ impact, I would once again recommend visiting the YouTube videos we created,\
    \ where you can experience firsthand what it takes to build a simple landing page\
    \ using two different tools to measure the efficiency of these tools:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_7_0.png)\n\
    Build and Deploy a Sushi Website using HTML & CSS\nWatch and Code Now\n\n![](img/76188a8f748fc585400eeef7e6351b2a_7_1.png)\n\
    Build and Deploy a Bank Website using React.js\nWatch and Code Now\n\nBut hey,\
    \ where does Next.js come in the picture?\n\nAs mentioned earlier, as we continue\
    \ to progress, technology also advances. jQuery addressed the limitations of vanilla\
    \ JavaScript, and then React.js emerged to overcome the shortcomings and loopholes\
    \ of jQuery. However, even React.js has its own challenges, which have now been\
    \ addressed by another tool called Next.js.\n\nIt’s a big misconception that Next.js\
    \ is a new language or library. No!\n\n05\n\nVercel, the team behind Next.js,\
    \ embarked on a unique approach to develop a framework encompassing client-side\
    \ (frontend) and server-side (backend) functionalities within a single application.\
    \ Guillermo Rauch, the original creator of Next.js and the mastermind behind Socket.IO,\
    \ began working on this idea in 2016.\n\nOver the course of a year, they continuously\
    \ added new features such as file-based routing, automatic code splitting, hybrid\
    \ rendering, internationalization, image and font optimization, and many more.\n\
    \nThe relentless dedication of the Vercel developers, coupled with their ability\
    \ to transform diverse ideas into reality, has caught the attention of Meta (previously\
    \ known as Facebook) — the creators of React.js. Meta now explicitly recommends\
    \ that developers use Next.js as their primary tool instead of relying solely\
    \ on React.js. It's an extraordinary achievement!\n\nAnd that’s how we developers\
    \ now need to shift our focus to the latest and greatest version, Next.js 13,\
    \ to build highly capable and production-ready applications. This exciting evolution\
    \ opens up new possibilities and opportunities for creating advanced web applications.\n\
    \nOnto the next chapter…\n\n06\n"
