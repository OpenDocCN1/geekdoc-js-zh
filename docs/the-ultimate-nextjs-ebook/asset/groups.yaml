    \ The same concepts are as it is used in the Next.\n\n4\n\n![](img/76188a8f748fc585400eeef7e6351b2a_30_0.png)\n\
    \n4\n\n## React JS\n\n### Components\n\nThink in terms of components. Learn to\
    \ break the code or the UI in small manageable components for reusability & maintainability.\n\
    \nThere are two ways in which we can create a component i.e.,\n\n- Class Component\n\
    - Function Component — Widely used\n\n### Fundamentals\n\nAlong with that, learn\
    \ “What is JSX?” and the “Component Lifecycle”.\n\nRoadmap: 25\n\n### State and\
    \ Props\n\n### Events\n\n### Conditional Rendering\n\nLearn how to create and\
    \ manage state — A small store that holds a particular data of the application.\n\
    \nLearn how to handle user interactions, such as clicks and form submissions,\
    \ using event handlers.\n\nLearn how to conditionally render components and render\
    \ dynamic list of data using the mapping techniques.\n\nLearn how to pass props\
    \ (a piece of data) between components.\n\nJSX is syntax in React that allows\
    \ you to write HTML code. It looks like HTML but isn’t.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_31_0.png)\n\
    \nP.S., Don’t forget to learn about the special “key” prop when rendering the\
    \ dynamic list.\n\nRoadmap: 26\n\n### Hooks\n\n### Router\n\n### State Management\n\
    \nAfter learning how to create functional component, the next challenge will be\
    \ to understand how to use hooks. Hooks are special functions that allow us to\
    \ manage state and side effects and improve efficiency. Famous hooks are:\n\n\
    - useState\n- useEffect\n- useRef\n- useContext\n- useCallback\n- useMemo\n\n\
    ![](img/76188a8f748fc585400eeef7e6351b2a_32_0.png)\n\nLearn to understand different\
    \ state management options such as Redux or Context.\n\nRoadmap: 27\n\n### Style\n\
    \n### Forms\n\n### HTTP Requests\n\nExplore different approaches to styling components,\
    \ including:\n\n- CSS modules\n- Sass\n- TailwindCSS\n- Material UI\n- styled-components\n\
