    ## Chapter 4 How it works


    In this chapter, we lay the foundation by understanding how the web works before
    diving into Next.js code. We explore the traditional approach of HTML, CSS, and
    JavaScript, where the server sends complete files to the client for each page
    request. We also introduce the React way, where the server sends a minimal HTML
    file and a bundled JavaScript file, and React manipulates the virtual DOM for
    efficient rendering. Finally, we discuss the Next.js way.


    You might be itching to start with Next.js code, right? Although writing code
    is important, we must first build our foundations. It’ll not just help you in
    clearing interviews but also help in making sound decisions in your application.
    If your why isn’t clear, you’ll have no idea what you’re doing, and you’ll blame
    it on Next.js by saying it’s an overrated piece of technology. That will only
    showcase your lack of knowledge. It''s a foolproof recipe to amaze everyone with
    your impressive ignorance. So, perfect your why and your how will come naturally.
    Let’s time-travel a bit to see how things were used to work with different technologies.
    The vanilla HTML, CSS, and JavaScript websites built using the web''s fundamental
    elements, namely HTML, CSS, and JavaScript, function differently compared to the
    latest technologies. When a user visits such a website, their browser (the client)
    sends a request to the server (another computer where the site is hosted) asking
    for the content to be displayed.


    How it works


    40


    ![](img/76188a8f748fc585400eeef7e6351b2a_47_0.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_1.png)
    Request


    ![](img/76188a8f748fc585400eeef7e6351b2a_47_2.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_3.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_4.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_5.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_6.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_7.png)[](img/76188a8f748fc585400eeef7e6351b2a_47_8.png)


    - Analyzing the HTML file

    - Applies the styles

    - Implements any user interaction


    Traditionally, for each of these requests, the server responds by sending three
    files i.e., the HTML, CSS, and JavaScript (only if any JavaScript code is involved).
    The client''s browser receives these files and begins by analyzing the HTML file.
    Then, it applies the styles from the CSS file and implements any user interaction,
    such as event handlers or dynamic behavior, specified in the JavaScript file on
    the webpage.

