    \nFor the final, let’s now create our Next.js application. There are two options:\n\
    \n- Automatic Installation\n- Manual Installation\n\n## Create a Next.js Application\n\
    \n50\n\nAs the name implies, manual installation involves obtaining and configuring\
    \ packages individually and organizing the initial file and folder structure along\
    \ with some code. We’ll have to do everything on our own.\n\nOn the other hand,\
    \ the alternative approach aims to accelerate the development process by allowing\
    \ us to create the application with our preferred choices. Depending on our preferences,\
    \ such as using TypeScript or not, incorporating styling libraries like Tailwind\
    \ CSS, or opting for other options, we can set up the complete project with just\
    \ one click.\n\nBeing widely used and an easy installation choice, we can create\
    \ a next.js project by running a Zero Dependency CLI (Command Line Interface)\
    \ tool — create-next-app. You can visit the link if you want to know about this\
    \ in detail. Inside, you’ll see how the create-next-app has been created with\
    \ the templates, including with/without JavaScript, Tailwind CSS, etc.\n\nDon’t\
    \ worry; you don’t need to download create-next-app as another global package.\
    \ Thanks to npx!\n\nWhen you installed Node.js, you also got two other useful\
    \ tools: NPM and NPX.\n\nNPM, which stands for Node Package Manager, allows us\
    \ to manage and download various packages (collections of code) that we need to\
    \ run our application. For example, packages like Axios for making HTTP requests\
    \ or Redux Toolkit for state management.\n\n## Create a Next.js Application\n\n\
    51\n\nOn the other hand, NPX, short for Node Package Runner, is a command-line\
    \ tool. It lets us execute packages without installing them globally on our system.\
    \ It's important to note that npx is used to run command-line tools and execute\
    \ commands from packages, but it doesn't handle the installation of packages.\
    \ That responsibility falls to npm, which takes care of package installation.\n\
    \nLet's move on from the theoretical discussion and proceed with the command that\
    \ will automatically install the necessary packages for running a Next.js application.\n\
    \n`npx create-next-app@latest`\n\nAs soon as you press enter, it will prompt you\
    \ to confirm whether it can download the required packages. Please select \"yes\"\
    \ to proceed with the installation.\n\nDuring the installation process, we will\
    \ encounter a series of prompts individually. These prompts allow you to choose\
    \ the specific features and configurations we desire for our Next.js application.\n\
    \n- What is your project named? introduction\n- Would you like to use TypeScript\
    \ with this project? No\n- Would you like to use ESLint with this project? No\n\
    - Would you like to use Tailwind CSS with this project? No\n- Would you like to\
    \ use src/ directory with this project? No\n- Use App Router (recommended)? Yes\n\
    - Would you like to customize the default import alias? No\n\nLet's choose not\
    \ to include TypeScript, ESLint, and Tailwind CSS. In the upcoming chapters, we\
    \ will explore these options in detail.\n\n## Create a Next.js Application\n\n\
    52\n\nIf you see the installation process carefully, you’ll see “Using npm.” npx\
    \ is used solely to execute commands from packages, while npm handles the installation\
    \ of those packages.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_60_0.png)\n\n\
    And there you have it! The Next.js application has been successfully installed.\
    \ Now, let's explore what's inside. Click on the \"introduction\" folder or the\
    \ name you chose for your project. Inside, you will find several files and folders.\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_60_1.png)[](img/76188a8f748fc585400eeef7e6351b2a_60_2.png)\n\
    \n### App\n\nIt’s the root of the application, where we'll create various client\
    \ (frontend) routes and potentially write backend code. Initially, you'll find\
    \ some starter files in this location, including:\n\n## Create a Next.js Application\n\
    \n53\n\n### favicon.ico\n\nIt represents the website's favicon displayed in the\
    \ browser's tab. By default, the favicon will be the Vercel icon. You can replace\
    \ it with the one you like.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_61_0.png)\n\
    \n### globals.css\n\nThis file holds the CSS code for the application. It is a\
    \ global file where you can define CSS variables, import fonts, or perform initialization\
    \ tasks. You can keep the file, rename it, or even move it to a different location.\
    \ It doesn't matter. However, if you make any changes to this file, you must update\
    \ any other parts of the application that rely on it.\n\n## Create a Next.js Application\n\
    \n54\n\n### global.css\n\n```css\n:root {\n  --background: #ffffff;\n  --foreground-rgb:\
    \ #171717;\n  --card-start: #ffffff;\n  --card-end: #f2f2f2;\n  --primary: #0070f3;\n\
    \  --primary-foreground: #ffffff;\n  --secondary: #7a7a7a;\n  --secondary-foreground:\
    \ #ffffff;\n  --max-width: 100%;\n  --border-radius: 8px;\n  --font-main: ui-system,\
    \ -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif, \"Apple Color\
    \ Emoji\", \"Segoe UI Emoji\", \"Segoe UI Symbol\";\n  --font-mono: ui-monospace,\
    \ SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n}\n\
    ``` (Note: The OCR text for the CSS was heavily fragmented/noisy; I have reconstructed\
    \ the likely structure based on common Next.js templates).\n\nWait, looking at\
    \ the OCR, it is a list of variables:\n```css\nbody {\n  background: var(--background);\n\
    \  color: var(--foreground-rgb);\n}\n```\nActually, based on the provided text\
    \ fragments:\n### layout.js\n\nIt’s the main entry point of the application. The\
    \ root. The parent. Whatever you prefer to call it. If you write anything in there,\
    \ it’ll appear on each client (frontend) route. It’s universal. If you need to\
    \ import fonts, add metadata, wrap the application with Redux, or show a Navbar,\
    \ this is the place to do it. All these tasks can be performed within this file.\n\
    \n## Create a Next.js Application\n\n55\n\n### page.js\n\nIt’s an alias of the\
    \ home route i.e., \"/\". It's important not to confuse this file with layout.js.\
    \ Whatever you write inside page.js will be displayed only on the \"/\" route,\
    \ while anything inside layout.js will appear across all routes, including the\
    \ home route i.e., \"/\". In short, layout.js is the parent of page.js, providing\
    \ a common layout for all pages.\n\n### page.module.css\n\nThis CSS file is specifically\
    \ designed to style a particular page or module. The naming convention .module.css\
    \ indicates that the CSS rules in this file are scoped to a specific component.\
    \ In this case, it corresponds to the page.js component. If you closely examine\
    \ the code, you will notice the presence of the following:\n\n`import styles from\
    \ './page.module.css'`\n\n![](img/76188a8f748fc585400eeef7e6351b2a_63_0.png)\n\
    \n### Node Modules\n\nWell, it’s the backbone! The node\\_modules directory is\
    \ a storage location for all the dependencies or packages required to run a project.\
    \ Whenever we install packages using npm, the corresponding code for those packages\
    \ is placed inside this directory.\n\n## Create a Next.js Application\n\n56\n\n\
    For example, if we install Axios, a folder named axios will be created within\
    \ the node\\_modules folder. If youve been following closely, you may have noticed\
    \ that Next.js is built on top of React. Therefore, you can explore the node\\\
    _modules folder to find the react folder, which contains the code for React itself.\n\
    \nIn addition to React, you'll come across several other folders such as next\
    \ (which enables Next.js-specific features), react-dom, postcss, styled-jsx, and\
    \ more. Each of these folders contains numerous files and lines of code essential\
    \ for running our Next.js application.\n\nNo need to worry, though. You don't\
    \ have to interact with or visit this directory in the future (unless something\
    \ terrible happens). npm automatically manages the node\\_modules folder when\
    \ we install or uninstall node packages.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_64_0.png)\n\
    \n### Public\n\nIt’s a special folder allowing us to include static assets like\
    \ images or files like fonts, videos, etc. The content inside this folder is automatically\
    \ optimized and available throughout the application. Thus it’s advisable to put\
    \ any PNGs, JPEGs, or SVGs we need inside this folder.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_64_1.png)\n\
    \n### .gitignore\n\nThe .gitignore is a special text file that tells Git, the\
    \ version control system, to exclude certain files and directories from being\
    \ tracked. One common entry in the .gitignore file is node\\_modules.\n\n## Create\
    \ a Next.js Application\n\n57\n"
  mdcn: "\n按照这些步骤，你可以在 VSCode 中查看你的 \"NextEbook\" 文件夹。\n\nVSCode 提供了内置的终端，开发人员无需单独打开操作系统的终端或命令提示符。通过\
    \ VSCode 的内联终端，我们可以在应用程序内完成所有必要任务。\n\n要打开终端，按 `ctrl + ` ` (反引号) 或点击顶部菜单栏上的“Terminal（终端）”选项。在下拉菜单中选择“New\
    \ Terminal（新建终端）”。终端窗口将显示如下：\n\n![](img/76188a8f748fc585400eeef7e6351b2a_57_0.png)\n\
    \n最后，让我们现在创建我们的 Next.js 应用程序。有两种选项：\n\n- 自动安装\n- 手动安装\n\n## 创建 Next.js 应用程序\n\n\
    50\n\n顾名思，手动安装涉及单独获取和配置包，并组织初始文件和文件夹结构以及一些代码。我们必须自己完成一切。\n\n另一方面，另一种方法旨在通过允许我们根据偏好选项创建应用程序来加速开发过程。根据我们的偏好（例如是否使用\
    \ TypeScript、引入像 Tailwind CSS 这样的样式库或选择其他选项），只需点击一下即可设置整个项目。\n\n由于其被广泛使用且安装简单，我们可以通过运行一个零依赖\
    \ CLI（命令行界面）工具——`create-next-app` 来创建一个 next.js 项目。如果你想详细了解此信息，可以访问链接。在里面，你会看到\
    \ `create-next-app` 是如何使用模板创建的，包括包含/不包含 JavaScript、Tailwind CSS 等。\n\n别担心；你不需要将\
    \ `create-next-app` 作为另一个全局包下载。多亏了 npx!\n\n当你安装了 Node.js 时，你还得到了两个实用的工具：NPM 和\
    \ NPX。\n\nNPM 代表 Node Package Manager（Node 包管理器），它允许我们管理和下载运行应用程序所需的各种包（代码集合）。例如，用于发送\
    \ HTTP 请求的 Axios 等包，或用于状态管理的 Redux Toolkit 等。\n\n## 创建 Next.js 应用程序\n\n51\n\n\
    另一方面，NPX 是 Node Package Runner（Node 包运行器）的缩写，是一个命令行工具。它允许我们在不向系统全局安装包的情况下执行这些包。需要注意的是，`npx`\
    \ 用于运行命令行工具和执行包中的命令，但它不处理包的安装。该责任由 `npm` 承担，它负责包的安装。\n\n让我们离开理论讨论，继续执行将自动安装运行\
    \ Next.js 应用程序所需包的命令。\n\n`npx create-next-app@latest`\n\n一旦你按下回车键，它将提示你确认是否可以下载所需的包。请选择\
    \ \"yes\" 继续安装。\n\n在安装过程中，我们将逐个遇到一系列提示。这些提示允许你为我们的 Next.js 应用程序选择特定的功能和配置。\n\n\
    - 你的项目名称是什么？introduction\n- 你想在项目中使用 TypeScript 吗？No\n- 你想在项目中使用 ESLint 吗？No\n\
    - 你想在项目中使用 Tailwind CSS 吗？No\n- 你想在项目中使用 `src/` 目录吗？No\n- 使用 App Router（推荐）吗？Yes\n\
    - 你想自定义默认的导入别名吗？No\n\n让我们选择不包含 TypeScript、ESLint 和 Tailwind CSS。在接下来的章节中，我们将详细探索这些选项。\n\
    \n## 创建 Next.js 应用程序\n\n52\n\n如果你仔细观察安装过程，你会看到“Using npm”。`npx` 仅用于执行包中的命令，而 `npm`\
    \ 处理这些包的安装。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_60_0.png)\n\n大功告成！Next.js\
    \ 应用程序已成功安装。现在，让我们探索内部。点击“introduction”文件夹或你为项目选择的名字。在里面，你会找到几个文件和文件夹。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_60_1.png)[](img/76188a8f748fc585400eeef7e6351b2a_60_2.png)\n\
    \n### App\n\n它是应用程序的根，我们将在这里创建各种客户端（前端）路由并可能编写后端代码。最初，你会在此位置找到一些启动文件，包括：\n\n##\
    \ 创建 Next.js 应用程序\n\n53\n\n### favicon.ico\n\n它代表在浏览器标签页中显示的网站图标。默认情况下，图标是 Vercel\
    \ 图标。你可以将其替换为你喜欢的。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_61_0.png)\n\n###\
    \ globals.css\n\n此文件包含应用程序的 CSS 代码。它是一个全局文件，可以在其中定义 CSS 变量、导入字体或执行初始化任务。你可以保留该文件、重命名它甚至将其移动到不同的位置。这没有关系。但是，如果你对此文件进行了任何更改，必须更新应用程序中依赖于它的其他部分。\n\
    \n## 创建 Next.js 应用程序\n\n54\n\n### global.css\n\n```css\n:root {\n  --background:\
    \ #ffffff;\n  --foreground-rgb: #171717;\n  --card-start: #ffffff;\n  --card-end:\
    \ #f2f2f2;\n  --primary: #0070f3;\n  --primary-foreground: #ffffff;\n  --secondary:\
    \ #7a7a7a;\n  --secondary-foreground: #ffffff;\n  --max-width: 100%;\n  --border-radius:\
    \ 8px;\n  --font-main: ui-system, -apple-system, Segoe UI, Roboto, Helvetica,\
    \ Arial, sans-serif, \"Apple Color Emoji\", \"Segoe UI Emoji\", \"Segoe UI Symbol\"\
    ;\n  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation\
    \ Mono\", monospace;\n}\n```（注：CSS 的 OCR 文本严重碎片化/有噪音；我根据常见的 Next.js 模板重构了可能的结构）。\n\
    \n等等，查看 OCR 结果，它是一个变量列表：\n```css\nbody {\n  background: var(--background);\n \
    \ color: var(--foreground-rgb);\n}\n```\n实际上，根据提供的文本片段：\n### layout.js\n\n它是应用程序的主入口点。根。父级。无论你喜欢如何称呼它。如果你在里面写了任何内容，它将出现在每个客户端（前端）路由上。它是通用的。如果你需要导入字体、添加元数据、用\
    \ Redux 包裹应用程序或显示导航栏，这里是执行操作的地方。所有这些任务都可以在此文件中完成。\n\n## 创建 Next.js 应用程序\n\n55\n\
    \n### page.js\n\n它是根路由 `/`。不要将此文件与 layout.js 混淆。你在该 文件夹内编写的任何内容都会显示。\n\n### page.module.css\n\
    \n此 CSS 文件专门为特定页面设计。module.css 的命名约定表示此文件中的 CSS 规则是针对特定组件的。在这种情况下，它对应于 page 组件。如果你仔细检查代码，你会发现存在：\n\
    \n`import styles from './page.module.css'`\n\n![](img/76188a8f748fc585400eeef7e6351b2a_63_0.png)\n\
    \n### Node Modules\n\n它是核心！node\\_modules 目录是运行项目所需的所有依赖或包的存储位置。当我们使用 npm 安装包时，相应包的代码将被放置在此目录中。\n\
    \n## 创建 Next.js 应用程序\n\n56\n\n例如，如果我们安装 Axios，node\\_modules 文件夹中将创建一个 axios 的文件夹。如果你一直在密切关注，你可能注意到\
    \ Next.js 是基于 React 构建的。因此，你可以探索 node\\_modules 文件夹找到 react 文件夹，它包含了 React 本身的代码。\n\
    \n除了 React 之外，你还会遇到几个其他文件夹，例如 next（启用 Next.js 特性）、react-dom、postcss、styled-jsx\
    \ 等。这些文件夹中的每一个都包含运行 Next.js 应用程序所需的许多文件和代码。\n\n不过不必担心。你以后不需要与此目录进行交互（除非发生了糟糕的事情）。在我们安装或卸载\
    \ node 包时，npm 会自动管理 node\\_modules 文件夹。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_64_0.png)\n\
    \n### Public\n\n这是一个允许我们包含静态资源如图像或字体、视频等文件的特殊文件夹。此文件夹的内容会自动优化并在整个应用程序中可用。因此，建议我们将需要的\
    \ PNG、JPEG 或 SVG 放在此文件夹中。\n\n![](img/76188a8f748fc585400eeef7e6351b2a_64_1.png)\n\
    \n### .gitignore\n\n.gitignore 是一个特殊的文本文件，告诉 Git（版本控制系统）排除某些文件和目录。gitignore 文件中的一个常见条目是\
    \ node\\_modules。\n"
