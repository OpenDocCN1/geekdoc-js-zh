    ## 有什么局限性？


    ### 处理

    大多数处理发生在客户端，这意味着用户的网络浏览器负责渲染 HTML 页面并执行存在的任何 JavaScript 代码。


    然而，如果网站非常复杂，且用户的设备需要更强大的性能，可能会给浏览器带来压力，并为其处理带来负担。


    ### 带宽

    由于服务器为每个页面请求向客户端发送完整文件，这会增加带宽的占用。在处理包含大量页面以及散布在网站各视频和音频片段的复杂网站时，这一点变得尤为显著。


    ### 加载时间

    与最新技术相比，初始页面加载时间可能更长。这是因为每个请求都必须传输完整的文件。只有在服务器发送了所有必要文件且浏览器完成所有解析后，我们才能查看网站的内容。


    ## 它的原理


    ### React 方式

    这就是 React 发挥用场的地方。它通过引入组件、虚拟 DOM 概念和客户端-服务器机制改进了开发生命周期。


    当你访问一个 React 网站时，客户端浏览器向服务器发送网页内容的请求。作为响应，服务器发送一个极简的 HTML 文件（作为整个应用程序的入口点）以及一个包好的
    JavaScript 文件。


    React 使用该 JavaScript 文件启动客户端渲染，并操作虚拟 DOM。React 不是直接修改实际 DOM，而是更新虚拟 DOM，然后仅将必要的更改应用到真实
    DOM，从而实现预期的页面显示。


    React 利用其客户端路由库 React Router 在 React 应用程序内导航到不同的页面。该库允许在不进行完整服务器请求的情况下更改路由，从而防止页面刷新。


    当触发新路由时，React Router 会根据新 URL 重新渲染相关组件。如果新页面需要从服务器获取数据，相应的组件将发起请求以检索必要数据。


    ## 它的原理


    ### 有什么局限性？


    ### 复杂性

    构建 React 应用可能比传统的 HTML、CSS 和 JavaScript 网站具有更高的复杂性。它涉及到组件化思维、状态（state）和属性（props）的管理以及与虚拟
    DOM 的交互，对于初学者 React.js 的开发者来说可能需要学习曲线。


    ### 处理

    与传统方法类似，React 主要执行客户端渲染。它严重依赖 JavaScript 进行初始渲染以及随后的请求来更新用户界面，而这些操作都在客户端浏览器中完成。


    然而，这种对客户端渲染的依赖可能会延迟渲染和交互，特别是在处理器较慢且资源有限的设备上。


    ### SEO

    是的，如果你还记得，我们在引言章节中曾提到过 React 与 Next.js 相比的一个显著缺点。


    问题在于，搜索引擎爬虫可能需要帮助才能完全访问网站内容，因为所有内容都是通过 JavaScript 处理并仅在客户端渲染的。结果是，这会影响网站在搜索引擎结果中的可见性。


    ## 它的原理


    ![](img/76188a8f748fc585400eeef7e6351b2a_51_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_3.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_5.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_6.png)


    ### Next.js 方式 - 两者的结合

    在了解了这两种技术的优缺点后，Vercel 允许我们选择在客户端还是服务器端来渲染内容。


    通常，当用户访问 Next.js 站点时，客户端向服务器发送请求，服务器开始执行 React 组件并生成 HTML、CSS 和 JavaScript 文件，并将完全渲染的
    HTML 作为响应返回给客户端。该文件包含了初始数据和标记，让客户端立即渲染，而无需等待 JavaScript 下载和执行。


    从这里开始，Next.js 接管并执行客户端水合（hydration）。你是否遇到遇到过水合错误（hydration error），即用户界面与最初在服务器上渲染的内容不匹配？嗯，这就是怎么回事。水合是将
    React 组件的预渲染 HTML 占位符（如 div、form、span）绑定事件处理程序和交互性，以与客户端渲染的内容保持一致。这是 Web 开发的热点：服务器端渲染（SSR）！


    对于随后的请求，你拥有完全控制是在服务器端（SSR）还是客户端（CSR）进行渲染。在接下来的章节中，我们将深入讨论不同类型的服务器渲染以及客户端渲染，以及何时使用何种。


    ## 它的原理


