  - "[PAGE 80]\n\nAsk yourself:\n\nDoes the component require user interactivity?\n\
    \nYes — Client Component\n\nNo — Server Component\n\nTo simplify things, the Next.js\
    \ documentation provides a helpful table \n\nthat guides you on where to render\
    \ each component.\n\nWhat do you need to do?\n\nServer \n\nComponent\n\nClient\
    \ \n\nComponent\n\nFetch data.\n\nAccess backend resources (directly)\n\nKeep\
    \ sensitive information on the server (access \n\ntokens, API keys, etc)\n\nKeep\
    \ large dependencies on the server / Reduce \n\nclient-side JavaScript\n\nAdd\
    \ interactivity and event listeners (onClick(), \n\nonChange(), etc)\n\nUse State\
    \ and Lifecycle Effects (useState(),  \n\nuseReducer(),  useEffect(), etc)\n\n\
    Use browser-only APIs\n\nUse custom hooks that depend on state, effects, or \n\
    \nbrowser-only APIs\n\nUse React Class components\n\n![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_80_0.png)\n\
    \nClient Vs. Server\n\n72"
  - "[PAGE 81]\n\nImpressive! You've just discovered one of the most significant features\
    \ \n\nof the modern era. Take a well-deserved break!\n\nReady for more?\n\nAnother\
    \ groundbreaking aspect of Next.js 13's app directory is that all \n\ncomponents\
    \ are automatically considered server components by \n\ndefault. That's right;\
    \ every component is treated as a server component \n\nunless specified otherwise.\n\
    \nSo how do we differentiate it from the client components?\n\nWell, it's as simple\
    \ as writing \"use client\" at the top of the component \n\nfile. It's a straightforward\
    \ and slick way to indicate that the component \n\nshould be treated as a client\
    \ component.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_81_0.png)\n\nThat's enough\
    \ theory for now. Let's dive into coding \n\nTo get started, follow the steps\
    \ outlined in the previous section to \n\nquickly set up a new Next.js project\
    \ within the same NextEbook folder.\n\nBefore proceeding, ensure that the terminal's\
    \ path points to the \n\nNextEbook folder and not the previously created introduction\
    \ folder. \n\nTo navigate out of the introduction folder, you can run the following\
    \ \n\ncommand:\n\ncd ..\n\nNow, execute the create\\-next\\-app command. In this\
    \ example, I'll be \n\nusing the name client\\-server for the new folder, but\
    \ feel free to \n\nchoose any name you prefer.\n\nClient Vs. Server\n\n73"
