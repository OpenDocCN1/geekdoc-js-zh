    \ \n\nthen React.js emerged to overcome the shortcomings and loopholes of \n\n\
    jQuery. However, even React.js has its own challenges, which have now \n\nbeen\
    \ addressed by another tool called Next.js.\n\nIt’s a big misconception that Next.js\
    \ is a new language or library. No!\n\nBirth\n\n05"
  - "[PAGE 8]\n\nVercel, the team behind Next.js, embarked on a unique approach to\
    \ \n\ndevelop a framework encompassing client-side (frontend) and server-\n\n\
    side (backend) functionalities within a single application. Guillermo \n\nRauch,\
    \ the original creator of Next.js and the mastermind behind \n\nSocket.IO, began\
    \ working on this idea in 2016.\n\nOver the course of a year, they continuously\
    \ added new features such \n\nas file-based routing, automatic code splitting,\
    \ hybrid rendering, \n\ninternationalization, image and font optimization, and\
    \ many more.\n\nThe relentless dedication of the Vercel developers, coupled with\
    \ their \n\nability to transform diverse ideas into reality, has caught the attention\
    \ \n\nof Meta (previously known as Facebook) — the creators of React.js. Meta\
    \ \n\nnow explicitly recommends that developers use Next.js as their primary \n\
    \ntool instead of relying solely on React.js. It's an extraordinary \n\nachievement!\n\
    \nAnd that’s how we developers now need to shift our focus to the latest \n\n\
    and greatest version, Next.js 13, to build highly capable and production-\n\n\
    ready applications. This exciting evolution opens up new possibilities \n\nand\
    \ opportunities for creating advanced web applications.\n\nOnto the next chapter…\n\
    \nBirth\n\n06"
- md: "\n## Chapter 2\n## Introduction\n\nIn this chapter, we'll dive into Next.js,\
    \ a flexible React framework. We'll explore its advantages over React.js, including\
    \ simplified frontend development, reduced tooling time, and an easy learning\
    \ curve. We'll also discuss how Next.js improves performance, enhances SEO, and\
    \ keeps advancing with new features.\n\nBy the end, you'll grasp the importance\
    \ of mastering Next.js and be prepared to embark on an exciting journey with this\
    \ framework.\n\n## Introduction\n\nNext.js — A flexible React Framework. But what\
    \ does that mean?\n\nIn software development, a framework serves as a tool equipped\
    \ with predefined rules and conventions that offer a structured approach to constructing\
    \ an application. It provides an environment that outlines the overall architecture,\
    \ design patterns, and workflows, allowing developers to focus on implementing\
    \ specific application logic rather than dealing with low-level design.\n\nSimply\
    \ put, a framework provides pre-built solutions for common functionalities such\
    \ as integrating databases, managing routing, handling authentication, and more.\n\
    \nSo what sets Next.js apart from React.js? — Next.js introduces plenty of features\
    \ and capabilities that we will dive into in the upcoming chapter in detail.\n\
    \nBut what you need to understand is Next.js is essentially an extension of React.js,\
    \ incorporating pre-built solutions, ready-to-use features, and some additional\
    \ functionalities. In other words, Next.js is built on top of React, expanding\
    \ its capabilities.\n\nIf you’re already a React.js developer, the Next.js journey\
    \ will be silky smooth. If you don’t know React.js, you should familiarize yourself\
    \ with some of the main foundations of React.js, i.e., How to create a component,\
    \ state management, code structure, etc.\n\nTo help you learn faster, we have\
    \ a crash course on React.js that covers all the important things and includes\
    \ a project for you to practice and test your skills:\n\n![](img/76188a8f748fc585400eeef7e6351b2a_11_0.png)\n\
    \nReact.js Crash Course\nWatch and Code Now\n\n### But Why should you use a React\
    \ Framework — Next.js?\n\nReact is constantly evolving and revolutionizing the\
    \ way websites are built. It completely transforms your approach to designing\
    \ and developing applications.\n\nIt begins by encouraging you to think about\
    \ components, breaking down the user interface into small pieces of code. You\
    \ describe states to introduce interactivity and establish connections between\
    \ these various components, shaping the flow of your application.\n\nImplementing\
    \ the great React architecture requires deep integration between all parts of\
    \ your application, and this is where frameworks come in:\n\n#### Less tooling\
    \ time\n\nEvery aspect of frontend development has seen innovation, from compiling,\
    \ bundling, minifying, formatting, etc., to deploying and more. With Next.js,\
    \ we won’t have to worry about configuring these tools, thus investing more time\
    \ in writing React code. We can focus more on business logic using open-source\
    \ solutions for routing, data fetching, rendering, authentication, and more.\n\
    \n#### Easy Learning Curve\n\nIf you are familiar with React.js, you will discover\
    \ Next.js is considerably simpler. Next.js, built on the foundation of React.js,\
    \ offers exceptional documentation that provides comprehensive and detailed information\
    \ on the why and how of using Next.js. The \"Next.js\" guide developed by the\
    \ Vercel team is regarded as one of the best resources for the learning experience.\n\
    \nIntroduction | Learn Next.js\n\nThe constant updates and help from the community\
    \ make the development process even easier. One of the key aspects of Next.js\
    \ is that it is not just a Frontend React Framework but a Full Stack React Framework\
    \ enabling you to write backend code alongside your frontend code.\n\nHow does\
    \ it contribute to an \"Easy Learning Curve\"? Wouldn't it be another thing to\
    \ learn?\n\nAbsolutely not.\n\nThe backend aspect of the code you'll be working\
    \ with is much simpler than you might anticipate. There's no need to set up anything\
    \ or configure any routes as we have to do for any traditional backend app.\n\n\
    In fact, the Vice President of Vercel, Lee Robinson, expressed the following viewpoint:\n\
    \nMoving from React + Express + Webpack to a framework resulted in removing 20,000+\
    \ lines of code and 30+ dependencies – while improving HMR (Hot Module Reloading)\
    \ from 1.3s to 131ms.\n\n![](img/76188a8f748fc585400eeef7e6351b2a_13_0.png)\n\n\
    If the backend and tooling aspects discussed here seem confusing, there's no need\
    \ to worry. In the upcoming chapters, we will dive into a practical comparison\
    \ of how things are done with React.js and Express.js, as well as how both can\
    \ be accomplished within Next.js.\n\n#### Improved Performance\n\nNext.js offers\
    \ built-in features like server-side rendering, static site generation, and automatic\
    \ code splitting, which optimize application performance by enabling faster initial\
    \ page loads, improving SEO, and enhancing the user experience.\n\nHowever, it\
    \ doesn't mean server-side capabilities are limited to Next.js. React has introduced\
    \ a new concept called Server Components, which allows rendering components on\
    \ the server.\n\nSo, why choose Next.js over using React alone? The advantage\
    \ lies in the convenience and productivity provided by Next.js. By utilizing Next.js,\
    \ you can leverage the existing features without the need for extensive setup.\n\
    \n#### SEO - Search Engine Optimization\n\nPerhaps the most ignored and must topic\
    \ in application’s life, the drawback of React.js. The key difference lies in\
    \ the rendering approach between Next.js and React.js.\n\nSearch engine crawlers\
    \ are like busy visitors to websites. They come and ask for the content of pages.\
    \ They explore the links on those pages, carefully examining and organizing them\
    \ for ranking purposes. This is what they do every day. To do their job well,\
    \ they need to be able to access the content of pages.\n\nReact.js renders everything\
    \ on the client side, sending a minimal HTML response from the server. The server\
    \ sends a minimal HTML file and a JavaScript file that the browser executes to\
    \ generate HTML. This poses a challenge for search engine crawlers to access and\
    \ understand the complete content of the page.\n\nOn the other hand, Next.js provides\
    \ the option of Static Site Generation (SSG) or Server Side Rendering (SSR). With\
    \ SSG or SSR, the server sends the complete HTML file and minimal JavaScript code\
    \ to render only the content requiring client-side interaction. This enables search\
    \ engine crawlers to access easily and index every page of the website accurately.\n\
    \n#### Always Advancing\n\nNext.js, the ever-evolving framework, consistently\
    \ introduces new features to simplify developers' lives. With over 7+ versions\
    \ released last year, Next.js focuses on innovation and improvement for a better\
    \ user experience. This is precisely what frameworks like Next.js aim to achieve.\
    \ \n\nOn top of that, other technologies like Expo, used for building React Native\
    \ projects, are also adopting Next.js's groundbreaking features. Inspired by Next.js's\
    \ file-based routing system, Expo developers have implemented a similar feature\
    \ — Expo Router to improve the decade-old routing system in React Native.\n"
