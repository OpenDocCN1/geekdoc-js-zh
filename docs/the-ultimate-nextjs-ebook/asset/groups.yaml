    \  padding: 6rem;\n  min-height: 100vh;\n}\n```\n\n在我们的 `page.js` 文件添加 `console\
    \ log` 后，让我们打开浏览器看看它是否在那里：\n\n安装完成后，使用 `cd` 命令进入 `client-server` 文件夹并启动应用程序。\n\
    \n![](img/76188a8f748fc585400eeef7e6351b2a_83_0.png)\n创建 Next App\nhttp://localhost:3000\n\
