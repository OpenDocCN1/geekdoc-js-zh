- md: '

    ## What’s the catch?


    ### Processing

    Most processing occurs on the client side, meaning the user''s web browser is
    responsible for rendering the HTML page and executing any JavaScript code present.


    However, if the website is complex and the user''s device needs more capabilities,
    it can strain the browser and create a burden for it to handle.


    ### Bandwidth

    As the server sends complete files to the client for each page request, it increases
    bandwidth usage. This becomes particularly significant when dealing with complex
    websites containing numerous pages and video and audio clips scattered throughout
    the site.


    ### Load Time

    The initial page load time may be longer when compared to the latest technologies.
    This is due to the complete transfer of files for each request. Only after the
    server has sent all the necessary files and the browser has finished parsing everything
    will we be able to view the website''s content.


    ## How it works


    ### The React way

    This is where React comes in. It improved the development lifecycle by introducing
    components, virtual DOM concepts, and the client-server mechanism.


    When you access a React website, the client''s browser sends a request to the
    server for the webpage content. In response, the server sends a minimal HTML file,
    which serves as the entry point for the entire application, along with a bundled
    JavaScript file.


    React initiates client-side rendering using this JavaScript file, manipulating
    the virtual DOM. Instead of directly modifying the actual DOM, React updates the
    virtual DOM and then applies only the necessary changes to the real DOM, resulting
    in the desired page display.


    React utilizes its client-side routing library, React Router, to navigate to different
    pages within the React application. This library enables changing the route without
    a full server request, preventing page refreshes.


    React Router re-renders the relevant components based on the new URL when a new
    route is triggered. If the new page requires fetching data from the server, the
    corresponding components initiate requests to retrieve the necessary data.


    ## How it works


    ### What’s the catch?


    ### Complexity

    Building a React application can present greater complexity than traditional HTML,
    CSS, and JavaScript websites. It involves thinking in components, managing state
    and props, and working with the virtual DOM, which may require a learning curve
    for developers new to React.js.


    ### Processing

    Similar to the traditional approach, react primarily performs client-side rendering.
    It heavily relies on JavaScript for initial rendering and subsequent requests
    to update the user interface, which are all handled on the client’s browser.


    However, this reliance on client-side rendering can delay rendering and interactivity,
    particularly on devices with slower processors and limited resources.


    ### SEO

    Yes, if you recall, we previously touched upon a notable drawback of React compared
    to Next.js in the Introduction chapter.


    The issue is that search engine crawlers might need help fully accessing the website''s
    content since everything is handled through JavaScript and only rendered on the
    client side. As a result, it impacts the website’s visibility in search engine
    results.


    ## How it works


    ![](img/76188a8f748fc585400eeef7e6351b2a_51_0.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_1.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_2.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_3.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_4.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_5.png)![](img/76188a8f748fc585400eeef7e6351b2a_51_6.png)


    ### The Next.js Way - A blend of both

    Knowing the benefits and limitations of both techniques, Vercel allowed us to
    choose where to render the content, on the client or server.


    Typically, when a user visits a Next.js site, the client sends the request to
    the server, which starts executing React Components generates HTML, CSS, and JavaScript
    files, and sends back the fully rendered HTML to the client as a response. This
    file includes initial data and markup, making the client render it immediately
    without waiting for JavaScript to download and execute.


    From here, Next.js takes over and performs client-side hydration. Have you ever
    encountered the issue of hydration error where the user interface doesn''t match
    what was originally rendered on the server? Well, this is what it is. Hydration
    is attaching event handlers and interactivity to the pre-rendered HTML placeholders
    of React components i.e., div, form, span, to match what is being rendered on
    the client side. This is the hot topic of web development: Server Side Rendering!


    For subsequent requests, you have full control over to render on the server side
    (SSR) or the client side (CSR). In the following chapters, we’ll talk in-depth
    about different types of server-side rendering along with client-side rendering
    and when to use what.


    ## How it works


    ### Chapter 5: Create Next.js Application

    In this chapter, you will learn how to create a Next.js application. You''ll start
    by setting up the necessary tools like Node.js and VS Code. Then, you''ll create
    a new Next.js project using `create-next-app`. You''ll explore the project structure
    and understand the purpose of important files and folders. Finally, you''ll learn
    about `jsconfig.json` and `package-lock.json` and their significance in managing
    dependencies.


    ## Create Next.js Application

    By now, you should fully understand how websites load. Now it’s time to learn
    how to create websites using Next.js. Setting up a Next.js application can be
    done in various ways. However, before we dive into that, there are a few things
    we need to have in place to get started with Next.js.


    The first requirement is having Node.js 16.8 or a more recent version. It''s worth
    noting that there is a common misconception that Node.js is a new programming
    language. In reality, it’s a JavaScript runtime that enables the execution of
    JavaScript code outside of a web browser.


    If you haven''t installed Node.js before, you can visit this and start downloading
    it. The website will give you two options based on your operating system: LTS
    and Current. The LTS (Long Term Support) version is the most stable, while the
    Current version is like a "Work in Progress" that adds new features but may have
    some bugs.


    So, did you download it? To determine the version you''re using and check if you''ve
    downloaded Node.js, you can execute this command in your terminal or Command Prompt
    to verify:


