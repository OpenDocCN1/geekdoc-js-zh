  md: '# # 2

    The Different Approaches of Web Programming


    # BEFORE WE GET STARTED


    Before I head on and start explaining the different languages available in the
    Web programming market, let me stress that all the opinions stated are exclusively
    my personal views. I tend to be very opinionated, but I will try to justify both
    my criticism and praises of the different languages presented.


    # THE BASICS—HTML


    The very first programming language that must be mentioned when discussing Web
    programming is obviously HTML. The WWW could not be what it is today if it weren''t
    for it. The HTML (HyperText Markup Language), as the name indicates, a “markup”
    language, which generally means it is based on the use of tags to provide functionality.
    The “code” in an HTML file is simple text containing those tags that provide functionality
    and different looks to the page. It is an interpreted client-side language, meaning
    that for an HTML page to be viewed, a browser must first download it from a server
    to a client machine and execute the code by line.


    HTML relies strongly on the use of Universal Resource Identifiers (URI). Each
    URI represents a way to refer to a page, an image, or an email


