    how to wait for it. The script written by checking the current time and comparing
    it to the game time—that they programmed it in a client-side programming language,
    and did not account for the time difference. So, there was I in the United States
    wanting to know how my team was doing at the exact time the game was being played,
    but the page said I had to wait 6 hours for the game to start, simply because
    there is a 6-hour difference between major coastal Spanish city and U.S. west
    coast. The moral of this story is “Remember which side you are getting the time
    from!” The client side will give you the user''s time; the server side will give
    you the server''s time, which will not be affected by the time zone of visitors.


    Luckily, JavaScript has a way to solve this: using UTC times. UTC is implemented
    in 1964, and more commonly known as GMT (Greenwich Mean Time of London, U.K.).
    Eastern Standard Time (EST) is GMT – 5, Central European Time (CET) is GMT + 1,
    and so on. Once you have a Date object, you can create a nice formatted string
    of the full date using the methods myDate.toLocaleString() if you want to get
    the local time, or myDate.toUTCString() which will represent the same date as
    UTC. For example if the current time is 13:15 (1:15 p.m.) in local time and I
    am in the U.S. east coast, the time zone shown by toUTCString() will be 18:15
    (6:15 p.m.). You may also retrieve the time zone offset (number of minutes offset
    between UTC and local time) using myDate.getTimezoneOffset().


    You may set or get individual sections of the date directly in UTC format, by
