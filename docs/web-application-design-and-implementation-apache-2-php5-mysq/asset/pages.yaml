  md: '# Appendix B


    # Installing on UNIX


    In most cases, your UNIX distribution will install everything for you, but if
    you are one of the unlucky UNIX users who have to install everything manually,
    follow these directives on Apache, PHP, and MySQL installation. This just reflects
    installation steps, as the configuration is pretty much the same as installing
    on a Windows-based computer. I will assume that you have root access in your UNIX
    server, since you will need it on many of the steps. If you do not know root access
    is, I advise you to contact your system administrators and have them install everything
    for you. This should spare you headaches, and your system administrators will
    be much happier as they will make sure that everything is done properly. The installation
    steps will assume that you are using default configuration options. For more advanced
    options, check www.apache.org, www.php.net, and www.mysql.com. I will not explain
    how to install phpBB or phpMyAdmin, as it is the same as a Windows installation.


    # INSTALLING Apache AND PHP


    Download the most recent version of Apache 2.2 and a fitting PHP version from
    the aforementioned places. This quick guide covers only the basics to get you
    started with Apache 2.0 and PHP. For more information, read the Apache documentation.
    The version numbers have been omitted, here


    > Web Application Design and Implementation: Apache 2, PHP5, MySQL, JavaScript,
    and Linux/UNIX. by Steven A. Gabarró

    Copyright © 2007 by John Wiley & Sons, Inc.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# APPENDIX B


    ensure that the instructions are not incorrect. You will need to replace the

    "NN" here with the correct values from your files. (Note: The following guidelines
    were accepted directly from the PHP online manual.)


    +   1. gzip -d httpd-2_NN.tar.gz

    2. tar xvf httpd-2_NN.tar

    3. gunzip php-NN.tar.gz

    4. tar -xvf php-NN.tar

    5. cd httpd-2_NN

    6. ./configure --enable-so

    7. make

    8. make install


    Now you have Apache 2.2.NN available under /usr/local/apache2, configured with
    loadable module support and the standard MPM prefork.

    to test the installation use your normal procedure for starting the Apache server,
    e.g.:


    ```

    /usr/local/apache2/bin/apachectl start

    stop the server to go on with the configuration for PHP:

    /usr/local/apache2/bin/apachectl stop.

    ```


    +   9. cd ..//php-NN


    +   10. Now, configure your PHP. This is where you customize your PHP with various
    options, like which extensions will be enabled. Do a ./configure --help for a
    list of available options. In our example we''ll do a simple configure with Apache
    2 and MySQL support. Your path to apxs may differ, in fact, the binary may even
    be named apxs2 on your system.


    ```

    ./configure--with-apxs2=/usr/local/apache2/bin/apxs--with-mysql

    ```


    +   11. make

    12. make install


    If you decide to change your configure options after installation, you only need
    to repeat the last three steps. You only need to restart apache for the new module
    to take effect. A recompile of Apache is not needed.


    Note that unless told otherwise, "make install" will also install PEAR, various
    PHP tools also as phppize, install the PHP CLI, and.


    +   13. Setup your php


    ```

    cp php.ini-dist /usr/local/lib/php.ini

    ```


    You may edit your .ini file to set PHP options. If you prefer having php.ini in
    another location, use --with-config-file-path=/some/path in step 10.


    If you instead choose php.ini-recommended, be certain to read the list of changes
    within, as they affect how PHP behaves.'
