  md: 'will make our job so much easier. My "second best" option for databases would
    be PostgreSQL, similar to MySQL with even some extra features, but again, we shall
    follow the path of simplicity for this book.


    Finally, and pretty much importantly, these are the languages that I have been
    using for years, and I never had any problems with them. Knowing how to properly
