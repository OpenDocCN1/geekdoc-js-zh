- img_proc: true
  md: '# MY CHOICES—PHP, MySQL, JavaScript 25


    any calculations or actions that might take place, allows programmers to create
    Webpages that will change dynamically as the code is executed.


    Server-side applications run in the server, as the term indicates. This means
    that when a client attempts to access a script programmed that way, the query
    is sent to the server along with any input the script might need. The script runs
    on the server, utilizing server resources only, and then sends the final output
    to the client, who can see only that result, and has no access to the source code
    itself. This is obviously a great asset for security reasons. Another great advantage
    of having scripts run directly on the server is that you need to worry only whether
    the server knows how to run it properly. Unlike the scenario in clientside applications,
    the script will run exactly the same way, producing the same output regardless
    of the client''s platform or browser. On the negative side, each time you wish
    to do something dynamic, you must communicate back and between client and server.


    Now that we know the differences between both sides, it is general to choose your
    preference, by selecting the language to use. Most developers, and therefore most
    books out tend to choose only one side, but not me. Even though it is possible
    to create Websites based on one technology, taking advantage of server-side and
    client-side programming simultaneously gives much more flexibility and allows
    a greater set of functionalities. Some features run better in client-side, in
    server-side, restricting yourself to only one will potentially limit your final
    project. Throughout this book we will learn when it is better to use a client-side
    language such as JavaScript, or a server-side language like PHP.


    # MY CHOICES—PHP, MySQL, JavaScript


    Now that we have seen some of the most common options that programmers face when
