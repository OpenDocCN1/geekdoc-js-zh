  md: 'Regular timers are like timeouts, except that they restart the timer after
    each timeout. The function used in that case is setInterval(''functionName'',
    time); for example


    ```

    var timerID = setInterval(''alert(''Hello''), 5000);

    ```


    This would run the alert(''Hello'') every 5 seconds. With timeouts, you can clear
    the interval by doing clearInterval(timerID).


    # TIME TO PRACTICE!


    Now that you know the basics of event programming, try writing a script containing
    a button that keeps track of how many times it has been clicked. Realize that
    variables defined outside a function are considered global. They are accessible
    inside any function, so you can use that fact to your advantage. Also remember
    that the text on a button is set by its attribute value.


    Another thing to do is an event log. Create a form with different types of inputs,
    such as radio buttons, regular buttons, text and password fields, and text areas.
    Now make sure that you have at least one large text area that you will use to
    keep track of all the events that occur. Set up each input you created with all
    the events you might want to test out, and have each function display the latest
    event at the end of the large text area. Remember that you can access the contents
    of a text area through the value field of the tag, and also that you can concatenate
    text using the plus (+) sign. Also, if you wish to include a "clear" button, you
    can either simply include an empty string ("") in the value field of your text
    area by doing


    ```

    document.myForm.textArea1.value = "";

    ```


    Finally, use intervals or timeouts to create a banner changer. Have a set of images
    with their URLs stored in an array, and set a timer that will change the image
    every few seconds.'
