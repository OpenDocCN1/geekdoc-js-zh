  md: '# JavaScript SYNTAX


    # Types of Data and Variables


    In JavaScript, as in PHP, any data has a type associated with it, which can be
    numerical, text, or, or more complex data such as arrays or objects. When writing
    a string, make sure to surround it by either double or single quotes. You may
    also use any of the special characters such as `\b` for backspace, `\n` for return
    carrier, `\t` for a tab, `\''` for a single quote, `\"` for double quotes, `\\`
    for backslash, or `\NN` (where NN is a hexadecimal number) to write the character
    with ASCII code `\NN`. You can also use `true` and `false`.


    In PHP, JavaScript does not need to specify the type that a variable will hold,
    and you can switch the contents of a variable from a number to a string, to an
    object, or to anything you need. Variables in JavaScript do not need special characters
    as the dollar sign used in PHP. For this reason, the browser to understand that
    variable, by putting the keyword `var` before the variable the first time you
    use. Variable names must start with a letter, and can be composed of any letters,
    numbers, and the underscore symbol (_). Here is a small example of how you would
    declare a variable, we will assign a number to it, and then switch to a string
    (this code, of course, be surrounded by the SCRIPT tags!):


    ```

    var myVar;

    myVar = 23456;

    alert(myVar);

    myVar = "Hello World!";nalert(myVar);

    ```


    Remember to put a semicolon at the end of each line of code. As you can see, alert
    is very flexible, and can show any data of primitive types.


    # Operations and Calculations


    To assign a value to a variable, simply use the equal sign. You may use numerical
    calculations between variables with the arithmetic operators +, -, *, /. The plus
    sign can also be used to concatenate strings, so you could output a mix of strings
    and variables by writing, alert("Variable 1 is " + var + " and variable 2 is "
    + var");


    You can use the same postfix(++), preincrement(++), decrement(--) used in PHP.
    You can also precede the equal sign with an operator to do things like var *=
    5; Remember that something of the type variable operator *== expression is equivalent
    to variable = variable expression. You may therefore use it not only with numbers
    but also, for example, strings myString +=="this will be concatenated to myString";
