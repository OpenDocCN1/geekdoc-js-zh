    include("/include/class.FastTemplate.php");


    Then you will need to create an object of the class FastTemplate and use some
    of its methods to set up your final page.


    To create a FastTemplate constructor, decide on its name (e.g., $tpl) and use
    the FastTemplate constructor, providing the path to the template files. For example,
    if your template files are in .templates/, you would write


    ```

    $tpl = new FastTemplate("./templates/");

    ```


    The basic methods needed to use templates are define, assign, parse, and FastPrint.
    Define and FastPrint will be used only once per page, whereas assign and parse
    might occur a variable amount of times, depending on the number of "variables"
    used.


    The define method takes an associative array in which the elements are the name
    of the template files to use and their keys are abbreviations of those pages.
    Choose easy-to-remember names for the keys, as you will refer to the templates
    through these abbreviations. For example, if we needed to use the files mainpage.html
    and tabrow3.html, you would write


    ```

    $tpl->define(array("main"=>mainpage.html", "row"=>tabrow3.html"));

    ```


    The next step is to assign to all the template variables of the template file
    that we wish to parse. Simply call the assign method with the name of the variable
    you want to set up and the value you want to assign to it. This information will
    be saved inside the template object and used when you parse a file (see next paragraph).
    For example, to set up your template variable ($CELL_1), I would write


    ```

    $tpl->assign("CELL_1", $value);

