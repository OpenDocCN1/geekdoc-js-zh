  md: '# 192 PROGRAMMING THE BROWSER


    +   * mouseOut—triggered when the mouse leaves the element

    * mouseDown—triggered when the mouse button is pressed (a click is a combination
    of mousedown and mouseup)

    * mouseUp—triggered when the mouse button is released over the element

    * keyDown—as onMouseDown with the keyboard

    * keyUp—same as mouseUp but with the keyboard

    * keyPress—same as mouseclick but with the keyboard (same as keyDown followed
    by onKeyUp)

    * onLoad—triggered when the event finishes loading (usually put in the BODY tag)

    * onload—triggered when you leave a page

    * onChange—triggered when the element changes (useful mostly in text fields)

    * onSelect—triggered when a menu option is selected

    * onResize—triggered when the window is resized (would be placed inside the BODY
    tag)

    * onReset—triggered when a form is reset

    * onMove—triggered when the window is moved (would be placed inside the BODY tag)

    * onFocus—triggered when an element gains the focus (cursor entering a text area,
    for example)

    * onError—triggered when there is a JavaScript error

    * onDragDrop—triggered when an element is dragged and dropped in the browser window

    * onBlur—triggered when an element loses focus

    * onAbort—triggered when the loading of a page is interrupted


    Once you know which event you want to use, you decide what action to take. The
    general procedure is to create a function in JavaScript that will be called by
    your event handler. Simply write the name of the method between double quotes
    to the event, inside the tag that will handle the event. For example, `<BODY onload="load()">`
    would call the JavaScript function load() whenever the body of the page finishes
    loading. Note that you may also call the methods with any parameter you wish to
    use, so you can use the same function for different elements. I personally like
    putting all event functions inside the HEAD tags, which helps keep the body as
    clean as possible, concentrating all functions outside it. This also allows the
    functions to load before the body does, so that as soon as you need to use them,
    the browser already knows them.


    Here is a few little example. We will have a link with an onClick attribute that
    will popup an alert message, a button input with an onMouseEnter'
