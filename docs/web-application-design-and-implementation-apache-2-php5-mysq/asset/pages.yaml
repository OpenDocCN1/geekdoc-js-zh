    # USING OBJECTS


    Recall that an object is an instance of a class, which means an element that holds
    data members that define it, as well as methods. For example, an object "car"
    can have the properties "color," "brand," or "mileage." The methods inside the
    object are actions that can be done with the particular object. For an object
    car you could fillTank(), changeColor(), and so on.


    To create an object you need to use the keyword new, like this:


    ```

    var MyVar = new ObjectName(constructor parameters);

    ```


    Remember that JavaScript is an object-based language, not an object-oriented language.
    Therefore you may not create new classes, but you may use any of the preexisting
    ones. We have already used Arrays, and as you have noticed, we used the keyword
    new to create arrays. This is due to the fact that arrays are actually objects!
    We will now see some of the most important available classes that can be used
    in JavaScript to create objects.


    # The String Objects


    Yes! Strings are objects too!! They are special objects that do necessarily need
    to be created. You can create strings either by writing a string between single
    or double quotes, or by using new String(), in which case the constructor can
    receive a string or a number. For example, string = new String("123.345") will
    create the string "123.345." As you can see, converting numbers to strings is
    really simple. Here is a list of data members and methods that can be used with
    strings (you do not need a variable to use these methods and you may use them
    right after a string double quotes, e.g., "hello".length would return 5):


    +   * length—for example, myString.length is a data member holding the number
    of characters in the string.


    +   * charAt(position)—for example, myString.charAt(4) returns the character at
    the position provided as a parameter. Note that indices start at 0, so our example
    would return the fifth character.


    +   * charCodeAt(position)—same as charAt but returns the ASCII code of the character
    rather than the character itself


    +   * FromCharCode(list of numbers)—this method is actually used to create strings
    from a set of ASCII codes. Instead of using a name of object in front of the method,
    use the class name String. You could write, for example, var myString=String.fromCharCode(61,
    62, 63); which would create the string "abc".


    +   * indexOf(string, position)—for example, myString.indexOf("find"), 0 will
    find the index of the first match of the provided string ("find")


