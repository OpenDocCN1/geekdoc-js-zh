  md: '# 11


    # Using Databases


    # OVERVIEW


    Now that we are familiar with PHP, it is time to move on to databases, so we can
    start designing database-driven Websites. This chapter will cover database principles,
    as well as MySQL basics. The following chapter will be devoted to mixing PHP and
    MySQL before we move on to JavaScript.


    # DATABASE BASICS


    As the word indicates, a database is basically a base of data, or if you prefer,
    a set of data with a structure that is similar to real-life situations. It allows
    you to store any type of information you need, and it can be accessed by any user
    with the proper rights.


    # The Entity Relationship Model


    An entity is a real-life object, such as for example, "Steven Gabarró," or a receipt
    for a purchase made on specific date in a specific store. An entity type defines
    a group of entities with the same characteristics like "workers" or "receipts.".
    Basically, an entity is to an entity type what an object is to a class. An entity
    is a specific instance of an entity type. Entities can be'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 138 USING DATABASES


    | Entity1 | Entity2 |

    | --- | --- |

    | id entity1 | id entity2 |

    | Attribute1 | AttributeA |

    | Attribute2 | AttributeB |


    Figure 11.1 Entity relationship model.


    through relationships usually named as actions. Each entity type has a set of
    attributes that help define different entities at the same time. For example,
    name and age would be attributes of the entity type "workers".


    When an entity is identified individually with a single attribute or a small set
    of attributes, these are considered index keys. If there is more than one index
    key, one of them has to be set as a primary index key. If an entity cannot be
    identified through its own attributes, and if it needs a relation with another
    entity, it is called a weak entity. Any relationship to a weak entity is called
    a weak relationship.


    Relationships between entities have a complexity of either 1:1, 1:n (or n:1),
    or n:m. If you have a 1:1 relationship between Entity1 and Entity2, this means
    that for each entity of Entity2 related to it and vice versa. A relationship of
    1:n would mean that each entity of the type Entity1 can have n associated entities
    of type Entity2, but a single element of Entity2 can be associated with only a
    single element of Entity1. The relationship n:1 is the reverse of 1:n. Finally,
    a relationship n:m means that an item of Entity1 can be related to many items
    of Entity2, and an item of Entity2 can be related to many items of Entity1.


    An example of an entity relationship model is shown in Figure 11.1.


    # More Practical Examples


    Let us imagine that you are creating a database to hold the exams you give in
    a class, as well as the grades of all students. You will need a table students
    that will contain all students with attributes such as id_student, name, surname,
    and email. You then need a table tests to hold all tests, although our tests do
    not have the same number of questions, it is not a good idea to include the actual
    questions in the table containing the actual tests. Instead, we will just store
    id_test, title, and advantage of id_test, we will have a table question_in_test
    with the questions used in each test. This could make us think of something interesting:
    What if a teacher likes to reuse some questions in different tests? Is it a good
    idea to hold the same string with the question as two separate entries? Well,
    I recommend that you always avoid redundancies, and storing two full questions
    with exactly the same data except the id of the test seems redundant. Therefore,
    we will use a separate table questions that will contain id_question, question,
    and answer. The id'
