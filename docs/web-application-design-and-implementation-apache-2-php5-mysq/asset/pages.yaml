  md: '# Introduction


    # Web Application Recipe


    # OVERVIEW


    You might be wondering why you are reading an "Introduction" chapter and why this
    chapter is called "Web Application Recipe.\ Well, this chapter is your quick guide
    to professional Web application design and implementation. It is in essence a
    summary of the last chapter of the book (Chapter 19), created mainly for people
    with enough experience in Web programming to skip some of the chapters presented.
    This chapter will give you the rundown of the major steps in the lifecycle of
    a Web project, and will refer to the chapters where you find more in-depth information
    on the topics covered. I call it the "recipe" because it gives you the general
    layout of what needs to be done, before getting into the specific details that
    each individual chapter will cover. For a more in-depth guideline with a practical
    example, be sure to read Chapter 19.


    # PROCEDURE


    Step 1—Understanding the Problem and Finding the Solution


    The first step in Web development (and any type of project, to be honest) is to
    understand what the problem is, as well as what input will be used and'
  merge: -1
