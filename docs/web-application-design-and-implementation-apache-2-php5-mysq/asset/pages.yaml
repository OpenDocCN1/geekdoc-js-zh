    \ no name. JavaScript will allow us to go a step further and create new windows\
    \ with the set of properties we need.\n\nThe basic syntax of window creation is\
    \ calling the open method from the page to open, the title to give the window,\
    \ and a list of window features. For example, if you wanted to create a popup\
