  md: "An object is an instance of a class, or more basically a specific item that\
    \ can be part of a class. For example, with the class Car, you could have an object\
    \ myDViper (I). The object will contain specific data that will define it; for\
    \ example, in this case manufacturer would be equal to Dodge model would be equal\
    \ to Viper.\n\n# CLASSES IN PHP\n\nTo create a class in PHP, you start by writing\
    \ class followed by the name of the class. Once you are in the class, you can\
    \ create functions as you would outside a class. The difference will be that definitions\
    \ of functions defined inside a class will be methods of the class. In order to\
    \ call a method of a class you have two choices: either creating an object of\
    \ your class and invoking the method (see below) or calling the method statically\
    \ through the class name:\n\n```\n<?php\nclass SimpleClass\n{\n    // member declaration\n\
    \    public $var = 'a default value';\n\n    // method declaration\n    public\
    \ function displayVar() {\n        echo $this->var;\n    }\n    public static\
    \ function statMethod(){\n        echo \"This is a static method\";\n    }\n}\n\
    $a = new SimpleClass(); // we create an object of the\n//class SimpleClass\n$a->displayVar();\
    \ // we invoke the method displayVar\n//through the object $a\nClass::statMethod();\
    \ // We call the static method\n//statMethod\n?>\n```\n\nIt is possible to use\
    \ inheritance in PHP, through the keyword extends. Inheritance is the process\
    \ of deriving a class from another one. When you derive from a class (your parent\
    \ class), you are its child, and inherit any of the parent's data members and\
    \ methods. This means that you can use any of the parent's public methods without\
    \ needing to redefine them. To show that a class derives from another one, add\
    \ extends ParentClass at the end of the class definition line. Check the example\
    \ at the end of the next section."
