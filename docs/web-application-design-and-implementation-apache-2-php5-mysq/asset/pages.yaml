  md: 'used by Web applications. The other option is to have the server running only
    when you decide to launch it manually on a nondefault port. I recommend the first
    option. Choose the “typical” installation, and select the folder in to install
    it (I will assume that you used the default folder in further steps). Click “next”
    and then “finish.”


    # Checking the Installation


    At this point the application should automatically install and start running.
    It is time to check the installation. Your stray (that area with little icons,
    on the bottom right of your desktop, where the clock is) should have a new icon:
    red feather with a green “play” symbol. If you see the green symbol play, Apache
    is running, but if you see a red “stop” symbol, this means that the server could
    not start. Doubleclicking on the icon will bring up the Apache service monitor,
    which will allow you to start, stop, or restart the server. Keep in mind that
    you will need to restart the server each time you modify your configuration, so
    get familiar with the tool. When you are done with it, click on “OK.”


    # Possible Errors


    If for some reason Apache is not running at this point, chances are you will get
    an error message saying “Service not installed.” This is usually due to other
    services running on port 80, which prevents installation of other services on
    the same port. Luckily, we can change Apache’s standard port. To do so, open a
    command console (click “start,” “run,” and type “cmd”), in the console access
    your Apache installation folder (C:/Program Files/Apache2/bin), and type “apache–k
    install”. That should install the service, but you may still get an error saying
    “could not bind to address 0.0.0.0:80”. Note that “/” means [/Apache2/conf/httpd.conf
    and open it. This is the most important file for Apache; it is its configuration
    file and is loaded each time the server is started. The line that says “Listen
    80” and replace it with “Listen 127.0.0.1:80”, and again try to run the “apache–k
    install” on your console. If that does not work, replace that line with the same
    name. The reasons for these different errors are all related to Windows services,
    and the way you access the server. The line “Listen 80” means that Apache tries
    to accept incoming requests through port 80 on the local computer. Sometimes the
    server is incorrectly installed, and there is no reference to what constitutes
    the “local” computer. To force this binding, we add the 127.0.0.1 IP address,
    which always represents the local computer. We are basically telling Apache which
    socket to use to accept all communications. If another service is running on port
    80, this will still not work; hence the need to change Apache’s port to something
    else. The port 8080 is the standard “Alternative” for Web servers.'
