    # MySQL Syntax


    Before we go into MySQL syntax, I would like to explain some standard notations
    that I will use to explain the different commands. Whenever you use a group of
    text between square brackets in a syntax line (e.g., [UNSIGNED]), you may use
    it or not use it depending on what you are trying to achieve.


    A group of elements separated by the pipe sign "|" and surrounded by curly braces
    { } implies a choice. Simply read the pipe as "or"; for example, if you see "integer
    | real | string", this means the whole block between the opening and closing brace
    must be replaced by either the word integer, real, or string, and that exactly
    one of the blocks must be used, no more, no less. You may also see the pipe sign
    separating options inside a set of square brackets, meaning a choice between the
    different options, so that only one option maximum can be used. For example, if
    you see "[FIRST | AFTER position]," this means that you can write FIRST, AFTER
    position or simply nothing at all.'
