  md: '# HOW DOES HTML WORK?


    # Syntax Basics


    HTML is a markup language and, as such, works entirely through the use of tags.
    Each tag is used to define different parts of the file, different styles, links,
    embedded elements, forms, and so on. Each tag starts with the character "<\ and
    finishes with ">". Keep this in mind because these characters are restricted for
    tags, meaning that your page might behave in a strange way if you attempt to use
    it in a normal string. If you wish to use that character, refer to the special
    characters table shown in Appendix A. Now, some tags require an opening and a
    closing tag in order to show the area of the effect. In those cases the closing
    tag will always start with "</", followed by the name of the tag it is calling
    (without the attributes list) and ".


    For example, to have some attribute color set to "white", you could use the FONT
    tag, To do so, your opening tag would be <FONT color="white\> and your closing
    tag would be </FONT> Your Your final portion of code could look like this:


    ```

    <FONT color="white"> This text will show up in white</FONT>

    ```


    Note that HTML is not case-sensitive, so you can mix uppercase and lowercase letters.
    Nevertheless, I strongly advise everyone to capitalize all tags since it makes
    code reading much easier.


    Finally, remember to name your files with either .html or .htm as extension.


    # File Structure


    It is very important to understand the basic structure of an HTML file, knowing
    exactly where each part of your code must be written. It is something easy to
    remember, but unfortunately there are still people who claim to be Web programmers
    but misuse the file''s main areas. Web design and programming demands efficiency
    and effective use of the available tools. This book is designed to avoid these
    pitfalls.


    The first thing is the full file, which must always start with the tag <HTML>
    and finish with </HTML>. You should never have HTML tags before the opening tag,
    nor after the closing one. One of the reasons for this occasional error is the
    the most browsers can now ignore errors like this and still manage to create a
    proper-looking output, but please always start your files by setting these two
    tags.


    The next section to know is the header, limited by the tags <HEAD> and </HEAD>.
    This section holds all information related to the file, including its author,
    its keywords, and sometimes some JavaScript functions that will be used in the
    page. Most basic pages use the header only to specify'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# HOW DOES HTML WORK? 29


    the title that will appear in the browser window. To do so, use the <TITLE>...
    </TITLE>. Any text written between the opening and closing tags will appear in
    the title bar of the browser.


    The final area is the body, starting with <BODY> and finishing with </BODY>. The
    body of the page is the actual content of the page, meaning that the data will
    appear inside the browser window. The body tag can accept a set of properties
    that allow you to set up a background image (background) or color (bgcolor) specify
    font colors for text (color), links (link), visited links (vlink), active links
    (alink), and ever event scripts to run on load or unload of the page. there should
    always be a section in a Webpage, unless you are using the page as a framaset
    definition page (see discussion later).


    Here is an example of what a “Hello world” HTML page should look like:


    ```

    <HTML>

    <HEAD>

    <TITLE>Hello World Page</TITLE>

    </HEAD>

    <body>

    HELLO WORLD!!!<BR>

    And have a nice day!

    </BODY>

    </HTML>

    ```


    Note the indentation I have used. This is not required, but will improve the readability
    of your code. You will also note the use of the tag <BR>, which forces a break
    of line. It is important to realize that any group of white spaces (whether it
    is a tab, a new line, or basic spaces) is always translated on the screen as a
    single white space. This is important to know since the appearance your code has
    will not necessarily be the same as as in the output. Check the following example:


    ```

    <HTML>

    <HEAD>

    <TITLE>Hello World Page</TITLE>

    </HEAD>

    <body>

    HELLO WORLD!!!

    And have a nice day!

    </BODY>

    </HTML>

    ```


    You probably noticed that this code is almost exactly the same as the previous
    one except that there is no <BR> tag after “Hello World!!!.”. In this example,
    the text “And have a nice day!” would show on the same line as “HELLO'
  merge: -1
  pgno: 42
