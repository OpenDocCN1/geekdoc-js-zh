    # Frames


    Here is another source of syntax errors, and widely hated by <TABLE> users. Personally,
    as stated in the tables, I tend to use frames on a regular basis, since it allows
    me to have some sets of data to load to the client and only once, and then remain
    open. By doing so systematically creating my entire layout with tables, I can
    contain pages that are lighter and faster to load for the client. The idea is
    to break your main window into several miniwindows, called "frames". Each frame
    can independently operate a separate webpage, yet it is possible to communicate
    between them. Some things to know about frames is that you need a page to hold
    the frameset, which will define the aspect of each frame, and the lines you will
    load in each one of those frames. Frameset definitions replace the <BODY>...</BODY>
    tag, but some old browsers cannot use frames, so you might want to create a <noframes>
    section.


    Let''s start with the basics. The very first thing to do, as stated above, is
    to write the frameset right after the <HEAD>...<HEAD> in the page that will be
    loaded. This page will have nothing displayed except the title, but is extremely
    important. To create a frameset, use the tag <FRAMES>...'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 40 INTRODUCTION TO HTML


    </FRAMESET> with either ROWS or COLS as parameter. You can use both at the same
    time, creating frameset working like tables with no rowspan or colspan, but it
    is recommended to restrict the use to only one type. The type of data you put
    in those attributes are called “multi-length” since they provide the sizes of
    all frames that the frameset will hold. If, for example, your frameset needs to
    have five rows, you will have a ROWS attribute with five lengths in order, separated
    by commas. Lengths can be a number of pixels, a percentage of the screen, or an
    asterisk (*), “whatever is left on the screen”. Suppose that you wish to break
    up the window into three rows: the first one 100 pixels tall, the last one 10%
    of the window, and the middle one using the rest of the window. You would write
    <FRAMESET ROWS="100, *10%\>...</FRAMESET>. It is also possible to specify the
    attribute BORDER, which sets the border size between frames in that frameset.


    Once the frameset is defined, you need to define each frame that will be included,
    following the rows or columns you created with the <FRAMESET> tag. Note that these
    frames will be in the order in which you want them to appear, and also note that
    you can use a new frameset instead of a frame in an available slot. The basic
    frames are created with the <FRAME>, which does not need to be closed. There are
    two parameters that should be set, and few optional ones. First there is NAME,
    which is essential since it provides the name that will define the frame itself,
    and which will be used in the TARGET attribute of a link wanting to open a page
    in that frame. When you have SRC, which is used to specify the URL of the page
    that will be loaded in that frame when the frameset is created. Other parameters
    include NOSIZE, which takes no values, only to be added or omitted, and prevents
    the frame from being resized. SCROLLING can be set to “yes,” to never allow scrollbars;
    or “auto,” to include a scrollbar only when needed. By default, SCROLLING is set
    to out.


    Here is an example of a frameset page that will open some of the examples we saw
    in this chapter in four frames. You will note that the top frame loads:blank,
    which is simply a standard name understood by browsers as a blank page:


    ```

    <HTML>

    <HEAD>

    <TITLE>Frames example</TITLE></HEAD>

    <FRAMESET ROWS="100,*100" BORDER=2>

    <FRAME NAME="title" SRC="about:blank">

    <FRAMESET COLS="258," BORDER=0>

    <FRAME NAME="menu" SRC="links.html" SCROLLING=NO

    <FRAME NAME="body" SRC="goodtables.html" NOSIZE>

    </FRAMESET>

    <FRAME NAME="footer" SRC="nestedlists.html">

    </FRAMESET>

    </HTML>

    ```'
