  md: '# 42 INTRODUCTION TO HTML


    to display the contents. You can top it off with a remote-looking menu that will
    have links targeting that iframe. To create an iframe, use the tag <IFRAME>...</IFRAME>,
    where the space between the opening and closing tags is used to enter the "alternate"
    version, in case the browser does not support iframes (it is similar to the "noframes"
    section). The <IFRAME> needs the following attributes:


    +   SRC—the URI to be loaded in the frame

    NAME—name of the frame enabling you to link to it

    WIDTH—frame width

    HEIGHT—frame height

    ALIGN—“top,”middle,”bottom,”left,” or right for frame alignment

    FRAMEBORDER—1 or 0 to have or not have a frame border

    MARGINWIDTH—size in pixels for the margin width

    MARGINHEIGHT—size in pixels in the margin height

    SCROLLING—“yes,”no,” or the default “auto” to allow scrollbars


    Here is an example of a page having an iframe inside a table:


