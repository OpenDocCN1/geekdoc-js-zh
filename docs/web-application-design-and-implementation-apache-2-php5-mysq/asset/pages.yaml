  md: '58 PHP—A SERVER-SIDE SCRIPTING LANGUAGE


    # Syntax Generalities


    PHP code is usually inserted inside HTML code. This allows for small parts of
    an HTML page to be executed before the page is downloaded to your computer. To
    insert PHP code in any page, use <?PHP. For a long time it was fine to just write
    <?, but the newer versions of PHP encourage the use of the full <?PHP opening
    tag, to prevent any confusion in executing the scripts. Once the opening symbol
    has been written, you enter the "PHP zone." Anything that you type will be executed
    by your PHP engine before you send the final page to the user. When you are writing
    your script, or portion of script, you must close the "PHP zone" with ?. You already
    saw an example of this when we wrote index.php containing <?phpinfo(); This means
    we start the PHP, and call the function phpinfo(). This is the function that outputs
    the configuration settings of PHP. Each instruction in PHP must end with a semicolon;
    doing so will make the page not work, so be careful!


    You can create comments in PHP using the same symbols as C language. You can select
    an area of comment, starting with /* and finishing with */, or you can use //
    to comment anything until the end of the line. Here is an example:


    ```

    INDEX.PHP FILE

    ----------------------------

    <?PHP --- This file checks the phpinfo ----*/

    phpinfo(); //This is the line that will be executed

    // the rest are all comments

    ```


    # INSTRUCTIONS


    In PHP you may use instructions, functions calls, loops, and conditions (plus
    objects with PHP5), but never forget the semicolon at the end of each function
    call and every instruction.


    A first easy function to use is echo, which allows printing on the page. Remember
    that when you run PHP code, it runs in the server, and any output that occurs
    will appear inside of the code where the instruction was called, so if you want
    to make an "echo" in an HTML page containing proper tags, you should place the
    PHP code between the opening and closing body. Here is a clean example:


    ```

    <HTML>

    <HEAD>

    <TITLE>Script1</TITLE>

    </HEAD>

    <body>

    <?php echo "Hello World"; ??>

    </body>

    </HTML>

    ```'
