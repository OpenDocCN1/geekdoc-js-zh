    a script to handle data in an array, and you decide the maximum size will be 100,
    you should create a constant called MAX_SIZE and set it to 100. Throughout your
    code you will write MAX_SIZE instead of each 100 time you need to do an operation
    to the size of the array. By doing so you will have a good level of modularity
    to your program; if you decided to expand the array to 500 items, you would need
    to change only the constant definition, and not each one you made of the constant.
    This approach applies to any programming language that allows the use of constants.


    To create a constant in PHP, simply define (name, value). For example, define("MAX_SIZE",
    100); or define("DB", "C:/Database/");"); From that moment on, doing MAX_SIZE;
