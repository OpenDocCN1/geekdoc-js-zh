    col_name2,...) VALUES (expression1, expression2,...) [ON DUPLICATE KEY UPDATE
    col_name=...] This is my personal favorite. Simply use the table name followed
    by the fields for which you wish to specify a value. For example, you could skip
    values that are autoincremented, and values with a default value if you wish to
