  md: '# 38 INTRODUCTION TO HTML


    mess up if you do not watch out. The number they accept represents the span that
    the cell should count rowwise or columnwise. For example, a ROWSPAN=2 would mean
    that the current cell will use two rows. Obviously, setting either parameter to
    1 will do nothing to the cell. The dangerous thing about this is that you must
    remember where you expanded a new row or column in order to avoid cells popping
    out of the table. Note that expanded cells use row on the following rows and columns,
