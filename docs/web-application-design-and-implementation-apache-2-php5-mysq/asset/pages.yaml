    # OVERVIEW


    By now you know all the nuts and bolts of the core set of tools that PHP provides
    with one major exception: interactivity between pages. The goal of this chapter
    is to overcome this need and show you the many ways of transmitting information
    between PHP scripts.


    # FORMS


    Our first technique of communications is forms. A form is basically a Webpage
    that has a set of available input areas for the user to enter information. It
    also contains a button that allows you to send that to any page.


