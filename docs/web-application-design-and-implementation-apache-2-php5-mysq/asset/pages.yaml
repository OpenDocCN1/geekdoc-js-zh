  md: '# 142 USING DATABASES


    Words in capital letters (uppercase) will be key syntax words, whereas lowercase
    words will be used to show what type of information is expected. In the previous
    example, position should be a number representing a position.


    Finally, if you see a comma followed by three period signs (...), this means the
    element before the comma can be repeated as many times as needed.


    # Data Types


    When using MySQL you can use a string by simply surrounding a piece of text with
    double or single quotes. Inside a string you may use any of the following special
    characters: \ for an ASCII (NULL) character, \ for a single-quote character, \
    for a double-quote character, \ for a backspace character, \n for a new-line character,
    \r for a return character, \t for a tab(ulation) character, % for the percentage
    character, and \ for the underscore character. You may also use floating-point
    numbers (e.g., -12.345), integers (e.g., 678), and as hexadecimal numbers (e.g.,
    3FB7A). Finally you may use the NULL value to represent the lack of data.


    Any name you use to define the structure of your database has a maximum size.
    For instance, database names, table names, and column (or attribute) names cannot
    exceed 64 characters. If you wish to use a longer name, you may use aliases, which
    allow a maximum of 255 characters.


    Assuming that you have a database classgrades with the previous example of database
    structure (see Figure 11.2), you could access a student name by doing name if
    you are inside the table student, student.name if you are in the classgrades database,
    or classgrades.student.name if you want to access that field from a different
    database on the same server. For Web projects you will most likely have only one
    database with many tables, which will simplify your query.


    You may create variables in MySQL using the SET instruction to declare the variable,
    and := to assign an expression to it. You may declare a variable as integer, real,
    or string, and declare many variables with a single SET instruction. All MySQL
    variables start with the character @. Here is an example:


    ```

    SET @var1 = integer, @var2 = real, @var3 = string;

    @var2 := 4;

    ```


    I have never used MySQL variables, as I can accomplish the same functionality
    with PHP in a much faster and easier.


