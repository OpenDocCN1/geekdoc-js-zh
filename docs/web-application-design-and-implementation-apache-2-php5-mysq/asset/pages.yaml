  md: '# 146 USING DATABASES


    The TYPE field at the end is not really necessary, but you should include it to
    force the field of table you are creating. The COMMENT field is just an example
    of how you would insert a comment for a created table.


    If you need to alter an already existing table, you may do it by writing ALTER
    [IGNORE] TABLE table_name alter_specs, [alter_specs2,...]. The alter_specs can
    be any of the following:


    +   * ADD COLUMN create_definition [FIRST | AFTER column_name]—used to add a new
    attribute. The create_definition uses the same syntax as with the CREATE instruction.

    * ADD PRIMARY KEY (col_name,...)—makes the fields placed between parentheses a
    primary key of the table.

    * ADD UNIQUE (col_name,...)—sets the fields placed between parentheses as a unique.

    * ALTER [COLUMN] col_name [SET DEFAULT default_value | DROP DEFAULT]—used to set
    a default value for a field or to remove the current value.

    * CHANGE [COLUMN] old_name create_definition—replaces the column_name with the
    column defined by the create_definition.

    * MODIFY [COLUMN] create_definition—similar to CHANGE but will try to figure out
    the column to be modified

    * DROP [COLUMN] name—removes an entire column.

    * DROP PRIMARY KEY—unsets all primary keys.

    * RENAME [AS] new_name—renames a table.


    These instructions allow you to prepare the database for its use, and even though
    you will most likely do the same job through PhpMyAdmin without needing to understand
    the syntax, it is very useful to understand the queries so that you may create
    an installation script that would set up the database with the proper structure
    needed for your scripts to work.


    The two operations you will most often do in PHP scripts are insertions and searches
    in the database. To insert an element into a table, there are three synt:


