    # CASE STUDY: INDEXER/SEARCHER—STEP 2


    In this new step of an indexer, we are going to make our indexer more user-friendly.
    The last thing a user wants to index files does is to have open the script source
    file and make a path variable. Instead, use a form.

    The other improvement is to make our indexer more flexible, to expedite the indexing
    of local files. Our indexer will have to accept either regular .htm or .html files
    (in case the index will do as in step 1) or actual folder names. First, if you
    wish to make your indexer work perfectly well, make sure that you can handle paths
    written with forward slashes (/), backslashes (\), and in case of folders, paths
    that either do or not contain a “closing” slash at the end.


    If the input received is a folder, find all the .htm and .html inside that folder
    and use your indexer on those files. However, if the provided path is a folder,
    and that folder contains other directories, you should enter these new directories
    and do the same work. Basically you need to traverse the entire directory structure
    rooted at the path provided as a parameter, and index every single .html and .htm
    file. Forget to ignore nonhtml files like .php, .mp3, and .zip, as they would
    probably crash your indexer. To make matters clearer, here is an example of directory
    structure:


    ```

    -FolderPassedThroughForm

    -file.htm

    -aFolder

    -moreFolders

    -morefile.html

    -script.php

    -work.pdf

    -otherfile.html

