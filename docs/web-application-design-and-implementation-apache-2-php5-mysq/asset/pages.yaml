    Another feature of HTML is the ability to detect the source of an event. In IE,
    you can use the event object, which holds information on the location of the mouse
    cursor, or what caused each event. Here are the contents of the event object:


    +   * event.screenX—gives the X coordinate of the cursor.

    * event.screenY—gives the Y coordinate of the cursor.

    * event.button—returns a number representing the mouse button that causes the
    event: 0 for no button pressed, 1 for left button, 2 for right button, 3 for left
    + right, 4 for middle button, 5 for left + middle, 6 for right + middle, and 7
    for all three buttons (which is if you want to compel them to use a three-button
    mouse).

    * event.fromElement—returns the element in which the mouse was before the event
    occurred. For example, if you had a mouseOut event on a button called myButton
    in your myForm, when the mouse leaves the button event.fromElement would be the
    same as document.myButton.

    * event.srcElement—returns the element that caused the event.

    * event.toElement—returns the element to which your mouse is when the event occurred.


