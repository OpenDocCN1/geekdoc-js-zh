  md: '# THE SAVIOR—PHP


    Well, you are probably wondering about the title I gave this section, but let
    me explain my logic behind it. I am one of those old-school developers who believe
    that C language is one of the best programming languages ever, because of its
    flexibility and how easy it is to learn. C is a language that, with a small toolset,
    can allow you to achieve pretty anything you wish to achieve. Well, for me, PHP
    is pretty much "C for the Web." The syntax is similar, with less restrictions,
    as we will see little by little, but follows the concepts of C that I like the
    most: flexibility and ease of use. It is really easy to learn; an experienced
    programmer can pick it up in a couple of days. Another great asset of PHP is the
    fact that runs server-side, meaning that the code is executed before the client
    has access to it, but we will discuss this later on. Let us talk about the basics.


    PHP is a recursive acronym of Hypertext PreProcessor and, as the name indicates,
    works like many preprocessors in other languages. This means that the code is
    read line by line and interpreted as it does, or at least that was how PHP started.
    It is an open-source scripting language, so you will be able to find many sites
    enhancing its development. It also means that the PHP project is created and maintained
    by developers who wish to invest their free time in making the project better,
    yet free.


    PHP was designed to work for the Web, and its code is embedded directly in HTML
    pages, although, as we see later, it is possible to separate HTML and PHP through
    the use of templates. Interestingly, PHP is not limited to work on the Web, or
    even used to create command-line scripts that you could run from a shell, or even
    GUI (Graphical User Interface) applications using the power of the PHP-GTK library.


    PHP is also designed to work closely with a wide variety of databases, including
    Oracle, MySQL, PostgreSQL, ODBC, and Sybase among others, making it an excellent
    choice for database-driven Websites, regardless of the database you wish to use.
    It also includes an extensive set of libraries that allows developers to interact
    with a wide range of other technologies. PHP developers create applications that
    generate images, PDF documents, work LDAP authentication servers, communicate
    with flash animations, and many other things that we will not be able to discuss,
    since it would probably take several volumes.


    # THE RIVAL—ASP.NET


    Active Server Pages (ASP) and now ASP.NET are probably among the major sources
    of confusion among developers. ASP used to be an actual programming language developed
    by Microsoft that worked similarly to PHP; it was a server-side scripting language,
    hence the title "the rival." With the arrival of the .NET platform, ASP.NET received
    an entirely new meaning, referring'
  merge: -1
