    # Images


    Using images in Websites is like using table salt when cooking. Without it, the
    site is too bland, but include too many images, and it becomes hard to enjoy.
    I must say, as most people discovering animated GIFs for the first time, my first
    HTML page was an array of ridiculous images, including the "all-star" work-in-progress
    animation, e-mail image, and other classics found in virtually "I’m learning HTML"
    Websites. In retrospect, I can say that that page was the ugliest page I wrote
    in my life, but people learn from past mistakes. So is my advice to all of you—keep
    it simple and don''t overdo


    Another important thing about images is size and format. People seldom realize
    that the bigger the image, the longer it will take to load, especially for those
    people who still use dial connections. Generally images should be kept under 100
    KB. Another important factor is the format. Most browsers accept a variety of
    image formats; for example, including a BMP image is *strongly* discouraged, simply
    because in all non-compressed formats, the images will tend to be unnecessarily
    huge. The most used formats are GIF, JPG, and PNG, and you should try to limit
    your images'' formats to either one of these. Keep in mind that GIFs allow animations,
    but are limited to 256 colors. Generally, use JPG for images that require higher
    quality and GIF for icons. Also keep in mind that even though you can add an image
    as a background for the page, you do not necessarily need an image as bg as the
    contents of the page. A technique I regularly use when creating my background
    images is to utilize the fact that background images are shown as a mosaic, filling
    the entire page with many copies of the image as needed. For example, if there
    is a color red-green-blue notation, you can create a picture of 1 pixel by 1 pixel
    (1 × 1 pixel) filled with the color you wish to use. When using it as a background,
    that pixel will be used all over the page to fill in the background, but will
    need to be downloaded only once to the client. Another technique is to include'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# INTRODUCTION TO HTML


    images of just a few pixels in height and large width (I usually make the 1600
    pixels wide and 1–10 tall depending on the effect I wish to achieve). The idea
    is to create a pattern that will be repeated line by line on the left side of
    your page. A nice image I created for a school example where I decided to elicit
    a “bluebook” feeling. To do so I had an image that was all white, with a blue
    horizontal line and a red vertical line to create the margin. By selecting that
    image as the BACKGROUND property of my <body> tag created the desired effect,
    with an image that was less than 1 kB.


    To include an image in the middle of a page, simply use the <img> tag, which does
    not need to be closed. The parameters to use include first SRC, which defines
    the URI of the image to be shown. It is also possible to set the size of the image
    through WIDTH and HEIGHT. If you do not set the size of the image, it will be
    displayed in its original size, but both your image might be distorted if you
    do not respect the image''s aspect ratio. The best way to set a new size for an
    image that you wish to portray is either bigger or smaller or simply set up one
    of the parameters as a number of pixels or a percentage of the original size.
    By writing only one of the attributes and omitting the other, you will be able
    to preserve the aspect ratio while changing the size of the image. The last but
    not least attribute is ALT, which takes a string, describing the image. It is
    extremely important if you wish to make your Website compatible with browsers
    like Links, for example. When an image cannot be displayed by a browser, only
    the name will appear where the image should be. If you write the description in
    the ALT attribute instead of the name, you will see that description. A good example
    of why this is useful is Websites that are mainly picture-based, meaning that
    all menu options are actually pictures with text inside them. In these cases,
    the ALT should be whatever text the image holds. For example, if menu1.gif is
    a picture that says “register,” the ALT for that picture should be “register”
    also. That way, a person visiting the Website will still be able to see it even
    though the images won''t show up, as “register” will be much clearer to understand
    than menu1.gif.


    # ORGANIZING DATA


    When creating a Webpage, something very important to keep in mind is organizing
    the contents to ensure that the page is not cluttered or disorganized. This is
    especially important when attempting to add pictures in the middle of paragraphs
    to keep a professional look. The main techniques used to organize information
    in a page are lists, tables, and frames. The first, as we will see right now,
    is not really useful with images but is a great way to create topic lists or any
    set of small that needs some ordering.'
