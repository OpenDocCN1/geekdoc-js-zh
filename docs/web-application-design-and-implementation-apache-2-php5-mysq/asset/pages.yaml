  md: '# Fundamentals


    # THE ORIGINS OF THE INTERNET


    Not that long ago, in a galaxy pretty close by, men and women used to live without
    practical means of communication. Paper was the main medium used for information
    sharing and horses the main carrier for that medium. But science keptpt working,
    and in 1831 Joseph Henry Morse invented the first electric telegraph. Four years
    later, Samuel Morse invented the Morse code, and worked on the very first long-distance
    electric telegraph line, which finished in 1843. A bigger leap in communication
    progress was made by Alexander Bell, who patented the electric telephone in 1876.
    Long-distance communication was finally a reality, but still archaic compared
    to what was be achieved. With the arrival of computers in the midentieth century,
    people realized the potential of storing and processing data in those amazing
    machines. Furthermore, the United States and the Soviet Union were deep in the
    Cold War, and the fear of a possible strike was constantly present in the military''s
    mind. One of the main concerns was the possibility that all communication between
    remote locations could be interrupted by an attack. Telephone and telegraph lines
    were out in the open, and could be easily damaged, so the National Security Agency
    (NSA) thought of a way to preserve communications. Emulating the principles of
    telephone communication, in the 1960s, the NSA thought of connecting computers
    through'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 6 FUNDAMENTALS


    wide-area networks (WANs), so that if the phone lines down, they would still be
    able to send orders to detachments across the country, through the use of computers.
    In order to make this idea a reality, the Advanced Research Project Agency (ARPA)
    created the first computer network in 1969, and named it ARPANET. It was composed
    of four computers, located in the University of California at Los Angeles (UCLA),
    the University of California at Santa Barbara (UCSB), the University of Utah,
    and the Stanford Research Institute (SRI). Three years later, in 1972, the use
    of routers allowed the ARPANET to have 20 nodes and 50 computers, which could
    all communicate through tools such as the telnet and FTP (File Transfer Protocol).
    In 1974 Vincent Cerf, from the SRI, and Robert Kahn, from the Defense Advanced
    Research Project Agency (DARPA), presented the Transmission Control Protocol/Internet
    Protocol (TCP/IP) basics, forever changing way computers communicate. In 1983the
    Defense Communication Agency (DCA) took control of the ARPANET and separated the
    military section to form the MILNET, which would be used for military purposes
    only. In the mid-1980s the two main networks, the ARPANET and the NSFNET (created
    by the National Science Foundation), merged to create a massive computer network
    That brought more and more computers to the network, and this network of networks
    was named “The Internet.” By 1990 the Internet had 3000 subnets and over 200,000
    host computers. The estimated number of host computers in the year 2004 was approximately
    234 million, and growing.


    # THE WORLD WEB WEB


    After creation of the Internet, great potential could be seen way beyond the actual
    work was being done. Computers were destined to do more than utilize telnets and
    FTP; it was great to be able to link one computer to another in order to send
    files, but the problem of communication was not yet solved. Scientists had to
    connect to a remote computer and send their research results one a time through
    FTP. This was faster than sending manuscripts through “snail mail,” but it was
    not the best option, so in 1989 Tim Berners-Lee presented the World Web project
    to the Conseil Européen de Recherche Nuclaire (CERN; European Organization for
    Nuclear Research, based in Switzerland). The idea was to come up with a set of
    standards for information sharing that scientists around the world would be able
