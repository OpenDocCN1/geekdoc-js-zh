  md: '# INSTRUCTIONS 59


    You could say PHP4 is an "expression-oriented" programming language. An expression
    is basically a set of characters following a specific syntax. Expressions always
    have a value that can be a numeral or string, including 0 or the void string "".
    To know what PHP code does, you simply need to locate and understand the expressions,
    as well as the information they hold.


    The first type of expression available consists of elementary expressions, such
    as constants and variables. For example the number 100 would be considered an
    expression with the value 100. Variables $a would be expressed with a value equal
    to the content of the variable.


    We have also composed expressions created by storing an elementary expression
    in a variable. Note that all variables in PHP start with the dollar sign ($).
    The following two lines would be considered two expressions:


    ```

