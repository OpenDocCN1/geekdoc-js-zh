  md: 'verifications. Check Chapters 14–18 for more information on how to program
    in JavaScript. Just make sure that the improvements you decide to work on are
    within the scope of the project, to avoid what is known as “scope creep” (see
    Chapter 19).


    # Step 6—Improvements on Looks


    Once your project is working, you may start working on the aesthetics. By using
    style sheets (Chapter 10), and do not hesitate to ask your favorite Web designer
    for help. In case you wonder about the difference between a web developer and
    a Web designer, in essence, a Web designer takes care of the looks (appearance)
    of Websites and Web developers write the scripts that make the pages work. This
    is the step that adds the skin to the project.


    # Step 7—Thorough Testing, Hacking Attempts


    This is probably one of the most important phases in the project. The goal of
    this phase is to ensure that the project is flawless and that you have made hackerproof.
    The best asset in this phase is imagination and a bit of paranoia. Never assume
    that your users will be friendly, using application for what it meant to be. The
    true secret to a hacker-safe program is to think like a hacker. Try to think of
    any security hole that you might not have fixed yet and fix it! This step is the
    equivalent of getting some immunizations for your project. The more time you spend
    here, the less time you will spend dealing with attacks.


    # Step 8—Presentation


    Assuming that are not writing the application for yourself and there is money
    involved, you will need to present your final project to your sponsor. The key
    here is to be relaxed and confident that your project is rock-solid. If you follow
    the guidelines in this book, this should not be a problem. If you are presenting
    to a nontechnical person, start by showing the general features of the project,
    getting into details only when asked to do so. If you are presenting to a fellow
    developer, go straight to the functionalities.


    # Step 9—Publication


    When the project has been approved, it is time to release it. Place it in your
    desired host and make sure that everything is set up properly so users worldwide
    can access it. This phase should be fairly fast.'
