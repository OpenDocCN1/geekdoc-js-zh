  md: '# 202 WINDOWS AND FRAMES


    updated, instead of creating a new popup. The object returned by **open** is extremely
    important as it is a reference to the new window''s window object. Thus, you can
    access anything in the new window by using the previously seen objects as *document
    and location*.


    The third parameter in the **open method** is probably the most interesting, as
    it allows you to fully customize the new window. It should be a string with no
    white spaces so that it works in all browsers (Netscape does not like white spaces
    in this parameter). You may use any of these attributes:


    +   * **copyHistory**—can be *yes* or *no*; allows you to specify whether you
    want to copy the history stack of the opening window.

    * **directories**—can be *yes* or *no*; allows you to either show or hide the
    directory buttons.

    * **height**—*height* of the window in pixels.

    * **left**—*left* starting position; basically, the amount of pixels between the
    window''s left border and the screen''s left border.

    * **location**—can be *yes* or *no*; allows you to show or hide the location field.

    * **menubar**—*yes* or *no*; allows you to show or hide the menu bar.

    * **resizable**—*yes* or *no*; allows the user to resize or not to resize the
    window.

    * **scrollbars**—*yes* or *no*; allows scrollbars to appear when needed or not.
    If you make a window that is not resizable and has no scrollbars, make sure that
    it is big enough to display all that you want to show.

    * **status**—*yes* or *no*; show or not show the status bar.

    * **toolbar**—*yes* or *no*; show or not show the toolbar.

    * **top**—*top* starting position; basically, the number of pixels between the
    top of the window and the top of the screen.

