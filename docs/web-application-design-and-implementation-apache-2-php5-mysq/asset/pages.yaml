  md: '# MAKING CLEANER CODE AND OUTPUT


    Some of the main features of my style sheet, and something that I usually have
    in all my pages, are nonlined links. I personally dislike seeing a link as a typical
    blue underlined text. Instead, my links have the same look as regular text with
    the only difference that they are in boldface. To let the user know that they
    are links, I use the hover state of the link and flashy colors like red; that
    way, when the user passes the mouse over the link, its appearance will change,
    capturing the attention of the user. I have underlined links, but only when the
    page referred to by the link is active. Note that colors can be written in hexadecimal,
    providing a RGB color (red-green), or by simply writing the name of the color.


    I also included a myclass style to show how to create your own class. This class
    in particular is a silly one that will show text with the colors of the Spanish
    flag (red and yellow). I also added humorous attributes as font_variant, letter_spacing,
    and background_color.


    How to use the style sheet? The first thing to do is to link to the style sheet
    in your HTML file. Simply insert the following line of HTML inside the <HEAD>...</HEAD>
    section:


    ```

    <link rel=stylesheet href="mystyle.css" type="text/css">

    ```


    Of course, don''t forget to change the href parameter to hold the path to your
    style sheet file.


    The next step is to use the actual styles that are in the CSS file. If you defined
    a style for a standard tag, simply use the tag, and the style will be applied
    automatically (as long as you are already linked to the style sheet). If you created
    your own class and wish to apply it to any tag, simply add the attribute class
    to the tag you wish to change, followed by the name of the class (without the
    period sign). So, for example, if I want a link to use myclass, I would use


    ```

    <A HREF="blabla.html" class="myclass"> . . </A>

    ```


    If you want to apply your class to a section of your HTML without separating that
    portion as a link, paragraph, or other "visible" container, you can use the <div>...</div>
    tag, which will cause your portion of HTML code to be "divided" from the rest
    of the HTML. This will be very useful when we do DHTML, as it will allow us to
    enter sections around our Pages.


    Regular text and need <div class=myclass>funky text!</div>. So easy!


