  md: 'Once your file is open, you may do the following:


    +   fclose($fp)—closes the file. You should always close a file when you are done
    with it.


    +   feof($fp)—checks whether the internal pointer is at the EOF (end of file).


    +   fgetc($fp)—reads the character at the current location and moves the internal
    pointer forward one character.


    +   getcsv($fp, $len, $sep)—reads a "comma-separated values" file and returns
    a single line of that as an array containing the comma-separated values. It are
    optional parameters. $len is the maximum length of a single line; $sep is a single
    character used as separator (set to ",") by default).


    +   fgets($fp, $len)—reads a string of up to $len bytes from the current location.
    Reading will stop if there is a new line (\n) or the pointer reaches the EOF.
    Returns FALSE if you try to read beyond EOF.


    +   fgets($fp, $len)—same as $fgets but strips HTML tags in the line.


    +   fputsthru($fp) or fwrite($fp, $str)—writes the contents of $str.


    +   fread($fp, $len)—similar to fgets but stops only when up to $offset (a number)
    has been read or EOF is reached.


    +   fseek($fp, $offset, $whence)—changes the location of the internal pointer.
    The new location is calculated through $offset as follows. If $whence == SEEK_SET,
    set position equal to $offset bytes. If $whence == SEEK_CUR, set position to current
    position plus $offset. If $whence == SEEK_END, set position to EOF plus $offset
    (in this case you should make that $offset is negative). If omitted, $whence is
    set to SEEK_SET.


    +   ftell($fp)—returns the position of the file pointer.


    +   rewind($fp)—places the internal pointer at the beginning of the file. This
    is the same thing as fseek($fp, 0, SEEK_SET).


