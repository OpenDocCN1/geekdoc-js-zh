  md: '# Adding a MySQL User


    I recommend that everyone create a new user that will have the right to use the
    MySQL database other than the root. This will be the user that we use in our PHP
    scripts. Open a command console ( `mysql --user=root --password=your_pass mysql`
    ), replacing Apache problems) and replacing "your_pass" with the password you
    selected for the root during the installation of MySQL. This will open the MySQL
    console. Now type `GRANT ALL PRIVILEGES ON .* TO ''newuser''@''localhost'' IDENTIFIED
    BY''newpass''WITH GRANT OPTION;` replacing "newuser" and "newpass" with the username
    and password you wish to use with PHP. Press "enter," and then type "quit" and
    "enter" again.


    # How Do I Know if MySQL is Running?


    If you managed the MySQL console and added a user, MySQL is running, so we can
    move to the next step: testing whether PHP can connect to MySQL, and in no way
    better than using phpMyAdmin.


    # INSTALLING PhpMyAdminAdmin


    Decompress the zip file you downloaded inside your document root, and rename the
    folder to something easy for you to remember but hard for someone to guess. This
    will prevent people from trying to access your administration tool. Go to the
    folder and locate the file `config.default.php`. Either rename it to `config.php`
    or copy the file and rename the copy. Open the file (Wordpad) will probably output
    the text in a nicer view with Notepad, locate the line `$cfg[''PmaAbsoluteUri'']
    = "";` and enter the absolute URI of your phpMyAdminAdmin. For example, if you
    called the folder "mysqlAdmin" and placed it in your document root, you should
    type `$cfg[''PmaAbsoluteUri''] = ''http://localhost/mysqlAdmin/'';`. Next find
    the first line that says `$cfg[''Servers''][$i][''user''] = ''root''; // MySQL
    user` and replace "root" with the user you created with MySQL. In the following
    line enter the password for that user and save the file. If you created a user
    "newuser" with "newpass" as your password, two lines should look like this:


    ```

    $cfg[''Servers''][$i][''user''] = ''newuser''; // MySQL user

    ```


    ```

    $cfg[''Servers''][$i][''password''] = ''newpass''; // MySQL password (only needed)

    ```


    Save the file and access the folder through your browser (e.g., http://localhost/mysqlAdmin/).
    This should open up phpMyAdmin''s interface. If there is any error, it would show
    up in this window. Typical errors include bad user/passwords and wrong absolute
    URIs.'
