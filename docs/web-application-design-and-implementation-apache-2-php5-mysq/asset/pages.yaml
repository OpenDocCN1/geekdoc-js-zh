  md: '# ORGANIZING DATA 41


    As earlier, some browsers are not capable of working with frames, usually because
    the browser was of an older date than the addition of frames in the HTML standards.
    The general behavior of a browser that is reading an unknown tag is to ignore
    that tag. Obviously a browser that cannot process frames will ignore our frameset
    and frame definitions, as it does not recognize the tags. We can take advantage
    of this behavior and use another frame-related tag to create an alternate version
    of our page that do not employ frames, but instead use tables, for example. To
    do so, you use `<NOFRAMES>...</NOFRAMES>` tag, and put a `<BODY>...</BODY>` inside
    it. This new block should be included right before the `<FRAMET>` tag. The way
    it will be simple. If the browser knows frames, it will ignore anything between
    `<NOFRAMES>` and `<NOFRAMES>` and therefore skip the body under. If the browser
    does not understand frames, it will not understand the `<NOFRAMES>` tag and ignore
    both opening and closing tags, but will still parse what is between them. At that
    point it will find a `<BODY>` that will be considered the normal beginning of
    the body section of a page. You should always have a noframes section when working
    with frames, to at least ask the user to get a browser supporting frames. Here
    is an improved version of our previous example:


    ```

    <HTML>

    <HEAD><TITLE>Frames example</TITLE></HEAD>

    <FRAMET ROWS="100,*100" BORDER=2">

    <FRAME NAME="title" SRC="about:blank">

    <FRAMET COLS="25,*" BORDER=0">

    <FRAME NAME="menu" SRC="links.html" SCROLLING=NO>

    <FRAME NAME="body" SRC="goodtables.html" NORESIZE>

    </FRAMET>

    <FRAME NAME="footer" SRC="nestedlists.html">

    </NOFRAMES>

    <BODY>

    Please get yourself a good browser like <A HREF="http://www.firefox.com">Firefox</A>

    </BODY>

    </NOFRAMES>

    </HTML>

    ```


    There is another very curious type of frame called the "inline frame" (or "iframe"),
    which is basically a frame that can be used as an image. It has the advantage
    of being useful inside a normal body of a page, and does not require any frameset
    definition. You can utilize this asset to, for example, include it in a table,
    surrounding it by images of a TV frame to create a TV effect. The TV screen would
    basically be the inline frame that would be used'
  merge: -1
  pgno: 54
