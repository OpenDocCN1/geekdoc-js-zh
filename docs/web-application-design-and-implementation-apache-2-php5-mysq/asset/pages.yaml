  md: '# 30 INTRODUCTION TO HTML


    WORLD!!!, even though it is written a line below it, because the “new line” will
    be translated into a single white space.


    As a teacher I enforce the use of the basic six tags needed for an HTML proper
    structure, I would recommend everyone to make it a habit to write all as soon
    as a page is created, and then fill in the blanks.


    # Tag Parameters


    As we saw previously with the FONT and BODY tags, it is possible to add attributes
    to an opening HTML tag to make it more effective. Each attribute will affect the
    area after the opening tag and finish with the closing tag. Remember there is
    no need to write the attributes in the closing tag. Checking the W3C website (www.w3c.org)
    can get you an exhaustive list of all the attributes that tags can use, but I
    will give you the ones I consider most important for the tags I will teach you
    at the end of this chapter.


    # BASIC TEXT FORMATTING


    There are many ways to format text in HTML, but we will discuss only the basics
    right now. There will be details on styles I aim to show you which are considered
    to be deprecated and should be replaced with the use of style sheets, but as much
    as this is true, you probably want to get started without learning advanced formatting
    features. In that case, the following tags are ideal.


    The first basic tag used for formatting text is the <p>...</p>, which stands for
    “paragraph.” As the name indicates, it defines an area that works as a single
    block, and most browsers will automatically break a new line at the end of a paragraph.
    I try not to use this tag when writing normal text since the output on the screen
    might be different depending on the browser, I prefer to handle my paragraphs
    manually. On the other hand, paragraphs are really useful when using style sheets,
    as we will see in Chapter 10.


    A very useful tool in HTML is the different headings styles that can be used to
    easily write titles, chapters, or sections. Each heading is treated as a paragraph,
    and a new line is added automatically with <h1>...</h1>, where “n” is the level
    of title you wish to use from 1 to 6 (with H1 the biggest heading and H6 the smallest).
    If you want to add extra linebreaks you use <br> tag. To change the appearance
    of text, you can use <i>...</i> to italicize it, with <B>...</B> to make it bold,
    or <U>...</U> to underline it. As always, these tags affect the text between opening
    and closing tags. It is also possible to use the <FONT> tag to specify colors,
    fonts, sizes, and background colors, for example, but it is considered poor practice
    to use these in your HTML code which makes it much more difficult to read. Instead,
    you should use styles, again, as we will see in Chapter 10.'
  merge: -1
