  md: '# PHP5 and Object-Oriented Programming


    # OVERVIEW


    Even though objects in PHP have existed since version 3, their use has been improved
    with PHP5, thanks to the use of the script motor Zend 2. In case you have never
    programmed in any object-oriented programming language (e.g., C++ or Java), I
    will explain the raw basics so you can follow the explanations. If you wish to
    look into C++, I recommend that you read The Design and Evolution of C++ by Bjarne
    Stroustrup (see alphabetical list in Bibliography at the end of this book).


    # CLASSES AND OBJECTS


    A class is a complex data type that can hold both data and methods. Classes are
    generally categories of objects; the data it contains are data members or attributes
    and allow definition of a particular instance of that class. The methods inside
    a class are generally actions that an instance of a class can do, or simply methods
    that allow access to or modification of data members. For example, you could have
    a class Car that would hold data members such as manufacturer, model, and year,
    and methods like checkMileage() or changeColor().


    > Web Application Design and Implementation: Apache 2, PHP5, MySQL, JavaScript,
    and Linux/UNIX, by Steven A. Gabarró

    Copyright © 2007 by John Wiley & Sons, Inc.'
