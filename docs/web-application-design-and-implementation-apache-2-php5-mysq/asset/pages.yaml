    element in an associative array will actually have two indices. First you will
    have the real index of the element, indicated during its creation. This “real
    index” is generally called the “key” of the element. The other index is a numbered
    index that is known internally by PHP, which basically holds the order in which
    the elements are held in the array. Check this example:


    ```

    <?PHP

