    +   - students: id student, name, surname

    - tests: id test, title, date

    - questions: id question, question, answer

    - question_in_test: id question, id_question, id_test, number, value

    - grade_per_question: id gq, id_qt, id_student, grade


    Now we need to determine the relationships between the tables. First we have the
    tables that hold a piece of information (id_student) required in the table grade_per_question.
    Each student can have many graded questions, but each entity in grade_per_question
    can refer to only a single student. Therefore the relationship from students to
    grade_per_question is 1:n. The table holds id_test, used in question_in_test.
    Each test contains multiple questions, but an entity in question_in_test can refer
    to only a single test; therefore the relationship from test to question_in_test
    is 1:n. The table contains id_question, used in question_in_test. Each question
    can be used in many tests, but each entity inside question_in_test can refer to
    only a single question, so the relationship from questions to question_in_test
    is also 1:n. The table question_in_test contains id_qt, used in grade_per_question.
    A question in a test can have a grade for many students, but an entity inside
    grade_per_question can refer to only a specific question in a specific test; the
    relationship from question_in_test to grade_per_question is again 1:n. The table
    question_in_test has references to id_question and id_test, but we already took
    care of the relationships that these references entail. Finally, the table grade_per_question
    has already been assigned all needed relationships. In Figure 11.2 you will see
