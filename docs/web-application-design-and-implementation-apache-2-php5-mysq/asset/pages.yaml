    The option LIMIT is a bit more flexible when using a SELECT, allowing to not only
    specify how many elements to match but also know which is the first element to
    be considered. This is a really useful tool when you want to limit the number
    of results shown on a page, and facilitates the creation of multiple pages to
    show data. For example, in a commercial Website where you would sell several hundred
    products, you should avoid showing all on the same page. Instead, you should split
    them into smaller groups, for example, 10 items per page. The standard in these
    cases is to have small numbers that represent the pages—example, with page 1 showing
    elements 0-9, page 2 showing elements 10–19, and so on. This method could be implemented
    by calculating the LIMIT value by checking the current page. We come up with the
    formula first_item = (page - 1) * 10. To verify, the first item of page 4 would
    be the 3rd entry (index 30) in the list of matches, and (4 - 1) * 10 == 30, so
    it is all good! This value represents the offset that should be followed by the
    amount of elements that we want to gather. For example, to view the 10 items on
    page 5, we would calculate the offset (5 - 1) * 10 == 40, and use a LIMIT 40,10.


