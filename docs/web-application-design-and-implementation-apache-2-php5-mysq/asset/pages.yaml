    \  return true;\n}\n</SCRIPT>\n</HEAD>\n<BODY onload=\"return closeIt()\">\nGo\
    \ <A HREF=\"http://www.stevens.edu\">elsewhere</A>.\n</BODY>\n</HTML>\n```\n\n\
    A good thing about the open method is that if you attempt to open a new popup\
    \ with the same name under the same variable, the previous popup is"
