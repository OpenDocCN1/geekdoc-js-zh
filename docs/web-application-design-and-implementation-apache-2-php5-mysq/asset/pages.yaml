    You might be wondering what DHTML is, and as many people, you probably think it
    is a new language. Well, you would be wrong. DHTML stands for Dynamic HTML, which
    is a “high-tech” word used to define the possibility of changing an already loaded
    page. When we changed images, and moved windows, we were doing DHTML. In this
    chapter we will take this one step further, seeing how to change text, positioning
    of elements, and almost anything.


    One very important thing to realize that DHTML is technically done through JavaScript;
    therefore the scripts we will write might not work in every single browser. It
    is important to test your scripts and try to force yourself to use cross-platform
    objects and properties.


