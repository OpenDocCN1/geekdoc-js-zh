    all the data to a PHP script. To do so, use the <FORM>...</FORM> tags. Inside
    those tags will be the entire contents of the form, so keep in mind that if you
    place an input area outside those tags, you will not be able to send the information
    that the input area contains. The FORM tag takes two attributes: action and method.
