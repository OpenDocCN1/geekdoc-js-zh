    # USING MySQL


    MySQL is a database programming language based on the standard ANSI SQL92 but
    contains several modifications. For example, nested SELECTs were not available
    in MySQL until version 4.1; MySQL does not support SELECT... INTO TABLE that the
    standard SQL accepts; and views became accessible only in version 5.0.1. You probably
    wonder what this means.'
