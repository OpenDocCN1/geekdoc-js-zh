  md: '# BASIC TEXT FORMATTING 31


    Most tags, including <P>, accept an attribute ALIGN allows setting of the horizontal
    alignment of a block by setting it to "left", "center", "right", or "justify".
    It is also possible to center an area of the page using the <CENTER>...</CENTER>
    tag. The advantage of the <CENTER> tag is that it will align anything between
    opening and closing tags, regardless of the type of element (form input, image,
    paragraph, button, etc.).


    To do a basic enhancement on your page''s look, you can use horizontal rules.
    These are horizontal lines used mostly to separate sections and paragraphs. To
    use it, just write <HR> with any of the following attributes: ALIGN (left, center,
    or right), NOSHADE to remove shade under the line, SIZE (in pixels) to specify
    the height of the line, and WIDTH (in pixels or percentage of the page) to specify
    a nice-looking rule could be <HR SIZE=1 WIDTH=75%>, which would create a line
    of 75% of the page''s width, centered in the page, and 1 pixel height. Note that
    this tag does not need to be closed.


    Finally, to conclude this set of basic formatting tools, I would have to add the
    <BLOCKQUOTE></BLOCKQUOTE> tag to be used to quote other people in a text, but
    it has a nice property. Any text inside a <BLOCKQUOTE> tag is automatically indented,
    which is great for a fairly indent solution. I have personally used it in the
    past to force a black margin at the beginning of my pages, making the output cleaner.


    Here is an example using all these tags:


    ```

    <HTML>

    <HEAD>

    <TITLE>Formatting example</TITLE>

    </HEAD>

    <BODY>

    <BLOCKQUOTE>

    All my text will show up with an indentation!

    <P ALIGN=right>This is a first paragraph with right alignment</P>

    <P ALIGN=left>And this is a separate left-aligned paragraph with things written
    in <i>italic</i>, <b>bold</b>, <u>lined</u> and even <u><b>all mixed up<i></i></b></U</u></P>

    <CENTER>

    <HR size=1 width=75%>

    <h1>Heading1</h1>

    <h2>Heading2</h2>

    <h6>Heading6, and like the others I''m centered!/</h6>

    </CENTER>

    </BLOCKQUOTE>

    </BODY>

    </HTML>

    ```'
