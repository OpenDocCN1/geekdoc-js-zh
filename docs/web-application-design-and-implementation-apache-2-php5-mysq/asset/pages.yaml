  md: '# 194 PROGRAMMING THE BROWSER


    extremely useful on forms as you can verify the contents of the form before submitting
    it and let the users know about any errors so that they can correct them before
    sending the data through the form. To do this, you would simply have an onclick
    on your "submit" button that would verify all data, returning false if a problem
    was encountered.


    Two methods are very useful on forms containing text areas. Ideally, when you
    are writing a form, you should include some JavaScript to test the form before
    sending any data to your PHP scripts. This allows a first layer of data verification
    done on the first page if the client, which is much faster than transmitting the
    data to a PHP script; the PHP script will verify the data; and redirect the client
    to the first page if an error is found. Verifications done in JavaScript allow
    you to avoid the burden of constant back and forth with the server. A typical
    problem that can be found in forms is bad type of data input in a textbox; for
    example, you may be expecting an email address and the user leaves the field entry,
    or inputs a text that is not an address. In these cases you want to inform the
    user of the error and to change the data. In those cases you can call the method
    focus() and select(), to place the user in the field that needs changing. These
    methods should be called from a form element object; an example document.myForm.myInput.focus().
    The method focus() will give you the entry, and the method select() allows you
    to select the entire text that was entered. When a field needs to be changed,
    there is nothing better than to do a focus() of the problematic field, followed
    by select(). This way the user needs to enter the new data, automatically overwriting
    the previous text.


    One last useful point is to realize that any of the objects accessed through the
    document can be stored in variables to ease up the typing. For example, you could


    ```

    var myFunction = document.myForm1.button;

    ```


    From then on, you would be able to access your button simply typing myFunction.


    # TIMERS


    JavaScript has the ability to create two main types of timers: one-shot timers
    and regular timers, called "intervals.\ One-shot timer allows you to decide on
    a specific amount of milliseconds to wait before a function is called. Using the
    function setTimeout, for example, you could do


    ```

    var timerID = setTimeout("myFunction()", 5000);

    ```


    This would create a timer that wait 5 seconds before calling myFunction(). The
    returned ID is very important as it will be needed if you want to stop the timer.
    Simply use clearTimeout(timerID) to stop the timeout.'
