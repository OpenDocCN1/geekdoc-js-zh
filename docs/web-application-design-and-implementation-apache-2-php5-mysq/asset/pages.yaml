    # THE MYTH—CGI


    Now, here is a good source of laughter among recruiters who know about programming.
    Many people think CGI (Common Gateway Interface) is an actual programming language
    and tend to “beef up” their resumes, adding it to their list of known programming
    languages, without really understanding what CGI is. CGI is a common gateway interface,
    and is definitely not a programming language. It is a standard for interfacing
    external applications with information servers, or if you prefer, a “magical door”
    that will you to run your normal executable files in a Webpage. CGI applications
    are executed in real time, allowing a dynamic output, generating a Webpage adapted
    to a set of received inputs. The way it works is simple; you first write an application
    in your favorite language and compile it to an executable rename it to “file.cgi”(note
    that this is technically optional, and many developers leave script names as “file.exe”;
