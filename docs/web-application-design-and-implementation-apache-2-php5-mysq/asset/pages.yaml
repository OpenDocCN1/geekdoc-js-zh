  md: '# Using Files, Folders, and Strings in PHP


    # USING FILES


    The first useful thing to do in PHP with files is to include files. These are
    files that are linked from any script through two possible techniques. Include
    files usually hold data such as user and password information for database connection,
    sets of functions commonly used, and headers and footers in every page.


    One way to link to an external file is to use `include(filename);`. Note that
    the filename could be a Web address of the server `http://www.blabla.com/myfile.php`,
    a relative path `/includes/include.php`, or an absolute path `/usr/home/gsabarro/include.php`.
    Note that PHP can access any file in the server (assuming that the proper permissions
    were set) even if those files are not accessible through the Web server. It is
    very important to exploit this ability when including files containing important
    information as data-base settings, which prevents malicious users from accessing
    those files through their browsers.


    Doing an include will insert the external file inside the including script. If
    the called file has a return value, you may retrieve that value by storing the
    return value of the function include. Note that this function can be used inside
    loops.


    The other method to link to files is `require(filename);`. This will execute the
    called file before inserting it in the script. It cannot use a return value,


    > * Web Application Design and Implementation: Apache 2, PHP5, MySQL, JavaScript,
    and Linux/UNIX, by Steven A. Gabarró

    Copyright © 2007 by John Wiley & Sons, Inc.'
