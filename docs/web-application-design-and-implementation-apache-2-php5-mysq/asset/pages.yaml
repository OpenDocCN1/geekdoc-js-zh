    # Simplifying the Diagrams


    Something I have realized after many years of designing databases is the tediousness
    of always adding the name of a relationship as well as its type. After you gain
    some understanding experience at glance at the tables linked by the relationship.
    Therefore, I do not write the relationship name or its type. To show the dependences
    between tables, such, for example, the table grade_per_question on the students
    and question_in_test, I use an arrow pointing from the depending table (let the
    “primary” table, or table 1) to the dependent table (the “secondary” table, or
    table 2). This generally means that all my relationships have an arrow on the
    line that have corresponded to a “1” in complexity terms. For example, a relationship
    of 1:1 would be represented with a double-sided (double-barred) arrow, a relationship
    of 1:n will be expressed by an arrow going from the n to the “1,” and a relationship
    of n:m will not be expressed by an arrow. A simplified version of our previous
