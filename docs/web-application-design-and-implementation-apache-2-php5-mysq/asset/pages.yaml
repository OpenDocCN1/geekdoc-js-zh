    \     echo $this->protected;\n        echo $this->private;\n    }\n}\n$obj = new\
    \ MyClass();\necho $obj->public; // Works\necho $obj->protected; // Fatal Error\n\
    echo $obj->private; // Fatal Error\n$obj->printHello(); // Shows Public, Protected\
