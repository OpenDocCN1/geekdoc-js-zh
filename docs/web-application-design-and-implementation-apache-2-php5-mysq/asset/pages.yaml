  md: "# PHP PROGRAM STRUCTURE AND FLOW OF CONTROL\n\nThe most basic loop is the while\
    \ loop. It receives an expression that is tested before starting each iteration.\
    \ The loop will keep on going until the expression becomes false. For example\n\
    \n```\n<?PHP\n$i = 0;\nwhile ($i < 10) {\n    echo $i++; \" \";\n?>\n```\n\nThis\
    \ loop will check whether $i is less than 10. If it is, it prints $i and increments\
    \ it by one with the postincrement operator, prints a white space, and checks\
    \ $i again. The moment $i is no longer than than 10 (i.e., the loop finishes).\
    \ This code will show the numbers from 0 to 9 on the page. This type of loop is\
    \ excellent in testing for a specific value change, make sure that the statement\
    \ can eventually be false, or you will enter an infinite loop!! Not that if the\
    \ condition is false before the first iteration, the loop will never be entered\
    \ and the body of the loop will never execute.\n\nIf you wish to make a loop that\
    \ allows you to run its body at least once before checking the condition, you\
    \ may use do...while. This type of loop works in the same as a while but checks\
    \ the condition after each iteration. It will always run the body at least once.\
    \ The general syntax is\n\n```\ndo\n{ statements }\nwhile (condition);\n```\n\n\
    If you wish to count a specific amount of numbers, you can use a for loop. This\
    \ type of loop works similarly to a while but allows you to run a set of expressions\
    \ before the first check of the condition, and you can have a set of expressions\
    \ to run after each iteration. The general syntax is\n\n```\nfor(expr1, expr2\
    \ [...]; condition; expr3, expr4 [...])\n{ statements }\n```\n\nAll the expressions\
    \ before the first semicolon are only once, before entering the loop, the expressions\
    \ after the second semicolon will run at the end of each iteration. Multiple expressions\
    \ are separated by commas.\n\nFor example, the following loop would initialize\
    \ $i to 0 and would then check whether $i is less than 10; if it is true, it will\
    \ print the value followed by a white space and will increment $i by one—this\
