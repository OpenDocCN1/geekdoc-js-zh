  md: '# 18 THE DIFFERENT APPROACHES OF WEB PROGRAMMING


    address. The location of a page is a URI commonly called URL (Universal Resource
    Location). For example, an email address URI would look like mailto:mynamemydomain.com,
    a normal URL could be http://www.mydomain.com/folder/mypage.html#section2. Usually
    a URL can be of two types: absolute or relative. An absolute URL is basically
    a URL that includes the information on the path of a file or folder, like domain,
    subdomain, file, section, ... A relative URL is one in which you can see the entire
    path of the file, but how to reach it from the current working directory. For
    example, if you were viewing the page "foobar", the image mypic.jpg could be accessed
    by using either http://www.mydomain.com/images/mypic.jpg (absolute URL) or ..images/mypic.jpg
    (URL relative to the folders):


    ```

    mydomain.com (/

    mypic.jpg

    mytherpic.jpg

    files

    foobar.html

    otherfile.html

    yetanotherfile.html

    ```


    As you noticed, relative paths usually start with "../", which means "go to parent
    directory" or "./", which means "current directory". Relative paths are an easy
    way to make a Website more portable since they are independent of the domain where
    the pages are in. It is especially useful if, like me, you test all your pages
    in a local computer before uploading the files to your host.


    The use of URIs is pretty a necessity in HTML because they allow you to embed
    images to a page, send information from a form to a processing script, create
    an image map, link to an external style sheet, create frame documents, create
    an external reference, or also refer to metadata conventions to describe the page.


    # THE CREATOR–SGML


    SGML, or Standard Generalized Markup Language, is a descendant of IBM''s Generalized
    Markup Language (GML) developed in the 1960s. It relies strongly on the use of
    DTDs (Document Type Definitions) to define the syntax of markup constructs. SGML
    is not really used on the Web in its full version, but smaller subsets of SGML
    are becoming increasingly prevalent in many information exchange standards.'
