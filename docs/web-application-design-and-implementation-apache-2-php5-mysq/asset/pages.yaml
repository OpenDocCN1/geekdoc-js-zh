    found under the META tag “keywords” to complex full-text indexers with thesaurus
    that use n-dimensional space vectors to store the information of the files (beyond
    the scope of this book). We are going to settle something in the middle: a basic
    full-text indexing with META information gathering.


    A full-text indexer goes through the content of the file being indexed, counting
    many times each word appears. This information is stored in a database, and when
    a user looks for a word like “Spain,” you show all the pages that contained that
    word, starting with the one that the word appearing more times. There are several
    important things to realize when indexing, though.


    First, there are useless words that do not need to be indexed. A “useless” word
    is a word that has no common sense would try to look for, usually a word that
    gives no information on the topic of the page. For example, words like “a,” “the,”
    “for,” “yes,” and “no” could be considered “useless.” In order to skip useless
    words, there are several techniques, such as having an array of a word that has
    less than a predetermined amount of letters, with the danger of excluding but
    important words. Another faster way is not to index a word that has less than...
    For example, a page on databases might contain the abbreviation DB (for database)
