  md: "# VISIBILITY\n\nWhen you are defining a data member or data function, it is\
    \ possible to set its visibility. The visibility can be public, private, or protected.\
    \ Public visibility means that the data can be accessed anywhere, private means\
    \ that the data are accessible only within the class itself, and protected means\
    \ that only the class itself, its parents, and its descendants can access it.\
    \ Data members should always have their visibility written before the data themselves,\
    \ but it can be omitted in the case of methods that take public as default visibility.\n\
    \n```\n<?php\n/**\n * Define MyClass\n */\nclass MyClass {\n    public $public\
    \ = 'Public';\n    protected $protected = 'Protected';\n    private $private =\
