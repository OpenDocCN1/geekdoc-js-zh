  md: '# # Appendix C


    # # Advanced phpBB


    If you followed the steps of Chapter 4, you should know how to create forums in
    phpBB as well as setting up its rights. Let us now see more advanced features!


    The first thing we will do is set up groups. This allows a faster handling on
    who has access to different boards. Any board that should be hidden except for
    specific user groups should have its rights set to PRIVATE, MOD, or ADMIN. The
    PRIVATE right will block everyone unless you manually add the user in question
    to the allowed list, or if user is in a group with the proper rights. Using groups
    is much faster in the long run.


    In the Admin panel, under “Group Admin,” click on “Management”; this will show
    a dropdown menu with the current groups. Selecting a group and clicking on “Look
    up group” will take you to the group editing page. The button “create group” takes
    you to the same page, for a new group. In, select the group name, its description,
    and a moderator, who will have the right to add new users to group. A group can
    be open, allowing anyone to join it, so that everyone can see it but may only
