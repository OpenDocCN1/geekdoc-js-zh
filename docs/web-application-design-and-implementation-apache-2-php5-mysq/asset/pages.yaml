    Web services, not only on Microsoft applications and Websites, but as a more global
    solution. If that happens, surely C# will become increasingly popular and will
    be the first choice of programming language for new developers.


    # CLIENT-SIDE SERVER-SIDE—WHICH SIDE TO PICK?


    As we have seen, most scripting languages are defined as either client-side or
    server-side. A client-side program is basically a program that needs to be fully
    downloaded by the browser to use it. The code in many cases is embedded in HTML
    code, which results in full disclosure of your work programs, since all users
    can read it by choosing the “view page source” option in their browsers. In many
    cases the code is interpreted by the client, which brings us to another problem
    of client-side applications—they are browserdependent. As we will see when studying
    JavaScript, many features are not cross-browser, meaning that they can be used
    only in a specific browser, sometimes in a specific version of it. The positive
    side of client-side scripting, and the reason for its continued use, is that once
    the code is downloaded, the server has nothing else to do. The client is solely
    responsible for'
  merge: -1
