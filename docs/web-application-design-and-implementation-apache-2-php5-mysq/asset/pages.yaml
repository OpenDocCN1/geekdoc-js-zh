    # GET versus POST


    As mentioned earlier, a form transmits information to your PHP scripts through
    two possible methods called GET and POST. The GET method will access the script
    in the action parameter of your FORM tag by writing the URL of the script followed
    by all the data that were found in the script. So, for example, if your input
    contained two textboxes "name" and "nickname", where I wrote "Steven" and "Bechy",
    submitting the form would ask the browser to open the URL youscript.php?name=Steven&nickname=Bechy.
    The syntax is quite simple: a question mark after the script, followed by the
    series variable=value. Different variables are written next to each other by placing
    ampersand (&) in between, enabling you to see absolutely all of the information
    sent by simply looking at the address bar of your browser. This is obviously a
    very poor choice if you are sending important information as passwords, and the
    main reason why I never use GET as a method. The POST method sends all the information
    directly to the script in a way that is transparent to the user, so the address
    bar in my previous example would show "youscript.php."


