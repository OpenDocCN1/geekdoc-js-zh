  md: '# WHAT LANGUAGE TO USE? 235


    empty, valid email addresses, and other basic checks that should be done before
    sending any data to the processing PHP script. Here is where you practice all
    those regular expressions in JavaScript and keep the user in the form (remember
    to return false) as there are one or more problems in the form. Once JavaScript
    verifies that all the required data are formatted as required, you may allow the
    form to send its data to PHP (return true) and have PHP run a second series of
    tests. I recommend a two-phase verification to get rid of as many possible errors
    and security holes as possible. My JavaScript side care of required fields and
    formatting, user level, and so on.


    JavaScript is also very useful in providing some visual enhancements such as dropdown
    menus or rollover buttons. The most basic rollovers you could would be to change
    an image with onmouseover and onmouseout if you are using images for your menu
    items. You can otherwise change a text style.


    In a nutshell, HTML will organize the output layout, PHP will populate the page
    with the appropriate data, and JavaScript will make it all look nicer, as well
    as verify that the user enters the required information. MySQL will be the tool
    used by PHP to manipulate the database.


    Well, I hope this book will help you understand the ins and outs of Web programming,
