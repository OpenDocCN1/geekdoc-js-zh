  md: '# SPECIAL CHARACTERS


    # SPECIAL CHARACTERS


    The last piece of information necessary for now in order to start creating Websites
    is how to use special characters. As mentioned at the beginning of this chapter,
    you are not allowed to use the characters < and > for tags, but what if you wanted
    to use that for a mathematical comparison? Here is where special characters come
    in handy. Other typical example is white spaces; as stated earlier, any large
    group of white spaces is translated into a single white space by browsers, so
    what if you wanted to force five white spaces between two words? Another crucial
    piece, at least for me, is my last name. “Gabarró.” As you noticed, it contains
    an accent on the o, which few keyboards around the world have, and that, depending
    on the regional settings, might not show up on the screen if I just use the character
    “ó.” Many people would just ignore this and write “Gabarro,” but as a proud Spaniard,
    I need my accent, and luckily I can get it in HTML in a way that will be printed
    in any computer, regardless of its settings.


    All special characters in HTML start with an ampersand (&) and finish with a semicolon
    (;). For example, the character “ó” is written &acute;, meaning when writing my
    last name on a Webpage I have to spell it Gabarr&acute;. White spaces are done
    with &nbsp;, < is &lt;, and > is &gt.


    You can find a large reference table such as that in Appendix A.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# # 4 Work Environment


    # ## INTRODUCTION


    In this chapter we will see step-by-step how to install all the software that
    we will need for our Websites to run. This includes an Apache Web server, the
    PHP engine, and a MySQL database. We will also see how to install and use two
    powerful PHP-based applications: phpMyAdmin to manipulate data-bases, and phpBB,
    a free bulletin board tool.


    The installation guidelines are for Microsoft Windows computers. These tools also
    work on UNIX, but chances you already have a Web server and PHP installed as part
    of the UNIX/Linux distribution of your choice. You can find more information on
    UNIX/Linux installation guide-lines in Appendix B.


    # ## DOWNLOADING THE SOFTWARE


    The first obvious thing to do is download all the necessary software that we will
    use. The Apache Web server can be found at www.apache.org. Once there, click on
    "HTTP server," find the latest stable release (the current version at the time
    of this writing is 2.0.55 with a Windows installer and2.2.0 as a UNIX source package),
    click on "download," and find the "Win32 binary'
  merge: -1
  pgno: 57
