    with person''s salary, extracted from tables employee and info, assuming that
    the name of the employee is the main identifier needed in the info table by doing
    SELECT t1.name,t2.salary FROM employee AS t1, info AS t2 WHERE t1.name=t2.name.
    Of, we assume that both tables have a field name. This query will find all pairs
    of entries with the same name and return the value of the name field from the
    employee table and the salary field from the info field for each of those matches.


