    that you need (see next paragraph for alias definition), you could write for example
    SELECT t1.column1, t2.column...


    The table references are the list of tables which to look for the information
    needed. When looking inside a single table, simply write its name, but if you
    are searching in different tables, it is preferable to provide them with an alias
    using the keyword AS that the aliases can be used in the select_expression. For
    example, you could SELECT t1.name,t2.salary FROM employee AS1, info AS t2....
    would create an alias t1 to the table employee AS1, and an alias t2 to the table.


    The where_condition is the same type of expression as before. If you wish to select
