    \ definition, for example\n\nfinal public function dontChangeMe()\n\n# CONSTRUCTORS\
    \ AND DESTRUCTORS\n\nA constructor is a method that is called whenever an object\
    \ of a class is created. Its goal is to initialize the data members of the class.\
    \ In PHP, constructors need to be __construct() and may have any parameters you\
    \ need. By default a constructor takes no parameters, but you might use parameters\
    \ to define special initialization data. If, for example, you defined your constructor\
    \ as function __construct($a) (assuming that $a would hold a number), you could\
    \ initialize an object $myObj = new MyClass(12);\n\nIf your class derives from\
    \ a parent class, and you wish to call your parent's constructor, you do parent::__construct();\n\
    \nA destructor does the opposite of a constructor. It is a method called when\
    \ the script is finishing running and all objects are freed from memory. Its intended\
    \ use is removal of all data that are no longer needed, and must be named __destruct().\
    \ Destructors may not have parameters.\n\n```\n<?php\nclass BaseClass {\n    function\
    \ __construct() {\n        print \"BaseClass constructor\\n\";\n    }\n    function\
    \ inheritedFunction() {\n        echo \"howday!\";\n    }\n}\nclass SubClass extends\
    \ BaseClass {\n    function __construct() {\n        parent::__construct();\n\
    \        print \":In SubClass constructor\\n\";\n    }\n}\n$obj1 = new BaseClass();\n\
    $obj2 = new SubClass();\n$obj2->inheritedFunction();\n?>\n```"
