  md: '# THE WEB SERVERS 7


    # THE WEB BROWSERS


    Right at this point we have seen what lead to the creation of the computer network
    known as “the Internet,” and the reasoning behind the apparition of the World
    Wide Web. But we still have a main problem that we haven'' answered yet—how do
    we use all this to communicate? First the Internet brought us the media through
    which information would flow, then the WWW created a standard format for information
    formatting, but there was still the problem of how to read that information. To
    solve that problem, some tool had to be created that would use the current standards
    and decode Web documents and format them in such a way that would be intelligible
    to the user. The Web browsers came to the rescue and solved that problem. The
    first graphical user interface (GUI) with the WWW to appear Mosaic, created by
    the National Center of Supercomputer Applications (NCSA) at the University of
    Illinois in 1993. In 1994 Norway entered into history by creating the still-used
    Opera. Soon afterwards appeared, followed by Microsoft’s Internet Explorer, which
    appeared along Windows 95. From that point on, the browsing market has done nothing
    but evolve and—Fortunately for the users—improve. Nowadays the two main browsers
    used are Internet Explorer and Mozilla Firefox.


    # THE WEB SERVERS


    Now that we know what the Internet is, the purpose of the World Wide Web, and
    why we use Web browsers, another question may arise: “Where are all these data
    stored?” It is definitely enlightening to know how we access all the information
    that the World Wide Web has to offer, but where is all information? Well, the
    answer is pretty simple; it is in all the computers that have the Internet. Some
    people become alarmed, believing that any computer to the Internet will automatically
    make all of its files accessible to the entire world. Not to worry, that is not
    how it works. In order to share information in a specific computer, some software
    has be installed on the computer, making it a “Web server.” The server creates
    a list of folders that will be shared when someone attempts to connect to the
    computer using standard Web protocols. There are two main competitors in the Web
    server market. The first one, my personal favorite and the one used throughout
    this book, is Apache, developed by the Apache Software Foundation (www.apache.org).
    Apache has the great advantage of being totally free of charge and works on every
    platform. It is an open-source program, which means that you can see the code
    behind the server and even participate in the improvement of Apache. It is reliable
    and vastly used around the world, and pretty much the only reliable option on
    UNIX/Linux. The other main server is Microsoft’s Internet Information Services
    (IIS, www.microsoft.com/iis). IIS is not open-


    ![](img/6573b0a7bed590e34e9cfe58e6fc8c60_21_0.png)'
