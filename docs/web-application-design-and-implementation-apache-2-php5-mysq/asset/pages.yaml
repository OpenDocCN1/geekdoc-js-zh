  md: '# 32 INTRODUCTION TO HTML


    # EXTERNAL REFERENCES


    Two of the most common features in Webpages are links and images. They are two
    ways of referring to an external file. One places an image in the middle of the
    page, while the other sets up a clickable area that will open any type of file,
    or even open your default email client to send an email.


    # Links


    Let us start with the links. Any text or image can be turned into a<a> link by
    wrapping it with the <A>... </a> tag. The attributes for the <A> tag are essential
    for its proper functioning. The first attribute to set should be HREF, which will
    hold the URL that the link will refer to. The address could be an absolute or
    relative URI, or a call to a client by entering mailto:any@address.here. You can
    also select a target for the link, which specifies where the link should open.
    This is done by using TARGET followed by the name of the window or frame you wish
    the link to open. The name has been set to a window or frame, it will work without
    complications, but if it has not been set yet, the link will pop up a new window
    that will receive the same name written in the target parameter. From this point,
    any link targeting the same name will open on new window. Instead of providing
    a name, it is also possible to enter _blank to always open the link in a new popup
    window, _self to open the link in the current window or frame, _parent to open
    the link in the parent frame (see the section on frames), _top to open the link
    in the parent of all parents (top frame). Here is a link example:


    ```

    < HREF="page.html" TARGET=_blank>This is the clickable area</a>

    ```


    Another interest of the <a> tag is to create linking points in the page. This
    means creating a point in the page that can be linked to, allowing fast scrolling
    of long pages. To use this feature, write <A NAME="anyname">...</a>. To link to
    that area, add #anyname at the end of the address of the file you are linking
    to, or directly enter #anyname as the HREF if you wish to move inside the current
    file. Here is an example:


    ```

    <HTML>

    <HEAD><TITLE>Link Examples</TITLE></HEAD>

    <body>

    <A NAME="top">This</a> is the top of the page!<<BR>

    Here is a normal <A HREF="http://www.google.com"

    target="_blank">link</A><BR>

    Now I''m going to add loads of BRs to make this page

    really long!<BR><BR><BR><BR><BR><BR><BR><BR><BR>

    ```'
