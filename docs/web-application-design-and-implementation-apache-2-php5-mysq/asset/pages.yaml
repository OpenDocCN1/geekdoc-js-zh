  md: 'TCP/IP BASICS


    # The Transport Layer


    The transport layer is home to two main protocols: the User Datagram Protocol
    (UDP) and the Transmission Control Protocol (TCP). UDP is a connectionless protocol,
    meaning that the order in which messages are sent by the emitting computer is
    not necessarily the order in which they will be received in the destination computer.
    This protocol is not of interest in this book, so we will not go any further in
    the explanation of UDP. TCP, on the other hand, is very important for Web access;
    it is a connection-centered protocol. TCP handles the connection, disconnection,
    data flow control and transferring, and many other tasks required to establish
    a proper communication between two computers. It receives the data that needs
    to be sent by the user and breaks it down into packets of 64 KB (kilobytes; i.e.,
    65,536 bytes), which are then sent through the IP protocol. In order to send those
    packets, TCP needs to open something called a “socket,” which can be used by programs
    to access files. S are a couple of <IP address, port> which can be opened or closed,
    and allow both reading and writing. For example, a character in a TV show who
    asks the technician to “open a socket on the computer” actually can imagine “ports”
    as electronic gates that reside within your computer and are needed to send or
    receive information. For example, when you access a Webpage, the information contained
    in the page is sent to you via your port 80 (generally). If you access an FTP
    server, you are using your port 21; if you are connecting through SSH (Secure
    Shell); used to connect to remote computers), you''re probably using port 22.


    # The Application Layer


    This layer is responsible for the protocols that most users know or at least heard
    about. The first and utmost important for this book is the HyperText Transfer
    Protocol (HTTP). HTTP was created for the exchange of HTML documents; it is based
    on TCP/IP and is responsible for the communication between Web server and Web
    client (you and your browser!). This protocol meant to be multipatform, everything
    is sent in ASCII (American Standard Code for Information Interchange) format,
    as plain characters. We will talk more about HTML documents in the next chapter.


    Many other protocols in the application layer are important in the everyday life
    of an Internet user, such as the following ones:


    +   * File Transfer Protocol (FTP)—responsible for transferring files.

    * Simple Mail Transfer Protocol (SMTP)—responsible for sending emails.

    * Post Office Protocol (POP)—usually seen as POP3 by email clients, this protocol
    allows you to retrieve email messages from your mail server.

    * Internet Message Access Protocol (IMAP)—another protocol used for email transfers.'
