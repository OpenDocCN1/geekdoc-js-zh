    this object: write, which adds text to a page. The document object also includes
    arrays as forms, images, and links, which allow you to access and set up all the
    data inside forms, images, and links in the page.


    The main problem of the document object is that browsers might have different
    properties inside it, making it harder for the developer to write multibrowser
    code. For example, Netscape Navigator creates an array tags in the document object
    that Microsoft Internet Explorer does not support. Let us concentrate on the basic
    arrays inside the document object.


    First, we have the images array. Each time you use an image as the array array,
    with the <IMG> tag, there is a reference to that image that is added to the images
    array. The very first image will be at document.images[0], the second image in
    document.images[1], and so on. You may also add a name attribute to the IMG tag,
    allowing you to refer to the image through the link''s name. For an example defined
    as <IMG SRC="bewuchy.gif" NAME="myfile"> can be accessed by doing document.images["myfile"].
    When you have a reference to an image, you can change any attribute inside the
    tag by writing a period (.) followed by the name of the attribute to change. The
    following example replaces the user for the image on the page with the one provided
    in the prompt:


    ```

    <HTML>

    <HEAD>

    <TITLE>Image Loader</TITLE>

    </HEAD>

    <body>

    <IMG SRC="image">

    <SCRIPT LANGUAGE="JavaScript">

    var url = prompt("Enter an image URL, "http://wroshyr.free/images/bewuchy.gif");

    document.images["image"] = url;

    </SCRIPT>

    </body>

    </HTML>

    ```


    The next is the links array. It does the same as storing all links created with
    the <IMG> tag, it stores references to all links created with the <A> tag. With
    the images, you may also provide a name to the links so that they are easier to
    refer to. Since it is also possible to change any of the links'' tag attributes,
    you can drive a user crazy by switching the directions of your links, for example,
    document links[0].href="differentpage.html".


    Last but not least, we have the forms array, which holds references to all the
    forms in the page. You might think that usefulness is limited since pages usually
    contain at most a single form, and you probably wouldn''t want to change its properties
    as action or method, or your receiving script'
