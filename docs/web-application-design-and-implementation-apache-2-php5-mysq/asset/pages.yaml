    You will learn that “Scope creep will kill you!”—meaning that you keep changing

    the specifications of the project after you already agreed on, your

    project will be delayed, potentially making you lose your window of oppor-

    tity as well as many development hours (time is money). The “updates"

    rate concentrate on bug fixes, and ensure robustness on the project.


    A typical thing that should be done in this step is to add forms verification

    for every single form on the Website. You should check all the data transmit-

    t from page to page and make sure that it contains what it holds.

    At the end of this step your entire Website would be functional, but might

    not look the best. So let us advance to step 6.


    # Step 6—Improvements to Looks


    Once you know that your pages work, you might start playing around withndifferent
    style sheets. The best thing to do is as you are developing the pages is

    to think about what different styles you will need and start providing class

    ames to all the elements that will need a style. Then create an empty style

    sheet and link to it. In this step we edit the style sheet in question and experi-

    ment with colors, fonts, sizes, and layouts.


    # Step 7—Thorough Testing, Hacking Attempts


    So, you finally have a Website with all the required functionalities, you have

    an administrator control panel, the page uses a nice style sheet that you think

    your supervisor will like, and you probably think that you are finished with

    t project... unfortunately it is not yet the case. This step is probably one

    of the most overlooked steps in Web development, and it is the fundamental

    difference between a good Website and an excellent one.


    In this phase you should group yourself with some friends and coworkers

    s sure that you have backups of the pages and database before you start). By “breaking”
    the Website I mean

    try to insert corrupt data, hacking into the administrator panel without

    proper authorization, and things like that. It is quite funny to do and

    forces you to use your imagination to try and figure out the obscure way

    to make the pages not work as intended.


    A typical thing I do when testing your students’ Websites is attempt to insert

    HTML code in any form containing data that will be displayed. For example,'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# PROCEDURE 233


    could write things like <FONT COLOR="WHITE"> if the background color is white
    when asked for a name; that way you force all text to appear in white, virtually
    "erasing" all data that should appear on the page. The data would still be there,
    but would show up as over white. Sometimes I decide to insert JavaScript like
    <SCRIPT LANGUAGE="JavaScript">alert(''i!'');</SCRIPT>, which will produce an alert
    message every time the field is in question. This is usually an easy way to illustrate
    a serious problem, as it could allow a user to enter a JavaScript code that would
    generate popup opening malicious Websites. Those Websites could have the same
    appearance as your legitimate Website, and could be asking users to enter their
    own personal username and password information. This is a "hacking" technique
    called "phishing." It basically tricks users into entering their usernames and
    passwords into a "fake" Website that will transmit to the hacker in question.
    Making sure that no inserts HTML in your pages is a good first step to avoid this
    problem. In short, you must do thorough testing in all code that allows the user
    for data, using things like regular expressions, or even PHP functions like strip_tags
    to annihilate any tags that could have inserted.

    If you script JavaScript to upload data to the server, be sure to test the data
    (there is an upload script in the appendices), and keep your brain functioning
    to find new ways to break your code. You should spend much time in this phase,
    since the Internet is populated with malicious users who will attempt to break
    your pages.


    # Step 8—Presentation


    The last important step after you to be sure that you have produced the best Website
    ever is to present it to the program sponsors (the people who paid for it) and
    make sure that they like it. You probably think this is the easiest step, but
    unfortunately project sponsors always want new features in their sites, so be
    prepared for criticism, and other remarks on things that should be included that
    did not work. It is also a good chance to get some input that help you do on the
    site. The approach I would recommend is to start explaining your project in general,
    discussing only the main features and then focusing a little more on details of
    the functionalities only if you are asked to. This is assuming that you are talking
    to a person with no Web knowledge. If you present to a fellow programmer, you
    might want to skip the "commercial talk" and go straight to the functionalities,
    emphasizing security features and administrator panel.


    # Step 9—Publication


    After the project has been approved, it is time to release it. Upload it to the
    Web server of your choice, and make sure that everything is set up properly. All
    pages should be accessible, all include files should be in secured folders,'
