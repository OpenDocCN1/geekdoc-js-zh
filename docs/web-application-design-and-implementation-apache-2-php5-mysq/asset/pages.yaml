    to a development platform, rather than an actual programming language; that is
    why you will probably see in the markets that teach how to “program” in ASP.net
    with another programming language.” There are many to choose from, including,
    for example, Basic Basic.Net. The whole idea is that you develop ASP.NET applications
    in your desired language. It is all based on the Common Language Runtime (CLR)
