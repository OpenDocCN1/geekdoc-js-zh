    The ON DUPLICATE KEY UPDATE allows you to update the fields of existing entries
    if you attempt to insert an entry with a conflicting primary key or unique field.
    For example, in our case, the email field is UNIQUE, so if I attempt to insert
    a new entry with the same address (sgabarro@stevens.edu), the MySQL server will
    find that conflicting unique field and update it by looking at the set of assignments
    placed after the ON DUPLICATE...


    If you are trying to update an entire field, for example, preserving the primary
    key, you can use REPLACE, which works exactly the same way as INSERT, except that
    it does not accept the ON DUPLICATE KEY UPDATE field. Instead, in case of a duplicate
    field, the conflicting entry is removed and replaced with the new entry. For example,
    if the id_student for the entry containing my name was 5 and I wanted to update
    my email address, I could


    ```

    REPLACE INTO students (id_student, email) VALUES (5, ''sgabarro@cs.stevens.edu'');

    ```


    Another final way to update a series of entries is to use UPDATE with the following
    syntax:


    ```

    UPDATE [LOW_PRIORITY] table_name SET col_name=expression1, [col2=expr,...] [WHERE
    where_condition] [ORDER BY col_name] [LIMIT row_count]

    ```


    The UPDATE works simply; you provide a condition as part of the where_condition
    to match all the elements you want to update, and it will change the specified
    columns for all matches found. If you provide an ORDER BY statement, the updates
    will be done in the order of the sorted elements. Finally, the row_count is used
    as a limit and represents the maximum number of rows to update. If you do not
    provide a limit, all matches will be updated. Also, if you do not provide a WHERE
    statement, all entries in the table will be matched and updated (based on the
    limit). For example,'
