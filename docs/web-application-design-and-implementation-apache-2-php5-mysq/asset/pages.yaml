  md: '# Lists


    Lists are a tool rarely used by developers on Webpages for reasons that I do not
    fully understand. I have often seen students creating paragraphs after starting
    with a number or series of numbers to create a topic list for example, when HTML
    provides the tools to do so automatically.


    There are two main types of lists: ordered and unordered. An ordered list will
    always include the position of the current element in front of the text itself,
    whereas unordered lists pretty much are the same as adding bullets in front of
    the text. An ordered list is created with the tag <OL>... </OL> and should always
    include TYPE as a parameter, with either of the following values:


    +   - for decimal numbers (1, 2, 3, 4, ...)

    - for lowercase alphabetical characters (a, b, c, d, ...)

    - for uppercase alphabetical characters (A, B, C, D, ...)

    - for lowercase roman numerals (i, ii, iii, iv, vi, ...)

    - for uppercase roman numerals (I, II, III, IV, V, ...)


    Another optional parameter is START, which takes a number that will be considered
    the position of the first element in the list. For example, a list defined as
    <OL TYPE=START=19>...</OL> would have its elements numbered XI for the first,
    XX for the second, XXI for the third, and so on.


    Unordered lists are created with <UL>...</UL>, and as you probably guessed, also
    require a TYPE parameter that will define the aspect of the bullets:


    +   - disk for a filled-circle

    - square for a square outline

    - circle for a circle outline


    Once you have defined an area to work as a list, you can add a new element by
    starting its line with the tag <LI>. Think of this tag as a bullet or number that
    you place in text, since it does not need to be closed. Each <LI> will either
    add a bullet or put the next number or following the line <LI> used in the same
    list. Then you can use nested lists if you wish to simply using <UL>...</UL> or
    <OL>...</OL> instead of a new <LI> tag. Each new nested list will be automatically
    indented, along with all its contents, keeping the lists clean.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# INTRODUCTION TO HTML


    Here is an example of nested lists:


    ```

    <HTML>

    <HEAD><TITLE>Nested Lists</TITLE></HEAD>

    <BODY>

    <OL TYPE=I START=19>

    <LI>I''m the first element, yet I show up as 19!!

    <LI>Second line

    <LI>And something different!

    <UL TYPE=circle>

    <LI>Aren''t circles pretty?

    <LI>Just wait until you try the other types!

    </UL>

    <LI>Where was I again?

    </OL>

    </BODY>

    </HTML>

    ```


    # Tables


    Tables are probably one of the most widely used systems for organizing pictures
    and text. A table is a very efficient tool when used properly but can cause painful
    results if not handled with care. Many programmers actually base their Websites
    on complex tables, which give a consistent look to their pages. Generally speaking,
    table fanatics tend to hate frames (next section) and vice versa. I personally
    think they are both needed. I use tables for the general layout of the site (header,
    menus, body, etc.), and I use tables to organize individual pages. The reason
    for this is that, whereas many people have pages that all start with the exact
    several dozen lines only for menus and headings that need to be loaded in every
    single page that is opened, I use a table that loads it, and stays open. Each
    page will open only the new content, without necessitating reloading of the page''s
    entire layout. But anyway, let us see how to use tables!


    The first thing is to define what will be treated as a table. It is very important
    to close it if you wish your page to have the desired look regardless of the version
    of the browser. In the mid-1990s browsers would go crazy when a table was not
    closed properly; nowadays browsers tend to solve the problem and output the right
    aspect. Regards, make sure that you close the tags! This is also important when
    starting rows and columns, as we shall. The official HTML syntax states that it
    is not necessary to close a row or cell definition, but I would strongly recommend
    everyone to do so, since it will make tables much easier to understand. To create
    a table, the tag used is <TABLE>...</TABLE>. This tag can take, among others,
    the following parameters:'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# ORGANIZING DATA


    WIDTH—specifies in pixels or percentage the width of the table

    HEIGHT—specifies in pixels or percentage the height of the table

    BORDER—defines the size in pixels of the table''s border

    CELLSPACING—defines in pixels the spacing between cells

    CELLPADDING—defines in pixels the padding around each cell

    ALIGN—"left," "right," or "center;"; specifies where the table will be

    aligned on the page

    BGCOLOR—background color for the page, in either letters or hexadecimal RGB values


    Note that WIDTH and HEIGHT can be omitted if you want the table to

    adapt to the size of the cells. Many graphic designers use these settings

    to create restricted pages that appear to be a single box, allowing the page to

    look exactly the same regardless of the resolution used by the client.

    TheORDER parameter to be used wisely; make it too big, and the page will

    look goofy. I generally set it to 0 or 1 for no border at all or just a small

    one. A border of 0 is extremely useful when, for example, using images as

    options. By having images of the exact size placed in a table, you

    can give many fancy effects to your pages, as for, use tabs in a

    folder, or a set of buttons in a futuristic interface. It is all up to your imagination\and
    your skills with image editors. Personally I am definitely not

    graphic designer, so I tend to keep it simple, or use text for my menus.


    Once you have defined the general rules for your table, you must specify

    the cells left to right and row by row. This means the very first thing is\ine
    a row with the tags <TR>...</TR>. Each new row must start and

    finish with these tags, which seldom take place (except maybe styles or

    heights). Once you are inside a row, you must write the cells one by one, in

    t order in which they will appear with each <TD>...</TD> for standard

    cells or <TH>...</TH> for header cells. Header cells are usually in the

    first row, and will automatically center and render the text they contain in

    boldface. Regardless of the cell type selected, you can use the following

    parameters:


    HEIGHT, WIDTH, BGCOLOR—do the same as with <TABLE> but for

    the current cell

    ALIGN—"left," "center," "justify," "right," or "char"; specifies the text

    alignment inside the cell

    VALIGN—"top," "middle," "bottom," or "baseline"; specifies the vertical

    alignment of the text inside the cell


    ROWSPAN and COLSPAN—take the number of rows or columns that

    cell should use


    ROWSPAN and COLSPAN are probably two of the major sources of error

    inter tables among HTML developers. They are not complicated, but it is easy'
