  md: '# 10 FUNDAMENTALS


    first example, 24.45 in the second) corresponds to the particular computer address.
    Choosing a network appropriately is important since it will decide the amount
    of computers that you can connect. For instance, a network with a subnet mask
    of 255.255.255.0 will be able to accommodate only 254 distinct IP addresses. This
    type of network is said to be of class C. A network with subnet of 255.255.0.0
    is said to be of class B, and finally 255.0.0.0 will be of subnet of a network
    of class A. One of the most important things when choosing your IP address is
    making sure that it is a valid address. You are not allowed to have an IP that
    is the same as your network address; for example, if your network is 192.168.1.0,
    you cannot have 192.168.1.0 as a computer''s IP address. The other restriction
    is that your computer address cannot be all ones in binary; for instance, the
    same network as the previous example, the 192.168.1.255 is not authorized (255
    is 11111111 in binary). This type of address is used by TCP/IP to send broadcast
    messages to all computers within the network.


    Now that we know the IP address route, you might be wondering how you can be in
    a class C network (with a maximum of 254 computers) and still be to access millions
    of computers worldwide, even though they are not in the same local network as
    you are. The answer to that is basically the use of routers. Routers act as a
    bridge between two separate networks. To function, they have two network cards
    in two separate networks. For example, you could have a router with one of its
    IP addresses as 192.168.1.254 in a class C network, and the other as 155.180.255.254
    in a class B network. If a computer connected to the class C network attempts
    to access an IP that is not part of the 192.168.1.0 network, it sends the IP requested
    to the router, which will then try to find that address using its second branch.
    The whole principle of the Internet is based on millions of networks connected
    through routers. Now, de to avoid taking the wrong path, several protocols can
    be used.


    Remembering the IP addresses of all the possible computers we would like to access
    is pretty difficult, so symbolic addresses were created. Those addresses work
    as a set of aliases real IP addresses, such as .com, .gov, .net, .es, and .co.uk
    make it easier, it is possible to assign a name to a specific address, such as
    google.com, for example. In order to retrieve the corresponding IP, the computer
    accesses something called a Domain Name Service (DNS), which contains a table
    with all equivalences between names and IPs. Every time you see a dot in a name,
    this means that you are accessing a subdomain; for example, if you visit the page
    http://steven.bearchy.com/, you are looking within all companies (.com) for the
    one called “bearchy”, and once you find it, you look for the subdomain called
    “steven” within “bearchy”. The “http://" section allows the computer to know that
    you wish to access the domain using the HTTP protocol. DNS is another protocol
    residing in the Internet layer.'
