  md: "# PHP5 OBJECT-ORIENTED PROGRAMMING\n\nIt is possible to specify what to do\
    \ when you are trying to clone an object by creating a method __clone(). For example,\
    \ if you have a class that contains object definitions, you could have a __clone()\
    \ method that clone the data members rather than doing a shallow copy. Check this\
    \ example:\n\n?PHP\n\n```\nclass SubObject {\n    static $instances = 0;\n   \
    \ public $instance;\n    public function __construct() {\n        $this->instance\
    \ = ++self::$instances;\n    }\n    public function __clone() {\n        $this->instance\
    \ = ++self::$instances;\n    }\n}\nclass CloneMeWell {\n    public $object1;\n\
    \    public $object2;\n    function __clone() {\n        $this->object1 = clone\
    \ ($this->object1);\n    }\n}\n$obj1 = new CloneMeWell();\n$obj1->object1 = new\
    \ SubObject();\n$obj1->object2 = new SubObject();\n$obj2 = clone $obj1;\n```\n\
    \nIn this example we create an instance of the class CloneMeWell, containing two\
    \ objects of the class SubObject. The SubObject constructor increases the static\
    \ data member and saves it in the $instance data member. This variable stores\
    \ how many instances of that class were created. We then make a clone of CloneMeWell,\
