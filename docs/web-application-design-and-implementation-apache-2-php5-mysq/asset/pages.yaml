    accessible; the domain, which states which domain can view the cookie (you can)

    usually leave the option blank to use the current domain); and the secure flag,

    dec whether you wish to encrypt the cookie.


    To create a cookie with PHP, use setcookie($name, $value, $expires,

    path, $domain, $secure); Technically you need only the first three parameters,
    the rest can be left as default. Imagine that you wish to create a cookie

    called "myCookie" that contains "Hello World!", and you wish the cookie

