    the page’s output over the browser.


    # ANOTHER BIG OPTION—Perl


    Even though I used Perl only when I was a computer science student, and considering
    that it is never in my list of languages to use, I have nothing negative to say
    about it. Perl is a very powerful programming language, and also very flexible,
