    # ARRAYS


    Basic Arrays


    Arrays are sets of data stored as a single variable. You could imagine a set as
    a cabinet with multiple drawers. Each drawer holds an element, and the position
    of the element is called its "index". Unlike most programming languages, where
    arrays hold values of the same type, arrays in PHP can hold any type of data in
    each one of its elements. This makes PHP arrays much more flexible but can potentially
    create problems if you don''t remember the types used for each index. In order
    to store values inside an array, you need to place the index to access between
    square brackets, right after the variable name holding the entire array. For example,
    if $Array is an array, you could access the element at index 3 by writing $Array[3].
    Note that indices start at 0, but you are not required to use consecutive indices.
    In other programming languages you must use index 0, 1, 2, 3, and so forth. In
    PHP you may have an array with three elements positioned at indices 12, 42, and
    51, for example. It is not recommended but it causes no issues. Here is an example
    that stores an integer, a string, and a double in the array and then echo the
    types of these elements:'
