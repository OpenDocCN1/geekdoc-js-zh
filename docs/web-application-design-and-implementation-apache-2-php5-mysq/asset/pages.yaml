    # String Data Types


    Here are the main types that can be used in MySQL to store strings:


    +   - CHAR(M) [BINARY]—used to store a string of a specific number of characters
    (given by M). Note that, for example, a CHAR(10) will always use 10 characters
    in memory, regardless of how many characters you actually needed.


    +   - VARCHAR(M) [BINARY]—variable-length string. The difference between a VARCHAR
    and a CHAR is that in CHAR the max (maximum) size represents the number of characters
    used in memory at any time whereas VARCHAR uses only the exact amount of characters
    needed, up to the max size. For storing, “bla” in a VARCHAR(30) will not use 30
    characters, but only as 3 needed.


    +   - TINYBL—a block of data that can hold up to 255 bytes.


    +   - TEXT—like a TINYBL but holds text data rather than a blob.


    +   - BLOB and TEXT—bigger blob and text fields can hold up to 65,535 bytes of
    binary data (BLOB) or text data (TEXT).


    +   - MEDIUMBLOB and MEDIUMTEXT—blob and text of up to 16,777,215 bytes or characters.


    +   - LONGBLOB and LONGTEXT—blob and text of up to 4,294,967,295 bytes [4 GB (gigabytes)]
    of data.


    +   - ENUM(''value1'', ''value2'',...)—an enumeration. A string object that can
    have only one value, chosen from the list of values ''value1'', ''value2'', ...,
    NULL, or the special ''?'' error value. An ENUM can have up to 65,535 distinct
    values. Data are internally stored as integers.


    +   - SET(''value1'', ''value2'',...)—a set that can have zero or more values,
    each of which must be chosen from the list of values ''value1'', ''value2'',...
    A SET can have up to 64 members.


