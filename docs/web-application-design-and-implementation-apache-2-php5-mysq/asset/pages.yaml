    First, we have PHP. It is one of the most powerful and flexible programming languages
    for the Web. It is free, easy to learn (making it ideal for a semester course),
    and simplifies any database access you might want to use.


    JavaScript, although I do not like it as much as a language itself as it is much
    more restrictive syntax than PHP, is a really useful programming language. As
    we see, it is important to have a client-side language to couple with PHP to make
