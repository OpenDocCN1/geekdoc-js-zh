    foreach to extract all the details inside it and display them. The loop foreach
    allows fast access to every entry in an array regardless of whether it is an associative
    array. There are two main ways of using foreach:


    ```

    foreach ($arrayName as $variable)

    ```


    or


    ```

    foreach ($arrayName as $key=>$element)

    ```


    Regardless of the case, $arrayName has to be an array. In the first case, $variable
    is a variable name that doesn’t exist yet. The foreach loop will store every entry
    in the array in variable, one at a time. As in all the other types of loops, the
    foreach will run the next line after the foreach as long as there are elements
    in the array. For example, you could display elements in an array $arr as follows:


    ```

    foreach($arr as $elem)

    echo $elem;

    ```


    Each execution of the code under the foreach is called an iteration of the loop.
    In the first iteration, $elem will hold $arr[0]; in the second iteration, $elem
    will be the same as $arr[1]; and so on until there are no more elements in the
    array, in which case the program will skip directly to the instruction after the
    iterating statement. It is important to realize that $elem holds an actual copy
    of the element in the array, not the element itself. Note that it is possible
    to group several instructions in a same loop by simply surrounding all the statements
    with curly braces. For example, the following code will run two instructions in
    each iteration:


    ```

    foreach ($arr as $e)

    { echo $e . ";

    echo "<BR>";

    }

    ```


    The second version of foreach allows the creation of two variables, for the current
    key, and one for the element associated with that key. Obviously this is useful
    mostly with associative arrays, but you may still use it with regular arrays,
    in which case your keys will be the indices of each element.'
