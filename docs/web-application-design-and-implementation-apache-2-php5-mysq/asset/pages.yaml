  md: '# 120 CREATING SOME INTERACTIVITY


    # Sessions


    One of the most efficient and easy ways of transferring information between pages
    without the user''s knowledge is to use sessions. Sessions can be imagined as
    a “magic cloud” that contains all the variables that we need it hold. The session
    can be accessed from any PHP script, which can either add more data or read data
    from the session. The session information is saved in the server computer either
    on text files (that''s the standard behavior) or on the Web server''s process
    memory. This session much more flexible than cookies to store data, as the only
    limit is the size of the server''s drive


    When a user accesses a page that uses sessions, a unique session identifier is
    randomly generated and encrypted. This session id usually stored in the client''s
    buffer as a cookie, although you do not need to manually create the cookie, as
    the session initialization will do this for you. If the browser the client is
    using does not accept cookies from your domain, you can still transfer the session
    identifier between pages with the GET or POST method.


    The default session configuration should be good enough for the scope of this
    book, but there are some settings you can change in your php.ini file (each element
    will be written as a $setting=default_value$, followed by an explanation of what
    it does):


    +   * session.session_handler = files—this line specifies the way in which the
    session information will be stored in the server. Other possible values are “mm”
    for memory, or “user” if you want to manually configure the saving process.

    * session.save_path = C:\PHP\sessiondata—folder in which the data will be stored.

    * session.use_cookies = 1—use cookies? 1 for yes, 0 for no.

    * session.name = PHPSESSID—name provided to the session.

    * session.auto_start = 0—strongly recommend this as 0. You may write 1 if you
    want a session to start automatically in every single PHP script that you write.


    To use session in PHP, you first need to start the session with session_start().
    If no session was yet existed for the user, a session will be created. If a session
    already existed for the user, starting the session will allow you to access the
    existing session. Remember that you must use session_start() if you are planning
    on using sessions, or the session data will not be accessible. If you want to
    destroy a session, the session data any longer, use session_destroy(). This function
    is usually one of the last steps of a logout procedure. When a session is started,
    you may check the name and id of the session with the functions session_name()
    and session_id(), respectively.'
