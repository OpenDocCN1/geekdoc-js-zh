    in any format that its writer deems the best. It is a very common language that
    is at the base of platforms .NET. It is used to mostly exchange information through
    the Web in an organized manner, making it easy to retrieve information from its
    files. XML files are actually interpreted by most browsers nowadays, showing its
    contents in a tree format, such as you would see on a file explorer.


