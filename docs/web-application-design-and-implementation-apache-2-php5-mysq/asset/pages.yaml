    # How to Use It?—HTML Side


    Your templates should be small sections of HTML code that you want to be able
    to combine and reuse. For example, you could have a file "tablerow3.html" that
    would allow you to create a row with three columns. Any area that should be dynamically
    changed by PHP should contain a template variable. Template variables should be
    made of uppercase letters, digits, or the character underscore, and surrounded
    by curly braces. For example, {ITEM_1} is a valid template variable name. If we
    have to to create rows on a table containing three columns, but don''t know what
    column will contain, we could have the following template file:


    ```

    <TR>

    <TD>{CELL_1}</TD>

    <TD>{CELL_2}</TD>

    <TD>{CELL_3}</TD>

    </TR>

    ```


    You could have another file called "minipage.html" that would contain the table
    definition in the rows which would be inserted. It could be something like this:


    ```

    <HTML><HEAD></HEAD><BODY>

    <TABLE>

    {ROWS}

    </TABLE>

    </BODY></HTML>

    ```


    The most important thing to remember is to place all template files in the same
    folder. Try to think in terms of reusability and do not be afraid to break your
    standard page into many different template files. The more template files with
    "template variables," the more flexibility you will have when building your final
    output.


