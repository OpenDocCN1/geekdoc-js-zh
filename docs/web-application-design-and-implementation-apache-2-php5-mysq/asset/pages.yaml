  md: "# COPYING AND CLONING OBJECTS 107\n\nIt is possible to implement more than\
    \ one interface, by simply writing the names of all implemented interfaces separated\
    \ by commas. It is not possible to implement two interfaces that share function\
    \ names, as this would create ambiguity. Also, if your class implement an interface,\
    \ it must implement all the interface's functions, or be declared as an abstract\
    \ class, since the non-implemented methods become “abstract”.\n\n```\n<?php\n\
    // Declare the interface 'iTemplate'\ninterface iTemplate {\n    public function\
    \ setVariable($name, $var);\n    public function getHtml($template);\n}\n// Implement\
    \ the interface\n// This will work\nclass Template implements iTemplate {\n  \
    \  private $vars = array();\n    public function setVariable($name, $var) {\n\
    \        $this->vars[$name] = $var;\n    }\n    public function getHtml($template)\
    \ {\n        foreach ($this->vars as $name => $value) {\n            $template\
    \ = str_replace('{', $name . '}', $template);\n        }\n        return $template;\n\
    \    }\nn\n```\n\n# COPYING AND CLONING OBJECTS\n\nThere is a very important thing\
    \ to realize about objects, and that is an object variable is technically a reference\
    \ to the actual object. Therefore, copying an object by doing object1 = object2;\
    \ simply causes both variables to refer to the same object. In many cases we will\
    \ not just want a copy of the reference to the object but a copy of the entire\
    \ contents of the object. To do so, we can use the clone operator, for example,\
    \ object1 = clone(object2);\n\nThe clone operator will create a new object and\
    \ copy all the attributes from object2 to object1. This may sound like using the\
    \ equal sign (=), but the main difference is that cloning will call any existing\
    \ __clone() method of the class (see below)."
