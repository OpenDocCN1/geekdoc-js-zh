  md: '# # 10

    Making Cleaner Code and Output


    # ## CLEANING UP YOUR CODE


    One of the drawbacks of embedding HTML and PHP is that it makes code look quite
    messy. It is also pretty easy to get confused on where HTML ends and PHP starts.
    If we manage to avoid writing HTML inside PHP code, and if we avoid using PHP
    code around regular HTML tags, we can have code that is much easier to read. The
    problem that this will cause is that it will be more complicated to implement
    the scripts.


    To face this challenge, we will use some called templates, and more particularly,
    a class called FastTemplate. There are many different template options, but I
    have been using FastTemplate for many years and it is fast and efficient to use.
    The idea behind templates is to have pieces of HTML in a small file that will
    be used as puzzle pieces to finish our webpages. Each little HTML piece will be
    called a template file, and might contain areas that we will manage to change
    from our PHP code. Just imagine those dynamic sections as if they were "template
    variables."


    # ## What You Need


    The first thing you need is to make sure that you have downloaded the include
    file. You can see the entire code in Appendix D, and you may download it from
    the companion Website (the file is class.FastTemplate.zip).


    > Web Application Design and Implementation: Apache 2, PHP5, MySQL, JavaScript,
    and Linux/UNIX, by Steven A. Gabarro.

    Copyright © 2007 by John Wiley & Sons, Inc.'
