  md: '# TCP/IP BASICS 9


    6. Presentation layer—concerned with the syntax and semantics of the information
    transmitted from end to end. X Windows is considered a level 6 service.


    7. Application layer—provides the utilities and tools for application programs
    and users, like telnet, FTP, DNS, and HTTP.


    TCP/IP is a binary simplification of the OSI model that concerns on only four
    layers: network access layer (Ethernet, FDDI, or ISDN), Internet layer (IP), transport
    layer (TCP, UDP), and application layer (FTP, telnet, SMTP, HTTP).


    # The Internet Layer


    The Internet layer is the equivalent of the network layer in the OSI model. It
    contains the Internet Protocol (IP), which provides addressing, datagram services,
    data package segmentation, and transmission parameter selection. In order to function
    properly, TCP/IP relies on IP addresses, which are assigned to each computer.
    An IP address is composed of 4 bytes, and of these numbers can range between 0
    and 255, since it represents only one of the bytes of the IP address (and, as
    you should know, you can represent 256 numbers with only 8 bits). Each IP address
    is composed of two parts, the network address and the computer address. To understand
    how the address is broken down, you your subnet mask. The way it works is through
    a binary AND between your address and your subnet mask. The result of that operation
    represents the network address. For example, let''s assume that your IP is 192.168.1.20,
    and your subnet mask is 255.255.255.0. Let us see how we get the network address:


    If you are not sure how to use the binary AND with nonbinary numbers, start by
    transforming each number to binary. 192.168.1.20 becomes 11000000.10101000.00000010,
    and 255.255.255.0 is 11111111.11111111.11110000. Performing the AND operation
    between those two numbers gives us 11000000.10101000.00000000.00000000, which
    is no other than 192.168.1.0. You can achieve this result by realizing that 255
    in binary is 11111111, and since an AND operation between a 1 and any other bit
    will leave it unchanged, we can basically keep the numbers of the IP address that
    corresponds to the 255 of the subnet mask. We know that a binary AND between 0
    and anything will always be 0, so where our subnet mask is 0, if we have an IP
    of 155.180.24.45 and a subnet mask of 255.255.0.0, our network address will be
    155.180.0.0.


    This network address lets us know which computers will be able to communicate
    with directly. Only computers that are in the same network can “see” each other,
    so a computer in a 192.168.1.0 and another one in a network 155.180.0.0 will not
    be able to communicate with one another even if they are directly linked to each
    other. The rest of the IP address (20 in'
