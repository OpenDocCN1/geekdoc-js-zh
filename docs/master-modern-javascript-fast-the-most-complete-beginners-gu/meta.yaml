  md: '# # Chapter 1 - Introduction to JavaScript and Programming


    If you have ever written a simple computer program, this chapter will be very
    easy. What is a computer program? A computer program is a set of instructions
    that tells the computer should do. But how the computer understands our instructions?
    The computer only understands one language, and this one is very simple and represented
    by zeros and ones, and it looks something like this example:


    0010 1000 0101 1100 1001 1110 0100 0110


    But you don''t have to be worried; we will not need this for our course. Please
    remember this is just an introduction to JavaScript programming in general.'
  merge: -1
  pgno: 19
- img_proc: false
  md: '# Assembly "low-level" languages


    Writing a computer program using 1’s and 0’s is very hard, challenging, and becomes
    mission impossible if you want to write bigger and more complex programs. The
    next big thing in the programming world was the introduction of assembly languages.
    These languages were using notations for each instruction, but they were still
    "low-level" language.


    # “High-level” languages


    The need for more powerful and capable languages was there; therefore, more complex
    and high-level programming languages were developed. One of those languages was
    FORTRAN. At that time, FORTRAN was developed by IBM and was very popular among
    programmers. But still was not an easy language to learn for the developers. These
    languages were more capable than their predecessors, where programmers'
  merge: -1
  pgno: 20
- img_proc: false
  md: 'needed to write each instruction directly into the machine. In the coming years
    and decades, many languages were developed, but one was a particular success.
    The name of this language is C. The programs written in C language are easier
    to understand than FORTRAN and can be executed in Unix operating systems. Unfortunately,
    all of these languages developed in the past, and even the ones developed today
    cannot understand and use natural language such as English.


    # How does a computer understand the code?


    When we write a piece of code, the computer or the machine does not understand
    what this means. So, how does the computer understand the code we have written?
    There is a special program called translator, and this program will read the code
    and convert it to a set of instructions that the computer can understand. Because
    of this, we can translate the computer program and execute the same'
  merge: -1
  pgno: 21
- img_proc: false
  md: 'program on a different machine, isn’t this great? It is very powerful to run
    the same program on multiple computers with little or no changes at all. With
    the assembly languages, this was not possible. So, these translator programs are
    called compilers. The compiler''s job is simply to get the original code or program
    known as source, then to translate it into an executable program. The executable
    program, when needed it can be run or executed. Today the programming languages
    are using interpreters instead of a compiler. The idea behind this approach is
    that the interpreter reads small parts of the program and is instantly executed,
    so there is no waiting/wasting time. The languages that can do this are called
    scripting languages, just like the one we will cover in this book.


    # Understanding JavaScript


    Why do we need JavaScript, and why is JavaScript so popular? As everyone knows,
    JavaScript is one of the most popular'
  merge: -1
  pgno: 22
- img_proc: false
  md: 'programming languages ever developed. The majority of the websites use JavaScript.
    The popularity of JavaScript surged even further after the development of Node.js
    made it possible to use JavaScript outside of the web browsers, which was impossible
    in the past. In the past, JavaScript was primarily a client-side language, or
    in simple words, it runs on your computer within your browser. Node.js, as I mentioned,
    made it possible to execute JavaScript on servers.


    If you have learned any programming languages before, you will know that JavaScript
    is a high-level, interpreted, object-oriented programming language. Please do
    not confuse JavaScript with the Java programming language as many students do.
    They are completely different.


    # A bit of JavaScript history


    Brendan Eich developed JavaScript in 1995. As everyone knows, JavaScript''s popularity
    surged even further after the development of'
  merge: -1
  pgno: 23
- img_proc: false
  md: 'Node.js. The Node.js made it possible to use JavaScript outside of the web
    browsers, which was impossible in the past. In the mid-1990s, both Netscape (now
    Mozilla) and Microsoft were in the midst of browser wars. In September 1995, a
    Netscape programmer, Brendan, developed a new scripting language known as Mocha
    in 10 days. This language then changed its name to LiveScript and finally to the
    very popular name that we know today, JavaScript. JavaScript became popular, and
    its rapid growth meant only one thing. This language must be maintained, managed,
    and standardized. Therefore, in 1997 Netscape submitted the language to ECMA (European
    Computer Manufacturers Association) for standardization. ECMA released a standardized
    version called “ECMAScript,” but it was widely known as JavaScript.


    # JavaScript Versions


    Up until 2015, version 5 of ECMAScript was used and became supported by all of
    the web'
  merge: -1
  pgno: 24
- img_proc: false
  md: 'browsers. This version is one of the most popular versions of all time, not
    because of its advanced features but if you know ES5, you would easily understand
    all future ES versions. In 2015 the new version ES6 or ECMAScript 2015 was released.
    In this version lot of things were included. Please remember one thing. Each version
    is bringing new features that are making our lives as developers much easier.
    So, what is special about ES6 or ES - 2015?

    In ES6, the following major features were added to JavaScript:


    +   - Classes

    - Modules


    This was something that JavaScript was missing. JavaScript now is not a scripting
    language only but by a more serious programming language suitable for large-scale
    projects.

    After the ES6, ECMAScript specification started a yearly version release to help
    the developers cope with a few changes because the changes from ES5 to ES6 were'
  merge: -1
  pgno: 25
- img_proc: false
  md: 'monumental.

    Each new version now has a few new features added, and not all of these new features
    will be supported by the browsers. I can strongly recommend using the website
    caniuse.com to check if the browsers support the features you are using.


    This book will use the newer syntax from ES6 onwards because there is no point
    in going back to the past.


    # HTML, CSS & JavaScript:

    How they work together?


    I hope you have a basic understanding of HTML and CSS, but if you do not, I will
    try to explain them as best as possible. HTML (HyperText Markup Language) stands
    for the basic structure of a webpage or as I would like to say. This structure
    can be modified and styled by other technologies like CSS (Cascading Style Sheet)
    and JavaScript.

    We use CSS for formatting, presentation,'
  merge: -1
  pgno: 26
- img_proc: false
  md: 'styling, and layout. JavaScript is used to control the behaviour of those different
    page elements.


    Every webpage that we know is made up of many different HTML elements called tags.
    These tags have different names such as header tag, image tag, anchor or link
    tags, etc. So, the HTML tags allow us to create website structures that will contain
    different headings, paragraphs, tables, links, images, lists, and much more. For
    styling all of these elements, we are using CSS. Therefore, CSS will give us the
    entire website style, and HTML will create the basic structure of your website.
    JavaScript, on the other hand, is more complex than the two mentioned above. With
    JavaScript, we can make our website to be more dynamic and interactive. There
    are many examples of how we can make our website dynamic. For example, you probably
    noticed some of those pop-up boxes when you click on a website button, and they
    are asking you to press “cancel” or “ok” to proceed? This is the simplest example
    of how we can use JavaScript, and there are many more advanced that can make our
    websites'
  merge: -1
  pgno: 27
- img_proc: false
  md: 'more dynamic. In the past, I mean before JavaScript, some of those actions
    were hard to implement. For example, clicking on a button will require the browser
    to send a request to the server. The server will respond by sending back to the
    client a new version. This will continue to refresh the entire page as the user
    continues clicking and waiting for changes. But this is not efficient, and therefore,
    more time for the entire process to finish. But what if the browser could request
    a portion of the web page to be updated instead of the entire page. This will
    be much more efficient, right? And someone will also ask what will happen if the
    information we require does not need to come from the server-side? In this case,
    we need a program to run on the client''s computer. This was why Netscape worked
    on a new programming language that could work on the client machine.

    That is why the original host environment for JavaScript was the web browser,
    and it is still today. Please do not get me wrong, but it is in a more advanced
    stage. JavaScript code can react to inputs from the user. The browser'
  merge: -1
  pgno: 28
- img_proc: false
  md: 'allows JavaScript to capture user inputs, such as a mouse click on a button
    or keypress event when a user types something on the search bar.

    Today Node also provides JavaScript programs to send and receive data and read
    and write (manipulate) files over the network.

    I believe this was an important and sufficient intro, so now we can focus on JavaScript
    core functions.'
  merge: -1
  pgno: 29
