  md: 'understand the HTML5 elements/tags like <h1> or <button> but it will understand
    if they are objects. Because of the DOM, JavaScript can access those objects like
    h1, p elements with the help of methods. DOM is not a programming language, but
    it is a Web API used to build websites. DOM is not a language because it was never
    designed to be one because the existing languages needed structural representation
    of the document, DOM made that possible. In the picture below, you will see how
    the DOM and its hierarchical structure:


    ![](bbox=[0.207, 0.517, 0.792, 0.683])


    In the DOM, every element is connected. For example, the lower elements are children
    to the upper elements, which are called parents. The <html> element is the root
    element that defines the whole document. If you are familiar with HTML, you know
    that each'
  merge: -1
  pgno: 353
- img_proc: false
  md: 'element has a start tag like this: `<html>` and corresponding end tag `</html>`.
    Inside the `<html>` element, we have `<body>` element where we define the rest
    of the tags. Most of the elements have corresponding end tags, and the only difference
    between the two tags is that the end tag has ‘/’-- forward slash. Another important
    point that you should know is that all of these HTML elements are nodes of the
    DOM tree.


    There are three distinctive node types in the DOM:


    +   - **Element** – element nodes are also known as objects of the DOM. These
    nodes can contain text and attribute data. Example: p, h1 and element nodes

    - **Attribute** – attribute nodes are located inside the element node and add
    extra information. Example: inside the p element, we can have a class <p class=''bigText’>

    - **Text** – text nodes are the content inside the element node'
  merge: -1
  pgno: 354
- img_proc: false
  md: 'Here is one full example of element, attribute and text node:


    ```

    <p id="todayDate"> Keep Learning!</p>

    ```


    Here the <p> is the element node, the id is the attribute, and the text node is
    the content of that element, which is ‘Keep Learning!’ You can read more about
    DOM if you visit this link:


    https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model


    # Why JavaScript needs DOM?


    JavaScript programs need DOM to perform some or all of these actions:


    +   - Add new nodes in the DOM

    - Add new element in the DOM

    - Add or modify style (CSS)

    - Add new attributes or remove modify older attributes of the DOM elements

    - Create and add events to the DOM element'
  merge: -1
