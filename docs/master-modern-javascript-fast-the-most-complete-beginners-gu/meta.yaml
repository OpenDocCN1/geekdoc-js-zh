  md: '# # Chapter 13 – JavaScript Events


    I have already mentioned, all of the web pages were static, and the content was
    hardcoded. **HTML** provided the skeleton, and **CSS** was used to style those
    pages. Please do not get me wrong. These were still beautiful pages full of information,
    but again static and boring. If the user were reading from those pages and clicking
    on a button or link, he would have been redirected to a new page or somewhere
    else on the internet. This was a problem for developers, and they were trying
    to solve it. If we look at today''s web pages, we can see that they are interactive
    and dynamic, meaning if we click on a button, something will happen, which is
    known as a JavaScript event.

    Every user action is now considered an event. For example, when we start typing
    on the search bar on some web page, this is'
  merge: -1
  pgno: 373
- img_proc: false
  md: considered an event, or when we want to register a new user, we need to fill
    out all of our personal data and then finally submit the form. Well, this is another
    example of a JavaScript event. In short, HTML events are the things that happen
    to the HTML elements like buttons. HTML event can be even something that the browser
    does, for example, when it finishes loading a page. In short, when an event happens,
    we want to do something with that event, and for that, we have event listeners
    that can react to these events.
  merge: -1
  pgno: 374
- img_proc: false
  md: '# Common HTML Events


    Before we can handle HTML events, they need to be triggered by HTML code/tags
    in a web page. How do we know when an event is triggered? The HTML elements can
    have attributes specified inside the HTML tags.

    One example is the onload event. Onload is an attribute that, in our case, we
    have inside the <body> tag that specifies an action the page is finished loading.

    Here is very basic example where I have included the HTML markup together with
    the inline JavaScript code:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"

    content="IE=edge">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Document</title>

    </head>

    <body onload="triggerThis()">

    <h1>JavaScript Events</h1>

    ```'
