  md: '# MAPS AND SETS


    Up to now, we have learned about objects and arrays as complex data structures,
    but JavaScript API also provides Maps and Sets. This is not Google MAPS, please
    do not get confused, but these are two additional collection data types. The JavaScript
    Map class implements classic map data structures that are a collection of keyed
    data items ‘key/value pairs’ similar to the Objects. The only main difference
    is that Map allows the keys to be from any data type. If you can remember, the
    Object keys can be either strings or symbols, and in Maps, they can be from any
    type, which is a big advantage. Another advantage that Map has is that they do
    not have a prototype chain like the Objects do. When we insert new elements, the
    Map instance will know the order in which they are inserted.


