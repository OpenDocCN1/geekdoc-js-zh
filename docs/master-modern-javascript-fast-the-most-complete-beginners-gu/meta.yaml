  md: 'As you can see in the **getElementById()** method, we are passing one parameter:
    the HTML element id attribute. This is not optional. We have to provide the correct
    ID attribute of the element. Remember, the element ID should be unique within
    the HTML document. Still, if some reason, we have another element with the same
    id, then the **getElementById()** method will return the first element that will
    find in the HTML DOM.


    The third method that we can use to locate HTML elements is **getElementsByTagName().**
    This method will get all elements that have the given name attribute. The **getElementsByTagName()**
    will return a collection of all elements in the document. Please take a look at
    the following example: HTML5 markup:


    ```

    <form action="#">

    First Name: <input name="fname" type="text" value="Tom">

    Last Name: <input name="fname" type="text" value="Jones">

    </form>

