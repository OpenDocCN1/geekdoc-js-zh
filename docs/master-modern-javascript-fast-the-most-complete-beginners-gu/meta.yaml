    ```


    When we have a destructuring assignment, the values on the right are fetched/destructured
    and stored into the variables on the left. To summarise, the left-hand side is
    the variable names that should be matched with the right-hand side values. What
    will happen if we have more values on the right side and fewer variable names
    on the left side? Then the unmatched elements will be ignored.


    Check out the following code:


    ```

    //unmatched items are ignored

    let [one,two,three] = [1,2,3,4];

    ```'
