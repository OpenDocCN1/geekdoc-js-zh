  md: '+   - Delete elements from the DOM tree


    # # Methods of document object


    If we want to do some of the actions listed above, we can use some of the methods
    to access/change the document''s content.

    Some of the most important methods of documentment object are:


    +   1. document.write()

    2. getElementById()

    3. getElementsByByName() - deprecated

    4. getElementsByTagName()

    5. getElementsByByClassName()


    Let start by explaining each method using some real-life examples. The first method
    is called document.write(), which is used when we need to write text directly
    to the HTML document. Be careful if we use this method after the HTML document
    is fully loaded, it will delete the existing HTML and replace it with the text.
    This method is mostly used for testing.'
  merge: -1
  pgno: 356
- img_proc: false
  md: '# Example:


    ```

    document.write(''Hello'');

    ```


    This will write ‘Hello’ to your existing document.

    The second method is very common, and we can use it when we want to get an element
    from the DOM with a specific ID. The getElementById() method will return that
    element from the DOM if the element with that ID exists, and if not, it will return
    null. In this example, I need to use HTML markup with a specific element ID and
    then the JavaScript code to select that element:


    +   1) HTML markup -

    <p id=''first''>This paragraph is for getElementById().</p>


    +   2) The getElementById() –

    firstParagraph = document.getElementById(''first'');

    console.log(firstParagraph);


    +   3) Output:


    ```

    <p id=''first''>This paragraph is for getElementById().</p>

    ```'
