  md: '| || | Or | Sixth | Right to Left |

    | ?: | ternary | Seventh | Right to Left |

    | = | Assignment | Eight | Right to Left |

    | +=, -= | Arithmetic Assignment | Eight | Right to Left |


    This is, in short, the table of precedence that JavaScript uses during the evaluation
    of the expression. From the table, you can see that division, multiplication,
    and modulus have the same precedence, and it does not matter in which order JavaScript
    evaluates them. The same goes for addition and subtraction. Let us do the following
    example so you can understand how this table is working:

    5+2*3


    If you ignore the table and start to evaluate the expression from left to right,
    we will calculate the 5+2, which will give the result 7, and then this needs to
    be multiplied by 3. The result will then be 21. This result,'
  merge: -1
  pgno: 145
- img_proc: false
  md: 'however, is not correct. The correct approach is to check what has a higher
    precedence multiplication or addition. From the table above, the multiplication
    order is second and higher than the addition order, which comes as third. Therefore
    we start first to evaluate 2*3, which equals 6, and after that, we add the number
    5. Here is the correct way of evaluating this expression:

    5 +2*3 = 5 + 6 = 11.


    But for some reason, we can make the same expression above to be evaluated to
    21 if we want this Result. How can we achieve this in JavaScript? This is called
    changing the order of operator precedence, and we can do this if we use parenthesis
    in the expression. Please take a look at the same example but with parenthesis,
    and this will give us a different result:


    (5 + 2) * 3 = 7 * 3 = 21


    Cool right? So, whatever is in the parenthesis in our case addition of two numbers
    will be done first, and then the multiplication will be performed. As you can
    see from the example, the parenthesis has higher precedence than the rest of the
    operators in the table.'
