  md: '# Operator Precedence


    So far, we have used expressions with one or two operands and a single operator.
    But in reality, we can have operands and operators, and here, we should be careful
    because if we want to predict the correct result, we must know in which order
    the calculations will be performed.


    Operator precedence will sort this problem, meaning JavaScript will evaluate the
    expression to an already defined order of precedence.


    # Operator Precedence Table


    | Operator | Operation | Order | Order of Evaluation |

    |---|---|---|--|

    | ++ | Increment | First | Right to Left |

    | -- | Decrement | First | Right to Left |

    | - | Negation | First | Right to Left |'
  merge: -1
  pgno: 143
- img_proc: false
  md: '| ! | Not | First | Right to Left |

    | *, / , % | Multiplication, Division, Modulus | Second | Left to Right |

    | +, - | Addition, Subtraction | Third | Left to Right |

    | + | Concatenation | Third | Left to Right |

    | <, <= | Less than, less than, or equal | Fourth | Left to Right |

    | >, >= | Greater, greater than, or equal | Fourth | Left to Right |

    | == | equal | Fifth | Left to Right |

    | != | Not equal | Fifth | Left to Right |

    | === | identity | Fifth | Left to Right |

    | !=== | Non-identity | Fifth | Left to Right |

    | && | AND | Sixth | Left to |'
