  md: '**Assembly “low-level”**


    **languages**


    Writing a computer program using 1’s and


    0’s is very hard, challenging, and becomes


    mission impossible if you want to write


    bigger and more complex programs. The next


    big thing in the programming world was the


    introduction of **assembly**  **languages**. These


    languages were using notations for each


    instruction, but they were still “**low-level**”


    language.


    **“High-level” languages**


    The need for more powerful and capable


    languages was there; therefore, more complex


    and high-level programming languages were


    developed. One of those languages was


    **FORTRAN**. At that time, **FORTRAN** was


    developed by **IBM** and was very popular


    among programmers. But still was not an


    easy language to learn for the developers.


    These languages were more capable than


    their predecessors, where programmers'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'needed to write each instruction directly into


    the machine. In the coming years and


    decades, many languages were developed,


    but one was a particular success. The name of


    this language is **C.** The programs written in **C**


    language are easier to understand than


    **FORTRAN** and can be executed in **Unix** and


    **Linux** operating systems.


    Unfortunately, all of these languages


    developed in the past, and even the ones


    developed today cannot understand and use


    natural language such as English.


    **How does a computer**


    **understand the code?**


    When we write a piece of code, the computer


    or the machine does not understand what this


    means. So, how does the computer


    understand the code we have written? There


    is a special program called **translator,** and


    this program will read the code and convert it


    to a set of instructions that the computer can


    understand. Because of this, we can translate


    the computer program and execute the same'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'program on a different machine, isn’t this


    great? It is very powerful to run the same


    program on multiple computers with little or


    no changes at all. With the assembly


    languages, this was not possible. So, these


    **translator programs** are called **compilers**.


    The compiler''s job is simply to get the


    original code or program known as **source**,


    then to translate it into an **executable**


    **program**. The executable program, when


    needed it can be run or executed. Today the


    programming languages are using


    **interpreters** instead of a compiler. The idea


    behind this approach is that the **interpreter**


    reads small parts of the program and is


    instantly executed, so there is no


    waiting/wasting time. The languages that can


    do this are called scripting languages, just


    like the one we will cover in this book.


