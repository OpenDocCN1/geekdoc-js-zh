    **Case Sensitivity**


    What you need to know is that JavaScript


    identifiers are case-sensitive. This means that


    if we name a variable only with a single letter


    like ‘**x’**, we can use that one in the program


    as ‘x.’ The variables like ‘**x**’ and capital letter


    ‘X’ are two different variable names. Why?


    Because JavaScript is a case-sensitive


    language, all keywords or variables must be


    typed with consistent capitalization.'
