  md: 'more dynamic. In the past, I mean before


    JavaScript, some of those actions were hard


    to implement. For example, clicking on a


    button will require the browser to send a


    request to the server. The server will respond


    by sending back to the client a new version.


    This will continue to refresh the entire page


    as the user continues clicking and waiting for


    changes. But this is not efficient, and it


    requires more bandwidth and, therefore, more


    time for the entire process to finish. But what


    if the browser could request a portion of the


    web page to be updated instead of the entire


    page. This will be much more efficient, right?


    And someone will also ask what will happen


