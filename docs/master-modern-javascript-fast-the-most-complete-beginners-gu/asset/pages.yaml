    required in most programming languages, but


    the semicolon at the end of the statement is


    not required in JavaScript. So, what is a


    JavaScript **statement**? The statements tell the


    computer program to do something. The first


    one is when I assign a value to a variable


    called **firstName**. The second is another


    assignment statement. The last one is an


    output statement that will output what the


    first and last variables contain. You can find


    the same code in lecture **statements.js**.


