    **Comments**


    In JavaScript, there are two types of


    comments. One type is the single-line


    comment, and we write the comment using //.


    The text that follows after the // is treated as a


    comment and is ignored by the JavaScript


    compiler. Another type of comment is the


    multi-line comment. Open the file called


    comments.js, and you will see the following


    code there:


    *//Comments in JavaScript*'
