  md: '**AJAX - Asynchronous**


    **JavaScript and XML**


    The following section will be very interesting


    because it adds important functionality to


    JavaScript. AJAX is a dream of every web


    developer because we can do so many things


    with AJAX today. One good example is when


    we need to update a portion of a web page


    without a complete page refresh. AJAX is a


    method that allows us to create interactive


    applications for the web that will process the


    user requests immediately in the background.


    To achieve this functionality, AJAX needs to


    combine several programming tools,


    including JavaScript, HTML, CSS, and


    XML. This means that with the AJAX, the


    application can continue working normally


    without being blocked while the server is


    processing the requests. The X in AJAX


    stands for XML but what is important to


    understand is that the processed data will


    likely be in JSON format. Before AJAX,


    everything was harder. For example, when


    we fill a form on a web page and hit the'
  merge: -1
  pgno: 418
- img_proc: true
  md: 'submit button, we get directed to a new page


    with confirmation from the server. Now with


    AJAX, we can fill out the entire form, hit the


    submit button, but we will not be directed to a


    new page; instead, we would get a server


    response on the same page. For example, you


    must include your email address. AJAX is


    working like this. The JavaScript code sends


    the request to the server. The server then will


    process that request and send it back to the


    user. The same user can still use the


    application while the entire process is


    working asynchronously in the background.


    Here is one great example where the text is


    changed upon clicking the button. If you want


    to try the same example you can find the two


    files in the folder **chapter14 (lecture2.html**


    and **info.txt):**


    <!DOCTYPE  *html*>


    <html  *lang*="en">


    <head>


    <meta  *charset*="UTF-8">


    <meta  *http-equiv*="X-UA-Compatible"  *content*="IE=edge">


    <meta  *name*="viewport"  *content*="width=device-width, initial-


    scale=1.0">


    <title>AJAX</title>'
  merge: -1
  pgno: 419
- img_proc: true
  md: '</head>


    <body>


    <h1>AJAX simple example! </h1>


    <p  *id*="text">Let us change the text of this paragraph by clicking the


    button bellow!</p>


    <button  *id*="changeText">Change Text! </button>


    <script>


    const  output  =  document.**querySelector**(''#text'');


    const  btn  =  document.**querySelector**(''#changeText'');


    btn.**addEventListener**(''click'',()=>{


    **loadData**();


    });


    const  **loadData**  =  ()  =>{


    const  req  =  new  **XMLHttpRequest**();


    req.**open**(''GET'',''info.txt'',true);


    req.**send**();


    req.**onreadystatechange**  =  function()  {


    if (this.readyState  ==  4  &&  this.status  ==  200) {


    output.innerHTML  =  this.responseText;


    }


    };


    }


    </script>


    </body>


    </html>'
  merge: -1
  pgno: 420
- img_proc: true
  md: '**Making a Request**


    As you can see from this AJAX example, the


    key here is to create **XMLHttpRequest**


    object. This object is very important because


    we can create a server request at the lowest


    level, including all necessary header


    elements.


    Therefore, in the **loadData** function we


    create an instance of **XMLHttpRequest**


    object:


    const  req  =  new  **XMLHttpRequest**();


    If we want to send a request to a server, we


    use open and send methods of the


    **XMLHttpRequest** object like the following


    example:


    req.**open**(''GET'',''info.txt'',true);


    req.**send**();


    Open method syntax:


    *open(method, url, async)*


    The open method has specific syntax where


    we need to specify the type of the request we


    are making, like the ‘**GET’** request. This'
  merge: -1
  pgno: 421
- img_proc: true
  md: 'method can be either **GET** or **POST,**


    depending on what we want to achieve. For


    our example, we need to use **GET** requestto


    access the content of the **info.txt** file. The


    second parameter inside the **open()** method is


    **‘url’** or the file location. In our case, this will


    be the local file we have called ‘**info.txt’**. The


    last parameter is true and stands for


    **asynchronous** true. The send() method sends


    the request to the server, and if we use


    ‘GET’, we can simply use an empty send()


    method. If we use a POST request, we need


    to use the **send(string)** method.


    Next, we need to define the


    **onreadystatechange** property as a function.


    We need this so we can handle the response.


    The if condition will check if the state of the


    request is successful or not. Inside the **req**


    constant, we have the state property called


    **readyState.** The ready state means that the


    AJAX call has been successfully completed.


    The number 4 means that the request was


    sent, and the server returned the response. It


    also means that the browser finished


    downloading the response content. I also


    check the HTTP response status code. If the'
  merge: -1
  pgno: 422
- img_proc: true
  md: 'HTTP status code is 200 OK, then it means


    that the request has been successful. Finally,


    we tell the server what we would want to do


    with the response, and in this case, we want


    to use the **innerHTML** method to replace the


    paragraph content with the new content that


    we fetched from the ‘info.txt’ file.


    In the ‘info.txt’ file, we have a single line of


    text:


    **‘This text is coming from a txt file called**


    **info.txt!’**


    Let us now open the lecture2.html in our


    browser and test what will happen after


    clicking on the button.


    This is a screenshot before clicking on the


    ‘Change Text‘ button:


    ![](img/deda9e47d1c39aec7c7d59ef1e6d2ccc_423_0.png)


    Now let us test what will happen after we


    click on the button:'
  merge: -1
  pgno: 423
