    **JSON** discussion. The **XML** and **HTML** are


    very similar with one difference; the **XML**


    has stricter syntax than **HTML**. **XML** was


    very popular in the late 90s, and it was the


    predominant technology for transmitting data


    over the internet. Now, you should


    understand why I mentioned **XML** in the


    **JSON** section because both are used to send


    data over the wire. Nowadays, **JSON** is more


    common because of its syntax, which is very'
  merge: -1
  pgno: 415
- img_proc: true
  md: 'close to the **JavaScript** object notation. The


    **XML,** on the other hand, is similar to


    **HTML**. **XML** had many issues because of its


    verbose syntax. The **XML** was used mostly


    in the places where data needed to be


    structured as the **RSS** feeds. On the other


    hand, **JSON** is simpler, and the way **JSON** is


    formatted makes it more human-readable. We


    should not forget that **JSON** is a language


    independent of JavaScript Object notation.


    So, where is **XML** used today? Well, **XML** is


    not dead, and it is used in UI development


    phases such as **JavaFX**, **Android**, **Word**,


    **Excel,** and **Xmarin**. Because **XML** is a


    markup language, it is the perfect candidate


    for displaying and styling data. Because it is a


    markup language, it uses tags structure to


    represent data, which is again similar to


    **HTML**.


    Here is the same example first in JSON and


    then I have translated it to XML:


    {"Actors":[


    {  "firstName":"Tom",  "lastName":"Cruise"  },


    {  "firstName":"Harold",  "lastName":"Kumar"  },


    {  "firstName":"John",  "lastName":"Carpenter"  },'
  merge: -1
