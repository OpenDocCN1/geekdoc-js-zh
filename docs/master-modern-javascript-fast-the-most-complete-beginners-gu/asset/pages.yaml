  md: '**Chapter 1 -**


    **Introduction to**


    **JavaScript and**


    **Programming**


    If you have ever written a simple computer


    program, this chapter will be very easy.


    What is a computer program? A computer


    program is a set of instructions that tells what


    the computer should do. But how the


    computer understands our instructions? The


    computer only understands one language, and


    this one is very simple and represented by


    zeros and ones, and it looks something like


    this example:


    **0010 1000 0101 1100 1001 1110 0100 0110**


    But you don’t have to be worried; we will not


    need this for our course. Please remember


    this is just an introduction to **JavaScript** and


    programming in general.'
