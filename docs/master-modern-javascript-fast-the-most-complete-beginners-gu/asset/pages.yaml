    known as **Mocha** in 10 days. This language


    then changed its name to **LiveScript** and


    finally to the very popular name that we all


    know today, **JavaScript**.


    JavaScript became very popular, and its rapid


    growth meant only one thing. This language


    must be maintained, managed, and


    standardized. Therefore, in 1997 Netscape


    submitted the language to **ECMA** (**European**


    **Computer Manufacturers Association**) for


    standardization. ECMA released a


    standardized version called “**ECMAScript,**”


    but it was widely known as JavaScript.


