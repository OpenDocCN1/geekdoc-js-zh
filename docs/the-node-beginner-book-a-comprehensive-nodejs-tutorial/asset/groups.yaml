    \ modules we used earlier:\n\n```\nvar formidable = require(\"formidable\");\n\
    ```\n\nThe metaphor formidable uses is that of a form being submitted via HTTP\
    \ POST, making it parseable in Node.js. All we need to do is create a new IncomingForm,\
    \ which is an abstraction of this submitted form, and which can then be used to\
    \ parse the request object of our HTTP server for the fields and files that were\
    \ submitted through this form.\n\nThe example code from the node-formidable project\
    \ page shows how the different parts play together:\n\n```javascript\nvar formidable\
    \ = require('formidable'),\nhttp = require('http'),\nsys = require('sys');\n```\n\
    \n```javascript\nhttp.createServer(function(req, res) {\n  if (req.url == '/upload'\
    \ && req.method.toLowerCase() == 'post') {\n    // parse a file upload\n    var\
    \ form = new formidable.IncomingForm();\n    form.parse(req, function(error, fields,\
    \ files) {\n      res.writeHead(200, {'content-type': 'text/plain'});\n      res.write('received\
