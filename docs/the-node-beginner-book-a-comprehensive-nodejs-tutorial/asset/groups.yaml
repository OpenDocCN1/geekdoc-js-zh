    JavaScript and Node.js 4


    You decided that it''s about time to check out the old, new JavaScript. But wait,
    writing Node.js applications is the one thing; understanding why they need to
    be written the way they are written means - understanding JavaScript. And this
    time for real.


    Here is the problem: Because JavaScript really lives two, maybe even three lives
    (the funny little DHMT helper from the mid-90''s, the more serious frontend stuff
    like jQuery and the likes, and now server-side), it''s not that easy to find information
    that helps you to learn JavaScript the "right" way, in order to write Node.js
    applications in a fashion that makes you feel you are not just using JavaScript,
    you are actually developing it.


    Because that''s the catch: you are already an experienced developer, you don''t
    want to learn a new technique by just hacking around and mis-using it; you want
    to be sure that you are approaching it from the right angle.


    There is, of course, excellent documentation out there. But documentation alone
    sometimes isn''t enough. What is needed is guidance.


    My goal is to provide a guide for you.


    # A word of warning


    There are some really excellent JavaScript people out there. I''m not one of them.


    I''m really just the guy I talked about in the previous paragraph. I know a thing
    or two about developing backend web applications, but I''m still new to "real"
    JavaScript and still new to Node.js. I'
