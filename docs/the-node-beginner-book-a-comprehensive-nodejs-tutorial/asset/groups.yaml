- md: "\n## How our server handles requests\n\nOk, let’s quickly analyze the rest\
    \ of our server code, that is, the body of our callback function `onRequest()`.\n\
    \nWhen the callback fires and our `onRequest()` function gets triggered, two parameters\
    \ are passed into it: `request` and `response`.\n\nThose are objects, and you\
    \ can use their methods to handle the details of the HTTP request that occured\
    \ and to respond to the request (i.e., to actually send something over the wire\
    \ back to the browser that requested your server).\n\nAnd code does just that:\
    \ Whenever a request is received, it uses `response.writeHead()` function to send\
    \ an HTTP status 200 and content-type in the HTTP response header, and the `response.write()`\
    \ function to send the text “Hello World” in the HTTP response body.\n\nAt last,\
    \ we call `response.end()` to actually finish our response.\n\nAt this point,\
    \ we don’t care for the details of the request, which is why we don’t use the\
    \ `request` object at all.\n\n## Finding a place for our server module\n\nOk,\
    \ I promised we will get back to how to organize our application. We have the\
    \ code for a very basic HTTP server in the file `server.js`, and I mentioned that\
    \ it’s common to have a main file called `index.js` which is used to bootstrap\
    \ and start our application by making use of the other modules of the application\
    \ (like the HTTP server module that lives in `server.js`).\n\n## Building the\
    \ application stack\n\nLet's talk about how to make server.js a real Node.js module\
    \ that can be used by our yet-to-be-written index.js main file.\n\nAs you may\
    \ have noticed, we already used modules in our code, like this:\n\n```\nvar http\
    \ = require(\"http\");\n...\nhttp.createServer(...);\n```\n\nSomewhere within\
    \ Node.js lives a module called \"http\", and we can make use of it in our own\
    \ code by requiring it and assigning the result of the require to a local variable.\n\
    \nThis makes our local variable an object that carries all the public methods\
    \ the http module provides.\n\nIt's common practice to choose the name of the\
    \ module for the name of the local variable, but we are free to choose whatever\
    \ we like:\n\n```\nvar foo = require(\"http\");\n...\nfoo.createServer(...);\n\
    ```\n\nFine, it's clear how to make use of internal Node.js modules. How do we\
    \ create our own modules, and how do we use them?\n\nLet's find out by turning\
    \ our server.js script into a real module.\n\nTurns out, we don't have to change\
    \ that much. Making some code a module means we need to export those parts of\
    \ its functionality that we want to provide to scripts that require our module.\n\
    \nFor now, the functionality our HTTP server needs to export is simple: scripts\
    \ requiring our module simply need to start the server.\n\nTo make this possible,\
    \ we will put our server code into a function named start, and we will export\
    \ this function:\n\n```\nvar http = require(\"http\");\nfunction start() {\n \
    \ function onRequest(request, response) {\n    console.log(\"Request received.\"\
    );\n    response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n    response.write(\"\
    Hello World\");\n    response.end();\n  }\n\n  http.createServer(onRequest).listen(8888);\n\
    \  console.log(\"Server has started.\");\n}\nexports.start = start;\n```\n\nThis\
    \ way, we can now create our main file index.js, and start our HTTP there, although\
    \ the code for the server is still in server.js.\n\n## Building the application\
    \ stack\n\nCreate a file index.js with the following content:\n\n```\nvar server\
    \ = require(\"./server\");\n\nserver.start();\n```\n\nAs you can see, we can use\
    \ our server module like any internal module: by requiring its file and assigning\
    \ it to a variable, its exported functions become available to us.\n\nThat's it.\
    \ We can now start our app via our main script, and it still does the same:\n\n\
    Great, we can now put the different parts of our application into different files\
    \ and wire them together by making them modules. We still have only the first\
    \ part of our application in place: we can receive HTTP requests. But we need\
    \ to do something with them depending on which URL the browser requested from\
    \ our server, we need to react differently. For a very simple application, you\
    \ could do this directly within the callback onRequest(). But as I said, let's\
    \ add a bit more abstraction in order to make our example a bit more interesting.\n\
    \nMaking different HTTP requests point at different parts of our code is called\
    \ \"routing\" - well, then let's create a module called router.\n\n## What’s needed\
    \ to “route” requests?\n\nWe need to be able to feed the requested URL and possible\
    \ GET and POST parameters into our router, based on these the router needs to\
    \ be able to decide which code to execute (this “code to execute” is the part\
    \ of our application: a collection of request handlers that do the actual work\
    \ when a request is received). It could be argued if that should be part of the\
    \ router or part of the server (or even a module of its own), but let’s agree\
    \ on making it part of our HTTP server for now.\n\nAll the information we need\
    \ is available through the request object which is passed as the parameter to\
    \ our callback function onRequest(). To interpret this information, we need some\
    \ additional Node.js modules, namely url and querystring. The url module provides\
    \ methods which allow us to extract different parts of a URL (like e.g. the requested\
    \ path and query string), and querystring can in turn be used to parse the query\
    \ string for request parameters:\n\n```\nurl.parse(url).query\nurl.parse(url).pathname\n\
    // http://localhost:8888/start?foo=bar&hello=world\nquerystring.parse(url)[\"\
    foo\"]\nquerystring.parse(url)[\"hello\"]\n```\n\nWe can, of course, also use\
    \ querystring to parse the body of a POST request, as we will see later. Let’s\
    \ add now to our onRequest() function the logic to find out which URL path the\
    \ browser requested:\n\n```\nvar http = require(\"http\");\nvar url = require(\"\
    url\");\n\nfunction start() {\n  function onRequest(request, response) {\n   \
    \ var pathname = url.parse(request.url).pathname;\n    console.log(\"Request for\
    \ \" + pathname + \" received.\");\n    response.writeHead(200, {\"Content-Type\"\
    : \"text/plain\"});\n    response.write(\"Hello World\");\n    response.end();\n\
    \  }\n\n  http.createServer(onRequest).listen(8888);\n  console.log(\"Server has\
    \ started.\");\n}\nexports.start = start;\n```\n\nFine. Our application can now\
    \ distinguish requests based on the URL path requested - this allows us to map\
    \ requests to our request handlers based on the URL path using our (yet to be)\
    \ router. In the context of our application, it simply means that we will be able\
    \ to have requests for the /start and /upload URLs handled by different parts\
    \ of our code. We will see how everything fits together soon.\n\nOk, it's time\
    \ to write our router. Create a new file called router.js, with the following\
    \ content:\n\n```\nfunction route(pathname) {\n  console.log(\"About to route\
    \ a request for \" + pathname);\n}\n\nexports.route = route;\n```\n\nOf course,\
    \ this code basically does nothing, but that's ok for now. Let's first see how\
    \ to wire together this router with our server before putting more logic into\
    \ the router. Our HTTP server needs to know about and make use of our router.\
    \ We could hard-wire this dependency into the server, but because we learned the\
    \ hard way from our experience with other programming languages, we are going\
    \ to loosely couple server and router by injecting this dependency (you may want\
    \ to read Martin Fowler's excellent post on Dependency Injection for background\
    \ information). Let's first extend our server's start() function in order to enable\
    \ us to pass the route function to be used by parameter:\n\n```\nvar http = require(\"\
    http\");\nvar url = require(\"url\");\n\nfunction start(route) {\n  function onRequest(request,\
    \ response) {\n    var pathname = url.parse(request.url).pathname;\n    console.log(\"\
    Request for \" + pathname + \" received.\");\n\n    route(pathname);\n\n    response.writeHead(200,\
    \ {\"Content-Type\": \"text/plain\"});\n    response.write(\"Hello World\");\n\
    \    response.end();\n  }\n\n  http.createServer(onRequest).listen(8888);\n  console.log(\"\
    Server has started.\");\n}\n```\n"
  mdcn: "\n## 我们的服务器如何处理请求\n\n好的，让我们快速分析服务器的剩余部分，即回调函数 `onRequest()`。\n\n当回调函数触发且\
    \ `onRequest()` 函数被触发时，传入了两个参数：`request` 和 `response`。\n\n这些都是对象，你可以使用它们的方法来处理发生的\
    \ HTTP 请求，并向请求的浏览器返回一些内容。\n\n代码恰好这样做：每当接收到请求时，它使用 `response.writeHead()` 函数发送\
    \ HTTP 200 状态码和 content-type 头部，并使用 `response.write()` 函数在 HTTP 响应中发送“Hello World”。\n\
    \n最后，我们调用 `response.end()` 来完成我们的响应。\n\n在这一点上，我们并不关心请求的细节，因为我们没有使用 `request` 对象。\n\
    \n## 为我们的服务器寻找一个位置\n\n好的，我们承诺会回到如何组织我们的应用程序。我们已经在 `server.js` 中准备了基础的 HTTP 服务器代码，并且提到通常有一个名为\
    \ `index.js` 的主文件，用于通过引入模块来启动应用程序（例如位于 `server.js` 的模块）。\n\n## 构建应用程序栈\n\n让我们谈谈如何让\
    \ `server.js` 成为一个真正的 Node.js 模块，这是尚未编写的文件。\n\n正如你可能已经注意到的，我们在代码中已经使用了模块：\n\n\
    ```\nvar http = require(\"http\");\n...\nhttp.createServer(...);\n```\n\n在 Node.js\
    \ 某个地方有一个名为 \"http\" 的模块，我们可以通过引入并将结果赋值给本地变量来使用它。\n\n通常的做法是为本地变量命名，但我们可以自由选择任何名称：\n\
    \n```\nvar foo = require(\"http\");\n...\nfoo.createServer(...);\n```\n\n很好，很清楚如何使用内部\
    \ Node.js 模块。我们如何创建自己的模块，以及如何使用它们？\n\n通过将我们的 `server.js` 脚本转换为模块来发现。\n\n事实证明，我们不需要做太大改动。某些代码意味着我们需要导出\
    \ HTTP 服务器需要提供的那些功能。\n\n为了实现这一点，我们将服务器代码放入一个名为 `start` 的函数中，并导出这个函数：\n\n```javascript\n\
    var http = require(\"http\");\nfunction start() {\n  function onRequest(request,\
    \ response) {\n    console.log(\"Request received.\");\n    response.writeHead(200,\
    \ {\"Content-Type\": \"text/plain\"});\n    response.write(\"Hello World\");\n\
    \    response.end();\n  }\n\n  http.createServer(onRequest).listen(8888);\n  console.log(\"\
    Server has started.\");\n}\nexports.start = start;\n```\n\n通过这种方式，我们现在可以创建主文件\
    \ `index.js`，虽然服务器代码仍在 `server.js` 中。\n\n## 构建应用程序栈\n\n创建一个如下内容的 `index.js` 文件：\n\
    \n```\nvar server = require(\"./server\");\n\nserver.start();\n```\n\n你可以看到，我们可以像使用任何内部模块一样使用服务器模块：通过引入文件并将其赋值给变量。\n\
    \n这就足够了。我们现在可以通过主脚本启动应用。太棒了，我们现在可以将应用程序的不同部分放入不同的文件中，并将它们连接在一起。但我们需要根据浏览器请求的 URL\
    \ 对它们做出不同的反应。对于非常简单的应用程序，你可以直接在 `onRequest()` 回调中这样做。但正如我所说，让我们增加一点抽象，让我们的示例更有趣。\n\
    \n将不同的 HTTP 请求导向代码的不同部分被称为“路由”（routing）——那么，让我们创建一个名为 `router` 的模块。\n\n## “路由”请求需要什么？\n\
    \n我们需要能够将请求的 URL 以及可能的 GET 和 POST 参数馈给我们的路由器，这些路由器需要能够决定执行哪些代码（这段“要执行的代码”是应用程序的一部分：一组在接收到请求时执行实际工作的处理器）。可以争论这应该是路由器的一部分还是服务器的一部分（甚至是自己的模块），但让我们现在同意将其作为\
    \ HTTP 服务器的一部分。\n\n我们需要的所有信息都可以通过作为 `onRequest()` 回调参数的 `request` 对象获取。为了解释这些信息，我们需要额外的\
    \ Node.js 模块，即 `url` 和 `querystring`。`url` 允许我们提取 URL 的不同部分（例如请求路径和查询字符串），而 `querystring`\
    \ 反之可以用于解析请求参数的查询字符串：\n\n```\nurl.parse(url).query\nurl.parse(url).pathname\n\
    // http://localhost:8888/start?foo=bar&hello=world\nquerystring.parse(url)[\"\
    foo\"]\nquerystring.parse(url)[\"hello\"]\n```\n\n我们可以使用 `querystring` 来解析 POST\
    \ 请求体，稍后我们会看到。现在在 `onRequest()` 函数中添加查找浏览器请求的哪个 URL 路径的逻辑：\n\n```javascript\n\
    var http = require(\"http\");\nvar url = require(\"url\");\n\nfunction start()\
    \ {\n  function onRequest(request, response) {\n    var pathname = url.parse(request.url).pathname;\n\
    \    console.log(\"Request for \" + pathname + \" received.\");\n    response.writeHead(200,\
    \ {\"Content-Type\": \"text/plain\"});\n    response.write(\"Hello World\");\n\
    \    response.end();\n  }\n\n  http.createServer(onRequest).listen(8888);\n  console.log(\"\
    Server has started.\");\n}\nexports.start = start;\n```\n\n很好。我们的应用程序现在可以根据请求的\
    \ URL 路径区分请求——这允许我们使用（尚未实现的）路由器根据 URL 路径将请求映射到请求处理器。在我们的应用程序范围内，这意味着我们能够让代码的不同部分处理针对\
    \ /start 和 /upload URL 的请求。我们很快就会看到一切是如何在一起的。\n\n好的，是时候编写我们的路由器了。创建一个名为 `router.js`\
    \ 的新文件，内容如下：\n\n```javascript\nfunction route(pathname) {\n  console.log(\"About\
    \ to route a request for \" + pathname);\n}\n\nexports.route = route;\n```\n\n\
    当然，这段代码基本上什么都没做，但现在这样也可以。在向路由器中放入更多逻辑之前，让我们先看看如何将此路由器与服务器连接起来。我们的 HTTP 服务器需要知道并使用我们的路由器。我们可以将此依赖硬连接到服务器中，但因为我们从其他编程语言的经验中吸取了教训，我们将通过注入此依赖来松散耦合服务器和路由器（你可能想阅读\
    \ Martin Fowler 关于依赖注入的优秀文章以获取背景信息）。让我们首先扩展服务器的 `start()` 函数，以便我们能够将 `route` 函数作为参数传递：\n\
    \n```javascript\nvar http = require(\"http\");\nvar url = require(\"url\");\n\n\
    function start(route) {\n  function onRequest(request, response) {\n    var pathname\
    \ = url.parse(request.url).pathname;\n    console.log(\"Request for \" + pathname\
    \ + \" received.\");\n\n    route(pathname);\n\n    response.writeHead(200, {\"\
    Content-Type\": \"text/plain\"});\n    response.write(\"Hello World\");\n    response.end();\n\
    \  }\n\n  http.createServer(onRequest).listen(8888);\n  console.log(\"Server has\
    \ started.\");\n}\n```\n"
