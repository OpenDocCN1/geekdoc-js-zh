    JavaScript 和 Node.js


    最近我学习了一些 JavaScript 的进阶内容。我在这方面并没有经验。


    这就是为什么这并不是一本“从新手到专家”的书。它更像是一本“从新手到高级新手”的指南。


    如果我没搞错的话，这将是我在开始学习 Node.js 时希望拥有的那种文档。


    ## 服务端 JavaScript


    JavaScript 的最初形态存在于浏览器中。但这只是一个上下文（context）。它定义了你可以用这种语言做什么，但并没有对语言本身能做什么做太多说明。JavaScript
    是一门“完整”的语言：你可以在许多语境中使用它，并用它实现其他其他“完整”语言可以实现的所有功能。


    Node.js 实际上只是另一个上下文：它允许你在后端、浏览器之外运行 JavaScript 代码。


    为了执行你打算在后端运行的 JavaScript，需要对其进行解释和执行。这就是 Node.js 所做的，它利用了 Google 的 V8 虚拟机，这是与
    Chrome 使用相同的 JavaScript 运行时环境。


    此外，Node.js 自带了许多实用的模块，所以你不需要从头开始编写一切，例如在控制台输出字符串之类的代码。


    因此，Node.js 实际上是两个东西：运行时环境和一个库。


    为了使用这些功能，你需要安装 Node.js。这里不再在这里重复安装过程，请你访问官方安装指南⁴。在你安装好并运行后，请回来。


    ## “Hello World”


    好了，让我们跳进冷水中，编写我们的第一个 Node.js 应用：“Hello World”。


    打开你最喜欢的编辑器，创建一个名为 `helloworld.js` 的文件。我们想将“Hello World”写入标准输出（STDOUT），这里是实现该目标所需的代码：


    ```

    console.log("Hello World");

    ```


    保存文件，并通过 Node.js 运行它：


    ```

    node helloworld.js

    ```


    这应该会在你的终端上输出 Hello World。行吧，这些东西很无聊，对吧？让我们写点真有用的东西。


    > ¹https://github.com/joyent/node/wiki/Installation


    ## 使用 Node.js 构建一个完整的 Web 应用


    ### 用例


    让我们保持简单但又要符合实际：


    - 用户应该能够使用 浏览器使用我们的应用程序

    - 用户在请求 http://domain/start 时，应该看到一个欢迎页面，该页面显示一个文件上传表单

    - 通过选择图片文件上传并提交表单，该图片应该被上传到 http://domain/upload，并在上传完成后在该处显示


    完全可以。现在，你可以通过谷歌搜索并拼凑出*某些东西*来来实现这个目标。但并不是我们在这里想要做的。


    此外，我们不想只编写最基础的代码来实现目标，无论这些代码可能多么优雅和正确。我们将刻意添加比需要更多的抽象，以便获得构建更复杂 Node.js 应用的感受。


    使用 Node.js 构建一个完整的 Web 应用


    ### 应用程序栈


    让我们剖析一下我们的应用程序。为了满足这些用例，需要实现哪些部分？


    - 我们想要提供网页，因此我们需要一个 HTTP 服务器

    - 我们的服务器需要根据请求的 URL 对请求做出不同的响应，因此我们需要某种路由器（router）来将请求映射到请求处理器（handler）

    - 为了处理到达服务器并经过路由器的请求，我们需要实际的请求处理器

    - 路由器可能还应该处理任何传入的 POST 数据，并以方便的形式将其交给请求，因此我们需要请求数据处理

    - 我们不仅想处理 URL 的请求，还想在请求这些 URL 时显示内容，这意味着我们需要某种请求处理器可以使用的视图逻辑，以便向用户的浏览器发送内容

    - 最后，用户将能够上传图片，因此我们需要某种上传功能


    '
