    # JavaScript and Node.js


    # JavaScript and You


    Before we talk about all the technical stuff, let’s take a moment and talk about
    you and your relationship with JavaScript. This chapter is here to allow you to
    estimate if reading this document makes any further makes sense for you.


    If you are like me, you started with HTML “development” long ago, by writing HTML
    documents. You came along this funny thing called JavaScript, but you only used
    it in a very basic way, adding interactivity to your web pages every now and then.


    What you really wanted was “the real thing”, you wanted to know how to build complex
    web sites - you learned a programming language like PHP, Ruby, Java, and started
    writing “backend” code.


    Nevertheless, you kept an eye on JavaScript, you saw that with the introduction
    of jQuery, Prototype and the likes, things got more advanced in JavaScript land,
    and that this language really was about more than `window.open().


    However, this was all still frontend stuff, and although it was nice to have jQuery
    at your disposal whenever you felt like spicing up a web page, at the end of the
    day you were, at best, a JavaScript developer.


    And then came Node.js. JavaScript on the server, how cool is that?'
