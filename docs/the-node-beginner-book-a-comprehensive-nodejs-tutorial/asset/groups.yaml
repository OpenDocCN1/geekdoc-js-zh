- md: "\n## Building the application stack\n\n```javascript\nfunction say(word) {\n\
    \  console.log(word);\n}\n```\n\n```\nfunction execute(someFunction, value) {\n\
    \  someFunction(value);\n}\n```\n\nexecute(say, \"Hello\");\n\nRead this carefully!\
    \ What we are doing here is, we pass the function say as the first parameter to\
    \ the execute function. Not the return value of say, but say itself!\n\nThus,\
    \ say becomes the local variable someFunction within execute, and execute can\
    \ call the function in this variable by issuing someFunction() (adding brackets).\n\
    \nOf course, because say takes one parameter, execute can pass such a parameter\
    \ when calling someFunction.\n\nWe can, as we just did, pass a function as a parameter\
    \ to another function by its name. But we don't have to take this redirection\
    \ of first defining, passing it - we can define and pass a function as a parameter\
    \ to another function in-place:\n\n```javascript\nfunction execute(someFunction,\
    \ value) {\n  someFunction(value);\n}\n```\n\n```\nexecute(function(word){ console.log(word)\
    \ }, \"Hello\");\n```\n\nBuilding the application stack\n\nWe define the function\
    \ we want to pass to execute right there at the place where execute expects its\
    \ first parameter.\n\nThis way, we don't even need to give the function a name,\
    \ which is why this is called an anonymous function.\n\nThis is a first glimpse\
    \ at what I like to call “advanced” JavaScript, but let's take it step by step.\
    \ For now, let's just accept that in JavaScript, we can pass a function as a parameter\
    \ when calling another function. We can do this by assigning a function to a variable,\
    \ which we then pass, or by defining the function to pass in-place.\n\n## How\
    \ function passing makes our HTTP server work\n\nWith this knowledge, let’s get\
    \ back to our minimalistic HTTP server:\n\n```javascript\nvar http = require(\"\
    http\");\n```\n\n```javascript\nhttp.createServer(function(request, response)\
    \ {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n  response.write(\"\
    Hello World\");\n  response.end();\n}).listen(8888);\n```\n\nBy now it should\
    \ be clear what we are actually doing here: pass the createServer function an\
    \ anonymous function.\n\nWe could achieve the same by refactoring our code to:\n\
    \n```javascript\nvar http = require(\"http\");\n```\n\n```javascript\nfunction\
    \ onRequest(request, response) {\n  response.writeHead(200, {\"Content-Type\"\
    : \"text/plain\"});\n  response.write(\"Hello World\");\n  response.end();\n}\n\
    ```\n\n```javascript\nhttp.createServer(onRequest).listen(8888);\n```\n\nMaybe\
    \ now be a good moment to ask: Why are we doing it that way?\n\n## Event-driven\
    \ asynchronous callbacks\n\nTo understand Node.js applications have to be written\
    \ this way, we need to understand how Node.js executes our code. Node's approach\
    \ isn't unique, but the underlying execution model is different from runtime environments\
    \ like Python, Ruby, PHP or Java.\n\nLet's take a very simple piece of code like\
    \ this:\n\n```javascript\nvar result = database.query(\"SELECT * FROM hugetable\"\
    );\nconsole.log(\"Hello World\");\n```\n\nPlease ignore for now that we haven't\
    \ actually talked about connecting to databases before - it is just an example.\
    \ The first line queries a database for lots of rows, the second line puts \"\
    Hello World\" to the console.\n\nBuilding the application stack\n\nLet's assume\
    \ that the database query is really slow, that it has to read an awful lot of\
    \ rows, which takes several seconds.\n\nThe way we have written this code, the\
    \ JavaScript interpreter of Node.js first has to read the complete result set\
    \ from the database, and then it can execute `console.log()` function.\n\nIf this\
    \ piece of code was actually, say, PHP, it would work the same way: read all the\
    \ results at once, then execute the next line of code. If this code would be part\
    \ of a web page script, the user would have to wait several seconds for the page\
    \ to load.\n\nHowever, in the execution model of PHP, this would not become a\
    \ “global” problem: the web server starts its own PHP process for every HTTP request\
    \ it receives. If one of these requests results in the execution of a slow piece\
    \ of code, it results in a slow page load for this particular user, but other\
    \ users requesting other pages would not be affected.\n\nThe execution model of\
    \ Node.js is different - there is only one single process. If there is a slow\
    \ database query somewhere in this process, this affects the whole process - everything\
    \ comes to a halt until the slow query has finished.\n\nTo avoid this, JavaScript,\
    \ and therefore Node.js, introduces the concept of event-driven, asynchronous\
    \ callbacks, by utilizing an event loop.\n\nWe can understand this concept by\
    \ analyzing a rewritten version of our problematic code:\n\nBuilding the application\
    \ stack\n\n```javascript\ndatabase.query(\"SELECT * FROM hugetable\", function(rows)\
    \ {\n  var result = rows;\n});\nconsole.log(\"Hello World\");\n```\n\nHere, instead\
    \ of expecting database.query() to directly return a result to, we pass it a second\
    \ parameter, an anonymous function.\n\nIn its previous form, our code was synchronous:\
    \ first do the database query, and only when this is done, then write to the console.\n\
    \nNow, Node.js can handle the database request asynchronously. Provided that database.query()\
    \ is part of an asynchronous library, this is what Node.js does: just as before,\
    \ it takes the query and sends it to the database. But instead of waiting for\
    \ it to be finished, it makes a mental note that says \"When at some point in\
    \ the future the database server is done and sends the result of the query, then\
    \ I have to execute the anonymous function that was passed to database.query().\"\
    \n\nThen, it immediately executes console.log(), and afterwards, it enters the\
    \ loop. Node.js continuously cycles through this loop again and again whenever\
    \ there is nothing else to do, waiting for events. Events like, e.g., a slow database\
    \ query delivering its results.\n\nThis also explains why our HTTP server needs\
    \ a function it can call upon incoming requests - if Node.js would start the server\
    \ and then just pause, waiting for the next request, continuing only when it arrives,\
    \ that would be highly inefficient. if a second user requests the server while\
    \ it is serving the first request, that thesecond request could only be answered\
    \ after the first one is done - as soon as you have more than a handful of HTTP\
    \ requests per second, this wouldn't work at all.\n\nBuilding the application\
    \ stack\n\nIt’s important to note that this asynchronous, single-threaded, event-driven\
    \ execution model isn’t an infinitely scalable performance unicorn with silver\
    \ bullets attached. It is just one of several models, and it has its limitations,\
    \ one being that as of now, Node.js is just one single process, and it can run\
    \ on only one single CPU core. Personally, I find this model quite approachable,\
    \ because it allows it to write applications that have to deal with concurrency\
    \ in an efficient and relatively straightforward manner.\n\nYou might want to\
    \ take the time to read Felix Geisendor’s excellent post Understanding node.js³\
    \ for additional background explanation.\n\nLet’s play around a bit with this\
    \ new concept. Can we prove that our code continues after creating the server,\
    \ even if no HTTP request happened and the callback function we passed isn’t called?\
    \ Let’s try it:\n\n> ³http://debuggable.com/posts/understanding-node-js:4bd98440-45e4-4a9a-8ef7-0f7ecbdd56cb\n\
    \nBuilding the application stack\n\n```javascript\nvar http = require(\"http\"\
    );\n```\n\n```javascript\nfunction onRequest(request, response) {\n  console.log(\"\
    Request received.\");\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"\
    });\n  response.write(\"Hello World\");\n  response.end();\n}\n```\n\n```javascript\n\
    http.createServer(onRequest).listen(8888);\n```\n\n```javascript\nconsole.log(\"\
    Server has started.\");\n```\n"
  mdcn: "\n\n## 构建应用栈\n\n```javascript\nfunction say(word) {\n  console.log(word);\n\
    }\n```\n\n```\nfunction execute(someFunction, value) {\n  someFunction(value);\n\
    }\n```\n\nexecute(say, \"Hello\");\n\n请仔细阅读这里！我们在这里做的是，将函数 `say` 作为第一个参数传递给 `execute`\
    \ 函数。不是传递 `say` 的返回值，而是 `say` 本身！\n\n因此，`say` 变成了 `execute` 内部的局部变量 `someFunction`，`execute`\
    \ 可以通过调用 `someFunction()`（添加括号）来执行该变量中的函数。\n\n当然，因为 `say` 接收一个参数，`execute` 在调用\
    \ `someFunction` 时传递这样一个参数。\n\n我们可以像刚才做的那样，通过名称将函数作为参数传递给另一个函数。但我们不必通过这种重定向方式先定义再传递——我们可以直接在原地定义函数并将其作为参数传递给另一个函数：\n\
    \n```javascript\nfunction execute(someFunction, value) {\n  someFunction(value);\n\
    }\n```\n\n```javascript\nexecute(function(word){ console.log(word) }, \"Hello\"\
    );\n```\n\n构建应用栈\n\n我们直接在 `execute` 期望第一个参数的地方，定义了想要传递给 `execute` 的函数。\n\n这样，我们甚至不需要给函数命名，这就是为什么这被称为匿名函数。\n\
    \n这是我所说的“高级”JavaScript 的初次体验，但让我们循序渐进。现在，我们只需接受在 JavaScript 中，我们可以在调用另一个函数时将一个函数作为参数传递。我们可以通过将函数赋值给变量然后传递它，或者通过原地定义要传递的函数来实现。\n\
    \n## 函数传递如何让我们的 HTTP 服务器工作\n\n掌握了这些知识，让我们回到极简的 HTTP 服务器：\n\n```javascript\nvar\
    \ http = require(\"http\");\n```\n\n```javascript\nhttp.createServer(function(request,\
    \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    \  response.write(\"Hello World\");\n  response.end();\n}).listen(8888);\n```\n\
    \n到目前，应该清楚我们在这里实际上在做什么：向 `createServer` 函数传递一个匿名函数。\n\n我们可以通过重构代码来实现相同的效果：\n\n\
    ```javascript\nvar http = require(\"http\");\n```\n\n```javascript\nfunction onRequest(request,\
    \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    \  response.write(\"Hello World\");\n  response.end();\n}\n```\n\n```javascript\n\
    http.createServer(onRequest).listen(8888);\n```\n\n也许现在是提问的好时机：为什么要这样做？\n\n##\
    \ 事件驱动异步回调\n\n为了理解为什么 Node.js 必须这样编写，我们需要理解 Node.js 是如何执行我们的代码的。Node 的方法并不是唯一的，但其底层执行模型与\
    \ Python、Ruby、PHP 或 Java 等运行时环境不同。\n\n让我们看这段非常简单的代码：\n\n```javascript\nvar result\
    \ = database.query(\"SELECT * FROM hugetable\");\nconsole.log(\"Hello World\"\
    );\n```\n\n请暂时忽略我们之前实际上还没有讨论过连接数据库——这只是一个例子。第一行查询数据库以获取大量行，第二行将“Hello World”打印到控制台。\n\
    \n构建应用栈\n\n假设数据库查询非常慢，它必须读取大量的行，这需要几秒钟。\n\n按照我们编写这段代码的方式，Node.js 的 JavaScript\
    \ 解释器必须先从数据库读取完整的结果集，然后才能执行 `console.log()` 函数。\n\n如果这段代码实际上是（比如 PHP），它的工作方式是一样的：一次性读取所有结果，然后执行下一行代码。如果这段代码是网页脚本的一部分，用户必须等待几秒钟页面才会加载。\n\
    \n然而，在 PHP 的执行模型中，这不会变成一个“全局”问题：Web 服务器为它收到的每一个 HTTP 请求启动自己的 PHP 进程。如果这些请求中的一个导致了慢速代码的执行，会导致该特定用户的页面加载缓慢，但请求其他页面的其他用户不受影响。\n\
    \nNode.js 的执行模型是不同的——它只有一个进程。如果该进程中某处有一个缓慢的数据库查询，它将影响整个进程——在慢查询完成之前，一切都会停滞。\n\n\
    为了避免这种情况，JavaScript（以及因此 Node.js）通过利用事件循环引入了**事件驱动异步回调**的概念。\n\n我们可以通过分析我们问题代码的重写版本来理解这个概念：\n\
    \n构建应用栈\n\n```javascript\ndatabase.query(\"SELECT * FROM hugetable\", function(rows)\
    \ {\n  var result = rows;\n});\nconsole.log(\"Hello World\");\n```\n\n在这里，我们不再期望\
    \ `database.query()` 直接返回结果，而是向它传递了第二个参数，一个匿名函数。\n\n在之前的形式中，我们的代码是同步的：先执行数据库查询，只有当执行完成后，才向控制台写入内容。\n\
    \n现在，Node.js 可以异步处理数据库请求。只要 `database.query()` 是异步库的一部分，Node.js 就会这样做：像以前一样，它获取查询并将其发送到数据库。\n\
    \n它并不等待完成，而是在记下：“在未来的某一点，当数据库完成并发送结果时，我需要执行传递的匿名函数。”\n\n然后，它立即执行 `console.log()`，之后进入循环。当没有其他事情可做时，Node.js\
    \ 会不断循环这个循环，等待事件。例如数据库查询交付结果。\n\n这也解释了为什么我们的 HTTP 服务器需要一个可以在接收请求时调用的函数——如果 Node.js\
    \ 启动服务器后就暂停，只有当请求到达时才继续，将是非常低效的。如果在处理第一个请求时第二个用户请求了服务器，第二个请求只能在第一个请求完成后才能得到回答——一旦你每秒超过几个\
    \ HTTP 请求，这种方法就完全无法工作。\n\n构建应用栈\n\n需要注意的是，这种异步、单线程、事件驱动的执行模型并不是无限扩展的性能独角兽。它只是几种模型之一，并且有其局限性，其中一个是截至目前\
    \ Node.js 只有一个进程，并且只能运行在单个 CPU 核心上。对我个人而言，我觉得这种模型非常容易上手，因为它允许以高效且相对简单的方式编写处理并发的应用。\n\
    \n你可能想花时间阅读 Felix Geisendor 优秀的文章 Understanding node.js³ 以获取额外的背景解释。\n\n让我们用这个新概念玩玩。我们能证明在创建服务器后代码继续执行，即使没有发生\
    \ HTTP 请求且我们传递的回调函数没有被调用吗？让我们试试：\n\n> ³http://debuggable.com/posts/understanding-node-js:4bd98440-45e4-4a9a-8ef7-0f7ecbdd56cb\n\
    \n构建应用栈\n\n```javascript\nvar http = require(\"http\");\n```\n\n```javascript\n\
    function onRequest(request, response) {\n  console.log(\"收到请求.\");\n  response.writeHead(200,\
    \ {\"Content-Type\": \"text/plain\"});\n  response.write(\"Hello World\");\n \
    \ response.end();\n}\n```\n\n```javascript\nhttp.createServer(onRequest).listen(8888);\n\
    ```\n\n```javascript\nconsole.log(\"服务器已启动.\");\n```\n\n"
