    \ just recently. I’m not experienced.\n\nWhich is why this is no “from novice\
    \ to expert” book. It’s more like “from novice to advanced novice”.\n\nIf I don’t\
    \ fail, this will be the kind of document I wish I had when starting with Node.js.\n\
    \n## Server-side JavaScript\n\nThe first incarnations of JavaScript lived in browsers.\
    \ But this is just the context. It defines what you can do with the language,\
    \ but it doesn’t say much about what the language itself can do. JavaScript is\
    \ a “complete” language: you can use it in many contexts and achieve everything\
    \ with it you can achieve with other “complete” language.\n\nNode.js really is\
    \ just another context: it allows you to run JavaScript code in the backend, outside\
    \ a browser.\n\nIn order to execute the JavaScript you intend to run in the backend,\
    \ it needs to be interpreted and, executed. This is what Node.js does, by making\
    \ use of Google’s V8 VM, the same runtime environment for JavaScript that Chrome\
    \ uses.\n\nPlus, Node.js ships with a lot of useful modules, so you don’t have\
    \ to write everything from scratch, like for example something that outputs a\
    \ string on the console.\n\nThus, Node.js is really two things: a runtime environment\
    \ and a library.\n\nIn order to make use of these, you need to install Node.js.\
    \ Instead of repeating the process here, I kindly ask you to visit the official\
    \ installation instructions⁴. Please come back once you are up and running.\n\n\
    ## “Hello World”\n\nOk, let's jump in the cold water and write our first Node.js\
    \ application: “Hello World”.\n\nOpen your favorite editor and create a file called\
    \ helloworld.js. We want to write “Hello World” to STDOUT, and here is the code\
    \ needed to do that:\n\n```\nconsole.log(\"Hello World\");\n```\n\nSave the file,\
    \ and execute it through Node.js:\n\n```\nnode helloworld.js\n```\n\nThis should\
    \ output Hello World on your terminal. Ok, this stuff is boring, right? Let’s\
    \ write some real stuff.\n\n> ¹https://github.com/joyent/node/wiki/Installation\n\
    \n## A full blown web application with Node.js\n\n### The use cases\n\nLet's keep\
    \ it simple, but realistic:\n\n- The user should be able to use our application\
    \ with a web browser\n- The user should see a welcome page when requesting http://domain/start\
    \ which displays a file upload form\n- By choosing an image file to upload and\
    \ submitting the form, this image should then be uploaded to http://domain/upload,\
    \ where it is displayed once the upload is finished\n\nFair enough. Now, you could\
    \ achieve this goal by googling and hacking together *something*. But that's not\
    \ what we want to do here.\n\nFurthermore, we don't want to write only the most\
    \ basic code to achieve the goal, however elegant and correct this code might\
    \ be. We will intentionally add more abstraction than necessary in order to get\
    \ a feeling for building more complex Node.js applications.\n\nA full blown web\
    \ application with Node.js\n\n### The application stack\n\nLet's dissect our application.\
    \ Which parts need to be implemented in order to fulfill the use cases?\n\n- We\
    \ want to serve web pages, therefore we need an HTTP server\n- Our server will\
    \ need to answer differently to requests, depending on which URL the request was\
    \ asking, thus we need some kind of router in order to map requests to request\
    \ handlers\n- To fulfill the requests that arrived at the server and have been\
    \ routed using the router, we need actual request handlers\n- The router probably\
    \ should also treat any incoming POST data and give it to the request in a convenient\
    \ form, thus we need request data handling\n- We not only want to handle requests\
    \ for URLs, we also want to display content when these URLs are requested, which\
    \ means we need some kind of view logic the request handlers can use in order\
    \ to send content to the user's browser\n- Last but least, the user will be able\
    \ to upload images, so we are going to need some kind of upload handling which\
    \ takes care of the details\n\nLet's think a moment about how we would build this\
    \ stack with PHP. It's not exactly a secret that the typical setup would be an\
    \ Apache HTTP server with mod_php5 installed.\nWhich in turn means that the whole\
    \ \"we need to be able to serve web pages and receive HTTP requests” stuff doesn’t\
    \ happen within PHP itself.\n\nWell, with node, things are a bit different. Because\
    \ with Node.js, we not only implement our application, we also implement the whole\
    \ HTTP server. In fact, our web application and its web server are basically the\
    \ same.\n\nThis might sound like a lot of work, but we will see in a moment that\
    \ with Node.js, it’s not.\n\nLet’s just start at the beginning and implement the\
    \ first part of our stack, the HTTP server.\n\n## Building the application stack\n\
    \n### A basic HTTP server\n\nWhen I arrived at the point where I wanted to start\
    \ with my first “real” Node.js application, I wondered not only how to actually\
    \ code it, but also how to organize my code.\n\nDo I need to have everything in\
    \ one file? Most tutorials on the web that teach you how to write a basic HTTP\
    \ server in Node.js have all the logic in one place. What if I want to make sure\
    \ that my code stays readable the most stuff I implement?\n\nTurns out, it's relatively\
    \ easy to keep the different concerns of your code separated, by putting them\
    \ in modules.\n\nThis allows you to have a clean main file, which you execute\
    \ with Node.js, and clean modules that can be used by the main file and among\
    \ each other.\n\nSo, let's create a main file which we use to start our application,\
    \ and a module file where our HTTP server code lives.\n\nMy impression is that\
    \ it's more or less a standard to name your main file *index.js*. It makes sense\
    \ to put our server module into a file named *server.js*.\n\nLet's start with\
    \ the server module. Create the file *server.js* in the root directory of your\
    \ project, and fill it with the following code:\n\n```\nvar http = require(\"\
    http\");\n```\n\n```\nhttp.createServer(function(request, response) {\n  response.writeHead(200,\
    \ {\"Content-Type\": \"text/plain\"});\n  response.write(\"Hello World\");\n \
    \ response.end();\n}).listen(8888);\n```\n\nThat's it! You just wrote a working\
    \ HTTP server. Let's prove it by running and testing it. First, execute your script\
    \ with Node.js:\n\nnode server.js\n\nNow, open your browser and point it at http://localhost:8888/.\n\
    This should display a web page that says \"Hello World\".\n\nThat's quite interesting,\
    \ isn't it. How about talking about what's going here and leaving the question\
    \ of how to organize our project for later? I promise we'll get back to it.\n\n\
    ## Analyzing our HTTP server\n\nWell, let's analyze what's actually going here.\n\
    \nThe first line requires the http module that ships with Node.js and makes it\
    \ accessible through the variable http.\n\nWe then call one of the functions the\
    \ http module offers: createServer. This function returns an object, and this\
    \ object has a method named listen, and takes a numeric value which indicates\
    \ the port number our HTTP server is going to listen on.\n\nPlease ignore for\
    \ a second the function definition that follows the opening bracket of createServer().\n\
    \nWe could have written the code that starts our server and makes it listen at\
    \ port 8888 like this:\n\n```\nvar http = require(\"http\");\n```\n\n```\nvar\
    \ server = http.createServer();\nserver.listen(8888);\n```\n\nThat would start\
    \ an HTTP server listening at port 8888 and doing nothing (not even answering\
    \ any incoming requests).\n\nThe really interesting (and, if your background is\
    \ a more conservative language like PHP, odd looking) part is the function definition\
    \ right there where you would expect the first parameter of the createServer()\
    \ call.\n\nTurns out, this function definition IS the first (and only) parameter\
    \ we are giving to the createServer() call. Because in JavaScript, functions can\
    \ be passed around like any other value.\n\n## Passing functions around\n\nYou\
    \ can, for example, do something like this:\n"
