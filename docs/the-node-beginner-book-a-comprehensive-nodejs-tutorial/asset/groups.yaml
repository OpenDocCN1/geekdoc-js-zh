- md: "\n# Building the application stack\n\nAnd let's extend our index.js accordingly,\
    \ that is, injecting the route function of our router into the server:\n\n```\n\
    var server = require(\"./server\");\nvar router = require(\"./router\");\n```\n\
    \n```\nserver.start(router.route);\n```\n\nAgain, we are passing a function, which\
    \ by we now isn't any news for us.\n\nIf we start our application now (node index.js,\
    \ as always), and request a URL, you can now see from the application's output\
    \ that our HTTP server makes use of our router and passes it the requested pathname:\n\
    \n```bash\nbash node index.js\nRequest for /foo received.\nAbout to route a request\
    \ for /foo\n```\n\n(I omitted the rather annoying output for the /favicon.ico\
    \ request).\n\n# Execution in the kingdom of verbs\n\nMay I once again stray away\
    \ for a while and talk about functional programming again?\n\nPassing functions\
    \ is not only a technical consideration. With regard to software design, it's\
    \ almost philosophical. Just think\n\nBuilding the application stack about it:\
    \ in our index file, we could have passed the router object into the server, and\
    \ the server could have called this object’s route function.\n\nThis way, we would\
    \ have passed a thing, and the server would have used this thing to do something.\
    \ Hey, router thing, could you please route this for me?\n\nBut the server doesn’t\
    \ need the thing. It only needs to get something done, and to get something done,\
    \ you don’t need things at all, you need actions. You don’t need nouns, you need\
    \ verbs.\n\nUnderstanding the fundamental mind-shift that’s at the core of this\
    \ idea is what we really understand functional programming.\n\nAnd I did understand\
    \ it when reading Steve Gegge’s masterpiece Execution in the Kingdom of Nouns.\
    \ Go read it now, really. It’s one of the best writings related to software I\
    \ ever had the pleasure to encounter.\n\n# Routing to real request handlers\n\n\
    Back to business. Our HTTP server and our request router are now best friends\
    \ and talk to each other as we intended.\n\nOf course, that’s not enough. “Routing”\
    \ means, we want to handle requests to different URLs differently. We would like\
    \ to have the “business logic” for requests to /start handled in another function\
    \ than requests to /upload.\n\n> http://steve-yegge.blogspot.com/2006/03/execution-in-kingdom-of-nouns.html\n\
    \n# Building the application stack\n\nRight now, the routing “ends” in the router,\
    \ and the router is not the place to actually “do” something with the requests,\
    \ because that wouldn’t scale well once our application becomes more complex.\n\
    \nLet’s call these functions, where requests are routed to, request handlers.\
    \ And let's tackle those next, because unless we have these in place there isn't\
    \ much sense in doing anything with the router for now.\n\nNew application part,\
    \ new module - no surprise here. Let’s create a module called requestHandlers,\
    \ add a placeholder function for every request handler, and export these as methods\
    \ of the module:\n\n```javascript\nfunction start() {\n    console.log(\"Request\
    \ handler 'start' was called.\");\n}\n\nfunction upload() {\n    console.log(\"\
    Request handler 'upload' was called.\");\n}\n\nexports.start = start;\nexports.upload\
    \ = upload;\n```\n\nThis allows us to wire the request handlers into the router,\
    \ giving our router something to route to.\n\nAt this point we need to make a\
    \ decision: do we hard-code usage of the requestHandlers module into the router,\
    \ or do we want a bit more dependency injection? Although dependency injection,\
    \ like every other pattern, shouldn’t be used only for the sake of using it, in\
    \ this case it makes sense to loosely couple the router and its request handlers,\
    \ and thus making the router really reusable.\n\nThis means we need to pass the\
    \ request handlers from our server into our router, but this feels even more wrong,\
    \ which is why we should go the whole way and pass them to the server from our\
    \ main file, and passing it on to the router from there.\n\nHow are we going to\
    \ pass them? Right now we have two handlers, but in a real application, this number\
    \ is going to increase and vary, and we are sure we don’t want to fiddle around\
    \ mapping requests to handlers in the router whenever a new URL / request handler\
    \ is added. And having some *if request == x then call handler y* in the router\
    \ would be more than ugly.\n\nA varying number of items, each mapped to a string\
    \ (the requested URL)? Well, sounds like an associative array would be a perfect\
    \ fit.\n\nWell, this finding is slightly disappointed by the fact that JavaScript\
    \ doesn’t provide associative array - or does it? it’s actually objects that we\
    \ want to use if we need an associative array!\n\nThere’s a nice introduction\
    \ to this at http://msdn.microsoft.com/en-us/magazine/cc163419.aspx, let me quote\
    \ the relevant part:\n\n> In C++ or C#, when we're talking about objects, we’re\
    \ referring to instances of classes or structs.\n\nhttp://msdn.microsoft.com/en-us/magazine/cc163419.aspx\n\
    \nObjects have different properties and methods, depending on which templates\
    \ (that is, classes) they are instantiated from. That's not the case with JavaScript\
    \ objects. In JavaScript, objects are just collections of name/value pairs - think\
    \ of a JavaScript object as a dictionary with string keys.\n\nIf JavaScript objects\
    \ are just collections of name/value pairs, how can they have methods? Well, the\
    \ values can be strings, numbers etc.\n"
  mdcn: "\n\n# 构建应用栈\n\n让我们相应地扩展 `index.js`，即将路由器的路由函数注入服务器中：\n\n```javascript\nvar\
    \ server = require(\"./server\");\nvar router = require(\"./router\");\n```\n\n\
    ```\nserver.start(router.route);\n```\n\n再次，我们正在传递一个函数，这对我们来说已经不再新鲜了。\n\n如果我们现在启动应用程序（像往常一样运行\
    \ `node index.js`）并请求一个 URL，你现在可以从程序的输出中看到我们的 HTTP 服务器使用了路由器并将请求的路径传递给了它：\n\n\
    ```bash\nbash node index.js\nRequest for /foo received.\nAbout to route a request\
    \ for /foo\n```\n\n（我省略了 /favicon.ico 请求相当烦人的输出）。\n\n# 在动词王国中执行\n\n我是否可以再次偏离主题，重新谈谈函数式编程？\n\
    \n传递函数不仅是一个技术考虑。在软件设计方面，它几乎是哲学性的。想一想：\n\n基于此构建应用栈：在我们的 `index` 文件中，我们可以将路由器对象传递给服务器，服务器可以调用该对象的\
    \ `route` 函数。\n\n这样的话，我们就传递了一个“东西”，而服务器使用这个“东西”来做某事。嘿，路由器东西，你能帮我路由一下这个吗？\n\n但服务器并不需要这个“东西”。它只需要完成某事，而为了完成某事，你根本不需要“东西”，你需要的是“动作”。你不需要名词，你需要的是动词。\n\
    \n理解这一理念核心的根本性思维转变，才是真正理解了函数式编程。\n\n在阅读 Steve Gegge 的杰作《Execution in the Kingdom\
    \ of Nouns》（名词王国中的执行）时，我确实理解了它。现在去读读吧，真的。这是我荣幸遇到过的与软件相关的最好的文章之一。\n\n# 路由到真实的请求处理器\n\
    \n回到正题。我们的 HTTP 服务器和请求路由器现在是好朋友了，并且正如我们所预期的那样相互通信。\n\n当然，这还不够。“路由”意味着我们想要以不同的方式处理对不同\
    \ URL 的请求。我们希望处理 `/start` 请求的“业务逻辑”位于处理 `/upload` 请求的另一个函数中。\n\n> http://steve-yegge.blogspot.com/2006/03/execution-in-kingdom-of-nouns.html\n\
    \n# 构建应用栈\n\n现在，路由“结束”于路由器，而路由器并不是实际上对请求进行“执行”某些操作的地方，因为一旦我们的应用程序变得复杂，这种做法扩展性会不好。\n\
    \n让我们把请求被路由到的这些函数称为“请求处理器”（request handlers）。让我们接下来处理它们，因为除非我们准备好这些处理器，否则现在对路由器做任何事情都没有太大意义。\n\
    \n新的应用部分，新的模块——这并不意外。让我们创建一个名为 `requestHandlers` 的模块，为每个请求处理器添加一个占位函数，并将它们作为模块的方法导出：\n\
    \n```javascript\nfunction start() {\n    console.log(\"Request handler 'start'\
    \ was called.\");\n}\n\nfunction upload() {\n    console.log(\"Request handler\
    \ 'upload' was called.\");\n}\n\nexports.start = start;\nexports.upload = upload;\n\
    ```\n\n这允许我们把请求处理器接线到路由器中，为我们的路由器提供可以路由的对象。\n\n在此时，我们需要做一个决定：我们是在路由器中硬编码对 `requestHandlers`\
    \ 模块的使用，还是我们想要更多的依赖注入？虽然依赖注入像其他任何模式一样，不应该仅仅为了使用而使用，但在这种情况下，将路由器和请求处理器松耦合是有意义的，从而使路由器变得真正具有可用性。\n\
    \n这意味着我们需要从服务器将请求处理器传递到路由器，但这种感觉更加不对劲，这就是为什么我们应该一步到位，从我们的主文件将它们传递给服务器，然后从那里传递给路由器。\n\
    \n我们该如何传递它们呢？现在我们有两个处理器，但在实际应用程序中，这个数量将会增加并变化，我们确定不想在每当添加一个新的 URL / 请求处理器时，都要在路由器里忙着处理请求到处理器的映射。而且在路由器中写一些类似\
    \ *如果请求 == x 则调用处理器 y* 的代码将是太难看了。\n\n数量不断变化的项，每个项都映射到一个字符串（请求的 URL）？听起来关联数组（associative\
    \ array）是完美的选择。\n\n嗯，这个发现略显失望的是，JavaScript 并没有提供关联数组——或者有吗？如果我们需要关联数组，实际上想要用的是对象！\n\
    \n在 http://msdn.microsoft.com/en-us/magazine/cc163419.aspx 有一个很棒的介绍，让我引用相关部分：\n\
    \n> 在 C++ 或 C# 中，当我们谈论对象时，我们指的是类或结构体的实例。\n\nhttp://msdn.microsoft.com/en-us/magazine/cc163419.aspx\n\
    \n对象具有不同的属性和方法，取决于它们是从哪个模板（即类）实例化的。JavaScript 对象就不是这样。在 JavaScript 中，对象仅仅是键/值对的集合——把\
    \ JavaScript 对象想象成一个以字符串为键的字典。\n\n如果 JavaScript 对象仅仅是键/值对的集合，它们怎么能有方法呢？嗯，值可以是字符串、数字等。\n\
    \n"
