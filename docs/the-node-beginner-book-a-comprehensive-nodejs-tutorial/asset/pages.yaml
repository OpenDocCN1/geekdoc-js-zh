  md: "# Building the application stack\n\n```\ndatabase.query(\"SELECT * FROM hugetable\"\
    , function(rows) {\n  var result = rows;\n});\nconsole.log(\"Hello World\");\n\
    ```\n\nHere, instead of expecting database.query() to directly return a result\
    \ to, we pass it a second parameter, an anonymous function.\n\nIn its previous\
    \ form, our code was synchronous: first do the database query, and only when this\
    \ is done, then write to the console.\n\nNow, Node.js can handle the database\
    \ request asynchronously. Provided that database.query() is part of an asynchronous\
    \ library, this is what Node.js does: just as before, it takes the query and sends\
    \ it to the database. But instead of waiting for it to be finished, it makes a\
    \ mental note that says \"When at some point in the future the database server\
    \ is done and sends the result of the query, then I have to execute done the anonymous\
    \ function that was passed to database.query().\"\n\nThen, it immediately executes\
    \ console.log(), and afterwards, it enters the loop. Node.js continuously cycles\
    \ through this loop again and again whenever there is nothing else to do, waiting\
    \ for events. Events like, e.g., a slow database query delivering its results.\n\
    \nThis also explains why our HTTP server needs a function it can call upon incoming\
    \ requests - if Node.js would start the server and then just pause, waiting for\
    \ the next request, continuing only when it arrives, that would be highly inefficient.\
    \ if a second user requests the server while it is serving the first request,\
    \ that"
