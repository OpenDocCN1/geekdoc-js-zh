  md: 'However, because functions and objects in JavaScript are different from their
    counterparts in most other languages, these will be explained in more detail.


    # Structure of this document


    Upon finishing this document, you will have created a complete web application
    which allows the users of this application to view web pages and upload files.


    Which, of course, is not exactly world-changing, but we will go some extra miles
    and not only create the code that is “just enough” to make these use cases possible,
    but create a simple, yet complete framework to cleanly separate the different
    aspects of our application. You will see what I mean in a minute.


    We will start with looking at how JavaScript development in Node.js is different
    from JavaScript development in a browser.


    Next, we will stay with the good old tradition of writing a “Hello World” application,
    which is a most basic Node.js application that “does” something.


    Then, we will discuss what kind of “real” application we want to build, dissect
    the different parts which need to be implemented to assemble this application,
    and start working on each of these parts step-by-step.


    As promised, along the way we will learn about some of the more advanced concepts
    of JavaScript, how to make use of them, and look at why it makes sense to use
    these concepts instead of those we know from other programming languages.'
