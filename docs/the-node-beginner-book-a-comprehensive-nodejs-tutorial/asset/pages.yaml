  md: '# About


    The aim of this document is to get you started with developing applications for
    Node.js, teaching you everything you need to know about “advanced” JavaScript
    along the way. It goes way beyond your typical “Hello World” tutorial.


    # Status


    You are reading the final version of this book, i.e., updates are only done to
    correct errors or to reflect changes in new versions of Node.js. It was last updated
    on April 22, 2013.


    The code samples in this book are tested to work with Node.js version 0.8.8.


    # Intended audience


    This document will probably fit best for readers that have a background similar
    to my own: experienced with at least one object-oriented language like Ruby, Python,
    PHP or Java, little experience with JavaScript, and completely new to Node.js.


    Aiming at developers that already have experience with other programming languages
    means that this document won’t cover really basic stuff like data types, variables,
    control structures and the likes. You already need to know these to understand
    this document.'
  merge: -1
