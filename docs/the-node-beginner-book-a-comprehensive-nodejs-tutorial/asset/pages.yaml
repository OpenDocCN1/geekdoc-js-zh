  md: "# Building the application stack\n\nmultiple megabytes in size. Handling the\
    \ whole bulk of data in one go would result in a blocking operation.\n\nTo make\
    \ the whole process non-blocking, Node.js serves our code POST data in small chunks,\
    \ callbacks that are called upon certain events. These events are data (an new\
    \ chunk of POST data arrives) and end (all chunks have been received).\n\nWe need\
    \ to tell Node.js which functions to call back when these events occur. This is\
    \ done by adding listeners to the request object that is passed to our onRequest\
    \ callback whenever an HTTP request is received.\n\nThis basically looks like\
    \ this:\n\n```\nrequest.addEventListener(\"data\", function(chunk) {\n  // called\
    \ when a new chunk of data was received\n});\n```\n\n```\nrequest.addEventListener(\"\
    end\", function() {\n  // called when all chunks of data have been received\n\
    });\n```\n\nThe question arises where to implement this logic. We currently can\
    \ access the request object in our server only - we don't pass it to the router\
    \ or the request handlers, like we did with the response object.\n\nIn my opinion,\
    \ it's an HTTP server to give the application all the data from a requests it\
    \ needs to do its job. Therefore, I suggest we handle the POST data processing\
    \ right in the server and pass the final data on to the router and the request\
    \ handlers, which then can decide what to do with it."
  merge: -1
  pgno: 56
- img_proc: true
  md: "# Building the application stack\n\nThus, the idea is to put the data and end\
    \ event callbacks in the server, collecting all POST data chunks in the data callback,\
    \ and calling the router upon receiving the end event, while passing the collected\
    \ data chunks on the router, which in turn passes it to the request handlers.\n\
    \nHere we go, starting with server.js:\n\n```\nvar http = require(\"http\");\n\
    var url = require(\"url\");\n\nfunction start(route, handle) {\n  function onRequest(request,\
    \ response) {\n    var postData = \"\";\n    var pathname = url.parse(request.url).pathname;\n\
    \    console.log(\"Request for \" + pathname + \" received.\");\n\n    request.setEncoding(\"\
    utf8\");\n\n    request.addEventListener(\"data\", function(postDataChunk) {\n\
    \      postData += postDataChunk;\n      console.log(\"Received POST data chunk\
    \ \" + \n      postDataChunk + \" \".\");\n    });\n\n    request.addEventListener(\"\
    end\", function() {\n      route(handle, pathname, response, postData);\n    });\n\
    \  }\n}\n```"
