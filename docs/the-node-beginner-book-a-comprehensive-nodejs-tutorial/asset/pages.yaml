  md: '# Building the application stack


    Let''s assume that the database query is really slow, that it has to read an awful
    lot of rows, which takes several seconds.


    The way we have written this code, the JavaScript interpreter of Node.js first
    has to read the complete result set from the database, and then it can execute
    `console.log()` function.


    If this piece of code was actually, say, PHP, it would work the same way: read
    all the results at once, then execute the next line of code. If this code would
    be part of a web page script, the user would have to wait several seconds for
    the page to load.


    However, in the execution model of PHP, this would not become a “global” problem:
    the web server starts its own PHP process for every HTTP request it receives.
    If one of these requests results in the execution of a slow piece of code, it
    results in a slow page load for this particular user, but other users requesting
    other pages would not be affected.


    The execution model of Node.js is different - there is only one single process.
    If there is a slow database query somewhere in this process, this affects the
    whole process - everything comes to a halt until the slow query has finished.


    To avoid this, JavaScript, and therefore Node.js, introduces the concept of event-driven,
    asynchronous callbacks, by utilizing an event loop.


    We can understand this concept by analyzing a rewritten version of our problematic
    code:'
