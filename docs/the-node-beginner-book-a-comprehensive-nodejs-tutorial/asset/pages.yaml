    operations (like, e.g., copying huge files around or similar stuff) without forcing
    our application into a full stop as the blocking sleep operation did.


    (If you would like to prove this, replace "ls -lah" with a more expensive operation
    like "find /”).


    But we aren’t exactly happy with our elegant non-blocking operation, when our
    browser doesn’t display its result, right?


    Well, then, let’s fix it. And while we are at it, let’s try to understand why
    the current architecture doesn’t work.


    The problem is that exec(), in order to work non-blocking, makes use of a callback
    function.


    In our example, it’s an anonymous function which is passed the second parameter
    to the exec() function call:


