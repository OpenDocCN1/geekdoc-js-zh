  md: '# Building the application stack


    second request could only be answered after the first one is done - as soon as
    you have more than a handful of HTTP requests per second, this wouldn''t work
    at all.


    It’s important to note that this asynchronous, single-threaded, event-driven execution
    model isn’t an infinitely scalable performance unicorn with silver bullets attached.
    It is just one of several models, and it has its limitations, one being that as
    of now, Node.js is just one single process, and it can run on only one single
    CPU core. Personally, I find this model quite approachable, because it allows
    it to write applications that have to deal with concurrency in an efficient and
    relatively straightforward manner.


    You might want to take the time to read Felix Geisendor’s excellent post Understanding
    node.js³ for additional background explanation.


