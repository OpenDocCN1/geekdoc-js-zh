  md: '# How our server handles requests


    Ok, let’s quickly analyze the rest of our server code, that is, the body of our
    callback function `onRequest()`.


    When the callback fires and our `onRequest()` function gets triggered, two parameters
    are passed into it: `request` and `response`.


    Those are objects, and you can use their methods to handle the details of the
