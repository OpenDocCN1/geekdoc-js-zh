  md: '# Building the application stack


    # A basic HTTP server


    When I arrived at the point where I wanted to start with my first “real” Node.js
    application, I wondered not only how to actually code it, but also how to organize
    my code.


    Do I need to have everything in one file? Most tutorials on the web that teach
    you how to write a basic HTTP server in Node.js have all the logic in one place.
    What if I want to make sure that my code stays readable the most stuff I implement?


    Turns out, it''s relatively easy to keep the different concerns of your code separated,
    by putting them in modules.


    This allows you to have a clean main file, which you execute with Node.js, and
    clean modules that can be used by the main file and among each other.


    So, let''s create a main file which we use to start our application, and a module
    file where our HTTP server code lives.


    My impression is that it''s more or less a standard to name your main file *index.js*.
    It makes sense to put our server module into a file named *server.js*.


    Let''s start with the server module. Create the file *server.js* in the root directory
    of your project, and fill it with the following code:'
