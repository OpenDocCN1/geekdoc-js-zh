  md: '# Responding request handlers with non-blocking operations


    I''ve just used the phrase “the right way”. Dangerous stuff. Quite often, there
    is no single “right way”.


    But one possible solution for this is, as often with Node.js, to pass functions
    under around. Let''s examine this.


    Right now, our application is able to transport the content (which the request
    handlers would like to display to the user) from the request handlers to the HTTP
    server by returning it up through the layers of the application (request handler
    -> router -> server).


    Our new approach is as follows: instead of bringing the content to the server,
    we will bring the server to the content. To be more precise, we will inject the
    response object (from our server’s callback function onRequest()) through the
    router into the request handlers. The handlers will then be able to use this object’s
    functions to respond to requests themselves.


    Enough explanation, here is the step by step recipe on how to change our application.


    Let’s start with our server.js:'
