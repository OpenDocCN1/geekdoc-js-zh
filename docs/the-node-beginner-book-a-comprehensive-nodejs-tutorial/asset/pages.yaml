  md: '# Conclusion and outlook


    Congratulations, our mission is accomplished! We wrote a simple yet full-fledged
    Node.js web application. We talked about server-side JavaScript, functional programming,
    blocking and non-blocking operations, callbacks, events, custom, internal and
    external modules, and a lot more.


    Of course, there''s a lot of stuff we did not talk about: how to talk to a database,
    how to write unit tests, how to create external modules that are installable via
    NPM, or even something simple like how to handle requests.


    But that''s the fate of every book aimed at beginners - it can''t talk about every
    single aspect in every single detail.


    The good news is, the Node.js community is extremely vibrant (think of an ADHD
    kid on caffeine, but in a positive way), which means there are a lot of resources
    out there, and a lot of places to get your questions answered. The Node.js community
    wiki²20 and the NodeCloud directory²21 are probably the best starting points for
    more information.


