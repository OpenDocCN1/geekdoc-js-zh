  \ 将它们添加到 DOM 中。我们还有能力移动元素、删除它们，并进行各种神一般的操作。让我们停顿一下，让这些内容进入脑海。这非常了。\n\n除了这一切最初的酷炫之外，在\
  \ DOM 中动态创建和修改元素的能力是让许多我们喜欢的网站和应用程序运行的重要细节。当你考虑到这一点时，它是合理的。在 HTML 中预定义一切是非常局限的。我们希望内容在数据调入时发生变化、与页面交互时、滚动时或进行其他各种操作。\n\
  \n在本章中，我们将涵盖让这一切运行的基础。我们将查看如何创建元素、删除元素、重新父化以及克隆元素。这也是直接查看 DOM 相关的最后一个章节，所以请你的朋友们准备好！\n\
  \n（注：提供的输入文本末尾包含了一些重复片段；我将根据“创建元素”章节的逻辑来清理最终输出。）\n\n等等，我为上述处理过程中的技术故障道歉。这里是根据提供的输入文本的实际、干净的版本。\n\
  \n现在，我们将退一步查看我们的示例中到底发生了什么。如果我们查看 JavaScript，我们需要创建元素并将其添加到 DOM 位于 `<script>` 标签之间：\n\
  \n```\nlet newElement = document.createElement(\"p\");\n\nlet bodyElement = document.querySelector(\"\
  body\");\n\nnewElement.textContent = \"\";\n\nbodyElement.appendChild(newElement);\n\
  ```\n\n通过 `newElement`，我们存储了新创建的 `p` 标签的引用。通过 `bodyElement`，我们存储了 `body` 元素的引用。在新创建的元素\
  \ (`newElement`) 上，我们将 `textContent` 属性设置为我们最终显示的内容。最后一步是获取我们漫无目的地漂浮的 `newElement`\
  \ 并使其成为 `body` 元素的元素，依靠老经典的 `appendChild`。\n\n图 33.1 是我们示例中 DOM 样子的可视化。\n\n![images](img/33fig01.jpg)\n\
  \n图 33.1\n\n代码运行后 DOM 的样子\n\n\n\n现在，关于 `appendChild` 函数的一个细节是，它总是将元素添加到父元素现有所有子元素的末尾。在我们的案例中，`body`\
  \ 元素已经包含了 `h1` 和 `script` 元素作为子元素。`p` 元素被追加在它们之后，成为最小的子元素。尽管如此，我们仍然可以控制特定元素在父元素下的确切位置。\n\
  \n如果我们想将 `newElement` 直接插入到 `h1` 标签之后，我们可以通过在父元素上调用 `insertBefore` 函数来实现。`insertBefore`\
  \ 函数接受两个参数：第一个参数是你想要插入的元素；第二个参数是你想想要置于其之前的兄弟元素（又称作为父元素的子元素）的引用。这里是修改后的示例，使 `newElement`\
  \ 位于 `h1` 元素之后（且 `script` 元素之前）：\n\n点击此处查看代码图片\n\n```\nlet newElement = document.createElement(\"\
  p\");\nlet bodyElement = document.querySelector(\"body\");\nlet scriptElement =\
  \ document.querySelector(\"script\");\nnewElement.textContent = \"I exist entirely\
  \ in your imagination.\";\nbodyElement.insertBefore(newElement, scriptElement);\n\
  ```\n\n注意，我们在 `bodyElement` 上调用了 `insertBefore`，并指定将 `newElement` 插入到 `script` 元素之前。在这种情况下，我们的\
  \ DOM 将如图 33.2 所示。\n\n![images](img/33fig02.jpg)\n\n图 33.2\n\n新插入元素位于 `h1` 和 `script`\
  \ 元素之间。\n\n你可能会认为，既然有 `insertBefore` 方法，就一定也有 `insertAfter` 方法。但事实并非如此。目前还没有被广泛支持的内置方法可以将元素插入到另一个元素*之后*而不是之前。我们可以做的是“欺骗”\
  \ `insertBefore` 函数，告诉它在某个元素前面“额外插入一个元素”。这听起来可能不太通顺，所以让我先给你看代码，稍后再解释：\n\n点击此处查看代码图片\n\
  \n```\nlet newElement = document.createElement(\"p\");\nlet bodyElement = document.querySelector(\"\
  body\");\nlet h1Element = document.querySelector(\"h1\");\nnewElement.textContent\
  \ = \"I exist entirely in your imagination.\";\nbodyElement.insertBefore(newElement,\
  \ h1Element.nextSibling);\n```\n\n请注意高亮的的行，然后查看图 33.3，该图说明了在我们的代码运行之前和之后的情况。\n\n\
  ![images](img/33fig03.jpg)\n\n图 33.3\n\n我们可以用来模拟 `insertAfter` 行为的技巧\n\n`h1Element.nextSibling`\
  \ 调用找到了 `script` 元素。将我们的 `newElement` 插入到 `script` 元素之前，就实现了将元素插入到 `h1` 元素之后的目标。如果没有对应的目标兄弟元素怎么办？嗯，在这种情况下，`insertBefore`\
  \ 函数非常聪明，它会自动将你想插入的元素添加到末尾。\n\n向父元素添加子元素的一种更通用的方法是意识到父元素将 `children` 视为类似数组的条目。要访问这个子元素数组，我们拥有\
  \ `children` 和 `childNodes` 属性。`children` 属性只返回 HTML 元素，而 `childNodes` 属性返回更通用的节点，代表了许多我们不关心的内容。是的，我知道我在重复，但你可以查看第\
  \ 32 章“遍历 DOM”，以了解更多定位元素的方法。\n\n### 移除元素\n\n我记得某个聪明的人曾这样说过：“拥有创建的能力，也拥有移除的能力。”在上一节中，我们学习了如何使用\
  \ `createElement` 方法来创建元素。在本节中，我们将查看 `removeChild`，尽管它的名字听起来不太雅，但它的核心功能就是移除元素。\n\
  \n看下面的代码片段，它可以与我们一直在观察的示例配合工作：\n\n点击此处查看代码图片\n\n```\nlet newElement = document.createElement(\"\
  p\");\nlet bodyElement = document.querySelector(\"body\");\nlet h1Element = document.querySelector(\"\
  h1\");\nnewElement.textContent = \"I exist entirely in your imagination.\";\nbodyElement.appendChild(newElement);\n\
  bodyElement.removeChild(newElement);\n```\n\n由 `newElement` 存储的 `p` 元素通过 `appendChild`\
  \ 方法被添加到我们的 `body` 元素中。我们之前见过。要移除此元素，我们在 `body` 元素上调用 `removeChild`，并传入我们想要移除的元素的指针。该元素自然是\
  \ `newElement`。一旦 `removeChild` 运行，就像你的 DOM 从未感知过 `newElement` 的存在一样。\n\n需要注意的主点是，我们需要从想要移除的元素的父元素上调用\
  \ `removeChild`。该方法不会在我们的 DOM 中上下遍历以寻找我们想要移除的元素。现在，假设我们无法直接访问它的父元素。我们仍然可以通过 `parentNode`\
  \ 属性来移除该元素：\n\n```javascript\nlet newElement = document.createElement(\"p\");\n\
  let bodyElement = document.querySelector(\"body\");\nlet h1Element = document.querySelector(\"\
  h1\");\nnewElement.textContent = \"I exist entirely in your imagination.\";\nbodyElement.appendChild(newElement);\n\
  newElement.parentNode.removeChild(newElement);\n```\n\n现在，有一种更新、更漂亮且更好的移除元素的方法。在这种情况下，我们只需在想要移除的元素上调用\
  \ `remove` 方法。这个示例如下：\n\n```javascript\nlet newElement = document.createElement(\"\
  p\");\nlet bodyElement = document.querySelector(\"body\");\nlet h1Element = document.querySelector(\"\
  h1\");\nnewElement.textContent = \"I exist entirely in your imagination.\";\nbodyElement.appendChild(newElement);\n\
  newElement.remove();\n```\n\n现在，为什么我不以 `remove` 方法开始和结束移除元素的讨论呢？这与浏览器支持有关。这种方法仍然很新，所以\
  \ Internet Explorer 等旧浏览器不支持它。如果支持 Internet Explorer 对你来说，我们过的其他方法是有效的。\n\n### 克隆元素\n\
  \n这一章随着内容的深入变得越来越诡异，但幸运的是我们到了最后一节。最后一种我们需要注意的 DOM 操作技术是关于克隆元素的，即我们从一个元素开始创建其完全相同的副本：\n\
  \n![images](img/33UN04.jpg)\n\n通过在想要克隆的元素上调用 `cloneNode` 函数来克隆元素，并提供 `true` 或 `false`\
  \ 参数来指定我们只想克隆元素本身还是克隆元素及其所有子元素。这是克隆元素（并将其添加到 DOM）的代码片段所示：\n\n点击此处查看代码图片\n\n\n\n\n\
  ```javascript\nlet bodyElement = document.querySelector(\"body\");\n\nlet item =\
  \ document.querySelector(\"h1\");\n\nlet clonedItem = item.cloneNode(false);\n\n\
  // add cloned element to the DOM\n\nbodyElement.appendChild(clonedItem);\n```\n\n\
  一旦我们的`cloned elements` 被添加到 DOM 中，我们就可以使用学过的所有技巧来修改它们。克隆元素对于我们来说是一项非常重要的事情，让我们跳出这段片段，来看一个更完整的示例：\n\
  \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Cloning Elements</title>\n\
  \  <style>\n    body {\n      background-color: #60543A;\n      padding: 30px;\n\
  \    }\n    h1 {\n      color: #F2D492;\n      font-size: 72px;\n      font-family:\
  \ sans-serif;\n      text-decoration: underline;\n    }\n    p {\n      color: #F2D492;\n\
  \      font-family: sans-serif;\n      font-size: 36px;\n      font-weight: bold;\n\
  \    }\n  </style>\n</head>\n<body>\n  <h1>Am I real?</h1>\n  <p class=\"message\"\
  >I exist entirely in your imagination.</p>\n  <script>\n    let bodyElement = document.querySelector(\"\
  body\");\n    let textElement = document.querySelector(\".message\");\n    setInterval(sayWhat,\
  \ 1000);\n    function sayWhat() {\n      let clonedText = textElement.cloneNode(true);\n\
  \      bodyElement.appendChild(clonedText);\n    }\n  </script>\n</body>\n</html>\n\
  ```\n\n如果你将所有这些代码放入一个 HTML 文档并在浏览器中预览，你将看到与我们之前的示例相似的内容：\n\n![images](img/33UN05.jpg)\n\
  \n但是，几秒钟之后，你会发现这个示例非常不同。消息在不断重复：\n\n![images](img/33UN06.jpg)\n\n这里发生这一切的秘密在于我们的代码。让我们回到\
  \ `<script>` 标签内部的代码，花点时间理解一下发生了什么：\n\n点击此处查看代码图片\n\n```javascript\nlet bodyElement\
  \ = document.querySelector(\"body\");\nlet textElement = document.querySelector(\"\
  .message\");\n```\n\n在顶部，我们有一个 `bodyElement` 变量，它引用 HTML 中的 `body` 元素。同样，我们有一个 `textElement`\
  \ 变量，它引用类值为 `message` 的 `p` 元素。这里没什么特殊的。\n\n现在，有趣的地方在这里。我们有一个 `setInterval` 定时器函数，它每\
  \ 1000 毫秒（1 秒）调用一次 `sayWhat` 函数：\n\n```javascript\nsetInterval(sayWhat, 1000);\n\
  ```\n\n实际的克隆发生在这个 `sayWhat` 函数内部：\n\n点击此处查看代码图片\n\n```javascript\nfunction sayWhat()\
  \ {\n  let clonedText = textElement.cloneNode(true);\n  bodyElement.appendChild(clonedText);\n\
  }\n```\n\n我们在 `textElement` 上调用了 `cloneNode`。我们做的结果是创建了 `textElement` 的副本，并将其存储在\
  \ `clonedText` 变量中。最后一步是将新克隆的元素添加到 DOM 中以便显示出来。得益于我们的 `setInterval`，`sayWhat` 下的所有代码都会重复执行，不断向页面上添加我们的克隆元素。\n\
  \n你可能已经注意到的一点是，我们克隆的是以下段落元素：\n\n点击此处查看代码图片\n\n```html\n<p class=\"message\">I exist\
  \ entirely in your imagination.</p>\n```\n\n我们在代码中指定的是以下：\n\n点击此处查看代码图片\n\n```javascript\n\
  let clonedText = textElement.cloneNode(true);\n```\n\n我们带有 `true` 标志调用 `cloneNode`，表示我们也想克隆所有的子节点。为什么要呢？我们的段落元素似乎没有任何子元素，对吧？嗯，这就是*元素（elements）*和*节点（nodes）*之间区别的地方。我们的段落标签没有任何子*元素*，但被\
  \ `p` 标签包裹的文本是一个子*节点*。当你自己在克隆某些东西并发现当你指定不克隆子节点时并没有完全得到你想要的结果时，记住这一点是非常重要的。\n\n#\
  \ 34\n\n## 快速向 DOM 中添加大量元素\n\n## 本章内容\n\n*   学习如何高效地向 DOM 添加大量元素\n*   学习使用 `DocumentFragment`\
  \ 和 `innerHTML 方案` 来修改我们的 DOM\n\n操作 DOM 的一个重要部分是学习如何获取大量数据并将其转化为屏幕上看到的视觉效果。这种由数据驱动我们看到的内容通用方法是一种常见模式，特别是随着我们的应用程序变得越来越动态。让我们以\
  \ Netflix 为例，如图 34.1 所示。\n\n![images](img/33UN05.jpg)\n\n### 通用方法\n\n在上一章中，我们学习了如何使用\
  \ JavaScript 创建和显示元素。许多技巧仍然适用于这里，不同之处在于我们为创建和显示大量的元素进行优化。在处理此类数量时，只需要额外注意一个细节：为了获得最高性能，无论是添加一个元素还是百万个元素，都请一次性完成所有的\
  \ DOM 更新。有了这个格言，现在是学习具体如何实现它了。\n\n### 示例\n\n在我们深入有趣的技术细节之前，来看一个很好地捕捉了我们尝试做的示例：[`bit.ly/addManyElements`](https://bit.ly/addManyElements)。\n\
  \n现在，如果你访问该页面，你将看到如下所示：\n\n![images](img/33UN05.jpg)\n\n找到 **Generate** 按钮并点击它。当你点击时，我们有一段代码会动态创建\
  \ 1000 个元素并将它们添加到 DOM 中：\n\n![images](img/33UN06.jpg)\n\n### 开始\n\n在接下来的章节中，我们将查看用于向\
  \ DOM 动态添加元素的技巧，就像之前的示例一样。如果你想跟着练习，请创建一个新文档并在其中添加以下内容：\n\n点击此处查看代码图片\n\n\n\n\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>添加元素</title>\n\
  \  <style>\n    body {\n      display: grid;\n      place-content: center;\n   \
