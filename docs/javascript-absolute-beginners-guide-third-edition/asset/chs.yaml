  click\", generateContent, false);\n    function generateContent(e) {\n      // 代码写在这里！\n\
  \    }\n  </script>\n</body>\n</html>\n```\n\n花点时间看看所有这些 HTML、CSS 和 JS 的作用。这里包含了一些基础的\
