  \n### innerHTML 方法\n\n让我们从向 DOM 中添加大量元素的最简单、最快的方法开始。这种方法通过设置一个 DOM 元素的 `innerHTML`\
  \ 属性，将我们想要添加的*所有*内容以字符串的形式设置进去。如果你正在跟着一起操作，请将 `generateContent` 的内容替换为以下内容：\n\n\
  点击此处查看代码图像\n\n```javascript\nfunction generateContent(e) {\n  let htmlToAdd = \"\
  \";\n  let numberOfItems = 1000;\n  for (let i = 0; i < numberOfItems; i++) {\n\
  \    let num = Math.random() * 10000;\n    let emoji = emojis[Math.floor(Math.random()\
  \ * emojis.length)];\n    htmlToAdd += `<div class=\"item\"><p>${emoji} ${num}</p></div>`;\n\
  \  }\n  container.innerHTML = htmlToAdd;\n}\n```\n\n花点时间看看我们正在做什么。我们有一个运行 1000 次的循环，对应于我们想要添加的元素数量。在循环内部，我们正在生成想要添加到\
  \ DOM 中的 HTML。我们通过将 HTML 字符串并进行拼接来生成要添加到 DOM 的 HTML。点击此处查看代码图像\n\n```javascript\n\
  function generateContent(e) {\n  let htmlToAdd = \"\";\n  let numberOfItems = 1000;\n\
  \  for (let i = 0; i < numberOfItems; i++) {\n    let num = Math.random() * 10000;\n\
  \    let emoji = emojis[Math.floor(Math.random() * emojis.length)];\n    htmlToAdd\
  \ += `<div class=\"item\"><p>${emoji} ${num}</p></div>`;\n  }\n  container.innerHTML\
  \ = htmlToAdd;\n}\n```\n\n看看我们在做什么。最后一行 `htmlToAdd` 被赋值给 `container`。这种方法非常简单。当最后一行运行时，它非常强大。\n\
  \n```javascript\nfunction generateContent(e) {\n  let htmlToAdd = \"\";\n  let numberOfItems\
  \ = 1000;\n  for (let i = 0; i < numberOfItems; i++) {\n    let num = Math.random()\
  \ * 10000;\n    let emoji = emojis[Math.floor(Math.random() * emojis.length)];\n\
  \    htmlToAdd += `<div class=\"item\"><p>${emoji} ${num}</p></div>`;\n  }\n  container.innerHTML\
  \ = htmlToAdd;\n}\n```\n\n我们是如何想到这种结构的？有几种方法可以实现这一点。当使用字符串时，这种方法是精细的。\n\n我们是如何想到这种结构的？有几种方法可以实现这一点。当使用字符串时，这种方法是精细的。\n\
  \n我们是如何想到这种结构的？有几种方法可以实现这一点。当使用字符串时，这种方法是精细的。\n\n\n\n\n\n通过使用这种临时的 HTML 结构，我们可以快速进行更改并查看结果。我们甚至可以使用浏览器内置的\
  \ DOM 工具来实时编辑 HTML 和 CSS。一旦我们对最终结果满意，就可以将此 HTML 转换为一种不那么灵活但更便于 JavaScript 的方式，以便使用我们的实际数据让其活跃起来。\n\
  \n在上一节中，我们用于将数据映射到真实 HTML 元素的方法是将相关的 HTML 转换为字符串。在下一节中，我们将介绍一种更传统的、面向 DOM 的从数据到\
  \ HTML 的处理方法。\n\n## DocumentFragment 方法\n\n我们将看到的下种方法是：创建一个虚拟的 DOM 元素，在其上进行所有的 DOM\
  \ 修改，然后在准备好提交时将该虚拟 DOM 元素赋值给真实的 DOM。得益于 `DocumentFragment` 对象，操作虚拟 DOM 元素才成为可能，以下是修改我们的\
  \ `generateContent` 方法以使用它的方式：\n\n点击此处查看代码图片\n\n```javascript\nfunction generateContent(e)\
  \ {\n  let fragment = new DocumentFragment();\n  let numberOfItems = 1000;\n  for\
  \ (let i = 0; i < numberOfItems; i++) {\n    let num = Math.random() * 10000;\n\
  \    let emoji = emojis[Math.floor(Math.random() * emojis.length)];\n    let divElement\
  \ = document.createElement(\"div\");\n    divElement.classList.add(\"item\");\n\
  \    let pElement = document.createElement(\"p\");\n    pElement.innerText = `${emoji}\
  \ ${num}`;\n    divElement.appendChild(pElement);\n    fragment.appendChild(divElement);\n\
  \  }\n  container.appendChild(fragment);\n}\n```\n\n我们的 `fragment` 变量存储了对 `DocumentFragment`\
  \ 对象的引用，我们可以对待任何其他 DOM 元素一样对待它。记住，我们的目标是为每个项目生成如下所示的 HTML：\n\n点击此处查看代码图片\n\n```html\n\
  <div class=\"item\"><p> 47.5121104</p></div>\n```\n\n由于我们在这里处理的是 DOM 元素，因此我们使用经过实践检验的\
  \ DOM 方法，如 `createElement`、`appendChild` 和 `classList` 来生成我们的 HTML 结构并构建我们的 DOM\
  \ 子树。\n\n现在，之前我提到过，确保快速添加 DOM 元素的方法是只进行一次所有的 DOM 更新。我们在这个示例中看到的似乎与此相反，因为我们在循环的每次迭代中都在创建并追加\
  \ DOM 元素：\n\n点击此处查看代码图片\n\n```javascript\nfunction generateContent(e) {\n  let fragment\
  \ = new DocumentFragment();\n  let numberOfItems = 1000;\n  for (let i = 0; i <\
  \ numberOfItems; i++) {\n    let num = Math.random() * 10000;\n    let emoji = emojis[Math.floor(Math.random()\
  \ * emojis.length)];\n    let divElement = document.createElement(\"div\");\n  \
  \  divElement.classList.add(\"item\");\n    let pElement = document.createElement(\"\
  p\");\n    pElement.innerText = `${emoji} ${num}`;\n    divElement.appendChild(pElement);\n\
  \    fragment.appendChild(divElement);\n  }\n  container.appendChild(fragment);\n\
  }\n```\n\n需要注意的细节是，我们的 `DocumentFragment` 不是典型的 DOM 元素。它没有关联到任何屏幕上的视觉元素，因此它是一个虚拟元素，在我们更改其结构时，任何样式或布局都不会被修改。我们甚至看不到它！将\
  \ `DocumentFragment` 想象成一个不可虚拟容器，它为我们提供了普通 DOM 元素提供的所有方便辅助方法和功能，而无需实际创建一个新的 DOM\
  \ 元素。我们正在进行的所有 DOM 操作如果在我们的实时 DOM 树上执行通常是非常昂贵的，但在这里并不适用。\n\n一旦我们完成了 DOM 子树的构建，就是时候将更改提交到\
  \ DOM，并将所有数据映射到 HTML 元素的结果可视化了。这一步我们在循环结束后只执行一次，由 fragment 存储的巨大 DOM 子树会被追加到我们的容器元素中：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction generateContent(e) {\n  let fragment = new\
  \ DocumentFragment();\n  let numberOfItems = 1000;\n  for (let i = 0; i < numberOfItems;\
  \ i++) {\n    let num = Math.random() * 10000;\n    let emoji = emojis[Math.floor(Math.random()\
  \ * emojis.length)];\n    let divElement = document.createElement(\"div\");\n  \
  \  divElement.classList.add(\"item\");\n    let pElement = document.createElement(\"\
  p\");\n    pElement.innerText = `${emoji} ${num}`;\n    divElement.appendChild(pElement);\n\
  \    fragment.appendChild(divElement);\n  }\n  container.appendChild(fragment);\n\
  }\n```\n\n为了进一步强调我们 `DocumentFragment` 的不可见性和虚拟本质，当我们将 `DocumentFragment` 追加到另一个\
  \ DOM 元素时，`DocumentFragment` 就会消失。因为它充当了临时容器帮助我们构建 DOM 子树，只有 `DocumentFragment`\
  \ 的内容存了下来并成为了父元素的一部分。如果我们检查容器元素的内容，将看不到任何关于我们 `DocumentFragment` 的证据。\n\n为了展示这一点，我们如下：\n\
  \n我们花费了大量时间研究如何向 DOM 添加大量元素。那么相反，如果我们想要移除大量元素呢？移除元素要简单得多，因为我们想要的只是清空整个 DOM 子树。最简单的方法是依靠\
  \ `replaceChildren` 方法。\n\n如果我们想清空容器元素的所有内容，做法如下：\n\n```javascript\ncontainer.replaceChildren();\n\
  ```\n\n全部就是这样。这种方法实际上适用于我们目前的示例中。每当我们点击“生成”按钮时，我们都不希望每次都添加一千个元素。我们希望在添加新元素之前清空当前的\
  \ DOM 元素。变化是将前面的行添加到 `generateContent` 函数的顶部，如下：\n\n点击此处查看代码图片\n\n```javascript\n\
  function generateContent(e) {\n  container.replaceChildren();\n  let htmlToAdd =\
  \ \"\";\n  let numberOfItems = 1000;\n  for (let i = 0; i < numberOfItems; i++)\
  \ {\n    let num = Math.random() * 10000;\n    let emoji = emojis[Math.floor(Math.random()\
  \ * emojis.length)];\n    htmlToAdd += `<div class=\"item\"><p>${emoji} ${num}</p></div>`;\n\
  \  }\n  container.innerHTML = htmlToAdd;\n}\n```\n\n[/content] (抱歉，由于您提供的待翻译文本末尾似乎包含了重复的示例内容或不完整，我已根据您提供的最后一段逻辑进行了翻译)\n\
  \n*纠正：由于您提供的“需要翻译的文本”部分似乎在结尾处截断或包含了重复的示例逻辑，我针对您提供的最后一段 Markdown 结构进行了精准翻译。*\n\n\
  **重新针对您提供的最后一段文本进行翻译：**\n\n[content]\n\n## 35\n\n## 浏览器开发者工具\n\n## 本章\n\n*   学习浏览器开发者工具如何为您节省大量时间\n\
  *   熟悉 Chrome 开发者工具提供的提供的功能\n\n\n\n\n所有主流浏览器——Google Chrome、Apple Safari、Mozilla\
  \ Firefox 和 Microsoft Edge（以前称为 Internet Explorer）——的功能不仅仅是显示网页。对于开发者来说，它们提供了许多酷炫的功能，可以帮助你找出正在显示的网页到底发生了什么。它们通过我通统称为`开发者工具`的工具来实现这一切。这些工具是内置在浏览器中的，它们让你能够以许多非常精妙且有趣的方式来调优你的\
  \ `HTML`、`CSS` 和 `JavaScript`。\n\n在本章中，让我们来看看这些开发者工具，并学习如何使用它们来让生活变得更轻松。\n\n## 认识开发者工具\n\
  \n让我们从最开始起。当你导航到一个网页时，浏览器会加载它被告知加载的任何文档：\n\n![images](img/35UN01.jpg)\n\n这对于你来说应该非常熟悉，因为浏览器的部分功能自\
  \ 19 世纪（或者大概那时）第一款浏览器发布以来一直没有发生太大变化……在使用 `Chrome` 时，在 Mac 上按下 `command+option+I`，或者在\
  \ Windows 上按下 `F12` 键（或 `Ctrl+Shift+I`）。\n\n注意发生了什么。虽然你可能不会听到天籁般的音乐伴随着大地轰鸣和激光束划过天空，但你会看到浏览器的布局发生了变化，在屏幕（通常）底部或右侧显示某些神秘的内容，如图图\
  \ 35.1\n\n图 35.1\n\n显示了开发者工具的浏览器\n\n你的浏览器将分成两部分。一部分是浏览器处理显示网页的地方。我们很喜欢这个家伙，而且已经认识他很长时间了。另一部分是那个我们从远处怀疑地观察的新家伙，它为你提供了关于当前显示页的信息，这些信息只有像你这样的开发者才能拥有。这个这就是广为人知的开发者工具。\n\
  \n开发者工具为你提供了执行以下操作的能力：\n\n*   检查 `DOM`\n*   调试 `JavaScript`\n*   通过 `console` 检查对象并查看消息\n\
  *   找出性能和内存问题\n*   查看网络流量\n*   以及更多功能！\n\n考虑到时间关系（*游戏权力王*很快就要开始了，我相信这一集是奈德·史塔克变身为一条狼复活的时候），我将专注于与你在此书中学习的内容直接相关的前三项。\n\
  \n### 检查 DOM\n\n我们将查看的第一个开发者工具功能是你可以如何检查甚至操纵你的 `DOM` 内容。启动 `Chrome` 后，导航到 `[`bit.ly/kirupaDevTool`](http://bit.ly/kirupaDevTool)`。\n\
  \n对于我们的示例，使用“查看源代码”（View Source）将导致如下结果：\n\n点击此处查看代码图像\n\n```\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <title>Random Color Generator!</title>\n  <style>\n    h2 {\n\
  \      font-family: Arial, Helvetica;\n      font-size: 100px;\n      color: #FFF;\n\
  \      text-shadow: 0px 0px 11px #333333;\n      margin: 0;\n      padding: 30px;\n\
  \    }\n  </style>\n</head>\n<body>\n  <h2>Random\n    <br />Color\n    <br />Generator</header>\n\
  \  <script src=\"js/randomColor.js\"> </script>\n  <script>\n    let bodyElement\
  \ = document.querySelector(\"body\");\n    bodyElement.style.backgroundColor = getRandomColor();\n\
  \  </script>\n</body>\n</html>\n```\n\n“查看源代码”命令只是为我们提供了存储在 `HTML` 页面中的标记视图。另一种说法是，“查看源代码”为我们提供了一个存在于服务器上的标记的（过时的）版本，而不是\
  \ `DOM` 的版本。\n\n如果你使用开发者工具的 `DOM` 视图，你将看到一个基于`页面实时版本`的我们文档的`DOM 节点表示`：\n\n点击此处查看代码图像\n\
  \n```\n <!DOCTYPE html>\n<html>\n<head>\n   <title>Random Color Generator!</title>\n\
  \   <style>\n     h2 {\n       font-family: Arial, Helvetica;\n       font-size:\
  \ 100px;\n       color: #FFF;\n       text-shadow: 0px 0px 11px #333333;\n     \
  \  margin: 0;\n       padding: 30px;\n    }\n  </style>\n <body style=\"background-color:\
  \ rgb(75, 63, 101);\">                                     \n   <h2>Random\n   \
  \  <br>Color\n     <br>Generator</header>\n   <script src=\"js/randomColor.js\"\
  > </script>\n   <script>\n     let bodyElement = document.querySelector(\"body\"\
  );\n     bodyElement.style.backgroundColor = getRandomColor();\n   </script>\n </body>\n\
  </html>\n```\n\n如果你仔细观察，你会注意到某些元素显示方式上细微的差异。这两个视图之间的差异源于 `DOM` 所代表的内容。“查看源代码”只是为我们提供了一个存在于服务器上的标记的（过时的）版本，它并不包含页面的活力。\n\
  \n### 调试 JavaScript\n\n继续下去，开发者工具带来的另一个大优势是**可调试性**（debuggability）。我不知道这是否真的是一个词，但开发者工具允许你对代码进行点拨和测试，以找出哪里出了问题。所有这些操作的统称被称为**调试**（debugging）。\n\
  \n在你的开发者工具中，点击 **Sources**（源代码）选项卡：\n\n![images](img/35UN05.jpg)\n\n**Sources**\
  \ 选项卡让你访问文档当前正在使用的所有文件。正如其名称所示，你正在查看这些文件的原始内容——而不是之前那个你最好的那个 DOM 生成版本。\n\n\n\n完成这些操作后，你会看到\
  \ `21` 行被高亮显示：\n\n![images](img/35UN06.jpg)\n\n此时，已经设置了一个断点。下一步是让你的浏览器实际上运行到这个断点处。这有一个更温和的说法叫做“命中断点”。命中断点的方法是确保你的代码运行到了那里。在我们的案例中，我们只需要按\
  \ `F5` 刷新页面即可，因为第 21 行将作为页面加载的一部分，并在执行 `<script>` 标签内的所有内容时运行。\n\n如果一切进展如预期，你将看到页面加载并突然停止，第\
  \ 21 行被高亮显示：\n\n![images](img/35UN07.jpg)\n\n你现在正处于**调试模式**。你在第 21 行设置的断点已被命中。这意味着当浏览器命中断点的一瞬间，你的整个页面就戛然而止了。此时，由于你的浏览器处于悬挂状态，你就有能力对页面上发生的一切切进行操纵。把这想象成时间停止了，只有你拥有移动、检查和更改周围环境的能力。如果还没有人拍过关于这个主题的电影，那应该有人去做了！\n\
  \n在此模式下，回到第 21 行，并将鼠标悬停在 `bodyElement` 变量上。当你悬停其上，你会看到一个提示框，指示该特定对象所包含的各种属性和值：\n\
  \n![images](img/35UN08.jpg)\n\n然后你可以与提示框交互，滚动所有的对象，甚至深入挖掘内部包含更多对象的复杂对象。由于 `bodyElement`\
  \ 基本上是 `body` 元素的 JavaScript/DOM 表示，我们将看到许多在几章前通过查看 `HTMLElement` 时间接遇到过的属性。\n\n\
  在源代码视图的右侧，我们还有更多角度可以检查代码：\n\n![images](img/35UN09.jpg)\n\n我不会解释所有这些分类的作用，但我指出这个区域是为了让你知道，如果你想看的话，你有能力以更详尽的细节检查所有\
  \ JavaScript 变量和对象的当前状态。\n\n断点提供的另一个巨大优势是，你可以像浏览器那样逐行执行你的代码。现在，我们停在了第 21 行。要逐行执行代码，请点击屏幕右侧的**进入函数调用**（Step\
  \ into function call）按钮：\n\n![images](img/35UN10.jpg)\n\n记住，这是你目前中断所在的代码行：\n\n点击此处查看代码图像\n\
  \n```\nbodyElement.style.backgroundColor = getRandomColor();\n```\n\n点击该按钮后，注意观察发生了什么。你会发现自己进入了\
  \ `randomColor.js`，那里定义了 `getRandomColor` 函数。继续点击**进入函数调用**以继续逐行进入你的代码，并遍历 `getRandomColor`\
  \ 函数的每一行。注意，现在当你逐行移动并顺序执行代码时，你可以看到浏览器内存中的对象是如何更新的。如果你厌倦了这种操作，可以通过点击**跳出当前函数**（Step\
  \ out of current function）按钮（位于你的**进入**按钮右侧）来“向后退”，这会让你退出该函数。在我们的案例中，就是回到了 `randomColorGenerator.htm`\
  \ 中的第 21 行。\n\n如果你只想运行应用而不再逐行执行代码，请点击位于**进入**按钮左侧几个像素处的**播放**（Play）按钮：\n\n![images](img/35UN11.jpg)\n\
  \n点击**播放**后，你的代码将执行。如果你恰好在代码路径的某处设置了另一个断点，该断点也会被命中。在任何断点处停止时，你可以选择进入、跳出，或直接通过**播放**恢复执行。由于我们只设置了一个断点，点击**播放**将运行代码到完成，并让你的随机颜色作为\
  \ `body` 元素的背景出现：\n\n![images](img/35UN12.jpg)\n\n要移除断点，只需点击你设置断点的行号。如果你再次点击 21\
  \ 标签，断点将切换为关闭，你可以直接运行应用程序而无需进入调试模式。\n\n所以，情况就是这样。这是一场关于如何使用你我所拥有的某些调试功能的快速风暴之旅。为了重申我在本章开头提到的某一点，我仅仅触及了可能性的冰角。\n\
  \n### 认识控制台\n\n我们将查看的另一个、**另一个**巨大的调试工具功能是使用所谓的**控制台**（Console）。在我们之前查看它时已经见过很多控制台的运行了，所以为了完整性，我在这里重复一些信息，但也会更深入一点。正如我们所知，控制台为我们提供了执行几操作的能力。它允许我们看到代码记录的消息。它还允许我们传递命令并检查当前在作用域内的任何对象。\n\
  \n要显示控制台，点击（或轻触）它导航到**控制台**（Console）选项卡：\n\n![images](img/35UN13.jpg)\n\n不要害怕眼前的这片空白。相反，拥抱自由和新鲜空气吧。\n\
  \n总之，控制台为我们提供了检查或调用应用程序当前运行的任何作用域内存在的对象的能力。在没有设置断点的情况下，启动控制台让我们处于全局状态。\n\n### 检查对象\n\
  \n在你光标所在的位置，输入 `window` 并按回车：\n\n![images](img/35UN14.jpg)\n\n你将看到 `window` 中所有内容的交互列表。你可以开始输入任何有效对象或属性，如果它在作用域内，你就可以访问它、检查它的值，甚至执行它：\n\
  \n![images](img/35UN15.jpg)\n\n这绝不是一个只读游场。我们可以引发各种混乱。例如，如果你输入 `document.body.remove()`\
  \ 并按回车，你的整个文档将消失。如果你真的删除了主体，只需刷新页面即可恢复之前的状态。开发者工具主要在内存表示上工作，不会写回源码。\n\n### 记录消息\n\
  \n我们几乎完成了所有这些“开发者工具”事务。我们最后查看的是控制台记录消息的能力。我们在第 11 章中详细查看过它，所以这里我保持简短，但也会稍微进一步。记得我们在之前的章节中这样做吗？\n\
  \n```\nfunction doesThisWork() {\n  alert(\"It works!!!\");\n}\n```\n\n在这里我们使用 `alert`\
  \ 语句打印某些值或证明代码正在执行。嗯，现在我们可以停止这样做。通过使用控制台，我们有一种更不烦人的消息打印方式，无需通过对话框中断一切。你可以使用 `console.log`\
  \ 函数传递任何你想打印到控制台的内容：\n\n```javascript\nfunction doesThisWork() {\n  console.log(\"\
  It works!!!\")\n}\n```\n\n当这段代码执行时，打开控制台，你会看到你记录的内容打印在上面：\n\n![images](img/35UN16.jpg)\n\
  \n出于调试目的，使用控制台在几乎每个方面都优于使用 `alert`。\n\n# 第四部分：处理事件\n\n## 36：事件\n\n## 本章内容\n\n* 理解你与应用之间是如何通信的\n\
  * 学习事件\n* 使用事件参数更好地处理事件相关的场景\n\n如果你还没有注意到，大多数应用程序和网站在被闲置时是非常无聊的。它们带着巨大的张势和干劲启动，但如果我们不与它们互动，它们带来的兴奋感很快就会消失：\n\
  \n![images](img/36UN01.jpg)\n\n\n\n\n其原因很简单：我们的应用程序存在是为了对我们对它们所的操作做出反应。当我们启动它们时，它们有一些内置的动力来让自己“下床”并准备好开始的一天。之后它们所做的一切很大程度上取决于我们告诉它们要做什么。这正是事情变得非常有趣的地方。\n\
  \n我们通过让应用程序对所谓的事件做出反应来告诉它们应该做什么。在本章中，我们将初步介绍什么是事件以及我们如何使用它们。\n\n## 什么是事件？\n\n从高层上来说，我们创建的所有内容都可以可以通过语句进行建模：\n\
  \n![images](img/36UN02.jpg)\n\n我们可以用无数种不同的方式来填充该语句中的空白。第一个空白处是指一个发生的事情。第二个空白处描述对该事件的反应。以下是该语句填充后的一些示例：\n\
  \n![images](img/36UN03.jpg)\n\n这个通用模型适用于我们一起编写的所有代码。这个模型也适用于我们喜爱的开发者/设计师朋友为他们的应用程序编写的所有代码。没有办法逃避这个模型，因此反抗也没有意义。相反，我们需要学会拥抱这个模型的角————那个非常有才华、被称为`event`的小家伙。\n\
  \n事件无非是一个信号。它传达了刚刚发生了某些事情。这件事情可能是鼠标点击。可能是键盘上的按键按下。可能是我们的窗口调整大小。它可能仅仅是我们的文档被加载。需要记住的是，我们的信号可以是\
  \ JavaScript 语言内置的成百上千种事情中的一种——也可以是我们为了应用专门创建的自定义“事情”。\n\n回到我们的模型，事件构成了第一部分：\n\n\
  ![images](img/36UN04.jpg)\n\n事件定义了发生的事情。它触发信号。模型的后半部分由对事件的反应定义：\n\n![images](img/36UN05.jpg)\n\
  \n毕竟，如果某个地方没有人在等待它并采取适当的行动，信号又有什么用处呢？！好了，现在我们已经对什么是事件有了高层面的概述，让我们深入研究事件是如何在名为 JavaScript\
  \ 的自然保护区中存在的。\n\n## 事件与 JavaScript\n\n鉴于事件的重要性，你可能并不会感到意外，JavaScript 为我们处理事件提供了许多极佳的支持。为了处理事件，我们主要需要做两件事：\n\
  \n1. 监听事件。\n2. 对事件做出反应。\n\n这两个步骤看起来非常简单，但永远不要忘记我们在这里处理的是 JavaScript。这种简单只是为了掩盖如果我们走错一步时\
  \ JavaScript 将带给我们深层痛苦的烟雾弹。也许我在这里有些戏剧化了，但我们很快就会发现。\n\n### 监听事件\n\n更直白地说一下我之前绕圈的话，我们在应用程序内部执行几乎所有操作都会导致事件的触发。有时，我们的应用程序会自动触发事件，例如加载时。有时，我们的应用程序会对我们实际与其交互做出反应触发事件。需要注意的是，无论我们是否想要让它们触发，我们的应用程序都会被事件不断轰。我们的任务是告诉应用程序只监听我们关心的事件。\n\
  \n监听正确事件这项不受感谢的工作完全由一个名为 `addEventListener` 的函数处理。该函数负责永远警惕，以便当有趣的事件触发时，它可以通知应用程序的另一个部分。\n\
  \n我们使用该函数的方式如下：\n\n点击此处查看代码图像\n\n```\nsource.addEventListener(eventName, eventHandler,\
  \ false);\n```\n\n这可能没什么帮助，所以让我们剖析一下该函数每个部分的含义。\n\n### 源 (The Source)\n\n我们通过想要监听事件的元素或对象来调用\
  \ `addEventListener`。通常，它将是一个 DOM 元素，但也可以是我们的 `document`、`window` 或任何专门设计用于触发事件的对象。\n\
  \n### 事件名称 (The Event Name)\n\n我们传递给 `addEventListener` 函数的第一个参数是我们感兴趣想要监听的事件名称。我们可以调用的完整事件列表庞大到无法在此处显示（请转到下一页：[`bit.ly/kirupaEventsList`](https://bit.ly/kirupaEventsList)），但你将遇到的一些常见事件如表\
  \ 36.1 所示。\n\n| 事件 | 事件触发的时机 |\n| :--- | :--- |\n| `click` | 当按下并释放主鼠标按钮、触控板等时。\
  \ |\n| `mousemove` | 每当你移动鼠标光标时。 |\n| `mouseover` | 当你将鼠标光标移动到元素上方时。这是你用于检测悬停（hover）的事件！\
  \ |\n| `mouseout` | 当你的鼠标光标移动到元素边界之外时。 |\n| `dblclick` | 当你快速点击两次时。 |\n| `DOMContentLoaded`\
  \ | 当你文档的 DOM 完全加载完成后。我们将在第 40 章中详细研究此事件。 |\n| `load` | 当你的整个文档（DOM、外部资源如图像、脚本等）完全加载完成时。\
  \ |\n| `keydown` | 当你按下键盘上的某个键时。 |\n| `keyup` | 当你停止按下键盘上的某个键时。 |\n| `scroll` |\
  \ 当发生滚动时。 |\n| `wheel` | 当你使用鼠标轮时。 |\n| `DOMMouseScroll` | 当元素被滚动时。 |\n\n**表 36.1**\
  \ 常见事件\n\n### 事件处理器 (The Event Handler)\n\n第二个参数要求我们指定一个在事件被触发时调用的函数。这个函数被亲切地称为事件处理器。我们将在后续章节中学习更多。\n\
  \n### 捕获还是不捕获？ (To Capture or Not to Capture)\n\n最后一个参数由 `true` 或 `false` 组成。为了完全理解该值的影响，我们将等到第\
  \ 37 章“JavaScript 中的冒泡与捕获,”这恰好是下一章，所以我们不用等。\n\n### 整合 (Putting It All Together)\n\
  \n现在我们已经看到了 `addEventListener` 函数以及它的样子，让我们通过该函数的完整示例将它们整合在一起：\n\n点击此处查看代码图像\n\n\
  ```\ndocument.addEventListener(\"click\", changeColor, false);\n```\n\n我们示例中的 `addEventListener`\
  \ 附加到 `document` 对象上。当 `click` 事件触发时，它会调用 `changeColor` 函数（即事件处理器）来对事件做出反应。这为下一节（关于对事件做出反应）做好了良好的准备。\n\
  \n\n\n\n我们将放置在事件处理程序中的任何代码，都会在 `addEventListener` 函数所关注的事件被监听到时执行。\n\n### 简单示例\n\
  \n要充分理解我们目前所学的内容，最好的方法是看到这一切内容完整地运行起来。为了跟上进度，请在 HTML 文档中添加以下标记和代码：\n\n点击此处查看代码图片\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>点击任何地方!</title>\n</head>\n<body>\n\
  \  <script>\n    document.addEventListener(\"click\", changeColor, false);\n   \
  \ function changeColor() {\n      document.body.style.backgroundColor = \"#FFC926\"\
  ;\n    }\n  </script>\n</body>\n</html>\n```\n\n如果我们在浏览器中预览该文档，最初我们只会看到一个空白页面，如图\
  \ 36.1 所示。\n\n![images](img/36fig01.jpg)\n图 36.1\n\n我们看到的只是一个空白页面！\n\n但是，当你点击页面上的任何地方时，情况就会发生变化。一旦你完成点击（即释放鼠标按键），页面的背景将从白色变为黄色（如果你看的是这本书的平装版，则是不同的灰色调！），如图\
  \ 36.2 所示。\n\n![images](img/36fig02.jpg)\n图 36.2\n\n点击时，我们的空白页面变黄了！\n\n这个示例之所以产生这种效果，原因在于我们的代码：\n\
  \n点击此处查看代码图片\n\n```\ndocument.addEventListener(\"click\", changeColor, false);\n\
  function changeColor() {\n  document.body.style.backgroundColor = \"#FFC926\";\n\
  }\n```\n\n`addEventListener` 调用与我们之前看到的完全相同，所以让我们跳过它。相反，让我们关注 `changeColor` 事件处理程序：\n\
  \n点击此处查看代码图片\n\n```\ndocument.addEventListener(\"click\", changeColor, false);\n\
  function changeColor() {\n  document.body.style.backgroundColor = \"#FFC926\";\n\
  }\n```\n\n当 `document` 上的 `click` 事件被监听到，此函数就会被调用。当此函数被调用时，它会将 `body` 元素的背景颜色设置为黄色。回到我们我们概括应用程序工作的方式，这个示例的看起来如下：\n\
  \n![images](img/36UN06.jpg)\n\n如果你完全理解了这些，那太棒了！你刚刚学习了你将遇到的最重要概念之一。我们还没有结束。我们让事件处理程序走得太容易了，所以让我们再去观察一次它。\n\
  \n### 事件参数和事件类型\n\n我们的事件处理程序不仅仅是在事件被监听器监听到时被调用。它还作为参数的一部分提供了对底层事件对象的访问。为了方便访问此事件对象，我们需要修改事件处理程序的签名以支持此参数。\n\
  \n这里有一个示例，我们指定 `event` 名称来引用我们的事件参数：\n\n点击此处查看代码图片\n\n```\nfunction myEventHandler(event)\
  \ {\n  // 事件处理内容\n}\n```\n\n此时，我们的事件处理程序仍然是一个普通的、无聊的函数。它恰好是一个接受一个参数的函数——事件参数！我们可以使用任何有效的标识符作为参数名，但我倾向于使用\
  \ `event` 或简单的 `e`，因为所有酷的人都这么做。在技术上，按照如下方式标识我们的事件并没有错误：\n\n点击此处查看代码图片\n\n```\nfunction\
  \ myEventHandler(isNyanCatReal) {\n  // 事件处理内容\n}\n```\n\n重要的细节是，事件参数指向一个事件对象，而该对象作为事件触发的一部分传递进的。我们关注这些看似典型且无聊发生是有原因的。这个事件对象包含了`与触发的事件相关的`属性。与由鼠标点击触发的事件、由按键按下、页面加载、动画等触发的事件相比，鼠标点击触发的事件将具有不同的属性。大多数事件都有我们所依赖的专门行为，而事件对象就是我们通往所有独性的窗口。\n\
  \n尽管我们可以获得各种事件和产生的事件对象，但某些属性是共有的。这种共性之所以能够实现，是因为所有事件对象都派生自基础的 `Event` 类型（技术上是一个接口\
  \ `Interface`）。我们将使用的来自 `Event` 类型的常用属性包括：\n\n* `currentTarget`\n* `target`\n* `preventDefault`\n\
  * `stopPropagation`\n* `type`\n\n为了完全理解这些属性的作用，我们需要对事件有更深入的理解。我们还没到那一步，只需知道这些属性存在即可。我们将在后续章节中很快看到它们。\n\
  \n## 37. 事件冒泡与捕获\n\n## 本章内容\n\n* 学习事件如何在 DOM 中进行传播\n* 理解事件捕获和事件冒泡的区别\n* 中断事件\n\n\
  在上一章中，你学习了如何使用 `addEventListener` 来监听你感兴趣的事件。上一章涵盖了基础，但忽略了关于事件如何实际触发的重要细节。事件并不是孤立的。\n\
  \n### 事件向下，事件向上\n\n为了帮助更好地理解事件及其生存方式，让我们在一个简单示例的语境下框化并讨论这一切。这里是我们要引用的 HTML：\n\n\
  点击此处查看代码图片\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>事件!</title>\n</head>\n\
  <body id=\"theBody\" class=\"item\">\n  <div id=\"one_a\" class=\"item\">\n    <div\
  \ id=\"two\" class=\"item\">\n      <div id=\"three_a\" class=\"item\">\n      \
  \  <button id=\"buttonOne\" class=\"item\">one</button>\n      </div>\n      <div\
  \ id=\"three_b\" class=\"item\">\n        <button id=\"buttonTwo\" class=\"item\"\
  >two</button>\n        <button id=\"buttonThree\" class=\"item\">three</button>\n\
  \      </div>\n    </div>\n  </div>\n  <div id=\"one_b\" class=\"item\">\n  </div>\n\
  \  <script>\n  </script>\n</body>\n</html>\n```\n\n如你所见，这里并没有特别有趣的。HTML 看起来非常直观（而不是变诡异且不断盯着手机），它的\
  \ DOM 表示也如图 37.1 所示。\n\n![images](img/37fig01.jpg)\n图 37.1\n\n标记的 DOM 视图\n\n这就是我们调查要开始的地方。假设我们点击了\
  \ `buttonOne` 元素。根据我们之前看到的，你知道一个 `click` 事件将被触发。我忽略的有趣部分是这个 `click` 事件究竟是从哪里触发的。你的点击事件（与每一个\
  \ JavaScript 事件一样）实际上并不是起源于你交互的元素。那样太简单了，也太合逻辑了。\n\n相反，事件从文档的根节点开始：\n\n![images](img/37UN01.jpg)\n\
  \n\n\n如图所示，我们的事件经历的路径是直接的，但它会厌烦地通知该路径上的每一个元素。这意味着如果我们对 `body`、`one_a`、`two` 或 `three_a`\
  \ 监听 `click` 事件，关联的事件处理器就会被触发。这是一个重要的细节，我们稍后会再次回顾。\n\n现在，一旦我们的事件到达目标，它并不会停止。就像某家电池公司标志性的精力充沛的兔子（它的注册商标我可能不能在这里提到），事件会一直继续进行，通过回溯它的步骤并返回根节点：\n\
  \n![images](img/37UN03.jpg)\n\n和之前一样，当事件向上移动时，沿事件路径的每一个元素都会被通知它的存在。\n\n## 认识各个阶段\n\
  \n需要注意的主要点之一是，在 DOM 的任何位置触发事件都并不重要。事件总是从根节点开始，向下移动直到遇到目标，然后向上返回根节点。整个旅程都有非常正式的定义，所以让我们来看看这些正式的定义。\n\
  \n你触发事件以及事件从根节点向下冲入 DOM 的部分被称为 `事件捕获阶段`：\n\n![images](img/37UN04.jpg)\n\n这个世界的初学者可能只会称之为\
  \ `Phase 1`，所以请注意，在现实生活中遇到的事件相关内容中，你会看到正式名称和阶段名称交替使用。接下来是 `Phase 2`，我们的事件泡泡回根节点：\n\
  \n![images](img/37UN05.jpg)\n\n这个阶段也被称为 `事件冒泡阶段`。事件“泡泡”回顶部！\n\n总之，事件路径上的所有元素都是挺幸运的。当事件被触发时，它们有幸能被通知两次。这在某种程度上可能会影响我们编写的代码，因为我们每次监听事件时，都会对想在哪个阶段监听事件做出选择。我们是在事件在捕获阶段笨拙地向下时监听它？还是在它在冒泡阶段爬回顶部时监听它？\n\
  \n选择阶段是一个非常微妙的细节，我们通过 `addEventListener` 调用中的 `true` 或 `false` 来指定它：\n\n点击此处查看代码图片\n\
  \n```\nitem.addEventListener(\"click\", doSomething, true);\n```\n\n如果你记得话，我在上一章中简单带过了\
  \ `addEventListener` 的第三个参数。这个第三个参数指定了你是否要在捕获阶段监听此事件。参数为 `true` 意味着你想在捕获阶段监听该事件。如果你指定\
  \ `false`，则意味着你想在冒泡阶段监听该事件。\n\n要跨越捕获和冒泡两个阶段监听事件，你只需执行以下操作：\n\n点击此处查看代码图片\n\n```\n\
  item.addEventListener(\"click\", doSomething, true);\n\nitem.addEventListener(\"\
  click\", doSomething, false);\n```\n\n我不知道你为什么会想这么做，但如果你真的这样做了，你现在知道需要做什么了。\n\n\
  ## 谁在乎呢？\n\n到这里，你可能在想为什么这一切都很重要。如果你已经愉快地处理了很长时间的事件，而且这是你第一次听到这些，那么这一点双倍真实。你选择在捕获阶段还是冒泡阶段监听事件，对你将要做的事情大多无关。你极少会发现自己在抓耳挠腮，因为你的事件监听和处理代码没有按预期工作，而是因为你在\
  \ `addEventListener` 调用中不小心指定了 `true` 而不是 `false`。\n\n话虽如此，你的人生中总会有需要需要了解并处理捕获或冒泡情况的时候。这种情况会悄悄溜袭你的代码，并导致你数小时痛苦的抓耳挠腮。多年来，这些情况是我必须意识地注意我正在观察事件生命周期中的哪个阶段：\n\
  \n*   在屏幕上拖动元素并确保拖拽仍然发生，即使我正在拖拽的元素滑出了光标范围。\n*   当我悬停在菜单上时显示子菜单的嵌套菜单。\n*   我在两个阶段上都有多个事件处理器，而我想专门关注捕获阶段或冒泡阶段的事件处理器。\n\
  *   第三方组件/控件库有它们自己的事件逻辑，而我想绕过它来实现我自己的自定义行为。\n*   我想覆盖某些内置/默认浏览器行为，例如当我点击滚动条或给文本框赋予焦点时。\n\
  \n在我近 105 年的 JavaScript 工作中，这五点是我能想到的全部。即使这也稍微偏向最近几年，因为各种浏览器对各个阶段的支持完全并不好。\n\n##\
  \ 事件中断\n\n在重看《哥斯拉》之前，我要谈的最后一件事是如何防止我们的事件传播。事件并不保证能过上充实的人生，即从根节点开始并结束于根节点。有时，防止我们的事件变得老而幸福实际上是符合所愿的。\n\
  \n要结束一个事件的生命，我们在 `Event` 对象上有一个 `stopPropagation` 方法：\n\n```\nfunction handleClick(e)\
  \ {\n\n  e.stopPropagation();\n}\n```\n\n正如其名所示，`stopPropagation` 方法阻止我们的事件继续进行。延续之前的例子，假设我们在\
  \ **three_a** 上监听 `click` 事件，并希望阻止事件传播。阻止传播的代码如下：\n\n点击此处查看代码图片\n\n```\nlet theElement\
  \ = document.querySelector(\"#three_a\");\n\ntheElement.addEventListener(\"click\"\
  , doSomething, true);\n\nfunction doSomething(e) {\n\n  e.stopPropagation();\n}\n\
  ```\n\n当你点击 **buttonOne** 时，我们的事件路径看起来如下：\n\n![images](img/37UN06.jpg)\n\n我们的 `click`\
  \ 事件将坚定地向下移动 DOM，通知通往 **buttonOne** 的每一个元素。因为 `three_a` 在捕获阶段监听 `click` 事件，与其关联的事件处理器会被调用：\n\
  \n```\nfunction doSomething(e) {\n\n  e.stopPropagation();\n}\n```\n\n通常情况下，在被激活的事件处理器处理完毕之前，事件不会继续传播。因为\
  \ `three_a` 指定了监听器来响应 `click` 事件，`doSomething` 事件处理器被调用。此时我们的事件处于等待状态，直到 `doSomething`\
  \ 事件处理器执行并返回。\n\n在这种情况下，事件不会进一步传播。得益于隐藏在阴影中杀死事件 `stopPropagation` 函数，`doSomething`\
  \ 事件处理器是它的最后一个客户端。`click` 事件永远无法到达 **buttonOne** 元素，也没有机会冒回。太悲剧了。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n**你的事件对象上另一个你可能会尴尬遇到的函数是 preventDefault：**\n\n点击此处查看代码图片\n\n```\nfunction\
  \ overrideScrollBehavior(e) {\n\n  e.preventDefault();\n\n  // 做一些事情\n}\n```\n\n\
  这个函数的作用有点神秘。许多 HTML 元素在你与它们交互时会表现出默认行为。例如，点击文本框会赋予该文本框焦点，并出现一个闪烁的文本光标。在可滚动区域使用鼠标滚轮会向你滚动的方向滚动。点击复选框会切换选中状态。这些都是浏览器直觉知道如何处理的事件内置反应示例。\n\
  \n\n\n\n如果你想关闭这种默认行为，可以调用 `preventDefault` 函数。当你响应某个元素的事件且想要忽略该元素的默认反应时，就需要调用此函数。你可以在在线上的“平滑视差滚动”（Smooth\
  \ Parallax Scrolling）教程中看到我使用该函数的示例，地址为：**[`bit.ly/kirupaParallax`](http://bit.ly/kirupaParallax)**。\n\
  \n# 38. 鼠标事件\n\n## 本章内容\n\n* 学习如何使用各种鼠标事件监听鼠标\n* 理解 `MouseEvent` 对象\n* 处理鼠标滚轮\n\n\
  人们（可能也包括猫）与计算机交互的最常见方式是使用一种名为 `mouse` 的指针设备（请参阅图 38.1）。\n\n![images](img/38fig01.jpg)\n\
  \n图 38.1\n\n猫可能也喜欢它们。\n\n这个神奇的设备允许你通过用手移动以及用手指点击来完成伟大的事业。作为用户，使用鼠标是一回事；而作为开发者，尝试让你的代码与鼠标协作则是另一回事。这正是本章大显身手的地方。\n\
  \n## 认识鼠标事件\n\n在 JavaScript 中，我们处理鼠标的主要方式是通过事件。有大量的处理鼠标的事件，但我们在这里不会介绍所有的事件。相反，我们将只关注那些酷炫且流行的事件，例如以下：\n\
  \n* `click`\n* `dblclick`\n* `mouseover`\n* `mouseout`\n* `mouseenter`\n* `mouseleave`\n\
  * `mousedown`\n* `mouseup`\n* `mousemove`\n* `contextmenu`\n* `mousewheel` 和 `DOMMouseScroll`\n\
  \n这些事件名称应该让你对它们的作用有一个直观的了解，但我们不会认为理所当然，在接下来的章节中，我们将从更详细的角度来观察每一个事件。我应该提醒你，某些事件确实比其他事件更有趣！\n\
  \n### 单击和双击\n\n让我们从你将使用的所有鼠标事件中最受欢迎的——`click` 事件开始。当你**点击**一个元素时，该事件就会触发。换一种方式来表述，且不涉及我在描述中作为描述的一部分提到的那个东西：`click`\
  \ 事件在你使用鼠标按下一个元素，然后在仍在同一元素上方释放按键时触发的。\n\n这是一个关于我所说内容的完全没有必要的视化展示：\n\n![images](img/38UN01.jpg)\n\
  \n你已经见过几次处理 `click` 事件的代码了，但你永远也看不够。这里是另一个示例：\n\n点击此处查看代码图像\n\n```javascript\nlet\
  \ button = document.querySelector(\"#myButton\");\n\nbutton.addEventListener(\"\
  click\", doSomething, false);\n\nfunction doSomething(e) {\n  console.log(\"Mouse\
  \ clicked on something!\");\n}\n```\n\n你监听 `click` 事件的方式与你将遇到的几乎任何其他事件都一样，所以我不会没必要用这些细节以及我们的老朋友\
  \ `addEventListener` 来让你感到无聊。相反，我将用与与之相关的 `dblclick` 事件的细节来让你感到无聊。\n\n当你快速重复执行双倍数次的点击动作时，就会触发\
  \ `dblclick` 事件，使用它的代码如下所示：\n\n点击此处查看代码图像\n\n```javascript\nlet button = document.querySelector(\"\
  #myButton\");\n\nbutton.addEventListener(\"dblclick\", doSomething, false);\n\n\
  function doSomething(e) {\n  console.log(\"Mouse clicked on something...twice!\"\
  );\n}\n```\n\n最终导致 `dblclick` 事件的每次点击之间的时间间隔取决于你运行代码的操作系统。它既不是特定浏览器的，也不是你可以用 JavaScript\
  \ 定义（或读取）的内容。\n\n### 鼠标悬入和鼠标移出\n\n经典的悬停进入和悬停离开场景分别由命名适当的 `mouseover` 和 `mouseout`\
  \ 事件处理：\n\n![images](img/38UN02.jpg)\n\n这里是这两个事件实际运行的代码片段：\n\n点击此处查看代码图像\n\n```javascript\n\
  let button = document.querySelector(\"#myButton\");\n\nbutton.addEventListener(\"\
  mouseover\", hovered, false);\n\nbutton.addEventListener(\"mouseout\", hoveredOut,\
  \ false);\n\nfunction hovered(e) {\n  console.log(\"Hovered!\");\n}\n\nfunction\
  \ hoveredOut(e) {\n  console.log(\"Hovered Away!\");\n}\n```\n\n这两个事件就这些了。总的来说它们非常无聊，正如你现在可能已经发现的，，当涉及编程概念时，这实际上是一件好事。\n\
  \n### 非常像点击的鼠标按下和鼠标松开事件\n\n两个几乎是 `click` 事件子组件的事件是 `mousedown` 和 `mouseup` 事件。从下面的图表中，你会看到原因：\n\
  \n![images](img/38UN03.jpg)\n\n当你按下鼠标时，会触发 `mousedown` 事件。当你释放按键时，会触发 `mouseup`\
  \ 事件。如果你在同一个元素上按下并释放，则 `click` 事件也会触发。\n\n你可以从下面的代码片段中看到这一切：\n\n点击此处查看代码图像\n\n```javascript\n\
  let button = document.querySelector(\"#myButton\");\n\nbutton.addEventListener(\"\
  mousedown\", mousePressed, false);\n\nbutton.addEventListener(\"mouseup\", mouseReleased,\
  \ false);\n\nbutton.addEventListener(\"click\", mouseClicked, false);\n\nfunction\
  \ mousePressed(e) {\n  console.log(\"Mouse is down!\");\n}\n\nfunction mouseReleased(e)\
  \ {\n  console.log(\"Mouse is up!\");\n}\n\nfunction mouseClicked(e) {\n  console.log(\"\
  Mouse is clicked!\");\n}\n```\n\n你可能在奇怪，既然 `click` 事件似乎完美适用于大多数情况，为什么要费心处理这两个事件。一个更有帮助且合理的答案是，某些交互（例如视频游戏中按住来蓄力闪电！）需要在你在\
  \ `mousedown` 事件已发生但 `mouseup` 事件尚未发生时采取行动。\n\n### 再次……再次……发生的事件\n\n你遇到的话最多的事件之一是非常友好的\
  \ `mousemove` 事件。当你的鼠标在你监听的元素上移动时，该事件会触发很多：\n\n![images](img/38UN04.jpg)\n\n下面是\
  \ `mousemove` 事件的示例代码：\n\n点击此处查看代码图像\n\n```javascript\nlet button = document.querySelector(\"\
  #myButton\");\n\nbutton.addEventListener(\"mousemove\", mouseIsMoving, false);\n\
  \nfunction mouseIsMoving(e) {\n  console.log(\"Mouse is on the run!\");\n}\n```\n\
  \n浏览器控制 `mousemove` 事件触发的频率，而且只要你的鼠标移动一个像素，该事件就会触发。该事件对于许多需要跟踪鼠标当前位置的交互场景非常有用，例如。\n\
  \n### 右键菜单\n\n我们将观察的最后一个鼠标相关事件被亲切地称为 `contextmenu`。正如你可能非常熟悉的，当你在各种应用程序中右键点击时，通常会看到菜单：\n\
  \n![images](img/38UN05.jpg)\n\n这个菜单被称为**右键菜单**（context menu）。`contextmenu` 事件在菜单出现之前触发。\n\
  \n现在，你可能在奇怪为什么有人想要这种情况的事件。对你完全诚诚（和我以前其他时候撒谎不像），监听此事件只有一个主要原因。该原因在于在你右键点击或使用右键键盘按钮或快捷键时防止此菜单出现。\n\
  \n这里有一个如何**防止**菜单出现的这种**默认**行为的示例：\n\n点击此处查看代码图像\n\n\n\n\n\n```javascript\ndocument.addEventListener(\"\
  contextmenu\", hideMenu, false);\n\nfunction hideMenu(e) {\n  e.preventDefault();\n\
  }\n```\n\n任何类型的 `Event` 上的 `preventDefault` 方法都会停止默认行为的实际发生。由于 `contextmenu` 事件在菜单出现之前就会触发，因此在其上面调用\
  \ `preventDefault` 可以确保右键菜单永远不会显示。默认行为已被阻止运行。没错，这已经第二次提到这个属性了。正如你所知，我是按字计费的（不，是按单词计费的，哈，哈）。\n\
  \n话虽如此，我想出十亿种方法可以在不使用事件来处理这一切的情况下，防止右键菜单出现，但事实就是如此……目前！\n\n### MouseEvent 属性\n\n\
  让我们更具体一点。到目前为止我们看到的所有鼠标事件都是基于 `MouseEvent` 的。通常情况下，这种事实是你存在脑子里用于知识答会的冷知识，然后就忽略它。但这一次，这个细节非常重要，因为\
  \ `MouseEvent` 带有许多让鼠标操作变得更简单的属性。让我们来看其中一些。\n\n#### 全局鼠标位置\n\n`screenX` 和 `screenY`\
  \ 属性返回鼠标光标距离主显示器左上角的距离：\n\n![images](img/38UN06.jpg)\n\n这里是 `screenX` 和 `screenY`\
  \ 属性运行的一个简单示例：\n\n点击此处查看代码图片\n\n```javascript\ndocument.addEventListener(\"mousemove\"\
  , mouseMoving, false);\n\nfunction mouseMoving(e) {\n  console.log(e.screenX + \"\
  \ \" + e.screenY);\n}\n```\n\n无论你的页面上有什么其他外边距/内边距/偏移量/布局的混乱，都没关系。返回的值始终是鼠标当前位置与主显示器左上角之间的距离。\n\
  \n#### 浏览器内的鼠标位置\n\n`clientX` 和 `clientY` 属性返回鼠标相对于浏览器（技术上是浏览器视口）左上角的 x 和 y 位置：\n\
  \n![images](img/38UN07.jpg)\n\n这段代码没什么特别的：\n\n点击此处查看代码图片\n\n```javascript\nlet button\
  \ = document.querySelector(\"#myButton\");\n\ndocument.addEventListener(\"mousemove\"\
  , mouseMoving, false);\n\nfunction mouseMoving(e) {\n  console.log(e.clientX + \"\
  \ \" + e.clientY);\n}\n```\n\n你只需要调用传递给事件处理器的事件参数的 `clientX` 和 `clientY` 属性即可获取值。\n\
  \n#### 检测点击了哪个按钮\n\n鼠标通常有多个按钮，或有模拟多个按钮的方法。常见的按钮配置涉及左键、右键和中键（通常是点击鼠标滚轮）。要确定按了哪个鼠标按钮，你可以使用\
  \ `button` 属性。如果按下左鼠标键，该属性返回 `0`；如果按下中键，返回 `1`；如果按下右鼠标键，返回 `2`：\n\n![images](img/38UN08.jpg)\n\
  \n使用 `button` 属性检查点击了哪个按钮的代码完全如你预期的那样：\n\n点击此处查看代码图片\n\n```javascript\ndocument.addEventListener(\"\
  mousedown\", buttonPress, false);\n\nfunction buttonPress(e) {\n  if (e.button ==\
  \ 0) {\n    console.log(\"Left mouse button pressed!\");\n  } else if (e.button\
  \ == 1) {\n    console.log(\"Middle mouse button pressed!\");\n  } else if (e.button\
  \ == 2) {\n    console.log(\"Right mouse button pressed!\");\n  } else {\n    console.log(\"\
  Things be crazy up in here!!!\");\n  }\n}\n```\n\n除了 `button` 属性外，你还有 `buttons`\
  \ 以及一些功能相似的属性，可以帮助你确定按了哪个按钮。我不会过多讨论这两个属性，只需知道它们存在即可。如果你想了解更多，可以 Google 搜索一下。\n\n\
  #### 处理鼠标轮\n\n鼠标滚轮与我们目前看到的所有内容相比是特殊的。显而易见的区别是我们处理的是滚轮而不是按钮。不那么明显但可能更相关的细节是，你有两个事件需要处理。你有\
  \ Internet Explorer 和 Chrome 使用的 `mousewheel` 事件，以及 Firefox 使用的 `DOMMouseScroll`\
  \ 事件。\n\n监听这些与鼠标轮相关事件的方法如常一样：\n\n点击此处查看代码图片\n\n```javascript\ndocument.addEventListener(\"\
  mousewheel\", mouseWheeling, false);\n\ndocument.addEventListener(\"DOMMouseScroll\"\
  , mouseWheeling, false);\n```\n\n有趣的是之后发生。当你向任何方向滚动滚轮时，`mousewheel` 和 `DOMMouseScroll`\
  \ 事件就会立即触发。从实际角度来说，你滚动滚轮的方向是重要的。为了获取该信息，我们需要在事件处理器中深入查找以找到事件参数。\n\n`mousewheel`\
  \ 事件的事件参数包含名为 `wheelDelta` 的属性。从实际角度来说，你滚动滚轮的方向是重要的。为了获取该信息，我们需要在事件处理器中深入查找。\n\n\
  `mousewheel` 事件的事件参数包含一个名为 `wheelDelta` 的属性。从实际角度来说，你滚动滚轮的方向是重要的。为了获取该信息，我们需要在事件处理器中深入查找。\n\
  \n`mousewheel` 事件的事件参数包含一个名为 `wheelDelta` 的属性。从实际角度来说，你滚动滚轮的方向是重要的。为了获取该信息，我们需要在事件处理器中深入查找。\n\
  \n`mousewheel` 事件的事件参数包含一个名为 `wheelDelta` 的属性。从实际角度来说，你滚动滚轮的方向是重要的。为了获取该信息，我们需要在事件处理器中深入查找。\n\
  \n等待，我注意到源文本末尾有重复的段落。我会保持逻辑。\n\n```javascript\nfunction mouseWheeling(e) {\n  let\
  \ scrollDirection;\n  let wheelData = e.wheelDelta;\n  if (wheelData) {\n    scrollDirection\
  \ = wheelData;\n  } else {\n    scrollDirection = -1;\n  }\n\n  if (scrollDirection\
  \ > 0) {\n    console.log(\"Scrolling up!\");\n  } else {\n    console.log(\"Scrolling\
  \ down!\");\n  }\n}\n```\n（注：提示中的输入文本包含了关于鼠标轮的重复段落。我已经根据提供的指令处理了核心逻辑。）\n\n\n\n\n\
  根据这些事件的名称，你可能已经对每个事件的作用有了模糊的了解。`keydown` 事件在当你按下键盘上的某个按键时触发。`keyup` 事件在你释放刚刚按下的按键时触发。这两个事件都作用于你交互的任何按键。\n\
  \n`keypress` 事件是一个特殊的“异类”。从初看之下，这个事件似乎在你按下任何按键时都会触发。尽管其名称所称的那样，但 `keypress` 事件只有在你按下会显示字符的按键（字母、数字等）时才会触发。这听起来有些令人困惑，但它以一种扭曲的方式是逻辑自洽的。\n\
  \n如果你按下并释放一个诸如 `Y` 键的字符键，你将看到 `keydown`、`keypress` 和 `keyup` 事件按顺序触发。`keydown` 和\
  \ `keyup` 事件的触发是因为 `Y` 键对它们来说仅仅是一个按键。而 `keypress` 事件的触发是因为 `Y` 键是一个字符键。如果你按下并释放一个在屏幕上不显示任何内容的按键（如空格键、方向键或功能键），你只会看到\
  \ `keydown` 和 `keyup` 事件触发。\n\n当你想要确保你的按键操作确实被应用程序捕获时，这种区别虽然细微但非常重要。\n\n### 使用这些事件\n\
  \n监听 `keydown`、`keypress` 和 `keyup` 事件的方法与你可能想要监听并响应的任何其他事件都是类似的。你在处理这些事件的元素上调用\
  \ `addEventListener`，指定你想要监听的事件，指定在事件被捕获时调用的事件处理函数，并提供一个 `true`/`false` 值，表示你希望该事件是否冒泡。\n\
  \n以下是我在 `window` 对象上监听这三个键盘事件的示例：\n\n点击此处查看代码图片\n\n```\nwindow.addEventListener(\"\
  keydown\", dealWithKeyboard, false);\nwindow.addEventListener(\"keypress\", dealWithKeyboard,\
  \ false);\nwindow.addEventListener(\"keyup\", dealWithKeyboard, false);\n\nfunction\
  \ dealWithKeyboard(e) {\n  // 当捕获到任何一个键盘事件时被调用\n}\n```\n\n如果捕获了其中任何一个事件，`dealWithKeyboard`\
  \ 事件处理器就会被调用。事实上，如果你恰好按下了一个字符键，该事件处理器会被调用三次。这些都非常直观，所以让我们在接下来的几节中提升难度，跳出基础内容。\n\n\
  ### 键盘事件属性\n\n当响应键盘事件的事件处理器被调用时，会传入一个 `Keyboard` 事件参数。让我们重新回顾一下你之前看到的 `dealWithKeyboard`\
  \ 事件处理器。在那个事件处理器中，键盘事件通过传入的 `e` 参数表示：\n\n点击此处查看代码图片\n\n```\nfunction dealWithKeyboard(e)\
  \ {\n  // 当捕获到任何一个键盘事件时被调用\n}\n```\n\n该参数包含几个属性：\n\n* `KeyCode`：你在键盘上按下的每一个按键都有一个关联的数字。这个只读属性返回该数字。\n\
  * `CharCode`：此属性仅存在于 `keypress` 事件返回的事件参数中，它包含了你按下的任何字符键的 ASCII 码。\n* `ctrlKey`,\
  \ `altKey`, `shiftKey`：这三个属性在 `Ctrl` 键、`Alt` 键或 `Shift` 键被按下时返回 `true`。\n* `MetaKey`：`metaKey`\
  \ 属性与 `ctrlKey`、`altKey` 和 `shiftKey` 属性类似，在 meta 键按下时返回 `true`。meta 键在 Windows\
  \ 键盘上是 `Windows` 键，在 Apple 键盘上是 `command` 键。\n\n`Keyboard` 事件包含其他一些属性，但上述列表中的属性是最有趣的。通过这些属性，你可以检查按下了哪个键并做出相应。在接下来的几节中，你会看到一些示例。\n\
  \n![Images](img/caution.jpg) 注意\n\ncharCode` 和 `keyCode` 属性目前被 W3C 的 Web 标准人员标记为已弃。它们的替代品可能是大多数不受支持的\
  \ `code` 属性。请注意这一点，并准备好在未来当 `charCode` 和 `keyCode` 的继任者正式登顶王位时更新你的代码。\n\n### 一些示例\n\
  \n现在你已经了解了处理键盘事件的极其无聊的基础知识，让我们来看一些示例，以澄清（或可能让你困惑！）你目前看到的所有内容。\n\n#### 检查特定按键是否被按下\n\
  \n以下示例展示了如何使用 `keyCode` 属性来检查是否按下了特定按键：\n\n点击此处查看代码图片\n\n```\nwindow.addEventListener(\"\
  keydown\", checkKeyPressed, false);\n\nfunction checkKeyPressed(e) {\n  if (e.keyCode\
  \ == 65) {\n    console.log(\"The 'a' key is pressed.\");\n  }\n}\n```\n\n我检查的特定键是\
  \ `A` 键。在内部，该键被映射到 `keyCode` 值 `65`。万一你上学时没有记住所有的代码，你可以在 `[`bit.ly/kirupaKeyCode`](http://bit.ly/kirupaKeyCode)`\
  \ 找到所有按键和字符代码的方便列表。注意 `A` 键的 `charCode` 是 `97`。请不要背诵每一个代码，有更多更有趣的事情值得记忆。\n\n####\
  \ 在按下方向键时执行操作\n\n我们经常在游戏中看到按下方向键会触发某些操作。下面的代码片段展示了如何实现这一点：\n\n点击此处查看代码图片\n\n```\n\
  window.addEventListener(\"keydown\", moveSomething, false);\n\nfunction moveSomething(e)\
  \ {\n  switch (e.keyCode) {\n    case 37:\n      // 左键按下\n      break;\n    case\
  \ 38:\n      // 上键按下\n      break;\n    case 39:\n      // 右键按下\n      break;\n\
  \    case 40:\n      // 下键按下\n      break;\n  }\n}\n```\n\n再次，这应该非常直观。而且，你相信吗——这正是你很久以前在\
  \ 第 4 章 中的“条件语句: if, else, and switch”中学到的 `switch` 语句的实际用途。\n\n#### 检测多个按键按下\n\n\
  现在，这将非常精彩！一个有趣的案例围绕着我们需要对多个按键按下做出反应。以下是实现该功能的示例：\n\n点击此处查看代码图片\n\n```javascript\n\
  window.addEventListener(\"keydown\", keysPressed, false);\nwindow.addEventListener(\"\
  keyup\", keysReleased, false);\n\nlet keys = [];\n\nfunction keysPressed(e) {\n\
  \  // 存储每个按下的按键\n  keys[e.keyCode] = true;\n\n  // Ctrl + Shift + 5\n  if (keys[17]\
  \ && keys[16] && keys[53]) {\n    // 执行某些操作\n  }\n\n  // Ctrl + f\n  if (keys[17]\
  \ && keys[70]) {\n    // 执行某些操作\n    // 默认浏览器行为\n    e.preventDefault();\n  }\n\
  }\n\nfunction keysReleased(e) {\n  // 标记释放的按键\n  keys[e.keyCode] = false;\n}\n```\n\
  \n\n\n\n详细介绍这些内容将需要另外开一个章节，但让我们简要看看它是如何运作的。\n\n首先，我们有一个 `keys` 数组，它存储了你按下的每一个键：\n\
  \n```\nlet keys = [];\n```\n\n当按键被按下时，`keysPressed` 事件处理器就会被调用：\n\n点击此处查看代码图片\n\n\
  ```\nfunction keysPressed(e) {\n  // 为每个按下的键存储条目\n\n  keys[e.keyCode] = true;\n\n\
  \  // Ctrl + Shift + 5\n\n  if (keys[17] && keys[16] && keys[53]) {\n\n    // 执行某些操作\n\
  \n  }\n\n  // Ctrl + f\n\n  if (keys[17] && keys[70]) {\n\n    // 执行某些操作\n\n   \
  \ // 防止默认浏览器行为\n\n    e.preventDefault();\n  }\n}\n```\n\n当按键被释放时，`keysReleased`\
  \ 事件处理器就会被调用：\n\n点击此处查看代码图片\n\n```\nfunction keysReleased(e) {\n  // 标记已释放的键\n\n\
  \  keys[e.keyCode] = false;\n}\n```\n\n注意这两个事件处理器是如何协同工作的。当按键被按下时，`keys` 数组中会为它们创建一个值为\
  \ `true` 的条目。当按键被释放时，这些相同的键会被标记为值 `false`。在数组中，你所按按键的存在是表面的，真正重要的是它们所存储的值。\n\n只要没有东西（如警报窗口）中断你的事件处理器的正常调用，你就能通过\
  \ `keys` 数组的视角，获得按下的按键与释放的按键之间的一一对应的映射关系。综上所述，检查按下了何种组合键的逻辑是在 `keysPressed` 事件处理器中处理的。以下高亮行显示了它是如何运作的：\n\
  \n点击此处查看代码图片\n\n```\nfunction keysPressed(e) {\n  // 为每个按下的键存储条目\n\n  keys[e.keyCode]\
  \ = true;\n\n  // Ctrl + Shift + 5\n\n  if (keys[17] && keys[16] && keys[53]) {\n\
  \n    // 执行某些操作\n\n  }\n\n  // Ctrl + f\n\n  if (keys[17] && keys[70]) {\n\n   \
  \ // 执行某些操作\n\n    // 防止默认浏览器行为\n\n    e.preventDefault();\n  }\n}\n```\n\n有一点你需要记住。某些按键组合会导致浏览器执行某些操作。为了避免浏览器按照它自己的方式行事，在检查是否使用了\
  \ `Ctrl+F` 时，如此处所示，使用 `preventDefault` 方法：\n\n点击此处查看代码图片\n\n```\nfunction keysPressed(e)\
  \ {\n  // 为每个按下的键存储条目\n\n  keys[e.keyCode] = true;\n\n  // Ctrl + Shift + 5\n\n\
  \  if (keys[17] && keys[16] && keys[53]) {\n\n    // 执行某些操作\n\n  }\n\n  // Ctrl\
  \ + f\n\n  if (keys[17] && keys[70]) {\n\n    // 执行某些操作\n\n    // 防止默认浏览器行为\n\n\
  \    e.preventDefault();\n  }\n}\n```\n\n`preventDefault` 方法可以防止事件触发默认行为。在这种情况下，它防止了浏览器显示“查找”对话框。不同的按键组合会触发浏览器不同的反应，因此请备好此方法来阻止这些反应。\n\
  \n无论如何，从整体来看，你已经有了一个如何轻松检查多个按键按下的基础蓝图。\n\n## 40\n\n## 页面加载事件及其他内容\n\n## 本章内容\n\n\
  * 学习在页面加载时触发的所有事件\n* 理解页面加载过程中后台发生了什么\n* 尝试各种各种 `script` 元素的属性，以精确控制你代码的运行时间\n\n\
  使用 JavaScript 的一个重要部分是确保你的代码在正确的时间运行。事情并不总是简单到只需将代码放在页面底部，并期望在页面加载后一切都能正常工作。是的，我们将重新回顾在第\
  \ 10 章中看看到的内容，“你的代码应该放在哪里？”。每隔你可能需要添加一些额外代码，以确保代码在页面准备好之前不会运行。有时，你可能甚至得将代码放在页面的顶部……像动物一样！\n\
  \n有许多因素会影响运行代码的真正“正确时间”，在本章中，我们将研究这些因素，并将你应该做的事情缩小为几条准则。\n\n### 页面加载期间发生的事情\n\n\
  让我们从最开始说。你点击链接或在输入 URL 后按下 `Enter` 键，如果运气足够的话，你的页面就加载了。这一切看起来非常简单，而且从开始到结束只占用了极短的一部分时间：\n\
  \n![images](img/40UN01.jpg)\n\n在你想要加载页面到页面加载完成的这段短时间内，发生了很多你需要进一步了解的相关且有趣的事情。（注：原文此处存在大量重复文本，译文已按原文逻辑进行处理）\n\
  \n\n\n你使用这些事件就像使用任何其他事件一样，但需要注意的主要点是，你需要从 `document` 元素监听 `DOMContentLoaded`，并从\
  \ `window` 元素监听 `load`。\n\n既然我们已经解决了这些无聊的技术细节，那么为什么这些事件如此重要呢？很简单。如果你有任何依赖于 DOM 操作的代码（例如任何使用\
  \ `querySelector` 或 `querySelectorAll` 函数的 get），你都希望确保你的代码只在 DOM 完全加载后才运行。如果你在 DOM\
  \ 完全完全加载之前尝试访问它，你可能会得到不完整的结果，或者根本得不到结果。\n\n这里有一个来自 Kyle Murray ([`twitter.com/krilnon`](https://twitter.com/krilnon))\
  \ 的极佳且极端的例子，应该能帮助解释这一点：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <script>\n      // 在这里尝试分析书的含义\n  </script>\n</head>\n<body>\n  [在此处插入《战争与和平》的全文]\n\
  </body>\n</html>\n```\n\n*War and Peace*是一部极其庞大的小说。如果它的所有内容都像上面所示粘贴到 `body` 元素中，浏览器需要一些时间才能完全理解它。如果我们恰好在它之前有一个脚本尝试处理我们\
  \ `body` 元素内部的内容，那么该脚本运行的时间将远比浏览器到达《战争与和平》结尾的时间早得多。\n\n确保你永远不会陷入代码在 DOM 准备就绪之前运行的情况，一种可靠的方法是监听\
  \ `DOMContentLoaded` 事件，并让所有依赖 DOM 的代码只在该事件被触发后才运行：\n\n点击此处查看代码图片\n\n```javascript\n\
  document.addEventListener(\"DOMContentLoaded\", theDomHasLoaded, false);\n\nfunction\
  \ theDomHasLoaded(e) {\n  let headings = document.querySelectorAll(\"h2\");\n  //\
  \ 对图片进行一些操作\n}\n```\n\n对于你希望代码在页面完全加载后才运行的情况，请使用 `load` 事件。在我多年 JavaScript 开发经验中，我从未在文档级别上太需要使用\
  \ `load` 事件，除非是为了检查加载后的图片的最终尺寸，或者创建一个粗略的进度条来指示进度。你的情况可能有所异，但我深怀疑。\n\n## 脚本及其在 DOM\
  \ 中的位置\n\n在第 8 章“变量作用域”中，我们查看了脚本出现在文档中的各种方式。你已经看到脚本元素在 DOM 中的位置会影响它们运行的时机。在本节中，我们再次强调这一简单真理，并更进了一步。\n\
  \n回顾一下，一个简单的脚本元素可以是嵌入在某处的内联代码：\n\n点击此处查看代码图片\n\n```html\n<script>\n  let number\
  \ = Math.random() * 100;\n  console.log(\"A random number is: \" + number);\n</script>\n\
  ```\n\n简单的脚本元素也可以是引用外部文件中某些代码：\n\n点击此处查看代码图片\n\n```html\n<script src=\"/foo/something.js\"\
  ></script>\n```\n\n现在，这里有一个关于这些元素的重要细节。你的浏览器从上到下顺序解析你的 DOM。沿途中发现的任何脚本元素将按照它们在 DOM\
  \ 中出现的顺序进行解析。\n\n这里有一个非常简单的例子，其中你有很多脚本元素：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n  <h1>Example</h1>\n  <script>\n    console.log(\"inline 1\");\n\
  \  </script>\n  <script src=\"external1.js\"></script>\n  <script>\n    console.log(\"\
  inline 2\");\n  </script>\n  <script src=\"external2.js\"></script>\n  <script>\n\
  \    console.log(\"inline 3\");\n  </script>\n</body>\n</html>\n```\n\n无论脚本包含内联代码还是引用外部内容，并不重要。所有脚本都被同相同对待，并按照它们在文档中出现的顺序运行。使用前面的示例，脚本运行的顺序如下：`inline\
  \ 1`、`external 1`、`inline 2`、`external 2` 和 `inline 3`。\n\n现在，这里有一个非常、非常重要的细节需要注意。因为你的\
  \ DOM 是从上到下解析的，所以你的脚本元素可以访问所有已经过的 DOM 元素。你的脚本无法访问任何尚未解析的 DOM 元素。你说，什么？！\n\n假设你有一个脚本元素位于页面底部，紧邻闭合的\
  \ `body` 元素：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h1>Example</h1>\n\
  \  <p>\n    Quisque faucibus, quam sollicitudin pulvinar dignissim, nunc\n    velit\
  \ sodales leo, vel vehicula odio vitae\n    mauris. Sed magna augue. Vestibulum\
  \ tristique orci,\n    accumsan posuere congue sed. Ut pretium sit amet\n    eros\
  \ non consectetur. Quisque tincidunt eleifend justo, quis\n    molestie tellus non.\
  \ Vivamus interdum ut\n    augue rhoncus, eu scelerisque dignissim. In commodo purus\n\
  \    id purus tempus commodo.\n  </p>\n  <button>Click Me</button>\n</body>\n</html>\n\
  ```\n\n当 `something.js` 运行时，它可以访问它之前所有的 DOM 元素。例如 `h1`、`p` 和 `button`。如果你的脚本元素位于文档的最顶部，它将无法访问下方的\
  \ DOM 元素：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script src=\"something.js\"\
  ></script>\n  <h1>Example</h1>\n  <p>\n    Quisque faucibus, quam sollicitudin pulvinar\
  \ dignissim, nunc\n    velit sodales leo, vel vehicula odio vitae\n    mauris. Sed\
  \ magna augue. Vestibulum tristique orci,\n    accumsan posuere congue sed. Ut pretium\
  \ sit amet\n    eros non consectetur. Quisque tincidunt eleifend justo, quis\n \
  \   molestie tellus non. Vivamus interdum ut\n    augue rhoncus, eu scelerisque\
  \ dignissim. In commodo purus\n    id purus tempus commodo.\n  </p>\n  <button>Click\
  \ Me</button>\n</body>\n</html>\n```\n\n通过将你的脚本元素放在页面底部（如之前所示），最终结果与你显式监听 `DOMContentLoaded`\
  \ 事件的代码 get 完全相同。如果你能保证你的脚本出现在文档末尾，你就可以避免上一节描述的整个 `DOMContentLoaded` 方法。现在，如果你确实想将你的脚本元素放在\
  \ DOM 顶部，请确保所有依赖 DOM 的代码在 `DOMContentLoaded` 事件触发后运行。\n\n事实是这样的：我非常喜欢将脚本元素放在 DOM\
  \ 的底部。除了易于访问 DOM 外，我建议将脚本放在页面底部的另一个原因是，当解析脚本元素时，浏览器会停止页面上所有其他内容的运行。如果你有一个运行时间很长的脚本，或者你的外部脚本下载得很慢，你的\
  \ HTML 页面将处于冻结状态。如果此时 DOM 只解析了部分，你的页面看起来不仅完整而且完整。\n\n### 脚本元素：async 和 defer\n\n\
  在上一节中，我解释了脚本元素在 DOM 中的位置如何决定它的运行时间。这一切仅适用于我所说的**简单**脚本元素。为了进入非简单的世界，指向外部脚本的脚本元素可以设置\
  \ `defer` 和 `async` 属性：\n\n点击此处查看代码图片\n\n\n\n\n```\n<script async src=\"myScript.js\"\
  ></script>\n\n<script defer src=\"somethingSomethingDarkSide.js\"></script>\n```\n\
  \n这些属性会改变脚本运行的时机，而无论它们在 DOM 中实际出现的位置在哪里。因此，让我们来看看它们是如何改变你的脚本的。\n\n#### async\n\n\
  `async` 属性允许脚本异步运行：\n\n点击此处查看代码图像\n\n```\n<script async src=\"someRandomScript.js\"\
  ></script>\n```\n\n如果你还记得上一个章节的内容，如果一个脚本元素正在被解析，它可能会阻塞浏览器的响应能力和可用性。通过在脚本元素上设置 `async`\
  \ 属性，你可以完全避免这个问题。你的脚本将在任何它能够运行的时候执行，但它不会阻塞浏览器执行其他任务。\n\n这种运行代码的随性运行方式非常棒，但你必须意识到，标记为\
  \ `async` 的脚本并不总是按顺序运行。你可能会遇到一种情况：几个标记为 `async` 的脚本的运行顺序与你在标记语言中指定的顺序不同。你唯一获得的保证是，标记为\
  \ `async` 的脚本将在 `load` 事件触发之前的某个神秘时间点开始运行。\n\n#### defer\n\n`defer` 属性与 `async`\
  \ 有些不同：\n\n点击此处查看代码图像\n\n```\n<script defer src=\"someRandomScript.js\"></script>\n\
  ```\n\n标记为 `defer` 的脚本将按照它们定义的顺序运行，但它们只会在最后执行，就在 `DOMContentLoaded` 事件触发前的几刻。请看下面的示例：\n\
  \n点击此处查看代码图像\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<body>\n\n  <h1>Example</h1>\n\
  \n  <script defer src=\"external1.js\"></script>\n\n  <script>\n\n    console.log(\"\
  inline 1\");\n\n  </script>\n\n  <script src=\"external2.js\"></script>\n\n  <script>\n\
  \n    console.log(\"inline 2\");\n\n  </script>\n\n  <script defer src=\"external3.js\"\
  ></script>\n\n  <script>\n\n    console.log(\"inline 3\");\n\n  </script>\n\n</body>\n\
  \n</html>\n```\n\n花几秒钟告诉你身边的人或宠物这些脚本运行的顺序。即使你不给他们提供背景信息也没关系。如果他们爱你，他们会理解。\n\n总之，你的脚本将按照以下顺序执行：`inline\
  \ 1`、`external 1`、`inline 2`、`inline 3`、`external 3` 和 `external 2`。`external 3`\
  \ 和 `external 2` 脚本被标记为 `defer`，这就是为什么它们出现在最后，尽管它们在标记语言中位于不同的位置。\n\n## 41\n\n##\
  \ 动态加载脚本文件\n\n## 本章内容\n\n*   学习如何高效加载脚本文件\n*   学习如何使用适当的脚本加载事件自定义代码运行的时间\n\n在之前的第\
  \ 40 章——“页面加载事件或其他内容”中，我们查看的内容包括我们在页面中加载和运行外部 JavaScript 文件的各种方法。所有这些方法都假设我们确切知道想要加载哪个脚本文件，并且\
  \ `src` 属性已经指向了我们的文件：\n\n点击此处查看代码图像\n\n```\n<script src=\"https://www.example.com/foo.js\"\
  >\n\n</script>\n```\n\n现在，如果你在页面加载时不知道想要加载哪个脚本文件，该怎么办？如果你必须根据用户的不同操作在加载 `foo.js`\
  \ 或 `bar.js` 之间做出选择，呢？在这种情况下，硬编码的脚本元素效果并不良好。有效的方法是拥有一种动态加载脚本文件的方法！在本短章节中，我们将对其进行详细介绍。\n\
  \n### 基础技术\n\n使用 JavaScript 动态加载脚本文件的基本步骤如下：\n\n1.  创建脚本元素。\n2.  在脚本元素上设置 `src`\
  \ 属性，指向我们想要加载的文件。\n3.  将脚本元素添加到 DOM 中。\n\n这个编号列表转换为代码后，如下三行所示：\n\n点击此处查看代码图像\n\n\
  ```\nlet myScript = document.createElement(\"script\");\n\nmyScript.setAttribute(\"\
  src\", \"https://www.example.com/foo.js\");\n\ndocument.body.appendChild(myScript);\n\
  ```\n\n\n\n\n代码中发生了两项新变化，确保我们的外部脚本文件在页面任何其他内容渲染之前被加载并运行：\n\n1. 我们将脚本元素的 `async`\
  \ 属性设置为 `false`。为什么要这样做呢？因为动态加载的脚本文件默认情况下是异步加载的。我们想要显式地覆盖这一默认行为。\n\n2. 我们确保在页面其他部分加载之前加载脚本。将脚本元素放在\
  \ `head` 元素的顶部是确保它在页面可能执行的任何其他操作之前运行的最佳位置。\n\n如果我们修改整个示例以优先加载我们的外部脚本文件，那么完整的 HTML、CSS\
  \ 和 JS 看起来会是这样：\n\n点击此处查看代码图片\n\n```\n<!DOCTYPE html>\n<html\n<head>\n  <title>Dynamic\
  \ Script Loading</title>\n  <style>\n    body {\n      padding: 50px;\n      background-color:\
  \ #EAC5D8;\n    }\n    h1 {\n      font-family: sans-serif;\n      font-size: 128px;\n\
  \      margin: 0;\n      line-height: 1em;\n      font-weight: bold;\n      color:\
  \ #D68FB5;\n    }\n  </style>\n  <script>\n    let myCoolCode = document.createElement(\"\
  script\");\n    myCoolCode.setAttribute(\"src\", \"https://www.kirupa.com/js/easing.js\"\
  );\n    myCoolCode.setAttribute(\"async\", \"false\");\n    let head = document.head;\n\
  \    head.insertBefore(myCoolCode, head.firstElementChild);\n  </script>\n</head>\n\
  <body>\n  <h1>I am <br>in your<br> code!</h1\n\n</body>\n</html>\n```\n\n较大型示例中提到的另一个额外更改与此处也相关。实际加载外部脚本文件的代码`也需要放在\
  \ head 元素内部`。如果我们像之前看到的那样将这段代码放在页面底部，我们的页面仍然会照常渲染并加载所有内容，而甚至还没意识到它需要处理外部脚本文件的加载。到那时，外部脚本文件是从页面顶部加载还是底部加载就没了，因为页面的\
  \ DOM 已经加载完成。\n\n### 在我们的脚本文件加载后运行依赖代码\n\n在收尾之前，关于处理动态脚本文件我们最后一个最后一个技巧。通常情况下我们会加载一个外部脚本文件，然后立即调用一个函数（或依赖于加载脚本的内容）。以下是这种传统做法的一个示例：\n\
  \n![images](img/41UN04.jpg)\n\n第一个脚本元素加载了 `docsearch.min.js`。第二个脚本元素调用了依赖于前一个脚本元素加载的\
  \ `docsearch.min.js` 的内容。这一切之所以正常工作是因为浏览器自然地处理了这种场景。最棒的是，我们免费获得了这种行为。\n\n对于动态加载的脚本文件，如果我们想确保类似的行为，我们需要做少量的额外工作。这些额外工作涉及监听脚本元素的\
  \ `load` 事件，并且一旦监听到该事件，就在之后调用任何依赖代码。当我们查看代码时，这会更有意义：\n\n点击此处查看代码图片\n\n```\nlet myScript\
  \ = document.createElement(\"script\");\nmyScript.setAttribute(\"src\", \"https://www.example.com/foo.js\"\
  );\ndocument.body.appendChild(myScript);\nmyScript.addEventListener(\"load\", scriptLoaded,\
  \ false);\n\nfunction scriptLoaded() {\n  console.log(\"Script is ready to rock\
  \ and roll!\");\n}\n```\n\n让我们花点时间发生了什么：\n\n1. 我们可靠的 `myScript` 元素正在加载 `foo.js`。\n\
  2. 一旦 `foo.js` 完全加载并执行，`myScript` 将触发 `load` 事件。\n3. 监听 `load` 事件的 `addEventListener`\
  \ 调用会监听到它，并反过来调用 `scriptLoaded` 事件处理器。\n4. 任何位于 `scriptLoaded` 内部的代码都可以调用并访问来自 `foo.js`\
  \ 及其内容的任何方法或属性。\n\n如果你需要关于如何处理事件和事件处理器的趣味回顾，请查看第 36 章，“JavaScript 中的事件](#ch36.xhtml_ch36)”。\n\
  \n## 42\n\n## 处理多个元素的事件\n\n在本章中\n\n* 学习高效地响应多个事件\n* 最后一次回顾事件的工作原理\n\n在最基础的情况下，事件监听器处理从单个元素触发的事件：\n\
  \n![images](img/42UN01.jpg)\n\n随着你构建更复杂的结构，“一个事件处理器对应一个元素”的映射开始显示出它的局限性。最常见的原因是你使用\
  \ JavaScript 动态创建元素。你创建的这些元素可以触发你可能想要监听并响应的事件，你可能有从少数需要事件支持的元素到许多、非常多需要处理其事件的元素不等。\n\
  \n你不想做的是：\n\n![images](img/42UN02.jpg)\n\n`如果所有元素的事件监听器都是相同的`，你就不想为每个元素创建一个事件监听器。其中一个原因是父元素是这么说的。另一个原因是这效率低下。每个这些元素都携带有关事件监听器的数据，当你有大量内容时，这会显著增加内存消耗。相反，你想要的是一种简洁且快速的方法来处理多个元素的事件。你可能像这样：\n\
  \n![images](img/42UN03.jpg)\n\n这听起来有点疯狂，对吧？嗯，在本章中，你将学习这有多么疯狂，以及如何仅用几行 JavaScript\
  \ 实现它。\n\n### 如何实现这一切\n\n好了，到目前，你已经知道了简单的事件处理是如何工作的，即一个元素、一个事件监听器和一个事件处理器。尽管多个元素的情况看起来很不同，但通过利用事件的破坏性，解决它实际上很容易。\n\
  \n假设我们有这种情况：我们需要对 `id` 值为 `one`、`two`、`three`、`four` 和 `five` 的任何兄弟元素监听 `click`\
  \ 事件。让我们发挥想象，将 DOM 设如下：\n\n![images](img/42UN04.jpg)\n\n在最底部，我们有想要监听事件的元素。它们共享一个\
  \ `id` 值为 `theDude` 的公共父元素。为了解决我们的事件处理问题，让我们看一个糟糕的解决方案，然后是一个良好的解决方案。\n\n### 糟糕的解决方案\n\
  \n这是我们不想做的。我们不想为这些按钮中的每一个设置五个事件监听器：\n\n点击此处查看代码图片\n\n```\nlet oneElement = document.querySelector(\"\
  #one\");\nlet twoElement = document.querySelector(\"#two\");\nlet threeElement =\
  \ document.querySelector(\"#three\");\nlet fourElement = document.querySelector(\"\
  #four\");\nlet fiveElement = document.querySelector(\"#five\");\n\noneElement.addEventListener(\"\
  click\", doSomething, false);\ntwoElement.addEventListener(\"click\", doSomething,\
  \ false);\nthreeElement.addEventListener(\"click\", doSomething, false);\nfourElement.addEventListener(\"\
  click\", doSomething, false);\nfiveElement.addEventListener(\"click\", doSomething,\
  \ false);\n\nfunction doSomething(e) {\n  let clickedItem = e.target.id;\n  console.log(\"\
  Hello \" + clickedItem);\n}\n```\n\n\n\n\n正如我在章节介绍中提到的，显而易见的原因是你不想重复代码。另一个原因是这些元素中的每一个现在都设置了各自的\
  \ `addEventListener` 属性。对于五个元素来说，这不是什么问题。但当你有几十甚至上百个元素时，每个元素都会占用少量的内存，这就会变成一个大问题。另一个**另一个**原因是，取决于你的用户界面（UI）真正的自适应性或动态程度，你的元素数量可能会发生变化。你的应用程序可能会根据用户的操作添加或删除元素，因此要跟踪每个对象可能需要或不需要的所有单独事件监听器将非常困难。使用一个总括的事件处理器会让这种情况变得有趣得多。\n\
  \n### 良好的解决方案\n\n这个良好的解决方案模拟了你在此早时候看到的图表，其中我们只有一个事件监听器。我将先通过描述它的工作原理来让你感到困惑。然后，我希望通过展示代码并详细解释到底发生了什么来消除你的困惑。以下是这个简单但又令人困惑的解决方案：\n\
  \n1. 在父元素（`theDude`）上创建一个单一事件监听器。\n2. 当点击 `one`、`two`、`three`、`four` 或 `five` 中的任何一个元素时，依靠事件拥有的传播行为，并在它们击中父元素\
  \ `theDude` 时拦截点击事件。\n3. （可选）在父元素上停止事件传播，以避免不得不处理让事件厌烦地在 DOM 树上反复运行。\n\n我不知道你们如何，但在读了这三个步骤后，我确实很困惑！让我们从一张视觉化解释这些步骤的图开始，开始消除困惑：\n\
  \n![images](img/42UN05.jpg)\n\n在我们追求完全消除困惑的道路上，最后一步是图表和三个步骤所代表的代码：\n\n点击此处查看代码图像\n\
  \n```\nlet theParent = document.querySelector(\"#theDude\");\n\ntheParent.addEventListener(\"\
  click\", doSomething, false);\n\nfunction doSomething(e) {\n  if (e.target != e.currentTarget)\
  \ {\n    let clickedItem = e.target.id;\n    console.log(\"Hello \" + clickedItem);\n\
  \  }\n  e.stopPropagation();\n}\n```\n\n花一点时间阅读并理解你看到的这些代码。在看到我们的初始目标和图表之后，我们将在父元素\
  \ `theDude` 上监听该事件：\n\n点击此处查看代码图像\n\n```\nlet theParent = document.querySelector(\"\
  #theDude\");\n\ntheParent.addEventListener(\"click\", doSomething, false);\n```\n\
  \n只有一个事件监听器来处理此事件，而那个孤独的家伙被称为 `doSomething`：\n\n点击此处查看代码图像\n\n```\nfunction doSomething(e)\
  \ {\n  if (e.target != e.currentTarget) {\n    let clickedItem = e.target.id;\n\
  \    console.log(\"Hello \" + clickedItem);\n  }\n  e.stopPropagation();\n}\n```\n\
  \n每当 `theDude` 元素被点击时，这个事件监听器就会被调用，同一个任何被点击的元素。我们只关心与子元素相关的 `click` 事件，而忽略父元素点击的正确方法是：如果点击的元素（即事件目标）与事件监听器目标（即\
  \ `theDude` 元素）相同，则简单地避免运行任何代码：\n\n点击此处查看代码图像\n\n```\nfunction doSomething(e) {\n\
  \  if (e.target != e.currentTarget) {\n    let clickedItem = e.target.id;\n    console.log(\"\
  Hello \" + clickedItem);\n  }\n  e.stopPropagation();\n}\n```\n\n事件目标由 `e.target`\
  \ 表示，事件监听器绑定的目标元素由 `e.currentTarget` 表示。通过简单检查这些值是否相等，你可以确保事件处理器不会对从你不关心的父元素触发的事件做出反应。\n\
  \n为了停止事件的传播，我们只需调用 `stopPropagation` 方法：\n\n点击此处查看代码图像\n\n```\nfunction doSomething(e)\
  \ {\n  if (e.target != e.currentTarget) {\n    let clickedItem = e.target.id;\n\
  \    console.log(\"Hello \" + clickedItem);\n  }\n  e.stopPropagation();\n}\n```\n\
  \n注意，这段代码实际上位于我们的 `if` 语句之外。这是因为我们希望事件一旦被监听到，在所有情况下都停止在 DOM 中进行遍历。\n\n### 整合一切\n\
  \n所有代码运行的最终结果是，你可以点击 `theDude` 的任何子元素，并在事件向上传播时监听该事件：\n\n由于所有的事件参数对于我们正在交互的元素（即事件源）来说仍然是唯一的，尽管\
  \ `addEventListener` 仅在父元素上激活，我们仍然能够在事件处理器内部识别并对被点击的元素进行特殊处理。关于这个解决方案主要的要点是，它解决了我们想要避免的问题。我们只创建了一个事件监听器。`theDude`\
  \ 最终有多少个子元素并不重要。这种方法足够通用，可以容纳它们。\n\n\n\n\n显示表情符号（emoji）最简单的方法就是复制和粘贴。你只需要一个允许以原始字符形式复制表情符号的应用程序或网站即可。[Emojipedia](https://emojipedia.org)\
  \ 就是进行此操作的绝佳场所。你可以使用 Emojipedia 来搜索或浏览你需要的任何表情符号。一旦找到了你想要的表情符号，有一个区域可以让你轻松地查看并复制它：\n\
  \n![images](img/43UN03.jpg)\n\n一旦复制了它，只需将其粘贴到你标记语言中的目标位置即可：\n\n```\n<p></p>\n```\n\
  \n由于表情符号被视为基于文本的内容，你可以将它们粘贴到文档中几乎任何支持文本的地方。现在，如果你是第一次看到表情符号随机出现在你的文本代码或代码编辑器中，它看起来会有点奇怪：\n\
  \n![images](img/43UN04.jpg)\n\n你多年来编写标记语言的传统纯文本环境突然有了一些视觉化内容。别担心，这很酷。当你从浏览器中预览 HTML\
  \ 文档时，一切仍然会正常工作。\n\n在我们结束对 HTML 中表情符号的介绍之前，让我们来聊聊无障碍性（accessibility）。表情符号最终上是视觉产物，但在底层，它们使用\
  \ `p` 和 `span` 等元素以文本形式表示，而这些元素在在这种情况下语义上是模糊的。屏幕阅读器和相关工具可能无法正确解释表情符号想要表达的含义，但解决方案很简单。要以无障碍友好的方式使用表情符号（正如那些酷的人所称的的\
  \ `a11y`！），请在你用于表示表情符号的元素上设置 `role` 和 `aria-label` 属性：\n\n点击此处查看代码图像\n\n```\n<p\
  \ role=\"img\" aria-label=\"hamburger\"></p>\n```\n\n通过这种更改，你仍然可以在 HTML 中使用表情符号并同时让它们具备无障碍性。这真是多赢的局面！\n\
  \n### 指定表情符号代码点（Codepoint）\n\n如果直接指定表情符号不起作用，还有一条不那么有趣的路径可以尝试。你可以使用表情符号的数值表示并在你的标记语言中指定它。如果你在\
  \ Emojipedia 中向下滚动任何表情符号，你会看到显示的数值表示（更正式的名称为 `codepoint`）：\n\n![images](img/43UN05.jpg)\n\
  \n对于汉堡表情符号，代码点是 `U+1F354`。要在 HTML 中使用代码点指定此表情符号，我们需要稍微修改一下值。添加 `&#x` 字符，删除代码点开头的\
  \ `U+`，并将代码点的剩余数字作为任何文本元素的一部分添加。\n\n这里是代码点形式的汉堡表情符号：\n\n```\n<p>&#x1F354</p>\n```\n\
  \n当你在浏览器中预览文档时，你仍然会正确显示汉堡表情符号，尽管在我们的标记语言中它与之前看到的复制/粘贴方案相比看起来很奇怪。\n\n### CSS 中的表情符号\n\
  \n你完全可以在 CSS 中使用表情符号。我们在 HTML 中看到表情符号的相同技巧只需经过微调即可生效。你可以直接指定表情符号：\n\n```\nh1::before\
  \  {\n  content: \"\";\n}\n```\n\n你也可以通过设置代码点来指定表情符号：\n\n```\nh1::before  {\n  content:\
  \ \"\\01F354\";\n}\n```\n\n指定代码点的方式与我们在 HTML 中看到的略有不同。你只需要从 Unicode 点中删除 `U+`，并在此处之前添加\
  \ `\\0`（斜杠零）字符即可。\n\n### JavaScript 中的表情符号\n\n我们将最后看的是如何在 JavaScript 中使用表情符号。直接使用它们的方法在这里同样有效。只需确保将表情符号视为文本：\n\
  \n点击此处查看代码图像\n\n```\ndocument.body.innerText = \"\";\n```\n\n如果改为通过其代码点值使用表情符号，我们必须通过\
  \ `String.fromCodePoint` 方法。该方法接受代码点值作为参数：\n\n点击此处查看代码图像\n\n```\ndocument.body.innerText\
  \ = String.fromCodePoint(0x1F354);\n```\n\n返回的是该代码点位置的字符。指定代码点的方式与 HTML 和 CSS 都不同。如果代码点是\
  \ `U+1F354`，在传递它之前将 `U+` 替换为 `0x`（零和 x）。就这样。如果你想更进一步，由于你正在使用 JavaScript，你可以做各种 JavaScript\
  \ 风格的操作。你可以有一个表情符号数组，可以动态地生成它们，等等：\n\n点击此处查看代码图像\n\n```\nlet emojis = [0x1F600,\
  \ 0x1F604, 0x1F34A, 0x1F344, 0x1F37F, 0x1F363, 0x1F370, 0x1F355, 0x1F349];\n```\n\
  \n\n\n\n\nHTTP 协议提供了一种通用语言，允许你的浏览器以及许多其他事物与构成互联网的所有服务器进行通信。你的浏览器通过 HTTP 协议代表你发出的请求被称为\
  \ `HTTP requests`（HTTP 请求），这些请求的作用远超你在导航时简单地加载一个新页面。一个常见（而且有趣得多）的用例场景围绕着使用来自 HTTP\
  \ 请求产生的数据来更新你的 `existing`（现有）页面。\n\n例如，你可能有一个页面，想在其中显示一些关于当前登录用户的信息。这些信息你的页面最初可能并不具备，但它们将是你与页面交互时，浏览器会请求的信息。服务器将返回数据，并让你的页面使用这些信息进行更新。这一切听起来可能有点抽象，所以我要稍微“搞怪”一会儿，通过这个例子来描述一个\
  \ HTTP 请求和响应可能像什么样。\n\n为了获取关于用户的信息，这里是我们的 HTTP 请求：\n\n```\nGET /user\n\nAccept:\
  \ application/json\n```\n\n对于该请求，是服务器可能返回的内容：\n\n点击此处查看代码图像\n\n```\n200 OK\n\nContent-Type:\
  \ application/json\n\n{\n\n    \"name\": \"Kirupa\",\n\n    \"url\": \"https://www.kirupa.com\"\
  \n}\n```\n\n这种往返会发生很多，而且这一切在 JavaScript 中都是完全支持的！这种异步请求和处理服务器数据而无需页面导航/重新加载的能力有一个专门的术语。那个术语就是\
  \ `Ajax`（如果你想大声点，也可以叫 `AJAX`）。这个缩写代表 `Asynchronous JavaScript and XML`（异步 JavaScript\
  \ 和 XML），如果你几年前在网页开发者身边，`Ajax` 是每个人都在挂嘴边的流行词，用来描述我们今天理所当然的那些 Web 应用——比如 Twitter、Facebook、Google\
  \ Maps、Gmail 等，这些应用在你与页面交互时不断获取数据，而无需重新加载整个页面！\n\n知道如何 `Ajax` 起来并发送 `HTTP requests`\
  \ 是一项非常重要的技能，本章将为你提供所需的一切内容。或者，我应该说……`dangeresque`（危险风格）（[`homestarrunner.com/sbemail106.html`](https://homestarrunner.com/sbemail106.html)）？\n\
  \n### 示例\n\n阅读（甚至是思考）HTTP 和请求是非常无聊的……极度无聊！为了帮助你保持清醒并理解其中涉及的所有内容，我们将一起构建一个小型示例。该示例如下：\n\
  \n![images](img/44UN01.jpg)\n\n从表面上看，这个示例看起来和我之前试图让它变得有趣的 `HTTP request` 底层细节一样无聊。比如，你打算用这些关于你\
  \ IP 的知识做什么呢？然而，这个示例隐藏了一些与你即将学习的内容相关的酷炫底层细节。这里有一个预览：我们有一些 JavaScript 代码向一个服务（`ipinfo.io`）发送\
  \ `HTTP request`，该服务会返回关于你连接的大量数据。使用 JavaScript，我们处理了所有返回的数据，并精准地定位到我们在这里自豪地展示的\
  \ IP 地址。\n\n不知道你怎么想，但我非常期待看到这一切汇聚在一起。当你到达教程的结束时，你也将创建一个与此示例类似的东西，并学习到让它运行的底层发生了一切。\n\
  \n### 认识 Fetch\n\n发送 `HTTP requests` 的最新新成员是 `fetch` API。要以最基本的形式使用 `fetch`，我们只需要提供要发送请求的\
  \ URL。一旦请求发出，就会返回一个我们可以对其进行处理的响应。为了将这些词汇付诸行动，让我们写一些代码并让我们先前的示例运行起来。\n\n#### 深入代码\n\
  \n如果你想跟着操作，请创建一个新的 HTML 文档并在其中添加以下标记：\n\n点击此处查看代码图像\n\n```\n<!DOCTYPE html>\n<html>\n\
  \n<head>\n  <title>显示 IP 地址</title>\n</head>\n\n<body>\n  <script>\n\n  </script>\n\
  \n</body>\n\n</html>\n```\n\n在`<script>` 标签内部，添加以下构成我们 Web 请求的代码：\n\n点击此处查看代码图像\n\
  \n```\nfetch(\"https://ipinfo.io/json\")\n  .then(function (response) {\n    return\
  \ response.json();\n  })\n  .then(function (myJson) {\n    console.log(myJson.ip);\n\
  \  })\n  .catch(function (error) {\n    console.log(\"Error: \" + error);\n  });\n\
  ```\n\n一旦你添加了这些行，保存更改并在浏览器中测试你的页面。你不会在屏幕上看到任何显示，但如果你通过浏览器开发者工具打开控制台，你应该能看到你的 IP\
  \ 地址被显示：\n\n![images](img/44UN02.jpg)\n\n这有点意思！现在你已经将 IP 地址显示在控制台中，让我们花点时间回顾一下代码，看看它具体在做什么。通过我们的第一行代码，我们正在调用\
  \ `fetch` 并提供我们想要发送请求的 URL：\n\n点击此处查看代码图像\n\n```\nfetch(\"https://ipinfo.io/json\"\
  )\n  .then(function (response) {\n    return response.json();\n  })\n  .then(function\
  \ (myJson) {\n    console.log(myJson.ip);\n  })\n  .catch(function (error) {\n \
  \   console.log(\"Error: \" + error);\n  });\n```\n\n我们发送请求的 URL 是 `ipinfo.io/json`。一旦运行这行代码，运行在\
  \ `ipinfo.io` 上的服务将向我们发送一些数据。处理这些数据取决于我们，而接下来的两个 `then` 块负责这些：\n\n点击此处查看代码图像\n\n\
  ```\nfetch(\"https://ipinfo.io/json\")\n  .then(function (response) {\n    return\
  \ response.json();\n  })\n  .then(function (myJson) {\n    console.log(myJson.ip);\n\
  \  })\n  .catch(function (error) {\n    console.log(\"Error: \" + error);\n  });\n\
  ```\n\n需要强调的一个非常重要的细节是 `fetch` 返回的响应是一个 `promise`。这些 `then` 块是 promise 异步工作的方式，允许我们处理结果。涵盖\
  \ promise 超出了本章的范围，但以下 MDN 文档对它们的解释得非常好：[`developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises)\n\
  \n现在只需要知道我们有一个 `then` 块链，每个块在上一个块完成后会自动被调用。因为这一切都是异步的，所以一切在我们应用程序的其他部分运行的同时都在后台完成。我们不需要做任何额外工作来确保我们的请求代码在等待缓慢的网络结果或处理大量数据时不会阻塞或冻结我们的应用程序。\n\
  \n回到代码，在我们的第一个 `then` 块中，我们指定了想要 `fetch` 调用返回的原始 JSON 数据：\n\n点击此处查看代码图像\n\n```\n\
  fetch(\"https://ipinfo.io/json\")\n  .then(function (response) {\n    return response.json();\n\
  \  })\n  .then(function (myJson) {\n    console.log(myJson.ip);\n  })\n  .catch(function\
  \ (error) {\n    console.log(\"Error: \" + error);\n  });\n```\n\n\n\n\n\n在下一个 `then`\
  \ 块中（它在上一个块完成后后被调用），我们将进一步处理返回的数据，通过缩小范围找到提供 IP 地址的属性，然后将其打印到控制台：\n\n点击此处查看代码图片\n\
  \n```\nfetch(\"https://ipinfo.io/json\")\n   .then(function (response) {\n     return\
  \ response.json();\n   })\n   .then(function (myJson) {\n     console.log(myJson.ip);\n\
  \   })\n   .catch(function (error) {\n     console.log(\"Error: \" + error);\n \
  \  });\n```\n\n我们如何知道 IP 地址会存储在返回的 JSON 数据的 `ip` 属性中？最简单的方法是参考 `ipinfo.io` 的开发者文档（[`ipinfo.io/developers/responses#full-response`](https://ipinfo.io/developers/responses#full-response)）！每个\
  \ Web 服务在被请求时都有其自己的返回数据格式。我们需要自己花一点时间来弄清楚响应的样式、我们可能需要作为请求的一部分传递哪些参数来调整响应，以及我们需要如何编写代码来获取所需的数据。作为阅读开发者文档的替代方案，你始终可以通过开发者工具检查请求返回的响应。使用任何对你方便的方法即可。\n\
  \n我们的代码还没有写完。有时 promise 会导致错误或响应失败。当发生这种情况时，我们的 promise 将停止继续执行 `then` 块链，转而寻找 `catch`\
  \ 块。此时，`catch` 块中的代码将执行。我们的 `catch` 块看起来如下：\n\n点击此处查看代码图片\n\n```\nfetch(\"https://ipinfo.io/json\"\
  )\n   .then(function (response) {\n     return response.json();\n   })\n   .then(function\
  \ (myJson) {\n     console.log(myJson.ip);\n   })\n   .catch(function (error) {\n\
  \     console.log(\"Error: \" + error);\n   });\n```\n\n我们对错误处理并没有做什么突破性的工作，只是将错误消息打印到控制台。\n\
  \n### 总结示例\n\n我们现在拥有的是一个空白页面，其中 IP 地址被打印到控制台上。让我们继续添加一些缺失的细节，让当前的页面看起来像我们在章节开头看到的示例那样。在我们当前的\
  \ HTML 文档中，进行以下高亮更改：\n\n点击此处查看代码图片\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Display\
  \ IP Address</title>\n  <style>\n    body {\n      background-color: #FFCC00;\n\
  \    }\n    h1 {\n      font-family: sans-serif;\n      text-align: center;\n  \
  \    padding-top: 140px;\n      font-size: 60px;\n      margin: -15px;\n    }\n\
  \    p {\n      font-family: sans-serif;\n      color: #907400;\n      text-align:\
  \ center;\n    }\n  </style>\n</head>\n<body>\n  <h1 id=ipText></h1>\n  <p>( This\
  \ is your IP address...probably :P )</p>\n  <script>\n    fetch(\"https://ipinfo.io/json\"\
  )\n      .then(function (response) {\n        return response.json();\n      })\n\
  \      .then(function (myJson) {\n        document.querySelector(\"#ipText\").innerHTML\
  \ = myJson.ip;\n      })\n      .catch(function (error) {\n        console.log(\"\
  Error: \" + error);\n      });\n  </script>\n</body>\n</html>\n```\n\n这里最大的变化是添加了\
  \ HTML 元素来提供结构，并使用了 CSS 使其看起来美观。注意我们还修改了 `then` 块的功能。我们不再将 IP 地址打印到控制台，而是在 `ipText`\
  \ 元素内部显示 IP 地址。\n\n\n\n\n\n*   第一个参数指定了使用哪种 HTTP 方法来处理你的请求。你可以指定的值有 `GET`、`PUT`、`POST`\
  \ 和 `DELETE`。在我们的情况下，我们对接收信息感兴趣，所以我们指定的第一个参数将是 `GET`。\n\n*   接下来，你指定要发送请求的 URL。这些\
  \ URL 是定义良好的端点（endpoints），它们知道当 HTTP 请求飞过它们时该做什么。对于我们的 IP 示例，我们指定的路径是 `ipinfo.io/json`。\n\
  \n*   最后一个参数指定了你是否希望你的请求异步运行。此值应被设置为 `true`。异步运行请求将确保你的页面具有响应性，并且在你的 HTTP 请求花费时间传输时，你的其他代码可以继续运行。在此时，将此值设置为\
  \ `false` 将被大多数浏览器忽略，所以……就是这样。\n\n*   我之前提到的“三个左右的参数”中的“-ish”部分，是指用户名和密码的参数。通常情况下，你不会希望在像\
  \ JavaScript 文件这样显而易见的地方指定你的用户名和密码，所以你可能永远不需要设置比你已经看到的三个更多的参数。\n\n### 发送请求\n\n到目前为止，我们已经初始化了\
  \ `XMLHttpRequest` 对象并构建了请求。我们还没有发送请求，但那由下一行来处理：\n\n点击此处查看代码图像\n\n```\nlet xhr =\
  \ new XMLHttpRequest();\n\nxhr.open('GET', \"https://ipinfo.io/json\", true);\n\n\
  xhr.send(); \n```\n\n`send` 方法负责发送请求。如果你将请求设置为异步（而且你不这么做呢？！），`send` 方法会立即返回，你的其他代码将继续运行。这正是我们想要的行为。\n\
  \n### 异步内容与事件\n\n当某些代码异步异步运行时，你完全不知道这些代码何时会带着消息返回。在我们所做的事情中，一旦 HTTP 请求已发送，我们的代码就不会停止并等待请求返回。我们的代码会一直运行。我们需要一种方法来发送请求，然后在请求返回时通知我们，以便我们的代码能够完成它开始的工作。\n\
  \n为了满足这一需求，我们有了**事件（events）**。具体到我们的情况，这就是为什么我们有一个 `readystatechange` 事件，每当我们的请求在它的史诗级旅程中到达一个重要的里程碑时，我们的\
  \ `XMLHttpRequest` 对象就会触发该事件。\n\n要设置这一切，请添加下面高亮的行，它调用了万能的 `addEventListener`：\n\n\
  点击此处查看代码图像\n\n```\nlet xhr = new XMLHttpRequest();\n\nxhr.open('GET', \"https://ipinfo.io/json\"\
  , true);\n\nxhr.send();\n\nxhr.addEventListener(\"readystatechange\", processRequest,\
  \ false); \n```\n\n这一行看起来和你你写过的很多次其他事件监听代码无异。我们在 `xhr` 对象上监听 `readystatechange`\
  \ 事件，并在监听到该事件时调用 `processRequest` 事件处理器。这里就是一些有趣事情发生的地方！\n\n### 处理请求\n\n这应该是很容易的对吧？我们已经准备好了事件监听器，我们需要的只是\
  \ `processRequest` 事件处理器，我们可以在其中添加一些代码来读取返回的结果。让我们先添加我们的事件处理器吧：\n\n点击此处查看代码图像\n\n\
  ```\nlet xhr = new XMLHttpRequest();\n\nxhr.open('GET', \"https://ipinfo.io/json\"\
  , true);\n\nxhr.send();\n\nxhr.onreadystatechange = processRequest;\n\nfunction\
  \ processRequest(e) {                                                          \
  \   \n} \n```\n\n接下来，我们只需要一些代码来在我们新添加的事件处理器内部解析 HTTP 请求的结果。\n\n事实证明，这并没有那么简单。复杂性源于\
  \ `readyState-change` 事件绑定到了我们 `XMLHttpRequest` 对象的 `readyState` 属性上。`readyState`\
  \ 属性记录了我们 HTTP 请求所经过的路径，其值的每次变化都会导致 `readystatechange` 事件被触发。我们的 `readyState` 属性究竟代表什么，导致它的值如此频繁地变化？查看图\
  \ 44.1：\n\n![images](img/44fig01.jpg)\n\n图 44.1\n\n`readyState` 返回的值，用于告诉我们请求正在做什么\n\
  \n对于我们制作的每一个 HTTP 请求，我们的 `readyState` 属性都会遇到这五个值中的每一个值。这意味着我们的 `readystatechange`\
  \ 事件会被触发五次。结果，我们的 `processRequest` 事件处理器也会被调用五次。发现问题了吗？在 `processRequest` 被调用的五次中，有四次它并不是因为我们感兴趣的原因而被调用的——也就是说，请求已经返回，是时候分析返回的数据了。\n\
  \n由于我们的目标是在请求完成后读取返回的值，因此 `readyState` 值为 `4` 时是我们的朋友。我们需要确保只有当此值被设置时才继续执行，所以为了处理这种情况，修改后的\
  \ `processRequest` 函数看起来是这样的：\n\n点击此处查看代码图像\n\n```\nfunction processRequest(e) {\n\
  \n    if (xhr.readyState == 4) {\n        // time to partay!!!\n    }\n}\n```\n\n\
  \n\n\n\n```json\n{\n  \"ip\": \"52.41.128.211\",\n  \"hostname\": \"static-52-41-128-211.blve.wa.verizon.net\"\
  ,\n  \"city\": \"Redmond\",\n  \"region\": \"Washington\",\n  \"country\": \"US\"\
  ,\n  \"loc\": \"46.6104,-121.1259\",\n  \"org\": \"Verizon, Inc\",\n  \"postal\"\
  : \"98052\"\n}\n```\n\n为了将我们的类 JSON 字符串转换为真实的 JSON 对象，我们把 `xhr.responseText` 的结果传递给\
  \ `JSON.parse` 方法。该方法会将我们的 JSON 数据字符串转换为一个存储在 `response` 变量中的真实 JSON 对象。从那里开始，显示\
  \ IP 就像高亮行所示的那样简单：\n\n点击此处查看代码图片\n\n```javascript\nfunction processRequest(e) {\n\
  \     if (xhr.readyState == 4 && xhr.status == 200) {\n         let response = JSON.parse(xhr.responseText);\n\
  \         document.querySelector(\"#ipText\").innerHTML = response.ip;         \
  \              \n     }\n}\n```\n\n我不会在这一节上花费太多时间，因为我不希望这变成一场关于 `ipinfo.io` 服务器如何返回数据的讨论。正如我们之前看到的\
  \ `fetch` 一样，我们向每个服务器发送 HTTP 请求时，它们都会以略有不同的方式发送数据，而且每个服务器都可能需要你跳过稍微不同的障碍才能获取你想要的内容。并没有一种通用的解决方案可以预备你未来所有的\
  \ HTTP 请求需求，除非你去阅读你想要获取数据的 Web 服务的文档。\n\n# 45. 访问摄像头\n\n## 本章内容\n\n* 学习如何访问摄像头\n\
  * 学习如何获取摄像头的输出并将其显示在我们的页面上\n\n过去，通过浏览器访问摄像头需要使用插件（请原谅我的用词不雅）。没错。为了连接到摄像头并获取其视频流的权限，你必须依赖主要在\
  \ Flash 或 Silverlight 中创建的东西。虽然这种方法对于支持插件的浏览器确实有效，但对于日益增加的旨在无插件化的浏览器来说却毫无帮助。这种在不依赖第三方组件的情况下无法原生访问摄像头的能力，无疑是\
  \ HTML 开发史上的一个空白——特别是在移动设备上。至少，直到最近一直是这样。\n\nW3C 一直试图通过鼓励浏览器厂商实现 `Media Capture\
  \ and Streams`媒体捕获与流）规范概述的提案（[`w3c.github.io/mediacapture-main/getusermedia.html`](https://w3c.github.io/mediacapture-main/getusermedia.html)）来填补这一空白。该规范定义了如何使用少量\
  \ JavaScript 与摄像头设备通信。好消息是，尽管它非常新，但几乎所有现代移动和桌面浏览器都支持这一规范。\n\n当你完成本章时，你将学会如何获取你摄像头的视频流并将其显示在你的网页中。\n\
  \n### 示例\n\n在继续之前，让我们先来看一个与你将创建的内容相同的示例。导航到以下 URL 查看实时示例：`[`bit.ly/webcamJS`](https://bit.ly/webcamJS)`。\n\
  \n你应该能看到如下的内容（希望画面里是你而不是我！）：\n\n![images](img/45UN01.jpg)\n\n能够访问摄像头的一个关键部分是处理浏览器将显示的权限提示，类似于图\
  \ 45.1 中所示。\n\n![images](img/45fig01.jpg)\n\n图 45.1\n\n权限提示！\n\n如果你在查看示例时无意（或刻意）拒绝了权限，只需重新加载页面即可再次尝试通过此测试。\n\
  \n### 工作原理概述\n\n为了帮助更容易编写这些代码，让我们用通俗易懂的语言概述一下它的运作原理。有两个组件在将你的摄像头数据显示在屏幕上的过程中承担了大部分工作。它们是\
  \ HTML video 元素和 JavaScript 的 `getUserMedia` 函数：\n\n![images](img/45UN02.jpg)\n\n\
  video 元素的功能非常直接。它负责从你的摄像头获取视频流并将其显示在屏幕上。\n\n有趣的部分是 `getUserMedia` 函数。该函数允许你做三件事：\n\
  \n* 指定你想从摄像头获取视频数据、从麦克风获取音频数据，还是两者兼有。\n* 如果用户授予了访问摄像头的权限，指定要调用的 `success` 函数，你可以在其中进一步处理摄像头数据。\n\
  * 如果用户没有授予访问摄像头的权限，或者你的摄像头遇到了其他类型的错误，指定一个 `error` 函数来处理错误情况。\n\n对于我们要尝试的操作，我们调用\
  \ `getUserMedia` 函数并告诉它只检索摄像头的视频。我将来会介绍麦克风！一旦获取了视频，我们就告诉 success 函数将视频数据发送到我们的 video\
  \ 元素以便在屏幕上显示。\n\n如果这听起来非常简单，那是因为它确实简单。让我们付诸实践。\n\n### 添加代码\n\n在这一节中，让我们先添加所需的 HTML\
  \ 和 CSS。首先，让我们添加基础结构：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
  utf-8\">\n<title>显示摄像头流</title>\n<style>\n#container {\n     margin: 0 auto;\n \
  \    width: 500px;\n}\n\n#videoElement {\n     width: 500px;\n     height: 375px;\n\
  }\n</style>\n</head>\n<body>\n<div id=\"container\">\n  <video autoplay=\"true\"\
  \ id=\"videoElement\"></video>\n</div>\n\n<script>\n</script>\n</body>\n</html>\n\
  ```\n\n我们的 `<video>` 标签有一个 `id` 为 `videoElement`，它的 `autoplay` 属性设置为 `true`。通过将\
  \ `autoplay` 属性设置为 `true`，一旦我们获得摄像头流，视频就会自动开始。现在添加 JavaScript：\n\n```javascript\n\
  let video = document.querySelector(\"#videoElement\");\n\nif (navigator.mediaDevices.getUserMedia)\
  \ {\n  navigator.mediaDevices.getUserMedia({ video: true })\n    .then(function\
  \ (stream) {\n      video.srcObject = stream;\n    })\n    .catch(function (error)\
  \ {\n      console.log(\"出问题了!\");\n    });\n}\n```\n\n### 代码检查\n\n现在你已经有一个运行的示例，让我们逐行检查代码，以理解之前的概述是如何对应你刚刚添加的代码。\n\
  \n让我们从顶部开始：\n\n```javascript\nlet video = document.querySelector(\"#videoElement\"\
  );\n```\n\n接下来是我们访问 `getUserMedia` API 的代码：\n\n\n\n\n\n点击此处查看代码图像\n\n```\nif (navigator.mediaDevices.getUserMedia)\
  \ {\n  navigator.mediaDevices.getUserMedia({ video: true })\n    .then(function\
  \ (stream) {\n      video.srcObject = stream;\n    })\n    .catch(function (err0r)\
  \ {\n      console.log(\"Something went wrong!\");\n    });\n}\n```\n\n`getUserMedia`\
  \ 方法被大多数浏览器支持，但在开始访问其属性之前先进行检查并没有坏处。这个 `if` 语句确保了只有在 `getUserMedia` 确实被支持时，我们的媒体相关代码才会运行。\n\
  \n我们代码的其他部分负责访问摄像头并将视觉流传输到屏幕。在深入查看之前，让我们先退一步，讨论一下 `getUserMedia` 实际上是如何工作的。它接收一个参数，指定了被称为\
  \ `constraints`（约束）的内容。约束允许你控制许多内容，例如是否允许视频、是否允许音频、视频尺寸的大小、是否倾向于使用前摄像头而非后摄像头、视频帧率等。你只需要用对象和属性来表示这些约束。没什么复杂的。\n\
  \n在我们的代码中，你可以从下面的代码中看到约束的用法：\n\n点击此处查看代码图像\n\n```\nif (navigator.mediaDevices.getUserMedia)\
  \ {\n  navigator.mediaDevices.getUserMedia({ video: true })\n    .then(function\
  \ (stream) {\n      video.srcObject = stream;\n    })\n    .catch(function (err0r)\
  \ {\n      console.log(\"Something went wrong!\");\n    });\n}\n```\n\n我们告诉 `getUserMedia`\
  \ 的仅仅是指定一个约束对象，其 `video` 属性被设置为 `true`。这意味着在捕获和显示视觉效果时将使用默认设置。这并不是设置最令人兴奋的约束，但它能完成任务。要查看你可以指定的完整范围的约束，请参考以下关于\
  \ `getUserMedia` 的 MDN 文章，它详细阐述了所有有趣的细节：**[`developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia`](https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia)**。\n\
  \n除了约束之外，我们还需要了解关于 `getUserMedia` 方法的另一个非常重要的细节。它返回一个 promise，解析后类型为 `MediaStream`\
  \ 对象。当 promise 成功解析时，你可以访问底层的媒体流并执行任何额外的操作。\n\n在我们的代码中，我们保持了简单，仅将我们的流设置到视频元素的 `srcObject`\
  \ 属性：\n\n点击此处查看代码图像\n\n```\nif (navigator.mediaDevices.getUserMedia) {\n  navigator.mediaDevices.getUserMedia({\
  \ video: true })\n    .then(function (stream) {\n      video.srcObject = stream;\n\
  \    })\n    .catch(function (err0r) {\n      console.log(\"Something went wrong!\"\
  );\n    });\n}\n```\n\n发生任何失败，`catch` 块将介入。\n\n![Images](img/tip.jpg) 提示\n\n###\
  \ 停止摄像头流\n\n如果你想停止摄像头流，你需要一些如下所示的代码：\n\n点击此处查看代码图像\n\n```\nfunction stop(e) {\n\
  \  let stream = video.srcObject;\n  let tracks = stream.getTracks();\n  for (let\
  \ i = 0; i < tracks.length; i++) {\n    let track = tracks[i];\n    track.stop();\n\
  \  }\n  video.srcObject = null;\n}\n```\n\n参见线程 **[`bit.ly/stopWebcamStream`](https://bit.ly/stopWebcamStream)**，它更详细地介绍了你应该做什么，并提供了一个可运行的示例。\n\
  \n## 46\n\n## 数组和对象解构\n\n## 本章内容\n* 学习解构的基础知识\n* 理解如何从数组和对象解包变量\n\nJavaScript 的许多改进都围绕着添加缺失的功能，例如能够访问摄像头、使用如\
  \ sets 等酷酷的新数据结构、以更具创意的方式与 DOM 交互等。某些改进纯粹是为了方便。我们经常执行的许多非常不方便的 JavaScript 任务，这些任务要么需要太多的代码，要么需要太多的“陷阱”才能正常工作。其中一项任务涉及从数组或对象中获取值并将其存储在变量中。允许我详细说明一下。假设我们有一个数组，它包含以下项：\n\
  \n点击此处查看代码图像\n\n```\nlet winners = [\"bear\", \"cat\", \"dog\", \"giraffe\", \"\
  unicorn\"];\n```\n\n我们想要存储此数组中的前三个项。我们使用的常用方法看起来如下：\n\n点击此处查看代码图像\n\n```\nlet winners\
  \ = [\"bear\", \"cat\", \"dog\", \"giraffe\", \"unicorn\"];\nlet firstPlace = winners[0];\n\
  let secondPlace = winners[1];\nlet thirdPlace = winners[2];\nconsole.log(firstPlace);\
  \ // bear\nconsole.log(secondPlace); // cat\n```\n\n如果我们想将数组中的每个项都存储在自己的变量中，数组中的剩余项可以使用扩展运算符\
  \ `...` 来存储。这同样适用于对象，我们可能想将某些属性存储在自己的变量中，如下所示：\n\n点击此处查看代码图像\n\n```\nlet returnedData\
  \ = {\n    \"id\": 54901,\n    \"name\": 2000,\n    \"price\": 5.00,\n    \"inStock\"\
  : false,\n    \"inventor\": \"Dr. Atom\"\n};\nlet productID = returnedData.id;\n\
  let inventor = returnedData.inventor;\nconsole.log(productID); // 54901\nconsole.log(inventor);\
  \ // Dr. Atom\n```\n\n随着我们的 Web 应用变得数据密集型，访问数据的传统方法可能会变得笨拙。这就是本章主角登场的地方：**解构**。解构的核心在于轻松地从数组或对象中的数据块将其解包到变量中。我们将在后续章节中查看具体内容。\n\
  \n### 解构示例\n\n解构背后的概念并不深，因此学习如何工作的最好的方法是查看涵盖数组和对象的示例。\n\n#### 数组概览\n\n回到我们开始的数组示例\n\
  \n点击此处查看代码图像\n\n```\nlet winners = [\"bear\", \"cat\", \"dog\", \"giraffe\", \"\
  unicorn\"];\n```\n\n如果我们想将数组中的前三个项存储在自己的变量中，这是我们通过解构实现的方式：\n\n点击此处查看代码图像\n\n```\n\
  let winners = [\"bear\", \"cat\", \"dog\", \"giraffe\", \"unicorn\"];\nlet [firstPlace,\
  \ secondPlace, thirdPlace] = winners;\nconsole.log(firstPlace); // bear\nconsole.log(secondPlace);\
  \ // cat\nconsole.log(thirdPlace); // dog\n```\n\n我们使用这种数组类的语法作为变量声明的一部分，定义三个变量（`firstPlace`、`secondPlace`、`thirdPlace`），用于存储\
  \ `winners` 数组中的前三个项。之前提到的另一个活动是我们如何存储数组不在第一、第二或第三位置的剩余项。嗯，事实证明，有一个名为扩展运算符 (`...`)\
  \ 的特殊运算符允许我们非常轻松地做到这一点：\n\n点击此处查看代码图像\n\n```\nlet winners = [\"bear\", \"cat\",\
  \ \"dog\", \"giraffe\", \"unicorn\"];\nlet [firstPlace, secondPlace, thirdPlace,\
  \ ...others] = winners;\nconsole.log(firstPlace); // bear\nconsole.log(secondPlace);\
  \ // cat\nconsole.log(thirdPlace); // dog\nconsole.log(others); // [giraffe, unicorn,\
  \ dinosaur]\n```\n\n\n\n\n\n注意，我们使用了 `…others` 表达式，其中我们将展开运算符（`…`）与一个名为 `others`\
  \ 的变量配对。输出结果是 `firstPlace`、`secondPlace` 和 `thirdPlace` 映射后剩余的数组值。\n\n如果我们必须可视化所有内容，将会看到类似于图\
  \ 46.1 所示的内容。\n\n![images](img/46fig01.jpg)\n\n图 46.1\n\n变量和展开运算符如何映射到存储在数组中的数据的可视化图示！\n\
  \n非常酷，对吧？现在，我们看到的是关于解构面貌以及我们将要依赖的语法的简要介绍。接下来，我们将进一步深入，并查看更多涉及我们可能遇到的边缘情况的示例。\n\n\
  ### 使用逗号跳过项目\n\n我们已经大致看到了逗号在解构中起的重要作用。每个变量都用逗号隔开，逗号有助于指示我们何时按顺序从数组中的一个项跳转到下一个项。如果我们想跳过某个项不赋值给变量，这个知识就非常有用。要跳过一个项（或多个项），我们需要指定一个逗号，但没有与逗号配对的变量。\n\
  \n看下面的示例：\n\n点击此处查看代码图像\n\n```\nlet [a, , b] = [1, 2, 3, 4, 5, 6, 7];\n\nconsole.log(a);\
  \ // 1\n\nconsole.log(b); // 3\n```\n\n注意，我们在 `a` 变量之后指定了一个空逗号。这最终表现为两个逗号，结果是只映射了第一项和第三项。由于没有变量来存储第二个项，因此第二个项被跳过了。\n\
  \n### 当变量多于数据时\n\n有时，我们尝试映射的变量可能比用于映射的数据要多。看下面的示例：\n\n点击此处查看代码图像\n\n```javascript\n\
  let [first, second, third] = [\"Homer\", \"Marge\"];\nconsole.log(first); // \"\
  Homer\"\nconsole.log(second); // \"Marge\"\nconsole.log(third); // undefined\n```\n\
  \n我们正尝试解包到变量的数组只有两个项，但我们有三个变量。当一个变量没有关联任何数据时，该变量会被赋予 `undefined` 值。这正是在我们检查第三个变量的值时所看到的情况。\n\
  \n如果 `undefined` 值不符合意愿，我们可以指定一个默认值来覆盖该行为：\n\n点击此处查看代码图像\n\n```javascript\nlet [first,\
  \ second, third = \"Person\"] = [\"Homer\", \"Marge\"];\nconsole.log(first); //\
  \ Homer\n\nconsole.log(second); // Marge\n\nconsole.log(third); // Person\n```\n\
  \n在这个变体中，请注意 `third` 的值被设置为默认值 `Person`，因为在数组中它没有定义的值。\n\n### 分离声明和赋值\n\n就像我们在处理变量时可以分离声明和赋值操作一样，在进行解构时也可以这样做。不过，我要提醒你，这起初看起来会有点奇怪，但它是完全合法的：\n\
  \n```\nlet foo;\nlet bar;\n\n[foo, bar] = [1, 2];\n\nconsole.log(foo) // 1\n\nconsole.log(bar)\
  \ // 2\n```\n\n注意，我们先声明了 `foo` 和 `bar` 变量，然后在解构数组内容时再给这些变量赋值。\n\n#### 对象的解构\n\n\
  在过去的几节中，我们看到了解构是如何作用于数组的。解构同样适用于对象，我们之前看到的很多内容都完全适用于这个对象化的世界。看下这个对象：\n\n```javascript\n\
  let chair = {\n  brand: \"Le Chair\",\n  legs: \"4\",\n  material: \"Wood\",\n \
  \ inventory: \"42\",\n  price: \"$29.99\",\n  color: \"Blue\"\n};\n```\n\n我们有一个名为\
  \ `chair` 的对象，它包含许多属性。如果我们只想提取并存储 `brand` 和 `price` 属性属性的值，可以通过解构来实现：\n\n点击此处查看代码图像\n\
  \n```javascript\nlet chair = {\n  brand: \"Le Chair\",\n  legs: \"4\",\n  material:\
  \ \"Wood\",\n  inventory: \"42\",\n  price: \"$29.99\",\n  color: \"Blue\"\n};\n\
  \nlet {brand, price} = chair;\n\nconsole.log(brand); // \"Le Chair\"\n\nconsole.log(price);\
  \ // \"$29.99\"\n```\n\n在变量声明和赋值中，我们声明了两个名为 `brand` 和 `price` 的变量，它们的名称与我们解包的对象内部的属性名匹配。结果是，我们可以将\
  \ `brand` 和 `price` 属性存储的值作为它们各自独立的变量来使用。\n\n正如我们看到的，我们的 `chair` 对象包含的属性比 `brand`\
  \ 和 `price` 多。如果我们想在进行任何手动记账的情况下访问剩余属性，可以使用展开运算符：\n\n点击此处查看代码图像\n\n```javascript\n\
  let chair = {\n  brand: \"Le Chair\",\n  legs: \"4\",\n  material: \"Wood\",\n \
  \ inventory: \"42\",\n  price: \"$29.99\",\n  color: \"Blue\"\n};\n\nlet {brand,\
  \ price, ...rest} = chair;\n\nconsole.log(brand); // \"Le Chair\"\n\nconsole.log(price);\
  \ // \"$29.99\"\nconsole.log(rest); // {legs: \"4\", material: \"Wood\", inventory:\
  \ \"42\", color: \"Blue\"}\n```\n\n### 数组与对象解构的区别\n\n在解构的完美世界里，我们看到的对象与之前看到的数组之间的区别有三点：\n\
  \n- 数组的解构赋值涉及方括号：\n  ```javascript\n  let [a, b] = [1, 2]\n  ```\n  对象的解构赋值涉及大花括号：\n\
  \  ```javascript\n  let {a, b} = {a: 1, b: 2}\n  ```\n\n- 对于数组，赋值时的变量名顺序映射到项的顺序。对于对象，顺序并不重要。变量名决定了哪些属性值被映射。\n\
  \n- 对于数组，展开运算符返回一个从我们已映射项之后的新数组。对于对象，展开运算符返回一个由尚未映射的属性组成的新对象。\n\n还有一些其他区别，但这些是主要的。\n\
  \n### 赋值给新变量名\n\n在之前的代码段中，变量名映射到对象内部访问的属性名。这是默认行为，但我们通常可能想要与对象内部解耦的不同名称。幸运的是，我们有这种方法。看下面的示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nlet chair = {\n  brand: \"Le Chair\",\n  legs: \"\
  4\",\n  material: \"Wood\",\n  inventory: \"42\",\n  price: \"$29.99\",\n  color:\
  \ \"Blue\"\n};\n\nlet {brand, price: cost} = chair;\n\nconsole.log(brand); // \"\
  Le Chair\"\n\nconsole.log(cost); // \"$29.99\"\n```\n\n注意我们的解构赋值。看到我们将 `price` 属性映射到我们尝试访问的\
  \ `chair` 对象的值，*但*我们将变量名重映射为 `cost`。我们通过在映射到对象属性名的变量和我们指定的新变量名之间使用冒号来实现这一点。这段代码的最终结果是，可以使用\
  \ `cost` 变量来访问 `price` 属性的值，而不是使用 `price` 名称。\n\n\n\n\n\n正如解构赋值这种通用的功能一样，它涵盖的非寻常（但非常重要）的场景比我们在这里介绍的要多得多。关于在数组和对象中看到的所有解构赋值奇淫操作的完整列表，MDN\
  \ 关于此主题的文档是完美的：[`mzl.la/3I2Lbre`](https://mzl.la/3I2Lbre)。\n\n# 47\n\n# 使用 Web Storage\
  \ 存储数据\n\n## 本章内容\n* 学习如何使用 Web Storage API 在页面上持久化数据\n* 了解存储、检索等基础知识\n\n就像拉斯维加斯一样，你在网页上所做的一切通常都会留在该网页上。假设你有一个简单的应用程序（[`bit.ly/kirupa_todo`](https://bit.ly/kirupa_todo）），允许你维护一个待办列表：\n\
  \n![images](img/47UN01.jpg)\n\n如果你不小心导航到另一个页面或关闭了该页面的标签页，当你返回此页面时的默认行为将是清空待办列表。\n\
  \n网页默认不会持久化数据。幸运的是，你有许多方法可以解决这个问题。在本章中，我们将介绍我最喜欢的存储数据的方法之一，依赖于所谓的 Web Storage API。这个\
  \ API 允许你只编写几行代码就能处理许多棘手的存储情况，所以这将是一个有趣的课题！\n\n## Web Storage 的工作原理\nWeb Storage\
  \ API 听起来复杂又可怕，但它实际上非常容易对付。它通过两个全局对象（挂载在 `window` 上）——`localStorage` 和 `sessionStorage`\
  \ 向我们暴露。你可以使用这两个对象来指定要存储什么数据，以及要检索、更新、永久删除以及执行许多其他存储相关的活动。让我们深入理解一下内部发生了什么。\n\n\
  #### 内部到底发生了什么\n为了简单起见，我不会同时关注本地存储和会话存储。它们非常相似，所以我决定掷硬币来选择……我们的 `localStorage` 对象。\n\
  \n![images](img/47UN02.jpg)\n\n如果你看一眼这个对象的内部，你会看到一个为存储数据设计的运行良好的机器。它通过将数据整齐地组织成键值对（key\
  \ and value pairs）来存储数据。如果你不熟悉这种方法，请看下面的可视化图：\n\n![images](img/47UN03.jpg)\n\n我正在存储关于我最喜欢的卡通角色之一的信息，我想要存储的数据通过一个易于识别的键值进行索引。具体来说，你可以看到我存储了三条数据：\n\
  \n* 键为 `firstName`，值为 Bugs\n* 键为 `lastName`，值为 Bunny\n* 键为 `location`，值为 Earth\n\
  \n键（key）作为标识符，值（value）是与之关联的数据。你很快就会发现，使用我们的存储对象执行的几乎所有操作都会涉及键、值或两者！\n\n#### Web\
  \ Storage 数据与你的域名绑定\n我们的解释快要结束了。在我们开始查看代码之前，你还需要知道的最后一个细节。你通过 Web Storage API 执行的所有操作都与运行你代码的域名绑定。这种程度的隔离确保了你不会无意中（或故意地！）修改第三方网站可能已经在你的存储中设置的任何数据。换句话说，我在\
  \ [kirupa.com](http://kirupa.com) 上存储的任何数据对于运行在 [google.com](http://google.com)\
  \ 上的代码都是无法访问的，反之亦然。如果你希望使用本地或会话存储来跨不同域名的多个站点持久化某些数据，那么你就没机会了！\n\n## 让你的代码运行\n现在你已经对\
  \ Web Storage 如何工作有了基本的了解，让我们看看对它进行各种数据操作的代码。如果你想跟上，你只需要一个带有 `<script>` 标签的空 HTML\
  \ 页面：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Local\
  \ Storage</title>\n</head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n\
  ```\n\n我们在这里进行的操作没有用户界面（UI），因此所有操作都是使用浏览器开发工具检查我们的 `localStorage` 或 `sessionStorage`\
  \ 对象的状态。\n\n#### 添加数据\n如果你以前从未对本地存储做过任何操作，让我们从向其中添加一些数据开始。你用于添加数据的方法存在于你的 `localStorage`\
  \ 对象上，它被称为 `setItem`。这个方法（意料不用）接受由你的键和值组成的两个参数：\n\n点击此处查看代码图像\n\n```javascript\n\
  localStorage.setItem(\"key\", \"value\");\n```\n\n这是一个 `setItem` 方法的运行示例，我在撰写这段文字时，正在存储我正在听的（超级酷的！）音乐的详情：\n\
  \n点击此处查看代码图像\n\n```javascript\nlocalStorage.setItem(\"artist\", \"Tycho\");\nlocalStorage.setItem(\"\
  album\", \"Awake\");\nlocalStorage.setItem(\"track\", \"Apogee\");\nlocalStorage.setItem(\"\
  year\", \"2014\");\n```\n\n在每一行代码中，我们通过 `setItem` 向 `localStorage` 推入数据。在执行完这些代码后，`localStorage`\
  \ 中的数据可视化所示：\n\n![images](img/47UN04.jpg)\n\n正如你看到的，我们通过 `setItem` 并指定键来添加条目。如果你指定了一个已有的键，该键指向的值将被覆盖：\n\
  \n点击此处查看代码图像\n\n```javascript\n// 覆盖某些数据\nlocalStorage.setItem(\"track\", \"L\"\
  );\n```\n\n现在，这里有一个你应该知道的重要细节：值必须是字符串。如果你想在 Web Storage 中存储任何自定义对象，你就没机会了。基本上，使用字符串值，并深度依赖\
  \ `toString()` 和 `JSON.stringify()` 等方法来确保以字符串形式存储任何复杂数据。\n\n##### 检索数据\n要检索存储在\
  \ `localStorage` 中的数据，你使用 `getItem` 方法：\n\n点击此处查看代码图像\n\n```javascript\nlet artist\
  \ = localStorage.getItem(\"artist\");\nconsole.log(artist); // 将打印 'Tycho'\n```\n\
  \n`getItem` 方法接受键作为参数，并返回与该键关联的值。如果你传递的键不存在，则返回返回 undefined。\n\n##### 删除数据\n从存储中删除数据有两种极端。你可以采取焦土式的方法删除所有内容，也可以选择性地单独删除某个键值对。\n\
  \n由于《焦土地球》是一款很棒的游戏，让我们先看看这种方法。要移除本地存储中的所有内容，你可以在 `localStorage` 对象上调用 `clear` 方法：\n\
  \n```javascript\nlocalStorage.clear();\n```\n\n这将移除你可能存储的任何数据的痕迹，因此如果你网站上的多个页面独立地向\
  \ `localStorage` 对象写入数据并依赖存储在那里的数据，请谨慎使用它。\n\n要从 `localStorage` 中移除选定的键值条目，你可以使用\
  \ `removeItem()` 并传入与要删除的数据关联的键名：\n\n点击此处查看代码图像\n\n```javascript\nlocalStorage.removeItem(\"\
  year\");\n```\n\n#### 处理文件大小\n\n\n\n\n\n由于未知原因，你使用的所有浏览器为你本地存储（local storage）绑定的每个域名提供了\
  \ 5MB 的固定容量。如果你在超过 5MB 配额后尝试添加更多数据，将抛出 `QUOTA_EXCEEDED_ERR` 异常。\n\n使用 `try/catch`\
  \ 语句处理此异常非常简单：\n\n点击此处查看代码图片\n\n```\ntry {\n  localStorage.setItem(\"key\", \"some\
  \ data\");\n} catch (e) {\n  if (e == QUOTA_EXCEEDED_ERR) {\n    // 执行一些友好的操作来通知你的用户\n\
  \  }\n}\n```\n\n这确保了你的代码能够以优雅的方式失败，同时仍然让你有机会通知用户他们的数据无法保存。**尽管如此，你真的永远不应该需要这样做**。请记住，你存储的所有数据都是字符串形式的。五*兆字节*对于存储文本数据来说是一个非常巨大的量。如果你需要存储如此大量的数据，Web\
  \ Storage 可能不是你的最佳解决方案。\n\n### 检测对 Web Storage 的支持情况\n\n讽刺的是，我们要做的最后事情之一就是讨论某人的浏览器是否支持本地存储。根据\
  \ `[Caniuse.com](http://Caniuse.com)` 关于本地存储的统计（[`caniuse.com/?search=local%20storage`](https://caniuse.com/?search=local%20storage)`），几乎所有人（以及他们的母亲）都在使用支持它的浏览器。除了浏览器支持外，还有一个*更好*的理由让你想要这样做。\n\
  \nWeb Storage 与 cookies 一样，允许网站在你的机器上留下它们的痕迹。当用户使用所有主流浏览器提供的“私密”模式浏览时，目标是避免处理这些数据痕迹。这意味着你的浏览器完全支持本地存储和会话存储（session\
  \ storage），但为了尊重用户隐私，它可能禁用了该功能或严重限制。尝试向本地或会话存储添加某些数据会导致错误，或者你的数据会在你结束浏览会话的一刻被清空。\n\
  \n对于“私密”模式情况，检查 Web Storage 在用户浏览器上是否可用*是一个好主意。执行此检查的代码如下：\n\n点击此处查看代码图片\n\n```javascript\n\
  function isLocalStorageSupported() {\n  try {\n    localStorage.setItem(\"blah\"\
  , \"blah\");\n    localStorage.removeItem(\"blah\");\n    return true;\n  } catch\
  \ (e) {\n    return false;\n  }\n}\n```\n\n调用 `isLocalStorageSupported` 函数，如果本地存储可用，它将返回\
  \ `true` 值；如果不支持本地存储，你将看到 `false` 值。\n\n这段代码片段完全基于以下 Gist，它还概述了本地存储功能检测的简要历史：`[`gist.github.com/paulirish/5558557`](https://gist.github.com/paulirish/5558557)`。\n\
  \n### 会话存储（Session Storage）又如何？\n\n早些时候提到我们将关注 `localStorage` 对象，稍后将关注 `sessionStorage`\
  \ 对象。猜猜看？稍后”已经到了，所以是时候切换思路看看会话存储了！在大多数情况下，你使用本地存储和会话存储的方式是相同的。你在之前的章节中为 `localStorage`\
  \ 对象看到的所有内容也适用于 `sessionStorage` 对象。添加、更新和删除项目的方法甚至没有改变。唯一的区别在于语法，你指定了 `sessionStorage`\
  \ 对象而不是 `localStorage`：\n\n点击此处查看代码图片\n\n```javascript\n// 添加项目\nsessionStorage.setItem(\"\
  artist\", \"Tycho\");\nsessionStorage.setItem(\"album\", \"Awake\");\nsessionStorage.setItem(\"\
  track\", \"Apogee\");\nsessionStorage.setItem(\"year\", \"2014\");\n\n// 移除项目\n\
  sessionStorage.removeItem(\"album\");\n```\n\n如你所见，从代码角度来看它们非常相似！如果它们如此相似，为什么 Web\
  \ Storage API 还要暴露这两个对象供你使用呢？\n\n事实证明，`localStorage` 和 `sessionStorage` 之间主要的细微区别在于**持久性**。当你使用本地存储存储数据时，你的数据跨多个浏览会话都是有效的。你可以关闭浏览器，稍后回来，你存储的任何数据仍然可以被页面访问。当你通过会话存储存储数据时，**你的数据对于该浏览会话有效**。它没有长期持久性。你关闭浏览器，几刻后回来，你会发现存储在\
  \ `sessionStorage` 对象中的所有数据都消失了。\n\n教训是：如果你只想让某些信息在单个浏览会话中持久，你应该会话存储。如果你想（理论上）永久持久信息，请使用本地存储。对于其他所有情况，还有\
  \ MasterCard。噢，天哪！\n\n## 48\n\n## 变量与函数提升（Hoisting）\n\n### 本章\n\n*   理解变量声明、初始化和使用时间之间的关系\n\
  *   用关于暂时性死区（temporal dead zone）的知识让你的朋友大吃惊，这是许多棘手错误的根源！\n\nJavaScript 最奇怪的事情之一就是被称为**提升**（hoisting）的现象。我们稍后会讲它，但让我们先通过看一些例子来铺垫，弄清楚它的含义。对于第一个例子，看下面的代码：\n\
  \n```javascript\nfunction foo() {\n  return \"Yay!\";\n}\n\nconsole.log(foo());\n\
  ```\n\n你认为控制台会显示什么？\n\n1. undefined\n2. 错误——未引用\n3. Yay!\n\n如果你猜是 **Yay!**，那么你是的。这里没有什么复杂的，所以它很直接。让我们增加难度，看看这个稍微修改过的版本：\n\
  \n```javascript\nconsole.log(foo());\n\nfunction foo() {\n  return \"Yay!\";\n}\n\
  ```\n\n在这种情况下，我们在定义 `foo` 之前就记录它的返回值。嗯……对于最后一个例子，看看下面的代码：\n\n```javascript\nconsole.log(bar);\n\
  \nlet bar = 100;\n```\n\n这看起来和我们之前看到的相似，对吧？你会预期打印出 **100**。实际答案是惊人的 **undefined**。这里发生了什么？在本章结束时，你将了解发生的一切以及这个现象扮演的角色。\n\
  \n### JavaScript 与编译器行为\n\n当你运行 JavaScript 时，你有一个 JavaScript 引擎，它将你写的代码转换（即编译）为计算机理解并知道要做的东西。在将你的代码转换为计算机理解的内容的过程中，*编译器*（执行转换的东西）会执行各种步骤。其中一个步骤涉及当编译器遇到任何变量和函数声明时发生的情况。取决于声明是变量还是函数，行为会有所不同。让我们分开看每种情况。\n\
  \n### 变量声明\n\n当编译器遇到一个代码块时，它做的第一件事是扫描整个块以寻找任何变量或函数声明。看看之前的例子：\n\n```javascript\n\
  console.log(bar);\n\nlet bar = 100;\n```\n\n我们的编译器查看这两行，但在执行任何操作之前，它锁了我们声明 `bar`\
  \ 变量的行：\n\n```javascript\nconsole.log(bar);\n\nlet bar = 100;\n```\n\n此时，它做的是将声明*提升*到它所在作用域的开头。从编译器的角度来看，我们的代码看起来像这样：\n\
  \n```javascript\nlet bar;\n\nconsole.log(bar);\n\nbar = 100;\n```\n\n\n\n\n声明变量的提升被称为\
  \ `variable hoisting`（变量提升）。需要注意的重要点是，只有声明被提升了。将 `bar` 的值设置为 `100` 的初始化操作仍然留在完全相同的位置。这解释了我们之前的示例中发生了什么，以及为什么我们打印了\
  \ `undefined`。由于提升的作用，当我们尝试记录它时，`bar` 变量已经存在了。但由于变量此时尚未初始化，所以打印出来的值是 `undefined`。\n\
  \n## 函数声明\n\n你在变量声明中看到的行为在函数中也是类似的。主要的区别在于，整个函数都被提升了——而不是它的一个空外壳。让我们重新回顾一下之前的示例：\n\
  \n```\nconsole.log(foo());\n\nfunction foo() {\n  return \"Yay!\";\n}\n```\n\n当我们的编译器扫描这段代码块时，它会将\
  \ `foo` 函数提升到顶部。这被称为 `function hoisting`（函数提升）。你得到的结果最终看起来会像这样：\n\n```\nfunction\
  \ foo() {\n  return \"Yay!\";\n}\n\nconsole.log(foo());\n```\n\n这就是为什么这个示例的输出是 `Yay!`，就像我们在尝试调用函数之前先指定函数定义一样。非常简单，对吧？\n\
  \n### 一些提升的异常\n\n我们快要结束了。仅仅因为我们理解提升是如何工作的，并不意味着我们所看到的现象没有例外。\n\n### 函数表达式不适用\n\n\
  首先，提升不适用于函数表达式。看下面的示例：\n\n```\nconsole.log(foo());\n\nlet foo = function() {\n \
  \ return \"Yay!\";\n}\n```\n\n输出不会像我们之前看到的普通函数那样是 `Yay!`。它将是一个 `TypeError: foo is\
  \ not a function`。\n\n## 暂时性死区\n\n在某些情况下，提升是有效的，但值永远不会像我们在 `var` 中看到的那样初始化为 `undefined`。这些情况发生在你使用\
  \ `let`、`const` 和 `class` 时。看看以下代码块：\n\n点击此处查看代码图片\n\n```\nconsole.log(answer) //\
  \ ReferenceError\n\nlet answer = \"Correct\";\n\nconsole.log(ROLE) // ReferenceError\n\
  \nconst ROLE = \"user\";\n\nlet foo = new AwesomeSauce(); // ReferenceError\n\n\
  class AwesomeSauce {\n  constructor() {\n    console.log(\"I exist!\");\n  }\n}\n\
  ```\n\n在所有这些情况下，我们本应期望变量或类存在但尚未初始化。然而，事实并非如此。你在每个示例中得到的都是 `ReferenceError`。这并不意味着使用类或使用\
  \ `let` 或 `const` 定义的变量没有被提升。它们确实提升了！区别在于它们保持为`未初始化`状态。在声明和初始化之间的时间有一个非常酷的名字——*暂时性死区*（temporal\
  \ dead zone）。\n\n# 49\n\n## 使用 Set\n\n## 本章内容\n\n* 学习关于 `Set` 数据结构的所有知识\n* 理解如何使用\
  \ set 来避免集合中的重复项\n\n提到存储数据集合时，可能首先会想到数组。它们已经存在很久，非常灵活，并且包含了许多让使用变得轻而易举的属性。在过去的几年里，JavaScript\
  \ 获得了另一种存储数据集合的方法。这种方法是通过这种名为 `set` 的、像数组一样的神秘生物实现的。从表面上看，数组和 set 看起来相似：\n\n![images](img/49UN01.jpg)\n\
  \n但它们有很多特征使得它们不同。最大的特征是是否允许存储重复值。**对于 set，我们只能存储唯一项**。这意味着我们可以使用 set 来存储任何我们想要的内容（类似于数组），但我们只能存储该项一次（与数组不同）。如果我们尝试添加一个已经存在于\
  \ set 中的重复项，该项将被忽略且不会添加到我们的集合中。很巧妙，对吧？\n\n在接下来的章节中，我们将更详细地介绍 set 是什么，以及如何像专业忍者一样使用它们！\n\
  \n### 创建 Set，第一部分\n\n在使用 set 之前，我们首先需要创建它。这没有什么特别的。我们创建 set 的唯一方法是调用 `Set` 构造函数：\n\
  \n```\nlet mySet = new Set();\n```\n\n当这段代码运行时，我们就创建了一个名为 `mySet` 的空 `Set` 对象：\n\
  \n![images](img/49UN02.jpg)\n\n现在，你可能在想是否有其他比像野兽一样输入 `new Set()` 更聪明的创建 set 方法。答案是*没有*。\n\
  \n### 向 Set 添加项\n\n一旦我们有了了 set，就可以通过 `add` 方法向它添加项：\n\n```\nlet mySet = new Set();\n\
  \nmySet.add(\"blarg\");\n\nmySet.add(10);\n\nmySet.add(true);\n```\n\n现在，这就是 set\
  \ 的*唯一性强制超能力*发挥作用的地方。现在，我们的 set 包含了文本值 `blarg`、数字 `10` 和布尔值 `true`。如果我们尝试添加已经存在于\
  \ set 中的新项，就不会有新内容被添加。看下面高亮的行：\n\n```\n let mySet = new Set();\n\n mySet.add(\"\
  blarg\");\n\n mySet.add(10);\n\n mySet.add(true);\n```\n\n\n\n早些时候，我们看到了如何创建一个空集合并向其中添加项。还有另一种创建集合的方法。虽然它仍然涉及\
  \ `new` 关键字，但我们可以在创建集合时传入一个已有的数据集合以对其进行预填充：\n\n点击此处查看代码图片\n\n```javascript\nlet\
  \ someValues = [\"a\", \"b\", \"c\", 10, \"a\", \"c\", false];\n\nlet newSet = new\
  \ Set(someValues);\n\nconsole.log(newSet); // \"a\", \"b\", \"c\", 10, false\n```\n\
  \n在这段代码片段中，我们有一个包含若干项的 `someValues` 数组，其中包含一些项（如 `a` 和 `c`）是重复的。在创建 `newSet` 对象时，我们仍然使用\
  \ `Set()` 表达式，但我们将 `someValues` 数组传递给了 `Set` 构造函数。这一次集合被创建时，它不是空的。它包含了我们在创建集合时传入的项中的`唯一值`。重复的项会被过滤掉。\n\
  \n这可能会引发另一个问题：在创建集合时，我们可以向 `Set` 构造函数传递什么样的项集合？答案是`任何可迭代对象`（any iterable object），这意味着任何提供了一种让我们遍历其所有值的方法的对象。数组就是此类对象的一个示例。文本（字符串）、`TypedArray`、`Map`、其他\
  \ `Set` 对象、`NodeList` 以及其他一些都属于可迭代对象的范畴。一个对象要被认为是可迭代的还需要满足少数真正的技术要求，你可以在关于该主题的这篇优秀\
  \ MDN 文章中阅读更多信息：`[`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols#the_iterable_protocol`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols#the_iterable_protocol)`。\n\
  \n在我们结束本节之前，请看下面的代码，我们在创建集合时传入了一个字符串（也称为一个可迭代对象！）：\n\n点击此处查看代码图片\n\n```javascript\n\
  let textSet = new Set(\"diplodocus\");\n\nconsole.log(textSet); // d, i, p, l, o,\
  \ c, u, s\n```\n\n我们传入了单词 `diplodocus`，我们的集合存储的是其中唯一的字符。注意，每个字母最终都变成了集合中的一个独立条目。每当传入一个可迭代对象时，该对象中的每个单独值都会被评估唯一性，如果该值确实是唯一的，就会被添加到我们的集合中。\n\
  \n### 检查集合的大小\n\n要确定集合中包含多少项，我们可以使用实用的 `size` 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
  let setCount = new Set();\n\nconsole.log(setCount.size); // 0\n\nsetCount.add(\"\
  foo\");\n\nconsole.log(setCount.size); // 1\n\nsetCount.add(\"bar\");\n\nsetCount.add(\"\
  zorb\");\n\nconsole.log(setCount.size); // 3\n```\n\n每当我们从集合中添加或删除（见下一节）项时，`size`\
  \ 属性返回的值就会更新。\n\n### 从集合中删除项\n\n要从集合中删除或移除某项，我们可以使用命名适当的 `delete` 方法并传入我们想要移除的项的值：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar robotSounds = new Set([\"beep\", \"boop\", \"\
  who dis?\"]);\n\nrobotSounds.delete(\"who dis?\");\n\nconsole.log(robotSounds) //\
  \ \"beep\", \"boop\"\n```\n\n当你删除一个项时，被删除的项会从集合中移除，并返回一个 `true` 值\n\n点击此处查看代码图片\n\
  \n```javascript\nlet robotSounds = new Set([\"beep\", \"boop\", \"who dis?\"]);\n\
  \nif (robotSounds.delete(\"who dis?\")) {\n\n  console.log(\"Item successfully deleted!\"\
  );\n\n}\n\nconsole.log(robotSounds) // \"beep\", \"boop\"\n```\n\n如果我们尝试删除一个不存在的项，我们的集合将保持不变，而\
  \ `delete` 方法将返回 `false`。\n\n虽然逐个删除项很方便，但有时我们可能只想完全清空集合中的所有项。我们可以通过使用 `clear` 方法来实现：\n\
  \n点击此处查看代码图片\n\n```javascript\nlet vegetables = new Set([\"\",\"\", \"\", \"\",\
  \ \"\"]);\n\nconsole.log(vegetables.size); // 5\n\nvegetables.clear();\n\nconsole.log(vegetables.size);\
  \ // 0\n```\n\n清空集合中所有项的另一种方法是通过执行一个新的 `Set()` 来重新创建我们的 `Set` 对象。事实证明这实际上并不更快，所以我们应该坚持使用\
  \ `clear` 方法来高效地清空所有项。\n\n### 检查项是否存在\n\n集合不仅检查重复项的速度非常快，检查某项最初是否存在于集合中也非常快。要检查某项是否存在，我们可以使用\
  \ `has` 方法：\n\n```javascript\nlet ingredients = new Set([\"milk\", \"eggs\", \"\
  cheese\", \"tofu\"]);\n\nif (ingredients.has(\"tofu\")) {\n  console.log(\"Tofu\
  \ exists!\");\n}\n```\n\n### 遍历集合中的项\n\n有时我们需要遍历集合中的项。我们可以通过使用 `for...of` 模式来实现。看下面的示例：\n\
  \n点击此处查看代码图片\n\n```javascript\nlet textSet = new Set(\"diplodocus\");\n\nfor (let\
  \ letter of textSet) {\n\n  console.log(letter);\n}\n```\n\n这个 `for` 循环将一直运行到集合中的每个项都被访问。访问项的顺序与它们被添加的顺序相同。与数组不同，集合没有供我们遍历的索引位置概念。\n\
  \n### 条目、键和值\n\n在底层，集合以 `key` 和 `value` 对的形式存储项。这在可视化时最有意义。假设我们有以下代码：\n\n点击此处查看代码图片\n\
  \n```javascript\nlet animaniacs = new Set([\"Yakko\", \"Wakko\", \"Dot\"]);\n```\n\
  \n在我们 `animaniacs` 集合内部，`Yakko`、`Wakko` 和 `Dot` 看起来像下面：\n\n![images](img/49UN03.jpg)\n\
  \n想象集合的内部就像一个两列的数据库或电子表格。一列标记为 `Key`（键），另一列标记为 `Value`（值）。每一行代表我们尝试存储的项。集合与其他键值对存储安排（例如哈希表）相比，有趣之处在于，键和值存储的是相同的数据。这就是为什么在我们的示例中，`Yakko`、`Wakko`\
  \ 和 `Dot` 同时出现在键列和值列中。这听起来有点奇怪，但正如现在的年轻人说的，*无所谓*！\n\n我们之所以花时间看这些键值的废话，是因为 `Set`\
  \ 对象为我们提供了若干方法，可以返回构成集合的所有键、值以及实际的键值对（称为 `entries` **条目**）。请看下面的代码片段：\n\n点击此处查看代码图片\n\
  \n```javascript\nlet animaniacs = new Set([\"Yakko\", \"Wakko\", \"Dot\"]);\n\n\
  console.log(animaniacs.keys());\n\nconsole.log(animaniacs.values());\n\nconsole.log(animaniacs.entries());\n\
  ```\n\n\n\n这些方法的名称有助于理清它们将返回什么类型的数据。`keys` 方法返回所有的键，`values` 方法返回所有的值，而 `entries`\
  \ 方法返回集合中每个项的键值对。数据的返回形式不是数组或通用对象之类的结构。数据是以 `Iterator`（迭代器）对象的的形式返回的。这意味着你访问项目的方法是使用我们之前看到的类似的\
  \ `for…of` 方法：\n\n点击此处查看代码图片\n\n```\nfor (let item of animaniacs.keys()) {\n  console.log(item);\
  \ // \"Yakko\", \"Wakko\", \"Dot\"\n}\n```\n\n迭代器（Iterators）非常有用，并为遍历项目提供了许多酷炫的功能，因此请阅读以下关于迭代器和生成器的文章：[`developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Iterators_and_Generators`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Iterators_and_Generators)。\n\
  \n# 50\n\n## 结语\n\n在本章中\n\n*   为我们圆满的任务点个掌\n*   再给自己点一次掌，纯粹是为了好玩\n\n好了，你终于做到了！你就是没法停下来狂读，现在已经接近尾声了。知道在下一个章节之前你将没有更多新内容可以期待，感觉如何？\n\
  \n无论如何，如果你从一开始就一直关注着，你会同意我们涵盖了大量内容。我们从这里开始：\n\n点击此处查看代码图片\n\n```\n<script>\n  console.log(\"\
  hello, world!\");\n</script>\n```\n\n我们最终得到的示例和代码段落包含了许多更多行更复杂、更实用且酷得多的代码。\n\n你应该记住的一点是，编写代码是容易的。编写能够真正解决问题的优雅代码是很的。这在我最喜欢的电影《帮派》（*Scarface*）中的一句台词非常到位，托尼·蒙塔纳说了了以下台词（准确措辞可能有些偏差……有时很难听懂他，如果你看过这部电影就知道了）：\n\
  \n![images](img/50UN01.jpg)\n\n这本书完全是关于基础的。从基础迈向下一步的方法是继续编写代码、尝试新事物，并在过程中学习更多。这本书描述了所有各种工具，并提供了简短示例说明它们如何结合在一起以帮助你构建小东西。获取这些知识并将其应用于构建经常看到的与\
  \ JavaScript 相关的更酷的非小东西，取决于你自己。如果你觉得可以尝试，可以看看 [`www.kirupa.com`](https://www.kirupa.com)\
  \ 上“编程练习”下的一些更复杂的教程和示例。\n\n![images](img/50UN02.jpg)\n\n那么，我们后见。随时通过 kirupa@kirupa.com\
  \ 给我写信，或者在 Facebook 和 Twitter (@kirupa) 上找到我。正如我在引言中提到的，我喜欢听取你这样的读者的反馈，所以不要害羞联系我。如果你有任何问题（无论大小），请花些时间发布在\
  \ [`forum.kirupa.com`](https://forum.kirupa.com) 上。\n\n此外，我知道你在学习 JavaScript 的书籍有很多选择。感谢你选择这本书，让我通过你的代码编辑器获得替代体验。\n\
  \n祝好，\n\n![images](img/50UN04.jpg)\n\n## 词表\n\n对你将在本书及之后将遇到的各种术语进行非正式回顾。\n\n###\
  \ A\n\n**Arguments (参数)**：你提供（或传递给）函数的值。\n\n**Array (数组)**：一种允许你存储和访问值之序列的数据结构。\n\
  \n### B\n\n**Boolean (布尔值)**：表示真或假的数据结构。\n\n### C\n\n**Cascading Style Sheets (CSS，级联样式表)**：一种主要用于更改\
  \ HTML 页面内容外观的样式语言。\n\n**Closure (闭包)**：一个可以访问外部函数变量（外自身和任何全局变量）的内部函数。\n\n**Comments\
  \ (注释)**：代码中人类可读的文本（通常用 `//` 或 `/*` 和 `*/` 字符分隔），JavaScript 会完全忽略它们。\n\n### D\n\n\
  **Developer Tools (开发者工具)**：在浏览器语境下，是帮助你检查、调试和诊断网页内部运行情况的扩展。\n\n**Do…While Loop\
  \ (do...while 循环)**：执行某些代码直到你指定的条件返回假值的控制语句。（如果你不知道想循环多少次，这太棒了！）\n\n**Document Object\
  \ Model (DOM，文档对象模型)**：你的 HTML 页面及其内部所有内容的 JavaScript 表示形式（通常以树状结构存在）。\n\n### E\n\
  \n**Event (事件)**：一种通过 DOM 传递的信号，表示发生了某事。\n\n**Event Bubbling (事件冒泡)**：事件从触发事件的元素开始，并爬回\
  \ DOM 树到根节点的阶段。\n\n**Event Capturing (事件捕获)**：事件从根节点开始并向下遍历 DOM 直到到达触发事件元素的阶段。\n\
  \n**Event Listener (事件监听器)**：一个监听事件并在听到该事件时执行某些代码的函数。\n\n**Event Target (事件目标)**：负责拥有（触发）事件的元素。\n\
  \n### F\n\n**Function (函数)**：一个可重用的代码块，接收参数，组合语句在一起并被调用。\n\n**For Loop (for 循环)**：执行有限次数的控制语句。\n\
  \n### G\n\n**Global Scope (全局作用域)**：在函数外部定义的、整个应用可见的东西。\n\n### I\n\n**If Statement\
  \ (if 语句)**：条件为真时执行某些代码的条件语句。\n\n**If/Else Statement (if/else 语句)**：根据条件的真假执行不同代码的条件语句。\n\
  \n**IIFE (Immediately Invoked Function Expression，立即调用函数表达式)**：一种在自己的作用域执行 JavaScript\
  \ 而不留下任何痕迹的方法。\n\n**Invoke (调用)**：call 的同义说法。\n\n### J\n\n**JavaScript**：一种多年来令大家惊讶地变得非常流行的脚本语言。\n\
  \n### L...（略）\n\n### N\n\n**Node (节点)**：DOM 中项的通用名称。\n\n### O\n\n**Object (对象)**：一种非常灵活且无处不在的数据结构，你可以用它存储属性及其值，甚至是其他对象。\n\
  \n**Operators (运算符)**：例如你的 `+`、`-`、`*`、`/`、`for`、`while`、`if`、=` 等。\n\n### P\n\n\
  **Primitives (原始类型)**：一种不由其他类型组成的类型。\n\n### R\n\n**Return (返回)**：退出函数或块的关键字。在函数的情况下，它通常用于将数据返回给调用者。\n\
  \n### S\n\n**Scope (作用域)**：指示事物可见性的术语。在现实世界中，它也是一种漱口水品牌。\n\n**Strict Equality (===)\
  \ Comparison (严格相等比较)**：检查两个东西的值和类型是否相等。\n\n**Strict Inequality (!==) Comparison\
  \ (严格不相等比较)**：检查两个东西的值和类型是否不等。\n\n**String (字符串)**：构成我们认为是文本的字符序列。它也是 JavaScript\
  \ 中处理文本的正式类型名称。\n\n**Switch Statement (switch 语句)**：将特定条件与一组情况匹配的条件语句。\n\n### T\n\
  \n**Timer Functions (定时函数)**：按间隔执行代码的函数。最常见的定时函数是 `setTimeout`、`setInterval` 和 `requestAnimationFrame`。\n\
  \n**Type (类型)**：帮助识别数据以及你可以使用的值的分类。\n\n### V\n\n**Values (值)**：你将遇到的各种数据的正式名称。\n\
  \n\n\n\n\n# **变量作用域** 描述变量在代码段中可见性的术语。\n\n# **变量** 用于存储某些数据的命名“桶”。\n\n## W\n\n**弱相等\
  \ (==) 比较** 仅检查两个事物的值是否相等。\n\n**弱不相等 (!=) 比较** 仅检查两个事物的值是否不相等。\n\n**网页浏览器** 一种复杂的应用程序，最基本的功能是帮助你浏览互联网并显示网页。\n\
  \n**While 循环** 一种控制语句，会在你指定的条件返回假值之前持续执行某些代码。\n\n## 索引\n\n### 符号\n\n- `&&` 运算符，44\n\
