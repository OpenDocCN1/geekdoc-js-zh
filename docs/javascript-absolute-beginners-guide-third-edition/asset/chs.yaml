  \ DOM 的所有重要属性，让我们来看一些代码段，它们将所有的图表和文字转化为几行优妙的 JavaScript 代码。\n\n### 检查子元素是否存在\n\n\
  要检查一个元素是否有子元素，我们可以执行以下操作：\n\n点击此处查看代码图片\n\n```\nlet bodyElement = document.querySelector(\"\
  body\");\n\nif (bodyElement.firstChild) {\n  // 执行一些有趣的操作\n}\n```\n\n如果没有元素，此 `if`\
  \ 语句将返回 `null`。如果你喜欢打字，我们也可以使用 `bodyElement.lastChild` 或 `bodyElement.children.count`，但我倾向于保持简单。\n\
  \n### 访问所有子元素\n\n如果我们想访问父元素的所有子元素，我们可以一直依靠老经典的 `for` 循环：\n\n点击此处查看代码图片\n\n```\n\
  let bodyElement = document.body;\n\nfor (let i = 0; i < bodyElement.children.length;\
  \ i++) {\n  let childElement = bodyElement.children[i];\n  document.writeln(childElement.tagName);\n\
  }\n```\n\n注意，我们正在使用 `children` 和 `length` 属性，就像使用 `Array` 一样。需要注意的是，这个集合实际上并不是一个\
  \ `Array`。我们可能想要使用的几乎所有 `Array` 方法在 `children` 属性返回的集合中都是用。\n\n### 遍历 DOM\n\n我们的最后一个代码段涉及了我们目前所看到的一切。这段代码递归地遍历\
  \ DOM，并接触它能找到每一个 HTML 元素：\n\n点击此处查看代码图片\n\n```\nfunction theDOMElementWalker(node)\
  \ {\n  if (node.nodeType == Node.ELEMENT_NODE) {\n    console.log(node.tagName);\n\
  \    node = node.firstChild;\n    while (node) {\n      theDOMElementWalker(node);\n\
  \      node = node.nextSibling;\n    }\n  }\n}\n```\n\n为了看到这个函数的运行效果，我们只需要传入一个我们想要开始遍历的节点即可：\n\
  \n点击此处查看代码图片\n\n```\nlet texasRanger = document.querySelector(\"#texas\");\n\ntheDOMElementWalker(texasRanger);\n\
  ```\n\n在这个示例中，我们对变量 `texasRanger` 引用的元素调用了 `theDOMElementWalker` 函数。如果你想在该脚本找到的元素上运行某些代码，将注释掉的行替换为任何你想执行的操作。\n\
  \n## 33\n\n## 创建和删除 DOM 元素\n\n## 本章内容\n\n* 理解使用 JavaScript 从无到创建 DOM 元素有多简单\n* 学习如何克隆现有的\
  \ DOM 元素以及删除你不再需要的 DOM 元素\n\n这部分可能会让你大震撼。对于接下来的句子，我建议你握住稳固的东西：\n\n![images](img/33UN01.jpg)\n\
  \n尽管我们之前关于 DOM 的讨论可能让你认为，我们的 DOM 并不非由标记中存在的 HTML 元素组成。我们有能力凭空创建 HTML 元素，并仅用几行 JavaScript\
  \ 将它们添加到 DOM 中。我们还有能力移动元素、删除它们，并进行各种神一般的操作。让我们停顿一下，让这些内容进入脑海。这非常了。\n\n除了这一切最初的酷炫之外，在\
  \ DOM 中动态创建和修改元素的能力是让许多我们喜欢的网站和应用程序运行的重要细节。当你考虑到这一点时，它是合理的。在 HTML 中预定义一切是非常局限的。我们希望内容在数据调入时发生变化、与页面交互时、滚动时或进行其他各种操作。\n\
  \n在本章中，我们将涵盖让这一切运行的基础。我们将查看如何创建元素、删除元素、重新父化以及克隆元素。这也是直接查看 DOM 相关的最后一个章节，所以请你的朋友们准备好！\n\
  \n### 创建元素\n\n交互网站和应用动态创建元素并让它们存在于 DOM 中是非常常见的。如果你是第一次听到这种可能性，你会喜欢这一节的！\n\n我们可以通过使用\
  \ `createElement` 方法来创建元素。`createElement` 的用法非常简单。我们通过 `document` 对象调用它并传入想要创建的\
  \ HTML 标签名称。在下面的代码段中，我们创建一个由字母 `p` 的元素：\n\n点击此处查看代码图片\n\n```\nlet myElement = document.createElement(\"\
  p\");\n```\n\n`myElement` 变量持有我们新创建的元素的引用。\n\n如果我们将此行代码作为应用程序的一部分运行，它将执行并且 `p` 元素将被创建。创建一个元素是简单的部分。实际上，让它成为\
  \ DOM 的一个有趣的成员需要一些额外努力。我们需要实际上将此元素放在 DOM 的某处，因为我们动态创建的 `p` 元素只是在漫无目的地漂浮：\n\n![images](img/33UN01)\n\
