  \n虽然 HTML 和 CSS 非常重要，但它们并不是我们关注的重点。那个光荣留给了我们的 JavaScript：\n\n点击此处查看代码图像\n\n```\n\
  let container = document.querySelector(\"#container\");\nlet generateButton = document.querySelector(\"\
