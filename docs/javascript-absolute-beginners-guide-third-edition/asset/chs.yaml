  : {\n    \"image\": {\n      \"url\": \"http://icons.wxug.com/graphics/wu2/logo_130x80.png\"\
  ,\n      \"title\": \"Weather Underground\",\n      \"link\": \"http://www.wunderground.com\"\
  \n    },\n    \"display_location\": {\n      \"full\": \"Seattle, WA\",\n      \"\
  city\": \"Seattle\",\n      \"state\": \"WA\",\n      \"state_name\": \"Washington\"\
  ,\n      \"country\": \"US\",\n      \"country_iso3166\": \"US\",\n      \"zip\"\
  : \"98101\",\n      \"magic\": \"1\",\n      \"wmo\": \"99999\",\n      \"latitude\"\
  : \"47.61167908\",\n      \"longitude\": \"-122.33325958\",\n      \"elevation\"\
  : \"63.00000000\"\n    },\n    \"observation_location\": {\n      \"full\": \"Herrera,\
  \ Inc., Seattle, Washington\",\n      \"city\": \"Herrera, Inc., Seattle\",\n  \
  \    \"state\": \"Washington\",\n      \"country\": \"US\",\n      \"country_iso3166\"\
  : \"US\",\n      \"latitude\": \"47.616558\",\n      \"longitude\": \"-122.341240\"\
  ,\n      \"elevation\": \"121 ft\"\n    },\n    \"estimated\": {},\n    \"station_id\"\
  : \"KWASEATT187\",\n    \"observation_time\": \"Last Updated on August 28, 9:28\
  \ PM PDT\",\n    \"observation_time_rfc822\": \"Fri, 28 Aug 2015 21:28:12 -0700\"\
  ,\n    \"observation_epoch\": \"1440822492\",\n    \"local_time_rfc822\": \"Fri,\
  \ 28 Aug 2015 21:28:45 -0700\",\n    \"local_epoch\": \"1440822492\"\n  }\n}\n```\n\
  \n*(注：由于用户提供的原文在 JSON 示例后出现了严重的文本混乱和重复，以下翻译是基于用户提供的后半部分文本逻辑的结构性翻译)*\n\n### 深入 JSON\
  \ 对象\n\nJSON 对象无非属性名和值的组合。这看起来很简单，但有一些重要的细节需要我们讨论。首先，让我们深入看看究竟是什么构了一个 JSON 对象。\n\
  \n### 属性名\n\n属性名是你用于访问值的标识符。视觉上，它们是冒号左侧的项：\n\n点击此处查看代码图片\n\n```\n{\n  \"firstName\"\
  : \"Kirupa\",\n  \"lastName\": \"Chinnambi\",\n  \"special\": {\n    \"admin\":\
  \ true,\n    \"userID\": 203\n  },\n  \"devices\": [\n    {\n      \"type\": \"\
  laptop\",\n      \"model\": \"Macbook Pro 2015\"\n    },\n    {\n      \"type\"\
  : \"phone\",\n      \"model\": \"iPhone XS\"\n    }\n  ]\n}\n```\n\n在这个 JSON 代码段中，属性名是\
  \ `firstName`、`lastName`、`special`、`admin`、`userID`、`devices`、`type` 和 `model`。注意属性名是如何定义的。它们是带有引号的字符串值。引号是一个重要的细节，在对象字面量的情况下你不需要指定属性名，因此在\
  \ JSON 世界工作时不要忘记包含它们。\n\n### 值\n\n每个属性名映射到一个值，你可以拥有的值类型如下：\n\n* 数字\n* 字符串\n* 布尔值\
  \ (`true` 或 `false`)\n* 对象\n* 数组\n* Null\n\n让我们将这些类型映射到我们刚刚看到的示例中。\n\n### 字符串\n\n\
  字符串值是以下高亮行：\n\n```\n {\n  \"firstName\": \"Kirupa\",\n  \"lastName\": \"Chinnambi\"\
  ,\n  \"special\": {\n    \"admin\": true,\n    \"userID\": 203\n  },\n  \"devices\"\
  : [\n    {\n      \"type\": \"laptop\",\n      \"model\": \"Macbook Pro 2015\"\n\
  \    },\n    {\n      \"type\": \"phone\",\n      \"model\": \"iPhone XS\"\n   \
  \ }\n  ]\n }\n```\n\n\n\n\n双引号是这些值是字符串的明显特征。除了常用的字母、数字和符号外，你还可以包含 `escape characters`（如\
  \ `\\'`、`\\\"`、`\\\\`、`\\/` 等），用于在字符串中定义否则会被解析为某些 JSON 操作的字符。\n\n### 数字\n\n我们数字家族的唯一一代表是\
  \ `userID` 属性的值：\n\n```\n{\n  \"firstName\": \"Kirupa\",\n  \"lastName\": \"Chinnathambi\"\
  ,\n  \"special\": {\n    \"admin\": true,\n    \"userID\": 203\n  },\n  \"devices\"\
  : [\n    {\n      \"type\": \"laptop\",\n      \"model\": \"Macbook Pro\"\n    },\n\
  \    {\n      \"type\": \"phone\",\n      \"model\": \"iPhone XS\"\n    }\n  ]\n\
  }\n```\n\n你可以指定小数值（例如 `0.204`、`1200.23`、`45`）也可以指定指数值（例如 `2e16`、`3e+4`、`1.5e-2`）。不过，有一些你需要注意的特殊情况。你不能在数字前加一个\
  \ `0` 再跟另一个数字。例如，`03.14` 这个值是不允许的。\n\n### 布尔值\n\n布尔值非常简单：\n\n```\n{\n  \"firstName\"\
  : \"Kirupa\",\n  \"lastName\": \"Chinnathambi\",\n  \"special\": {\n    \"admin\"\
  : true,\n    \"userID\": 203\n  },\n  \"devices\": [\n    {\n      \"type\": \"\
  laptop\",\n      \"model\": \"Macbook Pro\"\n    },\n    {\n      \"type\": \"phone\"\
  ,\n      \"model\": \"iPhone XS\"\n    }\n  ]\n}\n```\n\n值可以是 `true` 或 `false`。需要注意的一是是大小写很重要。`true`\
  \ 和 `false` 必须全小写。禁止使用句首大写（`True` 或 `False`）或全大写（`TRUE` 或 `FALSE`）。\n\n### 对象\n\n\
  这里变得有点有趣了：\n\n```\n{\n  \"firstName\": \"Kirupa\",\n  \"lastName\": \"Chinnathambi\"\
  ,\n  \"special\": {\n    \"admin\": true,\n    \"userID\": 203\n  },\n  \"devices\"\
  : [\n    {\n      \"type\": \"laptop\",\n      \"model\": \"Macbook Pro\"\n    },\n\
  \    {\n      \"type\": \"phone\",\n      \"model\": \"iPhone XS\"\n    }\n  ]\n\
  }\n```\n\n对象包含一组属性名和对应的值，它们用大括号与你的其他内容隔开。看到了吗？这不`little` 有趣吗？\n\n### 数组\n\n我们的 `devices`\
  \ 属性代表一个数组：\n\n```\n{\n  \"firstName\": \"Kirupa\",\n  \"lastName\": \"Chinnathambi\"\
  ,\n  \"special\": {\n    \"admin\": true,\n    \"userID\": 203\n  },\n  \"devices\"\
  : [\n    {\n      \"type\": \"laptop\",\n      \"model\": \"Macbook Pro\"\n    },\n\
  \    {\n      \"type\": \"phone\",\n      \"model\": \"iPhone XS\"\n    }\n  ]\n\
  }\n```\n\n数组存储了零或多个值的有序集合，你可以对它们进行迭代，它们通过方括号符号分隔。在数组内部，你可以使用目前见过的任何 JSON 类型，包括其他数组！\n\
  \n### Null\n\n最后一个数据类型也是最无趣的：\n\n```\n{\n  \"foo\": null\n}\n```\n\n你的 JSON 值可以是\
  \ `null`。这代表一个空值。\n\n### 读取 JSON 数据\n\n我承认。上一部分非常无聊，但有一个好消息！鉴于你刚才看到的内容有多无聊，相比之下这一节看起来比实际上要兴奋得多。耶！\n\
  \n总之，你与 JSON 的几乎所有交互都会围绕读取数据展开。读取 JSON 数据时，要记住与读取存储典型的 JavaScript 对象内部的值非常相似。你可以通过点访问想要的值（`property.propertyFoo`），或者使用数组方法（`property[\"\
  propertyFoo\"]`）并以此访问值。\n\n为了帮助解释这一切，让我们使用以下示例：\n\n```\nlet exampleJSON = {\n  \"\
  firstName\": \"Kirupa\",\n  \"lastName\": \"Chinnathambi\",\n  \"special\": {\n\
  \    \"admin\": true,\n    \"userID\": 203\n  },\n  \"devices\": [\n    {\n    \
  \  \"type\": \"laptop\",\n      \"model\": \"Macbook Pro\"\n    },\n    {\n    \
  \  \"type\": \"phone\",\n      \"model\": \"iPhone XS\"\n    }\n  ]\n};\n```\n\n\
  要读取由 `firstName` 存储的值，你可以执行以下操作之一：\n\n```\nexampleJSON.firstName;\nexampleJSON[\"\
  firstName\"];\n```\n\n这两行代码都会返回 `Kirupa` 的值。对于是想使用点表示法还是数组方法来访问你感兴趣的值，没有对错之分。使用你觉得舒服的方法即可，但我个人更倾向于使用点表示法。将属性名作为字符串传入让我不舒服，因此在后续将看到的代码片段中，我只会使用点表示法。\n\
  \n\n\n\n对于前端开发来说，我想不出关于编写 JSON 的信息会有多少用例。如果你遇到了罕见的需要执行读取 JSON 数据以外的某些操作的情况，我的建议是你去用\
  \ Google！\n\n# 第三部分\n\n## 操作 DOM\n\n## 27\n\n### JS、浏览器与 DOM\n\n## 本章内容\n\n* 学习\
  \ JavaScript 如何与页面的其他部分进行交互\n* 理解文档对象模型 (DOM) 到底在折腾什么\n* 搞清 HTML、CSS 和 JavaScript\
  \ 之间模糊的边界\n\n到为止，我们一直孤立地看待 JavaScript。我们学习了许多关于它的基本功能，但我们这样做时几乎没有考虑到它与现实世界的联系——这个世界是由你的浏览器呈现的，其中游斥着大量的\
  \ HTML 标签和 CSS 样式。本章将作为这个世界的介绍，随后的章节将进行更深入的探讨。\n\n在接下来的节中，你将学习到被称为 `文档对象模型 (DOM)`\
  \ 的神秘数据结构和编程接口。你将学习它是什么、为什么有用用，以及它是如何与你未来将要做的一切相关联的。\n\n### HTML、CSS 和 JavaScript\
  \ 是做什么的\n\n在我们深入并开始回答生命的意义……呃，DOM 的意义之前，让我们快速看一些你可能已经知道的内容。首先，你放入 HTML 文档中的东西围绕着超文本标记语言\
  \ (HTML)、层叠样式表 (CSS) 和 JavaScript。我们把这三者被视为平等的伙伴，共同构建你在浏览器中看到的内容（图 27.1 ）。\n\n![images](img/27fig01.jpg)\n\
  \n图 27.1\n\n一个典型的网页由 HTML、CSS 和 JavaScript 组成。\n\n每个伙伴都扮演着重要的角色，而且每个伙伴扮演的角色非常不同。\n\
  \n### HTML 定义结构\n\n你的 HTML 定义了页面的结构，并通常包含了你看到的内容：\n\n点击此处查看代码图片\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <meta content=\"sea otter, kid, stuff\" name=\"keywords\"\
  >\n  <meta content=\"Sometimes, sea otters are awesome!\" name=\"description\">\n\
  \  <title>Example</title>\n  <link href=\"foo.css\" rel=\"stylesheet\" />\n</head>\n\
  <body>\n  <div id=\"container\">\n    <img src=\"seaOtter.png\" />\n    <h1>这只海獭对这个小孩做的事会让你笑死！</h1>header>\n\
  \    <p class=\"bodyText\">\n      Nulla tristique, justo eget semper viverra,\n\
  \      massa arcu congue tortor, ut vehicula urna mi\n      in lorem. Quisque aliquam\
  \ molestie dui, at tempor\n      turpis porttitor nec. Aenean id interdum urna.\n\
  \      Curabitur mi ligula, hendrerit at semper sed,\n      feugiat a nisi.\n  \
  \  </p>\n    <div class=\"submitButton\">\n      more\n    </div>\n  </div>\n  <script\
  \ src=\"stuff.js\"></script>\n</body>\n</html>\n```\n\nHTML 本身就像《家庭不起》（*Family Guy*）中的梅·格里芬\
  \ 一样，非常无聊。如果你不知道 Meg 是谁，又懒得去 Google 搜她，图 27.2 是对她样子的近似描述。\n\n![images](img/27fig02.jpg)\n\
  \n图 27.2\n\n梅·格里芬的艺术形象\n\n无论如何，你不希望你的 HTML 文档是无聊的。为了让你的内容从平淡枯燥变得吸引人，你有 CSS。\n\n\
  ### 让我的世界变漂亮，CSS！\n\nCSS 是你主要的样式语言。它允许你为 HTML 元素提供一些非常需要的审美和布局吸引力：\n\n```css\nbody\
  \ {\n  font-family: \"Arial\";\n  background-color: #CCCFFF;\n}\n#container {\n\
  \  margin-left: 30%;\n}\n#container img {\n  padding: 20px;\n}\n#container h1 {\n\
  \  font-size: 56px;\n  font-weight: 500;\n}\n#container p.bodyText {\n  font-size:\
  \ 16px;\n  line-height: 24px;\n}\n.submitButton {\n  display: inline-block;\n  border:\
  \ 5px solid #669900;\n  background-color: #7BB700;\n  padding: 10px;\n  width: 150px;\n\
  \  font-weight: 800;\n}\n```\n\n在很长一段时间，在 HTML 和 CSS 之间，你已经拥有了创建一个漂亮且功能完备页面所需的一切。你有结构和布局。你有导航。你甚至还有简单的交互，如鼠标悬停。生活很美好。\n\
  \n### 该 JavaScript 时间！\n\n尽管 HTML 和 CSS 有许多优点，但它们在提供的交互性方面都是有限的。人们希望在网页文档上做的更多，而不仅仅是被动地坐在那里观察发生的事情。他们希望网页文档能做得更多。他们希望文档帮助他们玩媒体；记住他们离开的地方；通过鼠标点击、键盘敲击和手指按下进行操作；使用花哨的导航菜单。\n\
  \n![images](img/27fig01.jpg)\n\n情况不再如此了。JavaScript 现在完全胜任。\n\n### 认识对象模型\n\n浏览器显示的是一个文档。更具体地说，总结之前的章节，你看到的是\
  \ HTML、CSS 和 JavaScript 的协作。再深入一层，在盖子下面，有一个浏览器用来理解一切的层次结构。这个结构（再次）被称为 DOM。图 27.3\
  \ 显示了我们示例 DOM 的简化视图。\n\n![images](img/27fig03.jpg)\n\n图 27.3\n\n我们看到 HTML 的 DOM\
  \ 大致如下！\n\n尽管看起来简单，但有几点需要深入，这适用于所有的 DOM 结构。你的 DOM 实际上不仅仅由 HTML 元素组成。构成 DOM 的所有这些东西泛被称为\
  \ 节点。\n\n这些节点可以是元素（这不会让你感到惊讶）、属性、文本内容、注释、文档相关内容以及其他各种东西。这些细节对某人很重要，但那个“某人”不应该是我们。几乎总是，我们关心的唯一节点类型是元素类型，因为这是我们\
  \ 99% 的时间要处理的东西。在无聊/技术层面，节点在我们以元素为中心的视图中仍然扮演着角色。\n\n\n\n\n\n现在，在我们着手使用 DOM 修改 HTML\
  \ 元素之前，让我们先聊聊两个特殊的对象，在我们实现目标道路之前，它们会先挡在面前。\n\n## window 对象\n\n在浏览器中，你的层级结构的根是 `window`\
  \ 对象，它包含了许多帮助你操作浏览器的属性和方法（参见图 27.5）。\n\n![images](img/27fig05.jpg)\n\n图 27.5\n\n\
  `window` 在这一领域非常重要。\n\n借助 `window` 对象可以完成的一些操作包括：访问当前 URL、获取页面中任何框架的信息、使用本地存储、查看屏幕信息、调整滚动条、设置状态栏文本，以及各种适用于网页显示容器的事务。\n\
  \n## document 对象\n\n现在，我们来看在图 27.6 中高亮显示的 `document` 对象。这里将变得有趣起来，也是你和我投入大量时间的地方。\n\
  \n![images](img/27fig06.jpg)\n\n图 27.6\n\n`document` 对象也相当重要。\n\n`document` 对象是通往所有构成内容的\
  \ HTML 元素的网关。需要记住的一点（随着我们查看后续章节，这一点更有意义）是：`document` 对象并不简单代表 HTML 文档的只读版本。它是一条双行道，你可以随心所欲地读取以及操作文档。\n\
  \n通过 JavaScript 对 DOM 进行的任何更改都会反映在浏览显示上。这意味着你可以动态添加元素、删除元素、移动它们、修改它们的属性、设置内联 CSS\
  \ 样式，并执行各种其他操作。除了在 HTML 文档中运行 JavaScript 所需的极其基础的 `<script>` 标签之外，如果你愿意，完全只使用 JavaScript\
  \ 就能构建出一个功能完整的页面。如果使用当，这是一个非常强大的功能。\n\n`document` 对象的另一个重要方面与事件有关。我很快会详细介绍这个问题，但如果你想对鼠标点击/悬停做出反应、检查复选框、检测何时按下按键等，你将依赖\
  \ `document` 对象提供的监听和响应事件的功能。\n\nDOM 还提供了几个大功能块，我将在接下来的章节中遇到它们时重点介绍。\n\n## 28：在\
  \ DOM 中查找元素\n\n## 本章内容\n\n*   学习如何在 DOM 中查找元素\n*   使用 CSS 选择器语法进行更智能的元素发现\n\n正如我们在上一章中看到的，我们的\
  \ DOM 仅仅是一个由存在于 HTML 文档中的所有元素组成的树形结构（参见图 28.1）。\n\n![images](img/28fig01.jpg)\n\n\
  图 28.1\n\n没错。看起来确实像一个树形结构！\n\n这个细节只是有点重要。重要的是，你有所有这些 HTML 元素悬浮在那里，你想访问它们、从中读取数据或对其修改它们。有很多方法可以找到这些\
  \ HTML 元素。毕竟，这些元素被排列成树形结构，如果说计算机科学家喜欢做一件事，那就是想出疯狂的方法在树上上上下地寻找某些东西。\n\n我不会让你遭受那种折磨……暂时还没有。在本章中，你将学习如何使用两个名为\
  \ `querySelector` 和 `querySelectorAll` 的内置函数来解决大部分所有的 DOM 搜索需求。\n\n### 认识 querySelector\
  \ 系列\n\n为了帮助解释 `querySelector` 和 `querySelectorAll` 带来的强大功能，请查看以下 HTML：\n\n点击此处查看代码图像\n\
  \n```\n<div id=\"main\">\n\n  <div class=\"pictureContainer\">\n\n    <img class=\"\
  theImage\" src=\"smiley.png\" height=\"300\"\n\nwidth=\"150\" />\n  </div>\n  <div\
  \ class=\"pictureContainer\">\n    <img class=\"theImage\" src=\"tongue.png\" height=\"\
  300\" width=\"150\"\n/>\n  </div>\n  <div class=\"pictureContainer\">\n    <img\
  \ class=\"theImage\" src=\"meh.png\" height=\"300\" width=\"150\" />\n  </div>\n\
  \  <div class=\"pictureContainer\">\n    <img class=\"theImage\" src=\"sad.png\"\
  \ height=\"300\" width=\"150\" />\n  </div>\n</div>\n```\n\n在这个示例中，我们有一个 `id` 为\
  \ `main` 的 `div`，然后我们有四个 `div` 和 `img` 元素，每个元素的 `class` 值分别分别为 `pictureContainer`\
  \ 和 `theImage`。在接下来的几个节中，我们将释放 `querySelector` 和 `querySelectorAll` 函数来处理这段 HTML，看看会发生什么。\n\
  \n### querySelector\n\n`querySelector` 函数的基本工作原理如下：\n\n点击此处查看代码图像\n\n```\nlet element\
  \ = document.querySelector(\"CSS selector\");\n```\n\n`querySelector` 函数接收一个参数，并且\
  \ `querySelector` 返回匹配选择器的第一个元素。如果没有找到匹配项，它将返回 `null`。\n\n取自之前的 HTML，如果我们想访问 `id`\
  \ 为 `main` 的 `div`，我们将编写：\n\n点击此处查看代码图像\n\n```\nlet element = document.querySelector(\"\
  #main\");\n```\n\n同样地，让我们为 `pictureContainer` 指定选择器：\n\n点击此处查看代码图像\n\n```\nlet element\
  \ = document.querySelector(\".pictureContainer\");\n```\n\n### querySelectorAll\n\
  \n`querySelectorAll` 函数将所有匹配你提供的选择器的元素返回一个静态的 `NodeList`，它类似于数组。\n\n点击此处查看代码图像\n\
  \n```\nlet elements = document.querySelectorAll(\"CSS selector\");\n```\n\n继续使用之前的\
  \ HTML，如果我们想使用 `querySelectorAll` 来帮助显示所有包含 `theImage` 类的 `img` 元素的 `src` 属性，我们的\
  \ JavaScript 代码将如下：\n\n点击此处查看代码图像\n\n```\nlet images = document.querySelectorAll(\"\
  .theImage\");\n\nfor (let i = 0; i < images.length; i++) {\n\n  let image = images[i];\n\
  \n  console.log(image.getAttribute(\"src\"));\n}\n```\n\n\n\n\n\n如果你想目标所有所有的 `img`\
  \ 元素而无需指定类值，那么我们的 `querySelectorAll` 调用可能像所示：\n\n点击此处查看代码图片\n\n```\nlet images =\
  \ document.querySelectorAll(\"img\");\n```\n\n如果你只想针对 `src` 属性被设置为 `meh.png` 的图像，你可以执行以下操作：\n\
  \n点击此处查看代码图片\n\n```\nlet images = document.querySelectorAll(\"img[src='meh.png']\"\
  );\n```\n\n请注意，我只是将一个`属性选择器`作为 `querySelectorAll` 的参数。基本上你在 CSS 文档中可以为选择器指定的任何复杂表达式，都可以作为\
  \ `querySelector` 或 `querySelectorAll` 的参数。\n\n然而，这里也有一些你需要注意的局限性。首先，并不是所有的伪类选择器都是允许的。由\
  \ `:visited`、`:link`、`::before` 和 `::after` 组成的选择器会被忽略，且找不到任何元素。\n\n其次，你提供的选择器可以有多“疯狂”，取决于浏览器的\
  \ CSS 支持情况。Internet Explorer 8 支持 `querySelector` 和 `querySelectorAll`。它不支持 `CSS3`。考虑到这种情况，使用任何比\
  \ CSS2 定义更晚的选择器，在 IE8 上配合 `querySelector` 和 `querySelectorAll` 时将无法工作。很有可能这并不适用于你，因为你可能在支持更新版本的浏览器，而这个\
  \ IE8 的问题根本不在考虑范围内。\n\n最后，你指定的选择器仅适用于你开始搜索的起始元素的后代。起始元素本身不包含在内。并不是所有的 `querySelector`\
  \ 和 `querySelectorAll` 调用都需要从 `document` 执行。\n\n# 29\n\n## 修改 DOM 元素\n\n## 本章内容\n\
  \n* 理解如何使用 JavaScript 修改 DOM\n* 结识 HTML 元素\n* 学习如何修改属性和文本值\n\n到目前，你已经大概知道 DOM 是什么了。你还看到了如何使用\
  \ `querySelector` 和 `querySelectorAll` 查找元素。接下来是要学习如何修改你找到的 DOM 元素：\n\n![images](img/29UN01.jpg)\n\
  \n毕竟，如果我们拥有一块巨大的橡泥（或饼干面团）却不能上手操作并把它弄得一团糟，那还有什么乐趣可言？无论如何，除了好玩之外，我们会发现自己一直在修改 DOM。无论我们使用\
  \ JavaScript 更改某些元素的文本、用不同的图像替换掉图像、将元素从文档的一个部分移动到另一个部分、设置内联样式，还是执行我们想要做的数以万种的变化之一，**我们将会修改\
  \ DOM**。本章将教你如何进行这些操作的基础知识。\n\n### DOM 元素是对象（在某种程度上）！\n\n我们能够使用 JavaScript 修改浏览器显示的内容，这由于一个主要细节得以实现。那个细节就是：每一个\
  \ HTML 标签、样式规则或进入你页面的任何其他内容在 DOM 中都有某种形式的表示。\n\n为了直观化我所说的内容，假设我们在标记语言中定义了一个图像元素：\n\
  \n点击此处查看代码图片\n\n```\nimg src=\"images/lol_panda.png\" alt=\"Sneezing Panda!\" width=\"\
  250\"\n\nheight=\"100\"/>\n```\n\n当我们的浏览器解析文档并遇到这个图像元素时，它会在 DOM 中创建一个节点来表示它，如图 29.1\
  \ 所示。\n\n![images](img/29fig01.jpg)\n\n图 29.1\n\n所有的 HTML 元素最终都将拥有 DOM 表示。\n\n这种\
  \ DOM 表示为我们提供了执行在标记语言中可以做的一切的能力。事实证明，这种 DOM 表示实际上允许**我们对 HTML 元素做更多事情**，而这些仅使用旧的标记语言本身是无法到的。这一点在这里我们将看到一点，在未来会看到很多。我们的\
  \ HTML 元素通过 DOM 查看时之所以如此通用，是因为它们与原生 JavaScript 对象有许多相似之处。我们的 DOM 元素包含了允许我们获取/设置值和调用方法的属性。它们具有某种形式的继承关系（我们在之前略有提到），其中每个\
  \ DOM 元素提供的功能分布在 `Node`、`Element` 和 `HTMLElement` 基类型中，如图 29.2 再次所示。\n\n![images](img/29fig02.jpg)\n\
  \n图 29.2\n\n我们在 HTML DOM 元素中通常遇到的视觉元素层级结构，可能在在雨里滚了一会儿后回到家里运行时，闻起来甚至像一个对象。\n\n尽管有这些相似之处，但出于法律和可能的健康原因，我需要提供以下免责声明：**DOM\
  \ 从未设计用于模拟对象的工作方式**。我们可以在对象上做的很多事情确实可以在 DOM 中完成，但那是因为浏览器厂商帮助确保了这一点。W3C 规范并没有规定我们的\
  \ DOM 行为应该与我们预期的原生对象行为完全一致。虽然我不会因为担心这个事而失眠，但如果你决定扩展 DOM 元素或执行更高级的对象相关体操，请务必在所有浏览器中进行测试，以确保一切运行正常。\n\
  \n### 让我们实际修改元素\n\n虽然我们完全可以向后靠并被动地跟随，但让我们开始实际修改 DOM。。如果你兴趣跟练习，我们将使用以下 HTML 作为沙盒：\n\
  \n点击此处查看代码图片\n\n```\n<!DOCTYPE html>\n<html\n\n<head>\n  <title>Hello...</title>\n\
  \  <style>\n    .highlight {\n      font-family: \"Arial\";\n      padding: 30px;\n\
  \    }\n\n    .summer {\n      font-size: 64px;\n      color: #009FF;\n    }\n \
  \ </style>\n</head>\n\n<body>\n\n  <h1 id=\"bigMessage\" class=\"highlight summer\"\
  >What's happening?</h1>\n\n  <script>\n\n  </script>\n\n</body>\n</html>\n```\n\n\
  现在，切换到 DOM 端，图 29.4 展示了该示例在映射所有 HTML 元素以及如 `document` 和 `window` 等节点后的样子。\n\n![images](img/29fig04.jpg)\n\
  \n图 29.4\n\n我们示例的 DOM 结构看起来\n\n这里并没有做什么。主要内容是 `h1` 标签，它显示了 What’s happening? 文本：\n\
  \n点击此处查看代码图片\n\n```\n<h1 id=\"bigMessage\" class=\"highlight summer\">What's happening?</h1>\n\
  ```\n\n### 修改元素的文本值\n\n让我们从简单的开始。许多 HTML 元素都有显示某些文本的能力。此类元素的示例包括我们的标题、段落、区块、输入、按钮等许多元素。它们有一个共同点。你修改文本值的方法是设置\
  \ `textContent` 属性。\n\n假设我们想要更改示例中 `h1` 元素的文本。以下代码片段展示了操作方法：\n\n点击此处查看代码图片\n\n```\n\
  <<body>\n\n  <h1 id=\"bigMessage\" class=\"highlight summer\">What's happening?</h1>\n\
  \n  <script>\n\n    let headingElement = document.querySelector(\"#bigMessage\"\
  );\n\n    headingElement.textContent = \"Oppa Gangnam Style!\";\n\n  </script>\n\
  \n</body>\n```\n\n\n\n\n如果你进行了此项更改并在浏览器中预览，你将看到图 29.5 所示的内容。\n\n![images](img/29fig05.jpg)\n\
  \n**图 29.5**\n\n更改标题的文本值。\n\n让我们来看看我们到底做了什么导致了这一变化。在 JavaScript 中修改任何 HTML 元素的第一步是首先获取它的引用：\n\
  \n点击此处查看代码图像\n\n```javascript\nlet headingElement = document.querySelector(\"#bigMessage\"\
  );\n```\n\n现在轮到老朋友 `querySelector` 和 `querySelectorAll` 大显用场。正如我们之后将看到的，我们也有间接引用元素的方法。不过，这里展示的直接方法是在你非常明确想要目标某个特定元素或多个元素时，将用到的方法。\n\
  \n一旦我们有了元素的引用，就可以直接在它上设置 `textContent` 属性：\n\n点击此处查看代码图像\n\n```javascript\nheadingElement.textContent\
  \ = \"Oppa Gangnam Style!\";\n```\n\n`textContent` 属性可以像变量一样被读取以显示当前值。我们也可以像这里这样设置该属性，以更改当前存储的值。在这行代码运行后，我们标记语言中的原始值\
  \ **What’s happening?** 将被 JavaScript 中指定的的内容在 DOM 中替换。\n\n### 属性值\n\nHTML 元素的一个重要部分是它们所携带的属性。我们经常看到的常见属性包括\
  \ `id` 属性、`class` 属性，以及大量特定于元素的属性，例如 `img` 元素的 `src`、视频元素的 `autoplay` 等。当 HTML 中的某些内容非常重要时，你就知道了解如何通过\
  \ JavaScript 处理它对我们来说至关重要。这就是接下来的几个章节所关注的全部。\n\n### 属性访问基础\n\n在跳转到查看自定义属性之前，让我们花一点时间简单讨论一下如何通用访问属性。假设我们有一个如下所示的\
  \ HTML 元素：\n\n```html\n<img id=\"tv\" src=\"foo.png\">\n```\n\n该元素上的两个属性是 `id` 和\
  \ `src`。按照良好的 JavaScript 传统，我们有多种方法来完成相同的任务。我们将在本节中探索其中一些方法。\n\n### 读取属性\n\n我们将做的第一件事是看如何在\
  \ JavaScript 中访问这些属性。最流行的方法是使用 `getAttribute` 并提供属性名作为参数：\n\n点击此处查看代码图像\n\n```javascript\n\
  let imgElement = document.querySelector(\"#tv\");\n\nlet idValue = imgElement.getAttribute(\"\
  id\");\n\nlet srcValue = imgElement.getAttribute(\"src\");\n\nconsole.log(idValue)\
  \ // tv\n\nconsole.log(srcValue) // foo.png\n```\n\n对于图像元素上的 `id` 和 `src` 这样的内置属性，我们可以直接通过点符号操作来访问它们：\n\
  \n点击此处查看代码图像\n\n```javascript\nlet imgElement = document.querySelector(\"#tv\");\n\
  \nlet idValue = imgElement.id;\n\nlet srcValue = imgElement.src;\n\nconsole.log(idValue);\
  \ // tv\n\nconsole.log(srcValue); // <full-path>/foo.png\n```\n\n另一种方法是使用 DOM 元素上的\
  \ `attributes` 属性并遍历这些属性，但我们可以留到以后再讨论。\n\n### 设置属性\n\n读取属性是一回事。设置属性是另一一回事，由 `setAttribute`\
  \ 方法处理，该方法接受属性名和新值作为其参数：\n\n点击此处查看代码图像\n\n```javascript\nlet imgElement = document.querySelector(\"\
  #tv\");\n\nimgElement.setAttribute(\"src\", \"bar.png\");\n\nconsole.log(imgElement.getAttribute(\"\
  src\")); // bar.png\n```\n\n注意，我们使用 `setAttribute` 将 `src` 属性的值更改为 **bar.png**。\n\
  \n### 移除属性\n\n我们将看到的最后一个**基础**属性相关活动是如何移除属性。此任务由 `removeAttribute` 方法处理：\n\n点击此处查看代码图像\n\
  \n```javascript\nlet imgElement = document.querySelector(\"#tv\");\n\nimgElement.removeAttribute(\"\
  src\");\n\nconsole.log(imgElement.getAttribute(\"src\")); // undefined\n```\n\n\
  要使用 `removeAttribute` 方法，我们需要提供要移除的属性名称，如上一个示例所示。注意我们正在从图像元素中移除 `src` 属性，当我们尝试访问被移除的属性时，我们可以看到它返回\
  \ **undefined**。\n\n### 自定义属性\n\n在超越元素携带的标准内置属性之后，我们进入了自定义属性的有趣世界。在过去，如果我们想为了任何类型的程序访问而标记或标记元素，我们并没有太多好的选择。我们最常见的操作是从元素添加或移除类值：\n\
  \n点击此处查看代码图像\n\n```html\n<img class=\"ufo healthy\" src=\"spaceship.png\">\n\n<img\
  \ class=\"ufo healthy\" src=\"spaceship.png\">\n```\n等等，原文在代码块中有些格式残留，根据上下文清理如下：\n\
  ```html\n<img class=\"ufo healthy\" src=\"spaceship.png\">\n```\n实际上，文本为 `<img class=\"\
  ufo healthy\" src=\"spaceship.png\">`。如果你在疑问，添加自定义属性对应用程序的显示或布局没有任何影响。\n\n### 在\
  \ JS 中处理自定义属性\n\n对于自定义数据属性，我们最常用的两件事是获取存储此类属性的值以及设置存储此类属性的值。我们之前看到的 `getAttribute`、`setAttribute`\
  \ 和 `removeAttribute` 在这里完全相同。\n\n要获取 **data-*** 属性存储的值，请在所属的 HTML 元素上使用可靠的 `getAttribute`\
  \ 方法：\n\n点击此处查看代码图像\n\n```html\n<img id=\"tv\" src=\"foo.png\" data-photographer=\"\
  Krusty the Clown\">\n\n<script>\nlet tvImg = document.getElementById(\"tv\");\n\n\
  let name = tvImg.getAttribute(\"data-photographer\");\n</script>\n```\n\n要设置值，我们使用\
  \ `getAttribute` 的宿敌 `setAttribute` 方法：\n\n点击此处查看代码图像\n\n```javascript\ntvImg.setAttribute(\"\
  data-photographer\", \"Sideshow Bob\");\n```\n\n你明白了。需要注意的一点是，我们的 **data-*** 属性仅仅是普通的、无聊的属性。我们以前在\
  \ JavaScript 中对属性可以做的任何事情，现在仍然可以这样做。这些属性只是命名略有不同。此如此。\n\n### dataset 属性\n\n\n\n\n\
  \n好的，自定义数据属性有一个普通属性不具备的特性，那就是方便的 `dataset` 属性。当我们看它的运行示例时，这一点就很有意义了：\n\n点击此处查看代码图片\n\
  \n```html\n<img id=\"tv\" src=\"foo.png\" data-size=\"large\" data-name=\"Picasso\"\
  >\n\n<script>\n  let imgElement = document.querySelector(\"#tv\");\n  let imgSize\
  \ = imgElement.dataset.size;\n  let imgName = imgElement.dataset.name;\n  console.log(imgSize);\
  \ // large\n  console.log(imgName); // Picasso\n</script>\n```\n\n注意，我们使用了 `data-size`\
  \ 和 `data-name` 作为自定义属性。我们访问这些属性的方法直接通过 `dataset` 属性并省略 `data-` 前缀。这种读取自定义数据属性的方便方法也适用于设置属性，我们可以像赋值变量一样直接分配新的属性值：\n\
  \n点击此处查看代码图片\n\n```html\n<img id=\"tv\" src=\"foo.png\" data-size=\"large\" data-name=\"\
  Picasso\">\n\n<script>\n  let imgElement = document.querySelector(\"#tv\");\n  let\
  \ imgSize = imgElement.dataset.size;\n  imgElement.dataset.name = \"Van Gogh\";\n\
  \  let imgName = imgElement.dataset.name;\n  console.log(imgSize); // large\n  console.log(imgName);\
  \ // Van Gogh\n</script>\n```\n\n我们通过 JavaScript 将 `data-name` 属性的值设置为 `Van Gogh`。我们可以看到新值被设置了，但我们可以更深入地检查元素，以确定我们看到的确实是新值：\n\
  \n![images](img/29UN02.jpg)\n\n很酷，对吧？\n\n### 何时使用 Data-* 属性\n\n现在你已经看到了这一切，下一个值得问的问题是：你应该何时在\
  \ HTML 中使用这些 `data-*` 属性，或者通过 JavaScript 在 DOM 上设置它们？对此意见不一，但以下是我总结的何时应该或不应该使用自定义数据属性：\n\
  \n*   使用 `data-*` 属性存储非视觉数据，这些数据还可以让你的 JavaScript 工作变得更容易。\n*   不要使用 `data-*` 属性存储用其他元素表示更好的数据。\n\
  *   与直接操作内存中的 JavaScript 对象相比，使用 `getAttribute` 和 `setAttribute` 是开销较大的操作。对于性能密集型操作，请避免使用\
  \ `data-*` 属性。\n\n如果你必须使用它们，请从自定义属性中读取数据，但所有后续处理都在内存中进行。除非你有充分理由，否则不要通过 `setAttribute`\
  \ 将数据写回属性。\n\n在继续之前，有一点我需要说明。在关于如何使用 `setAttribute` 和 `getAttribute` 的示例中，我选择了 `id`\
  \ 和 `class`。对于这两个属性，我们有另一种设置方法。因为设置 `id` 和 `class` 属性非常常见，HTML 元素直接暴露了 `className`\
  \ 属性：\n\n点击此处查看代码图片\n\n```html\n<body>\n  <h1 id=\"bigMessage\" class=\"highlight\"\
  >发生了什么？</h1>\n  <script>\n    let headingElement = document.querySelector(\"h1\"\
  );\n    console.log(headingElement.id); // bigMessage\n    headingElement.className\
  \ = \"bar\";\n  </script>\n</body>\n```\n\n回到我们的示例，注意我从使用 `getAttribute` 和 `setAttribute`\
  \ 切换到了使用 `className` 属性。结果是相同的。唯一的区别是你可以不需要使用 `getAttribute` 或 `setAttribute` 就可以直接设置这些属性值。在继续之前，我必须指出一点奇怪的：是的，我们不能在\
  \ JavaScript 中使用 `class` 属性，因为 `class` 有完全不同的含义。这就是为什么我们使用 `className`。\n\n![Images](img/tip.jpg)\n\
  \n除了使用 `className`，还有更好的设置类值的方法。那就是通过强大的 `classList` 属性，你将在下一章中学习。\n\n# 30 样式化我们的内容\n\
  \n在本章中：\n\n*   学习如何使用 JavaScript 修改 CSS\n*   理解直接设置样式与调整类值的优缺点\n*   使用 `classList`\
  \ 轻松处理类值\n\n在上一章中，我们查看了如何使用 JavaScript 修改 DOM 内容。让 HTML 元素脱颖而出的部分是它们的它们的，即样式化。当对某些内容进行样式化时，最常见的方法是创建一个样式规则并让其目标元素元素或元素。样式规则如下：\n\
  \n```css\n.batman {\n  width: 100px;\n  height: 100px;\n  background-color: #333;\n\
  }\n```\n\n受此样式规则影响的元素可能是：\n\n```html\n<div class=\"batman\"></div>\n```\n\n在任何网页上，我们都会看到从几个到许多样式规则，它们相互叠加以样式化我们看到的一切。但这并不是我们使用\
  \ CSS 样式化内容的唯一方法。如果没有多种方法来实现同一个任务，HTML 就不会是这样！\n\n忽略内联样式，我们可以使用的另一种方法。我们可以使用 JavaScript\
  \ **直接在元素上设置样式**，也可以使用 JavaScript **为元素添加或移除类值**。\n\n在本章中，我们将学习这两种方法。\n\n### 为什么我们要用\
  \ JavaScript 设置样式？\n\n在继续之前，解释一下我们为什么要使用 JavaScript 来影响元素的样式可能是很有用的。在用样式规则或内联样式影响元素外观的常见情况下，样式在页面加载时就会生效。这很棒，而且可能是我们大多数时候想要的。\n\
  \n有很多情况，特别是当我们的内容更具交互性时，我们希望样式能够根据用户输入、后台代码运行等动态生效。在这些情况下，涉及样式规则或内联样式的 CSS 模型无法帮助我们。虽然像\
  \ `hover` 这样的伪类选择提供了一些支持，但我们能做的仍然受到很大限制。\n\n我们所有这些情况需要的解决方案都是涉及 JavaScript 的。JavaScript\
  \ 不仅让我们样式化交互元素；更重要的是，它允许我们样式化整个页面。这种自由非常强大，远远超过了 CSS 样式化内部（或靠近）内容的有限能力。\n\n###两种样式方法的故事\n\
  \n正如我们在引言所示，我们有两种使用 JavaScript 修改元素样式的方法。一种是直接在元素上设置 CSS 属性。另一种是从元素中添加或移除类值，这可能导致某些样式规则被应用或忽略。让我们详细查看这两种情况。\n\
  \n### 直接设置样式\n\n每个通过 JavaScript 访问的 HTML 元素都有一个 `style` 对象。这个对象允许你指定 CSS 属性并设置其值。例如，设置\
  \ id 为 `superman` 的 HTML 元素的背景颜色是这样的：\n\n点击此处查看代码图片\n\n```javascript\nlet myElement\
  \ = document.querySelector(\"#superman\");\nmyElement.style.backgroundColor = \"\
  #D93600\";\n```\n\n要影响多个元素，你可以像如下操作：\n\n点击此处查看代码图片\n\n```javascript\nlet myElements\
  \ = document.querySelectorAll(\".bar\");\nfor (let i = 0; i < myElements.length;\
  \ i++) {\n  myElements[i].style.opacity = 0;\n}\n```\n\n\n\n简而言之，要使用 JavaScript\
  \ 直接样式元素，第一步是获取元素。我们之前提到的实用的 `querySelector` 方法在这里非常有帮助。第二步只需找到你关心的 CSS 属性并给它赋一个值。记住，CSS\
  \ 中的许多值实际上是字符串。同样要记住，许多值需要一个测量单位（如 `px` 或 `em`）才能被实际识别。还要记住……实际上，我忘记了。\n\n最后，某些\
  \ CSS 属性需要提供一个更复杂的值，即在一连堆随机文本后跟上你关心的值。这一类中比较流行的属性之一是 `transform` 属性。设置复杂值的一种方法是使用传统的字符串拼接：\n\
  \n点击此处查看代码图片\n\n```\nmyElement.style.transform = \"translate3d(\" + xPos + \", \"\
  \ + yPos + \"px, 0)\";\n```\n\n这会变得非常烦人，因为追踪引号等内容是一项繁琐且容易出错的工作。另一个不那么烦人的解决方案是使用模板字符串字量（template\
  \ literal）语法：\n\n点击此处查看代码图片\n\n```\nmyElement.style.transform = `translate3d(${xPos}px,\
  \ ${yPos}px, 0)`;\n```\n\n注意这种方法如何让你在提供自定义值的同时，避免了所有字符串拼接的复杂性。我们稍后会详细查看这种语法！\n\n\
  ![Images](img/tip.jpg) 提示\n\n### CSS 属性名称的特殊大小写\n\nJavaScript 对什么构成有效的属性名非常挑剔。CSS\
  \ 中的大多数名称都能通过 JavaScript 的认可，所以你可以直接使用它们。不过，有几点需要注意。\n\n要在 JavaScript 中指定包含连字符（dash）的\
  \ CSS 属性，只需删除连字符即可。例如，`background-color` 变为 `backgroundColor`，`border-radius` 属性转换为\
  \ `borderRadius`，依此类推。\n\n此外，JavaScript 中的某些单词是保留字，不能直接使用。属于这一特殊类别的 CSS 属性示例是 `float`。在\
  \ CSS 中，它是一个布局属性；在 JavaScript 中，它代表其他含义。要使用名称完全被保留的属性，请在属性名前加上 `css` 前缀，例如 `float`\
  \ 变为 `cssFloat`。\n\n### 使用 JavaScript 添加和移除类名\n\n另一种方法涉及添加和移除类值，这反过来会改变应用的样式规则。例如，假设我们有如下样式规则：\n\
  \n```css\n.disableMenu {\n  display: none;\n}\n```\n\n在 HTML 中，我们有一个 `id` 为 `dropDown`\
  \ 的菜单：\n\n```html\n<ul id=\"dropDown\">\n  <li>One</li>\n  <li>Two</li>\n  <li>Three</li>\n\
  \  <li>Four</li>\n  <li>Five</li>\n  <li>Six</li>\n</ul>\n```\n\n现在，如果我们想对这个元素应用\
  \ `.disableMenu` 样式规则，我们所做的是将 `disableMenu` 作为 `class` 值添加到 `dropDown` 元素中：\n\n\
  点击此处查看代码图片\n\n```html\n<ul class=\"disableMenu\" id=\"dropDown\">\n  <li>One</li>\n\
  \  <li>Two</li>\n  <li>Three</li>\n  <li>Four</li>\n  <li>Five</li>\n  <li>Six</li>\n\
  </ul>\n```\n\n实现这一点的方法之一是设置元素的 `className` 属性，这是我们之前见过的一种方法。`className` 的问题在于，我们需要负责维护当前应用的类值列表。糟糕糟糕，类值列表是以字符串形式返回给我们的。如果我们有多个想要添加、移除或仅仅切换开启/关闭的类值，必须进行大量容易出错的字符串相关技巧操作，这一点也不好玩。\n\
  \n为了缓解一些不便，我们现在有了一个更棒的 API，它让从元素上添加和移除类值变得异常简单。这个新 API 被亲切地称为 `classList`，它提供了几个方法，让处理类值的工作变得如空菜一样简单：\n\
  \n*   `add`\n*   `remove`\n*   `toggle`\n*   `contains`\n\n这四个方法的作用可能从它们的名称已经一目易见了，但让我们详细查看它们。\n\
  \n### 添加类值\n\n要向元素添加类值，请获取元素的引用，并通过 `classList` 调用其上的 `add` 方法：\n\n点击此处查看代码图片\n\n\
  ```javascript\nlet divElement = document.querySelector(\"#myDiv\");\ndivElement.classList.add(\"\
  bar\");\ndivElement.classList.add(\"foo\");\ndivElement.classList.add(\"zorb\");\n\
  divElement.classList.add(\"baz\");\nconsole.log(divElement.classList);\n```\n\n\
  运行这段代码后，我们的 `div` 元素将具有以下类值：`bar`、`foo`、`zorb` 和 `baz`。`classList` API 会确保在类值之间添加空格。如果我们指定了一个无效的类值，`classList`\
  \ API 会报错且不会添加它。如果我们告诉 `add` 方法添加一个元素上已经存在的类，我们的代码仍会运行，但重复的类值不会被添加。\n\n### 移除类值\n\
  \n要移除类值，我们可以在 `classList` 上调用 `remove` 方法：\n\n点击此处查看代码图片\n\n```javascript\nlet divElement\
  \ = document.querySelector(\"#myDiv\");\ndivElement.classList.remove(\"foo\");\n\
  console.log(divElement.classList);\n```\n\n执行这段代码后，`foo` 类值将被移除。剩下的只有 `bar`、`zorb`\
  \ 和 `baz`。非常简单，对吧？\n\n### 切换类值\n\n对于许多样式场景，有一种非常常见的工作流。首先，我们检查元素上的某个类值是否存在。如果值存在，则将其从元素中移除；如果值不存在，则将该类值添加到元素中。为了简化这种常见的切换模式，`classList`\
  \ API 为你提供了 `toggle` 方法：\n\n点击此处查看代码图片\n\n```javascript\nlet divElement = document.querySelector(\"\
  #myDiv\");\ndivElement.classList.toggle(\"foo\"); // 移除 foo\ndivElement.classList.toggle(\"\
  foo\"); // 添加 foo\ndivElement.classList.toggle(\"foo\"); // 移除 foo\nconsole.log(divElement.classList);\n\
  ```\n\n`toggle` 方法正如其名，每次调用会在元素上添加或移除指定的类值。在我们的情况下，第一次调用 `toggle` 方法时移除了 `foo` 类。第二次时，添加了\
  \ `foo` 类。第三次时，移除了 `foo` 类。你懂意思的。\n\n### 检查类值是否存在\n\n我们最后查看的是 `contains` 方法：\n\n\
  点击此处查看代码图片\n\n```javascript\nlet divElement = document.querySelector(\"#myDiv\"\
  );\nif (divElement.classList.contains(\"bar\") == true) {\n  // 执行某些操作\n}\n```\n\
  \n该方法检查元素上是否存在指定的类值。如果值存在，你将得到 `true`。如果值不存在，你将得到 `false`。\n\n### 进阶\n\n正如你所见，`classList`\
  \ API 为你提供了极其方便地添加、移除或检查元素类所需的所有功能——重点在“几乎”这个词。对于 API 默认未提供的少数功能，你可以去网上阅读我关于使用 `classList`\
  \ 进行更多操作的完整文章，地址为 **[`bit.ly/kClassList`](http://bit.ly/kClassList)**。\n\n## 31:\
  \ 使用 CSS 属性\n\n在本章中\n\n*   学习什么是 CSS 属性\n*   使用各种 JavaScript 方法读取和设置 CSS 属性\n\n\
  当你使用 JavaScript 设置 CSS 属性时（尤其是复杂的属性时），你经常发现自己在与字符串斗争：\n\n点击此处查看代码图片\n\n\n\n\n```javascript\n\
  var myCircle = document.querySelector(\"#myCircle\");\n\nsetTranslate(50, 75, myCircle);\n\
  \n// 旧版方法\n\nfunction setTranslate(xPos, yPos, el) {\n  el.style.transform = \"\
  translate3d(\" + xPos + \", \" + yPos + \"px, 0)\";\n}\n\n// 稍微改进的基于 ES6 的旧方法\n\n\
  function setTranslate(xPos, yPos, el) {\n  el.style.transform = `translate3d(${xPos}px,\
  \ ${yPos}px, 0)`;\n}\n```\n\n别误会。我喜欢在各处进行一些字符串处理，但你必须承认，像前面这样的代码在生成时有点令人沮丧，而且如果你不小心，很容易产生各种错误。你试图设置的值越复杂，一切情况就越糟糕。此外，在\
  \ JavaScript 中嵌入巨大的 CSS 字符串看起来也真的非常诡异。\n\n在这一章中，我们将介绍一种名为 `CSS 自定义属性`（也称为 `CSS 变量`）的技术，它将让我们从生成字符串的工作中解脱出来，极大地简化我们指定复杂值的方式。让我们来看看如何做到这一点！\n\
  \n## 什么是 CSS 自定义属性/变量？\n\nCSS 语言最近新增的大特性之一就是被称为 `CSS 自定义属性` 的东西，通常也称为 `CSS 变量`。CSS\
  \ 自定义属性允许你做的事情非常酷。在样式规则内部，你可以指定一个自定义属性名称，并将其初始化为所需的任何值：\n\n点击此处查看代码图片\n\n```css\n\
  #container {\n  --myAlign: center;\n  width: 100%;\n  height: 350px;\n  background-color:\
  \ #0099FF;\n  display: flex;\n  align-items: var(--myAlign);\n  justify-content:\
  \ var(--myAlign);\n}\n```\n\n这个自定义属性随后可以在 CSS 的其他地方使用，你可以在那里指定它，而不是直接指定内联值：\n\n\
  点击此处查看代码图片\n\n```css\n#container {\n  --myAlign: center;\n  width: 100%;\n  height:\
  \ 350px;\n  background-color: #0099FF;\n  display: flex;\n  align-items: var(--myAlign);\n\
  \  justify-content: var(--myAlign);\n}\n```\n\n注意在这个示例中，`align-items` 和 `justify-content`\
  \ 属性的值并没有直接指定，而是从自定义的 --`myAlign` 属性名称推断出来的。\n\n就像你在 JavaScript 中使用的变量一样，你现在有了一个指定值的地方。如果你更改了我们的自定义\
  \ `myAlign` 属性的值，任何对它的使用都将使用新值。这与变量的工作方式完全一致。CSS 特有的行为与作用域有关。你定义的自定义属性`遵循典型的 CSS\
  \ 级联规则`，因此你在哪里指定该属性决定了该属性的值是否可以被使用。如果你希望全局声明某些自定义 CSS 属性，可以在 `body` 选择器中指定它们，或者使用\
  \ `root` 选择器再往上跳层：\n\n```css\n:root {\n  --logoColor: \"#333\";\n  --headerColor:\
  \ \"green\";\n  --avatarWidth: 150px;\n}\n```\n\n如果你不熟悉 `root` 选择器，它大致翻译为将样式应用到\
  \ `<html>` 标签级别。\n\n现在，要使用 JavaScript 修改自定义 CSS 属性的值，不需要做任何特殊操作。你过去使用过的经过实践测试的 `setProperty`\
  \ 方法仍然有效：\n\n点击此处查看代码图片\n\n```javascript\nmyLogo.style.setProperty(\"--logoColor\"\
  , \"#505168\");\n```\n\n在前面的代码中，我们将我们的 `--logoColor` 自定义属性设置为一种深紫色。因为我们是在 `myLogo`\
  \ 元素上内联设置了此值，所以它将具有更高的优先级，并覆盖我们早早在 root 样式规则中设置的任何值。不言而明，任何依赖于 `--logoColor` 值的\
  \ CSS 属性值将自动更新以反映新值。\n\n如果你希望读取自定义 CSS 属性的值，则需要遵循几个细微的额外步骤。假设你在 `body` 选择器上设置了一个名为\
  \ `themeColor` 的自定义属性：\n\n```css\nbody {\n  --themeColor: \"blue\";\n}\n```\n\n\
  你读取该属性及其值的方法是使用 `getComputedStyle`，如下所示：\n\n点击此处查看代码图片\n\n```javascript\nvar bodyStyle\
  \ = getComputedStyle(document.body);\nvar theme = bodyStyle.getPropertyValue(\"\
  --themeColor\");\nalert(theme);\n```\n\n这看起来很容易，对吧？好吧，你可能知道，每当问出这样的问题时，答案永远不是简单的*是*。你可能会认为我们最终得到的值是\
  \ `“blue”`。但我们实际上得到的是 `“blue”`（忽略引号，但请注意前面的空格）。这是因为 W3C 定义的*原始*行为（仅针对自定义属性）是读取 `--themeColor`:\
  \ \"`blue`\" 之间的空格值。这意味着当你在检查 `theme == \"blue\"` 时，需要考虑前导空格。关于这种行为，你可以阅读更多：[`bit.ly/css_custom_prop`](https://bit.ly/css_custom_prop)\n\
  \n## 轻松设置复杂值\n\n通过 JavaScript 修改自定义 CSS 属性的值，不再需要处理复杂的字符串。像我们在开始时那样在 JavaScript\
  \ 中使用 `transform` 属性，现在在 CSS 变量的世界中，我们可以这样设置 `transform` 属性水平和垂直值：\n\n点击此处查看代码图片\n\
  \n```css\n#myCircle {\n  --xPos: 0px;\n  --yPos: 0px;\n  width: 100px;\n  height:\
  \ 100px;\n  transform: translate3d(var(--xPos), var(--yPos), 0);\n}\n```\n\n为了更新这些值，我们的\
  \ JavaScript 如下：\n\n点击此处查看代码图片\n\n```javascript\nvar myCircle = document.querySelector(\"\
  #myCircle\");\n\nsetTranslate(50, 75, myCircle);\n\nfunction setTranslate(xPos,\
  \ yPos, el) {\n  el.style.setProperty(\"--xPos\", xPos + \"px\");\n  el.style.setProperty(\"\
  --yPos\", yPos + \"px\");\n}\n```\n\n注意，我们不再需要生成巨大的字符串，担心某些位置的转义字符等等。我们只需要更新自定义属性的值，这种更新就会处理一切！从这种方法中获得的另一个好处是，如果我们以后想让\
  \ `transform` 属性变得更复杂，我们完全可以这样做，而不需要在 JavaScript 中更改：\n\n点击此处查看代码图片\n\n```css\n\
  #myCircle {\n  --xPos: 0px;\n  --yPos: 0px;\n  width: 100px;\n  height: 100px;\n\
  \  background-color: #FFF;\n  border: 10px solid #006CC;\n  border-radius: 50%;\n\
  \  transform: translate3d(var(--xPos), var(--yPos), 0)\n              rotate(30deg)\n\
  \              scale3d(1.5, 1.5, 0);\n}\n```\n\n\n\n\n我们在这里看到的是用于 `background-image`\
  \ 属性的一个相当简单的线性渐变（linear-gradient）函数。尽管看起来简单，但已经有六行代码了。想象一下，如果没有依赖 `--stripeColor`\
  \ 自定义属性来设置条纹颜色将会是怎样。在这种情况下，你真的想在某些 JavaScript 中生成整个长字符串吗？\n\nCSS 自定义属性让通过 JavaScript\
  \ 设置复杂变得极其简单。只要我们不修改自定义的 CSS 属性名称或它期望的值类型，我们就可以在样式规则内部随心所欲，而无需确保我们的 JavaScript 与更改保持同步。这是我们在旧世界中无法做到的，在旧世界中，即使我们只需要修改其中一小部分，也必须在\
  \ JavaScript 中生成完整的复杂值——或者在糟糕的情况下，完全改变值的形状，例如从线性渐变变为径向渐变！\n\n# 32\n\n### 遍历 DOM\n\
  \n在本章中\n\n* 学习如何导航 DOM 树\n* 使用你拥有的各种 API 来移动和更改元素的父级关系\n* 查找元素的兄弟、父元素、子元素等\n\n你现在可能已经意识到了，我们的\
  \ DOM 看起来像一棵巨大的树——一棵元素危险地悬挂在分支上、并试图避开到处都是的尖利物的巨树。从技术角度来说，我们 DOM 中的元素按层级结构排列的，如 图\
  \ 32.1 所示，这定义了我们最终在浏览器中看到的内容。\n\n![images](img/32fig01.jpg)\n\n图 32.1\n\nDOM 和浏览器就像同一袋子里的豆豆。\n\
  \n这种层级结构用于帮助组织我们的 HTML 元素。它还用于帮助我们的 CSS 样式规则理解在哪些元素上应用哪些样式。从 JavaScript 的角度来看，这种层级结构确实增加了一些复杂性。我们将花费大量时间尝试弄清楚现在位于\
  \ DOM 的哪个位置，以及我们需要去哪里。当我们研究创建新元素或移动元素时，这种复杂性会变得更加明显。这种复杂性是我们需要适应的。\n\n这正是本章大显用场。为了帮助你理解如何轻松地从一个分支到另一个分支（基本上就像猴子一样），DOM\
  \ 为你提供了属性，你可以将它们与已经的技术结合使用。本章将为你概述这一切以及更多内容。\n\n### 寻找出路\n\n在我们找到元素并对它们做很不起的事情之前，我们需要先到达元素所在的地方。处理这个主题最简单的方法就是从顶部开始一直滑到底。这正是我们要做的。\n\
  \n我们 DOM 顶部的视图由我们的 `window`、`document` 和 html 元素组成，如 图 32.2 所示。\n\n![images](img/32fig02.jpg)\n\
  \n图 32.2\n\n这棵树顶部的视图永远不会改变。\n\n由于这三者非常重要，DOM 允许我们通过 `window`、`document` 和 `document.documentElement`\
  \ 轻松访问它们：\n\n点击此处查看代码图片\n\n```\nlet windowObject = window; // 嗯....\n\nlet documentObject\
  \ = document;  // 这可能没有必要\n\nlet htmlElement = document.documentElement;\n```\n\n\
  需要注意的是，`window` 和 `document` 都是全局属性。我们不需要像我刚才做那样显式地声明它们。只需直接从容器中取出并使用即可。\n\n一旦我们进入\
  \ HTML 元素级以下，我们的 DOM 就会开始分支并变得更有趣。此时，我们有几种导航方法。我们见过很多次的一种方法是使用 `querySelector` 和\
  \ `querySelectorAll` 来精确获取我们感兴趣的元素。在许多实际应用中，在旧世界中，我们必须在 JavaScript 中生成完整的复杂值，即使我们只需要修改它的其中一小部分——或者，在糟糕的情况下，完全改变值的形状，例如从线性渐变变为径向渐变！\n\
