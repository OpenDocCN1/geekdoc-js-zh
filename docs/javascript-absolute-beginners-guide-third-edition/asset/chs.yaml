  \      border-bottom: 2px solid #CCC;\n      padding-bottom: 30px;\n    }\n    h1\
  \ {\n      font-family: sans-serif;\n      font-size: 32px;\n      font-weight:\
  \ bold;\n    }\n    p {\n      font-family: sans-serif;\n      font-size: 18px;\n\
  \      line-height: 1.5;\n    }\n    #container {\n      min-height: 300px;\n  \
  \    height: 300px;\n      border: 5px solid black;\n      margin-top: 30px;\n \
  \     overflow: auto;\n      background-color: #f4f4f4;\n    }\n    .item {\n  \
  \    margin: 20px;\n      background-color: #FFF;\n    }\n    .item p {\n      padding:\
  \ 10px;\n    }\n    #generateItems {\n      border: 5px solid black;\n      padding:\
  \ 10px;\n      font-size: 16px;\n      font-weight: bold;\n      background-color:\
