  \ `JSON` 对象变得容易得多！\n\n从表面上看，对象字面量语法看起来是一堆括号、冒号和奇怪的大括号，它们定义了你对象的属性和值。尽管它看起来很奇怪，但在底层，它是非常具描述性的。你可能想要使用的许多常用数据类型都是用的。你可以你可以齐地用由冒号分隔的键值对来表示它们的属性和值。与我刚才提到的其他内容同样重要的是，这种语法允许你拥有结构和嵌套值。总的来说，这是表示\
  \ JavaScript 对象的的一种非常棒的方法……以字面表示的方式！\n\n`JSON` 格式大量借鉴了这种对象字面量语法。以下是 WeatherUnderground\
  \ API 返回的某些真实 `JSON` 数据的示例，用于显示我家乡西雅图的天气：\n\n点击此处查看代码图片\n\n```\n{\n  \"response\"\
  : {\n    \"version\": \"0.1\",\n    \"termsofService\": \"http://www.wunderground.com/weather/api/d/terms.html\"\
