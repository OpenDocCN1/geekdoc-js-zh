    ### 第 28.2 节：减少编程错误的配置\n\n有一些非常好的配置可以强制类型检查并获取更有帮助的错误，这些配置默认是不启用的。\n\n```json\n\
    {\n  \"compilerOptions\" : {\n    \"alwaysStrict\" : true , // 在严格模式下解析并为每个源文件生成\
    \ \"use strict\"。\n    // 如果在引用的文件中大小写错误，例如文件名是 Global.ts，而你使用了 /// <reference\
    \ path=\"global.ts\" /> 来引用该文件，这可能会导致意外错误。请访问：http://stackoverflow.com/questions/36628612/typescript-transpiler-casing-issue\n\
    \    \"forceConsistentCasingInFileNames\" : true, // 不允许对同一个文件进行大小写一致的引用。\n  \
    \  // \"allowUnreachableCode\": false, // 不对不可达代码报告错误。（默认: False） // \"allowUnusedLabels\"\
    : false, // 不对未使用标签报告错误。（默认: False）\n    \"noFallthroughCasesInSwitch\" : true,\
    \ // 对 switch 语句中的穿透情况（fallthrough）报告错误。\n    \"noImplicitReturns\" : true, //\
    \ 当函数中并非所有代码路径都返回值时报告错误。\n    \"noUnusedParameters\" : true, // 对未使用的参数报告错误。\n\
    \    \"noUnusedLocals\" : true, // 对未使用的局部变量报告错误。\n    \"noImplicitAny\" : true,\
    \ // 对隐式 \"any\" 类型的表达式和声明引发错误。\n    \"noImplicitThis\" : true, // 对隐式 \"any\"\
    \ 类型的 this 表达式引发错误。\n    \"strictNullChecks\" : true, // null 和 undefined 值不属于所有类型的范围，且只能赋值给自身和\
    \ any。\n    // 若要强制执行此规则，请添加此配置。\n    \"noEmitOnError\" : true // 如果报告了任何错误，则不生成输出。\n\
    \  }\n}\n```\n\n不够吗？如果你是一个硬核编码者并想要更多，你可能感兴趣在用 `tsc` 编译之前用 tslint 检查你的 TypeScript\
    \ 文件。查看如何配置 tslint 以获得更严格的代码。\n\n### 第 28.3 节：compileOnSave\n\n设置顶层属性 `compileOnSave`\
    \ 会向 IDE 信号，在保存时为指定的 `tsconfig.json` 生成所有文件。\n\n```json\n{\n  \"compileOnSave\"\
    \ : true ,\n  \"compilerOptions\" : {\n    ...\n  },\n  \"exclude\" : [\n    ...\n\
    \  ]\n}\n```\n\n此功能自 TypeScript 1.8.4 起可用，但需要 IDE 的直接支持。目前支持的 IDE 示例包括：\n\n- 带\
    \ Update 3 的 Visual Studio 2015\n- JetBrains WebStorm\n- 带有 atom-typescript 的\
    \ Atom\n\n### 第 28.4 节：注释\n\n`tsconfig.json` 文件可以包含行注释和块注释，使用与 ECMAScript 相同的规则。\n\
    \n```javascript\n//行首注释\n{\n  \"compilerOptions\" : {\n    //这是一行行注释\n    \"module\"\
    \ : \"commonjs\" , //行尾注释\n    \"target\" /*内联块*/ : \"es5\" , /* 这是一个块注释 */\n\
    \  }\n}\n/*尾随注释 */\n```\n\n### 第 28.5 节：preserveConstEnums\n\nTypeScript 支持通过\
    \ `const` enum 声明常量枚举（constant enumerables）。\n\n这通常只是语法糖，因为常量枚举在编译后的 JavaScript\
    \ 中被内联了。\n\n例如，以下代码\n\n```typescript\nconst enum Tristate {\n  True,\n  False,\n\
    \  Unknown\n}\n\nvar something = Tristate.True ;\n```\n\n编译为：\n\n```javascript\n\
    var something = 0 ;\n```\n\n虽然内联带来了性能上的处，但你可能更倾向于保留枚举即使它是常量（即：你可能希望开发代码具有可读性），要做到这一点，你必须在\
    \ `tsconfig.json` 的 `compilerOptions` 中将 `preserveConstEnums` 子句设置为 `true`。\n\n\
    ```json\n{ \n  \"compilerOptions\" : {\n    \"preserveConstEnums\" = true , ...\n\
    \  },\n  \"exclude\" : [\n    ...\n  ]\n}\n```\n\n通过这种方式，之前的示例将像其他枚举一样被编译，如下所示所示。\n\
    \n```javascript\nvar Tristate;\n( function ( Tristate) {\n  Tristate[ Tristate[\
    \ \"True\" ] = 0 ] = \"True\" ; Tristate[ Tristate[ \"False\" ] = 1 ] = \"False\"\
    \ ; Tristate[ Tristate[ \"Unknown\" ] = 2 ] = \"Unknown\" ;\n})( Tristate || (\
    \ Tristate = {}));\nvar something = Tristate.True\n```\n\n### 第 29 章：调试\n\n运行和调试\
    \ TypeScript 有两种方法：\n\n1. **编译为 JavaScript**，在 node 中运行并使用映射链接回 TypeScript 源文件。\n\
    2. **使用 `ts-node` 直接运行 TypeScript**\n\n本文描述了使用 Visual Studio Code 和 WebStorm 的这两种方法。所有示例均假设你的主文件是\
    \ `index.ts`。\n\n### 第 29.1 节：配合 ts-node 的 TypeScript\n\n在 WebStorm 中将此脚本添加到 `package.json`：\n\
