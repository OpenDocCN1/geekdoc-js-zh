    ### **Chapter 5: Enums


    Section 5.1: Enums with explicit values**


    By default all enum values are resolved to numbers. Let''s say if you have something
    like


    enum MimeType {


    JPEG,


    PNG,


    PDF


    }


    the real value behind e.g. MimeType.PDF will be 2.


    But some of the time it is important to have the enum resolve to a different type.
    E.g. you receive the value from backend / frontend / another system which is definitely
    a string. This could be a pain, but luckily there is this method:


    enum MimeType {


    JPEG = < any> ''image/jpeg'' ,


    PNG = < any> ''image/png'' ,


    PDF = < any> ''application/pdf''


    }


    This resolves the MimeType.PDF to application/ pdf.


    Since TypeScript 2.4 it''s possible to declare string enums :


    enum MimeType {


    JPEG = ''image/jpeg'' , PNG = ''image/png'' ,


    PDF = ''application/pdf'' ,


    }


    You can explicitly provide numeric values using the same method


    enum MyType {


    Value = 3 ,


    ValueEx = 30 , ValueEx2 = 300


    }


    Fancier types also work, since non-const enums are real objects at runtime, for
    example


    enum FancyType {


    OneArr = < any>[ 1 ],


    TwoArr = < any>[ 2 , 2 ], ThreeArr = < any>[ 3 , 3 , 3 ]


    }


    becomes


    **var** FancyType;


    ( **function** ( FancyType) {


    FancyType[ FancyType[ "OneArr" ] = [ 1 ]] = "OneArr" ; FancyType[ FancyType[ "TwoArr"
    ] = [ 2 , 2 ]] = "TwoArr" ;


    FancyType[ FancyType[ "ThreeArr" ] = [ 3 , 3 , 3 ]] = "ThreeArr" ; })( FancyType
    || ( FancyType = {}));


    ### **Section 5.2: How to get all enum values**


    enum SomeEnum { A, B }


    **let** enumValues: Array< string>= [];


    **for** ( **let** value **in** SomeEnum) {


    **if** ( **typeof** SomeEnum[ value] === ''number'' ) {


    enumValues.push ( value);


    }


    }


    enumValues. forEach ( v=> console.log ( v))


    *//A


    //B*


    ### **Section 5.3: Extending enums without custom enum implementation**


    enum SourceEnum {


    value1 = < any> ''value1'' ,


    value2 = < any> ''value2''


    }


    enum AdditionToSourceEnum { value3 = < any> ''value3'' , value4 = < any> ''value4''


    }


    *// we need this type for TypeScript to resolve the types correctly* type TestEnumType
    = SourceEnum | AdditionToSourceEnum; *// and we need this value "instance" to
    use values*


    **let** TestEnum = Object.assign ({}, SourceEnum, AdditionToSourceEnum); *// also
    works fine the TypeScript 2 feature


    // let TestEnum = { ...SourceEnum, ...AdditionToSourceEnum };*


    **function** check( test: TestEnumType) { **return** test === TestEnum.value2
    ;


    }


    console. log ( TestEnum.value1 );


    console.log ( TestEnum.value2 === < any> ''value2'' ); console.log ( check( TestEnum.value2
    ));


    console.log ( check( TestEnum.value3 ));


    ### **Section 5.4: Custom enum implementation: extends for enums**


    Sometimes it is required to implement Enum on your own. E.g. there is no clear
    way to extend other enums. Custom implementation allows this:


    class Enum {


    constructor( protected value: string) {}


    public toString() {


    **return** String( **this** .value );


    public is ( value: Enum | string) { **return this** .value = value.toString ();


    }


    }


    class SourceEnum extends Enum {


    public **static** value1 = **new** SourceEnum( ''value1'' ); public **static**
    value2 = **new** SourceEnum( ''value2'' );


    }


    class TestEnum extends SourceEnum {


    public **static** value3 = **new** TestEnum( ''value3'' ); public **static** value4
    = **new** TestEnum( ''value4'' );


    }


    **function** check( test: TestEnum) { **return** test === TestEnum.value2 ;


    }


    **let** value1 = TestEnum.value1 ;


    console. log ( value1 + ''hello'' );


    console.log ( value1.toString () === ''value1'' ); console.log ( value1.is ( ''value1''
    ));


    console.log (! TestEnum.value3 .is ( TestEnum.value3 )); console.log ( check(
    TestEnum.value2 ));


    *// this works but perhaps your TSLint would complain // attention! does not work
    with ===


    // use .is() instead*


    console.log ( TestEnum.value1 == < any> ''value1'' );


    ### **Chapter 6: Functions


    Section 6.1: Optional and Default Parameters**


    **Optional Parameters**


    In TypeScript, every parameter is assumed to be required by the function. You
    can add a **?** at the end of a parameter name to set it as optional.


    For example, the lastName parameter of this function is optional:


    **function** buildName( firstName: string, lastName?: string) {


    *// ...*


    }


    Optional parameters must come after all non-optional parameters:


    **function** buildName( firstName?: string, lastName: string) *// Invalid*


    **Default Parameters**


    If the user passes **undefined** or doesn''t specify an argument, the default
    value will be assigned. These are called *default-initialized* parameters.


    For example, "Smith" is the default value for the lastName parameter.


    **function** buildName( firstName: string, lastName = "Smith" ) {


    *// ...*


    }


    buildName( ''foo'' , ''bar'' ); *// firstName == ''foo'', lastName == ''bar''*


    buildName( ''foo'' ); *// firstName == ''foo'', lastName == ''Smith''*


    buildName( ''foo'' , **undefined** ); *// firstName == ''foo'', lastName == ''Smith''*


    ### **Section 6.2: Function as a parameter**


    Suppose we want to receive a function as a parameter, we can do it like this:


    **function** foo( otherFunc: Function): **void** {


    ...


    }


    If we want to receive a constructor as a parameter:


    **function** foo( constructorFunc: { **new** () }) {


    **new** constructorFunc();


    }


    **function** foo( constructorWithParamsFunc: { **new** ( num: number) }) {


    **new** constructorWithParamsFunc( 1 );


    }


    Or to make it easier to read we can define an interface describing the constructor:


    interface IConstructor {


    **new** ();


    **function** foo( contructorFunc: IConstructor) { **new** constructorFunc();


    }


    Or with parameters:


    interface INumberConstructor { **new** ( num: number);


    }


    **function** foo( contructorFunc: INumberConstructor) { **new** contructorFunc(
    1 );


    }


    Even with generics:


    interface ITConstructor< T, U> { **new** ( item: T): U;


    }


    **function** foo< T, U>( contructorFunc: ITConstructor< T, U>, item: T): U { **return
    new** contructorFunc( item);


    }


    If we want to receive a simple function and not a constructor it''s almost the
    same:


    **function** foo( func: { (): **void** }) { func();


    }


    **function** foo( constructorWithParamsFunc: { ( num: number): **void** }) { **new**
    constructorWithParamsFunc( 1 );


    }


    Or to make it easier to read we can define an interface describing the function:


    interface IFunction { (): **void** ;


    }'
