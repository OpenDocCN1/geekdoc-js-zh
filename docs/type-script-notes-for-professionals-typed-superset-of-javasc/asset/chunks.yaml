    \ boolean = false ;\n\n  constructor () {\n    SomeClass.SomeStaticValue = SomeClass.getGoodbye();\n\
    \    this.someMemberValue = this.getFortyTwo();\n    this.somePrivateValue = this.getTrue();\n\
    \  }\n\n  static getGoodbye(): string {\n    return \"goodbye!\" ;\n  }\n\n  public\
    \ getFortyTwo(): number {\n    return 42 ;\n  }\n\n  private getTrue(): boolean\
    \ {\n    return true ;\n  }\n}\n```\n\n```javascript\nvar SomeClass = (function\
    \ () {\n  function SomeClass() {\n    this.someMemberValue = 15;\n    this.somePrivateValue\
    \ = false;\n    SomeClass.SomeStaticValue = SomeClass.getGoodbye();\n    this.someMemberValue\
    \ = this.getFortyTwo();\n    this.somePrivateValue = this.getTrue();\n  }\n  SomeClass.getGoodbye\
    \ = function () {\n    return \"goodbye!\" ;\n  };\n  SomeClass.prototype.getFortyTwo\
    \ = function () {\n    return 42 ;\n  };\n  SomeClass.prototype.getTrue = function\
    \ () {\n    return true ;\n  };\n  return SomeClass;\n})());\n```\n\n**观察**\n\n\
    对类原型的修改被封装在一个 IIFE（立即调用函数表达式）中。\n\n"
- fmt: "\nMember variables are defined inside the main class `function`.\n\nStatic\
    \ properties are added directly to the class object, whereas instance properties\
    \ are added to the prototype.\n\n### Section 7.7: Monkey patch a function into\
    \ an existing class\n\nSometimes it's useful to be able to extend a class with\
    \ new functions. For example let's suppose that a string should be converted to\
    \ a camel case string. So we need to tell TypeScript, that `String` contains a\
    \ function called `toCamelCase`, which returns a string.\n\n```typescript\ninterface\
    \ String {\n  toCamelCase(): string;\n}\n```\n\nNow we can patch this function\
    \ into the `String` implementation.\n\n```typescript\nString.prototype.toCamelCase\
    \ = function () : string {\n  return this.replace(/[^a-z ]/ig, '')\n    .replace(/(?:^\\\
    w|[A-Z]|\\b\\w|\\s+)/g, (match: any, index: number) => {\n      return +match\
    \ === 0 ? \"\" : match[index === 0 ? 'toLowerCase' : 'toUpperCase']();\n    });\n\
    }\n```\n\nIf this extension of `String` is loaded, it's usable like this: `\"\
    This is an example\".toCamelCase(); *// => \"thisIsAnExample\"*\n\n### Chapter\
    \ 8: Class Decorator\n\n**Parameter Details**\n`target` The class being decorated\n\
    \n### Section 8.1: Generating metadata using a class decorator\n\nThis time we\
    \ are going to declare a class decorator that will add some metadata to a class\
    \ when we applied to it:\n\n```typescript\nfunction addMetadata(target: any) {\n\
    \  // Add some metadata\n  target.__customMetadata = {\n    someKey: \"someValue\"\
    \n  };\n  // Return target\n  return target;\n}\n```\n\nWe can then apply the\
    \ class decorator:\n\n```typescript\n@addMetadata\nclass Person {\n  private _name:\
    \ string;\n  public constructor(name: string) {\n    this._name = name;\n  }\n\
    \  public greet() {\n    return this._name;\n  }\n}\n```\n\n```typescript\nfunction\
    \ getMetadataFromClass(target: any) {\n  return target.__customMetadata;\n}\n\n\
    console.log(getMetadataFromClass(Person));\n```\n\nThe decorator is applied when\
    \ the class is declared not when we create instances of the class. This means\
    \ that the metadata is shared across all the instances of a class:\n\n```typescript\n\
    function getMetadataFromInstance(target: any) {\n  return target.constructor.__customMetadata;\n\
    }\n\nlet person1 = new Person(\"John\");\nlet person2 = new Person(\"Lisa\");\n\
    \nconsole.log(getMetadataFromInstance(person1));\nconsole.log(getMetadataFromInstance(person2));\n\
    ```\n\n### Section 8.2: Passing arguments to a class decorator\n\nWe can wrap\
    \ a class decorator with another function to allow customization:\n\n```typescript\n\
    function addMetadata(metadata: any) {\n  return function log(target: any) {\n\
    \    // Add metadata\n    target.__customMetadata = metadata;\n    // Return target\n\
    \    return target;\n  }\n}\n```\n\nThe `addMetadata` takes some arguments used\
    \ as configuration and then returns an unnamed function which is the actual decorator.\
    \ In the decorator we can access the arguments because there is a closure in place.\n\
    \nWe can then invoke the decorator passing some configuration values:\n\n```typescript\n\
    @addMetadata({ guid: \"417c6ec7-ec05-4954-a3c6-73a0d7f9f5bf\" })\nclass Person\
    \ {\n  private _name: string;\n  public constructor(name: string) {\n    this._name\
    \ = name;\n  }\n  public greet() {\n    return this._name;\n  }\n}\n```\n\nWe\
    \ can use the following function to access the generated metadata:\n\n```typescript\n\
    function getMetadataFromClass(target: any) {\n  return target.__customMetadata;\n\
    }\n\nconsole.log(getMetadataFromClass(Person));\n```\n\nIf everything went right\
    \ the console should display: `{ guid: \"417c6ec7-ec05-4954-a3c6-73a0d7f9f5bf\"\
    \ }`\n\n### Section 8.3: Basic class decorator\n\nA class decorator is just a\
    \ function that takes the class as its only argument and returns it after doing\
    \ something with it:\n\n```typescript\nfunction log<T>(target: T) {\n  // Do something\
    \ with target\n  console.log(target);\n  // Return target\n  return target;\n\
    }\n```\n\nWe can then apply the class decorator to a class:\n\n```typescript\n\
    @log\nclass Person {\n  private _name: string;\n  public constructor(name: string)\
    \ {\n    this._name = name;\n  }\n  public greet() {\n    return this._name;\n\
    \  }\n}\n```\n\n### Chapter 9: Interfaces\n\nAn interfaces specifies a list of\
    \ fields and functions that may be expected on any class implementing the interface.\
    \ Conversely, a class cannot implement an interface unless it has every field\
    \ and function specified on the interface.\n\nThe primary benefit of using interfaces,\
    \ is that it allows one to use objects of different types in a polymorphic way.\
    \ This is because any class implementing the interface has at least those fields\
    \ and functions.\n\n### Section 9.1: Extending Interface\n\nSuppose we have an\
    \ interface:\n\n```typescript\ninterface IPerson {\n  name: string;\n  age: number;\n\
    \  breath(): void;\n}\n```\n\nAnd we want to create more specific interface that\
    \ has the same properties of the person, we can do it using the `extends` keyword:\n\
    \n```typescript\ninterface IManager extends IPerson {\n  managerId: number;\n\
    \  managePeople(people: IPerson[]): void;\n}\n```\n\n### Section 9.2: Class Interface\n\
    \n```typescript\ninterface ISampleInterface {\n  sampleVariable: string;\n  sampleMethod():\
    \ void;\n  optionalVariable?: string;\n}\n```\n\nThe example shows how to create\
    \ an interface `ISampleInterface` and a class `SampleClass` that implements it.\n\
    \n```typescript\nclass SampleClass implements ISampleInterface {\n  sampleVariable:\
    \ string;\n  private answerToUniverseAndEverything: number;\n\n  constructor()\
    \ {\n    this.sampleVariable = 'string value';\n    this.answerToUniverseAndEverything\
    \ = 42;\n  }\n\n  public sampleMethod(): void {\n    // do nothing\n  }\n\n  private\
    \ answer(q: any): number {\n    return this.answerToUniverseAndEverything;\n \
    \ }\n}\n```\n\n### Section 9.3: Using Interfaces for Polymorphism\n\nThe primary\
    \ reason to use interfaces is to achieve polymorphism and provide developers to\
    \ implement on their own way in future by implementing interface's methods.\n\n\
    Suppose we have an interface and three classes:\n\n```typescript\ninterface Connector\
    \ {\n  doConnect(): boolean;\n}\n```\n\nThis is `connector` interface. Now we\
    \ will implement that for Wifi communication.\n\n```typescript\nexport class WifiConnector\
    \ implements Connector {\n  public doConnect(): boolean {\n    console.log(\"\
    Connecting via wifi\");\n    console.log(\"Get password\");\n    console.log(\"\
    Lease an IP for 24 hours\");\n    console.log(\"Connected\");\n    return true;\n\
    \  }\n}\n```\n\nHere we have developed our concrete class named `WifiConnector`\
    \ that has its own implementation. This is now type `Connector`.\n\nNow we are\
    \ creating our `System` that has a component `Connector`. This is called dependency\
    \ injection.\n\n```typescript\nexport class System {\n  constructor(private connector:\
    \ Connector) {\n    this.connector.doConnect();\n  }\n}\n```\n\n`constructor(private\
    \ connector: Connector)` this line is very important here. `Connector` is an interface\
    \ and must have `doConnect()`. As `Connector` is an interface this class `System`\
    \ has much more flexibility. We can pass any Type which has implemented `Connector`\
    \ interface. In future developer achieves more flexibility. For example, now developer\
    \ wants to add Bluetooth Connection module:\n\n```typescript\nexport class BluetoothConnector\
    \ implements Connector {\n  public doConnect(): boolean {\n    console.log(\"\
    Connecting via Bluetooth\");\n    console.log(\"Pair with PIN\");\n    console.log(\"\
    Connected\");\n    return true;\n  }\n}\n```\n\nSee that `Wifi` and `Bluetooth`\
    \ have its own implementation. Their own different way to connect. However, hence\
    \ both have implemented Type `Connector` the are now Type `Connector`. So that\
    \ we can pass any of those to `System` class as the constructor parameter. This\
    \ is called polymorphism. The class `System` is now not aware of whether it is\
    \ Bluetooth / Wifi even we can add another Communication module like Infrared,\
    \ Bluetooth5 and whatsoever by just implementing `Connector` interface.\n\nThis\
    \ is called Duck typing. `Connector` type is now dynamic as `doConnect()` is just\
    \ a placeholder and developer implement this as his/her own.\n"
