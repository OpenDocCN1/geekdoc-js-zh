    rock\", \"Rocky\");\n\nplayWithPet ( dog);\n// Output: Hey Rocky, lets play. //\
    \ Rocky eats.\n// Rocky walks.\n// Rocky sleeps.\n```\n\n### 章节 3.2: 元组 (Tuple)\n\
    \n具有已知且可能不同类型的数组类型：\n\n`let day: [ number, string];`\n\nday = [ 0 , 'Monday' ];\
