    Or with parameters:\n\n```typescript\ninterface INumberFunction {\n  ( num: number):\
    \ string;\n}\n```\n\n```typescript\nfunction foo( func: INumberFunction ) {\n\
    \  func( 1 );\n}\n```\n\nEven with generics:\n\n```typescript\ninterface ITFunc<\
    \ T, U> {\n  ( item: T): U;\n}\n```\n\n```typescript\nfunction foo< T, U>( contructorFunc:\
    \ ITFunc< T, U>, item: T): U {\n  return func( item);\n}\n```\n\n### Section 6.3:\
    \ Functions with Union Types\n\nA TypeScript function can take in parameters of\
    \ multiple, predefined types using union types.\n\n```typescript\nfunction whatTime(\
    \ hour: number| string, minute: number| string): string{\n  return hour+ ':' +\
    \ minute;\n}\n```\n\n`whatTime( 1 , 30 )` //'1:30'*\n\n`whatTime( '1' , 30 )`\
    \ //'1:30'*\n\n`whatTime( 1 , '30' )` //'1:30'*\n\n`whatTime( '1' , '30' )` //'1:30'*\n\
    \nTypeScript treats these parameters as a single type that is a union of the other\
    \ types, so your function must be able to handle parameters of any type that is\
    \ in the union.\n\n```typescript\nfunction addTen( start: number| string): number{\n\
    \  if ( typeof number === 'string' ){\n    return parseInt( number)+ 10 ;\n  }\
    \ else {\n    return number+ 10 ;\n  }\n}\n```\n\n### Section 6.4: Types of Functions\n\
    \n#### Named functions\n\n```typescript\nfunction multiply( a, b) {\n  return\
    \ a * b;\n}\n```\n\n#### Anonymous functions\n\n```typescript\nlet multiply =\
    \ function ( a, b) { return a * b; };\n```\n\n#### Lambda / arrow functions\n\n\
    ```typescript\nlet multiply = ( a, b) => { return a * b; };\n```\n\n### Chapter\
    \ 7: Classes\n\nTypeScript, like ECMAScript 6, support object-oriented programming\
    \ using classes. This contrasts with older JavaScript versions, which only supported\
    \ prototype-based inheritance chain.\n\nThe class support in TypeScript is similar\
    \ to that of languages like Java and C#, in that classes may inherit from other\
    \ classes, while objects are instantiated as class instances.\n\nAlso similar\
    \ to those languages, TypeScript classes may implement interfaces or make use\
    \ of generics.\n\n### Section 7.1: Abstract Classes\n\n```typescript\nabstract\
    \ class Machine {\n  constructor( public manufacturer: string) {\n  }\n  // An\
    \ abstract class can define methods of its own, or...\n  summary(): string {\n\
    \    return `${ this .manufacturer } makes this machine.`;\n  }\n  // Require\
    \ inheriting classes to implement methods\n  abstract moreInfo(): string;\n}\n\
    ```\n\nclass Car extends Machine {\n  constructor( manufacturer: string, public\
    \ position: number, protected speed: number) { \n    super ( manufacturer);\n\
    \  }\n  move () {\n    this .position += this .speed ;\n  }\n  moreInfo () {\n\
    \    return `This is a car located at ${ this .position } and going ${ this .speed\
    \ } mph! `;\n  }\n}\n```\n\n```typescript\nlet myCar = new Car( \"Konda\" , 10\
    \ , 70 );\nmyCar.move ( ); // position is now 80\nconsole.log ( myCar.summary\
    \ ()); // prints \"Konda makes this machine.\"\nconsole.log ( myCar.moreInfo ());\
    \ // prints \"This is a car located at 80 and going 70mph!\"\n```\n\nAbstract\
    \ classes are base classes from which other classes can extend. They cannot be\
    \ instantiated themselves (i.e. you cannot do `new Machine( \"Konda\" )`).\n\n\
    The two key characteristics of an abstract class in TypeScript are:\n\n1. They\
    \ can implement methods of their own.\n2. They can define methods that inheriting\
    \ classes must implement. For this reason, abstract classes can conceptually be\
    \ considered a **combination of an interface and a class**.\n\n### Section 7.2:\
    \ Simple class\n\n```typescript\nclass Car {\n  public position: number = 0 ;\
    \ \n  private speed: number = 42 ;\n  move () {\n    this .position += this .speed\
    \ ;\n  }\n}\n```\n\nIn this example, we declare a simple class `Car`. The class\
    \ has three members: a private property `speed`, a public property `position`\
    \ and a public method `move`. Note that each member is public by default. That's\
    \ why `move()` is public, even if we didn't use the public keyword.\n\n```typescript\n\
    var car = new Car(); // create an instance of Car\ncar.move ( ); // call a method\n\
    console.log ( car.position ); // access a public property\n```\n\n### Section\
    \ 7.3: Basic Inheritance\n\n```typescript\nclass Car {\n  public position: number\
    \ = 0 ;\n  protected speed: number = 42 ;\n  move () {\n    this .position +=\
    \ this .speed ;\n  }\n}\n\nclass SelfDrivingCar extends Car {\n  move () {\n \
    \   // start moving around :-) \n    super .move ();\n    super .move ();\n  }\n\
    }\n```\n\nThis examples shows how to create a very simple subclass of the `Car`\
    \ class using the `extends` keyword. The `SelfDrivingCar` class overrides the\
    \ `move()` method and uses the base class implementation using `super`.\n\n###\
    \ Section 7.4: Constructors\n\nIn this example we use the `constructor` to declare\
    \ a public property `position` and a protected property `speed` in the base class.\
    \ These properties are called *Parameter properties*. They let us declare a constructor\
    \ parameter and a member in one place.\n\n```typescript\nclass Car {\n  public\
    \ position: number;\n  protected speed: number;\n}\n```\n\nTypeScript accessors\
    \ allow us to add the code to getters or setters.\n\n```typescript\nclass Car\
    \ {\n  public position: number = 0 ;\n  private _speed: number = 42 ;\n  private\
    \ _MAX_SPEED = 100;\n\n  get speed(): number {\n    return this ._speed;\n  }\n\
    \n  set speed(value: number) {\n    this ._speed = Math.min(value, this._MAX_SPEED);\n\
    \  }\n}\n```\n\n```typescript\nlet car = new Car();\ncar.speed = 120;\nconsole.log\
    \ ( car.speed ); // 100\n```\n\n### Section 7.6: Transpilation\n\nGiven a class\
    \ `SomeClass`, let's see how the TypeScript is transpiled into JavaScript.\n\n\
    ```typescript\nclass SomeClass {\n  static SomeValueValue: string = \"hello\"\
    \ ;\n  public someMemberValue: number = 15 ;\n  private somePrivateValue: boolean\
    \ = false ;\n\n  constructor () {\n    SomeClass.SomeStaticValue = SomeClass.getGoodbye();\n\
    \    this.someMemberValue = this.getFortyTwo();\n    this.somePrivateValue = this.getTrue();\n\
    \  }\n\n  static getGoodbye(): string {\n    return \"goodbye!\" ;\n  }\n\n  public\
    \ getFortyTwo(): number {\n    return 42 ;\n  }\n\n  private getTrue(): boolean\
    \ {\n    return true ;\n  }\n}\n```\n\n```javascript\nvar SomeClass = (function\
    \ () {\n  function SomeClass() {\n    this.someMemberValue = 15;\n    this.somePrivateValue\
    \ = false;\n    SomeClass.SomeStaticValue = SomeClass.getGoodbye();\n    this.someMemberValue\
    \ = this.getFortyTwo();\n    this.somePrivateValue = this.getTrue();\n  }\n  SomeClass.getGoodbye\
    \ = function () {\n    return \"goodbye!\" ;\n  };\n  SomeClass.prototype.getFortyTwo\
    \ = function () {\n    return 42 ;\n  };\n  SomeClass.prototype.getTrue = function\
    \ () {\n    return true ;\n  };\n  return SomeClass;\n})());\n```\n\n**Observations**\n\
    \nThe modification of the class' prototype is wrapped inside an IIFE .\n"
