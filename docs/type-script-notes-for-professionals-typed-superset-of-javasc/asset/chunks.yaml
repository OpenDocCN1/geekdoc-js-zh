    \ ,\n\n\"moduleFileExtensions\" : [ \"ts\" , \"tsx\" , \"js\" ]\n\n}\n``````\n\
    \n现在 `jest` 已经就绪了。假设我们有一个样例 fizz buz 需要测试。\n\n```typescript\n//fizzBuzz.ts\nexport\
    \ function fizzBuzz(n: number): string {\n  let output = \"\";\n  for (let i =\
    \ 1; i <= n; i++) {\n    if (i % 5 && i % 3) {\n      output += i + ' ';\n   \
    \ }\n    if (i % 3 === 0) {\n      output += 'Fizz ';\n    }\n    if (i % 5 ===\
    \ 0) {\n      output += 'Buzz ';\n    }\n  }\n  return output;\n}\n```\n\n测试用例可能如下：\n\
    \n```typescript\n//FizzBuzz.test.ts\n/// <reference types=\"jest\" />\nimport\
    \ { fizzBuzz} from \"./fizzBuzz\";\ntest(\"FizzBuzz test\", () => {\n  expect(fizzBuzz(2)).toBe(\"\
    1 2 \");\n  expect(fizzBuzz(3)).toBe(\"1 2 Fizz \");\n});\n```\n\n执行测试运行：\n\n\
    ```bash\njest\n```\n\n在输出中你应该看到：\n\n```\nPASS ./fizzBuzz.test.ts ✓ FizzBuzz test\
    \ (3ms)\nTest Suites: 1 passed, 1 total Tests: 1 passed, 1 total Snapshots: 0\
    \ total\nTime: 1.46s, estimated 2s Ran all test suites.\n```\n\n### 代码覆盖率 (Code\
    \ coverage)\n\n`jest` 支持生成代码覆盖率报告。\n\n要在 TypeScript 中使用代码覆盖率功能，你需要在 `package.json`\
    \ 中添加另一行配置。\n\n```json\n{\n  ...\n  \"jest\" : {\n    ...\n    \"testResultsProcessor\"\
    \ : \"<rootDir>/node_modules/ts-jest/coverageprocessor.js\"\n  }\n}\n```\n\n运行并生成覆盖率报告的测试：\n\
    \n```bash\njest -coverage\n```\n\n如果用于我们的样例 fizz buz，你应该看到：\n\n```\nPASS ./fizzBuzz.test.ts\
    \ ✓ FizzBuzz test (3ms)\n-------------|----------|----------|----------|----------|----------------|\
    \ File | % Stmts | % Branch | % Funcs | % Lines |Uncovered Lines |\n-------------|----------|----------|----------|----------|----------------|\
    \ All files | 92.31 | 87.5 | 100 | 91.67 | | fizzBuzz.ts | 92.31 | 87.5 | 100\
    \ | 91.67 | 13 |\n-------------|----------|----------|----------|----------|----------------|\
    \ Test Suites: 1 passed, 1 total\nTests: 1 passed, 1 total\nSnapshots: 0 total\n\
    Time: 1.857s\nRan all test suites.\n```\n\n`jest` 还创建了 `coverage` 文件夹，其中包含各种格式的覆盖率报告，包括位于\
    \ `coverage/lcov-report/index.html` 的用户友好的 html 报告。\n\n![](img/Image00011.jpg)\n\
    \n### 第 30.3 节: Alsatian\n\nAlsatian 是用 TypeScript 编写的单元测试框架。它允许使用测试案例（Test Cases），并输出符合\
    \ TAP 标准标记。\n\n要使用它，请从 npm 安装：\n\n```bash\nnpm install alsatian --save-dev\n```\n\
    \n然后设置一个测试文件：\n\n```typescript\nimport { Expect, Test, TestCase } from \"alsatian\"\
    ;\nimport { SomeModule } from \"../src/some-module\";\n\nexport SomeModuleTests\
    \ {\n  @Test()\n  public statusShouldBeTrueByDefault() {\n    let instance = new\
    \ SomeModule();\n    Expect(instance.status).toBe(true);\n  }\n\n  @Test(\"Name\
    \ should be null by default\")\n  public nameShouldBeNullByDefault() {\n    let\
    \ instance = new SomeModule();\n    Expect(instance.name).toBe(null);\n  }\n\n\
    \  @TestCase(\"first name\")\n  @TestCase(\"apples\")\n  public shouldSetNameCorrectly(name:\
    \ string) {\n    let instance = new SomeModule();\n    instance.setName(name);\n\
    \    Expect(instance.name).toBe(name);\n  }\n}\n```\n\n欲查看完整文档，请参阅 Alsatian 的\
    \ GitHub 仓库。\n\n### 第 30.4 节: chai-immutable 插件\n\n1. 从 npm 安装 `chai`, `chai-immutable`\
    \ 和 `ts-node`\n\n```bash\nnpm install --save-dev chai chai-immutable ts-node\n\
    ```\n\n2. 安装 mocha 和 `chai` 的类型\n\n```bash\nnpm install --save-dev @types/mocha\
    \ @types/chai\n```\n\n3. 编写简单的测试文件：\n\n```typescript\nimport { List, Set} from\
    \ 'immutable';\nimport * as chai from 'chai';\nimport * as chaiImmutable from\
    \ 'chai-immutable';\nchai.use(chaiImmutable);\ndescribe('chai immutable example',\
    \ () => {\n  it('example', () => {\n    expect(Set.of(1, 2, 3)).to.not.be.empty;\n\
    \    expect(Set.of(1, 2, 3)).to.include(2);\n    expect(Set.of(1, 2, 3)).to.include(5);\n\
    \  });\n})\n```\n\n4. 在控制台中运行：\n\n```bash\nmocha -r ts:ts-node/register, tsx:ts-node/register\
    \ 'test/**/*.spec.@(ts|tsx)'\n```\n\n### 致谢 (Credits)\n\n非常感谢 Stack Overflow 上所有帮助过此内容的人，更多更改可以发送或更新至\
    \ 246\n\n"
