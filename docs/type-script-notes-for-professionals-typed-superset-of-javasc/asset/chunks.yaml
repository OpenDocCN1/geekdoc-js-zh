  trans: "\n成员变量定义在主类 `function` 内部。\n\n静态属性直接添加到类对象上，而实例属性被添加到原型上。\n\n### 第 7.7 节：向现有类猴子补丁（Monkey\
    \ patch）函数\n\n有时候，用新函数扩展类是非常有用的。例如，假设我们需要将一个字符串转换为驼峰命名法（camel case）。因此，我们需要告诉\
    \ TypeScript `String` 包含一个名为 `toCamelCase` 的函数，该函数返回一个字符串。\n\n```typescript\n\
    interface String {\n  toCamelCase(): string;\n}\n```\n\n现在我们可以将这个函数补丁到 `String`\
    \ 的实现中。\n\n```typescript\nString.prototype.toCamelCase = function () : string\
    \ {\n  return this.replace(/[^a-z ]/ig, '')\n    .replace(/(?:^\\w|[A-Z]|\\b\\\
    w|\\s+)/g, (match: any, index: number) => {\n      return +match === 0 ? \"\"\
    \ : match[index === 0 ? 'toLowerCase' : 'toUpperCase']();\n    });\n}\n```\n\n\
    如果加载了此 `String` 扩展，可以这样使用：`\"This is an example\".toCamelCase(); *// => \"thisIsAnExample\"\
    *\n\n### 第 8 章：类装饰器\n\n**参数详情**\n`target` 被装饰的类\n\n### 第 8.1 节：使用类装饰器生成元数据\n\n\
    这一次，我们将声明一个类装饰器，它会在被应用到类时为该类添加一些元数据：\n\n```typescript\nfunction addMetadata(target:\
    \ any) {\n  // 添加一些元数据\n  target.__customMetadata = {\n    someKey: \"someValue\"\
    \n  };\n  // 返回 target\n  return target;\n}\n```\n\n然后我们可以应用该类装饰器：\n\n```typescript\n\
    @addMetadata\nclass Person {\n  private _name: string;\n  public constructor(name:\
    \ string) {\n    this._name = name;\n  }\n  public greet() {\n    return this._name;\n\
    \  }\n}\n```\n\n```typescript\nfunction getMetadataFromClass(target: any) {\n\
    \  return target.__customMetadata;\n}\n\nconsole.log(getMetadataFromClass(Person));\n\
    ```\n\n装饰器是在类声明时应用的，而不是在创建类实例时。这意味着元数据在类的所有实例之间是共享：\n\n```typescript\nfunction\
    \ getMetadataFromInstance(target: any) {\n  return target.constructor.__customMetadata;\n\
    }\n\nlet person1 = new Person(\"John\");\nlet person2 = new Person(\"Lisa\");\n\
    \nconsole.log(getMetadataFromInstance(person1));\nconsole.log(getMetadataFromInstance(person2));\n\
    ```\n\n### 第 8.2 节：向类装饰器传递参数\n\n我们可以用另一个函数封装类装饰器，以允许定制化：\n\n```typescript\nfunction\
    \ addMetadata(metadata: any) {\n  return function log(target: any) {\n    // 添加元数据\n\
    \    target.__customMetadata = metadata;\n    // 返回 target\n    return target;\n\
    \  }\n}\n```\n\n`addMetadata` 接收一些参数作为配置，然后返回一个匿名函数，该函数才是实际的装饰器。在装饰器中我们可以访问这些参数，因为存在闭包。\n\
    \n然后我们可以传递一些配置值来调用装饰器：\n\n```typescript\n@addMetadata({ guid: \"417c6ec7-ec05-4954-a3c6-73a0d7f9f5bf\"\
    \ })\nclass Person {\n  private _name: string;\n  public constructor(name: string)\
    \ {\n    this._name = name;\n  }\n  public greet() {\n    return this._name;\n\
    \  }\n}\n```\n\n我们可以使用以下函数来访问生成的元数据：\n\n```typescript\nfunction getMetadataFromClass(target:\
    \ any) {\n  return target.__customMetadata;\n}\n\nconsole.log(getMetadataFromClass(Person));\n\
    ```\n\n如果一切顺利，控制台应该显示：`{ guid: \"417c6ec7-ec05-4954-a3c6-73a0d7f9f5bf\" }`\n\n\
    ### 第 8.3 节：基础类装饰器\n\n类装饰器只是一个函数，它接收类作为唯一参数，并在对其进行处理后返回它：\n\n```typescript\nfunction\
    \ log<T>(target: T) {\n  // 对 target 进行某些操作\n  console.log(target);\n  // 返回 target\n\
    \  return target;\n}\n```\n\n然后我们可以将类装饰器应用到类上：\n\n```typescript\n@log\nclass Person\
    \ {\n  private _name: string;\n  public constructor(name: string) {\n    this._name\
    \ = name;\n  }\n  public greet() {\n    return this._name;\n  }\n}\n```\n\n###\
    \ 第 9 章：接口\n\n接口指定了一个字段和函数列表，这些字段和函数在实现接口的任何类中都是可以期的。相反，除非类拥有接口上指定的每个字段和函数，否则类无法实现该接口。\n\
    \n使用接口的主要优势是它允许人们以多态的方式使用不同类型的对象。这是因为任何实现接口的类至少包含这些字段和函数。\n\n### 第 9.1 节：扩展接口\n\
    \n假设我们有一个接口：\n\n```typescript\ninterface IPerson {\n  name: string;\n  age: number;\n\
    \  breath(): void;\n}\n```\n\n如果我们想创建一个具有人类相同属性的更具体的接口，可以使用 `extends` 关键字来实现：\n\
    \n```typescript\ninterface IManager extends IPerson {\n  managerId: number;\n\
    \  managePeople(people: IPerson[]): void;\n}\n```\n\n### 第 9.2 节：类接口\n\n接口指定了一个字段和函数列表，这些字段和函数在实现接口的任何类中都是可以期的。相反，除非类拥有接口上指定的每个字段和函数，否则类无法实现该接口。\n\
    \n使用接口的主要优势是它允许人们以多态的方式使用不同类型的对象。这是因为任何实现接口的类至少包含这些字段和函数。\n\n```typescript\ninterface\
    \ ISampleInterface {\n  sampleVariable: string;\n  sampleMethod(): void;\n}\n\
    ```\n\n示例显示了如何创建一个接口 `ISampleInterface` 以及实现它的类 `SampleClass`。\n\n```typescript\n\
    class SampleClass implements ISampleInterface {\n  sampleVariable: string;\n \
    \ private answerToAndEverything: number;\n\n  constructor() {\n    this.sampleVariable\
    \ = 'string value';\n    this.answerToAndEverything = 42;\n  }\n\n  public sampleMethod():\
    \ void {\n    // 什么都不做\n  }\n\n  private answer(q: any): number {\n    return\
    \ this.answerToAndEverything;\n  }\n}\n```\n\n### 第 9.3 节：使用接口实现多态\n\n使用接口的主要原为了实现多态，并允许开发者在未来通过实现接口来实现自己的方式。\n\
    \n假设我们有一个接口和三个类：\n\n```typescript\ninterface Connector {\n  doConnect(): boolean;\n\
    }\n```\n\n这是 `connector` 接口。现在我们将为 wifi 通实现它。\n\n```typescript\nexport class WifiConnector\
    \ implements Connector {\n  public doConnect(): boolean {\n    console.log(\"\
    Connecting via wifi\");\n    console.log(\"Get password\");\n    console.log(\"\
    Lease an IP for 24 hours\");\n    console.log(\"Connected\");\n    return true;\n\
    \  }\n}\n```\n\n在这里开发了一个名为 `WifiConnector` 的具体类，它有自己的实现。现在它是 `Connector` 类型。\n\
    \n现在我们创建一个包含 `Connector` 组件的 `System` 类。这被称为依赖注入。\n\n```typescript\nexport class\
    \ System {\n  constructor(private connector: Connector) {\n    this.connector.doConnect();\n\
    \  }\n}\n```\n\n`constructor(private connector: Connector)` 这一行在这里非常重要。`Connector`\
    \ 是一个接口，并且必须有 `doConnect()`。由于 `Connector` 是一个接口，这个 `System` 类具有更大的灵活性。我们可以传递任何实现了\
    \ `Connector` 接口的类型。在未来，开发者获得了更大的灵活性。例如，现在开发者想要添加蓝牙连接：\n\n```typescript\nexport\
    \ class BluetoothConnector implements Connector {\n  public doConnect(): boolean\
    \ {\n    console.log(\"Connecting via Bluetooth\");\n    console.log(\"Pair with\
    \ PIN\");\n    console.log(\"Connected\");\n    return true;\n  }\n}\n```\n\n\
    可以看到，`System` 类现在无法感知到是蓝牙还是 wifi，即使我们以后可以仅仅通过实现 `Connector` 接口来添加其他通信模块，如红外、蓝牙\
    \ 5 等。这被称为鸭子类型（Duck typing）。`Connector` 类型现在是动态的，因为 `doConnect()` 只是一个占位符，开发者按照自己的方式来实现它。\n"
- fmt: "\n`if at constructor( private connector: WifiConnector) where `WifiConnector`\
    \ is a concrete class what will happen?` Then `System` class will tightly couple\
    \ only with `WifiConnector` nothing else. Here interface solved our problem by\
    \ polymorphism.\n\n### Section 9.4: Generic Interfaces\n\nLike classes, interfaces\
    \ can receive polymorphic parameters (aka Generics) too.\n\n#### Declaring Generic\
    \ Parameters on Interfaces\n\n```typescript\ninterface IStatus< U> {\n  code:\
    \ U;\n}\n\ninterface IEvents< T> {\n  list: T[];\n  emit( event: T): void;\n \
    \ getAll(): T[];\n}\n```\n\nHere, you can see that our two interfaces take some\
    \ generic parameters, `T` and `U`.\n\n#### Implementing Generic Interfaces\n\n\
    We will create a simple class in order to implements the interface `IEvents`.\n\
    \n```typescript\nclass State< T> implements IEvents< T> {\n  list: T[];\n  constructor\
    \ () {\n    this.list = [];\n  }\n  emit ( event: T): void {\n    this.list .push\
    \ ( event);\n  }\n  getAll (): T[] {\n    return this.list ;\n  }\n}\n```\n\n\
    Let's create some instances of our `State` class.\n\nIn our example, the `State`\
    \ class will handle a generic status by using `IStatus< T>`. In this way, the\
    \ interface `IEvent< T>` will also handle a `IStatus< T>`.\n\n```typescript\n\
    const s = new State< IStatus< number>>();\n// The 'code' property is expected\
    \ to be a number, so:* s.emit ({ code: 200 }); // works\ns.emit ({ code: '500'\
    \ }); // type error\ns.getAll () .forEach ( event => console.log ( event.code\
    \ ));\n```\n\nHere our `State` class is typed as `IStatus< number>`.\n\n```typescript\n\
    const s2 = new State< IStatus< Code>>();\n//We are able to emit code as the type\
    \ Code\ns2.emit ({ code: { message: 'OK' , status: 200 } });\ns2. getAll () .map\
    \ ( event => event.code ) .forEach ( event => {\n  console.log ( event.message\
    \ );\n  console.log ( event.status );\n});\n```\n\nOur `State` class is typed\
    \ as `IStatus< Code>`. In this way, we are able to pass more complex type to our\
    \ `emit` method. As you can see, generic interfaces can be a very useful tool\
    \ for statically typed code.\n\n### Section 9.5: Add functions or properties to\
    \ an existing interface\n\nLet's suppose we have a reference to the `JQuery` type\
    \ definition and we want to extend it to have additional functions from a plugin\
    \ we included and which doesn't have an official type definition. We can easily\
    \ extend it by declaring functions added by plugin in a separate interface declaration\
    \ with the same `JQuery` name:\n\n```typescript\ninterface JQuery {\n  pluginFunctionThatDoesNothing():\
    \ void;\n  // create chainable function\n  manipulateDOM( HTMLElement): JQuery;\n\
    }\n```\n\nThe compiler will merge all declarations with the same name into one\
    \ - see declaration merging for more details.\n\n### Section 9.6: Implicit Implementation\
    \ And Object Shape\n\nTypeScript supports interfaces, but the compiler outputs\
    \ JavaScript, which doesn't. Therefore, interfaces are effectively lost in the\
    \ compile step. This is why type checking on interfaces relies on the *shape*\
    \ of the object meaning whether the object supports the fields and functions on\
    \ the interface - and not on whether the interface is actually implemented or\
    \ not.\n\n```typescript\ninterface IKickable {\n  kick( distance: number): void;\n\
    }\n\nclass Ball {\n  kick( distance: number): void {\n    console.log ( \"Kicked\"\
    \ , distance, \"meters!\" );\n  }\n}\nlet kickable: IKickable = new Ball();\n\
    kickable.kick ( 40 );\n```\n\nSo even if `Ball` doesn't explicitly implement `IKickable`,\
    \ a `Ball` instance may be assigned to (and manipulated as) an `IKickable`, even\
    \ when the type is specified.\n\n### Section 9.7: Using Interfaces to Enforce\
    \ Types\n\nOne of the core benefits of TypeScript is that it enforces data types\
    \ of values that you are passing around your code to help prevent mistakes.\n\n\
    Let's say you're making a pet dating application. You have this simple function\
    \ that checks if two pets are compatible with each other...\n\n```typescript\n\
    checkCompatible( petOne, petTwo) {\n  if ( petOne.species === petTwo.species &&\n\
    \  Math.abs ( petOne.age petTwo.age ) <= 5 ) {\n    return true ;\n  }\n}\n```\n\
    \nThis is completely functional code, but it would be far too easy for someone,\
    \ especially other people working on this application who didn't write this function,\
    \ to be unaware that they are supposed to pass it objects with 'species' and 'age'\
    \ properties. They may mistakenly try `checkCompatible( petOne.species , petTwo.species\
    \ )` and then be left to figure out the errors thrown when the function tries\
    \ to access `petOne.species.species` or `petOne.species.age`!\n\nOne way we can\
    \ prevent this from happening is to specify the properties we want on the pet\
    \ parameters:\n\n```typescript\ncheckCompatible ( petOne: { species: string, age:\
    \ number}, petTwo: { species: string, age: number}) {\n  //...\n}\n```\n\nIn this\
    \ case, TypeScript will make sure everything passed to the function has 'species'\
    \ and 'age' properties (it is okay if they have additional properties), but this\
    \ is a bit of an unwieldy solution, even with only two properties specified. With\
    \ interfaces, there is a better way!\n\nFirst we define our interface:\n\n```typescript\n\
    interface Pet {\n  species: string;\n  age: number;\n  //We can add more properties\
    \ if we choose.\n}\n```\n\nNow all we have to do is specify the type of our parameters\
    \ as our new interface, like so...\n\n```typescript\ncheckCompatible ( petOne:\
    \ Pet, petTwo: Pet) {\n  //...\n}\n```\n\n... and TypeScript will make sure that\
    \ the parameters passed to our function contain the properties specified in the\
    \ `Pet` interface!\n\n# Chapter 10: Generics\n\n## Section 10.1: Generic Interfaces\n\
    \n#### Declaring a generic interface\n\n```typescript\ninterface IResult< T> {\n\
    \  wasSuccessful: boolean ;\n  error: T;\n}\n\nvar result: IResult< string> =\
    \ ....\nvar error: string = result.error ;\n```\n\n**Generic interface with multiple\
    \ type parameters**\n\n```typescript\ninterface IRunnable< T, U> {\n  run( input:\
    \ T): U;\n}\n\nvar runnable: IRunnable< string, number> = ... \nvar input: string;\n\
    var result: number = runnable.run ( input);\n```\n\n#### Implementing a generic\
    \ interface\n\n```typescript\ninterface IResult< T>{\n  wasSuccessful: boolean\
    \ ; error: T;\n  clone(): IResult< T>;\n}\n```\n\nImplement it with generic class:\n\
    \n```typescript\nclass Result< T> implements IResult< T> {\n  constructor( wasSuccessful:\
    \ boolean , error: T) { }\n  clone (): IResult< T> {\n    return new Result< T>(\
    \ this.result , this.error );\n  }\n}\n```\n\nImplement it with non generic class:\n\
    \n```typescript\nclass StringResult implements IResult< string> {\n  constructor(\
    \ wasSuccessful: boolean , error: string) { }\n  clone (): IResult< string> {\n\
    \    return new StringResult( this.result , this.error );\n  }\n}\n```\n\n###\
    \ Section 10.2: Generic Class\n\n```typescript\nclass Result< T> {\n  constructor(\
    \ wasSuccessful: boolean , error: T) { }\n  clone (): Result< T> { ... }\n}\n\n\
    let r1 = new Result( false , 'error: 42' ); // Compiler infers T to string\nlet\
    \ r2 = new Result( false , 42 ); // Compiler infers T to number\nlet r3 = new\
    \ Result< string>( true , null ); // Explicitly set T to string\nlet r4 = new\
    \ Result< string>( true , 4 ); // Compilation error because 4 is not a string\n\
    ```\n\n### Section 10.3: Type parameters as constraints\n\nWith TypeScript 1.8\
    \ it becomes possible for a type parameter constraint to reference type parameters\
    \ from the same type parameter list. Previously this was an error.\n\n```typescript\n\
    function assign< T extends U, U>( target: T, source: U): T {\n  for (let id in\
    \ source) {\n    target[ id] = source[ id];\n  }\n  return target;\n}\n\nlet x\
    \ = { a: 1 , b: 2 , c: 3 , d: 4 }; \nassign( x, { b: 10 , d: 20 });\nassign( x,\
    \ { e: 0 }); // Error\n```\n\n### Section 10.4: Generics Constraints\n\nSimple\
    \ constraint:\n\n```typescript\ninterface IRunnable {\n  run(): void ;\n}\n\n\
    interface IRunner< T extends IRunnable> {\n  runSafe( runnable: T): void ;\n}\n\
    ```\n\nMore complex constraint:\n\n```typescript\ninterface IRunnble< U> {\n \
    \ run(): U;\n}\n\ninterface IRunner< T extends IRunnble< U>, U> {\n  runSafe(\
    \ runnable: T): U;\n}\n```\n\nEven more complex:\n\n```typescript\ninterface IRunnble<\
    \ V> {\n  run( parameter: U): V;\n}\n\ninterface IRunner< T extends IRunnble<\
    \ U, V>, U, V> { \n  runSafe( runnable: T, parameter: U): V; \n}\n```\n\nInline\
    \ type constraints:\n"
