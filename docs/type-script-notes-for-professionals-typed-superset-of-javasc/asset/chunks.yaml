    no-console\" : false\n  }\n}\n```\n\n## 第 28 章：tsconfig.json\n\n### 第 28.1 节：使用\
    \ tsconfig.json 创建 TypeScript 项目\n\n`tsconfig.json` 文件的存在表示当前目录是启用 TypeScript\
