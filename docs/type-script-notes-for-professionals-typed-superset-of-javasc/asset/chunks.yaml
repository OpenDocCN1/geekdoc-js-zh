    \ 并持续更新，以包含每次 TSLint 发布中的最新规则配置。使用此配置可能会在次版本之间引入破坏性更改，因为启用的新规则会导致代码出现 lint 失败。当\
    \ TSLint 达到主版本更新时，`tslint:recommended` 将更新为与 `tslint:latest` 完全相同。\n\n### 预定义规则集的文档和源码\n\
    \n因此，可以简单使用：\n\n```json\n{ \"extends\" : \"tslint:recommended\" }\n```\n\n来获得一个合理的初始配置。\n\
    \n随后可以通过 `rules` 覆盖该预设中的规则，例如，对于 Node 开发者来说，将 `no-console` 设置为 `false` 是有意义的：\n\
