    node_modules\"\n  ]\n}\n```\n\n### Section 1.2: Basic syntax\n\nTypeScript is\
    \ a typed superset of JavaScript, which means that all JavaScript code is valid\
    \ TypeScript. TypeScript adds a lot of new features on top of that.\n\nTypeScript\
    \ makes JavaScript more like a strongly-typed, object-oriented language akin to\
    \ C# and Java. This means that TypeScript code tends to be easier to use for large\
    \ projects and that code tends to be easier to understand and maintain. The strong\
    \ typing also means that the language can (and is) precompiled and that variables\
    \ cannot be assigned values that are out of their range. For instance, when a\
    \ TypeScript variable is declared as a number, you cannot assign a text value\
    \ to it.\n\n#### Type declarations\n\nYou can add type declarations to variables,\
    \ function parameters and function return types. The type is written after a colon\
    \ following the variable name, like this: `var num: number = 5;`. The compiler\
    \ will then check the types (where possible) during compilation and report type\
    \ errors.\n\n```typescript\nvar num: number = 5;\nnum = \"this is a string\";\
    \ // error: Type 'string' is not assignable to type 'number'.\n```\n\nThe basic\
    \ types are:\n\n- number (both integers and floating point numbers)\n- string\n\
    - boolean\n\n#### Array\n\nYou can specify the types of an array's elements. There\
    \ are two equivalent ways to define array types: `Array<T>` and `T[]`. For example:\n\
    \n- `number[]` - array of numbers\n- `Array<string>` - array of strings\n\n####\
    \ Tuples\n\nTuples have a fixed number of elements with specific types.\n\n- `[boolean,\
    \ string]` - tuple where the first element is a boolean and the second is a string.\n\
    - `[number, number, number]` - tuple of three numbers.\n"
