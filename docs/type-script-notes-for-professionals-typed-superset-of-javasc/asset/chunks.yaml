    }\n```\n\n```typescript\nfunction foo< T, U>( contructorFunc: ITFunc< T, U>, item:\
    \ T): U {\n  return func( item);\n}\n```\n\n### 第 6.3 节：使用联合类型的函数\n\nTypeScript\
    \ 函数可以使用联合类型来接收多个预定义类型的参数。\n\n```typescript\nfunction whatTime( hour: number|\
    \ string, minute: number| string): string{\n  return hour+ ':' + minute;\n}\n\
    ```\n\n`whatTime( 1 , 30 )` //'1:30'*\n\n`whatTime( '1' , 30 )` //'1:30'*\n\n\
    `whatTime( 1 , '30' )` //'1:30'*\n\n`whatTime( '1' , '30' )` //'1:30'*\n\nTypeScript\
    \ 将这些参数视为其他类型联合的单一类型，因此你的函数必须能够处理联合类型中任何类型的参数。\n\n```typescript\nfunction addTen(\
    \ start: number| string): number{\n  if ( typeof number === 'string' ){\n    return\
    \ parseInt( number)+ 10 ;\n  } else {\n    return number+ 10 ;\n  }\n}\n```\n\n\
    ### 第 6.4 节：函数的类型\n\n#### 命名函数\n\n```typescript\nfunction multiply( a, b) {\n\
    \  return a * b;\n}\n```\n\n#### 匿名函数\n\n```typescript\nlet multiply = function\
    \ ( a, b) { return a * b; };\n```\n\n#### Lambda / 箭头函数\n\n```typescript\nlet\
    \ multiply = ( a, b) => { return a * b; };\n```\n\n### 第 7 章：类\n\nTypeScript 像\
    \ ECMAScript 6 一样支持使用类进行面向对象编程。这与旧版本的 JavaScript 形成对比，旧版本仅支持基于原型的继承链。\n\nTypeScript\
    \ 对类的支持与 Java 和 C# 等语言相似，即类可以继承自其他类，而对象被实例化为类的实例。\n\n同样与这些语言相似的是，TypeScript 类可以实现接口或使用泛型。\n\
    \n### 第 7.1 节：抽象类\n\n```typescript\nabstract class Machine {\n  constructor( public\
    \ manufacturer: string) {\n  }\n  // 抽象类可以定义自己的方法，或者...\n  summary(): string {\n\
    \    return `${ this .manufacturer } makes this machine.`;\n  }\n  // 要求继承类实现该方法\n\
    \  abstract moreInfo(): string;\n}\n```\n\n```typescript\nclass Car extends Machine\
    \ {\n  constructor( manufacturer: string, public position: number, protected speed:\
    \ number) { \n    super ( manufacturer);\n  }\n  move () {\n    this .position\
    \ += this .speed ;\n  }\n  moreInfo () {\n    return `This is a car located at\
    \ ${ this .position } and going ${ this .speed } mph! `;\n  }\n}\n```\n\n```typescript\n\
    let myCar = new Car( \"Konda\" , 10 , 70 );\nmyCar.move ( ); // position is now\
    \ 80\nconsole.log ( myCar.summary ()); // prints \"Konda makes this machine.\"\
    \nconsole.log ( myCar.moreInfo ()); // prints \"This is a car located at 80 and\
    \ going 70mph!\"\n```\n\n抽象类是其他类可以扩展的基类。它们本身不能被实例化（即你不能执行 `new Machine( \"Konda\"\
    \ )`）。\n\nTypeScript 中抽象类的两个关键特性是：\n\n1. 它们可以实现自己的方法。\n2. 它们可以定义继承类必须实现的方法。由于这个原因，抽象类在概念上可以认为是**接口和类的结合**。\n\
    \n### 第 7.2 节：简单类\n\n```typescript\nclass Car {\n  public position: number = 0\
    \ ; \n  private speed: number = 42 ;\n  move () {\n    this .position += this\
    \ .speed ;\n  }\n}\n```\n\n在这个示例中，我们声明了一个简单的类 `Car`。该类有三个成员：一个私有属性 `speed`、一个公共属性\
    \ `position` 和一个公共方法 `move`。注意，每个成员默认都是公共的。这就是为什么 `move()` 是公共的，即使我们没有使用 `public`\
    \ 关键字。\n\n```typescript\nvar car = new Car(); // 创建一个 Car 实例\ncar.move ( ); //\
    \ 调用方法\nconsole.log ( car.position ); // 访问公共属性\n```\n\n### 第 7.3 节：基础继承\n\n```typescript\n\
    class Car {\n  public position: number = 0 ;\n  protected speed: number = 42 ;\n\
