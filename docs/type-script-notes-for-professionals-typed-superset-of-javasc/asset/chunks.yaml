    **function** whatTime( hour: number| string, minute: number| string): string{
    **return** hour+ '':'' + minute;


    }


    whatTime ( 1 , 30 ) *//''1:30''*


    whatTime( ''1'' , 30 ) *//''1:30''*


    whatTime( 1 , ''30'' ) *//''1:30''*


