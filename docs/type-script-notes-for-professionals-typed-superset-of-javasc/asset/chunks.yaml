    ### **Chapter 9: Interfaces**


    An interfaces specifies a list of fields and functions that may be expected on
    any class implementing the interface. Conversely, a class cannot implement an
    interface unless it has every field and function specified on the interface.


    The primary benefit of using interfaces, is that it allows one to use objects
    of different types in a polymorphic way. This is because any class implementing
    the interface has at least those fields and functions.


    ### **Section 9.1: Extending Interface**


    Suppose we have an interface:


