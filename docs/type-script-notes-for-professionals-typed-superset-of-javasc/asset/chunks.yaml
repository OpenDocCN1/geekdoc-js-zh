    \n## Section 22.5: MSBuild\n\nUpdate project file to include locally installed\
    \ `Microsoft.TypeScript.Default.props` (at the top) and `Microsoft.TypeScript.targets`\
    \ (at the bottom) files:\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
    <Project ToolsVersion=\"4.0\" DefaultTargets=\"Build\" xmlns=\"http://schemas.microsoft.com/developer/msbuild/2003\"\
    >\n  <!-- Include default props at the bottom -->\n  <Import\n    Project=\"$(MSBuildExtensionsPath32)\\\
    Microsoft\\VisualStudio\\v$(VisualStudioVersion)\\TypeScript\\Microsoft.TypeScript.Default.props\"\
    \n    Condition=\"Exists('$(MSBuildExtensionsPath32)\\Microsoft\\VisualStudio\\\
    v$(VisualStudioVersion)\\TypeScript\\Microsoft.TypeScript.Default.props')\" />\n\
    \  <!-- TypeScript configurations go here -->\n  <PropertyGroup Condition=\"'$(Configuration)'\
    \ == 'Debug'\">\n    <TypeScriptRemoveComments>false</TypeScriptRemoveComments>\n\
    \    <TypeScriptSourceMap>true</TypeScriptSourceMap>\n  </PropertyGroup>\n  <PropertyGroup\
    \ Condition=\"'$(Configuration)' == 'Release'\">\n    <TypeScriptRemoveComments>true</TypeScriptRemoveComments>\n\
    \    <TypeScriptSourceMap>false</TypeScriptSourceMap>\n  </PropertyGroup>\n  <!--\
    \ Include default targets at the bottom -->\n  <Import\n    Project=\"$(MSBuildExtensionsPath32)\\\
    Microsoft\\VisualStudio\\v$(VisualStudioVersion)\\TypeScript\\Microsoft.TypeScript.targets\"\
    \n    Condition=\"Exists('$(MSBuildExtensionsPath32)\\Microsoft\\VisualStudio\\\
    v$(VisualStudioVersion)\\TypeScript\\Microsoft.TypeScript.targets')\" />\n</Project>\n\
    ```\nMore details about defining MSBuild compiler options: Setting Compiler Options\
    \ in MSBuild projects\n\n## Section 22.6: NuGet\n\nRight-Click -> Manage NuGet\
    \ Packages Search for `Microsoft.TypeScript.MSBuild` Hit Install\n\nWhen install\
    \ is complete, rebuild!\n\nMore details can be found at Package Manager Dialog\
    \ and using nightly builds with NuGet\n\n## Section 22.7: Install and configure\
    \ webpack + loaders\n\n### Installation\n\n```bash\nnpm install -D webpack typescript\
    \ ts-loader\n```\n\nwebpack.config.js\n```javascript\nmodule.exports = {\n  entry:\
    \ {\n    app: ['./src/'],\n  },\n  output: {\n    path: __dirname,\n    filename:\
    \ './dist/[name].js',\n  },\n  resolve: {\n    extensions: ['', '.js', '.ts'],\n\
    \  },\n  module: {\n    loaders: [{\n      test: /\\.ts(x)$/,\n      loaders:\
    \ ['ts-loader'],\n      exclude: /node_modules/\n    }],\n  }\n};\n```\n\n## Chapter\
    \ 23: Using TypeScript with RequireJS\n\nRequireJS is a JavaScript file and module\
    \ loader. It is optimized for in-browser use, but it can be used in other JavaScript\
    \ environments, like Rhino and Node. Using a modular script loader like RequireJS\
    \ will improve the speed and quality of your code.\n\nUsing TypeScript with RequireJS\
    \ requires configuration of `tsconfig.json`, and including an snippet in any HTML\
    \ file. Compiler will traduce imports from the syntax of TypeScript to RequireJS'\
    \ format.\n\n### Section 23.1: HTML example using RequireJS CDN to include an\
    \ already compiled TypeScript file\n\n```html\n<body onload=\"__init();\">\n...\n\
    <script src=\"http://requirejs.org/docs/release/2.3.2/comments/require.js\"></script>\n\
    <script>\nfunction __init() {\n  require([\"view/index.js\"]);\n}\n</script>\n\
    </body>\n```\n\n### Section 23.2: tsconfig.json example to compile to view folder\
    \ using RequireJS import style\n\n```json\n{\n  \"module\": \"amd\", // Using\
    \ AMD module code generator which works with RequireJS\n  \"rootDir\": \"./src\"\
    , // Change this to your source folder\n  \"outDir\": \"./view\",\n  ...\n}\n\
    ```\n\n## Chapter 24: TypeScript with AngularJS\n\n| Name | Description |\n| :---\
    \ | :--- |\n| `controllerAs` | is an alias name, to which variables or functions\
    \ can be assigned to. @see: https://docs.angularjs.org/guide/directive |\n| `$inject`\
    \ | Dependency Injection list, it is resolved by angular and passing as an argument\
    \ to constructor functions. |\n\n### Section 24.1: Directive\n\n```typescript\n\
    interface IMyDirectiveController {\n  // specify exposed controller methods and\
    \ properties here\n  getUrl(): string;\n}\n\nclass MyDirectiveController implements\
    \ IMyDirectiveController {\n  // Inner injections, per each directive\n  public\
    \ static $inject = [\"$location\", \"toaster\"];\n  constructor(private $location:\
    \ ng.ILocationService, private toaster: any) {\n    // $location and toaster are\
    \ now properties of the controller\n  }\n  public getUrl(): string {\n    return\
    \ this.$location.url(); // utilize $location to retrieve the URL\n  }\n}\n\n/*\n\
    Outer injections, for run once control.\nFor example we have all templates in\
    \ one value, and we want to use it. \n*/\nexport function myDirective(templatesUrl:\
    \ ITemplates): ng.IDirective {\n  return {\n    controller: MyDirectiveController,\n\
    \    controllerAs: \"vm\"\n  };\n}\n```\n\n### Section 24.2: Simple example\n\n\
    ```typescript\nexport function myDirective($location: ng.ILocationService): ng.IDirective\
    \ {\n  return {\n    controller: MyDirectiveController,\n    controllerAs: \"\
    vm\",\n    link: (scope: ng.IScope, element: ng.IAugmentedJQuery, attributes:\
    \ ng.IAttributes) => {\n      let url = $location.url();\n      element.text(\"\
    Current URL: \" + url);\n    },\n    replace: true,\n    require: \"ngModel\"\
    ,\n    templateUrl: templatesUrl,\n  };\n}\n```\n\n### Section 24.3: Component\n\
    \nFor an easier transition to Angular 2, it's recommended to use `Component`,\
    \ available since 1.5.8.\n\nmyModule.ts\n```typescript\nimport { MyModuleComponent\
    \ } from \"./components/myModuleComponent\";\nimport { MyModuleService } from\
    \ \"./services/MyModuleService\";\n\nangular.module(\"myModule\", [])\n  .component(\"\
    myModuleComponent\", new MyModuleComponent())\n  .service(\"myModuleService\"\
    , MyModuleService);\n```\n\ncomponents/myModuleComponent.ts\n```typescript\nimport\
    \ IComponentOptions = angular.IComponentOptions;\nimport IControllerConstructor\
    \ = angular.IControllerConstructor;\nimport Injectable = angular.Injectable;\n\
    import { MyModuleController } from \"../controller/MyModuleController\";\n\nexport\
    \ class MyModuleComponent implements IComponentOptions {\n  public templateUrl\
    \ = \"./app/myModule/templates/myComponentTemplate.html\";\n  public controller:\
    \ Injectable<IControllerConstructor> = MyModuleController;\n  public bindings:\
    \ { [boundProperty: string]: string } = {};\n}\n```\n\ntemplates/myModuleComponent.html\n\
    ```html\n<div class=\"my-module-component\">{{$ctrl.someContent}}</div>\n```\n\
    \ncontroller/MyModuleController.ts\n```typescript\nimport IController = angular.IController;\n\
    import { MyModuleService } from \"../services/MyModuleService\";\n\nexport class\
    \ MyModuleController implements IController {\n  public static readonly $inject:\
    \ string[] = [\"$element\", \"myModuleService\"];\n  public someContent: string\
    \ = \"Hello World\";\n\n  constructor($element: JQuery, private myModuleService:\
    \ MyModuleService) {\n    console.log(\"element\", $element);\n  }\n\n  public\
    \ doSomething(): void {\n    // implementation..\n  }\n}\n```\n"
