    \ \".webpack.js\" , \".web.js\" , \".ts\" , \".tsx\" , \".js\" ],\n\n},\n\nmodule\
    \ : {\n  loaders: [\n    // 所有扩展名为 '.ts' 或 '.tsx' 的文件将由 'ts-loader' 处理。\n    {\
    \ test: */\\.tsx?$/* , loader: \"ts-loader\" }\n  ],\n  preLoaders : [\n    //\
    \ 所有输出 '.js' 文件将由 'source-map-loader' 处理任何 sourcemaps。\n    { test: */\\.js$/*\
    \ , loader: \"source-map-loader\" }\n  ]\n},\n```\n/******************************\n\
    ** 如果你想使用 react\n********************************************/\n// 当导入的模块路径匹配以下任意之一时，只需\n\
    // 假设存在相应的全局变量并使用该变量即可。\n// 这很重要，因为这允许我们避免打包所有的\n// 依赖，从而允许浏览器在多次构建之间缓存这些库。\n\
    // externals: {\n// \"react\": \"React\",\n// \"react-dom\": \"ReactDOM\"\n//\
    \ },\n};\n```\n\n# 第 18 章：混入 (Mixins)\n\n## 参数描述\n\n- `derivedCtor`: 你想要用作组合类（composition\
    \ class）的类\n- `baseCtors`: 一个类数组，将这些类添加到组合类中\n\n## 第 18.1 节：混入的示例\n\n要创建混入，只需声明可以作为“行为”使用的轻量级类。\n\
    \n```typescript\nclass Flies {\n  fly() {\n    alert( '这是鸟吗？还是飞机？' );\n  }\n}\n\
    \nclass Climbs {\n  climb() {\n    alert( '我的蜘蛛感在抽动。' );\n  }\n}\n\nclass Bulletproof\
    \ {\n  deflect() {\n    alert( '我的翅膀是钢铁之盾。' );\n  }\n}\n```\n\n然后你可以将这些行为应用到组合类中：\n\
    \n```typescript\nclass BeetleGuy implements Climbs, Bulletproof { \n  climb: ()\
    \ => void ;\n  deflect: () => void ;\n}\n\napplyMixins ( BeetleGuy, [ Climbs,\
    \ Bulletproof]);\n```\n\n需要 `applyMixins` 函数来完成组合工作。\n\n```typescript\nfunction\
    \ applyMixins( derivedCtor: any, baseCtors: any[]) { \n  baseCtors.forEach ( baseCtor\
    \ => {\n    Object.getOwnPropertyNames ( baseCtor.prototype ) .forEach ( name\
    \ => {\n      if ( name !== 'constructor' ) {\n        derivedCtor.prototype [\
    \ name] = baseCtor.prototype [ name];\n      }\n    });\n  });\n}\n```\n\n# 第\
    \ 19 章：如何在没有类型定义文件使用 JavaScript 库\n\n虽然某些现有的 JavaScript 库拥有定义文件，但有很多并没有。TypeScript\
    \ 提供了模式来处理缺失的声明。\n\n## 第 19.1 节：创建一个导出默认 any 的模块\n\n对于更复杂的项目，或者在你打算逐步对依赖进行类型的情况下，创建一个模块可能会更整洁。\n\
    \n以 JQuery 为例（尽管它有可用的类型）：\n\n```typescript\n// 放在 jquery.d.ts 中\ndeclare let $:\
    \ any;\nexport default $;\n```\n\n然后在项目的任何一个文件中，你可以通过以下方式导入此定义：\n\n```typescript\n\
    // 其他 .ts 文件\nimport $ from \"jquery\";\n```\n\n在导入之后，`$` 将被标记为 `any`。\n\n如果库有多个顶层变量，请按名称导出和导入：\n\
    \n```typescript\n// 放在 jquery.d.ts 中\ndeclare module \"jquery\" {\n  let $: any;\n\
    \  let jQuery: any;\n  export { $ };\n  export { jQuery };\n}\n```\n\n然后你可以同时导入并使用这两个名称：\n\
    \n```typescript\n// 其他 .ts 文件\nimport { $, jQuery} from \"jquery\";\n$.doThing\
    \ ();\njQuery.doOtherThing ();\n```\n\n## 第 19.2 节：声明一个 any 全局变量\n\n有时直接声明一个类型为\
    \ `any` 的全局是最简单的，特别是在简单的项目中。\n\n如果 jQuery 没有类型声明（它有），你可以写：\n\n```typescript\n\
    declare var $: any;\n```\n\n现在任何对 `$` 的使用都会被标记为 `any`。\n\n## 第 19.3 节：使用环境模块 (ambient\
    \ module)\n\n如果你只想表示导入的*意图*（所以你不想声明全局变量），但又不想处理任何显式定义，你可以导入一个环境模块。\n\n```typescript\n\
    // 在声明文件中（如 declarations.d.ts）\ndeclare module \"jquery\"; // 注意这里没有定义的导出内容\n\
    ```\n\n然后你可以从该环境模块导入。\n\n```typescript\n// 其他 .ts 文件\nimport { $, jQuery} from\
    \ \"jquery\";\n```\n从上述声明的模块中导入的任何内容（如 `$` 和 `jQuery`）都将是 `any` 类型。\n\n# 第 20\
    \ 章：TypeScript 安装 typescript 和运行 typescript 编译器 tsc\n\n如何从命令行安装 TypeScript 并针对\
    \ `.ts` 文件运行 TypeScript 编译器。\n\n## 第 20.1 节：步骤\n\n安装 TypeScript 并运行 typescript\
    \ 编译器。\n\n### 安装 TypeScript 编译器\n```bash\nnpm install -g typescript\n```\n\n###\
    \ 检查 typescript 版本\n```bash\ntsc - v\n```\n\n![](img/Image00003.gif) **下载 Linux/Windows\
    \ 版本的 Visual Studio Code**\n\nVisual Code 下载链接\n\n1. 打开 Visual Studio Code\n2.\
    \ 打开 Visual Studio Code\n3. 点击左侧面板的加号\n4. 创建一个基础类。\n5. 编译你的类型文件并输出。\n\n![](img/Image0003.gif)\n\
    \n# 第 21 章：TypeScript 配置\n\n## 第 21.1 节：步骤\n\n### 配置 tsconfig\n```bash\ntsc --init\n\
    ```\n这会创建一个 `tsconfig.json` 文件。\n\n### 使用 Gulp\n```typescript\nvar gulp = require(\
    \ \"gulp\" );\nvar ts = require( \"gulp-typescript\" );\n\n\nvar tsResult = gulp.src\
    \ ( \"src/*.ts\" )\n. pipe ( ts({\n  noImplicitAny: true,\n  out: \"output.js\"\
    \n}));\n\nreturn tsResult.js .pipe ( gulp.dest ( \"built/local\" ));\n```\n\n\
    # 第 22 章：与构建工具集成\n\n## 第 22.1 节：Browserify\n\n### 安装\n```bash\nnpm install tsify\n\
    ```\n\n### 使用命令行\n```javascript\nvar browserify = require( \"browserify\" );\n\
    var tsify = require( \"tsify\" );\n\nbrowserify ()\n  .pipe ( tsify({ noImplicitAny:\
    \ true }))\n  .bundle()\n  .pipe( process.stdout );\n```\n\n## 第 22.2 节：Webpack\n\
    \n### 安装\n```bash\nnpm install ts-loader --save-dev\n```\n\n### 基础 webpack.config.js\n\
    ```javascript\nmodule.exports = {\n  entry: ['./index.tsx'],\n  output: {\n  \
    \  filename: \"bundle.js\"\n  },\n  resolve: {\n    extensions: [ '.webpack.js',\
    \ '.web.js', '.ts', '.tsx', '.js' ]\n  },\n  module: {\n    loaders: [\n     \
    \ { test: /\\.ts(x)?$/, loader: 'ts-loader', exclude: /node_modules/ }\n    ]\n\
    \  }\n};\n```\n\n## 第 22.3 节：Grunt\n\n### 安装\n```bash\nnpm install grunt-ts\n\
    ```\n\n### 基础 Gruntfile.js\n```javascript\nmodule.exports = function ( grunt)\
    \ {\n  grunt.initConfig ({\n    ts: {\n      default: {\n        src: [ \"**/*.ts\"\
    , \"!node_modules/**/*.ts\" ]\n      }\n    }\n  });\n  grunt.loadNpmTasks ( \"\
    grunt-ts\" );\n  grunt.registerTask ( \"default\" , [ \"ts\" ]);\n};\n```\n\n\
    ## 第 22.4 节：Gulp\n\n### 安装\n```bash\nnpm install gulp-typescript\n```\n\n### 基础\
    \ gulpfile.js\n```javascript\nvar gulp = require( \"gulp\" );\nvar ts = require(\
    \ \"gulp-typescript\" );\n\ngulp.task ( \"default\" , function () {\n  var tsResult\
    \ = gulp.src ( \"src/*.ts\" )\n    . pipe ( ts({\n      noImplicitAny: true,\n\
    \      out: \"output.js\"\n    }));\n\n  return tsResult.js .pipe ( gulp.dest\
    \ ( \"built/local\" ));\n});\n```\n\n"
