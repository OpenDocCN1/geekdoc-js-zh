  trans: "\n\n`if at constructor( private connector: WifiConnector) where `WifiConnector`\
    \ is a concrete class what will happen?` 那么 `System` 类将与 `WifiConnector` 紧耦合，不再包含其他。这里接口通过多态解决了我们的问题。\n\
    \n### 第 9.4 节：泛型接口\n\n和类一样，接口也可以接收多态参数（即泛型）。\n\n#### 在接口上声明泛型参数\n\n```typescript\n\
    interface IStatus< U> {\n  code: U;\n}\n\ninterface IEvents< T> {\n  list: T[];\n\
    \  emit( event: T): void;\n  getAll(): T[];\n}\n```\n\n在这里，你可以看到我们的两个接口使用了一些泛型参数，`T`\
    \ 和 `U`。\n\n#### 实现泛型接口\n\n我们将创建一个简单的类来实现 `IEvents` 接口。\n\n```typescript\nclass\
    \ State< T> implements IEvents< T> {\n  list: T[];\n  constructor () {\n    this.list\
    \ = [];\n  }\n  emit ( event: T): void {\n    this.list .push ( event);\n  }\n\
    \  getAll (): T[] {\n    return this.list ;\n  }\n}\n```\n\n让我们为 `State` 类创建一些实例。\n\
    \n在我们的示例中，`State` 类将通过使用 `IStatus< T>` 来处理泛型状态。这样，接口 `IEvent< T>` 也会处理 `IStatus<\
    \ T>`。\n\n```typescript\nconst s = new State< IStatus< number>>();\n// 预期 'code'\
    \ 属性为数字，所以：s.emit ({ code: 200 }); // 正常工作\ns.emit ({ code: '500' }); // 类型错误\n\
    s.getAll () .forEach ( event => console.log ( event.code ));\n```\n\n在这里，我们的 `State`\
    \ 类被类型化为 `IStatus< number>`。\n\n```typescript\nconst s2 = new State< IStatus<\
    \ Code>>();\n// 我们能够以 Code 类型发射 code\ns2.emit ({ code: { message: 'OK' , status:\
    \ 200 } });\ns2. getAll () .map ( event => event.code ) .forEach ( event => {\n\
    \  console.log ( event.message );\n  console.log ( event.status );\n});\n```\n\
    \n我们的 `State` 类被类型化为 `IStatus< Code>`。通过这种方式，我们能够向 `emit` 方法传递更复杂的类型。如你所见，泛型接口是静态类型代码非常有用的工具。\n\
    \n### 第 9.5 节：向现有接口添加函数或属性\n\n假设我们有一个 `JQuery` 类型定义的引用，并且想要扩展它，以包含来自我们引入的插件的额外函数，而该插件没有官方的类型定义。我们可以通过在单独接口声明中声明插件添加的函数，并使用相同的\
    \ `JQuery` 名称来轻松地扩展它：\n\n```typescript\ninterface JQuery {\n  pluginFunctionThatDoesNothing():\
    \ void;\n  // 创建链式函数\n  manipulateDOM( HTMLElement): JQuery;\n}\n```\n\n编译器会将所有同名的声明合并为一个\
    \ - 更多细节请参阅声明合并（declaration merging）。\n\n### 第 9.6 节：隐式实现与对象形状\n\nTypeScript 支持接口，但编译器输出的是\
    \ JavaScript，而 JavaScript 不支持。因此，接口在编译步骤实际上丢失了。这就是为什么对接口的类型检查取决于对象的*形状*（shape），这意味着对象是否支持接口上的字段和函数——而不是取决于接口是否真的被实现。\n\
    \n```typescript\ninterface IKickable {\n  kick( distance: number): void;\n}\n\n\
    class Ball {\n  kick( distance: number): void {\n    console.log ( \"Kicked\"\
    \ , distance, \"meters!\" );\n  }\n}\nlet kickable: IKickable = new Ball();\n\
    kickable.kick ( 40 );\n```\n\n所以，即使 `Ball` 没有显式实现 `IKickable`，`Ball` 实例也可以赋值给（并作为）`IKickable`\
    \ 进行操作，即使指定了类型。\n\n### 第 9.7 节：使用接口强制类型\n\nTypeScript 的核心优势之一是它能够强制你在代码中传递的值具有数据类型，以帮助防止错误。\n\
    \n假设你正在开发一个宠物约会应用程序。你有一个简单的函数来检查两只宠物是否相互兼容……\n\n```typescript\ncheckCompatible(\
    \ petOne, petTwo) {\n  if ( petOne.species === petTwo.species &&\n  Math.abs (\
    \ petOne.age petTwo.age ) <= 5 ) {\n    return true ;\n  }\n}\n```\n\n这是一段完全功能代码，但对于某人（特别是其他编写此应用程序但没有编写此函数的人）来说，要意识到他们应该传递带有\
    \ 'species' 和 'age' 属性的对象是非常的。他们可能会错误地尝试 `checkCompatible( petOne.species , petTwo.species\
    \ )`，然后只能去解决函数尝试访问 `petOne.species.species` 或 `petOne.species.age` 时抛出的错误！\n\n\
    我们可以防止这种情况发生的一种方法是在宠物参数上指定我们需要的属性：\n\n```typescript\ncheckCompatible ( petOne:\
    \ { species: string, age: number}, petTwo: { species: string, age: number}) {\n\
    \  //...\n}\n```\n\n在这种情况下，TypeScript 将确保传递到函数的所有所有内容都具有 'species' 和 'age' 属性（即使它们有额外的属性也可以的），但即使只指定了两个属性，这个解决方案也有些笨拙。使用接口，有更好的方法！\n\
    \n首先，我们定义接口：\n\n```typescript\ninterface Pet {\n  species: string;\n  age: number;\n\
    \  // 如果需要，我们可以添加更多属性。\n}\n```\n\n现在，我们需要做的只是将参数的类型指定为我们的新接口，如下……\n\n```typescript\n\
    checkCompatible ( petOne: Pet, petTwo: Pet) {\n  //...\n}\n```\n\n……TypeScript\
    \ 将确保传递到我们函数的参数包含 `Pet` 接口中指定的属性！\n\n# 第 10 章：泛型\n\n## 第 10.1 节：泛型接口\n\n#### 声明泛型接口\n\
    \n```typescript\ninterface IResult< T> {\n  wasSuccessful: boolean ;\n  error:\
    \ T;\n}\n\nvar result: IResult< string> = ....\nvar error: string = result.error\
    \ ;\n```\n\n**带有多个类型参数的泛型接口**\n\n```typescript\ninterface IRunnable< T, U> {\n\
    \  run( input: T): U;\n}\n\nvar runnable: IRunnable< string, number> = ... \n\
    var input: string;\nvar result: number = runnable.run ( input);\n```\n\n#### 实现泛型接口\n\
    \n```typescript\ninterface IResult< T>{\n  wasSuccessful: boolean ; error: T;\n\
    \  clone(): IResult< T>;\n}\n```\n\n使用泛型类实现：\n\n```typescript\nclass Result< T>\
    \ implements IResult< T> {\n  constructor( wasSuccessful: boolean , error: T)\
    \ { }\n  clone (): IResult< T> {\n    return new Result< T>( this.result , this.error\
    \ );\n  }\n}\n```\n\n使用非泛型类实现：\n\n```typescript\nclass StringResult implements\
    \ IResult< string> {\n  constructor( wasSuccessful: boolean , error: string) {\
    \ }\n  clone (): IResult< string> {\n    return new StringResult( this.result\
    \ , this.error );\n  }\n}\n```\n\n### 第 10.2 节：泛型类\n\n```typescript\nclass Result<\
    \ T> {\n  constructor( wasSuccessful: boolean , error: T) { }\n  clone (): Result<\
    \ T> { ... }\n}\n\nlet r1 = new Result( false , 'error: 42' ); // 编译器推断 T 为 string\n\
    let r2 = new Result( false , 42 ); // 编译器推断 T 为 number\nlet r3 = new Result< string>(\
    \ true ,null ); // 显式设置 T 为 string\nlet r4 = new Result< string>( true ,4 ); //\
    \ 编译错误，因为 4 不是 string\n```\n\n### 第 10.3 节：类型参数作为约束\n\n从 TypeScript 1.8 开始，类型参数约束可以引用同一类型参数列表中的类型参数。以前这是一个错误。\n\
    \n```typescript\nfunction assign< T extends U, U>( target: T, source: U): T {\n\
    \  for (let id in source) {\n    target[ id] = source[ id];\n  }\n  return target;\n\
    }\n\nlet x = { a: 1 , b: 2 , c: 3 , d: 4 }; \nassign( x, { b: 10 , d: 20 });\n\
    assign( x, { e: 0 }); // \n```\n\n### 第 10.4 节：泛型约束\n\n简单的约束：\n\n```typescript\n\
    interface IRunnable {\n  run(): void ;\n}\n\ninterface IRunner< T extends IRunnable>\
    \ {\n  runSafe( runnable: T): void ;\n}\n```\n\n更复杂的约束：\n\n```typescript\ninterface\
    \ IRunnble< U> {\n  run(): U;\n}\n\ninterface IRunner< T extends IRunnble< U>,\
    \ U> {\n  runSafe( runnable: T): U;\n}\n```\n\n更复杂的：\n\n```typescript\ninterface\
    \ IRunnble< V> {\n  run( parameter: U): V;\n}\n\ninterface IRunner< T extends\
    \ IRunnble< U, V>, U, V> { \n  runSafe( runnable: T, parameter: U): V; \n}\n```\n\
    \n内联类型约束：\n\n"
- fmt: "\n```typescript\ninterface IRunnable< T extends { run(): void }> { runSafe(\
    \ runnable: T): void ;\n\n}\n```\n\n### Section 10.5: Generic Functions\n\nIn\
    \ interfaces:\n\n```typescript\ninterface IRunner {\n  runSafe< T extends IRunnable>(\
    \ runnable: T): void ;\n}\n```\n\nIn classes:\n\n```typescript\nclass Runner implements\
    \ IRunner {\n  public runSafe< T extends IRunnable>( runnable: T): void { \n \
    \   try {\n      runnable.run ();\n    } catch ( e) {\n\n    }\n  }\n}\n```\n\n\
    Simple functions:\n\n```typescript\nfunction runSafe< T extends IRunnable>( runnable:\
    \ T): void { \n  try {\n    runnable.run ();\n  } catch ( e) {\n\n  }\n}\n```\n\
    \n### Section 10.6: Using generic Classes and Functions:\n\nCreate generic class\
    \ instance:\n\n```typescript\nvar stringRunnable = new Runnable< string>();\n\
    ```\n\nRun generic function:\n\n```typescript\nfunction runSafe< T extends Runnable<\
    \ U>, U>( runnable: T);\n```\n\n// Specify the generic types:\n\n```typescript\n\
    runSafe< Runnable< string>, string>( stringRunnable);\n```\n\n// Let typescript\
    \ figure the generic types by himself:\n\n```typescript\nrunSafe( stringRunnable);\n\
    ```\n\n### Chapter 11: Strict null checks\n\n#### Section 11.1: Strict null checks\
    \ in action\n\nBy default, all types in TypeScript allow `null`:\n\n```typescript\n\
    function getId( x: Element) {\n  return x.id ;\n}\n```\n\n`getId( null );` //\
    \ TypeScript does not complain, but this is a runtime error.\n\nTypeScript 2.0\
    \ adds support for strict null checks. If you set `-strictNullChecks` when running\
    \ `tsc` (or set this flag in your `tsconfig.json`), then types no longer permit\
    \ `null`:\n\n```typescript\nfunction getId( x: Element) {\n  return x.id ;\n}\n\
    ```\n\n`getId( null );` // error: Argument of type 'null' is not assignable to\
    \ parameter of type 'Element'.\n\nYou must permit `null` values explicitly:\n\n\
    ```typescript\nfunction getId( x: Element| null ) {\n  return x.id ; // error\
    \ TS2531: Object is possibly 'null'.\n}\n```\n\n`getId( null );`\n\nWith a proper\
    \ guard, the code type checks and runs correctly:\n\n```typescript\nfunction getId(\
    \ x: Element| null ) {\n  if ( x) {\n    return x.id ; // In this branch, x's\
    \ type is Element\n  } else {\n    return null ; // In this branch, x's type is\
    \ null.\n  }\n}\n```\n\n`getId( null );`\n\n#### Section 11.2: Non-null assertions\n\
    \nThe non-null assertion operator, `!`, allows you to assert that an expression\
    \ isn't `null` or `undefined` when the TypeScript compiler can't infer that automatically:\n\
    \n```typescript\ntype ListNode = { data: number; next?: ListNode; };\n```\n\n\
    ```typescript\nfunction addNext( node: ListNode) {\n  if ( node.next === undefined\
    \ ) {\n    node.next = { data: 0 };\n  }\n}\n```\n\n```typescript\nfunction setNextValue(\
    \ node: ListNode, value: number) {\n  addNext( node);\n  // Even though we know\
    \ `node.next` is defined because we just called `addNext`, \n  // TypeScript isn't\
    \ able to infer this in the line of code below:\n  // node.next.data = value;\n\
    \  // So, we can use the non-null assertion operator, !,\n  // to assert that\
    \ node.next isn't undefined and silence the compiler warning\n  node.next ! .data\
    \ = value;\n}\n```\n\n### Chapter 12: User-defined Type Guards\n\n#### Section\
    \ 12.1: Type guarding functions\n\nYou can declare functions that serve as type\
    \ guards using any logic you'd like.\n\nThey take the form:\n\n```typescript\n\
    function functionName( variableName: any): variableName is DesiredType {\n  //\
    \ body that returns boolean\n}\n```\n\nIf the function returns true, TypeScript\
    \ will narrow the type to `DesiredType` in any block guarded by a call to the\
    \ function.\n\nFor example (try it ):\n\n```typescript\nfunction isString( test:\
    \ any): test is string {\n  return typeof test === \"string\" ;\n}\n```\n\n```typescript\n\
    function example( foo: any) {\n  if ( isString( foo)) {\n    // foo is type as\
    \ a string in this block\n    console.log ( \"it's a string: \" + foo);\n  } else\
    \ {\n    // foo is type any in this block\n    console.log ( \"don't know what\
    \ this is! [\" + foo + \"]\" );\n  }\n}\n```\n\n`example( \"hello world\" );`\
    \ // prints \"it's a string: hello world\"\n\n`example({ something: \"else\" });`\
    \ // prints \"don't know what this is! [[object Object]]\"\n\nA guard's function\
    \ type predicate (the `foo is Bar` in the function return type position) is used\
    \ at compile time to narrow types, the function body is used at runtime. The type\
    \ predicate and function must agree, or your code won't work.\n\nType guard functions\
    \ don't have to use `typeof` or `instanceof`, they can use more complicated logic.\n\
    \nFor example, this code determines if you've got a jQuery object by checking\
    \ for its version string.\n\n```typescript\nfunction isJQuery( foo): foo is JQuery\
    \ { \n  // test for jQuery's version string\n  return foo.jquery !== undefined\
    \ ;\n}\n```\n\n```typescript\nfunction example( foo) {\n  if ( isJQuery( foo))\
    \ {\n    // ...\n  }\n}\n```\n\n#### Section 12.2: Using instanceof\n\n`instanceof`\
    \ requires that the variable is of a specific class.\n\nFor example:\n\n```typescript\n\
    class Pet { }\nclass Dog extends Pet {\n  bark() { }\n}\nclass Cat extends Pet\
    \ {\n  purr() { }\n}\n```\n\nExample usage:\n\n```typescript\nfunction example(foo:\
    \ any) {\n  if (foo instanceof Dog) {\n    // ...\n  } else if (foo instanceof\
    \ Cat) {\n    // ...\n  }\n}\n```\n\n#### Section 12.3: Using typeof\n\n`typeof`\
    \ is used to distinguish between `number`, `string`, `boolean`, `symbol`. Unlike\
    \ `instanceof`, it works with primitive types.\n\n```typescript\nfunction example(foo:\
    \ any) {\n  if (typeof foo === \"number\") {\n    // ...\n  } else if (typeof\
    \ foo === \"string\") {\n    // ...\n  }\n}\n```\n\n### Chapter 13: TypeScript\
    \ basic examples\n\n#### Section 13.1: class inheritance example using super keyword\n\
    \nA generic Car class has some property and a description method.\n\n```typescript\n\
    class Car {\n  name: string;\n  engineCapacity: string;\n\n  constructor(name:\
    \ string, engineCapacity: string) {\n    this.name = name;\n    this.engineCapacity\
    \ = engineCapacity;\n  }\n\n  describeCar() {\n    console.log(`${this.name} car\
    \ comes with ${this.engineCapacity} displacement`);\n  }\n}\n```\n\n`HondaCar`\
    \ extends the existing generic class and adds new property.\n\n```typescript\n\
    class HondaCar extends Car {\n  seatingCapacity: number;\n\n  constructor(name:\
    \ string, engineCapacity: string, seatingCapacity: number) {\n    super(name,\
    \ engineCapacity);\n    this.seatingCapacity = seatingCapacity;\n  }\n\n  describeHondaCar()\
    \ {\n    super.describeCar();\n    console.log(`${this.name} cars comes with seating\
    \ capacity of ${this.seatingCapacity}`);\n  }\n}\n```\n\n#### Section 13.2: static\
    \ class variable example - count how many time method being invoked\n\nhere `countInstance`\
    \ is a static class variable.\n\n```typescript\nclass StaticTest {\n  static countInstance:\
    \ number = 0;\n  constructor() {\n    StaticTest.countInstance++;\n  }\n}\n```\n\
    \n`new StaticTest();`\n\n`new StaticTest();`\n\n`console.log(StaticTest.countInstance);`\n\
    \n### Chapter 14: Importing external libraries\n\n#### Section 14.1: Finding definition\
    \ files\n\nfor typescript 2.x:\n\ndefinitions from DefinitelyTyped are available\
    \ via `@types` npm package:\n\n```bash\nnpm i --save lodash\nnpm i --save-dev\
    \ @types/lodash\n```\n\nbut in case if you want use types from other repos then\
    \ can be used old way:\n\nfor typescript 1.x:\n\nTypings is an npm package that\
    \ can automatically install type definition files into a local project. I recommend\
    \ that you read the quickstart .\n\n```bash\nnpm install -global typings\n```\n"
