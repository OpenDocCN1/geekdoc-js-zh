    \ true ,\n    \"curly\" : true ,\n    \"quotemark\" : [ true , \"double\" ]\n\
    \  }\n}\n```\n\n## 第 27.5 节：使用预定义规则集作为默认\n\ntslint 可以扩展现有的规则集，并带有默认的 `tslint:recommended`\
