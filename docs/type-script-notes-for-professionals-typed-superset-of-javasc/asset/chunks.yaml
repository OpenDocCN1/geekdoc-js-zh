  trans: "\n\nlodash npm `https://www.npmjs.com/package/lodash 1\n\n2016-07-01T20:51:07.000Z\n\
    \n2. 然后决定你应该从哪个源安装。我使用 `dt`，它代表 `DefinitelyTyped`，这是一个社区可以编辑类型定义（typings）的 GitHub\
    \ 仓库，它通常是最新更新的。\n\n3. 安装类型定义文件\n\n```\ntypings install dt~lodash -global -save\n\
    ```\n\n让我们拆解最后一条命令。我们正在将 DefinitelyTyped 版本的 `lodash` 作为全局类型定义文件安装到项目中，并将其作为依赖保存到\
    \ `typings.json` 中。现在，无论何时何导入 `lodash`，typescript 都会加载 `lodash` 的类型定义文件。\n\n4.\
    \ 如果我们想安装仅用于开发环境的类型定义，可以提供 `-save-dev` 标志：\n\n```\ntypings install chai -save-dev\n\
    ```\n\n#### 14.2 节：从 npm 导入模块\n\n如果你有该模块的类型定义文件 (`d.ts`)，可以使用 import 语句。\n\n```typescriptimport\
    \ _ = require('lodash');\n```\n\n如果你没有该模块的定义文件，TypeScript 在编译时会抛出错误，因为它找不到你尝试导入的模块。\n\
    \n在这种情况下，你可以使用普通的运行时 `require` 函数导入该模块。然而，它将其返回为 `any` 类型。\n\n```typescript\n\
    // _ 变量类型为 any，因此 TypeScript 不会执行任何类型检查。\nconst _: any = require('lodash');\n\
    ```\n\n从 TypeScript 2.0 开始，你还可以使用*简写环境模块声明 (shorthand ambient module declaration)*，在没有模块类型定义文件的情况下告诉\
    \ TypeScript 模块存在。尽管在这种情况下，TypeScript 无法提供任何意义的类型检查。\n\n```typescript\ndeclare\
    \ module \"lodash\";\n```\n\n```typescript\n// 现在你可以以任何想要的方式从 lodash 导入：\nimport\
    \ { flatten } from \"lodash\";\nimport * as _ from \"lodash\";\n```\n\n从从 TypeScript\
    \ 2.1 开始，规则进一步放宽。现在，只要你的 `node_modules` 目录存在该模块，TypeScript 就会允许你导入它，即使没有没有模块声明。（注意，如果使用\
    \ `-noImplicitAny` 编译器选项，下例仍会生成警告。）\n\n```typescript\n// 如果 `node_modules/someModule/index.js`\
    \ 存在，或者 `node_modules/someModule/package.json` 有有效的 \"main\" 入口点，则可行\nimport {\
    \ foo } from \"someModule\";\n```\n\n#### 14.3 节：使用没有类型定义的全局外部库\n\n虽然模块是理想的，但如果你使用的库是通过全局变量（如\
    \ `$` 或 `_`）引用的（因为它通过脚本标签加载），你可以创建一个环境声明来引用它：\n\n```typescript\ndeclare const\
    \ _: any;\n```\n\n#### 14.4 节：使用 TypeScript 2.x 查找定义文件\n\n在 TypeScript 2.x 版本中，类型定义现在从\
    \ npm 的 `@types` 仓库获取。这些由 TypeScript 编译器自动解析，使用起来简单得多。\n\n要安装类型定义，只需将其作为开发依赖安装在项目的\
    \ `package.json` 中\n\n例如：\n\n```bash\nnpm i -S lodash\nnpm i -D @types/lodash\n\
    ```\n\n安装后，你只需像以前一样使用该模块\n\n```typescript\nimport * as _ from 'lodash'\n```\n\n\
    #### 第 15 章：模块 - 导出与导入\n\n#### 15.1 节：Hello world 模块\n\n```typescript\n//hello.ts\n\
    export function hello(name: string){\n  console.log (`Hello ${name}!`);\n}\n\n\
    function helloES(name: string){\n  console.log (`Hola ${name}!`);\n}\n\nexport\
    \ {helloES};\nexport default hello;\n```\n\n##### 使用目录加载\n\n如果目录包含名为 `index.ts`\
    \ 的文件，则可以使用目录名加载（`index.ts` 是可选的）。\n\n```typescript\n//welcome/index.ts\nexport\
    \ function welcome(name: string){ console.log (`Welcome ${name}! }\n```\n\n#####\
    \ 定义模块的示例\n\n```typescript\nimport { hello, helloES} from \"./hello\"; // 导入指定的元素\n\
    import defaultHello from \"./hello\"; \nimport * as Bundle from \"./hello\"; //\
    \ 所有导出到 Bundle\nimport { welcome} from \"./welcome\"; // 默认导出到 name\n\n// index.ts\
    \ 被省略\n\nhello (\"World\");\nhelloES (\"undo\");\ndefaultHello (\"World\"); //\
    \ Hello World! // Hola Mundo!\n\nBundle.hello (\"World\"); Bundle.helloES (\"\
    undo\"); // Hello World! // Hola Mundo!\n\nwelcome (\"Human\"); // Welcome Human!\n\
    ```\n\n#### 15.2：重新导出\n\nTypeScript 允许重新导出声明。\n\n```typescript\n//Operator.ts\n\
    interface Operator {\n  eval(a: number, b: number): number;\n}\nexport default\
    \ Operator;\n```\n\n```typescript\n//Add.ts\nimport Operator from \"./Operator\"\
    ;\nexport class Add implements Operator {\n  eval(a: number, b: number): number\
    \ { return a + b; }\n}\n```\n\n```typescript\n//Mul.ts\nimport Operator from \"\
    ./Operator\"; \nexport class Mul implements Operator {\n  eval(a: number, b: number):\
    \ number { return a * b; }\n}\n```\n\n可以在单个库中打包所有操作\n\n```typescript\n//Operators.ts\n\
    import {Add} from \"./Add\"; \nimport {Mul} from \"./Mul\";\nexport {Add, Mul};\n\
    ```\n\n**命名声明**可以使用更短的语法重新导出\n\n```typescript\n//NamedOperators.ts\nexport {Add}\
    \ from \"./Add\"; \nexport {Mul} from \"./Mul\";\n```\n\n**默认导出**也可以导出，但没有简写语法。记住，每个模块只能有一个默认导出。\n\
    \n```typescript\n//Calculator.ts\nexport {Add} from \"./Add\";\nexport {Mul} from\
    \ \"./Mul\";\nimport Operator from \"./Operator\";\nexport default Operator;\n\
    ```\n\n重新导出**打包导入**是可能的\n\n```typescript\n//RepackedCalculator.ts \nexport * from\
    \ \"./Operators\";\n```\n\n重新导出打包时，显式声明可能会被覆盖。\n\n```typescript\n//FixedCalculator.ts\n\
    export * from \"./Calculator\"\nimport Operator from \"./Calculator\";\nexport\
    \ class Add implements Operator {\n  eval(a: number, b: number): number { return\
    \ 42; }\n}\n```\n\n用法示例\n\n```typescript\n//run.ts\nimport { Add, Mul} from \"\
    ./FixedCalculator\";\nconst add = new Add(); const mul = new Mul();\nconsole.log\
    \ (add.eval(1, 1)); // 42\nconsole.log (mul.eval(3, 4)); // 12\n```\n\n#### 15.3\
    \ 节：导出/导入\n\n任何声明（变量、const、函数等）都可以从模块导出并在其他模块中导入。\n\nTypeScript 提供两种类型：命名和默认。\n\
    \n**命名导出**\n\n```typescript\n// adams.ts\nexport function hello(name: string){\n\
    \  console.log (`Hello ${name}!`);\n}\nexport const answerToUniverseAndEverything\
    \ = 42;\nexport const unused = 0;\n```\n\n导入命名导出时，你可以指定想要导入的元素。\n\n```typescript\n\
    import {hello, answerToUniverseAndEverything} from \"./adams\"; \nhello(answerToUniverseAndEverything);\
    \ // Hello 42!\n```\n\n**默认导出**\n\n每个模块可以有一个默认导出\n\n```typescript\n// dent.ts\n\
    const defaultValue = 54; export default defaultValue;\n```\n\n可以使用以下方式导入\n\n```typescript\n\
    import defaultValue from \"./dent\";\nconsole.log(defaultValue); // 54\n```\n\n\
    **打包导入**\n\nTypeScript 提供了将整个模块导入到变量的方法\n\n```typescript\n// adams.ts\nexport\
    \ function hello(name: string){\n  console.log (`Hello ${name}!`);\n}\nexport\
    \ const answerToUniverseAndEverything = 42;\nexport const unused = 0;\n```\n\n\
    ```typescript\nimport * as Bundle from \"./adams\";\nBundle.hello(Bundle.answerToUniverseAndEverything);\
    \ // Hello 42!\nconsole.log(Bundle.unused); // 0\n```\n\n#### 第 16 章：发布 TypeScript\
    \ 定义文件\n\n#### 16.1 节：在 npm 库中包含定义文件\n\n在你的 `package.json` 中添加 `typings`\n\n```json\n\
    {\n  ...\n  \"typings\" : \"path/file.d.ts\"\n  ...\n}\n```\n\n现在每当导入该库时，typescript\
    \ 都会加载类型文件\n\n#### 第 17 章：配合 webpack 使用 TypeScript\n\n#### 17.1 节：webpack.config.js\n\
    \n安装加载 `npm install --save-dev ts-loader source-map-loader`\n\n**tsconfig.json**\n\
    \n```json\n{\n  \"compilerOptions\" : {\n    \"sourceMap\" : true,\n    \"noImplicitAny\"\
    \ : true,\n    \"module\" : \"commonjs\",\n    \"target\" : \"es5\",\n    \"jsx\"\
    \ : \"react\" // 如果你想使用 react jsx\n  }\n}\n```\n\n```javascript\nmodule.exports\
    \ = {\n  entry: \"./src/index.ts\",\n  output: {\n    filename: \"./dist/bundle.js\"\
    ,\n  },\n  // 为调试 webpack 的输出启用源 cemaps。\n  devtool: \"source-map\",\n  resolve\
    \ : {\n```\n\n"
- fmt: "\n```javascript\n// Add '.ts' and '.tsx' as resolvable extensions.\nextensions:\
    \ [ \"\" , \".webpack.js\" , \".web.js\" , \".ts\" , \".tsx\" , \".js\" ],\n\n\
    },\n\nmodule : {\n  loaders: [\n    // All files with a '.ts' or '.tsx' extension\
    \ will be handled by 'ts-loader'.\n    { test: */\\.tsx?$/* , loader: \"ts-loader\"\
    \ }\n  ],\n  preLoaders : [\n    // All output '.js' files will have any sourcemaps\
    \ re-processed by 'source-map-loader'.\n    { test: */\\.js$/* , loader: \"source-map-loader\"\
    \ }\n  ]\n},\n```\n/******************************\n** If you want to use react\n\
    ********************************************/\n// When importing a module whose\
    \ path matches one of the following, just\n// assume a corresponding global variable\
    \ exists and use that instead. \n// This is important because it allows us to\
    \ avoid bundling all of our\n// dependencies, which allows browsers to cache those\
    \ libraries between builds.\n// externals: {\n// \"react\": \"React\",\n// \"\
    react-dom\": \"ReactDOM\"\n// },\n};\n```\n\n# Chapter 18: Mixins\n\n## Parameter\
    \ Description\n\n- `derivedCtor`: The class that you want to use as the composition\
    \ class\n- `baseCtors`: An array of classes to be added to the composition class\n\
    \n## Section 18.1: Example of Mixins\n\nTo create mixins, simply declare lightweight\
    \ classes that can be used as \"behaviours\".\n\n```typescript\nclass Flies {\n\
    \  fly() {\n    alert( 'Is it a bird? Is it a plane?' );\n  }\n}\n\nclass Climbs\
    \ {\n  climb() {\n    alert( 'My spider-sense is tingling.' );\n  }\n}\n\nclass\
    \ Bulletproof {\n  deflect() {\n    alert( 'My wings are a shield of steel.' );\n\
    \  }\n}\n```\n\nYou can then apply these behaviours to a composition class:\n\n\
    ```typescript\nclass BeetleGuy implements Climbs, Bulletproof { \n  climb: ()\
    \ => void ;\n  deflect: () => void ;\n}\n\napplyMixins ( BeetleGuy, [ Climbs,\
    \ Bulletproof]);\n```\n\nThe `applyMixins` function is needed to do the work of\
    \ composition.\n\n```typescript\nfunction applyMixins( derivedCtor: any, baseCtors:\
    \ any[]) { \n  baseCtors.forEach ( baseCtor => {\n    Object.getOwnPropertyNames\
    \ ( baseCtor.prototype ) .forEach ( name => {\n      if ( name !== 'constructor'\
    \ ) {\n        derivedCtor.prototype [ name] = baseCtor.prototype [ name];\n \
    \     }\n    });\n  });\n}\n```\n\n# Chapter 19: How to use a JavaScript library\
    \ without a type definition file\n\nWhile some existing JavaScript libraries have\
    \ type definition files, there are many that don't. TypeScript offers a couple\
    \ patterns to handle missing declarations.\n\n## Section 19.1: Make a module that\
    \ exports a default any\n\nFor more complicated projects, or in cases where you\
    \ intend to gradually type a dependency, it may be cleaner to create a module.\n\
    \nUsing JQuery (although it does have typings available) as an example:\n\n```typescript\n\
    // place in jquery.d.ts\ndeclare let $: any;\nexport default $;\n```\n\nAnd then\
    \ in any file in your project, you can import this definition with:\n\n```typescript\n\
    // some other .ts file\nimport $ from \"jquery\";\n```\n\nAfter this import, `$`\
    \ will be typed as `any`.\n\nIf the library has multiple top-level variables,\
    \ export and import by name instead:\n\n```typescript\n// place in jquery.d.ts\n\
    declare module \"jquery\" {\n  let $: any;\n  let jQuery: any;\n  export { $ };\n\
    \  export { jQuery };\n}\n```\n\nYou can then import and use both names:\n\n```typescript\n\
    // some other .ts file\nimport { $, jQuery} from \"jquery\";\n$.doThing ();\n\
    jQuery.doOtherThing ();\n```\n\n## Section 19.2: Declare an any global\n\nIt is\
    \ sometimes easiest to just declare a global of type `any`, especially in simple\
    \ projects.\n\nIf jQuery didn't have type declarations (it does), you could put:\n\
    \n```typescript\ndeclare var $: any;\n```\n\nNow any use of `$` will be typed\
    \ `any`.\n\n## Section 19.3: Use an ambient module\n\nIf you just want to indicate\
    \ the *intent* of an import (so you don't want to declare a global) but don't\
    \ wish to bother with any explicit definitions, you can import an ambient module.\n\
    \n```typescript\n// in a declarations file (like declarations.d.ts)\ndeclare module\
    \ \"jquery\"; // note that there are no defined exports\n```\n\nYou can then import\
    \ from the ambient module.\n\n```typescript\n// some other .ts file\nimport {\
    \ $, jQuery} from \"jquery\";\n```\nAnything imported from the declared module\
    \ (like `$` and `jQuery`) above will be of type `any`.\n\n# Chapter 20: TypeScript\
    \ installing typescript and running the typescript compiler tsc\n\nHow to install\
    \ TypeScript and run the TypeScript compiler against a `.ts` file from the command\
    \ line.\n\n## Section 20.1: Steps\n\nInstalling TypeScript and running typescript\
    \ compiler.\n\n### To install TypeScript Compiler\n```bash\nnpm install -g typescript\n\
    ```\n\n### To check with the typescript version\n```bash\ntsc - v\n```\n\n![](Image00003.gif)\
    \ **Download Visual Studio Code for Linux/Windows**\n\nVisual Code Download Link\n\
    \n1. Open Visual Studio Code\n2. Open Same Folder where you have installed TypeScript\
    \ compiler\n3. Add File by clicking on plus icon on left pane\n4. Create a basic\
    \ class.\n5. Compile your type script file and generate output.\n\n![](Image00003.gif)\n\
    \n# Chapter 21: TypeScript Configuration\n\n## Section 21.1: Steps\n\n### Configure\
    \ tsconfig\n```bash\ntsc --init\n```\nThis creates a `tsconfig.json` file.\n\n\
    ### Using Gulp\n```typescript\nvar gulp = =( \"gulp\"\n\n\nvar ts = require( \"\
    gulp-typescript\"\n\n\n\nvar tsResult = gulp.src ( \"src/*.ts\" )\n. pipe ( ts({\
    \ noImplicitAny: true, out: \"output.js\" }));\n\nreturn tsResult.js.pipe ( gulp.dest\
    \ ( \"built/local\" ));```\n\n# Chapter 22: Integrating with Build Tools\n\n##\
    \ Section 22.1: Browserify\n\n### Install\n```bash\nnpm install tsify\n```\n\n\
    ### Using Command Line\n```javascript\nvar browserify = require( \"browserify\"\
    \ );\nvar tsify = require( \"tsify\" );\n\nbrowserify ()\n  .pipe ( tsify({ noImplicitAny:\
    \ true }))\n  .bundle()\n  .pipe( process.stdout );\n```\n\n## Section 22.2: Webpack\n\
    \n### Install\n```bash\nnpm install ts-loader --save-dev\n```\n\n### Basic webpack.config.js\n\
    ```javascript\nmodule.exports = {\n  entry: ['./index.tsx'],\n  output: {\n  \
    \  filename: \"bundle.js\"\n  },\n  resolve: {\n    extensions: [ '.webpack.js',\
    \ '.web.js', '.ts', '.tsx', '.js' ]\n  },\n  module: {\n    loaders: [\n     \
    \ { test: /\\.ts(x)?$/,, loader: 'ts-loader', exclude: /node_modules/ }\n    ]\n\
    \  }\n};\n```\n\n## Section 22.3: Grunt\n\n### Install\n```bash\nnpm install grunt-ts\n\
    ```\n\n### Basic Gruntfile.js\n```javascript\nmodule.exports = function ( grunt)\
    \ {\n  grunt.initConfig ({\n    ts: {\n      default: {\n        src: [ \"**/*.ts\"\
    , \"!node_modules/**/*.ts\" ]\n      }\n    }\n  });\n  grunt.loadNpmTasks ( \"\
    grunt-ts\" );\n  grunt.registerTask ( \"default\" , [ \"ts\" ]);\n};\n```\n\n\
    ## Section 22.4: Gulp\n\n### Install\n```bash\nnpm install gulp-typescript\n```\n\
    \n### Basic gulpfile.js\n```javascript\nvar gulp = require( \"gulp\" );\nvar ts\
    \ = require( \"gulp-typescript\" );\n\ngulp.task ( \"default\" , function () {\n\
    \  var tsResult = gulp.src ( \"src/*.ts\" )\n    . pipe ( ts({\n      noImplicitAny:\
    \ true,\n      out: \"output.js\"\n    }));\n\n  return tsResult.js .pipe ( gulp.dest\
    \ ( \"built/local\" ));\n});\n```\n"
