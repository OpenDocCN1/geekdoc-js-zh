    assigned to (and manipulated as) an IKickable, even when the type is specified.


    ### **Section 9.7: Using Interfaces to Enforce Types**


    One of the core benefits of TypeScript is that it enforces data types of values
    that you are passing around your code to help prevent mistakes.


    Let''s say you''re making a pet dating application.


    You have this simple function that checks if two pets are compatible with each
    other...


