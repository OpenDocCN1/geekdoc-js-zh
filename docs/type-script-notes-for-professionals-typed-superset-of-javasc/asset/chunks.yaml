    ### **Section 10.5: Generic Functions**


    In interfaces:


    interface IRunner {


    runSafe< T extends IRunnable>( runnable: T): **void** ;


    }


    In classes:


    class Runner implements IRunner {


    public runSafe< T extends IRunnable>( runnable: T): **void** { **try** {


    runnable.run ();


    } **catch** ( e) {


    }


    }


    }


    Simple functions:


    **function** runSafe< T extends IRunnable>( runnable: T): **void** { **try** {


    runnable.run ();


    } **catch** ( e) {


    }


    }


    ### **Section 10.6: Using generic Classes and Functions:**


    Create generic class instance:


    **var** stringRunnable = **new** Runnable< string>();


    Run generic function:


    **function** runSafe< T extends Runnable< U>, U>( runnable: T);


    *// Specify the generic types:*


    runSafe< Runnable< string>, string>( stringRunnable);


    *// Let typescript figure the generic types by himself:*


    runSafe( stringRunnable);


    ### **Chapter 11: Strict null checks


    Section 11.1: Strict null checks in action**


    By default, all types in TypeScript allow **null** :


    **function** getId( x: Element) {


    **return** x.id ;


    }


    getId( **null** ); *// TypeScript does not complain, but this is a runtime error.*


    TypeScript 2.0 adds support for strict null checks. If you set - strictNullChecks
    when running tsc (or set this flag in your tsconfig.json ), then types no longer
    permit **null** :


    **function** getId( x: Element) {


    **return** x.id ;


    }


    getId( **null** ); *// error: Argument of type ''null'' is not assignable to parameter
    of type ''Element''.*


    You must permit **null** values explicitly:


    **function** getId( x: Element| **null** ) {


    **return** x.id ; *// error TS2531: Object is possibly ''null''.*


    }


    getId( **null** );


    With a proper guard, the code type checks and runs correctly:


    **function** getId( x: Element| **null** ) {


    **if** ( x) {


    **return** x.id ; *// In this branch, x''s type is Element*


    } **else** {


    **return null** ; *// In this branch, x''s type is null.*


    }


    }


    getId( **null** );


    ### **Section 11.2: Non-null assertions**


    The non-null assertion operator, !, allows you to assert that an expression isn''t
    **null** or **undefined** when the TypeScript compiler can''t infer that automatically:


    type ListNode = { data: number; next?: ListNode; };


    **function** addNext( node: ListNode) {


    **if** ( node.next === **undefined** ) {


    node.next = { data: 0 };


    }


    }


    **function** setNextValue( node: ListNode, value: number) {


    addNext( node);


    *// Even though we know `node.next` is defined because we just called `addNext`,
    // TypeScript isn''t able to infer this in the line of code below:


    // node.next.data = value;


    // So, we can use the non-null assertion operator, !,


    // to assert that node.next isn''t undefined and silence the compiler warning*
    node.next ! .data = value;


    }


    ### **Chapter 12: User-defined Type Guards


    Section 12.1: Type guarding functions**


    You can declare functions that serve as type guards using any logic you''d like.


    They take the form:


    **function** functionName( variableName: any): variableName is DesiredType {


    *// body that returns boolean*


    }


    If the function returns true, TypeScript will narrow the type to DesiredType in
    any block guarded by a call to the function.


    For example (try it ):


    **function** isString( test: any): test is string {


    **return typeof** test === "string" ;


    }


    **function** example( foo: any) {


    **if** ( isString( foo)) {


    *// foo is type as a string in this block*


    console.log ( "it''s a string: " + foo);


    } **else** {


    *// foo is type any in this block*


    console.log ( "don''t know what this is! [" + foo + "]" );


    }


    }


    example( "hello world" ); *// prints "it''s a string: hello world"*


    example({ something: "else" }); *// prints "don''t know what this is! [[object
    Object]]"*


    A guard''s function type predicate (the foo is Bar in the function return type
    position) is used at compile time to narrow types, the function body is used at
    runtime. The type predicate and function must agree, or your code won''t work.


    Type guard functions don''t have to use **typeof** or **instanceof** , they can
    use more complicated logic.


    For example, this code determines if you''ve got a jQuery object by checking for
    its version string.


    **function** isJQuery( foo): foo is JQuery { *// test for jQuery''s version string*
    **return** foo.jquery !== **undefined** ;


    }


    **function** example( foo) {


    **if** ( isJQuery( foo)) {


    *// foo is typed JQuery here* foo.eq ( 0 );


    }


    }


    ### **Section 12.2: Using instanceof**


    **instanceof** requires that the variable is of type any.


    This code (try it ):


    class Pet { }


    class Dog extends Pet {


    bark() {


    console. log ( "woof" );


    }


    }


    class Cat extends Pet {


    purr () {


    console.log ( "meow" );


    }


    }


    **function** example( foo: any) {


    **if** ( foo **instanceof** Dog) {


    *// foo is type Dog in this block* foo.bark ();


    }


    **if** ( foo **instanceof** Cat) {


    *// foo is type Cat in this block* foo.purr ();


    }


    }


    example( **new** Dog()); example( **new** Cat());


    prints


    woof meow to the console.


    ### **Section 12.3: Using typeof**


    **typeof** is used when you need to distinguish between types number, string,
    boolean , and symbol. Other string constants will not error, but won''t be used
    to narrow types either.


    Unlike **instanceof** , **typeof** will work with a variable of any type. In the
    example below, foo could be typed as number | string without issue.


    This code (try it ):


    **function** example( foo: any) {


    **if** ( **typeof** foo === "number" ) { *// foo is type number in this block*
    console.log ( foo + 100 );


    }


    **if** ( **typeof** foo === "string" ) {


    *// foo is type string in this block* console.log ( "not a number: " + foo); }


    }


    example( 23 );


    example( "foo" );


    prints


    123


    not a number: foo


    ### **Chapter 13: TypeScript basic examples


    Section 13.1: 1 basic class inheritance example using extends and super keyword**


    A generic Car class has some car property and a description method


    class Car{


    name: string;


    engineCapacity: string;


    constructor ( name: string, engineCapacity: string){


    **this** .name = name;


    **this** .engineCapacity = engineCapacity;


    }


    describeCar (){


    console.log ( `${ **this** .name } car comes with ${ **this** .engineCapacity
    } displacement`);


    }


    }


    **new** Car( "maruti ciaz" , "1500cc" ) .describeCar ();


    HondaCar extends the existing generic car class and adds new property.


    class HondaCar extends Car{ seatingCapacity: number;


    constructor ( name: string, engineCapacity: string, seatingCapacity: number){
    super ( name, engineCapacity);


    **this** .seatingCapacity = seatingCapacity;


    }


    describeHondaCar (){


    super .describeCar ();


    console.log ( ` **this** cars comes with seating capacity of ${ **this** .seatingCapacity
    } `);


    }


    }


    **new** HondaCar( "honda jazz" , "1200cc" , 4 ) .describeHondaCar ();


    ### **Section 13.2: 2 static class variable example - count how many time method
    is being invoked**


    here countInstance is a static class variable


    class StaticTest{


    **static** countInstance : number= 0 ; constructor(){


    StaticTest.countInstance ++; }


    }


    **new** StaticTest();


    **new** StaticTest();


    console.log ( StaticTest.countInstance );


