    ### **Section 1.1: Installation and setup**


    **Background**


    TypeScript is a typed superset of JavaScript that compiles directly to JavaScript
    code. TypeScript files commonly use the .ts extension. Many IDEs support TypeScript
    without any other setup required, but TypeScript can also be compiled with the
    TypeScript Node.JS package from the command line.


    **IDEs


    Visual Studio**


    Visual Studio 2015 includes TypeScript.


    Visual Studio 2013 Update 2 or later includes TypeScript, or you can download
    TypeScript for earlier versions .


    **Visual Studio Code**


    Visual Studio Code (vscode) provides contextual autocomplete as well as refactoring
    and debugging tools for TypeScript. vscode is itself implemented in TypeScript.
    Available for Mac OS X, Windows and Linux.


    **WebStorm**


    WebStorm 2016.2 comes with TypeScript and a built-in compiler. [WebStorm is not
    free]


    **IntelliJ IDEA**


    IntelliJ IDEA 2016.2 has support for TypeScript and a compiler via a plugin maintained
    by the JetBrains team. [IntelliJ is not free]


    **Atom & atom-typescript**


    Atom supports TypeScript with the atom-typescript package.


    **Sublime Text**


    Sublime Text supports TypeScript with the TypeScript package.


    **Installing the command line interface Install Node.js


    Install the npm package globally**


    You can install TypeScript globally to have access to it from any directory.


    npm **install** -g typescript


    *or*


    **Install the npm package locally**


    You can install TypeScript locally and save to package.json to restrict to a directory.


    npm **install** typescript --save-dev **Installation channels**


    You can install from:


    Stable channel: npm **install** typescript Beta channel: npm **install** typescript**@**
    beta Dev channel: npm **install** typescript**@** next


    **Compiling TypeScript code**


    The tsc compilation command comes with typescript, which can be used to compile
    code.


    tsc my- code.ts


    This creates a my- code.js file.


    **Compile using tsconfig.json**


    You can also provide compilation options that travel with your code via a tsconfig.
    json file. To start a new TypeScript project, cd into your project''s root directory
    in a terminal window and run tsc - init. This command will generate a tsconfig.json
    file with minimal configuration options, similar to below.


    { "compilerOptions" : {


    "module" : "commonjs" , "target" : "es5" ,


    "noImplicitAny" : **false** , "sourceMap" : **false** , "pretty" : **true**


    },


    "exclude" : [


    "node_modules"


    ]


    }


    With a tsconfig.json file placed at the root of your TypeScript project, you can
    use the tsc command to run the compilation.


    ### **Section 1.2: Basic syntax**


    TypeScript is a typed superset of JavaScript, which means that all JavaScript
    code is valid TypeScript code. TypeScript adds a lot of new features on top of
    that.


    TypeScript makes JavaScript more like a strongly-typed, object-oriented language
    akin to C# and Java. This means that TypeScript code tends to be easier to use
    for large projects and that code tends to be easier to understand and maintain.
    The strong typing also means that the language can (and is) precompiled and that
    variables cannot be assigned values that are out of their declared range. For
    instance, when a TypeScript variable is declared as a number, you cannot assign
    a text value to it.


    This strong typing and object orientation makes TypeScript easier to debug and
    maintain, and those were two of the weakest points of standard JavaScript.


    **Type declarations**


    You can add type declarations to variables, function parameters and function return
    types. The type is written after a colon following the variable name, like this:
    **var** num: number = 5 ; The compiler will then check the types (where possible)
    during compilation and report type errors.


    **var** num: number = 5 ;


    num = "this is a string" ; *// error: Type ''string'' is not assignable to type
    ''number''.*


    The basic types are :


    number (both integers and floating point numbers)


    string


    boolean


    Array. You can specify the types of an array''s elements. There are two equivalent
    ways to define array types: Array< T> and T[] . For example:


    number[] - array of numbers


    Array< string> - array of strings


    Tuples. Tuples have a fixed number of elements with specific types.


    [ boolean , string] - tuple where the first element is a boolean and the second
    is a string. [ number, number, number] - tuple of three numbers.'
