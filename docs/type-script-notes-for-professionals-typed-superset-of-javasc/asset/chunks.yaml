    \ 将每个文件作为独立的模块（类似于'ts'）。 */\n\n    /* Strict Type-Checking Options */\n    \"\
    strict\" : true /* 所有严格检查选项。 */\n    \"noImplicitAny\" : true, /* 对隐含 'any' 类型的表达式和声明报错。\
