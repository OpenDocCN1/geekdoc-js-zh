    ## 第 27.3 节：TSLint 规则集\n\ntslint-microsoft-contrib\n\ntslint-eslint-rules\n\n\
    codelyzer\n\nYeoman 生成器支持所有这些预设并也可以扩展：`generator-tslint`\n\n## 第 27.4 节：基础 tslint.json\
