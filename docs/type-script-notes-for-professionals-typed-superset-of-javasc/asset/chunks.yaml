    function getId( x: Element| null ) {\n  return x.id ; // 错误 TS2531: 对象可能为 'null'。\n\
    }\n```\n\n`getId( null );`\n\n通过适当的守卫，代码类型检查和运行将正常：\n\n```typescript\nfunction\
    \ getId( x: Element| null ) {\n  if ( x) {\n    return x.id ; // 在此分支中，x 的类型是\
    \ Element\n  } else {\n    return null ; // 在此分支中，x 的类型是 null。\n  }\n}\n```\n\n\
    `getId( null );`\n\n#### 第 11.2 节：非空断言\n\n非空断言运算符 `!` 允许你在 TypeScript 编译器无法自动推断时，断言某个表达式不为\
    \ `null` 或 `undefined`：\n\n```typescript\ntype ListNode = { data: number; next?:\
    \ ListNode; };\n```\n\n```typescript\nfunction addNext( node: ListNode) {\n  if\
    \ ( node.next === undefined ) {\n    node.next = { data: 0 };\n  }\n}\n```\n\n\
    ```typescript\nfunction setNextValue( node: ListNode, value: number) {\n  addNext(\
    \ node);\n  // 尽管我们知道 `node.next` 是定义的，因为我们刚刚调用了 `addNext`，\n  // TypeScript 无法在下面的代码行中推断这一点：\n\
    \  // node.next.data = value;\n  // 所以，我们可以使用非空断言运算符 !，\n  // 来断言 node.next 不是\
    \ undefined 并消除编译器警告\n  node.next ! .data = value;\n}\n```\n\n### 第 12 章：用户自定义类型守卫\n\
    \n#### 第 12.1 节：类型守卫函数\n\n你可以使用任何喜欢的逻辑来声明作为类型守卫的函数。\n\n它们的形式如下：\n\n```typescript\n\
    function functionName( variableName: any): variableName is DesiredType {\n  //\
    \ 返回布尔值的体\n}\n```\n\n如果函数返回 true，TypeScript 将在任何由函数调用守卫的块中将类型缩小为 `DesiredType`。\n\
    \n例如（尝试一下）：\n\n```typescript\nfunction isString( test: any): test is string {\n\
    \  return typeof test === \"string\" ;\n}\n```\n\n```typescript\nfunction example(\
    \ foo: any) {\n  if ( isString( foo)) {\n    // 在此块中，foo 的类型为 string\n    console.log\
    \ ( \"it's a string: \" + foo);\n  } else {\n    // 在此块中，foo 的类型为 any\n    console.log\
    \ ( \"don't know what this is! [\" + foo + \"]\" );\n  }\n}\n```\n\n`example(\
    \ \"hello world\" );` // 输出 \"it's a string: hello world\"\n\n`example({ something:\
    \ \"else\" });` // 输出 \"don't know what this is! [[object Object]]\"\n\n类型谓词（返回类型位置中的\
    \ `foo is Bar`）在编译时用于缩小类型，而函数体在运行时使用。类型谓词和函数必须一致，否则你的代码将无法工作。\n\n类型守卫函数不一定使用 `typeof`\
    \ 或 `instanceof`，可以使用更复杂的逻辑。\n\n例如，此代码通过检查版本字符串来确定你是否拥有一个 jQuery 对象。\n\n```typescript\n\
    function isJQuery( foo): foo is JQuery { \n  // 测试 jquery 的版本字符串\n  return foo\
    \ !== undefined;\n}\n```\n\n```typescript\nfunction example( foo) {\n  if ( isJQuery(\
    \ foo)) {\n    // ...\n  }\n}\n```\n\n#### 第 12.2 节：使用 instanceof\n\n`instanceof`\
    \ 要求变量是特定类的实例。\n\n示例：\n\n```typescript\nclass Pet { }\nclass Dog extends Pet {\n\
    \  bark() { }\n}\nclass Cat extends Pet {\n  purr() { }\n}\n```\n\n用法：\n\n```typescript\n\
    function example(foo: any) {\n  if (foo instanceof Dog) {\n    // ...\n  } else\
    \ if (foo instanceof Cat) {\n    // ...\n  }\n}\n```\n\n#### 第 12.3 节：使用 typeof\n\
    \n`typeof` 用于区分 `number`、`string`、`boolean`, `symbol`。与 `instanceof` 不同，它作用于原始类型。\n\
    \n```typescript\nfunction example(foo: any) {\n  if (typeof foo === \"number\"\
    ) {\n    // ...\n  } else if (typeof foo === \"string\") {\n    // ...\n  }\n\
    }\n```\n\n### 第 13 章：TypeScript 基础示例\n\n#### 第 13.1 节：使用 super 关键字的类继承示例\n\n通用\
    \ Car 类有一些属性和一个描述方法。\n\n```typescript\nclass Car {\n  name: string;\n  engineCapacity:\
    \ string;\n\n  constructor(name: string, engineCapacity: string) {\n    this.name\
    \ = name;\n    this.engineCapacity = engineCapacity;\n  }\n\n  describeCar() {\n\
    \    console.log(`${this.name} car comes with ${this.engineCapacity} displacement`);\n\
    \  }\n}\n```\n\n`HondaCar` 继承了现有的通用类并增加了新属性。\n\n```typescript\nclass HondaCar\
    \ extends Car {\n  seatingCapacity: number;\n\n  constructor(name: string, engineCapacity:\
    \ string, seatingCapacity: number) {\n    super(name, engineCapacity);\n    this.seatingCapacity\
    \ = seatingCapacity;\n  }\n\n  describeHondaCar() {\n    super.describeCar();\n\
    \    console.log(`${this.name} cars comes with seating capacity of ${this.seatingCapacity}`);\n\
    \  }\n}\n```\n\n#### 第 13.2 节：静态类变量示例 - 计算方法被调用的次数\n\n这里 `countInstance` 是一个静态类变量。\n\
    \n```typescript\nclass StaticTest {\n  static countInstance: number = 0;\n  constructor()\
    \ {\n    StaticTest.countInstance++;\n  }\n}\n```\n\n`new StaticTest();`\n\n`new\
    \ StaticTest();`\n\n`console.log(StaticTest.countInstance);`\n\n### 第 14 章：导入外部库\n\
    \n#### 第 14.1 节：查找定义文件\n\n对于 typescript 2.x：\n\n来自 DefinitelyTyped 的定义通过 `@types`\
    \ npm 包可用：\n\n```bash\nnpm i --save lodash\nnpm i --save-dev @types/lodash\n```\n\
    \n但，如果你想从其他仓库使用类型，可以使用旧方法：\n\n对于 typescript 1.x：\n\nTypings 是一个可以自动将类型定义文件安装到本地项目的\
    \ npm 包。我建议你阅读快速入门 .\n\n```bash\nnpm install -global typings\n```\n\n"
