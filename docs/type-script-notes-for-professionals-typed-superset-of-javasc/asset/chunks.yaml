    \ 的带类型超集，可以直接编译为 JavaScript 代码。TypeScript 文件通常使用 `.ts` 扩展名。许多 IDE 无需任何额外配置即可支持\
    \ TypeScript，但也可以通过命令行使用 TypeScript Node.JS 软件包进行编译。\n\n```json\n{\n  \"compilerOptions\"\
    : {\n    \"module\": \"commonjs\",\n    \"target\": \"es5\",\n    \"noImplicitAny\"\
    : false,\n    \"sourceMap\": false,\n    \"pretty\": true\n  },\n  \"exclude\"\
    : [\n    \"node_modules\"\n  ]\n}\n```\n\n### 第 1.2 节：基础语法\n\nTypeScript 是 JavaScript\
    \ 的带类型超集，这意味着所有的 JavaScript 代码都是有效的 TypeScript。TypeScript 在此基础上增加了许多新功能。\n\nTypeScript\
    \ 让 JavaScript 变得像 C# 和 Java 那种强类型面向对象的语言。这意味着 TypeScript 代码在大型项目中更容易使用，也更容易理解和维护。强类型意味着语言可以（并且已经）编译，且变量不能赋值超出范围的值。例如，当\
    \ TypeScript 变量声明为数字时，你不能给它赋值文本值。\n\n#### 类型声明\n\n你可以为变量、函数参数和函数返回值添加类型声明。类型写在变量名后面的冒号之后，例如`var\
    \ num: number = 5;`。编译器将在编译时（尽可能）检查类型并报告类型错误。\n\n```typescript\nvar num: number\
    \ = 5;\nnum = \"this is a string\"; // 错误：类型 'string' 不赋值给类型 'number'\n```\n\n\
    基本类型有：\n\n- number（整数和浮点数）\n- string\n- boolean\n\n#### 数组\n\n你可以指定数组元素的类型。定义数组类型有两种等效方式：`Array<T>`和`T[]`。例如：\n\
    \n- `number[]` - 数字数组\n- `Array<string>` - 字符串数组\n\n#### 元组\n\n元组具有固定数量且类型特定的元素。\n\
    \n- `[boolean, string]` - 第一个元素为布尔值、第二个元素为字符串的元组\n- `[number, number, number]`\
    \ - 三个数字的元组\n\n"
- fmt: "\n- `{}` - object, you can define its properties or indexer\n- `{ name: string,\
    \ age: number}` - object with name and age attributes\n- `{[ key: string]: number}`\
    \ - a dictionary of numbers indexed by string\n- `enum` - `{ Red = 0 , Blue, Green\
    \ }` - enumeration mapped to numbers\n\n### Function\nYou specify types for the\
    \ parameters and return value:\n\n- `( param: number) => string` - function taking\
    \ one number parameter returning string\n- `() => number` - function with no parameters\
    \ returning an number.\n- `( a: string, b?: boolean ) => void` - function taking\
    \ a string and optionally a boolean with no return value.\n- `any` - Permits any\
    \ type. Expressions involving `any` are not type checked.\n- `void` - represents\
    \ \"nothing\", can be used as a function return value. Only `null` and `undefined`\
    \ are part of the `void` type.\n- `never`: `let foo: never;` - As the type of\
    \ variables under type guards that are never true.\n- `function error( message:\
    \ string): never { throw new Error( message); }` - As the return type of functions\
    \ that never return.\n- `null` - type for the value `null`. `null` is implicitly\
    \ part of every type, unless strict null checks are enabled.\n\n### Casting\n\
    You can perform explicit casting through angle brackets, for instance:\n\n```typescript\n\
    var derived: MyInterface;\n(< ImplementingClass> derived) .someSpecificMethod\
    \ ();\n```\n\nThis example shows a derived class which is treated by the compiler\
    \ as a `MyInterface`. Without the casting on the second line the compiler would\
    \ throw an exception as it does not understand `someSpecificMethod()`, but casting\
    \ through `<ImplementingClass>` `derived` suggests the compiler what to do.\n\n\
    Another way of casting in TypeScript is using the `as` keyword:\n\n```typescript\n\
    var derived: MyInterface;\n( derived as ImplementingClass) .someSpecificMethod\
    \ ();\n```\n\nSince TypeScript 1.6, the default is using the `as` keyword, because\
    \ using `< >` is ambiguous in `.jsx` files. This is mentioned in TypeScript official\
    \ documentation.\n\n---\n\n### Classes\nClasses can be defined and used in TypeScript\
    \ code. To learn more about classes, see the Classes documentation page.\n\n####\
    \ Section 1.3: Hello World\n```typescript\nclass Greeter {\n  greeting: string;\n\
    \  constructor ( message: string) {\n    this .greeting = message;\n  }\n  greet():\
    \ string {\n    return this .greeting ;\n  }\n};\n\nlet greeter = new Greeter(\
    \ \"Hello, world!\" ); console.log ( greeter.greet ());\n```\nHere we have a class,\
    \ `Greeter`, that has a constructor and a `greet` method. We can construct an\
    \ instance of the class using the `new` keyword and pass in a string we want the\
    \ greet method to output to the console. The instance of our `Greeter` class is\
    \ stored in the `greeter` variable which we then us to call the greet method.\n\
    \n#### Section 1.4: Running TypeScript using ts-node\n`ts-node` is an npm package\
    \ which allows the user to run typescript files directly, without the need for\
    \ precompilation using `tsc`. It also provides REPL.\n\nInstall `ts-node` globally\
    \ using:\n```bash\nnpm install -g ts-node\n```\n`ts-node` does not bundle typescript\
    \ compiler, so you might need to install it:\n```bash\nnpm install -g typescript\n\
    ```\n\n**Executing script**\nTo execute a script named `main.ts`, run:\n```bash\n\
    ts- node main.ts\n```\n```typescript\n// main.ts\nconsole.log ( \"Hello world\"\
    \ );\n```\nExample usage:\n```bash\n$ ts- node main.ts\nHello world\n```\n\n**Running\
    \ REPL**\nTo run REPL run command `ts- node`\nExample usage:\n```bash\n$ ts -\
    \ node\n> const sum = ( a, b): number => a + b;\nundefined\n> sum( 2 , 2 )\n4\n\
    > .exit\n```\nTo exit REPL use command `.exit` or press CTRL+ C twice.\n\n####\
    \ Section 1.5: TypeScript REPL in Node.js\nFor use TypeScript REPL in Node.js\
    \ you can use `tsun` package.\nInstall it globally with:\n```bash\nnpm install\
    \ -g tsun\n```\nand run in your terminal or command prompt with `tsun` command.\n\
    Usage example:\n```bash\n$ tsun\nTSUN : TypeScript Upgraded Node\ntype in TypeScript\
    \ expression to evaluate type : help for commands in repl\n$ function multiply(\
    \ x, y) {\n  return x * y;\n}\nundefined\n$ multiply( 3 , 4 )\n12\n```\n\n---\n\
    \n### Chapter 2: Why and when to use TypeScript\nIf you find the arguments for\
    \ type systems persuasive in general, then you'll be happy with TypeScript.\n\
    It brings many of the advantages of type system (safety, readability, improved\
    \ tooling) to the JavaScript ecosystem. It also suffers from some of the drawbacks\
    \ of type systems (added complexity and incompleteness).\n\n#### Section 2.1:\
    \ Safety\nTypeScript catches type errors early through static analysis:\n```typescript\n\
    function double ( x: number): number {\n  return 2 * x;\n}\ndouble ( '2' );\n\
    // ~~~ Argument of type '\"2\"' is not assignable to parameter of type 'number'.\n\
    ```\n\n#### Section 2.2: Readability\nTypeScript enables editors to provide contextual\
    \ documentation:\n![](Image00001.jpg) You'll never forget whether `String.prototype.slice`\
    \ takes `(start, stop)` or `(start, length)` again!\n\n#### Section 2.3: Tooling\n\
    TypeScript allows editors to perform automated refactors which are aware of the\
    \ rules of the languages.\n![](Image00002.gif) Here, for instance, Visual Studio\
    \ Code is able to rename references.\n\n---\n\n### Chapter 3: TypeScript Core\
    \ Types\n\n#### Section 3.1 String Literal Types\nString literal types allow you\
    \ to specify the exact value a string can have.\n```typescript\nlet myFavoritePet:\
    \ \"dog\";\nmyFavoritePet = \"cat\"; // Error: Type '\"cat\"' is not assignable\
    \ to type '\"dog\"'.\n```\nTogether with Aliases and Union Types you get enum-like\
    \ behavior:\n```typescript\ntype Species = \"cat\" | \"dog\" | \"bird\";\n```\n\
    String Literal Types can be used to distinguish overloads:\n```typescript\nfunction\
    \ buyPet(pet: \"cat\", name: string): Cat;\nfunction buyPet(pet: \"dog\", name:\
    \ string): Dog;\nfunction buyPet(pet: \"bird\", name: string): Bird;\n```\n\n\
    #### User-Defined Type Guards\nThey works well for User-Defined Type Guards.\n\
    ```typescript\ninterface Pet {\n  species: Species;\n  eat();\n  sleep();\n}\n\
    \ninterface Cat extends Pet {\n  species: \"cat\";\n}\n\ninterface Bird extends\
    \ Pet {\n  species: \"bird\";\n  sing();\n}\n\nfunction petIsCat(pet: Pet): pet\
    \ is Cat {\n  return pet.species === \"cat\";\n}\n\nfunction petIsBird(pet: Pet):\
    \ pet is Bird {\n  return pet.species === \"bird\";\n}\n\nfunction playWithPet(pet:\
    \ Pet) {\n  if (petIsCat(pet)) {\n    // pet is now from type Cat (pet: Cat)\n\
    \    pet.eat();\n    pet.sleep();\n  } else if (petIsBird(pet)) {\n    // pet\
    \ is now from type Bird (pet: Bird)\n    pet.eat();\n    pet.sing();\n    pet.sleep();\n\
    \  }\n}\n```\n\n#### Full example code\n```typescript\nlet myFavoritePet: \"dog\"\
    ;\nmyFavoritePet = \"rock\"; // Error: Type '\"rock\"' is not assignable to type\
    \ '\"dog\"'.\n\ntype Species = \"cat\" | \"dog\" | \"bird\";\n\ninterface Pet\
    \ {\n  species: Species;\n  name: string;\n  eat();\n  sleep();\n}\n\ninterface\
    \ Cat extends Pet {\n  species: \"cat\";\n}\n\ninterface Dog extends Pet {\n \
    \ species: \"dog\";\n}\n\ninterface Bird extends Pet {\n  species: \"bird\";\n\
    \  sing();\n}\n\n// Error: Interface 'Rock' incorrectly extends interface 'Pet'.\
    \ Types of property 'species' are incompatible. Type '\"rock\"' is not assignable\
    \ to type '\"cat\" | \"dog\" | \"bird\"'. Type '\"rock\"' is not assignable to\
    \ type '\"bird\"'.\n```\n"
