    \ a `tsconfig.json` like this:\n\n```json\n{\n  \"compilerOptions\" : {\n    \"\
    module\" : \"commonjs\" , \"target\" : \"es5\" ,\n    \"noImplicitAny\" : false\
    \ , \"sourceMap\" : false\n  }\n}\n```\n\n### Section 28.2: Configuration for\
    \ fewer programming errors\n\nThere are very good configurations to force typings\
    \ and get more helpful errors which are not activated by default.\n\n```json\n\
    {\n  \"compilerOptions\" : {\n    \"alwaysStrict\" : true , // Parse in strict\
    \ mode and emit \"use strict\" for each source file.\n    // If you have wrong\
    \ casing in referenced files e.g. the filename is Global.ts and you have a ///\
    \ <reference path=\"global.ts\" /> to reference this file, then this can cause\
    \ to unexpected errors. Visite: http://stackoverflow.com/questions/36628612/typescript-transpiler-casing-issue\n\
    \    \"forceConsistentCasingInFileNames\" : true, // Disallow inconsistently-cased\
    \ references to the same file.\n    // \"allowUnreachableCode\": false, // Do\
    \ not report errors on unreachable code. (Default: False) // \"allowUnusedLabels\"\
    : false, // Do not report errors on unused labels. (Default: False)\n    \"noFallthroughCasesInSwitch\"\
    \ : true, // Report errors for fall through cases in switch statement.\n    \"\
    noImplicitReturns\" : true, // Report error when not all code paths in function\
    \ return a value.\n    \"noUnusedParameters\" : true, // Report errors on unused\
    \ parameters.\n    \"noUnusedLocals\" : true, // Report errors on unused locals.\n\
    \    \"noImplicitAny\" : true, // Raise error on expressions and declarations\
    \ with an implied \"any\" type.\n    \"noImplicitThis\" : true, // Raise error\
    \ on this expressions with an implied \"any\" type.\n    \"strictNullChecks\"\
    \ : true, // The null and undefined values are not in the domain of every type\
    \ and are only assignable to themselves and any.\n    // To enforce this rules,\
    \ add this configuration.\n    \"noEmitOnError\" : true // Do not emit outputs\
    \ if any errors were reported.\n  }\n}\n```\n\nNot enough? If you are a hard coder\
    \ and want more, then you may be interested to check your TypeScript files with\
    \ tslint before compiling it with `tsc`. Check how to configure tslint for even\
    \ stricter code.\n\n### Section 28.3: compileOnSave\n\nSetting a top-level property\
    \ `compileOnSave` signals to the IDE to generate all files for a given `tsconfig.json`\
    \ upon saving.\n\n```json\n{\n  \"compileOnSave\" : true ,\n  \"compilerOptions\"\
    \ : {\n    ...\n  },\n  \"exclude\" : [\n    ...\n  ]\n}\n```\n\nThis feature\
    \ is available since TypeScript 1.8.4 and onward, but needs to be directly supported\
    \ by IDE's. Currently, examples of supported IDE's are:\n\n- Visual Studio 2015\
    \ with Update 3\n- JetBrains WebStorm\n- Atom with atom-typescript\n\n### Section\
    \ 28.4: Comments\n\nA `tsconfig.json` file can contain both line and block comments,\
    \ using the same rules as ECMAScript.\n\n```javascript\n//Leading comment\n{\n\
    \  \"compilerOptions\" : {\n    //this is a line comment\n    \"module\" : \"\
    commonjs\" , //eol line comment\n    \"target\" /*inline block*/ : \"es5\" , /*\
    \ This is a block comment */\n  }\n}\n/* trailing comment */\n```\n\n### Section\
    \ 28.5: preserveConstEnums\n\nTypeScript supports constant enumerables, declared\
    \ through `const` enum.\n\nThis is usually just syntax sugar as the constant enums\
    \ are inlined in compiled JavaScript.\n\nFor instance the following code\n\n```typescript\n\
    const enum Tristate {\n  True,\n  False,\n  Unknown\n}\n\nvar something = Tristate.True\
    \ ;\n```\n\ncompiles to\n\n```javascript\nvar something = 0 ;\n```\n\nAlthough\
    \ the performance benefit from inlining, you may prefer to keep enums even if\
    \ constant (ie: you may wish readability on development code), to do this you\
    \ have to set in `tsconfig.json` the `preserveConstEnums` clause into the `compilerOptions`\
    \ to `true`.\n\n```json\n{ \n  \"compilerOptions\" : {\n    \"preserveConstEnums\"\
    \ = true , ...\n  },\n  \"exclude\" : [\n    ...\n  ]\n}\n```\n\nBy this way the\
    \ previous example would be compiled as any other enums, as shown in following\
    \ snippet.\n\n```javascript\nvar Tristate;\n( function ( Tristate) {\n  Tristate[\
    \ Tristate[ \"True\" ] = 0 ] = \"True\" ; Tristate[ Tristate[ \"False\" ] = 1\
    \ ] = \"False\" ; Tristate[ Tristate[ \"Unknown\" ] = 2 ] = \"Unknown\" ;\n})(\
    \ Tristate || ( Tristate = {}));\nvar something = Tristate.True\n```\n\n### Chapter\
    \ 29: Debugging\n\nThere are two ways of running and debugging TypeScript:\n\n\
    1. **Transpile to JavaScript**, run in node and use mappings to link back to the\
    \ TypeScript source files\n2. **Run TypeScript directly** using `ts-node`\n\n\
    This article describes both ways using Visual Studio Code and WebStorm. All examples\
    \ presume that your main file is `index.ts`.\n\n### Section 29.1: TypeScript with\
    \ ts-node in WebStorm\n\nAdd this script to your `package.json`:\n\n```json\n\
    {\n  \"scripts\": {\n    \"start\": \"ts-node index.ts\"\n  }\n}\n```\n\n### Section\
    \ 29.2: TypeScript with ts-node in VS Code\n\nAdd this script to your `package.json`:\n\
    \n```json\n{\n  \"scripts\": {\n    \"start\": \"ts-node index.ts\"\n  }\n}\n\
    ```\n\n### Section 29.3: TypeScript with ts-node in WebStorm\n\n### Section 29.4:\
    \ JavaScript with SourceMaps in WebStorm\n\n### Chapter 30: Unit Testing\n\n####\
    \ Section 30.1: tape\n\ntape is minimalistic JavaScript framework, it outputs\
    \ TAP-compliant markup.\n\nTo install tape using npm run command:\n\n`npm install\
    \ --save-dev tape @types/** tape`\n\nTo use tape with TypeScript you need to install\
    \ ts-node as global package, to do this run:\n\n`npm install -g ts-node`\n\nNow\
    \ you are ready to write your first test:\n\n```typescript\nimport * as test from\
    \ \"tape\" ;\n\ntest ( \"Math\" , ( t) => {\n  t.equal ( 4 , 2 + 2 );\n  t.true\
    \ ( 5 > 2 + 2 );\n  t.end ();\n});\n```\n\nTo execute test run command:\n\n`ts-node\
    \ node_modules/ tape/ bin/ tape math.test.ts`\n\nIn output you should see:\n\n\
    ```text\nTAP version 13\n# Math test\nok 1 should be equal ok 2 should be truthy\n\
    1..2\n# tests 2 # pass 2\n# ok\n```\n\nGood job, you just ran your TypeScript\
    \ test.\n\n**Run multiple test files**\n\nYou can run multiple test files at once\
    \ using path wildcards. To execute all TypeScript tests in tests directory run\
    \ command:\n\n`ts-node node_modules/ tape/ bin/ tape tests/**/*.ts`\n\n#### Section\
    \ 30.2: jest (ts-jest)\n\njest is painless JavaScript testing framework by Facebook,\
    \ with ts-jest can be used to test TypeScript code.\n\nTo install jest using npm\
    \ run command:\n\n`npm install --save-dev jest @types/** jest ts-jest typescript`\n\
    \nFor ease of use install jest as global package:\n\n`npm install -g jest`\n\n\
    To make jest work with TypeScript you need to add configuration to `package.json`:\n\
    \n```json\n{\n  \"jest\": {\n    \"transform\": {\n      \"^.+\\\\\\.ts$\": \"\
    ts-jest\"\n    }\n  }\n}\n```\n"
