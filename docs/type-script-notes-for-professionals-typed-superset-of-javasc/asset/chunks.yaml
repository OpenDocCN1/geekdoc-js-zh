    });


    Our State class is typed as IStatus< Code> . In this way, we are able to pass
    more complex type to our emit method. As you can see, generic interfaces can be
    a very useful tool for statically typed code.


    ### **Section 9.5: Add functions or properties to an existing interface**


    Let''s suppose we have a reference to the JQuery type definition and we want to
    extend it to have additional functions from a plugin we included and which doesn''t
    have an official type definition. We can easily extend it by declaring functions
    added by plugin in a separate interface declaration with the same JQuery name:


    interface JQuery {


    pluginFunctionThatDoesNothing(): **void** ;


    *// create chainable function*


    manipulateDOM( HTMLElement): JQuery; }


    The compiler will merge all declarations with the same name into one - see declaration
    merging for more details.


    ### **Section 9.6: Implicit Implementation And Object Shape**


    TypeScript supports interfaces, but the compiler outputs JavaScript, which doesn''t.
    Therefore, interfaces are effectively lost in the compile step. This is why type
    checking on interfaces relies on the *shape* of the object meaning whether the
    object supports the fields and functions on the interface - and not on whether
    the interface is actually implemented or not.


    interface IKickable {


    kick( distance: number): **void** ;


    }


