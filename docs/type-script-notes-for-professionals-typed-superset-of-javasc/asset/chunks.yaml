    ### **Section 15.2: Re-export**


    TypeScript allow to re-export declarations.


    *//Operator.ts*


    interface Operator {


    eval( a: number, b: number): number; }


    export **default** Operator;


    *//Add.ts*


    import Operator from "./Operator" ; export class Add implements Operator {


    eval ( a: number, b: number): number { **return** a + b;


    }


    }


    *//Mul.ts*


    import Operator from "./Operator" ; export class Mul implements Operator {


    eval ( a: number, b: number): number { **return** a * b;


    }


    }


    You can bundle all operations in single library


    *//Operators.ts*


    import { Add} from "./Add" ; import { Mul} from "./Mul" ;


