    \ number) => string` - 接收一个数字参数并返回字符串的函数\n- `() => number` - 无参数返回数字的函数\n- `(\
    \ a: string, b?: boolean ) => void` - 接收一个字符串和一个可选布尔值且没有返回值的函数\n- `any` - 允许任何类型。涉及\
    \ `any` 的表达式不会进行类型检查。\n- `void` - 表示“无”，可以用作函数的返回值。只有 `null` 和 `undefined` 是 `void`\
    \ 类型的一部分。\n- `never`: `let foo: never;` - 用于类型守卫下永远为假的变量的类型。\n- `function error(\
    \ message: string): never { throw new Error( message); }` - 作为永不返回的返回类型。\n- `null`\
    \ - 值 `null` 的类型。除非启用了严格空检查，否则 `null` 隐式是每个类型的一部分。\n\n### Casting\n你可以通过角括号执行显式转换，例如：\n\
    \n```typescript\nvar derived: MyInterface;\n(< ImplementingClass> derived) .someSpecificMethod\
    \ ();\n```\n\n此示例显示了一个派生类，它被编译器视为 `MyInterface`。如果没有第二行的转换，编译器将抛出异常，因为它不理解 `someSpecificMethod()`，但通过\
    \ `<ImplementingClass>` 对 `derived` 进行转换告诉了编译器该做什么。\n\nTypeScript 中另一种类型转换方法是使用\
    \ `as` 关键字：\n\n```typescript\nvar derived: MyInterface;\n( derived as ImplementingClass)\
    \ .someSpecificMethod ();\n```\n\n从 TypeScript 1.6 开始，默认使用 `as` 关键字，因为在 `.jsx`\
    \ 文件中使用 `< >` 具有歧义。这在 TypeScript 官方文档中有所提到。\n\n---\n\n### Classes\n可以在 TypeScript\
    \ 代码中定义和使用类。要了解更多关于类，请参见类的文档页面。\n\n#### Section 1.3: Hello World\n```typescript\n\
    class Greeter {\n  greeting: string;\n  constructor ( message: string) {\n   \
    \ this .greeting = message;\n  }\n  greet(): string {\n    return this .greeting\
    \ ;\n  }\n};\n\nlet greeter = new Greeter( \"Hello, world!\" ); console.log (\
    \ greeter.greet ());\n```\n在这里我们有一个类 `Greeter`，它有一个构造函数和一个 `greet` 方法。我们可以使用 `new`\
    \ 关键字构造类的实例，并传入我们希望 `greet` 方法在控制台输出的字符串。我们的 `Greeter` 类实例存储在变量 `greeter` 中，然后我们使用它来调用\
    \ `greet` 方法。\n\n#### Section 1.4: 使用 ts-node 运行 TypeScript\n`ts-node` 是一个 npm\
    \ 包，允许用户直接运行 typescript 文件，而无需使用 `tsc` 预编译。它还提供了 REPL。\n\n使用以下命令全局安装 `ts-node`：\n\
    ```bash\nnpm install -g ts-node\n```\n`ts-node` 不包含 typescript 编译器，所以你可能需要安装它：\n\
    ```bash\nnpm install -g typescript\n```\n\n**执行脚本**\n要执行名为 `main.ts` 的脚本，运行：\n\
    ```bash\nts- node main.ts\n```\n```typescript\n// main.ts\nconsole.log ( \"Hello\
    \ world\" );\n```\n示例用法：\n```bash\n$ ts- node main.ts\nHello world\n```\n\n**运行\
    \ REPL**\n运行命令 `ts- node` 来运行 REPL\n示例用法：\n```bash\n$ ts - node\n> const sum =\
    \ ( a, b): number => a + b;\nundefined\n> sum( 2 , 2 )\n4\n> .exit\n```\n退出 REPL\
    \ 使用命令 `.exit` 或按两次 CTRL+ C。\n\n#### Section 1.5: Node.js 中的 TypeScript REPL\n\
    为了在 Node.js 中使用 TypeScript REPL，你可以使用 `tsun` 包。\n全局全局安装它：\n```bash\nnpm install\
    \ -g tsun\n```\n并在你的终端或命令提示符中使用 `tsun` 命令运行。\n用法示例：\n```bash\n$ tsun\nTSUN : TypeScript\
    \ Upgraded Node\n输入 TypeScript 表达式以求值类型：输入 help 查看 repl 中的命令\n$ function multiply(\
    \ x, y) {\n  return x * y;\n}\nundefined\n$ multiply( 3 , 4 )\n12\n```\n\n---\n\
    \n### Chapter 2: 为什么以及何时使用 TypeScript\n如果你发现发现类型系统的论点通常很有说服力，那么你会喜欢 TypeScript。\n\
    它为 JavaScript 生态系统带来了类型系统的许多优势（安全性、可读性、改进的工具）。它也存在类型系统的一些缺点（增加复杂性和不完整性）。\n\n####\
    \ Section 2.1: 安全性\nTypeScript 通过静态分析早期捕捉类型错误：\n```typescript\nfunction double\
    \ ( x: number): number {\n  return 2 * x;\n}\ndouble ( '2' );\n// ~~~ 类型为 '\"\
    2\"' 的参数不可给类型为 'number' 的参数。\n```\n\n#### Section 2.2: 可读性\nTypeScript 使编辑器提供上下文文档：\n\
    ![](img/Image00001.jpg) 你永远不会忘记 `String.prototype.slice` 接收的是 `(start, stop)`\
    \ 还是...\n\n#### Section 2.3: 工具支持\nTypeScript 允许编辑器执行感知的重构：\n![](img/Image00002.jpg)\
    \ 在这里，例如 Visual Studio Code 能够重命名。\n\n### Chapter 3: TypeScript 核心类型\n\n#### Section\
    \ 3.1 字符串字面量类型\n字符串字面量类型允许你指定字符串可以拥有的精确值。\n```typescript\nlet myFavoritePet: \"\
    dog\";\nmyFavoritePet = \"cat\"; // 错误：类型 '\"cat\"' 不赋值 '\"dog\"。\n```\n结合别名和联合类型，你可以获得类似枚举的行为：\n\
    ```typescript\ntype Species = \"cat\" | \"dog\" | \"bird\";\n```\n字符串字面量类型可以用于区分重载：\n\
    ```typescript\nfunction buyPet(pet: \"cat\", name: string): Cat;\nfunction buyPet(pet:\
    \ \"dog\", name: string): Dog;\nfunction buyPet(pet: \"bird\", name: string):\
    \ Bird;\n```\n\n#### 自定义类型守卫\n它们对于自定义类型守卫效果良好。\n```typescript\ninterface Pet {\n\
    \  species: Species;\n  eat();\n  sleep();\n}\n\ninterface Cat extends Pet {\n\
    \  species: \"cat\";\n}\n\ninterface Bird extends Pet {\n  species: \"bird\";\n\
    \  sing();\n}\n\nfunction petIsCat(pet: Pet): pet is Cat {\n  return pet.species\
    \ === \"cat\";\n}\n\nfunction petIsBird(pet: Pet): pet is Bird {\n  return pet.species\
    \ === \"bird\";\n}\n\nfunction playWithPet(pet: Pet) {\n  if (petIsCat(pet)) {\n\
    \    // pet 现在是类型 Cat (pet: Cat)\n    pet.eat();\n    pet.sleep();\n  } else if\
    \ (petIsBird(pet)) {\n    // pet 现在是类型 Bird (pet: Bird)\n    pet.eat();\n    pet.sing();\n\
    \    pet.sleep();\n  }\n}\n```\n\n#### 完整示例代码\n```typescript\nlet myFavoritePet:\
    \ \"dog\";\nmyFavoritePet = \"rock\"; // 错误：类型 '\"rock\"' 不赋值 '\"dog\"。\n\ntype\
    \ Species = \"cat\" | \"dog\" | \"bird\";\n\ninterface Pet {\n  species: Species;\n\
    \  name: string;\n  eat();\n  sleep();\n}\n\ninterface Cat extends Pet {\n  species:\
    \ \"cat\";\n}\n\ninterface Dog extends Pet {\n  species: \"dog\";\n}\n\ninterface\
    \ Bird extends Pet {\n  species: \"bird\";\n  sing();\n}\n\n// 错误：接口 'Rock' 错误地扩展了接口\
    \ 'Pet'。属性 'species' 的类型不兼容。类型 '\"rock\"' 不赋值 '\"cat\" | \"dog\" | \"bird\"'。类型\
    \ '\"rock\"' 不赋值 '\"bird\"'。\n```\n"
