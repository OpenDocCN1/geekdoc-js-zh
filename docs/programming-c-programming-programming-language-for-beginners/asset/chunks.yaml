    # Chapter 7: Control Flow Introduction


    Execution of the program code, it starts from the `main` function and terminates
    at the end of the code, which is usually the end of main function. The statements
    that are executed in sequence are nothing but the part of the program. Most of
    the programs, which we have learned until now are simple straight line programs.
    These programs have a steady and sequential flow.


