    \ in C++. For multithreading, it completely relies upon the OS.\n\n## Creating\
    \ Threads\n\nFor creating a POSIX thread, we will use the following routine.\n\
    \n```cpp\n#include <pthread.h>\n\npthread_create (thread, attr, start_routine,\
    \ arg)\n```\n\nHere, `pthread_create` will create a new executable thread. There\
