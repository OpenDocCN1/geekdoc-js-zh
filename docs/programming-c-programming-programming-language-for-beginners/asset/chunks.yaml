    \ of type void. NULL may be used if no argument is to be passed. |\n\nThe maximum\
    \ number of threads that a process can create depends on its implementation. A\
    \ thread can create another thread and after their creation, threads act like\
    \ peers. Implied hierarchy or a dependency cannot be found between threads.\n\n\
    The maximum number of threads that may be created by a process is implementation\
    \ dependent. Once created, threads are peers, and may create other threads. There\
