    \ `##` 是预处理器运算符。你可以使用 `#` 运算符将用于替换的文本转换为由引号括起来的字符串。\n\n查看下面提供的宏定义。\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\n#define MKSTR( x ) #x\n\nint main\
    \ ()\n\n{\n   cout << MKSTR(HELLO C++) << endl;\n   return 0;\n}\n```\n\n如果上述代码被编译并运行，它将产生如下输出。\n\
    \nHELLO C++`\n\n## 预定义 C++ 宏\n\nC++ 为其用户提供了大量的预定义宏。下面描述了这些宏。\n\nC++ 提供了下面提到的若干预定义宏：\n\
    \n| 宏 |or |\n| :--- | :--- |\n| `__LINE__` | 该宏包含编译器当前所在行的行号。 |\n| `__FILE__`\
    \ | 该宏包含正在编译的文件名。 |\n| `__DATE__` | 该宏包含源文件编译为目标代码的日期，格式为“月/日/年”的字符串。 |\n| `__TIME__`\
    \ | 该宏包含程序编译的时间。该时间存储在“时:分:秒”格式的字符串中。 |\n\n现在，我们将查看使用上述宏的示例。\n\n示例：\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main ()\n\n{\n   cout << \"\
    Value of __LINE__ : \" << __LINE__ << endl;\n   cout << \"Value of __FILE__ :\
    \ \" << __FILE__ << endl;\n   cout << \"Value of __DATE__ : \" << __DATE__ <<\
    \ endl;\n   cout << \"Value of __TIME__ : \" << __TIME__ << endl;\n   return 0;\n\
    }\n```\n\n当上述代码被编译并运行后，它将产生如下输出。\n\nValue of `__LINE__` : 6\n\nValue of `__FILE__`\
    \ : test.cpp\n\nValue of `__DATE__` : Feb 28 2011\n\nValue of `__TIME__` : 18:52:48\n\
    \n# 第 16 章：多线程\n\n多线程可以被视为一种特殊的多任务形式，而多任务可以定义为允许你的系统并发运行多个程序的特性。通常有两种多任务类型：基于进程的和基于线程的。\n\
    \n在基于进程的多任务中，不同程序的执行将并发进行。基于线程的多任务则将处理该程序内部各个组成部分的并发执行。\n\n在多线程程序中，两个或多个部分将并发运行。这些每个部分都被称为线程，每个线程都定义了一个与其他部分独立的执行部分。\n\
    \nC++ 中没有内置的多线程应用程序。多线程完全完全依赖于操作系统。\n\n## 创建线程\n\n要创建一个 POSIX 线程，我们将使用以下例程。\n\n\
    ```cpp\n#include <pthread.h>\n\npthread_create (thread, attr, start_routine, arg)\n\
    ```\n\n在这里，`pthread_create` 将创建一个新的可执行线程。调用此例程没有限制，可以在你的代码中多次调用，并在任何地方调用。参数的描述如下。\n\
    \n| 参数 |  |\n| :--- | :--- |\n| `thread` | 它是子程序返回的用于线程的打开句柄和唯一标识符。 |\n| `attr`\
    \ | 一个不透明的属性对象，用于设置线程属性。你可以指定一个线程属性对象，或使用 NULL 使用默认值。 |\n| `start_routine` | 这是一个\
    \ C++ 线程参数，新线程创建后将执行该参数。 |\n| `arg` | 可以传递给 `start_routine` 的单个参数。它必须以 `void`\
    \ 类型指针转换的形式引用传递。如果没有传递任何参数，可以使用 NULL。 |\n\n一个进程可以创建的最大线程数取决于其实现。线程可以创建另一个线程，在创建之后，线程之间像对等节点一样工作。线程之间找不到隐含的层级关系或依赖关系。\n\
    \n进程可能创建的最大线程数取决于实现。一旦创建，线程就是平等的，并可以创建其他线程。线程之间不存在隐含的层级关系或依赖。\n\n## 终止线程\n\n你可以使用以下例程来终止\
    \ POSIX 线程。\n\n```cpp\n#include <pthread.h>\n\npthread_exit (status)\n```\n\n\
    为了显式退出线程，这里使用了 `pthread_exit`。`pthread_exit()` 例程在线程完成工作且不再需要时通常会被调用。\n\n如果 `main()`\
    \ 函数通过 `pthread_exit()` 结束，那么在它创建的线程结束之前，其他线程不会终止并将继续执行。在其他情况下，它们将在 `main()` 函数结束时自动终止。这里有一个示例。\n\
    \n示例：\n\n在这个示例中，将通过 `pthread_create()` 例程创建五个线程。这五个线程中的每一个都将打印消息“Hello World!”并通过调用\
    \ `pthread_exit()` 终止。\n\n```cpp\n#include <iostream>\n\n#include <cstdlib>\n\n\
    #include <pthread.h>\n\nusing namespace std;\n\n#define NUM_THREADS 5\n\nvoid\
    \ *PrintHello(void *id)\n{\n   long tid;\n   tid = (long)id;\n   cout << \"Hello\
    \ World! Thread ID, \" << tid << endl;\n   pthread_exit(NULL);\n}\n\nint main\
    \ ()\n\n{\n   pthread_t threads[NUM_THREADS];\n   int rc;\n   int i;\n   for(\
    \ i=0; i < NUM_THREADS; i++ ){\n     cout << \"main() : creating thread, \" <<\
    \ i << endl;\n     rc = pthread_create(&threads[i], NULL, PrintHello, (void *)i);\n\
    \     if (rc){\n      cout << \"Error:unable to create thread,\" << rc << endl;\n\
    \      exit(-1);\n     }\n   }\n   pthread_exit(NULL);\n}\n```\n\n使用 `-lpthread`\
    \ 库编译程序：\n`gcc test.cpp -lpthread`\n\n现在，如果你执行上述操作，它将生成如下输出。\n\nmain() : creating\
    \ thread, 0\nmain() : creating thread, 1\nmain() : creating thread, 2\nmain()\
    \ : creating thread, 3\nmain() : creating thread, 4\nHello World! Thread ID, 0\n\
    Hello World! Thread ID, 1\nHello World! Thread ID, 2\nHello World! Thread ID,\
    \ 3\nHello World! Thread ID, 4\n\n## 向线程传递参数\n\n此示例将展示如何通过结构体传递参数。由于线程指向 `void`，任何数据类型都可以传递。这将在下面的示例中解释。\n\
    \n示例：\n\n```cpp\n#include <iostream>\n\n#include <cstdlib>\n#include <pthread.h>\n\
    \nusing namespace std;\n\n#define NUM_THREADS 5\n\nstruct thread_data {\n    int\
    \ thread_id;\n    char *message;\n};\n\nvoid *PrintHello(void *arg)\n{\n   struct\
    \ thread_data *my_data;\n   my_data = (struct thread_data *)arg;\n   cout << \"\
    Thread ID : \" << my_data->thread_id;\n   cout << \" Message : \" << my_data->message\
    \ << endl;\n}pthread_exit(NULL);\n\nint main ()\n\n{\n   pthread_t threads[NUM_THREADS];\n\
    \   struct thread_data td[NUM_THREADS];\n   int rc;\n   int i;\n   for( i=0; i\
    \ < NUM_THREADS; i++ ){\n     cout << \"main() : creating thread, \" << i << endl;\n\
    \     td[i].thread_id = i;\n     td[i].message = \"This is message\";\n     rc\
    \ = pthread_create(&threads[i], NULL, PrintHello, (void *)&td[i]);\n     if (rc){\n\
    \      cout << \"Error:unable to create thread,\" << rc << endl;\n      exit(-1);\n\
    \     }\n   }\n   pthread_exit(NULL);\n}\n```\n*(注：由于原文代码块存在一些排版错误，如 `pthread_exit`\
    \ 位置异常，翻译时已根据逻辑进行了对齐)*\n\n当你编译并执行上述代码时，它将产生如下输出。\n\nmain() : creating thread,\
    \ 0\nmain() : creating thread, 1\nmain() : creating thread, 2\nmain() : creating\
    \ thread, 3\nmain() : creating thread, 4\nThread ID : 3 Message : This is message\n\
    Thread ID : 2 Message : This is message\nThread ID : 0 Message : This is message\n\
    Thread ID : 1 Message : This is message\nThread ID : 4 Message : This is message\n\
    \n## 合并与分离线程\n\nC++ 为其用户提供了两个例程，用于合并或分离线程。它们如下：\n\n`pthread_join (threadid, status)`\n\
    \n`pthread_detach (threadid)`\n\n"
- fmt: "\nThe `pthread_join()` subroutine will block the calling thread until the\
    \ thread with the specified threaded is terminated. When a new thread is created,\
    \ an attribute of that thread will define if that thread is joinable or detached.\
    \ You can only join the threads that are created as joinable threads and a detachable\
    \ thread cannot be joined in any case.\n\nIn this example, it is shown how to\
    \ wait for the thread completions with the Pthread join routine.\n\nExample:\n\
    \n```cpp\n#include <iostream>\n#include <cstdlib>\n#include <pthread.h>\n#include\
    \ <unistd.h>\n\nusing namespace std;\n\n#define NUM_THREADS     5\n\nvoid *wait(void\
    \ *t)\n{\n  int i;\n  long tid;\n  tid = (long)t;\n  sleep(1);\n  cout << \"Sleeping\
    \ in thread \" << endl;\n  cout << \"Thread with id : \" << tid << \"  ...exiting\
    \ \" << endl;\n  pthread_exit(NULL);\n}\n\nint main ()\n{\n  int rc;\n  int i;\n\
    \  pthread_t threads[NUM_THREADS];\n  pthread_attr_t attr;\n  void *status;\n\
    \  // Initialize and set thread joinable\n  pthread_attr_init(&attr);\n  pthread_attr_setdetachstate(&attr,\
    \ PTHREAD_CREATE_JOINABLE);\n  for( i=0; i < NUM_THREADS; i++ ){\n      cout <<\
    \ \"main() : creating thread, \" << i << endl;\n      rc = pthread_create(&threads[i],\
    \ NULL, wait, (void *)i );\n      if (rc){\n        cout << \"Error:unable to\
    \ create thread,\" << rc << endl;\n        exit(-1);\n      }\n  }\n  // free\
    \ attribute and wait for the other threads\n  pthread_attr_destroy(&attr);\n \
    \ for( i=0; i < NUM_THREADS; i++ ){\n      rc = pthread_join(threads[i], &status);\n\
    \      if (rc){\n        cout << \"Error:unable to join,\" << rc << endl;\n  \
    \      exit(-1);\n      }\n      cout << \"Main: completed thread id :\" << i\
    \ ;\n      cout << \"  exiting with status :\" << status << endl;\n  }\n  cout\
    \ << \"Main: program exiting.\" << endl;\n  pthread_exit(NULL);\n}\n```\n\nWhen\
    \ you compile and execute the above code, it will produce the following output.\n\
    \n```\nmain() : creating thread, 0\nmain() : creating thread, 1\nmain() : creating\
    \ thread, 2\nmain() : creating thread, 3\nmain() : creating thread, 4\nSleeping\
    \ in thread\nThread with id : 0 .... exiting\nSleeping in thread\nThread with\
    \ id : 1 .... exiting\nSleeping in thread\nThread with id : 2 .... exiting\nSleeping\
    \ in thread\nThread with id : 3 .... exiting\nSleeping in thread\nThread with\
    \ id : 4 .... exiting\nMain: completed thread id :0  exiting with status :0\n\
    Main: completed thread id :1  exiting with status :0\nMain: completed thread id\
    \ :2  exiting with status :0\nMain: completed thread id :3  exiting with status\
    \ :0\nMain: completed thread id :4  exiting with status :0\nMain: program exiting.\n\
    ```\n\n# Conclusion\n\nThat concludes my run through of C++ computer language.\
    \ I hope that I have been able to give you some idea of how to get started with\
    \ C++ computer programming. Once you get the hang of the basics and learn how\
    \ to apply each rule, the world really is your oyster when it comes to programming.\n\
    \nIt is important that you learn how each operator, variable, loop and conditional\
    \ works independently and how to put them together to produce the code for the\
    \ program you are aiming to write. It is not too difficult a language to learn,\
    \ but it will require your undivided attention to get it right otherwise, your\
    \ compiler will be throwing up all sorts of errors and your programs just won’t\
    \ run.\n\nEnjoy your programming adventures and good luck!\n\n## You May Enjoy\
    \ My Other Books!\n\n- [PYTHON: Programming Guide For Beginners: LEARN IN A DAY!](http://hyperurl.co/python)\n\
    hyperurl.co/python\n\n- [JAVA: Java Programming, JavaScript, Coding: Programming\
    \ Guide: LEARN IN A DAY!](http://hyperurl.co/javaos)\nhyperurl.co/javaos\n\n-\
    \ [SQL: Programming Guide: Javascript and Coding: LEARN IN A DAY!](http://smarturl.it/sql)\n\
    hyperurl.co/sql\n\n- Programming: HTML: Programming Guide: Computer Programming:\
    \ LEARN IN A DAY!\n[hyperurl.co/html](http://hyperurl.co/html)\n\n- Programming:\
    \ Swift: Create A Fully Functioning App: Learn In A Day!\n[hyperurl.co/swift](http://hyperurl.co/swift)\n"
  raw: 'The pthread_join() subroutine will block the calling thread until the thread
    with the specified threaded is terminated. When a new thread is created, an attribute
    of that thread will define if that thread is joinable or detached. You can only
    join the threads that are created as joinable threads and a detachable thread
    cannot be joined in any case.


    In this example, it is shown how to wait for the thread completions with the Pthread
    join routine.


    Example:


    #include <iostream>


    #include <cstdlib>


    #include <pthread.h>


    #include <unistd.h>


    using namespace std;


    #define NUM_THREADS     5


    void *wait(void *t)


    {


      int i;


      long tid;


      tid = (long)t;


      sleep(1);


      cout << "Sleeping in thread " << endl;


      cout << "Thread with id : " << tid << "  ...exiting " << endl;


      pthread_exit(NULL);


    }


    int main ()


    {


      int rc;


      int i;


      pthread_t threads[NUM_THREADS];


      pthread_attr_t attr;


      void *status;


      // Initialize and set thread joinable


      pthread_attr_init(&attr);


      pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_JOINABLE);


      for( i=0; i < NUM_THREADS; i++ ){


         cout << "main() : creating thread, " << i << endl;


         rc = pthread_create(&threads[i], NULL, wait, (void *)i );


         if (rc){


            cout << "Error:unable to create thread," << rc << endl;


            exit(-1);


         }


      }


      // free attribute and wait for the other threads


      pthread_attr_destroy(&attr);


      for( i=0; i < NUM_THREADS; i++ ){


         rc = pthread_join(threads[i], &status);


         if (rc){


            cout << "Error:unable to join," << rc << endl;


            exit(-1);


         }


         cout << "Main: completed thread id :" << i ;


         cout << "  exiting with status :" << status << endl;


      }


      cout << "Main: program exiting." << endl;


      pthread_exit(NULL);


    }


