    ## 编程语言简介\n如你所知，程序无非一组指令。这些指令由物理计算机机器（硬件）执行。尽管现代计算机非常快，但它们也有自己的局限性。计算机只能理解以其原生语言给出的一组指令。为此，你应该理解机器语言、汇编语言和高级语言的概念。\n\
    \n## 机器语言\n尽管计算机是非常先进的机器，但它们无法直接理解像 C++ 这样的语言。计算机只理解 0 和 1。它们被称为位（bits）。它们只能理解以二进制格式给出的指令。我们给计算机的每组指令都会翻译成一组告诉处理器执行特定任务的指令。你应该理解，不同类型的处理器有不同类型的指令集。例如，奔腾处理器只会理解它们自己的指令集。Macintosh\
    \ 也是如此。在最开始的时候，程序员必须用二进制语言编写指令。这非常耗时且困难。幸运的是，我们不需要经历所有这些。\n\n## 汇编语言\n由于机器语言非常难以处理，一种名为汇编语言的新语言被发明了。在这里，每条指令都被给了一个短名称，变量被名称而不是二进制位所取代，这使得程序员编写代码变得容易。你可能会问计算机如何理解汇编语言。计算机无法理解。汇编语言将在汇编器的帮助下转换为机器语言。你应该记住，每个\
    \ CPU 都有自己的汇编语言。因此，一个 CPU 的汇编语言不能在另一个 CPU 上运行。即使是汇编语言也有自己的缺点。即使对于简单的任务，它们也需要大量的指令集。\n\
    \n"
- fmt: "\nThe high-level programming languages came into existence to solve those\
    \ problems that the assembly and machine languages were causing. These can run\
    \ on any computer. High-level languages come with a program called a `compiler`.\
    \ The role of a `compiler` is to generate an executable file or a program that\
    \ a `CPU` can directly understand. These programs are stand-alone programs. The\
    \ modern compilers that are available today are very efficient and fast and converting\
    \ the code into an executable format. Some of the programming languages use the\
    \ `interpreter`. The job of an `interpreter` is to execute the code but without\
    \ compiling it to the machine code. But here we won’t learn about an `interpreter`.\
    \ Any given programming language can be interpreted or compiled. Languages like\
    \ `C`, `C++` and `PASCAL` are compiled while scripting languages like `JavaScript`\
    \ and `Perl` are interpreted.\n\nAsk this question and you will get a dozen different\
    \ answers but, put simply, `C++` is a compiled, object-orientated computer-programming\
    \ language. If you are new to programming, even that has probably left you somewhat\
    \ confused so let’s break it down a bit more.\n\nThere are two types of programming\
    \ language – one is interpreted and the other is compiled. Interpreted languages\
    \ are run on an `interpreter` – this reads the code and executes the commands\
    \ inside one at a time. Compiled languages are read by the `CPU` in your computer\
    \ instead of a program. Computers cannot read letters; they can only read binary\
    \ numbers so, when you write your code, it has to be translated into binary first.\
    \ This is called compiling. \n\nThe object-orientated part of the explanation\
    \ just describes how the code is structured but I will be going into more detail\
    \ on that later on.\n\n## What does this all mean to me?\n\nTo be successful at\
    \ learning `C++`, you need to use both a text editor and a `compiler`. If you\
    \ are using a Windows PC to do this on, you can use `Notepad`, which is already\
    \ installed, on your computer as your text editor and, as your `compiler`, which\
    \ is going to convert your code into a format that is executable, you should use\
    \ `GNU C/C++`.\n\n### Linux/Unix\n\nA simple way to check whether `GCC` is installed\
    \ on your `Linux/Unix` computer is to bring up the command line and type in:\n\
    \n```\n$ g++ -v\n```\n\nIf `GCC` is installed you will get the following message,\
    \ or something very like it:\n\n```\nUsing built-in specs\nTarget: i386-redhat-linux\n\
    Configured with: ../configure --prefix=/usr .......\nThread model: POSIX\ngcc\
    \ version 4.1.2 20080704 (Red Hat 4.1.2-46)\n```\n\nIf `GCC` is not installed,\
    \ you can follow the instructions on [http://gcc.gnu.org/install/] to do so.\n\
    \n### Mac OS X\n\nThe best way to get `GCC` for `Mac OS X` is to go to [http://developer.apple.com/technologies/tools],\
    \ download `xCode` and follow the installation instructions.\n\n### Windows\n\n\
    To get `GCC` on your Windows PC, you must first download `MinGW` from [http://www.mingw.org].\
    \ Make sure you download the latest version of `MinGW`, as well as installing\
    \ `gcc-core`, `binutils`, `gcc-g++` and `MinGW runtime` – these are minimum requirements.\n\
    \nOne more thing you could consider is an `IDE` – Integrated Developments Environment.\
    \ This text editor features an integrated compiler and syntax highlighting. The\
    \ best one to use is `Code::Blocks`.\n\n## Is there anything else I should know?\n\
    \nYes. `C++` is very rigid in its syntax and everything is case sensitive so be\
    \ careful what you are typing. In `C++`, the word “Hello” means something different\
    \ to “hello” but this is something you will learn more about later on in the book.\
    \ For now, let’s get straight on with the programming.\n\nBefore we go into too\
    \ much detail, let’s get you started in writing a simple code. This is a common\
    \ example for all types of computer programming tutorials, so, without further\
    \ ado, let’s break it down. First of all, the code is written as such:\n\n![](images/00001.jpeg)\n\
    \nLine 1 is telling your computer that you want to link `iostream` library to\
    \ your program. The library is a repository where little bits of code are stored,\
    \ along with variables and operators on occasion. The `iostream` library has code\
    \ in it that lets us move characters to a text stream, which then appears on the\
    \ screen.\n\nLine 2 tells the computer that we want to use the standard namespace\
    \ – this is where your code will be stored, useful if you write two bits of code\
    \ with the same name,\n\nLine 4 is the start of the code. Everything that goes\
    \ inside the braces is what the `compiler` reads and translates – this line must\
    \ go in very single program your write otherwise nothing is going to happen.\n\
    \nThe next stage is the printing of the program, which, in this case is “Hello,\
    \ World!” This is where we use some of the code stored in `iostream` – a piece\
    \ of code called `cout`. The `<<` that comes after the code is an operator and\
    \ this one translates to “output” which means we are telling the computer to send\
    \ the code to a specified stream. The printing “Hello, World!” is called a string,\
    \ which is nothing more than a character sequence enclosed in double quotations.\
    \ Notice that the line ends with a semi-colon – this is telling the computer that\
    \ the code is finished and if it is not used, the program cannot be compiled.\n\
    \nLine 8 is always placed at the end of `main` and it is to inform the computer\
    \ that the block is completed\n\nNow that you have the source code for the program,\
    \ it has to be compiled using your `compiler`. More detail later, first I want\
    \ to start going over what makes up your code.\n"
