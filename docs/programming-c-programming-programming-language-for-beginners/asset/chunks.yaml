  trans: "\n我们都知道，在任何语言中，句子的都是根据该语言特定的语法规则构建的。以英语为例，我们通常用句号结束句子。支配某种语言中句子构建的所有规则被称为语法（syntax）。同样，C++\
    \ 也有其语法。不遵守语法将直接导致你的代码无效。确保遵循 C++ 语言的基础语法是编译器的责任。如果你违反了基础语法，编译器将尝试编译代码并对语法违反进行报错。该问题被称为语法错误（syntax\
    \ error）。只有在没有发现语法错误的情况下，C++ 编译器才会编译程序。它会显示所有发现的错误，并建议你使它们有效，以便它能够在无任何错误的情况下执行代码。\n\
    \n## 编译你的第一个程序\n\n在编写第一个程序之前，有两点你应当了解。\n\n1. 你的程序将写在 `.cpp` 文件中，这些文件之后会被添加到你的项目中。项目也被称为工作空间（workspaces）或解决方案（solutions）。代码文件和\
    \ IDE 设置将保存到项目中。\n2. 你应该通过创建一个新项目来开始，因为有很多种类型的项目。在开始之前，你需要指定你想要从事的项目类型。\n\n###\
    \ 是什么构成了 C++ 代码？\n\n变量是存储值的东西。它就像一个盒子，每个盒子上都有一个名称和一个类别，而类别是存储在其中的物品的类型——名称是特定的变量。每个变量都有特定的类型、名称和大小，这些因素精确地决定了里面可以存储什么。在我们继续下去之前，这里有一份你将用到的变量列表：\n\
    \n* `Int`: 整数（integers）\n* `Bool`: 真或假（0 或 1）\n* `Float`: 小数（reals）\n* `Double`:\
    \ 精度是倍的浮点数\n* `Char`: 单个 ASCII 字符\n\n### 使用变量\n\n下面的代码演示了如何使用它们：\n\n![](img/00002.jpeg)\n\
    \n这部分大部分你在上一个代码中已经见过，唯一没见过的是第 4 行和第 7 行——第 4 行声明变量，在这种情况下是一个整数。声明仅仅是告诉编译器我们将使用这个变量，后面跟着变量的名称。你可以用你喜欢的名称给变量命名，但要保持简单且相关联，并确保它不是\
    \ C++ 中已经具有含义的保留关键字。以小写字母开头。语句以分号结束。\n\n第 7 行被称为赋值（assignment）。这为变量分配了一个值，`=`\
    \ 是运算符——这就是执行赋值的操作。`=` 后面的值被称为二元运算符（binary operator）。\n\n注意这次 `cout` 语句周围没有引号。这是因为我们不是在显示字符串，而是输出该值。现在编译程序将在屏幕上打印“42”。\n\
    \n除了类型之外，变量还可以在声明中添加前缀，这些前缀会改变变量的行为。有些会改变变量的大小，另一些允许你或阻止你使用负数，而一些的作用完全不同。这里几乎会讨论所有的。\n\
    \n## 大小更改有两个特定的前缀可以改变变量的字节大小——`short` 和 `long`。背后的思想是允许变量存储更多值和更大的数字。大小取决于你使用的计算机架构：\n\
    \n* 在 32 位计算机上，`int` 和 `long int` 都是 4 字节\n* 在 64 位计算机上，`int` 是 4 字节，`long int`\
    \ 是 8 字节\n* 在两种架构上，`short int` 都是 2 字节\n\n没有任何规定这些特定关键字的修饰符的大小，除非：\n\n* `Short`\
    \ 必须等于或小于普通变量\n* 普通变量反过来必须等于或小于 `long`。\n* 唯一可以带前缀的变量是 `int`\n\n更令人混乱的是，你实际上可以省略\
    \ `int` 只使用 `long` 或 `short`，例如：\n\n1. `short int s = 0;`\n2. `int i = 0;`\n3.\
    \ `long int l = 0;`\n5. `short s2 = 0;`\n6. `long l2 = 0;`\n\n## 符号更改\n\n另外两个前缀可以限制类型存储的值——`signed`（有符号）和\
    \ `unsigned`（无符号）。有符号变量可以存储负值正值，而无符号变量只能取正值。\n\n## 其他前缀\n\n在 C++ 中你可以使用其他一些前缀，它们并不常见，我们大多数我们不会使用，也不会在书中涵盖。但有两个非常有用的前缀——`const`\
    \ 和 `static`。前者是常量，永远改变其值，而后者保持变量的值不变，但仅在函数调用之间；那是以后的话题。\n\n## 组合类型\n\n前缀可以链式一起使用，所以看到类似的内容并不常见：\n\
    \n1. `static unsigned long int`，或者\n2. `signed const char`\n\n你可以按照你喜欢的顺序放置前缀，只要它们在变量类型之前即可。\n\
    \n关于变量的最后一点——你只能在声明它们的区域使用它们\n\n## C++ 中的枚举\n\n在 C++ 中，枚举（enumeration）可以被定义为用户类型，它可以包含给定的任何名称。其语法如下：\n\
    \n```cpp\nenum seasons { spring, summer, autumn, winter };\n```\n\n变量 `s` 在函数内被定义为\
    \ `seasons` 类型，它可以存储四个值中的任何一个（spring, summer, autumn, winter）。第一个枚举值的默认值为 `0`，第二个为\
    \ `1`，依此类推。在程序中 `spring` 的值等于 `0`，`summer` 为 `1`，`autumn` 的值为 `2`，`winter` 的值为\
    \ `3`。\n\n这里你需要记住的一点是 `spring`、`summer`、`autumn` 和 `winter` 不是变量。编译器将它们视为整数。一旦在程序中定义，这些值就无法更改。考虑这个示例。\n\
    \n### 示例 1：Enumeration\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nenum seasons { spring, summer, autumn, winter };\n\nint main() {\n    seasons\
    \ s;\n    s = spring;\n    cout << \"spring = \" << s << endl;\n    s = summer;\n\
    \    cout << \"summer = \" << s << endl;\n    s = autumn;\n    cout << \"autumn\
    \ = \" << s << endl;\n    s = winter;\n    cout << \"winter = \" << s << endl;\n\
    \    return 0;\n}\n```\n\n输出：\n```\nspring = 0\nsummer = 1\nautumn = 2\nwinter\
    \ = 3\n```\n\n默认值可以在枚举声明期间更改，你可以赋予它想要的值。考虑给出的示例。\n\n### 示例 2：Enumeration\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nenum seasons { spring = 34, summer\
    \ = 4, autumn = 9, winter = 32};\n\nint main() {\n    seasons s;\n    s = summer;\n\
    \    cout << \"summer = \" << s << endl;\n    return 0;\n}\n```\n\n输出：\n```\n\
    summer = 4\n```\n"
- fmt: "\nNow that we know how variables work, it is time to start using them in a\
    \ program. Right now though, all we can do is set the value of a variable and\
    \ output it, which isn’t all that useful when it comes to creating proper C++\
    \ programs. What we need is a way to manipulate the variables and get input, which\
    \ is where the `iostream` library comes in.\n\nWe know that this library is capable\
    \ of outputting data but it is also able to receive input data. The command that\
    \ allows it to do this is `cin`, opposite of `cout`. The difference is, the operator\
    \ after `cin` is reversed – instead of `<<`, we type `>>`.\n\n1. `cout << \"string\"\
    ;`\n2. `cout << var;`\n4. `cin >> var;`\n\n`iostream` is more powerful than that\
    \ though and allows you to combine multiple statements. For example, if you wanted\
    \ to output two strings or variables, you would write two statements. With `iostream`,\
    \ you can combine multiple `cout` statements together to produce code that is\
    \ much shorter:\n\n1. `cout << \"Hello, \" << \"World!\";`\n\nYou can do the same\
    \ with `cin` statements but remember that you cannot mix inputs and outputs on\
    \ one line.\n\n## The New Program\n\nNow we know how to input and output data\
    \ we can write programs that are a bit more useful. With this example, we are\
    \ going to improve on the “Hello, World!” program:\n\n![](images/00003.jpeg)\n\
    \nYou can see that we have declared `iostream` in the standard namespace and we\
    \ have then declared some variables but in a slightly different way to before\
    \ by combining and assignment with the declaration – this is called initialization.\n\
    \nThe rest is the code and, in this case, the computer program is going to ask\
    \ the user how old they are, inviting user input into the program. It goes on\
    \ to ask what the users favorite letter of the alphabet is. Note the use of the\
    \ `\\` followed by `n` – this indicates a new line is needed.\n\n## Variables\n\
    \nIn C++, available is nothing but a piece of memory which can be used for storing\
    \ information. Information can be stored and retrieve using variables. Whenever\
    \ a new variable is assigned, some part of the `RAM` memory is allocated to that\
    \ variable. There are different types of variables that have a specific purpose\
    \ for each. For characters there a character variables, for numbers there are\
    \ integer variables, for decimals we have `float` variable etc.\n\nYou should\
    \ use a declaration statement if you wish to define a variable.\n\nWe will have\
    \ a look at the `int` variable for your better understanding of variables.\n\n\
    ```cpp\nint x;\n```\n\nThis is nothing but defining `x` with an integer variable.\
    \ The purpose of an integer variable is to store numerical data. \n\nHere is an\
    \ example of assignment statements:\n\n```cpp\nint y;               // define\
    \ y as an integer variable\ny = 4;               // 4 evaluates to 4, which is\
    \ then assigned to y\ny = 2 + 5;           // 2 + 5 evaluates to 7, which is then\
    \ assigned to y\nint x;               // define x as an integer variable\nx =\
    \ y;               // y evaluates to 7 (from before), which is then assigned to\
    \ x.\nx = x;               // x evaluates to 7, which is then assigned to x (useless!)\n\
    x = x + 1;           // x + 1 evaluates to 8, which is then assigned to x.\n```\n\
    \n## Uninitialized variables\n\nIn languages like C and C++, a variable does not\
    \ initialize with a standard value like `0`. It will have a default garbage value\
    \ assigned to it. And this kind of variable is called as an uninitialized variable.\n\
    \n# Chapter 4: Pointers\n\n## Pointers\n\nPointers in C++ are easy and interesting\
    \ to learn. Some tasks can be performed easily in C++ using pointers and there\
    \ are some other tasks that cannot be done without using pointers.\n\nAs you already\
    \ know, in C++ every variable is given a memory location and an address is defined\
    \ for every memory location. Every variable can be accessed using its memory location\
    \ by using the `&` operator. The `&` operator is used for denoting a memory address.\
    \ Here, in the following example, the addresses of the variables will be defined.\n\
    \nExample:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n  int var1;\n  char var2[10];\n  cout << \"Address of var1 variable: \";\n\
    \  cout << &var1 << endl;\n  cout << \"Address of var2 variable: \";\n  cout <<\
    \ &var2 << endl;\n  return 0;\n}\n```\n\nWhen you compile and execute the above\
    \ code, it will produce the following output.\n\nAddress of var1 variable: [address]\n\
    Address of var2 variable: [address]\n\n## What Are Pointers\n\nWhen you compile\
    \ and execute the above code, it will produce the following output.\n\nAddress\
    \ of var1 variable: [address]\nAddress of var2 variable: [address]\n\n## Using\
    \ Pointers\n\nPointers in C++ are easy and interesting to learn. Some tasks can\
    \ be performed easily in C++ using pointers and there are some other tasks that\
    \ cannot be done without using pointers.\n\nAs you already know, in C++ every\
    \ variable is given a memory location and an address is defined for every memory\
    \ location. Every variable can be accessed using its memory location by using\
    \ the `&` operator. The `&` operator is used for denoting a memory address. Here,\
    \ in the following example, the addresses of the variables will be defined.\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n  int var\
    \ = 20;\n  int *ip = &var;\n  cout << \"Value of var: \";\n  cout << var << endl;\n\
    \  cout << \"Address of var: \";\n  cout << &var << endl;\n  cout << \"Value of\
    \ *ip: \";\n  cout << *ip << endl;\n  cout << \"Address of ip: \";\n  cout <<\
    \ ip << endl;\n  return 0;\n}\n```\n\nPointers in C++ are easy and interesting\
    \ to learn. Some tasks can be performed easily in C++ using pointers and there\
    \ are some other tasks that cannot be done without using pointers.\n\nAs you already\
    \ know, in C++ every variable is given a memory location and an address is defined\
    \ for every memory location. Every variable can be accessed using its memory location\
    \ by using the `&` operator. The `&` operator is used for denoting a memory address.\
    \ Here, in the following example, the addresses of the variables will be defined.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n  int var1;\n\
    \  char var2[10];\n  cout << \"Address of var1 variable: \";\n  cout << &var1\
    \ << endl;\n  cout << \"Address of var2 variable: \";\n  cout << &var2 << endl;\n\
    \  return 0;\n}\n```\n\nWhen you compile and execute the above code, it will produce\
    \ the following output.\n\nAddress of var1 variable: [address]\nAddress of var2\
    \ variable: [address]\n\n## Syntax\n\nPointers in C++ are easy and interesting\
    \ to learn. Some tasks can be performed easily in C++ using pointers and there\
    \ are some other tasks that cannot be done without using pointers.\n\nAs you already\
    \ know, in C++ every variable is given a memory location and an address is defined\
    \ for every memory location. Every variable can be accessed using its memory location\
    \ by using the `&` operator. The `&` operator is used for denoting a memory address.\
    \ Here, in the following example, the addresses of the variables will be defined.\n\
    \n```cpp\ntype *name;\n```\n\nPointers in C++ are easy and interesting to learn.\
    \ Some tasks can be performed easily in C++ using pointers and there are some\
    \ other tasks that cannot be done without using pointers.\n\nAs you already know,\
    \ in C++ every variable is given a memory location and an address is defined for\
    \ every memory location. Every variable can be accessed using its memory location\
    \ by using the `&` operator. The `&` operator is used for denoting a memory address.\
    \ Here, in the following example, the addresses of the variables will be defined.\n\
    \n```cpp\nint *ip;\ndouble *dp;\nfloat *fp;\nchar *ch;\n```\n\n## Examples\n\n\
    Pointers in C++ are easy and interesting to learn. Some tasks can be performed\
    \ easily in C++ using pointers and there are some other tasks that cannot be done\
    \ without using pointers.\n\nAs you already know, in C++ every variable is given\
    \ a memory location and an address is defined for every memory location. Every\
    \ variable can be accessed using its memory location by using the `&` operator.\
    \ The `&` operator is used for denoting a memory address. Here, in the following\
    \ example, the addresses of the variables will be defined.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n  int var = 20;\n  int *ip\
