  trans: "\n\n封装是面向对象编程中的一个概念，它将数据和操作这些数据的函数绑定在一起。封装保护数据免受外部元素的干扰和误用。数据封装产生了一个重要的面向对象编程概念，称为数据隐藏。\n\
    \n数据封装可以定义为一种将数据和使用该数据的函数封装在一起的机制。数据抽象可以定义为一种暴露接口并隐藏实现细节的机制。\n\n通过创建名为 `classes`\
    \ 的用户定义类型，可以实现封装和数据隐藏。正如我们已经所知道的，`class` 可以包含私有、公共或受保护的成员。在 `class` 中定义的、没有访问说明符的项目默认是私有的。这里有一个示例。\n\
    \n### 示例：\n\n```cpp\nclass Box\n{\n  public:\n    double getVolume(void)\n   \
    \ {\n        return length * breadth * height;\n    }\n  private:\n    double\
    \ length;      // 箱箱的长度\n    double breadth;  // 箱子的宽度\n    double height;   \
    \   // 箱子的高度\n};\n```\n\n在这里，变量 `length`、`breadth` 和 `height` 是私有的。这意味着只有 `Box`\
    \ 类的成员才允许访问它们。程序的其他部分都无法访问这些变量。这是实现封装的方法之一。\n\n如果你希望类的某些部分是公共的，你应该使用 `public`\
    \ 关键字来定义它们。在 `public` 说明符之后定义的所有函数和变量都将被定义为公共的，程序中的任何函数都可以访问它们。\n\n通过将某个特定类设置为另一个类的友（friend），会暴露实现细节并导致封装的减少。将类的细节从其他类中隐藏起来始终是明智的。应该尽可能地隐藏类。\n\
    \n任何使用私有和公共成员实现 `class` 的 C++ 程序都可以被视为数据抽象和数据封装的示例。考虑下面这个示例。\n\n### 这是一个关于数据封装的示例。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Adder\n{\n  public:\n\
    \    // 构造函数\n    Adder(int i = 0)\n    {\n        total = i;\n    }\n    // 对外世界的接口\n\
    \    void addNum(int number)\n    {\n        total += number;\n    }\n    // 对外世界的接口\n\
    \    int getTotal()\n    {\n        return total;\n    };\n  private:\n    //\
    \ 外部世界的隐藏数据\n    int total;\n};\n\nint main( )\n{\n  Adder a;\n  a.addNum(10);\n\
    \  a.addNum(20);\n  a.addNum(30);\n  cout << \"Total \" << a.getTotal() << endl;\n\
    \  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\nTotal 60\n\n上述类将相加数字并返回它们的和。在这里成员\
    \ `addNum` 和 `getTotal` 是公共的，它们是用户在使用该类时应该知道的接口。虽然类中的私有成员被隐藏了，但它们对于类的正常运行是必要的。\n\
    \n### 设计策略\n\n除非我们希望暴露它们，否则通过将类设置为私有来隐藏其内容始终是明智的。这是良好的封装。\n\n大多数数据成员保持隐藏状态，但这同样适用于其他成员，包括虚函数。\n\
    \n## C++ 类定义\n\n每当你定义类时，你基本上是在为给定的数据类型定义一个蓝图。虽然这不会定义任何数据，但定义了类名的含义，即该类所包含的对象以及可以在这些对象上实现的操作。\n\
    \n类的定义以 `class` 关键字开始，然后是类名和封装在大括号内部的类体。在类名之后应该放置一个声明列表或分号。考虑下面的示例，该示例使用 `class`\
    \ 关键字定义了 `Box`。\n\n### 示例：\n\n```cpp\nclass Box\n{\n  public:\n    double length;\
    \  // 箱子的长度\n    double breadth;  // 箱子的宽度\n    double height;  // 箱子的高度\n};\n\
    ```\n\n`public` 关键字将决定访问权限。范围内的任何人都可以访问类的成员。类的成员可以指定为私有或受保护。\n\n## 定义 C++ 对象\n\
    \n每个类都为它的对象提供了一个蓝图。可以使用 `class` 关键字创建类的对象。\n\n## 访问数据\n\n借助直接访问运算符，你可以访问成员。这里有一个示例：\n\
    \n### 示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Box\n\
    {\n  public:\n    double length;  // 箱子的长度\n    double breadth;  // 箱子的宽度\n  \
    \  double height;  // 箱子的高度\n};\n\nint main( )\n{\n  Box Box1;\n  Box Box2;\n\
    \  double volume = 0;\n  Box1.length = 5.0;\n  Box1.breadth = 6.0;\n  Box1.height\
    \ = 7.0;\n  volume = Box1.length * Box1.breadth * Box1.height;\n  cout << \"Volume\
    \ of Box1 : \" << volume << endl;\n\n  Box2.length = 10.0;\n  Box2.breadth = 12.0;\n\
    \  Box2.height = 13.0;\n  volume = Box2.length * Box2.breadth * Box2.height;\n\
    \  cout << \"Volume of Box2 : \" << volume << endl;\n\n  return 0;\n}\n```\n\n\
    当你编译并执行上述代码时，它将产生以下输出。\n\nVolume of Box1 : 210\nVolume of Box2 : 1560\n\n你应该始终记住类的受保护和私有成员不能通过成员运算符直接访问。现在，我们将查看如何处理这些。\n\
    \n## 详细的类与对象\n\n到为止，我们处理了 C++ 类和对象的基本概念。我们将在下面的子章节中讨论更多概念。\n\n| 概念 | 描述 |\n| :---\
    \ | :--- |\n| 类成员函数 | 类的一部分可以定义为函数，该函数在类内部有原型或定义，类似于其他变量。 |\n| 类访问修饰符 | 类的成员可以声明为公共、受保护或私有。成员的默认访问定义总是私有的。\
    \ |\n| 构造函数与析构函数 | 类构造函数可以定义为类内部的一个特殊函数，每当类中创建一个新对象时调用。析构函数与构造函数类似，但它在删除创建的对象时被调用。\
    \ |\n| C++ 拷贝构造函数 | 拷贝构造函数是一种构造函数，用于使用已经创建的类对象来创建对象。 |\n| C++ 友函数 | 友函数是可以访问给定类的私有和受保护成员的东西。\
