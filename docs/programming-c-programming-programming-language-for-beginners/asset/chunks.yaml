    ## Revisiting expressions


    An expression can be defined as a combination of variables, letters, functions,
    and operators that evaluate to a value.


    We will talk about each in detail.


    - **Literals**: A literal is nothing but a value that is generally fixed, that
    is directly inserted into the source code. Literals will have no memory representation
    and they always evaluate to themselves.


    Example:


    ![](images/00016.jpeg)


    ## Operators


    We now know how to output text, declare a variable and receive inputs but, at
    the moment, we cannot do anything with the variables. What we need to be able
    to do is manipulate the variables without having to do too much work and that’s
    where operators come in.


    Operators are the last of the expressions. These are the ones that tells the expression
    the ways of combining the operands within the intention of.


    - **Unary**: these operators, which act on a single operand. Eg. being applied
    to a number. This gives.

    - **Binary**: these operators, which act on two different or same operands. Here
    the above example we used `+`.

    - **Ternary**: these are operators, which act on three operands. There is only
    one of these in C++


    ## Variable sizes and the sizeof operator


    The memory in a computer is basically organized into units of the byte size. Each
    of those memory blocks will have its own address, which is unique. Some variables
    take just 1 byte. Some take 2, 4, 8 and so on. It is only wise to use the variable
    of the required size. As each bit can only represent 0 or 1, we can say that it
    can only store possible values. In the same way, three bits can hold eight possible
    values. This way there will be a limit on the data that can be stored. As all
    the computers have limited amount of data that they can store, we use variables
    with different sizes so there won''t be memory wastage.


    The sizes of the basic data types in C++


    | Category | Type | Minimum Size |

    | :--- | :--- | :--- |

    | Boolean | bool | 1 byte |

    | character | char | 1 byte |

    | | wchar_t | 1 byte |

    | | char16_t | 2 bytes |

    | | char32_t | 4 bytes |

    | integer | short | 2 bytes |

    | | int | 2 bytes |

    | | long | 4 bytes |

    | | long long | 8 bytes |

    | floating point | float | 4 bytes |

    | | double | 8 bytes |

    | | long double | 8 bytes |


    We cannot say that the size of all the variables is same on all computers. The
    sizes of variables vary from machine to machine. You can know the size of the
    variables on your machine with the help of the operator called the `sizeof` operator
    in c++.


