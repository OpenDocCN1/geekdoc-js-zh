  raw: 'Now that we know how variables work, it is time to start using them in a program.
    Right now though, all we can do is set the value of a variable and output it,
    which isn’t all that useful when it comes to creating proper C++ programs. What
    we need is a way to manipulate the variables and get input, which is where the
    iostream library comes in.


    We know that this library is capable of outputting data but it is also able to
    receive input data. The command that allows it to do this is cin, opposite of
    cout. The difference is, the operator after cin is reversed – instead of <<, we
    type >>.


    1.  cout << "string";


    2.  cout << var;


    4.  cin >> var;


    iostream is more powerful that that though and allows you to combine multiple
    statements. For example, if you wanted to output two strings or variables, you
    would write two statements. With iostream, you can combine multiple cout statements
    together to produce code that is much shorter:


    1.  cout << "Hello, " << "World!";


    You can do the same with cin statements but remember that you cannot mix inputs
    and outputs on one line.


    ## The New Program


    Now we know how to input and output data we can write programs that are a bit
    more useful. With this example, we are going to improve on the “Hello, World!”
    program:


    ![](images/00003.jpeg)


    You can see that we have declared iostream in the standard namespace and we have
    then declared some variables but in a slightly different way to before by combining
    and assignment with the declaration – this is called initialization.


    The rest is the code and, in this case, the computer program is going to ask the
    user how old they are, inviting user input into the program. It goes on to ask
    what the users favorite letter of the alphabet is. Note the use of the \ followed
    by n – this indicates a new line is needed.


    ## Variables


    In C++, available is nothing but a piece of memory which can be used for storing
    information. Information can be stored and retrieve using variables. Whenever
    a new variable is assigned, some part of the RAM memory is allocated to that variable.
    There are different types of variables that have a specific purpose for each.
    For characters there a character variables, for numbers there are integer variables,
    for decimals we have float variable etc.


    You should use a declaration statement if you wish to define a variable.


    We will have a look at the int variable for your better understanding of variables.


    int x;


    This is nothing but defining x with an integer variable. The purpose of an integer
    variable is to store numerical data.


    Here is an example of assignment statements


    int y;                    // define y as an integer variable


    y = 4;                    // 4 evaluates to 4, which is then assigned to y


    y = 2 + 5;                // 2 + 5 evaluates to 7, which is then assigned to y


    int x;                   // define x as an integer variable


    x = y;                    // y evaluates to 7 (from before), which is then assigned
    to x.


    x = x;                    // x evaluates to 7, which is then assigned to x (useless!)


    x = x + 1;                // x + 1 evaluates to 8, which is then assigned to x.


    ## Uninitialized variables


    In languages like C and C++, a variable does not initialize with a standard value
    like 0\. It will have a default garbage value assigned to it. And this kind of
    variable is called as an uninitialized variable.


    # Chapter 4: Pointers


    ## Pointers


    Pointers in C++ are easy and interesting to learn. Some tasks can be performed
    easily in C++ using pointers and there are some other tasks that cannot be done
    without using pointers.


    As you already know, in C++ every variable is given a memory location and an address
    is defined for every memory location. Every variable can be accessed using its
    memory location by using the ‘&’ operator. The ‘&’ operator is used for denoting
    a memory address. Here, in the following example, the addresses of the variables
    will be defined.


    Example:


    #include <iostream>


    using namespace std;


    int main ()


    {


      int  var1;


      char var2[10];


      cout << "Address of var1 variable: ";


      cout << &var1 << endl;


      cout << "Address of var2 variable: ";


      cout << &var2 << endl;


      return 0;


    }


    When you compile and execute the above code, it will produce the following output.


    Address of var1 variable: 0xbfebd5c0


    Address of var2 variable: 0xbfebd5b6


    ## What Are Pointers?


    Appointed can be defined as a variable that contains the address of another variable.
    Before working with pointers, it should be declared just like any other variable
    or constant. The general syntax for declaring a pointer variable is given below.


    Syntax:


    type *var-name;


    Here, the base of the pointer should be given and it should be a valid type in
    C++. The pointer variable''s name is var-name. The asterisk that is used for declaring
    a pointer is the same that is used for the multiplication operations. The function
    of the asterisk varies here. It is used for designating given variable as a pointer.
    Some of the valid pointer declarations are given below.


    int    *ip;    // this is a pointer to an integer


    double *dp;    // this is a pointer to a double


    float  *fp;    // this is a pointer to a float


    char   *ch     // this is a pointer to a character


    The data type of the given variable or a constant which given pointer points to
    is the only difference between the pointers of different data types.


    ## Using Pointers


    Using pointers, there are a few of the important and frequently used operations.
    (a) The pointer variables will be defined. (b) The pointer will be assigned with
    the address of a given variable and (c) now, the value of the pointer variable
    at the given address can be accessed. For doing this, we use the unary operator
    asterisk (*). The * operator Will return the value of the pointer variable that
    is located at the specified address. Here are a few examples.


    Examples:


    #include <iostream>


    using namespace std;


    int main ()


    {


      int  var = 20;   // actual variable declaration.


      int  *ip;        // pointer variable


      ip = &var;       // store address of var in pointer variable


      cout << "Value of var variable: ";


      cout << var << endl;


      // print the address stored in ip pointer variable


      cout << "Address stored in ip variable: ";


      cout << ip << endl;


      // access the value at the address available in pointer


      cout << "Value of *ip variable: ";


      cout << *ip << endl;


      return 0;


    }


    When you compile and execute the above code, it will produce the following output.


    Value of var variable: 20


    Address stored in ip variable: 0xbfc601ac


    Value of *ip variable: 20


    ## C++ Pointers in Detail


    Now, let us go into the details of pointers in C++. In C++ programming, pointers
    are very important. The concepts of pointers are many but easy. If you wish to
    become a good C++ programmer, you should know the important pointer concepts given
    below.


    | Concept | Description |


    | [C++ Null Pointers](http://www.tutorialspoint.com/cplusplus/cpp_null_pointers.htm)
    | The null pointer is supported by C++. The value of a null pointer is zero and
    it is defined in several of the standard libraries. . |


    | [C++ pointer arithmetic](http://www.tutorialspoint.com/cplusplus/cpp_pointer_arithmatic.htm)
    | You can use for arithmetic operations on pointers. They are +,-,++ and -- |


    | [C++ pointers vs. arrays](http://www.tutorialspoint.com/cplusplus/cpp_pointers_vs_arrays.htm)
    | Pointers and arrays share a close relationship between them. We will see how.
    |


    | [C++ array of pointers](http://www.tutorialspoint.com/cplusplus/cpp_array_of_pointers.htm)
    | Arrays can be defined for holding a set of pointers. |


    | [C++ pointer to pointer](http://www.tutorialspoint.com/cplusplus/cpp_pointer_to_pointer.htm)
    | In C++, you are allowed to have a pointer on a different pointer and this continues.
