    # Chapter 8: Storage classes


    Within a given C++ program, the scope and the lifetime of the functions of variables
    defined by the storage class. The specifiers placed in front of the type which
    they modify. In C++, the following storage classes can be used.


    *   auto


    *   static


    *   register


    *   mutable


    *   extern


    ## The auto Storage Class


    For all of the local variables, the default of storage class is the auto storage
    class.


    Example:


    {


      int mount;


      auto int month;


    }


    In the examples given above there are two variables defined in a storage class
    which is the same for both. The auto can only be used with local variables.


    ## The register Storage Class


    If you wish to define the local variables and store them in the RAM instead of
    the register, you can use of the register storage class. This implies that the
    size of the variable will be equal to the maximum size of the register. This cannot
    have the & operator to it as there is no memory location for it.


    Syntax:


    {


      register int  miles;


    }


    You should only use these registers for the variables which require a quick access,
    like counters. You should keep in mind that when you define a register, it doesn''t
    imply that the variable is stored in that register. The variable might get stored
    in that register basing on the implementation and hardware restrictions.


    ## The Static Storage Class


    Instead of creating and destroying local variable whenever it goes in and out
    of the scope, the static storage class will tell the compiler to store the local
    variable during its lifetime. So, if you want your local variables to keep their
    values during function calls, you should make those are local variables static.


    The static modifier is not just limited to local variables, it can be applied
    to global variables as well. After this, the scope of that variable will be restricted
    to the file in which that variable is declared.


    When you use a static on a data member of a class, only one copy of it will be
    shared by all the objects of that class. Here is an example.


    Example:


    #include <iostream>


    // Function declaration


    void func(void);


    static int count = 10; /* Global variable */


    main()


    {


       while(count--)


       {


          func();


       }


       return 0;


    }


    // Function definition


    void func( void )


    {


       static int i = 5; // local static variable


       i++;


       std::cout << "i is " << i ;


       std::cout << " and count is " << count << std::endl;


    }


    When you compile and execute the above code, it will produce the following output.


    i is 6 and count is 9


    i is 7 and count is 8


    i is 8 and count is 7


    i is 9 and count is 6


    i is 10 and count is 5


    i is 11 and count is 4


    i is 12 and count is 3


    i is 13 and count is 2


    i is 14 and count is 1


    i is 15 and count is 0'
