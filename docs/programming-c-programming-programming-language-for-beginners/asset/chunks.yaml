    ## Binary operators


    When it comes to operators, there are basically five types. They are addition,
    subtraction, division, multiplication and modulus. Each of them is explained in
    the table given below.


    | Operator | Symbol | Form | Operation |

    | :--- | :--- | :--- | :--- |

    | Addition | `+` | `x + y` | `x` plus `y` |

    | Subtraction | `-` | `x - y` | `x` minus `y` |

    | Multiplication | `*` | `x * y` | `x` multiplied by `y` |

    | Division | `/` | `x / y` | `x` divided by `y` |

    | Modulus (Remainder) | `%` | `x % y` | The remainder of `x` divided by `y` |


    We already know about the basic arithmetic operators like addition, subtraction,
    division and multiplication. But most of us may not have an idea about modulus.
    The modulus operator is also known by the name remainder operator. This operator
    will return the reminder on the integer operands. We use this operator for testing
    if a number is even or odd. If the remainder is `0` the number is even and if
    the remainder is `1` the number is an odd number.


