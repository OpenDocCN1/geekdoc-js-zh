    the main function as it will terminate the main function and will not I love the
    execution of the program to go any further. When you are using void main(), the
    compiler doesn''t care about the return function and only will return nothing.


    ## Reusing functions


    Functions in C++ not confined by the number of times that they can be used. The
    same function can be used over and over again. In fact, in most of the programs,
    the functions will have to be reused.


    Here is an example


    ![](images/00008.jpeg)


    The output of the above program is


    ![](images/00009.gif)


    You should remember that the main() function is not the only function that can
    call its other functions. Any function can call on a different function.


    Here is an example function showing that


    ![](images/00010.jpeg)


    The output is:


    ![](images/00011.jpeg)


    ## Nested functions


    Nested functions are nothing but functions, which have other functions within
    them. In simple words, a function in the function is a nested function.


    The below example will show you a simple nested function:


    ![](images/00012.jpeg)


    ## Function parameters


    You will need to pass formation into function sometimes. In such cases, parameters
    will allow you to pass information to a function.


    Here is an example that would explain the role of parameters in the function.


    ![](images/00013.jpeg)


    The output is 9\.


    Now we will have a look at some other calls to functions():


    ![](images/00014.jpeg)


    The output is


    ![](images/00015.jpeg)


    ## Revisiting expressions


    An expression can be defined as a combination of variables, letters, functions,
    and operators that evaluate to a value.


    We will talk about each in detail.


    *   Literals: A literal is nothing but a value that is generally fixed, that is
    directly inserted into the source code. Literals will have no memory representation
    and they always evaluate to themselves.


    Example:


    ![](images/00016.jpeg)


    ## Operators


    We now know how to output text, declare a variable and receive inputs but, at
    the moment, we cannot do anything with the variables. What we need to be able
    to do is manipulate the variables without having to do too much work and that’s
    where operators come in.


    Operators are the last of the expressions. These are the ones that tells the expression
    the ways of combining the operands within the intention of producing new results.
    For example, 3+4 is an expression where we use the + operator. The operands 3
    and 4 combine and produce 7\. Similarly there are all standard arithmetic operators
    in C++. They are addition (+), multiplication(*) , subtraction(-), division(/)
    and assignment(=).


    The operators usually come in three different types


    *   Unary: these operators, which act on a single operand. Eg. -being applied
    to a number 2\. This gives -2\.


    *   Binary: these operators, which act on two different or same operands. Here
    the above example we used the expression 3+4\. There to operands combine and produce
    a result.


    *   Ternary: these are operators, which act on three operands. There is only one
    of these in C++


    ## Variable sizes and the sizeof operator


    The memory in a computer is basically organized into units of the byte size. Each
    of those memory blocks will have its own address, which is unique. Some variables
    take just 1 byte of memory. Some take 2, 4, 8 and so on. It is only wise to use
    the variable of the required size. As each bit can only represent 0 or 1, we can
    say that it can only store two possible values. In the same way, three bits can
    hold eight possible values. This way there will be a limit on the data that can
    be stored in a given variable. As all the computers have limited amount of data
    that they can store, we use variables with different sizes so that there won''t
    be memory wastage.


    The sizes of the basic data types in C++


    | Category | Type | Minimum Size |


    | Boolean | bool | 1 byte |


    | character | char | 1 byte |


    |  | wchar_t | 1 byte |


    |  | char16_t | 2 bytes |


    |  | char32_t | 4 bytes |


    | integer | short | 2 bytes |


    |  | int | 2 bytes |


    |  | long | 4 bytes |


    |  | long long | 8 bytes |


    | floating point | float | 4 bytes |


    |  | double | 8 bytes |


    |  | long double | 8 bytes |


    We cannot say that the size of all the variables is same on all computers. The
    sizes of variables vary from machine to machine. You can know the size of the
    variables on your machine with the help of the operator called the sizeof operator
    in c++.


    For finding the size of the variables on your computer you can use the following
    code.


