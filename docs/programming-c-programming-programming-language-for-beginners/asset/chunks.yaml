    \nYou can use the following routine for terminating a POSIX thread.\n\n```cpp\n\
    #include <pthread.h>\n\npthread_exit (status)\n```\n\nFor explicitly exiting a\
    \ thread, the `pthread_exit` is used here. The `pthread_exit()` routine is difficulty\
    \ called after a thread completing its work and when it is not required any longer.\n\
    \nIf the `main()` function ends with `pthread_exit()`, before the the threads\
