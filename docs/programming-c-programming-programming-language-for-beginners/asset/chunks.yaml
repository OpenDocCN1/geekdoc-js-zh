    \ next stage is the printing of the program, which, in this case is “Hello, World!”\
    \ This is where we use some of the code stored in iostream – a piece of code called\
    \ cout. The << that comes after the code is an operator and this one translates\
    \ to “output” which means we are telling the computer to send the code to a specified\
    \ stream. The printing “Hello, World!” is called a string, which is nothing more\
    \ than a character sequence enclosed in double quotations. Notice that the line\
    \ ends with a semi-colon – this is telling the computer that the code is finished\
    \ and if it is not used, the program cannot be compiled.\n\nLine 8 is always placed\
    \ at the end of main and it is to inform the computer that the block is completed\n\
    \nNow that you have the source code for the program, it has to be compiled using\
