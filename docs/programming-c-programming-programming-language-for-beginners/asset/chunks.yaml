- fmt: "\nWe all know that in any language, sentences are constructed following the\
    \ grammatical rules of that particular language. Take the example of the English\
    \ language where you normally end of sentences in a period. All the rules, which\
    \ govern the construction of sentences in a language, is called a syntax. Similarly,\
    \ C++ also has a syntax. Not following the syntax will simply leave your code\
    \ invalid. It is the responsibility of the compiler to see that the basic syntax\
    \ of the C++ language is followed. If you violate the basic syntax, the compiler\
    \ will compile the code and will complain the syntax violation. That issue is\
    \ called as syntax error. The C++ compilers only compile the program if there\
    \ are no syntax errors found. It will display all the errors that are found and\
    \ suggests for you to make them valid so that it could execute the code without\
    \ any errors.\n\n## Compiling your first program\n\nThere are two important things\
    \ that you should know before you can go to your first program.\n\n1. Your programs\
    \ will be written in the `.cpp` files, which will be added to your project later.\
    \ Projects are also called as workspaces or solutions. The code files and the\
    \ IDE settings will be saved to your project.\n2. You should start a new project\
    \ by creating one as there are many kinds of projects. Before starting you need\
    \ to specify the type of project you wish to work on.\n\n### What makes the C++\
    \ code?\n\nA variable is something that stores a value. It’s like a box, each\
    \ box has a name and category on it and the category is the type of item stored\
    \ in it – the name is the specific variable. Each variable has a specific type,\
    \ name and size and these govern exactly what can be stored inside of it. Before\
    \ we go any further, here is a list of the variables that you will use:\n\n* `Int`:\
    \ Whole numbers (integers)\n* `Bool`: True or False (0 or 1)\n* `Float`: Fractional\
    \ number (reals)\n* `Double`: float with twice the precision\n* `Char`: A single\
    \ ASCII character\n\n### Using Variables\n\nThe following code demonstrates how\
    \ to use them:\n\n![](images/00002.jpeg)\n\nMost of this you saw with the last\
    \ cod, the only bit you won’t have seen are lines 4 and 7 – line 4 declares the\
    \ variable, in this case, an integer. Declaring is simply telling the compiler\
    \ that we are going to use this variable and we follow that with the name of the\
    \ variable. You can call your variable whatever you like but keep it simple and\
    \ relevant and make sure it is not a reserved keyword, which already has a meaning\
    \ in C++. Start it with a lower case letter. The end of the statement is finished\
    \ with the semi-colon.\n\nLine 7 is called an assignment. This assigns a value\
    \ to the variable and the `=` is the operator – this is what does the assigning.\
    \ The value after the `=` is called a binary operator.\n\nNote that there are\
    \ no quotation marks around the `cout` statement this time. This is because, rather\
    \ than displaying the string, we are outputting the value. Compiling the program\
    \ now would print “42” on the screen.\n\nAs well as having a type a variable can\
    \ also have a prefix added to the declaration and these change how the variable\
    \ behaves. Some will change the size of the variable while others let you use\
    \ or block you from using negative numbers, while others do a completely different\
    \ job. Almost all of the will be talked about here.\n\n## Size Changers\n\nThere\
    \ are two specific prefixes that change the byte size of the variable – `short`\
    \ and `long`. The idea behind this is to allow the variable to store more vales\
    \ and bigger numbers. How big depends on the architecture of the computer that\
    \ you are using:\n\n* On a 32-bit computer `int` and `long int` are both 4 bytes\n\
    * On a 64-bit computer `int` is 4 bytes and `long int` is 8 bytes\n* On both architectures\
    \ `short int` is 2 bytes\n\nThere is nothing that dictates the size of the modifier\
    \ for those particular keywords, except:\n\n* `Short` must be equal to or smaller\
    \ than a normal variable\n* The normal variable must, in turn, be equal to or\
    \ smaller than a `long`.\n* The only variable that can take a prefix is `int`\n\
    \nEven more confusing, you can actually omit `int` and just use `long` or `short`,\
    \ for example:\n\n1. `short int s = 0;`\n2. `int i = 0;`\n3. `long int l = 0;`\n\
    5. `short s2 = 0;`\n6. `long l2 = 0;`\n\n## Sign Changers\n\nThere are two other\
    \ prefixes that can restrict the values that are stored by a type – `signed` and\
    \ `unsigned`. A signed variable can store negative and positive values, while\
    \ an unsigned variable can only take positives. \n\n## Other Prefixes\n\nThere\
    \ are some other prefixes that you can use in C++, not so common and most of which\
    \ we are not going to use and will not cover in this book. There are two very\
    \ useful ones though – `const` and `static`. The former are constant, never changing\
    \ their value and the latter keeps the value of the variable the same but only\
    \ in between function calls; that’s a topic for later on.\n\n## Combining Types\n\
    \nPrefixes can be used in a chain together, so it wouldn’t be uncommon to see\
    \ something like:\n\n1. `static unsigned long int`, or\n2. `signed const char`\n\
    \nYou can put the prefixes in any order you like provided they are before the\
    \ variable type.\n\nOne more thing about variables – you can only use them in\
    \ the area that they are declared in\n\n## Enumeration in C++\n\nIn C++, an enumeration\
    \ can be defined as a user type which can contain any of the given names. The\
    \ syntax for this is given below:\n\n```cpp\nenum seasons { spring, summer, autumn,\
    \ winter };\n```\n\nA variable `s` is defined of type `seasons` within the `main()`\
    \ function and this variable is only capable of storing anyone of the four values\
    \ (spring, summer, autumn, winter). The default value of the first enumerator\
    \ is `0`, `1` for the second and so on. In this program the value of `spring`\
    \ is equal to `0`, `summer` is `1`, the value of `autumn` is `2` and the value\
    \ of `winter` is `3`.\n\nHere, there is one thing that you should keep in mind\
    \ that `spring`, `summer`, `autumn` and `winter` are not variables. The compiler\
    \ will treat them as integers. The values cannot be changed once the enumerators\
    \ are defined in program. Consider this example.\n\n### Example 1: C++ Enumeration\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nenum seasons { spring,\
    \ summer, autumn, winter };\n\nint main() {\n    seasons s;\n    s = spring;\n\
    \    cout << \"spring = \" << s << endl;\n    s = summer;\n    cout << \"summer\
    \ = \" << s << endl;\n    s = autumn;\n    cout << \"autumn = \" << s << endl;\n\
    \    s = winter;\n    cout << \"winter = \" << s << endl;\n    return 0;\n}\n\
    ```\n\nOutput:\n```\nspring = 0\nsummer = 1\nautumn = 2\nwinter = 3\n```\n\nThe\
    \ default value can be changed during the enumeration declaration and you can\
    \ give your desired value. Consider the example given below.\n\n### Example 2:\
    \ C++ Enumeration\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nenum\
    \ seasons { spring = 34, summer = 4, autumn = 9, winter = 32};\n\nint main() {\n\
    \    seasons s;\n    s = summer;\n    cout << \"summer = \" << s << endl;\n  \
    \  return 0;\n}\n```\n\nOutput:\n```\nsummer = 4\n```\n"
  raw: "We all know that in any language, sentences are constructed following the\
    \ grammatical rules of that particular language. Take the example of the English\
    \ language where you normally end of sentences in a period. All the rules, which\
    \ govern the construction of sentences in a language, is called a syntax. Similarly,\
    \ C++ also has a syntax. Not following the syntax will simply leave your code\
    \ invalid. It is the responsibility of the compiler to see that the basic syntax\
    \ of the C++ language is followed. If you violate the basic syntax, the compiler\
    \ will compile the code and will complain the syntax violation. That issue is\
    \ called as syntax error. The C++ compilers only compile the program if there\
    \ are no syntax errors found. It will display all the errors that are found and\
    \ suggests for you to make them valid so that it could execute the code without\
    \ any errors.\n\n## Compiling your first program\n\nThere are two important things\
    \ that you should know before you can go to your first program.\n\n1.  Your programs\
    \ will be written in the .cpp files, which will be added to your project later.\
    \ Projects are also called as workspaces or solutions. The code files and the\
    \ IDE settings will be saved to your project.\n\n2.  You should start a new project\
    \ by creating one as there are many kinds of projects. Before starting you need\
    \ to specify the type of project you wish to work on.\n\n    What makes the C++\
    \ code?\n\nA variable is something that stores a value. It’s like a box, each\
    \ box has a name and category on it and the category is the type of item stored\
    \ in it – the name is the specific variable. Each variable has a specific type,\
    \ name and size and these govern exactly what can be stored inside of it. Before\
    \ we go any further, here is a list of the variables that you will use:\n\n* \
    \  Int - Whole numbers (integers)\n\n*   Bool -               True or False (0\
    \ or 1)\n\n*   Float -               Fractional number (reals)\n\n*   Double -\
    \ float with twice the precision\n\n*   Char - A single ASCII character\n\nUsing\
    \ Variables\n\nThe following code demonstrates how to use them:\n\n![](images/00002.jpeg)\n\
    \nMost of this you saw with the last cod, the only bit you won’t have seen are\
    \ lines 4 and 7 – line 4 declares the variable, in this case an integer. Declaring\
    \ is simply telling the compiler that we are going to use this variable and we\
    \ follow that with the name of the variable. You can call your variable whatever\
    \ you like but keep it simple and relevant and make sure it is not a reserved\
    \ keyword, which already has a meaning in C++. Start it with a lower case letter.\
    \ The end of the statement is finished with the semi-colon.\n\nLine 7 is called\
    \ an assignment. This assigns a value to the variable and the = is the operator\
    \ – this is what does the assigning. The value after the = is called a binary\
    \ operator.\n\nNote that there are no quotation marks around the cout statement\
    \ this time. This is because, rather than displaying the string, we are outputting\
    \ the value. Compiling the program now would print “42” on the screen.\n\nAs well\
    \ as having a type a variable can also have a prefix added to the declaration\
    \ and these change how the variable behaves. Some will change the size of the\
    \ variable while others let you use or block you from using negative numbers,\
    \ while others do a completely different job. Almost all of the will be talked\
    \ about here.\n\n## Size Changers\n\nThere are two specific prefixes that change\
    \ the byte size of the variable – short and long. The idea behind this is to allow\
    \ the variable to store more vales and bigger numbers. How big depends on the\
    \ architecture of the computer that you are using:\n\n*   On a 32-bit computer\
    \ int and long int are both 4 bytes\n\n*   On a 64-bit computer int is 4 bytes\
    \ and long int is 8 bytes\n\n*   On both architectures  short int is 2 bytes\n\
    \nThere is nothing that dictates the size of the modifier for those particular\
    \ keywords, except:\n\n*   Short must be equal to or smaller than a normal variable\n\
    \n*   The normal variable must, in turn, be equal to or smaller than a long.\n\
    \n*   The only variable that can take a prefix is int\n\nEven more confusing,\
    \ you can actually omit int and just use long or short, for example:\n\n1.  short\
    \ int s = 0;\n\n2.  int i = 0;\n\n3.  long int l = 0;\n\n5.  short s2 = 0;\n\n\
    6.  long l2 = 0;\n\n## Sign Changers\n\nThere are two other prefixes that can\
    \ restrict the values that are stored by a type – signed and unsigned. A signed\
    \ variable can store negative and positive values, while an unsigned variable\
    \ can only take positives. \n\n## Other Prefixes\n\nThere are some other prefixes\
    \ that you can use in C++, not so common and most of which we are not going to\
    \ use and will not cover in this book. There are two very useful ones though –\
    \ const and static. The former are constant, never changing their value and the\
    \ latter keeps the value of the variable the same but only in between function\
    \ calls; that’s a topic for later on.\n\n## Combining Types\n\nPrefixes can be\
    \ used in a chain together, so it wouldn’t be uncommon to see something like\n\
    \n1.  static unsigned long int, or\n\n2.  signed const char\n\nYou can put the\
    \ prefixes in any order you like provided they are before the variable type.\n\
    \nOne more thing about variables – you can only use them in the area that they\
    \ are declared in\n\n## Enumeration in C++\n\nIn C++, an enumeration can be defined\
    \ as a user defined type which can contain any one of the several name to constants\
    \ (enumerators) given explicitly. The keyword enum is used for defining enumeration.\
    \ The syntax for this is given below.\n\nSyntax:\n\nenum seasons { spring, summer,\
    \ autumn, winter };\n\nThe above code is a declaration for enums. You can define\
    \ your own variables after the declaration. Now we will consider an example of\
    \ seasons where the variable of type seasons is declared and it can have any one\
    \ of the four values (summer, spring, autumn and winter). Here is an example program\
    \ in which the enumeration type is a defined and values can be assigned to the\
    \ variable of that type.\n\nExample:\n\n#include <iostream>\n\nusing namespace\
    \ std;\n\nenum seasons { spring, summer, autumn, winter };\n\nint main() {\n\n\
       seasons s;\n\n   s = autumn;   // Correct\n\n   s = rainy;    // Error\n\n\
       return 0;\n\n}\n\nIn this program, there are four enumerators (spring, summer,\
    \ autumn and winter) declared as the enum type seasons. A variable s is defined\
    \ of the type seasons within the main () function and this variable is only capable\
    \ of storing anyone of the given four variables (spring, summer, autumn and winter)\
    \ and not others.\n\nThe default value of the first enumerator is 0, 1 for the\
    \ second and so on. In this program the value of spring is equal to 0 and summer\
    \ is 1 and the value of autumn is 2 and the value of winter is 3\\.\n\nHere, there\
    \ is one thing that you should keep in mind is that spring, summer, autumn and\
    \ winter are not variables. The compiler will treat them as integers. The values\
    \ cannot be changed once the enumerators are defined in program. Consider this\
    \ example.\n\nExample 1: C++ Enumeration\n\n#include <iostream>\n\nusing namespace\
    \ std;\n\nenum seasons { spring, summer, autumn, winter };\n\nint main() {\n\n\
       seasons s;\n\n   s = spring;\n\n   cout >> \"spring = \" >> s >> endl;\n\n\
       s = summer;\n\n   cout >> \"summer = \" >> s >> endl;\n\n   s = autumn;\n\n\
       cout >> \"autumn = \" >> s >> endl;\n\n   s = winter;\n\n   cout >> \"winter\
    \ = \" >> s >> endl;\n\n   return 0;\n\n}\n\nOutput\n\nspring = 0\n\nsummer =\
    \ 1\n\nautumn = 2\n\nwinter = 3\n\nThe default value can be changed during the\
    \ enumeration declaration and you can give your desired value. Consider the example\
    \ given below.\n\nExample 2: C++ Enumeration\n\n#include <iostream>\n\nusing namespace\
    \ std;\n\nenum seasons { spring = 34, summer = 4, autumn = 9, winter = 32};\n\n\
    int main() {\n\n   seasons s;\n\n   s = summer;\n\n   cout << \"summer = \" <<\
    \ s << endl;\n\n   return 0;\n\n}\n\nOutput\n\nsummer = 4\n\nIn this program,\
    \ the integer value given by the enumeration is different from the default value.\n\
    \n#  Chapter 3: Expanding ‘Hello, World!’"
