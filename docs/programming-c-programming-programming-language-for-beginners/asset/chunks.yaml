    \n嵌套循环的示例：\n\n![](img/00060.gif)\n\n上面的程序将显示：\n\n![](img/00061.jpeg)\n\n## do-while\
    \ 循环\n\n`do-while` 循环与 `while` 循环相似，仅有一处不同。如果 `while` 循环中的条件不满足，我们知道它不会执行循环。但如果我们希望代码即使条件不满足的情况下至少运行一次，我们可以利用\
    \ `C++` 中的 `do-while` 循环。使用该循环即使在条件不满足也会执行一次代码。下面的示例展示了 `do-while` 循环。\n\n![](img/00062.jpeg)\n\
    \n## for 循环\n\n`for` 循环是 `C++` 中应用广泛的循环语句。如果你知道要迭代多少次，这是一个完美的选择。它易于使用，因为它允许用户在每次迭代后更改变量。这用起来非常简单，因为你可以在同一个地方一次性声明所有内容。\n\
    \n这是一个 `for` 循环的简单示例。\n\n示例 1：\n\n![](img/00063.jpeg)\n\n上述代码的输出为：\n\n![](img/00064.jpeg)\n\
    \n示例 2：\n\n![](img/00065.gif)\n\n输出：\n\n![](img/00066.jpeg)\n\n## Break and continue\n\
    \n在之前的示例中我们已经见过 `break` 语句。在这里我们将 `break` 语句与 `continue` 语句一起使用。我们知道 `break` 语句可以终止该语句以及\
    \ `while` 循环和 `do while` 循环等循环语句。但当你函数末尾的 `switch` 语句使用它时，它表示该 case 已完成或结束。这是一个显示\
    \ `switch` 和 `break` 结合的示例。\n\n示例：\n\n![](img/00067.jpeg)\n\n当我们在循环中使用 `break`\
    \ 语句时，可以提前终止循环。下面的示例将向你展示如何操作。\n\n![](img/00068.jpeg)\n\n在上面的程序中，用户可以输入最多 40 个字符。如果用户按下回车键，循环就可以终止。通过按下回车键，用户可以选择提前终止循环。\n\
    \n### Continue 语句\n\n在某些情况下，你需要比通常时间更早地回到循环开头。这对于跳过该迭代循环的剩余部分非常有用。下面的示例展示了 `continue`\
    \ 语句的使用。\n\n![](img/00069.jpeg)\n\n在上面的程序中，我们在 `for` 循环中使用了 `continue` 语句，它将打印\
    \ 0 到 19 之间所有不能被 4 整除的数字。\n\n## 使用 continue 和 break\n\n通常不建议将 `continue` 与 `break`\
    \ 配对使用。因为这会导致程序代码执行流出现偏差。但如果使用得当，`continue` 和 `break` 的组合被证明是高效的。这里有一个显示的小示例。\n\
    \n![](img/00070.jpeg)\n\n## 随机数生成\n\n某些程序需要生成随机数。除非你给计算机一段特定的代码来执行，否则计算机无法自己生成随机数。这些随机数特别用于与统计和游戏相关的程序。像在线扑克或骰子游戏等游戏使用随机数生成算法来生成随机数。\n\
    \n如果一个游戏为每个玩家不断生成相同的数字，会有多趣呢？对于像计算机这种只知道真或假值的机器，它们无法自己生成这些随机数。对于此类情况，我们使用伪随机数生成算法。在这里，计算机将获取一个实际上是非随机的数字，被称为\
    \ `seed`（种子），并执行数学运算将给定的 `seed` 转换为一个看似随机的另一个数字。\n\n高效的随机数生成器将不断执行此过程，并生成一个与 `seed`\
    \ 完全无关的数字。这些随机数也用于 ATM 机的安全目的。\n\n生成伪随机数并不困难。在这里你将通过下面的示例理解它。该程序生成了 100 个伪随机数。\n\
    \n![](img/00071.jpeg)\n\n输出\n\n![](img/00072.jpeg)\n\n你可以从上面的输出看到，所有的数字都是随机的，它们之间没有关系。如果有任何关系，那也是随机的。\n\
    \n你实际上可以使用内置的伪随机数生成器在 `C++` 中生成随机数。在这里，你将利用两个函数：`srand()` 和 `rand()`。\n\n`srand()`\
    \ 将设置初始值，换句话说是 `seed` 值。而 `rand()` 获取 `srand()` 的值并基于 `srand()` 值开始生成随机数。你可以通过下面的示例更好地理解它。\n\
    \n![](img/00073.jpeg)\n\n这将生成 100 个随机数\n\n![](img/00074.jpeg)\n\n关于生成的随机数，你可以看到没有数字小于给定的\
    \ `srand()` 值。这是因为该值被视为基准，其他数字都是从它生成的。\n\n# 第 8 章：存储类\n\n在给定的 `C++` 程序中，由以下指定符定义的函数变量的作用域和生命周期为：\n\
    \n- `auto`\n- `static`\n- `register`\n- `extern`\n\n## auto 存储类\n\n对于所有局部变量，默认存储类都是\
    \ `auto`。\n\n示例：\n\n```cpp\nint month;\nauto month;\n```\n\n## register 存储类\n\n\
    如果你希望定义局部变量并将它们存储在 RAM 而不是内存中，可以使用 `register`。\n\n语法：\n```cpp\nregister int miles;\n\
    ```\n你应该记住，当你定义一个寄存器时，并不意味着该变量存储在寄存器中。\n\n## Static 类\n\n与其每次进入和离开作用域时都创建和销毁局部变量，`static`\
    \ 存储类告诉编译器在其生命周期内存储局部变量。因此，如果你希望局部变量在函数调用期间保持其值，你应该将这些局部变量设为 `static`。\n\n`static`\
    \ 修饰符不仅限于局部变量，也可以应用于全局变量。之后，该变量的作用域将被限制在声明该变量的文件中。\n\n当你在类的成员上使用 `static` 时，该成员的唯一副本将由该类的所有对象共享。这是一个示例。\n\
    \n示例：\n\n```cpp\n#include <iostream>\n\n// 函数声明\nvoid func(void);\n\nstatic int\
    \ count = 10; /* 全局变量 */\n\nmain()\n{\n    while(count--)\n    {\n        func();\n\
    \    }\n    return 0;\n}\n\n// 函数定义\nvoid func( void )\n{\n    static int i =\
    \ 5; // 局部静态变量\n    i++;\n    std::cout << \"i is \" << i ;\n    std::cout <<\
    \ \" and count is \" << count << std::endl;\n}\n```\n\n当你编译并执行上述代码时，将产生以下输出。\n\
    \ni is 6 and count is 9\ni is 7 and count is 8\ni is 8 and count is 7\ni is 9\
    \ and count is 6\ni is 10 and count is 5\ni is 11 and count is 4\ni is 12 and\
    \ count is 3\ni is 13 and count is 2\ni is 14 and count is 1\ni is 15 and count\
    \ is 0\n\n"
- fmt: "\n## The extern Storage Class\n\nThere are some global variables which are\
    \ visible to all of the program files. The `extern` storage class can be used\
    \ for giving the reference of these global variables which are visible to the\
    \ program files. You cannot initialise the variable using the `extern` because\
    \ it will only point debatable name to a predefined storage location.\n\nIn cases\
    \ where you have more than one files and you define a function or a global variable\
    \ which other files can use, the `extern` where do you stay in a different file\
    \ for giving the reference of The function or variable. In simple words, we use\
    \ the `extern` for declaring a function or a global variables that is present\
    \ in another file.\n\nIn cases where multiple files share the same functions or\
    \ global variables, the `extern` modifier is used. Here is an example program.\n\
    \n### Example:\n\nFirst File: main.cpp\n\n```cpp\n#include <iostream>\n\nint count\
    \ ;\n\nextern void write_extern();\n\nmain()\n{\n  count = 5;\n  write_extern();\n\
    }\n```\n\nSecond File: support.cpp\n\n```cpp\n#include <iostream>\n\nextern int\
    \ count;\n\nvoid write_extern(void)\n{\n  std::cout << \"Count is \" << count\
    \ << std::endl;\n}\n```\n\nHere, in this program the `count` is declared in another\
    \ file using the `extern` keyword. Now if you combine both of these files as given\
    \ below.\n\n```bash\n$g++ main.cpp support.cpp -o write\n```\n\nA right executable\
    \ program will be produced. Now try to execute it and check the result as given\
    \ below.\n\n```bash\n./write\n5\n```\n\n# Chapter 9: Arrays\n\nAn array is nothing\
    \ more than a list of variables, all grouped together because they share common\
    \ uses. It’s more a way of keeping everything neat and tidy, as you can see from\
    \ the following code:\n\n```cpp\nint a[5]\n```\n\nIt looks like a standard variable\
    \ but note the use of square brackets. These brackets contain the size of the\
    \ array that you want in your declaration, or the number of variables, in this\
    \ case, 5 integer variables. Arrays can be whatever size you want them to be,\
    \ provided your computer has the RAM to take it but they can only have one type\
    \ of variable in them at any one time. \n\nWhen you want to access a certain variable,\
    \ you simply put the number inside the square brackets. Just keep in mind that,\
    \ when C++ labels variables, or anything, it starts at 0 and not 1. This does\
    \ make a kind of sense, when you consider how a computer understands numbers.\
    \ If your array had 8 items in it and you started it with the number 1, your computer\
    \ can only read the first 7 places (Binary – 1-7). You could let it use the 0\
    \ as well but then 0 would be the first variable. The following code shows how\
    \ you would handle accessing the variable that is before the first one in your\
    \ list:\n\n![](images/00075.jpeg)\n\nOne thing you should keep in mind is that\
    \ you should not try to access a variable that is non-existent, for example, the\
    \ 9th variable in an array that has 6 places or that hast actually had a variable\
    \ assigned. In this case you would get what is known as a “garbage” Value since\
    \ what the computer returns will be just that – garbage.\n\nIn the first case,\
    \ you would get a segmentation fault, called as such because the computer is trying\
    \ to get into a segment of memory that it isn’t allowed to get into. This may\
    \ result in the program terminating unexpectedly, couple with an error report.\
    \ To avoid any of this happening, get into the practice of initializing every\
    \ place in the array before you begin. As with a normal variable, it would look\
    \ something like this:\n\n```cpp\nint a[5] = { 0, 0, 0, 0, 0 };\n```\n\nImportant\
    \ – note the curly brackets. Each item that is inside these brackets, marked off\
    \ with a comma between them, is assigned to a specific variable in the array.\
    \ The first one is set to the value that is first inside the brackets, the second\
    \ to the second, and so on. If the array is not filled, every unassigned variable\
    \ will come back as 0:\n\n```cpp\nint a[5] = { 1 };\n```\n\nYou have declared\
    \ that there will be 5 variables but only specified 1 so the others will be shown\
    \ as 0.\n\nOne of the most common uses for an array is to show a list, maybe ages\
    \ in a group, or, as I will show you in a while, using them to co-ordinate spaces\
    \ in big tables and maps.\n\nThe array above is known as a one-dimensional array.\
    \ This is useful for lists but what about maps? In this case, you would need a\
    \ two-dimensional array and the easiest way to do that is simply to add a second\
    \ set of square brackets:\n\n```cpp\nint array[4][5];\n```\n\nSo, the first dimension\
    \ shows 4 integers and the second is 5 integers. Thinking in terms of arrays as\
    \ a physical map, we could say that this one is 4 X 5 or it could be 5 X 4. Accessing\
    \ the array is the same as accessing the one-dimensional array except for the\
    \ number of square brackets we are using:\n\n```cpp\ncout << array[0][1];\n```\n\
    \nIn the same way that you do a one-dimensional array, you can mass define a t\
    \ dimensional array – all you do is add in a second set of curly brackets:\n\n\
    ```cpp\nint array[2][2] = { {0, 0}, {1, 1} };\n```\n\nThat isn’t as complicated\
    \ as it looks – All it is doing is setting row 1 as 0, 0 and row 2 as 1, 1. So\
    \ long as you remember to pair the brackets, it will all come together. If you\
    \ wanted to iterate through the 2-dimensional array, you would simply put two\
    \ loops inside each other:\n\n![](images/0076.gif)\n\n# Chapter 10: Classes objects\
    \ interfaces\n\n## Classes and Objects\n\nThe main purpose of designing C++ is\
    \ to add the concepts of object-oriented programming in C language. In object\
    \ oriented programming, classes make the central feature. These classes are called\
    \ as the user-defined types.\n\nA class can be considered as a neat package that\
    \ combines the data presentation and manipulating methods for that data. The form\
    \ of an object is specified by a class. The functions and the data inside a class\
    \ form the members of the class.\n\n## Encapsulation\n\nEvery program in C++ will\
    \ have the following two fundamental elements.\n\n*   Program statements (code):\
    \ Program statements are the part of the program which is used to perform specific\
    \ actions. These are called as functions.\n\n*   Program data: Data can be considered\
    \ as the information of the given program which is affected by the functions in\
    \ that program.\n"
