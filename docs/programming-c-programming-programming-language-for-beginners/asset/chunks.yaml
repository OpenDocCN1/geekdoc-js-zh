    # Introduction


    C++ is perhaps one of the most formidable of all the computer languages but, with
    the right level of enthusiasm, and the right attitude, you can tame it and you
    can make it work for you. If you have already dabbled in the word of computer
    programming then you will already have heard of C++ and you will no doubt have
    heard people talking about how hard it is to learn, how you should never choose
    it as your first foray into learning computer-programming language.


    Both of those statements are wrong. C++ is not all that difficult to learn once
    you understand the basics and it should absolutely be the first one you choose
    to get started on your journey to becoming a computer programmer. Yes, you are
    going to find some things that are difficult but there’s no fun in learning something
    that is so easy you can do it with your eyes shut. You need a challenge for it
    to sink in and, the more challenging the language is, the easier it will be to
    learn. 


    There are other, much easier languages for you to start on, but none of them has
    the power or the flexibility of C++. To be fair, most operating systems, compilers,
    apps, drivers and a lot of other software are all written in C++, so why not make
    it your first port of call in learning a new computer programming language.


    I’ll teach you to be a programmer in less than one day!


    # Chapter 1 - What is C++?


    ## Introduction to programming languages


    As you already know, the program is nothing but a set of instructions. These instructions
    are executed by the hardware that is the physical computer machinery. Though the
    modern computers are fast, they have their own limitations. Computers can only
    understand a set of instructions given in their native language. For this you
    should understand the concepts of machine language, assembly language and high-level
    languages.


    ## Machine language


    Though the computers are very advanced machines, they cannot understand languages
    like C++ directly. A computer only understands 0s and 1s. They are called bits.
    And they can only understand instructions given in the binary format. Every set
    of instructions that we give to sleep you are translated into a set of instructions
    that tell the processor to do a particular job. You should understand that different
    types of processors have different types of instruction sets. For example, the
    Pentium processors will only understand their own instructions set. It is a similar
    case with Macintosh. In the very beginning, programmers had to write their instructions
    in the binary language. It was very time-consuming and difficult. Luckily, we
    don''t have to go through all of that.


    ## Assembly language


    As the machine language is very hard to deal with, a new language called the assembly
    language was invented. Here every instruction is given a short name and the variables
    are replaced by names and not by binary digits making it easy for a programmer
    to write code. You may ask that how you can understand and assembly language.
    It cannot. The assembly language will be converted into machine language with
    the help of an assembler. You should remember that each CPU has its own assembly
    language. So, the assembly language of a CPU cannot be run on a different CPU.
    Even assembly language has got its own drawbacks. They require large sets of instructions
    even for simple tasks.


