    ## Relational operators (comparisons)


    The relational operators are used for comparison between variables. There are
    a total of six relational operators in C++. They are given in the table below.


    | Operator | Symbol | Form | Operation |

    | :--- | :--- | :--- | :--- |

    | Greater than | `>` | `x > y` | true if `x` is greater than `y`, false otherwise
    |

    | Less than | `<` | `x < y` | true if `x` is less than `y`, false otherwise |

    | Greater than or equals | `>=` | `x >= y` | true if `x` is greater than or equal
    to `y`, false otherwise |

    | Less than or equals | `<=` | `x <= y` | true if `x` is less than or equal to
    `y`, false otherwise |

    | Equality | `==` | `x == y` | true if `x` equals `y`, false otherwise |

    | Inequality | `!=` | `x != y` | true if `x` does not equal `y`, false otherwise
    |


